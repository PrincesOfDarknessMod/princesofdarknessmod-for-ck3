l_spanish:

 trait_predatortype_farmer:0 "Granjero"
 trait_predatortype_farmer_desc:0 "Este vampiro prefiere alimentarse de animales".
 
 trait_predatortype_bloodleech:0 "Sanguijuela"
 trait_predatortype_bloodleech_desc:0 "¡Este vampiro prefiere alimentarse de la sangre de otros vampiros!"
 
 trait_predatortype_phlebotomist:0 "Flebotomista"
 trait_predatortype_phlebotomist_desc:0 "Este vampiro adquiere vitae bajo la apariencia de un médico que realiza sangrías."
 
 trait_predatortype_bedlamite:0 "Bedlamita"
 trait_predatortype_bedlamite_desc:0 "Este vampiro se alimenta de los locos. Pueden o no estar también locos".
 
 trait_predatortype_cenobite:0 "Cenobita"
 trait_predatortype_cenobite_desc:0 "Este vampiro tiene una manada en una institución religiosa como un monasterio."
 
 trait_predatortype_alleycat:0 "Gato callejero"
 trait_predatortype_alleycat_desc:0 "Este vampiro acecha y ataca violentamente a los mortales para conseguir la sangre. Es un enfoque vulgar".
 
 trait_predatortype_cauchemar:0 "Pesadilla"
 trait_predatortype_cauchemar_desc:0 "Este vampiro se alimenta principalmente de presas dormidas".
 
 trait_predatortype_familias:0 "Familiares"
 trait_predatortype_familias_desc:0 "Este vampiro se alimenta casi exclusivamente de una dinastía familiar concreta. Puede que incluso estén emparentados con la familia, al menos eso es lo que cree la familia".
 
 trait_predatortype_footpad:0 "Pies"
 trait_predatortype_footpad_desc:0 "Este lameculos corre con los bajos fondos de la sociedad, tomando la sangre de los empobrecidos. Si desaparecen, las autoridades no muestran interés".
 
 trait_predatortype_consensualist:0 "Consensualista"
 trait_predatortype_consensualist_desc:0 "Este vampiro se alimenta de los dispuestos. Esto complica enormemente la Mascarada".
 
 trait_predatortype_cultist:0 "Cultista"
 trait_predatortype_cultist_desc:0 "Este vampiro dirige un culto a la sangre, como en la antigüedad. Los kinesiólogos adoran y se ofrecen libremente a este dios de la sangre".
 
 trait_predatortype_siren:0 "Sirena"
 trait_predatortype_siren_desc:0 "Este vampiro seduce a los amantes para drenar su sangre a través del beso".
 
 trait_predatortype_gentry:0 "Alta burguesía"
 trait_predatortype_gentry_desc:0 "Este vampiro tiene una posición de cierto estatus en la sociedad mortal.  Utiliza ese estatus para cazar a los ricos y poderosos.  Nadie creerá que alguien de tal refinamiento es un monstruo".
 
 trait_predatortype_graverobber:0 "Ladrón de tumbas"
 trait_predatortype_graverobber_desc:0 "Este vampiro puede encontrarse merodeando por cementerios y criptas en busca de cadáveres frescos nuestros dolientes. Pueden obtener susetancia de los cadáveres recientes".
 
 trait_predatortype_extortionist:0 "Extorsionador"
 trait_predatortype_extortionist_desc:0 "Este vampiro obliga a sus víctimas a sangrar por ellos. Ostensiblemente, el extorsionista adquiere sangre a cambio de servicios como la seguridad o la vigilancia, pero tantas veces como la necesidad de protección es real, es igualmente una ficción diseñada para que el trato sea aceptable."
 

