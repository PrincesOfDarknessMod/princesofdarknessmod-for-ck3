l_spanish:
 trait_unusual:0 "Inusual"
 trait_unusual_desc:0 "Hay algo raro en esta persona".

 trait_vampire:0 "Vampiro"
 trait_vampire_desc:0 "Este personaje es uno de los muertos vivientes".
 
 trait_diablerist:0 "[Diablerista|E]"
 trait_diablerist_desc:0 "Este personaje ha cometido $game_concept_diablerie$ al consumir la sangre del corazón de otro vampiro, devorando el alma."
 
 trait_infernalist:0 "Infernalista"
 trait_infernalist_desc:0 "Este personaje ha hecho un pacto con un poder demoníaco para obtener inversiones infernales."
 
 trait_ghoul:0 "Ghoul"
 trait_ghoul_desc:0 "Un mortal que ha consumido sangre de vampiro".
 
 trait_szlachta:0 "Szlachta"
 trait_szlachta_desc:0 "Un mortal que ha consumido sangre de vampiro y luego ha sido transformado por la [disciplina|E] de Vicisitud."
 
 trait_mortal:0 "Mortal"
 trait_mortal_desc:0 "Un ser humano corriente. Vidas tan cortas..."
 
 trait_werewolf:0 "Hombre lobo"
 trait_werewolf_desc:0 "Una criatura sobrenatural que cambia de forma. Se llaman a sí mismos 'Garou'".
 
 trait_mage:0 "Mago"
 trait_mage_desc:0 "Humanos con avatares despiertos que les permiten manejar la verdadera magia y alterar el tejido de la realidad."
 
 trait_wraith:0 "Espectro"
 trait_wraith_desc:0 "Un alma muerta arrastrada de vuelta al mundo mortal por magias oscuras o por un apego a algo que dejaron atrás."
 
 trait_wight:0 "Espectro"
 trait_wight_desc:0 "Un wight es un vampiro que ha perdido la totalidad de su moral. Son, a todos los efectos, la Bestia en su interior. Un personaje que ha caído en el Wassail no puede salvarse ni volver a jugar."
 
 trait_assamite:0 "Banu Haqim"
 trait_assamite_desc:0 "Basados en su fortaleza oculta en Oriente Medio, tradicionalmente son vistos por los Kindred occidentales como peligrosos asesinos y diabolistas."
 
 trait_assamite_laibon:0 "Shango"
 trait_assamite_laibon_desc:0 "Uno de los legados de Laibon. Adoradores de Shango, el dios yoruba de las tormentas, los Shango son quizás el legado más civilizado de Laibon junto a los aristocráticos Guruhi."
 
 trait_baali:0 "Baali"
 trait_baali_desc:0 "Línea de sangre de los vampiros asociada al culto de los demonios".
 
 trait_brujah:0 "Brujah"
 trait_brujah_desc:0 "Rápidos de reflejos y siempre apasionados, han ido recuperando su posición como [Clan|E] de elevados filósofos y activistas."
 
 trait_brujah_laibon:0 "Osebo"
 trait_brujah_laibon_desc:0 "Uno de los legados de Laibon. Los guerreros de los Laibon, los Osebo toman su nombre del famoso leopardo de la leyenda de Ashanti Occidental."
 
 trait_brujah_ashirra:0 "Bay't Mushakis"
 trait_brujah_ashirra_desc:0 "Los brujah de fe islámica son conocidos como Bay't Mushakis, y muchos son hijos de la parentela de Cartago. Se extienden por el norte de África en particular, y los más jóvenes declaran la yihad y buscan castigar a los Kindred romanos que destruyeron el gran experimento."
 
 trait_cacophony:0 "Hija de Cacophony"
 trait_cacophony_desc:0 "Actualmente compuestas en su mayoría por mujeres (debido a la dificultad asociada de educar a alguien con el rango vocal de la mayoría de los varones), las Hijas practican el Melpomineo, una [disciplina|E] que permite a las Hijas invocar efectos extraños a través del canto. Son las coralistas por excelencia de los no muertos, y acoger una reunión de ellas merece un alto prestigio."
 
 trait_caitiff:0 "Caitiff"
 trait_caitiff_desc:0 "Conocidos como los sin clan, son [cainitas|E] que no pertenecen a ningún [Clan|E]."
 
 trait_cappadocian:0 "Capadocian"
 trait_cappadocian_desc:0 "Eruditos desapegados y obsesionados con los misterios de la muerte y el alma."
 
 trait_cappadocian_laibon:0 "Mla Watu"
 trait_cappadocian_laibon_desc:0 "Quizá ningún grupo de Laibon sea tan rechazado como los Mla Watu. Aunque los Laibon en su conjunto están ya alejados de su humanidad, siguen manteniendo un sano respeto por los muertos como exigen muchas costumbres africanas. Los Mla Watu, sin embargo, no se conforman con comunicarse con los antepasados muertos, sino que pretenden controlarlos, en cuerpo y alma."
 
 trait_cappadocian_ashirra:0 "Qabilat al-Mawt"
 trait_cappadocian_ashirra_desc:0 "La rama islámica de los [Clan|E] capadocios son conocidos en Oriente Medio como Qabilat al-Mawt, y se encuentran entre los más eruditos de la parentela de esas tierras. Los Qabilat al-Mawt tienen que ser cuidadosos en sus estudios de los muertos, ya que el Islam tiene a los muertos en alta estima; la profanación de los cadáveres podría atraer la atención tanto de los mortales como de los [ashirra|E], o parentela islámica organizada."
 
 trait_gangrel:0 "Gangrel"
 trait_gangrel_desc:0 "Salvajes. Primitivos, resistentes y animales".
 
 trait_gangrel_laibon:0 "Akunanse"
 trait_gangrel_laibon_desc:0 "Uno de los legados de Laibon. Toman su nombre y naturaleza de los mitos de la "araña sabia" de muchos cuentos populares africanos. Son conocidos por sus grandes conocimientos, sus sabios consejos y su carácter apolítico."
 
 trait_gangrel_ashirra:0 "Wah'Sheen"
 trait_gangrel_ashirra_desc:0 "Aunque los [ashirra|E] llaman a todos los Gangrel "Wah'Sheen", existe una línea distintiva entre ambas partes, similar a la división entre Gangrel de ciudad y de campo, aunque con una relación mucho más hostil."

 trait_gargoyle:0 "Gárgola"
 trait_gargoyle_desc:0 "Vampiros que parecen ser esculturas de piedra animadas".
 
 trait_giovanni:0 "Giovani"
 trait_giovanni_desc:0 "Tras su ascenso a la sangre, Augusto Giovani comenzó inmediatamente a abrazar a su propia familia. Al hacerlo, los Giovani se convirtieron en algo entre una línea de sangre y un culto dentro del [Clan|E] Capadocio. Reconocidos como los expertos en [nigromancia|E], los Giovani se mantuvieron ligeramente separados de la madre [Clan|E]".
 
 trait_harbingersofskulls:0 "Herederos de las calaveras"
 trait_harbingersofskulls_desc:0 "Una línea de sangre de vampiros con una palidez mortal.  Además, la piel de los Herederos se encoge para que estos [cainitas|E] parezcan esqueléticos, con miembros huesudos y rostros congelados en una inmortal sonrisa de muerte."

 trait_kiasyd:0 "Kiasyd"
 trait_kiasyd_desc:0 "Una línea de sangre de vampiros con sangre de hada que desciende de los Lasombra Marconius de Estrasburgo."
  
 trait_lasombra:0 "Lasombra"
 trait_lasombra_desc:0 "[Clan|E] Los Lasombra son darwinistas sociales, depredadores, elegantes e inhumanos."
 
 trait_lasombra_laibon:0 "Xi Dundu"
 trait_lasombra_laibon_desc:0 "Tomando su nombre de la palabra bavili que significa "sombra", los Xi Dundu procedían originalmente del Congo hasta que un rito que salió mal les obligó a abandonar sus tierras natales. Ahora tienen su hogar entre los pueblos maasai del este de África".
 
 trait_lasombra_ashirra:0 "Qabilat al-Khayal"
 trait_lasombra_ashirra_desc:0 "Los Lasombra árabes son notables entre sus homólogos islámicos en el sentido de que son uno de los pocos bay't que son mayoritariamente cristianos. El Islam se impuso en algunos lugares del [Clan|E], especialmente en Iberia, y provocó importantes rupturas en la bay't."  
 
 trait_maeghar:0 "Maeghar"
 trait_maeghar_desc:0 "Un conjunto de accidentes aislados que aparecieron cuando un [cainita|E] intentó infligir su maldición a un ser con sangre de hada. Todos los Maeghar tienen algún rasgo físico que indica su naturaleza de hada, que puede ir desde lo sutil (piel blanca como la nieve y pelo de ébano) hasta lo descarado (seis brazos)."
 
 trait_malkavian:0 "Malkavian"
 trait_malkavian_desc:0 "[Clan|E] de Kindred malditos con la locura".
 
 trait_malkavian_ashirra:0 "Bay't Majnoon"
 trait_malkavian_ashirra_desc:0 "Los Malkavian de la [ashirra|E], la Bay't Majnoon, son más respetados que los de Occidente. Muchos fueron tenidos como consejeros, guardaespaldas e incluso profetas islámicos".
 
 trait_nosferatu:0 "Nosferatu"
 trait_nosferatu_desc:0 "Cazadores. Sigiloso, fuerte y aterrador".
 
 trait_nosferatu_ashirra:0 "Bay't Mutasharid"
 trait_nosferatu_ashirra_desc:0 "Los Nosferatu de los territorios [ashirra|E] experimentaron una especie de cisma después de que el Islam se convirtiera en la fuerza dominante. Los Bay't Mutasharid fueron aquellos Nosferatu que se negaron a convertirse al Islam o a renunciar a sus antiguos papeles de cazadores y hombres del saco."
 
 trait_nosferatu_laibon:0 "Guruhi"
 trait_nosferatu_laibon_desc:0 "Tomando su nombre del dios gambiano del que dicen descender, los Guruhi se creen los amos de África, los legítimos gobernantes de sus tierras y sus gentes."
  
 trait_oldclantzimisce:0 "Viejo [Clan|E] Tzimisce"
 trait_oldclantzimisce_desc:0 "Miembros del [Clan|E] Tzimisce que no se unieron al Sabbat"
 
 trait_ravnos:0 "Ravnos"
 trait_ravnos_desc:0 "Conocidos por ser vagabundos errantes y mercachifles, los Ravnos son charlatanes que practican alegremente sus artes de engaño y robo."
 
 trait_ravnos_ashirra:0 "Bay't Mujrim"
 trait_ravnos_ashirra_desc:0 "Bay't Mujrim es el término árabe que designa al [Clan|E] de los Engañadores (Mujrim significa literalmente 'Criminal'). Ya no eran bienvenidos en el mundo islámico ya que sus vicios les llevaron a muchos enfrentamientos no deseados con los [ashirra|E]."
 
 trait_ravnos_laibon:0 "Kinyonyi"
 trait_ravnos_laibon_desc:0 "Uno de los legados de Laibon. Toman su nombre de la palabra luganda que significa "pájaro", reflejando sus tendencias a viajar constantemente, incluso más que los akunanse que buscan el conocimiento."
 
 trait_salubri:0 "Salubri"
 trait_salubri_desc:0 "El antaño poderoso [Clan|E] Salubri se ha convertido en apenas una línea de sangre tras la destrucción de su progenitor, Saulot."

 trait_salubri_ashirra:0 "Al-Amin"
 trait_salubri_ashirra_desc:0 "Los Salubri islámicos, conocidos como al-Amin (literalmente 'Los Virtuosos'), no tuvieron menos suerte que sus homólogos europeos. Durante siglos, vigilaron a los baales desde el norte de África hasta Asia, normalmente disfrazados de miembros de otros clanes."
trait_salubri_laibon:0 "Nkulu Zao"
 trait_salubri_laibon_desc:0 "Uno de los Legados menores de Laibon. Hijos de la casi extinta línea de Zao-lat, los Nkulu Zao son pocos después de que su Legado haya sido cazado durante siglos."

 trait_samedi:0 "Samedi"
 trait_samedi_desc:0 "Con origen probablemente en el Caribe, los miembros de la línea de sangre parecen parecerse a un zombi o a un cadáver. Samedi parece estar en constante estado de descomposición. Los trozos de carne podrida se desprenden de sus cuerpos con mayor frecuencia a medida que envejecen, y el olor a muerte se adhiere a ellos dondequiera que deambulen."
 
 trait_setite:0 "Setite"
 trait_setite_desc:0 "El [Clan|E] de los vampiros que creen que su fundador fue el dios egipcio Set. La creencia ortodoxa setita dicta que Set volverá un día a gobernar o consumir el mundo, y los devotos setitas preparan el camino para su resurrección."
 
 trait_setite_raktasadhus:0 "Daitya"
 trait_setite_raktasadhus_desc:0 "Los Daitya son una variante herética, cuyo fundador viajó de Egipto a la India en busca de antiguos conocimientos místicos y a la caza de los Hijos de Osiris que, según se rumorea, han huido al Himalaya."

 trait_setite_naktanchara:0 "Naktanchara"
 trait_setite_naktanchara_desc:0 "El linaje Naktanchara de la línea de sangre es rechazado desde que se convirtieron al budismo y empezaron a desafiar el sistema de castas de los Kindred de la India."

 trait_toreador:0 "Toreador"
 trait_toreador_desc:0 "[Clan|E] de vampiros conocidos por ser unos de los más bellos, sensuales, seductores, emocionales y glamurosos del Kindred."
 
 trait_toreador_ashirra:0 "Ray'een al-Fen"
 trait_toreador_ashirra_desc:0 "Los Toreador islámicos son los Ray'een al-Fen, comúnmente apodados como Escribas, ya que la mayoría favorecen a los calígrafos, escritores y arquitectos."
 
 trait_toreador_laibon:0 "Ishtarri"
 trait_toreador_laibon_desc:0 "Uno de los legados de los Laibon. Los Ishtarri afirman descender de la diosa babilónica Ishtar, pero actualmente carecen de la conexión personal con África que tienen los Guruhi similares."
  
 trait_tremere:0 "Tremere"
 trait_tremere_desc:0 "[Clan|E] de eruditos, centrados en la [hechicería de sangre|E]. Son vilipendiados por su supuesto ataque a los [antediluvianos|E] Saulot, y temidos por la fuerte disciplina y cohesión del [Clan|E], inédita en otros lugares de la sociedad [cainita|E]"
 
 trait_truebrujah:0 "Verdadero Brujah"
 trait_truebrujah_desc:0 "Una línea de sangre de [Clan|E] Brujah que afirma ser descendiente del fundador original [antediluviano|E] del linaje y no de su [diablerista|E]/childe Troile. Los Verdaderos Brujah destacan por su comportamiento tranquilo y desprendido".
 
 trait_tzimisce:0 "Tzimisce"
 trait_tzimisce_desc:0 "[Clan|E] de etiqueta feudal y sádico modelador de carne".
 
 trait_tzimisce_laibon:0 "Nagloper"
 trait_tzimisce_laibon_desc:0 "Tomando su nombre de la palabra khoikhoin que significa 'hechicero malvado', los Nagloper hacen honor a su reputación como los más horripilantes de los Laibon. Permiten que la Bestia los domine, llevándolos a causar cualquier libertinaje que uno pueda imaginar, y algunos sólo se creían posibles en las pesadillas."
  
 trait_ventrue:0 "Ventrue"
 trait_ventrue_desc:0 "Señores. Regio, imponente y aristocrático".
 
 trait_ventrue_ashirra:0 "EL Hijazi"
 trait_ventrue_ashirra_desc:0 "Los El Hijazi son un linaje distintivo de Ventrue. A diferencia del cuerpo principal del [Clan|E] -que tradicionalmente se asocia con los romanos o los europeos cristianos-, la línea de sangre de El Hijazi afirma descender de linajes nativos árabes. Han adoptado el Islam y son aceptados como parte del [ashirra|E], pero también son relativamente pocos en número."
 
 trait_ventrue_raktasadhus:0 "Danava"
 trait_ventrue_raktasadhus_desc:0 "Los Danava son una línea de sangre del [Clan|E] Ventrue que se centra en el subcontinente indio. Sabios regios, ascetas y sacerdotes, los Danava se encuentran entre los vampiros más respetados dentro del sistema de castas de los condenados de la India."
  
 trait_kueijin:0 "Kuei-Jin"
 trait_kueijin_desc:0 "Se dice que los Kuei-jin son los descendientes corrompidos de los Wan Xian, los "Diez Mil Héroes" elegidos por el Augusto Personaje de Jade para guiar y proteger el universo en la historia antigua. Los Wan Xian fueron elegidos originalmente mediante pruebas de habilidad y valor, y se alimentaban del chi ambiental del universo. Sin embargo, cayeron en desgracia, aprendiendo a alimentarse del chi de los seres vivos y corrompiendo las pruebas de valía". 
  trait_animalism:0 "Animalismo"
 trait_animalism_desc:0 "Una [disciplina|E] que acerca al vampiro a su naturaleza animal. Esto no sólo les permite comunicarse con las criaturas de la naturaleza y ganar dominio sobre ellas, sino que les da influencia sobre la propia Bestia.|nEl animalismo es particularmente común entre los clanes más alejados de la humanidad, aunque muchos de sus poderes se dirigen específicamente a las Bestias de los mortales y [cainitas|E]."
 
 trait_animalismadvanced:0 "Animalismo avanzado"
 trait_animalismadvanced_desc:0 "Una [disciplina|E] que acerca al vampiro a su naturaleza animal. Esto no sólo les permite comunicarse con las criaturas de la naturaleza y ganar dominio sobre ellas, sino que les da influencia sobre la propia Bestia.|nEl animalismo es particularmente común entre los clanes más alejados de la humanidad, aunque muchos de sus poderes se dirigen específicamente a las Bestias de los mortales y [cainitas|E]."
 
 trait_auspex:0 "Auspex"
 trait_auspex_desc:0 "Auspex es una [disciplina|E] que otorga a los vampiros sentidos sobrenaturales.\NEs una de las [disciplinas|E] más comunes y favorecidas entre los [cainitas|E] debido a su versatilidad y utilidad general en casi todas las facetas de la existencia vampírica. Además, se sabe que otorga cierto grado de capacidad oracular, en particular al alertar a un [cainita|E] del peligro, incluso si está en [torpor|E]."
 
 trait_auspexadvanced:0 "Auspex avanzado"
 trait_auspexadvanced_desc:0 "Auspex es una [disciplina|E] que otorga a los vampiros sentidos sobrenaturales.\NEs una de las [disciplinas|E] más comunes y favorecidas entre los [cainitas|E] debido a su versatilidad y utilidad general en casi todas las facetas de la existencia vampírica. Además, se sabe que otorga cierto grado de capacidad oracular, sobre todo al alertar a un [cainita|E] del peligro, aunque esté en [torpor|E]."
 
 trait_celerity:0 "Celeridad"
 trait_celerity_desc:0 "La Celeridad es una [disciplina|E] que otorga a los vampiros una rapidez y unos reflejos sobrenaturales.\NPara algunos [cainitas|E], el mundo mortal se mueve a cámara lenta. En momentos de estrés, los vampiros con Celeridad pueden moverse con una velocidad asombrosa, convirtiéndose en borrones de movimiento para cualquiera, mortal o inmortal, que no posea la [disciplina|E]."
 
 trait_celerityadvanced:0 "Celeridad avanzada"
 trait_celerityadvanced_desc:0 "La Celeridad es una [disciplina|E] que otorga a los vampiros una rapidez y unos reflejos sobrenaturales.\NPara algunos [cainitas|E], el mundo mortal se mueve a cámara lenta. En momentos de estrés, los vampiros con Celeridad pueden moverse con una velocidad asombrosa, convirtiéndose en borrones de movimiento para cualquiera, mortal o inmortal, que no posea la [disciplina|E]." 
 
 trait_chimerstry:0 "Quimerstría"
 trait_chimerstry_desc:0 "La quimersería es la marca [disciplina|E] de los Ravnos que conjura las ilusiones a la existencia. Dichas imágenes fantasmales son tan reales como la habilidad del [cainita|E] permite."
 
 trait_chimerstryadvanced:0 "Quimersería avanzada"
 trait_chimerstryadvanced_desc:0 "La quimersería es la marca [disciplina|E] de los Ravnos que conjura las ilusiones a la existencia. Dichas imágenes fantasmales son tan reales como la habilidad del [cainita|E] permite."
 
 trait_daimoinon:0 "Daimoinon"
 trait_daimoinon_desc:0 "El daimonion es una [disciplina|E] diabólica que sólo practican los baali y los peores vampiros infernalistas. Su poder es el del mismísimo Diablo, y mediante el uso del Daimonion los Baali recurren a las fuerzas del Infierno y sus demonios para desmoralizar y paralizar a sus enemigos."

 trait_daimoinonadvanced:0 "Daimoinon avanzado" 
 trait_daimoinonadvanced_desc:0 "El Daimonion es una [disciplina|E] diabólica que sólo practican los Baali y los peores vampiros infernalistas. Su poder es el del mismísimo Diablo, y mediante el uso del Daimonion los Baali recurren a las fuerzas del Infierno y sus demonios para desmoralizar y paralizar a sus enemigos."  

 trait_dementation:0 "Dementación"
 trait_dementation_desc:0 "La dementación es una [disciplina|E] ampliamente conocida como el sello distintivo de los Malkavian.\nLa dementación recurre a la propia locura del vampiro y la utiliza para lograr profundas percepciones o infligir locura a otros. Tales poderes son una de las principales razones por las que los Malkavian [Clan|E] suelen ser considerados tanto perspicaces como muy peligrosos."
 
 trait_dementationadvanced:0 "Dementación avanzada"
 trait_dementationadvanced_desc:0 "La dementación es una [disciplina|E] ampliamente conocida como el sello distintivo de los Malkavian.\NLa dementación se basa en la propia locura del vampiro y la utiliza para lograr una profunda perspicacia o infligir locura a otros. Tales poderes son una de las principales razones por las que los Malkavian [Clan|E] suelen ser considerados tanto perspicaces como muy peligrosos."
 
 trait_dominate:0 "Dominar"
  trait_dominate_desc:0 "Dominar es una [disciplina|E] que abruma la mente de otra persona con la voluntad del vampiro, obligando a las víctimas a pensar o actuar según el decreto del vampiro."
 
 trait_dominateadvanced:0 "Dominación avanzada"
 trait_dominateadvanced_desc:0 "Dominar es una [disciplina|E] que abruma la mente de otra persona con la voluntad del vampiro, obligando a las víctimas a pensar o actuar según el decreto del vampiro.\NEl aspecto de Dominar de la maldición del vampirismo es que devalúa los fundamentos de la verdadera amistad o intimidad. Dominar también embota la empatía del usuario, y uno debe tener cuidado de no acostumbrarse a estar rodeado de aduladores en todo momento."
 
 trait_fortitude:0 "Fortaleza"
 trait_fortitude_desc:0 "La fortaleza es una [disciplina|E] que otorga a los Kindred una dureza sobrenatural, hasta el punto de resistir el fuego y la luz del sol.\NLa fortaleza también puede dar protección contra la manipulación y el control como de las [disciplinas|E] de Dominar y Presencia."
 
 trait_flight:0 "Vuelo"
 trait_flight_desc:0 "El vuelo es una [disciplina|E] sobrenatural, exclusiva de la línea de sangre de las Gárgolas, que permite a estos vampiros volar.\NDemasiado pesadas para volar por medios naturales, las Gárgolas pétreas deben utilizar esta [disciplina|E]; otros [cainitas|E] capaces de volar (transformándose en murciélago o niebla usando Protean, por ejemplo) no lo necesitan y no pueden aprenderlo."
 
 trait_flightadvanced:0 "Vuelo avanzado"
 trait_flightadvanced_desc:0 "El vuelo es una [disciplina|E] sobrenatural, exclusiva de la línea de sangre de las Gárgolas, que permite a estos vampiros volar.\NDemasiado pesadas para volar por medios naturales, las Gárgolas pétreas deben usar esta [disciplina|E]; otros [cainitas|E] capaces de volar (transformándose en murciélago o niebla usando Protean, por ejemplo) no la necesitan y no pueden aprenderla."
 
 trait_melpominee:0 "Melpominee"
 trait_melpominee_desc:0 "La [disciplina|E] Melpominee apareció simultáneamente con las Hijas de la Cacofonía y está intrínsecamente ligada a esa línea de sangre. Permite a sus poseedores utilizar el habla y el canto para una variedad de efectos sobrenaturales."
 
 trait_melpomineeadvanced:0 "Melpominee Advanced"
 trait_melpomineeadvanced_desc:0 "La [disciplina|E] Melpominee apareció simultáneamente con las Hijas de la Cacofonía y está intrínsecamente ligada a esa línea de sangre. Permite a sus poseedores utilizar el habla y el canto para una variedad de efectos sobrenaturales.|Nombrada así por la musa griega de la tragedia, Melpominee es una [disciplina|E] única de las Hijas de la Cacofonía. Explora el poder de la voz, sacudiendo el alma de los que están cerca y permitiendo al vampiro realizar hazañas sónicas que de otro modo serían imposibles."
 
 trait_mytherceria:0 "Mytherceria"
 trait_mytherceria_desc:0 "La Mytherceria es una [disciplina|E] que se manifiesta en los vampiros de sangre de hada, como los Kiasyd y los Maeghar. Otorga al vampiro sentidos místicos, la capacidad de robar conocimiento y otros poderes atribuidos a los hados."
 
 trait_mytherceriaadvanced:0 "Mytherceria avanzada"
 trait_mytherceriaadvanced_desc:0 "La Mytherceria es una [disciplina|E] que se manifiesta en los vampiros de sangre de hada, como los Kiasyd y los Maeghar. Otorga al vampiro sentidos místicos, la capacidad de robar conocimientos y otros poderes atribuidos a los hados.|nUn conjunto de poderes atribuidos a los hados e inclinados a la exposición de nuevos conocimientos, la Mytherceria ha llevado a muchas de sus víctimas a la locura balbuceante, o al menos a la frustración."
 
 trait_necromancy:0 "[necromancy|E]"
 trait_necromancy_desc:0 "[necromancy|E] es una forma de [bloodsorcery|E] que trata exclusivamente con el mundo de los muertos: los espectros y las Tierras Sombrías. Al igual que hay diferentes estilos de [bloodsorcery|E] convencional, hay una variedad de prácticas de [necromancy|E]. Es practicada principalmente por los Giovanni".
 
 trait_necromancyadvanced:0 "[necromancia|E] Avanzada"
 trait_necromancyadvanced_desc:0 "[nigromancia|E] es una forma de [hechicería de sangre|E] que trata exclusivamente con el mundo de los muertos: los espectros y las Tierras Sombrías. Al igual que hay diferentes estilos de [bloodsorcery|E] convencional, hay una variedad de prácticas de [necromancy|E]. Es practicada principalmente por los Giovanni". 
 
 trait_obeah:0 "Obeah"
 trait_obeah_desc:0 "La Obeah es la única [disciplina|E] de los Salubri, también conocida como la Senda Valeren del Sanador.\NLa Obeah se originó con Saulot en sus viajes por Oriente aprendiendo de los Kuei-jin el uso de la Perla del Dragón. El aprendizaje de Obeah hace que se desarrolle un tercer ojo en el centro de la frente".
 
 trait_obeahadvanced:0 "Obeah avanzado"
 trait_obeahadvanced_desc:0 "La Obeah es la única [disciplina|E] de los Salubri, también conocida como la Senda Valeren del Sanador.\NLa Obeah se originó con Saulot en sus viajes por Oriente aprendiendo de los Kuei-jin el uso de la Perla del Dragón. El aprendizaje de Obeah hace que se desarrolle un tercer ojo en el centro de la frente".
 trait_obfuscate:0 "Ofuscar"
 trait_obfuscate_desc:0 "Ofuscar es una [disciplina|E] que permite a los vampiros ocultarse, engañar a la mente de los demás o hacer que ignoren lo que el usuario no quiere que se vea.|nOfuscar es parte de la maldición de Caine sobre los [antediluvianos|E] al borrarlos de la creación."
 
 trait_obfuscateadvanced:0 "Ofuscación avanzada"
 trait_obfuscateadvanced_desc:0 "Ofuscar es una [disciplina|E] que permite a los vampiros ocultarse, engañar a la mente de los demás o hacer que ignoren lo que el usuario no quiere que se vea.\n\nOfuscar es parte de la maldición de Caine sobre los [antediluvianos|E] al borrarlos de la creación. Los usuarios frecuentes de la [disciplina|E] se encuentran divorciados de la sociedad, nunca participan en las interacciones sociales, sólo observan."
 
 trait_obtenebration:0 "Obtenebración"
 trait_obtenebration_desc:0 "[Obtenebration|E] se dice que condena aún más al vampiro que la utiliza, que se aleja más de la gracia de Dios y se adentra en la oscura atracción del Abismo. Por esta razón, el usuario es rechazado por animales y humanos por igual. La oscuridad antinatural invocada por Obtenebración es extremadamente aterradora para los mortales, los animales e incluso otros [cainitas|E] no acostumbrados a su uso".
 
 trait_obtenebrationadvanced:0 "Obtenebración avanzada"
 trait_obtenebrationadvanced_desc:0 "Se dice que la Obtenebración condena aún más al vampiro que la utiliza, que se aleja más de la gracia de Dios y se adentra en la oscura atracción del Abismo. Por esta razón, el usuario es rechazado por animales y humanos por igual. La oscuridad antinatural invocada por la Obtenebración es extremadamente aterradora para los mortales, los animales e incluso otros [cainitas|E] no acostumbrados a su uso."
 
 trait_potence:0 "Potencia"
 trait_potence_desc:0 "La Potencia es la [disciplina|E] que dota a los vampiros de vigor físico y fuerza preternatural. Los vampiros con la [disciplina|E] Potencia poseen una destreza física más allá de los límites mortales."

 trait_potenceadvanced:0 "Potencia avanzada"
 trait_potenceadvanced_desc:0 "La potencia es la [disciplina|E] que dota a los vampiros de vigor físico y fuerza preternatural. Los vampiros con la [disciplina|E] Potencia poseen una destreza física más allá de los límites mortales." 
 
 trait_presence:0 "Presencia"
 trait_presence_desc:0 "La presencia es la [disciplina|E] del encanto sobrenatural y la manipulación emocional que permite a los Kindred atraer, influir y controlar a las multitudes.\NLa presencia suaviza la maldición de Dios sobre los [cainitas|E], ya que hace que el vampiro se convierta en el centro de atención. Ya sea fascinando, seduciendo o intimidando a los que están cerca".

 trait_presenceadvanced:0 "Presencia avanzada" 
 trait_presenceadvanced_desc:0 "La presencia es la [disciplina|E] de la seducción sobrenatural y la manipulación emocional que permite a los Kindred atraer, influir y controlar a las multitudes.\NLa presencia suaviza la maldición de Dios sobre los [cainitas|E], ya que hace que el vampiro se convierta en el centro de atención. Ya sea fascinando, seduciendo o intimidando a los que están cerca". 

 trait_protean:0 "Proteico"
 trait_protean_desc:0 "Protean es una [disciplina|E] que otorga a los vampiros la capacidad de cambiar de forma, desde hacer crecer sus garras feroces hasta evaporarse en una nube de niebla.\NProtean es parte de la maldición de Dios sobre Caine en el aspecto de que desprende la fachada de humanidad que todo vampiro tiene que mantener, revelando la Bestia dentro de su alma."
 
 trait_proteanadvanced:0 "Protean Avanzado"
 trait_proteanadvanced_desc:0 "Protean es una [disciplina|E] que otorga a los vampiros la capacidad de cambiar de forma, desde el crecimiento de garras feroces hasta la evaporación en una nube de niebla.\NProtean es parte de la maldición de Dios sobre Caine en el aspecto de que desprende la fachada de humanidad que todo vampiro tiene que mantener, revelando la Bestia dentro de su alma. Los usuarios avanzados a veces encuentran que sus cuerpos cambian sin su consentimiento, reaccionando directamente a sus emociones, lo que les lleva a situaciones embarazosas."
 
 trait_quietus:0 "Quietus"
 trait_quietus_desc:0 "Quietus es la firma [disciplina|E] de los Assamitas que les otorga influencia sobre la sangre de los demás.\NAunque cada una de las castas Assamitas posee Quietus como in-[Clan|E] [disciplina|E], es principalmente conocida por ser una herramienta asesina en manos de la casta de los Guerreros, y los poderes de nivel inferior están en gran medida orientados a ese fin."

 trait_quietusadvanced:0 "Quietus Avanzado"
 trait_quietusadvanced_desc:0 "Quietus es la firma [disciplina|E] de los Assamitas que les otorga influencia sobre la sangre de los demás.\nAunque cada una de las castas Assamitas posee Quietus como in-[Clan|E] [disciplina|E], es principalmente conocida por ser una herramienta asesina en manos de la casta Guerrera, y los poderes de nivel inferior están orientados en gran medida a ese fin."
 trait_serpentis:0 "Serpentis"
 trait_serpentis_desc:0 "Serpentis es la marca [disciplina|E] de los Seguidores de Set [Clan|E]. Principalmente proporciona habilidades de cambio de forma, aunque también abarca la corrupción y otras características asociadas a las serpientes.\nSerpentis tiene un significado casi religioso para el [Clan|E], aunque los científicos Kindred suponen una relación con los poderes de cambio de forma de Protean."
 
 trait_serpentisadvanced:0 "Serpentis avanzado"
 trait_serpentisadvanced_desc:0 "Serpentis es la marca [disciplina|E] de los Seguidores de Set [Clan|E]. Principalmente proporciona habilidades de cambio de forma, aunque también abarca la corrupción y otras características asociadas a las serpientes.|nSerpentis tiene un significado casi religioso para el [Clan|E], aunque los científicos Kindred suponen una relación con los poderes de cambio de forma de Protean."
 
 trait_spiritus:0 "Spiritus"
 trait_spiritus_desc:0 "Spiritus es una [disciplina|E] exclusiva de la línea de sangre de los Ahrimanes que les permite interactuar con los espíritus animalistas. En sus niveles más básicos permite al vampiro hablar con los espíritus e invocarlos, pero en los niveles más altos se puede canalizar el poder de ellos para fortalecer al Ahrimane."

 trait_spiritusadvanced:0 "Spiritus avanzado"
 trait_spiritusadvanced_desc:0 "Spiritus es una [disciplina|E] exclusiva de la línea de sangre de los Ahrimanes que les permite interactuar con los espíritus animales. En sus niveles más básicos permite al vampiro hablar con los espíritus e invocarlos, pero en los niveles más altos se puede canalizar el poder de ellos para fortalecer al Ahrimane."
 
 trait_temporis:0 "Temporis"
 trait_temporis_desc:0 "Temporis es una [disciplina|E] exclusiva de los Verdaderos Brujah. Supuestamente un refinamiento de la Celeridad, Temporis otorga al [cainita|E] la capacidad de manipular el flujo del propio tiempo."

 trait_temporisadvanced:0 "Temporis Avanzado"
 trait_temporisadvanced_desc:0 "Temporis es una [disciplina|E] exclusiva de los Verdaderos Brujah. Supuestamente un refinamiento de la Celeridad, Temporis otorga al [cainita|E] la capacidad de manipular el flujo del tiempo en sí mismo.\NAunque es poderosa, esta [disciplina|E] también puede ser agotadora de usar."
 
 trait_thinbloodalchemy:0 "Alquimia de la sangre fina"
 trait_thinbloodalchemy_desc:0 "Exclusiva [disciplina|E] para los Thin-Blood, les permite imitar los poderes de los vampiros de sangre completa [disciplinas|E].\nLa alquimia de la sangre fina es una práctica de dos pasos: destilación de un brebaje de sangre utilizando la fórmula adecuada, y luego activación de dicho brebaje bebiéndolo y canalizando su poder."

 trait_thinbloodalchemyadvanced:0 "Alquimia de sangre fina avanzada"
 trait_thinbloodalchemyadvanced_desc:0 "Exclusiva [disciplina|E] para los Thin-Blood, les permite imitar los poderes de los vampiros de sangre completa [disciplinas|E].\nLa alquimia de sangre fina es una práctica de dos pasos: destilación de un brebaje de sangre usando la fórmula adecuada, y luego activación de dicho brebaje bebiéndolo y canalizando su poder."

 trait_valeren:0 "Valeren"
 trait_valeren_desc:0 "Valeren es la [disciplina|E] mística de los Salubri. En su forma más básica, Valeren proporciona control sobre el dolor y una mayor capacidad marcial, permitiendo aparentemente a los guerreros recurrir al poder del cielo para vencer a sus enemigos."

 trait_valerenadvanced:0 "Valeren avanzado" 
 trait_valerenadvanced_desc:0 "Valeren es la [disciplina|E] mística de los Salubri. En su forma más básica, el Valeren proporciona control sobre el dolor y una mayor capacidad marcial, permitiendo aparentemente a los guerreros recurrir al poder del cielo para vencer a sus enemigos." 

 trait_vicissitude:0 "Vicisitud"
 trait_vicissitude_desc:0 "Uno de los poderes más horripilantes de los que disponen los [cainitas|E], Vicissitude es el poder característico de los Tzimisce y es casi desconocido fuera del [Clan|E]. Con él, un artesano experimentado puede esculpir la carne y los huesos de un sujeto, convirtiéndolo en una criatura de belleza extraterrestre o convirtiéndolo en una monstruosidad deforme".
 
 trait_vicissitudeadvanced:0 "Vicisitud avanzada" 
 trait_vicissitudeadvanced_desc:0 "Uno de los poderes más horripilantes disponibles para los [cainitas|E], Vicisitud es el poder característico de los Tzimisce y es casi desconocido fuera del [Clan|E]. Con él, un artesano experimentado puede esculpir la carne y los huesos de un sujeto, convirtiéndolo en una criatura de belleza extraterrestre o convirtiéndolo en una monstruosidad deforme". 
 
 trait_visceratika:0 "Visceratika"
 trait_visceratika_desc:0 "La [disciplina|E] de Visceratika es la posesión exclusiva de la línea de sangre de las Gárgolas y es una extensión de su afinidad natural por la piedra, la tierra y las cosas hechas de ella.\NLa Visceratika presenta habilidades de cambio de forma similares a las de Protean, aunque con un mayor énfasis en la defensa."

 trait_visceratikaadvanced:0 "Visceratika Advanced"
 trait_visceratikaadvanced_desc:0 "La [disciplina|E] de la Visceratika es una posesión exclusiva de la línea de sangre de las Gárgolas y es una extensión de su afinidad natural por la piedra, la tierra y las cosas hechas de ella.\NLa Visceratika presenta habilidades de cambio de forma similares a las de Protean, aunque con un mayor énfasis en la defensa."

 trait_bloodsorcery:0 "[bloodsorcery|E]"
 trait_bloodsorcery_desc:0 "[bloodsorcery|E] se refiere a la magia realizada por los vampiros, alimentada por prácticas religiosas u ocultas y el poder de [cainite|E] vitae.\NA través de la práctica de [bloodsorcery|E], un [cainite|E] puede invocar el fuego, controlar el clima, y hacer muchas otras cosas que no son naturales ni siquiera para los estándares vampíricos."
 
 trait_bloodsorceryadvanced:0 "Hechicería de sangre avanzada"
 trait_bloodsorceryadvanced_desc:0 "[bloodsorcery|E] se refiere a la magia realizada por los vampiros, alimentada por prácticas religiosas u ocultas y por el poder de la vitae [cainita|E].\NA través de la práctica de [bloodsorcery|E], un [cainita|E] puede invocar el fuego, controlar el clima y hacer muchas otras cosas que no son naturales ni siquiera para los estándares vampíricos." 

 trait_fortitudeadvanced:0 "Fortaleza avanzada"
 trait_fortitudeadvanced_desc:0 "La fortaleza es una [disciplina|E] que otorga a los Kindred una dureza sobrenatural, hasta el punto de resistir el fuego y la luz del sol.\NLa fortaleza otorga a los [cainitas|E] la capacidad de resistir todo tipo de daños, sin embargo, cumple su parte de la maldición de Dios en cuanto a que engendra arrogancia y exceso de confianza."

 trait_oblivion:0 "Olvido" 
 trait_oblivion_desc:0 "El olvido es una [disciplina|E] que permite a sus usuarios recurrir a algo totalmente antinatural; invocando la oscuridad sobrenatural del Abismo y esclavizando a los espectros a través del Olvido, similar a la [nigromancia|E]."

 trait_oblivionadvanced:0 "Olvido avanzado" 
 trait_oblivionadvanced_desc:0 "El olvido es una [disciplina|E] que permite a sus usuarios recurrir a algo totalmente antinatural; invocando la oscuridad sobrenatural del Abismo y esclavizando a los espectros a través del Olvido, similar a la [nigromancia|E]." 

 trait_mortis:0 "Mortis"
 trait_mortis_desc:0 "La [disciplina|E] Mortis tiene sus raíces en el control y la manipulación de la muerte. Más específicamente, Mortis es una forma de [bloodsorcery|E] que trata con los cadáveres y sus condiciones después de la muerte. El [Clan|E] de los Capadocios es el único Kindred que posee las afinidades naturales para esta [disciplina|E]".
 
 trait_mortisadvanced:0 "Mortis avanzado" 
 trait_mortisadvanced_desc:0 "La [disciplina|E] Mortis tiene sus raíces en el control y la manipulación de la muerte. Más específicamente, Mortis es una forma de [bloodsorcery|E] que trata con los cadáveres y sus condiciones después de la muerte. El [Clan|E] Capadocio es el único Kindred que posee las afinidades naturales para esta [disciplina|E]".

 trait_nihilistics:0 "Nihilística"
 trait_nihilistics_desc:0 "La nihilística es una [disciplina|E] exclusiva de los Nagaraja que les permite penetrar en el Sudario y canalizar el Olvido. Aunque algunos de sus usos están relacionados con los habitantes del Inframundo, muchos de sus poderes permiten al vampiro atraer el Olvido al mundo físico."
 
 trait_nihilisticsadvanced:0 "Nihlistics Advanced" 
 trait_nihilisticsadvanced_desc:0 "La nihilística es una [disciplina|E] exclusiva de los Nagaraja que les permite penetrar en el Sudario y canalizar el Olvido. Aunque algunos de sus usos están relacionados con los habitantes del Inframundo, muchos de sus poderes permiten al vampiro atraer el Olvido al mundo físico."

 trait_thanatosis:0 "Thanatosis"
 trait_thanatosis_desc:0 "La tanatosis es la [disciplina|E] exclusiva de la línea de sangre samedi que consiste en manipular los efectos de la muerte y la descomposición. En algunos aspectos es similar a la [nigromancia|E]. La [disciplina|E] se ocupa de la apariencia de la muerte en todas sus formas. Los practicantes están obsesionados con la apariencia de la muerte, encontrándose rechazados por todos, excepto por los más retorcidos de los Kindred".
 
 trait_thanatosisadvanced:0 "Thanatosis avanzada" 
 trait_thanatosisadvanced_desc:0 "La tanatosis es la [disciplina|E] exclusiva de la línea de sangre Samedi que consiste en manipular los efectos de la muerte y la descomposición. En algunos aspectos es similar a la [nigromancia|E]. La [disciplina|E] se ocupa de la apariencia de la muerte en todas sus formas. Los practicantes están obsesionados con la apariencia de la muerte, encontrándose rechazados por todos, excepto por los más retorcidos de los Kindred."

 trait_deimos:0 "Deimos"
 trait_deimos_desc:0 "Deimos es una [disciplina|E] creada por los Lamia en su investigación de los muertos y de Lilith. Proporciona a los vampiros cierto control sobre sus propias formas sin vida, así como sobre los espíritus oscuros y los auspicios de la Madre Oscura. También se conoce como la Senda de los Cuatro Humores".
 
 trait_deimosadvanced:0 "Deimos Avanzado" 
 trait_deimosadvanced_desc:0 "Deimos es una [disciplina|E] creada por los Lamia en su investigación de los muertos y de Lilith. Proporciona a los vampiros cierto control sobre sus propias formas sin vida, así como sobre los espíritus oscuros y los auspicios de la Madre Oscura. También se conoce como la Senda de los Cuatro Humores".

 trait_abombo:0 "Abombo"
 trait_abombo_desc:0 "Senda practicada por los Laibon de África, centrada en la conexión entre los muertos y los vivos; similar pero distinta a la Senda del Cenotafio de [nigromancia|E]. Permite al nigromante controlar e incluso reasignar el grillete de un espectro".
 
 trait_abomboadvanced:0 "Abombo avanzado" 
 trait_abomboadvanced_desc:0 "Senda practicada por los Laibon de África, centrada en la conexión entre los muertos y los vivos; similar pero distinta a la Senda del Cenotafio de [necromancia|E]. Permite al nigromante controlar e incluso reasignar el grillete de un espectro".

 trait_abombwe:0 "Abombwe"
 trait_abombwe_desc:0 "El abombwe es una [disciplina|E] practicada por el Legado Akunanse de los Laibon y la misteriosa línea de sangre Bonsam de la Edad Oscura."
 
 trait_abombweadvanced:0 "Abombwe avanzado"
 trait_abombweadvanced_desc:0 "El abombwe es una [disciplina|E] practicada por el Legado Akunanse de los Laibon y la misteriosa línea de sangre Bonsam de la Edad Oscura. El Abombwe utiliza la estrecha conexión del vampiro con sus propias Bestias (y la de otros) y su control sobre ellas, además de canalizar el poder de la Bestia para diversos fines." 
 
 trait_sielanicthaumaturgy:0 "Taumaturgia sielana"
 trait_sielanicthaumaturgy_desc:0 "La taumaturgia sielana es una forma de taumaturgia inspirada en el dios pagano Telyavel y practicada por los Tremere Telyavelicos, una línea de sangre de los Tremere nativos de Lituania.\NLos Telvay aprendieron a utilizar el poder de siela, el espíritu animista latente en la tierra, la piedra, las plantas y los animales de su patria adoptiva."
 
 trait_sielanicthaumaturgyadvanced:0 "Taumaturgia sielana avanzada"
 trait_sielanicthaumaturgyadvanced_desc:0 "La taumaturgia siélica es una forma de taumaturgia inspirada en el dios pagano Telyavel y practicada por los Tremere Telyavélicos, una línea de sangre de los Tremere nativos de Lituania.\NLos Telvay aprendieron a utilizar el poder de siela, el espíritu animista latente en la tierra, la piedra, las plantas y los animales de su patria adoptiva." 
 
 trait_duranki:0 "Dur-An-Ki"
 trait_duranki_desc:0 "[durnaki|E] (Maestro del Cielo y la Tierra) es una forma de [hechicería de sangre|E] practicada por los Kindred de Oriente Medio y África. Es una forma de magia muy antigua, basada en una gran variedad de tradiciones religiosas mortales, y anterior a la Taumaturgia, a la que se parece en muchos aspectos."
 
 trait_durankiadvanced:0 "Dur-An-Ki Avanzado"
 trait_durankiadvanced_desc:0 "[durnaki|E] (Maestro del Cielo y la Tierra) es una forma de [hechicería de sangre|E] practicada por los Kindred de Oriente Medio y África. Es una forma de magia muy antigua, basada en una gran variedad de tradiciones religiosas mortales, y anterior a la taumaturgia, a la que se asemeja en muchos aspectos."
 
 trait_ogham:0 "Ogham"
 trait_ogham_desc:0 "El Ogham es una forma muy limitada de [hechicería de sangre|E] basada en las runas celtas que practican los Lhiannan y que aprovecha el fragmento de espíritu de la línea de sangre, concediendo poder dentro de su territorio."
 
 trait_oghamadvanced:0 "Ogham avanzado"
 trait_oghamadvanced_desc:0 "El Ogham es una forma muy limitada de [bloodsorcery|E] basada en las runas celtas que practican los Lhiannan y que aprovecha el fragmento de espíritu de la línea de sangre, concediendo poder dentro de su territorio." 
 
 trait_koldunicsorcery:0 "Hechicería koldúnica"
 trait_koldunicsorcery_desc:0 "La Hechicería Koldúnica o Koldunismo es una forma de [cainita|E] [hechicería de sangre|E] practicada por los Tzimisce.\NLa Hechicería Koldúnica es similar a la Taumaturgia en la idea pero muy diferente en la práctica."
 
 trait_koldunicsorceryadvanced:0 "Hechicería koldúnica avanzada"
 trait_koldunicsorceryadvanced_desc:0 "La Hechicería Koldúnica o Koldunismo es una forma de [cainita|E] [hechicería de sangre|E] practicada por los Tzimisce.\NLa Hechicería Koldúnica es similar a la Taumaturgia en la idea pero muy diferente en la práctica."
 trait_abyssmysticism:0 "Misticismo del Abismo"
 trait_abyssmysticism_desc:0 "El Misticismo del Abismo es una forma de [hechicería de sangre|E], derivada de la [disciplina|E] Obtenebración. Obviamente, este arte arcano es practicado casi exclusivamente por miembros del [Clan|E] Lasombra. Los que practican estas artes místicas son llamados Los Sombríos".
 
 trait_abyssmysticismadvanced:0 "Misticismo del abismo avanzado"
 trait_abyssmysticismadvanced_desc:0 "El Misticismo del Abismo es una forma de [hechicería de sangre|E], derivada de la [disciplina|E] Obtenebración. Obviamente, este arte arcano es practicado casi exclusivamente por miembros del [Clan|E] Lasombra. Los que practican estas artes místicas son llamados Los Sombríos".
 
 trait_sadhana:0 "Sadhana"
 trait_sadhana_desc:0 "La Sadhana es una forma de [hechicería de sangre|E] hindú que precede en miles de años a la prominente Taumaturgia Hermética de los Tremere [Clan|E]. Es practicada por los brahmanes hindúes [cainitas|E] de la India, que son conocidos como rakta-sadhus o incluso brahmanes de sangre".
 
 trait_sadhanaadvanced:0 "Sadhana avanzada"
 trait_sadhanaadvanced_desc:0 "La Sadhana es una forma de [hechicería de sangre|E] hindú que precede en miles de años a la prominente Taumaturgia Hermética de los Tremere [Clan|E]. Es practicada por los brahmanes hindúes [cainitas|E] de la India, que son conocidos como rakta-sadhus o incluso brahmanes de sangre."
 
 trait_sihr:0 "Sihr"
 trait_sihr_desc:0 "El sihr (que significa 'hechizo' en árabe) es una [disciplina|E] de [hechicería de sangre|E] practicada ampliamente en el mundo islámico. En la Edad Oscura, su diferencia con otras formas de [bloodsorcery|E] era que su usuario necesitaba tener un alto índice de Camino en la Senda de la Comunidad o Camino del Cielo para realizar la magia."
 
 trait_sihradvanced:0 "Sihr avanzado"
 trait_sihradvanced_desc:0 "El Sihr (que significa 'hechizo' en árabe) es una [disciplina|E] de [hechicería de sangre|E] practicada ampliamente en el mundo islámico. En la Edad Oscura, su diferencia con otras formas de [hechicería de sangre|E] era que su usuario necesitaba tener un alto índice de Camino en la Senda de la Comunidad o Camino del Cielo para realizar la magia." 
 
 trait_akhu:0 "Akhu"
 trait_akhu_desc:0 "El Akhu, a menudo llamado Hechicería Setita por los forasteros, es la antigua tradición de [hechicería de sangre|E] de los Seguidores de Set.En el apogeo de Egipto, antes de su conversión al cristianismo a manos del Imperio Romano, la magia era algo común, practicada por mortales y vampiros por igual."
 
 trait_akhuadvanced:0 "Akhu avanzado"
 trait_akhuadvanced_desc:0 "El Akhu, a menudo llamado Hechicería Setita por los forasteros, es la antigua tradición [hechicería de sangre|E] de los Seguidores de Set.\NEn el apogeo de Egipto, antes de su conversión al cristianismo a manos del Imperio Romano, la magia era algo común, practicada por mortales y vampiros por igual." 
 
 trait_darkthaumaturgy:0 "Taumaturgia oscura"
 trait_darkthaumaturgy_desc:0 "Taumaturgia oscura es el nombre dado a la [taumaturgia|E] aprendida de los demonios.\NLos vampiros pueden hacer pactos con los demonios para aprender los secretos de la [hechicería de sangre|E], al igual que los magos mortales lo hacen para aprender otras magias infernales; lo hacen a costa del alma que les quede, sellando un trato que es una vía rápida para conseguir poder mágico."
 
 trait_darkthaumaturgyadvanced:0 "Taumaturgia oscura avanzada"
 trait_darkthaumaturgyadvanced_desc:0 "Taumaturgia oscura es el nombre que recibe la taumaturgia aprendida de los demonios.\NLos vampiros pueden hacer pactos con los demonios para aprender los secretos de la [hechicería de sangre|E], al igual que los magos mortales para aprender otras magias infernales; lo hacen a costa del alma que les quede, sellando un trato que es una ruta rápida hacia el poder mágico."
 
 trait_thaumaturgy:0 "Taumaturgia"
 trait_thaumaturgy_desc:0 "La taumaturgia es la forma estrechamente guardada de [bloodsorcery|E] practicada por los vampíricos [Clan|E] Tremere.\NCreada mediante una investigación exhaustiva y una extensa experimentación, la taumaturgia utiliza los principios de la magia hermética utilizada por la Casa Tremere cuando aún era una cábala de magos, adaptada para ser alimentada por el poder mágico inherente de Vitae en lugar de la Quintaesencia."
 
 trait_thaumaturgyadvanced:0 "Taumaturgia avanzada"
 trait_thaumaturgyadvanced_desc:0 "La taumaturgia es la forma estrechamente guardada de [hechicería de sangre|E] practicada por los vampíricos [Clan|E] Tremere.Creada mediante una investigación exhaustiva y una amplia experimentación, la taumaturgia utiliza los principios de la magia hermética utilizada por la Casa Tremere cuando aún era una cábala de magos, adaptada para ser alimentada por el poder mágico inherente de Vitae en lugar de la Quintaesencia." 
 trait_fae:0 "Fae"
 trait_fae_desc:0 ""
 
 trait_supehunter:0 "Cazador"
 trait_supehunter_desc:0 "Cazador de monstruos".
 
 trait_turnedhunter:0 "Cazador convertido"
 trait_turnedhunter_desc:0 "Este cazador de monstruos ha sido apartado de su misión por poderes sobrenaturales"
 
 trait_torpor:0 "Torpor"
 trait_torpor_desc:0 "[torpor|E] no es más que un estado de inmovilidad más profundo en comparación con el sueño que los vampiros experimentan normalmente durante las horas de luz. La duración del [torpor|E] depende del grado de Humanidad o Senda del vampiro, y puede durar desde un día hasta más de un milenio. Se afirma que los vampiros antiguos a menudo sienten la necesidad de entrar en [torpor|E] voluntario, también conocido como el sueño de las edades."
 
 trait_canon:0 "Canon"
 trait_canon_desc:0 ""
 
 trait_demon:0 "Demonio"
 trait_demon_desc:0 "Los demonios son ángeles caídos que eligieron ponerse del lado de Lucifer y de la humanidad en vez de con Dios en los primeros días de la Creación. Como castigo por su rebeldía y deslealtad, el Arcángel Miguel expulsó a estos ángeles del Cielo y los arrojó al Abismo."
 
 trait_vampgeneration1:0 "1ª Generación"
 trait_vampgeneration1_desc:0 "Caine, el primer vampiro".
 
 trait_vampgeneration2:0 "2ª Generación"
 trait_vampgeneration2_desc:0 "Los tres hijos de Caine. Asesinados por la Tercera Generación".
 
 trait_vampgeneration3:0 "Tercera Generación"
 trait_vampgeneration3_desc:0 "Esta generación fundó los clanes del Kindred"

 trait_vampgeneration4:0 "4ª Generación"
 trait_vampgeneration4_desc:0 "Esta generación fundó la mayoría de las líneas de sangre, las casas dinásticas de los no muertos"

 trait_vampgeneration5:0 "5ª Generación"
 trait_vampgeneration5_desc:0 "Vampiros de la 5ª generación".

 trait_vampgeneration6:0 "Sexta generación"
 trait_vampgeneration6_desc:0 "Vampiros de la 6ª generación".

 trait_vampgeneration7:0 "Séptima generación"
 trait_vampgeneration7_desc:0 "Vampiros de la 7ª generación".

 trait_vampgeneration8:0 "Octava generación"
 trait_vampgeneration8_desc:0 "Vampiros de la 8ª generación". 

 trait_vampgeneration9:0 "Generación 9"
 trait_vampgeneration9_desc:0 "Vampiros de la 9ª generación".

 trait_vampgeneration10:0 "Décima generación"
 trait_vampgeneration10_desc:0 "Vampiros de la 10ª generación".

 trait_vampgeneration11:0 "11ª generación"
 trait_vampgeneration11_desc:0 "Vampiros de la 11ª generación".

 trait_vampgeneration12:0 "Generación 12"
 trait_vampgeneration12_desc:0 "Vampiros de la 12ª generación".

 trait_vampgeneration13:0 "Generación 13"
 trait_vampgeneration13_desc:0 "Casi de sangre fina".

 trait_vampgeneration14:0 "14ª Generación"
 trait_vampgeneration14_desc:0 "Vampiros de la sangre fina".

 trait_vampgeneration15:0 "15ª Generación"
 trait_vampgeneration15_desc:0 "Vampiros de la sangre fina".
 
 trait_vampgeneration16:0 "16ª Generación"
 trait_vampgeneration16_desc:0 "Vampiros de la sangre fina". 
 
 trait_something_unusual:0 "Algo inusual"
 trait_something_unusual_desc:0 "Algo raro en esto".
 
 trait_revenant:0 "Revenant"
 trait_revenant_desc:0 "Un ghoul independiente nacido con sangre de vampiro en sus venas".

 trait_zadruga:0 "Zadruga"
 trait_zadruga_desc:0 "Un término tzimisce para designar a los ghouls hereditarios. De todos los clanes, los tzimisce son los que más familias de ghouls han criado."

 trait_oathbreaker:0 "Rompehuesos"
 trait_oathbreaker_desc:0 "Este personaje rompió un juramento".
 
 trait_regnant:0 "Regante"
 trait_regnant_desc:0 "Este personaje ha creado un ghoul".
 
 trait_massregnant:0 "Regnante en masa"
 trait_massregnant_desc:0 "Este personaje ha creado ghouls en masa. Esto suele ser una infracción de [mascarada|E]".
 
 trait_unbondable:0 "Inconfesable"
 trait_unbondable_desc:0 "Este personaje no puede ser vinculado por sangre".
 
 trait_exposed:0 "Expuesto"
 trait_exposed_desc:0 "La naturaleza sobrenatural de esta criatura se ha revelado a los mortales. Los cazadores planearán ataques contra ellos".
 
 trait_nagaraja:0 "Nagaraja"
 trait_nagaraja_desc:0 "Los Nagaraja son una extraña línea de sangre de vampiros carnívoros, temidos por los Kindred de todos los lados del Jyhad."
 
 trait_hecata:0 "Hecata"
 trait_hecata_desc:0 "No son un [Clan|E] totalmente orgánico que derive de un único [antediluviano|E] y de una línea de sangre ininterrumpida, sino que están formados por los Giovanni y los restos del antiguo [Clan|E] Capadocio y sus líneas de sangre relacionadas; así como por los Nagaraja a pesar de la falta de conexión con [antediluviano|E]." 

 trait_impundulu:0 "Impundulu"
 trait_impundulu_desc:0 "Una línea de sangre de vampiros vinculada a un aquelarre de brujas mortales, y se cuentan como uno de los Legados del Laibon. Impundulu fue un poderoso nigromante en vida, casado con una bruja vital igualmente poderosa llamada Bomkazi".  
 
 trait_sire:0 "[Sire|E]"
 trait_sire_desc:0 "Este vampiro ha creado otro de su clase".
 
 trait_masssire:0 "[Sire|E]"
 trait_masssire_desc:0 "Este vampiro ha creado un gran número de vampiros. La mayoría de los caminos consideran esto como una violación de [mascarada|E]".
 trait_lamia:0 "Lamia"
 trait_lamia_desc:0 "Los Lamia eran un linaje de [cainitas|E] dedicados a defender a [Clan|E] Capadocio, aunque originalmente eran un grupo de cultistas que decían descender de Lilith, la primera esposa de Adán."
 
 trait_gangrel_greek:0 "Gangrel griego"
 trait_gangrel_greek_desc:0 "Los Gangrel griegos fueron una rama que comenzó en la Edad Media.\NLos Gangrel se han escondido en las ciudades del hombre incluso antes de Babilonia. Con el paso de los siglos, estos Gangrel se han centrado en sobrevivir en un entorno diferente, uno cargado de sus propios peligros."
 
 trait_ahrimane:0 "Ahrimane"
 trait_ahrimane_desc:0 "Los Ahrimanes son una rara línea de sangre femenina de Kindred que existió originalmente durante la Edad Oscura, encabezada por una mujer llamada Adisa.\NLa historia de los Ahrimanes, como ellos mismos contarían, comienza con Adisa, una Valkyrje e hija de Freyja, la diosa nórdica."

 trait_patron:0 "Patrón"
 trait_patron_desc:0 "Persona notable investida en el Mundo de las Tinieblas".
 
 trait_harbringersofskulls:0 "Harbringers of Skulls"
 trait_harbringersofskulls_desc:0 ""
 
 trait_raktasadhus_ashirra:0 ""
 trait_raktasadhus_ashirra_desc:0 ""
 
 trait_kinfolk:0 "Kinfolk"
 trait_kinfolk_desc:0 "De sangre de lobo, descendiente de los Garou".
 
 trait_truefaith:0 "Fe verdadera"
 trait_truefaith_desc:0 "Este personaje cree verdaderamente en la presencia de lo divino. Esto es una parte esencial de su alma, y le da acceso a habilidades que algunos pueden llamar antinaturales. Pero ten cuidado, los individuos pecadores pueden acabar siendo despojados de sus dones divinos.\NEste rasgo desbloquea un nuevo árbol de estilo de vida."

 trait_beatific:0 "Beatific"
 trait_beatific_desc:0 "Una encarnación andante de su Dios elegido, este personaje es un hacedor de milagros, un verdadero dechado de fe en un mundo de oscuridad. Le da acceso a habilidades que algunos pueden llamar antinaturales. Pero cuidado, los individuos pecadores pueden ser eventualmente despojados de sus dones divinos"

 trait_bloodgorged:0 "Sangre de la sangre"
 trait_bloodgorged_desc:0 "Beneficiario de un experimento loco o de un ritual impío destinado a infundir a un ser vivo la mezcla más potente de Kindred vitae posible de obtener."
 
 trait_holy_seal:0 "Sello sagrado"
 trait_holy_seal_desc:0 "Las reliquias y los artefactos de poder divino alojados de forma brutal, pero experta, en las heridas de este miserable individuo impiden su curación."
 
 trait_custom_bloodline:0 "[ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 trait_custom_bloodline_desc:0 "Línea de sangre joven de [cainitas|E]. Aunque la mayoría de los kindred no los reconocen como iguales, [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] están dispuestos a demostrar a los demás que son los verdaderos gobernantes de la noche."
 
 trait_leading_front:0 "Lidera desde el frente"
 trait_leading_front_desc:0 "Artemis Orthia dio un ejemplo a todos los Ventrue, a veces precipitarse sobre tu enemigo puede resolver los problemas mejor que los esquemas y la diplomacia"
 
 trait_hun_tactics:0 "Tácticas salvajes"
 trait_hun_tactics_desc:0 "Matasuntha dio un ejemplo a todos los Gangrel, usar tu naturaleza salvaje te ayudará a ganar"
 
 trait_swift_movement:0 "Movimiento rápido"
 trait_swift_movement_desc: "Aníbal dio un ejemplo a todo Brujah, tienes que actuar rápido si quieres ganar"
 
 trait_samiel_follower:0 "Seguidor de Samiel"
 trait_samiel_follower_desc:0 "Samiel dio un ejemplo a todo Salubri, el mal debe ser golpeado, incluso cuando las probabilidades no están a tu favor ya que el mal prospera en el corazón no desafiado"
 
 trait_shadow_warrior:0 "Respetado y temido"
 trait_shadow_warrior_desc:0 "Jamal dio un ejemplo a todos los Banu Haqim, si temen tus actos antes de conocerte, la batalla ya está ganada"

 trait_faithful_warrior:0 "Guerrero fiel"
 trait_faithful_warrior_desc:0 "Tarique dio un ejemplo a todo Nosferatu, luchar por una fe es una causa digna"
 
 trait_shadow_reconquista_warrior:0 "Guerra de las sombras"
 trait_shadow_reconquista_warrior_desc:0 "Silvester de Ruiz dio un ejemplo a todo Lasombra, a veces la guerra requiere astucia y engaño"
 
 trait_caitiff_warrior:0 "Guerrero Caitiff"
 trait_caitiff_warrior_desc:0 "Los Caitiff están solos en este mundo oscuro, por eso aprendieron a protegerse en las batallas"
 
 trait_salubri_healer:0 "Sanador Salubri"
 trait_salubri_healer_desc:0 "Casta de sanadores, constituye el grueso de la línea de sangre "normal", su propósito es curar y enseñar a Golconda"
 
 trait_salubri_warrior:0 "Guerrero Salubri"
 trait_salubri_warrior_desc:0 "Casta de guerreros, fundada tras las Guerras Baali por Samiel. Los guerreros son vagabundos, siempre en busca del mal para destruirlo allí donde crezca. A cada miembro de la casta de guerreros se le otorga un nombre angélico tras un ritual de iniciación"
 
 trait_salubri_watcher:0 "Vigilante de Salubri"
 trait_salubri_watcher_desc:0 "Casta de vigilantes, fundada durante los viajes de Saulot a Oriente. Eruditos y ladrones, los vigilantes actúan como protectores de los demás Salubri, defendiéndolos de aquellos que les niegan su derecho a existir siquiera y a ganarse la redención"
 trait_teachings:0 "Enseñanzas de Chandraputra"
 trait_teachings_desc:0 "Chandraputra dio un ejemplo a todos los Ravnos, ser un buen general es mucho más útil que ser un buen guerrero"
 
 trait_orison_compass:0 "Brújula moral"
 trait_orison_compass_desc:0 "Este personaje no puede pasar por alto el pecado, ni siquiera el suyo propio. Tiene un sentido casi infalible de lo mal que los que le rodean han transgredido a Dios."
 
 trait_orison_innocent:0 "El verdadero inocente"
 trait_orison_innocent_desc:0 "Este personaje es impoluto, un faro de luz purísima en la oscuridad de nuestros tiempos."
 
 trait_orison_noah:0 "El favor de Noé"
 trait_orison_noah_desc:0 "Este individuo posee una cualidad única que apacigua los corazones y los ánimos de todos los animales de la naturaleza."
 
 trait_orison_vigilance:0 "Ojo de la vigilancia"
 trait_orison_vigilance_desc:0 "Este personaje necesita dormir mucho menos que una persona media y se despierta del sueño con más facilidad que otros."
 
 trait_orison_penitent:0 "El penitente"
 trait_orison_penitent_desc:0 "Simplemente por conocer su lugar en el plan de Dios, un hombre sencillo puede a menudo entender más sobre el gran mundo que el más poderoso de los reyes o el más erudito de los eruditos."
 
 trait_orison_years:0 "Bendición de los años"
 trait_orison_years_desc:0 "La mente de este personaje está dotada de una sabiduría superior a la de sus años y una capacidad para captar nuevos conceptos con bastante facilidad."
 
 trait_orison_hierophant:0 "El hierofante"
 trait_orison_hierophant_desc:0 "Este personaje es un modelo de aplomo y gracia bajo el fuego, incluso cuando camina a la sombra de la muerte."
 
 trait_orison_sanguine:0 "Himno Sanguíneo"
 trait_orison_sanguine_desc:0 "La fe de este personaje corre por su sangre convirtiéndola en un veneno virulento para todo lo impío."
 
 trait_orison_talespinner:0 "Talespinner"
 trait_orison_talespinner_desc:0 "Este individuo posee un celo natural y un entusiasmo contagioso por difundir la palabra de Dios."
 
 trait_oculi_shepherd:0 "Pastor celestial"
 trait_oculi_shepherd_desc:0 "Permite que el Ojo de Dios se oculte a la vista mientras hace el trabajo del Cielo".
 
 trait_oculi_sight:0 "Segunda vista"
 trait_oculi_sight_desc:0 "La Vista permite al inquisidor buscar criaturas sobrenaturales independientemente de sus esfuerzos por eludir ser observado."
 
 trait_oculi_liturgy:0 "Liturgia divina"
 trait_oculi_liturgy_desc:0 "Mediante la recitación de escrituras, el Ojo de Dios puede imponer su dedicación a la causa a otro individuo."
 
 trait_oculi_trust:0 "Confío en ti"
 trait_oculi_trust_desc:0 "Al alabar a Dios, el agente puede infundir en otros el amor por Él y sus leyes."
 
 trait_oculi_wine:0 "Del agua al vino"
 trait_oculi_wine_desc:0 "El inquisidor puede tomar un objeto ordinario y transformarlo en otra cosa o devolver a su estado saludable tejidos muertos o moribundos."
 
 trait_acre_catechumen:0 "Catecúmeno"
 trait_acre_catechumen_desc:0 "Permite al inquisidor ejemplificar sus primeras lecciones de valor, humildad y constancia."
 
 trait_acre_flesh:0 "Transfiguración de la carne"
 trait_acre_flesh_desc:0 "El caballero ha sido investido con el poder de alterar sus capacidades físicas invocando su inquebrantable virtud."
 
 trait_acre_flight:0 "Vuelo de los ángeles"
 trait_acre_flight_desc:0 "Permite al inquisidor cosechar el torbellino divino cuando está en combate con los esbirros de Adversario."
 
 trait_acre_resurrection:0 "Espíritu de la resurrección"
 trait_acre_resurrection_desc:0 "Algunos caballeros están divinamente investidos con el poder de controlar el flujo y reflujo de la fuerza vital dentro de ellos mismos y de los demás."
 
 trait_acre_auto:0 "Auto da Fé"
 trait_acre_auto_desc:0 "Concentrar la virtud y la fuerza de uno en un solo y poderoso golpe".
 
 trait_murnau_knowledge:0 "Conocimiento prohibido"
 trait_murnau_knowledge_desc:0 "Familiaridad innata y capacidad para percibir todo tipo de corrupción".
 
 trait_murnau_oblige:0 "Noblesse Oblige"
 trait_murnau_oblige_desc:0 "Nobleza que inspira a los demás".
 
 trait_murnau_wreathed:0 "Coronado por las sombras"
 trait_murnau_wreathed_desc:0 "Dominio del lado oscuro de la propia naturaleza de los Murnau que les permite afectarlo en los demás."
 
 trait_murnau_mirror:0 "Espejo del mal"
 trait_murnau_mirror_desc:0 "Habilidad para enfrentarse a la oposición sobrenatural en un terreno parejo, armado con fuerza y conocimiento."
  trait_murnau_arcana:0 "Arcanos"
 trait_murnau_arcana_desc:0 "La capacidad de entorpecer, desviar o evitar las acciones de los engendros infernales."
 
 trait_sisters_gospel:0 "Evangelio"
 trait_sisters_gospel_desc:0 "Concede a las hermanas una gran habilidad para el debate, la oratoria y, si es necesario, el interrogatorio."
 
 trait_sisters_lux:0 "Fiat Lux"
 trait_sisters_lux_desc:0 "Haciéndose eco de las palabras del Padre, el inquisidor declama "¡Que se haga la luz!".
 
 trait_sisters_chorale:0 "Coral"
 trait_sisters_chorale_desc:0 "Sacando fuerza, conocimiento o protección de un canto comunitario".
 
 trait_sisters_hosanna:0 "Hosanna"
 trait_sisters_hosanna_desc:0 "Sintonizar el Canto del Cielo para afectar a la materia muerta con la propia voz espiritual."
 
 trait_sisters_oratorio:0 "Oratorio"
 trait_sisters_oratorio_desc:0 "Permite a la hermana elevar su voz en una canción y llenar a los oyentes con el brillante resplandor de su fe, lo cual es una experiencia devastadora para los esclavos del pecado."
 
 trait_red_vigil:0 "Bendita vigilancia"
 trait_red_vigil_desc:0 "Este rito proporciona al sujeto energía que le libera de la necesidad de dormir o descansar."
 
 trait_red_sunstone:0 "Piedra solar"
 trait_red_sunstone_desc:0 "Infunde a una roca ordinaria la bendición de la primera creación del Señor, el Sol."
 
 trait_red_march:0 "Marcha forzada"
 trait_red_march_desc:0 "Este rito permite viajar rápidamente sin importar la fatiga y las condiciones difíciles."
 
 trait_red_fortunes:0 "Fortunas de la guerra"
 trait_red_fortunes_desc:0 "Mediante este rito sagrado, un practicante puede bendecir a un grupo de combatientes armados en su camino para luchar contra el enemigo."
 
 trait_red_forge:0 "Forja de Dios"
 trait_red_forge_desc:0 "Santifica el proceso de forjar un arma para producir armamento bendecido."
 
 trait_yin_imbalanced:0 "Yin"
 trait_yin_imbalanced_desc:0 "Eres una criatura de las sombras y la muerte.Te permite devorar más Chi Yin que el límite de Virtudes Yin sin efectos negativos."
 
 trait_yinyang_balanced:0 "Equilibrado"
 trait_yinyang_balanced_desc:0 "Armonizas los elementos divididos de tu Chi".
 
 trait_yang_imbalanced:0 "Yang"
 trait_yang_imbalanced_desc:0 "Te conviertes en luz y vida.Te permite devorar más Chi Yang que el límite de la Virtud Yang sin efectos negativos."
 
 trait_dharma10:0 "Dharma 10"
 trait_dharma10_desc:0 "Que ha trascendido su Dharma y ha alcanzado las Cien Nubes".
 trait_dharma10_stayed_desc:0 "Llamado como Arhat, que alcanzó el último paso en el Camino de Regreso, y obtuvo la Iluminación. Muchos no dudan y entran en las Cien Nubes en el momento en que pueden hacerlo, pero este puñado se queda en el mundo mortal."
 
 trait_dharma9:0 "Dharma 9"
 trait_dharma9_desc:0 "Llamados como Bodhisattvas, que alcanzaron las etapas finales de sus Dharmas elegidos, necesitando normalmente 1000 años para alcanzar este estado. Pueden alimentarse del Chi ambiental".
 
 trait_dharma8:0 "Dharma 8"
 trait_dharma8_desc:0 "La mayoría de las veces toman el papel de Ancestro, normalmente necesitan 500 años para alcanzar este estado. Puede alimentarse del Chi ambiental".
 
 trait_dharma7:0 "Dharma 7"
 trait_dharma7_desc:0 "Principalmente tomando el rol de Mandarín, también el prerrequisito mínimo para ser un Ancestro, normalmente necesitando 250 años para alcanzar este estado. Puede alimentarse del Chi ambiental".
 
 trait_dharma6:0 "Dharma 6"
 trait_dharma6_desc:0 "Principalmente toma el papel de Jina o Mandarín, normalmente necesita 100 años para alcanzar este estado. Puede alimentarse del Chi ambiental".
 
 trait_dharma5:0 "Dharma 5"
 trait_dharma5_desc:0 "Principalmente toma el papel de Jina, normalmente necesita 25 años para alcanzar este estado. Puede alimentarse del Chi mediante la respiración".
 
 trait_dharma4:0 "Dharma 4"
 trait_dharma4_desc:0 "Principalmente adoptando el papel de Jina, necesitando normalmente 5 años para alcanzar este estado. Alimentándose del Chi por la sangre".
 
 trait_dharma3:0 "Dharma 3"
 trait_dharma3_desc:0 "Discípulo con dharma bajo, normalmente necesita 3 años para alcanzar este estado. Se alimenta del Chi con sangre".
 
 trait_dharma2:0 "Dharma 2"
 trait_dharma2_desc:0 "Discípulo con dharma bajo, normalmente necesita 1 año para alcanzar este estado. Se alimenta del Chi con sangre".
 
 trait_dharma1:0 "Dharma 1"
 trait_dharma1_desc:0 "Discípulo con dharma bajo. Se alimenta de Chi por la sangre".
 
 trait_dharma0:0 "Dharma 0"
 trait_dharma0_desc:0 "Hin，que han sido sacados del estado chih-mei, pero aún no se han incorporado a la sociedad."
 trait_chihmei:0 "Chih-mei"
 trait_chihmei_desc:0 "Una criatura apenas sensible dominada por su hambre de Chi y obligada a vivir de la carne. Un personaje que ha caído en el chih-mei no puede ser interpretado".
 trait_chihmei_dharma_desc:0 "Mediante un ritual, un chih-mei puede ser restaurado al equilibrio dhármico y civilizado, despertando de nuevo su conciencia superior (huno) y convertido en un no-muerto productivo bajo un verdadero dharma."
 
 trait_shih:0 "Shih"
 trait_shih_desc:0 "Las leyendas afirman que los orígenes de los Shih se encuentran en Yi, en la dinastía Shang. Caminan solos en la oscuridad, combatiendo las fuerzas de los Mil Infiernos con nada más que el poder de sus manos y su voluntad. Hace más de 3.000 años, los Shih dieron el primer paso para luchar contra los shen. Aunque las orgullosas casas de los Shih ya no existen, sus tradiciones siguen vivas y el relato de sus inicios es una de sus historias más veneradas. "
 
 trait_little_death:0 "Pequeña muerte"
 trait_little_death_desc:0 "Durante la Pequeña Muerte, el cuerpo del personaje 'muere', pero el alma dual perdura dentro del cadáver. Los Wan Kuei temen la Pequeña Muerte, ya que es un momento angustioso de visiones y pesadillas, en el que el espíritu es bastante vulnerable a las magias hostiles."
 
 trait_ha_holy_bulwark:0 "Baluarte sagrado"
 trait_ha_holy_bulwark_desc:0 "Este personaje no puede estar unido por sangre".
 
 trait_demonic_plague:0 "Plaga demoníaca"
 trait_demonic_plague_desc:0 "Resultado de una maldición verdaderamente diabólica, la plaga demoníaca es una enfermedad altamente infecciosa y mortal que afecta a los parientes tanto como a los mortales. Y lo que es peor, la enfermedad impide a los vampiros curarse de cualquier manera, y provoca heridas progresivamente peores a medida que la carne se desgarra."
 
 trait_demonic_plague_non_infectious:0 "Plaga demoníaca"
 trait_demonic_plague_non_infectious_desc:0 "Resultado de una maldición verdaderamente diabólica, la plaga demoníaca es una enfermedad mortal que afecta a los afines tanto como a los mortales. Y lo que es peor, la enfermedad impide a los vampiros curarse de cualquier manera, y conduce a heridas progresivamente peores a medida que la carne se desgarra."
 
 trait_demonic_plague_non_lethal:0 "Plaga demoníaca"
 trait_demonic_plague_non_lethal_desc:0 "Resultado de una maldición verdaderamente diabólica, la plaga demoníaca es una enfermedad altamente infecciosa que afecta a los afines tanto como a los mortales. Peor aún, la enfermedad impide a los vampiros curarse de cualquier manera"
 
 trait_demonic_plague_non_lethal_and_infectious:0 "Plaga demoníaca"
 trait_demonic_plague_non_lethal_and_infectious_desc:0 "Resultado de una maldición verdaderamente diabólica, la plaga demoníaca es una enfermedad que afecta a los afines tanto como a los mortales. Peor aún, la enfermedad impide a los vampiros curarse de cualquier manera"
  
