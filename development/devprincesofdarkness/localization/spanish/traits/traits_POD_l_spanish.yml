 trait_akuma:0 "Akuma"
 trait_akuma_desc:0 "Los akuma, o comidos por el diablo, son individuos que han abandonado la virtud y han echado su suerte con los Reyes Yama."
 
 trait_mummy:0 "Momia"
 trait_mummy_desc:0 "Las momias, también llamadas los No Moribundos o Renacidos, son inmortales cuyos cuerpos han sido conservados ritualmente."
 
 trait_shemsuheru:0 "Shemsu-Heru"
 trait_shemsuheru_desc:0 "Tiene que haber un primero, y entre los inmortales ese honor se concede a los Shemsu-Heru, los amigos o compañeros de Horus. Creados por Isis y su hermana, originalmente para seguir y servir a su hijo Horus, son los No Muertos más antiguos del mundo."
 
 trait_wutian:0 "Wu T'ian"
 trait_wutian_desc:0 "Los Wu T'ian, la Familia del Cielo, fueron alumnos de grandes sabios, recibieron el elixir de la vida eterna de los Ocho Inmortales a cambio de su servicio eterno al Tao."
 trait_wukuei:0 "Wu Kuei"
 trait_wukuei_desc:0 "Los Wu Kuei, la Familia de los Demonios, son los inmortales de Yomi, Wu T'ian renegados que vendieron sus almas al infierno por seguridad en los albores de la Sexta Edad."
 
 trait_effigy:0 "Efigie"
 trait_effigy_desc:0 "Pequeña estatuilla que puede asignarse a tareas".
 
 trait_frozen:0 "Congelado"
 trait_frozen_desc:0 "Congelado, incapaz de hacer nada".
 trait_deactivated:0 "Desactivado"
 trait_deactivated_desc:0 "Desactivado, dejó de consumir la energía de su momia creadora".