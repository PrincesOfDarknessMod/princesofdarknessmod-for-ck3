 #Cazador
 hunter_faction:0 "La represión de la Inquisición"
 hunter_faction_desc:0 "Los señores vampiros con demasiada exposición y muy poco control se arriesgan a atraer la atención de la Inquisición."
 hunter_faction_short_effect_desc:0 "Quiere liberar a su pueblo de, bueno, usted".
 hunter_faction_every_county:0 "Todos los condados de la facción"
 FACTION_DEMAND_HUNTER:1 "Al [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_HUNTER_DESC:0 "Engendro del infierno, prepárate para enfrentarte al abismo que te vio nacer. Tu impío control sobre las pobres almas de este reino termina ahora!"
 FACTION_DEMAND_HUNTER_ACCEPT:0 "No estoy preparado para luchar contra esos cazadores..."
 FACTION_DEMAND_HUNTER_REFUSE:0 "¡Nunca! Vamos a aplastar a estos glorificados mortales en la batalla!"
 FACTION_HUNTER_NAME:0 "Célula de la Inquisición"
 FACTION_HUNTER_TITLE_NAME:0 "Célula de la Inquisición"
 hunter_faction_event_troops:0 "Inquisitorium Militum"
 pod_factions.1103.t:0 "¡Estás derrotado!"
 pod_factions.1103.desc:0 "A pesar de vuestra defensa concertada, los cazadores han abrumado la mayor parte de vuestro reino, desarraigando vuestra red de influencia cuidadosamente construida a través de él. Tu prestigio está muy dañado, y tu autoridad está bajo mínimos. Los buitres están observando... y los cazadores podrían volver en cualquier momento. Podrías arrastrarte de esto, pero te costaría mucho. Por lo tanto, el sueño de las edades es una perspectiva tentadora. El tiempo no es una preocupación de todos modos..."
 pod_factions.1103.a:0 "Volveré"
 pod_factions.1103.b:0 "¡Aún no he terminado!"
