# Animalismo #
 
ANIMAL_DOMINION_PERK_EFFECT:0 "'¿Perros salvajes? ¡No! ¡Ratas!' \n \nEl poder que el vampiro tiene sobre las bestias ahora es lo suficientemente grande como para comandar bandadas y manadas como si fueran extensiones de su propio cuerpo. Como interacción de personajes, puedes engendrar un ejército de animales".
ANIMAL_SUCCULENCE_PERK_EFFECT:0 "El vampiro puede saciar Hambre adicional alimentándose de animales. Como interacción de personajes, puedes drenar animales con mejores resultados que otros vampiros".
BOND_FAMULUS_PERK_EFFECT:0 "Como interacción de personajes, puedes [bind_famulus|E], vincular sangre a un animal y formar un vínculo mental con él".
DRAWING_OUT_THE_BEAST_PERK_EFFECT:0 "El vampiro puede proyectar su Bestia en el momento del frenesí, transfiriéndola a un sujeto cercano, ya sea mortal o vampiro".
FERAL_WHISPERS_PERK_EFFECT:0 "El vampiro puede comunicarse con las bestias de la naturaleza y la ciudad, lo que le permite persuadir a los animales para que presten servicios para ellos, aunque, como los humanos, los animales rara vez aceptan cosas que van en contra de su naturaleza o los ponen en peligro".
QUELL_THE_BEAST_PERK_EFFECT:0 "Al mirar fijamente a un objetivo, el vampiro acobarda a su bestia interior para que entre en un sueño temporal".
SENSE_THE_BEAST_PERK_EFFECT:0 "El vampiro puede sentir a la Bestia presente en los mortales, vampiros y otros seres sobrenaturales, adquiriendo una idea de su naturaleza, hambre y hostilidad".
SUBSUME_THE_SPIRIT_PERK_EFFECT:0 "El vampiro puede transferir completamente su mente al cuerpo de un animal. Puede controlar al animal y usar sus sentidos libremente, incluso durante el día si logra mantenerse despierto".

# auspex #
 
CLAIRVOYANCE_PERK_EFFECT:0 "Al cerrar los ojos y entrar en un ligero trance, el vampiro se convierte en dueño de su entorno".
HEIGHTENED_SENSES_PERK_EFFECT:0 "Los sentidos de los vampiros se agudizan hasta un grado sobrenatural, lo que les otorga la capacidad de ver en la oscuridad total, escuchar frecuencias ultrasónicas y oler el miedo de una presa acobardada. \n \nPuedes escapar de la prisión a través de una decisión".
PREMONITION_PERK_EFFECT:0 "El vampiro experimenta destellos de perspicacia. Estos pueden tomar la forma de erupciones, inspiración repentina o incluso visiones vívidas. Aunque nunca demasiado precisas, estas visiones pueden empujar al vampiro fuera de peligro o revelar una verdad previamente pasada por alto. \n \nMejora tu tarea de maestro de espías Encontrar secretos".
SCRY_THE_SOUL_PERK_EFFECT:0 "Al enfocarse en una persona, el vampiro puede percibir el estado de la psique de esa persona como un aura cambiante de colores. Las auras revelan poca información precisa, pero brindan pistas sobre muchos temas, por ejemplo, el estado emocional, la resonancia y los efectos sobrenaturales. rasgos. \n \nPuedes elegir qué tipo de resonancia tendrán los mortales encontrados a través de la interacción de personajes Find Mortals"
SENSE_THE_UNSEEN_PERK_EFFECT:0 "Los sentidos del vampiro se sintonizan con dimensiones más allá de lo mundano, lo que les permite sentir presencias que de otro modo estarían ocultas a simple vista".
SHARE_THE_SENSES_PERK_EFFECT:0 "Al comunicarse con su mente, el vampiro puede acceder a los sentidos de otro mortal o vampiro, viendo, escuchando y sintiendo lo que hace".
SPIRITS_TOUCH_PERK_EFFECT:0 "Al tocar un objeto inanimado o el suelo, el vampiro puede sentir residuos emocionales. Quienes han tocado ese objeto o recorrido este camino en el pasado dejan pistas para el lector experto."
TELEPATHY_PERK_EFFECT:0 "En los niveles más altos de Auspex, el vampiro ahora puede literalmente leer la mente, así como proyectar sus propios pensamientos en la mente de los demás. \n \nPuedes usar la interacción del personaje Telepatía para encontrar secretos".

