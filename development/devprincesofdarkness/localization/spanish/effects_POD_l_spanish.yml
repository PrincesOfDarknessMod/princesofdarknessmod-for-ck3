BIND_THE_DEAD_PERK_EFFECT:0 "#Bold Desbloquear $POD_bind_interaction$ [interacción|E]. Desbloquear $POD_command_wraith_interaction$ [interacción|E].#!\nLa Momia puede obligar a un espectro a realizar una tarea específica."
FERTILITY_OF_OSIRIS_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nEl ritual permite que un hombre muerto embarace a una mujer mortal viva."
REVISIT_DEATH_PERK_EFFECT:0 "Al tocar la piel de un cadáver, la momia puede revivir las últimas experiencias de este cuerpo".
SENSE_THE_DEAD_PERK_EFFECT:0 "La momia puede sentir si un espectro la observa o está cerca".
STORM_SHIELD_PERK_EFFECT:0 "Al canalizar su Sekhem, la Momia puede erigir protecciones contra las tormentas en el Inframundo, así como Espectros y criaturas similares".
BIND_THE_LIVING_PERK_EFFECT:0 "#Bold Desbloquea la opción de ejecución $EXECUTION_CONVERT_TO_WRAITH$.#!\nLa Momia puede lanzar un ritual que asegurará que la persona permanezca como un Espectro".
DEATHS_HAND_PERK_EFFECT:0 "La momia puede canalizar el plasma puro del inframundo contra sus enemigos con un toque".
MANIFESTATION_PERK_EFFECT:0 "Mientras esté en Duat, la momia puede manifestar su alma como una aparición translúcida en el mundo de los vivos".
SEPARATE_BA_PERK_EFFECT:0 "#Bold Desbloquear '$travel_to_umbra_decision$' [decisión|E].#!\nLa Momia puede entrar en cualquier Umbra como desee."
SHADOW_PORTAL_PERK_EFFECT:0 "La momia puede crear un portal dentro del inframundo que permite un movimiento rápido".
AMENTIS_GRACE_PERK_EFFECT:0 "Con este ritual, una momia puede crear una protección para formar un Reino de las Sombras temporal".
KHAIBITS_EMBRACE_PERK_EFFECT:0 "La momia puede sellar a un objetivo mortal en un cofre de ectoplasma negro".
SEVER_SOUL_PERK_EFFECT:0 "La Momia puede separar la conexión entre una criatura sobrenatural que ha abandonado su cuerpo y el cuerpo mismo."
SIN_EATING_PERK_EFFECT:0 "La momia puede absolver a un objetivo de impulsos negativos intensos o incluso de pasiones oscuras".
CALL_THE_KHAIBIT_PERK_EFFECT:0 "En el momento de la muerte, una Momia puede separar la Sombra de un alma, permitiéndole morir mientras su khaibit permanece como Espectro".
ENTRAP_THE_BA_PERK_EFFECT:0 "La momia puede atrapar el espíritu o el alma de un objetivo y sellarlo en un recipiente preparado específicamente".
HEART_OF_LIFE_PERK_EFFECT:0 "Después de cortar una parte de su cuerpo, como una mano o su cabeza, la Momia puede reanimar esta parte cuando está en su ciclo de muerte para acceder al mundo de los vivos".
PANOPLY_OF_SHADOW_PERK_EFFECT:0 "Al invocar la fuerza del olvido, la Momia puede envolverse en su propia sombra para convertirse en una criatura intangible que puede negar cualquier ataque físico".
RESHAPE_THE_LOST_SOUL_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nLa momia puede alterar las pasiones de un espectro".
SCOURING_OBLIVION_PERK_EFFECT:0 "La Momia puede curar a los seres vivos extrayendo la energía de la muerte de sus cuerpos."
ASPECT_OF_DUAT_PERK_EFFECT:0 "La Momia puede moldear su forma en el Inframundo a su voluntad."
CALL_FORTH_THE_REAVERS_OF_UR_PERK_EFFECT:0 "La momia invoca un enjambre de horrendas formas grises onduladas desde un lugar desconocido para acabar con los enemigos de forma espantosa".
EATING_THE_HEART_PERK_EFFECT:0 "La momia crea un corazón falso para engañar a los jueces de Ma'at durante un período de tiempo limitado".
GIFT_OF_PURPOSE_PERK_EFFECT:0 "La momia puede transferir partes de su propio impulso interno a un objetivo".
KHU_OF_TWO_LANDS_PERK_EFFECT:0 "La momia puede interactuar con el mundo material y el inframundo sin penalización".
LIGHTEN_THE_SHADOW_PERK_EFFECT:0 "La momia puede calmar los lados más oscuros de un objetivo, por ejemplo, sacando a un vampiro del frenesí".
LOYAL_COMPANION_PERK_EFFECT:0 "#Bold Tus mascotas y caballos de guerra resucitarán cuando mueran.#!\nDespués de momificar a un animal específicamente leal, la momia puede resucitarlo como sirviente espectral".
OPEN_THE_SEBKHET_PERK_EFFECT:0 "La momia rasga la Sábana Santa y permite que él y otras personas entren en Duat".
SHADOW_TALISMAN_PERK_EFFECT:0 "La momia puede llevarse el amuleto que creó mediante el amuleto Hekau al inframundo".
SPEAR_OF_ANUBIS_PERK_EFFECT:0 "Al abrirse la palma de la mano, la Momia puede manifestar el poder del olvido en una lanza oscura que inflige daño agravado y pasa por alto cualquier protección mundana".
WALKING_IN_THE_SHADOW_OF_ANUBIS_PERK_EFFECT:0 "La Momia puede viajar instantáneamente por los distintos mundos de los Tellurian, siempre que sepa de su existencia."
CASTING_AWAY_PERK_EFFECT:0 "La momia puede arrojar a su objetivo hacia los vientos embravecidos de la tempestad".
DARK_WALL_OF_HATSHEPSUT_PERK_EFFECT:0 "Desarrollado por Shemsu-Heru Hatshepsut como una variación menor del Rito del Rey Sol, este hechizo crea un muro de Sekhem que impide que cualquier espíritu lo cruce y levanta el Sudario local".
EMPOWER_BA_PERK_EFFECT:0 "La Momia puede fortalecer su ba para regresar más rápido a su cadáver."
EMPOWER_KA_PERK_EFFECT:0 "La momia fortalece su ka para proteger su cuerpo de manera más eficiente durante su ciclo de muerte".
HEART_OF_REINCARNATION_PERK_EFFECT:0 "Al infundir su esencia en un objeto pequeño, la momia puede eludir la destrucción total de su cuerpo al reencarnarse en el hijo de la próxima mujer que toque el objeto".
SEPARATE_KHAIBIT_PERK_EFFECT:0 "La Momia puede cortar su propio khaibit, transformándolo en una criatura parecida a un espectro que actúa a instancias de su creador."
SPIRIT_THE_BODY_AWAY_PERK_EFFECT:0 "La Momia puede convertir la carne muerta en plasma, llevando su cuerpo a través de la Sábana Santa".
TRANSFIXING_GAZE_PERK_EFFECT:0 "Con una mirada, la Momia puede agitar al Khaibit en un objetivo, paralizándolo por un corto período de tiempo".
BARRING_THE_GATES_PERK_EFFECT:0 "#Bold Desbloquear '$fortalecer_o_debilitar_el_sudario_decisión$' [decisión|E].#!\nLa Momia puede aumentar la fuerza del Sudario local para evitar incursiones espectrales".
CALL_OF_OBLIVION_PERK_EFFECT:0 "La Momia saca inmediatamente el alma de su objetivo de su cuerpo, pasando al destino que le espera".
PROMISE_MADE_BEFORE_AMMUTS_SCALES_PERK_EFFECT:0 "La momia puede transferir un fragmento del Hechizo de la vida a un mortal voluntario después de consultar con los jueces de Ma'at sobre el caso".
UNMAKING_PERK_EFFECT:0 "La Momia puede arrojar cualquier cosa al Pozo del Vacío, borrándolo de la existencia".
 
