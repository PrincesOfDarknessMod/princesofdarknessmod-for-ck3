# KJ legado #
 
 DARK_WHISPERS_PERK_EFFECT:0 "Con esta habilidad, un personaje puede usar las sombras cercanas para proyectar sus sentimientos."
FUXI_LEGACY_PERK_EFFECT:0 "Fuxi, el primero de los Tres Soberanos, enseñó a su pueblo a pescar y cazar, a criar ganado y gusanos de seda y a construir viviendas permanentes. Fuxi también creó los ocho trigramas utilizados para la adivinación con El Libro de los Cambios."
 DARKSIGHT_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de la generación 3-7 pueden comprar este beneficio. Mejora el poder de [abyss_eyes|E]."
SHENNONG_LEGACY_PERK_EFFECT:0 "Shennong, el segundo de los Tres Soberanos, mostró a su pueblo el arado y el tejido y cómo hacer los sacrificios apropiados para los poderes del Cielo. Shennong también fue el primer médico".
HUANGTI_LEGACY_PERK_EFFECT:0 "Huang-ti fue el tercero de los Tres Soberanos. Fue el primer alquimista y el primer constructor de barcos. También desarrolló armaduras y los primeros ejércitos para reprimir a las tribus bárbaras que amenazaban a su pueblo."

# Obtenebración #
 
EYES_OF_THE_ABYSS_PERK_EFFECT:0 "Desbloquea [abyss_eyes|E] poder".
SHADOW_PLAY_PERK_EFFECT:0 "Si bien esta habilidad no permite que los personajes creen sombras que aún no existen, permite manipular, mover y animar las sombras ambientales. Esto puede otorgar efectos sociales, como usar sombras para hacerte más imponente, o configura un entorno a tu medida, creando zonas de sombra en las que esconder a una persona u objeto".
NOCTURNE_PERK_EFFECT:0 "Desbloquea el poder [nocturne|E]. Desventaja actual para los enemigos: -2 destreza".
NIGHT_SHADES_PERK_EFFECT:0 "Te permite invocar Sombras como personales, usando Spawn Army personal [character_interaction|E]".
ARMS_OF_AHRIMAN_PERK_EFFECT:0 "Con esta habilidad, un Lasombra convierte la oscuridad en tentáculos que pueden atacar, contener y agarrar a los enemigos".
TENEBROUS_AVATAR_OBTENEBRATION_PERK_EFFECT:0 "Desbloquea [tenebrous_avatar|E] poder".
THE_DARKNESS_WITHIN_PERK_EFFECT:0 "Mejora el poder [nocturno|E]. Desventaja actual para los enemigos: -3 destreza".
OUBLIETTE_PERK_EFFECT:0 "Desbloquea esquema [secuestro|E]"
WALK_THE_ABYSS_PERK_EFFECT:0 "Al atravesar el Abismo, esta habilidad permite a un personaje entrar en un parche de oscuridad y emerger de un segundo parche de oscuridad dentro de la vista. Los personajes también pueden usar esta habilidad para extender su alcance hacia una sombra y agarrar algo al alcance de la vista. una segunda sombra".
DRAIN_THE_LIFE_PERK_EFFECT:0 "Desbloquea el poder [drain_the_life|E]".
DARK_WHISTERS_PERK_EFFECT:0 "Con esta habilidad, un personaje puede usar las sombras cercanas para proyectar sus sentimientos".
GOD_IN_DARKNESS_PERK_EFFECT:0 "Mejora el poder [tenebrous_avatar|E]".
DARKSIGHT_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 7.ª generación pueden comprar esta ventaja. Mejora el poder de [abyss_eyes|E].
SHADOWSTEP_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 7.ª generación pueden comprar esta ventaja. El vampiro desaparece en la sombra, patina por el Laberinto para resurgir después de viajar a través de algo más repugnante que la muerte y el doble de hambriento. Entran en una sombra lo suficientemente grande como para cubrirlos, y resurgir de uno que puedan ver".
 hunger_increase_effect.tt:0 "El hambre aumentará."
 hunger_decrease_effect.tt:0 "El hambre disminuirá."
SHADOW_TWIN_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 6.ª generación pueden comprar esta ventaja. Desbloquea el poder [shadow_twin|E]".
AEGIS_OF_SHADOWS_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de tercera a quinta generación pueden comprar esta ventaja. Cúbrete con una poderosa armadura de sombra".
DEVOUR_ALL_HOPE_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 5.ª generación pueden comprar esta ventaja. Mejora el poder [nocturno|E]. Desventaja actual para los enemigos: -5 destreza"
AHRIMANS_DEMESNE_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª y 4.ª generación pueden comprar esta ventaja. Mejora el poder de [drain_the_life|E]. Ahora puede debilitar reinos enteros, sin importar el tamaño".
 
