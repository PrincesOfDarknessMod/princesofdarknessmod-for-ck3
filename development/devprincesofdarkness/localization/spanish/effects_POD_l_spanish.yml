CORRUPTION_OF_THE_BLOOD_PERK_EFFECT:0 "#Bonificación audaz para matar al caballero enemigo en combate.#!\nTe permite hacer que la sangre de la víctima se vuelva tóxica".
BLOOD_LEECHING_PERK_EFFECT:0 "#Bonificación audaz para matar al caballero enemigo en combate.#!\nTe permite reventar la sangre de la víctima de tus poros".
 
# Fantasma-Llama Shintai #

GOBLIN_FACE_PERK_EFFECT:0 "#Bold Desbloquea una opción de cambio de forma.#!\nLos orificios de tu cara comienzan a arder con calor, lo que te permite ver en la oscuridad total e infligir un mayor daño con tu mordisco".
GOBLIN_SPARK_PERK_EFFECT:0 "Te permite invocar una pequeña bola de fuego espiritual que en realidad no puede dañar nada, pero emite una luz suave y puede torcerse en varias formas según los deseos de su creador".
GOBLIN_SHAPES_PERK_EFFECT:0 "Te permite transformar las llamas en varias formas según tus deseos".
GOBLIN_SCORCH_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonificación para causar brutal mutilación al caballero enemigo en combate.#!\nTe permite exhalar una gota de llamas espirituales".
GOBLIN_LANTERN_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Desbloquea una opción de cambio de forma. Bonificación para causar mutilación brutal al caballero enemigo en combate.#!\nTe permite encender temporalmente tu forma, incluso permitiéndote convertirte en un orbe de fuego brillante."
GOBLIN_SWORD_PERK_EFFECT:0 "#Bonus audaz para mutilar al caballero enemigo en combate.#!\nTe permite manifestar una espada de fuego en tu mano que puede dañar tanto objetos físicos como espirituales".
GOBLIN_PORTAL_PERK_EFFECT:0 "Te permite usar el fuego como puerta de entrada para teletransportarte a cualquier otra llama dentro de un radio determinado".
GOBLIN_CALL_PERK_EFFECT:0 "#Bold Añade más posibilidades de calmar a un espíritu local en la '$POD_calm_local_spirit_interaction$' [interacción|E].#!\nTe permite invocar espíritus de fuego de los mundos Yin o Yang para que cumplan tus órdenes. "
MANTLE_OF_THE_FLAME_EMPEROR_PERK_EFFECT:0 "#Bonificación audaz para matar al caballero enemigo en combate.#!\nCon una orden breve, puedes hacer que otra persona se queme por dentro al consumir su chi interno".
 
# Jade Shintai #

STAND_UPON_THE_DRAGONS_BACK_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo.#!\nTe permite canalizar Chi de los flujos naturales de la Tierra hacia tu cuerpo, y viceversa, enraizándote en la Tierra".
TREAD_THE_THRASHING_DRAGONS_TAIL_PERK_EFFECT:0 "Al polarizar tu Chi de acuerdo con el de tu entorno, te vuelves sobrenaturalmente diestro y ligero. Puedes caminar con seguridad y firmeza a lo largo de los salientes más estrechos, el suelo más inestable e incluso la superficie de lagos u océanos. "
PLACATE_THE_EARTH_DRAGON_PERK_EFFECT:0 "#Bonus audaz para una opción de espía.#!\nAl cantar suavemente a los espíritus de la tierra, la piedra y la madera, puedes lanzarte a su abrazo".
HARNESSING_THE_DRAGONS_BREATH_PERK_EFFECT:0 "Al sintonizar su cuerpo con las corrientes locales de Chi, en realidad puede volar con "corrientes ascendentes" de energía".
JADE_SERVANT_OF_THE_AUGUST_PERSONAGE_PERK_EFFECT:0 "#Bold Desbloquea varias opciones de cambio de forma.#!\nLa máxima sintonía de Chi con el entorno, este poder se basa en la teoría de los Cinco Elementos, así como en un gran dominio del Chi. Puedes canalizar energías espirituales de los Cinco Elementos clásicos: Metal , madera, agua, fuego y tierra, a través de su forma, obteniendo así las propiedades del elemento en el proceso".
STONE_FISH_PERK_EFFECT:0 "Aprendes a ser uno con la tierra, literalmente. Puedes hundirte en ella con la misma facilidad con que un hombre se sumerge en un estanque de agua".
BLADE_OF_STONE_PERK_EFFECT:0 "#Bold Bonus para mutilar al caballero enemigo en combate.#!\nTe permite crear armas de piedra, no solo espadas, sino cualquier tipo de arma cuerpo a cuerpo".
TASTE_OF_JADE_PERK_EFFECT:0 " Te permite sintonizar una pieza de jade común con las energías chi, convirtiéndola en una pieza de jade verdadero durante un tiempo".
AUGMENT_PERK_EFFECT:0 "Te permite sintonizarte con el Chi ambiental en un área, además de mejorarlo y aumentar su poder".
 
# Yin Prana #

SHROUDED_MOON_PERK_EFFECT:0 "#Bold Desbloquea una opción de cambio de forma.#!\nTe permite volverte invisible vistiéndote de sombras."
YIN_MANTLE_PERK_EFFECT:0 "Te permite canalizar tu energía Yin interna en un animus que te envuelve. Este animus, o manto, es invisible para los mortales, pero para ellos es como una brisa fría en el aire".
BONE_DANCE_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonus para causar lesiones graves al caballero enemigo en combate.#!\nAl realizar una serie de posturas complicadas y dolorosas, puedes canalizar la energía Yin en un área, volviendo letárgicos a todos."
EIGHTFOLD_YIN_MANTLE_PERK_EFFECT:0 "Al igual que el manto Yin inicial, solo que la energía Yin se manifiesta como un aura negra crepitante de energía Yin que puede moldearse según los deseos del usuario".
SEMBLANCE_OF_THE_EBON_DRAGON_PERK_EFFECT:0 "#Bold Desbloquea una opción de cambio de forma. Desbloquea '$travel_to_yin_world_decision$' [decisión|E].#!\nPermite que te vuelvas insustancial a medida que tu masa corporal cambia al Mundo Yin".
YIN_SHIELD_PERK_EFFECT:0 "Conviertes tu ánimus Yin en un caparazón protector alrededor de tu cuerpo".
YIN_NIHILUS_PERK_EFFECT:0 "#Bold Bonus para mutilar al caballero enemigo en combate.#!\nTe permite crear un halo letal de energía Yin que chamusca a todos los que están cerca del usuario".
TOUCH_OF_RUST_PERK_EFFECT:0 "#Bonificación audaz para matar al caballero enemigo en combate.#!\nPuedes hacer que cualquier tipo de metal se derrumbe rápidamente".
IRON_CORPSE_PERK_EFFECT:0 "#Bold Desbloquea una opción de cambio de forma.#!\nTe permite transformar tu propia carne en metal. De esta forma, tus habilidades de combate aumentan a medida que tus dedos se convierten en garras afiladas, pero en el lado negativo, no puedes nadar ."
 
# Yang Prana #

PRINCIPLE_OF_MOTION_PERK_EFFECT:0 "Amplifica los movimientos con Yang Chi".
YANG_MANTLE_PERK_EFFECT:0 "Te permite sintonizar tu chi interno con el aura de una persona viva, haciéndote parecer mucho más amable y atractivo".
DRAGON_DANCE_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonificación para causar lesiones graves al caballero enemigo en combate.#!\nA través de una serie de saltos salvajes, katas acrobáticos y posturas yóguicas, entra en trance de batalla. Capaz de impresionantes hazañas de combate mientras está en este estado."
EIGHTFOLD_YANG_MANTLE_PERK_EFFECT:0 "Al igual que el manto Yang inicial, solo que la energía Yang se manifiesta como un aura carmesí turbulenta de energía Yang que puede moldearse según los deseos del usuario".
SEMBLANCE_OF_THE_SCALET_QUEEN_PERK_EFFECT:0 "#Bold Desbloquea una opción de cambio de forma. Desbloquea '$travel_to_yang_world_decision$' [decisión|E].#!\nPermite que te vuelvas insustancial, ya que tu masa corporal cambia al Mundo Yang".
YANG_SHIELD_PERK_EFFECT:0 "Transformas tu animus Yang en un aura brillante alrededor de tu cuerpo que te protege."
YANG_PHOENIX_PERK_EFFECT:0 "#Bold Bonus para mutilar al caballero enemigo en combate.#!\nTe permite crear llamas escarlatas de pura energía Yang que chamuscan a todos los que están cerca del usuario".
TOUCH_OF_CORRUPTION_PERK_EFFECT:0 "#Bonificación audaz para matar al caballero enemigo en combate.#!\nTe permite hacer que la madera o cualquier otro material orgánico se deteriore rápidamente, rellenando tus propias reservas de chi".
OAKEN_CORPSE_PERK_EFFECT:0 "#Bold Desbloquea una opción de cambio de forma.#!\nTe permite transformar tu propia carne en madera. De esta forma, tus habilidades de combate aumentan a medida que tus dedos se convierten en estacas mortales y flotarán en el agua".
 
# Equilibrio #

MASTER_FLOW_PERK_EFFECT:0 "#Bold No obtendrás más modificador negativo de desequilibrio temporal cuando hayas gastado todo el chi de un aspecto.#!\nTe permitirá controlar el flujo de chi dentro de tu cuerpo de manera más eficiente".
ADJUST_BALANCE_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre. Bonificación por causar lesiones graves al caballero enemigo en combate.#!\nPermite crear variantes menores del equilibrio interno de chi de un objetivo, lo que posiblemente desequilibrios o curarlos".
SHIFT_THE_BALANCE_PERK_EFFECT:0 "#Bold Bonus a la [interacción|E] del mismo nombre.#!\nLe permite alterar su equilibrio de chi interno, convirtiéndose en Yin o Yang desequilibrado".
CHI_INTERRUPT_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonus para causar mutilaciones brutales al caballero enemigo en combate.#!\nTe permite detener el flujo interno de chi dentro de un objetivo, causando espasmos dolorosos".
CHI_MASTERY_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre. Bonificación para causar mutilación brutal al caballero enemigo en combate.#!\nTe permite drenar el chi de tu objetivo o corromperlo voluntariamente dentro del cuerpo".
SOOTHING_THE_SOUL_PERK_EFFECT:0 "#Bold Bonus para mutilar al caballero enemigo en combate.#!\nAl eliminar las inconsistencias y los remolinos en el flujo de Chi de un sujeto, puedes hacer que tu objetivo se vuelva letárgico en paz interior, similar a los efectos del Beso ."
ACCENTUATE_CHI_PERK_EFFECT:0 "Puedes hacer que el objetivo experimente cambios extremos de humor y energía. Las energías Yin hacen que la víctima se vuelva lánguida, embotada y lenta, mientras que las energías Yang hacen que el sujeto se sienta inquieto y agitado".
OPENING_THE_GATES_PERK_EFFECT:0 "#Bonificación audaz para matar al caballero enemigo en combate.#!\nPuedes hacer que Chi queme a tu objetivo desde adentro hacia afuera"
ADJUST_THE_TRUE_BALANCE_PERK_EFFECT:0 "#Bold Bonificación al 'ajuste de equilibrio' [interacción|E]. Bonificación por matar al caballero enemigo en combate.#!\nPuedes crear un desequilibrio de chi permanente dentro de tu objetivo. Alternativamente, puede disipar desequilibrios duraderos y incluso curar enfermedades como el cáncer dentro de un objetivo mortal".
 
# Tapiz #

SPIRIT_CALL_PERK_EFFECT:0 "#Bold Desbloquea $POD_marked_for_return_interaction$ [interacción|E]. Añade más posibilidades de calmar un espíritu local en '$POD_calm_local_spirit_interaction$' [interacción|E].#!\nAtrae a los espíritus o espectros cercanos hacia ti."
CHI_WARD_PERK_EFFECT:0 "#Bold Desbloquea '$strengthening_or_weakening_the_wall_decision$' [decisión|E].#!\nTe permite afectar la clasificación local del Muro".
CHI_SHAPING_PERK_EFFECT:0 "#Bold Te permite mejorar el control del edificio Dragon Line.#!\nTe permite manipular las corrientes de chi debajo de la tierra para una variedad de efectos, como invocar joss, debilitar los ataques basados en chi o atrapar el espíritu local ."
RIDE_THE_DRAGON_PERK_EFFECT:0 "Te permite viajar a lo largo de una Línea Dragón, teletransportándote a través de ella".
CHI_RIFT_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nTe permite crear un portal entre el Reino Medio y los reinos espirituales, desatando una tempestad de chi elemental que causa estragos en un área."
CELESTIAL_NEEDLE_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nPuedes reparar Chi Rifts abiertas y otras brechas entre los mundos".
DRAGON_CHARIOT_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nPuedes viajar con varios compañeros junto a un Dragon Line."
CHI_CASTLE_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nPuedes formar un nido de dragón temporal, alterando así el equilibrio espiritual e invocando la ira de los espíritus y otros shen".
THE_DRAGONS_RAPINE_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nTe permite lanzar a un oponente a lo largo de una línea de dragón, capaz de expulsarlo del flujo en cualquier lugar, incluso en objetos sólidos".
 
# Chi'iu Muh #
 
RASA_PERK_EFFECT:0 "Atrapa destellos de eras pasadas y futuras".
CHI_SIGHT_PERK_EFFECT:0 "Siente el mundo de los espíritus tan claramente como el mundo material".
DRAGON_WARD_PERK_EFFECT:0 "¡#Bold Desbloquea movimientos de duelo#!\nTe permite crear una barrera de chi que aleja a los atacantes".
PURIFICATION_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nEste poder, un legado de días más nobles, fue utilizado por los antiguos Wan Xian para limpiar a sus súbditos mortales y dominios de la contaminación demoníaca. "
 EVOCATION_OF_MADNESS_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nPermite que tu víctima se rinda a su P'o Nature por un breve momento, el más breve de los momentos, quizás, pero siempre lo suficiente como para deformar el mente de la víctima."
SPIRIT_EATING_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre. Bonificación para causar mutilaciones brutales al caballero enemigo en combate.#!\nTe permite cortar los lazos que unen un alma a su cuerpo para purificarla o devorarlo".
SHIELD_OF_THE_SOUL_PERK_EFFECT:0 "Protege tu propia alma contra los ataques de otros seres sobrenaturales".
BANKING_THE_FIRE_CALMING_THE_WAVES_PERK_EFFECT:0 "Con solo un toque, puedes sacar a uno de tus hermanos del tumultuoso control de sus almas, restaurando su equilibrio".
SOUL_TAINT_PERK_EFFECT:0 "Puedes hacer que tu víctima desagrada a cualquier persona en tu presencia después de tocarla brevemente".
SOUL_EXCHANGE_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nTe permite cambiar el alma de cualquier persona por la de otra."
 
# Cultivo #

SCRUTINIZE_PERK_EFFECT:0 "#Bold Desbloquea una opción de espionaje.#!\nSe vuelve al tanto de los oscuros impulsos dentro de ti y de los demás."
CLEAVE_THE_DEMON_PERK_EFFECT:0 "#Bold Desbloquea una opción de manipulación de po.#!\nTe permite separar tu P'o de tu Hun, dejando la otra parte del alma en forma de espíritu".
LASH_THE_DEMON_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nTe permite separar otros shen de sus lados más oscuros".
YOKE_THE_DEMON_PERK_EFFECT:0 "#Bold Desbloquea una opción de manipulación de po.#!\nTe permite arrancar el P'o del huno y subordinar al demonio interno. Un demonio así subordinado puede usarse para intimidar a criaturas menores y vigilar a los enemigos".
TWO_BECOME_ONE_PERK_EFFECT:0 "#Bold Desbloquea una opción de manipulación de po.#!\nTe permite fusionar temporalmente tu Hun y P'o, dándote una muestra de la Iluminación que puede enviarte a la depravación en espiral aún más rápido".
EVOCATION_OF_MADNESS_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nPermite que tu víctima se rinda a su P'o Naturaleza por un corto tiempo, el más breve de los momentos, quizás, pero siempre largo suficiente para distorsionar la mente de la víctima.
DEGRADATION_PERK_EFFECT:0 "#Bold Elimina el requisito de piedad de la interacción con el personaje de Evocación de la locura.#!\nTe permite obligar a otro catayán a entrar en Shadow Soul, obligándolo todo el tiempo a observar con impotencia cómo su P'o corre por las murallas".
STRENGTHENING_THE_DEMON_PERK_EFFECT:0 "#Bold Desbloquea una opción de manipulación po.#!\nCultivas brevemente la oscuridad dentro de ti, para aprovechar mejor el poder de la oscuridad".
DARKLING_MIRROR_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nTe permite separar tu P'o de tu Hun y tu cuerpo para usarlo como sirviente malvado."
 
# Internalizar #

NO_MIND_PERK_EFFECT:0 "Te permite purgar a tu huno de pensamientos que distraen, lo que aumenta las dificultades para llegar a Frenesí".
BLOOD_YOGA_PERK_EFFECT:0 "#Bold Desbloquea la decisión de meditar en reclusión incluso si no tienes el principio necesario, solo necesitas pagar prestigio, si ya tienes el principio necesario, recibirás piedad.#!\nAl realizar movimientos rituales y katas, Wan-kuei puede recordar Fuerza de Voluntad más fácilmente".
DISTANT_DEATH_KATA_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre. Bonificación por causar lesiones graves al caballero enemigo en combate.#!\nAl inhalar y exhalar lentamente mientras golpeas en el aire, puedes transferir místicamente tu puño tu objetivo."
IRON_SOUL_PERK_EFFECT:0 "Convierte las energías internas en el fortalecimiento de la mente y el cuerpo".
HARMONY_WITH_THE_ALL_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nTe permite proyectar tu conciencia al ciclo cósmico inicial, permitiéndote aprovechar temporalmente la perfección de la Primera Edad".
REAPING_THE_DRAGONS_ROAD_PERK_EFFECT:0 "#Bold Te permite no subir el nivel del Muro cuando tienes el edificio 'controlar la línea de dragones' de Osmosis.#!\nPuedes tomar Chi directamente de las líneas y nidos de dragones por pura fuerza de voluntad".
STEEL_SOUL_PERK_EFFECT:0 "Un refinamiento de Iron Soul, te permite hazañas casi milagrosas."
ARMOR_OF_ENLIGHTENMENT_PERK_EFFECT:0 "#Bold Te permite ganar estrés en lugar de recibir una herida.#!\nTu sabiduría y perspicacia evitan que recibas daño físico de un oponente".
HOLDING_THE_GREEN_DEMON_AT_BAY_PERK_EFFECT:0 "#Bold Te permite no morir por las heridas.#!\nCon este poder, puedes obligar a tu alma a permanecer dentro de tu cuerpo, incluso si sufriste heridas letales".
 
# Obligación #

EVALUATE_PERK_EFFECT:0 "#Bold Desbloquea una opción de espionaje.#!\nTe permite escanear el Hun de tu oponente para discernir las debilidades".
SOUL_BRIDGE_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nTe permite vincular a tu huno con el huno de tu opuesto, permitiéndote parecer más confiable."
AUTHORITY_PERK_EFFECT:0 "Te permite asumir un aura de autoridad natural que afecta a todos los que están cerca de ti".
THOUSAND_HELL_STARE_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Desbloquea proyecto de energía psíquica negativa [interacción|E]. Bonificación para causar brutal mutilación al caballero enemigo en combate.#!\nTe permite canalizar toda tu culpa, frustración, ira y hambre en tu alma huna y luego proyectar esta energía psíquica negativa como un cuchillo en el alma de la víctima".
SOUL_SHACKLES_PERK_EFFECT:0 "#Bold Desbloquea $POD_bind_interaction$ [interacción|E]. Desbloquea la [interacción|E] del mismo nombre.#!\nTe permite crear vínculos permanentes entre tu Hun y el Hun de otra persona."
TAMING_THE_FIRE_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nPuedes comandar y redirigir a un catayán en Fire- o Wave Soul".
CORRUPT_THE_WILL_PERK_EFFECT:0 "Puedes reducir la fuerza de voluntad temporal de tu oponente".
VOICE_OF_THE_EMPEROR_PERK_EFFECT:0 "#Bold Desbloquea una opción de Spawn Army.#!\nCon este poder, puedes influir en las opiniones y acciones de una multitud de mortales, tantos como puedan escucharte. Aquellos que te escuchan creen lo que dices y estará fuertemente inclinado a hacer lo que tú ordenes".
DIVINE_FETTERS_PERK_EFFECT:0 "#Bold Desbloquear $POD_command_wraith_interaction$ [interacción|E].#!\nPuedes ampliar tu dominio de Autoridad para incluir otros Shen."
 
# Viento negro #

BLACK_WIND_PERK_EFFECT:0 "Permitiendo que la ira del P'o se canalice a través de tu cuerpo, te vuelves inhumanamente rápido: un tifón de destrucción".
A_THOUSAND_CUTS_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonificación para mutilar al caballero enemigo en combate.#!\nEste poder te permite enfocar tu P'o para que te conviertas en un verdadero torbellino en combate. Tus brazos son borrosos; tus pies son tan rápidos como un rayo; puedes golpear un objetivo (u objetivos) tantas veces que casi no hay forma de evitar los golpes".
TREADING_THE_TIDE_DRAGONS_BACK_PERK_EFFECT:0 "Te permite moverte con tanta velocidad que puedes correr por la superficie del agua sin caerte".
DIVINE_WHIRLWIND_PERK_EFFECT:0 "#Bonificación audaz para matar al caballero enemigo en combate.#!\nTus propios pensamientos se convierten instantáneamente en acciones, lo que te permite golpear a tu objetivo varias veces antes de que pueda responder".
TRANSCENDING_PO_PERK_EFFECT:0 "Has aprendido a no dejar que los aspectos más oscuros de tu naturaleza se apoderen de ti. Si te calmas con las energías tranquilizadoras de Yin Chi, puedes controlar tu lado bestial".
 
# Demonio Shintai #

DEMON_SHINTAI_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Desbloquea la opción de cambio de forma de característica demoníaca.#!\nObtén una característica demoníaca adicional a medida que aumentas de nivel".
ADVANCED_DEMON_SHINTAI_PERK_EFFECT:0 "#Bold Desbloquea la opción de cambio de forma de característica demoníaca que te permite restablecer todas las características en el nivel final.#!\nObtén dos características demoníacas adicionales a medida que aumenta el nivel".
 
same_o_higher_dharma_header:0"#N ¡Solo con el mismo o mayor nivel de dharma puedes comprar esta ventaja.#!"
end_time_is_close_header:0"#N ¡Solo cuando se acerque el final de los tiempos podrás comprar esta ventaja.#!"
SOUL_DEMON_INCOMPATIBLE_TEXT:0"#N Mientras usas Demon Arts, no puedes usar ninguna Disciplina del alma excepto Chi'iu Muh.#!"
power_prevent_you_dead_from_wound_ct:0 "¡Tu poder evitó tu muerte por esta herida!"
NOT_has_dragon_nest_in_your_location:0 "No hay nidos de dragones en tu ubicación."
NOT_has_dragon_nest_in_target_location:0 "No hay ningún nido de dragón en la ubicación del objetivo."
 
# Qiao #

CELESTIAL_PUNISHMENT_PERK_EFFECT:0 "#Bold Unlock Make Prayer [interaction|E]. Bonus para causar heridas al caballero enemigo en combate con [GetModifier('warning_prayer_modifier').GetNameWithTooltip].#!\nEstas oraciones funcionan como una advertencia para el shen. Cuando golpean a su objetivo, se encienden, sin causar daño físico pero quemando el P'o del objetivo. Estas oraciones de papel son tan efectivas como los cuchillos arrojadizos y resisten incluso los vientos naturales más fuertes mientras se dirigen a su objetivo".
DIVINE_BINDINGS_PERK_EFFECT:0 "#Bold Bonus to Make Prayer [interaction|E]. Bonus para causar lesiones graves al caballero enemigo en combate con [GetModifier('glowing_prayer_modifier').GetNameWithTooltip].#!\nCuando se lanzan hacia un objetivo shen, estos son inocuos las hojas de papel se mueven contra el viento e incluso eluden los obstáculos para golpear. Una vez que las oraciones dan en el blanco, brillan con una extraña energía verde y se expanden, volviéndose más gruesas y largas a medida que se envuelven alrededor del shen".
HEAVENLY_FLAMES_PERK_EFFECT:0 "#Bold Bonus to Make Prayer [interaction|E]. Bonus para causar lesiones graves al caballero enemigo en combate con [GetModifier('bursing_prayer_modifier').GetNameWithTooltip].#!\nCuando esta oración golpea a un objetivo shen, inmediatamente estalla en llamas de color azul brillante que causan daño agravado. Al igual que con Divine Bindings, la oración se mueve alrededor de los obstáculos para alcanzar su objetivo".
CELESTIAL_FIRES_PERK_EFFECT:0 "#Bold Bonus to Make Prayer [interaction|E]. Bonus para causar brutal mual al caballero enemigo en combate con [GetModifier('indenfensible_prayer_modifier').GetNameWithTooltip].#!\nCelestial Fires es idéntico a Heavenly Flames, con una excepción: el daño no puede absorberse sin defensas especiales".
HEAVENS_THUNDER_PERK_EFFECT:0 "#Bold Bonus to Make Prayer [interaction|E]. Bonus para causar brutal mual al caballero enemigo en combate con [GetModifier('explosive_prayer_modifier').GetNameWithTooltip].#!\nEsta, la más poderosa de las oraciones de Shih , es virtualmente imparable una vez lanzado. Cuando las oraciones salen de la mano del Shih, brillan ferozmente y se mueven con la velocidad del rayo hacia su destino. Cuando golpean el shen, explotan en bolas de furia eléctrica capaces de herir gravemente a casi cualquier demonio. "
STEEL_SKIN_PERK_EFFECT:0 "Aumentas tu resistencia con el uso de este poder".
DRAGONS_SPEED_PERK_EFFECT:0 "Aumentas tu destreza con el uso de este poder".
TIGERS_STRENGTH_PERK_EFFECT:0 "Usas esta habilidad para aumentar tu fuerza en preparación para el combate".
CELESTIAL_EYES_PERK_EFFECT:0 "Aumentas tu percepción usando este nivel de Mo Kung Qiao."
BODY_OF_THE_DRAGON_PERK_EFFECT:0 "Aumentas todos tus atributos a niveles sobrehumanos".
OPENED_EYES_PERK_EFFECT:0 "El Shih puede ver los shen por lo que son. El Shih también puede ignorar los efectos del Delirio."
DIVINE_PERCEPTIONS_PERK_EFFECT:0 "Este poder le da derecho al Shih a ver el espíritu de otro ser. Funciona como un detector de mentiras en su mayor parte, pero el Shih también puede ver cuando un mortal u otra entidad está poseído por un demonio."
WIND_TALK_PERK_EFFECT:0 "#Bold Desbloquea $POD_marked_for_return_interaction$ [interacción|E]. Añade más posibilidades de calmar un espíritu local en '$POD_calm_local_spirit_interaction$' [interacción|E].#!\nEl Shih que emplea esta habilidad puede escuchar a los habitantes de los reinos de los espíritus y comunicarse con ellos. Sin embargo, los shen no están obligados a responder a ninguna pregunta o demanda que el Shih pueda hacer".
CELESTIAL_WINDOW_PERK_EFFECT:0 "#Bold Desbloquea $POD_bind_interaction$ [interacción|E]. Añade más posibilidades de calmar un espíritu local en '$POD_calm_local_spirit_interaction$' [interacción|E].#!\nEl Shih que emplea esta habilidad interactúa en todos los niveles con un habitante del Reino Yin o Yang. Para todos los efectos, el espíritu elegido está en el mismo nivel de existencia que el Shih. Ese espíritu puede ser tocado, herido, ayudado o envuelto en combate como si tanto el Shih como el espíritu estaban en el mismo lugar".
CELESTIAL_DOORWAY_PERK_EFFECT:0 "#Bold Desbloquea $POD_command_wraith_interaction$ [interacción|E]. Agrega más posibilidades de calmar un espíritu local en '$POD_calm_local_spirit_interaction$' [interacción|E].#!\nEl Shih puede interactuar activamente con los mundos espirituales; sin embargo, este curso de acción no es necesariamente el más inteligente a seguir. Mientras que el personaje permanece en el Reino Medio, puede ver y afectar los Mundos Yin y Yang a su alrededor. Aunque, los habitantes de esos reinos pueden devolver el favor, y a muchos de ellos no les gusta el Shih".
BARRIER_OF_PAIN_PERK_EFFECT:0 "#Bold Desbloquea Chi Heal [interacción|E], permite curar cicatrices.#!\nEl Shih puede obligarse a sí mismo a bloquear el dolor en este nivel".
THE_CLOSING_WOUND_PERK_EFFECT:0 "#Bold Bonus to Chi Heal [interaction|E], permite curar heridas.#!\nEn este nivel, el Shih puede curar heridas. La carne magullada pierde su ternura; las heridas se vuelven a unir y dejan cicatrices frescas ."
SPIRITUAL_HEALING_PERK_EFFECT:0 "#Bold Bonus to Chi Heal [interaction|E], permite sanar partes del cuerpo perdidas.#!\nEl Shih puede reconstruir huesos y reconstruir tejido nervioso con esta habilidad. Este proceso es doloroso y a menudo arriesgado si se usa en un situación de combate. Los huesos deben restablecerse correctamente o el Shih corre el riesgo de paralizarse permanentemente ".
ESCAPE_FROM_DEATH_PERK_EFFECT:0 "#Bold Te permite gastar fuerza de voluntad en lugar de recibir heridas. Bonificación a Chi Heal [interacción|E], permite curar enfermedades o desventajas físicas menores.#!\nEl Shih que usa esta habilidad puede regenerar incluso quemaduras y otros daños de energía Si bien es muy útil, Escape from Death también es muy costoso".
FLAMES_OF_THE_PHOENIX_PERK_EFFECT:0 "#Bold Permitir que no te maten las heridas. Bonificación a Chi Heal [interacción|E], permite curar varias enfermedades nuevas o desventajas físicas.#!\nEl personaje que usa esta habilidad se regenera completamente a sí mismo a nivel celular. Este poder no puede resucitar a un personaje, pero revierte los efectos del envenenamiento por radiación, el cáncer, los traumatismos graves e incluso la vejez".
THOUSAND_FISTS_PERK_EFFECT:0 "#Bonus audaz para herir al caballero enemigo en combate.#!\nEl Shih enfoca su Yang Chi y suelta múltiples puñetazos. Los golpes son sobrehumanos, rápidos, a menudo borrosos en el aire."
SPEAR_HAND_PERK_EFFECT:0 "#Bold Bonus para causar lesiones graves al caballero enemigo en combate.#!\nEl Shih enfoca su Yang Chi y enciende la energía alrededor de una mano. Esta energía ondea el aire y quema intensamente".
BURNING_GHOSTS_PERK_EFFECT:0 "#Bold Bonus para causar lesiones graves al caballero enemigo en combate.#!\nEl caballero Shih enfoca su Chi, lo que lo ralentiza para combatir espectros y sirits de todo tipo. Su piel brilla con una luz dorada y las energías Chi lo envuelven alrededor de él. El cuerpo del Shih en realidad no golpea a los espíritus, pero el aura de poder que lo rodea sí lo hace".
 NIGHTMARE_EXORCISM_PERK_EFFECT:0 "#Bold Bonus to 'Exorcism' [interaction|E], permite eliminar los rasgos de estrés negativos.#!\nMuchos Shih recurren a las drogas y el alcohol en un esfuerzo por aliviar su angustia mental. Shih, usando este poder, adopte un enfoque más directo borrando el impacto emocional de la memoria y, con suerte, eliminando las cicatrices mentales que crea la memoria."
 SELF_EXORCISM_PERK_EFFECT:0 "#Bold Bonus to 'Exorcism' [interaction|E], permite eliminar los rasgos mentales negativos.#!\nShih, como todos los mortales, está sujeto a los riesgos de posesión demoníaca. Con este poder, el cazador de demonios se involucra en una batalla psíquica con un demonio que ha logrado ingresar con éxito a su cuerpo, adquiriendo una segunda oportunidad para expulsar al demonio."
STEEL_BODY_PERK_EFFECT:0 "#Bold Bonus para causar mutilación brutal al caballero enemigo en combate.#!\nEl Shih enfoca su Yin Chi, endurece su cuerpo y aumenta su capacidad para infligir daño. Cada músculo del cuerpo del Shih se tensa y su piel se vuelve mucho más resistente",
THOUSAND_SWORDS_PERK_EFFECT:0 "#Bold Bonus para causar un golpe brutal al caballero enemigo en combate.#!\nEl Shih concentra su Chi, luego arremete contra sus enemigos en una furia de acciones. Cada golpe abre heridas en su enemigo, y el sonido de los impactos son como los de metal golpeando metal".
FROZEN_RIVER_PERK_EFFECT:0 "El Shih usa su Yang Chi para construir una barrera protectora alrededor de su propia fuerza vital, evitando así el robo de su Chi".
STOLEN_SERPENT_PERK_EFFECT:0 "#Bonus audaz para causar lesiones graves al caballero enemigo en combate.#!\nEl Shih puede capturar cualquier ataque sobrenatural a distancia dirigido contra él y luego lanzarlo hacia el oponente que lo lanzó. Este es un asunto peligroso, ya que el Shih debe demostrar el momento perfecto para aprovechar las energías místicas que se le arrojan".
CELESTIAL_BARRIER_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nCon este poder, el Shih bloquea temporalmente la capacidad del shen para tomar Chi de otras fuentes".
CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT:0 "#Bold Desbloquea 'Robar Chi' [interacción|E].#!\nEl Shih que usa esta habilidad puede robar Chi de un shen. Mientras que el Chi robado ya no está disponible para el shen, tampoco puede usar el Shih el Chi robado".
BITE_OF_THE_MU_PERK_EFFECT:0 "#Bold Bonus para 'Robar Chi' [interacción|E]. Bonus para causar un brutal mual al caballero enemigo en combate.#!\nEl Shih que usa esta habilidad no solo roba el Chi de un objetivo shen, sino que también usa ese Chi en un ataque contra el shen. Este procedimiento es muy arriesgado, porque despierta el P'o de Shih".
EYES_OF_THE_DRAGON_PERK_EFFECT:0 "El Shih mira fijamente a un oponente. La intimidación es la clave para evitar el combate con éxito. ."
DARK_REFLECTION_PERK_EFFECT:0 "Este poder obliga a los enemigos de los Shih a darse cuenta de las consecuencias de sus acciones. Los Shih usan este poder cuando pronuncian un juicio sobre un shen."
HUNTED_EYES_PERK_EFFECT:0 "Este poder funciona tanto en Hungry Dead como en Restless Dead. Mirando fijamente a los ojos de un oponente, el Shih obliga al objetivo a volver a experimentar el tiempo que pasa en Yomi World".
VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT:0 "#Bold Agrega más posibilidades de calmar un espíritu local en la '$POD_calm_local_spirit_interaction$' [interacción|E].#!\nUn Shih que emplea este poder puede ordenar a un espíritu que realice una tarea simple".
DIVINE_ORDINANCE_PERK_EFFECT:0 "El Shih inspira un miedo abrumador en todos los oponentes dentro del alcance visual".
BALANCE_OF_THE_SPIRIT_PERK_EFFECT:0 "#Bold Desbloquea 'Exorcismo' [interacción|E], permite restaurar el desequilibrio.#!\nEl Shih puede discernir los desequilibrios espirituales de Yin y Yang e intentar restaurar el orden adecuado con este poder".
FOCUS_OF_THE_MIND_PERK_EFFECT:0 "#Bold Bonus to 'Exorcism' [interaction|E], permite reducir el estrés.#!\nShih usa una gran cantidad de su fuerza de voluntad para luchar contra shen. Este poder les permite recuperar su resolución y una vez más realizar sus deberes sagrados ."
NIGHTMARE_EXORCSM_PERK_EFFECT:0 "#Bold Bonus to 'Exorcism' [interaction|E], permite eliminar los rasgos de estrés negativos.#!\nMuchos Shih recurren a las drogas y al alcohol en un esfuerzo por aliviar su angustia mental. Shih usa este poder para tomar una forma más directa enfoque borrando el impacto emocional de la memoria y, con suerte, eliminando las cicatrices mentales que crea la memoria".
SELF_EXORCSM_PERK_EFFECT:0 "#Bold Bonus to 'Exorcism' [interaction|E], permite eliminar los rasgos mentales negativos.#!\nShih, como todos los mortales, está sujeto a los riesgos de posesión demoníaca. Con este poder, el cazador de demonios participa en batalla psíquica con un demonio que ha logrado entrar con éxito en su cuerpo, adquiriendo una segunda oportunidad para expulsar al demonio".
MENTAL_DOMINION_PERK_EFFECT:0 "#Bonificación audaz para 'Exorcismo' [interacción|E], permite reducir todo el estrés.#!\nUn Shih que usa este poder puede restaurar completamente su fuerza de voluntad y, de hecho, debilitar su P'o".
CLOUD_WALKING_PERK_EFFECT:0 "Este poder permite que el Shih se mueva en silencio y sin dejar rastro, incluso mientras corre. El Shih no deja ningún rastro que indique que ha estado alguna vez en la zona".
WATER_TREADING_PERK_EFFECT:0 "Con este poder, el Shih puede viajar sobre superficies inestables, como agua o arenas movedizas, y utilizar prácticamente cualquier superficie, incluso las hojas de un árbol, para escalar".
WIND_STRIKE_PERK_EFFECT:0 "#Bold Bonus para causar lesiones graves al caballero enemigo en combate.#!\nEl Shih usa el propio impulso de un oponente para lanzarlo a distancias increíbles".
MOUNTAIN_STANCE_PERK_EFFECT:0 "El Shih absorbe el impacto de un ataque y redirige la fuerza hacia el suelo".
CELESTIAL_WIND_PERK_EFFECT:0 "El Shih que usa este poder enfoca su Chi para evitar que un objetivo avance y posiblemente incluso envía a un oponente hacia atrás".
HEAVENS_JUDGMENT_PERK_EFFECT:0 "#Bold Bonus to Make Prayer [interaction|E]. Bonus para matar al caballero enemigo en combate con [GetModifier('burn_out_prayer_modifier').GetNameWithTooltip].#!\nLas oraciones preparadas por este Qiao literalmente queman a Chi fuera del cuerpo del shen, devolviendo esa fuerza vital robada al medio ambiente para revivirlo".
DIVINE_PROHIBITION_PERK_EFFECT:0 "#Bold Bonus to Make Prayer [interaction|E]. Bonus para matar a un caballero enemigo en combate con [GetModifier('cut_off_prayer_modifier').GetNameWithTooltip].#!\nEsta técnica más poderosa de I Shen separa a un objetivo de fuentes externas de Chi".
TEN_OX_STRENGTH_PERK_EFFECT:0 "El Shih es capaz de proezas momentáneas de fuerza sobrehumana."
DIAMOND_BODY_PERK_EFFECT:0 "Un Shih que usa este don manifiesta una enorme capacidad para ignorar el daño".
SIGHT_WITHOUT_EYES_PERK_EFFECT:0 "Usando esta técnica, un Shih puede ver y detectar sin el uso de los sentidos físicos, percibiendo solo con el espíritu".
THE_EYE_OF_HEAVEN_PERK_EFFECT:0 "Un Shih con este nivel de dominio puede ver con el Ojo del Cielo, percibiendo cualquier lugar."
THE_LIZARDS_TAIL_PERK_EFFECT:0 "El Shih puede regenerar miembros u órganos perdidos; básicamente, cualquier daño que no resulte en la muerte."
ASHES_OF_THE_PHOENIX_PERK_EFFECT:0 "Shih con verdadero dominio del Puente del Fénix puede regresar de la muerte".
HUNDRED_WARRIORS_STRIKE_PERK_EFFECT:0 "#Bonus audaz para matar al caballero enemigo en combate.#!\nLleno de Chi furioso, el Shih se convierte en un torbellino de devastación".
HEAVEN_THUNDER_STRIKE_PERK_EFFECT:0 "#Bonus audaz para matar al caballero enemigo en combate.#!\nEl Shih puede concentrar Chi en un golpe que puede partir el acero o sacudir el suelo con la fuerza de un terremoto."
RIGHTEOUS_HUNGRY_SPIRIT_PERK_EFFECT:0 "El alma del Shih está tan poderosa que cualquier intento de drenar o robar su chi no solo falla automáticamente, sino que el cazador puede robarle el chi al atacante".
DEMON_EATING_TECHNIQUET_PERK_EFFECT:0 "#Bonus audaz para matar al caballero enemigo en combate.#!\nLos ataques cuerpo a cuerpo del Shih (con o sin armas) contra shen no solo infligen daño sino que disipan el Chi del objetivo".
MANTLE_OF_HEAVEN_PERK_EFFECT:0 "Envuelto en la protección divina del cielo, un cazador de demonios se convierte en un terrible enemigo a los ojos de shen".
DIVINE_MANDATE_PERK_EFFECT:0 "Hablando con la voz del cielo, el Shih puede ordenar cualquier shen y esperar obediencia."
MOUNTAIN_MEDITATION_PERK_EFFECT:0 "Los shih que usan esta disciplina maestra logran un grado de tranquilidad que los hace tan inquebrantables como las raíces de una montaña".
WALKING_IN_BALANCE_PERK_EFFECT:0 "El Shih está tan perfectamente equilibrado entre Yin y Yang que supera cualquier intento externo de alterar su equilibrio Chi interno".
ARROW_CUTTING_PERK_EFFECT:0 "Los reflejos del Shih son sobrehumanamente rápidos, capaces de desviar cualquier ataque a distancia, incluso una lluvia de balas."
WIND_RACING_PRANA_PERK_EFFECT:0 "Usando este poder, un Shih puede aplicar una ráfaga momentánea de velocidad sobrehumana".
 
# Meritocracia #
 
MERITOCRACY_LEGACY_1_PERK_EFFECT:0 "Además del efecto anterior, cada nuevo inquisidor será fuerte y atlético.\n\nMens sana in corpore sano."
MERITOCRACY_LEGACY_2_PERK_EFFECT:0 "Además del efecto anterior, cada nuevo Inquisidor será un mejor Blademaster o Hunter.\n\nSi vis pacem, para bellum."
MERITOCRACY_LEGACY_3_PERK_EFFECT:0 "Además del efecto anterior, la calidad de Educación de cada nuevo Inquisidor aumentará en 1.\n\nScientia potentia est."
MERITOCRACY_LEGACY_4_PERK_EFFECT:0 "Además del efecto anterior, cada Inquisidor nuevo tendrá una mayor frecuencia o calidad de Rasgos congénitos positivos.\n\nGenuflectant omnes in plano."
MERITOCRACY_LEGACY_5_PERK_EFFECT:0 "Además del efecto anterior, cada Inquisidor nuevo tiene una mayor probabilidad de poseer Fe Verdadera.\n\nBis orat qui bene cantat."
 
# Unidad #
 
UNITY_LEGACY_1_PERK_EFFECT:0 "Además del efecto anterior, tendrás más posibilidades de éxito cuando elijas el enfoque marcial o de administración en el esquema Find Lair.\n\nPacta clara, boni amici".
UNITY_LEGACY_2_PERK_EFFECT:0 "Además del efecto anterior, completarás los esquemas de Find Lair más rápido.\n\nConveniens homini est hominem servare voluptas."
UNITY_LEGACY_3_PERK_EFFECT:0 "Beatius est magis dare quam accipere."
UNITY_LEGACY_4_PERK_EFFECT:0 "Además del efecto anterior, entrenar nuevos aprendices será más efectivo.\n\nArtificem commendat opus."
UNITY_LEGACY_5_PERK_EFFECT:0 "Nulla vis maior pietate vera est."
 
#Legado de servidumbre #
 
SERVITUDE_LEGACY_2_PERK_EFFECT:0 "Se elevará la obligación feudal."
 
#Aspiración legado #
 
ASPIRATION_LEGACY_2_PERK_EFFECT:0 "Se reducirá la obligación feudal."
ASPIRATION_LEGACY_5_PERK_EFFECT:0 "Mayor probabilidad de heredar [disciplinas|E]".
 
#El legado Ventrue #
 
VENTRUE_LEGACY_1_PERK_EFFECT:0 "Bonificación para MaA de infantería pesada, desbloquea una interacción de personaje especial para intercambiar ganchos con otros Ventrue.\nCamilla construye el imperio más grande que el mundo [cainita|E] ha conocido o conocerá jamás. [Clan|E] Ventrue realmente comenzó con él."
VENTRUE_LEGACY_2_PERK_EFFECT:0 "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\nLa diosa espartana cargó valientemente contra los horrores de Cartago. [Clan|E] Ventrue siempre honrará su sacrificio."
VENTRUE_LEGACY_3_PERK_EFFECT:0 "Desbloquea una interacción de personaje especial para imponer [mascarada|E].\nLa muerte idiota de Medon enseñó una valiosa lección a los Ventrue. No subestimes a los mortales".
VENTRUE_LEGACY_4_PERK_EFFECT:0 "Bonificación de fascinación cultural y bonificación de piedad mensual.\nEl explorador nunca está verdaderamente saciado porque el mundo es tan infinito como su pasión por los viajes".
VENTRUE_LEGACY_5_PERK_EFFECT:0 "Bonificación a la caballería pesada MaA.\nEl general persa ascendió a la divinidad con el sonido de catafractos atronadores."
 
#El legado de los Setitas #
 
SETITE_LEGACY_1_PERK_EFFECT:0 "Bonificación de piedad, desbloquea MaA especial.\nEl primer hijo, el más devoto, es un ejemplo para todos los Setitas".
SETITE_LEGACY_2_PERK_EFFECT:0 "Desbloquea el plan Befriend. Puedes usarlo con un máximo de 7 amigos (en vez de 5).\nNo hay vergüenza en comer la fruta prohibida en buena compañía".
SETITE_LEGACY_3_PERK_EFFECT:0 "Bonificación de diplomacia por nivel de prestigio.\nSiempre hay redención en el abrazo de Set, incluso para los 'Vástagos' más testarudos."
SETITE_LEGACY_4_PERK_EFFECT:0 "Desbloquea la construcción especial del Templo Fundador.\nDisfruta de Su gloria y reza, porque volverá para salvarnos a todos".
SETITE_LEGACY_5_PERK_EFFECT:0 "Mejora el plan Seducir.\nLa hija perdida, la maldita, la gran enemiga... se enfrentará a su retribución".
 
#El legado de Baali #
 
BAALI_LEGACY_1_PERK_EFFECT:0 "Desbloquea MaA especial.\nY miré, y he aquí un caballo amarillo; el que lo montaba se llamaba Muerte y el Infierno lo seguía."
BAALI_LEGACY_2_PERK_EFFECT:0 "Bonificación de pavor.\nY vi cuando el cordero abrió uno de los sellos, y oí, como con el ruido de un trueno, a uno de los cuatro animales que decía: Ven y mira."
BAALI_LEGACY_3_PERK_EFFECT:0 "+1 máx. esquema hostil.\nY miré, y he aquí un caballo negro, y el que lo montaba tenía una balanza en la mano."
BAALI_LEGACY_4_PERK_EFFECT:0 "Bono de mantenimiento de MaA.\nY miré, y he aquí un caballo blanco; y el que lo montaba tenía un arco; y se le dio una corona; y salió venciendo y para vencer."
BAALI_LEGACY_5_PERK_EFFECT:0 "Bonificación de contribución de vasallos intimidados.\nY salió otro caballo que era bermejo: y al que lo montaba le fue dado poder para quitar de la tierra la paz, y que se mataran unos a otros: y le fue dado una gran espada".
 
#legado gangrel #
 
GANGREL_LEGACY_1_PERK_EFFECT:0 "Desbloquea MaA especial, bonificación para MaA de infantería ligera.\nEl padre de todos observa con orgullo cómo sus hijos se enfrentan a Ragnarok con valentía y honor".
GANGREL_LEGACY_2_PERK_EFFECT:0 "Bonificación para MaA de caballería ligera. Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n¡Caballo con millones! ¡Soy el Azote de Dios! Y veré tu mundo... arder".
GANGREL_LEGACY_3_PERK_EFFECT:0 "Reduce el costo de creación de nueva fe.\nLa maldita madre se vengará y los hijos de Caín pagarán diez veces su deuda".
GANGREL_LEGACY_4_PERK_EFFECT:0 "Bonificación a la piedad, desbloquea una interacción de personaje especial para desafiar a otros personajes a duelos por anzuelos.\nY lloró, porque no quedaban más mundos por conquistar."
GANGREL_LEGACY_5_PERK_EFFECT:0 "Bonificación al control mensual en los condados.\nLa bestia acorralada protege a su rebaño y contraataca con furia y un propósito imperecedero".
 
#El legado de Ravnos #
 
RAVNOS_LEGACY_1_PERK_EFFECT:0 "Bonificación de opinión de la casa, desbloquea MaA especial.\nLa amable madre de los roma protege a su gente y les da un propósito".
RAVNOS_LEGACY_2_PERK_EFFECT:0 "Bonificación a MaA de caballería pesada, desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\nUna guerra eterna necesita un general eterno. Chandraputra es ese hombre."
RAVNOS_LEGACY_3_PERK_EFFECT:0 "Bonificación de aprendizaje, desbloquea la interacción especial de personajes para realizar un ritual para ganar sabiduría.\nEl Rakshasa de Rakshasas se cortó el ojo para finalmente ver."
RAVNOS_LEGACY_4_PERK_EFFECT:0 "Bonificación de prestigio.\nSi vives en Egipto, actúa como un egipcio."
RAVNOS_LEGACY_5_PERK_EFFECT:0 "Bonificaciones de pavor.\nEl maldito, el monstruo, el demonio... el terror en el corazón inquebrantable de cada Ravnos."
 
#legado de Capadocia #
 
CAPPADOCIAN_LEGACY_1_PERK_EFFECT:0 "La bonificación de aprendizaje por nivel de piedad desbloquea una interacción de personaje especial para enviar a tus chiquillos como consejeros a otros gobernantes.\nEl hijo fiel esconde sus miedos pero se prepara para lo peor que vendrá pronto".
CAPPADOCIAN_LEGACY_2_PERK_EFFECT:0 "Desbloquea la interacción especial de personajes para contratar a la guardaespaldas de Lamia.\nLa Madre Oscura esconde secretos que solo sus hijas pueden comprender".
CAPPADOCIAN_LEGACY_3_PERK_EFFECT:0 "Planificar bonificación de resistencia y poder.\nLa rama gobernante marginada y olvidada de Capadocia algún día usará máscaras".
CAPPADOCIAN_LEGACY_4_PERK_EFFECT:0 "Bonificación de ingresos mensuales por nivel de estrés, bonificación de administración.\nBizancio era una ciudad de ensueño mucho antes de que Constantino pusiera un pie en ella".
CAPPADOCIAN_LEGACY_5_PERK_EFFECT:0 "Bonificación de opinión de la casa.\nEl hijo traidor sabe la verdad y une a la casa contra él con un propósito".
 
#El legado de Brujah #
 
BRUJAH_LEGACY_1_PERK_EFFECT:0 "Se reducen las ganancias de estrés.\nEl rey de Esparta es tan insensible como la fría punta de su lanza. Excepto cuando se trata de un troyano en particular".
BRUJAH_LEGACY_2_PERK_EFFECT:0 "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\nCasi salvó a Cartago de la ruina. Los Brujah recuerdan su triunfo y lamentan su derrota."
BRUJAH_LEGACY_3_PERK_EFFECT:0 "Desbloquea el esquema de secuestro, bonificación al esquema de secuestro, desbloquea una interacción personal especial con el personaje para formar un cuadro de caballeros Brujah.\nEl noble forajido derrotará a tiranos y reyes con espada, arco e ingenio."
BRUJAH_LEGACY_4_PERK_EFFECT:0 "Coste de construcción y bonificación de ingresos mensuales.\nPara comprender verdaderamente el sistema burocrático bizantino, necesitas una princesa rusa".
BRUJAH_LEGACY_5_PERK_EFFECT:0 "Bonificación de destreza y caballero.\nLa primera traidora luchó duro por su utopía, pero Cartago cayó mucho antes de que llegaran los romanos."
 
#Tzimisce legado #
 
TZIMISCE_LEGACY_1_PERK_EFFECT:0 "Desbloquea MaA especial.\nLos no vivos no se preocupan por la moralidad. Servirás".
TZIMISCE_LEGACY_2_PERK_EFFECT:0 "Bonificación a los ingresos mensuales.\nLos nobles de la noche llevan el temido legado del [Clan|E] Tzimisce."
TZIMISCE_LEGACY_3_PERK_EFFECT:0 "Desbloquea MaA especial.\nHorrores y monstruos salen de las fosas de carne, listos para reclamar el derecho de nacimiento de los Tzimisce".
TZIMISCE_LEGACY_4_PERK_EFFECT:0 "Elimina la penalización a la opinión por fe diferente.\nEl Espíritu Santo ha ascendido, dejando solo ruinas a su paso".
TZIMISCE_LEGACY_5_PERK_EFFECT:0 "Desbloquea el edificio especial del Santuario de la carne.\nLos que entren aquí... nunca se irán".
 
#Tremere legado #
 
TREMERE_LEGACY_1_PERK_EFFECT:0 "Desbloquea MaA especial.\nCuando luchas por tu propia supervivencia, debes hacer sacrificios. Muchos sacrificios".
TREMERE_LEGACY_2_PERK_EFFECT:0 "Bonificación a la opinión del señor.\nLa única mujer que se ha ganado el respeto de Tremere es la base misma de la Pirámide."
TREMERE_LEGACY_3_PERK_EFFECT:0 "Bonificación a la opinión de la casa.\nEn la Pirámide, todos tienen un propósito y un lugar. Por debajo de sus superiores."
TREMERE_LEGACY_4_PERK_EFFECT:0 "Bonificación al límite máximo de MaA.\nElla ama sus creaciones y ellos la aman a ella a cambio. La pirámide pronto temblará".
TREMERE_LEGACY_5_PERK_EFFECT:0 "Bonificación al aprendizaje por nivel de piedad.\nEl aprendizaje y la sabiduría son las cualidades a menudo olvidadas que hacen a un verdadero mago Tremere."
 
#Legado Torero #
 
TOREADOR_LEGACY_1_PERK_EFFECT:0 "Bonificación de diplomacia.\nEl arte y la decadencia son lo mismo para algunos."
TOREADOR_LEGACY_2_PERK_EFFECT:0 "Bonificación para seducir el poder del plan.\nLa troyana se vengará, incluso si el mundo tiene que arder de antemano".
TOREADOR_LEGACY_3_PERK_EFFECT:0 "Bonificación a la opinión de la misma fe.\nEl arcángel perdió la cabeza y el mundo perdió su última esperanza. La Edad Media nunca terminará".
TOREADOR_LEGACY_4_PERK_EFFECT:0 "Bonificación para reclamar el esquema del trono.\nCuidado con la mujer despreciada, porque su furia nunca terminará".
TOREADOR_LEGACY_5_PERK_EFFECT:0 "La bonificación a la intriga por nivel de prestigio desbloquea una interacción de personaje especial para difundir rumores falsos sobre un objetivo.\nEl héroe más inverosímil se puede encontrar en los lugares más inverosímiles."
 
#Legado Salubri #
 
SALUBRI_LEGACY_1_PERK_EFFECT:0 "Bonificación de bajas de enemigos duros.\nSu venganza es una visión aterradora, pero ningún fuego arde para siempre".
SALUBRI_LEGACY_2_PERK_EFFECT:0 "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\nLa Espada de los Salubri nunca conoció la derrota, ni siquiera en la muerte."
SALUBRI_LEGACY_3_PERK_EFFECT:0 "Bonificación de piedad mensual, desbloquea el sistema de castas para tu dinastía.\nElla cantará mientras el mundo arde a su alrededor. Y tal vez sea suficiente".
SALUBRI_LEGACY_4_PERK_EFFECT:0 "Bonificación de opinión de vasallo.\nSabio es el hombre que se prepara para refugiarse cuando se acerca la guerra."
SALUBRI_LEGACY_5_PERK_EFFECT:0 "60 % de reducción del costo de las Guerras Sagradas.\nEl traidor nunca se enfrentó a la justicia y rió el último. Una amarga victoria para un hombre destrozado".
 
#El legado de Lasombra#
 
LASOMBRA_LEGACY_1_PERK_EFFECT:0 "Bonificación de intriga.\nLa hija rechazada planea su venganza. Contra las sombras usará el fuego supremo".
LASOMBRA_LEGACY_2_PERK_EFFECT:0 "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\nLa Reconquista de las Sombras tendrá éxito, pero su vencedor final podría no ser el obvio."
LASOMBRA_LEGACY_3_PERK_EFFECT:0 "Reducción del costo de conversión de fe.\nVerdaderamente, el Más Misericordioso trasciende incluso la muerte."
LASOMBRA_LEGACY_4_PERK_EFFECT:0 "Bonificación de intriga.\nConspirar por conspirar es una forma de arte en sí misma."
LASOMBRA_LEGACY_5_PERK_EFFECT:0 "Reducción del costo de creación y reforma de fe.\nConstantinopla tuvo su amarga venganza mientras Venecia arde con ella."
 
#El legado de los Banu Haqim#
 
BANUHAQIM_LEGACY_1_PERK_EFFECT:0 "Bonificación de pavor.\nOcultos tras un velo de secreto, los Banu Haqim son temidos mucho más allá de las fronteras de Oriente Medio."
BANUHAQIM_LEGACY_2_PERK_EFFECT:0 "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\nLos invictos se elevarán a nuevas alturas. Incluso la muerte no robará su honor".
BANUHAQIM_LEGACY_3_PERK_EFFECT:0 "Reducción del costo de creación de títulos.\nSer el mayor no significa mucho sin el apoyo de tus compañeros".
BANUHAQIM_LEGACY_4_PERK_EFFECT:0 "Bonificaciones de MaA de caballería ligera.\nEl traidor de los cartagineses aún deambula por la noche, una vergüenza para todos los verdaderos Banu Haqim".
BANUHAQIM_LEGACY_5_PERK_EFFECT:0 "Diferentes bonificaciones de opinión de fe.\nEl Pastor Negro purgará la Tierra de los indignos. Esta es la única salvación que llega a este mundo condenado".
 
#legado Malkavian#
 
MALKAVIAN_LEGACY_1_PERK_EFFECT:0 "Bonificación de opinión de la casa.\nLos profetas de la fatalidad rara vez son bienvenidos, pero a menudo tienen razón".
MALKAVIAN_LEGACY_2_PERK_EFFECT:0 "La bonificación de ingreso por nivel de estrés desbloquea una interacción personal especial con el personaje para 'tomar prestadas' habilidades.\nEl último príncipe Malkavian luchó valientemente contra los horrores de Cartago y se ganó el respeto de todos".
MALKAVIAN_LEGACY_3_PERK_EFFECT:0 "Bonificación de prestigio, desbloquea una interacción de personaje especial para debilitar la resistencia al esquema de otro gobernante si tiene algún cortesano Malkavian.\n¿Estoy mintiendo? ¿Estás mintiendo? ¡¿EL MUNDO MIENTE?!"
MALKAVIAN_LEGACY_4_PERK_EFFECT:0 "Bonificación de pavor.\nSolo una cena agradable y elegante con las cabezas de mis cortesanos".
MALKAVIAN_LEGACY_5_PERK_EFFECT:0 "Bonificación de aprendizaje por nivel de piedad.\n¿Vender tu alma al mal es malo cuando no tenías alma para empezar?"
 
#El legado de los Nosferatu#
 
NOSFERATU_LEGACY_1_PERK_EFFECT:0 "Permite formar alianzas sin matrimonio.\nEl orgulloso monstruo se yergue frente a los horrores de la noche, elevando a su [Clan|E] a alturas aún mayores."
NOSFERATU_LEGACY_2_PERK_EFFECT:0 "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\nLos antiguos de Oriente Medio no eran rival para las habilidades comprobadas y la fe eterna de Tarique".
NOSFERATU_LEGACY_3_PERK_EFFECT:0 "Bonificación de administración y límite de dominio.\nDinamarca fue hecha por y para Absalon, y él la deshará."
NOSFERATU_LEGACY_4_PERK_EFFECT:0 "Bonificación de ventaja.\nLa furia y el odio son malos consejeros, pero un gran combustible para la Bestia".
NOSFERATU_LEGACY_5_PERK_EFFECT:0 "Bonificación de pavor.\nLa abuelita es la única y aterradora esperanza contra horrores aún más espantosos."

#El legado de Caitiff#
 
CAITIFF_LEGACY_1_PERK_EFFECT:0 "Bonificación de opinión de la dinastía"
CAITIFF_LEGACY_2_PERK_EFFECT:0 "Bonificación de destreza y resistencia a planes hostiles"
CAITIFF_LEGACY_3_PERK_EFFECT:0 "Bonificación de ganancia de prestigio y piedad"
CAITIFF_LEGACY_4_PERK_EFFECT:0 "Desbloquea Thinbloods MaA"
CAITIFF_LEGACY_5_PERK_EFFECT:0 "Bonificación de caballero, desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial"
 
# Nobles cenicientos #
 
ASHEN_NOBLES_LEGACY_1_PERK_EFFECT:0 "Desbloquea un edificio especial"
ASHEN_NOBLES_LEGACY_2_PERK_EFFECT:0 "Desbloquea un evento especial de educación infantil"
ASHEN_NOBLES_LEGACY_3_PERK_EFFECT:0 "Desbloquea MaA especial y el segundo nivel del edificio especial"
ASHEN_NOBLES_LEGACY_4_PERK_EFFECT:0 "Desbloquea una opción especial para la interacción Buscar mortales"
ASHEN_NOBLES_LEGACY_5_PERK_EFFECT:0 "Desbloquea una decisión especial para invitar a Ashen Prospect y al tercer nivel del edificio especial"
 
