ASKING_THE_TREES_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nEl Amenti puede controlar la vida vegetal hasta un grado limitado."
FORGETTING_THE_STONE_PERK_EFFECT:0 "El Amenti puede hacer desaparecer ciertos materiales inorgánicos."
FORGETTING_THE_TREE_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nEl Amenti puede hacer desaparecer materiales orgánicos, como la madera."
NAME_THE_SECRET_PERK_EFFECT:0 "El Amenti puede adivinar debilidades ocultas (como maldiciones de clan o aflicciones similares) al estudiar el nombre verdadero de un objetivo".
NAMING_THE_WARNING_PERK_EFFECT:0 "Al entonar las sílabas de su verdadero nombre, los Amenti pueden ahuyentar a los enemigos".
BECOMING_THE_STONE_PERK_EFFECT:0 "Los Amenti pueden transformar su carne en un mineral cuyo nombre conocen."
BECOMING_THE_TREE_PERK_EFFECT:0 "El Amenti puede transformar su carne en una planta".
CLOUD_THE_NAME_PERK_EFFECT:0 "El Amenti puede ocultar su propio nombre verdadero, escondiéndose de los enemigos que también usan este arte".
COMMAND_THE_BEAST_PERK_EFFECT:0 "El Amenti puede intimidar a un animal a su servicio."
MEND_FLESH_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nEl Amenti puede ordenar que los tejidos vuelvan a crecer juntos".
BECOME_ANIMAL_PERK_EFFECT:0 "El Amenti puede transformarse en un animal cuyo verdadero nombre ha adivinado."
COMMAND_THOUGHT_PERK_EFFECT:0 "El Amenti puede emitir una orden verbal que un objetivo inteligente debe seguir".
NAME_THE_HEKAU_PERK_EFFECT:0 "El Amenti puede desentrañar otras artes sobrenaturales dirigidas contra él".
WHISPERS_TO_THE_HEART_PERK_EFFECT:0 "El Amenti puede inspirar cualquier emoción en un objetivo".
ENSLAVE_PERK_EFFECT:0 "El Amenti puede vincular a un objetivo a su voluntad durante un período de tiempo prolongado".
FORTIFY_FLESH_PERK_EFFECT:0 "El Amenti puede otorgar a la piel las cualidades de la piedra."
NAMING_THE_BODYS_DESTRUCTION_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nEl Amenti puede apuntar a las partes del cuerpo de sus enemigos diciendo sus nombres verdaderos y ordenándoles que se marchiten".
SPEAKING_ALL_NAMES_PERK_EFFECT:0 "El Amenti puede obtener un vocabulario inmediato en cualquier idioma a través de su conocimiento de los nombres verdaderos".
FORGETTING_THE_NAME_PERK_EFFECT:0 "El Amenti puede borrar el nombre verdadero de un objetivo, desterrándolo de la existencia y borrando todos los registros".
PTAHS_WORD_PERK_EFFECT:0 "El Amenti puede crear un objeto pequeño e inanimado pronunciando su verdadero nombre."
WHISPERS_TO_THE_BODY_PERK_EFFECT:0 "El Amenti puede remodelar su propia forma pronunciando su nombre verdadero y ordenándole que haga lo que desee."
WORDS_OF_AUTHORITY_PERK_EFFECT:0 "El Amenti dice una frase que todos los que la escuchan están obligados a cumplir lo mejor que puedan".
ECHO_THE_LESSER_NAME_PERK_EFFECT:0 "El Amenti puede comprender el nombre verdadero de cosas o conceptos básicos simplemente escuchando la resonancia de Sekhem".
NAME_OF_SEKHEM_PERK_EFFECT:0 "El Amenti puede controlar a Sekhem, atrayéndolo hacia sí mismo para reponer sus propias reservas o dirigiéndolo a un aliado".
NAME_OF_SKILL_PERK_EFFECT:0 "El Amenti puede aprender o mejorar una habilidad a través del conocimiento del nombre verdadero del área".
RIDDLE_OF_THE_SPHINX_PERK_EFFECT:0 "El Amenti puede hacer una pregunta e infundir en el objetivo la necesidad de responder a esta pregunta".
BECOMING_THE_PERSON_PERK_EFFECT:0 "Al utilizar el nombre verdadero de una persona, el Amenti se convierte en esa persona y realmente comprende cómo es esta persona".
ECHO_THE_GREATER_NAME_PERK_EFFECT:0 "El Amenti puede comprender el nombre verdadero de cosas o conceptos más complejos".
NAME_OF_THE_ATTRIBUTE_PERK_EFFECT:0 "El Amenti puede aumentar sus atributos usando su nombre verdadero".
NAMES_OF_THE_FORGOTTEN_PERK_EFFECT:0 "A través de una investigación diligente, los Amenti pueden crear un nombre verdadero para un ser que ha perdido el suyo".
NAME_OF_THE_WILL_PERK_EFFECT:0 "El Amenti puede aumentar su fuerza de voluntad usando su nombre verdadero".
RENAMING_THE_HEKAU_PERK_EFFECT:0 "El Amenti puede reorganizar las leyes de un poder sobrenatural específico, por ejemplo, redefiniendo la Disciplina de un vampiro o el paradigma de un mago".
 
