# Hechicería de sangre #

INCORPOREAL_FORM_PERK_EFFECT:0 "Habilitar el uso de [incorporeal_form|E]."
CORROSIVE_VITAE_PERK:0 "Desbloqueas una mejor opción para la interacción del personaje de la mascarada de portada".
A_TASTE_OF_BLOOD_PERK:0 "Mejora la tarea de encontrar secretos del maestro de espías".

# Celeridad #
BLINK_PERK_EFFECT:0 "Ahora te mueves tan rápido, enfrentándote a un enemigo o escapando en un abrir y cerrar de ojos, que para un observador desprevenido casi pareces teletransportarte, una ráfaga de viento es la única señal de tu paso".
CATS_GRACE_PERK_EFFECT:0 "Obtienes un equilibrio y una gracia sobrenaturales, lo que te permite caminar e incluso atravesar los salientes y soportes más delgados".
DRAUGHT_OF_ELEGANCE_PERK_EFFECT:0 "Tu sangre se satura con el poder de la celeridad, transmitiendo parte de tu poder a cualquiera que beba de él. Como interacción con el personaje, puedes regalarle a alguien tu rapidez sobrenatural".
FLEETNESS_PERK_EFFECT:0 "Tu dominio de la celeridad ahora te permite moverte y reaccionar con una velocidad vertiginosa".
LIGHTNING_STRIKE_PERK_EFFECT:0 "Más rápido de lo que puede seguir el ojo, puedes golpear con el puño o con un arma cuerpo a cuerpo a tal velocidad que tus oponentes no pueden defenderse o realizar una acción evasiva".
RAPID_REFLEXES_PERK_EFFECT:0 "Si bien sus cuerpos aún no pueden desafiar las leyes de la naturaleza, los vampiros con este poder perciben los eventos al instante y pueden reaccionar ante ellos con una presteza sobrehumana".
SPLIT_SECOND_PERK_EFFECT:0 "Actuando con la velocidad de tu percepción supercargada, tus emboscadores encuentran a su presa detrás de ellos y los favores solicitados se completan antes de que las palabras salgan de la boca del suplicante".
TRAVERSAL_PERK_EFFECT:0 "Con una velocidad vertiginosa, puedes correr o trepar por cualquier superficie, incluso correr por paredes e incluso cruzar medios líquidos".

# dominar #

RATIONALIZE_PERK_EFFECT:0 "Al convencer a la víctima de que actuó por su propia voluntad, desbloqueas un nuevo comando de dominación: inicias un plan. También puedes obtener más oro usando los comandos de dominación".
CLOUD_MEMORY_PERK:0 "Desbloqueas opciones para que la gente se olvide en eventos específicos".
MESMERIZE_PERK:0 "Desbloqueas el esquema de abducción. Además, obtendrás la habilidad de dar órdenes a otros de varias maneras, abriendo el esquema de hipnotización".
THE_FORGETFUL_MIND_PERK:0 "Desbloqueas una mejor opción para la interacción del personaje encubierto. También permite una interacción del personaje que puede llevar a la víctima a un trastorno específico. Además, puedes cambiar un solo rasgo de personalidad de tu manada y necrófagos, y bloquear recuerdos de tus secretos en tus oponentes".
SUBMERGED_DIRECTIVE_PERK:0 "Tienes mejores probabilidades de reclutar agentes para tus planes de asesinato. Tus anzuelos de dominación también duran más, lo que te permite dar órdenes en una fecha posterior".
MASS_MANIPULATION_PERK:0 "Como interacción de personajes, puedes generar un ejército de maníacos".
DEEP_MEMORIES_PERK:0 "Ahora puedes cambiar todos los rasgos de personalidad de tus necrófagos y manada"
CONDITIONING_PERK:0 "Al dominar a una persona varias veces en 10 años y usar un comando para reducir el libre albedrío, el vampiro puede eventualmente convertirlo en un sirviente ideal, dándole un fuerte gancho de dominación que no se puede resistir. Se puede mantener con más comandos de dominación. "
WILL_CONQUERS_PERK:0 "Tus órdenes de dominación se vuelven mucho más difíciles de resistir".
TERMINAL_DECREE_PERK:0 "Agrega un nuevo comando de dominación: intento de suicidio".
REWRITE_PERSONALITY_PERK:0 "Puedes convertir mentalmente a un vampiro en una copia exacta de ti. Cada vez que usas el poder (que se encuentra bajo la interacción de la mente olvidadiza), el objetivo se vuelve un poco como tú, desde habilidades que cambian hasta rasgos de personalidad e incluso otros rasgos. ."
CONCORD_OF_SUBMISSION_PERK:0 "Agregar la opción de dominación: Stop War: obliga al objetivo a cesar la hostilidad en paz blanca".
MOLD_HUMOURS_PERK:0 "Desbloquea la habilidad de cambiar la resonancia de tu manada"
SPEAK_THROUGH_THE_BLOOD_PERK:0 "Emite una orden que repercutirá en tu linaje, afectando a todos y cada uno de tus descendientes y obligándolos a actuar".
 
# Fortaleza #

DEFY_BANE_PERK_EFFECT:0 "Al prepararse con un gasto de poder, el vampiro puede volverse temporalmente resistente al fuego y la luz del sol, así como a otras heridas graves que lo amenazarían con la muerte definitiva. Al usar Dureza, el vampiro es inmune a la mutilación durante grandes batallas".
DRAUGHT_OF_ENDURANCE_PERK_EFFECT:0 "Tu sangre se satura con el poder de Fortaleza, transmitiendo parte de tu poder a cualquiera que beba de él. \n \nComo interacción de personajes, puedes darle tu dureza sobrenatural a alguien".
FLESH_OF_MARBLE_PERK_EFFECT:0 "El poder de la Sangre hace que la piel del vampiro se endurezca, adquiriendo un brillo de mármol que aún es flexible pero detiene casi cualquier golpe antes de romperse y reformarse momentáneamente".
FORTIFY_THE_INNER_FACADE_PERK_EFFECT:0 "En lugar de endurecer la estructura física del vampiro, este poder permite al usuario proteger sus pensamientos y emociones de la intromisión sobrenatural".
PROWESS_FROM_PAIN_PERK_EFFECT:0 "Desbloquea una nueva interacción con el personaje de Fortaleza. Las lesiones y los impedimentos ahora solo alimentan los poderes del vampiro, que se vuelve más fuerte y más rápido con cada golpe, desgarro o desgarro recibido". #Te otorga una interacción de personaje para abrazar el dolor y usarlo para hacerte más fuerte.
RESILIENCE_PERK_EFFECT:0 "Dotado de resistencia sobrenatural, la resolución física del usuario se fortalece".
TOUGHNESS_PERK_EFFECT:0 "Desbloquea una nueva interacción con el personaje Fortaleza. Todos los vampiros con este poder exhiben una habilidad innata para ignorar el daño que de otro modo molestaría e incluso desactivaría a otros de su especie. Con este beneficio, podrás absorber las heridas, usando el sangre para evitar que te hieran".
UNSWAYABLE_MIND_PERK_EFFECT:0 "El usuario obtiene una habilidad mística para resistir cualquier intento de influenciarlo a través de hechizos, coacción y artimañas mundanos".
BLESSING_OF_VITALITY_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 7.ª generación pueden comprar esta ventaja. Confiere más de su resistencia antinatural con su borrador de resistencia, otorgando al objetivo elegido los beneficios del poder de dureza mientras dure el borrador".
KNIGHTS_BANE_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 7.ª generación pueden comprar esta ventaja. Otorga un movimiento de duelo para destruir el arma de tu oponente con tu carne desnuda, infligiéndoles daño en el proceso".
CURSE_THE_LAUREL_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de la 3.ª a la 6.ª generación pueden comprar esta ventaja. Aleja una estaca de tu corazón y acabará eliminándola".
WRATH_OF_THE_MARTYR_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 6.ª generación pueden comprar esta ventaja. Mejora la bonificación de Destreza del dolor aumentando el poder que extraes del dolor".
ARMOURED_FLESH_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 5.ª generación pueden comprar esta ventaja. Esta ventaja te permitirá absorber lo que podría haber sido un golpe letal en algunas circunstancias. Nada menos que un golpe letal te matará. No cantidad de heridas terminará alguna vez con tu vida, pero solo la destrucción completa o la decapitación".
RESILIENT_MIND_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª y 4.ª generación pueden comprar esta ventaja. Desbloquea una nueva interacción con el personaje Fortaleza. Tu mente se deshace de los trastornos y las peculiaridades animales mientras se vuelve resistente a los poderes que alteran la mente".
armoured_flesh_ct:0 "¡Tu ventaja de carne blindada te protegió de esta herida!"
fortitude_soaked_damage:0 "Fortaleza"
fortitude_soaked_damage_ct:0 "La disciplina de tu fortaleza acumuló la herida."
fortitude_failed_soaked_damage:0 "Sin suerte"
fortitude_failed_soaked_damage_ct:0 "Tu disciplina de fortaleza no logró curar la herida."
 
# Ofuscar #
 
CLOAK_OF_SHADOWS_PERK_EFFECT:0 "Permaneciendo completamente inmóvil, el usuario se mezcla con el entorno. Siempre que esté cubierto, no emita ningún sonido y no se mueva, solo los medios mecánicos o sobrenaturales pueden detectarlo".
CLOAK_THE_GATHERING_PERK_EFFECT:0 "El vampiro puede proteger a sus compañeros bajo la capa de ofuscación".
IMPOSTORS_GUISE_PERK_EFFECT:0 "Con preparación, el vampiro puede aparecer como un individuo específico de cualquier complexión y género. El usuario debe estudiar cuidadosamente el tema. De lo contrario, la farsa falla cuando se encuentra con alguien que tiene más que una familiaridad casual con la persona que está siendo imitada. ."
MASK_OF_THOUSAND_FACES_PERK_EFFECT:0 "En lugar de desaparecer, el vampiro que usa este poder puede aparecer como un extraño indescriptible: alguien que esperaba estar presente en el área".
SILENCE_OF_DEATH_PERK_EFFECT:0 "Este poder silencia por completo al usuario, anulando todos los sonidos que emite. A diferencia de Ofuscate en general, este poder solo funciona en el sentido del oído, pero a cambio, funciona con más fuerza. Un vampiro necesita hacer un montón de ruido para romper este silencio".
UNSEEN_PASSAGE_PERK_EFFECT:0 "Con este poder, el vampiro ahora puede moverse mientras permanece oculto. Mejora tu tarea de encontrar secretos como maestro de espías".
VANISH_PERK_EFFECT:0 "El vampiro parece desaparecer en un abrir y cerrar de ojos; incluso su recuerdo se vuelve borroso e indistinto".
 
# Olvido #

TENEBROUS_AVATAR_PERK_EFFECT:0 "Como interacción de personajes, puedes transformarte en sombras".
SHADOW_CLOAK_PERK:0 "Mejora la tarea de búsqueda de secretos de tu maestro de espías"
OBLIVIONS_SIGHT_PERK:0 "Como interacción de personajes, puedes comandar espectros contra otros personajes".
TOUCH_OF_OBLIVION_PERK:0 "Como interacción de personajes, puedes vincular espectros".
SHADOW_PERSPECTIVE_PERK:0 "Mejora la tarea de búsqueda de secretos de tu maestro de espías"
ASHES_TO_ASHES_PERK:0 "Como interacción de personajes, puedes intentar destruir a un necrófago desde lejos."

# Potencia #
 
BRUTAL_FEED_PERK_EFFECT:0 "En cuestión de segundos, tragas torrentes de sangre mientras mutilas a tu víctima. El resultado es eficiente aunque complicado. Ahora puedes usar tu nuevo método de alimentación en el fragor de la batalla y puedes disfrazar los restos destrozados de la víctima".
DRAUGHT_OF_MIGHT_PERK_EFFECT:0 "Tu sangre se satura con el poder de la potencia, transmitiendo parte de tu poder a cualquiera que beba de él. Como interacción de personajes, puedes regalarle a alguien tu fuerza sobrenatural".
EARTHSHOCK_PERK_EFFECT:0 "Tu fuerza se convierte en una fuerza elemental. Puedes golpear el suelo con el puño o el pie y crear una onda expansiva que derriba a los oponentes y destroza edificios".
FISTS_OF_CAINE_PERK_EFFECT:0 "Tus manos desnudas pueden infligir heridas graves, letales tanto para los mortales como para otros vampiros. Pueden desmembrar, perforar, empalar, decapitar e incluso arrancar un corazón del pecho".
LETHAL_BODY_PERK_EFFECT:0 "Usando este poder, eres capaz de causar daños horrendos, desgarrar la piel y romper huesos con las manos desnudas".
PROWESS_PERK_EFFECT:0 "Los vampiros con potencia obtienen mucha más fuerza de su sangre que aquellos que carecen de ella".
SOARING_LEAP_PERK_EFFECT:0 "Al poseer una fuerza impía en algo más que brazos y puños, puedes saltar mucho más alto y más lejos que cualquier mortal".
UNCANNY_GRIP_PERK_EFFECT:0 "Concentrando tu fuerza antinatural en los dedos de las manos y los pies, agarras y entierras tus extremidades en casi cualquier superficie, permitiéndote trepar e incluso colgarte sin apoyo de paredes y techos".
 
# Presencia #
 BLOODLUST_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de la generación 3-5 pueden comprar este beneficio. Potencia la [fobia|E] poder."

AWE_PERK_EFFECT:0 "Cualquier persona en presencia del vampiro encuentra su atención inexplicablemente atraída hacia él. Aquellos que escuchan hablar al vampiro pueden ponerse de acuerdo repentinamente sobre temas en los que alguna vez tuvieron diferentes puntos de vista. \n \nDesbloquee el esquema Befriend".
DAUNT_PERK_EFFECT:0 "En lugar de atraer a la gente, el vampiro usa Presencia para repeler. Con este poder, el usuario parece amenazador y emana un aura de amenaza lo suficientemente poderosa como para hacer que la mayoría de los mortales eviten su atención e incluso los vampiros se lo piensen dos veces antes de actuar contra ellos".
DREAD_GAZE_PERK_EFFECT:0 "Exponiendo brevemente su naturaleza vampírica, el usuario infunde terror absoluto a un solo sujeto".
ENTRANCEMENT_PERK_EFFECT:0 "El vampiro enfoca su encanto antinatural en una sola persona, inculcándole una fascinación o un enamoramiento embelesado similar a enamorarse perdidamente o conocer a su ídolo de toda la vida. \n \nHabilita el [esquema de entrada|E]".
LINGERING_KISS_PERK_EFFECT:0 "El Beso de un vampiro induce casi el éxtasis en los mortales, pero este poder deja otros Besos en el polvo. Los mortales que se alimentan del usuario se vuelven adictos al Beso, se obsesionan con él e incluso buscan al vampiro para alimentarlo repetidamente. .\n\nCuando cazas, puedes elegir agregar tus víctimas a tu manada".
MAJESTY_PERK_EFFECT:0 "En este pináculo de la [disciplina|E], el vampiro puede amplificar su semblante a niveles sobrenaturales. Experimentar Majesty es estar en presencia de lo divino, o lo infernal. \n \nDesbloqueas una opción mejor para la interacción del personaje de la mascarada de la portada".
SUMMON_PERK_EFFECT:0 "El vampiro puede llamar a sí mismo a cualquier persona, mortal o vampiro, sobre la que haya usado anteriormente Asombro, Encantamiento o Majestad, o que haya probado su Sangre al menos una vez. \n \nHabilita el [summon_scheme|E ]".
IRONCLAD_COMMAND_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 7.ª generación pueden comprar esta ventaja. Mejora los poderes de presencia anteriores".
COOPERATION_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 7.ª generación pueden comprar esta ventaja. [paz|E] Aceptación: #P +[EmptyScope.ScriptValue('cooperation_value')|0]#!"
PHOBIA_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 6.ª generación pueden comprar esta ventaja. Desbloquea el poder [phobia|E]".
MASK_OF_EMPATHY_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 5.ª generación pueden comprar esta ventaja. Desbloquea el poder [mask_of_empathy|E]".
BLOODLUST_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 5.ª generación pueden comprar esta ventaja. Mejora el poder de [fobia|E].
PERFECT_WORLD_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª y 4.ª generación pueden comprar esta ventaja. Desbloquea el poder [perfect_world|E]".
 
# Proteína #
 
EARTH_MELD_PERK_EFFECT:0 "Haciéndose uno con el suelo, el vampiro se hunde en la tierra. A menos que en [letargo|E], el vampiro se levante de nuevo la noche siguiente".
EYES_OF_THE_BEAST_PERK_EFFECT:0 "El vampiro puede desear un brillo rojo sobrenatural en sus ojos, lo que les permite ver incluso en ausencia total de luz".
FERAL_WEAPONS_PERK_EFFECT:0 "El vampiro puede extender sus armas naturales a proporciones monstruosas. Como interacción de personajes, puedes convertir tus garras en armas letales".
METAMORPHOSIS_PERK_EFFECT:0 "Tu habilidad para adoptar la forma de un animal ha aumentado. Como interacción de personajes, ahora puedes cambiar de forma a una forma bestial más grande".
MIST_FORM_PERK_EFFECT:0 "El vampiro obtiene el poder legendario de convertirse en una nube de niebla, perceptible a simple vista pero intocable por cualquier cosa excepto el fuego, la luz del sol y la agresión sobrenatural. Como interacción con el personaje, ahora puedes cambiar a una forma de niebla escurridiza. "
SHAPECHANGE_PERK_EFFECT:0 "El vampiro puede adoptar la forma de un animal, normalmente uno asociado con su [Clan|E] o el tipo de presa que suele cazar. Como interacción de personajes, ahora puedes cambiar de forma a una forma bestial".
THE_UNFETTERED_HEART_PERK_EFFECT:0 "Habiendo dominado el poder de Protean, el interior mismo del usuario se vuelve maleable, casi viscoso. El corazón, sede de la vitae y la no vida del vampiro, se desprende y se mueve libremente, aunque con lentitud, dentro del cofre".
WEIGHT_OF_THE_FEATHER_PERK_EFFECT:0 "El vampiro puede reducir su masa y densidad efectivas, haciéndose casi ingrávido".

# Vicisitud #
 
AWAKEN_THE_ZULO_SHAPE_PERK_EFFECT:0 "Como interacción con el personaje, ahora puedes cambiar de forma a la temible forma de Zulo, una pesadilla de dos metros y medio de altura con escamas y pelaje grasiento, brazos simiescos con puntas de uñas negras dentadas y una hilera de espinas erizadas que recorren la longitud de su columna vertebral".
BLOODFORM_PERK_EFFECT:0 "Usando técnicas avanzadas de Vicisitud, te transformas instantáneamente en un grupo de Vitae inteligente. Como interacción con el personaje, ahora puedes cambiar de forma a la escurridiza forma de sangre".
MALLEABLE_VISAGE_PERK_EFFECT:0 "El usuario puede modificar su propio cuerpo de forma sencilla y cosmética. Puede ser más alto o más fornido. Puede cambiar su voz remodelando su laringe o puede adoptar un nuevo tono de piel, un nuevo color de ojos, un nuevo cabello, etc. on. Como una interacción de personajes, ahora puedes modificar tu cara o la de tus ghouls".
REND_THE_OSSEOUS_FRAME_PERK_EFFECT:0 "En esta etapa de dominio, has progresado en la manipulación de huesos. Usado solo, Rend the Osseous Frame puede infligir un daño terrible a un sujeto. Cuando se usa junto con Transmogrify the Mortal Clay, las pesadillas se vuelven posibles".
THE_BODY_IMPOLITIC_PERK_EFFECT:0 "Posiblemente el más macabro de los regalos de Vicissitude, The Body Impolitic permite al usuario invertir una parte de su sensibilidad en la carne de su cuerpo. Luego puede separarlo del tronco para cumplir sus órdenes. Su maestro de espías debe encontrar secretos es más eficiente".
TRANSMOGRIFY_THE_MORTAL_CLAY_PERK_EFFECT:0 "Puedes realizar alteraciones dramáticas, y no solo sobre ti mismo, sino sobre cualquier sujeto, puedes someterlo el tiempo suficiente para impartir tu visión. Como interacción de personajes, ahora puedes generar Szlachta Men at Arms".
CHIROPTERAN_FORM_PERK_EFFECT:0 "Si eres de la séptima generación o inferior, ahora tienes acceso a una nueva opción de cambio de forma, la forma quiróptera".
DRACUL_FORM_PERK_EFFECT:0 "Si eres de la cuarta generación o inferior, ahora tienes acceso a una nueva opción de cambio de forma, la forma de Dracul".
 
# disciplina #
NEEDS_DISCIPLINE_TEXT:0 "#N Requiere la base [disciplina|E] [rasgos|E] para comprar ventajas en este árbol. #!"
NEEDS_DISCIPLINE_FOR_FOCUS_TEXT:0 "#N Necesitas la [disciplina|E] [rasgos|E] correspondiente para elegir este enfoque. #!"
 
ventrue_clan_bane:0 "Esta persona está fuera de tu preferencia de alimentación y alimentarte de ella incurrirá en una prueba de fuerza de voluntad".
ventrue_clan_bane_anim:0 "Ventrue no puede tragar la sangre de los animales sin un esfuerzo de voluntad."
 
# Fe #
 
DOMINUS_VOBISCUM_PERK_EFFECT:0 "Como interacción de personajes, puedes bendecir a otro personaje para aumentar temporalmente sus estadísticas".
INTERCESSION_PERK_EFFECT:0 "Como interacción de personajes, puedes otorgar piedad a otro personaje con una pequeña posibilidad de otorgarle el rasgo Fe verdadera".
HOLY_BULWARK_PERK_EFFECT:0 "Ahora eres inmune a los poderes mentales de cualquier tipo".
LAY_OF_HANDS_PERK_EFFECT:0 "Como interacción de personajes, ahora puedes curarte de la mayoría de las dolencias".
PENANCE_PERK_EFFECT:0 "Como interacción de personajes, puedes elegir como objetivo a un vampiro para maldecirlo (una desventaja estadística)".
CONVERSION_PERK_EFFECT:0 "Como decisión, puedes convertir instantáneamente tu reino a tu religión, por un alto costo de piedad".

# Hueso Shintai #

CORPSE_SKIN_PERK_EFFECT:0 "#Bold Desbloquea una opción de cambio de forma.#!\nTu cuerpo se parece más a un cadáver, lo que ofrece una protección mejorada contra los ataques físicos".
WHITE_TIGER_CORPSE_PERK_EFFECT:0 "#Bold Desbloquea una opción de cambio de forma.#!\nTu cuerpo se vuelve transparente."
BONE_OBEDIENCE_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Desbloquea una opción de cambio de forma.#!\nPermite que tu estructura ósea se calcifique y crezca como cristales de roca".
FIVE_POISON_CLOUD_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonificación para causar brutal mutilación al caballero enemigo en combate.#!\nTe permite exhalar una nube venenosa de energía Yin negra".
CHING_SHIH_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Desbloquea una opción de cambio de forma.#!\nTe permite asumir temporalmente la forma de Ch'ing Shih."
IKEHONE_PERK_EFFECT:0 "Te permite reorganizar la estructura ósea de cualquier criatura con un esqueleto a tu gusto".
SKELETAL_SCULPTING_PERK_EFFECT:0 "#Bonus audaz para mutilar al caballero enemigo en combate.#!\nAhora puedes pasar por alto la carne de tu objetivo y afectar los huesos directamente"
CORPSE_AWAKENING_PERK_EFFECT:0 "Imbuyes a los cadáveres con Yin Chi, criándolos como muertos vivientes y sirvientes sin mente".
FORM_OF_INFERNAL_FAVOR_PERK_EFFECT:0 "Una forma refinada del Ch'ing Shih que es aún más horrible y que a menudo posee apéndices como tentáculos o púas".
 
# Carne Shintai #

LONG_NECK_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo.#!\nTe permite estirar las extremidades o el cuello a longitudes impresionantes".
DETACH_LIMB_PERK_EFFECT:0 "#Bold Desbloquea una opción de espionaje.#!\nTe permite animar una parte de tu cuerpo para que actúe aparte del cuerpo principal."
LOTUS_BREATH_PERK_EFFECT:0 "#Bold Bonus para causar lesiones graves al caballero enemigo en combate.#!\nTe permite exhalar una nube de energía Yang que vuelve a los mortales soñadores, risueños y generalmente incoherentes".
PELESIT_PERK_EFFECT:0 "#Bold Desbloquea una opción de espionaje.#!\nTe permite construir pequeñas criaturas con tu propia carne y enviarlas a hacer recados."
TEN_THOUSAND_FORMS_PERK_EFFECT:0 "#Bold Desbloquea varias opciones de cambio de forma.#!\nTe permite dar forma a tu cuerpo de la forma que desees siempre que conserve la misma masa que tu cuerpo original."
BODY_OF_THE_MOUSE_PERK_EFFECT:0 "#Bold Desbloquea varias opciones de cambio de forma.#!\nTe permite encoger, modificando tu propia masa corporal".
BODY_OF_THE_SERPENT_PERK_EFFECT:0 "#Bold Desbloquea varias opciones de cambio de forma.#!\nTu cuerpo se vuelve tan flexible como el caucho, lo que te permite deslizarte por espacios pequeños".
BLOAT_PERK_EFFECT:0 "#Bold Desbloquea varias opciones de cambio de forma.#!\nAl absorber masas de Yang Chi del entorno, puedes aumentar el tamaño de tu cuerpo".
UNCHAINING_THE_FORM_PERK_EFFECT:0 "#Bold Desbloquea varias opciones de cambio de forma.#!\nPuedes obtener todas las formas que desees, independientemente de la masa corporal".
 
# Sangre Shintai #

