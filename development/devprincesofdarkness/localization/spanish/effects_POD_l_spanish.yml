BLOODLASH_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonificación para causar brutal mutilación al caballero enemigo en combate.#!\nTe permite crear un zarcillo letal de sangre".
BLOOD_AWAKENING_PERK_EFFECT:0 "#Bold Desbloquea las interacciones entre personajes de despertar espíritu y congelar espíritu. Añade más posibilidades de calmar un espíritu local en la '$POD_calm_local_spirit_interaction$' [interacción|E].#!\nTe permite despertar o congelar espíritus Yang o Espectros. "
