#serpentis
 
ENCHANTING_GAZE_PERK_EFFECT:0 "Este poder convierte al vampiro en la llama proverbial de una polilla. Adquiere una característica seductora y encantadora, como los ojos dorados de una serpiente o un brillo nacarado en su piel. Puede paralizar con una mirada y a los mortales en su interior. los alrededores se sienten atraídos por ella".
SERPENTS_FLESH_PERK_EFFECT:0 "Desbloquea [serpents_flesh|E] poder".
TYPHONIC_MAW_PERK_EFFECT:0 "La mandíbula del vampiro se convierte en algo feroz y maleable que puede controlar de varias maneras. Su mandíbula se dilata hasta el pecho, sus colmillos crecen hasta el tamaño de pequeñas dagas, su lengua se bifurca en la punta y lanza un metro de largo, y su garganta se expande para consumir cualquier cosa que pueda comer".
MASTER_OF_SNAKES_PERK_EFFECT:0 "Te permite invocar serpientes en la interacción personal con personajes de Spawn Army".
SMOOTH_SCALES_PERK_EFFECT:0 "Mejora [serpents_flesh|E] poder".
FORM_OF_THE_SNAKE_PERK_EFFECT:0 "Te permite transformarte en una serpiente grande y una serpiente pequeña en la interacción personal del personaje que cambia de forma".
TYPHONIC_AVATAR_PERK_EFFECT:0 "Desbloquea [typhonic_avatar|E] poder".
SERPENT_EYES_PERK_EFFECT:0 "Desbloquea [serpent_eyes|E] poder."
MOTHER_OF_MONSTERS_PERK_EFFECT:0 "Te permite invocar bestias tifónicas en la interacción personal con personajes de Spawn Army".
FORM_OF_THE_STORM_PERK_EFFECT:0 "Mejora [typhonic_avatar|E] poder".
ECHIDNAS_VENOM_PERK_EFFECT:0 "En este nivel, la mordedura del vampiro se vuelve venenosa como una víbora mortal".
THE_HEART_OF_DARKNESS_PERK_EFFECT:0 "Desbloquea [heart_of_darkness|E] poder".
COBRA_FANGS_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de la generación 3-7 pueden comprar este beneficio. Los colmillos del vampiro se vuelven venenosos".
APOPHIS_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 7.ª generación pueden comprar esta ventaja. Mejora aún más el poder de [typhonic_avatar|E]".
HEART_THIEF_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 6.ª generación pueden comprar esta ventaja. Aumenta el poder de [heart_of_darkness|E], lo que permite robar corazones de otros personajes como un plan o de los prisioneros como una simple interacción de personajes. tener el corazón de alguien, es fácil matarlos o forzarlos a entrar en letargo".
TEMPTATION_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de la tercera a la quinta generación pueden comprar esta ventaja. El vampiro se vuelve extremadamente difícil de resistir".
BREATH_OF_THE_BASILISK_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª a 5.ª generación pueden comprar esta ventaja. El vampiro puede exhalar veneno y niebla corrosiva".
GODHEAD_PERK_EFFECT:0 "[elder_perk|E], solo los vampiros de 3.ª y 4.ª generación pueden comprar esta ventaja. Desbloquea el poder [godhead|E]".

# Alquimia

ANALYZE_MATERIAL_PERK_EFFECT:0 "#Bold Bonus a la probabilidad de éxito de identificación en la práctica de alquimia.#!\nLa momia puede obtener información sobre la composición de un objeto".
CLOUD_OF_SMOKE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('cloud_of_smoke_modifier').GetNameWithTooltip] Fórmula.#!\nLa momia hace que un fuego emita una espesa nube de humo negro al arrojarle un polvo preparado".
DRINK_OF_SEVEN_DAYS_REST_PERK_EFFECT:0 "#Bold Desbloquea [GetModifier('drink_of_seven_days_rest_modifier').GetNameWithTooltip] Formula.#!\nEsta poción alivia a quien la bebe de la fatiga y lo cura de daños menores".
MILD_POISON_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('mild_poison_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un veneno menor que puede ser bastante letal."
POTION_OF_RESILIENCE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('potion_of_resilience_modifier').GetNameWithTooltip] Formula.#!\nEsta poción actúa como un anestésico sobrenatural."
SIMPLE_ELIXIR_PERK_EFFECT:0 "#Bold Desbloquea fórmula de elixir simple.#!\nLa momia crea un elixir, una poción menor que potencia un solo atributo durante su duración."
SIMPLE_PHILTRE_PERK_EFFECT:0 "#Bold Desbloquea [GetModifier('simple_philtre_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un filtro, una sustancia menor que induce una emoción específica en su objetivo."
SIMPLE_TONIC_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('simple_tonic_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un ungüento o poción curativa."
STASIS_PERK_EFFECT:0 "#Bold Desbloquea la opción de estasis en la práctica de alquimia.#!\nLa momia evita que un solo material sea alterado por fuerzas externas".
BLOOD_OF_THE_SNAKE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('blood_of_the_snake_modifier').GetNameWithTooltip] Fórmula.#!\nLa momia crea un antídoto que protege contra cualquier veneno natural o cura el daño causado por el veneno".
COBRA_SPIT_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('cobra_spit_modifier').GetNameWithTooltip] Formula.#!\nLa Momia crea un líquido ácido que es devastador contra el tejido vivo."
ESSENCE_LONGING_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('essence_longing_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un perfume que actúa como un afrodisíaco menor."
EYES_OF_THE_KA_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('eyes_of_the_ka_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un ungüento que, cuando se aplica en los ojos y los oídos, permite presenciar las Tierras Sombrías."
ICE_OF_THE_DESERT_PERK_EFFECT:0 "#Bold Bonus a la probabilidad de éxito de transmutación en la práctica de alquimia.#!\nLa momia puede alterar una cierta cantidad de un estado natural".
LESSER_QUIDDITY_PERK_EFFECT:0 "#Bold Bonus al efecto de transmutación en la práctica de la alquimia.#!\nCon el uso de Sekhem, la Momia activa la quiddity de un objeto (sus atributos espirituales simbólicos)."
REED_OF_HIDDEN_CURRENTS_PERK_EFFECT:0 "#Bold Bonus a la probabilidad de éxito de identificación en la práctica de alquimia.#!\nLa momia potencia un poco de heno, paja o hierba para detectar la presencia de otra sustancia específica".
SPARK_OF_RA_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonus para causar heridas al caballero enemigo en combate.#!\nLa Momia puede encender una sustancia inflamable con su Sekhem."
COMPLEX_ELIXIR_PERK_EFFECT:0 "#Bold Desbloquea fórmula compleja de elixir.#!\nLa momia crea un elixir mayor, que mejora el impulso de un solo atributo."
COMPLEX_PHILTRE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('complex_philtre_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un filtro mayor, que induce una emoción más duradera."
COMPLEX_TONIC_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('complex_tonic_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un tónico más avanzado con mayores capacidades curativas."
DANGEROUS_POISON_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('dangerous_poison_modifier').GetNameWithTooltip] Formula.#!\nLa Momia crea un veneno más eficiente."
ONE_HUNDRED_THOUSAND_TONGUES_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('one_hundred_thousand_tongues_modifier').GetNameWithTooltip] Fórmula.#!\nAl crear un ungüento especial para labios y oídos, la momia puede entender cualquier idioma que se hable en su vecindad."
POTION_OF_VALOR_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('potion_of_valor_modifier').GetNameWithTooltip] Fórmula.#!\nLa momia crea una poción que permite a su destinatario ignorar las penalizaciones por heridas durante un breve período de tiempo."
SALTS_OF_THE_DEAD_PERK_EFFECT:0 "#Bold Desbloquea [GetModifier('salts_of_the_dead_modifier').GetNameWithTooltip] Fórmula.#!\nLa momia puede absorber sales especiales que la vuelven inmune a ciertos tipos de daños que afectan solo a los vivos (como la falta de oxígeno). "
TEARS_OF_ISIS_PERK_EFFECT:0 "#Bold Bonus a la probabilidad de éxito de la transmutación en la práctica de alquimia.#!\nLa momia puede destilar Sekhem en forma física, lo que permite almacenarlo para su uso posterior".
ALCHEMY_ASHES_TO_ASHES_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonus para causar lesiones graves al caballero enemigo en combate.#!\nLa momia puede alterar el estado de cualquier sustancia en un instante".
GREATER_QUIDDITY_PERK_EFFECT:0 "#Bold Bonus al efecto de transmutación en la práctica de alquimia.#!\n El bonus arcano aplicado a un objeto se vuelve más potente".
PANACEA_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('panacea_modifier').GetNameWithTooltip] Formula.#!\nLa Momia crea una poción que puede curar cualquier enfermedad (desde el resfriado común hasta la gran viruela), pero no puede curar heridas."
PHILOSOPHERS_STONE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('philosophers_stone_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un polvo que se acumula rápidamente en forma de guijarro que permite transformar cualquier metal en oro o plata."
POTION_OF_SEPARABLE_KA_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('potion_of_separable_ka_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea una poción que le permite separar un alma de su cuerpo."
CATALYST_CRUCIBLE_PERK_EFFECT:0 "#Bold Bonus a la probabilidad de éxito de la transmutación en la práctica de alquimia.#!\nLa Momia puede modificar preparaciones hechas previamente con la ayuda de su Sekhem."
DEADLY_POISON_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('deadly_poison_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un veneno realmente peligroso."
DUST_TO_DUST_PERK_EFFECT:0 "#Bold Desbloquea movimientos de duelo. Bonificación para causar brutal mutilación al caballero enemigo en combate.#!\nLa Momia puede transformar la carne en arcilla al canalizar a Sekhem a través de su toque".
FLESH_OF_THE_GODS_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('flesh_of_the_gods_modifier').GetNameWithTooltip] Fórmula.#!\nAl rociar su cuerpo con polvo de oro, la Momia puede obtener protección mágica temporal".
POTENT_ELIXIR_PERK_EFFECT:0 "#Bold Desbloquea la fórmula de elixir potente.#!\nLa momia crea un elixir mayor, que mejora el impulso de un solo atributo".
POTENT_PHILTRE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('potent_philtre_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un filtro mayor, que induce una emoción más duradera."
POTENT_TONIC_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('potent_tonic_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un tónico más avanzado con mayores capacidades curativas."
POTION_OF_THE_DIVINE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('potion_of_the_divine_modifier').GetNameWithTooltip] Fórmula.#!\nLa momia crea una poción que puede evitar temporalmente la muerte."
POTION_OF_THE_VILE_BODY_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('potion_of_the_vile_body_modifier').GetNameWithTooltip] Fórmula.#!\nLa momia crea una poción que vuelve venenosos todos sus fluidos corporales."
DISTILL_THE_WISDOM_OF_MAAT_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('distill_the_wisdom_of_maat_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia puede destilar su propia calificación de Equilibrio, para que las personas vuelvan a estar en sintonía con el Principio Cósmico".
DRAUGHT_OF_PERFECT_MEMORY_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('draught_of_perfect_memory_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea una sustancia que repara instantáneamente la memoria de su consumidor, eludiendo incluso los bloqueos sobrenaturales."
PERSONAL_POISON_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('personal_poison_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un veneno que solo funcionará en un objetivo específico."
PRINCELY_ELIXIR_PERK_EFFECT:0 "#Bold Desbloquea la fórmula del elixir principesco.#!\nLa momia crea un elixir mayor, que aumenta el impulso de un solo atributo".
PRINCELY_TONIC_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('princely_tonic_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un tónico más avanzado con mayores capacidades curativas."
PRINCELY_QUIDDITY_PERK_EFFECT:0 "#Bold Bonus al efecto de transmutación en la práctica de alquimia.#!\nLa bonificación arcana aplicada a un objeto se vuelve más potente."
RENEWAL_OF_THE_HORUS_PERK_EFFECT:0 "#El modificador de producto Bold Alchemy dura 10 años en lugar de 3 años.#!\nLas fórmulas de Alchemy duran más que antes."
WATER_OF_LIFE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('water_of_life_modifier').GetNameWithTooltip] Formula.#!\nLa Momia puede usar su Sekhem para imbuir cualquier agua pura con habilidades curativas menores."
ELIXIR_OF_THOTHS_APTITUDE_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('elixir_of_thoths_aptitude_modifier').GetNameWithTooltip] Fórmula.#!\nLa momia crea un elixir especializado que otorga destreza en una sola habilidad".
KINGLY_ELIXIR_PERK_EFFECT:0 "#Bold Desbloquea la fórmula del elixir real.#!\nLa momia crea un elixir mucho más poderoso, que mejora el impulso en un solo atributo".
KINGLY_TONIC_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('kingly_tonic_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un tónico altamente enrarecido con mayores capacidades curativas."
KINGLY_QUIDDITY_PERK_EFFECT:0 "#Bold Bonus al efecto de transmutación en la práctica de alquimia.#!\nLa bonificación arcana aplicada a un objeto se vuelve más potente".
PHILTRE_OF_THE_BLACKENED_SANDS_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('philtre_of_the_blackened_sands_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un incienso que transportará a cualquiera que lo inhale a los Mundos de los Espíritus."
DIVINE_ELIXIR_PERK_EFFECT:0 "#Bold Desbloquea la fórmula del elixir divino.#!\nLa momia crea un elixir mayor, que aumenta la potenciación de uno o más atributos".
DIVINE_TONIC_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('divine_tonic_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia crea un tónico altamente enrarecido con mayores capacidades curativas."
DIVINE_QUIDDITY_PERK_EFFECT:0 "#Bold Bonus al efecto de transmutación en la práctica de alquimia.#!\nLa bonificación arcana aplicada a un objeto se vuelve más potente."
DRAUGHT_OF_THE_STALWART_AB_PERK_EFFECT:0 "#Bold Desbloquear [GetModifier('draught_of_the_stalwart_ab_modifier').GetNameWithTooltip] Fórmula.#!\nLa Momia puede fortalecer la resiliencia mental de cualquier persona que ingiera esta sustancia ."
 
# amuletos
 
ASHEN_SHROUD_PERK_EFFECT:0 "Al pintarse la cara, la momia puede aparecer como un no-muerto para asustar a los mortales".
EYE_OF_THE_HORIZON_PERK_EFFECT:0 "Conecta cualquier imagen individual de un ojo con los propios sentidos del artesano, lo que permite a la Momia espiar a un objetivo a través del ojo".
SIMPLE_WARD_PERK_EFFECT:0 "#Bold Permitir fabricar [artefacto|E] del mismo nombre.#!\nLa Momia crea un amuleto protector simple diseñado para evitar amenazas específicas (como el uso de la Nomenclatura Hekau contra ella, ataques dirigidos al corazón, etc. .)".
WARDING_SIGN_PERK_EFFECT:0 "La momia hace gestos simples para alejar la mala suerte".
WOOD_WARD_PERK_EFFECT:0 "#Bold Permitir fabricar [artefacto|E] del mismo nombre.#!\nLa Momia no puede ser dañada con objetos de madera (como estacas)".
AMULET_OF_CLOUD_WALKING_PERK_EFFECT:0 "#Bold Permitir fabricar [artefacto|E] del mismo nombre.#!\nLa Momia puede caminar por el aire hasta el nivel de las nubes."
LESSER_TALISMAN_PERK_EFFECT:0 "#Bold Permitir fabricar [artefacto|E] del mismo nombre.#!\nLa momia crea un talismán que potencia un atributo específico".
LESSER_WARD_PERK_EFFECT:0 "#Bold Permitir fabricar [artefacto|E] del mismo nombre.#!\nLa momia crea un amuleto más simple y protector diseñado para protegerse de amenazas específicas".
PRAYER_OF_THE_AKEN_PERK_EFFECT:0 "La momia llama a uno de los Aken, los asistentes de Anubis, para que le ayude a navegar por el Inframundo."
SCARAB_OF_LIFE_PERK_EFFECT:0 "La momia forma un escarabajo en miniatura que acorta el tiempo necesario para resucitar".
METAL_WARD_PERK_EFFECT:0 "#Bold Permitir fabricar [artefacto|E] del mismo nombre.#!\nLa Momia no puede ser dañada con objetos metálicos."
MAJOR_WARD_PERK_EFFECT:0 "#Bold Permitir fabricar [artefacto|E] del mismo nombre.#!\nLa momia crea un amuleto más protector diseñado para protegerse de amenazas específicas".
SIGN_OF_LUCK_PERK_EFFECT:0 "La momia realiza pequeños rituales supersticiosos para mejorar la fortuna de uno."
VEIL_OF_AMAUNET_PERK_EFFECT:0 "#Bold Permitir fabricar [artefacto|E] del mismo nombre.#!\nLa momia crea un amuleto que le permite volverse invisible para las criaturas mundanas".
