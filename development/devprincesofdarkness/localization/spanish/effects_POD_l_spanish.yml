BODY_MEDING_TECHNIQUE_PERK_EFFECT:0 "La técnica de reparación del cuerpo permite a un inmortal curar el daño causado por una lesión o enfermedad a través de medios rituales".
LINGERING_AID_OF_THE_CAREGIVER_PERK_EFFECT:0 "Un inmortal con este ritual puede transferir suficiente energía para mantener a su paciente sanando a un ritmo acelerado, incluso si se aleja de ella".
SEE_THE_LANDS_OF_THE_SPIRIT_PERK_EFFECT:0 "#Bold Desbloquea '$travel_to_yang_world_decision$' [decisión|E] 。 #!\nCon este hechizo, el Wu T'ian puede entrar en la Umbra".
SENSE_LUCKS_FLOW_PERK_EFFECT:0 "Wu T'ian con este hechizo puede sentir las fluctuaciones de joss, discerniendo la buena o mala suerte que rodea a personas, lugares y eventos".
SNAKE_FIST_STRIKE_PERK_EFFECT:0 "Para contrarrestar las habilidades regenerativas de los demonios y otros seres sobrenaturales, Wu T'ian puede usar este hechizo para acelerar místicamente sus ataques y transformar sus cuerpos en armas letales".
SWEET_DREAMSS_CARESS_PERK_EFFECT:0 "Al contrarrestar el agotamiento con la vitalidad edificante de la energía Yang pura, Sweet Dream's Caress permite a un inmortal desterrar su propia fatiga o la de los demás presionando ligeramente con los dedos los principales puntos de acupuntura".
CALL_THE_SPIRITS_PERK_EFFECT:0 "Este hechizo permite a un inmortal invocar espíritus elementales y de la naturaleza".
DRUNKEN_MONKEY_DANCE_PERK_EFFECT:0 "Bamboleándose y balanceándose como si estuviera completamente ebrio, un Wu T'ian bajo los efectos de este hechizo de alguna manera evita los puños, las balas y otros actos violentos dirigidos contra él con una facilidad que desconcierta y frustra a sus oponentes".
LEAPING_TIGER_POUNCE_PERK_EFFECT:0 "Cargando sus músculos con energía, un Wu T'ian con este hechizo puede saltar distancias asombrosas".
SPIRIT_LANTERN_PERK_EFFECT:0 "Con un gesto, un Wu T'ian con Spirit Lantern puede formar una bola de llamas fantasmales en la palma de su mano, iluminando su entorno con una suave luz dorada que asusta a los demonios y otros seres inmundos".
STORMWIND_PRANA_PERK_EFFECT:0 "Basándose en el principio de movimiento que encarna la esencia de Yang, Wu T'ian emplea esta familia de hechizos para aumentar drásticamente su velocidad".
BIND_THE_DEMONS_SERVANT_PERK_EFFECT:0 "Este hechizo permite a un inmortal desterrar o unir espíritus menores y demonios de los Reinos Yang".
ELEGANT_CRANE_DEFTNESS_PERK_EFFECT:0 "Impulsados por su Chi yang, Wu T'ian se vuelve sobrenaturalmente ligero y ágil con este arte, capaz de mantener el equilibrio sin esfuerzo en los salientes más estrechos, correr por superficies inestables como agua y arenas movedizas o usar las hojas de un árbol para sostener su peso para escalar".
OPENING_THE_THIED_EYE_PERK_EFFECT:0 "Con este hechizo, un Wu T'ian puede perforar el Velo y despertar a los mortales al mundo oculto del shen".
THE_CLEARING_OF_THE_WAY_PERK_EFFECT:0 "#Bold Desbloquea '$strengthening_or_weakening_the_wall_decision$' [decisión|E].#!\nCon este hechizo, el Wu Feng puede manipular la calificación del Muro en su entorno inmediato".
FLAME_HAND_STRIKE_PERK_EFFECT:0 "Sus manos envueltas en un aura de Chi ardiente, un inmortal con este hechizo baña a sus enemigos en fuego con cada toque".
MANTLE_OF_DIVINE_AUTHORITY_PERK_EFFECT:0 "Invocando el mandato del Augusto Personaje de Jade y la fiel administración de los Ocho Inmortales, un Wu T'ian que se atreve a pronunciar las palabras celestiales de poder en el centro de este hechizo invoca la autoridad y el poder justo de el Trono de Jade".
PLAGUE_CURING_METHOD_PERK_EFFECT:0 "Con este hechizo, el Wu T'ian puede transferir energía Yang al cuerpo de un paciente después de atenderlo durante al menos 15 minutos".
TEN_PACES_STRIKE_PERK_EFFECT:0 "Al pasar por alto la necesidad habitual de contacto físico, un Wu T'ian con este hechizo puede proyectar de forma invisible la fuerza de un solo ataque de artes marciales a través de una distancia intermedia mediante el poder de su Chi concentrado".
WALK_THE_BARRIERS_PERK_EFFECT:0 "Walk the Barriers permite a un inmortal transferir su forma física al Reino Yang".
RESTORATION_OF_YOUTHS_VIGOR_PERK_EFFECT:0 "Los maestros de Feng Tan pueden realizar el milagro del renacimiento del fénix para deshacer los estragos del tiempo y renovar la vitalidad de la juventud de un mortal".
GENTLE_TYPHOONS_PASSING_PERK_EFFECT:0 "La muerte de Gentle Typhoon, que se invoca durante el combate, transforma a un maestro de Feng Tan en un ojo de perfecta calma en el corazón de un furioso torbellino de puños".
TRANSCENDANT_LIVING_FLAME_PERK_EFFECT:0 "Con este hechizo de último recurso, el Wu T'ian puede restaurarse a sí mismo o a un aliado por completo, dado que el Cielo considera que la situación es lo suficientemente desesperada".
HUNDRED_SHADOW_CLOUD_PERK_EFFECT:0 "Con este hechizo, un Wu T'ian puede hacer que una espesa nube de oscuridad espectral surja de su sombra como una niebla negra".
IRON_BODY_MEDITATION_PERK_EFFECT:0 "La meditación del cuerpo de hierro permite que un Wu T'ian canalice la energía yin a través de su carne, fortaleciendo su cuerpo contra las lesiones al meditar durante una hora".
LESSER_SPIRIT_PROJECTION_PERK_EFFECT:0 "#Bold Desbloquea '$travel_to_yin_world_decision$' [decisión|E].#!\nCon este hechizo, el Wu T'ian puede entrar al inframundo".
STILL_THE_FLUTTERING_WING_PERK_EFFECT:0 "Los objetivos afectados por Still the Fluttering Wing sufren una breve parálisis y no pueden hacer nada hasta que hayan "quemado" los éxitos del hechizo declarando el mismo número de acciones".
LUNGTAN_UNSEEN_PASSAGE_PERK_EFFECT:0 "Al iniciar este hechizo, Xian Lung puede afectar su clasificación Arcana para permanecer en el anonimato y una persona casi sin rostro".
THE_WAY_OF_THE_CALM_SOUL_PERK_EFFECT:0 "La vía del alma tranquila permite que un Wu T'ian alivie los estados de pánico o ansiedad (como el frenesí) en una persona".
EBON_BONDS_PERK_EFFECT:0 "Con una palabra y un gesto, un inmortal puede conjurar místicas cintas negras de la propia sombra de un objetivo para atraparlo con lazos tan suaves como la seda y fuertes como el acero."
ICE_HAND_STRIKE_PERK_EFFECT:0 "Envolviendo sus manos en un halo azul de yin helado, un Wu T'ian bajo los efectos de este hechizo deja un frío entumecedor con cada golpe".
KNOW_THE_WANDERING_SOUL_PERK_EFFECT:0 "Con este ritual, Xian Lung puede obtener información sobre incluso los más extraños mortales, animales y espíritus".
NO_MIND_KATA_PERK_EFFECT:0 "Al aclarar su mente y permitir que la serenidad del Tao lo inunde, un Wu T'ian con este hechizo puede ejercer su voluntad para realizar hazañas verdaderamente sobrehumanas en un área previamente elegida".
BRAMBLES_ON_THE_ROAD_PERK_EFFECT:0 "#Bold Desbloquear '$strengthening_or_weakening_the_wall_decision$' [decisión|E].#!\nUsando este Ritual, Xian Lung puede aumentar la calificación de la Sábana Santa en su vecindad".
GHOST_WALKING_METHOD_PERK_EFFECT:0 "Al invocar este hechizo, Xian Lung se vuelve indetectable en un sentido elegido por éxito".
PROJECTION_OF_INWARD_BEING_PERK_EFFECT:0 "Con este hechizo, un Wu T'ian puede desenmascarar a un ser sobrenatural oculto infundiendo Chi a la sombra de un objetivo para que asuma la forma del verdadero yo de su propietario (forma Crinos para Hengeyokai, Mien para Hsien, etc.). "
SHIELD_OF_FORTUNE_PERK_EFFECT:0 "Xian Lung puede envolverse en joss, generando mala suerte en aquellos que quieren hacerle daño".
BLUR_THE_MIND_PERK_EFFECT:0 "Al invocar este hechizo, Xian Lung puede hacer que su víctima olvide eventos que ocurrieron en su vecindad reciente"
PROTECT_AGAINST_THE_DEMON_PERK_EFFECT:0 "Con este ritual, Xian Lung puede crear protecciones que impiden que los demonios y otros sirvientes de los Reyes Yama entren en un área".
SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT:0 "Con este ritual, los Xian Lung se preparan para la Sexta Edad".
WHISPERING_STONES_PERK_EFFECT:0 "Con este ritual, Xian Lung puede grabar recuerdos de los muertos de la Tempestad para traducir documentos en idiomas desconocidos o extinguidos."
DEATH_TOUCH_PERK_EFFECT:0 "Reservado solo para los demonios más terribles, el legendario dim mak permite a los maestros de Lung Tan interrumpir catastróficamente el flujo de chi de un solo objetivo, paralizando o matando con solo un toque".
EYE_OF_THE_TEMPEST_PERK_EFFECT:0 "Al meditar para dejar ir todo miedo y duda, la calma interior de Xian Lung puede incluso sofocar tormentas o crear una "burbuja" protegida si la tormenta se vuelve feroz".
TREAD_THE_DRAGON_TRACKS_PERK_EFFECT:0 "#Bold Desbloquea la [interacción|E] del mismo nombre.#!\nCon este Ritual, Xian Lung puede sintonizar su Chi interno con el flujo de una Línea Dragón cercana y viajar a Dragon Nest de una manera segundos después de pasar una hora meditando dentro de un Nido de Dragón o a lo largo de una Línea de Dragón".
GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT:0 "Recordando la majestuosidad de Wan Xian antes de su caída en desgracia, Godbody of the Celestial Emperor rodea a su lanzador en un halo de luz plateada que ilumina el camino ante Wu T'ian, induce un estado mental en los mortales similar a la Niebla y obliga a huir a los sobrenaturales contaminados".
