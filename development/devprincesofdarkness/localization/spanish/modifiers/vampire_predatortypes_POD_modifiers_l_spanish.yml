l_spanish:
 predatortype_farmer_modifier:0 "Tipo de depredador: Granjero"
 predatortype_farmer_modifier_desc:0 "Este vampiro prefiere alimentarse de animales"
 predatortype_bloodleech_modifier:0 "Tipo de depredador: Sanguijuela"
 predatortype_bloodleech_modifier_desc:0 "¡Este vampiro prefiere alimentarse de la sangre de otros vampiros!"
 predatortype_phlebotomist_modifier:0 "Tipo de depredador: Flebotomista"
 predatortype_phlebotomist_modifier_desc:0 "Este vampiro adquiere vitae bajo la apariencia de un médico que realiza sangrías."
 predatortype_bedlamite_modifier:0 "Tipo de depredador: Bedlamita"
 predatortype_bedlamite_modifier_desc:0 "Este vampiro se alimenta de los locos.  También pueden estar locos, o al menos parecerlo a sus presas."
 predatortype_cenobite_modifier:0 "Tipo de depredador: Cenobita"
 predatortype_cenobite_modifier_desc:0 "Este vampiro tiene un rebaño en una institución religiosa como un monasterio."
 predatortype_alleycat_modifier:0 "Tipo de depredador: Alleycat"
 predatortype_alleycat_modifier_desc:0 "Este vampiro acecha y ataca violentamente a los mortales para conseguir la sangre.  Es un enfoque vulgar".
 predatortype_cauchemar_modifier:0 "Tipo de depredador: Cauchemar"
 predatortype_cauchemar_modifier_desc:0 "Este vampiro sólo se alimenta de los que están dormidos."
 predatortype_familias_modifier:0 "Tipo de depredador: Familias"
 predatortype_familias_modifier_desc:0 "Este vampiro se alimenta casi exclusivamente de una dinastía familiar concreta.  Puede que incluso estén emparentados con la familia; al menos eso es lo que piensa la familia".
 predatortype_footpad_modifier:0 "Tipo de depredador: Footpad"
 predatortype_footpad_modifier_desc:0 "Este lich corre con los bajos fondos de la sociedad, tomando la sangre de los empobrecidos. Si desaparecen, las autoridades no muestran interés".
 predatortype_consensualist_modifier:0 "Tipo de depredador: Consensualista"
 predatortype_consensualist_modifier_desc:0 "Este vampiro sólo se alimenta de los dispuestos... lo que complica enormemente la cobertura de la Mascarada en el dominio."
 predatortype_osiris_modifier:0 "Tipo de depredador: Osiris"
 predatortype_osiris_modifier_desc:0 "Este vampiro dirige un culto a la sangre, como en la antigüedad.  Los kinesiólogos adoran y se ofrecen libremente a este dios de la sangre".
 predatortype_siren_modifier:0 "Tipo de depredador: Sirena"
 predatortype_siren_modifier_desc:0 "Este vampiro seduce a los amantes para drenar su sangre a través del beso."
 predatortype_gentry_modifier:0 "Tipo de depredador: Gentry"
 predatortype_gentry_modifier_desc:0 "Este vampiro tiene una posición de cierto estatus en la sociedad mortal.  Utiliza ese estatus para cazar a los ricos y poderosos.  Nadie creerá que alguien de tal refinamiento es un monstruo".
 predatortype_graverobber_modifier:0 "Tipo de depredador: Graverobber"
 predatortype_graverobber_modifier_desc:0 "Este vampiro ronda los cementerios y las criptas, alimentándose de los dolientes y de la sangre fría de los recién fallecidos." 
 predatortype_extortionist_modifier:0 "Tipo de depredador: Extorsionista"
 predatortype_extortionist_modifier_desc:0 "Este vampiro amenaza y explota a los mortales por su sangre. Los extorsionistas hacen 'ofertas que no pueden ser rechazadas'".
 
 

