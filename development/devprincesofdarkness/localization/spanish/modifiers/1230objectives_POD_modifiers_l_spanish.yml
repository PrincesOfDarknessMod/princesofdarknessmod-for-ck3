l_spanish:
 mithras_bane_modifier:0 "La perdición de Mithras"
 mithras_bane_modifier_desc:0 "Este prestigioso Vampiro ha desalojado a Mithras y su calaña de Britannia. Semejante hazaña es conocida en todo el mundo".
 politically_secure_modifier:0 "Políticamente seguro"
 politically_secure_modifier_desc:0 "Han optado por no dar la vuelta a la tortilla al reconstruir su utopía. Aunque nunca lo dirían abiertamente, muchos agradecen esta forma de actuar."
 hostile_shadows_modifier:0 "Sombras hostiles"
 hostile_shadows_modifier_desc:0 "Tu meteórico ascenso ha provocado la envidia de muchos. Habrá puñales esperándote en las sombras durante mucho tiempo".
 blood_horn_modifier:0 "Cuerno de sangre"
 blood_horn_modifier_desc:0 "Has redescubierto el famoso Cuerno de Sangre de Odín, un artefacto que puede crear sangre a partir de cualquier líquido."
 broken_authority_modifier:0 "Autoridad rota"
 broken_authority_modifier_desc:0 "Este personaje ha perdido una cantidad alarmante de credibilidad: siempre un problema en la política de los Vampiros."
 capital_past_modifier:0 "Reliquia de Al Andalus"
 capital_past_modifier_desc:0 "Los mortales han pasado de largo por Al Andalus, pero esta ciudad tiene una sociedad de no muertos dedicada a preservar recuerdos de su herencia compartida."
 sword_of_troile_modifier:0 "Espada de Troile"
 sword_of_troile_modifier_desc:0 "Una de las armas más poderosas de la historia Kindred, esta espada de cristal fue empuñada por la propia Troile durante sus numerosas batallas por la defensa de Cartago."
 zmei:0 "'Zmei'"
 zmei_flavor:0 "#Temibles criaturas de inmenso poder, antaño sirvientes del Wyrm, están ahora ligadas a Baba Yaga, la Pequeña Abuela. #!"
 #zmei_legacy_perk_effect:0 "# Temibles criaturas de inmenso poder, antaño sirvientes del Wyrm, están ahora ligadas a Baba Yaga, la Abuelita. #!" 
 babayaga_victory_opinion:0 "Leales a la Arpía".
 eyes_and_ears_modifier:0 "Ojos y orejas"
 eyes_and_ears_modifier_desc:0 "Como líder del clan Nosferatu, tu red de informantes no tiene rival."
 fortified_alamut_modifier:0 "Alamut unido"
 fortified_alamut_modifier_desc:0 "Libre de luchas internas, el Nido de Águila se mantiene indomable como la principal fortaleza del mundo cainita."
 path_of_the_zealot_modifier:0 "Fanático Haqimita"
 path_of_the_zealot_modifier_desc:0 "Unidos bajo el estandarte de la fe, cada asamita es ahora un poderoso defensor de la verdad."
 path_of_the_diplomat_modifier:0 "Diplomático Haqimita"
 path_of_the_diplomat_modifier_desc:0 "Cada assamita está ahora bajo un nuevo liderazgo, lo que le permite invocar favores y amigos de todo el mundo."
 path_of_the_sorcerer_modifier:0 "Hechicero Haqimita"
 path_of_the_sorcerer_modifier_desc:0 "Recluido, pero ahora unido en su investigación, el clan Assamite es el guardián de muchos secretos no contados."
 eternal_consul_modifier:0 "Cónsul eterno"
 eternal_consul_modifier_desc:0 "El gobernante de la Roma Pecadora es una criatura encantadora, que solo necesita un susurro para hacer realidad los deseos más oscuros de la mayoría de la gente."
 lasombra_chronicles_modifier:0 "Crónicas de Lasombra"
 lasombra_chronicles_modifier_desc:0 "El volumen concluyente sobre el ascenso del salvador del Clan Lasombra, la perdición de los Ashirra."
 eternal_caliph_modifier:0 "Califa eterno"
 eternal_caliph_modifier_desc:0 "El victorioso Califa Eterno de los Ashirra es un ser de inmensa autoridad espiritual y temporal."
 ashirra_castle_modifier:0 "Castillo de Ashirra Del'Ombro"
 ashirra_castle_modifier_desc:0 "A medida que el clan Lasombra pasa a ser dominado por los Ashirra, se construye un nuevo cuartel general más adecuado."
 impressed_westerner_opinion:0 "Gangrel occidental impresionado"             
 collapse_civilisation_modifier:0 "Colapso de la civilización"
 collapse_civilisation_modifier_desc:0 "Los lobos están en la puerta, y apenas los estás manteniendo fuera. Tu control no se extiende mucho más allá de tu sala del trono ahora".
 alpha_gangrel_modifier:0 "Gangrel Alpha "
 alpha_gangrel_modifier_desc:0 "Has derrotado a todos los retadores. Todo el clan te trata con respeto, si no con obediencia".
 prime_councilor_modifier:0 "Primer consejero"
 prime_councilor_modifier_desc:0 "Regente del clan en lugar de Tremere, este individuo tiene acceso a conocimientos raros y puede contar con la lealtad de sus compañeros de clan."
 prime_curse_modifier:0 "Maldición primera"
 prime_curse_modifier_desc:0 "La maldición del Primer Consejero ha tocado a este individuo, haciéndole difícil incluso pensar con claridad."
 dark_nobility_modifier:0 "Nobleza oscura"
 dark_nobility_modifier_desc:0 "Gobernando castillos sombríos y población oprimida, el clan Tzimisce, es uno de los gobernantes más intimidantes."
 kupala_empowered_modifier:0 "Empoderado por Kupala"
 kupala_empowered_modifier_desc:0 "Has hecho un trato con el diablo. Literalmente".
 kupala_depowered_modifier:0 "Despotenciado por Kupala"
 kupala_depowered_modifier_desc:0 "El terrícola de los Cárpatos ha tomado la fuerza vital de este individuo para dar poder a su sirviente favorito."
 sargon_codex_modifier:0 "Códice de Sargón"
 sargon_codex_modifier_desc:0 "El poder definitivo, o el conocimiento al menos, es tuyo. Sin embargo, tu cordura ya no es tuya".
 grateful_brethren_opinion:0 "Hermanos agradecidos"
 sargon_fragment_modifier:0 "Fragmento de Sargón"
 sargon_fragment_modifier_desc:0 "Un mero fragmento del destruido Códice Sargón sigue siendo un poderoso receptáculo de profecías y percepciones."
 pseudo_third_modifier:0 "Pseudo Tercero"
 pseudo_third_modifier_desc:0 "No has completado la diablura de Capadocio, pero sigues siendo casi como un nivel de poder y prestigio de 3ª generación."
 cappadocian_purge_modifier:0 "Purga de Capadocio"
 cappadocian_purge_modifier_desc:0 "El nuevo clan Giovanni está centrado en acabar con sus antiguos benefactores, y con cualquiera que los ampare."
 kill_on_sight_modifier:0 "Matar a la vista"
 kill_on_sight_modifier_desc:0 "Señalados por sus enemigos, estos personajes están de prestado, cazados en cada esquina."
 decentralized_rule_modifier:0 "Regla descentralizada"
 decentralized_rule_modifier_desc:0 "No eres más que el guardián de la paz de una variedad de construcciones políticas diferentes. Como tal, aunque se te respeta, no siempre se te obedece".
 serpent_allure_modifier:0 "El encanto de la serpiente"
 serpent_allure_modifier_desc:0 "Estás bendecido por el propio Set, portando un aura palpable que promete el cumplimiento de todo deseo oscuro."
 sword_of_samiel_modifier:0 "Espada de Samiel"
 sword_of_samiel_modifier_desc:0 "El legendario primer guerrero Salubri era un luchador sin igual, y estaba dispuesto a ir más allá de su deber contra las fuerzas de la oscuridad."
 saulot_heir_modifier:0 "Heredero de Saulot"
 saulot_heir_modifier_desc:0 "Eres una criatura tan sabia como lo fue el propio Saulot; algunos incluso dicen que finalmente encontraste Golconda después de todos esos años de lucha."
 usurpers_exposed_modifier:0 "Usurpadores expuestos"
 usurpers_exposed_modifier_desc:0 "El clan Tremere ha sido expuesto como lo que es. Una panda de mentirosos ladrones de almas que casi empujan al clan Salubri a la extinción por su propio beneficio personal."
 herald_of_the_end_modifier:0 "El gran enemigo"
 herald_of_the_end_modifier_desc:0 "Eres Nergal renacido, el precursor de la perdición y la condena de este mundo maldito. Todos se inclinarán o morirán".
 demons:0 "Demonios terrestres"
 demons_flavor:0 "Ángeles caídos de la condenada rebelión de Lucifer. Su prisión abisal tiene debilidades, y pueden ser convocados al plano mortal y atados a un gran coste. #!"
 demons_legacy_perk_effect:0 "#F Ángeles caídos de la condenada rebelión de Lucifer. Su prisión abisal tiene debilidades, y pueden ser convocados al plano mortal y atados a un gran coste. #!" 
 rebel_conqueror_modifier:0 "El Rebelde Conquistador del Oeste"
 rebel_conqueror_modifier_desc:0 "No te inclinas ante ninguna Corte ni ante ningún Ancestro. En tus tierras, tu voluntad es suprema, y ay de los que te desafíen".
 first_magaji_modifier:0 "Primer Magaji"
 first_magaji_modifier_desc:0 "El primer Magaji oficialmente reconocido de toda África tiene una enorme importancia en la política de Laibon."
 TARGET_IS_HUNTER:0 "Es un inquisidor $VALUE|=+0$"
 TARGET_IS_VAMPIRE:0 "Es un Vampiro $VALUE|=+0$"
 chosen_of_light_modifier:0 "Elegido de la luz"
 chosen_of_light_modifier_desc:0 "Hay un aura extraña que rodea a este personaje. Como si la propia divinidad lo hubiera elegido para un propósito mayor".
 link_enoch_modifier:0 "Portal a Enoch"
 link_enoch_modifier_desc:0 "Enoch, la Primera Ciudad, es el verdadero hogar de los Tal'meha'Ra en el Inframundo. Este condado tiene ahora acceso directo a ella y puede extraer recursos a su antojo."
 seed_of_rebellion_modifier:0 "Semilla de Rebelión"
 seed_of_rebellion_modifier_desc:0 "La sombría Tal'mahe'Ra ha plantado la semilla de la desconfianza y la rebelión en este personaje."
 runemages_community_modifier:0 "Comunidad de Runemages"
 runemages_community_modifier_desc:0 "La Sala de Ulf se ha refugiado en esta provincia, proporcionando su influencia mística en su nuevo hogar."
 cursed_by_cathar_modifier:0 "La maldición cátara"
 cursed_by_cathar_modifier_desc:0 "El último cátaro maldijo tu nombre al morir de forma impía. Te sientes... preocupado".
 cathar_community_modifier:0 "Comunidad cátara"
 cathar_community_modifier_desc:0 "Los últimos cátaros se han refugiado aquí, con tu protección. Un hecho que ha molestado a los habitantes".
 lost_in_callous_modifier:0 "Pavor encarnado"
 lost_in_callous_modifier_desc:0 "Te temen. Dicen que Dios te ha abandonado. Pero tú sabes que Él nunca ha estado más cerca".
 bloodline_founder_modifier:0 "Fundador de la línea de sangre"
 bloodline_founder_modifier_desc:0 "Fundador de su propia línea de sangre, cada miembro de este linaje te reconoce como su progenitor."
 firebombs_modifier:0 "Bombas de fuego"
 firebombs_modifier_desc:0 "Esta persona está armada con globos de cerámica que contienen una sustancia extremadamente inflamable, así como un sistema de ignición."
 firespewer_modifier:0 "Fuente de fuego"
 firespewer_modifier_desc:0 "Esta persona va armada con un artilugio experimental capaz de expulsar sustancia inflamable a presión y, al mismo tiempo, encenderla."
 masters_of_fire:0 "Maestros del fuego"
 masters_of_fire_desc:0 "Esta facción ha recuperado el secreto del fuego griego y ha adaptado el arma a sus necesidades."
