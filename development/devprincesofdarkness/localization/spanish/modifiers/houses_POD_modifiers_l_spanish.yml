l_spanish:
 house_hardestadt_modifier:0 "Casa Hardestadt"
 house_hardestadt_modifier_desc:0 "Aunque de linaje algo turbio con el progenitor Ventrue, la Casa Hardestadt ya ha demostrado una agudeza de gobierno que no se veía desde las noches de la Roma Ventrue."
 house_nabonidus_modifier:0 "Casa Nabonidus"
 house_nabonidus_modifier_desc:0 "Este solitario linaje asamita es conocido por inspirar una gran fe a sus seguidores, incluso con las actividades más exóticas que parece tener."
 house_shahiri_modifier:0 "Casa Sha'hiri"
 house_shahiri_modifier_desc:0 "El linaje del Mayor elegido por el propio Haqim como sucesor es una elección de consenso para el dividido clan. Aunque también podría deberse a que Sha'hiri tiene fama de ser un tanto pusilánime."
 house_anath_modifier:0 "Casa Anath"
 house_anath_modifier_desc:0 "La Reina de la Guerra y el Amor es una figura sombría, pero sus hijos han logrado grandes hazañas tanto en la diplomacia como en la guerra. Sin embargo, son conocidos por ser algo imprudentes y directos".
 house_jamal_modifier:0 "Casa Jamal"
 house_jamal_modifier_desc:0 "El implacable líder de la facción Ashirra del Clan Assamita es un guerrero sin parangón. Pero no es conocido por su paciencia contra los infieles".
 house_urshulgi_modifier:0 "Casa Ur'Shulgi"
 house_urshulgi_modifier_desc:0 "El linaje del Pastor Negro es un misterio. Y por el bien de todos, debe permanecer sin resolver".
 house_thetmes_modifier:0 "Casa Thetmes"
 house_thetmes_modifier_desc:0 "La Araña tiene planes dentro de los planes. Y no tiene tiempo para ocuparse de asuntos triviales como la gobernación".
 house_anosh_modifier:0 "Casa Anosh"
 house_anosh_modifier_desc:0 "Rechazado por todo su clan, el linaje Anosh es de visiones y experimentación hacia lo desconocido."
 house_azrael_modifier:0 "Casa Azrael"
 house_azrael_modifier_desc:0 "Los mejores guerreros de un clan guerrero lo hacen ellos mismos".
 house_nakurtum_modifier:0 "Casa Nakurtum"
 house_nakurtum_modifier_desc:0 "La temeraria y ardiente Nakurtum tomó por asalto el clan Assamita. Espera la debida diligencia de sus súbditos, pero le cuesta ganársela".
 house_abuilaf_modifier:0 "Casa Abu Ilaf"
 house_abuilaf_modifier_desc:0 "La casa menor de un vástago menor de Haqim ha creado sobre todo buscadores dedicados, a menudo recluidos y retraídos."
 house_shango_modifier:0 "Casa Shango"
 house_shango_modifier_desc:0 "Astutos gobernantes y consejeros, los Shango siguen siendo objeto de desconfianza entre los Laibon por sus formas crueles. Como tal, es bastante raro que un Shango lidere un gran dominio sin represalias."
 house_wahsheen_modifier:0 "Casa Wah'Sheen"
 house_wahsheen_modifier_desc:0 "Es difícil ganarse la confianza de un Ashirra Gangrel, pero una vez que lo haces, es un vínculo inquebrantable."
 house_saad_modifier:0 "Casa Saad"
 house_saad_modifier_desc:0 "Los beduinos del Clan Assamita están algo mal vistos y tienden a mantenerse unidos o con sus tribus."
 house_zayyat_modifier:0 "Casa Zayyat"
 house_zayyat_modifier_desc:0 "La Casa Zayyat arde con la fe de los recién convertidos. Un espectáculo inspirador y aterrador".
 house_hannibal_modifier:0 "Casa Hannibal"
 house_hannibal_modifier_desc:0 "Aunque luchan con valentía y con una mente estratégica segura, los miembros de la Casa Hannibal siempre parecen destinados a fracasar al final."
 house_losario_modifier:0 "Casa Losario"
 house_losario_modifier_desc:0 "Los miembros de la Casa Losario son incombustibles e innovadores, siempre superando los límites. Sin embargo, nadie parece capaz de seguir enfadado con nosotros durante mucho tiempo."
 house_leeland_modifier:0 "Casa Leeland"
 house_leeland_modifier_desc:0 "Los Leeland son los líderes apasionados del mundo libre cainita. Los clanes tradicionales siempre sospecharán que planean algo".
 house_menele_modifier:0 "Casa Menele"
 house_menele_modifier_desc:0 "Implacables cuando luchan por sus convicciones, los miembros de la Casa Menele suelen estar ciegos ante amenazas más sutiles."
 house_dominic_modifier:0 "Casa Dominic"
 house_dominic_modifier_desc:0 "Bien versados en el arte de la guerra, los miembros de la Casa Dominic suelen ser, por desgracia, presas fáciles para su Bestia, especialmente voraz."
 house_gersakkun_modifier:0 "Casa Gersakkun"
 house_gersakkun_modifier_desc:0 "Este linaje casi olvidado no ha dejado su huella en la historia de Brujah, a pesar de haber producido algunos filósofos con talento."
 house_truebrujah_modifier:0 "Casa Verdadera Brujah"
 house_truebrujah_modifier_desc:0 "Nadie sabe si hay verdad en la extraña historia de origen de este linaje. Pero su frialdad distante no les hace ganar amigos de ninguna manera".
 house_baytmushakis_modifier:0 "House Bay't Mushakis"
 house_baytmushakis_modifier_desc:0 "Los Brujah musulmanes fueron implacables en su caza de los odiados Ventrue. Son tenaces para con cualquier amigo de su gran enemigo".
 house_guillaume_modifier:0 "Casa Guillaume"
 house_guillaume_modifier_desc:0 "Justos y ecuánimes, los miembros de la Casa Guillaume se preocupan más por el estado de sus almas que por cualquier mezquindad política."
 house_azif_modifier:0 "Casa Azif"
 house_azif_modifier_desc:0 "La casa Azif lleva los estigmas de su codicioso robo de alma de un progenitor. Un crimen que pocos están dispuestos a olvidar".
 house_osebo_modifier:0 "Casa Osebo"
 house_osebo_modifier_desc:0 "Abandonados a su suerte, los Osebo son una criatura de fuego e ira apenas contenida. Sin embargo, ellos mismos lo saben y buscan patrones justos para mantenerse a raya."
 house_giovanni_modifier:0 "Casa Giovanni"
 house_giovanni_modifier_desc:0 "A estos les gusta mantenerlo en familia".
 house_lazarene_modifier:0 "Casa Lazarene"
 house_lazarene_modifier_desc:0 "Los mendigos no pueden ser elegidos, perseguidos por su propio clan, los de Lázaro se alían con cualquiera que esté dispuesto."
 house_japhet_modifier:0 "Casa Japhet"
 house_japhet_modifier_desc:0 "Los líderes tradicionales del Clan Cappadocian tienen un enfoque muy poco participativo. Puede ser gratificante... y peligroso".
 house_byzar_modifier:0 "Casa Byzar"
 house_byzar_modifier_desc:0 "Los miembros de la Casa Byzar son constructores de civilizaciones. Sin embargo, no son los mejores para defenderlas".
 house_premascine_modifier:0 "Casa Premascine"
 house_premascine_modifier_desc:0 "Si la ambición fuera una virtud, aquí están sus ángeles".
 house_harbingersofskulls_modifier:0 "Casa Harbingers"
 house_harbingersofskulls_modifier_desc:0 "El extraño grupo de degolladores de Cappadocians se encuentra mucho más a gusto en las sombras que en el trono."
 house_lamia_modifier:0 "La casa Lamia"
 house_lamia_modifier_desc:0 "Nadie conoce el verdadero fin de las hijas guerreras de Lilith. Y no lo cuentan".
 house_mlawatu_modifier:0 "Casa Mia Watu"
 house_mlawatu_modifier_desc:0 "No puedes confiar en un ser que busca el poder las almas y los cuerpos de los muertos. Aunque sepan cosas que tú deseas".
 house_almawt_modifier:0 "Casa Al Mawt"
 house_almawt_modifier_desc:0 "Con cuidado de no atraer la ira del mundo musulmán, los capadocios de esta casa tienen pocos aliados, pero muchos secretos."
 house_hecata_modifier:0 "Casa Hecata"
 house_hecata_modifier_desc:0 "Una noche, la Diosa de la Muerte acogerá en su frío abrazo a todos sus hijos descarriados."
 house_rusenko_modifier:0 "Casa Rusenko"
 house_rusenko_modifier_desc:0 "Si la locura es una escalera, no queda mucho por subir".
 house_lhiannan_modifier:0 "Casa Lhiannan"
 house_lhiannan_modifier_desc:0 "Las reliquias de una época pasada luchan hasta su último aliento. Y es un espectáculo peligroso de contemplar".
 house_odin_modifier:0 "Casa Odín"
 house_odin_modifier_desc:0 "El Padre Todopoderoso está observando la última resistencia de los Einherjar. Y ningún cobarde entrará en el Valhalla".
 house_rufus_modifier:0 "Casa Rufus"
 house_rufus_modifier_desc:0 "Rufus ha protegido sus montañas durante miles de años. Pretende continuar durante mil más".
 house_matasuntha_modifier:0 "Casa Matasuntha"
 house_matasuntha_modifier_desc:0 "Los hunos casi destruyeron Roma en el pasado. No tiene intención de que la detengan dos veces".
 house_hukros_modifier:0 "Casa Hukros"
 house_hukros_modifier_desc:0 "El linaje de Hukros siempre está buscando verdades ocultas, un espíritu curioso que no sienta bien a los correligionarios."
 house_aajav_modifier:0 "Casa Aajav"
 house_aajav_modifier_desc:0 "El estandarte de Aajav ondea en lo alto del cielo, el último grito de desafío de un mundo moribundo. Ya no hay vuelta atrás".
 house_kurru_modifier:0 "Casa Kurru"
 house_kurru_modifier_desc:0 "Los miembros de la Casa Kurru se sienten inusualmente cómodos en los roles de liderazgo que el resto del clan Gangrel. Sin embargo, su enfoque directo del liderazgo los deja a menudo expuestos a tácticas turbias."
 house_vola_modifier:0 "Casa Vola"
 house_vola_modifier_desc:0 "Los robustos norteños de la Casa Vola no tienen paciencia con los tontos. Hay que hacer incursiones y saqueos!"
 house_anda_modifier:0 "Casa Anda"
 house_anda_modifier_desc:0 "El azote de las estepas son guerreros inigualables, pero pueden tener dificultades para adaptarse a los rigores de gobernar vastas extensiones de tierra."
 house_akunanse_modifier:0 "Casa Akunanse"
 house_akunanse_modifier_desc:0 "Las sabias arañas de África muestran poco interés por los Jyhad. Esto los convierte en vecinos útiles, pero gobernantes pobres".
 house_noiad_modifier:0 "Casa Noiad"
 house_noiad_modifier_desc:0 "Los extraños cainitas del norte helado son criaturas salvajes, no aptas para gobernar zonas pobladas."
 house_montano_modifier:0 "Casa Montano"
 house_montano_modifier_desc:0 "Los líderes tradicionales del Clan Lasombra son místicos reclusos, a menudo poco aptos para sus funciones."
 house_deruiz_modifier:0 "Casa De Ruiz"
 house_deruiz_modifier_desc:0 "Los odiados enemigos del musulmán ibérico están profundamente arraigados en la cultura caballeresca de Iberia, y hacen pleno uso de ella."
 house_narses_modifier:0 "Casa Narses"
 house_narses_modifier_desc:0 "Los antaño grandes líderes de la Herejía Cainita yacen dispersos y rotos desde la muerte de su arzobispo. Sus pecados no deben ser olvidados".
 house_boukephos_modifier:0 "Casa Boukephos"
 house_boukephos_modifier_desc:0 "El erudito diplomático childe de Lasombra es un cainita amable, querido por la generación más joven. Sin embargo, suele ser propenso a los ataques de vagabundeo lejos de su reino".
 house_sybil_modifier:0 "Casa Sybil"
 house_sybil_modifier_desc:0 "El resto del clan apenas reconoce el linaje de la hija rechazada. Por ello, han aprendido a confiar sobre todo en ellos mismos".
 house_gratiano_modifier:0 "Casa Gratiano"
 house_gratiano_modifier_desc:0 "Gratiano está destinado a grandes cosas. Y se empeña en recordárselo a todo el mundo".
 house_khanommehr_modifier:0 "Casa Khanom Mehr"
 house_khanommehr_modifier_desc:0 "Ajena a la política, la Casa Khanom Mehr se dedica a la protección del clan y de su fundador."
 house_karotos_modifier:0 "Casa Karotos"
 house_karotos_modifier_desc:0 "El linaje casi desconocido de un misterioso Lasombra carga con pocos eventos traumáticos del pasado pero tiene todo por demostrar."
 house_qabilatalkhayal_modifier:0 "Casa Qabilat al-Khayal"
 house_qabilatalkhayal_modifier_desc:0 "Los Ashirra Lasombra están a la defensiva, su implacable celo es a la vez una bendición y una maldición en estos tiempos difíciles."
 house_allama_modifier:0 "Casa al-Lam'a"
 house_allama_modifier_desc:0 "Con su flexible diplomacia, la pequeña Casa al-Lam'a está asegurando su supervivencia, a pesar de su reticencia a utilizar tácticas turbias."
 house_tubalcain_modifier:0 "Casa Tubalcain"
 house_tubalcain_modifier_desc:0 "Amos del Dominio, la Casa Tubalcain no ve con buenos ojos las opiniones religiosas divergentes."
 house_tepelit_modifier:0 "Casa Tepelit"
 house_tepelit_modifier_desc:0 "El solitario y casi desconocido Tepelit ha visto visiones de su perdición y, según algunos, incluso la ha aceptado."
 house_blueeye_modifier:0 "Casa Ojo Azul"
 house_blueeye_modifier_desc:0 "Este mítico linaje de Lasombra es un recluso, que la mayoría estaría de acuerdo en que no es apto para gobernar u ocupar puestos de poder."
 house_ramanga_modifier:0 "Casa Ramanga"
 house_ramanga_modifier_desc:0 "Un linaje despiadado que no duda en influir abiertamente en los kines, la Casa de la Reina de Madagascar sólo se fía de sí misma en cuestión de gobernar."
 house_lamdiel_modifier:0 "Casa Lamdiel"
 house_lamdiel_modifier_desc:0 "Con interminables visiones de perdición y oscuridad, no es fácil ser miembro de la Casa Lamdiel."
 house_eater_modifier:0 "Comedor de la casa"
 house_eater_modifier_desc:0 "Siempre te está observando, esperando el momento de arrebatarte las palabras si no tienes cuidado".
 house_brahina_modifier:0 "Casa Brahina"
 house_brahina_modifier_desc:0 "Criaturas de intensa pasión, a los miembros de la Casa Brahina les cuesta mantenerse concentrados en un tema durante mucho tiempo."
 house_delaurent_modifier:0 "Casa De Laurent"
 house_delaurent_modifier_desc:0 "Erudito centrado y con talento, De Laurent se encuentra mejor a solas en su biblioteca, no gobernando una gran sala."
 house_midian_modifier:0 "Casa Midian"
 house_midian_modifier_desc:0 "Los tiranos pueden tener suerte. Pero siempre se agotará más pronto que tarde".
 house_banes_modifier:0 "Casa Banes"
 house_banes_modifier_desc:0 "Conocer el futuro puede ser una bendición. Pero también puede hacer añicos un asidero ya precario a la realidad."
 house_plague_modifier:0 "Casa Plaga"
 house_plague_modifier_desc:0 "La Casa de las Plagas tiene una misión singular y horrible que hace que sea muy peligroso acercarse a ellos."
 house_izaha_modifier:0 "Casa Izaha"
 house_izaha_modifier_desc:0 "Esta Casa Malkavian está aún más loca que de costumbre, pero hay un filo extraño en sus ojos retorcidos."
 house_lerterimas_modifier:0 "Casa Lerterimas"
 house_lerterimas_modifier_desc:0 "Rechazada por su propio clan por su alianza con un poder más oscuro, la Casa Lerterimas corre hacia un apocalipsis de su propia cosecha."
 house_panehesy_modifier:0 "Casa Panehesy"
 house_panehesy_modifier_desc:0 "Esta Casa Malkav egipcia ocupaba grandes posiciones en los antiguos reinos egipcios. Parecía mantener su cordura, si no para apaciguar su búsqueda de un poder superior".
 house_nissiku_modifier:0 "Casa Nissiku"
 house_nissiku_modifier_desc:0 "El Príncipe Astuto sabe cuándo engañar y cuándo encantar. Su presencia se sigue sintiendo en su linaje, que siempre se ve obligado a encontrar nuevas formas de complacer su espíritu en constante expansión."
 house_vrykolakas_modifier:0 "Casa Vrykolakas"
 house_vrykolakas_modifier_desc:0 "El que se escapó sigue corriendo, sin mirar atrás".
 house_yagnatia_modifier:0 "Casa Yagnatia"
 house_yagnatia_modifier_desc:0 "La Abuela ha terminado de huir. Su prole se mantendrá firme y luchará hasta el final si es necesario."
 house_baytmutasharid_modifier:0 "Casa Bay't Mutasharid"
 house_baytmutasharid_modifier_desc:0 "Los Nosferatu del mundo musulmán que se negaron a unirse al Hajj llevan una vida recluida, amargada y al margen de la sociedad."
 house_trajan_modifier:0 "Casa Trajano"
 house_trajan_modifier_desc:0 "Si la Red de Trajano no conoce una información, simplemente no merece la pena conocerla."
 house_absalon_modifier:0 "Casa Absalon"
 house_absalon_modifier_desc:0 "El obispo no muerto de Dinamarca ocupa prestigiosos puestos de poder en su tierra natal. La única tierra que merece la pena, obviamente".
 house_yima_modifier:0 "Casa Yima"
 house_yima_modifier_desc:0 "El Santo Grial del clan Nosferatu es algo por lo que hay que reunirse, consolarse o morir."
 house_alexius_modifier:0 "Casa Alexius"
 house_alexius_modifier_desc:0 "Ardiendo de furia fanática, la Casa Alexius está dispuesta a limpiar a cualquier infiel que se interponga en su camino."
 house_malachite_modifier:0 "Casa Malaquita"
 house_malachite_modifier_desc:0 "La Roca de Constantinopla es también su última esperanza. Ningún obstáculo podrá bloquear el camino de los Elegidos de Miguel".
 house_guruhi_modifier:0 "Casa Guruhi"
 house_guruhi_modifier_desc:0 "Tradicionalmente líderes de los Laibon, los Guruhi premian su lugar, lejos de las cunetas de sus primos del Norte."
 house_al_hajj_modifier:0 "Casa al-Hajj"
 house_al_hajj_modifier_desc:0 "Protectores de las Ciudades Sagradas, indomables en su fe".
 house_chandraputra_modifier:0 "Casa Chandraputra"
 house_chandraputra_modifier_desc:0 "El líder indiscutible del Clan Ravnos durante milenios no se quedará de brazos cruzados mientras sus hermanos están bajo constante asalto. La victoria o la muerte es la única opción para el General".
 house_ravana_modifier:0 "Casa Ravana"
 house_ravana_modifier_desc:0 "El traidor ha vendido su alma hace tiempo. Nunca subestimes el encanto del Mal en bruto".
 house_hazimel_modifier:0 "Casa Hazimel"
 house_hazimel_modifier_desc:0 "...y, al mirar al Ojo, el conocimiento eterno brotó de él".
 house_alexandrite_modifier:0 "Casa Alexandrite"
 house_alexandrite_modifier_desc:0 "Tomar el oro de la boca de la Serpiente es un movimiento peligroso al que los alejandrinos están acostumbrados."
 house_rroma_modifier:0 "Casa Phuri Dae"
 house_rroma_modifier_desc:0 "Lejos de casa, se mantienen unidos, resguardándose de la interminable tormenta".
 house_kali_modifier:0 "Casa Kali"
 house_kali_modifier_desc:0 "Un linaje olvidado, su existencia borrada de los registros de Ravnos por sus abominables crímenes... o por sus opiniones divergentes".
 house_baytmujirim_modifier:0 "Casa Bay't Mujirim"
 house_baytmujirim_modifier_desc:0 "Desconfiados por el amplio mundo ashirra, los ravnos musulmanes son una raza autosuficiente, resistente aunque cínica."
 house_kinyonyi_modifier:0 "Casa Kinyonyi"
 house_kinyonyi_modifier_desc:0 "Los mensajeros del Reino de Ébano son una visión bienvenida en la mayoría de las cortes, aunque nunca se queden mucho tiempo."
 house_samiel_modifier:0 "Casa Samiel"
 house_samiel_modifier_desc:0 "Los Ángeles se han cansado de esconderse, retirarse o acobardarse. Ha llegado la hora de la guerra".
 house_enosh_modifier:0 "Casa Enosh"
 house_enosh_modifier_desc:0 "Los sabios consejeros de la Casa Enosh son un grupo estoico, que rara vez considera la violencia como una posibilidad."
 house_rayzeel_modifier:0 "Casa Rayzeel"
 house_rayzeel_modifier_desc:0 "Los sanadores del Clan Salubri ya han visto mucha muerte. Su espíritu se debilita por cada herida que curan".
 house_twilight_modifier:0 "Casa Crepúsculo"
 house_twilight_modifier_desc:0 "Defensores de la humanidad, implacables en su guerra contra el mal".
 house_hrorsh_modifier:0 "Casa Hrorsh"
 house_hrorsh_modifier_desc:0 "Sin estar preparada contra el cruel asalto de los Tremere, la Casa Hrorsh es un recuerdo fantasmal de un clan antaño glorioso."
 house_mokur_modifier:0 "Casa Mokur"
 house_mokur_modifier_desc:0 "La última en caer, como Saulot pretendía desde el principio".
 house_watcher_modifier:0 "Casa Watcher"
 house_watcher_modifier_desc:0 "Mientras sus primos occidentales caen, ellos permanecen en las sombras orientales, su guardia apenas comienza."
 house_khaibit_modifier:0 "Casa Khaibit"
 house_khaibit_modifier_desc:0 "El linaje del primer hijo de Set conlleva el debido respeto y temor entre sus pares."
 house_sarrasine_modifier:0 "Casa Sarrasine"
 house_sarrasine_modifier_desc:0 "Sarrasine mataría a sus padres por cualquier trozo de poder. De hecho, ya lo ha hecho".
 house_jormungandr_modifier:0 "Casa Jormungandr"
 house_jormungandr_modifier_desc:0 "Estos herejes apenas están comprometidos con una causa, salvo su propio beneficio y supervivencia."
 house_isis_modifier:0 "Casa Isis"
 house_isis_modifier_desc:0 "Cuidado con la mujer despechada. Sobre todo si es hija de Isis y tiene el secreto de la vida y la muerte en la palma de su mano."
 house_tawaret_modifier:0 "Casa Taweret"
 house_tawaret_modifier_desc:0 "Taweret luchó una vez contra Kemintiri hasta la muerte y sobrevivió para contarlo. Su destreza corre por su linaje".
 house_nefertiti_modifier:0 "Casa Nefertiti"
 house_nefertiti_modifier_desc:0 "Si el orgullo precede a la caída, Nefertiti estará cayendo durante mucho, mucho tiempo."
 house_maatkare_modifier:0 "Casa Maatkare"
 house_maatkare_modifier_desc:0 "El dulce encanto de la Serpiente es misericordioso... y tan tentador".
 house_seterpenre_modifier:0 "Casa Seterpenre"
 house_seterpenre_modifier_desc:0 "El diplomático Hierofante es lo suficientemente abierto como para trabajar con gente de fuera. Algunos incluso lo llamarían blando".
 house_heru_modifier:0 "Casa Heru"
 house_heru_modifier_desc:0 "Cuidado, esta serpiente tiene unos colmillos muy serios".
 house_scorpio_modifier:0 "Casa Escorpio"
 house_scorpio_modifier_desc:0 "Esta Casa muestra una alarmante afición a elaborar planes largos y apocalípticos. Más alarmante aún es que algunos podrían funcionar realmente algún día..."
 house_porphyrion_modifier:0 "Casa Porphyrion"
 house_porphyrion_modifier_desc:0 "Los Diablos de la India están preparando planes inconfesables para llevar la gloria de Set al subcontinente. Si tienen éxito, no será agradable para nadie".
 house_osiris_modifier:0 "Casa Osiris"
 house_osiris_modifier_desc:0 "Perseguidos por la Serpiente, los Hijos del Dios de la muerte están ahora casi todos con su padre."
 house_damballah_modifier:0 "Casa Damballah"
 house_damballah_modifier_desc:0 "Algo alejados del clan principal, los Hijos de Damballah son un grupo pragmático, que adapta su credo a las creencias africanas."
 house_khaytall_modifier:0 "Casa Khay'Tall"
 house_khaytall_modifier_desc:0 "Los parias herejes que una vez se asociaron a la Constantinopla de Miguel son un linaje perseguido. Sus opciones son menos con cada noche que pasa".
 house_wepwawet_modifier:0 "Casa Wepwawet"
 house_wepwawet_modifier_desc:0 "Este culto guerrero defiende a Egipto de las amenazas exteriores, amenazas que ellos mismos clasifican como tales."
 house_mucalinda_modifier:0 "Casa Mucalinda"
 house_mucalinda_modifier_desc:0 "Los despreciados Naktanchara son una rama budista del clan Setite. Recluidos y a la defensiva, su posición es precaria".
 house_glycon_modifier:0 "Casa Glycon"
 house_glycon_modifier_desc:0 "Los maleantes son una casta de guerreros del clan Setite ávidos de poder. Ciegos a las intrigas, son meros brutos que apuntan al objetivo más cercano".
 house_echidna_modifier:0 "Casa Echidna"
 house_echidna_modifier_desc:0 "Las Gorgonas han previsto su propia desaparición. Su asombrosa aceptación de la misma hace que sean temidos por la mayoría de los cainitas".
 house_nephilim_modifier:0 "Casa Nephilim"
 house_nephilim_modifier_desc:0 "La Casa más prestigiosa del clan Toreador ha caído en tiempos difíciles con la muerte de su fundador. Sin embargo, la semilla de la grandeza sigue ahí".
 house_salianna_modifier:0 "Casa Salianna"
 house_salianna_modifier_desc:0 "Salianna lo ha perdido todo ya dos veces. No dejará que ocurra una tercera vez".
 house_callisti_modifier:0 "Casa Callisti y Callisto"
 house_callisti_modifier_desc:0 "Hábiles diplomáticos, los miembros de esta Casa tienden a olvidarse de lo pequeño por lo grande, lo que ya les ha salido caro."
 house_nicholas_modifier:0 "Casa Nicolás"
 house_nicholas_modifier_desc:0 "Con un linaje inventado, y un comportamiento olvidable, Etienne de Poitiers ha convertido su Casa en un objetivo difícil de localizar."
 house_andrew_modifier:0 "Casa Andrew"
 house_andrew_modifier_desc:0 "El "arcángel" de la Herejía Cainita ha impregnado su Casa con su visión pragmática de utilizar la religión como factor motivador de la guerra."
 house_helena_modifier:0 "Casa Helena"
 house_helena_modifier_desc:0 "Si no te has enamorado de un miembro de la Casa Helena, es que aún no has conocido a ninguno."
 house_baldr_modifier:0 "Casa Baldr"
 house_baldr_modifier_desc:0 "Los Skalds del Norte intentan mantener vivos sus cuentos con el poder de sus canciones y voces."
 house_lubbock_modifier:0 "Casa Lubbock"
 house_lubbock_modifier_desc:0 "Perdidos en sus pasiones, los miembros de la Casa Lubbock son presas fáciles en el implacable mundo cainita."
 house_volgirre_modifier:0 "Casa Volgirre"
 house_volgirre_modifier_desc:0 "Gobernantes mezquinos de dominios mezquinos y esclavistas, la Casa Volgirre son sádicos señores y crueles progenitores."
 house_apollo_modifier:0 "Casa Apolo"
 house_apollo_modifier_desc:0 "Flores pequeñas y delicadas, que buscan el sol y son fácilmente pisoteadas por la guerra."
 house_rayeenalfen_modifier:0 "Casa Ray'een al-Fen"
 house_rayeenalfen_modifier_desc:0 "Los calígrafos del mundo musulmán llevan mucho tiempo enfrascados en un cisma generacional, lo suficiente como para marcarlo en su sangre."
 house_ishtarri_modifier:0 "Casa Ishtarri"
 house_ishtarri_modifier_desc:0 "Plagados de una profunda hambre de satisfacer sus vicios, los Ishtarri son, sin embargo, hábiles en el sutil arte de manipular la información."
 house_goratrix_modifier:0 "Casa Goratrix"
 house_goratrix_modifier_desc:0 "El portador de la luz asegurará una nueva era para el clan, o será tragado por la oscuridad."
 house_etrius_modifier:0 "Casa Etrius"
 house_etrius_modifier_desc:0 "El regente elegido de Tremere lidera una defensa incondicional al frente de un clan maltrecho. Una posición poco envidiable".
 house_leduc_modifier:0 "Casa LeDuc"
 house_leduc_modifier_desc:0 "El antiguo regente de Francia era un cainita respetado allí, mucho más que su sustituto, Goratrix."
 house_meerlinda_modifier:0 "Casa Meerlinda"
 house_meerlinda_modifier_desc:0 "La única mujer del Consejo de los Siete es realmente la que mantiene unida la pirámide. Inglaterra será su premio si logra superar a los cautelosos cainitas de las Islas".
 house_calderon_modifier:0 "Casa Calderón"
 house_calderon_modifier_desc:0 "El feroz español defenderá el honor de Tremere hasta su último aliento, ajeno a las fuerzas más oscuras que actúan."
 house_grimgroth_modifier:0 "La casa Grimgroth"
 house_grimgroth_modifier_desc:0 "Los fantasmas de Mistridge aún enfurecen a esta noche, un único nombre pronunciado en tono de maldición: Grimgroth."
 house_cincao_modifier:0 "Casa de Cincao"
 house_cincao_modifier_desc:0 "Xavier es despiadado en sus métodos, pero nadie puede negar que proporciona resultados asombrosos al hacerlo."
 house_telyavel_modifier:0 "Casa Telyavel"
 house_telyavel_modifier_desc:0 "Perseguidos como herejes, los Magus de la Antigua Fe están encontrando una relativa seguridad con cainitas de ideas afines."
 house_trimira_modifier:0 "Casa Trimira"
 house_trimira_modifier_desc:0 "Extraños en una tierra hostil, obligados a hacer concesiones para sobrevivir."
 house_kartarirya_modifier:0 "Casa Kartarirya"
 house_kartarirya_modifier_desc:0 "Los muchos armados Tzimisce de la India son conocidos por cortar primero varias cabezas antes de hacer preguntas."
 house_yaroslavich_modifier:0 "Casa Yaroslavich"
 house_yaroslavich_modifier_desc:0 "Cuanto más poderoso es, más placer siente Hedeon al aplastar a sus patéticos enemigos."
 house_ruthven_modifier:0 "Casa Ruthvenski"
 house_ruthven_modifier_desc:0 "Los guardianes de la forma corpórea de Tzimisce están cegados por su prestigiosa posición, sin ser conscientes de las muchas amenazas que conlleva."
 house_vykos_modifier:0 "La casa Vykos"
 house_vykos_modifier_desc:0 "Myka se encuentra en una larga búsqueda de sentido. El final del camino se acerca aún más cada noche que pasa..."
 house_rustovitch_modifier:0 "Casa Rustovitch"
 house_rustovitch_modifier_desc:0 "Vladimir intenta domesticar al clan Tzimisce por la fuerza de las armas. Un movimiento audaz y potencialmente mortal".
 house_yorak_modifier:0 "Casa Yorak"
 house_yorak_modifier_desc:0 "Imagina tu peor pesadilla con forma humana. Torturándote por la eternidad. Mientras sus anteriores víctimas te observan, antes de que te unas a ellas en los muros de la Catedral".
 house_tabak_modifier:0 "Casa Tabak"
 house_tabak_modifier_desc:0 "La Casa Tabak está criada para el liderazgo, sabiendo exactamente cuándo exprimir hasta la última gota de sangre de los campesinos, o cuándo huir cuando se ven superados."
 house_dracon_modifier:0 "Casa Dracon"
 house_dracon_modifier_desc:0 "Los piadosos vástagos de los Dracon y los Obertus son poco aptos para la guerra y rehúyen de las prácticas de vicisitud de sus hermanos."
 house_byelobog_modifier:0 "Casa Byelobog"
 house_byelobog_modifier_desc:0 "El Dios Blanco gobierna el Invierno, pero no se preocupa de gobernar nada más."
 house_triglav_modifier:0 "Casa Triglav"
 house_triglav_modifier_desc:0 "La Casa Triglav yace consumida por su disputa contra la Casa Dracon, apenas capaz de otra cosa."
 house_andeleon_modifier:0 "Casa Andeleon"
 house_andeleon_modifier_desc:0 "Ajena a la mayoría de las preocupaciones mundanas, Andeleon busca la verdad más allá de las estrellas."
 house_demdemeh_modifier:0 "Casa Demdemeh"
 house_demdemeh_modifier_desc:0 "El hombre verdaderamente culto sabe que debe trascender la carne para convertirse en un Dios."
 house_djavakhi_modifier:0 "Casa Djavakhi"
 house_djavakhi_modifier_desc:0 "Cuando gobiernes con un hierro primero, nunca bajes la mano".
 house_nagloper_modifier:0 "Casa Nagloper"
 house_nagloper_modifier_desc:0 "¿Cómo puede la Bestia controlarte si tú eres la propia Bestia?"
 house_hrothgar_modifier:0 "Casa Hrothgar"
 house_hrothgar_modifier_desc:0 "Puedes huir de tu propio clan, pero ¿puedes huir de Ragnarok?"
 house_jedrik_modifier:0 "Casa Jedrik"
 house_jedrik_modifier_desc:0 "A veces, la amenaza más grave para tu gobierno está más cerca de lo que crees".
 house_tinia_modifier:0 "Casa Tinia"
 house_tinia_modifier_desc:0 "Consumidos por la sed de viajes, los miembros de la Casa Tinia anhelan experiencias nuevas y exóticas."
 house_mithras_modifier:0 "Casa Mithras"
 house_mithras_modifier_desc:0 "Los vástagos del Dios Sol caen en la fila con facilidad, habiendo sido condicionados por su progenitor desde hace siglos."
 house_alexander_modifier:0 "Casa Alejandro"
 house_alexander_modifier_desc:0 "Alejandro demostró su astuta administración cuando gobernó el imperio más poderoso de Europa Occidental. Pero sus ataques de ira fueron igual de legendarios".
 house_antonian_modifier:0 "Casa Antonian"
 house_antonian_modifier_desc:0 "El Arquitecto del Sueño construyó una de las utopías más impresionantes del mundo cainita. Hasta que se quebró y fue destruido por ello".
 house_camilla_modifier:0 "Casa Camilla"
 house_camilla_modifier_desc:0 "Los vástagos de Roma están legítimamente orgullosos de su legado. Sin embargo, el vasto prestigio y la consideración que ostentan pueden volverlos fácilmente indolentes."
 house_eigermann_modifier:0 "Casa Eigermann"
 house_eigermann_modifier_desc:0 "Matones y brutos que apenas encajan en el Clan Ventrue, la Casa Eigermann es su peor enemigo."
 house_artemis_modifier:0 "Casa Artemis"
 house_artemis_modifier_desc:0 "Los Ventrue ortianos se apoderan de los tronos y rara vez esperan su momento cuando una espada puede acelerar el proceso. Creen que les corresponde la gloria y la toman sin pausa".
 house_bindusara_modifier:0 "Casa Bindusara"
 house_bindusara_modifier_desc:0 "El erudito errante es una fuente de conocimiento, a menudo buscado para aprender los misteriosos caminos de las generaciones pasadas."
 house_veddartha_modifier:0 "Casa Veddartha"
 house_veddartha_modifier_desc:0 "Casi sinónimo del propio Ventrue, Veddartha es una Casa de liderazgo orgulloso y diligente."
 house_arakur_modifier:0 "Casa Arakur"
 house_arakur_modifier_desc:0 "El linaje de Arakur tiene fama de diabólico, de comulgar con los demonios y de arrogante. También son cobardes patentados cuando no pueden intimidar a su manera".
 house_medon_modifier:0 "Casa Medon"
 house_medon_modifier_desc:0 "Medon tiene el dudoso honor de ser el primer vampiro verdaderamente poderoso al que mataron los mortales. Una vergüenza que aún hoy siente su linaje".
 house_nefermeriisis_modifier:0 "Casa Nefer-meri-Isis"
 house_nefermeriisis_modifier_desc:0 "La feroz hija de Ventrue prefiere ensuciarse las manos en la batalla. Como tal, su linaje desprecia depender de otros".
 house_arpad_modifier:0 "Casa Arpad"
 house_arpad_modifier_desc:0 "Tenaz y bien arraigada en la nobleza húngara, la Casa Arpad es un enemigo difícil de desalojar de sus tierras."
 house_antasia_modifier:0 "Casa Antasia"
 house_antasia_modifier_desc:0 "La serena y bien relacionada Julia Antasia cría a su prole de forma respetuosa y amistosa, abordando siempre los asuntos con cuidado y compasión."
 house_le_croise_modifier:0 "Casa le Croise"
 house_le_croise_modifier_desc:0 "Geoffrey sufre los mismos problemas de ira que su sire. Sólo puede contar con su comportamiento de caballero para salvarse de la ira de su clan".
 house_moloch_modifier:0 "Casa Molochim"
 house_moloch_modifier_desc:0 "Guardianes de un mundo ingrato, los Molochim son perseguidos tanto por los otros clanes como por sus compañeros de clan. Los primeros no entienden su propósito, y los segundos lo entienden demasiado bien."
 house_nergal_modifier:0 "Casa Nergalita"
 house_nergal_modifier_desc:0 "Una plaga en un mundo que quieren ver arder, los hijos de Nergal son la más negra de las abominaciones que la maldición de Caine ha producido jamás."
 house_angellisater_modifier:0 "Casa Azanaeli"
 house_angellisater_modifier_desc:0 "Los aborrecibles Angellis Ater son usurpadores dentro del Clan Baali, buscando un camino demencial hacia la condición de demonio."
 house_wankuei_modifier:0 "Casa Wan Kuei"
 house_wankuei_modifier_desc:0 "Los Muertos de Hambre de China son los amos de un vasto Imperio, pero sufren algunas graves limitaciones que los cainitas occidentales podrían aprovechar."
 house_asuratizayya_modifier:0 "Casa Asuratizayya"
 house_asuratizayya_modifier_desc:0 "Tachados de herejes por los otros Wan Kuei, los indios Asuratizayya siguen manteniendo un rígido pero funcional sistema de castas y jerarquía."
 house_penangallan_modifier:0 "Casa Penangallan"
 house_penangallan_modifier_desc:0 "Los descentralizados y matriarcales Wan Kuei de la Corte Escarlata son unos revoltosos que intentan vivir su no-vida al extremo."
 house_wanderers_modifier:0 "Casa Wanderers"
 house_wanderers_modifier_desc:0 "Plagados de Akumas, los Wan Kuei de las estepas están de prestado."
 dynn_nagaraja_modifier:0 "Nagaraja"
 dynn_nagaraja_modifier_desc:0 "La aborrecible maldición de los Nagaraja los convierte en un grupo rechazado, pero también resistente."
 dynn_unbound_modifier:0 "Sin ataduras"
 dynn_unbound_modifier_desc:0 "El mero rumor de tales cainitas y sus linajes es una amenaza para el orden establecido."
 dynn_kiasyd_modifier:0 "Kiasyd"
 dynn_kiasyd_modifier_desc:0 "Los reclusos y misteriosos Kiasyd se dedican a sus laboratorios de alquimia, ajenos a las amenazas que crecen a su alrededor."
 dynn_impundulu_modifier:0 "Impundulu"
 dynn_impundulu_modifier_desc:0 "Los Impundulu buscan un resquicio en un contrato hecho hace tiempo que les está llevando lentamente a su perdición."
 house_ahrimane_modifier:0 "Ahriman"
 house_ahrimane_modifier_desc:0 "Adisa nunca se doblegó ni se echó atrás en una pelea. Sus hijas tampoco lo harán; al fin y al cabo, Freya está mirando".
 house_feroux_modifier:0 "Feroux"
 house_feroux_modifier_desc:0 "Los llamados Gangrel griegos son un linaje orgulloso, habiendo sido una de las principales fuerzas detrás del Sueño de Constantinopla. Su pérdida pesa mucho en sus almas".
 house_siren_modifier:0 "Hijas de la cacofonía"
 house_siren_modifier_desc:0 "Cantan para mí, las sirenas de los siete mares..."
 dynn_knightsofacre_modifier:0 "Caballeros de Acre"
 dynn_knightsofacre_modifier_desc:0 "Los Caballeros son feroces en la batalla, sin duda, pero ven las formas más sutiles de desbaratar los planes del Enemigo."
 dynn_swordofstjames_modifier:0 "Espada de Santiago"
 dynn_swordofstjames_modifier_desc:0 "Seamos sinceros, los seguidores de Rodrigue son unos imbéciles arrogantes. Pero también son unos imbéciles arrogantes muy duros".
 dynn_redorder_modifier:0 "Orden Roja"
 dynn_redorder_modifier_desc:0 "Conocen terribles secretos sobre los horrores de lo desconocido. Pero tanto tiempo en las bibliotecas también les ha hecho bastante... débiles a las tácticas más terrenales."
 dynn_sistersjohn_modifier:0 "Hermanas de San Juan"
 dynn_sistersjohn_modifier_desc:0 "Acosadas por terribles visiones de la perdición, las Hermanas han creado un sentido administrativo muy robusto para fundamentar su espantosa existencia."
 dynn_oculidei_modifier:0 "Oculi Dei"
 dynn_oculidei_modifier_desc:0 "Los miembros paranoicos de los Ojos de Dios suelen tener razón en sus temores. Pero eso no hace que sean queridos por sus compañeros de todos modos".
 dynn_murnau_modifier:0 "Von Murnau"
 dynn_murnau_modifier_desc:0 "La orgullosa casa alemana está acostumbrada a tratar con campesinos evasores de impuestos. El temor a Dios no es sólo para los engendros del infierno, después de todo".
 dynn_gantenbein_modifier:0 "Gantenbein"
 dynn_gantenbein_modifier_desc:0 "Los celosos hermanos bogomilistas son los que más dificultades tienen para conciliar su honesta fe y su necesidad de sangre de vampiro. Ese hecho los aleja de su propio rebaño".
 house_obertus_modifier:0 "Obertus"
 house_obertus_modifier_desc:0 "La caída de Constantinopla pesa mucho sobre la diligente Orden Obertus. Pero siguen trabajando incansablemente para descubrir los secretos más profundos de lo divino."
 house_grimaldi_modifier:0 "Grimaldi"
 house_grimaldi_modifier_desc:0 "Los más humanos de los Revenants son el enlace entre el clan Tzimisce y el mundo mortal. Diplomáticos y comerciantes dotados, son sin embargo despreciados por las familias más belicosas."
 house_bratovitch_modifier:0 "Bratovitch"
 house_bratovitch_modifier_desc:0 "Monstruos brutos que suelen servir a los Tzimisce, los Bratovitch son luchadores y rastreadores, y rara vez participan en eventos sociales más refinados."
 house_szantovich_modifier:0 "Szantovich"
 house_szantovich_modifier_desc:0 "Los Szantovich son mariposas sociales decadentes, adineradas y hedonistas. Estimulan sus sentidos en busca del placer y juegan con los humanos con un abandono temerario. Son probablemente los retornados que menos se controlan a sí mismos".
 house_vlaszy_modifier:0 "Vlaszy"
 house_vlaszy_modifier_desc:0 "Cada Vlaszy es entrenado en la equitación, el arte de los estados, la guerra y otras habilidades cortesanas desde una edad temprana, y muchos ancianos de Tzimisce los prefieren como sus campeones y mensajeros."
 house_basarab_modifier:0 "Basarab"
 house_basarab_modifier_desc:0 "Renombrados por su destreza en la batalla y su liderazgo, son activos valiosos para los tzimisce. El linaje de los Basarab crece cada noche, empezando a hacer que algunos de sus amos se sientan incómodos con la fuerza de sus "mascotas"..."
 house_premysl_modifier:0 "Premysl"
 house_premysl_modifier_desc:0 "Descendientes de un linaje real de Bohemia, los Premysl son señores crueles y mezquinos con los de menor rango, pero fanáticamente devotos de sus amos de Tzimisce."
 house_danislav_modifier:0 "Danislav"
 house_danislav_modifier_desc:0 "Originalmente una dinastía noble con vínculos con los Señores de la Sombra, los Danislav del norte de Transilvania cayeron bajo el dominio del Tzimisce Florescu, que los mantuvo en sus mazmorras durante los primeros diez años de su vida y los condicionó a servirle."
 house_khazi_modifier:0 "Khazi"
 house_khazi_modifier_desc:0 "Esta extraña y recluida estirpe sólo sirve al Matusalén Byelobog y es considerada como parias y bichos raros incluso para los estándares de Tzimisce."
 dynn_ducheski_modifier:0 "Ducheski"
 dynn_ducheski_modifier_desc:0 "Una familia antes llamada Krevcheski y propiedad de los Tzimisce que ahora sirve a los Tremere es conocida por su habilidad en la magia y en la fabricación de artefactos mecánicos, en particular de implementos de tortura. Muchos Tremere hacen que los Ducheski mantengan sus bibliotecas y laboratorios".
 house_oprichniki_modifier:0 "Oprichniki"
 house_oprichniki_modifier_desc:0 "La policía secreta de Iván el Terrible apenas sobrevivió al reinado de su señor. Los supervivientes fueron adoptados por los Tzimisce rusos y criados en una familia de vividores, a pesar de no haber pisado nunca el suelo asolado de Transilvania."
 house_narov_modifier:0 "Narov"
 house_narov_modifier_desc:0 "Los arrogantes Narov son despreciados por la mayoría de las demás familias, pero su fastuoso estilo de vida sigue siendo la envidia de muchos."
 house_rustovitchi_modifier:0 "Rustovitchi"
 house_rustovitchi_modifier_desc:0 "Arrojados a una guerra en la que no quieren luchar, los Rustovitchi no tienen más remedio que ganar o morir."
 house_ruthvenski_modifier:0 "Ruthvenski"
 house_ruthvenski_modifier_desc:0 "Los Ruthvenski son una línea gastada, que se aferra a su fama de antaño. Su habilidad para gobernar es tan aguda como siempre, pero ya nadie se preocupa de obedecerles."
 house_slatikov_modifier:0 "Slatikov"
 house_slatikov_modifier_desc:0 "Peones de Razkoljna, los Tzimisce de Cracovia, los Slatikov son una pequeña familia de eruditos y hombres cultos, apenas interesados en el gran juego de la Jyhad." 
 dynn_enrathi_modifier:0 "Enrathi"
 dynn_enrathi_modifier_desc:0 "Los Enrathi son esclavistas y siempre lo han sido. A pesar de los tiempos cambiantes, siempre hay gente que busca ofrecer sus servicios... y siempre lo hará".
 dynn_marijava_modifier:0 "Marijava"
 dynn_marijava_modifier_desc:0 "Los espías y asesinos del Tal'mahe'Ra son dedicados, incluso obstinados, en su arte elegido."
 dynn_rafastio_modifier:0 "Rafastio"
 dynn_rafastio_modifier_desc:0 "Las seductoras Rafastio están vagamente asociadas a la Tal'mahe'Ra, donde sirven a partes iguales como videntes y mariposas de la sociedad."
 dynn_dhabi_modifier:0 "D'habi"
 dynn_dhabi_modifier_desc:0 "Los D'habi, de voluntad débil, están mentalmente destrozados por siglos de maltrato a manos de sus amos baales."
 dynn_keskinen_modifier:0 "Keskinen"
 dynn_keskinen_modifier_desc:0 "Los Keskinen son una familia diminuta y muy unida que sirve al Matusalén loco llamado Louhi. Practican magias antiguas, en su mayoría olvidadas, impulsadas en parte por su sangre retorcida y las tradiciones transmitidas a lo largo de muchos años. "
 dynn_rosselini_modifier:0 "Rosselini"
 dynn_rosselini_modifier_desc:0 "Los desquiciados Rosselini son una familia de Nigromantes que se cruzó con los Giovannis demasiadas veces. Ahora sirven a su antiguo enemigo, de buena gana o no".
 dynn_rawan_modifier:0 "Rawan"
 dynn_rawan_modifier_desc:0 "Los pescadores que sirven a la excéntrica Anushin-Rawan son criados con un propósito: ser totalmente fieles a su Señora."
 dynn_kairouan_modifier:0 "Hermandad de Kairouan"
 dynn_kairouan_modifier_desc:0 "Una familia creada a través de los experimentos de los Hechiceros Assamitas con los Revenants de Tzimisce; la Hermandad Kairouan está dividida en el mundo, con las tres Castas luchando sobre cómo hacer el mejor uso de los pocos que quedan."
 dynn_dimitriou_modifier:0 "Dimitriou"
 dynn_dimitriou_modifier_desc:0 "Prias ha matado antes a hombres, monstruos y dioses para proteger a su Dama. Lo hará de nuevo en un instante".
 dynn_nirriti_modifier:0 "Nirriti"
 dynn_nirriti_modifier_desc:0 "Los defensores del reino de la Muerte son un grupo incondicional, y un enemigo temible para cualquier hereje que se cruce en su camino."
 dynn_crassus_modifier:0 "Craso"
 dynn_crassus_modifier_desc:0 "Un experimento desquiciado nacido de la época romana, la familia Crassus está maldita con los peores excesos de la época imperial."
 dynn_gravenor_modifier:0 "Gravenor"
 dynn_gravenor_modifier_desc:0 "Los paranoicos Gravenor están bien ocultos a la vista, sirviendo a sus amos Nosferatu mientras les quede cordura."
 dynn_angustri_modifier:0 "Angustri"
 dynn_angustri_modifier_desc:0 "Los raros Augustri son famosos por su astucia y hacen buen uso de sus habilidades para sus patrones de Ravnos."
 dynn_kurulas_modifier:0 "Kurulas"
 dynn_kurulas_modifier_desc:0 "La tribu de la consorte de Gengis Khan es apreciada entre la Horda de Anda. Se conservan cuidadosamente como un prestigioso vínculo con su glorioso pasado".
 dynn_qarnaim_modifier:0 "Qarnaim"
 dynn_qarnaim_modifier_desc:0 "Cartago fue la cúspide de la relación entre humanos y cainitas. Los Qarnaim luchan por volver a hacer realidad su historia de origen".
 dynn_bomkazi_modifier:0 "Bomkazi"
 dynn_bomkazi_modifier_desc:0 "Fieles a sus compañeros Impundulu, las brujas Bomkazi desconfían de la lenta dilución de su sangre."
 dynn_societyofstgeorge_modifier:0 "Sociedad de San Jorge"
 dynn_societyofstgeorge_modifier_desc:0 "Nadie puede lanzar una devastadora carga frontal a través de un campo abierto como los Caballeros de San Jorge, pero su preferencia por esta táctica roza la estúpida arrogancia."
 house_faust_modifier:0 "Fausto"
 houst_faust_modifier_desc:0 "Zethraeus llevó a cabo varios experimentos amorales y trata con poderes infernales en su búsqueda de mayores conocimientos."
 dynn_custom_bloodline_war_modifier:0 "Línea de sangre de los guerreros"
 dynn_custom_bloodline_war_modifier_desc:0 "Esta línea de sangre vive con la conquista; la mayoría de la parentela los ve como belicistas."
 dynn_custom_bloodline_prowess_modifier:0 "Línea de sangre de asesinos"
 dynn_custom_bloodline_prowess_modifier_desc:0 "Esta línea de sangre está formada por asesinos mortales. No les da popularidad entre la parentela, pero casi todos les temen".
 dynn_custom_bloodline_intrigue_modifier:0 "Línea de sangre de los conspiradores"
 dynn_custom_bloodline_intrigue_modifier_desc:0 "Los miembros de esta línea de sangre son algunos de los conspiradores más letales del mundo cainita."
 dynn_custom_bloodline_diplomacy_modifier:0 "Línea de sangre de los diplomáticos"
 dynn_custom_bloodline_diplomacy_modifier_desc:0 "Los miembros de esta línea de sangre están convencidos de que se pueden conseguir grandes cosas siendo educados... cuando pueden beneficiarse de ello".
 dynn_custom_bloodline_learning_modifier:0 "Línea de sangre de los buscadores"
 dynn_custom_bloodline_learning_modifier_desc:0 "Los miembros de esta línea de sangre buscan respuestas. Piensan que el conocimiento es mucho más importante que los planes políticos y las guerras."
 dynn_custom_bloodline_stewardship_modifier:0 "Línea de sangre de los gobernantes"
 dynn_custom_bloodline_stewardship_modifier_desc:0 "Los miembros de esta línea de sangre buscan ser señores de los demás. No por su orgullo, sino porque saben gobernar".
 dynn_custom_bloodline_secret_modifier:0 "Sangre pura"
 dynn_custom_bloodline_secret_modifier_desc:0 "Los miembros de esta línea de sangre se creen verdaderos descendientes de Caine. A sus ojos, cualquier otro cainita es una mera sanguijuela sin derecho a la sangre de Caine".
 
                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                           
                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                           
                                                                                                                                                                                                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                                                                                                             
                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                     
                                                                                                                                                                            
                                                                                                                                                                        
                                                                                                                                   
                                                                                                                   
                                                                                                                 
                                                                                                                     
                                                                                           
                                                                                      
                                                                   
                                                     
                                                       
                                                      
                                            
                                            
                                        
                               
                           
                            
                               
                           
                        
                     
                   
