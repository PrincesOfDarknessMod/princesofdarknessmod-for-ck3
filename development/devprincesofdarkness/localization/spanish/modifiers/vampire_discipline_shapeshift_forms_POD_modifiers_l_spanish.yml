 modificador_característica_demoníaca_antenas:0 "Antenas"
 demonic_feature_antennae_modifier_desc:0 "Al usuario le crecen un par de antenas parecidas a las de los insectos que le ayudan a percibir su entorno."
 demonic_feature_claws_modifier:0 "Garras"
 demonic_feature_claws_modifier_desc:0 "Al personaje le crecen unas garras demoníacas."
 demonic_feature_demon_armor_modifier:0 "Armadura demoníaca"
 demonic_feature_demon_armor_modifier_desc:0 "La armadura demoníaca puede aparecer como escamas, una armadura de samurái ornamentada o cualquier otra cosa, y ofrece una mayor protección contra los ataques."
 demonic_feature_demon_weapon_modifier:0 "Arma demoníaca"
 demonic_feature_demon_weapon_modifier_desc:0 "Un arma mística aparece en la mano del personaje. Dicha arma puede arder con Chi, emitir gemidos espantosos, estar cubierta de rostros lascivos, etc."
 demonic_feature_enlarged_body_parts_modifier:0 "Partes del cuerpo agrandadas"
 demonic_feature_enlarged_body_parts_modifier_desc:0 "Una de las partes del cuerpo del personaje se hincha hasta ser mucho más grande de lo normal, a menudo cubierta de llagas o atravesada por venas de aspecto feo."
 demonic_feature_eyes_of_horror_modifier:0 "Ojos de horror"
 demonic_feature_eyes_of_horror_modifier_desc:0 "Los ojos demoníacos del personaje encierran una sugerencia de terror y locura para cualquiera que los mire."
 demonic_feature_extra_arms_modifier:0 "Brazos adicionales"
 demonic_feature_extra_arms_modifier_desc:0 "Dos brazos extra brotan del torso del personaje, lo que permite una mayor habilidad en el agarre o simplemente habilitar más ataques de lo habitual."
 demonic_feature_form_of_the_yamamatsu_modifier:0 "Forma del Yamamatsu"
 demonic_feature_form_of_the_yamamatsu_modifier_desc:0 "El cuerpo demoníaco de los Kuei-jin se vuelve gomoso y flácido, casi fluido en algunas partes, lo que les da un aspecto horriblemente distorsionado."
 demonic_feature_foulness_modifier:0 "Suciedad"
 demonic_feature_foulness_modifier_desc:0 "La forma demoníaca del personaje es extremadamente sucia: quizás incrustada en sangre seca y trozos de carne, quizás rodeada en una nube mefítica, etc."
 demonic_feature_hive_body_modifier:0 "Cuerpo de colmena"
 demonic_feature_hive_body_modifier_desc:0 "Pequeños agujeros y madrigueras en la piel del cuerpo demoníaco liberan pequeños y horribles animales. Serpientes, arañas, abejas y murciélagos son manifestaciones comunes de este extraño poder."
 demonic_feature_horns_modifier:0 "Cuernos"
 demonic_feature_horns_modifier_desc:0 "Al personaje le salen cuernos de la cabeza. Pueden ser cortos o largos, lisos o dentados, rectos o torcidos, con varias puntas o con una sola, según desee el personaje."
 demonic_feature_horror_modifier:0 "Horror"
 demonic_feature_horror_modifier_desc:0 "El shintai puede afligir a los humanos con efectos similares al Delirio."
 demonic_feature_huge_size_modifier:0 "Tamaño enorme"
 demonic_feature_huge_size_modifier_desc:0 "La salud del personaje aumenta cuando el Kuei-Jin crece repentinamente hasta alcanzar una altura de entre nueve y doce pies."
 demonic_feature_mandibles_modifier:0 "Mandíbulas"
 demonic_feature_mandibles_modifier_desc:0 "La boca del personaje se distiende y le salen terribles dientes, colmillos o tal vez mandíbulas parecidas a las de los insectos."
 demonic_feature_multiple_heads_modifier:0 "Múltiples cabezas"
 demonic_feature_multiple_heads_modifier_desc:0 "Al personaje le crecen una o más cabezas extra, siendo el límite superior siete cabezas extra, y cada cabeza ayuda a los Kuei-Jin a percibir su entorno."
 demonic_feature_poisoned_fangs_modifier:0 "Colmillos envenenados"
 demonic_feature_poisoned_fangs_modifier_desc:0 "Los colmillos de la boca del personaje se vuelven especialmente grandes, afilados y cáusticos."
 demonic_feature_spikes_modifier:0 "Púas"
 demonic_feature_spikes_modifier_desc:0 "El cuerpo del personaje está cubierto de uno de los siguientes elementos: pinchos, piel abrasiva como la de un tiburón, vello corporal tan rígido y afilado como el alambre de una navaja, clavos, piel ardiente o helada, cuchillas, púas o cristales rotos."
 demonic_feature_spurting_tendrils_modifier:0 "Zarcillos chorreantes"
 demonic_feature_spurting_tendrils_modifier_desc:0 "Diminutos zarcillos, dedos o esfínteres emergen de la piel del Kuei-Jin."
 demonic_feature_suckers_modifier:0 "Chupadores"
 demonic_feature_suckers_modifier_desc:0 "Los brazos u otras extremidades del personaje están cubiertos de ventosas similares a pequeñas bocas de lamprea."
 demonic_feature_suppurating_pustules_modifier:0 "Pústulas supurantes"
 demonic_feature_suppurating_pustules_modifier_desc:0 "El cuerpo demoníaco del personaje está cubierto de llagas y heridas supurantes."
 demonic_feature_tentacles_modifier:0 "Tentáculos"
 demonic_feature_tentacles_modifier_desc:0 "Al personaje le crecen repugnantes tentáculos cubiertos de limo."
 demonic_feature_tail_modifier:0 "Cola"
 demonic_feature_tail_modifier_desc:0 "Al personaje le crece una cola".
 demonic_feature_the_host_modifier:0 "El anfitrión"
 demonic_feature_the_host_modifier_desc:0 "De la espalda, el torso y las extremidades del personaje brotan caras demoníacas con colmillos."
 demonic_feature_third_eye_modifier:0 "Tercer ojo"
 demonic_feature_third_eye_modifier_desc:0 "Al personaje le brota un tercer ojo en medio de la frente."
 demonic_feature_wings_modifier:0 "Alas"
 demonic_feature_wings_modifier_desc:0 "Los piñones en forma de murciélago surgen y se extienden desde la espalda del personaje."
 demonic_feature_wing_spines_modifier:0 "Espinas de las alas"
 demonic_feature_wing_spines_modifier_desc:0 "De las alas del personaje brotan espinas en forma de dedos."
