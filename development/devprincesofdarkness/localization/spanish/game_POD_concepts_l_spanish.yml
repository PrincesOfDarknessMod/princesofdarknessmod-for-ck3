l_spanish: 
 game_concept_princes_of_darkness:0 "Príncipes de la oscuridad"
 game_concept_princesofdarkness:0 "$princes_of_darkness$"
 game_concept_princes_of_darkness_desc:0 "Un mod para Crusader Kings 3 centrado en las criaturas sobrenaturales del 'Mundo de las Tinieblas' de White Wolf. ¡Lo estás jugando ahora mismo! Un [príncipe|E] es el título principal aterrizado para un [GetTrait('vampire').GetName( GetNullCharacter )] que gobierna un dominio, equivalente a un [ducado|E] de CK3. ¿Qué es la oscuridad? Mira dentro de ti".
 game_concept_POD:0 "$princes_of_darkness$" 
 
 game_concept_prince:0 "Príncipe"
 game_concept_the_prince:0 "$game_concept_prince$" 
 game_concept_the_princes:0 "$game_concept_prince$" 
 game_concept_princes:0 "$game_concept_prince$" 
 game_concept_prince_desc:0 "Un $príncipe$ es el título principal de un [GetTrait('vampire').GetName( GetNullCharacter )] que gobierna un dominio, equivalente a un [ducado|E] CK3."
 
 game_concept_bloodpotency:0 "Potencia de la sangre"
 game_concept_bloodpotency_desc:0 "$game_concept_bloodpotency$ es el poder inherente a la sangre de un [GetTrait('vampire').GetName( GetNullCharacter )] que crece lentamente con el tiempo y está limitado por la [vampgeneración|E] del [GetTrait('vampire').GetName( GetNullCharacter )].  La $game_concept_bloodpotency$ disminuye lentamente en el torpor. Puede aumentar más rápidamente diaberlizando a los vampires con mayor potencia de sangre.  $game_concept_bloodpotency$ influye en la rapidez con la que el uso de [disciplina|E] aumenta el hambre y en el impacto de tus poderes [GetTrait('vampire').GetName( GetNullCharacter )] como [disciplinas|E]."
 game_concept_blood_potency:0 "$game_concept_bloodpotency$" 
 
 game_concept_vampgeneration:0 "Generación"
 game_concept_generation:0 "$game_concept_vampgeneration$"
 game_concept_vampgeneration_desc:0 "Según los cainitas, son las distancias de la sangre de un [GetTrait('vampire').GetName( GetNullCharacter )] del padre de todos los [GetTrait('vampire').GetName( GetNullCharacter )]s--Caine.  Caine es de la [GetTrait('vampgeneration1').GetName( GetNullCharacter )].  Los vampires de la [GetTrait('vampgeneration14').GetName( GetNullCharacter )] o superior son "de sangre fina" y son casi humanos y apenas vampires. Los vampires que no creen que Caine sea el progenitor suelen remontar su [vampgeneration|E] a algún otro fundador mítico. Los vampires pueden disminuir su [vampgeneration|E], y por tanto aumentar su poder potencial, cometiendo diablerie sobre un vampire de menor [vampgeneration|E] que el suyo."
 
 game_concept_bloodbond:0 "Vínculo de sangre"
 game_concept_bloodbond_desc:0 "Beber la sangre de [GetTrait('vampire').GetName( GetNullCharacter )] suele crear sentimientos de intensa lealtad y obediencia hacia el [GetTrait('vampire').GetName( GetNullCharacter )]. También llamado "Juramento de Sangre", esto actúa como un gancho de intensidad creciente, cuanto más sangre se consuma. Algunos vampires son incapaces de crear vínculos con su sangre. Otros vampires son totalmente incapaces de crear vínculos".  
 game_concept_blood_oath:0 "$game_concept_bloodbond"
 game_concept_bloodoath:0 "$game_concept_bloodbond"
 
 game_concept_blood_bond:0 "$game_concept_bloodbond"
 
 game_concept_beast:0 "La bestia" 
 game_concept_the_beast:0 "$game_concept_beast$"
 game_concept_thebeast:0 "$game_concept_beast$" 
 game_concept_beast_desc:0 "[beast|E] es un término utilizado por [GetTrait('vampire').GetName( GetNullCharacter )]s para describir al depredador interior que lucha por controlar la mente de un cainita. es un depredador demoníaco innato que se despierta dentro de todos y cada uno de los [GetTrait('vampire').GetName( GetNullCharacter )] tras su Abrazo. Se opone directamente a la Humanidad del vampire (y en algunos casos a los Caminos de la Iluminación) y es responsable de muchos de los impulsos degradantes que los Cainitas sienten cada noche. En momentos de extrema angustia, la Bestia puede abrumar a un [GetTrait('vampire').GetName( GetNullCharacter )] forzándolo a un estado de lucha o huida puramente animal, lo que se conoce como Frenesí o Rotschreck. Si un [GetTrait('vampire').GetName( GetNullCharacter )] tiene un valor negativo en [piedad|E], corre el riesgo de caer en un frenesí permanente y convertirse en un [GetTrait('wight').GetName( GetNullCharacter )]. Esto es una abdicación de facto a su [heredero|E]".
 
 game_concept_the_masquerade:0 "$game_concept_masquerade$"
 game_concept_masquerade:0 "The Masquerade"
 game_concept_masquerade_desc:0 "[masquerade|E] is a term used by [GetTrait('vampire').GetName( GetNullCharacter )]s to describe keeping their existence secret from [GetTrait('mortal').GetName( GetNullCharacter )]s.  Violating the [masquerade|E] can lead to complications such as being attacked by [GetTrait('supehunter').GetName( GetNullCharacter )]s. In some domains, it can be regarded as a [crime|E] among [GetTrait('vampire').GetName( GetNullCharacter )]s."   
 
 game_concept_humor:0 "$game_concept_resonance$"
 game_concept_humors:0 "$game_concept_resonance$"
 game_concept_humour:0 "$game_concept_resonance$"
 game_concept_humours:0 "$game_concept_resonance$"
 game_concept_humorism:0 "$game_concept_resonance$"
 game_concept_humourism:0 "$game_concept_resonance$"
 
 game_concept_resonance:0 "Resonance"
 game_concept_resonances:0 "$game_concept_resonance$"
 
 game_concept_resonance_desc:0 "La sangre tiene una cierta calidad basada en la personalidad y las emociones de su recipiente. El consumo de sangre otorga [GetTrait('vampire').GetName( GetNullCharacter )]s poder basado en el carácter de la $resonancia$. Ganas más experiencia [disciplina|E] al beber sangre de una resonancia en particular o al usar una [disciplina|E] en particular. Las resonancias son: \n$BULLET_WITH_TAB$[estilo de vida colérico|E]\n$BULLET_WITH_TAB$[estilo de vida melancólico|E]\n$BULLET_WITH_TAB$[estilo de vida flemático|E]\n$BULLET_WITH_TAB$[estilo de vida sanguíneo|E]\n$BULLET_WITH_TAB$[estilo de vida animal|E]"
 
 game_concept_torpor:0 "Torpor"
 game_concept_torpor_desc:0 "$game_concept_torpor$ es un estado de animación suspendida para un [GetTrait('vampire').GetName( GetNullCharacter )]. Aunque no pueden moverse, pueden ser conscientes de los eventos que ocurren a su alrededor.  Puede ser causado por una estaca en el corazón, suficiente daño corporal, gran hambre o ennuin".
 game_concept_torpid:0 "$game_concept_torpid$"
 
 game_concept_hunger:0 "Hambre"
 game_concept_hunger_desc:0 "$game_concept_hunger$ es el deseo de un [GetTrait('vampire').GetName( GetNullCharacter )] de consumir sangre. Es causado por [beast|E]. Cuanto más alto sea el $game_concept_bloodpotency$ de un [GetTrait('vampire').GetName( GetNullCharacter )], más sangre necesitará para reducir su $game_concept_hunger$. El aumento de $game_concept_hunger$ tiene un impacto positivo pero en gran medida negativo para un [GetTrait('vampire').GetName( GetNullCharacter )].  La única forma de saciar completamente el $game_concept_hunger$ de un [GetTrait('vampire').GetName( GetNullCharacter )] es matando y drenando toda la sangre de una víctima.  Incluso esa saciedad de $game_concept_hunger$ es temporal".
 game_concept_the_hunger:0 "$game_concept_hunger$"
 game_concept_blood_hunger:0 "$game_concept_hunger$"
 game_concept_the_thirst:0 "$game_concept_hunger$"
 game_concept_thirst:0 "$game_concept_hunger$"
 game_concept_blood_thirst:0 "$game_concept_hunger$"
 
 game_concept_discipline:0 "Disciplina" 
 game_concept_disciplines:0 "$game_concept_discipline$"
 game_concept_discipline_desc:0 "$game_concept_discipline$s son los poderes de [GetTrait('vampire').GetName( GetNullCharacter )]s mediante la canalización de la $game_concept_resonancia$ de la sangre. Para aumentar el poder de un $game_concept_disciplines$, gasta experiencia para desbloquear $game_concept_disciplines$ [perks|E]." 

 game_concept_choleric_lifestyle:0 "Resonancia colérica"
 game_concept_yellow_bile:0 "$game_concept_choleric_lifestyle$"
 game_concept_yellowbile:0 "$game_concept_choleric_lifestyle$"
 game_concept_choleric_lifestyle_desc:0 "El $game_concept_choleric_lifestyle$ es adecuado para [GetTrait('vampire').GetName( GetNullCharacter )]s que quieran mejorar [disciplina|E]s que impliquen alimentarse de sangre con emociones como la ira y la envidia. Busca presas con [rasgos|E] de personalidad como [GetTrait('iracundo').GetName( GetNullCharacter )] y [GetTrait('sádico').GetName( GetNullCharacter )]. Los $game_concept_choleric_lifestyle$ [disciplina|E]s son:|n$BULLET_WITH_TAB$ [GetTrait('celeridad'). GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('potencia').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('vicisitud').GetName( GetNullCharacter )]"

 game_concept_sanguine_lifestyle:0 "Resonancia Sanguina"
 game_concept_sanguine:0 "$game_concept_sanguine_lifestyle$"
 game_concept_sanguine_lifestyle_desc:0 "El $game_concept_sanguine_lifestyle$ es adecuado para [GetTrait('vampire').GetName( GetNullCharacter )]s que quieren mejorar [disciplina|E]s que implican alimentarse de sangre con emociones como la felicidad y el entusiasmo. Busca presas con [rasgos|E] de personalidad como [GetTrait('gregario').GetName( GetNullCharacter )] y [GetTrait('lujurioso').GetName( GetNullCharacter )]. Los $game_concept_sanguine_lifestyle$ [disciplina|E]s son:\n$BULLET_WITH_TAB$[GetTrait('bloodsorcery').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('presence'). GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('thinbloodalchemy').GetName( GetNullCharacter )]"

 game_concept_faith_lifestyle:0 "Fe verdadera"
 game_concept_faith:0 "$game_concept_faith_lifestyle$"
 game_concept_faith_lifestyle_desc:0 "Una rara bendición para los personajes muy celosos, el rasgo Fe Verdadera abre el estilo de vida del mismo nombre, donde se pueden adquirir varios poderes con la correspondiente XP de estilo de vida"

 game_concept_phlegmatic_lifestyle:0 "Resonancia flemática"
 game_concept_phlegm:0 "$game_concept_phlegmatic_lifestyle$"
 game_concept_phlegmatic:0 "$game_concept_phlegmatic_lifestyle$"
 game_concept_phlegmatic_lifestyle_desc:0 "La resonancia flemática es adecuada para [GetTrait('vampire').GetName( GetNullCharacter )]s que quieran mejorar [disciplina|E]s que impliquen alimentarse de sangre con emociones como el sentimentalismo y el control. Busca presas con [rasgos|E] de personalidad como [GetTrait('perezoso').GetName( GetNullCharacter )] y [GetTrait('contenido').GetName( GetNullCharacter )]. Los $game_concept_phlegmatic_lifestyle$ [disciplina|E]s son:\Nn$BULLET_WITH_TAB$ [GetTrait('auspex'). GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('dominar').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('oblivion').GetName( GetNullCharacter )]"

 game_concept_melancholy_lifestyle:0 "Resonancia melancólica"
 game_concept_black_bile:0 "$game_concept_melancholy_lifestyle$"
 game_concept_blackbile:0 "$game_concept_melancholy_lifestyle$"
 game_concept_melancholic:0 "$game_concept_melancholy_lifestyle$"
 game_concept_melancholy_lifestyle_desc:0 "El $game_concept_melancholy_lifestyle$ es adecuado para [GetTrait('vampire').GetName( GetNullCharacter )]s que quieren mejorar [disciplina|E]s que implican alimentarse de sangre con emociones como la tristeza y la intelectualización. Busca presas con [rasgos|E] de personalidad como [GetTrait('shy').GetName( GetNullCharacter )] y [GetTrait('craven').GetName( GetNullCharacter )]. Los $game_concept_melancholy_lifestyle$ [disciplina|E]s son:|n$BULLET_WITH_TAB$ [GetTrait('fortitude').GetName( GetNullCharacter )]|n$BULLET_WITH_TAB$ [GetTrait('obfuscate').GetName( GetNullCharacter )]"

 game_concept_animal_lifestyle:0 "Resonancia animal"
 game_concept_animal_lifestyle_desc:0 "El $game_concept_animal_lifestyle$ es adecuado para [GetTrait('vampire').GetName( GetNullCharacter )]s que quieran mejorar [disciplina|E]s que impliquen alimentarse de animales. Busca animales como presa. Los $game_concept_animal_lifestyle$ [disciplina|E]s son:|n$BULLET_WITH_TAB$ [GetTrait('animalismo').GetName( GetNullCharacter )]|n$BULLET_WITH_TAB$ [GetTrait('proteico').GetName( GetNullCharacter )]"
 
 game_concept_diablerie_schemes:0 "Diablerizar esquemas"
 game_concept_diablerize_scheme:0 "$diablerize$"
 game_concept_diablerize:0 "Diablerizar"
 game_concept_diablerize_scheme_desc:0 "El $game_concept_diablerize$ es un [hostile_scheme|E] para matar a un [GetTrait('vampire').GetName( GetNullCharacter )] objetivo y devorar toda su sangre y alma.  Es un [esquema_secreto|E] basado en la [intriga|E], que puede reclutar [agentes|E].\NUna $diablerie$ exitosa resultará en la [muerte_del_personaje|E] del [objetivo del esquema|E]. \Un asesinato que permanezca en secreto con éxito dará al [propietario del plan|E] una Diablerie [secreta|E].Ser descubierto intentando diablerizar, o diablerizar con éxito a un [GetTrait('vampire').GetName( GetNullCharacter )] es un grave [crimen|E] para la mayoría de los credos [GetTrait('vampire').GetName( GetNullCharacter )]. También llamado 'Amaranto' por la primera víctima de la diablerie, es el proceso de [GetTrait('vampire').GetName( GetNullCharacter )] drenar a otro [GetTrait('vampire').GetName( GetNullCharacter )] de toda su sangre, incluyendo su alma. Permite al diablerista ganar [bloodpotency|E] e incluso una menor [vampgeneration|E] de su víctima. A menudo tiene un precio al potenciar la [bestia|E] de un [GetTrait('vampire').GetName( GetNullCharacter )]. Esto se representa con la pérdida de niveles de [piedad|E]. La mayoría de [GetTrait('vampire').GetName( GetNullCharacter )] s tienen una mala opinión de [GetTrait('diablerista').GetName( GetNullCharacter )]s"
 
 game_concept_amaranth:0 "game_concept_diablerize"
 
 game_concept_summon_scheme:0 "Esquema de invocación"
 game_concept_summon_schemes:0 "Esquemas de invocación"
 game_concept_summon:0 "Invocar"
 game_concept_summon_scheme_desc:0 "El $game_concept_summon_scheme$ es un [personal_scheme|E] que tiene como objetivo atraer a otros personajes a tu corte. Este esquema se basa principalmente en su [diplomacia|E], no es [secret_scheme_single|E] y no utiliza [agentes|E]. Está disponible por un $perk$ de la $disciplina$ de $presencia$".
 
 game_concept_entrance_scheme:0 "Esquema de entrada"
 game_concept_entrance_schemes:0 "Esquemas de entrada"
 game_concept_entrance:0 "Entrada"
 game_concept_entrance_scheme_desc:0 "El $game_concept_entrance_scheme$ es un [personal_scheme|E] que tiene como objetivo atraer a otros personajes a tu corte. Este esquema se basa principalmente en tu [diplomacia|E], no es [secret_scheme_single|E] y no utiliza [agentes|E]. Si tiene éxito, el personaje se trasladará a tu capitolio. Está disponible por una [perks|E] de la [disciplina|E] de [GetTrait('presencia').GetName( GetNullCharacter )]. El poder no funcionará con personajes [aterrizados|E]".
 
 game_concept_mesmerize_scheme:0 "$mesmerize$"
 game_concept_mesmerize_schemes:0 "Esquemas de mesmerización"
 game_concept_mesmerize:0 "Memsmerize"
 game_concept_mesmerize_scheme_desc:0 "El $game_concept_mesmerize_scheme$ es un [personal_scheme|E] que pretende atraer a otros personajes a tu corte. Este esquema se basa principalmente en tu [administración|E], no es [secret_scheme_single|E] y no utiliza [agentes|E]. Si tiene éxito, el personaje se trasladará a tu capitolio. Está disponible por una [perks|E] de la [disciplina|E] de [GetTrait('presencia').GetName( GetNullCharacter )]. El poder no funcionará con personajes [aterrizados|E]".
 
 game_concept_investigate_scheme:0 "$investigate$"
 game_concept_investigate_schemes:0 "Investigar esquemas"
 game_concept_investigate:0 "Investigar"
 game_concept_investigate_scheme_desc:0 "El $game_concept_investigate_scheme$ es un [personal_scheme|E] que te permite recoger lore otro personaje. Este esquema se basa principalmente en su [aprendizaje|E], no es [secret_scheme_single|E] y puede utilizar [agentes|E]. Al tener éxito, el personaje aprenderá información narrativa sobre el personaje, obtendrá un ligero buff en las interacciones y potencialmente aprenderá un seceret como [vampgeneration|E]. Pruébalo con personajes canon".
 
 game_concept_hunt_mortal_scheme:0 "$game_concept_vamphunt$"
 game_concept_hunt_mortal:0 "$game_concept_vamphunt$" 
 
 game_concept_vamphunt_scheme:0 "$game_concept_vamphunt$" 
 game_concept_vamphunt_schemes:0 "Esquemas de caza"
 game_concept_vamphunt:0 "Caza"
 game_concept_vamphunt_scheme_desc:0 "El $game_concept_vamphunt_scheme$ es un [personal_scheme|E] que tiene un [GetTrait('vampire').GetName( GetNullCharacter )] para cazar un [GetTrait('mortal').GetName( GetNullCharacter )] personaje para su sangre. Este esquema se basa principalmente en su [intriga|E], es [secret_scheme_single|E] y no utiliza [agents|E]. Si tiene éxito, el [GetTrait('vampire').GetName( GetNullCharacter )] beberá la sangre del [GetTrait('mortal').GetName( GetNullCharacter )]. Si este esquema es expuesto, el personaje viola [masquerade|E] lo que lleva a potenciales compilaciones como ataques de [GetTrait('supehunter').GetName( GetNullCharacter )]s. El poder no funcionará en personajes [aterrizados|E]. Las víctimas potenciales deben estar en su ubicación".
 
 game_concept_embrace_scheme:0 "Esquema de abrazo"
 game_concept_embrace_schemes:0 "Esquemas de abrazo"
 game_concept_embrace:0 "Abrazo"
 game_concept_embrace_scheme_desc:0 "El $game_concept_embrace_scheme$ es un [personal_scheme|E] que pretende atraer a otros personajes a tu corte. Este esquema se basa principalmente en su [intriga|E], no es [secret_scheme_single|E] y no utiliza [agentes|E]. Si tiene éxito, el personaje se trasladará a tu capitolio. Está disponible por una [perks|E] de la $disciplina$ de $presencia$. El poder no funcionará con personajes [aterrizados|E]".
 
 game_concept_ghoulify_scheme:0 "$ghoulify$"
 game_concept_ghoulify_schemes:0 "Esquemas de Ghoul"
 game_concept_ghoulify:0 "Ghoul"
 game_concept_ghoulify_scheme_desc:0 "El $game_concept_ghoulify$ es un [personal_scheme|E] que pretende atraer a otros personajes a tu corte. Este esquema se basa principalmente en tu [administración|E], no es [secret_scheme_single|E] y no utiliza [agentes|E]. Si tiene éxito, el personaje se trasladará a tu capitolio. Está disponible por una [perks|E] de la $disciplina$ de $presencia$. El poder no funcionará con personajes [aterrizados|E]".
 
 game_concept_herdify_scheme:0 "$herdify$"
 game_concept_herdify_schemes:0 "Esquemas de la manada"
 game_concept_herdify:0 "Manada"
 game_concept_herdify_scheme_desc:0 "El $game_concept_entrance_scheme$ es un [personal_scheme|E] que tiene como objetivo atraer a otros personajes a tu corte. Este esquema se basa principalmente en tu [diplomacia|E], no es [secret_scheme_single|E] y no utiliza [agentes|E]. Si tiene éxito, el personaje se trasladará a tu capitolio. Está disponible por una [perks|E] de la $disciplina$ de $presencia$. El poder no funcionará con personajes [aterrizados|E]".
 
 game_concept_diablerize_schemes:0 "Diablerizar esquemas"
 game_concept_diablerize_schemes_desc:0 "Diablerizar esquemas"

 game_concept_discipline_power:0 "Disciplinar el poder"
 game_concept_discipline_power_desc:0 "Los Poderes de Disciplina son la aplicación de [disciplina|E]s, permitiendo a los vampires realizar hazañas sobrenaturales o concediéndoles extrañas habilidades."

 game_concept_bind_famulus:0 "Atar Famulus"
 game_concept_bind_famulus_desc:0 "Bind Famulus es una [character_interaction|E] que te permite hacer un fámulo cuando enlazas con sangre a un animal, formando un vínculo mental con él y facilitando el uso de otros poderes de Animalismo."

 game_concept_animal_succelence:0 "Suculencia animal"
 game_concept_animal_succelence_desc: "El vampire puede saciar su [hambre|E] adicional alimentándose de animales. Además, el vampire puede consumir su fámulo, ganando alimento mucho más allá de lo que se obtendría de un animal de estatura similar y absorbiendo una porción de su rasgo primario."

 game_concept_animal_dominion:0 "Dominio animal"
 game_concept_animal_dominion_desc:0 "El Dominio Animal es una [character_interaction|E] que simboliza que el poder que el vampire tiene sobre las bestias es ahora lo suficientemente grande como para comandar rebaños y manadas como si fueran extensiones de su propio cuerpo. Con un gesto, los animales dan su vida por docenas, incluso cientos, para apaciguar a su amo".

 game_concept_blood_draught:0 "Calada"
 game_concept_blood_draught_desc:0 "La Sangre del vampire se satura con el poder de su Disciplina, transmitiendo una parte de ese poder a cualquiera que beba de ella. El Draught se administra mediante una [character_interaction|E]."

 game_concept_shapeshift:0 "Cambio de forma"
 game_concept_shapeshift_desc:0 "Una [character_interaction|E] que permite al usuario transformar su forma de alguna manera, normalmente nacida de Protean o Vicissitude."

 game_concept_feral_weapons:0 "Armas ferales"
 game_concept_feral_weapons_desc:0 "El vampire puede extender sus armas naturales hasta alcanzar proporciones monstruosas, lo que normalmente adopta la forma de uñas que se extienden hasta convertirse en malvadas garras, pero también puede adoptar otras formas, como colmillos que se alargan hasta convertirse en auténticas dagas, como las de una gigantesca serpiente. Una subhabilitación [shapeshift|E]".

 game_concept_shapechange:0 "Cambio de forma"
 game_concept_shapechange_desc:0 "El vampire puede asumir la forma de un animal más o menos del mismo tamaño que su masa original. Aunque suele ser un ejemplo espectacular de su especie, el animal no muestra a un observador mundano signos de ser sobrenatural. Una sub-habilidad [shapeshift|E]".

 game_concept_mist_form:0 "Forma de niebla"
 game_concept_mist_form_desc:0 "El vampire obtiene el legendario poder de convertirse en una nube de niebla, perceptible a la vista pero intocable por cualquier cosa excepto el fuego, la luz del sol y la agresión sobrenatural. Pueden pasar por tuberías, hendiduras y grietas. Aunque los fuertes vientos pueden azotarlas, ninguna fuerza natural puede dispersar la nube. Una subhabilitación [shapeshift|E]".

 game_concept_tenebrous_avatar:0 "Avatar tenebroso"
 game_concept_tenebrous_avatar_desc:0 "El dominio de la oscuridad por parte del vampire es tan amplio que puede convertirse físicamente en ella. Al activar este poder, el vampire se convierte en una mancha de sombra ameboide y tintada. Los vampires en esta forma son prácticamente invulnerables y pueden deslizarse por grietas y hendiduras. Además, el vampire de sombra gana la capacidad de ver en la oscuridad natural. Una subhabilitación [shapeshift|E]".

 game_concept_rationalize_scheme:0 "Racionalizar esquema"
 game_concept_rationalize_scheme_desc:0 "El Rationalize Scheme es un [personal_scheme|E] que tiene como objetivo forzar un gancho de otro personaje."

 game_concept_incorporeal_form:0 "Forma incorpórea"
 game_concept_incorporeal_form_desc:0 "El vampire asume un estado incorpóreo, no muy diferente al de un fantasma, capaz de pasar libremente a través de los objetos y que se vuelve inmune al daño físico. No pueden interactuar físicamente con el mundo material, excepto por la vista y el habla. Una sub-habilidad [shapeshift|E]".
 
 game_concept_bloodsorcery:0 "Hechicería de sangre"
 game_concept_blood_sorcery:0 "$game_concept_bloodsorcery$"
 game_concept_blood_magic:0 "$game_concept_bloodsorcery$"
 game_concept_thaumaturgy:0 "Thaumaturgy"
 game_concept_durnaki:0 "Dur-Na-Ki"
 game_concept_bloodsorcery_desc:0 "La hechicería de sangre, también llamada Taumaturgia, Heku, Durnaki y Valeran, es el arte de usar la Vitae Vampírica para evocar poderosos efectos mágicos. Poseída por unos pocos clanes y guardada celosamente, la hechicería de sangre es una herramienta poderosa pero peligrosa y costosa. Cada facción tiene su propia forma de invocar el poder de la sangre: los Tremere utilizan la magia hermética y el simbolismo, los hechiceros de los Banu Haqim hacen pactos con el espíritu y los dioses. Al mismo tiempo, los Lasombras se sumergen en el abismo para realizar evocaciones arcanas. Se dice que la magia de sangre tiene el poder de hacer casi cualquier cosa - y aunque estas afirmaciones suelen provenir de practicantes que desean crear una imagen espantosa o de víctimas de maldiciones y bolas de fuego, es cierto que la hechicería de sangre da acceso a una miríada de hechizos y habilidades que uno puede considerar... Antinatural. \N - Cualquier persona con la disciplina de hechicería de sangre puede abrir el menú de hechicería de sangre a través de la interacción con el personaje. Dentro, los magos pueden comprar hechizos si tienen suficiente [bloodsorcery_exp|E] y lanzar hechizos y maldiciones".
 
 game_concept_bloodsorcery_exp:0 "Exp de hechicería de sangre"
 game_concept_bloodsorcery_exp_short:0 "Exp"
 game_concept_bloodsorcery_exp_desc:0 "Una medida de cuánto ha aprendido tu personaje en las artes de [bloodsorcery|E]. La XP de Blood Sorcery es necesaria para aprender nuevos poderes y avanzar en los caminos y se otorga de dos maneras: \n 1. Un personaje recibirá una asignación anual de exp basada en su aprendizaje \n 2.Cada vez que un hechicero lance con éxito un hechizo, obtendrá algo de XP."
 
 game_concept_necromancy:0 "Necromancia"
 game_concept_mortis:0 "Mortis"
 game_concept_necromancy_desc:0 "La nigromancia es una forma de [bloodsorcery|E] que trata con la muerte, el inframundo y los espectros, las almas de los muertos. \Utilizando los poderes del olvido y el abismo, los nigromantes pueden atar a los espectros a su voluntad y ordenarles que realicen una variedad de tareas - desde espionaje hasta [posesión|E]."
 
 
 
 game_concept_possession:0 "Posesión"
 game_concept_possess:0 "poseer"
 game_concept_possession_desc:0 "el proceso a través del cual un Espectro se apropia de un cuerpo. Que la posesión tenga éxito o no depende de un duelo entre el espectro y la víctima. La posesión se divide en tres etapas y puede ser utilizada varias veces contra la misma persona (si se utiliza el mismo espectro, por supuesto). Si un fantasma ligado a ti posee a una víctima, el objetivo quedará igualmente ligado a ti. Etapas de la posesión: \n 1. En la primera etapa, la víctima obtiene algunas de las proezas del espectro además de las suyas propias, y el nigromante y el espectro ganan influencia sobre la víctima. \n 2. La segunda etapa imparte algunas de las habilidades del Espectro a la víctima, dándole una parte de las estadísticas del fantasma. El nigromante gana más control sobre la víctima. Además, las personalidades del espectro y de la víctima comienzan a fusionarse. \n 3. En la tercera etapa, la posesión es completa, y la personalidad del espectro abruma al objetivo. La víctima queda cautivada por el espectro y adquiere más de sus habilidades a medida que el fantasma actúa a través de ella. El control del nigromante crece aún más".
 