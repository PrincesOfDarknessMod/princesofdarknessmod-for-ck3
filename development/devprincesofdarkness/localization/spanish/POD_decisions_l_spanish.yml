 revenant_victory_objective_decision_desc:0 "Libérate de la tiranía de tus amos Kindred, utiliza conocimientos arcanos y rituales impíos para aprovechar el preciado poder de su sangre".
 revenant_victory_objective_effect_tooltip:2 "Este asalto sin precedentes a los secretos de la vitae implica la recuperación de antiguos manuscritos, así como estudios propios. El procedimiento en sí requerirá ingredientes preciosos y raros, sobre todo aprovechar las líneas de sangre antediluvianas."
 revenant_victory_objective_decision_confirm:0 "¡Comienza el ritual!"
