 test_of_faith_decision:0 "Prueba de fe"
 test_of_faith_decision_tooltip:1 "Intentarás cambiar tu forma de vida pecaminosa".
 test_of_faith_decision_desc:0 "Ser un siervo de Dios significa ser devoto de Él. De hecho, no eres lo suficientemente devoto. Tu forma de vida pecaminosa puede convertirse en una barrera que no te permite cumplir con tu causa. Una Prueba de Fe podría ayudarte a deshacerte de tus pecados".
