 PODinquisition.9999.b:0 "Puedo presionar un poco más, ya recuperaré el control de mi corte más tarde"
 PODinquisition.9999.c:0 "¡Puedo hacer las dos cosas!"
 PODinquisition.9999.c.effect.success.desc:0 "Un gran éxito te permitirá progresar más de lo esperado"
 PODinquisition.9999.cb.effect.success.desc:0 "Has tenido éxito en tus estudios"
 PODinquisition.9999.cc.effect.success.desc:0 "Un completo fracaso, has perdido tanto tu tiempo como tu capital político"
 PODinquisition.9999.c.success:0 "¡Un completo éxito!"
