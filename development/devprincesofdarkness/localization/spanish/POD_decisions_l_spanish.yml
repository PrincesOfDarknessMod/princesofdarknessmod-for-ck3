 PODinquisition.9999.desc:0 "Has elegido pasar un tiempo alejado de tu corte para centrarte en la fe ardiente que brota del núcleo de tu alma. Una elección virtuosa, sin duda, pero la política vampírica no espera a nadie, y tienes que elegir cuánto tiempo exactamente deseas dejar a tus rivales conspirando a tus espaldas..."
