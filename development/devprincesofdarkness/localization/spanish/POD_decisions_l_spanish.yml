 inqui_torture_objective_decision_tooltip:0 "Hazles saber que nadie está fuera de mi alcance".
 inqui_torture_objective_decision_desc:0 "Se creen poderosos. Se creen seguros. Se creen mejores que yo. Eso se acabará".
 inqui_torture_objective_decision_effect_tooltip:1 "Tu reputación como terrible instrumento de la voluntad de Dios crece, para bien o para mal."
 inqui_torture_objective_decision_confirm:0 "¡No pueden detenerme!"
 inqui_torture_objective_decision_custom:0 "Capturar a una de las famosas y bellas vampiras para desfigurarlas: \n Helena de Cerdeña, Maatkare de Tlemcen, Alejandro de Mersenburg, Iontius Ray'een al-Fen de Tafilalt, Callsti y Castillo de Molina".
 inqui_tortura_objetivo_decision_customb:0 "Capturar a uno de los famosos campeones vampiros para mutilarlo: \n Qarakh Aajav de Livonia, Qawiya Samiel de Jerusalén, Marcus Verus Mithras de Lancaster, Lucita de Ruiz de León, Jurgen Hardestadt de Anhalt."
 inqui_tortura_objetivo_decision_customc:0 "Capturar a uno de los famosos vampiros brillantes para estudiarlo: \n Myka Vykos de Obertus Akoimetoi, Goratrix de Normandía, Japhet de Erciyes, Ambrogino Premascine de Dalmacia, Ismael al'Lama de Malagón".
