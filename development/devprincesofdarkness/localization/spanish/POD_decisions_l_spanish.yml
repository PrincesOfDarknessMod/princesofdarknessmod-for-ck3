 poltzimi_objective_decision:0 "Una nueva sede de poder"
 poltzimi_objective_decision_desc:0 "Durante demasiado tiempo tus compañeros de clan de los Cárpatos se han mofado de tu supuesto provincianismo. Aunque tu dominio es periférico al Voivodato y no tan antiguo como los feudos que lo componen, el Reino de Polonia y su capital, Cracovia, es más próspero y está más cerca de los asuntos del resto del mundo que cualquier parte de los Cárpatos. Demostrar su hegemonía aquí constituirá un innegable desplazamiento del centro de autoridad del clan en su dirección."
 poltzimi_objective_decision_tooltip:0 "Demuestra al clan dónde reside el verdadero poder".
 poltzimi_objective_decision_effect_tooltip:0 "Tu gobierno sobre Cracovia te marcará como digno de liderar a los voivodas".
