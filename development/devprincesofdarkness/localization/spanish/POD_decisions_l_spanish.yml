 ask_pope_decision:0 "Pedir fondos al Santo Padre"
 ask_pope_decision_desc:0 "Pedirás al Obispo de Roma oro para apoyar la causa"
 ask_pope_decision_confirm:0 "Escribir la carta"
 ask_pope_decision_tooltip:0 "¡El Papa seguramente escuchará mi petición!"
 ask_pope_decision_effect_tooltip:0 "Hará falta algo de delicadeza por tu parte para manejar la bizantina política de la Santa Sede"
 ask_pope.1.t:0 "Solicitud de financiación"
 ask_pope.1.desc:0 "Tu opción es conformarte con la cantidad de ayuda monetaria prevista en la carta fundacional de la orden o persuadir al Papa para que profundice en las arcas a riesgo de enfadarle."
 ask_pope.a:0 "Solicitar fondos adicionales, exagerar la amenaza".
 ask_pope.a.success:0 "Has pintado una imagen aterradora de la amenaza que se avecina".
 ask_pope.a.failure:0 "El Papa desestimó tu informe como un alarmismo".
 ask_pope.b:0 "Solicita fondos adicionales, subraya la santidad de la causa".
 ask_pope.b.success:0 "Lograste apelar al lado celoso del Santo Padre".
 ask_pope.b.failure:0 "No lograste elevar tu causa por encima de los otros gastos del Papa".
 ask_pope.c:0 "Solicitar fondos adicionales, halagar al Santo Padre".
 ask_pope.c.success:0 "Has hecho cosquillas a la vanidad del Santo Padre para caerle bien".
 ask_pope.c.failure:0 "El Papa se dio cuenta de tus evidentes intentos de adulación".
 ask_pope.d:0 "Pide fondos adicionales, infla tus gastos". 
 ask_pope.d.success:0 "Has movido los números en los libros de contabilidad para justificar fondos adicionales".
 ask_pope.d.failure:0 "El Papa no se dejó engañar por tu contabilidad creativa".
 ask_pope.e:0 "Simplemente solicita la suma acordada".
 ask_pope.a.success.t:0 "El papa te cree".
 ask_pope.a.success.desc:0 "El Santo Padre está conmovido hasta la médula por el caos y la depravación que has presenciado. Envía una doble asignación".
 ask_pope.a.failure.t:0 "El Papa es escéptico".
 ask_pope.a.failure.desc:0 "Has adornado tu informe hasta tal punto de fantasía, que el Santo Padre empieza a dudar de si hay algo que hagas además de fabricar historias."
 ask_pope.b.success.t:0 "El Papa está convencido".
 ask_pope.b.success.desc:0 "El Santo Padre está de acuerdo, no hay causa más justa para un clérigo que proteger a su rebaño. Envía una asignación doble".
 ask_pope.b.failure.t:0 "El Papa reconsidera sus gastos".
 ask_pope.b.failure.desc:0 "Su inepta descripción de la causa de su orden recordó al Santo Padre gastos más inmediatos."
 ask_pope.c.success.t:0 "El Papa se siente halagado".
 ask_pope.c.success.desc:0 "Tus sutiles y finas adulaciones te convirtieron en una de las personas favoritas del Santo Padre para financiar. Te envía una asignación doble".
 ask_pope.c.failure.t:0 "El Papa ve a través de su adulación".
 ask_pope.c.failure.desc:0 "Tus burdos intentos de adular al Santo Padre fueron recibidos nada menos que como un insulto."
 ask_pope.d.success.t:0 "Has conseguido justificar el presupuesto".
 ask_pope.d.success.desc:0 "El Santo Padre admitió que tu misión podría ser un esfuerzo más costoso de lo inicialmente previsto."
 ask_pope.d.failure.t:0 "Sus libros son sospechosos".
 ask_pope.d.failure.desc:0 "Tu inepto intento de inflar tus gastos lleva a los contables papales a concluir que, de hecho, estás sobrefinanciado."
 ask_pope.e.t:0 "Usted recibe financiación".
 ask_pope.e.desc:0 "Sólo la cantidad prevista en el fondo designado, ni más ni menos." 
