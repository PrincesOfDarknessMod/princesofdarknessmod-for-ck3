 blackcross_victory_objective_decision_desc:0 "A pesar de un intento fallido de Jurgen von Verden, los Ventrue alemanes siguen mirando al Este como una tierra salvaje e indómita. Sin embargo, habrá que ocuparse de muchos enemigos antes de lograr un liderazgo Ventrue adecuado."
 blackcross_victory_objective_decision_effect_tooltip2:1 "Obtendrás una reclamación sobre los reinos del Oeste. Un nuevo prospecto llegará a tu corte". 
