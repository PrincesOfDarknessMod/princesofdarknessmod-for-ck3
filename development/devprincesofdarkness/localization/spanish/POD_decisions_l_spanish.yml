 talmahera_victory_objective_decision_desc:0 "La Tal'mahe'Ra se encuentra dividida entre el Este y el Oeste, cortada por la mitad por los Assamitas de Persia y los Ravnos de la India. Si quieres preparar el regreso de los antediluvianos, este cisma debe ser sanado".
