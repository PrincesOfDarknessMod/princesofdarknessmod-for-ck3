 NOT_NO_BRUJAH:0 "¡Necesitas al menos un caballero Brujah para ejercer este poder! Un cuadro requiere más de un miembro ..."
 POD_brujah_cadre_interaction:0 "Asamble Cadre brujah"
 POD_brujah_cadre_interaction_desc:0 "Es difícil para un brujah trabajar con otros miembros de su clan: los ánimos estallan con demasiada frecuencia y sobreviene el desastre. Pero cuando adoptan una causa común, un grupo de Brujah (o Cadre) es una fuerza a tener en cuenta."
 POD_brujah_cadre_interaction_ct:0 "Por cada caballero brujah que sirva en tus ejércitos, recibirás una bonificación a la efectividad del caballero. Tú y tu Cadre también se acercarán más, ganando influencia el uno sobre el otro. Cuando se usa de nuevo, descarta la asamblea anterior."
 
 POD_gangrel_challenge_interaction:0 "Desafío para Alpha"
 POD_gangrel_challenge_interaction_desc:0 "Los Gangrel siempre han confiado en el poder personal para elegir a sus líderes y alfas. Reta al objetivo a un duelo para determinar quién es más fuerte y quién toma las decisiones."
 POD_gangrel_challenge_interaction_succ:0 "Tú ganas!"
 POD_gangrel_challenge_interaction_lose:0 "Pierdes el desafío"
 POD_gangrel_challenge_interaction_succ_toast:0 "¡Nadie puede resistir mi poder!"
 POD_gangrel_challenge_interaction_lose_toast:0 "Apartado como un cachorro ...."
