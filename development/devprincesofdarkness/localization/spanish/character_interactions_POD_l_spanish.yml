 #AWAKETORPOR_DISCOVERY_DESC:0 "¡Icono de advertencia! Estás expuesto por el [delito|E] de caza de brujas"
 awaketorpor_my_intrigue:1 "Tu aprendizaje: $VALUE|=+0$"
 awaketorpor_my_rival:1 "Tu víctima: $VALUE|=+0$"
 POD_awaketorpor.667.t:0 "Perdido el rastro"
 POD_awaketorpor.667.desc:0 "Quizás tu presa ya ha despertado, o tus pistas eran falsas todo el tiempo. Sea como sea, has perdido el rastro del vampiro tórrido y debes empezar de cero si sigues empeñado en localizarlo."
 POD_awaketorpor.667.option.a:0 "¡Parece que me esperaban!"
 POD_awaketorpor.1.t:0 "Preguntas y respuestas"
 POD_awaketorpor.1.desc:0 "Has encontrado una pista importante sobre la ubicación del vampiro dormido que buscas. Lamentablemente, la pista sólo llega hasta aquí y en realidad te lleva a un pequeño pueblo donde nadie quiere hablar contigo.\N¿Quizás estén esclavizados por tu presa? Es difícil de decir, pero no puedes deambular por la zona demasiado tiempo, así que tendrás que convencerles de que respondan a tus preguntas."
 POD_awaketorpor.1.option.a:0 "¡Tú ahí! Contesta!"
 POD_awaketorpor.1.option.aa.effect.success.desc:0 "Un éxito crítico hará que tu plan avance sin problemas."  
 POD_awaketorpor.1.option.ab.effect.success.desc:0 "Puede que pierdas algo por el camino..."      
 POD_awaketorpor.1.option.ac.effect.success.desc:0 "Pierdes el rastro..."      
 POD_awaketorpor.1.option.b:0 "No merece la pena".       
 POD_awaketorpor.1.option.b.custom:0 "Terminas tu viaje aquí, dejando al vampiro dormido con su sueño".       
 POD_awaketorpor.1.success:0 "El oro abre muchas puertas"
 POD_awaketorpor.2.t:0 "El laberinto"
 POD_awaketorpor.2.desc:0 "Obviamente, tenía que ser un laberinto. Tu objetivo construyó o tomó prestadas un montón de cuevas subterráneas y ahora está refugiado allí. Y, lo has adivinado, hay trampas por todas partes.\NPuedes intentar navegar por este laberinto para llegar a tu presa, pero es probable que salgas herido en el proceso."
 POD_awaketorpor.2.option.a:0 "Un paso a la vez..."
 POD_awaketorpor.2.success:0 "¡Ay! La cabeza no!"
 POD_awaketorpor.3.t:0 "Los Thralls"
 POD_awaketorpor.3.desc:0 "Has encontrado el lugar donde se encuentra tu objetivo... pero también has encontrado todo un ejército de mercenarios protegiendo el lugar, aparentemente pagados por un complejo esquema dirigido por algunos de los sirvientes del vampiro. Tienes tu propio ejército no muy lejos, obviamente, pero los mercenarios están atrincherados y esperan problemas.\NLa elección es tuya. Si sigues adelante, tendrás que ganar rápido antes de que trasladen al tórrido vampiro a otro lugar. También puedes cancelar la operación si no quieres arriesgarte".
 POD_awaketorpor.3.option.a:0 "¡Carga!"
 POD_awaketorpor.3.option.b:0 "No vale la pena"
 POD_awaketorpor.3.success:0 "Una victoria desordenada"
 POD_awaketorpor.10.t:0 "La elección"
 POD_awaketorpor.10.desc:0 "Se ha eliminado cualquier obstáculo en el camino hacia tu tórrido objetivo. Ahora, tienes que prepararte para el enfrentamiento con tu presa, ya que los vampiros recién despertados no son los más amigables.Tienes que elegir cuál es tu objetivo con el monstruo dormido que te espera."
 POD_awaketorpor.10.option.a:0 "Quiero despertarlo y reclutarlo"
 POD_awaketorpor.10.option.b:0 "¡Otra alma para comer!"
 POD_awaketorpor.11.t:0 "Volviendo a casa"
 POD_awaketorpor.11.desc:0 "Has perdido el rastro de tu objetivo, y vuelves a tu corte sin mucho, o nada, que mostrar de tu viaje. Obviamente, este es un momento difícil, ya que tus rivales ya se burlan a tus espaldas.\N¿Cómo vas a manejar esta situación?"
 POD_awaketorpor.11.option.a:0 "Financiar una demostración de fuerza para sofocar los disturbios"
 POD_awaketorpor.11.option.b:0 "Se callarán a tiempo"
 POD_awaketorpor.12.t:0 "Hablar con sueño"
 POD_awaketorpor.12.desc:0 "Has encontrado a tu presa y has utilizado a un donante de sangre 'voluntario' para ayudar a lavar el sueño de las edades. Sin demasiados problemas, aunque obviamente te has mantenido alejado durante todo el proceso.\NAhora, tu objetivo está totalmente despierto, y está escuchando atentamente lo que le ofreces. Es ahora o nunca cuando te asegurarás su participación y su regreso a tu corte. Más vale que estés seguro de lo que vas a decir a continuación..."
 POD_awaketorpor.12.option.a:0 "No rechazará mi oferta"
 POD_awaketorpor.12.option.aa.effect.success.desc:0 "¡Tu objetivo se une a tu corte!"  
 POD_awaketorpor.12.option.ab.effect.success.desc:0 "Te has hecho de rogar, pero ha funcionado"      
 POD_awaketorpor.12.option.ac.effect.success.desc:0 "Una negativa rotunda, te vas solo"           
 POD_awaketorpor.12.option.b.custom:0 "Terminas tu viaje aquí, dejando al vampiro dormido a su sueño"       
 POD_awaketorpor.12.success:0 "¡Bienvenido!"
 POD_awaketorpor.12.successb:0 "...¡Bienvenido!" 
 POD_awaketorpor.12.successc:0 "Todo por nada..."  
 POD_awaketorpor.13.t:0 "El guardián"
 POD_awaketorpor.13.desc:0 "Sólo queda un obstáculo en el camino de tu presa, un guerrero de aspecto duro que protege al vampiro dormido. Puede que sea un ghoul, pero parece muy bien entrenado, y sospechas que hay otros emboscados cerca.\N-El espacio está demasiado cerca para lanzar un asalto con un ejército, y no puedes retroceder ahora, o moverán el cuerpo de su maestro. Así que es una lucha en la que estás claramente en desventaja, pero puedes sentir la sangre palpitante de tu presa cerca llamándote..."
 POD_awaketorpor.13.option.a:0 "¡Te mataré y luego consumiré a tu amo!"
 POD_awaketorpor.13.option.aa.effect.success.desc:0 "¡Una victoria total!"  
 POD_awaketorpor.13.option.ab.effect.success.desc:0 "Fue duro..."      
 POD_awaketorpor.13.option.ac.effect.success.desc:0 "¡Espera! ¡Usar flechas de fuego es hacer trampa!"           
 POD_awaketorpor.13.success:0 "...tan cerca"
 POD_awaketorpor.14.t:0 "El premio"
 POD_awaketorpor.14.desc:0 "Por fin, tu objetivo dormido está indefenso ante ti. Casi tiemblas de anticipación, lo que obviamente no es posible en tu estado. El tiempo parece detenerse mientras muestras tus colmillos, dispuesto a consumir el alma por la que has luchado.\NTu Bestia está encantada, y dejarás este lugar más fuerte de lo que viniste... pero quizás menos humano."
 POD_awaketorpor.14.option.a:0 "¡Es hora de alimentarse!"
 
