 POD_cappadocian_send_advisor_interaction:0 "Enviar asesoramiento"
 POD_cappadocian_send_advisor_interaction_desc:0 "Más allá de sus búsquedas académicas, los Capadocios son conocidos por servir como adivinos de reyes y príncipes. Sabiendo esto, puede enviar a su hijo a servir en la corte de otro gobernante, obteniendo varios beneficios."
 POD_cappadocian_send_advisor_interaction_ct:0 "Su hijo chiquillo será enviado a la corte de [recipient.GetFirstName] para servir como consejero o consejero. Si resultan efectivos, se ganará la gratitud del gobernante extranjero y su hijo podría incluso aprender algo. Sin embargo, si su chiquillo falla, puede esperar ramificaciones."
 POD_cappadocian_send_advisor_interaction_chancellor_option:0 "Enviar como canciller"
 POD_cappadocian_send_advisor_interaction_steward_option:0 "Enviar como mayordomo"
 POD_cappadocian_send_advisor_interaction_spymaster_option:0 "Enviar como jefe de espias"
 POD_cappadocian_send_advisor_interaction_marshal_option:0 "Enviar como marshal"
 POD_cappadocian_send_advisor_interaction_court_chaplain_option:0 "Enviar como capellán de la corte"
