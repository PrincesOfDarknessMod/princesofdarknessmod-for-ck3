 POD_infiltrate_interaction:0 "Infiltrar"
 POD_infiltrate_interaction_desc:0 "Te infiltrarás en esta corte haciéndote pasar por un neonato, dándoles un malus de resistencia al esquema considerable."
 infiltrate_modifier:0 "Infiltrado"
 infiltrate_modifier_desc:0 "De alguna manera, todo el mundo parece saber mucho sobre tu corte..."
  
 absalon_svantevit_weakest:0 "Entendimiento débil del ritual"
 absalon_svantevit_weakest_desc:0 "Sólo tienes la más remota idea de lo que hacían esos paganos en ese templo"
 absalon_svantevit_weak:0 "Débil comprensión del ritual"
 absalon_svantevit_weak_desc:0 "Sigue siendo en su mayor parte un montón de runas incoherentes y demás, pero estás progresando."
 absalon_svantevit_medium:0 "Comprensión media del ritual"
 absalon_svantevit_medium_desc:0 "¡Así que esto es lo que significaba esta parte!"
 absalon_svantevit_strong:0 "Comprensión fuerte del ritual"
 absalon_svantevit_strong_desc:0 "Estás tan cerca ahora, tan cerca..."
 absalon_svantevit_reborn:0 "Svantevit renacido"
 absalon_svantevit_reborn_desc:0 "¡El Dios de la guerra vuelve a caminar entre la noche!... aunque eso sea bastante estresante para su lamentable hueste".
           
 POD_trial_by_war_interaction:0 "Juicio por la guerra"
 POD_trial_by_war_interaction_desc:0 "Hora de enseñar a este que es el verdadero Voivoda aquí".
    
 POD_etrius_abuse_interaction:0 "Política Tremere"
 POD_etrius_abuse_interaction_desc:0 "Como mano derecha del propio Tremere, es hora de usar tu poder dentro del clan".
     
 POD_maatkare_interaction:0 "Tentar"
 POD_maatkare_interaction_desc:0 "Ayuda a este cainita descarriado a conocer la verdad sobre la gloria de Set".
 
 POD_ventrue_succor_interaction:0 "Ética del socorro"
 POD_ventrue_succor_interaction_desc:0 "El Clan Ventrue se mantiene el derecho de socorro: cuando un Ventrue está en extrema ayuda, otros Ventrue están obligados a ayudarlos. Sin embargo, nada es gratuito."
 
 POD_toreador_rumor_mill_interaction:0 "Molino de rumores"
 POD_toreador_rumor_mill_interaction_desc:0 "El clan Toreador es experto en manipular la máquina social. Al utilizar esa habilidad, puede fabricar una afirmación escandalosa y hacerla realidad. O al menos, en lo que a los demás respecta."
 POD_toreador_rumor_mill_interaction_succ: "Éxito"
 POD_toreador_rumor_mill_interaction_succ_ct:0 "Prepararás un falso [secret|E] en el objetivo, y asegúrese de que la cantidad de gente suficiente para respaldar el rumor lo respalde, pero no lo suficiente para revelar el secreto. "
 POD_toreador_rumor_mill_interaction_succ_toast:0 "Triunfo!"
 POD_toreador_rumor_mill_interaction_fail:0 "Fracaso"
 POD_toreador_rumor_mill_interaction_fail_toast:0 "Fracaso!"
 POD_toreador_rumor_mill_interaction_fail_ct:0 "Serás descubierto y despreciado."

 POD_malkavian_madness_network_divine:0 "Red de Locura:Divina"
 POD_malkavian_madness_network_divine_desc:0 "Usa la información de tus hermanos Malkavaian y escucha los oscuros susurros ... Abriendo el objetivo a tus pequeños planes."
 POD_malkavian_madness_network_divine_ct:0 "Todo Malkavian en la corte de [recipient.GetFirstName], tendrá el esquema de defensa devastado."
 POD_malkavian_madness_network_backlash:0 "La aplicación en la red de la locura pone a prueba tu mente y tu alma ... El conocimiento prohibido puede destrozarte tanto como ayuda. "
 NO_MALKAVIANS:0 "Debe haber al menos un Malkavian en la corte del objetivo."
 NOT_NO_MALKAVIANS:0 "Debe haber al menos un Malkavian en la corte del objetivo."

 POD_malkavian_madness_network_borrow_skill:0 "Red de Locura: Pedir prestado habilidad"
 POD_malkavian_madness_network_borrow_skill_desc:0 "Extrae hebras de pensamientos aparentemente aleatorios de la red de locura para mejorar una de tus habilidades."
 POD_malkavian_madness_network_borrow_skill_ct:0 "La habilidad elegida se verá reforzada por el extraño conocimiento de red de la locura ... ¿De dónde podría provenir?"
 POD_malkavian_madness_network_diplomacy:0 "Diplomacia"
