l_spanish:
 culture_era_dark_fantastic:0 "Fantástico oscuro"
 culture_era_dark_fantastic_desc:0 "En los albores de la era moderna temprana, se están mapeando nuevos continentes, mientras que la sociedad feudal está dando paso lentamente a estados centralizados."
 culture_era_gothic_victorian:0 "victoriano gótico"
 culture_era_gothic_victorian_desc:0 "El nombre 'Gótico victoriano' hace referencia a las dos sensibilidades que informan el escenario: el melancólico y condenado romanticismo de la ficción gótica clásica y el reinado de la reina Victoria I del Reino Unido, que gobernó el Imperio Británico desde el 20 de junio de 1837 hasta su muerte. el 22 de enero de 1901. Estas dos sensibilidades infieren una preocupación por el cambio social radical, ya que alternativamente coexiste y choca con el peso represivo de la tradición. La era gótica victoriana, tal como aparece en Victorian Age: Vampire, se extiende desde los años 1890 hasta 1897 y no termina con la muerte de Victoria, sino con la novela Drácula de Bram Stoker. Este evento sacudió el mundo de los Vástagos hasta la médula. El período gótico victoriano se superpone parcialmente con el Salvaje Oeste (o "Wyld West"), el escenario de Werewolf: The Wild West. Sin embargo, el tema y el tono de los dos escenarios difieren significativamente. El próximo Victorian Mage for Mage: The Ascension también se ocupará de la época victoriana."
 culture_era_final_nights:0 "Noches finales"
 culture_era_final_nights_desc:0 "En la escatología [cainite|E], las Noches Finales son las noches anteriores a la llegada de la Gehenna y el fin de los vampiros. Gran parte de la base para creer en las Noches Finales se origina en la tradición nodista. Concretamente, el Libro de Nod. Se supone que las Noches Finales son anteriores a varios signos que indican grandes cambios en la sociedad [cainite|E] y el despertar inminente de los [antediluvians|E], como un aumento en el número de vampiros de sangre débil, principados gobernados por Caitiff y Kuei-jin invadiendo Occidente. Se dice que la mayoría de los vampiros tienen una sensación de muerte inminente durante las Noches Finales."
innovation_tenaille:0 "Tenaille"
 innovation_tenaille_desc:0 "Era difícil disparar alrededor de las murallas curvas, por lo que una vez que los atacantes se acercaban lo suficiente a la fortificación, se anulaba la capacidad de otras partes de las defensas para proporcionar fuego de flanqueo. El desarrollo de bastiones en forma de estrella permitió que cada parte de la muralla se apoyara en otras partes."

 innovation_trunnions:0 "Muñones"
 innovation_trunnions_desc:0 "La nueva y más móvil artillería tenía un problema: no se podía elevar y bajar fácilmente para ajustar su alcance de tiro. Los muñones eran unos salientes cilíndricos que actuaban como soportes del cañón en su carro, lo que permitía inclinarlo y así apuntar mejor."

 innovation_professional_officers:0 "Oficiales profesionales"
 innovation_professional_officers_desc:0 "El valor del entrenamiento y la experiencia siempre ha sido grande en el campo de batalla. Con la llegada de la pólvora y los cambios tácticos asociados a ella y a otras armas de infantería llegó una gran demanda de unidades versadas en estas nuevas innovaciones."

 innovation_early_modern_military:0 "Militares de la Edad Moderna"
 innovation_early_modern_military_desc:0 "A finales de la Edad Media los ejércitos terrestres se habían profesionalizado y organizado mejor. Se han establecido mejores sistemas para apoyar la mezcla de levas y soldados profesionales que ahora dominan los campos de batalla y el poder de la infantería está ganando lenta pero constantemente al brazo de la caballería."

 innovation_standardized_pikes:0 "Picas estandarizadas"
 innovation_standardized_pikes_desc:0 "Una pica es un arma notablemente sencilla de fabricar, pero para obtener todo el beneficio del uso de las picas, se requiere que toda la formación empuñe armas de longitud y hoja similares."

 innovation_musketmen:0 "Mosqueteros"
 innovation_musketmen_desc:0 "El arcabuz, ligero y fiable, pudo desplazar al arco debido a tres factores principales. Tenía una mejor penetración de la armadura, era más fácil entrenar a los hombres para usarlo y no dependía de la fuerza del usuario."

 #Civic
 innovation_early_modern_administration:0 "Administración moderna temprana"
 innovation_early_modern_administration_desc:0 "Con el tiempo se hizo evidente que una burocracia más centralizada, con órganos administrativos dirigidos por funcionarios educados y empleados directamente por el Estado, era una necesidad para los ambiciosos proyectos de los gobernantes de la Edad Moderna."

 innovation_land_clearance:0 "Liquidación de tierras"
 innovation_land_clearance_desc:0 "Los grandes bosques son, por supuesto, útiles como fuente de leña y lugar de caza, pero si los árboles desaparecieran, esas tierras podrían utilizarse para la agricultura en su lugar."

 innovation_constitution:0 "La Constitución"
 innovation_constitution_desc:0 "Se ha desarrollado un nuevo concepto filosófico llamado constitucionalismo, en el que el gobierno acepta límites legales a su poder. Es una idea intrigante, pero no veo que se ponga de moda".

 innovation_absolute_rulership:0 "Gobierno absoluto"
 innovation_absolute_rulership_desc:0 "Hay mucha gente que exige que se le dé un papel en el gobierno, pero en realidad la mayoría quiere recompensas sin esfuerzo. Se está extendiendo una nueva e interesante idea de absolutismo, que es un sistema en el que nos deshacemos de esos parásitos y gobernamos solos."

 innovation_textile_manufactory:0 "Fabricación textil"
 innovation_textile_manufactory_desc:0 "Los textiles se fabricaban desde tiempos inmemoriales. La invención del bastidor de medias en 1589 fue el primer paso hacia la revolución industrial y el inicio de la mecanización. Este invento conduciría a un aumento de la producción textil".

 innovation_renaissance_thought:0 "Pensamiento renacentista"
 innovation_renaissance_thought_desc:0 "La noción de una oligarquía noble que gobierna la sociedad ha existido, desde bueno, al menos la época romana, y siguió siendo popular en algunas partes del mundo. Ahora esta idea vuelve a ganar popularidad entre los que importan".

 innovation_separation_of_powers:0 "Separación de poderes"
 innovation_separation_of_powers_desc:0 "Ha surgido un tratado anónimo de teoría política que, a pesar de los esfuerzos por suprimirlo, se está extendiendo rápidamente por todo el mundo. Trata de la naturaleza de las formas de gobierno, ya sean monarquías, despotismos o democracias, y defiende una estricta separación de los poderes ejecutivo, legislativo y judicial."

 #Regional
 innovation_spanish_square:0 "Plaza de España"
 innovation_spanish_square_desc:0 "Spanish Square se desarrolló naturalmente a partir de las formaciones Pike y Shot. En su núcleo era un Pike Square tradicional. En cada una de las esquinas tenía un grupo de arcabuceros. Mantuvo el poder de permanencia de la escuadra de picas tradicional y lo mejoró con la potencia de fuego del Arcabus."
 innovation_new_world:0 "El nuevo Mundo"
 innovation_new_world_desc:0 "¿Quién sabe qué hay más allá?... Además de incalculables riquezas y gloria, por supuesto."
 innovation_the_mughals:0 "los mogoles"
 innovation_the_mughals_desc:0 "El Imperio Mughal fue un poderoso estado musulmán turco-mongol, fundado a principios del siglo XVI por Babur, un príncipe timúrida y descendiente de Tamerlán. En su apogeo a principios del siglo XVIII, el imperio controlaba casi todo el subcontinente indio."
