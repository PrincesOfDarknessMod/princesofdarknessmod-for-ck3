l_spanish:

 POD_diablerize.100.t:0 "Diablerizar: [diablerie_location.GetNameNoTooltip]"
 POD_diablerize.100.desc:0 "He rastreado [defender.GetFirstName] hasta [defender.GetHerHis] haven en [diablerie_location.GetNameNoTooltip]. Todo está listo, y ahora puedo finalmente atacar a [defender.GetHerHim] para drenar a [defender.GetHerHim] de toda la sangre de [defender.GetHerHis] e incluso del alma de [defender.GetHerHis]. El riesgo personal es considerable, pero la recompensa es mayor. ¿Debo seguir adelante con esto y lanzar mi ataque más mortífero contra [defender.GetFirstName]?".
 POD_diablerize.100.option.a:0 "¡Ataca a [defender.GetTitledFirstName]!"
 POD_diablerize.100.option.a.tt:0 "Se producirá una lucha, si pierdo, también puedo ser destruido. Usaré toda mi fuerza de voluntad y los poderes de la sangre para triunfar".  
 POD_diablerize.100.option.a.tt.beast:0 "¡Ataque #R! Tendremos [defender.GetHerHis] sangre del corazón! #"   
 POD_diablerize.100.option.b:0 "Abandona esta asquerosa búsqueda".
 POD_diablerize.100.option.b.tt.beast:0 "#R Sabemos que [defender.GetSheHe] es débil. ¡Puedo olerlo! No te vuelvas ahora! #"    
     
 POD_diablerize.200.t:0 "¡Un ataque mortal!"
 POD_diablerize.200.desc:0 "[atacante.GetFirstName] me ha pillado solo en [diablerie_location.GetNameNoTooltip]. ¡Los ojos de [atacante.GetHerHis|U] brillan con el hambre de la Bestia! ¿Qué debo hacer?"
 POD_diablerize.200.option.a:0 "¡Huir!"
 POD_diablerize.200.option.a.tt.beast:0 "#¡Corre, tonto!#"
 POD_diablerize.200.option.a.tt:0 "Un duelo marcial de maniobras determinará si puedes escapar del ataque de [atacante.GetFirstName]."
 POD_diablerize.200.option.a.desc:0 "Un duelo de maniobras"
 POD_diablerize.200.option.a.success:0 "[defender.GetFirstName] gana"
 POD_diablerize.200.option.a.tt.defender_wins:0 "¡Escapo!"
 POD_diablerize.200.option.a.tt.celerityadvanced:0 "¡Tengo celeridad avanzada!"
 POD_diablerize.200.option.a.tt.potenceadvanced:0 "¡Tengo potencia avanzada!"
 POD_diablerize.200.option.a.tt.blink:0 "Puedo moverme en un abrir y cerrar de ojos".
 POD_diablerize.200.option.a.tt.traversal:0 "Puedo correr por las paredes y por el agua".
 POD_diablerize.200.option.a.tt.soaring_leap:0 "Puedo dar saltos en el aire".
 POD_diablerize.200.option.a.tt.uncanny_grip:0 "Tengo un agarre asombroso".
 POD_diablerize.200.option.a.failure:0 "[atacante.GetFirstName] gana"
 POD_diablerize.200.option.a.tt.attacker_wins:0 "[attacker.GetFirstName] me atrapa"
 POD_diablerize.200.option.b:0 "¡Escóndete!"
 POD_diablerize.200.option.b.tt:0 "Un duelo de intriga de esconderse y buscar determinará si puedes escapar del ataque de [atacante.GetFirstName]."
 POD_diablerize.200.option.b.desc:0 "Un duelo de escondite y búsqueda"
 POD_diablerize.200.option.b.tt.beast:0 "#¡La noche será nuestra armadura!#"
 POD_diablerize.200.option.b.tt.obfuscateadvanced:0 "¡He avanzado la ofuscación!"
 POD_diablerize.200.option.b.tt.oblivionadvanced:0 "¡He avanzado oblivion!" 
 POD_diablerize.200.option.b.tt.cloak_of_shadows:0 "Puedo camuflarme en las sombras".
 POD_diablerize.200.option.b.tt.silence_of_death:0 "Me muevo con el silencio de la muerte".
 POD_diablerize.200.option.b.tt.unseen_passage:0 "Mi paso es invisible".
 POD_diablerize.200.option.b.tt.vanish:0 "Puedo simplemente desaparecer".
 POD_diablerize.200.option.b.tt.stygian_shroud:0 "Puedo invocar un Stygian Shroud".
 POD_diablerize.200.option.b.tt.shadow_step:0 "Puedo atravesar las sombras".
 POD_diablerize.200.option.b.success:0 "[defender.GetFirstName] gana"
 POD_diablerize.200.option.b.tt.defender_wins:0 "¡Me escondo!"
 POD_diablerize.200.option.b.failure:0 "[atacante.GetFirstName] gana"
 POD_diablerize.200.option.b.tt.attacker_wins:0 "[attacker.GetFirstName] me atrapa"
 POD_diablerize.200.option.c.tt:0 "Un duelo de intriga determinará si puedes usar la disciplina ofuscar para esconderte del ataque de [atacante.GetFirstName]."
 POD_diablerize.200.option.c:0 "¡Entrada!"
 POD_diablerize.200.option.c.tt.beast:0 "#R ¡¿Cómo pudo [atacante.GetSheHe] atacarnos?! Somos tan maravillosos!#"
 POD_diablerize.200.option.c.desc:0 "Un conflicto de personalidad"
 POD_diablerize.200.option.c.tt:0 "Un duelo de diplomacia determinará si puedes usar la disciplina de presencia para conseguir que [atacante.GetFirstName] detenga el ataque de [atacante.GetHerHis]."
 POD_diablerize.200.option.c.tt.entrancement:0 "Estoy entrando."
 POD_diablerize.200.option.c.tt.majesty:0 "¡Soy majestuoso!"
 POD_diablerize.200.option.c.success:0 "[defender.GetFirstName] gana"
 POD_diablerize.200.option.c.tt.defender_wins:0 "¡Entro [atacante.GetFirstName]!"
 POD_diablerize.200.option.c.failure:0 "[atacante.GetFirstName] gana"
 POD_diablerize.200.option.c.tt.attacker_wins:0 "[attacker.GetFirstName] es inmune a mis encantos" 
 POD_diablerize.200.option.d:0 "¡Encantar!"
 POD_diablerize.200.option.d.desc:0 "Un conflicto de dominio"
 POD_diablerize.200.option.d.tt.beast:0 "#R [atacante.GetSheHe|U] ¡obedecerá!#"
 POD_diablerize.200.option.d.tt:0 "Un duelo de mayordomía determinará si puedes usar la disciplina de la orden de dominación [atacante.GetFirstName] para detener el ataque de [atacante.GetHerHis]."
 POD_diablerize.200.option.d.tt.mesmerize:0 "Puedo hipnotizar mentes menores".
 POD_diablerize.200.option.d.tt.rationalize:0 "Puedo hacer que los esclavistas racionalicen mis órdenes como si fueran suyas."
 POD_diablerize.200.option.d.tt.submerged_directive:0 "Puedo sumergir directivas para convertir a los débiles en mis peones".
 POD_diablerize.200.option.d.tt.terminal_decree:0 "Puedo emitir un decreto terminal".
 POD_diablerize.200.option.d.success:0 "[defender.GetFirstName] gana"
 POD_diablerize.200.option.d.tt.defender_wins:0 "¡Domino a [atacante.GetFirstName]!"
 POD_diablerize.200.option.d.failure:0 "[atacante.GetFirstName] gana"
 POD_diablerize.200.option.d.tt.attacker_wins:0 " La voluntad de [attacker.GetFirstName] es demasiado fuerte para dominarla"  
 POD_diablerize.200.option.e:0 "¡Cambio de forma!"
 POD_diablerize.200.option.e.tt.beast:0 "#R [atacante.GetSheHe] no puede comer lo que [atacante.GetSheHe] no puede sostener!"
 POD_diablerize.200.option.e.tt:0 "Un duelo de aprendizaje determinará si puedes usar tu disciplina para transformarte en una forma incoporal y evadir la trampa de [atacante.GetFirstName]."
 POD_diablerize.200.option.f:0 "¡Ataca!"
 POD_diablerize.200.option.f.tt.beast:0 "#R ¡Tomaremos la sangre de [atacante.GetHerHis]!"
 POD_diablerize.200.option.f.tt:0 "Un duelo de proezas determinará si [attacker.GetFirstName] o tú ganáis en el combate."

# Duelo de destreza de vuelo Resultado
#250 notificar atacante
 POD_diablerize.250.t:0 "¡Diablerie: ¡Vuelo!"
 POD_diablerize.250.desc.success:0 "[defender.GetFirstName] huye de mí.  Por mucho que lo intente, no puedo alcanzarlo".
 POD_diablerize.250.desc.failure:0 "[defender.GetFirstName] intentó huir, pero no fue lo suficientemente rápido. Ahora a cruzar la distancia restante y cazar a [defender.GetHerHim]".
 POD_diablerize.250.option.a.success:0 "¡Fracasado!"
 POD_diablerize.250.option.a.failure:0 "¡Ataque!"
 
#275 Resultado del duelo marcial notificar al defensor
 POD_diablerize.275.t:0 "¡Huyendo del combate!"
 POD_diablerize.275.desc.success:0 "Pude escapar de [attacker.GetFirstName]. [atacante.GetSheHe|U] se ha quedado muy atrás, fuera de mi vista".
 POD_diablerize.275.desc.failure:0 "Corrí pero no lo suficientemente rápido. [atacante.GetFirstName] me ha alcanzado".
 POD_diablerize.275.option.a.success:0 "Debo mantenerme alejado de [atacante.GetHerHim]".
 POD_diablerize.275.option.a.failure:0 "¡Es [atacante.GetHerHim] o yo!"

#Hide Duel
#300 hide duel notify atacker
 POD_diablerize.300.t:0 "Diablerie: ¡Hide!"
 POD_diablerize.300.desc.success:0 "[defender.GetFirstName] pudo esconderse rápidamente de mí. No puedo encontrar a [defender.GetHerHim] en ningún sitio".
 POD_diablerize.300.desc.failure:0 "[defender.GetFirstName] estaba intentando esconderse de mí. Eso no va a funcionar. Puedo ver dónde está [defender.GetSheHe]".
 POD_diablerize.300.option.a.success:0 "¡Fracasado!"
 POD_diablerize.300.option.a.failure:0 "¡Ataque!"
 
#325 ocultar duelo notificar al defensor
 POD_diablerize.325.t:0 "¡Esconderse del combate!"
 POD_diablerize.325.desc.success:0 "Eso estuvo cerca. He podido esconderme de [atacante.GetFirstName]. Ahora, si puedo moverme con el suficiente sigilo sin llamar la atención, me alejaré de [atacante.GetHerHim]."
 POD_diablerize.325.desc.failure:0 "Intenté esconderme, pero [atacante.GetFirstName] me encontró."
 POD_diablerize.325.option.a.success:0 "Necesito cubrir mis huellas".
 POD_diablerize.325.option.a.failure:0 "¡Es [atacante.GetHerHim] o yo!"
 
# Negotiate Presence Duel
#350 entrance duel notify atacker
 POD_diablerize.350.t:0 "Diablerie: ¡Entrada!"
 POD_diablerize.350.desc.success:0 "Mirando a los ojos de [defender.GetHerHis], me sorprende lo maravilloso que es [defender.GetFirstName]. Me gusta mucho. Nunca podría hacer nada para herir a [defender.GetHerHim]".
 POD_diablerize.350.desc.failure:0 "[defender.GetFirstName] trató de engatusarme, pero mi mente no es tan débil como para caer en una estratagema tan desnuda. Tendré [defender.GetHerHis] sangre!"
 POD_diablerize.350.option.a.success:0 "Te quiero mucho".
 POD_diablerize.350.option.a.success.tt:0 "Mientras esté en trance con [defender.GetFirstName], no podré volver a intentar diablerizar a [defender.GetHerHim]."
 POD_diablerize.350.option.a.failure:0 "Tus encantos no me impresionan".

#375 entrance duel notify defender
 POD_diablerize.375.t:0 "Entrando al enemigo"
 POD_diablerize.375.desc.success:0 "Con mi disciplina de presencia, he seducido a [atacante.GetFirstName]. Mientras esté seducido, [atacante.GetSheHe] no es una amenaza para mí".
 POD_diablerize.375.desc.failure:0 "Intento captar la atención de [atacante.GetFirstName] e irradiar mi presencia a [atacante.GetHerHim]para dejarlos pasivos. Con la velocidad y la rabia con la que [atacante.GetSheHe] se acerca a mí, parece que he fracasado".
 POD_diablerize.375.option.a.success:0 "Sí, eso es. Soy el que adoras".
 POD_diablerize.375.option.a.success.tt:0 "Mientras [atacante.GetFirstName] esté hechizado por mí, [atacante.GetSheHe] no puede intentar diablerizarme de nuevo."
 POD_diablerize.375.option.a.failure:0 "¡Por qué no me quiere [atacante.GetSheHe]!"

#Duelo dominado

#425 dominar duelo notificar al defensor 
 POD_diablerize.425.t:0 "Hipnotizar al enemigo"
 POD_diablerize.425.desc.success:0 "Con mi disciplina de dominación, doblego la voluntad de [atacante.GetHerHis] como un alfarero dobla la arcilla. Primero obligo a [atacante.GetHerHim] a "¡Para! Ahora, algunos comandos más interesantes".
 POD_diablerize.425.desc.failure:0 "Llego a la mente de [attacker.GetHerHis]. Es como una fortaleza que no puedo penetrar. [atacante.GetSheHe|U] es sordo a mis repetidas órdenes".
 POD_diablerize.425.option.a:0 "Abandona este lugar. No vuelvas".
 POD_diablerize.425.option.a.tt:0 "El plan de diablura de [atacante.GetFirstName] contra ti termina".
 POD_diablerize.425.option.b:0 "Me harás un importante favor".
 POD_diablerize.425.option.b.tt:0 "Conseguiré un gancho en [atacante.GetFirstName]" 
 POD_diablerize.425.option.e:0 "Ahora eres mi prisionero". 
 POD_diablerize.425.option.e.tt:0 "Encarcelaré a [atacante.GetFirstName]"
 POD_diablerize.425.option.c:0 "Ve a ver el amanecer". 
 POD_diablerize.425.option.c.sunrise:0 "Ve a ver el amanecer".
 POD_diablerize.425.option.c.behead:0 "A la cuadra, prisionero. Con calma".
 POD_diablerize.425.option.c.fire:0 "Tírate a la pira funeraria".
 POD_diablerize.425.option.c.tt:0 "[atacante.GetFirstName] se suicidará y sufrirá la muerte final".
 POD_diablerize.425.option.d:0 "¡Por qué no me obedece [atacante.GetSheHe]!"

#400 dominar duelo notificar atacante
 POD_diablerize.400.t:0 "¡Diablerie: ¡Mesmerismo!"
 POD_diablerize.400.desc.success:0 "[defender.GetFirstName] entra en mi mente. No puedo resistir la voluntad de [defender.GetHerHis]. He sido completamente dominado. [defender.GetSheHe|U] me obliga a "¡Parar!"
 POD_diablerize.400.desc.leave:0 "Entonces [defender.GetFirstName] ordena: 'Deja este lugar y no vuelvas'". 
 POD_diablerize.400.desc.favor:0 "Entonces [defender.GetFirstName] ordena: 'Vas a hacer un favor importante para mí'". 
 POD_diablerize.400.desc.favor.tt:0 "[defender.GetFirstName] te hace un gancho".
 POD_diablerize.400.desc.die:0 "Entonces [defender.GetFirstName] emite un decreto terminal: 'Ve a ver el amanecer'." 
 POD_diablerize.400.desc.sunrise:0 "Entonces [defender.GetFirstName] emite un decreto terminal, 'Ve y mira el amanecer'." 
 POD_diablerize.400.desc.behead:0 "Entonces [defender.GetFirstName] emite un decreto terminal, 'A la cuadra, prisionero. Con calma". 
 POD_diablerize.400.desc.fire:0 "Entonces [defender.GetFirstName] emite un decreto terminal, 'Tírate a la pira funeraria'." 
 POD_diablerize.400.desc.prison:0 "Entonces [defender.GetFirstName] te ordena entrar en una celda, 'Ahora eres mi prisionero'". 
 POD_diablerize.400.desc.failure:0 "Mientras cargo contra [defender.GetFirstName], [defender.GetSheHe] me mira fijamente y con voz autoritaria me ordena '¡Detente!'. [defender.GetSheHe|U] no tiene poder sobre mí!"
 POD_diablerize.400.option.a.success:0 "Tu deseo es mi orden".
 POD_diablerize.400.option.d.failure:0 "¡No te metas en mi cabeza!"

#Aprendiendo Duelo de Desplazamiento de Formas
#450 shapeshift duel notify atacker
 POD_diablerize.450.t:0 "¡Diablerie: Shapeshift!"
 POD_diablerize.450.desc.success:0 "Ante mis ojos, [defender.GetFirstName] se transforma místicamente en una forma intangible. No puedo atrapar a [defender.GetHerHim]. Ni siquiera puedo tocar a [defender.GetHerHim].  Y así, sin más, [defender.GetSheHe] se ha ido".
 POD_diablerize.450.desc.failure:0 "[defender.GetFirstName] comienza a transformarse. El cuerpo de [defender.GetHerHis] comienza a transformarse. [defender.GetSheHe] no es lo suficientemente rápido para escapar de mí".
 POD_diablerize.450.option.a.success:0 "¡Ataca!"
 POD_diablerize.450.option.a.failure:0 "¡Fracasado!"
 
#475 duelo de desplazamiento de forma notificar al defensor
 POD_diablerize.475.t:0 "Cambio de forma"
 POD_diablerize.475.desc.success:0 "Concentro mi disciplina y me transformo en una forma intangible. Se completa antes de que [atacante.GetFirstName] pueda alcanzarme. Entonces escapo fácilmente".
 POD_diablerize.475.desc.failure:0 "Comienzo el proceso de transformación en una forma intangible. No puedo hacerlo lo suficientemente rápido antes de que [atacante.GetFirstName] esté encima de mí".
 POD_diablerize.475.option.a.success:0 "No será la última vez que este truco me salve".
 POD_diablerize.475.option.a.failure:0 "¡Carne contra carne será!"
 
# Duelo de proezas, última oportunidad de volver atrás
 POD_diablerize.500.t:0 "Diablerie: La batalla final"
 POD_diablerize.500.desc:0 "Se acabó el correr, el esconderse y los juegos mentales. [defender.GetFirstName] no puede alejarse de mí.  Ha llegado la hora del conflicto final".
 POD_diablerize.500.option.a:0 "¡Ataca a [defensor.GetHerHim]!"
 POD_diablerize.500.option.a.tt.beast:0 "#R ¡Sí! ¡Toda la sangre de [defender.GetHerHim] será mía! ... Quiero decir nuestra. Toda la sangre de [defender.GetHerHis] será nuestra! #"
 POD_diablerize.500.option.a.tt.attacker_wins:0 "[atacante.GetFirstName] gana!"
 POD_diablerize.500.option.a.tt.defender_wins:0 "[defensor.GetFirstName] ¡gana!"
 POD_diablerize.500.option.a.desc:0 "Una batalla de proezas"
 POD_diablerize.500.option.a.success:0 "¡Victoria!"
 POD_diablerize.500.option.a.failure:0 "¡Derrota!"
 POD_diablerize.500.option.b:0 "Demasiado arriesgado, abandono este plan".

# Duelo de proezas, el atacante retrocede
 POD_diablerize.510.t:0 "Retirada"
 POD_diablerize.510.desc:0 "[atacante.GetFirstName] no se compromete con el ataque y se retira".
 POD_diablerize.510.option.a:0 "Retirada"

#515 notificar al diablero el resultado del duelo de proezas
 POD_diablerize.515.t:0 "Diablerie: Al vencedor, el botín"
 POD_diablerize.515.desc.success:0 "La batalla es brutal pero también rápida. Soy victorioso y [defensor.GetFirstName] yace a mis pies".
 POD_diablerize.515.desc.failure:0 "Creía que estaba preparado, pero la destreza en el combate de [defender.GetFirstName] es demasiado para superarla. He sido derrotado".
 POD_diablerize.515.option.a.success:0 "¿Y ahora qué hago con mi premio?"
 POD_diablerize.515.option.a.failure:0 "Empiezo a caer en el letargo, preguntándome cuál será mi destino". 

#525 notificar al defensor el resultado del duelo de proezas, elegir el destino del diablero derrotado
 POD_diablerize.525.t:0 "¡El combate!"
 POD_diablerize.525.desc.success:0 "La destreza de combate de [atacante.GetFirstName] es demasiado para superarla. He sido derrotado".
 POD_diablerize.525.desc.failure:0 "La batalla es brutal pero también rápida. He salido victorioso y [atacante.GetFirstName] yace a mis pies".
 POD_diablerize.525.option.a.failure:0 "Destruye a [atacante.GetFirstName]. Es la muerte final para [atacante.GetHerHim]". #Matar
 POD_diablerize.525.option.b.failure:0 "[attacker.GetSheHe] es ahora mi prisionero". #Toma y Encarcela
 POD_diablerize.525.option.c.failure:0 "Me alejaré, dejando a [attacker.GetHerHis] a su suerte". #Liberar
 POD_diablerize.525.option.d.failure:0 "¡Tendré la sangre del corazón de [attacker.GetHerHis]!" #¡Diablerize! 
 POD_diablerize.525.option.e.success:0 "Empiezo a caer en el letargo, preguntándome cuál será mi destino".   

#550 defeated attacker notified of victorious defender decision
 POD_diablerize.550.t:0 "Diablerie: Derrota"
 POD_diablerize.550.desc.destruction:0 "He sido destruido por [defender.GetFirstName]".
 POD_diablerize.550.desc.imprisonment:0 "He sido encarcelado por [defender.GetFirstName]."
 POD_diablerize.550.desc.release:0 "[defender.GetFirstName] me ha dejado ir. No entiendo..."
 POD_diablerize.550.desc.diablerie:0 "[defender.GetFirstName] los colmillos se hunden en mi carne. [defender.GetSheHe] bebe toda mi sangre. Iba a ser el cazador, pero fui la presa".
 POD_diablerize.550.option.a:0 "Así es como termina".

# Llegando al ¡Yum Yum!
 POD_diablerize.600.t:0 "¡Diablerie!"
 POD_diablerize.600.desc:0 "No sólo matar, sino devorar el alma de otro ser es una de las acciones más atroces posibles. La mayoría de la gente lo considera el peor de los crímenes. Sin embargo, no hay nada que la bestia desee más. Finalmente, [victim.GetFirstName] está en mis garras. ¿Dreno a [víctima.GetHerHis] hasta el núcleo de su ser? ¿Bebo la sangre del corazón de [victim.GetHerHis]? ¿Tomo todo de [victim.GetHerHim]?"
 POD_diablerize.600.option.a:0 "¡Devora el alma de [victim.GetTitledFirstName]!"
 POD_diablerize.600.option.a.tt.beast:0 "#R ¡SÍ! ¡HAZLO!#"
 POD_diablerize.600.option.a.tt:0 "¡Destruye a [victim.GetTitledFirstName]!"   
 POD_diablerize.600.option.b:0 "No diabolizar [victim.GetFirstName]".
 POD_diablerize.600.option.b.tt.beast:0 "#R ¡No los dejes ir! ¡[victim.GetSheHe] no se merece la sangre! Nosotros sí!"    
 
 #El atacante decide no diablerizar
 POD_diablerize.650.t:0 "¿Piedad?"
 POD_diablerize.650.desc:0 "Fui derrotado. Estaba seguro de que [attacker.GetFirstName] me destruiría. Extrañamente, [attacker.GetSheHe] simplemente se alejó".
 POD_diablerize.650.option.a:0 "¿Fue una última pizca de humanidad?"
 
 POD_diablerize.700.t:0 "¡Amarano!"
 POD_diablerize.700.option.a:0 "vacío."
 POD_diablerize.700.desc:0 "Devora el alma de [victim.GetTitledFirstName]" 
  
 POD_diablerize.800.t:0 "El alma no conquistada"
 POD_diablerize.800.desc:0 "¡Siento a [unconquered_soul.GetFirstName] dentro de mi mente, luchando por tomar el control de mi cuerpo! ¿Qué he hecho?"  
 POD_diablerize.800.option.a:0 "¡Resiste! No me dejaré vencer!"
