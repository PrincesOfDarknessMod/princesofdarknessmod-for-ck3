l_spanish:

 POD_summon.100.t:0 "Estás siendo convocado"
 POD_summon.100.desc:0 "Sientes el impulso de acudir al lado de [schemer.GetTitledFirstName]".
 POD_summon.100.option.a:0 "Ejercer mi fuerza de voluntad para resistir la invocación".
 POD_summon.100.option.b:0 "Rechazar la invocación".
 POD_summon.100.option.c:0 "Aceptar la invocación".
 
 POD_summon.200.t:0 "Invocación [target.GetFirstNameNoTooltip]"
 POD_summon.200.desc:0 "Siento que mi energía mística toca la mente de [target.GetTitledFirstName]. [target.GetSheHe|U] se resiste a la invocación".
 POD_summon.200.option.a:0 "Despierta la sangre para traer a [target.GetHerHim] hacia mí".
 POD_summon.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] es hábil en la disciplina de la fortaleza y se resiste a mis poderes."
 POD_summon.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] ha ejercido su voluntad para resistir mis poderes."
 POD_summon.200.a.success.desc:0 "Victoria"
 POD_summon.200.a.tt_success:0 "[target.GetTitledFirstName] llegará a mi corte"
 POD_summon.200.a.failure.desc:0 "Derrota"
 POD_summon.200.a.tt_failure:0 "[target.GetTitledFirstName] se resistirá a mi invocación"
 POD_summon.200.option.b:0 "Despierta la sangre y ejerce mi voluntad. No se me negará"
 POD_summon.200.option.b.tt.beast:0 "#R ¡Sí! ¡Tráelos a nosotros! #"
 POD_summon.200.option.c:0 "Ríndete, ya no quiero [target.GetHerHim]".
 POD_summon.200.option.c.tt:0 "La invocación fallará".
 POD_summon.200.option.c.tt.beast:0 "#R ¡No! Se están escapando! #"

 POD_summon.300.t:0 "[target.GetFirstNameNoTooltip] Invocado"
 POD_summon.300.desc:0 "Mediante el uso de mi poder místico, [target.GetTitledFirstName] ha llegado a mi corte."
 POD_summon.300.option.a:0 "Bienvenido a mi casa, dijo la araña a la mosca".
 POD_summon.300.option.a.tt.beast:0 "#¡Hora de la cena! #"

 POD_summon.400.t:0 "Has llegado"
 POD_summon.400.desc:0 "Te encuentras en la corte de [schemer.GetTitledFirstName]". 
 POD_summon.400.option.a:0 "Mi nuevo hogar".
 
 POD_summon.500.t:0 "Te has resistido a la invocación"
 POD_summon.500.desc:0 "[target.GetTitledFirstName] se ha resistido a mi invocación". 
 POD_summon.500.option.a:0 "¡Fracasado!"
 POD_summon.500.option.a.tt.beast:0 "#R ¡Vamos a cazarlos y comerlos! #"

 POD_summon.600.t:0 "Invocación resistida"
 POD_summon.600.desc:0 "Ya no sientes que [schemer.GetTitledFirstName] te llama" 
 POD_summon.600.option.a:0 "¡No te metas en mi cabeza!"


