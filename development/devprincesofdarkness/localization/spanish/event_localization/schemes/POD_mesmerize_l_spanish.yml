l_spanish:

POD_mesmerize.100.t:0 "Estás siendo dominado"
 POD_mesmerize.100.desc:0 "[schemer.GetTitledFirstName] te está dominando para exigirte un favor".
 POD_mesmerize.100.option.a:0 "Ejercer mi fuerza de voluntad para resistir la dominación".
 POD_mesmerize.100.option.b:0 "Rechazar la dominación".
 POD_mesmerize.100.option.c:0 "Aceptar la dominación".
 
 POD_mesmerize.200.t:0 "Dominar [target.GetFirstNameNoTooltip]"
 POD_mesmerize.200.desc:0 "Mi voluntad domina a [target.GetTitledFirstName]. Pero [target.GetSheHe|U] se resiste a mí"
 POD_mesmerize.200.option.a:0 "Despierta la sangre para dominar a [target.GetHerHim]".
 POD_mesmerize.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] es hábil en la [disciplina|E] de la fortaleza y se resiste a tus poderes."
 POD_mesmerize.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] ha ejercido [target.GetHerHis] voluntad para resistir tus poderes."
 POD_mesmerize.200.a.success.desc:0 "Victoria"
 POD_mesmerize.200.a.tt_success:0 "[target.GetTitledFirstName] te concederá un favor."
 POD_mesmerize.200.a.failure.desc:0 "Derrota"
 POD_mesmerize.200.a.tt_failure:0 "[target.GetTitledFirstName] se resistirá a tu dominación".
 POD_mesmerize.200.option.b:0 "Despierta la sangre y ejerce mi voluntad. Yo soy el amo".
 POD_mesmerize.200.option.b.tt.beast:0 "#R ¡Soy el amo! #"
 POD_mesmerize.200.option.c:0 "Esto es una pérdida de tiempo, ya no deseo dominar a [target.GetHerHim]."
 POD_mesmerize.200.option.c.tt:0 "La dominación fracasará".

 POD_mesmerize.300.t:0 "[target.GetFirstNameNoTooltip] Hipnotizado"
 POD_mesmerize.300.desc:0 "Mediante el uso de mi dominación [disciplina|E], [target.GetTitledFirstName] seguirá mi orden. \N - Sugerencia: para usar tu orden, usa la interacción con el personaje de Marioneta de Comando."
 POD_mesmerize.300.desc.short_term:0 "\N- Como no tienes la cualidad de directiva sumergida, sólo tienes unos días para usar tu comando."
 POD_mesmerize.300.option.a:0 "Ahora, ¿qué quiero que haga [target.GetHerHim]?"
 POD_mesmerize.300.option.a.tt.beast:0 "¡Sangre! ¡Queremos sangre! #"

 POD_mesmerize.400.t:0 "Una deuda que no puedo rechazar"
 POD_mesmerize.400.desc:0 "Estoy en deuda con [schemer.GetTitledFirstName]" 
 POD_mesmerize.400.option.a:0 "¿Cómo voy a compensar a [schemer.GetHerHim]?"
 
 POD_mesmerize.500.t:0 "Resistió la dominación"
 POD_mesmerize.500.desc:0 "[target.GetTitledFirstName] se ha resistido a mi dominación" 
 POD_mesmerize.500.option.a:0 "¡Esto no puede ser!"
 POD_mesmerize.500.option.a.tt.beast:0 "#¡Golpéalos hasta que obedezcan! #"

 POD_mesmerize.600.t:0 "Dominación resistida"
 POD_mesmerize.600.desc:0 "Me he deshecho de los grilletes mentales de la dominación de [schemer.GetTitledFirstName]". 
 POD_mesmerize.600.option.a:0 "¡Tengo una voluntad de hierro!"

 POD_mesmerize.700_toast_title:0 "Dominación expirada"
 POD_mesmerize.700_toast_ct:0 "Debes iniciar un nuevo esquema si deseas comandar [target.GetName]".

