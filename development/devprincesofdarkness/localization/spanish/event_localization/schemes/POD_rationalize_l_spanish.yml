l_spanish:

 POD_rationalize.100.t:0 "Estás siendo dominado"
 POD_rationalize.100.desc:0 "[schemer.GetTitledFirstName] te está dominando para exigirte un favor".
 POD_rationalize.100.option.a:0 "Ejercer mi fuerza de voluntad para resistir la dominación".
 POD_rationalize.100.option.b:0 "Rechazar la dominación".
 POD_rationalize.100.option.c:0 "Aceptar la dominación".
 
 POD_rationalize.200.t:0 "Dominar [target.GetFirstNameNoTooltip]"
 POD_rationalize.200.desc:0 "Mi voluntad domina a [target.GetTitledFirstName]. [target.GetSheHe|U] se resiste a mi dominación "
 POD_rationalize.200.option.a:0 "Despierta la sangre para dominar a [target.GetHerHim]".
 POD_rationalize.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] es hábil en la disciplina de la fortaleza y se resiste a tus poderes."
 POD_rationalize.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] ha ejercido [target.GetHerHis] voluntad para resistir tus poderes."
 POD_rationalize.200.a.success.desc:0 "Victoria"
 POD_rationalize.200.a.tt_success:0 "[target.GetTitledFirstName] racionalizará la concesión de un favor."
 POD_rationalize.200.a.failure.desc:0 "Derrota"
 POD_rationalize.200.a.tt_failure:0 "[target.GetTitledFirstName] se resistirá a tu dominación."
 POD_rationalize.200.option.b:0 "Despierta la sangre y ejerce mi voluntad. Yo soy el amo".
 POD_rationalize.200.option.b.tt.beast:0 "#R ¡Soy el amo! #"
 POD_rationalize.200.option.c:0 "Esto es una pérdida de tiempo, ya no deseo dominar a [target.GetHerHim]".
 POD_rationalize.200.option.c.tt:0 "La dominación fracasará".

 POD_rationalize.300.t:0 "[target.GetFirstNameNoTooltip] Racionalizado"
 POD_rationalize.300.desc:0 "Mediante el uso de mi disciplina de dominación, [target.GetTitledFirstName] racionalizará me debe un favor."
 POD_rationalize.300.option.a:0 "Ahora, ¿qué quiero que haga [target.GetHerHim]?"
 POD_rationalize.300.option.a.tt.beast:0 "¡Sangre! ¡Queremos sangre! #"

 POD_rationalize.400.t:0 "Una deuda que no puedo rechazar"
 POD_rationalize.400.desc:0 "Debo [schemer.GetTitledFirstName]" 
 POD_rationalize.400.option.a:0 "¿Cómo voy a compensar a [schemer.GetHerHim]?"
 
 POD_rationalize.500.t:0 "Resistió la dominación"
 POD_rationalize.500.desc:0 "[target.GetTitledFirstName] se ha resistido a mi dominación" 
 POD_rationalize.500.option.a:0 "¡Esto no puede ser!"
 POD_rationalize.500.option.a.tt.beast:0 "#¡Golpéalos hasta que obedezcan! #"

 POD_rationalize.600.t:0 "Dominación resistida"
 POD_rationalize.600.desc:0 "Me he deshecho de los grilletes mentales de la dominación de [schemer.GetTitledFirstName]". 
 POD_rationalize.600.option.a:0 "¡Tengo una voluntad de hierro!"

 

