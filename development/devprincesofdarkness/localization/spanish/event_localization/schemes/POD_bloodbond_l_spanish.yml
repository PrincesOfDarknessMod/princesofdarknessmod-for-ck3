l_spanish:

 POD_bloodbond.100.t:0 "Ataduras de sangre"
 POD_bloodbond.100.desc:0 "[schemer.GetTitledFirstName] está intentando ligarte con sangre".
 POD_bloodbond.100.option.a:0 "Ejercer mi fuerza de voluntad para resistir el bloodbond".
 POD_bloodbond.100.option.b:0 "Rechazar el bloodbond".
 POD_bloodbond.100.option.c:0 "Aceptar el vínculo de sangre".
 
 POD_bloodbond.200.t:0 "Vinculación de sangre [target.GetFirstNameNoTooltip]"
 POD_bloodbond.200.desc:0 "El esquema está en marcha para unir con sangre a [target.GetTitledFirstName], pero [target.GetSheHe] se resiste."
 POD_bloodbond.200.option.a:0 "Despierta la sangre para unir con sangre a [target.GetHerHim]".
 POD_bloodbond.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] ha ejercido su voluntad para resistirse a ser unido por sangre."
 POD_bloodbond.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] es hábil en la disciplina de la fortaleza y es resistente a tu manipulación."
 POD_bloodbond.200.a.success.desc:0 "Victoria"
 POD_bloodbond.200.a.tt_success:0 "[target.GetTitledFirstName] se unirá a mí con un vínculo de sangre."
 POD_bloodbond.200.a.failure.desc:0 "Derrota"
 POD_bloodbond.200.a.tt_failure:0 "[target.GetTitledFirstName] se ha resistido a mi intento de unión sanguínea."
 POD_bloodbond.200.option.b:0 "Despierta la sangre y ejerce mi voluntad. No se me negará".
 POD_bloodbond.200.option.b.tt.beast:0 "#R [target.GetSheHe|U] debe amarnos! #"
 POD_bloodbond.200.option.c:0 "Abandona este esfuerzo, ya no deseo unirme a la sangre de [target.GetHerHim]."
 POD_bloodbond.200.option.c.tt:0 "El bloodbond fallará".
 POD_bloodbond.200.option.c.tt.beast:0 "#R ¡Deberíamos estar sacando sangre, no dándola! #"
 
 POD_bloodbond.300.t:0 "[target.GetFirstNameNoTooltip] bloodbonded"
 POD_bloodbond.300.desc:0 "[target.GetTitledFirstName] se ha unido a mí con sangre".
 POD_bloodbond.300.option.a:0 "Es como debe ser".
 POD_bloodbond.300.option.a.tt.beast:0 "#R Ahora, ¿qué hacer con ellos? #"

 POD_bloodbond.400.t:0 "Has sido vinculado a la sangre"
 POD_bloodbond.400.desc:0 "Habiendo bebido la sangre de [schemer.GetTitledFirstName], estás atado a [schemer.GetHerHim]". 
 POD_bloodbond.400.option.a:0 "Haré la voluntad de [schemer.GetHerHis]".
 
 POD_bloodbond.500.t:0 "Resistirse a la unión de sangre"
 POD_bloodbond.500.desc:0 "[target.GetTitledFirstName] se ha resistido a mi intento de bloodbond [target.GetHerHim]". 
 POD_bloodbond.500.option.a:0 "¡Frustrado!"
 POD_bloodbond.500.option.a.tt.beast:0 "#R ¡Consigamos más sangre y volvamos a intentarlo! #"

 POD_bloodbond.600.t:0 "Resistencia a la unión de sangre"
 POD_bloodbond.600.desc:0 "[schemer.GetTitledFirstName] ha abandonado el plan de [schemer.GetTitledHerHis] para unirte a la sangre." 
 POD_bloodbond.600.option.a:0 "¡No seré [schemer.GetTitledHerHis] esclavo de sangre!"

 

