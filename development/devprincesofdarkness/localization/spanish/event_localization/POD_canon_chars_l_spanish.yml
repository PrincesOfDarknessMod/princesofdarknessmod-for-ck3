l_spanish:

 PODcanon_chars.1.t:0 "Nuevos comienzos"
 PODcanon_chars.1.desc:0 "Por fin está hecho. La tonta, Menele de Esparta, ha muerto y tú eres, por primera vez en milenios, libre de hacer lo que quieras. La victoria se siente más... vacía de lo que hubieras pensado, ya que de repente has perdido lo que ha sido tu propósito en la no-vida... pero seguirás adelante, como siempre lo haces.\NEl mundo te ha olvidado, e incluso los más viejos Toreador te consideran un mito en este momento. Esto podría jugar a tu favor. Es hora de volver al mundo de la política cainita, un mundo que conoces muy bien, pero con una clara ventaja: nadie importante sospecha siquiera de tus verdaderos poderes.\NEsta es una baza que te resultará muy útil, y que pretendes conservar el mayor tiempo posible..."
 PODcanon_chars.1.a:0 "Mi ascensión puede comenzar por fin"
 PODcanon_chars.helena:0 "Has desbloqueado una nueva interacción de personaje sobre los gobernantes extranjeros: Infiltrar"
 PODcanon_chars.2.t:0 "Despertar de un Dios"
 PODcanon_chars.2.desc:0 "Por fin está hecho. Casi has completado el ritual para invocar a Svantevit en un huésped dispuesto. No puedes esperar a sentir el poder de un Dios fluyendo a través de tus venas eternas! Hay un pequeño problema, sin embargo, durante tu investigación, encontraste que la mente del anfitrión se supone que debe ser borrada por la llegada de Svantevit. Obviamente, tienes una fuerte voluntad y no te rendirías tan fácilmente como algunos de los idiotas cultistas que aplastaste, pero... esto sigue siendo preocupante.\NEl simple hecho de descifrar el ritual ya te ha enseñado mucho, y podría ser una recompensa suficiente en sí misma.\NO podrías invocar a un Dios y tratar de doblegarlo a tu voluntad. La elección es tuya... quizás por última vez".
 PODcanon_chars.2.a:0 "¡Poder definitivo!"
 PODcanon_chars.2.b:0 "...no lo siento"
 PODcanon_chars.3.t:0 "Romance de los dioses"
 PODcanon_chars.3.desc:0 "Ella ha vuelto.\NLa amada hija de Isis se ha unido de nuevo a tu lado, y una ráfaga de emociones conflictivas se precipita hacia ti. Lo que tuvisteis esta vez fue apasionado, aunque fugaz. Tal vez vuestra historia resista mejor la prueba del tiempo ahora que ambos sois mayores y, con suerte, más sabios.\NComo mínimo, será interesante, sobre todo porque tus vasallos ya están refunfuñando a tus espaldas. Kemintiri nunca fue la figura más popular entre ellos.\NPero no te importa. Ha vuelto y parece que merece la pena volver a vivir, ojalá sea por mucho tiempo".
 PODcanon_chars.3.a:0 "Rehagamos esta tierra a nuestra imagen"
 PODcanon_chars.mithras:0 "Has desbloqueado una nueva decisión importante programada"
 PODcanon_chars.4.t:0 "Prueba de guerra"
 PODcanon_chars.4.desc:0 "Has planeado una sucesión de escaramuzas rápidas y decisivas contra este rebelde vasallo tuyo. Si consigues la victoria, estarás a salvo de la rebelión, de ésta al menos, durante un tiempo.\NSin embargo, más vale que te asegures antes de lanzar el ataque, si pierdes, las consecuencias serán peores que no intentar tal acción..."
 PODcanon_chars.4.a:0 "¡Adelante con la victoria!"
 PODcanon_chars.4.b:0 "Esta noche no es la noche"
 PODcanon_chars.4.effect.success.desc:0 "La victoria romperá el espíritu vasallo durante un tiempo"
 PODcanon_chars.4.success:0 "¡Victoria!"
 PODcanon_chars.4.critical.failure.effect.desc:0 "Perder envalentonará el espíritu rebelde del vasallo"
 PODcanon_chars.4.failure:0 "Derrotado..."
 PODcanon_chars.5.t:0 "Mirando a la pirámide"
 PODcanon_chars.5.desc:0 "Es hora de que utilices tu legítimo poder como maestro del clan Tremere para hacer algo de política hermética a la antigua. Ya que estás en la cima de la pirámide, ganarás al final, es sólo una cuestión de lo que ganarás específicamente con ello.|¡Tantas opciones con tan pocas consecuencias! Excepto molestar a los de abajo, obviamente. No es que importe mucho".
 PODcanon_chars.5.a:0 "Robar las ideas de otro"
 PODcanon_chars.5.b:0 "Culpar a otro de tus fracasos"
 PODcanon_chars.5.c:0 "Requisar de las arcas del clan"
 PODcanon_chars.5.d:0 "No estoy de humor para la política"
 PODcanon_chars.6.t:0 "Recompensas de Alamut"
 PODcanon_chars.6.desc:0 "Los dirigentes de los Hijos de Haqim están satisfechos por el progreso de la Media Luna en Iberia. Te envían sus saludos y felicitaciones, junto con refuerzos, prometiendo neonatos de las castas visir, hechicero y guerrero.\NTu trabajo aún no ha terminado, pero la presión sobre ti es ahora menos aplastante, pues parece que por fin confían en que tienes en mente el mejor interés del clan. Incluso quizás haciendo de Iberia una futura gran fortaleza digna del propio Haqim".
 PODcanon_chars.6.a:0 "Soy la comidilla de la década en Alamut"
 PODcanon_chars.7.t:0 "Parcelas dentro de parcelas"
 PODcanon_chars.7.desc:0 "Has conseguido saber más sobre este potencial enemigo. Siempre es una sensación extrañamente reconfortante para ti, Príncipe Roque, ya que te encanta ser más astuto que tus enemigos y enredarlos en una red de tramas improbables.\NAún así, a veces no maquinas sólo por maquinar. Podrías aprovechar la información que obtuviste para conspirar aún más".
 PODcanon_chars.7.a:0 "¡Comienza más conspiraciones contra este!"
 PODcanon_chars.7.b:0 "La intriga es un pasatiempo tan relajante..."
 PODcanon_chars.7.c:0 "¡Que todo el mundo conozca el alcance de tus habilidades intrigantes!"
 PODcanon_chars.8.t:0 "Haciendo olas"
 PODcanon_chars.8.desc:0 "Lord Montano, con el regreso de la mayor parte de Italia bajo tu control, demostró al clan Lasombra que sigue siendo un gobernante eficaz y decisivo. Obviamente, todavía queda mucho por hacer para restaurar el lugar adecuado del Mar de las Sombras en el mundo mediterráneo, pero, al menos, tu posición como jefe del clan ya no está en disputa.\nAhora que puedes hacerlo. Utilíza el poder para reclamar el poder sobre cualquier principado Lasombra descarriado."
 PODcanon_chars.8.desc:0 "Señor Montano, con el regreso de la mayor parte de Italia bajo tu control, has demostrado al clan Lasombra que sigues siendo un gobernante eficaz y decisivo. Obviamente, aún queda mucho por hacer para restaurar el lugar que le corresponde al Mar de las Sombras en el mundo mediterráneo, pero, al menos, tu posición como jefe del clan ya no es discutida.
 PODcanon_chars.8.a:0 "Puedo hacerlo aún mejor"
 PODcanon_chars.montano:0 "Ahora tienes una bonificación especial a la aceptación de la interacción "Ofrecer vasallaje" con cualquier gobernante Lasombra"
 PODcanon_chars.9.t:0 "Un abrazo cariñoso"
 PODcanon_chars.9.desc:0 "Es difícil resistirse a ti cuando pones tu mente en algo, hermosa Maatkare, pero los cainitas son criaturas obstinadas. Si has de mostrarle a éste el amor de Set, se necesitarán todas tus considerables habilidades de persuasión y seducción para lograrlo.\NSiempre existe el riesgo de fracasar, lo que te costaría bastante a los implacables ojos de Set..."
 PODcanon_chars.9.a:0 "La gloria de Set no puede esperar"
 PODcanon_chars.9.b:0 "Esta noche no es la noche"
 PODcanon_chars.9.effect.success.desc:0 "Ganar hará que este personaje se convierta a Vía Set"
 PODcanon_chars.9.success:0 "¡Alabado sea Set!"
 PODcanon_chars.9.critical.failure.effect.desc:0 "Perder te costará bastante"
 PODcanon_chars.9.failure:0 "He fallado..."
 PODcanon_chars.10.t:0 "Caminando por la espiral negra"
 PODcanon_chars.10.desc:0 "Has visto a esos "Bailarines de la Espiral Negra", están completamente locos, incluso para tus flojos estándares. ¿Merece la pena la ínfima posibilidad de una respuesta a tu dolor? Lo único que se puede decir con seguridad es que no serás el mismo una vez que vuelvas de este lugar maldito..."
 PODcanon_chars.10.a:0 "Ya no hay vuelta atrás"
 PODcanon_chars.10.b:0 "Esto es una muy muy mala idea"
 PODcanon_chars.petaniqua:0 "Es más que probable que vuelvas de aquí peor de lo que empezaste. Pero puede haber una pequeña esperanza de algo que valga la pena..."
 PODcanon_chars.11.t:0 "La locura de la espiral negra"
 PODcanon_chars.11.desc:0 "La gente cree que has vuelto de la Espiral Negra relativamente sin cambios. Pero tú lo sabes mejor, nunca volviste de ella. Está contigo ahora. Y estas... cosas que viste nunca saldrán de tu visión. Tal vez el mundo entero es simplemente una extensión de ella. O simplemente estás demasiado lejos para que te importe. No quieres volver allí. ¿O sí?"
 PODcanon_chars.11.a:0 "Ya no hay luz"
 PODcanon_chars.12.t:0 "Claridad de la espiral negra"
 PODcanon_chars.12.desc:0 "No recuerdas mucho de tu viaje en la Espiral Negra, lo cual es... probablemente lo mejor. No has encontrado verdades ocultas, ni sórdidos horrores. Si lo hubieras hecho, tendrías algunos recuerdos de ellos, ¿no? De todos modos, a pesar de lo que podría llamarse un contratiempo, te sientes aliviado de haber salido de allí. El mundo exterior parece extrañamente agradable ahora".
 PODcanon_chars.12.a:0 "Podría haber sido peor"
 PODcanon_chars.13.t:0 "Fuerza de la Espiral Negra"
 PODcanon_chars.13.desc:0 "No hay duda de que la Espiral Negra es un lugar de absoluta locura. Pero has pasado por tanto en tu vida, y sin vida, que no te ha destrozado esta vez. Has vencido tus miedos, y "eso" ha quedado satisfecho con tu actuación.\NA pesar de esta demostración de fuerza, admitirás estar contento de volver a unirte al mundo exterior. No ha sido ni mucho menos una experiencia relajante..."
 PODcanon_chars.13.a:0 "No me asusto fácilmente"
 PODcanon_chars.14.t:0 "Regalo de la espiral negra"
 PODcanon_chars.14.desc:0 "Lo has encontrado.\NQuizás la Espiral Negra se apiadó de ti, o quedó impresionada por tu dedicación. Tal vez sea sólo un sueño, una fantasía de tu mente rota. No te importa. Él está contigo ahora, y todo estará bien una vez más".
 PODcanon_chars.14.a:0 "Estás destinado a ser el Rey del mundo"
 podintroductions.116.t:0 "Tu historia hasta ahora"
 PODcanon_chars.petaniqua2:0 "No tienes motivos para caminar por la Espiral Negra a partir de ahora"
 podintroductions.116.desc:0 "Señor Hardestadt, su ascenso político ha sido nada menos que brillante hasta ahora. A partir de un linaje envuelto y una posición fronteriza, has conseguido utilizar con pericia el ascenso del mortal Sacro Imperio Romano para recentrar a [Clan|E] Ventrue de Roma a Alemania.\NAún así, los viejos hábitos son difíciles de cambiar y has tenido que trabajar con Julia Antasia, la líder de las reliquias romanas, para llegar a este punto. Puede que sea el momento de "renegociar" su asociación y poner estos antiguos polvorientos en un museo donde pertenecen.\NTienes fuertes aliados y leales hijos, mantenlos cerca y atentos a su posición y la historia será tuya para escribirla."
 podintroductions.116.a:0 "Alemania es el futuro"
 podintroductions.hardestadt:0 "Como Hardestadt, tienes acceso a una interacción de carácter especial con tus childer para frenarlos."
 
 pressure_on_modifier:0 "Presión sobre"
 pressure_on_modifier_desc:0 "Este personaje está bajo presión para dar lo mejor de sí mismo."
 
 PODcanon_chars.15.t:0 "Apretando las riendas"
 PODcanon_chars.15.desc:0 "Tu hijo respondió a tu llamada, ansioso por escuchar tus deseos. Tienes fama de ser un [Sire|E] estricto, de los que no toleran fácilmente el fracaso. Sin embargo, nadie puede negar que tus elecciones educativas han dado como resultado algunos de los neonatos más dotados de su generación. Los demás, bueno... no suelen empañar su reputación por mucho tiempo".
 PODcanon_chars.15.a:0 "¡Hazlo mejor!"
 PODcanon_chars.15.b:0 "Nunca estés satisfecho"
 PODcanon_chars.15.c:0 "¡Eres un fracaso inútil!" 
 PODcanon_chars.hardestadt_tooltip:0 "Mientras este personaje siga siendo un rival, no podrás volver a invocarlo"
    
 POD_hardestadt_interaction:0 "Aprieta las riendas"
 POD_hardestadt_interaction_desc:0 "Convoca a tu childe para una charla"
 
 podintroductions.117.t:0 "Su historia hasta ahora"
 podintroductions.117.desc:0 "Lady Antasia, te mantienes fuerte en tu hogar exiliado en Alemania, pero tu corazón anhela un regreso triunfal a Roma. El [Clan|E] Ventrue ha caído mucho desde sus nobles raíces en el Senado Eterno, y tú eres la única que puede impedir que Hardestadt y Camilla conviertan a tu amado [Clan|E] en una burla de sí mismo.\NSin embargo, este esfuerzo llevará tiempo, pero recientemente has encontrado un sorprendente aliado en tu búsqueda. El Nosferatu Angiwar es un hombre extraño, aficionado a los cuentos fantásticos, pero ya ha demostrado ser un amigo digno y un campeón aún más digno para tu causa. Con vuestro poderío combinado, aún hay esperanza para los verdaderos ideales de Roma".
 podintroductions.117.a:0 "El Senado no caerá"
 podintroductions.antasia:0 "Como Julia Antasia, tienes acceso a una interacción especial del personaje con Angiwar mientras sigáis siendo amigos."
  
 POD_antasia_interaction:0 "Charla amistosa"
 POD_antasia_interaction_desc:0 "Invita a Angiwar a una charla amistosa"
  
 PODcanon_chars.16.t:0 "Angiwar el contador de historias"
 PODcanon_chars.16.desc:0 "Cuando le conociste, esperabas que Angiwar tuviera una visión de tu abuelo, el propio Ventrue. Lamentablemente, no fue así, ya que incluso un ser tan antiguo como él nunca se encontró con un [antediluviano|E]. Aun así, el Nosferatu tiene muchas historias que contar sobre el mundo [cainita|E], algunas de las cuales incluso le cuesta creer.|nAngiwar no se molesta, sin embargo, y se alegra de compartirlas contigo. Obtener una visión tan amistosa y libre de engaños de un vampiro tan antiguo, aunque estrafalario, es una bendición que no pretende estropear."
 PODcanon_chars.16.a:0 "¿De verdad? Eso es increíble".
 
 PODcanon_chars.17.t:0 "Angiwar el confiado"
 PODcanon_chars.17.desc:0 "Angiwar está tranquilo esta noche y parece feliz de sólo prestar atención a tus problemas. En el mundo [cainita|E], es raro que alguien pueda confiar en otro sin temor a que le engañen o le manipulen. Pero tú te sientes a gusto con el viejo Nosferatu, sabiendo que vuestros objetivos están estrechamente alineados. No es una pequeña bendición para ti tener este lujo, y el sueño de las edades parece un poco menos tentador cada vez que pasas tiempo con él."
 PODcanon_chars.17.a:0 "La amistad es un activo valioso"
 
 PODcanon_chars.18.t:0 "Angiwar el guerrero"
 PODcanon_chars.18.desc:0 "Angiwar está agitado esta noche, hablando de la grave amenaza a la que se enfrenta su [Clan|E] : los Nictuku. Ya le has visto así antes y, aunque no sabes nada de lo que habla, prefieres seguirle la corriente. Incluso cuando de repente te pide un duelo de entrenamiento entre vosotros dos para estar "preparados cuando vengan". No todas las noches se puede hacer un sparring con un guerrero tan experimentado y seguro que podrás aprender un par de cosas".
 PODcanon_chars.18.a:0 "Estaremos preparados"
 podintroductions.118.t:0 "Su historia hasta ahora"
 podintroductions.118.desc:0 "Lord Alexander, una vez fuiste el Ventrue más importante del mundo, susurrando al oído del mismísimo Carlomagno. Ahora estás exiliado de tu amada Francia por la maldita Salianna y tu traidor hijo Geoffrey. Volverás, pero otros asuntos requieren tu atención.\NEl Señor Jurgen von Verden, tu anfitrión en este momento, ha reunido una pequeña fuerza para ayudarte, cumpliendo con su deber como compañero de clan más joven. Aceptarlo sería de gran ayuda, pero también significaría que básicamente estás cayendo en la mendicidad de la ayuda. Rechazarla sería más acorde con tu posición... pero sin duda enfadaría al Príncipe de Magdeburgo. Toma la decisión correcta aquí, y podría ser el primer peldaño para tu regreso triunfal al mundo [cainita|E] en general".
 podintroductions.118.a:0 "Se agradece la ayuda, señor Jurgen"
 podintroductions.118.b:0 "¡Un Rey no mendiga!" 
 alexander_black_cross_event_troops:0 "Necrófagos de la Cruz Negra"
    
 alexander_help_modifier:0 "Bien conectados"
 alexander_help_modifier_desc:0 "Se dicen cosas buenas de ti en las altas esferas, gracias a la ayuda de un poderoso mecenas."
   
 podintroductions.119.t:0 "Tu historia hasta ahora"
 podintroductions.119.desc:0 "Señor Jurgen, su ascensión ha progresado a una velocidad impresionante desde su [Abrazo|E]. Pero el reciente revés en la guerra contra el Voivodato ha reducido tu influencia. Sin embargo, ha surgido una nueva oportunidad, con la llegada del exiliado Príncipe de Francia, Alexander, a tu corte.|nHas sido un perfecto anfitrión hasta ahora y seguir haciéndolo sería beneficioso para tus ambiciones, ya que Alexander todavía tiene mucha gravitación en el [Clan|E]. Pero el poderoso Ventrue no ha venido solo, sino que también ha traído consigo a Rosamund de Islington, la más bella entre el [Clan|E] y la que te ha robado el corazón.\NHas confesado recientemente tus sentimientos a la dama, pero parece que el propio Alexander tiene los ojos puestos en ella. Por lo tanto, hay que hacer una elección..."
 podintroductions.119.a:0 "Amor..."
 podintroductions.119.b:0 "...o el poder?" 
 jurgen_love_tooltip:0 "Rosamund se unirá a ti en la corte, confiando sus tierras a tu cuidado".
   
 podintroductions.120.t:0 "Su historia hasta ahora"
 podintroductions.120.desc:0 "¡Ave poderosa Camilla, antaño dueña indiscutible de Roma y del [Clan|E] Ventrue!\N-En estos benditos tiempos todos se inclinaron ante ti, la infernal Cartago fue destruida bajo tu mando y todo fue perfecto hasta que caíste en el [torpor|E]. Obviamente, nadie fue capaz de recuperar tu manto y el Imperio cayó contigo. Recientemente has despertado a este nuevo mundo, tan diferente al que conocías... pero aún lleno de oportunidades.\NReafirmar tu control sobre tu amada Roma fue fácil, pero ahora te esperan retos mayores.\NEres el Cónsul Eterno del Pecado y tu futuro sólo puede ser de gloria inmortal y placeres decadentes."
 podintroductions.120.a:0 "Roma Aeterna"
 podintroductions.camilla:0 "Como Camilla, tienes un evento especial, más beneficioso y probable, durante la actividad "Host Elysium"."
   
 POD_elysium_events.25.t:0 "Festeja como un romano"
 POD_elysium_events.25.desc:0 "Además de ser uno de los Ventrue más poderosos y un astuto animal político, también eres conocido como el mejor anfitrión de fiestas de toda la raza [cainita|E]. Después de todo, fuiste el pionero de todo el concepto durante el Imperio Romano y sabes exactamente cómo proceder.|nLa sangre fluirá, todo el mundo lo pasará fantásticamente y una pequeña parte de lo que hizo a Roma tan grande sobrevivirá esta noche gracias a tu cuidadosa planificación."
 POD_elysium_events.25.option.a:0 "¡Que empiece la fiesta!"
    
 anna_ambition_modifier:0 "Ambición ardiente"
 anna_ambition_modifier_desc:0 "Anna no se detendrá ante nada para conseguir su derecho de nacimiento. Puedes ayudarla o ser apartado, no hay término medio".
 
 podintroductions.121.t:0 "Su historia hasta ahora"
 podintroductions.121.desc:0 "Noble dama, vienes del mayor linaje griego y Constantinopla es tuya por derecho, ni siquiera el hecho de convertirte en vampiro cambió ese hecho. Te adaptaste bastante bien a tu nueva condición y estabas ascendiendo rápidamente en la jerarquía bizantina cuando ocurrió la 4ª Cruzada. Con Miguel y el Sueño destruidos, y los vampiros latinos triunfantes, tu ciudad se aleja de nuevo de ti.\NNo obstante, no todo está perdido, ya que los latinos tienen problemas para consolidar su dominio, lo que te ha permitido ayudar al imperio sucesor de Nikaea a ponerse en marcha. Desde esta sólida base de poder, estás muy cerca de lograr tu eterna ambición... ¡Sigue adelante, hija de los emperadores, y cumple tu destino!"
 podintroductions.121.a:0 "Mi ciudad del deseo del mundo..."
 podintroductions.anna:0 "Para mejorar tu modificador inicial, puedes usar una decisión especial que te obliga a mantener Constantinopla"
anna_decision:0 "Nacido en la púrpura"
 anna_decision_tooltip:1 "Hay que acabar con la opresión latina".
 anna_decision_desc:0 "Constantinopla debe ser tuya, ahora más que nunca. La liberarás de la maldita Lasombra latina y luego comenzarás tu reinado eterno de la mayor ciudad del mundo."
 anna_decision_effect_tooltip:1 "Cumplirás tu ambición". 
 anna_decision_confirm:0 "¡Por fin!"
 
 anna_ambition_fulfilled_modifier:0 "Ambición cumplida"
 anna_ambition_fulfilled_modifier_desc:0 "Los Comnenos son ahora los gobernantes inmortales y eternos de Constantinopla. Como debe ser".
  
 podintroductions.122.t:0 "Su historia hasta ahora"
 podintroductions.122.desc:0 "Lady Anadja, su sencilla vida se ha visto sumida en el caos con la llegada de Belisario y Shabah a ella. Esos dos vampiros se encariñaron contigo y te enseñaron mucho sobre cómo sobrevivir en la sociedad nocturna... luego tu vida se volvió aún más extraña una vez que un culto apocalíptico secreto, el Manus Nigrum, anunció que tú eras su líder prometido.\NA pesar de todos estos sucesos, te ha ido bien hasta ahora y Armenia se ha convertido en un fuerte bastión bajo tu gobierno, atrayendo a miembros de este culto y a refugiados de Bizancio por igual. Tus "padres adoptivos" siguen aquí y son una ayuda inestimable para estabilizar tu nuevo reino, pero ahora es el momento de tomar el asunto en tus manos.\NHas sido tutelado por los mejores y muchos ya te consideran uno de los [cainitas|E] más importantes del mundo, pero tu historia es tuya y sólo tuya para escribirla."
 podintroductions.122.a:0 "Yo soy mi propio [cainita|E]"
 podintroductions.anadja:0 "Mientras Belisario y Shabah estén vivos, puedes pedir más tutoría a través de una decisión"
 
 anadja_decision:0 "Aprender de los mejores"
 anadja_decision_tooltip:1 "Siempre se puede mejorar"
 anadja_decision_desc:0 "Belisarius y Shabah siempre están encantados de ayudarte a mejorar, aunque sus lecciones pueden ser bastante agotadoras a veces."
 anadja_decision_effect_tooltip:1 "Va a comenzar una sesión de entrenamiento" 
 anadja_decision_confirm:0 "Estoy preparado"
 anadja_custom_decision:0 "Esta decisión no estará disponible cuando alcances 25 de marcialidad, 20 de diplomacia y 20 de intriga o si tanto Shabah como Belisarius mueren."
   
 PODcanon_chars.19.t:0 "Aprender de los mejores"
 PODcanon_chars.19.desc:0 "Belisario fue una vez un gran general en su vida mortal y luego se encargó de muchos asuntos militares para el [cainita|E] Sueño de Constantinopla. Hay mucho que aprender de él. Shabah, por su parte, es una experta espía y embajadora, a menudo ambas cosas a la vez, y puede enseñarte sobre esos temas. ¿Qué les preguntas esta noche?"
 PODcanon_chars.19.a:0 "Háblame de tus campañas militares, Belisario"
 PODcanon_chars.19.b:0 "La diplomacia es un tema complejo..."
 PODcanon_chars.19.c:0 "...quizás tan compleja como la intriga"
 PODcanon_chars.19.d:0 "He cambiado de opinión"

 shaky_secrets_modifier:0 "Secretos temblorosos"
 shaky_secrets_modifier_desc:0 "Saben que ocultas algo y quieren averiguarlo"
  
 shrouded_secrets_modifier:0 "Secretos envueltos"
 shrouded_secrets_modifier_desc:0 "Tus secretos están protegidos por una fina capa de sombras".
  
 darkened_secrets_modifier:0 "Secretos en la oscuridad"
 darkened_secrets_modifier_desc:0 "No te conocen en absoluto. Nadie lo hará nunca".
  
 secrets_secrets_modifier:0 "Secretos dentro de los secretos"
 secrets_secrets_modifier_desc:0 "Peones en un juego de mesa, jugados con maestría por tu mano".
  
 podintroductions.123.t:0 "Su historia hasta ahora"
 podintroductions.123.desc:0 "Sultán Badr, has asumido el control de la Media Luna y los acorralados [ashirra|E] se están uniendo sabiamente a ti. Toma nota de los que no lo hacen, para castigarlos más tarde.\NDebes respetar a la Reconquista Cristiana de las Sombras, ya que tanto de Ruiz como de su linaje son formidables oponentes, pero tu asunto más apremiante es el del secreto.\NOcultas muchas cosas a tus nuevos seguidores "leales", cosas que no quieres que encuentren a pesar de su insistencia. Utiliza tu dominio de las sombras y la intriga para esconderte tras un impenetrable velo de misterio antes de que sea demasiado tarde. Sólo entonces podrás desarraigar a los cristianos de Iberia".
 podintroductions.123.a:0 "La verdad es mía para darle forma"
 podintroductions.badr:0 "Tienes hasta el 1300 para usar una decisión especial que te permite mejorar tu modificador inicial"
   
 badr_decision:0 "Los misterios de Badr"
 badr_decision_tooltip:1 "Nunca deben saberlo"
 badr_decision_desc:0 "Como nuevo gobernante de la Media Luna, todas las miradas están puestas en ti. Debes esconderte bien antes de que sea demasiado tarde".
 badr_decision_effect_tooltip:1 "El misterio se profundiza". 
 badr_decision_decision_effect_tooltip:1 "El misterio se profundiza."
 badr_decision_confirm:0 "Nunca lo sabrán"
         
 podintroductions.124.t:0 "Su historia hasta ahora"
 podintroductions.124.desc:0 "Pío Suleiman, los tiempos son duros para los Fieles [ashirra|E]. Los despreciables cristianos Lasombra han declarado la guerra a tu pueblo, sumiendo a Iberia y al Magreb en el caos. Pero también hay problemas más cerca de casa. Tu otrora amigo Khalid está reuniendo tropas en Mesopotomia tras un violento desacuerdo contigo acerca de interferir, o no, en los asuntos de los mortales. Tu propio hijo, Haroun el-La'il, también ha hecho una apuesta por la independencia después de que su dogma herético haya sido revelado. Los [ashirra|E] necesitan la unidad ahora más que nunca y quizás haya que hacer concesiones para lograr este objetivo. Aunque una postura de línea dura también es una posibilidad..."
 podintroductions.124.a:0 "No habrá concesiones"
 podintroductions.124.b:0 "¡Khalid, tenemos amenazas más grandes de las que ocuparnos!"
 podintroductions.124.c:0 "Haroun, podemos hablar más de tus teorías..."
    
 podintroductions.125.t:0 "Tu historia hasta ahora"
 podintroductions.125.desc:0 "Intrépida Lucita, después de estar atrapada en el mundo de los mortales por ser mujer, ahora estás atrapada en el de los no-muertos por ser una Lasombra. Esto no puede continuar. Eres un espíritu libre, que anhela la independencia, y no vas a esperar los siglos necesarios para convertirte en anciana para conseguirlo.|nTu primer objetivo debería ser tu propio [Sire|E], Ambrosio Luis Moncada, un tonto que cree que puede controlarte. Luego, el propio [Clan|E] Lasombra debe entender que no eres su 'estrella emergente', eres tu propia mujer y esos idiotas decrépitos aprenderán a respetarte.\NEl caos que supone una Iberia sumida en la guerra civil de tu [Clan|E] será la oportunidad perfecta para que reclames tu propia grandeza. Sólo tienes que explotarla bien".
 podintroductions.125.a:0 "Vive libre o muere en el intento"
 podintroductions.lucita:0 "Como Lucita, tienes que conseguir una decisión especial para mejorar tu modificador inicial"
     
 caged_lucita_modifier:0 "Lucita, enjaulada"
 caged_lucita_modifier_desc:0 "Todavía no eres el héroe de tu propia historia, y eso te enfurece sobremanera"
    
 unleashed_lucita_modifier:0 "Lucita, desatada"
 unleashed_lucita_modifier_desc:0 "Tu propia historia ha comenzado por fin. Será una historia gloriosa".
     
 lucita_decision:0 "El destino de Lucita"
 lucita_decision_tooltip:1 "Se acerca tu hora"
 lucita_decision_desc:0 "Hay que acabar con los últimos grilletes que te mantienen retenida. Entonces, será el momento de atacar".
 lucita_decision_effect_tooltip:1 "¡Por fin ha ocurrido!" 
 lucita_decision_confirm:0 "¡Libre, por fin!"
 lucita_custom_decision:0 "Ambrosio Luis Moncada debe estar muerto"

 good_moncada_modifier:0 "Un mundo perfecto"
 good_moncada_modifier_desc:0 "Tanto si te quiere como si te odia, Lucita está viva. Su mundo está en perfecta armonía".
  
 podintroductions.126.t:0 "Su historia hasta ahora"
 podintroductions.126.desc:0 "Piadoso Moncada, Iberia está sumida en la confusión y Dios te ha llamado para que la salves. Tu [Sire|E], Silvestre de Ruiz, lidera oficialmente el esfuerzo cristiano pero tú eres el verdadero poder detrás del trono. Por ahora es útil, pero puede que quieras dar un paso hacia la luz en algún momento.|nY luego está Lucita... un ángel enviado por Dios para guiarte sin duda, aunque ella no se dé cuenta. Desde su [Abrazo|E], has sido el mejor de todos los tiempos, más agudo, más rápido, más fuerte. Ella aprenderá a apreciarte con el tiempo, pero hasta entonces, tienes que asegurarte de que se mantenga a salvo. Ni siquiera puedes digerir lo que sería de tu pobre alma si le pasara algo..."
 podintroductions.126.a:0 "Dios me ha concedido el mayor regalo"
 podintroductions.moncada:0 "Como Moncada, disfrutarás de este modificador mientras Lucita esté viva. Pero si ella muere..."
    
 PODcanon_chars.20.t:0 "El fin de tu mundo"
 PODcanon_chars.20.desc:0 "Está muerta.\NLucita, tu ángel guía, está muerta.\NYa no hay esperanza para ti. Probablemente no hay esperanza para el mundo también, ya que esto es claramente una prueba de que Dios ha renunciado incluso a sus siervos más fieles. ¿Puedes continuar con esta miserable vida? ¿Qué sentido tiene siquiera intentarlo?... quizás, quizás sea una prueba, como Dios ha hecho tantas veces antes. Si es así, será la más dura de toda tu existencia.\NQuizás aguantes, pero ni siquiera estás seguro de querer hacerlo".
 PODcanon_chars.20.a:0 "Ella se ha ido..."

 bad_moncada_modifier:0 "Un mundo roto"
 bad_moncada_modifier_desc:0 "Lucita ha muerto. Es una cáscara sin alma que sigue con su inútil falta de vida".
 podintroductions.127.t:0 "Su historia hasta ahora"
 podintroductions.127.desc:0 "Príncipe Alfonzo, tras siglos de espera, Constantinopla es por fin tuya. Sin embargo, ten cuidado, esos cobardes vampiros griegos huyeron cuando utilizaste hábilmente la 4ª Cruzada en tu beneficio y ahora están reuniendo sus tropas y agentes contra ti. Has doblado sabiamente la rodilla ante la Sede de las Sombras para obtener su protección mientras consolidas tu dominio. Un proceso temporal, por supuesto, ya que tienes mayores ambiciones que seguir siendo un mero vasallo.\NTe importa poco tu "fe" en la Herejía [cainita|E] y la cambiarías en un santiamén si fuera necesario, aunque todavía podría haber oportunidades de tenerla aferrándote a ella.\N-Expande el dominio latino y deshazte de los restos de Bizancio lo antes posible. Su ascensión no ha hecho más que empezar".
 podintroductions.127.a:0 "Se acerca un nuevo triunfo"
 podintroductions.alfonzo:0 "Como Alfonzo, eres el único que puede crear el Imperio Latino, mediante una decisión especial"
 
 alfonzo_decision:0 "El imperio de los latinos"
 alfonzo_decision_tooltip:1 "Es hora de ocuparse de los remanentes"
 alfonzo_decision_desc:0 "Eres el símbolo de la victoria de los latinos sobre los griegos. Abraza y utiliza esta imagen para forjar tú mismo un nuevo imperio".
 alfonzo_decision_confirm:0 "Bizancio ha muerto"

 bad_gratiano_modifier:0 "El advenedizo"
 bad_gratiano_modifier_desc:0 "Eres el hijo pelirrojo de la familia de Lasombra. Esto no ayuda en nada!"
  
 podintroductions.128.t:0 "Tu historia hasta ahora"
 podintroductions.128.desc:0 "Lord Gratiano, el poderoso Lasombra en persona vio tu grandeza y te abrazó en su [Clan|E]. Este acto enfureció a tus nuevos "hermanos" y desde entonces te han tachado de advenedizo, negándote las numerosas responsabilidades y títulos que deberían ser tuyos. Tienes que empezar de cero.|nPara ello, eliges Verona, una ciudad que conoces bien desde tus días de mortal, y el punto de apoyo se ha hecho pero... nada ha cambiado todavía. Todavía se ríen de ti, te insultan a tus espaldas, ¡incluso planean tu muerte! Esto debe terminar. Les mostrarás por qué Lasombra te eligió. Les mostrarás que Gratiano de Veronese nació para gobernar".
 podintroductions.128.a:0 "Ellos verán..."
 podintroductions.gratiano:0 "Para deshacerte del modificador inicial de Gratiano, debes completar una decisión especial."
   
 gratiano_decision:0 "Nacido para gobernar"
 gratiano_decision_tooltip:1 "Aprenderán"
 gratiano_decision_desc:0 "Demuestra a [Clan|E] Lasombra que eres algo más que la última mascota de papá. Consigue algo que deban tener en cuenta".
 gratiano_decision_confirm:0 "Han aprendido"
  
 podintroductions.129.t:0 "Su historia hasta ahora"
 podintroductions.129.desc:0 "Señor Sejanus, después de tu fatídico [Abrazo|E], estuviste a la deriva durante bastante tiempo en Europa buscando un lugar donde comenzar tu Imperio de la Noche. Tu ubicación actual es prometedora, aunque quizás demasiado cerca del poderoso Hardestadt. Tendrás que lidiar con él.\NTe aseguraste fácilmente el Principado sobre esta zona porque recibiste una ayuda muy inesperada. Un extraño tzimisce inglés llamado Jack ha quedado maravillado por ti y tus sueños y se ha comprometido con entusiasmo a tu servicio. Tras una breve investigación, crees que es digno de confianza y, de hecho, bastante capaz para ser un vampiro tan joven.\NEncontrar a un menor que reconoce tu grandeza siempre es gratificante, ¿quizás podrías recompensarlo con un papel importante en tu floreciente reino?"
 podintroductions.129.a:0 "Puedo hacer uso de ti"
 podintroductions.129.b:0 "¡No necesito ninguna ayuda!"
    
 podintroductions.130.t:0 "Tu historia hasta ahora"
 podintroductions.130.desc:0 "Lady Salianna, su golpe contra Alejandro fue un gran éxito y ahora controla por fin la mayor parte de Francia. Sin embargo, tuviste que hacer algunas concesiones para lograrlo, sobre todo con el hijo de Alejandro, Geoffrey du Temple, que obtuvo el propio París como recompensa. Si quieres afianzar realmente tu dominio sobre el país, necesitarás la prestigiosa capital en tus manos.\NGeoffrey es joven y crédulo, pero tiene muchos amigos que podrían ser problemáticos. Tendrás que andarte con cuidado para burlarlo sin derramar sangre innecesariamente".
 podintroductions.130.a:0 "Es hora de replantearse nuestra asociación"
 salianna_intro_tooltip:0 "En los próximos días tendrás algunos acontecimientos que consideren tu relación con Geoffrey"
    
 PODcanon_chars.21.t:0 "Superando a Geoffrey"
 PODcanon_chars.21.desc:0 "Para empezar con tu plan para conseguir París, tendrás que aislar a Geoffrey. Su red de agentes y contactos no es tan fuerte pero, como Ventrue, representa un gobernante de Francia más "legítimo" para algunos de tus súbditos que tú. Con algunos sobornos y amenazas veladas podrías cambiar este estado de cosas. Seguramente, comprenderán fácilmente que serías mucho mejor Príncipe de París que un insensato señor de la guerra".
 PODcanon_chars.21.a:0 "Fácil de hacer"
 PODcanon_chars.21.b:0 "Dejaré que Geoffrey conserve su premio"
 salianna_exit_tooltip:0 "Abandonas el plan para quedarte con París"

 PODcanon_chars.22.t:0 "Manejo de los aliados de Geoffrey"
 PODcanon_chars.22.desc:0 "Te deshaces fácilmente de la mayoría de los partidarios provisionales de Geoffrey, excepto de dos de ellos. Isouda de Blaise, la reina de Anjou, ha dado a conocer su desaprobación, pero... ya te odia, así que ¿a quién le importa de todos modos?\NMás problemática es la terquedad de François d'Alencourt. El poderoso príncipe de Lyon se ha comprometido con la causa de Geoffrey y no va a abultar. Si continúa con su curso de acción, se ganará un nuevo y poderoso enemigo".
 PODcanon_chars.22.a:0 "Uno más o uno menos..."
 PODcanon_chars.22.b:0 "Dejaré que Geoffrey se quede con su premio"
 
 PODcanon_chars.23.t:0 "Una vez más, París"
 PODcanon_chars.23.desc:0 "Has terminado tus preparativos y ya estás listo para expulsar, sin demasiados aspavientos, a Geoffrey de París. La ciudad servirá como una poderosa capital para tu Corte del Amor y asegurará la superioridad de Toreador en Francia durante generaciones.\NEl último asunto a resolver es el propio Geoffrey. Sin París, está casi desdentado y podrías dejarlo de lado si crees que ya no es útil. O puedes tenerlo a mano para otra tarea en el futuro. En cualquier caso, es obvio que no tiene nada que decir al respecto".
 PODcanon_chars.23.a:0 "Seré clemente en la victoria"
 PODcanon_chars.23.b:0 "No me sirven las ancillas petulantes"
 
 podintroductions.131.t:0 "Su historia hasta ahora"
 podintroductions.131.desc:0 "Dama Isouda, durante el caos de la caída de Alejandro, fuiste derrotada en la línea de meta por el liderazgo de las Cortes del Amor por Salianna. Sin embargo, este no ha de ser el final de tu carrera. Tu dominio sobre Anjou sigue siendo fuerte, y Salianna es vulnerable mientras su poder no se consolide.\NTendrás necesidad de ayuda para las futuras batallas, ya sean políticas o militares. Afortunadamente, sabes cómo "educar" a tus hijos y deshacerte de los débiles inútiles. Utiliza esto a tu favor y Francia podría ser finalmente tuya".
 podintrotions.131.a:0 "La guerra no ha terminado"
 podintroductions.131.a:0 "la guerra no ha terminado"
 isouda_intro_tooltip:0 "Como Isouda tienes una gratificante, aunque arriesgada, posibilidad especial de educar a tus hijos"
     
 POD_education_events.1.option.e:0 "A ver si sobreviven a mi corte..."
 POD_education_events.1.option.isouda:0 "Como Isouda, puedes poner a tus hijos en la despiadada arena que es tu corte. Se harán más fuertes gracias a ello... si sobreviven".
 
 POD_education_events.26.t:0 "Una educación : Childe digna"
 POD_education_events.26.desc:0 "Las pruebas han terminado y parece que esta será útil. Bueno, eso es genial y todo, pero estás un poco decepcionado para ser honesto. ¿Tal vez deberías condimentarlas para la próxima vez para que sea más desafiante y más divertido verlos retorcerse en tu despiadada corte? Oh, bueno, pensamientos para otra noche".
 POD_education_events.26.option.a:0 "Bien hecho, supongo"
  
 POD_education_events.27.t:0 "Una educación : Childe indigna"
 POD_education_events.27.desc:0 "Las pruebas han terminado y, bueno, este no lo ha conseguido. Oh, bueno, de todas formas hay muchos más mortales para probar. Al menos fue divertido de ver hasta su conclusión previsible. Ser testigo de cómo unos neonatos indefensos son absorbidos en la red de intrigas que es su corte siempre le da una profunda sensación de satisfacción."
 POD_education_events.27.option.a:0 "El mejor entretenimiento realmente"
    
 podintroductions.132.t:0 "Su historia hasta ahora"
 podintroductions.132.desc:0 "Lady Esclarmonde, eres reconocida como la líder de la resistencia occitana a los franceses desde el inicio de la Cruzada Albigense... No es que te importe mucho la propia Occitania de todos modos, pero es una farsa útil para mantener la atención del público.\NAún más por una de tus habilidades únicas. Usando la Presencia de una manera contada por tu difunto [Sire|E], eres capaz de hacer que cualquier hombre se pierda en un cuento de hadas donde él es el caballero y tú la princesa. A partir de ahí, obviamente, la amable princesa puede dirigir a sus valientes caballeros para que maten a los 'monstruos' con el fin de protegerla..."
 podintroductions.132.a:0 "Todos desempeñamos un papel"
 esclarmonde_intro_tooltip:0 "Como Esclarmonde, tienes una interacción de carácter especial disponible para que los hombres de tu reino entren en ella. Cuesta piedad promulgarla".
     
 POD_esclarmonde_interaction:0 "Faydit de Esclarmonde"
 POD_esclarmonde_interaction_desc:0 "¡Caballero valiente, ayúdame en mi momento de necesidad!"
 faydit_modifier:0 "Faydit de Esclarmonde"
 faydit_modifier_desc:0 "Esta pobre alma está perdida en una ilusión en la que es el caballero de la bella princesa Esclarmonde"
  
 podintroductions.133.t:0 "Su historia hasta ahora"
 podintroductions.133.desc:0 "Intrépida Melinda, tu [Sire|E], Helena, te abandonó después de aburrirse de atormentarte. Ahora estás abandonada para valerte por ti misma, pero has aprendido una cosa importante de tu tiempo bajo la "tutela" de Helena: eres tú contra ellos. Los otros... te divertirás mucho lidiando con los otros.\NSi este mundo tiene que sumirse en el horror eterno para que seas poderoso, respetado e independiente, que así sea.\NReinarás en el infierno, y maldito sea el cielo".
 podintroductions.133.a:0 "Ahora lo entiendo, 'madre'"
 melinda_intro_tooltip:0 "Como Melinda Galbraith tienes una decisión única para asaltar tu capital para obtener algunas recompensas rápidas, siempre y cuando tu capital no esté ya totalmente arruinado."
      
 melinda_decision:0 "¡Arranca!"
 melinda_decision_tooltip:1 "Es hora de desahogarse"
 melinda_decision_desc:0 "Hay muchos mortales indefensos en tu capital. Puede que sea el momento de mostrarles que el final se acerca mucho más rápido de lo que creen..."
 melinda_decision_confirm:0 "...y el infierno siguió con ella"
     
 podintroductions.134.t:0 "Su historia hasta ahora"
 podintroductions.134.desc:0 "Astuto Rafael, seamos sinceros, no tienes ni idea de qué demonios está pasando. Apenas has salvado tu vida engañando a tu [Sire|E] para que piense que eres un artista de los planes y las travesuras, pero todavía no tienes ni idea de cómo funciona toda esta sociedad vampírica.\NDe las pocas cosas que has reunido, sería mejor que aprendieras muy rápido, porque los vampiros despistados son vampiros muertos la mayoría de las veces. Sólo tienes una ventaja para hablar, tu ingenio. Eres capaz de convencer a casi cualquier persona para que acepte casi cualquier cosa. Esto podría ser tu salvavidas..."
 podintroductions.134.a:0 "¡Puedo lograrlo!"
 rafael_intro_tooltip:0 "Como Rafael, tienes una interacción de carácter especial que cuesta prestigio para engañar a otros gobernantes de la tierra para que te den algo. La recompensa específica depende de sus rasgos".
       
 POD_rafael_interaction:0 "¡Mi mejor oferta!"
 POD_rafael_interaction_desc:0 "Proponer una oferta extraordinaria a este gobernante"
        
 PODcanon_chars.24.t:0 "Una estafa encantadora"
 PODcanon_chars.24.desc:0 "Has enganchado a éste con tu perfecto discurso de venta, Rafael. Ahora es el momento de ir a por todas, ¿qué vas a pedir? Habrá que tener en cuenta el ángulo que estás trabajando".
 PODcanon_chars.24.a:0 "¡Puedes confiar en mí!"
 rafael_trusting_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo confiado o gregario"
 PODcanon_chars.24.b:0 "...¡y entonces mi [Sire|E] me abandonó!"
 rafael_compassionate_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo compasivo"
 PODcanon_chars.24.c:0 "¡Esto es fascinante, me convertiré seguro!"
 rafael_zealous_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo de celo"
 PODcanon_chars.24.d:0 "¡Cosas interesantes, déjame tomar notas!"
 rafael_diligent_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo diligente o paciente"
 PODcanon_chars.24.e:0 "¡Maldita sea, nunca me habría atrevido!"
 rafael_brave_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo valiente o testarudo"
 PODcanon_chars.24.f:0 "¡Simplemente eres el mejor!"
 rafael_ambicioso_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo ambicioso o arrogante"
 rafael_ambitious_tooltip:0 "Esta opción está disponible porque su objetivo tiene el rasgo ambicioso o arrogante"
 PODcanon_chars.24.g:0 "¡La vida es genial!"
 rafael_content_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo contenido o humilde"
 PODcanon_chars.24.h:0 "¡Están totalmente aquí para atraparnos!"
 rafael_deceitful_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo engañoso o paranoico"
 PODcanon_chars.24.i:0 "...eso ha sido gráfico"
 rafael_cynical_tooltip:0 "Esta opción está disponible porque tu objetivo tiene el rasgo cínico o insensible"
 PODcanon_chars.24.j:0 "¡Buena charla!"
 rafael_end_tooltip:0 "No tienes otro ángulo para atacar a este objetivo"
 podintroductions.135.t:0 "Tu historia hasta ahora"
 podintroductions.135.desc:0 "Hermosa Rosamund, aquí estás en Magdeburgo casi secuestrada por el exiliado Matusalén Alejandro. El otrora gobernante de Francia dice que te ama, pero sabes que su frío corazón se enfurecerá una noche lo suficiente como para destruirte como hizo con sus anteriores "almas gemelas". Necesitas aliados. ¿Y quién mejor que el audaz Jurgen von Verden? Le conoces desde hace tiempo, y ambos os queréis mucho. Pero vuestro amor no podrá crecer de verdad, aunque os caséis con él, hasta que no se acabe con Alejandro de una vez por todas. Te han enseñado bien, y no eres una damisela indefensa Rosamund, sabes lo que tienes que hacer".
 podintroductions.135.a:0 "El amor triunfará"
 rosamund_intro_tooltip:0 "Como Rosamund, tienes una decisión especial disponible mientras sigas siendo alma gemela de Jurgen"
         
 love_triumph_modifier:0 "El amor triunfará"
 love_triumph_modifier_desc:0 "...y vivieron felices para siempre. Probablemente".
      
 rosamund_decision:0 "Triángulo amoroso"
 rosamund_decision_tooltip:1 "Es hora de simplificar tu vida amorosa"
 rosamund_decision_desc:0 "Alexander es un controlador opresivo que podría matarte en un ataque de ira en cualquier momento. Tienes que lidiar con él".
 rosamund_decision_confirm:0 "Final feliz"
 rosamund_custom_decision:0 "Alejandro debe estar muerto"
 rosamund_custom_decisionb:0 "Debe seguir siendo amigo del alma de Jurgen von Verden"

 podintroductions.136.t:0 "Su historia hasta ahora"
 podintroductions.136.desc:0 "Sabio Karl, tu iniciativa para preservar las viejas costumbres ha sido hasta ahora un éxito. El Estado Libre es aún joven, pero crece más seguro cada noche... pero los problemas están en el horizonte.\N-Sus dos principales aliados, Eirik Diente Largo y Ulfsdottir, han llegado a un punto de ruptura y están en la garganta del otro. Eirik es un guerrero poderoso, pero su absoluta falta de atención a los mortales molesta a las valquirias. A cambio, la tranquila aceptación de Ulfsdottir del lento fin de sus costumbres enfurece a Dientes Largos.\N-Si quieren que el Estado Libre perdure, deben elegir un bando... y probablemente tratar con el que se sentirá perjudicado".
 podintroductions.136.a:0 "Eres un monstruo Eirik, y debes ser detenido"
 podintroductions.136.b:0 "¡Debemos luchar por nuestra causa, Ulfsdottir!"
 podintroductions.136.c:0 "¡Los dos sois idiotas!"
    
 podintroductions.137.t:0 "Tu historia hasta ahora"
 podintroductions.137.desc:0 "Poderoso Bjorn, una vez más te ves arrastrado a una guerra perdida. Mientras navegabas hacia Vinlandia, naufragaste en Escocia y eres el único superviviente de tu tripulación inicial. Los vampiros locales, en su mayoría refugiados del férreo control de Mithras sobre las islas, fueron muy acogedores, tanto que te sientes en deuda con ellos.\NY no eres de los que dejan atrás a un amigo, así que aquí estás, liderando el esfuerzo de guerra contra el inevitable ataque de Mithras a esta tierra. Necesitarás una nueva tripulación para una tarea tan desalentadora y sólo los mejores y más leales lo harán".
 podintroductions.137.a:0 "Nueva tierra, mismos problemas"
 bjorn_intro_tooltip:0 "Como Bjorn, tienes una interacción especial con el personaje para convertir a alguien en tu compañero de tripulación.\NSólo 5 vampiros sin tierra pueden ser compañeros de tripulación en un momento dado, y tienen que gustarte ya para aceptar."
        
 bjorn_crew_modifier:0 "Compañero de tripulación de Bjorn"
 bjorn_crew_modifier_desc:0 "Miembro de la tripulación de Bjorn Garinson, un puesto de prestigio para guerreros expertos."
  
 POD_bjorn_crew_opinion:0 "Compañero de tripulación de Bjorn"
 
 POD_bjorn_interaction:0 "Invita a su tripulación"
 POD_bjorn_interaction_desc:0 "Este personaje será uno de tus 5 compañeros de tripulación"
 POD_bjorn_crew_interaction_limit:0 "Este personaje debe tener una opinión positiva de ti y no puedes tener más de 5 compañeros de tripulación"
 POD_bjorn_opinion_limit:0 "Este personaje debe tener una opinión positiva de ti"

 podintroductions.138.t:0 "Su historia hasta ahora"
 podintroductions.138.desc:0 "Intrépido Robin, el futuro de tu rebelión se presenta funesto. El odiado tirano, Mitra, ha ganado la última batalla campal entre vosotros hace varios años, reduciendo gravemente vuestra influencia sobre las Islas Británicas. Sin embargo, hay esperanza, ya que aún no ha ido a matar, tal vez ocupado con otros asuntos o simplemente aburrido como suelen ser los vampiros muy viejos como él. Esta podría ser tu oportunidad.\NPrepárate rápidamente en caso de otro ataque, planta la semilla de la rebelión en aquellos que estén dispuestos a escuchar y acaba con Mithras de una vez por todas. Sólo entonces las Islas Británicas serán verdaderamente libres".
 podintroductions.138.a:0 "Estoy acorralado, pero no derrotado"
 leeland_intro_tooltip:0 "Como Robin, tienes una interacción especial con el personaje para plantar la semilla de la rebelión en los jóvenes vampiros, y así sembrar la discordia en otros reinos."
  
 semilla_de_rebelión_leeland_modificador:0 "Semilla de rebelión"
 seed_of_rebellion_leeland_modifier:0 "Semilla de rebelión"
 seed_of_rebellion_leeland_modifier_desc:0 "Este personaje ha sido empujado al borde de la rebelión por un forajido legendario"
 
 POD_leeland_interaction:0 "Semilla de rebelión"
 POD_leeland_interaction_desc:0 "Planta la semilla de la rebelión en la mente de este joven vampiro"
 podintroductions.139.t:0 "Su historia hasta ahora"
 podintroductions.139.desc:0 "Lady Veronique, estás de vuelta en tu ciudad natal después de tu aventura parisina. Ayudaste en el golpe de estado contra Alejandro, el tirano Príncipe de Francia, y ganaste algo de reconocimiento en el proceso. Lamentablemente, también perdisteis a muchos criados de confianza a manos del embustero Jean Baptiste de Montrond. Más allá de esta creciente rivalidad, tu posición es casi segura. Ya estás trabajando duro para reconstruir tu séquito de amigos mortales, una rareza entre los [cainitas|E], pero que te da fuerza. Utiliza tu confianza en la humanidad en tu beneficio y los que te subestiman pronto aprenderán que puedes ser tan hábil como ellos en cualquier campo de experiencia".
 podintroductions.139.a:0 "Estoy jugando su juego a mi manera"
 veronique_intro_tooltip:0 "Como Veronique, tienes un evento especial durante la actividad de la Capital de la Encuesta, siempre que permanezcas de la fe de la Vía Humanitatis"
  
 POD_survey_events.150.t:0 "La encuesta : el séquito de Veronique"
 POD_survey_events.150.desc:0 "Eres uno de los pocos [cainitas|E] que realmente cultivan algunas relaciones con los mortales y no sólo los consideran como ganado o peones en un juego mayor. Como tal, realmente tienes algunos amigos en la ciudad que están dispuestos a ayudarte en muchos asuntos diferentes. Como todos los contactos, debes visitarlos de vez en cuando para ocuparte de cualquier problema relevante que puedan tener, pero siempre te resulta una experiencia gratificante. Los mortales están mucho más en sintonía con el mundo cambiante de lo que cualquier [cainita|E] podría soñar".
 POD_survey_events.150.option.a:0 "¡Un placer volver a verte!"
 veronique_survey_tooltip:0 "Este resultado especial de la encuesta siempre puede ocurrirle a Veronique mientras se mantenga en la fe de la Via Humanitatis."
   
 podintroductions.140.t:0 "Su historia hasta ahora"
 podintroductions.140.desc:0 "Gran Menele de Esparta, llevas siglos persiguiendo a la traidora Helena y parece que no hay fin a este conflicto. Es obvio que hay que castigarla por haber tramado la destrucción de tu amada Cartago, pero también te lamentas por la decadencia de tu [Clan|E]. Podrías hacer mucho para ayudar a que se recupere... si no estuvieras tan preocupado por la caza de tu némesis.|nTu legendaria rivalidad debe terminar de una forma u otra, entonces aún podría ser el momento de curar tu [Clan|E] roto".
 podintroductions.140.a:0 "El fin de la eterna disputa..."
 menele_intro_tooltip:0 "Como Menele, tienes una decisión especial en la que debes ocuparte del problema de Helena. Si lo consigues, entonces desbloqueas una interacción con el personaje para enseñar a otros Brujah sobre tu glorioso [Clan|E]."
    
 menele_decision:0 "Esparta contra Troya"
 menele_decision_tooltip:1 "Es hora de acabar con este sinsentido"
 menele_decision_desc:0 "Helena ya te ha quitado demasiado tiempo. Ocúpate de ella, luego asuntos más urgentes requieren tu atención".
 menele_decision_confirm:0 "¡Por fin!"
 menele_decision_tooltip:1 "Helena debe estar muerta, o ya no es tu rival"
 menele_decision_effect_tooltip:0 "Desbloquearás una nueva interacción con el personaje para enseñar al Brujah la gloria de tu [Clan|E]"

 PODcanon_chars.25.t:0 "Nuevos comienzos"
 PODcanon_chars.25.desc:0 "Por fin, este desagradable asunto con Helena ha quedado atrás. Te ha llevado mucho tiempo, pero por fin te has dado cuenta de que su mayor traición no era ayudar a los romanos contra Cartago, sino que en realidad te mantenía distraído en el momento en que tu [Clan|E] más te necesitaba.\NLos Brujah yacen dispersos, abrumados por la ira y el dolor, un pálido reflejo de sus gloriosas noches antiguas. No tiene por qué ser el único camino a seguir. Eres una leyenda Menele, e incluso el miembro más obstinado de tu [Clan|E] te escuchará si hablas. Tienes que ser la luz que los guíe hacia adelante, porque nadie más puede hacerlo".
 PODcanon_chars.25.a:0 "Somos el legado de Cartago"
 menele_victory_tooltip:0 "Desbloquearás una nueva interacción con el personaje para enseñar a otros Brujah la gloria de tu [Clan|E]."
 
 POD_menele_teachings_interaction:0 "Enseñanzas de Cartago"
 POD_menele_teachings_interaction_desc:0 "Recuerda a otros Brujah su glorioso pasado, y su brillante futuro."

 PODcanon_chars.26.t:0 "Una lección"
 PODcanon_chars.26.desc:0 "Como tal vez el Brujah más respetado que sigue activo en estas noches, tienes suficiente influencia para hacer que cualquier miembro de tu [Clan|E] se siente y te escuche si te lo propones.\NLos preparativos fuera del camino, sólo tienes que pensar en qué le enseñarás exactamente a éste. Si el conflicto con Helena te enseñó algo, es que no tienes todo el tiempo del mundo para una sola persona."
 PODcanon_chars.26.a:0 "Sólo hay una forma de dominar a tu Bestia"
 PODcanon_chars.26.b:0 "Hablemos de Cartago"
 PODcanon_chars.26.c:0 "El autocontrol es la clave"

 PODcanon_chars.26.c:0 "El autocontrol es la clave" 
 ANTI_HEDEON_PACT:0 "Pacto Anti Hedeon"

 podintroductions.141.t:0 "Tu historia hasta ahora"
 podintroductions.141.desc:0 "Lord Yitzhak, recientemente has conseguido ampliar considerablemente tu influencia sobre Polonia gracias a los problemas del príncipe Razkoljna con una incursión Ventrue. Pero no sois el único que se beneficia de este acontecimiento. Hedeon Yaroslavich, un monstruo vicioso incluso para su ya bastante sádico [Clan|E], también ha hecho crecer su dominio de forma considerable. Su oscura sombra se acerca cada vez más a engullir Polonia.\NPuede haber una salida. No confías en Razkoljna, pero sabes que es un mal mucho menor que Hedeon, y probablemente ella sienta lo mismo por ti. Negociar una tregua entre ustedes dos podría permitirles a ambos concentrarse en Hedeon primero. Después de eso, obviamente, todas las apuestas están hechas..."
 podintroductions.141.a:0 "Príncipe Razkoljna, hablemos"
 podintroductions.141.b:0 "¡Ella no es mejor que Hedeon!"

 podintroductions.142.t:0 "Su historia hasta ahora"
 podintroductions.142.desc:0 "Señor Hektor, Nueva Lacadaemonia está segura gracias a su fuerte liderazgo. El Imperio Bizantino que se está desmoronando alrededor de tus dominios podría incluso presentar oportunidades de expansión si así lo deseas. Aunque también hay problemas en casa con los que lidiar.\NEstás gobernando con el consejo de un Senado, en la tradición cartaginesa, pero esta augusta institución está dividida. La mayoría de los senadores quieren que sigas el camino de una Cartago idealizada y pura. Una minoría creciente quiere un enfoque más pragmático, con la inclusión de los elementos más desagradables de la antigua Cartago. Tu apoyo a una u otra facción allanará el camino de tu reino en los próximos años."
 podintroductions.142.a:0 "¡La sesión está abierta!"
 hektor_intro_tooltip:0 "Como Hektor, tienes una decisión especial para convocar al Senado y elegir tu enfoque para los próximos años.\NPuedes elegir un enfoque más fuerte si Antíoco y Maureen, los líderes de las facciones, siguen vivos."

 hektor_decision:0 "Sesión del Senado"
 hektor_decision_tooltip:1 "Necesito el consejo del Senado"
 hektor_decision_desc:0 "¿A qué facción vas a favorecer para la próxima legislatura del Senado?"
 hektor_decision_confirm:0 "¡Orden en la asamblea!"
 hektor_decision_effect_tooltip:0 "Elegirás una política para los próximos años".

 PODcanon_chars.27.t:0 "El Senado"
 PODcanon_chars.27.desc:0 "Esta nueva sesión de tu renacido Senado cartaginés es la misma de siempre, Hektor. Los idealistas te reprochan que hayas 'traicionado' su querida utopía, mientras que los pragmáticos te instan a considerar por qué Cartago era tan fuerte, sin importar los costes. Afortunadamente, la última palabra es sólo tuya".
 PODcanon_chars.27.a:0 "¡Luchamos por un ideal!"
 PODcanon_chars.27.b:0 "Cartago es una idea ante todo".
 PODcanon_chars.27.c:0 "Un enfoque equilibrado es el único camino".
 PODcanon_chars.27.d:0 "¡Hay que hacer sacrificios!"
 PODcanon_chars.27.e:0 "¡Los lobos están a nuestras puertas!"
 antiochus_alive_tooltip:0 "Esta opción está disponible mientras Antíoco esté vivo"
 maureen_alive_tooltip:0 "Esta opción está disponible mientras Maureen esté viva"

 full_idealist_support_modifier:0 "Apoyo total a los idealistas"
 full_idealist_support_modifier_desc:0 "Cartago era una utopía pura y perfecta. Que nadie discuta esta verdad".
 
 idealist_support_modifier:0 "Apoyo idealista"
 idealist_support_modifier_desc:0 "Cartago es una idea por la que merece la pena luchar, a pesar de cualquier defecto que pueda tener."
  
 pragmatist_support_modifier:0 "Apoyo pragmático"
 pragmatist_support_modifier_desc:0 "No vivimos en un sueño. Hay que hacer sacrificios".
 
 full_pragmatist_support_modifier:0 "Apoyo pragmático completo"
 full_pragmatist_support_modifier_desc:0 "El Sueño de Cartago no era nada sin su Pesadilla".
 
 podintroductions.143.t:0 "Su historia hasta ahora"
 podintroductions.143.desc:0 "Lady Ecaterina, hasta ahora has podido aumentar tu influencia en la región en gran parte gracias a tu talentoso hijo, Christof Romuald. Lamentablemente, tu imprudente vástago ha desaparecido tras lo que parece ser una brutal batalla en el castillo de Vysehrad. El loco trató de asaltar la fortaleza por su cuenta, cortando y acuchillando a todos los horrores de Tzimisce que la custodiaban! \N - Aun así, Christof será Christof y sabes que, bien guiado, puede ser muy útil. Podrías organizar un grupo de búsqueda en las ruinas de Vysehrad para encontrarlo y traértelo de vuelta. ¿O tal vez su utilidad se ha agotado?"
 podintroductions.143.a:0 "Tengo otra búsqueda para ti, Christof"
 podintroductions.143.b:0 "Su armadura de la trama ha seguido su curso parece"
  podintroductions.144.t:0 "Su historia hasta ahora"
 podintroductions.144.desc:0 "Señor Augusto, has aprovechado rápidamente las oportunidades que te ha dado el [Abrazo|E]. El imperio mercantil (y nigromántico) de tu familia está creciendo y estos indolentes capadocios no esperan nada. Aun así, sólo eres un hombre y primero debes centrar tus esfuerzos en conseguir por fin el control de la propia Venecia.\NPara los demás asuntos, puedes contar con tus tres lugartenientes, Claudius, Ambrogino e Ignazio. Cada uno de ellos tiene su propio punto fuerte y todos quieren tu aprobación. Si juegas bien tus cartas, podrás mantenerlos útiles y ocupados discutiendo entre ellos (y no maquinando contra ti) durante mucho tiempo."
 podintroductions.144.a:0 "Comienza nuestra ascensión"
 augustus_intro_tooltip:0 "Como Augusto, tienes una decisión especial en la que puedes favorecer a uno de tus lugartenientes más que a los demás, siempre que estén vivos, claro."

 augustus_decision:0 "Tu mano derecha"
 augustus_decision_tooltip:1 "Niños peleones pero útiles"
 augustus_decision_desc:0 "¿A qué teniente favorecerás para los próximos años?"
 augustus_decision_confirm:0 "Déjame pensar..."
 augustus_decision_effect_tooltip:0 "Elegirás a qué teniente favorecer para los próximos años".
 augustus_custom_decision:0 "Al menos uno de Claudio, Ignacio y Ambrogino debe estar vivo"

 claudius_support_modifier:0 "El apoyo de Claudio"
 claudius_support_modifier_desc:0 "Claudio es un bastardo intrigante y conspirador. Pero es tu bastardo intrigante y conspirador".
  
 ignazio_support_modifier:0 "El apoyo de Ignazio"
 ignazio_support_modifier_desc:0 "Ignazio no es el Giovanni más brillante ni mucho menos, pero su fuerte brazo armado es muy útil."
 
 ambrogino_support_modifier:0 "Apoyo de Ambrogino"
 ambrogino_support_modifier_desc:0 "Ambrogino es demasiado ambicioso para su propio bien. Mejor mantenerlo cerca y satisfecho".
 
 PODcanon_chars.28.t:0 "Los tenientes"
 PODcanon_chars.28.desc:0 "Como patriarca de la familia, su favor es un recurso precioso en sí mismo. Tus tres principales agentes siempre buscan complacerte y superar a sus competidores. Este pequeño juego tiene también la ventaja de mantenerlos divididos y ocupados maquinando entre ellos y no contra ti. Al final, sin embargo, la elección de en quién confiar y a quién despreciar es sólo tuya".
 PODcanon_chars.28.a:0 "Claudio es mi hijo favorito".
 PODcanon_chars.28.b:0 "Ambrogino es el mejor de nosotros".
 PODcanon_chars.28.c:0 "Las formas sencillas de Ignazio son útiles".
 PODcanon_chars.28.d:0 "Nadie se ha ganado mi favor esta vez"
 claudius_alive_tooltip:0 "Esta opción está disponible mientras Claudio esté vivo"
 ambrogino_alive_tooltip:0 "Esta opción está disponible mientras Ambrogino esté vivo"
 ignazio_alive_tooltip:0 "Esta opción está disponible mientras Ignazio esté vivo"

 podintroductions.145.t:0 "Su historia hasta ahora"
 podintroductions.145.desc:0 "Señor Ambrogino, estás destinado a la grandeza. A pesar de ser un mero bastardo de la familia Giovanni, ya has conseguido mucho y sabes más sobre tu nueva condición vampírica que el resto de la familia, Augusto incluido. Sin embargo, esto no es más que el principio, ya que tu cabeza da vueltas a las posibilidades que tienes ante ti. Hay una verdad que encontrar en algún lugar y esta verdad puede llevar a la divinidad, estás seguro de ello. El viaje será largo, pero la recompensa... la recompensa será que tu sueño más salvaje, no tu destino, se haga realidad".
 podintroductions.145.a:0 "Encontraré la llave"
 ambrogino_intro_tooltip:0 "Como Ambrogino, tienes una opción especial si consigues la decisión del "Códice Sargón"."

 ambrogino_sargon_codex_modificador:0 "Destino de Ambrogino"
 ambrogino_sargon_codex_modifier:0 "El destino de Ambrogino"
 ambrogino_sargon_codex_modifier_desc:0 "¡El Códice de Sargón te ha mostrado mucho más de lo que imaginabas! La divinidad está más cerca que nunca..."
 pod1230objectives.49.c:0 "Sé cómo manejarlo..."
 sargon_ambrogino_tooltip:0 "Esta opción sólo está disponible para Ambrogino Giovanni"

 podintroductions.146.t:0 "Su historia hasta ahora"
 podintroductions.146.desc:0 "Señor Claudio, ese bastardo confabulador e intrigante de Ambrogino ha ido demasiado lejos esta vez. Durante mucho tiempo has preparado a tu propia tataranieta, Lucrecia, para una posición prestigiosa como uno de tus hijos, pero ese codicioso ladrón de alguna manera convenció a tu propio padre Augusto para que le regalara a Lucrecia. Esta es la gota que colma el vaso. Tú eres el heredero de Augusto, tanto en vida como fuera de ella. Ambrogino no es más que un hijo de una criada que piensa demasiado en sí mismo. Es hora de deshacerse de él de una vez por todas... y de Lucrecia también, ya que ha sido manchada por la sangre del bastardo. Sólo entonces podrás asumir el lugar que te corresponde como mano derecha de Augusto".
 podintroductions.146.a:0 "¡Se arrepentirá de este plan!"
 claudius_intro_tooltip:0 "Como Claudio, tienes la decisión especial de deshacerte de Ambrogino y Lucrecia por una recompensa"

 rightful_giovanni_heir_modifier:0 "Heredero legítimo de Giovanni"
 rightful_giovanni_heir_modifier_desc:0 "Nadie puede negar que ahora eres el verdadero heredero del legado de tu padre"
 
 claudius_decision:0 "Heredero de los Giovanni"
 claudius_decision_tooltip:1 "Tú, y nadie más, eres el heredero de Augusto"
 claudius_decision_desc:0 "Deshacerse de ese molesto Ambrogino y de su hijo favorito, que te robó, sería una poderosa advertencia para cualquier rival"
 claudius_decision_confirm:0 "¡La justicia triunfa!"
 claudius_custom_decision:0 "Tanto Lucrecia como Ambrogino deben estar muertos"
 
 weak_falsinar_modifier:0 "Ayuda débil de Falsinar"
 weak_falsinar_modifier_desc:0 "Tu fiel Falsinar sigue haciendo lo que puede desde el inframundo para ayudarte"
 
 podintroductions.147.t:0 "Tu historia hasta ahora"
 podintroductions.147.desc:0 "Señor Markus Musa, tu fama tanto en tu familia como en tu [Clan|E] está aumentando rápidamente. Has demostrado ser más que capaz al frustrar el loco plan de Lázaro en Egipto. Sin embargo, el costo fue alto y perdiste a tus dos criados de confianza en la batalla. Uno de ellos, Falsinar, ha demostrado ser un alma bastante voluntariosa ya que, incluso desde el Inframundo, sigue ayudándote lo mejor que puede.\NFalsinar es un espectro débil y joven todavía, pero tú eres un nigromante experto y como tal has identificado dos posibilidades para ayudar a tu amigo espectral a manifestarse más fácilmente en tu mundo. Ambas oportunidades no serán fáciles de conseguir, pero tú y Falsinar tenéis todo el tiempo del mundo de todos modos".
 podintroductions.147.a:0 "Nigromante y espectro, un dúo perfecto"
 markus_intro_tooltip:0 "Como Markus Musa, tienes dos decisiones especiales que pueden mejorar a Falsinar si se consiguen."

 markus_nikita_decision:0 "El nexo de la muerte"
 markus_nikita_decision_tooltip:1 "Una llave se encuentra en Croacia"
 markus_nikita_decision_desc:0 "Nikita de Sredetz, el arzobispo de Nod, parece atraer algunas poderosas energías nigrománticas a su lado. Es una oportunidad para fortalecer Falsinar".
 markus_nikita_decision_confirm:0 "Otro peón ligado a mí"
 markus_nikita_custom_decision:0 "Nikita de Sredetz debe estar muerta"
 markus_nikita_decision_custom:0 "Nikita de Sredetz debe estar muerta"
 markus_nikita_decision_effect_tooltip:0 "Falsinar se hará más fuerte"

 medium_falsinar_modifier:0 "La ayuda de Falsinar"
 medium_falsinar_modifier_desc:0 "Tu fiel Falsinar sigue haciendo lo que puede desde el inframundo para ayudarte"
 
 high_falsinar_modifier:0 "Fuerte ayuda de Falsinar"
 high_falsinar_modifier_desc:0 "Tu fiel Falsinar sigue haciendo lo que puede desde el inframundo para ayudarte."
  
 markus_egypt_decision:0 "Volver a Egipto"
 markus_egypt_decision_tooltip:1 "Algunos malos recuerdos de este lugar..."
 markus_egypt_decision_desc:0 "Falsinar murió protegiéndote de Lázaro en Egipto. Nunca pudisteis recuperar sus restos. Hacerlo sin duda te ayudaría a fortalecer su espectro".
 markus_egypt_decision_confirm:0 "Un entierro adecuado"
 markus_egypt_decision_effect_tooltip:0 "Falsinar se hará más fuerte"

 podintroductions.148.t:0 "Su historia hasta ahora"
 podintroductions.148.desc:0 "Señor Japhet, su papel como líder informal de [Clan|E] Cappadocian es ingrato. Sus hermanos son conocidos por ser bastante reclusos y en su mayoría no prestan atención a su augusta responsabilidad. Peor aún, tu propio [Sire|E], Capadocio, se pierde a menudo en sus delirios de grandeza o en sus ataques de locura. Pero como fundador del [Clan|E], su palabra es ley y tú no eres nada si no eres obediente.\NSu último capricho ha sido ver al veneciano Giovanni Abrazado a la Sangre, algo con lo que tú estás muy en desacuerdo. Sin embargo, no tienes más remedio que seguir adelante, limitando los peores excesos de tu [Sire|E] y preservando la integridad del [Clan|E] Capadocio. La eternidad nunca se ha sentido tan larga".
 podintroductions.148.a:0 "Mi trabajo nunca terminará"
 japhet_intro_tooltip:0 "Como Japhet tienes una decisión menor especial para controlar a Capadocio. Sin embargo, ten cuidado con sus excentricidades".

 japhet_decision:0 "Pecados del Padre"
 japhet_decision_tooltip:1 "Esperemos que esté de buen humor..."
 japhet_decision_desc:0 "Eres el guardián de los Erciyes, el hogar del mismísimo Capadocio. Un gran honor... y una gran carga ya que el [antediluviano|E] suele ser difícil de entender."
 japhet_decision_confirm:0 "No hay vuelta atrás"
 japhet_decision_effect_tooltip:0 "Comprobarás el estado del propio Capadocio, esperando encontrarlo bien... y no demasiado perdido en su propio mundo de fantasía."
 PODcanon_chars.29.t:0 "Cappadocius : El Plan"
 PODcanon_chars.29.desc:0 "Aquí va de nuevo... su augusto [Sire|E], el venerable Cappadocius en persona está trabajando una vez más en su engañoso plan para [diablerizar|E] a Dios. Un ferviente converso al cristianismo, siempre ha estado fascinado por el 'Dios Único' a su propia y retorcida manera. Está bastante seguro de que el [Abrazo|E] de Augusto Giovanni está de alguna manera ligado a él también.\NEn cualquier caso, está hablando largo y tendido de su loco plan, esperando tu entusiasta aprobación, por supuesto. No hay manera de que puedas razonar con él, pero al menos preferirías no ser arrastrado demasiado en esta demente búsqueda".
 PODcanon_chars.29.a:0 "Todavía puede haber algunos fallos".
 PODcanon_chars.29.b:0 "¡Qué plan tan perfecto, [Sire|E]!"
 PODcanon_chars.29.c:0 "*Suspira* Sí, esto es brillante"

 PODcanon_chars.30.t:0 "Cappadocius : El Mentor"
 PODcanon_chars.30.desc:0 "Vuestro estimado [Sire|E] está de buen humor, tranquilo, esta noche, devolviéndoos a tiempos mejores antes de que su ilusa mente empezara a divagar. En realidad se alegra de verte y habláis de las muchas maravillas y horrores que ambos visteis. Es en estos sencillos momentos cuando recuerdas la gran persona que fue Cappadocius y que, con suerte, aún puede ser.\NDejas su habitación más decidido a continuar tu trabajo y más sabio de lo que entraste."
 PODcanon_chars.30.a:0 "¿Y Sargón [Sire|E]?"
 PODcanon_chars.30.b:0 "Ojalá conociera yo mismo a Enoch..."
 PODcanon_chars.30.c:0 "¿Podemos hablar de Ashur?"
 
 PODcanon_chars.31.t:0 "Capadocio : El Sacerdote"
 PODcanon_chars.31.desc:0 "Cappadocius es un ferviente creyente en su, ciertamente retorcida, versión del cristianismo. Como tal, no es raro que quiera asistir a la misa... o servir él mismo de sacerdote, a pesar de la obvia ironía de tal situación.\NEstá acostumbrado a tratar con este capricho suyo, pero siempre es difícil evitar la atención no deseada ya que su [Sire|E] no es precisamente cuidadoso con su condición de vampiro."
 PODcanon_chars.31.a:0 "Participaré en la comunión"
 PODcanon_chars.31.b:0 "Con rezar será suficiente"
 PODcanon_chars.31.c:0 "La seguridad es lo primero"
  
 podintroductions.149.t:0 "Su historia hasta ahora"
 podintroductions.149.desc:0 "Señor Bela, por fin ha encontrado su propósito en la vida. Las mezquinas cadenas de la moral cristiana no son para ti, ¡estás destinado a mucho más! Kupala, esa entidad benévola y poderosa, está buscando un avatar en la Tierra y ¿quién mejor que tú?\N-Evidentemente habrá que hacer algunos sacrificios... o muchos. ¿Pero a quién le importa una persona, una ciudad o incluso una nación entera de cara a la apoteosis? A ti, desde luego, no. Pronto desgarrarás el frágil velo de cordura de este mundo condenado, y entonces todo será cenizas, sangre y fuego.\NY en este cataclismo renacimiento, tú serás el único superviviente."
 podintroductions.149.a:0 "Los últimos estertores de un mundo moribundo..."
 bela_intro_tooltip:0 "Como Bela Rusenko, tienes la decisión especial de sacrificar tus condados por Kupala. Si lo haces lo suficiente, ¿quién sabe lo que puede pasar?"

 bela_decision:0 "Kupala Rising"
 bela_decision_tooltip:1 "¡Vamos a darles caña!"
 bela_decision_desc:0 "Kupala requiere sacrificios para manifestarse en este miserable mundo. Tú estás más que feliz de proporcionarlos".
 bela_decision_confirm:0 "El infierno se está levantando".
 bela_decision_effect_tooltip:0 "Está hecho..."
 
 kupala_rising_weakest:0 "Finta de la influencia de Kupala"
 kupala_rising_weakest_desc:1 "El Gran Demonio se ha dado cuenta de tus esfuerzos..."
 kupala_rising_weak:0 "Influencia débil de Kupala".
 kupala_rising_weak_desc:0 "El Gran Terrícola está complacido por tus continuos esfuerzos..."
 kupala_rising_medium:0 "Influencia media de Kupala" 
 kupala_rising_medium_desc:0 "El Gran Archiduque piensa en ti como su sirviente favorito..."
 kupala_rising_strong:0 "Fuerte influencia de Kupala" 
 kupala_rising_strong_desc:0 "El Gran Arcángel está muy cerca de ti ahora, susurrándote al oído que hagas más..."
 kupala_avatar_modifier:0 "Avatar de Kupala" 
 kupala_avatar_modifier_desc:0 "...y el infierno le siguió con él"
    
 PODcanon_chars.32.t:0 "Somos uno"
 PODcanon_chars.32.desc:0 "Este anfitrión es interesante. Obviamente, es bastante frágil en comparación con su forma apocalíptica, pero servirá. No puedes negar los grandes esfuerzos que hizo para convocarte a una forma más apropiada para este mundo. Te complació lo suficiente como para devorar su alma rápidamente durante tu toma de posesión.\NFinalmente libre después de todos esos eones enjaulado en esta maldita prisión, tienes mucho que hacer. Y a pesar de tus considerables poderes, este frágil cuerpo no puede soportar mucho antes de desmoronarse, así que tendrás que tener cuidado. Aun así, tienes todo el tiempo del mundo gracias al idiota que te convocó.\NEl camino más seguro al infierno es el gradual después de todo".
 PODcanon_chars.32.a:0 "Los cielos lloran"
     
 silver_attacks_modifier:0 "Los colmillos de plata asaltan"
 silver_attacks_modifier_desc:1 "Los lupinos están inquietos en esta provincia, poniendo a prueba constantemente los límites de su control."
 podintroductions.150.t:0 "Su historia hasta ahora"
 podintroductions.150.desc:0 "Señora Apacia, su pueblo adoptivo está en peligro. Tu control sobre el Kanato de Sibir se ve desafiado por manadas de rabiosos Colmillos Plateados Lupinos, enfadados por tu presencia en lo que consideran su tierra natal. Podrías luchar contra ellos, pero sería un proceso largo y arduo y tu posición en la región ya es bastante insegura.\NSin embargo, se presenta otra solución, los Anda, vampiros de la cultura mongol, están reclamando rápidamente las Estepas para ellos. Su líder ha enviado recientemente un mensaje pidiendo tu lealtad a su Horda a cambio de su protección contra los merodeadores Lupinos. ¿Quizás una pérdida temporal de independencia valga la pena por la seguridad de tu pueblo?"
 podintroductions.150.a:0 "¡No necesito ninguna ayuda!"
 podintroductions.150.b:0 "Las estepas se están uniendo"
  
 podintroductions.151.t:0 "Su historia hasta ahora"
 podintroductions.151.desc:0 "Señor Myka, su inteligente movimiento durante el reciente tratado de paz hizo que su Orden Obertus se estableciera como un estado tapón entre los Ventrue alemanes y sus compañeros de clan en el Este. Sin embargo, esta posición es insegura y aún queda mucho por hacer.\NTambién te has enterado recientemente de que Nikita de Sredetz, el Arzobispo de Nod, podría estar relacionado con uno de los secretos más guardados de [Clan|E] Tzimisce. Tu mente erudita no puede resistirse al encanto de semejante hallazgo, pero tendrás que asaltar la ciudad de Nikita para saber más, lo que podría ser una perspectiva desalentadora. Como siempre, ten cuidado de equilibrar tus búsquedas intelectuales con tus ambiciones más seculares. Este ha sido siempre tu propio camino hacia la grandeza".
 podintroductions.151.a:0 "No hay un momento que perder".
 myka_intro_tooltip:0 "Como Myka Vykos, tienes la decisión especial de aprender los secretos del Arzobispo de Nod. Sin embargo, la recompensa podría ser más de lo que Myka puede soportar..."
 
 myka_decision:0 "Secretos oscuros"
 myka_decision_tooltip:1 "Buscando la verdad incognoscible"
 myka_decision_desc:0 "Nikita de Sredetz esconde uno de los secretos más importantes de [Clan|E] Tzimisce. Enfréntate a él, asalta su refugio y conoce la verdad".
 myka_decision_confirm:0 "¡Debo saberlo!"
 myka_decision_effect_tooltip:0 "Myka renacerá de nuevo".
 
 PODcanon_chars.33.t:0 "La fea verdad"
 PODcanon_chars.33.desc:0 "Toda esta fantasiosa búsqueda no había sido más que una trampa.\NNo encontraste ninguna verdad en el refugio de Nikita, más allá de la constatación de que Nikita había muerto mucho antes de que tú supieras de su existencia y se había hecho pasar por un poderoso Matusalén de Tzimisce. Y este Matusalén te guió hasta aquí, ya que descubrió que serías un mejor "anfitrión" que el difunto Arzobispo.\NYa puedes ver sus zarcillos, espirituales o de otro tipo, extendiéndose para fundirte en una forma más "apropiada" para tu fusión.\NAquí podría terminar todo para Myka Vykos."
 PODcanon_chars.33.a:0 "...Todo cambia"
 PODcanon_chars.33.b:0 "¡Huye!"

 podintroductions.152.t:0 "Tu historia hasta ahora"
 podintroductions.152.desc:0 "Señor Noriz, el tiempo de la decadencia indolente ha terminado. Aunque ciertamente es divertido enfrentar a tus hijos en combates a muerte, no debes olvidar que una vez fuiste el amo de [Clan|E] Tzimisce. Vladimir Rustovitch, ese cobarde usurpador, te lo arrebató, pero su humillante derrota contra los Ventrue alemanes es la oportunidad que esperabas.|nDebes presionar tu legítima reclamación como Voivoda de los Voivodas y enfrentarte a Rustovitch de una vez por todas. Entonces tu linaje podrá reclamar el prestigio que le corresponde".
 podintroductions.152.a:0 "Este fue tu último error Vladimir..."
 noriz_intro_tooltip:0 "Como Noriz, tienes una decisión especial que puedes conseguir si te conviertes en el líder del Voivodato. Mejorará tu modificador de casa inicial si lo consigues".
 
 house_noriz_modifier:0 "Casa Noriz"
 house_noriz_modifier_desc:1 "El verdadero Voivoda de los Voivodas ha vuelto. Transilvania es más temida que nunca".
  
 noriz_decision:0 "El regreso del Voivoda"
 noriz_decision_tooltip:1 "El tiempo de Rustovitch ha terminado"
 noriz_decision_desc:0 "Muchos te consideran indolente y perdido en la decadencia. Demuestra que se equivocan reclamando tu título".
 noriz_decision_confirm:0 "Se arrodillarán una vez más"
 noriz_custom_decision:0 "Vladimir Rustovitch debe estar muerto"
  
 podintroductions.153.t:0 "Su historia hasta ahora"
 podintroductions.153.desc:0 "Lady Razkoljna, su reciente caída en [torpor|E] ha visto debilitado su control sobre Polonia. Sin embargo, Cracovia no ha caído, así que tienes una base sólida desde la que lanzar tu reconquista.\NEs especialmente importante para ti, ya que eres uno de los pocos vampiros que se preocupa realmente por el bienestar de su ciudad. No desde un sentimiento equivocado de bondad, obviamente, sino desde el punto de vista pragmático de que una ciudad fuerte significa un Príncipe fuerte. Debes reconstruir rápidamente tu red de influencia en Cracovia y ayudar a su prosperidad una vez más. La ciudad debe volverse poderosa de verdad, como ocurrió con una capital de tu nuevo imperio Tzimisce".
 podintroductions.153.a:0 "Transilvania es una noticia antigua, aquí está el futuro".
 raz_intro_tooltip:0 "Como Razkoljna, tienes un evento especial disponible durante la actividad capital de la encuesta."
 
 POD_survey_events.160.t:0 "La Encuesta : Capital de Razkoljna"
 POD_survey_events.160.desc:0 "Conoces la importancia de una comunidad mortal bien desarrollada más que cualquier Tzimisce. Como tal, llevas mucho tiempo practicando en Cracovia el arte de guiar una ciudad hacia la prosperidad. Las valiosas lecciones que has aprendido te facilitan el desarrollo sutil de tu capital hacia tu objetivo. Sin embargo, sigue siendo un proceso agotador, y tal vez quieras ir a tu ritmo".
 POD_survey_events.160.option.a:0 "No hay tiempo que perder"
 POD_survey_events.160.option.b:0 "Tengo la eternidad de mi lado"
 raz_survey_tooltip:0 "Este resultado especial de la encuesta está disponible mientras juegues a Razkoljna".
  
 podintroductions.154.t:0 "Su historia hasta ahora"
 podintroductions.154.desc:0 "Señor Hedeon, recientemente has hecho crecer tu influencia en Polonia gracias al tiempo que el príncipe Razkoljna estuvo en [torpor|E]. Y a medida que tu influencia crece también lo hacen los gritos de los mortales a tu "cuidado", claramente el más agradable de los sonidos. Tu fortaleza siempre necesita más renovaciones y, como tal, obviamente necesitas más ganado para desollar y desmembrar con fines artísticos.|n¿Qué mejor manera de adquirir más que aplastar a Razkoljna y a los demás usurpadores polacos y luego llevar sus patéticas ciudades a tu redil? Eres un hombre imaginativo después de todo, piensa en todas las cosas que podrías hacer con tantos mortales indefensos añadidos a tu dominio..."
 podintroductions.154.a:0 "Pesada es la carga de un artista".
 hedeon_intro_tooltip:0 "Como Hedeon, consigues un enorme alivio de estrés y algo de xp de intriga cuando torturas a alguien."
 
 podintroductions.155.t:0 "Tu historia hasta ahora"
 podintroductions.155.desc:0 "Lord Yorak, como hijo mayor de Tzimisce activo en Transilvania, has asumido el papel de líder espiritual de tu [Clan|E]. Se ha visto reforzado por la construcción de la Catedral de la Carne, un logro magistral en el arte de la fabricación de carne.|nSin embargo, en su día también fuiste una fuerza política y puede que necesites volver a serlo, ya que tus hermanos son asaltados por los Ventrue alemanes y sus aliados Tremere. Claramente, eres el único con suficiente influencia para unificar realmente al [Clan|E]. ¿Y para los que no están de acuerdo? Bueno, la Catedral siempre tiene hambre..."
 podintrotions.155.a:0 "Abre las puertas..."
 podintroductions.155.a:0 "Abre las puertas..."
 yorak_intro_tooltip:0 "Como Yorak, tienes un método de ejecución especial que te permite alimentar a la Catedral mientras la controles"
 
 EXECUTION_YORAK:0 "Alimentar a la Catedral"
 
 cathedral_famished_modifier:0 "Alimentar a la Catedral"
 cathedral_famished_modifier_desc:1 "Después del reciente aperitivo, la Catedral quiere más. Mucho más".
  
 cathedral_hungry_modifier:0 "Catedral hambrienta"
 cathedral_hungry_modifier_desc:1 "La enloquecida estructura se expande más y más a medida que las pobres almas se alimentan de su interminable hambre."
  
 cathedral_satiated_modifier:0 "Catedral saciada"
 cathedral_satiated_modifier_desc:1 "La aparente calma que reina en la Catedral sólo se ve turbada por los gritos de sus innumerables víctimas."
  
 podintroductions.156.t:0 "Su historia hasta ahora"
 podintroductions.156.desc:0 "Temible Darvag, Kiev está a tu merced y una noche te vengarás de su voluble población que traicionó tu antigua religión. Pero hay asuntos más urgentes.\NEl Voivodato de Tzimisce, al oeste, te pidió lealtad, pero te negaste, sabiendo que hay poderes mucho más grandes que ellos. La Abuelita de la fama rusa, Baba Yaga, está cerca, puedes sentirlo. No importa si está dormida o no, sabes que es la única Diosa de estas tierras y también conoces las historias: bendecirá a aquellos que muestren la deferencia adecuada. Seguro que los habitantes de Kiev estarán encantados de servir de ofrenda..."
 podintroductions.156.a:0 "¡Hazme caso abuela!"
 darvag_intro_tooltip:0 "Como Darvag, tienes acceso a un método de ejecución especial".
   
 EXECUTION_DARVAG:0 "Sacrificio a Baba Yaga"

 baba_intrigued_modifier:0 "Notado por la bruja"
 baba_intrigued_modifier_desc:1 "Baba Yaga ha mostrado interés en tu devoción a su grandeza"
  
 baba_pleased_modifier:0 "Baba Yaga complacida"
 baba_pleased_modifier_desc:1 "La bruja rusa está complacida con tu celosa devoción".
  
 baba_delighted_modifier:0 "Nieto favorito"
 baba_delighted_modifier_desc:1 "Está claro que ahora eres su favorito, el que recibe los mejores regalos".
  
 podintroductions.157.t:0 "Su historia hasta ahora"
 podintroductions.157.desc:0 "Lady Shaagra, a medida que crece su control sobre Bohemia, se ha enterado de una información interesante. Vukodlak, un Tzimisce aún más antiguo que tú, estuvo activo en Praga recientemente hasta su caída en [torpor|E] tras una titánica batalla contra unos asaltantes desconocidos.\NVukodlak es un loco sádico y arrogante pero no puedes negar sus poderes y habilidades. Si lo rescatas, podría ser amigable con una alianza al menos por un tiempo. Su fuerza sería una gran baza para facilitar tu regreso al poder... pero también podría ser contraproducente en el futuro, ya que Vukodlak también es bastante ambicioso por su cuenta."
 podintroductions.157.a:0 "Hay honor entre los monstruos".
 podintroductions.157.b:0 "...Eso parece una muy mala idea".
  
 podintroductions.158.t:0 "Tu historia hasta ahora"
 podintroductions.158.desc:0 "Temible Jamal, la mera mención de tu nombre infunde miedo en los corazones de los infieles que intentan invadir tu tierra. Pero esto no es suficiente.\NComo líder de la casta guerrera de los Banu Haqim eres una figura respetada y poderosa dentro del [Clan|E], hecho que debes utilizar para asegurarte de que tus hermanos no se desvíen del verdadero camino. Demasiadas facciones competidoras, y un Eldest engañado, tratan de impedir tu visión única para el futuro de los Banu Haqim. Utiliza tu destreza suprema y tu capacidad de liderazgo para obtener buenos resultados y sus inútiles esfuerzos fracasarán sin duda."
 podintroductions.158.a:0 "Por la diplomacia o la guerra, triunfaremos".
 jamal_intro_tooltip:0 "Como Jamal, puedes usar una interacción de personaje para iniciar un duelo con cualquier personaje que no sea de los Banu Haqim"
   
 POD_jamal_interaction:0 "El invicto"
 POD_jamal_interaction_desc:0 "Empezarás un duelo con este personaje. Otro morderá el polvo".

 podintroductions.159.t:0 "Su historia hasta ahora"
 podintroductions.159.desc:0 "Señor Dastur, el caos actual en los Banu Haqim [Clan|E] está dando a tu Tribu Perdida alguna esperanza de un mañana mejor. Sin embargo, estás preocupado. Has descubierto que agentes de un culto apocalíptico llamado 'Manus Nigrum' se han infiltrado en tu reino con algún propósito desconocido, pero probablemente nefasto. Podrías lanzar una amplia purga de los supuestos agentes de este culto, pero esto podría parecer un movimiento paranoico y temerario. La otra opción sería mantener una vigilancia más indulgente sobre ellos, pero eso también podría permitirles ganar más y más influencia."
 podintroductions.159.a:0 "Vamos a cortar esta 'Mano Negra'"
 podintroductions.159.b:0 "No son una amenaza... todavía".

 podintroductions.160.t:0 "Su historia hasta ahora"
 podintroductions.160.desc:0 "Intrépida Fátima, tu misión de obstaculizar la 4ª Cruzada ha sido un éxito rotundo hasta ahora. Pero aún queda trabajo por hacer.\NAlamut ha enviado nuevas órdenes, debes asegurarte de que los restos del ejército cruzado\Natacados en Anatolia sean eliminados. Luego, los ancianos quisieran que usted forjara un nuevo feudo en la región usando el caos de la caída del Imperio Bizantino como cubierta. Esto sería un gran estado de amortiguación contra cualquier otra incursión de los francos en su tierra natal. Tampoco los decepcionarás esta vez".
 podintroductions.160.a:0 "Mi deber está claro".
 fatima_intro_tooltip:0 "Como Fátima, tienes una decisión especial que te obliga a controlar Anatolia disponible hasta el 1300".
   
 fatima_decision:0 "Acabar con la Cruzada"
 fatima_decision_tooltip:1 "¡Los Franj no deben estar aquí!"
 fatima_decision_desc:0 "Hay que ocuparse de los últimos restos de la 4ª Cruzada y asegurar Anatolia para los Banu Haqim."
 fatima_decision_confirm:0 "Misión cumplida"
 fatima_decision_effect_tooltip:0 "Alamut envía sus saludos... y recompensas".    
 
 podintroductions.161.t:0 "Su historia hasta ahora"
 podintroductions.161.desc:0 "Sabio Al-Ashrad, los Banu Haqim están revueltos. El faccionalismo dentro de tu [Clan|E] ha llegado a un punto de ebullición y sabes que este es el momento en el que algunas fuerzas oscuras esperaban para intentar hacerse con el control del [Clan|E]. Tendrás que ser fuerte. Afortunadamente, estás preparado. Eres un hechicero de sangre sin parangón y tu conocimiento de lo oculto te será ciertamente útil en los turbulentos tiempos que se avecinan. Cultiva esta fuerza, estudia a tu enemigo y luego ataca con decisión. Sólo tú puedes proteger a los Banu Haqim del terror que los acecha".
 podintroductions.161.a:0 "La planificación cuidadosa asegurará la victoria"
 alashrad_intro_tooltip:0 "Como Al-Ashrad, tienes una decisión especial que te permite mejorar tu aprendizaje cada diez años."
    
 alashrad_decision:0 "Conocimiento ilimitado"
 alashrad_decision_tooltip:1 "Debo encontrar la respuesta..."
 alashrad_decision_desc:0 "Sabes mucho Al-Ashrad, pero siempre hay más que descifrar y comprender. Tu búsqueda nunca terminará".
 alashrad_decision_confirm:0 "...tan cerca"
 broken_alamut_modifier:0 "El más débil de los ancianos"
 broken_alamut_modifier_desc:0 "Tu reivindicación como Anciano de Alamut es extremadamente débil. Nadie te respeta y tu control sobre la situación se deteriora por la noche".

 podintroductions.162.t:0 "Tu historia hasta ahora"
 podintroductions.162.desc:0 "Lady Nakurtum, la situación es grave. Los Banu Haqim no han aceptado tu toma de posesión como Anciana. El [Clan|E] se encuentra fracturado.\NControlas Alamut pero no mucho más, los otros ancianos se someten a tu autoridad de boquilla. La situación se acerca cada vez más a la guerra civil. Tal vez sea inevitable en este punto.\N-Si quieres salvar tu posición, tendrás que golpear rápida y decisivamente\Nporque los Hijos de Haqim no respetan la debilidad."
 podintroductions.162.a:0 "¡Soy el Regente de Haqim!"
 nakurtum_intro_tooltip:0 "Como Nakurtum, tienes dos decisiones especiales que te permiten deshacerte de tus modificadores negativos iniciales."

 nakurtum_losing_control_modifier:0 "Perder el control"
 nakurtum_losing_control_modifier_desc:0 "Apenas controlas la propia Alamut. Todo lo demás se escapa de tu débil agarre".

 nakurtum_eldest_decision:0 "Ganarse el respeto"
 nakurtum_eldest_decision_tooltip:1 "¡Les demostraré mi valía!"
 nakurtum_eldest_decision_desc:0 "Si quieres sobrevivir mucho tiempo como Anciano de los Banu Haqim, tendrás que demostrar tu valía. Afirmar el control sobre la patria de los Haqim es un buen comienzo".
 nakurtum_eldest_decision_confirm:0 "Me mantengo firme"
 
 nakurtum_control_decision:0 "Estabiliza tu regla"
 nakurtum_control_decision_tooltip:1 "¡Les demostraré mi valía!"
 nakurtum_control_decision_desc:0 "Si quieres sobrevivir mucho tiempo como Anciano de los Banu Haqim, tendrás que demostrar tu valía. Afirmar el control sobre la patria de los Haqim es un buen comienzo".
 nakurtum_control_decision_confirm:0 "Me mantengo firme"
 
 podintroductions.163.t:0 "Su historia hasta ahora"
 podintroductions.163.desc:0 "Señor Ahmed, usted ha participado en la creación de la Dieta de los Olivos con la esperanza de una paz duradera en la zona, pero todavía tiene algunas reservas. Tal vez tengas que encontrar otro camino, uno que te obligue más a la acción.|nTal vez tu fe te haya aislado del resto del [Clan|E]. Por lo tanto, es posible que tengas que depender de la búsqueda de prospectos prometedores e introducirlos en tu filosofía única. Será una tarea larga, pero por la paz en Tierra Santa... Vale la pena".
 podintroductions.163.a:0 "Las tareas más importantes de todas"
 ahmed_intro_tooltip:0 "Como Ahmed, siempre tendrás éxito en la parte de la enseñanza de la fe en la educación de tus hijos, siempre que te mantengas en el Via Christi".

 POD_education_events.100.option.d:0 "Escucha las palabras del Señor"
 POD_education_events.100.ahmed:0 "Como Ahmed, puedes usar esta opción para asegurarte de que tu childe sigue tu religión. Sólo estará disponible si te quedas en Via Christi".

 podintroductions.164.t:0 "Su historia hasta ahora"
 podintroductions.164.desc:0 "Señor Thetmes, ha hecho un progreso considerable recientemente. Los Banu Haqim están más divididos que nunca, lo que significa que tu Red de Cuchillos puede ejercer mucha más influencia que antes. Aún así, hay mucho trabajo por hacer antes de que el [Clan|E] esté listo para el regreso de tu Maestro.\NToma nota de las otras facciones que te rodean y aplástalas rápidamente. No puedes dejar que otro Anciano se apodere de los Banu Haqim. Una vez que Alamut esté totalmente asegurado por tus hermanos, puedes estar seguro de que el Pastor Negro te recompensará generosamente, pues ¿no eres tú su sirviente más confiable?"
 podintroductions.164.a:0 "La edad prometida llegará".
 thetmes_intro_tooltip:0 "Como Thetmes, obtienes recompensas adicionales si completas el objetivo "Un dios sueña"."

 pod1230objectives.24.customthetmes:0 "Como Thetmes, ganas recompensas adicionales. Ur Shulgi te bendice por tu servicio continuo".

 podintroductions.165.t:0 "Tu historia hasta ahora"
 podintroductions.165.desc:0 "Temible Morrow, tu fama entre el [Clan|E] Gangrel crece por momentos, gracias a tu reciente victoria contra los Ventrue de la Cruz Negra y el Voivodato de Tzimisce. Pero esto no es más que un comienzo.\NSi quieres unificar de verdad el [Clan|E], tendrás que seguir en esta dirección, demostrando que eres realmente el líder de guerra más poderoso. Una herramienta por la que ya eres famoso es tu costumbre de presentarte sin invitación en las cortes de los enemigos potenciales y hacer una demostración de fuerza antes de marcharte. Esta táctica te ha servido en el pasado y podría seguir haciéndolo".
 podintroductions.165.a:0 "La era de la bestia está llegando".
 morrow_intro_tooltip:0 "Como Morrow, tienes una interacción de carácter especial con los gobernantes de la tierra para asustarlos con una demostración de fuerza."

 show_of_force_morrow_modifier:0 "Muestra de fuerza"
 show_of_force_morrow_modifier_desc:0 "Este personaje ha sido asustado por la repentina aparición de Morrow y sus silenciosas amenazas en la corte."
 
 POD_morrow_interaction:0 "Muestra de fuerza"
 POD_morrow_interaction_desc:0 "Asusta a este gobernante con una aparición repentina en su corte".
 podintroductions.166.t:0 "Tu historia hasta ahora"
 podintroductions.166.desc:0 "Señor Viktor, su señora Baba Yaga le ha confiado su reino mientras se recupera de la terrible batalla contra su [Sire|E]. No la defraudarás.|nEl ascenso del cristianismo y las hordas orientales están siendo una gran preocupación y debes asegurar rápidamente tus alrededores para que la Abuela pueda dormir en paz. Ten en cuenta también a Durga Syn a tu Oeste, una vieja oponente de Baba Yaga.\NSi logras lidiar con todas esas amenazas, no hay duda de que la Abuela estará complacida y te recompensará en consecuencia..."
 podintroductions.166.a:0 "Duerme bien, Abuela. Estoy vigilando".
 viktor_intro_tooltip:0 "Como Viktor, obtienes recompensas personales adicionales si consigues el objetivo "Abuela cuidadora"."

 pod1230objectives.20.custom.viktor:0 "Como Viktor, obtienes recompensas adicionales. Baba Yaga está muy contenta con su sirviente favorito". 
 
 podintroductions.167.t:0 "Tu historia hasta ahora"
 podintroductions.167.desc:0 "Lady Brunhilde, los Einherjar están muriendo. Su fe está siendo reemplazada por el Dios Blanco y sus seguidores y sus hermanos han perdido la esperanza. El propio Werter, el elegido por Odín para guiaros en estos tiempos difíciles, parece estar cerca del punto de ruptura. Debes actuar.\NTienes un gran respeto por Werter y fue un digno amigo durante siglos, pero ahora debes forzarlo a abdicar de su posición como Todopoderoso de Midgard antes de que os lleve a todos a la ruina. Es hora de que las Valkirias salven a Escandinavia contigo al mando".
 podintrotions.167.a:0 "El Valhalla puede esperar un poco más".
 brunhilde_intro_tooltip:0 "Como Brunhilde, tendrás varios eventos en los próximos meses que te permitirán usurpar el título de Midgard."
 podintroductions.167.a:0 "Valhalla puede esperar un poco más."
 
 PODcanon_chars.34.t:0 "Fe y poder"
 PODcanon_chars.34.desc:0 "Ahora has dejado clara tu ambición a los demás habitantes de Midgard: debes sustituir a Werter como líder pronto. Ha suscitado cierto debate entre tus hermanos, pero el apoyo inicial es alto, sobre todo entre los que todavía quieren luchar contra el cristianismo.\NEl propio Werter no está realmente sorprendido por tu movimiento, pero te ha instado a reconsiderar tu posición. Al fin y al cabo, es el elegido por el propio Odín, e ir en contra de la voluntad del Padre Todopoderoso podría ser incluso peor que caer ante el Dios Blanco."
 PODcanon_chars.34.a:0 "Odín lo entenderá".
 brunhilde_exit_tooltip:0 "Renuncias a tu plan para conseguir el control de Midgard".
 PODcanon_chars.34.b:0 "...tiene razón".
  
 PODcanon_chars.35.t:0 "Tradiciones y poder"
 PODcanon_chars.35.desc:0 "Ha surgido un fuerte oponente a su toma de posesión: Karl el Azul del Estado Libre de Finlandia. Este valiente Einherjar es un tradicionalista acérrimo y desaprueba tu acción por los mismos motivos que Werter: Odín no te eligió y quizás incluso este final de la fe nórdica sea tu destino.\NNo hay forma de hacerle cambiar de opinión a estas alturas, tienes que aceptar su hostilidad o renunciar a tu plan por completo."
 PODcanon_chars.35.a:0 "Yo forjo mi propio destino".
 PODcanon_chars.35.b:0 "...tiene razón".
  
 PODcanon_chars.36.t:0 "Una nueva saga"
 PODcanon_chars.36.desc:0 "Ahora eres lo suficientemente fuerte como para reclamar Midgard y, por suerte, Werter no quiere luchar contra ti e iniciar una sangrienta guerra civil. Lo último que tienes que considerar ahora es cómo manejar tu victoria.\NSería habitual que avergonzaras a Werter y sus débiles políticas para poder empezar de cero. Pero mantener a este poderoso hijo de Odín de tu lado también tendría beneficios".
 PODcanon_chars.36.a:0 "¡Vergüenza para el derrotado!"
 PODcanon_chars.36.b:0 "Trabajemos juntos".
  
 podintroductions.168.t:0 "Tu historia hasta ahora"
 podintroductions.168.desc:0 "Lord Dunlop, has esperado tu oportunidad de venganza durante mucho tiempo. Mithras mató a su amada hija y pagará muy caro este asesinato. No se le conoce por el perdón o la misericordia después de todo.\NSerá un proceso difícil, ya que Mithras está bien atrincherado en las Islas Británicas y su get lo protege. Ese pensamiento te hace reflexionar... ¿tal vez podrías apuntar a su hijo para hacerle soportar una fracción del dolor que sentiste esa fatídica noche?"
 podintroductions.168.a:0 "No estás olvidada, Mary".
 dunlop_intro_tooltip:0 "Como Dunlop, tienes la decisión especial de matar a Mitra y a su prole".
         
 mary_dunlop_avenged_modifier:0 "María vengada"
 mary_dunlop_avenged_modifier_desc:0 "La venganza se siente dulce. Todo el mundo puede ver que el antiguo y terrorífico Conde Dunlop ha vuelto".
 
 dunlop_decision:0 "Venganza y ajuste de cuentas"
 dunlop_decision_tooltip:1 "Querida y dulce Mary Elizabeth..."
 dunlop_decision_desc:0 "Mithras y su hijo pagarán caro el asesinato de tu querida hija. Se les avecina un ajuste de cuentas".
 dunlop_decision_confirm:0 "En su memoria..."
 dunlop_custom_decision:0 "Mithras debe estar muerto"
 dunlop_custom_decision2:0 "Geraint, el querido hijo menor de Mithras, debe estar muerto"
 dunlop_custom_decision3:0 "Marcus Verus, el hijo más leal y devoto de Mithras, debe estar muerto"
 dunlop_custom_decision4:0 "Cretheus, el hijo mayor de Mithras, debe estar muerto"
 
 podintroductions.169.t:0 "Su historia hasta ahora"
 podintroductions.169.desc:0 "Señor Qarakh, usted lidera a los ferales de Livonia contra el actual asalto occidental. Hasta ahora la situación está bajo control, pero es sólo cuestión de tiempo que tu reino sea atacado de nuevo. Usando su conexión mística con el Dios de esta tierra, Telyavel, ella podría promulgar un ritual que te daría una fuerza inmensa, quizás suficiente para salvar a tu gente. Pero el costo... el costo sería la propia vida de Deverra. Algo que te rompe el corazón con sólo pensarlo. ¿Lo permitirás?"
 podintroductions.169.a:0 "¡No! ¡Te necesito!"
 podintroductions.169.b:0 "Serás recordado, amado".

 podintroductions.170.t:0 "Tu historia hasta ahora"
 podintroductions.170.desc:0 "Intrépido Valborg, el Ragnarok se acerca pero tú estás más que preparado para aprovecharlo. Hay muchas oportunidades para un guerrero hábil como tú. Algunos lo llamarían una parodia de la 'verdadera fe nórdica', pero tú prefieres llamarlo una mera adaptación para estos tiempos cambiantes.\NDesde tu amado barco, el Thor Rojo, estás listo para saquear y robar en busca de fortuna y gloria. Y si los viejos dioses lo desaprueban, siempre pueden venir aquí y decírselo a la cara a tu fiel martillo".
 podintroductions.170.a:0 "¡Arriba las velas!"
 valborg_intro_tooltip:0 "Como Valborg, tienes acceso a una decisión menor especial para ganar algo de "dinero aparte"."
   
 valborg_decision:0 "Contratos de mercenarios"
 valborg_decision_tooltip:1 "¡Vikingos de alquiler!"
 valborg_decision_desc:0 "Hay muchas oportunidades para una tripulación de experimentados guerreros nórdicos".
 valborg_decision_confirm:0 "¡Apúntanos al objetivo!"
 valborg_decision_effect_tooltip:0 "Se te presentará una selección de contratos".
 
 red_thor_weakened_modifier:0 "Thor rojo debilitado"
 red_thor_weakened_modifier_desc:0 "Algunos de tus guerreros están en una misión mercenaria, lo que debilita un poco tu dominio sobre tu reino."
 
 red_thor_depleted_modifier:0 "Thor rojo agotado"
 red_thor_depleted_modifier_desc:0 "Muchos de tus guerreros están en una misión mercenaria, debilitando tu dominio sobre tu reino."
 
 red_thor_empty_modifier:0 "Thor rojo vacío"
 red_thor_empty_modifier_desc:0 "Tus guerreros están en una misión mercenaria, debilitando gravemente tu dominio sobre tu reino."
     
 PODcanon_chars.37.t:0 "El Thor Rojo navega"
 PODcanon_chars.37.desc:0 "Tu tripulación está lista para partir y muchos [cainitas|E] extranjeros están ansiosos por alistarlos para sus propias guerras mezquinas. La elección que tienes que hacer es sobre la dificultad del contrato. Cuanto más difícil sea, mejor será la recompensa, pero más guerreros tuyos tendrás que destinar a la tarea. Si están en el extranjero, obviamente ya no pueden ayudarte en casa".
 PODcanon_chars.37.a:0 "Uno pequeño estará bien".
 PODcanon_chars.37.b:0 "Este parece bien equilibrado".
 PODcanon_chars.37.c:0 "¡El más difícil!"
 PODcanon_chars.37.d:0 "No hay que navegar por ahora".
       
 podintroductions.171.t:0 "Su historia hasta ahora"
 podintroductions.171.desc:0 "Lord Thomas, a pesar de sus esfuerzos, Constantinopla ha caído ante los latinos. Pero aún no ha terminado.\NUsted no es el tipo de hombre que se rinde y aunque la mayoría de los [cainitas]\Ngriegos se han ido al exilio, usted seguirá luchando. Es una batalla cuesta arriba, pero tienes décadas de experiencia como principal ejecutor en la misma ciudad. Harás que la vida de los latinos [cainitas|E] sea un infierno, ¡y luego atacarás y acabarás con ellos de una vez por todas!"
 podintroductions.171.a:0 "El ajuste de cuentas se acerca".
 thomas_intro_tooltip:0 "Como Tomás, tienes una interacción de carácter especial contra los gobernantes terratenientes en la que puedes debilitarlos antes de una guerra."
   
 guerilla_thomas_modifier:0 "Guerrilla griega de Gangrel"
 guerilla_thomas_modifier_desc:0 "Dirigido por bandas de Gangrel griego bien organizadas, este personaje tiene problemas para mantener el control de su reino."
   
 POD_thomas_interaction:0 "Guerrilla"
 POD_thomas_interaction_desc:0 "Desorganiza el reino de este gobernante lanzando algunas acciones de guerrilla."

 podintroductions.172.t:0 "Su historia hasta ahora"
 podintroductions.172.desc:0 "Lady Tryphosa, Camilla ha despertado y ha tomado el control de Roma una vez más, tal y como anticipaste. Una vez fuiste su amiga íntima y consejera de confianza, y con ese papel ejerciste una enorme influencia. ¿Podrías volver a hacerlo? Podrías dar a conocer tu presencia al poderoso Ventrue y entrar a su servicio una vez más. Esto te proporcionaría alguna protección útil contra los traicioneros Lasombra del Sur. O podrías continuar por tu cuenta, quizás Camilla no forme parte de tu futuro esta vez".
 podintroductions.172.a:0 "Bienvenido de nuevo, cónsul".
 podintroductions.172.b:0 "Su tiempo ha pasado".
   
 podintroductions.173.t:0 "Su historia hasta ahora"
 podintroductions.173.desc:0 "Lady Vasantasena, estás furiosa. En tus años de vagar y predicar por la libertad nunca viste una abominación tan grande como esta 'Casa Tremere'. Todos estos magos están oprimidos bajo un Consejo tiránico y, lo que es peor, obligados a soportar el vínculo de sangre hasta el último. Esto no puede continuar.\NPor suerte, los Tremere claramente te subestiman y aún no han notado tu presencia e influencia. Esta es una gran oportunidad para romper esta "pirámide" desde dentro. Esta será tu obra maestra y todo el mundo [cainita|E] brotará de esperanza una vez que hayas terminado".
 podintroductions.173.a:0 "Vamos a romper sus cadenas".
 vasantasena_intro_tooltip:0 "Como Vasantasena, tienes acceso a una decisión especial que te hará crear tu propia fe si tienes éxito."
  
 vasantasena_decision:0 "Romper la pirámide"
 vasantasena_decision_tooltip:1 "¡Esta abominación debe ser derribada!"
 vasantasena_decision_desc:0 "La Casa Tremere se opone a todo lo que aprecias. Debes actuar".
 vasantasena_decision_effect_tooltip:1 "Codificas tu propio camino, allanando el camino para una mayor liberación en el futuro". 
 vasantasena_decision_confirm:0 "¡La pirámide ha sido derribada!"
   
 podintroductions.174.t:0 "Su historia hasta ahora"
 podintroductions.174.desc:0 "Louhi, tu pacto con el maestro abisal está progresando bien. Has jurado tu lealtad a él y él está satisfecho con tu trabajo hasta ahora, pero hay más por hacer.\NEl lejano Norte donde resides está aislado, lo cual es útil por la soledad pero limita la escala de tus experimentos, especialmente en lo que respecta a tus bien elaborados revenants, los Keskinen. ¿Quizás podrías expandir tu reino? Sabes que los sirvientes de tu maestro estarían encantados de ayudarte en tal empeño..."
 podintroductions.174.a:0 "¡Posibilidades, posibilidades!"
 louhi_intro_tooltip:0 "Como Louhi, siempre que te mantengas en el camino del abismo, puedes usar una decisión para engendrar Sombras, un tipo de hombres de armas normalmente exclusivo de los Lasombra."
  
 louhi_decision:0 "Negocios turbios"
 louhi_decision_tooltip:1 "Tienes amigos en lugares oscuros".
 louhi_decision_desc:0 "El maestro abisal es generoso. Pide su apoyo".
 louhi_decision_effect_tooltip:1 "Podrás elegir cuántas Sombras invocar". 
 louhi_decision_confirm:0 "¡Escúchame!"
  
 PODcanon_chars.38.t:0 "Negocio turbio"
 PODcanon_chars.38.desc:0 "Estás listo para hacer tus ofrendas al maestro abisal. ¿Cuántos de sus sirvientes quieres intentar invocar?"
 PODcanon_chars.38.a:0 "Sólo algunos de ellos".
 PODcanon_chars.38.b:0 "¡Más!"
 PODcanon_chars.38.c:0 "¡Todos ellos!"
 PODcanon_chars.38.d:0 "Pensándolo bien..."
 louhi_small_shades_tt:0 "Un grupo de Shades se añade a tus hombres de armas disponibles".
 louhi_medium_shades_tt:0 "Se añaden dos grupos de Shades a tus hombres de armas disponibles."
 louhi_high_shades_tt:0 "Se añaden tres grupos de Shades a tus hombres de armas disponibles."
        
 podintroductions.175.t:0 "Tu historia hasta ahora"
 podintroductions.175.desc:0 "Señor Anatole, has estado haciendo la obra de Dios humillando a la herejía parisina [cainita|E] pero tu tarea aún no está completada. Estas tierras del sur están llenas de herejes que se esconden detrás o entre los cátaros.\NHas obtenido el derecho de operar dentro de la región y confías en que tendrás éxito en el tiempo. Sin embargo, las raíces de la corrupción podrían ser más profundas de lo que pensaste en un principio, y puede que necesites destituir a algunos Príncipes de sus cargos para descubrirlas. Después de eso... Dios elegirá tu próximo camino, como siempre hace".
 podintroductions.175.a:0 "Comencemos".
 anatole_intro_tooltip:0 "Como Anatole, tienes una decisión menor disponible para entender la voluntad de Dios para ti."
  
 anatole_decision:0 "La voluntad de Dios"
 anatole_decision_tooltip:1 "¿Qué ha planeado Él para mí?"
 anatole_decision_desc:0 "Tu fe es fuerte, pero Sus caminos son misteriosos. Debes dedicar tiempo a entenderlos".
 anatole_decision_effect_tooltip:1 "Recibirás una visión, que puede ser buena o mala". 
 anatole_decision_confirm:0 "El camino a seguir..."
  
 PODcanon_chars.39.t:0 "La ira de Dios"
 PODcanon_chars.39.desc:0 "¿Ha hecho algo malo? ¿O simplemente está disgustado contigo? Puede que nunca lo sepas, pero lo que sí sabes es que Dios no está contento contigo. Las visiones de espanto y furia que acabas de recibir son claras: debes cambiar tus costumbres."
 PODcanon_chars.39.a:0 "¡Debo hacerlo mejor!"
 PODcanon_chars.39.b:0 "No habrá descanso hasta mi redención".
 PODcanon_chars.39.c:0 "¡He hecho lo que he podido!"
       
 PODcanon_chars.40.t:0 "El celo de Dios"
 PODcanon_chars.40.desc:0 "Siempre puedes mejorar y hacer más. Eso es lo que Dios te ha recordado con las últimas visiones que has recibido. Tu celo está renovado y tu sentido de propósito nunca ha sido mayor.\N¿Dónde canalizarás esta gran bendición?"
 PODcanon_chars.40.a:0 "Entendiendo las Escrituras"
 PODcanon_chars.40.b:0 "Predicando a las masas"
 PODcanon_chars.40.c:0 "Comprender mi papel".
   
 PODcanon_chars.41.t:0 "La voluntad de Dios"
 PODcanon_chars.41.desc:0 "Gracias a una reciente visión, has encontrado la guarida de un hereje vampírico en las cercanías. Lamentablemente, éste se esconde a plena vista, teniendo poderosas conexiones con los gobernantes mortales de la tierra. Moverse contra él ciertamente atraería una atención no deseada.\N¿Pero puedes realmente negar la justicia de Dios sobre un alma tan maldita?"
 PODcanon_chars.41.a:0 "Su alma será limpiada".
 PODcanon_chars.41.b:0 "La salvación es todavía una opción".
 PODcanon_chars.41.c:0 "No puedo actuar esta vez".
 
 broken_talmahera_modifier:0 "El improbable Del'Roh"
 broken_talmahera_modifier_desc:0 "Tu reivindicación como Del'Roh de la Tal'mahe'Ra es extremadamente débil. Nadie te respeta y tu control sobre la situación se deteriora por la noche".

 podintroductions.176.t:0 "Tu historia hasta ahora"
 podintroductions.176.desc:0 "Señor Elimelech, después de su buena ración de vagabundeo confuso, ha acabado en este extraño culto a la muerte llamado Tal'mahe'Ra. Tienen sus propias ideas extrañas por lo que has visto hasta ahora como adorar a los [antediluvianos|E].\NTu edad bíblica y tu considerable poder personal te han hecho temer y ser temido por este culto y se han limitado a seguirte a ti, y a tus órdenes. ¿Quizás este es el propósito de tu no-vida que has perdido hasta ahora? Sin embargo, si decides quedarte, tendrás que consolidar rápidamente el débil control que tienes sobre ellos".
 podintroductions.176.a:0 "Un acontecimiento extraño".
 elimelech_intro_tooltip:0 "Como Elimelech, tienes dos decisiones especiales que te permiten deshacerte de tus modificadores negativos iniciales."

 elimelech_losing_control_modifier:0 "Perder el control"
 elimelech_losing_control_modifier_desc:0 "Apenas controlas la propia sala del trono. Todo lo demás se escapa de tu débil agarre".

 elimelech_delroh_decision:0 "Ganando tu poder"
 elimelech_delroh_decision_tooltip:1 "¡Les demostraré mi capacidad de liderazgo!"
 elimelech_delroh_decision_desc:0 "Si quieres sobrevivir mucho tiempo como Del'Roh de la Tal'mahe'Ra, tendrás que demostrar tu valía. Afirmar el control sobre las tierras circundantes es un buen comienzo".
 elimelech_delroh_decision_confirm:0 "¡Respeta mi autoridad!"
 
 elimelech_control_decision:0 "Estabiliza tu gobierno"
 elimelech_control_decision_tooltip:1 "¡Les demostraré mi capacidad de liderazgo!"
 elimelech_control_decision_desc:0 "Tu gobierno sobre la misteriosa Tal'mahe'Ra es una rareza, nadie espera que dure mucho tiempo. Demuestra que se equivocan".
 elimelech_control_decision_confirm:0 "¡Sigo aquí!"
    
 elimelech_custom_decision:0 "Esta decisión sólo se puede conseguir después de las 13:00".     

 podintroductions.177.t:0 "Su historia hasta ahora"
 podintroductions.177.desc:0 "Señor Zettler, ahora entiende mucho más. El dragón de tres cabezas os ha mostrado la verdad.\NHabéis sido ingenuos al tratar de proteger a los Salubri contra los Tremere porque al final, ¿no sois todos cenizas? Sólo hay una constante en esta maldita existencia y es la del dolor. Gracias a las muchas bendiciones de tu nuevo patrón, aprenderás todos sus secretos y te convertirás en su artista definitivo.\N-Los gritos nunca cesarán, pero ahora los entenderás".
 podintroductions.177.a:0 "Claridad, por fin".
 zettler_intro_tooltip:0 "Como Zettler, tienes la decisión especial de invocar uno de los aspectos del dragón de tres cabezas para que te ayude."

 zettler_beast_of_war_modifier:0 "Bestia de guerra"
 zettler_beast_of_war_modifier_desc:0 "El hermano menor, una criatura de furia y rabia irrefrenables".

 zettler_eater_of_souls_modifier:0 "Devorador de almas"
 zettler_eater_of_souls_modifier_desc:0 "El hermano mediano, el que lo consumirá todo al final".

 zettler_defiler_modifier:0 "Profanador"
 zettler_defiler_modifier_desc:0 "El hermano mayor, que corrompe todo lo que toca".

 zettler_decision:0 "Los tres hermanos"
 zettler_decision_tooltip:1 "El dragón te habla, complacido por tu devoción".
 zettler_decision_desc:0 "Las tres cabezas del dragón representan cada una un aspecto diferente y distintos beneficios que aprovechar para tus objetivos."
 zettler_decision_effect_tooltip:1 "Elegirás entre los tres aspectos durante los próximos cinco años." 
 zettler_decision_confirm:0 "Una ayuda divina..."
  
 PODcanon_chars.42.t:0 "El dragón de tres cabezas"
 PODcanon_chars.42.desc:0 "Tu patrón es una entidad poderosa, pero aún misteriosa incluso para ti. Lo que has deducido hasta ahora es su división en tres "cabezas" que son criaturas casi diferentes, pero que siguen formando parte del todo de alguna manera.\NCada una anhela tu devoción y promete recompensas si la cumples."
 PODcanon_chars.42.a:0 "La bestia de la guerra"
 PODcanon_chars.42.b:0 "El devorador de almas"
 PODcanon_chars.42.c:0 "El profanador"
 PODcanon_chars.42.d:0 "No voy a elegir ahora mismo"
 podintroductions.178.t:0 "Su historia hasta ahora"
 podintroductions.178.desc:0 "Lady Adolana, mientras la Herejía [cainita|E] se desmorona a tu alrededor, has aprovechado este caos para conseguir un puesto en la Sede de Nod a pesar de tu corta edad. Desde que llegaste aquí, has sospechado mucho del actual Arzobispo de Nod, que parece extrañamente despreocupado por el estado crítico de tu Iglesia. ¿Tal vez sea hora de un cambio de liderazgo? Podrías insistir en el asunto en la próxima sesión de la Curia, asegurándote de que todo el mundo conoce tu ambición... lo que puede ser un arma de doble filo, obviamente".
 podintroductions.178.a:0 "¡Necesitamos un cambio!"
 podintroductions.178.b:0 "El Arzobispo tiene todo mi apoyo".

 josef_terrified_modifier:0 "Bajo presión"
 josef_terrified_modifier_desc:0 "Shaagra va a por ti, puedes sentirlo. Debes mirar a tus espaldas ahora mismo"

 podintroductions.179.t:0 "Su historia hasta ahora"
 podintroductions.179.desc:0 "Señor Josef, has estado trabajando duro para asegurar Praga después de tu revuelta contra el gobierno tiránico del último Príncipe, pero ya ha surgido un nuevo problema.\NShaagra, la que gobernó Bohemia en la antigüedad, ha despertado y se ha hecho fácilmente con el control de la parte oriental del país. Seguramente querrá más, y tú estás justamente aterrorizado por lo que un ser tan antiguo podría hacerte. Debes encontrar la manera de deshacerte de ella".
 podintroductions.179.a:0 "¡Aún hay esperanza!"
 josef_intro_tooltip:0 "Como Josef, tienes un modificador inicial que puede mejorarse al lograr una decisión especial."

 josef_breathing_modifier:0 "Sala de respiración"
 josef_breathing_modifier_desc:0 "Shaagra está fuera de juego y puedes volver a respirar... metafóricamente, claro".

 josef_decision:0 "El destino de Bohemia"
 josef_decision_tooltip:1 "¡Ya viene!"
 josef_decision_desc:0 "Shaagra, el antiguo terror que una vez gobernó Bohemia con puño de hierro, ha vuelto. Y desde luego no le gustará que te quedes con una parte tan grande de su tierra "legítima"".
 josef_decision_confirm:0 "...Uf"
 josef_custom_decision:0 "Shaagra debe estar muerta"

 podintroductions.180.t:0 "Su historia hasta ahora"
 podintroductions.180.desc:0 "Señor Tarique, La Meca y Medina están seguras en manos piadosas [ashirra|E] en gran parte gracias a usted. Otras ciudades importantes como El Cairo, Damasco y Córdoba siguen en conflicto o controladas por los enemigos de la fe. ¡No se puede permitir que esto continúe! Ustedes conocen su deber y no se detendrán hasta que la [ashirra|E] proteja a los fieles desde Arabia hasta Iberia".
 podintroductions.180.a:0 "El Hajj triunfará".
 tarique_intro_tooltip:0 "Como Tarique, tienes el objetivo especial de asegurar las ciudades más importantes del Islam."

 tarique_guardian_modifier:0 "Guardián de las ciudades sagradas"
 tarique_guardian_modifier_desc:0 "El prestigio y la piedad del Guardián son conocidos por doquier. Uno de los raros [cainitas|E] verdaderamente dedicados a una causa".

 tarique_decision:0 "Guardián de las Ciudades Sagradas"
 tarique_decision_tooltip:1 "Su deber es claro".
 tarique_decision_desc:0 "Has renacido en la gracia de La Meca y quieres permitir esta bendita experiencia a otros. Por ello, hay que proteger las ciudades más importantes de la fe".
 tarique_decision_confirm:0 "Mi deber está cumplido".
 
 podintroductions.181.t:0 "Su historia hasta ahora"
 podintroductions.181.desc:0 "Señor Malaquita, el tiempo de vagar y desesperar ha terminado. Debes actuar. Los latinos están bien atrincherados en Constantinopla, y esta afrenta a la memoria de Miguel no debe permanecer. Fuiste su roca, su protegido y ahora debes pagar su bondad salvando su legado.\N-Constantinopla es eterna. El sueño es eterno. Asegúrate de que los malditos latinos lo entiendan pronto".
 podintroductions.181.a:0 "No fuimos dignos, Patriarca".
 malachite_intro_tooltip:0 "Como Malachite, obtienes recompensas adicionales si completas el objetivo "Soñar de nuevo"."

 pod1230objectives.6.c:0 "Saben quién soy".
 pod1230objectives.6.custom.malachite:0 "Esta opción está disponible porque estás jugando con Malaquita."

 podintroductions.182.t:0 "Tu historia hasta ahora"
 podintroductions.182.desc:0 "Lady Mnemach tu atención está dividida.\NPor un lado, las consecuencias del golpe de Salianna dejan a Francia en una posición vulnerable. Usted tiene muchos contactos y suficiente influencia que podría capitalizar para finalmente devolver esta tierra a sus raíces antiguas.\NPor otro lado, finalmente tiene a su hermana de vuelta. Sin embargo, Suleviae tiene la mente completamente rota por siglos de condicionamiento Ventrue, y apenas te reconoce. La quisiste mucho una vez, y ayudarla podría tal vez devolverle sus recuerdos. Pero no puedes hacer esa ardua tarea y a la vez entrar en la arena política francesa".
 podintroductions.182.a:0 "La familia es la familia".
 podintroductions.182.b:0 "Ese tiempo ya pasó".
 podintroductions.183.t:0 "Su historia hasta ahora"
 podintroductions.183.desc:0 "Señor Lukas, a pesar de haber sido Abrazado por un Nosferatu, has conseguido salvar tu perfecta belleza... por un precio. Tu patrón infernal te pidió 100 almas en tus primeros 100 años de existencia y ya las cumpliste pero... ahora quiere más y a un ritmo más rápido.\NPero no tienes opción ya que cualquier sacrificio vale la pena si puedes mantener tu apariencia juvenil. Es hora de abrir tu Monasterio Ahogado y expandirte. Necesitarás más gente para atrapar y corromper mientras tu benefactor esté hambriento de más. Pronto estará satisfecho... ¿verdad? "
 podintroductions.183.a:0 "La perfección encarnada".
 lukas_intro_tooltip:0 "Como Lukas, tu patrón infernal te pedirá periódicamente un sacrificio de tu desarrollo de capital (si tienes suficiente) o de miembros de tu corte seleccionados al azar. Puedes negarte, pero la cordura de Lukas probablemente no soportará que se le niegue su belleza una vez más".

 PODcanon_chars.43.t:0 "El precio de la perfección"
 PODcanon_chars.43.desc:0 "Tu patrón ha vuelto, recordándote la deuda que tienes que pagar. Hay que hacer sacrificios, literalmente, para salvar tu inmaculado pellejo.\NSi tu capital está lo suficientemente poblado, podrías sacrificar parte de él. De lo contrario, tendrás que dejar que el demonio escoja tu corte. O... podrías negarte a jugar este espantoso juego por completo, pero ya sabes el coste..."
 PODcanon_chars.43.a:0 "¿Quién echará de menos a unos tontos mortales?"
 PODcanon_chars.43.b:0 "Los cortesanos, ¿para qué sirven?"
 PODcanon_chars.43.c:0 "...no puedo más".
 lukas_sacrifice_dev_tt:0 "Debes tener un capital con más de 5 de desarrollo para mantener esta opción disponible en futuras peticiones."
  
 gregor_knight_modifier:0 "Caballero de la Dama"
 gregor_knight_modifier_desc:0 "Gregor vive en su propio mundo de fantasía en el que nunca debe alejarse del lado de la Dama de su amada."

 podintroductions.184.t:0 "Su historia hasta ahora"
 podintroductions.184.desc:0 "Temible Gregor, por fin has encontrado un propósito para tu vida. Esos patéticos Caballeros Teutónicos tenían demasiado miedo de tu fuerza como para aceptarte, pero la Dama de las Espinas es diferente.\NA ella no le importa tu llamada 'crueldad' e incluso te hace sentir más fuerte que nunca. Necesita un campeón diligente y tú eres el elegido. Sin embargo, parece posesiva y no le gusta que te alejes demasiado de ella, lo que podría ser un problema a largo plazo.\N¡No importa, tienes monstruos que matar en su nombre!"
 podintroductions.184.a:0 "Un caballero perfecto para la dama perfecta".
 gregor_intro_tooltip:0 "Como Gregor, tienes una decisión especial menor en la que puedes pedir más ayuda a la Dama o cortar lazos con ella."

 gregor_decision:0 "Encuentro con la Dama"
 gregor_decision_tooltip:1 "Soy su leal servidor".
 gregor_decision_desc:0 "La Dama te concede la fuerza, pero puede ayudarte aún más si lo deseas. O puedes intentar cortar lazos con ella si es demasiado posesiva para tu gusto".
 gregor_decision_confirm:0 "A tu servicio".
 gregor_decision_effect_tooltip:0 "Te reunirás con la Dama. Puede darte poder durante un tiempo, o podrías cortar los lazos con ella".
 
 PODcanon_chars.44.t:0 "La Dama de las Espinas"
 PODcanon_chars.44.desc:0 "En lo más profundo de su bosque, la Dama te espera, tan hermosa como la primera noche que la conociste. Sonríe y te agradece calurosamente tu servicio continuo.\NComo la gentil y amable patrona que es, sin duda escuchará tus peticiones si tienes alguna. O puede que tenga una propia".
 PODcanon_chars.44.a:0 "Solicito humildemente su bendición".
 PODcanon_chars.44.b:0 "¿Nuevos sirvientes? Por supuesto, mi señora".
 PODcanon_chars.44.c:0 "¡Esta locura debe terminar!"
 gregor_briey_tooltip:0 "Debes controlar el condado de Briey para mantener esta opción disponible".
 PODcanon_chars.44.d:0 "La visitaré en otro momento".
 gregor_is_done_tooltip:0 "No podrás interactuar con la Dama en el futuro".

 podintroductions.185.t:0 "Su historia hasta ahora"
 podintroductions.185.desc:0 "Afamado Zelios, ya eres conocido como el arquitecto más hábil del mundo de la noche. Llevas décadas construyendo castillos y mansiones para los señores y damas no-muertos. Una corazonada te ha llevado a Transilvania, donde la propia tierra parece... diferente. Estas extrañas energías geománticas están pidiendo ser aprovechadas por tus magistrales manos, y no puedes esperar a empezar."
 podintroductions.185.a:0 "¿El mejor material?"
 zelios_intro_tooltip:0 "Como Zelios, tienes acceso a un edificio especial, el Taller de Zelios".
  building_type_architect_workshop_01:0 "Taller de Zelios"
 building_type_architect_workshop_01_desc:1 "#F Todo edificio comienza con una buena herramienta en la mano de un buen artesano."
 building_architect_workshop_01:0 "Taller de Zelios"
 building_architect_workshop_01_desc:1 "Zelios tiene su propio taller aquí, preparando sus planos y a sus aprendices para algunas construcciones magistrales que están por venir."
  
 podintroductions.186.t:0 "Su historia hasta ahora"
 podintroductions.186.desc:0 "Señor Chandraputra, conoces tu deber.|nLa guerra está en tu sangre y tu [Sire|E] te confió la prestigiosa, pero difícil, tarea de asegurar finalmente la India para los Ravnos. Los malditos asuratizayya son fuertes oponentes y los otros [cainitas|E] indios no están ayudando al no someterse a tu justo liderazgo. No importa, triunfarás tarde o temprano.\NEres el firme regente y caudillo de tu [Clan|E]. Prepara tus ejércitos, reúne a tus tropas y marcha hacia la victoria".
 podintrotions.186.a:0 "Nuestro destino se escribirá con sangre".
 chandraputra_intro_tooltip:0 "Como Chandraputra, tienes acceso a una decisión menor especial para mejorar tus habilidades en la guerra."

 chandraputra_decision:0 "Los tambores de guerra"
 podintroductions.186.a:0 "Nuestro destino estará escrito con sangre."
 chandraputra_decision_tooltip:1 "La guerra es un asunto complicado, debes estar preparado".
 chandraputra_decision_desc:0 "Has sido un maestro de la guerra desde tus días de mortal hace tanto tiempo. Aun así, siempre se puede mejorar".
 chandraputra_decision_confirm:0 "Nuevas tácticas para un viejo general".
 chandraputra_decision_effect_tooltip:0 "Centrarás tus esfuerzos en un tema específico relacionado con la guerra durante los próximos cinco años, recibiendo alguna bonificación."
 
 chandraputra_martial_modifier:0 "Maestro de la guerra"
 chandraputra_martial_modifier_desc:0 "Un ejército dirigido por Chandraputra parece ser sobrenaturalmente rápido y presiona sin apenas necesitar respiro."

 chandraputra_knights_modifier:0 "Entrenamiento intenso"
 chandraputra_knights_modifier_desc:0 "Sus campeones nunca llegarán a ser lo suficientemente buenos para su gusto. Pero pueden acercarse a ello con un poco de taladro a la antigua usanza".

 PODcanon_chars.45.t:0 "Los tambores de guerra"
 PODcanon_chars.45.desc:0 "Ni siquiera tus amplios conocimientos bélicos son siempre suficientes para asegurar la victoria. Siempre hay nuevas tácticas que estudiar, nuevos métodos de entrenamiento que idear o nuevos planes de batalla que trazar. Debes ser diligente".
 PODcanon_chars.45.a:0 "La velocidad es siempre la clave".
 PODcanon_chars.45.b:0 "¡Quiero que se prepare un simulacro de batalla ahora mismo!"
 PODcanon_chars.45.c:0 "Quiero informes sobre las recientes batallas mortales".
 PODcanon_chars.45.d:0 "¿Os llamáis campeones?"
 
 podintroductions.187.t:0 "Su historia hasta ahora"
 podintroductions.187.desc:0 "Lady Karmenita, has estado tan ocupada promoviendo tu nueva casta de Ravnos que no viste la caída en el pecado de tu childe, Iago Castille, hasta que fue demasiado tarde.\NTu otrora prometedor estudiante es ahora un mero bandido, saqueando los mares desde su refugio en Córcega. Este no es el legado que quieres para tu linaje.\NPodrías intentar enviarle un mensaje, aliviando tus relaciones con la esperanza de una futura reconciliación. O tal vez sea mejor olvidarse realmente de él".
 podintroductions.187.a:0 "No es demasiado tarde para nosotros, childe".
 podintroductions.187.b:0 "Está demasiado lejos".

 podintroductions.188.t:0 "Su historia hasta ahora"
 podintroductions.188.desc:0 "Intrépido Iago, eres el amo del Mediterráneo... o esperas serlo al menos. Tu refugio pirata en Córcega podría llevarte a tiempo.\NDeja a los arrogantes Príncipes con sus mezquinos planes, tú sabes dónde está el verdadero poder y eres lo suficientemente astuto como para tomarlo por cualquier medio.\NCuando todos los marineros del Mediterráneo teman tu nombre y tus cofres rebosen de oro... ¡es entonces cuando triunfarás de verdad!"
 podintroductions.188.a:0 "¡Todos a cubierta!"
 iago_intro_tooltip:0 "Como Iago, tienes la decisión especial de buscar saqueos y riquezas".

 iago_decision:0 "Zarpar"
 iago_decision_tooltip:1 "La tripulación está inquieta, ¿es hora de zarpar quizás?"
 iago_decision_desc:0 "Gobernar está muy bien, pero necesitas el viento a tu espalda y un saqueo por delante para sentirte realmente vivo. O casi, al menos".
 iago_decision_confirm:0 "¡El viento está a nuestra espalda!"
 iago_decision_effect_tooltip:0 "Se te presentará una selección de objetivos".
 
 iago_crew_weakened_modifier:0 "Tripulación debilitada"
 iago_crew_weakened_modifier_desc:0 "Algunos de tus marineros nunca volvieron del último saqueo, lo que debilita un poco tu dominio sobre tu reino."
 
 iago_crew_depleted_modifier:0 "Tripulación agotada"
 iago_crew_depleted_modifier_desc:0 "Muchos de tus marineros nunca volvieron del último saqueo, debilitando tu dominio sobre tu reino."
 
 iago_crew_empty_modifier:0 "Sin tripulación"
 iago_crew_empty_modifier_desc:0 "Tu tripulación murió casi hasta el último hombre en el último saqueo, debilitando gravemente tu dominio sobre tu reino."
 PODcanon_chars.46.t:0 "El príncipe pirata zarpa"
 PODcanon_chars.46.desc:0 "Tu tripulación está lista para partir y hay muchos objetivos ricos disponibles. La elección que tienes que hacer es sobre la dificultad del botín. Cuanto más difícil sea, mejor será la recompensa, pero más miembros de tu tripulación perderás durante el abordaje. Si están muertos, obviamente ya no podrán ayudarte en casa".
 PODcanon_chars.46.a:0 "Presas pequeñas, riesgos pequeños".
 PODcanon_chars.46.b:0 "Este parece bien equilibrado".
 PODcanon_chars.46.c:0 "¡El mayor botín de todos!"
 PODcanon_chars.46.d:0 "No hay que navegar por ahora".
 
 podintroductions.189.t:0 "Su historia hasta ahora"
 podintroductions.189.desc:0 "Señor Mritunjay, después de una larga espera y una cuidadosa planificación, por fin has asegurado Bagdad para ti. O tal vez no, ya que la corte está cada vez más preocupada por la llamada 'Horda Mongola', esos jinetes mortales que están atacando el Califato en estos momentos. No estás convencido, ya que fueron derrotados recientemente en Irbil, pero oyes la petición de cautela de tus consejeros. ¿Quizás podrías guardar parte del botín de tu victoria en reserva si se cumplen estos funestos presagios?"
 podintroductions.189.a:0 "Puedo esperar un poco más antes de disfrutar de la no-vida".
 podintroductions.189.b:0 "¡Mi dinero para hacer lo que quiera!"
 mritunjay_intro_tooltip:0 "Planearás con antelación por si los mongoles se acercan a tu ciudad".

 baghdad_recovering_modifier:0 "Recuperando"
 baghdad_recovering_modifier_desc:0 "Gracias a tu cuidadosa planificación, el daño causado por el ejército mongol podría haber sido mucho peor. La ciudad se está recuperando".
   
 PODcanon_chars.47.t:0 "El príncipe sabio"
 PODcanon_chars.47.desc:0 "El ejército mongol ha detenido por fin su saqueo y destrucción de la hermosa ciudad de Bagdad. Ha sido una experiencia angustiosa, pero gracias a tus cuidadosos preparativos, has podido salvar la mayor parte. Te estremece pensar lo que habría ocurrido si no hubieras estado tan preparado.\NBueno, el tiempo avanza como siempre, pero al menos tu querida Bagdad seguirá siendo un gran centro de aprendizaje y cultura gracias a tus esfuerzos."
 PODcanon_chars.47.a:0 "Elegí bien hace treinta años".
  
 podintroductions.190.t:0 "Su historia hasta ahora"
 podintroductions.190.desc:0 "Lady Marcia, has estado trabajando duro para completar tu tratado sobre [Clan|E] Ravnos y sus numerosas castas. Sin embargo, es posible que tengas que centrar tu atención en otro lugar durante un tiempo.|nDurante tus viajes, has notado la caída en la decadencia de una gran parte del [Clan|E], muy lejos de las nobles virtudes que tu [Sire|E] y tú defendéis. Si actúas con la suficiente rapidez, podrías ofrecer un punto de encuentro y un ejemplo a seguir para las generaciones más jóvenes, quizás salvando el legado de tu [Clan|E] en el proceso. Incluso podrías escribir un capítulo o dos sobre ello en tu Magnus Opum si tienes tiempo".
 podintroductions.190.a:0 "Hora de actuar".
 marcia_intro_tooltip:0 "Como Marcia, tienes una decisión especial para centrarte en tus escritos durante un tiempo, lo que te permite elegir entre varios estilos de vida extra."
 
 marcia_decision:0 "De [Clan|E] Ravnos"
 marcia_decision_tooltip:1 "No hay tiempo para el bloqueo del escritor".
 marcia_decision_desc:0 "No has olvidado tu interminable trabajo de referenciar cada linaje de [Clan|E] Ravnos. Deberías continuar".
 marcia_decision_confirm:0 "¿Qué tema será...?"
 marcia_decision_effect_tooltip:0 "Se te presentará una selección de temas en los que centrarte".
 
 PODcanon_chars.48.t:0 "Del Clan Ravnos"
 PODcanon_chars.48.desc:0 "A medida que continúas tu visión general de los distintos linajes de tu [Clan|E], aprendes más y más sobre sus especialidades. Como con cualquier buen libro, estás bastante seguro de que acabarás aprendiendo tanto haciéndolo como lo harán tus lectores al leerlo."
 PODcanon_chars.48.a:0 "Los faeditas, orgullosos caballeros".
 PODcanon_chars.48.b:0 "Los Phuri Dae, taimados embaucadores".
 PODcanon_chars.48.c:0 "Los alejandrinos, astutos mercaderes".
 PODcanon_chars.48.d:0 "Los bashiritas, astutos fanáticos".
 
 podintroductions.191.t:0 "Su historia hasta ahora"
 podintroductions.191.desc:0 "Lady Zoe, tras perder tu ciudad y a tu [Sire|E] en rápida sucesión, estuviste a punto de perderte en la desesperación y la ira. Afortunadamente, Anatole te acogió bajo su ala y ambos crecisteis para ser mejores personas por ello.|nTe sientes claramente en deuda con él y por eso has aceptado seguir su última búsqueda en el sur de Francia. ¿Quizás es aquí donde finalmente encontrarás un propósito para tu vida? Mucha gente perdió tanto como tú a causa de la Cruzada Albigense, y tú podrías ayudarles a reconstruir. Estás seguro de que Anatole estará de acuerdo con este plan, y probablemente incluso te ayudaría de nuevo si pudiera".
 podintroductions.191.a:0 "¿Tal vez un nuevo hogar?"
 zoe_intro_tooltip:0 "Como Zoe, tienes una interacción de personaje especial con Anatole para pedirle ayuda."
 
 POD_zoe_interaction:0 "Crecer juntos"
 POD_zoe_interaction_desc:0 "Anatole y tú aún podéis aprender mucho el uno del otro".
 PODcanon_chars.49.t:0 "Dos almas perdidas"
 PODcanon_chars.49.desc:0 "Anatole es un hombre complicado, a menudo perdido en sus visiones. Pero cuando está presente mentalmente, siempre ha sido amable y paciente contigo. A menudo te dice crípticamente que eres uno de sus "anclas" en el mundo real, y parece genuinamente agradecido por tu amistad.\NEn cualquier caso, el tiempo que pasáis juntos siempre acaba con ambos ganando una nueva perspectiva de las cosas. Un largo viaje hacia la sabiduría, pero uno con un amigo a tu lado al menos".
 PODcanon_chars.49.a:0 "Vamos a charlar esta noche".
 PODcanon_chars.49.b:0 "¿Qué hay de... Ya veo".
 PODcanon_chars.49.c:0 "¿Has tenido una visión? Podemos entenderla juntos".
 PODcanon_chars.49.d:0 "Rezar... podría ayudar".
 
 etienne_support_modifier:0 "Vasallo nominal de Jurgen"
 etienne_support_modifier_desc:0 "Jurgen von Verden sigue considerándote su vasallo y te ofrece apoyo y ayuda, a pesar de las grandes distancias."
   
 podintroductions.192.t:0 "Su historia hasta ahora"
 podintroductions.192.desc:0 "Lord Etienne, estáis atrapado entre dos fuerzas opuestas. Tras la reciente Cruzada, habéis asegurado vuestro control sobre Acre gracias a la ayuda de los caballeros alemanes de Jurgen von Verden, y a cambio le habéis jurado fidelidad. Pero el reciente nacimiento de la Dieta de los Olivos os ha presionado.\NSu líder, Qawiyya el Ghaduba, quiere vuestra lealtad ya que estáis claramente en su esfera de influencia. Jurgen está demasiado lejos para que le importe, pero ha prometido apoyarte si, al menos nominalmente, sigues siendo su vasallo. Sin embargo, esto probablemente enfurecería a Qawiyya".
 podintroductions.192.a:0 "Tengo que ser pragmático aquí".
 podintroductions.192.b:0 "Me mantendré fiel a mi palabra".
   
 podintroductions.193.t:0 "Su historia hasta ahora"
 podintroductions.193.desc:0 "Lady Kemintiri, acabas de despertar de un largo [torpor|E] después de una espantosa lucha contra uno de los engendros malditos de Set. Has aguantado, como siempre lo haces.\N-Set te quitó todo, excepto la única cosa que realmente quería, y tú le devolverás el favor. Su lamentable linaje de compinches y aduladores debe ser purgado. Es cierto que estás solo contra todo el poder de un [Clan|E] entero, pero... hay una razón muy real por la que ya te temen. Y tú les darás más en el futuro".
 podintroductions.193.a:0 "Espero que estés mirando".
 kemintiri_intro_tooltip:0 "Como Kemintiri, tienes el objetivo especial de destruir el culto de Set".
  
 kemintiri_decision:0 "La venganza de Isis"
 kemintiri_decision_tooltip:1 "La serpiente debe ser aplastada".
 kemintiri_decision_desc:0 "Una vez que los setitas y su culto maldito hayan desaparecido y el nombre de Set haya sido hundido en el fango... entonces estarás a mano con él".
 kemintiri_decision_confirm:0 "Isis se apiadó de mí".
 kemintiri_decision_effect_tooltip:0 "La religión setita desaparecerá, convirtiéndose sus adeptos a la Via Humanitatis en su lugar."
   
 podintroductions.194.t:0 "Su historia hasta ahora"
 podintroductions.194.desc:0 "Señor Andreas, tienes fama de ser un justo y fiable jefe de caravanas. Es cierto que a menudo utilizas estos viajes para predicar la gloria de Set, pero, no obstante, siempre cumples tu palabra.\NHas hecho recientemente una parada en esta región, dedicando tiempo a enseñar a tus nuevos reclutas su papel en los planes de Set y, lo que es menos importante, en tu caravana. Pronto será el momento de partir una vez más, pero los caminos son cada vez más difíciles. Tal vez sería prudente mantener esta zona como una especie de base de operaciones entre tus viajes".
 podintroductions.194.a:0 "Honra a Set, y honra tu palabra".
 andreas_intro_tooltip:0 "Como Andreas, puedes usar una decisión menor para embarcarte en los viajes de la caravana para obtener varias recompensas a costa de estar lejos durante un tiempo."
    
 andreas_decision:0 "El maestro de la caravana"
 andreas_decision_tooltip:1 "Vamos a revisar las posibilidades".
 andreas_decision_desc:0 "Como maestro de caravanas de renombre, siempre tienes oportunidades de aceptar diversas proposiciones de [cainitas|E] errantes."
 andreas_decision_confirm:0 "Hablemos de negocios".
 andreas_decision_effect_tooltip:0 "Se te ofrecerán varias ofertas de trabajo".
  
 andreas_away_modifier:0 "El jefe de la caravana"
 andreas_away_modifier_desc:0 "Andreas está guiando una de sus caravanas, lo que le hace moverse mucho y no centrarse realmente en su reino por el momento."
   
 PODcanon_chars.50.t:0 "El jefe de la caravana"
 PODcanon_chars.50.desc:0 "Siempre tienes muchas ofertas para trabajar como guía gracias a tu reputación estelar. Como es habitual, también aprovecharás este tiempo fuera de tu reino para difundir la palabra de Set a lo largo y ancho, pero queda una duda: ¿Cuánto durará el viaje? Hay límites en el tiempo que puedes pasar en el extranjero sin que tu reino sufra".
 PODcanon_chars.50.a:0 "Un pequeño viaje estará bien".
 PODcanon_chars.50.b:0 "Puedo arreglármelas".
 PODcanon_chars.50.c:0 "El reino estará bien sin mí".
 PODcanon_chars.50.d:0 "Me necesitan aquí".
 podintroductions.195.t:0 "Tu historia hasta ahora"
 podintroductions.195.desc:0 "Señor Nakhthorheb, eres el regente de Set hasta que él considere que el mundo es lo suficientemente digno como para volver. Pero tienes que trabajar con los otros Hierofantes. Esta augusta asamblea te desafía sabiamente la mayor parte del tiempo, pero aún así ofrecen consejos útiles cuando son necesarios. Como guardián principal de Set, es tu deber proteger al [Clan] y llevar a los infieles al redil. Un proceso largo, sin duda, pero tienes la eternidad de tu lado".
 podintroductions.195.a:0 "Gloria al Maestro de Duat".
 nakh_intro_tooltip:0 "Como Nakhthorheb, puedes usar una decisión menor para convocar una reunión de los Hierofantes mientras Seterpenre y Maatkare estén vivos."
     
 nakh_decision:0 "Reunión de los Hierofantes"
 nakh_decision_tooltip:1 "Tenemos que hablar".
 nakh_decision_desc:0 "Como líder principal del [Clan|E] Setite, todavía tienes que escuchar otras opiniones sobre la situación. Tus compañeros hierofantes son los más dignos de confianza para ese papel".
 nakh_decision_confirm:0 "En la agenda de esta noche..."
 nakh_decision_effect_tooltip:0 "Se le ofrecerá un curso de acción para los próximos cinco años".
 nakh_custom_decision:0 "Esta decisión estará disponible mientras Seterpenre o Maatkare estén vivos."

 seterpenre_advice_modifier:0 "Consejo de Seterpenre"
 seterpenre_advice_modifier_desc:0 "El previsor Seterpenre siempre quiere centrarse en la relación con el extranjero y la imagen de su [Clan|E]."
   
 maatkare_advice_modifier:0 "El consejo de Maatkare"
 maatkare_advice_modifier_desc:0 "El paciente Maatkare quiere centrarse en tu propia tierra, haciendo de Egipto el lugar más grande de la Tierra, digno del regreso de Set."
   
 PODcanon_chars.51.t:0 "Reunión de los hierofantes"
 PODcanon_chars.51.desc:0 "Este tipo de eventos son siempre muy predecibles. Los vampiros no cambian mucho después de todo, y sus posiciones políticas tampoco. Como el Hierofante más importante de todos, te permites el lujo de tener siempre la última palabra, pero incluso tú sabes que, a veces, escuchar los consejos de los demás puede ser gratificante."
 PODcanon_chars.51.a:0 "Seterpenre, seguiremos tu plan".
 PODcanon_chars.51.b:0 "Maatkare, esta vez tienes razón".
 PODcanon_chars.51.c:0 "¡Haremos las cosas a mi manera!"
   
 podintroductions.196.t:0 "Tu historia hasta ahora"
 podintroductions.196.desc:0 "Lady Neferu, su Corte del Fuego crece en poder cada noche. Pero puedes hacer más.\NTu reputación como ama de los misterios y la corrupción es bien merecida y hay pocos seres que puedan abandonar la Corte sin prometer su alma eterna a Set. Esta es una reputación que debes fomentar, ya que ayudará a tu ascenso en la jerarquía de Set. Pronto, todos aprenderán a temer y amar tu tierno cuidado en igual medida".
 podintroductions.196.a:0 "Bienvenido, disfruta de tu estancia..."
 neferu_intro_tooltip:0 "Como Neferu, tienes una opción especial de liberación para tus prisioneros utilizando el Tribunal del Fuego."
      
 NEFERU_RELEASE:0 "Pruebas de la Corte del Fuego"
  
 sarrasine_running_modifier:0 "A la fuga"
 sarrasine_running_modifier_desc:0 "Los seguidores de Khay'Tall siguen dándote caza. Esto ciertamente complica las cosas".
    
 podintroductions.197.t:0 "Tu historia hasta ahora"
 podintroductions.197.desc:0 "Señor Sarrasine, las cosas no salieron como las había planeado. Tu [diablerie|E] de Khay'Tall falló y tuviste que hacer una huida apresurada para salvar tu pellejo de sus furiosos seguidores. Es hora de recuperarse. Te has unido a los restos de la 4ª Cruzada ya que percibes debilidad en ellos, podrían ser derribados desde dentro y los griegos están demasiado ocupados retomando Constantinopla como para aprovechar la oportunidad. Por lo tanto, podrías ser capaz de forjar tu propio feudo en Anatolia antes de que nadie más pueda reaccionar. Sólo entonces serás lo suficientemente fuerte como para evitar definitivamente a tus perseguidores".
 podintroductions.197.a:0 "Es hora de mudar de piel".
 sarrasine_intro_tooltip:0 "Como Sarrasine, empiezas con un modificador negativo del que te puedes librar con una decisión especial."
        
 sarrasine_decision:0 "Fin de la línea"
 sarrasine_decision_tooltip:1 "Estoy cansado de correr".
 sarrasine_decision_desc:0 "Los seguidores de Khay'Tall sólo dejarán de cazarte cuando te vuelvas lo suficientemente fuerte como para asustarlos. ¿Qué mejor lugar para hacerlo que el desmoronado Imperio Bizantino?"
 sarrasine_decision_confirm:0 "¿Quién huye ahora?"

 podintroductions.198.t:0 "Su historia hasta ahora"
 podintroductions.198.desc:0 "Señor Arnulf, su culto de Jormungandr está creciendo muy bien, bastante ayudado por la agitación en la región. El más importante es Valdis, tu propio hijo, que tiene ideas extravagantes sobre un culto "adecuado" a los dioses escandinavos. Seamos honestos por un segundo, estás aquí por el dinero y el poder y estás más que feliz dejando las cosas divinas a los sacerdotes.\NSin embargo, podrías necesitar a Valdis en el futuro y hacer incursiones hacia una reconciliación, incluso tan insincera como sería, podría ser un movimiento sabio."
 podintroductions.198.a:0 "¡Claro que me importan los dioses, Valdis!"
 podintroductions.198.b:0 "No, es una causa perdida".

 podintroductions.199.t:0 "Su historia hasta ahora"
 podintroductions.199.desc:0 "Señor Jean-Baptiste, su vida tiene muy buena pinta. Sus comienzos fueron difíciles, pero se recuperó muy bien y ahora es uno de los "empresarios nocturnos" más exitosos de Francia. Hay dinero para hacer, y si el dicho sobre el dinero y el poder es cierto, usted está a punto de convertirse en muy poderoso muy pronto."
 podintroductions.199.a:0 "¡Es hora de ampliar mis actividades!"
 jean_intro_tooltip:0 "Como Jean-Baptiste, tienes acceso a una cadena de edificios única: Influir en la vida nocturna."
   
 building_type_influence_night_life_01:0 "Influir en la vida nocturna"
 building_type_influence_night_life_01_desc:1 "El agudo sentido de los negocios de #F Jean-Baptiste puede ser aprovechado en esta provincia."
 building_influence_night_life_01:0 "Influencia en las salas de juego"
 building_influence_night_life_01_desc:1 "La casa siempre gana".
 building_influence_night_life_02:0 "Influyendo en las tabernas"
 building_influence_night_life_02_desc:1 "Olvida tus penas, pero no tu cartera".
 building_influence_night_life_03:0 "Influyendo en los burdeles"
 building_influence_night_life_03_desc:1 "Donde supuestamente no va nadie, pero de todas formas están misteriosamente llenos cada noche".
  
 podintroductions.200.t:0 "Su historia hasta ahora"
 podintroductions.200.desc:0 "Lord Goratrix, a pesar de todo lo que has hecho por la Casa, el propio Tremere te exilió a Francia. Claramente es un síntoma de una enfermedad mayor que carcome a su [Clan|E].\N¡Y no es ese bufón parlanchín de Etrius el que va a descubrir la verdad! Ese idiota sigue tratando de socavarte, incluso cuando ha sido nombrado Regente de la Casa Tremere. No importa, utilizarás la fértil situación política de Francia para crear tu propia base de poder, y luego volverás triunfante al corazón de los Tremere. Salvarás a tu Casa, incluso de sí misma si es necesario".
 podintroductions.200.a:0 "Volveré".
 goratrix_intro_tooltip:0 "Como Goratrix, sufrirás las travesuras de Etrius mientras esté vivo".
    
 PODcanon_chars.52.t:0 "Las travesuras de Etrius"
 PODcanon_chars.52.desc:0 "Se ha descubierto uno de los complots de Etrius para socavaros. Como siempre, se trata de un débil intento de una falta de mente débil. Lamentablemente, sigue perturbando tus propios planes para el futuro inmediato y tendrás que lidiar con ello de alguna manera."
 PODcanon_chars.52.a:0 "Sobornar a los tontos que trabajan para él".
 PODcanon_chars.52.b:0 "¡Tengo gente para ocuparme de esto!"
 PODcanon_chars.52.c:0 "¡Bien, lo haré yo mismo!"
    
 podintroductions.201.t:0 "Tu historia hasta ahora"
 podintroductions.201.desc:0 "Lady Meerlinda, a pesar de algunas dificultades, has sido capaz de establecer una fuerte presencia Tremere en Inglaterra. Sin embargo, Mithras no te está haciendo la vida fácil, y tendrás que vigilar sus próximos movimientos con cuidado.\NTambién has estado buscando información sobre el legendario Santo Grial y su efecto sobre los vampiros. Para ello, has identificado dos fuentes probables, los castillos de Avalon y de las Cenizas Amargas, donde residen dos órdenes de "caballeros vampiros". Si pudieras explorar estas fortalezas, podrías encontrar, si no el Grial en sí, al menos algunos datos interesantes sobre él".
 podintroductions.201.a:0 "Quizá yo sea la Morgan le Fay de estas tierras".
 meerlinda_intro_tooltip:0 "Como Meerlinda, tienes el objetivo especial de asegurar los dos castillos para obtener una recompensa".
    
 meerlinda_morgan_modificador:0 "Morgan le Fay renacida"
 meerlinda_morgan_modifier_desc:0 "Meerlinda no encontró el Grial, pero sin duda encontró algo. Ahora es la bella, poderosa y terrible Encantadora de estas islas".
         
 meerlinda_decision:0 "Fay de Inglaterra"
 meerlinda_decision_tooltip:1 "Las leyendas suelen tener una chispa de verdad".
 meerlinda_decision_desc:0 "Los castillos de Avalon y de las Cenizas Amargas seguro que albergan algunos secretos sobre el Santo Grial. Asegúralos y toma sus poderes ocultos para ti".
 meerlinda_morgan_modifier:0 "Morgan le Fay renace"
 meerlinda_decision_confirm:0 "...¿quién necesita a Arturo?"

 podintroductions.202.t:0 "Su historia hasta ahora"
 podintroductions.202.desc:0 "Señor Jervais, su ascensión continúa. Gracias a su gran conocimiento de la escena diplomática germánica, se le ha encomendado una misión gratificante, aunque difícil. Destruir a la líder de los cismáticos conocidos como 'Telyavelic Tremere', Deverra, y a los Gangrel que la apoyan.\NHas reunido a un grupo de compañeros de clan fiables y con talento, pero todavía te superan ampliamente en número los enemigos. Este podría ser tu mayor desafío hasta ahora".
 podintroductions.202.a:0 "Planifiquemos con cuidado".
 jervais_intro_tooltip:0 "Como Jervais, tienes el objetivo especial de deshacerte de Deverra y los Ferales de Livonia para obtener una recompensa."
   
 jervais_rising_modifier:0 "La estrella ascendente"
 jervais_rising_modifier_desc:0 "El ascenso de Jervais en la Pirámide de los Tremere continúa a un ritmo rápido, impresionando al [Clan|E] en su conjunto."
 jervais_decision:0 "La perdición de Livonia"
 jervais_decision_tooltip:1 "Debo acabar con este cisma antes de que se extienda".
 jervais_decision_desc:0 "Las órdenes de Etrius son claras. Matar a la líder de los telyavelicos, Deverra, y a los ferales de Livonia que la amparan".
 jervais_decision_confirm:0 "Misión cumplida".
 jervais_custom_decision:0 "Deverra debe estar muerta".
 jervais_custom_decision2:0 "Los Ferales de Livonia deben ser destruidos".

 rutor_running_modifier:0 "A la fuga"
 rutor_running_modifier_desc:0 "Los Tremere te quieren muerto por tu traición y te están cazando. Esto ciertamente complica las cosas".
   
 podintroductions.203.t:0 "Tu historia hasta ahora"
 podintroductions.203.desc:0 "Lord Rutor, ya tiene bastante con que le den órdenes, ya sea por parte de los Tzimisce o de los Tremere. No volverás a inclinarte ante nadie.\NHas escapado de la Casa Tremere corriendo hacia Dinamarca, una elección fortuita ya que la región carece de un poder vampírico fuerte y centralizado. ¿Tal vez podrías ser tú? Si actuaras con la suficiente rapidez y decisión para asegurar una base de poder sólida, tu [Clan|E] tendría que abandonar su persecución. Entonces, por fin te tocaría dar órdenes, una perspectiva muy tentadora, sin duda".
 podintroductions.203.a:0 "¿Un nuevo comienzo?"
 rutor_intro_tooltip:0 "Como Rutor, tienes una decisión especial para deshacerte de tu modificador de inicio."
   
 rutor_decision:0 "Fin de la línea"
 rutor_decision_tooltip:1 "Estoy cansado de correr".
 rutor_decision_desc:0 "[Clan|E] Los Tremere nunca dejarán de perseguirte, a menos que seas lo suficientemente fuerte como para hacerles parar. Es hora de convertirte en tu propio maestro".
 rutor_decision_confirm:0 "¿Quién huye ahora?"

 faithful_xavier_modifier:0 "Consejero leal"
 faithful_xavier_modifier_desc:0 "Un dechado de la élite Tremere, nadie duda del compromiso de Xavier con la causa."
   
 unfaithful_xavier_modifier:0 "¿Consejero leal?"
 unfaithful_xavier_modifier_desc:0 "Nadie duda del compromiso de Xavier con la causa... al menos en público".
   
 podintroductions.204.t:0 "Su historia hasta ahora"
 podintroductions.204.desc:0 "Señor Xavier, ha llegado al norte de África decidido a descubrir los misterios de este continente para gloria de su [Clan|E]. Al menos, esa es la versión oficial.\NEn verdad, el resto del consejo no estaba muy contento con tu decisión de dejarlos mientras el propio corazón está sitiado. Pero no les diste opción, ya que estás cansado de las mezquinas intrigas en casa y anhelas algo más grande. Tendrás que equilibrar cuidadosamente tus deberes oficiales con los Tremere con tu implacable búsqueda de conocimientos y secretos."
 podintroductions.204.a:0 "¡Por la gloria de [Clan|E] Tremere!"
 podintroductions.204.b:0 "Por la gloria de [Clan|E] Tremere..."
  
 therimna_secrets5_modifier:0 "Secretos que quedan: 5"
 therimna_secrets5_modifier_desc:0 "Estás vendiendo todo lo que sabes sobre [Clan|E] Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos".
  
 therimna_secrets4_modifier:0 "Secretos que quedan: 4"
 therimna_secrets4_modifier_desc:0 "Vendes todo lo que sabes sobre [Clan|E] Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos".
  
 therimna_secrets3_modifier:0 "Secretos que quedan: 3"
 therimna_secrets3_modifier_desc:0 "Estás vendiendo todo lo que sabes sobre [Clan|E] Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos".
  
 therimna_secrets2_modifier:0 "Secretos que quedan: 2"
 therimna_secrets2_modifier_desc:0 "Vendes todo lo que sabes sobre [Clan|E] Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos".
    
 therimna_secrets1_modifier:0 "Secreto a la izquierda : 1"
 therimna_secrets1_modifier_desc:0 "Vendes todo lo que sabes sobre [Clan|E] Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos".
    
 podintroductions.205.t:0 "Tu historia hasta ahora"
 podintroductions.205.desc:0 "Lady Therimna, los Tremere están acabados, lo sabes. Y tú no te hundirás con ese barco.\NHas escapado de tu [Clan|E] con muchos secretos interesantes sobre la hechicería de sangre en tu haber, secretos que muchos pagarían caro por adquirir. Estos podrían ser tu tabla de salvación, ya que eres demasiado importante como para matarte mientras los conserves... pero también eres un objetivo mucho más importante de derribar para los propios Tremere.\NTendrás que encontrar un equilibrio entre vender tus secretos por algún oro siempre importante y conservarlos por el margen de maniobra que te dan."
 podintroductions.205.a:0 "Mi supervivencia es lo único que importa".
 therimna_intro_tooltip:0 "Como Therimna, empiezas con 5 secretos que puedes vender mediante una decisión menor, cambiando el balance de malus y bonus que te dan."
 therimna_decision:0 "Ficha de negociación"
 therimna_decision_tooltip:1 "Todo tiene un precio".
 therimna_decision_desc:0 "Los secretos de la hechicería de sangre que posees te convierten en un objetivo para los Tremere, pero también te convierten en alguien demasiado importante para matar a los demás. ¿Estás dispuesto a cambiar esta relativa tranquilidad por oro?"
 therimna_decision_confirm:0 "Tienes un trato".

 podintroductions.206.t:0 "Su historia hasta ahora"
 podintroductions.206.desc:0 "Lady Virstania, por fin has encontrado consuelo y compañía en tus queridas Gárgolas. Lejos de la crueldad y la brutalidad del resto de tus hermanos, sólo ellos te entienden de verdad.\NTu corazón se resiente al pensar en dejar que vayan al matadero por las guerras insensatas de los Tremere. Por ahora, sin embargo, no tienes otra opción y debes jugar su juego. Pero te dedicas a cambiar eso muy pronto. Después de todo, tus hermosos bebés sólo pueden ser cuidados de verdad por su amorosa madre..."
 podintrotions.206.a:0 "La familia es lo único que importa".
 virstania_intro_tooltip:0 "Como Virstania, puedes usar una decisión para engendrar regimientos de hombres de armas Gárgolas."
    
 virstania_decision:0 "Hermosos bebés de piedra"
 virstania_decision_tooltip:1 "¡Vienen más de ellos!"
 virstania_decision_desc:0 "Eres la madre de las Gárgolas, y tienes que ayudarlas a cobrar vida correctamente. Una gran responsabilidad, pero también tu mayor alegría".
 virstania_decision_confirm:0 "Shhh... La madre está aquí".
 podintroductions.206.a:0 "La familia es todo lo que importa."
 virstania_decision_effect_tooltip:0 "Podrás elegir cuántas Gárgolas desovar".
   
 PODcanon_chars.53.t:0 "El parto"
 PODcanon_chars.53.desc:0 "El siguiente grupo de Gárgolas está casi listo. Sin embargo, los codiciosos Tremere ya están intentando quitárselas, y tendrás que actuar rápido si quieres salvarlas. ¿A cuántos ayudarás?"
 PODcanon_chars.53.a:0 "Al menos he salvado a algunos".
 PODcanon_chars.53.b:0 "¡Debo salvar a más!"
 PODcanon_chars.53.c:0 "¡Todos ellos!"
 PODcanon_chars.53.d:0 "No puedo ayudarles esta vez..."
 virstania_small_gargoyles_tt:0 "Un grupo de Gárgolas se añade a tus hombres de armas disponibles".
 virstania_medium_gargoyles_tt:0 "Se añaden dos grupos de Gárgolas a tus hombres de armas disponibles."
 virstania_high_gargoyles_tt:0 "Se añaden tres grupos de Gárgolas a tus hombres de armas disponibles."
       
 angry_fays_marconius_modifier:0 "Fae enfadado"
 angry_fays_marconius_modifier_desc:0 "Estás aprendiendo mucho experimentando con los misteriosos Fae... pero también te estás ganando poderosos enemigos."
   
 podintroductions.207.t:0 "Tu historia hasta ahora"
 podintroductions.207.desc:0 "Lord Marconius, has estado trabajando duro tratando de entender tu nueva condición como uno de los Kiasyd. Obviamente, el mejor curso de acción era "experimentar" con algunos Fae capturados, ya que pareces compartir algunas similitudes con ellos. También sabes que el [Clan|E] Lasombra está buscando cualquier signo de debilidad para atacarte, y este cisma con tus aliados podría ser lo que estaban esperando. Puede que tengas que tener cuidado al equilibrar tu sed de conocimiento y tu precaria alianza con los Fae".
 podintroductions.207.a:0 "Una situación desconcertante".
 marconius_intro_tooltip:0 "Como Marconius, tienes acceso a una decisión para equilibrar tu relación con los Fae".

 marconius_decision:0 "Tú y los Fae"
 marconius_decision_tooltip:1 "Cómo acercarte a ellos..."
 marconius_decision_desc:0 "Los Fae son una parte importante de tu reino, te guste o no. Como tal, tu postura hacia ellos debe ser cuidadosamente elegida".
 marconius_decision_confirm:0 "¿Es hora de reconsiderar mi elección?"
 marconius_decision_effect_tooltip:0 "Podrás elegir cómo acercarte a los Fae en el futuro inmediato".
    
 happy_fays_marconius_modifier:0 "Fae útil"
 happy_fays_marconius_modifier_desc:0 "Los Fae te consideran un aliado útil, aunque inconstante, y te prefieren en el trono que a otro vampiro por el momento."
   
 PODcanon_chars.54.t:0 "Tú y los Fae"
 PODcanon_chars.54.desc:0 "Tu reino está plagado de Fae, gracias a su importancia histórica entre los de su especie, y debes lidiar con ello. Son aliados útiles, especialmente contra las posibles represalias de tus compañeros de clan, pero también son sujetos de prueba muy interesantes para aprender más sobre tu condición de [cainita|E] tocado por los Fae. Decisiones, decisiones..."
 PODcanon_chars.54.a:0 "Lamentablemente, ahora mismo los necesito como aliados".
 PODcanon_chars.54.b:0 "Mantendré las distancias durante un tiempo".
 PODcanon_chars.54.c:0 "¡Tanto que aprender!"

 podintroductions.208.t:0 "Su historia hasta ahora"
 podintroductions.208.desc:0 "Señor Chinkhai, su deber es proteger a los Anda. Sin embargo, las estepas son extensas y tienes que vagar mucho para lidiar con los diversos problemas que surgen noche tras noche.\NEsto se ha agravado desde que tu pueblo ha comenzado a llamarte como autoridad máxima para resolver disputas y otros conflictos menores. Como "juez informal de las estepas" tienes mucho poder, un poder que estás empezando a comprender lo suficiente como para utilizarlo por el bien de tus hermanos. Lo sepan o no".
 podintroducciones.208.a:0 "Juez y señor de la guerra".
 chinkhai_intro_tooltip:0 "Como Chinkhai, tienes una interacción de carácter especial disponible con tus vasallos para emitir un juicio."
   
 POD_chinkhai_interaction:0 "Juez de las estepas"
 POD_chinkhai_interaction_desc:0 "Estoy en sesión".
        
 podintroductions.208.a:0 "Juez y señor de la guerra."
 PODcanon_chars.55.t:0 "El juicio"
 PODcanon_chars.55.desc:0 "Como máxima autoridad en la Horda de Anda, eres completamente libre de empezar y terminar cualquier juicio de la forma que prefieras. Sin embargo, tienes una reputación que mantener y demasiada indulgencia podría ser vista como una debilidad."
 PODcanon_chars.55.a:0 "¡Inocente!"
 PODcanon_chars.55.b:0 "¡Culpable!"
 PODcanon_chars.55.c:0 "Este caso no es concluyente".
 
 podintroductions.209.t:0 "Su historia hasta ahora"
 podintroductions.209.desc:0 "Temible Magda, un invasor más intenta despojar tu hermosa isla. Este Mithras no es más que el último de una larga lista de conquistadores extranjeros que toman lo que es tuyo. No lo permitirás. Tu pueblo hace tiempo que desapareció y tu fe es apenas un recuerdo, incluso para ti en este momento. Sólo queda tu furia, y es hora de dejar que hable por ti. Las islas han sido corrompidas sin remedio y tendrás que destruir todo a tu paso para hacerlas puras de nuevo.\NSerá sangriento, pero sólo están cosechando lo que sembraron."
 podintroductions.209.a:0 "Todos ellos pagarán".
 magda_intro_tooltip:0 "Como Magda, tienes acceso a una línea de construcción especial en los condados de bajo desarrollo."
   
 building_type_magda_purge_01:0 "Purga de Magda"
 building_type_magda_purge_01_desc:1 "#F Sólo por un nuevo comienzo con la recuperación de las islas. Un nuevo y sangriento comienzo".
 building_magda_purge_01:0 "Paquetes de Magda"
 building_magda_purge_01_desc:1 "Manadas de Gangrel asilvestrados bajo el mando de Magda recorren esta tierra, sembrando el terror y la muerte a su paso.Este edificio necesita menos de 11 desarrollos en el país para ser construido y permanecer habilitado."
 building_magda_purge_02:0 "Horda de Magda"
 building_magda_purge_02_desc:1 "La salvaje ley del más fuerte ha vuelto a tomar el control aquí. La civilización se derrumba bajo las garras y los colmillos de la horda vengativa de Magda.Este edificio necesita menos de 6 desarrollos en el país para ser construido y permanecer habilitado."
 
 podintroductions.210.t:0 "Su historia hasta ahora"
 podintroductions.210.desc:0 "Lady Catubodua, por fin has salido de Francia después de pasar mucho tiempo aquí. Por fin has encontrado lo que buscabas y es hora de seguir adelante.\NEl propio Brujah confió en ti para que mantuvieras a su [Clan|E] en el buen camino pero la tarea es inmensa. Tendrás que darte a conocer al resto de tus hermanos y hacer crecer tu ya impresionante leyenda. Sólo entonces aceptarán que eres el verdadero heredero del legado de Brujah".
 podintroducciones.210.a:0 "Hay mucho que hacer".
 catubodua_intro_tooltip:0 "Como Catubodua, no puedes [Abrazar|E] ya que ella juró no volver a hacerlo después de su primer childe.\NTambién tienes acceso a una decisión especial para hacer crecer tu leyenda e impresionar al resto del clan."
  
 catu_heir_of_brujah_modifier:0 "Heredera de Brujah"
 catu_heir_of_brujah_modifier_desc:0 "Por fin, [Clan|E] Brujah se cura. Una heredera digna de Brujah y Troile se ha levantado y guiará a los Guerreros-Escolásticos hacia una nueva y brillante era."
 podintroductions.210.a:0 "Hay mucho que hacer."
      
 catubodua_decision:0 "La renovación de Brujah"
 catubodua_decision_tooltip:1 "No puedo fallarle".
 catubodua_decision_desc:0 "Los orgullosos Brujah no aceptarán a un nuevo gobernante a menos que éste, o ésta, represente a la perfección tanto el aspecto guerrero como el erudito de su [Clan|E]. Todo ello sin dejar de ser un gobernante exitoso, obviamente".
 catubodua_decision_confirm:0 "Comienza una nueva era".
  
 podintroductions.211.t:0 "Su historia hasta ahora"
 podintroductions.211.desc:0 "Lady Deverra, su pueblo está en grave peligro. A medida que los seguidores cristianos se vuelven más y más agresivos, el [Clan|E] Tremere ha enviado una camarilla liderada por Jervais para matarte a ti y a los demás Telyavelic.\NPor suerte, encontraste a Qarakh y ahora estás bajo la protección de los Ferales de Livonia. Sin embargo, no estarás tranquilo hasta que el ataque de este Tremere sea tratado, y las fronteras de los Ferales sean seguras. La seguridad de ti y de los tuyos tiene este precio".
 podintroductions.211.a:0 "Telyavel nos bendice".
 deverra_intro_tooltip:0 "Como Deverra, tienes el objetivo especial de deshacerte de Jervais y expandir las fronteras de los Ferales hacia el Este".
  
 deverra_blessed_modifier:0 "Campeón de Telyavel"
 deverra_blessed_modifier_desc:0 "Deverra es claramente la elegida de Telyavel. Su fe irradia a la vista de todos, un resto para los seguidores de la Cruz que aún no han ganado."
        
 deverra_decision:0 "Campeón de Telyavel"
 deverra_decision_tooltip:1 "No puedo fallarle".
 deverra_decision_desc:0 "Tu pueblo confía en ti y en la protección de los ferales en los tiempos difíciles que se avecinan. Si pudieras matar al líder de los Tremere atacantes y asegurar tu frontera occidental, tu situación mejoraría."
 deverra_decision_confirm:0 "Hemos aguantado". 
 deverra_custom_decision:0 "Jervais debe estar muerto".
 deverra_custom_decision2:0 "Tú o tu señor controla completamente el ducado de Pomeralia".
 deverra_custom_decision3:0 "Tú o tu señor controla completamente el ducado de Prusia".

 podintroductions.212.t:0 "Tu historia hasta ahora"
 podintroductions.212.desc:0 "Lady Dyanang, su Corte se mantiene fuerte. Gracias a su alianza con el Pueblo Feroz de las selvas de Dai Viet y Angkor, sus fronteras orientales están seguras. La India siempre ha sido una región difícil de domar, con los herejes de la Corte del Trueno Infinito y los llamados [cainitas|E] causando problemas. ¿Quizás tus amigos orientales podrían prestar sus garras y colmillos para ayudarte a pacificar esta rebelde región?"
 podintroductions.212.a:0 "El Fénix Escarlata vuela alto".
 dyanang_intro_tooltip:0 "Como Dyanang, tienes una decisión menor especial para reclutar Hombres de Armas Hombres de Armas".
  
 dyanang_decision:0 "El pueblo feroz"
 dyanang_decision_tooltip:1 "Amigos, necesito vuestra ayuda".
 dyanang_decision_desc:0 "La buena relación entre tu Corte y el Pueblo Feroz de los Reinos de la Selva puede ser aprovechada para ayudar."
 dyanang_decision_confirm:0 "Bienvenido, y gracias".
 dyanang_decision_effect_tooltip:0 "Tendrás la posibilidad de elegir cuántos Hombres de Armas Hombres de Armas quieres engendrar".
   
 PODcanon_chars.56.t:0 "Ayuda de las selvas"
 PODcanon_chars.56.desc:0 "Los temibles Hengeyokai han sido tus aliados tentativos desde que el Sudario de Oro Wu salvó desinteresadamente la vida del cambiador de dragones Zhong Lung conocido como Nongkhai en 1210. Todavía no sería prudente abusar de esta amistad, pero puedes contar con ellos para que te ayuden en momentos de necesidad."
 PODcanon_chars.56.a:0 "Un sentai debería ser suficiente".
 PODcanon_chars.56.b:0 "Se necesitan dos sentai".
 PODcanon_chars.56.c:0 "Toda la ayuda que puedas reunir".
 PODcanon_chars.56.d:0 "En realidad, puedo ocuparme de la situación por mi cuenta".
 dyanang_small_werewolves_tt:0 "Un grupo de Hombres Lobo se añade a tus hombres de armas disponibles".
 dyanang_medium_werewolves_tt:0 "Se añaden dos grupos de Hombres Lobo a tus hombres de armas disponibles."
 dyanang_high_werewolves_tt:0 "Se añaden tres grupos de Werewolves a tus hombres de armas disponibles."
     
 durga_young_tt:0 "Como estás jugando con Durga Syn, al conseguir este objetivo, también has eliminado la maldición de Baba Yaga que pesaba sobre ti."
  
 podintroductions.213.t:0 "Tu historia hasta ahora"
 podintroductions.213.desc:0 "Lord Leopold, a pesar de ser un inquisidor de renombre, sigues siendo un noble con deberes que cumplir. Uno de ellos es encontrar una esposa adecuada.\NComo vástago de una casa menor de Baviera, sería fácil casarse con una doncella noble local. Gerberga viene a la mente, ya que has visto en ella la fabricación de una pareja útil. Otra opción sería lanzar su red más amplia, a Italia tal vez. Una opción más prestigiosa, sin duda, pero usted sabrá poco acerca de su futura novia.\NLa última opción es... poco convencional. Tu mejor amigo, Baudioun, ha bromeado a menudo con la idea de presentarte a una de sus amigas de la infancia, una marimacho pendenciera que, al parecer, estaba más que a la altura de las habilidades pendencieras del joven Baudioun. Con tu frágil físico, su fuerza compensaría tu debilidad.\NY te encantaría ver la cara de Baudioun si efectivamente te casaras con su amiga después de todas esas bromas".
 podintroductions.213.a:0 "Sí Baudioun, esto está sucediendo".
 podintroductions.213.b:0 "Lady Gerberga, ¿quieres...?"
 podintroductions.213.c:0 "Encantada de conocerla por fin, Lady Adelaida".
 podintroductions.213.d:0 "No tengo tiempo para estas frivolidades".

 aignen_secrets_modifier:0 "Los secretos de Aignen"
 aignen_secrets_modifier_desc:0 "El Oculi Dei sabe mucho. Quizá demasiado para algunos de los miembros más celosos de la Iglesia".
   
 podintroductions.214.t:0 "Su historia hasta ahora"
 podintroductions.214.desc:0 "Señor Aignen, se encuentra en la poco envidiable posición de ser los ojos y oídos de la naciente Inquisición de las Sombras, algo que muchos en la Santa Iglesia no aprueban. Sin embargo, usted conoce la importancia de su misión.\NBajo su dirección, el Oculi ya se ha extendido a lo largo y ancho, ofreciendo muchos contactos que puede aprovechar para la gloria de la Inquisición. Sin embargo, este crucial trabajo de preparación ya está amenazado por la propia Santa Sede, y tendrás que mantener a tus "aliados" alejados de ti por el momento."
 podintroductions.214.a:0 "Sé lo que hay que hacer".
 aignen_intro_tooltip:0 "Como Aignen, empiezas con un poderoso modificador de intriga. Durará mientras Aignen esté vivo, y si puedes mantener a la Iglesia fuera de tu caso."
  
 PODcanon_chars.57.t:0 "La visita papal"
 PODcanon_chars.57.desc:0 "Viene un enviado de la Santa Sede que quiere ver el alcance real de tus operaciones. Esto podría ser peligroso, ya que muchos en Roma no quieren otra cosa que cerrar el Oculi Dei, preocupados por que sus mezquinos planes se vean perturbados por tu presencia.\NSabes que tu misión es mucho más importante que eso, pero aun así tendrás que lidiar con estos tontos de miras cortas si quieres continuar con tu propia versión de la Santa obra."
 PODcanon_chars.57.a:0 "Sobornar al enviado debería ser suficiente".
 PODcanon_chars.57.b:0 "Soy un humilde servidor de la Iglesia".
 PODcanon_chars.57.c:0 "Seré tu guía personal".
 PODcanon_chars.57.d:0 "No tengo más remedio que cortar lazos con algunos contactos".
 
 vittoria_illness_modifier:0 "Maldición sobrenatural"
 vittoria_illness_modifier_desc:0 "Vittoria ha sido maldecida por una poderosa bruja. Aunque su mente sigue siendo fuerte, su cuerpo se está marchitando lentamente".
   
 podintroductions.215.t:0 "Su historia hasta ahora"
 podintroductions.215.desc:0 "Intrépida Vittoria, has comenzado tu deber sagrado en Italia, pero has ocultado una terrible verdad a tus hermanos: has sido maldecida.\NUna poderosa bruja con la que luchaste hace años pudo escapar de ti, pero no antes de usar su asquerosa magia. Desde entonces, tu cuerpo se ha ido marchitando poco a poco, y podrías ser llamado por el Señor antes de terminar tu tarea si esto continúa.\NAfortunadamente, una solución se ha presentado recientemente. Gracias a la inteligencia de los Oculi Dei, te has enterado de que la bruja ha fijado su residencia en Marsella. Si pudieras hacer un "desvío" por esta ciudad y purgarla de sus residentes vampiros y hechiceros... seguramente tu maldición terminaría".
 podintroductions.215.a:0 "¡Una mezquina maldición no acabará conmigo!"
 vittoria_intro_tooltip:0 "Como Vittoria, tienes una decisión especial para deshacerte de la maldición tomando Marsella".
  
 vittoria_decision:0 "La maldición"
 vittoria_decision_tooltip:1 "Todavía te queda mucho por hacer".
 vittoria_decision_desc:0 "Todavía eres fuerte, pero esa maldita maldición sigue siendo una preocupación. Purifica Marsella y acaba con la bruja".
 vittoria_decision_confirm:0 "Por el fuego, purifícate".
    
 rodrigue_paranoia_modificador:0 "Paranoia total"
 rodrigue_paranoia_modifier_desc:0 "Están aquí para atraparte. Todo el mundo podría estar en su esclavitud".
      
 podintroductions.216.t:0 "Su historia hasta ahora"
 rodrigue_paranoia_modifier:0 "Paranoia absoluta"
 podintroductions.216.desc:0 "Señor Rodrigue, usted fue el primero en enfrentarse a un vampiro y vivir, y sigue siendo el único que conoce la verdad: están por todas partes.\NIncluso la Iglesia y su llamada 'Inquisición en la sombra'\Nestán probablemente llenas de sus siervos. No debes confiar en nadie más que en ti mismo. Se acerca un gran ajuste de cuentas y Dios te mostrará el camino de la salvación.\NSi este mundo se quema para ser salvado, tú estarás encima de las cenizas."
 podintroductions.216.a:0 "Nunca más me engañarán".
 
 roque_paranoia_modificador:0 "La maquinación de Roque"
 roque_paranoia_modifier_desc:0 "¿Es hora de maquinar? Pues sí, ¡siempre es hora de maquinar!"
  
 roque_paranoia_modifier:0 "La trama de Roque"
 podintroductions.217.t:0 "Su historia hasta ahora"
 podintroductions.217.desc:0 "Madre María, a pesar de la inmensidad de su tarea aquí en Inglaterra, no debe olvidar de dónde viene.\NUsted le debe todo a la Madre Teresa, el alma bendita que fundó las Hermanas de San Juan y fue el corazón de la primera Inquisición. Su fallecimiento fue un momento difícil para todas las Hermanas y estarías más tranquila si la Santa Iglesia conociera a esta santa mujer.\NComo tal, has comenzado a recopilar relatos de la vida y los milagros de Teresa para llevarlos a Roma, con la esperanza de su canonización. Si lo consiguierais, las Hermanas estarían en paz, sabiendo que su difunta fundadora vive para siempre."
 podintroductions.217.a:0 "Una tarea muy piadosa".
 maria_intro_tooltip:0 "Como María, tienes la decisión especial de recopilar el relato sobre la vida de Teresa. Si terminas antes de la muerte de María, la Hermana obtendrá un considerable aumento de renombre".
  
 teresa_life_4_modifier:0 "Proceso de canonización de Teresa : 4"
 teresa_life_4_modifier_desc:0 "Estás trabajando para llevar la verdad sobre los milagros de la Madre Teresa a los oídos de Roma.\NUna vez que este modificador llegue a 5, el proceso estará terminado."
 teresa_life_3_modifier:0 "Proceso de canonización de Teresa : 3"
 teresa_life_3_modifier_desc:0 "Estás trabajando en llevar la verdad sobre los milagros de la Madre Teresa a los oídos de Roma.\NUna vez que este modificador llegue a 5, el proceso estará hecho."
    
 teresa_life_2_modifier:0 "Proceso de canonización de Teresa : 2"
 teresa_life_2_modifier_desc:0 "Estás trabajando en llevar la verdad sobre los milagros de la Madre Teresa a los oídos de Roma.\NUna vez que este modificador llegue a 5, el proceso estará hecho."
     
 teresa_life_1_modifier:0 "Proceso de canonización de Teresa : 1"
 teresa_life_1_modifier_desc:0 "Estás trabajando en llevar la verdad sobre los milagros de la Madre Teresa a los oídos de Roma.\NUna vez que este modificador llegue a 5, el proceso estará hecho."
    
 maria_decision:0 "Canonización de la Madre Teresa"
 maria_decision_tooltip:1 "Se lo merece, y mucho más".
 maria_decision_desc:0 "Para que tus hermanas sepan que la Madre Teresa sigue velando por ellas, tendrás que asegurarte de que Roma reconoce las muchas bendiciones que trajo a esta tierra. Escribirás un relato detallado de su vida, sin duda para convencer a Roma de canonizarla."
 maria_decision_confirm:0 "Un esfuerzo santo".
      
 heir_gauthier_modifier:0 "Heredero de Gauthier"
 heir_gauthier_modifier_desc:0 "El poderoso Baudioun es el sucesor elegido por Gauthier. Los Caballeros de Acre se unen obedientemente a 'le Breton'".
    
 heiress_gauthier_modifier:0 "Heredera de Gauthier"
 heiress_gauthier_modifier_desc:0 "La brillante Jehan es la sucesora elegida por Gauthier. Ella llevará a los Caballeros de Acre a la victoria... les guste o no".
    
 podintroductions.218.t:0 "Su historia hasta ahora"
 podintroductions.218.desc:0 "Señor Gauthier, el tiempo no espera a nadie y el Señor pronto le llamará de nuevo a su lado. Debes preparar a los Caballeros de Acre para este momento.\N-El curso de acción esperado sería que llamaras de vuelta al fiel Baudioun de Alemania y lo nombraras como tu sucesor. Como líder talentoso y carismático, lo haría bastante bien, estás seguro de ello.\NPero... está Jehanne, o Jehan como a ella le gusta llamarse. La brillantez de su mente te ha asombrado muchas veces en el pasado y podría ser la mayor amenaza para el Adversario que el mundo haya visto jamás. Sin embargo, hay un problema... es una mujer. Los Caballeros de Acre ya están descontentos de que la hayas promovido a tu círculo íntimo, así que si la nombras como sucesora... Sea como sea, hay que tomar una decisión. Tu legado depende de ello".
 podintroductions.218.a:0 "Baudioun es la elección obvia".
 podintroductions.218.b:0 "Jehan es el futuro".
          
 gauthier_intro_tooltip:0 "Jehan, furioso, abandona los Caballeros de Acre, para no volver a ser visto".

 PODcanon_chars.58.t:0 "Para siempre Hardestadt"
 PODcanon_chars.58.desc:0 "Tu [Sire|E], Hardestadt, ha encontrado recientemente la Muerte Final. Un acontecimiento trágico, sin duda, pero que no pensaste que te afectaría tanto a largo plazo. Sin embargo, desde su muerte, te has sentido... extraño. Recuerdos de una reunión con él, conversaciones sobre un 'plan de contingencia', un vacío de una semana en tu memoria... De repente te sientes imitando cada vez más a tu difunto maestro, hablando y moviéndote como él... e incluso pensando como él. ¿Está Hardestadt realmente muerto? ¿Qué te está pasando? Quizás siempre habrá un Hardestadt..."
 PODcanon_chars.58.a:0 "Los informes sobre mi muerte final fueron muy exagerados".
 PODcanon_chars.58.b:0 "¡Soy mi propio hombre!"
 hardestadt_takeover_tt:0 "Te convertirás en Hardestadt, ganando sus rasgos, perdiendo los tuyos e incluso pareciéndote a él".
    
 podintroductions.219.t:0 "Tu historia hasta ahora"
 podintroductions.219.desc:0 "Ma Yi Yuan era sin duda una Shih excepcional. A pesar de sus años como cazadora de demonios, vivió en la alta sociedad de la dinastía Song. Allí, mientras servía como esposa de un noble menor, Ma Yi Yuan era buscada con frecuencia, tanto para los eventos sociales como por los nobles que tenían problemas con el shen.\NNNNNNNPor supuesto, poca gente -o demonios- esperaba que Ma Yi Yuan fuera tan ingeniosa como ella. Muchos de los demonios a los que derrotó nunca se dieron cuenta -hasta demasiado tarde- de que los dos abanicos que llevaba eran sus principales armas. Ma Yi Yuan, muy hábil en su uso, consiguió deshacerse de muchas amenazas a la seguridad de los nobles de su zona".
 podintroductions.219.a:0 "Y ellos me devuelven el apoyo".
 artifact_fans_of_ma_yi_yuan_name:0 "Fans de Ma Yi Yuan"
 artifact_fans_of_ma_yi_yuan_description:0 "#Desbloqueo en negrita '$decisión_de_viaje_al_mundo_de_yang$' [decisión|E].#¡Los abanicos son armas engañosamente letales. Estos finos abanicos metálicos plegables están afilados como una cuchilla y son tan fuertes como la hoja de la mejor espada. Bajo la elaborada decoración de los abanicos se esconde una gran cantidad de poder místico, así como un hambre de sangre de los hirayanu. El usuario de los abanicos puede desviar cualquier hechizo lanzado por los hados, y es capaz de entrar en su reino".
    
 
 
 
 
 
