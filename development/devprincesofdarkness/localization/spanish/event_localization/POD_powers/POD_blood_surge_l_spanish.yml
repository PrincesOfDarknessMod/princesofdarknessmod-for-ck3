l_spanish:

 POD_vampire_blood_surge.100.t:0 "¡Subida de sangre!"
 POD_vampire_blood_surge.100.desc:0 "La sangre puede potenciar sobrenaturalmente tus habilidades, pero corre el riesgo de despertar tu hambre".
 POD_vampire_blood_surge.100.option.a:0 "¡Luchemos!" 
 POD_vampire_blood_surge.100.option.a.tt.beast:0 "#BLOODRED ¡Sí! Hora de matar! #"
 POD_vampire_blood_surge.100.option.h:0 "¡Quiero ser más duro!" 
 POD_vampire_blood_surge.100.option.h.tt.beast:0 "#BLOODRED ¡Somos inmortales! #"
 POD_vampire_blood_surge.100.option.b:0 "Mejora la táctica"
 POD_vampire_blood_surge.100.option.b.tt.beast:0 "#BLOODRED La guerra. La guerra nunca cambia. Siempre hay mucha sangre derramada en la guerra.#"   
 POD_vampire_blood_surge.100.option.c:0 "Hazme más encantador"
 POD_vampire_blood_surge.100.option.c.tt.beast:0 "#BLOODRED Bienvenido a mi salón.#"   
 POD_vampire_blood_surge.100.option.d:0 "Ayúdame con los números"
 POD_vampire_blood_surge.100.option.d.tt.beast:0 "#BLOODRED Necesitamos más rebaño. Siempre necesitamos más sangre. Puedo ayudarte a conseguirla. Deja que te ayude".    
 POD_vampire_blood_surge.100.option.e:0 "Silencio como la muerte"
 POD_vampire_blood_surge.100.option.e.tt.beast:0 "#BLOODRED ¡La caza ha comenzado!"   
 POD_vampire_blood_surge.100.option.f:0 "La aplicación adecuada de vitae puede aumentar el intelecto exponencialmente" 
 POD_vampire_blood_surge.100.option.f.tt.beast:0 "#BLOODRED Indudablemente. Maximicemos nuestra adquisición de vitae con presteza y urgencia."    
 POD_vampire_blood_surge.100.option.g:0 "No me arriesgaré a aumentar mi hambre, por ahora".  
 POD_vampire_blood_surge.100.option.g.tt.beast:0 "#BLOODRED Sin embargo, lo harás, y pronto. Estaré esperando".  
 
 
 
