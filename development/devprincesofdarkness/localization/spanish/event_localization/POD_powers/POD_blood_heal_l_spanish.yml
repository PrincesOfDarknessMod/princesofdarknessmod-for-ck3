l_spanish:

 POD_vampire_blood_heal.100.t:0 "#BLOODRED ¡La sangre cura!"
 POD_vampire_blood_heal.100.desc:0 "#BLOODRED La sangre puede curar sobrenaturalmente tus heridas, pero corre el riesgo de despertar tu hambre. #"
 POD_vampire_blood_heal.100.option.a:0 "Cura mis heridas" 
 POD_vampire_blood_heal.100.option.a.tt.beast:0 "#BLOODRED Necesitaremos conseguir más sangre.#"
 POD_vampire_blood_heal.100.option.b:0 "Cura mi mutilación" 
 POD_vampire_blood_heal.100.option.b.tt.beast:0 "#BLOODRED Realmente has hecho un lío. #"
 POD_vampire_blood_heal.100.option.c:0 "Vuelve a crecer el ojo que me falta"
 POD_vampire_blood_heal.100.option.c.tt.beast:0 "¡Los depredadores tienen dos ojos!   
 POD_vampire_blood_heal.100.option.d:0 "Vuelve a colocar mi pierna"
 POD_vampire_blood_heal.100.option.d.tt.beast:0 "#BLOODRED Ahora podremos atropellarlos. #"   
 POD_vampire_blood_heal.100.option.e:0 "No me arriesgaré a aumentar mi hambre, por ahora".  
 POD_vampire_blood_heal.100.option.e.tt.beast:0 "#BLOODRED Sin embargo, lo harás, y pronto. Estaré esperando".  
 POD_vampire_blood_heal.100.option.f:0 "Cura uno de mis ojos cegados".  
 POD_vampire_blood_heal.100.option.f.tt.beast:0 "#BLOODRED O podríamos cazar como un murciélago.#"   
 POD_vampire_blood_heal.100.option.g:0 "Cura mis cicatrices".  
 POD_vampire_blood_heal.100.option.g.tt.beast:0 "#BLOODRED Desperdicio de sangre.#"    
 
