l_spanish:

 PODanarchrevolt.0002.t:0 "La revuelta anarca"
 PODanarchrevolt.0002.desc:0 "Mientras el fuego de la Inquisición arrasa Europa, las cosas se ponen cada vez más difíciles para la sociedad Kindred. Los jóvenes vampiros, enfadados por su uso como escudos de carne inflamables contra los soldados de Dios, se han levantado contra sus Ancianos en lo que ahora se denomina la Revuelta Anarquista.\NHasta ahora la Revuelta está formada principalmente por neonatos, Furores y Brujah, con algunos oportunistas. Pero a algunos les preocupa que pueda seguir creciendo como una bola de nieve si no se hace nada al respecto. Estos Anarcas son débiles individualmente, pero luchan sin descanso por algo poco común para los Kindred: una causa".
 PODanarchrevolt.0002.a:0 "Es hora de dar una lección a estos jóvenes"
 PODanarchrevolt.0002.b:0 "Neonatos del mundo, ¡uníos!"
 anarch_revolt_effect_message:0 "Muchos jóvenes vampiros, Brujah y Furores se están convirtiendo a la causa Anarca. Se han envalentonado y son difíciles de contener". 
 anarch_revolt_name:0 "Revuelta anarca"
 anarch_revolt_doctrine_name:0 "Luchadores por la libertad"
 anarch_revolt_doctrine_desc:0 "Los anarcas luchan por algo que pocos cainitas conciben: una causa digna."
 PODanarchrevolt.0004.t:0 "La revuelta: la muerte de Lasombra"
 PODanarchrevolt.0004.desc:0 "Aunque a muchos les cueste creerlo, parece que hace poco ocurrió un cataclismo en Castel del Ombro. El centro de poder del Clan Lasombra ha sido el objetivo de un audaz asalto liderado por un grupo de Anarcas Lasombra ayudados por algunos de los mejores agentes de la temida casta de los Guerreros Assamitas.\NLos informes del asalto real son escasos, y sólo un Lasombra salió vivo de la fortaleza, pero si hay que creerle... el propio Lasombra está muerto. Este suceso ha envalentonado a los anarcas de todo el mundo, y una gran mayoría del clan Lasombra se ha unido a la causa del niño rebelde. La Revuelta Anarca se está calentando noche tras noche".
 PODanarchrevolt.0004.a:0 "¡Aprenderán su lugar!"
 PODanarchrevolt.0004.b:0 "...quizás sea el momento de replantearme mi posición"
 lasombra_revolt_effect_message:0 "El clan Lasombra se está convirtiendo a la causa anarca. Sólo el más poderoso de sus gobernantes se resiste". 
 slayer_of_gods:0 "Cazador de dioses"
 slayer_of_gods_desc:0 "Este personaje ha matado, posiblemente, a uno de los todopoderosos antediluvianos. Impone respeto y temor a partes iguales".  
 PODanarchrevolt.0006.t:0 "La revuelta: la muerte de Absimilliard"
 PODanarchrevolt.0006.desc:0 "Lo imposible ha sucedido.\NEn uno de los bosques más profundos de Rusia, un grupo de Anarch Nosferatu logró rastrear lo que decían ser el lugar de descanso del monstruoso progenitor de su clan, Absimilliard. Tras una terrible batalla contra los guardianes de la tumba, sólo quedó uno de los asaltantes, pero, si se le cree, mató al Antediluviano mientras dormía. En todo el mundo, el clan Nosferatu respira por fin en libertad por primera vez desde su creación y ahora se une en masa a las filas de su héroe.\NEn toda Rusia, la risa maníaca de una anciana se escucha noche tras noche desde el suceso..."
 nosferatu_revolt_effect_message:0 "El clan Nosferatu se está convirtiendo a la causa anarca. Sólo los más poderosos de sus gobernantes podrían resistirse". 
 PODanarchrevolt.0008.t:0 "La Revuelta : Muerte de Ennoia"
 PODanarchrevolt.0008.desc:0 "Graves noticias llegan desde el helado Norte, la manada de Anarch Gangrel que partió en busca de Ennoia, la progenitora de su clan, ha regresado. O, al menos, uno de ellos.\NEste superviviente, agobiado pero orgulloso, cuenta historias de maravillas y monstruos, de traiciones y batallas dignas del mismísimo Ragnarok. Pero, al final, el guerrero habla de la muerte de Ennoia, asesinada en su sueño tortuoso tras la terrible lucha contra los guardianes de su tumba. Obviamente, es increíblemente difícil verificar tales afirmaciones, pero ya han tenido un poderoso efecto dominó en el Clan Gangrel, ya que muchos se han unido a la causa anarca. La revuelta se está calentando noche tras noche".
 gangrel_revolt_effect_message:0 "El Clan Gangrel se está convirtiendo a la causa Anarca. Sólo los más poderosos de sus gobernantes podrían resistirse". 
 PODanarchrevolt.0010.t:0 "La Revuelta : Muerte de Tzimisce"
 PODanarchrevolt.0010.desc:0 "Ha vuelto a suceder.\NUn grupo de anarcas de Tzimisce ha realizado una incursión contra algunos ancianos de su clan, con el objetivo ostensible de asegurar el lugar de descanso del Antediluviano. Tras obtener esta información, su ejército marchó hacia el Monasterio de Semog, donde se produjo una terrible batalla con los Szlachta defensores. Saliendo victoriosos, los Anarcas consiguieron de algún modo disipar las protecciones mágicas de la tumba y su líder consumió con avidez al propio Tzimisce.\NEsta asombrosa victoria ha sumido al antiguo clan en manos de la Revuelta, reclamando su lugar como uno de los pocos linajes que consiguieron deshacerse de su progenitor."
 tzimisce_revolt_effect_message:0 "El clan Tzimisce se está convirtiendo a la causa anarca. Sólo los más poderosos de sus gobernantes podrían resistirse". 
 PODanarchrevolt.0012.t:0 "La Revuelta : Muerte de Arikel"
 PODanarchrevolt.0012.desc:0 "Arikel, el progenitor del clan Toreador, siempre se mostró ajeno al Gran Juego que jugaban los antediluvianos. Sin embargo, eso no ha sido suficiente para protegerla de la Revuelta Anarca.\NLe han llegado informes de que una atrevida fuerza de anarcas Toreador ha atacado su refugio en Creta, aparentemente ayudada por la información proporcionada por algunos ancianos Nosferatu. El resto de la historia es confusa, ya que algunos miembros supervivientes afirman que Arikel estaba dormida, mientras que otros hablan de una gran batalla, pero todos coinciden en afirmar que la Bailarina del Toro de Enoch ha caído en manos de su propia estirpe.\NEnvalentonado por estas noticias, el clan Toreador está tomando un papel mucho más activo en la Revuelta Anarca."
 toreador_revolt_effect_message:0 "El clan Toreador se está convirtiendo a la causa Anarca. Sólo los más poderosos de sus gobernantes podrían resistirse". 
 PODanarchrevolt.0014.t:0 "La Revuelta : Muerte de Ventru"
 PODanarchrevolt.0014.desc:0 "Ni siquiera el clan de los Reyes se libra de la locura de la Revuelta Anarca. En algún lugar de las profundidades de Persia, una camarilla de anarcas de Ventrue tropezó con la tumba del Antediluviano. Algunos dicen que buscaban a Haqim, el progenitor de los antediluvianos, y que fueron engañados por su astuto hijo, otros hablan simplemente de un evidente y bastante burdo robo de poder.\NSea cual sea la razón real, estos Ventrue han regresado, reclamando la muerte de su progenitor desaparecido hace tiempo. Aunque es dudosa, esta reivindicación ha llevado a muchos Ventrue a la Revuelta Anarca, donde se cuelan fácilmente en posiciones de liderazgo. A la mayoría de los anarcas les preocupa que esto sea una amenaza para la ideología real de la Revuelta, pero no están realmente en posición de negar una mano amiga tan poderosa que les tiende la mano."
 ventrue_revolt_effect_message:0 "El clan Ventrue se está convirtiendo a la causa anarca. Sólo los más poderosos de sus gobernantes podrían resistirse". 
          
     
 
 