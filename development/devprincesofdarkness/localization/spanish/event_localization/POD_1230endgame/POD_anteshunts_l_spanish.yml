 POD_anteshuntlasomb.5.desc:0 "Has reunido una fuerza que esperas sea lo suficientemente fuerte como para tomar Castel del Ombro. Mientras repasas tu plan de acción una vez más, te molestan los gritos que provienen del campamento.\NParece que, con tantos vampiros con diferentes objetivos reunidos en un mismo lugar, las tensiones se disparan y la frágil alianza que has creado ya está amenazada. Si no lo detienes ahora, esto podría intensificarse. Incluso un solo frenesí en un espacio tan concurrido podría ser desastroso..."
