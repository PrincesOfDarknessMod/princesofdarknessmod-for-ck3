 POD_anteshunttzimisce.19.t:0 "La caza: el demonio"
 POD_anteshunttzimisce.19.desc:0 "Al salir victorioso de Sernog, te detiene una figura solitaria que te espera en la base de la larga escalera del Monasterio. Sus rasgos son indistintos, pero lo reconoces por lo que es: Kupala, el Demonio de Transilvania y némesis de Tzimisce.\NHiciste bien en ayudarlo, pero aún hay un remanente del Anciano en ti, y Kupala no puede tener eso. Puedes sentir la atracción que el Demonio tiene en tu alma por cada vez que le pediste ayuda volviendo a atormentarte mientras lo hace más fuerte. Es hora de probar tus nuevos poderes y esperar que sean suficientes".
 POD_anteshunttzimisce.19.a:0 "La batalla final..."
 endofthequest:0 "Victoria o muerte, este es el final de esta búsqueda".
 POD_anteshunttzimisce.19.effect.success.desc:0 "Un demonio derrotado"
 POD_anteshunttzimisce.19.victory:0 "¡Una victoria final!"
