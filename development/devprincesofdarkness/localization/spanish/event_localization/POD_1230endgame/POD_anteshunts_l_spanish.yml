 POD_anteshuntlasomb.14.desc:0 "Tu grupo es acosado por una horda de vampiros aparentemente de baja generación pero jóvenes. No son una gran amenaza en sí mismos, pero no dejan de llegar. Cada vez que atacan, pierdes a uno o dos miembros de tu séquito, y esto puede llevarte a la muerte por desgaste.\NDebe haber alguien, en algún lugar de este castillo, que trama esta táctica cobarde. Hay que ocuparse de este "titiritero"".
 POD_anteshuntlasomb.14.a:0 "¡Muéstrate!"
 POD_anteshuntlasomb.14.effect.success.desc:0 "¡Lo has encontrado!"
 POD_anteshuntlasomb.14.critical.failure.desc:0 "Demasiado tarde..."
 POD_anteshuntlasomb.14.critical.failure:0 "Enjambre de muerte"
 POD_anteshuntlasomb.15.t:0 "La caza: el guardián"
 POD_anteshuntlasomb.15.desc:0 "Una puerta os impide el paso. Pero no es una puerta cualquiera, sino que parece estar hecha enteramente de sombras, lo que significa que no tienes ni idea de cómo abrirla.\NPor suerte, un vampiro está de pie frente a ella, aparentemente sin amenazar. Explicando que no tiene amor por su [Sire|E], podría ser persuadido de abrirla. O podría dejar que la puerta te devore, si no presentas tu caso lo suficientemente bien.\NHora de poner a prueba tus habilidades menos marciales".
 POD_anteshuntlasomb.15.a:0 "Mi primer punto es..."
 POD_anteshuntlasomb.15.effect.success.desc:0 "La puerta está abierta".
 POD_anteshuntlasomb.15.critical.failure.desc:0 "La puerta te abre".
 POD_anteshuntlasomb.15.critical.failure:0 "La puerta te abre"
 POD_anteshuntlasomb.16.t:0 "La caza: el leal"
 POD_anteshuntlasomb.16.desc:0 "Obviamente, tenía que estar aquí. Montano, la mano derecha de Lasombra y el leal más devoto, está de pie frente a ti, con una profunda resolución en sus ojos. El viejo guerrero no se echará atrás en su deber y tú tampoco lo harás.\NNo hay necesidad de palabras. Sólo uno de vosotros saldrá vivo del castillo".
 POD_anteshuntlasomb.16.a:0 "¿La última pelea?"
 POD_anteshuntlasomb.16.effect.success.desc:0 "Montano está derrotado".
 POD_anteshuntlasomb.16.critical.failure.effect.desc:0 "Estás derrotado".
 POD_anteshuntlasomb.16.critical.failure:0 "Un final honorable"
 POD_anteshuntlasomb.17.t:0 "La caza: la bóveda"
 POD_anteshuntlasomb.17.desc:0 "Has llegado a la zona del sótano del Castillo del Ombro, donde, presumiblemente, yace el propio Lasombra. En un interesante giro de los acontecimientos, eres el único superviviente de tu séquito... lo que significa que no tendrás que compartir la sangre del [antediluviano|E]... si lo encuentras.\NDe hecho, rápidamente te das cuenta de que esta zona de la bóveda es un laberinto, y uno completamente negro. Las paredes están hechas de sombras, y la disposición cambia constantemente. Podrías perderte para toda la eternidad aquí si no tienes cuidado..."
 POD_anteshuntlasomb.17.a:0 "Encontraré un camino..."
 POD_anteshuntlasomb.17.effect.success.desc:0 "La última cámara está más adelante".
 POD_anteshuntlasomb.17.critical.failure.effect.desc:0 "He vuelto a la entrada, otra vez..."
 POD_anteshuntlasomb.17.critical.failure:0 "Perdido en la oscuridad"
 POD_anteshuntlasomb.18.t:0 "La caza: Victoria"
 POD_anteshuntlasomb.18.desc:0 "Estás en el corazón de Castel del Ombro y puedes sentir la presencia de Lasombra... pero no puedes verlo. El [antediluviano|E] parece haberse fundido con las sombras antes de entrar en [torpor|E], lo que dificulta aún más su [diablerie|E].\NAfortunadamente, Sybil no se ha olvidado de ti; la hija descarriada ha aparecido, y ha iniciado un ritual para devolver la esencia de Lasombra a su cuerpo. Esperas y esperas, hasta que finalmente el cuerpo del [antediluviano|E] se reconstruye ante ti.\NSybil se despide de ti, tan misteriosa como siempre, y tú estás solo ante tu destino, uno de poder incalculable.\NEntonces atacas."
 POD_anteshuntlasomb.18.a:0 "La victoria sabe dulce y sangrienta"
 POD_anteshuntlasomb.19.t:0 "La caza: ¿Victoria?"
 POD_anteshuntlasomb.19.desc:0 "Estás en el corazón de Castel del Ombro y puedes sentir la presencia de Lasombra... pero no puedes verlo. El [antediluviano|E] parece haberse fundido con las sombras antes de entrar en [torpor|E], lo que hace que su [diablerie|E] sea aún más difícil.\NNo tienes forma de encontrar dónde está realmente su alma y realizar [diablerie|E] en las sombras no es precisamente algo que sepas hacer... Aun así, lo intentas, atacando a la oscuridad, siguiendo tus instintos bestiales y recorriendo esta habitación como una furia vengativa.\NEs un proceso agotador y no la sensación estimulante que esperabas y, sin embargo, sientes una oleada de poder en ti mismo.\NHas conseguido... algo. Quizá no la fuerza definitiva que buscabas, pero definitivamente has salido victorioso y, en lo que respecta al resto del mundo, has derrotado a un [antediluviano|E]".
 POD_anteshuntlasomb.19.a:0 "Una victoria incompleta".
 POD_anteshuntset.1.t:0 "La caza: Encontrar una pista"
 POD_anteshuntset.1.desc:0 "Has puesto la mira en Set, el 'Dios' que dio nombre a [Clan|E] Setite. Es lógico que se encuentre en algún lugar de Egipto, bien custodiado por su fanática progenie. Sin embargo, Egipto es un lugar muy grande y no puedes preguntar a los lugareños sobre un asunto tan delicado.|nTu primera orden de trabajo es conseguir una pista sobre la ubicación actual del [antediluviano|E]. Para ello, tendrás que enviar a tus agentes a lo largo y ancho, con una fuerte cantidad de oro para atraer a algunos informantes útiles que se presenten."
 POD_anteshuntset.1.a:0 "Ningún precio es demasiado alto".
 POD_anteshuntset.1.b:0 "...Vamos a repensar esto".
 set_end_warning:0 "Renuncia a esta tonta búsqueda".
 POD_anteshuntset.2.t:0 "La caza: Preparativos"
 POD_anteshuntset.2.desc:0 "Te ha llegado una pista creíble. El Tribunal del Fuego, uno de los principales templos setitas, podría saber más sobre la ubicación de Set. Te estás preparando para el viaje al templo cuando un sentimiento de temor te invade.\NNo fuiste muy cuidadoso al pedir información sobre Set, y su [Clan|E] podría estar ya tras tu pista. Tendrás que prepararte cuidadosamente para el camino que te espera, o tu búsqueda será corta".
 POD_anteshuntset.2.a:0 "Burlando a las serpientes..."
 POD_anteshuntset.2.effect.success.desc:0 "Un viaje sin incidentes".
 POD_anteshuntset.2.critical.failure.desc:0 "Bueno, eso se intensificó rápidamente..."
 POD_anteshuntset.2.critical.failure:0 "¡Emboscada!"        
 POD_anteshuntset.3.t:0 "La caza: Entrada ardiente"
 POD_anteshuntset.3.desc:0 "Has llegado a la Corte del Fuego y ahora debes encontrar la forma de hacer que se divulgue la ubicación de Set. La coerción no funcionará, ya que son fanáticos y maestros torturadores de todos modos.\NAsí que eliges la diplomacia. La dueña del templo, una encantadora Setite llamada Scyla, te ha recibido bastante bien, impresionada por tu valentía al entrar en la guarida de la serpiente.\NPero ahora, te pregunta dulcemente por qué no debería matarte aquí y ahora. Después de todo, estás amenazando a su Dios..."
 POD_anteshuntset.3.a:0 "¿Dónde estaría la diversión en eso?"
 POD_anteshuntset.3.effect.success.desc:0 "Un argumento convincente".
 POD_anteshuntset.3.critical.failure.desc:0 "No les gusta la diversión..."
 POD_anteshuntset.3.critical.failure:0 "Decapitado"        
 POD_anteshuntset.4.t:0 "La caza: Primera prueba"
 POD_anteshuntset.4.desc:0 "Scyla se ha mostrado complaciente hasta ahora, pero no renunciará a la información que necesitas tan fácilmente. Tendrás que soportar algunas 'pruebas amistosas' para ver si eres digno de estar en presencia de Set.\NLa primera es bastante fácil. Scyla te presenta a unos exquisitos mortales, expertos en complacer a tu especie de cualquier forma que tu maldita mente pueda imaginar. Es una trampa obvia, ya que podrías perderte fácilmente en el placer que se muestra aquí durante mucho tiempo, pero aun así tienes que probar un poco o tu anfitriona se ofenderá..."
 POD_anteshuntset.4.a:0 "Moderación, moderación..."
 POD_anteshuntset.5.t:0 "La caza: segunda prueba"
 POD_anteshuntset.5.desc:0 "Tu próxima prueba en la Corte del Fuego será una buena y vieja pelea en la arena. A los setitas les encanta su entretenimiento sangriento, y no te sorprende ver que las probabilidades están en tu contra.nTe enfrentas a una manada de hombres lobo. Son criaturas lamentables para ser honestos, ya que fueron constantemente maltratados por los Setitas. Llevados a una furia sin sentido, no tendrán piedad en esta lucha a muerte".
 POD_anteshuntset.5.a:0 "Hombre contra bestia".
 POD_anteshuntset.5.effect.success.desc:0 "Los sacan de su miseria".
 POD_anteshuntset.5.critical.failure.effect.desc:0 "Son sacados de su miseria".
 POD_anteshuntset.5.critical.failure:0 "A la muerte..."        
 POD_anteshuntset.6.t:0 "La caza: tercera prueba"
 POD_anteshuntset.6.desc:0 "Ahora estás 'invitado' a una partida de ajedrez... con piezas vivas y tú como uno de los Reyes. No hace falta decir que cualquier pieza perdida es eliminada sumariamente, lo que significa que lo que está en juego en esta amistosa partida es tan alto como podrías imaginar.\NLos lamentos y gritos de las pobres almas elegidas como peones en este horripilante juego tampoco ayudan a concentrarse..."
 POD_anteshuntset.6.a:0 "Concéntrate en el centro del tablero..."
 POD_anteshuntset.6.effect.success.desc:0 "¡Jaque mate!"
 POD_anteshuntset.6.critical.failure.effect.desc:0 "Eso no tiene buena pinta..."
 POD_anteshuntset.6.critical.failure:0 "¡Jaque mate!"        
 POD_anteshuntset.7.t:0 "La caza: Cuarta prueba"
 POD_anteshuntset.7.desc:0 "Has sido escoltado a la entrada del subterráneo de la Corte del Fuego. Scyla, tu anfitriona, te ha dicho simplemente que debes encontrar la salida para terminar esta prueba.\NEsperabas un laberinto, pero la primera sala subterránea es en realidad una cámara de tortura, donde un ghoul Setite de aspecto escuálido está realizando su 'arte' sobre un sacerdote indefenso. El torturador es bastante amable, habla de su trabajo y no hace ningún movimiento para impedirte continuar. ¿Qué harás en esta desconcertante situación?"
 POD_anteshunttzimisce.1.critical.failure.effect.desc:0 "¡Eso no tiene ningún sentido!"
 POD_anteshuntset.7.a:0 "¿Rescatar al sacerdote?"
 POD_anteshuntset.7.b:0 "¿Continuar el camino?"
 POD_anteshuntset.8.t:0 "La caza: Cuarta Prueba II"
 POD_anteshuntset.8.desc:0 "El subterráneo continúa, y un tipo de aspecto crispado te espera más adelante. Se presenta como un "invitado" de Tzimisce a la Corte del Fuego y dice que tu prueba es sencilla: tienes que soportar sus "experimentos" en tu cuerpo durante un tiempo. Entonces, y sólo entonces, te abrirá la siguiente puerta.\NTe asegura que te dejará, más o menos, en el mismo estado en el que empezaste. Esto no es precisamente reconfortante, pero parece que no tienes elección en este asunto..."
 POD_anteshuntset.8.a:0 "Bueno, aquí vamos..."
 POD_anteshuntset.9.t:0 "La caza: Cuarta Prueba III"
 POD_anteshuntset.9.desc:0 "Ya casi has terminado con este maldito subterráneo. Un ghoul de Setite te espera frente a dos puertas: 'La de la derecha te llevará al final de la prueba sin nuevos obstáculos. La de la izquierda será mucho más larga y difícil, pero también te llevará al final. Elige.'\NEl ghoul no sabe más y sólo repite esta frase una y otra vez, dejándote solo ante esta desconcertante elección."
 POD_anteshuntset.9.b:0 "¿La correcta? ¿Es eso siquiera una elección?"
 POD_anteshuntset.9.a:0 "¡La izquierda! Me encanta el dolor y el sufrimiento".
 POD_anteshuntset.12.t:0 "La caza: el encanto de Set"
 POD_anteshunttzimisce.2.critical.failure.effect.desc:0 "Estoy perdido..."
 POD_anteshuntset.12.desc:0 "Has terminado las pruebas, y Scyla te recibe con los brazos abiertos. Se te agasaja con un suntuoso festín y todo el templo canta tus alabanzas. Scyla se tumba generosamente a tu lado, hablándote de la grandeza de Set todo el tiempo, y de la estupidez de tu búsqueda para cazar a un Dios benévolo como él.\NY tú sólo puedes estar de acuerdo, este asunto de las pruebas reveló la verdadera naturaleza de tu alma. Tal vez tomaste las decisiones equivocadas en el camino, o tal vez ya estabas corrompido desde el principio, pero eres impotente para resistir el encanto de los Setitas. Ahora son tus hermanos y hermanas en la fe".
 antesetcorrupted:0 "Tu búsqueda termina aquí".
 POD_anteshuntset.12.a:0 "¡Alabado sea Set!"
 POD_anteshuntset.11.t:0 "La caza: fuerza de voluntad"
 POD_anteshuntset.11.desc:0 "Has terminado las pruebas, y Scyla te recibe con los brazos abiertos. Se te agasaja con un suntuoso festín y todo el templo canta tus alabanzas. Scyla se tumba generosamente a tu lado, hablándote de la grandeza de Set todo el tiempo, y de la estupidez de tu búsqueda para cazar a un Dios benévolo como él.\NPero eres fuerte, y consigues desviar su intento de seducirte para su causa. Sin más opciones, Scyla finalmente revela una información que podría ayudarte. El cuerpo de Set está protegido por una cábala llamada la Bobina del León. Si los encuentras, estarás mucho más cerca de tu objetivo".
 POD_anteshunttzimisce.4.critical.failure.effect.desc:0 "¡Apetitoso!"
 POD_anteshuntset.11.a:0 "Ya casi llegamos..."
 POD_anteshuntset.13.t:0 "La caza: Encontrar la bobina"
 POD_anteshuntset.13.desc:0 "Localizar la Bobina del León no es precisamente un proceso fácil. Sin embargo, ahora que tienes al menos un nombre, puedes empezar a trabajar en esta pista.\NTienes dos opciones, contratar a gente para que busque a lo largo y ancho o hacerlo tú mismo. Ambas opciones serán costosas de una u otra manera, pero hay que hacerlo. Estás demasiado cerca de Set como para rendirte ahora".
 POD_anteshuntset.13.a:0 "¡Encuéntralos!"
 POD_anteshuntset.13.b:0 "Si quieres un trabajo bien hecho..."
 POD_anteshuntset.14.t:0 "La caza: domar a los leones"
 POD_anteshuntset.14.desc:0 "Has encontrado la Bobina del León. Se mueven constantemente por Egipto, con el sarcófago de Set en la punta del pie. Has conseguido saber cuál es su camino y has planeado una emboscada.\NSin duda será una batalla feroz, ya que los propios protectores de Set no son nada fáciles de convencer. Das la orden de lanzar el asalto, tus ojos se dirigen al centro de la caravana donde tu premio está tan cerca..."
 POD_anteshuntset.14.a:0 "Voy a por ti..."
 POD_anteshuntset.14.effect.success.desc:0 "¡Están acabados!"
 POD_anteshuntset.14.critical.failure.effect.desc:0 "Estoy acabado..."
 POD_anteshuntset.14.critical.failure:0 "Tan cerca..."        
 POD_anteshuntset.16.t:0 "La caza: el campeón"
 POD_anteshuntset.16.desc:0 "La Bobina del León está derrotada, con solo un superviviente entre vosotros y el sarcófago de Set... pero no es "solo" un superviviente. Has oído hablar de este llamado Campeón de Set. Qufur am-Heru, elegido de generación en generación para ser guardaespaldas del propio Set, es probablemente el Setite más fuerte que aún camina por la Tierra.\NEl propósito de toda su vida es impedir que gente como tú amenace a su Dios y parece estar más que dispuesto a cumplirlo... El último obstáculo en su camino podría ser el más difícil".
 POD_anteshuntset.16.a:0 "Bailemos..."
 POD_anteshuntset.16.effect.success.desc:0 "¡El campeón cae!"
 POD_anteshuntset.16.critical.failure.effect.desc:0 "¡Maldito seas!"
 POD_anteshuntset.16.critical.failure:0 "Tan cerca..."        
 POD_anteshunttzimisce.8.critical.failure.effect.desc:0 "Se intensifica..."
 POD_anteshuntset.17.t:0 "La caza: Horror Primordial"
 POD_anteshuntset.17.desc:0 "Ante ti yace el cuerpo de un hombre con la cabeza de una bestia indescriptible desnudo salvo por un simple taparrabos. Te asalta un miedo que hace que incluso el Miedo Rojo parezca insignificante.\NNo puedes moverte y estás seguro de que vas a encontrarte con la Muerte Final, seguro de que esto es Set, y de que el [antediluviano|E] saciará su sed con tu sangre.\NCon todas tus fuerzas, saltas hacia delante y empiezas a beber de la vitae de la torpe criatura.\NTu mente explota."
 POD_anteshuntset.17.a:0 "¡Debo resistir!"
 POD_anteshuntset.17.effect.success.desc:0 "Sólo un poco más..."
 POD_anteshuntset.17.critical.failure.effect.desc:0 "...¿Dónde estoy?"
 POD_anteshunttzimisce.9.critical.failure.effect.desc:0 "Abrumada..."
 POD_anteshuntset.18.t:0 "La caza: Victoria"
 POD_anteshuntset.18.desc:0 "Recuerdas un lejano recuerdo de poder, un poder inimaginable, surgiendo a través de ti, y de un tremendo rugido que ahogó toda otra sensación. También sabes que hubo dolor, como si el propio sol te hubiera tragado. Tu cuerpo se estremece inconscientemente con un terror tan grande que, hasta esta noche, todos tus otros miedos han perdido el control sobre ti. Ahora eres uno de, si no el más poderoso de los vampiros activos. Tu juego es ahora el juego de los dioses".
 POD_anteshuntset.18.a:0 "La victoria sabe dulce"
 POD_anteshuntset.19.t:0 "La caza: ¿Victoria?"
 POD_anteshuntset.19.desc:0 "Recuerdas un lejano recuerdo de poder, un poder inimaginable, surgiendo a través de ti, y de un tremendo rugido que ahogó toda otra sensación. También sabes que hubo dolor, como si el propio sol te hubiera tragado. Tu cuerpo se estremece inconscientemente con un terror tan grande que, hasta esta noche, todos los demás miedos han perdido su control sobre ti. En lo que respecta a todo el mundo, lo has hecho; has matado a un [antediluviano], pero no puedes deshacerte de la molesta sensación de que algo siempre estará mal..."
 POD_anteshuntset.19.a:0 "Una victoria, sin embargo."
 POD_anteshuntabsi.1.d:0 "Cazaré al Dios de Egipto, Set"
 POD_anteshunttzimisce.10.critical.failure.effect.desc:0 "Sin final a la vista..."
 POD_anteshunttzimisce.1.t:0 "La cacería: seguir el rastro del mayor"
 POD_anteshunttzimisce.1.desc:0 "El Anciano, o Tzimisce como se le conoce más comúnmente, tiene muchas historias a su nombre. Esto debería ayudar a tu búsqueda, pero también envuelve su ubicación actual en un gran misterio. Por ello, un primer paso importante será estudiar esos rumores y medias verdades para formar una historia coherente. Tal vez entonces seas capaz de localizarlo".
 POD_anteshunttzimisce.1.a:0 "Pagar a algunos noddistas para que lo hagan".
 POD_anteshunttzimisce.1.b:0 "Lo haré yo mismo". 
 POD_anteshunttzimisce.1.effect.success.desc:0 "Eso tiene sentido".
 POD_anteshunttzimisce.1.critical.failure.desc:0 "¡Eso no tiene ningún sentido!"
 POD_anteshunttzimisce.11.critical.failure.effect.desc:0 "Estás perdido en los pasillos..."
 POD_anteshunttzimisce.3.t:0 "La caza: Resultados contradictorios"
 POD_anteshunttzimisce.3.desc:0 "Es muy difícil dar sentido a todos los rumores que rodean a Tzimisce y estás atascado. Necesitarás una buena y experimentada ayuda si quieres continuar. Esto supone un golpe para tu ego, ya que al principio querías hacerlo tú mismo, pero ¿qué es un pequeño golpe en tu orgullo cuando el poder definitivo está al final de este viaje?"
 POD_anteshunttzimisce.3.a:0 "¡Encuéntrame a los mejores nodistas!"
 POD_anteshunttzimisce.3.b:0 "Abandonemos toda esta locura". 
 antetzimisce_continue:0 "Tu búsqueda continuará". 
 antetzimisce_end:0 "Tu búsqueda terminará aquí". 
 POD_anteshunttzimisce.2.t:0 "La caza: la historia de Samiel"
 POD_anteshunttzimisce.2.desc:0 "Según tus fuentes, estás en el lugar donde el gran guerrero salubri Samiel luchó contra Tzimisce hace siglos. No está claro si Samiel fue engañado y pensó que estaba luchando contra los infernalistas Baali, o si el Anciano era realmente su objetivo.\NEn cualquier caso, Samiel nunca salió de aquí, y el propio Tzimisce apenas sobrevivió también. Ahora tienes que adentrarte en esta ominosa red de túneles si quieres encontrar la siguiente pieza del rompecabezas."
 POD_anteshunttzimisce.2.a:0 "No me asusta la oscuridad".
 POD_anteshunttzimisce.13.critical.failure.effect.desc:0 "...todavia esta muy lejos."
 POD_anteshunttzimisce.2.effect.success.desc:0 "¡Lo encontré!"
 POD_anteshunttzimisce.2.critical.failure.desc:0 "Me he perdido..."
 POD_anteshunttzimisce.2.critical.failure:0 "Sigo buscando..."
 POD_anteshunttzimisce.4.t:0 "La caza: La historia de Damek"
 POD_anteshunttzimisce.4.desc:0 "Te encuentras ahora en las ruinas de Sarmizegetusa, la antigua capital de Dacia. Más concretamente, te encuentras en lo que queda del castillo de Damek Ruthven, de quien sospechas que fue el cuidador del cuerpo de Tzimisce que se recupera tras su batalla con Samiel.\NNo queda mucho aquí, pero descubres que el sótano aún es accesible. Después de una larga búsqueda, te encuentras con los restos secos de lo que podría haber sido un árbol hace mucho tiempo. Es una pista interesante que tendrás que descifrar, pero tus ojos se ahogan ante lo que parece una manzana aún jugosa caída del árbol..."
 POD_anteshunttzimisce.4.a:0 "¿Qué hace eso aquí?"
 POD_anteshunttzimisce.4.effect.success.desc:0 "Demasiado peligroso".
 POD_anteshunttzimisce.4.critical.failure.desc:0 "¡Apetecible!"
 POD_anteshunttzimisce.4.critical.failure:0 "Tragado entero"
 POD_anteshunttzimisce.5.t:0 "La caza: la historia de Ilias"
 POD_anteshunttzimisce.5.desc:0 "Tras su recuperación en el castillo de Damek, parece que el Anciano volvió a tomar forma, esta vez invadiendo el cuerpo de un Tzimisce más joven. Con esta información, rastreaste el paradero de esta pobre alma y surgió un nombre: el Monasterio de Sernog.\NSin embargo, antes de ir allí, tendrás que hacer algunos preparativos serios, como reclutar un equipo capaz de manejar a los horrores que probablemente estén custodiando a tu presa."
 POD_anteshunttzimisce.5.a:0 "El dinero no es una preocupación".
 POD_anteshunttzimisce.5.b:0 "¡Esto se está volviendo demasiado costoso!"
 POD_anteshunttzimisce.6.t:0 "La caza: Un trato con el diablo"
 POD_anteshunttzimisce.6.desc:0 "Durante tu investigación sobre Tzimisce, un nombre surgió a menudo: Kupala. Este "demonio", aparentemente fusionado con la propia tierra de Transilvania, ha sido un enemigo de los Mayores durante mucho tiempo. Por ello, no es una gran sorpresa cuando, una noche, una figura amortajada se acerca a ti y te ofrece la bendición de su amo si lo deseas.\NEl demonio te está observando, y te ayudará si lo necesitas en las pruebas que se avecinan. Ahora tienes un poderoso aliado... pero ten cuidado de no abusar de su generosidad".
 POD_anteshunttzimisce.6.a:0 "La ayuda siempre es bienvenida... supongo".
 antetzimisce_kupala:0 "Podrás recurrir a la ayuda de Kupala durante el resto de esta búsqueda".
 POD_anteshunttzimisce.7.t:0 "La caza: La historia de Lambach"
 POD_anteshunttzimisce.7.desc:0 "Un extraño sujeto te está siguiendo desde que empezaste a preparar tu ataque a Sernog. Este Lambach Ruthven no parece amenazante, sino todo lo contrario, ya que aparece como una patética cáscara de vampiro plagada de divagaciones insanas.\NA pesar de no ser un Malkavian profético, parte de tu séquito piensa que podría estar conectado con Tzimisce de alguna manera y, como tal, es una amenaza para tu plan. Te cuesta imaginar que esta pobre ruina de hombre sea un problema para nadie, pero las apariencias engañan..."
 POD_anteshunttzimisce.7.a:0 "Puede acompañarte".
 POD_anteshunttzimisce.7.b:0 "¡Aleja a este desgraciado de mi vista!"
 POD_anteshunttzimisce.19.critical.failure.effect.desc:0 "dominado"
 POD_anteshunttzimisce.8.t:0 "La caza: Preparativos"
 POD_anteshunttzimisce.8.desc:0 "Para tomar Sernog, necesitarás un ejército. O al menos suficientes cuerpos para lanzar a los horrores que probablemente defiendan el lugar. Por suerte, los anarcas son la solución perfecta. Son abundantes, están ansiosos por acabar con un [antediluviano|E], y nadie los echará de menos.\NComo tal, estás negociando con su mayor grupo local para convencerlos de que se unan a ti. Sin embargo, esto no va muy bien, ya que quieren "concesiones" y la seguridad de no ser utilizados en algún complot de los Ancianos. No tenéis ninguna de las dos cosas, así que tendréis que convencerles por las malas antes de que esto vaya a más."
 POD_anteshunttzimisce.8.a:0 "¡Deja de gritar y escucha!"
 POD_anteshunttzimisce.8.effect.success.desc:0 "¡Están de acuerdo!"
 POD_anteshunttzimisce.8.critical.failure.desc:0 "Se intensifica..."
 POD_anteshunttzimisce.8.critical.failure:0 "Pelea a muerte"
 POD_anteshunttzimisce.9.t:0 "La caza: Fuera de Sernog"
 POD_anteshunttzimisce.9.desc:0 "Por fin has llegado al Monasterio de Sernog. La estructura se encuentra en lo alto de una cresta por encima de la línea de árboles. La fortaleza abandonada se asoma amenazante, sus muros ennegrecidos forman un oscuro esqueleto contra el cielo, un cascarón de un edificio abierto a las estrellas. Adosada a la fortaleza hay una antigua catedral, aparentemente en mejor estado pero no menos siniestra que su edificio compañero. Un pequeño ejército de jinetes negros te espera justo antes de las escaleras. No puedes distinguir sus rasgos desde esta distancia, pero probablemente son una raza especial de Revenants que defienden la fortaleza. El conflicto es inevitable".
 POD_anteshunttzimisce.9.a:0 "¡Carga!"
 POD_anteshunttzimisce.9.effect.success.desc:0 "¡Victoria!"
 POD_anteshunttzimisce.9.critical.failure.desc:0 "Abrumado..."
 POD_anteshunttzimisce.9.critical.failure:0 "Pisoteado hasta la muerte"
 POD_anteshunttzimisce.10.t:0 "La caza: la escalera"
 POD_anteshunttzimisce.10.desc:0 "Debería haber 1236 escalones rotos y sinuosos hasta el monasterio, según tu investigación. Entonces, ¿por qué parece que ya has subido el doble de ese número? No tienes todo el tiempo del mundo y empiezas a sospechar de un juego sucio, quizás una ilusión mágica de algún tipo, o algo más siniestro.\NTienes que encontrar una solución, o simplemente subirás esta cosa hasta que salga el Sol, y eso sería una mala noticia."
 POD_anteshunttzimisce.10.a:0 "Debe haber un patrón..."
 POD_anteshunttzimisce.10.b:0 "¡Kupala! Disipa esta magia!"
 rely_on_kupala:0 "Confías en Kupala para superar este obstáculo"
 POD_anteshunttzimisce.10.effect.success.desc:0 "La ilusión se disipa"
 POD_anteshunttzimisce.10.critical.failure.desc:0 "No hay final a la vista..."
 POD_anteshunttzimisce.10.critical.failure:0 "Sigue subiendo..."
 POD_anteshunttzimisce.11.t:0 "La caza: la entrada de Sernog"
 POD_anteshunttzimisce.11.desc:0 "El interior de la catedral refleja una atmósfera de oscuro presentimiento. La arquitectura parece esculpida por la febril imaginación de algún diseñador loco. Tallas grotescas de seres que podrían ser ángeles, pero que parecen demonios, miran a los que pasan por el arco de entrada al antiguo santuario. El aire dentro de la catedral tiene un olor rancio y empalagoso, como si algo eternamente moribundo se hubiera incrustado dentro de las piedras y ahora rezumara su esencia en un miasma de perpetua decadencia.|nDe alguna manera, este hedor fétido también es peligroso para los [cainitas|E], ya que empiezas a toser violentamente. Será mejor que encuentres la fuente rápidamente antes de ser abrumado por ella".
 POD_anteshunttzimisce.11.a:0 "Sigue el hedor..."
 POD_anteshunttzimisce.11.b:0 "¡Kupala! ¿Dónde debo ir?"
 POD_anteshunttzimisce.11.effect.success.desc:0 "Quemas la pila de cuerpos que causan esto"
 POD_anteshunttzimisce.11.critical.failure.desc:0 "Te pierdes en los pasillos..."
 POD_anteshunttzimisce.11.critical.failure:0 "Perdido y apestoso"
 POD_anteshunttzimisce.12.t:0 "La caza: la cámara central"
 POD_anteshunttzimisce.12.desc:0 "Espeluznantes gemidos llenan la cavernosa cámara central, resonando en las altas vigas abovedadas y reverberando en una cacofonía de gritos estridentes que imitan los gritos de las víctimas sometidas a las agonías de una tortura prolongada y exquisita.\NHay una trampilla oculta bajo el altar de la iglesia. Cortada en la tablazón de madera del suelo, la puerta se abre tirando hacia arriba de su anillo de hierro. Una estrecha y oscura escalera conduce a la cripta de la catedral y, con suerte, al final de tu búsqueda."
 POD_anteshunttzimisce.12.a:0 "No tengo miedo... creo".
 POD_anteshunttzimisce.13.t:0 "La caza: la cripta de Sernog"
 POD_anteshunttzimisce.13.desc:0 "Estás cerca. Puedes sentirlo. Allí, en el centro de esta cripta, puedes vislumbrar un sarcófago, con suerte el de Tzimisce. Lamentablemente, hay un pequeño ejército de criaturas sirvientes en tu camino. Puedes reconocer algunos Vozhd y Szlachta en él, pero también algunos otros horrores de varias formas y tamaños.\NNo tienes miedo de los monstruos, pero esta será una batalla terrible aún. Se trata de construcciones de guerra sin sentido, empeñadas en proteger este lugar".
 POD_anteshunttzimisce.13.a:0 "¡A las armas!"
 POD_anteshunttzimisce.13.b:0 "¡Kupala! Préstame tu poder!"
 POD_anteshunttzimisce.13.effect.success.desc:0 "¡Tan cerca!"
 POD_anteshunttzimisce.13.critical.failure.desc:0 "...pero tan lejos".
 POD_anteshunttzimisce.13.critical.failure:0 "Hackeado en pedazos"
 POD_anteshunttzimisce.15.t:0 "La caza: Victoria..."
 POD_anteshunttzimisce.15.desc:0 "Cuando te acercas al sarcófago para reclamar tu premio, Lambach, que te ha estado siguiendo todo el tiempo, suelta un aullido de pánico. Sorprendido, te detienes en tu movimiento... justo a tiempo para evitar ser empalado por una columna de carne procedente del cadáver malformado que hay en su interior.\NSin dejar que el no tan torpe [antediluviano|E] se recupere, le clavas los colmillos en lo que debería ser su cuello, preguntándote distraídamente si Lambach te salvó a propósito o por pura suerte. En cualquier caso, lo has hecho, el poder de la 3ª Generación fluye ahora a través de ti.\NEstás más fuerte que nunca pero... ¿por qué sigues sintiendo entonces una verdadera sensación de temor?"
 POD_anteshunttzimisce.15.a:0 "Algo está mal..."
 POD_anteshunttzimisce.16.t:0 "La caza: ¿Victoria?..."
 POD_anteshunttzimisce.16.desc:0 "Cuando te acercas al sarcófago para reclamar tu premio, una columna de carne procedente del no tan tórrido cadáver de su interior te atraviesa el pecho. Apenas consciente y sobre todo impulsado por tu Bestia, te apresuras a clavar tus colmillos en lo que debería ser el cuello de esta malformada criatura. El resto de los acontecimientos se suceden en una ráfaga de imágenes y sonidos apenas legibles.\NAl final, sigues vivo, y más poderoso que antes. Tampoco queda nada en el sarcófago. Aun así... sientes que algo va mal, como si alguien te hubiera estado observando todo el tiempo y estuviera cerca de hacer su jugada..."
 POD_anteshunttzimisce.16.a:0 "Algo falla..."
 POD_anteshunttzimisce.18.t:0 "La caza: el demonio"
 POD_anteshunttzimisce.18.desc:0 "Al salir victorioso de Sernog, te detiene una figura solitaria que te espera en la base de la larga escalera del Monasterio. Sus rasgos son indistintos, pero lo reconoces por lo que es: Kupala, el Demonio de Transilvania y némesis de Tzimisce.\NHiciste bien en ayudarlo, pero todavía hay un remanente del Anciano en ti, y Kupala no puede tener eso. Es hora de probar tus nuevos poderes".
 POD_anteshunttzimisce.18.a:0 "La batalla final..."
 endofthequest:0 "Victoria o muerte, este es el final de esta búsqueda".
 POD_anteshunttzimisce.18.effect.success.desc:0 "Un demonio derrotado"
 POD_anteshunttzimisce.18.victory:0 "¡Una victoria final!"
 POD_anteshunttzimisce.18.critical.failure.effect.desc:0 "Superado"
