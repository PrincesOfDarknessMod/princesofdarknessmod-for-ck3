 POD_anteshunttzimisce.20.t:0 "La caza: el demonio"
 POD_anteshunttzimisce.20.desc:0 "Al salir victorioso de Sernog, te detiene una figura solitaria que te espera en la base de la larga escalera del Monasterio. Sus rasgos son indistintos, pero lo reconoces por lo que es: Kupala, el Demonio de Transilvania y némesis de Tzimisce.\NHiciste bien tu parte al ayudarle, pero aún hay un remanente del Anciano en ti, y Kupala no puede tener eso. Confiaste tanto en él para llegar hasta aquí que no te diste cuenta del coste que tendría esa ayuda. Cuando el Demonio pronuncia algunos nombres arcanos de poder y comienza a desentrañar tu propia alma, y ahora sí lo entiendes. Y es demasiado tarde".
 POD_anteshunttzimisce.20.a:0 "El demonio recibe su merecido".
 instakillkupala:0 "Confiaste demasiado en Kupala y pagaste el precio".
 POD_anteshuntabsi.1.e:0 "Voy a cazar al Mayor, Tzimisce".













