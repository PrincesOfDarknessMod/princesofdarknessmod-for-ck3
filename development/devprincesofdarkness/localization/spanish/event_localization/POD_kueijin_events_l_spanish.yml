l_spanish:

 podkueijin.1.t:0 "¿Un digno sucesor?"
 podkueijin.1.desc:0 "Tus sirvientes han regresado con los prometedores Muertos de Hambre que han podido encontrar. Algunos de ellos tienen más talento que otros, pero también necesitarán más influencia para unirse a tu servicio. De todas formas será una apuesta, no tienes tiempo de revisarlos personalmente antes de hacer tu elección, ya que la repentina atención que les diste atraerá la atención de los rivales."
 podkueijin.1.a:0 "No necesito a alguien demasiado hábil. Para que no se conviertan en una amenaza..."
 podkueijin.1.a.tt:0 "Aparecerá un nuevo heredero, considerado como tu propio childe".
 podkueijin.1.b:0 "Este parece tolerable al menos".
 podkueijin.1.c:0 "Observaremos la carrera de éste con gran interés".
 podkueijin.1.d:0 "Sólo el mejor prospecto lo hará"




