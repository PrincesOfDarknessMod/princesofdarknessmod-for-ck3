 kueijin_scheme.130.t:0 "Fusión del alma"
 kueijin_scheme.130.desc:0 "Puedes comerte el alma, fusionándola así con la tuya, Este acto cuesta automáticamente un nivel de Dharma, a menos que sigas el Dharma del Tigre-Diablo o estés al servicio de un Rey Yama. Un vampiro que se come el alma de un ser obtiene acceso a los recuerdos y a las habilidades de conocimiento de ese ser. La víctima muere inmediatamente".
 kueijin_scheme.130.a:0 "Accedí a sus Habilidades de Conocimiento".
 kueijin_scheme.130.b:0 "Accedí a sus recuerdos".
 
 kueijin_scheme.200.t:0 "Puente del alma"
 kueijin_scheme.200.desc:0 "Transmitís silenciosamente simples impulsos empáticos al objetivo. Así, un vampiro podría llenar a una víctima de miedo, alegría, tristeza o emociones similares. La emoción es lo suficientemente fuerte como para que la víctima se vea obligada a actuar en consecuencia".
 kueijin_scheme.200.a:0 "Daba emoción que aumentaba una parte su personalidad".
 kueijin_scheme.200.b:0 "Di emoción que disminuya una parte su personalidad".
 
 kueijin_scheme.210.t:0 "Qué personalidad？"
 kueijin_scheme.210.desc:0 "Seleccione uno para aumentar".
 kueijin_scheme.210.a:0 "Audacia".
 kueijin_scheme.210.b:0 "Compasión".
 kueijin_scheme.210.c:0 "Energía".
 kueijin_scheme.210.d:0 "Avaricia".
