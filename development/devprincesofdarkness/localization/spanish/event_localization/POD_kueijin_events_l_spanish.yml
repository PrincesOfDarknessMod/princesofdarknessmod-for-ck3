l_spanish:

 podkueijin.1.t:0 "¿Un digno sucesor?"
 podkueijin.1.desc:0 "Tus sirvientes han regresado con los prometedores Muertos de Hambre que han podido encontrar. Algunos de ellos tienen más talento que otros, pero también necesitarán más influencia para unirse a tu servicio. De todas formas será una apuesta, no tienes tiempo de revisarlos personalmente antes de hacer tu elección, ya que la repentina atención que les diste atraerá la atención de los rivales."
 podkueijin.1.a:0 "No necesito a alguien demasiado hábil. Para que no se conviertan en una amenaza..."
 podkueijin.1.a.tt:0 "Aparecerá un nuevo heredero, considerado como tu propio childe".
 podkueijin.1.b:0 "Este parece tolerable al menos".
 podkueijin.1.c:0 "Observaremos la carrera de éste con gran interés".
 podkueijin.1.d:0 "Sólo el mejor prospecto lo hará"
podkueijin.100.t:0 "Dharma"
 podkueijin.100.desc:0 "Los Wan-Kuei han sido enviados de vuelta para cumplir su propósito kármico, y es imperativo que descubran cuál es ese propósito. Todas y cada una de las Wan-Kuei aprenden a seguir un Dharma, una forma de no vivir por la que la Wan-Kuei busca descubrir su propósito en el Gran Ciclo. A través del seguimiento de un Dharma, una Wan-Kuei aprende a canalizar el Chi, a comprender su naturaleza no muerta y a reajustarse a la rueda kármica".
 podkueijin.100.a:0 "Ya he alcanzado el nivel de Bodhisattva del Dharma".
 podkueijin.100.b:0 "Aspiro a ser un Bodhisattva".
 podkueijin.100.c:0 "Ya he alcanzado un nivel de Ancestro del Dharma".
 podkueijin.100.d:0 "Ya he alcanzado un nivel de Mandarín del Dharma".
 podkueijin.100.e:0 "Ya he alcanzado un nivel Jina de Dharma".
 
 podkueijin.110.t:0 "Yin Yang"
 podkueijin.110.desc:0 "Los Wan-Kuei de aspecto yin son depósitos de energía negativa, orientada a la muerte. Tienden a ser tranquilos, racionales y crueles.\NLos Wan-Kuei de aspecto Yang, por el contrario, consumen con avidez la energía vital. Son criaturas apasionadas, en sintonía con los mortales y las emociones.\NAlgunos Wan-Kuei son criaturas de la Balanza, sus cuerpos mantienen las energías de la vida y la muerte en equilibrio".
 podkueijin.110.a:0 "Prefiero el Yin". 
 podkueijin.110.b:0 "Prefiero el Equilibrio". 
 podkueijin.110.c:0 "Prefiero el Yang". 
 
 podkueijin.120.t:0 "Chi"
 podkueijin.120.desc:0 "Esta Rueda de las Edades gira por las interacciones del Yin y el Yang, representadas por el divino Dragón de Ébano y la Reina Escarlata. Las energías de la creación impregnan el mundo, fluyendo hacia y desde los mundos Yin y Yang. Llamada Chi, esta energía fluye a través y entre todas las Diez Mil Cosas.\NAl igual que los Kindred, los Wan-Kuei sufren de hambre. Cuando una Wan-Kuei tiene cinco o menos puntos de Chi (de cualquier tipo) en su cuerpo, se vuelve hambrienta.\NLas Virtudes del Chi de una Wan-Kuei indican la cantidad de un tipo determinado de Chi que la Wan-Kuei puede canalizar con seguridad a través de su cuerpo. La Wan-Kuei es fácilmente capaz de ingerir más Chi temporal del que indican sus Virtudes del Chi (un desequilibrio permanente permite ingerir más Chi de ese tipo sin efectos nocivos). Sin embargo, una Wan-Kuei que abusa de esta práctica corre el riesgo de sufrir un desequilibrio, una peligrosa "sobredosis" de Chi. La Wan-Kuei que no tiene ningún tipo aparticular de Chi en su cuerpo se encuentra en un estado automático de desequilibrio temporal también".
 podkueijin.120.a:0 "Aquí está mi Chi". 
 
 # Evento de mantenimiento

 podkueijin.200.t:0 "Desequilibrio"
 podkueijin.200.desc:0 "Los Kuei-jin deben regular cuidadosamente su consumo de Chi, para no sufrir un desequilibrio de Chi. Un desequilibrio de Chi Yin suele llevar al vampiro a volverse más corpóreo e inhumano con el tiempo; por el contrario, un desequilibrio de Yang puede llevar al brote de varias enfermedades vampíricas mortales y extremadamente contagiosas.\NSiempre puedes utilizar el cambio de equilibrio para cambiar tu estado yinyang."
 podkueijin.200.a:0 "Castigo por centrarse excesivamente en el Yo". 
 podkueijin.200.a.tt:0 "Tu cercanía al Yin te hizo más feo y un objetivo potencial de cazador de brujas". 
 podkueijin.200.b:0 "Aplicaré el Yang Chi a mi cuerpo para equilibrarme un poco". 
 podkueijin.200.c:0 "Castigo para toda una vida de Deseo". 
 podkueijin.200.c.tt:0 "Tu cercanía al Yang te convirtió en la fuente de un brote de enfermedades vampíricas". 
 podkueijin.200.d:0 "Aplicaré Yin Chi a mi cuerpo para equilibrarme un poco". 

 podkueijin.201.t:0 "Ch'ing Shih"
 podkueijin.201.desc:0 "Los Ch'ing Shih son auténticas monstruosidades y no pueden pasar por humanos normales de ninguna manera. La carne de los Wan-Kuei se vuelve de un gris enfermizo, mientras que los huesos se vuelven de color negro azabache. La piel se arruga y se comprime alrededor de los huesos. Los colmillos se alargan y gotean veneno, y de la espalda, las articulaciones y la caja torácica sobresalen púas negras. Todo el cuerpo brilla fosforescente y chispea con energía Yin".
 podkueijin.201.a:0 "Soy un monstruo entre los monstruos".
 
 # Evento mecánico del Chi
 
 podkueijin.210.t:0 "Pierde el control"
 podkueijin.210.desc:0 "Te has quedado sin Chi, tal vez porque eres un Yang Wan-Kuei y sientes más el hambre, o tal vez gastas todo el Chi y no puedes usar el otro aspecto Chi porque no dominas el flujo. Así que perdiste el control y te abalanzaste sobre una multitud para adquirir algo de Chi..."
 podkueijin.210.a:0 "Qué pena".

 podkueijin.211.t:0 "Falta de Chi"
 podkueijin.211.desc:0 "Un Wan Kuei sin Chi en su cuerpo comienza a desmoronarse y a pudrirse. Cada vez que debe gastar Chi (para activar una [disciplina|E] o simplemente animar su cadáver), pierde Salud en su lugar, hasta que su alma dual huye del cuerpo y su existencia como Muerto Naciente termina."
 podkueijin.211.a:0 "¡Necesito Chi!" 
 
 podkueijin.220.t:0 "Ajuste de la mecánica del Chi"

podkueijin.220.desc:0 "Puedes seleccionar qué fondo de aspecto de Chi quieres gastar primero cuando uses Chi, y sobredosificar o no cuando devores Chi".
 podkueijin.220.a:0 "¡Primer gasto! ¡#negrita Yin Chi#! / Yang Chi / Aleatorio" 
 podkueijin.220.b:0 "Primer gasto: ¡Yin Chi / #negrita Yang Chi#! / Aleatorio" 
 podkueijin.220.c:0 "Primer gasto: Yin Chi / Yang Chi / #negrita aleatoria#!" 
 podkueijin.220.d:0 "Al devorar Chi: ¡#negrita Sin sobredosis#! / Sobredosis" 
 podkueijin.220.e:0 "Cuando devore Chi: No Overdose / #bold Overdose#!" 
 podkueijin.220.f:0 "Confirmar" 

 #Evento Dharma
 
 podkueijin.230.t:0 "Dharma avanzado"
 podkueijin.230.desc:0 "Como has alcanzado un dharma elevado, ahora cada avance mejorará tu Virtud Chi, así que ahora tienes que elegir qué aspecto de la Virtud Chi quieres expandir."
 podkueijin.230.a:0 "Todo al Yin".
 podkueijin.230.b:0 "Todo al Yang".
 podkueijin.230.c:0 "A ambos".
 
 podkueijin.231.t:0 "Cien nubes"
 podkueijin.231.desc:0 "Aunque muchos afirman que ya no quedan Arhats en el mundo de la vigilia, hay tradiciones secretas que contradicen esto, y dicen que sí, que todavía hay unos cuantos de estos seres iluminados divinos rondando por ahí. Aunque se supone que pasan al Cielo (y muchos lo hacen), los pocos mencionados se quedan en el Reino Medio por decisión propia. Esto es especialmente cierto en el caso de los Tigres del Diablo, cuyos Arhats están esperando que llegue la Sexta Edad..."
 podkueijin.231.a:0 "Yo también me quedaré".
 podkueijin.231.b:0 "Quiero ir".
 
 # Evento de decisión variado
 
 podkueijin.240.t:0 "El muro"
 podkueijin.240.desc:0 "Los reinos espirituales están separados del Reino Medio por una barrera mística conocida como el Muro. Impide el contacto entre los mundos mortal y espiritual. Es más fuerte en algunas zonas, más débil en otras, pero nunca está ausente del todo.\NEl Muro nunca puede bajarse por debajo de 1, y si se sube a 10, ningún ser de la zona puede usar poderes Chi de ningún tipo. Los espíritus que se encuentren en las inmediaciones con un Muro de 10 deben gastar Fuerza de Voluntad o huir de la zona; en cualquier caso, se sentirán muy incómodos y no podrán gastar Chi".
 podkueijin.240.a:0 "Fortalecer el Muro".
 podkueijin.240.b:0 "Debilitando el Muro".
 
 # Evento misceláneo
 
 podkueijin.250.t:0 "La quinta edad"
 podkueijin.250.desc:0 "La rueda de las Edades ha llegado a la siguiente era, a medida que las edades progresan, la alimentación se vuelve más difícil, el chi se vuelve más raro y la iluminación tarda más tiempo.\NLas artes de los cuerpos divinos son ahora reemplazadas por las artes Shin-tai, conservas tus perks actuales, pero no puedes progresar más en las artes de los cuerpos divinos (No implementado aún)."
 podkueijin.250.a:0 "La Era de la oscuridad".
 
 # Evento de adopción
 
 podkueijin.300.t:0 "¿Un digno sucesor?"
 podkueijin.300.desc:0 "Llamas a tus sirvientes para que busquen información sobre los chih-mei en tus dominios, y has preparado el material necesario para el ritual que los convierte en hin. Puedes especificar más requisitos para implicarte más en el proceso, pero cuanto más específico seas, más costoso será.\N-Primero, ¿quieres a alguien que haya regresado de Yomi recientemente y haya tomado el segundo aliento, o a algún Shih que haya perdido toda su humanidad y haya despertado su P'o?"
 podkueijin.300.a:0 "Algún campesino recientemente muerto es suficiente".
 podkueijin.300.b:0 "Un cazador de demonios entrenado".
 podkueijin.300.exit:0 "Olvídalo, abandona la búsqueda".
 podkueijin.300.nocost:0 "Añadir este requisito de búsqueda no generará un coste extra".
 podkueijin.300.lowcost:0 "Añadir este requisito de búsqueda generará algún pequeño coste de prestigio".
 podkueijin.300.middlecost:0 "Añadir este requisito de búsqueda generará algún coste de prestigio moderado."
 podkueijin.300.highcost:0 "Añadir este requisito de búsqueda generará un gran coste de prestigio."
 podkueijin.300.hugecost:0 "Añadir este requisito de búsqueda generará un coste masivo de prestigio."
 podkueijin.300.back:0 "Volver a la opción anterior".
 
 podkueijin.310.t:0 "¿Un sucesor digno?"
 podkueijin.310.desc:0 "¿Qué edad y sexo quiere para su sucesor? Los más jóvenes son más difíciles de encontrar y, por tanto, más costosos".
 podkueijin.310.a:0 "Un hombre joven".
 podkueijin.310.b:0 "Un hombre de mediana edad".
 podkueijin.310.c:0 "Un hombre mayor".
 podkueijin.310.d:0 "Una mujer joven".
 podkueijin.310.e:0 "Una mujer de mediana edad".
 podkueijin.310.f:0 "Una mujer mayor".
 
 podkueijin.320.t:0 "¿Una digna sucesora?"
 podkueijin.320.desc:0 "Con tiempo y esfuerzo, su servidor acabará encontrando un objetivo con los requisitos necesarios, pero esto aumentará el coste final de toda esta empresa."
 podkueijin.320.a:0 "Encuéntrame a alguien que tuviera esta característica corporal antes de su segundo aliento".
 podkueijin.320.a.tt:0 "Se le presentará una selección de características corporales"
 podkueijin.320.b:0 "Un cuerpo medio es suficiente"

 podkueijin.321.t:0 "¿Un sucesor digno?"
 podkueijin.321.desc:0 "¿Y la belleza?"
 podkueijin.321.a:0 "Una entre millones".
 podkueijin.321.b:0 "Una entre mil".
 podkueijin.321.c:0 "Uno entre cien".
 podkueijin.321.d:0 "Sólo alguien medio".

podkueijin.322.t:0 "¿Un sucesor digno?"
 podkueijin.322.desc:0 "¿Y el intelecto?"
 podkueijin.322.a:0 "Uno entre millones".
 podkueijin.322.b:0 "Uno entre mil".
 podkueijin.322.c:0 "Uno entre cien".
 podkueijin.322.d:0 "Sólo alguien medio".

 podkueijin.323.t:0 "¿Un digno sucesor?"
 podkueijin.323.desc:0 "¿Y el físico?"
 podkueijin.323.a:0 "Uno entre millones".
 podkueijin.323.b:0 "Uno entre mil".
 podkueijin.323.c:0 "Uno entre cien".
 podkueijin.323.d:0 "Sólo alguien medio".

 podkueijin.324.t:0 "¿Un digno sucesor?"
 podkueijin.324.desc:0 "¿Algún requisito extra?"
 podkueijin.324.a:0 "Albino".
 podkueijin.324.b:0 "Gigante".
 podkueijin.324.c:0 "Enano".
 podkueijin.324.d:0 "Nada más".

 podkueijin.325.t:0 "¿Un digno sucesor?"
 podkueijin.325.desc:0 "Esta es la última oportunidad de cambiar de objetivo antes de enviar el grupo de búsqueda".
 podkueijin.325.a:0 "Eso es todo. Empiecen a buscar!"
 podkueijin.325.b:0 "Vuelve a elegir de nuevo".
 
 podkueijin.350.t:0 "Un digno sucesor"
 podkueijin.350.desc:0 "Tu sirviente te trae al que mejor encaja con todos tus criterios, ahora es el momento de hacer que este Hin aprenda sobre el dharma y se convierta en tu sucesor."
 podkueijin.350.a:0 "Procede al ritual de restauración del equilibrio dhármico".
 
 podkueijin.400.t:0 "Educación sobre el dharma I"
 podkueijin.400.desc:0 "Hasta ahora, su discípulo ha sido bastante mediocre. Probablemente pueda hacerlo mejor si continúa con el entrenamiento... ¿o tal vez éste ya no tenga esperanza de mejorar?"
 podkueijin.400.a:0 "Necesita más entrenamiento".
 podkueijin.400.b:0 "Bueno, mejor que nada"
 podkueijin.400.nolearn:0 "Tu discípulo no ha avanzado en su dharma"
 podkueijin.400.learn:0 "Tu discípulo ha avanzado en su dharma". 
 podkueijin_educación:0 "Vas a entrenar a este discípulo durante un año más. Puede que se vuelva mejor, o peor, por ello".
 
 podkueijin_education:0 "Formarás a este discípulo durante un año más. Podría volverse mejor, o peor, por eso."
 podkueijin.401.t:0 "Educación en el dharma II"
 podkueijin.401.desc:0 "Tu discípulo ha sido muy regular hasta ahora. Puede ser suficiente si no buscas un aprendiz dotado, pero quizás puedas hacerlo mejor con más entrenamiento."
 podkueijin.401.a:0 "Necesita más entrenamiento".
 podkueijin.401.b:0 "Ni el mejor, ni el peor".
 
 podkueijin.402.t:0 "Educación para el Dharma III"
 podkueijin.402.desc:0 "Tu discípulo está resultando bastante bueno, con una sólida comprensión de lo básico. Puede que sea suficiente, ¿o estás buscando al sucesor perfecto?"
 podkueijin.402.a:0 "Necesita más entrenamiento".
 podkueijin.402.b:0 "Considera que estás preparado".
 
 podkueijin.403.t:0 "Educación para el Dharma IV"
 podkueijin.403.desc:0 "En la antigüedad, se necesitaban diez años para educar a Hin, pero cuando llegó la quinta edad, sólo dos años se convirtieron en la norma. Su discípulo es el afortunado que ha terminado e incluso ha superado sus expectativas."
 podkueijin.403.a:0 "Ha aprendido todo lo que puedo enseñarle".
 
 podkueijin.500.t:0 "Forjar la personalidad"
 podkueijin.500.desc:0 "Recién recuperada la conciencia, tu discípulo se perdió mucha experiencia de primer aliento. Como sifu, debes enseñar a tu discípulo a mirar el mundo, y recientemente has encontrado una oportunidad para hacerlo."
 podkueijin.500.skip:0 "Quizás la próxima vez"
 podkueijin.501.a:0 "Adelante cuando tenga troble".
 podkueijin.501.b:0 "Tenga cuidado cuando tiene troble".
 podkueijin.502.a:0 "Tienes tiempo".
 podkueijin.502.b:0 "Muestra tu ira".
 podkueijin.503.a:0 "Leal a tu consorte".
 podkueijin.503.b:0 "El amor es para todos".
 podkueijin.504.a:0 "Estás bien".
 podkueijin.504.b:0 "Ve por más".
 podkueijin.505.a:0 "Tienes una causa".
 podkueijin.505.b:0 "El tiempo es nuestra parte".
 podkueijin.506.a:0 "Siempre hay otro camino".
 podkueijin.506.b:0 "Quédate como estás".
 podkueijin.507.a:0 "Nunca se acaba la venganza".
 podkueijin.507.b:0 "El odio no se reporta a los nobles".
 podkueijin.508.a:0 "El oro no es la preocupación".
 podkueijin.508.b:0 "Nada es posible sin dinero".
 podkueijin.509.a:0 "Se puede confiar en la gente".
 podkueijin.509.b:0 "No puedes confiar en nadie".
 podkueijin.510.a:0 "Sé honesto".
 podkueijin.510.b:0 "Una mentira de pozo no hace daño a nadie".
 podkueijin.511.a:0 "Eres uno más entre todos".
 podkueijin.511.b:0 "Eres excelente".
 podkueijin.512.a:0 "Ley sobre todos".
 podkueijin.512.b:0 "Tú sobre todos".
 podkueijin.513.a:0 "Dale tiempo".
 podkueijin.513.b:0 "El tiempo pasa rápido".
 podkueijin.514.a:0 "No disfrutes demasiado".
 podkueijin.514.b:0 "Disfruta de tu vida".
 podkueijin.515.a:0 "La confianza es la clave".
 podkueijin.515.b:0 "¡Mejor equivocarse con el mundo que que él se equivoque contigo!"
 podkueijin.516.a:0 "Fiel a tu camino".
 podkueijin.516.b:0 "Tu camino no es tan importante".
 podkueijin.517.a:0 "Sé amable".
 podkueijin.517.b:0 "Ve por ti mismo".
 podkueijin.517.c:0 "Comparte tu dolor con el mundo".
 
 # Evento general de celebración
 
 podkueijin.1010.desc:0 "Por qué aceptaste mi invitación sólo para asistir a la celebración de [otro_anfitrión.GetTitledFirstNamePossessive] no lo sé, pero que sepas que lo recordaré".
 podkueijin.1010.a:0 "Desafortunado".

 podkueijin.1011.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 podkueijin.1011.opening_desc:0 "¡Por la presente le invito a una celebración en mi corte en [baronía.GetNameNoTier]!"
 podkueijin.1011.host_likes_me:0 "Espero que asistas, ya que de lo contrario tu presencia se echaría mucho de menos."
 podkueijin.1011.host_me_agrada:0 "Como notable [ROOT.Char.GetTitleTierName], me sentiría honrado con su asistencia."
 podkueijin.1011.host_gets_along_with_me:0 "Como [ROOT.Char.GetTitleTierName] notable, sería un honor para mí su asistencia."
 podkueijin.1011.host_dislikes_me:0 "Espero que todos los notables estén allí, lo que lamentablemente te incluye a ti".
 podkueijin.1011.a:0 "Por supuesto que asistiré".
 podkueijin.1011.b:0 "Asistiré. De mala gana".
 podkueijin.1011.c:0 "Me apena decir que estoy ocupado".
 podkueijin.1011.d:0 "¡No, me niego!"

 podkueijin.1012.desc:0 "¡Te invito a una celebración en mi corte en [baronía.GetNameNoTier]! Será un gran acontecimiento, digno de tu honorable presencia".
 podkueijin.1012.a:0 "Será un placer".
 podkueijin.1012.b:0 "Tengo asuntos más importantes que atender".

 podkueijin.1013.desc:0 "¡Te invito a una celebración en mi corte en [baronía.GetNameNoTier]! Será un gran acontecimiento, con un delicioso "postre" y entretenimiento".
 podkueijin.1013.a:0 "Será un placer".
 podkueijin.1013.b:0 "Tengo asuntos más importantes que atender".
 
 podkueijin.1021.t:0 "Celebración: Una alegre reunión"
 podkueijin.1021.desc:0 "Los invitados están reunidos en el gran salón, honorables de los confines cercanos y lejanos del reino.\N¡El ambiente es brillante, y los espíritus están altos mientras la celebración comienza!"
 podkueijin.1021.a:0 "¡Bienvenidos, amigos!"
 podkueijin.1021.a.tt:0 "La celebración comienza"
 
 podkueijin.1022.t:0 "Una cálida bienvenida"
 podkueijin.1022.likes_host:0 "¡Todos los invitados están reunidos en el gran salón, y nuestro amable anfitrión, [activity.GetOwner.GetTitledFirstName], nos ha dado la bienvenida a todos a la celebración!"
 podkueijin.1022.dislikes_host:0 "Todos los invitados están reunidos en el gran salón, y nuestro anfitrión [activity.GetOwner.Custom('InsultAdjective')], [activity.GetOwner.GetTitledFirstName], nos ha dado finalmente la bienvenida a todos a la celebración."
 podkueijin.1022.a.gregarious:0 "¡No puedo esperar a hablar con todos!"
 podkueijin.1022.a.shy:0 "Hay mucha gente aquí..."
 podkueijin.1022.a:0 "¡Estoy deseando que llegue!"
 podkueijin.1022.b:0 "Más vale que esto valga mi tiempo".
 
 podkueijin.1041.t:0 "Celebración: Mientras mis invitados se van"
 podkueijin.1041.desc:0 "¡Con todos dirigiéndose a sus respectivos hogares, me enorgullece decir que la celebración fue un éxito!"
 podkueijin.1041.spouse:0 "Tengo que agradecer a mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] gran parte de su éxito, y no siento más que gratitud mientras [spouse.GetSheHe] despide a los últimos invitados."
 podkueijin.1041.no_spouse:0 "No obstante, sigo agradeciendo que el esfuerzo haya terminado por ahora."
 podkueijin.1041.a:0 "¡Hasta la próxima!"

 podkueijin.1042.t:0 "Celebración: Volviendo a casa"
 podkueijin.1042.desc:0 "¡Qué celebración! Recordaré los días pasados en los salones de [host.GetTitledFirstNamePossessive] durante mucho tiempo.\NAhora es el momento de lavar los rastros de la alegría y el 'postre', y volver a retomar mis deberes como gobernante en el mundo sobrenatural."
 podkueijin.1042.a:0 "¡Adiós, mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]!"

 podkueijin.1090.t:0 "Deberes abandonados"
 podkueijin.1090.desc:0 "¡Qué desastre!\NDespués de todos mis preparativos, mis invitados han llegado a una celebración sin anfitrión!\NSe han ido a casa, y les he dejado una terrible impresión de mí."
 podkueijin.1090.a:0 "Puedo llegar a lamentar esto".
 
 podkueijin.1091.t:0 "Una pobre celebración"
 podkueijin.1091.desc:0 "No puedo creerlo. A pesar de mis invitaciones y preparativos, no ha aparecido ni un solo invitado a mi celebración.\N¡No importa! Disfrutaré de todo este "postre" yo solo, ¡y el eco de los pasos en mi gran salón es toda la compañía que necesito!"
 podkueijin.1091.a:0 "¿Estoy realmente tan solo?"
 podkueijin.1091.b:0 "Me siento un poco aliviado".
 
 podkueijin.1092.t:1 "Celebración: Desatendida"
 podkueijin.1092.desc:0 "¡El escándalo! [activity.GetOwner.GetTitledFirstName] no ha aparecido en la celebración propia de [activity.GetOwner.GetHerHis]! ¿Es que [activity.GetOwner.GetSheHe] está intentando tomarnos el pelo a todos?"
 podkueijin.1092.a:0 "¡Esto ha sido una pérdida de tiempo!"

 podkueijin.1093.t:0 "Celebración: Fin de los festejos"
 podkueijin.1093.desc:1 "Con el fallecimiento de [host.Custom2('MyCharacterIntroduction', ROOT.Char)] [host.GetHerHis], la celebración llega a su fin.\n\nMientras los invitados apagados se van, rezo para que [ROOT.Char.GetFaith.HighGodNameAlternate] les dé la bienvenida [host.GetFirstName] tan cordialmente a [ROOT.Char.GetFaith.PositiveAfterLife] como [host.GetSheHe] nos dio la bienvenida a los salones de [host.GetHerHis]."
 podkueijin.1093 .desc:1 "Con el paso de [host.Custom2('MyCharacterIntroduction', ROOT.Char)] [host.GetHerHis] la celebración llega a su fin.\NA medida que los invitados sometidos se van, ruego que [ROOT. Char.GetFaith.HighGodNameAlternate] acoja a [host.GetFirstName] tan calurosamente a [ROOT.Char.GetFaith.PositiveAfterLife] como [host.GetSheHe] nos acogió en los salones de [host.GetHerHis]".
 podkueijin.1093.a:1 "Fin de la celebración".
 podkueijin.1094.desc:0 "Como ahora estoy entre rejas, mi gran celebración se cancelará. Oh, todas esas horas que pasé preparándola... Desperdiciadas!"

 podkueijin.1095.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ha sido encarcelado, y la gran celebración de [host.GetHerHis] ha llegado a su fin. Qué mala suerte!"
 
 # Evento Art Traning
 art_train_header:0 "Entrenamiento de arte:"
 
 podkueijin.1101.t:0 "$art_train_header$ Palabra extraña"
 podkueijin.1101.desc:0 "Estás buscando entre tu colección de libros extraños para encontrar inspiración, cuando uno de ellos llama tu atención, está escrito por algún escritor occidental. En una línea se dice que los vampiros orientales utilizan como insulto "que vivas en el tiempo interesante"... pero, ¿qué significa esto?"
 podkueijin.1101.a:0 "No tiene ningún significado".
 podkueijin.1101.b:0 "Lo traduciré como 'que nazcas en una familia mejor'".
 
 podkueijin.1102.t:0 "$art_train_header$ ha llegado a una meseta"
 podkueijin.1102.desc:0 "Has entrenado duro y has tenido éxito, pero tienes una sensación persistente de que puedes hacerlo mejor, así que tal vez deberías esforzarte un poco más, pero en lugar de eso tal vez retrocedas."
 podkueijin.1102.a:0 "No voy a forzarme".
 podkueijin.1102.b:0 "Me obligaré a mí mismo".
 
 podkueijin.1199.t:0 "$art_train_header$ Resultado del entrenamiento"
 podkueijin.1199.desc_shintai:0 "Tus continuos combates y entrenamientos con otros han dado algún resultado.\N-"
 podkueijin.1199.desc_chi_arts:0 "Tu continua coordinación con la energía chi del ambiente ha dado algún resultado.\N"
 podkueijin.1199.desc_soul_arts:0 "Tu continuo trabajo en las artes del alma ha dado algún resultado.\N"
 podkueijin.1199.desc_demon_arts:0 "Tu continua interacción con tu Demonio ha dado algún resultado.\n\n"
 podkueijin.1199.desc_demon_arts:0 "Tu continua interacción con tu demonio ha dado algún resultado.
 podkueijin.1199.desc_tan:0 "Tu continuo experimento con nuevos materiales ha dado algún resultado.\n\n"
 podkueijin.1199.desc_qiao:0 "Tus continuos intentos de conectarte con el mundo han dado algún resultado.\n\n"
 podkueijin.1199.desc_tan:0 "Tus continuos experimentos con nuevos materiales han dado algún resultado.
 podkueijin.1199.desc_no_focus:0 "Su rápido cambio de enfoque puede dar algún resultado extraño...\n\n"
 podkueijin.1199.desc_good:0 "Has mejorado mucho en tu poder artístico".
 podkueijin.1199.desc_good_bad:0 "Ganaste mucha experiencia para tu arte".
 podkueijin.1199.desc_same:0 "Sólo aprendiste un poco".
 podkueijin.1199.desc_bad_good:0 "Forzaste demasiado, esto le dio una oportunidad a tu Demonio".
 podkueijin.1199.desc_bad:0 "Tu Demonio está totalmente desatado ya que tu práctica ha salido mal".
 podkueijin.1199.desc_fallback:0 "Que lo hagas mejor la próxima vez".
 podkueijin.1199.a:0 "Muy bien".
 podkueijin.1199.a.ex:0 "¡Utilizaré mis conocimientos del dharma para archivar aún más!"
 podkueijin.1199.b:0 "Es suficiente".
 podkueijin.1199.b.ex:0 "¡Utilizaré mi conocimiento del dharma para obtener una conclusión!"
 podkueijin.1199.c:0 "Mejor que nada".
 podkueijin.1199.c.ex:0 "Mi conocimiento del dharma me ayudará a conseguir más".
 podkueijin.1199.d:0 "Resistiré".
 podkueijin.1199.d.ex:0 "Usaré mi experiencia del dharma para calmar esto".
 podkueijin.1199.e:0 "Aquí viene..."
 podkueijin.1199.e.ex:0 "Gastaré gran parte de mi progreso dhármico para evitar esto".
 
 # Evento Trek the Wild
 trek_header:0 "Trek the Wild:"
 
 podkueijin.1201.t:0 "$trek_header$ Un aprendiz de Shih"
 podkueijin.1201.desc:0 "Estabas caminando por el the wild, cuando un joven cazador te detiene, quiere desafiar a la oscuridad"
 podkueijin.1201.a:0 "Te mostraré".
 podkueijin.1201.b:0 "Será mejor que corra".
 
 podkueijin.1202.t:0 "$trek_header$ Un mentor Shih"
 podkueijin.1202.desc:0 "Parece que el mentor de ese discípulo estaba cerca, rescató a su aprendiz de ti, y colocando el autocontrol sobre la necesidad de venganza aunque tu dañaras tanto a su discípulo."
 podkueijin.1202.a:0 "Otro cadáver".
 podkueijin.1202.b:0 "Los dejaré ir".
 
 podkueijin.1211.t:0 "$trek_header$ Animal Exótico"
 podkueijin.1211.desc_opening:0 "Estuviste caminando en medio de la nada durante un tiempo hasta que encontraste unos "
 podkueijin.1211.desc_white_deer:0 "ciervos blancos"
 podkueijin.1211.desc_rhinoceros:0 "rinoceronte"
 podkueijin.1211.desc_green_peafowl:0 "gaviota verde"
 podkueijin.1211.desc_panda:0 "pandas"
 podkueijin.1211.desc_snub_nosed_monkey:0 "monos de nariz respingona"
 podkueijin.1211.desc_ending:0 "cerca de ti, cazar un animal tan raro seguramente te dará prestigio"
 podkueijin.1211.a:0 "Los capturaré".
 podkueijin.1211.a.success:0 "He tenido éxito".
 podkueijin.1211.a.failure:0 "He fallado".
 podkueijin.1211.b:0 "Los dejaré ir".
 
 podkueijin.1221.t:0 "$trek_header$ La Serenísima Señora de la Perla Negra, Madre de las Sombras"
 podkueijin.1221.desc:0 "Te has encontrado con el Arhat de las Flores de Hueso, que también parece una chica de dieciséis años. Difícil de encontrar, y custodiada por un formidable séquito de seguidores y sus sirvientes espirituales invocados, está no obstante dispuesta a compartir su sabiduría con aquellos que consigan encontrarla. Su sincero deseo es preservar todo el conocimiento que pueda para prepararse para la próxima Sexta Edad".
 podkueijin.1221.a:0 "Es un honor para mí".
 podkueijin.1299.t:0 "$trek_header$ Volviendo de la naturaleza"
 podkueijin.1299.desc_opening:0 "Has terminado tu aventura, regresando a casa para descansar.\N"
 podkueijin.1299.desc_good:0 "Tu gran acción ha sido conocida a lo largo y ancho, admiran tu hazaña".
 podkueijin.1299.desc_good_bad:0 "Ahora hay algunas historias inventadas sobre ti, incluso algunas buenas".
 podkueijin.1299.desc_same:0 "Casi nadie sabe lo que hiciste, como si nunca hubieras salido".
 podkueijin.1299.desc_bad_good:0 "Ahora hay algunas historias inventadas sobre ti, sobre todo malas".
 podkueijin.1299.desc_bad:0 "Tu vergonzoso acto se ha conocido a lo largo y ancho, esto afectará a tu prestigio".
 podkueijin.1299.desc_fallback:0 "Por alguna razón, tu acción nunca fue registrada..."
 podkueijin.1299.a:0 "Excelente".
 podkueijin.1299.a.ex:0 "¡Busca algún narrador, todos deberían conocer mi leyenda!"
 podkueijin.1299.b:0 "Bien".
 podkueijin.1299.b.ex:0 "¡No! ¡Debo contratar a alguien que hable por mí!"
 podkueijin.1299.c:0 "Bien".
 podkueijin.1299.c.ex:0 "Bueno, siempre agradezco algún rumor útil".
 podkueijin.1299.d:0 "Preferiría que me esperaran menos".
 podkueijin.1299.d.ex:0 "Esto podría ser malo, si no tenemos 'otra versión' de la historia..."
 podkueijin.1299.e:0 "Que hablen, me da igual".
 podkueijin.1299.e.ex:0 "Pagaré a alguien para que limpie esto".

 # Vivir entre el evento Mortal
 mortal_business_header:0 "Entre Mortales:"
 
 podkueijin.1301.t:0 "$mortal_business_header$ Portentos"
 podkueijin.1301.desc:0 "Eres excepcionalmente hábil en las prácticas formales e informales de adivinación y lectura de presagios. Dependiendo de tu nivel de destreza, podrías montar un próspero negocio en el mundo de los mortales."
 podkueijin.1301.a:0 "Puedo leer las palmas de las manos".
 podkueijin.1301.b:0 "Puede que sepa algo de Tzu Wei".
 podkueijin.1301.c:0 "Predigo los destinos".
 
 podkueijin.1302.t:0 "$mortal_business_header$ Truco de la carne"
 podkueijin.1302.desc:0 "Siempre es una opción usar algún poder para engañar a algunos mortales imbéciles, y tú puedes tener algún poder flesh shintai para hacerlo."
 podkueijin.1302.a:0 "Puedo usar el cuello largo para fingir ser un usuario de Gong Tau".
 podkueijin.1302.b:0 "Tengo un irresistible aliento de loto..."
 podkueijin.1302.c:0 "¿Debo usar pelesit para imitar a un manipulador de Ku o Chin-Ts'an?"
 
 podkueijin.1311.t:0 "$mortal_business_header$ Mil grullas madre"
 podkueijin.1311.desc:0 "Arhat de los Dragones que Golpean, es fundadora directa de la secta Arco Iris que Ríe, e indirecta de todas las demás. Permanece en los Reinos Mortales, cambiando de retiro cada cuatro años. Sigue consultando regularmente a los adeptos del Dharma sobre cuestiones de iluminación, aunque últimamente prefiere hablar con los jina de bajo rango que con los mandarines."
 podkueijin.1311.a:0 "Es mi honor".
 
 podkueijin.1399.t:0 "$mortal_business_header$ Volviendo del mundo mortal"
 podkueijin.1399.desc_opening:0 "Después de pasar un tiempo entre los mortales, finalmente vuelves a tu mundo, separándote de ellos como es debido.\N"
 podkueijin.1399.desc_good:0 "Durante la estancia, has ganado fácilmente una fortuna".
 podkueijin.1399.desc_good_bad:0 "Ganaste muchos recursos en el proceso".
 podkueijin.1399.desc_same:0 "Conseguiste algo de oro con tu trabajo".
 podkueijin.1399.desc_bad_good:0 "Te has desquitado".
 podkueijin.1399.desc_bad:0 "Perdiste algo de oro".
 podkueijin.1399.desc_fallback:0 "Tu cuenta muestra algún número raro..."
 podkueijin.1399.a:0 "¡Soy rico!"
 podkueijin.1399.b:0 "Más es mejor".
 podkueijin.1399.c:0 "Genial".
 podkueijin.1399.d:0 "Hum..."
 podkueijin.1399.e:0 "¡Nooo!"
 
 # Segundo evento de Brethday
 
 podkueijin.1501.t:0 "Segundo Brethday: El mejor regalo"
 podkueijin.1501.desc:0 "Los invitados entraron uno a uno, mientras el portero anunciaba los exóticos tesoros que habían regalado, el más especial de los cuales era [friendly_guest.GetFirstNameNoTooltip] uno, algo realmente inaudito."
 podkueijin.1501.a:0 "¡Muy bien!"
 
 podkueijin.1502.t:0 "Segundo Día de la Raza: El peor regalo"
 podkueijin.1502.desc:0 "Los invitados entraron uno a uno, mientras el portero anunciaba los tesoros exóticos que habían regalado. Pero cometiste un error al invitar a [unfriendly_guest.GetFirstNameNoTooltip], ¡porque [unfriendly_guest.GetSheHe] te regaló una campana funeraria!"
 podkueijin.1502.a:0 "¡Cómo te atreves!"
 
 podkueijin.1510.t:0 "Segundo cumpleaños: El chico del melocotón"
 podkueijin.1510.desc:0 "En medio de la celebración, cuando abres tu Melocotón de la Inmortalidad, ¡descubres que hay un niño dentro!"
 podkueijin.1510.a:0 "Ummm... ¡un desierto extra!"
 podkueijin.1510.b:0 "Saca a este Momotaro de aquí".
 
 # Evento del festival del barco del dragón
 
 podkueijin.1601.t:0 "Carrera de botes de dragón: comienzo"
 podkueijin.1601.desc:0 "La carrera de botes de dragón comenzó y los competidores están divididos en dos equipos, el escarlata y el negro, y se puede hacer una pequeña apuesta sobre qué equipo ganará."
 podkueijin.1601.a:0 "Equipo escarlata".
 podkueijin.1601.b:0 "Equipo negro".
 podkueijin.1601.c:0 "No me interesa".
 
 podkueijin.1602.t:0 "Carrera de botes de dragón: ventaja"
 podkueijin.1602.desc:0 "Los competidores reman desesperadamente contra las olas embravecidas y el fuerte viento, apresurándose hacia el frente. Su equipo preferido ya está varios centímetros por delante del otro equipo, lo que es genial..."
 podkueijin.1602.a:0 "Cambia la apuesta".
 podkueijin.1602.b:0 "Mantener la apuesta".
 
 podkueijin.1603.t:0 "Carrera de botes de dragón: desventaja"
 podkueijin.1603.desc:0 "Los competidores reman desesperadamente contra el oleaje y el fuerte viento, apresurándose hacia el frente. Su equipo preferido ya está varios centímetros por detrás del otro equipo, esto es malo..."
 podkueijin.1603.a:0 "Cambia la apuesta".
 podkueijin.1603.b:0 "Mantener la apuesta".
 
 podkueijin.1604.t:0 "Carrera de botes de dragón: ganar"
 podkueijin.1604.desc:0 "Como una flecha de la cuerda, los barcos dragón se persiguen uno tras otro, ¡y tu equipo preferido ha ganado! Esto es increíble!"
 podkueijin.1604.a:0 "Sé que tengo una buena visión".
 
 podkueijin.1605.t:0 "Carrera de botes de dragón: perder"
 podkueijin.1605.desc:0 "Como una flecha fuera de la cuerda, los barcos dragón se persiguieron uno tras otro, y tu equipo preferido perdió. Has perdido todo lo que habías apostado".
 podkueijin.1605.a:0 "Eso pasa alguna vez".
 
 # Art Scheme
 
 kueijin_scheme.100.t:0 "Comiendo espíritu"
 kueijin_scheme.100.desc:0 "Realmente puedes ver el alma fantasmal fluir del cuerpo de la víctima y entrar en tu tercer ojo. Ahora puedes decidir qué hacer".
 kueijin_scheme.100.a:0 "Purgar el alma".
 kueijin_scheme.100.b:0 "Torturar el alma".
 kueijin_scheme.100.c:0 "¡Come el alma!"
 
 kueijin_scheme.110.t:0 "Purga del alma"
 kueijin_scheme.110.desc:0 "El alma de la víctima se une a la tuya, y puedes empezar un proceso de limpieza en el alma".
 kueijin_scheme.110.a:0 "Intento de devolverlos a su camino dhármico".
 kueijin_scheme.110.b:0 "Intento devolver a la víctima su Humanidad perdida".
 
