 PODquincunx.100.t:0 "Noticias de China"
 PODquincunx.100.desc:0 "Un mensajero llega a ti, trayendo noticias de Oriente.\NEn un pergamino enviado al Emperador Da de la Corte del Tigre Blanco, los verdaderos Wan Kuei de la Corte de la Tortuga Negra restantes renuncian tanto a la luz del Cielo como a la oscuridad del Yomi.\NEsta carta confirma la legitimidad de la primera facción, lo que hace que las Cortes del Tigre Blanco y del Emperador Amarillo convoquen una reunión de todos los Ancestros influyentes dentro de tres años para evaluar la situación."
 PODquincunx.100.option.a:0 "¿Debo asistir?"
 
 PODquincunx.110.t:0 "Noticias de China : Consejo de Dragones"
 PODquincunx.110.desc:0 "La congregación de los Ancestros se reunió en el monasterio de Shaolin cerca de Changan, declaró que los extranjeros, en particular los Kin-Jin, eran los culpables de la caída de las Cortes de Agosto.\NEn respuesta, establecerán una nueva orden: el Quincunx. Constará de varias cortes en los cinco puntos cardinales: la Corte de la Sangre en el norte, la Corte de la Carne en el este, la Corte de la Llama en el sur, la Corte del Hueso en el oeste y la Corte del Jade en el centro".
 PODquincunx.110.option.a:0 "Un nuevo orden se levanta en China".
 
 PODquincunx.201.t:0 "El destino de la Corte de Fónix Escarlata"
 PODquincunx.201.desc:0 "Tortuga Negra y Emperador Amarillo Wan Kuei presionan contra tu corte, y los Wan Kuei con mentalidad política en todas las cortes lanzan acusaciones de akuma con poca o ninguna evidencia. Es hora de que decidas Fénix Escarlata, separarte de las cortes del norte y proclamar nuevas cortes. O obedece su mandato de mantener la unión".
 PODquincunx.201.option.a:0 "Declara la independencia".
 PODquincunx.201.option.b:0 "Purga de todos los yomitas".
 
 PODquincunx.200.t:0 "El fin de la Corte del Fénix Escarlata"
 PODquincunx.200.desc:0 "La Corte del Fénix Escarlata siempre ha estado aislada de las cortes chinas y no es de extrañar que hayan decidido no participar en la reunión del Quincunx.\NComo una nueva era amanece sobre ellos, han decidido renombrarse en las Cortes Doradas y mantener su independencia."
 PODquincunx.200.option.a:0 "La Rueda de las Edades está girando".
 
 PODquincunx.210.t:0 "El fin de la Corte del Dragón Azul"
 PODquincunx.210.desc:0 "La civilidad entre los gaki japoneses y los Muertos de Hambre del continente ha terminado. Los supervivientes coreanos acabaron viajando al sur y ayudaron a formar el Quincunx. La Corte del Dragón Azul coreana/japonesa ya no existe, dividida entre las Cortes Verdes de Corea, aliadas del Quincunx, y los Clanes del Sol en Nihon/Japón."
 PODquincunx.210.option.a:0 "La Rueda de las Edades está girando".
 
 PODquincunx.220.t:0 "El fin de la Corte del Emperador Amarillo"
 PODquincunx.220.desc:0 "El ataque al Emperador Wang Hongben fragmentó la Sociedad del Jade Dorado, separando la Corte del Emperador Amarillo. La situación empeoró con la destrucción de la conquista mongola y la acusación de ayudar a los infernalistas Akuma.\NCon el Tratado del Quincunx, la Corte del Emperador Amarillo se ha reformado en la Corte de Jade."
 PODquincunx.220.option.a:0 "La Rueda de las Edades está girando".
 
 PODquincunx.230.t:0 "El fin de la Corte del Tigre Blanco"
 PODquincunx.230.desc:0 "La Corte del Tigre Blanco se dividió en facciones rivales cuando la Emperatriz Fan abandonó su posición, los intentos del Emperador Da de traer la paz fracasaron.\NDespués de la franja de destrucción traída por los mongoles y Akuma de la corte de la Tortuga Negra; los sobrevivientes se unieron al recién formado Quincunx.\NLa Corte del Tigre Blanco ya no existe."
 PODquincunx.230.option.a:0 "La Rueda de las Edades está girando".
 
 PODquincunx.240.t:0 "El fin de la Corte de la Tortuga Negra"
 PODquincunx.240.desc:0 "Cuando los ejércitos Ming atacan Karakorum, docenas de Wu de todas las Cortes de Agosto descienden a la ciudad para vengarse, y la batalla nocturna dura semanas. Al final, la Corte de la Tortuga Negra, infestada de Akuma, ya no existe: los que aún no se han corrompido se han unido al Quincunx, los demás han sido pasados por la antorcha o la espada."
 PODquincunx.240.option.a:0 "La Rueda de las Edades está girando".
