 kueijin_scheme.220.g:0 "Sociabilidad".
 kueijin_scheme.220.h:0 "Venganza".
 kueijin_scheme.220.i:0 "Celo".
 
 kueijin_scheme.300.t:0 "Proyectar energía psíquica negativa"
 kueijin_scheme.300.desc:0 "Canalizas toda tu culpa, frustración, ira y hambre en tu alma de huno y luego proyectas esta energía psíquica negativa como un cuchillo en el alma de la víctima."
 kueijin_scheme.300.a:0 "¡Sufre mi dolor!"
 
