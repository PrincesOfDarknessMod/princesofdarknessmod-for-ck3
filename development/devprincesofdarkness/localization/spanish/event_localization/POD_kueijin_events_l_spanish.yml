 kueijin_scheme.210.g:0 "Sociabilidad".
 kueijin_scheme.210.h:0 "Venganza".
 kueijin_scheme.210.i:0 "Celo".
 
 kueijin_scheme.220.t:0 "Qué personalidad？"
 kueijin_scheme.220.desc:0 "Seleccione uno para disminuir".
 kueijin_scheme.220.a:0 "Atrevimiento".
 kueijin_scheme.220.b:0 "Compasión".
 kueijin_scheme.220.c:0 "Energía".
