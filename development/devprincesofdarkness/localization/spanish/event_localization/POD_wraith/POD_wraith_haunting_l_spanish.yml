l_spanish:

 POD_wraith_haunting.100.t:0 "Haunting"
 POD_wraith_haunting.100.desc:0 "Estás decidido a hacer miserable a [recipient.GetTitledFirstName], pero no puedes estar en todas partes. ¿En qué concentras tus esfuerzos?"
 POD_wraith_haunting.100.a:0 "[recipient.GetFirstNameNoTooltip] no encontrará la paz".
 POD_wraith_haunting.100.b:0 "Debería interrumpir el sueño de [recipient.GetHerHis]. "
 POD_wraith_haunting.100.c:0 "Los espías de [recipient.GetHerHis|U] merecen mi esfuerzo".
 POD_wraith_haunting.100.d:0 "Mis ataques deberían centrarse en los recaudadores de impuestos".
 POD_wraith_haunting.100.e:0 "Los generales y los entrenamientos de [recipient.GetHerHis]".
 POD_wraith_haunting.100.f:0 "La corte de [recipient.GetHerHis|U] es el objetivo correcto".
 POD_wraith_haunting.200.t:0 "¡Encantado!"
 POD_wraith_haunting.200.desc:0 "Sientes una presencia invisible en la noche: un fantasma ha decidido jugarte malas pasadas, generando todo tipo de efectos nocivos."
 POD_wraith_haunting.200.a:0 "¡Como si los muertos vivientes no fueran suficientemente malos!"
 POD_wraith_haunting.toast:0 "[recipient.GetFirstName] está embrujado".

