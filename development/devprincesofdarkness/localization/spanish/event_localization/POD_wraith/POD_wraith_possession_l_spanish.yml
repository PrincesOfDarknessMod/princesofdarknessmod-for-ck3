l_spanish:

 POD_wraith_possession.100.t:0 "[possession|E]"
 POD_wraith_possession.100.desc:0 "[actor.GetTitledFirstName] está intentando [possess|E]. Notas que partes de tu cuerpo se mueven por sí solas, pensamientos que no deberías tener. ¿Tal vez sea hora de llamar a un exorcista? "
 POD_wraith_possession.100.option.a:0 "Ejercer mi fuerza de voluntad y luchar por mi cuerpo".
 POD_wraith_possession.100.option.b:0 "Resistir al intruso".
 POD_wraith_possession.100.option.c:0 "Aceptar la [posesión|E]".
 
 POD_wraith_possession.200.t:0 "Poseer [receptor.GetFirstNameNoTooltip]"
 POD_wraith_possession.200.desc:0 "Ha llegado el momento de tomar el control del cuerpo de [recipient.GetTitledFirstName], pero [recipient.GetSheHe] se resiste."
 POD_wraith_possession.200.option.a:0 "Continúa de todos modos".
 POD_wraith_possession.200.a.tt_willpower:0 "[destinatario.GetFirstNameNoTooltip] ha ejercido su voluntad de resistirse a tu intrusión."
 POD_wraith_possession.200.a.tt_fortitude:0 "[recipient.GetFirstNameNoTooltip] es hábil en la disciplina de la Fortaleza y se resiste a tu manipulación."
 POD_wraith_possession.200.a.success.desc:0 "Victoria"
 POD_wraith_possession.200.a.tt_success:0 " ¡El cuerpo de [recipient.GetTitledFirstName] será mío!"
 POD_wraith_possession.200.a.failure.desc:0 "Derrota"
 POD_wraith_possession.200.a.tt_failure:0 "[recipient.GetTitledFirstName] se resistió a mi intento de [possess|E] [actor.GetHerHim]."
 
 POD_wraith_possession.200.option.b:0 "Ejerce mi voluntad. Todos los mortales son marionetas de mis hilos".
 POD_wraith_possession.200.option.c:0 "Abandona este esfuerzo, ya no deseo tomar el control del cuerpo de [recipient.GetHerHis]".
 POD_wraith_possession.200.option.c.tt:0 "La [posesión|E] fallará".

 
 POD_wraith_possession.300.t:0 "El cuerpo de [recipient.GetFirstNameNoTooltip] ha sido poseído"
 POD_wraith_possession.300.desc:0 "Has reforzado tu control sobre el cuerpo de [recipient.GetTitledFirstName]. Esta marioneta ahora te pertenece".
 POD_wraith_possession.300.option.a:0 "Es como debe ser".


 POD_wraith_possession.400.t:0 "Has sido poseído"
 POD_wraith_possession.400.desc:0 "Habiendo perdido la batalla de voluntades ante [actor.GetTitledFirstName], pierdes otro grado de control ante [actor.GetHerHim]." 
 POD_wraith_possession.400.option.a:0 "Mi cuerpo ya no es mío".
 
 POD_wraith_possession.500.t:0 "Se ha resistido [posesión|E]"
 POD_wraith_possession.500.desc:0 "[destinatario.GetTitledFirstName] se ha resistido a mi intento de [poseer|E] [destinatario.GetHerHim]." 
 POD_wraith_possession.500.option.a:0 "¡Frustrado!"


 POD_wraith_possession.600.t:0 "Resuelto [posesión|E]"
 POD_wraith_possession.600.desc:0 "[actor.GetTitledFirstName] ha abandonado el intento de [actor.GetTitledHerHis] de invadir tu cuerpo." 
 POD_wraith_possession.600.option.a:0 "¡Mi cuerpo es mío!"

 

 POD_wraith_possession_toast_title:0 "¡Espectro exitoso!"
 POD_wraith_possession_toast_text:0 "Tu espectro ha conseguido [possess|E] al objetivo, dándote cierto control sobre él e imbuyéndolo de poder."
 
 POD_wraith_possession.toast.fail:0 "¡El Espectro ha fallado!"
 POD_wraith_possession.toast.fail.desc:0 "Tu objetivo se resistió a la [possession|E] del espectro."