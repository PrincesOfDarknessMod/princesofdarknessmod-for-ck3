l_spanish:
 survey_capital_decision:0 "Encuesta tu Capital"
survey_capital_decision_tooltip:0 "Viajarás por tu princedom"
 survey_capital_decision_opening_desc:0 "A veces, puede que tengas que hacer las cosas tú mismo. De todos modos, ¿quién puede confiar realmente en estos asesores tan halagadores?"
 survey_capital_decision_confirm:0 "Vamos a recorrer mis tierras"
 survey_capital_decision_desc_shy:0 "Como eres perezoso, esta actividad puede ser estresante"
 survey_decision_effect_tooltip:0 "Esto te dará oportunidades para mejorar tu capital"
 
 strict_control_modifier:0 "Control estricto"
 strict_control_modifier_desc:0 "Estás controlando todo lo que ocurre en tu dominio, lo que te da mayores oportunidades de influencia, pero también mayor rechazo de los mortales."
 lax_control_modifier:0 "Control laxo"
 lax_control_modifier_desc:0 "Estás dejando a los mortales mayormente libres para hacer lo que quieran aquí. Prosperan rápidamente sin la influencia vampírica para obstaculizarlos".
  
 opportunities1_modifier:0 "Nuevas oportunidades I"
 opportunities1_modifier_desc:0 "Podrían surgir pronto nuevas oportunidades de influencia en esta provincia. Cuando este modificador llegue a 5, se desbloqueará una nueva ranura de construcción. Ten en cuenta que puedes tener un máximo de 9 ranuras de construcción a la vez, este modificador será inútil una vez alcanzado ese tope."

 opportunities2_modifier:0 "Nuevas oportunidades II"
 opportunities2_modifier_desc:0 "Podrían surgir pronto nuevas oportunidades de influencia en esta provincia. Cuando este modificador llegue a 5, se desbloqueará una nueva ranura de construcción. Ten en cuenta que puedes tener un máximo de 9 ranuras de construcción a la vez, este modificador será inútil una vez alcanzado ese tope."
  
 opportunities3_modifier:0 "Nuevas oportunidades III"
 opportunities3_modifier_desc:0 "Podrían surgir pronto nuevas oportunidades de influencia en esta provincia. Cuando este modificador llegue a 5, se desbloqueará una nueva ranura de construcción. Ten en cuenta que puedes tener un máximo de 9 ranuras de construcción a la vez, este modificador será inútil una vez alcanzado ese tope."
  
 opportunities4_modifier:0 "Nuevas oportunidades IV"
 opportunities4_modifier_desc:0 "Podrían surgir pronto nuevas oportunidades de influencia en esta provincia. Cuando este modificador llegue a 5, se desbloqueará una nueva ranura de construcción. Ten en cuenta que puedes tener un máximo de 9 ranuras de construcción a la vez, este modificador será inútil una vez alcanzado ese tope."

 opportunitiesend_modifier:0 "Totalmente influenciado"
 opportunitiesend_modifier_desc:0 "Has alcanzado la cantidad máxima de influencia (y ranuras de construcción) que puedes tener en esta provincia."
  
 POD_survey_events.1000.t:0 "La encuesta: ¿una escolta?"
 POD_survey_events.1000.desc:0 "Eres consciente de que, a pesar de estar nominalmente en tus dominios, hay peligros que acechan fuera de tu sede de poder. Mientras preparas este importante reconocimiento de tu capital, te preguntas qué escolta, si es que hay alguna, debes llevar contigo. Obviamente, no quieres que parezca que tienes miedo de viajar por tus propias tierras, pero puede que te preocupe aún más una posible emboscada o una amenaza inesperada..."
 POD_survey_events.1000.option.a:0 "¡Todo un ejército!"
 POD_survey_events.1000.option.b:0 "Algunos guardias serán suficientes"
 POD_survey_events.1000.option.c:0 "Deberían tener miedo de mí, no al revés"
 full_escort_survey_tooltip:0 "Una opción segura pero poco impresionante"
 half_escort_survey_tooltip:0 "Probablemente una opción equilibrada"
 no_escort_survey_tooltip:0 "Una elección prestigiosa pero potencialmente peligrosa"
  
 POD_survey_events.1001.t:0 "La encuesta: ¿a dónde?"
 POD_survey_events.1001.desc:0 "Estás listo para salir pero la noche no es eterna (tristemente), así que tendrás que elegir qué parte de la ciudad inspeccionarás esta noche. Obviamente, hay diferentes oportunidades y riesgos en cada una de ellas. También limitarás tu elección entre las zonas en las que tienes algunos activos de los que ocuparte, no es necesario vagar sin rumbo."
 POD_survey_events.1001.option.a:0 "Un barrido general de mi influencia en la ciudad"
 POD_survey_events.1001.option.b:0 "Vamos al cuartel militar"
 POD_survey_events.1001.option.c:0 "¿Los gremios de mercaderes quizás?"
 survey_buildings_option_tooltip:0 "Se abren más opciones en función de los edificios presentes en su capital"
 POD_survey_events.1001.option.d:0 "¿Qué hace el clero por la noche?"
 POD_survey_events.1001.option.e:0 "El barrio noble es donde está el poder"
 POD_survey_events.1001.option.f:0 "Tengo amigos en lugares bajos"
 
 POD_survey_events.1.t:0 "La encuesta: una patrulla"
 POD_survey_events.1.desc:0 "Durante tu recorrido por la ciudad, te encuentras con una patrulla de guardias probablemente de la milicia. Sinceramente son un grupo lamentable, sus armaduras apenas aguantan y sus pies apenas los arrastran hacia adelante. Es bastante fácil evitarlos y no te molestan, pero este encuentro te hace pensar que, tal vez, podrías aumentar tu dominio sobre la ciudad influyendo en algunos más de ellos.\NSería fácil hacerlo, pero eso ciertamente no ayudaría a la suerte de los ciudadanos, apenas protegidos por esta parodia de soldados. Por otro lado, podrías retirar la influencia que ya tienes sobre ellos, esperando que mejoren con el tiempo sin tu interferencia."
 POD_survey_events.1.option.a:0 "Más control siempre es mejor"
 POD_survey_events.1.option.b:0 "Tal vez pueda aflojar en este caso concreto"
 POD_survey_events.1.option.c:0 "Sólo hay que pagar los nuevos uniformes"
 
 POD_survey_events.2.t:0 "La encuesta : Sin techo"
 POD_survey_events.2.desc:0 "A medida que recorres la ciudad, te das cuenta de que hay bastantes mortales sin hogar por ahí intentando sobrevivir en las calles. Son presas fáciles, pero no ayudan a mejorar el prestigio de tu dominio. Se te ocurre una idea novedosa, ¡tal vez podrías hacer una "inversión"! Darles algo de oro podría ayudar a convertirlos en miembros productivos de tu ganado con el tiempo. O podrías simplemente no molestarte, los mortales serán mortales después de todo".
 POD_survey_events.2.option.a:0 "Aquí, para servirme mejor"
 POD_survey_events.2.option.b:0 "Las presas fáciles son suficientemente buenas"
 
 POD_survey_events.3.t:0 "La Encuesta : Reclutas"
 POD_survey_events.3.desc:0 "Tu control sobre los militares con guarnición en la ciudad es bueno, pero siempre hay que mantenerlo. Especialmente cuando los nuevos reclutas están entrando en el proceso de formación, ya que esos recién llegados todavía están libres de tu influencia. Al acercarte al cuartel militar, observas que están haciendo un ejercicio de perforación nocturna que podría ser una oportunidad. ¿Quizás podrías presentarte?".
 POD_survey_events.3.option.a:0 "Considérame como tu superior"
 POD_survey_events.3.option.b:0 "No voy a molestar a estos"
 POD_survey_events.3.option.c:0 "¡Yo mismo entrenaré a estos gusanos!"

 survey_mercenaries_contact_modifier:0 "Contacto con los mercenarios"
 survey_mercenaries_contact_modifier_desc:0 "Has invertido mucho en los mercenarios locales. Da sus frutos".
 
 POD_survey_events.4.t:0 "La encuesta : Mercenarios"
 POD_survey_events.4.desc:0 "Los mercenarios son un hecho en estos tiempos difíciles. Has sido lo suficientemente diligente como para invertir en los locales durante bastante tiempo y no te sorprende verlos esta noche, divirtiéndose ruidosamente en las calles de la ciudad. Si estás planeando algunas aventuras militares, invertir aún más en ellos podría resultar fructífero. Otra opción sería reducir tu control sobre ellos durante un tiempo, ya que estás seguro de que los habitantes de la ciudad no están muy contentos de tener a tantos rufianes desfilando en medio de ellos sin ser desafiados."
 POD_survey_events.4.option.a:0 "¡Amigos, tengo un nuevo trabajo para vosotros!"
 POD_survey_events.4.option.b:0 "Dejad de molestar a los vecinos, por favor"
 
 POD_survey_events.5.t:0 "La encuesta: oportunidades"
 POD_survey_events.5.desc:0 "Gracias a tu considerable influencia sobre la clase mercantil de la ciudad, a menudo eres el primero en ser informado sobre nuevas oportunidades lucrativas. Y como cualquier mecenas generoso como usted, no duda en sacar su tajada de cualquier nuevo negocio. Uno de tus contactos te advierte esta noche sobre las últimas novedades y sobre cómo sacar el mejor provecho de ellas. También dice que esto podría ser un gran impulso para el desarrollo de la ciudad... pero sacar tu merecida tajada podría entorpecerlo bastante. ¿Qué vas a hacer?"
 POD_survey_events.5.option.a:0 "Invertiré en ello"
 POD_survey_events.5.option.b:0 "Muéstrame el dinero"
 POD_survey_events.5.option.c:0 "Muéstrame TODO el dinero"
 auspexadvanced_tooltip:0 "Esta opción está disponible porque tienes fuertes poderes de percepción"

 POD_survey_events.6.t:0 "La encuesta: tipo nuevo"
 POD_survey_events.6.desc:0 "Un nuevo negocio ha abierto recientemente en tu ciudad y estabas pensando en hacerle una visita esta noche. Obviamente, sólo está siendo útil para dar a conocer a cualquier forastero quién es el verdadero líder del barrio mercantil de aquí. Sin embargo, tienes dudas.\NTe has dado cuenta de que, después de tu visita, la mayoría de estos comerciantes parecen perder de alguna manera la voluntad de trabajar realmente\Nhasta los huesos por el bien de tu comunidad. ¿Quizás podrías probar un nuevo y audaz enfoque y simplemente no interferir?"
 POD_survey_events.6.option.a:0 "Los métodos antiguos funcionan mejor"
 POD_survey_events.6.option.b:0 "Déjalo en paz"
 POD_survey_events.6.option.c:0 "¡Sacúdelo!"
 greedy_tooltip:0 "Esta opción está disponible porque eres un chupasangre codicioso"
 POD_survey_events.7.t:0 "La encuesta: hombres de fe"
 POD_survey_events.7.desc:0 "El clero es quizá la parte de la sociedad mortal más difícil de influir. Basta con que uno de sus miembros tenga una fe fuerte para poner en peligro toda tu operación. Esta noche te han informado de que un problemático predicador ha venido a hacer un mitin en tu ciudad y ya ha atraído a bastantes seguidores. Su diatriba contra los 'demonios' y los 'monstruos' podría ser un peligro potencial... pero eliminarlo por la fuerza o de otro modo también tendría consecuencias".
 POD_survey_events.7.option.a:0 "¡No hay predicador en mi ciudad!"
 POD_survey_events.7.option.b:0 "No será una amenaza... ¿verdad?"
 POD_survey_events.7.option.c:0 "Únete a la multitud disfrazada de seguidor"
 obfuscateadvanced_tooltip:0 "Esta opción está disponible porque tienes un gran dominio de Obfuscate"
  
 POD_survey_events.8.t:0 "La Encuesta : Nuevo Templo"
 POD_survey_events.8.desc:0 "A pesar de la buena influencia que tienes en el clero de tu dominio, no has podido detener la construcción prevista de un nuevo lugar de oración en las cercanías. Ahora te paseas cerca de él, mirando con fastidio el progreso de la obra. Tener aún más hombres de fe en tu zona podría ser problemático, ya que suelen ser muy capaces de discernir tu verdadera naturaleza. Sin embargo, aún hay tiempo para asegurarse de que la construcción sufra algunos desafortunados contratiempos..."
 POD_survey_events.8.option.a:0 "Déjalo estar"
 POD_survey_events.8.option.b:0 "Contrata a unos rufianes"
 POD_survey_events.8.option.c:0 "¡Pégale fuerte!" 
 potenceadvanced_tooltip:0 "Esta opción está disponible porque tus puños pueden causar terremotos literales"

 POD_survey_events.9.title:0 "La encuesta : Amor joven"
 POD_survey_events.9.desc:0 "Mientras paseas por el barrio noble, te encuentras con una situación interesante. Desde la calle, un joven intenta cortejar a una joven que le mira desde su balcón. Sin embargo, no parece muy eficaz, ya que tartamudea mucho y su bella no tarda en cerrar la ventana, dejándole abatido.\N-Es evidente que es un hijo de la nobleza, y esa situación parece una posibilidad fácil, aunque inusual, de conseguir un nuevo contacto que podría ser útil en el futuro."
 POD_survey_events.9.option.a:0 "Dale algunos consejos"
 POD_survey_events.9.option.b:0 "Reírse de él"
 POD_survey_events.9.option.c:0 "Ayuda a conseguir un final feliz" 
 
 POD_survey_events.10.t:0 "La encuesta: la ley"
 POD_survey_events.10.desc:0 "Tienes algunos contactos útiles en el sistema judicial mortal de tu ciudad. De uno de ellos te has enterado de que esta noche se va a juzgar un caso que incluye a unos rufianes que probablemente serán ahorcados por sus fechorías. El problema es que se trata de "tus" rufianes y aún podrían serte útiles para asegurarte de que los mortales de la zona se comporten como es debido. ¿Intervendrás para ayudarlos?"
 POD_survey_events.10.option.a:0 "La justicia es ciega"
 POD_survey_events.10.option.b:0 "¡Yo soy la ley!"

 POD_survey_events.11.t:0 "La encuesta: los ladrones"
 POD_survey_events.11.desc:0 "Gracias a tus contactos en los bajos fondos de tu ciudad, has podido acorralar a un exitoso grupo de ladrones que lleva tiempo asolando el barrio noble. Son simples mortales y no suponen ninguna amenaza para ti, pero podrían serte útiles. Estás pensando en "contratarlos", asegurándote de que una parte de sus hazañas vuelva a ti. O simplemente podrías deshacerte de ellos, haciendo que el barrio sea más seguro en el futuro inmediato".
 POD_survey_events.11.option.a:0 "Ahora trabajas para mí"
 POD_survey_events.11.option.b:0 "Dejemos esta tontería chicos"
 
 POD_survey_events.12.t:0 "La encuesta: el matón"
 POD_survey_events.12.desc:0 "A pesar de tu influencia en los bajos fondos de la ciudad, parece que uno de los maleantes no ha captado el mensaje. Sonríe mientras este matón le amenaza. Realmente, es todo tan pintoresco que apenas reprimes una risa, lo que hace que el matón se agite visiblemente y se acerque a ti con lo que parece una mirada amenazante. Una distracción refrescante, sin duda, pero ¿qué hacer ahora?"
 POD_survey_events.12.option.a:0 "Desangrarlo"
 POD_survey_events.12.option.b:0 "Haz que trabaje para ti"
 POD_survey_events.12.option.c:0 "Es hora de reconsiderar tus opciones de vida"

 POD_survey_events.101.t:0 "La encuesta : Regreso sin incidentes"
 POD_survey_events.101.desc:0 "Tras el pequeño recorrido por tu ciudad, regresas a tu refugio sin problemas. La actividad nocturna pronto volverá a machacar tu cordura pero al menos ha sido refrescante dar un paseo por ahí."
 POD_survey_events.101.option.a:0 "Todo ha ido bien"

 POD_survey_events.110.t:0 "La encuesta : El asesino"
 POD_survey_events.110.desc:0 "Apenas lo ves venir.\NCuando vuelves a tu refugio, el sonido de una daga desenvainada te hace girar, justo a tiempo para ver una figura sombría demasiado cerca de tu cuello para tu comodidad. ¿Un agente de un rival? ¿Un rival largamente olvidado? No tienes tiempo para reflexionar, ya que tu futuro asesino salta hacia ti con un movimiento demasiado rápido para ser el de un simple mortal..."
 POD_survey_events.110.option.a:0 "¡Guardias! A mí!"
 survey_assassin_tooltip:0 "Tu escolta completa se encargará de esto". 
 POD_survey_events.110.option.b:0 "Hagamos esto"
 POD_survey_events.110.effect.success.desc:0 "Abrumado, el asesino huye"
 POD_survey_events.110.critical.failure.effect.desc:0 "Un movimiento en falso..."
 POD_survey_events.110.critical.failure:0 "Sangre y oscuridad"
 POD_survey_events.110.option.d:0 "¡Huye!"

 POD_survey_events.111.t:0 "La encuesta : El asesino II"
 POD_survey_events.111.desc:0 "Abrumado por tu fuerte defensa, el asesino gira repentinamente la cola y emprende la huida. En un movimiento reflejo impulsado principalmente por tu Bestia vengativa, corres tras él. Pronto ambos os movéis a una velocidad sobrenatural y la persecución os lleva por calles, edificios e incluso tejados. Se hace bastante difícil seguirlo, pero también ves signos de agotamiento en tu objetivo. ¿Quizás se le está secando la sangre? Sea como sea, la persecución termina y..."
 POD_survey_events.111.option.a:0 "...¡escapa!"
 assassin_flees_tooltip:0 "Es demasiado rápido para ti. Es hora de volver a casa". 
 POD_survey_events.111.option.b:0 "...¡lo has atrapado!"
 celeridadconsejo_de_herramienta:0 "Esta opción está disponible gracias a tus poderes de velocidad sobrenatural." 

 celerityadvanced_tooltip:0 "Esta opción está disponible gracias a tus poderes de velocidad sobrenatural."
 list_names_survey_modifier:0 "Lista de nombres"
 list_names_survey_modifier_desc:0 "Ya sabes quiénes son. Y los encontrarás".
 
 POD_survey_events.112.t:0 "La encuesta : El asesino III"
 POD_survey_events.112.desc:0 "Te estabas acercando a tu cazador convertido en presa cuando, de repente, el asesino gira su daga sobre sí mismo. Probablemente, al darse cuenta de que su huida era inútil e imaginar las cosas tan gráficas que le harías para hacerle hablar, opta por acabar con su propia vida.\NNo es exactamente el final que querías, pero tras un rápido vistazo a las cenizas, observas varios papeles que hablan del contrato sobre tu cabeza. Obviamente, no enumeran con precisión quién te quiere muerto, pero siguen siendo bastante esclarecedores..."
 POD_survey_events.112.option.a:0 "Mejor que nada"
 
 POD_survey_events.120.t:0 "La encuesta: el fuego"
 POD_survey_events.120.desc:0 "¿Por qué ahora? ¿Es sólo una incompetencia mortal? ¿O un ataque indirecto de uno de sus rivales? No importa el culpable, un gran incendio ha empezado a extenderse alrededor de tu ciudad y está cerca de rodear tu posición, haciendo que volver a tu refugio sea una perspectiva peligrosa.\NTu Bestia ya se enfurece dentro de su jaula para simplemente correr como un demonio mientras consideras la mejor manera de evitar, o despejar, a los mortales gritones y al fuego codicioso. No será fácil".
 POD_survey_events.120.option.a:0 "¡Guardias! Despejad el camino!"
 beast_takeover_survey_tooltip:0 "Tu Bestia frenética te llevará a un lugar seguro" 
 POD_survey_events.120.option.b:0 "Encontraré un camino..."
 POD_survey_events.120.effect.success.desc:0 "Escapas de lo peor del infierno"
 POD_survey_events.120.critical.failure.effect.desc:0 "Termina como empezó. En fuego".
 POD_survey_events.120.critical.failure:0 "¡Arde! Se quema!"
 POD_survey_events.120.option.d:0 "Deja que la Bestia se haga cargo" 
 
 POD_survey_events.121.t:0 "La encuesta : El fuego II"
 POD_survey_events.121.desc:0 "Has conseguido evitar lo peor del incendio y los mortales lo están limpiando poco a poco. Lamentablemente, tu ruta de escape te ha alejado bastante de tu refugio, demasiado lejos para que puedas evitar el sol de la mañana si intentas llegar allí. Por ello, no te queda más remedio que refugiarte en un lugar indigno hasta que puedas volver a tu sede de poder la noche siguiente."
 POD_survey_events.121.option.a:0 "¡Es como una acampada!"
 survey_fire_ending_tooltip:0 "Vuelves a casa la noche siguiente sintiéndote sucio, pero todavía de una pieza." 
 POD_survey_events.121.option.b:0 "Simplemente me fundiré con la Tierra"
 proteanadvanced_tooltip:0 "Esta opción está disponible gracias a tu dominio de Protean". 
 POD_survey_events.121.option.c:0 "Organiza un buen alojamiento"

 POD_survey_events.130.t:0 "La encuesta : Los cazadores"
 POD_survey_events.130.desc:0 "¡Una emboscada! En tu camino de vuelta a tu refugio, un grupo aparentemente bien organizado (e informado) de cazadores de vampiros te ha rodeado. Están bien armados y son cautelosos en su aproximación, demostrando que no es su primera cacería. Los mortales no suelen ser una preocupación, pero un grupo así, con antorchas, flechas encendidas y probablemente uno o dos verdaderos creyentes, es otro asunto completamente distinto... Considera tus opciones".
 POD_survey_events.130.option.a:0 "¡Guardias! Encargaos de ellos!"
 best_bravely_tooltip:0 "No esperaban que huyeras. Los pierdes fácilmente pero se acordarán de ti".
 POD_survey_events.130.option.b:0 "¡A la batalla!"
 POD_survey_events.130.effect.success.desc:0 "¡Una victoria decisiva!"
 POD_survey_events.130.critical.failure.effect.desc:0 "Termina como empezó. En fuego".
 POD_survey_events.130.critical.failure:0 "¡Arde! Se quema!"
 POD_survey_events.130.option.d:0 "¡Huye!" 

 POD_survey_events.131.t:0 "La encuesta : Los cazadores II"
 POD_survey_events.131.desc:0 "La victoria es tuya. Te sirves de la sangre de estos mortales, ya que no la necesitarán más, y piensas en qué hacer con los heridos supervivientes de este asalto ahora a tu merced. Llevarlos de vuelta a tu refugio para una "demostración" frente a tu corte parece una opción agradable y relajante. O podrías optar por una exhibición más pública en una zona céntrica de tu ciudad, pero seguro que esto llamará la atención de más cazadores en el futuro."
 POD_survey_events.131.option.a:0 "Una exhibición privada suena bien"
 POD_survey_events.131.option.b:0 "Domínalos para quitarte a los demás de encima"
 POD_survey_events.131.option.c:0 "Es hora de dar ejemplo"
  
 POD_survey_events.140.t:0 "La encuesta: el profeta"
 POD_survey_events.140.desc:0 "Al regresar a tu refugio, te aborda un anciano que murmura lo que parece un balbuceo incoherente. Sin embargo, puedes distinguir palabras como "vampiros" y "Dios", que llaman tu atención. Al frenar un poco, el loco se acerca y empieza a hablar con más entusiasmo que antes. Incluso prestando atención, entender una pizca de lo que está tratando de decir sería toda una hazaña todavía".
 POD_survey_events.140.option.a:0 "Me quedo un rato, y escucho"
 ending_survey_tooltip:0 "Vuelve a casa sin más impedimentos". 
 POD_survey_events.140.option.b:0 "No escucho a ningún loco"
 POD_survey_events.140.effect.success.desc:0 "Eso tiene cierto sentido"
 POD_survey_events.140.critical.failure.effect.desc:0 "No lo entiendo..."
 POD_survey_events.140.critical.failure:0 "¡No tengo ni idea!"

 POD_survey_events.141.t:0 "La encuesta : El profeta II"
 POD_survey_events.141.desc:0 "Bueno, fue... no exactamente 'esclarecedor', pero al menos hay algunas cosas interesantes sobre las que reflexionar acerca de lo que dijo este anciano. Aunque la naturaleza siempre críptica de este tipo de profecías hace que no merezcan la pena la mayoría de las veces. En cualquier caso, el autoproclamado profeta se alegra de que le hayas escuchado y te ha dejado en paz. Tu refugio te espera, con más preguntas que respuestas".
 POD_survey_events.141.option.a:0 "Sólo divagando en realidad"
 malkavian_survey_tooltip:0 "Esta opción está disponible porque eres un Malkavian" 
 POD_survey_events.141.option.b:0 "¡Las preguntas son el punto!"
 POD_survey_events.141.option.c:0 "No, en serio, esto estaba clarísimo"
