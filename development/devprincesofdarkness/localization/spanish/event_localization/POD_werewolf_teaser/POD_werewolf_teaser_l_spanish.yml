l_spanish:
 POD_werewolf_teaser.100.t:0 "¡Una sorpresa!"
 POD_werewolf_teaser.100.desc:0 "¡Mientras estás cazando, de repente ves a un lobo de nueve pies de alto parado sobre sus patas traseras! No te ve todavía. ¿A qué te dedicas?"
 POD_werewolf_teaser.100.option.a:0 "¡Huir!"
 POD_werewolf_teaser.100.option.a.tt:0 "¿Es esto de todos modos para experimentar el nuevo contenido que los jugadores han estado pidiendo desde que se lanzó el mod por primera vez?"
 POD_werewolf_teaser.100.option.b:0 "¡Mata al lupino!"
 POD_werewolf_teaser.100.option.b.tt:0 "¡Los jugadores han estado esperando esto durante más de un año! ¡Hagámoslo!"
 POD_werewolf_teaser.300.t:0 "El aullido de los lobos"
 POD_werewolf_teaser.300.desc:0 "¡Has derrotado al lupino y tomado su sangre! Qué bestia más temible era esa. No puedes evitar preguntarte cuántos más vagan por estas tierras y si los verás en el futuro.\n\nA lo lejos, escuchas los aullidos de una manada de lobos."
 POD_werewolf_teaser.300.option.a:0 "'¿Esto es todo lo que hay?'"
 POD_werewolf_teaser.300.option.a.tt:0 "Un nuevo símbolo completo llevará tiempo. Cuando lancemos completamente los personajes jugables de hombres lobo, queremos que tenga al menos la profundidad y complejidad de la adición de cazadores al mod; con mecánicas de juego que aportan un estilo de juego diferente. Si tienes ideas sobre cómo deberíamos crear hombres lobo en Princes of Darkness Mod, ahora es el momento de decírnoslo. Salta a nuestro Discord y cuéntanos!"
 POD_werewolf_teaser.400.t:0 "El aullido de los lobos"
 POD_werewolf_teaser.400.desc:0 "Mientras la temible bestia cierra sus fauces alrededor de tu garganta, te preguntas si este es el final. ¿Es esta tu muerte final? Tus últimos momentos enfrascados en un combate con esta impresionante y terrible criatura. ¿Hay muchos más como este?\n\nEn la distancia, escuchas los aullidos de una manada de lobos.\n\nEl lupino luego te arranca la cabeza del cuerpo."
 POD_werewolf_teaser.400.option.a:0 "'¿Esto es todo lo que hay?'"
 POD_werewolf_teaser.400.option.a.tt:0 "Un nuevo símbolo completo llevará tiempo. Cuando lancemos completamente los personajes jugables de hombres lobo, queremos que tenga al menos la profundidad y complejidad de la adición de cazadores al mod; con mecánicas de juego que aportan un estilo de juego diferente. Si tienes ideas sobre cómo deberíamos crear hombres lobo en Princes of Darkness Mod, ahora es el momento de decírnoslo. Salta a nuestro Discord y cuéntanos!"
 POD_blood_of_a_werewolf_modifier:0 "Sangre de lupino consumida"
 POD_werewolf_form_crinos_modifier:0 "Forma Crinos"
 POD_werewolf_teaser_hunting_tt:0 "Si bajas al bosque esta noche, te llevarás una gran sorpresa."
 POD_hunting_accident_tt:0 "Tienes un accidente mientras cazas."
 POD_hunting_success_tt:0 "Tienes una cacería exitosa."
