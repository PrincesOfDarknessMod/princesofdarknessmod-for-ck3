l_spanish:
 POD_blood_tithe_kine.100.t:0 "Llegada del diezmo de sangre"
 POD_blood_tithe_kine.100.desc:0 "[recipient.GetTitledFirstName] ha enviado el diezmo de sangre solicitado. El diezmo se llama, '[kine_tithe.GetFirstName]'. [kine_tithe.GetHerHis|U] se dice que la sangre contiene una"
 POD_blood_tithe_kine.100.desc.negligible:0 "despreciable"
 POD_blood_tithe_kine.100.desc.fleeting:0 "fugaz"
 POD_blood_tithe_kine.100.desc.intense:0 "intenso"
 POD_blood_tithe_kine.100.desc.acute:0 "agudo"
 POD_blood_tithe_kine.100.desc.choleric:0 "colérico"
 POD_blood_tithe_kine.100.desc.melancholic:0 "melancólico"
 POD_blood_tithe_kine.100.desc.phlegmatic:0 "flemático"
 POD_blood_tithe_kine.100.desc.sanguine:0 "Sanguino"
 POD_blood_tithe_kine.100.desc.finish:0 "resonancia."
 POD_blood_tithe_kine.100.option.a:0 "Los agregaré a mi rebaño."
 POD_blood_tithe_kine.100.option.b:0 "Tíralos a mi mazmorra."
 POD_blood_tithe_kine.100.option.b.tt:0 "[kine_tithe.GetFirstName] será encarcelado."
 POD_blood_tithe_kine.100.option.b.imprison:0 "El diezmo de sangre del ganado tirado en el calabozo."
 POD_blood_tithe_kine.100.option.c:0 "Bienvenido a mi corte, [kine_tithe.GetFirstName]."
 POD_blood_tithe_kine.100.option.d:0 "Los consumiré ahora."
 POD_blood_tithe_kine.100.option.e:0 "Este recipiente es inaceptable, tráeme otro."
 POD_blood_tithe_kine.100.option.f:0 "Apártate de mi vista."
