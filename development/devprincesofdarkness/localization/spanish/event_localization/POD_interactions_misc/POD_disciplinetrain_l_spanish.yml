 POD_disciplinetrain.110.option.n:0 "Viento negro"
 POD_disciplinetrain.110.option.o:0 "Demonio Shintai"

 POD_disciplinetrain.120.t:0 "Entrenamiento Qiao"
 POD_disciplinetrain.120.desc:0 "Los métodos de entrenamiento de los Shih han cambiado muy poco a lo largo de los siglos. La mente de un Shih debe ser moldeada adecuadamente para resistir las tentaciones y los terrores del shen y, por lo tanto, es la primera área donde comienza el entrenamiento. Enseñarás a [disciplinanadie.GetFirstName] el Qiao de..."
