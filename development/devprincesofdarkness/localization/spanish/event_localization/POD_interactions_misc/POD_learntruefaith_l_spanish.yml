l_spanish:

 POD_learntruefaith.001.t:0 "Fe verdadera"
 POD_learntruefaith.001.desc:0 "Pides ayuda a [teacher.GetFirstName]. A pesar de ser uno de los siervos más devotos de Dios, no consigues la fuerza divina que muestran otros fieles. ¿Es tu alma demasiado débil? ¿Estás haciendo algo mal? Ahora estás decidido a mejorar, pero no estás muy seguro de cómo hacerlo. [profesor.GetFirstName] ha ideado una prueba de fe que puede ayudarte, pero ¿eres lo suficientemente piadoso para completarla?"
 POD_learntruefaith.001.option.a:0 "¡Soy lo suficientemente piadoso!"
 POD_learntruefaith.001.option.a.tt:0 "Tu fe está a prueba"
 POD_learntruefaith.001.option.a.desc:0 "Una prueba de fe"
 POD_learntruefaith.001.option.a.success:0 "Eres digno"
 POD_learntruefaith.001.option.a.success.tt:0 "Has completado la prueba"
 POD_learntruefaith.001.option.a.failure:0 "No eres digno"
 POD_learntruefaith.001.option.a.failure.tt:0 "Has fallado la prueba"
 POD_learntruefaith.001.option.b:0 "No creo que pueda hacer esto"
 POD_learntruefaith.001.option.b.tt:0 "Abandonas tu intento de conseguir la fe verdadera"
 POD_learntruefaith.101.t:0 "Digno del poder divino"
 POD_learntruefaith.101.desc:0 "¡Has completado la prueba! ¿Quizás esta fuerza estaba en ti todo el tiempo y sólo necesitaba una muestra de confianza por tu parte? Probablemente nunca lo sabrás, ya que Dios trabaja de forma misteriosa. [profesor.GetFirstName] está muy orgulloso de ti y tu tiempo con él ha terminado, ya que ahora puedes sentir la gracia de Dios."
 POD_learntruefaith.101.option.a:0 "Le serviré hasta que muera"
 POD_learntruefaith.101.option.a.tt:0 "Eres digno del poder divino"
 POD_learntruefaith.201.t:0 "No eres digno del poder divino"
 POD_learntruefaith.201.desc:0 "Has fallado la prueba. Tal vez no sea el camino que Dios eligió para ti. Quieres creer en esto porque la alternativa, la posibilidad de que hayas perdido Su favor de alguna manera, es insoportable. [profesor.GetFirstName] está decepcionado pero dispuesto a volver a intentarlo en otra ocasión".
 POD_learntruefaith.201.option.a:0 "No me detendré"
 POD_learntruefaith.201.option.a.tt:0 "No tienes la Verdadera Fe... todavía"