 POD_chargen.1300.t:0 "Revenants"
 POD_chargen.1300.desc:0 "Los esclavos de la sangre consumían la sangre de sus dominadores vampiros, estos engendros asumían una parte del poder de la parentela. En raras ocasiones, algunos de sus hijos nacieron con sangre de vampiro en sus venas. Con un mayor dominio de la sangre, son más poderosos que sus padres. Comúnmente llamados "revenants", los vástagos ghoul del clan Tzimisce son llamados 'Zadruga'. ¿De qué línea de retornados desciende usted?"
 POD_chargen.1300.option.a:0 "Zadruga, los vástagos de los Tzimisce"
 POD_chargen.1300.option.b:0 "Servidores de la Tal'mahe'Ra, la Mano Negra"
 POD_chargen.1300.option.c:0 "Siervos de la sangre en Europa"
 POD_chargen.1300.option.d:0 "Algo más raro..."
 POD_chargen.1300.option.e:0 "Una dinasty independiente"
 POD_chargen.1300.option.f:0 "Tal vez no sea un revenant"
 
 POD_chargen.1310.t:0 "Zadruga"
 POD_chargen.1310.desc:0 "El Anciano esparció su sangre entre sus siervos mortales.  Estos siervos criaron al primer Zadruga.  ¿Perteneces a una de las líneas de sangre Zadruga más notables o a algo más oscuro?"
 POD_chargen.1310.option.a:0 "Obertus, los antiguos son unos venerables eruditos"
 POD_chargen.1310.option.b:0 "Grimaldi, agentes manipuladores de la sociedad mortal"
 POD_chargen.1310.option.c:0 "Szantovich, reliquias decadentes y libertinas"
 POD_chargen.1310.option.d:0 "Bratovitch, maestros de kennel reclusos y truculentos"
 POD_chargen.1310.option.e:0 "Premsyl, nobles de Praha"
 POD_chargen.1310.option.f:0 "Una de las casas más pequeñas"
 POD_chargen.1310.option.g:0 "Dirijo una nueva casa de cadetes"
 POD_chargen.1310.option.h:0 "Tal vez no soy de la Zadruga en absoluto..."
 
