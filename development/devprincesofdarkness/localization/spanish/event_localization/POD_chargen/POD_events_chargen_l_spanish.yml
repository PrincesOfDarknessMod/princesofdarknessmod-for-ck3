 POD_chargen.1370.t:0 "La mascarada"
 POD_chargen.1370.desc:0 "El silencio de la sangre es mantener tu naturaleza sobrenatural en secreto para los mortales. Si los kine saben que eres un monstruo, pueden intentar destruirte. Peor aún. otros sobrenaturales también pueden buscar tu destrucción para asegurar su propia supervivencia. Algunos sobrenaturales evitan el secreto y, en su lugar, se deleitan con el pavor que provoca la revelación de su naturaleza monstruosa. Usar poderes sobrenaturales flagrantes en público o dejar un rastro de cadáveres; todo ello aumenta la exposición de la mascarada de un revenant".
 POD_chargen.1370.option.a:0 "Mi naturaleza sobrenatural está oculta". 
 
 POD_chargen.1380.t:0 "El hambre"
 POD_chargen.1380.desc:0 "La Bestia tiene hambre. Los vampiros mantienen su existencia inmortal gracias a la sangre. La sangre también alimenta sus poderes sobrenaturales. Esa sangre sigue fluyendo por las venas de los revenants. El uso de sus habilidades sobrenaturales, como las disciplinas o la curación fantástica, tiene la posibilidad de aumentar su hambre de sangre. Cuanto más ansia de sangre vampírica tenga un retornado, más irracional, desesperado, violento y estresado se volverá. Con el tiempo, los retornados transforman parte de su sangre mortal en sangre vampírica...., canibalizándose a sí mismos.  Los retornados también pueden reducir su hambre bebiendo la sangre de los vampiros".
 POD_chargen.1380.option.a:0 "¿Me atrevo a usar los poderes de mi don oscuro?"

 POD_chargen.1400.t:0 "La Inquisición ordena"
 POD_chargen.1400.desc:0 "La Inquisición está dividida en órdenes, y cada una de ellas tiene varias características.\NLos Caballeros de Acre y Santiago son órdenes militares, que encuentran herederos por ordenación de candidatos dignos. Las Hermanas de San Juan son hábiles administradoras, pero sólo ordenan a mujeres. Como monjas, tampoco tienen una familia clásica.\NLos Oculi Dei, maestros espías de la Inquisición, también ordenan miembros, pero no están excluidos de tener una familia.\NLa Orden Roja, investigadores de lo oculto, ordenan tanto a hombres como a mujeres.\NPor último, la casa noble von Murnau funciona como una familia medieval normal, pero cada miembro tiene la posibilidad de convertirse en cazador durante su edad adulta."
 POD_chargen.1400.option.a:0 "Los Caballeros de Acre"
 POD_chargen.1400.option.b:0 "La espada de San Jaime"
 POD_chargen.1400.option.c:0 "Las hermanas de San Juan"
 POD_chargen.1400.option.d:0 "Los Oculi Dei"
 POD_chargen.1400.option.e:0 "La Orden Roja"
 POD_chargen.1400.option.f:0 "Los von Murnau"
 POD_chargen.1400.option.g:0 "¿Y un cazador que no sea de la Inquisición de la Sombra?"
 POD_chargen.1400.option.h:0 "Tal vez no sea un cazador"
 
 POD_chargen.1500.t:0 "Cazadores cazados"
 POD_chargen.1500.desc:0 "No todos los cazadores forman parte de la Inquisición de las Sombras. Muchos mortales se enteran de la existencia de los monstruos del mundo de las tinieblas, y con garra y determinación deciden luchar. Algunos cazadores fueron una vez miembros de la Inquisición de la Sombra, pero encontraron los requisitos de la Iglesia demasiado engorrosos y abandonaron las órdenes; pero siguen cazando a los no muertos. No todos los cazadores que persiguen a los no vivos lo hacen por razones nobles.\NEn 1230, ser un cazador que no es de la Inquisición de la Sombra es una situación más difícil."
 POD_chargen.1500.option.a:0 "Un cazador independiente con fe verdadera"
 POD_chargen.1500.option.b:0 "Un cazador independiente sin fe verdadera"
 POD_chargen.1500.option.c:0 "Desamparados de Calomena"
 POD_chargen.1500.option.d:0 "Regreso a la Inquisición de las Sombras"
 POD_chargen.1500.option.e:0 "Tal vez no sea un cazador"
 POD_chargen.1600.n:0 "Tu Sifu"
 POD_chargen.1600.option.a:0 "¡Sí, y [vampiresire.GetSheHe] es mi Sifu!"
 POD_chargen.1600.option.c:0 "Sí, pero [vampiresire.GetSheHe] no es mi Sifu".
 POD_chargen.1600.option.c.t:0 "Sólo te unirás a la casa de [vampiresire.GetHerHis]".

