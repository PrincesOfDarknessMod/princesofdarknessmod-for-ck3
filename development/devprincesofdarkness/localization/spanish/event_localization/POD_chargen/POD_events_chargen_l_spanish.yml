 POD_chargen.620.t:0 "Potencia de la sangre"
 POD_chargen.620.desc:0 "La potencia de la sangre determina lo fuertes que son tus poderes vampíricos, así como la cantidad de sangre que necesitas para satisfacer tu hambre. La potencia de la sangre está definida inicialmente por la generación y limitada por la generación. La potencia de la sangre crece muy lentamente con el tiempo, pero también puede aumentarse mediante la diablura. Entrar en torpor reducirá lentamente tu potencia sanguínea".
 POD_chargen.620.option.a:0 "Mi potencia sanguínea está fijada"
 
 POD_chargen.650.t:0 "La mascarada"
 POD_chargen.650.desc:0 "El silencio de la sangre mantiene tu naturaleza sobrenatural en secreto para los mortales.  Si los kine saben que eres un monstruo, pueden intentar destruirte. Peor aún. otros sobrenaturales también pueden buscar tu destrucción para asegurar su propia supervivencia. Algunos sobrenaturales evitan el secreto y, en su lugar, se deleitan con el pavor que provoca la revelación de su naturaleza monstruosa. Utilizar poderes sobrenaturales flagrantes en público, crear niños vampíricos y engendros, ser poco riguroso a la hora de ocultar la alimentación y dejar un rastro de cadáveres; todo ello aumenta el riesgo de exposición de la mascarada de un vampiro."
 POD_chargen.650.option.a:0 "Mi naturaleza sobrenatural está oculta". 
 
 POD_chargen.670.t:0 "El hambre"
 POD_chargen.670.desc:0 "La Bestia tiene hambre. Los vampiros mantienen su existencia inmortal gracias a la sangre. La sangre también alimenta sus poderes sobrenaturales. El uso de sus habilidades sobrenaturales, como las disciplinas o la curación fantástica, tiene la posibilidad de aumentar su hambre. Cuanto más hambriento está un vampiro, más irracional, desesperado, violento y estresado se vuelve. Los vampiros sólo se sacian por completo al drenar a un humano hasta la muerte. Sin embargo, matar a los humanos erosiona la humanidad del vampiro, haciéndolo más susceptible a las tentaciones de la Bestia. Sucumbir completamente a la Bestia es convertirse en un wight, una criatura impulsada únicamente por su insaciable sed de sangre. Seguir un camino o senda ayudará a un vampiro a mantener a raya a la Bestia".
 POD_chargen.670.option.a:0 "Tengo hambre".
 
