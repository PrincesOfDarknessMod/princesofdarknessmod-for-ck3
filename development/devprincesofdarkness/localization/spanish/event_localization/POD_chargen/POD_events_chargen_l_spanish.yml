l_spanish:

 POD_chargen.1.t:0 "Bienvenido al generador de personajes"
 POD_chargen.1.desc:0 "Con esta serie de eventos, puedes personalizar tu personaje para el Mundo de las Tinieblas. El proceso eliminará todos tus rasgos sobrenaturales existentes. Podrás elegir tu tipo de criatura sobrenatural (inicialmente sólo están disponibles los vampiros), tu clan, tu casa, tu generación, potencialmente tu sire, tus disciplinas, tu camino y trayectoria y tu tipo de depredador.\NDependiendo de tu personaje base, puede que tengas que eliminar algunos parientes heredados."
 POD_chargen.1.option.a:0 "Quiero usar el generador de personajes"
 POD_chargen.1.option.a.tt:0 "#¡Asegúrate de que quieres hacer esto! ¡NO HAY VUELTA ATRÁS! ESTO BORRARÁ TODOS TUS RASGOS SOBRENATURALES, MODIFICADORES Y SECRETOS EXISTENTES!!!#"
 POD_chargen.1.option.b:0 "No hacer cambios y salir del Generador de personajes"

 POD_chargen.2.t:0 "¿Qué pasa en la noche?"
 POD_chargen.2.desc:0 "¿Qué clase de sobrenatural eres?"
 POD_chargen.2.option.a:0 "Vampiro"
 POD_chargen.2.option.j:0 "Revenant"
 POD_chargen.2.option.b:0 "Hombre lobo"
 POD_chargen.2.option.c:0 "Mago"
 POD_chargen.2.option.d:0 "Fae"
 POD_chargen.2.option.e:0 "Cazador"
 POD_chargen.2.option.f:0 "Mortal"
 POD_chargen.2.option.g:0 "Demonio"
 POD_chargen.2.option.h:0 "Momia"
 POD_chargen.2.option.i:0 "Espectro" 

 POD_chargen.3.t:0 "La primera generación" 
 POD_chargen.3.desc:0 "¿Quién es el progenitor de los vampiros?"
 POD_chargen.3.option.a:0 "Como estaba escrito en el Libro de Nod: Caine fue maldecido por Dios"
 POD_chargen.3.option.i:0 "Los Ashirra dicen que Kayyun fue maldecido por Alá" 
 POD_chargen.3.option.c:0 "Las historias dicen que los vampiros descienden de Cagn"
 POD_chargen.3.option.b:0 "La Madre Oscura dice que los vampiros tienen muchos orígenes"  
 POD_chargen.3.option.h:0 "Set que se vengó de Osiris" 
 POD_chargen.3.option.g:0 "Odín marcó con runas al guerrero moribundo Canarl" 
 POD_chargen.3.option.f:0 "Creado por los Pitris, Zapathasura caza a sus siervos caídos"
 POD_chargen.3.option.e:0 "La maldición de los Wan Kuei, los Diez Mil Demonios" 
 POD_chargen.3.option.d:0 "No sé de dónde vienen los vampiros" 
 POD_chargen.3.option.j:0 "Quizás no soy un vampiro...."
 POD_chargen.3.option.j.tt:0 "Reconsidera qué tipo de sobrenatural jugar".
 POD_chargen.3.option.k:0 "Preferiría elegir mi linaje por mi cuenta."
 POD_chargen.3.option.k.t:0 "Al usar una interacción de personaje con cualquier otro vampiro vivo, podrás seleccionar un personaje con el que relacionarte."
 POD_chargen.3.option.k.tt:0 "#R ¡Esta opción está pensada para jugadores experimentados y no hay vuelta atrás!#!"

 POD_chargen.4.t:0 "La segunda generación" 
