 POD_chargen.610.desc:0 "Los poderes de los vampiros se llaman disciplinas. Los diferentes clanes y líneas de sangre tienen diferentes disciplinas inherentes. Las disciplinas proporcionan bonificaciones pasivas a los atributos, pero algunas también tienen poderes activos que se invocan mediante decisiones o esquemas. La invocación de disciplinas suele aumentar el hambre de sangre. Ahora confirmarás tu clan y tu conjunto de disciplinas. Esta es tu última oportunidad de retroceder en la generación de personajes y cambiar tu casa, clan o splat".
