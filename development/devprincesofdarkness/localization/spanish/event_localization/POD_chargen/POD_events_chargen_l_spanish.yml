 POD_charjoin.100.t:0 "¿Convertirse en vampiro?"
 POD_charjoin.100.desc:0 "¿Estás seguro de que quieres estar emparentado con [vampiresire.GetFirstName]? \N - No hay vuelta atrás en las dos primeras opciones."
 POD_charjoin.100.option.a:0 "Quiero ser tu hijo".
 POD_charjoin.100.option.b:0 "Puede que sólo quiera ser tu sirviente oscuro".
 POD_charjoin.100.option.c:0 "He cambiado de opinión".
 POD_charjoin.100.option.c.t:0 "Te rindes, reconsiderando tu decisión".

