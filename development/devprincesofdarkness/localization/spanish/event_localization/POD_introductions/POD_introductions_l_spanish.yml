l_spanish:

 podintroductions.1.t:0 "Rosas negras"
 podintroductions.1.desc:0 "Mientras la Francia mortal se tambalea bajo el caos interno de la cruzada albigense, a la Francia vampírica no le va mejor. Alejandro, un Ventrue de cuarta generación, fue príncipe de París y de Francia hasta hace menos de dos años. Fue destituido por un golpe de palacio dirigido por la Toreador Salianna, y su propio hijo, Geoffrey du Temple. La reina Toreador ha asumido el control del país y trata de consolidar su posición, enfrentándose a la oposición de sus propias compañeras de clan, las otras reinas de Francia. Por otro lado, Geoffrey ha tomado como premio el propio París, pero podría, con el tiempo, hacer una oferta por la corona que le corresponde por derecho de sangre. Al sur, Esclarmonde de Toulouse está utilizando el levantamiento catarí para su propio propósito, pero podría enfrentarse a la furia del norte de Francia muy pronto. ¿Encontrará el país un nuevo y mejor gobernante que Alejandro a partir de esta prueba? ¿O será arrastrado por el caos y la destrucción?"
 podintroductions.1.a:0 "A Francia le irá mejor bajo mi gobierno..."
 podintroductions.2.t:0 "El aburrido Dios-Rey de Inglaterra"
 podintroductions.2.desc:0 "La historia vampírica de Britannia está estrechamente ligada al Ventrue Mitra. Dios persa, que no romano, esta 4ª generación casi tuvo a toda Europa siguiendo su culto antes de que el cristianismo lo expulsara. Retirado con sus zelotes en la tierra de los británicos, reunió rápidamente el poder... y se aburrió de la mezquindad del lugar. Fracasando regularmente en el letargo, la invasión normanda destruyó su sede de poder y lo obligó a despertar para restaurar el orden. 150 años más tarde, a Mithras le importa poco Inglaterra de nuevo, y muchos de sus súbditos, como Hugh de Cornualles o Robin Leeland, han obtenido la independencia de facto y traman su desaparición. Y lo que es peor, Gales y Escocia siguen manteniendo antiguas células de la parentela druídica y nórdica. Nadie puede decir realmente si Mithras volverá a aplastar a esta nueva oposición o simplemente la dejará supurar bajo sus narices hasta que sea demasiado tarde."
 podintroductions.2.a:0 "Todos aclaman al Dios-Rey... por ahora".
 podintroductions.3.t:0 "Tierra de reyes y brujos"
 podintroductions.3.desc:0 "El corazón indiscutible del clan Ventrue, Alemania, está firmemente en manos de Hardestadt. Sin embargo, ni siquiera su gobierno está libre de desafíos, con pretendientes como Julia Antasia de Alemania Occidental o la escurridiza Ilse Reinegger de Baviera. Al sur, los usurpadores del clan Tremere se encuentran en una posición precaria, ya que los despiadados Tzimisce de Europa del Este se acercan rápidamente a sus fortalezas. Su acuerdo defensivo con los poderosos Ventrue es quizás su única tabla de salvación. Muy cerca se encuentra Alejandro de París, el príncipe exiliado de Francia, un poderoso Vampiro por derecho propio, pero solo políticamente. Hardestadt debe actuar rápidamente, sofocando las ambiciones de su hijo Jurgen, destruyendo las bases de poder de Julia e Ilse y asegurando su frente oriental con o sin la ayuda de los Tremere. Alemania será la joya de la corona del clan Ventrue, o arderá en el intento".
 podintroductions.3.a:0 "Roma es un recuerdo que se desvanece, el futuro está aquí".
 podintroductions.4.t:0 "Reconquista en la sombra"
 podintroductions.4.desc:0 "Iberia es el centro tradicional de poder del clan Lasombra, pero la Reconquista mortal ha sumido a los Magisters en una amarga guerra civil. Al norte, Silvestre de Ruiz lidera el clan oficial y cristiano Lasombra y tiene la clara ambición de gobernar toda Iberia. Sin embargo, debe tener en cuenta a sus ambiciosos vasallos, como Ambrosio Luis Moncada o Lucita de Aragón. Al sur, tras décadas de luchas intestinas, los musulmanes Lasombra -que se autodenominan Ashirra- han encontrado en Badr de Andalucía un sultán digno y probado. En otros lugares, príncipes nuevos y viejos, desde los regios Ventrue hasta los feroces Gangrel, se percatan de la debilidad de los Magister y esperan el momento adecuado para atacar. Esta Reconquista podría ser el último aliento del dominio Lasombra de Iberia".
 podintroductions.4.a:0 "Iberia volverá a estar entera, sólo dame tiempo".
 podintroductions.5.t:0 "RAGNAROK"
 podintroductions.5.desc:0 "Desaparecida hace tiempo de las mentes de los mortales, la fe nórdica sigue existiendo para los vampiros de Escandinavia. Sus defensores, los feroces Einherjar, se aferran a sus creencias... pero la esperanza se desvanece rápidamente. El Alto Werter y la líder de las Valkirias, Ulfsdottir, se han retirado a la depresión y al casi letargo. Sin embargo, algunos continúan la lucha, como Brunhilde y Valbjorg 'Ojo Torcido', intentando destruir a los Vampiros Cristianos invasores, liderados por Hardestadt' get. Un rayo de optimismo para los Einherjar es que los recién llegados no son un grupo unido, y se pelean entre ellos, sobre todo en Dinamarca, que está dividida entre tres pretendientes. En las tierras baldías del norte, una banda de furiosos insensibles que se autodenominan la Barra Siniestra ha reclamado de forma dudosa las tierras baldías. Sean nuevos aliados o enemigos, la última batalla de los nórdicos se acerca, y la Cruz parece de nuevo la clara favorita..."
 podintroductions.5.a:0 "Escandinavia nunca será la misma".
 podintroductions.6.t:0 "Réquiem por un imperio"
 podintroductions.6.desc:0 "Si la Italia medieval mortal es un estado dividido, la Italia nocturna es un polvorín. Los poderosos y antiguos Vampiros se disputan las ciudades más pobladas de Europa. Al norte, el "cardenal" Ventrue Fabrizio Ulfila se asienta en Milán, con un fuerte control de la Iglesia italiana a su disposición. En Venecia, los vástagos Giovanni del clan Cappadocian son los dueños de un imperio comercial que se extiende por el mar, el tiempo dirá si se centran en Italia propiamente dicha o en Oriente, como su clan matriz. En Sicilia, la capital del clan Lasombra está custodiada por los fieles Montano, pero la sobreexpansión y la guerra civil en España han dejado vulnerable al Mar de las Sombras. Por último, todas las miradas se dirigen a Roma, donde Tito Venturo Camilo ha despertado recientemente. El Cónsul Eterno fue el cerebro detrás del imperio de Roma y de la destrucción de Cartago y podría marcar el comienzo de una nueva era para el liderazgo Ventrue. Mientras otros líderes insignificantes y reyes inmortales se alzan en otros lugares de Italia, la Guerra de los Príncipes nunca ha sido más peligrosa que aquí."
 podintroductions.6.a:0 "Todos los caminos llevan a Roma".
 podintroductions.7.t:0 "Contra la pared"
 podintroductions.7.desc:0 "Los Estados Cruzados se alzan precariamente sobre el Levante, y un estado Vampiro aún más precario se ha levantado en medio de ellos. La Dieta de los Olivos es un pacto entre los príncipes de varias ciudades de la zona, encabezados por una superviviente, Qawiyya el-Ghaduba. La "Leona" es una Salubri, un clan casi extinguido en Europa Occidental desde la muerte de su fundador, Saulot, a manos del recién levantado clan Tremere. La mayoría de los miembros del debilitado clan se han escondido, pero Qawiyya tiene la intención de plantar cara. Sin embargo, su precaria alianza ya está en peligro, ya que el poderoso Damasco está cayendo en un pozo de locura literal. Darshuf, el viejo sultán toreador, ha vendido su alma a fuerzas incalculables, y sólo su hijo y un solitario guerrero asamita se interponen en el camino de la catástrofe. ¿Será la Dieta el último hurra de un clan moribundo o la esperanza de un futuro mejor?"
 podintroductions.7.a:0 "Jerusalén es la ciudad de los milagros, después de todo..."
 podintroductions.8.t:0 "Detrás del velo"
 podintroductions.8.desc:0 "Arabia es la sede del movimiento Ashirra, vampiros musulmanes unidos más allá de los clanes por su fe común. Su posición en la península es fuerte, pero la pérdida de Jerusalén a manos de los cruzados y de Egipto a manos de las Serpientes les ha apartado de sus hermanos magrebíes y andaluces. Peor aún, Mesopotamia ha caído de nuevo en manos de los infernalistas Baali, liderados por Azanael, de la rama Nergalita. Su objetivo es tomar las grandes ciudades de la región, Damasco, Bagdad y Tyr, para tener la población que requiere para sacrificar para el regreso de su impío amo. Irónicamente, su oponente más fuerte es Tanit de Tyr, otro Baali, este de la rama Molochim. Esta rivalidad ha sumido a los resurgidos baaleses en una guerra civil y da esperanzas a los fieles musulmanes de poder detenerlos. Si no... entonces, el mundo entero podría estar en juego".
 podintroductions.8.a:0 "La cuna de la civilización podría ser también su lecho de muerte".
 podintroductions.9.t:0 "Capa y Cimitarra"
 podintroductions.9.desc:0 "Persia es la sede del clan Assamita, un grupo misterioso para los forasteros. Gobernados por el recién coronado y muy cuestionado Anciano, Nakurtum, su fachada de unidad está mostrando grietas a medida que varias facciones hacen sus juegos de poder. Thetmes, de la Red de Cuchillos, quiere que el clan se convierta en un culto fanático de asesinos preparado para servir de ejército para el regreso de su maestro negro. Al Ashrad, de los Hechiceros, camina por una senda de moderación, considerando a los asamitas como jueces y diplomáticos. Por último, Jamal de los Guerreros es un musulmán devoto, y vería con buenos ojos un acercamiento al Califato Ashirra de Medina. Este malestar político ha favorecido el crecimiento de otro grupo en la región, la Tribu Perdida de Dastur Anosh, un hereje que venera a la Segunda Generación de vampiros. Destrozado por las divisiones y la ineficacia, ¿encontrará el clan Assamita un nuevo propósito común o implosionará en una guerra civil?"
 podintroductions.9.a:0 "Uniré Persia, por diplomacia o de otro modo".
 podintroductions.11.t:0 "La guerra eterna"
 podintroductions.11.desc:0 "Desde el principio de los tiempos, la India ha sido el escenario de una guerra entre el clan Ravnos y los asuratizayya, o Wan Kuei, un misterioso grupo de "Vampiros" asiáticos. No ha habido vencedores y ambos combatientes están en su punto de ruptura, con varias facciones que conspiran para derrocar a los actuales dirigentes. En el Oeste, Chandraputra está reuniendo a los Ravnos para una batalla más. Mientras que en el Este, Dyanang dirige a los Dragones hacia una nueva carga. Otras potencias, desde los Daena hasta Kartarirya de los Tzimisce, buscan con avidez oportunidades en la constante tormenta. ¿Surgirá finalmente un ganador?"
 podintroductions.11.a:0 "Soy, obviamente, la única esperanza de paz en la India".
 podintroductions.12.t:0 "Sigue cayendo"
 podintroductions.12.desc:0 "Aunque fue quemada hace siglos, la pérdida de Cartago aún se siente en el Magreb. La zona se ha repartido desde entonces entre varios sultanes ashirra -vampiros musulmanes-, pero ninguno de ellos ha conseguido realmente consolidar la región. Los dos mejor preparados para hacerlo son Sophoniba, la anciana líder de Túnez que aún recuerda la pérdida de su ciudad junto a Cartago, y Zamra Matoub de Argel, una joven y ambiciosa lasombra. Los setitas también tienen un punto de apoyo aquí, al igual que el clan Tremere. Con este mosaico de poderes divididos y su rica historia, el Magreb es un premio tentador para cualquier príncipe o sultán aventurero".
 podintroductions.12.a:0 "Tenemos que seguir adelante desde Cartago".
 podintroductions.13.t:0 "A la sombra de la pirámide"
 podintroductions.13.desc:0 "Egipto ha soportado muchos conquistadores extranjeros, y sus muertos vivientes nativos no son nada si no son pacientes y resistentes. El verdadero poder aquí reside en Gizeh, con el corazón del clan Setite. El clan de la libertad -o de la corrupción, según a quién preguntes- está preparando sus fuerzas para aprovechar el vacío de poder creado por las cruzadas. Su primer objetivo será, sin duda, El Cairo. Dirigida por el poderoso Ventrue Antonius de quinta generación, la ciudad no caerá fácilmente y podría frustrar a las Serpientes si se declarara una guerra abierta. Todo el mundo está seguro de que los Seguidores de Set harán su primer movimiento pronto, pero nadie puede decir cuándo, y si, serán detenidos cuando lo hagan..."
 podintroductions.13.a:0 "Egipto es tan inmortal como nosotros".
 podintroductions.14.t:0 "Tierra de la dualidad"
 podintroductions.14.desc:0 "Los Vampiros nativos de África son los Laibon, una asociación poco definida de múltiples líneas de sangre y chupasangres creados por ellos mismos. Tienen la mayor parte del verdadero poder en el continente, pero deben enfrentarse a los numerosos aventureros o pequeños señores de la guerra que buscan fama y fortuna en sus tierras. Y lo que es peor, África también alberga a algunas criaturas verdaderamente antiguas, que siguen ahí desde la época en que fue la cuna de la humanidad. Con varios caminos nuevos que se abren con el mundo musulmán, y ashirra, queda por ver si los laibon serán capaces de adaptarse y prosperar en los tiempos cambiantes."
 podintroductions.14.a:0 "Oportunidades y peligros en abundancia".
 podintroductions.15.t:0 "En los cielos"
 podintroductions.15.desc:0 "Para los forasteros, el Tíbet es el hogar de unos vampiros muy extraños... ¡si es que se les puede llamar vampiros! Los llamados Exiliados Blancos forman parte de los Wan Kuei, los Fantasmas Hambrientos de China, y están firmemente establecidos en el este. Sin embargo, en el oeste habitan cosas aún más extrañas, desde abominaciones adoradoras de demonios hasta seguidores iluminados de un dios egipcio muerto. Lejos de cualquier centro de poder no muerto, el Tíbet es un espectáculo secundario para la mayoría de los vampiros. Pero los misterios pueden tener recompensas para aquellos que buscan lo suficientemente profundo..."
 podintroductions.15.a:0 "El Tíbet es un mundo propio".
 podintroductions.16.t:0 "Trueno de Oriente"
 podintroductions.16.desc:0 "Las estepas no son tierra para los Vampiros. Pocas ciudades para esconderse, pocas naciones para manipular y doblegar a su voluntad. Pero, desde el este llega una nueva raza de Vampiros, una que se encuentra a gusto en las interminables llanuras y con el pueblo nómada mongol. Estos Anda, un vástago de los Gangrel, son orgullosos guerreros y siguen al Imperio Mongol, en plena expansión, en sus conquistas. El conflicto con los ya presentes Gangrel del oeste parece inevitable y, aún más, cabe esperar tensiones con los cainitas europeos cuando lleguen estos recién llegados. El cambio es algo raro en los Vampiros, pero cuando llega con una estruendosa horda de arqueros a caballo, el cambio podría ser lo último que experimenten muchos de ellos..."
 podintroductions.16.a:0 "El cambio no siempre es bienvenido..."
 podintroductions.17.t:0 "Vosotros que entráis aquí..."
 podintroductions.17.desc:0 "Europa del Este es la tierra tradicional del clan Tzimisce, pero su hegemonía ha sido recientemente disputada por el ascenso de los Tremere, respaldados por los Ventrue alemanes y húngaros. Una guerra reciente ha terminado con un amargo tratado de paz entre Vladimir Rustovitch, voivoda de voivodas, y Jurgen von Verden, cruzado Ventrue. Se ha establecido un estado tapón, la Orden Obertus, encabezada por la mediadora de la paz Myka Vykos. Ahora, todos se lamen las heridas, Rustovitch tratando de asegurar su control del clan y los Ventrue húngaros resolviendo una crisis de sucesión con la torpeza de su líder, Bulscu. Finalmente, Etrius lidera a los Usurpadores en lugar de Tremere, mostrando la fachada de una pirámide unificada contra los desalmados. Todo el mundo sabe que la guerra es inevitable en esta región hasta que un Vampiro sea lo suficientemente poderoso como para aplastar a sus rivales de una vez por todas. ¿Quién será?"
 podintroductions.17.a:0 "Una tierra para ser domesticada".
 podintroductions.18.t:0 "Sueño que se desvanece"
 podintroductions.18.desc:0 "Las cenizas de Constantinopla aún están calientes y, sin embargo, los buitres ya dan vueltas sobre su cadáver. El Sueño de Miguel, una utopía vampírica nunca vista desde Cartago, ha caído con su creador, y una serie de señores de la guerra y restos del Imperio roto intentan sobrevivir. El más importante de ellos es Alfonzo, uno de los instigadores de la 4ª Cruzada, que ahora tiene Constantinopla. Los ambiciosos Lasombra todavía se inclinan ante los líderes de los clanes en Sicilia, pero ¿por cuánto tiempo? Más al oeste, Natalya Svyatoslav, de los Brujah, es una de las últimas verdaderas creyentes del Sueño aún activas, con la esperanza de reclamar para sí el manto del "Arcángel" Miguel. Anna Comnena no tiene ambiciones tan elevadas, y utiliza Nikaea para conseguir finalmente el Imperio que debería haber sido suyo incluso durante sus días de respiración. Como muchos otros aspirantes a príncipes construyen dominios en las cenizas de lo antiguo, Constantinopla podría renacer de nuevo... o morir para siempre".
 podintroductions.18.a:0 "¿Ha previsto Miguel este caos?"                                       
 podintroductions.19.t:0 "Abuela, abuela..."
 podintroductions.19.desc:0 "Hasta donde se puede recordar, Rusia es el hogar de una de las familias más poderosas que existen, Baba Yaga. Esta Nosferatu de cuarta generación, de la que se rumorea que es la verdadera progenitora del clan, forma parte de la tierra y la utiliza para defenderse de su vengativo sire. Por suerte para todos en la zona, la bruja está en letargo. Pero la influencia de su Cortina de Sombras aún se siente, alimentada por su leal segundo al mando, Viktor. En estas condiciones, sólo hay tres tipos de Vampiros en Rusia: los vasallos de la Abuela, los valientes y los que pronto morirán. Estas dos últimas categorías a menudo se superponen entre sí..."
 podintroductions.19.a:0 "Cuidado con las niñas..."                                       
 podintroductions.20.t:0 "Nuevo destino para la vieja tierra"
 podintroductions.20.desc:0 "Tradicionalmente frontera del Voivodato de Tzimisce, hogar de los más... excéntricos desalmados, Polonia se está convirtiendo en una entidad propia y separada. El desmoronamiento de la autoridad de los voivodas, y su total anacronismo, ha permitido que una nueva generación de vampiros se afiance y prospere. El primero de ellos es Yitzhak ben Avraham, un devoto Brujah, que está reuniendo seguidores en Cracovia para expulsar al antiguo príncipe Razkoljna. Este podría ser el primer paso hacia una Polonia libre de la influencia de Tzimisce. Pero le esperan retos mayores, sobre todo expulsar a la abominación absoluta que es Hedeon Yaroslavich, un Tzimisce considerado incluso extremo por sus propios compañeros..."
 podintroductions.20.a:0 "Debo prestar atención a este viento de cambio o ser aplastado por él". 
 podintroductions.21.t:0 "Tierra de la libertad"
 podintroductions.21.desc:0 "Lejos del aplastante control de los tiranos en Europa Occidental, la zona del Báltico es el hogar de dos construcciones políticas de un nuevo tipo para los Vampiros. En Lituania, Qarakh de los Gangrel ha unificado una amplia banda de paganos de espíritu libre en lo que pretende ser el punto de parada de la expansión del cristianismo, y de los Ventrue, hacia el este. Más al norte, Karl el Azul lidera un Estado Libre Einherjar, quizás el último de su clase, ya que Escandinavia está cayendo en manos de los secuaces de Hardestadt. Ambos experimentos corren un gran peligro, tanto interno como externo, y dependen principalmente del carisma de sus líderes. Incluso su valentía y convicción podrían resultar inútiles frente a la próxima embestida de los Ventrue..."
 podintroductions.21.a:0 "Los últimos restos de una era moribunda no caerán fácilmente". 
 podintroductions.2001.t:0 "Bienvenidos a Príncipes de la Oscuridad"
 podintroductions.2001.t_ghouls:0 "Bienvenidos a los Siervos de la Oscuridad"
 podintroductions.2001.t_kueijin:0 "Bienvenidos a Ancestros de la Oscuridad"
 podintroductions.2001.desc:0 "Lo primero, ¡gracias por jugar al mod! \N - Princes of Darkness es una revisión del juego base, cuyo objetivo es dar vida al Mundo de las Tinieblas en Crusader Kings 3. Como tal, tiene muchos conceptos de juego alterados, y utiliza el extenso lore de su mundo para proponer una experiencia diferente en todo."
 podintroductions.2001.a:0 "Hablemos de la mecánica principal de Vampiro..." 
 podintroductions.2001.a_ghouls:0 "Hablemos de las principales mecánicas de ghouls y revenants."
 podintroductions.2001.b:0 "...u otros conceptos alterados" 
 podintroductions.2001.c:0 "El mundo y su lore" 
 podintroductions.2001.d:0 "Estoy bien, ¡vamos!" 
 podintroductions.2001.e:0 "Borrar mis rasgos sobrenaturales e ir al generador de personajes" 
 podintroductions.2003.t:0 "Vampiros 101"
 podintroductions.2003.t_ghouls:0 "demonios 101"
 podintroductions.2003.desc:0 "Lo primero que hay que tener en cuenta es que, como Vampiro, eres inmortal... más o menos. No morirás de vejez o enfermedad, pero si te ponen la antorcha o te decapitan, tu vida terminará. Como tal, la sucesión es una preocupación menor, pero aún presente, para ti. En la misma línea, los matrimonios no pueden producir hijos, por lo que son principalmente una herramienta política disponible para unas pocas religiones selectas. \Las religiones son una parte fundamental del juego, incluso más que en CK3. Aquí, representan los principios filosóficos fundamentales de tu personaje, que le ayudan a no caer ante la Bestia. De hecho, la Bestia -una manifestación literal de tu monstruosidad interior- es uno de tus peores enemigos, y controlar tu estrés es primordial para no caer presa de ella, ya que significaría que tu personaje se ha convertido en un wight asilvestrado, lo que provocaría su abdicación.\NToma nota de tu hambre, un modificador central que representa tu necesidad de sangre. El hambre se utiliza para muchos planes y poderes, y se repone lentamente o con la caza activa".
 podintroductions.2003.desc_ghouls:0 "En primer lugar, se recomienda jugar solo a ghouls y revenants después de tener un buen conocimiento de las mecánicas vampíricas, ya que ambos usan mecánicas similares, pero con menos posibilidades y más dificultades para los 'servidores de la oscuridad'. Esta introducción solo hablará sobre cambios específicos de la mecánica principal de los vampiros.\nLos necrófagos son inmortales pero los aparecidos no, sin embargo, su esperanza de vida es mucho mayor que la de los humanos mortales. Ambos pueden tener hijos, que probablemente se conviertan en aparecidos (más aún si son de una pareja de aparecidos).\nObtuvieron acceso a edificios especiales que son bastante poderosos, pero no tienen acceso a algunos de los vampiros más específicos.\nPueden usar [ disciplinas|E] en el mismo estilo de vida que los vampiros. No hay [Embrace|E], [diablerie|E] esquemas y similares disponibles para ellos.\nTen en cuenta que, aunque no eres naturalmente saludable, no eres inmune a las enfermedades como lo son los vampiros.\nFinalmente, recuerda que esto es un estilo de juego sustancialmente más difícil, ya que básicamente eres un vampiro más débil con pocas ventajas, menos mecánicas y muchos inconvenientes nuevos."
 podintroductions.2003.a:0 "Algunos conceptos más avanzados"  
 podintroductions.2004.t:0 "Cómo no acabar como una antorcha viviente"
 podintroductions.2004.desc:0 "Los vampiros son lentos para aprender cosas nuevas. Como tal, todavía tienes acceso a los estilos de vida básicos, pero a un ritmo de progresión menor. En cambio, puedes elegir invertir tu tiempo en las disciplinas, abriendo los poderes de los condenados para tu uso.\NLos edificios representan tu influencia sobre la población mortal. La mayoría están limitados por una estadística como el control y tendrás que elegir cómo equilibrarlos. Ten en cuenta que los principales centros de población, representados por las capitales de ducado de alto desarrollo, son el mayor activo con el que cualquier príncipe puede soñar.\NLa guerra ha sido sensiblemente alterada, con un mayor énfasis en los caballeros. La destreza de tus caballeros puede superar fácilmente a un enemigo mucho más numeroso, especialmente si está compuesto mayoritariamente por levas. Como tal, ten mucho cuidado con los Vampiros hostiles de alta destreza.\NEn un mundo lleno de engaños y trucos, la intriga juega un papel más importante. Hay nuevos planes que descubrir, algunos vinculados a tus poderes, y la mayoría de los personajes tienen secretos que es mejor no contar... o utilizar para el chantaje si su religión lo permite".
 podintroductions.2004.a:0 "Volver a lo básico"  
 podintroductions.2005.t:0 "La historia hasta ahora..."
 podintroductions.2005.desc:0 "El Mundo de las Tinieblas es un universo que funciona desde hace más de 30 años, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales están interactuando bajo la superficie, creando un submundo lleno de intrigas e historias.\NLos Vampiros del WoD son principalmente el resultado de la maldición bíblica contra Caine, el primer asesino, y la mayoría se remontan a su linaje en un sistema que llaman "generaciones". Este árbol dinástico de la no-muerte se ha ramificado en varias facciones, los clanes, cada uno con su fuerza, su debilidad y su base de poder geográfica.\NEn Dark Ages : Vampiros, al que estás jugando ahora, seguimos al mundo de los no-muertos en la encrucijada de varias crisis importantes. El saqueo de Constantinopla ha ocurrido, y ha roto el mayor imperio cainita de la época, teniendo un efecto dominó hasta Francia y Persia. Mientras tanto, la Inquisición eclesiástica está reuniendo apoyo e información, casi lista para inaugurar la era de la retribución sobre los malditos chupasangres..."
 podintroductions.2006.t:0 "La historia hasta ahora..."
 podintroductions.2006.desc:0 "El Mundo de Tinieblas es un universo que funciona desde hace más de 30 años, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales están interactuando debajo de la superficie, creando un inframundo lleno de intrigas e historias.\nLos Vampiros de WoD son principalmente el resultado de la maldición bíblica contra Caín, el primer asesino , y la mayoría rastrea su linaje hasta él en un sistema que llaman 'generaciones'. Este árbol de la dinastía de los no-muertos se ha ramificado en varias facciones, los clanes, cada uno con su fuerza, debilidad y base geográfica de poder.\nEn la fecha de inicio que estás jugando, tanto la Inquisición como la Revuelta Anarquista han ido y venido en su mayor parte. , dejando al mundo de los muertos vivientes sacudido como nunca antes. Para hacer frente a estas nuevas amenazas, la Camarilla ha sido formada por la mayoría de los [Clan|E], una secta cuyo objetivo es ocultar a los vampiros de los ojos de los mortales. La oposición a esto se ha fusionado en la formación del Sabbat, vampiros que se revelan en su naturaleza monstruosa. Sin embargo, muchos [cainitas|E] no han elegido un bando, y el futuro de estas dos frágiles sectas sigue siendo bastante incierto en este momento."
 podintroductions.2102.t:0 "Bienvenido a Inquisidores de la Oscuridad"
 podintroductions.2102.desc:0 "Lo primero, ¡gracias por jugar al mod! \N - Inquisidores de la Oscuridad es una revisión del juego base, cuyo objetivo es dar vida al Mundo de la Oscuridad en Crusader Kings 3. Como tal, tiene muchos conceptos de juego alterados, y utiliza el extenso lore de su mundo para proponer una experiencia diferente en todo."
 podintroductions.2102.a:0 "Hablemos de la mecánica principal de los Inquisidores..." 
 podintroductions.2102.b:0 "...o las especialidades de la orden" 
 podintroductions.2102.c:0 "Lore de la Inquisición" 
 podintroductions.2102.d:0 "¡Estoy bien, vamos!" 
 podintroductions.2103.t:0 "Luces encendidas"
 podintroductions.2103.desc:0 "En 1230, la Inquisición acaba de empezar. Les superan en número y en armamento sus enemigos, los vampiros. Tienen una poderosa capacidad de intriga, y utilizan caballeros que pueden destrozar fácilmente a la mayoría de tus ejércitos, especialmente a tus levas.\NSin embargo, tienes algunas ventajas, una de ellas es tu poderoso conjunto de edificios y tu árbol de estilos de vida. También tienes un esquema único, encontrar la guarida del monstruo, donde puedes ir en alguna acción uno a uno contra los vampiros. Obviamente, ellos se defenderán... Prepárate para un juego duro en el que deberás esperar tu momento y construir tu base de poder, mientras cazas a tus vecinos más amenazantes, hasta que seas lo suficientemente fuerte para reclamar la noche".
 podintroductions.2103.a:0 "La caja de herramientas de las Órdenes"
 podintroductions.2103.c:0 "Lore de la Inquisición" 
 podintroductions.2104.c:0 "Lore de la Inquisición" 
 podintroductions.2104.t:0 "Arco iris de la luz"
 podintroductions.2104.desc:0 "Cada orden tiene su propia forma de asegurar los herederos. Santiago, Acre y la Orden Roja pueden ordenar a los mortales más jóvenes con una interacción con el personaje, convirtiéndolos en su escudero o "hijo" en términos de juego. Las Hermanas de San Juan pueden hacer lo mismo, pero sólo con las mujeres más jóvenes.\NLa Casa Von Murnau funciona como una familia de vainilla, pero cada Von Murnau tiene la posibilidad de convertirse en inquisidor durante su vida. Por último, los Oculi Dei pueden tanto ordenar a nuevos miembros como tener una familia, pero su familia nunca será naturalmente un Inquisidor a menos que sea ordenada."
 podintroductions.2104.a:0 "Volver a lo básico"  
 podintroductions.2105.t:0 "La historia hasta ahora..."
 podintroductions.2105.desc:0 "El Mundo de las Tinieblas es un universo que funciona desde hace más de 30 años, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales están interactuando bajo la superficie, creando un inframundo lleno de intrigas e historias. \nEstás jugando Dark Ages: Inquisitor, que cuenta la historia de cómo un pequeño grupo de los mortales literalmente cambiaron el mundo. Fueron los primeros en ver realmente detrás de la Mascarada de los vampiros y consiguieron el apoyo de la Iglesia para iniciar una Inquisición de las Sombras. \nLa tarea que tienen ante ellos es inmensa y, en 1230, apenas han arañado la superficie del mundo con el que se han topado. Con una fe inquebrantable en su corazón, están haciendo audazmente sus primeros movimientos contra los engendros del Infierno ... \nNinguno de estos primeros Inquisidores podría saberlo, pero su coraje y empuje marcarán el comienzo de una era de fuego y dolor para los vampiros que durará siglos."
 podintroductions.2202.t:0 "Bienvenidos a la Eternidad de la Oscuridad"
 podintroductions.2202.desc:0 "Lo primero, ¡gracias por jugar el mod! \nPrinces of Darkness es una revisión del juego base, con el objetivo de dar vida al Mundo de las Tinieblas en Crusader Kings 3. Como tal, tiene muchos conceptos de juego modificados y utiliza la amplia tradición de su mundo para proponer una experiencia diferente a todos. alrededor."
 podintroductions.2202.a:0 "Hablemos de las principales mecánicas de Momia..."
 podintroductions.2105.desc:0 "El Mundo de las Tinieblas es un universo que lleva más de 30 años funcionando, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales están interactuando bajo la superficie, creando un submundo lleno de intrigas e historias.\NEstás jugando a Dark Ages : Inquisitor, que cuenta la historia de cómo un pequeño grupo de mortales impulsados cambió literalmente el mundo. Fueron los primeros en ver realmente detrás de la Mascarada de los vampiros y consiguieron el apoyo de la Iglesia para iniciar una Inquisición en la Sombra.\NLa tarea que tienen por delante es inmensa, y en 1230, apenas han arañado la superficie del mundo con el que se han topado. 
 podintroductions.22.t:0 "Bajo la Cruz Blanca"
 podintroductions.22.desc:0 "Aquí es donde empezó todo para los Caballeros de Acre. 26 años atrás, Gauthier de Dampierre luchó contra los monstruos conocidos como vampiros mientras Constantinopla ardía a su alrededor. Sintió la llamada de Dios para tomar la espada contra este verdadero enemigo.\NDesde entonces, Gauthier ha sido fundamental para dirigir los esfuerzos marciales de la Inquisición de las Sombras desde su fortaleza en Chipre, pero el tiempo no espera a ningún hombre. El viejo Gran Maestro sabe que probablemente no verá su sueño de reclamar Constantinopla para el Señor antes de su muerte.\NComo tal, Gauthier está preparando su sucesión, y se están haciendo planes para que la próxima generación de Caballeros de Acre lidere a la Cristiandad a su victoria final contra los chupasangres. Porque ellos son la Espada de Dios, y los últimos defensores de la humanidad contra los horrores de la oscuridad".
 podintroductions.22.a:0 "Salvaremos a la humanidad, o moriremos en el intento" 
 podintroductions.23.t:0 "La sombra de los cátaros"
 podintroductions.23.a:0 "Sé celoso, pero también paciente y sutil" 
 podintroductions.23.desc:0 "La Santa Iglesia comprendió por primera vez la amenaza de los vampiros durante la Cruzada Albigense contra los cátaros. Durante ese tiempo, se descubrió que las pobres almas del sur de Francia eran, la mayoría de las veces, engañadas por estas criaturas malditas.\NNo es de extrañar entonces que su Santidad se interesara especialmente por Francia, aparentemente un punto alto de infestación vampírica. Los esfuerzos de la Inquisición son dirigidos por Aignen de Toulouse, un hombre reservado, que fue amigo del famoso Rodrigue de Navarre. Dueño de una creciente red de espías, los Oculi Dei, Aignen está jugando a largo plazo, sabiendo muy bien que la situación en Francia es mucho peor de lo que incluso Roma piensa. Cualquier paso en falso podría ser el último..."
 podintroductions.24.t:0 "Sol contra Cruz"
 podintroductions.24.desc:0 "Inglaterra siempre ha sido una tierra desconcertante para la Santa Iglesia. Aferrada durante mucho tiempo a antiguas prácticas, con rumores de brujería o cosas peores que surgen de vez en cuando, la isla nunca ha sido realmente domesticada.\NLa Madre María, líder de las Hermanas de San Juan, es sólo la última de una larga lista de inquisidores que intentan comprender la raíz de la corrupción que roe esta tierra. Las visiones de sus hermanas hablan de una entidad conocida como 'Mitra' que se proclama Dios en cuanto se pone el sol.\NCon este claro objetivo a la vista, y su implacable celo como arma, las hermanas se preparan para liderar la Inquisición en una lucha de la que sólo empiezan a comprender la proporción..."
 podintroductions.24.a:0 "Sólo hay un Dios" 
 podintroductions.25.t:0 "Celo noble"
 podintroductions.25.desc:0 "Los Von Murnau, una casa noble alemana, han sido malditos -o bendecidos- por Dios para poder oler literalmente el mal. Esta característica, unida a su fortaleza en Baviera, los convierte en socios inestimables de la Inquisición de las Sombras.\NSu participación está coordinada por un tal Leopold von Murnau, un hombre enfermizo de gran intelecto y empuje. Con su fuerte liderazgo, Bavaria se ha convertido en un faro de esperanza para los Inquisidores de todo el mundo, una promesa de lo que la Tierra podría ser una vez purgada de los asquerosos vampiros. Sin embargo, Leopold está lejos de haber terminado, y ya está planeando su siguiente paso, con una potencial fusión de las órdenes de la Inquisición en una nueva Sociedad..."
 podintroductions.25.a:0 "Una familia se enfrenta a la oscuridad" 
 podintroductions.26.t:0 "El primero de su clase"
 podintroductions.26.desc:0 "A pesar de lo que la Inquisición de las Sombras te haría pensar, Rodrigue de Navarre fue en realidad el primer hombre que se enfrentó a la oscuridad. Este noble menor participó en la Cruzada Albigense, y se encontró con la prueba de que 'algo' estaba ahí fuera.\NEsta revelación, y los numerosos intentos vampíricos de silenciarle desde entonces, se llevaron por delante la cordura de Rodrigue y el fundador de los Caballeros de Santiago ve ahora enemigos por todas partes, incluso entre sus compañeros inquisidores. Por ello, no se ha unido oficialmente a la Inquisición de las Sombras, pero acepta a regañadientes su apoyo para reconquistar Iberia.\NLa Santa Sede está preocupada porque la terquedad de Rodrigue podría ser un problema grave, ya que los vampiros son conscientes de su presencia, y la Iglesia no puede hacer sentir todo su poder en la península."
 podintroductions.26.a:0 "Un paranoico solo contra la oscuridad" 
 podintroductions.27.t:0 "El vientre de la bestia"
 podintroductions.27.desc:0 "A la Santa Sede le gustaría pensar que Italia está libre de la corrupción vampírica. Pero la revelación de que un cardenal, Fabrizio Ulfila, era en realidad un engendro del infierno todo el tiempo sacudió a su Santidad hasta el fondo.\NNo queriendo sembrar el pánico entre el rebaño, ha encargado a la líder informal de la Orden Roja, Vittoria Santini di Parma, que evalúe esta amenaza demasiado cerca para su comodidad.\NCon las bien surtidas bibliotecas de la Orden a su disposición, Vittoria ya ha hecho algunos descubrimientos muy alarmantes. Los chupasangres están por todas partes en Italia, e incluso desfilan en la propia Ciudad Santa cuando aparece la noche.\NSin embargo, poderosas fuerzas están rodeando su pequeña celda, y su investigación podría terminar antes de empezar si no tiene cuidado..."
 podintroductions.27.a:0 "El corazón mismo del cristianismo está amenazado" 
 podintroductions.101.t:0 "Su historia hasta ahora"
 podintroductions.101.desc:0 "Los poderosos han caído en desgracia, bella Helena, ya que aquí estás, la mujer más bella del mundo, reducida a luchar con tu amarga rival en las costas de una isla remota. Hace mucho tiempo, eras adorada, y los hombres luchaban en guerras sangrientas por una simple mirada. Menele te lo robó todo.\NEl testarudo rey de Esparta no pudo aceptar que te pusieras del lado de Roma durante las guerras púnicas, y desde entonces te persigue. Destruyó tu amada Pompeya y un incontable número de tus adorados sirvientes e hijos. Ahora, sólo tienes a tu precioso Prias a tu lado... pero estás cansada de huir.\NEs hora de que esta milenaria disputa termine, hija de Micenas. ¡Destruye a Menele y sus insensatos sueños de utopía! Entonces, y sólo entonces, el futuro volverá a ser brillante".
 podintroductions.101.a:0 "Esto termina ahora" 
 podintroductions.helena:0 "Una vez que Menele esté muerto, tendrás acceso a una decisión especial"
 podintroductions.102.t:0 "Tu historia hasta ahora"
 podintroductions.102.desc:0 "Lord Absalon, padre de Dinamarca, tu partida para luchar contra los malditos Tremere del Báltico ha dejado tu tierra abierta a pretendientes y aventureros. Hay que ocuparse de ellos, ya que eres el único gobernante que Dinamarca necesita.\NMientras aplastas a estos locos, tal vez quieras aprender más sobre ese extraño ritual que descubriste en Ruga durante tu viaje. Todavía te preguntas qué intentaban hacer estos cultistas, ¿resucitar a su Dios? Obviamente, un penoso último esfuerzo para detenerte, pero... Si pudieras tener éxito, aprovechando el poder de esta deidad 'Svantevit' en ti mismo... ¡serías imparable! \N - Es hora de que reconquistes Dinamarca y comiences tu ascensión a la divinidad, señor Absalon. Es, obviamente, tu verdadero destino".
 podintroductions.102.a:0 "Primero Dinamarca, luego..." 
 podintroductions.absalon:0 "Puedes invertir en una decisión especial para descifrar progresivamente el ritual de Svantevit"
 podintroductions.103.t:0 "Su historia hasta ahora"
 podintroductions.103.desc:0 "Poderoso Mithras, tu regreso a la prominencia en Inglaterra ha sido un éxito rotundo hasta ahora, con los vampiros normandos invasores finalmente resueltos. Sin embargo, todavía hay algunas preocupaciones de las que ocuparse, con varios forajidos y príncipes independientes que desafían tu gobierno.\NSin embargo, el verdadero problema está en otra parte, pues ya puedes sentir el sueño de los años arrastrándose en tu alma. Y conoces a tus regentes lo suficientemente bien como para saber que estropearán las cosas si vuelves a dormirte.\NSin embargo, recientemente has sentido en tu sangre que tu antiguo amor, Kemintiri de los Setitas, ha despertado de nuevo. ¿Tal vez podrías mandar a buscarla y reavivar vuestra relación? Siempre fue una figura divisiva en tu corte y tus vasallos probablemente no apreciarán su regreso... pero, de todos modos, ¿a quién le importa su opinión?"
 podintroductions.103.a:0 "Vuelve a mí, amada de Isis" 
 podintroductions.mithras:0 "Mandas a buscar a Kemintiri, lo cual es costoso y probablemente enfadará a tus vasallos"
 podintroductions.103.b:0 "Volver con tu ex nunca es una buena idea" 
 podintroductions.mithrasb:0 "Te olvidas de toda esta historia"
 podintroductions.104.t:0 "Tu historia hasta ahora"
 podintroductions.104.desc:0 "Voivoda Rustovitch, su gobierno está en peligro. A pesar de tu aplastante victoria contra Jurgen y sus Ventrue, te viste obligado a firmar una paz blanca por la repentina puñalada por la espalda de la Horda de Sangre. Esto no sentó bien a tus vasallos. ¡Demasiado joven! ¡Demasiado occidental! Incapaz de aplastar a los Tremere!' dicen. Estos tontos, apenas capaces de sostener sus lamentables castillos, no saben nada de la guerra ni del gobierno. Aun así, los necesitas.\NDebes volver a tu probada y verdadera táctica de "Prueba de Guerra", luchando en escaramuzas con tus propios vasallos para frenar sus ambiciones. Aprenderán a respetarte una vez más".
 podintroductions.104.a:0 "Que comience la fiesta de los demonios" 
 podintroductions.vlad:0 "Como Rustovitch, tienes una interacción de carácter especial disponible con tus vasallos directos"
 podintroductions.105.t:0 "Tu historia hasta ahora"
 podintroductions.105.desc:0 "Lord Etrius, el exilio de tu rival Goratrix a Francia ha asegurado tu posición como favorito de los Tremere y líder de la Casa. Aun así, tienes que lidiar con amenazas tanto dentro como fuera del clan. El Voivodato de Tzimisce al este es una preocupación siempre presente, pero también debes asegurarte de que ningún otro Magus intente usurpar tu legítimo lugar.\NComo mano derecha del propio fundador, tienes muchas herramientas a tu disposición para asegurarte de que eso no ocurra. Asegúrate de usarlas sabiamente y trae la gloria a la Casa Tremere... y a ti también, por supuesto".
 podintroductions.105.a:0 "La Pirámide es mía para comandarla" 
 podintroductions.etrius:0 "Como Etrius, tienes una interacción de carácter especial disponible con tus vasallos directos de los Tremere"
 podintroductions.106.t:0 "Tu historia hasta ahora"
 podintroductions.106.desc:0 "Temible Matasuntha, recientemente has despertado en este nuevo y extraño mundo, tan alejado de los gloriosos días de los hunos que tanto amabas. Sin embargo, hay algunos nuevos jinetes de la estepa a los que ayudar, y algunas nuevas 'civilizaciones' que derribar. No puedes hacerlo solo, y el clan Gangrel te ha olvidado. Por lo tanto, debes confiar en tu propia progenie. Scendrak ya está allí, pero Zayyat se ha convertido a una nueva y extraña religión, y por lo tanto está fuera de tu alcance... pero Vorocious, quizás el más poderoso de los tres, es una gran posibilidad. O simplemente podrías olvidarte de él".
 podintroductions.106.a:0 "¡Cabalguemos juntos una vez más, mi niño!" 
 podintroductions.106.b:0 "Lo haré bien por mi cuenta" 
 podintroductions.107.desc:0 "La intrépida Tabitha, la Mayor misma te ha enviado a Iberia con una misión clara: detener la Reconquista. \nEs un gran honor y una gran responsabilidad, ya que los miembros más respetados de tu clan creen que eres capaz de repeler la marea cristiana Lasombra . \nTomó a Badajoz como su centro de poder, para estar lo más cerca posible del frente, pero ahora se ve obligado a jugar un juego con el que no está tan familiarizado, el de la política. \nAndalucía está dividida y en división caerás. Como tal, hasta ahora has aceptado el liderazgo insensible de Badr de los esfuerzos combinados de los Cainitas Musulmanes, pero te preocupa que su enfoque pueda llevar a una mayor desunión a largo plazo. \nNo eres de los que decepcionan a tus mayores, pero la tarea que tienes por delante es sigue siendo aterrador, y las amenazas reales podrían estar más cerca de lo que pensaba inicialmente ..."
 podintroductions.107.t:0 "Tu historia hasta ahora"
 podintroductions.107.a:0 "Seré el escudo de Andalucía" 
 podintroductions.tabitha:0 "Como Tabitha, tienes que tomar una decisión especial en función del tiempo"
 podintroductions.108.t:0 "Tu historia hasta ahora"
 podintroductions.108.desc:0 "Señor Roque, Iberia está sumida en la confusión. La guerra civil de Lasombra amenaza con engullir a todos a su paso, incluido usted. Debes estar listo y preparado si quieres sobrevivir.\NTu astucia y habilidades diplomáticas han conseguido el respeto de tus vecinos, aunque seas uno de los Clanes Bajos. Obviamente, aún te desprecian, y no dudarán en aplastarte si muestras debilidad. Recuerda que sólo te aceptarán como su par si no tienen otra opción.\NTambién tienes fama de ser un intrigante talentoso, aunque algo compulsivo, y esto podría ser tu mayor ventaja en los tiempos difíciles que se avecinan. Aprovéchalo bien, y puede que incluso te erijas como uno de los líderes más destacados de una nueva Iberia."
 podintroductions.108.a:0 "Debo planificar con mucha antelación" 
 podintroductions.roque:0 "Como Roque, tu plan de investigación te da una bonificación especial cuando lo completas"
 podintroductions.109.t:0 "Tu historia hasta ahora"
 podintroductions.109.desc:0 "Señor Montano, el Mar de las Sombras está en ruinas. La guerra civil ibérica, el desastre de la 4ª Cruzada y el despertar de Camilla en Roma han reducido el vasto imperio que custodiabas de tu sire a casi nada.\NNo se puede permitir que esto continúe o esto invitaría al caos en el clan ya que, ya, los jóvenes pretendientes comienzan a difundir rumores sobre tu fallido liderazgo.\NPara restaurar tu autoridad, el curso de acción es simple. Asegura Sicilia e Italia, muestra al clan Lasombra que aún eres una fuerza a tener en cuenta. Entonces, y sólo entonces, serás respetado una vez más".
 podintroductions.109.a:0 "Hay mucho que hacer" 
 podintroductions.montano:0 "Como Montano, tienes una decisión especial para restablecer tu desmoronada autoridad"
 podintroductions.110.t:0 "Su historia hasta ahora"
 podintroductions.110.desc:0 "Señora Natalya, Constantinopla está ardiendo y su sueño de una nueva utopía con ella. Con tu fuerte posición en Grecia, podrías ser la única esperanza para la Ciudad del Deseo del Mundo... pero los latinos ya están bien atrincherados. Necesitas un plan.\NOtro superviviente, Anna Comnena, sería un aliado perfecto para rodear la Ciudad, pero ya conoces a Anna... es despiadada y ambiciosa, y sólo le importa el poder.\NOtra solución sería mantenerte fiel a tus ideales y pedir ayuda a los Miguelitas que queden. El poderoso Malaquita, el propio campeón de Miguel, sería una gran ayuda. Pero él nunca aceptaría una alianza con Anna, así que será una cosa o la otra.\NPragmatismo o idealismo es la elección que tienes ante ti. ¿Qué será, Autokrator?"
 podintroductions.110.a:0 "Pragmatismo. Necesito los ejércitos de Anna" 
 podintroductions.110.b:0 "Idealismo. Malaquita me guiará". 
 podintroductions.natalya:0 "Entrarás en una alianza con Anna Comnena de Nikaea"
 podintroductions.111.t:0 "Tu historia hasta ahora"
 podintroductions.111.desc:0 "Sabia Durga Syn, Rusia te necesita más que nunca. Tu eterna enemiga, la temible Baba Yaga, yace dormida por ahora, pero sus agentes de la Cortina de Sombras siguen oprimiendo a tu patria bajo su tiránico culto a la maldita Bruja.\NNNNNNNNNNecesitarás toda la ayuda que puedas reunir en la desalentadora tarea que tienes por delante. Por suerte, eres conocido como quizás el mayor mentor del mundo cainita, un hecho que puedes aprovechar.\N¡Reúne a los mejores a tu alrededor, venerado maestro, y llévalos a la victoria!"
 podintroductions.111.a:0 "La nueva generación nos salvará" 
 podintroductions.durgasyn:0 "Como Durga Syn tienes una opción especial, siempre beneficiosa, a la hora de educar a una nueva progenie"
 podintroductions.112.t:0 "Tu historia hasta ahora"
 podintroductions.112.desc:0 "Alabado sea Set, y alabada seas tú, Maatkare, su consorte más querida, por la salvación que aportas a la descarriada raza 'cainita'. Tu corazón llora al ver que tantos hijos de tu amado no siguen sus enseñanzas. Sin embargo, hay esperanza, ya que el caos de la guerra civil de los Lasombra en Iberia deja a muchos de ellos extraviados y en busca de orientación.\NComo uno de los Hierofantes, los líderes legítimos del clan Setite, te complace proporcionar dicha orientación. Sólo se detendrá cuando todo el mundo cante sus alabanzas. Entonces, y sólo entonces, volverá triunfante a tu lado..."
 podintroductions.112.a:0 "Tantas pobres almas que liberar" 
 podintroductions.maatkare:0 "Como Maatkare, tienes una interacción especial con el personaje en la que puedes intentar convertir a cualquier incrédulo no celoso. Sólo está disponible si te mantienes en la religión Via Set".
 podintroductions.113.t:0 "Tu historia hasta ahora"
 podintroductions.113.desc:0 "Señora Qawiyya, acaba de consolidar la Dieta de los Olivos que ya una nueva crisis reclama su atención. La poderosa ciudad de Damasco ha caído en manos de la influencia infernalista y amenaza con envolver a toda la región en su locura.\NManaal, un hijo del Príncipe, y Bistakh, un enviado haqimita, son los dos últimos vampiros cuerdos de esta ciudad y ahora piden tu ayuda para purgarla. Ambos han jurado ayudarte tanto como puedan si te comprometes con su causa.\NSalvar Damasco enviaría un poderoso mensaje al mundo de que el clan Salubri sigue muy vivo, pero también sabes que te convertiría en el principal objetivo de la influencia Baali hasta que la ciudad sea salvada..."
 podintroductions.113.a:0 "Debemos marchar antes de que sea demasiado tarde" 
 podintroductions.113.b:0 "Lamentablemente, la Dieta es demasiado débil por ahora" 
 podintroductions.qawiyya:0 "Para librarse del modificador negativo, habrá que tomar Damasco y Palmira dentro de 70 años"
 podintroductions.114.t:0 "Su historia hasta ahora"
 podintroductions.114.desc:0 "Filipo te traicionó. Casandro te traicionó. Incluso Alejandro te traicionó al morir tan pronto cuando su destino estaba tan cerca. Estás sola, Petaniqua.\NSin embargo, encontraste fuerza y un propósito renovado. Cuando rechazaste a la humanidad de una vez por todas, nuevos aliados vinieron a ti, los lupinos conocidos como los "Bailarines de la Espiral Negra". Ellos adoran a una entidad oscura llamada "Wyrm".\NQuizás esta sea la clave de tu salvación Petaniqua. Caminar por esta Espiral Negra podría salvarte... o condenarte aún más.\N-¿Pero cuánto más puedes bajar de todos modos?"
 podintroductions.114.a:0 "La verdad está abajo" 
 podintroductions.petaniqua:0 "Como Petaniqua, tienes una decisión especial para recorrer la Espiral Negra. Te advertimos que no es ni mucho menos una empresa segura..."
 podintroductions.115.t:0 "Tu historia hasta ahora"
 podintroductions.115.desc:0 "Señor Dionisio, la agitación de la 4ª Cruzada se está extendiendo a tu querida Atenas. Los refugiados están llegando a la ciudad, sintiéndose perdidos tanto física como espiritualmente. Como uno de los principales defensores del Camino de la Humanidad, es tu deber dar refugio a estas pobres almas.\NPero también podrías mirar hacia el restablecimiento del orden en esta Grecia arruinada, para evitar que un evento tan traumático vuelva a suceder. Como querido maestro y mentor, asegúrate de encontrar y alimentar a los mejores prospectos que puedas para el futuro. La raza cainita los necesitará ahora más que nunca".
 podintroductions.115.a:0 "De las cenizas, el renacimiento" 
 podintroductions.dionysius:0 "Como Dionisio, tienes una opción especial, siempre beneficiosa, a la hora de educar a una nueva progenie"
end_intro_tooltip:0 "No obtendrá ninguna información adicional"
 podintroductions.2001.f:0 "Me parece bien esta parte, pero quiero más detalles"
 continue_intro_tooltip:0 "Recibirás información adicional, más detallada, sobre la mecánica del mod en los próximos días."
 podintroductions.3000.t:0 "Secretos de la noche" 
 podintroductions.3000.desc:0 "¿Qué tema te gustaría explorar?" 
 podintroductions.3000.a:0 "[disciplinas|E]" 
 podintroductions.3000.b:0 "[Abrazar|E] y Childer" 
 podintroductions.3000.c:0 "La mascarada" 
 podintroductions.3000.d:0 "El hambre" 
 podintroductions.3000.e:0 "Estoy bien, vamos" 
 podintroductions.3001.a:0 "Volvamos". 
 podintroductions.3001.t:0 "[disciplinas|E]" 
 podintroductions.3001.desc:0 "Las [disciplinas|E], que son poderes vampíricos, están representadas por estilos de vida únicos en el mod. Sólo puedes gastar puntos en un árbol si tienes el rasgo correspondiente (ej: el árbol de Celeridad se desbloquea con el rasgo de Celeridad).\NGanas xp de estilo de vida para estos árboles sobre todo cazando mortales o pastoreándolos (pastorear significa mantener a un mortal cerca como fuente de sangre durante más tiempo), ambos son una interacción del personaje disponible con los mortales de tu ubicación.\NAlgunos mortales dan más xp que otros dependiendo de sus rasgos." 
 podintroductions.3002.t:0 "Abrazo y Childer" 
 podintroductions.3002.desc:0 "Como vampiro, no puedes tener hijos. La pestaña "hijos" de tu hoja de personaje representa a tus hijos, los mortales que tú mismo has convertido en vampiros. Para ello, puedes utilizar una interacción de personaje sobre cualquier mortal de tu localidad.\NUna vez realizada la interacción y el esquema consecutivo, el mortal se convierte en vampiro, en tu childe. Ten en cuenta que tendrás que educarlos después, lo que puede ser costoso o peligroso de diferentes maneras." 
 podintroductions.3003.t:0 "La Mascarada" 
 podintroductions.3003.desc:0 "[la mascarada|E] representa el grado de exposición a las autoridades mortales, como la Iglesia. En el juego, es un modificador de carácter que va de 0 a 5. La exposición puede aumentar por el uso de poderes vampíricos, la caza de mortales y varios eventos. Si aumenta demasiado, las células inquisidoras (una facción) se alzarán contra ti. Para reducir tu exposición, la mayoría de las religiones pueden utilizar la interacción "Cubrir la máscara" haciendo clic con el botón derecho del ratón sobre tu personaje. Sin embargo, las religiones que no se preocupan por la [mascarada|E] no tienen este lujo". 
 podintroductions.3004.t:0 "El hambre" 
 podintroductions.3004.desc:0 "El Hambre representa cuánto necesita tu personaje la sangre. Está representado por un modificador de carácter que va de 0 a 5. El hambre aumenta sobre todo al usar el poder vampírico. Si se eleva demasiado durante mucho tiempo, no podrás usar más los poderes vampíricos y podrían ocurrir algunos eventos desagradables.\NPara disminuir tu hambre debes cazar mortales, una interacción del personaje sobre cualquier mortal en tu ubicación." 
 podintroductions.4000.t:0 "Secretos de la fe" 
 podintroductions.4000.desc:0 "¿Qué tema te gustaría explorar?" 
 podintroductions.4000.a:0 "La verdadera fe" 
 podintroductions.4000.b:0 "Los poderes de los inquisidores" 
 podintroductions.4000.c:0 "Sucesión" 
 podintroductions.4000.d:0 "Encontrar la guarida" 
 podintroductions.4000.e:0 "Estoy bien, vamos" 
 podintroductions.4001.a:0 "Volvamos". 
 podintroductions.4001.t:0 "Fe verdadera" 
 podintroductions.4001.desc:0 "Una de las herramientas más importantes a disposición del Cazador, la Fe Verdadera (y su versión mejorada Beatific) es un rasgo que desbloquea un poderoso estilo de vida. La mayoría de los Cazadores iniciales lo tienen al principio, pero asegurarse de que sus herederos también lo tienen es una tarea importante.\NPara ello, puedes usar el poder de Fe Verdadera Intercesión en cualquier otro personaje para tener la oportunidad de darle el rasgo. Si eso falla y estás jugando con un personaje que no lo tiene y todavía quieres tenerlo, puedes pedirle a un amigo con Fe Verdadera que te ayude a adquirirlo. Sin embargo, es un proceso costoso y difícil.\NEl estilo de vida de la Fe Verdadera se obtiene principalmente por la interacción/esquema de Encontrar la Guarida que se discute en su propio capítulo." 
 podintroductions.4002.t:0 "Poderes de los inquisidores" 
 podintroductions.4002.desc:0 "Además de la Fe Verdadera, de la que se habla en su propio capítulo, los estilos de vida de los Inquisidores dependen de la Orden de Inquisidores a la que pertenezca tu personaje, que está representada por la dinastía de tu personaje en el juego. No puedes acceder a los poderes específicos de las otras órdenes". 
 podintroductions.4003.t:0 "Sucesión" 
podintroductions.4003.desc:0 "Cada orden tiene su propio método de sucesión. La familia Von Murnau juega como el CK3 de vainilla, con matrimonio e hijos. Las otras órdenes sagradas utilizan una interacción especial con los personajes para ordenarlos y que se conviertan en sus "hijos".\NLa ordenación sigue algunas reglas, como que el aprendiz sea más joven que el maestro o, en el caso de las Hermanas de San Juan, que sea una mujer.\NLas órdenes, además de los Von Murnau y los Oculi Dei, son célibes y, por tanto, deben utilizar esta mecánica para asegurarse de tener herederos adecuados." 
 podintroductions.4004.t:0 "Encontrar la guarida" 
 podintroductions.4004.desc:0 "Un esquema especial disponible para los Cazadores contra los personajes vampiros, Encontrar la Guarida es una parte fundamental de la jugabilidad de los Cazadores ya que es una forma de acabar con los vampiros poderosos sin una guerra, y también es la principal forma de ganar xp del estilo de vida de la Fe Verdadera.\NObviamente, dicho esquema es peligroso, pero la dificultad se puede mitigar si eliges bien tu objetivo. Las principales cosas en las que hay que fijarse son las estadísticas, cuanto mayor sea la ventaja que tengas sobre el objetivo en una categoría, más fácil será.\NLa Guarida de la Búsqueda es también una buena preparación para una guerra difícil, ya que puedes cazar a los mejores caballeros de tu futuro enemigo incluso antes de que la guerra comience." 
 podintroductions.2001.h:0 "Volver al principio"
 podintroductions.5100.t:0 "La historia hasta ahora..."
 podintroductions.5100.desc:0 "El Mundo de las Tinieblas es un universo que funciona desde hace más de 30 años, con cientos de libros y otros medios de comunicación que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales están interactuando bajo la superficie, creando un submundo lleno de intrigas e historias.\NLos Vampiros del WoD son principalmente el resultado de la maldición bíblica contra Caine, el primer asesino, y la mayoría se remontan a su linaje en un sistema que llaman "generaciones". Este árbol dinástico de la no-muerte se ha ramificado en varias facciones, los clanes, cada uno con su fuerza, su debilidad y su base geográfica de poder.\NEstás jugando con un Wan Kuei, un 'Kindred del Este' que son antiguos guardianes corrompidos y malditos por el Personaje de Jade de Agosto por sus crímenes. Aunque no son técnicamente vampiros, a menudo interactúan, sobre todo mediante guerras territoriales, con los vampiros occidentales, especialmente en la India. El subcontinente ha sido el principal escenario de guerra entre los Wan Kuei procedentes de Asia Oriental y los vampiros nativos de la India durante milenios. Los propios Wan Kuei apenas son un frente unido, dividido entre varios "dharmas", sus principales creencias, y "cortes", sus principales organizaciones políticas."

 podintroductions.5000.t:0 "Secretos de los Wan Kuei" 
 podintroductions.5000.desc:0 "¿Qué tema le gustaría explorar?" 
 podintroductions.5000.a:0 "Dharmas" 
 podintroductions.5000.b:0 "Chi" 
 podintroductions.5000.c:0 "Sucesión" 
 podintroductions.5000.d:0 "Equilibrio" 
 podintroductions.5000.e:0 "Estoy bien, vamos" 
 podintroductions.5001.a:0 "Volvamos". 
 podintroductions.5001.t:0 "Dharmas" 
 podintroductions.5001.desc:0 "Tu nivel de Dharma representa tus logros en tu camino, puede ser elevado a través de una decisión y disminuir en algunas situaciones de Frenesí. Cuando se reduce a 0, te conviertes en chih-mei y no puedes volver a gobernar (abdicación). \NCuando alcanzas el nivel 5+ de dharma, puedes absorber Chi (el recurso de los Kuei-Jin que sustituye a la sangre) mediante el aliento en lugar de beber sangre (lo que disminuye el nivel de salud del prisionero del objetivo, arriesgándose a su vez a [torpor|E] o a la muerte cuando alcanzan un estado crítico), y devorar Chi del ambiente cuando alcanzas el 6+ (No se necesita ningún objetivo).\NAlcanzar un dharma alto también te permite tener un nivel de virtud de Chi extra. A partir del nivel de dharma 5, ganas dos niveles extra por nivel de dharma". 
 podintroductions.5002.t:0 "Chi" 
 podintroductions.5002.desc:0 "Tienes dos aspectos del Chi, el Yin y el Yang, divididos como puntos de Chi de tu reserva de Chi y un límite de reserva llamado virtud del Chi.\NObtienes un modificador de desequilibrio temporal cuando gastas todo el Chi de un aspecto o tienes más Chi que la virtud del mismo aspecto. El rasgo de desequilibrio permanente permite ingerir más Chi de ese tipo sin efectos nocivos.\NCuando el total de Chi es de cinco o menos puntos de Chi (de cualquier tipo), recibirás un modificador de debuff de hambre, menos de dos te hará voraz, mientras que 0 te hará perder el control para adquirir Chi (El rasgo de desequilibrio permanente yang te hace hambriento más rápido, por lo que en lugar de hambre recibirás voraz, y en lugar de voraz perderán el control). \Gastar más Chi del que tienes puede darte un modificador de salud, lo que finalmente hará que entres en la "pequeña muerte" (que resulta en la abdicación)." 
 podintroductions.5003.t:0 "Sucesión" 
podintroductions.5003.desc:0 "Los Wan Kuei no pueden [Abrazar|E] como los vampiros, pero el desequilibrio permanente de Yang les permite tener Dhampyr con mortales (No implementado aún), o pueden capturar chih-mei y educarlos como discípulos, los chih-mei son almas muertas devueltas del Yomi recientemente o un Shih que perdió toda la Humanidad (Representado como un evento de estrés), la captura se representa en el juego vía decisión, y la educación vía una cadena de eventos." 
 podintroductions.5004.t:0 "Equilibrio" 
 podintroductions.5004.desc:0 "Cuando la diferencia de virtudes de Yin y Yang es más de 3, obtienes un rasgo de desequilibrio permanente, esto puede no ser malo, ya que el desequilibrio permanente proporciona una mecánica especial explicada en los otros temas.\nPero el desequilibrio permanente durante mucho tiempo (5 años cíclicos de baja probabilidad evento) puede tener consecuencias; El desequilibrio permanente de Yin hará que tu posible objetivo de Shih sea más cadavérico e inhumano a la vez y, finalmente, Chi'gh Shih al fin; El desequilibrio permanente de Yang te dará enfermedades vampíricas mortales y extremadamente contagiosas."
 podintroductions.5004 .desc:0 "Cuando la diferencia de virtudes del Yin y el Yang es superior a 3 se obtiene un rasgo de desequilibrio permanente, esto puede no ser malo ya que el desequilibrio permanente da alguna mecánica especial explicada en los otros temas. \Pero estar permanentemente desequilibrado durante mucho tiempo (evento cíclico de baja probabilidad de 5 años) puede tener consecuencias; el desequilibrio permanente del Yin hará que tu posible objetivo de Shih sea más corpóreo e inhumano al tiempo y finalmente Chi'gh Shih al final; el desequilibrio permanente del Yang te dará enfermedades vampíricas mortales y excesivamente contagiosas." 

 podintroductions.2210.t:0 "Secretos del renacido" 
 podintroductions.2210.desc:0 "¿Qué tema te gustaría explorar?" 
 podintroductions.2210.a:0 "La resurrección" 
 podintroductions.2210.b:0 "Hekau y Sekhem" 
 podintroductions.2210.b_wutian:0 "Tan y Chi" 
 podintroductions.2210.c:0 "Neteru" 
 podintroductions.2210.e:0 "Estoy bien, vamos" 
 podintroductions.2211.a:0 "Volvamos". 
 podintroductions.2211.t:0 "Resurrección" 
 podintroductions.2211.desc:0 "¡Eres inmortal, más aún, puedes resucitar cuando te maten!\N-Esto tiene algún coste, que puedes ver en su propio capítulo.\N-Aún así acabarás en el olvido cuando no puedas pagar el coste, o decidas suicidarte por voluntad propia o por estrés, o si tu alma es devorada!" 
 podintroductions.2212.t:0 "Hekau y Sekhem" 
 podintroductions.2212.desc:0 "Como momia tienes acceso al arte de Hekau (Palabra de Poder), representado como estilos de vida.\NTu despliegue de Sekhem para alimentar tus técnicas de Hekau, y se recuperará cuando estés en la Tierra de la Fe (Norte de África, Oriente Medio y Antigua Persia) con el tiempo (1 punto/3 meses).\NGastar más Sekhem del que tienes puede darte un modificador de salud, que acabará con tu Tercera vida cuando llegues muy lejos de -9." 
 podintroductions.2212.desc_wutian:0 "Como Wutian, no puedes adquirir nomenclatura como las Momias de Egipto, pero puedes acceder al estilo de vida Tan.\n\nNo muestra Sekhem, sino que tiene dos aspectos de Chi, Yin y Yang, divididos como puntos Chi de tu reserva de Chi con un número total de 10, recuperándose con el paso del tiempo.\n\nGastar más Chi del que tienes puede darte un modificador de desventaja de salud, que terminará con tu Tercera vida cuando alcances mucho más allá de -9."
 podintroductions.2212.t_wutian:0 "Tan y Chi" 
 podintroducciones.2212 .desc_wutian:0 "Como Wutian no puedes adquirir nomenclatura como las momias de Egipto, pero puedes acceder al estilo de vida Tan.\NNo tienes pantalla de Sekhem, en su lugar tienes dos aspectos de Chi, Yin y Yang, divididos como puntos de Chi de tu reserva de Chi con número total de 10, recuperándose con el paso del tiempo.\NGastar más Chi del que tienes puede darte un modificador de salud, que acabará con tu Tercera vida cuando llegues muy lejos de -9." 
 podintroductions.2213.t:0 "Neteru" 
 podintroductions.2213.desc:0 "Eres único, no puedes crear más momias para que te asistan.\NEn cambio, puedes usar Neteru para mantener tus títulos o edificios.\NTu hijo mortal se convertirá en tu Neteru al nacer, pero también puedes usar una [interacción|E] que cueste prestigio para reconocer a tu cortesano como Neteru.\NSólo una cosa, no pueden sucederte, el juego terminará cuando ya no puedas resucitar." 

 podintroductions.6001.t:0 "Conflicto" 
 podintroductions.6001.desc:0 "Has escogido rasgos de diferentes splat (los universos, como vampiros, inquisidores, ghouls, etc). Tu personaje no puede funcionar correctamente y necesitará un reinicio". 
 podintroductions.6001.a:0 "Eliminar otros rasgos"
 podintroductions.6001.b:0 "Eliminar otros rasgos"
 podintroductions.6001.c:0 "Eliminar otros rasgos"
 podintroductions.6001.d:0 "Eliminar otros rasgos"
 podintroductions.6001.e:0 "Eliminar otros rasgos"

 podintroductions.6002.t:0 "Fondo" 
 podintroductions.6002.desc:0 "¿Quieres elegir un vampiro en el mapa para tener un [Sire|E] conocido como parte del trasfondo de tu personaje, o prefieres empezar sin un linaje claro?" 
 podintroductions.6002.a:0 "Quiero elegir con quién estoy emparentado".
 podintroductions.6002.c:0 "Dejaré que se desconozca".

 podintroductions.6003.t:0 "Fondo y primer plano" 
 podintroductions.6003.desc:0 "¿Quieres elegir un Wan Kuei en el mapa para tener un Sifu inicial como parte del trasfondo de tu personaje o prefieres unirte a uno más adelante durante el juego?" 
 podintroductions.6003.a:0 "Quiero elegir mi Sifu inicial".
 podintroductions.6003.b:0 "Me uniré a un Wu más adelante en el juego".
 podintroductions.6003.c:0 "Quiero empezar como un Heimin".

 podintroductions.6004.t:0 "Fondo y primer plano" 
 podintroductions.6004.desc:0 "¿Quieres elegir un ghoul/revestido del mapa para tenerlo como padres como parte del fondo de tu personaje? ¿Quieres formar parte de una organización ahora, más adelante durante el juego o nunca?" 
 podintroductions.6004.a:0 "Quiero elegir a mis padres".
 podintroductions.6004.b:0 "Quiero cambiar la organización de la que formo parte".

podintroductions.6004.b.t:0 "Puedes unirte a los Desamparados, una facción de ghouls independientes, centrados principalmente en la caza de vampiros. O convertirte en el hijo de un vampiro". 
 podintroductions.6004.c:0 "No necesito eso".

 podintroductions.6005.t:0 "Fondo y primer plano" 
 podintroductions.6005.desc:0 "¿Quieres elegir un Cazador en el mapa para tener padre como parte del fondo de tu personaje? ¿Quieres formar parte de una organización ahora, más adelante durante el juego o nunca?" 
 podintroductions.6005.a:0 "Quiero elegir a mis padres".
 podintroductions.6005.b:0 "Quiero cambiar la organización de la que formo parte".
 podintroductions.6005.b.t:0 "Puedes unirte a la inquisición, convertirte en shih si estás en la parte oriental del mapa, o incluso caer en la oscuridad".
 podintroductions.6005.c:0 "No necesito eso"

 podintroductions.6010.t:0 "Tu edad real" 
 podintroductions.6010.desc:0 "Puedes poner tu edad real aquí, esto no cambiará tu apariencia inmortal.\NNSe recomienda envejecer tú mismo para un personaje vampiro; ya que debido a las limitaciones del motor de CK3, si un personaje es mayor que tú, hacerlo tu hijo podría no funcionar correctamente." 
 podintroductions.6010.a:0 "Restablecer a 16"
 podintroductions.6010.b:0 "Añadir 100 años"
 podintroductions.6010.c:0 "Añadir 10 años"
 podintroductions.6010.d:0 "Añadir 1 año".
 podintroductions.6010.e:0 "Mantener la edad actual"
