 POD_werewolves_maintenance.2.t:0 "primer cambio"
 POD_werewolves_maintenance.2.desc:0 "El Primer Cambio es el nombre que recibe el primer cambio de forma de un joven Garou (y de la mayoría de los Fera). Por lo general, viene junto con el primer frenesí y el primer uso de la forma de batalla Crinos en situaciones altamente estresantes.\n Acabas de experimentar este evento traumático y ahora eres oficialmente un hombre lobo, un miembro de pleno derecho de tu tribu con todas las responsabilidades y privilegios que conlleva tal papel."
 POD_werewolves_maintenance.2.option.a:0 "soy un adulto ahora"
