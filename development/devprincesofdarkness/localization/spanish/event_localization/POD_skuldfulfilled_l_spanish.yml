l_spanish:

 POD_skuldfulfilled.001.t:0 "Skuld Fulfilled"
 POD_skuldfulfilled.001.desc:0 "Estás intentando quitarle el poder eterno de la sangre al insignificante no cainita que es [defender.GetFirstName], convirtiendo a [defender.GetHerHim] en un simple humano una vez más. Si [defender.GetSheHe] es lo suficientemente mayor, existe la posibilidad de que tus manipulaciones maten a [defender.GetHerHim]"
 POD_skuldfulfilled.001.option.a:0 "[defender.GetSheHe|U] no merece tal poder"
 POD_skuldfulfilled.001.option.a.tt:0 "Intentarás quitarle a [defender.GetHerHis] el poder de la sangre"
 POD_skuldfulfilled.option.001.a.desc:0 "Usarás tu conocimiento místico de Oblivion"
 POD_skuldfulfilled.001.option.success:0 "[defender.GetFirstName] se convierte en un simple humano"
 POD_skuldfulfilled.001.option.a.tt.attacker_wins:0 "Tienes éxito"
 POD_skuldfulfilled.001.option.failure:0 "Tus conocimientos no son suficientes"
 POD_skuldfulfilled.001.option.a.tt.attacker_lost:0 "[defender.GetFirstName] resiste"
 POD_skuldfulfilled.001.option.b:0 "No es el momento adecuado..."
 POD_skuldfulfilled.001.option.b.tt:0 "Abandonas tu intento de robar el poder de la sangre de [defender.GetFirstName]"


POD_skuldfulfilled.002.t:0 "Skuld cumplido"
POD_skuldfulfilled.002.desc:0 "¡Alguien ha utilizado los poderes oscuros de Oblivion para robar el poder de tu sangre a [defender.GetFirstName]! Ahora [defender.GetSheHe] ya no está unido a ti por los lazos de la sangre..."
POD_skuldfulfilled.002.option.a:0 "Debería hacer algo al respecto"
POD_skuldfulfilled.002.option.a.tt:0 "[defender.GetFirstName] ya no es tu esclavo"