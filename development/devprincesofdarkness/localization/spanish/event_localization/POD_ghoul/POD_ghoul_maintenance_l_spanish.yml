l_spanish:

 POD_ghoul_maintenance.50.t:0 "Rechazado por mi Domitor"
 POD_ghoul_maintenance.50.desc:0 "Mi domitor me ha retirado su patrocinio.  Ya no estoy a su servicio. Ya no me regalarán su sangre vampírica. Sin esa sangre, acabaré envejeciendo y muriendo".
 POD_ghoul_maintenance.50.option.a:0 "Los odio por esto".
 POD_ghoul_maintenance.50.option.b:0 "Quizá sea lo mejor".
 POD_ghoul_maintenance.300.t:0 "Revenancy"
 POD_ghoul_maintenance.300.desc:0 "Me he convertido en un revenant".
 POD_ghoul_maintenance.300.option.a:0 "¡El poder de la sangre!"
 POD_ghoulthrall_release_option.tt:0 "Liberará a un ghoul thrall de su servicio".
 
