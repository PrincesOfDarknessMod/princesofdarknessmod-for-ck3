l_spanish:

 PODadventurers.1001.t:0 "Problemas por delante"
 PODadventurers.1001.desc:0 "Los últimos informes de tus agentes traen historias de un joven neonato llamado Giangaleazzo. Este joven parece tener grandes ambiciones y, en lugar de mostrarte el debido respeto como debería, parece estar reuniendo apoyos por el norte de Italia con un propósito desconocido. Hasta ahora, ha demostrado ser demasiado astuto y escurridizo para ser atrapado, lo que ya es preocupante..."
 PODadventurers.1001.a:0 "Tengo un mal presentimiento sobre esto..."
 PODadventurers.1001.player_warning:0 "Prepárate, pronto oirás hablar más de él".
 PODadventurers.1002.t:0 "El Príncipe : Giangaleazzo"
 PODadventurers.1002.desc:0 "'No soy un hombre apasionado. Es cierto que considero a Milán mi derecho de nacimiento, ya que fui su duque hace mucho tiempo y, también es cierto, que Italia siempre ocupará un lugar especial en mi frío corazón. ¿Pero el César detuvo sus ambiciones en una sola ciudad? ¿Una nación, incluso? No estoy conquistando tierras y títulos por un propósito superior o incluso por la emoción de hacerlo. En absoluto. No hay religiones, ni filosofías, ni emociones, sólo existe el Juego. Burlar a tu oponente, ver cómo se desmoronan sus planes antes de que sepa tu nombre, obligarle a traicionar todo lo que aprecia... Ese es el objetivo de nuestra existencia. Recuerda que siempre hay un jugador mejor que tú. Alguien a quien observar, aprender de él y luego aplastar. ¿Y en la cima de la pirámide...? Bueno, allí te veré, siempre que sobrevivas lo suficiente".
 PODadventurers.1002.a:0 "¡Es hora de enseñarle a este arrogante Visconti algo de humildad!"
 PODadventurers.1002.a.target.tt:0 "Ya te encargarás de él cuando llegue el momento"
 PODadventurers.1002.a.not_target.tt:0 "Tu señor está ahora en guerra con Giangaleazzo"
 PODadventurers.1002.b:0 "¡Quiero a este hombre de mi lado, cueste lo que cueste!"
 PODadventurers.1002.b.custom:0 "Vas a vasallar al ambicioso Visconti. Te costará mucho llevarlo a cabo y él te lo agradecerá sólo por un tiempo..." 
 POD_giangaleazzo.notification:0 "El Príncipe hace su movimiento"
 POD_giangaleazzo.desc:0 "En Italia, Giangaleazzo Visconti, un ambicioso Lasombra, ha lanzado una campaña de conquista. ¿Sacudirá el viejo centro del Imperio?"
 PODadventurers.1011.t:0 "Problemas por delante"
 PODadventurers.1011.desc:0 "La rebelión de Wat Tyler hace estragos en toda Inglaterra, y ha empezado a afectar también al mundo cainita. Crecen los rumores de un acólito entre sus vampiros convertidos, este acólito está decidido a iniciar una rebelión más... nocturna". 
 PODadventurers.1011.a:0 "Tengo un mal presentimiento sobre esto..."
 PODadventurers.1011.player_warning:0 "Prepárate, pronto oirás más sobre esto".
 PODadventurers.1012.t:0 "El Rebelde : Tyler"
 PODadventurers.1012.desc:0 "La rebelión de Wat Tyler ha sido una molestia para los cainitas ingleses, pero parece que sus efectos de propagación no han hecho más que empezar. Una joven Brujah, Patricia de Bollingbroke, ha tomado el nombre del rebelde y ha empezado a arengar a los jóvenes cainitas desilusionados y a otra chusma. La ardiente mujer parece empeñada en acabar con los tiranos, sean mortales o no. Como ha tomado su primera ciudad, y cada noche se unen más a su lado, los señores de Inglaterra tienen que elegir cómo tratarla. ¿Será el guante de terciopelo o el puño de hierro?"
 PODadventurers.1012.a:0 "Otro rebelde, otro fracaso condenado que pronto será aplastado"
 PODadventurers.1012.a.target.tt:0 "Te encargarás de ella cuando llegue el momento"
 PODadventurers.1012.a.not_target.tt:0 "Tu señor está ahora en guerra con Tyler"
 PODadventurers.1012.b:0 "Bueno... ella tiene algunos puntos buenos... y un gran ejército"
 PODadventurers.1012.b.custom:0 "Tyler sólo doblará la rodilla si te unes a su causa. Una propuesta muy insultante, sin duda, pero también ganarías un poderoso aliado." 
 PODadventurers.1012.c:0 "¡Estamos en el mismo bando!"
 POD_tyler.notification:0 "La Rebelde hace su movimiento"
 POD_tyler.desc:0 "En Inglaterra, Patricia de Bollingbroke se levanta contra los tiranos en un intento probablemente condenado de libertad... ¿o es la primera chispa verdadera de una gran revolución?"
 PODadventurers.1021.t:0 "Problemas por delante"
 PODadventurers.1021.desc:0 "Os han llegado rumores de que Vlad Tepes, el ya famoso gobernante de Valaquia, ha hecho averiguaciones sobre el mundo cainita. De alguna manera, se ha enterado de la existencia de tu especie y parece estar interesado en ella". 
 PODadventurers.1021.a:0 "Tengo un mal presentimiento sobre esto..."
 PODadventurers.1021.player_warning:0 "Prepárate, pronto sabrás más de esto".
 PODadventurers.1022.t:0 "El empalador: Vlad Tepes"
 PODadventurers.1022.desc:0 "El gobernante mortal de Valaquia, Vlad Tepes Draculesti, ha demostrado estar dotado de una voluntad indomable una y otra vez. Se negó a ser abrazado nada más que en sus propios términos y sabía mucho más sobre la condición vampírica que muchos antiguos incluso antes de convertirse en uno. Los primeros años de su vida estuvieron llenos de rumores. ¿Quién era su padre? ¿Había encontrado realmente la Catedral de la Carne y permanecido indemne? ¿Dónde se encuentra su lealtad? Estas preguntas siguen sin respuesta, pero el autodenominado Drácula parece haberse hartado de vagar por ahí. El Tzimisce, un mero joven, ha reunido una impresionante hueste de vampiros, ghouls y soldados de su época mortal y ha terminado su primera conquista. Ahora se presenta ante ti con una oferta, reconócelo como tu protegido y podréis iniciar una relación mutuamente beneficiosa. Recházalo y... bueno, la amenaza que representa un individuo así no necesita explicación".
 PODadventurers.1022.a:0 "Un advenedizo sigue siendo un advenedizo, incluso con un apodo elegante"
 PODadventurers.1022.a.target.tt:0 "Ya te encargarás de él cuando llegue el momento"
 PODadventurers.1022.a.not_target.tt:0 "Tu señor está ahora en guerra con Drácula"
 PODadventurers.1022.b:0 "Una oferta que no puedo rechazar"
 PODadventurers.1022.b.custom:0 "Aunque sería costoso reconocer la amenaza que supone un simple joven, tener al famoso Drácula como hijo adoptivo es una oferta tentadora. Al menos, probablemente te haría ganar algo de tiempo antes de que se vuelva contra ti..." 
 POD_vlad.notification:0 "El Empalador hace su movimiento"
 POD_vlad.desc:0 "En Transilvania, Vlad Tepes continúa su sangrienta carrera, esta vez como un no-muerto. ¿Un nuevo Señor de la Noche para la tierra más allá del bosque?"
 first_giangaleazzo_event_troops:0 "Los Condottieri de Giangaleazzo"
 first_tyler_event_troops:0 "Rebeldes de Tyler"
 first_vlad_event_troops:0 "Los empaladores de Vlad"
 
 
