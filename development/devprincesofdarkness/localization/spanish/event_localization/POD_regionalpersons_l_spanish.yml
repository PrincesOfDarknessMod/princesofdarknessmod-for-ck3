l_spanish:

 podregionalpersons.2.t:0 "El cazador cazado"
 podregionalpersons.2.desc:0 "Desde hace algún tiempo, en su entorno corren rumores de que un mortal está cazando cainitas por su zona. Obviamente, los mortales tienen poca suerte en este empeño la mayoría de las veces, especialmente cuando van por el camino del lobo solitario, como parece hacer este individuo.\NLo que es interesante es que, a pesar de todos estos defectos, este cazador ha mostrado algún éxito temprano, y muchos callejones oscuros son más seguros gracias a él. Sin embargo, es escurridizo, y no estás seguro de dónde atacará después, o incluso si lo hará. Pero puedes mantener a los agentes cerca del suelo para intentar localizarlo si quieres".
 podregionalpersons.2.a:0 "Quiero saber todo sobre él"
 podregionalpersons.2.custom:0 "Estáis advertidos, podría haber graves consecuencias..."
 podregionalpersons.2.b:0 "No me preocupa"
 podregionalpersons.2.customb:0 "No volverás a oír hablar de él"
 podregionalpersons.2.custom:0 "No volverá a saber de él"
 podregionalpersons.2.c:0 "Quiero saberlo todo sobre él"
 podregionalpersons.2.customc:0 "¿Tal vez podría reclutar a este talentoso individuo?"
 podregionalpersons.4.t:0 "El cazador cazado II"
 podregionalpersons.4.desc:0 "Lo has encontrado. Este escurridizo cazador es un tal Karl Schrekt de Viena. Hombre de pocas palabras, ha sido difícil de localizar, y aún más difícil de evaluar.\N-El celo de la furia de Dios arde en su interior, eso es evidente, pero está empañado por una amargura que le hace no ser consciente del sufrimiento que causa durante sus cacerías. Temes que su alma esté al borde, y el ejército de Dios perderá a un hombre impresionante si su fe flaquea aún más.\N¿Tal vez puedas recordarle la gloria de Dios y mostrarle las virtudes de trabajar en un grupo coherente? Aunque será un debate difícil, ya que el hombre no es nada si no es terco..."
 podregionalpersons.4.a:0 "Hermano, presta atención a las palabras de Dios"
 podregionalpersons.4.effect.success.desc:0 "Consigues convencer a Karl para que se una a tu causa sin problemas"
 podregionalpersons.4.success:0 "¡Karl se une a ti!"
 podregionalpersons.4.failure.effect.desc:0 "Tu fe es puesta a prueba, pero al final consigues convencerle"
 podregionalpersons.4.failure:0 "¡Karl se une a ti!"
 podregionalpersons.4.critical.failure.effect.desc:0 "Está perdido para la luz..."
 podregionalpersons.4.critical.failure:0 "Karl se ha ido"
 podregionalpersons.4.c:0 "Ya está demasiado lejos"
 podregionalpersons.3.t:0 "El cazador cazado II"
 podregionalpersons.3.desc:0 "El cazador solitario que está causando estragos en tu zona sigue eludiéndote, pero has conseguido tener, al menos, una idea general de su modus operandi. Con este conocimiento, has ideado dos planes de acción para despistar y, con suerte, capturar a este individuo.\NAmbos planes requerirán que muevas algunos hilos y es probable que atraigan una atención no deseada sobre tus operaciones. Sin embargo, no puedes echarte atrás ahora, ya que parece que el propio cazador se está acercando a tu posición también... Un enfrentamiento es inevitable en este punto".
 podregionalpersons.3.a:0 "Preparemos una trampa para él"
 podregionalpersons.3.b:0 "Una confrontación directa es más mi estilo"
 podregionalpersons.5.t:0 "El cazador cazado III"
 podregionalpersons.5.desc:0 "Debe confesar que está algo nervioso. A estas horas, tus agentes deben estar esperando en la vieja mansión que has montado como tapadera para atrapar al escurridizo cazador. Ya sabes su nombre, Karl Schrekt, de Viena, un lobo solitario con un empuje raramente visto incluso entre los de su clase. Estás bastante seguro de haber planeado bien tu trampa, y tus hombres son lo suficientemente buenos como para someterlo.\NPero... si escapara, o peor aún, matara a tus hombres, asestaría un golpe muy serio a tu control sobre la zona. Y también habrías perdido tu única oportunidad de capturarlo".
 podregionalpersons.5.a:0 "Ya no hay vuelta atrás"
 podregionalpersons.5.effect.success.desc:0 "El plan va viento en popa"
 podregionalpersons.5.failure.effect.desc:0 "Hizo algo de daño, pero tú ganaste"
 podregionalpersons.5.success:0 "¡Lo tenemos!"
 podregionalpersons.5.failure:0 "¡Lo tenemos!... apenas"
 podregionalpersons.5.critical.failure.effect.desc:0 "Karl huye, después de despachar a tus agentes"
 podregionalpersons.5.critical.failure:0 "Nos ha pillado..."
 podregionalpersons.6.t:0 "El cazador cazado III"
 podregionalpersons.6.desc:0 "Asistencia media a tu corte esta noche cuando, de repente, varias antorchas surgen de la nada en medio de la sala. Apenas consigues contener a tu aterrorizada Bestia mientras los gritos de horror y el frenesí de los vampiros se escuchan a tu alrededor.\NCuando intentas huir de la caótica escena, una figura encapuchada te bloquea el camino, aparentemente sin darse cuenta del fuego que te rodea.\NSin decir una palabra, comienza a acercarse a ti, con una antorcha encendida en cada mano. El enloquecedor celo de sus ojos no deja lugar a dudas, parece que el escurridizo cazador de lobos solitarios te encontró a ti antes de que tú le encontraras a él..."
 podregionalpersons.6.a:0 "¡Deténganlo! AHORA!"
 podregionalpersons.6.failure.effect.desc:0 "Hizo algo de daño, pero tú ganaste"
 podregionalpersons.6.effect.success.desc:0 "¡Consigues dominarlo y capturarlo!"
 podregionalpersons.6.success:0 "¡Lo tenemos!"
 podregionalpersons.6.failure:0 "¡Lo tenemos!... apenas"
 podregionalpersons.6.critical.failure.effect.desc:0 "Lo último que se ve es fuego, fuego por todas partes"
 podregionalpersons.6.critical.failure:0 "Tan caliente..."
 podregionalpersons.7.t:0 "La sala de Ulf"
 podregionalpersons.7.desc:0 "Te llega un informe de que se ha encontrado la legendaria Sala de Ulf.\NEsta pequeña isla cerca de Noruega contiene supuestamente el tesoro de los famosos Valdaermen, los magos rúnicos nórdicos. Su tiempo ha desaparecido, ya que el Dios cristiano ha barrido su fe en el continente. Pero parece que una pequeña cábala de ellos todavía se aferra a la Sala, protegiendo lo que podría ser todo un alijo de tesoros, dado el poder que tenían en siglos pasados... ¿Qué harás con esta información?"
 podregionalpersons.7.a:0 "¡Hora de una incursión, digo!"
 podregionalpersons.7.custom:0 "Estáis advertidos, podría haber graves consecuencias..."
 podregionalpersons.7.b:0 "¡Debemos proteger a estos siervos de Odín!"
 podregionalpersons.7.c:0 "Tengo asuntos más urgentes que atender"
 podregionalpersons.7.customb:0 "No volverás a ser molestado por esta historia"
 podregionalpersons.8.t:0 "Sala de Ulf II"
 podregionalpersons.8.failure.effect.desc:0 "Recibiste un golpe serio, pero el pueblo es tuyo"
 podregionalpersons.8.critical.failure.effect.desc:0 "Los magos rúnicos derriban tus fuerzas"
 podregionalpersons.8.desc:0 "Pequeña y modesta aldea de pescadores, Ulf's Hall no es la grandiosa ciudad dorada que esperabas.\NAún así, mientras observas los alrededores, sabes que es mejor no subestimar a la cábala de Runemagos que probablemente habita aquí. Tal y como lo ves, tienes dos opciones: Un asalto total ahora mismo donde no lo esperan, o fingir amistad con su causa para apuñalarlos por la espalda cuando se presente la oportunidad".
 podregionalpersons.8.a:0 "¡Enviaremos a estos tontos a su Valhalla!"
 podregionalpersons.8.effect.success.descb:0 "Te dan la bienvenida de todo corazón"
 podregionalpersons.8.critical.failure.effect.descb:0 "Son sospechosos ..."
 podregionalpersons.8.effect.success.desc:0 "Superas la aldea con facilidad"
 podregionalpersons.8.failure:0 "Has recibido un golpe"
 podregionalpersons.8.b:0 "Conozcamos a nuestros nuevos 'amigos'..."
 podregionalpersons.9.critical.failure.effect.desc:0 "No estabas preparado ..."
 podregionalpersons.9.t:0 "Sala de Ulf III"
 podregionalpersons.9.desc:0 "La batalla ha sido dura, tal y como preveías, los Runemagos han sido cogidos por sorpresa, pero no sin defensa. La mayoría de tus fuerzas han sido heridas, o directamente asesinadas, por trampas, por los pequeños pueblos o por los propios magos.\NPero ahora, estás dentro de la propia Sala, con sólo su líder de pie ante ti. Y, detrás de él, ya puedes ver el oro brillante del famoso tesoro... Podrías huir y coger todo el oro que puedas antes de huir. O podrías intentar desafiar a este poderoso mago nórdico a un duelo para obtener toda la recompensa".
 podregionalpersons.9.a:0 "No tengo miedo de este tipo"
 podregionalpersons.9.effect.success.desc:0 "¡Corta a este tonto por la mitad! El oro es tuyo!"
 podregionalpersons.9.success:0 "¡Una victoria total!"
 podregionalpersons.9.critical.failure:0 "El final"
 podregionalpersons.9.b:0 "No me da miedo este tipo... pero sigo prefiriendo correr"
 podregionalpersons.10.t:0 "Sala de Ulf III"
 podregionalpersons.10.desc:0 "Te aplastaron por completo. Los Runemagos tenían trampas, sistemas de advertencia místicos y el smallfolk estaba totalmente detrás de ellos. Vuestro ejército aguantó lo justo para permitir que un pequeño grupo de vosotros huyera con el barco que utilizasteis para venir aquí.\NAhora, debéis preparar el futuro, ya que este revés pesará claramente en vuestro prestigio en casa. Sin embargo, aún tenéis el control de la narración...".
 podregionalpersons.10.a:0 "¡Fue una treta para purgar a los traidores de mi reino!"
 podregionalpersons.10.b:0 "¡Eran cientos! ¡Y el propio Odín luchó con ellos!"
 podregionalpersons.11.t:0 "Sala de Ulf III"
 podregionalpersons.11.desc:0 "Lograste hacer creer a los Runemagos que estabas de su lado. Como tal, fue demasiado tarde cuando finalmente comprendieron tu verdadera naturaleza. Tus fuerzas han matado a la mayor parte de la cábala y han tomado el control de la aldea.\NPero ahora, ves a los dos miembros supervivientes de la cábala entrar en acción. Su líder, un sólido nórdico conocido como Brand, está tratando de inmovilizarte mientras el otro miembro recoge el tesoro para huir.\NSi pierdes tiempo con Brand, perderás parte del oro, pero potencialmente ganarás un prisionero útil..."
 podregionalpersons.11.a:0 "Este hombre vale más que el simple oro..."
 podregionalpersons.11.b:0 "¡Oro! Más oro!"
 podregionalpersons.13.critical.failure.effect.desc:0 "No están convencidos ..."
 podregionalpersons.12.t:0 "Sala de Ulf III"
 podregionalpersons.12.desc:0 "Se dieron cuenta de tu artimaña con bastante facilidad. Y os aplastaron por completo en cuanto comprendieron que habíais mentido sobre vuestras verdaderas intenciones.\NA duras penas conseguisteis manteneros en pie para permitiros huir hasta el barco que utilizasteis para venir aquí. Obviamente, este revés será un gran golpe para tu prestigio en casa, pero... todavía puedes controlar la narrativa de la situación, de alguna manera".
 podregionalpersons.12.a:0 "¡Fue una treta para purgar a los traidores de mi reino!"
 podregionalpersons.12.b:0 "¡Eran cientos! ¡Y el propio Odín luchó con ellos!"
 podregionalpersons.13.t:0 "Sala de Ulf II"
 podregionalpersons.13.desc:0 "Los Runemagos fueron difíciles de convencer. Son un grupo cansado, escondido durante tanto tiempo, pero vuestras tradiciones compartidas ayudaron a encontrar un terreno común. Les hiciste saber que su posición está comprometida y que otros vendrán con intenciones más hostiles que las tuyas.\NComo tal, ahora se están preparando para irse, y te ofrecen una pequeña parte de su tesoro para recompensarte por tu ayuda. Aunque, si eres lo suficientemente persuasivo, podrías convencerles de que se unan a tu reino y disfruten de tu protección, lo que obviamente reportaría más beneficios."
 podregionalpersons.13.a:0 "¡Ven con nosotros! El Ragnarok aún puede evitarse"
 podregionalpersons.13.effect.success.desc:0 "¡Están convencidos!"
 podregionalpersons.13.b:0 "Gracias hermanos, y que naveguen bien"
 podregionalpersons.13.critical.failure:0 "No están convencidos..."
 podregionalpersons.14.t:0 "Sala de Ulf III"
 podregionalpersons.14.desc:0 "Has conseguido convencer a los Valdaermen para que se unan a tu reino y a tu protección. Ya están empezando a proporcionar una gran ayuda en tu capital, usando sus habilidades místicas para ayudar a la población.\NAunque... también vinieron aquí con su tesoro, y podrías apuñalarlos por la espalda, reclamar el tesoro para ti, y luego expulsar a los Runemages. Seguro que a Odín no le importaría".
 podregionalpersons.14.a:0 "Hagamos que nuestros nuevos amigos se sientan como en casa"
 podregionalpersons.14.b:0 "...El oro es oro"
 podregionalpersons.15.t:0 "El último cátaro"
 podregionalpersons.15.desc:0 "Un extraño individuo ha llegado recientemente a su corte. Este joven es aparentemente un refugiado de Montsegur, la última fortaleza de los cátaros, recientemente caída en manos de los cruzados. Has oído muchos informes contradictorios sobre este suceso, desde que el famoso tesoro de los cátaros fue escondido antes del asedio, hasta que el "Cristo cátaro" maldijo a los cristianos cuando fue llevado a la pira.\NNo puedes negar la piedad de este muchacho, pero dejarlo predicar en tu corte podría ser peligroso, ya que los cátaros tienen muchos más enemigos que amigos..."
 podregionalpersons.15.a:0 "Invítalo a un debate teológico"
 podregionalpersons.15.b:0 "Déjelo hablar, pero examínelo de cerca"
 podregionalpersons.15.c:0 "Échalo, sólo traerá problemas"
 podregionalpersons.16.t:0 "El último cátaro II"
 podregionalpersons.16.desc:0 "El debate ha sido interesante, y has tenido muchos más desde ellos. ¿Quizás los 'Puros' tenían razón? El joven habla de una forma de seguir la verdadera fe, incluso en tu estado condenado.\NEs tentador, pero desde el punto de vista político, tu conversión a una fe de la que se desconfía mucho podría tener graves consecuencias..."
 podregionalpersons.16.a:0 "La salvación de mi alma vale más que la política mezquina"
 podregionalpersons.16.b:0 "He disfrutado de nuestras charlas, pero debe marcharse ahora"
 podregionalpersons.18.customb:0 "El monstruo continuará su alboroto, pero tal vez surja una pista."
 podregionalpersons.17.t:0 "El último cátaro II"
 podregionalpersons.17.desc:0 "Como todavía no le has echado de tu corte, el joven ha empezado a verte como uno de los pocos cainitas amables que hay. Como tal, ha planteado la idea de dejar que los otros refugiados entren a tu servicio, lo que sin duda ayudaría a la prosperidad de tu reino.\NOtro curso de acción sería capturar e "interrogar" a este chico hasta que revele todo lo que sabe sobre el legendario tesoro de Montsegur..."
 podregionalpersons.17.a:0 "Su gente es bienvenida aquí"
 podregionalpersons.17.b:0 "Hablemos de oro..."
 podregionalpersons.18.t:0 "El monstruo"
 podregionalpersons.18.desc:0 "Alguien... o algo está rondando las calles de tu ciudad por la noche. Y no es uno de los tuyos. Esta cosa ya ha sido acusada de asesinato en masa, y del tipo más espantoso. Incluso algunos de sus agentes, tan hastiados como están, parecían perturbados por los horrores que vieron. Incluso los rumores más oscuros hablan de experimentos del tipo más impío.\NLa ciudad se encoge de miedo y tienes que actuar antes de que la gente empiece a investigar demasiado la vida nocturna. Podrías alertar sutilmente a la Inquisición de los mortales, esperando que lo detengan. O podrías dejarle desbocado durante un tiempo y encontrar un patrón en su locura. Por último, también podrías redoblar las patrullas y los guardias por la noche, para ahuyentarle a otra ciudad más vulnerable." 
 podregionalpersons.18.a:0 "Que lo santo luche contra lo profano"
 podregionalpersons.18.custom:0 "Esto te expondrá un poco, pero con suerte detendrás a este monstruo"
 podregionalpersons.18.b:0 "Debe haber un método en su locura"
 podregionalpersons.18.custom:0 "El monstruo continuará con su desvarío, pero tal vez surja una pista"
 podregionalpersons.18.c:0 "Asústalo"
 podregionalpersons.18.customc:0 "Ayudará a los guardias mortales por la noche, asegurándose de que abandone su ciudad para siempre"
 podregionalpersons.19.t:0 "El monstruo II"
 podregionalpersons.19.desc:0 "Le salió el tiro por la culata. Horriblemente.\NLa cosa que acecha en la noche encontró a la célula inquisitorial\Nque sutilmente lanzaste a su rastro e hizo un escarmiento... uno bastante horripilante, en medio de la ciudad.\NLa ciudad está en pánico, y ya escuchas informes de un equipo de élite de agentes de Dios en camino para limpiar la ciudad. Incluso si eso significa quemarla hasta los cimientos.\N¡Y aún no tienes la menor idea de quién o qué es esa cosa! Tu corte está enloquecida, rogándote que pases desapercibido y olvides este maldito empeño antes de que sea demasiado tarde..." 
 podregionalpersons.19.a:0 "¡Sabré la verdad, aunque tenga que encontrarla yo mismo!"
 podregionalpersons.19.custom:0 "Mientras la Inquisición se cierra en su ciudad, usted continúa su investigación..."
 podregionalpersons.19.b:0 "...Olvidemos todo esto"
 podregionalpersons.19.customb:0 "Olviden esta cacería y pasen desapercibidos mientras la Inquisición recorre el lugar"
 podregionalpersons.20.t:0 "El Monstruo III"
 podregionalpersons.20.desc:0 "Te ha encontrado. El monstruo que aterrorizó a tu ciudad y que tiene a todo un ejército de inquisidores corriendo por ahí está ante ti. Un hombre alemán sorprendentemente normal llamado Strohmann está mirando tranquilamente a tus inquietos cortesanos.\NHe oído hablar mucho de tu especie. Realmente fascinante. Me encantaría saber más. ¿Tal vez podamos llegar a un acuerdo? Yo te ayudo a lidiar con esos molestos Inquisidores y, a cambio, tú me cuentas todo lo que hay que saber sobre la biología vampírica'. Este hombre está claramente desquiciado, e incluso como mortal, es capaz de hacer que la mayoría de la gente sea inconformista. Lo cual es algo que podría utilizar..." 
 podregionalpersons.20.a:0 "Una propuesta intrigante"
 podregionalpersons.20.b:0 "Es el comienzo de una hermosa amistad..."
 podregionalpersons.21.t:0 "El monstruo II"
 podregionalpersons.21.desc:0 "Le salió el tiro por la culata. Horriblemente.\NNo has encontrado ninguna pista sobre el monstruo y, lo que es peor, ha empezado a atacar a tu propia gente, con ya un agente desaparecido que sospechas que no volverá. O no en una sola pieza.\NA medida que los cuerpos se acumulan, la ciudad entra en pánico, y ya escuchas informes de un equipo de élite de agentes de Dios en camino para limpiar la ciudad. Incluso si eso significa quemarla hasta los cimientos.\N¡Y aún no tienes la menor idea de quién o qué es esa cosa! Tu corte está enloquecida, rogándote que pases desapercibido y olvides este maldito empeño antes de que sea demasiado tarde..." 
 podregionalpersons.21.a:0 "¡Sabré la verdad, aunque tenga que encontrarla yo mismo!"
 podregionalpersons.21.custom:0 "Mientras la Inquisición se cierra en su ciudad, usted continúa su investigación..."
 podregionalpersons.21.b:0 "...Olvidemos todo esto"
 podregionalpersons.21.customb:0 "Olviden esta cacería y pasen desapercibidos mientras la Inquisición recorre el lugar"
 podregionalpersons.22.t:0 "El silencio"
 podregionalpersons.23.critical.failure.effect.desc:0 "Se las arreglan para recuperar a Tariq ..."
 podregionalpersons.22.desc:0 "Un vampiro llamado Bakr ha sido traído ante ti. Este asamita ha atacado a un grupo de caballeros de la Séptima Cruzada cerca de tu zona de influencia sin tu bendición. Este comportamiento no puede ser tolerado, ya que seguramente atraerá una atención no deseada a tus dominios.\NBakr se disculpa, y explica que estaba liberando a un joven guerrero musulmán, al que tiene la intención de abrazar. Propone una suma de oro para demostrar que no se le ha faltado al respeto. Podrías aceptarlo... o podrías tomar este tentador prospecto como propio, a pesar de no saber mucho sobre él todavía". 
 podregionalpersons.22.a:0 "Muéstrale la puerta a Bakr, y muéstrale mi habitación a su protegido"
 podregionalpersons.22.custom:0 "Aprenderás más sobre este joven guerrero, pero esto podría tener consecuencias"
 podregionalpersons.22.b:0 "Estás perdonado"
 podregionalpersons.23.t:0 "El silencio II"
 podregionalpersons.23.desc:0 "Has aprendido el nombre del joven que 'rescataste' de Bakr, Tariq. Lamentablemente, los cruzados también se enteraron de que su prisionero está ahora a tu cargo, y parecen sorprendentemente empeñados en recuperarlo de nuevo. Puedes intentar luchar contra ellos, pero te arriesgas a atraer aún más la atención no deseada con tus habilidades sobrenaturales. O puedes dejarles a Tariq y olvidarte de esta molestia". 
 podregionalpersons.23.a:0 "Espero que merezca la pena..."
 podregionalpersons.23.custom:0 "Deja a Tariq, y toda esta historia, atrás"
 podregionalpersons.23.b:0 "No voy a lidiar más con esto"
 podregionalpersons.23.effect.success.desc:0 "Una victoria, ahora a ver a tu protegido..."
 podregionalpersons.23.critical.failure:0 "Consiguen recuperar a Tariq..."
 podregionalpersons.24.t:0 "El silencioso III"
 podregionalpersons.24.desc:0 "Te enfrentaste bastante bien al contraataque de los cruzados. Sin embargo, lo que no anticipaste fue la repentina muerte de tus guardaespaldas y el aún más repentino aura de silencio que rodea tu tienda. Sólo se rompe con un débil "recupero lo que es mío" cuando de repente te das cuenta de que Bakr está aquí, y no ha olvidado que le robaste a su futuro hijo.\NAhora tienes que enfrentarte a un poderoso y viejo asamita empeñado en tu destrucción con sólo un joven, aunque valiente, mortal a tu lado..." 
 podregionalpersons.24.a:0 "Bailemos..."
 podregionalpersons.24.custom:0 "No es muy glorioso, pero es eficiente"
 podregionalpersons.24.b:0 "Voy a coger a Tariq y correr como un demonio"
 podregionalpersons.24.effect.success.desc:0 "¡Una victoria, Tariq es finalmente tuyo!"
 podregionalpersons.24.critical.failure.effect.desc:0 "Si fallas, tu muerte será rápida..."
 podregionalpersons.24.critical.failure:0 "Y así termina..."
 podregionalpersons.24.success:0 "¡Has ganado!"
 podregionalpersons.25.t:0 "Secuelas de un sueño"
 podregionalpersons.25.desc:0 "A pesar de ser un asunto moralmente dudoso, la 4ª Cruzada ha aportado una gran riqueza a las ciudades-estado de Italia, sobre todo gracias a las reliquias griegas saqueadas. Muchas persons, incluyendo cainitas bizantinos, también están huyendo del caos y buscando refugio en otros lugares.\NHas oído recientemente de una caravana de este tipo, que viaja no muy lejos de tu tierra. Como la mayoría de los refugiados, serían presa fácil para tus agentes, y existe la perspectiva de robar las riquezas que puedan llevar consigo.\NOtro curso de acción sería darles la bienvenida en tu corte. Un acto noble, que además podría traer nuevas posibilidades... nadie ha dicho nunca que seas generoso sin una razón". 
 podregionalpersons.25.a:0 "Demos la bienvenida a nuestros primos pobres"
 podregionalpersons.25.custom:0 "No volverás a oír hablar de esta historia"
 podregionalpersons.25.b:0 "¡Traedme cualquier cosa de valor!"
 podregionalpersons.25.c:0 "Esos asuntos están por debajo de mí"          
 podregionalpersons.26.t:0 "Secuelas de un sueño II"
 podregionalpersons.26.desc:0 "Los refugiados bizantinos agradecen su ayuda. Hablan de su gran ciudad, Constantinopla, y de su aún más grande líder espiritual, Miguel.\NEl Patriarca del Sueño ha caído con su ciudad, pero aún hablan de él como una entidad casi más divina que simplemente cainita. Como regalo, uno de ellos te ofrece un fragmento del "espejo" de Santa Sofía, donde Miguel habitaba antes de su caída. Podrías aceptarlo... pero definitivamente hay algo extraño en esta reliquia". 
 podregionalpersons.26.a:0 "Su compañía es suficiente, gracias"
 podregionalpersons.26.b:0 "...mi tesoro"
 podregionalpersons.27.t:0 "Secuelas de un sueño II"
 podregionalpersons.27.desc:0 "Te has deshecho fácilmente de las escasas defensas de la caravana. No hay tanto botín como esperabas, pero sí lo suficiente como para que valga la pena. Sin embargo, un objeto en particular ha sido muy disputado entre tus hombres durante el reparto del botín.\NEste pequeño trozo de cristal, quizás de un espejo o una ventana, tiene un efecto fascinante en la gente, como si llamara a su propia alma. Sabes de Miguel, el vampiro casi divino de Constantinopla antes de su caída... ¿Podría estar relacionado con él?" 
 podregionalpersons.27.a:0 "Sólo tomaré el oro"
 podregionalpersons.27.b:0 "¡Dame eso!"
 podregionalpersons.28.t:0 "Secuelas de un sueño III"
 podregionalpersons.28.desc:0 "El fragmento ha estado siempre a tu lado estos últimos días. Incluso está en tus sueños. Sueños de Constantinopla, de un imperio, de una trinidad de methuselah unida hacia una utopía mayor...\NPuedes sentir cómo erosiona lentamente tu fuerza de voluntad y te hace recordar cosas que ni siquiera deberías saber. Dentro de poco, ya no serás la misma persona, y ésta podría ser tu última oportunidad de mantener tu cordura intacta..." 
 podregionalpersons.28.a:0 "El sueño es mi realidad"
 podregionalpersons.28.b:0 "¡No soy una marioneta!"
 podregionalpersons.29.t:0 "Padre Craneo"
 podregionalpersons.29.desc:0 "Mientras la mortal Reconquista sigue haciendo estragos en Iberia, se le ha presentado una oportunidad. Durante una batalla, un soldado llamado Roderigo ha sido visto mostrando un comportamiento extraño y poderes más extraños. Se rumorea que es uno de los legendarios Magos, los maestros de la flexión de la realidad. Probablemente sea un joven, o sus agentes no habrían podido traerlo a su corte para una audiencia.\NEl hombre tranquilo no parece inmutarse ante su asamblea, y parece contentarse con estudiarlos a todos con el rabillo del ojo. ¿Qué va a hacer con él?" 
 podregionalpersons.29.a:0 "Tengo acceso a muchos escritos que podrían interesarle"
 podregionalpersons.29.custom:0 "No volverás a oír hablar de esta historia"
 podregionalpersons.29.b:0 "Engáñalo para que se una a tu servicio"
 podregionalpersons.29.effect.success.desc:0 "Roderigo se queda en tu corte por ahora"
 podregionalpersons.29.critical.failure.effect.desc:0 "Roderigo abandona tu corte"
 podregionalpersons.29.critical.failure:0 "Roderigo se fue..."
 podregionalpersons.29.c:0 "No me sirve de nada"
 podregionalpersons.30.t:0 "Padre Craneo II"
 podregionalpersons.30.desc:0 "Roderigo se ha adaptado bien a tu corte, y está disfrutando aprendiendo más sobre la muerte de ti y de otros vampiros. Su fascinación por el más allá parece no conocer límites y, aunque aprendes mucho conversando con él, debes admitir que está empezando a preocuparte.Podrías cortar la investigación de Roderigo abrazándolo y poniéndolo más cerca de tu influencia o simplemente esperar y ver." 
 podregionalpersons.30.a:0 "Aprendamos más juntos"
 podregionalpersons.30.b:0 "Es el momento de unirse a nosotros"
 podregionalpersons.31.t:0 "Padre Craneo"
 podregionalpersons.31.desc:0 "Roderigo ha aceptado obedientemente su decisión de detener su investigación y abrazarlo potencialmente. Como siempre, guarda un inquietante silencio sobre sus sentimientos al respecto y no sabes si lo considera un castigo o una recompensa.\N-Sin importar la verdad, ahora está disponible en tu corte para cualquier tarea o futuro que elijas." 
 podregionalpersons.31.a:0 "Un nuevo destino le espera"
 podregionalpersons.32.t:0 "Padre Craneo III"
 podregionalpersons.32.desc:0 "Tu mago invitado ha descubierto verdades vertiginosas sobre la muerte y el más allá, algunas cosas que ni siquiera te atreverías a considerar antes de su llegada a tu corte.\NSigue tranquilo con esos asuntos, y te informa claramente de que, si sigues dándole patrocinio, hay mucho más al alcance de la mano. Pero tiene la sensación de que está yendo demasiado lejos y demasiado rápido..." 
 podregionalpersons.32.a:0 "¡La verdad está tan cerca!"
 podregionalpersons.32.b:0 "Detengámonos aquí"
 podregionalpersons.33.t:0 "Padre Craneo IV"
 podregionalpersons.33.desc:0 "Estas noches, apenas está ya presente en su corte, prefiriendo conversar con Roderigo sobre sus fascinantes conocimientos sobre la muerte y el inframundo. El mago parece incluso estar cerca de abrir un portal a la propia Enoch, ¡la legendaria ciudad de los Progenitores! ¿Qué maravillas hay allí listas para que las reclames? No puedes esperar a continuar este fascinante viaje, pero un sentimiento persistente te retiene. Es como si miraras directamente al abismo..." 
 podregionalpersons.33.a:0 "¿Qué hay más allá?"
 podregionalpersons.35.critical.failure.effect.desc:0 "Todavía están compitiendo contigo"
 podregionalpersons.33.b:0 "¡Debo detener esta locura ahora mismo!"
 podregionalpersons.33.custom:0 "Última oportunidad de volver atrás..."
 podregionalpersons.34.t:0 "Padre Craneo V"
 podregionalpersons.34.desc:0 "¡Viste a Enoc! Viste la maravillosa ciudad, el Trono Negro de Caine... ¡todo! Roderigo se ha ido, pero ya no es necesario, pues ahora las cosas están mucho más claras para ti. Estás por encima de las mezquinas preocupaciones de otros vampiros, pues conoces la verdad. Aunque no puedas recordarla la mayoría de las veces... Bueno, no importa, ¡has visto a Enoch!... ¿o era Irad? Todo está tan borroso..." 
 podregionalpersons.34.a:0 "Estoy tan por encima de la política mezquina ahora"
 podregionalpersons.35.t:0 "El sabueso"
 podregionalpersons.35.desc:0 "Mientras Inglaterra sigue librando su aparentemente eterna guerra contra Francia, te enteras de una oportunidad que se presenta en este conflicto. Un mortal llamado Edmund FitzHenry es aparentemente más de lo que parece. Aparentemente un bastardo de una casa noble menor, parece que el joven Edmund sabe mucho más acerca de lo sobrenatural que la mayoría de los mortales.\NEste hecho podría explicar sus recientes victorias en los campos de batalla de Francia. Quizá quieras investigar más, pero otros vampiros ya están tras su pista". 
 podregionalpersons.35.a:0 "Los convenceré de que es mi presa"
 podregionalpersons.35.custom:0 "No volverán a oír hablar de esta historia"
 podregionalpersons.35.b:0 "Envíalos a una pista falsa"
 podregionalpersons.35.effect.success.desc:0 "Los echan de su objetivo"
 podregionalpersons.36.critical.failure.effect.desc:0 "Los hombres lobo no tienen miedo"
 podregionalpersons.35.c:0 "No me sirve este mortal"
 podregionalpersons.37.t:0 "El sabueso: desviado"
 podregionalpersons.37.desc:0 "Tus rivales siguen pisando los talones de Edmund y te están dificultando la investigación. Hasta ahora has intentado ser sutil al respecto, pero puede que haya llegado el momento de recurrir a acciones más drásticas si todavía quieres continuar con esta búsqueda." 
 podregionalpersons.37.a:0 "Todo el mundo tiene un precio"
 podregionalpersons.37.b:0 "Lanza la Inquisición tras su pista. Eso los mantendrá ocupados".
 podregionalpersons.37.c:0 "Esto no vale la pena"
 podregionalpersons.36.t:0 "El sabueso II"
 podregionalpersons.36.desc:0 "Empiezas a entender más de la historia de este Edmund FitzHenry. En realidad es lo que los lupinos llaman un "Kinfolk", lo que aparentemente significa un miembro de la familia extendida de estas bestias salvajes. Eso explicaría su gran fuerza y su asombroso conocimiento de lo sobrenatural.\NIncluso lo más interesante es que está huyendo de ellos por alguna razón, lo que podría significar que agradecería tu ayuda. Lamentablemente, esto también significa que estos hombres lobo se están acercando a él y no se tomarán bien tu interferencia..." 
 podregionalpersons.36.a:0 "Estas bestias respetan la fuerza. Golpeemos algunos de sus cráneos".
 podregionalpersons.36.b:0 "¡Preparen una emboscada!"
 podregionalpersons.36.effect.success.desc:0 "Los lobos son devueltos a sus bosques"
 podregionalpersons.36.c:0 "Se está volviendo demasiado peligroso. Me rindo".
 podregionalpersons.38.t:0 "El sabueso: desviado"
 podregionalpersons.38.desc:0 "No has conseguido librarte de los hombres lobo que buscan a Edmund. Y ahora, es evidente que también están tras tu pista. Antes de que puedas continuar con tu cacería, primero debes lidiar con ellos para siempre.\N¿Tratarás de desviarlos tú mismo, o simplemente dejarás que gasten su ira en tus posesiones?" 
 podregionalpersons.38.a:0 "Humo y espejos"
 podregionalpersons.38.b:0 "Unos cuantos mortales menos en mis dominios no son motivo de preocupación"
 podregionalpersons.38.c:0 "Esto no vale la pena"
 podregionalpersons.39.t:0 "El sabueso III"
 podregionalpersons.39.desc:0 "Por fin has conseguido localizar a este Edmund FitzHenry en un tenebroso campo de batalla francés. El hombre estaba a la altura de su reputación, siendo un astuto comandante y un sólido luchador, claramente reforzado por la sangre del Lupino en sus venas.\NPero la mortalidad no espera a ningún hombre y por eso te has acercado a él con una oferta de protección de sus cazadores de hombres lobo y una oferta aún más tentadora de inmortalidad. Edmund está, obviamente, interesado y se ha unido a tu corte.\NSólo te pide que le llames por su nombre de nacimiento, ahora que ya no tiene que ocultar su linaje." 
 podregionalpersons.39.a:0 "Bienvenido a la noche, 'Talley'"
 podregionalpersons.41.t:0 "Tormenta del Este"
 podregionalpersons.41.desc:0 "La línea de sangre Gangrel conocida como Anda ha disfrutado de un largo periodo de prosperidad desde el ascenso de sus homólogos mortales, los mongoles, como amos de China. Han utilizado esta conexión para asumir el control de varias ciudades clave del Imperio Celestial, matando o desalojando a los Wan Kuei nativos.\NPero este tiempo ha llegado a su fin, ya que la dinastía Yuan yace destrozada por el ascenso de los Ming, los Wan Kuei están de vuelta, unificados bajo una nueva estructura, el 'Quincunx'. Ya han purgado la línea de sangre Anda de su tierra natal y de la mayor parte de las estepas orientales y ahora están mirando hacia el oeste. Parece que no se detendrán hasta que el último Anda yazca en el suelo, sufriendo una muerte lenta y dolorosa..." 
 podregionalpersons.41.a:0 "Ha llegado un ajuste de cuentas"
 podregionalpersons.41.player_warningb:0 "Un poderoso ejército de Wan Kuei aparecerá pronto en Orgoo"
 first_quincunxwarlord_event_troops:0 "Vanguardia de Quincunx"
                 
        
                   
           
               
      
     
  
  
