l_spanish:

 pod_masquerade.1.t:0 "La curiosidad mató al Cazador"
 pod_masquerade.1.desc:0 "Uno de esos malditos bienhechores de ese grupo llamado los Cazadores está husmeando en tus dominios. Ha estado haciendo preguntas sobre tu agenda, influencia en la población y otros temas peliagudos. Si no haces nada, informará a sus superiores de que algo en ti está mal, muy mal. No te cabe duda de que esto levantará sospechas en torno a tu corte. Por suerte, conoces a un tipo que podría encargarse de esta molestia de forma rápida y discreta, pero sus servicios no son precisamente baratos..."
 pod_masquerade.1.a:0 "¿Dinero por tranquilidad? Fácil elección"
 pod_masquerade.1.b:0 "No me asustan los mortales que saltan"
 pod_masquerade.2.t:0 "¡Necios, por todas partes!"
 pod_masquerade.2.desc:0 "Estás rodeado de idiotas y bufones. Seguramente ya lo sabías, pero ¿qué es un ejemplo más en tu aparentemente interminable lista? Un cazador ha acechado en tus dominios, sin que tu gente se dé cuenta desde hace meses, reuniendo pruebas de tu impía existencia. Debes ocuparte de él ahora, antes de que se escabulla para informar a sus superiores. Y, evidentemente, la fábrica de rumores se encargará de difundir historias sobre tu incompetencia y la de tu consejo si se escapa..."
 pod_masquerade.2.a:0 "Si quieres un trabajo bien hecho..."
 pod_masquerade.2.b:0 "Que huya, que ya no te importa"
 pod_masquerade.3.t:0 "Problemas familiares"
 pod_masquerade.3.desc:0 "Informes problemáticos de uno de sus agentes: Una familia bien relacionada de la ciudad parece tener sospechas sobre tu verdadera naturaleza. No estás muy seguro de lo que ha salido mal, pero ninguna Mascarada es perfecta después de todo. Tienes que elegir entre enfrentarte a la familia de forma definitiva y acabar con esta molestia o simplemente ignorarlos, arriesgándote a que sigan entrometiéndose".
 pod_masquerade.3.a:0 "Un desafortunado accidente seguramente resolverá este problema"
 pod_masquerade.3.b:0 "No son una amenaza"
 pod_masquerade.4.t:0 "La familia es la familia" 
 pod_masquerade.4.desc:0 "Una reunión familiar es algo bastante raro en los círculos cainitas, sobre todo por el hecho de que podría convertirse en una matanza en cualquier momento. Desgraciadamente, has sido elegido como anfitrión de la próxima reunión, lo que significa un montón de Vampiros, y un montón de sospechas atraídas hacia ti. Podrías cancelar el evento, ciertamente todo el mundo lo entendería, pero seguir adelante sería una muestra palpable de confianza por tu parte."
 pod_masquerade.4.a:0 "No lo siento..."
 pod_masquerade.4.b:0 "¡Bienvenidos! Por favor, dejad vuestras armas, especialmente las secretas".
 pod_masquerade.5.t:0 "Una elección rápida" 
 pod_masquerade.5.desc:0 "Mientras retraes tus colmillos y te limpias parte de la sangre de la boca, miras los cadáveres de los Cazadores que intentaron atacarte y te preguntas... ¿Estaban mal informados sobre tu poder? ¿O simplemente se confiaron demasiado? En cualquier caso, ya están muertos. Excepto uno, que está huyendo bastante rápido en realidad. Estás un poco aburrido como para tener ganas de perseguirlo, parece ágil y tú estás por encima de correr por las calles de la ciudad como un loco. Pero si no lo persigues, seguro que llevará la noticia de este pequeño chisme a sus superiores..."
 pod_masquerade.5.a:0 "¿Quizás una buena persecución me haga recordar los buenos tiempos?"
 pod_masquerade.5.b:0 "Bueno, de vuelta a mi sala del trono. Supongo".
 pod_masquerade.6.t:0 "Demasiado bueno para ser verdad" 
 pod_masquerade.6.desc:0 "El patriarca de una influyente familia de tu zona acaba de fallecer. Su legado sigue vivo a través de sus dos hijos y, da la casualidad de que tú tienes un fuerte vínculo con uno de ellos... Si ayudaras a este joven a hacerse cargo del negocio familiar, podrías cosechar los beneficios, pero tu extraño patrocinio ciertamente levantaría algunas cejas."
 pod_masquerade.6.a:0 "Nada más que ratas peleando por migajas"
 pod_masquerade.6.b:0 "Seguiremos con mucho interés la carrera de este joven"
 pod_masquerade.7.t:0 "Un mal romance" 
 pod_masquerade.7.desc:0 "Creías que ya no lo tenías y no sabes cómo ni por qué, pero... este simple campesino te ha cautivado desde hace tiempo. ¿Serán los restos de la lujuria mortal o algo más? No estás seguro, pero esta noche debes tomar una decisión. ¿Presentarás a tu nueva mascota a tu corte a riesgo de romper la Mascarada? ¿O harás lo... correcto?"
 pod_masquerade.7.a:0 "Lo siento amor, no soy yo. Eres tú"
 pod_masquerade.7.b:0 "Bienvenido a mi salón, luz de mi noche"
 pod_masquerade.8.t:0 "Estirando tus músculos" 
 pod_masquerade.8.desc:0 "Los mortales de tu zona están teniendo una de esas guerras tontas que tanto les gustan. ¿Fue por una reivindicación? ¿Religión? Bueno, no importa, ¡esta es una ocasión para que vayas al campo de batalla! ¿Aplastar algunos cráneos y quizás aprender una o dos cosas por el camino? Obviamente, los supervivientes probablemente sospecharán un poco de tus proezas imperecederas..."
 pod_masquerade.8.a:0 "He estado allí, he hecho eso"
 pod_masquerade.8.b:0 "Espera, ¿a quién se supone que voy a matar de nuevo? Oh, bueno".
 pod_masquerade.9.t:0 "Expuesto : Toma de posesión hostil" 
 pod_masquerade.9.desc:0 "Tus negocios en la región han llamado finalmente la atención de la Inquisición de la Sombra. Por suerte, parece que, hasta ahora, sólo intentan socavar tu autoridad apuntando a tus principales activos. Varios de tus agentes han desaparecido, algunos de tus necrófagos han sido sustituidos por miembros honrados del clero... y eso está empezando a hacer mella en tu gobierno.\NPodrías intentar contraatacar, pero la Inquisición también subirá sin duda su juego si lo haces."
 pod_masquerade.9.a:0 "¿Quieren jugar? Jugaremos entonces..."
 pod_masquerade.9.b:0 "Vamos a cortar por lo sano y pasar desapercibidos durante un tiempo"
 pod_masquerade.9.a.effect.success.desc:0 "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
 pod_masquerade.9.a.success:0 "¡De vuelta al negocio!"
 pod_masquerade.9.a.failure.effect.desc:0 "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
 pod_masquerade.9.a.failure:0 "Han ganado esta batalla, pero no la guerra" 
 pod_masquerade.9.a.critical.failure.effect:0 "Si cometen algún error, la Inquisición aplastará su autoridad sobre la región durante mucho tiempo"
 pod_masquerade.9.a.critical.failure:0 "Han ganado por completo..." 
 pod_masquerade.10.t:0 "Desenmascarado : Hombres de fe" 
 pod_masquerade.10.desc:0 "Siempre vigilas a los mortales más fieles de tu zona, ya que pueden ser fácilmente los más peligrosos. Últimamente han aparecido nuevos miembros del clero y parecen... bastante dedicados en su santa labor. Estás bastante seguro de que son una avanzadilla de la odiada Inquisición, que está reuniendo apoyos entre tu población para derrocar tu justo gobierno.\NPodrías atacar ahora para eliminarlos, pero hay un grave riesgo de que esto sea contraproducente. Estos hombres ya tienen un fuerte control espiritual sobre el pueblo..."
 pod_masquerade.10.a:0 "Silenciemos a estos falsos profetas"
 pod_masquerade.10.b:0 "Puedo retirarme de los asuntos mortales por un tiempo"
 pod_masquerade.10.a.effect.success.desc:0 "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
 pod_masquerade.10.a.success:0 "¡Alabado sea!"
 pod_masquerade.10.a.failure.effect.desc:0 "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
 pod_masquerade.10.a.failure:0 "Han ganado esta batalla, pero no la guerra" 
 pod_masquerade.10.a.critical.failure.effect:0 "Si cometen algún error, la Inquisición aplastará su autoridad sobre la región durante mucho tiempo"
 pod_masquerade.10.a.critical.failure:0 "Han ganado por completo..." 
 pod_masquerade.11.t:0 "Expuesto : La batalla" 
 pod_masquerade.11.desc:0 "Un ejército mortal hostil se acerca a tu reino. No es raro de por sí, a los mortales les encantan sus guerras insignificantes después de todo, pero esta parece diferente. Tus agentes dicen haber visto hombres dedicados y un número inusual de clérigos entre sus filas. ¿Podrías ser su verdadero objetivo? Todavía estás a tiempo de reunir a tus tropas y defender tu tierra... o podrías desaparecer por un tiempo y capear el temporal".
 pod_masquerade.11.a:0 "No temo a ningún campo de batalla"
 pod_masquerade.11.b:0 "Es hora de unas rápidas vacaciones"
 pod_masquerade.11.a.effect.success.desc:0 "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
 pod_masquerade.11.a.success:0 "Los has aplastado, obviamente"
 pod_masquerade.11.a.failure.effect.desc:0 "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
 pod_masquerade.11.a.failure:0 "Han ganado esta batalla, pero no la guerra" 
 pod_masquerade.11.a.critical.failure.effect:0 "Si cometen algún error, la Inquisición aplastará su autoridad sobre la región durante mucho tiempo"
 pod_masquerade.11.a.critical.failure:0 "Han ganado por completo..." 
 pod_masquerade.12.t:0 "Desenmascarado : Jugando a las Cortes" 
 pod_masquerade.12.desc:0 "Gobernar se ha vuelto sorprendentemente más difícil últimamente. Los mortales han sacado nuevas leyes y varios cambios que han sido una espina para ti. No pensaste mucho en ello durante mucho tiempo, pero un agente tuyo te informó de que el gobernante mortal local tiene un nuevo consejero, y éste parece saber mucho sobre ti.\NDesplazar violentamente a este hombre no sería prudente, ya que es una figura muy conocida de la política mortal, pero... podrías desacreditarlo, o superarlo en su propio juego de influencia. O podrías pasar desapercibido durante un tiempo, los mortales serán mortales después de todo".
 pod_masquerade.12.a:0 "Me encantan los buenos retos"
 pod_masquerade.12.b:0 "No puede hacer mucho si me mantengo oculto durante un tiempo"
 pod_masquerade.12.a.effect.success.desc:0 "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
 pod_masquerade.12.a.success:0 "¡Victoria total!"
 pod_masquerade.12.a.failure.effect.desc:0 "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
 pod_masquerade.12.a.failure:0 "Han ganado esta batalla, pero no la guerra" 
 pod_masquerade.12.a.critical.failure.effect:0 "Si cometen algún error, la Inquisición aplastará su autoridad sobre la región durante mucho tiempo"
 pod_masquerade.12.a.critical.failure:0 "Han ganado por completo..." 
 pod_masquerade.13.t:0 "Exposed : Holy Whispers" 
 pod_masquerade.13.desc:0 "Cuando te enteraste de que la Inquisición estaba planeando un movimiento contra ti, esperabas truenos y furia. En lugar de eso, obtuviste capas y puñales. Tus agentes están desapareciendo, tus contactos de confianza se convierten en traidores y abundan los rumores sobre tu reputación, falsa o no. O podrías dejarlo pasar, pronto se cansarán de este juego, o mejor aún, se marchitarán y morirán por sí mismos como hacen los mortales".
 pod_masquerade.13.a:0 "Es un reto intrigante que hay que superar"
 pod_masquerade.13.b:0 "Bueno, nada de tramas por un tiempo"
 pod_masquerade.13.a.effect.success.desc:0 "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
 pod_masquerade.13.a.success:0 "¡Victoria total!"
 pod_masquerade.13.a.failure.effect.desc:0 "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
 pod_masquerade.13.a.failure:0 "Han ganado esta batalla, pero no la guerra" 
 pod_masquerade.13.a.critical.failure.effect:0 "Si cometen algún error, la Inquisición aplastará su autoridad sobre la región durante mucho tiempo"
 pod_masquerade.13.a.critical.failure:0 "Han ganado por completo..." 
 pod_masquerade.14.t:0 "Expuesto : Furia Sagrada" 
 pod_masquerade.14.desc:0 "A juzgar por los gritos que salen de detrás de la puerta sellada de tu sala del trono, tu última línea de defensa se está desmoronando. Se acabaron las conspiraciones, los escondites y los juegos sutiles, la Inquisición ha venido a por ti con toda su justa furia.\NComo todo el edificio está empezando a arder en llamas, te tranquilizas, sólo son mortales salteados. Seguro que puedes enfrentarte a ellos tú solo... O puedes usar el pasaje oculto detrás de tu trono para escapar y luchar otro día. Se acabaron los gritos y el sonido de las armas golpeando la puerta. Es ahora o nunca".
 pod_masquerade.14.a:0 "¡Por fin! Dignos oponentes!"
 pod_masquerade.14.b:0 "Así que... vamos a abrir este pasaje secreto de aquí..."
 pod_masquerade.14.a.effect.success.desc:0 "Masacrar a la Inquisición detendrá su operación contra ti, por ahora" 
 pod_masquerade.14.a.success:0 "No es tan poderoso ahora"
 pod_masquerade.14.a.failure.effect.desc:0 "Conseguir salir luchando te salvará a un gran coste"
 pod_masquerade.14.a.failure:0 "Han ganado esta batalla, pero no la guerra" 
 pod_masquerade.14.a.critical.failure.effect:0 "Si cometes algún error, la Inquisición te convertirá en cenizas"
 pod_masquerade.14.a.critical.failure:0 "...bien luchado" 
  
     
    
   
   
  
 
