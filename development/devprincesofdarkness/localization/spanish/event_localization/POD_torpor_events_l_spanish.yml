l_spanish:

 POD_vampire_torpor_events.001.title:0 "Sueño profundo"
 POD_vampire_torpor_events.001.desc:0 "Tus heridas te debilitaron, ahora sientes una extraña llamada dentro de ti, llamada que te obliga a entrar en el torpor, un sueño profundo que puede durar miles de años."
 
 POD_vampire_torpor_events.001.resist:0 "¡Resistiré!"
 POD_vampire_torpor_events.001.resist:0 "Intentarás resistirte a entrar en torpor. Tus heridas y tu nivel de hambre influirán en esta decisión."
 POD_vampire_torpor_events.001.surrender:0 "No me resistiré..."
 POD_vampire_torpor_events.001.surrender:0 "Entrarás en torpor voluntariamente. Esto te obligará a abdicar".
 POD_vampire_torpor_events.101.title:0 "Sueño eterno"
 POD_vampire_torpor_events.101.desc:0 "No te queda poder para continuar tu vida sin vida con semejantes heridas, es hora de descansar. Sólo esperas que no te pase nada mientras estás en el letargo".
 POD_vampire_torpor_events.101.defeat:0 "El sueño eterno te espera".
 POD_vampire_torpor_events.101.defeat.sleep:0 "Entrarás en torpor, abdicando en tu heredero"
 POD_vampire_torpor_events.201.title:0 "Resistiendo al torpor"
 POD_vampire_torpor_events.201.desc:0 "Has resistido. Esta extraña sensación de debilidad ha desaparecido y aún te quedan cosas por hacer antes de descansar."
 POD_vampire_torpor_events.201.success:0 "Mi trabajo aquí aún no ha terminado".
 POD_vampire_torpor_events.201.success:0 "Todavía no entrarás en el letargo".
 
 POD_vampire_torpor_events.002.title:0 "Vida eterna"
 POD_vampire_torpor_events.002.desc:0 "Tu no-vida ha durado muchos cientos de años, empiezas a sentirte aburrido de esta época, ¿tal vez sea hora de descansar? La no-vida vampírica es un sufrimiento largo y prolongado en el que los amigos van y vienen y los mortales cambian tan rápido que te resultan rápidamente extraños.\NQuizás la próxima era sea mejor... pero probablemente no."
 
 POD_vampire_torpor_events.002.resist:0 "Todavía tengo cosas que hacer".
 POD_vampire_torpor_events.002.resist.nosleep:0 "No estás preparado para descansar".
 POD_vampire_torpor_events.002.rest:0 "Creo que es hora de descansar".
 POD_vampire_torpor_events.002.rest.sleep:0 "Entrarás en torpor voluntariamente. Esto te obligará a abdicar".
 POD_vampire_torpor_events.102.title:0 "No hay tiempo para descansar"
 POD_vampire_torpor_events.102.desc:0 "Todavía no estás preparado para entrar en el letargo, muchos mortales aún requieren tu atención precisa, y tus enemigos deben temblar de miedo durante un poco más de tiempo."
 POD_vampire_torpor_events.102.resist:0 "Todavía tengo asuntos que atender".
 POD_vampire_torpor_events.102.resist.nosleep:0 "No entrarás en torpor... todavía".
 POD_vampire_torpor_events.202.desc:0 "Has estado despierto durante mucho tiempo... Es hora de descansar, los enemigos pueden esperar. Quizá la próxima era sea la prometida edad de oro... o la temida Gehenna. Pero ya eres lo suficientemente mayor como para saber que probablemente será otra era aburrida y prolongada en la que los mortales estropearán las cosas..."
 POD_vampire_torpor_events.202.title:0 "Sueño eterno"
 POD_vampire_torpor_events.202.accept:0 "El torpor espera"
 POD_vampire_torpor_events.202.accept.sleep:0 "Entrarás en el torpor voluntariamente".
 
 POD_vampire_torpor_events.003.title:0 "Despierto"
 POD_vampire_torpor_events.003.desc:0 "Llevas un tiempo en torpor. ¿No es el momento de volver a tu no-vida?"
 POD_vampire_torpor_events.003.awake:0 "Es hora de volver".
 POD_vampire_torpor_events.003.awake.torpor:0 "Despertarás del letargo, y tus enemigos deberían tener miedo".
 POD_vampire_torpor_events.003.sleep:0 "Todavía no estoy preparado".
 POD_vampire_torpor_events.003.sleep.nowake:0 "Permanecerás en el letargo durante algún tiempo".
 POD_vampire_torpor_events.103.title:0 "Sueño eterno"
 POD_vampire_torpor_events.103.desc:0 "Todavía no estás preparado para volver".
 POD_vampire_torpor_events.103.sleep:0 "Dulces sueños".
 POD_vampire_torpor_events.103.sleep.continue:0 "Vas a seguir durmiendo".
 POD_vampire_torpor_events.203.title:0 "De vuelta a la no-vida"
 POD_vampire_torpor_events.203.desc:0 "Por fin estás listo para volver, tus enemigos deberían temblar"
 POD_vampire_torpor_events.203.awake:0 "He vuelto"
 POD_vampire_torpor_events.203.awake.torpor:0 "Vuelves al mundo de la oscuridad"