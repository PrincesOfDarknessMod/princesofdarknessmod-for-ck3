l_spanish:
 POD_heart_of_darkness.001.t:0 "Corazón de las tinieblas"
POD_corazón_de_la_oscuridad.001.desc:0 "Es hora de alejarse aún más de la humanidad. Todo está preparado para un ritual oscuro que te permitirá extirpar tu propio corazón, convirtiéndote en dueño de tu propio destino, y tu Bestia tendrá menos influencia sobre ti. Pero, ¿tienes el valor suficiente para continuar?"
 POD_heart_of_darkness.001.desc:0 "Es hora de alejarse aún más de la humanidad. Todo está listo para un ritual oscuro que te permitirá eliminar tu propio corazón, convirtiéndote en dueño de tu propio destino, con tu Bestia teniendo menos influencia sobre ti. Pero, ¿tienes el coraje suficiente para continuar?"
 POD_heart_of_darkness.001.option.a:0 "El tiempo ha llegado"
 POD_heart_of_darkness.001.option.a.tt:0 "quitarás tu corazón"
 POD_heart_of_darkness.001.option.a.tt.beast:0 "#R ¡Un gran error!#!"
POD_corazón_de_la_oscuridad.001.opción.a:0 "Ha llegado el momento"
POD_corazón_de_la_oscuridad.001.option.a.tt:0 "Te quitarás el corazón"
 POD_heart_of_darkness.001.option.b.tt.beast:0 "#R ¡Así es! ¡No puedes sobrevivir sin mí!#!"
POD_corazón_de_la_oscuridad.001.option.a.tt:0 "¡Una gran equivocación!"
POD_heart_of_darkness.001.option.b:0 "No estoy preparado"
POD_heart_of_darkness.001.option.b.tt:0 "Abandonas tu intento de someterte a un ritual"
 POD_heart_of_darkness.002.option.a:0 "¡Las emociones no tienen control sobre mí!"
 POD_heart_of_darkness.002.option.a.tt:0 "Quitaste tu corazón con éxito, pero siempre puedes devolverlo a tu cofre"
POD_heart_of_darkness.001.option.b.tt:0 "#R ¡Eso es! No puedes sobrevivir sin mí!!!"
 POD_heart_of_darkness.003.t:0 "Robando Corazones"
 POD_heart_of_darkness.003.desc:0 "Ha llegado el momento, estás listo para realizar tu ritual oscuro en [heart_victim.GetFirstName]. ¡[heart_victim.GetSheHe] ni siquiera sabrá lo que pasó hasta que sea demasiado tarde y tú tengas el corazón de [heart_victim.GetHerHis]! Ahora, lo único que queda es poner en marcha tu oscuro plan."
 POD_heart_of_darkness.003.option.a:0 "[heart_victim.GetHerHis|U] ¡el corazón será mío!"

 POD_heart_of_darkness.003.option.a.tt.beast:0 "#R ¡Seremos dueños de [heart_victim.GetHerHim]!#!"
POD_heart_of_darkness.002.t:0 "Sin corazón"
POD_heart_of_darkness.002.desc:0 "Por fin está hecho, el ritual está completo. Sientes que tus emociones se vuelven más apagadas, lo que facilita la supervivencia. La desventaja es que te resulta más difícil entender a la gente y ahora tus enemigos podrían encontrar tu corazón y destruirlo. Pero el mayor beneficio tiene que ver con la Bestia, ahora es más tranquila, más fácil de vencer".
 POD_heart_of_darkness.003.option.a.failure:0 "No logras robar el corazón."
 POD_heart_of_darkness.003.option.a.tt.attacker_wins:0 "Eres dueño del corazón de [heart_victim.GetFirstName]"
POD_corazón_de_la_oscuridad.002.opción.a:0 "¡Las emociones no me controlan!"
POD_corazón_de_la_oscuridad.002.option.a.tt:0 "Te has quitado el corazón con éxito, pero siempre puedes devolverlo a tu pecho"
 POD_heart_of_darkness.003.option.b.tt:0 "Abandonas tu plan de robar el corazón de [heart_victim.GetFirstName]."

POD_corazón_de_la_oscuridad.003.t:0 "Robo de corazones"
POD_corazón_de_la_oscuridad.003.desc:0 "Ha llegado el momento, estás listo para realizar tu ritual oscuro en [víctima_del_corazón.GetFirstName]. [heart_victim.GetSheHe] ni siquiera sabrá lo que ha sucedido hasta que sea demasiado tarde y poseas el corazón de [heart_victim.GetHerHis]. Ahora, lo único que queda es poner en marcha tu oscuro plan".
 POD_heart_of_darkness.004.desc:0 "¡Tu oscuro ritual tuvo éxito! [heart_victim.GetFirstName] vio impotente cómo tomabas el corazón de [heart_victim.GetHerHis], sin poder detener el ritual. Y ahora solo puede esperar que no decidas acabar con [heart_victim.GetHerHis] no-vida. Te vas a casa con una nueva pieza en tu colección oscura."
 POD_heart_of_darkness.004.option.a:0 "Tu vida está en mis manos ahora."
 POD_heart_of_darkness.004.option.a.tt:0 "Logró robar el corazón de [heart_victim.GetFirstName]."
POD_corazón_de_la_oscuridad.003.opción.a:0 "[corazón_víctima.GetHerHis|U] ¡el corazón será mío!"
POD_heart_of_darkness.003.option.a.tt:0 "Intentas robar el corazón de [heart_victim.GetFirstName]"
 POD_heart_of_darkness.005.desc:0 "[heart_victim.GetFirstName] ve a través de tu esquema y te evade. El ritual no ha terminado y pocas cosas se pueden comparar con la ira de [heart_victim.GetFirstName]. Apenas logras escapar con vida, temes lo que [heart_victim.GetFirstName] podría emprender para vengarse de ti."
 POD_heart_of_darkness.005.option.a:0 "¡Es hora de correr!"
POD_corazón_de_la_oscuridad.003.option.a.tt.beast:0 "#R ¡Vamos a poseer [corazón_víctima.GetHerHim]!#!"
POD_heart_of_darkness.003.option.a.desc:0 "El plan se pone en marcha".
POD_heart_of_darkness.003.option.a.success:0 "Robas el corazón con éxito".
POD_corazón_de_la_oscuridad.003.opción.a.fracaso:0 "Fracasas en el robo del corazón".
POD_corazón_de_la_oscuridad.003.opción.a.tt.atacante_gana:0 "Eres el dueño del corazón de [corazón_víctima.ObtenerNombre]"
POD_heart_of_darkness.003.option.a.tt.defender_wins:0 "Fracasas estrepitosamente y ahora tienes que lidiar con las consecuencias."
POD_heart_of_darkness.003.option.b:0 "Todavía no es el momento..."
POD_corazón_de_la_oscuridad.003.option.b.tt:0 "Abandonas tu plan para robar el corazón de [corazón_víctima.GetFirstName]".
POD_heart_of_darkness.003.option.b.tt.beast:0 "#R ¡Me decepcionas!"

POD_heart_of_darkness.004.t:0 "Corazón conquistado"
POD_corazón_de_la_oscuridad.004.desc:0 "¡Tu ritual oscuro ha tenido éxito! [corazón_víctima.GetFirstName] vio impotente cómo te llevabas el corazón de [corazón_víctima.GetHerHis], sin poder detener el ritual. Y ahora sólo puede esperar que no decidas acabar con la vida de [heart_victim.GetHerHis]. Te vas a casa con una nueva pieza en tu oscura colección".
POD_corazón_de_la_oscuridad.004.opción.a:0 "Tu vida está ahora en mis manos".
POD_corazón_de_la_oscuridad.004.option.a.tt:0 "Has conseguido robar el corazón de [corazón_víctima.GetFirstName]".

POD_heart_of_darkness.005.t:0 "Corazón no conquistado"
POD_corazón_de_la_oscuridad.005.desc:0 "[víctima_del_corazón.GetFirstName] ve a través de tu plan y te evade. El ritual no ha terminado y pocas cosas pueden compararse con la ira de [heart_victim.GetFirstName]. Escapando a duras penas con tu vida, temes lo que [corazón_víctima.GetFirstName] pueda emprender para vengarse de ti".
POD_corazón_de_la_oscuridad.005.opción.a:0 "¡Es hora de huir!"
POD_heart_of_darkness.005.option.a.tt:0 "Tu plan no ha tenido éxito".
