l_spanish:

POD_imprison.002.title:0 "Encarcelamiento: [targetdefender.GetFirstName]"
POD_imprison.002.desc:0 "Estás intentando encarcelar a [targetdefender.GetFirstName], pero se atreve a resistirse, ¿qué debes hacer?"
POD_imprison.002.desc.hunter:0 "Estás intentando encarcelar a un engendro del diablo, [targetdefender.GetFirstName], pero las sanguijuelas no se dejan atrapar por los siervos de Dios. ¿Qué deberías hacer?"


POD_imprison.002.option.a:0 "[targetdefender.GetFirstName] ¡me obedecerá!"
POD_imprison.002.option.b:0 "[targetdefender.GetFirstName] no puede resistirse a mi encanto".
POD_imprison.002.option.c:0 "¡Destruiré a [targetdefender.GetHerHim]!"
POD_imprison.002.option.d:0 "[attacker_marshal.GetFirstName] pondrá a [targetdefender.GetHerHim] en [targetdefender.GetHerHis] lugar!"
POD_imprison.002.option.e:0 "[attacker_marshal.GetFirstName] seguramente sabe cómo atrapar a esos desalmados!"
POD_imprison.002.option.f:0 "No es el momento adecuado"
POD_imprison.002.option.success:0 "[atacante.GetFirstName] gana"


POD_imprison.002.option.a.desc:0 "Un conflicto de dominio"
POD_imprison.002.option.b.desc:0 "Un conflicto de personalidad"
POD_imprison.002.option.c.desc:0 "Un conflicto de proezas"
POD_imprison.002.option.d.desc:0 "Una batalla de proezas, tu mariscal te representa"
POD_imprison.002.option.d.success:0 "[attacker_marshal.GetFirstName] gana"
POD_imprison.002.option.e.desc:0 "La habilidad de guerra de tu mariscal contra la destreza del leeche"
POD_imprison.002.option.e.success:0 "[mariscal_atacante.GetFirstName] atrapa a un vil demonio"
POD_imprison.002.option.failure:0 "[targetdefender.GetFirstName] gana"
POD_imprison.002.option.e.failure:0 "[targetdefender.GetFirstName] consigue escapar"

POD_imprison.002.option.a.tt.attacker_wins:0 "¡Domino a [targetdefender.GetFirstName]!"
POD_imprison.002.option.a.tt.attacker_lost:0 "La voluntad de [targetdefender.GetFirstName] es demasiado fuerte para dominarla."
POD_imprison.002.option.b.tt.attacker_wins:0 "¡Entro [targetdefender.GetFirstName]!"
POD_imprison.002.option.b.tt.attacker_lost:0 "[targetdefender.GetFirstName] es inmune a mis encantos." 
POD_imprison.002.option.c.tt.attacker_wins:0 "¡Derroto a [targetdefender.GetFirstName] en combate personal!"
POD_imprison.002.option.c.tt.attacker_lost:0 "Soy derrotado por [targetdefender.GetFirstName] en combate personal."
POD_imprison.002.option.d.tt.attacker_wins:0 "[attacker_marshal.GetFirstName] derrota a [targetdefender.GetFirstName] en combate personal."
POD_imprison.002.option.d.tt.attacker_lost:0 "[attacker_marshal.GetFirstName] es derrotado por [targetdefender.GetFirstName] en combate personal."
POD_imprison.002.option.e.tt.attacker_wins:0 "[targetdefender.GetFirstName] se pudrirá en su prisión."
POD_imprison.002.option.e.tt.attacker_lost:0 "[targetdefender.GetFirstName] se escapa"
POD_imprison.002.option.f.tt:0 "Dejarás de intentar encarcelar a [targetdefender.GetFirstName]".

POD_imprison.102.title:0 "Nuevo prisionero"
POD_imprison.102.desc.dominate:0 "Has conseguido doblegar con éxito la mente de [targetdefender.GetFirstName] a tu voluntad, ahora [targetdefender.GetSheHe] entrará en tu prisión sin objeciones"
POD_imprison.102.desc.presence:0 "Has conseguido que [targetdefender.GetFirstName] quiera entrar en la nueva celda de la prisión de [targetdefender.GetHerHis] sólo para complacerte."
POD_imprison.102.desc.prowess:0 "Has ganado. [targetdefender.GetFirstName] ya no puede resistirse a ti. Esto debería enseñar a todo el mundo lo que les ocurre a los que se oponen a ti".
POD_imprison.102.desc.marshal:0 "[mariscal_atacante.GetFirstName] ha derrotado a [targetdefender.GetFirstName]. Esto enseñará a todos a oponerse a tu autoridad. "
POD_imprison.102.desc.hunter:0 "[attacker_marshal.GetFirstName] ha conseguido utilizar las debilidades del vampiro para atrapar a una bestia impía, [targetdefender.GetFirstName]. Esto enseñará a todos los engendros del infierno a no oponerse a ti. "
POD_imprison.102.option.a:0 "¿Y ahora qué hago contigo?"

POD_imprison.202.title:0 "Perdiendo la lucha"
POD_imprison.202.desc:0 "El combate está perdido, tu objetivo ha huido de ti. Quizá debas volver a intentarlo cuando llegue el momento adecuado"
POD_imprison.202.desc.hunter:0 "[atacante_mariscal.GetFirstName] ha fallado. ¡Su plan des ha funcionado y ahora este diablo encarnado, [targetdefender.GetFirstName], ha escapado! ¿Quizás debería intentarlo de nuevo cuando llegue el momento adecuado?"
POD_imprison.202.option.a:0 "Esto es simplemente un contratiempo"

POD.imprison.302.title:0 "Por pura voluntad"
POD_imprison.302.desc.dominate:0 "Tu intento de dominar a [targetdefender.GetFirstName] hasta la sumisión ha fracasado. Puedes intentar apoderarte de [targetdefender.GetHerHim] por la fuerza bruta".
POD_imprison.302.desc.presence:0 "[targetdefender.GetFirstName] ha resistido tu encanto. Puedes intentar apoderarte de [targetdefender.GetHerHim] por fuerza bruta".
POD_imprison.302.option.a:0 "[targetdefender.GetFirstName] no escapará."
POD_imprison.302.option.b:0 "He fallado..."
POD_imprison.302.option.b.tt:0 "Fallarás tu intento de encarcelamiento. [targetdefender.GetFirstName] obtendrá un gancho débil sobre ti".
