 stress_threshold.3311.t:0 "Descanso mental: la bestia gana"
umbral_de_estrés.3311.desc:0 "Tras siglos de lucha, la bestia finalmente se apodera de ti. Intentaste seguir un camino, aferrarte a ideas elevadas para controlarte, para repeler al monstruo que llevas dentro.\NFracasaste.\NCon tu adherencia a tu camino menguando y tu fuerza de voluntad desaparecida, ya nada detiene a la bestia. #R Nunca pudiste mantenerme a raya. ¡ERES MÍA!"
 stress_threshold.3311.desc_instinct:0 "Tras siglos de lucha, la bestia finalmente te ahoga. Intentaste seguir un camino, perseguir ideas ambiciosas para controlar al monstruo que llevas dentro, de aprovechar su poder conservando tu personalidad.\NFracasaste.\NCon tu adherencia al camino menguando y tu fuerza de voluntad desaparecida, la ola de frenesí te ahoga para siempre. #¿Utilizarme? ¿Arrestarme? Debilucho, te mostraré mi poder. 
 stress_threshold.3311.a:0 "Estoy perdido".
 stress_threshold.3311.desc:0 "Después de siglos de lucha, la bestia finalmente se hace cargo. Intentaste seguir un camino, aferrarte a ideas elevadas de controlarte a ti mismo, de repeler al monstruo que hay dentro de ti.\nFracasaste.\nCon tu adherencia a tu camino menguando y tu fuerza de voluntad desaparecida, ya nada detiene a la bestia. #R Nunca podrías mantenerme a raya. ¡ERES MÍO!#!"
 stress_threshold.3311.desc_instinct:0 "Después de siglos de luchar contra ella, la bestia finalmente te ahoga. Intentaste seguir un camino, perseguir ideas ambiciosas para controlar el monstruo que llevas dentro, aprovechar su poder y conservar tu personalidad.\nFracasaste.\nCon tu adhesión al camino cada vez menor y tu fuerza de voluntad desaparecida, la ola de frenesí te ahoga. para siempre. ¿#R UTILIZARME? ¿ARNÉSAME? Debilucho, te mostraré mi poder.#!"
 
 stress_threshold.3321.t:0 "Ruptura mental: Alma de Sombra"
 stress_threshold.3321.desc:0 "De todos los estados de alma, el alma de sombra es el más temido. Durante el alma de sombra, el Demonio del personaje busca establecer su dominio. Cuando un personaje entra en alma de sombra, libra una guerra interior contra los impulsos e insinuaciones del P'o.\NSi el Huno pierde esta guerra, retrocede hasta la sumisión, y la Naturaleza del P'o toma el control durante un tiempo - posiblemente haciendo que el personaje cometa actos que su yo superior encontraría aborrecibles. Un fracaso prolongado en la resistencia al P'o puede hacer que un personaje se aleje de su Dharma y se una a las filas de los chih-mei, o algo peor".
 stress_threshold.3321.a:0 "Estoy perdido".
 
 stress_threshold.3322.t:0 "Ruptura mental: P'o Despertar"
 stress_threshold.3322.desc:0 "Si un Shih se pierde cada vez más en la violencia, su naturaleza sobrenatural puede despertar su alma P'o, de forma similar a la de un Kuei-jin, sin los beneficios. Los Shih que mueren cuando han despertado su P'o vuelven normalmente como Kuei-jin".
 umbral_de_estrés.3322.a:0 "Estoy perdido".
 stress_threshold.3322.a:0 "Estoy perdido."
 
 #Evento de nivel de estrés 2 de KJ
 
 stress_threshold.2361.t:0 "Ruptura mental: Alma de Fuego"
 stress_threshold.2361.desc:0 "El alma de fuego es una locura, pura y dura. Los Kuei-jin en estado de alma de fuego son monstruos salvajes, consumidos por la rabia. Los Kin-jin ignorantes se refieren a esta fase como "frenesí", y hay poca diferencia entre ambos estados."
 stress_threshold.2361.a:0 "Sucumbe a tu rabia."
 umbral_de_estrés.2361.a:0 "Sucumbe a tu rabia".
 stress_threshold.2361.b:0 "Resiste con todo tu Yin Chi".
 stress_threshold.2361.fight.failed:0 "Has fallado".
 
 stress_threshold.2371.t:0 "Ruptura mental: Alma de la onda"
 stress_threshold.2371.desc:0 "Kuei-jin que sufre el debilitante alma de onda pierde completamente el control ante los impulsos de terror. Este estado (llamado así porque los Kuei-jin que lo padecen parecen estar amortiguados por olas de miedo) es considerado sumamente vergonzoso por los Muertos de Hambre, que tratan de evitarlo a toda costa, sobre todo delante de sus compañeros."
 stress_threshold.2371.a:0 "Sucumbe a tu miedo".
 stress_threshold.2371.b:0 "Resiste con todo tu Yang Chi".
 stress_threshold.2371.fight.failed:0 "Has fallado".
 
 #Evento de nivel de estrés KJ 1
 
 stress_threshold.1742.t:0 "Ruptura mental: Toma de posesión por el Bandido"
 stress_threshold.1742.a:0 "Mi alma de viento está abrumada."
 stress_threshold.1742.desc:0 "Mientras que un Kuei-jin puede tener un papel específico que cumplir o una razón particular para haber regresado de entre los muertos, el bandido no tiene nada de eso.\NEste P'o no ve ninguna utilidad en el Gran Ciclo, que, después de todo, está muy alejado de su existencia nocturna. Más bien, ignora los mandatos del Cielo y del infierno y busca llevar a los Kuei-jin a actos aleatorios de destrucción autocomplaciente. El objetivo final del bandido es derribar todo el Gran Ciclo, tal vez por el resentimiento de haber recibido la orden de volver a las tierras de los vivos, pero mientras tanto cualquier objetivo -y cualquier representante del orden- sirve como foco de la rabia del P'o."
 umbral_de_estrés.1742.a:0 "Mi Alma de Viento está abrumada".
 
 stress_threshold.1743.a:0 "Mi alma de viento está abrumada."
 stress_threshold.1743.t:0 "Ruptura mental: Toma de posesión por el bárbaro"
 stress_threshold.1743.desc:0 "El bárbaro pretende rechazar las formas tradicionales de los Kuei-jin y sustituirlas por los métodos caóticos e indisciplinados de los Kin-jin. Al ver la relativa libertad de los vampiros occidentales, desea abandonar su herencia y unirse a los Kin-jin en su decadencia.\NEl bárbaro se burla de la devoción de los hunos por el deber y el respeto a la tradición, y aprovecha cualquier oportunidad para comparar las formas catayanas y occidentales. No hace falta decir que, en el análisis del bárbaro, las formas occidentales siempre salen mejor paradas."
 umbral_de_estrés.1743.a:0 "Mi alma de viento está abrumada".
 stress_threshold.1744.a:0 "Mi alma de viento está abrumada."
 
 stress_threshold.1744.t:0 "Ruptura mental: Toma de posesión por el Engañador"
 stress_threshold.1744.desc:0 "Al Engañador no le sirve la verdad, ni la buena, ni la mala, ni la indiferente. Practica la mentira por el placer de mentir, diciéndole al huno lo que quiere oír en un momento, y llevándolo al borde de la locura con una falsedad evidente al siguiente". Busca nada menos que hacer que el Kuei-jin sea incapaz de confiar en sí mismo. Cuantas más veces el Engañador consiga que el huno crea sus mentiras -y cuantas más veces diga la verdad y sea ignorado-, menos podrá confiar el huno en su propio juicio. Si el P'o se sale con la suya, finalmente la voluntad del huno naufraga, y el vampiro se ve incapaz de hacer un movimiento o tomar cualquier decisión sin el consejo amoroso del Engañador."
 umbral_de_estrés.1744.a:0 "Mi Alma de Viento está abrumada".
 
 stress_threshold.1745.t:0 "Ruptura mental: Toma de posesión por el Demonio"
 stress_threshold.1745.desc:0 "El Demonio busca devorar todo. Todo lo que sea más débil que el Kuei-jin es una presa, y todo lo que sea más fuerte es un poder que puede ser subsumido mediante la traición. Aunque el Demonio puede hablar de boquilla sobre el deber, la amistad y el honor, se dedica al poder personal y no le preocupan las opiniones de los demás. Para el Demonio, todo lo que ve existe para su diversión, para destruir y devorar a su antojo. Las demás almas sólo importan en función de cómo se relacionan con el Demonio, y de lo rápido que éste puede devorarlas".
 stress_threshold.1746.a:0 "Mi alma de viento está abrumada."
 stress_threshold.1745.a:0 "Mi Alma de Viento está abrumada".
 
 stress_threshold.1746.t:0 "Ruptura mental: Toma de posesión por el Loco"
 stress_threshold.1746.desc:0 "A un huno afligido por el Loco le espera una vida frustrante, ya que su P'o pide explicaciones hasta de la acción más sencilla o evidente. Además, el Loco es incapaz de realizar acciones a largo plazo o planificadas de antemano, y no ve ninguna virtud en ellas. Como tal, trabaja tan duro como puede (se distrae fácilmente) para conseguir que el Kuei-jin tome el camino más fácil y sencillo, y para evitar riesgos innecesarios (léase: cualquier complicación).\NUn P'o Loco nunca está callado, y su parloteo incesante puede llevar a la distracción incluso al Huno más autocontrolado."
 umbral_de_estrés.1746.a:0 "Mi Alma de Viento está abrumada".
 
 stress_threshold.1747.t:0 "Ruptura mental: Toma de posesión por parte de El Legalista"
 stress_threshold.1748.a:0 "Mi alma de viento está abrumada."
 stress_threshold.1747.desc:0 "El legalista P'o no tolera la desviación del orden celestial de las cosas. No hay lugar para la interpretación o la improvisación en el mundo de este P'o; todo tiene un papel específico que desempeñar, del que no puede desviarse.\NCualquier acción que el Kuei-jin lleve a cabo y que contradiga este orden divino -ya sea hablar con familiaridad a uno de mayor rango o aceptar la insubordinación de un inferior- hace que el Legalista monte en cólera hasta que el "insulto" sea corregido. Por supuesto, sólo el P'o puede decidir qué constituye una expiación adecuada, ya sea por parte del Kuei-jin o de otro. Así, un P'o legalista particularmente sádico puede mantener a su otra mitad saltando por aros muy formales durante días (o incluso más)."
 stress_threshold.1747.a:0 "Mi Alma de Viento está abrumada".
 
 stress_threshold.1749.a:0 "Mi alma de viento está abrumada."
 stress_threshold.1748.t:0 "Ruptura mental: Toma de posesión por el Mono"
 stress_threshold.1748.desc:0 "Mientras que los Kuei-jin pueden haber regresado al Reino Medio por una razón, al Mono no le importa mucho. Es una criatura del momento, siendo cada nuevo placer o distracción lo más importante del mundo. El Mono es capaz de urdir elaborados planes para alcanzar objetivos pequeños o momentáneos, pero no le preocupa en absoluto ninguna misión global que puedan tener los Kuei-jin. De hecho, el Mono busca, en todo momento, desviar a la Cathayan de su objetivo asignado, para desviar toda la atención y energía del vampiro hacia cosas menores y transitorias."
 umbral_de_estrés.1748.a:0 "Mi Alma de Viento está abrumada".
 
 stress_threshold.1749.t:0 "Ruptura mental: Toma de posesión por el esclavo"
 stress_threshold.1749.desc:0 "El Esclavo no confía en el juicio de los Kuei-jin, a los que trata de socavar en todo momento. Siempre que es posible, el Esclavo hace lo posible por poner al Kuei-jin bajo el control de otro. Por lo tanto, cuestiona cada decisión que toma el huno y aprovecha cualquier oportunidad para obligar al Kuei-jin a someterse. No es de extrañar que, una vez que el P'o consigue cautivar al huno, el Esclavo empiece a lamentarse inmediatamente de su destino y le inste a escapar, a buscar otro "amo" que le guíe por la existencia. En última instancia, el Esclavo busca servir a los Reyes Yama, y los cataríes con un fuerte Arquetipo de Esclavo suelen convertirse en akuma."
 Umbral_de_estrés.1749.a:0 "Mi Alma de Viento está abrumada".
