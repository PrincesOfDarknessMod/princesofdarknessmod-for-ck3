l_spanish:
 stress_threshold_cooldown_message:1 "Si sigues [estresado|E] en [SCOPE.ScriptValue('stress_threshold_cooldown_duration_in_years')|V0] años, puedes sufrir otro [mental_break|E]"

 # Mensajes del sistema
 stress_threshold.0010.toast:2 "Obtuvo un [stress_level|E]"
 stress_threshold.0010.text:0 "Has sido abrumado por [stress|E]"
 stress_threshold.0400.toast:2 "Has superado tu límite de [stress|E] y te has reiniciado a [stress_level|E] 3"

 # Eventos de estrés de nivel 1
 stress_threshold.1001.t:0 "Ruptura mental: Pensamientos oscuros"
 stress_threshold.1001.desc:0 "La culpa y la vergüenza me han asolado últimamente. Todos mis pecados, mis defectos, mis faltas... estos oscuros pensamientos me distraen de mis responsabilidades y me mantienen despierto por la noche.\N-Siento que debo hacer algo para poner fin a esta angustia mental, pero ¿qué podría ayudar?"
 stress_threshold.1001.contrite.gain:0 "¡Debo confesar todo lo que he hecho mal!"
 stress_threshold.1001.contrite.effect:0 "¡No puedo ocultar mis secretos por más tiempo!"
 stress_threshold.1001.flagellant.gain:0 "El aguijón del látigo extirpará mis pecados".
 stress_threshold.1001.flagellant.effect:0 "¡Merezco ser castigado! Por todo!"
 stress_threshold.1001.improvident.gain:0 "Donar a la caridad compensará mis pecados".
 stress_threshold.1001.improvident.effect:0 "¡Otros necesitan mi oro más que yo!"
 stress_threshold.1001.drunkard.gain:0 "¿Tal vez un par de tragos ayuden?"
 stress_threshold.1001.drunkard.effect:0 "Beberé hasta que estos pensamientos desaparezcan".
 stress_threshold.1001.hashishiyah.gain:0 "Un poco de hachís me tranquilizará..."
 stress_threshold.1001.hashishiyah.effect:0 "Una noche de relax con mi pipa me ayudará".
 stress_threshold.1001.journaller.gain:0 "Escribir mis preocupaciones me ayudará a concentrarme".
 stress_threshold.1001.endure:0 "¡Debo ser fuerte y resistir estos impulsos!"
 stress_threshold.1001.journaller.effect:0 "Necesito una noche a solas en mi estudio".

 stress_threshold.1011.t:0 "Ruptura mental: Deseos Desesperados"
 stress_threshold.1011.desc:0 "Últimamente parece que me distraen constantemente los pensamientos lascivos y las fantasías eróticas. Con todas las dificultades de mi vida cotidiana, es demasiado fácil perderme en ensoñaciones y olvidarme de la realidad.\N-Estos deseos están interfiriendo claramente en mi vida, pero ¿qué debo hacer al respecto?"
 stress_threshold.1011.rakish.gain:0 "¡Un viaje al burdel me aliviará!"
 stress_threshold.1011.rakish.effect:0 "Que nadie más que yo entre en el burdel esta noche".
 stress_threshold.1011.rakish.tt:0 "Un comportamiento tan gratuito tiene riesgos inherentes..."
 stress_threshold.1011.reclusive.gain:0 "¡Debo secuestrarme para evitar la tentación!"
 stress_threshold.1011.reclusive.effect:0 "¡Sólo en la soledad encontraré la paz!"
 stress_threshold.1011.conversion.interfaith:0 "¿Quizás una nueva visión de [new_faith.HighGodName] me ayude?"
 stress_threshold.1011.conversion.intrafaith:0 "¿Quizás [new_faith.HighGodName] pueda ayudarme donde [ROOT.Char.GetFaith.HighGodName] falló?"
 stress_threshold.1011.exercise.gain:0 "Tal vez un tipo diferente de salida ayude ..."
 stress_threshold.1011.conversion.judaism:0 "Los antiguos mandamientos me ayudarán a mantenerme puro".
 stress_threshold.1011.endure:0 "¡Me morderé el labio y trataré de mantenerme concentrado!"
 stress_threshold.1011.conversion.christianity:0 "¡Jesús, líbrame de estas tentaciones!"

 stress_threshold.1001.exercise.effect:0 "Un buen entrenamiento quemará estos deseos".

 stress_threshold.1501.t:0 "Descanso mental: Nada importa"
 stress_threshold.1501.intro.desc:0 "Cada nuevo día me resulta más difícil encontrar una razón para arrastrarme fuera de la cama y celebrar el juicio".
 stress_threshold.1501.helper.desc:0 "[scoped_helper.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] me espera en el comedor, pero las palabras de [scoped_helper.GetHerHis] no me dan ningún consuelo hoy."
 stress_threshold.1501.nohelper.desc:0 "Incluso después de arrastrarme hasta el comedor, no encuentro ningún interés en el repetitivo acto de los animadores, ni ningún placer en la abundante comida que tengo ante mí."
 stress_threshold.1501.faith.desc:0 "Incluso las palabras del [scoped_ruler.GetFaith.AltPriestTermPlural] suenan huecas a mis oídos."
 stress_threshold.1501.fallback.desc:0 "\NEl ritmo monótono de esta vida se ha vuelto insoportable."
 stress_threshold.1501.a:0 "¡Ya no puedo soportar [scoped_helper.GetHerHim]!"
 stress_threshold.1501.b:0 "Creo que volveré a evitar la comida".
 stress_threshold.1501.c:0 "Sólo quiero que me dejen en paz".
 stress_threshold.1501.d:0 "¿Para qué comer si todo sabe a ceniza?"
 stress_threshold.1501.e:0 "No puedo dejar que estos pensamientos oscuros me distraigan".
 stress_threshold.1501.f:0 "La vida como [scoped_ruler.GetFaith.GetAdherentName] no tiene ningún propósito."

stress_threshold.1502.t:0 "Ruptura mental: Resentimiento"
 stress_threshold.1502.intro.desc:0 "¿Por qué tengo que hacerlo siempre todo yo? Cómo se puede esperar que gobierne sobre [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] cuando la mitad de mis sirvientes son incapaces de seguir mis órdenes, y la otra mitad ni siquiera las entiende?"
 stress_threshold.1502.courtier.desc:0 "\N-[scoped_courtier.GetFirstName], en particular, se ha vuelto insoportable últimamente. Apenas puedo soportar escuchar mi [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_courtier'))] parloteo incesante".
 stress_threshold.1502.nocourtier.desc:0 ""
 stress_threshold.1502.a:0 "¡No eres más que un [scoped_courtier.Custom('InsultAdjective')] [scoped_courtier.Custom('InsultNoun')]!"
 stress_threshold.1502.b:0 "¡Carcelero! Tráeme otro prisionero!"
 stress_threshold.1502.c:0 ""¿Por qué tenéis que ser todos unos incompetentes #EMP idiotas#!!!"
 stress_threshold.1502.d:0 "Una visita al calabozo me despejará la cabeza..."
 stress_threshold.1502.e:0 "Tendré que aguantar".
 stress_threshold.1502.f:0 "¿Quizás si llevara un diario de mis desgracias?"
 stress_threshold.1502.g:0 "[scoped_ruler.GetFaith.HighGodName], ¡necesito un trago!"

 stress_threshold.1503.t:0 "Ruptura mental: Vacío interior"
 stress_threshold.1503.desc:0 "Nada de lo que hago me satisface ya. A pesar de todos mis esfuerzos, no encuentro ni la felicidad ni la tranquilidad. Es como si me faltara algo. \¿Qué podría llenar este agujero que roe mi alma?"
 stress_threshold.1503.a.a:0 "¿Algunas joyas más, quizás?"
 stress_threshold.1503.a.b:0 "¡Necesito una corona más grande!"
 stress_threshold.1503.a.c:0 "Me he aburrido de mi ropa..."
 stress_threshold.1503.a.d:0 "¡Un nuevo y poderoso semental!"
 stress_threshold.1503.a.e:0 "¡Un nuevo cuadro de un famoso artista!"
 stress_threshold.1503.a.f:0 "¡Una gloriosa estatua de mis últimas hazañas!"
 stress_threshold.1503.b:0 "Sólo [scoped_ruler.Custom('GetExpensiveMeal')] puede curar este dolor".
 stress_threshold.1503.e:0 "Si hubiera algo que pudiera hacer..."

 stress_threshold.1504.t:0 "Ruptura mental: Endless Toil"
 stress_threshold.1504.desc:0 "A veces siento que el mundo entero descansa sobre mis hombros. Mis responsabilidades como [scoped_ruler.GetTitleAsName] de [scoped_ruler.GetPrimaryTitle.GetNameNoTier] son interminables... Apenas me queda un momento para mí".
 stress_threshold.1504.a:0 "¡¿No puede la gente dejarme en paz un rato?!"
 stress_threshold.1504.b:0 "Necesito algo para reequilibrar mis humores..."
 stress_threshold.1504.e:0 "Al fin y al cabo, este es mi deber".
 stress_threshold.1504.f:0 "¡Estoy rodeado de tontos!"
 stress_threshold.1504.g:0 "Recogeré mis pensamientos por escrito".
 stress_threshold.1504.h:0 "¡Asiento a mi caballo, necesito salir!"

 stress_threshold.1601.t:0 "Pausa mental: Pensamientos giratorios"
 stress_threshold.1601.inappetetic.effect:0 "¡Moriré de hambre sin ninguna distracción!"
 stress_threshold.1601.desc:0 "¡No puedo concentrarme, mis pensamientos corren en círculos! Tengo que supervisar el [ROOT.Char.Custom('ResidenceBuilding')], tengo que vigilar a las tropas, tengo que... ¡¿Cómo voy a encontrar descanso cuando hasta mis pensamientos me traicionan así?!"
 stress_threshold.1601.profligate.gain:0 "Si compro algo brillante para centrar mi pensamiento..."
 stress_threshold.1601.profligate.effect:0 "¡Siempre me siento más centrado después de comprar algo bonito!"
 stress_threshold.1601.inappetetic.gain:0 "Los pensamientos sobre la comida son una distracción".

 stress_threshold.1601.comfort_eater.gain:0 "Un estómago lleno podría ayudarme a concentrarme".
 stress_threshold.1601.comfort_eater.effect:0 "Un estómago lleno siempre me hace sentir más concentrado".
 stress_threshold.1601.rakish.gain:0 "Tal vez pueda encontrar la concentración en la pasión..."
 stress_threshold.1601.rakish.effect:0 "¡Un viaje a un burdel siempre me ayuda a centrar mis pensamientos!"
 stress_threshold.1601.reclusive.gain:0 "Tal vez podría centrar mis pensamientos si estuviera solo..."
 stress_threshold.1601.reclusive.effect:0 "Siempre puedo centrar mis pensamientos cuando estoy solo..."
 stress_threshold.1601.irritable.gain:0 "¡Quizás podría pensar si todo el mundo se callara #EMP!"
 stress_threshold.1601.irritable.effect:0 "¡Simplemente le diré a todo el mundo que #EMP se calle#!"
 stress_threshold.1601.confider.gain:0 ""[friend.GetFirstName], amigo mío, ¡ayúdame a ordenar mis pensamientos!"
 stress_threshold.1601.confider.effect:0 ""[friend.GetFirstName], por favor, ¡escúchame como siempre!"
 stress_threshold.1601.athletic.gain:0 "He oído que un cuerpo sano engendra una mente sana..."
 stress_threshold.1601.athletic.effect:0 "¡Nunca estoy más tranquilo que después de hacer algo de ejercicio!"
 stress_threshold.1601.contrite.gain:0 "Voy a aclarar mi mente confesando mis malas acciones".
 stress_threshold.1601.contrite.effect:0 "¡Debo confesar mis malas acciones! Eso debería traer claridad".
 stress_threshold.1601.flagellant.gain:0 "Se supone que el dolor agudiza la mente..."
 stress_threshold.1601.flagellant.effect:0 "No hay nada como el dolor para centrar mis pensamientos".
 stress_threshold.1601.improvident.gain:0 "¿Quizás un claro acto de caridad libere mis pensamientos?"
 stress_threshold.1601.improvident.effect:0 "Donar a una buena causa siempre calma mi mente".
 stress_threshold.1601.drunkard.gain:0 "Tal vez me sienta más centrado después de beber un poco..."
 stress_threshold.1601.drunkard.effect:0 "Siempre me siento más centrado después de alguna copa".
 stress_threshold.1601.hashishiyah.gain:0 "Con un poco de hachís espero calmar mi mente..."
 stress_threshold.1601.hashishiyah.effect:0 "Nunca estoy más tranquilo que después de una noche con mi pipa".
 stress_threshold.1601.journaller.gain:0 "Escribir mis pensamientos debería traer algo de claridad..."
 stress_threshold.1601.journaller.effect:0 "¡Escribir mis pensamientos siempre trae claridad!"
 stress_threshold.1601.endure_no_option:0 "Yo... yo debo soportar. No hay nada que pueda hacer..."

 stress_threshold.1602.t:0 "Ruptura mental: Emociones arremolinadas"
 stress_threshold.1602.desc:0 "Mis emociones se vuelven más inestables cada día que pasa. La alegría envolvente sustituye a la tristeza más profunda de un momento a otro, y tanto mi séquito como yo nos volvemos cautelosos.\N¡Si pudiera encontrar la manera de domar este torbellino interior!"
 stress_threshold.1602.profligate.gain:0 "Quizás algo nuevo - algo brillante - me centre".
 stress_threshold.1602.profligate.effect:0 "¡Algo nuevo y brillante sólo me traerá una clara alegría!"
 stress_threshold.1602.inappetetic.gain:0 "Si no como no tendré energía para sentir..."
 stress_threshold.1602.inappetetic.effect:0 "Si no como no tendré energía para sentir..."
 stress_threshold.1602.comfort_eater.gain:0 "Al menos la comida me aporta una clara sensación de confort".
 stress_threshold.1602.comfort_eater.effect:0 "Cuando como sólo siento comodidad".
 stress_threshold.1602.rakish.gain:0 "Un fuerte deseo podría mantener a raya otros sentimientos..."
 stress_threshold.1602.rakish.effect:0 "¡Nada me centra como el deseo fuerte y la lujuria!"
 stress_threshold.1602.reclusive.gain:0 "Tal vez podría calmarme si estuviera solo..."
 stress_threshold.1602.reclusive.effect:0 "Siempre gano claridad cuando estoy solo".
 stress_threshold.1602.irritable.gain:0 "¡Sería más fácil si la gente me dejara en paz #EMP!"
 stress_threshold.1602.irritable.effect:0 "¡Les diré lo que pienso de su #EMP wariness#!"
 stress_threshold.1602.confider.gain:0 "Hablar de ello con [friend.GetFirstName] podría ayudar".
 stress_threshold.1602.confider.effect:0 "¡Hablar con [friend.GetFirstName] suele ayudar!"
 stress_threshold.1602.athletic.gain:0 "Correré hasta no sentir más que satisfacción".
 stress_threshold.1602.athletic.effect:0 "Una carrera siempre calma mis emociones".
 stress_threshold.1602.contrite.gain:0 "Puede que me calme si confieso mis faltas".
 stress_threshold.1602.contrite.effect:0 "¡Siempre me siento más equilibrado después de confesarme!"
 stress_threshold.1602.flagellant.gain:0 "Quizá pueda despojarme de todas las emociones menos del dolor..."
 stress_threshold.1602.flagellant.effect:0 "Sólo sentiré dolor, nada más".
 stress_threshold.1602.improvident.gain:0 "La gratitud de la caridad podría superar todo lo demás".
 stress_threshold.1602.improvident.effect:0 "Siempre me siento más centrado después de donar..."
 stress_threshold.1602.journaller.gain:0 "Escribiré hasta que no me sienta más que centrado".
 stress_threshold.1602.journaller.effect:0 "¡Escribir sobre mis sentimientos siempre funciona!"
 stress_threshold.1602.drunkard.gain:0 "Con suficiente bebida todas las emociones se desvanecen..."
 stress_threshold.1602.drunkard.effect:0 "¡Siempre puedo dejar atrás mis emociones bebiendo!"
 stress_threshold.1602.hashishiyah.gain:0 "Quizá un poco de hachís traiga la calma".
 stress_threshold.1602.hashishiyah.effect:0 "El hachís siempre me centra".

 # Eventos de estrés de nivel 2
 stress_threshold.2001.endure:0 "Debo tener paciencia con ellos ..."
 stress_threshold.2001.t:0 "Ruptura mental: Ingratitud"
 stress_threshold.2001.desc:0 "¡Desgraciados ingratos! ¿No saben los sacrificios que hago por su bien? Cada día me esclavizo sin cesar para hacer que este reino sea próspero, ¡y todo lo que hacen es quejarse y pedir más! ¿Y ahora [victim.GetFirstNameNoTooltip] llega a cuestionar mis órdenes?"
 stress_threshold.2001.arbitrary.gain:0 "¡Soy el [ROOT.Char.GetTitleAsNameNoTooltip], mi palabra es la ley!"
 stress_threshold.2001.arbitrary.effect:0 "¡Yo decido cómo se hacen las cosas por aquí!"
 stress_threshold.2001.imprison_victim:0 "¡Veamos lo agradecido que se siente [victim.GetFirstNameNoTooltip] en el calabozo!"


 stress_threshold.2101.t:0 "Ruptura mental: No bienvenido"
 stress_threshold.2101.desc:0 "A veces me siento como un extraño en mi propio [ROOT.Char.Custom('ResidenceBuilding')]. No puedo evitar las miradas extrañas que me dirigen mis cortesanos, el malestar que llena cualquier habitación en la que entro... ¿qué ha pasado con mi vida? ¿Por qué no soy bienvenido entre los míos?".
 stress_threshold.2101.witch.gain:0 "Soy un paria, igual que [ROOT.Char.GetFaith.WitchGodName]".
 stress_threshold.2101.witch.effect:0 "Al menos sé que [ROOT.Char.GetFaith.WitchGodName] me entiende".
 stress_threshold.2101.drunkard.effect:0 "El vino puede ser mi único amigo verdadero".
 stress_threshold.2101.hashishiyah.effect:0 "Al menos mi pipa no me juzga".
 stress_threshold.2101.endure:0 "Puede que todo esto esté en mi cabeza..."

 stress_threshold.2201.t:0 "Ruptura mental: Ira en ebullición"
 stress_threshold.2201.desc.insult:0 ""¡Puede que seas un [character_to_yell_at.GetTitleAsName], pero también eres [character_to_yell_at.Custom('InsultAdjectiveArticle')] [character_to_yell_at.Custom('InsultNoun')]!"\n"
 stress_threshold.2201.desc:0 "Dudo en cuanto veo la cara de [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('character_to_yell_at'))], pero... Es que me siento tan #EMP enfadado#! todo el tiempo, y todo el mundo corteja mi ira-\n\n"
 stress_threshold.2201.desc_liege:0 ""¡¿Qué te pasa, [ROOT.Char.GetTitledFirstNameNoTooltip]? Este comportamiento es inaceptable".
 stress_threshold.2201.desc_vassal:0 ""Mi señor, ¡¿qué significa este comportamiento?!"
 stress_threshold.2201.desc.calm:0 ""Y tú sueles ser tan tranquilo...""
 stress_threshold.2201.desc.ending:0 """
 stress_threshold.2201.a:0 "¡Ya has oído lo que he dicho!"
 stress_threshold.2201.save:0 "Dime, ¿cómo responderías a un ataque así?"
 stress_threshold.2201.save_tt:0 "Pretendo que sólo estoy probando [character_to_yell_at.GetHerHim]"
 stress_threshold.2201.liege:0 "Lo siento, mi señor. Me controlaré mejor".
 stress_threshold.2201.c:0 "Lo siento. Me controlaré mejor".

 stress_threshold.2202.t:0 "Ira en ebullición"
 stress_threshold.2202.desc.liege:0 "La ira no provocada expresada por mi liege [stress_character.GetTitledFirstName] es una completa sorpresa."
 stress_threshold.2202.desc.vassal:0 "La ira no provocada expresada por mi vasallo [stress_character.GetTitledFirstName] es una completa sorpresa."
 
 stress_threshold.2202.desc.other_relationship:0 "La ira no provocada expresada por mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stress_character'))] [stress_character.GetTitledFirstName] llega como una completa sorpresa."
 stress_threshold.2202.desc:0 "[stress_character.GetSheHe|U] ha estado bajo mucho estrés últimamente, pero"
 stress_threshold.2202.desc.rival:0 "cuando se le pidió una explicación a [stress_character.GetHerselfHimself] [stress_character.GetSheHe] sólo redobló los insultos."
 stress_threshold.2202.desc.other:0 "para comportarse así..."
 stress_threshold.2202.a:0 "Daré lo mismo que recibo. "[stress_character.Custom('InsultNoun')|U]!"
 stress_threshold.2202.b:0 "Que hasta [stress_character.GetSheHe] se esfuerce... Es calmante".

 # Eventos de estrés de nivel 3
 stress_threshold.3001.t:0 "Ruptura mental: Las Voces"
 stress_threshold.3001.desc:0 "Allí donde mi corte sólo reparte mentiras y falsedades, he encontrado a los que dicen estar dispuestos a decirme la verdad.\NViven conmigo. En mi cabeza.\NDicen saber cuál es la verdad...\N¿Lo saben realmente?"
 stress_threshold.3001.possessed.gain:0 "¡Sí, sólo las voces saben la verdad real!"
 stress_threshold.3001.possessed.effect:0 "Sí, sí, saben la verdad, la auténtica verdad..."
 stress_threshold.3001.naked_run:0 "¡Debo exorcizar a estos demonios con una carrera desnuda!"
 stress_threshold.3001.endure:0 "Simplemente... no los escuches..."

 stress_threshold.3101.t:0 "Ruptura mental: Maldad"
 stress_threshold.3101.desc:0 "Todo está... mal. Las paredes de esta habitación están mal. El suelo está mal. Incluso el aire está mal. ¿Por qué está todo mal? ¿Quién ha hecho esto? ¿Quién ha hecho que todo esté mal?"
 stress_threshold.3101.kill_victim:0 "¡Todo es culpa de [victim.GetFirstNamePossessiveNoTooltip], lo sé!"
 stress_threshold.3101.lunatic.gain:0 "Las ardillas... ¿en las paredes? Ellos lo hicieron!"
 stress_threshold.3101.lunatic.effect:0 "¡Las ardillas de las paredes han vuelto!"
 stress_threshold.3101.lunatic.tt:0 "#¡Traedme mi pico!#"

 stress_threshold.3201.t:0 "Ruptura mental: Sobrecarga"
 stress_threshold.3201.desc:0 "Es todo demasiado, ¿de qué sirve siquiera intentarlo?" Estamos en medio de una cena cuando todo... se desmorona. Tengo que revisar nuevos registros de [county.GetNameNoTierNoTooltip], tengo que resolver una docena de disputas locales, tengo que-\n "¿Está usted bien, mi señor?" Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] expresa con cautela la preocupación de [vassal.GetHerHis]".
 stress_threshold.3201.depressed.gain:0 "¿Qué importa? Me rindo".
 stress_threshold.3201.depressed.effect:0 "De todas formas todo es inútil..."
 stress_threshold.3201.help:0 ""[vassal.GetFirstNameNoTooltip]... Por favor, ayúdame""
 stress_threshold.3201.wrathful.gain:0 ""¡No tú [vassal.Custom('InsultAdjective')] [vassal.Custom('InsultNoun')], yo soy #EMP no#! bien!"
 stress_threshold.3301.desc_woman:0 "La primera señal de que algo anda mal es una acidez que no desaparece. Intento todos los remedios: lana suave en mi abdomen, caminatas tranquilas ... No tengo suerte. \n\nDe repente, parece que no puedo respirar profundamente y me tambaleo hacia la pared en busca de apoyo. ¡¿Qué… qué está pasando ?! Intento llorar pidiendo ayuda, pero todo lo que consigo es un grito ahogado. \n\n¡Eso #EMP DUELE#! Un dolor agudo se extiende desde mis omóplatos hasta mi brazo izquierdo y, a medida que aumenta el dolor, me hundo hasta el suelo. \n\nLa oscuridad sigue rápidamente."
 stress_threshold.3201.wrathful.effect:0 ""¡Te voy a enseñar quién es #EMP bien#!, tú [vassal.Custom('InsultAdjective')] [vassal.Custom('InsultNoun')]!"
 stress_threshold.3201.wrathful.effect.success:0 "Has golpeado a [vassal.GetTitledFirstName]"
 stress_threshold.3201.wrathful.effect.failure:0 "[vassal.GetTitledFirstName] se defiende de ti"

 stress_threshold.3301.t:0 "Ruptura mental: El corazón duele"
 stress_threshold.3301.desc_man:0 "La primera señal de que algo va mal es un dolor agudo en el pecho. Me tambaleo hacia una pared para apoyarme mientras el dolor se extiende por mi brazo izquierdo y me mareo. No tengo tiempo para esto. Tengo cosas que hacer. Al intentar dar un paso, me desplomo en el suelo. Intento gritar pidiendo ayuda, pero el único sonido que se me escapa es un gemido estrangulado.\NEl dolor en mi pecho sólo aumenta, y aumenta, y- la oscuridad se apodera de mi visión, y puedo #EMP sentir#! mi corazón tartamudear".
 stress_threshold.3301.desc_mujer:0 "La primera señal de que algo va mal es un ardor de estómago que no desaparece. Pruebo todos los remedios: lana suave en el abdomen, paseos tranquilos... No hay suerte.\NDe repente no puedo respirar profundamente y me tambaleo hacia la pared para apoyarme. ¿Qué... qué está pasando? Intento gritar pidiendo ayuda, pero lo único que consigo es un jadeo doloroso. Un dolor agudo se extiende desde entre los omóplatos hasta el brazo izquierdo y, a medida que el dolor aumenta, me hundo en el suelo.
 stress_threshold.3301.a:0 "¡Uf...!"
 
 stress_threshold.3311.t:0 "Ruptura mental: La bestia gana"
 stress_threshold.3311.desc:0 "Tras siglos de lucha, la bestia finalmente se impone. Intentaste seguir un camino, aferrarte a elevadas ideas de controlarte, de repeler a la bestia. Has fracasado. Con tu adhesión al camino abolida y tu fuerza de voluntad hecha pedazos, nada detiene a la bestia. #R Nunca podrás mantenerme a raya. TÚ ERES MÍO".
 stress_threshold.3311.desc_instinct:0 "Tras siglos de lucha, la bestia finalmente te ahoga. Intentaste seguir un camino, perseguir ideas ambiciosas de controlar a la bestia, de aprovechar su poder conservando tu personalidad. Has fracasado. Con tu adhesión al camino abolida y tu fuerza de voluntad hecha pedazos, la ola de frenesí te ahoga para siempre. #¿Utilizarme? ¿ARRESTARME? debilucho, te mostraré mi poder". 
 stress_threshold.3311.a:0 "Estoy perdido".
