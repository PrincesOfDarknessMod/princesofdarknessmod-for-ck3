l_spanish:

 POD_inquisition_face_sins.001.t:0 "Enfréntate a tus pecados"
 POD_inquisition_face_sins.001.desc:0 "Empiezas a sentir que no mereces la gracia que Dios te concedió, con la forma en que vives tu vida. Tu fe era antes inquebrantable, pero estás sintiendo las grietas que aparecen alrededor de tu resolución mental.\N¿Está el mundo realmente condenado? ¿O no estás haciendo lo suficiente? La duda te atormenta y esta crisis afecta cada vez más a tu eficacia. Tienes que hacer algo al respecto, quizás empezando por convertirte en una mejor persona".
 POD_inquisition_face_sins.001.option.a:0 "Debería intentar comprender mejor sus caminos"
 POD_inquisition_face_sins.001.option.a.tt:0 "Intentará hacer algo al respecto"
 POD_inquisition_face_sins.001.option.b:0 "No podría importarme menos..."
 POD_inquisition_face_sins.001.option.b.tt:0 "No harás nada al respecto, lo que tiene un coste"
 
 POD_inquisition_face_sins.002.t:0 "Enfréntate a tus pecados II"
 POD_inquisition_face_sins.002.desc:0 "Después de pensar en cómo puedes conseguir un conocimiento más profundo de la gracia de Dios, te salieron dos opciones: aprender sobre hombres verdaderamente piadosos del pasado o buscar ayuda dentro de los siervos de Dios."
 POD_inquisition_face_sins.002.option.a:0 "Debería buscar la sabiduría eterna de los santos del pasado"
 POD_inquisition_face_sins.002.option.a.tt:0 "Intentará aprender más sobre las personas piadosas del pasado"
 POD_inquisition_face_sins.002.option.a.desc:0 "Aprendizaje y determinación"
 POD_inquisition_face_sins.002.option.a.success:0 "Consigues entender mejor sus caminos"
 POD_inquisition_face_sins.002.option.a.success.tt:0 "Consigo entenderle mejor"
 POD_inquisition_face_sins.002.option.a.failure:0 "Consigues entender mejor Sus caminos"
 POD_inquisition_face_sins.002.option.a.failure.tt:0 "Tal vez, no soy Su siervo después de todo"
 POD_inquisition_face_sins.002.option.b:0 "Debería buscar ayuda en las iglesias cercanas"
 POD_inquisition_face_sins.002.option.b.tt:0 "Pedirás ayuda a los sacerdotes y monjes locales"
 POD_inquisition_face_sins.002.option.b.desc:0 "Diplomacia y determinación"
 POD_inquisition_face_sins.002.option.b.success:0 "Consigues entender mejor sus caminos"
 POD_inquisition_face_sins.002.option.b.success.tt:0 "Consigo entenderle mejor a Él"
 POD_inquisition_face_sins.002.option.b.failure:0 "Consigues entender mejor Sus caminos"
 POD_inquisition_face_sins.002.option.b.failure.tt:0 "Tal vez, no soy Su siervo después de todo"
 
 POD_inquisition_face_sins.102.t:0 "Restauración de la fe"
 POD_inquisition_face_sins.102.desc.learning:0 "Después de pasar mucho tiempo con libros antiguos sobre gente piadosa del pasado, llegas a comprender que los caminos de Dios son diferentes a los de los hombres. Si te concede su bendición a ti, un simple pecador, tienes que enorgullecerle".
 POD_inquisition_face_sins.102.desc.diplomacy:0 "Has hablado con muchos siervos de Dios en los últimos días y ahora finalmente comienzas a entender que no importa cómo te veas a ti mismo, lo único que importa es cómo te ve Dios. Si cree que eres digno de tu bendición, te asegurarás de que no se desperdicie."
 POD_inquisition_face_sins.102.option.a:0 "Dios trabaja de forma misteriosa"
 POD_inquisition_face_sins.102.option.a.tt:0 "Conservas tus poderes divinos"
 
 POD_inquisition_face_sins.003.t:0 "Crisis de fe"
 POD_inquisition_face_sins.003.desc.learning:0 "Incluso después de pasar mucho tiempo tratando de entender a la gente piadosa del pasado leyendo libros antiguos, no tiene ningún sentido. Quizás, después de todo, no eres su siervo. O uno defectuoso, por lo menos. Sólo reza para que sea suficiente".
 POD_inquisition_face_sins.003.desc.diplomacy:0 "Ni siquiera los sacerdotes y monjes locales te ayudaron a entender a Dios y sus caminos. Tal vez, no eres Su siervo después de todo. O uno muy defectuoso al menos. Sólo tienes que rezar para que sea suficiente".
 POD_inquisition_face_sins.003.option.a:0 "He perdido mi camino"
 POD_inquisition_face_sins.003.option.a.tt:0 "Pierdes tus poderes divinos... durante algún tiempo"
 
 POD_inquisition_face_sins.004.t:0 "Crisis de fe II"
 POD_inquisition_face_sins.004.desc:0 "Hace tiempo que no puedes utilizar los poderes divinos otorgados por Dios. Quizás, has perdido tu fe, quizás Él ha perdido la fe en ti.  Sólo hay pecado en no intentar seguir el camino, no en no seguirlo".
 POD_inquisition_face_sins.004.option.a:0 "Daré todo lo que pueda para restaurar mi Fe"
 POD_inquisition_face_sins.004.option.a.tt:0 "Intentarás restaurar tu Fe, cueste lo que cueste"
 POD_inquisition_face_sins.004.option.b:0 "No puedo rendirme"
 POD_inquisition_face_sins.004.option.b.tt:0 "Intentarás entenderte mejor a ti mismo y a Dios"
 POD_inquisition_face_sins.004.option.b.desc:0 "Reto de aprendizaje"
 POD_inquisition_face_sins.004.option.b.success:0 "Consigues entenderle mejor a Él y a ti mismo"
 POD_inquisition_face_sins.004.option.b.failure:0 "Fracasas en tu intento de entenderle mejor a Él y a ti mismo"
 POD_inquisition_face_sins.004.option.b.failure.tt:0 "No recuperarás tus poderes... todavía"
 POD_inquisition_face_sins.004.option.c:0 "Ahora mismo no tengo tiempo para esas cosas"
 POD_inquisition_face_sins.004.option.c.tt:0 "No intentarás restaurar tu fe por ahora"
 POD_inquisition_face_sins.004.option.d:0 "¿Sinceramente? No podría importarme menos"
 POD_inquisition_face_sins.004.option.d.tt:0 "Nunca podrás restaurar tu Fe"
