l_spanish:

 POD_gehenna_omens.1231.notification:0 "Presagio de Gehenna"
 POD_gehenna_omens.1231.desc:0 "Ha nacido una vaca de dos cabezas".
 POD_gehenna_omens_1231_notification_tooltip:0 "Realmente, ha nacido una vaca de dos cabezas".
 
 POD_gehenna_omens.1240.t:0 "Presagio de Gehenna"
 POD_gehenna_omens.1240.opening:0 "Las noticias vienen de Rusia:"
 POD_gehenna_omens.1240.desc:0 "Los gemelos lupinos Colmillo Plateado Yuri Tvarivich y Sophia Tvarivich lideraron a un número de hombres lobo contra los Zmei Sharkala los Crueles en Rusia, incluyendo a cinco Colmillos Plateados: Georges de Armenai, Boris, Foma, Vassili y Utra. También les acompañaban Pyotor, de los Caminantes de Cristal; Ulu, de los Contempladores de las Estrellas; el Roedor de Huesos Igor Valkof; Mehmet, de los Trancos Silenciosos; Katja, de las Furias Negras, y el héroe de Get of Fenris Ragnor. Utra, Ragnor, Boris y Katja murieron en la batalla, al igual que Sophia, y Yuri fue aplastado por Sharkala al dar el golpe final".
 POD_gehenna_omens.1240.a:0 "¡Los Zmei están furiosos!" 
 POD_gehenna_omens.1240.a.tt.beast:0 "¡La rabia de los Zmei se hace notar! "

 POD_gehenna_omens.1241.t:0 "Presagio de Gehenna"
 POD_gehenna_omens.1241.opening:0 "Las noticias vienen de Rusia:"
 POD_gehenna_omens.1241.desc:0 "La horda mongola llega desde el otro lado de las estepas como un gran diluvio, arrasando las tierras de Rusia, sus reyes mortales barridos en un torrente de violencia. Pero más preocupantes aún son las historias de manadas de lupinos mezcladas entre la marea humana. Esta tribu de hombres lobo se autodenomina los Señores de la Sombra y dejan a su paso los cadáveres de sus congéneres. ¿Acaso el desenfreno de las Bestias de la Luna presagia la llegada de la Gehenna?"
 POD_gehenna_omens.1241.a:0 "¿Hasta dónde llegarán estos mongoles y sus perros?" 
 
 POD_gehenna_omens.1242.t:0 "¡Gehenna: Izhim ur-Baal despierta!"
 POD_gehenna_omens.1242.desc:0 "En el antiguo pasado, el progenitor de [enkara.GetFirstName], [izhim.GetFirstName], había desaparecido ante sus ojos cuando fue absorbido por la gigantesca mano del demonio terrestre Namtaru. Invocada por sus susurros, [enkara.GetFirstName] se acercó a [izhim.GetFirstName] y le alimentó con su sangre. Izhim bebió profundamente de Enkara, y a cada sorbo emergía más y más de la piedra líquida hasta que, finalmente, la empujó a la mano demoníaca para ocupar su lugar. Explicando a Enkara que ella era el único sacrificio digno de Namtaru. Ella era la única a la que amaba de verdad y ahora estaba dispuesto a ofrecer su único y verdadero amor en un contrato con Namtaru para escapar del sufrimiento y liberar finalmente todo el potencial de la Maldición del Hambre sobre los Banu Haqim. Ahora que se llama a sí mismo el Tres veces Condenado, vuelve a ser libre".
 POD_gehenna_omens.1242.a:0 "¿Cómo van a satisfacer su hambre los Banu Haqim?"  
 POD_gehenna_omens.1242.a.tt:0 "Algo terrible ha sucedido".
 ¡POD_gehenna_omens.1242.a.tt.beast:0 "#R O algo maravilloso! #"
 POD_cult_of_izhim_ur_baal:0 "Culto a Izhim ur-Baal"
 
 POD_gehenna_omens.1244.t:0 "Gehenna: Fin anunciado de la Equidna"
 POD_gehenna_omens.1244.desc:0 "Hace mucho tiempo, los [scylla.GetHouse.GetBaseName] profetizaron la perdición de los [last_of_the_glycon.GetHouse.GetBaseName], así como su propia desaparición. En un esfuerzo inútil por evitar la profecía, los Guerreros intentaron destruir a las Brujas. El último de los Glycon, [last_of_the_glycon.GetFirstName] , ha matado al hijo de Echidna. Mientras [scylla.GetFirstName] se desmoronaba en el polvo, gritó una última profecía: "Bajo el pie de un esclavo se retorcerán las serpientes del Nilo". \Hay rumores de que algunas de las Brujas de Echidna aún sobreviven".
 POD_gehenna_omens.1244.a:0 "Atrae al guerrero para que se una a mi corte".
 POD_gehenna_omens.1244.a_success_glycon_1:0 "[last_of_the_glycon.GetFirstName] se une a tu corte."
 POD_gehenna_omens.1244.a.tt.beast:0 "#R ¡No! ¡Tiene hambre de nuestra sangre! Conocemos bien el hambre! #"
 POD_gehenna_omens.1244.b:0 "Ofrece refugio a las brujas"
 POD_gehenna_omens.1244.b_success_witch_1:0 "[witch_de_echidna_1.GetFirstName] se une a tu corte"
 POD_gehenna_omens.1244.b_success_witch_2:0 "[witch_of_echidna_2.GetFirstName] se une a tu corte."
 POD_gehenna_omens.1244.b_success_witch_3:0 "[witch_of_echidna_3.GetFirstName] se une a tu corte."
 POD_gehenna_omens.1244.b.tt.beast:0 "#R ¡Sí! ¡Atráelos aquí y luego toma su sangre!"
 POD_gehenna_omens.1244.c:0 "¡La profecía se ha cumplido! Los últimos tifonistas no son de mi incumbencia".
 POD_gehenna_omens.1244.c.tt.beast:0 "#R ¡Buena suerte! No vamos a derramar ninguna lágrima por estos cultistas condenados. #"
 
 POD_gehenna_omens.1251.notification:0 "Gehenna Omen: Segundo gran incendio de Lübeck"
 POD_gehenna_omens.1251.desc:0 "La ciudad de Lübeck sufre una segunda gran conflagración. Sus numerosos edificios de madera se convirtieron en cenizas. ¿Quizás deberían intentar construir con piedra?"

 POD_gehenna_omens.1252.notification:0 "Gehenna Omen: Inquisición de las Sombras"
 POD_gehenna_omens.1252.desc:0 "La Inquisición de la Sombra de la Iglesia Católica descubrió y destruyó a un vampiro Ventrue.\NEra demasiado arrogante para ser tan joven."

 POD_gehenna_omens.1253.notification:0 "Presagio de Gehenna: Fuego de Utrecht"
 POD_gehenna_omens.1253.desc:0 "Un Gran Incendio arrasa la ciudad de Utrecht en el condado de Nedersticht durante nueve noches, destruyendo la mayor parte de la ciudad.\N¿La Inquisición de la Sombra está quemando las ciudades para purgar a los Kindred?"

 POD_gehenna_omens.1257.notification:0 "Gehenna Omen: Erupción de Samalas"
 POD_gehenna_omens.1257.desc:0 "Muy al este, en la pequeña isla de Lombrok, ¡la montaña de Samalas ha explotado! Como Pompeya antes, la ciudad de Pamatan ha sido completamente destruida. A más de 200 millas de distancia, la ceniza cae sobre Java. El humo borra el sol".

 POD_gehenna_omens.1258.notification:0 "Presagio de Gehenna: Saqueo de Bagdad"
 POD_gehenna_omens.1258.desc:0 "El Ilkhanato mongol ha saqueado la gran ciudad de Bagdad. La ciudad está despoblada y arruinada. La Casa de la Sabiduría está destruida. El Tigris corre rojo por la sangre y negro por la tinta de los libros destruidos. Con la muerte de Al-Musta'sim, también muere el califato abasí".

 POD_gehenna_omens.1259.notification:0 "Presagio de Gehenna: El Gran Invierno de Avalon" 
 POD_gehenna_omens.1259.desc:0 "Comenzó con una misteriosa niebla seca y una nube persistente. El invierno en el norte ha sido especialmente severo. Una hambruna se ha extendido por las tierras del norte, con Gran Bretaña especialmente afectada. Veinte mil mortales mueren de hambre en Londres. ¿Es este el próximo invierno eterno de los Fae?"

 POD_gehenna_omens.1260.notification:0 "Gehenna Omen: La purga de Baybars" 
 POD_gehenna_omens.1260.desc:0 "En Egipto, el sultán de los mamelucos está iniciando una implacable purga contra los sobrenaturales no musulmanes. Las serpientes se esconden en sus agujeros".
 
 POD_gehenna_omens.1268.notification:0 "Presagio de Gehenna: Terremoto de Cilicia"
 POD_gehenna_omens.1268.desc:0 "El mismísimo suelo tembló, llevando la ruina a la ciudad de Adana. Más de sesenta mil mortales han muerto aplastados. Todos los edificios se han derrumbado".

 POD_gehenna_omens.1271.notification:0 "Presagio de Gehenna: Tercer gran incendio de Lübeck"
 POD_gehenna_omens.1271.desc:0 "Un tercer gran incendio quema una parte de la ciudad de Lübeck.  Los edificios de piedra salen mucho mejor parados que los de madera".
 
 POD_gehenna_omens.1287.t:0 "Gehenna: tras el diluvio de Lucian"
 POD_gehenna_omens.1287.desc:0 "En la noche de Santa Lucía, una enorme tormenta inunda la costa de Frisia. Ochenta mil personas arrastradas a ahogarse. Cientos de pueblos perdidos. Estando en el solsticio de invierno para las tierras del Norte, la inundación y la muerte masiva han ocurrido en el momento más ominoso, cuando la barrera entre los vivos y los muertos es más delgada. Varios profetas afines han aparecido en este caos con la intención de apoderarse de la praxis. Curiosamente, todos se llaman Lucy".
 POD_gehenna_omens.1287.a:0 "Las catástrofes naturales ocurren, no es la voluntad de los dioses, antiguos o nuevos".
 POD_gehenna_omens.1287.a.tt:0 "Los que recuerdan dicen que esta inundación fue peor que la Gran Inundación del Mar del Norte de Noord-Holland de 1212. La inundación de Noor-Holanda duró seis meses, pero el desastre de Santa Lucía se produjo en una sola noche. Es la peor inundación de la historia de Europa. Se forma un nuevo mar que una noche se llamará 'Zuiderzee'".
 POD_gehenna_omens.1287.a.tt.malk:0 "#MALKBLUE se ha visto como un rANGe en este bOOkMARK. #"
 POD_gehenna_omens.1287.b:0 "Lucía ha vuelto para traer la redención o la destrucción. Seré redimido!"
 POD_gehenna_omens.1287.b.tt:0 "En el siglo IV d.C., Santa Lucía llevaba comida a los cristianos que se escondían en las catacumbas bajo Roma, pero los muertos vivientes tenemos otras ideas sobre lo que ocurría allí. Lucía se curó mágicamente de una enfermedad gracias a las oraciones de Lucía. Lucía entonces se negó a casarse con un pagano con el que estaba comprometida. Los paganos intentaron quemarla en la hoguera, pero fracasaron.  La apuñalaron en la garganta con una lanza, pero ella no dejó de hablar. Le sacaron los ojos, pero se los devolvieron milagrosamente. No murió hasta que un sacerdote le dio los últimos derechos cristianos. Su cuerpo permaneció intacto en Sicilia durante 400 años. Luego las reliquias fueron trasladadas a Constantinopla para protegerlas de las incursiones sarracenas. Luego su cuerpo desapareció durante el saqueo de Constantinopla en 1204 y la ruina del sueño de Miguel.\N¿Por qué Dios ha vuelto a los caminos del Antiguo Testamento castigando a los hombres malvados de Frisia con este diluvio épico en la noche santa de Santa Lucía? Muchas de estas almas habían aceptado la fe de los Pescadores y buscan viajar al paraíso de las Orillas lejanas. Sante Lucía nos llama a volver al Camino del Cielo".
 POD_gehenna_omens.1287.b.tt.malk:0 "#MALKBLUE HOt CROss bUNs! ¡CRUZADO CALIENTE! Un centavo, un centavo, ¡unos cruces calientes! Si no tienes hijos, dáselos a tus hijos. Un peNNy, dos penNy, ¡no hay que crOsar!"
 POD_gehenna_omens.1287.c:0 "¡La Lussiferda cabalga de nuevo! Prepara mi corcel para acompañarla!"
 POD_gehenna_omens.1287.c.tt:0 "Los norteños tienen otro nombre para esta temible noche, 'Lussinatta'. Se dice que la Lussi, una especie de malvada sobrenatural femenina, cabalga por el aire con sus seguidores los Lussiferda. Los trolls, los espíritus malignos y los muertos se alzaban en masa para atacar a los mortales incautos en esa larga y oscura noche. Los niños son su comida favorita, y son arrebatados de sus hogares. Los hombres del norte permanecen despiertos toda la noche para vigilar sus hogares. Ahora, con esta devastación, muchos de estos norteños han muerto. La gente que practica las viejas costumbres siente su destino al servicio de Hel en Niflheim, donde sus almas construirán su flota para el Ragnarok".
 POD_gehenna_omens.1287.c.tt.malk:0 "#MALKBLUE ¡Mi sPEAR y MagIc hELmet! ¿Mi lanza y mi casco mágico? ¿Mi lanza y mi casco mágico? CASCO MÁGICO! casco mágico... ¡SÍ! CASCO MÁGICO Y TE DARÉ UN SAMPLAZO".
 POD_gehenna_omens.1287.d:0 "Alina es un avatar de Lilith, ¡contempla su brillo!"
 POD_gehenna_omens.1287.d.tt:0 "Lucy viene de la palabra latina 'lux' que significa portadora de luz. Su nombre griego es Alina. Lucía, Lussi, Lucifer o Alina... todas las manifestaciones de la divina Lilith. Con la magia de Lilith creando este diluvio en burla del Demiurgo, la sacerdotisa de Lilith ha venido a reclamar sus almas condenadas. Las Lamia responden a la llamada a las armas en este mundo y en las Tierras Sombrías".
 POD_gehenna_omens.1287.d.tt.malk:0 "#MALKBLUE ¡NO HAY QUE JODERSE DE LILIT! ¡LOL! Ok. Tal vez un poco de diversión... ¡ACK! ¡ErGh! ¡GuLP! #"
 POD_gehenna_omens.1287.e:0 "Frisia será gobernada por príncipes y leyes, no por cultistas de un dios muerto".
 POD_gehenna_omens.1287.e.tt:0 "Frisia será gobernada por príncipes y ley, no por cultistas de un dios muerto." 
 POD_gehenna_omens.1287.e.tt.malk:0 "#MALKBLUE ¡Todo el mundo necesita un JESTER! #"
 POD_gehenna_omens.1287.f:0 "Místico o no, esto no me importa. Sigo mi propio camino".
 POD_gehenna_omens.1287.f.tt.malk:0 "#MALKBLUE rOw yOUr BoAT, gEntLY DOWn tHe sCreAm #"
 
 
 






