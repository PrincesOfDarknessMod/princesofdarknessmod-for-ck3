 POD_artifacts_book_of_nod.100.t:0 "El libro de Nod"

 POD_artifacts_book_of_nod.100.t:0 "El libro de Nod"
 POD_artifacts_book_of_nod.100.desc:0 "Una colección de textos antiguos, considerados sagrados por los cainitas noddistas. Consiste en múltiples recensiones y fragmentos que han sido reensamblados por varios eruditos Kindred. Tradicionalmente, la transmisión principal de la historia de Caine es oral, mientras que los textos con los acontecimientos más importantes de la historia cainita están fuertemente custodiados para proteger a los cainitas. Hay que mencionar que, dejando a un lado las propias creencias personales, los textos y las notas que se han transmitido a lo largo de los años deben tratarse con gran precaución. Existen numerosos interrogantes abiertos sobre la historia del Libro de Nod. Se desconoce su autor, aunque a menudo se cita a Malkav, Saulot e incluso a Caine como autores de partes de él, si no de todo. Sin embargo, es posible que haya tenido muchos autores y editores a lo largo de los miles de años transcurridos desde la época de los acontecimientos que describe, lo que hace dudar mucho de su veracidad. Algunos consideran que todo el libro es un mito o una mentira, una historia inventada por los vampiros para explicar su existencia o una herramienta utilizada para engañar a los demás para que piensen y actúen de una determinada manera. A estas dudas se suma el hecho de que muchos de los escritos atribuidos al Libro de Nod son increíblemente vagos o contradictorios, y a veces parecen ser auténticos engaños, lo que crea algunos grandes (y a menudo violentos) cismas de interpretación entre los grupos noddistas. El fragmento más antiguo del Libro está fechado justo antes de la época de Sumer, alrededor del 4500 a.C.".
 POD_artifacts_book_of_nod.100.option.a:0 "Crónica de Caine"
 POD_artifacts_book_of_nod.100.option.b:0 "Crónica de las sombras"
 POD_artifacts_book_of_nod.100.option.c:0 "Crónica de los secretos"
 POD_artifacts_book_of_nod.100.option.d:0 "Cerrar el libro de Nod"
 POD_artifacts_book_of_nod.100.option.e:0 "Reunir la Crónica de Caine"
 POD_artifacts_book_of_nod.100.option.f:0 "Reúne el Libro de Nod"
 POD_artifacts_book_of_nod.200.t:0 "Crónica de Caine"
 POD_artifacts_book_of_nod.200.option.a:0 "primero de los tiempos"
 POD_artifacts_book_of_nod.200.desc:0 "Caine relata sus motivos que le llevaron a la maldición, dando su visión los acontecimientos que rodearon los días posteriores a la Caída del Hombre, y su historia de ser el Padre Oscuro."
 POD_artifacts_libro_de_nod.200.opción.a:0 "El primero de los tiempos"
 POD_artifacts_book_of_nod.200.option.b:0 "La llegada de Lilith"
 POD_artifacts_book_of_nod.200.option.c:0 "La magia de Lilith"
 POD_artifacts_book_of_nod.200.option.d:0 "La tentación de Caine"
 POD_artifacts_book_of_nod.200.option.e:0 "El cuento de Zillah"
 POD_artifacts_book_of_nod.200.option.f:0 "Cuento de la arpía"
 POD_artifacts_book_of_nod.200.option.g:0 "Cuento de la primera ciudad"
 POD_artifacts_book_of_nod.200.option.h:0 "Tabla de contenidos"
 POD_artifacts_book_of_nod.300.t:0 "Crónica de las sombras"
 POD_artifacts_book_of_nod.300.desc:0 "Crónica de 'El libro de Nod'. Una colección de trozos y fragmentos que se discute que incluso formen parte del Libro de Nod. Hay analistas que afirman que esta sección había sido diluida por los eruditos y escritores de Cartago, que se tomaron licencias poéticas para escribir las 'Leyes de Caine'. Incluso se ha dicho que la Crónica de las Sombras no es más que una colección de propaganda creada por la Camarilla para apoyar su tiránico reinado. Mientras que algunos creen que se trata de una elaborada broma de los Malkavian, otros creen que estos textos proceden directamente del propio Padre Oscuro, especialmente los trece mandamientos que se entregaron en tablillas auténticamente envejecidas."
 POD_artifacts_book_of_nod.300.desc.notale:0 "No posees una copia de la 'Crónica de las Sombras'".
 POD_artifacts_book_of_nod.300.option.a:0 "Seguir leyendo"
 POD_artifacts_book_of_nod.400.t:0 "Crónica de los secretos"
 POD_artifacts_book_of_nod.400.desc:0 "Crónica del 'Libro de Nod'. Contiene profecías y visiones de un evento llamado Gehenna. Parece que las preocupaciones de este evento se han transmitido de generación en generación y han causado una onda de paranoia y miedo que sigue reverberando a través de los Cainitas y los Canaille."
 POD_artifacts_book_of_nod.400.desc.notale:0 "No posees una copia de la "Crónica de los secretos"."
 POD_artifacts_book_of_nod.500.desc:0 "Sueño con los primeros tiempos\nel recuerdo más largo\nHablo de los primeros tiempos\ndel Padre más anciano\nCanto de los primeros tiempos\ny el amanecer de las Tinieblas\nEn Nod\ndonde la luz del Paraíso\niluminó el cielo nocturno\ y las lágrimas de nuestros padres mojaron la tierra.\n\nCada uno de nosotros, a su manera,\nnos dispusimos a vivir\nya tomar nuestro sustento de la tierra."
 POD_artifacts_book_of_nod.400.option.a:0 "Seguir leyendo"
 POD_artifacts_book_of_nod.500.t:0 "El primero de los tiempos"
 POD_artifacts_book_of_nod.500 .desc:0 "Sueño con los primeros tiempos\nla memoria más larga\nHablo de los primeros tiempos\ndel Padre más antiguo\nCanto de los primeros tiempos\ny del amanecer de las tinieblas\nen Nod, donde la luz del Paraíso\niluminaba el cielo nocturno\ny las lágrimas de nuestros padres\nmojaban el suelo.\nCada uno, a su manera,\nse dispone a vivir\ny a tomar nuestro sustento de la tierra."
 POD_artifacts_book_of_nod.500.desc.notale:0 "No posees una copia del 'Primero de los tiempos'". 
 POD_artifacts_book_of_nod.510.desc:0 "Y yo, Caín primogénito, yo,\ncon cosas afiladas\nplanté las semillas oscuras\nlas mojé en la tierra\nlas cuidé, las vi crecer\nY Abel, el segundo nacido Abel\ncuidé a los animales\nay sus sangrientos partos\nalimentados ellos, los vi crecer.\nLo amaba, mi Hermano\nÉl era el más brillante, el más dulce, el más fuerte.\nÉl era la primera parte de toda mi alegría."
 POD_artifacts_book_of_nod.500.option.a:0 "Continúa leyendo El primero de los tiempos"
 POD_artifacts_book_of_nod.500.option.b:0 "Vuelve a la Crónica de Caine"
 POD_artifacts_book_of_nod.520.desc:0 "Entonces un día nuestro Padre nos dijo.\nCaín, Abel a El de Arriba\ndebes hacer un sacrificio -\na ofrenda de la primera parte\nde todo lo que tienes\nY yo, Caín primogénito,\njunté la tierna da\nlos frutos más brillantes\nla hierba más dulce\nY Abel, segundogénito, Abel\nsacrifico al más joven,\nel más fuerte,\nel más dulce de sus animales."
 POD_artifacts_book_of_nod.510.t:0 "El primero de los tiempos, continuación"
 POD_artifacts_book_of_nod.530.desc:0 "En el altar de nuestro Padre\ncolocamos nuestros sacrificios\ny encendimos fuego debajo de ellos\ny vimos cómo el humo los llevaba\nhasta el de Arriba\n\nEl sacrificio de Abel, el segundo hijo,\nolía dulce al de Arriba\n y Abel fue bendecido.\nY yo, el primogénito Caín,\nfui herido desde el más allá\por una palabra áspera y una maldición,\nporque mi sacrificio era indigno."
 POD_artifacts_book_of_nod.510 .desc:0 "Y yo, primogénito de Caine, yo, con cosas afiladas, planté las semillas oscuras, las mojé en la tierra, las cuidé, las vi crecer, y Abel, el segundo, cuidó a los animales, ayudó a sus sangrientos nacimientos, los alimentó, los vio crecer, lo amé, mi hermano, fue el más brillante, el más dulce, el más fuerte, fue la primera parte de toda mi alegría".
 POD_artifacts_book_of_nod.540.desc:0 "Miré el sacrificio de Abel, todavía humeante, la carne, la sangre.\nLloré, me tapé los ojos\nRecé de noche y de día.\n\nY cuando el Padre dijo\nHa llegado otra vez la hora del Sacrificio\nY Abel guió su más joven,\nsu más dulce,\nsu más amado\nal fuego del sacrificio\nNo traje a mi más joven,\nmi más dulce,\nporque sabía que el de Arriba no los querría."
 POD_artifacts_book_of_nod.510.option.b:0 "Pasaje anterior"
 POD_artifacts_book_of_nod.550.desc:0 "Y mi hermano, el amado Abel me dijo\n'Caín, no trajiste un sacrificio,\na regalo de la primera parte de tu alegría,\npara quemar en el altar del Arriba.'\n\nLloré lágrimas de amor como yo, con cosas afiladas,\nsacrifiqué lo que fue la primera parte de mi alegría,\nhermano mío.\n\nY la Sangre de Abel cubrió el altar\ny olía dulce como quemada."
 POD_artifacts_book_of_nod.520.t:0 "Primera de las veces, continuación"
 POD_artifacts_libro_de_la_nod.520 .desc:0 "Entonces, un día, nuestro Padre nos dijo: Caine, Abel, a Él, debes hacer un sacrificio, un regalo de la primera parte de todo lo que tienes. Y yo, primogénito de Caine, recogí los brotes tiernos, los frutos más brillantes, la hierba más dulce. Y Abel, el segundo, sacrificó el más joven, el más fuerte, el más dulce de sus animales."
 POD_artifacts_book_of_nod.530.t:0 "El primero de los tiempos, continuación"
 POD_artifacts_book_of_nod.600.desc:0 "Estaba solo en la oscuridad\nY me dio hambre.\nEstaba solo en la oscuridad\nY me dio frío.\nEstaba solo en la oscuridad\nY lloré.\n\nEntonces me llegó una dulce voz,\ na voz de miel,\nPalabras de socorro.\nPalabras de cese.\n\nUna mujer, morena y hermosa,\ncon ojos que atravesaron la Oscuridad\nvino a mí.\n\n"
 POD_artifacts_book_of_nod.530 .desc:0 "En el altar de nuestro Padre pusimos nuestros sacrificios y encendimos fuego bajo ellos y vimos cómo el humo los llevaba hasta el de arriba. El sacrificio de Abel, el segundo nacido, sonó dulce para el de arriba y Abel fue bendecido. Y yo, el primogénito Caine, fui golpeado desde el más allá por una palabra dura y una maldición, porque mi sacrificio fue indigno."
 POD_artifacts_book_of_nod.540.t:0 "El primero de los tiempos, continuación"
 POD_artifacts_book_of_nod.540 .desc:0 "Miré el sacrificio de Abel, todavía humeante, la carne, la sangre.\NLloré, me tapé los ojos\Ny recé de noche y de día. \Y cuando el Padre dijo: "El tiempo del sacrificio ha llegado de nuevo" Y Abel llevó a su más joven, a su más dulce, a su más amado, al fuego del sacrificio. No llevé a mi más joven, a mi más dulce, porque sabía que el de arriba no los querría."
 POD_artifacts_book_of_nod.610.desc:0 "Conozco tu historia. Caine of Nod.'\nDijo ella, sonriendo.\n'Tienes hambre. ¡Ven! Tengo comida.\nTienes frío. ¡Ven! Tengo ropa.\nEstás triste. ¡Ven! Tengo consuelo.\n\n'¿Quién consolaría a un Maldito como yo?\n¿Quién me vestiría a mí?\n¿Quién me daría de comer?'\n\n'Soy la primera esposa de tu Padre,\nque no estuvo de acuerdo con el de Arriba \ny obtuve Libertad en la Oscuridad.\nSoy Lilith."
 POD_artifacts_book_of_nod.550.t:0 "El primero de los tiempos, continuación"
 POD_artifacts_book_of_nod.550 .desc:0 "Y mi hermano, el amado Abel, me dijo: 'Caine, no trajiste un sacrificio,\nun regalo de la primera parte de tu alegría,\npara que arda en el altar de Aquel que está arriba'.\NLloré lágrimas de amor mientras, con cosas afiladas,\Nsacrificaba lo que era la primera parte de mi alegría,\Nmi hermano.\NY la Sangre de Abel cubrió el altar\Ny olía dulce mientras ardía." 
 POD_artifacts_book_of_nod.560.t:0 "El primero de los tiempos, continuación"
 POD_artifacts_book_of_nod.700.desc:0 "Y moré por un tiempo en la Casa de Lilith\ny le pregunté\n'De la Oscuridad,\n¿cómo construiste este lugar?\n¿Cómo hiciste ropa?\n¿Cómo cultivaste comida?'\n\nY Lilith sonrió y dijo.\n'A diferencia de ti, estoy Despierto.\nVeo los hilos que giran\nalrededor de ti, hago lo que\nnecesito a partir del poder.'"
 POD_artifacts_book_of_nod.560.desc:0 "Pero mi Padre dijo: "Maldito seas, Caine, que mataste a tu hermano. Así como yo fui expulsado, tú también lo serás". Y me exilió a vagar en la oscuridad, en la tierra de Nod. Volé en la oscuridad y no vi ninguna fuente de luz y tuve miedo.
 POD_artifacts_book_of_nod.600.t:0 "La llegada de Lilith"
 POD_artifacts_book_of_nod.600 .desc:0 "Estuve solo en la oscuridad y me dio hambre. Estuve solo en la oscuridad y me dio frío. Estuve solo en la oscuridad y lloré. \Entonces vino a mí una dulce voz, una voz de miel, palabras de socorro, palabras de alivio. Una mujer, oscura y hermosa, con ojos que atravesaban la oscuridad, vino a mí.
 POD_artifacts_book_of_nod.600.desc.notale:0 "No posees una copia de 'La llegada de Lilith'".  
 POD_artifacts_book_of_nod.600.option.a:0 "Continúa leyendo Coming of Lilith"
 POD_artifacts_book_of_nod.610.t:0 "El advenimiento de Lilith, continuación"
 POD_artifacts_book_of_nod.610.desc:0 "'Conozco tu historia. Caine de Nod.'\NDijo, sonriendo.\N-Estás hambriento. Ven. Tengo comida. Tienes frío. Tienes frío. ¡Ven! Tengo ropa. Estás triste. Vengan. Tengo consuelo. ¿Quién consolaría a una maldita como yo? ¿Quién me vestiría? ¿Quién me alimentaría? Soy la primera esposa de tu padre, que no estuvo de acuerdo con el de arriba y obtuvo la libertad en la oscuridad.
 POD_artifacts_book_of_nod.620.t:0 "Venida de Lilith, continuación"
 POD_artifacts_book_of_nod.620.desc:0 "'Una vez, tuve frío y no hubo calor para mí.\NUna vez. Una vez, tuve hambre y no había comida para mí.\NUna vez, estuve triste, y no había consuelo para mí.'\NMe acogió, me alimentó.\NMe vistió.\NEn sus brazos. Lloré hasta que la sangre goteó de mis ojos y ella los besó".
 POD_artifacts_book_of_nod.700.t:0 "La magia de Lilith"
 POD_artifacts_book_of_nod.700 .desc:0 "Y habité durante un tiempo en la Casa de Lilith y le pregunté: "Desde la oscuridad, ¿cómo has construido este lugar? ¿Cómo has hecho la ropa? ¿Cómo has cultivado la comida?" Y Lilith sonrió y dijo: "A diferencia de ti, yo estoy despierta. Veo los hilos que giran a tu alrededor, y hago lo que necesito del poder".
 POD_artifacts_book_of_nod.700.desc.notale:0 "No posees una copia de la 'Magia de Lilith'". 
 POD_artifacts_book_of_nod.700.option.a:0 "Seguir leyendo La magia de Lilith"
 POD_artifacts_book_of_nod.710.t:0 "La magia de Lilith, continuación"
 POD_artifacts_book_of_nod.810.desc:0 "Y le dije a Miguel,\n'No por la gracia (del Uno de Arriba), sino por la mía propia\nviviré, con orgullo.'\n\nMiguel me maldijo, diciendo\n'Entonces, mientras tú camina por esta tierra,\ntú y tus hijos temeréis mi llama viva,\nque morderá hondo y saboreará vuestras carnes'\n\nY en la mañana, Rafael llegó con alas refulgentes,\nluz sobre el horizonte,\nel conductor de el Sol,\nhacia el Este."
 POD_artifacts_book_of_nod.710.desc:0 "'Despiértame, entonces, Lilith'. Dije: 'Necesito este poder'. 'Entonces, podré hacer mi propia ropa, hacer mi propia comida, hacer mi propia casa'. 'La preocupación arrugó el ceño de Lilith'. 'No sé lo que el Despertar hará por ti, porque estás realmente maldita por tu Padre'. 'Podrías morir'. 'Podrías cambiar para siempre'".
 POD_artifacts_book_of_nod.720.t:0 "La magia de Lilith continúa"
 POD_artifacts_book_of_nod.720.desc:0 "Caine dijo: 'Aun así, una vida sin Poder no merecerá la pena ser vivida.\NMoriría sin tus dones.\NNo viviré como tu Thrall.'\NLilith me amaba, y yo lo sabía.\NLilith haría lo que le pidiera,\Naunque no lo deseara." 
 POD_artifacts_book_of_nod.830.desc:0 "Rafael me maldijo, diciendo\n'Entonces, mientras camines por esta tierra,\ntú y tus hijos temerán el amanecer,\ny los rayos del sol buscarán quemarte como el fuego,\ndondequiera que te escondas, siempre.\n nEscóndanse ahora, porque el Sol sale para tomar su ira sobre ustedes.\n\nPero encontré un lugar secreto en la tierra\ny me escondí de la luz ardiente del Sol.\nEn lo profundo de la tierra, dormí hasta que la Luz del Mundo estaba escondido detrás de la montaña de la Noche."
 POD_artifacts_book_of_nod.730.t:0 "Magia de Lilith, continuación"
 POD_artifacts_book_of_nod.730.desc:0 "Y así, Lilith, Lilith de ojos brillantes, me despertó.\NSe cortó a sí misma con un cuchillo, \Ny se me metió en un cuenco.\NBebí profundamente. Fue dulce.\NY entonces caí en el Abismo.\NCaí para siempre, cayendo\Nen la más profunda oscuridad".  
 
 POD_artifacts_book_of_nod.850.desc:0 "Y luego, a través del terror, Uriel\nDios Todopoderoso me maldijo, diciendo\n'Entonces, mientras camines por esta tierra,\ntú y tus hijos se aferrarán a la Oscuridad\nSolo beberás sangre\nComerás solo cenizas\nTú será siempre como eras en la muerte,\nnunca muriendo, viviendo.\nCaminarás para siempre en la Oscuridad,\ntodo lo que toques se desmoronará en nada,\nhasta los últimos días.'"
 POD_artifacts_book_of_nod.800.t:0 "Tentación de Caine"
 POD_artifacts_book_of_nod.800.desc:0 "Y de las tinieblas surgió una luz resplandeciente: fuego en la noche.\NY el arcángel Miguel se me reveló.\NNo tuve miedo. Le pregunté por su asunto.\NMichael, General del Cielo, portador de la Santa Llama,\Nme dijo:\NHijo de Adán, hijo de Eva, tu crimen es grande,\Ny sin embargo la misericordia de mi Padre también es grande.\N¿No te arrepentirás del mal que has hecho, y dejarás que su misericordia te lave?"
 POD_artifacts_book_of_nod.800.desc.notale:0 "No posees una copia de la 'Tentación de Caine'".  
 POD_artifacts_book_of_nod.800.option.a:0 "Seguir leyendo La tentación de Caine"
 POD_artifacts_book_of_nod.810.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.875.desc:0 "Y con eso, la oscuridad se levantó\n como un velo\n y la única luz eran los ojos brillantes de Lilith.\n\nMirando a mi alrededor, supe\nque había despertado.\nCuando mis energías\nsurgieron por primera vez a través de mí\nI descubrí\ncómo moverme como un relámpago\ncómo tomar prestada la fuerza de la tierra\ncómo ser como una piedra\nEstos fueron como respirar una vez para mí."
 POD_artifacts_book_of_nod.810 .desc:0 "Y le dije a Michael,\n "No por la gracia de (el de arriba), sino por la mía propia\nviviré, con orgullo. '\NMichael me maldijo, diciendo\N "Entonces, mientras camines por esta tierra,\Ntú y tus hijos temerán mi llama viviente,\Ny morderá profundamente y saboreará tu carne'\NY en la mañana, Rafael vino con alas de cordero,\Nluz sobre el horizonte, el conductor del Sol,\Nhacia el Este." 
 POD_artifacts_book_of_nod.820.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.820.desc:0 "Rafael habló, diciendo: "Caine, hijo de Adán, hijo de Eva, tu hermano Abel te perdona tu pecado, ¿no te arrepentirás y aceptarás la misericordia del Todopoderoso?" Y le dije a Rafael: "No por el perdón de Abel, sino por el mío, seré perdonado".  
 POD_artifacts_book_of_nod.830.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.830 .desc:0 "Rafael me maldijo, diciendo: "Entonces, mientras camines por esta tierra, tú y tus hijos temerán el amanecer, y los rayos del sol buscarán quemarte como el fuego, dondequiera que te escondas, siempre. \Pero yo encontré un lugar secreto en la tierra y me escondí de la luz ardiente del Sol. En lo profundo de la tierra, dormí hasta que la Luz del Mundo se ocultó tras la montaña de la Noche".
 POD_artifacts_book_of_nod.840.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.840.desc:0 "Cuando desperté de mi día de sueño, oí el sonido de unas suaves alas que se precipitaban y vi las alas negras de Uriel que me rodeaban... Uriel, el segador, el Ángel de la Muerte, el Uriel oscuro que habita en la oscuridad.\NUriel me habló en voz baja, diciendo: 'Hijo de Adán. Hijo de Eva. Dios Todopoderoso te ha perdonado tu pecado. ¿Aceptarás su misericordia y me dejarás llevarte a tu recompensa, ya sin maldición?"\NY le dije a Uriel, el de las alas oscuras,\Nno por la misericordia de Dios, sino por la mía, viviré.\NSoy lo que soy, hice lo que hice,\Ny eso nunca cambiará".
 POD_artifacts_book_of_nod.900.desc:0 "Déjame contarte la historia de Zillah\nprimera amada de Caín,\nprimera esposa de Caín,\nla sangre más dulce,\nla piel más suave,\nlos ojos más claros\n\nSolo de los Chiquillos más nuevos de Caín,\nCaín la deseaba,\ny ella no tuvo en cuenta su deseo, apartándose de Él.\nNi regalos, ni sacrificios, ni perfumes, ni palomas,\nni bellas bailarinas, ni cantores, ni bueyes,\nni escultura, ni ropa hermosa,\nnada cambiaría el de Zillah. corazón\nde hueso a fruta dulce."
 POD_artifacts_book_of_nod.850.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.850 .desc:0 "Y entonces, a través del temible Uriel, Dios Todopoderoso me maldijo, diciendo: "Entonces, mientras camines por esta tierra, tú y tus hijos se aferrarán a la Oscuridad, sólo beberán sangre, sólo comerán cenizas, siempre serán como eran al morir, nunca morirán, seguirán viviendo". 
 POD_artifacts_book_of_nod.860.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.910.desc:0 "Así que Caín se tiró de la barba\ny tiró de su cabello\ny empezó a vagar por el desierto\en la noche, pensando en ella,\nardiendo por ella,\ny una noche Caín se encontró\n con la vieja Bruja cantándole a la luna.\n \nCaine le dijo a la Vieja,\n"¿Por qué cantas así?"\nY la Vieja respondió:\n'Porque anhelo lo que no puedo tener...'"
 POD_artifacts_book_of_nod.860.desc:0 "Di un grito de angustia ante esta terrible maldición y desgarré mi carne.\NLloré sangre,\Ncogí las lágrimas en una copa\Ny las bebí.\NCuando levanté la vista de mi trago de dolor\Nse me apareció el arcángel Gabriel\nGabriel, Señor de la Misericordia."  
 POD_artifacts_book_of_nod.870.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.870.desc:0 "El arcángel Gabriel me dijo: "Hijo de Adán, hijo de Eva, he aquí que la misericordia del Padre es más grande de lo que jamás podrás conocer, porque incluso ahora hay un camino abierto, un camino de misericordia, y lo llamarás Golconda.
 POD_artifacts_book_of_nod.930.desc:0 "La noche siguiente, Caine encontró a la Anciana durmiendo sobre una roca.\n'Despierta, Anciana', dijo Caine.\n'He regresado.\n\nLa Anciana abrió un ojo y dijo:\n'Sueño con el solución para ti esta noche. Bebe una vez más de mí,\ny regresa mañana por la noche.\nTrae un cuenco de arcilla.\nTrae un cuchillo afilado.\nTendré tu respuesta entonces.'"
 POD_artifacts_book_of_nod.875.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.875 .desc:0 "Y con eso, la oscuridad se levantó como un velo y la única luz eran los brillantes ojos de Lilith. Mirando a mi alrededor, supe que había despertado. Cuando mis energías surgieron por primera vez a través de mí, descubrí cómo moverme como un rayo, cómo tomar prestada la fuerza de la tierra, cómo ser como una piedra."  
 POD_artifacts_book_of_nod.880.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.880.desc:0 "Lilith me mostró entonces cómo se esconde de los cazadores, cómo ordena obediencia y cómo exige respeto. Entonces, despertando aún más, encontré la manera de alterar las formas, la manera de tener dominio sobre los animales, la manera de hacer que los ojos vean"   
 POD_artifacts_book_of_nod.885.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.885.desc:0 "Entonces Lilith me ordenó que me detuviera, diciendo que había sobrepasado mis límites, que había ido demasiado lejos, que amenazaba mi propia esencia. Usó sus poderes y me ordenó que me detuviera. Debido a su poder, le hice caso, pero en lo más profundo de mi ser se plantó una semilla de rebeldía, y cuando ella me dio la espalda, me abrí una vez más a la Noche, y vi las infinitas posibilidades en las estrellas, y supe que un camino de poder, un camino de Sangre, era mío, y así desperté en mí este Camino Final, del que crecerían todos los demás caminos".    
 POD_artifacts_book_of_nod.890.t:0 "Tentación de Caine, continuación"
 POD_artifacts_book_of_nod.890.desc:0 "Con este nuevo poder, rompí las ataduras que la Dama de la Noche me impuso. Abandoné a la Reina Condenada esa noche, cubriéndome de sombras, y huí de las tierras de Nod y llegué por fin a un lugar donde ni siquiera sus demonios pudieron encontrarme."
 POD_artifacts_book_of_nod.900.t:0 "El cuento de Zillah"
 POD_artifacts_book_of_nod.900 .desc:0 "Permíteme contar la historia de Zillah, la primera amada de Caine, la primera esposa de Caine, la sangre más dulce, la piel más suave, los ojos más claros... Solo entre los nuevos hijos de Caine, Caine la deseó, y ella no tuvo en cuenta su deseo, alejándose de él. \N - Ni regalos, ni sacrificios, ni perfumes, ni palomas,\Nni hermosas bailarinas, ni cantantes, ni bueyes,\Nni esculturas, ni hermosas ropas,\Nnnnnnada convertiría el corazón de Zillah\Nde piedra en dulce fruto".
 POD_artifacts_book_of_nod.900.desc.notale:0 "No tienes una copia de 'El cuento de Zillah'"
 POD_artifacts_book_of_nod.1000.desc:0 "Durante un año y un día\nCaín trabajó al servicio\nde la Anciana, quien con sangre-sabiduría.\nlo ató tan seguramente como a cualquier prisionero.\nElla lo visitaba por la noche\nlo obligaba a entregar su sangre\npor su secreto elixires\ny potentes fórmulas\nElla tomaría su Childer's Childer,\ny nunca más se supo de ellos.\n\nPero Caine era sabio. Él no bebió de ella nunca más.\nY ella no se lo pidió, pensando\nque él alguna vez estuvo en su Esclavo."
 POD_artifacts_book_of_nod.900.option.a:0 "Seguir leyendo el cuento de Zillah"
 POD_artifacts_book_of_nod.910.t:0 "El cuento de Zillah, continuación"
 POD_artifacts_book_of_nod.910 .desc:0 "Así que Caine se tiró de la barba y se rasgó el pelo y se dedicó a vagar por el desierto por la noche, pensando en ella, ardiendo por ella, y una noche Caine se encontró con una vieja arpía cantando a la luna.  
 POD_artifacts_book_of_nod.920.t:0 "El cuento de Zillah, continuación"
 POD_artifacts_book_of_nod.920.desc:0 "Caine dijo a la Arpía,\n'Yo también anhelo. ¿Qué se puede hacer? \La Arpía sonrió y dijo: "Bebe de mi sangre esta noche, Caine, padre de la familia, y vuelve mañana por la noche. Entonces te contaré la sabiduría de la Luna".
 POD_artifacts_book_of_nod.930.t:0 "El cuento de Zillah, continuación"
 POD_artifacts_book_of_nod.930.desc:0 "La noche siguiente, Caine encontró a la Arpía durmiendo en una roca.\N-Despierta, Arpía, dijo Caine.\N-He regresado.\N-La Arpía abrió un ojo y dijo,\N-Sueño con la solución para ti esta noche. Bebe una vez más de mí, y vuelve mañana por la noche. Trae un cuenco de arcilla. Trae un cuchillo afilado.
 POD_artifacts_book_of_nod.1030.desc:0 "Porque Caín, el sabio Caín\nno se había alimentado de ella durante un año y un día\ny porque forzó su Voluntad a través\nde sus manos, rompió el Vínculo que ella\ntenía sobre él, y cambió su fortuna.\n\nElla se rió de nuevo , mientras la sangre brotaba\ny brotaba de su boca.\nSus ojos derramaban odio.\nCaine la besó una vez,\besó sus labios fríos y marchitos,\ny la dejó allí\ncon la dulce sonrisa de Raphael: el sol que sale."
 POD_artifacts_book_of_nod.940.t:0 "El cuento de Zillah, continuación"
 POD_artifacts_book_of_nod.940.desc:0 "Una vez más. Cuando Caine regresó a la noche siguiente, la Arpía lo miró y sonrió: "Saludos, Señor de la Bestia", dijo la Arpía. \Tengo la sabiduría que buscas. Toma un poco de mi sangre, en el cuenco que tienes, y mezcla estas bayas y estas hierbas, y bebe profundamente el elixir". 
 POD_artifacts_book_of_nod.950.t:0 "Zillah's Tale, continued"
 POD_artifacts_book_of_nod.950.desc:0 "'Serás irresistible.\NSerás potente.\NSerás magistral.\NSerás ardiente.\NSerás resplandeciente.\NEl corazón de Zillah se derretirá\Ncomo las nieves en primavera.'\NY así. Caine bebió del elixir de la Arpía, porque estaba tan enamorado de Zillah, y deseaba tanto su amor a cambio".
 POD_artifacts_book_of_nod.960.t:0 "El cuento de Zillah, continuación"
 POD_artifacts_book_of_nod.960.desc:0 "Y la Arpía se rió. La Arpía se rió en voz alta. ¡Lo había engañado! ¡Lo había atrapado! Caine se enfadó muchísimo. Caine extendió sus poderes para destrozar a la Arpía con su fuerza. La Arpía cacareó y dijo: "No lo hagas". 'Ámame'. Y Caine no pudo hacer nada más que mirar fijamente sus antiguos ojos, desear su piel curtida.\NLa Arpía se rió y dijo: 'Hazme inmortal'. Y Caine la abrazó. Ella volvió a cacarear, a reír con el puro éxtasis del Abrazo, porque no le dolía". 
 POD_artifacts_book_of_nod.1100.desc:0 "Al principio solo estaba Caín\nCaín que sacrificó a su hermano por\namor.\nCaín que fue expulsado.\nCaín que fue maldecido para siempre con la inmortalidad.\nCaín que fue maldecido con la sed de sangre,\nEs Caín de a quien todos venimos,\nEl Sire de Nuestro Sire.\n\nPor el paso de una era vivió en la tierra de Nod.\nEn soledad y sufrimiento\nDurante un eón permaneció solo\nPero el paso de la memoria ahogó su pena."
 POD_artifacts_book_of_nod.1100.desc.notale:0 "No tienes una copia del 'Cuento de la Primera Ciudad'"
 POD_artifacts_book_of_nod.970.t:0 "El cuento de Zillah, continuación"
 POD_artifacts_book_of_nod.970.desc:0 "'Te he hecho poderoso'. Caine de Enoch, Caine de Nod, pero siempre estarás ligado a mí. Tu sangre, tan potente como es ahora, unirá a aquellos que la beban, como tú hiciste, una vez por noche durante tres noches. \Porque aunque Zillah te ame, como tú querías, tú me amarás a mí, para siempre. Ve ahora, y reclama a tu encantadora novia. Yo te esperaré en los lugares más oscuros, mientras preparo más pociones para tu salud". 
 POD_artifacts_book_of_nod.1110.desc:0 "Y así volvió al mundo de los mortales,\nal mundo que había creado su hermano Set, el tercero de Eva,\ny los hijos de Set.\nRegresó y fue bienvenido.\nPorque nadie se volvería contra él,\ndebido a la marca que fue puesta sobre él.\n\nEl pueblo vio su poder y lo adoró,\nSe hizo poderoso, y su poder era fuerte,\nsus caminos de temor y mando eran grandes\nY los Hijos de Set lo hicieron Rey\n no de su gran Ciudad, La Primera Ciudad."
 POD_artifacts_book_of_nod.980.t:0 "El cuento de Zillah, continuación"
 POD_artifacts_book_of_nod.1115.desc:0 "Pero Caín se volvió solitario en su Poder.\nEn lo profundo de él, la semilla de la soledad floreció y creció una flor oscura\nVio dentro de su sangre la potencia de la fertilidad\nAl invocar demonios y escuchar la sabiduría susurrada\nAprendió la manera de haz un hijo para sí.\nLlegó a conocer su poder y, al hacerlo,\ndecidió Abrazar a uno de los que estaban cerca de él."
 POD_artifacts_book_of_nod.980.desc:0 "Y así, con el corazón encogido, Caine regresó a Enoch.Y cada noche, durante tres noches, Zillah bebió de su Sire, aunque ella no lo sabía.Y, en la tercera noche, Caine anunció que se casaría con Zillah, su dulce Childe, y ella aceptó." 
 POD_artifacts_book_of_nod.1000.t:0 "Cuento de la Arpía"
 POD_artifacts_book_of_nod.1000 .desc:0 "Durante un año y un día, Caine trabajó al servicio de la Arpía, que con la sabiduría de la sangre lo ató con tanta seguridad como a cualquier prisionero. Lo visitaba por la noche y lo obligaba a entregar su sangre por sus elixires secretos y potentes fórmulas. No volvió a beber de ella nunca más.\NY ella no le pidió que lo hiciera, pensando\Nen que él siempre estaba en su Trono".
 POD_artifacts_book_of_nod.1125.desc:0 "Aún así, Caín sabía lo que debía hacer, y un joven\llamado Enoch, que era el más querido de los parientes de Seth,\nsuplicó ser hecho Hijo del Padre oscuro.\n\nY Caín, aunque estaba consciente de las palabras de Uriel ,\nse apoderó de Enoch y lo envolvió en el Abrazo oscuro.\n\nY así sucedió que Caín engendró\nEnoch y, al hacerlo, nombró a la Primera Ciudad Enoch."
 POD_artifacts_book_of_nod.1000.desc.notale:0 "No tienes una copia del 'Cuento de la Arpía'"
 POD_artifacts_book_of_nod.1130.desc:0 "Y al hacerlo, Enoc pidió un hermano,\una hermana, y Caín, Padre indulgente,\nse los dio, y sus nombres fueron\nZillah, cuya sangre era la más favorecida de Caín,\ne Irad, cuya fuerza sirvió El brazo de Caín.\n\nY estos Vástagos de Caín aprendieron las formas\nde hacer Progenie propia, y\nAbrazaron a más parientes de Seth, sin pensar.\n\nY luego dijo el sabio Caín. 'El fin de este crimen.\nNo habrá más.'\nY como la palabra de Caín era la ley, su Linaje lo obedeció."
 POD_artifacts_book_of_nod.1000.option.a:0 "Seguir leyendo el cuento de la arpía"
 POD_artifacts_book_of_nod.1010.t:0 "Cuento de la Arpía, continuación"
 POD_artifacts_book_of_nod.1010.desc:0 "Una noche. Caine fue a la Arpía en el bosque.\Ny le contó los terribles sueños que tenía mientras dormía.\N-Temo por mi vida, Arpía.\N-Temo la profecía de Uriel,\Ny la lujuria de mis Hijos por mi sangre. \Y la Arpía se acercó a un árbol hecho de madera de topo, y rompió una rama. Tomó un cuchillo afilado y afiló la rama".
 POD_artifacts_book_of_nod.1140.desc:0 "Luego vino el gran Diluvio, una gran inundación que arrasó el mundo.\nLa ciudad fue destruida,\nlos hijos de Set con ella.\n\nOtra vez, Caín cayó en gran tristeza y se quedó solo.\nY nos dejó, su Descendencia, para nuestros propios fines.\nLo encontramos, después de mucho buscar, en las profundidades de la tierra,\ny nos ordenó que fuéramos, diciendo que el Diluvio era un castigo,\npor haber regresado al mundo de la vida\nY subvertir la ley verdadera.\nNos pidió que fuéramos, para poder dormir."
 POD_artifacts_book_of_nod.1020.t:0 "Cuento de la Arpía, continuación"
 POD_artifacts_book_of_nod.1145.desc:0 "Así que regresamos solos para encontrar a los hijos de Noé,\ny anunciamos que éramos los nuevos gobernantes.\n\nCada uno creó una progenie, para reclamar la gloria de Caín,\npero no teníamos su sabiduría ni su moderación.\ nSe libró una gran guerra, los Ancianos contra sus Hijos,\ntal como había dicho Uriel, y los Hijos mataron a sus padres.\nSe levantaron. Fuego y leña usados. Espadas y garras.\nPara destruir a quienes las habían creado.\n\nLos rebeldes construyeron una nueva ciudad. Fuera del Imperio caído, reunieron a los Trece clanes que habían sido dispersados ​​por la Gran Guerra y los reunieron a todos,"
 POD_artifacts_book_of_nod.1020.desc:0 "'Toma este trozo de madera viva,\nafilado, fuerte,\npierde el corazón de tu hijo díscolo.\NLo dejará quieto,\Ny será tuyo para que lo mandes.\NEn lugar de deleitarse con la sangre de tu corazón,\Nsentirá el peso de tu justicia.'\NCaine dijo. "Gracias, Madre", y con eso, moviéndose con movimientos rápidos, Caine tomó la estaca de madera de topo, la agarró y la clavó en el corazón de la Arpía".
 POD_artifacts_book_of_nod.1150.desc:0 "Trajeron al clan de la realeza,\nel clan de la bestia,\nel clan de la luna,\nel clan de lo oculto,\nel clan del vagabundo,\nel clan de la rosa,\nel clan de la noche,\nel clan de los modeladores,\ nel Clan de la Serpiente,\nel Clan de la Muerte,\nel Clan del Sanador,\nel Clan de la Caza,\ny el Clan de los Sabios."
 POD_artifacts_book_of_nod.1030.t:0 "Cuento de la Arpía, continuación"
 POD_artifacts_book_of_nod.1155.desc:0 "Construyeron una ciudad hermosa,\ny la gente los adoró como dioses.\n\nCrearon una nueva Descendencia propia,\nla Cuarta Generación de Cainitas.\nPero temían a la Yihad,\nla Profecía de Uriel,\nY fue prohibido para esos Hijos\nCrear otros de su especie.\nEste poder se lo reservaron sus Mayores.\nCuando se creaba un Chiquillo, era perseguido y asesinado,\ny su Sire con él."
 POD_artifacts_book_of_nod.1030 .desc:0 "Porque Caine, el sabio Caine, no se había alimentado de ella durante un año y un día, y porque forzó su voluntad a través de sus manos, rompió el vínculo que ella tenía con él, y convirtió su fortuna. \N - Ella volvió a reír, mientras la sangre brotaba\Ny salía de su boca.\N-Sus ojos derramaban odio.\N-Caine la besó una vez,\Nbesó sus labios fríos y marchitos,\Ny la dejó allí\Ncon la suave sonrisa de Rafael: el sol que sale."
 POD_artifacts_book_of_nod.1160.desc:0 "Aunque Caine estaba lejos de nosotros,\nsentimos su ojo cauteloso observándonos,\ny sabíamos que él marcaba nuestros movimientos y nuestros caminos.\nMaldijo a Malkav, cuando difamó su imagen\ny lo condenó a la locura, para siempre. \nCuando se encontró a Absimiliard complaciendo sus gustos de mala manera con sus propios Hijos,\nCaine puso su mano sobre Absimiliard,\ny le dijo que siempre usaría su maldad y retorcería su rostro."
 POD_artifacts_book_of_nod.1040.t:0 "Cuento de la Arpía, continuación"
 POD_artifacts_book_of_nod.1165.desc:0 "Nos maldijo a todos por matar a la primera parte de sus Hijos, la Segunda Generación,\nComo los habíamos cazado uno por uno,\nZillah la Hermosa, Irad el Fuerte y Enoch Primer Gobernante.\nY los lloramos a todos , ya que todos éramos de una especie,\ny todas las familias de los chiquillos de Caín.\n\nAunque esta ciudad era tan grande como la de Caín,\nfinalmente envejeció.\nComo todos los seres vivos, lentamente comenzó a morir."
 POD_artifacts_book_of_nod.1040.desc:0 ""
 POD_artifacts_book_of_nod.1170.desc:0 "Al principio, los dioses no vieron la verdad,\ny cuando por fin miraron a su alrededor, ya era demasiado tarde.\nPorque, como había dicho Uriel,\nla semilla del Mal plantada floreció como una rosa roja como la sangre.\nY Troile, el Niño del Niño del Niño de Caín\nse levantó y mató a su Padre, Brujah.\nY comió de su carne.\nEntonces la guerra asoló la ciudad\nY nada pudo volver a ser como antes."
 POD_artifacts_book_of_nod.1050.t:0 "Cuento de la Arpía, continuación"
 POD_artifacts_book_of_nod.1175.desc:0 "Los Trece vieron su ciudad destruida y su poder extinguido,\nY se vieron obligados a huir, junto con su Descendencia.\nPero muchos murieron en la huida, porque se habían debilitado.\n\nDesaparecida su autoridad,\ntodos eran libres crear sus propios Linajes,\nY pronto hubo muchos Vástagos nuevos,\nQue gobernaron sobre la faz de la Tierra.\nPero esto no podía durar.\n\nCon el tiempo, llegó a haber demasiados Vástagos\nY entonces hubo guerra una vez más,"
 POD_artifacts_book_of_nod.1050.desc:0 "" 
 POD_artifacts_book_of_nod.1180.desc:0 "Los Ancianos ya estaban profundamente escondidos,\nPorque habían aprendido la cautela,\nPero sus Hijos habían fundado sus propias ciudades y Linajes,\nY son ellos los que murieron en la gran ola de guerra.\nLa guerra era tan total, que no queda nadie de esa Generación\nPara hablar más de sí mismos.\nSe enviaron oleadas de carne mortal a través de los continentes\nPara aplastar y quemar las ciudades de los Vástagos.\nLos mortales pensaron que estaban peleando sus propias guerras.\nPero es así por nosotros que derramaron su sangre."

 POD_artifacts_book_of_nod.1185.desc:0 "Una vez que terminó esta guerra,\nTodos los Vástagos se escondieron unos de otros\nY de los humanos que los rodeaban.\nEscondiéndonos permanecemos hoy,\nPorque la Jyhad aún continúa.\nY nadie dirá cuándo volverá a surgir Caín,\ nde su sueño en la tierra,\ny llamar a la ciudad Gehenna,\nla Última Ciudad, la Ciudad del Juicio.\nLa Yihad aún continúa."
 POD_artifacts_book_of_nod.1100.t:0 "Cuento de la primera ciudad"
 POD_artifacts_book_of_nod.1100 .desc:0 "En el principio sólo existía Caine que sacrificó a su hermano por amor.\NCaine que fue expulsado.\NCaine que fue maldecido para siempre con la inmortalidad. \Es Caine de quien todos venimos, el Señor de nuestro Señor. Durante una época vivió en la tierra de Nod. En la soledad y el sufrimiento permaneció solo durante un eón, pero el paso de la memoria ahogó su dolor".
 POD_artifacts_libro_de_nod.1100.desc.notale:0 "No tienes una copia del 'Cuento de la Primera Ciudad'"
 POD_artifacts_book_of_nod.1100.option.a:0 "Continuar leyendo el cuento de la primera ciudad" 
 POD_artifacts_book_of_nod.1110.t:0 "Cuento de la primera ciudad, continuación"
 POD_artifacts_book_of_nod.1110 .desc:0 "Y así regresó al mundo de los mortales, al mundo que su hermano Seth, tercer hijo de Eva, y los hijos de Seth habían creado. \El pueblo vio su poder y lo adoró. Se hizo poderoso, y su poder era fuerte, y sus maneras de imponer y mandar eran grandes. Y los hijos de Seth lo hicieron rey de su gran ciudad, la primera ciudad.
 POD_artifacts_book_of_nod.1115.t:0 "Historia de la Primera Ciudad, continuación"
 POD_artifacts_book_of_nod.1115 .desc:0 "Pero Caine se sintió solo en su Poder.\NEn lo más profundo de su ser, la semilla de la soledad floreció, y creció una flor oscura.\NVio dentro de su sangre la potencia de la fertilidad.\NAl invocar a los demonios y escuchar la sabiduría susurrada,\Naprendió la forma de hacer un niño para él.\NLlegó a conocer su poder, y, al hacerlo,\Ndecidió Abrazar a uno de los que estaban cerca de él."
 POD_artifacts_book_of_nod.1120.t:0 "Cuento de la primera ciudad, continuación"
 POD_artifacts_book_of_nod.1120.desc:0 "Y, he aquí, Uriel, el temible Uriel, se reveló a Caine esa misma noche y le dijo: "Caine, aunque eres poderoso y estás marcado por Dios, debes saber esto: que cualquier hijo que hagas llevará tu maldición, que cualquiera de tus descendientes caminará para siempre en la Tierra de Nod, y temerá las llamas y el sol, bebiendo sólo sangre y comiendo sólo cenizas. Y puesto que llevarán la celosa semilla de su padre, siempre conspirarán y lucharán entre ellos. ¡Caine! \N - ¡Quédate con tu pavoroso abrazo!"
 POD_artifacts_book_of_nod.1125.t:0 "Cuento de la Primera Ciudad, continuación"
 POD_artifacts_book_of_nod.1125 .desc:0 "Aun así, Caine sabía lo que debía hacer, y un joven llamado Enoc, que era el más querido de los parientes de Seth, pidió que lo hicieran hijo del Padre oscuro. Y Caine, consciente de las palabras de Uriel, vio a Enoc y lo envolvió en el abrazo oscuro.
 POD_artifacts_book_of_nod.1130.t:0 "Cuento de la Primera Ciudad, continuación"
 POD_artifacts_book_of_nod.1130 .desc:0 "Y así, Enoch pidió un hermano, una hermana, y Caine, Padre indulgente, se los dio, y sus nombres eran Zillah, cuya sangre era la más favorecida por Caine, e Irad, cuya fuerza servía al brazo de Caine. \Y estos parientes de Caine aprendieron las maneras de hacer su propia progenie, y abrazaron a más parientes de Seth, sin pensarlo. Y como la palabra de Caine era la ley, su prole le obedeció".
 POD_artifacts_book_of_nod.1135.t:0 "Cuento de la Primera Ciudad, continuación"
 POD_artifacts_book_of_nod.1135.desc:0 "La ciudad se mantuvo durante muchas épocas,\Ny se convirtió en el centro de un poderoso Imperio.\NCaine se acercó a los que no eran como él.\NLos hijos de Seth le conocieron\Ny él, a su vez, los conoció.\NPero el mundo se oscureció con el pecado.\NLos hijos de Caine vagaron por aquí y por allá, dando rienda suelta a sus oscuras costumbres. Caine sintió ira cuando sus hijos pelearon. Descubrió el engaño cuando los vio hacer guerra de palabras. Conoció la tristeza cuando los vio abusar de los hijos de Seth. Caine leyó las señales en el cielo que se oscurecía, pero no dijo nada".
 POD_artifacts_book_of_nod.1140.t:0 "Cuento de la Primera Ciudad, continuación"
 POD_artifacts_book_of_nod.1140 .desc:0 "Luego vino el gran Diluvio, una gran inundación que arrasó el mundo.\NLa Ciudad fue destruida, \Ny los hijos de Seth con ella.\NUna vez más, Caine cayó en una gran tristeza y se fue a la soledad.\NY nos dejó a nosotros, su Progenie, a nuestros propios fines. 
 POD_artifacts_book_of_nod.1145.t:0 "Cuento de la primera ciudad, continuación"
 POD_artifacts_book_of_nod.1145 .desc:0 "Así que volvimos solos para encontrar a los hijos de Noé,\Ny anunciamos que éramos los nuevos gobernantes.\NCada uno creó una prole, para reclamar la gloria de Caine,\Npero no teníamos su sabiduría ni su moderación.\NSe libró una gran guerra, los Ancianos contra sus Hijos,\Ntal como había dicho Uriel, y los Hijos mataron a sus padres.\NSe levantaron. Usaron fuego y madera. Espadas y garras. Para destruir a los que los habían creado. Los rebeldes construyeron una nueva ciudad. Del Imperio caído, reunieron a los Trece clanes que habían sido dispersados por la Gran Guerra, y los reunieron a todos".
 POD_artifacts_book_of_nod.1150.t:0 "Historia de la primera ciudad, continuación"
 POD_artifacts_book_of_nod.1150 . desc: 0 "Trajeron al Clan del Rey, al Clan de la Bestia, al Clan de la Luna, al Clan de los Ocultos, al Clan de los Vagabundos, al Clan de la Rosa, al Clan de la Noche, al Clan de los Formadores, al Clan de la Serpiente, al Clan de la Muerte, al Clan de los Sanadores, al Clan de la Caza y al Clan de los Aprendices. "
 POD_artifacts_book_of_nod.1155.t:0 "Cuento de la primera ciudad, continuación"
 POD_artifacts_book_of_nod.1155 .desc:0 "Hicieron una hermosa ciudad,\Ny la gente los adoró como dioses.\NCrearon una nueva Progenie propia,\Nla Cuarta Generación de Cainitas. \Pero temían a la Jyhad, la Profecía de Uriel, y les estaba prohibido a esos niños crear otros de su especie.
 POD_artifacts_book_of_nod.1160.t:0 "Cuento de la Primera Ciudad, continuación"
 POD_artifacts_book_of_nod.1160 .desc:0 "Aunque Caine estaba lejos de nosotros,\Nsentimos su ojo atento observándonos,\Ny sabíamos que marcaba nuestros movimientos y nuestros caminos.\NMaldijo a Malkav, cuando éste difamó su imagen\Ny lo condenó a la locura, para siempre. \N-Cuando se encontró a Absimiliard complaciendo sus gustos en formas sucias con sus propios Hijos,\NCaine puso su mano sobre Absimiliard,\Ny le dijo que llevaría para siempre su maldad y retorció su rostro."
 POD_artifacts_book_of_nod.1165.t:0 "Cuento de la primera ciudad, continuación"
 POD_artifacts_book_of_nod.1165 .desc:0 "Nos maldijo a todos, por haber matado a la primera parte de sus Hijos, la Segunda Generación,\Nya que los habíamos cazado uno por uno, \Na Zillah la Bella, a Irad el Fuerte, y a Enoch Primer Regidor. \Y los lloramos a todos, ya que todos éramos de la misma clase, y todas las familias de los hijos de Caine. Aunque esta ciudad era tan grande como la de Caine, finalmente envejeció.
 POD_artifacts_book_of_nod.1170.t:0 "Cuento de la Primera Ciudad, continuación"
 POD_artifacts_book_of_nod.1170 .desc:0 "Los dioses al principio no vieron la verdad,\Ny cuando por fin miraron a su alrededor era demasiado tarde.\NPorque, como había dicho Uriel,\Nla semilla del Mal plantada floreció como una rosa de color rojo sangre. \Y Troile, la hija del hijo de Caine, se levantó y mató a su padre, Brujah, y se comió su carne. Entonces la guerra asoló la ciudad y ya nada pudo ser como antes.
 POD_artifacts_book_of_nod.1175.t:0 "Historia de la Primera Ciudad, continuación"
 POD_artifacts_book_of_nod.1175 .desc:0 "Los Trece vieron su ciudad destruida y su poder extinguido,\Ny se vieron obligados a huir, su Progenie junto con ellos.\NPero muchos murieron en la huida, pues se habían debilitado. \Con su autoridad perdida, todos fueron libres de crear sus propias crías, y pronto hubo muchos nuevos Hijos, que gobernaron la faz de la Tierra.
 POD_artifacts_book_of_nod.1180.t:0 "Historia de la primera ciudad, continuación"
 POD_artifacts_book_of_nod.1180 .desc:0 "Los Ancianos ya estaban profundamente escondidos,\Nporque habían aprendido a ser cautelosos,\Npero sus Hijos habían fundado sus propias ciudades y Hermandades,\Ny son ellos los que murieron en la gran ola de guerra.\NHubo una guerra tan total, que ya no hay ninguno de esa Generación\Nque hable de sí misma. \Olas de carne mortal fueron enviadas a través de los continentes para aplastar y quemar las ciudades de los Kindred. Los mortales pensaron que estaban luchando en sus propias guerras, pero es por nosotros que derramaron su sangre".
 POD_artifacts_book_of_nod.1185.t:0 "Cuento de la primera ciudad, continuación"
 POD_artifacts_book_of_nod.1185 .desc:0 "Una vez que la guerra terminó, todos los Hijos se escondieron los unos de los otros y de los humanos que los rodeaban. En la clandestinidad permanecemos hoy, porque la Jyhad continúa. Y nadie sabe cuándo Caine se levantará de nuevo, de su sueño en la tierra, y llamará a la ciudad Gehenna, la Última Ciudad, la Ciudad del Juicio.
 POD_artifacts_book_of_nod.1185.option.f:0 "Revivir la cultura de la primera ciudad"
