l_spanish:
 POD_hazimel_wisdom.001.t:0 "En busca de la sabiduría"
 POD_hazimel_wisdom.001.desc:0 "No todas las familias están dispuestas a sacrificar una parte de su cuerpo inmortal para alcanzar el conocimiento. Tú, a diferencia de otros, estás dispuesto a hacerlo. Sólo los valientes pueden alcanzar la sabiduría eterna, pero ¿eres lo suficientemente valiente como para hacer un sacrificio, siendo incapaz de deshacer tu decisión?"
 POD_hazimel_wisdom.001.option.a:0 "Seguiré el ejemplo de Hazimel. Un ojo a cambio de conocimiento"
 POD_hazimel_wisdom.001.option.a.tt:0 "Perderás tu ojo, no podrás curarlo de nuevo"
 POD_hazimel_wisdom.001.option.b:0 "Mi pierna no puede compararse con los conocimientos que obtendré."
 POD_hazimel_wisdom.001.option.b.tt:0 "Perderás tu pierna, no podrás curarla de nuevo"
 POD_hazimel_wisdom.001.option.c:0 "Yo... No estoy preparado"
 POD_hazimel_wisdom.001.option.c.tt:0 "Abandonarás tu búsqueda de la sabiduría"
