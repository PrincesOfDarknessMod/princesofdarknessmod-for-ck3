single_combat.0041.desc.sc_attacker.POD_dragon_ward.fatality:0 "Son empujados hacia atrás, manteniéndose a duras penas. Muy fuera de su alcance!"
single_combat.0041.desc.sc_attacker.POD_typhonic_maw.fatality:0 "Hago un corte a lo largo de las monstruosas fauces. Un corte limpio a lo largo de esta fea cara pone fin a este combate".
single_combat.0041.desc.sc_attacker.POD_cobra_fangs.fatality:0 "Mientras el veneno se disipa del colmillo de mi oponente, le doy un puñetazo en la cabeza extendida tan fuerte como puedo, asegurándome de que esta vez no se levantará."
