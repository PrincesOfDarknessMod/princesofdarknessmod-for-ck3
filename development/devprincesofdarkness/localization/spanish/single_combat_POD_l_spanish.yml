single_combat.0031.desc.opponent_response.POD_crossbow_shot.fatality:0 "Me golpea entre los ojos y luego sale por la parte de atrás de mi extremo. Todo es dolor. Luego, oscuridad".
single_combat.0031.desc.opponent_response.POD_unleash_dogs.fatality:0 "Pronto estoy en el suelo, empujando a duras penas a estas bestias. Mis oponentes se acercan a mí y golpean mi forma indefensa..."
