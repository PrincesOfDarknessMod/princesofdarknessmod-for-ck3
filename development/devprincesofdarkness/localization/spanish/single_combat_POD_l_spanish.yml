#Defensor Ganado, Retroalimentación del Movimiento de Combate Propio
 single_combat.0041.desc.sc_defender.POD_extinguish_vitae:0 "Con un movimiento rápido de mi mano, hago que la sangre de mi oponente sea inerte."
#Ejemplo: "Aunque retroceden justo a tiempo, mi puñalada fuera de la mano casi acaba con esto".
 single_combat.0041.desc.sc_defender.POD_theft_of_vitae:0 "Hago que la sangre salga de la boca de mi enemigo y luego la guío hacia mí."
single_combat.0041.desc.sc_defender.POD_bite:0 "Me abalanzo hacia delante, intentando hundir mis afilados colmillos en el tentador cuello que tengo delante."
 single_combat.0041.desc.sc_defender.POD_cauldron_of_blood:0 "Con un movimiento de mi mano, hago hervir la sangre de mi oponente en sus propias venas."
single_combat.0041.desc.sc_defender.POD_blood_surge:0 "Invoco los poderes de mi sangre para que me den fuerza".
single_combat.0041.desc.sc_defender.POD_blood_heal:0 "Invoco los poderes de mi sangre para tejer mis heridas y curarme."
single_combat.0041.desc.sc_defender.POD_blink:0 "Corro hacia delante más rápido de lo que el ojo puede ver, esperando que mi oponente no tenga medios para anticiparse a mis movimientos."
 single_combat.0041.desc.sc_defender.POD_fire_bombs:0 "Lanzo el fuego alquímico hacia mi oponente."
single_combat.0041.desc.sc_defender.POD_lightning_strike:0 "Golpeo instintivamente con el poder de la Celeridad, intentando pillar a mi oponente desprevenido."
 single_combat.0041.desc.sc_defender.POD_crossbow_shot:0 "El tiro se dispara, buscando su blanco."
single_combat.0041.desc.sc_defender.POD_split_second:0 "El tiempo se ralentiza a mi alrededor cuando la Celeridad hace efecto. Debo aprovechar esa oportunidad".
single_combat.0041.desc.sc_defender.POD_unerring_aim:0 "Gracias a mi dominio de la Celeridad, mi siguiente disparo es perfectamente preciso."
