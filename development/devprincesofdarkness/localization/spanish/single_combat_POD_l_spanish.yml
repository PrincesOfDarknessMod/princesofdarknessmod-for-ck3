#Defensor perdido, movimiento final del oponente Fatality
#Ejemplo "El golpe se clava en mi pecho, y una verdadera fuente de sangre brota de la herida". ¿Quizás fue una locura enfrentarse a un [sc_victor.GetWomanMan] que mata por deporte con tanta regularidad? Tal vez sí, tal vez no. En cualquier caso, el entumecimiento que se extiende rápidamente por mis miembros me dice que no tengo mucho tiempo para lamentar mis errores".
single_combat.0031.desc.opponent_response.POD_bite.fatality:0 "Y se conecta, el aroma embriagador de la sangre impregna el aire. Es demasiado tarde para extraerme, ya que me pierdo en el éxtasis del beso. El resto es historia, pero ya no es mía".
single_combat.0031.desc.opponent_response.POD_blood_surge.fatality:0 "Incluso desde mi posición, puedo verlos más altos y fuertes, fortalecidos por la sangre. De repente mucho más fuerte y rápido, ni siquiera veo venir el golpe antes de ser cortado por la mitad".
single_combat.0031.desc.opponent_response.POD_blood_heal.fatality:0 "Todo mi duro trabajo desaparece ante mis ojos cuando el poder de la sangre cura a mi enemigo. De repente, mucho más fuerte y rápido, ni siquiera veo venir el golpe antes de ser cortado por la mitad".
single_combat.0031.desc.opponent_response.POD_blink.fatality:0 "Y no tengo ninguno. La embestida nunca se detiene, o al menos no mientras yo esté vivo".
single_combat.0031.desc.opponent_response.POD_lightning_strike.fatality:0 "Que es lo que hacen, pronto soy empujado hacia atrás por este ataque inesperado. Mi oponente aprovecha esta oportunidad para golpearme de nuevo y me derrumbo en el suelo, impotente para detener el golpe final."
single_combat.0031.desc.opponent_response.POD_split_second.fatality:0 "No estoy lo suficientemente preparado, y un fuerte golpe viene hacia mí, demasiado rápido para ser evitado por mi deformado sentido del tiempo. Será lo último que sienta".
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae.fatality:0 "Como tal, de repente me siento bastante más débil y la Bestia ruge de ira. Sin embargo, no por mucho tiempo, ya que mi oponente usa mi distracción para asestar un golpe perfecto en mi cuello. ¿Quién necesita una cabeza de todos modos?"
single_combat.0031.desc.opponent_response.POD_unerring_aim.fatality:0 "No puedo hacer otra cosa que recibirlo justo entre los ojos. Mi oponente sonríe mientras yo caigo hacia atrás, sin poder protegerme más".
single_combat.0031.desc.opponent_response.POD_lethal_body.fatality:0 "Sintiéndome como si una casa entera se hubiera derrumbado encima de mí, apenas puedo levantarme para ver cómo mi oponente toma mi cabeza entre sus manos y... El fin".
single_combat.0031.desc.opponent_response.POD_brutal_feed.fatality:0 "Y se conecta, el embriagador aroma de la sangre impregna el aire. Es demasiado tarde para extraerme, ya que me pierdo en el éxtasis del beso. El resto es historia, pero ya no es mía".
single_combat.0031.desc.opponent_response.POD_earthshock.fatality:0 "Caigo y mi oponente aprovecha para golpearme brutalmente. No puedo evitar que el golpe caiga sobre mi cuello. Mi cabeza rueda por el suelo y se detiene a los pies de mi oponente".
single_combat.0031.desc.opponent_response.POD_fist_of_caine.fatality:0 "Esta tempestad es como puñales en mi piel, cortando grandes franjas de mi carne no muerta con cada movimiento. Me reduce rápidamente a un esqueleto, y aún más rápido a cenizas".
single_combat.0031.desc.opponent_response.POD_toughness.fatality:0 "Nada parece poder atravesar esta defensa. Me agoto tratando de atravesarla. No veo venir el contraataque, y ya no veré venir nada más".
single_combat.0031.desc.opponent_response.POD_flesh_of_marble.fatality:0 "Nada parece poder perforar esta defensa. Me agoto tratando de atravesarla. No veo venir el contraataque, y ya no veré venir nada más".
single_combat.0031.desc.opponent_response.POD_prowess_from_pain.fatality:0 "Alimentado por este terrible poder, mi oponente asesta un terrible golpe que reduce mi corazón de no muerto a una pulpa. Hace un sonido doloroso mientras todo se oscurece".
single_combat.0031.desc.opponent_response.POD_feral_weapons.fatality:0 "Y sucede, la única gracia salvadora es que no duele por mucho tiempo".
single_combat.0031.desc.opponent_response.POD_shapechange.fatality:0 "Sorprendido por este repentino cambio, soy golpeado y pronto corneado hasta la muerte real por este monstruo."
single_combat.0031.desc.opponent_response.POD_vanish.fatality:0 "Como tal, no veo el siguiente golpe que viene por detrás de mí. Y me desgarra las tripas, haciendo un desastre alrededor mientras exploto en sangre y vísceras".
single_combat.0031.desc.opponent_response.POD_nocturne.fatality:0 "Como tal, no veo el siguiente golpe que viene por detrás de mí. Y me desgarra las tripas, haciendo un desastre alrededor mientras exploto en sangre y vísceras".
single_combat.0031.desc.opponent_response.POD_arms_of_ahriman.fatality:0 "Esquivo uno de ellos pero no el segundo... y me hace rebotar hacia el primero. Sirvo de saco de boxeo durante un rato antes de que todo se oscurezca".
single_combat.0031.desc.opponent_response.POD_the_darkness_within.fatality:0 "De repente saltan a mi boca y tengo que usar toda mi fuerza de voluntad para expulsarlos. No consigo hacerlo a tiempo y mi sangre, y yo mismo, desaparecemos en la oscuridad".
single_combat.0031.desc.opponent_response.POD_aegis_of_shadows.fatality:0 "Nada parece poder atravesar esta defensa. Me agoto tratando de atravesarla. No veo venir el contraataque, y ya no veré venir nada más".
single_combat.0031.desc.opponent_response.POD_compel.fatality:0 "Me pilla desprevenido, y pronto estoy demasiado distraído para ver el golpe que viene a continuación. Y es el último".
single_combat.0031.desc.opponent_response.POD_terminal_decree.fatality:0 "Lo cual hago obedientemente, matándome lentamente mientras mi oponente se ríe todo el tiempo. Mi último pensamiento es para esperar que nadie sepa nunca cómo he muerto".
single_combat.0031.desc.opponent_response.POD_daunt.fatality:0 "Me pilla desprevenido, y pronto estoy demasiado distraído para ver el golpe que viene a continuación. Y es el último".
single_combat.0031.desc.opponent_response.POD_dread_gaze.fatality:0 "Me pilla desprevenido, y pronto estoy demasiado distraído para ver el golpe que viene a continuación. Y es el último".
single_combat.0031.desc.opponent_response.POD_extinguir_vitae.fatality:0 "Así, de repente me siento bastante más débil y la Bestia ruge de rabia. Sin embargo, no por mucho tiempo, ya que mi oponente aprovecha mi distracción para asestar un golpe perfecto a mi cuello. De todos modos, ¿quién necesita una cabeza?"
single_combat.0031.desc.opponent_response.POD_scorpions_touch.fatality:0 "Golpeado por ella, me siento mal y mis movimientos son lentos. En este lamentable estado, soy rápidamente dominado por mi enemigo, que tiene la bondad de darme una muerte rápida en lugar de dejar que el veneno haga lo suyo."
single_combat.0031.desc.opponent_response.POD_theft_of_vitae.fatality:0 "Soy impotente para detenerlo, mi preciosa sangre me es robada hasta que no queda nada. Y sin que quede sangre... Cenizas es todo lo que queda".
single_combat.0031.desc.opponent_response.POD_baals_curse.fatality:0 "Herido por ella, me siento enfermo y mis movimientos son lentos. En este lamentable estado, soy rápidamente dominado por mi enemigo, que tiene la bondad de darme una muerte rápida en lugar de dejar que el veneno haga lo suyo."
single_combat.0031.desc.opponent_response.POD_cauldron_of_blood.fatality:0 "¡Arde, arde! Me he convertido en fuego... y pronto en cenizas".
single_combat.0031.desc.opponent_response.POD_touch_of_oblivion.fatality:0 "Mi sangre se mezcla de repente con sombras agresivas que intentan apoderarse de mí. Mientras mi fuerza vital es drenada, me derrumbo en el suelo, pronto reducido a un montón de cenizas y oscuridad arremolinada."
single_combat.0031.desc.opponent_response.POD_stygian_shroud.fatality:0 "Como tal, no veo el siguiente golpe que viene por detrás de mí. Y me desgarra las tripas, haciendo un desastre alrededor mientras exploto en sangre y vísceras".
single_combat.0031.desc.opponent_response.POD_fire_torch.fatality:0 "El fuego me envuelve por completo y pronto, todo son cenizas."
single_combat.0031.desc.opponent_response.POD_fire_bombs.fatality:0 "El fuego me envuelve por completo y pronto, todo son cenizas".
