single_combat.0031.desc.sc_attacker.POD_acre_flesh.fatality:0 "Duele bastante. Lo suficiente como para distraerme del siguiente golpe. Este no duele por mucho tiempo".
single_combat.0031.desc.sc_attacker.POD_acre_flight.fatality:0 "O incluso me supera, ya que me hace retroceder. Y hacia atrás. Hasta que no haya dónde ir".
single_combat.0031.desc.sc_attacker.POD_acre_auto.fatality:0 "Sin embargo, no esquivo fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se me cae la cabeza de los hombros".
single_combat.0031.desc.sc_attacker.POD_murnau_mirror.fatality:0 "Me empujan hacia atrás, manteniéndome a duras penas. El duelo no dura mucho después, estoy fuera de mi alcance".
single_combat.0031.desc.sc_attacker.POD_murnau_arcana.fatality:0 "Este me explotó en la cara. Luego me explotó la cara también".
single_combat.0031.desc.sc_attacker.POD_sisters_hosanna.fatality:0 "El contraataque de mi oponente me pilla desprevenido y conecta. El final llega en un destello de acero".
