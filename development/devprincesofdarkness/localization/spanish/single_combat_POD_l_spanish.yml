single_combat.0031.desc.opponent_response.POD_acre_catechumen.fatality:0 "El siguiente golpe que me asesta es, efectivamente, el que me parte por la mitad mientras las partes destrozadas de mí caen al suelo."
single_combat.0031.desc.opponent_response.POD_acre_flesh.fatality:0 "No puedo romper la defensa de mi oponente, y el contraataque es crítico. No tengo ninguna posibilidad".
