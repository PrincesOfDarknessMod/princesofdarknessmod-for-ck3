#Agresor Perdido, Movimiento de Combate Propio Herido
#Ejemplo "sólo para que #EMP esa#! arma sea destrozada lejos de mí por [sc_victor.GetFirstNamePossessiveNoTooltip] back-swing.\NNSin arma, arma de respaldo, y con mi oponente preparándose para [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')], sólo hay una cosa que hacer."
single_combat.0031.desc.sc_attacker.POD_bite.injury:0 "Y llega rápidamente, en forma de puñetazo en la cara".
single_combat.0031.desc.sc_attacker.POD_blood_surge.injury:0 "Y la pequeña distracción es suficiente para que mi oponente tome ventaja con un rápido golpe."
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae.injury:0 "Lo cual pronto puedo confirmar cuando una patada mejorada con sangre me golpea en las entrañas."
single_combat.0031.desc.sc_attacker.POD_blood_heal.injury:0 "Y la pequeña distracción es suficiente para que mi oponente tome la ventaja con un golpe rápido."
single_combat.0031.desc.sc_attacker.POD_blink.injury:0 "Y lo pierdo tan gravemente como preveía".
single_combat.0031.desc.sc_attacker.POD_lightning_strike.injury:0 "El contraataque de mi oponente no lo hace".
single_combat.0031.desc.sc_attacker.POD_split_second.injury:0 "Me golpea su siguiente ataque como si nada".
single_combat.0031.desc.sc_attacker.POD_unerring_aim.injury:0 "Acercando la distancia, mi enemigo me da un puñetazo en la tripa por mi descaro".
single_combat.0031.desc.sc_attacker.POD_lethal_body.injury:0 "Los de mis adversarios no se entristecen. Y me duele".
single_combat.0031.desc.sc_attacker.POD_brutal_feed.injury:0 "Y llega rápido, en forma de puñetazo en la cara".
single_combat.0031.desc.sc_attacker.POD_earthshock.injury:0 "Distraído por este fallo, no veo venir el siguiente golpe".
single_combat.0031.desc.sc_attacker.POD_fist_of_caine.injury:0 "Sin embargo, sus golpes son mucho más para mí y pronto me recupero con dificultad de ellos."
single_combat.0031.desc.sc_attacker.POD_toughness.injury:0 "Parece que la Fortaleza no ha sido suficiente esta vez".
single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.injury:0 "Me siento como en el centro de un terremoto".
single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.injury:0 "Mi oponente se asegura rápidamente de que pronto duela aún más".
single_combat.0031.desc.sc_attacker.POD_feral_weapons.injury:0 "Su contraataque no es menos peligroso, y estoy derrotado para este combate."
single_combat.0031.desc.sc_attacker.POD_shapechange.injury:0 "Canalizando generaciones de humanidad domando la vida salvaje, mi oponente comienza a golpear la luz del día de mi forma animal."
single_combat.0031.desc.sc_attacker.POD_vanish.injury:0 "Su siguiente golpe también lo hace".
single_combat.0031.desc.sc_attacker.POD_nocturne.injury:0 "Como demuestra su siguiente golpe, casi perfecto".
 single_combat.0031.desc.sc_attacker.POD_acre_flight.injury:0 "O incluso superarme, ya que soy empujado hacia atrás."
single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman.injury:0 "Distraído por este fracaso, tengo que soportar alguna represalia rápida".
single_combat.0031.desc.sc_attacker.POD_the_darkness_within.injury:0 "No me va muy bien contra su siguiente golpe, lamentablemente".
single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows.injury:0 "No ser invulnerable duele mucho por lo visto".
single_combat.0031.desc.sc_attacker.POD_compel.injury:0 "Y luego ordena que su puño se dirija a mi cabeza. Funciona".
single_combat.0031.desc.sc_attacker.POD_terminal_decree.injury:0 "Y luego ordena que su puño se dirija a mi cabeza. Funciona".
single_combat.0031.desc.sc_attacker.POD_daunt.injury:0 "Como demuestra su siguiente golpe, casi perfecto".
single_combat.0031.desc.sc_attacker.POD_dread_gaze.injury:0 "Y duele bastante estar en el extremo receptor".
single_combat.0031.desc.sc_attacker.POD_extinguir_vitae.injury:0 "Lo que pronto podré confirmar cuando una patada potenciada por la sangre me golpee en las tripas".
single_combat.0031.desc.sc_attacker.POD_scorpions_touch.injury:0 "Sin embargo, no tienes el mismo cuidado a la hora de evitar los suyos y acabas perdiendo esta parte del combate."
single_combat.0031.desc.sc_attacker.POD_theft_of_vitae.injury:0 "Sin embargo, el mío da un salto cuando el puñetazo de mi oponente conecta con mi cara."
single_combat.0031.desc.sc_attacker.POD_baals_curse.injury:0 "Sin embargo, no tienes el mismo cuidado a la hora de evitar los suyos y acabas perdiendo esta parte del combate."
single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood.injury:0 "Lo que pronto podré confirmar cuando una patada potenciada por la sangre me golpee en las tripas".
single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion.injury:0 "Ni siquiera se inmuta, mi enemigo saca lo mejor de mí en esta parte del combate."
single_combat.0031.desc.sc_attacker.POD_stygian_shroud.injury:0 "Lo que pronto puedo confirmar cuando una patada potenciada por la sangre me golpea en las tripas".
single_combat.0031.desc.sc_attacker.POD_fire_torch.injury:0 "Mi lamentable ataque es entonces contrarrestado por un golpe magistral. Duele".
single_combat.0031.desc.sc_attacker.POD_fire_bombs.injury:0 "Sin embargo, no esquivo fácilmente el puñetazo en la cara que viene a continuación".
single_combat.0031.desc.sc_attacker.POD_fire_spewer.injury:0 "Sin embargo, el siguiente golpe de mi oponente es mucho más preciso que ese".
single_combat.0031.desc.sc_attacker.POD_crossbow_shot.injury:0 "Sin embargo, el siguiente golpe de mi oponente es mucho más preciso que ese."
