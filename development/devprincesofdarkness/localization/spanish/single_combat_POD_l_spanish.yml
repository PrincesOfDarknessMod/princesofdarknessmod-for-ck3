single_combat.0041.desc.opponent_response.POD_bite.injury:0 "Y se conecta, el aroma embriagador de la sangre impregna el aire. Apenas se extraen de este abrazo mortal antes de que sea demasiado tarde".
single_combat.0041.desc.opponent_response.POD_blood_surge.injury:0 "Me veo más alto y más fuerte, fortalecido por la sangre. Rápidamente, aumento mi ventaja".
single_combat.0041.desc.opponent_response.POD_blood_heal.injury:0 "Todas mis heridas desaparecen ante mis ojos mientras el poder de la sangre me cura. Rápidamente aprieto mi ventaja".
single_combat.0041.desc.opponent_response.POD_blink.injury:0 "Y ellos no tienen ninguna, pronto reducidos a recuperarse, con dificultad, de mis embestidas."
single_combat.0041.desc.opponent_response.POD_lightning_strike.injury:0 "Lo que hago, mi enemigo pronto es empujado hacia atrás por este ataque inesperado."
single_combat.0041.desc.opponent_response.POD_split_second.injury:0 "Mi oponente no está lo suficientemente preparado, y le llega un fuerte golpe, demasiado rápido para ser evitado por su deformado sentido del tiempo."
single_combat.0041.desc.opponent_response.POD_unerring_aim.injury:0 "Mi oponente no puede hacer otra cosa que aceptarlo, sintiendo cómo su carne no muerta protesta por este maltrato."
single_combat.0041.desc.opponent_response.POD_lethal_body.injury:0 "Mi oponente no tarda en levantarse a duras penas, sintiendo como si una casa entera se le hubiera derrumbado encima".
single_combat.0041.desc.opponent_response.POD_brutal_feed.injury:0 "Mi oponente consigue extraerse de este abrazo mortal, pero no antes de haber sentido el agudo dolor causado por mis colmillos."
single_combat.0041.desc.opponent_response.POD_earthshock.injury:0 "Mi oponente cae y aprovecho para golpear brutalmente. Apenas evitan el golpe destinado al cuello".
single_combat.0041.desc.opponent_response.POD_fist_of_caine.injury:0 "Esta tempestad es como puñales en su piel, cortando grandes franjas de la carne del no muerto con cada movimiento."
single_combat.0041.desc.opponent_response.POD_toughness.injury:0 "Nada parece poder atravesar mi defensa. Mi oponente se agota tratando de atravesar".
single_combat.0041.desc.opponent_response.POD_flesh_of_marble.injury:0 "Nada parece poder perforar mi defensa. Mi oponente se agota tratando de atravesar".
single_combat.0041.desc.opponent_response.POD_prowess_from_pain.injury:0 "Alimentado por este terrible poder, doy un poderoso golpe que hace retroceder a mi oponente."
single_combat.0041.desc.opponent_response.POD_feral_weapons.injury:0 "Y casi lo consigo, ya que mi oponente apenas logra evitar un golpe ciertamente mortal que viene hacia él."
single_combat.0041.desc.opponent_response.POD_shapechange.injury:0 "Sorprendido por este repentino cambio, mi oponente es golpeado y tiene que empujar furiosamente hacia atrás al monstruo en que me he convertido."
single_combat.0041.desc.opponent_response.POD_vanish.injury:0 "Como tal, mi oponente no ve el siguiente golpe que viene por detrás. Y le duele".
single_combat.0041.desc.opponent_response.POD_nocturne.injury:0 "Como tal, mi oponente no ve el siguiente golpe que viene por detrás. Y le duele".
single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.injury:0 "Mi oponente evita uno de ellos pero no el segundo... y estas cosas duelen".
single_combat.0041.desc.opponent_response.POD_the_darkness_within.injury:0 "Saltan de repente a la boca de mi oponente, que tiene que usar toda su fuerza de voluntad para expulsarlos."
single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.injury:0 "Nada parece poder atravesar mi defensa. Mi oponente se agota tratando de atravesar".
single_combat.0041.desc.opponent_response.POD_compel.injury:0 "Pilla a mi enemigo con la guardia baja, y no tarda en recuperarse de un golpe asestado mientras estaba distraído."
single_combat.0041.desc.opponent_response.POD_terminal_decree.injury:0 "Lo que hacen obedientemente, sintiendo primero humillación que dolor."
single_combat.0041.desc.opponent_response.POD_daunt.injury:0 "Pilla a mi enemigo desprevenido, y no tarda en recuperarse de un golpe asestado mientras estaba distraído."
single_combat.0041.desc.opponent_response.POD_dread_gaze.injury:0 "Atrapa a mi enemigo con la guardia baja, y pronto se recupera de un golpe asestado mientras estaba distraído."
single_combat.0041.desc.opponent_response.POD_extinguir_vitae.injury:0 "Así, mi oponente se siente de repente bastante más débil y la Bestia ruge en un triunfo anticipado."
single_combat.0041.desc.opponent_response.POD_scorpions_touch.injury:0 "Golpeado por él, mi enemigo se siente enfermo y sus movimientos son lentos."
single_combat.0041.desc.opponent_response.POD_theft_of_vitae.injury:0 "Mi enemigo es impotente para detenerlo, ¡su preciosa sangre es mía!"
single_combat.0041.desc.opponent_response.POD_baals_curse.injury:0 "Golpeado por ella, mi enemigo se siente enfermo y sus movimientos son lentos".
single_combat.0041.desc.opponent_response.POD_cauldron_of_blood.injury:0 "¡Arde, arde!"
single_combat.0041.desc.opponent_response.POD_touch_of_oblivion.injury:0 "La sangre de mi oponente se mezcla de repente con sombras agresivas que intentan apoderarse de ella. No es una experiencia agradable".
single_combat.0041.desc.opponent_response.POD_stygian_shroud.injury:0 "Como tal, mi oponente no ve el siguiente golpe que viene por detrás. Y le duele".
single_combat.0041.desc.opponent_response.POD_fire_torch.injury:0 "Mi oponente lo esquiva a duras penas, pero no antes de que parte del fuego le queme la carne."
single_combat.0041.desc.opponent_response.POD_fire_bombs.injury:0 "Mi oponente lo esquiva a duras penas, pero no antes de que parte del fuego queme su carne."
single_combat.0041.desc.opponent_response.POD_fire_spewer.injury:0 "Mi oponente lo esquiva a duras penas, pero no antes de que parte del fuego queme su carne."
single_combat.0041.desc.opponent_response.POD_crossbow_shot.injury:0 "Golpea a mi enemigo con un sonido estrepitoso, y son derrotados por esta ronda".
single_combat.0041.desc.opponent_response.POD_unleash_dogs.injury:0 "Mi oponente los despacha, pero no lo suficientemente rápido, consiguen desgarrarlos durante un rato."
single_combat.0041.desc.opponent_response.POD_stake_attack.injury:0 "La estaca falla en el corazón de mi oponente, pero aun así le roza de forma bastante dolorosa."
single_combat.0041.desc.opponent_response.POD_oculi_trust.injury:0 "Así, mi enemigo es incapaz de evitar el siguiente golpe que viene hacia él."
single_combat.0041.desc.opponent_response.POD_oculi_wine.injury:0 "Mi oponente está herido, y parte de su carne se convierte en cenizas antes de que pueda enredarse."
single_combat.0041.desc.opponent_response.POD_acre_catechumen.injury:0 "El siguiente golpe que recibe mi enemigo es especialmente doloroso".
single_combat.0041.desc.opponent_response.POD_acre_flesh.injury:0 "Mi oponente no puede romper mi defensa, y el contraataque es doloroso."
single_combat.0041.desc.opponent_response.POD_acre_flight.injury:0 "Así, mi oponente es incapaz de evitar el siguiente golpe que viene."
single_combat.0041.desc.opponent_response.POD_acre_auto.injury:0 "No del todo, pero sigue siendo muy doloroso ya que mi enemigo retrocede ante él."
single_combat.0041.desc.opponent_response.POD_murnau_mirror.injury:0 "Como tal, mi enemigo es incapaz de evitar el siguiente golpe que viene hacia él."
single_combat.0041.desc.opponent_response.POD_murnau_arcana.injury:0 "Sorprendido, el retroceso de la misma hiere bastante a mi oponente".
single_combat.0041.desc.opponent_response.POD_sisters_hosanna.injury:0 "El siguiente golpe que recibe mi enemigo es especialmente doloroso".
single_combat.0041.desc.opponent_response.POD_sisters_oratorio.injury:0 "Como tal, mi oponente es incapaz de evitar el siguiente golpe que le llega."
single_combat.0041.desc.opponent_response.POD_bone_obedience.injury:0 "Mi oponente no puede romper mi defensa, y el contraataque es doloroso."
single_combat.0041.desc.opponent_response.POD_five_poison_cloud.injury:0 "Mi oponente es engullido por ella, y apenas consigue escapar antes de que sea demasiado tarde."
single_combat.0041.desc.opponent_response.POD_ching_shih.injury:0 "Más rápido, resistente y fuerte que ellos, mi enemigo está superado".
single_combat.0041.desc.opponent_response.POD_long_neck.injury:0 "Como tal, mi oponente es incapaz de evitar el siguiente golpe que viene hacia él."
single_combat.0041.desc.opponent_response.POD_bloodlash.injury:0 "Mi oponente es sorprendido por él, y rápidamente golpeado por el asalto."
single_combat.0041.desc.opponent_response.POD_goblin_scorch.injury:0 "Mi oponente es engullido por él, y apenas consigue escapar antes de que sea demasiado tarde."
single_combat.0041.desc.opponent_response.POD_goblin_lantern.injury:0 "Esta extraña táctica ha sorprendido a mi enemigo, y sufre graves quemaduras antes de volver en sí."
single_combat.0041.desc.opponent_response.POD_bone_dance.injury:0 "Así, mi oponente es incapaz de evitar el siguiente golpe que viene hacia él."
single_combat.0041.desc.opponent_response.POD_dragon_dance.injury:0 "Más rápido, resistente y fuerte que ellos, mi enemigo está superado".
single_combat.0041.desc.opponent_response.POD_chi_interrupt.injury:0 "Mi oponente recibe un golpe, pero consigue evitar el segundo. Aunque sigue siendo doloroso".
single_combat.0041.desc.opponent_response.POD_thousand_hell_stare.injury:0 "En este difícil estado de ánimo, mi adversario no puede defenderse adecuadamente".
single_combat.0041.desc.opponent_response.POD_wind_attack.injury:0 "Así, mi adversario es incapaz de evitar el siguiente golpe que se le viene encima."
single_combat.0041.desc.opponent_response.POD_demon_claws.injury:0 "Más rápido, resistente y fuerte que ellos, mi enemigo está superado".
single_combat.0041.desc.opponent_response.POD_tormented_essence.injury:0 "En este difícil estado mental, son incapaces de defenderse adecuadamente".
single_combat.0041.desc.opponent_response.POD_adramelechs_wrath.injury:0 "Más rápido, resistente y fuerte que ellos, mi enemigo está superado".
single_combat.0041.desc.opponent_response.POD_blood_atemi.injury:0 "Mi oponente es golpeado una vez, pero consigue evitar la segunda. Aunque sigue siendo doloroso".
single_combat.0041.desc.opponent_response.POD_stand_upon_the_dragons_back.injury:0 "Mi oponente no puede devolverme el golpe, y el contraataque es doloroso."
single_combat.0041.desc.opponent_response.POD_dragon_ward.injury:0 "Mi oponente no puede romper mi defensa, y el contraataque es doloroso."
single_combat.0041.desc.opponent_response.POD_typhonic_maw.injury:0 "Le doy un tajo en las fauces monstruosas. Eso tiene que doler".
single_combat.0041.desc.opponent_response.POD_cobra_fangs.injury:0 "Mientras el veneno se disipa del colmillo de mi oponente, lo cojo con la mano y lo aplasto tan fuerte como puedo."
single_combat.0041.desc.opponent_response.POD_snout_strike.injury:0 "Así, mi oponente es incapaz de evitar el siguiente golpe que se le viene encima."
