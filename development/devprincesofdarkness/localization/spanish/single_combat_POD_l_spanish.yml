single_combat.0041.desc.opponent_response.POD_dragon_ward.fatality:0 "Son empujados hacia atrás, apenas se mantienen. Muy fuera de su alcance!"
single_combat.0041.desc.opponent_response.POD_typhonic_maw.fatality:0 "Hago un corte a lo largo de las monstruosas fauces. Un corte limpio a lo largo de esta fea cara pone fin a este combate".
single_combat.0041.desc.opponent_response.POD_cobra_fangs.fatality:0 "Mientras el veneno se disipa del colmillo de mi oponente, le doy un puñetazo en la cabeza extendida tan fuerte como puedo, asegurándome de que esta vez no se levantará."
