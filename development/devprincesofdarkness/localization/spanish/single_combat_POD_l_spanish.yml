#Agresor Ganado, Respuesta al Movimiento de Combate Propio
#Ejemplo: "Balanceo mi [sc_victor.Custom('signature_weapon')] en una finta casi perezosa. Mi oponente no ve mi daga fuera de la mano hasta que es demasiado tarde, cuando ya está"
single_combat.0041.desc.sc_attacker.POD_bite:0 "Me abalanzo hacia delante, intentando hundir mis afilados colmillos en el tentador cuello que tengo delante."
single_combat.0041.desc.sc_attacker.POD_blood_surge:0 "Invoco los poderes de mi sangre para que me den fuerza".
single_combat.0041.desc.sc_attacker.POD_blood_heal:0 "Invoco los poderes de mi sangre para tejer mis heridas y curarme."
single_combat.0041.desc.sc_attacker.POD_blink:0 "Corro hacia delante más rápido de lo que el ojo puede ver, esperando que mi oponente no tenga medios para anticiparse a mis movimientos."
single_combat.0041.desc.sc_attacker.POD_lightning_strike:0 "Golpeo instintivamente con el poder de la Celeridad, intentando pillar a mi oponente desprevenido."
single_combat.0041.desc.sc_attacker.POD_split_second:0 "El tiempo se ralentiza a mi alrededor cuando la Celeridad hace efecto. Debo aprovechar esa oportunidad".
single_combat.0041.desc.sc_attacker.POD_unerring_aim:0 "Gracias a mi dominio de la Celeridad, mi siguiente disparo es perfectamente preciso".
single_combat.0041.desc.sc_attacker.POD_lethal_body:0 "La potencia me permite lanzarme sobre mi oponente con la fuerza de una avalancha."
single_combat.0041.desc.sc_attacker.POD_brutal_feed:0 "Me lanzo hacia el cuello, esperando desangrar a mi oponente en cuestión de segundos."
single_combat.0041.desc.sc_attacker.POD_earthshock:0 "Golpeando la tierra, hago que el propio suelo tiemble bajo nosotros".
 single_combat.0041.desc.sc_attacker.POD_bone_obedience:0 "Mis huesos comienzan a volverse irrompibles."
single_combat.0041.desc.sc_attacker.POD_fist_of_caine:0 "Gracias a Potence, el aire movido por mis movimientos de lucha es un arma mortal en sí mismo."
single_combat.0041.desc.sc_attacker.POD_toughness:0 "Mi carne se vuelve antinaturalmente resistente, con la esperanza de bloquear cualquier golpe entrante."
single_combat.0041.desc.sc_attacker.POD_flesh_of_marble:0 "Mi carne se convierte en mármol sobrenatural, impermeable a cualquier daño. Con suerte".
single_combat.0041.desc.sc_attacker.POD_prowess_from_pain:0 "Mis heridas me alimentan, me hago más fuerte a cada segundo".
single_combat.0041.desc.sc_attacker.POD_feral_weapons:0 "Mis garras están extendidas, listas para partir a mi oponente por la mitad".
single_combat.0041.desc.sc_attacker.POD_shapechange:0 "Uso mi forma animal para saltar hacia mi oponente con los colmillos por delante".
single_combat.0041.desc.sc_attacker.POD_vanish:0 "Desaparezco de la vista, tratando de confundir a mi oponente".
single_combat.0041.desc.sc_attacker.POD_nocturne:0 "Las sombras se arremolinan alrededor de nuestro campo de batalla, dificultando la visión."
single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman:0 "Tentáculos negros aparecen de la tierra e intentan golpear a mi enemigo".
single_combat.0041.desc.sc_attacker.POD_the_darkness_within:0 "Las sombras se arremolinan alrededor de mi oponente, buscando una apertura".
single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows:0 "Una armadura de sombras aparece a mi alrededor, protegiéndome del daño".
single_combat.0041.desc.sc_attacker.POD_compel:0 "Lanzo una rápida orden a mi oponente".
single_combat.0041.desc.sc_attacker.POD_terminal_decree:0 "Doy una orden a mi oponente para que se haga daño".
single_combat.0041.desc.sc_attacker.POD_daunt:0 "Aparezco más grande, más poderoso, espero que lo suficiente para disuadir a mi enemigo".
single_combat.0041.desc.sc_attacker.POD_dread_gaze:0 "Aparezco como la peor pesadilla de mi enemigo".
single_combat.0041.desc.sc_attacker.POD_extinguir_vitae:0 "Con un movimiento de mi mano, hago inerte la sangre de mi oponente".
single_combat.0041.desc.sc_attacker.POD_scorpions_touch:0 "Extraigo parte de mi sangre, transmutándola en veneno".
single_combat.0041.desc.sc_attacker.POD_theft_of_vitae:0 "Hago que la sangre salga de la boca de mi enemigo y luego la guío hacia mí".
single_combat.0041.desc.sc_attacker.POD_baals_curse:0 "Extraigo parte de mi sangre y la transformo en un veneno extremadamente agresivo".
single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood:0 "Con un movimiento de mi mano, hago que la sangre de mi oponente hierva en sus propias venas."
single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion:0 "Toco a mi oponente y canalizo el crudo poder entrópico del Olvido a través de él."
single_combat.0041.desc.sc_attacker.POD_stygian_shroud:0 "Extiendo una oscuridad asfixiante por una gran zona, silenciando el sonido y suprimiendo todos los demás sentidos."
single_combat.0041.desc.sc_attacker.POD_fire_torch:0 "Espero un golpe de suerte mientras balanceo locamente mi antorcha".
single_combat.0041.desc.sc_attacker.POD_fire_bombas:0 "Lanzo el fuego alquímico hacia mi oponente".
single_combat.0041.desc.sc_attacker.POD_fire_spewer:0 "La extraña máquina escupe fuego salvajemente".
single_combat.0041.desc.sc_attacker.POD_crossbow_shot:0 "El disparo se produce buscando su objetivo".
single_combat.0041.desc.sc_attacker.POD_unleash_dogs:0 "Los perros se precipitan hacia mi enemigo, hambrientos de sangre y carne."
single_combat.0041.desc.sc_attacker.POD_stake_attack:0 "Me abalanzo hacia la estaca primero".
single_combat.0041.desc.sc_attacker.POD_oculi_trust:0 "Las palabras de Dios se pronuncian, sintiendo mi enemigo con pavor".
single_combat.0041.desc.sc_attacker.POD_oculi_wine:0 "Me abalanzo sobre mi oponente, buscando el contacto para que mi maldición se imponga."
single_combat.0041.desc.sc_attacker.POD_acre_catechumen:0 "Las palabras de Dios se pronuncian, sintiéndome con poder".
single_combat.0041.desc.sc_attacker.POD_acre_flesh:0 "Las palabras de Dios se pronuncian, sintiéndome con resistencia."
single_combat.0041.desc.sc_attacker.POD_acre_flight:0 "Bendecido por la Divinidad, soy más rápido que nunca".
single_combat.0041.desc.sc_attacker.POD_acre_auto:0 "Me preparo para lo que podría ser el golpe final".
single_combat.0041.desc.sc_attacker.POD_murnau_mirror:0 "El espejo de Dios me muestra el camino para igualar la destreza de este demonio".
single_combat.0041.desc.sc_attacker.POD_murnau_arcana:0 "Me preparo para tomar el control de los poderes del demonio".
single_combat.0041.desc.sc_attacker.POD_sisters_hosanna:0 "Canto la gloria de Dios, llenándome de fuerza".
single_combat.0041.desc.sc_attacker.POD_sisters_oratorio:0 "Canto la gloria de Dios, llenando de horror a mi enemigo".
single_combat.0041.desc.sc_attacker.POD_bone_obediencia:0 "Mis huesos empiezan a ser irrompibles".
single_combat.0041.desc.sc_attacker.POD_five_poison_cloud:0 "La energía Yin negra de la nube se lanza hacia mi enemigo".
single_combat.0041.desc.sc_attacker.POD_ching_shih:0 "La terrible forma de monstruo es ahora mía"
single_combat.0041.desc.sc_attacker.POD_long_neck:0 "Extiendo mis extremidades, dándome un alcance ilimitado".
single_combat.0041.desc.sc_attacker.POD_bloodlash:0 "Se crea un zarcillo de sangre, dándome nuevas oportunidades".
single_combat.0041.desc.sc_attacker.POD_goblin_scorch:0 "Las llamas del espíritu se lanzan hacia mi oponente".
single_combat.0041.desc.sc_attacker.POD_goblin_lantern:0 "Me convierto en un orbe resplandeciente de fuego".
single_combat.0041.desc.sc_attacker.POD_bone_dance:0 "La danza se ha completado, creando un velo de letargo en la zona."
single_combat.0041.desc.sc_attacker.POD_dragon_dance:0 "La danza se ha completado, y el trance ha comenzado."
single_combat.0041.desc.sc_attacker.POD_chi_interrupt:0 "Me abalanzo sobre mi oponente, buscando sus coyunturas Chi críticas".
single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare:0 "El dolor, la ira y la desesperación consumen repentinamente el alma de mi oponente".
single_combat.0041.desc.sc_attacker.POD_wind_attack:0 "El viento está en marcha, y yo soy más rápido que nunca".
single_combat.0041.desc.sc_attacker.POD_demon_claws:0 "Yo soy el demonio y él soy yo. Vamos a prevalecer".
single_combat.0041.desc.sc_attacker.POD_tormented_essence:0 "El dolor, la ira y la desesperación consumen de repente el alma de mi oponente".
single_combat.0041.desc.sc_attacker.POD_adramelechs_wrath:0 "Yo soy el demonio y él soy yo. Nos impondremos".
single_combat.0041.desc.sc_attacker.POD_blood_atemi:0 "Me abalanzo sobre mi oponente, intentando que su sistema circulatorio se vuelva loco".
single_combat.0041.desc.sc_attacker.POD_stand_upon_the_dragons_back:0 "Canalizo el Chi de los flujos naturales de la Tierra hacia mi cuerpo".
single_combat.0041.desc.sc_attacker.POD_dragon_ward:0 "Amplío el tercer ojo y canalizo mi Chi en una poderosa guardia de protección."
single_combat.0041.desc.sc_attacker.POD_typhonic_maw:0 "Ensancho mi mandíbula lo suficiente como para tragarme a mi oponente".
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.injury:0 "Como tal, mi oponente de repente se siente bastante más débil y la Bestia ruge en triunfo anticipado."
single_combat.0041.desc.sc_attacker.POD_cobra_fangs:0 "Mis colmillos se vuelven venenosos, buscando un camino en la carne de mi oponente".
single_combat.0041.desc.sc_attacker.POD_snout_strike:0 "Intento hacer un golpe corto y despiadado, o quizás, un agarre, al hocico".
single_combat.0041.desc.sc_attacker.POD_chi_breaker:0 "Intento clavar una mano en el torso de mi oponente e interrumpir el flujo natural de Chi dentro del cuerpo de mi oponente."
single_combat.0041.desc.sc_attacker.POD_hundred_star_shower:0 "Cargo el shuriken con mi propia fuerza vital".
single_combat.0041.desc.sc_attacker.POD_jaw_hammer:0 "Intento dar un poderoso golpe diseñado para destrozar los huesos de la mandíbula de mi oponente."
single_combat.0041.desc.sc_attacker.POD_fading_light_strike:0 "Intento robar la energía de mi oponente".
single_combat.0041.desc.sc_attacker.POD_chain_snake:0 "Intento bloquear el ataque de mi oponente mientras capturo el miembro atacante".
single_combat.0041.desc.sc_attacker.POD_twisting_thrust:0 "Intento cortar profundamente el cuerpo de mi oponente".
single_combat.0041.desc.sc_attacker.POD_prone_attacks:0 "Caigo en decúbito prono.."
single_combat.0041.desc.sc_attacker.POD_dagger_claw:0 "Extiendo los dedos de ambas manos y los clavo en los bajos de mi oponente."


#Agresor Ganado, Movimiento de Combate Propio Herido
#Ejemplo "Navego con el pomo por delante para [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')].\NEl golpe impacta en [sc_loser.GetFirstNameNoTooltip] #EMP con fuerza, golpeando tan profundamente que juro que puedo sentir el hematoma del hueso, y [sc_loser. GetSheHe] se tambalea hacia atrás aturdido.\NCuando el [sc_loser.Custom('signature_weapon')] cae de la mano de [sc_loser.GetHerHis], mi oponente balbucea un rendimiento sin que yo tenga que hacer nada."
single_combat.0041.desc.sc_attacker.POD_bite.injury:0 "Y se conecta, el embriagador aroma de la sangre impregna el aire. Apenas se extraen de este abrazo mortal antes de que sea demasiado tarde".
single_combat.0041.desc.sc_attacker.POD_blood_surge.injury:0 "Me veo más alto y más fuerte, fortalecido por la sangre. Rápidamente, empujo mi ventaja".
single_combat.0041.desc.sc_attacker.POD_blood_heal.injury:0 "Todas mis heridas desaparecen ante mis ojos mientras el poder de la sangre me cura. Rápidamente aprieto mi ventaja".
single_combat.0041.desc.sc_attacker.POD_blink.injury:0 "Y no tienen ninguna, pronto se reducen a recuperarse, con dificultad, de mis embestidas."
single_combat.0041.desc.sc_attacker.POD_lightning_strike.injury:0 "Lo que hago, mi enemigo pronto es empujado hacia atrás por este ataque inesperado."
single_combat.0041.desc.sc_attacker.POD_split_second.injury:0 "Mi oponente no está lo suficientemente preparado, y le llega un fuerte golpe, demasiado rápido para ser evitado por su deformado sentido del tiempo."
single_combat.0041.desc.sc_attacker.POD_unerring_aim.injury:0 "Mi oponente no puede hacer otra cosa que recibirlo, sintiendo cómo su carne no muerta protesta por este maltrato."
single_combat.0041.desc.sc_attacker.POD_lethal_body.injury:0 "Mi oponente no tarda en levantarse a duras penas, sintiendo como si una casa entera se le hubiera derrumbado encima".
single_combat.0041.desc.sc_attacker.POD_brutal_feed.injury:0 "Mi oponente consigue extraerse de este abrazo mortal, pero no antes de haber sentido el agudo dolor causado por mis colmillos."
single_combat.0041.desc.sc_attacker.POD_earthshock.injury:0 "Mi oponente cae y aprovecho para golpear brutalmente. Apenas evitan el golpe destinado al cuello".
single_combat.0041.desc.sc_attacker.POD_fist_of_caine.injury:0 "Esta tempestad es como puñales en su piel, cortando grandes franjas de la carne del no muerto con cada movimiento."
single_combat.0041.desc.sc_attacker.POD_toughness.injury:0 "Nada parece poder atravesar mi defensa. Mi oponente se agota tratando de atravesar".
single_combat.0041.desc.sc_attacker.POD_flesh_of_marble.injury:0 "Nada parece poder perforar mi defensa. Mi oponente se agota tratando de atravesar".
single_combat.0041.desc.sc_attacker.POD_prowess_from_pain.injury:0 "Alimentado por este terrible poder, doy un poderoso golpe que hace retroceder a mi oponente."
single_combat.0041.desc.sc_attacker.POD_feral_weapons.injury:0 "Y casi lo consigo, ya que mi oponente apenas logra evitar un golpe ciertamente mortal que viene hacia él."
single_combat.0041.desc.sc_attacker.POD_shapechange.injury:0 "Sorprendido por este repentino cambio, mi oponente es golpeado y tiene que hacer retroceder furiosamente al monstruo en que me he convertido."
single_combat.0041.desc.sc_attacker.POD_vanish.injury:0 "Como tal, mi oponente no ve el siguiente golpe que viene por detrás. Y le duele".
single_combat.0041.desc.sc_attacker.POD_nocturne.injury:0 "Como tal, mi oponente no ve el siguiente golpe que viene por detrás. Y le duele".
single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman.injury:0 "Mi oponente evita uno de ellos pero no el segundo... y estas cosas duelen".
single_combat.0041.desc.sc_attacker.POD_the_darkness_within.injury:0 "Saltan de repente a la boca de mi oponente, que tiene que usar toda su fuerza de voluntad para expulsarlos."
single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows.injury:0 "Nada parece poder atravesar mi defensa. Mi oponente se agota tratando de atravesar".
single_combat.0041.desc.sc_attacker.POD_compel.injury:0 "Pilla a mi enemigo con la guardia baja, y no tarda en recuperarse de un golpe asestado mientras estaba distraído."
single_combat.0041.desc.sc_attacker.POD_terminal_decree.injury:0 "Lo que hacen obedientemente, sintiendo primero humillación que dolor."
single_combat.0041.desc.sc_attacker.POD_daunt.injury:0 "Pilla a mi enemigo desprevenido, y pronto se recupera de un golpe asestado mientras estaba distraído."
single_combat.0041.desc.sc_attacker.POD_dread_gaze.injury:0 "Atrapa a mi enemigo con la guardia baja, y pronto se recupera de un golpe asestado mientras estaba distraído."
single_combat.0041.desc.sc_attacker.POD_extinguir_vitae.injury:0 "Así, mi oponente se siente repentinamente bastante más débil y la Bestia ruge en un triunfo anticipado."
single_combat.0041.desc.sc_attacker.POD_scorpions_touch.injury:0 "Golpeado por él, mi enemigo se siente mal y sus movimientos son lentos."
single_combat.0041.desc.sc_attacker.POD_theft_of_vitae.injury:0 "Mi enemigo es impotente para detenerlo, ¡su preciosa sangre es mía!"
single_combat.0041.desc.sc_attacker.POD_baals_curse.injury:0 "Golpeado por ella, mi enemigo se siente enfermo y sus movimientos son lentos".
single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood.injury:0 "¡Arde, arde!"
single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion.injury:0 "La sangre de mi oponente se mezcla de repente con sombras agresivas que intentan apoderarse de ella. No es una experiencia agradable".
single_combat.0041.desc.sc_attacker.POD_stygian_shroud.injury:0 "Como tal, mi oponente no ve el siguiente golpe que viene por detrás. Y le duele".
single_combat.0041.desc.sc_attacker.POD_fire_torch.injury:0 "Mi oponente lo esquiva a duras penas, pero no antes de que parte del fuego le queme la carne."
single_combat.0041.desc.sc_attacker.POD_fire_bombs.injury:0 "Mi oponente lo esquiva a duras penas, pero no antes de que parte del fuego queme su carne."
single_combat.0041.desc.sc_attacker.POD_fire_spewer.injury:0 "Mi oponente lo esquiva a duras penas, pero no antes de que parte del fuego queme su carne."
single_combat.0041.desc.sc_attacker.POD_crossbow_shot.injury:0 "Golpea a mi enemigo con un sonido estrepitoso, y es rechazado por este asalto."
single_combat.0041.desc.sc_attacker.POD_unleash_dogs.injury:0 "Mi oponente los despacha, pero no lo suficientemente rápido, consiguen desgarrarlos durante un rato".
single_combat.0041.desc.sc_attacker.POD_stake_attack.injury:0 "La estaca falla en el corazón de mi oponente, pero aun así le roza de forma bastante dolorosa."
single_combat.0041.desc.sc_attacker.POD_oculi_trust.injury:0 "Así, mi enemigo es incapaz de evitar el siguiente golpe que se le viene encima."
single_combat.0041.desc.sc_attacker.POD_oculi_wine.injury:0 "Mi oponente está herido, y parte de su carne se convierte en cenizas antes de que pueda enredarse."
single_combat.0041.desc.sc_attacker.POD_acre_catechumen.injury:0 "El siguiente golpe que recibe mi enemigo es especialmente doloroso".
single_combat.0041.desc.sc_attacker.POD_acre_flesh.injury:0 "Mi oponente no puede romper mi defensa, y el contraataque es doloroso".
single_combat.0041.desc.sc_attacker.POD_acre_flight.injury:0 "Así, mi oponente es incapaz de evitar el siguiente golpe que viene."
single_combat.0041.desc.sc_attacker.POD_acre_auto.injury:0 "No del todo, pero sigue siendo muy doloroso ya que mi enemigo retrocede ante él."
single_combat.0041.desc.sc_attacker.POD_murnau_mirror.injury:0 "Así, mi enemigo es incapaz de evitar el siguiente golpe que se le viene encima."
single_combat.0041.desc.sc_attacker.POD_murnau_arcana.injury:0 "Sorprendido, el retroceso de la misma hiere bastante a mi oponente".
single_combat.0041.desc.sc_attacker.POD_sisters_hosanna.injury:0 "El siguiente golpe que recibe mi enemigo es especialmente doloroso".
single_combat.0041.desc.sc_attacker.POD_sisters_oratorio.injury:0 "Así, mi adversario es incapaz de evitar el siguiente golpe que le llega."
single_combat.0041.desc.sc_attacker.POD_bone_obedience.injury:0 "Mi oponente no puede romper mi defensa, y el contraataque es doloroso."
single_combat.0041.desc.sc_attacker.POD_five_poison_cloud.injury:0 "Mi oponente es engullido por ella, y apenas consigue escapar antes de que sea demasiado tarde."
single_combat.0041.desc.sc_attacker.POD_ching_shih.injury:0 "Más rápido, resistente y fuerte que ellos, mi enemigo está superado".
single_combat.0041.desc.sc_attacker.POD_long_neck.injury:0 "Como tal, mi oponente es incapaz de evitar el siguiente golpe que viene hacia él".
single_combat.0041.desc.sc_attacker.POD_bloodlash.injury:0 "Mi oponente es sorprendido por él, y rápidamente golpeado por el asalto".
single_combat.0041.desc.sc_attacker.POD_goblin_scorch.injury:0 "Mi oponente es engullido por él, y apenas consigue escapar antes de que sea demasiado tarde."
single_combat.0041.desc.sc_attacker.POD_goblin_lantern.injury:0 "Esta extraña táctica ha sorprendido a mi enemigo, y sufre graves quemaduras antes de volver en sí."
single_combat.0041.desc.sc_attacker.POD_bone_dance.injury:0 "Así, mi oponente es incapaz de evitar el siguiente golpe que se le viene encima."
single_combat.0041.desc.sc_attacker.POD_dragon_dance.injury:0 "Más rápido, resistente y fuerte que ellos, mi enemigo está superado".
single_combat.0041.desc.sc_attacker.POD_chi_interrupt.injury:0 "Mi oponente recibe un golpe, pero consigue evitar el segundo. Aunque sigue siendo doloroso".
single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare.injury:0 "En este difícil estado de ánimo, mi enemigo es incapaz de defenderse adecuadamente."
single_combat.0041.desc.sc_attacker.POD_wind_attack.injury:0 "Así, mi adversario es incapaz de evitar el siguiente golpe que se le avecina."
single_combat.0041.desc.sc_attacker.POD_demon_claws.injury:0 "Más rápido, resistente y fuerte que ellos, mi enemigo está superado".
single_combat.0041.desc.sc_attacker.POD_tormented_essence.injury:0 "En este difícil estado de ánimo, son incapaces de defenderse adecuadamente".
single_combat.0041.desc.sc_attacker.POD_adramelechs_wrath.injury:0 "Más rápido, resistente y fuerte que ellos, mi enemigo está superado".
single_combat.0041.desc.sc_attacker.POD_blood_atemi.injury:0 "Mi oponente es golpeado una vez, pero consigue evitar la segunda. Aunque sigue siendo doloroso".
single_combat.0041.desc.sc_attacker.POD_stand_upon_the_dragons_back.injury:0 "Mi oponente no puede devolverme el golpe, y el contraataque es doloroso."
single_combat.0041.desc.sc_attacker.POD_dragon_ward.injury:0 "Mi oponente no puede romper mi defensa, y el contraataque es doloroso."
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.fatality:0 "Como tal, mi oponente de repente se siente bastante más débil y la Bestia ruge en triunfo anticipado. Me lanzo hacia adelante y golpeo a través del corazón para el golpe final."
single_combat.0041.desc.sc_attacker.POD_typhonic_maw.injury:0 "Doy un tajo en las fauces monstruosas. Eso tiene que doler".
single_combat.0041.desc.sc_attacker.POD_cobra_fangs.injury:0 "Mientras el veneno se disipa del colmillo de mi oponente, lo cojo con la mano y lo aplasto con toda la fuerza que puedo."
single_combat.0041.desc.sc_attacker.POD_snout_strike.injury:0 "Como tal, mi oponente es incapaz de evitar el siguiente golpe que viene hacia él."
