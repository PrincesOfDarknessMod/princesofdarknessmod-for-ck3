single_combat.0031.desc.opponent_response.POD_bone_obedience.fatality:0 "No puedo romper la defensa de mi oponente, y el contraataque es crítico. No tengo ninguna posibilidad".
single_combat.0031.desc.opponent_response.POD_five_poison_cloud.fatality:0 "Me engulle y muero en una tos venenosa arrastrándome al suelo".
single_combat.0031.desc.opponent_response.POD_ching_shih.fatality:0 "Más rápido, resistente y fuerte que yo, me supera. Y rápidamente despachado en un golpe rápido y despiadado".
single_combat.0031.desc.opponent_response.POD_long_neck.fatality:0 "Como tal, soy incapaz de evitar el siguiente golpe que viene hacia mí. Y el siguiente. Y... hasta que no quede nada que ver".
single_combat.0031.desc.opponent_response.POD_bloodlash.fatality:0 "Me sorprende, y rápidamente me hace retroceder el asalto. Mi enemigo aprovecha la oportunidad, y mi cabeza no tarda en rodar por el suelo".
single_combat.0031.desc.opponent_response.POD_goblin_scorch.fatality:0 "Soy engullido por él, y muero en un infierno ardiente".
single_combat.0031.desc.opponent_response.POD_goblin_lantern.fatality:0 "Soy engullido por él y muero en un infierno ardiente".
single_combat.0031.desc.opponent_response.POD_bone_dance.fatality:0 "Como tal, soy incapaz de evitar el siguiente golpe que viene hacia mí. Y el siguiente. Y... hasta que no quede nada que ver".
single_combat.0031.desc.opponent_response.POD_dragon_dance.fatality:0 "Más rápido, más resistente y más fuerte que yo, me veo superado. Y rápidamente despachado en un golpe rápido y despiadado".
single_combat.0031.desc.opponent_response.POD_chi_interrupt.fatality:0 "Me golpean una, dos y luego tres veces... con la sangre detenida en mis venas, estoy paralizado. Mi oponente no tarda en acabar con mi miseria".
single_combat.0031.desc.opponent_response.POD_thousand_hell_stare.fatality:0 "En este difícil estado mental, soy incapaz de defenderme adecuadamente. Es una debilidad fatal, y una que no tendré que lamentar por mucho tiempo".
single_combat.0031.desc.opponent_response.POD_wind_attack.fatality:0 "Como tal, soy incapaz de evitar el siguiente golpe que viene hacia mí. Y el siguiente. Y... hasta que no quede nada que ver".
single_combat.0031.desc.opponent_response.POD_demon_claws.fatality:0 "Más rápido, más resistente y más fuerte que yo, estoy superado. Y rápidamente despachado en un golpe rápido y despiadado".
single_combat.0031.desc.opponent_response.POD_tormented_essence.fatality:0 "En este difícil estado mental, soy incapaz de defenderme adecuadamente. Es una debilidad fatal, y una que no tendré que lamentar por mucho tiempo".
single_combat.0031.desc.opponent_response.POD_adramelechs_wrath.fatality:0 "Más rápido, más resistente y más fuerte que yo, estoy superado. Y rápidamente despachado en un golpe rápido y despiadado".
single_combat.0031.desc.opponent_response.POD_blood_atemi.fatality:0 "Me golpean una, dos y luego tres veces... con mi sistema circulatorio enloquecido, estoy paralizado. Mi adversario no tarda en acabar con mi miseria".
single_combat.0031.desc.opponent_response.POD_stand_upon_the_dragons_back.fatality:0 "Ni siquiera puedo devolver el golpe a mi oponente, y el contraataque es crítico. No tengo ninguna posibilidad".
single_combat.0031.desc.opponent_response.POD_dragon_ward.fatality:0 "No puedo romper la defensa de mi oponente, y el contraataque es crítico. No tengo ninguna posibilidad".
single_combat.0031.desc.opponent_response.POD_typhonic_maw.fatality:0 "La mandíbula tifónica me engulle, acabando con mi vida inmortal en fosas estomacales de ácido".
single_combat.0031.desc.opponent_response.POD_cobra_fangs.fatality:0 "Un colmillo venenoso me golpea. El veneno se extiende rápidamente a mi sangre, convirtiéndola, y luego a mí, en ácido. Mi final apesta a azufre y suena como la risa de mi oponente".
single_combat.0031.desc.opponent_response.POD_snout_strike.fatality:0 "Un agarre a mi hocico. Me despachan rápidamente en un golpe rápido y despiadado".
single_combat.0031.desc.opponent_response.POD_chi_breaker.fatality:0 "Mi oponente clava su mano en mi torso, mi flujo se ve interrumpido. Lo suficientemente mal como para que el resto del combate sea un asunto seguro".
single_combat.0031.desc.opponent_response.POD_hundred_star_shower.fatality:0 "El impacto de los misiles cargados de chi es mucho mayor de lo que sería en circunstancias normales. No tenía ninguna posibilidad".
single_combat.0031.desc.opponent_response.POD_jaw_hammer.fatality:0 "Tengo la mandíbula rota. Mi cráneo también".
single_combat.0031.desc.opponent_response.POD_fading_light_strike.fatality:0 "Me han robado el poder. Lo suficientemente mal como para que el resto del combate sea un asunto seguro".
single_combat.0031.desc.opponent_response.POD_chain_snake.fatality:0 "Mi ataque es bloqueado, al mismo tiempo, un extremo de la cadena golpea mis órganos vitales".
single_combat.0031.desc.opponent_response.POD_twisting_thrust.fatality:0 "Un corte profundo en mi cuerpo. No tenía ninguna posibilidad".
single_combat.0031.desc.opponent_response.POD_prone_attacks.fatality:0 "No puedo romper la defensa de mi oponente, y el contraataque es crítico. No tengo ninguna posibilidad".
single_combat.0031.desc.opponent_response.POD_dagger_claw.fatality:0 "Más rápido, más resistente y más fuerte que yo, me veo superado. Y rápidamente despachado en un golpe rápido y despiadado".


#Agresor perdido, retroalimentación del movimiento de combate propio
#Ejemplo: "Dividir mi atención entre dos golpes resulta haber sido... ambicioso. La primera vez que me doy cuenta de que el [sc_loser.Custom('signature_weapon')] ha sido arrancado de mis manos es cuando mi puñal de mano se mueve involuntariamente hacia él,"
single_combat.0031.desc.sc_attacker.POD_bite:0 "Mi oponente esquiva sin esfuerzo mi embestida hacia delante, dejándome totalmente abierto para un contraataque."
single_combat.0031.desc.sc_attacker.POD_blood_surge:0 "No consigo despertar la sangre de mi interior, ya que necesito toda mi concentración para adelantarme a mi enemigo."
single_combat.0031.desc.sc_attacker.POD_blood_heal:0 "No consigo despertar la sangre de mi interior ya que necesito toda la concentración para adelantarme a mi enemigo."
single_combat.0031.desc.sc_attacker.POD_blink:0 "Demasiado rápido, estoy fuera de posición para el siguiente combate".
single_combat.0031.desc.sc_attacker.POD_lightning_strike:0 "Mi golpe, aunque rápido, carece de precisión y falla".
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae:0 "La sangre de mi oponente es demasiado fuerte para los trucos de salón y sigue siendo tan efectiva como siempre."
single_combat.0031.desc.sc_attacker.POD_split_second:0 "A pesar del paso torcido del tiempo, mi enemigo parece adaptarse bastante bien."
single_combat.0031.desc.sc_attacker.POD_unerring_aim:0 "Una puntería perfecta... pero falta de fuerza, apenas roza su objetivo".
single_combat.0031.desc.sc_attacker.POD_lethal_body:0 "La fuerza no es nada sin la precisión, ya que mis poderosos ataques fallan su objetivo."
single_combat.0031.desc.sc_attacker.POD_brutal_feed:0 "Mis colmillos apenas fallan en el cuello de mi oponente, dejándome abierto a un contraataque."
single_combat.0031.desc.sc_attacker.POD_earthshock:0 "Firme en sus pies, mi oponente apenas se mueve por el terremoto".
single_combat.0031.desc.sc_attacker.POD_fist_of_caine:0 "El viento movido por mis ataques potenciados por la Potencia son apenas una pequeña brisa para mi enemigo."
single_combat.0031.desc.sc_attacker.POD_toughness:0 "A pesar de mi dureza mejorada, los poderosos golpes de mi oponente siguen doliendo como un demonio."
 single_combat.0031.desc.sc_attacker.POD_fire_bombs:0 "El pequeño brebaje es fácilmente esquivado por mi enemigo."
single_combat.0031.desc.sc_attacker.POD_flesh_of_marble:0 "El mármol puede romperse, como demuestran ahora mismo los golpes demoledores de mi oponente."
single_combat.0031.desc.sc_attacker.POD_prowess_from_pain:0 "Incluso un vampiro masoquista tiene límites. Duele demasiado para ser placentero y útil ahora mismo".
single_combat.0031.desc.sc_attacker.POD_feral_weapons:0 "Mi enemigo esquiva hábilmente mis mortíferas garras, consciente de su peligro".
single_combat.0031.desc.sc_attacker.POD_shapechange:0 "Abrumado por los instintos animales, mis ataques son brutales pero carecen de la precisión suficiente para aterrizar."
single_combat.0031.desc.sc_attacker.POD_vanish:0 "Buscando las pequeñas inconsistencias de la zona, mi adversario consigue descubrirme".
single_combat.0031.desc.sc_attacker.POD_nocturne:0 "Mi enemigo parece apenas ralentizado por las sombras, sigue luchando al máximo".
single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman:0 "Apartándose rápidamente del camino, mi oponente consigue salir del alcance de los brazos."
single_combat.0031.desc.sc_attacker.POD_the_darkness_within:0 "No se presenta ninguna abertura, mi enemigo evita las sombras arremolinadas casi a la perfección."
single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows:0 "Mientras la luz disipa la oscuridad, los poderosos movimientos de mi oponente destrozan mi armadura de sombras."
single_combat.0031.desc.sc_attacker.POD_compel:0 "En un esfuerzo supremo de fuerza de voluntad, mi oponente hace caso omiso de mi orden."
single_combat.0031.desc.sc_attacker.POD_terminal_decree:0 "En un esfuerzo supremo de fuerza de voluntad, mi oponente hace caso omiso de mi orden."
single_combat.0031.desc.sc_attacker.POD_daunt:0 "Mi oponente no se amedrenta en absoluto por mi presencia mejorada, y sigue luchando al máximo."
single_combat.0031.desc.sc_attacker.POD_dread_gaze:0 "Mi oponente parece disfrutar golpeando a su peor pesadilla, lo que hace que la mirada de pavor sea bastante ineficaz."
single_combat.0031.desc.sc_attacker.POD_extinguir_vitae:0 "La sangre de mi oponente es demasiado fuerte para los trucos de salón, y sigue siendo tan efectiva como siempre."
 single_combat.0031.desc.sc_attacker.POD_bone_obedience:0 "Pero la carga implacable de mi oponente todavía duele."
single_combat.0031.desc.sc_attacker.POD_scorpions_touch:0 "Un veneno mortal no sirve de nada si no puedes administrarlo, y tu oponente se cuida mucho de evitar tus próximos golpes."
single_combat.0031.desc.sc_attacker.POD_theft_of_vitae:0 "La sangre de mi oponente es demasiado fuerte para los trucos de salón y se queda molesta en su cuerpo."
single_combat.0031.desc.sc_attacker.POD_baals_curse:0 "Un veneno mortal es inútil si no puedes administrarlo, y tu oponente tiene mucho cuidado de evitar tus próximos golpes."
single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood:0 "La sangre de mi oponente es demasiado fuerte para mi efecto, su sangre se mantiene fría a pesar de mis mejores esfuerzos."
single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion:0 "El toque de Oblivion apenas roza a mi oponente, haciéndolo casi inútil."
single_combat.0031.desc.sc_attacker.POD_stygian_shroud:0 "Incluso con sus sentidos embotados por el sudario, mi oponente sigue luchando al máximo."
single_combat.0031.desc.sc_attacker.POD_fire_torch:0 "Esta vez no hay golpe de suerte, mi antorcha se esquiva sin esfuerzo".
single_combat.0031.desc.sc_attacker.POD_fire_bombas:0 "El pequeño brebaje es esquivado fácilmente por mi enemigo".
single_combat.0031.desc.sc_attacker.POD_fire_spewer:0 "Con una puntería tremendamente imprecisa, el fuego ni siquiera se acerca a su objetivo."
single_combat.0031.desc.sc_attacker.POD_crossbow_shot:0 "El disparo se aleja mucho de su objetivo".
single_combat.0031.desc.sc_attacker.POD_unleash_dogs:0 "Los animales son despachados rápidamente".
single_combat.0031.desc.sc_attacker.POD_stake_attack:0 "Mi imprudente ataque es fácilmente esquivado".
