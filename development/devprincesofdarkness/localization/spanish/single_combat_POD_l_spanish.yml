single_combat.0041.desc.opponent_response.POD_jaw_hammer.injury:0 "Como tal, mi oponente es incapaz de evitar el siguiente golpe que viene hacia él."
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae.fatality:0 "Como tal, mi oponente de repente se siente bastante más débil y la Bestia ruge en triunfo anticipado. Me lanzo hacia adelante y golpeo a través del corazón para el golpe final."
