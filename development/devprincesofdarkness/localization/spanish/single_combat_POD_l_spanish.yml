#Defensor perdido, movimiento finalizador del oponente Fatality
#Ejemplo: "Antes de que [sc_loser.GetFirstNameNoTooltip] pueda sacar el arma secundaria de [sc_loser.GetHerHis], balanceo mi propia [sc_victor.Custom('signature_weapon')] en torno a [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetHerHis|U] cuerpo maltrecho es lanzado hacia atrás, con espasmos y sangrando en el [sc_defender.Custom('GroundType')].\NEn el minuto, todo movimiento se detiene."
single_combat.0041.desc.opponent_response.POD_bite.fatality:0 "Y se conecta, el aroma embriagador de la sangre impregna el aire. Pronto sucumben al beso y el dulce sabor de mi victoria es sangriento".
single_combat.0041.desc.opponent_response.POD_blood_surge.fatality:0 "Me veo más alto y más fuerte, fortalecido por la sangre. Rápidamente aprovecho mi ventaja y termino el combate con un rápido corte en el cuello. La cabeza derrotada rueda, sólo se detiene al chocar con mis pies".
single_combat.0041.desc.opponent_response.POD_blood_heal.fatality:0 "Todas mis heridas desaparecen ante mis ojos mientras el poder de la sangre me cura. Rápidamente aprieto mi ventaja y termino el combate con un rápido corte en el cuello. La cabeza derrotada rueda y sólo se detiene al chocar con mis pies".
single_combat.0041.desc.opponent_response.POD_blink.fatality:0 "Y no tienen ninguna, mi embestida sólo se detiene cuando sólo quedan cenizas ante mí."
single_combat.0041.desc.opponent_response.POD_lightning_strike.fatality:0 "Cosa que hago, mi enemigo no tarda en retroceder ante este inesperado ataque. Y atrás... y atrás... hasta que no queda lugar para la retirada".
single_combat.0041.desc.opponent_response.POD_split_second.fatality:0 "Mi oponente no está lo suficientemente preparado, y un fuerte golpe se dirige hacia él, demasiado rápido para ser evitado por su deformado sentido del tiempo. Los corta adecuadamente en dos mitades agradablemente simétricas".
single_combat.0041.desc.opponent_response.POD_unerring_aim.fatality:0 "Mi oponente no puede hacer otra cosa que recibirlo justo entre los ojos. No reprimo una sonrisa victoriosa mientras caen hacia atrás".
single_combat.0041.desc.opponent_response.POD_lethal_body.fatality:0 "Mi oponente se siente como si una casa entera se le hubiera derrumbado encima. Mientras ellos retroceden, yo tengo el terreno elevado. Así que todo ha terminado".
single_combat.0041.desc.opponent_response.POD_brutal_feed.fatality:0 "Mi oponente no consigue zafarse de este abrazo mortal. Pronto sucumben al beso y el dulce sabor de mi victoria es sangriento".
single_combat.0041.desc.opponent_response.POD_earthshock.fatality:0 "Mi oponente cae y aprovecho para golpear brutalmente. No evitan el golpe destinado al cuello".
single_combat.0041.desc.opponent_response.POD_fist_of_caine.fatality:0 "Esta tempestad es como puñales en su piel, cortando grandes franjas de carne de los no muertos con cada movimiento. Hasta que sólo queda un esqueleto. Luego sólo cenizas".
single_combat.0041.desc.opponent_response.POD_toughness.fatality:0 "Nada parece poder atravesar mi defensa. Mi oponente se agota intentando abrirse paso. Mi contraataque es rápido y mortal".
single_combat.0041.desc.opponent_response.POD_flesh_of_marble.fatality:0 "Nada parece poder perforar mi defensa. Mi oponente se agota intentando abrirse paso. Mi contraataque es rápido y mortal".
single_combat.0041.desc.opponent_response.POD_prowess_from_pain.fatality:0 "Impulsado por este terrible poder, doy un poderoso golpe que hace estallar las tripas de mi enemigo en un sangriento desastre."
single_combat.0041.desc.opponent_response.POD_feral_weapons.fatality:0 "Y sucede, ya que mi oponente no logra evitar un golpe mortal que se acerca."
single_combat.0041.desc.opponent_response.POD_shapechange.fatality:0 "Sorprendido por este repentino cambio, mi oponente es golpeado y tiene que hacer retroceder furiosamente al monstruo en que me he convertido. Pero es inútil, lo salvaje ha ganado este asalto contra el hombre".
single_combat.0041.desc.opponent_response.POD_vanish.fatality:0 "Así, mi oponente no ve el siguiente golpe que viene por detrás. Y es el último que sentirán".
single_combat.0041.desc.opponent_response.POD_nocturne.fatality:0 "Como tal, mi oponente no ve el siguiente golpe que viene por detrás. Y es el último que sentirán".
single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.fatality:0 "Mi oponente evita uno de ellos, pero no el segundo... lo que le hace volver hacia el primero. Mi victoria es la de los tentáculos de golpeo".
single_combat.0041.desc.opponent_response.POD_the_darkness_within.fatality:0 "Saltan de repente a la boca de mi oponente y, unos segundos después, una explosión de sangre y sombras pone fin a este duelo."
single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.fatality:0 "Nada parece poder atravesar mi defensa. Mi oponente se agota intentando abrirse paso. Mi contraataque es rápido y mortal".
single_combat.0041.desc.opponent_response.POD_compel.fatality:0 "Pilla a mi enemigo desprevenido, y aprovecho esta distracción para cortarle limpiamente el cuello."
single_combat.0041.desc.opponent_response.POD_terminal_decree.fatality:0 "Lo que hacen obedientemente, una y otra vez. Dejo escapar una risa malvada mientras mi ex enemigo se golpea hasta morir".
single_combat.0041.desc.opponent_response.POD_daunt.fatality:0 "Pilla a mi enemigo desprevenido, y presiono mi ventaja hasta que no queda nada que presionar."
single_combat.0041.desc.opponent_response.POD_dread_gaze.fatality:0 "Atrapa a mi enemigo con la guardia baja, y presiono mi ventaja hasta que no queda nada que presionar."
single_combat.0041.desc.opponent_response.POD_extinguir_vitae.fatality:0 "Así, mi oponente se siente repentinamente más débil y la Bestia ruge en un triunfo anticipado. Me abalanzo hacia delante y le atravieso el corazón para asestarle el golpe final".
single_combat.0041.desc.opponent_response.POD_scorpions_touch.fatality:0 "Golpeado por él, mi enemigo se siente mal y sus movimientos son lentos. Les concedo una muerte misericordiosa y los mato con un golpe rápido en lugar del lento beso del veneno".
single_combat.0041.desc.opponent_response.POD_theft_of_vitae.fatality:0 "Mi enemigo es impotente para detenerlo, ¡su preciosa sangre es mía! Y sin sangre, un vampiro es solo cenizas. Como pronto se demuestra frente a mí".
single_combat.0041.desc.opponent_response.POD_baals_curality:0 "Golpeado por ella, mi enemigo se siente enfermo y sus movimientos son lentos. Les concedo una muerte misericordiosa y los mato con un golpe rápido en lugar del lento beso del veneno".
single_combat.0041.desc.opponent_response.POD_cauldron_of_blood.fatality:0 "¡Arde, arde! Qué hoguera más agradable de ver, para variar".
single_combat.0041.desc.opponent_response.POD_touch_of_oblivion.fatality:0 "La sangre de mi oponente se mezcla de repente con sombras agresivas que intentan apoderarse de ella. Una vez que se ha extinguido cada gramo de sangre, las sombras desaparecen obedientemente".
single_combat.0041.desc.opponent_response.POD_stygian_shroud.fatality:0 "Como tal, mi oponente no ve el siguiente golpe que viene por detrás. Y es el último que sentirán".
single_combat.0041.desc.opponent_response.POD_fire_torch.fatality:0 "El lamentable ataque de mi oponente es entonces contrarrestado por un golpe magistral. No se recuperarán de este".
single_combat.0041.desc.opponent_response.POD_fire_bombs.fatality:0 "Sin embargo, no esquivan fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se les cae la cabeza de los hombros".
single_combat.0041.desc.opponent_response.POD_fire_spewer.fatality:0 "Sin embargo, mi siguiente golpe es mucho más preciso. Es un corte de cabeza limpio y satisfactorio".
single_combat.0041.desc.opponent_response.POD_crossbow_shot.fatality:0 "Mi siguiente golpe es mucho más preciso. Es un corte de cabeza limpio y satisfactorio".
single_combat.0041.desc.opponent_response.POD_unleash_dogs.fatality:0 "Les lanzo uno de sus perros como represalia. Lo atrapan por reflejos, dándome tiempo más que suficiente para asestar un golpe crítico."
single_combat.0041.desc.opponent_response.POD_stake_attack.fatality:0 "Sin embargo, no esquivan fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se les cae la cabeza de los hombros".
single_combat.0041.desc.opponent_response.POD_oculi_trust.fatality:0 "Son rápidamente empujados hacia atrás por mi implacable asalto. Acorralados, caen al suelo, indefensos".
single_combat.0041.desc.opponent_response.POD_oculi_wine.fatality:0 "Sin embargo, no esquivan fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se les cae la cabeza de los hombros".
single_combat.0041.desc.opponent_response.POD_acre_catechumen.fatality:0 "Mi contraataque les pilla desprevenidos y conecta. El final llega en un destello de acero".
single_combat.0041.desc.opponent_response.POD_acre_flesh.fatality:0 "Duele bastante. Lo suficiente como para distraerlos del siguiente golpe. Este no duele por mucho tiempo".
single_combat.0041.desc.opponent_response.POD_acre_flight.fatality:0 "O incluso los supera, ya que los hago retroceder. Y hacia atrás. Hasta que no haya dónde ir".
single_combat.0041.desc.opponent_response.POD_acre_auto.fatality:0 "Sin embargo, no esquivan fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se les cae la cabeza de los hombros".
single_combat.0041.desc.opponent_response.POD_murnau_mirror.fatality:0 "Son empujados hacia atrás, apenas se mantienen. Muy lejos de su alcance".
single_combat.0041.desc.opponent_response.POD_murnau_arcana.fatality:0 "Este les ha explotado en la cara. Luego les explotó la cara también".
single_combat.0041.desc.opponent_response.POD_sisters_hosanna.fatality:0 "Mi contraataque les pilla desprevenidos y conecta. El final llega en un destello de acero".
single_combat.0041.desc.opponent_response.POD_sisters_oratorio.fatality:0 "Mi contraataque les pilla desprevenidos y conecta. El final llega en un destello de acero".
single_combat.0041.desc.opponent_response.POD_bone_obedience.fatality:0 "Son empujados hacia atrás, apenas se mantienen. Muy lejos de su alcance".
single_combat.0041.desc.opponent_response.POD_five_poison_cloud.fatality:0 "Sin embargo, no esquivan fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se les cae la cabeza de los hombros".
single_combat.0041.desc.opponent_response.POD_ching_shih.fatality:0 "Están heridos, pero siguen en pie. Hasta que no lo están. Termina como empezó, en la oscuridad".
single_combat.0041.desc.opponent_response.POD_long_neck.fatality:0 "No lo hago, y mi oponente está herido. Lo suficientemente mal como para que el resto del combate sea un asunto seguro".
single_combat.0041.desc.opponent_response.POD_bloodlash.fatality:0 "Antes de conectar con un golpe rápido que lo hiere. Lo suficientemente mal como para que el resto de la pelea sea una conclusión previsible".
single_combat.0041.desc.opponent_response.POD_goblin_scorch.fatality:0 "Sin embargo, no esquivan fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se les cae la cabeza de los hombros".
