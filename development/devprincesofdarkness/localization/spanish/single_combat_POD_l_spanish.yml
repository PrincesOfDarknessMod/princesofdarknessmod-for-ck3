#Agresor perdido, movimiento de combate propio Fatality
#Ejemplo "lo que me distrae lo suficiente como para no notar el seguimiento [sc_victor.Custom('SignatureWeaponAttemptedLight')] antes de que sea [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')]. \Me tambaleo y luego caigo de espaldas en el [sc_defender.Custom('GroundType')], convulsionando, intentando gritar pero sin conseguir más que un ronco susurro. ¿Cómo podría alguien sobrevivir a tanto dolor #EMP? No podrían".
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae.fatality:0 "Lo cual pronto puedo confirmar cuando una patada mejorada con sangre me golpea en las entrañas. Pronto me quedo sin agallas, y tampoco inmortalidad."
single_combat.0031.desc.sc_attacker.POD_bite.fatality:0 "Y llega rápidamente, en forma de golpe en la cara, cortándola adecuadamente por la mitad."
single_combat.0031.desc.sc_attacker.POD_blood_surge.fatality:0 "Y la pequeña distracción es suficiente para que mi oponente tome ventaja con un rápido golpe en tu cuello. Tu cabeza no tarda en rodar por el suelo, lo que no es muy saludable".
single_combat.0031.desc.sc_attacker.POD_blood_heal.fatality:0 "Y la pequeña distracción es suficiente para que mi oponente tome ventaja con un rápido golpe en tu cuello. Tu cabeza no tarda en rodar por el suelo, lo que no es muy saludable"
single_combat.0031.desc.sc_attacker.POD_blink.fatality:0 "Y lo pierdo aún más grave como preveía. Aunque ya no perderé nada, si eso cuenta como una gracia salvadora".
single_combat.0031.desc.sc_attacker.POD_lightning_strike.fatality:0 "El contraataque de mi oponente no lo hace. Mi corazón es atravesado y reventado. Un final sangriento".
single_combat.0031.desc.sc_attacker.POD_split_second.fatality:0 "Me alcanza su siguiente ataque como si nada. Y fue dirigido a mi cuello. Un final sin gloria".
single_combat.0031.desc.sc_attacker.POD_unerring_aim.fatality:0 "Acercando la distancia, mi enemigo me da un puñetazo en la tripa por mi descaro. Luego en la cara. Luego me arranca el cuello de los hombros".
single_combat.0031.desc.sc_attacker.POD_lethal_body.fatality:0 "Los de mis adversarios no son tristes. Y eso duele. Hasta que no lo hace, ya que la oscuridad te traga".
single_combat.0031.desc.sc_attacker.POD_brutal_feed.fatality:0 "Y llega rápido, en forma de golpe en la cara, cortándola adecuadamente por la mitad".
single_combat.0031.desc.sc_attacker.POD_earthshock.fatality:0 "Distraído por este fallo, no veo llegar el siguiente golpe. Y ahora, no veré nada nunca más".
single_combat.0031.desc.sc_attacker.POD_fist_of_caine.fatality:0 "Sin embargo, sus golpes son mucho más para mí y pronto me derrumbo en el suelo, sin poder hacer nada más que mirar el final de golpe que se me viene encima."
single_combat.0031.desc.sc_attacker.POD_toughness.fatality:0 "Parece que la fortaleza no fue suficiente esta vez. No fue suficiente para salvar del poderoso golpe dirigido a tu cuello que viene a continuación".
single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.fatality:0 "Me siento como en el centro de un terremoto. Y pronto eres tragado por él, para no volver a ser visto".
single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.fatality:0 "Mi oponente se asegura rápidamente de que pronto duela aún más. Hasta que no lo hace".
single_combat.0031.desc.sc_attacker.POD_feral_weapons.fatality:0 "Su contraataque no es menos peligroso, y soy incapaz de salvarme de la siguiente ronda de poderosos golpes que se me viene encima."
single_combat.0031.desc.sc_attacker.POD_shapechange.fatality:0 "Canalizando generaciones de humanidad domando la vida salvaje, mi oponente comienza a golpear la luz del día de mi forma animal. Una rotunda victoria para la humanidad en este episodio de hombre contra salvaje".
single_combat.0031.desc.sc_attacker.POD_vanish.fatality:0 "Su siguiente golpe también lo hace. Y el siguiente. Y el siguiente..."
single_combat.0031.desc.sc_attacker.POD_nocturne.fatality:0 "Como lo demuestra su siguiente golpe, casi perfecto. Y el siguiente. Y el siguiente..."
single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman.fatality:0 "Distraído por este fracaso, tengo que soportar alguna represalia rápida. En mi estado actual, no soy capaz de recuperarme lo suficientemente rápido. Esto terminará pronto".
single_combat.0031.desc.sc_attacker.POD_the_darkness_within.fatality:0 "No me va muy bien contra su siguiente golpe, lamentablemente. La inmortalidad siempre acaba en muerte de alguna manera".
single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows.fatality:0 "No ser invulnerable duele mucho, al parecer. Sin embargo, estar realmente muerto no, como pronto aprenderás".
single_combat.0031.desc.sc_attacker.POD_compel.fatality:0 "Y luego ordena que su puño se clave en mi cabeza. Funciona. A mi cabeza no le gusta y decide desprenderse de mi cuerpo".
single_combat.0031.desc.sc_attacker.POD_terminal_decree.fatality:0 "Y luego ordena que su puño se dirija a mi cabeza. Funciona. A mi cabeza no le gusta y decide desprenderse de mi cuerpo".
single_combat.0031.desc.sc_attacker.POD_daunt.fatality:0 "Como demuestra su siguiente golpe, casi perfecto. Y el siguiente. Y el siguiente..."
single_combat.0031.desc.sc_attacker.POD_dread_gaze.fatality:0 "Y duele bastante estar en el extremo receptor. Como pronto sientes que la maldición de Caine abandona tu cuerpo, tienes el pequeño consuelo de haber ayudado a tu enemigo a superar brutalmente su miedo al menos."
single_combat.0031.desc.sc_attacker.POD_extinguir_vitae.fatality:0 "Lo que pronto puedo confirmar cuando una patada potenciada por la sangre me golpea en las tripas. Pronto no tengo agallas, ni tampoco inmortalidad".
single_combat.0031.desc.sc_attacker.POD_scorpions_touch.fatality:0 "Sin embargo, te falta el mismo cuidado para evitar los suyos y acabas perdiendo este combate. Al final, sólo hay oscuridad".
single_combat.0031.desc.sc_attacker.POD_theft_of_vitae.fatality:0 "Sin embargo, la mía da un salto cuando el puñetazo de mi oponente conecta con mi cara. Como protesta, mi cabeza decide desprenderse de mi cuerpo".
single_combat.0031.desc.sc_attacker.POD_baals_curse.fatality:0 "Sin embargo, no tienes el mismo cuidado a la hora de evitar los suyos y acabas perdiendo este combate. Al final, sólo queda la oscuridad".
single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood.fatality:0 "Lo que pronto puedo confirmar cuando una patada potenciada por la sangre me golpea en las tripas. Pronto no tengo agallas, ni tampoco inmortalidad".
single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion.fatality:0 "Ni siquiera se inmuta, mi enemigo saca lo mejor de mí y acabo perdiendo este combate. Al final, sólo queda la oscuridad".
single_combat.0031.desc.sc_attacker.POD_stygian_shroud.fatality:0 "Lo que pronto puedo confirmar cuando una patada potenciada por la sangre me golpea en las tripas. Pronto no tengo agallas, ni tampoco inmortalidad".
single_combat.0031.desc.sc_attacker.POD_fire_torch.fatality:0 "Mi lamentable ataque es entonces contrarrestado por un golpe magistral. No me recuperaré de este".
single_combat.0031.desc.sc_attacker.POD_fire_bombs.fatality:0 "Sin embargo, no esquivo fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se me cae la cabeza de los hombros".
single_combat.0031.desc.sc_attacker.POD_fire_spewer.fatality:0 "Sin embargo, el siguiente golpe de mi oponente es mucho más preciso. Mi cabeza si corta de mis hombros en un movimiento rápido".
single_combat.0031.desc.sc_attacker.POD_crossbow_shot.fatality:0 "Sin embargo, el siguiente golpe de mi oponente es mucho más preciso que ese. Mi cabeza si corta de mis hombros en un rápido movimiento".
single_combat.0031.desc.sc_attacker.POD_unleash_dogs.fatality:0 "Mi oponente me lanza uno de mis propios perros como represalia. Lo atrapo por reflejos, lo que parece ser un movimiento erróneo ya que mi oponente se acerca a mí para darme un golpe crítico."
single_combat.0031.desc.sc_attacker.POD_stake_attack.fatality:0 "Sin embargo, no esquivo fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se me cae la cabeza de los hombros".
single_combat.0031.desc.sc_attacker.POD_oculi_trust.fatality:0 "Rápidamente soy empujado hacia atrás por un asalto implacable. Acorralado, caigo al suelo, indefenso".
single_combat.0031.desc.sc_attacker.POD_oculi_wine.fatality:0 "Sin embargo, no esquivo fácilmente el golpe en la cara que viene a continuación. O el siguiente, hasta que se me cae la cabeza de los hombros".
