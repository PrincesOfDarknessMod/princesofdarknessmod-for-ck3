single_combat.0031.desc.sc_defender.POD_blink:0 "Demasiado rápido, estoy fuera de posición para el siguiente combate".
single_combat.0031.desc.sc_defender.POD_lightning_strike:0 "Mi golpe, aunque rápido, carece de precisión y falla."
single_combat.0031.desc.sc_defender.POD_split_second:0 "A pesar del torcido paso del tiempo, mi enemigo parece adaptarse bastante bien."
single_combat.0031.desc.sc_defender.POD_unerring_aim:0 "Una puntería perfecta... pero falta de fuerza, apenas roza su objetivo".
single_combat.0031.desc.sc_defender.POD_lethal_body:0 "La fuerza no es nada sin la precisión, ya que mis poderosos ataques fallan su objetivo."
single_combat.0031.desc.sc_defender.POD_brutal_feed:0 "Mis colmillos apenas fallan en el cuello de mi oponente, dejándome abierto para un contraataque."
single_combat.0031.desc.sc_defender.POD_earthshock:0 "Firme en sus pies, mi oponente apenas se mueve por el terremoto".
single_combat.0031.desc.sc_defender.POD_fist_of_caine:0 "El viento movido por mis ataques mejorados de Potencia son apenas una pequeña brisa para mi enemigo."
single_combat.0031.desc.sc_defender.POD_toughness:0 "A pesar de mi dureza mejorada, los poderosos golpes de mi oponente siguen doliendo como un demonio."
 single_combat.0031.desc.sc_defender.POD_extinguish_vitae:0 "La sangre de mi oponente es demasiado fuerte para los trucos de salón y sigue siendo tan efectiva como siempre."
single_combat.0031.desc.sc_defender.POD_flesh_of_marble:0 "El mármol puede romperse, como demuestran ahora mismo los golpes demoledores de mi oponente."
single_combat.0031.desc.sc_defender.POD_prowess_from_pain:0 "Incluso un vampiro masoquista tiene límites. Duele demasiado como para ser placentero y útil ahora mismo".
single_combat.0031.desc.sc_defender.POD_feral_weapons:0 "Mi enemigo esquiva hábilmente mis mortíferas garras, consciente de su peligro".
single_combat.0031.desc.sc_defender.POD_shapechange:0 "Abrumado por los instintos animales, mis ataques son brutales pero carecen de la precisión suficiente para aterrizar."
single_combat.0031.desc.sc_defender.POD_vanish:0 "Buscando las pequeñas inconsistencias de la zona, mi oponente consigue descubrirme."
 single_combat.0031.desc.sc_defender.POD_stygian_shroud:0 "Incluso con sus sentidos adormecidos por el sudario, mi oponente aún pelea lo mejor que puede."
single_combat.0031.desc.sc_defender.POD_nocturne:0 "Mi enemigo parece apenas ralentizado por las sombras, sigue luchando al máximo".
 single_combat.0031.desc.sc_defender.POD_fire_bombs:0 "El pequeño brebaje es fácilmente esquivado por mi enemigo."
single_combat.0031.desc.sc_defender.POD_arms_of_ahriman:0 "Apartándose rápidamente del camino, mi oponente consigue salir del alcance de los brazos."
single_combat.0031.desc.sc_defender.POD_the_darkness_within:0 "No se presenta ninguna abertura, mi enemigo evita las sombras arremolinadas casi a la perfección."
single_combat.0031.desc.sc_defender.POD_aegis_of_shadows:0 "Mientras la luz disipa la oscuridad, los poderosos movimientos de mi oponente destrozan mi armadura de sombras."
single_combat.0031.desc.sc_defender.POD_compel:0 "En un esfuerzo supremo de fuerza de voluntad, mi oponente hace caso omiso de mi orden."
single_combat.0031.desc.sc_defender.POD_terminal_decree:0 "En un esfuerzo supremo de fuerza de voluntad, mi oponente hace caso omiso de mi orden."
single_combat.0031.desc.sc_defender.POD_daunt:0 "Mi oponente no se amedrenta en absoluto por mi presencia mejorada, y sigue luchando al máximo."
single_combat.0031.desc.sc_defender.POD_dread_gaze:0 "Mi oponente parece disfrutar golpeando a su peor pesadilla, lo que hace que la mirada de pavor sea bastante ineficaz."
single_combat.0031.desc.sc_defender.POD_extinguir_vitae:0 "La sangre de mi oponente es demasiado fuerte para los trucos de salón, y sigue siendo tan efectiva como siempre."
single_combat.0031.desc.sc_defender.POD_scorpions_touch:0 "Un veneno mortal no sirve de nada si no puedes administrarlo, y tu oponente se cuida mucho de evitar tus próximos golpes."
single_combat.0031.desc.sc_defender.POD_theft_of_vitae:0 "La sangre de mi oponente es demasiado fuerte para los trucos de salón y se queda molesta en su cuerpo."
single_combat.0031.desc.sc_defender.POD_baals_curse:0 "Un veneno mortal es inútil si no puedes administrarlo, y tu oponente tiene mucho cuidado en evitar tus próximos golpes."
single_combat.0031.desc.sc_defender.POD_cauldron_of_blood:0 "La sangre de mi oponente es demasiado fuerte para mi efecto, su sangre se mantiene fría a pesar de mis mejores esfuerzos."
single_combat.0031.desc.sc_defender.POD_touch_of_oblivion:0 "El toque de Oblivion apenas roza a mi oponente, lo que lo hace casi inútil."
single_combat.0031.desc.sc_defender.POD_sombreo_stygiano:0 "Incluso con sus sentidos embotados por el sudario, mi oponente sigue luchando al máximo."
 single_combat.0031.desc.sc_defender.POD_bone_obedience:0 "Pero la carga implacable de mi oponente todavía duele."
single_combat.0031.desc.sc_defender.POD_fire_torch:0 "Esta vez no hay golpe de suerte, mi antorcha se esquiva sin esfuerzo".
single_combat.0031.desc.sc_defender.POD_fire_bombas:0 "El pequeño brebaje es esquivado fácilmente por mi enemigo".
single_combat.0031.desc.sc_defender.POD_fire_spewer:0 "Con una puntería tremendamente imprecisa, el fuego ni siquiera se acerca a su objetivo."
single_combat.0031.desc.sc_defender.POD_crossbow_shot:0 "El disparo se aleja mucho de su objetivo".
single_combat.0031.desc.sc_defender.POD_unleash_dogs:0 "Los animales son despachados rápidamente".
single_combat.0031.desc.sc_defender.POD_stake_attack:0 "Mi imprudente ataque es fácilmente esquivado".
single_combat.0031.desc.sc_defender.POD_oculi_trust:0 "Sin embargo, no parece que los detenga por mucho tiempo".
single_combat.0031.desc.sc_defender.POD_oculi_wine:0 "Mi temerario ataque se esquiva fácilmente".
single_combat.0031.desc.sc_defender.POD_acre_catechumen:0 "Sin embargo, no consigo aprovechar esta fuerza renovada con la suficiente rapidez."
single_combat.0031.desc.sc_defender.POD_acre_flesh:0 "...pero a mi oponente no le importa y su siguiente carga es tan fuerte como siempre."
single_combat.0031.desc.sc_defender.POD_acre_flight:0 "Sin embargo, no parece suficiente, y mi enemigo me iguala fácilmente".
single_combat.0031.desc.sc_defender.POD_acre_auto:0 "No del todo, ya que se esquiva fácilmente".
single_combat.0031.desc.sc_defender.POD_murnau_mirror:0 "Sin embargo, no es suficiente, y sigo estando en desventaja ahora mismo."
single_combat.0031.desc.sc_defender.POD_murnau_arcana:0 "Con los grandes poderes... vienen grandes riesgos de retroceso".
single_combat.0031.desc.sc_defender.POD_sisters_hosanna:0 "Sin embargo, no consigo capitalizar esta fuerza renovada con la suficiente rapidez".
single_combat.0031.desc.sc_defender.POD_sisters_oratorio:0 "Sin embargo, no parece que los detenga por mucho tiempo".
single_combat.0031.desc.sc_defender.POD_obediencia:0 "Pero la implacable carga de mi oponente sigue doliendo".
single_combat.0031.desc.sc_defender.POD_five_poison_cloud:0 "Sin embargo, se esquiva en el último segundo".
single_combat.0031.desc.sc_defender.POD_ching_shih:0 "Sin embargo, mi oponente no se deja impresionar y ataca rápidamente."
single_combat.0031.desc.sc_defender.POD_long_neck:0 "Pero no con una precisión ilimitada, ya que fallo mi siguiente ataque."
single_combat.0031.desc.sc_defender.POD_bloodlash:0 "No cuenta mucho, ya que mi oponente se aparta fácilmente."
single_combat.0031.desc.sc_defender.POD_goblin_scorch:0 "Sin embargo, se esquiva en el último segundo".
single_combat.0031.desc.sc_defender.POD_goblin_lantern:0 "Mi oponente me evita cuidadosamente durante este tiempo."
single_combat.0031.desc.sc_defender.POD_bone_dance:0 "Sin embargo, mi oponente no parece tener sueño."
single_combat.0031.desc.sc_defender.POD_dragon_dance:0 "A pesar de mis capacidades mejoradas, no consigo aprovechar la ventaja."
single_combat.0031.desc.sc_defender.POD_chi_interrupt:0 "No lo encuentro y me apartan".
single_combat.0031.desc.sc_defender.POD_thousand_hell_stare:0 "Sólo los hace más fuertes".
single_combat.0031.desc.sc_defender.POD_wind_attack:0 "Pero no lo suficiente como para ganar este duelo todavía, parece".
single_combat.0031.desc.sc_defender.POD_demon_claws:0 "Sin embargo, mi oponente no se deja impresionar y ataca rápidamente."
single_combat.0031.desc.sc_defender.POD_tormented_essence:0 "Sólo los hace más fuertes".
single_combat.0031.desc.sc_defender.POD_adramelechs_wrath:0 "Sin embargo, mi oponente no está impresionado y ataca rápidamente."
single_combat.0031.desc.sc_defender.POD_blood_atemi:0 "Mi imprudente ataque es fácilmente esquivado".
single_combat.0031.desc.sc_defender.POD_stand_upon_the_dragons_back:0 "Pero la implacable carga de mi oponente sigue doliendo."
single_combat.0031.desc.sc_defender.POD_dragon_ward:0 "Pero la implacable carga de mi oponente aún duele".
single_combat.0031.desc.sc_defender.POD_typhonic_maw:0 "Mi enemigo esquiva fácilmente la voluminosa y poco manejable Typhonic Maw."
single_combat.0031.desc.sc_defender.POD_cobra_fangs:0 "No se presenta ninguna oportunidad, el veneno de mis colmillos gotea al suelo, inofensivo."
single_combat.0031.desc.sc_defender.POD_snout_strike:0 "Sin embargo, se esquiva en el último segundo".
single_combat.0031.desc.sc_defender.POD_chi_breaker:0 "Aunque se esquiva en el último segundo".
single_combat.0031.desc.sc_defender.POD_hundred_star_shower:0 "Pero no la precisión ilimitada, ya que fallo mi siguiente ataque."
single_combat.0031.desc.sc_defender.POD_jaw_hammer:0 "Sin embargo, se esquiva en el último segundo".
single_combat.0031.desc.sc_defender.POD_fading_light_strike:0 "Sin embargo, es esquivado en el último segundo."
single_combat.0031.desc.sc_defender.POD_chain_snake:0 "Sin embargo, se esquiva en el último segundo."
single_combat.0031.desc.sc_defender.POD_twisting_thrust:0 "Aunque se esquiva en el último segundo."
single_combat.0031.desc.sc_defender.POD_prone_attacks:0 "Sin embargo, se esquiva en el último segundo."
single_combat.0031.desc.sc_defender.POD_dagger_claw:0 "Sin embargo, se esquiva en el último segundo."




#Defensor perdido, retroalimentación del movimiento final del oponente
#Ejemplo: "[sc_victor.GetFirstNameNoTooltip] trae un [sc_victor.Custom('SignatureWeaponAttemptedLight')] hacia mí con [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] por un lado, y luego cambia expertamente el impulso a una daga fuera de la mano que viene por el otro, cegando mi guardia por completo.\N"
single_combat.0031.desc.opponent_response.POD_bite:0 "Mi enemigo se lanza hacia delante, intentando hundir sus afilados colmillos en mi tentador cuello."
single_combat.0031.desc.opponent_response.POD_blood_surge:0 "Mi enemigo invoca los poderes de su sangre para darle fuerza".
single_combat.0031.desc.opponent_response.POD_blood_heal:0 "Mi enemigo invoca los poderes de su sangre para tejer sus heridas."
single_combat.0031.desc.opponent_response.POD_blink:0 "Mi enemigo corre hacia delante más rápido de lo que el ojo puede ver, esperando que no tenga medios para anticiparse."
single_combat.0031.desc.opponent_response.POD_lightning_strike:0 "Mi enemigo ataca instintivamente con el poder de la Celeridad, intentando pillarme desprevenido."
single_combat.0031.desc.opponent_response.POD_split_second:0 "El tiempo se ralentiza a nuestro alrededor cuando la Celeridad hace efecto. Mi oponente seguramente aprovechará esa oportunidad".
single_combat.0031.desc.opponent_response.POD_unerring_aim:0 "Gracias a su dominio de la Celeridad, el disparo de mi enemigo es perfectamente preciso."
single_combat.0031.desc.opponent_response.POD_lethal_body:0 "Con la fuerza de una avalancha ayudada por Potencia, mi adversario se lanza hacia mí."
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae:0 "Con un movimiento de su mano, mi enemigo inerte mi sangre."
single_combat.0031.desc.opponent_response.POD_brutal_feed:0 "Mi enemigo se lanza hacia mi cuello, esperando desangrarme en cuestión de segundos."
single_combat.0031.desc.opponent_response.POD_earthshock:0 "Golpeando la tierra, mi enemigo hace que el propio suelo tiemble bajo nosotros."
single_combat.0031.desc.opponent_response.POD_fist_of_caine:0 "Gracias a Potence, el aire movido por los movimientos de lucha de mi enemigo es un arma mortal en sí mismo."
single_combat.0031.desc.opponent_response.POD_toughness:0 "La carne de mi oponente se vuelve antinaturalmente resistente, bloqueando probablemente cualquier golpe que le llegue."
single_combat.0031.desc.opponent_response.POD_flesh_of_marble:0 "La carne de mi oponente se convierte en mármol sobrenatural, impermeable a cualquier daño."
single_combat.0031.desc.opponent_response.POD_prowess_from_pain:0 "Las heridas de mi enemigo lo alimentan, haciéndose más fuerte cada segundo".
single_combat.0031.desc.opponent_response.POD_feral_weapons:0 "Las garras de mi oponente están extendidas, listas para partirme por la mitad".
single_combat.0031.desc.opponent_response.POD_shapechange:0 "Mi enemigo utiliza su forma animal para saltar hacia mí con los colmillos por delante".
single_combat.0031.desc.opponent_response.POD_vanish:0 "Mi enemigo desaparece de la vista, tratando de confundirme".
single_combat.0031.desc.opponent_response.POD_nocturne:0 "Las sombras se arremolinan alrededor de nuestro campo de batalla, dificultando la visión."
single_combat.0031.desc.opponent_response.POD_arms_of_ahriman:0 "Tentáculos negros aparecen de la tierra e intentan golpearme".
single_combat.0031.desc.opponent_response.POD_the_darkness_within:0 "Las sombras se arremolinan a mi alrededor, buscando una apertura".
single_combat.0031.desc.opponent_response.POD_aegis_of_shadows:0 "Una armadura de sombras aparece alrededor de mi oponente, protegiéndolo del daño."
single_combat.0031.desc.opponent_response.POD_compel:0 "Mi enemigo emite una orden rápida mientras usa Dominar".
single_combat.0031.desc.opponent_response.POD_terminal_decree:0 "Mi enemigo emite una orden, ordenándome que me haga daño."
single_combat.0031.desc.opponent_response.POD_daunt:0 "Mi enemigo se muestra más grande, más poderoso, esperando probablemente disuadirme."
single_combat.0031.desc.opponent_response.POD_dread_gaze:0 "Mi enemigo aparece como mi peor pesadilla. Una visión que distrae".
single_combat.0031.desc.opponent_response.POD_extinguir_vitae:0 "Con un movimiento de su mano, mi enemigo hace que mi sangre quede inerte".
single_combat.0031.desc.opponent_response.POD_scorpions_touch:0 "Mi enemigo extrae parte de su sangre, transmutándola en veneno".
single_combat.0031.desc.opponent_response.POD_theft_of_vitae:0 "Mi enemigo hace que la sangre salga de mi boca y luego la guía hacia la suya".
single_combat.0031.desc.opponent_response.POD_baals_curse:0 "Mi enemigo extrae parte de su sangre y la transforma en un veneno extremadamente agresivo."
single_combat.0031.desc.opponent_response.POD_cauldron_of_blood:0 "Con un movimiento de su mano, mi enemigo hace que mi sangre hierva en mis propias venas."
single_combat.0031.desc.opponent_response.POD_touch_of_oblivion:0 "Mi enemigo me toca y canaliza el crudo poder entrópico de Oblivion a través de mí."
single_combat.0031.desc.opponent_response.POD_stygian_shroud:0 "Mi enemigo extiende una oscuridad asfixiante por una gran zona, silenciando el sonido y suprimiendo todos los demás sentidos."
single_combat.0031.desc.opponent_response.POD_fire_torch:0 "Mi oponente espera un golpe de suerte mientras agita a lo loco su antorcha."
single_combat.0031.desc.opponent_response.POD_fire_bombs:0 "Mi oponente lanza un poco de fuego alquímico hacia mí".
single_combat.0031.desc.opponent_response.POD_fire_spewer:0 "La extraña máquina de mi oponente escupe fuego salvajemente".
single_combat.0031.desc.opponent_response.POD_crossbow_shot:0 "El disparo de mi oponente sale disparado, buscando su objetivo."
single_combat.0031.desc.opponent_response.POD_unleash_dogs:0 "Los perros se precipitan hacia mí, hambrientos de sangre y carne."
single_combat.0031.desc.opponent_response.POD_stake_attack:0 "Mi enemigo se lanza hacia la estaca primero".
single_combat.0031.desc.opponent_response.POD_oculi_trust:0 "Las palabras de Dios se pronuncian, sintiéndome con pavor".
single_combat.0031.desc.opponent_response.POD_oculi_wine:0 "Mi enemigo arremete hacia mí, buscando el contacto para que su maldición se imponga."
single_combat.0031.desc.opponent_response.POD_acre_catechumen:0 "Las palabras de Dios son pronunciadas, sintiendo mi oponente con poder."
single_combat.0031.desc.opponent_response.POD_acre_flesh:0 "Las palabras de Dios son dichas, sintiendo a mi oponente con resistencia."
single_combat.0031.desc.opponent_response.POD_acre_flight:0 "Bendecido por la Divinidad, mi enemigo es más rápido que nunca."
single_combat.0031.desc.opponent_response.POD_acre_auto:0 "Mi oponente se prepara para lo que podría ser el golpe final".
single_combat.0031.desc.opponent_response.POD_murnau_mirror:0 "El espejo de Dios muestra a mi oponente el camino para igualar mis proezas".
single_combat.0031.desc.opponent_response.POD_murnau_arcana:0 "Mi enemigo se prepara para tomar el control de mis poderes".
single_combat.0031.desc.opponent_response.POD_sisters_hosanna:0 "Mi oponente canta la gloria de Dios, llenándolos de fuerza".
single_combat.0031.desc.opponent_response.POD_sisters_oratorio:0 "Mi oponente canta la gloria de Dios, llenándome de horror."
single_combat.0031.desc.opponent_response.POD_bone_obedience:0 "Los huesos de mi oponente empiezan a ser irrompibles".
single_combat.0031.desc.opponent_response.POD_five_poison_cloud:0 "La energía Yin negra de la nube se lanza hacia mí."
single_combat.0031.desc.opponent_response.POD_ching_shih:0 "La terrible forma de monstruo se enfrenta ahora a mí".
single_combat.0031.desc.opponent_response.POD_long_neck:0 "Mi enemigo extiende sus extremidades, dándole un alcance ilimitado."
single_combat.0031.desc.opponent_response.POD_bloodlash:0 "Se crea un zarcillo de sangre, dando a mi oponente nuevas oportunidades."
single_combat.0031.desc.opponent_response.POD_goblin_scorch:0 "Las llamas del espíritu se lanzan hacia mí".
single_combat.0031.desc.opponent_response.POD_goblin_lantern:0 "Mi oponente se convierte en un orbe resplandeciente de fuego".
single_combat.0031.desc.opponent_response.POD_bone_dance:0 "La danza se completa, creando un velo de letargo en la zona."
single_combat.0031.desc.opponent_response.POD_dragon_dance:0 "La danza se ha completado, y el trance ha comenzado."
single_combat.0031.desc.opponent_response.POD_chi_interrupt:0 "Mi enemigo se lanza a por mí, buscando mis coyunturas críticas de Chi."
single_combat.0031.desc.opponent_response.POD_thousand_hell_stare:0 "El dolor, la ira y la desesperación consumen de repente mi alma".
single_combat.0031.desc.opponent_response.POD_wind_attack:0 "El viento está en marcha, y mi oponente es más rápido que nunca."
single_combat.0031.desc.opponent_response.POD_demon_claws:0 "Mi oponente ha tomado la forma de un temible demonio".
single_combat.0031.desc.opponent_response.POD_tormented_essence:0 "El dolor, la ira y la desesperación consumen de repente mi alma".
single_combat.0031.desc.opponent_response.POD_adramelechs_wrath:0 "Mi oponente ha tomado la forma de un temible demonio."
single_combat.0031.desc.opponent_response.POD_blood_atemi:0 "Mi oponente se lanza a por mí, intentando que mi sistema circulatorio se vuelva loco".
single_combat.0031.desc.opponent_response.POD_stand_upon_the_dragons_back:0 "Mi oponente canaliza el Chi de los flujos naturales de la Tierra hacia su cuerpo."
single_combat.0031.desc.opponent_response.POD_dragon_ward:0 "Mi oponente ensancha el tercer ojo y canaliza su Chi en una poderosa guardia de protección."
single_combat.0031.desc.opponent_response.POD_typhonic_maw:0 "¡Mi oponente ensancha su mandíbula lo suficiente como para tragarme entero!"
single_combat.0031.desc.opponent_response.POD_cobra_fangs:0 "Los colmillos de mi oponente se vuelven venenosos, buscando un camino en mi carne".
single_combat.0031.desc.opponent_response.POD_snout_strike:0 "Mi oponente intenta hacer un golpe corto y vicioso, o quizás, un agarre, al hocico".
single_combat.0031.desc.opponent_response.POD_chi_breaker:0 "Mi oponente intenta clavar una mano en mi torso e interrumpe el flujo natural de Chi dentro de mi cuerpo."
single_combat.0031.desc.opponent_response.POD_hundred_star_shower:0 "Mi oponente carga el shuriken con su propia fuerza vital."
single_combat.0031.desc.opponent_response.POD_jaw_hammer:0 "Mi oponente intenta hacer un poderoso golpe diseñado para destrozar los huesos de mi mandíbula."
single_combat.0031.desc.opponent_response.POD_fading_light_strike:0 "Mi oponente intenta robarme el poder".
single_combat.0031.desc.opponent_response.POD_chain_snake:0 "Mi oponente intenta bloquear mi ataque mientras captura el miembro atacante".
single_combat.0031.desc.opponent_response.POD_twisting_thrust:0 "Mi oponente intenta cortar profundamente mi cuerpo".
single_combat.0031.desc.opponent_response.POD_prone_attacks:0 "Mi oponente cae en decúbito prono".
single_combat.0031.desc.opponent_response.POD_dagger_claw:0 "Mi oponente extiende los dedos de ambas manos y los clava en mi vientre."


#Defensor perdido, movimiento final del oponente lesión
#Ejemplo "Intento cambiar a una parada apropiada, pero es demasiado tarde, y el pomo de la daga me alcanza con fuerza en la mejilla. El agarre de mi arma se afloja, y siento cómo se desprende de mi mano, con la visión nublada por el golpe."
single_combat.0031.desc.opponent_response.POD_bite.injury:0 "Y se conecta, el aroma embriagador de la sangre impregna el aire. A duras penas me extraigo de este abrazo mortal antes de que sea demasiado tarde".
single_combat.0031.desc.opponent_response.POD_blood_surge.injury:0 "Incluso desde mi posición, puedo verlos más altos y fuertes, fortalecidos por la sangre."
single_combat.0031.desc.opponent_response.POD_blood_heal.injury:0 "Todo mi duro trabajo desaparece ante mis ojos mientras el poder de la sangre cura a mi enemigo."
