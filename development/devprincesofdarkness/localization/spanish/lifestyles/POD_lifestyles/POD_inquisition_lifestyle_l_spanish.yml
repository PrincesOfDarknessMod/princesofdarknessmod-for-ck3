l_spanish:

 beer_merchant.1.t:0 "El comerciante de cerveza"
 beer_merchant.1.desc:0 "Un mercader entra en tu despacho, te saluda adecuadamente y te explica el motivo de su visita: 'Viajando por esta tierra me quedé a dormir en un monasterio al norte de aquí. Los frailes me sirvieron la cerveza más deliciosa que he probado nunca. Siendo la cerveza mi oficio, pregunté por la posibilidad de comprar una parte de sus cuantiosas y crecientes existencias para venderlas a mis clientes. Me dijeron que aceptara esta oferta "más arriba". Mi investigación sobre quién está "más arriba" me ha llevado a usted, Su Excelencia. ¿Podemos hacer un trato?".
 beer_merchant.a:0 "¿Más delicioso, dices? Mejor lo vendemos nosotros".
 beer_merchant.a.success.ctt:0 "Intentarás construir tu propia red de distribución para la cerveza".
 beer_merchant.a.success.tt:0 "Esto complementará nuestros ingresos".
 beer_merchant.a.failure.ctt:0 "Tu aventura en el mundo de los negocios sólo te traerá humillaciones".
 beer_merchant.a.failure.tt:0 "Perderás prestigio".
 beer_merchant.b:0 "Una causa más sagrada que la cerveza necesita un hombre con sentidos agudos y un talento con el dinero".
 beer_merchant.b.success.ctt:0 "Reclutarás al mercader como tu agente".
 beer_merchant.b.success.tt:0 "Un hábil mayordomo se unirá a tu corte".
 beer_merchant.b.failure.ctt:0 "El mercader no verá el beneficio de unirse a ti".
 beer_merchant.b.failure.tt:0 "Continuará sus viajes".
 beer_merchant.c:0 "No necesitamos al comerciante, sólo su lista de clientes".
 beer_merchant.c.success.ctt:0 "Emborracharás al mercader y harás que revele sus contactos".
 beer_merchant.c.success.tt:0 "Beneficio fácil".
 beer_merchant.c.failure.ctt:0 "El comerciante no se dejará cortar".
 beer_merchant.c.failure.tt:0 "Sus métodos indecorosos quedarán al descubierto".
 beer_merchant.d:0 "Siempre nos vendrá bien una donación".
 beer_merchant.a.success.t:0 "La gente no tiene suficiente".
 beer_merchant.a.success.desc:0 "Los instintos del comerciante eran correctos; la cerveza es salvajemente popular entre los consumidores, y su red de distribución apenas puede satisfacer la demanda."
 beer_merchant.a.success:0 "¡A la salud!"
 beer_merchant.a.failure.t:0 "No se encuentran compradores".
 beer_merchant.a.failure.desc:0 "La fe y la convicción por sí solas no hacen que uno sea competente en marketing; no consigues llamar la atención sobre tu producto."
 beer_merchant.a.failure:0 "¿Cerveza, alguien?"
 beer_merchant.b.success.t:0 "Una nueva vocación".
 beer_merchant.b.success.desc:0 "La conversación con el comerciante revela que, a pesar de considerarse un hombre afortunado, siempre anhela formar parte de algo más grande, más significativo que acumular riqueza. Animado por esta confesión a levantar el velo del secreto, le presentas la causa que le ha estado llamando."
 beer_merchant.b.success:0 "Como una vez has distribuido cerveza, ahora distribuirás esperanza".
 beer_merchant.b.failure.t:0 "Seguir con el oficio de la cerveza".
 beer_merchant.b.failure.desc:0 "Tus torpes intentos de convencer al mercader de la vacuidad de sus afanes terrenales junto con tu incapacidad para ofrecer una alternativa lo suficientemente tentadora han hecho que se excuse de tu despacho sintiéndose perplejo y ofendido."
 beer_merchant.b.failure:0 "Ninguna cantidad de dinero comprará la salvación de este tonto".
 beer_merchant.c.success.t:0 "Directo a los compradores".
 beer_merchant.c.success.desc:0 "Su fingida preocupación por los establecimientos en los que se va a servir la cerveza de los frailes, unida a los constantes rellenos de la copa del comerciante, convierten su seguridad en chulería. Antes de vaciar la botella, enumera sus clientes como si fuera un recital. Su plan ha funcionado a las mil maravillas, y el hecho de que su secretaria, escondida detrás de la puerta, tome notas cuidadosamente es lo más importante de su velada."
 beer_merchant.c.success:0 "¿Qué es lo que querías, otra vez?"
 beer_merchant.c.failure.t:0 "El comerciante se da cuenta de tus artimañas".
 beer_merchant.c.failure.desc:0 "Mientras propones otro trago, el mercader te mira repentinamente con desconfianza y te recuerda la virtud de la templanza."
 beer_merchant.c.failure:0 "Oh, bueno, guarda tus secretos".
 beer_merchant.d.t:0 "Se hace un trato".
 beer_merchant.d.desc:0 "Tienes tareas más importantes por delante que vender cerveza, y el dinero por adelantado es tu tipo de acuerdo favorito."
 beer_merchant.d:0 "Un placer hacer negocios con usted".
 heretic_event.1.t:0 "Hereje que socava la nobleza"
 heretic_event.1.desc:0 "Un noble local se acerca a ti con un asunto que considera que exige tu atención. Un predicador carismático se ha instalado en su explotación y ha empezado a azuzar a los siervos contra su señor citando la Sagrada Biblia como supuesta condena de cualquier promesa y juramento de lealtad. Cree que esta doctrina subversiva está socavando el mandato de su poder y quiere que te encargues de este molesto revolucionario."
 heretic_event.1.a:0 "Tratar con herejes no es precisamente nuestra jurisdicción".
 heretic_event.1.b:0 "¿Dice conocer las Escrituras? Vamos a ver eso".
 heretic_event.1.c:0 "¿Quieres que lo quemen? Claro, podemos quemarlo".
 heretic_event.1.a.success.ctt:0 "Deslumbrarás a los nobles con nebulosas descripciones de tu posición superior en la jerarquía eclesiástica".
 heretic_event.1.a.success.tt:0 "Ganarás prestigio".
 heretic_event.1.a.failure.ctt:0 "El noble concluirá que eres un perezoso malversador de fondos de la iglesia".
 heretic_event.1.a.failure.tt:0 "Perderás prestigio".
 heretic_event.2.t:0 "Un debate teológico"
 heretic_event.2.desc:0 "El predicador cree que sus afirmaciones están respaldadas por la Santa Biblia, pero la alfabetización por sí sola no le otorga a uno el conocimiento necesario para interpretar las Escrituras en doctrina. Pondremos a prueba estos conocimientos suyos entablando un debate teológico sobre sus ideas. La cuestión es lo que pretendemos conseguir".
 heretic_event.2.a:0 "Hacer que se incrimine acorralándolo en una admisión de herejía".
 heretic_event.2.a.success.ctt:0 "El predicador se expondrá como hereje".
 heretic_event.2.a.success.tt:0 "Castigará al hereje y ganará en piedad"
 heretic_event.2.a.failure.ctt:0 "El predicador defenderá sus tesis sin hablar contra la doctrina eclesiástica establecida."
 heretic_event.2.a.failure.tt:0 "Habrá que tomar una decisión".
 heretic_event.2.b:0 "Hazle ver las trampas de una educación insuficiente."
 heretic_event.2.b.success.ctt:0 "Impresionarás al predicador con tus conocimientos teológicos superiores."
 heretic_evento.2.b:0 "Hazle ver las trampas de una educación insuficiente".
 heretic_event.2.b.éxito.ctt:0 "Impresionarás al predicador con tus superiores conocimientos teológicos".
 heretic_event.2.b.success.tt:0 "El predicador se unirá a tu corte".
 heretic_event.2.b.failure.ctt:0 "No conseguirás que el predicador vea el error de sus actos".
 heretic_event.2.b.failure.tt:0 "El predicador saldrá libre y tú perderás prestigio".
 heretic_event.211.t:0 "El hereje se encuentra con la pira"
 heretic_event.211.desc:0 "Utilizar las Sagradas Escrituras para provocar problemas no es un esfuerzo que valga la pena"
 heretic_event.212.t:0 "El predicador evita incriminarse a sí mismo".
 heretic_event.212.desc:0 "Escogiendo sus palabras con cuidado y construyendo sus argumentos sobre supuestos universalmente aceptados, el predicador consigue exponer sus argumentos sin aventurarse en el territorio de la herejía."
 heretic_event.212.a:0 "Los elocuentes son de la peor calaña, quemadlo".
 heretic_event.212.a.tt:0 "Ejecutarás al predicador sin una justificación formal".
 heretic_event.212.b:0 "Supongo que tendremos que dejarlo ir".
 heretic_event.212.b.tt:0 "El predicador saldrá libre".
 heretic_event.2121.t:0 "Culpable hasta que se demuestre su inocencia".
 heretic_event.2121.desc:0 "El predicador puede ser un orador hábil y cuidadoso, pero sigue siendo un hereje. Sabe lo pecaminosas que son las implicaciones que se esconden tras sus nebulosas alusiones. Puede que no esté dispuesto a admitir su culpabilidad, pero sus molestas payasadas son suficientes para sentenciarlo a muerte. Mientras dicta la sentencia, algo le molesta, la situación le recuerda algo, pero no puede concretarlo."
 heretic_event.2121.a:0 "Lo que he escrito, lo he escrito".
 heretic_event.2122.t:0 "El predicador sale libre".
 heretic_event.2122.desc:0 "Sin pruebas de herejía, no hay hereje que condenar".
 heretic_event.221.t:0 "El predicador se une a tu causa".
 heretic_event.221.desc:0 "Impresionado por tu conocimiento y piedad, el predicador decide continuar la educación a tu lado." 
 heretic_event.222.t:0 "El predicador se marcha triunfante".
 heretic_event.222.desc:0 "Has perdido el control de la discusión y una razón para mantener cautivo al predicador con ella". 
 heretic_event.11.t:0 "El noble está impresionado"
 heretic_event.11.desc:0 "El noble está más impresionado que molesto con tu sugerencia indirecta de que eres demasiado importante para ayudarle"
 heretic_event.12.t:0 "El noble está decepcionado"
 heretic_event.12.desc:0 "Tu negativa a ayudar disminuyó tu posición ante la nobleza local"
 heretic_event.3.t:0 "El hereje se encuentra con la pira"
 heretic_event.3.desc:0 "Puede que nunca sepamos con certeza si cumplía los criterios formales para ser llamado hereje, pero seguro que arde como uno".
 defeated_general.1.t:0 "El general derrotado"
 defeated_general.a.success.ctt:0 "Reforzará el espíritu del general convenciéndolo de que se comprometa plenamente con su causa."
 defeated_general.1.desc:0 "Uno de los empleados de su oficina se acerca a usted con un asunto muy delicado. Es el confesor de un general que fue prominente y célebre, pero que ahora ha caído en desgracia. Desde que una campaña que se le encargó dirigir resultó desastrosa, le persigue la tentación de un grave pecado, el de quitarse la vida. El secretario se siente impotente para evitarlo y se dirige a ti, esperando que hagas lo posible por devolver la esperanza a este hombre derrotado. Ambos visitan su residencia. El criado te hace pasar al despacho del comandante, donde lo ves desplomado en un sillón. Tras unas breves e incómodas presentaciones, el general te dice: 'No puedo vivir así, con esta sombra de la gloria perdida aplastándome'".
 defeated_general.1.a:0 "¡Mi buen hombre, los días de verdadera gloria aún están por delante!"
 defeated_general.a.éxito.ctt:0 "Revigorizarás el espíritu del general convenciéndolo de que se comprometa plenamente con tu causa".
 defeated_general.a.success.tt:0 "El general se une a ti libre de la desesperación".
 defeated_general.a.meh.ctt:0 "El general dará una oportunidad a trabajar para ti, pero su espíritu seguirá roto."
 defeated_general.a.meh.tt:0 "El general se une a ti como un hombre roto".
 defeated_general.a.failure.ctt:0 "Nada convence al general de que unirse a tu causa mejorará las cosas".
 defeated_general.a.failure.tt:0 "El general se quitará la vida".
 defeated_general.1.b:0 "Háblame de esa campaña".
 defeated_general.b.success.ctt:0 "Entablarás con el general una conversación sobre asuntos militares que le permita airear su dolor".
 defeated_general.b.success.tt:0 "Ganarás un mentor en asuntos de guerra".
 defeated_general.b.failure.ctt:0 "El general se desanimará a abrirse por tu falta de entendimiento".
 defeated_general.b.failure.tt:0 "El general no encontrará consuelo en tu compañía".
 defeated_general.1.c:0 "Podemos asegurarle un entierro cristiano a cambio de una donación".
 defeated_general.1.c.tt:0 "Facilitarás el suicidio del general para obtener un beneficio económico".
 defeated_general.111.t:0 "Un nuevo propósito"
 defeated_general.111.desc:0 "'Enemigos más temibles que los sarracenos... Una guerra secreta librada durante milenios... Una misión del propio Santo Padre... Sí, sí, puedo ver cómo eso haría que mis errores profesionales pasados fueran relativamente insignificantes. ¡Su Excelencia, tiene mi lealtad!"
 defeated_general.111.a:0 "¡In hoc signo vinces!"
 defeated_general.112.t:0 "Servicio reticente"
 defeated_general.112.desc:0 "'No sé nada de ese asunto del "santo propósito", pero si necesitas un comandante, supongo que comandar soldados es mejor que pudrirse aquí'".
 defeated_general.112.a:0 "Supongo que también".
 defeated_general.113.t:0 "Cuando la esperanza se desvanece"
 defeated_general.113.desc:0 "'¿Volver al servicio? ¿Para que mueran más hombres buenos por mi culpa? ¡Nunca! Sal de mi casa, ¡ahora!"
 defeated_general.113.a:0 "¿He oído caer un taburete?"
 defeated_general.21.t:0 "Aprender de los errores del pasado"
 defeated_general.21.desc:0 "El general comienza su relato pero vacila cuando llega a la parte problemática de su historia. La oportunidad de tener a alguien deseoso de oírle y de escuchar con atención le convence de continuar. Usted asegura al general que nadie podría condenar sus decisiones dada la información que tenía en ese momento. Escuchar eso de alguien con aparentes amplios conocimientos en materia militar es un tremendo alivio para el torturado hombre. Cuando termina el relato, pasáis horas más discutiendo sobre estrategia militar. Cuando finalmente os marcháis, el sirviente susurra: "Gracias, no le he visto sonreír desde la guerra".
 defeated_general.21.a:0 "¡Hagamos de esto algo habitual!"
 defeated_general.22.t:0 "La difícil situación del soldado incomprendido"
 defeated_general.22.desc:0 "El general comienza a contar su historia pero rápidamente concluye que cualquier intento de explicar su tragedia es una pérdida de tiempo. La mirada perpleja que habita en su rostro mientras hace preguntas que delatan su falta de conocimientos militares delata sus buenas intenciones. 'Digamos que... las cosas se volvieron terribles. Tal vez me explaye en otro momento. Les ruego que me perdonen, mis honorables invitados, pero estoy completamente agotado por el momento'".
 defeated_general.22.a:0 "Quizás debería haber venido mejor preparado".
 donors_daughter.1.t:0 "La hija del donante"
 donors_daughter.1.desc:0 "Una abadía que alberga tu base de operaciones regional recibe la visita de una joven noble. Se presenta como la hija de un amigo de la causa recientemente fallecido, pero desconoce por qué su padre os proporcionó fondos y sus hermanos le encargaron que lo investigara. Leyendo entre las líneas de su presentación queda claro que el donante no preparó un testamento por escrito y que la decisión de sus hijos de cumplir con su última voluntad de dedicar una parte de su herencia a su causa dependerá de la impresión que esta chica tenga de usted.\n\n¿Me mostrará Su Excelencia los alrededores? Quiero ver todo lo que hace aquí". - pregunta ella."
 donors_daughter.1.a:0 "Con gusto, mi señora, pero verá, las alas están en renovación..."
 donors_daughter.1.a.success.tt:0 "Convencerás a la chica de que se salte las secciones sensibles."
 donors_daughter.1.a.failure.tt:0 "La chica verá a través de tus excusas."
 donors_daughter.1.a.success.ctt:0 "La visita tendrá un resultado más favorable."
 donors_daughter.1.a.failure.ctt:0 "La visita tendrá un resultado menos favorable."
 donors_daughter.1.b:0 "Umm... claro."
 donors_daughter.1.c:0 "Recibimos a los visitantes en la sala principal, todo lo demás está prohibido."
 donors_daughter.2.t:0 "La hija del donante: talentoso personal"
 donors_daughter.2.desc:0 "Mientras camináis por la sala principal, la joven noble se fija en los escribas monjes que manejan vuestros documentos.\nOh, una vez oí cantar a un coro de monjes en el funeral de mi tía, ¡era tan bonito! Por favor, haz que canten para mí". - suplica ella."
 donors_daughter.2.a:0 "Créeme, niña, estos monjes son unos cantantes terribles."
 donors_daughter.2.a.success.tt:0 "La chica quedará encantada con tu preocupación por sus orejas."
 donors_daughter.2.a.failure.tt:0 "La chica considerará que sus deseos no son respetados."
 donors_daughter.2.a.success.ctt:0 "La visita tendrá un resultado más favorable."
 donors_daughter.2.a.failure.ctt:0 "La visita tendrá un resultado menos favorable."
 donors_daughter.2.b:0 "Ya has oído a la señora."
 donors_daughter.2.c:0 "Su tarea aquí no es entretener a los invitados."
 donors_daughter.3.t:0 "La hija del donante: Una prenda tentadora"
 donors_daughter.31.desc:0 "Al llegar a su despacho, la mirada de la visitante se dirige hacia el gorro de Santa Wiborada, una reliquia sagrada que guardas y exhibes con orgullo en un soporte muy decorado. Qué prenda tan peculiar, nunca he visto una de este estilo. Debe ser muy antigua. Quiero probármelo", exclama mientras los empleados de la oficina se dirigen a ti con expresiones de preocupación."
 donors_daughter.32.desc:0 "Cuando llega a la cámara de tu despacho, la mirada del visitante se dirige hacia el velo de Santa Belina, una reliquia sagrada que usted exhibe con orgullo. 'Qué prenda tan peculiar, nunca he visto una de este estilo. Debe ser muy antigua. Quiero probármelo", exclama mientras los oficinistas se vuelven con expresiones de preocupación."
 donors_daughter.33.desc:0 "Al llegar a tu despacho, la mirada del visitante se dirige hacia el manto de Santa Ludmila, una reliquia sagrada que exhibe con orgullo en un soporte especial. Qué prenda tan peculiar, nunca he visto una de este estilo. Debe ser muy antigua. Quiero probármelo", exclama mientras los empleados de la oficina se dirigen a ti con expresiones de preocupación."
 donors_daughter.3.a:0 "Mi señora, esa cosa está terriblemente polvorienta."
 donors_daughter.3.a.success.tt:0 "La niña lo considerará una excusa."
 donors_daughter.3.a.failure.tt:0 "La niña reevaluará el atractivo de la prenda."
 donors_daughter.3.a.success.ctt:0 "La visita tendrá un resultado más favorable."
 donors_daughter.3.a.failure.ctt:0 "La visita tendrá un resultado menos favorable."
 donors_daughter.3.b:0 "Avanzar."
 donors_daughter.3.c:0 "Olvídalo, señorita."
 donors_daughter.4.t:0 "La hija del donante: tiempo de decisión"
 donors_daughter.4.desc:0 "Después de que finalmente lograste aburrir a la jovencita al enumerar todas las iniciativas caritativas que el dinero de su padre ayudó a financiar, tanto las que realmente se están llevando a cabo como las que sirven como cobertura para otras operaciones, decidió que había visto y escuchado lo suficiente. Sabrás el alcance de su generosidad antes de que se vaya."
 donors_daughter.4.a:0 "Parece que le encanta este lugar."
 donors_daughter.4.b:0 "Esperemos que haya disfrutado de su estancia."
 donors_daughter.4.c:0 "Esperemos que haya disfrutado de su estancia."
 donors_daughter.4.d:0 "Probablemente sea mejor que se vaya."
 donors_daughter.4.e:0 "No podría importarme menos si el mocoso se divirtiera."
 donors_daughter.5.t:0 "La hija del donante: Encantada más allá de las expectativas"
 donors_daughter.5.desc:0 "'Su Excelencia es el siervo de Cristo más magnánimo que he conocido. Todavía no estoy del todo seguro de lo que está haciendo aquí, pero sea lo que sea, con usted al frente se merece cada pieza de plata que mi familia ha reservado, pero también una donación personal de mi parte.'"
 donors_daughter.5.a:0 "Ha sido un placer, mi señora."
 donors_daughter.6.t:0 "La hija del donante: Hospitalidad adecuada"
 donors_daughter.6.desc:0 "'Su Excelencia es tan piadosa como su causa y sería impío por mi parte irme de aquí sin donar toda la suma de la que fui autorizado a desprenderme. Mi padre siempre administró bien nuestro dinero y veo que esto no es una excepción. Que Dios te acompañe"."
 donors_daughter.6.a:0 "Adiós entonces."
 donors_daughter.7.t:0 "La hija del donante: La falta de hospitalidad"
 donors_daughter.7.desc:0 "Creo que he visto suficiente. No puedo decir que entienda la devoción de mi padre por apoyar sus esfuerzos, pero si al separarme de esta suma estoy seguro de que su último deseo se cumplió, que así sea. Adiós, Su Excelencia"."
 donors_daughter.7.a:0 "Apenas valía la pena el tiempo."
 donors_daughter.8.t:0 "La hija del donante: Malas impresiones"
 donors_daughter.8.desc:0 "'La hospitalidad de su Excelencia deja mucho que desear. Nunca conocí a mi padre que se asociara con individuos tan desagradables y sea cual sea su negocio con usted, no es algo que deseemos que continúe en esta familia. Hasta la vista"."
 donors_daughter.8.a:0 "Probablemente debería contratar a alguien para este tipo de cosas."
 donors_daughter.9.t:0 "La hija del donante: cambio de paradigma"
 donors_daughter.9.desc:0 "Su Excelencia ha despreciado todas mis peticiones y no ha hecho ningún esfuerzo por complacerme como corresponde a una mujer de la nobleza, siento que debería dar media vuelta y dejarla sin nada, pero al mismo tiempo estoy asombrada por su dignidad y concentración. Toda mi vida he sido mimada y he estado rodeada de aduladores que me han pedido las migajas de mi patrimonio familiar, pero tú eres diferente. Está claro que tu vocación dirige tus ojos por encima de esta mezquindad y, sea lo que sea, quiero formar parte de ella. Quedarme aquí nunca formó parte del acuerdo que hice con mis hermanos y me temo que no podría representar a la hacienda si tomara esa decisión, pero le ruego, Su Excelencia, que me libere de esta existencia sin sentido y derrochadora y me permita servirle"."
 donors_daughter.9.a:0 "Tienes mucho que aprender, hija mía."
 donors_daughter.9.a.t:0 "La joven noble se une a su corte."
 donors_daughter.9.a.desc:0 "[ddaughter.GetShortUIName] está listo para servir a la causa."
 donors_daughter.9.b:0 "Una búsqueda encomiable, pero no tenemos vacantes."
 defeated_general.3.t:0 "Un festín de buitres"
 defeated_general.3.desc:0 "El general parece brevemente sorprendido tras darse cuenta de lo que le propones. Rápidamente, el alivio y la determinación superan la expresión sombría de su rostro. Bien, te incluiré en mi testamento. Tengo que decir que no esperaba que ese fuera el resultado de esta reunión. Pero supongo que siempre he sido un tonto. Adiós".
 defeated_general.3.a:0 "Pecunia non olet, como se dice".
