 setting_black_death_default:0 "Muerte negra predeterminada"
 setting_black_death_default_desc:0 "La Peste Negra ocurrirá durante el siglo XIV, devastando y retrasando el desarrollo del mundo."
 setting_black_death_disabled:0 "Muerte negra discapacitada"
 setting_black_death_disabled_desc:0 "La Peste Negra no sucederá"
