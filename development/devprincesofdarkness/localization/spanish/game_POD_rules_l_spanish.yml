 rule_NPC_vampire_ruler_lifestyle_learning:0 "Los ancianos aprenden trucos nuevos"
 setting_NPC_vampire_rulers_do_not_learn_lifestyle_perks:0 "Los ancianos no aprenden trucos nuevos".
 setting_NPC_vampire_rulers_do_not_learn_lifestyle_perks_desc:0 "Los gobernantes vampiros que no son personajes del jugador NO aprenden perks de estilo de vida."
 setting_NPC_vampire_rulers_learn_lifestyle_perks:0 "Los ancianos aprenden nuevos trucos".
 setting_NPC_vampire_rulers_learn_lifestyle_perks_desc:0 "Los gobernantes vampiros que no son personajes del jugador sí aprenden perks de estilo de vida tras el inicio de la partida."

 rule_age_of_inquisition_difficulty:0 "Dificultad de la inquisición"
 setting_age_of_inquisition_difficulty_easy:0 "Inquisición fácil"
 setting_age_of_inquisition_difficulty_easy_desc:0 "Los inquisidores del final del juego apenas harán mella en los reinos vampíricos."
 setting_age_of_inquisition_difficulty_default:0 "Inquisición por defecto"
 setting_age_of_inquisition_difficulty_default_desc:0 "Los inquisidores del final del juego sacudirán el mundo de los vampiros, pero serán expulsados lentamente después."
 setting_age_of_inquisition_difficulty_hard:0 "Inquisición apocalíptica"
 setting_age_of_inquisition_difficulty_hard_desc:0 "Es probable que los Inquisidores del final acaben con la "civilización" vampírica."

 rule_web_of_knives_difficulty:0 "Telaraña de cuchillos Mortalidad"
 setting_web_of_knives_difficulty_default:0 "Telaraña de cuchillos por defecto"
 setting_web_of_knives_difficulty_default_desc:0 "Los asesinos Banu Haqim de la Red de cuchillos serán letales en sus bastiones regionales, pero su alcance no se extenderá tan bien en otras áreas."
 setting_web_of_knives_difficulty_hard:0 "Telaraña mortal de cuchillos"
 setting_web_of_knives_difficulty_hard_desc:0 "Los asesinos Banu Haqim de Web of Knives ahora pueden alcanzar su objetivo en cualquier parte del mundo, lo que significa que es solo cuestión de tiempo antes de que cumplan su sangrienta misión."
 #regla_ojos_del_abismo:0 "Los ojos del abismo"
 #setting_lasombra_tiene_ojos_normales:0 "Ojos normales"
 #setting_lasombra_have_normal_eyes_desc:0 "Los Lasombra tienen ojos normales, aunque tengan 'Vista del olvido'"
 #setting_lasombra_have_black_eyes:0 "Ojos del abismo"
 #setting_lasombra_have_black_eyes_desc:0 "Los Lasombra con "Vista del Olvido" tienen los ojos negros."

 rule_banu_haqim_darken:0 "Maldición de Banu Haqim"
 setting_banu_haqim_default_darken:0 "Se oscurece con la edad"
 setting_banu_haqim_default_darken_desc:0 "La piel de los Banu Haqim, los asamitas, se oscurece hasta convertirse en obsidiana a medida que envejecen."
 setting_banu_haqim_never_darken:0 "Nunca se oscurece"
 setting_banu_haqim_never_darken_desc:0 "Los Banu Haqim no tendrán un efecto visual de obsidiana al envejecer."

 rule_world_of_darkness:0 "Mundo de la oscuridad"
 setting_world_of_monsters:0 "Mundo de Tinieblas"
 setting_world_of_monsters_desc:0 "La mayoría de los personajes aterrizados son criaturas sobrenaturales o aquellos que las cazan."
 setting_world_of_minions_and_monsters:0 "Mundo de la sombra"
 setting_world_of_minions_and_monsters_desc:0 "La mayoría de los personajes aterrizados son criaturas sobrenaturales o aquellos que las sirven o las cazan."
 setting_world_of_minions:0 "Mundo de la Corrupción"
 setting_world_of_minions_desc:0 "La mayoría de los personajes aterrizados son servidores de criaturas sobrenaturales o aquellos que las cazan."
 setting_world_of_mortals_player_knows:0 "Mundo de los secretos"
 setting_world_of_mortals_player_knows_desc:0 "El mundo ignora los horrores que acechan la noche, pero el personaje del jugador lo sabe todo..."
 setting_world_of_mortals:0 "El mundo de la ignorancia"
 setting_world_of_mortals_desc:0 "La mayoría de los personajes de la tierra ignoran lo sobrenatural, incluso el personaje del jugador."
 
 rule_splats:0 "Dominio de lo sobrenatural"
 setting_vampires:0 "Vampiro: la Mascarada"
 setting_vampires_desc:0 "Los Kindred ostentan la mayoría de los títulos de tierra".
 setting_hunters:0 "Inquisidor de la Edad Oscura"
 setting_hunters_desc:0 "La mayoría de los personajes con título de tierra son cazadores o monstruos sobrenaturales."
 setting_werewolves:0 "Hombre lobo: el Apocalipsis"
 setting_werewolves_desc:0 "Los Garou tienen la mayoría de los títulos de tierra".
 setting_mages:0 "Mago: la Ascensión"
 setting_mages_desc:0 "La mayoría de los poseedores de títulos de tierra son magos despiertos."
 setting_fae:0 "Changeling: el Sueño"
 setting_fae_desc:0 "La mayoría de los poseedores de títulos terrestres son Fae".
 setting_wraiths:0 "Espectro: el Olvido"
 setting_wraith_desc:0 "El juego tendrá lugar en las Tierras Sombrías, donde la mayoría de los poseedores de títulos terrestres son Espectros."
 setting_demons:0 "Demonio: el Caído"
 setting_demons_desc:0 "La mayoría de los poseedores de títulos terrestres son demonios".
 setting_vampires_vs_werewolves:0 "Colmillo y Garra"
 setting_vampires_vs_werewolves_desc:0 "La mayoría de los personajes con título aterrizado son Kindreds o Garous."
 setting_vampires_vs_mages:0 "Guerra de Massasa"
 setting_vampires_vs_mages_desc: "La mayoría de los personajes con título de tierra son Kindred o Magos."
 setting_mortals:0 "Mortal: el inocente"
 setting_mortals_desc:0 "La mayoría de los personajes de títulos aterrizados son mortales que desconocen el Mundo de las Tinieblas"
 setting_all_splats:0 "Mundo de las Tinieblas"
 setting_all_splats_desc:0 "Todas las criaturas sobrenaturales disponibles serán incluidas en el mundo."
 
 rule_wod_rule_set:0 "Conjunto de reglas de WoD"
 setting_wod_rule_set_dav20:0 "20 ANIV"
 setting_wod_rule_set_dav20_desc:0 "Edición del 20º aniversario de Vampiro de la Edad Oscura. Esto puede afectar a las disicplinas, a los baneos del clan, a los símbolos de los rasgos, etc..."
 setting_wod_rule_set_v5:0 "V. 5"
 setting_wod_rule_set_v5_desc:0 "Vampiro:la Mascarada, Quinta Edición. Esto puede afectar a las disciplinas, baneos de clan, símbolos de rasgos, etc..."
 
 

