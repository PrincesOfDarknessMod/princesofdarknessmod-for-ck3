l_spanish:
 building_type_blood_tax_01:0 "Impuesto de sangre"
 building_type_blood_tax_01_desc:1 "#F Te aseguras de que tus mortales trabajen, literalmente, hasta su último aliento."
 building_blood_tax_01:0 "Impuesto de sangre bajo"
 building_blood_tax_01_desc:1 "Estás gravando abiertamente a los mortales aquí. Sin embargo, no es el plan más económico para la prosperidad del condado."
 building_blood_tax_02:0 "Impuesto sobre la sangre en serio"
 building_blood_tax_02_desc:1 "Los mortales están siendo desangrados por su dinero bajo tu gobierno. Eso es cuando tienen suerte".
 building_blood_tax_03:0 "Impuesto de sangre opresivo"
 building_blood_tax_03_desc:1 "Tus arcas se están reponiendo rápidamente. De todos modos, ¿a quién le importa que estés gobernando un páramo estéril?"
 building_type_open_rule_01:0 "Regla abierta"
 building_type_open_rule_01_desc:1 "#F Los mortales indefensos no son buenos sin tu firme liderazgo. Extrañamente, no todos parecen estar de acuerdo con esta verdad tan obvia."
 building_open_rule_01:0 "Regla firme"
 building_open_rule_01_desc:1 "Eres el señor de toda esta tierra, Vampiro o no. Eres temido, pero los susurros de rebelión crecen".
 building_open_rule_02:0 "Gobierno opresivo"
 building_open_rule_02_desc:1 "Una ejecución cada noche mantiene a los mortales a raya. Al menos, cuando creen que se les puede oír..."
 building_open_rule_03:0 "Regla tiránica"
 building_open_rule_03_desc:1 "Los mortales son ganado y son tratados como tal en tu reino del miedo y la desesperación. Sin embargo, tratarán de liberarse en cualquier oportunidad que se les presente".
 building_type_forced_conscription_01:0 "Conscripción forzada"
 building_type_forced_conscription_01_desc:1 "#F Le das a todos en tu reino el honor de servir en tus ejércitos. Lamentablemente, esto tiende a sobrecargar la capacidad de tus súbditos para gobernar realmente el condado.
 building_forced_conscription_01:0 "Pequeño esfuerzo de reclutamiento"
 building_forced_conscription_01_desc:1 "Un par de tus agentes están por ahí, convenciendo a la gente de que morir por ti es realmente algo bueno."
 building_forced_conscription_02:0 "Esfuerzo de reclutamiento serio"
 building_forced_conscription_02_desc:1 "Los centros de reclutamiento están apareciendo por todas partes en tu reino, y la no asistencia no es una opción."
 building_forced_conscription_03:0 "Esfuerzo de reclutamiento masivo"
 building_forced_conscription_03_desc:1 "Sirven y mueren después, o no lo hacen y mueren ahora".
 building_type_night_terror_01:0 "Cazador nocturno"
 building_type_night_terror_01_desc:1 "#F Merodeando por la noche con tu manada es tu verdadera naturaleza, no puedes parar el impulso de salir a cazar alguna presa indefensa."
 building_night_terror_01:0 "Miedo nocturno"
 building_night_terror_01_desc:1 "La gente desaparece cuando cedes a tus impulsos. Tu control sobre el condado disminuye, pero tu manada se fortalece".
 building_night_terror_02:0 "Terror nocturno"
 building_night_terror_02_desc:1 "Apenas eres capaz de volver a tus cabales y gobernar tu reino entre las vigorosas cacerías que diriges."
 building_night_terror_03:0 "Terror nocturno"
 building_night_terror_03_desc:1 "Tu manada es la única verdad. Todos los demás son presas que hay que cazar".
 building_type_influence_noble_01:0 "Influir en los nobles"
 building_type_influence_noble_01_desc:1 "#F Mediante una mezcla de influencia, chantaje y seducción, puedes vigilar a la clase dirigente mortal de este condado. Haciendo esto mantendrás a los otros mortales a raya y harás que el oro siga fluyendo.
 building_influence_noble_01:0 "Sutil influencia noble"
 building_influence_noble_01_desc:1 "En este nivel de influencia, has empezado a perturbar la cohesión de la clase dirigente, reduciendo su conciencia marcial. \N - Este nivel requiere más de 25 de control para construir y permanecer habilitado."
 building_influence_noble_02:0 "Influencia noble significativa"
 building_influence_noble_02_desc:1 "Tu control sobre ellos crece, y las cosas empiezan a volver a la normalidad desde una perspectiva externa. \N - Este nivel requiere más de 50 de control para construir y permanecer habilitado."
 building_influence_noble_03:0 "Fuerte influencia noble"
 building_influence_noble_03_desc:1 "Puede que la clase dirigente no lo sepa, pero ahora son tuyos. Y nadie sospecha nada. \N - Este nivel requiere más de 75 de control para construir y permanecer habilitado."
 building_influence_noble_04:0 "Influencia noble absoluta"
 building_influence_noble_04_desc:1 "Todo el mundo sabe quién hace verdaderamente las reglas aquí. \N - Este nivel requiere más de 75 de control para construir y permanecer habilitado."
 
 building_type_influence_nightwatch_01:0 "Influir en la guardia nocturna"
 building_type_influence_nightwatch_01_desc:1 "#F La guarnición local podría ser un activo bienvenido para ayudar al entrenamiento y, bueno, a la alimentación de tu séquito personal. Sin embargo, tendrás que mover algunos hilos para conseguirlo.
 building_influence_nightwatch_01:0 "Influencia sutil de la guardia nocturna"
 building_influence_nightwatch_01_desc:1 "En las narices de la mayoría de los funcionarios, y sobornando al resto, tu guardia personal ha empezado a trabajar con la milicia local. \N - Este nivel requiere más de 25 de control para construir y permanecer habilitado."
 building_influence_nightwatch_02:0 "Influencia significativa de la guardia nocturna"
 building_influence_nightwatch_02_desc:1 "Tus hombres son ahora una valiosa "compañía mercenaria" que protege la ciudad con la ayuda de los lugareños. Una situación en la que todos ganan. Para ti, al menos. \N - Este nivel requiere más de 50 de control para construir y permanecer habilitado."
 building_influence_nightwatch_03:0 "Fuerte influencia de la vigilancia nocturna"
 building_influence_nightwatch_03_desc:1 "Ya casi no puedes diferenciar a los hombres locales de los tuyos. Todos te sirven de una forma u otra.  \N - Este nivel requiere más de 75 de control para construir y permanecer habilitado."
 building_influence_nightwatch_04:0 "Influencia absoluta de la vigilancia nocturna"
 building_influence_nightwatch_04_desc:1 "¿La guardia nocturna? Informan directamente a mi gente. \N - Este nivel requiere más de 75 de control para construir y permanecer habilitado."
 
 building_type_influence_outriders_01:0 "Influir en los Outriders"
 building_type_influence_outriders_01_desc:1 "#F Los guardabosques, exploradores, vigilantes y mensajeros que recorren las afueras del condado pueden ser activos valiosos por un precio."
 building_influence_outriders_01:0 "Influencia sutil de los outriders"
 building_influence_outriders_01_desc:1 "Con algo de dinero en los bolsillos adecuados, la lealtad de un puñado de outriders te mantendrá, con suerte, al tanto de los acontecimientos en los límites de tu dominio."
 building_influence_outriders_02:0 "Influencia significativa de los outriders"
 building_influence_outriders_02_desc:1 "Decenas de outriders han caído bajo tu dominio, informando de los acontecimientos de la tierra a ti primero y a su señor en segundo lugar."
 building_influence_outriders_03:0 "Fuerte influencia de los outriders"
 building_influence_outriders_03_desc:1 "La mayoría, si no todos, de los guardianes y guardabosques del dominio te informan antes que nada, por muy poca paga."
 building_influence_outriders_04:0 "Influencia absoluta de los outriders"
 building_influence_outriders_04_desc:1 "Hasta los temidos lupinos estarían celosos de tu conocimiento de las tierras salvajes a estas alturas."
 
 building_type_influence_underworld_01:0 "Influir en el mundo subterráneo"
 building_type_influence_underworld_01_desc:1 "#F Podrías extraer mucho de los forajidos de esta zona, ya sea dinero o reclutas experimentados para tu guardia de élite. Aunque, agitar a la mafia criminal tiene sus inconvenientes".
 building_influence_underworld_01:0 "Influencia sutil del hampa"
 building_influence_underworld_01_desc:1 "Ayudar a los criminales ha empezado a ser rentable para ti. Pero también ha enfadado a la población local. \N - Este nivel requiere más de 25 de control para construir y permanecer habilitado."
 building_influence_underworld_02:0 "Influencia significativa en el inframundo"
 building_influence_underworld_02_desc:1 "Con tus manos de guía, tu banda de malhechores está haciendo menos ruido y más beneficios. \N - Este nivel requiere más de 50 de control para construir y mantenerse habilitado."
 building_influence_underworld_03:0 "Fuerte influencia del hampa"
 building_influence_underworld_03_desc:1 "Has frenado al máximo los peores instintos de tus compinches. Son casi tan disciplinados como una fuerza de combate regular. \N - Este nivel requiere más de 75 de control para construir y permanecer habilitado."
 building_influence_underworld_04:0 "Influencia absoluta del inframundo"
 building_influence_underworld_04_desc:1 "Los señores criminales acuden en masa a besar tu, metafórico, anillo. \N - Este nivel requiere más de 75 de control para construir y permanecer habilitado."
 building_type_influence_merchant_01:0 "Influir en los mercaderes"
 building_type_influence_merchant_01_desc:1 "#F Los comerciantes son ricos y tú necesitas oro. La ecuación es sencilla, pero no cederán fácilmente."
 building_influence_merchant_01:0 "Influencia sutil del mercader"
 building_influence_merchant_01_desc:1 "Se resisten, refunfuñan y provocan problemas. Pero algunos han empezado a pagar su impuesto completamente legítimo. \N - Este nivel requiere más de 25 de control para construir y permanecer habilitado."
 building_influence_merchant_02:0 "Influencia significativa del comerciante"
 building_influence_merchant_02_desc:1 "La mayoría de los comerciantes han sido acobardados, y la disidencia se ha reducido a susurros en los callejones. \N - Este nivel requiere más de 50 de control para construir y permanecer habilitado."
 building_influence_merchant_03:0 "Fuerte influencia mercantil"
 building_influence_merchant_03_desc:1 "Ahora puedes reunir a los gremios y mostrar tu plan para aumentar los impuestos y seguir siendo recibido con un atronador aplauso. \N - Este nivel requiere más de 75 de control para construir y permanecer habilitado."
 building_influence_merchant_04:0 "Influencia mercantil absoluta"
 building_influence_merchant_04_desc:1 "¡El dinero debe fluir! En tus bolsillos. \N - Este nivel requiere más de 75 de control para construir y permanecer habilitado."
 building_type_prince_city_00:0 "Princedom"
 building_type_prince_city_00_desc:1 "#F Los vampiros son habitantes de la ciudad. Cuanto más grande es la ciudad, más temido y prestigioso es un Vampiro.
 building_prince_city_00:0 "Príncipe de una ciudad"
 building_prince_city_00_desc:1 "Controlas la capital regional de un remanso "encantador". No es mucho, pero es mejor que nada".
 building_prince_city_005:0 "Príncipe de una gran ciudad"
 building_prince_city_005_desc:1 "Controlas la capital regional de un pueblo apestoso. Los lugareños saben que eres importante por tu clara falta de suciedad. \N - Este nivel requiere más de 5 de desarrollo para construir y permanecer habilitado." 
 building_prince_city_01:0 "Príncipe de una ciudad"
 building_prince_city_01_desc:1 "Estás controlando la totalidad de una pequeña ciudad o una parte más pequeña de una más grande. Es un comienzo. \N - Este nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado."
 building_prince_city_02:0 "Príncipe de una ciudad regional"
 building_prince_city_02_desc:1 "Tu corte es respetada y admirada ya que gobiernas a muchos mortales. \N - Este nivel requiere más de 20 de desarrollo para construir y permanecer habilitado."
 building_prince_city_025:0 "Príncipe de una gran ciudad regional"
 building_prince_city_025_desc:1 "Una importante ciudad bajo tu control, muchos mortales están voluntariamente bajo tu esclavitud aquí. \n Este nivel requiere más de 30 de desarrollo para construir y permanecer habilitado." 
 building_prince_city_03:0 "Príncipe de una ciudad capital"
 building_prince_city_03_desc:1 "Mortales, reyes y señores de la guerra habitan en esta impresionante ciudad. Tú eres su contraparte nocturna. \N - Este nivel requiere más de 40 de desarrollo para construir y permanecer habilitado."
 building_prince_city_04:0 "Príncipe de una metrópolis"
 building_prince_city_04_desc:1 "Una de las mayores ciudades del mundo vive a tu sombra. Tu influencia conoce pocos límites con ella en tus dominios. \N - Este nivel requiere más de 60 de desarrollo para construir y permanecer habilitado."
 building_type_temple_set_01:0 "Templo de Set"
 building_type_temple_set_01_desc:1 "#F Los placeres más allá de tus sueños más salvajes te esperan aquí. Si estás dispuesto a pagar el precio".
 building_temple_set_01:0 "Respetable templo de Set"
 building_temple_set_01_desc:1 "El culto a Set tiene un innegable atractivo, lo que hace que vender tu alma a los setitas sea una perspectiva mucho más tentadora de lo que tiene derecho a ser..."
 building_temple_set_02:0 "Gran templo de Set"
 building_temple_set_02_desc:1 "El culto a Set tiene un innegable atractivo, lo que hace que vender tu alma al Setite sea una perspectiva mucho más tentadora de lo que tiene derecho a ser..."
 building_temple_set_03:0 "Gran Templo de Set"
 building_temple_set_03_desc:1 "El culto a Set tiene un innegable atractivo, lo que hace que vender tu alma al Setite sea una perspectiva mucho más tentadora de lo que tiene derecho a ser..."
 
 building_type_devasthana_01:0 "Controlando la Devasthana"
 building_type_devasthana_01_desc:1 "#F La India está inmersa en una guerra santa milenaria para detener la asuratizayya. Para ganarla, necesitará fe y una convicción inquebrantable. #F"
 building_devasthana_01:0 "Devasthana respetable"
 building_devasthana_01_desc:1 "Aquí encuentras la fuerza para seguir adelante, bajo la protección de los Devas."
 building_devasthana_02:0 "Gran Devasthana"
 building_devasthana_02_desc:1 "Aquí encuentras la fuerza para seguir adelante, bajo la protección de los Devas."
 building_devasthana_03:0 "Gran Devasthana"
 building_devasthana_03_desc:1 "Aquí encuentras la fuerza para seguir adelante, bajo la protección de los Devas."
 
 building_type_brahmavihara_01:0 "Mentores del Brahmavihara"
 building_type_brahmavihara_01_desc:1 "#F Tu condición, aunque es sólo una parte de un viaje más largo, hace más difícil seguir las enseñanzas de Buda. Te vendría bien algo de ayuda".
 building_brahmavihara_01:0 "Respetable Upekkha"
 building_brahmavihara_01_desc:1 "Mantenerse neutral en todas las circunstancias es una prueba adecuada. Es el camino hacia la paz mental y el Nirvana".
 building_brahmavihara_02:0 "Gran Upekkha"
 building_brahmavihara_02_desc:1 "Permanecer neutral en todas las circunstancias es una prueba adecuada. Es el camino hacia la paz mental y el Nirvana".
 building_brahmavihara_03:0 "Gran Upekkha"
 building_brahmavihara_03_desc:1 "Permanecer neutral en todas las circunstancias es una prueba adecuada. Es el camino hacia la paz mental y el Nirvana".
 
 building_type_low_war_01:0 "Guerra baja"
 building_type_low_war_01_desc:1 "#F Cada instante es un campo de batalla, ya sea política o física. Un Guerrero de Jade siempre está preparado. #F"
 building_low_war_01:0 "Guerra baja interminable"
 building_low_war_01_desc:1 "Siempre estás luchando, y el respiro es un recuerdo muy lejano. Pero tus enemigos también suelen estarlo".
 building_type_chantry_01:0 "Cancillería"
 building_type_chantry_01_desc:1 "#F Una congregación de magos no muertos, los Tremere practican aquí sus artes secretas de magia de sangre."
 building_chantry_01:0 "Cancillería respetable"
 building_chantry_01_desc:1 "Los Tremere de la zona residen aquí, obligados por sus juramentos a la Pirámide y a sus ancianos."
 building_chantry_02:0 "Gran Despacho"
 building_chantry_02_desc:1 "Aquí residen los Tremeres de la zona, obligados por sus juramentos a la Pirámide y a sus mayores."
 building_chantry_03:0 "Gran Despacho"
 building_chantry_03_desc:1 "Los Tremeres de la zona local residen aquí, obligados por sus juramentos a la Pirámide y a sus mayores."
 
 building_type_pillars_of_the_ashirra_01:0 "Pilares de la Ashirra"
 building_type_pillars_of_the_ashirra_01_desc:1 "#F La secta Ashirra aspira a ser una comunidad unificada, pero en realidad es una diversidad de enclaves cainitas unidos por creencias comunes."
 building_pillars_of_the_ashirra_01:0 "El segundo abrazo"
 building_pillars_of_the_ashirra_01_desc:1 "El fundamento de la fe de los Ashirra se basa en dos principios: que la redención es posible para cualquier ser que acepte el Islam y respete sus leyes, y que la inmortalidad no excluye a un cainita del juicio de Alá."
 building_pillars_of_the_ashirra_02:0 "Tariq el-Bedouin"
 building_pillars_of_the_ashirra_02_desc:1 "Un cainita musulmán sigue el Tariq el-Bedouin porque cree que la indolencia y los lujos seductores de los palacios y las ciudades debilitan la autodisciplina y el valor moral del individuo."
 building_pillars_of_the_ashirra_03:0 "Tariq el-Umma"
 building_pillars_of_the_ashirra_03_desc:1 "Los seguidores del Tariq el-Umma son dados a reafirmar sus naturalezas básicas mediante actos de bondad y compasión. A menudo buscan proteger y ayudar a sus vecinos mortales en secreto, e interceden para corregir las injusticias o ver que los culpables sean castigados."
 
 building_type_underworld_portal_01:0 "Portal al Inframundo"
 building_type_underworld_portal_01_desc:1 "#F Al ser uno de los pocos Vampiros con conocimiento del Inframundo, puedes utilizar su prepotente presencia en tu beneficio."
 building_underworld_portal_01:0 "Brecha hacia el Inframundo"
 building_underworld_portal_01_desc:1 "Los fantasmas son cosas hambrientas. Alrededor de ti, tienden a estar específicamente hambrientos del espíritu de tus enemigos."
 building_type_pairidaeza_01:0 "Pairidaeza"
 building_type_pairidaeza_01_desc:1 "#Restos de la mayor época de la Persia zoroástrica, estos jardines son un oasis para los vampiros que se aferran a una fe desaparecida."
 building_pairidaeza_01:0 "Respetable Pairidaeza"
 building_pairidaeza_01_desc:1 "Un lugar para descansar y recordar la edad de oro perdida hace tiempo. El ojo de una tormenta interna".
 building_type_unending_party_01:0 "Fiesta interminable"
 building_type_unending_party_01_desc:1 "#F La única forma de sentirse vivo es llevar todo al extremo. Todo el tiempo".
 building_unending_party_01:0 "Fiesta del año"
 building_unending_party_01_desc:1 "Algunos invitados no quieren dejar nunca su fiesta. La mayoría no puede, de todos modos".
 building_unending_party_02:0 "Fiesta de la década"
 building_unending_party_02_desc:1 "Algunos invitados no quieren dejar nunca tu fiesta. La mayoría no puede, de todos modos".
 building_unending_party_03:0 "La fiesta del siglo"
 building_unending_party_03_desc:1 "Algunos invitados no quieren dejar nunca tu fiesta. La mayoría no puede, de todos modos".s
 
 building_type_fallen_church_01:0 "Iglesia de los caídos"
 building_type_fallen_church_01_desc:1 "#F Tu alma está perdida desde hace tiempo. Así que, aquí, te aseguras de salvar el alma de todos los demás. Les guste o no.#"
 building_fallen_church_01:0 "Santuario de los caídos"
 building_fallen_church_01_desc:1 "Tantos gritos se han escuchado aquí, tantas súplicas de piedad. Y, al final, tan poca redención".
 building_fallen_church_02:0 "Templo de los caídos"
 building_fallen_church_02_desc:1 "Tantos gritos se han escuchado aquí, tantas súplicas de misericordia. Y, al final, tan poca redención".
 building_fallen_church_03:0 "Catedral de los caídos"
 building_fallen_church_03_desc:1 "Tantos gritos se han escuchado aquí, tantas súplicas de misericordia. Y, al final, tan poca redención".
 
 building_type_laboratory_01:0 "Laboratorio"
 building_type_laboratory_01_desc:1 "#F Muchas cosas entran aquí. Pocas salen. Algunas incluso llegan a formar parte del conjunto. #F"
 building_laboratory_01:0 "Respetable laboratorio de fabricación de carne"
 building_laboratory_01_desc:1 "Un espacio adecuado, aunque sencillo, para esculpir la carne y el hueso tanto de los que quieren como de los que no quieren."
 building_laboratory_02:0 "Gran laboratorio de carnicería"
 building_laboratory_02_desc:1 "Un laboratorio de escultura de carne bien surtido es la envidia de cualquier metamorfoseador."
 building_laboratory_03:0 "Gran laboratorio de fabricación de carne"
 building_laboratory_03_desc:1 "En una obra de arte, siempre hay un atisbo del artista. A veces, también algo de los "amigos" del creador".
 building_type_mother_garden_01:0 "Jardín de Lilith"
 building_type_mother_garden_01_desc:1 "#F El verdadero Edén sólo se encuentra en la adoración de la primera mujer, la traicionada por Adán, Caine y el propio Dios."
 building_mother_garden_01:0 "Jardín de la Doncella"
 building_mother_garden_01_desc:1 "Como la Doncella, Lilith seduce a los demás para que encuentren la verdad oculta tras los velos de la realidad."
 building_mother_garden_02:0 "Jardín de la Madre"
 building_mother_garden_02_desc:1 "Como la Doncella, Lilith atrae a otros a encontrar la verdad oculta tras los velos de la realidad."
 building_mother_garden_03:0 "Jardín de la Arpía"
 building_mother_garden_03_desc:1 "Como la Doncella, Lilith atrae a otros a encontrar la verdad oculta tras los velos de la realidad."
 
 building_type_legacies_gathering_01:0 "Reunión de los legados"
 building_type_legacies_gathering_01_desc:1 "#F La mayoría de las veces, los laibones prefieren hablar las cosas antes de actuar precipitadamente. Ser el anfitrión de una reunión de este tipo es una tarea prestigiosa. #F"
 building_legacies_gathering_01:0 "Gran reunión"
 building_legacies_gathering_01_desc:1 "Un respetable número de representantes dinásticos está reunido aquí, debatiendo sobre el futuro de la región y más allá."
 building_type_lordly_manor_01:0 "Mansión señorial"
 building_type_lordly_manor_01_desc:1 "#F Una impresionante mansión digna de un señor de la tierra."
 building_lordly_manor_01:0 "Mansión respetable"
 building_lordly_manor_01_desc:1 "Donde se toman decisiones, se traman intrigas y se dictan sentencias. Con suerte, por ti".
 building_type_lordly_manor_02_desc:1 "#F Una impresionante mansión digna de un señor de la tierra."
 building_lordly_manor_02:0 "Gran mansión"
 building_lordly_manor_02_desc:1 "Donde se toman decisiones, se traman intrigas y se dictan sentencias. Con suerte, por ti".
 building_lordly_manor_03:0 "Gran mansión"
 building_lordly_manor_03_desc:1 "Donde se toman decisiones, se traman intrigas y se dictan sentencias. Con suerte, por ti".
 building_type_influence_people_01:0 "Influir en el pueblo"
 building_type_influence_people_01_desc:1 "De lo mejor a lo peor, la humanidad lo es todo. Como tal, puedes entrelazarte con cada capa de la sociedad y aprender de ella. #F"
 building_influence_people_01:0 "Sutil influencia popular"
 building_influence_people_01_desc:1 "Cada noche, aprendes algo más al compartir tu vida con los humanos. Te recuerda cómo no convertirte en un monstruo".
 building_influence_people_02:0 "Fuerte influencia popular"
 building_influence_people_02_desc:1 "Cada noche, aprendes algo más compartiendo tu vida con los humanos. Te recuerda cómo no convertirte en un monstruo".
 building_influence_people_03:0 "Influencia popular absoluta"
 building_influence_people_03_desc:1 "Cada noche, aprendes algo más compartiendo tu vida con los humanos. Te recuerda cómo no convertirte en un monstruo".
 building_type_influence_clergy_01:0 "Influir en el clero"
 building_type_influence_clergy_01_desc:1 "#F Los clérigos son los pastores de la humanidad, y controlar a los pastores significa controlar a las ovejas."
 building_influence_clergy_01:0 "Influencia sutil del clero"
 building_influence_clergy_01_desc:1 "Tener a los predicadores locales en el bolsillo puede ser de lo más útil"
 building_influence_clergy_02:0 "Fuerte influencia del clero"
 building_influence_clergy_02_desc:1 "Las "donaciones" sustanciales a las autoridades religiosas locales te aseguran una buena posición en la comunidad."
 building_influence_clergy_03:0 "Influencia absoluta del clero"
 building_influence_clergy_03_desc:1 "Se aprende mucho de los hombres santos, y mucho más de los malvados. Sólo hay que asegurarse de entender la diferencia a veces3".
 
 building_type_crypt_01:0 "Cripta"
 building_type_crypt_01_desc:1 "#F Tu trabajo requiere un lugar adecuado y suministros. Y, preferiblemente, también un lugar muy tranquilo y apartado donde los vecinos no se quejen. #F"
 building_crypt_01:0 "Cripta respetable"
 building_crypt_01_desc:1 "Solo en la oscuridad, rodeado de cadáveres y abominaciones putrefactas. La definición de paraíso".
 building_crypt_02:0 "Cripta grande"
 building_crypt_02_desc:1 "Solo en la oscuridad, rodeado de cadáveres y abominaciones putrefactas. La definición de paraíso".
 building_crypt_03:0 "Gran Cripta"
 building_crypt_03_desc:1 "Solo en la oscuridad, rodeado de cadáveres y abominaciones putrefactas. La definición de paraíso".
 building_type_assassins_cell_01:0 "Celda de los asesinos"
 building_type_assassins_cell_01_desc:1 "#F Los Hijos de Haqim cuentan con una amplia red de agentes, informantes y otras herramientas útiles en todas las partes del mundo."
 building_assassins_cell_01:0 "Célula pequeña"
 building_assassins_cell_01_desc:1 "La gran presencia haqimita en esta zona te permite contar con un respaldo muy útil para tus objetivos más... turbios."
 building_assassins_cell_02:0 "Gran celda"
 building_assassins_cell_02_desc:1 "La gran presencia haqimita en esta zona te permite tener algunos refuerzos muy útiles para tus objetivos más... solapados."
  building_assassins_cell_03:0 "Gran célula"
 building_assassins_cell_03_desc:1 "La gran presencia haqimita en esta zona te permite tener algunos refuerzos muy útiles para tus objetivos más... solapados."
 
 building_type_alamut_01:0 "Alamut"
 building_type_alamut_01_desc:1 "#F La temida fortaleza oculta del clan asamita es un baluarte de fe, fuerza y mentiras."
 building_alamut_01:0 "Alamut dividido"
 building_alamut_01_desc:1 "Al igual que el clan Assamite, Alamut se encuentra dividido entre las castas. Se necesitará una inversión considerable para reparar este cisma".
 building_alamut_02:0 "Alamut curado"
 building_alamut_02_desc:1 "Aunque todavía hay palabras fuertes y puñales por la espalda que se oyen y se ven, los peores estallidos de violencia han sido condenados al ostracismo de estos muros sagrados."
 building_alamut_03:0 "Alamut, Nido de Águilas"
 building_alamut_03_desc:1 "Al menos aquí, el clan asamita muestra su perfecta cohesión y devoción a un propósito singular, lo que lo convierte en una fuerza temible a la que enfrentarse."
 building_type_rome_01:0 "Roma"
 building_type_rome_01_desc:1 "#F Roma era tanto el centro del mundo cainita como del humano. Restaurarla a la grandeza de los no muertos sería un gran logro. #F"
 building_rome_01:0 "Roma mortal"
 building_rome_01_desc:1 "Los hombres santos merodean por las calles, disputando cualquier intento de control directo sobre el centro del mundo europeo. A estas alturas, Roma es un título de prestigio para su dueño, nada más".
 building_rome_02:0 "Roma dividida"
 building_rome_02_desc:1 "Poco a poco, la fe de Roma se erosiona, y los Vampiros pueden volver a utilizar su sutil influencia en beneficio del príncipe."
 building_rome_03:0 "Roma eterna"
 building_rome_03_desc:1 "Finalmente, Roma vuelve a estar en manos vampíricas. Los hombres santos se encogen en la oscuridad mientras los hijos de Caine cantan las alabanzas del gran gobernante que ha conquistado la ciudad santa."
 building_type_ceoris_01:0 "Ceoris"
 building_type_ceoris_01_desc:1 "#F La poderosa fortaleza de los Tremere es tanto una fortaleza como un centro de aprendizaje. Es la mejor baza del asediado clan de los Magus".
 building_ceoris_01:0 "Ceoris dividido"
 building_ceoris_01_desc:1 "Algunos Tremere siguen siendo mortales en la capilla. Sospechan del juego sucio de los Vampiros intrigantes y son un obstáculo constante para los planes del Consejo."
 building_ceoris_02:0 "Ceoris controlado"
 building_ceoris_02_desc:1 "A medida que sus homólogos mortales desaparecen o se convierten, los miembros de la Casa de los Tremere pueden finalmente utilizar Ceoris en todo su potencial."
 building_ceoris_03:0 "Ceoris Impregnable"
 building_ceoris_03_desc:1 "Mientras esta poderosa fortaleza se mantenga en pie, el clan Tremere no puede caer. Es decir, al menos desde fuera..."
 building_type_carthage_01:0 "Cartago"
 building_type_carthage_01_desc:1 "#F El sueño del clan Brujah hace tiempo que murió, enterrado por los vengativos Ventrue. Pero, ¿pueden los sueños morir de verdad?"
 building_carthage_01:0 "Reconstrucción de Cartago"
 building_carthage_01_desc:1 "Una fuerte declaración al mundo, la reconstrucción de la ciudad de Troile será un asunto costoso. Pero las recompensas, y los peligros, podrían ser ambos grandes".
 building_carthage_02:0 "Nueva Cartago"
 building_carthage_02_desc:1 "La peor pesadilla de los cainitas romanos vuelve a la vida bajo tu fuerte liderazgo. No volverá a caer".
 building_carthage_03:0 "Cartago, sueño de la Brujah"
 building_carthage_03_desc:1 "Un faro de iluminación y una visión de cooperación entre mortales y cainitas vuelve a ser visible aquí."
 building_type_ombos_temple_01:0 "Templo fundacional de Ombos"
 building_type_ombos_temple_01_desc:1 "#F El extravagante corazón del clan setita, Ombos es también supuestamente el último lugar de descanso de Set."
 building_ombos_temple_01:0 "Ombos, la sombra de Set"
 building_ombos_temple_01_desc:1 "En los últimos tiempos, Ombos ha sido visto como una reliquia de una época pasada por los setitas más jóvenes, su legitimidad es cuestionada."
 building_ombos_temple_02:0 "Recuperación de Ombos"
 building_ombos_temple_02_desc:1 "Las reformas y reconstrucciones han devuelto al templo a la vanguardia de la época actual."
 building_ombos_temple_03:0 "Ombos que se eleva"
 building_ombos_temple_03_desc:1 "Centro indiscutible de toda una religión, Ombos es cuna de pensamientos, cultos y planes. Como siempre lo ha sido".
 building_type_erciyes_01:0 "Erciyes"
 building_type_erciyes_01_desc:1 "#F La fortaleza montañosa del clan Cappadocian fue arrebatada a los Malkavian durante la Edad Clásica. Desde entonces, ha sido un centro de aprendizaje y meditación.
 building_erciyes_01:0 "Erciyes aislado"
 building_erciyes_01_desc:1 "Alejada de... todo en realidad, Erciyes es un lugar perfecto para la contemplación. Aunque lamentablemente tiende a hacer que sus huéspedes pasen por alto las amenazas del exterior."
 building_erciyes_02:0 "Abierto Erciyes"
 building_erciyes_02_desc:1 "A medida que las mentalidades cambian y el mundo exterior puede abrirse paso en la fortaleza, el Erciyes se convierte en un centro mundano de aprendizaje."
 building_erciyes_03:0 "Erciyes, monasterio de las sombras"
 building_erciyes_03_desc:1 "Ahora, tanto un respiro como el centro de todo un clan, la fortaleza de la montaña ve una actividad continua, pero controlada, dentro de sus muros."
 building_type_cathedral_of_flesh_01:0 "Catedral de la carne"
 building_type_cathedral_of_flesh_01_desc:1 "#F Esta abominación absoluta fue esculpida a lo largo de un milenio a partir de la carne de campesinos, esclavos, rivales, bestias y cualquier otro número de víctimas que fueron incorporadas a las pulsantes y supurantes paredes."
 building_cathedral_of_flesh_01:0 "Catedral hostil"
 building_cathedral_of_flesh_01_desc:1 "Manchada por la propia tierra, la Catedral es tan enemiga de cualquier intruso como de su propio dueño. Y perder la batalla significa convertirse en parte de ella".
  building_cathedral_of_flesh_02:0 "Catedral hirviente"
 building_cathedral_of_flesh_02_desc:1 "La influencia de Kupala retrocede un poco, ya que la monstruosa creación empieza a obedecer a su dueño."
 building_cathedral_of_flesh_03:0 "Catedral acobardada"
 building_cathedral_of_flesh_03_desc:1 "Kupala parece haber desaparecido, por ahora. La Catedral se ha convertido en el instrumento de pavor absoluto que cualquier koldunista loco soñaría con blandir."
 building_type_castel_del_ombro_01:0 "Castel d'Ombro"
 building_type_castel_del_ombro_01_desc:1 "#F Es imposible saber desde la distancia de qué están hechas las paredes porque las sombras animadas se arrastran por cada superficie en un flujo y reflujo apenas visible. Las mareas de sombra surgen de las profundidades después de la puesta de sol cada noche y envuelven el castillo en un patrón generalmente espiral, invirtiéndose después de la medianoche para escurrirse gradualmente.#"
 building_castel_del_ombro_01:0 "Tumba de las sombras"
 building_castel_del_ombro_01_desc:1 "Lugar de descanso del propio Antediluviano, el castillo es un lugar espantoso, un recordatorio del aire de lo antinatural que rodea a cada Lasombra."
 building_castel_del_ombro_02:0 "Castillo de las sombras"
 building_castel_del_ombro_02_desc:1 "Centro de la corte de la sangre, el castillo sirve como instrumento judicial para los ancianos del clan."
 building_castel_del_ombro_03:0 "Castillo abierto"
 building_castel_del_ombro_03_desc:1 "La apertura de las puertas significa que el propio Lasombra se ha ido del castillo. Durante este tiempo, el aire de locura que lo rodea se desvanece un poco, para dejar que el lugar sirva como centro político del clan."
 #NOT_ITS_DEVELOPMENT_LEVEL_TRIGGER:1 "This area needs more development! Look at the description."
 building_type_rabble_thugs_01:0 "Rabble and Thugs"
 building_type_rabble_thugs_01_desc:1 "#F A veces, debes olvidar tu orgullo y tratar con mortales desagradables para conseguir rápidamente algunos refuerzos muy necesarios."
 building_rabble_thugs_01:0 "Reclutando a los oprimidos"
 building_rabble_thugs_01_desc:1 "A muchas personas no las echará de menos nadie. Son el tipo de personas que puedes utilizar para crear apresuradamente una fuerza de combate."
 building_rabble_thugs_02:0 "Reclutamiento de la chusma"
 building_rabble_thugs_02_desc:1 "La chusma callejera es de poca utilidad en los campos de batalla de las noches. Pero a veces, no se puede ser exigente. \N - Este nivel requiere más de 5 de desarrollo para construir y permanecer habilitado."
 building_rabble_thugs_03:0 "Reclutando a los forajidos"
 building_rabble_thugs_03_desc:1 "Numerosos y con al menos un mínimo de experiencia en la lucha, los forajidos son un buen forraje. \N Este nivel requiere más de 15 de desarrollo para construir y permanecer habilitado."
 building_rabble_thugs_04:0 "Reclutando a los delincuentes"
 building_rabble_thugs_04_desc:1 "Nadie los echará de menos, ni siquiera tú. \N - Este nivel requiere más de 20 de desarrollo para construir y permanecer habilitado."
 building_type_sherwood_01:0 "Bosque de Sherwood"
 building_type_sherwood_01_desc:1 "#F Es aquí donde nació el movimiento de los Furores, que prosperaría durante siglos. Un respiro ganado a pulso de los tiranos de la noche. #F"
 building_sherwood_01:0 "Sherwood controlado"
 building_sherwood_01_desc:1 "Robin Leeland arrancó Sherwood de las narices de Mitra y lo mantuvo durante siglos. Este audaz logro contra un tirano tan antiguo inspira a los Furores a reunirse y luchar con más fuerza por la causa."
 building_sherwood_02:0 "Ampliación de Sherwood"
 building_sherwood_02_desc:1 "Los hombres y mujeres libres de Sherwood se lanzan a la lucha fuera del bosque, haciendo que Robin se sienta orgulloso de sus pupilos."
 building_sherwood_03:0 "El Sherwood triunfante"
 building_sherwood_03_desc:1 "A lo largo y ancho, los tiranos tiemblan ante la mera mención de los valientes defensores de Sherwood, asesinos de déspotas y guerreros de la libertad."
 building_type_vigiles_francia_01:0 "Vigiles Francia"
 building_type_vigiles_francia_01_desc:1 "#F Creados por Salianna como un cuerpo especial de élite, los Vigiles son un grupo de dedicados caballeros, tanto cainitas como necrófagos, que recorren la tierra en busca de su señor."
 building_vigiles_francia_01:0 "Vigiles Francia : Pasivo"
 building_vigiles_francia_01_desc:1 "Los Vigiles Francia, un cuerpo de élite de Caballeros Toreador y Ghouls, están preparados para responder a cualquier amenaza a los gobernantes franceses de la noche."
 building_vigiles_francia_02:0 "Vigiles Francia : Proactivos"
 building_vigiles_francia_02_desc:1 "Los Vigiles se han encargado de cazar a cualquier potencial alborotador antes incluso de que llegue, mejorando su control de la tierra."
 building_vigiles_francia_03:0 "Vigiles Francia : Omnipresentes"
 building_vigiles_francia_03_desc:1 "Una fuerza cada vez mayor que idealiza el código caballeresco, los Vigiles son ahora el principal recurso de cualquier aspirante a emperador cainita francés."
 building_type_inquisition_fortress_01:0 "Fortaleza de la Inquisición"
 building_type_inquisition_fortress_01_desc:1 "#F Desde aquí, hombres y mujeres de gran valor se enfrentan a la oscuridad."
 building_inquisition_fortress_01:0 "Fuerte de la Inquisición"
 building_inquisition_fortress_01_desc:1 "Puede que su número sea pequeño, que sus defensas sean insignificantes, pero su corazón verá los santuarios de la luz."
 building_inquisition_fortress_02:0 "Bastión de la Inquisición"
 building_inquisition_fortress_02_desc:1 "Aquí, una pequeña parte del mundo ha sido reconquistada por las fuerzas del bien."
 building_inquisition_fortress_03:0 "Bastión de la Inquisición"
 building_inquisition_fortress_03_desc:1 "Contemplad esta indomable fortaleza de la luz, secuaces del infierno, y desesperad."
 building_type_shrine_of_telyavel_01:0 "Santuario de Telyavel"
 building_type_shrine_of_telyavel_01_desc:1 "#F El dios herrero no está interesado en los asuntos de los mortales, ni de los inmortales. A no ser que se pague el debido precio...#"
 building_shrine_of_telyavel_01:0 "Santuario simbólico de Telyavel"
 building_shrine_of_telyavel_01_desc:1 "Sin la bendición del Dios, este santuario sigue siendo un poderoso grito de guerra para un mundo pagano moribundo."
 building_shrine_of_telyavel_02:0 "Santuario despierto de Telyvael"
 building_shrine_of_telyavel_02_desc:1 "El Dios herrero observa a sus fieles, intrigado por su renovado compromiso con su causa."
 building_shrine_of_telyavel_03:0 "Arboleda de las sombras"
 building_shrine_of_telyavel_03_desc:1 "Ahora un enlace directo con el propio reino del Dios, muchos campeones vienen aquí para ganarse su bendición divina."
 building_type_giovanni_mausoleum_01:0 "Giovanni Mausoleum"
 building_type_giovanni_mausoleum_01_desc:1 "#F Muchas personas entran aquí. Muy pocos salen. #"
 building_giovanni_mausoleum_01:0 "Pequeño mausoleo de Giovanni"
 building_giovanni_mausoleum_01_desc:1 "La familia Giovanni sigue siendo joven hasta la noche, y todavía está muy centrada en sus estudios sobre la muerte y el alma."
 building_giovanni_mausoleum_02:0 "Respetable mausoleo de los Giovanni"
 building_giovanni_mausoleum_02_desc:1 "Poco a poco, los Nigromantes miran hacia el exterior, interesados como las oportunidades que les da su nueva condición."
 building_giovanni_mausoleum_03:0 "Inmenso mausoleo de Giovanni"
 building_giovanni_mausoleum_03_desc:1 "Los italianos son ahora una fuerza a tener en cuenta. Siguen siendo poderosos nigromantes, pero también son capaces de jugar el juego político."
 building_type_pit_of_malkav_01:0 "Foso de Malkav"
 building_type_pit_of_malkav_01_desc:1 "#F Una brecha abierta yace bajo Jerusalén. Incluso acercarse es doloroso. Tu cabeza se siente como si estuviera a punto de explotar".
 building_pit_of_malkav_01:0 "Foso abierto de Malkav"
 building_pit_of_malkav_01_desc:1 "Tantas voces diciendo tantas cosas contradictorias... aunque todavía puedes vislumbrar un tenue filo de sabiduría en algunas de ellas."
 building_pit_of_malkav_02:0 "Fosa oculta de Malkav"
 building_pit_of_malkav_02_desc:1 "Has arrojado piedras al foso y las voces son ahora menos frenéticas. Eres capaz de entenderlas mejor".
 building_pit_of_malkav_03:0 "Foso cerrado de Malkav"
 building_pit_of_malkav_03_desc:1 "Las voces son silenciosas ahora, a menos que estés muy cerca del propio foso. Estar cerca de él te permite separar a los locos de los perspicaces con facilidad ahora."
 building_type_well_of_sacrifice_01:0 "Pozo del sacrificio"
 building_type_well_of_sacrifice_01_desc:1 "#F Si el infierno está en la Tierra, está aquí mismo."
 building_well_of_sacrifice_01:0 "Pozo de sacrificio menor"
 building_well_of_sacrifice_01_desc:1 "Una vez arrojados al pozo, dejan de llorar. Eso les entristece".
 building_well_of_sacrifice_02:0 "Pozo de sacrificio mayor"
 building_well_of_sacrifice_02_desc:1 "Tantos más necesitados de sentir el vacío eterno y su hambre infinita".
 building_well_of_sacrifice_03:0 "Pozo infernal de sacrificio"
 building_well_of_sacrifice_03_desc:1 "Pronto despertarán. Pronto vendrán. Y entonces, todos entenderán".
 building_type_london_mithraeum_01:0 "Mithraeum de Londres"
 building_type_london_mithraeum_01_desc:1 "#F Uno de los templos más antiguos de la fe mitraica, que aún se mantiene vigente por los seguidores del Dios Sol."
 building_london_mithraeum_01:0 "Mithraeum oculto"
 building_london_mithraeum_01_desc:1 "Temerosos de la Cruz, los fieles se congregan en las sombras de su antigua gloria."
 building_london_mithraeum_02:0 "Resurgimiento del Mitreo"
 building_london_mithraeum_02_desc:1 "Ahora es un secreto a voces que los fieles de Mitra rezan aquí, buscando la salvación prometida por el Dios de la Luz."
 building_london_mithraeum_03:0 "Mitreo triunfante"
 building_london_mithraeum_03_desc:1 "¡Es hora de que la Cruz se esconda, pues la verdadera fe de estas tierras ha regresado!"
 building_type_northern_throne_01:0 "El Trono del Norte"
 building_type_northern_throne_01_desc:1 "¡Un símbolo de la autoridad de Tzimisce que prolifera fuera de Carpathia!"
 building_northern_throne_01:0 "El Trono del Norte"
 building_northern_throne_01_desc:1 "Esta metrópoli regional está bajo el control total y exclusivo de su hegemón Tzimisce. La regla de hierro representa un nuevo estándar en la búsqueda de dominio de los Fiends, exigiendo así el respeto del clan."
 building_type_influence_law_01:0 "Influir en los legisladores"
 building_type_influence_law_01_desc:1 "#F Obviamente, estás por encima de la ley mortal. Pero tener a tus agentes dentro de las fuerzas que mantienen el orden público en este condado podría ser beneficioso."
 building_influence_law_01:0 "Influencia sutil de los legisladores"
 building_influence_law_01_desc:1 "Una sugerencia aquí y allá en el oído adecuado puede ayudar mucho a mantener al pueblo llano apaciguado."
 building_influence_law_02:0 "Influencia significativa de los legisladores"
 building_influence_law_02_desc:1 "Tienes una fuerte influencia en el sistema judicial aquí. Lo suficientemente fuerte como para ser utilizable de muchas maneras".
 building_influence_law_03:0 "Fuerte influencia de los legisladores"
 building_influence_law_03_desc:1 "Lo has adivinado: en esta etapa, tú eres la ley".
 building_influence_law_04:0 "Influencia absoluta de los legisladores"
 building_influence_law_04_desc:1 "Ser la ley es aburrido. ¿Por qué no crear la tuya propia?"
 building_type_haven_defenses_01:0 "Defensas del refugio"
 building_type_haven_defenses_01_desc:1 "No es mera paranoia, tus enemigos vendrán a por ti una noche. Y más vale que tengas un plan de contingencia para cuando eso ocurra".
 building_haven_defenses_01:0 "Defensas sutiles del refugio"
 building_haven_defenses_01_desc:1 "Algunas trampas y agentes fiables dispersos por el condado son un buen comienzo para cualquier defensa fuerte."
 building_haven_defenses_02:0 "Defensas fuertes del refugio"
 building_haven_defenses_02_desc:1 "Estás preparado para lo peor, tu plan de contingencia tiene un plan de contingencia propio."
 building_haven_defenses_03:0 "Defensas de refugio abrumadoras"
 building_haven_defenses_03_desc:1 "¡Tendrán que traer a todo un grupo de asalto para derribarte!"
 building_haven_defenses_04:0 "Defensas de refugio perfectas"
 building_haven_defenses_04_desc:1 "¡Estos molestos aventureros nunca sobrevivirán a tu mazmorra!"
 building_type_remote_haven_01:0 "Refugio remoto"
 building_type_remote_haven_01_desc:1 "#F A veces, sólo tienes que dar un paso atrás para planear tu próximo movimiento, lejos de las miradas indiscretas."
 building_remote_haven_01:0 "Refugio remoto escaso"
 building_remote_haven_01_desc:1 "Este refugio está alejado de cualquier indicio de civilización. Esa es probablemente su única ventaja".
 building_remote_haven_02:0 "Cómodo refugio remoto"
 building_remote_haven_02_desc:1 "Este no es tu patio, pero sigue siendo lo suficientemente bueno para unas cortas vacaciones."
 building_remote_haven_03:0 "Lujoso refugio remoto"
 building_remote_haven_03_desc:1 "Tu hogar lejos de casa, perfectamente seguro y convenientemente preparado para tus exquisitos gustos."
 building_remote_haven_04:0 "Opulento refugio remoto"
 building_remote_haven_04_desc:1 "Los antiguos senadores romanos se sonrojarían de lo que ocurre tras estos muros".
 building_type_influence_mercenaries_01:0 "Influencia de los mercenarios"
 building_type_influence_mercenaries_01_desc:1 "Los mortales han desarrollado la idea de los "Mercenarios", soldados experimentados de alquiler. Sin duda es algo que puedes utilizar en tu propio beneficio. #F"
 building_influence_mercenaries_01:0 "Influencia sutil de los mercenarios"
 building_influence_mercenaries_01_desc:1 "Tienes algunas conexiones entre un grupo local. Suficientes para darte algunas opciones".
 building_influence_mercenaries_02:0 "Influencia significativa de los mercenarios"
 building_influence_mercenaries_02_desc:1 "Puedes contar con un experimentado grupo de soldados mortales para defender tus intereses en esta zona."
 building_influence_mercenaries_03:0 "Fuerte influencia de los mercenarios"
 building_influence_mercenaries_03_desc:1 "Los mercenarios de aquí son ahora tu ejército de defensa privado."
 building_influence_mercenaries_04:0 "Influencia absoluta de los mercenarios"
 building_influence_mercenaries_04_desc:1 "¿Puedes siquiera llamarlos mercenarios a estas alturas? Difícil de decir".
 building_type_influence_barracks_01:0 "Influencia de los cuarteles"
 building_type_influence_barracks_01_desc:1 "#F Los ejércitos profesionales están regresando a la sociedad mortal. Una rara oportunidad para que los cainitas influyan en algunos guerreros experimentados para su causa."
 building_influence_barracks_01:0 "Influencia sutil en los cuarteles"
 building_influence_barracks_01_desc:1 "Algunos de los soldados de la zona están en tu nómina. Son aliados útiles en tiempos difíciles".
 building_influence_barracks_02:0 "Influencia significativa de los cuarteles"
 building_influence_barracks_02_desc:1 "La mayor parte del ejército regional conoce tu nombre, o trabaja para alguien que lo hace."
 building_influence_barracks_03:0 "Fuerte influencia de los cuarteles"
 building_influence_barracks_03_desc:1 "El ejército local sabe quién es su verdadero amo. Y desde luego no es un pomposo noble local".
 building_influence_barracks_04:0 "Influencia absoluta del cuartel"
 building_influence_barracks_04_desc:1 "¡Ahora puedes jugar a juegos de guerra con gente viva!"
 building_type_influence_burghers_01:0 "Influencia de los burgueses"
 building_type_influence_burghers_01_desc:1 "#F Una nueva clase social está surgiendo en el mundo mortal. Estos "burgueses" tienen mucho dinero pero poco poder militar real. Un objetivo perfecto para sus tratos en la sombra".
 building_influence_burghers_01:0 "Influencia sutil de los burgueses"
 building_influence_burghers_01_desc:1 "Has hecho algunas incursiones iniciales en la clase mercantil de esta zona.\NEste nivel requiere más de 10 de desarrollo para construir y permanecer habilitado."
 building_influence_burghers_02:0 "Influencia significativa de los burgueses"
 building_influence_burghers_02_desc:1 "Como mecenas en la sombra de algunos de los mercaderes más ricos de esta zona, obtienes considerables beneficios de ella.\NEste nivel requiere más de 15 de desarrollo para construir y permanecer habilitado."
 building_influence_burghers_03:0 "Fuerte influencia de los burgueses"
 building_influence_burghers_03_desc:1 "El dinero fluye en una sola dirección aquí, hacia tus bolsillos.\NEste nivel requiere más de 20 de desarrollo para construirlo y mantenerse habilitado."
 building_influence_burghers_04:0 "Influencia absoluta de los Burghers"
 building_influence_burghers_04_desc:1 "Te gustan ellos y su dinero, pero aún no te convencen del todo sus elecciones de moda. \N-Este nivel requiere más de 25 de desarrollo para construir y permanecer habilitado."
 #building_type_inquisition_church_01:0 "Iglesia de la Inquisición"
 #building_type_inquisition_church_01_desc:1 "#F Los fieles necesitan un lugar de reunión libre de la influencia de las sanguijuelas."
 #building_inquisition_church_01:0 "Capilla de la Inquisición"
 #building_inquisition_church_01_desc:1 "Un lugar pequeño y tranquilo, protegido por los Caballeros de Dios. Un oasis en un desierto".
 #building_inquisition_church_02:0 "Iglesia de la Inquisición"
 #building_inquisition_church_02_desc:1 "Aquí se mantiene a raya la influencia corruptora de los vampiros".
 #building_inquisition_church_03:0 "Catedral de la Inquisición"
 #building_inquisition_church_03_desc:1 "Un faro de luz en un mundo de oscuridad. El primero de muchos, con suerte".
 building_type_oculi_cell_01:0 "Celda Oculi Dei"
 building_type_oculi_cell_01_desc:1 "#F El ojo vigilante de la Inquisición nunca está dormido."
 building_oculi_cell_01:0 "Pequeña celda Oculi Dei"
 building_oculi_cell_01_desc:1 "Conocen los secretos de tus enemigos... y también los de tus amigos".
 building_oculi_cell_02:0 "Celda Oculi Dei grande"
 building_oculi_cell_02_desc:1 "Tú no los ves, pero ellos te ven a ti".
 building_oculi_cell_03:0 "Potente celda Oculi Dei"
 building_oculi_cell_03_desc:1 "¡Ellos ven... todo!"
 building_type_knights_patrol_01:0 "Célula de los Caballeros de Acre"
 building_type_knights_patrol_01_desc:1 "#F La fiel Espada de Dios patrulla las calles, una presencia tranquilizadora para los inocentes."
 building_knights_patrol_01:0 "Pequeños Caballeros de la Célula de Acre"
 building_knights_patrol_01_desc:1 "Una banda de Caballeros entrena y patrulla aquí, su valentía compensa su pequeño número."
 building_knights_patrol_02:0 "Grandes caballeros de la celda de Acre"
 building_knights_patrol_02_desc:1 "El populacho se envalentona ante la visión de los fieles soldados de Cristo que entrenan aquí."
 building_knights_patrol_03:0 "Poderosa célula de los Caballeros de Acre"
 building_knights_patrol_03_desc:1 "Listos para atacar en un momento dado, la presencia de los Caballeros en esta provincia no tiene debilidades."
 building_type_family_estates_01:0 "Fincas familiares"
 building_type_family_estates_01_desc:1 "#F Ya sea que te lo hayas ganado con tu ingenio y agallas o que te lo hayan entregado, tener un hogar real y tierra cultivable a tu nombre es un privilegio que incluso tus creadores rara vez llegan a disfrutar."
 building_family_estates_01:0 "Casa familiar"
 building_family_estates_01_desc:1 "La comodidad de vivir es baja en la lista de prioridades de las posibles mejoras de esta humilde finca, pero la tierra es fértil y debería recompensarte con creces."
 building_family_estates_02:0 "Finca familiar"
 building_family_estates_02_desc:1 "Una finca tan grande y productiva justifica que te consideres una persona de categoría, si no entre tus pares nobles, al menos entre todos los siervos a los que das órdenes. \Este nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado".
 building_family_estates_03:0 "Latifundio familiar"
 building_family_estates_03_desc:1 "Esta vasta parcela no solo produce suficientes cosechas para alimentar a un ejército, sino que también alberga una residencia digna de un aristócrata. \N - Este nivel requiere más de 15 de desarrollo para construir y permanecer habilitado."
 building_type_family_worship_01:0 "Culto familiar"
 building_type_family_worship_01_desc:1 "#Cada familia tiene sus tradiciones y pocas son más importantes que la forma de rendir culto."
 building_family_worship_01:0 "Santuario familiar"
 building_family_worship_01_desc:1 "Un lugar modesto, pero digno, designado para adorar al Dios de los hombres o a los poderes que se te presentaron junto con la vida eterna."
 building_family_worship_02:0 "Capilla familiar"
 building_family_worship_02_desc:1 "Una cámara espaciosa o un edificio independiente, este lugar de culto puede facilitar las oraciones compartidas incluso de los clanes más numerosos."
 building_family_worship_03:0 "Templo privado"
 building_family_worship_03_desc:1 "Tanto si se enmascara como una iglesia curiosamente inaccesible o como un complejo de bodegas de tamaño industrial, esta instalación es un testimonio de la devoción de tu familia."
 building_type_family_muscle_01:0 "Músculo familiar"
 building_type_family_muscle_01_desc:1 "#F La existencia en el umbral entre el mundo de los mortales y los dominios de los señores de la noche es peligrosa y difícil, los cómplices del tipo violento ayudan."
 building_family_muscle_01:0 "Rufianes locales"
 building_family_muscle_01_desc:1 "Tener a los rufianes y alborotadores del barrio en el bolsillo no allana el camino a grandes conquistas, pero es poderosamente útil en disputas menores."
 building_family_muscle_02:0 "Guardia de la casa"
 building_family_muscle_02_desc:1 "Confiables y bien equipados, estos hombres sirven para proteger lo que tu casa aprecia."
 building_family_muscle_03:0 "Estandarte de la familia"
 building_family_muscle_03_desc:1 "Provistos de todo el entrenamiento y el equipo que un guerrero podría desear, estos hombres son capaces de reunir la formación más devastadora de la época, un estandarte de caballería pesada."
 building_type_family_enterprise_01:0 "Empresa familiar"
 building_type_family_enterprise_01_desc:1 "#F Un empresario de éxito atiende los caprichos de sus clientes según la última moda. A los Kindred eso no les importa, así que delegan la tarea en los de su clase. #F"
 building_family_enterprise_01:0 "Tienda familiar"
 building_family_enterprise_01_desc:1 "Tus conexiones únicas te proporcionan un suministro de bienes que pueden alcanzar un buen precio entre los mortales. Siempre y cuando estén bien limpios de sangre".
 building_family_enterprise_02:0 "Emporio familiar"
 building_family_enterprise_02_desc:1 "Si lo quieren, lo vendes. Ya sea una magnífica espada de un noble fallecido o un saco de nabos, tus márgenes varían, pero el dinero sigue entrando. \N - Este nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado."
 building_family_enterprise_03:0 "Empresa familiar de importación"
 building_family_enterprise_03_desc:1 "Desde alimentos desconocidos en la región hasta muebles y armas de diseño exótico y reliquias antiguas, todas esas mercancías son transportadas aquí por su red comercial que se extiende hasta las conexiones entre los inmortales. \N - Este nivel requiere más de 15 de desarrollo para construir y permanecer habilitado".
 building_type_family_connections_01:0 "Conexiones familiares"
 building_type_family_connections_01_desc:1 "#F Mezclarse con la nobleza implica participar en una carrera armamentística de despilfarro. Pero si de algo estás seguro es de que conocer a la gente adecuada es importante. #F"
 building_family_connections_01:0 "Hospedar a los bajos nobles"
 building_family_connections_01_desc:1 "Las personas que comen y beben a tu costa rara vez son más importantes que un primo segundo de un barón, pero tienes que empezar a hacerte conocer y respetar en algún sitio."
 building_family_connections_02:0 "Anfitrión de la nobleza"
 building_family_connections_02_desc:1 "La noticia de tu hospitalidad se ha extendido y ahora te visitan personas realmente capaces de corresponder. Tarde o temprano harás contactos con la élite gobernante. \N - Este nivel requiere más de 10 de desarrollo para construir y permanecer habilitado."
 building_family_connections_03:0 "Acoge a los aristócratas"
 building_family_connections_03_desc:1 "Has tenido éxito en tu esfuerzo por ser reconocido como una persona de riqueza e influencia. Los más poderosos del reino te buscan para negociar lo primero o lo segundo. \N - Este nivel requiere más de 15 de desarrollo para construir y permanecer habilitado."
 building_type_family_rights_01:0 "Derechos familiares"
 building_type_family_rights_01_desc:1 "#F Te presentas como heredero de una casa espléndida, pero en gran parte olvidada. Que eso sea cierto es irrelevante, lo que importa es quién lo reconoce como tal."
 building_family_rights_01:0 "Derecho de propiedad de la tierra"
 building_family_rights_01_desc:1 "Asegurar el derecho de propiedad de la tierra por sí solo no te hará influyente, pero dirigir tus negocios es más fácil cuando no tienes que enterrar a todo el que llama a tu puerta detrás del cobertizo."
 building_family_rights_02:0 "Título ecuestre"
 building_family_rights_02_desc:1 "El gobernante local te designó como guerrero en su estandarte de caballería y te concedió los privilegios correspondientes. Todavía no se ha enterado de que no sirves a ningún amo mortal. \N - Este nivel requiere más de 15 de desarrollo para construir y permanecer habilitado."
 building_family_rights_03:0 "Título de Castellan"
 building_family_rights_03_desc:1 "El gobernante del reino considera ahora que tus posesiones son una parte esencial de su infraestructura defensiva. Este reconocimiento conlleva beneficios.\NEste nivel requiere más de 15 de desarrollo para construir y permanecer habilitado."
 building_family_rights_04:0 "Estatus de magnate"
 building_family_rights_04_desc:1 "Los detalles exactos de tu herencia nobiliaria y cómo se traduce en tu rango entre la nobleza son totalmente secundarios a tu riqueza y poder aparentes. Aristócrata o no, eres alguien a tener en cuenta.\NEste nivel requiere más de 20 de desarrollo para construir y mantenerse habilitado."
 building_type_fortress_cross_01:0 "Fortaleza de la Cruz"
 building_type_fortress_cross_01_desc:1 "#F La casa madre de los Caballeros de Acre, fuertemente fortificada, es quizás la fortaleza más impresionante de la Inquisición."
 building_fortress_cross_01:0 "Fortaleza aislada de la Cruz"
 building_fortress_cross_01_desc:1 "Imponente, la sede de los Caballeros de Acre aún carece del poder político de algunos otros lugares sagrados de la Inquisición."
 building_fortress_cross_02:0 "Animada fortaleza de la Cruz"
 building_fortress_cross_02_desc:1 "Conocida como un importante lugar de peregrinación para todos los aspirantes a inquisidores, la Fortaleza es ahora el centro de entrenamiento de la élite."
 building_fortress_cross_03:0 "Fortaleza de la Verdadera Cruz"
 building_fortress_cross_03_desc:1 "Con el fragmento de la Vera Cruz bendiciendo sus muros, la Fortaleza es ahora un indomable faro de luz."
 building_type_st_scholastica_01:0 "Santa Escolástica"
 building_type_st_scholastica_01_desc:1 "#F La segunda patrona más importante de la Orden Roja era la hermana gemela de San Benito, una mujer decidida pero piadosa."
 building_st_scholastica_01:0 "Convento de Santa Escolástica"
 building_st_scholastica_01_desc:1 "El convento más importante de las Hermanas Rojas es un lugar extraño en el que se permite a las hermanas mucha más libertad que a la mayoría de sus hermanos clérigos."
 building_st_scholastica_02:0 "Biblioteca de Santa Escolástica"
 building_st_scholastica_02_desc:1 "Es una de las mayores bibliotecas de las que dispone la Inquisición, y también alberga una colección de conocimientos prohibidos. Sólo las hermanas más piadosas pueden acceder a ella".
 building_st_scholastica_03:0 "Artefactos de Santa Escolástica"
 building_st_scholastica_03_desc:1 "Para luchar contra el Enemigo, la Orden Roja no rehúye los métodos inusuales. Aquí encontraron sus armas más formidables".
 building_type_castle_von_murnau_01:0 "Castillo von Murnau"
 building_type_castle_von_murnau_01_desc:1 "#F El hogar ancestral de la famosa familia de inquisidores. Un lugar de culto y de guerra.
 building_castle_von_murnau_01:0 "Mansión von Murnau"
 building_castle_von_murnau_01_desc:1 "Lujosa y bien comunicada, la mansión está bien integrada en el complejo paisaje de la nobleza alemana."
 building_castle_von_murnau_02:0 "Castillo von Murnau"
 building_castle_von_murnau_02_desc:1 "Con un ala reservada para los asuntos de la Inquisición, el castillo von Murnau se ha convertido en un importante lugar de descanso para los cazadores viajeros."
 building_castle_von_murnau_03:0 "Fortaleza von Murnau"
 building_castle_von_murnau_03_desc:1 "Preparada para defenderse de cualquier amenaza, la fortaleza se mantiene desafiante frente a los esbirros de la oscuridad. Testamento de la maldición y la bendición de una familia por igual".
 building_type_the_nest_01:0 "El nido"
 building_type_the_nest_01_desc:1 "La paranoia de #F Rodrigue ha construido este laberinto de túneles bajo Pamplona, con la esperanza de utilizarlo como efecto sorpresa contra los malditos chupasangres."
 building_the_nest_01:0 "Pequeño nido"
 building_the_nest_01_desc:1 "Bien construido, pero aún pequeño, el Nido sirve principalmente como una forma segura de compartir información para los Caballeros de San Jaime."
 building_the_nest_02:0 "Nido grande"
 building_the_nest_02_desc:1 "Abarcando la mayor parte de Pamplona, la red de túneles y espías de Rodrigue es ahora un activo formidable para la Inquisición Ibérica."
 building_the_nest_03:0 "Nido formidable"
 building_the_nest_03_desc:1 "Cualquier enemigo de San Jaime que entre en Pamplona es muy poco probable que salga vivo. La red de Rodrigue está ahora preparada para afrontar cualquier cosa".
 building_type_st_cecila_01:0 "Convento de Santa Cecilia"
 building_type_st_cecila_01_desc:1 "#F La sede de formación de las Hermanas de San Juan es un lugar de tranquilidad y contemplación en un océano de visiones enloquecidas."
 building_st_cecila_01:0 "Hospital de Santa Cecilia"
 building_st_cecila_01_desc:1 "Cualquier inquisidor herido en las Islas Británicas conoce y agradece los cuidados de las hermanas conocedoras aquí presentes."
 building_st_cecila_02:0 "Exorcistas de Santa Cecilia"
 building_st_cecila_02_desc:1 "Los exorcistas más hábiles de la Inquisición se entrenan en Santa Cecilia. Ningún espíritu de otro mundo puede resistirse a su llamada, ya sea de paz o de guerra."
 building_st_cecila_03:0 "Inquisidores de Santa Cecilia"
 building_st_cecila_03_desc:1 "Las Hermanas son mujeres de paz, pero saben que el Enemigo no lo es. Las pocas que deciden dedicar su vida a la guerra son de una mente y una piedad formidables."
 building_type_everard_players_01:0 "Jugadores de Everard"
 building_type_everard_players_01_desc:1 "#F La famosa tropa de artistas a las órdenes de Everard d'Arras es en realidad uno de los activos más importantes de los Oculi Dei, los espías de la Inquisición."
 building_everard_players_01:0 "Le Courtois d'Arras"
 building_everard_players_01_desc:1 "Una de las obras de Jean Bodel es una variación del cuento bíblico del Hijo Pródigo."
 building_everard_players_02:0 "Obra de teatro de San Nicolás"
 building_everard_players_02_desc:1 "Donde a un santo piadoso se le confía el oro del rey pagano".
 building_everard_players_03:0 "Los fieles de Gerner"
 building_everard_players_03_desc:1 "La tropa está en realidad protegida en secreto por los caballeros de la Espada de Santiago. Tan poderosa bendición ha ayudado a menudo a los actores a escapar de sus más fervientes críticos."
 building_type_ipeasants_01:0 "Controla las tierras de cultivo"
 building_type_ipeasants_01_desc:1 "#F La gente honesta y temerosa de Dios que trabaja en los campos es la columna vertebral de este reino y de nuestra lucha."
 building_ipeasants_01:0 "Predicar a los campesinos"
 building_ipeasants_01_desc:1 "Los siervos se dejan impresionar fácilmente por los de clase superior, enviar a nuestros agentes entre ellos es seguro para conseguir su apoyo"
 building_ipeasants_02:0 "Radicalizar a los campesinos"
 building_ipeasants_02_desc:1 "Los campesinos son temerosos, pero empoderados por nuestro celo, pueden convertirse en aliados leales a nuestra causa.\NEste nivel requiere más de 5 de desarrollo para construir y mantenerse habilitado."
 building_ipeasants_03:0 "Formar milicias de campesinos"
 building_ipeasants_03_desc:1 "Agitada adecuadamente contra las fuerzas de la oscuridad, la gente de las tierras de cultivo puede convertirse en una fuerza organizada sujeta a nuestra autoridad.\NEste nivel requiere más de 10 de desarrollo y un nivel de esplendor de dinastía de Insignificante para construirse y permanecer habilitado."
 building_ipeasants_04:0 "Verano. Cosecha. Guerra".
 building_ipeasants_04_desc:1 "Los corazones de los campesinos arden con justa furia. Son el rebaño enfurecido de Dios y nosotros somos sus pastores.\NEste nivel requiere más de 15 de desarrollo y nivel de esplendor de dinastía de Bien conocido para construir y permanecer habilitado." 
 building_type_ieducation_01:0 "Controlar la educación religiosa"
 building_type_ieducation_01_desc:1 "#Facilitando el esfuerzo de enseñar a los lugareños la palabra de Dios, podemos ayudarles a ser más piadosos, alfabetizados y comprensivos con nuestros esfuerzos."
 building_ieducation_01:0 "Financiar las escuelas dominicales"
 building_ieducation_01_desc:1 "Los hijos del pueblo llano deben ser conscientes de la importancia de nuestra misión, si no de su naturaleza exacta."
 building_ieducation_02:0 "Financiar el Seminario"
 building_ieducation_02_desc:1 "Bajo nuestra sutil dirección, las futuras generaciones de sacerdotes educados aquí estarán maduras para ser reclutadas para nuestra causa. \N - Este nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado."
 building_ieducation_03:0 "Financiar la Universidad Teológica"
 building_ieducation_03_desc:1 "Aquí es donde los eruditos de la Iglesia dan forma a su futuro. Nuestra influencia asegurará nuestra parte clave en ella.\N-Este nivel requiere más de 10 niveles de desarrollo y esplendor de dinastía\NInsignificante para construir y permanecer habilitado."
 building_ieducation_04:0 "Teología armada"
 building_ieducation_04_desc:1 "Gracias al control total de todo lo relativo a la enseñanza religiosa, las propias definiciones del bien y del mal se adaptan a nuestras necesidades.\NEste nivel requiere más de 15 de desarrollo y un nivel de esplendor de dinastía de Insignificante para construirse y mantenerse habilitado." 
 building_type_ioutskirts_01:0 "Controla las afueras"
 building_type_ioutskirts_01_desc:1 "#F Una vez domado, el desierto local puede ocultar nuestros movimientos, no nuestros enemigos#"
 building_ioutskirts_01:0 "Accede a los bosques del gobernante"
 building_ioutskirts_01_desc:1 "Los cotos de caza son propiedad exclusiva de la familia gobernante, la petición de acceso nos permitirá patrullar por ellos y conocer a los intrusos"
 building_ioutskirts_02:0 "Organiza el indulto de los cazadores furtivos"
 building_ioutskirts_02_desc:1 "Los bosques son el hogar de los cazadores furtivos, proscritos no por elección, sino por necesidad. Su pericia en el terreno hace que merezca la pena ganarse su lealtad.\NEste nivel requiere más de 10 de desarrollo para construir y permanecer habilitado."
 building_ioutskirts_03:0 "Asegurar los derechos de caza"
 building_ioutskirts_03_desc:1 "Con el soborno, la amenaza y la apelación a la autoridad superior, podemos arrebatar el control oficial de los bosques al gobernante local.\NEste nivel requiere más de 10 de desarrollo y un nivel de esplendor de la dinastía de Insignificante para construirlo y permanecer habilitado."
 building_ioutskirts_04:0 "Bosques del Señor"
 building_ioutskirts_04_desc:1 "No hay un solo cazador, herbolario, recolector de bayas o ermitaño que viva en el bosque local que no doble como nuestro agente.\NEste nivel requiere más de 15 de desarrollo y nivel de esplendor de dinastía de Insignificante para construir y permanecer habilitado."
 building_type_itownsfolk_01:0 "Controla a la gente del pueblo"
 building_type_itownsfolk_01_desc:1 "#F Aquí se congrega la gente y el dinero cambia de manos, nuestra causa requiere ambas cosas. #!"
 building_itownsfolk_01:0 "Predicadores callejeros"
 building_itownsfolk_01_desc:1 "Donde la gente al menos pretende ser decente, la predicación contra el pecado y el libertinaje está destinada a caer en oídos más o menos palpablemente comprensivos."
 building_itownsfolk_02:0 "Indulgencias para los comerciantes"
 building_itownsfolk_02_desc:1 "El perdón de la Iglesia no es barato. Tenemos los medios para abaratarlo y los mercaderes aprecian un buen trato.Este nivel requiere más de 5 de desarrollo para construir y mantenerse habilitado."
 building_itownsfolk_03:0 "Reclutamiento de líderes del gremio"
 building_itownsfolk_03_desc:1 "Si no es mediante apelaciones a la fe, sí mediante promesas de conexiones, los líderes de los artesanos pueden convertirse en agentes valiosos.\NEste nivel requiere más de 10 de desarrollo y un nivel de esplendor de dinastía de Insignificante para construir y permanecer habilitado."
 building_itownsfolk_04:0 "Empresa sagrada"
 building_itownsfolk_04_desc:1 "Los comerciantes y artesanos de esta ciudad se han vuelto mucho más piadosos desde el día en que llegamos. Casi parece que aquí no hay lugar para que los no tan piadosos hagan negocios.\NEste nivel requiere más de 15 de desarrollo y nivel de esplendor de dinastía de Bien conocido para construir y permanecer habilitado."
 building_type_iunderworld_01:0 "Controla el inframundo"
 building_type_iunderworld_01_desc:1 "#F El reino de las sombras es donde habitan nuestros enemigos. La cooperación con sus habitantes mortales es indecorosa, pero necesaria. #!"
 building_iunderworld_01:0 "Ayuda a los mendigos y a los erizos"
 building_iunderworld_01_desc:1 "La gente adecuada aparta su mirada de los miserables. Eso es parte de lo que los convierte en activos inestimables".
 building_iunderworld_02:0 "Convertir a los delincuentes comunes"
 building_iunderworld_02_desc:1 "La sociedad ha cerrado sus puertas a estos maleantes, ladrones y estafadores, pero aún nos son útiles.\NEste nivel requiere más de 10 de desarrollo para construirlo y mantenerlo habilitado."
 building_iunderworld_03:0 "Infiltrarse en el crimen organizado"
 building_iunderworld_03_desc:1 "Los tratos con las altas esferas de la sociedad criminal están destinados a comprometernos, pero sus frutos bien pueden merecer la pena.\NEste nivel requiere más de 10 de desarrollo y un nivel de esplendor de dinastía de Insignificante para construirlo y mantenerse habilitado."
 building_iunderworld_04:0 "Vicio sancionado"
 building_iunderworld_04_desc:1 "Los hombres son pecadores y no es nuestra prioridad dejar sin trabajo a los que viven de ese hecho. Siempre y cuando contribuyan a la causa.\NEste nivel requiere más de 15 de desarrollo y nivel de esplendor de dinastía\Nbien conocido para construir y permanecer habilitado." 
 building_type_igarrison_01:0 "Controlar la guarnición"
 building_type_igarrison_01_desc:1 "Los hombres armados de este asentamiento están al acecho de los enemigos de su señor. Podemos desviar su atención hacia aquellos más siniestros."
 building_igarrison_01:0 "Ayuda a la guardia nocturna"
 building_igarrison_01_desc:1 "El trabajo de un vigilante nunca termina, la ayuda de nuestros agentes será muy apreciada."
 building_igarrison_02:0 "Reclutar agentes de la guarnición"
 building_igarrison_02_desc:1 "Los buenos soldados no hacen preguntas cuando reciben órdenes de sus oficiales. Eso hace que estos últimos sean esenciales para nuestra causa.Este nivel requiere más de 5 de desarrollo para construir y mantenerse habilitado."
 building_igarrison_03:0 "Control de guarnición encubierto"
 building_igarrison_03_desc:1 "Por cualquier medio disponible nos aseguraremos la obediencia de los comandantes de más alto rango de esta guarnición.\NEste nivel requiere más de 10 de desarrollo y un nivel de esplendor de dinastía de Insignificante para construirse y mantenerse habilitado."
 building_igarrison_04:0 "Bastión de los fieles"
 building_igarrison_04_desc:1 "Los soldados de todos los rangos apostados en esta ciudad se inclinan ante nuestros representantes, llenos de orgullo por su sagrada tarea de protegerlos.Este nivel requiere más de 15 de desarrollo y un nivel de esplendor de dinastía de Insignificante para construir y permanecer habilitado."
 building_type_gpeasants_01:0 "Despierta a los campesinos"
 building_type_gpeasants_01_desc:1 "Durante demasiado tiempo se ha explotado y abusado de los que ponen la comida en las mesas de la nobleza. Es hora de dar poder a sus vastas masas".
 building_gpeasants_01:0 "Los desafortunados"
 building_gpeasants_01_desc:1 "Al no ser dueños de la tierra que trabajan, esos campesinos que tuvieron una cosecha especialmente mala no tienen nada que perder. Dales esperanza y nos seguirán".
 building_gpeasants_02:0 "Los sobrecargados"
 building_gpeasants_02_desc:1 "Después de entregar la parte del león de la cosecha a su señor, pocos campesinos pueden asegurarse algo más que una penosa existencia con la tierra que trabajan. Es hora de convencerlos de que Dios no pretendía que vivieran así.\N-Este nivel requiere más de 5 de desarrollo para construir y permanecer habilitado."
 building_gpeasants_03:0 "Los fieles"
 building_gpeasants_03_desc:1 "Todo campesino entiende instintivamente que los que más trabajan deben ser los primeros en disfrutar de los frutos de este trabajo. La fe puede darles valor para que el mundo funcione así. \N - Este nivel requiere más de 10 desarrollos para construir y mantenerse habilitado."
 building_type_gcraftsmen_01:0 "Despierta a los artesanos"
 building_type_gcraftsmen_01_desc:1 "Aunque gozan de un estatus superior al de sus homólogos rurales, los trabajadores de las ciudades siguen siendo objeto de una explotación facilitada por una fe corrupta. Es hora de presentarles una alternativa". 
 building_gcraftsmen_01:0 "Los aprendices"
 building_gcraftsmen_01_desc:1 "Los aprendices soportan dificultades mucho más severas de lo que debería requerir su educación. Podemos aprovechar su frustración y convertirla en ira justa".
 building_gcraftsmen_02:0 "Los jornaleros"
 building_gcraftsmen_02_desc:1 "Los jornaleros pasan la parte más productiva de su vida trabajando para enriquecer a sus amos. No es la voluntad de Dios que sea así y los artesanos estarán ansiosos por oírlo."
 building_gcraftsmen_03:0 "Los maestros"
 building_gcraftsmen_03_desc:1 "Los maestros artesanos ocupan la cima de la jerarquía del gremio, pero incluso ellos están sujetos a los caprichos de sus nobles señores. La nobleza de un hombre radica en su utilidad para su breathren e incluso los maestros pueden simpatizar con este mensaje.\NEste nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado."
 building_type_gfootmen_01:0 "Despierta a los hombres de a pie"
 building_type_gfootmen_01_desc:1 ""
 building_gfootmen_01:0 "Los impagos"
 building_gfootmen_01_desc:1 "¿Qué es un soldado al que no se le paga lo que le corresponde? Un rebelde que espera una causa. Nosotros tenemos la causa justa".
 building_gfootmen_02:0 "Los maltratados"
 building_gfootmen_02_desc:1 "¿Aguantaría alguien el agotamiento, el hambre y el frío, se expondría a la enfermedad y a la muerte violenta para enriquecer a su señor en tierras y títulos si la vida le ofreciera un camino mejor? Podemos ofrecer a estos hombres armados un camino hacia Dios.\NEste nivel requiere más de 5 de desarrollo para construir y permanecer habilitado."
 building_gfootmen_03:0 "El aspirante"
 building_gfootmen_03_desc:1 "¿De qué sirve la valentía, la competencia, la lealtad y la iniciativa de un soldado si los altos cargos de liderazgo están reservados a los de sangre azul? Nuestra santa causa ofrece a los que se esfuerzan por llegar a más una oportunidad de demostrar su valía.\NEste nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado."
 building_type_inquisition_church_01:0 "Iglesia de la Inquisición"
 building_type_inquisition_church_01_desc:1 "#F Los fieles necesitan un lugar de reunión libre de la influencia de las sanguijuelas, nuestros hermanos y hermanas, un lugar para contemplar."
 building_inquisition_church_01:0 "Capilla de la Inquisición"
 building_inquisition_church_01_desc:1 "Un lugar pequeño, tranquilo, protegido por los Caballeros de Dios. Un oasis en un desierto".
 building_inquisition_church_02:0 "Iglesia de la Inquisición"
 building_inquisition_church_02_desc:1 "Aquí se mantiene a raya la influencia corruptora de los vampiros."\N-Este nivel requiere más de 10 de desarrollo para construirlo y mantenerlo habilitado."
 building_inquisition_church_03:0 "Catedral de la Inquisición"
 building_inquisition_church_03_desc:1 "Un faro de luz en un mundo de oscuridad. El primero de muchos, con suerte.Este nivel requiere más de 15 de desarrollo y nivel de esplendor de dinastía de Notable para construir y permanecer habilitado."
 building_inquisition_church_04:0 "Archicatedral de la Inquisición"
 building_inquisition_church_04_desc:1 "Un monumento a nuestra devoción, se eleva sobre la tierra como un desafío a las fuerzas del mal.Este nivel requiere más de 20 de desarrollo y un nivel de esplendor de dinastía de Notable para construir y permanecer habilitado."
 building_type_inquisition_office_01:0 "Oficina de la Inquisición"
 building_type_inquisition_office_01_desc:1 "#F Un lugar para llevar a cabo nuestra administración lejos de las miradas indiscretas."
 building_inquisition_office_01:0 "Sótano de la oficina"
 building_inquisition_office_01_desc:1 "Un espacio bien escondido para almacenar y procesar nuestros documentos."
 building_inquisition_office_02:0 "Oficina remota"
 building_inquisition_office_02_desc:1 "Una modesta casa adosada en la que podemos coordinar nuestros esfuerzos sin llamar mucho la atención."\N-Este nivel requiere más de 10 de desarrollo para construirse y mantenerse habilitado."
 building_inquisition_oficina_03:0 "Edificio de oficinas"
 building_inquisition_office_03_desc:1 "Un impresionante edificio de oficinas en el distrito más concurrido de la ciudad al que acuden sus habitantes más ricos e influyentes para hacer negocios.Este nivel requiere más de 15 de desarrollo y un nivel de esplendor de dinastía de Notable para construirlo y mantenerse habilitado."
 building_inquisition_office_04:0 "Barrio de oficinas"
 building_inquisition_office_04_desc:1 "Una sección de la ciudad exclusiva para nuestros hermanos y hermanas. No deja ninguna duda sobre nuestro control de los asuntos locales y regionales.\N-Este nivel requiere más de 20 de desarrollo y nivel de esplendor de dinastía de Significante para construir y permanecer habilitado."
 building_type_inquisition_palace_01:0 "Palacio de la Inquisición"
 building_type_inquisition_palace_01_desc:1 "#F Un lugar para que nuestros caballeros se reúnan, entrenen y se den un festín."
 building_inquisition_palace_01:0 "Pabellón de caza"
 building_inquisition_palace_01_desc:1 "Una finca remota adecuada para dedicarse al pasatiempo terrenal favorito de todo caballero."
 building_inquisition_palace_02:0 "Mansión inquisitorial"
 building_inquisition_palace_02_desc:1 "Una elegante residencia en la que la hospitalidad cumple con los más altos estándares."\N-Este nivel requiere más de 10 de desarrollo para construir y permanecer habilitado."
 building_inquisition_palace_03:0 "Palacio de la Inquisición"
 building_inquisition_palace_03_desc:1 "Un espléndido palacio, testimonio de la nobleza de nuestra causa. Pocos nobles de esta tierra se plantearían rechazar una invitación.Este nivel requiere más de 15 de desarrollo y un nivel de esplendor de dinastía de Notable para construirlo y mantenerlo habilitado."
 building_inquisition_palace_04:0 "Gran Palacio de la Inquisición"
 building_inquisition_palace_04_desc:1 "Nuestra venerable casa, opulenta e imperial. Apta para albergar a reyes, emperadores y al mismísimo Santo Padre.\NEste nivel requiere más de 20 de desarrollo y nivel de esplendor de dinastía de Significante para construir y permanecer habilitado."
 building_type_inquisition_armory_01:0 "Armería de la Inquisición"
 building_type_inquisition_armory_01_desc:1 "#F Mantener una presencia militar significativa propia en esta región requiere una infraestructura adecuada."
 building_inquisition_armory_01:0 "Almacenes de armas"
 building_inquisition_armory_01_desc:1 "Pocos de nuestros agentes van desarmados, pero algunas tareas requieren un equipo más pesado. Entonces, estos alijos resultan útiles".
 building_inquisition_armory_02:0 "Armería de la Inquisición"
 building_inquisition_armory_02_desc:1 "Estas salas repletas de armas y armaduras garantizan nuestra preparación en caso de que la oscuridad levante la cabeza."\N-Este nivel requiere más de 10 de desarrollo para construirse y mantenerse habilitado."
 building_inquisition_armory_03:0 "Talleres de armas inquisitoriales"
 building_inquisition_armory_03_desc:1 "Producir nuestro propio equipo es la mejor manera de asegurar que cumple con los requisitos inusuales que nuestra misión conlleva.\NEste nivel requiere más de 15 de desarrollo y un nivel de esplendor de dinastía de Notable para construir y mantenerse habilitado."
 building_inquisition_armory_04:0 "Academia militar inquisitorial"
 building_inquisition_armory_04_desc:1 "En este extenso complejo de instalaciones militares nuestros caballeros son capaces de forjar plebeyos en formidables armas contra el mal.Este nivel requiere más de 20 de desarrollo y un nivel de esplendor de dinastía de Notable para construir y permanecer habilitado."
 building_type_inquisition_keep_01:0 "Castillo de la Inquisición"
 building_type_inquisition_keep_01_desc:1 "#F Un lugar para mantener a salvo todo tipo de cosas, ya sea nosotros mismos, nuestros prisioneros o nuestros secretos. #!"
 building_inquisition_keep_01:0 "Torre de la Inquisición"
 building_inquisition_keep_01_desc:1 "La primera manifestación física de la protección que otorgamos a estas tierras."
 building_inquisition_keep_02:0 "Torreón de la Inquisición"
 building_inquisition_keep_02_desc:1 "Sólo nuestros agentes entran en esta fortificación sin ser notados, sólo los gritos la dejan así."\N-Este nivel requiere más de 10 de desarrollo para construirlo y mantenerlo habilitado."
 building_inquisition_keep_03:0 "Castillo de la Inquisición"
 building_inquisition_keep_03_desc:1 "Una formidable fortaleza contra nuestros viles enemigos. Nuestros planes y maquinaciones brotan de aquí como la sangre de una arteria.Este nivel requiere más de 15 de desarrollo y un nivel de esplendor de dinastía de Notable para construir y permanecer habilitado."
 building_inquisition_keep_04:0 "Fortaleza de la Inquisición"
 building_inquisition_keep_04_desc:1 "Una montaña de piedra y acero ansioso tan inexpugnable como nuestra fe. Ninguna criatura sensible de la noche está lo suficientemente loca como para atacarla directamente.\NEste nivel requiere más de 20 de desarrollo y nivel de esplendor de dinastía de Significante para construir y permanecer habilitado."
 building_type_heretic_hall_01:0 "Salón del Pueblo"
 building_type_heretic_hall_01_desc:1 "#F Todos los hijos fieles de Dios son bienvenidos a nuestra morada para alimentar sus cuerpos y sus espíritus. #!"
 building_heretic_hall_01:0 "People's Gathering Spot"
 building_heretic_hall_01_desc:1 "Dios está presente y lo único que se necesita para reunirse en su templo es designar un lugar. Aunque unas sillas estarían bien".
 building_heretic_hall_02:0 "Casa del pueblo"
 building_heretic_hall_02_desc:1 "Los fieles están lo suficientemente hambrientos de sustento espiritual y nuestros sermones son lo suficientemente inspiradores como para soportarlos bajo la lluvia, pero tener un techo no está de más."\N-Este nivel requiere más de 5 de desarrollo para construir y mantenerse habilitado."
 building_heretic_hall_03:0 "Salón del Pueblo"
 building_heretic_hall_03_desc:1 "Un edificio lo suficientemente espacioso como para celebrar misas, comidas comunales, reuniones y juicios a los enemigos de nuestra santa causa."\NEste nivel requiere más de 10 de desarrollo para construir y permanecer habilitado."
 building_heretic_hall_04:0 "Palacio del Pueblo"
 building_heretic_hall_04_desc:1 "Un testamento de la unidad de nuestro rebaño. Un hogar para cada alma fiel hecho espléndido con el trabajo compartido.\N-Este nivel requiere más de 20 de desarrollo para construir y mantenerse habilitado."
 building_type_inquisition_contact_01:0 "Contacta con los compañeros de orden"
 building_type_inquisition_contact_01_desc:1 "#F Aunque somos pocos y nuestra misión debe permanecer en secreto, no estamos solos en nuestra lucha.#"
  building_inquisition_contact_01:0 "Punto de caída de la muerte"
 building_inquisition_contact_01_desc:1 "Un punto designado para intercambiar mensajes encriptados y compartir conocimientos con nuestros compañeros en el máximo secreto."
 building_inquisition_contact_02:0 "Lugar de encuentro"
 building_inquisition_contact_02_desc:1 "Un lugar lo suficientemente discreto como para que los agentes de nuestra orden se reúnan con sus homólogos cara a cara.\NEste nivel requiere más de 10 de desarrollo para construirse y mantenerse habilitado."
  building_inquisition_contact_03:0 "Conferencia semanal"
 building_inquisition_contact_03_desc:1 "Una reunión periódica de expertos en el campo de la lucha contra las fuerzas del infierno que tiene lugar en la intimidad de nuestras posesiones.\NEste nivel requiere más de 20 de desarrollo para construir y mantenerse habilitado."
 building_type_inquisition_acre_01:0 "Campo de entrenamiento de los Caballeros de Acre"
 building_type_inquisition_acre_01_desc:1 "#F Aquí nuestros hermanos perfeccionan su santo oficio de vencer a los siervos del diablo."
 building_inquisition_acre_01:0 "Terreno de combate"
 building_inquisition_acre_01_desc:1 "Un prado aislado con mucho espacio para el entrenamiento de combate."
 building_inquisition_acre_02:0 "Campo de entrenamiento"
 building_inquisition_acre_02_desc:1 "Un campamento de entrenamiento en el bosque con suficiente infraestructura y experiencia para beneficiar incluso a los guerreros más experimentados.Este nivel requiere más de 5 de desarrollo para construir y mantenerse habilitado."
 building_inquisition_acre_03:0 "Torneo de justas"
 building_inquisition_acre_03_desc:1 "Un torneo de justas bajo nuestro patrocinio atrae a los mejores caballeros de la tierra. Los terrenos proporcionan una valiosa instalación de entrenamiento fuera de temporada.\N-Este nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado."
 building_type_inquisition_james_01:0 "Hospicio de los Caballeros de Santiago"
 building_type_inquisition_james_01_desc:1 "#Facilitar la seguridad y la hospitalidad a los peregrinos fue nuestro principal propósito y sigue siendo nuestra especialidad."
 building_inquisition_james_01:0 "Pensión para peregrinos"
 building_inquisition_james_01_desc:1 "Un establecimiento modesto, pero que, sin embargo, es bienvenido para un peregrino cansado. O a un cansado soldado de Dios en tiempos más calamitosos".
 building_inquisition_james_02:0 "Posada del peregrino"
 building_inquisition_james_02_desc:1 "Un lugar animado, espacioso y cálido con infraestructura suficiente para atender las necesidades de los viajeros, sea cual sea su propósito. \N - Este nivel requiere más de 5 de desarrollo para construir y permanecer habilitado."
 building_inquisition_james_03:0 "Hospicio de peregrinos"
 building_inquisition_james_03_desc:1 "Un bullicioso complejo de edificios que sirve de versátil nexo logístico a los impulsados por la fe.\NEste nivel requiere más de 10 de desarrollo para construir y permanecer habilitado."
 building_type_inquisition_john_01:0 "Hermanas de la Caridad de San Juan"
 building_type_inquisition_john_01_desc:1 "#Servimos a los pobres, a los enfermos y a los que sufren sin esperar recompensas terrenales, y sin embargo los frutos de nuestro esfuerzo nos recompensan."
 building_inquisition_john_01:0 "Comedor social"
 building_inquisition_john_01_desc:1 "Una humilde, pero muy apreciada iniciativa para proporcionar alimentos a los necesitados."
 building_inquisition_john_02:0 "Hospital móvil"
 building_inquisition_john_02_desc:1 "Una caravana de carros y carretas que contiene todo lo necesario para proporcionar cuidados en lugares remotos.\NEste nivel requiere más de 5 de desarrollo para construir y mantenerse habilitado."
 building_inquisition_john_03:0 "Asilo"
 building_inquisition_john_03_desc:1 "Un lugar seguro y generoso para los desafortunados del reino. Una pequeña semblanza de la gracia celestial de Dios aquí en la tierra.\N-Este nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado."
 building_type_inquisition_red_01:0 "Biblioteca de la Orden Roja"
 building_type_inquisition_red_01_desc:1 "#F Un lugar donde las palabras de Dios, las palabras de los hombres y las palabras en lenguas más impías se hacen útiles para nuestra causa sagrada.#"
 building_inquisition_red_01:0 "Biblioteca de las catacumbas"
 building_inquisition_red_01_desc:1 "Una cripta subterránea que alberga no sólo los restos mortales de los frailes, sino nuestros tomos más preciados."
 building_inquisition_red_02:0 "Biblioteca monástica"
 building_inquisition_red_02_desc:1 "Una sección de un monasterio local dedicada a nuestras delicadas investigaciones. Inaccesible para los no iniciados.\NEste nivel requiere más de 5 de desarrollo para construir y mantenerse habilitado."
 building_inquisition_red_03:0 "Biblioteca prohibida"
 building_inquisition_red_03_desc:1 "Un bloque de la ciudad repleto hasta los topes de manuscritos y grimorios demasiado peligrosos para permanecer fuera de nuestra exclusiva custodia.\NEste nivel requiere más de 10 de desarrollo para construirlo y permanecer habilitado."
 building_type_inquisition_murnau_01:0 "Mansión de la Casa de Murnau"
 building_type_inquisition_murnau_01_desc:1 "#F Aquellos von Murnaus que se consagraron a su santa causa se preocupan poco por las comodidades tempranas, pero cultivar su aparente nobleza juega un papel crucial en la lucha."
 building_inquisition_murnau_01:0 "Casa de los Von Murnau"
 building_inquisition_murnau_01_desc:1 "Una residencia urbana que no es propia del apellido von Murnau, pero que, no obstante, es un útil puesto de avanzada de nuestra influencia."
 building_inquisition_murnau_02:0 "Mansión Von Murnau"
 building_inquisition_murnau_02_desc:1 "Una lujosa morada para los miembros de la familia igual de adecuada para los hombres locales invitados de importancia.\NEste nivel requiere más de 5 de desarrollo para construir y permanecer habilitado."
 building_inquisition_murnau_03:0 "Palacio de la ciudad de Von Murnau"
 building_inquisition_murnau_03_desc:1 "Una majestuosa maravilla de la arquitectura que ejemplifica el esplendor de la dinastía.\NEste nivel requiere más de 10 de desarrollo para construir y permanecer habilitado."
 building_type_inquisition_oculi_01:0 "Celda Oculi Dei"
 building_type_inquisition_oculi_01_desc:1 "#F Los ojos hablan, pero rara vez se escuchan. Llevar nuestros asuntos en reclusión asegura esto. #F"
 building_inquisition_oculi_01:0 "Casa de seguridad"
 building_inquisition_oculi_01_desc:1 "Una cámara en una fila de cámaras idénticas sin aparentemente nada especial."
 building_inquisition_oculi_02:0 "Complejo de bodegas"
 building_inquisition_oculi_02_desc:1 "Un amplio centro subterráneo de bodegas conectadas con cada entrada a salvo bajo nuestro control.\NEste nivel requiere más de 5 de desarrollo para construirse y mantenerse habilitado."
 building_inquisition_oculi_03:0 "Red de túneles"
 building_inquisition_oculi_03_desc:1 "Una intrincada red de sótanos, mazmorras, alcantarillas y cuevas interconectadas. Permite cruzar grandes distancias sin ser visto.\N-Este nivel requiere más de 10 de desarrollo para construir y mantenerse habilitado."
 building_type_inquisition_cell_01:0 "Célula de la Inquisición"
 building_type_inquisition_cell_01_desc:1 "#F Aquí se reúnen los vencedores del mal inhumano del reino para coordinar operaciones, instruirse unos a otros, depositar donaciones y vigilar la tierra."
 building_inquisition_cell_01:0 "Célula de inquisición en ciernes"
 building_inquisition_cell_01_desc:1 "No esperes más que puertas fortificadas, un cofre con los recursos necesarios y las comodidades más básicas de una célula de cazadores recién establecida. No obstante, sigue siendo una semilla de la que brotará la esperanza".
 building_inquisition_cell_02:0 "Célula de la Inquisición establecida"
 building_inquisition_cell_02_desc:1 "Un refugio seguro y una base de operaciones funcional para los que luchan contra la oscuridad. Un lugar para descansar, curarse y perfeccionar el oficio. \Este nivel requiere más de 5 de desarrollo para construir y permanecer habilitado."
 building_inquisition_cell_03:0 "Centro de la Inquisición"
 building_inquisition_cell_03_desc:1 "Más que un mero puesto de vigilancia, esta bulliciosa sala es donde se preparan y coordinan las mayores operaciones contra los siervos del Infierno.\NEste nivel requiere más de 5 de desarrollo para construir y permanecer habilitado."
 building_type_inquisition_forsaken_01:0 "Guerrilleros renegados"
 building_type_inquisition_forsaken_01_desc:1 "#F Los poderes, tanto mortales como afines, son hostiles a nuestra santa causa, sus instrumentos deben funcionar sin ser vistos."
 building_inquisition_forsaken_01:0 "Campo de refugiados"
 building_inquisition_forsaken_01_desc:1 "Los bosques, inhóspitos como son, proporcionan un refugio seguro a los que se desprenden del yugo de sus amos."
 building_inquisition_forsaken_02:0 "Recinto de la guerrilla"
 building_inquisition_forsaken_02_desc:1 "Una instalación militar de tamaño considerable escondida en las profundidades del desierto. Aquellos de nuestros hermanos que desean llevar la lucha al enemigo vienen aquí a entrenar.Este nivel requiere más de 5 de desarrollo para construir y permanecer habilitado."
 building_inquisition_forsaken_03:0 "Bastión Invisible"
 building_inquisition_forsaken_03_desc:1 "Un laberinto de estrechos caminos forestales, plataformas en las copas de los árboles, puentes y túneles salpicados de trampas y puestos de observación. Tan formidable como encubierto. \Este nivel requiere más de 10 de desarrollo para construirlo y mantenerlo habilitado".
 building_type_inquisition_george_01:0 "Sociedad de los pastos de los caballos de guerra de San Jorge"
 building_type_inquisition_george_01_desc:1 "#F Algunas órdenes clericales son conocidas por fabricar cerveza, otras por sus hierbas medicinales, los hermanos de San Jorge crían caballos dignos de su patrón."
 building_inquisition_george_01:0 "Pastos de caballos de guerra"
 building_inquisition_george_01_desc:1 "La parcela de hierba más adecuada de los alrededores para que pasten los mejores caballos ingleses."
 building_inquisition_george_02:0 "Cuadras de caballos de guerra"
 building_inquisition_george_02_desc:1 "Un granero de tamaño considerable con suficientes instalaciones y personal para mantener a los caballos en forma y mimados. \N-Este nivel requiere más de 5 de desarrollo para construir y mantenerse habilitado."
 building_inquisition_george_03:0 "Casa de subastas de caballos de guerra"
 building_inquisition_george_03_desc:1 "Viajeros de todas partes vienen aquí para ver tus famosos corceles en todo su esplendor y pujar por ellos. \N - Este nivel requiere más de 10 de desarrollo para construir y permanecer habilitado."
 building_type_elysium_01:0 "Camarilla Elysium"
 building_type_elysium_01_desc:1 "#F El punto central de la vida social de la Camarilla, donde el Príncipe celebra su corte. Un lugar libre de violencia pero no de luchas viciosas por el protagonismo. #F"
 building_elysium_01:0 "Elysium ad hoc"
 building_elysium_01_desc:1 "Un lugar elegido por su seguridad y comodidad, no por su ilustración. No impresionará a nadie notable, pero los clientes lo aprecian no obstante".
 building_elysium_02:0 "Elíseo respetable"
 building_elysium_02_desc:1 "Un establecimiento adecuado para que florezca la cultura afín. Las propias paredes del local fomentan el cumplimiento de la etiqueta".
 building_elysium_03:0 "Elíseo prominente"
 building_elysium_03_desc:1 "Un nexo vital en la red de conexiones sociales de Camarilla. El Príncipe que preside tan refinado establecimiento goza de reconocimiento mundial."
 building_type_haven_01:0 "Refugio del Sabbat"
 building_type_haven_01_desc:1 "#F Para las jaurías siempre militantes del Sabbat, este lugar es tanto un hogar familiar como un puesto de avanzada armado."
 building_haven_01:0 "Refugio de la manada"
 building_haven_01_desc:1 "Aunque es lo suficientemente seguro como para celebrar ritos comunales y lanzar operaciones armadas, a este lugar le vendría bien más dignidad e infraestructura."
 building_haven_02:0 "Refugio comunal"
 building_haven_02_desc:1 "Este solemne híbrido de templo, cuartel militar y salón constituye un bloque de construcción en la arquitectura de la Jyhad."
 building_haven_03:0 "Columna de la Mano Negra"
 building_haven_03_desc:1 "Un raro refugio permanente de los guerreros más temidos del Sabbat. Sólo los lugares vitales para los intereses de la secta justifican su temible presencia".
                            
                      
                        
                 
               
                
                 
                
         
       
 
 