l_spanish:
 traditions_government:0 "Tradiciones"
 traditions_government_adjective:0 "Tradiciones"
 traditions_government_realm:0 "Reino cainita"
 traditions_government_vassals_label:1 "Las [obligaciones|E] cainitas se basan en el [contrato_feudal|E] de cada [vasallo|E]"
 traditions_government_desc:1 "La gran mayoría de los reinos de Vampiros siguen las Tradiciones de Caine, un código de conducta algo tosco sobre cómo comportarse con los mortales y otros afines."
 free_state_government:0 "Estado libre"
 free_state_government_adjective:0 "Libre"
 free_state_government_realm:0 "Estado libre"
 free_state_government_vassals_label:1 "Las [obligaciones|E] de los vasallos se basan en la opinión de cada [vasallo|E] sobre el líder del reino."
 free_state_government_desc:1 "Al no aceptar las leyes de Caine, los Estados Libres son una alianza poco firme de cainitas de mentalidad similar que se reúnen en torno a un gobernante carismático."
 inquisition_government:0 "Orden de la Inquisición"
 inquisition_government_adjective:0 "Inquisición"
 inquisition_government_realm:0 "Orden de la Inquisición"
 inquisition_government_vassals_label:1 "Las obligaciones de los inquisidores se basan en su opinión."
 inquisition_government_desc:1 "Una célula de inquisidores que destruye la influencia sobrenatural allí donde la encuentra."

 legacy_rights:0 "La primera tradición: El Pacto"
 legacy_rights_none:0 "Religiosamente desprotegido"
 legacy_rights_none_short:0 "Forzado"
 legacy_rights_none_desc:2 "“Tu sangre te hace mi cría, hecha a mi imagen. Mi maldición es tuya, y mi salvación es tuya. Me sitúo ante ti y por encima de ti como dios-regente. Yo soy el camino, mis Tradiciones mi pacto. Renuncia a mí y renuncia a toda esperanza". Así habló Caine.\n\nEl [liege|E] puede [demand_conversion|E] del [vassal|E]\nEl [liege|E] puede [convert_county|E] en las tierras de  los [vassals|E]' ."
 legacy_rights_protected:0 "Protegido religiosamente"
 legacy_rights_protected_desc:2 "“Thy blood makes thee my brood, crafted in my image. My curse is thine, and my salvation is thine. I stand before and above thee as god-regent. I am the way, my Traditions my covenant. Renounce me and Renounce all hope.” Thus spoke Caine.\n\n#emphasis #bold [vassal|E] Privileges:#!#!\nThe [liege|E] can not [demand_conversion|E] of the [vassal|E]\nThe [liege|E] can not use [convert_county|E] in the [vassals|E]' lands\n\n#flavor The [vassal|E] is granted a special protected status, with the realm officially recognizing their right to practice their own [faith|E].#!"
 legacy_rights_protected_short:0 "No aplicado"

 destruction_rights:0 "La quinta tradición: La Destrucción"
 destruction_rights_none:0 "Sin derechos de destrucción"
 destruction_rights_none_desc:0 "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#flavor The [vassal] is not allowed to destroy kinded in their domain. Only the [liege] may call a Blood Hunt."
 destruction_rights_none_short:0 "Nada"
 destruction_rights_allowed:0 "Destrucción permitida"
 destruction_rights_allowed_desc:0 "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#emphasis #bold The [liege] allows the [vassal] to enforce the Lextalionis and call a blood hunt in the [vassal]'s domain.#!"
 destruction_rights_allowed_short:0 "Permite"
 destruction_rights_open_war:0 "Guerra abierta"
 destruction_rights_open_war_desc:0 "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#emphasis #bold [vassal|E] Privileges:#!#!\nThe [vassal|E] can declare [war|E] regardless of the [lieges|E] [crown_authority|E]\nThe [vassal|E] pays #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! less for [casus_bellis|E] within the [realm|E]\n\n#flavor The [vassal] does not have to spend a [hook] if their [lieges] [crown_authority] prevents them from waging war. This special treatment also makes it easier for the [vassal] to declare wars inside the [realm|E], reducing the cost by #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
 destruction_rights_open_war_short:0 "Lib.Guerra"
 
 progeny_rights:0 "La tercera tradición: La Progenie"
 progeny_rights_none:0 "Sin derechos de progenie"
 progeny_rights_none_short:0 "Ninguno"
 progeny_rights_none_desc:0 "“Thou shalt only sire another with the permission and blessing of thine elder. To create is the providence of those closest to me, for they shall be accountable. Break this, and both thee and thy progeny shall be slain.” Thus spoke Caine.\n\n#The [vassal] has no rights to create progeny by their [liege]. Even the creation of ghouls is forbidden.#!"
 progeny_rights_granted:0 "Derechos de progenie completos"
 progeny_rights_granted_short:0 "Cualquiera"
 progeny_rights_granted_desc:0 "“Thou shalt only sire another with the permission and blessing of thine elder. To create is the providence of those closest to me, for they shall be accountable. Break this, and both thee and thy progeny shall be slain.” Thus spoke Caine.\n\n# The [vassal] has full rights to create progeny by their [liege]. This includes both vampiric childre and ghouls.#!"
 progeny_rights_ghouls:0 "Derechos de creación de ghouls"
 progeny_rights_ghouls_short:0 "Ghouls"
 progeny_rights_ghouls_desc:0 "“Thou shalt only sire another with the permission and blessing of thine elder. To create is the providence of those closest to me, for they shall be accountable. Break this, and both thee and thy progeny shall be slain.” Thus spoke Caine.\n\n# The [vassal] has been granted by their [liege] the rights to create ghouls, but not vampiric childer.#!"
 progeny_rights_childer:0 "Derechos de la progenie vampírica"
 progeny_rights_childer_short:0 "vampírica"
 progeny_rights_childer_desc:0 "“Thou shalt only sire another with the permission and blessing of thine elder. To create is the providence of those closest to me, for they shall be accountable. Break this, and both thee and thy progeny shall be slain.” Thus spoke Caine"\n\n# The [vassal] has been granted by their [liege] the rights to vampiric childer, but not ghouls.#!"

 blood_oaths:0 "La cuarta tradición: La Contabilidad"
 blood_oaths_none:0 "No se requieren juramentos de sangre"
 blood_oaths_none_short:0 "Libre"
 blood_oaths_none_desc:0 "“Those thou create are thine own blood until release from thy charge. Until that moment, their sins, their blood and their punishments are thine.” Thus spoke Caine.\n\n# The [vassal] is not required to swear a blood oath to their [liege].#!"
 blood_oaths_required:0 "Se requieren juramentos de sangre"
 blood_oaths_required_short:0 "Juramentos"
 blood_oaths_required_desc:0 "“Those thou create are thine own blood until release from thy charge. Until that moment, their sins, their blood and their punishments are thine.” Thus spoke Caine.\n\n# The [vassal] must swear a blood oath to their [liege] and consume a draught of their [liege]'s blood. This is a minor blood bond and a weak hook.#!"
 
 domain_revocation_rights:0 "La segunda tradición: El dominio"
 domain_revocation_rights_default:0 "Revocación del dominio"
 domain_revocation_rights_default_short:0 "A discreccion"
 domain_revocation_rights_default_desc:0 "The [liege] may revoke a domain provided the crown laws allow it." 
 domain_revocation_rights_protected:0 "Protegido"
 domain_revocation_rights_protected_desc:0 "“As I am master of Nod, thy domain is thine own concern. Thou art its master, and all will respect this or suffer thy wrath. All will present themselves when entering, and thou shall protect them in turn. By right, thou art allowed to hunt within the bounds of thy domain, its blood thine own. Accept its responsibility, minister thy domain, and pay others the same respect thou expect.” Thus spoke Caine.\n\n[vassal|E] Privilege:#!#!\nThe [liege|E] cannot revoke the [vassals_possessive|E] [titles|E]\n\n#flavor The [vassal] is guaranteed ownership of their [titles], preventing the [liege|E] from revoking them – regardless of the [liege|E] having a [revoke_title_reason] or not.#!"
 domain_revocation_rights_protected_short:0 "Protegido"
 
 masquerade_protocol:0 "La sexta tradición: La Mascarada"
 masquerade_protocol_none:0 "No Masquerade"
 masquerade_protocol_none_desc:0 "#flavor The [liege] does not enforce the Silence of Blood in the [vassal]'s domain."
 masquerade_protocol_none_short:0 "Nada"
 masquerade_protocol_lax:0 "Mascarada laxa"
 masquerade_protocol_lax_desc:0 "“Never shalt thou reveal thy true nature to those not of the blood. Doing so shall renounce thy claims to my covenants.” Thus spoke Caine.\n\n#emphasis #bold The [liege] only enforces the extreme violations of Silence of Blood in the [vassal]'s domain.#!"
 masquerade_protocol_lax_short:0 "Laxa"
 masquerade_protocol_strict:0 "Mascarada estricta"
 masquerade_protocol_strict_desc:0 "“Never shalt thou reveal thy true nature to those not of the blood. Doing so shall renounce thy claims to my covenants.” Thus spoke Caine.\n\n#emphasis #bold The [liege] enforces a strict interpretation of Silence of Blood in the [vassal]'s domain.#!"
 masquerade_protocol_strict_short:0 "S.Estricto" 
 
 blood_tithe:0 "Diezmo de sangre"
 blood_tithe_none:0 "No hay Diezmo"
 blood_tithe_none_short:0 "Nada"
 blood_tithe_none_desc:0 "# The [vassal] owes no blood tithe to their [liege].#!]"
 blood_tithe_required:0 "Diezmo de sangre Kine"
 blood_tithe_required_short:0 "Rebaño" 
 blood_tithe_required_desc:0 "# On demand, the [vassal] must supply one of the kine to the court of their [liege]. Typically, this means the death of the mortal.#!" 
 blood_tithe_vampiric:0 "Diezmo de sangre del vasallo"
 blood_tithe_vampiric_short:0 "Su sangre"
 blood_tithe_vampiric_desc:0 "# On demand, the [vassal] must provide their own vampiric blood to their [liege]. This will increase the hunger of donor.#!"
 blood_tithe_childer:0 "Diezmo de sangre vampírica"
 blood_tithe_childer_short:0 "Un hijo"
 blood_tithe_childer_desc:0 "# On demand, the [vassal] must provide one of their childer to their [liege]. This often leads to the destruction of the childe.#!"

 primogen_rights:0 "Derechos de los primogénitos"
 primogen_rights_none:0 "Sin asiento en el Consejo de Primogénicos"
 primogen_rights_none_desc:0 "#flavor The [vassal] is not granted any out-of-the-ordinary privileges when it comes to the Primogen [council]."
 primogen_rights_none_short:0 "Nada"
 primogen_rights_guaranteed:0 "Asiento en el Consejo Primógeno"
 primogen_rights_guaranteed_desc:0 "#emphasis #bold [vassal|E] Privilege:#!#!\nThe #high $force_onto_council$#! [interaction|E] can be used at will\n\n#flavor The [vassal] is granted special Primogen [council] privileges, and will expect a permanent seat on the Primogen [council]. Granting this privilege to too many [vassals] will eventually upset the [powerful_vassals] of the [realm|E].#!"
 primogen_rights_guaranteed_short:0 "Garantizado"
 

