l_spanish:
 podintroductions.1.t:0 Rosas negras"
 podintroductions.1.desc:0 Como mortal Francia se tambalea bajo el caos interno de la cruzada albigense, Francia vampíricos tarifas no es mejor. Alexander, un Ventrue cuarta generación, era principal de París y Francia hasta hace menos de dos años. Fue derrocado por un golpe de estado dirigido por los Toreador Salianna, y su propio chiquillo, Geoffrey du Temple. La reina Toreador tiene el control asumido del país y trata de consolidar su posición, frente a la oposición de sus propios clansmates, las otras reinas de Francia. Por otra parte, Geoffrey ha tomado París como su premio, pero podría, con el tiempo, hizo una oferta por la corona que es suyo por derecho de sangre. Al sur, Esclarmonda de Toulouse está utilizando el levantamiento de los cátaros para su propio propósito, pero podría enfrentarse a la furia del norte de Francia lo suficientemente pronto. ¿Los hallazgos país un nuevo y mejor, regla que Alexander de esta prueba? O va a ser barrida en el caos y la destrucción?"
 podintroductions.1.a:0 Francia le iría mejor bajo mi regla ..."
 podintroductions.2.t:0 El aburrido Dios-Rey de Inglaterra"
 podintroductions.2.desc:0 la historia vampírica de Britannia está estrechamente ligada a los Mitra Ventrue. Persa, que romano, dios, esta cuarta generación tenía casi la totalidad de Europa tras su culto antes del cristianismo lo llevó a cabo. Retirándose con sus fanáticos en la tierra de los británicos, recogió rápidamente la energía ... y se aburrió de la pequeñez del lugar. A falta de regularidad en letargo, la invasión normanda destruyó su sede del poder y lo obligó a despertado para restaurar el orden. 150 años más tarde, Mitra no le importa nada Inglaterra otra vez, y muchos de sus temas, como Hugo de Cornwall o Robin Leeland, han obtenido una independencia de facto y trazar su fallecimiento. Peor aún, Gales y Escocia se han sabido conservar las células antiguas de Druídico y nórdica Vástagos. Nadie puede decir realmente si Mitra, una vez más aplastar esta nueva oposición o simplemente dejar que fester debajo de la nariz hasta que es demasiado tarde."
 podintroductions.2.a:0 ¡Llegó el Dios-Rey ... por ahora."
 podintroductions.3.t:0 Tierra de los Reyes y los brujos"
 podintroductions.3.desc:0 El corazón indiscutible del clan Ventrue, Alemania está firmemente en manos de Hardestadt. Aún así, incluso su regla no es indiscutido, por pretendientes como Julia Antasia de Alemania Occidental o el escurridizo Ilse Reinegger de Baviera. Al sur, los usurpadores del clan Tremere tienen una posición precaria, con los Tzimisce vicioso de la Europa del Este cierre rápido en sus fortalezas. Su acuerdo defensivo con el poderoso Ventrue es quizás su única opción de vida. Muy cerca se encuentra Alejandro de París, el príncipe exiliado de Francia, un poderoso vampiro por su propio derecho, pero solo políticamente. Hardestadt debe actuar rápidamente, sofocar las ambiciones de su Jurgen chiquillo, destruyendo Julia y Ilse bases de poder y asegurar su frente oriental, con o sin la ayuda de los Tremere. Alemania será la joya de la corona del clan Ventrue, o quemarse en el intento."
 podintroductions.3.a:0 Roma es un recuerdo que se desvanece, el futuro está aquí."
 podintroductions.4.t:0 sombra Reconquista"
 podintroductions.4.desc:0 Iberia es el centro tradicional del poder del clan Lasombra pero la Reconquista mortal se ha hundido del Magister en una cruenta guerra civil. Al norte, Sylvester de Ruiz conduce el funcionario, Christian, clan Lasombra y tiene la clara ambición de gobernar todos Iberia. Se debe tomar nota de sus ambiciosos vasallos sin embargo, al igual que la de Ambrosio Luis Moncada o Lucita de Aragón. Hacia el sur, después de décadas de luchas internas, los Lasombra musulmanes -que se llaman Ashirra- hallarse en Badr de Andalucía un sultán digna y probada. En otros lugares, nuevos y antiguos príncipes, desde regia Ventrue a feral Gangrel, tomar nota de la debilidad de las Magister y esperar el momento adecuado para atacar. Este Reconquista podría ser el último suspiro de la dominación Lasombra de Iberia."
 podintroductions.4.a:0 Iberia será de nuevo todo, sólo dame tiempo."
 podintroductions.5.t:0 Ragnarok"
 podintroductions.5.desc:0 Atrás quedaron las mentes de los mortales, todavía existe la fe nórdica de Vampiros de Escandinavia. Sus defensores, la feroz Einherjar, se aferran a sus creencias ... pero la esperanza se está desvaneciendo rápidamente. El All-alta Werter y el líder de la valquirias, Ulfsdottir, se han retirado en la depresión y cerca de letargo. Algunos continúan la lucha aunque, como Brunhilde y Valbjorg ‘Crooked-Eye’, tratando de destruir a los invasores cristianos vampiros, dirigida por Hardestadt’GET. Un rayo de optimismo para el Einherjar es que los recién llegados son apenas un puñado de Estados, pelearse entre ellos, sobre todo en Dinamarca, que se divide entre tres pretendientes. En los baldíos del norte, una banda de furores insensibles que se hacen llamar la barra de siniestro han apostado una reclamación dudosa en la tierra estéril. Ya sean nuevos aliados o enemigos, la última batalla de los nórdicos se acerca, y la Cruz parece como el claro favorito una vez más ..."
 podintroductions.5.a:0 Escandinavia nunca será la misma."
 podintroductions.6.t:0 Réquiem por un Imperio"
 podintroductions.6.desc:0 Si mortal Italia medieval es un estado dividido, a continuación, Italia por la noche es un barril de pólvora. Potentes viejos vampiros lucha por las ciudades más pobladas de Europa. Al norte, Ventrue ‘cardenal’ asientos Fabricio Ulfila en Milán, un buen conocimiento sobre la Iglesia italiana a su disposición. En Venecia, los vástagos de Giovanni clan de Capadocia son dueños de un imperio comercial Spanning mar, el tiempo dirá si su atención se centra en Italia adecuada o en el Este, al igual que su clan principal. En Sicilia, la capital del clan Lasombra es vigilado por los fieles Montano, pero sobre extensión y la guerra civil en España han dejado el Mar de las Sombras vulnerables. Por último, todos los ojos están puestos en Roma, donde Tito Venturus Camille ha despertado recientemente. El cónsul Eterna fue el cerebro detrás del imperio de Roma y la destrucción de Cartago y podría marcar el comienzo de una nueva era para el liderazgo Ventrue. Como otros líderes insignificantes e inmortales reyes se levantan en otras partes de Italia, la Guerra de los Príncipes nunca ha sido más peligroso que aquí."
 podintroductions.6.a:0 Todos los caminos conducen a Roma."
 podintroductions.7.t:0 Contra la pared"
 podintroductions.7.desc:0 Los estados cruzados de pie precariamente en el Levante, y un estado del vampiro aún más precaria se ha incrementado en medio de ellos. La dieta de los Olivos es un pacto entre los principales de varias ciudades de la zona, encabezados por un sobreviviente, Qawiyya el-Ghaduba. La “Leona” es un Salubri, un clan casi extinguida en Europa Occidental desde la muerte de su fundador, Saulot, a manos del clan Tremere recién resucitado. La mayoría de los miembros del clan debilitada se han escondido, pero Qawiyya tiene la intención de hacer un soporte. Su alianza precaria ya está en peligro, sin embargo, tan poderoso Damasco está cayendo en un pozo literal de la locura. Darshuf, el viejo Toreador Sultan ha vendido su alma a las fuerzas incalculables, y sólo su chiquillo y un guerrero Assamita solitaria de pie en el camino de una catástrofe. ¿La dieta de ser el último grito de un clan morir o la esperanza de un futuro mejor?"
 podintroductions.7.a:0 Jerusalén es la ciudad de los milagros, después de todo ..."
 podintroductions.8.t:0 Detrás del velo"
 podintroductions.8.desc:0 Arabia es la sede del movimiento Ashirra, vampiros musulmanes unidos más allá de clanes por su fe común. Su posición en la península es fuerte, pero la pérdida de Jerusalén a los cruzados y de Egipto a las serpientes les ha cortado de su magrebí y hermanos andaluces. Lo que es peor, Mesopotamia ha caído a los infernalistas Baali, una vez más, de plomo por Azanael de la rama Nergalite. Su objetivo es tomar las grandes ciudades de la región, Damasco, Bagdad y Tyr, tener la población que requiere sacrificar el regreso de su amo profano. Irónicamente, su oponente más fuerte es Tanit de Tyr, otro Baali, éste de la rama Molochim. Esta rivalidad ha sumido al resurgimiento Baali en una guerra civil y da esperanza a los fieles musulmanes que puedan ser detenidos. Si no ... entonces, el mundo entero podría estar en juego."
 podintroductions.8.a:0 La cuna de la civilización podría ser su lecho de muerte también."
 podintroductions.9.t:0 Capa y Cimitarra"
 podintroductions.9.desc:0 Persia es el asiento del clan Assamita, un misterioso grupo de extraños. Gobernado por el recién coronado y muy controvertida Mayor, Nakurtum, su fachada de unidad está mostrando grietas como diversas facciones hacen sus juegos de poder. Thetmes de la web de cuchillos quiere clan para convertirse en un culto fanático de asesinos preparados para servir como un ejército para el regreso de su amo negro. Al Ashrad de los Hechiceros está caminando un camino de la moderación, la visualización de los Assamitas como jueces y diplomáticos. Por último, Jamal de los guerreros es un musulmán devoto, y daría la bienvenida a un acercamiento con el Ashirra califal de Medina. Esta agitación política ha contribuido al crecimiento de otro grupo en la región, la tribu perdida de Dastur Anosh, un hereje veneración de la segunda generación de vampiros. Paralizado por las divisiones y la ineficiencia, será el clan Assamita encontrar un nuevo propósito o implosiona común en una guerra civil?"
 podintroductions.9.a:0 Voy a unir a Persia, por la diplomacia o de lo contrario."
 podintroductions.11.t:0 La Guerra Eterna"
 podintroductions.11.desc:0 Desde los albores del tiempo, India ha sido el teatro de una guerra entre el clan Ravnos y la asuratizayya o Wan Kuei, un misterioso grupo de asiáticos 'vampiros'. No ha habido vencedores y ambos combatientes se encuentran en su punto de ruptura, con diversas facciones conspiración para derrocar al actual liderazgo. En Occidente, se Chandraputra Marshaling los Ravnos para una batalla más. Mientras que en el Este, Dyanang lleva los dragones hacia otro cargo. Otras potencias, desde el daéná a Kartarirya de los Tzimisce, miran con avidez oportunidades en la tormenta constante. Hará un ganador finalmente emerge?"
 podintroductions.11.a:0 Estoy, obviamente, la única esperanza para la paz en la India."
 podintroductions.12.t:0 sigue cayendo"
 podintroductions.12.desc:0 A pesar de que ha sido hace siglos quemados, la pérdida de Cartago todavía se siente en el Magreb. La zona ha sido desde entonces tallada entre varios sultanes Ashirra -Muslim Vampires-, pero ninguno de ellos realmente ha logrado consolidar la región. Los dos mejores a punto de hacerlo son Sofonisba, el viejo líder de Túnez, que todavía recuerda la pérdida de su ciudad junto a Cartago, y Zamra Matoub de Argel, un Lasombra joven y ambicioso. Los Setitas tienen también un punto de apoyo aquí, al igual que el clan Tremere. Con este mosaico o poderes divididos, y rica historia, el Magreb es un premio tentador para cualquier aventura o príncipe Sultan."
 podintroductions.12.a:0 Tenemos que pasar de Cartago."
 podintroductions.13.t:0 En la sombra de la pirámide"
 podintroductions.13.desc:0 Egipto ha sufrido muchos conquistadores extranjeros, y su no-muertos nativa son nada si no es paciente y resistente. El verdadero poder radica en Gizeh, con el corazón del Setita clan. El clan de la libertad corrupción -o dependiendo de a quién le ASK prepara sus fuerzas para el beneficio del vacío de poder creado por las cruzadas. Su primer objetivo será sin duda Cairo. Dirigido por la quinta generación poderosa Ventrue Antonius, la ciudad no caerá fácilmente y aunque podría frustrar las serpientes si se declaró la guerra abierta. Todo el mundo está seguro de que los seguidores de Set harán su primer movimiento pronto, pero nadie puede decir cuándo, y si, serán detenidos cuando lo hacen ..."
 podintroductions.13.a:0 Egipto es tan inmortal como nosotros."
 podintroductions.14.t:0 Tierra de la dualidad"
 podintroductions.14.desc:0 Vampiros nativas de África son el Laibon, una asociación libre de múltiples líneas de sangre y chupadores de sangre auto creado. Llevan a cabo la mayor parte del verdadero poder en el continente, pero deben enfrentarse a los muchos aventureros o pequeños señores de la guerra en busca de fama y fortuna en sus tierras. Lo que es peor, África es también el hogar de algunas criaturas realmente antiguas, todavía existe desde el momento en el que fue la cuna de la humanidad. Con varios nuevos caminos apertura con los musulmanes, y Ashirra, mundo, queda por ver si el Laibon será capaz de adaptarse y prosperar en los nuevos tiempos."
 podintroductions.14.a:0 Oportunidades y peligros en abundancia."
 podintroductions.15.t:0 En los cielos"
 podintroductions.15.desc:0 Para los extranjeros, el Tíbet es el hogar de muy extraños vampiros ... si pueden ser llamados Vampiros en absoluto! Los llamados exiliados blancos forman parte de la Wan Kuei, los fantasmas hambrientos de China, y están firmemente establecidos en el este. En el oeste, sin embargo, las cosas aún más extrañas habitan desde demonio adorar abominaciones a los seguidores iluminados de un dios egipcio muerto. Lejos de cualquier verdadero centro de poder no-muertos, el Tíbet es en gran medida un espectáculo secundario para la mayoría de los Vampiros. Pero misterios pueden contener recompensas para aquellos que buscan lo suficientemente profundo ..."
 podintroductions.15.a:0 Tíbet es en gran medida su propio mundo."
 podintroductions.16.t:0 Trueno desde el Este"
 podintroductions.16.desc:0 Las estepas no son una tierra de vampiros. Pocas ciudades que ocultar, algunas naciones para manipular y doblar a su voluntad. Pero, desde el este llega una nueva raza de vampiros, uno que está en casa en las llanuras sin fin y con las personas nómadas mongoles. Estos Anda, una rama Gangrel, son guerreros orgullosos y seguir la masiva expansión de imperio mongol con sus conquistas. Conflicto con la ya presente Gangrel del oeste parece inevitable y, aún más, las tensiones con los cainitas Europea son de esperar cuando llegan estos recién llegados. El cambio es una cosa rara de conseguir con vampiros, pero cuando se trata con una horda estruendosa de arqueros a caballo, el cambio podría ser la última cosa que muchos de ellos la experiencia ..."
 podintroductions.16.a:0 El cambio no es siempre bienvenido ..."
 podintroductions.17.t:0 Los que entran aquí ..."
 podintroductions.17.desc:0 Europa del Este es el tradicional de la tierra del clan Tzimisce, pero su hegemonía ha sido recientemente cuestionada por la subida de los Tremere, respaldado por alemán y húngaro Ventrue. Un reciente guerra ha terminado con un tratado de paz amarga entre Vladimir Rustovitch, voivoda de voivodas, y Jurgen von Verden, cruzado Ventrue. Un estado de amortiguamiento, la Orden Obertus, se ha establecido, encabezado por el corredor de paz Myka Vykos. Ahora, todo el mundo se lame sus heridas, Rustovitch tratando de asegurar su control del clan y los Ventrue húngaro resolver una crisis de sucesión con el sopor de su líder, Bulscu. Por último, Etrius está llevando a los usurpadores en lugar de Tremere, que muestra la fachada de una pirámide unificada contra los demonios. Todo el mundo sabe que la guerra es inevitable en esta región hasta que un vampiro se encuentra lo suficientemente potente como para aplastar a sus rivales una vez por todas. ¿Quien será?"
 podintroductions.17.a:0 Una tierra para ser domesticado."
 podintroductions.18.t:0 Fading sueño"
 podintroductions.18.desc:0 Las cenizas de Constantinopla aún están calientes y, sin embargo, buitres ya están dando vueltas sobre su cadáver. de Michael sueño, una utopía vampírica nunca se había visto desde Cartago, ha caído con su creador, y una serie de señores de la guerra y los restos del Imperio roto están tratando de sobrevivir. El más importante de ellos es Alfonzo, uno de los instigadores de la cuarta Cruzada, ahora la celebración de Constantinopla. El ambicioso Lasombra todavía arco a los líderes de los clanes en Sicilia, pero por cuánto tiempo? Más hacia el oeste, Natalya Sviatoslav de los Brujah es uno de los últimos verdaderos creyentes del sueño aún activas, con la esperanza de reclamar el manto de la ‘Arcángel’ Michael por sí misma. Ana Comneno no tiene tales ambiciones, usando Nikaea para obtener finalmente el Imperio que debería haber sido suya, incluso durante sus días de respiración. Como muchos otros aspirantes a príncipes dominios de construcción en las cenizas de lo viejo, Constantinopla podría renacer de nuevo ... o muerto para siempre."
 podintroductions.18.a:0 Michael ha previsto este caos?"
 podintroductions.19.t:0 Abuela, abuela ..."
 podintroductions.19.desc:0 En lo que se tiene memoria, Rusia es el hogar de uno de los más poderosos parientes en la existencia, Baba Yaga. Esta cuarta generación de Nosferatu, se rumorea que es el verdadero progenitor del clan, es una parte muy importante de la tierra, y lo utiliza para defenderse de su padre vengativo. Por suerte para todos en la zona, la bruja está en letargo. Pero la influencia de su cortina de sombra todavía se deja sentir, alimentado por su segundo al mando leal, Viktor. Con tales condiciones, sólo hay tres tipos de vampiros en Rusia: los vasallos de la abuela, el valiente y el que pronto estarán muertos. Las dos últimas categorías muchas veces se superponen unos a otros ..."
 podintroductions.19.a:0 Cuidado con las niñas ..."
 podintroductions.20.t:0 Nuevo destino para el viejo Land"
 podintroductions.20.desc:0 Tradicionalmente una frontera de la casa Tzimisce voivodato a los demonios más ... excéntricos, Polonia está entrando en su propia, separada, entidad. La autoridad desmoronamiento de la Voivodas y su anacronismo absoluta, ha permitido una nueva generación de vampiros a afianzarse y prosperar. La primera de ellas es Yitzhak ben Avraham, una devota Brujah, reuniendo seguidores en Cracovia para expulsar el príncipe pasada, Razkoljna. Este podría ser el primer paso hacia una Polonia libre de la influencia de los Tzimisce. Pero mayores retos esperan, más notablemente expulsar la abominación absoluta que es Hedeon Yaroslavich, un Tzimisce incluso considerada extrema por sus propios compañeros ..."
 podintroductions.20.a:0 Tengo que prestar atención a este viento de cambio o ser aplastado por ella."
 podintroductions.21.t:0 Tierra de los libres"
 podintroductions.21.desc:0 Lejos de las garras de trituración de los tiranos de Europa Occidental, la zona del Báltico es el hogar de dos construcciones políticas de un nuevo tipo de vampiros. En Lituania, Qarakh de los Gangrel ha unificado una amplia banda de paganos espíritu libre en lo que pretende ser el punto de cristianismo, y Ventrue, la expansión hacia el este de detenerse. Más al norte, Karl el azul está liderando un Estado Libre Einherjar, tal vez el último de su especie como Escandinavia está cayendo a los subordinados de Hardestadt. Ambos de estos experimentos son en gran peligro, interna y externa, y en su mayoría se basan en el gran carisma de sus líderes. Incluso su valentía y convicción podrían resultar inútil en contra de la inminente agresión Ventrue ..."
 podintroductions.21.a:0 Los últimos restos de una edad de morir no van a bajar fácilmente."
 podintroductions.2001.t:0 Bienvenido a Princes de la Oscuridad"
 podintroductions.2001.desc:0 Lo primero, gracias por jugar el mod! \n Principes de la Oscuridad es una revisión del juego base, destinada a poner el mundo de la oscuridad de la vida en Crusader Kings 3. Como tal, tiene muchos conceptos de juego alterados, y el uso de la extensa tradición de su mundo para proponer una experiencia diferente todos alrededor."
 podintroductions.2001.a:0 Hablemos de los principales mecanismos vampiro ..."
 podintroductions.2001.b:0 ... u otros conceptos alterados"
 podintroductions.2001.c:0 El mundo y su tradición"
 podintroductions.2001.d:0 Estoy bien, vamos!"
 podintroductions.2001.e:0 Limpie mis rasgos sobrenaturales y vaya al generador de caracteres"
 podintroductions.2003.t:0 vampiros 101"
 podintroductions.2003.desc:0 Lo primero a destacar es que, como un vampiro, que son inmortales ... más o menos. Usted no va a morir de la enfermedad o de edad, pero siendo a la antorcha o decapitado seguirá siendo poner fin a su no-vida. Como tal, la sucesión es menor, pero todavía está presente, la preocupación por ti. En la misma línea, los matrimonios no pueden producir los niños, por lo que son en su mayoría una herramienta política a disposición de un grupo selecto de las religiones. \ nReligions son una parte fundamental de la mecánica de juego, incluso más que en CK3. Constituye, pues, los principios filosóficos centrales de su carácter, que ayuda no caer a la bestia. De hecho, la bestia -una manifestación literal de su monstrosity- interior es uno de sus peores enemigos, y el manejo del estrés es de suma importancia para no caer presa de él, ya que significaría que su personaje se ha convertido en un Wight salvaje, lo que resulta en su abdicación. \ Ntake aviso de su hambre, un modificador del núcleo que representa su necesidad de sangre. El hambre se utiliza para muchos esquemas y poderes, y reponer lentamente o con la caza activa."
 podintroductions.2003.a:0 Algunos conceptos más avanzados"
 podintroductions.2004.t:0 Cómo para no terminar como una antorcha viviente"
 podintroductions.2004.desc:0 Los vampiros son lentos en el aprendizaje de nuevas cosas. Como tal, usted todavía tiene acceso a los estilos de vida de base, pero a un ritmo menor de progresión. En su lugar puede optar por invertir su tiempo en las disciplinas, la apertura de los poderes de los condenados para su uso. \n Los edificios representan su influencia sobre la población mortal. La mayoría están cubiertas por una estadística como el control y usted tendrá que elegir la forma de equilibrar estos. Tenga en cuenta que los grandes centros de población, representados por el alto desarrollo capitales ducado son el activo más importante de cualquier príncipe puede soñar. \n La guerra es sensiblemente alterada, con un mayor énfasis en caballeros. La destreza de sus caballeros puede fácilmente superar a un enemigo mucho más numerosos, sobre todo si en su mayoría compuesta de gravámenes. Como tal, sea muy cuidadoso de alta hostil destreza Vampiros. \n En un mundo lleno de engaños y trucos, la intriga juega un papel más importante. Hay nuevos esquemas para descubrir, algunas vinculadas a sus poderes, y la mayoría de los personajes tienen secretos mejor dejar incalculable ... o el programa usado para el chantaje si su religión lo permite."
 podintroductions.2004.a:0 Volver a lo básico"
 podintroductions.2005.t:0 La historia hasta ahora..."
 podintroductions.2005.desc:0 El mundo de la oscuridad es un universo en funcionamiento durante más de 30 años, con cientos de libros y otros medios de comunicación que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de seres sobrenaturales criaturas interactúan debajo de la superficie, creando un mundo subterráneo lleno de intrigas e historias. \n La Vampiros del WoD son principalmente el resultado de la maldición bíblica contra Caine, el primer asesino y la mayoría se remontan su linaje a él en un sistema que llaman 'generaciones'. Este árbol dinastía de los no-muertos se ha ramificado en varias facciones, los clanes, cada uno con su fuerza, debilidad y zonas de influencia geográfica \n en oscura Edad:. Vampiros, que se reproduce ahora, estamos siguiendo el mundo no-muertos en el cruce de varias crisis importante. El saqueo de Constantinopla ha sucedido, y roto el mayor imperio Cainita del tiempo, tener un efecto dominó en cuanto a Francia y Persia. Mientras tanto, la Iglesia Inquisición es el apoyo y la recolección de información, casi a punto de marcar el comienzo de la edad de la retribución de los chupasangre malditos ..."
