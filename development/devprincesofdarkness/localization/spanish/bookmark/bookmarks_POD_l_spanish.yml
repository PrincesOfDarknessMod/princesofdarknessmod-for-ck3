 bm_867_thelongnight:0 "Mundo de los mortales"
 bm_867_thelongnight_desc:0 "#R Este marcador está pensado para jugar en un mundo en el que la mayoría de los personajes del título aterrizado son mortales, y sólo el 1% son vampiros. Por favor, elige las reglas de juego "Mundo de Tinieblas: Mundo de la Ignorancia" y "Dominio Sobrenatural: Mortales: los Inocentes". Si dejas las reglas del juego establecidas en "Mundo de Tinieblas" y "Vampiro: la Mascarada", obtendrás un mundo de vampiros no canon que son la mayoría de los personajes del título aterrizado. Recomendamos encarecidamente la Guerra de los Príncipes de la marca de 1230 d.C. y no ésta. Aun así, la petición de jugar en un mundo mayoritariamente mundano con muy pocos vampiros es frecuente, así que aquí está. Otros pueden disfrutar de un sandbox de Vampiros más aleatorio jugando a V:tM en 867.\N-El creador de personajes de Mundo de Tinieblas estará disponible en decisiones. Que lo disfrutes".
 bookmark_thelongnight_neklan_premsyl:0 "Neklan Premsyl"
 bookmark_thelongnight_neklan_premsyl_desc:0 "Destinado a un playthrough de Revenant.\NFundador de la familia Revenant de Premsyl, un experimento de Tzimisce en el linaje real de Bohemia. Se sabe que son sirvientes del Matusalén Vukodlak y de su agente Azhra el Invisible.\NPuede que los recuerdes del videojuego Vampiro: la Mascarada -- Redención".
 bookmark_thelongnight_michael:0 "Michael"
 bookmark_thelongnight_michael_desc:0 "Destinado a un playthrough de Vampiro Secreto.\NEl Vampiro Toreador Matusalén se hace pasar por el Emperador Bizantino Miguel III. Arcángel del Sueño Vampírico, intenta expandir su influencia en el mundo mortal con este subterfugio."
 bookmark_thelongnight_rurik_rurikid:0 "Rurik"
 bookmark_thelongnight_rurik_rurikid_desc:0 "Destinado a un playthrough de Hombre Lobo, por ahora un mortal.\NSe rumorea que Rurik ha sido Kinfolk del Get de Fenris, una tribu de hombres lobo.\NLos hombres lobo aún no han sido implementados para Princes of Darkness Mod."
 bookmark_thelongnight_theodosius:0 "Teodosio"
 bookmark_thelongnight_theodosius_desc:0 "Destinado a un playthrough de Inquisidor.\nTeólogo griego, antiguo hereje gnóstico convertido en celoso católico, intelectual ocultista, cazador de vampiros y fundador de la Orden Roja."
 bm_868_constantinoplebynight:0 "Constantinopla de noche"
 bm_868_constantinoplebynight_desc:0 "Miguel, el Patriarca del Sueño en Constantinopla ha estado actuando como el mortal Miguel III. Dracon ha caído en una depresión tras la destrucción de Antonius. Cayo lidera el Ventrue antoniano.  Narses, el Arzobispo de Nod en Venecia, busca expandir la Herejía Cainita tanto en el este bizantino como en las posesiones tradicionales de Lasombra al sur, en Italia y Sicilia.  Odín el Todopoderoso, líder de los Einherjar, está a punto de enfrentarse a una amenaza más temible que la de Fenrir: debe enfrentarse a la amenaza de que los mortales se conviertan al dios clavado.  Mientras tanto, en todo el oeste de Europa, los Ventrue son un clan dividido de estamentos feduales en competencia, el más poderoso de ellos, Alejandro de París. El viejo Prometeo Domingo ve una oportunidad para vengar la caída de Cartago sobre ellos desde su base entre los magiares conquistadores. Sin embargo, una casa de magos está a punto de poner patas arriba la sociedad Kindred usurpando para sí el poder de la sangre de Caine."
 bookmark_constantinoplebynight_michael:0 "Michael"
 bookmark_constantinoplebynight_michael_desc:0 "Patriarca del sueño"
 bookmark_constantinoplebynight_odin:0 "Odín el Alto"
 bookmark_constantinoplebynight_odin_desc:0 "¡Gloria a los Einherjar! Valhalla llamando!"
 bookmark_constantinoplebynight_montano:0 "Montano"
 bookmark_constantinoplebynight_montano_desc:0 "Vemos en las sombras"
 bookmark_constantinoplebynight_narses:0 "Narses"
 bookmark_constantinoplebynight_narses_desc:0 "Martillo de los godos" 
 bookmark_constantinoplebynight_shahiri:0 "Shahi'ri, anciano de la montaña"
 bookmark_constantinoplebynight_shahiri_desc:0 "La muerte no llama a la puerta" 
 bm_1230_warofprinces:0 "Edades oscuras : Vampiro"
 bm_1230_warofprinces_desc:0 "La Guerra de los Príncipes es el periodo de conflicto en la historia cainita que comenzó poco después de la caída de Constantinopla ante la Cuarta Cruzada en 1204. El término se refiere a los conflictos por el territorio que libraron los distintos príncipes de Europa tras el final de la Larga Noche.\NLa Guerra de los Príncipes comenzó poco antes de que se formara la Inquisición. Aunque al principio los Inquisidores fueron utilizados como herramientas por los ancianos, pronto se convirtieron en una amenaza mayor para los Cainitas que los Cainitas para ellos mismos. Aunque no se sabe con exactitud cuándo terminó la Guerra de los Príncipes, es probable que llegara a su fin con el advenimiento de la Revuelta Anarca, si no antes.\N-Sólo tú saldrás victorioso al final de esta Guerra? ¿O la marea de la humanidad arrastrará a tu clan cuando se vuelva contra sus legítimos amos?"
 bookmark_warofprinces_montano:0 "Montano"
 bookmark_warofprinces_montano_desc:0 "El fiel hijo de Lasombra es el amo de su clan, que abarca todo el Mediterráneo. A pesar de tener una posición segura y de ser un individuo poderoso, en el horizonte de Montano se están gestando problemas. La guerra civil en Iberia, el surgimiento de viejos enemigos en Italia y el desenfreno de los miembros más jóvenes del clan son amenazas para la estabilidad del mismo. Constantinopla se ha inclinado recientemente ante él, pero su príncipe, Alfonzo, no es ciertamente de fiar. Lo más sensato podría ser mantenerse centrado en Italia por el momento. Desconfía de vasallos ambiciosos como Claudio Eugenio y el príncipe de Roma, Titus Venturus Camille.\N-¿Serás capaz de asegurar la posición legítima del Clan Lasombra como el clan más influyente de Europa una vez más?"
 bookmark_warofprinces_camilla:0 "Camilla"
 bookmark_warofprinces_camilla_desc:0 "Tito Venturus Camilla mantuvo Roma durante la mayor parte de su gloriosa historia, siendo, posiblemente, el cainita más importante políticamente de la historia. 
 bookmark_warofprinces_qawiya:0 "Qawiyya el-Ghaduba"
 bookmark_warofprinces_qawiya_desc:0 "El clan Salubri yacía destrozado, casi extinguido por los usurpadores de la Casa Tremere. La Leona de Jerusalén, hija del propio Samiel, es su última esperanza, su última oportunidad de sobrevivir ante el ataque de los Magister. Sin embargo, su alianza de príncipes en la zona, la "Dieta de los Olivos", es algo inestable y ya está amenazada por los cercanos Ashirra y Baali. Asegurarse de asegurar su propia base de poder sería un sabio primer movimiento para la campeona Salubri.\N-¿Transformarás una inútil última resistencia en un glorioso renacimiento del Clan Salubri?\N-."
 bookmark_warofprinces_alexander:0 "Alexander"
 bookmark_warofprinces_alexander_desc:0 "Después de más de un milenio como gobernante absoluto de Francia, Alejandro lo perdió todo por una conspiración liderada por su propio hijo, Geoffrey du Temple. Ahora, en el exilio como huésped rechazado de la Cruz Negra, el poderoso Matusalén está tramando su regreso. No tiene casi nada a su nombre, excepto su impresionante poder personal y su legitimidad... que cuenta poco en el gran esquema de las cosas. Es casi un nuevo comienzo para el otrora gran hijo de Ventrue.\N-Será capaz de hacer pagar a Geoffrey y Salianna por su traición y recuperar su legítimo trono... o crear un nuevo legado en estas tierras orientales..."
 bookmark_warofprinces_werter:0 "Werter"
 bookmark_warofprinces_werter_desc:0 "Las viejas costumbres de los nórdicos están muriendo, y con ellas, los Hijos de Odín. Mientras los Ventrue germanos lanzan su asalto final a Escandinavia, la mayoría de los Einherjar se resignan a su destino, la llegada del Ragnarok.\N- Negrita Como el último Todopoderoso de tu pueblo, ¿aceptarás tu destino pacíficamente o harás una última resistencia digna del Valhalla?"
 bookmark_warofprinces_etrius:0 "Etrius"
 bookmark_warofprinces_etrius_desc:0 "El Clan de Vampiros más joven, los magos Tremere están en una situación difícil. El propio Tremere está sumido en el letargo, recuperándose de la diablura de Saulot, y recae en el siempre leal Etrius el enfrentarse al implacable asalto de los Tzimisce. Sin embargo, tienes algunas ventajas, ya que la famosa disciplina del Clan garantiza la unidad y los Ventrue de Alemania y Hungría están de alguna manera de tu lado. Tus enemigos no son conocidos por su paciencia, y deberías buscar oportunidades para sacar provecho de su crisis interna.\N-¿Asegurarás al Clan Tremere como una fuerza poderosa en la política de los Vampiros como decretó Tremere?"
 bookmark_warofprinces_rustovitch:0 "Rustovitch"
 bookmark_warofprinces_rustovitch_desc:0 "El manto de Voivoda de los Voivodas no ha ido a parar al más anciano o poderoso de los Koldun, sino al más ambicioso de los Tzimisce. Vladimir Rustovitch ha tenido un reinado desigual hasta ahora, con una paz blanca contra el cruzado Jurgen von Verden y la humillante resistencia de los odiados Tremere. Como siempre ocurre en la política de Tzimisce, a muchos les gustaría nada más que su caída, en primer lugar su predecesor, Noriz. Pero Rustovitch no es más que un político astuto, si es capaz de conseguir algunas victorias clave, sus rivales podrían "desaparecer" pronto... \N - Negrita ¿Podrá la 'Perdición de los Lobos' liderar a los señores de Tzimisce en disputa contra la amenaza de los Ventrue y los usurpadores Tremere? ""
 bookmark_warofprinces_mithras:0 "Mithras"
 bookmark_warofprinces_mithras_desc:0 "Algunos creen que Mitra es un dios persa y romano literal. Aunque es improbable, esto le ha permitido crear un cuadro fanático de celosos chilenos y cultistas para cumplir su voluntad. Tras huir a Inglaterra después del fracaso de algunas maquinaciones en la Antigua Roma, Mitra se aburrió rápidamente de las mezquinas disputas entre los señores de Inglaterra. Decidiendo que su tiempo estaba mejor invertido en el sueño, dejó el reino en manos de algunos regentes de confianza... que rápidamente dejaron que las cosas se desmoronaran. Tras salir del letargo, Mithras se apresuró a consolidar el poder, arreglando la mayor parte del lío que habían montado sus regentes. Inglaterra está asegurada, pero no totalmente sometida. Tendrá que enfrentarse a los salvajes Gangrel en Gales, a los forajidos rebeldes en Nottingham y a los restos de los Einherjar en Escocia. Después, el vacío de poder en Francia podría ser utilizado con tu trampolín en Burdeos.\N-No hay límites en cuanto a lo lejos que puedes llegar. Contempla la gloria del sol imperecedero".
 bookmark_warofprinces_pustula:0 "Servius Marius Pustula"
 bookmark_warofprinces_pustula_desc:0 "Una vez esclavo en la antigua Roma, tras una pelea entre vampiros, fue abrazado por un Nosferatu. Luego, bajo la tutela de Tanitbaal, canalizó su ira escribiendo poemas satíricos. Cuando su mentor desapareció, Pustula y su compañera Camilla conspiraron contra los enemigos de Tanitbaal y Camilla confió el Camino a Pustula antes de que cayera en el letargo. Pustula abandonó Roma y comenzó a predicar su Camino en el extranjero, ganando muchos nuevos adeptos.\NAhora que Camila ha despertado, Servio debe decidir si ayuda al plan de su antiguo aliado para restaurar Roma bajo el Camino del Pecado."
 bookmark_warofprinces_esclarmonde:0 "Esclarmonde la Noire"
 bookmark_warofprinces_esclarmonde_desc:0 "Abrazada durante las campañas de Abd-er Rahman contra los francos, y pasó la mayor parte de su tiempo como neonata en la batalla contra los vampiros moros invasores. Como había pasado la mayor parte de su vida mortal en la cambiante política entre los reinos de Toulouse, Aragón y Aquitania, no era ajena a la política de poder dentro de las Cortes del Amor, aunque la mayoría de sus compañeros francos le parecían aburridos y burdos.\NFue poco después de la masacre de Béziers, durante las etapas iniciales de la Cruzada contra los cátaros, cuando el rey Etienne acusó a Esclarmonde de traición y de conspirar con los Lasombra de Aragón. El hecho de que ella decidiera no comparecer ante el Gran Tribunal para responder a sus acusaciones no hizo sino confirmarlas en la mente de muchos. Aunque Etienne pensó en un principio que Esclarmonde no tardaría en flaquear, fue tomado por sorpresa por su conocimiento de la guerra." 
 bookmark_warofprinces_roque:0 "Roque"
 bookmark_warofprinces_roque_desc:0 "Tal vez uno de los príncipes más influyentes de Malkavian, Roque es un hábil, aunque compulsivo, intrigante y planificador. Su habilidad para mantener su feudo le ha hecho ganarse el respeto a regañadientes del Clan Lasombra, y desempeña su papel en la Reconquista de la Sombra. Su fascinación por los complots y las maquinaciones le obliga a esperar y ver si puede aprovechar a sus enemigos en algo útil antes de destruirlos.\NNRoque también es un destacado seguidor del Ordo Aenigmatis y siente que el caos que la Reconquista de la Sombra trae a Iberia anuncia otra gran era de destrucción para todos los Cainitas. \N - Negrita Su futuro es incierto, pero si puede mantener a raya a sus demonios, podría seguir siendo la principal fuerza motriz de Navarra durante los próximos siglos... y quizás jugar un papel aún más importante en la península."
 bookmark_warofprinces_natalya:0 "Natalya Svyatoslav"
 bookmark_warofprinces_natalya_desc:0 "Hija de un príncipe ruso, Natalya se educó en Constantinopla y se enamoró de la ciudad para siempre. Sus habilidades como administradora llamaron la atención del Brujah, que le ofreció el abrazo, que ella aceptó con gusto.\NNNNNatalya se sumergió entonces en la construcción de una nueva Cartago, la encarnación tanto de los ideales de su clan como del Sueño de Miguel. Tras la conquista de Constantinopla por parte de los cruzados, huyó al déspota de Epiro, donde consiguió convertirse en príncipe de Tesalónica.   Respetad los logros del pasado y aprovechadlos para construir el futuro mejor con el que soñáis."
 bookmark_warofprinces_jasmin:0 "Jasmin de Palma"
 bookmark_warofprinces_jasmin_desc:0 "Una hechicera de los Banu Haqim del reino almohade. Ha conseguido reanimar la fe de los Ashirra de la isla balear, pero ha tenido menos éxito a la hora de conseguir que aprecien la amenaza cristiana. Los vampiros de las Baleares disfrutan de su aislamiento de la corriente principal de la Sociedad Cainita, formando una abigarrada colección de hermes, excéntricos e inadaptados."
 bookmark_warofprinces_durga_syn:0 "Durga Syn"
 bookmark_warofprinces_durga_syn_desc:0 "La amable mentora del Clan Ravnos es quizá la única fuerza del bien en la Rusia cainita. Esta tierra, siempre maldita por Baba Yaga y su Cortina de Sombras, sólo trae miseria y desesperación a los que se oponen a la tiránica Hag. A pesar de estas terribles probabilidades, Durga Syn nunca ha flaqueado y su corte se ha convertido en un faro de esperanza para cualquiera que intente recuperar la vieja tierra de las garras de los secuaces de Baba Yaga. Si Durga fallara en su deber, el Telón de Sombra ciertamente engulliría a toda Europa en su abrazo.\N-Une a los Ravnos en torno a su sabio liderazgo, derrota a los siervos dementes de Baba Yaga y trae la esperanza a Rusia".
 bookmark_warofprinces_maatkare:0 "Maatkare"
 bookmark_warofprinces_maatkare_desc:0 "Concubina de Set y dotada de una belleza (casi) sin igual, Maatkare es una de las hierofantas del Clan Setite, su estructura de liderazgo. Ejerciendo una tremenda influencia, gobierna el templo de la Aérea Descendente en el Magreb, donde difunde cuidadosamente la influencia de Set entre los cainitas descarriados locales. \El actual colapso de la Iberia musulmana está teniendo un efecto dominó y ha desestabilizado la región. Un hecho que Maatkare está aprovechando ahora, con el sueño de un Clan Setite unificado desde Iberia hasta Egipto en el fondo de su mente...\NNNNVerdaderamente Tú eres la encarnación del amor imperecedero de Set por todos sus hijos, descarriados o no. Les mostrarás, y ellos aprenderán. Porque no tienen otra opción".
 bookmark_warofprinces_matasuntha:0 "Matasuntha"
 bookmark_warofprinces_matasuntha_desc:0 "Matasuntha es una leyenda entre los viejos Gangrel. Líder de los hunos nómadas, estuvo a punto de poner a Roma de rodillas ante ella, siendo apenas detenida en el año 403 durante un duelo climático en los Alpes. Después fue olvidada y, habiendo despertado recientemente del letargo, encuentra este nuevo mundo extraño y espantoso. Su clan, antaño orgulloso, está dividido y los siervos de la Cruz la hacen retroceder, y la generación más joven no conoce su nombre ni sus hazañas pasadas. Sin embargo, hay esperanza, ya que la Horda Mongola arrasa las estepas, y Matasuntha ve en ellos a un digno sucesor de su propio pueblo.\N-Demuestra a los otros Gangrel de las estepas por qué Roma rogó tu misericordia hace siglos. Luego, asegúrate de que los débiles cainitas occidentales no vuelvan a olvidar tu nombre."
 bookmark_warofprinces_dionysius:0 "Dionisio"
 bookmark_warofprinces_dionysius_desc:0 "Un hombre pacífico y sencillo en sus días de respiración, Dionisio se unió al culto de Perséfone en un vano intento de alcanzar a sus parientes caídos. Esta fascinación por la muerte lo convirtió en un candidato obvio para ser abrazado por los capadocios. Sin embargo, la no muerte no cambió mucho a Dionisio, que se negó a seguir las costumbres morbosas de su clan y prefirió cuidar de los mortales y de los muertos por igual. Atrayendo a un gran número de seguidores, fue decisivo en la codificación del Camino de la Humanidad. \El gran respeto que se ganó le permitió ser elegido Príncipe de Atenas, responsabilidad que aún ocupa esta noche. Su ciudad acoge ahora a un gran número de refugiados de la caída de Constantinopla que claman venganza.\N- Negrita Tendrá que equilibrar sus convicciones, y su fe en la Humanidad, con el caos actual en Grecia. Tal vez tu liderazgo benévolo sea la única cura para detener la locura sin fin que ha traído la 4ª Cruzada."
 bookmark_warofprinces_petaniqua:0 "Petaniqua"
 bookmark_warofprinces_petaniqua_desc:0 "Una vez llamada Olimpia, Petaniqua fue la esposa de Filipo II de Macedonia, y madre de Alejandro Magno. Sin que la mayoría lo supiera, también era miembro del culto a Cibeles, una loca metamorfosis baaliana. Alimentada por su "diosa", Petaniqua llegó a odiar a todos los hombres, excepto a su hijo, para el que deseaba el mundo. Y el mundo lo consiguió, pero la eternidad le fue negada, ya que Cibeles prohibió a Petaniqua hacer de Alejandro un vampiro. \Este fue el comienzo de un largo y constante declive de su cordura, que continúa hasta esta noche. Desde entonces, Petaniqua se ha adentrado en infiernos aún más profundos, haciendo pactos con entidades que es mejor no conocer. Y ni siquiera sabe por qué.\N- Negrita Debe haber una forma de encontrarlo. O una entidad lo suficientemente poderosa para revivirlo. Entonces, será el Rey del mundo, y todo será perfecto una vez más."
 bookmark_warofprinces_absalon:0 "Absalon"
 bookmark_warofprinces_absalon_desc:0 "Antaño arzobispo de Lund y uno de los hombres más poderosos de Dinamarca, Absalon tenía el oído de reyes y cainitas por igual. Una vez que la muerte le llegó, fue una tarea fácil ingeniárselas para convertirse en el amo vampiro de su país. Sus primeros años de gobierno fueron exitosos, equilibrando cuidadosamente a los Ventrue del sur y a los salvajes Gangrel del norte. Hasta que una campaña contra Wendic Tremere distrajo a Absalon durante varias décadas, mientras descubría un poderoso secreto que podría cambiar su destino.\NSin su cuidadosa guía, Dinamarca ha caído presa de pequeños señores de la guerra y aventureros renegados. Pero esto no durará, ya que Absalon está ahora listo para volver a su tierra.\NNNNEn negrita Recupera tu derecho de nacimiento y juega cuidadosamente tus cartas, ya que tanto el sur como el norte quieren que te vayas."
 bookmark_warofprinces_helena:0 "Helena de Troya"
 bookmark_warofprinces_helena_desc:0 "Muchos ejércitos han luchado por una simple mirada a la mujer más bella del mundo. Pero Helena nunca fue una damisela en apuros, como demostró muy pronto al diabolizar a su propio sire y captor, Minos. La política vampírica le convenía, y encontró refugio y amor en Cartago. \Sin embargo, el amor no está destinado a durar y, una vez que se dio cuenta de que defender Cartago contra los romanos era inútil, traicionó su hogar adoptivo a los latinos. Una de las únicas supervivientes de la caída de Cartago, Menele de Esparta, está desde entonces a la caza de su destrucción. Su conflicto se ha extendido durante milenios y se ha convertido en una leyenda, sin que ninguno de los dos pueda obtener ventaja. Innumerables ciudades ya han caído a raíz de sus batallas.\N-Negrita Mata a Menele. Borra todo rastro de su existencia. Entonces, todos te amarán, y se desesperarán. ""
 bookmark_warofprinces_tabitha:0 "Tabitha al-Masri"
 bookmark_warofprinces_tabitha_desc:0 "Mientras los reinos musulmanes se desmoronan ante la Reconquista, el Clan Assamite envía un grupo de sus mejores guerreros para intentar detener la invasión. Liderados por Tabitha al-Masri, se han instalado en Badajoz y pretenden mantener la ciudad el mayor tiempo posible. Sin embargo, Tabitha no es una fanática y acepta a los que desean huir en lugar de luchar. Hasta ahora ha aceptado el llamamiento del sultán Badr a la unidad, pero alberga serias dudas sobre el gobernante de Granada. Sin embargo, sabe que cualquier desunión significaría la perdición para los fieles, y se guarda sus observaciones para sí misma.\N-Su misión es simple: frenar a los cristianos de la Reconquista, hacerles pagar caro cualquier pulgada de tierra. Entonces, tal vez, será el momento de poner a prueba los verdaderos motivos del Sultán Badr...#" 
 
 bm_1375_patronwar:0 "La Guerra del Patrón"
 bm_1375_patronwar_desc:0 "Este marcador está modelado según los deseos de nuestro Patrón y no representa el canon de WoD. Después de la Peste Negra, el caos se apoderó de la sociedad Kindred. Con el agotamiento del suministro de sangre, muchos vampiros entraron en letargo, otros fueron destruidos. A medida que la humanidad se recupera de la devastación, los kindred que soportaron la muerte negra forjan nuevos imperios y reinos tras ella."
