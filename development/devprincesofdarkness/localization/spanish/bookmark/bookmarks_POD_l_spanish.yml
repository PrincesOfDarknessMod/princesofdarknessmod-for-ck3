 bookmark_patronwar_loukios:0 "Loukios"
 bookmark_patronwar_loukios_desc:0 "Antaño centurión romano de cierto renombre y seguidor secreto del culto a la diosa Isis. En los años previos al colapso de Roma ante las hordas góticas, Loukas desertó cuando las guerras empezaron a ser impotentes y se enamoró cada vez más del mythos egipcio hasta el punto de peregrinar a la tierra de las arenas movedizas para entender mejor a su diosa. Por desgracia, no encontró el conocimiento que tanto buscaba, sino a los Seguidores de la Serpiente. Set le saludó en los antiguos templos. Se habían interesado por él o tal vez por sus conocimientos de la milicia romana". 
 bookmark_patronwar_ciaran:0 "Ciarán"
 bookmark_patronwar_ciaran_desc:0 "Ciarán era un Viajero Irlandés, o más exactamente, un Mincéirí o uno de los lucht siúil (literalmente, 'la gente que camina'). Era un joven de veintitrés años que simplemente hacía lo necesario para sobrevivir y mantener a su familia. A menudo eso significaba mentir y engañar porque no tenía muchas otras habilidades. A pesar de su naturaleza deshonesta, la familia siempre fue lo más importante para él, y veía a todos los lucht siúil como su familia. A cualquier nómada lo respetaba casi tanto. Por eso ofreció un hogar a un extraño viajero indostánico que se hacía llamar Viswanathan.\N-Sin saberlo, Viswanathan era un methuselah, un Vampiro de quinta generación del Clan Ravnos y un hombre que había viajado por todo el mundo conocido para encontrarse en Irlanda. Afortunado, porque su campamento pronto sería asaltado por los lugareños y el irlandés herido de muerte. Viswanathan traicionó sus propios principios para abrazar a Ciarán, salvando su vida. Le enseñó la Senda de la Paradoja y le advirtió que nunca hiciera lo que acababa de hacer. Luego se fue".
