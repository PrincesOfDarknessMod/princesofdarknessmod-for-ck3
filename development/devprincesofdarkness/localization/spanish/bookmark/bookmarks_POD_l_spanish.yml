patron_main_sub_bookmark:0 "Principal"
                                                       
bm_1510_birthofsects:0 "Camarilla y Sabbat"
bm_1510_birthofsects_desc:0 "La Era de la Inquisición y la Revuelta Anarquista terminaron con la Convención de Thorns de 1493. Este evento trascendental creó la Camarilla, el esfuerzo más ambicioso jamás realizado por los Cainitas para organizarse mediante un conjunto de reglas destinadas a preservar la Masquerade.\ nNo todos los clanes están de acuerdo y otra secta, asumiendo su naturaleza monstruosa, ha sido creada en respuesta: el Sabbat.\ nNo todos los vampiros han decidido seguir estas dos nuevas direcciones, sin embargo, y su futuro aún es bastante incierto. n\ n#bold La disciplinada Camarilla, el Sabbat salvaje, los Anarquistas supervivientes o los restantes independientes... ¿quién triunfará?#!"
bookmark_birthofsects_tyler:0 "Tyler"
bookmark_birthofsects_tyler_desc:0 "Entre los campesinos que se levantaron en apoyo del rebelde inglés Wat Tyler, Patricia fue la que se convirtió en su amante. Capturada poco tiempo después, fue encarcelada y esperaba una muerte segura cuando un Brujah llamado Robin Leeland confesó su admiración . sobre su celo revolucionario. Al final de su visita a la celda de la prisión, Robin la Abrazó.\ nInspirada por su [ Sire|E ], eventualmente se convirtió en una de las principales líderes de la causa Anarquista. En 1394, fue una de las grupo que atacó un pequeño castillo en España. Durante la batalla, ella aprovechó para diabolizar Hardestadt el Viejo. Este evento cimentó su fama eterna y ahora todos los Anarquistas la ven como la heroína que finalmente los conducirá a la gloria.\n\ n#bold Algunos dicen que la Revuelta Anarquista ha terminado y que los Antiguos han ganado. Pero si Robin te enseñó algo, es que la pelea nunca terminará realmente. La Revolución es eterna.#!"
bookmark_birthofsects_genevra:0 " Ginebra "
bookmark_birthofsects_genevra_desc:0 "En vida, Genevra era una mujer de la nobleza italiana, pero por la noche servía a los Giovanni como criado menor y recipiente de tormento. Usando sus considerables habilidades de intriga, logró burlar a su amo y lo obligó a [ Embrace|E ] ella.\ nGenevra repitió este éxito, esta vez llevando a los Inquisidores a sus compañeros de clan más débiles. Su ayuda para erradicar a tantos vampiros le ganó a Genevra la gratitud de la Inquisición, que pudo convertir en un nivel de influencia Giovanni dentro de la Iglesia misma . El envalentonado Giovanni [ Clan |E ] fue capaz de volver los ojos de estos Inquisidores hacia los vampiros rivales de otros clanes . audaz Tu rápido y traicionero ascenso al poder te ha ganado muchos enemigos, y debes seguir siendo más astuto que todos en tu camino. a la cima.#!"
bookmark_birthofsects_giangaleazzo:0 " Giangaleazzo "
bookmark_birthofsects_giangaleazzo_desc:0 " Giangaleazzo fue [ Abrazo|E ]d por un monje Lasombra , que admiraba su ingenio y fuerza de voluntad. Poco después de su Abrazo, Giangaleazzo prosperó entre los no-muertos, disfrutando de su nuevo estado como uno de los señores oscuros de la noche. Su [ Sire|E ] lo llevó a la Convención de Thorns, donde fue uno de los pocos Lasombra que apoyó a la Camarilla, gracias a un desagradable encuentro con un cazador de brujas . traicionó a su padre al Sabbat, fue aceptado en la secta y fue coronado arzobispo de Milán. Pensé que era posible. Si bien no te importan sus dogmas, son útiles por ahora. Después de todo, un verdadero príncipe moderno aprovecha todas las oportunidades que se le presentaron... #!"
bookmark_birthofsects_villon:0 "Francois Villon"
bookmark_birthofsects_villon_desc:0 "Nacido como Guillaume de Lorris , el que tendrá muchos nombres fue aplastado por su insensible [ Abrazo|E ] en los colmillos de la temible Helena. Desesperado, tomó muchos años y el apoyo constante de la hermosa Violetta para que Guillaume renaciera como Francois Villon.\ nEste nuevo hombre horrorizaría a su yo pasado, siendo casi un duplicado de su [ Sire|E ], un hedonista insensible y hambriento de poder con pocos escrúpulos morales, si es que tiene alguno. , y su ascenso al poder ha comenzado. Helena tenía toda la razón al ver en él un potencial prodigio ya que, en menos de dos siglos, el otrora neonato deprimido es ahora el segundo vampiro más influyente de Francia. n#bold Te has despojado de tu propia la vida y sus mezquinos límites morales lejos. Ahora eres un despiadado y ambicioso traficante de poder y lo amas. Francia está a solo unas pocas traiciones más y corazones rotos de ser tuyo... #!"
bookmark_birthofsects_tepes:0 "Vlad Drácula"
bookmark_birthofsects_tepes_desc:0 "Un príncipe ingenioso y cruel de Valaquia en vida, Vlad Tepes había estado bebiendo la sangre de un vampiro que capturó y encerró en el castillo de Drácula y descubrió sus secretos antes de su 'muerte'.\ nIntrigado por la sociedad de Esa noche, Vlad buscó un patrocinador, o una víctima, que pudiera otorgarle el [ Abrazo|E ]. Pacientemente, preparó un plan, planeando una batalla entre la Camarilla y el Sabbat cerca de su castillo, y acabó con ambos, capturando al vampiros más poderosos que quedan para su propio uso.\ nVlad Tepes es ahora un vampiro muy joven con muchos enemigos, pero la mayoría de ellos están empezando a entender de lo que es capaz..\n\ n#bold Una noche, serás tan famoso como Caine. Pero hasta entonces, debes construir tu leyenda y conquistar como lo hiciste como mortal. Transilvania siempre será tuya y solo tuya.#!"
bookmark_birthofsects_tegyrius:0 " Tegirio "
bookmark_birthofsects_tegyrius_desc:0 "Como mortal, Tegyrius sirvió en el ejército de Alejandro Magno. [ Embrace|E ]d ingresó al [ Clan|E ] Como miembro de la Casta Visir, Tegyrius ha creído durante mucho tiempo las historias de que los Hijos de Haqim estaban destinados para ser jueces.\ nLa mayor parte de su existencia la ha pasado en este rol: como árbitro anónimo en disputas entre [ cainitas|E ], dentro de las cortes bizantinas como se compiló el Codex Justinianus , o merodeando como un lobo cazador y matando a sus enemigos .\ nCon el tratado de Tiro obligando a los Hijos de Haqim a una paz incómoda con la Camarilla, las habilidades de Tegyrius como diplomático son necesarias en Anatolia, donde su pueblo y la Camarilla comparten esta frágil tregua.\n\ n#audaz Debes protege los intereses de tu clan, quizás incluso contra sí mismo. Tanto si la Camarilla resiste como si flaquea, Anatolia debe permanecer segura para los Hijos de Haqim .#!"
bookmark_birthofsects_karsh:0 "Karsh"
bookmark_birthofsects_karsh_desc:0 "Se cree que Karsh es el selyúcida Hassan al -Samhir , conquistador de Manzikert, el más grande de los generales, que sirvió a dos sultanes del incipiente Imperio Otomano, a quien los turcos exaltaron en el verso ' Samhir , gran Samhir , inexorable Samhir . , el más poderoso de los guerreros bajo el antiguo cielo azul". Los historiadores cainitas cuentan historias de un auspicioso encuentro entre una mano no muerta y una voluntad inquebrantable. Fue allí donde Hassan al- Samhir prometió lealtad eterna a un inmortal que se hacía llamar Hardestadt de Ventrue , líder de hombres y monstruos, un ser cuyas palabras convencieron a las naciones, y portador de un intelecto asombroso, que sabía que las palabras no siempre serían suficientes. Hassan al -Samhir prestó juramento y se convirtió en Karsh, el Señor de la Guerra de la Camarilla.\n\ n#negrita Estás estoicamente en silencio cuando estás en paz, pero te conviertes en una máquina de matar que se suelta cada vez que sales al campo.
bookmark_birthofsects_erianthe:0 " Erianthe "
bookmark_birthofsects_erianthe_desc:0 "Cuando era bebé, Erianthe fue abandonada a su suerte en los escalones del Palacio de Knossos, y sus padres nunca supieron que una anciana que vivía en las ruinas derruidas la acogió. Theophania , una profetisa Malkavian , crió a Erianthe y le enseñó los caminos del Oráculo . Después de cada profecía exitosa, cae en una profunda tristeza y, a veces, se niega a buscar refugio cuando se acerca el amanecer. Para sus fieles y devotos seguidores, esto probablemente habría sucedido hace mucho tiempo.\n \ n#bold Eres el último destinatario de la voluntad de los atletas olímpicos en la Tierra, una gran carga que debes aprender a acomodar.#!"
bookmark_birthofsects_petrodon:0 " Petrodón "
bookmark_birthofsects_petrodon_desc:0 "Nacido como el Conde Alonso Cristo Petrodon de Sevilla, Petrodon fue atacado por la peste en 1348; el Nosferatu Cristo [ Embrace|E ]d él para salvarle la vida.\ nPetrodon rápidamente se ganó la reputación de reprimir brutalmente a los Anarquistas Tal vez uno de los partidarios más fanáticos de la Camarilla, Petrodon asusta incluso a sus seguidores más leales, temiendo que puedan encontrarse faltos de sus elevadas expectativas en cualquier momento.\n\ n#negrita La Camarilla es el único camino a seguir. , Sabbat , independientes, incluso aquellos que no muestren una devoción absoluta a la causa... todos serán barridos por tu justa furia.#!"
bookmark_birthofsects_seinia:0 " Seinia "
bookmark_birthofsects_seinia_desc:0 "Seinia, una [ cainita |E ] terrateniente menor alrededor de Nóvgorod, era una dueña estricta, pero cariñosa, de su rebaño. Como tal, una vez que su propiedad fue atacada y todos fueron masacrados, se sorprendió por el hecho de que de hecho, los extrañaba.\ nSe incorporó a un séquito de Caballeros de las Cenizas Amargas, Seinia hizo causa común con ellos para vengar a su pueblo. Luego se unió a su orden y se convirtió en una de las pocas mujeres en recibir el Grial [ Embrace|E ]. \ nSin embargo, la Inquisición destruyó la mayor parte de la orden, y Sienia se encontró cayendo cada vez más en sus viejos hábitos de dudosa moralidad. Al perder su fe y convicción, se unió al naciente Sabbat y se desempeña como el arzobispo ruso más exitoso hasta el momento. \n\ n#bold Tus sueños infantiles de redención quedaron atrás. La única verdad en este mundo es el poder, y tu alma puede ser condenada en el camino por el poco bien que te hizo.#!
bookmark_birthofsects_nefertiti:0 "Nefertiti"
bookmark_birthofsects_nefertiti_desc:0 "Nefertiti fue una vez una princesa egipcia y, según sus palabras, reina antes de caer en desgracia. Algunos dicen que era la consorte del faraón Akhenaton del mismo nombre, aunque otros Setitas venerables como Neferu podrían cuestionar tal afirmación.\ nEn sus días de vida, ella cayó en los encantos de los Ravnos Ankla Hotep hasta que se enteró de que las únicas cosas que el sinvergüenza Ravnos quería eran su cuerpo y su riqueza, dejándola con el corazón roto. Después de que Set la salvó de la muerte a través del [ Abrazo|E ], Nefertiti llegó a aceptar por completo su nuevo rol dentro del [ Clan|E ] y se convirtió en una de las mayores defensoras de los objetivos de Set.\ nDespués de varios esfuerzos, recientemente se embarcó en una búsqueda para infiltrarse en la naciente Camarilla, comenzando desde uno de sus puntos más débiles en Alemania.\n\ n#bold Tus compañeros Setitas dudan de tus afirmaciones y logros. ¡Es hora de demostrar que están equivocados corrompiendo a la propia Camarilla!#!"
bookmark_birthofsects_karl:0 "Karl Schrekt "
bookmark_birthofsects_karl_desc:0 "En vida, Karl Schrekt era un temido cazador de demonios de Viena. Un hombre impulsivo, se dice que puso al poderoso Eirik Eigermann en [ letargo|E ].\ nFue [ Embrace|E ]d por su [ Sire|E ] después de ser derrotado en una lucha difícil. Sobreviviendo a los incendios de la Inquisición (una ironía amarga y dolorosa para un hombre que una vez cazó demonios), llegó a la conclusión de que la Camarilla era el evento más grande en la historia de los Vástagos y se comprometió con él. La reputación de Karl entre los Tremere y los La Camarilla crece cada noche y ya se han encendido muchas hogueras para el Sabbat o los Anarquistas que lo subestimaron.\n\ n#bold Tu trabajo no es muy diferente del que hiciste en tu vida mortal. Cazas monstruos para proteger a los demás. El hecho de que tú mismo seas un monstruo nunca te detuvo antes, y tampoco lo hará ahora.#!"
bookmark_birthofsects_mukhtar:0 " Mukthar Bey"
bookmark_birthofsects_mukhtar_desc:0 "Mukhtar Bey era mameluco en vida y guardaespaldas en vida del poderoso Príncipe de El Cairo, Antonio. Todo cambió cuando Lupins atacó y el Príncipe fue asesinado, dejando al muy respetado . " Mukthar sea aclamado como el nuevo líder.\ nMukhtar Bey gobierna El Cairo como una ciudad libre, sin jurar lealtad a una de las grandes sectas de los no-muertos, permitiendo Vástagos de cada [ Clan|E ] y patrimonio dentro de sus límites.\ nA pesar de varios agoreros que llama a su destrucción, es capaz, no obstante, de controlar las facciones dispares en El Cairo, y se gana el respeto, ya que su gobierno es firme a pesar de los muchos cambios en los vientos políticos.\n\ n#negrita Todavía estás avergonzado por fallarle a tu Príncipe y amigo en su momento de necesidad y te molesta tu legado de Caitiff como el probable culpable. Aún así, no le fallarás a El Cairo, sin importar el costo.#!"
bookmark_birthofsects_phaedyme:0 " Fedimia "
bookmark_birthofsects_phaedyme_desc:0 " Phaedyme era originalmente un soldado en el ejército de Alejandro Magno, disfrazado de hombre para escapar del destino esperado de su sexo. En India, Phaedyme fue [ Embrace|E ]d por Kali, y viajaron por el mundo durante mucho tiempo antes de establecerse en la Galia. Se dedicó a dominar la guerra y el honor.\ nFascinada por los ideales de la caballería y la caballería, sin embargo, se vio obligada a [ letargo|E ] durante la mayor parte de la Edad Media. ideales que amaba que se desvanecieran y está reuniendo a sus seguidores más cerca de la India y lejos de las sectas corruptas, con la esperanza de preservar algo del legado caballeresco en este nuevo hogar . amado, tienes que buscar en otra parte y empezar de nuevo. ¡Aún es tiempo de que los Caballeros Ravnos perduren y prosperen!#!”
