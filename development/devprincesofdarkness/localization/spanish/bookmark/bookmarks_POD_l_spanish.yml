bm_867_thelongnight:0 "Mundo de los mortales"
bm_867_thelongnight_desc:0 "#R Este marcador está diseñado para jugar en un mundo en el que la mayoría de los personajes principales son mortales y solo el 1 % son vampiros. Elige las reglas del juego "Mundo de tinieblas: mundo de ignorancia" y "Dominio sobrenatural: mortales". " : the Innocent".\n\ nSi deja las reglas del juego establecidas en "World of Darkness" y "Vampire: the Masquerade", obtendrá un mundo de vampiros no canónicos que son la mayoría de los personajes principales. Recomiendo encarecidamente el marcador War of Princes de 1230 d. C. y no este. Aún así, a menudo se solicita jugar en un mundo mayormente mundano con muy pocos vampiros, así que aquí está. Otros pueden disfrutar de una caja de arena Vampiro más aleatoria jugando V: tM en 867.\n\ nEl creador de personajes del Mundo de Tinieblas estará disponible bajo decisiones .
bookmark_thelongnight_neklan_premsyl:0 " Neklán Premsyl "
bookmark_thelongnight_neklan_premsyl_desc:0 "Destinado a un juego Revenant.\ nFundador de la familia Premsyl Revenant, un experimento Tzimisce sobre el linaje real bohemio. Se sabe que son sirvientes de Matusalén Vukodlak y su agente Azhra el Poderoso Sin Vida .\n\ nTú , ellos del videojuego Vampire: the Masquerade -- Redemption".
bookmark_thelongnight_michael:0 "Miguel"
bookmark_thelongnight_michael_desc:0 "Destinado a un juego de vampiros secretos.\ nEl vampiro Toreador Matusalén Michael se hace pasar por el emperador bizantino Michael III. Arcángel del sueño vampírico, intenta expandir su influencia en el mundo mortal con este subterfugio."
 bookmark_thelongnight_rurik_rurikid:0 "Rúrik"
bookmark_thelongnight_rurik_rukid:0 "Rurik"
bookmark_thelongnight_rurik_rurikid_desc:0 "Previsto para un juego de hombre lobo, por ahora un mortal.\ nSe rumorea que Rurik era pariente de la camada de Fenris, una tribu de hombres lobo.\n\ nLos hombres lobo aún no se han implementado para el mod Príncipes de la Oscuridad".
bookmark_thelongnight_theodosius:0 "Teodosio"
bookmark_thelongnight_theodosius_desc:0 "Destinado a un juego de Inquisidor.\ nTeólogo griego , antiguo hereje gnóstico convertido en católico entusiasta, ocultista intelectual, cazador de vampiros y fundador de la Orden Roja."
bm_868_constantinoplebynight:0 "Constantinopla de noche"
bm_868_constantinoplebynight_desc:0 "Michael, el patriarca del sueño en Constantinopla, ha estado actuando como el mortal Michael III. Dracon se ha hundido en una depresión tras la destrucción de Antonius. Caius lidera el Antonian Ventrue . Narses, el arzobispo de Nod en Venecia, mira para expandir la Herejía [ cainita|E ] tanto al este bizantino como a las posesiones tradicionales Lasombra al sur en Italia y Sicilia. Fenrir: debe enfrentarse a la inminente amenaza de los mortales que se convierten al dios clavado. Mientras tanto, en toda Europa occidental, Los Ventrue son un clan dividido de estados feudales en competencia, el más poderoso entre ellos, Alejandro de París. Oportunidad de vengar la caída de Cartago sobre ellos desde su base entre los magiares conquistadores. Sin embargo, una casa de magos está a punto de convertirse en Vástagos. la sociedad al revés usurpando el poder de Caine's b por sí mismos".
bookmark_constantinoplebynight_michael:0 "Miguel"
bookmark_constantinoplebynight_michael_desc:0 "Patriarca del sueño"
bookmark_constantinoplebynight_odin:0 "Odín el Todopoderoso"
bookmark_constantinoplebynight_odin_desc:0 "¡Gloria a los Einherjar! ¡Llamando al Valhalla!"
bookmark_constantinoplebynight_montano:0 "Montano"
bookmark_constantinoplebynight_montano_desc:0 "Vemos en las sombras"
bookmark_constantinoplebynight_narses:0 "Narés"
bookmark_constantinoplebynight_narses_desc:0 "Martillo de los godos"
bookmark_constantinoplebynight_shahiri:0 " Sha'hiri , anciano de la montaña"
bookmark_constantinoplebynight_shahiri_desc:0 "La muerte no llama"
 bm_1230_warofprinces_desc:0 "La Guerra de los Príncipes es el período de conflicto en la historia Cainita que comenzó poco después de la caída de Constantinopla ante la Cuarta Cruzada en 1204. El término se refiere a los conflictos por el territorio que los diversos príncipes de Europa lucharon después del final de la Larga Noche. \n\nLa Guerra de los Príncipes comenzó poco antes de que se formara la Inquisición. Aunque inicialmente los Inquisidores fueron utilizados como herramientas por los antiguos, pronto se convirtieron en una amenaza mayor para los Cainitas que los Cainitas para ellos mismos. Aunque no está claro exactamente cuándo terminó la Guerra de los Príncipes, es probable que se haya visto obligada a concluir con el advenimiento de la Revuelta Anarquista, si no antes.\n\n#negrita ¿Solo tú saldrás victorioso al final de esta Guerra? ? ¿O la marea de la humanidad arrastrará a tu clan cuando se vuelva contra sus amos legítimos?#!"
bm_1230_warofprinces:0 " Edad Oscura: Vampiro"
bm_1230_warofprinces_desc:0 “La Guerra de los Príncipes es el período de conflicto en la historia Cainita que comenzó poco después de la caída de Constantinopla ante la Cuarta Cruzada en 1204. El término se refiere a los conflictos por el territorio que los diversos príncipes de Europa lucharon después del final de la Larga Noche.\n\nLa Guerra de los Príncipes comenzó poco antes de que se formara la Inquisición. Aunque inicialmente los Inquisidores fueron utilizados como herramientas por los antiguos, pronto se convirtieron en una amenaza mayor para los Cainitas que los Cainitas para ellos mismos. No está claro exactamente cuando terminó la Guerra de los Príncipes, probablemente se habría visto obligada a concluir con el advenimiento de la Revuelta Anarquista, si no antes.\n\ n #negrita ¿Serás el único vencedor al final de esta Guerra? ¿ Alejar a tu clan mientras se vuelven contra sus amos legítimos?# !"
bookmark_warofprinces_montano:0 "Montano"
bookmark_warofprinces_montano_desc:0 "El fiel chiquillo de Lasombra mismo es el amo de su [ Clan|E ], que se extiende por todo el Mediterráneo. Aunque se encuentra en una posición segura y es un individuo poderoso, los problemas se avecinan en el horizonte de Montano. La guerra civil en Iberia, El ascenso de viejos enemigos en Italia y la rebeldía de los miembros más jóvenes del [ Clan|E ] son amenazas para la estabilidad del [ Clan|E ] . Constantinopla se ha inclinado ante él recientemente, pero no se puede confiar en su príncipe, Alfonso. Un curso de acción más sabio podría ser permanecer enfocado en Italia por el momento . ] ¿ La posición legítima de Lasombra como el [ Clan|E ] más influyente de Europa una vez más?# !"
bookmark_warofprinces_qawiya:0 " Qawiya el-Ghaduba "
 bookmark_warofprinces_werter_desc:0 "Las viejas costumbres de los nórdicos están muriendo, y con ellas, los Hijos de Odín. Mientras los Ventrue alemanes lanzan su asalto final a Escandinavia, la mayoría de los Einherjar se resignan a su destino, la llegada de Ragnarok.\n\n#negrita Como el último Todopoderoso de tu pueblo, ¿aceptarás tu destino pacíficamente o resistirás por última vez? digno de Valhalla?#!"
bookmark_warofprinces_qawiya_desc:0 "El [ Clan|E ] Salubri yace destrozado, casi extinguido por los usurpadores de la Casa Tremere . La Leona de Jerusalén, chiquilla del propio Samiel , es su última esperanza, su última oportunidad de sobrevivir frente a la Magister embestida. Su alianza de Príncipes en el área, la 'Dieta de los Olivos' es algo inestable, y ya está amenazada por el movimiento cercano [ ashirra|E ] y Baali para Salubri . campeón.\n\ n #audaz ¿Transformarás una inútil última batalla en un glorioso renacimiento del Salubri [ Clan|E ]?#!"
bookmark_warofprinces_werter:0 " Werter "
bookmark_warofprinces_werter_desc:0 "Las viejas costumbres de los nórdicos están muriendo, y con ellas, los Hijos de Odín. Mientras los Ventrue alemanes lanzan su asalto final a Escandinavia, la mayoría de los Einherjar se resignan a su destino, la llegada de Ragnarok .\n\ n #bold Como el último All High de tu pueblo, ¿aceptarás tu destino pacíficamente o harás una última resistencia digna de Valhalla ?
bookmark_warofprinces_etrius:0 " Etrio "
bookmark_warofprinces_etrius_desc:0 "El [ clan|E ] más joven de los vampiros, los magos Tremere , se encuentran en una situación difícil. El propio Tremere está en [ letargo|E ], recuperándose de la [ diablerie|E ] de Saulot , y cae sobre el siempre leal Etrius para enfrentar el asalto implacable de los Tzimisce . Sin embargo, tienes algunas ventajas, ya que la famosa disciplina del [ Clan|E ] garantiza la unidad y los Ventrue de Alemania y Hungría están un poco de tu lado. Tus enemigos no son conocidos por su paciencia, y deberías buscar oportunidades para sacar provecho de su crisis interna.\n\ n #negrita ¿Conseguirás [ Clan|E ] Tremere como una fuerza poderosa en la política vampírica como decretó Tremere ?# !"
 bookmark_warofprinces_mithras_desc:0 "Algunos creen que Mitra es un dios persa y romano literal. Aunque es poco probable, esto le ha permitido crear un cuadro fanático de fervientes chiquillos y cultistas para cumplir sus órdenes. Habiendo huido a Inglaterra después del fracaso de algunas maquinaciones en la Antigua Roma, Mitra rápidamente se aburrió de las pequeñas disputas entre los señores de Inglaterra. Decidiendo que era mejor pasar su tiempo durmiendo, dejó el reino en manos de unos pocos regentes de confianza... quienes rápidamente dejaron que las cosas se desmoronaran. Habiendo salido del [letargo|E], Mitra se apresuró a consolidar el poder, arreglando la mayor parte del lío que habían hecho sus regentes. Inglaterra está segura, pero no del todo sometida. Tendrás que lidiar con Gangrel salvajes en Gales, forajidos rebeldes en Nottingham y los restos de los Einherjar en Escocia. Después de eso, el vacío de poder en Francia podría explotarse con tu punto de apoyo en Burdeos.\n\n#negrita No hay límites en cuanto a lo lejos que puedes llegar. ¡Contempla la gloria del sol eterno!#!"
bookmark_warofprinces_rustovitch:0 " Rustovich "
bookmark_warofprinces_rustovitch_desc:0 "El manto de voivoda de los voivodas no ha recaído en los Koldun más antiguos o poderosos , sino en los Tzimisce más ambiciosos . Vladimir Rustovitch ha tenido un reinado mixto hasta ahora, con una paz blanca contra los cruzados Jurgen von Verden y la humillante resiliencia de los odiados Tremere Como siempre es el caso en la política Tzimisce , a muchos les gustaría nada más que su caída, primero entre ellos su predecesor , Noriz . Es capaz de asegurar algunas victorias clave, sus rivales podrían pronto 'desaparecerán'... \n\ n#negrita ¿Puede la 'Maldición de los Lobos' liderar a los señores Tzimisce en disputa contra la amenaza de los Ventrue y los Tremere? usurpadores?# !"
bookmark_warofprinces_mithras:0 "Mitra"
 bookmark_warofprinces_roque_desc:0 "Tal vez uno de los príncipes Malkavian más influyentes, Roque es un hábil, aunque compulsivo, intrigante y planificador. Su habilidad para mantener su feudo le ha valido el respeto a regañadientes del [Clan|E] Lasombra, y desempeña su papel en la Reconquista de las Sombras. Su fascinación por los complots y las maquinaciones lo obligan a esperar y ver si puede convertir a sus enemigos en algo útil antes de destruirlos.\n\nRoque también es un destacado seguidor de Ordo Aenigmatis y siente que el caos que la Sombra Reconquista traerá a Iberia presagia otra gran era de destrucción para todos los [cainitas|E] .y quizás jueguen un papel aún mayor en la península.#!"
bookmark_warofprinces_mithras_desc:0 "Algunos creen que Mitra es un dios persa y romano literal. Aunque es poco probable, esto le ha permitido crear un cuadro fanático de niños entusiastas y cultistas para cumplir sus órdenes. Habiendo huido a Inglaterra después del fracaso de algunas maquinaciones Decidiendo que era mejor pasar su tiempo durmiendo, dejó el reino en manos de unos pocos regentes de confianza... quienes rápidamente dejaron que las cosas se desmoronaran . el lío que habían creado sus regentes. Inglaterra está segura, pero no del todo sometida. Tendrás que lidiar con los Gangrel salvajes en Gales, los forajidos rebeldes en Nottingham y los restos de los Einherjar en Escocia. Después de eso, el vacío de poder en Francia podría ser explotado con tu punto de apoyo en Burdeos.\n\ n#bold No hay límites en lo lejos que puedes llegar. ¡Contempla la gloria del sol eterno!# !
bookmark_warofprinces_pustula:0 "Servio Mario Pustula "
bookmark_warofprinces_pustula_desc:0 "Una vez esclavo en la antigua Roma, después de una pelea entre vampiros fue abrazado por un Nosferatu. Luego, bajo la tutela de Tanitbaal , canalizó su ira escribiendo poemas satíricos. Cuando su mentor desapareció, Pustula y su compañera Camilla conspiraron contra esos que eran enemigos de Tanitbaal con Camila confiando el Camino a Pústula antes de que cayera en [ letargo|E ]. Pústula abandonó Roma y comenzó a predicar su Camino en el extranjero, ganando muchos nuevos adeptos.\n\ nAhora que Camila ha despertado, Servio debe decidir si ayudar al plan de su antiguo aliado de restaurar Roma bajo el Camino del Pecado".
bookmark_warofprinces_roque:0 "Roque"
Malkavian más influyentes , Roque es un planificador habilidoso, aunque compulsivo. Su habilidad para mantener su feudo le ha valido el respeto a regañadientes del Lasombra [ Clan|E ], y juega su parte de la Reconquista de las Sombras. Su fascinación por los complots y las maquinaciones lo obligan a esperar y ver si puede convertir a sus enemigos en algo útil antes de destruirlos.\n\ nRoque también es un destacado seguidor de la Ordo Aenigmatis y siente que el caos Shadow Reconquista traerá a través de Iberia presagia otra gran era de destrucción para todos los [ cainitas|E ].\n\ n#bold Tu futuro es incierto, pero si puedes mantener a raya a tus demonios, podrías seguir siendo la principal fuerza impulsora de Navarra durante los siglos venideros... y tal vez desempeñen un papel aún más importante en la península.#!"
bookmark_warofprinces_natalya:0 "Natalya Sviatoslav "
bookmark_warofprinces_natalya_desc:0 "La hija de un príncipe ruso, Natalya se educó en Constantinopla y se enamoró de la ciudad para siempre. Sus habilidades como administradora llamaron la atención de los Brujah , quienes le ofrecieron el [ Abrazo|E ], que ella aceptó con mucho gusto .\n\ nNatalya luego se sumergió en la construcción de una nueva Cartago, la encarnación de los ideales de su [ Clan|E ] y el Sueño de Michael . convertirse en Príncipe de Tesalónica . Ella ve su ciudad como una posición alternativa útil, pero ella sueña con recuperar Constantinopla de manos de Alfonso y los salvajes latinos.\n\ n #negrita Eres quizás la última esperanza de crear una utopía que rivalice con Cartago y Constantinopla. Aprovecha los logros del pasado y aprovéchalos para construir el futuro mejor con el que sueñas .# !"
bookmark_warofprinces_jasmin:0 "Jazmín de Palma"
bookmark_warofprinces_jasmin_desc:0 "Una hechicera de los Banu Haqim de origen almohade. Consiguió revitalizar la fe de los baleares' [ ashirra|E ], pero ha sido menos en hacer que valoren la exitosa amenaza cristiana. Los vampiros de Baleares disfrutan de su aislamiento de la corriente principal de la sociedad [ cainita|E ], formando una variopinta colección de ermitaños, excéntricos e inadaptados".
bookmark_warofprinces_durga_syn:0 "Durga Syn"
bookmark_warofprinces_durga_syn_desc:0 "El amable mentor de los Ravnos [ Clan|E ] es quizás la única fuerza del bien en [ cainite|E ] Rusia. Esta tierra, maldecida para siempre por Baba Yaga y su Cortina de sombras, solo trae miseria y desesperación a aquellos oponiéndose a la tiránica Hag. A pesar de estas terribles adversidades, Durga Syn nunca vaciló y su corte se ha convertido en un faro de esperanza para cualquiera que intente recuperar la vieja tierra de las garras de los secuaces de Baba Yaga . Ciertamente envolverá a toda Europa en su abrazo.\n \ n #bold ¡Reúne a los Ravnos en torno a tu sabio liderazgo, derrota a los sirvientes dementes de Baba Yaga y trae esperanza a Rusia!#!"
 bookmark_warofprinces_dionysius_desc:0 "Un hombre pacífico y sencillo en sus días de respiración, Dionisio se unió al culto de Perséfone en un intento inútil de llegar a sus parientes caídos. Esta fascinación por la muerte lo convirtió en un candidato obvio para [Abrazo|E] por parte de los capadocios. Sin embargo, la no muerte no cambió mucho a Dionyius, y se negó a seguir las formas morbosas de su [Clan|E], prefiriendo cuidar tanto a los mortales como a los muertos. Atrayendo a un gran número de seguidores, jugó un papel decisivo en la codificación del Camino de la Humanidad. \nEl gran respeto que se ganó le valió el Principado de Atenas, responsabilidad que aún ocupa esta noche. Su ciudad alberga ahora a un gran número de refugiados de la caída Constantinopla que claman venganza.\n\n#negrita Tendrás que equilibrar tus convicciones y tu fe en la humanidad con el caos actual en Grecia. ¡Quizás su liderazgo benévolo sea la única cura para detener la locura sin fin provocada por la Cuarta Cruzada.#!"
bookmark_warofprinces_maatkare:0 " Maatkare "
bookmark_warofprinces_maatkare_desc:0 "Concubina de Set y bendecida con una belleza (casi) sin igual, Maatkare es una de las Hierofantes del [ Clan|E ] Setita , su estructura de liderazgo. Ejerciendo una tremenda influencia, gobierna el templo del Nido Descendente en Magreb, donde difunde cuidadosamente la influencia de Set entre los [ cainitas|E ] locales equivocados.\ nEl colapso en curso de la Península Ibérica musulmana está teniendo un efecto desestabilizador en toda la región, un hecho que Maatkare ahora está aprovechando, con el sueño de un [ Clan|E ] Setita unificado desde Iberia hasta Egipto en el fondo de su mente...\n\ n#bold Eres la encarnación del amor imperecedero de Set por todos sus hijos, equivocados o no. Aprenderán. Porque no tienen otra opción.# !"
bookmark_warofprinces_matasuntha:0 " Matasuntha "
 bookmark_warofprinces_absalon_desc:0 "Una vez arzobispo de Lund y uno de los hombres más poderosos de Dinamarca, Absalon tenía el oído de reyes y [cainitas|E] por igual. Una vez que le llegó la muerte, fue una tarea fácil diseñar su transformación en el maestro vampiro de su país. Sus primeros años de gobierno fueron exitosos, equilibrando cuidadosamente a los Ventrue del sur y los salvajes Gangrel del norte. Hasta que una campaña contra Wendic Tremere distrajo a Absalon durante varias décadas mientras descubría un poderoso secreto que podría cambiar su destino.\nSin su guía cuidadosa, Dinamarca ha sido víctima de pequeños señores de la guerra y aventureros rebeldes. Pero no durará, ya que Absalon ahora está listo para regresar a su tierra.\n\n#negrita Recupera tu derecho de nacimiento y juega con cuidado tus cartas, ya que tanto el sur como el norte quieren que te vayas.#!"
bookmark_warofprinces_matasuntha_desc:0 " Matasuntha es una leyenda entre los viejos Gangrel. Líder de los hunos nómadas, casi puso a Roma de rodillas ante ella, apenas detenida en 403 por un duelo culminante en los Alpes. Desde entonces ha sido olvidada y, recientemente despierta del [ letargo|E ] , encuentra este nuevo mundo extraño y espantoso. Sin embargo, hay esperanza, mientras la horda mongola arrasa las estepas, Matasuntha ve en ellos a un digno sucesor de su propio pueblo.\n\ n #bold Muéstrales a los otros Gangrel de las estepas por qué Roma suplicó tu misericordia hace siglos. Luego, asegúrate de que los débiles [ cainitas|E ] occidentales nunca vuelvan a olvidar tu nombre .# !"
 bookmark_warofprinces_helena_desc:0 "Muchos ejércitos han luchado por una mera mirada de la mujer más bella del mundo. Pero Helena nunca fue una damisela en apuros, como lo demostró bastante pronto al [diabolizar|E] a su propio [Sire|E] y captor, Minos. La política vampírica le sentaba bien y encontró refugio y amor en Cartago. \nSin embargo, el amor no está destinado a durar y, una vez que se dio cuenta de que defender Cartago contra los romanos era inútil, traicionó su hogar adoptivo a los latinos. Uno de los únicos sobrevivientes de la caída de Cartago, Menele de Esparta, ha estado planeando su destrucción desde entonces. Su conflicto se ha extendido por milenios y se volvió legendario sin que ninguno de ellos pudiera obtener una ventaja. Innumerables ciudades ya han caído a raíz de sus batallas.\n\n#negrita Mata a Menele. Borrar todo rastro de su existencia. Entonces, todos te amarán y se desesperarán.#!"
bookmark_warofprinces_dionysius:0 "Dionisio"
bookmark_warofprinces_dionysius_desc:0 "Dionisio, un hombre pacífico y sencillo en sus días de vida, se unió al culto de Perséfone en un intento inútil de llegar a sus parientes caídos. Esta fascinación por la muerte lo convirtió en un candidato obvio para [ Embrace|E ] de los capadocios. Sin embargo, la no muerte no cambió mucho a Dionyius , y se negó a seguir las formas morbosas de su [ Clan|E ], prefiriendo cuidar tanto a los mortales como a los muertos. La humanidad.\ nEl gran respeto que ganó le valió el Principado de Atenas. una responsabilidad que todavía ocupa esta noche. Su ciudad alberga ahora a un gran número de refugiados de la caída Constantinopla que claman venganza.\n\ n #negrita Tendrás que equilibrar tus convicciones y tu fe en la humanidad con el caos actual en Grecia ¡ Quizás su liderazgo benévolo sea la única cura para detener la locura sin fin provocada por la Cuarta Cruzada !
bookmark_warofprinces_petaniqua:0 " Petaniqua "
bookmark_warofprinces_petaniqua_desc:0 "Una vez llamada Olimpia, Petaniqua fue la esposa de Filipo II de Macedonia y madre de Alejandro Magno. Sin que la mayoría lo supiera, también era miembro del culto de Cibeles, una matusalén de Baali loca . Criada por su 'Diosa' , Petaniqua llegó a odiar a todos los hombres excepto a su hijo, por el que deseaba el mundo. Y el mundo que obtuvo, pero la eternidad le fue negada, ya que Cybele le prohibió a Petaniqua convertir a Alexander en un vampiro. Descenso prolongado y constante hacia la locura. que continúa hasta esta noche . una forma de encontrarlo. O una entidad lo suficientemente poderosa como para revivirlo. Entonces, él será el Rey del mundo, y todo será perfecto una vez más.# !"
bookmark_warofprinces_absalon:0 " Absalón "
bookmark_warofprinces_absalon_desc:0 "Anteriormente arzobispo de Lund y uno de los hombres más poderosos de Dinamarca, Absalon tenía el oído de los reyes y [ cainitas|E ] por igual. Una vez que le llegó la muerte, fue una tarea fácil diseñar su transformación en vampiro amo de su país Sus primeros años de gobierno fueron exitosos, equilibrando cuidadosamente a los Ventrue del sur y los salvajes Gangrel del norte . Tremere distrajo a Absalon durante varias décadas mientras descubría un poderoso secreto que podría cambiar su destino.\ nSin su guía cuidadosa, Dinamarca ha caído presa de pequeños señores de la guerra y aventureros rebeldes. Pero no durará, ya que Absalon ahora está listo para regresar a su tierra.\ n #negrita Recupera tu derecho de nacimiento y juega con cuidado tus cartas, ya que tanto el sur como el norte quieren que te vayas.#!
bookmark_warofprinces_helena:0 "Helena de Troya"
bookmark_warofprinces_helena_desc:0 "Muchos ejércitos han luchado por una mera mirada de la mujer más hermosa del mundo. Pero Helena nunca fue una damisela en apuros, como lo demostró bastante pronto al [ diabolizar|E ] a su propio [ Sire|E ] y captor, Minos. La política vampírica le sentaba bien, y encontró refugio y amor en Cartago.\ nSin embargo, el amor no está destinado a durar, y, una vez que se dio cuenta de que defender Cartago contra los romanos era inútil, traicionó su hogar adoptivo a los latinos. los únicos sobrevivientes de la caída de Cartago, Menele de Esparta, han estado planeando su destrucción desde entonces. Su conflicto se ha extendido por milenios y se ha vuelto legendario sin que ninguno de ellos pueda obtener una ventaja. Innumerables ciudades ya han caído a raíz de sus batallas. n\ n #bold Mata a Menele . Borra todo rastro de su existencia. Entonces, todos te amarán y se desesperarán.# !
 bookmark_patronwar_lvcivs_desc:0 ""
 bookmark_warofprinces_tabitha:0 "Tabitha al - Masri "
 bookmark_patronwar_seitheach_desc:0 ""
 bookmark_warofprinces_tabitha_desc:0 "Mientras los reinos musulmanes se desmoronan ante la Reconquista, [ Clan|E ] Assamite ha enviado un grupo de sus mejores guerreros para tratar de detener la invasión. Dirigidos por Tabitha al- Masri , han establecido su hogar en Badajoz y pretenden mantener la ciudad el mayor tiempo posible. Sin embargo, Tabitha no es una fanática y acepta a aquellos que desean huir en lugar de luchar. Hasta ahora, ha aceptado el llamado a la unidad del sultán Badr, pero alberga serias dudas sobre el gobernante de Granada. Sin embargo, la desunión significaría la perdición para los fieles, y se guarda sus observaciones para sí misma.\n\ n#bold Tu misión es simple: detener la Reconquista cristiana, hacer que paguen caro cualquier centímetro de tierra. Entonces, tal vez, será es hora de probar los verdaderos motivos del sultán Badr ... ¡#!"
 bookmark_patronwar_chrysantha_desc:0 ""
 
 bookmark_patronwar_zethraeus_desc:0 ""
bm_1375_patronwar:0 "La guerra de los patrones"
bm_1375_patronwar_desc:0 "Este marcador sigue el modelo de los deseos de nuestro Patrón y no representa el canon de WoD . Después de la Peste Negra, el caos se apoderó de la sociedad de los Vástagos. Con el agotamiento del suministro de sangre, muchos vampiros entraron en letargo, otros fueron destruidos. humanidad se abre paso a garras de la devastación, los parientes que soportaron la muerte negra forjan nuevos imperios y reinos después".
bookmark_patronwar_cecil:0 "Cecil"
 bookmark_patronwar_eden_desc:0 "Llama la atención el secuestro de mortales (particularmente ejemplares de buen físico, fuertes, hermosos, etc.); particularmente cuando la mayoría de los tomados se encuentran... como restos. Los difuntos parecen haber sido cruelmente experimentados; con algunas de sus extremidades u órganos deformados casi más allá del reconocimiento. Por desgracia, la buena ayuda es difícil de encontrar y esas personas 'de confianza' que Eden encargó (asalariados) con la eliminación de los fallos, decidieron tirar los cuerpos en algún lugar conveniente, asumiendo que serían contados como más asesinatos (de un tipo mundano) en la región. Sin embargo, cualquiera que esté remotamente familiarizado con los efectos de Vicisitud aumentaría sus sospechas."
bookmark_patronwar_cecil_desc:0 ""
bookmark_patronwar_lvcivs:0 " Lvcivs "
bookmark_patronwar_lvcivs_desc:0 “”
 bookmark_patronwar_ciaran_desc:0 "Ciarán fue un Viajero irlandés, o más exactamente, un Mincéirí o uno de los lucht siúil (literalmente, 'la gente que camina'). Era un joven de 23 años que simplemente hizo lo que necesitaba para sobrevivir y mantener a su familia. A menudo eso significaba mentir y hacer trampa porque no tenía muchas otras habilidades. Independientemente de su naturaleza deshonesta, la familia siempre fue lo más importante para él, y veía a todos los lucht siúil como su familia. Cualquier nómada lo respetaba casi tanto. Por eso le ofreció un hogar a un extraño viajero indostaní que se hacía llamar Viswanathan.\n\nViswanathan era un vampiro matusalén del [Clan|E] Ravnos. Afortunado, porque su campamento pronto sería asaltado por lugareños y el irlandés herido de muerte. Viswanathan traicionó sus propios principios con [Embrace|E] Ciarán y le salvó la vida. Enseñándole el Camino de la Paradoja y advirtiéndole que nunca haga lo que acaba de hacer. Luego se fue."
bookmark_patronwar_seitheach:0 " Seitheach "
 bookmark_patronwar_hannibal_desc:0 "Los padres romanos asustaban a sus hijos diciéndoles, Hannibal ante portas -'Aníbal está a las puertas'- durante la Segunda Guerra Púnica. Persisten los rumores de que fue Abrazado por Brujah methuselah Troile en Carthage, pero se desconoce si sobrevivió a la destrucción de la ciudad o pereció con ella. Algunos incluso cuestionan si hubo un Hannibal. Había. Despertado del letargo en las ruinas de Hattusa, Hannibal regresa a su hogar ancestral y desde allí tiene un pensamiento, y solo un pensamiento. Destruir. Roma. O algo así."
bookmark_patronwar_seitheach_desc:0 “”
bookmark_patronwar_chrysantha:0 " Crisanta "
bookmark_patronwar_chrysantha_desc:0 “”
 bookmark_patronwar_rostislav_desc:0 ""
bookmark_patronwar_zethraeus:0 " Zetrao "
bookmark_patronwar_zethraeus_desc:0 “”
bookmark_patronwar_jose:0 "José"
bookmark_patronwar_jose_desc:0 "La vida mortal de José nació de un pescadero y su esposa en algún lugar del norte de la Península Ibérica, pero pasó la mayor parte de sus primeros años en las calles. Era más grande que la mayoría de los niños de su edad y usaba ese tamaño para crear problemas. a Aprendió en su adolescencia temprana que la gente pagaría por información, por lo que comenzó a recopilar tanta información como pudo para chantajearla o intercambiarla a través de escuchas clandestinas, seguimiento discreto o simplemente intimidación. de Sarria , donde fue visto por un vampiro visitante. Se dio cuenta de los talentos de José, y decidió que sería un candidato perfecto para engendrar. diablerizing|E ] el anciano.\n\ nEn el 1300, José toma el ducado de A Coruña y prometiéndose a sí mismo que gobernaría la Península Ibérica en nombre de la Bestia".
 bookmark_inquisitor_gauthier_desc:0 "El tercer hijo de un conde francés menor, Gauthier escuchó el llamado de Dios temprano en su vida y respondió de la única manera que conocía: la batalla. Su primer encuentro con un vampiro durante la Tercera Cruzada fue una revelación y Gauthier ha reunido un gran número de devotos Caballeros empeñados en luchar contra el mal. Esta fue razón suficiente para que se convirtiera en el fundador de Shadow Inquisition, donde es el líder en todos los asuntos militares. Gauthier es un temible combatiente y un líder carismático, pero la vejez lo está alcanzando, lo que le hace temer lo que vendrá para la Inquisición después de su muerte.\n\n#bold Tus hazañas han quedado atrás, pero aún tienes tiempo para asegúrate de que los Caballeros de Acre te sobrevivan. Ese es tu último deber en una larga vida sirviendo a Dios.#!"
bookmark_patronwar_eden:0 "Edén"
bookmark_patron_eden_desc:0 "El secuestro de mortales (particularmente buenos especímenes físicos, fuertes, hermosos, etc.) llama la atención; particularmente cuando la mayoría de los secuestrados se encuentran... como restos. Los muertos parecen haber sido cruelmente experimentados; con algunos de sus miembros u órganos torcidos casi más allá del reconocimiento. Por desgracia, es difícil encontrar una buena ayuda y esas personas "de confianza" que Eden encargó (asalariados) con la eliminación de las fallas, decidieron arrojar los cuerpos en algún lugar conveniente, asumiendo que serían contados como más Asesinatos convenientes (de un tipo mundano) en la región. Sin embargo, cualquiera que esté remotamente familiarizado con los efectos de Vicissitude vería sus sospechas aumentadas".
bookmark_patronwar_loukios:0 " Loukios "
bookmark_patronwar_loukios_desc:0 "Una vez un centurión romano de cierto renombre y seguidor secreto del culto de la diosa Isis. En los años que evitaron el colapso de Roma ante las hordas góticas, Loukios desertó cuando las guerras comenzaron a volverse impotentes y se enamoró cada vez más de los mitos egipcios. hasta el punto de que hizo una peregrinación a la tierra de las Arenas Tamizadas para comprender mejor a su diosa. Desafortunadamente, no encontró el conocimiento que tanto había buscado, solo los Seguidores de la Serpiente. Set lo saludó en los antiguos templos. Tomó un interés en él o tal vez su conocimiento del ejército romano".
bookmark_patronwar_ciaran:0 "Ciarán"
viajero irlandés , o más exactamente, un Mincéirí o uno de lucht siúil (literalmente, 'la gente que camina'). Era un joven de 23 años que simplemente hizo lo que necesitaba para sobrevivir y mantener a su familia. A menudo eso significaba mentir y hacer trampa porque no tenía muchas otras habilidades. Independientemente de su naturaleza deshonesta, la familia siempre fue lo más importante para él, y vio todo de una vez. siúil como su familia. Cualquier nómada lo respetaba casi tanto. Por eso le ofreció un hogar a un extraño viajero indostaní que se hacía llamar Viswanathan.\n\ nViswanathan era un vampiro matusalén del [ Clan|E ] Ravnos . Afortunado, porque su campamento pronto sería asaltado por lugareños y el irlandés herido de muerte. Viswanathan traicionó sus propios principios a [ Embrace|E ] Ciarán, salvándole la vida. Enseñándole el Camino de la Paradoja y advirtiéndole que nunca haga lo que acaba de hacer. Luego se fue".
bookmark_patronwar_hannibal:0 "Aníbal"
bookmark_patronwar_hannibal_desc:0 "Los padres romanos asustaban a sus hijos diciéndoles: Hannibal ante portas --'Hannibal está a las puertas'--durante la Segunda Guerra Púnica. Persisten los rumores de que fue Abrazado por Brujah methuselah Troile en Cartago, pero Se desconoce si sobrevivió a la destrucción de la ciudad o pereció con ella, y un solo pensamiento: Destruir Roma.
bookmark_patronwar_antariksha:0 " Antariksha-Chandra "
bookmark_patronwar_antariksha_desc:0 "Chandra es el dios de la Luna en el Rig-Veda, lo suficientemente mayor como para ser parte del Rig-Veda. Antariksha es el dios del espacio. Nacido alrededor del año 1500 a. C., abrazado probablemente alrededor del mismo tiempo."
bookmark_patronwar_rostislav:0 " Rostislav "
bookmark_patronwar_rostislav_desc:0 “”
 
bm_1230_inquisitor:0 "Edad Oscura: Inquisidor"
bm_1230_inquisitor_desc:0 "Anno Dei 1230. Dirigida por un grupo incondicional de cazadores de monstruos, la Santa Iglesia finalmente se ha dado cuenta de la amenaza que representan los vampiros. Formando una nueva organización secreta llamada Shadow Inquisition, estos héroes son los primeros humanos para intentar reconquistar la noche y hacer retroceder sus horrores. La tarea que tienen por delante es inmensa, y los malditos chupasangres han tenido siglos para atrincherarse y preparar su contraataque. Los llamados 'Inquisidores' están dispuestos a morir como mártires, si su sacrificio puede allanan el camino para un futuro mejor para la humanidad. Luchan por una causa, y eso es más de lo que cualquier vampiro podría reclamar.\n\ n#bold Eres la única esperanza para un mundo que desconoce la guerra que se libra por su misma alma.#!"
bookmark_inquisitor_gauthier:0 "Gauthier de Dampiere "
bookmark_inquisitor_gauthier_desc:0 "Gauthier, el tercer hijo de un conde francés menor, escuchó la llamada de Dios temprano en su vida y respondió de la única manera que conocía: la batalla. Su primer encuentro con un vampiro durante la Tercera Cruzada fue una revelación y Gauthier ha reunió un gran número de seguidores de devotos Caballeros empeñados en luchar contra el mal. Esta fue razón suficiente para que se convirtiera en el fundador de la Inquisición de la Sombra, donde es el líder en todos los asuntos militares. Gauthier es un temible combatiente y un líder carismático, pero la vejez lo está alcanzando, lo que le hace temer lo que vendrá para la Inquisición después de su muerte.\n\ n#bold Tus hazañas han quedado atrás, pero aún tienes tiempo para asegurarte de que los Caballeros de Acre te sobrevivan. último deber en una larga vida dedicada al servicio de Dios.#!”
bookmark_inquisitor_leopold:0 "Leopold de Murnau "
bookmark_inquisitor_leopold_desc:0 "Un descendiente menor de la casa von Murnau , Leopold era un niño enfermizo maldecido con una extraña habilidad: el poder de literalmente 'oler' el mal. En lugar de temerlo, el inteligente Leopold usó su don para ayudar a descubrir varios maquinaciones vampíricas en su casa. Sin embargo, no se detuvo allí, y pronto estuvo en Roma para ofrecer sus servicios a los recién creados Caballeros de Acre. Aquellos que intentan luchar contra el mal en sus múltiples formas . Pero esto es solo el comienzo de la lucha. No debes detenerte hasta que el último chupasangre sea conducido ante la luz de Dios.#!"
 bookmark_inquisitor_maria:0 " María-Inmaculada "
 bookmark_inquisitor_maria_desc:0 "La líder actual de las Hermanas de San Juan no es la fundadora de la orden, pero será tan fuerte como la de la Madre Teresa, su bendita predecesora. Llamarla personalmente formidable es sugerir que la El Papa es solo un poco santo Después de varios intentos fallidos por parte de Inquisidores menos hábiles, Maria - Immaculada ha decidido ir personalmente a las Islas Británicas, con la esperanza de encontrar al infame 'Dios-Rey' vampírico que presume gobernar estas islas. y el respaldo de las otras órdenes de la Inquisición, María está lista para enseñarle a este enemigo que solo hay un Dios.\n\ n#bold Estás seguro de que Inglaterra es un centro de actividad vampírica. Sería una gran ayuda para el Inquisición. Verás caer al Dios-Rey.#!"
bookmark_inquisitor_vittoria:0 "Vittoria Santini de Parma"
bookmark_inquisitor_vittoria_desc:0 "Una mujer de gran intelecto e intenso amor por Dios, Vittoria es la líder informal de la Orden Roja, los investigadores de la Inquisición de las Sombras. Posee un extraño sentido de cuándo romper las reglas y cuándo jugar precisamente por la carta ortodoxa. Como tal, ella era la elección obvia para la tarea más importante y peligrosa: purgar a Italia de la influencia de los vampiros y proteger a la Santa Sede. Ella descubre que la tarea será aún más compleja de lo previsto. ...\n\ n#bold Estás decidido a salvar a la Iglesia de sí misma, y la mejor manera de hacerlo es exponer y destruir a los vampiros de Italia. identificó dos objetivos principales, un supuesto cardenal en Milán y un abominación burlándose del Papa en la misma Roma...#!"
bookmark_inquisitor_aignen:0 " Aignen le Libraire"
bookmark_inquisitor_aignen_desc:0 "El maestro de espías occitano es el líder de los Oculi Dei, los ojos y los oídos de la Inquisición. Una vez lugarteniente de Rodrigue de Navarre, Aignen rompió con su amigo cuando se negó a unirse a la Inquisición de la Sombra. Aignen llora por su pérdida Amistad, pero sabe que la Santa Sede necesitará una poderosa fuerza de espías ingeniosos. Despreciado por sus antiguos aliados y aún desconfiado por los nuevos, Aignen recorre el camino solitario entre ser útil y ser tildado de hereje.\n\ n# audaz Francia es tu hogar, y conoces la influencia vampírica que se nutre aquí. La herejía cátara lo demostró muy bien. Con los pocos amigos que puedas reunir, debes tomar medidas para controlar la situación y, con suerte, demostrar tu utilidad para los demás. Inquisición de las Sombras.#!"
 bookmark_inquisitor_rodrigue:0 "Rodrigue de Navarra"
 bookmark_inquisitor_rodrigue_desc:0 "Rodrigue fue el primer cristiano que entró en contacto con los muertos vivientes, sobrevivió y luego decidió tomar las armas contra ellos. Un noble menor de Navarra, fue durante la herejía cátara cuando fue testigo del verdadero mal del mundo. " Desde entonces, Rodrigue ha estado tratando frenéticamente de destruir cualquier influencia vampírica percibida... que es casi todo el mundo, en su mente paranoica. James a su disposición.\n\ n#negrita Están en todas partes. La Inquisición de las Sombras es probablemente un aliado , pero no te arriesgas. Si quieren ayudar, está bien, pero salvarás a Iberia en tus propios términos y con tus propios métodos.#!"
    
 bookmark_warofprinces_anna_desc:0 "A Anna Comnena, una princesa bizantina, se le negó su derecho de nacimiento durante su vida... y una segunda vez durante su no vida. Mientras se abría paso en la estructura de poder de los no-muertos de Constantinopla, ocurrió la 4ª Cruzada, rompiendo cualquier apariencia de cordura en la Ciudad del Deseo del Mundo. Pero Anna es una conspiradora paciente y cuidadosa y logró asegurar el reino sucesor bizantino más poderoso, Nikaea, como su dominio. A ella no le importan los sueños y la utopía del pasado de Constantinopla, que la han distanciado de muchos otros sobrevivientes griegos, pero no dejará que eso la detenga de su premio. No otra vez.\n\n#negrita Constantinopla finalmente está a la vista. Que nadie se interponga frente a tu destino y finalmente será tuyo.#!"
bookmark_inquisitor_bayezid:0 "Bayezid"
bookmark_inquisitor_bayezid_desc:0 "Anteriormente, un ghoul esclavo del Caitiff [ cainite|E ] Stanislav de Calomena's Elegido, Bayezid y su hermano Basil encontraron su fe bogomil corrompida por los intereses de los no-muertos. Cuando Stanislav estaba durante la caída del Sueño de Michael en 1204 , los hermanos Gantenbein fueron liberados de sus lazos de sangre. Desde entonces, han tomado el nombre de ' Renegados de Calomena ' y han liderado a los fieles bogomilistas en ataques contra vampiros en toda Bosnia.\ nPara ganar poder, Bayezid cree que debe crear más ghoul cazadores como él.\n\ n#negrita Calomena , la hermana de Caine, desea la destrucción de sus chiquillos no muertos y tú eres su instrumento.#!"
BOOKMARK_CHARACTER_DIFFICULTY_VERY_HARD:2 " #difficulty_hard ¡ Muy Difícil#!"
 
bm_1230_warofprinces_sub_ventrue:0 "Clan Ventrue "
bm_1230_warofprinces_sub_ventrue_desc:0 "Los Ventrue , autoproclamados gobernantes del mundo Cainita, son los señores y damas reales de la noche. Hace tiempo que se enorgullecen de ser una de las mejores líneas de vampiros y trabajan duro para mantener una reputación de honor y comportamiento amable. , y liderazgo. Un sentido de noblesse oblige ha impregnado durante mucho tiempo al Clan, acompañado por la creencia genuina de que los Ventrue saben lo que es mejor para todos. Francia como uno de sus bastiones. Aún así, el clan Ventrue gobierna la noche medieval. Como debe ser.\n\ n#audaz El dominio del clan Ventrue no es negociable. Haz que aprendan.#!"
bookmark_warofprinces_alexander:0 "Alejandro"
bookmark_warofprinces_alexander_desc:0 "Después de más de un milenio como gobernante absoluto de Francia, Alejandro lo perdió todo en una conspiración dirigida por su propio chiquillo , Geoffrey du Temple. Ahora, en el exilio como invitado rechazado de la Cruz Negra, el poderoso Matusalén planea regresar No tiene casi nada en su nombre, excepto su impresionante poder personal y legitimidad... que cuenta poco en el gran esquema de las cosas. Es casi un nuevo comienzo para el otrora poderoso chiquillo de Ventrue .\n\ n # negrita ¿Podrás hacer que Geoffrey y Salianna paguen por su traición y recuperar el trono que te corresponde... o crear un nuevo legado en estas tierras del este?#".
bookmark_warofprinces_camilla:0 "Camilla"
bookmark_warofprinces_camilla_desc:0 "Titus Venturus Camille ocupó Roma durante la mayor parte de su gloriosa historia, siendo, sin duda, el [ cainita|E ] políticamente más importante de la Antigüedad. Camilla es una figura divisiva en la historia Ventrue , famosa por su perspicacia política y su glorioso liderazgo de Su imperio más poderoso, pero también rechazado por haber fundado el Camino del Pecado, un código de moralidad demasiado... decadente para la mayoría de los gustos Ventrue . Cartago y todavía es elogiado por este logro hasta esta noche . Despertado en un mundo nuevo y extraño, ¿te levantarás para gobernar una vez más todo el mundo [ cainita|E ] para la gloria de una Roma vibrante y decadente? #!"
bookmark_warofprinces_hardestadt:0 " Hardestadt "
bookmark_warofprinces_hardestadt_desc:0 " Hardestadt es el primero de una nueva generación de líderes Ventrue mejor acostumbrados al mundo medieval que sus mayores romanos. Viniendo de un linaje oculto con pocos activos, el señor de la guerra bávaro usó hábilmente la ascensión del Sacro Imperio Romano mortal para cambiar el centro de gravedad de los Ventrue desde Roma hasta Alemania, cimentando su influencia sobre sus hermanos en el proceso.\ nHardestadt ha conocido muy pocos reveses desde su ascensión al poder, pero aún quedan asuntos por resolver, como los obstinados romanos bajo Julia Antasia ...\n\ n#bold Tienes un reino poderoso y chiquillos en desarrollo y aliados a tu disposición. Deshazte del pasado de Roma y definirás lo que significa ser un Ventrue en los siglos venideros.#!"
bookmark_warofprinces_antasia:0 "Julia Antasia "
bookmark_warofprinces_antasia_desc:0 "La hija de la República Romana es una Ventrue de otra época, una en la que su [ Clan|E ] era la guardiana del Senado Eterno, una utopía en el despiadado mundo de los [ cainitas|E ]. Era la de Julia mundo perfecto, cada Ventrue tenía el derecho de expresión y poder de voto independientemente de su edad o sexo. Las leyes del senado se convertirían en las tradiciones del [ Clan|E ] durante los próximos milenios... Luego, Camilla y su decadente llegó la locura, seguida por Hardestadt y su despiadada ambición.\ nDesde su principado en Frankfurt, Julia no ha perdido la esperanza de devolver su [ Clan|E ] a sus raíces. El idealismo aún podría ser un camino para el [ Clan|E ] Ventrue futuro.\n\ n#bold No puedes dejar que Hardestadt , o peor aún, Camilla, dicte el futuro de [ Clan|E ] Ventrue . ¡Debes luchar por el Senado y la República!#!"
bookmark_warofprinces_jurgen:0 "Jürgen von Verden "
bookmark_warofprinces_jurgen_desc:0 "El aclamado caballero alemán es la mano derecha de Hardestadt y, a pesar de su corta edad, ya ha dado a conocer su nombre en todas partes. Jurgen, gobernante estricto pero justo de Magdeburgo, es el perfecto caballero Ventrue , valiente y despiadadamente ambicioso al mismo tiempo.\ nJurgen recientemente emprendió la guerra contra los Tzimisce Voivodato y forzó la creación de un estado tampón. Pero esto no es suficiente y ya está planeando su próxima ofensiva... tan pronto como pueda deshacerse de Alejandro, el engorroso Príncipe exiliado de Francia.\n\ n#bold Su honor es su palabra, y esa es la Sólo límite sufrirás a tu ambición. Por fuego y espada, por conquistas y diplomacia, [ Clan|E ] Ventrue algún día se inclinará ante ti.#!"
bookmark_warofprinces_anna:0 "Ana Comnena "
Comnena , una princesa bizantina, se le negó su derecho de nacimiento durante su vida... y una segunda vez durante su no vida . Mientras se abría camino en la estructura de poder de los no muertos de Constantinopla, se produjo la 4.ª Cruzada, que rompió cualquier apariencia de Pero Anna es una conspiradora paciente y cuidadosa y logró asegurar el reino sucesor bizantino más poderoso, Nikaea , como su dominio. Otros sobrevivientes griegos, pero no dejará que eso la detenga de su premio. No otra vez.\n\ n# audaz Constantinopla finalmente está a la vista. No dejes que nadie se interponga frente a tu destino y finalmente será tuyo.#!"
bookmark_warofprinces_anadja:0 " Anadja "
bookmark_warofprinces_anadja_desc:0 "La hija de un comerciante persa, Anadja estaba destinada a una vida sin complicaciones hasta que Belisario y Shabah se enorgullecieron de ella y la criaron como su propia chiquilla . Con mentores tan impresionantes, Anadja se adaptó rápidamente a [ cainite|E ] mundo y pronto fue notada por un culto secreto que la veía como su salvadora prometida.\ nDesde entonces, Anadja se ha convertido en el vampiro más influyente en Armenia y todavía recibe la tutoría tanto de sus 'padres' como del culto. ahora tiene la edad suficiente para gobernar por sí misma y solo el tiempo dirá si estará a la altura de las elevadas expectativas puestas en ella.\n\ n#bold Has sido preparado por expertos para este momento y solo tú puedes contar el final. #!"
    
vampire_main_sub_bookmark:0 "Principal"
 bookmark_warofprinces_alfonzo_desc:0 "Uno de los chiquillos más talentosos del influyente Narsés, Alfonso de Venecia ha sido el [cainita|E] latino más destacado en Constantinopla durante más de dos siglos. Conocido por haber instigado los disturbios latinos de 1185, Alfonzo también ha utilizado la Cuarta Cruzada para proclamarse Príncipe de la Ciudad en ruinas del Deseo del Mundo, ganándose un gran poder... y la eterna enemistad de los muchos griegos exiliados [cainitas|E ]. Seguidor nominal de la Herejía [cainita|E] como su [Sire|E], Alfonzo es ante todo un pragmático insensible, y ya ha jurado lealtad al Mar de las Sombras para asegurar su poder, a pesar de sus puntos de vista opuestos sobre su fe. Sin embargo, es posible que se necesiten muchos más tratos con el diablo en el futuro...\n\n#audaz Trabajaste incansablemente para asegurarte el mayor premio. Nadie te quitará Constantinopla.#!"
ventrue_sub_bookmark:0 " Ventrue "
lasombra_sub_bookmark:0 " Lasombra "

exit_char_window:0 "Volver"
 
 bm_1230_warofprinces_sub_lasombra:0 "Clan Lasombra "
 bm_1230_warofprinces_sub_lasombra_desc:0 "Depredadores sombríos y trepadores sociales despiadados, los Lasombra existen para su propio éxito, luchando por victorias personales en lugar de una corona para usar o un trono para sentarse. Creen que eso podría hacer lo correcto y están dispuestos a sacrificar cualquier cosa. para lograr sus objetivos.\ nUn clan que utiliza la espiritualidad como una herramienta en lugar de buscar la iluminación honesta, sus volubles lealtades se destacan actualmente por la guerra civil masiva que está suplicando el Mar de las Sombras, su imperio que alguna vez se extendió por el Mediterráneo. en Iberia, los cristianos luchan contra los herejes en Italia y los jóvenes luchan contra sus mayores en todas partes a la vez. Los otros clanes suspiran aliviados cuando los Lasombra se separan , sabiendo lo que podrían lograr si se unieran en su lugar.\n\ n#bold Clan Lasombra se forjará de nuevo con su propia sangre. Derrámala y conquista.#!"
bookmark_warofprinces_lucita:0 " Lucita de Aragón"
 bookmark_warofprinces_salianna_desc:0 "Nacida en Grecia alrededor del año 170 a. C., Salianna era una vestal de los dioses antiguos y nunca perdonó a su [Señor|E], el poderoso Miguel, por contaminar espiritualmente su pureza. Negándose a ayudarlo en sus locos sueños de inmortalidad, se puso en marcha por su cuenta, pero solo conoció la traición y el engaño durante varios siglos antes de establecerse en París. Finalmente encontró el éxito aquí y trabajó para hacer prosperar a Francia junto con Alejandro, su señor supremo vampírico.\nY luego fue traicionada nuevamente, ya que Alejandro mató a su propio chiquillo amado en un ataque de ira. Fue la gota que colmó el vaso. Orquestó un golpe de estado con la ayuda del propio chiquillo de Alejandro y expulsó a los Ventrue de Francia. Ahora, Salianna es el verdadero poder de la región, pero su control aún es débil... y Alexander no está muerto.\n\n#negrita Consolide su nuevo poder rápidamente. Nadie podrá traicionarte nunca más.#!"
bookmark_warofprinces_lucita_desc:0 "Hija del rey Alfonso II de Aragón, Lucita siempre anheló la autonomía y la libertad desde muy joven. Su feroz independencia y voluntad indomable fueron irresistibles para el poderoso cardenal Lasombra Ambrosio Luis Moncada y él la abrazó desde entonces, Lucita ha Ha sido la estrella en ascenso de [ Clan|E ] Lasombra y el orgullo de su [ Sire|E ] A pesar de los elogios que recibe y los muchos logros que ya ha logrado, la feroz princesa ya anhela, una vez más, más libertad. .. algo que va en contra de los deseos tanto de su [ Sire|E ] como de su [ Clan|E ].\n\ n#bold Nadie puede enjaularte por mucho tiempo, Lucita . Gánate tu independencia, incluso si tienes que quemarte todo tu [ Clan|E ] por ello.#!"
 bookmark_warofprinces_moncada:0 "Ambrosio Luis Moncada"
 bookmark_warofprinces_moncada_desc:0 "Hombre de ambición, talento y fe, Ambrosio Luis Moncada fue Arzobispo de Madrid en vida. Para sorpresa de nadie, Monçada aprovechó al máximo su cargo. Sin embargo, para sorpresa de muchos, lo hizo mientras Él mismo, fiel a un monacato estricto , absoluto en su fe, inquebrantable en su convicción y resuelto en el uso del poder para lo que consideraba las causas del Cielo, pronto se convirtió en el principal impulsor de la Sombra Reconquista y su La influencia dentro del [ Clan|E ] Lasombra está aumentando constantemente, pero sus razones para buscar el poder no han cambiado . más bien para la gloria de Dios.\n\ n#bold Estás destinado a gobernar Iberia y el mismo [ Clan|E ] Lasombra Dios te escogió para su santa tarea y cumplirás su voluntad, como siempre lo haces.# !"
bookmark_warofprinces_badr:0 " malo "
bookmark_warofprinces_badr_desc:0 "Mientras continúa la guerra civil de los Lasombra ibéricos, los [ cainitas|E ] andaluces , conocidos como [ ashirra|E ], han encontrado un nuevo líder: Badr de Granada. Este misterioso sultán ha adoptado una postura inflexible y se está reuniendo Su esfuerzo ha dividido a la comunidad [ ashirra |E ], ya que muchos la ven como no mucho mejor que los cristianos, pero aun así ha logrado frenar la temida Reconquista. para interesarse en los misterios que la rodean... y algunos de esas almas curiosas ya han encontrado un final doloroso. Badr gobierna con un puño de hierro sombrío, pero un puño de hierro al fin.\n\ n#audaz Debes triunfar contra la Reconquista. Este es un trampolín para tu ambición, y ay de los que se interponen en tu camino.#!"
bookmark_warofprinces_lucius:0 "Lucio Aelius Sejanus"
bookmark_warofprinces_lucius_desc:0 "Una vez pretoriano de Roma, Lucius Aelius Sejanus estuvo a punto de convertirse en emperador, pero fue interrumpido antes de que pudiera lograr su ambición. Muriendo a orillas del Tíber, el lugar donde una loba supuestamente descubrió a Rómulo y Remo, un Lasombra sacó el cuerpo de Sejanus de las corrientes. Al ver que las brasas finales de la vida todavía parpadeaban dentro de su pecho, el anciano lo abrazó. Lo dejó con estas palabras: 'Volverás a gobernar, como siempre debiste hacerlo. buscó combatirte. Tienes el potencial de volverte más grande que tu maestro. Úsalo sabiamente". Desde entonces, el que alguna vez fue Emperador ahora busca convertirse en Emperador de la Noche, y sus primeros movimientos en este gran juego llegarán pronto. ..\n\ n#bold Una noche, ejercerás el poder para amenazar a los más poderosos de tu especie. Asegúrate de que tu verdadero destino no se vea truncado esta vez.#!"
 bookmark_warofprinces_gratiano:0 " Graciano de Veronese"
 bookmark_warofprinces_gratiano_desc:0 "Gratiano de Veronese, el último y aún muy joven chiquillo del propio Lasombra , fue un noble italiano corriente en vida, lo que llevó a muchos a preguntarse por qué el [ antediluviano|E ] lo favorecía tanto. Sin embargo, Gratiano conoce la respuesta: su propia grandeza inherente. Convenciéndose a sí mismo de su importancia, el Veronés ahora está irritado abiertamente contra su "hermano mayor" Montano, el actual regente del [ Clan|E ] Lasombra . Desde su corte en Verona, Gratiano es muy consciente de que es despreciado y despreciado. todos menos el más joven de los suyos [ Clan|E ]. Pero incluso una base de poder tan pequeña y débil puede crecer con el tiempo y una noche, Gratiano podría ser el que se ría de todos ellos...\n\ n#negrita Debes ganarte el respeto y el poder rápidamente si vas a desafiar a tu 'hermano' por su título. Entonces, podría ser el momento de hablar con tu 'padre' en persona... ¡#!"
bookmark_warofprinces_alfonzo:0 "Alfonso de Venecia"
bookmark_warofprinces_alfonzo_desc:0 " Alfonzo de Venecia, uno de los hijos más dotados del influyente Narsés, ha sido el [ cainita |E ] latino más prominente en Constantinopla durante más de dos siglos. Conocido por haber instigado las revueltas latinas de 1185, Alfonso también ha usó la Cuarta Cruzada para proclamarse Príncipe de la Ciudad en ruinas del Deseo del Mundo, lo que le valió un gran poder... y la enemistad eterna de los muchos [ cainitas|E ] griegos exiliados. Nominalmente un seguidor de la [ cainita|E ] Herejía Al igual que su [ Sire|E ], Alfonzo es ante todo un pragmático insensible, y ya ha jurado lealtad al Mar de las Sombras para asegurar su poder, a pesar de sus puntos de vista opuestos sobre su fe. Muchos más tratos con el diablo podrían aunque será necesario en el futuro...\n\ n#bold Has trabajado incansablemente para conseguir el mayor premio.
 bookmark_warofprinces_rosamund_desc:0 "Rosamund ha sido preparada para la grandeza desde su nacimiento como hija de un noble normando menor. Elegida a una edad temprana para unirse a la corte de Isouda de Blaise, Rosamund prosperó en ella. Aprendió a parecer tanto modesta como coqueta, a entrenar con su ingenio ya encantar con su sonrisa. En su decimoséptimo cumpleaños, la llamaron a presencia de Isouda y la felicitaron. Entonces su ama le habló de su destino: ser iniciada en las filas de los [cainitas|E]. Desde entonces, Rosamund se ha enamorado del propio Alexander, el poderoso gobernante Ventrue de la Gran Corte, y él se la llevó con él en su exilio a Magdeburg. El opresivo Matusalén está cada vez más trastornado por la noche, y Rosamund busca cualquier escape que pueda encontrar...\n\n#negrita Debes liberarte de Alejandro antes de que sea demasiado tarde. ¿Quizás el apuesto señor de Magdeburg, Jurgen von Verden, podría ayudar?#!"
bookmark_warofprinces_suleiman:0 "Solimán ibn Abdalá"
bookmark_warofprinces_suleiman_desc:0 "Suleiman primero se acercó a Muhammad en Medina para convertirlo en un peón para usarlo contra los poderosos [ cainitas|E ] de La Meca. Él mismo dijo que en ese momento vio la posibilidad de salvación dentro de él y se sometió a la nueva religión difundió el Profeta. Más tarde, estuvo a su lado durante sus conquistas y fue uno de los principales fundadores de la secta [ ashirra|E ], dando la bienvenida a todo musulmán abrazado y dispuesto a seguir la palabra. ashirra|E ] se está extendiendo desde Iberia a Persia, pero comienzan a formarse grietas en su aparente unidad. Suleiman debe actuar rápidamente antes de que esta desunión temprana debilite el trabajo de su vida a un nivel peligroso.\n\ n#bold Keep the [ ashirra|E ] fuerte y unido, y tal vez [ Clan|E ] Lasombra mismo podría aprender la verdad una noche.#!"
        
 toreador_sub_bookmark:0 "Torero"
       
bm_1230_warofprinces_sub_toreador:0 "Clan Torero"
 bm_1230_warofprinces_sub_toreador_desc:0 "Los Toreador son un clan de vampiros conocidos por ser algunos de los más hermosos, sensuales, seductores, emotivos y glamurosos de la Vástago. Los Estetas son responsables de las leyendas de vampiros que seducen y atraen a sus presas con belleza, amor y la sensualidad.\ nTampoco rehúyen el arte de gobernar y, hasta hace muy poco, tenían el poder en el posiblemente mayor Imperio vampírico, el Sueño de Constantinopla . Francia significa que los Toreador tienen una nueva, aunque todavía frágil, bastión. Además de Francia, los Toreador ocupan posiciones menores de poder en toda Europa y Oriente Medio, y siguen siendo una de las principales fuerzas impulsoras del mundo Cainita . #negrita La noche necesita un nuevo gobernante elegante pero letal. Muéstrale al mundo que las rosas tienen espinas.#!"
bookmark_warofprinces_salianna:0 " Saliana "
 bookmark_warofprinces_leeland_desc:0 "El hombre detrás del capó ha luchado contra los tiranos toda su vida y su vida. Sus rasgos duros y sucios estuvieron presentes en varios levantamientos plebeyos a lo largo de la Edad Media: participó directamente en varias rebeliones campesinas contra la nobleza inglesa, fue un defensor particularmente fuerte de las tendencias anarquistas y, a menudo, luchó en el frente durante las escaramuzas militares.\nPero intente por más que pudo, nunca pudo vencer a Mitra, el 'Dios-Rey' de Inglaterra. Completamente derrotado en la batalla de Kirklees Abbey, el aura y la influencia de Robin se han debilitado considerablemente y Mithras se acerca para matar. La luz de la libertad pronto podría morir para siempre en las Islas Británicas.\n\n#negrita Tu causa es justa, tu objetivo es verdadero. Puede que no sea suficiente para la victoria, pero lo será para crear una leyenda.#!"
bookmark_warofprinces_salianna_desc:0 "Nacida en Grecia alrededor del año 170 a. C., Salianna era una vestal de los dioses antiguos y nunca perdonó a [ Señor|E ], el poderoso Miguel, por haber contaminado espiritualmente su pureza. Se negó a ayudarlo en sus locos sueños de inmortalidad, se lanzó por su cuenta, pero solo conoció la traición y el engaño durante varios siglos antes de establecerse en París. Finalmente encontró el éxito aquí y trabajó para que Francia prosperara junto con Alejandro, su señor supremo vampírico.\ nY luego fue traicionada nuevamente, como Alexander mató a su amado chiquillo en un ataque de ira. Fue la gota que colmó el vaso. Ella orquestó un golpe de estado con la ayuda del propio chiquillo de Alexander y expulsó a los Ventrue de Francia. Ahora Salianna es el verdadero poder en la región. Pero su agarre aún es débil... y Alexander no está muerto.\n\ n#bold Consolide su nuevo poder rápidamente.
 bookmark_warofprinces_veronique_desc:0 "Veronique d'Orleans es una mujer de muchas habilidades. Es una política capaz entre los [cainitas|E] de Francia (e incluso más allá), una firme defensora de sus amigos y aliados mortales, una fuerte guerrera, una hábil sanadora y una jugadora, incluso a su corta edad, en el Guerra de príncipes.\nEngendrada por su sensatez y su mente innovadora, Veronique siempre se opone a lo que la sociedad, ya sea mortal o vampírica, piensa de ella. Recientemente participó en el derrocamiento de Alejandro, el Príncipe de Francia, pero desconfía de la política despiadada de París. Como tal, está de regreso en su ciudad natal mientras los [cainitas|E] franceses se preguntan cuál será su próximo movimiento inesperado.\n\n#audaz Mantente fiel a tus ideales y deja que los demás te subestimen. Pronto comprenderán que la compasión no es debilidad.#!"
bookmark_warofprinces_isouda:0 " Isouda de Blaise"
bookmark_warofprinces_isouda_desc:0 " A Isouda nunca le gustó el destino que le esperaba como hija de la nobleza menor. Lo odiaba tanto que mordió ferozmente a un pretendiente potencial para asegurarse de que entendiera su punto. Isouda no cambió mucho una vez que se convirtió en [ cainita | E ] , su gracia y belleza apenas ocultan una agresividad y una crueldad casi salvajes... que le permitieron asegurar el poder como Reina del Amor mucho antes de lo que su corta edad le permitiría. aferrarse a Francia para promover sus propios fines. La Reina de Anjou no es una Rosa con espinas, es una Rosa con dientes afilados.\n\ n#audaz Por fuera eres hermosa, elegante, incluso agradable. Por dentro. .. sabes que todos son peones para usar y descartar a tu antojo. Tu maldita ascensión apenas está comenzando.#!"
bookmark_warofprinces_esclarmonde:0 " Esclarmonde "
bookmark_warofprinces_esclarmonde_desc:0 "En otro tiempo, la corte de Esclarmonde fue un centro de poesía, amor y artes. Bajo su paciente guía, Occitania se había convertido en un bastión de tolerancia y cultura.\ nEntonces llegaron los brutales franceses. Esperaban que Esclarmonde se doblegara rápidamente ante el ataque de la Cruzada contra los Albigenses, pero se sorprendieron al descubrir en ella una valiente defensora y una política capaz. La región ha sufrido mucho, y Esclarmonde tuvo que hacer muchos compromisos con los "Cruzados" para sobrevivir. Tal como es, Occitania resistirá. n\ n#bold Has tenido tiempo de reagruparte y forjar nuevas alianzas, pero los arrogantes franceses no volverán a subestimarte. Debes mantenerte fuerte y salvar a tu amado país, ¡nadie más puede hacerlo .#!"
bookmark_warofprinces_melinda:0 "Melinda Galbraith"
 bookmark_warofprinces_yitzhak_desc:0 "Nacido en Praga como el único hijo de un rabino judío, la primera respuesta de Yitzhak a la mayoría de los eventos es de simpatía y cariño, un hecho que fue el catalizador de su [Abrazo|E], su [Señor|E] pensando que tal amabilidad había para ser preservado A pesar de la conmoción justificada por su estado ahora maldito, la muerte de Yitzhak cambió poco en su comportamiento y después de algunos años de pasión por viajar por Europa, regresó a su Polonia natal.\nDurante sus viajes, vio cómo se trataba a los judíos en Europa y cómo muchos vampiros vagaban solos por las noches, excluidos de los demás por la simple lealtad a su [Clan|E] o generación. Su deber espiritual es crear un lugar donde todos los seres puedan coexistir, como Dios quiso que fueran.\n\n#la audaz Polonia podría ser el refugio seguro con el que siempre soñaste, pero todavía quedan muchos obstáculos por delante a tu manera.#!"
bookmark_warofprinces_melinda_desc:0 "El pasado de Melinda está envuelto en misterio y lo único que se sabe con certeza es que nació en España antes de ser secuestrada por Helena. Incluso para los métodos habitualmente insensibles [ Embrace|E ] de Matusalén, el de Melinda fue sórdido y cruel . asunto antes de que Helena se aburriera y la dejara sola para valerse por sí misma. La Melinda que emergió del crisol del 'cuidado' de Helena era una sobreviviente despiadada, sin consideración por nada más que sus propias ambiciones. Un verdadero depredador ahora está desatado en Iberia, y si tiene que dejar una pila de cadáveres detrás de ella para ascender, que así sea.\n\ n#bold Has aprendido mucho de Helena y sabes la verdad: este mundo es un campo de batalla sangriento donde solo unos pocos pueden prosperar . .Tú serás uno de esos.#!"
bookmark_warofprinces_rafael:0 "Rafael de Corazón"
bookmark_warofprinces_rafael_desc:0 "Adoptado por la Iglesia a una edad temprana, Rafael descubrió rápidamente su talento para las intrigas insignificantes. No era muy hábil ni entusiasta, pero usó sus planes para ganar cierta influencia sobre los monjes locales y vivir una vida cómoda. Entonces, una noche , acudió Callisti y Castillo, esta bruja pagana se enamoró de una de las esculturas de los monjes... de la que Rafael se atribuyó el mérito, así que lo abrazó y le pidió que hiciera más de este arte, cosa que obviamente el estafador era Enojada, casi lo mata en el acto hasta que Rafael rogó por su no-vida diciendo que su engaño era una forma de arte después de todo . ] mundo.\n\ n#bold No tienes idea de cómo diablos sobreviviste, pero tú lo hiciste. Ahora necesitas entender este nuevo y extraño mundo. ¿Quizás hay otros tontos a los que engañar para que te enseñen más? #!"
bookmark_warofprinces_karl:0 "Karl el Azul"
bookmark_warofprinces_karl_desc:0 "Como narrador nórdico, Karl viajó al sur con Bjorn Ironside en busca de riquezas y aventuras, y fue abrazado en Alejandría por un incrédulo Toreador. Después de un tiempo con su [ Sire|E ] aprendiendo las historias de los árabes , Karl hizo su camino a casa, usando su existencia interminable para catalogar todas las historias de la tradición nórdica. Cuando llegaron los cristianos, Karl luchó duro, pero pronto vio la escritura en la pared. Como tal, se mudó a Finlandia para crear el ' Estado Libre', un último bastión donde sus queridas historias se mantienen vivas... pero incluso en esta tierra remota, la sombra de la Cruz crece.\n\ n#audaz Luchas por una causa mayor que tú mismo, y defiende el legado de tu gente tanto como puedas. Pero ya sabes cómo terminan la mayoría de las historias nórdicas... ¡#!"
bookmark_warofprinces_rosamund:0 " Rosamunda de Islington"
bookmark_warofprinces_rosamund_desc:0 " Rosamund ha sido preparada para la grandeza desde su nacimiento como hija de un noble normando menor. Elegida a una edad temprana para unirse a la corte de Isouda de Blaise, Rosamund prosperó en ella. Aprendió a parecer tanto modesta como coqueta, para pelear Con su ingenio y el encanto de su sonrisa . Rosamund se ha enamorado del mismísimo Alejandro, el poderoso gobernante Ventrue de la Gran Corte, y él se la llevó con él en su exilio a Magdeburg. find...\n\ n # bold Debes liberar alejarte de Alexander antes de que sea demasiado tarde.
                  
brujah_sub_bookmark:0 " Brujah "
       
bm_1230_warofprinces_sub_brujah:0 "Clan Brujah "
bm_1230_warofprinces_sub_brujah_desc:0 "Un clan de eruditos guerreros conocido por su feroz devoción a las filosofías radicales, los Brujah a menudo entrenan a sus neonatos en combate y a los clásicos con igual disciplina. Durante la era clásica, eran iguales a los Ventrue , con gran posiciones de poder a lo largo del Mediterráneo. Luego, su utopía de Cartago fue destruida a manos de los odiados romanos. Ahora el Clan es un clan caído, que sigue de luto por la muerte de su paraíso y en decadencia de su era de gobernantes benévolos a los pequeños rebeldes. cada vez más comunes esta noche.\ nAbrumados por su ira y su dolor, los Brujah arremeten contra causas perdidas hasta que finalmente puedan encontrar su nuevo destino. A algunos ancianos les preocupa que nunca suceda.\n \ n en transición entre su glorioso pasado y un futuro desconocido. Grandes líderes como usted podrían ser la chispa que definirá quiénes son en los siglos venideros.#!"
bookmark_warofprinces_bjorn:0 "Bjorn Garinson "
bookmark_warofprinces_bjorn_desc:0 "Este temible gigante es uno de los últimos Einherjar (vampiros vikingos) de las Islas Británicas. Varado en Escocia mientras huía de la batalla perdida que su pueblo libra en Noruega, Bjorn mira cada vez más hacia el oeste, hacia el Vinland de las leyendas. Pero su carisma y su fuerza silenciosa lo han convertido en el punto de reunión de facto de la resistencia contra Mithras en el país. A pesar de su falta de voluntad para pelear otra batalla perdida, Bjorn nunca se da por vencido con sus amigos y con gusto recogerá su hacha por ellos. una vez más.\n\ n#bold Estás acostumbrado a las batallas desesperadas. ¡Pero tal vez haya esperanza para esta...#!"
bookmark_warofprinces_leeland:0 "Robin Leeland "
bookmark_warofprinces_leeland_desc:0 "El hombre detrás de la capucha ha luchado toda su vida y contra los tiranos de la vida . Sus rasgos duros y sucios estuvieron presentes en varios levantamientos plebeyos a lo largo de la Edad Media, teniendo una mano directa en varias rebeliones campesinas contra la nobleza inglesa, siendo un particular Fuerte defensor de las tendencias anarquistas y, a menudo, lucha al frente durante las escaramuzas militares.\ nPero por más que lo intentó , nunca pudo vencer a Mithras, el 'Dios-Rey' de Inglaterra. . La luz de la libertad pronto podría morir para siempre en las Islas Británicas.\n\ n#negrita Tu es justo, tu objetivo es cierto. Pero lo será para crear una leyenda.#!”
bookmark_warofprinces_veronique:0 "Véronique d'Orléans "
bookmark_warofprinces_veronique_desc:0 "Veronique d'Orleans es una mujer con muchas habilidades. Es una política capaz entre los [ cainitas|E ] de Francia (e incluso más allá), una firme defensora de sus amigos y aliados mortales, una fuerte guerrera, una Sanadora experta y jugadora, incluso a su edad extremadamente joven, en la Guerra de los Príncipes.\ nEngendrada por su sensatez y su mente innovadora, Veronique siempre se opone a lo que la sociedad, ya sea mortal o vampírica, piensa de ella. participó recientemente en el derrocamiento de Alejandro, el príncipe de Francia, pero desconfía de la política despiadada de París . .\n\ n#bold Mantente fiel a tus ideales y deja que los demás te subestimen.
 bookmark_warofprinces_claudius_desc:0 "Hijo y chiquillo de Augustus Giovanni, Claudius fue Abrazado poco tiempo después de que su padre fuera aceptado en el [Clan|E] de la Muerte. Un nigromante competente, también es un político capaz y, a menudo, se lo considera la mano derecha de Augusto... cuando este título no se le otorga a Ambrogino Giovanni, un hecho que ha creado cierta tensión entre los dos.\nClaudius es uno de los pocos al tanto de los verdaderos planes de Augustus y hasta ahora no ha mostrado nada más que una devoción inquebrantable por su padre. Su tarea actual es la supervisión de las crecientes posesiones venecianas en el caído Imperio Bizantino, asegurándose de que la familia emerja de este vacío de poder.\n\n#bold Sea diligente en sus nuevos deberes, y tal vez finalmente pueda deshacerse de ese fastidioso Ambrogino de una vez por todas.#!"
bookmark_warofprinces_menele:0 " Menele "
 bookmark_warofprinces_markus_desc:0 "Markus Musa Giovanni, el bisnieto más joven de Claudio, fue admitido en el [Clan|E] por su agudo sentido de la curiosidad y su agudo intelecto. Una vez Abrazado, demostró ser un erudito excepcional y, sobre todo, un excelente historiador. Se enorgullecía de su linaje como capadocio y trató de demostrar el valor de su familia a los escépticos del [Clan|E].\nDespués de su primera asignación en Constantinopla, Markus tuvo un encuentro con el poderoso exiliado Lázaro y logró escapar de él mientras recopila información crítica. Estos primeros éxitos lo han convertido en la estrella en ascenso de la familia y su nueva misión podría elevarlo aún más.\n\n#bold Eres un Giovanni y un Capadocio, y tus dos familias se enorgullecen de contarte como uno de sus miembros. miembros ¿Qué puede salir mal?#!"
bookmark_warofprinces_menele_desc:0 "Un rey en la antigua Grecia durante el siglo XIII a. C. durante su vida, Menele estaba asombrado por lo que los [ cainitas|E ] de Cartago habían logrado y pronto asumió el papel de diplomático viajero debido a su reputación como un poderoso guerrero. y orador. Por lo tanto, no estaba en la ciudad cuando llegó la gran traición, a manos de una hermosa Toreador llamada Helena.\ nSu legendaria rivalidad comenzó este día. Han luchado en innumerables campos de batalla y destruido ciudades a su paso, pero , ninguno de ellos ha sido capaz de tomar la delantera. Menele se está cansando de este 'juego', especialmente cuando ve a [ Clan|E ] Brujah desmoronarse a su alrededor. Se debe llegar a una conclusión, sea la que sea. .\n\ n#bold Tu ira finalmente se está calmando, pero Helena aún debe ser llevada ante la justicia. ¡Entonces, podría ser el momento de curar a [ Clan|E ] Brujah .#!"
bookmark_warofprinces_ecaterina:0 " Ecaterina "
bookmark_warofprinces_ecaterina_desc:0 "Una mujer testaruda en un mundo de hombres, Ecaterina apenas sobrevivió a una experiencia cercana a la violación, rescatada por su futuro [ Sire|E ] en el último momento. Cautivada por sus historias sobre Cartago y la utopía de una coexistencia pacífica entre Todos, ella se convirtió en una ferviente prometeica . de un prospecto muy prometedor , Christof Romuald, quien ya ha hecho todo lo posible por su aprobación . apoyo continuo, entonces su causa estará mucho más cerca de completarse. #!"
bookmark_warofprinces_yitzhak:0 "Yitzhak ben Avraham"
bookmark_warofprinces_yitzhak_desc:0 "Nacido en Praga como hijo único de un rabino judío, la primera respuesta de Yitzhak a la mayoría de los eventos es de simpatía y cariño, un hecho que fue el catalizador de su [ Embrace|E ], su [ Sire|E ] pensamiento que tal amabilidad tenía que ser preservada. A pesar de la conmoción justificada por su estado ahora maldito, la muerte de Yitzhak cambió poco en su comportamiento y después de algunos años de pasión por los viajes por Europa, regresó a su Polonia natal.\ nDurante sus viajes nativos, vio cómo se trataba a los judíos en Europa y cuántos vampiros vagaban solos por las noches, excluidos de los demás por simple lealtad a su [ Clan|E ] o generación. Su deber espiritual es crear un lugar donde todos los seres puedan coexistir. , como Dios había querido que fueran.\n\ n#la audaz Polonia podría ser el refugio seguro con el que siempre soñaste, pero todavía hay muchos obstáculos en tu camino.#!
bookmark_warofprinces_hektor:0 " Hector "
bookmark_warofprinces_hektor_desc:0 "Engendrado durante la caída de Roma occidental y el surgimiento del estado bizantino, Hektor pasaba las noches de recién nacido escuchando historias de la gloria griega y cartaginesa. Frustrado con su [ Sire|E ] y la falta de disposición de sus compañeros para realmente hacer algo sobre el declive del [ Clan|E ], Hektor buscó con enojo algo que pudiera aprovechar para dar sentido a su existencia.\ nReuniendo a un grupo de jóvenes [ cainitas|E ] descontentos, Hektor organizó con éxito una rebelión en el imperio, apoderándose de muchas de las islas del Egeo para crear su nueva Cartago. Ahora se desempeña como dictador de este nuevo estado, una extraña construcción de ideales democráticos griegos mezclados con la política y la religión cartaginesas.\n\ n#negrita Tu utopía sigue siendo muy joven, y las decisiones que debes tomar pronto forjarán su verdadera identidad.#!"
                         
cappadocian_sub_bookmark:0 "Capadocia"
                          
bm_1230_warofprinces_sub_cappadocian:0 "Clan Capadocio"
bm_1230_warofprinces_sub_cappadocian_desc:0 "Eruditos de la muerte y el alma, los capadocios suelen centrarse en ellos mientras ignoran los asuntos más importantes del mundo. Bendecidos con una naturaleza generalmente tranquila, están mucho menos preocupados por el gobierno, las puñaladas por la espalda políticas y otras sutilezas de los no-muertos vida.\ nHasta hace poco, el Clan Capadocio solo estaba en una posición de poder en la región homónima, salvo algunas excepciones.Este hecho ha cambiado con la introducción de la ambiciosa familia veneciana Giovanni en la sangre.Su considerable influencia mercantil para convertirse en importantes jugadores de poder en todo alrededor del Mediterráneo.\n\ n#negrita Con la llegada de los Giovanni, el Clan Capadocio parece estar a punto de sufrir, o beneficiarse, de importantes cambios estructurales. Tenga cuidado de ser el que se beneficie. ..#!"
bookmark_warofprinces_japhet:0 "Jafet"
bookmark_warofprinces_japhet_desc:0 "El líder informal del [ Clan|E ] Cappadocian, Japhet es incondicionalmente leal a su [ Sire|E ], el propio Cappadocius . Desde su dominio en Erciyes , la autoridad de Japhet es fuerte, pero las tendencias solitarias de la mayoría de sus hermanos limitan su poder práctico sobre el [ Clan|E ]. Peor aún, tiene que cooperar con su excéntrico y a menudo engañado [ Sire|E ] y sus visiones de grandeza que a menudo chocan con la perspectiva mucho más pragmática de Japhet.\ nTodavía no lo ha hecho. t t perdonó la introducción de la familia Giovanni en la sangre, a pesar de todos los claros signos de que sería una mala idea.Cada vez más, el hijo fiel piensa que su propio 'padre' podría ser el mayor obstáculo para el [ Clan|E ] La prosperidad de Capadocia.\n\ n#bold ¡Debes liderar a tu [ Clan|E ] en estos tiempos difíciles y tratar de mitigar los ataques de engaño de tu [ Sire|E ].!"
bookmark_warofprinces_bela:0 "Bela Rusenko "
bookmark_warofprinces_bela_desc:0 "Bien educado en teología durante su vida mortal, a Bela nunca le importaron realmente las cuestiones de fe. Su [ Abrazo|E ] por parte de un vampiro fervientemente penitente hizo poco para cambiar ese hecho y Bela se deleitó instantáneamente en la gloria de su inmortalidad. Encontró su verdadera vocación cuando el profeta loco, Octavio, le habló de la grandeza de la entidad llamada Kupala . \ nDe repente, consumido por su nuevo objetivo de convertirse en el avatar de esta criatura oscura, Bela logró reclamar a Sofía como propia, su primera paso hacia su propia apoteosis. Para el ojo exterior, Rusenko es un príncipe excéntrico pero agradable. Para los entendidos, es una de las mayores amenazas para la estabilidad de Europa del Este.\n\ n#negrita Eliges a Kupala y Kupala elegirte a ti. Incluso si tienes que sacrificar ciudades enteras para que te escuchen.#!"
bookmark_warofprinces_apacia:0 " Apacia "
bookmark_warofprinces_apacia_desc:0 "Una escita en vida, Apacia fue entrenada como guerrera y se convirtió en la guardiana de las tumbas de los reyes, una posición de gran honor. Sin embargo, una de las tumbas era el refugio de un capadocio y pronto fue Abrazada para continuar su deber para la eternidad.\ nEventualmente , su talento llegó a ser notado por el mismo Cappadocius , quien la nombró general en el ataque contra la fortaleza de la montaña que más tarde se convertiría en Erciyes . Sus estudios y filosofías. De hecho, muchos de ellos la consideraban una vergüenza para ella. la sangre del [ Clan | E ], ya que ella permaneció obstinadamente analfabeta . Reverenciada como una Reina en el frígido Khanate de Sibir . Estas personas, tan cercanas a tu amada Scythia en espíritu, ganaron tu corazón y harás todo lo posible para proteger a ellos.#!"
bookmark_warofprinces_augustus:0 "Juan Augusto"
bookmark_warofprinces_augustus_desc:0 "El líder de la familia Giovanni veneciano recién abrazada es un nigromante despiadado que desciende de una larga línea de hechiceros romanos. Aunque él mismo es un nigromante muy competente, Augusto es más conocido como el patriarca de la familia, un papel que le ha valido el honor de ser Abrazado por el mismo Cappadocius .\ nEste hecho le había hecho muy pocos amigos entre su nuevo [ Clan|E ], la mayoría lo consideraba un advenedizo listo para traicionarlos en cualquier momento. Cuál es exactamente su oferta es una incógnita... \n\ n#bold El alcance de tu familia está creciendo rápidamente, ayudado por el crecimiento de Venecia. ¡Pronto, la utilidad de tu benefactor [ Clan|E ] habrá llegado a su fin...#!"
bookmark_warofprinces_ambrogino:0 " Ambrogino Giovanni"
bookmark_warofprinces_ambrogino_desc:0 "Nacido como un bastardo de la familia Giovanni, Ambrogino ganó la atención de los ancianos de la familia a través de su dominio de la nigromancia combinado con su crueldad y pura ambición. Cuando los miembros de la familia [ Clan|E ] Capadocia Abrazaron comenzó, él era uno de Como tal, es uno de los pocos Giovanni [ cainitas | E ] cuya sangre desciende de Cappadocius y no de Augustus Giovanni . con el ocultismo. Su interés por la divinidad lo ha llevado a localizar y descifrar innumerables textos y profecías antiguas, pero hasta ahora la verdad lo ha eludido.\n\ n#bold La clave de la divinidad debe estar aquí, y no puedes detenerte hasta encontrarla.#!"
bookmark_warofprinces_claudius:0 "Claudio Giovanni"
bookmark_warofprinces_claudius_desc:0 "Hijo y chiquillo de Augustus Giovanni, Claudius fue Abrazado poco tiempo después de que su padre fuera aceptado en el [ Clan|E ] de la Muerte. Un nigromante competente, también es un político capaz y a menudo se le considera como La mano derecha de Augustus... cuando este título no se le otorga a Ambrogino Giovanni , un hecho que ha creado bastante tensión entre los dos. devoción a su padre hasta ahora. Su tarea actual es la supervisión de las crecientes posesiones venecianas en el caído Imperio Bizantino, asegurándose de que la familia emerja sobre este vacío de poder.\n\ n#bold Sea diligente en sus nuevos deberes, y tal vez finalmente puedas deshacerte de ese molesto Ambrogino de una vez por todas.#!”
bookmark_warofprinces_markus:0 "Markus Musa Giovanni"
bisnieto más joven de Claudio , fue admitido en el [ Clan|E ] por su agudo sentido de la curiosidad y su agudo intelecto. Una vez Abrazado, demostró ser un erudito excepcional y, sobre todo, un excelente Se enorgullecía de su linaje como capadocio y buscaba demostrar el valor de su familia a los escépticos del [ Clan|E ].\ nDespués de su primera asignación en Constantinopla, Markus tuvo un encuentro con el poderoso exiliado Lázaro y logró escapar mientras recopilaba información crítica. Estos primeros éxitos lo han convertido en la estrella en ascenso de la familia y su nueva misión podría elevarlo aún más.\n\ n#bold Eres un Giovanni y un Capadocio, y tu dos familias están orgullosas de contar contigo como uno de sus miembros. ¿Qué podría salir mal? #!"
                                   
tzimisce_sub_bookmark:0 " Tzimisce "
                                    
bm_1230_warofprinces_sub_tzimisce:0 "Clan Tzimisce "
bm_1230_warofprinces_sub_tzimisce_desc:0 "Si alguien llamara a un Tzimisce inhumano y sádico, los Tzimisce probablemente lo elogiarían por su perspicacia y luego demostrarían que su definición mortal de sadismo era ridículamente inadecuada. Un Clan de tradición e historia, han sido los maestros de Europa del Este desde que cualquiera puede recordar.\ nDesde su hogar en Transilvania, gobiernan abiertamente sus pequeños feudos, sin preocuparse por la opinión o el bienestar del lamentable ganado . Los recientes reveses contra los odiados Ventrue y Tremere los han obligado a unificarse bajo un gran Voivodato . Pero esta nueva cohesión es inestable, ya que no hay honor entre los monstruos.\n\ n#negrita La dominación absoluta es un derecho de nacimiento del Clan Tzimisce , y todos los demás deben entender cuál es su lugar: gatear a tus pies y suplicar clemencia. cualquier izquierda...#!"
bookmark_warofprinces_myka:0 " Mika Vykos "
bookmark_warofprinces_myka_desc:0 "Erudito, hedonista, intrigante despiadado... Myka Vykos es todas esas cosas y más. Una vez preparada por los magos Tremere , Myka se convirtió en una valiosa erudita de Obertus durante la era del Sueño de Constantinopla. Cuando la Cuarta Cruzada destruyó la ciudad, encontró una nueva fe, una de implacables pasiones, y una nueva habilidad para la política en su hogar adoptivo de los Balcanes.\ nSu primer gran logro fue actuar como pacificador entre los Ventrue y sus Poseer [ Clan|E ]... y asegurar un reino para sus hermanos griegos exiliados como un estado amortiguador en el proceso.\n\ n#bold Has creado muchos enemigos con tu truco durante el acuerdo de paz y no lo subestimarán Tú otra vez. Prepárate para el ajuste de cuentas por venir.#!"
bookmark_warofprinces_hedeon:0 " Hedeón Yaroslavich "
bookmark_warofprinces_hedeon_desc:0 "Totalmente malvado y tortuoso, Hedeon se preocupa poco por nada más que por su propio poder. Considera que toda vida humana (y [ cainite |E ] no-vida ) es útil solo para servirle a él. Los aldeanos cercanos a su castillo son llevados a sirven como conejillos de indias en varios experimentos viles. Algunos ahora funcionan como trampas inteligentes en sus mazmorras o como tabiques vivientes en las habitaciones de su fortaleza . torpor|E ] del Príncipe Razkoljna de Cracovia ha abierto nuevas oportunidades...\n\ n#bold Eres claramente el mejor ejemplo de lo que debería ser un verdadero Tzimisce . trono...#!"
bookmark_warofprinces_razkoljna:0 " Razkoljna "
bookmark_warofprinces_razkoljna_desc:0 "Hija de un jefe eslavo, el esposo de Razkoljna compartió el beso con ella después de su propio [ Abrazo|E ]. Pronto se establecieron como los verdaderos líderes de la tribu y se alimentaron de los guerreros más fuertes y mataron a cualquiera que se atrevió a oponerse a ellos.\ nCuando los misioneros cristianos llegaron a Polonia, marcó el comienzo de su fin. Su [ Sire|E ] cayó bajo las espadas de los invasores, pero Razkoljna logró matar al resto de los atacantes.\ nPronto reclamó Cracovia como su dominio y comenzó a alentar su crecimiento, al mismo tiempo que lograba defenderse de los Ventrue húngaros y sus propios compañeros de clan.\n\ n#bold Te has despertado recientemente después de un pequeño período de [ letargo|E ]. Este contratiempo imprevisto ha permitido que nuevas potencias ganen influencia en Polonia, algo que debes rectificar lo antes posible.#!"
bookmark_warofprinces_shaagra:0 " Shaagra "
bookmark_warofprinces_shaagra_desc:0 "Diosa de la fertilidad, guerrera y chamán de la tribu eslava conocida como los Vroi , Shaagra fue abrazada por un Tzimisce que apreciaba su inteligencia y determinación. Conquistó en su nombre hasta que cayó en [ letargo|E ] en el 6. siglo.\ nRecientemente despertada en lo que ahora es Praga, su gran poder y edad le han permitido convertirse rápidamente en la líder [ cainita|E ] en el área una vez más. Aún así, hay nuevos enemigos para luchar y una nueva generación de Tzimisce que aún no sabe su nombre. Las nuevas conquistas de Shaagra apenas están comenzando.\n\ n#bold Este es un nuevo mundo extraño para ti, pero algunas cosas nunca cambian. Tu sed de guerra y dominación, por ejemplo... #!"
bookmark_warofprinces_yorak:0 " Yorak "
bookmark_warofprinces_yorak_desc:0 "Uno de los primeros chiquillos de los Mayores, Yorak es un koldun devoto y metamorfosista que busca profundizar en la comprensión del [ Clan|E ] sobre la elaboración de la carne. Su obra maestra es la Catedral de la carne, una desgarradora iglesia-fortaleza esculpida de la carne de campesinos, esclavos, rivales, bestias y cualquier número de otras víctimas que fueron construidas en las paredes palpitantes y supurantes de la estructura.\ nAbsorto en su papel como una especie de líder espiritual para los Tzimisce [ Clan |E ], Yorak no ha estado activo en la escena política por un tiempo, pero el estado actual de los Tzimisce , apenas unidos y bajo asalto, podría obligarlo a revisar su postura pronto.\n\ n#negrita Todo cambia y como las paredes de la Catedral grita a tu gusto, tal vez [ Clan|E ] Tzimisce podría necesitar tu 'suave' toque una vez más... ¡#!"
bookmark_warofprinces_darvag:0 " Darvag Grozni"
bookmark_warofprinces_darvag_desc:0 "En su vida, Darvag era un noble de una tribu eslava en la Ucrania moderna. Era un paganista acérrimo y se negó con saña a convertirse, jurando que él personalmente arrasaría la catedral y la ciudad hasta los cimientos. eso divirtió a un Anciano Tzimisce que lo Abrazó. Desde entonces, Grozny protege la ciudad de los estragos de todos los demás [ cainitas|E ], no por lealtad a Kiev, sino porque él mismo quiere destruir la ciudad.\ nDarvag también es un fiel aliado del misterioso 'Baba Yaga ' de la fama rusa y está haciendo diligentemente sacrificios (en su mayoría vivos) con la esperanza de complacer a esta diosa oscura.\n\ n#la audaz Kiev es tuya para quemarla y de nadie más. verás tu venganza cumplida.#!"
bookmark_warofprinces_noriz:0 " Noriz "
bookmark_warofprinces_noriz_desc:0 " Noriz fue una vez considerado voivoda entre los voivodas (líder político del [ Clan|E ] Tzimisce ), pero cayó en la decadencia y la disipación, contentándose con subsistir con el honor que se le debía como príncipe anciano de la sangre y las historias de su glorias pasadas. Descubrió por las malas que las glorias pasadas le sirvieron de poco frente a un nuevo enemigo decidido, Vladimir Rustovitch .\ nSu objetivo es ascender como la criatura más poderosa de los Cárpatos. complejidades de sus intrigas y alianzas. Con el reciente revés de Rustovich contra los Ventrue , algunos temen que el regreso de Noriz a la prominencia sea inevitable...\n\ n#negrita Rustovitch tropezó. Este es el momento que esperas para levantarte de tu sueño decadente y darles una lección a todos.#!"
                                             
assamite_sub_bookmark:0 "Banu Haqim "
                                               
bm_1230_warofprinces_sub_assamite:0 "Clan Banu Haqim "
bm_1230_warofprinces_sub_assamite_desc:0 "Con base en su fortaleza oculta Alamut en el Medio Oriente, los Cainitas occidentales tradicionalmente ven a los Banu Haqim como peligrosos asesinos y diabolistas , pero en realidad son guardianes, guerreros y eruditos que buscan distanciarse de la Guerra de los Príncipes. .\ nAl presentar la fachada de un Clan unido, los Hijos de Haqim en realidad están profundamente divididos por el faccionalismo. La reciente llegada de un nuevo y divisivo Anciano ha puesto a todos nerviosos. Estos problemas han permitido que nuevos enemigos se filtren, principalmente a través de las Cruzadas. , en el Medio Oriente que alguna vez estuvo completamente bajo su control.\n\ n#bold Los Banu Haqim podrían ser una fuerza imparable si estuvieran unificados . ?#!"
bookmark_warofprinces_jamal:0 "Jamal"
bookmark_warofprinces_jamal_desc:0 "A lo largo de las Guerras Santas que se libraron por Tierra Santa, el nombre de hashashiyyin es un nombre de pavor. De todos los hashashiyyin , ningún nombre es más grande ni más terrible que el de Jamal. Musulmán devoto, Jamal es el actual Califa de los Banu Haqim , el líder de su casta guerrera.\ nUn general astuto y efectivo, Jamal es conocido sobre todo por su formidable destreza en la batalla con su apodo de 'el Invicto'. de los Banu Haqim Warriors y la facción pro-musulmana del [ Clan|E ]. Ambos son puestos importantes y responsabilidades difíciles, pero usted es un hombre comprometido. Llevará a los fieles a la victoria, dentro y fuera de Alamut.#!"
bookmark_warofprinces_dastur:0 "Dastur Anosh "
bookmark_warofprinces_dastur_desc:0 "Dastur nació con visiones y fue uno de los magos que se reunieron en torno a Zoroastro. Se hizo amigo de su futuro [ Sire|E ], un erudito, y ambos encontraron una reliquia misteriosa llamada la Piedra que llora. Este descubrimiento milagroso fue no del agrado de los líderes de los Banu Haqim, quienes los tildaron a ambos de herejes y los obligaron a exiliarse.\ nImpertérritos , reunieron a eruditos y luminarias de ideas afines que escucharon sus historias de Zilah , la que fue convertida en piedra por Caín. de Alamut', se han visto obligados a mantener el secreto después de un ataque directo de los agentes de Banu Haqim que le costó la vida al [ Sire|E ] de Dastur. Sin embargo, con el faccionalismo actual del [ Clan|E ], la Tribu Perdida podría ser capaz de obtener es una venganza anticipada.\n\ n#bold Debes honrar a tu [ Sire|E ] llevando a tu Tribu a la supervivencia, si no a la victoria absoluta, contra los odiados descendientes de Alamut.#!"
bookmark_warofprinces_fatima:0 "Fátima al -Faqadi "
bookmark_warofprinces_fatima_desc:0 "Fátima nació en una familia de guerreros moros almohades, que lucharon junto a los Defensores de Alá durante las Cruzadas. Su pasión y habilidad llamaron la atención de los Banu Haqim . Fue traída a Alamut, engendrada por el califa egipcio Thetmes , y entrenada para convertirse en la mejor asesina.\ nSu primera tarea fue asegurarse de que la 4.ª Cruzada nunca llegara a las costas de Oriente Medio y fuera un éxito rotundo.\n\ n#bold La 4.ª Cruzada yace destrozada, perdida por luchas internas y codicia, pero tu trabajo no ha terminado por completo. Ocúpate de sus restos y crea un poderoso estado amortiguador en Anatolia para proteger a tu [ Clan|E ] de futuras invasiones. #!"
bookmark_warofprinces_alashrad:0 "Al- Ashrad "
bookmark_warofprinces_alashrad_desc:0 "Una vez mago mortal y cazador de demonios, Al- Ashrad estuvo estrechamente aliado con el propio Haqim hasta un incidente que lo llevó a su [ Abrazo|E ]. Desde entonces, se ha desempeñado como el hechicero líder de Amr, del Banu Haqim , luchando tanto en las Guerras de Baali como en innumerables otras batallas, convirtiéndose en una figura de temor y reverencia en el [ Clan|E ].\ nEn la compleja red política haqimita , Al- Ashrad es una figura moderada y lidera a su pequeña facción en estas tiempos turbulentos. Su hostilidad solo parece reservada a Thetmes y su Red de cuchillos, por razones que el maestro hechicero se niega a revelar excepto a sus amigos más confiables.\n\ n#bold Conoces al verdadero demonio en el corazón de todos los Banu Los problemas de Haqim . Sus agentes están cerca y deben ser tratados o te enfrentarás a un destino peor que la destrucción.#!"
bookmark_warofprinces_nakurtum:0 " Nakurtum "
bookmark_warofprinces_nakurtum_desc:0 "Una de las chiquillas más antiguas de Haqim , Nakurtum es la fundadora de los silsila , los historiadores que registran la historia del [ Clan|E ] y mantienen su dirección espiritual. Estuvo inesperadamente perdida en la historia hasta su regreso a Alamut en 1214 donde hizo la transición al papel de Eldest, la posición de liderazgo para el [ Clan|E ] en su conjunto.\ nSu descarado control del poder, el desprecio por la mayoría de las otras facciones y las reformas radicales la han convertido en muy pocos amigos y en un estado cada vez más inestable . del [ Clan|E ]. Muchos ya están conspirando para la llegada de un nuevo Mayor...\n\ n#bold Eres el Mayor, estas pequeñas facciones aprenderán a inclinarse ante tu autoridad o serán dejadas de lado. Solo tú son dignos de sentarse en el Trono Negro.#!"
bookmark_warofprinces_ahmed:0 "Ahmed ibn Zayyat "
bookmark_warofprinces_ahmed_desc:0 "En vida, Ahmed, hijo de Zayyat , había sido comerciante musulmán y mercader de petróleo. Musulmán por crianza más que por elección, la fe de Ahmed se basaba más en la moneda todopoderosa. Un Banu Haqim igualmente renuente a la religión lo abrazó en 793 y Ahmed sorprendió a todos, incluso a sí mismo, al emprender su aprendizaje con honor y vigilancia.\ nComo prueba final, tuvo que infiltrarse en un campamento de cruzados, robar cierto objeto y asesinar a los guardias. Todo lo que encontró lo cambió por completo, convirtiendo el hombre en un cristiano devoto. Desde entonces, ha trabajado incansablemente para encontrar a otros que experimentaron la misma revelación y traer la paz a Tierra Santa.\n\ n#bold Eres un puente entre cristianos y musulmanes, quizás el único que puede resistir Esta tierra profundamente dividida. Tu tarea es inmensa, pero tu fe es absoluta.#!"
bookmark_warofprinces_thetmes:0 " Temas "
bookmark_warofprinces_thetmes_desc:0 "Como mortal, Thetmes era un soldado en el ejército de Ptolomeo que luchaba contra Cleopatra y sus aliados romanos. Después de su derrota, demostró ser un temible gladiador y atrajo la atención de los Banu Haqim , quienes lo abrazaron. creyente, su ascendencia en los años transcurridos desde entonces hizo que se abrieran fisuras religiosas en el [ Clan|E ].\ nThetmes lidera la Red de Cuchillos, la facción fanática de asesinos y diabolistas a sueldo que forma la imagen que la mayoría de los forasteros tienen de los Banu Haqim como un Sin embargo, no es solo un hombre codicioso con sed de sangre, Thetmes tiene un maestro oscuro y poderoso y se asegurará de que todo esté listo para su regreso...\n\ n#bold El Pastor Negro aún duerme, así que te toca a ti preparar a los Banu Haqim para su glorioso regreso.#!"
                                                       
gangrel_sub_bookmark:0 "Gangrel"
                                                       
bm_1230_warofprinces_sub_gangrel:0 "Gangrel del clan"
bm_1230_warofprinces_sub_gangrel_desc:0 "Nómadas que mantienen vínculos más estrechos con los lugares salvajes que la mayoría de sus primos que viven en las ciudades, los Gangrel también están más cerca del aspecto animal de la Bestia y, a menudo, se los llama primales, salvajes o incluso monstruos brutales.\ nClan Gangrel tiene un lugar importante en la historia Cainita, como una de las principales fuerzas impulsoras detrás de los llamados "bárbaros" de la era clásica. Sin embargo, desde entonces, sus fortunas han disminuido. El crecimiento de las ciudades y la marea aparentemente imparable del cristianismo. ha debilitado a su gente, que en su mayoría es de ascendencia pagana . El último hurra para los no cristianos en Europa, pero harás que valga la pena cantarlo para las generaciones venideras. #!"
bookmark_warofprinces_morrow:0 "Mañana"
bookmark_warofprinces_morrow_desc:0 "Cuando era una niña huérfana, Morrow fue cultivada como la chiquilla Gangrel ideal : una vampira solitaria y autosuficiente con habilidades superiores. Cuando finalmente logró rastrear y herir a su futuro [ Sire|E ] en un juego mortal del gato y el ratón, él la abrazó.\ nDesde entonces, se ganó la reputación de ser una guerrera feroz. Esta reputación la ayudó en la búsqueda de reunir a sus compañeros Gangrel. Ella cree que la única manera de que su [ Clan|E ] sobreviva a la El avance de la civilización es cooperar, por lo que alienta a los Gangrel a formar manadas. Su reciente victoria contra los Ventrue y los Tzimisce ha consolidado su fama como uno de los principales líderes de guerra del [ Clan|E ].\n\ n# negrita Ves un futuro brillante para los Gangrel unidos. Es hora de hacer realidad este sueño.#!"
bookmark_warofprinces_viktor:0 "Victor"
bookmark_warofprinces_viktor_desc:0 "Un Gangrel poderoso e intimidante, Viktor ha sido la mano derecha del aterrador Baba Yaga de la leyenda rusa durante siglos. Como el único en quien se puede confiar para conocer los planes de la 'Abuela Pequeña, se le ha confiado como regente después su caída en [ letargo|E ].\ nViktor es un fanático que no tolera la falta de respeto hacia su amante, pero también es conocido como un enemigo honorable, alguien que disfruta de una lucha justa y no oculta sus verdaderas intenciones. defender su reino contra la reciente llegada del cristianismo a Rusia y los rumores de una horda de jinetes orientales reunidos en las estepas...\n\ n#la audaz Baba Yaga es la salvación de la raza [ cainita|E ]. 't y no le fallará. #!"
bookmark_warofprinces_brunhilde:0 " Brunilda "
bookmark_warofprinces_brunhilde_desc:0 "Nacida entre la gente de Escandinavia, Brunhilde sintió en su [ Abrazo|E ] un renacimiento y rápidamente formó las valquirias que sirvieron a su abuelo Odín con fervor, creyéndose verdaderas extensiones de los mitos nórdicos. Luchó valientemente contra la influencia invasora del cristianismo, tratando de evitar cualquier cambio de las formas antiguas de su gente.\ nSin embargo, esta lucha se perdió cuando la gente de Suecia se convirtió al cristianismo. Aún así, mientras muchos de sus hermanos cayeron en la desesperación o en acciones imprudentes, Brunhilde Incluso si su gente se vuelve en su contra, sueña con repeler a los [ cainitas|E ] cristianos invasores y preservar su fe.\n\ n#negrita Ragnarok ha llegado y conoces el final, pero aún es demasiado pronto para rendirte. Los Aesir están mirando.#!"
bookmark_warofprinces_dunlop:0 "Dunlop"
bookmark_warofprinces_dunlop_desc:0 "Un salteador de caminos que robó su nombre y título del noble clan escocés, el 'Conde Dunlop' es un hombre insensible que disfruta de la violencia casual. Reinando como un monstruo aterrador incluso antes de su [ Abrazo|E ], Dunlop crió a sus hijos para ser tan asesino como él, con el único rayo de luz en su vida siendo su inocente hija.\ nSu caída se produjo cuando su codicia lo llevó a atacar las posesiones del poderoso Lord Mithras.La respuesta del Ventrue fue rápida y despiadada, humillando a Dunlop y matando a su amada hija como castigo. Dunlop fue obligado a capitular y desapareció de la mirada y la atención de Mithras . te quitó la luz. Es hora de hacerle entender por qué Escocia todavía teme tu nombre esta noche... ¡#! "
bookmark_warofprinces_qarakh:0 " Qarakh "
bookmark_warofprinces_qarakh_desc:0 " Qarakh y su [ Sire|E ], Aajav , vivían entre los mongoles, pero Qarakh fue Abrazado sin permiso, lo que resultó en su salida precipitada de los [ cainitas|E ] mongoles. Aajav resultó herido durante la batalla, por lo que Qarakh llevarlo hasta Livonia, donde hizo causa común con una banda de vampiros paganos asediados que intentaban resistir la llegada del cristianismo . atención de muchos otros paganos que buscan una última posición triunfal. Mientras aún es joven, Qarakh se está acostumbrando cada vez más a su nuevo papel por la noche y está listo para defender su patria adoptiva hasta su muerte final.\n\ n#negrita Esto podría ser la última resistencia de los paganos bálticos, pero te asegurarás de que los cristianos sangren por cada centímetro de tierra.#!"
bookmark_warofprinces_valborg:0 "Valborg"
bookmark_warofprinces_valborg_desc:0 "Valborg, una vikinga de corazón, es una Ulfhedinn formidable que lucha sin pensar por su propia seguridad. Ha aceptado que los días de los nórdicos han pasado y ahora tiene la intención de luchar por la única causa digna que queda: ella misma.\ nCon Con su temible tripulación y su creciente reputación como mercenario despiadado, Valborg tiene muchas oportunidades para asesinar y saquear . A Valborg realmente no le importa. Más seguidores significan más cristianos que matar y más riquezas que saquear. Y si los antiguos dioses no están contentos sobre ella, ciertamente no lo muestran.\n\ n#negrita Algunos piensan que llevarás a los nórdicos a una nueva era. No lo sabes, pero seguro que te divertirás abriéndote camino hacia una respuesta.#! "
bookmark_warofprinces_thomas:0 "Tomás Feroux "
bookmark_warofprinces_thomas_desc:0 "Tomás, el único hijo de un noble menor, era un hombre agrio y cruel hasta que peregrinó a Tierra Santa. Su [ Abrazo|E ] y su entrada afortunada en los [ cainitas|E ] de Constantinopla lo cambiaron.\ nEnseñado y cuidado por algunas de las mentes más brillantes de la ciudad, Thomas se convirtió en un vástago obediente de Constantinopla, prometiendo proteger su hogar adoptivo para siempre. Una tarea que no pudo lograr cuando la 4ª Cruzada devastó la ciudad y mató a sus mentores.\ nThomas nunca se exilió como tantos [ cainitas|E ] griegos , todavía deambula por su ciudad con la esperanza de salvarla . la posición es débil y los malditos latinos están bien atrincherados. Pero no puedes fallar a la memoria del Sueño y a tus maestros. Este es tu momento de redención.#!"
                                                             
malkavian_sub_bookmark:0 " Malkavian "
                                                       
bm_1230_warofprinces_sub_malkavian:0 "Clan Malkavian "
bm_1230_warofprinces_sub_malkavian_desc:0 " Los Malkavian son un grupo de Cainitas enigmático y profundamente perturbado. Los miembros del Clan han asumido los roles de videntes y oráculos entre los Cainitas y el ganado , figuras espeluznantes atadas por extrañas compulsiones y la capacidad de percibir lo que otros no pueden. Notorios bromistas cuyos Las "bromas" van desde tontas hasta sádicas.\ nEn la Era Clásica, eran un Clan importante profundamente respetado por sus dones proféticos. Sin embargo, los tiempos han cambiado y ha sido un duro golpe para los Malkavian , ahora considerados como meros lunáticos por la mayoría. a la posición de un Bajo Clan, los Tocados por la Luna han perdido la mayor parte de su poder y prestigio.\n\ n#negrita Más que cualquier otro Clan, cada Malkavian es su propia criatura con locura y claridad competitiva sobre su mente. uno ganará?#!"
bookmark_warofprinces_tryphosa:0 "Trifosa"
bookmark_warofprinces_tryphosa_desc:0 "Quizás el Malkavian más influyente de la Era Clásica, Tryphosa fue consejera de Camilla de Roma y una ferviente defensora de la destrucción de Cartago. Fue gracias a su constante presencia e influencia sobre el poderoso Ventrue que él finalmente se movió contra lo que ella vio como un infierno infestado de demonios.\ nTryphosa cree que su lugar como no muerta le permite afectar las visiones del futuro que presencia, algo que en su mayoría se pierde para las nuevas generaciones de Malkavian.Después de la caída de Roma, Tryphosa nunca salió de Italia, esperando para que el regreso de Camilla lo impulse una vez más hacia adelante. Ese momento ha llegado.\n\ n#la audaz Camilla está de vuelta y tu guía seguramente será aún más necesaria que antes, considerando que este nuevo y extraño mundo es tan diferente de tu amada Roma.# !"
bookmark_warofprinces_vasantasena:0 " Vasantasena "
bookmark_warofprinces_vasantasena_desc:0 " Vasantasena era la hija del emperador tamil Rajaraja el Grande, maldecida por un vampiro chambelán para que se consumiera lentamente. Un Malkavian errante le ofreció una solución que ella aceptó valientemente, revelando la traición del chambelán a su padre casi a costa de su vida. Conducida a la no muerte por su salvador, comenzó a viajar por el mundo.\ nElla predica contra el Vínculo de Sangre, rechaza el señorío sobre los mortales, la jerarquía vampírica tradicional y toda pérdida del libre albedrío. Ejerce su celo y encanto como un cuchillo, Y su reputación está creciendo rápidamente.\n\ n#bold Eres la voz de los oprimidos. Romperás los grilletes que atan a la sociedad de [ cainite|E ] uno a la vez.#!"
 bookmark_warofprinces_gregor_desc:0 "Caballero teutón en vida, Gregor era conocido por su crueldad y descuido. Abrazado por un Nosferatu con la esperanza de castigarlo, Gregor se adaptó con bastante facilidad a su nueva existencia.\nAl adentrarse en la Selva Negra, pronto se hizo famoso por matar hombres lobo y destruir un poderoso y antiguo Niktuku. Ambas hazañas deberían ser casi imposibles para alguien tan joven como Gregor, lo que lleva a muchos a creer que algo no es lo que parece en lo más profundo del bosque...\n\n#negrita Has encontrado tu verdadero propósito como caballero de la Dama de las Espinas. Ella te da fuerza y ​​no te regaña por tu lujuria por la violencia. Ustedes son perfectos el uno para el otro.#!"
bookmark_warofprinces_louhi:0 " Lohi "
bookmark_warofprinces_louhi_desc:0 "Un vampiro reservado, con pocas menciones registradas a lo largo de la historia [ cainita|E ], Louhi ha sido la mayor presencia [ cainita|E ] en el norte de Finlandia desde que cualquiera puede recordar.\ nUno de los taumaturgos más talentosos que jamás haya existido . existe, ella ha creado su propia prole de aparecidos, los tortuosos Keskinen. Los rumores dicen que ella sirve al Lasombra [ antediluvian|E ] por razones desconocidas. Muchos están preocupados de que sus planes puedan significar la perdición de la región, o incluso más. pero los pocos que se atrevieron a viajar al norte helado para enfrentarse a ella nunca regresaron.\n\ n#bold Estás trabajando duro para complacer al maestro Abyssal. Estás progresando, pero siempre hay necesidad de más 'voluntarios' para probar tus últimas pociones...#!"
bookmark_warofprinces_anatole:0 "Anatole"
bookmark_warofprinces_anatole_desc:0 "Nacido como el hijo mayor de un comandante de la guardia de la ciudad, y esperaba seguir los pasos de su padre, Anatole encontró una vocación superior al servir a Dios. Su porte y sus sentimientos llamaron la atención de un vampiro particularmente religioso que pensó que Anatole podría seguir la causa del cristianismo.\ nEn los años transcurridos desde entonces, ya se ha hecho un nombre como un ferviente oponente de la herejía en todas sus formas, habiendo derrotado tanto a los Elegidos de Calomena de Constantinopla como a la [ cainita|E ] Herejía en París. aún lo empujan hacia adelante para hacer aún más.\n\ n#bold La herejía cátara en el sur de Francia es una fachada para que algunos peligrosos herejes [ cainitas|E ] se escondan detrás. Debes encontrarlos y destruirlos.#!"
bookmark_warofprinces_elimelech:0 "Elimelec"
bookmark_warofprinces_elimelech_desc:0 "Elimelech era el esposo de Noemí, como se cuenta en la Biblia en el Libro de Rut. Fue atacado y abrazado por un asaltante desconocido. Noemí encontró a su esposo vagando por los campos: un caparazón frío, muerto viviente y vacío. colocado él en una tumba poco profunda sin nombre. Tres noches más tarde, se levantó loco y sufriendo de una sed que ninguna fuente podría saciar . frenesí. Los viajes de Elimelech finalmente lo llevaron a Tal'mahe'Ra , un culto apocalíptico de la muerte que adora a los [ antediluvianos|E ].\n\ n#temer audaz y escucharte. coro de emociones.#!"
 bookmark_warofprinces_adolana:0 " Adolana de Las Huelgas"
 bookmark_warofprinces_adolana_desc:0 "La mayor parte de la vida de Adolana la ha pasado en un convento después de que su sádico hermano la enviara allí para ocultar sus crímenes. Al negarse a recibir más palizas, pronto utilizó sus palabras para convertir el convento en una sociedad fracturada donde la violencia era un lugar común, pero con ella en la parte superior de la cadena alimenticia ahora.\ nImpresionado con sus habilidades, un Malkavian de la [ cainita|E ] Herejía la abrazó y amplió sus ambiciones. Ayudada por el casi colapso de la Iglesia de Caín, Adolana ha ascendido rápidamente en la jerarquía y ahora es miembro de la asediada Sede de Nod, el último bastión de su fe.\n\ n#bold Encontraste una nueva familia en la Iglesia de Caín pero... incluso en una familia debes saber que debes estar arriba si quieres evitar que te lastimen de nuevo.#!"
 bookmark_warofprinces_chandraputra_desc:0 "Un salvador y un monstruo, un sirviente y un conquistador, Chandraputra es ante todo una cosa: leal. El único chiquillo de Zapathasura que no ha traicionado a su [Sire|E] de una forma u otra, naturalmente ha asumido el manto de liderazgo para sus compañeros de clan indios.\nEntre los primeros conquistadores indoeuropeos que invadieron el subcontinente durante sus días mortales , Chandraputra es quizás el general más consumado de la noche, en gran parte debido a la guerra eterna que libra contra los asurazitayya malditos que amenazan a su [Clan|E].\n\n#Guerra audaz nunca cambia y tú tampoco o. Tus enemigos entenderán que nunca flaquearás.#!"
bookmark_warofprinces_harold:0 "Harold Zettler "
bookmark_warofprinces_harold_desc:0 "Un miembro del Círculo de las Tres Revelaciones, un colectivo flexible de videntes, filósofos y místicos Malkavian , Harold Zettler fue un firme defensor de los Salubri cuando los Tremere comenzaron a destruirlos. Usando la poca influencia que tenía para protegerlos y protegerlos no fue suficiente y se desesperó aún más a medida que la purga de los Tremere ganaba fuerza.\ nHarold suplicó a cualquier entidad espiritual o incluso a Dios que lo ayudara y uno de ellos respondió.\ nEsa noche, Harold Zettler renació como una burla de todo lo que él una vez apreciado.\n\ n#bold Ahora entiendes mucho más. No hay salvación sin dolor y te convertirás en el artista más consumado con el tiempo, gracias a tu generoso nuevo patrocinador.#!"
                                                                      
nosferatu_sub_bookmark:0 "Nosferatu"
                                                       
bm_1230_warofprinces_sub_nosferatu:0 "Clan Nosferatu"
bm_1230_warofprinces_sub_nosferatu_desc:0 "El Abrazo, el más visiblemente maldito de todos los Cainitas, convierte a cada Nosferatu en una criatura horriblemente deformada. Son los maestros de los espías de los muertos, recopilan información y la venden a un precio muy alto. Como maestros del subsuelo, los Nosferatu deben colocar un mayor énfasis en la unidad del Clan y la supervivencia mutua y, en consecuencia, son bastante cordiales entre sí, incluso cuando técnicamente son enemigos . sus talentos incomparables en la recopilación de información.\n\ n#bold Tu clan es la única familia que puede entenderte. Si todos pudieran unirse, hay pocas amenazas que no podrían ser superadas.#!"
bookmark_warofprinces_josef:0 "Josef Zvi "
bookmark_warofprinces_josef_desc:0 "Josef nació y se crió en el barrio judío de Praga como hijo de un rabino. La violencia contra los judíos no era infrecuente, y Josef sufrió brutalmente una noche cuando una pandilla de niños cristianos le aplastó la mitad de la cabeza. habría muerto si no fuera por su [ Abrazo|E ] por Nosferatu Yehuda . , Josef jugó un papel decisivo en el destronamiento de su anterior Príncipe tiránico. En el consiguiente vacío de poder, pudo asegurar la ciudad para él y su gente.\n\ n #audaz a pesar de que Praga es segura, ha surgido una nueva amenaza en el Este que podría poner en peligro todos tus esfuerzos hasta el momento. No debes vacilar.#!"
bookmark_warofprinces_tarique:0 " Tarique "
bookmark_warofprinces_tarique_desc:0 "Antes de su ascenso, Tarique era un Vástago español convertido al Islam durante su Edad de Oro. Enamorado de la ciudad 'intocable' de La Meca, Tarique se aventuró en la Península Arábiga para contemplar el lugar más sagrado de los musulmanes.\ nSe involucró con su defensa contra un complot de Malkavian y pronto se hizo amigo del liderazgo [ ashirra|E ] ([cainitas|E] musulmán . Reuniendo seguidores impresionados por su fe inquebrantable, Tarique afirmó que de ahora en adelante él y su progenie se convertirían en Hajj, guardianes religiosos del Islam y administradores de La Meca.\n\ n#bold Los [ ashirra|E ] se mantienen firmes, pero siguen siendo amenazas a tu alrededor. Eres su roca y no debes desfallecer en tu sagrado deber.#!"
bookmark_warofprinces_malachite:0 "Malaquita"
bookmark_warofprinces_malachite_desc:0 "Nacido en el siglo IX como nativo de Constantinopla, Maleki se convirtió en un sacerdote ortodoxo oriental. Desafortunadamente, tuvo un desacuerdo público con un poderoso [ cainita|E ]. Por herir su orgullo, hizo que Maleki Abrazara por un Nosferatu.\ nRenacido como un [ cainita|E ], Maleki vivió en la desesperación hasta que fue tomado bajo el ala del Toreador Michael, Patriarca de Constantinopla, y se convirtió en el servidor más fiel del Sueño.\ nLa 4ª Cruzada fue una golpe demoledor al espíritu de Malachite, pero él sabe que incluso sin Michael, el Sueño debe perdurar.\n\ n#bold Debes liberar a Constantinopla del control de los francos y devolver a la ciudad su antigua gloria. #!"
bookmark_warofprinces_mnemach:0 " Mnemach "
bookmark_warofprinces_mnemach_desc:0 "Nacida durante los últimos días de la independencia de la Galia, Mnemach fue Abrazada por un Nosferatu que deseaba preservar su cultura y sus tradiciones. Bajo su tutela, pronto se convirtió en un cambio consumado y se estableció en Lutetia, que pronto se convertiría en París.\ nOne de los [ cainitas|E ] más antiguos de Francia, la influencia y el poder de Mnemach son bien conocidos, y su apoyo fue fundamental para expulsar del poder a Alejandro de París. Aún así, sus verdaderos objetivos siguen sin estar claros, lo que hace que el aura de misterio que la rodea sea aún más preocupante. a otros [ cainitas|E ].\n\ n#negrita Expulsaste a Alejandro por una razón, y esta razón ahora está en tus manos. Un fragmento de tu pasado, y quizás de tu futuro, se reúne contigo una vez más.# !"
bookmark_warofprinces_lukas:0 "Lucas"
bookmark_warofprinces_lukas_desc:0 "Para la mayoría, Lukas podría ser confundido con un niño del coro de una orden sagrada. Su apariencia inocente contrasta con el monstruo astuto que habita debajo, el monstruo que corrompió sistemáticamente una casa de Dios en nombre del infierno.\ nOrgulloso de su perfección belleza como un niño mortal, Lukas se horrorizó cuando un vagabundo Nosferatu lo abrazó para enseñarle algo de humildad. Desesperado, Lukas dijo que haría cualquier cosa para restaurar su belleza.\ nMuy abajo, algo escuchó su súplica y presentó sus términos... \n\ n#bold Tu patrón infernal pide más y más para cumplir con su parte del trato. No tienes más remedio que cumplir porque tu belleza vale cualquier sacrificio.#!"
bookmark_warofprinces_gregor:0 "Gregorio"
bookmark_warofprinces_gregor_desc:0 "Un caballero teutónico en vida, Gregor era conocido por su crueldad y descuido. Abrazado por un Nosferatu que esperaba castigarlo, Gregor se adaptó con bastante facilidad a su nueva existencia.\ nAl adentrarse en la Selva Negra, pronto se hizo famoso por matar hombres lobo y destruir un poderoso y antiguo Niktuku . Ambas hazañas deberían ser casi imposibles para alguien tan joven como Gregor, lo que lleva a muchos a creer que algo no es lo que parece en lo más profundo del bosque...\n\ n #negrita Has encontrado tu verdadero propósito como caballero de la Dama de las Espinas. Ella te da fuerza y no te regaña por tu ansia de violencia.
bookmark_warofprinces_zelios:0 " Zelios "
bookmark_warofprinces_zelios_desc:0 "Nacido en una familia de comerciantes adinerados, Zelios dejó de llevar una vida de cómodos privilegios para desarrollar un oficio útil. Viajó por Europa y más allá, aprendiendo el arte y la ciencia de la arquitectura.\ nA Nosferatu se dio cuenta del potencial de la joven y decidió traerlo al [ Clan|E ], para que pudiera mejorar las madrigueras que su [ Clan|E ] poblaba. Con la eternidad por delante, Zelios se sumerge en su oficio, especializándose en la construcción de castillos para [ cainita| E ] señores.\n\ n#bold Sois famosos tanto entre la nobleza como entre los artesanos, pero sabéis que vuestra verdadera obra maestra aún está por llegar. Transilvania os llama y podría ser donde encontraréis vuestro destino.#! "
                                                                                  
 bookmark_warofprinces_andreas_desc:0 "Una vez que un sacerdote palestino de la secta monofisita hereje en la cristiandad temprana, Andreas encontró Set durante su exilio en Egipto. Demostrando ser un converso inteligente y estudioso, Andreas asumió el papel de un príncipe comerciante para su [Clan|E], ganando contactos y aliados en toda Europa.\nSu reputación impecable y sus tratos justos lo ayudaron a crear un imperio comercial, pero su verdadero los llamados siguen siendo ayudar a otros a encontrar la verdad de Set, sin importar de dónde vengan.\n\n#bold Cada persona acepta a Set a su manera. Eres simplemente el guía paciente y comprensivo que necesitarán a lo largo del camino.#!"
ravnos_sub_bookmark:0 " Ravnos "
 bookmark_warofprinces_neferu_desc:0 "Una dama en espera de Nefertiti, Neferu fue el agente de Set durante los tiempos difíciles del faraón Akhenaton, siendo fundamental para derribar su gobierno herético. Su recompensa fue el Abrazo y la creación de su propio templo, la Corte de Fuego.\nSe ha especializado en corromper a los vampiros extranjeros que intentan conquistar Egipto, una tarea que le ha valido muchos enemigos. Pero, de alguna manera, la Corte de Bomberos parece sobrevivir y salir victoriosa la mayoría de las veces.\n\n#negrita Tu corte erosiona los pilares de la civilización lenta y metódicamente. Muchos ya han caído en ella, muchos más lo harán en el futuro.#!"
                                                       
bm_1230_warofprinces_sub_ravnos:0 "Clan Ravnos "
bm_1230_warofprinces_sub_ravnos_desc:0 "Un clan profundamente dividido, los Ravnos se originaron en la India, pero se sabe que vagan por todas partes. Gobernantes poderosos en su tierra natal, están menos arraigados en Occidente, donde simplemente se los conoce como embaucadores errantes, místicos y vagabundos. .\ nEste Los ravnos tienen su propio sistema de castas, desarrollado a partir de los linajes que descienden de Zapathasura , su supuesto fundador. Por su parte, cada éxodo de Ravnos tiene puntos de vista, valores y motivaciones diferentes, lo que da como resultado una multitud de ramas (o castas) del Clan principal indio dentro de Europa.\n\ n#bold Despreciado en el mundo occidental y atrapado en un eterno guerra contra un enemigo mortal en la India, el futuro del Clan Ravnos será muy reñido. Hay mucho por hacer.#!"
bookmark_warofprinces_chandraputra:0 " Chandraputra "
Chandraputra , un salvador y un monstruo, un sirviente y un conquistador, es ante todo una cosa: leal. El único chiquillo de Zapathasura que no ha traicionado a su [ Sire|E ] de una forma u otra, ha asumió el manto de liderazgo para sus compañeros de clan indios.\ nEntre los primeros conquistadores indoeuropeos que invadieron el subcontinente durante sus días mortales, Chandraputra es quizás el general más consumado de la noche, en gran parte debido a la guerra eterna que libra contra los asurazitayya malditos que amenazan a su [ Clan|E ].\n\ n#bold War nunca cambia y tú tampoco.
bookmark_warofprinces_karmenita:0 " Karmenita Yoryari "
bookmark_warofprinces_karmenita_desc:0 "Originalmente de Italia, Karmenita se desilusionó rápidamente con el comportamiento decadente de los Ravnos romanos . Se mudó a Portugal para explorar el lado espiritual de la versión bastarda del Camino de la Paradoja que su [ Sire|E ] le había enseñado [Señor|E] Sin el conocimiento de las doctrinas originales, Karmenita desarrolló la noción de que solo un número limitado de cosas, conceptos, etc., pueden prosperar en el mundo contemporáneo.\ nTambién es una ferviente enemiga de los descerebrados . criminalidad y otros ataques de auto gratificación tan comunes entre su [ Clan|E ], provocando descontento con ella entre sus antiguos hermanos.\n\ n#bold Lentamente estás creando tu propia casta a partir del desorden decadente que tu [ Sire|E ] dejado atrás, pero tienes tus propios problemas familiares con los que lidiar... ¡#!"
bookmark_warofprinces_iago:0 "Iago Castilla"
bookmark_warofprinces_iago_desc:0 "El 'Príncipe pirata' del Mediterráneo es un astuto capitán que fue Abrazado en [ Clan|E ] Ravnos por Karmenita Yoryari . Sin embargo, sus puntos de vista pronto chocaron, ya que al paciente [ Sire|E ] no le gustó el temperamento feroz de su chiquillo. Como tal, Iago escapó rápidamente de sus garras a Córcega. \ nDemostrando ser un líder carismático, Iago ha abrazado por completo su nueva vida como un pirata codicioso y engañoso. Sin embargo, subestimarlo sería un error, ya que sus habilidades para la intriga y la manipulación han dejado a muchos perseguidores muertos en el camino.\n\ n#audaz Hay dinero por ganar y príncipes arrogantes por rebajar un escalón o dos. ¡El Mediterráneo es tuyo para que lo tomes! #!"
bookmark_warofprinces_mritunjay:0 " Mritunjay "
bookmark_warofprinces_mritunjay_desc:0 "El nuevo Príncipe de Bagdad ha planeado este título después de un buen plan contra el último Príncipe, vengándose de ella en el proceso. Como alguien que disfruta de las cosas buenas de la vida y de la no vida, Mritunjay ciertamente lo aprecia . su nueva posición, pero tomarlo por un pomposo bufón sería un error.\ nCon su mente rápida, Mritunjay se ha convertido en un experto en enfrentar facciones entre sí, asegurando su seguridad en el proceso. Podrá usar esta habilidad en un mayor escala.\n\ n#la audaz Bagdad es el mayor de los premios, pero hay amenazas, tanto mortales como no-muertas, con las que lidiar para asegurarla de verdad.#!"
 bookmark_warofprinces_marcia:0 "Marcia Felicia Licinia "
 bookmark_warofprinces_goratrix_desc:0 "Uno de los amigos más cercanos y los estudiantes más prometedores del propio Tremere, Goratrix fue quien ideó el ritual que transformó a la élite de la Casa Tremere en vampiros.\nA pesar de este gran éxito, fue Etrius, el otro estudiante de Tremere, el elegido para actuar como regente de la Casa, enfureciendo a Goratrix. Enviado a Francia como una especie de exiliado, el mago ambicioso y talentoso ya ha aprovechado al máximo su tiempo aquí, ganando una gran influencia en la política francesa.\n\n#negrita Hay algo podrido en la Casa Tremere y lo sabes. . Este tonto Etrius ni siquiera empieza a entenderlo. Debes poner fin a este exilio y salvar al [Clan|E] Tremere antes de que sea demasiado tarde.#!"
 bookmark_warofprinces_marcia_desc:0 "Como la Faedymita en activo de mayor edad , Marcia está orgullosa del legado de su casta, una de guerreros y caballeros, de honor y deber. Sin embargo, su amor por la batalla palidece en comparación con su ansia de conocimiento. Asumir la tarea de escribir una Magnum Opus sobre su [ Clan|E ], Marcia ha estado trabajando arduamente para recopilar información sobre sus dispares hermanos.\ nSin embargo, su determinación le está costando cada vez más, mientras observa con temor cómo los Ravnos caen en decadencia. Ahora está contemplando asumir un papel más activo políticamente.\n\ n#bold No puedes quedarte inactivo mientras tu [ Clan|E ] se entrega a un comportamiento pecaminoso. Podrías hacer Historia, en lugar de solo escribirla.#!"
bookmark_warofprinces_zoe:0 "Zoé"
bookmark_warofprinces_zoe_desc:0 "Una vez que era una mera aprendiz en Constantinopla, Zoe fue herida de muerte durante el saqueo de la ciudad en 1204 y se Abrazó para salvar su vida. Viajando con la población griega exiliada, pronto perdió a su [ Sire|E ] también por un grupo de Inquisidores.\ nSuperada por la ira y la desesperación, Zoe se habría roto si no fuera por la paciente tutoría de Anatole, un compañero de viaje. Los dos aprendieron el uno del otro, y Zoe se vengó de los odiados Inquisidores. Paz, ella se convirtió en la pupila y chiquilla honoraria de su amigo y lo ha seguido hasta el sur de Francia en su propia búsqueda personal.\n\ n#bold Le debes mucho a Anatole, y aún puedes aprender mucho más de él, tal vez finalmente encontrando tu lugar en este mundo en proceso.#!"
bookmark_warofprinces_etienne:0 "Etienne de Fauberge "
bookmark_warofprinces_etienne_desc:0 "Etienne creció sabiendo que nació del pecado y que el mundo que lo rodeaba no era digno a los ojos de Dios. Cuando se emitió el llamado de las Cruzadas, se unió para obtener el perdón. Cuando trató de proteger un comerciante judío cerca de Antioquía, sus compañeros se volvieron contra él, lo golpearon y lo obligaron a mirar mientras degollaban a la familia del comerciante, dejando a Etienne llorando en medio del cuerpo. Fue entonces cuando conoció a su [ Sire|E ], quien se conmovió por su piedad.\ nDesde entonces, Etienne se ha encargado de proteger Acre y actuar como protector de la ciudad santa. En estos tiempos turbulentos, su trabajo está hecho para él.\n\ n#bold Has logrado salvar Acre hasta ahora, pero los disturbios en Tierra Santa nunca terminan. Todavía no te has arrepentido lo suficiente de tus pecados.#!"
                                                                                         
setite_sub_bookmark:0 " Setita "
                                                       
bm_1230_warofprinces_sub_setite:0 "Setita del clan "
bm_1230_warofprinces_sub_setite_desc:0 " La creencia de los Setitas dicta que Set algún día volverá a gobernar o consumir el mundo, y los Setitas devotos preparan el camino para su resurrección. Con este fin, el Clan se mantiene independiente de las sectas de otros Cainitas, y practica con gran habilidad el artes de corrupción, engaño y hechicería antigua.\ nActuando más como un culto religioso que como un verdadero Clan la mayor parte del tiempo, los Setitas siguen siendo fuertes en su tierra natal de Egipto, pero el surgimiento del Islam ha debilitado severamente su poder fuera de ella. encontrar nuevos aliados y difundir la gloria de su Dios a lo largo y ancho, los Setitas , una vez insulares, han comenzado a viajar por todo el mundo.\n\ n#bold El control férreo de Ra sobre el mundo todavía es sofocante. Solo cuando la alabanza de Set es cantada por todos los equivocados Cainitas, que el mundo sea verdaderamente libre.#!"
bookmark_warofprinces_nakhthorheb:0 " Nakhthorheb "
bookmark_warofprinces_nakhthorheb_desc:0 "Antes de la desaparición de Set, los Seguidores no tenían organización. Una vez que su dios desapareció, los Hierofantes se unieron y se declararon administradores del [ Clan|E ].\ nNakhthorheb es el más grande de los Hierofantes; es él quien los sujeta con mano de hierro. Los rumores dicen que nació en la misma tribu nómada que el propio Set. Si bien todas las leyes y órdenes dadas deben ser acordadas por los siete ancianos, es Nakhthorheb quien es la fuente de estas órdenes.\n \ n#bold Con la desaparición de Set, los fieles necesitan tu liderazgo más que nunca. No les falles a ellos ni a él.#!"
bookmark_warofprinces_kemintiri:0 " Kemintiri "
bookmark_warofprinces_kemintiri_desc:0 "Una vez que una sacerdotisa de Isis atrajo la atención no deseada de Set, Kemintiri fue torturada violentamente ante su Abrazo cuando se negó a entregar el secreto que Set buscaba de su Diosa. Incluso este trato cruel no la quebró, y ella soportó su abuso durante muchas noches antes de lograr escapar.\ nDesde entonces, Kemintiri se ha convertido en el peor enemigo del Setita [ Clan|E ], destruyendo el legado de su odiado Sire cada vez que puede. Última sacerdotisa de Isis, un ángel de la venganza que cae sobre un corrupto [ Clan|E ].\n\ n#bold Tu trabajo nunca terminará hasta que todo lo que Set ama sea esparcido por los vientos.#!"
bookmark_warofprinces_andreas:0 "Andreas Aegipto"
bookmark_warofprinces_andreas_desc:0 "Anteriormente sacerdote palestino de la secta hereje monofisita en la cristiandad primitiva, Andreas encontró a Set durante su exilio en Egipto. Demostrando ser un converso inteligente y estudioso, Andreas ha asumido el papel de príncipe comerciante para su [ Clan|E ] , ganando contactos y aliados en toda Europa.\ nSu reputación impecable y sus tratos justos lo han ayudado a crear un imperio comercial, pero su verdadera vocación sigue siendo ayudar a otros a encontrar la verdad de Set, sin importar de dónde provengan.\n\ n#bold Each La persona acepta a Set a su manera. Tú eres simplemente el guía paciente y comprensivo que necesitarán a lo largo del camino.#!”
bookmark_warofprinces_neferu:0 " Neferu "
bookmark_warofprinces_neferu_desc:0 "Una dama en espera de Nefertiti, Neferu fue la agente de Set durante los tiempos difíciles del faraón Akhenaton, y jugó un papel decisivo en la caída de su gobierno herético. Su recompensa fue el Abrazo y la creación de su propio templo, el Tribunal de Fuego.\ nSe ha especializado en corromper a los vampiros extranjeros que intentan conquistar Egipto, una tarea que le ha valido muchos enemigos. Pero, de alguna manera, el Fire Court parece sobrevivir y salir victorioso la mayoría de las veces.\n\ n#bold Your court erosiona los pilares mismos de la civilización lenta y metódicamente.
bookmark_warofprinces_sarrasine:0 " Sarrasina "
bookmark_warofprinces_sarrasine_desc:0 "Como mortal, Sarrasine era un joven en la corte de Justiniano el Grande, quien vio que los señores temporales a menudo no vivían de acuerdo con la ortodoxia de las escrituras, sino con maestros ocultos. Khay'tall Abrazó porque vio algo de sí mismo en el niño.Sarrasine , sin embargo , no correspondió a estos sentimientos . Khay'Tall no tenía muchos amigos entre los Setitas ortodoxos , todavía tenía seguidores entusiastas de su causa y Sarrasine ahora está huyendo.\n\ n#bold Todo este asunto fue simplemente un contratiempo. Es hora de empezar de nuevo, algo en lo que eres muy hábil.#!"
bookmark_warofprinces_arnulf:0 "Arnulfo Jormungandrsson "
bookmark_warofprinces_arnulf_desc:0 "Arnulf Seamundsson fue un comerciante nórdico que viajó a Alejandría durante el siglo IX. Allí, fue introducido en un culto de sangre dedicado al antiguo dios Set y finalmente le concedió el abrazo un miembro de los Seguidores de Set.\ nCuando Arnulfo regresó a Escandinavia, ahora conocido bajo el epíteto de Jormungandrsson , fundó el Salón de Jormungandr como un culto del fin del mundo que adora a la Serpiente del Mundo .\n\ n#bold Mientras el mundo vikingo se desintegra, hay nuevas riquezas y conversos disponibles . . Emocionantes, aunque peligrosos, tiempos.#!"
bookmark_warofprinces_jean:0 "Jean-Baptiste de Montrond "
bookmark_warofprinces_jean_desc:0 "Jean-Baptiste estaba borracho cuando tomó la cruz, es la única explicación de su momentáneo ataque de fervor religioso.\ nMientras estuvo en Mesina, Sicilia, se entregó a todo tipo de depravaciones y herejías con el argumento de que El Papa había prometido que todos los pecados serían perdonados a los cruzados. Después de solo unas pocas semanas, abandonó su deber con la cruz y se rindió al culto de Set. \ nDesde entonces, Jean-Baptiste se ha convertido en el maestro de la vida nocturna de París. , satisfaciendo cada uno de sus retorcidos deseos en el proceso.\n\ n#negrita La no-vida es buena. ¿A quién le importa este chico Set mientras puedes rodearte de placer y riquezas en abundancia? #!"
                                                                                                      
 bookmark_warofprinces_catubodua:0 "Catubudua"
tremere_sub_bookmark:0 " Tremere "
                                                       
bm_1230_warofprinces_sub_tremere:0 "Clan Tremere "
bm_1230_warofprinces_sub_tremere_desc:0 "El Clan de vampiros más joven, los Tremere fueron magos de la Orden de Hermes antes de que su fundador comenzara su búsqueda para preservar su inmortalidad que se desvanecía. Esta búsqueda lo condenó a él, y a la mayor parte de su casa, a convertirse en vampiros.\ nDesde su Desde su nacimiento, los Tremere se han ganado muchos enemigos, desde los Tzimisce cuyas tierras invaden hasta los Salubri por el asesinato de Saulot . Aún así, su disciplina férrea y su poderosa magia les han permitido resistir... hasta ahora.\n\ n# audaz La posición del Clan Tremere es inestable, asediado por enemigos por todos lados. Necesitarán el talento y el intelecto de sus miembros más brillantes para sobrevivir.#!"
bookmark_warofprinces_goratrix:0 " Goratrix "
bookmark_warofprinces_goratrix_desc : 0 _ _ _ _ _ _ _ _ _ _ fue elegido para actuar como regente de la casa, lo que enfureció a Goratrix. Enviado a Francia como una especie de exiliado, el ambicioso y talentoso mago ya ha aprovechado al máximo su tiempo aquí. ganando una influencia muy fuerte en la política francesa.\n\ n #negrita Hay algo podrido en la Casa Tremere y lo sabes. Este tonto Etrius ni siquiera comienza a entenderlo. Debes terminar con este exilio y salvar [ Clan|E ] Tremere antes de que sea demasiado tarde.#!"
bookmark_warofprinces_meerlinda:0 " Meerlinda "
bookmark_warofprinces_meerlinda_desc:0 " Meerlinda es la parte sobria y racional del Consejo Interno de los Siete de [ Clan|E ] Tremere . Dentro de la antigua Casa Tremere , ella era la única mujer considerada digna por Tremere para acompañarlo a los niveles más altos de magia.\ nElla tiene el respeto tanto de Etrius como de Goratrix , siendo capaz de desempeñar el papel de pacificadora dentro del consejo. Enviada a Inglaterra, el papel de Meerlinda es doble. Preparar un nuevo hogar para el [ Clan|E ] si los Cárpatos caen , e investigando los rumores sobre el Santo Grial y su efecto sobre los vampiros.\n\ n#bold Deja que Etrius y Goratrix se peguen entre sí. Cuando ambos fracasen, [ Clan|E ] Tremere se renovará aquí... bajo su cuidadosa supervisión.#!"
bookmark_warofprinces_jervais:0 " Jervais "
bookmark_warofprinces_jervais_desc:0 "Hijo de un escriba francés, Jervais tenía una pequeña chispa de talento mágico, suficiente para atraer la atención de la Casa Tremere , pero no lo suficiente como para convertirse en un poderoso mago por sí mismo.\ nAún así , con una gran dedicación combinada con un ambición despiadada, se las arregló para convertirse en uno de los principales embajadores de los Tremere , fomentando alianzas cruciales para la supervivencia de su [ Clan |E ]. aún: deshacerse de los cismáticos Tremere en Livonia.\n\ n#bold Estás escalando la Pirámide paso a paso. Tu determinación te ayudará.#!"
bookmark_warofprinces_rutor:0 " Rutor "
bookmark_warofprinces_rutor_desc:0 " Rutor nació y se crió en tierras Tzimisce . Fue criado para la guerra, la guerra contra los Tremere que habían invadido la patria ancestral y fue a la guerra, aunque no por su propia elección. Su maestro creía que Rutor había sido sobornado por la sangre . vínculo, pero Rutor era inmune a esto y terminó traicionándola a sus enemigos, ganándose el [ Abrazo|E ] de [ Clan|E ] Tremere como una recompensa ambigua.\ nRutor , sin embargo, estaba tan descontenta y rebelde como siempre y cuando Pensó que su período de aprendizaje había terminado, se fue para establecer su propia base de poder. Después de años de viajar y evitar el contacto con su [ Clan|E ], terminó en Escandinavia, donde hace una oferta para convertirse en Príncipe de Copenhague. .\n\ n#bold Eres tu propio maestro y forjarás tu propio destino.#!"
 bookmark_warofprinces_xavier:0 "Xavier de Cincao "
 bookmark_warofprinces_xavier_desc:0 " Xavier de Cincao , uno de los magos más poderosos de la Casa Tremere , no es un miembro muy activo políticamente del Consejo y prefiere centrar su atención en aprender los secretos de lo sobrenatural, incluso más allá de los vampiros y los magos.\ nComo tal , no fue una gran sorpresa cuando Xavier comenzó a incursionar en el norte de África, viéndolo como una buena base de operaciones para aprender más sobre este continente, bastante misterioso para los Tremere.La influencia de los Tremere tanto en España como en el Magreb se ha expandido enormemente desde su llegada.\n\ n#bold Hay secretos que aprender, pactos que hacer... ¡todo por la gloria del [ Clan|E ], por supuesto .#!"
bookmark_warofprinces_therimna:0 " Terimna "
bookmark_warofprinces_therimna_desc:0 " Therimna fue una vez aprendiz de Goratrix , quien vio en ella tanto una chispa mágica inherente como talento y dedicación. Pronto notó la falta de inmortalidad y le rogó a su maestro que la [ Abrazar|E ], lo cual hizo, antes convirtiéndola en la verdugo oficial de [ Clan|E ] Tremere , un papel en el que se deleitaba .\ nSin embargo , frente a los muchos peligros con los que los primeros [ Clan|E ] Tremere se vieron obligados a enfrentarse, perdió la esperanza. ahora haciendo tratos con cualquier Príncipe que esté dispuesto a escucharla y albergarla, sabiendo que es solo cuestión de tiempo antes de que los Tremere descubran su traición.\n\ n#audaz Sobrevivirás. Tendrás que soportar las dificultades, todo esto vale la pena al final. #!"
 bookmark_inquisitor_premysl_otakar:0 "Otakar Premisl"
bookmark_warofprinces_virstania:0 " Virstania "
bookmark_warofprinces_virstania_desc:0 " Virstania era la aprendiz más joven de la orden Tremere en obtener el rango de maga, pero como era tan joven no pudo entablar amistad con los otros magos.\ nGoratrix creía que Virstania estaba madura para ayudarlo en su próximo proyecto Fue Abrazada y, después de un año de tutoría al lado de Goratrix , se puso a trabajar para incubar la primera de las Gárgolas. , Virstania ha llegado a preocuparse más por sus creaciones que sus compañeros Tremere .\n\ n#negrita Lo harás lucha en las guerras de los Tremere , pero anhelas la noche en la que tus hermosos bebés finalmente puedan ser libres.#!"
                                                                                                              
 bookmark_inquisitor_gedivilas_khazi:0 "Gedivilas Khazi"
bloodlines_sub_bookmark:0 "Líneas de sangre"
                                                       
 bookmark_inquisitor_ladislau_rustovitchi_desc:0 "La casa Zadruga favorita de Voivovode de Voivodes, Vladimir Rustovitch, ha criado y criado cuidadosamente a sus propios parientes mortales para que sean sus fieles guerreros y sirvientes. La familia es conocida por tener una naturaleza iracunda, una tendencia que Vladimir sin duda ha fomentado. Si bien esto los hace formidables, la guerra constante por el Voivodato ha puesto a prueba su número. \n\n#negrita Parece que su destino está inevitablemente ligado a Vladimir. ¿O es eso?#!"
bm_1230_warofprinces_sub_bloodlines:0 "Líneas de sangre"
bm_1230_warofprinces_sub_bloodlines_desc:0 "Los 13 clanes principales no son los únicos que acechan en la noche. Desde el druídico Lhiannan hasta el asiático Wan Kuei , la sangre tiene muchas variaciones. Esos linajes se distinguen claramente de los clanes tradicionales de Caín, ya sea en Sus debilidades , Disciplinas, o ambas , el olvido, hacen de cada linaje un asunto diferente y complicado.\n\ n#bold Se sabe que los 13 clanes principales fluctúan dependiendo de su fortuna política, como con la reciente ascensión de los Tremere entre ellos. .#!"
bookmark_warofprinces_deverra:0 " Deverra "
 bookmark_inquisitor_rodislav_narov_desc:0 "Una familia noble eslava que se ha mantenido en sus costumbres paganas, Razkoljna ha utilizado a estos pálidos acechadores como sus agentes en toda Polonia. A través del matrimonio mixto con Szantovich y Obertus, es una pregunta si la familia continuará sobreviviendo o simplemente será absorbida por casas Zadruga más grandes y poderosas.\n\nMientras que Rodislav se formó como médico, una habilidad que ha mejorado con vicisitudes- -Tampoco es el bisturí más afilado del cajón.\n\n#atrevido ¡La ambición que podría haber tenido alguna vez ha sido socavada por su vínculo de sangre y la dominación del Príncipe de Cracovia.#!"
bookmark_warofprinces_deverra_desc:0 "Nacida como una niña dotada mágicamente en Livonia en una familia devota del dios Telyavel , Deverra nunca olvidó su verdadera lealtad, incluso cuando [ Clan|E ] Tremere la tomó como aprendiz. Ella pidió que la transfirieran a ella. tierra natal Livonia para estudiar la hechicería koldúnica de los Tzimisce .\ nPronto censurada por el resto del clan por sus costumbres paganas, Deverra y su aquelarre tuvieron que buscar nuevos aliados, que encontró en el señor de la guerra mongol Karakh . aliados y ella ahora lo protege diligentemente tanto a él como a su gente del ataque cristiano que se avecina.\n\ n#negrita Tu fe está muriendo, pero aún hay esperanza para una renovación. Mantente firme y obediente a Telyavel y aún podrías prevalecer.# !"
bookmark_warofprinces_magda:0 "Magda"
bookmark_warofprinces_magda_desc:0 "Magda nació en los años previos a la invasión final de Irlanda por parte de los Fir Borg , e ingresó a una edad temprana en el sacerdocio druídico. Durante la invasión, los Fir Borg brutalizaron el cuerpo de Magda y la dieron por muerta, apenas aferrándose a la vida hasta que anochecer. Su padre eligió [ Abrazar|E ] a la joven en lugar de ver sus talentos perdidos por la muerte.\ nMagda descendió sobre los intrusos con una furia que bordeaba la locura, arrojándolos de vuelta al mar cuando llegaron. seguido, la bruja de Connaught ha tratado de tomar suficiente sangre para compensar lo que ella ve como el asesinato insidioso de las costumbres de su pueblo.\n\ n#bold Los normandos pagarán, los nórdicos pagarán, los romanos pagarán... Irlanda se teñirá de sangre muy pronto.#!"
bookmark_warofprinces_marconius:0 " Marconio "
bookmark_warofprinces_marconius_desc:0 "Un mago mortal antes del [ Abrazo|E ], Marconius se especializó en alquimia y trabajó para crear un ser perfecto. Durante el reinado del emperador Julián el Apóstata, bebió una poción hecha con sangre Unseelie Fae, cambiando rápidamente en el No hace falta decir que otros Lasombra se dieron cuenta . Con sus crecientes contactos en el mundo Fae y su bastión rápidamente asegurado de Estrasburgo, no han podido actuar contra él hasta ahora . Sin embargo, pronto podría crear una brecha en las defensas de Marconius . .\n\ n#bold Caminas por una línea peligrosa entre aprender más sobre tu condición y mantener seguro tu Principado. ¡Asegúrate de no caer.#!"
bookmark_warofprinces_chinkhai:0 " Chinkhai "
bookmark_warofprinces_chinkhai_desc:0 "En poder y edad, Chinkhai casi no tiene rival en las estepas. Nieto de Dobrul el hombre y chiquillo de Dobrul el vampiro, ha vigilado la tumba de su [ Sire|E ] durante siglos. Es el responsable . para la defensa de su pueblo, los Anda, contra el asiático Wan Kuei y otros monstruos de la noche.\ nUn nómada de corazón, Chinkhai merodea las tierras de los Anda, administrando justicia dondequiera que vaya, ya sea contra los intrusos invasores o sus rebeldes. hermanos Al igual que la estepa en la que pasa tanto tiempo, no es amable ni perdona y su tipo de justicia a menudo es bastante despiadada.\n\ n#bold Se te ha confiado la defensa de los Anda y así lo harás. En tu camino.#!"
bookmark_warofprinces_catubudua:0 " Catubudua "
bookmark_warofprinces_catubodua_desc:0 "Nacida como princesa del desaparecido reino de Ur, Catubudua era considerada la mujer más hermosa que vivía en la legendaria Segunda Ciudad. Cercana tanto a Brujah como a Troile , se horrorizó cuando ambos se vieron envueltos en un sangriento conflicto.\ nHuyendo de la ciudad, desde entonces ha sido conocida como una diosa gala (de la que todavía usa el nombre esta noche) y una fuerza importante detrás de la renovación carolingia.Finalmente, al encontrar lo que estaba buscando en Francia, partió a tierras lejanas. , buscando el conocimiento perdido para ayudarla a fallar [ Clan|E ].\n\ n#bold Hiciste una promesa a Brujah y tienes la intención de cumplirla, sin importar el tiempo que tome.#!"
bookmark_warofprinces_dyanang:0 " Dyanang "
bookmark_warofprinces_dyanang_desc:0 "La Emperatriz de la Corte del Fénix Escarlata, Dyanang , es conocida como una gobernante relativamente benigna, que deja que todos encuentren su propio camino... la mayor parte del tiempo. A pesar de esto, o quizás debido a eso, su Corte tiene fama de vivir una experiencia violenta y frenética.\ nSu alianza extraña, pero aparentemente fuerte, con la gente feroz de las junglas de Angkor y Dai Viet le ha dado mucha libertad para tratar con aquellos que van demasiado lejos . en busca de algo de emoción.\n\ n#audaz Tu corte se mantiene fuerte y podría ser hora de dejar de mirar hacia adentro. Los herejes indios siempre son una amenaza, una que se vuelve más preocupante con cada noche que pasa.#!"

 bookmark_inquisitor_dhangadeva_nirriti:0 "dangadeva"
 bm_1230_inquisitor_sub_zadruga:0 " Zadruga "
 bm_1230_inquisitor_sub_zadruga_desc:0 "Criados a lo largo de muchas generaciones para servir a los Tzimisce , los Zadruga recorren la línea entre los vivos y los muertos, y entre esclavos y vasallos. No son del todo humanos; en algún lugar entre humanos y vampiros, existen fuera de las normas de la sociedad. Algunos adoran a los vampiros como dioses, mientras que otros aspiran a lograr ese estado ellos mismos. Los Zadruga sirven como peones mortales y posibles candidatos para el Abrazo. Siglos de contacto vampírico, infusiones de sangre vampírica y endogamia han transformado a los aparecidos en un tipo distinto de criatura sobrenatural. . . "
 bookmark_inquisitor_khachigun_kurulas_desc:0 "Uno de los yasun, una extensa familia mortal de los Anda: los Kurulas han sido bendecidos por Itügen con una fracción del poder de los Anda. Existen en el término medio entre el día y la noche.\n\nKhachigun lidera a su familia mientras cabalgan por la estepa como parte de la horda de Ghenghis Khan. Un guerrero de vida dura con temperamento, ya que el patriarca de la familia mantiene un código de honor. La guerra es larga y, a veces, en lo más profundo de sus copas, busca una distracción un poco cerca de casa.\n\n#atrevido Cabalga con los hermanos de sangre y demuestra que eres digno del abrazo.#!"
bookmark_inquisitor_oberto_grimaldi:0 "Oberto Grimaldi"
bookmark_inquisitor_oberto_grimaldi_desc:0 "Los Grimaldi son el enlace principal de los Tzimisce con la sociedad humana y las ciudades estado italianas. Estos intermediarios pasan su tiempo en la sociedad y en ambientes sociales, manteniendo una fachada de normalidad. Son los más 'humanos' de las familias resucitadas y son generalmente a cargo de mantener las propiedades de los Tzimisce y servir como intermediarios para el Sabbat en asuntos mortales como las finanzas y la política.Otras familias de aparecidos ven a los Grimaldi como blandos y los desprecian.Los Grimaldi devuelven el favor, viendo a las otras familias como un favor. esclavos sin sentido y monstruos. Aún así, la alianza formada recientemente con los influyentes Premysl proporciona una ayuda potencialmente importante. Tal vez sea hora de expandirse . Magister sí. Los Tzimisce seguramente apoyarán una jugada de control de Grimaldi. Mónaco es un buen lugar para unas vacaciones.#!"
bookmark_inquisitor_adrian_szantovich:0 "Adrian Szantovich "
bookmark_inquisitor_adrian_szantovich_desc:0 "Una familia adinerada de diletantes degenerados, los Szantovich sienten que su estrella asciende entre los Tzimisce . Hace un siglo, uno de los suyos, Radu, se alzó para convertirse en Cainita Voivoda de Bistriz .\n\ nEl patriarca de la familia , Adrian, casi un siglo más joven que Radu; ha visto a los ahora parientes mayores involucrar a la familia en sus planes relacionados con el Consejo de Cenizas formado por Venture.\n\ n#bold En verdad, Adrian y sus parientes se han vuelto decadentes y libertinos, pero eso hace que ellos no menos peligrosos.#!"
 bookmark_inquisitor_nepos_obertus:0 " Nepos Obertus "
 bookmark_inquisitor_nepos_obertus_desc:0 "Los Obertus son las familias más antiguas de Zadruga. Hace mucho tiempo, sirvieron al enigmático Dracon antiguo, el Espíritu del Triunvirato del Sueño. Con el saqueo de Constantinopla en 1204, su amada Biblioteca de los Olvidados quemada. Desde entonces, esta familia de eruditos ha estado tratando de restablecerse en bibliotecas y monasterios ocultos en toda Europa del Este . Vykos . Si bien ahora están lejos de su hogar ancestral en Bizancio , ahora se encuentran en una zona fronteriza entre el Voivodato y los Ventrue de Black Cross. \n\ n#bold Es una posición política difícil para las scholas, pero con suficiente estudio, aún pueden encontrar una manera de resistir e incluso prosperar".
bookmark_inquisitor_sambor_bratovitch:0 " Sambor Bratović "
bookmark_inquisitor_sambor_bratovitch_desc:0 "Históricos cuidadores de perros y señores visibles de los Tzimisce , los Bratovitch se caracterizan por su violencia salvaje y animal y su ira apenas controlada. Monstruos brutales que suelen servir a los Tzimisce , son luchadores y rastreadores, y rara vez se involucran en buenas relaciones sociales . También son los amos de la perrera de sus amos, y crían perros, lobos y otros animales salvajes para que sus amos los transformen en temibles criaturas que puedan arrojar a sus enemigos.\n\ n#negrita Sambor guía a su familia a través de su fuerza bruta y su notoriedad por haber matado a varios lupinos. Se dice que es dado a apetitos inusuales.#!"
bookmark_inquisitor_vlastimir_vlaszy:0 " Vlastimir Vlaszy "
bookmark_inquisitor_vlastimir_vlaszy_desc:0 "Estos señores de los caballos Vlaszy tienen herencia magiar y eslava. En la antigüedad, el clan Tzimisce salvó a los Vlaszy . Desde esa noche, los caballeros han jurado lealtad reforzada por juramentos de sangre a los Dragones.\n\n\ nVlastimir es un feroz guerrero de su familia. Su crueldad en la guerra atrajo la atención de Ioan Brancoveanu . Vlastimir ahora sirve como su fiel mano izquierda.\n\ n#negrita Si Vlastimir alguna vez tuvo alguna duda sobre su lealtad a Brancoveanu , eso fue completamente aniquilado por la fuerza de su juramento de sangre.#!"
 bookmark_inquisitor_kakhopala_marijava:0 "Kajopala"
 bookmark_inquisitor_kakhopala_marijava_desc:0 "La familia Marijava remonta su ascendencia al líder de una secta Thuggee de ladrones y asesinos. Sirvió a algunos de los primeros Euthanatos de la Tal'Mahe'Ra y, como recompensa, se convirtió en un ghoul. Sus hijos y nietos fueron elegidos para convertirse en ghouls y, a partir de ese momento, se convirtieron en una familia ghoul.\n\nKakhopala es el líder de un culto Thuggee. Los maestros ocultos lo instruyeron en los caminos del Scorched Heart, pero su ira profundamente arraigada es un obstáculo para la perspectiva desapegada de los caminos. Ha sido astuto para encubrir sus excesos, contempla que la Tal'Mahe'Ra oculta los mayores misterios de su conocimiento porque no lo encuentran digno. El hambre de poder de Khakhopala, ha imitado a Nagaraja al consumir carne humana.\n\n#negrita Los secretos de la muerte se pueden descubrir mediante el estudio de los ritos y apetitos de los antepasados.#."
bookmark_inquisitor_premysl_otakar:0 " Otakar premysl_ _
bookmark_inquisitor_premysl_otakar_desc:0 "La Casa de Přemyslid se encuentra entre las dinastías reales más importantes de Europa y domina un gran Reino de Bohemia que se extiende desde el Mar Báltico hasta Hungría. El enigma de su éxito son sus lazos de sangre con el clan Tzimisce .\n\ nWenceslao I se ha hecho cargo recientemente de sus asuntos mortales, mientras que su padre, Otakar , enfoca el verdadero propósito de la familia como sirvientes de Shaagra , Diosa de Vroi . ¿Puede Otakar contentarse con ser un mero lacayo? La red de alianzas que Otakar ha creado ciertamente abre una serie de posibilidades.\n\ n#negrita El repulsivo Nosferatu Josef Zvi con sus advenedizos aliados prometeicos han expulsado a la familia de su hogar ancestral en Praga. asiento ancestral.#!"
bookmark_inquisitor_vilhelm_danislav:0 " Vilhelm danislav "
bookmark_inquisitor_vilhelm_danislav_desc:0 "Originalmente una dinastía noble con vínculos con los Señores de las Sombras, los Danislavs del norte de Transilvania cayeron bajo el dominio de los crueles Tzimisce Florescu , quien los mantiene en sus mazmorras durante los primeros diez años de sus vidas para condicionarlos a servirlo. El Conde Florescu estaba ansioso por mostrar su triunfo y envió a sus aparecidos como embajadores y diplomáticos a los dominios de otros Tzimisce . Ganó un gran prestigio a medida que su culta familia ganaba reputación por sus servicios.\n\ nAunque aparentemente son perros leales, algunos Danislav han logrado mantener un poco de sus viejas costumbres. En el día, mientras su amo duerme, realizan ritos para contactar a los espíritus para liberarlos de su esclavitud eterna y una vez más les dan la bendición del lobo.\n\ n#negrita Es ese trueno junto con el aullido de los lobos que se escucha en la distancia ?#!"
bookmark_inquisitor_gedivilas_khazi:0 " Gedivilas Khazi _
bookmark_inquisitor_gedivilas_khazi_desc:0 "Bizarros y extraños incluso para los estándares de las otras casas de Zadruga, los Khazi son los sirvientes fanáticos de Byelobog , 'el Dios Blanco'. Escondidos en los pútridos pantanos de Pripet, pocos humanos tuvieron la oportunidad de ver el pieles albinas de estos cultistas. A los cultistas no les importa nada el mundo exterior: no forman alianzas ni construyen relaciones externas. Todo lo que tienen y todo lo que son se debe a Byelobog .\n\ nEl patriarca de Khazi , Gedivilas , también es El celoso sumo sacerdote de Byelobog . ¡Cada vez más, ha comenzado a tener visiones inquietantes de una seria amenaza no solo para su familia sino para su mismo Dios! Gedivilas teme enemigos en todas partes: desde misioneros cristianos, otros Tzimisce e incluso miembros de su propia familia que sospecha . están vacilando en su fe!\n\ n#negrita ¡Bylebog debe ser defendido a toda costa!#!"
bookmark_inquisitor_ladislau_rustovitchi:0 " Ladislao Rustovitchi "
bookmark_inquisitor_ladislau_rustovitchi_desc:0 " Vladimir Rustovitch , la casa Zadruga favorita del voivoda de los voivodas, ha criado y educado cuidadosamente a sus propios parientes mortales para que sean sus fieles guerreros y sirvientes. La familia es conocida por tener una naturaleza iracunda, una tendencia de la que Vladimir no tiene duda. Mientras esto los hace formidables, la guerra constante por el Voivodato ha puesto a prueba su número.\n\ n#bold Parece que su destino está inevitablemente ligado a Vladimir.
bookmark_inquisitor_alexandru_basarab:0 " Alejandro Basarab "
bookmark_inquisitor_alexandru_basarab_desc:0 "Poderosos en la batalla, los Tzimisce dan a estos señores de la guerra de Zadruga cierta libertad en su política y en su crianza con la nobleza rumana mortal local. En las próximas noches, la casa seguirá gobernando el Reino mortal de Valaquia.\n\ nPor ahora, el patriarca de la familia Alexandru jura lealtad a Radu de Bistri , pero los rumores sugieren que puede tener otro patrón . y los Draculesti .\n\ n#negrita Draculesti ... ese nombre suena siniestro.#!"
bookmark_inquisitor_rodislav_narov:0 " Rodislav Narov "
Razkoljna , una familia noble eslava que se ha mantenido en sus costumbres paganas, ha utilizado a estos pálidos acechadores como sus agentes en toda Polonia. A través de matrimonios mixtos con Szantovich y Obertus , es una pregunta si la familia seguirá sobreviviendo o simplemente será absorbidos por casas Zadruga más grandes y poderosas.\n\ nMientras Rodislav se formó como médico, una habilidad que ha mejorado con visissitud; tampoco es el bisturí más afilado del cajón.\n\ n#negrita La ambición que podría haber tenido alguna vez se había visto socavada por su vínculo de sangre y dominación . por el Príncipe de Cracovia.#!"
bookmark_inquisitor_bezprym_slatikov:0 " Bezprym Slatikov "
 bookmark_inquisitor_prias_dimitriou_desc:0 "Prias fue una vez gobernante de una ciudad en Asia Menor y era conocido por su belleza. En una ocasión se encontró con una hermosa mujer escondida en una cueva con su doncella. Esta era Helena, en ese momento todavía una mujer mortal, que había huido del rey Minos, que tenía la intención de convertirla en su esposa. La hermosa pareja sabía que estaban hechos el uno para el otro, pero su floreciente amor se interrumpió cuando Minos [Abrazó|E]d a la bella doncella.\nAyudándola a matarlo, Prias ha estado desde entonces a su lado como un demonio, ya que él se negó. convertirse él mismo en un vampiro. Sin embargo, a Helena no le faltan rivales, y la lealtad, la valentía y el amor eterno de Prias son primordiales para Helena esta noche.\n\n#negrita Has encontrado la forma más pura y verdadera del amor, y debes luchar para que siga floreciendo. a pesar de las dificultades que se avecinan.#!"
bookmark_inquisitor_bezprym_slatikov_desc:0 "Una subfamilia de la menguante Casa Narov , la familia ganó recientemente algunos favores del príncipe de Cracovia. Hace menos de una docena de años, un joven vástago diplomático de la casa, Zara, fue abrazado por Razkoljna . " \n\ n#audaz ¿Zara recordará sus raíces y protegerá a su familia, o la fortuna de los Slatikov seguirá a la decadente Narov .#!"
 bookmark_inquisitor_haqim_almunajjim_desc:0 "Este necrófago, cuyo nombre de nacimiento se ha perdido, fue el protegido de un Guerrero Assamita durante la guerra del clan contra los Baali. Cuando el maestro del ghoul fue destruido, el Juramento de Sangre retrocedió sobre él y destrozó su psique, lo que lo llevó a huir al desierto. Otros asumieron que el ghoul había perecido junto con su maestro. Sin embargo, sobrevivió y no regresó al [Clan|E], sino que usó sus dones y la experiencia para tender una emboscada a varios [cainitas|E] y prosperar, sofocando su ansia de vitae.\nCuando se enteró de un lugar llamado Aluh Amut y una secta de asesinos mortales, fue allí y asumió el manto de liderazgo de ellos. Con el tiempo, el necrófago asumió el nombre de Haqim, el propio [antediluviano|E] de los Assamitas, en una oscura burla de sus antiguos amos.\n\n#negrita Solo hay un verdadero Haqim y cualquier pretendiente pronto aprenderá a ¡Te tengo miedo! #!"
bm_1230_inquisitor_sub_revenants:0 "Aparecidos"
bm_1230_inquisitor_sub_revenants_desc:0 "Es posible que los atributos de los necrófagos se vuelvan innatos. Las características de los necrófagos pueden, con esfuerzo, ser heredadas a través de varias generaciones de necrófagos a través de los esfuerzos de crianza de sus maestros vampiros, dando como resultado una familia de aparecidos; necrófagos cuyos cuerpos producen naturalmente vitae Las familias de ghouls hereditarios creados por los Tzimisce no son las únicas dinastías de este tipo que existen en el mundo. Fuera de las tierras eslavas, se pueden encontrar varias familias de 'regresados', creadas a partir de la sangre de otros clanes por diseño o casualidad".
 bookmark_inquisitor_esona_bomkazi:0 " Esona Bomkazi "
 bookmark_inquisitor_esona_bomkazi_desc:0 "La bruja de la vida Bomkazi promulgó un gran ritual que les permitió a ella y al vampírico nigromante Impundulu concebir una hermosa niña, pero el ritual tenía un precio. Inmediatamente después de la concepción, tanto Impundulu como Bomkazi sintieron que algo era diferente en su hijo. Como producto de la vida o la muerte, la niña, a la que llamaron Esona , era una resucitada . El linaje de Impundulu ya no podía alimentarse de nadie más que de ellos. Cuando Esona tuvo la edad suficiente, se ofreció voluntariamente a mantener el Laibon de su padre. chiquillo , a quien veía como su propio hermano. A partir de este emparejamiento inicial, surgieron fuertes lazos entre la línea mortal de Esona , a la que llamó Bomkazi en honor a su madre, y el linaje de Impundulu.\n\ n#negrita ¿Será para siempre el pacto entre la vida y la muerte?#!"
bookmark_inquisitor_berthold_ducheski:0 "Berthold"
bookmark_inquisitor_berthold_ducheski_desc:0 "Los Krevcheski eran una oscura familia de eruditos con un gran interés en las máquinas de asedio, los mecanismos de relojería y el ocultismo. Los intermediarios se abrieron camino hasta las cortes de Zadruga y finalmente encontraron a los Tzimisce como sus entusiastas aunque extraños patrocinadores.\n \ nLa relación con los demonios no sería eterna. Surgió un nuevo poder en la tierra, o más bien un viejo poder transformó . Traición a sus amos. Ahora llamados Ducheski , los relojeros ahora están sujetos a los dictados de los magos usurpadores. Berthold Ducheski lidera el familia por la fuerza de su intelecto y una acumulación de conocimientos prohibidos . es incapaz de alterar la situación que sus antepasados han creado. #!"
bookmark_inquisitor_tajaddin_kairouan:0 " Tajaddin "
bookmark_inquisitor_tajaddin_kairouan_desc:0 "Los Kairouan son una familia de necrófagos creada mediante experimentos de hechiceros assamitas con aparecidos Tzimisce . Provenientes de la provincia del mismo nombre en el norte de África, están entrenados desde que nacen para ser candidatos al abrazo, aunque cada casta busca reclutas de esta línea.\n\ nTajaddin se ha entrenado como un guerrero con especialidades en subterfugios e infiltración. Si bien aún no ha sido elegido para el abrazo, confía en que su servicio diligente algún día será recompensado. stock' y lo está juzgando sobre la base de hacer crecer a la familia por el linaje con éxito pasando la sangre entre generaciones. No es garantía más allá de hacer una inversión muy personal en su familia para ayudar al resultado. n#bold ¿Será aceptado? Tiempo lo diré.#!"
bookmark_inquisitor_pavel_angustri:0 "Pavel"
bookmark_inquisitor_pavel_angustri_desc:0 "En su guerra contra las fuerzas de Baba Yaga , Durga Syn y sus Ravnos Los chiquillos a veces han creado necrófagos entre los pueblos nómadas de Rusia. A lo largo de los siglos, algunos de ellos se han hecho realidad. Dotados con los poderes de la ocultación, la agilidad sobrenatural y la segunda vista, se han convertido en excelentes agentes para la lucha del caos contra la Cortina de sombras de Baba Yaga .\n\ nPara los mortales , la familia Angustri es desconfiada por charlatanes y brujas. Tienen fama de ser seductores y engañosos. Pavel lidera a su familia con su personalidad amistosa y una red de mentiras.\n\ n#bold Las frías noches rusas están llenas de terror, tu mejor esperanza es contar con un amable mentor.#!"
bookmark_inquisitor_dhangadeva_niriti:0 " Dhangadeva "
 bookmark_inquisitor_layla_desc:0 "Una criatura de misterios y leyendas, se rumorea que Layla es hija de la propia Lilith. Como tal, su inmortalidad es bastante diferente a la de los vampiros y alberga un profundo odio por los [cainitas|E] que traicionaron a su Madre Oscura.\nOtras pistas apuntan a que bebió la sangre de Lilith en su lugar, tal vez directamente, o tal vez por la intermediario de un viejo y poderoso patrón. Esta teoría se ve reforzada por su vaga asociación con la misteriosa Tal'mahe'Ra, una secta de poderosos ancianos, algunos de los cuales adoran a la misma Lilith.\nCualquiera que sea la verdad, Layla es una criatura muy poderosa y peligrosa, tal vez incluso algo más que un ghoul, y muchos se preguntan en silencio cuáles podrían ser realmente sus objetivos finales.\n\n#negrita La Madre Oscura, tu Madre Oscura, te habla. No te defraudará.#!"
bookmark_inquisitor_dhangadeva_nirriti_desc:0 "Los Niriti son una familia de la casta Brahamin , el karma les ha dado una gran carga. Los dioses Shiva, Rudra y Vritra deben servir al grupo de demonios sagrados: los Daitya ".\n\ nActúan como familia patriarca y sumo sacerdote del culto de Nirriti , Dhangadeva es un administrador eficiente de los asuntos del culto, si no el más iluminado espiritualmente. Aún así, la sangre mística de sus antepasados le ha servido bien en los fundamentos del verdadero Raktamaya: el Yoga . de la ilusión. La sangre es preciosa, y debe asegurarse de que la familia conserve este gran tesoro. Con ella, podrán servir a sus amos demoníacos lo mejor que puedan, como ha decretado Shiva.\n\ n#Bold Change the mundo con asesinatos, engaños y profanación de los ritos sagrados para que Shiva abra su tercer ojo y produzca un mundo nuevo!#!"
bookmark_inquisitor_khachigun_kurulas:0 " Khachigun "
bookmark_inquisitor_khachigun_kurulas_desc:0 "Uno de los yasun , una extensa familia mortal de los Anda: los Kurulas han sido bendecidos por Itügen con una fracción del poder de los Anda. Existen en el término medio entre el día y la noche.\n\ nKhachigun lidera su familia mientras cabalgan a través de la estepa como parte de la horda de Ghenghis Khan. para una distracción.\n\ n#bold Cabalga con los hermanos de sangre y demuestra que eres digno del abrazo.#!
bookmark_inquisitor_valenti_crassus:0 " Valentí "
bookmark_inquisitor_valenti_crassus_desc:0 "Una vez que una familia de patricios romanos, estos aparecidos amorales ofrecen con entusiasmo sus servicios a los Cainitas a cambio de poder. Como hay posesiones en el sur de Italia, por lo general son los Lasombra quienes llenan sus arcas.\n\ nComo pater familias de el Crassus, Valenti es un negociador de agosto, pero uno con apetitos decadentes.\n\ n#audaz mientras actualmente es aliado del Clan de las Sombras, un pequeño empujón podría ponerlo al servicio de la corte pecaminosa de Camilla.#!"
bookmark_inquisitor_habil_qarnaim:0 " Hablar "
bookmark_inquisitor_habil_qarnaim_desc:0 "En las largas y oscuras noches cerca de Túnez, algunos todavía cuentan historias y cantan las canciones de la derrotada Cartago. Roma, bajo el liderazgo de sus amos secretos, trató de destruir Cartago. Mataron a los héroes, derribaron las murallas, dispersaron o esclavizaron a la gente y sembraron los campos con sal.\n\nLa gente se había preparado. La sangre de Troile y Aníbal corre por sus venas. Nombrado por su padre en honor al gran general, Habil ha asumido el cargo de liderar su tribu . para proteger los lugares sagrados secretos de "los eruditos" como Jebel Boukornine . ¡Esperan, observan y se preparan para la guerra! Uno vendrá a reconstruir la ciudad y despertar a los durmientes. Será necesario realizar actos oscuros y cumplir las promesas. n\ n#bold ¡El señor es misericordioso! ¡Veremos la restauración de Cartago!#!"
bookmark_inquisitor_mohkku_keskinen:0 " Mohkku "
bookmark_inquisitor_mohkku_keskinen_desc:0 "Los Keskinen sirven a la anciana loca llamada Louhi . Se desconoce cómo o cuándo la mística adquirió esta familia, o si ella misma creó el linaje con rituales robados. Los Keskinen son una familia muy pequeña y muy unida, que son Incluso más insondables que su maestro Matusalén. Viajan por toda Europa adquiriendo materiales alquímicos y, ocasionalmente, intercambian conocimientos con Tzimisce . kolduns o místicos mortales. Practican magias antiguas, en su mayoría olvidadas, impulsadas en parte por su sangre retorcida y tradiciones transmitidas a lo largo de muchos años.\n\ nMohkku está casi tan loco como Louhi , pero alberga un secreto que teme que Louhi no acepte. Tiene compasión por los demás y, a veces , realiza acciones en secreto que van en contra de la insensibilidad del abismo.\n\ n#negrita ¿Quizás hay otra forma de conocimiento que a través de la indiferencia de los demás?#!"
bookmark_inquisitor_johann_gravenor:0 "Johann"
bookmark_inquisitor_johann_gravenor_desc:0 "Familia bárbara y solitaria que vive en las afueras de la ciudad, han tenido la desafortunada consecuencia de haber sido elegidos por los Nosferatu como sirvientes. Los Nosferatu suelen ser animales ghoul o mendigos raros, pero los Gravenor son otros. A medio camino entre el hombre y monstruo, entre el día y la noche, permanecen en un crepúsculo horrible. Cada sorbo de sangre de Nosferatu que toman los atrae más hacia la maldición y la red de intriga.\n\ nAnders es el mayor de la familia y ha abrazado a la Bestia eso ha ido creciendo en él. Dado que se está convirtiendo en un monstruo, ha decidido deleitarse con él.\n\ n#audaz, aquellos que vagan demasiado cerca de las posesiones de Gravenor pueden terminar convertidos en salchichas.#!"
 bookmark_inquisitor_salinguerra_rafastio:0 " Salinguerra "
 bookmark_patronwar_richard_uagemred_desc:0 ""
 bookmark_inquisitor_salinguerra_rafastio_desc:0 "Originalmente magos y brujas de cobertura del valle del Po, algunos tienen vínculos con Verbena. Ningún Rafastio puede convertirse en vampiro de ninguna manera; el Abrazo nunca funciona y lo que queda del aparecido se disuelve en la nada en unos momentos, impidiendo que siga prevención". investigación.\n\ nSalinguerra lidera un aquelarre de adoradores de Lilith. Aunque es un hombre, es bien considerado por su conocimiento, así como por el soberbio equilibrio que mantiene entre el dolor y el placer durante los ritos. Fue capaz de póngase en contacto con Manus Nigrum para concertar una alianza con la familia Enrathi para que ambas líneas puedan prosperar en el norte de Italia.\n\ n#negrita Si la alianza con la mano negra se mantiene, Rafastio puede hacer una jugada para expandirse fuera del valle del Po Si no, el aquelarre tendrá que encontrar un nuevo aliado.#!"
bookmark_inquisitor_kajopala_marijava:0 " Kajopala "
bookmark_inquisitor_kakhopala_marijava_desc:0 "La familia Marijava remonta sus ancestros al líder de una secta Thuggee de ladrones y asesinos. Sirvió a algunos de los primeros Euthanatos del Tal'Mahe'Ra y, como recompensa, se convirtió en un ghoul. Sus hijos y los nietos fueron elegidos para convertirse en ghouls y, a partir de ese momento, se convirtieron en una familia ghoul.\n\ nKakhopala es líder de un culto Thuggee. Los maestros ocultos lo instruyeron en los caminos del Corazón Quemado, pero su ira profundamente arraigada es un obstáculo . a la perspectiva desapegada de los caminos . Ha sido astuto para encubrir sus excesos, contempla que la Tal'Mahe'Ra oculta los mayores misterios de su conocimiento porque no lo encuentran digno . al consumir carne de personas.\n\ n #negrita Los secretos de la muerte se pueden descubrir mediante el estudio de los ritos y apetitos de los ancestros.#.”
bookmark_inquisitor_cephus_dhabi:0 " Cefo "
bookmark_inquisitor_cephus_dhabi_desc:0 "Originalmente sirvientes de Nergal en Mashkan-Shapir , los d'habi sufrieron división cuando algunos de ellos perdieron la fe en Nergal y lo traicionaron con Moloch. Sin embargo, algunos de los d'habi , Nergal solía espiar a su línea de sangre y actuar como sus manos contra los rivales, asesinándolos en su sueño diurno y luego mantener a raya a sus enemigos cuando se reveló nuevamente bajo la máscara de Shaitan. Desató plagas contra aquellos que no lo siguieron y llevó a la mayoría de los Baali a Después de la derrota de Shaitan en Knossos en la Segunda Guerra Baali , los antepasados de Cephus continuaron con su lealtad a Nergal.\n\ nEn el siglo XI, Azaneal descubrió la puerta olvidada a Chorazin . lasombra , se abrió la puerta a la ciudad inferior y su tumba de Namtaru . Después de emerger empoderado de la tumba, Azaneal ha llamado a los Baali , a los infernalistas y a los D'habi para que se unan a él. \n\ n#negrita Cephus y su get han respondido a la llamada del nuevo Shaitan de Chorazin .#!"
bookmark_inquisitor_ebrahim_dhabi:0 "Ebrahim"
bookmark_inquisitor_ebrahim_dhabi_desc:0 "Originalmente sirvientes de Nergal en Mashkan-Shapir , los d'habi sufrieron división cuando algunos de ellos perdieron la fe en Nergal y lo traicionaron ante Moloch. los D' habi para apoyar . _ _ _ _ _ entre el aspirante a shaitan Azaneal , sus seguidores y los ancianos Baali no impresionados . Ebrahim y su familia siguen la línea de los D'habi que traicionaron a Nergal en Mashkan - Shapir .- han prometido su ayuda a Molochim .\n\ n#bold ¡Azaneal debe ser detenido antes de que desate las plagas de Namtaru sobre el mundo!#!"
 bm_1375_patronwar_sub_gangrel_desc:0 "Con tanta gente muriendo y la civilización pareciendo colapsar, ahora es el momento del lobo. En todas partes, lo salvaje invade el dominio de los tejedores. Los sobrevivientes recurren al misticismo pagano en busca de una cura para esta terrible plaga. ¿Pueden las bestias hacer el mundo de nuevo? Un mundo donde el hombre vive en armonía con la naturaleza; el coto de caza perfecto en el que los Gangrel pueden cazar vacas."
bookmark_inquisitor_pancrazio_rosselini:0 " Pancracio "
bookmark_inquisitor_pancrazio_rosselini_desc:0 "Al igual que los Giovanni, los Rossellini tenían fuertes lazos con Venecia, donde ambas familias practicaban la nigromancia. Otros magos de la Edad Media consideraban a los Rossellini como los nigromantes más talentosos. Además de las formas de nigromancia, muchos Rossellini Incluso entonces, los Rossellini a menudo eran considerados histéricos o desequilibrados. Después de la conversión de sus rivales Giovanni en un linaje de Capadocia, los Rossellini, al principio, no se vieron afectados, excepto que comenzaron a esforzarse más a sí mismos y a sus artes para competir. con sus rivales. Los Rossellini han sido criados cuidadosamente por Augustus Giovanni para convertirse en Revenants, después de que se acercaron a él en busca de una cura para una terrible enfermedad que los había asolado.\n\ n#negrita Incluso para los estándares de Giovanni Pancrazio , el patriarca de los Rosselini , se considera cruel.#!"
bookmark_inquisitor_sadiq_rawan:0 "Sadiq"
 bookmark_patronwar_bimbee_desc:0 ""
bookmark_inquisitor_sadiq_rawan_desc:0 "Una vez que una humilde gente de pescadores, la familia ha sido dominada y criada al servicio del excéntrico Ventrue , Anushin- Rawan. Los sirvientes han sido criados para ser obedientes descendientes de Anushin- Rawan y esto continúa hasta aquellos heredados de ella. Estas criaturas sirven como esclavos de placer, recipientes y sirvientes.\n\ nSadiq es casi un sirviente perfecto para Anushin -Rawan: diligente, paciente, almeja. Incluso es guapo. Al parecer, siempre sabe lo que debe decir y puede incluso conversa con los Cainitas sobre una variedad de temas intelectuales. Uno de sus únicos defectos es la afición por los dulces y los pasteles, y su tendencia a probar los hermosos manjares también con los que está relacionado.\n\ n#bold Anushin -Rawan exige un palacio y sirvientes a la altura. Es un paraíso para los que la visitan, tanto para los vivos como para los muertos. Los gritos ni siquiera son comunes.#!"
bookmark_inquisitor_matteo_enrathi:0 "Mateo"
 bm_1375_patronwar_sub_lasombra:0 "Clan Lasombra"
 bm_1375_patronwar_sub_lasombra_desc:0 "El Clan de las Sombras ha atravesado tiempos difíciles a medida que su rebaño religioso muere en masa y los monasterios se convierten en tumbas. El ganado clama por la salvación de Dios... y él no responde. Con su influencia en los mortales menguando, algunos Magisters miran profundamente en la oscuridad en busca de respuestas. ¿Escucharon el susurro de una respuesta?"
bookmark_inquisitor_matteo_enrathi_desc:0 "La familia Enrathi tiene su ascendencia en los granjeros etruscos, mucho antes de que Roma se convirtiera en una potencia importante. Aproximadamente en la época en que la república política romana se convirtió en imperio, los enrathi se convirtieron en traficantes de esclavos. En los tiempos y lugares donde la esclavitud estaba prohibida, los Enrathi desarrolló redes de contactos y un repertorio en expansión, y cuando los Manus Nigrum se acercaron a ellos, se unieron con gusto.\n\nEl patriarca de la familia, Matteo, es tan codicioso, cruel y libertino como sus predecesores.\n \ nLas alianzas con las brujas del valle del Po son útiles por ahora, pero Matteo está bastante dispuesto a traicionar a Rafastio si surge la necesidad.\n\ n#bold ¡Toma lo que puedas, no des nada a cambio!#!"
bm_1230_inquisitor_sub_ghouls:0 "Necrófagos"
bm_1230_inquisitor_sub_ghouls_desc:0 "Alimenta a casi cualquier criatura viviente con un poco de sangre de vampiro y se convierte en un necrófago, al menos temporalmente. Los necrófagos son omnipresentes, fáciles de crear y de los que se abusa gravemente.\ nSin embargo, algunos de sus necrófagos forjan sus propios caminos. Ya sea por haberse alimentado de Antiguos vitae durante miles de años, la destrucción de sus sires o alguna otra coincidencia; estos que alguna vez fueron esclavos de los vampiros tienen la oportunidad de encontrar su propio destino.\n\ n#negrita ¿De sirvientes a amos?#!"
bookmark_inquisitor_prias_dimitriou:0 " Prías "
bookmark_inquisitor_prias_dimitriou_desc:0 " Prías fue una vez gobernante de una ciudad de Asia Menor y era conocido por su belleza. Una vez se encontró con una mujer hermosa escondida en una cueva con su doncella. Esta era Helena, en ese momento todavía una mujer mortal , que había huido del rey Minos, que tenía la intención de convertirla en su esposa. La hermosa pareja sabía que estaban hechos el uno para el otro, pero su floreciente amor se truncó cuando Minos [ abrazó|E ]d a la bella doncella.\ nAyudándola a matarlo Desde entonces , Prias ha estado a su lado como un ghoul, ya que él se negó a convertirse en vampiro. Sin embargo, a Helena no le faltan rivales, y la lealtad, la valentía y el amor eterno de Prias son primordiales para Helena esta noche . Encontraste la forma más pura y verdadera de amor, y debes luchar para que siga floreciendo a pesar de las dificultades que se avecinan.#!”
bookmark_inquisitor_haqim_almunajjim:0 " Haqim "
 bookmark_patronwar_hakon_fystond:0 "Hakon Fystond"
bookmark_inquisitor_haqim_almunajjim_desc:0 "Este necrófago, cuyo nombre de nacimiento se ha perdido, era el protegido de un Guerrero Assamita durante la guerra del clan contra los Baali . Cuando el maestro del necrófago fue destruido, el Juramento de Sangre retrocedió y destrozó su psique, llevándolo a Otros asumió que el ghoul se había posado junto con su maestro. Sin embargo, sobrevivió y no regresó al [ Clan|E ], sino que usó sus dones y la experiencia para tender una emboscada a varios [ cainitas|E ] y prosperar, sofocando su deseo para vitae.\ nCuando se enteró de un lugar llamado Aluh Amut y una secta de asesinos mortales, fue allí y asumió el manto de liderazgo de ellos. Con el tiempo, el necrófago adoptó el nombre de Haqim , el propio [ antediluviano|E ] de los Assamitas , en una oscura burla de sus antiguos amos.\n\ n#bold Solo hay un verdadero Haqim y cualquier pretendiente pronto aprenderá a ¡Te tengo miedo! #!”
bookmark_inquisitor_heinrich_von_totten:0 " Heinrech "
bookmark_inquisitor_heinrich_von_totten_desc:0 "Prior del monasterio en el lago Tötten , ha sucumbido a las tentaciones del diablo y el monasterio ahora está inundado, ahogado en sangre, libertinaje y pecado."
bookmark_inquisitor_folch:0 " Folch "
 bookmark_patronwar_jimeno_fitzroy_desc:0 "Antes de su abrazo, Jimeno FitzRoy era un noble menor en Valencia, pariente lejano de algún rey español (o eso afirma). Construyó algo de mala reputación, debido al hecho de que se mezcló libremente con comerciantes sin escrúpulos, ladrones y canallas. Su desviación y voluntad de torcer las leyes para su beneficio llamarían la atención de un Lasombra poderoso, que buscaba un mortal para abrazar.\n\nTras el abrazo, Jimeno se sintió atraído por las turbias olas, como lo son algunos Lasombra. Reclutó a los criminales que conoció en su vida anterior para tripular sus barcos y emprender un gran viaje lleno de aventuras, batallas y mucho botín saqueado. Asaltar y divertirse es lo suficientemente bueno para algunos corsarios, pero Jimeno eventualmente encontró su vida en el mar... restringida. Aprovechando el caos en el Levante causado por las cruzadas, tomó el control de algunos puertos clave y decidió 'establecer una tienda'. Nació la Corte de los Cuervos."
bookmark_inquisitor_folch_desc:0 "Desde sus humildes comienzos como mercenario holandés tras la cruzada contra los albigenses, Folch ha visto todo lo que el mundo [ cainita|E ] tenía para ofrecerle: engaño, codicia y falsas promesas. A pesar de su estelar (y bastante despiadado) servicio a algunos de los vampiros más poderosos de Francia, Folch nunca pudo asegurar el [ Abrazo|E ] que tanto anhelaba , ya que se lo consideraba demasiado peligroso. Desde entonces, el veterano ahora canoso ha comenzado a usar vampiros como lo usaron en el pasado y no tiene reparos en traicionarlos o emboscarlos si eso significa que su suministro de sangre está seguro . en el futuro, pero serán tus propios términos. Hasta entonces, hay más sangre para derramar... y beber.#!"
 bookmark_patronwar_narcandana_markov_desc:0 ""
bookmark_inquisitor_basil_gantenbein:0 "Albahaca"
bookmark_inquisitor_basil_gantenbein_desc:0 "Anteriormente un ghoul esclavo del Caitiff [ cainite|E ] Stanislav de Calomena's Elegido, Basil y su hermano Bayezid su Bogomil corrompido por los intereses de los no-muertos. Cuando Stanislav fue destruido durante la caída del Sueño de Michael 1204 los hermanos Gantenbein fueron liberados de sus lazos de sangre. Desde entonces, han comenzado a llamarse a sí mismos " Renegados de Calomena " y han liderado a los fieles bogomilistas en ataques contra vampiros en toda Bosnia. Basil ha comenzado a cuestionar la ambición de Bayezid y su deseo de crear más ghouls. \n\ n#negrita ¡Calomena , la hermana de Caín, desea la destrucción de sus chiquillos no muertos ! #!"
bookmark_inquisitor_goreb_bakenankhe:0 " Goreb "
bookmark_inquisitor_goreb_bakenankhe_desc:0 "Un sirviente de Ankhe , este demonio continúa manteniendo la antigua fe en el regreso de Set; aunque el Islam llegó a Egipto cuatro siglos antes de que él naciera. ¿Cómo terminó en Serbia? Ahora... eso es un cuento."
bookmark_inquisitor_hugh_marston:0 "Hugh Marston"
 bookmark_patronwar_petronia_desc:0 ""
bookmark_inquisitor_hugh_marston_desc:0 "No había nada que le gustara más a Hugh que el sonido de su espada al romper huesos, y escuchó mucho de eso durante la Primera Cruzada. Al convertirse en mercenario para continuar con su sangriento trabajo, pronto fue puesto al servicio de un señor Ventrue . Su considerable destreza y lealtad pronto le ganaron suficiente sangre para convertirse en un ghoul. sangre.\ nIrónicamente , esto fue durante este período que encontró la fe cuando fue convertido por la Herejía Cainita.\n\ n#bold Tienes la convicción de los recién convertidos y el brazo de tu espada es tan fuerte como siempre. te ha bendecido .#!"
 bookmark_patronwar_bronach_o_cennfhaelaid_desc:0 ""
bookmark_inquisitor_layla:0 "Layla"
bookmark_inquisitor_layla_desc:0 "Una criatura de misterios y leyendas, se rumorea que Layla es hija de la propia Lilith. Como tal, su inmortalidad es bastante diferente a la de los vampiros y alberga un profundo odio por los [ cainitas|E ] que la traicionaron. Madre.\ nOtras pistas apuntan a que ella bebió la sangre de Lilith en su lugar, tal vez directamente, o tal vez por medio de un viejo y poderoso patrón.Esta teoría se ve reforzada por su vaga asociación con el misterioso Tal'mahe'Ra , una secta de Ancianos poderosos, algunos de ellos adorando a la propia Lilith.\ nCualquiera que sea la verdad, Layla es una criatura muy poderosa y peligrosa, tal vez incluso algo más que un necrófago, y muchos se preguntan en silencio cuáles podrían ser realmente sus objetivos finales.\n\ n# negrita La Madre Oscura, vuestra Madre Oscura, os habla.
bookmark_inquisitor_laurent:0 "Laurent de Angers"
bookmark_inquisitor_laurent_desc:0 "Nacido como Lorcan, este príncipe de una pequeña tribu irlandesa de parientes se quedó para liderarlos cuando sus protectores lupinos fueron asesinados por sus rivales. Gracias a su rápida comprensión de la guerra y las capacidades de liderazgo, a Laurent le fue bien y ayudó a su tribu a sobrevivir. hasta la repentina llegada del despacho vampírico de la misteriosa Isouda de Blaise.\ nSintiendo una oportunidad, y cautivado por las habilidades y la belleza angelical de Laurent, el enviado lo llevó a la sangre como un ghoul y lo ayudó a atacar contundentemente a sus enemigos Lupins . Una vez finalizada esa amenaza , le presentó a Laurent a la propia Isouda , quien pronto vio el potencial del niño y asumió el cargo de mentor.\n\ n#negrita La corte de Isouda está llena de maravillas y horrores, el más impresionante de todos probablemente sea la propia Isouda . Aprenderás y prosperarás, como siempre lo haces.#!"
        
bm_1375_patronwar_sub_brujah:0 "Clan Brujah "
 bm_1375_patronwar_sub_ravnos:0 "Clan Ravnos"
bm_1375_patronwar_sub_brujah_desc:0 "Los Brujah se han aliado en África occidental con un líder prometeico que se hace llamar Aníbal para formar una Nueva Cartago."
bookmark_patronwar_brand_de_draeck:0 "Marca deDraeck "
bookmark_patronwar_brand_de_draeck_desc:0 "Era un potestad guerrero conocido como 'De Draeck '. Luchó contra los daneses que obligaban a tributar en los alrededores. Se negó a pagar a los daneses. Se produjo una batalla en la que los holandeses ganaron con 500 " de 800 daneses asesinados, incluido su líder. Sin embargo, los holandeses también perdieron a su líder.\n\ nO eso se pensó, en realidad fue abrazado durante la batalla, fue poseído, cambió su identidad y desde entonces ha viajado por Europa para encontrar su lugar Finalmente, regresó a Holanda para gobernar desde las sombras mientras luchaba por recuperar la cordura, o sucumbía a la locura".
bm_1375_patronwar_sub_cappadocian:0 "Clan Capadocio"
bm_1375_patronwar_sub_cappadocian_desc:0 "La Peste Negra ha matado a millones en todo el mundo conocido. ¿Todo esto ha sido un complot del Clan de la Muerte? Estudian la enfermedad con atención".
bookmark_patronwar_marcus:0 "Marco"
 bookmark_patronwar_narcissus_cephissus_desc:0 ""
bookmark_patronwar_marcus_desc:0 "Los Mortificadores llevan a cabo todo tipo de experimentos con las montañas de cadáveres que la Peste Negra ha puesto a su disposición. ¿Buscan el poder de la plaga o acaban con ella para siempre?"
 bookmark_patronwar_tykado_desc:0 ""
bookmark_patronwar_richard_uagemred:0 "Richard Uagemred "
 bookmark_patronwar_daniel_hawk_desc:0 ""
bookmark_patronwar_richard_uagemred_desc:0 “”
 bookmark_patronwar_ghazia_khatun_desc:0 ""
bookmark_patronwar_luna_morningstar:0 "Luna Lucero del Alba"
bookmark_patronwar_luna_morningstar_desc:0 "Como humana, Luna siempre fue diferente de sus compañeros. Contemplaba la vida y la muerte, estaba interesada en lo extraño y enamorada de la noche. Algo en eso la calmaba. La brisa lenta pero implacable que atravesaba las rocas de su La casa de los padres que asustaría a otros niños la hacía sentir cómoda y segura. El crujido de la madera bajo sus pies y el silencio de un cuarto oscuro inspiraron su imaginación. Una bruja. Mientras los inquisidores la preparaban para la hoguera, sus gritos de ira y angustia llegó a un señor de los vampiros local que vio su implacable odio por la raza humana. Él la salvó y poco después la abrazó. Quería ver qué caos y sufrimiento podía hacer un individuo tan hermoso y loco antes de condenarse a sí mismo o si ella puede levantarse a través del rangos de la corte nocturna y conviértete en una verdadera Señora de la noche".
 bookmark_patronwar_lucia_canale:0 "Lucía Canale "
 bookmark_patronwar_lucia_canale_desc: 0 "Lucía aparentemente apareció de la nada y, por suerte, muchos de sus oponentes en su poder tuvieron 'accidentes desafortunados' excepcionales o cambios repentinos de corazón. Su padre fue identificado como un hombre en la sombra conocido como Guiseppe que fue visto por última vez en su camino a una reunión con ella; se desconoce si su destino fue Diablerie, apostar o simplemente la Muerte Final para atar el último cabo suelto. Quizás no uno para enfadar si su maestro de espías no es muy competente ".
bm_1375_patronwar_sub_setite:0 "Clan Setita "
bm_1375_patronwar_sub_setite_desc:0 "El Clan de la Fe continúa manteniendo su bastión en Egipto, ahora bajo el liderazgo de un centurión romano".
bm_1375_patronwar_sub_gangrel:0 "Gangrel del clan"
bm_1375_patronwar_sub_gangrel_desc:0 "Con tanta gente muriendo y la civilización pareciendo colapsar, ahora es el momento del lobo. Por todas partes, la naturaleza salvaje invade el dominio de los tejedores. Los sobrevivientes recurren al misticismo pagano para curar esta terrible plaga. Las bestias hacen el mundo de nuevo? Un mundo donde el hombre vive en armonía con la naturaleza, el coto de caza perfecto en el que los Gangrel pueden aprovecharse de las vacas .
bookmark_patronwar_caelia_tertia:0 " Caelia Tercia "
bookmark_patronwar_caelia_tertia_desc:0 "Nacida en el año 390 d. C. en la ciudad de Roma, Caelia en vida fue la tercera hija de un centurión romano. No se sabe mucho sobre su vida humana simplemente porque no hay mucho que saber, sin mencionar que la mayoría de los registros de su época fueron destruidos; vivió una vida tranquila en Roma hasta que los galos la saquearon en el 410 d.C. Su padre y sus hermanos mayores estaban en la lucha, y mientras intentaba huir se vio atacada por un Vástago. Lo mejor que pudo, pero fue una batalla sin esperanza desde el principio y fue derrotada con desdeñosa facilidad. Huyó hacia el este después de eso, pasando los siguientes siglos expandiendo y dominando sus poderes y reuniendo fondos y poder. Ahora, su momento finalmente puede haber llegado..."
bookmark_patronwar_bimbee:0 " Bimbee "
bookmark_patronwar_bimbee_desc:0 “”
bookmark_patronwar_gorm:0 "gordo"
bookmark_patronwar_gorm_desc:0 "El hombre era un guerrero feroz. Su voluntad en el campo de batalla y su manejo cuidadoso de las tropas y el posicionamiento lo llevaron a tener muchas batallas exitosas. Brunhilde lo vio durante una de ellas . Mientras se estaba muriendo después de matar a cuatro asaltantes. , ella lo abrazó y lo dejó solo en la naturaleza para que sobreviviera. Él comenzó a arrasar activamente con aquellos que escupían a los dioses. Actuando como comandante y verdugo, fue enviado a matar las raíces podridas del árbol de la vida. Cualquier Einherjar que se desviara del camino tenía que responder por sus crímenes contra los dioses y pocos de ellos vivieron lo suficiente para unirse a los cristianos Por desgracia, con cada batalla que ganaba, otras se perdían y los cristianos nunca parecían retroceder. Las relaciones entre los Einherjar llevaron a Midgar a desmoronarse".
 bm_1375_patronwar_sub_lasombra:0 “Clan Lasombra ”
 bm_1375_patronwar_sub_lasombra_desc:0 "El Clan de las Sombras ha atravesado tiempos difíciles, ya que su rebaño religioso muere en masa y los monasterios se convierten en tumbas. El ganado clama por la salvación de Dios... y él no responde. Con su influencia en los mortales menguando, algunos Magisters mirar profundamente en la oscuridad en busca de respuestas.
bookmark_patronwar_michel_tenoctis:0 "Miguel Tenoctis "
bookmark_patronwar_michel_tenoctis_desc:0 "No se sabe mucho sobre él, ya que normalmente se reserva para estudiar el Abismo. Todo lo que se sabe es que ya había descubierto la existencia del Abismo y comenzó a estudiarlo antes de ser engendrado. Eso es lo que llamó la atención de clan Lasombra y eventualmente lo llevó a su estado actual de no-muerto, cortesía del clan antes mencionado".
 bookmark_patronwar_dunnlang_cathail:0 "Dunnlang"
 bookmark_patronwar_dunnlang_cathail_desc:0 ""
bookmark_patronwar_gabriel_felipe:0 "Gabriel Felipe"
bookmark_patronwar_gabriel_felipe_desc:0 "Descendiente de una familia que alguna vez fue noble, Gabriel ha sido preparado para gobernar desde su nacimiento. Después de su Abrazo, optó por permanecer fuera del centro de atención y gobernar desde las sombras, como corresponde a un miembro del clan Lasombra . "
bookmark_patronwar_elder_diego:0 "Diego mayor"
 bookmark_patronwar_faustus_desdeuxvalleesvertes_desc:0 ""
bookmark_patronwar_elder_diego_desc:0 "Diego es un ex monje de una orden sagrada cristiana . Solía ser un cazador, pero fue abrazado después de una cacería exitosa por un padre que pensó que sería divertido y no le importaba mucho la pareja de neonatos. Diego interceptó".
 bookmark_patronwar_severus_maximus_dominatus_desc:0 ""
bookmark_patronwar_hakon_fystond:0 " Hakon Fystond _
 bookmark_patronwar_alexandru_desc:0 ""
bookmark_patronwar_hakon_fystond_desc:0 "Siempre llamó la atención de todos cuando era niño debido a su piel pálida como un cadáver. Pasó la mayor parte de su infancia en el bosque buscando alimento y luego comenzó a cazar. Era inteligente y astuto y luego se unió a una banda de ladrones conocida. por atacar a soldados y comerciantes que viajaban por Nordmark . Terminó en una banda de ladrones, hasta que una noche tuvo "suerte" de ser abrazado.\ nSu padre era un paria del Mar de las Sombras, pero nunca mencionó por qué".
bookmark_patronwar_eridanus:0 "Eridanus Erebus"
bookmark_patronwar_eridanus_desc:0 "Percibiendo los tratos antinaturales de los monstruos que lo crearon, Damián intenta descubrir su papel en sus maquinaciones y un método para desmantelar las ataduras fantasmales que lo obligan a observar tranquilamente las políticas mezquinas y agotadoras entre tontos pérfidos. Incluso ahora en muerte, busca una solución al camino que ha seguido desde su nacimiento.\n\ n#bold El camino de menor resistencia, tal como fluye el río, solo terminará cuando encuentre el mar.#!"
bookmark_patronwar_jimeno_fitzroy:0 " Jimeno Fitzroy"
bookmark_patronwar_jimeno_fitzroy_desc:0 "Antes de su abrazo, Jimeno FitzRoy era un noble menor en Valencia, pariente lejano de algún rey español (o eso afirma). Se ganó una mala reputación, debido al hecho de que se mezclaba libremente con Comerciantes sin escrúpulos, ladrones y canallas. Su desviación y voluntad de torcer las leyes en su beneficio llamarían la atención de un poderoso Lasombra , que buscaba un mortal para abrazar.\n\ nTras el abrazo, Jimeno se sintió atraído por las turbias olas: Reclutó a los criminales que conocía en su vida anterior para tripular sus barcos y emprendió un gran viaje lleno de aventuras, batallas y mucho botín saqueado . Finalmente encontró su vida en el mar... restringida. Usando el caos en el Levante causado por las cruzadas, tomó el control de algunos puertos clave y decidió 'establecer una tienda'.
bookmark_patronwar_narcandana_markov:0 " Narcandana Markov"
bookmark_patronwar_narcandana_markov_desc:0 “”
bm_1375_patronwar_sub_malkavian:0 "Clan Malkavian "
bm_1375_patronwar_sub_malkavian_desc:0 "En esta calamidad, la gente lucha por comprender lo que está sucediendo. ¿Los ha abandonado Dios? ¿Es esto el Apocalipsis? ¿Ha llegado la Gehena? Los oráculos anuncian la llegada de nuevos profetas que prometen salvación o misterios aún mayores."
 bookmark_patronwar_robert_desc:0 ""
bookmark_patronwar_aleksandr:0 "Aleksandr"
 bm_1375_patronwar_sub_bloodlines_desc:0 "Después de la Peste Negra, ciertas líneas de sangre pudieron reafirmarse temporalmente. En particular, los Baali forjaron un imperio en Mesopotamia, donde los Salubri se opusieron a ellos y aún se aferraban a la Dieta de los Olivos. En Gran Bretaña, un nuevo Avalon emergió bajo un Salubri reclamando el manto del Rey Arturo, mientras que una línea de sangre de hadas tocadas apareció en Escocia. Otro reino Salubri se estableció en Lhasa bajo un místico chino. ¡Incluso el Caitiff encontró un campeón en Venecia!"
 bookmark_patronwar_aleksandr_desc : " Patriarca ecuménico de la Iglesia del Tercer Caín".
bookmark_patronwar_petronia:0 " Petronia "
bookmark_patronwar_petronia_desc:0 “”
 bookmark_patronwar_amducious_desc:0 "Nacido en Francia en 787, Amducious era un noble francés en la corte de Carlomagno en el apogeo de su reinado. Fue uno de los consejeros más cercanos de Carlomagno y un hombre extremadamente inteligente. Era conocido por su mente astuta y retorcida, pero también estaba plagado de la paranoia que era común en la corte francesa. Abrazado por Azaneal en la noche de la muerte de Carlomagno, rápidamente tomó su nueva no vida y se despojó de la antigua, su nombre original perdido en la historia. La Orden ahora solo conoce a Amducious. Rápido en sus estudios de Daimoinon, se hizo conocido como el Señor Engendrado por el Infierno dentro de la Orden y muy respetado dentro de la línea de sangre por sus experimentos y estudios."
bookmark_patronwar_bronach_o_cennfhaelaid:0 " Bronach O'Cennfhaelaid "
bookmark_patronwar_bronach_o_cennfhaelaid_desc:0 “”
bookmark_patronwar_izalda_kishlovsky:0 " Izalda Kishlovsky "
 bookmark_patronwar_irge_hectsaehtf_desc:0 ""
bookmark_patronwar_izalda_kishlovsky_desc:0 " Izalda dejó a su [ Sire|E ], Mellandis , y se exilió, aún llena de dolor por la muerte de sus hermanas. Durante este tiempo, se sumergió profundamente en su propia historia [ Clan|E ] y encontró textos e información sobre el Ordo Aenigmatis .\ nAhora, inspirada por el camino del Ordo, ha regresado a Leczyca , su ciudad natal, tomando fácilmente su lugar como condesa.Sin embargo, siendo solo el primer paso de un plan mucho más elaborado para elevar a ambos los Malkavian y el Ordo Aenigmatic . Mientras tanto, ella estará justo en el medio, lista para desatar el verdadero conocimiento sobre el mundo y su poder de cosecha".
bm_1375_patronwar_sub_nosferatu:0 "Clan Nosferatu"
 bookmark_patronwar_illitharn_sagaard:0 "Sagaard de Illiharn"
 bookmark_patronwar_illitharn_sagaard_desc:0 ""
 bookmark_patronwar_abe_no_seimei_onmyoji:0 "Abe No Seimei Onmyōji"
bm_1375_patronwar_sub_nosferatu_desc:0 "Los priores merodean en las sombras. Muchos han desaparecido por completo en letargo, aunque algunos se aprovechan de los enfermos y moribundos tras las máscaras de médicos de la peste."
bookmark_patronwar_nicolas_davry:0 "Nicolas d'Avry "
 bookmark_patronwar_cody_dio_desc:0 ""
bookmark_patronwar_nicolas_davry_desc:0 "¿Qué es más ridículo que un caballero de Nosfeartu ? Un caballero de Nosfeartu que sería príncipe del oeste de Francia."
bm_1375_patronwar_sub_ravnos:0 “Clan Ravnos ”
bm_1375_patronwar_sub_ravnos_desc:0 "Ni siquiera el Clan de los Errantes puede escapar de esta enfermedad. Aunque corran hasta los confines de la tierra... ni siquiera Irlanda se salvará de los estragos de la Peste Negra".
 bm_1375_patronwar_sub_toreador:0 "Clan Torero"
 bm_1375_patronwar_sub_toreador_desc:0 "El jardín ha muerto. Han muerto tantos artistas. Ya no hay fiestas. El olor de los pétalos de rosa apenas puede cubrir el hedor de los cadáveres en descomposición por todas partes. Y, sin embargo, si miras de cerca, se forman nuevos brotes y la esperanza de la primavera. Abraza a los artistas que aún pueden salvarse y gana sangre como puedas".
bookmark_patronwar_anatolios_tenebris:0 " Anatolios Tenebris "
bookmark_patronwar_anatolios_tenebris_desc:0 " Anatolios pudo establecerse como un miembro leal, ejecutivo e inteligente del clan. En tan poco tiempo, pudo destituir al antiguo gobernante local y jurar lealtad al gobernante de Voivodate . Ni Vladimir Rustovich ni la matriarca duda de su lealtad, pero ¿y si la lealtad y los votos no son más que pretextos y la nueva "familia" es el objetivo principal para vengarse de la antigua y verdadera familia?
bookmark_patronwar_narcissus_cephissus:0 "Narciso Cefiso "
bookmark_patronwar_narcissus_cephissus_desc:0 “”
bookmark_patronwar_tykado:0 " Tykado "
bookmark_patronwar_tykado_desc:0 “”
bookmark_patronwar_daniel_hawk:0 "Daniel Halcón"
bookmark_patronwar_daniel_hawk_desc:0 “”
bookmark_patronwar_ghazia_khatun:0 " Ghazia Khatun"
bookmark_patronwar_ghazia_khatun_desc:0 “”
bookmark_patronwar_cecilia:0 "Cecilia"
bookmark_patronwar_cecilia_desc:0 "Algunos deseos están prohibidos por una buena razón."
bm_1375_patronwar_sub_tremere:0 "Clan Tremere "
bm_1375_patronwar_sub_tremere_desc:0 "En el caos de la Peste Negra y muchos Consejos de los Siete cayendo al menos temporalmente en letargo, tres grandes casas luchan por liderar a los Tremere ."
bookmark_patronwar_cyrus:0 "Ciro"
bookmark_patronwar_cyrus_desc:0 "El aquelarre de brujos del Zorro Verde ha llegado a dominar el este de Francia. Se rumorea que este aquelarre se ha alejado de la estricta adherencia al Código de Tremere y en su lugar se mantiene en el Camino de la Humanidad y la Mascarada."
bookmark_patronwar_ruadh_sutherland:0 " Ruadh Sutherland"
bookmark_patronwar_ruadh_sutherland_desc:0 "Él era un arzobispo del cristianismo. Cree que los vampiros son parte de la voluntad de Dios, pero el abrazo lo tenía inclinado. Cree que los vampiros son pastores de humanos, que no son más que ganado para ser guiados a través de los testamentos. de los vampiros a lo que piensan y ven que es lo correcto. Si bien él cree que los humanos no deberían mentir o asesinar (a menos que sus señores vampiros les digan que lo hagan), cree que los vampiros pueden usar estas herramientas "por un tiempo". Greater Good". Él cree que las personas son buenas o malas, y ve el mundo en blanco y negro. Goratrix lo abrazó como un sacerdote con un inmenso conocimiento de la religión y el ocultismo. que incluso Goratrix tuvo que enviarlo por un mientras que a Malta, para poder calmarse y aclarar su mente. Su mecanismo de afrontamiento le hizo creer que todavía es un agente de Dios, pero luego comenzó a ver el mundo como blanco y negro, el bien y el mal".
bookmark_patronwar_morgano_murchadh:0 " Morgano Murchadh "
bookmark_patronwar_morgano_murchadh_desc:0 " Morgano se hizo conocido por su locura en noches más recientes, después de haber salido de su investigación aislada, el Brujo vio que muchos de los parientes menores, como Caitiff, habían ascendido a posiciones prominentes. Habiendo estudiado las profecías de Gehenna a fondo, tomó Esto como un presagio y comenzó su propia cruzada para limpiar Europa de los sin clan , reuniendo a muchos vampiros tradicionalistas a su lado mientras lo hacía. Mientras solía experimentar con sus cautivos, el Señor Loco de la Casa Murchadha ahora eligió quemar a sus enemigos . En la hoguera o en sus casas, a veces pueblos y ciudades enteras fueron quemadas hasta los cimientos si había rumores de que albergaban a los sin clan . Sin embargo, debido a su aislamiento y la indiferencia de los clanes altos, nadie ha detenido la loca búsqueda de Morgano por Hungría. ."
bm_1375_patronwar_sub_tzimisce:0 "Clan Tzimisce "
bm_1375_patronwar_sub_tzimisce_desc:0 "Mientras que la mayoría de los clanes han luchado para sobrevivir a esta plaga apocalíptica, los Tzimisce han prosperado. Transformarse o perecer, y oh, cómo se han transformado los Tzimisce : ya sea en una noción idealizada de la perfección humana, en nuevos extremos de decadencia hedonista, o alguna mutación desconocida de la carne de más allá de la oscuridad exterior".
bookmark_patronwar_matthaios:0 " Matthaios "
bookmark_patronwar_matthaios_desc:0 "Los seguidores de Asakku han establecido un reino en el norte helado de Siberia al que han llamado Hiperbórea."
bookmark_patronwar_gavrili:0 " Gavrili "
bookmark_patronwar_gavrili_desc:0 " Gavrili era un noble mezquino. Un soldado en la vida mortal, como su padre y su abuelo antes que él. Fue criado para ser un protector de su pueblo.\n\ nComo vampiro, disfruta perversamente cazando y alimentando sobre los mortales de sus antiguas tierras.\n\ nA pesar de ser leal a su clan, Gavrili lucha por comprender la filosofía superior de los Tzimisce . Lo compensa recluyéndose en su dominio y centrándose en la crianza de linajes ghoul".
bookmark_patronwar_descardion:0 " Descardión "
bookmark_patronwar_descardion_desc:0 "Fue arrancado de las canteras de Egipto cuando su conocimiento y perspicacia llamaron la atención de su sire. Su sire inculcó una sed de conocimiento para ayudar a combatir el estancamiento del tiempo. Como seguidor de Tariq el -Sama, Descardion cree que la lucha entre uno mismo y la bestia es una prueba definitiva de Alá. Trabaja diligentemente para llevar el aprendizaje y la fe a quienes lo rodean. Sus experimentos a menudo se internalizan, pero ha tomado medidas extremas en el pasado, como matar a un pueblo entero o personalmente imponiendo ayunos de un mes de duración para purgar la mente y el cuerpo (y los individuos débiles) de las tribus locales ... más que cualquier otro rasgo. controlar ng el pueblo de Egipto ".
bookmark_patronwar_dunnlang_cathil:0 " Dunnlang "
bookmark_patronwar_dunnlang_cathil_desc:0 “”
bookmark_patronwar_liliana_szantovich:0 "Liliana Szantovich "
bookmark_patronwar_liliana_szantovich_desc:0 "Preparado para el abrazo por su Sire, Stoffer Ravensburg, que extrae su ascendencia del Dracon. Al principio de su abrazo, se descubrió que Stoffer era un Infernalista , y con la ayuda de su otro chiquillo , Miguel Barbaneagra , cazó derribar a Stoffer y darle la muerte definitiva. Ahora ella trabaja para asegurar su posición dentro de la corte de Voivode Brancoveanu , a pesar de sus animosidades mutuas. Todavía mantiene un nivel de lealtad a su antigua educación Revenant, y busca proteger y asegurar su antigua El lugar de la familia en el mundo con poco éxito".
 bookmark_patronwar_faustus_desdeuxvalleesvertes:0 " Fausto de los Dos Vallées Vertes "
 bookmark_patronwar_faustus_desdeuxvalleesvertes_desc:0 “”
bookmark_patronwar_severus_maximus_dominatus:0 "Severus Maximus Dominatus "
bookmark_patronwar_severus_maximus_dominatus_desc:0 “”
bookmark_patronwar_alexandru:0 " Alejandro "
bookmark_patronwar_alexandru_desc:0 “”
bm_1375_patronwar_sub_ventrue:0 "Clan Ventrue "
bm_1375_patronwar_sub_ventrue_desc:0 "En el caos de esta enfermedad, el mundo clama por el orden, ¡y el Clan de los Reyes responderá! Cumpliremos nuestras deudas con el ganado , pero para sobrevivir debemos tener absoluta obediencia y lealtad. No admita desafíos a nuestra autoridad. El cetro supremo dentro de un puño cerrado".
bookmark_patronwar_nicholas_masterson:0 "Nicholas Masterson"
bookmark_patronwar_nicholas_masterson_desc:0 "Un Ventrue que se ha declarado guardián de Seth, este noble Vástago ha tratado de proteger al ganado de los peores monstruos que acechan en las noches de la Peste Negra".
bookmark_patronwar_kylar_shadovie:0 "Kylar"
bookmark_patronwar_kylar_shadovie_desc:0 "Nacido como hijo bastardo de un noble, aprendió las intrigas de la corte para sobrevivir, a pesar de que era un niño enfermizo. A los 26 años, mientras fabricaba un gancho para su señor, un vampiro irrumpió en su castillo y lo abrazó. ."
bookmark_patronwar_aryan_de_gray:0 "Ario de Grey"
bookmark_patronwar_aryan_de_gray_desc:0 "Hijo de un caballero sin tierras que había jurado lealtad al conde de Chester, Aryan de Grey pasó su infancia bajo la tutela de la corte de su señor. Se mostró capaz en el combate, lo que le valió un lugar como el miembro más joven de la guardia de su señor, esto fue Pronto lo siguió un puesto de mando en sus ejércitos. El joven tendría la oportunidad de probarse a sí mismo durante una rebelión en Normandía. En el transcurso de cinco años logró ser capturado tres veces. A pesar de estas situaciones desafortunadas, fue elogiado por su valentía y habilidad, ganándose la confianza del propio rey. El punto culminante de su carrera puso fin a la guerra, en la batalla de Brémule 1119 logró derrotar a la caballería enemiga y lideró una carga en su flanco derecho. maniobra no tuvo nada que ver con las órdenes que recibió y fue descrita como "un golpe de genio" y "un acto de pura locura". En cualquier caso, condujo a una victoria decisiva, una que se emed a costarle la vida a Aryan. Un vampiro tuvo otra idea".
 bookmark_birthofsects_seinia_desc:0 "Una [cainita|E] terrateniente menor alrededor de Novgorod, Seinia era una dueña estricta, pero cariñosa, de su rebaño. Como tal, una vez que su propiedad fue atacada y todos fueron masacrados, se sorprendió por el hecho de que realmente los extrañaba.\nEntrando en un séquito de Caballeros de las Cenizas Amargas, Seinia hizo causa común con ellos para vengar a su gente. Luego se unió a su orden y se convirtió en una de las pocas mujeres en recibir el Grial [Abrazo|E].\nSin embargo, la Inquisición destruyó la mayor parte de la orden, y Sienia se encontró cayendo cada vez más en sus viejos hábitos de dudosa moralidad. Al perder la fe y la convicción, se unió al naciente Sabbat y se desempeña como el arzobispo ruso más exitoso hasta el momento.\n\n#negrita Tus sueños infantiles de redención han quedado atrás. La única verdad en este mundo es el poder, y tu alma puede ser condenada en el camino por el poco bien que te hizo.#!"
bookmark_patronwar_robert:0 "Roberto"
bookmark_patronwar_robert_desc:0 “”
bm_1375_patronwar_sub_bloodlines:0 "Líneas de sangre"
bm_1375_patronwar_sub_bloodlines_desc:0 "Después de la Peste Negra, ciertas líneas de sangre pudieron reafirmarse temporalmente. En particular, los Baali forjaron un imperio en Mesopotamia, donde se opusieron los Salubri que todavía se aferraban a la Dieta de los Olivos. En Gran Bretaña, un nuevo Avalon emergió bajo un Salubri reclamando el manto del Rey Arturo, mientras que un linaje de fantasmas tocados por las hadas anidaba en Escocia .
bookmark_patronwar_alexarchus:0 " Alexarco "
bookmark_patronwar_alexarchus_desc:0 " Alexarchus era un místico conocido que viajó por el mundo cuando aún era mucho más joven y con una lucha mucho menos sangrienta de lo que es ahora. Al ver que el mundo antiguo caía lentamente en peligro y en pequeños poderes, él en sus obras como místico ofreció la población a menudo huyendo de un pueblo algún consuelo en su miseria.Cuando su abrazo llegó a suceder, no perdió su naturaleza bondadosa de inmediato, pero se volvió inmensamente solitario.en sus aposentos, tratando de lograr lo que a menudo es inalcanzable. "
bookmark_patronwar_amducious:0 " Amducioso "
 bookmark_birthofsects_phaedyme_desc:0 "Phaedyme fue originalmente un soldado en el ejército de Alejandro Magno, disfrazado de hombre para escapar del destino que se esperaba de su sexo. En India, Phaedyme fue [Abrazada|E]d por Kali, y viajaron por el mundo durante mucho tiempo antes de establecerse en la Galia. Se dedicó a dominar la guerra y el honor.\nFascinada por los ideales de la caballería y la caballería, sin embargo, se vio obligada a entrar en [letargo|E] durante la mayor parte de la Edad Media. Ahora que ha despertado recientemente, se enfurece al ver que los ideales que le encantaban se han desvanecido y está reuniendo a sus seguidores más cerca de la India y lejos de las sectas corruptas, con la esperanza de preservar algo del legado caballeresco en este nuevo hogar.\n\n#negrita A medida que Europa olvida el código de honor marcial que tanto amabas, debes buscar en otra parte y comenzar de nuevo. ¡Aún es tiempo de que los Ravnos Knights perduren y prosperen!#!"
bookmark_patronwar_amducious_desc:0 "Nacido en Francia en 787, Amducious era un noble francés en la corte de Carlomagno en el apogeo de su reinado. Fue uno de los consejeros más cercanos de Carlomagno y un hombre extremadamente inteligente. Era conocido por su mente astuta y retorcida, pero también estaba plagado de la paranoia que era común en la corte francesa. Abrazado por Azaneal en la noche de la muerte de Carlomagno, rápidamente tomó su nueva no-vida y se despojó de la anterior, su nombre original perdido en la historia. La Orden ahora solo conoce a Amducious Rápido en sus estudios de Daimoinon , se hizo conocido como el Señor Engendrado por el Infierno dentro de la Orden y muy respetado dentro de la línea de sangre por sus experimentos y estudios.
bookmark_patronwar_patrick_ramos:0 "Patricio"
bookmark_patronwar_patrick_ramos_desc:0 "Abrazado y abandonado a su suerte, la única manera de ganarse el respeto es a través de la fuerza y el poder. Sin ningún clan que lo detenga, Patrick años hasta el día en que pueda controlar a los Cainitas y a los Mortales y hará cualquier cosa. necesita para ganar poder y construir el mundo a su imagen".
bookmark_patronwar_irge_hectsaehtf:0 " Irge "
bookmark_patronwar_irge_hectsaehtf_desc:0 “”
bookmark_patronwar_aedan_cathasach:0 "Aedan Cathasach "
bookmark_patronwar_aedan_cathasach_desc:0 "Aedan fue abrazado por un verdadero anciano Brujah preocupado por la desaparición y corrupción de los aulladores blancos. Como descendiente de los druidas que trabajaron con los aulladores blancos, su sire esperaba que Aedan pudiera proporcionarle una idea del misterio".
bookmark_patronwar_illitharn_sagaard:0 “ Illitharn sagaard_ _
bookmark_patronwar_illitharn_sagaard_desc:0 “”
 bookmark_patronwar_abe_no_seimei_onmyoji:0 "Abe no Seimei Onmyoji _
 bookmark_patronwar_abe_no_seimei_onmyoji_desc:0 "Un onmyōji , un destacado especialista en onmyōdō durante la mitad del período Heian en Japón. Onmyōdō es un sistema de ciencias naturales, astronomía, almanaque, adivinación y magia que se desarrolló de forma independiente en Japón basado en las filosofías chinas y el yin yang y wuxing (cinco elementos). Además de su prominencia en la historia, es una figura legendaria en el folclore japonés y ha sido retratado en una serie de historias. Seimei trabajó como onmyōji para los emperadores y el gobierno de Heian, asesorando sobre la forma espiritualmente correcta . para tratar los problemas. Rezaba por el bienestar de los emperadores y del gobierno, además de asesorar sobre diversos temas. También era astrólogo y predecía eventos astrológicos. Contribuyó a la creencia popular de que tenía poderes místicos. Hacia el final de su vida, fue abrazado por uno de los Salburi orientales ".
bookmark_patronwar_cody_dio:0 "Cody Dio "
bookmark_patronwar_cody_dio_desc:0 “”
bookmark_patronwar_arturia_pendragon:0 " Arturia "
bookmark_patronwar_arturia_pendragon_desc:0 "Afirma liderar la defensa de Gran Bretaña contra los invasores sajones y se disfraza de hombre entre los mortales."
bookmark_patronwar_aethelflaed:0 " Æthelflæd "
bookmark_patronwar_aethelflaed_desc:0 "Engendrado por Melusine d'Anjou como más o menos una obra de arte viviente y un juguete, ha acumulado un mínimo de poder simplemente por ser favorecido por ella y por encantar a quienes lo rodean en lugar de a través de cualquier competencia real por la cual él falta seriamente. Tanto su nombre como la casa de cadetes, Doe, le fueron otorgados por ella como una cuestión de entretenimiento y para adaptarse a un tema determinado.\n\ n#negrita Demuestra que estás más que asumido, o no t.#!"
bookmark_patronwar_memnon:0 "Memnón"
bookmark_patronwar_memnon_desc:0 "Memnon era un rey semidiós etíope que luchó contra el héroe Aquiles. Aunque Memnon cayó en la batalla, Zeus quedó impresionado con su habilidad y valor y le concedió la inmortalidad. Tras regresar a su tierra natal, vagó durante un tiempo desesperado por su derrota hasta caer en letargo. Cuando despertó en el siglo XII, regresó a Grecia para enfrentarse y derrotar a Aquiles . de Grecia para probar su temple antes de regresar a Etiopía . Ahora desea demostrar su valía forjando un imperio afín de Etiopía. O tal vez esta leyenda sea toda una invención, creada por un guerrero Gangrel que deseaba inflar su invención para inspirar devoción a sus seguidores y miedo a sus enemigos.\n\ n#bold ¡ El mundo verá el temple de Memnon con la restauración de Aethiopia ! #!"
bookmark_patronwar_phillip:0 "Felipe"
bookmark_patronwar_phillip_desc:0 "Phillip era un prometedor arquitecto italiano que fue contratado por Marcelo de Alejandría para restaurar la ciudad de Alejandría y su biblioteca. Al examinar la ciudad, Phillip comentó en qué ruina y tugurio se había convertido la ciudad, hasta qué punto cayó de su antigua gloria , y cómo se necesitarían décadas de restauración para que la biblioteca y la ciudad vuelvan a ser grandiosas . Fiesta puntuada por la inspiración arquitectónica. Después de ser abrazado, llegó a despreciar a la Jyhad y a ser eternamente maldecido por Dios. Huyó de regreso a través del Mediterráneo. Ha comenzado a construir proyectos para que los mortales distraigan a la Bestia, pero comienza a verlos cada vez más como muñecos en una casa de muñecas.\n\ n#bold ¡ Esta existencia es miserable y el único consuelo es construir de nuevo !#! "
bookmark_patronwar_senen:0 " Senen "
bookmark_patronwar_senen_desc:0 "El Vigilante Blanco es una figura antigua y enigmática entre los magister. Su progenie, los Renegados, es una rama de Lasombra a la que a menudo se hace referencia como la 'sombra blanca' que actúa como guardián del Silencio de Sangre- -la Mascarada. Valoran el deber por encima de todo y sirven como vigilantes para salvaguardar el futuro de su casa y dinastía.\n\ n#bold ¡Es nuestro deber hacer cumplir la Mascarada, sin importar lo que cueste! #!"
bookmark_patronwar_golub:0 "Golub"
bookmark_patronwar_golub_desc:0 "Con antecedentes como un noble bosnio menor, un devoto seguidor del bogomilismo y un médico talentoso, Golub atrajo la atención y el abrazo de Nikita de Sredetz . Esto, sin embargo, no produjo un peón voluntario que combinara Influencia, devoción religiosa y aprendizaje para Nikita.\n\ nGolub estaba muy horrorizado por la Herejía Cainita y su corrupción de la iglesia. Se siente responsable de devolver el golpe a los monstruos que tienen como rehén a la fe. Con este fin, ha atacado a varios Se encontró con ancianos y sirvientes de la Herejía. Sin darse cuenta, a pesar de verse a sí mismo como un salvador, llegó a considerar a las instituciones religiosas como el enemigo. Ve la influencia de la Herejía y de su sire detrás de todo.\n\ n#bold Destroy the Cainite ¡Herejía y libera al pueblo de sus manipulaciones!#!"
bookmark_patronwar_niobe:0 "Níobe"
bookmark_patronwar_niobe_desc:0 "Niobe nació alrededor del siglo XIV a. C. en la ciudad-estado micénica de Tebas, ubicada en Beocia. Los testimonios sobre su encuentro con su Sire Amphion, el "Músico", se perdieron en los meandros del tiempo . fundó un culto dedicado a la Vía Adversarius en el condado de Toulouse con el fin de difundir las creencias de la Vía de los Pecados en el Sur. Occitania . _ _ _ _ influir en Occitania y convertir esta región a la Vía de los Pecados.\n\ n#bold Haz realidad el sueño de una tierra de asilo para los acólitos oprimidos.#!"
bookmark_patronwar_hagbard:0 " Hagbard "
bookmark_patronwar_hagbard_desc:0 "Nacido en una familia tradicional en la Rus de Kiev, Hagbard inculcó la debida reverencia por los antiguos dioses a una edad temprana. No es tonto, cuando su señor decretó que el reino ahora era cristiano, permitió que los vientos de Después de numerosas aventuras famosas entre los mortales de esa época, el experimentado viajero aparentemente encontró un hogar sirviendo al Emperador Bizantino como miembro de la Guardia Varangian . Los dioses atrajeron un tipo de atención completamente diferente. Conoció a un hombre que le mostró que los dioses de su tierra natal no tenían poder aquí... y al mismo tiempo, le presentó a los que sí lo tenían. Con la mente destrozada por el abrazo, él se aferró a algunos fragmentos de lo que era, convirtiéndose en un firme defensor de los antiguos dioses de su hogar adoptivo.\n\ n#bold ¡Honra a los antiguos dioses! Presta atención al oráculo ¡s!#!"
bookmark_patronwar_conradoadelchi:0 " Conrado Adelchi "
bookmark_patronwar_conradoadelchi_desc:0 "En sus seiscientos años de no vida , Conrado Adelchi ha adquirido y regalado numerosas fortunas, a menudo adquiridas a través de medios legítimos, comercio de arte, fabricación de perfumes y similares, pero adquiridas a través del robo de tumbas, el contrabando y otras empresas.\n\ nUna vez , en los primeros días de su vida , Conrado vendió ' El regalo de Caine' gratis para los verdaderamente desesperados y para aquellos dispuestos a pagar. Sus errores fueron 'rectificados' por Calida antes de que se rompiera la Mascarada. Alguien debe financiar las lujosas veladas de los Toreador y, para Cálida , el talento de Conrado para adquirir riquezas alcanzó el nivel del arte, al menos lo suficiente como para mirar más allá de sus indiscreciones juveniles.\n\ n#Bold Gold, el oro resolverá todos los problemas.#! "
bookmark_patronwar_viktor:0 "Victor"
bookmark_patronwar_viktor_desc:0 "Un general ruso temido; sin embargo, como gobernante, gobernó con mano de hierro. Durante su vida mortal, pasó de ser un noble y general íntegro a ser el Señor de un dominio orgulloso y una riqueza significativa. Un hombre de Con una firme creencia en las tradiciones, cultivó una compañía de sirvientes de élite, pero ni siquiera ellos tenían las respuestas a su mayor temor, su vejez y su muerte inminente. Una figura sombría se acercó a Viktor cuando su fuerza mortal comenzó a fallarle. Una criatura de la noche, su autoridad y sed de poder solo crecieron, ya que un nuevo mundo lleno de oportunidades se había desvelado.\n\ nViktor pronto se dio cuenta, sin embargo, de que ahora tendría que cambiar su estrategia y, en lugar de gobernar desde el, abrazó sus criados más cercanos y partió para comenzar de nuevo y reclamar el dominio en una nueva región.\n\ n#bold Viktor predica con el ejemplo tal como lo había hecho antes.#!"
bookmark_patronwar_aisling:0 "Aisling"
bookmark_patronwar_aisling_desc:0 "El mundo de los Cainitas no es tan diferente del de las Hadas, se dice Aisling. Gobernarlo no debería ser demasiado difícil".

