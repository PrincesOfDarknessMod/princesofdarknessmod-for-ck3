 bm_1230_inquisitor:0 "Edades oscuras : Inquisidor"
 bm_1230_inquisitor_desc:0 "Anno Dei 1230. Dirigida por un incondicional grupo de cazadores de monstruos, la Santa Iglesia se ha dado cuenta finalmente de la amenaza que suponen los vampiros. Formando una nueva y secreta organización llamada la Inquisición de la Sombra, estos héroes son los primeros humanos que intentan reconquistar la noche y hacer retroceder sus horrores. La tarea que tienen por delante es inmensa, y los malditos chupasangres han tenido siglos para atrincherarse y preparar su contraataque. Los llamados "inquisidores" están dispuestos a morir como mártires, si su sacrificio allana el camino hacia un futuro mejor para la humanidad. Luchan por una causa, y eso es más de lo que cualquier vampiro podría reclamar.\N- Negrita Eres la única esperanza de un mundo inconsciente de la guerra que se libra por su propia alma."
 bookmark_inquisitor_gauthier:0 "Gauthier de Dampiere"
 bookmark_inquisitor_gauthier_desc:0 "Tercer hijo de un conde menor francés, Gauthier escuchó la llamada de Dios a principios de su vida, y respondió a ella por la única vía que conocía: la batalla. Su primer encuentro con un vampiro durante la Tercera Cruzada le abrió los ojos y Gauthier ha reunido a un fuerte grupo de devotos caballeros empeñados en luchar contra el mal. Fue una prueba para él ser fundador de la Inquisición de las Sombras, donde es el líder en todos los asuntos militares.   Ese es tu último deber en una larga vida dedicada a servir a Dios."
 bookmark_inquisitor_leopold:0 "Leopold von Murnau"
 bookmark_inquisitor_leopold_desc:0 "Vástago menor de la casa von Murnau, Leopold era un niño enfermizo maldito con una extraña habilidad: el poder de "oler" literalmente el mal. En lugar de temerlo, el perspicaz Leopold utilizó su don para ayudar a descubrir varias maquinaciones vampíricas en su casa. Pero no se detuvo ahí, y pronto estuvo en Roma para proponer sus servicios a los recién creados Caballeros de Acre. Desde entonces, ha sido el principal impulsor de la creación de la Inquisición de la Sombra, reuniendo a todos aquellos que intentan luchar contra el mal en sus múltiples formas. Con su casa firmemente respaldada, Leopold es quizás el pilar más fuerte de la Inquisición, liderando los esfuerzos para retomar la noche.\N-La Casa Murnau se mantiene fuerte, y Baviera está asegurada, pero esto es sólo el comienzo de la lucha. No debéis parar hasta que el último chupasangre sea expulsado ante la luz de Dios."
 bookmark_inquisitor_maria:0 "Maria-Immaculada"
 bookmark_inquisitor_maria_desc:0 "La actual líder de las Hermanas de San Juan no es la fundadora de la orden, pero su voluntad es tan fuerte como la de la Madre Teresa, su bendita predecesora. Llamarla personalmente formidable es sugerir que el Papa es sólo un poco santo. Tras varios intentos fallidos por parte de inquisidores menos hábiles, María Inmaculada ha optado por ir personalmente a las Islas Británicas, con la esperanza de encontrar al infame "Dios-Rey" vampírico que presume de gobernar estas islas. Con su fe inquebrantable y el respaldo de las demás órdenes de la Inquisición, María está dispuesta a enseñar a este enemigo que sólo hay un Dios.\N- Negrita Está segura de que Inglaterra es un centro de actividad vampírica. Descubrirlo y destruirlo sería una gran ayuda para la Inquisición. Verás caer al Dios-Rey".
 bookmark_inquisitor_vittoria:0 "Vittoria Santini di Parma"
 bookmark_inquisitor_vittoria_desc:0 "Mujer de elevado intelecto e intenso amor a Dios, Vittoria es la líder informal de la Orden Roja, los investigadores de la Inquisición de la Sombra. Posee un asombroso sentido para saber cuándo hay que saltarse las reglas y cuándo hay que jugar precisamente con la letra ortodoxa. Como tal, era la elección obvia para la más importante -y peligrosa- de las misiones: Limpiar Italia de la influencia de los vampiros y proteger la Santa Sede. A medida que Vittoria descubre más y más corrupción sobrenatural en la Iglesia, descubre que la tarea será aún más compleja de lo previsto... Estás decidida a salvar a la Iglesia de sí misma, y la mejor manera de hacerlo es exponer y destruir a los vampiros de Italia. Has identificado dos objetivos principales, un supuesto cardenal en Milán, y una abominación que se burla del Papa en la propia Roma...#"
 bookmark_inquisitor_aignen:0 "Aignen le Libraire"
 bookmark_inquisitor_aignen_desc:0 "El maestro espía occitano es el líder de los Oculi Dei, los ojos y los oídos de la Inquisición. Antaño lugarteniente de Rodrigue de Navarre, Aignen rompió con su amigo cuando éste se negó a unirse a la Inquisición de las Sombras. Aignen llora su amistad perdida, pero sabe que la Santa Sede necesitará una potente fuerza de espías con recursos. Despreciado por sus antiguos aliados, y todavía desconfiado por los nuevos, Aignen recorre el solitario camino entre ser útil y ser tachado de hereje.\N-Negrita Francia es su hogar, y conoce la influencia vampírica que se alimenta aquí. La herejía cátara lo demostró demasiado bien. Con los pocos amigos que puedes reunir, tienes que actuar para controlar la situación y, con suerte, demostrar tu utilidad a la Inquisición de las Sombras."
 bookmark_inquisitor_rodrigue:0 "Rodrigue de Navarre"
 bookmark_inquisitor_rodrigue_desc:0 "Rodrigue fue el primer cristiano que entró en contacto con los muertos vivientes, sobrevivió y luego decidió tomar las armas contra ellos. Un noble menor de Navarra, fue durante la Herejía Cátara cuando fue testigo del verdadero mal del mundo. Desde entonces, Rodrigue ha intentado frenéticamente destruir cualquier influencia vampírica percibida... que es casi todo el mundo, en su mente paranoica. Como tal, se negó a unirse a la Inquisición de las Sombras y está actuando por su cuenta, con la Espada de Santiago a su disposición.\NN-Están por todas partes. La Inquisición de las Sombras es probablemente un aliado, pero no te arriesgas. Si quieren ayudar, bien, pero salvarás a Iberia en tus propios términos y con tus propios métodos."
    
 bookmark_inquisitor_bayezid:0 "Bayezid Gantenbein"
 bookmark_inquisitor_bayezid_desc:0 "Antiguo ghoul esclavo del Caitiff Cainita Stanislav de los Elegidos de Calomena, Bayezid y su hermano Basil encontraron su fe Bogomil corrompida por los intereses de los no muertos. Cuando Stanislav fue destruido durante la caída del Sueño de Miguel en 1204, los hermanos Gantenbein fueron liberados de sus vínculos de sangre. Desde entonces, ahora se llaman a sí mismos "Los Desamparados de Calomena" y han liderado a los fieles bogomilistas en los ataques contra los vampiros en toda Bosnia.\N- Negrita Calomena, la hermana de Caine, desea la destrucción de su hijo no-muerto." 
