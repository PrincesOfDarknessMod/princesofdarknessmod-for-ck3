 #Black-Hand-Group Faiths
 talmahera:0 "Tal'Mahe'Ra"
 talmahera_adj:0 "Tal'Mahe'Ra"
 talmahera_adherent:0 "Cruzado de la sombra"
 talmahera_adherent_plural:0 "Cruzados de la sombra"
 talmahera_desc:0 "La Tal'Mahe'Ra es una antigua organización formada por una improbable alianza entre los magos Chakravanti y varios clanes de vampiros (especialmente los Assamitas), aunque entre sus miembros también se encuentran otras criaturas sobrenaturales además de vampiros y magos."
 
 manusnigrum:0 "Manus Nigrum"
 manusnigrum_adj:0 "Manus Nigrum" 
 manusnigrum_adherent:0 "Mano Negra"
 manusnigrum_adherent_plural:0 "Manos negras"
 manusnigrum_desc:0 "La rama occidental de un antiguo culto a la muerte dedicado a la adoración de una cábala de seres conocidos como los Aralu, a los que creían antediluvianos, que dormían en la ciudad fantasma de Enoch en las profundidades de las tierras de los muertos. El culto se dedicaba principalmente a la política vampírica, planificando la aniquilación de los Baali".

 pathofselffocus:0 "Senda de la autofocalización"
 pathofselffocus_adj:0 "Internalista"
 pathofselffocus_adherent:0 "Internalistas"
 pathofselffocus_adherent_plural:0 "Internalista"
 pathofselffocus_desc:0 "Los Internalistas creen que aceptando el curso del universo y siguiéndolo sin interferir, podrían cesar el conflicto interno y así apagar a la Bestia. Porque cambiar el mundo es imposible, sólo puedes cambiarte a ti mismo para adaptarte al mundo, afirman."
 
 pathofthescorchedheart:0 "Sendero del Corazón Chamuscado"
 pathofthescorchedheart_adj:0 "Rathmonicusi"
 pathofthescorchedheart_adherent:0 "Implacable"
 pathofthescorchedheart_adherent_plural:0 "Implacable"
 pathofthescorchedheart_desc:0 "Basado en el Libro del Corazón Vacío de Rathmonicus, que se difundió por primera vez entre unos pocos Kindred de la Iglesia Católica; sus escrituras fueron reunidas y recopiladas posteriormente por la Verdadera Mano Negra. La Senda del Corazón Chamuscado controla a la Bestia erradicando sistemáticamente toda emoción dentro del corazón del vampiro".
 
 holy_order_enoch_peacekeepers:0 "Pacificadores de Enoch"
 holy_order_spenta_aurvat_column:0 "Columna de Spenta Aurvat"
 

