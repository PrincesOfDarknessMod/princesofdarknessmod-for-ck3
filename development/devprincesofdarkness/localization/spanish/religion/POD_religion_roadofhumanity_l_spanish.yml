 #Prodigal-Group Faiths
 viahumanitatis:0 "Vía Humanitatis"
 viahumanitatis_adj:0 "Pródigo"
 viahumanitatis_adherent:0 "Pródigo"
 viahumanitatis_adherent_plural:0 "Pródigos"
 viahumanitatis_desc:0 "Los seguidores de Via Humanitatis utilizan la condición humana para luchar contra su Bestia, recordando que eran mortales ordinarios antes de que se les otorgara la maldición de Caine. Hacen hincapié en las virtudes humanas, como la libertad, el corazón y el alma humanos, y en la razón y la inteligencia como separadores del hombre de la bestia."

 viaanima:0 "Via Anima"
 viaanima_adj:0 "Anima"
 viaanima_adherent:0 "Inspirado"
 viaanima_adherent_plural:0 "Inspirado"
 viaanima_desc:0 "La Vía Anima se llama comúnmente el Camino del Aliento. Los Inspirados tratan de encontrar un sentido y un propósito entre los hombres mortales, compartiendo sus cargas y su vida cotidiana. Al hacerlo, esperan dejar de ser monstruos en su propia mente, y así alejar a la Bestia. Muchos de los que recorren este camino lo hacen por puro instinto, sin pensar mucho en el asunto".

 viacommunitas:0 "Via Communitas"
 viacommunitas_adj:0 "Communitas"
 viacommunitas_adherent:0 "Civilizado"
 viacommunitas_adherent_plural:0 "Civilizado"
 viacommunitas_desc:0 "Comúnmente llamado el Camino de la Comunidad. Los Civilizados se centran más en la comunidad en su conjunto que en los individuos. Rara vez se esfuerzan por exaltarse a sí mismos, y cuando lo hacen suele ser como medio para beneficiar a la comunidad en general."

 vialuminis:0 "Vía Luminis"
 vialuminis_adj:0 "Luminis"
 vialuminis_adherent:0 "Iluminado"
 vialuminis_adherent_plural:0 "Iluminado"
 vialuminis_desc:0 "Comúnmente llamado el Camino de la Iluminación. Los que siguen la Vía de la Iluminación buscan el Camino Amargo de Golconda para dejar atrás el mundo material. Los seguidores de la Vía Luminis son un grupo solitario, no necesariamente por elección, sino porque la sociedad los rechaza. El desprecio de los Salubri (y de Golconda en general) también ha servido para que la Senda parezca sospechosa a los vampiros piadosos".

 viavireo:0 "Vía Vireo"
 viavireo_adj:0 "Vireo"
 viavireo_adherent:0 "Rover"
 viavireo_adherent_plural:0 "Rovers"
 viavireo_desc:0 "Comúnmente llamado el Camino del Vigor. Los que siguen la Senda del Vigor no sólo se dedican a un ideal de lo que es la humanidad, sino también a su naturaleza. Los seguidores se sienten atraídos por la tendencia humana a innovar, ampliar sus horizontes y avanzar para bien o para mal. La Senda del Vigor es una senda enérgica y contundente que prima el movimiento y la acción sobre la contemplación y la quietud."
 
 eternalsenate:0 "Senado eterno"
 eternalsenate_adj:0 "Senado eterno"
 eternalsenate_adherent:0 "Senador"
 eternalsenate_adherent_plural:0 "Senador"
 eternalsenate_desc:0 "El Senado Eterno es un consejo de cainitas que sigue el modelo del Senado romano (aunque mucho más pequeño), para gobernar, legislar y gobernar sobre los Kindred. Los Ventrue de Roma se organizaron como los mortales, como una república: el Senado Eterno de los Ventrue. En el senado, cada Ventrue tiene derecho a la palabra y al voto, independientemente de la edad o el sexo."
 
 inconnu:0 "Inconnu"
 inconnu_adj:0 "Inconnu"
 inconnu_adherent:0 "Inconnu"
 inconnu_adherent_plural:0 "Inconnu"
 inconnu_desc:0 "Los Inconnu son una secta de vampiros extremadamente secreta. Prácticamente no se sabe nada a ciencia cierta sobre ellos, pero algunas de las teorías más populares afirman que el grupo es una coalición de methuselahs que existe para manipular tanto a la Camarilla como al Sabbat desde la sombra, formada en su totalidad por antiguos que han abandonado la Jyhad para perseguir a Golconda, o un poderoso culto vinculado a los antediluvianos. Incluso se discute la antigüedad de la secta, ya que algunos creen que se remonta a Roma. Sea cual sea el origen de los Inconnu, la prueba de su poder es que son capaces de permanecer ocultos a pesar de siglos de investigación y especulación. La única faceta visible de la secta parece ser la de los Monitores, que vigilan los acontecimientos vampíricos evitando la interferencia directa."
 
