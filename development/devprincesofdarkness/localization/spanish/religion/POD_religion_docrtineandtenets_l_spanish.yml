 doctrine_nomarriage_name:0 "No hay matrimonio"
 doctrine_nomarriage_desc:0 "Esta fe no tiene matrimonios".
 
 doctrine_onlyconcubines_name:0 "Sólo concubinas"
 doctrine_onlyconcubines_desc:0 "Esta fe solo admite concubinas, no cónyuges".
 
 tenet_apotheosis_name:0 "Apoteosis"
 tenet_apotheosis_desc:0 ""
 
 tenet_bloodcommunion_name:0 "Comunión de sangre"
 tenet_bloodcommunion_desc:0 "La Comunión de Sangre del Adherente a la Apoteosis es una versión impía de los rituales de comunión de los mortales. Dentro de la fe, sirve para muchas de las mismas funciones. La sangre, por supuesto, no es simbólica: proviene de un sacrificio humano".

 tenet_exaltedideals_name:0 "Ideales exaltados"
 tenet_exaltedideals_desc:0 "La perfección en el intelecto, el cuerpo y la belleza es ideal, mientras que los opuestos son crímenes. La perfección no es solo un estado mental, sino una razón para hacer la guerra contra el inferior." 
 tenet_willing_embrace_name:0 "Abrazo voluntario"
 tenet_willing_embrace_desc:0 "Sumergir otra alma en la condenación eterna no es un asunto trivial. El potencial candidato a [Abrazo|E] debe saber perfectamente lo que está firmando". 
 doctrina_parámetro_abrazo_voluntario:0 "Antes de cualquier [Abrazo|E], tendrás que convencer a la víctima de que se convierta en vampiro."
 
 tenet_ashen_faith_name:0 "Fe de ceniza"
 tenet_ashen_faith_desc:0 "La mayoría de los Caminos vampíricos son principalmente filosofías, atadas sólo al yo. Pero tu fe no lo es, estás trayendo la salvación a todos los [cainitas|E]s y la palabra debe ser difundida." 
 doctrine_parameter_ashen_faith:0 "La interacción del personaje de la Conversión de la Demanda tiene más posibilidades de éxito."
 ASHEN_FAITH:0 "Tenet de Fe de Ceniza $VALOR|=+0$"

 tenet_the_pyramid_name:0 "La pirámide"
 doctrine_parameter_willing_embrace:0 "Antes de cualquier [Embrace|E], tendrás que convencer a la víctima de convertirse en vampiro."
 tenet_the_pyramid_desc:0 "Asediados por todos lados por poderosos enemigos, la principal defensa de los Tremere es su total obediencia a un orden jerárquico muy estricto." 
 doctrina_parámetro_la_pirámide:0 "Los vasallos no pueden declarar guerras a otros vasallos sin un gancho a su señor."
  
 tenet_feral_vampires_name:0 "Vampiros salvajes"
 tenet_feral_vampires_desc:0 "Las tierras indómitas son nuestro coto de caza, y nuestros lorekeepers se aseguran de que nuestro legado sea escuchado." 
 doctrine_parameter_feral_lorekeepers:0 "Puede usar la decisión Épica de la Comisión sin ningún perk, pero siempre resultará en una canción."
 doctrina_parámetro_puede_cazar:0 "Puede usar la decisión Cazar, incluso como vampiro."

 doctrine_parameter_the_pyramid:0 "Los vasallos no pueden declarar la guerra a otros vasallos sin enganchar a su señor."
 tenet_sanctioned_diableries_name:0 "Diablerías sancionadas"
 tenet_sanctioned_diableries_desc:0 "Los Hijos de Haqim deben reclamar la sangre de los indignos, pero ten cuidado con el juez precipitado." 
 doctrine_parameter_sanctioned_diableries:0 "Durante una [diablerie|E], si tu víctima es cobarde, arbitraria o de una religión Malvada, el coste de piedad se reducirá. Si la víctima es valiente, justa o de una religión Justa, el coste se incrementará."
 
 doctrine_parameter_can_hunt:0 "Puede usar la decisión Cazar, incluso como vampiro."
 PENA_CONVERSION_SECRET_CULT_PENALTY:0 "Pena por tener el tenet Secret Cult".

 tenet_secret_cult_name:0 "Culto secreto"
 tenet_secret_cult_desc:0 "Esta fe se organiza como una especie de conspiración en la sombra. Pocos conocen realmente su existencia, y les gusta que sea así". 
 doctrina_parámetro_secreto_culto:0 "Da acceso a los hombres de armas cultistas. Pena de conversión religiosa del condado".
 COURT_CHAPLAIN_CONVERSION_SECRET_CULT_PENALTY:0 "Penalización por tener el principio del Culto Secreto."
 tenet_noblesse_oblige_name:0 "Noblesse Oblige"
 tenet_noblesse_oblige_desc:0 "Los vástagos se toman muy en serio la responsabilidad de los vasallos con respecto a ellos. Administrar el sistema de vasallaje con justicia debe dar lugar a vasallos felices. Unos vasallos felices significan un vasallaje exitoso".
 
 doctrine_parameter_secret_cult:0 "Da acceso a los Cultists Men at Arms. Sanción por conversión religiosa del condado."
 tenet_knowledge_above_all_name:0 "El conocimiento por encima de todo"
 tenet_knowledge_above_all_desc:0 "El gran misterio es demasiado importante para ser retenido por insignificantes preocupaciones morales." 
 doctrina_parámetro_experimentos_en_presos:0 "Da acceso a un método de ejecución especial".
 EJECUCIÓN_EXPERIMENTOS:0 "Experimentos sobre ellos"
 
 doctrine_parameter_experiments_on_prisoners:0 "Da acceso a un método de ejecución especial."
 EXECUTION_EXPERIMENTS:0 "Experimentos en ellos"
 tenet_moments_of_truth_name:0 "Momentos de la verdad"
 tenet_moments_of_truth_desc:0 "¿Un destello de inspiración? ¿Un mensaje de los poderes superiores? En cualquier caso, un acontecimiento tan trascendental puede cambiar a cualquier individuo hasta el fondo." 
 doctrine_parameter_moments_of_truth:0 "Da acceso a una posibilidad especial de alivio del estrés en la que puedes cambiar tus rasgos."
 
 umbral_de_estrés.7001.t:0 "Ruptura mental : momento de la verdad"
 stress_threshold.7001.t:0 "Descanso Mental: Momento de la Verdad"
 stress_threshold.7001.desc:0 "Has recibido una revelación. Tus turbulencias actuales han sido una prueba del Todopoderoso para evaluar tu valía. Este raro momento de claridad podría ser la ocasión para que hagas un voto.\N-Seguramente, hay defectos en tu personalidad que podrías trabajar, con la esperanza de acercarte a la Divinidad en el proceso."
 stress_threshold.7001.a:0 "¡La justicia es para los débiles!"
 stress_threshold.7001.b:0 "¿He perdido mi humanidad?"
 stress_threshold.7001.c:0 "Debo mantener la concentración".
 stress_threshold.7001.d:0 "¡Necesito más!"
 stress_threshold.7001.e:0 "¡Todos están aquí para atraparme!"
 stress_threshold.7001.f:0 "Puede que no estén todos aquí para atraparme..."

 tenet_honor_and_bravery_name:0 "Honor y valentía"
 tenet_honor_and_bravery_desc:0 "¡Un verdadero gobernante de la noche lidera desde el frente, cortando sin miedo a cualquier enemigo lo suficientemente tonto como para interponerse en el camino de su noble propósito!"
 doctrine_parameter_battle_winning_prestige:0 "Obtienes más prestigio al ganar batallas."
 tenet_honor_y_valentía_desc:0 "¡Un verdadero gobernante de la noche lidera desde el frente, cortando sin miedo a cualquier tonto que se interponga en su noble propósito!" 
 doctrina_parámetro_ganar_batalla_prestigio:0 "Ganas más prestigio por ganar batallas".
 
 doctrine_parameter_access_to_develop_capital:0 "Tiene acceso a la decisión de Desarrollar Capital, y es menos costosa en caso de estrés."
 tenet_community_name:0 "Comunidad"
 tenet_community_desc:0 "El buen pastor cuida de su rebaño. Deja que se multiplique y crezca, y que ningún depredador se acerque a él". 
 doctrina_parámetro_acceso_a_desarrollar_capital:0 "Tienes acceso a la decisión de Desarrollar Capital, y es menos costosa en tensión."
 doctrine_parameter_access_to_improve_scheme:0 "Tiene acceso a la decisión Mejorar esquemas."
 
tenet_svadharma_name:0 "Svadharma"
 tenet_svadharma_desc:0 "Los adeptos a este camino creen que han caído del ciclo de reencarnaciones. La única manera de arreglar las cosas es seguir un nuevo conjunto de deberes, ayudando a los demás a encontrar su propio camino, les guste o no." 
 doctrina_parámetro_acceso_a_mejorar_esquemas:0 "Tienes acceso a la decisión de mejorar los esquemas."
 
 tenet_lilithmaid_name:0 "Lilith, la Doncella"
 tenet_lilithmaid_desc:0 "La Doncella se enfurece y maldice contra el destino que se le ha marcado. Ella no será ningún hombre, nación o incluso la propiedad de Dios". 
 
 tenet_lilithmother_name:0 "Lilith, la Madre"
 tenet_lilithmother_desc:0 "La Doncella se convierte en la Madre en el dolor y finalmente comprende que es la única constante en este mundo." 
  
 tenet_lilithcrone_name:0 "Lilith, la Arpía"
 doctrine_parameter_aphrodisiac_saturnalia:0 "Tienes acceso a dos nuevos puestos en la corte: el Señor del Desgobierno y el Celebrante Afrodisíaco."
 tenet_lilithcrone_desc:0 "La Arpía ha poblado el mundo y ahora utiliza sus conocimientos para guiarlos en el mundo." 
   
 tenet_aphrodisiac_saturnalia_name:0 "Afrodisíaco y Saturnalia"
 tenet_aphrodisiac_saturnalia_desc:0 "Los rituales de la primavera y el invierno son piedras angulares de la vida de esta fe. Ser elegido como organizador de esos eventos es un gran honor". 
 doctrina_parámetro_afrodisíaco_saturnalia:0 "Tienes acceso a dos nuevos cargos de la corte: el Señor del Desgobierno y el Celebrante Afrodisíaco."
  
 tenet_fire_fury_name:0 "Fuego y furia"
 tenet_fire_fury_desc:0 "Todo el sistema político vampírico está corrupto y debe ser derribado. Y las negociaciones pacíficas ya no son una opción". 
 
