 #TenidosVampíricos
 tenet_vampiremasquerade_name:0 "Mascarada"
 tenet_vampiremasquerade_desc:0 "El silencio de la sangre. No revelarás tu verdadera naturaleza a quienes no sean de la Sangre. Si lo haces, renunciarás a tus pretensiones de Sangre".
 
 tenet_vampireprogeny_name:0 "Progenie"
 tenet_vampireprogeny_desc:0 "Sólo podrás engendrar otro con el permiso de tu Anciano. Si creas otro sin el permiso de tu Anciano, tanto tú como tu Progenie seréis asesinados".
 
 tenet_vampiredestruction_name:0 "Destrucción"
 tenet_vampiredestruction_desc:0 "Tienes prohibido destruir a otro de tu especie. El derecho a la destrucción sólo pertenece a tu Anciano. Sólo los más ancianos de entre vosotros podrán convocar la Caza de Sangre".

 tenet_vampiretouchstone_name:0 "Piedra de toque"
 tenet_vampiretouchstone_desc:0 "Un Kindred puede elegir a un mortal como piedra de toque para ayudar a mantener su conexión con la humanidad. El kindred gana entonces piedad. Hay más eventos relacionados con la piedra de toque".
 
 tenet_vampireremorse_name:0 "Remordimiento"
 tenet_vampireremorse_desc:0 "El kindred reflexiona sobre sus acciones y siente arrepentimiento por su comportamiento monstruoso, ganando piedad." 
 
 tenet_vampireblushoflife_name:0 "Rubor de la vida"
 tenet_vampireblushoflife_desc:0 "Los Kindred pueden emular estar vivos. Esto ayuda a su mascarada además de recordar lo que es ser humano y así ganar piedad."  
 
 tenet_vampirenecromanticexperimention_name:0 "Experimentación nigromántica"
 tenet_vampirenecromanticexperimention_desc:0 "Fíjate bien: hay un lugar más allá del espíritu, más allá de la vida que es la Oscuridad, la Sombra, y allí habitan las Sombras. Una isla, una fortaleza, una tierra de los Muertos, he viajado allí a través de un camino de perdición y he sido testigo del temible rey de la Ciudad Estigia cuando se sentaba en la corte. He visto a los encapuchados sin rostro atravesar el río Estigia. Pululan a nuestro alrededor como moscas en un cadáver putrefacto, y como nosotros, se alimentan del miedo, el éxtasis y la ira. Están muertos, pero no muertos, y están más cerca de nosotros de lo que nunca sabremos. La Sangre de mi Hermano me grita mientras duermo mientras el Sol cruza el cielo, oigo gritar a mi hermano, el segundo nacido Abel. Observa bien los espíritus de los que han muerto, sabe que su fuerza no es la tuya, escucha sus palabras: son portadoras de sabiduría. No escuches sus cantos: ese camino es el olvido.\NLas ejecuciones generan tanto resonancia melancólica como piedad."  
 
 tenet_vampirenemetamorphopsisexperimention_name:0 "Experimentación necromántica"
 tenet_vampirenemetamorphopsisexperimention_desc:0 "Las ejecuciones generan tanto experiencia colérica como piedad."  
 
 tenet_vampireauctoritasritae_name:0 "Auctoritas Ritae"
 tenet_vampireauctoritasritae_desc:0 "Una colección de trece rituales practicados por todos los miembros del Sabbat".
 
 tenet_vampireamaranth_name:0 "Amaranto"
 tenet_vampireamaranth_desc:0 "Práctica de la diablura"
 
 tenet_vampiremonomacy_name:0 "Monomanía"
 tenet_vampiremonomacy_desc:0 "Un duelo honorable que termina en diablerie. El rito de la Monomacia se utilizará para resolver las disputas entre todos los Sabbat".
 
 tenet_infernalism_name:0 "Infernalismo"
 tenet_infernalism_desc:0 "Investidura demoníaca a través de pactos con demonios".
 
 tenet_vampireinquisition_name:0 "Inquisición"
 tenet_vampireinquisition_desc:0 "Marca bien a los Hijos del de Arriba, los Querubines, los Serafines, los Arcángeles, pues su toque te quemará como lo hace la Llama de Miguel. Fíjate bien en los Hijos del de Abajo, los Parientes de la Serpiente, porque su toque te quemará también, y sus lenguas te engañarán y te engañarán. Cazad y destruid a los infernalistas dondequiera que los encontréis".
 
 tenet_pleasure_name:0 "Placer"
 tenet_pleasure_desc:0 "La búsqueda hedonista del éxtasis"
 
 tenet_cruelty_name:0 "Crueldad"
 tenet_cruelty_desc:0 "El placer obtenido al infligir dolor"
 
 tenet_quiritare_name:0 "Quiritare"
 tenet_quiritare_desc:0 "Resistirse a la Bestia o intentar aplacarla es imposible, por lo que te entregas a ella por completo, cumpliendo su voluntad." 
  
 tenet_legacyoftrinity_name:0 "Legado de la Trinidad"
 tenet_legacyoftrinity_desc:0 "El Códice dicta la superioridad de los tres clanes principales: Toreador, Tzimsice y Ventrue. Los miembros de otros clanes deben solicitar la petición de los cuesores para engendrar hijos; los miembros de los tres clanes principales pueden engendrar a quien quieran. Sólo los miembros de los tres clanes principales pueden legar un dominio a otro vampiro y que cada vampiro dentro de este dominio tiene el deber de hacer cumplir el Códice".
 
 tenet_legacyofashes_name:0 "Legado de cenizas"
 tenet_legacyofashes_desc:0 "El Códice dicta que cualquiera que mate a un miembro de los tres clanes principales tendrá una Cacería de Sangre convocada."

 doctrine_parameter_vampireselectivefeeding:0 ""
 tenet_legacyofshadow_name:0 "Legado de la sombra"
 tenet_legacyofshadow_desc:0 "El Códice dicta que los Caínes no revelen su verdadera naturaleza a quienes no son de la Sangre. Si lo hacen, renunciarán a sus reclamaciones de Sangre". 
 
 tenet_oaths_name:0 "Juramentado"
 tenet_oaths_desc:0 "Nuestras leyes son los mandatos de nuestros mayores, y los mandatos de Caine sobre todos. Los juramentos son la base del orden feudal". 
 #Un juramento es el vínculo más sagrado que puede establecer un señor. Un señor que rompe el juramento amenaza a toda la sociedad al degenerar a la Bestia". 
 #Los juramentados tienen casus belli para hacer la guerra a los juramentados y despojarlos de sus títulos".
 
 tenet_vampirehighclans_name:0 "Altos Clanes"
 tenet_vampirehighclans_desc:0 "Los Altos Clanes son superiores a los Bajos Clanes. Los Bajos Clanes son degenerados que acabarán sucumbiendo a La Bestia. No son aptos para gobernar ni para una compañía educada".
 
 tenet_vampireselectivefeeding_name:0 "Alimentación selectiva"
 tenet_vampireselectivefeeding_desc:0 "No te alimentarás de las Bestias de la Luna, los Salvajes los enfermos, los locos o los borrachos".
 #\Las Bestias de la Luna, las que cambian, son las más antiguas de todas, antes de mi padre vagaban por las tierras. No te pongas en su camino, evítalos, nos acechan como lobos en el redil. Porque nosotros somos de una clase, y ellos de otra. Cuídate de su tierra sagrada, camina suavemente por su desierto. Su mordedura es como nuestra mordedura, sus garras son como nuestras garras, no te detengas en su camino, ellos son de una clase, y nosotros de otra.\NDe los locos, los salvajes, digo, primero, no bebas de su sangre. Pero obsérvalos, porque son hermosos en su naturaleza, son encantadores en su misterio, son mortales en sus habilidades de guerra. Solos entre las criaturas de la noche, me hicieron compañía en la tierra y me trajeron agua cuando tenía sed y aún podía respirar. Como yo, fueron expulsados, como mis hijos, no tienen hogar, como los hijos de mis hijos, vagan, como mi madre y mi padre, saben demasiado, pero guardan su propio consejo, y, de ellos, digo que me marquen bien, ¡cállate! No digas nada. Observa, y aprende".
 #doctrine_parameter_vampireselectivefeeding:0 ""
 
 tenet_enkrateia_reie_sophrosyne_name:0 "Enkrateia Reie Sophrosyne"
 tenet_enkrateia_reie_sophrosyne_desc:0 "Un enfoque intelectual de la no-vida, la Senda se centra en tres conceptos fundamentales que se cree que han sido características esenciales buscadas en la potencial progenie Brujah en las noches de Cartago: enkrateia, reie y sophrosyne. Enkrateia se refiere a la fuerza interior. Reie se refiere al valor moral. Sophrosyne significa control del yo y representa la meta idealizada de todos los Filósofos: el dominio de la furia Brujah".
 #No basta con que el Filósofo acepte pasivamente las frustraciones que se le presentan, como exige el Camino de la Humanidad. Por el contrario, debe convertir su razón en una espada y su voluntad en un escudo contra las fuerzas que la harían degenerar. También significa que el Brujah se ha comprometido a una eternidad de desarrollo mental, espiritual y físico. Los Filósofos desarrollan la sophrosyne trabajando para mejorar los Atributos y Habilidades Físicas y Mentales, en lugar de centrarse en las Disciplinas o los rasgos Sociales."
 
 tenet_cold_mind_name:0 "Mente fría"
 tenet_cold_mind_desc:0 "La Mente Fría es un estado de pensamiento que es esencial para la Canción de la Sombra. Básicamente, describe un enfoque sin emociones y completamente tranquilo y controlado del mundo que lo rodea, pero la mayoría de sus significados están envueltos en acertijos y koanes, por lo que el significado completo de Cold Mind se entiende mejor en contexto."
 #\En términos prácticos, esto significa que los Filósofos suelen tener altos índices de Fuerza de Voluntad y Autocontrol, o bien persiguen agresivamente esos rasgos.\NLa sophrosyne se refiere al valor moral. El Filósofo no debe eludir su responsabilidad de perseguir la iluminación o el carácter moral por miedo al frenesí u otras degradaciones. Por el contrario, debe afrontar las situaciones difíciles con la razón y la autodisciplina, evitando la impetuosidad que define a la Brujah moderna".
 tenet_intellectual_detachement_name:0 "Desapego Intelectual"
 tenet_intellectual_detachement_desc:0 "Los eruditos no temen a la muerte; de hecho, les fascina. Lo ven como una fuerza poderosa para ser estudiada, diseccionada y racionalizada para que puedan comprender mejor su propia existencia."
 
 tenet_pact_of_athens_name:0 "Pacto de Atenas"
 tenet_pact_of_athens_desc:0 "Alrededor de 1270 a. C., un cónclave de los primeros pródigos, que en su mayoría incluía a Brujah, Ventrue, Toreador y Salubri, se reunió en la ciudad de Atenas, porque muchos de los vampiros asistentes la vieron como el lugar de nacimiento oficial del Camino. El Pacto de Atenas actuó como una guía formal para las corrientes dispares en la sociedad vampírica que buscaba alejar a la Bestia y mantener su Humanidad."
 tenet_conviction_and_instinct_name:0 "Convicción e instinto"
 tenet_judgement_name:0 "Juicio"
 tenet_judgement_desc:0 "Para los Sentinels, uno de los principios principales del camino es que sus seguidores purguen todo lo que no sea digno de la sangre de Caín y purifiquen los linajes; alguien que muestra una naturaleza oscura y deshonrosa a un seguidor de Haqim puede sufrir un duro despertar. Los conceptos de honor, disciplina y autocontrol son igualmente importantes para los Centinelas. Actuar precipitadamente es señal de vergüenza; permitir que la Bestia de uno obtenga el control sobre ellos es simplemente condenatorio."
 tenet_conviction_and_instinct_desc:0 "Los vampiros no pierden piedad por herir gravemente o matar a víctimas mortales. Los vampiros no pierden piedad por frenar".
 tenet_intellectual_detachement_name:0 "Desapego Intelectual"
 tenet_intellectual_detachement_desc:0 "Los eruditos no temen a la muerte; de hecho, les fascina. Lo ven como una fuerza poderosa para ser estudiada, diseccionada y racionalizada para que puedan comprender mejor su propia existencia."
 tenet_conviction_and_selfcontrol_name:0 "Convicción y autocontrol"
 tenet_pact_of_athens_name:0 "Pacto de Atenas"
 tenet_pact_of_athens_desc:0 "Alrededor de 1270 a. C., un cónclave de los primeros pródigos, que en su mayoría incluía a Brujah, Ventrue, Toreador y Salubri, se reunió en la ciudad de Atenas, porque muchos de los vampiros asistentes la vieron como el lugar de nacimiento oficial del Camino. El Pacto de Atenas actuó como una guía formal para las corrientes dispares en la sociedad vampírica que buscaba alejar a la Bestia y mantener su Humanidad."
 tenet_conviction_and_selfcontrol_desc:0 "Los vampiros no pierden piedad por herir gravemente o matar a víctimas mortales. Los vampiros pierden piedad por frenar".
 tenet_judgement_name:0 "Juicio"
 tenet_judgement_desc:0 "Para los Sentinels, uno de los principios principales del camino es que sus seguidores purguen todo lo que no sea digno de la sangre de Caín y purifiquen los linajes; alguien que muestra una naturaleza oscura y deshonrosa a un seguidor de Haqim puede sufrir un duro despertar. Los conceptos de honor, disciplina y autocontrol son igualmente importantes para los Centinelas. Actuar precipitadamente es señal de vergüenza; permitir que la Bestia de uno obtenga el control sobre ellos es simplemente condenatorio."
 tenet_conscience_and_selfcontrol_name:0 "Conciencia y autocontrol"
 tenet_conscience_and_selfcontrol_desc:0 "Los vampiros pierden la piedad por herir gravemente o matar a víctimas mortales.  Los vampiros pierden la piedad por frenar".
 tenet_conscience_and_instinct_name:0 "Conciencia e instinto"
 tenet_conscience_and_instinct_desc:0 "Los vampiros pierden piedad por herir gravemente o matar a víctimas mortales.  Los vampiros no pierden piedad por frenar".
 tenet_orun_and_aye_name:0 "Orun y Aye"
 tenet_orun_and_aye_desc:0 "Los Laibon forjan sus vidas en torno a dos caminos distintos de Moralidad: Aye, que es su moral hacia la humanidad, y Orun, que es su moral hacia lo sobrenatural". 
 #Dependiendo de dónde se sitúen en estas dos escalas, su apariencia y su poder sobrenatural fluctúan. Esta diferencia fundamental separa para siempre al Laibon del cainita "típico"".
 #Al contrario que los Kindred, ningún Laibon sigue el Camino de la Humanidad, ni ningún otro Camino de la Iluminación. En su lugar, 
 
 doctrine_enlightenment_virtues_name:0 "Virtudes de la iluminación"
 doctrine_enlightenment_virtues_conscience_and_selfcontrol_name:0 "Conciencia y Autocontrol"
 doctrine_enlightenment_virtues_conscience_and_selfcontrol_desc:0 "Pierde la piedad al herir gravemente o matar a víctimas mortales. Pierde la piedad por el frenesí."
 doctrine_enlightenment_virtues_conviction_and_selfcontrol_name:0 "Convicción y Autocontrol"
 doctrine_enlightenment_virtues_conviction_and_selfcontrol_desc:0 "No pierdas la piedad por herir gravemente o matar a víctimas mortales. Pierde la piedad por el frenesí."
 doctrine_enlightenment_virtues_conviction_and_instinct_name:0 "Convicción e instinto"
 doctrine_enlightenment_virtues_conviction_and_instinct_desc:0 "No pierdas la piedad por herir gravemente o matar a víctimas mortales. No pierdas la piedad por el frenesí."
 doctrine_enlightenment_virtues_conscience_and_instinct_name:0 "Conciencia e instinto"
 doctrine_enlightenment_virtues_conscience_and_instinct_desc:0 "Pierde la piedad al herir gravemente o matar a víctimas mortales. No pierdas la piedad por el frenesí."
 doctrine_enlightenment_virtues_orun_and_aye_name:0 "Orun y Aye"
 doctrine_enlightenment_virtues_orun_and_aye_desc:0 "Laibon forja sus vidas en torno a dos caminos separados de Moralidad: Aye, que es su moralidad hacia la humanidad, y Orun, que es su moralidad hacia lo sobrenatural."
 tenet_vengeance_of_samiel_desc:0 "Samiel recibió una visita de Miguel, comandante de las Huestes Celestiales, mientras Saulot estaba fuera. El arcángel ordenó al rey guerrero que escribiera el Código y que incluyera en él los rituales adecuados necesarios para la fuerza y la sangre de los nuevos guerreros."
 tenet_pursuit_of_knowledge_name:0 "Búsqueda del conocimiento"
 tenet_pursuit_of_knowledge_desc:0 "Obsesión por la búsqueda del conocimiento. Los pecados incluyen: no estudiar cuando se ofrece la oportunidad de hacerlo, negarse a seguir experimentos, negarse a compartir conocimientos con otros en el Camino."
 
 tenet_greed_is_good_name:0 "La codicia es buena"
 tenet_greed_is_good_desc:0 "El oro es poder, por lo que utilizan la acumulación de riqueza para ganar influencia y así saciar su Bestia".
 
 tenet_scorched_heart_name:0 "Corazón vacío"
 tenet_scorched_heart_desc:0 "Desarrollado por Rathmonicus, se controla a la Bestia erradicando sistemáticamente toda emoción dentro del corazón del vampiro."
 
 tenet_isolation_name:0 "Aislamiento"
 tenet_isolation_desc:0 "Desarrollado por Rathmonicus, uno controla a la Bestia erradicando sistemáticamente cada emoción dentro del corazón del vampiro."

 tenet_continued_life_name:0 "Vida continuada"
 tenet_continued_life_desc:0 "Algunos no muertos intentan continuar su vida mortal en la medida de lo posible. Aunque esto les ayuda a mantener el contacto con su antigua vida mortal, aumenta la exposición de la Mascarada. Usar continuamente los poderes místicos para parecer vivos también aumenta el hambre". 
 
 tenet_vengeance_of_samiel_name:0 "Venganza de Samiel"

# Se cree que el más grande de la línea guerrera de Saulot, el fundador martirizado Samiel, escribió este texto con su propia mano. Samiel fue asesinado al final de la Segunda Guerra de Baali, al igual que más de la mitad de sus seguidores".
 
 doctrine_parameter_selfcontrol_opinion_active:0 ""
 tenet_devoted_to_michael_name:0 "Dedicado a Miguel"
 tenet_devoted_to_michael_desc:0 "La Senda del Arcángel era una Senda del Camino del Cielo popular en Bizancio durante el siglo XIII. Reverencia la memoria del Patriarca caído de Constantinopla, Miguel. Los seguidores de la senda se llaman miguelistas".  
 
 special_doctrine_three_pillars_kindred_name:0 "Tres pilares"
 special_doctrine_three_pillars_kindred_desc:0 "La base de la sociedad feudal es el castillo, la iglesia y la ciudad. La sociedad kindred refleja esto con el Camino de los Reyes, el Camino del Cielo y el Camino de la Humanidad comprometidos con la tolerancia mutua."
 doctrine_parameter_instinct_opinion_active:0 ""
 doctrine_parameter_hostility_override_special_doctrine_three_pillars_kindred:0 "Otros Kindred [faiths|E] que tienen la doctrina de los Tres Pilares se consideran [GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V] en lugar de #V Hostile#!" 
 instinctl_opinion_active_county_opinion_name:0 "Instinto Compañero de Condado"
 
 special_doctrine_ecumenical_hunters_name:0 "Cazadores ecuménicos"
 special_doctrine_ecumenical_hunters_desc:0 "Aunque los cazadores provienen de una variedad de orígenes y fe, los reconocen un vínculo común en la lucha contra los horrores sobrenaturales del Mundo de la Oscuridad."
 special_doctrine_sin_pillars_kindred_name:0 "pilares del deseo"
 special_doctrine_sin_pillars_kindred_desc:0 "Cada uno de los estudiantes de Sahar siguió su propio camino después de su desaparición, pero siguen siendo hermanos y hermanas en la fe."
 doctrine_parameter_hostility_override_special_doctrine_sin_pillars_kindred:0 "¡Otros Vástagos [faiths|E] que tienen la doctrina de los Pilares del Deseo se consideran Justos en lugar de #V Hostiles#!"
 doctrine_parameter_conscience_opinion_active:0 ""
 special_doctrine_set_pillars_kindred_name:0 "Pilares de conjunto"
 special_doctrine_set_pillars_kindred_desc:0 "Set tiene muchas formas, muchos nombres y muchas historias de orígenes. Pero al final, sigue siendo el Gran Libertador."
 doctrine_parameter_hostility_override_special_doctrine_set_pillars_kindred:0 "¡Otros Vástagos [faiths|E] que tienen la doctrina de los Pilares de Set se consideran Justos en lugar de #V Hostiles#!"
  doctrine_parameter_hostility_override_special_doctrine_ecumenical_hunters:0 "Otros cazadores [fe|E] que tienen la doctrina de los cazadores ecuménicos se consideran [GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V] en lugar de #V Hostil#!" 
 special_doctrine_ashirra_pillars_kindred_name:0 "Pilares Ashira"
 special_doctrine_ashirra_pillars_kindred_desc:0 "Si bien aquellos que siguieron los primeros pasos del Islam procedían de clanes y orígenes muy diferentes, todos creían en algo más grande que ellos mismos."
 doctrine_parameter_hostility_override_special_doctrine_ashirra_pillars_kindred:0 "¡Otros Vástagos [faiths|E] que tienen la doctrina de los Pilares de Ashirra se consideran Justos en lugar de #V Hostiles#!"
 
 special_doctrine_ignorance_name:0 "No llamar la atención"
 special_doctrine_ignorance_desc:0 "Los mortales no tienen conocimiento de lo sobrenatural en el Mundo de las Tinieblas. Debemos mantenerlo así".
 doctrine_parameter_hostility_override_special_doctrine_ignorance:0 "La Ignorancia [faiths|E] como la Inocencia de los mortales hace que no sean una amenaza para los sobrenaturales del Mundo de Tinieblas. Las fes que desean mantener a los mortales en la ignorancia los consideran [GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V] en lugar de #V Hostil#".  
 doctrine_parameter_conviction_opinion_active:0 ""
 doctrine_parameter_hostility_override_ignorance_hostility_doctrine:0 "La Ignorancia [fe|E] como la Inocencia de los mortales hace que no sean una amenaza para los sobrenaturales del Mundo de las Tinieblas. Las fes que desean mantener a los mortales en la ignorancia los consideran [GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V] en lugar de #V Hostil#".
 
