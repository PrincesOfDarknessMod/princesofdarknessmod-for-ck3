 special_doctrine_fivefold_path_kindred_name:0 "Camino Quíntuple"
 special_doctrine_fivefold_path_kindred_desc:0 "Los Cinco Dharmas tradicionales creados por el primer Arhat, Xue. Los seguidores del Quíntuple Sendero ven los dharmas heréticos como tontos dolorosamente engañados o traidores peligrosos que necesitan ser sofocados para siempre."
 doctrine_parameter_hostility_override_special_doctrine_fivefold_path_kindred:0 "¡Otros [GetTrait('kueijin').GetName( GetNullCharacter )] [religiones|E] que tienen la doctrina del quíntuple sendero se consideran justos en lugar de #V Astray#!"
 allied_to_yomi_wan_hostility_name:0 "Aliado del Yomi Wan"
 special_doctrine_allied_to_yomi_wan_hostility_name:0 "Aliado del Yomi Wan"
 special_doctrine_allied_to_yomi_wan_hostility_desc:0 "Los Yomi Wan son nuestros señores. Los que no las obedezcan serán destruidos."
 against_to_yomi_wan_hostility_name:0 "Hostil al Yomi Wan"
 special_doctrine_against_to_yomi_wan_hostility_name:0 "Contra el Yomi Wan"
 special_doctrine_against_to_yomi_wan_hostility_desc:0 "Cuidado con los aliados de Yomi Wan. Esos deberían ser destruidos."
 
