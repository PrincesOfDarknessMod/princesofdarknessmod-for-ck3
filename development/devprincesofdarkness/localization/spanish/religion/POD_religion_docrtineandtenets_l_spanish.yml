l_spanish: 

# Vampire Doctrines

 
 tenet_vengeance_of_lilith_name:0 "Vengeance of Lilith"
 tenet_vengeance_of_lilith_desc:0 "Caine's childer destroyed Lilith's garden and murdered her children. Only Toreador and Nosferatu refrained from the destruction, and covered the dead children's faces with veils as a sign of respect. Thus, they are exempt from the vengeance of Lilith's followers."
 
 #A passage in Revelations of the Dark Mother, which describes how (represented allegorically as the thirteen Clan Founders) 
 

 doctrine_vampirethemasquerade_name:0 "Mascarada"
 doctrine_vampirethemasquerade_strict_name:0 "Mascarada estricta"
 doctrine_vampirethemasquerade_strict_desc:0 "El Silencio de la Sangre se aplica estrictamente. Muchos parientes se irritan con esta aplicación draconiana.\NNo hagas amigos entre los Poetas, ellos cantarán demasiado de ti.\NNo seas conocido. Busca las sombras. No dejes que el sacerdote, el poeta o el campesino te vean alimentar. No ninguno de ellos lo dejará ser.\N-Cuando la Cruz tiene un punto, encuentra tu seguridad".
 doctrine_vampirethemasquerade_lax_name:0 "Lax Masquerade"
 doctrine_vampirethemasquerade_lax_desc:0 "La aplicación del Silencio de la Sangre es laxa. Aunque los Kindred se esfuerzan por ocultar su existencia, también cometen a veces terribles errores que no son castigados por sus mayores."
 doctrine_vampirethemasquerade_none_name:0 "No hay mascarada"
 doctrine_vampirethemasquerade_none_desc:0 "Los vampiros actúan sin tener en cuenta el secreto de los kine."
 doctrine_vampirethemasquerade_ignorant_name:0 "ignorant"
 doctrine_vampirethemasquerade_ignorant_desc:0 "Los vampiros no existen".
 doctrine_vampirethemasquerade_consent_name:0 "Aliméntate sólo de los que están dispuestos"
 doctrine_vampirethemasquerade_consent_desc:0 "Los vampiros mientras estén encubiertos de la sociedad son grandes han de buscar el consentimiento de sus "donantes"." 
 doctrine_vampirethemasquerade_cult_name:0 "Culto a la sangre"
 doctrine_vampirethemasquerade_cult_desc:0 "Los vampiros tienen una sociedad secreta o culto a la sangre que los deifica encubiertamente como un dios de la sangre."  
 doctrine_vampirethemasquerade_family_name:0 "Secreto familiar"
 doctrine_vampirethemasquerade_family_desc:0 "Los vampiros se alimentan de familias mortales particulares que pueden ser algo conscientes de la condición vampírica. Desean mantener su sangre pura, y desprecian a los "impuros"".   
 doctrine_parameter_vampirethemasquerade_strict:0 "Los personajes con los [trait|E]s [GetTrait('predatortype_consensualist').GetName( GetPlayer )], [GetTrait('predatortype_cultist').GetName( GetPlayer )] o [GetTrait('predatortype_familias').GetName( GetPlayer )] son [criminales|E]"
 doctrine_parameter_vampirethemasquerade_lax:0 "Los personajes con los [rasgos|E]s [GetTrait('predatortype_consensualist').GetName( GetPlayer )], [GetTrait('predatortype_cultist').GetName( GetPlayer )] o [GetTrait('predatortype_familias').GetName( GetPlayer )] son [rechazados|E]"
 doctrine_parameter_vampirethemasquerade_none:0 "Los personajes con el [GetTrait('predatortype_farmer').GetName( GetPlayer )] [trait|E] son rechazados."  
 doctrine_parameter_vampirethemasquerade_family:0 "Los personajes con los [trait|E]s [GetTrait('predatortype_alleycat').GetName( GetPlayer )], [GetTrait('predatortype_bedlamite'). GetName( GetPlayer )], [GetTrait('predatortype_farmer').GetName( GetPlayer )], [GetTrait('predatortype_footpad').GetName( GetPlayer )] o [GetTrait('predatortype_graverobber').GetName( GetPlayer )] son rechazados. Los personajes con el [trait|E] [GetTrait('predatortype_familias').GetName( GetPlayer )] son totalmente aceptados"
 doctrine_parameter_vampirethemasquerade_cult:0 "Los personajes con el [trait|E]s [GetTrait('predatortype_consensualist').GetName( GetPlayer )] o [GetTrait('predatortype_familias').GetName( GetPlayer )] son rechazados.  Los personajes con el [GetTrait('predatortype_cultist').GetName( GetPlayer )] [trait|E] son aceptados". 
 doctrine_parameter_vampirethemasquerade_consent:0 "Los personajes con el [GetTrait('predatortype_alleycat').GetName( GetPlayer )] [trait|E] son [criminales|E]. Los personajes con [GetTrait('predatortype_cauchemar').GetName( GetPlayer )] o [GetTrait('predatortype_extortionist').GetName( GetPlayer )] [trait|E] son rechazados. Los personajes con el [GetTrait('predatortype_consensualist').GetName( GetPlayer )] [trait|E] son alabados. Todos los demás tipos de depredador son aceptados".  
 doctrine_parameter_vampirethemasquerade_none:0 "Los vampiros no existen".  
 
# Oaths and Oathbreaking

 doctrine_oathbreaking_name:0 "Rompiendo el culo"
 doctrine_oathbreaking_crime_name:0 "Criminal"
 doctrine_oathbreaking_crime_desc:0 "Los juramentos son la base de la ley. Los que rompen los juramentos carecen de honor y pierden la vida."
 doctrine_oathbreaking_shunned_name:0 "Rehusado"
 doctrine_oathbreaking_shunned_desc:0 "Los que rompen los juramentos no son de fiar. Desconfía de ellos".
 doctrine_oathbreaking_accepted_name:0 "Aceptado"
 doctrine_oathbreaking_accepted_desc:0 "Se acepta la ruptura de juramentos. Quién se cree las palabras de los muertos vivientes?"
 doctrine_oathbreaking_ignorant_name:0 "ignorant"
 doctrine_oathbreaking_ignorant_desc:0 "Romper el juramento no se reconoce como una falta penal".
 doctrine_parameter_oathbreaking_illegal:0 "Los personajes con el [GetTrait('oathbreaker').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_parameter_oathbreaking_shunned:0 "Los personajes con el [GetTrait('oathbreaker').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrine_parameter_oathbreaking_accepted:0 "Los personajes con el [GetTrait('oathbreaker').GetName( GetPlayer )] [trait|E] son totalmente aceptados"
 doctrine_parameter_oathbreaking_ignorant:0 "Los personajes con el [GetTrait('oathbreaker').GetName( GetPlayer )] [trait|E] son ignorados."
 
 doctrine_vampirebloodoath_name:0 "Juramentos de sangre"
 doctrine_vampirebloodoath_crime_name:0 "Criminal"
 doctrine_vampirebloodoath_crime_desc:0 "Estar ligado a la sangre es peor que estar esclavizado, porque encadena el corazón y la mente además del cuerpo."
 doctrine_vampirebloodoath_shunned_name:0 "Rehuir"
 doctrine_vampirebloodoath_shunned_desc:0 "Los juramentos de sangre pueden ser una carga tanto para el regnante como para el esclavo, elígelos con cuidado si es que lo hacen. Recuerda los proverbios. Un sorbo de Sangre, acepto. Dos sorbos, acepto. Tres sorbos, rufi".
 doctrine_vampirebloodoath_accepted_name:0 "Aceptado"
 doctrine_vampirebloodoath_accepted_desc:0 "El Juramento de Sangre es la base de nuestra sociedad. Los juramentos de lealtad deben cumplirse con algún grado de vasallaje de sangre."
 doctrine_vampirebloodoath_ignorant_name:0 "ignorant"
 doctrine_vampirebloodoath_ignorant_desc:0 "Los vampiros no existen". 
 doctrine_parameter_vampirebloodoath_illegal:0 "Los personajes con el [GetTrait('bloodoath').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_parameter_vampirebloodoath_shunned:0 "Los personajes con el [GetTrait('bloodoath').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrine_parameter_vampirebloodoath_accepted:0 "Los personajes con el [GetTrait('bloodoath').GetName( GetPlayer )] [trait|E] son totalmente aceptados"

 doctrine_vampireghouling_name:0 "Ghoul Vassalage"
 doctrine_vampireghouling_crime_name:0 "Criminal"
 doctrine_vampireghouling_crime_desc:0 "Los Ghouls amenazan el Silencio de la Sangre, no compartas la Sangre con los indignos.\NNo te conviertas en un Dios para los Hijos de Seth, porque el de Arriba, creciendo celoso en su cielo, golpeará la línea de Caine para siempre. Recuerda a Ashtareth de rostro amable, recuerda a Baal de grasa dorada, recuerda al fuerte Tammauz, sabe que los Hijos de Seth se alzarán con las armas de Aquel de Arriba, y nos conquistarán, si somos como dioses para ellos. Guiarás a los Hijos de Seth como un pastor guía a su rebaño, y los sacrificarás cuando sea necesario. Limpiarás su sangre y los mantendrás libres de enfermedades".
 doctrine_vampireghouling_shunned_name:0 "Rechazado"
 doctrine_vampireghouling_shunned_desc:0 "Somos depredadores, no presas. Compartir tu sangre con las vacas revela tu propia debilidad. No te convertirás en un Dios para los Hijos de Seth, porque el de Arriba, que se está poniendo celoso en su cielo, eliminará la línea de Caine para siempre. Recuerda a Ashtareth de rostro amable, recuerda a Baal de grasa dorada, recuerda al fuerte Tammauz, sabe que los Hijos de Seth se alzarán con las armas de Aquel de Arriba, y nos conquistarán, si somos como dioses para ellos. Guiarás a los Hijos de Seth como un pastor guía a su rebaño, y los sacrificarás cuando sea necesario. Limpiarás su sangre y los mantendrás libres de enfermedades".
 doctrine_vampireghouling_accepted_name:0 "Aceptado"
 doctrine_vampireghouling_accepted_desc:0 "El lugar de Kine es servirnos, y son mejores vasallos cuando están atados por el Juramento de Sangre.\NDe los que sirven, los que elijas bendecir con la Potencia de Caine, pueden venir a vivir dentro de tu casa, para protegerte, que nadie abrace a estos guardianes, que se les dé sangre en el momento apropiado: que su Fuerza sea tu Fuerza, Fuerza que no disminuye con el sol. Que sus Ojos sean tus Ojos, Ojos que pueden ver en el día. Que sus Oídos sean tus Oídos, Oídos que pueden oír mientras duermes. Que los que sirven sean nombrados los más grandes de los Hijos de Seth, y los más privilegiados. Que disfruten de las finas telas de los Hijos, que disfruten de la suave música de los Hijos, que conozcan la dulzura de nuestro vino. Protejámoslos de los que quieren obstaculizarlos y hacerles daño, y levantémonos todos en señal de indignación si uno de los que sirven es asesinado por otro Kindred, pues ningún Kindred tiene derecho a matar al Siervo de otro sin provocación."
 doctrine_vampireghouling_mass_name:0 "Se acepta el Ghouling en masa"
 doctrine_vampireghouling_mass_desc:0 "La sangre de los kindred puede construir legiones.\NDe los que sirven, los que elijas bendecir con la Potencia de Caine, pueden venir a vivir dentro de tu casa, para protegerte, que nadie abrace a estos guardianes, que se les dé sangre en el momento apropiado: que su Fuerza sea tu Fuerza, Fuerza que no disminuye con el sol. Que sus Ojos sean tus Ojos, Ojos que pueden ver en el día. Que sus Oídos sean tus Oídos, Oídos que pueden oír mientras duermes. Que los que sirven sean nombrados los más grandes de los Hijos de Seth, y los más privilegiados. Que disfruten de las finas telas de los Hijos, que disfruten de la suave música de los Hijos, que conozcan la dulzura de nuestro vino. Protejámoslos de los que quieren obstaculizarlos y hacerles daño, y levantémonos todos en señal de indignación si uno de los que sirven es asesinado por otro Kindred, pues ningún Kindred tiene derecho a matar al Siervo de otro sin provocación." 
 doctrine_vampireghouling_ignorant_name:0 "ignorant"
 doctrine_vampireghouling_ignorant_desc:0 "Los vampiros no existen".  
 doctrine_parameter_vampireghouling_illegal:0 "Los personajes con los [trait|E]s [GetTrait('ghoul').GetName( GetPlayer )], [trait|E]s [GetTrait('regnant').GetName( GetPlayer )] o [GetTrait('massregnant').GetName( GetPlayer )] son [criminales|E]."
 doctrine_parameter_vampireghouling_shunned:0 "Los personajes con los [trait|E]s [GetTrait('ghoul').GetName( GetPlayer )] o [trait|E]s [GetTrait('regnant').GetName( GetPlayer )] son [shunned|E]. Los personajes con el [GetTrait('massregnant').GetName( GetPlayer )] son [criminales|E]".
 doctrine_parameter_vampireghouling_accepted:0 "Los personajes con los [trait|E]s [GetTrait('ghoul').GetName( GetPlayer )] o [trait|E]s [GetTrait('regnant').GetName( GetPlayer )] son totalmente aceptados. Los personajes con el [GetTrait('massregnant').GetName( GetPlayer )] son [criminales|E]".
 doctrine_parameter_vampireghouling_mass:0 "Los personajes con los [trait|E]s [GetTrait('ghoul').GetName( GetPlayer )], [trait|E]s [GetTrait('regnant').GetName( GetPlayer )] o [GetTrait('massregnant').GetName( GetPlayer )] son totalmente aceptados." 

 doctrine_bloodsorcery_name:0 "Hechicería de sangre"
 doctrine_bloodsorcery_crime_name:0 "Criminal"
 doctrine_bloodsorcery_crime_desc:0 "La hechicería de sangre es una amenaza para todos los Kindred y, por tanto, debe ser prohibida. \La Madre del Poder, la oscura Lilith, es la más grande de ellas, pero hay otras, y más aún por venir. No bebas de su sangre, porque te atraparán, ten cuidado con ellos, son astutos. Conocen el conocimiento de Adán y la sabiduría de Eva, son los portadores del fuego, los cultivadores de la tierra, los criadores de animales, los portadores de la escritura, son los hijos del Sol, las Estrellas Nacientes. Tratarán de involucrarte en su viaje, ¡Resiste! ¡Resiste! Su camino ignora el hambre, la sangre y el cuerpo. No confíes en los que tienen ojos brillantes hacia el amanecer. Recuerda siempre que es el Amanecer el que trae tu muerte"
 doctrine_bloodsorcery_shunned_name:0 "Rechazado"
 doctrine_bloodsorcery_shunned_desc:0 "Los Hechiceros de Sangre son un grupo sospechoso, en el mejor de los casos un mal a veces necesario.\NDe los Iluminados, la Madre del Poder, la oscura Lilith, es de los más grandes, pero hay otros, y más aún por venir. No bebas de su sangre, porque te atraparán, ten cuidado con ellos, son astutos. Conocen el conocimiento de Adán y la sabiduría de Eva, son los portadores del fuego, los cultivadores de la tierra, los criadores de animales, los portadores de la escritura, son los hijos del Sol, las Estrellas Nacientes. Tratarán de involucrarte en su viaje, ¡Resiste! ¡Resiste! Su camino ignora el hambre, la sangre y el cuerpo. No confíes en los que tienen ojos brillantes hacia el amanecer. Recuerda siempre que es el Amanecer el que trae tu muerte"
 doctrine_bloodsorcery_ignorant_name:0 "ignorant"
 doctrine_bloodsorcery_ignorant_desc:0 "La magia no existe".   
 doctrine_bloodsorcery_accepted_name:0 "Aceptado"
 doctrine_bloodsorcery_accepted_desc:0 "La magia llena el mundo que nos rodea, y es nuestro derecho y nuestro privilegio dedicarnos a ella de la forma en que lo hicieron nuestros antepasados."
 doctrine_parameter_bloodsorcery_illegal:0 "Los personajes con el [GetTrait('bloodsorcery').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_parameter_bloodsorcery_shunned:0 "Los personajes con el [GetTrait('bloodsorcery').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrine_parameter_bloodsorcery_accepted:0 "Los personajes con el [GetTrait('bloodsorcery').GetName( GetPlayer )] [trait|E] son totalmente aceptados"
 
 doctrina_infernalism_name:0 "infernalism"
 doctrina_infernalism_crimen_name:0 "Criminal"
 doctrine_infernalism_crime_desc:0 "Los infernales pretenden traer el infierno a la tierra. No negocies con la Oscuridad: con el tiempo nos llevará a todos. Fíjate bien en los Hijos del de Abajo, los parientes de la Serpiente, pues su tacto te quemará también, y sus lenguas te engañarán y engañarán. Cazad y destruid a los infernalistas dondequiera que los encontréis".
 doctrina_infernalism_rejected_name:0 "Rechazado"
 doctrine_infernalism_shunned_desc:0 "Los que pactan con los demonios siembran su propia perdición. No negocies con la Oscuridad: con el tiempo nos llevará a todos. Fíjate bien en los Hijos del de Abajo, los parientes de la Serpiente, porque su toque te quemará también, y sus lenguas te engañarán y engañarán. Cazad y destruid a los infernalistas dondequiera que los encontréis".
 doctrina_infernalism_accepted_name:0 "Aceptado"
 doctrine_infernalism_accepted_desc:0 "¡Las inversiones infernales son el camino hacia el verdadero poder!"
 doctrina_infernalism_ignorant_name:0 "ignorant"
 doctrina_infernalism_ignorant_desc:0 "El diablo es como una metáfora, ¿no?"  
 doctrine_parameter_infernalism_illegal:0 "Los personajes con el [GetTrait('infernalista').GetName( GetPlayer )] [trait|E] o el [GetTrait('baali').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_parameter_infernalism_shunned:0 "Los personajes con el [GetTrait('infernalist').GetName( GetPlayer )] [trait|E] o el [GetTrait('baali').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrine_parameter_infernalism_accepted:0 "Los personajes con el [GetTrait('infernalist').GetName( GetPlayer )] [trait|E] o el [GetTrait('baali').GetName( GetPlayer )] [trait|E] son totalmente aceptados"

 doctrina_vampirediablerie_nombre:0 "Diablerie"
 doctrine_vampirediablerie_crime_name:0 "Criminal"
 doctrine_vampirediablerie_crime_desc:0 "Consumir el alma de otro Kindred es el peor crimen entre los de nuestra especie.\NUna valedicción, que prohíbe la Diablerie\NNo busques la sangre de tu propio Elder, no busques la sangre del Sire de tu Sire, no busques al que te hizo Kin, porque sentirás la pira funeraria, cuando pagues por tu pecado inmortal."
 doctrine_vampirediablerie_shunned_name:0 "Rechazado"
 doctrine_vampirediablerie_shunned_desc:0 "Una vez que los vampiros han adquirido el gusto por la sangre de otros vampiros, ¿dónde van a parar?"
 doctrine_vampirediablerie_accepted_name:0 "Aceptado"
 doctrine_vampirediablerie_accepted_desc:0 "La sangre pertenece a aquellos lo suficientemente fuertes como para sostenerla".
 doctrine_vampirediablerie_ignorant_name:0 "Ignorante"
 doctrine_vampirediablerie_ignorant_desc:0 "Los vampiros no existen". 
 doctrine_parameter_vampirediablerie_illegal:0 "Los personajes con los [trait|E]s [GetTrait('diablerist').GetName( GetPlayer )] o [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] son [criminales|E]"
 doctrine_parameter_vampirediablerie_shunned:0 "Los personajes con los [trait|E]s [GetTrait('diablerist').GetName( GetPlayer )] o [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_vampirediablerie_accepted:0 "Los personajes con los [trait|E]s [GetTrait('diablerist').GetName( GetPlayer )] o [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] son totalmente aceptados"
 doctrine_parameter_vampirediablerie_ignorant:0 "Desconocemos los [GetTrait('diablerist').GetName( GetPlayer )] o [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] [trait|E]s"
 
 doctrine_vampirefrenzy_name:0 "Frenesí"
 doctrina_vampirefrenzy_crime_name:0 "Criminal"
 doctrine_vampirefrenzy_crime_desc:0 "Dejar que la Bestia tome el control es convertirse en la Bestia. Recuerda los proverbios. Monta a la Bestia, no dejes que te monte a ti".
 doctrine_vampirefrenzy_shunned_name:0 "Rechazado"
 doctrine_vampirefrenzy_shunned_desc:0 "Todos los Kindred luchan contra las exigencias de la Bestia, no te entregues a ella fácilmente. Recordad los proverbios. Monta a la Bestia, no dejes que te monte a ti".
 doctrine_vampirefrenzy_accepted_name:0 "Aceptado"
 doctrine_vampirefrenzy_accepted_desc:0 "¡Monta la ola! La Bestia es poder cuando más lo necesitamos!"
 doctrine_vampirefrenzy_ignorant_name:0 "Ignorante"
 doctrine_vampirefrenzy_ignorant_desc:0 "¿Qué puede hacer que alguien se descontrole tanto?"
 doctrine_parameter_vampirefrenzy_illegal:0 "Los personajes con el [GetTrait('wight').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_parameter_vampirefrenzy_shunned:0 "Los personajes con el [GetTrait('wight').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrine_parameter_vampirefrenzy_accepted:0 "Los personajes con el [GetTrait('wight').GetName( GetPlayer )] [trait|E] son totalmente aceptados"
 doctrine_parameter_vampirefrenzy_ignorant:0 "Los personajes con el [GetTrait('wight').GetName( GetPlayer )] [trait|E] sufren un mal desconocido."

 doctrine_vampirethinblood_name:0 "Sangre delgada"
 doctrine_vampirethinblood_crime_name:0 "Criminal"
 doctrine_vampirethinblood_crime_desc:0 "¡Los de sangre fina traerán la Gehenna! Destruidlos allí donde se encuentren!"
 doctrine_vampirethinblood_shunned_name:0 "Rehuido"
 doctrine_vampirethinblood_shunned_desc:0 "Los de sangre delgada son un presagio de la Gehenna. Se les evita y se les rechaza".
 doctrine_vampirethinblood_accepted_name:0 "Aceptado"
 doctrine_vampirethinblood_accepted_desc:0 "Los Duskborn son como cualquier otro vampiro, aunque más débiles."
 doctrine_vampirethinblood_ignorant_name:0 "Ignorante"
 doctrine_vampirethinblood_ignorant_desc:0 "No conocemos los caminos de la sangre vampírica". 
 doctrine_parameter_vampirethinblood_illegal:0 "Los personajes con el [GetTrait('caitiff').GetName( GetPlayer )], [GetTrait('vampgeneration14'). GetName( GetPlayer )], [GetTrait('vampgeneration15').GetName( GetPlayer )] y [GetTrait('vampgeneration16').GetName( GetPlayer )] [traits|E] son [criminales|E]"
 doctrine_parameter_vampirethinblood_shunned:0 "Los personajes con el [GetTrait('caitiff').GetName( GetPlayer )], [GetTrait('vampgeneration14'). GetName( GetPlayer )], [GetTrait('vampgeneration15').GetName( GetPlayer )] y [GetTrait('vampgeneration16').GetName( GetPlayer )] [traits|E] son [shunned|E]"
 doctrine_parameter_vampirethinblood_accepted:0 "Los personajes con los [GetTrait('caitiff').GetName( GetPlayer )], [GetTrait('vampgeneration14').GetName( GetPlayer )],[GetTrait('vampgeneration15').GetName( GetPlayer )] y [GetTrait('vampgeneration16').GetName( GetPlayer )] [traits|E] son totalmente aceptados"
 doctrine_parameter_vampirethinblood_ignorant:0 "Desconocemos los [GetTrait('caitiff').GetName( GetPlayer )], [GetTrait('vampgeneration15').GetName( GetPlayer )] y [GetTrait('vampgeneration16').GetName( GetPlayer )] [traits|E]"

 # Hunter doctrines 
 
 doctrine_vampirism_name:0 "Vampirismo"
 doctrine_vampirism_crime_name:0 "Criminal"
 doctrina_vampirismo_crime_desc:0 "Las abominaciones chupasangre deben ser destruidas"
 doctrina_vampirismo_rechazo_nombre:0 "Rechazado"
 doctrine_vampirism_shunned_desc:0 "Compadece a estos pobres wreteched que ya no pueden ver un amanecer".
 doctrine_vampirism_accepted_name:0 "Aceptado"
 doctrine_vampirism_accepted_desc:0 "Los Kindred son aceptados".
 doctrina_vampirismo_ignorante_nombre:0 "Ignorante"
 doctrine_vampirism_ignorant_desc:0 "Los vampiros no existen".  
 doctrine_parameter_vampirism_illegal:0 "Los personajes con el [GetTrait('vampiro').GetName( GetPlayer )] [rasgo|E] son [criminales|E]"
 doctrine_parameter_vampirism_shunned:0 "Los personajes con el [GetTrait('vampiro').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrina_parámetro_vampirismo_aceptado:0 "Los personajes con el [GetTrait('vampiro').GetName( GetPlayer )] [rasgo|E] son totalmente aceptados" 
 
 doctrine_lycanthropy_name:0 "Licantropía"
 doctrine_lycanthropy_crime_name:0 "Criminal"
 doctrine_lycanthropy_crime_desc:0 "Los lupinos deben ser destruidos.\NDe las bestias lunares, las que cambian, son las más antiguas de todas, antes de mi padre vagaban por las tierras. No te pongas en su camino, evítalos, nos persiguen como lobos en el redil. Porque nosotros somos de una clase, y ellos de otra. Cuídate de su tierra sagrada, camina suavemente por su desierto. Su mordedura es como nuestra mordedura, sus garras son como nuestras garras, no te detengas en su camino, ellos son de una clase, y nosotros de otra."
 doctrine_lycanthropy_shunned_name:0 "Rechazado"
 doctrine_lycanthropy_shunned_desc:0 "Aunque sobrenaturales como nosotros, los hombres lobo no son como nosotros. No son como nosotros en absoluto.\NDe las Bestias de la Luna, las que cambian, son las más antiguas de todas, antes de mi padre vagaban por las tierras. No te pongas en su camino, evítalos, nos persiguen como lobos en el redil. Porque nosotros somos de una clase, y ellos de otra. Cuídate de su tierra sagrada, camina suavemente por su desierto. Su mordedura es como nuestra mordedura, sus garras son como nuestras garras, no te detengas en su camino, ellos son de una clase, y nosotros de otra."
 doctrina_lycanthropy_accepted_name:0 "Aceptado"
 doctrine_lycanthropy_accepted_desc:0 "Los Garou son aceptados".
 doctrine_lycanthropy_ignorant_name:0 "Ignorante"
 doctrine_lycanthropy_ignorant_desc:0 "¡Deja de preguntar cuándo añadirán esta característica los desarrolladores del mod! Cuando la añadamos, lo sabrás!"  
 doctrine_parameter_lycanthropy_illegal:0 "Los personajes con el [GetTrait('hombre lobo').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_parameter_lycanthropy_shunned:0 "Los personajes con el [GetTrait('hombre lobo').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrine_parameter_lycanthropy_accepted:0 "Los personajes con el [GetTrait('hombre lobo').GetName( GetPlayer )] [rasgo|E] son totalmente aceptados" 
 
 doctrine_magicraft_name:0 "Magick"
 doctrine_magicraft_crime_name:0 "Criminal"
 doctrine_magicraft_crime_desc:0 "Los Magos deben ser destruidos.\nDe los Iluminados\nLa Madre del Poder, la oscura Lilith, es de los más grandes, pero hay otros, y más aún por venir. No bebas de su sangre, porque te atraparán, ten cuidado con ellos, son astutos. Conocen el conocimiento de Adán y la sabiduría de Eva, son los portadores del fuego, los cultivadores de la tierra, los criadores de animales, los portadores de la escritura, son los hijos del Sol, las Estrellas Nacientes. Tratarán de involucrarte en su viaje, ¡Resiste! ¡Resiste! Su camino ignora el hambre, la sangre y el cuerpo. No confíes en los que tienen ojos brillantes hacia el amanecer. Recuerda siempre que es el Amanecer el que trae tu muerte".
 doctrine_magicraft_shunned_name:0 "Rechazado"
 doctrine_magicraft_ignorant_name:0 "Ignorante"
 doctrine_magicraft_ignorant_desc:0 "La magia no existe".   
 doctrine_magicraft_shunned_desc:0 "Aunque son sobrenaturales como nosotros, los magos no son como nosotros. No son como nosotros en absoluto.\NDe los Iluminados, la Polilla del Poder, la oscura Lilith, es de los más grandes, pero hay otros, y más aún por venir. No bebas de su sangre, porque te atraparán, ten cuidado con ellos, son astutos. Conocen el conocimiento de Adán y la sabiduría de Eva, son los portadores del fuego, los cultivadores de la tierra, los criadores de animales, los portadores de la escritura, son los hijos del Sol, las Estrellas Nacientes. Tratarán de involucrarte en su viaje, ¡Resiste! ¡Resiste! Su camino ignora el hambre, la sangre y el cuerpo. No confíes en los que tienen ojos brillantes hacia el amanecer. Recuerda siempre que es el Amanecer el que trae tu muerte".
 doctrine_magicraft_accepted_name:0 "Aceptado"
 doctrine_magicraft_accepted_desc:0 "Los Magos son aceptados".
 doctrine_parameter_magicraft_illegal:0 "Los personajes con el [GetTrait('mago').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_parameter_magicraft_shunned:0 "Characters with the [GetTrait('mage').GetName( GetPlayer )] [trait|E] are [shunned|E]"
 doctrine_parameter_magicraft_accepted:0 "Characters with the [GetTrait('mage').GetName( GetPlayer )] [trait|E] are fully accepted" 
 
  doctrine_haunting_name:0 "Haunting"
 doctrine_haunting_crime_name:0 "Criminal"
 doctrine_haunting_crime_desc:0 "Los fantasmas deben mantenerse al otro lado del velo.\NDe esos espíritus de los muertos\NObserva bien: hay un lugar más allá del espíritu, más allá de la vida que es la Oscuridad, la Sombra, y allí habitan las Sombras. Una isla, una fortaleza, una tierra de los Muertos, he viajado allí a través de un camino de perdición y he sido testigo del temible rey de la Ciudad Estigia cuando se sentaba en la corte. He visto a los encapuchados sin rostro atravesar el río Estigia. Pululan a nuestro alrededor como moscas en un cadáver putrefacto, y como nosotros, se alimentan del miedo, el éxtasis y la ira. Están muertos, pero no muertos, y están más cerca de nosotros de lo que nunca sabremos".
 doctrine_haunting_shunned_name:0 "Rechazado"
 doctrine_haunting_shunned_desc:0 "Los fantasmas son almas desprendidas de sus cadáveres. Pueden intentar poseer nuestros cuerpos.\NDe esos espíritus de los muertos: hay un lugar más allá del espíritu, más allá de la vida que es la oscuridad, la sombra, y allí habitan las sombras. Una isla, una fortaleza, una tierra de los Muertos, he viajado allí a través de un camino de perdición y he sido testigo del temible rey de la Ciudad Estigia cuando se sentaba en la corte. He visto a los encapuchados sin rostro atravesar el río Estigia. Pululan a nuestro alrededor como moscas en un cadáver putrefacto, y como nosotros, se alimentan del miedo, el éxtasis y la ira. Están muertos, pero no muertos, y están más cerca de nosotros de lo que nunca sabremos".
 doctrine_haunting_accepted_name:0 "Aceptado"
 doctrine_haunting_accepted_desc:0 "Los espectros pueden ser útiles. Aquellos que conocen las artes de invocar y atar espectros pueden utilizarlos para todo tipo de propósitos.\NDe esos espíritus de los muertos, fíjate bien: hay un lugar más allá del espíritu, más allá de la vida que es la Oscuridad, la Sombra, y allí habitan las Sombras. Una isla, una fortaleza, una tierra de los Muertos, he viajado allí a través de un camino de perdición y he sido testigo del temible rey de la Ciudad Estigia mientras se sentaba en la corte. He visto a los encapuchados sin rostro atravesar el río Estigia. Pululan a nuestro alrededor como moscas en un cadáver putrefacto, y como nosotros, se alimentan del miedo, el éxtasis y la ira. Muertos están, pero no muertos, y están más cerca de nosotros de lo que nunca sabremos".
 doctrine_haunting_ignorant_name:0 "Ignorante"
 doctrine_haunting_ignorant_desc:0 "Cuando mueres, ese es el final".  
 doctrine_parameter_haunting_illegal:0 "Los personajes con el [GetTrait('wraith').GetName( GetPlayer )] [trait|E] son [criminales|E]. Los personajes con [GetTrait('possessed_1').GetName( GetPlayer )] o [GetTrait('oblivion').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrine_parameter_haunting_shunned:0 "Los personajes con [GetTrait('wraith').GetName( GetPlayer )], [GetTrait('possessed_1').GetName( GetPlayer )] o [GetTrait('oblivion').GetName( GetPlayer )] [trait|E]s son [shunned|E]"
 doctrine_parameter_haunting_accepted:0 "Los personajes con [GetTrait('wraith').GetName( GetPlayer )] o [GetTrait('oblivion').GetName( GetPlayer )] [trait|E]s son totalmente aceptados" 
 
 doctrine_glamour_name:0 "Glamour"
 doctrina_glamour_crime_name:0 "Criminal"
 doctrine_glamour_crime_desc:0 "El Fae debe ser destruido".
 doctrine_glamour_shunned_name:0 "Rechazado"
 doctrine_glamour_shunned_desc:0 "Aunque son sobrenaturales como nosotros, los Fae no son como nosotros. No son como nosotros en absoluto.\NDe los salvajes, de los locos, de los salvajes, digo, primero, ¡no bebas de su sangre! Pero obsérvalos, porque son hermosos en su naturaleza, son encantadores en su misterio, son mortales en sus habilidades de guerra. Solos entre las criaturas de la noche, me hicieron compañía en la tierra y me trajeron agua cuando tenía sed y aún podía respirar. Como yo, fueron expulsados, como mis hijos, no tienen hogar, como los hijos de mis hijos, vagan, como mi madre y mi padre, saben demasiado, pero guardan su propio consejo, y, de ellos, digo fíjate bien, ¡cállate! No digas nada. Observa, y aprende".
 doctrine_glamour_accepted_name:0 "Aceptado"
 doctrine_glamour_accepted_desc:0 "Los Fae son aceptados.\NDe los salvajes, digo, primero, no bebas de su sangre. Pero obsérvalos, porque son hermosos en su naturaleza, son encantadores en su misterio, son mortales en sus habilidades de guerra. Solos entre las criaturas de la noche, me hicieron compañía en la tierra y me trajeron agua cuando tenía sed y aún podía respirar. Como yo, fueron expulsados, como mis hijos, no tienen hogar, como los hijos de mis hijos, vagan, como mi madre y mi padre, saben demasiado, pero guardan su propio consejo, y, de ellos, digo fíjate bien, ¡cállate! No digas nada. Observa, y aprende".
 doctrine_glamour_ignorant_name:0 "Ignorante"
 doctrine_glamour_ignorant_desc:0 "¿No eres un poco mayor para creer en Papá Noel?"  
 doctrine_parameter_glamour_illegal:0 "Los personajes con el [GetTrait('fae').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_parameter_glamour_shunned:0 "Los personajes con el [GetTrait('fae').GetName( GetPlayer )] [trait|E] son [shunned|E]"
 doctrine_parameter_glamour_accepted:0 "Los personajes con el [GetTrait('fae').GetName( GetPlayer )] [trait|E] son totalmente aceptados" 
  
