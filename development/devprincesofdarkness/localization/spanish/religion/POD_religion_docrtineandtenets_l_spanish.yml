 doctrine_parameter_haunting_accepted:0 "Los personajes con [GetTrait('wraith').GetName( GetPlayer )] o [GetTrait('oblivion').GetName( GetPlayer )] [trait|E]s son totalmente aceptados" 
 
 doctrine_glamour_name:0 "Glamour"
 doctrine_glamour_crime_desc:0 "El Fae debe ser destruido".
 doctrine_glamour_shunned_name:0 "Rechazado"
 doctrine_glamour_shunned_desc:0 "Aunque son sobrenaturales como nosotros, los Fae no son como nosotros. No son como nosotros en absoluto.\NDe los salvajes, de los locos, de los salvajes, digo, primero, ¡no bebas de su sangre! Pero obsérvalos, porque son hermosos en su naturaleza, son encantadores en su misterio, son mortales en sus habilidades de guerra. Solos entre las criaturas de la noche, me hicieron compañía en la tierra y me trajeron agua cuando tenía sed y aún podía respirar. Como yo, fueron expulsados, como mis hijos, no tienen hogar, como los hijos de mis hijos, vagan, como mi madre y mi padre, saben demasiado, pero guardan su propio consejo, y, de ellos, digo fíjate bien, ¡cállate! No digas nada. Observa, y aprende".
 doctrine_glamour_accepted_name:0 "Aceptado"
 doctrine_glamour_accepted_desc:0 "Los Fae son aceptados.\NDe los salvajes, digo, primero, no bebas de su sangre. Pero obsérvalos, porque son hermosos en su naturaleza, son encantadores en su misterio, son mortales en sus habilidades de guerra. Solos entre las criaturas de la noche, me hicieron compañía en la tierra y me trajeron agua cuando tenía sed y aún podía respirar. Como yo, fueron expulsados, como mis hijos, no tienen hogar, como los hijos de mis hijos, vagan, como mi madre y mi padre, saben demasiado, pero guardan su propio consejo, y, de ellos, digo fíjate bien, ¡cállate! No digas nada. Observa, y aprende".
 doctrine_glamour_ignorant_name:0 "Ignorante"
 doctrine_glamour_ignorant_desc:0 "¿No eres un poco mayor para creer en Papá Noel?"  
 doctrine_parameter_glamour_illegal:0 "Los personajes con el [GetTrait('fae').GetName( GetPlayer )] [trait|E] son [criminales|E]"
 doctrine_supehunting_ignorant_desc:0 "La iglesia sí que es demasiado celosa contra los herejes."
