  doctrine_supehunting_crime_name:0 "Criminal"
 doctrine_supehunting_crime_desc:0 "Los cazadores de brujas deben ser destruidos.\NCuando la Cruz tiene un punto, encuentra su seguridad".
 doctrine_supehunting_shunned_name:0 "Rehuido"
 doctrine_supehunting_shunned_desc:0 "Mejor no atraer su atención.\NCuando la Cruz tiene un punto, encuentra tu seguridad."
