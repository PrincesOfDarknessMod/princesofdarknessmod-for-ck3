 ten_mandates_of_heven_adherent:0 "Wu T'ian"
 ten_mandates_of_heven_adherent_plural:0 "Wu T'ian "
 ten_mandates_of_heven_desc:0 "Los Diez Mandatos del Cielo son reglas y directrices para el Wu T'ian, establecidas por los Ocho Inmortales bajo la administración del Augusto Personaje de Jade. Cada Mandato es igualmente importante y cada inmortal tiene su propia lista de prioridades para seguirlos, en función de su carácter y sus fuerzas personales."

