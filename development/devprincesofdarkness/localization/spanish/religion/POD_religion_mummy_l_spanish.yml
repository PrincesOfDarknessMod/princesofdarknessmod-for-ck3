 code_of_horus:0 "Código de Horus"
 code_of_horus_adj:0 "Wat Hor"
 code_of_horus_adherent:0 "Shemsu-Heru"
 code_of_horus_adherent_plural:0 "Shemsu-Herus"
 code_of_horus_desc:0 "El Código de Horus, también llamado Wat Hor, es una colección de mandamientos de Horus a sus seguidores. Resume las enseñanzas y experiencias de su vida y contiene todas las instrucciones que se le daban a un Undying recién creado en los días de la antigua Khem."
  
 ismaelita:0 "Ismaelita"
 ishmaelite_adj:0 "Ismaelita"
 ishmaelite_adherent:0 "Ismaelita"
 ishmaelite_adherent_plural:0 "Ismaelitas"
 ishmaelite_desc:0 "Los ismaelitas eran pícaros de Shemsu-Heru que abandonaron la cruzada de Horus por diversas razones. Llevan el nombre de Ismael, el primer Shemsu-Heru que habló en contra del liderazgo de Horus y que fue desterrado para caminar solo por la eternidad."
 
 faces_of_apophis:0 "Caras de Apofis"
 faces_of_apophis_adj:0 "Caras"
 faces_of_apophis_adherent:0 "Momia de Bane"
 faces_of_apophis_adherent_plural:0 "Momias Bane"
 faces_of_apophis_desc:0 "Apofis es el núcleo de todos los males del mundo, la encarnación definitiva de Isfret. Desde el principio de los tiempos, Apophis ha estado presente, profanando y destruyendo los principios de Ma'at. Es el embaucador definitivo, la oscuridad abrumadora y la perversión incesante, que asola el mundo".
 
