 pathofhonorableaccord_adherent:0 "Patriota"
 pathofhonorableaccord_adherent_plural:0 "Patriotas"
 pathofhonorableaccord_desc:0 "La Senda del Acuerdo Honorable es una Senda de la Iluminación que aprovecha a la Bestia mediante la práctica rigurosa de un comportamiento honorable y caballeresco. Los Cainitas en la Senda del Acuerdo Honorable dan un gran valor al ritual y a la ceremonia. Por lo tanto, los Caballeros del Sabbat siempre participan en Fiestas de Guerra, ritae, ceremonias y otros eventos de la manada. En conjunto, los seguidores de la Senda buscan unir a las facciones dispares de la secta bajo el estandarte común de la lealtad a una causa".
 
