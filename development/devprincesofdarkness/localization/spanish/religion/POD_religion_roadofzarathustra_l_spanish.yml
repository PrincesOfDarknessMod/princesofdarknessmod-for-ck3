 #Zoroastrian-Group Faiths

 roadofagramainyu:0 "Camino de Angra Mainyu"
 roadofagramainyu_adj:0 "Camino de Angra Mainyu"
 roadofagramainyu_adherent:0 "Corruptor"
 roadofagramainyu_adherent_plural:0 "Corruptores"
 roadofagramainyu_desc:0 "Los zoroastrianos creen que - en deuda con el Angra Mainyu, el Hambre y la noche eterna - están malditos por el Angra Mainyu. Deben explorar este estado del ser y, una vez que comprendan plenamente el mal, elegir ser buenos y regresar a la gracia de Ahura Mazda. Por supuesto, no todos llegan hasta allí".

 roadofahuramazda:0 "Camino de Ahura Mazda"
 roadofahuramazda_adj:0 "Camino de Ahura Mazda"
 roadofahuramazda_adherent:0 "Penitente"
 roadofahuramazda_adherent_plural:0 "Penitentes"
 roadofahuramazda_desc:0 "El camino de la redención es a través de Ahura Mazda. Habiendo pasado por el mal de Angra Mainyu, eligen ser buenos y volver a la gracia de Ahura Mazda. La iniciada del Camino de Ahura Mazda se limpia ampliamente con agua".
 
 pathofdaena:0 "Camino de Daena"
 pathofdaena_adj:0 "Camino de Daena"
 pathofdaena_adherent:0 "Behdin"
 pathofdaena_adherent_plural:0 "Behdines"
 pathofdaena_desc:0 "La Senda de Daena enseña que los actos virtuosos y la adhesión a la ley y al deber aportan un gran poder personal. Al actuar de acuerdo con las leyes y el deber, serán recompensados con justicia. Las leyes proporcionan la estructura de una sociedad civil; rompe la ley, y la propia sociedad se rompe".
 cultofzilah:0 "Culto de Zilah"
 cultofzilah_adj:0 "Culto de Zilah"
 cultofzilah_adherent:0 "cultista"
 cultofzilah_adherent_plural:0 "cultistas"
 cultofzilah_desc:0 "Un grupo de [cainites|E] se centró alrededor del Maestro de las Lágrimas y su discípulo Anosh. Después del hallazgo de una piedra llorona en un valle perdido, el culto se convirtió en adorador del vampiro de segunda generación llamado Zilah. Ahora son enemigos de la tercera generación, que se rebelaron contra Caín y las órdenes de los chiquillos de Caín."
