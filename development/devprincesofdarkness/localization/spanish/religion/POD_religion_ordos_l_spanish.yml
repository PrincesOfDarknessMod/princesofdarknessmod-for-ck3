 ordos_religion_desc:0 "Los ordos eran cultos misteriosos de la Edad Media, cuyos miembros eran reclutados exclusivamente entre los vampiros del clan Malkavian. Los Ordos se dedicaban a descifrar las técnicas de adivinación de los Malkavian de antaño y a liberar el potencial de su locura para vencer a la Bestia. Estaban divididos por todo el Viejo Mundo en pequeños cultos, cada uno independiente y sólo identificable por sus métodos".
