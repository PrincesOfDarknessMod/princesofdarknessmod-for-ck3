 #Scholar-Group Faiths
 
 ordoaenigmatis:0 "Ordo Aenigmatis"
 ordoaenigmatis_adj:0 "Aenigmatis"
 ordoaenigmatis_adherent:0 "Mystai"
 ordoaenigmatis_adherent_plural:0 "Mystai"
 ordoaenigmatis_desc:0 "Este Ordo se ocupaba de los enigmas y los símbolos, desentrañando significados ocultos, descifrando mitos y leyendas para alcanzar el verdadero conocimiento sobre el mundo, sobre sí mismos y sobre la Bestia."
 
 ordosecstasis:0 "Ordo Ecstasis"
 ordosecstasis_adj:0 "Éxtasis"
 ordosecstasis_adherent:0 "Mystai"
 ordosecstasis_adherent_plural:0 "Mystai"
 ordosecstasis_desc:0 "Este Ordo se ocupaba de los trances y los frenesíes, buscando comunicarse con su Bestia para finalmente saciarla a través de extremos de placer y dolor."
 
 ordomaleficus:0 "Ordo Maleficus"
 ordomaleficus_adj:0 "Maleficus"
 ordomaleficus_adherent:0 "Mystai"
 ordomaleficus_adherent_plural:0 "Mystai"
 ordomaleficus_desc:0 "Pocas cosas se registran sobre este Ordo, salvo que eran infernalistas que buscaban mayores misterios con la ayuda de las Fuerzas del Más Allá."
 
 jocastian:0 "Jocastian"
 jocastian_adj:0 "Jocastian"
 jocastian_adherent:0 "Jocastian"
 jocastian_adherent_plural:0 "Jocastianos"
 jocastian_desc:0 "Una pequeña y oscura secta (y posiblemente una línea de sangre Malkavian) que se originó dentro del Sabbat como un culto noddista, pero que desde entonces se ha independizado. Aunque la mayoría de los jocastianos son Malkavian, también hay algunos Brujah y otros Kindred eruditos entre sus filas. Se dedican a desentrañar la verdadera historia de los Cainitas y son rivales de los Mnemosyne. Aunque algunos eruditos los consideran una línea de sangre debido a la práctica de que un maestro se deje diablerizar por un alumno para preservar el conocimiento que ha reunido, no son diferentes de su clan matriz".
 
 mnemosyne:0 "Mnemosyne"
 mnemosyne_adj:0 "Mnemosyne"
 mnemosyne_adherent:0 "Mnemosyne"
 mnemosyne_adherent_plural:0 "Mystai"
 mnemosyne_desc:0 "Los Mnemosyne, o Buscadores de la Memoria, son un culto de nodistas compuesto por eruditos de Malkavian; algunos sugieren que los Mnemosyne son en realidad una línea de sangre de los Malkavian. Su miembro más destacado es Aristóteles de Laurent. Los miembros del culto buscan el conocimiento de la historia de Kindred, y la mayoría de ellos siguen la Senda de Caine. El culto está en conflicto con los jocastatianos y, hasta hace poco, con el anciano Ventrue Bindusara. Sus miembros practican una forma de diablerismo; cuando un anciano cree que ha llegado su hora, permite que los Kindred más jóvenes lo diablericen para que su conocimiento pueda ser transmitido. Esta es la razón por la que el culto se denomina a veces línea de sangre. El culto lleva el nombre de la musa griega de la memoria".
 
 ordovaticinii:0 "Ordo Vaticinii"
 ordovaticinii_adj:0 "Vaticinii"
 ordovaticinii_adherent:0 "Mystai"
 ordovaticinii_adherent_plural:0 "Mystai"
 ordovaticinii_desc:0 "Este Ordo está obsesionado con las profecías de la Gehena".
 
 
