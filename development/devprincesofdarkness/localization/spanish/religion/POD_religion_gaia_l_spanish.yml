 blackfury:0 "Furia negra"
 blackfury_adj:0 "Furia"
 blackfury_adherent:0 "Furia"
 blackfury_adherent_plural:0 "Furias"
 blackfury_desc:0 "Las matriarcas de los Garou son las más cercanas al Wyld que la mayoría de las otras tribus, y son conocidas por su honor, sabiduría, orgullo y feroz destreza en la batalla.\NLas Furias veneran al Wyld como una fuerza de feminidad, de instinto en lugar de las abstracciones intelectuales de la Tejedora (y consideradas como masculinas por la Tribu). El Wyld es la fuerza que mantiene los ciclos de Gaia y Luna en movimiento y los complementa".

 bonegnawer:0 "Roedor de huesos"
 bonegnawer_adj:0 "Carnicero"
 bonegnawer_adherent:0 "Roedor de huesos"
 bonegnawer_adherent_plural:0 "Roedor de huesos"
 bonegnawer_desc:0 "Los carroñeros y supervivientes de los Garou, los Bone Gnawers son vistos por las otras tribus como poco más que mestizos que rebuscan entre los desechos de la humanidad. Los Roedores de Huesos se ven a sí mismos como desvalidos, esperando triunfar contra enemigos demasiado confiados."

 childofgaia:0 "Niño de Gaia"
 childofgaia_adj:0 "Niño"
 childofgaia_adherent:0 "Niño"
 childofgaia_adherent_plural:0 "Niño"
 childofgaia_desc:0 " Los guardianes de la paz de los Garou, los Niños trabajan por el entendimiento entre las tribus y esperan acabar formando todas las tribus en un frente unificado contra el Wyrm."

 fianna:0 "Fianna"
 fianna_adj:0 "Fianna"
 fianna_adherent:0 "Fianna"
 fianna_adherent_plural:0 "Fianna"
 fianna_desc:0 "Fuertemente basados en las tradiciones celtas y europeas, los fianna son conocidos entre los garou por su pasión por el placer de la vida, sus habilidades y ferocidad en la batalla, y como guardianes de la música, las historias y la sabiduría popular de los garou."

 getoffenris:0 "Get de Fenris"
 getoffenris_adj:0 "Get"
 getoffenris_adherent:0 "Fenrir"
 getoffenris_adherent_plural:0 "Fenrir"
 getoffenris_desc:0 " Guerreros feroces con poco espacio para la misericordia y la compasión, los Fenrir se ven a sí mismos como grandes héroes, pero son conocidos por escandalizar a otros Garou con sus formas violentas."
 warderofmen:0 "Guardián de los hombres"
 warderofmen_adj:0 "Guarda"
 warderofmen_adherent:0 "Guarda"
 warderofmen_adherent_plural:0 "Vigilantes"
 warderofmen_desc:0 "Empapados en la religión humana, y en el flujo y reflujo de la ciudad, los Warder of Men viven y mueren por un credo de progreso. Aunque temen el Apocalipsis como cualquier hombre lobo, creen que cada día que pasa les hace más fuertes, que cada nuevo invento puede ser apropiado para su causa, y que cada nueva filosofía puede fortalecer su determinación. En este sentido, son la quintaesencia de los Urrah y no tienen la fuerte aversión a las poblaciones humanas que tienen la mayoría de los Garou."

 redtalon:0 "Red Talon"
 redtalon_adj:0 "Rojo"
 redtalon_adherent:0 "Talon"
 redtalon_adherent_plural:0 "Talones"
 redtalon_desc:0 "Los Talones Rojos son la única tribu entre los Garou que es exclusivamente de naturaleza lupina (salvo unos pocos metis), rechazando completamente a la humanidad como una plaga en la Tierra. Los Talones cuentan que su tribu se formó directamente de Gaia y que ellos siguen siendo los Garou más puros que se mantienen en contacto con su forma original, incorruptos por la humanidad contaminada".
 
 shadowlord:0 "Señor de las Sombras"
 shadowlord_adj:0 "Sombra"
 shadowlord_adherent:0 "Señor de la Sombra"
 shadowlord_adherent_plural:0 "Señores de la sombra"
 shadowlord_desc:0 "Los políticos y manipuladores de los Garou, los Señores de la Sombra trabajan a través de sus estrictas jerarquías y formas secretas para arrebatar todo el poder que puedan."
 
 silentstrider:0 "Silent Strider"
 silentstrider_adj:0 "Silencioso"
 silentstrider_adherent:0 "Silent Strider"
 silentstrider_adherent_plural:0 "Silent Striders"
 silentstrider_desc:0 "Originarios de Egipto, los Trancos Silenciosos han sido maldecidos al exilio por el poderoso vampiro Set, y han estado huyendo desde entonces. Nómadas, introspectivos y altamente espirituales, los Trancos Silenciosos han sondeado las profundidades de la Umbra, quizás más profundamente que cualquier otra tribu de Garou."
 
 holy_order_wild_pack:0 "La manada salvaje"
 holy_order_worthy_ronins:0 "Los dignos Ronins"
 
 silverfang:0 "Colmillo de Plata"
 silverfang_adj:0 "Plata"
 silverfang_adherent:0 "Colmillo de Plata"
 silverfang_adherent_plural:0 "Colmillos de plata"
 silverfang_desc:0 "La 'Tribu Alfa' de la Nación Garou, los Colmillos Plateados son gobernantes tradicionales y líderes de guerra. Estos nobles Garou son conocidos por su belleza física, su valor y su honor. Desgraciadamente, muchos miembros jóvenes de la tribu sufren de extraños caprichos: despistes, alucinaciones leves, sonambulismo... nada abiertamente psicótico, pero sí perceptible".

 stargazer:0 "Stargazer"
 stargazer_adj:0 "Mirador de estrellas"
 stargazer_adherent:0 "Stargazer"
 stargazer_adherent_plural:0 "Observador de las estrellas"
 stargazer_desc:0 "Solitarios por naturaleza, los Stargazers son los más tranquilos e introvertidos de los Garou, así como la más pequeña de las tribus restantes. Siempre forasteros entre la Nación Garou, afirman ser descendientes de los seguidores de Klaital Starcatcher, un sabio del Este que predicaba la moderación y la armonía."

 
