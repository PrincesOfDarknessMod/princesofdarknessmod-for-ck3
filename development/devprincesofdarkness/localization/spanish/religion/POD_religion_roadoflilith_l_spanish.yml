 #Lilin-Group Faiths
 derechlilit:0 "Derech Lilit"
 derechlilit_adj:0 "Lilin"
 derechlilit_adherent:0 "Lilin"
 derechlilit_adherent_plural:0 "Lilin"
 derechlilit_desc:0 "El Camino de Lilith está dedicado a la figura rabínica Lilith, que aparece en múltiples fuentes noddistas así como en tradiciones llevadas a cabo por cultos ocultos. La mayoría de los cultos descomponen a Lilith en principios fundamentales: El dolor y la creación. Para crear, hay que herir y ser herido. Este es el principio fundamental de la vida misma".

 viafaciendi:0 "Via Faciendi"
 viafaciendi_adj:0 "Faciendi"
 viafaciendia_adherent:0 "Hacedor"
 viafaciendi_adherent_plural:0 "Hacedores"
 viafaciendi_desc:0 "La Senda de la Facienda se dedica a encontrar y propagar a los hijos-demonio de Lilith, inspirándose en la tradición bíblica de Lilith como Madre de los Monstruos."

 viaspinae:0 "Vía Spinae"
 viaspinae_adj:0 "Bahari"
 viaspinae_adherent:0 "Ba'ham"
 viaspinae_adherent_plural:0 "Bahari"
 viaspinae_desc:0 "El Camino de las Espinas se centra en el dolor físico. Los miembros estudian el dolor de forma lógica, buscando codificar los puntos de ruptura y las formas de romper el umbral de la víctima para hacerle ver la dolorosa verdad de Lilith."

 viacalantica:0 "Vía Calantica"
 viacalantica_adj:0 "Ki-sikil-lil-la-ke"
 viacalantica_adherent:0 "Ki-sikil-lil-la-ke"
 viacalantica_adherent_plural:0 "Ki-sikil-lil-la-ke"
 viacalantica_desc:0 "La Senda de los Velos se centra en Lilith como rebelde y contrafigura tanto del Dios Abrahámico como de Caine. Son los más virulentos de los Lilin, a menudo más guerreros que eruditos."

 holy_order_bahari:0 "Los Bahari"
 holy_order_faithful_of_the_dark_mother:0 "Fieles de la Madre Oscura"
 holy_order_lhaka:0 "Los Lhaka"

