 #Seeker-Group Faiths
 viamutationis:0 "Via Mutationis"
 viamutationis_adj:0 "Koldun"
 viamutationis_adherent:0 "Buscador"
 viamutationis_adherent_plural:0 "Buscadores"
 viamutationis_desc:0 "Los seguidores de la Vía de la Metamorfosis utilizan el conocimiento no para los demás, sino para sí mismos. Los que se convierten en Buscadores viven vidas solitarias e introvertidas mientras descubren sus propias capacidades. Se basan en acertijos y fragmentos de información, y suelen dar respuestas similares a cambio."

 pathoftheflesh:0 "Camino de la carne"
 pathoftheflesh_adj:0 "Koldun"
 pathoftheflesh_adherent:0 "Buscador de la carne"
 pathoftheflesh_adherent_plural:0 "Buscadores de carne"
 pathoftheflesh_desc:0 "El verdadero objetivo del camino es totalmente físico. La transformación corporal que lleva a la adquisición de un vasto poder en el mundo material. Lo espiritual sólo se considera importante cuando ayuda a esta transformación física."

 pathofthespirit:0 "Camino del Espíritu"
 pathofthespirit_adj:0 "Koldun"
 pathofthespirit_adherent:0 "Buscador del Espíritu"
 pathofthespirit_adherent_plural:0 "Buscadores del Espíritu"
 pathofthespirit_desc:0 "El verdadero objetivo del camino es una transformación totalmente espiritual. Ven el mundo físico como una ilusión y una distracción, en el mejor de los casos una simple herramienta para el crecimiento espiritual."
 
 viaapotheosis:0 "Vía apoteósica"
 viaapotheosis_adj:0 "Apoteosis"
 viaapotheosis_adherent:0 "Apoteósico"
 viaapotheosis_adherent_plural:0 "Apoteósicos"
 viaapotheosist_desc:0 "Los adeptos se esfuerzan por trascender sus limitaciones biológicas, mejorando sus capacidades mentales y físicas hasta que son indistinguibles de la divinidad. Los rituales competitivos implican rebajarse y aprender de los superiores a cambio de sacrificios de sangre. La vicisitud es la disciplina más comúnmente empleada en la búsqueda (in)vitalicia de la perfección, aunque se anima a los practicantes a utilizar casi todos los poderes disponibles para alcanzar sus objetivos idealistas y egoístas (incluso pactos demoníacos y diablerías)."
 viaapotheosis_religious_head_title:0 "Dios-Rey"
