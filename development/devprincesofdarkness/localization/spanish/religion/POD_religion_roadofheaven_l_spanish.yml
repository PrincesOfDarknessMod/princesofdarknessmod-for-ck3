 #Noddist-Group Faiths
 
 viacaeli:0 "Vía Caeli"
 viacaeli_adj:0 "Noddista"
 viacaeli_adherent:0 "Noddista"
 viacaeli_adherent_plural:0 "Noddistas"
 viacaeli_desc:0 "Según el Evangelio de Laodice, un texto sagrado cainita, los principios de algunas Vías Caeli provienen del propio Caine. Aunque Caine fue maldecido por Dios, también estaba más cerca de Dios que cualquier otro pariente que haya existido. Los seguidores de la Vía del Cielo intentan controlar a su Bestia mediante la devoción religiosa".

 viadivinitatis:0 "Vía Divinitatis"
 viadivinitatis_adj:0 "Divinista"
 viadivinitatis_adherent:0 "Divinista"
 viadivinitatis_adherent_plural:0 "Divinistas"
 viadivinitatis_desc:0 "Los fanáticos de los noddistas y predecesores del Sabbat, los seguidores de esta Vía se consideran favorecidos por Dios en lugar de malditos por Él, los seguidores de la Divinidad buscan el control sobre los mortales y apelan al mayor número posible de cainitas para que se unan a la Vía Caeli. Esta Vía es considerada por muchos como la más desviada de las cuatro".

 viapenaculum:0 "Vía Penaculum"
 viapenaculum_adj:0 "Penaculum"
 viapenaculum_adherent:0 "Penitente"
 viapenaculum_adherent_plural:0 "Penitentes"
 viapenaculum_desc:0 "Los Fieles que siguen el Camino de la Penitencia se consideran indignos de Dios, la más baja de las criaturas humildes a sus ojos. Ningún camino se toma tan en serio los actos de contrición, pues es la única forma que ven estos cainitas de obtener la iluminación y el favor a los ojos de Dios."

 viavindicta:0 "Vía Vindicta"
 viavindicta_adj:0 "Vindicta"
 viavindicta_adherent:0 "Cruzado"
 viavindicta_adherent_plural:0 "Cruzados"
 viavindicta_desc:0 "Esta parentela se considera la Mano iracunda de Dios, que destruye a los que le han ofendido. Cualquiera que se considere malvado o infiel a Dios debe ser destruido. Suelen cazar a los cainitas a los que consideran corruptos".

 viadolorosa:0 "Vía Dolorosa"
 viadolorosa_adj:0 "Dolorosa"
 viadolorosa_adherent:0 "Mártir"
 viadolorosa_adherent_plural:0 "Mártires"
 viadolorosa_desc:0 "Los mártires de Sendero de Lágrimas, estos noddistas se ofrecen como sacrificios no muertos para que otros no tengan que sufrir. Se sacrifican voluntariamente para detener cualquier corrupción causada por cualquier cosa considerada impía, especialmente demonios u otros cainitas."

 viachristi:0 "Vía Christi"
 viachristi_adj:0 "Cristiana"
 viachristi_adherent:0 "Cristiano"
 viachristi_adherent_plural:0 "Cristianos"
 viachristi_desc:0 "Los cainitas que fueron cristianos en vida pueden elegir adherirse a la Senda de Cristo, bajo el supuesto de que el plan de Dios para el mundo incluye a los vampiros, y permanecer obedientes a su voluntad les ayudará a controlar a la Bestia."
 
 derechchaim:0 "Derech Chaim"
 derechchaim_adj:0 "Derech Chaim"
 derechchaim_adherent:0 "Estries"
 derechchaim_adherent_plural:0 "Estrie"
 derechchaim_desc:0 "Los cainitas que fueron judíos en vida pueden elegir seguir el Camino de la Vida. Creen que HaShem creó a los vampiros junto con el resto del mundo, por lo que las leyes de la Torá siguen aplicándose a ellos y proporcionan medios para controlar a la Bestia."
 
 codeofsamiel:0 "Código de Samiel"
 codeofsamiel_adj:0 "Samielita"
 codeofsamiel_adherent:0 "Samielitas"
 codeofsamiel_adj:0 "Samielitas"
 codeofsamiel_adherent_plural:0 "Samielita"
 codeofsamiel_desc:0 "El más grande de la línea guerrera de Saulot, el fundador martirizado Samiel se cree que escribió este camino con su propia mano. Según la leyenda, Samiel recibió los principios básicos de honor e ira de la vía durante una visita de Miguel, comandante de las Huestes Celestiales, mientras Saulot estaba ausente."

 viaarchangeli:0 "Via Archangeli"
 viaarchangeli_adj:0 "Nephilim"
 viaarchangeli_adherent:0 "Nephilim"
 viaarchangeli_adherent_plural:0 "Nephilim"
 viaarchangeli_desc:0 "Seguir los pasos de Miguel significa actuar como musa y pastor de todos, y como mártir cuando sea necesario. Como adherentes a la Vía del Cielo, los Fieles del Arcángel ven a Miguel como el Cristo resucitado de los condenados y creen que los vampiros deben actuar como ángeles ante su rebaño mortal."
 
