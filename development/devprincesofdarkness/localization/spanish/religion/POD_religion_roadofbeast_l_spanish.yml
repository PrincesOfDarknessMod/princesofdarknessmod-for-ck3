 #Feral-Group Faiths
 viabestiae:0 "Vía Bestiae"
 viabestiae_adj:0 "Feral"
 viabestiae_adherent:0 "Feral"
 viabestiae_adherent_plural:0 "Ferales"
 viabestiae_desc:0 "Los seguidores del Camino de la Bestia controlan a su Bestia mediante los conceptos primarios de supervivencia, fuerza e individualidad. Muchos miembros de la Vía de la Bestia eligen una existencia simple y animal para servir mejor a las creencias de la Vía Bestiae, mientras que otros la siguen viviendo una existencia simplista, afín a los bárbaros. "

 viapraedator:0 "Via Praedator"
 viapraedator_adj:0 "Depredador"
 viapraedator_adherent:0 "Cazador"
 viapraedator_adj:0 "Cazador"
 viapraedator_adherent_plural:0 "Cazador"
 viapraedator_desc:0 "Los ferales que siguen la Senda del Cazador existen para depredar a los que consideran inferiores a ellos. Hacer lo contrario es una blasfemia. También utilizan su Bestia como herramienta para llevar a cabo sus cacerías."

 viaerronis:0 "Via Erronis"
 viaerronis_adj:0 "Vagabundo"
 viaerronis_adherent:0 "Vagabundo"
 viaerronis_adherent_plural:0 "Vagabundos"
 viaerronis_desc:0 "Para estos ferales que siguen la Senda del Nómada, la civilización y todo lo que se asocia a ella es un anatema. Viajan ligeros, y viajan siempre. También se le ha llamado la Senda de los Viajes".

 viaferitas:0 "Vía Feritas"
 viaferitas_adj:0 "Salvaje"
 viaferitas_adherent:0 "Salvaje"
 viaferitas_adherent_plural:0 "Salvajes"
 viaferitas_desc:0 "Los Ferales de la Senda del Salvaje son los más propensos a desatar a la Bestia en ataques de ira. Su furia se dirige hacia todo lo que consideran débil, especialmente la civilización. Golpean a menudo, y golpean con fuerza".

 viavenatorumbra:0 "Vía Venator Umbra"
 viavenatorumbra_adj:0 "Venator Umbra"
 viavenatorumbra_adherent:0 "Cazador Gris"
 viavenatorumbra_adherent_plural:0 "Cazador Gris"
 viavenatorumbra_desc:0 "Si hay algún Feral que no aborrezca el concepto de civilización, son estos que siguen la Senda del Cazador Gris. Más bien, ven los pueblos y las ciudades como una forma diferente de coto de caza. Son los más civilizados de los Ferales, pero no te equivoques, ya que no son menos capaces de cazar que los demás."
 
 vialiberatio:0 "Vía Liberatio"
 vialiberatio_adj:0 "Liberatio"
 vialiberatio_adherent:0 "Liberador"
 vialiberatio_adherent_plural:0 "Libertadores"
 vialiberatio_desc:0 "A menudo confundidos con los Furores, los Ferales de la Vía Liberatio ven las ciudades como una trampa y la muerte del alma. Consideran que su deber es liberar a las personas atrapadas hacia un modo de vida más puro y primitivo."

 viaeinherjar:0 "Einherjar"
 viaeinherjar_adj:0 "Einherjar"
 viaeinherjar_adherent:0 "Einherjar"
 viaeinherjar_adherent_plural:0 "Einherjar"
 viaeinherjar_desc:0 "Un camino que se practica entre los vampiros nórdicos y que sirve como recordatorio de la antigua ética que les dio el Padre Todo. El Camino enseña la responsabilidad, el valor ante la adversidad y la iniciativa individual. Muchos ahuyentan a la Bestia con actos de disciplina y coraje férreos, como observar la salida del sol. La mayoría de los seguidores del Camino son irrespetuosos, egoístas y maltratan físicamente a quienes no respetan. A menudo, incluso las personas a las que sí respetan son tratadas sólo un poco mejor".
 
 viayasaq:0 "Yasaq"
 viayasaq_adj:0 "Yasa"
 viayasaq_adherent:0 "Anda"
 viayasaq_adherent_plural:0 "Anda"
 viayasaq_desc:0 "Camino de los vampiros de la Estepa, concretamente de los Anda. Recordaba muchas de las tradiciones de los yasa (hermandades de guerreros) entre los mongoles. Los seguidores de la Ruta de los yasa eran llamados bárbaros entre los occidentales".
 
 pathofnoiad:0 "Camino de la Yasa"
 pathofnoiad_adj:0 "Noiad"
 pathofnoiad_adherent:0 "Noiad"
 pathofnoiad_adherent_plural:0 "Noiads"
 pathofnoiad_desc:0 "El origen de las Noiads ha sido olvidado por cainitas y mortales. En la mente de los noiads, siempre habitaron en el Norte, guiando y protegiendo a las tribus sami del norte de Escandinavia. Las Noiads se creían seres divinos, enviados por los dioses para guiar y proteger a su pueblo elegido de las amenazas sobrenaturales y mundanas, además de interpretar los presagios de los dioses en las guovssahas. La relación entre los noiads y su tribu era en cierto modo simbiótica: el noiad protegía a la tribu de los enemigos y actuaba como guía, chamán y maestro para ellos, mientras que la tribu daba voluntariamente su sangre y daba cobijo al noiad durante los largos meses sin oscuridad. En épocas de hambruna, los noiad hacían desaparecer a los miembros de la tribu para asegurar su supervivencia. Los Noiad vivían abiertamente entre los sámi, y Abrazaban exclusivamente a esta población. Los seleccionados para el Abrazo solían ser aquellos con talento para la adivinación, así como para la interpretación de los sueños y las estrellas. Los Noiad también observaban a los niños descendientes de familias que incluían al menos un vampiro, buscando los rasgos que ellos favorecían. "
 
