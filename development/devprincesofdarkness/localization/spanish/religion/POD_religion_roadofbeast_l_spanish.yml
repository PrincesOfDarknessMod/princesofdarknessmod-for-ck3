 viatantabus_desc:0 "Vampiros que siguen a la todopoderosa Baba Yaga, la Bruja de Rusia. El único Nosferatu que ha desafiado a su monstruoso progenitor, la Abuela es a la vez admirada y vilipendiada por igual por su [Clan|E]."
