 #Sinner-Group Faiths
 viapeccati:0 "Vía Peccati"
 viapeccati_adj:0 "Peccati"
 viapeccati_adherent:0 "Pecador"
 viapeccati_adherent_plural:0 "Pecadores"
 viapeccati_desc:0 "Los seguidores de la Vía Peccati controlan a su Bestia complaciendo sus caprichos y deseos, sin importar a quién perjudiquen. No hacer lo que les plazca empeora su condición, lo que significa que la moral, la ética y las leyes suelen quedarse en el camino mientras recorren esta Vía. Los seguidores de la Vía Peccati no son malvados per se; sólo completamente autoindulgentes".

 viavoluptuous:0 "Via Voluptarius"
 viavoluptuous_adj:0 "Voluptarius"
 viavoluptuous_adherent:0 "Voluptuarios"
 viavoluptuous_adherent_plural:0 "Voluptuarios"
 viavoluptuous_desc:0 "Los pecadores del Camino del Placer son los más hedonistas de los que siguen el Camino del Pecado. Para ellos, el placer lo es todo en lo que respecta a su existencia, y absolutamente nada es tabú."

 viacrudelitas:0 "Vía Crudelitas"
 viacrudelitas_adj:0 "Crudelitas"
 viacrudelitas_adherent_plural:0 "Cruel"
 viacrudelitas_adherent:0 "Sin corazón"
 viacrudelitass_adherent_plural:0 "Sin corazón"
 viacrudelitas_desc:0 "Los seguidores de la Senda de la Crueldad son los más cínicos y odiosos de los Pecadores. Con una filosofía de "hazles daño antes de que te hagan daño", los Pecadores no creen en la misericordia, la compasión o la piedad. Más bien, su único placer se deriva del dolor de los demás".

 viaadversarius:0 "Via Adversarius"
 viaadversarius_adj:0 "Adversarius"
 viaadversarius_adherent:0 "Adversario"
 viaadversarius_adherent_plural:0 "Adversarios"
 viaadversarius_desc:0 "La 'Vía del Diablo' no debe confundirse con la llamada Vía Diabolis, estos Pecadores trabajan para no ser manipulados. Los últimos fanáticos del control, llegarán a extremos para proteger su libre albedrío e, inusualmente, el de los demás. Muchos los consideran los más "agradables" de los Pecadores".

 viadiabolis:0 "Vía Diabolis"
 viadiabolis_adj:0 "Diabolis"
 viadiabolis_adherent:0 "Diablo"
 viadiabolis_adherent_plural:0 "Diablos"
 viadiabolis_desc:0 "Al ser un camino intrínsecamente destructivo, la Vía Diabolis no se considera una senda que deba tomarse a la ligera; quienes se atreven a seguirla se entregan a todo tipo de libertinaje y destrucción. Muchos no son realmente malvados en sí mismos, sino que creen que una no-vida virtuosa es una búsqueda infructuosa. Sin embargo, algunos se tomaron en serio el papel de demonio, e incluso se llamaron a sí mismos demonios encarnados y siervos de Satanás. Los Baali, en particular, se asocian con la Vía Diabolis".

 viaprometheus:0 "Vía Prometeo"
 viaprometheus_adj:0 "Prometeo"
 viaprometheus_adherent:0 "Prometeo"
 viaprometheus_adherent_plural:0 "Prometeo"
 viaprometheus_desc:0 "También llamados Firebringers, son una secta de Cainitas que sueñan con recrear Cartago y la armonía de Kindred y Kine asociada a ella. Como es lógico, muchos miembros son Brujah. Como muchos miembros de los Altos Clanes consideran estas visiones como una traición, los Prometeos se ven obligados a actuar de forma encubierta."
 
 viafurores:0 "Via Furores"
 viafurores_adj:0 "Furores"
 viafurores_adherent:0 "Furores"
 viafurores_adherent_plural:0 "Furores"
 viafurores_desc:0 "Los miembros de esta secta tienen fama de ser los proscritos de los cainitas. Condenados por la mayoría de los príncipes como ladrones y alborotadores, existen en los márgenes de la sociedad vampírica, arañando una magra existencia como sus homólogos mortales. Los Furores son considerados caóticos, pero pueden reunir un nivel de pasión por su causa que no se ve en ningún otro lugar de la sociedad cainita".

 viaquiritare:0 "Via Quiritare"
 viaquiritare_adj:0 "Quiritare"
 viaquiritare_adherent:0 "Gritón"
 viaquiritare_adherent_plural:0 "Gritones"
 viaquiritare_desc:0 "Los más locos de los Pecadores y los opuestos de Via Adversarius, los seguidores de la Senda de los Gritos creen que, como ya están condenados, también son ya presa de la Bestia, y por tanto se dejan manipular por ella para cumplir sus órdenes. Son esencialmente ejemplos andantes del Infierno en la Tierra; incluso otros Pecadores se resisten a asociarse con estos locos".
 
 tariqelshaitan:0 "Tariq el-Shaitan"
 tariqelshaitan_adj:0 "Shaitán"
 tariqelshaitan_adherent:0 "Shaitán"
 tariqelshaitan_adherent_plural:0 "Shaitán"
 tariqelshaitan_desc:0 "El camino del diablo en el mundo islámico. Cazados casi hasta la extinción por los guerreros de los clanes Salubri y Assamita, estos monstruos han aprendido desde entonces a jugar a largo plazo."
 
 pathoftheeightfoldwheel:0 "Camino de la Rueda Óctuple"
 pathoftheeightfoldwheel_adj:0 "Druida"
 pathoftheeightfoldwheel_adherent:0 "Druida"
 pathoftheeightfoldwheel_adherent_plural:0 "Druidas"
 pathoftheeightfoldwheel_desc:0 "La Senda de la Óctuple Rueda se inspira en el paganismo celta, con especial atención al druidismo. Dan gran importancia a honrar a los dioses y espíritus de la naturaleza, a servir al equilibrio en todas las cosas y a un calendario rotativo de festivales con base astronómica."
 
 pathofwatchfulgods:0 "Via Deorum Vigilans"
 pathofwatchfulgods_adj:0 "Vaticinador"
 pathofwatchfulgods_adherent:0 "Vaticinador"
 pathofwatchfulgods_adherent_plural:0 "Vaticinadores"
 pathofwatchfulgods_desc:0 "La Senda de los Dioses Vigilantes venera el panteón pagano de los antiguos griegos y romanos, aunque panteones de diferente tradición pagana también se orientan en la Senda. Los vampiros de esta senda se dedican a servir a los dioses mediante la realización de sacrificios regulares, honrando y protegiendo lo que los dioses consideran sagrado, y adhiriéndose a estrictos códigos de honor."

 viahyron:0 "Vía Hyron"
 viahyron_adj:0 "Abelene"
 viahyron_adherent:0 "Abelene"
 viahyron_adherent_plural:0 "Abelenes"
 viahyron_desc:0 "El Camino de la Colmena es seguido casi exclusivamente por los baali de la Orden de Moloch. La Vía predica la lealtad total a la línea de sangre en su conjunto y a su sire en particular. La razón principal es que las Grandes Obras que los Baali quieren conseguir no pueden ser reivindicadas en solitario o cuando interfieren en el trabajo de otros. El vampiro tuvo que dejar que las voces del Enjambre entraran en su alma para comprender los sueños de los seres de la Oscuridad Exterior y mantenerlos dormidos. Aparte de eso, la mayoría de los demás vampiros destruirían activamente a un Baali si fuera lo suficientemente tonto como para revelarse como adepto".
 
 viatartaros:0 "Vía Tártaros"
 viatartaros_adj:0 "Vía Tártaros"
 viatartaros_adherent:0 "Tártarosin"
 viatartaros_adherent_plural:0 "Tártarosi"
 viatartaros_desc:0 "Cuidado, aquí hay demonios. Las llaves de nuestras prisiones de carne y hueso no pueden encontrarse sólo a través del estudio y la experimentación; en cambio, debemos buscar, es más, tomar, ese conocimiento que poseen aquellos que están más allá del umbral del mundo. Internalistas nos llamarían algunos, si conocieran nuestra verdadera intención, para ascender más allá de la prisión en la que hemos nacido dos veces. Este camino es oscuro y está lleno de peligros, y la única luz que podemos encontrar es un terrible resplandor penetrante, que amenaza con quemar nuestra carne y desangrar nuestro propio espíritu."

 holy_order_the_sinful:0 "Los pecadores"
 holy_order_order_of_pustula:0 "Orden de la Pústula"
 holy_order_brothers_of_the_black_mountain:0 "Hermanos de la Montaña Negra"
 holy_order_legio_peccati:0 "Legio Peccati"
 holy_order_order_of_aconia_messalina:0 "Orden de la Exquisita Aconia"
 holy_order_the_voluptuaries:0 "Las Voluptuarias"
 holy_order_daughters_of_venus:0 "Hijas de Venus"
 holy_order_the_heartless:0 "Los sin corazón"
 holy_order_the_adversaries:0 "Los adversarios"
 holy_order_the_firebringers:0 "Los que abren fuego"
 holy_order_the_outlaws:0 "Los forajidos"
 holy_order_the_screamers:0 "Los Gritones"
 holy_order_order_of_abelenes:0 "Orden de Abelene"
 holy_order_order_of_iblis:0 "Orden de Ibilis"
 holy_order_cult_of_augurs:0 "Culto de los Augures"
 deimosianism:0 "deimosianismo"
 deimosianism_adj:0 "deimosianismo"
 deimosianism_adherent:0 "deimosiano"
 deimosianism_adherent_plural:0 "deimosiano"
 deimosianism_desc:0 "Los vampiros son la encarnación de los miedos primarios de la humanidad. Como tales, deben revelar en su condición. Quizás la humanidad sea lo suficientemente fuerte como para conquistar sus miedos algún día. Hasta entonces, los deimosianos corren libres."
 holy_order_order_of_vaticinators:0 "Orden de los Vaticinadores"
 servitorsofirad:0 "Servidores de Irad"
 servitorsofirad_adj:0 "Servidor"
 servitorsofirad_adherent:0 "servidor"
 servitorsofirad_adherent_plural:0 "Servidores"
 servitorsofirad_desc:0 "Secuaces autoproclamados de los [antediluvians|E], los Servidores de Irad no buscan nada más que guerras interminables y derramamiento de sangre. El planeta estará empapado de sangre y ellos estarán a la vanguardia todo el tiempo."

 baobhansith:0 "Baobhan Sith"
 baobhansith_adj:0 "Baobhan Sith"
 baobhansith_adherent:0 "Baobhan Sith"
 baobhansith_adherent_plural:0 "Baobhan Sith"
 baobhansith_desc:0 "Esta religión no canónica ha sido encargada por un mecenas.\n\nLos Baobhan Sith abrazan el legado de su fundadora, Aisling Leanhaun, cuyas primeras comidas inspiraron la leyenda de los Baobhan Sith en las Tierras Altas de Escocia. Fascinados por el mito de los vampiros fae seductores y asesinos, los adherentes encajan en ese molde para mantener viva la leyenda."
 holy_order_host_of_the_broken_heart:0 "Anfitrión del Corazón Roto"
 holy_order_host_of_the_unseelie:0 "Anfitrión de los Unseelie"






