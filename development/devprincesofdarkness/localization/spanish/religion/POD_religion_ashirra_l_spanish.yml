 ashirra_religion_desc:0 "La Ashirra (de ashira, "clan" en árabe) es la secta bajo la cual los vampiros islámicos declaran su fe en Alá, y que gobierna en Arabia y el norte de África, desde la Edad Media. Los miembros de la Ashirra creen que la redención de los Kindred estaba entre las promesas que hizo Mahoma si elegían seguir a Alá."
