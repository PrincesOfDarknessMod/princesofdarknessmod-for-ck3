 #Ashirra-Group Faiths
 tariqelumma:0 "Tariq el-Umma"
 tariqelumma_adj:0 "Ashirra"
 tariqelumma_adherent:0 "Ashirra"
 tariqelumma_adherent_plural:0 "Ashirra"
 tariqelumma_desc:0 "El Camino de la Humanidad para los islámicos varía poco de su homólogo occidental. Ambas partes se comunican a menudo y comparten experiencias entre sí".

 tariqelsama:0 "Tariq el-Sama"
 tariqelsama_adj:0 "Sama"
 tariqelsama_adherent:0 "el-Sama"
 tariqelsama_adherent_plural:0 "el-Sama"
 tariqelsama_desc:0 "Los cainitas que fueron musulmanes en vida pueden elegir adherirse a esta Senda bajo el supuesto de que el plan de Alá para el mundo incluye a los vampiros. Con la esperanza de que la obediencia continuada a Su voluntad les ayude a controlar a la Bestia".

 tariqelharb:0 "Tariq el-Harb"
 tariqelharb_adj:0 "Harb"
 tariqelharb_adherent:0 "el-Harb"
 tariqelharb_adherent_plural:0 "el-Harb"
 tariqelharb_desc:0 "El camino de los reyes de la familia islámica. Como hay pocos Ventrue en el mundo musulmán, esta vía está menos extendida que la Via Regalis en Occidente. Aun así, muchos sultanes y emires disfrutan de la exaltación del poder que procura."

 tariqelbedouin:0 "Tariq el-Bedouin"
 tariqelbedouin_adj:0 "Bedouin"
 tariqelbedouin_adherent:0 "el-Bedouin"
 tariqelbedouin_adherent_plural:0 "el-Bedouin"
 tariqelbedouin_desc:0 "El camino de la bestia de la familia islámica. Zayyat, el fundador de Tariq el-Bedouin y amigo íntimo de los líderes del Califato de Ashirra, fue la causa de que esta vía estuviera estrechamente vinculada a la civilización. Contrastándola con su homóloga occidental".
 
 tariqealaam:0 "Tariq El-Alaam"
 tariqealaam_adj:0 "Shuhada"
 tariqealaam_adherent:0 "Al-shuhada"
 tariqealaam_adherent_plural:0 "Al-Shuhada"
 tariqealaam_desc:0 "Al-Shuhada de los Ashirra, estos mártires se ofrecen como sacrificios no muertos para que otros no tengan que sufrir. Se sacrifican voluntariamente para detener la corrupción causada por cualquier cosa considerada impía, especialmente los demonios u otros cainitas."
 sheperdsofislam:0 "pastores del islam"
 sheperdsofislam_adj:0 "pastores"
 sheperdsofislam_adherent:0 "Testigo"
 sheperdsofislam_adherent_plural:0 "Testigos"
 sheperdsofislam_desc:0 "Una parte pequeña pero muy activa del movimiento [ashirra|E], los pastores se encargaron de proteger a las figuras clave del mundo [cainite|E]. Muchas de estas figuras ni siquiera conocen a sus misteriosos protectores. A menudo han entrado en conflicto con los Setitas de Egipto que obstaculizan sus esfuerzos en su región natal."
 
 
