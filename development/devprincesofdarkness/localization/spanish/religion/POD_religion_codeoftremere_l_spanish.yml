 #Warlock-Group Faiths
 tremerecode:0 "Código de los Tremere"
 tremerecode_adj:0 "Código de los Tremere"
 tremerecode_adherent:0 "Brujo"
 tremerecode_adherent_plural:0 "Brujos"
 tremerecode_desc:0 "El Código de los Tremere marca al clan como único entre los Cainitas; ningún otro grupo se adhiere a un conjunto unificado de reglas que delineen el comportamiento aceptable. No hay magia que obligue a ningún Tremere a cumplir el juramento, a menos que algún severo Regente decida activamente hacerlo cumplir; en cambio, el código es una lista de facto de lo que constituye un comportamiento aceptable para un miembro de la augusta Casa de Tremere. El código detalla lo que se espera de los Tremere, y qué actividades se ganan el descrédito".

