l_spanish: 

# Vampire Doctrines

 burning_faith_name:0 "Fe ardiente"
 burning_faith_doctrine_name:0 "Guerreros de Mitra"
 burning_faith_doctrine_desc:0 "Como guerreros del Sol Invicto, debemos ser tan formidables como Él. El mundo de la noche verá por fin la luz del Sol".
 undead_aesir_name:0 "Undead Aesir"
 undead_aesir_doctrine_name:0 "Einherjar rejuvenecido"
 undead_aesir_doctrine_desc:0 "Los guerreros de Caharl están hambrientos de gloria y batalla, y son temidos con razón por los débiles cainitas."
 restored_republic_name:0 "República restaurada"
 restored_republic_doctrine_name:0 "Senado en sesión"
 restored_republic_doctrine_desc:0 "Para ser una institución cainita, el Senado es sorprendentemente abierto. Pero no menos estresante y sangrienta que otras".
 senatorial_clans_name:0 "Amigos de la República"
 senatorial_clans_doctrine_name:0 "Clanes senatoriales"
 senatorial_clans_doctrine_desc:0 "El Senado no ha olvidado la traición de Miguel de Constantinopla o Cartago. Sus decadentes "Clanes" no son bienvenidos en los sagrados salones del Senado".
 vengeful_carthage_name:0 "Cartago vengativo"
 vengeful_carthage_doctrine_name:0 "Utopía despiadada"
 vengeful_carthage_doctrine_desc:0 "Cartago tiene generaciones de agravios por reparar. En la sangre de los romanos traidores preferentemente".
 broken_hope_name:0 "Esperanza rota"
 broken_hope_doctrine_name:0 "Utopía fracasada"
 broken_hope_doctrine_desc:0 "Nueva Cartago es sólo una herramienta política sin alma. El espíritu de los verdaderos prometeos ha sido aplastado por esta nueva derrota."
 secure_anda_name:0 "Asegura Anda"
 secure_anda_doctrine_name:0 "Gestionar un imperio"
 secure_anda_doctrine_desc:0 "De hábiles belicistas, los Anda también se convirtieron en hábiles estadistas, utilizando la tolerancia religiosa de sus parientes mongoles como base."
 crimsom_curia_name:0 "Crimsom Curia"
 crimsom_curia_doctrine_name:0 "Sede restaurada de Nod"
 crimsom_curia_doctrine_desc:0 "El restaurado consejo eclesiástico de la Iglesia del Tercer Caine se ocupa de los asuntos cotidianos... pero también pide la expansión del dominio de la Iglesia antes de la llegada del Salvador."
 militarized_experiments_name:0 "Taller de los Horrores"
 militarized_experiments_doctrine_name:0 "Experimentos militarizados"
 militarized_experiments_doctrine_desc:0 "Los horrores retorcidos y las abominaciones se utilizan ahora de forma aún más rutinaria por el clan Tzimisce como tropas de choque."
 warden_network_name:0 "Red de guardianes"
 warden_network_doctrine_name:0 "Ojos y oídos"
 warden_network_doctrine_desc:0 "La Orden de Moloch está más unificada que nunca, lo que garantiza que cualquier guardián pueda encontrar ayuda en cualquier lugar."
 knights_acre_name:0 "Caballeros de Acre"
 knights_acre_doctrine_name:0 "Espada de Dios preparada"
 knights_acre_doctrine_desc:0 "Los valientes Caballeros están totalmente comprometidos con el propósito de la Inquisición ahora, listos para desatar la furia sagrada sobre los engendros del infierno."
 oculi_dei_name:0 "Oculi Dei"
 oculi_dei_doctrine_name:0 "Ojos vigilantes"
 oculi_dei_doctrine_desc:0 "El Oculi Dei ha refrenado a sus miembros más paranoicos, lo que lo convierte en una baza aún más formidable contra el Mal."
 sisters_stjohn_name:0 "Hermanas de San Juan"
 sisters_stjohn_doctrine_name:0 "Cuidado piadoso"
 sisters_stjohn_doctrine_desc:0 "Las Hermanas son el corazón de la Inquisición, la roca misma que la sostiene a través de la oscuridad rastrera."
 red_order_name:0 "Orden Roja"
 red_order_doctrine_name:0 "Guardianes cuidadosos"
 red_order_doctrine_desc:0 "La Orden Roja es la guardiana de los secretos de la Inquisición. Y sólo liberan sus conocimientos con la máxima precaución".
 von_murnau_name:0 "Casa von Murnau"
 von_murnau_doctrine_name:0 "Sabuesos de Dios"
 von_murnau_doctrine_desc:0 "La familia alemana está plenamente comprometida con la causa de la Inquisición, aportando sus considerables recursos."
 great_awakening_name:0 "Gran Despertar"
 great_awakening_doctrine_name:0 "Gran Despertar"
 great_awakening_doctrine_desc:0 "Durante mucho tiempo los Desamparados de Calomena han luchado por transmitir a las masas la verdad que les ha sido revelada, pero ya no luchan más. Dondequiera que prediquen el pueblo escucha y sigue".
                     
