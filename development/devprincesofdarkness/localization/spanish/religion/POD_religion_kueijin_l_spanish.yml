 #Kuei-jin Group Faiths

 faceofthegods:0 "Rostro de los dioses"
 faceofthegods_adj:0 "Cara de los dioses" 
 faceofthegods_adherent:0 "Godling" 
 faceofthegods_adherent_plural:0 "Godlings"
 faceofthegods_desc:0 "Posiblemente la herejía más extrema, los Face of the Gods afirman que los Wan Kuei son dioses exiliados. Establecen sus propios cultos con adoradores y extraen el chi de la oración.."

 flameoftherisingphoenix:0 "Llama del Fénix Naciente"
 flameoftherisingphoenix_adj:0 "Rising"  
 flameoftherisingphoenix_adj:0 "Fénix"
 flameoftherisingphoenix_adherent_plural:0 "Fénix"
 flameoftherisingphoenix_desc:0 "El dharma de la Llama del Fénix Naciente sostiene que el propósito del Segundo Aliento es restituir los crímenes de la propia vida. El dharma se caracteriza por que sus miembros fracasan (u ocasionalmente desaparecen) después de un corto período de tiempo."

 deviltiger:0 "Aullido del tigre diabólico"
 deviltiger_adj:0 "Ardiente"  
 deviltiger_adherent:0 "Tigre"
 deviltiger_adherent_plural:0 "Tigres"
 deviltiger_desc:0 "Los Tigres-Diablo creen que son los sustitutos de los demonios incompetentes de épocas pasadas; castigan a los pecadores y buscan la iluminación a través del dolor y la violencia."

 songoftheshadow:0 "Canción de la sombra"
 songoftheshadow_adj:0 "Canción"  
 songoftheshadow_adherent:0 "Cantante"
 songoftheshadow_adherent_plural:0 "Cantantes"
 songoftheshadow_desc:0 "La Canción de la Sombra de aspecto yin, también conocida como Flores de Hueso, son nigromantes fríamente lógicos que buscan el razonamiento desapasionado y la aplicación del equilibrio dhármico. También están estrechamente vinculados a la sociedad mortal a través de sus descendientes, y a menudo ayudan a sus familias incluso siglos después."

 resplendentcrane:0 "Camino de la grulla resplandeciente"
 resplendentcrane_adj:0 "Legalismo"  
 resplendentcrane_adherent:0 "Magisterio"
 resplendentcrane_adherent_plural:0 "Magistrados"
 resplendentcrane_desc:0 "El Camino de la Grulla Resplandeciente es una colección de escuelas altamente legalistas, dedicadas a invertir la Rueda de las Edades y restaurar la virtud. ."

 thrashingdragon:0 "Danza del Dragón Tronador"
 thrashingdragon_adj:0 "Baile"  
 thrashingdragon_adherent:0 "Bailarín"
 thrashingdragon_adherent_plural:0 "Bailarín"
 thrashingdragon_desc:0 "El a menudo incomprendido dharma del Dragón Tronador reconoce que están muertos, pero busca alcanzar la iluminación imitando e interactuando con los vivos. A pesar de la aturdida incredulidad de algunas Grullas Resplandecientes, son un dharma plenamente reconocido, aunque parezca que comen y se atornillan a la vida."

 thousandwhispers:0 "Camino de los mil susurros"
 thousandwhispers_adj:0 "Susurros"  
 thousandwhispers_adherent:0 "Susurrante"
 thousandwhispers_adherent_plural:0 "Susurradores"
 thousandwhispers_desc:0 "Los mil susurros viven una secuencia de máscaras, nuevas identidades que construyen tras la muerte para entender la vida mortal y, con suerte, trascenderla."

 inwardway:0 "Buscadores del camino interior"
 inwardway_adj:0 "Buscadores"  
 inwardway_adherent:0 "Buscador"
 inwardway_adherent_plural:0 "Buscadores"
 inwardway_desc:0 "Un dharma equilibrado alternativo, los Buscadores persiguen un camino taoísta en comparación con las cortes confucianas."

 wayofthetenthousandscreams:0 "Camino de los diez mil gritos"
 wayofthetenthousandscreams_adj:0 "Gritos"  
 wayofthetenthousandscreams_adherent:0 "Gritón"
 wayofthetenthousandscreams_adherent_plural:0 "Gritones"
 wayofthetenthousandscreams_desc:0 "Un dharma que se opone al Quíntuple Camino. Sus seguidores predican la unión con los Reyes Yama y ven su nuevo estado como una forma de servir al Augusto Personaje como destructores."
 
