 #Rakta-sadhu-Group Faiths
 raktasadhus:0 "Rakta-sadhus"
 raktasadhus_adj:0 "Rakta-sadhus"
 raktasadhus_adherent:0 "Rakta-sadhu"
 raktasadhus_adherent_plural:0 "Rakta-sadhus"
 raktasadhus_des:0 "Les vampires de l’Inde pratiquent une forme de magie du sang appelée Sâdhanâ. Malgré le fait qu’il y a des caïnites indiens qui ne pratiquent pas la Sâdhanâ, le terme au pluriel raktasadhus est encore parfois utilisé pour désigner collectivement tous les caïnites indiens, en grande partie parce qu’ils ont jusqu’à présent négligé de formaliser leur réseau d’allégeances éphémères dans une secte ou une cour réelle. Ces allégeances n’auraient même pas du tout vu le jour si ce n’était de l’opposition des vampires Cathayans de la Cour des Tonnerres Infinis du sud de l’Inde et de la Cour du Dragon Écarlate de l’est de l’Inde."
 
 mayaparisatya:0 "Mayaparisatya"
 mayaparisatya_adj:0 "Mayaparisatya"
 mayaparisatya_adherent:0 "Rakshasa"
 mayaparisatya_adherent_plural:0 "Rakshasas"
 mayaparisatya_desc:0 "Le chemin du paradoxe doit une lourde dette à certains principes de l’hindouisme. Selon elle, les Familles sont enfermées perpétuellement en dehors du cycle illusoire de l’univers (maya). Alors que la plupart des êtres sont réincarnés au travers de Samsara, un enchevêtrement continuel dans le cycle de la renaissance, la Famille  a échappé à ce cycle. Chaque individu a son propre but, ou svadharma, bien que les vampires, exclus du cycle, aient perdu le leur."

 viaparadox:0 "Via Paradox"
 viaparadox_adj:0 "Paradoxe"
 viaparadox_adherent:0 "Trompeur"
 viaparadox_adherent_plural:0 "Trompeurs"
 viaparadox_desc:0 "Les Trompeurs croient en un but supérieur pour chacun, y compris eux-mêmes, les autres vampires et les mortels. Leur tâche dans la vie est de guider chacun vers sa destinée supérieure. Si nécessaire, cela inclut la mort, en particulier pour la Famille qu’ils considèrent comme rebelle et ayant chuté de leur véritable destin. Les mortels sont plus à l’abri de ces châtiments mortels, car ils sont plus directement impliqués dans le cycle de vie de l’univers."

 pathofdevaraja:0 "Route de Devaraja"
 pathofdevaraja_adj:0 "Devaraja"
 pathofdevaraja_adherent:0 "Théologien"
 pathofdevaraja_adherent_plural:0 "Théologiens"
 pathofdevaraja_desc:0 "Les disciples de cette voie ne croient pas en quelque droit divin de gouverner. Au lieu de cela, ils croient qu’ils doivent gagner le droit de gouverner et de s’élever à la divinité dans les yeux de leur peuple. Les Théologiens ne créent pas des sujets et des inférieurs, mais plutôt des disciples et des adorateurs."

 pathofdaitya:0 "Route de Daitya"
 pathofdaitya_adj:0 "Daitya"
 pathofdaitya_adherent:0 "Charmeur-de-Serpent"
 pathofdaitya_adherent_plural:0 "Charmeurs-de-Serpent"
 pathofdaitya_desc:0 "Les Daitya vénèrent Shiva, et revendiquent la direction de tous les vampires qui vénèrent Shiva. Les Daitya voient leur devoir de caste comme un étrange inverse du brahmanisme mortel. En tant que démons, ils doivent combattre les dieux et s’efforcer de renverser l’ordre moral du monde. En tant que brahmanes, cependant, ils doivent s’efforcer de garder leurs compagnons vampires dans leurs propres devoirs de caste particulière comme assassins, escrocs, profanateurs de rites sacrés et tous les autres rôles odieux assignés aux démons."
 
 naktanchara:0 "Naktanchara"
 naktanchara_adj:0 "Naktanchara"
 naktanchara_adherent:0 "Naga"
 naktanchara_adherent_plural:0 "Nagas"
 naktanchara_desc:0 "Influencée par la montée du bouddhisme chez les mortels, la lignée Naktanchara s’est détachée de la Route de Daitya pour chercher la paix intérieure et le Nirvana. Les Nagas gardent maintenant quelques textes interdits du bouddhisme tels que les Prajnaparamita Sutras. Leur respect est pour la religion dans son ensemble, et non pour les pratiquants individuels. Ce sont aussi des créatures mondaines et capricieuses qui propagent la maladie et le malheur lorsqu’elles sont en colère."
 
 tariqeltanaqud:0 "Tariq el-Tanaqud"
 tariqeltanaqud_adj:0 "Tariq el-Tanaqud"
 tariqeltanaqud_adherent:0 "Khadae"
 tariqeltanaqud_adherent_plural:0 "Al-Mukhadieun"
 tariqeltanaqud_desc:0 "En tant que carrefour entre la lignée indienne principale et la lignée occidentale décadente, les Ravnos musulmans chevauchent les deux mondes mais sont également rejetés par les deux. Les parias et les vagabonds sont détestés par les Ashirras."

 samsara:0 "Samsara"
 samsara_adj:0 "Samsara"
 samsara_adherent:0 ""
 samsara_adherent_plural:0 ""
 samsara_desc:0 "La Voie moderne du Paradoxe, aussi appelée Saïra, est une création des nouveau-nés de Ravnos. Il n’est pas aussi rigide que le Mayaparistya, mais ne permet pas non plus la cruauté gratuite et l’hédonisme de la voie occidentale. Son éthique est la même que celle des Mayaparistya, mais la Hiérarchie des Péchés a été modifiée pour permettre l’interaction avec les vampires qui ne suivent pas le chemin."