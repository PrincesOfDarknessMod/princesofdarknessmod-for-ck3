 #Transfigurateur-Group Faiths
 viamutationis:0 "Via Mutationis"
 viamutationis_adj:0 "Koldun"
 viamutationis_adherent:0 "Transfigurateur"
 viamutationis_adherent_plural:0 "Transfigurateurs"
 viamutationis_desc:0 "Les disciples de la Voie de la Métamorphose utilisent la connaissance non pas pour les autres, mais pour eux-mêmes. Ceux qui deviennent des Transfigurateurs vivent seuls, introvertis, en découvrant leurs propres capacités. Ils s’appuient sur des énigmes et des fragments d’information, et donnent généralement des réponses similaires en retour."

 pathoftheflesh:0 "Voie de la Chair"
 pathoftheflesh_adj:0 "Koldun"
 pathoftheflesh_adherent:0 "Transfigurateur de Chair"
 pathoftheflesh_adherent_plural:0 "Transfigurateurs de Chair"
 pathoftheflesh_desc:0 "Le véritable but de la voie est entièrement physique. Une transformation corporelle conduisant à l’acquisition d’une grande puissance dans le monde matériel. Le spirituel n’est considéré important que lorsqu’il contribue à cette transformation physique."

 pathofthespirit:0 "Voie de l'Esprit"
 pathofthespirit_adj:0 "Koldun"
 pathofthespirit_adherent:0 "Transfigurateur spirituel"
 pathofthespirit_adherent_plural:0 "Transfigurateurs spirituels"
 pathofthespirit_desc:0 "Le véritable but de la route est une transformation entièrement spirituelle. Ils voient le monde physique comme une illusion et une distraction, au mieux un simple outil de croissance spirituelle."
 
 viaapotheosis:0 "Via Apotheosis"
 viaapotheosis_adj:0 "Apotheosis"
 viaapotheosis_adherent:0 "Apothéosiste"
 viaapotheosis_adherent_plural:0 "Apothéosistes"
 viaapotheosist_desc:0 "Les disciples étudient la littérature obscure et pratiquent des expériences régies dans le but de transcender les limites de leur corps humain. La foi organisée est improvisée avec des tolérances sociales laxistes. Cependant, le tempérament ambitieux et égoïste requis se trouve rarement en dehors du clan Tzimisce."
 
 
 holy_order_order_of_oradea:0 "L’Ordre des Oradeas"
 holy_order_knez_of_dacia:0 "Knez de Dacie"
 holy_order_dragons_of_wallachia:0 "Les Dragons de Wallachie"

 
 