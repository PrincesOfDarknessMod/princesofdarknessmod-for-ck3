 blackmagdalene:0 "Eglise de la Sombre Magdalene"
 blackmagdalene_adj:0 "Sombre Magdalene"
 blackmagdalene_adherent:0 "Sombre Magdalene"
 blackmagdalene_adherent_plural:0 "Sombre Magdalenes"
 blackmagdalene_desc:0 "Se déplacer à travers l'Europe depuis leur base de Marseille pour séduire et corrompre les fidèles. Ils utilisent la même doctrine que l'hérésie caïnite, y compris la communion sanguine. Ils identifient Sainte Marie-Madeleine avec Isis et la Sophia Gnostique. Les nunneries magdalénites servent souvent de maisons de `` prostitution de temple '' rappelant les anciens cultes de fertilité du Levant - et elles cachent des rituels amers et sanglants de castration et de cannibalisme aux mystères les plus sombres. Tout prêtre lubrique sait où ses pensées les plus sinistres peuvent trouver la satiété, et les gens du commun ont commencé à identifier sainte Marie-Madeleine avec la «femme adultère» sans nom grâce aux excès du culte. Les «jeux de la passion» presque pornographiques montés sur les Magdalénites le 22 juillet Fête de la Madeleine ont été attaqués par des prêtres à travers la France. Les suiveurs de Set envoient délibérément leurs membres les plus impétueux et les moins subtils pour commencer des sectes magdalénites."
