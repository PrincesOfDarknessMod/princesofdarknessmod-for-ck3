 calomenasforsaken_desc:0 "Fléaux de la race caïnite, les Réprouvés sont un groupe de chasseurs croyant en l'hérésie bogomil. Ils croient que Calomena était la sœur de Caine, et ils doivent provoquer la destruction des enfants de Caine - les vampires. Ils croient en une philosophie dualiste et observent également la dure pauvreté soutenue par la plupart des Bogomiles."
