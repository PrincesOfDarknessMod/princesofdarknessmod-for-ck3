 calomenaschosen:0 "Elue de Calomena"
 calomenaschosen_adj:0 "Elue"
 calomenaschosen_adherent:0 "Elue"
 calomenaschosen_adherent_plural:0 "Elues"
 calomenaschosen_desc:0 "Les Élus ont été fondés par le Caitiff Stanislav. Fondé dans les Balkans occidentaux, ce culte semble vaguement dérivé de l'hérésie de Bogomil. Les Élus croient que Caïn était un enfant du diable et que ses enfants sont les manifestations les plus viles sur terre. On pense que Calomena, la sœur jumelle de Caïn, se prépare à renvoyer et à détruire les vils Caïnites, en nettoyant le monde pour le glorieux Esprit de Dieu. Les Clanless sont ses instruments choisis. Ils organisent des cercles dirigés par des vampires avec des goules et des membres mortels. Stanislav a été martyrisé en 1204 à la fin du rêve de Michael et de la croisade amère, mais son culte se dirige vers la Géhenne."
