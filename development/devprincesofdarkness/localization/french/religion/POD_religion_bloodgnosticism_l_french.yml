 #Blood Gnostics-Group Faiths

 viacain:0 "Hérésie Cainite"
 viacain_adj:0 "Cainite"
 viacain_adherent:0 "Cainite"
 viacain_adherent_plural:0 "Cainites"
 viacain_desc:0 "L'hérésie caïnite est une croyance hérétique qui est pratiquée principalement par les Caïnites chrétiens, principalement mais pas exclusivement par les vampires Lasombra. Il est fortement imprégné de gnosticisme et emploie un troupeau de prêtres et de clercs humains. Historiquement, l'hérésie est née de divers cultes de sang dans lesquels les vampires étaient vénérés comme des dieux. Les vampires, en raison de leur corps incorruptible, de leur indépendance vis-à-vis du monde matériel et du pouvoir que leurs disciplines accordent, étaient considérés par certains gnostiques comme des créatures de spiritualité supérieure et étaient recherchés pour des enseignements en échange de vitae."
 
