 swarmofsamael_desc:0 "Contrôlé par les Baali, l'Essaim soutient que les Ialdabaoth sont des têtes jumelles de la même Bête. L'essaim met l'accent sur les traditions eschatologiques de l'Euagetaematikon plutôt que sur la Communion sanguine ou les éléments christologiques, mais il révèle rapidement les mystères les plus sombres de l'infernalisme aux imprudents. La Curie pourpre n'a aucun scrupule à dénoncer les cultes hérétiques de Baali."
