 viapura:0 "Via Pura"
 viapura_adj:0 "Katharoi"
 viapura_adherent:0 "Kathar"
 viapura_adherent_plural:0 "Katharoi"
 viapura_desc:0 "Dans une ère de résistance croissante à l’autorité cléricale, ils ont choisi le dualisme gnostique comme l’épée la mieux forgée pour leurs objectifs. Les Zélotes construisent des religions avec un calcul presque cynique, en s'inspirant du néoplatonisme, des Écritures apocryphes et d'autres sources obscures. Ils se sont nommés Katharoi et soutiennent les cathares mortels (le même mot, parlé en français et en latin) non pas comme des mécènes, mais comme des guides spirituels."
 
