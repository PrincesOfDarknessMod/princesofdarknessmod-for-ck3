 eschatologists_adj:0 "Eschatologiste"
 eschatologists_adherent:0 "Eschatologiste"
 eschatologists_adherent_plural:0 "Eschatologistes"
 eschatologists_desc:0 "Une faction du clan Cappadocius croit fermement en l'hérésie caïnite, bien qu'avec une emphase plus christologique que la secte principale. Les eschatologues croient qu'ils sont à la fois la couvée de Caïn et du Christ, et qu'offrir leur vitae aux mortels est un sacrement en soi. Les eschatologues parcourent les routes secondaires de l'Europe et organisent des «réveils» de masse qui présentent d'incroyables miracles de sang et de discipline. La plus grande de ces assemblées a lieu le 17 décembre, le Fête de Saint-Lazare."
