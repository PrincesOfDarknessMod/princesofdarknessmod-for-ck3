 #Prodigal-Group Faiths
 viahumanitatis:0 "Via Humanitatis"
 viahumanitatis_adj:0 "Prodigue"
 viahumanitatis_adherent:0 "Prodigue"
 viahumanitatis_adherent_plural:0 "Prodigues"
 viahumanitatis_desc:0 "Les disciples de Via Humanitatis utilisent la condition humaine pour combattre leur Bête, se souvenant qu’ils étaient des mortels ordinaires avant d’être changés par la malédiction de Caïn. Ils mettent l’accent sur les vertus humaines, telles que la liberté, le cœur et l’âme humaine, et sur la raison et l’intelligence comme un séparateur entre l’homme et la bête."

 viaanima:0 "Via Anima"
 viaanima_adj:0 "Anima"
 viaanima_adherent:0 "Inspiré"
 viaanima_adherent_plural:0 "Inspirés"
 viaanima_desc:0 "Via Anima est communément appelé la Voie du Souffle. Les Inspirés essaient de trouver un sens et un but parmi les hommes mortels, partageant leurs fardeaux et leur vie quotidienne. En faisant cela, ils espèrent cesser d’être des monstres dans leur propre esprit, et ainsi s’éloigner de la Bête. Beaucoup de ceux qui suivent cette voie le font purement par instinct, sans jamais y penser."

 viacommunitas:0 "Via Communitas"
 viacommunitas_adj:0 "Communitas"
 viacommunitas_adherent:0 "Civil"
 viacommunitas_adherent_plural:0 "Civils"
 viacommunitas_desc:0 "Communément appelé la Voie de la Communauté. Les civils sont plus concentrés sur la communauté dans son ensemble, plutôt que sur les individus. Ils s’efforcent rarement de s’exalter, et quand ils le font, c’est généralement comme un moyen de bénéficier la communauté dans son ensemble."

 vialuminis:0 "Via Luminis"
 vialuminis_adj:0 "Luminis"
 vialuminis_adherent:0 "Illuminé"
 vialuminis_adherent_plural:0 "Illuminés"
 vialuminis_desc:0 "Communément appelé la Voie de l’Illumination. Ceux qui suivent la Voie de l’Illumination cherchent la Route Amère vers Golconda pour quitter le monde matériel. Les adeptes de la Via Luminis sont un groupe solitaire, pas nécessairement par choix, mais parce que la société les fuit. L’injure du Salubri (et du Golconda en général) a également servi à rendre la Voie suspecte aux vampires pieux."

 viavireo:0 "Via Vireo"
 viavireo_adj:0 "Vireo"
 viavireo_adherent:0 "Rôdeur"
 viavireo_adherent_plural:0 "Rôdeurs"
 viavireo_desc:0 "Communément appelé la Voie de la Vigueur. Ceux qui suivent la Voie de la Vigueur ne se consacrent pas seulement à un idéal de ce qu’est l’humanité, mais aussi à sa nature. Les rôdeurs sont attirés par la tendance humaine à innover, à élargir ses horizons et à aller de l’avant pour le bien ou le mal. La Voie de la Vigueur est une voie énergique qui met l’accent sur le mouvement et l’action avant la contemplation et l’immobilité."
 
 eternalsenate:0 "Sénat Éternel"
 eternalsenate_adj:0 "Sénat Éternel"
 eternalsenate_adherent:0 "Sénateur"
 eternalsenate_adherent_plural:0 "Sénateur"
 eternalsenate_desc:0 "Le Sénat éternel est un conseil de Caïnites basé sur le Sénat romain (bien que beaucoup plus petit), pour gouverner, légiférer et régner sur la Famille. Le Ventrue de Rome s’organise comme les mortels, comme une république : le Sénat éternel du Ventrue. Au Sénat, chaque Ventrue a le droit de parole et de vote indépendamment de son âge ou de son sexe."
 
