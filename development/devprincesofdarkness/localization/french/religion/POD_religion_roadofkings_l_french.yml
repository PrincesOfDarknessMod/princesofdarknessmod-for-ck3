 #Héritié-Group Faiths
 viaregalis:0 "Via Regalis"
 viaregalis_adj:0 "Regalis"
 viaregalis_adherent:0 "Personalité"
 viaregalis_adherent_plural:0 "Personnalités"
 viaregalis_desc:0 "Les adeptes de Via Regalis contrôlent leur Bête en régnant sur les autres. Les mortels sont inférieurs, les promesses seront remplies, le pouvoir est tout."

 viaequitum:0 "Via Equitum"
 viaequitum_adj:0 "Equitum"
 viaequitum_adherent:0 "Paladin"
 viaequitum_adherent_plural:0 "Paladins"
 viaequitum_desc:0 "Ceux qui suivent la Voie de la Chevalerie croient qu’en tant qu’êtres supérieurs, ils sont tenus de défendre ceux qui sont inférieurs à eux, aussi bien Caïnite qu'humain. Ces Héritiés croient le plus fermement aux concepts de devoir et d’honneur."

 viamercator:0 "Via Mercator"
 viamercator_adj:0 "Mercator"
 viamercator_adherent:0 "Marchant"
 viamercator_adherent_plural:0 "Marchants"
 viamercator_desc:0 "Pour ces Héritiés qui suivent la Voie du Marchand, le pouvoir et l’argent vont de pair ; par conséquent, ils passent une grande partie de leur temps à acquérir des richesses et à les utiliser pour influencer subtilement les choses dans les coulisses. Cependant, ils chérissent aussi leur propre réputation, et feront de grands efforts pour s’assurer qu’elle leur apporte du bon."

 viatyrannus:0 "Via Tyrannus"
 viatyrannus_adj:0 "Tyrannus"
 viatyrannus_adherent:0 "Tyrant"
 viatyrannus_adherent_plural:0 "Tyrants"
 viatyrannus_desc:0 "Bien que beaucoup aient la réputation d’être féroces, maniaque du contrôle et assoiffés de pouvoir, les Héritiés de la Voie du Tyran sont aussi parmi les plus illustres de la Via Regalis. Si l’un d’eux a une obligation envers vous, il sera conservé, quel que soit le coût. Ils sont toutefois les plus enclins à régner par la peur plutôt que par appel."

 viaconsuasor:0 "Via Consuasor"
 viaconsuasor_adj:0 "Consuasor"
 viaconsuasor_adherent:0 "Vizir"
 viaconsuasor_adherent_plural:0 "Vizirs"
 viaconsuasor_desc:0 "Les Héritiés sur la Voie du Vizir se contentent de conseiller plutôt que de gouverner directement, mais cela ne les rend pas moins habiles à manier le pouvoir que les autres sur la Route des Rois. En fait, ces Héritiés sont parmi les meilleurs pour les manipulations subtiles et à remarquer des détails qui pourraient menacer l’influence des responsables."
 
 viamithras:0 "Via Mithras"
 viamithras_adj:0 "Mithraisme"
 viamithras_adherent:0 "Mithraïste"
 viamithras_adherent_plural:0 "Mithraïstes"
 viamithras_desc:0 "Les Mithraïstes sont à cheval entre la Via Regalis et une véritable secte. Bien que le pouvoir et l’honneur soient toujours tenus en haute estime, la dévotion à un dieu réel, Mithras, est primordiale. Ils sont toujours fidèles à une organisation datant des jours de gloire du culte, dans la Rome antique."

 viaentelechia:0 "Via Entelechia"
 viaentelechia_adj:0 "Entelechia"
 viaentelechia_adherent:0 "Dévoué"
 viaentelechia_adherent_plural:0 "Dévouéss"
 viaentelechia_desc:0 "Les Dévoués sont définis par les trois bases d’Entelechy : Andreia, virilité; enkratia, force intérieure; et sophrosyne, contrôle intérieur. Les contraintes humaines comme la miséricorde ou la sympathie (ou la considération) sont en dessous d’eux. Quand un Dévoué rencontre un groupe de ses compagnons de clans, il assume la direction de ceux-ci, pointant à l’infériorité évidente de ses opposés et ne pas se soustraire à tuer les vampires qui désobéiraient à leurs ordres."		
 
 codexoflegacies:0 "Codex des Legs"
 codexoflegacies_adj:0 "Leg Codex"
 codexoflegacies_adherent:0 "Réveur"
 codexoflegacies_adherent_plural:0 "Réveurs"
 codexoflegacies_desc:0 "Les Caïnites de Constantinople n’ont pas adhéré aux six Traditions de Caïn. Au lieu de cela, le Brujah Tribonius créa le Codex des Legs, une collection de préceptes qui devait cimenter la règle de la Trinité et des trois clans au pouvoir : le Toreador, le Tzimisce et le Ventrue. Un conseil de trois questeurs — un de chacun de ces trois clans — supervisait le codex et jugeait ceux qui enfreignaient ses principes."
 
