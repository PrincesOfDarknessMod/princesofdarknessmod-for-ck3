# Vampire Doctrines

 burning_faith_name:0 "Foi Brûlante"
 burning_faith_doctrine_name:0 "Guerriers de Mithras"
 burning_faith_doctrine_desc:0 "En tant que guerriers du Soleil Inconquis, nous devons être aussi formidables que Lui. Le monde de la nuit verra enfin la lumière du Soleil."
 undead_aesir_name:0 "Mort-Vivant d'Aesir"
 undead_aesir_doctrine_name:0 "Einherjar Réformé"
 undead_aesir_doctrine_desc:0 "Les guerriers de Caharl sont avides de gloire et de bataille, et légitimement redoutés par les faibles Caïnites."
 restored_republic_name:0 "République Réstaurée"
 restored_republic_doctrine_name:0 "Sénat en session"
 restored_republic_doctrine_desc:0 "Pour une institution caïnite, le Sénat est étonnamment ouvert d’esprit. Mais pas moins stressant et sanglant que les autres."
 senatorial_clans_name:0 "Amis de la République"
 senatorial_clans_doctrine_name:0 "Clans Sénatorials"
 senatorial_clans_doctrine_desc:0 "Le Sénat n’a pas oublié la trahison de Michel de Constantinople ou de Carthage. Leurs 'Clans' décadents ne sont pas les bienvenus dans les salles sacrées du Sénat."
 vengeful_carthage_name:0 "Carthage Vengeur"
 vengeful_carthage_doctrine_name:0 "Impitoyable Utopie"
 vengeful_carthage_doctrine_desc:0 "Carthage a des générations de torts à réparer. Dans le sang des traîtres romains de préférence."
 broken_hope_name:0 "Espoir Brisé"
 broken_hope_doctrine_name:0 "Utopie Echoué"
 broken_hope_doctrine_desc:0 "Nouvelle-Carthage n’est qu’un outil politique sans âme. L’esprit des vrais Prométhéens a été écrasé par cette nouvelle défaite."
 secure_anda_name:0 "Anda Sécurisé"
 secure_anda_doctrine_name:0 "Gestion d’un empire"
 secure_anda_doctrine_desc:0 "Parmi les bellicistes habiles, les Anda devinrent aussi des hommes d’État habiles, utilisant la tolérance religieuse de leur famille mongole comme pierre angulaire."
 crimsom_curia_name:0 "Curia Ecarlate"
 crimsom_curia_doctrine_name:0 "Regard de Nod Restauré"
 crimsom_curia_doctrine_desc:0 "Le conseil ecclésiastique restauré de l’Église du Troisième Caïn s’occupe des affaires quotidiennes... mais appelle également à l’expansion de la domination de l’Église avant la venue du Sauveur."
 militarized_experiments_name:0 "Atelier des horreurs"
 militarized_experiments_doctrine_name:0 "Expérimentation Militarizée"
 militarized_experiments_doctrine_desc:0 "Les horreurs et les abominations tordues sont maintenant encore plus couramment utilisées par le clan Tzimisce comme troupes de choc."
 warden_network_name:0 "Réseau de Gardiens"
 warden_network_doctrine_name:0 "Les yeux et les oreilles"
 warden_network_doctrine_desc:0 "L’Ordre de Moloch est plus unifié qu’il ne l’a jamais été, s’assurant que tout gardien peut trouver de l’aide n’importe où."
 knights_acre_name:0 "Chevaliers d'Acre"
 knights_acre_doctrine_name:0 "Épée de Dieu préparée"
 knights_acre_doctrine_desc:0 "Les braves Chevaliers sont pleinement engagés dans le but de l’Inquisition maintenant, prêts à déchaîner la fureur sacrée sur les enfers."
 oculi_dei_name:0 "Oculi Dei"
 oculi_dei_doctrine_name:0 "Yeux Attentifs"
 oculi_dei_doctrine_desc:0 "L’Oculi Dei a réprimé ses membres les plus paranoïaques, ce qui en fait un atout encore plus redoutable contre le Mal."
 sisters_stjohn_name:0 "Sœurs de St. John"
 sisters_stjohn_doctrine_name:0 "Protection Divine"
 sisters_stjohn_doctrine_desc:0 "Les Sœurs sont le cœur de l’Inquisition, le rocher même qui la soutient à travers l’obscurité rampante."
 red_order_name:0 "Ordre Rouge"
 red_order_doctrine_name:0 "Gardiens Vigilants"
 red_order_doctrine_desc:0 "L’Ordre Rouge est le gardien des secrets de l’Inquisition. Et ils ne libèrent leur connaissance qu’avec la plus grande précaution."
 von_murnau_name:0 "Maison von Murnau"
 von_murnau_doctrine_name:0 "Chiens de Dieu"
 von_murnau_doctrine_desc:0 "La famille allemande est pleinement engagée dans la cause de l’Inquisition, apportant ses ressources considérables."
                                      
