 #Scholar-Group Faiths
 viaossium:0 "Via Ossium"
 viaossium_adj:0 "Ossium"
 viaossium_adherent:0 "Fossoyeur"
 viaossium_adherent_plural:0 "Fossoyeurs"
 viaossium_desc:0 "Les adeptes de la Voie des Ossements apprécient avant tout la connaissance. À travers une étude intense de l’inconnu, les Fossoyeurs tiennent leurs Bêtes à distance. Ils iront jusqu’au bout pour apprendre quelque chose de nouveau, mais ne se sacrifieront pas inutilement pour une cause. Après tout, leurs propres connaissances recueillies est trop important pour laisser les autres gérer. Dans le même temps, Les chercheurs ne craignent pas la mort, ils sont fascinés par elle."
 
 tariqelatham:0 "Tariq el-A'Tham"
 tariqelatham_adj:0 "A'Tham"
 tariqelatham_adherent:0 "Fossoyeur"
 tariqelatham_adherent_plural:0 "Fossoyeurs"
 tariqelatham_desc:0 "Principalement issu de la principale Via Ossium dans le monde musulman, le Tariq el-A’Tham bénéficie de connaissances plus anciennes maintenues en vie dans cette partie du monde. Leurs pratiques parfois insensibles peuvent les mettre en contradiction avec le zélé Ashirra ou les enfants vigilants de Haqim, cependant."
 
 followersoflazarus:0 "Disciples de Lazarus"
 followersoflazarus_adj:0 "Lazarene"
 followersoflazarus_adherent:0 "Infitiore"
 followersoflazarus_adherent_plural:0 "Infitiores"
 followersoflazarus_desc:0 "Les Disciples de Lazare, aussi appelés les Infitiores, étaient les Cappadoces qui, pour une raison ou une autre, n’ont pas répondu à l’appel qui a conduit à la fête de la folie et ont ainsi évité l’abattage du clan. Incertains de savoir s’ils auraient été épargnés et se seraient sentis trahis par leur fondateur, ils se sont effectivement séparés du corps principal du clan Cappadoce. Lazare était considéré officieusement comme le chef des infitiores."
 
 pathofthewheel:0 "Route de la Roue"
 pathofthewheel_adj:0 "Roue"
 pathofthewheel_adherent:0 "Scientifique"
 pathofthewheel_adherent_plural:0 "Scientifiques"
 pathofthewheel_desc:0 "Les membres de cette Route croient que les vampires sont coincés en dehors du cycle et doivent avancer. Ils cherchent n’importe quel moyen scientifique pour ramener tous les caïnites dans le cycle de la vie."
 
 roadoftheabyss:0 "Voie des Abysses"
 roadoftheabyss_adj:0 "Abyssal"
 roadoftheabyss_adherent:0 "Mystique"
 roadoftheabyss_adherent_plural:0 "Mystiques"
 roadoftheabyss_desc:0 "Les Mystiques sont immergés dans l’étude éternelle d’une force transcendante et finalement s’opposant à toute lumière et à toute vie. L’humanité et les concepts comme le bien ou le mal n’ont que peu d’utilité pour ceux qui étudient les mystères des ténèbres extérieures."

