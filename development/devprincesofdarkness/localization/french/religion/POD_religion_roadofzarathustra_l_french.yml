 #Zoroastrian-Group Faiths

 roadofagramainyu:0 "Voie de Angra Mainyu"
 roadofagramainyu_adj:0 "Voie de Angra Mainyu"
 roadofagramainyu_adherent:0 "Corrupteur"
 roadofagramainyu_adherent_plural:0 "Corrupteurs"
 roadofagramainyu_desc:0 "Les zoroastriens croient qu’ils sont redevables à l’Angra Mainyu. La Soif et la Nuit Éternelle sont maudits par Angra Mainyu. Ils doivent explorer cet état d’être, et une fois qu’ils comprennent pleinement le mal, ils doivent choisir d’être bon et de revenir à la grâce d’Ahura Mazda. Bien sûr, tous n’y arrivent pas."

 roadofahuramazda:0 "Voie de Ahura Mazda"
 roadofahuramazda_adj:0 "Voie de Ahura Mazda"
 roadofahuramazda_adherent:0 "Pénitent"
 roadofahuramazda_adherent_plural:0 "Pénitents"
 roadofahuramazda_desc:0 "La Voie de la Rédemption passe par Ahura Mazda. Ayant traversé le mal d’Angra Mainyu, ils choisissent d’être bons et de revenir à la grâce d’Ahura Mazda. L’initié de la Route d’Ahura Mazda se nettoie abondamment avec de l’eau."
 
 pathofdaena:0 "Voie de Daena"
 pathofdaena_adj:0 "Voie de Daena"
 pathofdaena_adherent:0 "Behdin"
 pathofdaena_adherent_plural:0 "Behdins"
 pathofdaena_desc:0 "La Voie de Daena enseigne que les actes vertueux et l’adhésion à la loi et au devoir apportent une grande puissance personnelle. En agissant conformément à ces lois et à leur devoir, ils seront récompensés à juste titre. Les lois fournissent une structure à une société civile; enfreignez la loi, et la société s'effrondre."
