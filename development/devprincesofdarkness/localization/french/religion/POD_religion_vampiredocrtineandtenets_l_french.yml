l_french: 

# Vampire Doctrines

 doctrine_vampirethemasquerade_name:0 "Masquarade"
 doctrine_vampirethemasquerade_strict_name:0 "Masquarade Stricte"
 doctrine_vampirethemasquerade_strict_desc:0 "Le Silence du Sang est strictement appliqué. Beaucoup de parents sont irrités sous une telle application draconienne.\n\nNe vous faites pas d’amis parmi les poètes, ils chanteront trop de vous. \n\nSoyez inconnu. Cherchez des ombres.\n\nNe laissez pas le prêtre, le poète ou le paysan vous voir vous nourrir. Aucun d’entre eux ne le quittera.\n\nQuand la Croix a un but, trouvez votre sécurité."
 doctrine_vampirethemasquerade_lax_name:0 "Lax Masquarade"
 doctrine_vampirethemasquerade_lax_desc:0 "L’application du Silence du Sang est laxiste. Alors que la Famile fait des efforts pour cacher leur existence, ils font aussi parfois de terribles erreurs qui ne sont pas punies par leurs aînés."
 doctrine_vampirethemasquerade_none_name:0 "Pas de Masquarade"
 doctrine_vampirethemasquerade_none_desc:0 "Les vampires agissent sans tenir compte du secret des parents."
 doctrine_vampirethemasquerade_ignorant_name:0 "Ignoré"
 doctrine_vampirethemasquerade_ignorant_desc:0 "Les Vampires n'existent pas."
 doctrine_vampirethemasquerade_consent_name:0 "Volontaires Uniquements"
 doctrine_vampirethemasquerade_consent_desc:0 "Les vampires, bien que cachés de la société, doivent demander le consentement de leurs 'donateurs'." 
 doctrine_vampirethemasquerade_cult_name:0 "Culte du Sang"
 doctrine_vampirethemasquerade_cult_desc:0 "Les vampires ont une société secrète ou un culte du sang qui les déifie secrètement en tant que dieu du sang."  
 doctrine_vampirethemasquerade_family_name:0 "Secret de Famille"
 doctrine_vampirethemasquerade_family_desc:0 "Les vampires se nourrissent de familles mortelles particulières qui peuvent être un peu au courant de leur condition vampirique. Ils désirent garder leur sang pur, et rejettent l’impur."   
 doctrine_parameter_vampirethemasquerade_strict:0 "Les personnages avec les [traits|E] [GetTrait('predatortype_consensualist'). GetName( GetPlayer )], [GetTrait('predatortype_cultist'). GetName( GetPlayer )] ou [GetTrait('predatortype_familias'). GetName( GetPlayer )] sont des [criminels|F]"
 doctrine_parameter_vampirethemasquerade_lax:0 "Les personnages avec les [traits|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )], [GetTrait('predatortype_cultist').GetName( GetPlayer )] ou [GetTrait('predatortype_familias').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_vampirethemasquerade_none:0 "Les personnages avec le [trait|E] [GetTrait('predatortype_farmer').GetName( GetPlayer )] sont [shunned|E]."  
 doctrine_parameter_vampirethemasquerade_family:0 "Les personnages avec les [traits|E] [GetTrait('predatortype_alleycat').GetName( GetPlayer )], [GetTrait('predatortype_bedlamite').GetName( GetPlayer )], [GetTrait('predatortype_farmer').GetName( GetPlayer )], [GetTrait('predatortype_footpad').GetName( GetPlayer )] ou [GetTrait('predatortype_graverobber').GetName( GetPlayer )] sont [shunned|E]. \nLes personnages avec le [trait|E] [GetTrait('predatortype_familias').GetName( GetPlayer )] sont entièrement acceptés"
 doctrine_parameter_vampirethemasquerade_cult:0 "Les personnages avec les [traits|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )] ou [GetTrait('predatortype_familias').GetName( GetPlayer )] sont [shunned|E].  Les personnages avec le [trait|E] [GetTrait('predatortype_cultist').GetName( GetPlayer )] sont acceptés." 
 doctrine_parameter_vampirethemasquerade_consent:0 "Les personnages avec le [trait|E] [GetTrait('predatortype_alleycat').GetName( GetPlayer )] sont [criminals|E]. Les personnages avec les [trait|E]s [GetTrait('predatortype_cauchemar').GetName( GetPlayer )] ou [GetTrait('predatortype_extoutionist').GetName( GetPlayer )] sont [shunned|E]. \nLes personnages avec le [trait|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )] sont loués.\n Tous les autres types de prédateurs sont acceptés."  
 doctrine_parameter_vampirethemasquerade_none:0 "Les Vampires n'existent pas."  

# Oaths et Oathbreaking

 doctrine_oathbreaking_name:0 "Parjure"
 doctrine_oathbreaking_crime_name:0 "Criminelle"
 doctrine_oathbreaking_crime_desc:0 "Les serments sont la base de la loi. Ceux qui ne respectent pas les serments sont sans honneur et leur vie est perdue."
 doctrine_oathbreaking_shunned_name:0 "Mal vu"
 doctrine_oathbreaking_shunned_desc:0 "Ceux qui brisent un serment ne sont pas dignes de confiance. Méfiez-vous d’eux."
 doctrine_oathbreaking_accepted_name:0 "Accepté"
 doctrine_oathbreaking_accepted_desc:0 "Le parjure est accepté. Qui croit les paroles des morts-vivants ?"
 doctrine_oathbreaking_ignorant_name:0 "Ignoré"
 doctrine_oathbreaking_ignorant_desc:0 "Le parjure n’est pas une faute criminelle."
 doctrine_parameter_oathbreaking_illegal:0 "Les personnages avec le [trait|E] [GetTrait('oathbreaker').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_oathbreaking_shunned:0 "Les personnages avec le [trait|E] [GetTrait('oathbreaker').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_oathbreaking_accepted:0 "Les personnages avec le [trait|E] [GetTrait('oathbreaker').GetName( GetPlayer )] sont entièrement acceptés"
 doctrine_parameter_oathbreaking_ignorant:0 "Les personnages avec le [trait|E] [GetTrait('oathbreaker').GetName( GetPlayer )] sont ignorés."

 doctrine_vampirebloodoath_name:0 "Serment de Sang"
 doctrine_vampirebloodoath_crime_name:0 "Criminelle"
 doctrine_vampirebloodoath_crime_desc:0 "Être lié par le sang est pire que d’être asservi, parce qu’il enchaîne le cœur et l’esprit ainsi que le coups."
 doctrine_vampirebloodoath_shunned_name:0 "Mal vu"
 doctrine_vampirebloodoath_shunned_desc:0 "Les serments de sang peuvent être autant un fardeau pour le régnant que pour l'esclave, choisissez les soigneusement. Rappelez-vous le proverbe. Une gougée de sang, je prends. Deux gougées, j’accepte. Trois gougées, je refuse."
 doctrine_vampirebloodoath_accepted_name:0 "Accepté"
 doctrine_vampirebloodoath_accepted_desc:0 "Le serment de sang est le fondement de notre société. Les serments de fidélité devraient être appliqués par un certain degré de vassalisation par le sang."
 doctrine_parameter_vampirebloodoath_illegal:0 "Les personnages avec le [trait|E] [GetTrait('bloodoath').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_vampirebloodoath_shunned:0 "Les personnages avec le [trait|E] [GetTrait('bloodoath').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_vampirebloodoath_accepted:0 "Les personnages avec le [trait|E] [GetTrait('bloodoath').GetName( GetPlayer )] sont entièrement acceptés"

 doctrine_vampireghouling_name:0 "Vassalisation de Goule"
 doctrine_vampireghouling_crime_name:0 "Criminelle"
 doctrine_vampireghouling_crime_desc:0 "Les goules menacent le Silence du Sang, on ne partage pas le Sang avec les indignes.\n\nVous ne deviendrez pas un Dieu pour les enfants de Seth, car celui d’en haut, jaloux de plus en plus dans son ciel, détruira pour toujours la lignée de Caïn. Souviens-toi d’Ashtareth au visage doux, souviens-toi de Baal "gras d’or", souviens-toi du fort Tammauz , sache que les enfants de Seth se lèveront avec des armes de l’Unique d’en haut, et nous vaincront, si nous étions comme des dieux pour eux. Tu conduiras les enfants de Seth comme un berger guide son troupeau, et tu les abattras comme il le faut. Tu purifieras leur sang, et tu les délivreras tous de la maladie."
 doctrine_vampireghouling_shunned_name:0 "Mal vu"
 doctrine_vampireghouling_shunned_desc:0 "Nous sommes des prédateurs, pas des proies. Partager son sang avec les bêtes révèle sa propre faiblesse.\n\nVous ne deviendrez pas un Dieu pour les enfants de Seth, car celui d’en haut, jaloux de plus en plus dans son ciel, détruira pour toujours la lignée de Caïn. Souviens-toi d’Ashtareth au visage doux, souviens-toi de Baal "gras d’or", souviens-toi du fort Tammauz , sache que les enfants de Seth se lèveront avec des armes de l’Unique d’en haut, et nous vaincront, si nous étions comme des dieux pour eux. Tu conduiras les enfants de Seth comme un berger guide son troupeau, et tu les abattras comme il le faut. Tu purifieras leur sang, et tu les délivreras tous de la maladie."
 doctrine_vampireghouling_accepted_name:0 "Accepté"
 doctrine_vampireghouling_accepted_desc:0 "La place de Parent est de nous servir, et ils font de meilleurs vassaux quet ils sont liés par le serment de sang.\n\nCeux qui servent\n\nCeux que vous choisissez de bénir avec la Puissance de Caïn, peut venir vivre dans votre maison, pour vous protéger, que personne n’embrasse ces gardiens, qu’on leur donne du sang au moment opportun : Que leur Force soit votre Force, Force qui ne diminue pas avec le soleil. Que leurs Yeux soient vos Yeux, Yeux qui peuvent voir dans la journée. Que leurs oreilles soient vos oreilles, des oreilles qui peuvent entendre pendant que vous sommeillez. Que ceux qui servent soient les plus grets des enfants de Seth, et les plus privilégiés. Qu’ils apprécient la belle étoffe de la Famille, qu’ils apprécient la douce musique de la Famille, qu’ils connaissent la douceur de notre vin. Protégeons-les de ceux qui voudraient les entraver et les blesser, et élevons-nous tous dans l’indignation si l’un de ceux-qui-servent était tué par un autre de la Famille, car aucun membre de la Famille n’a le droit de tuer le Serviteur d’un autre sans provocation."
 doctrine_vampireghouling_mass_name:0 "Goulifier en masse Accepté"
 doctrine_vampireghouling_mass_desc:0 "Le sang de la famille peut construire des légions.\n\nCeux qui servent\n\nCeux que vous choisissez de bénir avec la Puissance de Caïn, peut venir vivre dans votre maison, pour vous protéger, que personne n’embrasse ces gardiens, qu’on leur donne du sang au moment opportun : Que leur Force soit votre Force, Force qui ne diminue pas avec le soleil. Que leurs Yeux soient vos Yeux, Yeux qui peuvent voir dans la journée. Que leurs oreilles soient vos oreilles, des oreilles qui peuvent entendre pendant que vous sommeillez. Que ceux qui servent soient les plus grets des enfants de Seth, et les plus privilégiés. Qu’ils apprécient la belle étoffe de la Famille, qu’ils apprécient la douce musique de la Famille, qu’ils connaissent la douceur de notre vin. Protégeons-les de ceux qui voudraient les entraver et les blesser, et élevons-nous tous dans l’indignation si l’un de ceux-qui-servent était tué par un autre de la Famille, car aucun membre de la Famille n’a le droit de tuer le Serviteur d’un autre sans provocation." 
 doctrine_parameter_vampireghouling_illegal:0 "Les personnages avec les [traits|E] [GetTrait('ghoul').GetName( GetPlayer )], [trait|E]s [GetTrait('regnant').GetName( GetPlayer )] ou [GetTrait('massregnant').GetName( GetPlayer )] sont [criminals|E]."
 doctrine_parameter_vampireghouling_shunned:0 "Les personnages avec les [traits|E] [GetTrait('ghoul').GetName( GetPlayer )] ou [trait|E]s [GetTrait('regnant').GetName( GetPlayer )] sont [shunned|E]. Les personnages avec le [trait|E] [GetTrait('massregnant').GetName( GetPlayer )] sont [criminals|E]."
 doctrine_parameter_vampireghouling_accepted:0 "Les personnages avec les [traits|E] [GetTrait('ghoul').GetName( GetPlayer )] ou [trait|E]s [GetTrait('regnant').GetName( GetPlayer )] sont entièrement acceptés. Les personnages avec le [trait|E] [GetTrait('massregnant').GetName( GetPlayer )] sont [criminals|E]."
 doctrine_parameter_vampireghouling_mass:0 "Les personnages avec les [traits|E] [GetTrait('ghoul').GetName( GetPlayer )], [GetTrait('regnant').GetName( GetPlayer )] ou [GetTrait('massregnant').GetName( GetPlayer )] sont entièrement acceptés." 

 doctrine_bloodsorcery_name:0 "Magie du Sang"
 doctrine_bloodsorcery_crime_name:0 "Criminelle"
 doctrine_bloodsorcery_crime_desc:0 "La Magie du Sang est une menace pour tous les membres de la Famille et il faut l’interdire. \n\nPour les Illuminés\n\nLa Mère du Pouvoir, la sombre Lilith, est une des plus grandes, mais il y en a d’autres, et il en reste encore à venir. Ne bois pas de leur sang, pour qu’ils te prennent au piège, garde-toi d’eux, ils sont rusés. Ils connaissent la connaissance d’Adam, et la sagesse d’Eve, ils sont les porteurs de feu, les cultivateurs de terre, les éleveurs d’animaux, les porteurs d’écriture, ils sont les enfants du Soleil, les étoiles montantes. Ils chercheront à vous impliquer dans leur voyage, Résister! Résister! Leur voie ignore la soif, le sang et le corps. Ne faites pas confiance à ceux qui ont les yeux brillants vers l’aube. Rappelez-vous toujours, c’est l’aurore qui apporte votre mort"
 doctrine_bloodsorcery_shunned_name:0 "Mal vu"
 doctrine_bloodsorcery_shunned_desc:0 "Les Mages de Sang sont des gens suspect, au mieux un mal parfois nécessaire.\n\nPour les Illuminés\n\nLa Mère du Pouvoir, la sombre Lilith, est une des plus grandes, mais il y en a d’autres, et il en reste encore à venir. Ne bois pas de leur sang, pour qu’ils te prennent au piège, garde-toi d’eux, ils sont rusés. Ils connaissent la connaissance d’Adam, et la sagesse d’Eve, ils sont les porteurs de feu, les cultivateurs de terre, les éleveurs d’animaux, les porteurs d’écriture, ils sont les enfants du Soleil, les étoiles montantes. Ils chercheront à vous impliquer dans leur voyage, Résister! Résister! Leur voie ignore la soif, le sang et le corps. Ne faites pas confiance à ceux qui ont les yeux brillants vers l’aube. Rappelez-vous toujours, c’est l’aurore qui apporte votre mort"
 doctrine_bloodsorcery_accepted_name:0 "Accepté"
 doctrine_bloodsorcery_accepted_desc:0 "La magie remplit la volonté autour de nous, et c’est notre droit et notre privilège de nous engager avec elle comme nos ancêtres l’ont fait."
 doctrine_parameter_bloodsorcery_illegal:0 "Les personnages avec le [trait|E] [GetTrait('bloodsorcery').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_bloodsorcery_shunned:0 "Les personnages avec le [trait|E] [GetTrait('bloodsorcery').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_bloodsorcery_accepted:0 "Les personnages avec le [trait|E] [GetTrait('bloodsorcery').GetName( GetPlayer )] sont entièrement acceptés"
 
 doctrine_infernalism_name:0 "Infernalisme"
 doctrine_infernalism_crime_name:0 "Criminelle"
 doctrine_infernalism_crime_desc:0 "Le moyen infernal d’apporter l’Enfer sur Terre. Ne négociez pas avec les ténèbres : un jour, il nous prendra tous. Marquez bien les Enfants de l’Un En Bas, le Parent du Serpent, où leur contact vous brûlera aussi, et leurs langues vous tromperont et vous tromperont. Chassez et détruisez les infernalistes où que vous les trouviez."
 doctrine_infernalism_shunned_name:0 "Mal vu"
 doctrine_infernalism_shunned_desc:0 "Le moyen infernal d’apporter l’Enfer sur Terre. Ne négociez pas avec les ténèbres : un jour, il nous prendra tous. Marquez bien les Enfants de l’Un En Bas, le Parent du Serpent, où leur contact vous brûlera aussi, et leurs langues vous tromperont et vous tromperont. Chassez et détruisez les infernalistes où que vous les trouviez."
 doctrine_infernalism_accepted_name:0 "Accepté"
 doctrine_infernalism_accepted_desc:0 "Les investissements infernaux sont la voie vers le vrai pouvoir !"
 doctrine_parameter_infernalism_illegal:0 "Les personnages avec les [traits|E] [GetTrait('infernalist').GetName( GetPlayer )]  ou [GetTrait('baali').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_infernalism_shunned:0 "Les personnages avec les [traits|E] [GetTrait('infernalist').GetName( GetPlayer )] ou [GetTrait('baali').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_infernalism_accepted:0 "Les personnages avec les [traits|E] [GetTrait('infernalist').GetName( GetPlayer )] ou [GetTrait('baali').GetName( GetPlayer )] sont entièrement acceptés"

 doctrine_vampirediablerie_name:0 "Diablerie"
 doctrine_vampirediablerie_crime_name:0 "Criminelle"
 doctrine_vampirediablerie_crime_desc:0 "Dévorer l’âme d’un autre membre de la Famille est le crime de notre espèce.\n\nUne Malédiction, Interdisant la Diablerie\n\nEt les ennemis de Caïn étaient grets, et tombèrent au combat sur sa route comme des chiens, l’odeur ne se dissiperait pas par le déluge et la lune, dans beaucoup de souffrance. L’habileté du chasseur était grete, comme le voyais leur père, et ils l'ont vu... Les discipline antique les a utilisés pour trouver la voie de Shal-ka-mense. Ils arrivèrent enfin à cet endroit secret où Caïn se cacha, au milieu des eaux. En se montrant, Caïn les appela en bas : 'Doux fils, douces filles, pourquoi troublez-vous mon sommeil?'Et ils essayèrent d’embrasser leur Père avec des choses d’acier et des choses de bois, mais la foudre de Caïn, en un éclair, ne fut pas arrêtée par des gens comme eux. Sous les eaux déferlantes, au-delà de la piscine de Veyd-sah-me, dans la grotte de Shal-ka-mense, ils se sont rassemblé, pour embrasser le foum de leur Père endormi. L'ont-ils trouvés endormi ? Ils l'ont trouvés éveillé, prêt pour la bataille, les yeux courts, souriant à son enfant antique faisant la guerre dans la lumière croissante. Maintenant les étoiles qui ont tâché une a une le ciel éclairé, maintenant les feux brûlent l’enfer et la cendre, maintenant la chaleur révèle le bûcher.Trop longtemps! Les chasseurs attendaient plus loin, Trop longtemps! Ils l’ont fait par Veyd-sah-moi, assez longtemps pour voir la lumière de l’aube sur le visage de leur Père. Et dans le tournant, brûlant Mark, ils virent le doigt de la haine de Dieu, tordant, défèrlant, la surface même de Dieu qui distinguait le destin solitaire de Caïn.Et comme ils brûlaient dans les feux de l’enfer, comme ils voyaient la chair fondue, comme ils brûlaient avec leur propre Famille, Caïn bénit les bûchers funéraires de mortel, prenant dans son sacrement sanglant. Ne cherche pas le sang de ton Ancien, ne cherche pas le sang du Sire de ton Sire, ne cherche pas celui qui t’a fait Nous, ou tu sentiras le bûcher funèbre, quet tu payeras pour ton péché immortel."
 doctrine_vampirediablerie_shunned_name:0 "Mal vu"
 doctrine_vampirediablerie_shunned_desc:0 "Une fois que les vampires auront goûté au sang des autres vampires, où s’arrêteront-ils ?"
 doctrine_vampirediablerie_accepted_name:0 "Accepté"
 doctrine_vampirediablerie_accepted_desc:0 "Le sang appartient à ceux qui sont assez forts pour le garder."
 doctrine_vampirediablerie_ignorant_name:0 "Ignoré"
 doctrine_vampirediablerie_ignorant_desc:0 "Nous ne connaissons pas les voies du sang de vampire." 
 doctrine_parameter_vampirediablerie_illegal:0 "Les personnages avec les [traits|E] [GetTrait('diablerist').GetName( GetPlayer )] ou [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_vampirediablerie_shunned:0 "Les personnages avec les [traits|E] [GetTrait('diablerist').GetName( GetPlayer )] ou [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_vampirediablerie_accepted:0 "Les personnages avec les [traits|E] [GetTrait('diablerist').GetName( GetPlayer )] ou [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] sont entièrement acceptés"
 doctrine_parameter_vampirediablerie_ignorant:0 "Nous ignoront les [traits|E] [GetTrait('diablerist').GetName( GetPlayer )] ou [GetTrait('predatortype_bloodleech').GetName( GetPlayer )]"
 
 doctrine_vampirefrenzy_name:0 "Frénésie"
 doctrine_vampirefrenzy_crime_name:0 "Criminelle"
 doctrine_vampirefrenzy_crime_desc:0 "Laisser la Bête prendre le contrôle est devenir la Bête. Rappelez-vous le proverbe. Chevauchez la Bête, ne la laissez pas vous chevaucher."
 doctrine_vampirefrenzy_shunned_name:0 "Mal vu"
 doctrine_vampirefrenzy_shunned_desc:0 "Toute la Famille lutte contre les exigences de la Bête, ne lui cèdez pas facilement. Rappelez-vous le proverbe. Chevauchez la Bête, ne la laissez pas vous chevaucher."
 doctrine_vampirefrenzy_accepted_name:0 "Accepté"
 doctrine_vampirefrenzy_accepted_desc:0 "Surfez sur la vague ! La Bête est le pouvoir quet nous en avons le plus besoin !"
 doctrine_vampirefrenzy_ignorant_name:0 "Ignoré"
 doctrine_vampirefrenzy_ignorant_desc:0 "Qu’est-ce qui pourrait faire perdre un tel contrôle à quelqu’un?"
 doctrine_parameter_vampirefrenzy_illegal:0 "Les personnages avec le [trait|E] [GetTrait('wight').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_vampirefrenzy_shunned:0 "Les personnages avec le [trait|E] [GetTrait('wight').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_vampirefrenzy_accepted:0 "Les personnages avec le [trait|E] [GetTrait('wight').GetName( GetPlayer )] sont entièrement acceptés"
 doctrine_parameter_vampirefrenzy_ignorant:0 "Les personnages avec le [trait|E] [GetTrait('wight').GetName( GetPlayer )] souffrent d'une maladie inconnue."

 doctrine_vampirethinblood_name:0 "Sang Clair"
 doctrine_vampirethinblood_crime_name:0 "Criminelle"
 doctrine_vampirethinblood_crime_desc:0 "Le Sang Clair amènera la Géhenna ! Détruisez-les où qu’ils soient !"
 doctrine_vampirethinblood_shunned_name:0 "Mal vu"
 doctrine_vampirethinblood_shunned_desc:0 "Le Sang Clair est le vecteur de la Gehenna. Ils sont évités ou mal vu."
 doctrine_vampirethinblood_accepted_name:0 "Accepté"
 doctrine_vampirethinblood_accepted_desc:0 "Le Sang Clair est comme n’importe quel autre vampire, bien que plus faible."
 doctrine_vampirethinblood_ignorant_name:0 "Ignoré"
 doctrine_vampirethinblood_ignorant_desc:0 "Nous ne connaissons pas les voies du sang de vampire." 
 doctrine_parameter_vampirethinblood_illegal:0 "Les personnages avec les [traits|E] [GetTrait('caitiff').GetName( GetPlayer )], [GetTrait('vampgeneration14').GetName( GetPlayer )], [GetTrait('vampgeneration15').GetName( GetPlayer )] et [GetTrait('vampgeneration16').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_vampirethinblood_shunned:0 "Les personnages avec les [traits|E] [GetTrait('caitiff').GetName( GetPlayer )], [GetTrait('vampgeneration14').GetName( GetPlayer )], [GetTrait('vampgeneration15').GetName( GetPlayer )] et [GetTrait('vampgeneration16').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_vampirethinblood_accepted:0 "Les personnages avec les [traits|E] [GetTrait('caitiff').GetName( GetPlayer )], [GetTrait('vampgeneration14').GetName( GetPlayer )], [GetTrait('vampgeneration15').GetName( GetPlayer )] et [GetTrait('vampgeneration16').GetName( GetPlayer )]  sont entièrement acceptés"
 doctrine_parameter_vampirethinblood_ignorant:0 "Nous ignorons les [traits|E] [GetTrait('caitiff').GetName( GetPlayer )], [GetTrait('vampgeneration15').GetName( GetPlayer )] et [GetTrait('vampgeneration16').GetName( GetPlayer )]"

 # Hunter doctrines 
 
 doctrine_vampirism_name:0 "Vampirisme"
 doctrine_vampirism_crime_name:0 "Criminelle"
 doctrine_vampirism_crime_desc:0 "Les abominations qui sucent le sang doivent être détruites"
 doctrine_vampirism_shunned_name:0 "Mal vu"
 doctrine_vampirism_shunned_desc:0 "Dommage que ces paumés ne puissent plus regarder le lever du soleil."
 doctrine_vampirism_accepted_name:0 "Accepté"
 doctrine_vampirism_accepted_desc:0 "La Famille est acceptée."
 doctrine_parameter_vampirism_illegal:0 "Les personnages avec le [trait|E] [GetTrait('vampire').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_vampirism_shunned:0 "Les personnages avec le [trait|E] [GetTrait('vampire').GetName( GetPlayer )] sont [shunned|E]"
