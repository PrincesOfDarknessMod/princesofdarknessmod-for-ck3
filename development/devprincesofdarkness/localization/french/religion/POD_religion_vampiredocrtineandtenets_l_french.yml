 doctrine_nomarriage_name:0 "Pas de Marriage"
 doctrine_nomarriage_desc:0 "Cette foi n’a pas de mariage."
 
 doctrine_onlyconcubines_name:0 "Seulement des Concubins"
 doctrine_onlyconcubines_desc:0 "Cette foi ne permet que des concubins, pas de conjoints."
 
 
