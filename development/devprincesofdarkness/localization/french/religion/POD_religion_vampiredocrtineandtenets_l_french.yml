 doctrine_lycanthropy_name:0 "Lycanthropie"
 doctrine_lycanthropy_crime_name:0 "Criminelle"
 doctrine_lycanthropy_crime_desc:0 "Les Lupins doivent être détruits.\n\Pour les Bêtes-Lunaire\n\nLes Bêtes-Lunaire, ceux-qui-change. Ils sont les Plus Anciens de tous, devant mon père ils parcouraient les terres. Ne restez pas sur leur chemin, évitez-les, ils sont mis sur notre route comme des loups dans la bergerie. Ils sont comme nous d’une sorte, et d'un autre genre. Méfiez-vous de leur terre sacrée, marchez doucement à travers leur désert. Leur morsure est comme notre morsure, leurs griffes sont comme nos griffes, ils ne s’attardent pas sur leur chemin, ils sont d’une sorte, et nous en sommes d'une autre."
 doctrine_lycanthropy_shunned_name:0 "Mal vu"
 doctrine_lycanthropy_shunned_desc:0 "Bien que surnaturel comme nous, les loups-garous ne sont pas comme nous. Pas comme nous du tout.\n\nPour les Bêtes-Lunaire\n\nLes Bêtes-Lunaire, ceux-qui-change. Ils sont les Plus Anciens de tous, devant mon père ils parcouraient les terres. Ne restez pas sur leur chemin, évitez-les, ils sont mis sur notre route comme des loups dans la bergerie. Ils sont comme nous d’une sorte, et d'un autre genre. Méfiez-vous de leur terre sacrée, marchez doucement à travers leur désert. Leur morsure est comme notre morsure, leurs griffes sont comme nos griffes, ils ne s’attardent pas sur leur chemin, ils sont d’une sorte, et nous en sommes d'une autre."
 doctrine_lycanthropy_accepted_name:0 "Accepté"
 doctrine_lycanthropy_accepted_desc:0 "Les Garou sont acceptés."
 doctrine_parameter_lycanthropy_illegal:0 "Les personnages avec le [trait|E] [GetTrait('werewolf').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_lycanthropy_shunned:0 "Les personnages avec le [trait|E] [GetTrait('werewolf').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_lycanthropy_accepted:0 "Les personnages avec le [trait|E] [GetTrait('werewolf').GetName( GetPlayer )] sont entièrement acceptés" 
 
 doctrine_magicraft_name:0 "Magie"
 doctrine_magicraft_crime_name:0 "Criminelle"
 doctrine_magicraft_crime_desc:0 "Les Mages doivent être détruits.\n\nPour les Illuminés\n\nLa Mère du Pouvoir, la sombre Lilith, est une des plus grandes, mais il y en a d’autres, et il en reste encore à venir. Ne bois pas de leur sang, pour qu’ils te prennent au piège, garde-toi d’eux, ils sont rusés. Ils connaissent la connaissance d’Adam, et la sagesse d’Eve, ils sont les porteurs de feu, les cultivateurs de terre, les éleveurs d’animaux, les porteurs d’écriture, ils sont les enfants du Soleil, les étoiles montantes. Ils chercheront à vous impliquer dans leur voyage, Résister! Résister! Leur voie ignore la soif, le sang et le corps. Ne faites pas confiance à ceux qui ont les yeux brillants vers l’aube. Rappelez-vous toujours, c’est l’aurore qui apporte votre mort"
 doctrine_magicraft_shunned_name:0 "Mal vu"
 doctrine_magicraft_shunned_desc:0 "Bien que surnaturel comme nous, les mages ne sont pas comme nous. Pas du tout comme nous.\n\nPour les Illuminés\n\nLa Mère du Pouvoir, la sombre Lilith, est une des plus grandes, mais il y en a d’autres, et il en reste encore à venir. Ne bois pas de leur sang, pour qu’ils te prennent au piège, garde-toi d’eux, ils sont rusés. Ils connaissent la connaissance d’Adam, et la sagesse d’Eve, ils sont les porteurs de feu, les cultivateurs de terre, les éleveurs d’animaux, les porteurs d’écriture, ils sont les enfants du Soleil, les étoiles montantes. Ils chercheront à vous impliquer dans leur voyage, Résister! Résister! Leur voie ignore la soif, le sang et le corps. Ne faites pas confiance à ceux qui ont les yeux brillants vers l’aube. Rappelez-vous toujours, c’est l’aurore qui apporte votre mort"
 doctrine_magicraft_accepted_name:0 "Accepté"
 doctrine_magicraft_accepted_desc:0 "Les Mages sont acceptés."
 doctrine_parameter_magicraft_illegal:0 "Les personnages avec le [trait|E] [GetTrait('mage').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_magicraft_shunned:0 "Les personnages avec le [trait|E] [GetTrait('mage').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_magicraft_accepted:0 "Les personnages avec le [trait|E] [GetTrait('mage').GetName( GetPlayer )] sont entièrement acceptés" 
 
 doctrine_glamour_name:0 "Glamour"
 doctrine_glamour_crime_name:0 "Criminelle"
 doctrine_glamour_crime_desc:0 "Les Fées doivent être détruites."
 doctrine_glamour_shunned_name:0 "Mal vu"
 doctrine_glamour_shunned_desc:0 "Bien que surnaturel comme nous, les Fées ne sont pas comme nous. Pas comme nous du tout.\n\nPour les Sauvages\n\nDes fous, des sauvages, je dis, premièrement, ne buvez pas de leur sang ! Mais regardez-les, comme ils sont beaux dans leur désert, ils sont enchanteurs dans leur mystère, ils sont mortels dans leurs compétences de guerre. Seuls parmi les créatures de la nuit, ils me tenaient compagnie dans la terre et m’apportaient de l’eau quand j’avais soif et je pouvais encore respirer. Comme Moi, ils ont été chassés, Comme Mes Enfants, ils sont sans abri, Comme Mes Enfants, ils mouillent, Comme ma Mère et Père, ils en savent trop, mais ils gardent leurs propres conseils, et, d’entre eux, Je dis marquez-moi bien, taisez-vous ! Ne dis rien. Regarde et apprends."
 doctrine_glamour_accepted_name:0 "Accepté"
 doctrine_glamour_accepted_desc:0 "Les Fées sont acceptées.\n\nPour les Sauvages\n\nDes fous, des sauvages, je dis, premièrement, ne buvez pas de leur sang ! Mais regardez-les, comme ils sont beaux dans leur désert, ils sont enchanteurs dans leur mystère, ils sont mortels dans leurs compétences de guerre. Seuls parmi les créatures de la nuit, ils me tenaient compagnie dans la terre et m’apportaient de l’eau quand j’avais soif et je pouvais encore respirer. Comme Moi, ils ont été chassés, Comme Mes Enfants, ils sont sans abri, Comme Mes Enfants, ils mouillent, Comme ma Mère et Père, ils en savent trop, mais ils gardent leurs propres conseils, et, d’entre eux, Je dis marquez-moi bien, taisez-vous ! Ne dis rien. Regarde et apprends."
 doctrine_parameter_glamour_illegal:0 "Les personnages avec le [trait|E] [GetTrait('fae').GetName( GetPlayer )] sont [criminals|E]"
 doctrine_parameter_glamour_shunned:0 "Les personnages avec le [trait|E] [GetTrait('fae').GetName( GetPlayer )] sont [shunned|E]"
 doctrine_parameter_glamour_accepted:0 "Les personnages avec le [trait|E] [GetTrait('fae').GetName( GetPlayer )] sont entièrement acceptés" 
  
 doctrine_supehunting_name:0 "Chasser les Sorcières"
 doctrine_supehunting_crime_name:0 "Criminelle"
 doctrine_supehunting_crime_desc:0 "Les chasseurs de sorcières doivent être détruits.\n\nQuand la Croix a un but, trouvez votre sécurité."
 doctrine_supehunting_shunned_name:0 "Mal vu"
 doctrine_supehunting_shunned_desc:0 "Mieux vaut ne pas attirer leur attention.\n\nQuand la Croix a un but, trouvez votre sécurité."
 doctrine_supehunting_accepted_name:0 "Accepté"
 doctrine_supehunting_accepted_desc:0 "Les chasseurs de sorcières sont acceptés."
