 doctrine_supehunting_ignorant_name:0 "Ignoré"
 doctrine_supehunting_ignorant_desc:0 "Ignore l’interdiction de la chasse aux sorcières."
 doctrine_parameter_supehunting_ignorant:0 "Les personnages avec le [trait|E] [GetTrait('supehunter').GetName( GetPlayer )] sont inconnues aux pratiques de cette foi." 
 
 #Vampiric Tenets
 tenet_vampiremasquerade_name:0 "Masquarade"
 tenet_vampiremasquerade_desc:0 "Le Silence du Sang. Tu ne révéleras pas ta vraie nature à ceux qui ne sont pas du Sang. En faisant cela, tu renonceras à tes prétentions au Sang."
 
 tenet_vampireprogeny_name:0 "Descendance"
 tenet_vampireprogeny_desc:0 "Tu n’auras qu’un autre Sire avec la permission de ton Ancien. Si tu en crées un autre sans la permission de ton Ancien, toi et ta descendance serez tués."
 
 tenet_vampiredestruction_name:0 "Destruction"
 tenet_vampiredestruction_desc:0 "Tu n'es pas destiné à détruire un autre de ton espèce. Le droit de destruction n’appartient qu’à ton Ancien. Seul l’aîné d’entre vous appellera la Chasse au Sang."

 tenet_vampiretouchstone_name:0 "Pierre Angulaire"
 tenet_vampiretouchstone_desc:0 "Une famille peut choisir une valeur comme Pierre Angulaire pour aider à garder son lien avec l’humanité. La famille gagne alors la piété. Il y a d’autres événements liés à la Pierre Angulaire."
 
 tenet_vampireremorse_name:0 "Remord"
 tenet_vampireremorse_desc:0 "Un membre de la Famille réfléchit à ses actions et se sent fou de regrets de part leur comportement monstrueux, gagnant de la piété." 
 
 tenet_vampireblushoflife_name:0 "Plaisir de Vivre"
 tenet_vampireblushoflife_desc:0 "Un membre de la Famille peut imiter la vie. Cela aide leur mascarade ainsi que de rappeler ce que c’est que d’être humain et ainsi gagner la piété."  
 
 tenet_vampirenecromanticexperimention_name:0 "Expérimentation Necromantique"
 tenet_vampirenecromanticexperimention_desc:0 "Remarquez bien : il y a un endroit au-delà de l’esprit, au-delà de la vie qui est l’Obscurité, l’Ombre, et là demeurent les Ombres. Un îlot, une forteresse, un Monde de Mort, j’y ai voyagé à travers un chemin de malheur et j’ai vu le roi redouté de la ville de Stygie alors qu’il était assis à la cour. J’ai vu les cagoules sans visage traverser la rivière Styx. Ils grouillent autour de nous comme des mouches sur un corps putréfiant, et comme nous, se nourrissent de peur, d’extase, et de colère. Ils sont morts, mais morts-vivants, et ils sont plus proches de nous que nous ne le saurons jamais. Le Sang de mon Frère crie vers moi pendant que je dors pendant que le Soleil traverse le ciel, j’entends mon frère, second-boun Abel, crier. Remarquez bien les esprits de ceux qui sont morts, sachez que leur force n’est pas la vôtre, écoutez leurs gémissements : ils portent la sagesse. N’écoutez pas leurs chansons : c’est l’Oblivion.\nLes exécutions génèrent à la fois de la résonnance mélancolique et de la piété."  
 
 tenet_vampirenemetamorphopsisexperimention_name:0 "Expérimentation Necromantique"
 tenet_vampirenemetamorphopsisexperimention_desc:0 "Les exécutions génèrent à la fois de la résonnance colérique et de la piété."  
 
 tenet_vampireauctoritasritae_name:0 "Auctoritas Ritae"
 tenet_vampireauctoritasritae_desc:0 "Une collection de treize rituels pratiqués par tous les membres du Sabbat."
 
 tenet_vampireamaranth_name:0 "Amaranth"
 tenet_vampireamaranth_desc:0 "Pratique de la Diablerie"
 
 tenet_vampiremonomacy_name:0 "Monomacy"
 tenet_vampiremonomacy_desc:0 "Un duel honorable qui se termine en diablerie. Le rituel de Monomacy sera utilisé pour régler les différends entre tous les sabbats."
 
 tenet_infernalism_name:0 "Infernalisme"
 tenet_infernalism_desc:0 "Investiture démoniaque à travers des pactes avec les démons."
 
 tenet_vampireinquisition_name:0 "Inquisition"
 tenet_vampireinquisition_desc:0 "Marquez bien les Enfants de l’Unique En Haut, les Chérubins, les Séraphins, les Archanges, où leur toucher vous brûlera comme le fait la Flamme de Michel. Marquez bien les Enfants de l’Un En Bas, le Parent du Serpent, où leur contact vous brûlera aussi, et leurs langues vous tromperont et vous tromperont. Chassez et détruisez les infernalistes où que vous les trouviez."
 
 tenet_pleasure_name:0 "Plaisir"
 tenet_pleasure_desc:0 "La poursuite hédoniste de l’ecstasy"
 
 tenet_cruelty_name:0 "Cruauté"
 tenet_cruelty_desc:0 "Le plaisir que procure la douleur"
 
 tenet_quiritare_name:0 "Quiritare"
 tenet_quiritare_desc:0 "Résister à la Bête ou tenter de l’apaiser est impossible, et donc se livrer à elle complètement, perfectionner sa volonté." 
  
 tenet_legacyoftrinity_name:0 "Héritage de la Trinité"
 tenet_legacyoftrinity_desc:0 "Le Codex dicte la supériorité des trois clans principaux : Toreador, Tzimsice et Ventrue. Les membres des autres clans demandent la pétition des Quaesitous pour engendrer un enfant; les membres des trois clans principaux sont autorisés à engendrer qui ils voulaient. Seuls les membres des trois clans principaux peuvent léguer un domaine à un autre vampire et que chaque vampire dans ce domaine a le devoir de faire respecter le Codex."
 
 tenet_legacyofashes_name:0 "Héritage des Cendres"
 tenet_legacyofashes_desc:0 "Le Codex dicte que quiconque tue un membre des trois principaux clans aura une chasse au sang à leur disposition."

 tenet_legacyofshadow_name:0 "Héritage des Ombres"
 tenet_legacyofshadow_desc:0 "Le Codex dicte que les Caïnites ne révèle pas leur vraie nature à ceux qui ne sont pas du Sang. En faisant cela, ils doivent renoncer à leurs revendications de Sang." 
 
 tenet_oaths_name:0 "Assermenté"
 tenet_oaths_desc:0 "Nos lois sont les commandements de nos anciens, et les commendements de Caïn sur tous. Les serments sont la base de l’ordre féodal. Un serment est le lien le plus sacré qu’un seigneur peut faire. Un parjure fort menace toute la société alors qu’ils dégénèrent la Bête. Les Assermentés ont casus belli pour faire la guerre au parjures et les dépouiller de leurs titres."
 
 tenet_vampirehighclans_name:0 "Hauts-Clans"
 tenet_vampirehighclans_desc:0 "Les Hauts-Clans sont supérieurs aux Bas-Clans. Les Bas-Clans sont des dégénérés qui finiront par succomber à la Bête. Ils sont mal adaptés au pouvoir ou à la compagnie polie."
 
 tenet_vampireselectivefeeding_name:0 "Alimentation Sélective"
 tenet_vampireselectivefeeding_desc:0 "Tu ne nourriras pas les Bêtes-Lunaires, les Sauvages, les malades, les fous, ou les ivrognes.\n\nLes Bêtes-Lunaire, ceux-qui-change. Ils sont les Plus Anciens de tous, devant mon père ils parcouraient les terres. Ne restez pas sur leur chemin, évitez-les, ils sont mis sur notre route comme des loups dans la bergerie. Ils sont comme nous d’une sorte, et d'un autre genre. Méfiez-vous de leur terre sacrée, marchez doucement à travers leur désert. Leur morsure est comme notre morsure, leurs griffes sont comme nos griffes, ils ne s’attardent pas sur leur chemin, ils sont d’une sorte, et nous en sommes d'une autre.\n\nDes fous, des sauvages, je dis, premièrement, ne buvez pas de leur sang ! Mais regardez-les, comme ils sont beaux dans leur désert, ils sont enchanteurs dans leur mystère, ils sont mortels dans leurs compétences de guerre. Seuls parmi les créatures de la nuit, ils me tenaient compagnie dans la terre et m’apportaient de l’eau quand j’avais soif et je pouvais encore respirer. Comme Moi, ils ont été chassés, Comme Mes Enfants, ils sont sans abri, Comme Mes Enfants, ils mouillent, Comme ma Mère et Père, ils en savent trop, mais ils gardent leurs propres conseils, et, d’entre eux, Je dis marquez-moi bien, taisez-vous ! Ne dis rien. Regarde et apprends."
 #doctrine_parameter_vampireselectivefeeding:0 ""
 
 tenet_enkrateia_reie_sophrosyne_name:0 "Enkrateia Reie Sophrosyne"
 tenet_enkrateia_reie_sophrosyne_desc:0 "Une approche intellectuelle de la non-violence, la Voie se concentre sur trois concepts fondamentaux considérés comme des caractéristiques essentielles recherchées dans la progéniture potentielle des Brujah dans les nuits de Carthage: enkrateia, reie, et sophrosyne. Enkrateia se réfère à la force intérieure. Il ne suffit pas pour le philosophe d’accepter passivement les frustrations qui viennent sur son chemin, comme la Voie de l’Humanité l’exige. Au lieu de cela, elle doit aiguiser sa raison dans une épée et sa volonté dans un bouclier contre les forces qui la feraient dégénérer.\n\nEn termes pratiques, cela signifie que les Philosophes ont généralement une forte Volonté et une forte Maîtrise de Soi ou poursuivent agressivement ces traits.\n\nReie fait référence au courage moral. Le philosophe ne doit pas se dérober à sa responsabilité de poursuivre soit l’illumination ou le caractère moral par peur de la frénésie ou d’autres dégradations. Au contraire, elle doit affronter des situations difficiles avec la raison et l’autodiscipline, en évitant l’impétuosité qui définit le Brujah moderne.\n\nSophrosyne signifie contrôle du soi et représente le but idéalisé de tous les philosophes : la maîtrise de la rage de Brujah. Cela signifie aussi que le Brujah s’est engagé dans une éternité de développement mental, spirituel et physique. Les philosophes développent sophrosyne en travaillant à améliorer les attributs physiques et mentaux et les capacités, plutôt que de se concentrer sur les disciplines ou les traits sociaux."
 
 tenet_conviction_and_instinct_name:0 "Conviction et Instinct"
 tenet_conviction_and_instinct_desc:0 "Les vampires ne perdent aucune piété en blessant sérieusement ou en tuant des victimes mortelles. Les vampires ne perdent aucune piété en frénésie."
 tenet_conviction_and_selfcontrol_name:0 "Conviction et Self-Control"
 tenet_conviction_and_selfcontrol_desc:0 "Les vampires ne perdent aucune piété en tuant des victimes mortelles. Les vampires perdent de la piété en frénésie."
 tenet_conscience_and_selfcontrol_name:0 "Conscience et Self-Control"
 tenet_conscience_and_selfcontrol_desc:0 "Les vampires perdent de la piété en tuant des victimes mortelles. Les vampires perdent de la piété en frénésie."
 tenet_conscience_and_instinct_name:0 "Conscience et Instinct"
 tenet_conscience_and_instinct_desc:0 "Les vampires perdent de la piété en tuant des victimes mortelles. Les vampires ne perdent aucune piété en frénésie."
 tenet_orun_and_aye_name:0 "Orun et Aye"
 tenet_orun_and_aye_desc:0 "Contrairement à la Famille, aucun Laibon ne suit la Voie de l’Humanité, ni aucune autre Voie de l’Illumination d’ailleurs. Au lieu de cela, les Laibons forge leurs vies autour de deux Voies distinctes de la Moralité : Aye, qui est leur moralité envers l’humanité, et Orun, qui est leur moralité envers le surnaturel. Selon leur position sur ces deux échelles, leur apparence et leur puissance surnaturelle fluctuent. Cette différence fondamentale sépare à jamais le Laibon du Caïnite 'typique'."
 
 tenet_pursuit_of_knowledge_name:0 "Quête du Savoir"
 tenet_pursuit_of_knowledge_desc:0 "L'obsession pour la recherche du savoir. Les péchés comprennent : ne pas étudier lorsqu’on lui en donne l’occasion, refuser de poursuivre des expériences, refuser de partager des idées avec d’autres sur la Voie."
 
 tenet_greed_is_good_name:0 "La Cupidité, c'est bien"
 tenet_greed_is_good_desc:0 "L’or c'est le pouvoir, et donc utiliser l’accumulation de la richesse pour gagner de l’influence et donc satisfaire leur Bête."
 
 tenet_scorched_heart_name:0 "Cœur de Pierre"
 tenet_scorched_heart_desc:0 "Développé par Rathmonicus, ils contrôlent leur Bête en éradiquant systématiquement toutes les émotions dans le cœur de vampire."
 
 tenet_isolation_name:0 "Isolation"
 tenet_isolation_desc:0 Développé par Rathmonicus, ils contrôlent leur Bête en éradiquant systématiquement toutes les émotions dans le cœur de vampire."
 
 tenet_vengeance_of_lilith_name:0 "Vengeance de Lilith"
 tenet_vengeance_of_lilith_desc:0 "Un passage dans les Révélations de la Mère Noire, qui décrit comment l’enfant de Caïn (représenté allégoriquement comme les treize Fondateurs du Clan) a détruit le jardin de Lilith et assassiné ses enfants. Seul Toreadou et Nosferatu s’abstinrent de la destruction et couvrirent, les visages des enfants morts, de voiles en signe de respect. Ainsi, ils sont exemptés de la vengeance des disciples de Lilith."
 
 tenet_continued_life_name:0 "Continuation de la Vie"
 tenet_continued_life_desc:0 "Certains morts-vivants essaient de continuer leur vie mortelle autant que possible. Bien que cela les aide à rester en contact avec leur ancienne vie mortelle, cela augmente l’exposition de la Mascarade. Utiliser des pouvoirs mystiques continuellement pour apparaître vivant augmentera également la soif." 
  
 tenet_vengeance_of_samiel_name:0 "Vengeance of Samiel"
 tenet_vengeance_of_samiel_desc:0 "Le plus grand guerrier de Saulot, le fondateur martyrisé Samiel aurait écrit ce texte de sa propre main. Selon la légende, Samiel a reçu une visite de Michel, commandant des Armées Célestes, alors que Saulot était absent. L’archange ordonna au roi guerrier de rédiger le Code et d’y inclure les rituels nécessaires à la force et au sang des nouveaux guerriers. Samiel a été tué à la fin de la Seconde Guerre Baali, tout comme plus de la moitié de ses disciples."
 
 tenet_devoted_to_michael_name:0 "Consacré à Michel"
 tenet_devoted_to_michael_desc:0 "La Voie de l’Archange était une Voie de la Voie du Ciel populaire à Byzance au 13ème siècle. Il révère la mémoire du patriarche déchu de Constantinople, Michel Strogoff. Les disciples de la voie sont appelés Michélites."  
 
 special_doctrine_three_pillars_kindred_name:0 "Trois Piliers"
 special_doctrine_three_pillars_kindred_desc:0 "La base de la société féodale est le château, l’église et la ville. La société de la Famille reflète cela avec la Voiee des Rois, Voie du Ciel et Voie de l’Humanité engagée dans la tolérance mutuelle."
 doctrine_parameter_hostility_override_special_doctrine_three_pillars_kindred:0 "D’autres [faiths|E] des familles qui ont la doctrine des trois piliers sont considérées [GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V] au lieu d'#V Hostile#!" 
 
