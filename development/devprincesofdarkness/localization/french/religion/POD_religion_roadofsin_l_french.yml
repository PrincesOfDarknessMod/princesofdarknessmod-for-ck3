 #Pécheur-Group Faiths
 viapeccati:0 "Via Peccati"
 viapeccati_adj:0 "Peccati"
 viapeccati_adherent:0 "Pécheur"
 viapeccati_adherent_plural:0 "Pécheurs"
 viapeccati_desc:0 "Les adeptes de Via Peccati contrôlent leur Bête en se livrant à leurs caprices et désirs, peu importe qui ils blessent. Le fait de ne pas faire ce qui leur plaît aggrave leur condition, ce qui signifie que la morale, l’éthique et les lois tombent habituellement au bord du chemin. Les adeptes de Via Peccati ne sont pas mauvais en soi; ils sont tout simplement complaisants."

 viavoluptuous:0 "Via Voluptuous"
 viavoluptuous_adj:0 "Voluptarius"
 viavoluptuous_adherent:0 "Voluptueux"
 viavoluptuous_adherent_plural:0 "Voluptueux"
 viavoluptuous_desc:0 "Les Pécheurs de la Route du Plaisir sont les plus hédonistes de ceux qui suivent la Route du Péché. Pour eux, le plaisir est tout ce qui concerne leur existence, et absolument rien n’est tabou."

 viacrudelitas:0 "Via Crudelitas"
 viacrudelitas_adj:0 "Crudelitas"
 viacrudelitas_adherent:0 "Sans-coeur"
 viacrudelitass_adherent_plural:0 "Sans-coeur"
 viacrudelitas_desc:0 "Les disciples du Sentier de la Cruauté sont les plus cyniques et haineux des Pécheurs. Les pécheurs ici ne croient ni à la miséricorde, ni à la compassion, ni à la pitié. Au contraire, leur seul plaisir est dérivé de la douleur des autres."

 viaadversarius:0 "Via Adversarius"
 viaadversarius_adj:0 "Adversarius"
 viaadversarius_adherent:0 "Adversaire"
 viaadversarius_adherent_plural:0 "Adversaires"
 viaadversarius_desc:0 "La 'Route du Diable' ne doit pas être confondu avec la soi-disant Via Diabolis, ces Pécheurs travaillent pour se garder d’être manipulés. Des monstres du contrôle ultime, ils iront jusqu’au bout pour protéger leur libre arbitre et, exceptionnellement, le libre arbitre des autres. Beaucoup les considèrent comme les plus 'agréables' des pécheurs."

 viadiabolis:0 "Via Diabolis"
 viadiabolis_adj:0 "Diabolis"
 viadiabolis_adherent:0 "Démon"
 viadiabolis_adherent_plural:0 "Démons"
 viadiabolis_desc:0 "Étant une route intrinsèquement destructrice, la Via Diabolis n’est pas considérée comme un chemin à prendre à la légère; ceux qui osent la suivre se livrent à toutes sortes de débauches et de destruction. Beaucoup ne sont pas vraiment mauvais en soi, autant que croire à une non-violence vertueuse est une poursuite infructueuse. Certains, cependant, ont pris le rôle du diable au sérieux, même en se faisant appeler diables incarnés et serviteurs de Satan. Les Baali en particulier sont associés à la Via Diabolis."

 viaprometheus:0 "Via Prometheus"
 viaprometheus_adj:0 "Prométhéen"
 viaprometheus_adherent:0 "Prométhéen"
 viaprometheus_adherent_plural:0 "Prométhéen"
 viaprometheus_desc:0 "Aussi appelés 'Hérauts du Feu', ils sont une secte de Caïnites qui rêvent de recréer Carthage et de sont harmonie entre les Vampires et les Mortels qui lui est associée. Sans surprise, de nombreux membres sont Brujah. Depuis, beaucoup de membres des Grands Clans considèrent ces visions comme une trahison, les Prométhéens sont forcés d’agir secrètement."
 
 viafurores:0 "Via Furores"
 viafurores_adj:0 "Furores"
 viafurores_adherent:0 "Furores"
 viafurores_adherent_plural:0 "Furores"
 viafurores_desc:0 "Les membres de cette secte ont la réputation d’être les hors-la-loi des Caïnites. Condamnés par la plupart des princes comme des voleurs et des fauteurs de troubles, ils existent en marge de la société des vampires, détruisant une existence maigre comme leurs homologues mortels. Les Furores sont considérés comme chaotiques, mais ils peuvent rassembler un niveau de passion pour leur cause invisible comme personnes dans la société caïnite."

 viaquiritare:0 "Via Quiritare"
 viaquiritare_adj:0 "Quiritare"
 viaquiritare_adherent:0 "Crieur"
 viaquiritare_adherent_plural:0 "Crieurs"
 viaquiritare_desc:0 "Les plus fous des Pécheurs et les contraires de la Via Adversarius, les disciples de la Route des Cris croient que puisqu’ils sont déjà damnés, ils sont aussi déjà en proie à la Bête, et se laissent donc manipuler par elle pour exécuter les ordres de la Bête. Ce sont essentiellement des exemples ambulants de l’Enfer sur Terre ; même d’autres pécheurs répugnent à s’associer à ces fous."
 
 tariqelshaitan:0 "Tariq el-Shaitan"
 tariqelshaitan_adj:0 "Sheitan"
 tariqelshaitan_adherent:0 "Sheitan"
 tariqelshaitan_adherent_plural:0 "Sheitans"
 tariqelshaitan_desc:0 "Le chemin du diable dans le monde islamique. Chassés presque jusqu’à l’extinction par les guerriers des clans Salubri et Assamite, ces monstres ont depuis appris à jouer sur le long terme."
 
 pathoftheeightfoldwheel:0 "Route de la roue octuple"
 pathoftheeightfoldwheel_adj:0 "Druide"
 pathoftheeightfoldwheel_adherent:0 "Druide"
 pathoftheeightfoldwheel_adherent_plural:0 "Druides"
 pathoftheeightfoldwheel_desc:0 "La Route de l'octuple roue s’inspire du paganisme celtique, avec un accent particulier sur le druidisme. Ils mettent beaucoup d’importance à honorer les dieux et les esprits de la nature, servant l’équilibre dans toutes choses, et un calendrier tournant de festivals astronomiques."
 
 pathofwatchfulgods:0 "Via Deorum Vigilans"
 pathofwatchfulgods_adj:0 "Vaticinateur"
 pathofwatchfulgods_adherent:0 "Vaticinateur"
 pathofwatchfulgods_adherent_plural:0 "Vaticinateurs"
 pathofwatchfulgods_desc:0 "La Route des Dieux Vigilants révère le panthéon païen des anciens Grecs et Romains, bien que les panthéons des différentes traditions païennes s’orientent également sur la Route. Les vampires sur ce chemin se consacrent au service des dieux en faisant des sacrifices réguliers, en honorant et en protégeant ce que les dieux jugent sacré, et en adhérant à des codes d’honneur stricts."
 
 viacain:0 "Hérésie Caïnite"
 viacain_adj:0 "Caïnite"
 viacain_adherent:0 "Caïnite"
 viacain_adherent_plural:0 "Caïnites"
 viacain_desc:0 "L’hérésie caïnite est une croyance hérétique qui est pratiquée principalement par des caïnites chrétiens, principalement mais pas exclusivement par des vampires de Lasombra. Il est fortement imprégné de gnosticisme et emploie un troupeau de prêtres et de clercs humains. Historiquement, l’hérésie a émergé de divers cultes de sang dans lequel les vampires ont été adorés comme des dieux. Les vampires, en raison de leurs corps incorruptibles, de leur indépendance du monde matériel et de la puissance que leurs disciplines accordent, ont été considérés par certains gnostiques comme des créatures de spiritualité supérieure et ont été recherchés pour des enseignements en échange de vitae."
 
 viahyron:0 "Via Hyron"
 viahyron_adj:0 "Abelene"
 viahyron_adherent:0 "Abelene"
 viahyron_adherent_plural:0 "Abelenes"
 viahyron_desc:0 "La Route de l'Essaim' est suivie presque exclusivement par les Baali de l’Ordre de Moloch. La Route prêche la loyauté globale à la lignée dans son ensemble et à son père en particulier. La principale raison est que les Grandes Œuvres que les Baali veulent réaliser ne peuvent être revendiquées seules ou lorsqu’elles interfèrent avec le travail des autres. Le vampire a dû laisser les voix de l’essaim à l’intérieur de son âme afin de comprendre les rêves des êtres de l’Obscurité Extérieure et les garder endormis. En dehors de cela, la plupart des autres vampires détruiraient activement un Baali s’il était assez fou pour se révéler comme un adhérent."

 viatartaros:0 "Via Tártaros"
 viatartaros_adj:0 "Via Tártaros"
 viatartaros_adherent:0 "Tártarosin"
 viatartaros_adherent_plural:0 "Tártarosins"
 viatartaros_desc:0 "Méfiez-vous, voici les démons. Les Clefs de nos prisons de chair et d’os, ne peuvent pas être trouvées par l’étude et l’expérience seule; au lieu de cela, nous devons chercher, et non prendre, cette connaissance possédée par ceux qui se tiennent au-delà du seuil du monde. Certains internalistes peuvent nous appeler, s’ils connaissaient notre véritable intention, à ascensionner au-delà de la prison dans laquelle nous sommes nés deux fois. Cette route est sombre et pleine de périls, et la seule lumière que nous pouvons trouver est un terrible rayonnement perçant, qui menace de brûler notre chair et d’exsanguinifier notre esprit."

