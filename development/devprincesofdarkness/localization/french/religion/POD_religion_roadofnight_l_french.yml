 #Nihiliste-Group Faiths
 vianoctis:0 "Via Noctis"
 vianoctis_adj:0 "Noctis"
 vianoctis_adherent:0 "Nihiliste"
 vianoctis_adherent_plural:0 "Nihilistes"
 vianoctis_desc:0 "Les Nihilistes ressentent le poids de la malédiction de Caïn et leur propre damnation, encore plus que ceux qui suivent la Via Caeli. Tout comme les Éxaltés, les Nihilistes cherchent la rédemption et le pardon, et pour la mériter, il faut souffrir et se purifier. Cependant, au lieu des voies assez bénignes des Éxaltés, les Nihilistes parcourent activement le monde de l’homme, punissant et tuant les pécheurs mortels."

 tariqallail:0 "Tariq al-Lail"
 tariqallail_adj:0 "Asdiqa al-Lail"
 tariqallail_adherent:0 "Inspiré"
 tariqallail_adherent_plural:0 "Inspirés"
 tariqallail_desc:0 "Les Amis de la Nuit parmi la famille islamique. Assez rare au commencement, le schisme entre la partie chrétienne et musulmane du clan a fait des exclus dans les deux groupes."

 pathoftheheavenlyabode:0 "Voie de la Demeure Céleste"
 pathoftheheavenlyabode_adj:0 "Céleste"
 pathoftheheavenlyabode_adherent:0 "Vengeur"
 pathoftheheavenlyabode_adherent_plural:0 "Vengeurs"
 pathoftheheavenlyabode_desc:0 "Les disciples de cette voie croient que, pour sauver vraiment une âme, le corps mortel doit être détruit dès que l’âme a trouvé la rédemption, afin d’empêcher la corruption."

