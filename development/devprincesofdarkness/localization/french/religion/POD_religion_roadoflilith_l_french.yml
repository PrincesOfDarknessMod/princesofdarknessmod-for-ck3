 #Lilin-Group Faiths
 derechlilit:0 "Derech Lilit"
 derechlilit_adj:0 "Lilin"
 derechlilit_adherent:0 "Lilin"
 derechlilit_adherent_plural:0 "Lilins"
 derechlilit_desc:0 "La Voie de Lilith est dédiée à la figure rabbinique de Lilith, qui apparaît dans de multiples sources nodistes ainsi que dans les traditions portées par des cultes cachés. La plupart des cultes décomposent Lilith en principes fondamentaux : de la douleur à la création. Pour créer, il faut blesser et être blessé. C’est le principe fondamental de la vie elle-même."

 viafaciendi:0 "Via Faciendi"
 viafaciendi_adj:0 "Faciendi"
 viafaciendia_adherent:0 "Fabricant"
 viafaciendi_adherent_plural:0 "Fabricants"
 viafaciendi_desc:0 "La Voie de la Fabrication est dédié à trouver et à propager les enfants-démons Lilith, en puisant dans la tradition biblique de Lilith comme la Mère des Monstres."

 viaspinae:0 "Via Spinae"
 viaspinae_adj:0 "Bahari"
 viaspinae_adherent:0 "Bahari"
 viaspinae_adherent_plural:0 "Baharis"
 viaspinae_desc:0 "La Voie des Épines est axé sur la douleur physique. Les membres étudient la douleur logiquement, cherchant à codifier les points de rupture et les moyens de briser le seuil de volonté d’une victime pour lui faire voir la vérité douloureuse de Lilith."

 viacalantica:0 "Via Calantica"
 viacalantica_adj:0 "Ki-sikil-lil-la-ke"
 viacalantica_adherent:0 "Ki-sikil-lil-la-ke"
 viacalantica_adherent_plural:0 "Ki-sikil-lil-la-ke"
 viacalantica_desc:0 "La Voie des Voiles se concentre sur Lilith comme rebelle et contre-figure du Dieu abrahamique et de Caïn. Ils sont les plus virulents des Lilins, souvent plus guerriers que savants."

