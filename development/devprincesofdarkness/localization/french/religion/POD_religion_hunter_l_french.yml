 hunters_religion_desc:0 "L’humanité n’a pas encore abandonné son monde. Ces braves âmes combattent les abominations qui prétendent les asservir."

 #Hunter-Group Faiths
 
 shadowinquisition:0 "Inquisition des Ombres"
 shadowinquisition_adj:0 "Inquisition"
 shadowinquisition_adherent:0 "Inquisiteur"
 shadowinquisition_adherent_plural:0 "Inquisiteurs"
 shadowinquisition_desc:0 "L’Inquisition des Ombres est une campagne secrète orchestrée par l’Église catholique pendant la période médiévale sombre. Contrairement à l’Inquisition papale, qui cible les hérétiques, l’Inquisition des Ombres cible les vampires, les loups-garous, les mages et autres "serviteurs de Satan" pour la destruction ou le salut. Son existence sera de courte durée, mais ses succès changeront le monde caïnite pour toujours."
 
 calomenasforsaken:0 "Damnés de Calomena"
 calomenasforsaken_adj:0 "Damné"
 calomenasforsaken_adherent:0 "Damné"
 calomenasforsaken_adherent_plural:0 "Damné"
 calomenasforsaken_desc:0 "Fléaux de la race caïnite, les Damnés sont un groupe de chasseurs qui croient à l’hérésie bogomile. Ils croient que Calomena était la sœur de Caïn, et ils doivent détruire les enfants de Caïn — les vampires. Ils croient en une philsophie dualiste et observent également la pauvreté sévère soutenue par la plupart des Bogomils."
 
