 #Exalté-Group Faiths
 
 viacaeli:0 "Via Caeli"
 viacaeli_adj:0 "Exalté"
 viacaeli_adherent:0 "Exalté"
 viacaeli_adherent_plural:0 "Exaltés"
 viacaeli_desc:0 "Selon l’Évangile de Laodicée, un texte sacré caïnite, les principes de certaines routes de la Via Caeli proviennent de Caïn lui-même. Bien que Caïn ait été maudit par Dieu, il était aussi plus proche de Dieu que toute autre parents qui ait jamais existé. Les disciples de la Voie du Paradis tentent de contrôler leur Bête par la dévotion religieuse."

 viadivinitatis:0 "Via Divinitatis"
 viadivinitatis_adj:0 "Diviniste"
 viadivinitatis_adherent:0 "Diviniste"
 viadivinitatis_adherent_plural:0 "Divinistes"
 viadivinitatis_desc:0 "Les zélotes des Exaltés et des prédécesseurs du Sabbat, adeptes de cette Voie se considèrent favorisés par Dieu plutôt que maudits par Lui, les adeptes de la Divinité cherchent à contrôler les mortels et font appel au plus grand nombre de Caïnites possible pour rejoindre la Via Caeli. Cette voie est considérée par beaucoup comme la plus déviante des quatre."

 viapenaculum:0 "Via Penaculum"
 viapenaculum_adj:0 "Penaculum"
 viapenaculum_adherent:0 "Penitent"
 viapenaculum_adherent_plural:0 "Penitents"
 viapenaculum_desc:0 "Les fidèles qui suivent le chemin de la pénitence se considèrent indignes de Dieu, la plus basse des créatures humbles à ses yeux. Aucune Voie ne prend les actes de contrition aussi sérieusement, car c’est la seule façon que ces Caïnites voient pour gagner l’illumination et les faveurs aux yeux de Dieu."

 viavindicta:0 "Via Vindicta"
 viavindicta_adj:0 "Vindicta"
 viavindicta_adherent:0 "Croisé"
 viavindicta_adherent_plural:0 "Croisés"
 viavindicta_desc:0 "Ces familles se considèrent comme la Main Vengeuse de Dieu, détruisant ceux qui l’ont offensé. Tous ceux qui sont considérés comme mauvais ou infidèles à Dieu doivent être détruits. Ils ont tendance à chasser les Caïnites qu’ils considèrent comme corrompus."

 viadolorosa:0 "Via Dolorosa"
 viadolorosa_adj:0 "Dolorosa"
 viadolorosa_adherent:0 "Martyr"
 viadolorosa_adherent_plural:0 "Martyrs"
 viadolorosa_desc:0 "Les martyrs de la Voie des Larmes, ces Exaltés s’offrent comme des sacrifices morts-vivants pour que les autres n’aient pas à souffrir. Ils se sacrifieront volontairement pour arrêter toute corruption causée par quelque chose considéré comme profane, en particulier les démons ou d’autres Caïnites."

 viachristi:0 "Via Christi"
 viachristi_adj:0 "Christi"
 viachristi_adherent:0 "Chrétien"
 viachristi_adherent_plural:0 "Chrétiens"
 viachristi_desc:0 "Les caïnites qui étaient chrétiens dans la vie peuvent choisir d’adhérer à la Voie du Christ, sous l’hypothèse que le plan de Dieu pour le monde inclut les vampires, et rester obéissant à sa volonté les aidera à contrôler la Bête."
 
 derechchaim:0 "Derech Chaim"
 derechchaim_adj:0 "Derech Chaim"
 derechchaim_adherent:0 "estrie"
 derechchaim_adherent_plural:0 "estries"
 derechchaim_desc:0 "Les caïnites qui étaient juifs dans la vie peuvent choisir de suivre la Voie de la Vie. Ils croient que Hashem a créé des vampires avec le reste du monde, et donc les lois de la Torah s’appliquent toujours à eux et fournissent des moyens de contrôler la Bête."
 
 codeofsamiel:0 "Code de Samiel"
 codeofsamiel_adj:0 "Samielite"
 codeofsamiel_adherent:0 "Samielite"
 codeofsamiel_adherent_plural:0 "Samielites"
 codeofsamiel_desc:0 "Le plus grand guerrier de Saulot, le fondateur martyrisé Samiel aurait écrit cette voie de sa propre main. Selon la légende, Samiel a reçu les principes de base de l’honneur et de la colère de la voie lors d’une visite de Michel, commandant des armées célestes, tandis que Saulot était absent."
 
 viapura:0 "Via Pura"
 viapura_adj:0 "Katharoi"
 viapura_adherent:0 "Katharoi"
 viapura_adherent_plural:0 "Katharois"
 viapura_desc:0 "Dans une ère de résistance croissante à l’autorité cléricale, ils ont choisi le dualisme gnostique comme l’épée la mieux forgée pour leurs buts. Les Zélotes construisent des religions avec un calcul presque cynique, puisant dans le néoplatonisme, l’Écriture apocryphe et d’autres sources obscures. Ils se sont nommés Katharoi, et soutiennent les Cathares mortels (le même mot, parlé en français et en latin) non pas comme patrons, mais comme guides spirituels."
 
 viaarchangeli:0 "Via Archangeli"
 viaarchangeli_adj:0 "Nephilim"
 viaarchangeli_adherent:0 "Nephilim"
 viaarchangeli_adherent_plural:0 "Nephilims"
 viaarchangeli_desc:0 "Suivre les traces de Michel signifie agir en tant que muse et berger pour tous, et en tant que martyr lorsque cela est nécessaire. En tant qu’adhérents à la Voie du Ciel, les Fidèles de l’Archange considèrent Michel comme le Christ ressuscité des Damnés et croient que les vampires doivent agir comme les anges de leur troupeau mortel."
 
