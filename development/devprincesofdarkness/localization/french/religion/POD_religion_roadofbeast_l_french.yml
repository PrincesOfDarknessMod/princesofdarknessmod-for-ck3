 #Feral-Group Faiths
 viabestiae:0 "Via Bestiae"
 viabestiae_adj:0 "Fauve"
 viabestiae_adherent:0 "Fauve"
 viabestiae_adherent_plural:0 "Fauves"
 viabestiae_desc:0 "Les disciples de la Voie de la Bête contrôlent leur Bête à travers les concepts primaires de survie, de force et d’individualité. De nombreux membres de la Voie de la Bête choisissent une existence simple et animaliste pour mieux servir les croyances de la Via Bestiae, tandis que d’autres la suivent en vivant une existence simpliste, proche des barbares. "

 viapraedator:0 "Via Praedator"
 viapraedator_adj:0 "Praedator"
 viapraedator_adherent:0 "Chasseur"
 viapraedator_adherent_plural:0 "Chasseurs"
 viapraedator_desc:0 "Les Fauvees qui suivent le Sentier du Chasseur existent pour s’attaquer à ceux qu’ils considèrent inférieurs à eux. Faire autrement est blasphématoire. Ils utilisent également leur Bête comme un outil pour accomplir leurs chasses."

 viaerronis:0 "Via Erronis"
 viaerronis_adj:0 "Voyageur"
 viaerronis_adherent:0 "Voyageur"
 viaerronis_adherent_plural:0 "Voyageurs"
 viaerronis_desc:0 "Pour ces Fauves qui suivent la Voie du Nomade, la civilisation et tout ce qui y est associé est anathème. Ils voyagent léger, et ils voyagent toujours. Il a également été appelé la Voie des Voyageurs."

 viaferitas:0 "Via Feritas"
 viaferitas_adj:0 "Sauvage"
 viaferitas_adherent:0 "Sauvage"
 viaferitas_adherent_plural:0 "Sauvages"
 viaferitas_desc:0 "Les Fauves sur la Voie du Sauvage sont les plus enclins à déchaîner la Bête dans des accès de rage. Leur fureur est dirigée vers tout ce qu’ils considèrent comme faible, en particulier la civilisation. Ils frappent souvent, et ils frappent fort."

 viavenatorumbra:0 "Via Venator Umbra"
 viavenatorumbra_adj:0 "Venator Umbra"
 viavenatorumbra_adherent:0 "Chasseur Gris"
 viavenatorumbra_adherent_plural:0 "Chasseurs Gris"
 viavenatorumbra_desc:0 "S’il y a des Fauves qui ne détestent pas le concept de civilisation, ce sont ceux qui suivent la Voie du Chasseur Gris. Ils considèrent plutôt les villes comme une forme différente de terrain de chasse. Ils sont les plus civilisés des Fauves, mais ne vous y trompez pas, car ils ne sont pas moins capables de chasser que les autres."
 
 vialiberatio:0 "Via Liberatio"
 vialiberatio_adj:0 "Liberatio"
 vialiberatio_adherent:0 "Liberateur"
 vialiberatio_adherent_plural:0 "Liberateurs"
 vialiberatio_desc:0 "Souvent confondus avec les Furores, les Fauves de la Via Liberatio voient les villes comme un piège et la mort de l’âme. Ils voient leur devoir comme libérer les personnes piégées vers un mode de vie plus pur, primal."

 viaeinherjar:0 "Vag Einherjar"
 viaeinherjar_adj:0 "Einherjar"
 viaeinherjar_adherent:0 "Einherjar"
 viaeinherjar_adherent_plural:0 "Einherjar"
 viaeinherjar_desc:0 "Une voie pratiquée parmi les vampires nordiques et sert de rappel de l’ancienne éthique que le Père-de-Tout leur a donnée. La Voie enseigne la responsabilité, le courage face à l’adversité et l’initiative individuelle. Beaucoup chassent la Bête par des actes de discipline et de courage, comme regarder le soleil se lever. La plupart des adeptes de la Voie sont irrespectueux, égoïstes et violents envers ceux qu’ils ne respectent pas. Souvent, même les gens qu’ils respectent ne sont traités que légèrement mieux."
 
 viayasaq:0 "Yasaq"
 viayasaq_adj:0 "Yasa"
 viayasaq_adherent:0 "Anda"
 viayasaq_adherent_plural:0 "Andas"
 viayasaq_desc:0 "Une Voie des vampires de la Steppe, spécifiquement de l’Anda. Elle rappelait beaucoup des traditions de yasa (guerriers-frères) parmi les Mongols. Les adeptes de la Voie du Yasa étaient appelés Barbares parmi les Occidentaux."
 
 pathofnoiad:0 "Route de la Noiad"
 pathofnoiad_adj:0 "Noiad"
 pathofnoiad_adherent:0 "Noiad"
 pathofnoiad_adherent_plural:0 "Noiads"
 pathofnoiad_desc:0 "L’origine des Noiad a été oubliée par les Caïnites et les mortels. Dans l’esprit des Noiads, ils ont toujours habité dans le Nord, guidant et protégeant les tribus Sámi dans le nord de la Scandinavie. Les Noiads se croyaient êtres divins, envoyés par les dieux pour guider et protéger leur peuple choisi des menaces surnaturelles et mondaines, ainsi que d’interpréter les présages des dieux dans les guovssahas. La relation entre les Noiads et leur tribu était quelque peu symbiotique : le Noiad protégerait la tribu des ennemis et agirait comme guide, chaman, et enseignant pour eux, tandis que la tribu donnait volontairement de leur sang et abritait le Noiad pendant les longs mois sans obscurité. En temps de famine, les Noiads auraient besoin des membres de la tribu pour assurer leur survie. Les Noiad habitaient ouvertement parmi les Sámi, et Embrassaient exclusivement de cette population. Ceux sélectionnés pour l'Embracement ont tendance à être ceux qui ont le talent pour la divination, ainsi que l’interprétation des rêves et des étoiles. Les Noiads ont également observé des enfants descendre de familles qui incluaient au moins un vampire, à la recherche des traits qu’ils favorisaient. "
 
