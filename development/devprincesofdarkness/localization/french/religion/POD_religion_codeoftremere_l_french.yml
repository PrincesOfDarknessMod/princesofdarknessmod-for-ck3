 #Warlock-Group Faiths
 tremerecode:0 "Code de Tremere"
 tremerecode_adj:0 "Code de Tremere"
 tremerecode_adherent:0 "Mage"
 tremerecode_adherent_plural:0 "Mages"
 tremerecode_desc:0 "Le Code de Tremere marque le clan comme unique parmi les caïnites; aucun autre groupe n’adhère à un ensemble unifié de règles qui délimitent le comportement acceptable. Aucune magie impérieuse ne lie un Tremere au serment, à moins qu’un Régent sévère ne décide activement de l’appliquer. Au lieu de cela, le code est une liste de facto de ce qui constitue un comportement acceptable pour un membre de l’auguste Chambre de Tremere. Le code développe ce qui est attendu de Tremere, et quelles activités gagneraient la défaveur."

