 tariqelhaqim_desc:0 "Ceux qui suivent Via Sanguinus sont parmi les plus mortels pour leurs compatriotes Caïnites, comme l’acte de diablerie est presque un rite de purification parmi les Mahdis. En effet, l’un des principes fondamentales de la voie est que ses disciples purgent tout ce qui est indigne du sang de Caïn et purifient les lignées."

