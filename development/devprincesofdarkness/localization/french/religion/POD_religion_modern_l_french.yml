 #ModernAnarch-Group Faiths
 
 freeanarch:0 "Anarch Libre"
 freeanarch_adj:0 "Anarch"
 freeanarch_adherent:0 "Anarch"
 freeanarch_adherent_plural:0 "Anarchs"
 freeanarch_desc:0 "Ces caïnites ne s’inclineront devant aucune autorité, mais celle qu’ils choisiront pour eux-mêmes, peu importe les chances. Les bastions des anarques sont souvent sauvages et indisciplinés, mais sont un symbole d’espoir et de liberté pour de nombreux jeunes vampires. Et quelque chose à écraser rapidement pour leurs aînés."
 
 #Common Camarilla Localization
 camarilla_religion:0 "Camarilla"
 camarilla_religion_adj:0 "Camarilla"
 camarilla_religion_adjerent:0 "Camarilla"
 camarilla_religion_adherent_plural:0 "Camarilla"
 camarilla_religion_desc:0 "En plus d’empêcher les masses mortelles croissantes de découvrir l’existence des vampires, la Camarilla vise à maintenir le statu quo de la Famille; en tant que tel, une grande partie de sa structure et de ses traditions reflètent celle de la société Caïnite dans l’Europe féodale au Moyen Age."
 
 #Camarilla-Group Faiths
 
 camahumanity:0 "Camarilla (Humanity)"
 camahumanity_adj:0 "Camarilla"
 camahumanity_adherent:0 "Camarilla"
 camahumanity_adherent_plural:0 "Camarilla"
 camahumanity_desc:0 "Les familles sont encouragées à se fondre le mieux possible dans les mortels et à conserver la civilité et le sang-froid qui viennent du fait de s’accrocher à ses caractéristiques humaines. Presque tous les membres de Camarilla sont sur la "voie" de l’Humanité, les autres voie de l’Illumination étant fortement découragés et habituellement pratiqués uniquement par les anciens."
 #Common Sabbat Localization
 sabbat_religion:0 "Sabbat"
 sabbat_religion_adj:0 "Sabbat"
 sabbat_religion_adjerent:0 "Sabbat"
 sabbat_religion_adherent_plural:0 "Sabbat"
 sabbat_religion_desc:0 "Le Sabbat est une organisation lâche de Caïnites qui rejettent les Traditions. Contrairement à la Camarilla, le Sabbat croit en les Antédiluviens et Caïn. Aussi connu comme l’épée de Caïn, car ils croient qu’ils seront l’armée qu’il utilisera pour détruire les Antédiluviens une fois que la Géhenna arrivera."
 
 #Camarilla-Group Faiths
 
 pathofhonorableaccord:0 "Route de l’Honorable Accord"
 pathofhonorableaccord_adj:0 "Accord"
 pathofhonorableaccord_adherent:0 "Patriote"
 pathofhonorableaccord_adherent_plural:0 "Patriotes"
 pathofhonorableaccord_desc:0 "Le Chemin d’Accord Honorable est un Chemin d’Illumination qui exploite la Bête à travers la pratique rigoureuse du comportement honorable et chevaleresque. Les caïnites sur le chemin de l’Honorable Accord accordent une grande valeur au rituel et à la cérémonie. Les Chevaliers du Sabbat participent donc toujours aux Parties de Guerre, aux rituels, aux cérémonies et aux autres événements de la meute. Dans l’ensemble, les disciples de la voie cherchent à unir les factions disparates de la secte sous la bannière commune de la loyauté à une cause."
   