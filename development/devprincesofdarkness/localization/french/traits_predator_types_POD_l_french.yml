l_french:

 trait_predatortype_farmer:0 "Fermier"
 trait_predatortype_farmer_desc:0 "Ce vampire préfère se nourrir d’animaux."
 
 trait_predatortype_bloodleech:0 "Cannibale"
 trait_predatortype_bloodleech_desc:0 "Ce vampire préfère se nourrir du sang des autres vampires !"
 
 trait_predatortype_phlebotomist:0 "Phlébologue"
 trait_predatortype_phlebotomist_desc:0 "Ce vampire acquiert de la vitae sous couvert d’être un médecin effectuant des saignées."
 
 trait_predatortype_bedlamite:0 "Forcené"
 trait_predatortype_bedlamite_desc:0 "Ce vampire s’attaque aux fous. Il peut également être fous lui-même."
 
 trait_predatortype_cenobite:0 "Cénobite"
 trait_predatortype_cenobite_desc:0 "Ce vampire chasse dans des institutions religieuses cloîtré en communautés comme un monastère."
 
 trait_predatortype_alleycat:0 "Rôdeur"
 trait_predatortype_alleycat_desc:0 "Ce vampire traque et attaque violemment les mortels pour gagner le sang. C’est une approche vulgaire."
 
 trait_predatortype_cauchemar:0 "Cauchemar"
 trait_predatortype_cauchemar_desc:0 "Ce vampire se nourrit principalement de proies endormies."
 
 trait_predatortype_familias:0 "Familias"
 trait_predatortype_familias_desc:0 "Ce vampire se nourrit presque exclusivement d’une dynastie particulière. Ils peuvent même être liés à la famille, du moins c’est ce que la famille pense."
 
 trait_predatortype_footpad:0 "Voleur de Grand Chemin"
 trait_predatortype_footpad_desc:0 "Ce suceur court avec les petits de la société, prenant le sang des pauvres. S’ils disparaissent, les autorités ne montrent aucun intérêt."
 
 trait_predatortype_consensualist:0 "Consensualiste"
 trait_predatortype_consensualist_desc:0 "Ce vampire se nourrit de volontaires. Cela inquiète grandement la mascarade."
 
 trait_predatortype_cultist:0 "Adorateur"
 trait_predatortype_cultist_desc:0 "Ce vampire mène un culte du sang, comme dans les temps anciens. Les mortels l'adore et s’offrent librement à ce dieu du sang."
 
 trait_predatortype_siren:0 "Séducteur"
 trait_predatortype_siren_desc:0 "Ce vampire séduit les amoureux pour drainer leur sang par le baiser."
 
 trait_predatortype_gentry:0 "Nobles"
 trait_predatortype_gentry_desc:0 "Ce vampire a un certain statut dans la société des mortels. Ils utilisent ce statut pour chasser les riches et les puissants.  Personne ne croira que quelqu’un d’aussi raffiné est un monstre."
 
 trait_predatortype_graverobber:0 "Pilleur de Tombes"
 trait_predatortype_graverobber_desc:0 "Ce vampire rôde dans les cimetières et les cryptes à la recherche de cadavres frais. Ils peuvent se nourrir des cadavres récents."
 
 trait_predatortype_extortionist:0 "Extortioniste"
 trait_predatortype_extortionist_desc:0 "Ce vampire force ses victimes à saigner pour elles. Apparemment, l’extorqueur acquiert du sang en échange de services tels que la sécurité ou la surveillance, mais aussi souvent que le besoin de protection est réel, il est tout aussi souvent une fiction conçue pour rendre l’accord se sentir acceptable."
 

