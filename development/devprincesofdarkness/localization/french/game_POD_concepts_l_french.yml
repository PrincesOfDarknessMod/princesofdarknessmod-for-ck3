l_french: 
 game_concept_princes_of_darkness:0 "Princes of Darkness"
 game_concept_princesofdarkness:0 "$princes_of_darkness$"
 game_concept_princes_of_darkness_desc:0 "Un mod pour Crusader Kings 3 qui se concentre sur les créatures surnaturelles de 'World of Darkness' de White Wolf. Vous y jouez en ce moment ! Un [prince|E] est le titre foncier principal d’un [GetTrait('vampire').GetName( GetNullCharacter )] qui régit un domaine, équivalent à un [duchy|E] CK3. Qu’est-ce que l’obscurité ? Regardez en vous-même."
 game_concept_POD:0 "$princes_of_darkness$" 
 
 game_concept_prince:0 "Prince"
 game_concept_the_prince:0 "$game_concept_prince$" 
 game_concept_the_princes:0 "$game_concept_prince$" 
 game_concept_princes:0 "$game_concept_prince$" 
 game_concept_prince_desc:0 "Un $prince$ est le titre foncier principal d’un [GetTrait('vampire').GetName( GetNullCharacter )] qui régit un domaine, équivalent à un [duchy|E] CK3."
 
 game_concept_bloodpotency:0 "Puissance Sanguine"
 game_concept_bloodpotency_desc:0 "La $game_concept_bloodpotency$ est un pouvoir inhérent au sang de [GetTrait('vampire').GetName( GetNullCharacter )] qui augmente lentement au fil du temps et il est limité par la [vampgeneration|E] du [GetTrait('vampire').GetName( GetNullCharacter )]. La $game_concept_bloodpotency$ diminue lentement en torpeur. Il peut augmenter plus rapidement en diabolisant les vampires avec une puissance sanguine plus élevée. La $game_concept_bloodpotency$ impacts à quelle vitesse l'usage d'une [discipline|E] attise votre soif et l’impact de vos pouvoirs de [GetTrait('vampire').GetName( GetNullCharacter )] de vos [disciplines|E]."
 game_concept_blood_potency:0 "$game_concept_bloodpotency$" 
 
 game_concept_vampgeneration:0 "Génération"
 game_concept_generation:0 "$game_concept_vampgeneration$"
 game_concept_vampgeneration_desc:0 "Selon Cainites, c'est la distance du sang d'un [GetTrait('vampire').GetName( GetNullCharacter )] avec celui du père de tous les [GetTrait('vampire').GetName( GetNullCharacter )]s--Caïn. Caïn est le [GetTrait('vampgeneration1').GetName( GetNullCharacter )]. Les Vampires de la [GetTrait('vampgeneration14').GetName( GetNullCharacter )] ou plus haute sont des 'Sang Fin' et sont presque des êtres humains et à peine des vampires. Les Vampires qui ne croient pas que Caïn est l’ancêtre de tous, trace souvent leur [vampgeneration|E] vers un autre fondateur mythique. Les Vampires peuvent diminuer leur [vampgeneration|E], et ainsi augmenter leur Puissance Sanguinne, en commettant diablerie sur un Vampire de [vampgeneration|E] inférieur à eux."
 
 game_concept_bloodbond:0 "Lien du Sang"
 game_concept_bloodbond_desc:0 "Boire du sang de [GetTrait('vampire').GetName( GetNullCharacter )] crée habituellement des sentiments de loyauté et d’obéissance intenses envers le [GetTrait('vampire').GetName( GetNullCharacter )]. Aussi appelé un 'Serment de Sang'. Cela agit comme un hameçon d’intensité croissante, plus le sang est consommé. Certains vampires sont incapables de créer des liens avec leur sang. D’autres vampires sont totalement invincibles."  
 game_concept_blood_oath:0 "$game_concept_bloodbond"
 game_concept_bloodoath:0 "$game_concept_bloodbond"
 
 game_concept_blood_bond:0 "$game_concept_bloodbond"
 
 game_concept_beast:0 "Bête" 
 game_concept_the_beast:0 "$game_concept_beast$"
 game_concept_thebeast:0 "$game_concept_beast$" 
 game_concept_beast_desc:0 "La [beast|E] est un terme utilisé par les [GetTrait('vampire').GetName( GetNullCharacter )]s pour décrire le prédateur intérieur qui cherche à contrôler l’esprit d’un caïnite. C'est un prédateur démoniaque inné qui se réveille en chaque [GetTrait('vampire').GetName( GetNullCharacter )] lors de leur Transformation. Il se trouve en opposition directe à l’Humanité d’un vampire (et dans certains cas les Chemins de l’Illumination) et est responsable de beaucoup des pulsions avilissantes que ressentent les caïnites tous les soirs. En temps de détresse extrême, la Bête peut submerger un[GetTrait('vampire').GetName( GetNullCharacter )] les poussant dans un état de combat ou de fuite purement animaliste, ce qu’on appelle Frénésie ou Rotschreck. Si un [GetTrait('vampire').GetName( GetNullCharacter )] à une [piety|E] négative, ils risquent de tomber dans une frénésie permanente et de devenir une [GetTrait('wight').GetName( GetNullCharacter )]. C’est une abdication par défaut à vers leur [heir|E]."
 
 game_concept_the_masquerade:0 "$game_concept_masquerade$"
 game_concept_masquerade:0 "La Masquerade"
 game_concept_masquerade_desc:0 "[masquerade|E] est un terme utilisé par les [GetTrait('vampire').GetName( GetNullCharacter )]s pour décrire le fait de garder leur existence secrète aux [GetTrait('mortal').GetName( GetNullCharacter )]s. Violer [masquerade|E] peut entraîner des complications telles que d’être attaqué par des [GetTrait('supehunter').GetName( GetNullCharacter )]s. Dans certains cas, il peut être considéré comme un [crime|E] parmis les [GetTrait('vampire').GetName( GetNullCharacter )]s."   
 
 game_concept_humor:0 "$game_concept_resonance$"
 game_concept_humors:0 "$game_concept_resonance$"
 game_concept_humour:0 "$game_concept_resonance$"
 game_concept_humours:0 "$game_concept_resonance$"
 game_concept_humorism:0 "$game_concept_resonance$"
 game_concept_humourism:0 "$game_concept_resonance$"
 
 game_concept_resonance:0 "Résonnance"
 game_concept_resonances:0 "$game_concept_resonance$"
 
 game_concept_resonance_desc:0 "Le sang a une certaine qualité basée sur la personnalité et les émotions de son propriétaire. La consommation de sang de [GetTrait('vampire').GetName( GetNullCharacter )]s est basée sur puissance de la $resonance$ du personnage. Vous gagnez plus d'expérience d'une [discipline|E] en buvant le sang d'une résonnance particulière ou en utilisant une [discipline|E] particulière. Les résonnances sont :\n$BULLET_WITH_TAB$[choleric_lifestyle|E]\n$BULLET_WITH_TAB$[melancholy_lifestyle|E]\n$BULLET_WITH_TAB$[phlegmatic_lifestyle|E]\n$BULLET_WITH_TAB$[sanguine_lifestyle|E]\n$BULLET_WITH_TAB$[animal_lifestyle|E]"
 
 game_concept_torpor:0 "Torpeur"
 game_concept_torpor_desc:0 "La $game_concept_torpor$ est un état de stase pour un [GetTrait('vampire').GetName( GetNullCharacter )]. Bien qu’ils ne puissent pas bouger, ils peuvent être conscients des événements qui se produisent autour d’eux. Elle peut être causée par un pieu à travers le cœur, des lésions corporelles suffisantes, une grande faim ou un ennui."
 game_concept_torpid:0 "$game_concept_torpid$"
 
 game_concept_hunger:0 "Soif"
 game_concept_hunger_desc:0 "La $game_concept_hunger$ est le désir d'un [GetTrait('vampire').GetName( GetNullCharacter )] de ingérer du sang. C'est dicté par leur [beast|E]. Plus grande est la $game_concept_bloodpotency$ d'un [GetTrait('vampire').GetName( GetNullCharacter )] , plus la quantité de sang à consommé est élevée pour satisfaire leur $game_concept_hunger$. Une $game_concept_hunger$ importante a aussi bien des effets positifs mais également un impact largement négatif pour un [GetTrait('vampire').GetName( GetNullCharacter )]. Le seul moyen de satisfaire entièrement la $game_concept_hunger$ d'un [GetTrait('vampire').GetName( GetNullCharacter )] est de tuer et de siphonner tous le sang de sa victime.""
 game_concept_the_hunger:0 "$game_concept_hunger$"
 game_concept_blood_hunger:0 "$game_concept_hunger$"
 game_concept_the_thirst:0 "$game_concept_hunger$"
 game_concept_thirst:0 "$game_concept_hunger$"
 game_concept_blood_thirst:0 "$game_concept_hunger$"
 
 game_concept_discipline:0 "Discipline" 
 game_concept_disciplines:0 "$game_concept_discipline$"
 game_concept_discipline_desc:0 "Les $game_concept_discipline$s sont les pouvoirs des vampires [GetTrait('vampire').GetName( GetNullCharacter )]s par la canalisation de la $game_concept_resonance$ du sang . Pour augmenter la puissance d’une $game_concept_disciplines$, vous devez dépenser de l’expérience pour débloquer une [perks|E] de la $game_concept_disciplines$ ." 

 game_concept_choleric_lifestyle:0 "Résonnance Colérique"
 game_concept_yellow_bile:0 "$game_concept_choleric_lifestyle$"
 game_concept_yellowbile:0 "$game_concept_choleric_lifestyle$"
 game_concept_choleric_lifestyle_desc:0 "La $game_concept_choleric_lifestyle$ est appropriée pour les [GetTrait('vampire').GetName( GetNullCharacter )]s qui veulent améliorer leurs [discipline|E]s qui impliquent de se nourrir de sang avec des émotions comme la colère et l’envie. En recherche de proies avec [traits|E] comme [GetTrait('wrathful').GetName( GetNullCharacter )] et [GetTrait('sadistic').GetName( GetNullCharacter )]. Les [discipline|E]s de la $game_concept_choleric_lifestyle$ sont :\n\n$BULLET_WITH_TAB$ [GetTrait('celerity').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('potence').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('vicissitude').GetName( GetNullCharacter )]"

 game_concept_sanguine_lifestyle:0 "Résonnance Sanguine"
 game_concept_sanguine:0 "$game_concept_sanguine_lifestyle$"
 game_concept_sanguine_lifestyle_desc:0 "La $game_concept_sanguine_lifestyle$ est appropriée pour les [GetTrait('vampire').GetName( GetNullCharacter )]s qui veulent améliorer leurs [discipline|E]s qui impliquent de se nourrir de sang avec des émotions comme la joie et l'enthousiasme. En recherche de proies avec [traits|E] comme [GetTrait('gregarious').GetName( GetNullCharacter )] et [GetTrait('lustful').GetName( GetNullCharacter )]. Les [discipline|E]s de la$game_concept_sanguine_lifestyle$ sont :\n\n$BULLET_WITH_TAB$[GetTrait('bloodsorcery').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('presence').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('thinbloodalchemy').GetName( GetNullCharacter )]"

 game_concept_faith_lifestyle:0 "Vraie Foi"
 game_concept_faith:0 "$game_concept_faith_lifestyle$"
 game_concept_faith_lifestyle_desc:0 "Une aubaine rare pour les personnages très zélés, le trait Vrai Croyant ouvre le style de vie du même nom, où divers pouvoirs peuvent être acquis avec le mode de vie correspondant."
 
 game_concept_phlegmatic_lifestyle:0 "Résonnance Flegmatique"
 game_concept_phlegm:0 "$game_concept_phlegmatic_lifestyle$"
 game_concept_phlegmatic:0 "$game_concept_phlegmatic_lifestyle$"
 game_concept_phlegmatic_lifestyle_desc:0 "La $game_concept_phlegmatic_lifestyle$ est appropriée pour les [GetTrait('vampire').GetName( GetNullCharacter )]s qui veulent améliorer leurs [discipline|E]s qui impliquent de se nourrir de sang avec des émotions comme la sentimentalité et le contrôle. En recherche de proies avec [traits|E] comme [GetTrait('lazy').GetName( GetNullCharacter )] et [GetTrait('content').GetName( GetNullCharacter )]. Les [discipline|E]s de la $game_concept_phlegmatic_lifestyle$ sont :\n\n$BULLET_WITH_TAB$ [GetTrait('auspex').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('dominate').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('oblivion').GetName( GetNullCharacter )]"

 game_concept_melancholy_lifestyle:0 "Résonnance Mélancolique"
 game_concept_black_bile:0 "$game_concept_melancholy_lifestyle$"
 game_concept_blackbile:0 "$game_concept_melancholy_lifestyle$"
 game_concept_melancholic:0 "$game_concept_melancholy_lifestyle$"
 game_concept_melancholy_lifestyle_desc:0 "La $game_concept_melancholy_lifestyle$ est appropriée pour les [GetTrait('vampire').GetName( GetNullCharacter )]s qui veulent améliorer leurs [discipline|E]s qui impliquent de se nourrir de sang avec des émotions comme la tristesse et l’intellecte. En recherche de proies avec [traits|E] comme [GetTrait('shy').GetName( GetNullCharacter )] et [GetTrait('craven').GetName( GetNullCharacter )]. Les [discipline|E]s de la$game_concept_melancholy_lifestyle$ sont :\n\n$BULLET_WITH_TAB$ [GetTrait('fortitude').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('obfuscate').GetName( GetNullCharacter )]"

 game_concept_animal_lifestyle:0 "Résonnance Animale"
 game_concept_animal_lifestyle_desc:0 "La $game_concept_animal_lifestyle$ est appropriée pour les [GetTrait('vampire').GetName( GetNullCharacter )]s qui veulent améliorer leurs [discipline|E]s qui impliquent de se nourrir d'animaux. En recherche d'animaux comme proies. Les [discipline|E]s de la $game_concept_animal_lifestyle$ sont :\n\n$BULLET_WITH_TAB$ [GetTrait('animalism').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$ [GetTrait('protean').GetName( GetNullCharacter )]"
 
 game_concept_diablerie_schemes:0 "Complot de Diablerie"
 game_concept_diablerize_scheme:0 "$diablerize$"
 game_concept_diablerize:0 "Diabler"
 game_concept_diablerize_scheme_desc:0 "$game_concept_diablerie$ est un [hostile_scheme|E] visant à assassiner un [GetTrait('vampire').GetName( GetNullCharacter )] ciblé et de dévorer son sang et son âme.  C'est un [secret_scheme|E] reposant sur l'[intrigue|E] et qui peut disposer d'[agents|E].\n\nUne $game_concept_diablerize$ réussite impliquera la [character_death_death|E] de la [scheme_target|E]. \n\nUn meurtre qui restera secret attribura au [scheme_owner|E] un [secret|E] de Diabolisation.\n\nÊtre découvert en essayant de diabloliser, ou diabloliser avec succès un [GetTrait('vampire').GetName( GetNullCharacter )] est un [crime|E] sérieux parmis les fois [GetTrait('vampire').GetName( GetNullCharacter )]. Aussi appelé 'Amaranth' après la première victime de Diabolisation, c’est le processus où un [GetTrait('vampire').GetName( GetNullCharacter )] draine un autre [GetTrait('vampire').GetName( GetNullCharacter )] de tout son sang, y compris son âme. Il permet au diabolisateur de gagner de la [bloodpotency|E] et même une plus basse [vampgeneration|E] dépendant de leur victime. Il est suivi d'un prix à payer en stimulant la [beast|E] d'un [GetTrait('vampire').GetName( GetNullCharacter )]. Nous représentons cela en perdant des niveaux de [piety|E]. La plupart des [GetTrait('vampire').GetName( GetNullCharacter )]s ont une mauvaise opinions des [GetTrait('diablerist').GetName( GetNullCharacter )]s"
 
 game_concept_amaranth:0 "game_concept_diablerize"
 
 game_concept_summon_scheme:0 "$game_concept_summon$"
 game_concept_summon_schemes:0 "Complots d'Invocations"
 game_concept_summon:0 "Invocation"
 game_concept_summon_scheme_desc:0 "L'$game_concept_summon_scheme$ est un [personal_scheme|E] qui vise à attirer d’autres personnages à votre cour. Ce complot est principalement basé sur votre [diplomacy|E], ce n'est pas un [secret_scheme_single|E] et ne peut pas disposé d'[agents|E]. Cela est disponnible grâce à la $perk$ de la $discipline$ de $presence$."
 
 game_concept_entrance_scheme:0 "$game_concept_entrance$"
 game_concept_entrance_schemes:0 "Complots Admissions"
 game_concept_entrance:0 "Admission"
 game_concept_entrance_scheme_desc:0 "L'$game_concept_entrance_scheme$ est un [personal_scheme|E] qui vise à attirer d’autres personnages à votre cour. Ce complot est principalement basé sur votre [diplomacy|E], ce n'est pas un [secret_scheme_single|E] et ne peut pas disposé d'[agents|E]. En cas de réussite, le personnage se déplacera vers votre capitale. Cela est disponnible grâce à la [perks|E] de la [discipline|E] de [GetTrait('presence').GetName( GetNullCharacter )]. Ce pouvoir ne marchera pas sur un personnage [landed|E]"
 
 game_concept_mesmerize_scheme:0 "$game_concept_mesmerize"
 game_concept_mesmerize_schemes:0 "Complots d'Hypnoses"
 game_concept_mesmerize:0 "Hypnotiser"
 game_concept_mesmerize_scheme_desc:0 "$game_concept_mesmerize_scheme$ est un [personal_scheme|E] qui vise à attirer d’autres personnages à votre cour. Ce complot est principalement basé sur votre [stewardship|E], ce n'est pas un [secret_scheme_single|E] et ne peut pas disposé d'[agents|E]. En cas de réussite, le personnage se déplacera vers votre capitale. Cela est disponnible grâce à la [perks|E] de la [discipline|E] de [GetTrait('presence').GetName( GetNullCharacter )]. Ce pouvoir ne marchera pas sur un personnage [landed|E]"
 
 game_concept_investigate_scheme:0 "$game_concept_investigate$"
 game_concept_investigate_schemes:0 "Complots d'Enquêtes"
 game_concept_investigate:0 "Enquêter"
 game_concept_investigate_scheme_desc:0 "$game_concept_investigate_scheme$ est un [personal_scheme|E] qui vous permet d'obtenir des informations sur un autre personnage. Ce complot est principalement basé sur votre [learning|E], ce n'est pas un [secret_scheme_single|E] qui peut disposer d'[agents|E]. En cas de réussite, votre personnage apprendra des informations narratives sur l'autre personnage, avoir un léger bonus dans leurs interactions et potentiellement apprendre un secret tel que la [vampgeneration|E] du personnage."

 game_concept_hunt_mortal_scheme:0 "$game_concept_vamphunt$"
 game_concept_hunt_mortal:0 "$game_concept_vamphunt$" 
 
 game_concept_vamphunt_scheme:0 "$game_concept_vamphunt$" 
 game_concept_vamphunt_schemes:0 "Complots de Chasses"
 game_concept_vamphunt:0 "Chasser"
 game_concept_vamphunt_scheme_desc:0 "$game_concept_vamphunt_scheme$ est un [personal_scheme|E] d'un [GetTrait('vampire').GetName( GetNullCharacter )] afin de chasser un [GetTrait('mortal').GetName( GetNullCharacter )] pour son sang. Ce complot est principalement basé sur votre [intrigue|E], il est [secret_scheme_single|E] et ne peut pas disposé d'[agents|E]. En cas de réussite, le [GetTrait('vampire').GetName( GetNullCharacter )] consommera le sang du [GetTrait('mortal').GetName( GetNullCharacter )]. Si le complot est découvert, le personnage violera [masquerade|E] qui mènera à des complications potentielles telles que des attaques de [GetTrait('supehunter').GetName( GetNullCharacter )]s. Ce pouvoir ne marchera pas sur un personnage [landed|E]. Les victimes potentielles doivent se trouver à votre emplacement.."
 
 game_concept_embrace_scheme:0 "$game_concept_embrace$"
 game_concept_embrace_schemes:0 "Complots d'embrasser"
 game_concept_embrace:0 "Embrasser"
 game_concept_embrace_scheme_desc:0 "$game_concept_embrace_scheme$ est un [personal_scheme|E] qui vise à attirer d’autres personnages à votre cour. Ce complot est principalement basé sur votre [intrigue|E], ce n'est pas un [secret_scheme_single|E] et ne peut pas disposé d'[agents|E]. En cas de réussite, le personnage se déplacera vers votre capitale. Cela est disponnible grâce à la [perks|E] de la $discipline$ de $presence$. Ce pouvoir ne marchera pas sur un personnage [landed|E]"
 
 game_concept_ghoulify_scheme:0 "$ghoulify$"
 game_concept_ghoulify_schemes:0 "Complots de Goulification"
 game_concept_ghoulify:0 "Goulifier"
 game_concept_ghoulify_scheme_desc:0 "$game_concept_ghoulify$ est un [personal_scheme|E] qui vise à attirer d’autres personnages à votre cour. Ce complot est principalement basé sur votre [stewardship|E], ce n'est pas un [secret_scheme_single|E] et ne peut pas disposé d'[agents|E]. En cas de réussite, le personnage se déplacera vers votre capitale. Cela est disponnible grâce à la [perks|E] de la $discipline$ of $presence$. Ce pouvoir ne marchera pas sur un personnage [landed|E]"
 
 game_concept_herdify_scheme:0 "$herdify$"
 game_concept_herdify_schemes:0 "Complots d'Introduction au troupeaux'"
 game_concept_herdify:0 "Introduire au troupeau"
 game_concept_herdify_scheme_desc:0 "$game_concept_entrance_scheme$ est un [personal_scheme|E] qui vise à attirer d’autres personnages à votre cour. Ce complot est principalement basé sur votre [diplomacy|E], ce n'est pas un [secret_scheme_single|E] et ne peut pas disposé d'[agents|E]. En cas de réussite, le personnage se déplacera vers votre capitale. Cela est disponnible grâce à la [perks|E] de la $discipline$ of $presence$. Ce pouvoir ne marchera pas sur un personnage [landed|E]"

 game_concept_diablerize_schemes:0 "Complot de Diablerie"
 game_concept_diablerize_schemes_desc:0 "$game_concept_diablerie$ est un [hostile_scheme|E] visant à assassiner un [GetTrait('vampire').GetName( GetNullCharacter )] ciblé et de dévorer son sang et son âme.  C'est un [secret_scheme|E] reposant sur l'[intrigue|E] et qui peut disposer d'[agents|E].\n\nUne $game_concept_diablerize$ réussite impliquera la [character_death_death|E] de la [scheme_target|E]. \n\nUn meurtre qui restera secret attribura au [scheme_owner|E] un [secret|E] de Diabolisation.\n\nÊtre découvert en essayant de diabloliser, ou diabloliser avec succès un [GetTrait('vampire').GetName( GetNullCharacter )] est un [crime|E] sérieux parmis les fois [GetTrait('vampire').GetName( GetNullCharacter )]. Aussi appelé 'Amaranth' après la première victime de Diabolisation, c’est le processus où un [GetTrait('vampire').GetName( GetNullCharacter )] draine un autre [GetTrait('vampire').GetName( GetNullCharacter )] de tout son sang, y compris son âme. Il permet au diabolisateur de gagner de la [bloodpotency|E] et même une plus basse [vampgeneration|E] dépendant de leur victime. Il est suivi d'un prix à payer en stimulant la [beast|E] d'un [GetTrait('vampire').GetName( GetNullCharacter )]. Nous représentons cela en perdant des niveaux de [piety|E]. La plupart des [GetTrait('vampire').GetName( GetNullCharacter )]s ont une mauvaise opinion des [GetTrait('diablerist').GetName( GetNullCharacter )]s"
 
 game_concept_discipline_power:0 "Pouvoir de la Discipline"
 game_concept_discipline_power_desc:0 "Les Pouvoirs de la Discipline sont les applications des [discipline|E]s, permettant aux vampires d’accomplir des exploits surnaturels ou de leur accorder des pouvoirs étranges."

 game_concept_bind_famulus:0 "Liée un Familier"
 game_concept_bind_famulus_desc:0 "Lier un Familier est une [character_interaction|E] qui permet de créer un Familir lors d'un lien du sang avec un animal, créant un lien mental avec lui et facilitant l’utilisation d’autres pouvoirs.

 game_concept_animal_succelence:0 "Saveur Animale"
 game_concept_animal_succelence_desc:"Le vampire peut étancher davantage sa [hunger|E] en se nourrissant sur des animaux. De plus, le vampire peut dévorer son Familier, se nourrissant bien au-delà de ce qui serait gagné par un animal de stature similaire et absorbant une partie de son trait primaire."

 game_concept_animal_dominion:0 "Domination Animale"
 game_concept_animal_dominion_desc:0 "La Domination Animale est une [character_interaction|E] qui symbolise le pouvoir que le vampire détient sur les animaux est maintenant assez grand pour commander des troupeaux et des meutes comme si elles étaient des extensions de son propre corps. Dans un geste, les animaux donnent leur vie par dizaines, voire par centaines, pour apaiser leur maître."

 game_concept_blood_draught:0 "Élixir"
 game_concept_blood_draught_desc:0 "Le Sang du vampire devient saturé du pouvoir de sa Discipline, transmettant une partie de ce pouvoir à quiconque en boit. Le breuvage est non géré par une [character_interaction|E]."

 game_concept_shapeshift:0 "Changement de Forme"
 game_concept_shapeshift_desc:0 "Une [character_interaction|E] qui permet à l’utilisateur de transformer leur forme d’une certaine manière, généralement né de Protean ou Vicissitude."

 game_concept_feral_weapons:0 "Armes Férals"
 game_concept_feral_weapons_desc:0 "Ce vampire peut étendre ses armes naturelles à des proportions monstrueuses. Cela prend généralement la forme d’ongles s’étendant dans des serres méchantes mais peut aussi venir sous d’autres formes telles que des crocs s’allongeant en véritables poignards, comme un serpent gigantesque. Une sous-compétence du [shapeshift|E] ."

 game_concept_shapechange:0 "Métamorphose"
 game_concept_shapechange_desc:0 "Le vampire peut prendre la forme d’un animal à peu près de la même taille que leur masse originale. L’animal, bien qu’il s’agisse généralement d’un exemple spectaculaire d’espèce de tanière, ne montre aucun signe pour un observateur banal d’être surnaturel. Une sous-compétence du [shapeshift|E]."

 game_concept_mist_form:0 "Forme Embrumé"
 game_concept_mist_form_desc:0 "Le vampire acquiert le pouvoir légendaire de se transformer en un nuage de brume, perceptible à l’œil mais intouchable par tout ce qui l'entoure sauf le feu, la lumière du soleil et une agression surnaturelle. Ils peuvent passer à travers les tuyaux, les crevasses et les fissures. Bien que des vents forts puissent les perturber, aucune force naturelle ne peut disperser le nuage. Une sous-compétence du [shapeshift|E]."

 game_concept_tenebrous_avatar:0 "Avatar Ténébreux"
 game_concept_tenebrous_avatar_desc:0 "La maîtrise des ténèbres du vampire est si étendue qu’ils peuvent le devenir physiquement. Dès l’activation de ce pouvoir, le vampire devient une tache d’ombre. Les vampires sous cette forme sont pratiquement invulnérables et peuvent se faufiler à travers les fissures et les crevasses. En outre, le vampire-ombre gagne la capacité de voir dans l’obscurité naturelle. Une sous-compétence du [shapeshift|E]."

 game_concept_rationalize_scheme:0 "Rationaliser"
 game_concept_rationalize_scheme_desc:0 "$game_concept_rationalize_scheme$ est un [personal_scheme|E] qui vise à forcer quelqu'un à abandonner un hameçon d’un autre personnage."

 game_concept_incorporeal_form:0 "Forme Imatérielle"
 game_concept_incorporeal_form_desc:0"Le vampire deviens une $game_concept_incorporeal_form$, semblable à un fantôme, capable de traverser librement des objets et rendu totalement immunisé contre les dommages physiques. Ils ne peuvent interagir physiquement avec le monde matériel que par la vue et la parole. Une sous-compétence du [shapeshift|E]."