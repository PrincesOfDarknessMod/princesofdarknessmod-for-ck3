 bookmark_patronwar_loukios:0 "Loukios"
 bookmark_patronwar_loukios_desc:0 "Un jour, un centurion romain d'une certaine renommée et adepte secret du culte de la déesse Isis et dans les années qui ont empêchées l'effondrement de Rome, Loukas a déserté lorsque les guerres ont commencé à devenir impuissantes et est devenu de plus en plus amoureux du mythe égyptien au point qu'il a fait un pèlerinage au pays des sables tamisés pour mieux comprendre sa déesse. Malheureusement, il n'a pas trouvé la connaissance qu'il avait tant recherchée - seulement les disciples du serpent. Set l'accueillit dans les vieux temples. Ils s'étaient intéressés à lui ou peut-être à sa connaissance de l'armée romaine." 
 bookmark_patronwar_ciaran:0 "Ciarán"
 bookmark_patronwar_ciaran_desc:0 "Ciarán était un voyageur irlandais, ou plus exactement, un Mincéirí ou un des lucht siúil (littéralement, «les gens qui marchent»). C'était un jeune homme de vingt-trois ans qui faisait simplement ce dont il avait besoin pour survivre et subvenir aux besoins de sa famille. Souvent, cela signifiait mentir et tricher parce qu'il n'avait pas beaucoup d'autres compétences. Indépendamment de sa nature malhonnête, la famille était toujours la chose la plus importante pour lui, et il voyait tout d'un lucht siúil comme sa famille. N'importe quel nomade qu'il respectait presque autant. C'est pourquoi il a offert une maison à un étrange voyageur hindoustani se faisant appeler Viswanathan.\n\n#bold À son insu, Viswanathan était un méthuselah, un vampire de cinquième génération du clan Ravnos et un homme qui avait voyagé à travers le monde connu pour se retrouver dans Irlande. Heureusement, car leur camp serait bientôt attaqué par les habitants et l'Irlandais mortellement blessé. Viswanathan a trahi ses propres principes pour embrasser Ciarán, lui sauvant la vie. Il lui a appris le Chemin du Paradoxe et l'a averti de ne jamais faire ce qu'il venait de faire. Puis il est parti.#!"
 
 bm_1230_inquisitor:0 "Dark Ages : Inquisition"
 bm_1230_inquisitor_desc:0 "Anno Dei 1230. Dirigée par un groupe fidèle de chasseurs de monstres, la Sainte Eglise a enfin pris conscience de la menace que représentent les vampires. Formant une nouvelle organisation secrète appelée Shadow Inquisition, ces héros sont les premiers humains à tenter de reconquérir la nuit et de repousser ses horreurs. La tâche qui les attend est immense et les maudits suceurs de sang ont eu des siècles pour se retrancher et préparer leur contre-attaque. Les soi-disant «inquisiteurs» sont prêts à mourir en martyrs, si leur sacrifice ouvre la voie à un avenir meilleur pour l'humanité. Ils se battent pour une cause, et c'est plus que tout vampire ne pourrait prétendre.\n\n#bold Vous êtes le seul espoir d'un monde inconscient de la guerre qui fait rage dans l'ombre!#!"
 bookmark_inquisitor_gauthier:0 "Gauthier de Dampiere"
 bookmark_inquisitor_gauthier_desc:0 "Troisième fils d'un petit comte français, Gauthier a entendu l'appel de Dieu tôt dans sa vie et y a répondu par le seul moyen qu'il connaissait: la bataille. Sa première rencontre avec un vampire pendant la troisième croisade a été une révélation et Gauthier a rassemblé une forte suite de chevaliers dévots déterminés à combattre le mal. C'était une preuve pour lui d'être un fondateur de l'Inquisition de l'ombre, où il est le chef de file dans toutes les questions militaires. Gauthier est un combattant redoutable et un leader charismatique, mais la vieillesse le rattrape, lui faisant craindre ce qui viendra pour l'Inquisition après sa mort. \n\n#bold Vos exploits sont derrière vous, mais vous avez encore le temps de assurez-vous que les Chevaliers d'Acre vous survivent. C'est votre dernier devoir dans une longue vie passée à servir Dieu!#!"
 bookmark_inquisitor_leopold:0 "Leopold von Murnau"
 bookmark_inquisitor_leopold_desc:0 "Un descendant mineur de la maison von Murnau, Léopold était un enfant maladif maudit d'une étrange capacité: le pouvoir de littéralement «sentir» le mal. Plutôt que de le craindre, Léopold, vif d'esprit, a utilisé son don pour aider à découvrir plusieurs machinations vampiriques dans sa maison. Il ne s'est pas arrêté là cependant, et était bientôt à Rome pour proposer ses services aux Chevaliers d'Acre nouvellement créés. Depuis lors, il a été le principal moteur de la création de l'Inquisition de l'Ombre, rassemblant tous ceux qui tentent de combattre le mal sous ses nombreuses formes. Sa maison fermement derrière lui, Léopold est peut-être le pilier le plus fort de l'Inquisition, menant les efforts pour reprendre la nuit.\n\n#bold L'audacieuse Maison Murnau est forte, et la Bavière est sécurisée, mais ce n'est que le début du combat. Vous ne devez pas vous arrêter tant que le dernier suceur de sang n'est pas conduit devant la lumière de Dieu.#!"
 bookmark_inquisitor_maria:0 "Maria-Immaculada"
 bookmark_inquisitor_maria_desc:0 "La dirigeante actuelle des Sœurs de Saint-Jean n'est pas la fondatrice de l'ordre, mais sa volonté est aussi forte que celle de Mère Teresa, sa bienheureuse prédécesseur. L'appeler personnellement formidable, c'est suggérer que le Pape n'est qu'un peu saint. Après plusieurs tentatives infructueuses d'inquisiteurs moins qualifiés, Maria-Immaculada a choisi de se rendre personnellement dans les îles britanniques, dans l'espoir de trouver le tristement célèbre «Dieu-roi» vampirique qui prétend gouverner ces îles. Avec sa foi indéfectible et le soutien des autres ordres de l'Inquisition, Maria est prête à enseigner à cet ennemi qu'il n'y a qu'un seul Dieu.\n\n#bold Vous êtes sûr que l'Angleterre est un centre d'activité vampirique. Le découvrir et le détruire serait un énorme avantage pour l'Inquisition. Vous verrez le Dieu-Roi tomber.#!"
 bookmark_inquisitor_vittoria:0 "Vittoria Santini di Parma"
 bookmark_inquisitor_vittoria_desc:0 "Femme à l'intelligence imposante et à l'amour intense de Dieu, Vittoria est la dirigeante informelle de l'Ordre rouge, les chercheurs de l'Inquisition de l'ombre. Elle possède un sens étrange du moment où il faut contourner les règles et quand il faut jouer précisément selon la lettre orthodoxe. En tant que telle, elle était l'occasion évidente pour les missions les plus importantes - et les plus dangereuses -: purger l'Italie elle-même de l'influence des vampires et protéger le Saint-Siège. Alors que Vittoria découvre de plus en plus de corruption surnaturelle dans l'Église, elle constate que la tâche sera encore plus complexe que prévu ...\n\n#bold Vous êtes déterminée à sauver l'Église d'elle-même et de la meilleure façon de le faire est d'exposer et de détruire les vampires de l'Italie. Vous avez identifié deux cibles principales, un soi-disant cardinal à Milan, et une abomination se moquant du pape à Rome...#!"
 bookmark_inquisitor_aignen:0 "Aignen le Libraire"
 bookmark_inquisitor_aignen_desc:0 "Le maître espion occitan est le chef de l'Oculi Dei, les yeux et les oreilles de l'Inquisition. Autrefois lieutenant de Rodrigue de Navarre, Aignen a rompu avec son ami lorsqu'il a refusé de rejoindre l'Inquisition de l'ombre. Aignen pleure pour son amitié perdue, mais sait que le Saint-Siège aura besoin d'une force puissante d'espions ingénieux. Méprisé par ses anciens alliés et toujours méfié par les nouveaux, Aignen emprunte le chemin solitaire entre être utile et être qualifié d'hérétique.\n\n#bold La France audacieuse est votre patrie, et vous connaissez l'influence vampirique qui s'y nourrit. L'hérésie cathare l'a trop bien prouvé. Avec les quelques amis que vous pouvez rassembler, vous devez prendre des mesures pour contrôler la situation et, espérons-le, prouver votre utilité à l'Inquisition de l'ombre.#!"
 bookmark_inquisitor_rodrigue:0 "Rodrigue de Navarre"
 bookmark_inquisitor_rodrigue_desc:0 "Rodrigue a été le premier chrétien à entrer en contact avec les morts-vivants, à survivre, puis à choisir de prendre les armes contre eux. Petit noble de Navarre, c'est pendant l'hérésie cathare qu'il a été témoin du vrai mal du monde. Depuis lors, Rodrigue essaie frénétiquement de détruire toute influence vampirique perçue ... ce qui est presque tout le monde, dans son esprit paranoïaque. En tant que tel, il a refusé de rejoindre l'Inquisition de l'Ombre et agit seul, avec l'épée de Saint-Jacques à sa disposition.\n\n#bold Ils sont partout. L'Inquisition de l'ombre est probablement un allié, mais vous ne prenez pas de risques. S'ils veulent vous aider, très bien, mais vous sauverez Iberia selon vos propres conditions et selon vos propres méthodes.#!"
 
 bookmark_inquisitor_bayezid:0 "Bayezid Gantenbein"
 bookmark_inquisitor_bayezid_desc:0 "Autrefois esclave des goules du Caitiff Caïnite Stanislav des Élus de Calomena, Bayezid et son frère Basile ont trouvé leur foi de Bogomil corrompue par les intérêts des morts-vivants. Lorsque Stanislav a été détruit lors de la chute de Michael's Dreamin en 1204, les frères Gantenbein ont été libérés de leurs liens de sang. Depuis ce temps, ils s'appellent désormais «les réprouvés de Calomena» et ils ont mené les fidèles bogomilistes dans des attaques contre des vampires dans toute la Bosnie.\n\n#bold Calomena, la soeur de Caine, veut la destruction de son enfant mort-vivant!#!"   