 #bookmark_constantinoplebynight_name:0 "$NAME|T$"
 #bookmark_constantinoplebynight_title:0 "[primary_title|E]: #V $TIER|U$ of $PLACE$#!"
 #bookmark_constantinoplebynight_culture:0 "[culture|E]: $CULTURE|V$"
 #bookmark_constantinoplebynight_age:0 "Age: $AGE|V$"
 #bookmark_constantinoplebynight_religion:0 "[religion|E]: $RELIGION|V$"
 bm_867_thelongnight:0 "Le Monde des Mortels"
 bm_867_thelongnight_desc:0 "#R Ce bookmark est destiné à être jouer dans un monde où la plupart des personnages titré sont des mortels, et seulement 1% sont des vampires. S’il vous plaît choisissez les règles du jeu "World of Darkness : World of Ignorance" et "Domination Surnaturel : Mortels: Les Innocents."\n\nSi vous laissez les règles du jeu définies sur "World of Darkness" et "Vampire : the Masquerade", vous obtiendrez un monde de non-vampires du canon qui sont majoritèrement des personnages titrés. Nous vous recommandons fortement le bookmark 1230 AD La Guerre des Princes et non celui-ci. Pourtant, la demande de jouer dans un monde pour la plupart banal avec très peu de vampires est souvent faite, alors le voici. D’autres peuvent profiter d’un bac à sable Vampire plus aléatoire en jouant à V:tM en 867.\n\nLe créateur de personnage World of Darkness sera disponible sous décisions. Profitez-en!#"
 bookmark_thelongnight_neklan_premsyl:0 "Neklan Premsyl"
 bookmark_thelongnight_neklan_premsyl_desc:0 "Destiné à être un jeu orienté sur les Revenants.\nFondateur de la famille de Revenant Premsyl, une expérience de Tzimisce sur la lignée royale de Bohême. Ils sont connus pour être des serviteurs du Methuselah Vukodlak et de son agent Azhra l’Unliving.\n\nVous vous en souvenez peut-être dans le jeu vidéo Vampire : the Masquerade -- Redemption."
 bookmark_thelongnight_michael:0 "Michael"
 bookmark_thelongnight_michael_desc:0 "Destiné à un jeu de vampire secret.\nLe Vampire Toreador Methuselah Michael se fait passer pour l’empereur byzantin Micheal III. Archange du Rêve Vampirique, il tente d’étendre son influence sur le monde mortel avec ce subterfuge."
 bookmark_thelongnight_rurik_rurikid:0 "Rurik"
 bookmark_thelongnight_rurik_rurikid_desc:0 "Destiné à un jeu de loup-garou, pour l’instant mortel.\nRurik aurait été un parent des Get of Fenris, une tribu de loups-garous.\n\nLes loups-garrous n’ont pas encore été implémenté dans le Mod Princes of Darkness."
 bookmark_thelongnight_theodosius:0 "Theodosius"
 bookmark_thelongnight_theodosius_desc:0 "Destiné à un jeu d'Inquisiteur.\nThéologien grec, ancien hérétique gnostique devenu catholique zélé, occultiste intellectuel, chasseur de vampires et fondateur de l’Ordre rouge."
 bm_868_constantinoplebynight:0 "Constantinople de Nuit"
 bm_868_constantinoplebynight_desc:0 "Michael, le Patriarche du Rêve à Constantinople connu par les mortels sous le nom de Michael III. Dracon est tombé en dépression après la destruction d'Antonius. Caius dirige les Ventrue Antonien.  Narses, l'Archevêque de Nod à Venise, cherche à étendre l'Hérésie Cainite à la partie Est Byzantine et également aux possessions traditionels des Lasombra au Sud en Italie et en Sicile.  Odin le tout-puissant, chef des Einherjar, est sur le point de devoir faire face a une menace plus redoutable que le gain de Fenris --il doit se tenir contre la menace prochaine des mortels se convertissant au dieu cloué.  Pendant ce temps, dans toute l’Europe de l’Ouest, les Ventrue forment un clan divisé de biens fédéraux concurrents, le plus puissant d’entre eux, Alexandre de Paris. L’ancien Promethean Dominic voit une occasion de venger la chute de Carthage sur eux de sa base parmi les conquérants Magyars. Une maison de mages, cependant, sont sur le point de bouleverser la société Kindred en usurpant le pouvoir du sang de Caïn pour eux-mêmes."
 bookmark_constantinoplebynight_michael:0 "Michael"
 bookmark_constantinoplebynight_michael_desc:0 "Patriarche du Rêve"
 bookmark_constantinoplebynight_odin:0 "Odin le Tout-Puissant"
 bookmark_constantinoplebynight_odin_desc:0 "Gloire aux Einherjar! Le Valhalla nous appel !"
 bookmark_constantinoplebynight_montano:0 "Montano"
 bookmark_constantinoplebynight_montano_desc:0 "Nous Agissons dans les Ombres"
 bookmark_constantinoplebynight_narses:0 "Narses"
 bookmark_constantinoplebynight_narses_desc:0 "Marteau des Goths" 
 bookmark_constantinoplebynight_shahiri:0 "Shahi'ri, Vieil Homme de la Montagne"
 bookmark_constantinoplebynight_shahiri_desc:0 "La Mort ne Prévient pas" 
 bm_1230_warofprinces:0 "Môyen-Age : Vampire"
 bm_1230_warofprinces_desc:0 "La Guerre des Princes est une période de grands conflits dans l’histoire Caïnite, même au regard de ses standards pourtant tumultueux. Les érudits morts-vivants estiment que la chute de Constantinople, au cours de la Quatrième Croisade en 1204, marque son commencement. Après la mise à sac de la cité et la mort du Rêve byzantin, les différents princes d’Europe se sont lancés dans de nombreux affrontements pour étendre leurs territoires et leurs influences, liguant les cours les unes contre les autres de manière particulièrement marquée.\nÀ ces troubles de l’époque, il faut ajouter la formation de l’Inquisition. Même si cette dernière a été initialement utilisée comme outil par les Anciens, elle a rapidement échappé à tout contrôle, et est devenue une menace pour l’ensemble des vampires.\nLa Guerre des Princes ne trouve pas de conclusion claire. Il semblerait qu’elle se soit achevée à l’avènement de la Révolte Anarch, mais d’aucuns supposent un dénouement plus prématuré.\n\n#bold Allez-vous rester seul vainqueur de cette guerre ? Ou bien la marée humaine effacera votre clan alors que celui-ci se retourne contre ses maîtres légitimes ?#!"
 bookmark_warofprinces_montano:0 "Montano"
 bookmark_warofprinces_montano_desc:0 "Le fidèle enfant de Lasombra en personne est le chef de son clan, qui s’étendant à toutes les terres de la Méditerranée. Bien qu’il soit en posture de force politique, tout en étant un très puissant caïnite, des troubles se profilent à l’horizon. La guerre civile en Ibérie, l’ascension de vieux fous en Italie, et l’indiscipline des jeunes Magisters mettent en péril la stabilité. Constantinople s’est récemment inclinée mais son prince, Alfonzo, n’est certainement pas un homme de confiance. La ligne de conduite la plus sage serait de rester focalisé sur l’Italie, dans un premier temps. Des vassaux ambitieux tels que Claudio Eugenio et le Prince de Rome, Titus Venturus Camille, nécessitent une surveillance de tous les instants ; pour aussi terrible que soit Montano, il est suffisamment sage pour connaître la première leçon des Lasombra : le plus grand danger est toujours celui qui jaillit des ombres.\n\n#bold Serez-vous capables de sécuriser la position légitime du clan Lasombra en tant que clan le plus influent d’Europe ?#!"
 bookmark_warofprinces_camilla:0 "Camilla"
 bookmark_warofprinces_camilla_desc:0 "Titus Venturus Camilla a tenu Rome pendant la majorité de sa glorieuse histoire. Il est, sans doute, la personnalité politique caïnite la plus importante dans l’Histoire. Après la destruction de Carthage et la mise en place des fondations de la Route des Péchés, il tomba en torpeur.\n\n#bold Après avoir été éveillé dans ce nouveau monde étrange, allez-vous vous élever à nouveau pour diriger le monde caïnite au nom de la gloire vibrante (et décadente) de Rome ?#!"
 bookmark_warofprinces_qawiya:0 "Qawiyya el-Ghaduba"
 bookmark_warofprinces_qawiya_desc:0 "Le clan des Salubris a été détruit, mené à sa proche extinction par les membres de la maison Tremere. La Lionne de Jérusalem, infante de Samiel lui-même, est le dernier espoir de sa lignée, sa dernière chance de survie face à l'assaut des Usurpateurs.\nQawiyya s'efforce désormais de sauver ce qui peut l'être. Pour cela, elle a tissé une alliance avec les Princes de la Région, connue sous le nom de la Diète des Oliviers. Toutefois, pour aussi déterminée que soit la Salubri, cet accord n'est pas aussi solide qu'il le devrait, et il se trouve déjà menacé par la proximité des Ashirra et des Baali. S'assurer de sécuriser sa propre base de pouvoir serait une décision des plus sages pour la dernière défenseuse des Cyclopes.\n\n#bold Transformerez-vous une dernière bataille futile en un glorieux réveil du clan Salubri ?#!"
 bookmark_warofprinces_alexander:0 "Alexandre"
 bookmark_warofprinces_alexander_desc:0 "Après plus d’un millénaire en tant que dirigeant absolu de la France, Alexandre a tout perdu à une conspiration menée par son propre enfant, Geoffrey du Temple. Maintenant en exil en tant qu’invité de la Croix Noire, le puissant Mathusalem complote son retour. Il n’a presque rien à son nom, excepté son impressionnant pouvoir personnel et sa légitimité... qui compte peu dans le grand schéma des choses. C’est presque un nouveau départ pour le grand enfant des Ventrue.\n\n#bold Serez-vous capable de faire payer Geoffrey et Salianna pour leur trahison et de reprendre votre trône légitime... ou de créer un nouvel héritage dans ces terres orientales ?#!"
 bookmark_warofprinces_werter:0 "Werter"
 bookmark_warofprinces_werter_desc:0 "Les anciennes traditions des Scandinaves périclitent, et avec elles, les enfants d'Odin. Alors que le Ventrue germanique lance son assaut final en Scandinavie, la plupart des Einherjar se sont résignés à leur sort, à la venue du Ragnarok et la ruine qu'il apporte.\n\n#bold En tant que dernier Très-Haut de votre peuple, accepterez-vous votre destin paisiblement ou bien arracherez-vous dans la violence et le combat votre place au Valhalla ?#!"
 bookmark_warofprinces_etrius:0 "Etrius"
 bookmark_warofprinces_etrius_desc:0 "Le plus jeune clan de vampires, les mages Tremere sont dans une situation difficile. Leur fondateur est en torpeur, se remettant de la diablerie commise sur Saulot, l'Antédiluvien Salubri. À présent, il incombe au loyal Etrius de faire survivre les siens aux assauts incessants des Tzimisces. Les Usurpateurs possèdent quelques atouts cependant ; leur magie de sang assure l'unité du groupe, tandis que les Ventrues de Germanie et d'Hongrie se sont ralliés à leur défense.\nLes ennemis des magiciens ne sont pas connus pour leur patience, et il sera nécessaire d'exploiter leur moindre conflit interne pour les vaincre.\n\n#bold Réussirez-vous à faire du clan une force politique à la hauteur des attentes de Tremere et son incomparable ambition ?#!"
 bookmark_warofprinces_rustovitch:0 "Rustovitch"
 bookmark_warofprinces_rustovitch_desc:0 "Le manteau de Voïvode n’est pas allé à l’aîné ou le plus puissant du Koldun, mais plutôt au plus ambitieux des Tzimisce. Vladimir Rustovitch a eu un règne mitigé jusqu’à présent, avec une paix blanche contre le Jurgen von Verden en croisade et la résilience humiliante du Tremere détesté. Comme c’est toujours le cas dans la politique tzimitienne, beaucoup n’aimeraient rien de plus que sa chute, d’abord parmi eux son prédécesseur, Norris. Mais Rustovitch n’est rien si ce n’est un politicien astucieux, s’il est capable d’obtenir quelques victoires clés, ses rivaux pourraient bientôt 'disparaître'...\n\n#bold Le 'Fléau des Loups' peut-il mener la querelle des seigneurs Tzimisce contre la menace des usurpateurs Ventrue et Tremere ?#!" 
 bookmark_warofprinces_mithras:0 "Mithras"
 bookmark_warofprinces_mithras_desc:0 "Une entité un peu mystérieuse, Mithra est considéré par certains comme un Dieu persan et romain littéral. Bien qu’improbable, cela lui a permis de créer un cadre fanatique d’enfants zélés et de cultes pour faire son offre. Ayant fui en Angleterre après l’échec de certaines machinations dans la Rome antique, Mithra s’ennuya rapidement des querelles mesquines parmi les seigneurs d’Angleterre. Décidant que son temps était mieux passé dans le sommeil, il laissa le royaume entre les mains de quelques Régents de confiance... qui laissèrent rapidement les choses s’écrouler. Après s’être relevé de sa torpeur, Mithras s’empressa de consolider le pouvoir et de réparer la plupart des dégâts que ses régents avaient causés. Maintenant, l’Angleterre est en sécurité, mais pas encore entièrement maîtrisée. Vous devrez faire face à un Gangrel sauvage au Pays de Galles, des hors-la-loi rebelles à Nottingham et les restes des Vikings d’Einherjar en Écosse. Après cela, le vide politique en France pourrait être utilisé avec votre tremplin à Bordeaux.\n\n#bold Il n’y a pas de limites à ce que vous pouvez aller. Voyez la gloire du soleil immortel !#!"
 bookmark_warofprinces_pustula:0 "Servius Marius Pustula"
 bookmark_warofprinces_pustula_desc:0 "Autrefois esclave dans la Rome antique, après un combat entre vampires, il a été embrassé par un Nosferatu. Puis, sous la tutelle de Tanitbaal, il canalisa sa colère en écrivant des poèmes satiriques. Quand son mentor disparut, Pustule et sa compagne Camilla conspirèrent contre ceux qui étaient ennemis de Tanitbaal et Camilla confièrent la route à Pustule avant de tomber dans la torpeur. Pustule a quitté Rome et a commencé à prêcher sa route à l’étranger, gagnant de nombreux nouveaux adhérents.\n\n#bold Maintenant que Camilla s’est réveillée, Servius doit décider s’il doit aider son ancien allié à restaurer Rome sous la Route du Péché.#!"
 bookmark_warofprinces_esclarmonde:0 "Esclarmonde la Noire"
 bookmark_warofprinces_esclarmonde_desc:0 "Embrassée pendant les campagnes de l’Abd-er Rahman contre les Francs, et a passé la plupart de son temps comme un nouveau-né dans la bataille contre les vampires maures envahisseurs. Comme elle avait passé la majeure partie de sa vie mortelle dans la politique changeante entre les royaumes de Toulouse, d’Aragon et d’Aquitaine, elle n’était pas étrangère à la politique de pouvoir au sein des cours de l’amour, bien qu’elle ait trouvé la plupart de ses pairs francs ennuyeux et grossier.\n\nC’est peu après le massacre de Béziers, au cours des premières étapes de la croisade contre les Cathares, que le roi Etienne accusa Esclarmonde de trahison et de complot avec la Lasombra d’Aragon. Le fait qu’elle ait choisi de ne pas comparaître devant la Grande Cour pour répondre à ses accusations n’a fait que confirmer ces accusations dans l’esprit de beaucoup. Bien qu’Etienne ait d’abord pensé que Esclarmonde allait bientôt fléchir, il a été pris par surprise par sa connaissance de la guerre." 
 bookmark_warofprinces_roque:0 "Roque"
 bookmark_warofprinces_roque_desc:0 "Peut-être l’un des prince malkavien les plus influents, Roque est un habile, bien que compulsif, intrigant et planificateur. Sa capacité à garder son fief lui a valu le respect à contrecœur du clan Lasombra, et il joue son rôle pour la Reconquista de l’Ombre. Sa fascination pour les intrigues et les machinations l’oblige à attendre et voir s’il peut harnacher ses ennemis en quelque chose d’utile avant de les détruire.\nRoque est également un disciple éminent de l’Ordo Aenigmatis et a estimé que le chaos que la Reconquista de l’Ombre apportée à travers l’Iberia annoncent une autre grande ère de destruction pour tous les caïnites.\n\n#bold Votre avenir est incertain, mais si vous parvenez à contrôler vos démons, vous pourriez rester le principal moteur de la Navarre pour les siècles à venir... et peut-être même jouer un rôle majeur dans la péninsule.#!"
 bookmark_warofprinces_natalya:0 "Natalya Syatoslav"
 bookmark_warofprinces_natalya_desc:0 "Fille d’un prince russe, Natalya fit ses études à Constantinople et tomba amoureuse de la ville pour toujours. Ses compétences en tant qu’administratrice ont portée une grande attention au Brujah qui lui a offert l’étreinte, qu’elle accepta avec plaisir.\nNatalya s’est ensuite immergée dans la construction d’un nouveau Carthage, en étant à la fois l’incarnation de ses idéaux de clan et du Rêve de Michael. Après que les croisés aient conquis Constantinople, elle fui au despotat d’Epirus où elle réussi à devenir princesse de Thessalonique. Elle voit sa ville comme une position de repli utile, mais elle rêve de récupérer Constantinople à Alfonzo et les sauvages latins.\n\n#bold Vous êtes peut-être le dernier espoir de créer une utopie rivalisant entre Carthage et Constantinople. Respectez les réalisations du passé et exploitez-les pour bâtir le meilleur avenir dont vous rêvez.#!"
 bookmark_warofprinces_jasmin:0 "Jasmin de Palma"
 bookmark_warofprinces_jasmin_desc:0 "Une sorcière des Banu Haqim d’origine almohade. Elle avait réussi à raviver la foi de l’Ashirra des Baléares, mais elle a moins réussi à les faire comprendre la menace chrétienne. Les vampires des Baléares jouissent de leur isolement du maintien de la Société Caïnite, formant une collection hétéroclite d’hermes, d’excentriques et d’inadaptés."
 bookmark_warofprinces_durga_syn:0 "Durga Syn"
 bookmark_warofprinces_durga_syn_desc:0 "La gentille mentor du clan Ravnos est peut-être la seule force du bien en Russie caïnite. Cette terre, maudite à jamais par Baba Yaga et son rideau d’ombre, n’apporte que misère et désespoir à ceux qui s’opposent à la sorcière tyrannique. Malgré ces terribles obstacles, Durga Syn n’a jamais faibli. Sa cour est devenue un phare d’espoir pour quiconque tente de récupérer la vieille terre des griffes des sbires de Baba Yaga. Si Durga devait manquer à son devoir, le rideau de l’ombre engloutirait certainement toute l’Europe dans son étreinte.\n\n#bold Ralliez les Ravnos autour de votre sage autorité, afin de vaincre les serviteurs déments de Baba Yaga et apporter de l’espoir à la Russie !#!"
 bookmark_warofprinces_maatkare:0 "Maatkare"
 bookmark_warofprinces_maatkare_desc:0 "Concubine de Set et béni d’une beauté (presque) sans égal, Maatkare est l’un des Hiérophants du clan Setite. Exerçant une influence considérable, elle dirige le temple des descendante de Aerie au Maghreb, où elle répand avec soin l’influence de Set parmi les caïnites mal guidés locaux.\nL’effondrement actuel de l'Ibérie musulmane a un effet d’entraînement et a déstabilisé la région. Un fait dont Maatkare profite maintenant, avec le rêve d’un clan Setite unifié de l’Ibérie à l’Egypte dans un coin de son esprit...\n\n#bold Vous êtes l’incarnation de l’amour éternel de Set pour tous ses enfants, égarés ou non. Vous leur montrerez, et ils apprendront. Car ils n’ont pas d’autre choix.#!"
 bookmark_warofprinces_matasuntha:0 "Matasuntha"
 bookmark_warofprinces_matasuntha_desc:0 "Matasuntha est une légende du vieux Gangrel. Chef des Huns nomades, elle a failli mettre Rome à genoux devant elle, ne s’arrêtant qu’en 403 lors d’un duel climatique dans les Alpes. Elle a ensuite été oubliée, puis elle fut récemment réveillée de la torpeur, trouvant ce nouveau monde étrange et épouvantable.\nSon clan jadis fier est divisé, repoussé par les serviteurs de la Croix, est une jeune génération ne connaissant ni son nom ni ses exploits passés. Il y a cependant de l’espoir, alors que la horde mongole balaie les steppes, Matasuntha y voit un digne successeur de son propre peuple.\n\n#bold Montrez à l’autre Gangrel des Steppes pourquoi Rome a imploré votre miséricorde il y a des siècles. Alors, assurez-vous que les faibles caïnites de l’Ouest n’oublient plus jamais votre nom.#!"
 bookmark_warofprinces_dionysius:0 "Dionysius"
 bookmark_warofprinces_dionysius_desc:0 "Un homme paisible, simple, dans ses jours de respiration, Dionysius a rejoint le culte de Perséphone dans une tentative futile pour atteindre ses parents tombés. Cette fascination pour la mort en fit un candidat évident pour l’étreinte des Cappadoces. La Non-Mort n’a pas beaucoup changé Dionyius cependant, et il a refusé de suivre les voies morbides de son clan, préférant prendre soin des mortels et des morts également. Attirant un grand nombre d’adeptes, il contribua à codifier la Voie de l’Humanité.\nLe grand respect qu’il a gagné lui a permis d’être choisi comme prince d’Athènes, une responsabilité qu’il occupe encore ce soir. Sa ville accueille maintenant un grand nombre de réfugiés de Constantinople tombés réclamant vengeance.\n\n#bold Vous devrez équilibrer vos convictions, et votre foi en l’Humanité, avec le chaos actuel en Grèce. Peut-être que votre leadership bienveillant est le seul remède pour arrêter la folie sans fin introduite par la 4e croisade.#!"
 bookmark_warofprinces_petaniqua:0 "Petaniqua"
 bookmark_warofprinces_petaniqua_desc:0 "Autrefois nommé Olympias, Petaniqua était l’épouse de Philippe II de Macédoine, et la mère d’Alexandre le Grand. A l’insu des autres, elle était aussi membre du culte de Cybèle, un fou de Baali Methuselah. Nourrie par sa 'Déesse', Petaniqua grandit pour haïr tous les hommes sauf son fils, pour lequel elle désirait le monde. Et le monde il l'a eu, mais l’éternité lui a été refusée, comme Cybèle interdit à Petaniqua de faire d’Alexandre un vampire.\nC’était le début d’un long et régulier déclin de sa santé mentale, qui se poursuit jusqu’à cette nuit. Depuis, Petaniqua est entrée dans des enfers encore plus profonds, faisant des pactes avec des entités qu’il vaut mieux ne pas connaître. Et elle ne sait même pas pourquoi.\n\n#bold Il doit y avoir un moyen de le trouver. Ou une entité assez puissante pour le ranimer. Alors, il sera le Roi du monde, et tout sera parfait une fois de plus.#!"
 bookmark_warofprinces_absalon:0 "Absalon"
 bookmark_warofprinces_absalon_desc:0 "Autrefois archevêque de Lund et l’un des hommes les plus puissants du Danemark, Absalon murmurait à l’oreille des rois et des caïnites. Une fois sa mort venue, ce fut une tâche facile d’organiser son ascension en tant que maître vampire de son pays. Ses premières années de règne furent couronnées de succès, instaurant soigneusement la paix entre les Ventrue méridionals et les sauvages Gangrels du nord. Jusqu’à ce qu’une campagne contre Wendic Tremere distraya Absalon pendant plusieurs décennies alors qu’il découvrait un puissant secret qui pourrait changer son destin. Malgré ses conseils, le Danemark a été la proie de petits seigneurs de guerre et d’aventuriers véreux. Mais cela ne durera pas, car Absalon est maintenant prêt à revenir dans son pays.\n\n#bold Récupérez votre droit de naissance et jouez soigneusement vos cartes, car le Sud et le Nord veulent que vous partiez.#!"
 bookmark_warofprinces_helena:0 "Hélène de Troie"
 bookmark_warofprinces_helena_desc:0 "De nombreuses armées se sont battues pour un simple regard sur la plus belle femme du monde. Mais Helena n’a jamais été une demoiselle en détresse comme elle l’a prouvé très tôt en diabolisant son propre père et son ravisseur, Minos. La politique vampirique lui convenait bien, et elle trouva refuge et amour à Carthage.\nMais l'amour n’est jamais censé durer cependant, et, une fois qu’elle a réalisé que défendre Carthage contre les Romains était futile, elle a trahi sa maison d’adoption pour les Latins. L’une des seules survivantes de la chute de Carthage, Menele de Sparte, chasse depuis lors pour sa destruction. Leur conflit a duré des millénaires et est devenu légendaire avec aucun d’eux ne pouvant obtenir un avantage. D’innombrables villes sont déjà tombées dans le sillage de leurs batailles.\n\n#bold Tuer Menele. Effacer toute trace de son existence. Alors, ils t’aimeront tous et te désespéreront.#!" 
 bookmark_warofprinces_tabitha:0 "Tabitha al-Masri"
 bookmark_warofprinces_tabitha_desc:0 "Alors que les royaumes musulmans s’effondrent avant la Reconquista, le clan Assamite envoie un groupe de ses meilleurs guerriers pour tenter d’arrêter l’invasion. Menés par Tabitha al-Masri, ils se sont établi à Badajoz et ont l’intention de tenir la ville aussi longtemps que possible. Tabitha n’est pas fanatique et permet à ceux qui se battent de fuir plutôt que de se battre. Elle a, jusqu’à présent, accepté l’appel du sultan Badr pour l’unité, mais abrite de sérieux doutes sur le souverain de Grenade. Elle sait cependant que toute désunion entraînerait un malheur pour les fidèles et garderait ses observations pour elle-même.\n\n#bold Votre mission est simple : Retenez la reconquista chrétienne, faites-la payer cher pour chaque centimètre de terre. Alors, peut-être qu’il sera temps de tester les véritables motifs du sultan Badr...#!" 
 
 bm_1375_patronwar:0 "La Guerre des Patrons"
 bm_1375_patronwar_desc:0 "Ce signet est calqué sur les souhaits de notre Patron et ne représente pas le canon WoD. Après la peste noire, le chaos s'est emparé de la société Vampire. Avec l'assèchement de l'approvisionnement en sang, de nombreux vampires sont entrés dans la torpeur, d'autres ont été détruits. Alors que l'humanité revient de la dévastation, les parents qui ont enduré la mort noire forgent de nouveaux empires et royaumes à la suite."
