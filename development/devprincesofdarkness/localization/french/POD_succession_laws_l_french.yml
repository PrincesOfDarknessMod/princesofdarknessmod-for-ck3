l_french:
 vampire_elective_succession_law:0 "Plus Puissant"
 vampire_elective_succession_law_effects:0 "Lorsqu’un changement de direction se produit dans la société Kindred, c’est souvent le candidat le plus puissant, ou le plus connecté, qui remporte le prix. Le [ruler|E] et tous ses [vassals|E] [de_jure|E] de l'un des deux [ranks|E] en dessous du titre [title|E] peut voter pour un [heir|E] parmis eux et la [close_family|E] du dirigeant."
 vampire_elective_candidates:0 "Proche Famille, Prétendants et Electeurs"
 vampire_elective_candidates_tooltip:0 "Pour être un candidat suffisamment puissant, un personnage doit remplir l’une des conditions suivantes :\n$EFFECT_LIST_BULLET$Be un membre légitime de la [close_family|E] du dirigeant actuel.\n$EFFECT_LIST_BULLET$Be Un [claimant|E] au titre.\n$EFFECT_LIST_BULLET$Be un [elector|E] feodal valide au titre"
 vampire_elective_electors:0 "Dirigeant et Vassaux"
 vampire_elective_electors_tooltip:0 "Pour être un [elector|E] valide dans la société Kindred , un vassal doit remplir toutes les conditions suivantes :\n$EFFECT_LIST_BULLET$Être un vassal [de_jure|E] du titre\n$EFFECT_LIST_BULLET$Être un vassal direct du titre\n$EFFECT_LIST_BULLET$Être un ou deux [ranks|E] en dessous du titre"
 tooltip_vampire_vote_strength_diplomacy:0 "Haute Diplomatie"
 tooltip_vampire_vote_strength_intrigue:0 "Haute Intrigue"
 tooltip_vampire_elector_vote_decrepit:0 "Ce gars est vieux. Genre, très vieux. Mieux vaut être de son bon côté."
