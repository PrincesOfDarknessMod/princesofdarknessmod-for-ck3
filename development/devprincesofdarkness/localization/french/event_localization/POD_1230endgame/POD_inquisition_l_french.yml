 PODinquisition.0001.t:0 "L’Age de l’Inquisition"
 PODinquisition.0001.desc:0 "Des rapports inquiétants ont été portés à votre attention. La soi-disant 'Inquisitions de l'Ombre' semble en avoir assez de la partie 'de l'Ombres' de son titre. Ils rassemblent soudainement du soutien parmi les dirigeants mortels et les institutions, ce qui a causé un effet papillon dans le monde entier. Ce mouvement a été planifié durant des décennies, peut-être des siècles et toutes leurs attaques jusqu’à présent ont été de simples missions de confinement et des expéditions de collecte d’informations. L’étendue réelle de la conspiration ciblant les vampires pourrait être bien plus grande que vous ne l’aviez prévu.\nPartout, les mortels s’arment derrière des Chasseurs doués, déterminés à abattre les monstres de la nuit qui les ont tourmentés depuis si longtemps. Le châtiment est à venir."
 PODinquisition.0001.a:0 "Ça va sûrement se calmer."
 PODinquisition.0001.b:0 "Aux armes frères et sœurs ! Finissons la chasse !"
 PODinquisition.1001.t:0 "L'Inquisition: France"
 PODinquisition.1001.desc:0 "C’est ici que l’Inquisition a commencé.\nDurant le soulèvement cathare, de nombreux hommes d'église ont trouvé leur voie dans le sud de la France, à la recherche d’hérétiques. Ils ont trouvé tellement plus. La France caïnite était mêlée dans une intrigue entre Paris et Toulouse, et les deux parties étaient heureuseux d’utiliser les mortels et le soulèvement à leur avantage.\nToutefois, ils ne s’attendaient pas à la détermination de l’Église. Des vampires ont été tués sur la route pendant la croisade albigeoise, et des informations ont été rapportées au Saint-Siège au sujet de cette nouvelle menace. Le reste est inscrit dans l’Histoire. En tant que tel, il n’est guère surprenant que la France soit une cible majeure et précoce d'une Inquisition ouverte qui se déroule actuellement dans le monde entier."
 PODinquisition.1001.a:0 "La Croix vient à nouveau purger la France"
 PODinquisition.1001.player_warning:0 "Il ne reste plus beaucoup de temps pour se préparer"
 PODinquisition.1002.t:0 "L'Inquisition: Angleterre"
 PODinquisition.1002.desc:0 "L’Inquisition a toujours eu du mal à agir en Angleterre. L’emprise de Mithras sur le pays, et l’insularité du peuple, ont rendu difficile pour les agents de Dieu d’accomplir leur sainte mission. Ils n’ont jamais cédé, et une solution adéquate a été trouvée : utiliser l’Ordre breton de l’Ermine comme base pour la purge de l’Angleterre.\nEt ainsi a commencé, derrière leur Grande maîtresse, des Bretons et des Britanniques loyaux et pieux marchant ensemble vers le processus de nettoyage des îles brittaniques. C’est un assaut total, l’Église n’a pas de réserves avec l’intention de frapper de façon décisive sur les possessions des suceurs de sang. Si cette tactique audacieuse fonctionne, l’Angleterre pourrait encore être sauvée."
 PODinquisition.1002.a:0 "Il semble que l’Église ne fléchira jamais, même ici"
 PODinquisition.1003.t:0 "L'Inquisition: Allemagne"
 PODinquisition.1003.desc:0 "Bien que la France soit là où réside la véritable origine de l’Inquisition, l’Allemagne est son centre névralgique. Une fois que l’Inquisition de l’Ombre du Moyen Âge commença à se dissoudre, c’est un noble autrichien, Leopold von Murnau, qui réunit tous ceux qui écoutrons l’appel de Dieu dans sa société secrète. La 'Société de Léopold' a été la principale force de l’Eglise pendant des siècles, et prépare maintenant son assaut final.\nLa Société n’est pas une force militaire et, après quelques compromis, il appartiendra à l’Ordre Teutonique de purger les serviteurs de l’Enfer du Saint Empire romain. Dûment informés de la prouesse de leurs ennemis, les Chevaliers ont maintenant pris pied à Dortmund, à partir de laquelle ils envisagent d’étendre lentement mais sûrement la fureur juste de Dieu."
 PODinquisition.1003.a:0 "Les Teutons sont-ils à la hauteur de cette tâche monumentale ?"
 PODinquisition.1005.t:0 "L'Inquisition: Ibérie"
 PODinquisition.1005.desc:0 "L'Ibérié a toujours été un centre religieux. En tant que tel, les ordres militaires sont nombreux, ce qui a présenté une opportunité importante pour l’Inquisition de l’Ombre. Il était assez facile de convaincre les différents ordres de la nécessité de purger l'Ibérie des sangsues, mais il était plus difficile de les faire travailler réellement ensemble.\nL’Eglise a utilisé la figure de Rodrigue de Navarre, fondateur de la première branche de l’Inquisition, comme point de ralliement pour les Ibères. Ce projet a bien fonctionné, et c’est une immense force des chevaliers de la Croix qui s’amasse maintenant au Portugal pour commencer la libération de l’Ibérié. Avec tous les Royaumes et les Ordres travaillant main dans la main, il semble que la victoire de l’Inquisition ici est assurée."
 PODinquisition.1005.a:0 "On s'y attendait"
 PODinquisition.1006.t:0 "L'Inquisition: Scandinavie"
 PODinquisition.1006.desc:0 "La portée de l’Inquisition sur la Scandinavie a toujours été faible. La terre est dure, divisée, et même les inquisiteurs les plus zélés doutent réellement que les Caïnites puissent vraiment prospérer ici. En tant que tel, cibler cette zone n’était pas dans les plans initiaux du Saint-Siège. C’est le dévouement et la vraie foi d’un habitant du Nord, Albjorn, qui a fait changer d’avis sa Sainteté. Albjorn plaida sa cause, décrivant l’emprise insidieuse des vampires sur le bon dévouement de la Scandinavie, en particulier dans le Grand Nord. Convaincu, Rome a maintenant jugé bon d’armer une expédition solide pour aider Albjorn dans sa quête. Le temps nous dira si c’était un bon choix ou non."
 PODinquisition.1006.a:0 "La Croix atteint même le bout du monde"
 PODinquisition.1007.t:0 "L'Inquisition: Italie"
 PODinquisition.1007.desc:0 "Il n’est pas surprenant que l’Inquisition ait gardé ses meilleures troupes pour l’Italie elle-même. Longtemps corrompu par les enfants maudits de Caïn, le Saint-Siège veut déchaîner son châtiment sur les Italiens qu’on n’aurait plus vus depuis le déluge biblique.\nJean de Lastic, le célèbre défenseur de Rhodes et grand maître des Chevaliers Hospitaliers, est chargé de brûler tous les vampires qu’il peut trouver. Et on lui a assigné une force formidable pour l’aider dans cette pieuse entreprise. En ce qui concerne le Saint-Siège, le monde entier est suspendu dans l’équilibre de la bataille pour l'Italie. Il y aura des compromis, aucune reddition et aucune miséricorde. L’Italie sera sauvée, comme Dieu l’exige."
 PODinquisition.1007.a:0 "Est-ce la fin des caïnites italiens ?"
 PODinquisition.1008.t:0 "L'Inquisition: Le Levant"
 PODinquisition.1008.desc:0 "Les États croisés sont partis depuis longtemps au Levant, mais l’Église n’a jamais oublié les rapports troublants qui en sont venus. Il était clair que, même dans ce pays le plus sacré, les maudits Caïnites règnent la nuit.\nMener une attaque ici a toujours été une perspective difficile pour l’Inquisition de l’Ombre, car la terre était entre des mains hostiles mais... ces mains hostiles sont toujours humaines. Et ainsi, un long et ardu processus diplomatique a commencé, où les meilleurs négociateurs de l’Italie travaillent jour et nuit pour convaincre leurs ennemis passés de les laisser opérer au Levant. Ils ont finalement réussi à les influencer et, comme l’Inquisition se lève partout, un contingent dévoué de chevaliers sacrés se tiennent prêts à sauver la Terre Sainte des menaces les plus viles."
 PODinquisition.1008.a:0 "En Terre Sainte, les Caïnites ont uni les mortels contre eux"
 PODinquisition.1009.t:0 "L'Inquisition: Arabie"
 PODinquisition.1009.desc:0 "Bien que le monde musulman manque d’une longue tradition d’ordres sacrés, cela ne signifie pas qu’il est aveugle à la menace caïïtite. Pendant longtemps, la Mecque elle-même a servi de protection parfaite, repoussant les monstres par la foi pure qui en émanait. Mais les temps changent, et les sangsues rusés semblent avoir conçu une contre-mesure.\nToute chose n’est toutefois pas perdue, car une petite famille de membres de tribus aux vues similaires s’est engagée à organiser la chasse. Cette nouvelle société, l’Ikhwan al-Safa, est maintenant assez forte pour lancer un assaut majeur sur les positions caïnites connues."
 PODinquisition.1009.a:0 "Le soleil brûlant pourrait être la fin des familles arabes"
 PODinquisition.1010.t:0 "L'Inquisition: Perse"
 PODinquisition.1010.desc:0 "A l'exception du monde musulman, les chasseurs n’ont jamais vraiment pu prendre racine en Perse, le contrôle total du clan Haqimite dans la région étant le coupable le plus probable. Bien qu’une organisation ne soit pas la seule chose qui compte pour un chasseur dévoué. En tant que tels, les individus, ou même les petites bandes, ont toujours été une épine dans le pied des enfants de Caïn ici.\nComme le reste du monde est englouti dans la contre-attaque mortelle, une alliance précipitée de plusieurs petits groupes a été formée en Perse, pour profiter du chaos environnant et, espérons-le, frapper un coup mortel aux monstres de la nuit."
 PODinquisition.1010.a:0 "La Perse est plus vieille que la plupart des humains ne le pensent"
 PODinquisition.1011.t:0 "L'Inquisition: Inde"
 PODinquisition.1011.desc:0 "L’Inde a une longue tradition de chasse aux monstres. Cependant, cette tradition a souvent été utilisée comme une bonne raison par des groupes qui n'était pas beaucoup mieux que les proies elles-mêmes et cette pratique a sévèrement entravé la création d’une organisation unifiée, comme ce qui s’est passé en Europe.\nAinsi, même si le monde occidental prend feu, l’Inde est relativement épargnée par le chaos. De petits rapports indiquent qu'une congrégation de chasseurs aurait vues similaires autour de Sindh. Ce qui pourrait justifier cependant, une certaine prudence de la part des vrais dirigeants de l’Inde."
 PODinquisition.1011.a:0 "Rien ne change vraiment dans le pays de la Guerre éternelle"
 PODinquisition.1012.t:0 "L'Inquisition: Maghreb"
 PODinquisition.1012.desc:0 "Loin de la portée de l’Inquisition chrétienne, le Maghreb se penche toujours avec intérêt sur l’assaut massif contre les caïnites. Ayant longtemps été frappés par la même menace, ses habitants ont formés une tradition de chasseurs solitaires, les Sayyad al-Ghulan.\nCes chasseurs cherchent maintenant, pour la première fois, à se regrouper, espérant profiter du chaos européen pour chasser les caïnites qui chercheront refuge sur leurs côtes."
 PODinquisition.1012.a:0 "Pas de refuge pour les vampires ici"
 PODinquisition.1013.t:0 "L'Inquisition: Egypte"
 PODinquisition.1013.desc:0 "Les Egyptiens sont conscients de la présence de monstres depuis très longtemps. C’est Baybars lui-même, le premier sultan mamelouk, qui a découvert la vérité sur les adorateurs de serpents qui se cachaient dans leur pays. La purge qu’il a orchestrée est encore ressentie aujourd’hui par les Setites mais, malheureusement, Baybars lui-même a été tué par un de leurs agents.\nDepuis, les Caïnites sont revenus à leurs temples, retrouvant leur force perdue. Mais au milieu du soulèvement européen contre cet ennemi, l’héritage de Baybars est porté par un groupe massif de jeunes Mamelouks, déterminés à venger leur ancêtre déchu."
 PODinquisition.1013.a:0 "Les Serpents peuvent-ils encore supporter cette tempête ?"
 PODinquisition.1014.t:0 "L'Inquisition: Transylvanie"
 PODinquisition.1014.desc:0 "Jusqu’à ce soir, l’Église est encore choquée par le nombre de rapports de vampires qui se promènent en Transylvanie. Avec certains d’entre eux agissant comme des nobles littéraux, ou même pire, des dieux ! Malheureusement pour l’Inquisition de l’Ombre, le paysage religieux contesté de cette région ne leur a jamais permis de s’emparer et de contenir vraiment la situation ici.\nIls ont donc dû faire quelque chose de nouveau, et cela s’est fait en 'déléguant' cette tâche de purge à l’Ordre du Dragon. Cette société chevaleresque connaît une quantité surprenante de vampires et autres, et était jusqu’à présent de grands alliés pour l’Inquisition. Mais, dans les coins de Rome, certains soupçonnent qu’un regard plus attentif sur eux pourrait être nécessaire une fois leur tâche terminée..."
 PODinquisition.1014.a:0 "Dragons contre Vampires"
 PODinquisition.1015.t:0 "L'Inquisition: Grèce"
 PODinquisition.1015.desc:0 "L’Inquisition de l’Ombre ont découvert la présence de suceurs de sang en Grèce depuis la 4ème Croisade, dont ils sont évidemment à blâmer. Sinon, comment aurait-il pu se tromper à ce point? Pendant longtemps, l’Empire latin a été conçu comme une base pour frapper quand l’Inquisition se révèlera mais... cette partie du plan a manifestement mal tourné.\nSa Sainteté n’a pas oublié les âmes chrétiennes de l’Orient, aussi capricieuses soient-elles. En tant que tel, il a récemment créé l’Ordre de Notre-Dame de Bethléem, avec la tâche juste de purger les Caïnites impurs de ces terres perdues. Alors, peut-être, Byzance pourra-t-elle être vraiment sauvé dans l’âme si ce n’est dans le corps."
 PODinquisition.1015.a:0 "Les Francs sont de retour dans la Rome Orientale"
 PODinquisition.1016.t:0 "L'Inquisition: Russie"
 PODinquisition.1016.desc:0 "L’Église orthodoxe a son propre corps inquisitoire, le groupe de chasseurs connu sous le nom d’Akritai. Respectés même par l’Inquisition de l’ombre pour sa poursuite implacable de la justice, les Akritai étaient au courant du plan de leurs homologues occidentaux pour une grande offensive contre les morts-vivants.\nIl a fallu les convaincre et négocier, mais ils ont finalement accepté d’y participer, recueillant des informations sur les caïnites russes et leurs agents. Ces renseignements seront maintenant utilisés à bon escient, car l’Exarque de l’Akritai lui-même prend du terrain près de Moscou pour lancer l’offensive la plus importante de leur organisation à ce jour."
 PODinquisition.1016.a:0 "Ils viennent de Russie..."
 PODinquisition.1017.t:0 "L'Inquisition: Europe de l'Est"
 PODinquisition.1017.desc:0 "L’Inquisition de l’Ombre est en conflit sur l’Europe de l’Est. Bien que la grande présence de païens dans le passé semble indiquer l’influence de Caïnites, ils ont eu du mal à confirmer cette théorie. En tant que tel, Rome a décidé de jouer sur le long terme, en créant l’Ordre de Dobrzyn il y a deux siècles.\nCes chevaliers ont fait un profil bas, même étant officiellement dissous après un certain temps, mais leur véritable tâche ne fait que commencer désormais. Rassemblant un groupe de guerriers dévoués de la foi, et aidés par la longue portée du réseau de l’Inquisition de l’Ombre, l’Ordre lance son attaque complète sur les abominations profanes dans le cadre de la grande croisade de l’Inquisition contre les vampires."
 PODinquisition.1017.a:0 "Même les ordres oubliés reviennent pour se battre !"
