 PODbirthsabbat.0002.t:0 "Emergence d’une nouvelle secte"
 PODbirthsabbat.0002.desc:0 "L’hypocrisie et l’arrogance éhontée de la Convention des Épines sont derrière vous maintenant, et la nouvelle 'Camarilla' pense qu’ils ont gagné et obtenu la fin de la révolte Anarch.\nVous le savez que c'est faux. La seule chose dont le mouvement a besoin pour gagner est une autorité forte centralisée . Votre autorité. Vous y avez pensé depuis le début de la convention. Et si, vous aussi, vous pouviez créer une secte pour vous opposer à la Camarilla ?\nLa plupart des Anarques ont rejoint cette nouvelle et alléchante cause. Le Sabbat se lève, serez-vous son héraut ?"
 PODbirthsabbat.0002.a:0 "Caïn a besoin d’un régent. Il a besoin de moi."
 PODbirthsabbat.0002.b:0 "...c’est une idée terrible" 
 sabbat_founder_modifier:0 "Fondateur du Sabbat"
 sabbat_founder_modifier_desc:0 "Ce personnage est l’un des fondateurs du redouté sabbat. Toujours protégé par l’impitoyable Main de l'Ombre, il porte une énorme autorité en ces temps de conflit sectaire."
 sabbat_begins_effect_message:0 "La plupart des anarques ont déjà rejoint le Sabbat naissant"
 PODbirthsabbat.0004.t:0 "Naissance du Sabbat"
 PODbirthsabbat.0004.desc:0 "La révolte Anarch a reçu un coup puissant par la Convention de l'Épines et la naissance de la Camarilla. Le mouvement n’est pas mort cependant, et a renaît dans quelque chose de plus... sinistre.\nCette nouvelle secte, qui s’appelle le Sabbat, a pris beaucoup d’ampleur parmi les Anarques mécontents. Ses principes fondamentaux sont encore assez nébuleux, mais une opposition claire à la Camarilla est apparente, comme la Masquerade est plus laxiste, et le culte de Caïn lui-même est autorisé. Reste à voir si ces Anarques réformés ne seront qu’une nuisance pour le nouvel ordre caïnite, ou s’ils seront capables de transformer à nouveau le paysage nocturne."
 PODbirthsabbat.0004.a:0 "Ils ont peut-être raison ?"
 PODbirthsabbat.0004.b:0 "Ils n'ont aucune chance" 
 
   
 