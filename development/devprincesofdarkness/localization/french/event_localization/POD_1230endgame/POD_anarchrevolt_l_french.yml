 PODanarchrevolt.0002.t:0 "La Révolte Anarch"
 PODanarchrevolt.0002.desc:0 "Alors que les feux de l’Inquisition font rage en Europe, les choses empirent. Les jeunes vampires, en colère pour être utilisés comme boucliers de viande inflammables contre les soldats de Dieu, se sont levés contre leurs aînés dans ce qui est rapidement connu comme la révolte anarque.\nIl s’agit pour l’instant principalement de nouveau-nés, de Furores et de Brujah avec quelques opportunistes, mais certains craignent que cela ne continue à faire effet boule de neige si rien n’est fait. Ces Anarchs sont faibles individuellement, mais ils se battent sans relâche pour quelque chose de rare pour une Famille : une cause."
 PODanarchrevolt.0002.a:0 "Il est temps de donner une leçon aux jeunes"
 PODanarchrevolt.0002.b:0 "Je vais rejoindre la Révolution !"
 anarch_revolt_effect_message:0 "Beaucoup de jeunes vampires, Brujah et Furores se convertissent à la cause Anarch. Ils seront enhardis et difficiles à contenir." 
 anarch_revolt_name:0 "Révolte Anarch"
 anarch_revolt_doctrine_name:0 "Combattants de la Liberté"
 anarch_revolt_doctrine_desc:0 "Les Anarch se battent pour quelque chose dont peu de Caïnites peuvent rêver. Une cause digne."
 PODanarchrevolt.0004.t:0 "La Révolte : Décès de Lasombra"
 PODanarchrevolt.0004.desc:0 "Bien que beaucoup aient du mal à le croire, il semble qu’un événement cataclysmique se soit produit récemment à Castel del Ombro. Le centre du pouvoir du Clan Lasombra a été la cible d’un assaut audacieux mené par un groupe d’Anarch de Lasombra aidés par certains des meilleurs agents de la caste redoutée des Guerriers Assamites.\nLes rapports de l’assaut réel sont vagues, et un seul Lasombra est sorti vivant de la forteresse, mais s’il faut le croire... Lasombra lui-même est mort. Cet événement a encouragé les Anarchs partout, et une grande majorité du Clan Lasombra s’est maintenant ralliée à la cause de l’enfant rebelle. La révolte des Anarchs chauffe nuit après nuit."
 PODanarchrevolt.0004.a:0 "Ils connaitrons leur place !"
 PODanarchrevolt.0004.b:0 "...il est peut-être temps de revoir ma position"
 lasombra_revolt_effect_message:0 "Le clan Lasombra se convertit à la cause anarque. Seuls les plus puissants de leurs dirigeants pourraient résister." 
 slayer_of_gods:0 "Pourfendeurs des Dieux"
 slayer_of_gods_desc:0 "Ce personnage a, sans doute, tué l’un des tout puissant Antédiluvien. Il impose le respect et la peur dans une égale mesure."  
 PODanarchrevolt.0006.t:0 "La Révolte : Décès d’Absimilliard"
 PODanarchrevolt.0006.desc:0 "L’impossible est arrivé.\nDans l’une des forêts les plus profondes de Russie, un groupe d’Anarch Nosferatu a réussi à traquer ce qu’ils prétendaient être le lieu de repos de l’ancêtre monstrueux de leur clan, Absimilliard. Après une terrible bataille contre les gardiens du tombeau, un seul des assaillants resta, mais il aurait, d'après les rumeurs, tué l’Antédiluvien dans son sommeil. Partout dans le monde, le Clan Nosferatu respire enfin librement, et pour la première fois depuis sa création, et se joint massivement à la cause Anarch pour honorer leur sauveur.\nPartout en Russie, le rire maniaque d’une vieille dame peut être entendu nuit après nuit depuis l’événement..."
 nosferatu_revolt_effect_message:0 "Le clan Nosferatu se convertit à la cause Anarch. Seuls les plus puissants de leurs dirigeants pourraient résister." 
 PODanarchrevolt.0008.t:0 "La Révolte : Décès d’Ennoia"
 PODanarchrevolt.0008.desc:0 "De graves nouvelles en provenance du Nord gelé sont arrivées, la meute Anarch Gangrel qui est partie traquer Ennoia, l’ancêtre de leur clan, est revenue. Ou du moins l’un d’entre eux.\nCe survivant tourmenté, mais fier, raconte des histoires de merveilles et de monstres, de trahisons et de batailles dignes du Ragnarok lui-même. Mais, à la fin, le guerrier parle de la mort d’Ennoia elle-même, tuée dans son sommeil de torpeur après le terrible combat contre les gardiens de sa tombe. Évidemment, il est incroyablement difficile de vérifier de telles affirmations, mais elles ont déjà eu un puissant effet dans le clan Gangrel car beaucoup d’entre eux ont rejoint la cause Anarch. La révolte chauffe nuit après nuit."
 gangrel_revolt_effect_message:0 "Le clan Gangrel se convertit à la cause Anarch. Seuls les plus puissants de leurs dirigeants pourraient résister." 
 PODanarchrevolt.0010.t:0 "La Révolte : Death of Tzimisce"
 PODanarchrevolt.0010.desc:0 "C’est encore arrivé.\nUn groupe de Tzimisce Anarchs a fait un raid contre certains anciens de leur clan, dans le but ostensible de sécuriser le lieu de repos de l’Antédiluvien. Après avoir obtenu cette information, leur armée a marché sur le monastère de Semog et une terrible bataille s’en est suivie avec le défenseur Szlachta. Émergeant victorieux, les Anarchs réussirent à dissiper les protections magiques de la tombe, et leur chef dévora avidement Tzimisce lui-même.\nCette victoire époustouflante a plongé le vieux clan dans les mains de la Révolte, revendiquant sa place comme l’une des rares lignées à avoir réussi à se débarrasser de son ancêtre."
 tzimisce_revolt_effect_message:0 "Le clan Tzimisce se convertit à la cause Anarch. Seuls les plus puissants de leurs dirigeants pourraient résister." 
 PODanarchrevolt.0012.t:0 "La Révolte : Décès d’Arikel"
 PODanarchrevolt.0012.desc:0 "Arikel, l’ancêtre du clan Toreador, s’est toujours démarqué dans le Grand Jeu joué par les Antédiluviens. Mais ça n’a pas suffi à la protéger de la révolte Anarch.\nDes rapports vous sont parvenus qu’une force audacieuse d’Anarch Toreador a attaqué son havre en Crète, apparemment aidée par des informations fournies par certains vieux Nosferatus. Le reste de l’histoire est déroutante, certains membres survivants affirme qu’Arikel était endormie, tandis que d’autres parlent d’une grande bataille, mais ils sont tous d’accord pour dire que le Taureau-Danseur d’Hénoch est déchu de sa propre lignée.\nEncouragé par cette nouvelle, le clan Toreador prend désormais un rôle beaucoup plus actif dans la révolte Anarch."
 toreador_revolt_effect_message:0 "Le clan Toreador se convertit à la cause Anarch. Seuls les plus puissants de leurs dirigeants pourraient résister." 
 PODanarchrevolt.0014.t:0 "La Révolte : Décès de Ventru"
 PODanarchrevolt.0014.desc:0 "Même le clan des Rois n’est pas épargné par la folie de la révolte Anarch. Quelque part dans les tréfonds de la Perse, une cohorte d’Anarch Ventrue est tombée sur la tombe d’un Antédiluvien. Certains disent qu’ils cherchaient Haqim, l’ancêtre de l’Assamite, et qu’ils ont été trompés par son enfant rusé, d’autres parlent simplement d’une prise de pouvoir évidente et assez grossière.\nQuelle que soit la véritable raison, ces Ventrue sont de retour, revendiquant la mort de leur ancêtre disparu depuis longtemps. Bien que douteuse, cette affirmation a conduit de nombreux Ventrue à rejoindre la révolte Anarch, où ils se glissent facilement dans des postes de commandements. La plupart des Anarchs sont préoccupés par le fait qu’il s’agit d’une menace pour l’idéologie réelle de la Révolte, mais ils ne sont pas vraiment en mesure de nier une main si puissante qui les tend."
 ventrue_revolt_effect_message:0 "Le clan Ventrue se convertit à la cause Anarch. Seuls les plus puissants de leurs dirigeants pourraient résister." 
          
     
 
 