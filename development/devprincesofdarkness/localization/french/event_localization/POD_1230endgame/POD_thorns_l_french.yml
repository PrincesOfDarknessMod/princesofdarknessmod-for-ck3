l_french:

 PODthorns.0002.t:0 "La Convention des Épines"
 PODthorns.0002.desc:0 "Alors que la révolte Anarch fait rage dans le monde caïnite, aidée par l’Inquisition toujours présente, un événement sans précédent s’est produit. Plusieurs anciens de divers clans ont appelé à une réunion de paix et à la création d’une nouvelle organisation pour la Famille.\nCette organisation, la Camarilla, serait une secte inclusive qui s’occuperait de protéger la Mascarade et les relations entre les anciens et les nouveau-nés. Beaucoup de gens, surtout parmi les Anarches, se méfient de cette initiative, mais c’est déjà un succès politique surprenant, car des représentants de presque toute l’Europe se réunissent pour parler de cette proposition.\nLe futur de la Famille pourrait être décidé dans cette petite ville anglaise dans les nuits à venir."
 PODthorns.0002.a:0 "Le changement arrive"
 thorn_begins_effect_message:0 "Chaque clan choisira une position concernant cette proposition. Si vous êtes assez fort, vous pourriez être le représentant de votre propre clan." 
 PODthorns.0003.t:0 "Les épines : Les Ventrue"
 PODthorns.0003.desc:0 "Old habits are immortals and, as such, it is Clan Ventrue that will open the Convention. Many are expecting the Kings to find a way to assure their leadership over any new sect. Lesir choice is also very likely to impact their traditional rivals as rulers of the night, the Lasombra and Tzimisce."
 PODthorns.0003.a:0 "La Camarilla est l’avenir"
 PODthorns.0003.b:0 "Nous ne ferons jamais partie de cette folie !"
 PODthorns.0003.c:0 "La neutralité est la clé de notre survie"
 choose_camarilla_effect_message:0 "Vous rejoignez la Camarilla, la plupart de votre clan vous suivra" 
 choose_opposition_effect_message:0 "Vous restez dans l'opposition en rejoignant les Anarchs, la plupart de votre clan vous suivra" 
 choose_independance_effect_message:0 "Rien ne change pour vous ou votre clan" 
 PODthorns.0004.t:0 "Les épines : Camarilla Ventrue"
 PODthorns.0004.desc:0 "Dans un mouvement pas si surprenant, les Ventrue se sont alignés avec la Camarilla naissante, espérant probablement prendre les rênes du pouvoir alors qu’ils le peuvent encore. La Convention se poursuit alors que les autres représentants discutent de cette initiative."
 PODthorns.0004.a:0 "Une victoire pour la Camarilla"
 PODthorns.0004.b:0 "Je dois les rejoindre !"
 PODthorns.0005.t:0 "Les épines :  Ventrue Opposé"
 PODthorns.0005.desc:0 "Surprenante tournure des événements dans les phases d’ouverture de la Convention des épines, alors que le représentant des Ventrue est sorti précipitamment de la table de négociation, qualifiant l’ensemble du processus de triste plaisanterie. Il semble que le Clan Ventrue ne participera pas à la Camarilla et s’est aligné avec l’opposition anarque, espérant peut-être mettre de l’ordre dans le mouvement sans chef jusqu’à présent."
 PODthorns.0005.a:0 "Une victoire pour l'opposition"
 PODthorns.0006.t:0 "Les épines :  Ventrue Neutre"
 PODthorns.0006.desc:0 "Surprenante tournure des événements dans les phases d’ouverture de la Convention des épines, le représentant des Ventrue ayant annoncé la neutralité totale de son clan dans un avenir prévisible. Peut-être que les Ventrue n’étaient pas en position de revendiquer le commandement sur les sectes naissantes ? C’est ce qu’affirment les négociateurs enhardis des Lasombra et des Tzimisce, qui sentent maintenant l’occasion de jouer eux-mêmes un rôle de premier plan."
 PODthorns.0006.a:0 "Qu’est-ce qui rend un clan neutre ?"
 PODthorns.0007.t:0 "Les épines : Les Lasombra"
 PODthorns.0007.desc:0 "Alors que les représentants des Lasombra prépare sa déclaration, beaucoup s’attendent à ce que les Magistères soient du côté opposé au Ventrue. Il ne peut y avoir qu’un nombre limité de clans au pouvoir dans une secte après tout."
 PODthorns.0008.t:0 "Les épines : Camarilla Lasombra"
 PODthorns.0008.desc:0 "Dans un discours passionné, le représentant des Lasombra déclare son clan pleinement en faveur de la Camarilla naissante. Déjà esquissant un plan pour ses institutions, apparemment suivant la hiérarchie de l’Église mortelle, beaucoup s’attendent à ce que les Magistères soient sur le siège principal de la nouvelle secte."
 PODthorns.0009.t:0 "Les épines : Opposé Lasombra"
 PODthorns.0009.desc:0 "Il semble que la Camarilla aura un puissant ennemi sous la forme du clan Lasombra. Son représentant a maudit la résolution proposée et a quitté la Convention en toute hâte. Autour de la cause des Anarques, les Magistères préparent déjà un projet pour leur nouvelle secte."
 PODthorns.0010.t:0 "Les épines : Lasombra Neutre"
 PODthorns.0010.desc:0 "Il semble que le clan Lasombra ait fini de prétendre au trône des chefs de la nuit. Alors que leur représentant annonce son choix de neutralité, d’autres théorisent déjà que les Magistères concentreront désormais leurs efforts sur des sujets plus obscurs et mystiques."
 PODthorns.0011.t:0 "Les épines : Les Brujah"
 PODthorns.0011.desc:0 "Une grande majorité du mouvement anarche originel, les membres du clan Brujah sont encore assez divisés sur la façon d’aborder la Convention. Certains y voient une reddition humiliante, d’autres la possibilité d’un traité de paix honorable. Avec un point de vue aussi divisé et passionné sur la négociation, ce sera à leur représentant d’être la voix décisive."
 PODthorns.0012.t:0 "Les épines : Camarilla Brujah"
 PODthorns.0012.desc:0 "Enfin, les Brujah ont déposé leurs armes. Le processus a été long et ardu, mais une paix a été signée. Le clan fait désormais partie intégrante de la Camarilla, malgré les grognements de ses hardliners."
 PODthorns.0013.t:0 "Les épines : Brujah Opposé"
 PODthorns.0013.desc:0 "La guerre ne change jamais, tout comme les Brujah. Le clan rebelle a refusé de se rendre et de signer un traité de paix avec la Camarilla naissante. La Révolte Anarch continue, mais certains cherchent à réformer le mouvement divisé en une secte plus cohésive, pour mieux poursuivre le combat."
 PODthorns.0014.t:0 "Les épines : Brujah Neutre"
 PODthorns.0014.desc:0 "Peu auraient pu prédire le résultat des négociations pour le clan Brujah. Dans un discours déterminé, son représentant a simplement dit qu’ils ne se prosterneront plus jamais devant une autre autorité. En tant que tels, les Brujah laissent la convention aussi divisée qu’ils y sont entrés."
 PODthorns.0015.t:0 "Les épines : Les Malkavian"
 PODthorns.0015.desc:0 "Soyons honnêtes. Personne n’a la moindre idée de la position que le clan Malkavian adoptera pendant le congrès, probablement même pas son représentant. Pourtant, aussi dangereux qu’ils soient, les fous ne doivent pas être sous-estimés, et sont courtisés par les nombreuses factions réunies ici."
 PODthorns.0016.t:0 "Les épines : Camarilla Malkavian"
 PODthorns.0016.desc:0 "Le clan Malkav s’est joint à la Camarilla sous les applaudissements prudents des représentants de cette secte. Bien que certains qualifieraient une telle aide de malédiction, la Camarilla naissante semble satisfaite d’avoir les prophètes dangereux de leur côté."
 PODthorns.0017.t:0 "Les épines : Malkavian Opposé"
 PODthorns.0017.desc:0 "Il semble que le clan Malkav ait prévu... quelque chose d’important à propos de la Révolte Anarch. Le représentant de Lesir, dans une description quelque peu douteuse d’un événement apocalyptique, a officiellement rallié son clan à la cause de la rébellion. Les Anarchs, pour leur part, sont aussi surpris que quiconque par cette soudaine tournure des événements."
 PODthorns.0018.t:0 "Les épines : Malkavian Neutre"
 PODthorns.0018.desc:0 "Revenant à ses racines en tant que clan de prophètes et de conseillers, les Malkaviens ont déclaré leur neutralité dans le conflit en cours. Il semble que tout le monde aura le plaisir douteux de les gérer à l’avenir."
 PODthorns.0019.t:0 "Les épines : Les Toreador"
 PODthorns.0019.desc:0 "Bien que Michael soit parti depuis longtemps, les Toreador sont toujours un clan puissant avec une base de pouvoir solide à travers l’Europe. Comme ils ont été les premiers à proposer l’idée de la mascarade forcée pour la Camarilla, ils choisiront probablement cette secte. Mais leur nature passionnée peut aussi les rapprocher de la Révolte..."
 PODthorns.0020.t:0 "Les épines : Camarilla Toreador"
 PODthorns.0020.desc:0 "Comme prévu, le Clan Toreador a officiellement rejoint la Camarilla, leur préoccupation pour l’application de la Mascarade ayant dépassé leur esprit passionné."
 PODthorns.0021.t:0 "Les épines : Toreador Opposé"
 PODthorns.0021.desc:0 "La passion brûlante et l’émotion ont gagné la journée, comme le représentant de Toreador a fait un discours exaltant louant la cause Anarch. Il semble que l’alliance traditionnelle du Toreador avec les clans au pouvoir soit terminée, pour l’instant."
 PODthorns.0022.t:0 "Les épines : Toreador Neutre"
 PODthorns.0022.desc:0 "Surprenant tout le monde, le représentant de Toreador a annoncé la neutralité de son clan pour l’avenir prévisible. Peut-être que les Roses en ont assez de la guerre et de la rébellion ?"
 PODthorns.0023.t:0 "Les épines : Les Tremere"
 PODthorns.0023.desc:0 "Les Magii ont fait une entrée explosive dans le monde de la politique de la Famille et beaucoup ne voudraient rien de plus que de les voir écrasés pour de bon. Il est probable qu’ils rejoindront la Camarilla, espérant y trouver refuge, en échange de leur puissante maîtrise de la magie du sang à la disposition de la secte."
 PODthorns.0024.t:0 "Les épines : Camarilla Tremere"
 PODthorns.0024.desc:0 "Comme la plupart des conventions attendues, les Tremere ont prêté allégeance à la Camarilla. Beaucoup les voient déjà comme le vrai pouvoir derrière le trône dans la secte naissante."
 PODthorns.0025.t:0 "Les épines : Tremere Opposé"
 PODthorns.0025.desc:0 "Événement surprenant à la Convention, alors que les Tremere ont annoncé leur soutien au Mouvement Anarch. Est-ce un échec dans leur pyramide ou une partie d’un grand schéma?"
 PODthorns.0026.t:0 "Les épines : Tremere Neutre"
 PODthorns.0026.desc:0 "Il semble que les Mages ne s’inclineront devant personne d’autre que eux-même, car leur représentant a annoncé leur neutralité dans le conflit en cours. Nul doute que leurs services de sorciers mercenaires seront très recherchés."
 PODthorns.0027.t:0 "Les épines : Les Tzimisce"
 PODthorns.0027.desc:0 "Le puissant clan des Démons de l’Est devrait prendre position contre les ennemis haïs de Tremere. La neutralité est également une option sérieusement envisagée par de nombreux membres plus âgés, car ils ne se soucient pas du monde à l’extérieur de leurs sombres châteaux."
 PODthorns.0028.t:0 "Les épines : Camarilla Tzimisce"
 PODthorns.0028.desc:0 "Bien que le débat ait été dur, le clan Tzimisce a accepté de rejoindre la Camarilla. Beaucoup de détails plus fins restent à débattre cependant, comme le Masquerade en Transylvanie..."
 PODthorns.0029.t:0 "Les épines : Tzimisce Opposé"
 PODthorns.0029.desc:0 "La confusion et la colère sont vives à la Convention des épines alors que le représentant de Tzimisce vient de lancer une partie surdimensionnée de son anatomie sur l’un de ses adversaires avant de s’enfuir. Il semble que les Tzimisce ne soient pas satisfaits de la proposition de la Camarilla."
 PODthorns.0030.t:0 "Les épines : Tzimisce Neutre"
 PODthorns.0030.desc:0 "Les plus anciens membres du clan Tzimisce semblent avoir gagné le débat interne, car leur représentant vient d’annoncer la neutralité des Fiends dans la guerre en cours. Beaucoup ont exprimé des inquiétudes comme l’état de la mascarade en Transylvanie avec une telle décision."
 PODthorns.0031.t:0 "Les épines : Les Gangrel"
 PODthorns.0031.desc:0 "Les Gangrel ne peuvent plus le nier, leur monde se meurt. Peu importe leurs prouesses sous le ciel nocturne, leurs mortels ont été influencés par la Croix ou le Croissant. Dans cet environnement en rapide évolution, beaucoup cherchent un endroit pour se réfugier. Chaque faction aimerait être cet endroit."
 PODthorns.0032.t:0 "Les épines : Camarilla Gangrel"
 PODthorns.0032.desc:0 "Le représentant des Gangrel a accepté à contrecœur de rejoindre la Camarilla. Peut-être que le clan trouvera un nouveau but en tant qu’exécuteurs et chiens de chasse de cette secte maintenant."
 PODthorns.0033.t:0 "Les épines : Gangrel Opposé"
 PODthorns.0033.desc:0 "Certains diraient que les Gangrel ont cédés à leur côté féral, comme ils ont choisi de promettre leur soutien à la cause Anarch, peut-être à la recherche d’une guerre digne d’être combattue. Une énorme aubaine pour les rebelles de toute façon."
 PODthorns.0034.t:0 "Les épines : Gangrel Neutre"
 PODthorns.0034.desc:0 "Le méfiant Clan Gangrel semble en avoir assez de ce monde étrange et nouveau dans lequel ils se retrouvent jetés. Déclarant leur neutralité, seuls ils choisiront la prochaine cible de leur chasse sans fin."
 PODthorns.0035.t:0 "Les épines : Les Nosferatu"
 PODthorns.0035.desc:0 "A première vue, le Nosferatu semble très intéressé par l’idée de la Camarilla. Toujours à la recherche de protection contre les horreurs de leur ancêtre, ils cherchent la force en nombre. Avec une diplomatie astucieuse, ils pourraient trouver une solution différente."
 PODthorns.0036.t:0 "Les épines : Camarilla Nosferatu"
 PODthorns.0036.desc:0 "Ce n’était pas une grande surprise quand le représentant du Nosferatu a annoncé le soutien total de son clan pour la Camarilla naissante. Les nouvelles sectes peuvent désormais compter sur un réseau loyal et puissant d’informateurs."
 PODthorns.0037.t:0 "Les épines : Nosferatu Opposé"
 PODthorns.0037.desc:0 "Des nouvelle surprenante lors de la Convention des épines, le Nosferatu s’est joint au mouvement Anarch. Beaucoup se demandent si les Cachés ont des informations secrètes qui ont fait pencher la balance contre la Camarilla..."
 PODthorns.0038.t:0 "Les épines : Neutre Nosferatu"
 PODthorns.0038.desc:0 "Il a fallu plusieurs nuits avant que cela ne soit remarqué, mais le représentant de Nosferatu a disparu de la Convention. Il semble que les Cachés ne participeront pas à la naissance des sectes."
 PODthorns.0039.t:0 "Les épines : Les Disciples de Set"
 PODthorns.0039.desc:0 "Bien qu’ils aient été officiellement invités à rejoindre la Camarilla, personne ne s’attend vraiment à ce que les Disciples de Set acceptent. Lesir voies mystiques les rendent très en contradiction avec le cadre proposé de la nouvelle secte."
 PODthorns.0040.t:0 "Les épines : Camarilla Setites"
 PODthorns.0040.desc:0 "Comme le représentant des Disciples de Set accepte la proposition de rejoindre la Camarilla devant un public abasourdi, tous se demandent déjà quel est le motif ultérieur derrière ce choix. Le serpent vient d’être accepté dans le jardin ?"
 PODthorns.0041.t:0 "Les épines : Setites Opposés"
 PODthorns.0041.desc:0 "Il semble que la création de la Camarilla, une autorité centralisée pour les vampires, a beaucoup plus irrité les Setites que quiconque ne l’attendait. Parlant de la perception de Set comme un 'Grand Libérateur', leur représentant a engagé le clan à la cause des Anarques."
 PODthorns.0042.t:0 "Les épines : Setites Neutres"
 PODthorns.0042.desc:0 "Déclinant poliment l’offre mitigée de la Camarilla, le représentant de Setite a fait ce que tout le monde pensait être le résultat le plus probable : confirmé la neutralité de son clan dans la lutte en cours."
 PODthorns.0043.t:0 "Les épines : Les Assamite"
 PODthorns.0043.desc:0 "Alors que l’expansion ottomane menace l’Europe, la Camarilla naissante est divisée sur la façon de la gérer. Les Assamite ont été très actifs dans l’ombre des Turcs, et la Convention des épines sera l’occasion pour les deux parties d’essayer au moins de régler leurs différends."
 PODthorns.0044.t:0 "Les épines : Camarilla Assamite"
 PODthorns.0044.desc:0 "Dans une démonstration surprenante de diplomatie des deux factions, les Assamites et la Camarilla sont arrivés à un arrangement révolutionnaire, intégrant totalement les enfants de Haqim dans la nouvelle secte. Une nouvelle ère de relations entre l’Est et l’Ouest s’ouvre."
 PODthorns.0045.t:0 "Les épines : Assamite Opposé"
 PODthorns.0045.desc:0 "Les pourparlers se sont rompus entre la Camarilla et les Assamites. Il semble que toute la Convention ait aggravé les choses, alors que les Enfants de Haqim ont promis leur aide au mouvement Anarch, espérant briser l’ordre ancien et nouveau des caïnites européens."
 PODthorns.0046.t:0 "Les épines : Assamite Neutre"
 PODthorns.0046.desc:0 "Comme le représentant des Assamites quitte la Convention, rien n’a beaucoup changé. La neutralité ténue des enfants de Haqim dans les affaires des caïnites occidentaux se poursuit."
 PODthorns.0047.t:0 "Les épines : Les Cappadocien"
 PODthorns.0047.desc:0 "Le Clan de la Mort a toujours été divisé et a subi de nombreuses purges et restructurations. Pourtant, il a toujours été un clan respecté et, malgré ses habitudes recluses, a désormais reçu une invitation formelle à rejoindre la Camarilla."
 PODthorns.0048.t:0 "Les épines : Camarilla Cappadocian"
 PODthorns.0048.desc:0 "Après une longue discussion, il semble que la Camarilla et le Clan de la Mort se soient mis d’accord. La secte naissante compte un membre de plus et se félicite déjà de cette réalisation."
 PODthorns.0049.t:0 "Les épines : Cappadocian Opposé"
 PODthorns.0049.desc:0 "Bien que personne ne sache exactement ce qui s’est passé, les pourparlers entre la Camarilla et le Clan de la Mort se sont complètement retournés contre elle. Se sentant insultés et maltraités, ils ont choisi de s’allier au mouvement Anarch, qui s’étonne de ce soutien soudain."
 PODthorns.0050.t:0 "Les épines : Cappadocian Neutre"
 PODthorns.0050.desc:0 "Comme la plupart de la Convention s’y attendaient, le Clan de la Mort a déclaré sa neutralité dans le conflit en cours. Comme le reste de ce groupe mystérieux et reclus d’érudits ont toujours été."
 PODthorns.0051.t:0 "Les épines : Les Salubri"
 PODthorns.0051.desc:0 "Malgré leurs nombreux ennemis, les Salubri sont toujours une force avec laquelle il faut compter. Ils ont enduré jusqu’à ce soir et ont évidemment été invités à la Convention. La plupart s’attendent à ce qu’ils prennent le côté opposé du clan haï Tremere, mais la neutralité est également une forte possibilité, car la guerre sans fin leur a déjà coûté cher."
 PODthorns.0052.t:0 "Les épines : Camarilla Salubri"
 PODthorns.0052.desc:0 "Les Camarilla se félicite alors que le Salubri les rejoint officiellement. Ils se sont déjà engagés à contribuer à freiner la campagne de désinformation qui se poursuit au sujet de leurs nouveaux alliés et à leur redonner leur véritable place en tant que clan des guérisseurs."
 PODthorns.0053.t:0 "Les épines : Salubri Opposé"
 PODthorns.0053.desc:0 "Le châtiment est le nom du moment pour le clan Salubri. Ils veulent se venger de toutes les horreurs qu’ils ont endurées, et ils ont trouvé de nouveaux alliés dans le mouvement Anarch. Peut-être que leur souffrance commune les a réunis."
 PODthorns.0054.t:0 "Les épines : Salubri Neutre"
 PODthorns.0054.desc:0 "Leur lutte pour la survie a beaucoup coûté au clan Salubri. Il est temps pour eux de guérir, l’âme et le corps de même. Par ces mots, leur représentant confirme la neutralité du clan dans la crise en cours."
 PODthorns.0055.t:0 "Les épines : Les Ravnos"
 PODthorns.0055.desc:0 "Les Ravnos ont toujours été des étrangers aux caïnites occidentaux, mais cet état des choses change rapidement à mesure que le clan indien est de plus en plus présent en Europe. Comme un clin d’œil à cette force retrouvée, ils ont été invités à la Convention, même si la plupart des gens pensent qu’ils vont s’en tenir à une neutralité prudente dans la guerre en cours."
 PODthorns.0056.t:0 "Les épines : Camarilla Ravnos"
 PODthorns.0056.desc:0 "Dans une occasion mémorable, les Ravnos font leur manoeuvre la plus importante en Europe à partir de maintenant : ils ont décidé de rejoindre la Camarilla naissante. Un optimisme prudent est ressenti par la secte lors de l’annonce de cette alliance."
 PODthorns.0057.t:0 "Les épines : Ravnos Opposé"
 PODthorns.0057.desc:0 "A la surprise générale, le clan Ravnos a pris le parti du mouvement anarch. Est-ce la conséquence du mauvais traitement qu’ils ont reçu des princes occidentaux à leur arrivée en Europe ? Peu de gens peuvent répondre, mais les Anarques accueillent leurs nouveaux frères à bras ouverts."
 PODthorns.0058.t:0 "Les épines : Ravnos Neutre"
 PODthorns.0058.desc:0 "Comme la plupart des gens s’y attendaient, les Ravnos ont confirmé leur neutralité dans la guerre entre les anciens et les nouveau-nés. Le clan indien joue sur le long terme, et est encore dans le processus ardu de se faire accepter dans ces terres lointaines."
 PODthorns.0059.t:0 "Les épines : Les Caitiff"
 PODthorns.0059.desc:0 "Les Caitiff étaient une simple rumeur il y a deux siècles, et chassés à mort s’ils se présentaient dans une ville. Mais les temps ont changé, et on ne peut plus les ignorer. Ils se sont invités à la Convention et sont attendus à aider le Mouvement Anarch, qui partage beaucoup de leurs griefs."
 PODthorns.0060.t:0 "Les épines : Camarilla Caitiff"
 PODthorns.0060.desc:0 "Un rebondissement majeur à la Convention, Les Caitiff ont rejoint la Camarilla. Après de nombreux débats, et des changements à la constitution officielle proposée de la secte, les deux factions sont venus à un accord. Une nouvelle aube brille pour les opprimés de la course Cainite."
 PODthorns.0061.t:0 "Les épines : Caitiff Opposé"
 PODthorns.0061.desc:0 "Le mouvement des Anarch se trouve renforcé par l’allégeance des Caitiff. Ce n’est pas vraiment une surprise, car ils partagent la plupart du temps les mêmes griefs et ennemis, mais c'est toujours un avantage puissant pour la cause des nouveau-nés."
 PODthorns.0062.t:0 "Les épines : Caitiff Neutre"
 PODthorns.0062.desc:0 "Les Caitiff ont choisi une ligne de conduite prudente à la Convention. Malgré leurs réticences vis-à-vis de la Camarilla, ils tentent de ne pas la contrarier davantage en annonçant leur neutralité."
 PODthorns.0063.t:0 "Les épines : la Fin"
 PODthorns.0063.desc:0 "Alors que les derniers représentants quittent la zone du congrès, tout le monde planifie déjà leur prochaine manoeuvre. La Camarilla n’a pas encore atteint sa suprématie totale sur la Famille entière. L'opposition parle de réformer le Mouvement Anarch en une toute nouvelle organisation pour contrer la Camarilla. Enfin, les clans neutres préparent des pactes et des alliances pour assurer leur survie. Un nouvel âge de l’histoire de Caïnite commence, avec un avenir incertain à venir."
 PODthorns.0063.a:0 "Quel sera le prochain mouvement du Grand Jeu ?"
                                         
     

   
 