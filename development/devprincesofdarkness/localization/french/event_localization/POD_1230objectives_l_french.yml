l_french:

 pod1230objectives.1.t:0 "Coucher du soleil"
 pod1230objectives.1.desc:0 "La plupart d'entre vous ont longtemps entendu la fausse histoire du «Dieu» persan, Mithra, de ses exploits et ambitions sans fin pour les îles. Ce soir, vous entendrez toute la triste vérité. Mithra voulait que nous pensions qu'il était venu dans les îles britanniques en tant que sauveur, mais la vérité est qu'il fuyait ses échecs dans la Rome antique, voyant notre patrie comme un marigot à peine assez apte à reconstruire sa base de pouvoir. Maintenant, il a échoué une fois de plus, car Britannia est sous une nouvelle direction unie. Son culte se disperse, chassé par le feu et l'épée et destiné à devenir une simple note de bas de page de l'histoire des îles. Alors que je vous annonce la chute du «Soleil invaincu», je proclame également que Britannia est enfin prête à devenir sa propre force motrice dans la société caïnite."
 pod1230objectives.1.a:0 "Très bon discours, s'il vient de moi"
 pod1230objectives.2.a:0 "Mithra a subi sa dernière défaite ... probablement"
 pod1230objectives.2.b:0 "Le Soleil invaincu se lèvera à nouveau, il le fait toujours."
 pod1230objectives.3.t:0 "Le sceptre et le soleil"
 pod1230objectives.3.desc:0 "La ligne entre un ancien vampire et un Dieu est mince. Mais dans le cas de Mithra, c'est encore plus flou. Le charisme et le pouvoir absolus de l'entité connue sous le nom de Dieu pour les anciens Perses et Romains sont toujours stupéfiants et, même si les mortels ont évolué, un changement de paradigme s'est récemment produit. En l'absence de rivaux crédibles au sein de la direction de Ventrue, le culte de Mithra a réussi à acquérir une influence suffisante pour, d'une certaine manière, devenir le clan Ventrue lui-même. Ne se cantonnant plus à Britannia, les fidèles de Unconquered Sun sont plus puissants que jamais et leur foi indéniable ébranle les principes de Vampire au cœur. L'histoire d'origine biblique commence à disparaître des souvenirs de jeunes vampires, remplacés par des histoires inspirantes de champions éternels fidèles au guerrier-Dieu-soleil. La société apparentée ne sera plus jamais la même."
 pod1230objectives.3.a:0 "Louer le soleil!"
 pod1230objectives.3.b:0 "Parfois, je m'étonne"
 pod1230objectives.3.custom:0 "Tous les dirigeants de Ventrue auront une chance de se convertir au culte de Mithra."
 pod1230objectives.4.a:0 "Mithras a remporté ce tour. Acceptons-le simplement."
 pod1230objectives.4.b:0 "Louant le soleil? Comme un mortel? Ha!"
 pod1230objectives.5.a:0 "Vont-ils ajouter un soleil à leurs armoiries?"
 pod1230objectives.6.t:0 "Vous rêvez encore?"
 pod1230objectives.6.desc:0 "Ils viennent avec des cadeaux. Caïnites puissants de toute l'Europe, désireux de voir le nouveau souverain de Constantinople. En entrant dans votre salle du trône richement décorée, vous vous demandez combien auront des propositions, des menaces ou des poignards qui vous attendent avant la fin de la nuit. Vous vous demandez aussi paresseusement, était-ce le plan de Michael depuis le début? Savait-il que son rêve exigeait un changement de leadership, une nouvelle vision? Vous ne saurez probablement jamais. Ce que vous savez, c'est que vos illustres invités veulent tous apprendre quelque chose ce soir et que leurs cadeaux font partie de ce programme. Michael, autoproclamé Archange, aurait refusé de telles offres mondaines ou même être offensé par elles. Si vous refusez également, vous serez vraiment considéré comme l’héritier de Michael. Mais peut-être que le rêve doit emprunter une nouvelle voie sous votre direction, et vous pouvez faire le premier pas dès maintenant. Vas-tu…?"
 pod1230objectives.6.a:0 "Refuser les cadeaux?"
 pod1230objectives.6.custom:0 "Vous emprunterez le long chemin, ravivant la foi morte du Codex des légendes. La plupart de vos vassaux s'y convertiront." 
 pod1230objectives.6.b:0 "Accepter les cadeaux?"
 pod1230objectives.7.a:0 "1204 n'était qu'un revers, semble-t-il."
 pod1230objectives.8.t:0 "Reconquista complète"
 pod1230objectives.8.desc:0 "La guerre civile sanglante des Lasombra espagnols est terminée. Vous êtes maintenant le seul vainqueur, un seigneur des ruines. Ce fut une bataille acharnée, mais simplement un tremplin sur votre chemin vers une plus grande puissance. Une victoire décisive vous a procuré beaucoup de magnanimité et vous a ouvert de nombreuses portes. En fait, la position convoitée de maître de la mer des ombres, et donc de tout le clan Lasombra, vous a été offerte. C'est évidemment un piège, et ils s'attendent tous à ce que vous échouiez lamentablement. Pour que votre règne se termine aussi vite qu'il a commencé afin qu'ils puissent retourner à leurs petites querelles sans que vous vous mettiez sur leur chemin. Mais cela n'arrivera pas. Vous avez l'intention de leur faire regretter leurs intrigues futiles. Vous avez apprivoisé Iberia après tout, plier la Méditerranée et quelques anciens décrépits à votre volonté ne peut pas être plus difficile ... Non?"
 pod1230objectives.8.a:0 "Grimper l'échelle, un échelon à la fois"
 pod1230objectives.8.custom:0 "Vous emprunterez le long chemin, ravivant la foi morte du Codex des légendes. La plupart de vos vassaux s'y convertiront." 
 pod1230objectives.9.a:0 "Le leadership de Lasombra n'est pas l'endroit le plus sûr où être"
 pod1230objectives.9.b:0 "La mer emportera de petites ambitions"
 pod1230objectives.10.t:0 "Vaincre Ragnarok"
 pod1230objectives.10.desc:0 "Depuis des siècles maintenant, les enfants de Caharl meurent lentement. L'assaut constant des serviteurs de la Croix, à la fois mortels et morts-vivants, avait converti leur troupeau autrefois pieux en un petit peuple faible. Mais pas plus. Alors que l'invasion du Ventrue allemand s'effondre et que le fier Einherjar instille à nouveau la terreur dans le cœur des enfants de Caïn, la foi renaît à nouveau. Sous un nouveau chef, avec de nouvelles doctrines et un nouveau leadership, les Einherjar sont maintenant quelque chose de plus grand que même Odin aurait pu l'imaginer, le Wanderer les choisit bien, et ils sont maintenant sa famille, les Aesir de demain. Ils entrent hardiment dans cet âge en tant que dieux vikings qu'ils sont vraiment. Alors qu'ils se blottissent, terrifiés dans leurs châteaux maussades, les faibles vampires du Sud n'ont rien à espérer d'autre qu'une mort miséricordieuse lorsque leur propre Ragnarok arrive. Et ça viendra."
 pod1230objectives.10.a:0 "Tant de gloire vous attend!"
 pod1230objectives.11.a:0 "N'ont-ils pas compris que leur âge est révolu?" 
 pod1230objectives.11.b:0 "L'Âge des Dieux est à nos portes!"  
 pod1230objectives.12.t:0 "Iberia après minuit"
 pod1230objectives.12.desc:0 "La guerre civile de Lasombra en Ibérie était une affaire sanglante, née de la mortelle de la Reconquista espagnole et des troubles croissants entre Christian et Ashirra Caïnites. C'était une période sordide pour les fidèles au début, avec des trahisons, des villes déchues et des secrets plus sombres conspirant pour faire tomber le croissant de minuit. En tant que telle, votre victoire était des plus inattendues. Alors que les mortels taifas ibériques tombent les uns après les autres, les fidèles d'Ashirra ont quand même réussi à vaincre leurs voisins chrétiens du nord. C'est en effet une étrange tournure des événements. Alors que la mer des ombres s'effondre à cause de leur alliance malavisée avec les chrétiens, vous régnez maintenant sur une nouvelle terre et un nouveau peuple à peine reconnaissables. D'une certaine manière, votre victoire a sauvé la dernière relique de l'âge d'or musulman en Ibérie. Vous êtes autant les vainqueurs que les gardiens d'une riche histoire. Une perspective décourageante, mais à laquelle vous êtes fier d'assister."
 pod1230objectives.12.a:0 "Nous sommes le passé et l'avenir de cette terre" 
 pod1230objectives.12.custom:0 "Alors que les derniers non-Ashirra Caïnites fuient votre royaume, certaines provinces seront converties à votre foi." 
 every_non_root_faith_county_world_europe_west_iberia:0 "Tous les comtés ne sont pas de votre foi en Iberia." 
 pod1230objectives.13.a:0 "Les mages sont secoués" 
 pod1230objectives.13.b:0 "Ils condamnent notre clan!" 
 pod1230objectives.13.c:0 "Nous sommes les gardiens de sa parole" 
 pod1230objectives.14.t:0 "La petite farce"
 pod1230objectives.14.desc:0 "Enfin tu es la! À Jérusalem!… Ou était-ce la Bohême? Quoi qu'il en soit, votre voyage est terminé. Pendant si longtemps, vous avez eu ce sentiment que vous étiez destiné à être ici avec vos frères et sœurs du clan Malkavian à vos côtés. Ce n’était pas facile, il fallait demander gentiment, et parfois pas si gentiment, aux princes en cours de route. Vous avez même dû chasser certains d'entre eux de leur confortable trône. Vous entendez des tribunaux chuchoter que vous êtes sur le point de créer un clan malkavien unifié. C’est drôle parce que vous n’avez jamais voulu le faire, mais vous l’avez fait quand même. Ce qui est important, c'est que vous êtes ici maintenant, et les voix se font plus fortes, vous disant de faire ... des trucs! Le temps de l'illumination est arrivé! Ou était-ce le salut? Vous n'êtes pas vraiment sûr.Comment ça se passe?"
 pod1230objectives.14.a:0 "Les choses vont quelque peu mal!" 
 pod1230objectives.14.customa:0 "Vous obtiendrez les traits Genius et Rusé, le cas échéant, au détriment du reste du clan Malkav qui obtiendra des niveaux de stress élevés." 
 pod1230objectives.14.b:0 "Les choses vont mal!" 
 pod1230objectives.14.customb:0 "Tout le clan Malkav obtient le trait Genius mais devient encore plus instable mentalement." 
 pod1230objectives.14.c:0 "Les choses vont très mal!" 
 pod1230objectives.14.customc:0 "Le clan Malkav gagne le trait astucieux, mais les dirigeants d'autres clans obtiennent un gain de stress énorme." 
 pod1230objectives.14.d:0 "La merde frappe le truc du toit épineux!" 
 pod1230objectives.14.customd:0 "Le clan Malkav obtient le trait Génie, mais les dirigeants des autres clans deviennent dingues. Ce sont les fous maintenant." 
 pod1230objectives.15.a:0 "Je ne me sens pas si bien ..." 
 pod1230objectives.15.b:0 "Je vois de nouvelles portes s'ouvrir! Oh attendez, non. Fermeture. Fermeture définitive ..." 
 pod1230objectives.16.t:0 "La République éternelle"
 pod1230objectives.16.desc:0 "«Chers amis, soyons honnêtes ... Combien d'entre vous s'attendaient à ce que nous allions aussi loin si tôt? Après la chute de notre fier Sénat aux mains de dirigeants corrompus et de parasites, nos idéaux républicains semblaient perdus pour les envahisseurs tyranniques allemands, à la fois mortels et mortels. Mais la lumière de Rome ne pourra jamais vraiment s'éteindre et nous guidera toujours vers l'avant alors que le soleil nous évite à jamais. Soyez fier de notre héritage, mais conscient de nos ennemis. Nous ne devons plus jamais céder à la complaisance ou à la décadence car nous avons vu quels temps sombres attendent notre espèce sans notre main directrice. Chers sénateurs de Rome, j'ai le plaisir de déclarer ouverte la première session du Sénat éternel renouvelé!"
 pod1230objectives.16.a:0 "Ça fait du bien de dépoussiérer enfin la toge." 
 pod1230objectives.17.a:0 "La mort est un cercle plat" 
 pod1230objectives.17.b:0 "Eh bien, nous sommes toujours au top de toute façon." 
 pod1230objectives.18.t:0 "Un lourd fardeau"
 pod1230objectives.18.desc:0 "L'épée est lourde dans votre main. Vous l'avez trouvé en explorant les ruines de l'utopie pour laquelle vous vous êtes tant battu, Carthage. Mais vous n'êtes pas un jeune, vous savez trop bien que chaque mythe est un amalgame complexe de mensonges et de vérités. Un clan entier vous regarde avec émerveillement, allez-vous réclamer le manteau de Troile et apporter un nouvel âge d'or pour les vampires? Ce choix fera de vous de nombreux nouveaux ennemis, et vous savez que même Troile n'avait pas réussi à protéger Carthage contre l'influence infernale. Ou réclamerez-vous Carthage comme un outil politique, refusant son héritage mixte? Ce mouvement vous fera gagner le respect de nombreux autres clans, mais vous ne serez alors pas meilleur que le Ventrue. L'épée de Troile à laquelle vous vous accrochez est un symbole puissant de ce choix difficile. Vas-tu… ?"
 pod1230objectives.18.a:0 "Gardez l'épée?" 
 pod1230objectives.18.b:0 "Lâchez l'épée?" 
 pod1230objectives.19.a:0 "Un ancien joueur revient au jeu." 
 pod1230objectives.19.b:0 "Il est temps de le brûler à nouveau." 
 pod1230objectives.20.t:0 "Votre grand-mère attentionnée"
 pod1230objectives.20.desc:0 "Baba Yaga est connu sous de nombreux noms: La Crone, la Hag, la Grand-mère ... Mais vous connaissez la vérité. C'est elle qui s'est échappée, la seule survivante de la chasse folle d'Absimilliard contre son propre enfant. L'ancêtre du clan Nosferatu est toujours à la chasse jusqu'à cette nuit, et aurait déjà tué son propre clan si ce n'était pour son défi continu. Elle dort maintenant, mais vous ressentez son plaisir alors que votre fidélité et vos efforts continus ont réussi à faire basculer le clan Nosferatu à ses côtés dans la lutte en cours. La guerre finale pour le sort de la Cachée commence et, en tant que championne de la grand-mère, vous n'avez pas l'intention de la laisser tomber."
 pod1230objectives.20.a:0 "Nous allons vous rendre fier, grand-mère"
 pod1230objectives.20.custom:0 "Tous les Nosferatu obéissent désormais au commandement de Baba Yaga, et donc au vôtre." 
 pod1230objectives.21.a:0 "Quelque chose mauvaise cette manière vient..." 
 pod1230objectives.21.b:0 "Bénissez-nous, grand-mère!" 
 pod1230objectives.22.t:0 "Horreurs dans le noir"
 pod1230objectives.22.desc:0 "Même les vampires ont peur des ombres. Mais votre clan est bien plus qu'effrayé, il sait que quelque chose se cache là-bas, attendant le moment de frapper. Ils se nomment eux-mêmes «Nictuku», descendance du fondateur, Absimilliard, qui a juré de détruire ses enfants rebelles. Depuis la nuit des temps, vos frères et sœurs ont choisi de fuir, de se cacher dans l'ombre et de prier pour leurs non-vies. Vous en avez assez. Si le Fondateur veut une guerre, il l'aura à vos conditions. Votre clan se méfiait de votre initiative au début, l'appelant imprudent, mais maintenant ils voient la vérité. Vous ne triompherez que unis, avec des terres et des peuples sous votre direction et des alliés dans la nuit. Ils se tournent maintenant vers vous, se préparant à l'assaut et confiants dans vos compétences en leadership. Les Nictuku doivent siffler dans leurs trous, maudissant votre nom et planifiant votre disparition. Laissez-les venir."
 pod1230objectives.22.a:0 "Nous sommes plus forts que vous ne le pensez, 'Père'"
 pod1230objectives.23.a:0 "Les rats se blottissent ensemble?" 
 pod1230objectives.23.b:0 "Il est temps d'affronter les horreurs."   
 pod1230objectives.24.t:0 "Un dieu rêve"
 pod1230objectives.24.desc:0 "Vous vous tenez dans la crypte d'Ur-Shulgi, où dort l'enfant favori de Haqim. Vous apportez de bonnes nouvelles, car le clan Assamite a finalement assumé son devoir de juge du sang. Il a fallu un peu de ... convaincre de votre part pour nettoyer le clan des anciens faibles d'esprit et des fanatiques de religions indignes. Le jugement final a commencé et, comme les enfants de Kayyin ont tous été jugés insuffisants, la réclamation a commencé. Sous votre direction, les enfants de Haqim laveront bientôt le monde dans le sang, jusqu'à ce que seuls les purs restent debout. Vous voyez un frisson passer le long du corps d'Ur-Shulgi, avant d'être aveuglé par un soudain éclair de sang noir. Et, d'une manière ou d'une autre, vous comprenez que votre maître vient de vous donner une longueur d'avance pour la purge à venir ... "
 pod1230objectives.24.a:0 "Le déluge rouge a commencé."
 pod1230objectives.24.custom:0 "La plupart des personnages assamites du clan se convertiront sur la voie de la justice." 
 pod1230objectives.24.customa:0 "L'attaque mentale d'Ur-Shulgi tuera la plupart des utilisateurs de sorcellerie de sang non assamites." 
 pod1230objectives.25.a:0 "Le Rideau des Couteaux avait raison depuis le début." 
 pod1230objectives.25.b:0 "Je ne suivrai jamais ces hérétiques."   
 pod1230objectives.26.a:0 "Les assassins orientaux sont en fait fous. Qui le savait?" 
 pod1230objectives.27.t:0 "Une maison unie"
 pod1230objectives.27.desc:0 "Le trône noir de Haqim se dresse fièrement au centre d'Alamut, votre forteresse. En vous asseyant dessus, vous regardez l'auguste assemblée en attendant vos paroles. Les trois représentants des castes, Calife, Amr et Vizir, sont ici. Le Conseil des Parchemins est également présent, près des émissaires de partout dans le vaste réseau d'espions haqimite. Tant de progrès en si peu de temps! Tous ces enfants éminents de Haqim se seraient égorgés la gorge avant même d'entrer dans la même pièce il n'y a pas si longtemps. Mais c'était avant votre ascension à l'Ancien du clan. Par la force des armes, des intrigues et de la diplomatie, vous avez arrêté les conflits internes, assuré la position du clan et réinstitué la discipline comme valeur première des Assamites. Désormais, ils attendent tous votre vision du futur. Vous savez qu'ils obéiront, car les enfants de Haqim ne sont rien sinon consciencieux."
 pod1230objectives.27.a:0 "L'héritage de Jamal, le Chemin du Zélote."
 pod1230objectives.27.custom:0 "Les personnages haqimites recevront un modificateur de prouesse." 
 pod1230objectives.27.b:0 "L'héritage de Nakurtum, la voie du diplomate."
 pod1230objectives.27.customb:0 "Les personnages haqimites recevront un modificateur de diplomatie." 
 pod1230objectives.27.c:0 "L'héritage d'Al-Ashrad, la voie du sorcier."
 pod1230objectives.27.customc:0 "Les personnages haqimites recevront un modificateur d'apprentissage." 
 pod1230objectives.28.a:0 "L'Aîné est vraiment sage." 
 pod1230objectives.28.b:0 "Attendez, ils n'étaient pas unis avant?" 
 pod1230objectives.29.t:0 "Le péché politique"
 pod1230objectives.29.desc:0 "La plupart des étrangers considèrent à tort la Via Peccati comme une route de pure satisfaction personnelle. À vrai dire, c'est une partie importante de la doctrine, mais la situation dans son ensemble est différente. Via Peccati est une question de contrôle politique et de sensibilisation. Lorsque les Caïnites sont indulgents, leurs bêtes rassasiées, ce sont des créatures indolentes et faciles à contrôler. Le vrai pécheur connaît tous les désirs et tous les secrets de sa cour, et utilise chacun à son avantage. En tant que tel, Rome étant contrôlée par une Via Peccati Ventrue pendant si longtemps ne doit pas être une bizarrerie ou une exception, cela pourrait être la règle. Si je veux laisser un héritage à mes collègues pécheurs, c'est comme tel: contrôler le monde avec tous les excès auxquels vous pouvez penser, et amusez-vous à le faire. Camilla, premier consul éternel"
 pod1230objectives.29.a:0 "Via Peccati est le véritable chemin vers le pouvoir."
 pod1230objectives.29.b:0 "Je l'ai toujours."
 pod1230objectives.29.custom:0 "Votre foi se répandra, convertissant certains des Caïnites les plus ... amicaux." 
 pod1230objectives.30.a:0 "Je ne comprends pas comment ils ne se sont pas encore cannibalisés." 
 pod1230objectives.30.b:0 "Satisfaire la Bête ET le pouvoir temporel? La route parfaite." 
 pod1230objectives.31.t:0 "roi des rois"
 pod1230objectives.31.desc:0 "Il y a des vérités claires dans la société caïnite. Gangrel errent dans le désert comme des sauvages, Toréador adore les petites boules, les Malkaviens sont perdus entre les prophéties et la folie ... et, avec seulement le Lasombra le plus arrogant pour le nier, Ventrue est destiné à régner sur les Vampires. C'est un simple fait de non-vie, vrai depuis les nuits de la deuxième ville, de la Perse et de Rome. Peu importe la foi ou la structure politique, chaque construction caïnite est condamnée sans un Ventrue à la barre. Cette vérité a souvent suscité une question parmi vos frères, qui dirige les dirigeants? Très peu ont osé revendiquer le manteau de Ventrue lui-même en tant que seigneur du premier clan caïnite. Maintenant, vous êtes l'un de ces rares. La guerre des princes est peut-être encore en cours, mais personne ne niera que les Ventrue ne sont plus de simples rois des morts-vivants. Ce sont des empereurs."
 pod1230objectives.31.a:0 "Premier Clan Ventrue, maintenant le monde."
 pod1230objectives.32.a:0 "Des bâtards arrogants." 
 pod1230objectives.32.b:0 "L'ordre naturel des choses est respecté." 
 pod1230objectives.33.t:0 "La foi dans les ombres"
 pod1230objectives.33.desc:0 "«Notre clan est un clan de dirigeants. Oui, les Ventrue revendiquent également ce titre, mais ils ne comprennent pas la véritable domination. La vraie domination n’est pas une question de pouvoir, ni même d’influence. Il s'agit d'une action décisive. Prenons l'exemple de la crise d'Ashirra, au moment où cela est venu à mon attention, beaucoup ont offert des conseils, prônant la prudence et la patience. Ils ont affirmé que nos frères perdus pourraient être pardonnés et que le clan s'est de nouveau uni à temps. J'étais en désaccord. Et, comme le savant lecteur le sait, les Ashirra ne sont plus qu'une simple note de bas de page dans l'histoire des Caïnites, en raison de l'utilisation décisive de tous les actifs du clan dont je dispose en ce moment. La miséricorde et la compassion auraient apporté la désunion au clan et le mouvement Ashirra pourrait même exister à ce jour! Prenez ce conseil à cœur, cher frère ou sœur, fixez-vous un objectif et ne cédez pas tant que vous ne l'avez pas accompli. Alors, et alors seulement, vous maîtriserez l’art de la direction de Lasombra. »Clan Lasombra Chronicles p45"
 pod1230objectives.33.a:0 "'Et maintenant parlons de l'art de la manipulation des ombres ...'"
 pod1230objectives.33.custom:0 "Les dirigeants indépendants d'Ashirra verront leur autorité s'effondrer." 
 pod1230objectives.34.a:0 "La politique de Lasombra est une affaire sanglante." 
 pod1230objectives.34.b:0 "Une page de l'histoire de notre clan s'est tournée." 
 pod1230objectives.35.t:0 "Croissant sur les ombres"
 pod1230objectives.35.desc:0 "Des murs de la Médina au Castel d’Ombro, le Faqih arpente son empire et se demande: «Mon peuple est-il en sécurité?». Alors que la dernière bataille se termine par une victoire, le Faqih pense: «Comment éviter plus d'effusion de sang?». Quand tous les Ashirra se tournent vers lui pour obtenir des conseils, une protection et des conseils, le Faqih n'est pas fier, il est humilié. En revêtant sa nouvelle tenue, digne d'un calife éternel, le Faqih pense à l'avenir, aux meilleurs moyens de s'assurer que les fidèles Caïnites seront en sécurité, pour toujours. Et quand le dernier kuffar Lasombra est remis sur pied, le Faqih demande: «Choisirez-vous le Croissant… ou le Soleil?»"
 pod1230objectives.35.a:0 "Une fin et un début"
 pod1230objectives.35.custom:0 "Les personnages survivants de Lasombra recevront une dernière chance de se convertir." 
 pod1230objectives.36.a:0 "... Le croissant." 
 pod1230objectives.36.b:0 "Jamais! Cette guerre n'est pas finie, Ashirra!" 
 pod1230objectives.37.a:0 "Est-ce la fin du clan Lasombra?" 
 pod1230objectives.38.t:0 "La vérité jusqu'à Caine"
 pod1230objectives.38.desc:0 "«Ils ont dit que la mort de Narses, notre premier archevêque, devait être notre fin. Nous avons enduré. Ils ont dit que le meurtre du pieux évêque St-Lys par le païen Anatole était juste. Nous n’avons pas oublié. Ils ont dit que notre religion était une abomination, une parodie des traditions de Caïn. Nous avons tenu bon dans notre croyance au Troisième Caïn et à la cruauté du Démiurge. Ils ont dit que nous serions bientôt un mauvais souvenir, un vestige d'un âge oublié. Nous sommes plus forts que jamais. Ils ont dit que l'Église mortelle et son inquisition nous achèveront. Nous nous tenons fièrement dans la ville sainte, et les agents de l'Église détestée de Pilate se recroquevillent devant nous. Maintenant? Ils ne disent rien et prient avec nous."
 pod1230objectives.38.a:0 "Bientôt, le Troisième Caïn nous bénira"
 pod1230objectives.38.custom:0 "La résurgence de l'Église convertira certains opportunistes à notre cause." 
 pod1230objectives.39.a:0 "Il est temps de rejoindre l'équipe gagnante." 
 pod1230objectives.39.b:0 "Ils échoueront toujours à la fin." 
 pod1230objectives.40.a:0 "Un retour improbable." 
 pod1230objectives.41.t:0 "L'œil du cyclone"
 pod1230objectives.41.desc:0 "Nous sommes les fils et les filles de Gengis et Dobrul. Comme eux, nous sommes des conquérants, comme l'a prouvé notre rapide subjugation des steppes occidentales. Mais maintenant, nous devons aussi être diplomates et hommes d'État. Les Wan Kuei préparent leur vengeance, et notre solide bastion à l'ouest sera un point crucial pour protéger l'héritage de Dobrul. En tant que tel, il faut encore conquérir, oui, mais il faut aussi se faire des alliés, comme nos cousins occidentaux du clan Gangrel. Soyez miséricordieux lorsque vous gagnez, gracieux lorsque vous perdez et impitoyable lorsque vous êtes croisé. Soyez fier de votre ascendance, de votre famille et de votre clan, mais soyez assez sage pour savoir quand même leur aide ne suffit pas. Ne laissez pas la fierté vous aveugler sur les avantages des alliances temporaires avec les occidentaux. Avec l'ancienne et la nouvelle manière combinées, nous écraserons la contre-attaque Wan Kuei et ensuite ... alors le monde sera à nous."
 pod1230objectives.41.a:0 "Viens, démons de Xia, nous sommes prêts"
 pod1230objectives.41.custom:0 "Le Gangrel occidental, impressionné par votre rapide conquête, sera pour un temps réceptif à votre diplomatie." 
 pod1230objectives.41.customb:0 "Vous avez retardé l'invasion de Wan Kuei pendant un certain temps."  
 pod1230objectives.42.a:0 "Y a-t-il encore plus de menaces venant de l'Est?" 
 pod1230objectives.42.b:0 "Nos cousins sont très impressionnants." 
 pod1230objectives.43.t:0 "Loups à la porte"
 pod1230objectives.43.desc:0 "La chute de la civilisation caïnite médiévale remonte à peu de temps après la première chute de Constantinople. L’incendie du rêve de Michael, par trahison, était un signe avant-coureur ironique des années à venir. Les soi-disant hauts clans pensaient que leur position était assurée et leurs empires sûrs et, dans leur arrogance, complotaient les uns contre les autres et ne voyaient pas la vraie menace. Quand la horde de Gangrel a balayé l'Europe et a abaissé le puissant, ce n'était guère une surprise pour le savant observateur. Matasuntha avec les Huns et les Einherjar avec les Vikings; tous deux étaient les précurseurs du puissant seigneur de guerre qui unissait le clan disparate de Gangrel en une force imparable. Alors que les châteaux tombaient et que les princes mouraient, une nouvelle ère de l'histoire caïnite commença. The Age of the Gangrel. n\n Rise and Fall, on Cainite Civilization par Cuthbert Beckett."
 pod1230objectives.43.a:0 "Pas si haut et puissant maintenant"
 pod1230objectives.43.custom:0 "Les dirigeants civilisés recevront une pénalité massive de contrôle et de guerre lorsque leur autorité s'effondrera sous l'assaut des loups." 
 pod1230objectives.44.a:0 "Nous avons été trop longtemps inconscients de la nature" 
 pod1230objectives.44.b:0 "Il est temps de démolir quelques châteaux!" 
 pod1230objectives.45.t:0 "La volonté de Tremere"
 pod1230objectives.45.desc:0 "En vous agenouillant devant lui, vous pouvez ressentir l'envie de tout le clan. Tremere ne se réveille pas pour n'importe qui. Mais vous n'êtes pas n'importe qui. Avant votre ascension, le clan était menacé, sa place dans la nuit au mieux ténue. Maintenant? Les démons sont une triste blague, seuls dans leurs châteaux en ruine. Ces infernalistes sournois, les voleurs d'âmes, sont détruits. Tous les Européens vous remercient pour votre écrasement de leurs derniers résistants. Le clan Tremere est en bonne voie vers son destin légitime, devenant maîtres de la nuit. Alors que vous vous tenez devant lui, Tremere dit simplement: «Vous avez bien fait. Pour la première fois, Tremere aura une voix pour sa volonté, quelqu'un en qui il a suffisamment confiance pour être le seigneur du cercle intérieur. Vous !"
 pod1230objectives.45.a:0 "Je suis au sommet de la pyramide"
 pod1230objectives.45.custom:0 "Vous allez déclencher une malédiction paralysant Tzimisce, Salubri et les traitres thaumaturgistes." 
 pod1230objectives.46.a:0 "Ils sont toujours le clan des Usurpateurs" 
 pod1230objectives.46.b:0 "L'immortalité et le pouvoir sont enfin nôtres" 
 pod1230objectives.47.t:0 "Changement éternel"
 pod1230objectives.47.desc:0 "En entrant dans la pièce, vous savez que la plupart d’entre eux ne la quitteront pas. Ils ont répondu à votre convocation parce qu'ils n'avaient pas le choix. Car vous êtes le Marteau du Tremere, le Destructeur du Ventrue et aucun Tzimisce ne peut plus vous ignorer. Cela ne signifie pas pour autant qu’ils vous respectent. Vous reculez sur votre trône, alors que vos gardes entrent et commencent à massacrer les inutiles. Ils plaident pour leur vie, maudissent votre nom ou essaient de vous joindre mais vous êtes concentré sur une question beaucoup plus importante, quel groupe épargner? Vous devez saisir, une fois pour toutes, le clan Tzimisce pour vous-même, mais vous ne pouvez pas le faire seul. Alors que vous écrasez la tête d'un audacieux qui a sauté pour votre gorge, vous savez que vous devez prendre votre décision maintenant, ou vous régnerez sur un tas de cendres."
 pod1230objectives.47.a:0 "Gardes, épargnez les descendants des dynasties au pouvoir."
 pod1230objectives.47.custom:0 "Vous renforcez le clan Tzimisce dans son ensemble, garantissant son héritage en tant que dirigeants intimidants." 
 pod1230objectives.47.b:0 "Estimés prêtres Koldun, j'espère que vous n'êtes pas trop gênés"
 pod1230objectives.47.customb:0 "Les Tzimisce seront convertis en Via Mutationis." 
 pod1230objectives.47.c:0 "Toi là! Celui à la capuche! Avancez…"
 pod1230objectives.47.customc:0 "D'autres personnages Tzimisce seront drainés pour alimenter votre ascension vers le pouvoir." 
 pod1230objectives.48.a:0 "Un clan uni Tzimisce est une perspective effrayante ..." 
 pod1230objectives.48.b:0 "La volonté de l'aîné en jeu, sans aucun doute" 
 pod1230objectives.49.t:0 "Connaissance interdite"
 pod1230objectives.49.desc:0 "Toute la connaissance du monde… à portée de main. Est-ce ainsi que se sont sentis Adam et Eve avant Apple? Il a fallu beaucoup de temps et un investissement massif pour récupérer les fragments brisés du Codex, perdus après que Constancia l'ait rompu lors de son combat avec Lazarus. Mais c'est maintenant fait, et le Codex brille devant vous, vous taquinant de vous rapprocher, de ne lire qu'une petite phrase. Vous connaissez les rumeurs, ce texte sans prétention a été écrit par Cappadocius lui-même, alors nommé Sargon, et contient tous les rituels, connaissances et prophéties d'Enoch. Apparemment, un moyen de devenir l'égal de Dieu est également quelque part ici, presque terminé par Sargon avant son étreinte. Mais vous savez au plus profond de votre âme que ce Codex n'est pas destiné aux mortels, ni même aux vampires, et votre santé mentale pourrait être brisée au-delà de toute réparation. Au fur et à mesure que votre main s'en rapproche, vous faites un dernier choix…"
 pod1230objectives.49.a:0 "Je soumettrai le Codex à ma volonté!"
 pod1230objectives.49.b:0 "… Brisons cette chose à nouveau et oublions-la."
 pod1230objectives.49.custom:0 "Vos frères cappadociens vous seront reconnaissants de votre prudence." 
 pod1230objectives.50.a:0 "Il vaut mieux laisser certains secrets enfouis ..." 
 pod1230objectives.50.b:0 "Touchez ça! Ça va être amusant!" 
 pod1230objectives.51.t:0 "La Conspiration"
 pod1230objectives.51.desc:0 "Alors que vous enfoncez vos crocs dans son cou, le temps semble ralentir autour de vous. Des images commencent à apparaître au bord de la conscience, alors que vous dérivez vers l'extase bienheureuse. Vous vous voyez, chef oint de l'illustre famille Giovanni dans votre fief italien. Vous voyez votre petit conseil de membres de famille de confiance, vous aidant à planifier votre grande conspiration. Vous voyez la nuit de l'Europe redéfinie par votre empire marchand grandissant, tous les clans acceptant à contrecœur votre nouvelle présence, vos sages conseils et votre nouvelle importance, loin de l'inutilité de vos frères cappadociens. Vous voyez la Conspiration se mettre en mouvement, utilisant tous vos atouts pour en faire le succès retentissant qu'elle mérite d'être. Lorsque vous revenez à vos sens, et que le fou est réduit en cendres, vous voyez votre famille… non, votre clan… autour de vous. La nuit ne fait que commencer. Et ce sera celui de Giovanni."
 pod1230objectives.51.a:0 "Frères et sœurs, il est temps que la Purge commence"
 pod1230objectives.51.custom:0 "Le clan Giovanni se séparera du clan Cappadocian et mettra la conspiration en mouvement. Giovanni sera très efficace pour intriguer pendant un certain temps, et le Cappadoce très sensible à cela." 
 pod1230objectives.52.a:0 "Cette apparition soudaine de Clans Usurpateurs commence à devenir inquiétante ..." 
 pod1230objectives.52.b:0 "La purge commence, mieux vaut être préparé." 
 pod1230objectives.53.t:0 "Nouveaux commencements"
 pod1230objectives.53.desc:0 "Dans une tournure surprenante des événements, la règle corrompue des Anciens qui existait depuis la nuit des temps a été remise en question. Vous ne savez pas exactement quel a été le catalyseur ou si cet état de fait durera aussi longtemps que vos ennemis comploteront pour écraser votre rébellion parvenue. Mais, à la suite de votre combat contre les princes de la nuit, beaucoup se sont rassemblés pour rejoindre votre cause. Certains suivent votre exemple, tandis que d'autres ont commencé à expérimenter de nouvelles constructions politiques. C'est en effet une nouvelle nuit étrange, car vous vous trouvez dans la position d'un gardien de la paix respecté entre les différentes factions qui prennent vie. Vous n'êtes pas un dirigeant à l'ancienne, mais la pierre solide qui défend les États libres contre les contre-attaques et les interférences mortelles. C'est une position précaire d'honneur douteux, encadrée de dangers et de menaces à tous les niveaux. Mais, vraiment, il n'y a aucun autre endroit où vous préféreriez être en ce moment."
 pod1230objectives.53.a:0 "Nous entrons hardiment dans une nouvelle ère."
 pod1230objectives.54.a:0 "Nous devons enseigner à ces jeunes leur place." 
 pod1230objectives.54.b:0 "La révolution est en marche." 
 pod1230objectives.55.t:0 "L'étreinte du serpent"
 pod1230objectives.55.desc:0 "«Une fois, vous étiez aveugle à la beauté de Set. Vous vous appelez Caïnites, car un faux ancêtre vous a amené à l'adorer. Maintenant, vous le savez mieux, seul un Dieu doit être adoré. Un Dieu miséricordieux, parce qu'Il vous pardonnera vos transgressions passées contre Lui, mais aussi un Dieu vengeur car à partir de cette nuit, les derniers Caïnites seront marqués comme des ennemis de Set et convertis, ou amenés devant l'œil inébranlable de Ra. Il n'y aura pas de répit jusqu'à ce que toute l'Europe loue son nom glorieux, alors, et alors seulement, il nous bénira de son retour! … Venez, enfants, prions dans le temple pour la venue de ce temps glorieux. Ensuite, profitez des récompenses de votre choix judicieux, car la nuit est encore jeune… »"
 pod1230objectives.55.a:0 "Il n'y a pas de Caïnites, seulement des Setites."
 pod1230objectives.55.custom:0 "Certains des Caïnites les plus ... avant-gardistes d'Europe et d'ailleurs se convertiront à la glorieuse vérité." 
 pod1230objectives.55.customb:0 "Vous obtiendrez des revendications sur vos ennemis ancestraux, le clan assamite." 
 pod1230objectives.56.a:0 "Ces fous égyptiens pourraient être sur quelque chose ..." 
 pod1230objectives.56.b:0 "Louange à Set et saluez son retour imminent!" 
 pod1230objectives.57.t:0 "Le calcul"
 pod1230objectives.57.desc:0 "Cela devrait être le moment de votre plus grand triomphe… Alors pourquoi vous sentez-vous si creux? Contre toute attente, vous avez tiré votre clan du bord de l'extinction, vous avez vengé contre les Tremere et pacifié les Baali une fois de plus, puisque c'est votre devoir. Mais en cours de route, vous avez perdu tellement plus. Saulot était un gardien, une âme bienveillante, qui aurait versé tant de larmes pour les sacrifices, le sang et la douleur que vous avez apportés sur votre chemin. Ils vous appellent "The Avenging Angel", car vous avez été sans pitié et, peut-être, avez été fidèle aux rumeurs que les Tremere ont racontées à propos de votre clan. Vous êtes l'épée des Salubri, la lumière du clan. Mais vous êtes également perdu, sans âme et la plus grande menace pour votre propre peuple maintenant que vos ennemis ont été traités. Maintenant, comme tant de fois, vous sentez l'œil vigilant de Saulot sur vous, vous offrant une dernière chance de vous arrêter avant qu'il ne soit trop tard ..."
 pod1230objectives.57.a:0 "Saulot avait tort, ils paieront tous."
 pod1230objectives.57.b:0 "Ce que j'ai fait? Père, pardonne-moi ..." 
 pod1230objectives.57.custom:0 "Les mensonges des Tremere sur votre clan sont exposés et ils subissent un revers politique majeur pour cela." 
 pod1230objectives.58.a:0 "Le clan Salubri est de retour dans le tableau une fois de plus." 
 pod1230objectives.58.b:0 "Démons! Voleurs d'âmes!" 
 pod1230objectives.59.t:0 "La fin des âges"
 pod1230objectives.59.desc:0 "«Vous construisez des empires au-delà de l’imagination, le summum de la réussite humaine et caïnite, l’envie du monde… Pensiez-vous que cela durerait? Vos villes prestigieuses, monuments de puissance, de sagesse et de gloire, se dressent, mais elles gisent blessées par des chacals, entourées de vautours, transpercées à mort par mille petites coupures, abattues par votre propre arrogance. Ce sont les affres de la mort des enfants de Caïn, la lumière de la civilisation s'estompe. Prenez le peu de temps précieux qu'il vous reste pour faire la paix avec vos péchés car même au moment de votre défaite finale, vous ne prendrez aucun réconfort dans l'oubli… Je viens pour vous. J'arrive avec des millions. J'apporte la fin des âges! Je suis le Fléau des Dieux! C’est la troisième guerre de Baali… et il n’y aura pas de quatrième. »"
 pod1230objectives.59.a:0 "Je regarderai votre monde brûler."
 pod1230objectives.60.a:0 "Nous devons les vaincre à tout prix!" 
 pod1230objectives.60.b:0 "Ainsi commence l'histoire..." 
 pod1230objectives.61.t:0 "Protéger le mal"
 pod1230objectives.61.desc:0 "Il y a des horreurs cachées en dessous que même le plus fidèle Caïnite redouterait d'imaginer. Vous les appelez «enfants», car ils sont les enfants des premières nuits, avant que l'humanité ne commence. Ces créatures dorment et personne ne les connaît plus, sauf votre commande. Vous comprenez qu'ils ne peuvent pas être détruits, seulement nourris pour les maintenir endormis. Et, comme ils se nourrissent d'innocents, votre peuple n'est pas considéré comme infernaliste et pire. Mais quelqu'un doit le faire, et seuls les vôtres ont le courage. Maintenant que vous avez purgé vos frères fous de l'Ordre d'Azaneal, les enfants peuvent continuer leur sommeil et le monde peut continuer à tourner. Votre commande le conservera, quel qu'en soit le prix."
 pod1230objectives.61.a:0 "Et ainsi, notre montre continue."
 pod1230objectives.62.a:0 "Randonnée folle d'adorateurs maléfiques." 
 pod1230objectives.62.b:0 "Nous ne pouvons qu'espérer un sommeil sans rêve."        
 pod1230objectives.63.t:0 "Ouest et Est"
 pod1230objectives.63.desc:0 "Le clan Ravnos a des racines profondes en Inde, où il est respecté en tant que clan de dirigeants avec une autorité sage. Dans le monde occidental, cependant, les Ravnos étaient une inadéquation incohérente de croyances contradictoires, souvent mal comprises et rejetées par les pouvoirs locaux. Cette longue oppression a pris fin avec votre montée en puissance. Pour la première fois, un Ravnos détient un pouvoir considérable dans l'ouest et peut défier même sa classe dirigeante caïnite bien enracinée. Mieux encore, cela a attiré l'attention des membres de votre clan en Inde, qui ont envoyé des ambassadeurs pour féliciter leurs parents rebelles et appeler à une alliance. Certains demanderaient cependant ... Où étaient-ils pendant les nuits les plus sombres de vos frères en Europe? Mais peut-être est-ce le moment du pardon ..."
 pod1230objectives.63.a:0 "Nous avons une nouvelle maison, mais nous n'oublierons pas l'Inde."
 pod1230objectives.63.b:0 "Le nouveau clan Ravnos n'oublie pas si facilement." 
 pod1230objectives.63.custom:0 "L'autorité des clans dirigeants occidentaux traditionnels, Ventrue, Lasombra et Tzimisce, sera remise en question par votre ascension pendant un certain temps." 
 pod1230objectives.63.customb:0 "Le Ravnos oriental enverra un candidat fort pour être embrassé en cadeau. Ce personnage deviendra votre courtisan."  
 pod1230objectives.64.a:0 "Nous avons déjà assez de «clan dirigeant»." 
 pod1230objectives.64.b:0 "Une nouvelle ère radieuse pour nos proches."
 pod1230objectives.65.t:0 "Mettre fin à l'éternel"
 pod1230objectives.65.desc:0 "L'Inde n'a jamais été en paix. Les Asuratizayya, ou Wan Kuei dans leur langue, ont constamment empiété sur notre terre, utilisant nos divisions internes pour nous tourner les uns contre les autres. Ces soi-disant démons affamés ne se soucient pas de nos traditions et sont prêts à utiliser les tactiques les plus sournoises pour faire valoir leur avantage, dans leur soi-disant «guerre basse». Parfois, nous avons été poussés au bord de l'extinction par les pactes démoniaques qu'ils concluent si facilement. Mais maintenant, l'Inde se réveille. Qu'ils soient Ravnos, Nagaraja ou Danava, les Caïnites indigènes retrouvent force et unité de but. Ne vous y trompez pas, la guerre éternelle ne sera pas terminée tant qu'aucun Wan Kuei n'osera parcourir nos terres. En tant que nouveau Chakravarti de l'Inde, voici ma première commande: tuez-les tous."
 pod1230objectives.65.custom:0 "Wan Kuei survivra sera chassé sans relâche." 
 pod1230objectives.65.customb:0 "Vous unifierez l'Inde en un nouvel empire."  
 pod1230objectives.65.a:0 "L'Inde riposte."  
 pod1230objectives.66.a:0 "L'Inde passe enfin à autre chose." 
 pod1230objectives.66.b:0 "Ce n’est qu’un revers." 
 pod1230objectives.67.t:0 "La montée du soleil écarlate"
 pod1230objectives.67.desc:0 "«... À vrai dire, vous auriez dû battre ces barbares il y a des siècles. Vous pouvez à peine empêcher votre démon intérieur de déchirer la gorge de l'ambassadeur des tribunaux nationaux qui est venu vous «féliciter» pour votre victoire. Des milliers de Wan Kuei ont échoué dans l'invasion de l'Inde avant que vous ne preniez les commandes, mais vous êtes à peine reconnu par vos pairs et leur dédain pour votre nouvelle cour se manifeste à chaque tournant. Ils n'ont aucune idée de la réalité de la situation ici, le Wan Kuei aurait même pu perdre si vous n'aviez pas intensifié pour sauver la nuit. Même ainsi, vous en avez besoin si vous voulez passer à de plus grandes ambitions et devenir un ancêtre à part entière ... ou vous? Il n'y aura pas de meilleure opportunité pour devenir voyou que sur le dos de votre plus grand triomphe ..."
 pod1230objectives.67.custom:0 "Vous unifierez l'Inde en un nouvel empire."  
 pod1230objectives.67.a:0 "Envoyez mes plus sincères remerciements aux ancêtres vénérés." 
 pod1230objectives.67.b:0 "J'annoncerai mon indépendance à vos maîtres. Avec ta tête."  
 pod1230objectives.68.a:0 "Les démons asiatiques ont remporté ce tour." 
 pod1230objectives.68.b:0 "Une nouvelle Cour se lève. Avec toutes ses opportunités."  
 pod1230objectives.69.t:0 "Le royaume ébène"
 pod1230objectives.69.desc:0 "Les morts-vivants en Afrique proviennent de diverses sources, des enfants de Caïn à la sorcière autoproclamée des Ramanga, mais ils partagent tous un sentiment d'affinité culturelle, les amenant à se présenter comme «Laibon». Jusqu'à présent, cela n'a pas été plus que cela, la façade de l'unité se fissurant facilement sous la pression d'étrangers, qu'il s'agisse d'Ashirra Caïnites ou même d'ennemis plus âgés. Les temps changent cependant, car les morts-vivants africains ont trouvé un chef commun, celui qu'ils appellent le «premier magaji». Ce ne sera pas une tâche facile, car vos frères ne sont pas habitués à l'unité et les humeurs sont déjà très fortes. Mais, pour l'instant au moins, vous bénéficiez du doute et du respect à contrecœur de vos pairs. C'est plus que quiconque avant vous."
 pod1230objectives.69.a:0 "Un leader partagé pour une unité partagée." 
 pod1230objectives.70.a:0 "Pour le meilleur ou pour le pire, l'Afrique monte." 
 pod1230objectives.70.b:0 "Nous suivrons ces histoires avec un vif intérêt."  
 pod1230objectives.71.t:0 "L'épée de Dieu brille"
 pod1230objectives.71.desc:0 "L'ordre le plus militant de l'Inquisition de l'ombre, les Chevaliers d'Acre ont toujours été les plus désireux de centraliser l'organisation naissante. Peut-être trop impatient, diraient certains, car le fanatisme des Chevaliers frôle parfois la frénésie rampante, ne distinguant pas vraiment les amis des ennemis. \nLes temps ont changé cependant, et la destruction finale de certains de leurs plus anciens ennemis et la purge de Constantinople ont forgé le L'épée de Dieu en une nouvelle arme plus meurtrière. Mais aussi un plus précis et subtil en cas de besoin, garantissant que l'Inquisition n'ait plus jamais à faire face à des ennuis internes de leur part. \nGauthier, alors qu'il nous regarde du Ciel, doit enfin sourire."
 pod1230objectives.71.custom:0 "Vous êtes un pas de plus vers l'unification de l'Inquisition de l'ombre."  
 pod1230objectives.71.customb:0 "La recrue la plus compétente des Chevaliers d'Acre a rejoint votre cour"   
 pod1230objectives.71.a:0 "L'enfer n'a pas de fureur comme un chevalier méprisé." 
 pod1230objectives.72.a:0 "L'Inquisition de l'Ombre illumine ..." 
 pod1230objectives.72.b:0 "Une victoire pour la Sainte Eglise."  
 pod1230objectives.73.t:0 "La main attentionnée de Dieu"
 pod1230objectives.73.desc:0 "Les Sœurs de Saint-Jean sont peut-être l'ordre le moins visible de l'Inquisition, mais elles accomplissent le devoir le plus difficile. En proie à des visions, qui conduisent beaucoup à la folie, les sœurs endurent un fardeau que peu de gens pourraient espérer survivre. \nLeur engagement envers la cause a parfois diminué et certains ont pensé qu'ils choisiraient de se retirer dans la vie monastique, dans le espoir de conjurer ces visions traumatiques. Mais les sœurs n'ont pas encore fini, dans une cérémonie calme et digne, elles ont renouvelé leur participation à la grande cause. Leur souffrance ne prendra fin que lorsque la dernière âme damnée sera purgée de la Terre de Dieu."
 pod1230objectives.73.custom:0 "Vous êtes un pas de plus vers l'unification de l'Inquisition de l'ombre."  
 pod1230objectives.73.customb:0 "La recrue la plus élite des Sœurs de Saint-Jean s'est jointe à votre cour"   
 pod1230objectives.73.a:0 "Les femmes bénies ne craindront pas leur devoir"     
 pod1230objectives.75.t:0 "Les yeux ouverts"
 pod1230objectives.75.desc:0 "L'Oculi Dei est un mal nécessaire, la police secrète de l'Inquisition ayant été chargée de la tâche ingrate de surveiller les chasseurs. Composés de fous totalement paranoïaques si l'on veut faire confiance aux autres Inquisiteurs, ils ont encore découvert de nombreux nids de corruption à l'intérieur de la Sainte Eglise. \nMalgré la pression constante de simplement dissoudre l'ordre, l'Oculi Dei est toujours là et a tranquillement purgé plus de membres extrémistes. Récemment, ils ont gagné le respect à contrecœur des autres ordres, qui les considèrent maintenant comme un outil utile, bien que dangereux. \nLes yeux sont maintenant entièrement tournés contre les serviteurs du Mal, qu'ils soient à l'intérieur ou à l'extérieur de l'Église."
 pod1230objectives.75.custom:0 "Vous êtes un pas de plus vers l'unification de l'Inquisition de l'ombre."  
 pod1230objectives.75.customb:0 "La recrue la plus élite de l'Oculi Dei a rejoint votre cour"   
 pod1230objectives.75.a:0 "Le mal ne pourra plus se cacher"     
 pod1230objectives.77.t:0 "Gardiens des secrets"
 pod1230objectives.77.desc:0 "L'Ordre Rouge a eu une histoire compliquée avec l'Inquisition. Sa quête de connaissances est inestimable, car elle contrecarre la nature secrète des serviteurs de l'enfer. Mais cela a également mis les membres de l'Ordre dans une position dangereuse, où la corruption et les livres interdits se cachent à chaque coin de rue. \nAprès la destruction de certaines des influences vampiriques les plus insidieuses d'Italie, l'Ordre Rouge est mieux équipé pour juger de ce qui vaut la peine d'être poursuivi, et ce qui devrait être détruit. \nAvec ce nouvel objectif, l'Ordre Rouge est un atout plus puissant pour l'Inquisition qu'il ne l'a jamais été."
 pod1230objectives.77.custom:0 "Vous êtes un pas de plus vers l'unification de l'Inquisition de l'ombre."  
 pod1230objectives.77.customb:0 "La recrue la plus élite de l'Ordre rouge a rejoint votre cour"   
 pod1230objectives.77.a:0 "Connaissance sans tentation"     
 pod1230objectives.79.t:0 "Travailler avec des profanes"
 pod1230objectives.79.desc:0 "La maison von Murnau est un étrange allié des autres ordres de l'Inquisition. Une maison noble allemande, sans lien réel avec le clergé, ils sont bénis (ou certains disent maudits) par Dieu pour pouvoir littéralement sentir le Mal. Ce pouvoir, et le leadership fort de personnalités comme Otto et Leopold von Murnau, en ont fait des alliés fidèles du Saint-Siège. \nMalgré cela, il a fallu un certain temps pour avoir toute l'étendue de la prolifique famille von Murnau à bord avec le Projet d'Inquisition. Désormais en sécurité dans leurs possessions allemandes, ils sont prêts à jouer leur rôle dans la guerre de l'ombre avec encore plus de zèle."
 pod1230objectives.79.custom:0 "Vous êtes un pas de plus vers l'unification de l'Inquisition de l'ombre."  
 pod1230objectives.79.customb:0 "Le descendant le plus élite du Von Murnau a rejoint votre cour"    
 pod1230objectives.79.a:0 "Noblesse pour une cause pieuse"    
 pod1230objectives.81.t:0 "De l'ombre à la lumière"
 pod1230objectives.81.desc:0 "Bien qu'elle ait été fondée par des individus extraordinaires, l'Inquisition de l'ombre a toujours été fragile. En plus des ennemis féroces, mais évidents, qui sont les sangsues, les conflits internes entre les ordres disparates étaient un problème toujours présent. Il semblait presque que l'Inquisition était destinée à tomber plusieurs fois. \nPas plus. Après avoir remporté une série de victoires clés contre les vampires, l'Inquisition de l'Ombre en ressort plus forte que jamais et plus solidaire qu'avant. Aucun serviteur des ténèbres ne peut plus percer le bouclier de l'humanité. \nL'Inquisition a gagné et prononcera bientôt le jugement final de Dieu sur les Caïnites."
 pod1230objectives.81.a:0 "La bataille finale commence"     
     