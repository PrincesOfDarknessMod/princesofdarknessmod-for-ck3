l_french:

 podgreatpersons.0001.t:0 "Abd al-Latif al-Baghdadi"
 podgreatpersons.0001.desc:0 "Historien et philosophe de renom, Abd al-Latif al-Baghdadi est récemment retourné à Bagdad après des années de longs voyages à travers le Moyen-Orient. Ses écrits et sa connaissance de l'âme, de l'esprit et du corps des humains ont déjà une grande valeur, et même Saladin lui-même lui a donné le patronage. Au fur et à mesure qu'il vieillit et devient plus reclus, cela pourrait être votre seule chance d'acquérir un si bel enfant pour vous-même."
 podgreatpersons.0001.a:0 "L'or n'est pas préoccupant."
 podgreatpersons.0001.b:0 "Il est temps de tirer quelques ficelles."
 podgreatpersons.0001.c:0 "Nous sommes mieux sans un autre concurrent."
 podgreatpersons.0001.d:0 "Donnez-le moi!" 
 podgreatpersons.0001.custom:0 "Cette personne célèbre rejoindra votre cour, vous donnant une petite fenêtre pour effectuer l'étreinte. Jouer avec un tel individu augmentera votre exposition à la mascarade."
 podgreatpersons.0001.customb:0 "Cette personne célèbre errera jusqu'à ce que la mort vienne l'appeler."
 podgreatpersons.0002.t:0 "Alice Kyteler"
 podgreatpersons.0002.desc:0 "Une petite histoire pittoresque a attiré votre attention. Une mortelle astucieuse nommée Alice Kyteler a récemment échappé à son procès pour sorcellerie, hérésie, sacrifice d'animaux et fornication avec un démon apparemment nommé «Robin». Tous ses associés ont déjà été brûlés sur le bûcher ou le seront bientôt, mais elle a réussi à contrecarrer l'Église à tant d'occasions que sa capacité ne peut être niée. Comme l'un de vos contacts vous informe qu'elle s'est réfugiée près de votre domaine, vous vous demandez si vous auriez envie d'avoir une sorcière ambitieuse et intelligente comme enfant ..."
 podgreatpersons.0003.t:0 "Jalal ad-Din Muhammad Rumi"
 podgreatpersons.0003.desc:0 "Un juriste et théologien accompli, Rumi comme il est plus connu, est rendu encore plus célèbre par ses Ghazals, ou poèmes persans. Homme très apprécié, même en dehors des communautés musulmanes, il a récemment terminé son chef-d'œuvre, le Masnavi. La nouvelle est que la maladie le rattrape et qu'il a prédit sa propre mort. Vous avez une petite fenêtre pour agir si vous voulez l'embrasser que ce soit pour patronner ses œuvres futures ou pour d'autres ... efforts liés à la caïnitique."
 podgreatpersons.0004.t:0 "Agnes Randolph"
 podgreatpersons.0004.desc:0 "Alors que la guerre mortelle pour l'indépendance de l'Écosse fait rage, le nom d'Agnès Dunbar a attiré votre attention. Cette féroce Écossaise a défendu son château sans chef avec un esprit aussi indomptable que n'importe quel mortel peut le faire. Tournant 20 000 Anglais dans le ridicule avec des astuces intelligentes et un esprit vif, la dame du château a plus que prouvé son courage. Coincé dans un mariage sans amour avec peu de chances d'héritage, vous pourriez probablement convaincre une femme aussi courageuse de mettre ses compétences considérables à votre service. Peut-être même en tant qu'enfant ..."
 podgreatpersons.0005.t:0 "Agnes Sorel"
 podgreatpersons.0005.desc:0 "Vous venez d'apprendre que Louis XI, le fils du roi mortel de France, envisage d'empoisonner Agnès Sorel, la maîtresse royale. Cette dame souvent scandaleuse a eu une forte influence sur le roi depuis un certain temps maintenant et des histoires de sa beauté ont même atteint votre cour. Si vous n'agissez pas vite, la France perdra l'une de ses plus belles fleurs. Si vous le faites cependant ... eh bien, vous pouvez peut-être vous assurer que cette fleur spécifique ne se fane jamais."
 podgreatpersons.0006.t:0 "Alexander Nevsky?"
 podgreatpersons.0006.desc:0 "Dans une tournure surprenante des événements, vous avez entendu que quelqu'un prétendant être Alexander Nevsky s'est récemment présenté dans une ville voisine. C'est au mieux improbable, puisque le célèbre Grand Prince de Vladimir est actuellement en mission diplomatique avec la Horde d'Or. Cet individu prétend avoir appris la société caïnite et souhaite être «embrassé à ses propres conditions» pour obtenir l'immortalité, mais pas l'esclavage. Vous avez des doutes sur cette histoire mais pouvez-vous laisser un rival potentiellement embrasser le héros de la Rus, fléau des Allemands et des Suédois? À tout le moins, vous pouvez le faire venir à votre tribunal et juger par vous-même ..."
 podgreatpersons.0007.t:0 "Anthony of Padua?"
 podgreatpersons.0007.desc:0 "Un de vos agents rapporte que quelqu'un prétendant être Anthony de Padoue, le célèbre saint homme, a été vu dans une ville voisine. C'est au mieux peu probable, car vous êtes à peu près sûr que le vrai Anthony est mort l'année dernière et a été canonisé par Rome. Le vrai moine franciscain était un saint vivant, avec une aura capable de brûler votre espèce à des kilomètres de distance. Pourtant ... cela vaut peut-être la peine d'être étudié. Il pourrait être l'un de ses compagnons encore en vie ou un homme suffisamment appris pour justifier d'être considéré comme un enfant potentiel."
 podgreatpersons.0008.t:0 "Antonio de Nebrija"
 podgreatpersons.0008.desc:0 "L'un des plus grands humanistes de l'époque, Antonio de Nebrija est l'auteur de nombreux livres auxquels votre cour fait souvent référence. Vous n'êtes pas particulièrement friands de cette mode «humaniste» que les mortels ont en ce moment, mais vous ne pouvez pas nier le talent de cet homme. Son âge le rattrape cependant, et vous vous demandez si ce serait le bon moment pour le rapprocher de votre cour. Peut-être qu'avoir un enfant `` à l'esprit moderne '' pourrait s'avérer bénéfique."
 podgreatpersons.0009.t:0 "Baba Ishak Kafarsurdi"
 podgreatpersons.0009.desc:0 "Un mortel a fait tout un chahut dans le nord-est de l'Anatolie récemment. Se proclamant Messie immortel, cet Ishak a rassemblé de nombreux adeptes et a même mené une rébellion ouverte contre le Sultanat Seldjoukide. Comme c'est souvent le cas avec les mortels, ce fut une tentative de courte durée et le soi-disant «Immortel» va bientôt être exécuté. Vous considérez que cet homme ne manque pas de charisme et de dynamisme. Peut-être qu'avec le bon professeur, il pourrait faire un enfant intéressant ..."
 podgreatpersons.0010.t:0 "Beatriz da Silva?"
 podgreatpersons.0010.desc:0 "Quelque chose s'est passé dans le palais de Tolède dédié au nouvel ordre de l'Immaculée Conception. Les rapports sont flous, mais vos agents affirment qu'ils ont finalement pu s'approcher du lieu malgré l'aura de True Faith qui l'entoure. Ils ont suivi les survivants de ce qui ressemble à une attaque par des inconnus et pensent avoir une bonne maîtrise de l'emplacement de la fondatrice de l'ordre, Beatriz da Silva, après l'événement. Cela semble tiré par les cheveux, d'autant plus que Da Silva doit être beaucoup trop saint pour que les Caïnites l'approchent, mais c'est quand même une opportunité. Vous pourriez retrouver cette femme et l'amener à vous. Vous pourriez avoir une utilité pour elle ..."
 podgreatpersons.0011.t:0 "Birgitta Birgersdotter?"
 podgreatpersons.0011.desc:0 "Connaissant votre réputation, une jeune femme prétendant être Birgitta Birgersdotter s'est adressée à l'un de vos agents pour demander à être «libérée des pièges de l'Église». Vos hommes disent qu'il y a des similitudes entre cette femme et ce que l'on sait de la sainte femme sur le point de fonder un nouvel ordre saint en Suède, mais l'âge ne correspond pas. Avec un peu de fouille, vous pouvez dire que c'est l'une de ses filles, Cecilia, qui a été coincée dans un couvent contre son gré à un jeune âge par sa sainte mère. Bien qu'elle ne soit pas aussi importante que Birgitta elle-même, Cecilia ressemble toujours à une jeune femme potentiellement utile et déterminée. Potentiellement un candidat approprié pour une étreinte?"
 podgreatpersons.0012.t:0 "Catherine of Siena?"
 podgreatpersons.0012.desc:0 "Vous avez entendu parler de Catherine de Sienne, une jeune sainte femme qui s'est fait un nom en tant que force itinérante de Dieu, peut-être la plus ardente avocate de l'Église de Rome actuellement active, même si elle semble parfois en désaccord. En tant que tel, vous avez été surpris lorsqu'une autre femme est apparue récemment, prétendant être la sœur présumée décédée de Catherine, Bonaventura. Il semble qu'elle ait survécu jusqu'à présent avec des méthodes qu'il vaut mieux ne pas dire et souhaite maintenant disparaître de l'Histoire, car sa «mort» a été une profonde leçon pour Catherine. C'est une demande inhabituelle, car il semble que la femme soit toujours assez fervente dans son amour pour Dieu et sa sœur, mais pas assez pour se suicider. Vous réfléchissez à votre prochain mouvement."
 podgreatpersons.0013.t:0 "Clare of Assisi?"
 podgreatpersons.0013.desc:0 "Un de vos petits rivaux a fait un geste audacieux contre San Damiano, l'église où la sainte Claire d'Assise habite avec ses sœurs dans la foi. De toute évidence, le fou et ses copains n'ont pas survécu à la Vraie Foi qui imprègne la région, mais ils ont réussi à provoquer une certaine agitation. Il semble que l'une des sœurs de Clare, Beatrix, ait été «perdue» lors de l'assaut. Bien que vous n'ayez aucune chance contre la pieuse et vertueuse Claire elle-même, embrasser sa sœur serait un coup moral pour l'Église ..."
 podgreatpersons.0014.t:0 "Cesare Borgia"
 podgreatpersons.0014.desc:0 "Cesare Borgia, l'Italien impitoyable, mène actuellement un siège difficile à Viana. Jusqu'à présent, l'homme s'est montré extrêmement ingénieux, avec de nombreuses victoires et trahisons à son actif lors de ses campagnes en Italie. Avec la mort de son père Rodrigo et l'ascension d'un nouveau pape hostile, il commence à se faire acculer par ses nombreux ennemis. Il n'y aurait pas de meilleur moment pour bouger si vous souhaitez un enfant prestigieux. Après tout, tout peut arriver pendant un siège ..."
 podgreatpersons.0015.t:0 "Christine de Pizan"
 podgreatpersons.0015.desc:0 "Un spectacle courant dans les tribunaux français depuis des décennies, la célèbre écrivaine et enseignante Christine du Pizan a récemment déménagé dans un couvent pour les dernières années de sa vie mortelle. Son travail a reçu des éloges dans de nombreux cercles, y compris Caïnite, car ils s'attardent sur la véritable définition du pouvoir, des vues optimistes sur l'avenir et la place des femmes dans l'histoire de la France. Son corps s'affaiblit peut-être, mais son esprit semble plus vif que jamais, puisqu'elle a récemment publié un poème sur le destin de Jeanne d'Arc. Certains de vos courtisans ont envie de faire d'elle une partie de la société caïnite. Pour garder son talent, bien sûr."
 podgreatpersons.0016.t:0 "Cola di Rienzo"
 podgreatpersons.0016.desc:0 "Mortal Rome a été dans un tumulte encore plus grand que d'habitude ces derniers temps. La cause principale étant un Cola di Rienzo, un roturier ayant réussi à devenir chef de la ville par pur charisme ... deux fois. Il rêve d'un nouvel Empire romain, manifestement épris de ses propres illusions de grandeur. L'homme semble également assez doux en matière de guerre et est facilement intimidé. Vos agents se demandent s'il est vraiment talentueux ou simplement incroyablement chanceux. Le fait est que la foule romaine se retourne clairement contre lui maintenant, une opportunité pour vous d'embrasser un enfant improbable, mais peut-être utile."
 podgreatpersons.0017.t:0 "Dante Alighieri"
 podgreatpersons.0017.desc:0 "Bien que votre cour et vos pairs ne le comprennent pas, vous êtes devenu passionné par une épopée récemment publiée appelée «la Divine Comédie». Il a ... quelque chose qui pénètre profondément dans votre âme, en particulier dans votre condition, comme si l'auteur en savait plus qu'un mortel ne devrait sur les dieux et les démons. Cet homme, Dante Alighieri, a perdu sa chance maintenant, ayant été exilé et abandonné par la plupart de ses anciens alliés politiques. Il est peu probable que quiconque s'en soucierait s'il devait rencontrer un accident malheureux ... Et puis, vous pourriez l'amener à votre tribunal et avoir les réponses que vous cherchez. Après tout, une vie immortelle devrait être suffisamment de temps pour comprendre le Divin."
 podgreatpersons.0018.t:0 "Diane de Poitiers"
 podgreatpersons.0018.desc:0 "Diane de Poitiers est la véritable puissance derrière le trône de France depuis près de 25 ans maintenant. Pour autant que vous puissiez dire, elle n'a pas vraiment comploté ou tué son chemin dans cette position ... ce qui aurait fait d'elle une parfaite candidate à l'embrassement. Pourtant, vous ne pouvez pas être aussi puissant en France sans un intellect astucieux et beaucoup de sens politique, les deux qualités que le Royal Favorite a à profusion. Avec la mort récente d'Henri II, sa principale rivale, Catherine de Médicis, a déjà emménagé pour supprimer tout le pouvoir et les actifs que lui a donné le roi. Diane ne semble pas déterminée à riposter et semble accepter son destin de tomber dans l'obscurité. Ce pourrait être le bon moment pour vous assurer un conseiller en chef de votre choix ..."
 podgreatpersons.0019.t:0 "Edward Longshanks?"
 podgreatpersons.0019.desc:0 "Le dernier roi d'Angleterre, Edward I, est mort il y a quatre ans. Vous avez suivi sa vie avec intérêt, car il était un législateur renommé, un politicien avisé et un général capable, toutes des qualités prisées dans la société caïnite ... avec juste une touche de peur et de brutalité bien sûr, aussi des qualités possédées par le défunt roi. Il était toujours hors de question de l'embrasser, aussi protégé par les agents de l'Église que le sont les rois, mais vous avez récemment entendu dire qu'Henry of Lacy, son compagnon le plus digne de confiance, montre des signes de sortie de son enveloppe mortelle. Homme loyal et capable lui-même, il pourrait être un bon témoin de la tactique de Longshanks, ou même un candidat à l'étreinte."
 podgreatpersons.0020.t:0 "Erzsebet Bathory"
 podgreatpersons.0020.desc:0 "Un de vos agents est revenu du château de Csejte avec un rapport troublant, il semblerait qu'Erzsebet Bathory, la femme accusée de plus de 600 meurtres, baignant dans le sang des vierges et du cannibalisme, ne soit pas réellement un vampire ... pour le moment. Son procès a été une affaire impitoyable, même capable de troubler la Caïnite la plus résistante avec des comptes rendus détaillés de ses pratiques de torture qui incluent brûler, congeler, utiliser des fourmis vivantes ou éviscérer. Parfois tous à la fois. Mais si elle n'est pas un vampire ... cela signifie qu'elle ferait un excellent candidat, même si peut-être un peu dérangé."
 podgreatpersons.0021.t:0 "Elizabeth of Hungary?"
 podgreatpersons.0021.desc:0 "Un de vos petits rivaux a récemment pris une décision contre Konrad von Marburg, un inquisiteur renommé et ancien mentor de la sainte Élisabeth de Hongrie récemment décédée. Le fou a été écrasé, mais les conséquences sont désordonnées, avec des pistes menant à plus d'indices sur la `` conspiration caïnite ''. L'une d'elles est une jeune femme, autre élève de l'inquisiteur, qui a été témoin de première main des dons de Caine. La faire disparaître susciterait des soupçons mais pourrait être utile, à la fois comme grève contre l'Inquisition et comme candidat potentiel à l'étreinte. Curieusement, la femme s'appelle également Elizabeth et semble proche de l'âge que le Saint devrait avoir à ce stade. Peut-être que Konrad a ses propres secrets ..."
 podgreatpersons.0022.t:0 "Ernst von Manfeld"
 podgreatpersons.0022.desc:0 "Vos agents rapportent qu'Ernst von Manfeld, le tristement célèbre chef mercenaire est actuellement en Bosnie, apparemment dans un état de maladie terminale. Cet Allemand astucieux s'est fait un nom en tant qu'homme à louer qualifié, sinon ouvertement fiable. Il est assez réputé pour avoir combattu du côté protestant pendant la guerre de trente ans ... bien qu'il se considère comme un catholique pieux. Avec son excellent pedigree militaire et ... son ouverture d'esprit, il pourrait devenir un candidat intéressant."
 podgreatpersons.0023.t:0 "Eustace Folville"
 podgreatpersons.0023.desc:0 "Le gang soi-disant «Folville» est le sujet de conversation en Angleterre depuis des décennies. Probablement pas beaucoup mieux que de simples voyous, ces hors-la-loi avaient la chance, ou la capacité, de cibler les membres de l'entourage d'Édouard II. Le roi, aussi méprisé soit-il, ne peut vraiment convaincre personne que le gang d'Eustace n'est pas une sorte de groupe populaire de personnages héroïques. Après de nombreuses années de recherche, vos agents ont enfin retrouvé le hors-la-loi vieillissant. Vous êtes maintenant en mesure d'acquérir potentiellement un combattant et un chasseur de canaille pour vous-même."
 podgreatpersons.0024.t:0 "Fibonacci"
 podgreatpersons.0024.desc:0 "Une nouvelle mode arrive sur les mortels. Le système numérique «hindou-arabe» commence à être utilisé par rapport à l'ancien - et évidemment supérieur à votre avis - romain. Vous êtes à peu près sûr que les mortels reprendront leurs esprits en temps voulu, mais vous êtes curieux de connaître le partisan de cette théorie, un Leonardo Bonacci, également connu sous le nom de Fibonacci. Le désormais vieil homme s'est installé à Pise après avoir publié son traité. Vous ne pouvez pas nier la connaissance de l'homme et vous pouvez «l'inviter» à votre cour pour un débat. Ou peut-être à des fins plus ... familiales?"
 podgreatpersons.0025.t:0 "Florian Geyer"
 podgreatpersons.0025.desc:0 "La guerre des paysans mortels est une épine agaçante dans votre flanc depuis un certain temps maintenant, car l'alimentation devient plus difficile à obtenir lorsque les paysans meurent en masse dans une guerre. Une opportunité s'est cependant présentée sous la forme de Florian Geyer, le noble en disgrâce à la tête de la «Compagnie Noire», une unité de cavalerie lourde qui a combattu aux côtés des paysans. Bien que déjà un héros populaire pour les gens ordinaires, Geyer est également impitoyable et rapide à la colère, ce qui en fait un canon lâche dans la nature. Et il semble qu'après leur dernière défaite à Ingolstadt, vos agents aient pu localiser son emplacement. Acculé et du côté perdant de l'Histoire, ce n'est qu'une question de temps avant que Geyer ne fasse face à la mort. Mais si vous deviez intervenir ..."
 podgreatpersons.0026.t:0 "Galeazzo Maria Sforza"
 podgreatpersons.0026.desc:0 "Ces dernières années, vous avez été divertis par les récits d'un Galeazzo Maria Sforza, le duc mortel de Milan. Homme à l'imagination vive, il a créé de nombreuses nouvelles formes de torture, à la fois psychologiques et physiques. Votre cour a été particulièrement amusée par le «clou d'un homme vivant à son cercueil». De toute évidence, cela ne lui a pas vraiment fait beaucoup d'amis à Milan et au-delà, et il va de soi qu'il sera bientôt démis de ses fonctions, probablement violemment. Vous avez l'idée d'organiser vous-même sa mort, pour ensuite le ramener à votre cour. À tout le moins, il pourrait faire un vampire très vivant ..."
 podgreatpersons.0027.t:0 "Geoffrey Chaucer"
 podgreatpersons.0027.desc:0 "Vous avez entendu dire que le célèbre poète et fonctionnaire Geoffrey Chaucer a été pris en embuscade par des bandits et blessé lors de l'attaque. L'homme n'est plus jeune et ses jours de gloire sont passés avec l'abdication de son patron Richard II. Pourtant, il est un diplomate talentueux et un poète prodigieux, l'un des premiers à utiliser la langue du moyen anglais comme dispositif littéraire. Une personne aussi érudite en politique et en poésie mérite un certain attrait en tant qu'enfant potentiel."
 podgreatpersons.0028.t:0 "Gilles de Rais"
 podgreatpersons.0028.desc:0 "L'un des compagnons de Jeanne d'Arc, Gilles de Rais, est tombé assez bas récemment. Ayant perdu sa fortune et toute bonne volonté de ses pairs, le noble semble avoir eu recours à plus ... de mécènes démoniaques. Son procès a été une affaire sordide, avec des témoignages de meurtres avec un degré de cruauté que même la plupart des Caïnites trouveraient déplaisants. La véracité des accusations est difficile à reconnaître car, après tout, même les mortels complotent les uns contre les autres. Il reste que Gilles affrontera la mort par pendaison très bientôt ... à moins que vous n'interveniez et que vous le remplaciez par une autre pauvre âme. Pour un humain, Gilles a certainement montré du potentiel en tant que candidat à l'étreinte ..."
 podgreatpersons.0029.t:0 "Girolamo Savonarola"
 podgreatpersons.0029.desc:0 "Florence a été dans un tumulte récemment, quand un frère dominicain, Savonarole, a évincé les Médicis au pouvoir en prêchant aux bons gens des visions de gloire, pour eux, et de ruine, pour leurs ennemis. Cet homme a fait preuve de résilience, résistant aux tentatives d'excommunication de l'Église et même apaisant le roi de France dans une pseudo-alliance. Sa chance s'est épuisée ces derniers temps, alors qu'il a bâclé le procès par le feu destiné à prouver son appel divin aux habitants de Florence. Maintenant détenu en prison par une foule en colère et dépourvu de tout soutien, l'ancien dirigeant de facto de Florence fera très bientôt face à la mort par le feu ... à moins que vous n'interveniez. Certes, Savonarola a du talent pour faire en sorte que les gens le suivent et c'est une qualité précieuse à avoir dans la politique caïnite."
 podgreatpersons.0030.t:0 "Gottfried von Berlichingen"
 podgreatpersons.0030.desc:0 "Le chef mercenaire Gottfried -Gotz- von Berlichingen est devenu le sujet de conversation de votre cour ces derniers temps. L'Allemand courroucé et grossier est connu pour garder rancune pendant très longtemps et encore plus célèbre pour avoir perdu son bras lors d'un siège. Un fait qui n'a pas arrêté Gotz depuis longtemps, car il a rapidement utilisé un étrange appareil en fer pour le remplacer et retourner sur le champ de bataille. Après une longue carrière de guerres, de captures et de blessures, le «Iron Hand» commence enfin à montrer son âge et est retourné dans son domaine familial pour passer ses derniers jours en paix. Votre cour soutient qu'un individu aussi tenace et expérimenté serait un grand atout pour votre juste cause incontestablement en tant que chef de la nuit."
 podgreatpersons.0031.t:0 "Hadewijch"
 podgreatpersons.0031.desc:0 "Vous avez entendu parler d'une noble itinérante nommée Hadewijch passant par votre ville. Bien que leur enquête n'ait pas révélé grand-chose sur son passé, vos agents la décrivent comme une poétesse et écrivain talentueuse avec le regard de quelqu'un qui a beaucoup affronté au cours de sa vie, mais qui perdure encore. Cette forte personnalité et ses connaissances acquises en font quelqu'un qui mérite d'être surveillé, et peut-être même qu'il vaut la peine d'être considéré comme une candidate à l'étreinte."
 podgreatpersons.0032.t:0 "Hermann von Salza"
 podgreatpersons.0032.desc:0 "Le Grand Maître de l'Ordre Teutonique a été un énorme casse-tête pour les Caïnites en Allemagne depuis le début de son mandat. Même la Croix Noire, l'ordre des chevaliers caïnites allemands, ne pouvait pas percer la Vraie Foi protégeant cet homme. En tant que tel, et avec ses talents impressionnants en tant que commandant et diplomate, Hermann a été en mesure de freiner la plupart de l'influence caïnite sur son ordre. Cependant, quelque chose a changé récemment, car les chevaliers teutoniques ont déclenché une rébellion silencieuse le poussant à l'écart en tant que simple figure de proue. Alors que la vieillesse le rattrape et que le travail de sa vie s'effondre, la foi d'Hermann diminue. Ce pourrait être la meilleure opportunité pour une douce vengeance ironique sur ce soldat de l'Église ..."
 podgreatpersons.0033.t:0 "Ibn Arabi"
 podgreatpersons.0033.desc:0 "L'un des savants les plus célèbres du monde musulman a récemment déménagé à Damas. Ibn Arabi est un savant, mystique et philosophe renommé avec près de 850 œuvres qui lui sont attribuées. Même le monde caïnite en a pris note, avec divers débats surgissant au sujet de sa véritable connaissance du fonctionnement interne du monde. Maintenant un vieil homme, il semble qu'Ibn Arabi essaie frénétiquement de terminer sa deuxième ébauche du Futuḥat al-Makkiyya avant que la mort ne le rattrape. Accorder le don de l'immortalité à un tel individu est tentant, même si vous savez que la malédiction de Caïn peut profondément changer une personne ..."
 podgreatpersons.0034.t:0 "Ibn Khaldun"
 podgreatpersons.0034.desc:0 "Le savant, politicien et historien renommé Ibn Khaldun est, une fois de plus, menacé par ses nombreux ennemis. Le vieil aventurier a connu une vie de stratagèmes, de conquêtes militaires et de nombreuses fonctions gouvernementales prestigieuses. Pourtant, il est surtout connu pour son travail remarquable sur la nature cyclique des empires qui en a fait l'un des envoyés envoyés pour parler avec le seigneur mongol menaçant Timur. De retour récemment, son allégeance à un parti politique secret revient le hanter et ses jours semblent comptés, à la fois par sa propension aux ennuis et à la vieillesse. Certains de vos courtisans vous exhortent à le considérer comme un enfant potentiel avant qu'il ne soit trop tard."
 podgreatpersons.0035.t:0 "Imperia Cognita"
 podgreatpersons.0035.desc:0 "La «reine des courtisanes» est un spectacle bienvenu à Rome depuis son arrivée. Femme avisée, elle a réussi à se frayer un chemin jusqu'au sommet des célébrités les plus célèbres de Rome, les courtisanes. Adorée à la fois par le clergé et les artistes, comme Raphaël, elle est une présence riche et influente dans la ville sainte. Il semble que cela touche à sa fin, car elle se bat actuellement et perd une bataille contre le poison apparemment auto-administré. Bien que vous ne sachiez pas pourquoi elle a tenté de se suicider, peut-être une petite raison mortelle comme le `` véritable amour '', vous savez que c'est l'occasion d'en embrasser une qui devrait facilement trouver sa place dans les tribunaux de la nuit."
 podgreatpersons.0036.t:0 "Jan Hus?"
 podgreatpersons.0036.desc:0 "Le «mouvement hussite» a été une préoccupation majeure pour les Caïnites récemment. Certains sont fascinés par l'idée de la chute de l'Église en morceaux, d'autres semblent vraiment intéressés par cette théorie réformiste. Le chef du mouvement, Jan Hus lui-même, ne tardera pas à vivre dans le monde, car son procès entraînera très probablement une exécution rapide. Un groupe de jeunes Caïnites «hussites» a organisé un sauvetage audacieux du prisonnier ... et a lamentablement échoué. Dans la foulée cependant, vos agents ont remarqué un homme seul errant dans les rues, prétendant être le prédicateur lui-même. C'est très improbable, car le procès se poursuit sans heurts, mais il pourrait être un disciple de Hus, choqué par l'attaque. Dans tous les cas, en tant que survivant d'une agression caïnite, il est une menace pour votre maintien du secret ..."
 podgreatpersons.0037.t:0 "Jan Zizka"
 podgreatpersons.0037.desc:0 "Vous avez suivi de près la carrière d'un brillant général nommé Jan Zizka. Ce chef hussite s'est révélé extrêmement capable, transformant un groupe hétéroclite de paysans en une force capable de vaincre les meilleurs chevaliers d'Europe en utilisant des tactiques innovantes. Plus particulièrement avec l'avènement de ce qu'on appelle la «poudre à canon», une nouvelle arme mortelle qui pourrait causer des problèmes à votre espèce. Vous avez appris que Zizka est de nouveau en campagne, mais la peste l'a rattrapé et ses jours semblent comptés. Vous envisagez fortement d'organiser une opération pour l'amener à votre cour car il serait un chef militaire apprécié et quelqu'un qui pourrait vous expliquer de première main le danger de ces nouvelles armes."
 podgreatpersons.0038.t:0 "Madame de Pompadour"
 podgreatpersons.0038.desc:0 "La France a une longue tradition de maîtresses puissantes et de confidentes pour ses rois. Mais vous devez admettre que ce qu'on vous a dit de Jeanne Antoinette Poisson sort de l'ordinaire. La maîtresse royale, alors «amie du roi» lorsqu'ils sont passés à une relation plus chaste, a eu autant de pouvoir que Louis XV ces dernières années, sinon plus. Son charisme, sa perspicacité politique et son solide réseau d'amis l'ont rendue puissante ... et détestée dans de nombreux cercles de la cour. Cela touche cependant à sa fin, car sa constitution fragile a finalement gagné sa résolution, avec une maladie à laquelle elle ne survivra probablement pas. La France mortelle perdra un joyau, mais peut-être que la France caïnite pourrait en gagner un ..."
 podgreatpersons.0039.t:0 "Jeanne de Clisson"
 podgreatpersons.0039.desc:0 "Vos agents vous informent que la tristement célèbre «Lionne de Bretagne» et ses enfants ont récemment fait naufrage dans une région reculée. La Lionne est Jeanne de Clisson, une noble bretonne qui a juré de se venger du roi de France pour l'exécution lâche de son mari il y a plus de 10 ans. Depuis, elle se lance en corsaire avec un succès surprenant contre les flottes françaises près de la Bretagne. Femme volontaire et pratique, elle est connue pour ne laisser qu'un seul survivant à chaque fois pour raconter l'histoire, elle a impressionné beaucoup de vos courtisans. Sa récente défaite et son isolement vis-à-vis de ses alliés et de ses coéquipiers vous donnent l'occasion de «l'inviter» à votre cour. Peut-être pourriez-vous utiliser une telle lionne comme enfant ..."
 podgreatpersons.0040.t:0 "Jeanne d'Arc?"
 podgreatpersons.0040.desc:0 "La «Pucelle d'Orléans» a été un problème majeur pour les Caïnites alors que la guerre fait rage entre la France et l'Angleterre. Ce qui était une opportunité majeure pour des intrigues faciles et une alimentation plus facile s'est transformé en une guerre presque religieuse. True Faith est endémique, et vous avez perdu le compte du nombre de Caïnites brûlés par les fanatiques affluant sous la bannière de Jeanne. Elle est elle-même inattaquable, protégée par une conviction qui semble de nature divine mais ... ses proches ne le sont pas. C'est mesquin mais vous pourriez vous venger de sa famille pour tout le mal de tête qu'elle a causé, d'autant plus que les Anglais l'ont finalement attrapée, la rendant, espérons-le, inoffensive. Et avec un peu de chance, ils pourraient même fabriquer des pions utiles."
 podgreatpersons.0041.t:0 "John Cabot"
 podgreatpersons.0041.desc:0 "C'est une période de changement et d'exploration, deux choses que les Caïnites ne sont pas aptes à gérer. Alors que l'Europe lance de plus en plus d'expéditions dans le grand inconnu, vos semblables se demandent quelle sorte d'horreurs et d'opportunités les attendent. Vous êtes déterminé à ne pas être laissé pour compte et, à ce titre, vous vous êtes renseigné sur l'un des plus grands explorateurs de l'époque, John Cabot. Ce capitaine de navire fidèle est récemment revenu d'un de ses nombreux voyages dans le grand ouest et pourrait probablement en faire beaucoup plus avec un mécène immortel comme vous. Lui accorder l'immortalité est également une option, une option qui pourrait vous donner une longueur d'avance sur l'avenir, à la fois ici et au-delà du vaste océan bleu."
 podgreatpersons.0042.t:0 "John Hawkwood"
 podgreatpersons.0042.desc:0 "Les Condottieri sont une réalité de la vie en Italie. Ces hommes sont payés pour faire la guerre aux riches cités-États du pays et sont souvent aussi inconstants dans l'allégeance qu'ils sont avides de pièces de monnaie. L'un de leurs dirigeants, l'Anglais John Hawkwood, a fait l'essentiel de sa carrière ici, combattant pour et contre de nombreuses villes. Homme impitoyable et avide par la plupart des comptes, il est également reconnu comme l'un des meilleurs commandants et stratèges du lot. Alors que son âge le rattrape et que devrait être sa dernière expédition, certains de vos courtisans soutiennent que ce serait le bon moment pour l'approcher. La promesse d'immortalité séduirait facilement un tel homme et il pourrait se révéler utile ... si vous pouviez le lier à votre volonté."
 podgreatpersons.0043.t:0 "Leonardo da Vinci"
 podgreatpersons.0043.desc:0 "Depuis quelque temps déjà, François Ier s'est passionné pour un artiste italien, allant même jusqu'à lui offrir un château pour son usage personnel. Vous avez espionné l'homme et devez reconnaître le génie dans les multiples domaines qu'il possède. Vous êtes cependant loin d'être le seul à l'admirer, avec ce qui ressemble à une cabale d'ouvriers volontaires surveillant de près, rendant tout contact étroit impossible. Récemment, cependant, vous avez appris que la santé de Léonard était défaillante, poussant le roi à planifier une visite à son vieil ami. Cela pourrait être votre meilleure chance pour `` inviter '' le plus grand esprit de cette génération à votre cour ..."
 podgreatpersons.0044.t:0 "Lucrezia Borgia"
 podgreatpersons.0044.desc:0 "Vous êtes toujours à la recherche de candidats potentiels, et la famille Borgia n'en manque pas. Lucrezia, fille du pape Alexandre VI, a été un véritable atout pour son père et son frère. Juste, intelligente et volontaire, elle est la parfaite princesse de la Renaissance. Les rumeurs d'empoisonnement et d'intrigues impitoyables qui l'entourent sont un plus dans votre livre, car cela la rendrait encore plus apte à la mort. Vos agents attendent votre parole."
 podgreatpersons.0045.t:0 "Marco Polo"
 podgreatpersons.0045.desc:0 "Le monde caïnite est vaste et vous êtes toujours désireux d'en savoir plus sur les amis étranges, ou probablement les ennemis, que vous pourriez vous faire à l'étranger. Une opportunité s'est présentée avec un marchand vénitien nommé Marco Polo. Apparemment, l'homme qui mène actuellement une vie de famille tranquille a voyagé jusqu'à Cathay pendant plusieurs décennies. Il est probable qu'il ait recueilli des informations intéressantes ou des indices sur le monde nocturne à l'étranger pendant cette période. Évidemment, vous pourriez simplement lire ses notes, mais vous pourriez aussi faire bien mieux que cela ... Vos agents sont prêts à faire une visite au domaine Polo à votre commande."
 podgreatpersons.0046.t:0 "Margaret I"
 podgreatpersons.0046.desc:0 "Depuis près de 20 ans, la Bourgogne et la Flandre sont dirigées par Margaret Capet. La mort prématurée de son mari et sa forte influence sur son enfant ont fait d'elle une force avec laquelle il faut compter dans la région. Forte de sa volonté, elle n'est pas la plus gentille des dirigeants, comme peuvent en témoigner les nombreuses rébellions qui se sont levées et ont été écrasées pendant son règne. Pourtant, c'est une femme d'État capable avec un esprit capable de supporter les rigueurs de la non-mort et, en tant que telle, vous envisagez une opération audacieuse pour l'embrasser avant que la mort ne la réclame."
 podgreatpersons.0047.t:0 "Michael Scot"
 podgreatpersons.0047.desc:0 "Le conseiller scientifique et astrologue de la cour de l'empereur Frédéric II est un étrange Anglais nommé Michael Scot. Cet individu manifestement instruit est souvent accusé de magie noire car il semble en savoir plus sur le fonctionnement interne du monde que n'importe qui devrait. Pour autant que vous puissiez dire cependant, il n'est possédé par aucune force surnaturelle ... pour le moment. Sa connaissance du Ciel et de Dieu est d'un intérêt particulier pour vous, un être maudit par le Créateur lui-même, et vous vous demandez si Scot pourrait être un atout dans cette entreprise. Le séparer de la cour de l'empereur et simuler sa mort comme un accident ne serait pas facile, mais c'est en votre pouvoir."
 podgreatpersons.0048.t:0 "Mindaugas"
 podgreatpersons.0048.desc:0 "La Lituanie mortelle se convertit lentement au christianisme, comme de nombreux pays de l'Est l'ont fait auparavant. Ici, le processus est sanglant et impitoyable, les religions autochtones se battant contre les ordres sacrés. Un tournant a peut-être été atteint avec le couronnement de Mindaugas, le premier roi de Lituanie, avec son baptême dans l'Église. Loin d'être un fanatique, il a déjà changé de religion à plusieurs reprises en combattant les Tatars et les ducs rivaux pour la couronne. Bien que sans aucun doute cynique, Mindaugas a accompli beaucoup de choses militairement et administrativement et donc, lorsque vous apprenez un complot mortel pour le tuer pour une petite vengeance, vous considérez vos options. Embrasser un roi est toujours risqué, mais sa base de pouvoir est suffisamment faible pour que vous puissiez réussir."
 podgreatpersons.0049.t:0 "Niccolo Machiavelli"
 podgreatpersons.0049.desc:0 "Vous avez été fasciné par un manuscrit qui vous a été récemment offert. «Le Prince» est une étude parfaite de la politique et de la direction caïnites ... et il a été écrit par un simple mortel! Ce Machiavel est loin de recevoir la renommée que vous pensez qu'il mérite, son chef-d'œuvre étant déchiré par de petites préoccupations de «moralité» et de «juste règle». Si les mortels ne peuvent pas apprécier le génie derrière ce travail, vous pourriez certainement lui offrir une meilleure offre. Un contrat d'immortalité ..."
 podgreatpersons.0050.t:0 "Nicolaas Zannekin"
 podgreatpersons.0050.desc:0 "La Flandre est en proie à des révoltes paysannes depuis plusieurs années. C'est certainement une opportunité pour les Caïnites car, après tout, se nourrir est beaucoup plus facile en temps de guerre. Cette révolte spécifique dure étrangement, en ce qui concerne les querelles mortelles, et réussit étonnamment avec la capture de plusieurs villes et du comte lui-même. Vous ne doutez pas qu'il sera écrasé avec le temps mais ... cette endurance est le signe d'un bon chef qui ordonne aux paysans. Peut-être pourriez-vous demander à certains de vos agents de `` s'enquérir '' du chef rebelle lors de la prochaine bataille ..."
 podgreatpersons.0051.t:0 "Nikephoros Blemmydes"
 podgreatpersons.0051.desc:0 "La chute de Constantinople a entraîné la perte de nombreux grands savants. Certains, cependant, ont réussi à prospérer dans les conséquences chaotiques, comme Nikephoros Blemmydes. Enseignant, écrivain et théologien, il a élu domicile à Nikaea où l'empereur lui offre un large patronage. Il a déjà enseigné à de nombreuses grandes figures, comme le prince, et envisage de se retirer pour vivre sa vie plus tard dans la paix sereine d'un monastère. Ces balises de la culture romaine tardive deviennent de plus en plus rares à mesure que la fortune de l'empire diminue. En tant que tel, vous envisagez de lui offrir l'immortalité, pour en préserver au moins un petit morceau."
 podgreatpersons.0052.t:0 "Pons de Capduelh"
 podgreatpersons.0052.desc:0 "Les croisades ont été un coup terrible pour la région que vous dirigez, mais elles ont l'avantage de vous amener des gens intéressants. Un Pons de Capduelh par exemple, un troubadour d'Auvergne, fait depuis longtemps parler de votre cour. Un homme charmant et optimiste avec un esprit vif et un mot plus rapide, semble capable de captiver même le croisé le plus sévère dans des chansons audacieuses d'amour et de chevalerie. Un tel talent pourrait certainement avoir son utilité dans la politique caïnite, où une langue d'argent peut vous mener très loin."
 podgreatpersons.0053.t:0 "Rodrigo Borgia"
 podgreatpersons.0053.desc:0 "La papauté a toujours été un casse-tête pour les vampires, le pouvoir absolu de la Vraie Foi en rayonnant rendant toute incursion impossible. Cela a quelque peu changé avec l'actuel Pape, Alexandre VI, qui semble beaucoup plus préoccupé par les questions terrestres que par les préoccupations temporelles. Il y a aussi très bien réussi, étendant la zone d'influence des États pontificaux et le pouvoir de sa famille par des conquêtes et une diplomatie astucieuse. Sa spiritualité moins que stellaire vous permet une occasion unique dans une vie immortelle: vous pouvez envoyer des agents au Saint-Siège lui-même pour `` sauver '' Rodrigo Borgia, actuellement alité par une intoxication alimentaire ou un empoisonnement. Puis, une fois caché dans votre cour, vous auriez un pape pour vous tout seul ..."
 podgreatpersons.0054.t:0 "Roi Xordo"
 podgreatpersons.0054.desc:0 "La Galice est un pays en soi bien qu'elle soit gouvernée par le roi de Castille. Cette région isolée abrite des dirigeants très autocratiques, même selon les normes de l'époque. Ces nobles sont souvent insouciants avec la population commune et un point d'ébullition a été atteint il y a quatre ans, avec le début d'une révolte. Les rebelles sont dirigés par un Fidalgo mineur - un titre inférieur de noblesse - nommé Roi Xordo. L'homme a remporté quelques premiers succès, mais le vent tourne, alors que les troupes les plus expérimentées de la noblesse sévissent contre la rébellion. Bien qu'ils semblent voués à l'échec, leur chef pourrait peut-être encore vous être d'une certaine utilité. Un enfant passionné et militairement a son attrait ..."
 podgreatpersons.0055.t:0 "Skanderbeg"
 podgreatpersons.0055.desc:0 "Les Ottomans sont depuis longtemps une préoccupation majeure de l'Europe. La croisade vaincue de Varna et la chute de Constantinople ont ouvert la voie à une nouvelle expansion de leur part. Mais, depuis près de 25 ans maintenant, ils sont contrariés par un homme du nom de Skanderbeg, qui, avec un nombre dérisoire de troupes, a réussi à arrêter la puissante machine de guerre turque. Déjà salué comme un héros à travers l'Europe, le général âgé est à nouveau à la tête d'une nouvelle coalition mais une maladie mortelle s'est emparée de lui. Sans espoir de guérison, vous vous demandez si ce serait le bon moment pour le «sauver» et l'amener à votre cour. Après tout, ce serait dommage de perdre un défenseur aussi brillant."
 podgreatpersons.0056.t:0 "Snorri Sturluson"
 podgreatpersons.0056.desc:0 "L'Islande est une terre isolée, même pour d'autres Scandinaves, mais elle a attiré votre attention avec l'histoire d'un Snorri Sturluson, apparemment le politicien le plus puissant de l'île. Un érudit de la mythologie nordique, Snorri a navigué dans la politique chaotique islandaise et norvégienne pendant des décennies maintenant, mais il semble que le roi de Norvège en ait assez. L'un de vos agents rapporte qu'un complot d'assassinat est en cours contre le législateur islandais. Cela ne vous préoccupe guère, bien sûr, mais il y a la possibilité de sauver Snorri et de le ramener à votre cour si vous le souhaitez. Il pourrait faire un candidat intéressant pour l'étreinte."
 podgreatpersons.0057.t:0 "Subutai"
 podgreatpersons.0057.desc:0 "La Horde mongole a emporté tous ses ennemis de la Chine vers la Pologne. Politiquement, Gengis Khan est certainement le facteur principal mais militairement, Subutai, son principal stratège, est l'homme dans les coulisses. Ayant orchestré plus de 20 campagnes et remporté 65 batailles, le fidèle général est déjà célèbre dans les steppes. À 72 ans, Subutai a finalement décidé de se retirer du champ de bataille, vous offrant une occasion en or de l'embrasser sans les regards indiscrets de toute une armée."
 podgreatpersons.0058.t:0 "Teresa of Avila?"
 podgreatpersons.0058.desc:0 "Iberia est devenue assez inconfortable pour les vampires depuis le début de l'Inquisition espagnole. Vous avez essayé de nombreux petits et grands projets pour réduire l'influence de l'Église et cela fonctionnait assez bien jusqu'à ce que Teresa d'Avila arrive. Cette religieuse têtue a presque à elle seule réformé et ravivé la passion pour le christianisme dans le cœur des mortels d'Iberia. Vous avez mis de nombreux obstacles sur son chemin, y compris vos agents de l'Inquisition et de l'Église, en vain. Pour l'instant, vous laissez tomber l'affaire et vous couvrez vos traces. La dernière étape pour le faire est de «prendre soin» de votre légat papal de compagnie, Egidio Cajal, qui a fui votre rage depuis qu'il ne l'a pas arrêtée. Mais personne n'échappe à votre portée très longtemps ..."
 podgreatpersons.0059.t:0 "Theodore Metochites"
 podgreatpersons.0059.desc:0 "La politique romaine est inconstante et la fortune d'un homme peut facilement tourner. L'un de ces hommes est Theodore Metochites, le favori du défunt empereur Andronikos II. Savant, mécène des arts et diplomate de renom, Théodore doit l'essentiel de sa carrière à son talent personnel, mais aussi à son amitié avec les bonnes personnes. Quand Andronikos a été évincé du pouvoir, les Métochites ont perdu tout crédit à la cour et sont maintenant isolés dans un monastère pour vivre le reste de sa vie. Certains de vos courtisans pensent que la fin est un gaspillage criminel d'un homme talentueux, et vous pourriez intervenir, peut-être récupérer un enfant potentiel reconnaissant dans le processus."
 podgreatpersons.0060.t:0 "Theodora Palaiologina"
 podgreatpersons.0060.desc:0 "Constantinople a été reconquise par les vestiges romains après près de 60 ans de domination latine. Une période de restauration ardue est en cours, annoncée par l'impératrice elle-même, Theodora Palaiologina. Matriarche inébranlable de la famille impériale renouvelée, elle a résisté à de nombreuses tempêtes politiques et religieuses. La mort prématurée de son mari l'a laissée dans une position de pouvoir relatif qu'elle a utilisé pour inaugurer un sage patronage et des travaux architecturaux. Elle est un symbole puissant du retour au pouvoir des Grecs et vous savez que beaucoup de vos rivaux veulent interférer avec elle. Si vous souhaitez agir pour avoir ce symbole pour vous-même, le moment est venu."
 podgreatpersons.0061.t:0 "Theodor von Neuhoff"
 podgreatpersons.0061.desc:0 "Un personnage haut en couleur est récemment arrivé à Zutphen. Cet homme, Theodor von Neuhoff, est paralysé par des dettes qu'il a récupérées en vendant son titre de ... roi de Corse. En effet, suite à une rébellion de courte durée sur l'île génoise, les habitants ont «couronné» cet aventurier allemand comme futur roi. Un mandat qu'il n'a eu que quelques mois avant que son «Royaume» ne se brise en morceaux. Et maintenant, le voici, rien de plus qu'un escroc coloré ayant tout perdu. À tout le moins cependant, il fait une bonne histoire. Il y a eu pire enfant potentiel que celui qui pourrait vous amuser."
 podgreatpersons.0062.t:0 "Thibaut de Navarre"
 podgreatpersons.0062.desc:0 "Peu d'individus représentent mieux les idéaux chevaleresques que Thibaut de Navarre. Il a vécu des intrigues mortelles (et en a orchestré certaines), est parti pour une croisade réussie, a aimé une femme interdite (une reine rien de moins) et a écrit de nombreuses chansons en tant que «Trouvere» bien-aimé. Pendant tout ce temps, il a également réussi à gravir la hiérarchie féodale du comte de Champagne au roi de Navarre où il a eu un règne réussi. Vous avez appris récemment qu'au retour d'un voyage en Champagne, Thibault est tombé gravement malade et son escorte a ralenti. Cela pourrait être une occasion unique pour vos agents de «sauver» le roi mourant et de l'amener à votre cour. Un homme accompli comme lui est un candidat intéressant pour l'étreinte."
 podgreatpersons.0063.t:0 "Thomas Aquinas?"
 podgreatpersons.0063.desc:0 "Un de vos rivaux mineurs a lancé une attaque imprudente contre un manoir d'Aquino. Vous ne savez pas exactement pourquoi, il semble qu'il y avait des pions dans la famille là-bas, et qu'ils aient été soigneusement nettoyés par un membre de la maison nommé Thomas. Ce savant veut rejoindre l'Ordre dominicain et semble béni par un intellect superbe, travaillant déjà sur de nombreuses idées nouvelles pour l'Église. Dans tous les cas, sa Vraie Foi a brûlé votre rival à vif et vous vous retrouvez maintenant avec un désordre à affronter, car il y a eu de nombreux témoins. Thomas lui-même est inattaquable, mais vous pourriez commencer par faire «disparaître» sa mère. Vos agents pensent que la femme est en fait une candidate potentielle à l'étreinte, ayant utilisé des tactiques sournoises pour atteindre ses objectifs dans le passé."
 podgreatpersons.0064.t:0 "Thomas Muntzer"
 podgreatpersons.0064.desc:0 "La Réforme bat son plein et si, comme au début, elle est apparue comme une bonne chose pour les vampires avec l'affaiblissement de l'Église, il y a maintenant encore plus d'hommes saints que jamais auparavant. Tous les efforts de votre part pour les écraser n'ont au mieux pas été concluants. Un prédicateur nommé Thomas Muntzer vous cause particulièrement des problèmes avec sa création d'une «ligue éternelle de Dieu», principalement un nombre croissant de paysans rebelles. Son discours zélé sur une Apocalypse à venir vous énerve et vous envisagez d'envoyer certains de vos agents lors de sa prochaine bataille pour l'amener à votre cour. Ensuite, vous pouvez lui montrer le vrai visage de l'enfer ..."
 podgreatpersons.0065.t:0 "Timur?"
 podgreatpersons.0065.desc:0 "Le seigneur de guerre connu sous le nom de Timur a été un problème majeur pour vous depuis qu'il a commencé son chemin impitoyable de conquêtes. Héritier autoproclamé de l'héritage de Gengis Khan, personne n'a pu se mettre en travers de son chemin jusqu'à présent et ses guerres ont abouti à d'innombrables villes pillées et incendiées, ce qui n'est pas vraiment une bonne chose pour les terrains de chasse d'un vampire. Alors que les réfugiés caïnites commencent à semer le trouble dans votre tribunal, vous envisagez une solution possible. Jusqu'à présent, toutes les tentatives pour le capturer ou le tuer ont échoué, comme s'il était protégé par une force surnaturelle. Une autre solution consisterait à enlever sa femme préférée et son plus proche conseiller. Avec un peu de chance, cela pourrait le ralentir un peu. Dans le pire des cas, elle est connue pour être talentueuse et belle, deux qualités intéressantes pour une étreinte potentielle."
 podgreatpersons.0066.t:0 "Tomas de Torquemada"
 podgreatpersons.0066.desc:0 "L'Inquisition bat déjà son plein depuis un certain temps dans le monde de la nuit. Mais, récemment, il a recueilli suffisamment de soutien pour se propager dans le royaume des mortels, l'Inquisition espagnole étant officiellement reconnue par le pape. Cela a rendu la non-vie des Caïnites en Ibérie encore plus difficile et vos sujets vous rabaissent pour ne pas «faire assez». L'Inquisition est bien trop puissante pour être abattue maintenant, mais une frappe chirurgicale contre son chef, Tomas de Torquemada, pourrait être une victoire morale sur laquelle vous pourriez capitaliser. Encore plus si vous pouviez l'embrasser d'une manière ou d'une autre ..."
 podgreatpersons.0067.t:0 "Ulrich von Liechtenstein"
 podgreatpersons.0067.desc:0 "Une nouvelle mode arrive sur ces mortels inconstants, «Courtly Love» avec des histoires de chevaliers en armure brillante et une romance chaste avec des femmes mariées. Comme toutes les choses liées aux mortels, cela ne survivra pas à l'épreuve du temps mais jusque-là ... il est toujours bon de comprendre leur fantaisie actuelle. Vos agents recommandent l'aide d'un Ulrich von Liechtenstein, un chevalier et poète itinérant d'une certaine renommée connu comme un modèle de chevalerie. L'homme a une langue argentée et un bras d'épée solide et pourrait vous être utile à plus d'un titre."
 podgreatpersons.0068.t:0 "Vasco da Gama"
 podgreatpersons.0068.desc:0 "Les contacts avec l'Europe se multiplient ces derniers temps, avec les voyages d'un explorateur portugais nommé Vasco da Gama. Bien que l'homme parle de commerce riche et de grandes alliances, ses actions disent le contraire. Il a massacré les civils d'un navire musulman itinérant, et s'est vengé avec une armada complète contre une prétendue attaque du roi de Zamorin. Il est clair maintenant que les Portugais arrivent avec une mentalité de conquérant et doivent recevoir une leçon. Capturer et embrasser l'impitoyable «vice-roi de l'Inde» servirait d'avertissement à tout Caïnite européen essayant d'empiéter sur votre patrie."
 podgreatpersons.0069.t:0 "Wat Tyler"
 podgreatpersons.0069.desc:0 "Il y a une aura d'anticipation sur le résultat de la rencontre entre le roi Richard II et Wat Tyler, tous deux accueillant une sorte de conférence de paix entre les nobles et la révolte des paysans. Tyler a été le plus têtu des chefs rebelles, refusant toute concession faite par le roi jusqu'à présent. Vous êtes à peu près sûr que de nombreuses personnalités caïnites importantes se rassemblent dans l'ombre de la réunion, en particulier autour de l'amant de Tyler, une Patricia de Bollingbroke. En tant que tel, vous souhaitez envoyer certains de vos propres agents sur place, pour vous assurer de ne pas prendre de retard sur les projets de vos concurrents. La seule chose qui reste est la question de la liberté d'action de vos agents. Leur enverrez-vous suffisamment de ressources et d'argent pour attraper un «prix» de l'événement, ou simplement leur ordonner de regarder?"
 podgreatpersons.0070.t:0 "William Wallace"
 podgreatpersons.0070.desc:0 "Alors que la guerre pour l'indépendance écossaise fait rage, les Écossais ont perdu l'un de leurs principaux commandants. William Wallace était tombé en disgrâce après sa défaite à Falkirk, mais restait toujours l'un des «Gardiens de l'Écosse» et un symbole puissant pour son peuple. Insaisissable depuis Falkirk, Wallace a été vu voyager à travers l'Europe pour recueillir le soutien de sa cause jusqu'à son retour en Angleterre, où il a été récemment capturé. Un procès a commencé, dont le verdict ne surprendra personne. Les Écossais endureront probablement et se rallieront derrière leur martyr mais ce serait dommage de perdre un homme aussi déterminé. Vous pourriez tirer quelques ficelles et organiser un remplacement avant son exécution. Alors, il serait tout à toi ..."
 podgreatpersons.0071.t:0 "Nagash"
 podgreatpersons.0071.desc:0 "Un vieil homme dérangé a fait des histoires en Egypte ces derniers temps. Cet individu prétend être le «premier immortel» et l'empereur de «Nehekhara». Il raconte que l'un de ses sorts a terriblement mal tourné et l'a atterri dans «notre monde». La chose étrange est qu'il connaît les vampires, même s'il a de curieuses idées fausses à leur sujet (il est catégorique sur le fait qu'il n'y a que 5 «lignées»). Dans tous les cas, il est une responsabilité, car il est clairement plein de lui-même et pourrait attirer une attention indésirable sur nous. En tant que tel, vous pouvez envoyer certains de vos agents pour l'amener à votre tribunal et traiter avec lui vous-même."
 podgreatpersons.0072.t:0 "Sa'ad al-Dawla"
 podgreatpersons.0072.desc:0 "Un homme d'État juif s'est fait connaître très largement récemment. Sa'ad est né d'humbles origines et sa maîtrise étonnante des affaires de l'État a fait de lui un atout inestimable à la cour du Khan mongol. Également réputé pour ses vastes connaissances médicales et son patronage des arts, ce grand vizir juif a encore un gros défaut: son arrogance. \nSes ennemis sont nombreux, des fonctionnaires mongols fouettés pour corruption aux musulmans se sentant gênés par un étranger. Protégé par le Khan, Sa'ad a jusqu'ici gardé une longueur d'avance mais sa chance s'épuise, car son patron est récemment tombé malade. Le nombre de stratagèmes qui ont commencé à l'assassiner est même impressionnant selon la norme caïnite. En tant que tel, si vous voulez agir et le retirer de la politique mortelle, c'est maintenant le moment. Un tel homme ferait sûrement un bon candidat."
 Sa_ad_al_Dawla:0 "Sa'ad al-Dawla"
 Abu_al_Baqa_ar_Rundi:0 "Abu al-Baqa ar-Rundi"
 podgreatpersons.0073.t:0 "Abu al-Baqa ar-Rundi"
 podgreatpersons.0073.desc:0 "Alors que les villes d'al-Andalus tombent une à une dans la reconquête chrétienne, l'héritage d'un âge d'or tombe avec elles. Un écrivain sévillan s'est chargé d'immortaliser la gloire des villes perdues. \n Son poème, écrit dans la tradition classique du Ritha, est connu sous le nom de «An Elegy to al-Andalus» et a été largement acclamé dans les royaumes maghrébins où il a fui en tant que réfugié. \nMalgré cela, peu de soutien réel pour aider les Andalous a été recueilli, et Abu al-Baqa est maintenant un vieil homme fatigué qui ne verra probablement pas son rêve se réaliser. À moins que vous ne lui donniez une éternité pour comploter et préparer sa vengeance ..."
 Sheikh_Bedreddin:0 "Sheikh Bedreddin"
 podgreatpersons.0074.t:0 "Sheikh Bedreddin"
 podgreatpersons.0074.desc:0 "Le sultanat ottoman souffre d'une explosion massive de révoltes. Bien que la situation militaire semble se résoudre en faveur du sultan, vous vous intéressez au chef des rebelles. \nCe personnage complexe, Cheikh Bedreddin, est avant tout un théologien prêchant la propriété communautaire de la propriété et l'égalité des chrétiens et Les musulmans. Il n'est pas en reste non plus en matière militaire, ayant été le juge militaire en chef du prince ottoman Musa. Un état d'esprit révolutionnaire est quelque chose de dangereux à avoir dans la politique lente des vampires, mais vous entretenez toujours l'idée de vous assurer que ce rebelle se retrouve à votre merci ..."
 Alauddin_Ali_Shah:0 "Alauddin Ali Shah"
 podgreatpersons.0075.t:0 "Alauddin Ali Shah"
 podgreatpersons.0075.desc:0 "Le Bengale a récemment été le théâtre d'une lutte de pouvoir acharnée entre trois princes, en lice pour le contrôle du sultanat. Cette guerre vous a intéressé en raison de l'ambition impitoyable d'un belligérant, Alauddin Ali Shah. \nCet homme, déjà évincé une fois d'une position de pouvoir, a tué et usurpé sa base de pouvoir actuelle avec une efficacité froide. Il est difficile de dire s'il sera en mesure de répéter cet exploit dans la guerre actuelle, mais un chef aussi habile et impitoyable pourrait être utile à votre cour ..."
 Birger_Jarl:0 "Birger Jarl"
 podgreatpersons.0076.t:0 "Birger Jarl"
 podgreatpersons.0076.desc:0 "Homme d'État accompli, tant dans la diplomatie que dans la guerre, Birger Jarl est la véritable puissance en Suède depuis plusieurs décennies. Utilisant habilement l'Église pour promouvoir ses propres objectifs, il a limité le pouvoir de la plupart des magnats, ouvrant la voie à un royaume de Suède centralisé fort à l'avenir. \nCependant, l'homme n'est pas seulement alimenté par la guerre et l'ambition, comme ses enquêtes sur la fondation d'une nouvelle ville dans un endroit reculé appelé «Stockholm» ont porté leurs fruits. L'âge le rattrape enfin, et le duc éponyme de Suède pourrait bientôt connaître son destin ultime. À moins que vous ne prévoyiez un autre destin pour lui ..."
 Zawisza_Czarny:0 "Zawisza Czarny"
 podgreatpersons.0077.t:0 "Zawisza Czarny"
 podgreatpersons.0077.desc:0 "Vous avez suivi la carrière d'un Zawisza Czarny avec beaucoup d'intérêt. Ce chevalier polonais connu pour son talent au combat et sa bravoure est une cible alléchante depuis longtemps maintenant. \nVainqueur de nombreux tournois, chef des forces militaires et même diplomate lorsque le temps des mots arrive, Zawisza possède de nombreux talents utiles qui vous avez hâte de vous en servir. Il a récemment qualifié son roi de lâche pour avoir fui dans la bataille contre les Turcs ottomans et prévoit de continuer la guerre par lui-même. Un geste courageux, si suicidaire. Maintenant retiré de la cour royale et de la plupart de l'armée, ce serait le bon moment pour vous de frapper."




