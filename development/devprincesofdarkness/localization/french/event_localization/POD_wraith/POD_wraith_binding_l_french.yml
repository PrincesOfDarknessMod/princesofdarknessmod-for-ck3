l_french:
 POD_wraith_binding.100.t:0 "Les attaches de la magie et de la volonté."
 POD_wraith_binding.100.desc:0 "Tout en poursuivant vos activités normales en tant que spectateur, vous ressentez une puissante attraction vers un lieu inconnu. Quelqu'un dérange votre connexion avec le monde des mortels!\n En arrivant dans une chambre d'invocation, vous rencontrez votre invocateur - un nécromancien nommé [actor.GetFirstNameNoTooltip]. Déjà, le rituel de liaison commence à vous affecter et à déformer votre être."
 POD_wraith_binding.100.option.a:0 "JE. NE PAS. ÊTRE. CONTRÔLÉ!"
 POD_wraith_binding.100.option.b:0 "Résistez, bien sûr."
 POD_wraith_binding.100.option.c:0 "La résistance est vaine ... Vengeance !!! mais pour plus tard..."
 
 POD_wraith_binding.200.t:0 "Les attaches de la magie et de la volonté."
 POD_wraith_binding.200.desc:0 "Le terrain rituel prêt, vous invoquez la magie noire de l'abîme et attirez le spectre cible vers votre cercle préparé. \n À travers un trou dans la réalité mortelle vient [recipient.GetFirstNameNoTooltip], visage tordu de douleur et de rage. Maintenant que le fantôme est là, il est temps de le relier."
 POD_wraith_binding.200.wp:0 "Continuez quand même."
 POD_wraith_binding.200.wp.tt_willpower:0 "[recipient.GetFirstNameNoTooltip] a exercé sa volonté de mieux cacher [recipient.GetHerHis] mouvements et conversations."
 POD_wraith_binding.200.blood.tt_success:00 "Succès"
 POD_wraith_binding.200.wp.success.desc:0 "Victoire"
 POD_wraith_binding.200.wp.tt_success:0 "[recipient.GetTitledFirstName] doit m'obéir!"
 POD_wraith_binding.200.wp.failure.desc:0 "Défaite"
 POD_wraith_binding.200.blood.tt_failure:0 "Echec"
 POD_wraith_binding.200.wp.tt_failure:0 "[recipient.GetTitledFirstName] a résisté à ma tentative de liaison."
 POD_wraith_binding.200.option.wp:0 "Exerce ma volonté. je serai [recipient.GetHerHis] maître!"
 POD_wraith_binding.200.blood:0 "Exerce ma volonté et mon sang. L'abîme m'accordera le pouvoir sur la mort et les morts."
 
 POD_wraith_binding.200.option.c:0 "Abandonner cet effort, je ne souhaite plus lier [recipient.GetHerHim]."
 POD_wraith_binding.200.option.c.tt:0 "La tentative échouera."
 
 
 POD_wraith_binding.300.t:0 "[recipient.GetFirstNameNoTooltip] lié."
 POD_wraith_binding.300.desc:0 "J'ai réussi à invoquer les terribles pouvoirs de l'oubli pour forcer [recipient.GetTitledFirstName] à un service éternel. La question est de savoir quelle est la solidité de la liaison?"
 POD_wraith_binding.300.option.a:0 "Tout se passe comme il se doit."
 POD_wraith_binding.300.twolevels:0 "La puissance de la liaison sera augmentée de deux niveaux!"
 POD_wraith_binding.300.threelevels:0 "La puissance de la liaison sera augmentée de trois niveaux!"

 POD_wraith_binding.400.t:0 "Liaison!"
 POD_wraith_binding.400.desc:0 "Malgré vos efforts pour combattre les puissances obscures de [actor.GetTitledFirstName],la magie vous a forcé à devenir un esclave réticent à [actor.GetHerHim]." 
 POD_wraith_binding.400.option.a:0 "Mon indépendance ... Perdue."
 
 POD_wraith_binding.500.t:0 "Échec de la liaison"
 POD_wraith_binding.500.desc:0 "[recipient.GetTitledFirstName] a résisté à ma tentative de lier [recipient.GetHerHim]." 
 POD_wraith_binding.500.option.a:0 "Contrarié!"


 POD_wraith_binding.600.t:0 "Liaison déjouée"
 POD_wraith_binding.600.desc:0 "[actor.GetTitledFirstName] a abandonné [actor.GetTitledHerHis] de tenter de vous forcer à entrer en service." 
 POD_wraith_binding.600.option.a:0 "Ma liberté est sauf!"
 
 
 