l_french:

 POD_wraith_possession.100.t:0 "Possession"
 POD_wraith_possession.100.desc:0 "[actor.GetTitledFirstName] essaie de vous posséder. Vous remarquez que certaines parties de votre corps bougent d'elles-mêmes, des pensées que vous ne devriez pas avoir. Il est peut-être temps d'appeler un exorciste? "
 POD_wraith_possession.100.option.a:0 "Exercez ma volonté et luttez pour mon corps."
 POD_wraith_possession.100.option.b:0 "Résistez à l'intrus."
 POD_wraith_possession.100.option.c:0 "Acceptez la possession."
 
 POD_wraith_possession.200.t:0 "Posséder [recipient.GetFirstNameNoTooltip]"
 POD_wraith_possession.200.desc:0 "Le moment est venu de prendre le contrôle du corps de [recipient.GetTitledFirstName], mais [recipient.GetSheHe] résiste."
 POD_wraith_possession.200.option.a:0 "Continuez quand même."
 POD_wraith_possession.200.a.tt_willpower:0 "[recipient.GetFirstNameNoTooltip] a exercé sa volonté de résister à votre intrusion."
 POD_wraith_possession.200.a.tt_fortitude:0 "[recipient.GetFirstNameNoTooltip] est doué dans la discipline de Fortitude et résiste à votre manipulation."
 POD_wraith_possession.200.a.success.desc:0 "Victoire"
 POD_wraith_possession.200.a.tt_success:0 "le corps de [recipient.GetTitledFirstName] sera mien!"
 POD_wraith_possession.200.a.failure.desc:0 "Défaite"
 POD_wraith_possession.200.a.tt_failure:0 "[recipient.GetTitledFirstName] résiste à ma tentative de posséssion."
 
 POD_wraith_possession.200.option.b:0 "Exerce ma volonté. Tous les mortels sont des marionnettes pour moi."
 POD_wraith_possession.200.option.c:0 "Abandonner cette entreprise, je ne souhaite plus prendre le contrôle de [recipient.GetTitledFirstName]."
 POD_wraith_possession.200.option.c.tt:0 "La possession échouera."

 
 POD_wraith_possession.300.t:0 "Le corps de [recipient.GetFirstNameNoTooltip] a été possédé"
 POD_wraith_possession.300.desc:0 "Vous avez renforcé votre maîtrise du corps de [recipient.GetTitledFirstName]. Cette marionnette vous appartient désormais."
 POD_wraith_possession.300.option.a:0 "Tout est comme il se doit."


 POD_wraith_possession.400.t:0 "Tu as été possédé"
 POD_wraith_possession.400.desc:0 "Ayant perdu la bataille des volontés pour [actor.GetTitledFirstName], vous perdez un autre degré de contrôle." 
 POD_wraith_possession.400.option.a:0 "Mon corps n'est plus le mien."
 
 POD_wraith_possession.500.t:0 "Résistance à la possession"
 POD_wraith_possession.500.desc:0 "[recipient.GetTitledFirstName] a résisté à ma tentative de [recipient.GetHerHim] posséder." 
 POD_wraith_possession.500.option.a:0 "Malédiction !"


 POD_wraith_possession.600.t:0 "Résistance à la possession"
 POD_wraith_possession.600.desc:0 "[actor.GetTitledFirstName] a abandonné [actor.GetTitledHerHis] pour essayer d'envahir votre corps." 
 POD_wraith_possession.600.option.a:0 "Mon corps est le mien!"

 

