l_french:
 POD_vampire_masquerade_breach.100.title:0 "Brèche dans la Mascarade"
 POD_vampire_masquerade_breach.100.desc:0 "[mortal.GetTitledFirstName] vous a vu violer le Silence du Sang, vous révélant comme un vampire. La Mascarade a été violée. Que doit-on en faire ?"
 POD_vampire_masquerade_breach.100.a:0 "Le faire oublier."
 POD_vampire_masquerade_breach.100.b:0 "L'ignorer pour le moment."
 POD_vampire_masquerade_breach.100.c:0 "Le soudoyer pour ne rien dire."
 POD_vampire_masquerade_breach.100.d:0 "Le tuer."
 POD_vampire_masquerade_breach.100.e:0 "Siphonner le sang de [mortal.GetTitledFirstName], et le tuer. "
 POD_vampire_masquerade_breach.100.d.tt.beast:0 "#R La proie a senti le prédateur - frappez maintenant, de peur que vous ne deveniez vous-même une proie."
 POD_vampire_masquerade_breach.100.e.tt.beast:0 "#R D'une pierre deux coup" 
 POD_vampire_masquerade_breach.100.d.notwounded:0 "vous venez à bout du mortel chétif indemne"
 POD_vampire_masquerade_breach.100.d.wounded:0 "Le mortel devient... Gênant"
 POD_vampire_masquerade_breach.100.d.woundedtoast:0 "Avant de mourir, [mortal.GetTitledFirstName] a réussi à vous blesser."
 POD_vampire_masquerade_breach.100.d.woundedtoastitle:0 "Blesser"

 POD_vampire_masquerade_breach.300.title:0 "Brèche dans la Mascarade"       
 POD_vampire_masquerade_breach.300.desc:0 "[mortal.GetTitledFirstName] vous a vu violer le Silence du Sang, vous révélant comme un vampire. La Mascarade a été violée. Que doit-on en faire ?"
 POD_vampire_masquerade_breach.300.a:0 "Faire oublier [mortal.GetTitledFirstName]."
 POD_vampire_masquerade_breach.300.b:0 "Ignorer [mortal.GetTitledFirstName] pour le moment. "
 POD_vampire_masquerade_breach.300.c:0 "Soudoyez [mortal.GetTitledFirstName] pour ne rien dire."
 POD_vampire_masquerade_breach.300.d:0 "Tuer [mortal.GetTitledFirstName]."
 
 POD_vampire_masquerade_breach.400.title:0 "Brèche dans la Mascarade"
 POD_vampire_masquerade_breach.400.desc:0 "[vampire_exposes_masquerade.GetTitledFirstName] a violé le Silence du Sang, se révélant comme un vampire. La mascarade a été violée. Que doit-on faire avec [vampire_exposes_masquerade.GetFirstName]?"
 POD_vampire_masquerade_breach.400.a:0 "Pardonner [vampire_exposes_masquerade.GetTitledFirstName] pour une faveur."
 POD_vampire_masquerade_breach.400.b:0 "Pardonner [vampire_exposes_masquerade.GetTitledFirstName]."
 POD_vampire_masquerade_breach.400.c:0 "Ordonnez à mes sbires d’arrêter [vampire_exposes_masquerade.GetTitledFirstName]."
 POD_vampire_masquerade_breach.400.d:0 "Ceci n’est ni pardonné ni oublié [vampire_exposes_masquerade.GetTitledFirstName]."
 POD_vampire_masquerade_breach.400.c.Arrest:0 "[vampire_exposes_masquerade.GetTitledFirstName] est amené à mon donjon dans les chaînes."
 POD_vampire_masquerade_breach.400.c.ArrestNotificationtitle:0 "Brèche contenue"
 POD_vampire_masquerade_breach.400.c.ArrestNotification:0 "[vampire_exposes_masquerade.GetTitledFirstName] est emprisonné."
 POD_vampire_masquerade_breach.400.c.Escape:0 "[vampire_exposes_masquerade.GetTitledFirstName] s'est évadé."
 POD_vampire_masquerade_breach.400.c.EscapeNotificationtitle:0 "[vampire_exposes_masquerade.GetTitledFirstName] Evasion !"
 POD_vampire_masquerade_breach.400.c.EscapeNotification:0 "Vos sbires n’ont pas réussi à emprisonné [vampire_exposes_masquerade.GetTitledFirstName]. #R Weaklings."

 POD_opinion_breached_masquerade:0 "A ébréché la Masquerade"
 POD_masquerade_breach:0 "Brèche dans la Mascarade"
 POD_masquerade_breach_desc:0 "Un vampire a violé le Silence du Sang. La Mascarade a été ébréché."
 
 trait_POD_knows_too_much:0 "En sait trop"
 trait_POD_knows_too_much_desc:0 "Ce mortel a vu un aperçu du surnaturel et a survécu... pour l’instant."
 
 
 

