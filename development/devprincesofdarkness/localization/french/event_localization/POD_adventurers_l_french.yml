l_french:

 PODadventurers.1001.t:0 "Problèmes à venir"
 PODadventurers.1001.desc:0 "Des rapports récents de vos agents rapportent des histoires d'un jeune nouveau-né du nom de Giangaleazzo. Ce jeune semble avoir de grandes ambitions et, au lieu de vous montrer le respect comme il se doit, il semble rassembler des soutiens dans le nord de l'Italie dans un but inconnu. Jusqu'à présent, il s'est avéré trop intelligent et insaisissable à attraper, ce qui est en soi préoccupant ..."
 PODadventurers.1001.a:0 "J'ai un mauvais pressentiment à propos de ça..."
 PODadventurers.1001.player_warning:0 "Soyez prêt, vous en entendrez bientôt plus sur lui."
 PODadventurers.1002.t:0 "Le Prince: Giangaleazzo"
 PODadventurers.1002.desc:0 "«Je ne suis pas un homme passionné. Certes, je considère Milan comme mon droit d'aînesse, puisque j'étais son duc il y a longtemps et, c'est également vrai, l'Italie occupera toujours une place spéciale dans mon cœur froid. Mais César a-t-il stoppé ses ambitions dans une ville? Une nation, même? Je ne suis pas en train de conquérir des terres et des titres dans un but plus élevé ou même pour le plaisir. Pas du tout. Il n'y a pas de religions, pas de philosophies et pas d'émotions, il n'y a que le Jeu. Surpasser votre adversaire, regarder ses plans s'effondrer avant même qu'il ne connaisse votre nom, l'obliger à trahir tout ce qui lui tient à cœur… C'est tout le but de notre existence. N'oubliez pas qu'il y a toujours un meilleur joueur que vous. Quelqu'un à regarder, à apprendre, puis à écraser. Et au sommet de la pyramide ..? Eh bien, je vous verrai là-bas, à condition que vous surviviez assez longtemps. »"
 PODadventurers.1002.a:0 "Il est temps d'enseigner une certaine humilité à cet arrogant Visconti!"
 PODadventurers.1002.a.target.tt:0 "Tu traiteras avec lui le moment venu"
 PODadventurers.1002.a.not_target.tt:0 "Votre lige est maintenant en guerre avec Giangaleazzo"
 PODadventurers.1002.b:0 "Je veux cet homme de mon côté, quel qu'en soit le prix!"
 PODadventurers.1002.b.custom:0 "Vous vassaliserez l'ambitieux Visconti. Cela vous coûtera cher à réussir et il ne vous en sera reconnaissant que pour un temps ..." 
 POD_giangaleazzo.notification:0 "Le prince fait son mouvement"
 POD_giangaleazzo.desc:0 "En Italie, Giangaleazzo Visconti, un Lasombra ambitieux, a lancé une campagne de conquête. Va-t-il secouer le vieux centre de l'Empire?"
 PODadventurers.1011.t:0 "Problèmes à venir"
 PODadventurers.1011.desc:0 "La rébellion de Wat Tyler fait rage dans toute l'Angleterre et il a également commencé à avoir un impact sur le monde caïnite. Les rumeurs d'un acolyte parmi ses vampires tournés se multiplient, cet acolyte étant déterminé à lancer une sorte de rébellion plus ... nocturne." 
 PODadventurers.1011.a:0 "J'ai un mauvais pressentiment à propos de ça..."
 PODadventurers.1011.player_warning:0 "Soyez prêt, vous en entendrez bientôt plus à ce sujet."
 PODadventurers.1012.t:0 "Le rebelle: Tyler"
 PODadventurers.1012.desc:0 "La rébellion de Wat Tyler a été un ennui pour les Caïnites anglais, mais il semble que ses effets d'entraînement ne font que commencer. Un jeune Brujah, Patricia de Bollingbroke, a pris le nom du rebelle et a commencé à éveiller de jeunes Caïnites désabusés et d'autres gens. La femme ardente semble déterminée à mettre fin aux tyrans, qu'ils soient mortels ou non. Alors qu'elle a pris sa première ville et que d'autres se rallient à ses côtés chaque nuit qui passe, les seigneurs d'Angleterre ont le choix de la façon de traiter avec elle. Sera-ce le gant de velours ou le poing de fer?"
 PODadventurers.1012.a:0 "Un autre rebelle, un autre échec voué à être bientôt écrasé"
 PODadventurers.1012.a.target.tt:0 "Tu t'occuperas d'elle le moment venu"
 PODadventurers.1012.a.not_target.tt:0 "Votre lige est maintenant en guerre avec Tyler"
 PODadventurers.1012.b:0 "Eh bien ... elle a quelques bons points ... et une grande armée"
 PODadventurers.1012.b.custom:0 "Tyler ne pliera le genou que si vous vous joignez à sa cause. Une proposition très insultante certes, mais vous gagneriez également un allié puissant." 
 PODadventurers.1012.c:0 "Nous sommes du même côté!"
 POD_tyler.notification:0 "Le rebelle la fait bouger"
 POD_tyler.desc:0 "En Angleterre, Patricia de Bollingbroke se lève contre des tyrans dans une tentative de liberté probablement vouée à l'échec ... ou est-ce la première véritable étincelle d'une grande révolution?"
 PODadventurers.1021.t:0 "Problèmes à venir"
 PODadventurers.1021.desc:0 "Des rumeurs vous sont parvenues selon lesquelles Vlad Tepes, le souverain déjà célèbre de Valachie, s'est renseigné sur le monde caïnite. D'une manière ou d'une autre, il a appris l'existence de votre espèce et semble s'y intéresser." 
 PODadventurers.1021.a:0 "J'ai un mauvais pressentiment à propos de ça..."
 PODadventurers.1021.player_warning:0 "Soyez prêt, vous en entendrez bientôt plus à ce sujet."
 PODadventurers.1022.t:0 "L'Empaleur: Vlad Tepes"
 PODadventurers.1022.desc:0 "Le dirigeant mortel de Valachie, Vlad Tepes Draculesti, s'est montré à maintes reprises doté d'une volonté indomptable. Il refusait d'être embrassé uniquement à ses propres conditions et en savait beaucoup plus sur la condition vampirique que de nombreux anciens avant même d'en devenir un. Les premières années de sa non-vie étaient enflammées de rumeurs. Qui était son père? Avait-il vraiment trouvé la cathédrale de chair et était-il resté indemne? Où est son allégeance? Ces questions restent sans réponse, mais le soi-disant Dracula semble en avoir assez d'errer. Le Tzimisce, un simple jeune, a rassemblé une foule impressionnante de vampires, de goules et de soldats de son temps mortel et a terminé sa première conquête. Maintenant, il vient devant vous avec une offre, reconnaissez-le comme votre protégé et vous pourriez commencer une relation mutuellement bénéfique. Refusez et ... eh bien, la menace présentée par un tel individu n'a pas besoin d'explication."
 PODadventurers.1022.a:0 "Un parvenu est toujours un parvenu, même avec un surnom sophistiqué"
 PODadventurers.1022.a.target.tt:0 "Tu traiteras avec lui le moment venu"
 PODadventurers.1022.a.not_target.tt:0 "Votre lige est maintenant en guerre avec Dracula"
 PODadventurers.1022.b:0 "Une offre que je ne peux pas refuser"
 PODadventurers.1022.b.custom:0 "Bien qu'il serait coûteux de reconnaître la menace posée par un simple jeune, avoir le célèbre Dracula comme enfant adopté est une offre alléchante. À tout le moins, cela vous ferait probablement gagner du temps avant qu'il ne se retourne contre vous ..." 
 POD_vlad.notification:0 "L'Empaleur fait son mouvement"
 POD_vlad.desc:0 "En Transylvanie, Vlad Tepes poursuit sa sanglante carrière, cette fois en tant que mort-vivant. Un nouveau Seigneur de la Nuit pour la terre au-delà de la forêt?"
 first_giangaleazzo_event_troops:0 "Condottieri de Giangaleazzo"
 first_tyler_event_troops:0 "Les rebelles de Tyler"
 first_vlad_event_troops:0 "Empaleurs de Vlad"