l_french:

 POD_diablerize.100.t:0 "Diablerie : [diablerie_location.GetNameNoTooltip]"
 POD_diablerize.100.desc:0 "J’ai suivi [defender.GetFirstName] vers sa tannière dans [diablerie_location.GetNameNoTooltip]. Tout est prêt, et maintenant je peux enfin l'attaquer pour drainer tout son sang et même de son âme! Le risque personnel est considérable, mais les récompenses sont plus grandes. Dois-je aller jusqu’au bout et lancer mon attaque la plus meurtrière sur [defender.GetFirstName] ?"
 POD_diablerize.100.option.a:0 "Attaquer [defender.GetTitledFirstName] !"
 POD_diablerize.100.option.a.tt:0 "Une lutte s’ensuivra, si je perds, je pourrais aussi être détruit. J’utiliserai toute ma volonté et les pouvoirs du sang pour réussir."  
 POD_diablerize.100.option.a.tt.beast:0 "#R Attaquer ! Nous aurons le sang du son cœur !#"   
 POD_diablerize.100.option.b:0 "Abandonner cette infâme quête."
 POD_diablerize.100.option.b.tt.beast:0 "#R Nous savons qu'[defender.GetSheHe] est faible. Je peux le sentir! Ne vous retournez pas maintenant!#"    
     
 POD_diablerize.200.t:0 "Une attaque mortelle !"
 POD_diablerize.200.desc:0 "[attacker.GetFirstName] m’a pris seul dans [diablerie_location.GetNameNoTooltip]. Ses yeux brillent de la faim de la Bête ! Que dois-je faire ?"
 POD_diablerize.200.option.a:0 "Fuyez !"
 POD_diablerize.200.option.a.tt.beast:0 "#R Fuyez, pauvres fous !#"
 POD_diablerize.200.option.a.tt:0 "Un duel de manoeuvre martial déterminera si vous pouvez échapper à l’attaque de [attacker.GetFirstName]."
 POD_diablerize.200.option.a.desc:0 "Un concours de manoeuvre"
 POD_diablerize.200.option.a.success:0 "[defender.GetFirstName] gagne"
 POD_diablerize.200.option.a.tt.defender_wins:0 "Je me suis échappé"
 POD_diablerize.200.option.a.tt.celerityadvanced:0 "J’ai une célérité avancée !"
 POD_diablerize.200.option.a.tt.potenceadvanced:0 "J’ai une puissance avancée !"
 POD_diablerize.200.option.a.tt.blink:0 "Je peux bouger en un clin d’œil."
 POD_diablerize.200.option.a.tt.traversal:0 "Je peux courir sur les murs et sur l’eau."
 POD_diablerize.200.option.a.tt.soaring_leap:0 "Je peux faire des bonds en flèche."
 POD_diablerize.200.option.a.tt.uncanny_grip:0 "J’ai une prise étrange."
 POD_diablerize.200.option.a.failure:0 "[attacker.GetFirstName] gagne"
 POD_diablerize.200.option.a.tt.attacker_wins:0 "[attacker.GetFirstName] m'a attrapé"
 POD_diablerize.200.option.b:0 "Cachez-vous !"
 POD_diablerize.200.option.b.tt:0 "Un duel intriguant de dissimulation et de recherche déterminera si vous pouvez échapper à l’attaque de [attacker.GetFirstName]."
 POD_diablerize.200.option.b.desc:0 "Un concours de cache-cache"
 POD_diablerize.200.option.b.tt.beast:0 "#R La nuit sera notre armure !#"
 POD_diablerize.200.option.b.tt.obfuscateadvanced:0 "J'ai une occultation avancée !"
 POD_diablerize.200.option.b.tt.oblivionadvanced:0 "J'ai Oblivion avancé!" 
 POD_diablerize.200.option.b.tt.cloak_of_shadows:0 "Je peux me cacher dans l’ombre."
 POD_diablerize.200.option.b.tt.silence_of_death:0 "Je me déplace avec le silence de la mort."
 POD_diablerize.200.option.b.tt.unseen_passage:0 "Mon passage est invisible."
 POD_diablerize.200.option.b.tt.vanish:0 "Je peux tout simplement disparaître."
 POD_diablerize.200.option.b.tt.stygian_shroud:0 "Je peux invoquer un Linceul Stygien."
 POD_diablerize.200.option.b.tt.shadow_step:0 "Je peux traverser les ombres."
 POD_diablerize.200.option.b.success:0 "[defender.GetFirstName] gagne"
 POD_diablerize.200.option.b.tt.defender_wins:0 "Je suis caché !"
 POD_diablerize.200.option.b.failure:0 "[attacker.GetFirstName] gagne"
 POD_diablerize.200.option.b.tt.attacker_wins:0 "[attacker.GetFirstName] m'a attrapé."
 POD_diablerize.200.option.c.tt:0 "Un duel intriguant déterminera si vous pouvez utiliser la discipline occultation pour vous cacher de l’attaque de [attacker.GetFirstName]."
 POD_diablerize.200.option.c:0 "Envoûter !"
 POD_diablerize.200.option.c.tt.beast:0 "#R Comment pourrait t'[attacker.GetSheHe] nous attaquer? ! Nous sommes si merveilleux!#"
 POD_diablerize.200.option.c.desc:0 "Un conflit de personnalité"
 POD_diablerize.200.option.c.tt:0 "Un duel diplomatique déterminera si vous pouvez utiliser la discipline de présence pour que [attacker.GetFirstName] arrête son attaque."
 POD_diablerize.200.option.c.tt.entrancement:0 "Je suis envoûtant."
 POD_diablerize.200.option.c.tt.majesty:0 "Je suis majestueux!"
 POD_diablerize.200.option.c.success:0 "[defender.GetFirstName] gagne"
 POD_diablerize.200.option.c.tt.defender_wins:0 "J'ai envoûté [attacker.GetFirstName]!"
 POD_diablerize.200.option.c.failure:0 "[attacker.GetFirstName] gagne"
 POD_diablerize.200.option.c.tt.attacker_wins:0 "[attacker.GetFirstName] est immunisé de mes charmes." 
 POD_diablerize.200.option.d:0 "Hypnotiser !"
 POD_diablerize.200.option.d.desc:0 "Un conflit de domination"
 POD_diablerize.200.option.d.tt.beast:0 "#R [attacker.GetSheHe|U] vous obéira !#"
 POD_diablerize.200.option.d.tt:0 "Un duel d’intendance déterminera si vous pouvez utiliser la discipline la domination pour que [attacker.GetFirstName] arrête son attaque."
 POD_diablerize.200.option.d.tt.mesmerize:0 "Je peux hypnotiser les esprits inférieurs."
 POD_diablerize.200.option.d.tt.rationalize:0 "Je peux faire en sorte que mes esclaves considère mes ordres comme étant les leurs."
 POD_diablerize.200.option.d.tt.submerged_directive:0 "Je peux les submerger de directives pour transformer les faibles en pions."
 POD_diablerize.200.option.d.tt.terminal_decree:0 "Je peux émettre un décret final."
 POD_diablerize.200.option.d.success:0 "[defender.GetFirstName] gagne"
 POD_diablerize.200.option.d.tt.defender_wins:0 "J'ai dominé [attacker.GetFirstName]!"
 POD_diablerize.200.option.d.failure:0 "[attacker.GetFirstName] gagne"
 POD_diablerize.200.option.d.tt.attacker_wins:0 "La volonté de [attacker.GetFirstName] est trop forte pour dominer."  
 POD_diablerize.200.option.e:0 "Changez de forme !"
 POD_diablerize.200.option.e.tt.beast:0 "#R [attacker.GetSheHe|U] ne peut pas manger ce que [attacker.GetSheHe] ne peut pas tenir!#"
 POD_diablerize.200.option.e.tt:0 "Un duel d’apprentissage déterminera si vous pouvez utiliser votre discipline de changement de forme en une forme incohérente et échapper au piège de [attacker.GetFirstName]."
 POD_diablerize.200.option.f:0 "Attaqué !"
 POD_diablerize.200.option.f.tt.beast:0 "#R Nous devrions prendre son sang#"
 POD_diablerize.200.option.f.tt:0 "Un duel de prouesses déterminera si [attacker.GetFirstName] ou vous gagnez le combat."

# Flight Martial Duel Result
#250 notify atacker
 POD_diablerize.250.t:0 "Diablerie: Vol!"
 POD_diablerize.250.desc.success:0 "[defender.GetFirstName] s’est enfuit. Peu importe à quel point j’essaie, je ne pourrais pas rattraper ma proie."
 POD_diablerize.250.desc.failure:0 "[defender.GetFirstName] a essayé de s’enfuir, mais [defender.GetSheHe] n’était pas assez rapide. Je dois parcourir la distance restante pour chasser ma proie en bas."
 POD_diablerize.250.option.a.success:0 "Déjoué!"
 POD_diablerize.250.option.a.failure:0 "Attaqué !"
 
#275 Martial Duel Result notify defender
 POD_diablerize.275.t:0 "Fuir le combat !"
 POD_diablerize.275.desc.success:0 "J’ai pu m’échapper de [attacker.GetFirstName]. [attacker.GetSheHe|U] est tombé loin derrière moi, hors de vue."
 POD_diablerize.275.desc.failure:0 "J’ai couru mais pas assez vite. [attacker.GetFirstName] m’a attrapé."
 POD_diablerize.275.option.a.success:0 "Je dois rester loin de [attacker.GetHerHim]."
 POD_diablerize.275.option.a.failure:0 "C'est [attacker.GetHerHim] ou moi !"

# Hide Duel
#300 hide duel notify atacker
 POD_diablerize.300.t:0 "Diablerie: Cachez-vous!"
 POD_diablerize.300.desc.success:0 "[defender.GetFirstName] a rapidement réussi à se cacher de moi. Je ne trouve ma proie nulle part."
 POD_diablerize.300.desc.failure:0 "[defender.GetFirstName] essayait de se cacher de moi. Ça ne va pas fonctionner. Je peux voir où [defender.GetSheHe] se trouve."
 POD_diablerize.300.option.a.success:0 "Déjoué !"
 POD_diablerize.300.option.a.failure:0 "Attaqué !"
 
#325 hide duel notify defender
 POD_diablerize.325.t:0 "Se cacher du combat!"
 POD_diablerize.325.desc.success:0 "C’était chaud. J’ai pu me cacher de [attacker.GetFirstName]. Maintenant, si je peux me déplacer assez tranquillement sans attirer l’attention, je vais m’éloigner de [attacker.GetHerHim]."
 POD_diablerize.325.desc.failure:0 "J’ai essayé de me cacher, mais [attacker.GetFirstName] m’a trouvé."
 POD_diablerize.325.option.a.success:0 "Je dois couvrir mes traces."
 POD_diablerize.325.option.a.failure:0 "C'est [attacker.GetHerHim] ou moi !"
 
# Negotiate Presence Duel
#350 entrance duel notify atacker
 POD_diablerize.350.t:0 "Diablerie: Envoûtement !"
 POD_diablerize.350.desc.success:0 "En regardant dans ses yeux, je suis juste étonné de la personne merveilleuse qu'est [defender.GetFirstName]. Je l'aime vraiment. Je ne pourrais jamais rien faire pour blesser mon nouvel amour."
 POD_diablerize.350.desc.failure:0 "[defender.GetFirstName] a essayé de me séduire, mais mon esprit n’est pas si faible pour tomber dans un tel stratagème. J’aurai son sang!"
 POD_diablerize.350.option.a.success:0 "Je vous aime tant."
 POD_diablerize.350.option.a.success.tt:0 "Alors que je suis captivé par [defender.GetFirstName], je ne serai pas en mesure de tenter une nouvelle diablerie à nouveau."
 POD_diablerize.350.option.a.failure:0 "Vos charmes ne m’impressionnent guère."

#375 entrance duel notify defender
 POD_diablerize.375.t:0 "Envoûter l'ennemi"
 POD_diablerize.375.desc.success:0 "Avec ma discipline de présence, j’ai envouté [attacker.GetFirstName]. Tandis qu'[attaquant.GetSheHe] est séduit, [attacker.GetSheHe] n’est plus une menace pour moi."
 POD_diablerize.375.desc.failure:0 "J’essaie d’attirer l’attention de [attacker.GetFirstName] et de l'irradier de ma présence pour rendre passif ma proie. Avec vitesse et colère, [attaquant.GetSheHe] s’approche de moi, je semble avoir échoué."
 POD_diablerize.375.option.a.success:0 "Oui, c’est ça. C’est moi que tu adores."
 POD_diablerize.375.option.a.success.tt:0 "Alors que [attacker.GetFirstName] est captivé par moi, [attacker.GetSheHe] ne peut pas tenter de me diabler à nouveau."
 POD_diablerize.375.option.a.failure:0 "Pourquoi ne m’aime t'[attacker.GetSheHe] pas !"

# Dominate Duel

#425 dominate duel notify defender 
 POD_diablerize.425.t:0 "Hypnotisez l'ennemi"
 POD_diablerize.425.desc.success:0 "Avec ma discipline de dominination, je plie à ma volonté [attacker.GetFirstName] comme un potier plie de l’argile. D’abord, je contraint [attaquant.GetFirstName] à arrêter ! Maintenant, quelques ordres plus intéressants."
 POD_diablerize.425.desc.failure:0 "Je tends la main à son esprit. C’est comme une forteresse que je ne peux pas pénétrer. [attacker.GetSheHe|U] est sourd à mes ordres répétés."
 POD_diablerize.425.option.a:0 "Quittez cet endroit. Ne revenez pas."
 POD_diablerize.425.option.a.tt:0 "Le plan diablerie de [attacker.GetFirstName] contre vous se termine."
 POD_diablerize.425.option.b:0 "Vous me rendrez un grands service."
 POD_diablerize.425.option.b.tt:0 "J’obtiendrai un hameçon sur [attacker.GetFirstName]" 
 POD_diablerize.425.option.e:0 "Vous êtes maintenant mon prisonnier." 
 POD_diablerize.425.option.e.tt:0 "Je vais emprisonner [attacker.GetFirstName]."
 POD_diablerize.425.option.c:0 "Part et va regarder le lever du soleil." 
 POD_diablerize.425.option.c.sunrise:0 "Part et va regarder le lever du soleil."
 POD_diablerize.425.option.c.behead:0 "Au bloc, prisonnier. Tout en douceur."
 POD_diablerize.425.option.c.fire:0 "Jette-toi sur le bûcher funéraire."
 POD_diablerize.425.option.c.tt:0 "[attacker.GetFirstName] se suicidera et subira la mort finale."
 POD_diablerize.425.option.d:0 "Pourquoi [attacker.GetSheHe] ne m’obéit pas !"

#400 dominate duel notify atacker
 POD_diablerize.400.t:0 "Diablerie: Hypnotisation !"
 POD_diablerize.400.desc.success:0 "[defender.GetFirstName] entre dans mon esprit. Je ne peux pas résister à sa volonté. J’ai été complètement dominé. [defender.GetSheHe|U] m’oblige à 'Arréter !'"
 POD_diablerize.400.desc.leave:0 "Puis [defender.GetFirstName] ,m'ordonne, 'Quittez cet endroit et ne revenez pas.'" 
 POD_diablerize.400.desc.favor:0 "Puis [defender.GetFirstName] ordonne, 'Vous ferez une faveur importante pour moi. '" 
 POD_diablerize.400.desc.favor.tt:0 "[defender.GetFirstName] obtient un hameçon sur vous."
 POD_diablerize.400.desc.die:0 "Puis [defender.GetFirstName] émet un décret final, 'Part et va regarder le lever du soleil.'" 
 POD_diablerize.400.desc.sunrise:0 "Puis [defender.GetFirstName] émet un décret final, 'Part et va regarder le lever du soleil.'" 
 POD_diablerize.400.desc.behead:0 "Puis [defender.GetFirstName] émet un décret final, 'Au bloc, prisonnier. Tout en douceur.'" 
 POD_diablerize.400.desc.fire:0 "Puis [defender.GetFirstName] émet un décret final, 'Jette-toi sur le bûcher funéraire.'" 
 POD_diablerize.400.desc.prison:0 "Puis [defender.GetFirstName] vous ordonne d’entrer dans une cellule, 'Vous êtes maintenant mon prisonnier'" 
 POD_diablerize.400.desc.failure:0 "Alors que je me charge de [defender.GetFirstName], [defender.GetSheHe] me fixe intensément et avec une voix imposante et m’ordonne d'arrêté. [defender.GetSheHe|U] n’a aucun pouvoir sur moi !
 POD_diablerize.400.option.a.success:0 "Vos désirs sont des ordres."
 POD_diablerize.400.option.d.failure:0 "Restez en dehors de mon esprit !"

# Learning Shapeshift Duel
#450 shapeshift duel notify atacker
 POD_diablerize.450.t:0 "Diablerie: Changement de forme!"
 POD_diablerize.450.desc.success:0 "Sous mes yeux, [defender.GetFirstName] se transforme mystiquement en une forme intangible. Je ne peux pas rien attraper. Je ne peux même pas toucher une quelconque parti de son corps.  Et juste comme ça, [defender.GetSheHe] est parti."
 POD_diablerize.450.desc.failure:0 "[defender.GetFirstName] commence à se transformer. Son corps commence à se former. [defender.GetSheHe|U] n’est pas assez rapide pour m’échapper !"
 POD_diablerize.450.option.a.success:0 "Attaqué !"
 POD_diablerize.450.option.a.failure:0 "Déjoué !"
 
#475 shapeshift duel notify defender
 POD_diablerize.475.t:0 "Changez de forme"
 POD_diablerize.475.desc.success:0 "Je concentre ma discipline et me transforme en une forme intangible. Elle est complète avant que [attacker.GetFirstName] puisse m’atteindre. Je m’échappe alors facilement."
 POD_diablerize.475.desc.failure:0 "Je commence le processus pour transformer une forme intangible. Je ne peux pas le faire assez vite avant que [attacker.GetFirstName] soit sur moi."
 POD_diablerize.475.option.a.success:0 "Ce ne sera pas la dernière fois que ce tour me sauvera."
 POD_diablerize.475.option.a.failure:0 "Chair contre chair !"
 
# Prowess Duel, Last Chance to turn back
 POD_diablerize.500.t:0 "Diablerie: La Bataille Finale"
 POD_diablerize.500.desc:0 "Plus de course, plus de cachette, plus de jeux d’esprit. [defender.GetFirstName] ne peut pas m’échapper. Il est temps pour la bataille finale."
 POD_diablerize.500.option.a:0 "Attaqué !"
 POD_diablerize.500.option.a.tt.beast:0 "#R Oui ! Tout le sang de [defender.GetFirstName] sera le mien ! ... Je veux dire le nôtre. Tout le sang de [defender.GetFirstName] sera le nôtre !#"
 POD_diablerize.500.option.a.tt.attacker_wins:0 "[attacker.GetFirstName] gagne !"
 POD_diablerize.500.option.a.tt.defender_wins:0 "[defender.GetFirstName] gagne !"
 POD_diablerize.500.option.a.desc:0 "Une bataille de prouesses"
 POD_diablerize.500.option.a.success:0 "Victoire !"
 POD_diablerize.500.option.a.failure:0 "Défaite !"
 POD_diablerize.500.option.b:0 "C'est trop risqué, j’abandonne mes plans."

# Prowess Duel, Attacker Backs down
 POD_diablerize.510.t:0 "Retraite"
 POD_diablerize.510.desc:0 "[attacker.GetFirstName] ne s’engagerait pas dans l’attaque et les retraites."
 POD_diablerize.510.option.a:0 "Bon débarras"

#515 notify diablerist of prowess duel result
 POD_diablerize.515.t:0 "Diablerie: Au Vainqueur, le Butin !"
 POD_diablerize.515.desc.success:0 "La bataille est brutale mais aussi rapide. Je suis victorieux et [defender.GetFirstName] se trouve à mes pieds."
 POD_diablerize.515.desc.failure:0 "Je pensais que j’étais prêt, mais la prouesse de combat de [defender.GetFirstName] est trop dur à surmonter. J’ai été vaincu."
 POD_diablerize.515.option.a.success:0 "Que faire de mon prix ?"
 POD_diablerize.515.option.a.failure:0 "Je commence à me glisser dans la torpeur, me demandant quel sera mon destin." 

#525 notify defender of prowess duel result, pick fate of defeated diablerist
 POD_diablerize.525.t:0 "Le combat !"
 POD_diablerize.525.desc.success:0 "Les prouesses de combat de [attacker.GetFirstName] sont trop difficiles à surmonter. J’ai été vaincu."
 POD_diablerize.525.desc.failure:0 "La bataille est brutale mais aussi rapide. Je suis victorieux et [attacker.GetFirstName] se trouve à mes pieds."
 POD_diablerize.525.option.a.failure:0 "Détruisez [attacker.GetFirstName]. C’est la mort finale pour [attacker.GetHerHim]." #Kill
 POD_diablerize.525.option.b.failure:0 "[attacker.GetSheHe] est maintenant mon prisonnier." #Stake & Imprison
 POD_diablerize.525.option.c.failure:0 "Je vais juste m’en aller, laissant [attacker.GetFirstName] au main du destin." #Release
 POD_diablerize.525.option.d.failure:0 "J’aurai le sang de son cœur !" #Diaberlize! 
 POD_diablerize.525.option.e.success:0 "Je commence à me glisser dans la torpeur, me demandant quel sera mon destin."   

#550 defeated attacker notified of victorious defender decision
 POD_diablerize.550.t:0 "Diablerie: Défaite"
 POD_diablerize.550.desc.destruction:0 "J’ai été détruit par [defender.GetFirstName]."
 POD_diablerize.550.desc.imprisonment:0 "J’ai été emprisonné par [defender.GetFirstName]."
 POD_diablerize.550.desc.release:0 "[defender.GetFirstName] me laisse partir. Je ne comprends pas..."
 POD_diablerize.550.desc.diablerie:0 "Les crocs de [defender.GetFirstName] s’enfoncent dans ma chair. [defender.GetSheHe|U] boit tout mon sang. Je devais être le chasseur, mais j’étais la proie."
 POD_diablerize.550.option.a:0 "Ca se termine comme ça."

# Getting to the Yum Yum!
 POD_diablerize.600.t:0 "Diablerie!"
 POD_diablerize.600.desc:0 "Non seulement tuer, mais dévorer l’âme d’un autre être, est l’une des actions les plus odieuses possibles. La plupart des parents le considèrent comme le pire des crimes. Pourtant, il n’y a rien que la bête désire plus.\n\nFinalement, [victim.GetFirstName] est dans mes griffes. Est-ce que je draine jusqu’au cœur de son être ? Est-ce que je bois le sang de son cœur ? Dois-je tous prendre ?"
 POD_diablerize.600.option.a:0 "Dévorez l’âme de [victime.GetTitledFirstName] !"
 POD_diablerize.600.option.a.tt:0 "[victim.GetTitledFirstName] est détruit !"  
 POD_diablerize.600.option.a.tt.beast:0 "#R OUI! FAIS-LE!#"   
 POD_diablerize.600.option.b:0 "Ne pas diabler [victim.GetFirstName]."
 POD_diablerize.600.option.b.tt.beast:0 "#R Ne les laissez pas partir ! [victime.GetSheHe] ne mérite pas le sang ! Nous le méritons !#"    
 
 # Attacker decides not to diablerize
 POD_diablerize.650.t:0 "Pitié ?"
 POD_diablerize.650.desc:0 "J’ai été vaincu. J’étais sûr que [attacker.GetFirstName] me détruirait. Étrangement, [attacker.GetSheHe] vient de partir."
 POD_diablerize.650.option.a:0 "Était-ce une dernière once d’humanité ?"
 
 POD_diablerize.700.t:0 "Amaranth !"
 POD_diablerize.700.option.a:0 "Il est temps."
 POD_diablerize.700.desc:0 "Dévorer l’âme de [victime.GetTitledFirstName]" 
  
 POD_diablerize.800.t:0 "L'esprit invaincu"
 POD_diablerize.800.desc:0 "Je sens [unconquered_soul.GetFirstName] dans mon esprit, luttant pour prendre le contrôle de mon corps! Qu’ai-je fais?"  
 POD_diablerize.800.option.a:0 "Résister ! Je ne serai pas vaincu !"
 POD_diablerize.800.option.b:0 "Cédez et laissez [unconquered_soul.GetFirstName] prendre le relais." 
 
 POD_diablerize.4000.t:0 "Diabolisation Déjoué !"
 POD_diablerize.4000.desc:0 "Par une certaine torsion du destin, mon plan pour diaboliser [defender.GetFirstName] a échoué."  
 POD_diablerize.4000.option.a:0 "Malédictions ! Une nuit [victime.GetFirstName], votre sang sera mien !"
 

