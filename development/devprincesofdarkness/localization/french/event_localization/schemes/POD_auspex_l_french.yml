l_french:

 POD_auspex.100.t:0 "Invasion Psychique"
 POD_auspex.100.desc:0 "[actor.GetTitledFirstName] essaie de vous voler vos secrets depuis votre esprit."
 POD_auspex.100.option.a:0 "Exercez ma volonté afin de résister à l’attaque télépathique."
 POD_auspex.100.option.b:0 "Combattre l’intrusion psychique."
 POD_auspex.100.option.c:0 "Céder à l’intrusion psychique."
 
 POD_auspex.200.t:0 "Lire dans les pensées de [recipient.GetFirstNameNoTooltip]"
 POD_auspex.200.desc:0 "Le moment est venu d’envahir la psyché de [recipient.GetTitledFirstName], mais [recipient.GetSheHe] résiste."
 POD_auspex.200.option.a:0 "Réveillez le sang pour [recipient.GetHerHim] violé l'esprit."
 POD_auspex.200.a.tt_willpower:0 "[recipient.GetFirstNameNoTooltip] a exercé sa volonté afin de résister à votre télépathie."
 POD_auspex.200.a.tt_fortitude:0 "[recipient.GetFirstNameNoTooltip] est habile dans la discipline de la Force d'âme et résiste à votre manipulation."
 POD_auspex.200.a.success.desc:0 "Victoire"
 POD_auspex.200.a.tt_success:0 "Les secrets de [recipient.GetTitledFirstName] me seront découvert!"
 POD_auspex.200.a.failure.desc:0 "Echec"
 POD_auspex.200.a.tt_failure:0 "[recipient.GetTitledFirstName] a résisté à ma tentative d’espionnage télépathique."
 POD_auspex.200.option.b:0 "Réveillez le sang et exercez ma volonté. Mon esprit verra tout !"
 POD_auspex.200.option.b.tt.beast:0 "#R [recipient.GetSheHe|U] doit craquer sous notre force mentale! #"
 POD_auspex.200.option.c:0 "Abandonnez cette tâche, je ne veux plus l'espionner psychiquement."
 POD_auspex.200.option.c.tt:0 "La télépathie va échouer."
 POD_auspex.200.option.c.tt.beast:0 "#R Comme la proie, nous sommes aveugles ! #"
 
 POD_auspex.300.t:0 "L'esprit de [recipient.GetFirstNameNoTooltip] est brisé"
 POD_auspex.300.desc:0 "J’ai appris le secret de [recipient.GetTitledFirstName] des chuchotements de son esprit."
 POD_auspex.300.option.a:0 "C’est comme il se doit."
 POD_auspex.300.option.a.tt.beast:0 "#R Que faire de cette douce connaissance ? #"

 POD_auspex.400.t:0 "Votre esprit a été violé"
 POD_auspex.400.desc:0 "Ayant perdu votre volonté face à [actor.GetTitledFirstName], vos secrets lui sont maintenant connus ." 
 POD_auspex.400.option.a:0 "Mon esprit n’est plus mon sanctuaire "
 
 POD_auspex.500.t:0 "Résistance à une tentative d'espionnage télépathique"
 POD_auspex.500.desc:0 "[recipient.GetTitledFirstName] a résisté à ma tentative d’espionnage." 
 POD_auspex.500.option.a:0 "Déjoué !"
 POD_auspex.500.option.a.tt.beast:0 "#R Prenons plus de sang et réessayons ! #"

 POD_auspex.600.t:0 "Résistance à une tentative d'espionnage télépathique"
 POD_auspex.600.desc:0 "[actor.GetTitledFirstName] a abandonné sa tentative d’envahir votre esprit." 
 POD_auspex.600.option.a:0 "Mon esprit est le mien !"

 

