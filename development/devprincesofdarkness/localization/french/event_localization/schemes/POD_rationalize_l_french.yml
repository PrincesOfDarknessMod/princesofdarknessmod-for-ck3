l_french:

 POD_rationalize.100.t:0 "Vous vous faites dominer"
 POD_rationalize.100.desc:0 "[schemer.GetTitledFirstName] vous domine pour exiger une faveur."
 POD_rationalize.100.option.a:0 "Exercez ma volonté pour résister à la domination."
 POD_rationalize.100.option.b:0 "Refusez la domination."
 POD_rationalize.100.option.c:0 "Cédez à la domination."
 
 POD_rationalize.200.t:0 "Domination de [target.GetFirstNameNoTooltip]"
 POD_rationalize.200.desc:0 "Ma volonté commande [target.GetTitledFirstName]. [target.GetSheHe|U] résiste à ma domination."
 POD_rationalize.200.option.a:0 "Réveillez le sang pour mieux dominer."
 POD_rationalize.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] est doué pour la discipline de la Force d'âme et résiste à vos pouvoirs."
 POD_rationalize.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] a exercé sa volonté afin de résister à vos pouvoirs."
 POD_rationalize.200.a.success.desc:0 "Victoire"
 POD_rationalize.200.a.tt_success:0 "[target.GetTitledFirstName] vous accordera une faveur."
 POD_rationalize.200.a.failure.desc:0 "Défaite"
 POD_rationalize.200.a.tt_failure:0 "[target.GetTitledFirstName] résistera à votre domination."
 POD_rationalize.200.option.b:0 "Réveillez le sang et exercez ma volonté. Je suis le maître !"
 POD_rationalize.200.option.b.tt.beast:0 "#R Je suis le maître !#"
 POD_rationalize.200.option.c:0 "C’est une perte de temps, je ne veux plus dominer [target.GetTitledFirstName]."
 POD_rationalize.200.option.c.tt:0 "La domination va échouer."

 POD_rationalize.300.t:0 "[target.GetFirstNameNoTooltip] est dominé"
 POD_rationalize.300.desc:0 "Grâce à l’utilisation de ma discipline de domination, [target.GetTitledFirstName] me devra une faveur."
 POD_rationalize.300.option.a:0 "Maintenant, que dois-je faire de [target.GetHerHim] ?"
 POD_rationalize.300.option.a.tt.beast:0 "#R Du sang ! On veut du sang !#"

 POD_rationalize.400.t:0 "Une dette que je ne peux pas refuser"
 POD_rationalize.400.desc:0 "Je suis redevable à [schemer.GetTitledFirstName]." 
 POD_rationalize.400.option.a:0 "Comment je me rattraperais"
 
 POD_rationalize.500.t:0 "A résisté à la domination"
 POD_rationalize.500.desc:0 "[target.GetTitledFirstName] a résisté à ma domination." 
 POD_rationalize.500.option.a:0 "Ce n’est pas possible !"
 POD_rationalize.500.option.a.tt.beast:0 "#R Battez-les jusqu’à ce qu’ils obéissent !#"

 POD_rationalize.600.t:0 "A résisté à la domination"
 POD_rationalize.600.desc:0 "J’ai été jeté hors des tréfonds du mental de [schemer.GetTitledFirstName]." 
 POD_rationalize.600.option.a:0 "J’ai une volonté de fer !"

 

