 POD_hunteradoption.100.t:0 "Un Nouveau Jour"
 POD_hunteradoption.100.desc:0 "Après une formation approfondie, vous êtes confiant que votre écuyer est prêt à se joindre à la lutte contre l’obscurité. Avec cet effort, vous vous assurez que l’œuvre de Dieu vous survivra et se poursuivra jusqu’à la victoire inévitable. Vous espérez qu’un jour votre élève fera reculer les forces de l’Enfer par sa seule présence. Mais jusque-là, beaucoup de travail reste à faire..."
 POD_hunteradoption.100.option.a:0 "Je lui ai enseigné les questions militaires"
 POD_hunteradoption.100.option.a.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape"  
 POD_hunteradoption.100.option.b:0 "L'habilité avec les armes était notre principal objectif"
 POD_hunteradoption.100.option.b.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape" 
 POD_hunteradoption.100.option.c:0 "Mon écuyer sait qu’il y a des agents de l’Enfer dans chaque ombre"
 POD_hunteradoption.100.option.c.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape" 
 POD_hunteradoption.101.t:0 "Un Nouveau Jour"
 POD_hunteradoption.101.desc:0 "En tant que cœur battant de l’Inquisition de l’Ombre, les Sœurs de St-Jean ont un lourd fardeau qui n’est pas partagé facilement. Malgré cela, vous êtes confiant dans les nouvelles aptitudes de votre élève après cette période de formation approfondie. Une autre épouse de Dieu est prête à prendre votre manteau si, ou quand, les ténèbres vous rattrapent. Un petit réconfort, mais un réconfort néanmoins."
 POD_hunteradoption.101.option.a:0 "Elle a beaucoup appris"
 POD_hunteradoption.101.option.a.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape"  
 POD_hunteradoption.101.option.b:0 "Elle aidera la Sainte Église à prospérer"
 POD_hunteradoption.101.option.b.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape" 
 POD_hunteradoption.101.option.c:0 "Elle est prête à répandre la Parole"
 POD_hunteradoption.101.option.c.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape" 
 POD_hunteradoption.102.t:0 "Un Nouveau Jour"
 POD_hunteradoption.102.desc:0 "Souvent décrié, l’Ordre Rouge est néanmoins un élément crucial de l’Inquisition. Poussés par une soif infinie de connaissances, beaucoup de ses membres se sont souvent retrouvés attirés par un chemin plus sombre. Vous avez appris à votre élève le meilleur que vous pouviez afin de lui éviter un tel destin."
 POD_hunteradoption.102.option.a:0 "Mon élève a beaucoup appris"
 POD_hunteradoption.102.option.a.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape"  
 POD_hunteradoption.102.option.b:0 "Mon élève aidera la Sainte Église à prospérer"
 POD_hunteradoption.102.option.b.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape" 
 POD_hunteradoption.102.option.c:0 "Mon élève connaît le pouvoir des secrets"
 POD_hunteradoption.102.option.c.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape" 
 POD_hunteradoption.103.t:0 "Un Nouveau Jour"
 POD_hunteradoption.103.desc:0 "Force légitimement redoutée, même par les autres inquisiteurs, l’Oculi Dei est la police secrète des Chasseurs. Ils en savent beaucoup, beaucoup plus que la plupart des gens ne le pensent et sont la source d’information la plus crédible sur les habitants de la nuit. Les membres de l’Oculi ont tendance à être paranoïaques à l’extrême, voyant des complots partout... mais le plus souvent, ils ont raison."
 POD_hunteradoption.103.option.a:0 "Ouvrez l'œil !"
 POD_hunteradoption.103.option.a.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape"  
 POD_hunteradoption.104.t:0 "Un Nouveau Jour"
 POD_hunteradoption.104.desc:0 "La famille von Murnau a la bénédiction douteuse de pouvoir sentir le mal. En tant que tels, ils sont les chiens de l’Inquisition et un atout précieux, même si leurs manières non cléricales font d’eux des compagnons bizarres avec les autres ordres. C’est une pratique courante pour un Inquisiteur de la famille de prendre un autre, plus jeune, comme élève jusqu’à ce qu’il ou elle soit capable de combattre l’obscurité lui-même."
 POD_hunteradoption.104.option.a:0 "Mon élève connaît le pouvoir des secrets"
 POD_hunteradoption.104.option.a.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape"  
 POD_hunteradoption.104.option.b:0 "Mon élève aidera la Sainte Église à prospérer"
 POD_hunteradoption.104.option.b.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape" 
 POD_hunteradoption.104.option.c:0 "Mon élève est prêt à répandre la Parole de Dieu"
 POD_hunteradoption.104.option.c.tt:0 "La période d’entraînement était stressante, mais vous avez maintenant un nouvel héritier si l’obscurité vous rattrape" 
 
   
 

