l_french:

 POD_entrance.100.t:0 "Vous vous faites envoûté"
 POD_entrance.100.desc:0 "Vous aimez [schemer.GetTitledFirstName]. Vous l'aimez vraiment."
 POD_entrance.100.option.a:0 "Exercez ma volonté pour résister à la tentation."
 POD_entrance.100.option.b:0 "Refusez l'envoûtement"
 POD_entrance.100.option.c:0 "Cédez à l'envoûtement"
 
 POD_entrance.200.t:0 "Envoûtez [target.GetFirstNameNoTooltip]"
 POD_entrance.200.desc:0 "Je sens mon énergie mystique toucher l’esprit de [target.GetTitledFirstName]. [target.GetSheHe|U] résiste à l’envoûtement."
 POD_entrance.200.option.a:0 "Faites entrer le sang dans son envoûtement."
 POD_entrance.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] est doué pour la discipline de la Force d'âme et résiste à mes pouvoirs."
 POD_entrance.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] a exercé sa volonté afin de résister à mes pouvoirs."
 POD_entrance.200.a.success.desc:0 "Victoire"
 POD_entrance.200.a.tt_success:0 "[target.GetTitledFirstName] sera ravi de m’aimer."
 POD_entrance.200.a.failure.desc:0 "Défaite"
 POD_entrance.200.a.tt_failure:0 "[target.GetTitledFirstName] à résisté à mon envoûtement."
 POD_entrance.200.option.b:0 "Réveillez le sang et exercez ma volonté. On ne me refusera pas !"
 POD_entrance.200.option.b.tt.beast:0 "#R [target.GetSheHe|U] doit m'aimer ! #"
 POD_entrance.200.option.c:0 "Abandonnez cette entreprise, je ne souhaite plus l'envoûter."
 POD_entrance.200.option.c.tt:0 "l’envoûtement va échouer."

 POD_entrance.300.t:0 "[target.GetFirstNameNoTooltip] est envoûté"
 POD_entrance.300.desc:0 "Grâce à l’utilisation de mon pouvoir mystique, [target.GetTitledFirstName] a été envoûté."
 POD_entrance.300.option.a:0 "Bien sûr qu'[target.GetSheHe] m’aime. Tout le monde m’aimera."
 POD_entrance.300.option.a.tt.beast:0 "#R Tous nous regarderont et désespéreront !#"

 POD_entrance.400.t:0 "Vous êtes arrivé"
 POD_entrance.400.desc:0 "Vous vous trouvez dans la cour de [schemer.GetTitledFirstName]." 
 POD_entrance.400.option.a:0 "Mon nouveau chez moi."
 
 POD_entrance.500.t:0 "A résisté à l'envoûtement"
 POD_entrance.500.desc:0 "[target.GetTitledFirstName] a résisté à mon envoûtement." 
 POD_entrance.500.option.a:0 "Déjoué !"
 POD_entrance.500.option.a.tt.beast:0 "#R Nous rejeter, c’est mourir ! #"

 POD_entrance.600.t:0 "A résisté à l'envoûtement"
 POD_entrance.600.desc:0 "Vous ne ressentez plus l'envoûtement de [schemer.GetTitledFirstName]." 
 POD_entrance.600.option.a:0 "Reste en dehors de mon esprit !"

 

