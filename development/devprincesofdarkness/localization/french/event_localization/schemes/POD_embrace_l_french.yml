l_french:

 POD_embrace.100.t:0 "L'Embrassement'"
 POD_embrace.100.desc:0 "J’ai orchestré des événements afin que [scheme.GetTarget.GetFirstName] soit tombé dans mes griffes. Dans un endroit isolé, [victime.GetSheHe] ne sera pas en mesure de s’échapper. Dois-je accorder l’immortalité même si cela signifie sa damnation? Est-ce que [victim.GetSheHe] sera reconnaissant, ou [victim.GetSheHe] me haïra pour toujours? Est-ce que mon père a eu ces pensées?"
 POD_embrace.100.option.a:0 "Embrasser [scheme.GetTarget.GetFirstName]"
 POD_embrace.100.option.a.tt:0 "Vous allez tuer [scheme.GetTarget.GetFirstName] et ensuite [victime.GetHerHim] transformer en vampire. Cela vous coûtera de la piété, peut augmenter votre soif et peut risquer d’exposer la mascarade."  
 POD_embrace.100.option.a.tt.beast:0 "#R Oui! Asséchez-les et donnez-leur une seule goutte de notre sang. Nous pouvons toujours tout reprendre!#" 
 POD_embrace.100.option.b:0 "Laisser [victime.GetHerHim] partir."
 POD_embrace.100.option.b.tt.beast:0 "#R Non! Ne [victime.GetHerHim] laissez pas s’échapper! J’ai attendu trop longtemps pour cela! Nous avons attendu longtemps pour cela.#" 
 

