l_french:

 POD_vampire_blood_surge.100.t:0 "Afflux Sanguin!"
 POD_vampire_blood_surge.100.desc:0 "Le sang peut booster vos capacités surnaturellement, mais cela risque d'attiser votre soif."
 POD_vampire_blood_surge.100.option.a:0 "Combattons!" 
 POD_vampire_blood_surge.100.option.a.tt.beast:0 "#BLOODRED Oui! C'est l'heure du massacre!#"
 POD_vampire_blood_surge.100.option.h:0 "Je voudrais être plus fort!" 
 POD_vampire_blood_surge.100.option.h.tt.beast:0 "#BLOODRED Nous sommes immortels! #"
 POD_vampire_blood_surge.100.option.b:0 "Je deviens meilleur en tactique"
 POD_vampire_blood_surge.100.option.b.tt.beast:0 "#BLOODRED La Guerre. La Guerre ne change jamais. Il y a toujours beaucoup de sang versé dans une guerre.#"   
 POD_vampire_blood_surge.100.option.c:0 "Rendez-moi plus agréable"
 POD_vampire_blood_surge.100.option.c.tt.beast:0 "#BLOODRED Bienvenue dans mon salon.#"   
 POD_vampire_blood_surge.100.option.d:0 "Aidez-moi avec les nombres"
 POD_vampire_blood_surge.100.option.d.tt.beast:0 "#BLOODRED Nous avons besoin de plus de troupeaux. Nous avons toujours besoin de plus de sang. Je peux vous aidez à en avoir. Laissez moi vous aidez.#"    
 POD_vampire_blood_surge.100.option.e:0 "Silencieux, comme la mort"
 POD_vampire_blood_surge.100.option.e.tt.beast:0 "#BLOODRED La chasse est ouverte!#"   
 POD_vampire_blood_surge.100.option.f:0 "Une bonne application de vitae peut augmenter exponentiellement l'intellect" 
 POD_vampire_blood_surge.100.option.f.tt.beast:0 "#BLOODRED Indubitablement. Maximisons l'acquisition de vitae avec rapidité.#"    
 POD_vampire_blood_surge.100.option.g:0 "Je ne risquerais pas d'attiser ma soif, pour le moment."  
 POD_vampire_blood_surge.100.option.g.tt.beast:0 "#BLOODRED Vous le ferez, et bientôt. Je vous attendrez.#"  
 
 
 
