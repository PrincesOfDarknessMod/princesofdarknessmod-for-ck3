l_french:

 trait_unusual:0 "Inhabituel"
 trait_unusual_desc:0 "Il y a quelque chose d’étrange chez cette personne."

 trait_vampire:0 "Vampire"
 trait_vampire_desc:0 "Ce personnage est l’un des morts-vivants."
 
 trait_diablerist:0 "Diaboliste"
 trait_diablerist_desc:0 "Ce personnage a commis une $game_concept_diablerize$ en dévorant le sang du cœur d’un autre vampire, en dévorant l’âme."
 
 trait_infernalist:0 "Infernaliste"
 trait_infernalist_desc:0 "Ce personnage a fait un pacte avec un pouvoir démoniaque pour des investissements infernaux."
 
 trait_ghoul:0 "Goule"
 trait_ghoul_desc:0 "Un mortel qui a consommé du sang de vampire."

 trait_szlachta:0 "Szlachta"
 trait_szlachta_desc:0 "Un mortel qui a consommé du sang de vampire et qui a ensuite été transformé par la discipline de Vicissitude."
 
 trait_mortal:0 "Mortel"
 trait_mortal_desc:0 "Un être humain ordinaire. Des vies si courtes..."
 
 trait_werewolf:0 "Loup-garou"
 trait_werewolf_desc:0 "Une créature surnaturelle. Ils s’appellent 'Garou'."
 
 trait_mage:0 "Mage"
 trait_mage_desc:0 "Des humains avec des avatars éveillés qui leur permettent de manier la vrai magie et d’altérer le tissu de la réalité."
 
 trait_wraith:0 "Spectre"
 trait_wraith_desc:0 "Un fantôme."

 trait_wight:0 "Wight"
 trait_wight_desc:0 "Une Wight est un vampire qui a perdu la totalité de sa morale. Ils sont, à toutes fins pratiques, la Bête en eux-mêmes. Un personnage qui est tombé à Wassail ne peut jamais être sauvé ou joué à nouveau."
 
 trait_assamite:0 "Banu Haqim"
 trait_assamite_desc:0 "Basés dans leur forteresse cachée au Moyen-Orient, ils sont traditionnellement considérés par la famille occidentale comme de dangereux assassins et diableristes."
 
 trait_assamite_laibon:0 "Shango"
 trait_assamite_laibon_desc:0 "Un des legs de Laibon. Adorateurs de Shango, le dieu yoruba des tempêtes, les Shango sont peut-être l’héritage le plus civilisé de Laibon à côté de l’aristocratique Guruhi."
 
 trait_baali:0 "Baali"
 trait_baali_desc:0 "Lignée de vampires associés à l’adoration des démons."
 
 trait_brujah:0 "Brujah"
 trait_brujah_desc:0 "Prompts à la colère et toujours passionnés, ils ont retrouvé leur position de clan de grands philosophes et de militants."
 
 trait_brujah_laibon:0 "Osebo"
 trait_brujah_laibon_desc:0 "Un des legs de Laibon. Les guerriers du Laibon, l’Osebo prennent leur nom du célèbre léopard de la légende Ashanti Ouest."
 
 trait_brujah_ashirra:0 "Bay't Mushakis"
 trait_brujah_ashirra_desc:0 "Brujah de la foi islamique sont connus comme Bay 't Mushakis, et beaucoup sont les enfants de la famille Carthage. Ils se sont répandus dans toute l’Afrique du Nord en particulier, les plus jeunes déclarant le jihad et cherchant à punir la famille romaine qui avait détruit la grande expérience."
 
 trait_cacophony:0 "Fille de la cacophonie"
 trait_cacophony_desc:0 "Actuellement composées principalement de femmes (en raison de la difficulté associée à éduquer quelqu’un avec la gamme vocale de la plupart des hommes), les filles pratiquent Melpominee, une discipline qui permet aux filles d’invoquer des effets étranges par le chant. Ils sont les choralistes par excellence des morts-vivants, et l’accueil d’un rassemblement d’entre eux vaut un grand prestige."
 
 trait_caitiff:0 "Caitiff"
 trait_caitiff_desc:0 "Connus sous le nom de sans-clans, sont des caïnites qui n’appartiennent à aucun clan."
 
 trait_cappadocian:0 "Cappadocien"
 trait_cappadocian_desc:0 "Des savants détachés obsédés par les mystères de la mort et de l’âme."
 
 trait_cappadocian_laibon:0 "Mla Watu"
 trait_cappadocian_laibon_desc:0 "Peut-être qu’aucun groupe de Laibon n’est autant rejeté que le Mla Watu. Bien que les Laibon dans leur ensemble soient déjà retirés de leur humanité, ils maintiennent toujours un respect sain pour les morts comme beaucoup de coutumes africaines l’exigent. Les Mla Watu, cependant, ne se contentent pas de communiquer avec les ancêtres morts; ils cherchent à les contrôler, dans leur corps et leur âme."
 
 trait_cappadocian_ashirra:0 "Qabilat al-Mawt"
 trait_cappadocian_ashirra_desc:0 "La branche islamique du clan cappadoce est connue au Moyen-Orient sous le nom de Qabilat al-Mawt, et est parmi les plus savants de la famille de ces terres. Les Qabilat al-Mawt doivent être prudents dans leurs études des morts car l’Islam tient les morts en haute estime ; la profanation des cadavres pourrait attirer l’attention des mortels et des Ashirra, ou des familles islamiques organisées."
 
 trait_gangrel:0 "Gangrel"
 trait_gangrel_desc:0 "Sauvages. Primal, robuste et animaliste."
 
 trait_gangrel_laibon:0 "Akunanse"
 trait_gangrel_laibon_desc:0 "Un des héritages de Laibon. Ils tirent leur nom et leur nature des mythes de 'l’araignée sage' de nombreux contes populaires africains. Ils sont connus pour leur grande connaissance, leurs sages conseils et leurs natures apolitiques."
 
 trait_gangrel_ashirra:0 "Wah'Sheen"
 trait_gangrel_ashirra_desc:0 "Alors que les Ashirra appellent tous les Gangrel "Wah’Sheen", il existe une ligne distinctive entre les deux parties, semblable à la division entre la ville et le pays Gangrel, bien qu’avec une relation beaucoup plus hostile."

 trait_gargoyle:0 "Gargouille"
 trait_gargoyle_desc:0 "Des vampires qui semblent être des sculptures de pierre animées."
 
 trait_giovanni:0 "Giovani"
 trait_giovanni_desc:0 "Après son ascension dans le sang, Augustus Giovani commença immédiatement à embrasser sa propre famille. Ce faisant, les Giovani sont devenu quelque chose entre une lignée et un culte au sein du clan cappadoce. Reconnus comme les experts de la nécromancie, les Giovani se maintenaient légèrement séparés du clan-mère."
 
 trait_harbingersofskulls:0 "Émissaires des Crânes"
 trait_harbingersofskulls_desc:0 "Une lignée de vampires d'une pâleur mortelle.  De plus, la peau des Emissaires se rétrécit pour faire apparaître ces Cainites squelettiques, avec des membres osseux et des visages figés dans un sourire de mort immortel."

 trait_kiasyd:0 "Kiasyd"
 trait_kiasyd_desc:0 "Une lignée de vampires avec du sang de fée descendant de la Lasombra Marconius de Strasbourg."
  
 trait_lasombra:0 "Lasombra"
 trait_lasombra_desc:0 "Le clan Lasombra sont des darwinistes sociaux, prédateurs, élégants et inhumains."
 
 trait_lasombra_laibon:0 "Xi Dundu"
 trait_lasombra_laibon_desc:0 "Prenant leur nom du mot Bavili pour 'ombre', le Xi Dundu est originaire du Congo jusqu’à ce qu’un rite qui a mal tourné les force à quitter leurs terres. Ils ont maintenant établient leur foyer parmi les peuples Maasaï de l’Afrique orientale."
 
 trait_lasombra_ashirra:0 "Qabilat al-Khayal"
 trait_lasombra_ashirra_desc:0 "Les Arabes Lasombra se distinguent parmi leurs homologues islamiques de la famille en ce sens qu’ils sont l’un des rares à ne pas être majoritairement chrétiens. L’islam s’est installé dans quelques endroits du clan, en particulier en Ibérie, et a causé de grandes fissures dans la baie."  
 
 trait_maeghar:0 "Maeghar"
 trait_maeghar_desc:0 "Une collection d’accidents isolés qui sont apparus quand un Cainite a essayé d’infliger sa malédiction à un être avec du sang de fée. Tous les Maeghar ont une certaine caractéristique physique indiquant leur nature fée, qui peut varier de la subtile (peau blanche et ébène cheveux) à la flagrante (six bras)."
 
 trait_malkavian:0 "Malkavien"
 trait_malkavian_desc:0 "Clan d'une famille maudite par la folie."
 
 trait_malkavian_ashirra:0 "Bay't Majnoon"
 trait_malkavian_ashirra_desc:0 "Les Malkaviens de l’Ashirra, le Bay 't Majnoon, sont plus respectés que ceux de l’Occident. Beaucoup ont été tenus comme des conseillers, des gardes du corps, et même des prophètes islamiques."
 
 trait_nosferatu:0 "Nosferatu"
 trait_nosferatu_desc:0 "Hante. Furtif, fort et terrifiant."
 
 trait_nosferatu_ashirra:0 "Bay't Mutasharid"
 trait_nosferatu_ashirra_desc:0 "Le Nosferatu dans les territoires d’Ashirra a connu un schisme en quelque sorte après que l’Islam est devenu la force dominante. La baie 't Mutasharid étaient ces Nosferatu qui ont refusé de se convertir à l’islam ou de renoncer à leurs rôles anciens de chasseurs et de croque-mitaines."
 
 trait_nosferatu_laibon:0 "Guruhi"
 trait_nosferatu_laibon_desc:0 "Prenant leur nom du dieu gambien dont ils prétendent descendre, les Guruhi se croient les maîtres de l’Afrique, les dirigeants légitimes de ses terres et de son peuple."
  
 trait_oldclantzimisce:0 "Ancien clan Tzimisce"
 trait_oldclantzimisce_desc:0 "Membres du clan Tzimisce qui n’ont pas rejoint le sabbat"
 
 trait_ravnos:0 "Ravnos"
 trait_ravnos_desc:0 "Connus pour être des vagabonds errants et des brigands, les Ravnos sont des charlatans qui pratiquent joyeusement leur art de la tromperie et du vol."
 
 trait_ravnos_ashirra:0 "Bay't Mujrim"
 trait_ravnos_ashirra_desc:0 "Bay 't Mujrim est le terme arabe pour le Clan des Trompeurs (Mujrim signifie littéralement 'Criminel'). Ils n’étaient plus les bienvenus dans le monde islamique, car leurs vices les menaient dans de nombreuses confrontations importunes avec les Ashirra."
 
 trait_ravnos_laibon:0 "Kinyonyi"
 trait_ravnos_laibon_desc:0 "Un des legs de Laibon. Ils prennent leur nom du mot Luganda pour 'oiseau', reflétant leurs tendances à voyager constamment, encore plus que la recherche de la connaissance Akunanse."
 
 trait_salubri:0 "Salubri"
 trait_salubri_desc:0 "Le clan Salubri, autrefois puissant, est devenu à peine une lignée après la destruction de son ancêtre, Saulot."

 trait_salubri_ashirra:0 "Al-Amin"
 trait_salubri_ashirra_desc:0 "Les Salubri islamiques, connus sous le nom d’al-Amin (littéralement 'Les Vertueux'), n’ont pas été moins chanceux que leurs homologues européens. Pendant des siècles, ils ont surveillé les Baali de l’Afrique du Nord à l’Asie, se déguisant habituellement en membres d’autres clans."

 trait_salubri_laibon:0 "Nkulu Zao"
 trait_salubri_laibon_desc:0 "Un des Legs mineurs de Laibon. Enfant de la lignée presque éteinte de Zao-lat, les Nkulu Zao sont peu nombreux après que leur héritage ait été traqué pendant des siècles."

 trait_samedi:0 "Samedi"
 trait_samedi_desc:0 "Originaires très probablement des Caraïbes, les membres de la lignée semblent tous ressembler à un zombie ou à un cadavre. Samedi semble être dans un état de décomposition constante. Des morceaux de chair en décomposition tombent de leur corps avec une fréquence croissante à mesure qu’ils vieillissent, et l’odeur de la mort s’accroche à eux partout où ils errent."
 
 trait_setite:0 "Setite"
 trait_setite_desc:0 "Le clan des vampires qui croient que leur fondateur était le dieu égyptien Set. La croyance Setite orthodoxe dicte qu’un jour Set reviendra pour gouverner ou consommer le monde, et les Setites dévots préparent la voie à sa résurrection."
 
 trait_setite_raktasadhus:0 "Daitya"
 trait_setite_raktasadhus_desc:0 "La Daitya sont une variante hérétique, dont le fondateur a voyagé de l’Egypte à l’Inde à la poursuite de la connaissance mystique ancienne et la chasse des enfants d’Osiris qui ont été rumeurs d’avoir fui dans l’Himalaya."

 trait_setite_naktanchara:0 "Naktanchara"
 trait_setite_naktanchara_desc:0 "La lignée Naktanchara de la lignée est rejetée car ils se sont convertis au bouddhisme et ont commencé à défier le système de castes de la famille indienne."

 trait_toreador:0 "Toreador"
 trait_toreador_desc:0 "Clan de vampires connu pour être l’un des plus beaux, sensuel, séduisant, émotionnel et glamour de la Famille."
 
 trait_toreador_ashirra:0 "Ray'een al-Fen"
 trait_toreador_ashirra_desc:0 "Les Toreadors islamiques sont les Ray’een al-Fen, communément surnommés scribes, comme la majorité favorisent les calligraphes, les écrivains et les architectes."
 
 trait_toreador_laibon:0 "Ishtarri"
 trait_toreador_laibon_desc:0 "Un des legs du Laibon. Les Ishtarri prétendent descendre de la déesse babylonienne Ishtar, mais manquent actuellement du lien personnel avec l’Afrique que les Guruhi similaires ont."
  
 trait_tremere:0 "Tremere"
 trait_tremere_desc:0 "Clan d'érudit', concentré sur la magie du sang."
 
 trait_truebrujah:0 "Vrai Brujah"
 trait_truebrujah_desc:0 "Une lignée du clan Brujah qui prétend être des descendants du fondateur antédiluvien originel de la lignée et non de son diableriste/enfant Troile. Les Vrai Brujah sont connus pour leur comportement calme et détaché."
 
 trait_tzimisce:0 "Tzimisce"
 trait_tzimisce_desc:0 "Clan de l’étiquette féodale et de la transformation de chair sadique."
 
 trait_tzimisce_laibon:0 "Nagloper"
 trait_tzimisce_laibon_desc:0 "Prenant leur nom du mot Khoikhoin pour 'sorcier maléfique', les Naglopers sont à la hauteur de leur réputation comme le plus horrifiant des Laibon. Ils permettent à la Bête de les dominer, les conduisant à provoquer toute débauche que l’on peut imaginer, et certains n’étaient possibles que dans les cauchemars."
  
 trait_ventrue:0 "Ventrue"
 trait_ventrue_desc:0 "Seigneurs. Royaux, commandants et aristocratiques."
 
 trait_ventrue_ashirra:0 "EL Hijazi"
 trait_ventrue_ashirra_desc:0 "Les El Hijazi sont une lignée distinctive de Ventrue. Contrairement au corps principal du clan - qui sont traditionnellement associés aux Romains ou aux Européens chrétiens - la lignée El Hijazi revendique la descendance de lignées arabes indigènes. Ils ont adopté l’islam et sont acceptés comme faisant partie des Ashirra, mais ils sont aussi relativement peu nombreux."
 
 trait_ventrue_raktasadhus:0 "Danava"
 trait_ventrue_raktasadhus_desc:0 "Les Danava sont une lignée du clan Ventrue qui est centrée autour du sous-continent indien. Sages royaux, ascètes et prêtres, les Danava sont parmi les vampires les plus respectés dans le système des castes des damnés indiens."
  
 trait_kueijin:0 "Kuei-Jin"
 trait_kueijin_desc:0 "On dit que les Kuei-jin sont les descendants corrompus du Wan Xian, les "Dix Mille Héros" choisis par l’Auguste Personnage de Jade pour guider et protéger l’univers dans l’histoire ancienne. Les Wan Xian furent à l’origine choisis par des tests d’habileté et de courage, et nourris du chi ambiant de l’univers. Cependant, ils sont tombés de grâce, apprenant à se nourrir du chi des êtres vivants et corrompant les tests de mérite." 
  
 trait_animalism:0 "Animalisme"
 trait_animalism_desc:0 "Une discipline qui rapproche le vampire de sa nature animaliste. Cela leur permet non seulement de communiquer avec les créatures de la nature et de les dominer, mais leur donne aussi une influence sur la Bête elle-même.\n\nL’Animalisme est particulièrement fréquent parmi les clans les plus éloignés de l’humanité, bien que beaucoup de ses pouvoirs ciblent spécifiquement les Bêtes des mortels et des Caïnites."
 
 trait_animalismadvanced:0 "Animalisme Avancé"
 trait_animalismadvanced_desc:0 "Une discipline qui rapproche le vampire de sa nature animaliste. Cela leur permet non seulement de communiquer avec les créatures de la nature et de les dominer, mais leur donne aussi une influence sur la Bête elle-même.\n\nL’Animalisme est particulièrement fréquent parmi les clans les plus éloignés de l’humanité, bien que beaucoup de ses pouvoirs ciblent spécifiquement les Bêtes des mortels et des Caïnites."
 
 trait_auspex:0 "Augure"
 trait_auspex_desc:0 "Augure est une discipline améliorant les sens et plus notablement la perception d'un vampire.\n\nElle permet de voir l'invisible, entendre le silence et percevoir l'imperceptible."
 
 trait_auspexadvanced:0 "Augure Avancé"
 trait_auspexadvanced_desc:0 "Augure est une discipline améliorant les sens et plus notablement la perception d'un vampire.\n\nElle permet de voir l'invisible, entendre le silence et percevoir l'imperceptible."
 
 trait_celerity:0 "Célérité"
 trait_celerity_desc:0 "La célérité est une discipline qui accorde aux vampires une rapidité et des réflexes surnaturelle.\n\nPour certains Caïnites, le monde des mortels se déplace au ralenti. En période de stress, les vampires avec la célérité peuvent se déplacer avec une vitesse étonnante, devenant flous de mouvement à n’importe qui, mortel ou immortel, qui ne possède pas la discipline."
 
 trait_celerityadvanced:0 "Célérité Avancé"
 trait_celerityadvanced_desc:0 "La célérité est une discipline qui accorde aux vampires une rapidité et des réflexes surnaturelle.\n\nPour certains Caïnites, le monde des mortels se déplace au ralenti. En période de stress, les vampires avec la célérité peuvent se déplacer avec une vitesse étonnante, devenant flous de mouvement à n’importe qui, mortel ou immortel, qui ne possède pas la discipline." 
 
 trait_chimerstry:0 "Chimérie"
 trait_chimerstry_desc:0 "La Chimérie est la Discipline des Ravnos qui fait naître des illusions. De telles images fantômes sont aussi réelles que le savoir-faire caïnite puisse le permettre."
 
 trait_chimerstryadvanced:0 "Chimérie Avancé"
 trait_chimerstryadvanced_desc:0 "Chimérie is la marque de fabrique Discipline du Ravnos qui fait naître des illusions. De telles images fantômes sont aussi réelles que le savoir-faire de la caïnite le permet."
 
 trait_daimoinon:0 "Daimoinon"
 trait_daimoinon_desc:0 "Daimoinon est une discipline diabolique pratiquée uniquement par les Baali et les pires vampires infernalistes. Son pouvoir est celui du diable lui-même, et par l’utilisation de Demonicon, les Baali puisent dans les forces de l’enfer et de ses démons pour démoraliser et paralyser leurs ennemis."
 
 trait_daimoinonadvanced:0 "Daimoinon Avancé" 
 trait_daimoinonadvanced_desc:0 "La Aliénation est une discipline largement connue comme étant la marque de fabrique des Malkavians.\n\n La démentation puise dans la folie du vampire et l’utilise pour obtenir des idées profondes ou infliger de la folie aux autres. Ces pouvoirs sont l’une des principales raisons pour lesquelles le clan Malkavian est souvent considéré à la fois perspicace et très dangereux."  
 
 trait_dementation:0 "Aliénation"
 trait_dementation_desc:0 "L'Aliénation est une discipline largement connue comme étant la marque de fabrique des Malkavians.\n\n La démentation puise dans la folie du vampire et l’utilise pour obtenir des idées profondes ou infliger de la folie aux autres. Ces pouvoirs sont l’une des principales raisons pour lesquelles le clan Malkavian est souvent considéré à la fois perspicace et très dangereux."
 
 trait_dementationadvanced:0 "Aliénation Avancé"
 trait_dementationadvanced_desc:0 "Aliénation est une discipline largement connue comme étant la marque de fabrique des Malkavians.\n\n La démentation puise dans la folie du vampire et l’utilise pour obtenir des idées profondes ou infliger de la folie aux autres. Ces pouvoirs sont l’une des principales raisons pour lesquelles le clan Malkavian est souvent considéré à la fois perspicace et très dangereux."
 
 trait_dominate:0 "Domination"
 trait_dominate_desc:0 "La Domination est une discipline qui submerge l’esprit d’une autre personne avec la volonté du vampire, forçant les victimes à penser ou à agir selon le décret du vampire."
 
 trait_dominateadvanced:0 "Domination Avancé"
 trait_dominateadvanced_desc:0 "Domination est une discipline qui submerge l’esprit d’une autre personne avec la volonté du vampire, forçant les victimes à penser ou à agir selon le décret du vampire."
 
 trait_fortitude:0 "Force d'Âme"
 trait_fortitude_desc:0 "La Force d'Âme est une Discipline qui accorde la force surnaturelle, même au point de résister au feu et à la lumière du soleil.\n\nForce d'Âme peut également donner une protection contre la manipulation et le contrôle tels que des disciplines de Domination et de Présence."
 
 trait_fortitudeadvanced:0 "Force d'Âme Avancé"
 trait_fortitudeadvanced_desc:0 "La Force d'Âme est une Discipline qui accorde la force surnaturelle, même au point de résister au feu et à la lumière du soleil.\n\nForce d'Âme peut également donner une protection contre la manipulation et le contrôle tels que des disciplines de Domination et de Présence."

 trait_flight:0 "Vol"
 trait_flight_desc:0 "Le vol est une discipline surnaturelle, unique à la lignée des gargouilles, qui permet à ces vampires de voler.\n\nLes plus lourd pour voler par des moyens naturels, les Gargouilles pierreux doivent utiliser cette Discipline ; les autres Caïnites capables de voler (en se transformant en chauve-souris ou en brume en utilisant Protéisme, par exemple) n’en ont pas besoin et ne peuvent l’apprendre."
 
 trait_flightadvanced:0 "Vol Avancé"
 trait_flightadvanced_desc:0 "Vol est une discipline surnaturelle, unique à la lignée des gargouilles, qui permet à ces vampires de voler.\n\nLes plus lourd pour voler par des moyens naturels, les Gargouilles pierreux doivent utiliser cette Discipline ; les autres Caïnites capables de voler (en se transformant en chauve-souris ou en brume en utilisant Protéisme, par exemple) n’en ont pas besoin et ne peuvent l’apprendre."
 
 trait_melpominee:0 "Melpominée"
 trait_melpominee_desc:0 "La Discipline de Melpominée est apparue simultanément avec les Filles de la Cacophonie et est intrinsèquement liée à cette lignée. Il permet à ses possesseurs d’utiliser la parole et la chanson pour une variété d’effets surnaturels."
 
 trait_melpomineeadvanced:0 "Melpominée Avancé"
 trait_melpomineeadvanced_desc:0 "La Discipline de Melpominée est apparue simultanément avec les Filles de la Cacophonie et est intrinsèquement liée à cette lignée. Il permet à ses possesseurs d’utiliser la parole et la chanson pour une variété d’effets surnaturels."
 
 trait_mytherceria:0 "Mythercellerie"
 trait_mytherceria_desc:0 "Mythercellerie est une discipline qui se manifeste chez les vampires de sang féerique tels que les Kiasyd et les Maeghar. Il accorde aux vampires des sens mystiques, la capacité de voler la connaissance, et d’autres pouvoirs attribués aux fée."
 
 trait_mytherceriaadvanced:0 "Mythercellerie Avancé"
 trait_mytherceriaadvanced_desc:0 "Mythercellerie est une discipline qui se manifeste dans les vampires de sang féerique tels que le Kiasyd et Maeghar. Il accorde aux vampires des sens mystiques, la capacité de voler la connaissance, et d’autres pouvoirs attribués aux fée."

 trait_necromancy:0 "Nécromancie"
 trait_necromancy_desc:0 "La nécromancie est une forme de magie du sang qui traite exclusivement du monde des morts : les spectres et les terres des ombres. Tout comme il existe différents styles de thaumaturgie conventionnelle du sang, il existe une variété de pratiques de nécromancie. Il est principalement pratiqué par le Giovanni."
 
 trait_necromancyadvanced:0 "Necromancie Avancé"
 trait_necromancyadvanced_desc:0 "La nécromancie est une forme de magie du sang qui traite exclusivement du monde des morts : les spectres et les terres des ombres. Tout comme il existe différents styles de thaumaturgie conventionnelle du sang, il existe une variété de pratiques de nécromancie. Il est principalement pratiqué par le Giovanni." 

 trait_obeah:0 "Obeah"
 trait_obeah_desc:0 "Obeah est la discipline unique des Salubri, aussi connu sous le nom de Valeren Voie du Guérrisseurs.\n\nObeah est né avec Saulot dans ses voyages à l’Est en apprenant de la Kuei-jin l’utilisation de la Perle du Dragon. Apprendre Obeah provoque le développement d’un troisième œil au milieu du front."
 
 trait_obeahadvanced:0 "Obeah Avancé"
 trait_obeahadvanced_desc:0 "Obeah est la discipline unique du Salubri, aussi connu sous le nom de Valeren Path of the Healer.\n\nObeah est né avec Saulot dans ses voyages à l’Est en apprenant de la Kuei-jin l’utilisation de la Perle du Dragon. Apprendre Obeah provoque le développement d’un troisième œil au milieu du front."

 trait_obfuscate:0 "Occultation"
 trait_obfuscate_desc:0 "L'Occultation est une discipline qui permet aux vampires de se cacher, tromper l’esprit des autres, ou les faire ignorer ce que l’utilisateur ne veut pas être vu.\n\nL'Occultation fait partie de la malédiction de Cain sur les Antédiluviens en les effaçant de la création."
 
 trait_obfuscateadvanced:0 "Occultation Avancé"
 trait_obfuscateadvanced_desc:0 "L'Occultation est une discipline qui permet aux vampires de se cacher, tromper l’esprit des autres, ou les faire ignorer ce que l’utilisateur ne veut pas être vu.\n\nL'Occultation fait partie de la malédiction de Cain sur les Antédiluviens en les effaçant de la création."

 trait_obtenebration:0 "Obtenebration"
 trait_obtenebration_desc:0 "Obtenebration est dit pour plus damner le vampire qui l’utilise, qui se retire plus loin de la grâce de Dieu et dans l’attraction sombre de l’Abîme. Pour cette raison, l’utilisateur est évité par les animaux et les humains. L’obscurité anormale invoquée par Obtenebration est extrêmement effrayante pour les mortels, les animaux, et même d’autres Caïnites peu habitués à son utilisation."
 
 trait_obtenebrationadvanced:0 "Obtenebration Avancé"
 trait_obtenebrationadvanced_desc:0 "Obtenebration est dit pour plus damner le vampire qui l’utilise, qui se retire plus loin de la grâce de Dieu et dans l’attraction sombre de l’Abîme. Pour cette raison, l’utilisateur est évité par les animaux et les humains. L’obscurité anormale invoquée par Obtenebration est extrêmement effrayante pour les mortels, les animaux, et même d’autres Caïnites peu habitués à son utilisation."

 trait_potence:0 "Puissance"
 trait_potence_desc:0 "La Puissance est la Discipline qui donne aux vampires une vigueur physique et une force surnaturelle. Les vampires avec la discipline de puissance possèdent des prouesses physiques au-delà des limites mortelles."
 
 trait_potenceadvanced:0 "Puissance Avancé"
 trait_potenceadvanced_desc:0 "La Puissance est la Discipline qui donne aux vampires une vigueur physique et une force surnaturelle. Les vampires avec la discipline de puissance possèdent des prouesses physiques au-delà des limites mortelles."

 trait_presence:0 "Présence"
 trait_presence_desc:0 "La Présence est la discipline de l’allure surnaturelle et de la manipulation émotionnelle qui permet à la parenté d’attirer, de balancer et de contrôler les foules.\n\nLa présence a adouci la malédiction de Dieu sur les caïnites en ce sens qu’elle fait du vampire le centre de l’attention. Soit en fascinant, en séduisant, ou en intimidant ceux qui se trouvent à proximité."
 
 trait_presenceadvanced:0 "Présence Avancé" 
 trait_presenceadvanced_desc:0 "La Présence est la discipline de l’allure surnaturelle et de la manipulation émotionnelle qui permet à la parenté d’attirer, de balancer et de contrôler les foules.\n\nLa présence a adouci la malédiction de Dieu sur les caïnites en ce sens qu’elle fait du vampire le centre de l’attention. Soit en fascinant, en séduisant, ou en intimidant ceux qui se trouvent à proximité." 
 
 trait_protean:0 "Protéisme"
 trait_protean_desc:0 "Protéisme est une discipline qui donne aux vampires la capacité de changer de forme, de la croissance des griffes sauvages à l’évaporation dans un nuage de brume.\n\nProtéisme fait partie de la malédiction de Dieu sur Caine dans l’aspect qu’il enlève la façade de l’humanité chaque vampire doit soutenir, révélant la Bête dans son âme."
 
 trait_proteanadvanced:0 "Protéisme Avancé"
 trait_proteanadvanced_desc:0 "Protéisme est une discipline qui donne aux vampires la capacité de changer de forme, de la croissance des griffes sauvages à l’évaporation dans un nuage de brume.\n\nProtéisme fait partie de la malédiction de Dieu sur Caine dans l’aspect qu’il enlève la façade de l’humanité chaque vampire doit soutenir, révélant la Bête dans son âme."

 trait_quietus:0 "Quietus"
 trait_quietus_desc:0 "Quietus est la discipline signature des Assamites qui leur accorde une influence sur le sang des autres.\n\nBien que chacune des castes assamites possède Quietus en tant que discipline dans le clan, elle est principalement connue pour être l’outil d’un assassin dans les mains de la caste des Guerriers, et les pouvoirs de niveau inférieur sont largement orientés vers cette fin."
 
 trait_quietusadvanced:0 "Quietus Avancé"
 trait_quietusadvanced_desc:0 "Quietus est la discipline signature des Assamites qui leur accorde une influence sur le sang des autres.\n\nBien que chacune des castes assamites possède Quietus en tant que discipline dans le clan, elle est principalement connue pour être l’outil d’un assassin dans les mains de la caste des Guerriers, et les pouvoirs de niveau inférieur sont largement orientés vers cette fin."

 trait_serpentis:0 "Serpentis"
 trait_serpentis_desc:0 "Serpentis est la marque de fabriquedes Disciples du clan Set. Il fournit principalement des capacités de changements de formes, bien qu’il englobe également la corruption et d’autres caractéristiques associées aux serpents. n nSerpentis a une signification presque religieuse pour le Clan, bien que les scientifiques apparentés supposent une relation avec les pouvoirs de changement de forme de Protéisme."
 
 trait_serpentisadvanced:0 "Serpentis Avancé"
 trait_serpentisadvanced_desc:0 "Serpentis est la marque de fabriquedes Disciples du clan Set. Il fournit principalement des capacités de changements de formes, bien qu’il englobe également la corruption et d’autres caractéristiques associées aux serpents. n nSerpentis a une signification presque religieuse pour le Clan, bien que les scientifiques apparentés supposent une relation avec les pouvoirs de changement de forme de Protéisme."

 trait_spiritus:0 "Spiritus"
 trait_spiritus_desc:0 "Spiritus est une discipline unique à la lignée des Ahrimanes qui leur permet d’interagir avec les esprits animalistes. À ses niveaux les plus fondamentaux, il permet au vampire de parler et d’invoquer des esprits, mais à des niveaux plus élevés, le pouvoir peut être canalisé à partir d’eux pour renforcer l’Ahrimane."
 
 trait_spiritusadvanced:0 "Spiritus Avancé"
 trait_spiritusadvanced_desc:0 "Spiritus est une discipline unique à la lignée des Ahrimanes qui leur permet d’interagir avec les esprits animalistes. À ses niveaux les plus fondamentaux, il permet au vampire de parler et d’invoquer des esprits, mais à des niveaux plus élevés, le pouvoir peut être canalisé à partir d’eux pour renforcer l’Ahrimane.""

 trait_temporis:0 "Temporis"
 trait_temporis_desc:0 "Temporis est une discipline unique aux Véritable Brujah. Soi-disant un raffinement de la célérité, Temporis accorde aux Cainites la capacité de manipuler le flux du temps lui-même."
 
 trait_temporisadvanced:0 "Temporis Avancé"
 trait_temporisadvanced_desc:0 "Temporis est une discipline unique aux Véritable Brujah. Soi-disant un raffinement de la célérité, Temporis accorde aux Cainites la capacité de manipuler le flux du temps lui-même."

 trait_thinbloodalchemy:0 "Alchimie des Sangs Clairs"
 trait_thinbloodalchemy_desc:0 "Discipline exclusive pour les Sangs Clairs, elle leur permet d’imiter les pouvoirs des disciplines de vampires pur sang.\n\nL'Alchimie du sang clair est une pratique en deux étapes : distillation d’une concoction sanguine à l’aide de la formule appropriée, puis activation de ladite infusion en la buvant et en canalisant son pouvoir."
 
 trait_thinbloodalchemyadvanced:0 "Alchimie du sang clair Avancé"
 trait_thinbloodalchemyadvanced_desc:0 "Discipline exclusive pour les Sangs Clairs, elle leur permet d’imiter les pouvoirs des disciplines de vampires pur sang.\n\nL'Alchimie du sang clair est une pratique en deux étapes : distillation d’une concoction sanguine à l’aide de la formule appropriée, puis activation de ladite infusion en la buvant et en canalisant son pouvoir."

 trait_valeren:0 "Valeren"
 trait_valeren_desc:0 "Valeren est la discipline mystique du Salubri. Dans sa forme la plus élémentaire, Valeren offre un contrôle sur la douleur et une capacité martiale accrue, permettant apparemment aux guerriers de tirer parti de la puissance du ciel pour vaincre leurs ennemis."
 
 trait_valerenadvanced:0 "Valeren Avancé" 
 trait_valerenadvanced_desc:0 "Valeren est la discipline mystique du Salubri. Dans sa forme la plus élémentaire, Valeren offre un contrôle sur la douleur et une capacité martiale accrue, permettant apparemment aux guerriers de tirer parti de la puissance du ciel pour vaincre leurs ennemis." 

 trait_vicissitude:0 "Vicissitude"
 trait_vicissitude_desc:0 "Un des pouvoirs les plus horribles à la disposition des Caïnites, Vicissitude est le pouvoir signature des Tzimicès et est presque inconnu en dehors du clan. Avec elle, un artisan expérimenté peut sculpter la chair et l’os d’un sujet, en faire une créature de beauté extraterrestre ou les ronger en une monstruosité déformée."
 
 trait_vicissitudeadvanced:0 "Vicissitude Avancé" 
 trait_vicissitudeadvanced_desc:0 "Un des pouvoirs les plus horribles à la disposition des Caïnites, Vicissitude est le pouvoir signature des Tzimicès et est presque inconnu en dehors du clan. Avec elle, un artisan expérimenté peut sculpter la chair et l’os d’un sujet, en faire une créature de beauté extraterrestre ou les ronger en une monstruosité déformée."

 trait_visceratika:0 "Visceratika"
 trait_visceratika_desc:0 "La discipline de Visceratika est la possession exclusive de la lignée des gargouilles et est une extension de leur affinité naturelle pour la pierre, la terre et les choses faites de celle-ci.\n\nVisceratika dispose de capacités de changements de formes similaires à celles de Protéisme, mais avec une plus grande emphase sur la défense."
 
 trait_visceratikaadvanced:0 "Visceratika Avancé"
 trait_visceratikaadvanced_desc:0 "La discipline de Visceratika est la possession exclusive de la lignée des gargouilles et est une extension de leur affinité naturelle pour la pierre, la terre et les choses faites de celle-ci.\n\nVisceratika dispose de capacités de changements de formes similaires à celles de Protéisme, mais avec une plus grande emphase sur la défense."

 trait_bloodsorcery:0 "Magie du Sang"
 trait_bloodsorcery_desc:0 "La magie du sang fait référence à la magie exercée par les vampires, alimentée par des pratiques religieuses ou occultes et la puissance de Cainite vitae.\n\nPar la pratique de la magie du sang, un caïnite peut invoquer le feu, contrôler le temps et faire beaucoup d’autres choses qui ne sont pas naturelles, même par des normes vampiriques."
 
 trait_bloodsorceryadvanced:0 "Magie du Sang Avancé"
 trait_bloodsorceryadvanced_desc:0 "La magie du sang fait référence à la magie exercée par les vampires, alimentée par des pratiques religieuses ou occultes et la puissance de Cainite vitae.\n\nPar la pratique de la magie du sang, un caïnite peut invoquer le feu, contrôler le temps et faire beaucoup d’autres choses qui ne sont pas naturelles, même par des normes vampiriques." 
 
 trait_oblivion:0 "Oblivion" 
 trait_oblivion_desc:0 "L’Oblivion est une Discipline qui permet à ses utilisateurs de puiser dans quelque chose de tout à fait anormal ; faisant jaillir des ténèbres surnaturelles de l’Abîme et asservissant des spectres à travers l’Oblivion."

 trait_oblivionadvanced:0 "Oblivion Avancé" 
 trait_oblivionadvanced_desc:0 "L’Oblivion est une Discipline qui permet à ses utilisateurs de puiser dans quelque chose de tout à fait anormal ; faisant jaillir des ténèbres surnaturelles de l’Abîme et asservissant des spectres à travers l’Oblivion."

 trait_mortis:0 "Mortis"
 trait_mortis_desc:0 "La discipline Mortis est enracinée dans le contrôle et la manipulation de la mort. Plus précisément, Mortis est une forme de magie du sang traitant des cadavres et de leurs conditions après la mort. Le clan cappadoce est la seule famille à posséder les affinités naturelles pour cette discipline."
 
 trait_mortisadvanced:0 "Mortis Avancé" 
 trait_mortisadvanced_desc:0 "La discipline Mortis est enracinée dans le contrôle et la manipulation de la mort. Plus précisément, Mortis est une forme de magie du sang traitant des cadavres et de leurs conditions après la mort. Le clan cappadoce est la seule famille à posséder les affinités naturelles pour cette discipline."

 trait_nihilistics:0 "Nihilistics"
 trait_nihilistics_desc:0 "La nihilistique est une discipline unique au Nagaraja qui leur permet de pénétrer le Linceul et de canaliser l’Oblivion. Bien que certaines de ses utilisations concernent les habitants des Enfers, beaucoup de ses pouvoirs permettent au vampire d’attirer l’Oblivion dans le monde physique."
 
 trait_nihilisticsadvanced:0 "Nihlistics Avancé" 
 trait_nihilisticsadvanced_desc:0 "La nihilistique est une discipline unique au Nagaraja qui leur permet de pénétrer le Linceul et de canaliser l’Oblivion. Bien que certaines de ses utilisations concernent les habitants des Enfers, beaucoup de ses pouvoirs permettent au vampire d’attirer l’Oblivion dans le monde physique."

 trait_thanatosis:0 "Thanatosis"
 trait_thanatosis_desc:0 "La thanatose est la discipline exclusive de la lignée Samedi qui consiste à manipuler les effets de la mort et de la décomposition. À certains égards, il est similaire à la nécromancie. La discipline traite de l’apparition de la mort sous toutes ses formes. Les pratiquants sont obsédés par l’apparition de la mort, se trouvant ignorés par tous sauf les plus tordus de la parenté."
 
 trait_thanatosisadvanced:0 "Thanatosis Avancé" 
 trait_thanatosisadvanced_desc:0 "La thanatose est la discipline exclusive de la lignée Samedi qui consiste à manipuler les effets de la mort et de la décomposition. À certains égards, il est similaire à la nécromancie. La discipline traite de l’apparition de la mort sous toutes ses formes. Les pratiquants sont obsédés par l’apparition de la mort, se trouvant ignorés par tous sauf les plus tordus de la parenté."

 trait_deimos:0 "Deimos"
 trait_deimos_desc:0 "Deimos est une discipline créée par les Lamia dans leurs recherches sur les morts et sur Lilith. Il fournit aux vampires un certain contrôle sur leurs propres formes sans vie ainsi que sur les esprits sombres et les auspices de la Mère Noire. Il est également connu comme le Sentier des Quatre Humeurs."
 
 trait_deimosadvanced:0 "Deimos Avancé" 
 trait_deimosadvanced_desc:0 "Deimos est une discipline créée par les Lamia dans leurs recherches sur les morts et sur Lilith. Il fournit aux vampires un certain contrôle sur leurs propres formes sans vie ainsi que sur les esprits sombres et les auspices de la Mère Noire. Il est également connu comme le Sentier des Quatre Humeurs."

 trait_abombo:0 "Abombo"
 trait_abombo_desc:0 "Un chemin pratiqué par le Laibon d’Afrique, centré sur le lien entre les morts et les vivants ; semblable mais distinct du Chemin du Cénotaphe de la Nécromancie. Il permet au nécromancien de contrôler et même de réattribuer l’entrave d’un fantôme."
 
 trait_abomboadvanced:0 "Abombo Avancé" 
 trait_abomboadvanced_desc:0 "Un chemin pratiqué par le Laibon d’Afrique, centré sur le lien entre les morts et les vivants ; semblable mais distinct du Chemin du Cénotaphe de la Nécromancie. Il permet au nécromancien de contrôler et même de réattribuer l’entrave d’un fantôme

 trait_abombwe:0 "Abombwe"
 trait_abombwe_desc:0 "Abombwe est une discipline pratiquée par l’héritage Akunanse du Laibon et la lignée mystérieuse du Bonsam du Moyen Age."
 
 trait_abombweadvanced:0 "Abombwe Avancé"
 trait_abombweadvanced_desc:0 "Abombwe est une discipline pratiquée par l’héritage Akunanse du Laibon et la lignée mystérieuse du Bonsam du Moyen Age. Abombwe utilise la connexion étroite du vampire à et contrôle sur leurs propres Bêtes (et celle des autres), ainsi que canaliser la puissance de la Bête à des fins diverses." 
 
 trait_sielanicthaumaturgy:0 "Thaumaturgie Sielanic"
 trait_sielanicthaumaturgy_desc:0 "La thaumaturgie Sielanic est une forme de thaumaturgie inspirée par le dieu païen Telyavel et pratiquée par le Telyavelic Tremere, une lignée du Tremere originaire de Lituanie.\n\nLes Telvays ont appris à utiliser la puissance de siela, l’esprit animiste latent dans la terre, la pierre, les plantes et les animaux de leur patrie d’adoption."
 
 trait_sielanicthaumaturgyadvanced:0 " Thaumaturgie Sielanic Avancé"
 trait_sielanicthaumaturgyadvanced_desc:0 "La thaumaturgie Sielanic est une forme de thaumaturgie inspirée par le dieu païen Telyavel et pratiquée par le Telyavelic Tremere, une lignée du Tremere originaire de Lituanie.\n\nLes Telvays ont appris à utiliser la puissance de siela, l’esprit animiste latent dans la terre, la pierre, les plantes et les animaux de leur patrie d’adoption." 
 
 trait_duranki:0 "Dur-An-Ki"
 trait_duranki_desc:0 "Dur-An-Ki (Maître du Ciel et de la Terre) est une forme de magie du sang pratiquée par la famille du Moyen-Orient et de l’Afrique. C’est une forme de magie très ancienne, puisant dans une grande variété de traditions religieuses mortelles, et prédatant de la Sorcellerie, à laquelle elle ressemble à bien des égards."
 
 trait_durankiadvanced:0 "Dur-An-Ki Avancé"
 trait_durankiadvanced_desc:0 "Dur-An-Ki (Maître du Ciel et de la Terre) est une forme de magie du sang pratiquée par la famille du Moyen-Orient et de l’Afrique. C’est une forme de magie très ancienne, puisant dans une grande variété de traditions religieuses mortelles, et prédatant de la Sorcellerie, à laquelle elle ressemble à bien des égards."
 
 trait_ogham:0 "Ogham"
 trait_ogham_desc:0 "Ogham est une forme très limitée de Magie du Sang basée sur les runes celtiques pratiquées par le Lhiannan qui puise dans l’esprit tesson de la lignée, concédant le pouvoir sur leur territoire."
 
 trait_oghamadvanced:0 "Ogham Avancé"
 trait_oghamadvanced_desc:0 "Ogham est une forme très limitée de Magie du Sang basée sur les runes celtiques pratiquées par le Lhiannan qui puise dans l’esprit tesson de la lignée, concédant le pouvoir sur leur territoire."
 
 trait_koldunicorcery:0 "Koldunism"
 trait_koldunicorcery_desc:0 "Sorcellerie Koldunic ou koldunisme est une forme de magie du sang caïnite pratiquée par le Tzimisce. n nKoldunic Sorcellerie est similaire à Sorcellerie dans l’idée, mais très différent dans la pratique."
 
 trait_koldunicorceryadvanced:0 "Koldunism Avancé"
 trait_koldunicorceryadvanced_desc:0 "Sorcellerie Koldunic ou koldunisme est une forme de magie du sang caïïtite pratiquée par le Tzimisce. n nKoldunic Sorcellerie est similaire à Sorcellerie dans l’idée, mais très différent dans la pratique."
 
 trait_abyssmysticism:0 "Mysticisme Abyssal"
 trait_abyssmysticism_desc:0 "Abyss Mysticism est une forme de magie du sang, dérivée de la discipline Obtenebration. De toute évidence, cet art obscur est pratiqué presque exclusivement par les membres du clan Lasombra. Ceux qui pratiquent ces arts mystiques sont appelés les Ombrés."
 
 trait_abyssmysticismadvanced:0 "Mysticisme Abyssal Avancé"
 trait_abyssmysticismadvanced_desc:0 "Abyss Mysticism est une forme de magie du sang, dérivée de la discipline Obtenebration. De toute évidence, cet art obscur est pratiqué presque exclusivement par les membres du clan Lasombra. Ceux qui pratiquent ces arts mystiques sont appelés les Ombrés." 

 trait_sadhana:0 "Sadhana"
 trait_sadhana_desc:0 "La sâdhanâ est une forme de magie du sang hindoue qui remonte à des milliers d’années avant l’importante thaumaturgie hermétique du clan Tremere. Il est pratiqué par les brahmanes hindous de l’Inde, qui sont connus sous le nom de rakta-sadhus ou même de brahmane sanguinaire."
 
 trait_sadhanaadvanced:0 "Sadhana Avancé"
 trait_sadhanaadvanced_desc:0 "La sâdhanâ est une forme de magie du sang hindoue qui remonte à des milliers d’années avant l’importante thaumaturgie hermétique du clan Tremere. Il est pratiqué par les brahmanes hindous de l’Inde, qui sont connus sous le nom de rakta-sadhus ou même de brahmane sanguinaire."
 
 trait_sihr:0 "Sihr"
 trait_sihr_desc:0 "Sihr (qui signifie 'sort' en arabe) est une discipline de la magie du sang largement pratiquée dans le monde islamique. Au Moyen Âge, sa différence avec d’autres formes de magie du sang était que son utilisateur avait besoin d’avoir une cote de route élevée sur le chemin de la communauté ou sur la route du ciel pour effectuer la magie."
 
 trait_sihradvanced:0 "Sihr Avancé"
 trait_sihradvanced_desc:0 "Sihr (qui signifie 'sort' en arabe) est une discipline de la magie du sang largement pratiquée dans le monde islamique. Au Moyen Âge, sa différence avec d’autres formes de magie du sang était que son utilisateur avait besoin d’avoir une cote de route élevée sur le chemin de la communauté ou sur la route du ciel pour effectuer la magie." 
 
 trait_akhu:0 "Akhu"
 trait_akhu_desc:0 "Akhu, souvent appelé Sorcellerie Setite par des étrangers, est l’ancienne tradition magique des Disciples de Set.\n\nDans l’apogée de l’Égypte, avant sa conversion au christianisme par l’Empire romain, la magie était monnaie courante, pratiquée tant par les mortels que par les vampires.""
 
 trait_akhuadvanced:0 "Akhu Avancé"
 trait_akhuadvanced_desc:0 "Akhu, souvent appelé Sorcellerie Setite par des étrangers, est l’ancienne tradition magique des Disciples de Set.\n\nDans l’apogée de l’Égypte, avant sa conversion au christianisme par l’Empire romain, la magie était monnaie courante, pratiquée tant par les mortels que par les vampires."
 
 trait_darkthaumaturgy:0 "Thaumaturgie Noire"
 trait_darkthaumaturgy_desc:0 "Thaumaturgie Noire est le nom donné à la thaumaturgie apprise des démons.\n\nLes vampires peuvent faire des pactes avec les démons afin d’apprendre les secrets de la magie du sang, tout comme les mages mortels le font pour apprendre d’autres magiques infernales ; ils le font au prix de l’âme qu’ils ont laissée, scellant un marché qui est une voie rapide vers le pouvoir magique."
 
 trait_darkthaumaturgyadvanced:0 "Thaumaturgie Noire Avancé"
 trait_darkthaumaturgyadvanced_desc:0 "Thaumaturgie Noire est le nom donné à thaumaturgie apprise des démons.\n\nLes vampires peuvent faire des pactes avec les démons afin d’apprendre les secrets de la magie du sang, tout comme les mages mortels le font pour apprendre d’autres magiques infernales ; ils le font au prix de l’âme qu’ils ont laissée, scellant un marché qui est une voie rapide vers le pouvoir magique."
 
 trait_thaumaturgy:0 "Thaumaturgie"
 trait_thaumaturgy_desc:0 "La thaumaturgie est la forme de magie du sang étroitement gardée pratiquée par le clan vampirique Tremere.\n\nCréé par une recherche exhaustive et une vaste expérimentation, Sorcellerie utilise les principes de la magie hermétique utilisés par la Maison Tremere lorsqu’elle était encore une cabale de mages, adaptés pour être alimentés par le pouvoir magique inhérent de Vitae plutôt que par Quintessence."
 
 trait_thaumaturgyadvanced:0 "Thaumaturgie Avancé"
 trait_thaumaturgyadvanced_desc:0 "La thaumaturgie est la forme de magie du sang étroitement gardée pratiquée par le clan vampirique Tremere.\n\nCréé par une recherche exhaustive et une vaste expérimentation, Sorcellerie utilise les principes de la magie hermétique utilisés par la Maison Tremere lorsqu’elle était encore une cabale de mages, adaptés pour être alimentés par le pouvoir magique inhérent de Vitae plutôt que par Quintessence."
 
 trait_fae:0 "Fée"
 trait_fae_desc:0 "Une créature surnaturelle"
 
 trait_supehunter:0 "Chasseur"
 trait_supehunter_desc:0 "Un chasseur de monstre."
 
 trait_torpor:0 "Torpeur"
 trait_torpor_desc:0 "La torpeur n’est qu’un état de stase plus profond que celui que les vampires dorment normalement le jour. La durée de la torpeur dépend de l’évaluation de l’Humanité ou du Sentier du vampire et peut durer d’un jour à plus d’un millénaire. On dit que les anciens vampires ressentent souvent le besoin d’entrer volontairement dans la torpeur, aussi appelée le sommeil des âges."
 
 trait_canon:0 "Canon"
 trait_canon_desc:0 ""
 
 trait_demon:0 "Démon"
 trait_demon_desc:0 "Les démons sont des anges déchus qui ont choisi de se ranger du côté de Lucifer et de l’humanité plutôt que de Dieu dans les premiers jours de la Création. Comme punition pour leur rébellion et leur déloyauté, l’Archange Michel a chassé ces anges du Ciel et dans les Abysses."
 
 trait_vampgeneration1:0 "1ère Génération"
 trait_vampgeneration1_desc:0 "Caïn, le premier vampire."
 
 trait_vampgeneration2:0 "2ème Génération"
 trait_vampgeneration2_desc:0 "Les trois enfants de Caïn. Assassinés par la Troisième Génération."
 
 trait_vampgeneration3:0 "3ème Génération"
 trait_vampgeneration3_desc:0 "Cette génération a fondé les clans de la parenté"

 trait_vampgeneration4:0 "4ème Génération"
 trait_vampgeneration4_desc:0 "Cette génération a fondé la plupart des lignées, les maisons dynastiques des morts-vivants."

 trait_vampgeneration5:0 "5ème Génération"
 trait_vampgeneration5_desc:0 "Vampire de la 5ème génération."

 trait_vampgeneration6:0 "6ème Génération"
 trait_vampgeneration6_desc:0 "Vampire de la 6ème génération."

 trait_vampgeneration7:0 "7ème Génération"
