 trait_revenant:0 "Revenant"
 trait_revenant_desc:0 "Une goule indépendante née avec du sang de vampire dans les veines."

 trait_zadruga:0 "Zadruga"
 trait_zadruga_desc:0 "Un terme tzimisce pour les goules héréditaires. De tous les clans, les Tzimisce ont élevé les familles les plus goules."

 trait_oathbreaker:0 "Parjure"
 trait_oathbreaker_desc:0 "Ce personnage a rompu un serment."
 
 trait_regnant:0 "Regnant"
 trait_regnant_desc:0 "Ce personnage a créé une goule."
 
 trait_massregnant:0 "Regnant de masse"
 trait_massregnant_desc:0 "Ce personnage a créé des goules en masse. C’est généralement une violation de la Mascarade."
 
 trait_unbondable:0 "Inliable"
 trait_unbondable_desc:0 "Ce personnage ne peut pas être lié par le sang."
 
 trait_exposed:0 "Exposé"
 trait_exposed_desc:0 "La nature surnaturelle de cette créature a été révélée aux mortels. Les chasseurs planifieront des attaques contre eux."
 
 trait_nagaraja:0 "Nagaraja"
 trait_nagaraja_desc:0 "Les Nagaraja sont une lignée bizarre de vampires mangeurs de chair, redoutés par la parenté de tous les côtés du Jyhad."
 
 trait_hecata:0 "Hecata"
 trait_hecata_desc:0 "Ils ne sont pas un clan entièrement organique dérivant d’un seul antédiluvien et une lignée ininterrompue, mais sont constitués du Giovanni et les restes de l’ancien clan Cappadoce et leurs lignées apparentées ; ainsi que le Nagaraja malgré un manque de connexion avec antédiluvien."

 trait_impundulu:0 "Impundulu"
 trait_impundulu_desc:0 "Une lignée de vampires liés à un clan de sorcières mortelles, et ils sont comptés comme l’un des legs du Laibon. Impundulu était un nécromancien puissant dans la vie, marié à une sorcière de vie tout aussi puissant nommé Bomkazi."  
 
 trait_sire:0 "Sire"
 trait_sire_desc:0 "Ce vampire en a créé un autre."
 
 trait_masssire:0 "Sire de masse"
 trait_masssire_desc:0 "Ce vampire a créé un grand nombre de vampires. La plupart des voies considèrent cela comme une violation de la Mascarade."
 
 trait_lamia:0 "Lamia"
 trait_lamia_desc:0 "Les Lamia étaient une lignée de Caïnites dévoués à la défense du clan Cappadoce, bien qu’à l’origine ils étaient un groupe de cultes qui prétendaient être descendants de Lilith, la première épouse d’Adam."
 
 trait_gangrel_greek:0 " Gangrel Grec"
 trait_gangrel_greek_desc:0 "Le Gangrel grec étaient une ramification qui a commencé dans les âges sombres.\n\nGangrel ont été cachés dans les villes de l’homme avant même Babylone. Au fil des siècles, ces Gangrel se sont concentrés sur la survie dans un environnement différent – un environnement chargé de dangers uniques."
 
 trait_ahrimane:0 "Ahrimane"
 trait_ahrimane_desc:0 "Les Ahrimanes sont une lignée rare, exclusivement féminine de Kindred qui existait à l’origine pendant les âges sombres, dirigée par une femme appelée Adisa.\n\nL’histoire des Ahrimanes, comme ils le raconteraient, commence avec Adisa, une Valkyrje et fille de Freyja, la déesse nordique."

 trait_patron:0 "Patron"
 trait_patron_desc:0 "Une personne remarquable investie dans le monde des ténèbres"

