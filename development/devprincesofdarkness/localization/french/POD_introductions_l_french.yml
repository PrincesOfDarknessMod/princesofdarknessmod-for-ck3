 podintroductions.1.t:0 "Les Roses Noires"
 podintroductions.1.desc:0 "Alors que la France des mortels chancèle dans le chaos de la croisade albigeoise, la France des Caïnites ne se porte pas mieux. Deux ans plus tôt, Alexandre, un Ventrue de 4ème génération, jouissait encore de son titre de Prince de Paris et de France. Puis, victime d’un coup d’état fomenté par son propre infant, Geoffrey du Temple, et son alliée, la Toréador Salianna, le vieux vampire perdit son trône. \nAlors que la France des mortels chancèle dans le chaos de la croisade albigeoise, la France des Caïnites ne se porte pas mieux. Deux ans plus tôt, Alexandre, un Ventrue de 4ème génération, jouissait encore de son titre de Prince de Paris et de France. Puis, victime d’un coup d’état fomenté par son propre infant, Geoffrey du Temple, et son alliée, la Toréador Salianna, le vieux vampire perdit son trône. \nAu sud, Esclarmonde de Toulouse utilise la révolte Cathare à ses propres fins, attisant l’ire des seigneurs du nord. Un jour ou l’autre, l’attention se tournera peut-être exclusivement vers elle, et s’en suivrait le déferlement des armées et des intrigues mortelles. \n\nDe cette situation, un nouveau dirigeant, meilleur qu'Alexandre, émergera-t-il au-dessus du chaos, ou le pays sombrera-t-il entièrement en sa fin ?""
 podintroductions.1.a:0 "La France se porterait mieux sous ma bannière.""
 podintroductions.2.t:0 "L'apathique Dieu-Roi d'Angleterre"
 podintroductions.2.desc:0 "L'histoire vampirique de Bretagne est fondamentalement liée à Mithras. Perse, puis romain, et enfin divinité, cet infant de l’antédiluvien Ventrue atteignit les sommets dignes de son clan, en étendant un culte à sa gloire à travers pratiquement toute l’Europe. \nL'histoire vampirique de Bretagne est fondamentalement liée à Mithras. Perse, puis romain, et enfin divinité, cet infant de l’antédiluvien Ventrue atteignit les sommets dignes de son clan, en étendant un culte à sa gloire à travers pratiquement toute l’Europe. \nLe dieu déchu migra donc jusqu’aux rives du pays britannique, amenant avec lui ses plus fervents adeptes. Grâce à sa puissance, il lui fut aisé d’en prendre le pouvoir, de récupérer un peu de son ancienne gloire. Pourtant, quelque chose s’était fané dans le cœur du vieux vampire ; l’ennui, le désabusement, le poussèrent à entrer régulièrement en torpeur, et ne plus se soucier des affaires insignifiantes de son royaume.\nLe dieu déchu migra donc jusqu’aux rives du pays britannique, amenant avec lui ses plus fervents adeptes. Grâce à sa puissance, il lui fut aisé d’en prendre le pouvoir, de récupérer un peu de son ancienne gloire. Pourtant, quelque chose s’était fané dans le cœur du vieux vampire ; l’ennui, le désabusement, le poussèrent à entrer régulièrement en torpeur, et ne plus se soucier des affaires insignifiantes de son royaume. Et ainsi fut fait, pendant cent cinquante nouvelles années. Puis l’ennui revint, et l’ancien dieu n’eut de nouveau plus cure de l’Angleterre et son sort. \n\nBeaucoup de ses sujets comme Hugh de Cornwall ou Robin Leeland, obtinrent de facto leur indépendance. Désormais, poussés par l’ambition, ils complotent à l’éviction de ce vieux caïnite qui ne semble n’avoir plus le souci de rien. Pire, le Pays de Galles et l’Écosse abritent des confréries de vampires aux fois païennes, peu en accord avec les dictats divins de Mithras. En ces nuits qui s’annoncent, personne ne sait si ces oppositions seront balayées d’un revers par le Dieu-Roi, ou si ce dernier va se contenter de regarder, morose, sa couronne se ternir, et le pays sombrer.  "
 podintroductions.2.a:0 "Saluez le Dieu-Roi... pour le moment."
 podintroductions.3.t:0 "Un Pays de Rois et de Sorciers"
 podintroductions.3.desc:0 "Cœur incontesté du pouvoir Ventrue, la Germanie est fermement dirigée par Hardestadt, dit l’Ancien. Alors que tous pensaient son autorité inébranlable, les fondations du pouvoir ont commencé à trembler, et les intrigants les plus avertis en discernent déjà les premières brèches.\nJulia Antasia de Germanie de l’Ouest et l’élusive Ilse Reinegger de Bavière représentent des menaces intérieures des plus sérieuses ; au moins aussi habiles politiquement que l’actuel seigneur, toutes deux œuvrent à force de manigances pour siéger à leur tour sur le trône. \n\nNon loin, au cœur même des Fiefs, s’est exilé l’ancien Prince de Paris, le puissant mathusalem Alexandre. Quoique politiquement isolé, la présence du vieux vampire, dépouillé de son empire, bouleverse les influences. Nul ne peut toutefois prédire vers qui les ambitions de cet être poussiéreux se tourneront : ses anciennes terres, ou ce nouveau royaume, qui s’offre à lui. \n\nAu Sud, d’autres troubles émergent, bien plus flagrants. Le jeune clan Tremere s’est attiré l’ire de plusieurs clans majeurs, tant par sa naissance que les méthodes douteuses employées pour se protéger. Les Gangrels et les Nosferatus sont furieux que certains de leurs membres aient été utilisés à la création des Gargouilles - vampires déformés par la magie, aliénés et asservis aux magiciens. Quant à l’ire des Tzimisces, elle va bien au-delà de cet affront, dont ils ont pourtant été également victimes : la non-vie d’un de leurs Anciens a été utilisée par les sorciers pour devenir immortels, et c’est donc double injure faite aux souverains de la chair. Les légions difformes des Démons marchent à présent vers les forteresses de ceux qu’ils nomment les Usurpateurs, afin que soit rendue par les corps brisés et le feu cette immortalité volée.\nEt les Ventrues, engagés à la protection du jeune clan, doivent se dresser entre lui et la colère de ces puissants groupes de Caïnites.\n\nHardestadt est pris entre plusieurs feux et doit agir vite : il lui faut réprimer les ambitions de son infant Jürgen, détruire les bases du pouvoir de Julia et Ilse, et se préparer à la guerre qui s’en vient.\nHardestadt est pris entre plusieurs feux et doit agir vite : il lui faut réprimer les ambitions de son infant Jürgen, détruire les bases du pouvoir de Julia et Ilse, et se préparer à la guerre qui s’en vient."
 podintroductions.3.a:0 "Rome est un souvenir lointain. L'avenir est ici."
 podintroductions.4.t:0 "La Reconquista des Ombres"
 podintroductions.4.desc:0 "L'Ibérie est le cœur d’autorité du clan Lasombra. Du moins, l’était-ce depuis des temps immémoriaux. La Reconquista de la péninsule a mené à une terrible guerre intestine au sein des Magisters : les enfants des Ombres se sont entredéchirés, pour la moindre parcelle de terre, le moindre pion mortel, afin que soit décidé qui du dieu chrétien ou musulman règnerait ici-bas. \nL'Ibérie est le cœur d’autorité du clan Lasombra. Du moins, l’était-ce depuis des temps immémoriaux. La Reconquista de la péninsule a mené à une terrible guerre intestine au sein des Magisters : les enfants des Ombres se sont entredéchirés, pour la moindre parcelle de terre, le moindre pion mortel, afin que soit décidé qui du dieu chrétien ou musulman règnerait ici-bas. \n\nAu sud du pays, la situation n’est guère plus réjouissante. Des décennies de luttes internes ont occupé et affaibli les Asshira, les Lasombra musulmans. En ces nuits tumultueuses, ceux-ci ont tout de même trouvé de l’espoir en la personne de Badr d’Andalousie. Ce sultan, digne et éprouvé, parviendra peut-être à guider les soldats d’Allah contre ceux de Dieu, et sauver ce qui peut encore l’être. \n\nAilleurs dans le monde, nouveaux comme anciens Princes, du royal Ventrue au plus féral Gangrel, tous suivent avec intérêt l’affaiblissement des Magisters. Pour le clan des Ombres, si le conflit théologique qui oppose ses membres est de première importance, la Reconquista pourrait tout aussi bien lui coûter la domination exclusive sur l’Ibérie. Après tout, les Lasombra ne sont pas les seuls à conspirer au sein des nuits."
 podintroductions.4.a:0 "L'Ibérie sera à nouveau réunifier, seul le temps compte.""
 podintroductions.5.t:0 "Ragnarok"
 podintroductions.5.desc:0 "Loin des esprits mortels, la foi nordique existe toujours pour les Vampires de Scandinavie. Ses partisans, le féroce Einherjar, s’accrochent à leurs croyances… mais l’espoir s’estompe rapidement. Le Tout-Puissant Werter et le chef des Valkyries, Ulfsdottir, se sont repliés dans la dépression et près de la torpeur. Certains continuent cependant la lutte, comme Brunhilde et Valbjorg ‘Oeil de travers’, qui tentent de détruire les vampires chrétiens envahisseurs, menés par Hardestadt’. Une lueur d’optimisme pour le Einherjar est que les nouveaux arrivants sont à peine un groupe uni, se querellant entre eux, notamment au Danemark qui est divisé entre trois prétendants. Dans les déserts du Nord, une bande de furores sans coeur qui s’appellent les Sinistres Barrières ont jalonné une revendication douteuse sur les terres stériles. Qu’il s’agisse de nouveaux alliés ou ennemis, la dernière bataille des Scandinaves approche, et la Croix semble une fois de plus être le favori..."
 podintroductions.5.a:0 "La Scandinavie ne sera plus jamais la même."
 podintroductions.6.t:0 "Requiem pour un Empire"
 podintroductions.6.desc:0 "Si l’Italie médiévale mortelle est un état divisé, alors l’Italie de nuit est un baril de poudre. Les puissants Vampires se ruent vers les villes les plus peuplées d’Europe. Au nord, le cardinal Ventrue Fabrizio Ulfila est assis à Milan, une solide prise sur l’Eglise italienne à sa disposition. À Venise, les descendants de Giovanni du clan Cappadoce sont les maîtres d’un empire de commerce couvrant la mer, le temps dira si leur attention est sur l’Italie proprement dite ou à l’Est, comme leur clan parent. En Sicile, la capitale du clan Lasombra est gardée par le fidèle Montano, mais l’extension excessive et la guerre civile en Espagne ont laissé la Mer des Ombres vulnérable. Enfin, tous les regards sont tournés vers Rome, où Titus Venturus Camille s’est récemment réveillé. Le Consul éternel fut le cerveau de l’empire de Rome et de la destruction de Carthage et pourrait inaugurer une nouvelle ère pour la direction de Ventrue. Alors que d’autres petits dirigeants et rois immortels se soulèvent ailleurs en Italie, la Guerre des Princes n’a jamais été aussi dangereuse qu’ici."
 podintroductions.6.a:0 "Tous les chemins mènent à Rome."
 podintroductions.7.t:0 "Contre les murs"
 podintroductions.7.desc:0 "Les États croisés se tiennent précairement sur le Levant, et un État vampire encore plus précaire s’est levé parmi eux. La Diète des Oliviers est un pacte entre les princes des différentes villes de la région, dirigé par un survivant, Qawiyya el-Ghaduba. La « lionne » est un Salubri, un clan presque disparu en Europe occidentale depuis la mort de son fondateur, Saulot, aux mains du clan Tremere nouvellement ressuscité. La plupart des membres du clan affaibli se sont cachés, mais Qawiyya a l’intention de prendre position. Son alliance précaire est déjà en danger, car Damas tombe dans un véritable gouffre de folie. Darshuf, le vieux sultan Toreador a vendu son âme à des forces invisibles, avec seulement son enfant et un seul guerrier assamite debout sur le chemin d’une catastrophe. La Diète sera-t-elle le dernier hourra d’un clan mourant ou l’espoir d’un avenir meilleur ?"
 podintroductions.7.a:0 "Jérusalem est la ville des miracles, après tout…"
 podintroductions.8.t:0 "Derrière le voile"
 podintroductions.8.desc:0 "L’Arabie est le siège du mouvement Ashirra, des vampires musulmans unis au-delà des clans par leur foi commune. Leur position sur la péninsule est forte, mais la perte de Jérusalem aux croisés et de l’Egypte aux serpents les a coupés de leurs frères maghrébins et andalous. Pire encore, la Mésopotamie est retombée aux infernalistes Baali, menés par Azanael de la branche nergalite. Son but est de prendre les grandes villes de la région, Damas, Bagdad et Tyr, pour avoir la population dont il a besoin pour se sacrifier pour le retour de son maître impie. Ironiquement, son adversaire le plus fort est Tanit de Tyr, un autre Baali, celui-ci de la branche Molochim. Cette rivalité a plongé le Baali de retour dans la guerre civile et donne l’espoir aux fidèles musulmans qu’ils peuvent être arrêtés. Alors, le monde entier pourrait être en jeu."
 podintroductions.8.a:0 "Le berceau de la civilisation pourrait aussi être son lit de mort."
 podintroductions.9.t:0 "Cape et Cimeterre"
 podintroductions.9.desc:0 "La Perse est le siège du clan Assamite, un groupe mystérieux pour les étrangers. Gouvernée par l’Aîné nouvellement couronné et très contesté, Nakurtum, leur façade d’unité montre des fissures que les différentes factions font leurs jeux de pouvoir. Thetmes de la Toile des Couteaux veut que le clan devienne un culte fanatique d’assassins prêts à servir d’armée pour le retour de son maître noir. Al Ashrad des Sorciers, suit un chemin de modération, en considérant les Assamites comme des juges et des diplomates. Enfin, Jamal des Guerriers est un fervent musulman, et serait heureux d’un rapprochement avec le califat Ashirra de Médine. Cette agitation politique a contribué à la croissance d’un autre groupe dans la région, la tribu perdue de Dastur Anosh, un hérétique vénérant la deuxième génération de vampires. Paralysé par les divisions et l’inefficacité, le clan Assamite trouvera-t-il un nouveau but commun ou implosera-t-il dans la guerre civile ?"
 podintroductions.9.a:0 "Je vais unir la Perse, par la diplomatie ou autrement."
 podintroductions.11.t:0 "La Guerre éternelle"
 podintroductions.11.desc:0 "Depuis l’aube des temps, l’Inde est le théâtre d’une guerre entre le clan Ravnos et les Asuratizayyas, ou Wan Kuei, un mystérieux groupe de 'vampires' asiatiques. Il n’y a pas eu de vainqueurs et les deux combattants sont à leur point de rupture, avec diverses factions complotant pour renverser la direction actuelle. En Occident, Chandraputra rassemble les Ravnos pour une autre bataille. Tandis qu’en Orient, Dyanang conduit les Dragons vers une autre charge. D’autres puissances, du Daena au Kartarirya du Tzimisce, cherchent avidement des opportunités dans la tempête constante. Un vainqueur émergera-t-il enfin ?"
 podintroductions.11.a:0 "Je suis, évidemment, le seul espoir de paix en Inde."
 podintroductions.12.t:0 "Toujours en train de tomber"
 podintroductions.12.desc:0 "Bien qu’il ait été brûlé il y a des siècles, la perte de Carthage se fait encore sentir au Maghreb. La zone a depuis été découpée entre divers Ashirra -Vampires musulmans- sultans, mais aucun d’entre eux n’a vraiment réussi à consolider la région. Les deux mieux placés pour le faire sont Sophoniba, la très ancienne leader de Tunis qui se souvient encore de la perte de sa ville aux côtés de Carthage, et Zamra Matoub d’Alger, une jeune et ambitieuse Lasombra. Les Setites ont aussi un pied ici, tout comme le clan Tremere. Avec ce patchwork divisé ou des puissances, et une histoire riche, le Maghreb est un prix alléchant pour tout prince ou sultan aventureux."
 podintroductions.12.a:0 "Nous devons passer à autre chose après la chute Cartage"
 podintroductions.13.t:0 "Dans l’ombre de la pyramide"
 podintroductions.13.desc:0 "Dans l’ombre de la pyramide, l’Egypte a enduré de nombreux conquérants étrangers, et ses morts-vivants natifs ne sont rien sinon patients et résilients. Le vrai pouvoir se trouve ici à Gizeh, avec le cœur du clan Setite. Le clan de la liberté – ou de la corruption selon qui vous le demandez – prépare ses forces à profiter du vide de pouvoir créé par les croisades. Leur première cible sera sans doute le Caire. Menée par la puissante 5e génération de Ventrue Antonius, la ville ne tombera pas facilement et pourrait contrecarrer les Serpents si la guerre ouverte était déclarée. Tout le monde est sûr que les Followers of Set feront leur premier pas bientôt, mais personne ne peut dire quand, et si, ils seront arrêtés quand ils le feront…"
 podintroductions.13.a:0 "L’Égypte est aussi immortelle que nous."
 podintroductions.14.t:0 "Terre de la dualité"
 podintroductions.14.desc:0 "Les vampires natifs d’Afrique sont les Laibon, une association lâche de multiples lignées et égocentriques suceurs de sang. Ils détiennent la majeure partie du vrai pouvoir sur le continent, mais doivent faire face aux nombreux aventuriers ou petits seigneurs de guerre qui cherchent la gloire et la fortune sur leurs terres. Pire encore, l’Afrique abrite aussi des créatures vraiment anciennes, toujours là depuis l’époque où elle était le berceau de l’humanité. Avec l’ouverture de diverses nouvelles routes avec le monde musulman, et Ashirra, il reste à voir si le Laibon sera en mesure de s’adapter et de prospérer dans les temps changeants."
 podintroductions.14.a:0 "Les possibilités et les dangers abondent."
 podintroductions.15.t:0 "Dans les Cieux"
 podintroductions.15.desc:0 "Pour les étrangers, le Tibet abrite des vampires très étranges... s’ils peuvent être appelés vampires ! Les soi-disant exilés blancs font partie du Wan Kuei, les fantômes affamés de la Chine, et sont fermement établis dans l’est. Dans l’ouest cependant, les choses encore plus étranges demeurent de démons adorant des abominations aux disciples illuminés d’un dieu égyptien mort. Loin de tout vrai centre du pouvoir des morts-vivants, le Tibet est une attraction pour la plupart des vampires. Mais les mystères peuvent récompenser ceux qui cherchent assez profondément..."
 podintroductions.15.a:0 "Le Tibet est un monde à part entière."
 podintroductions.16.t:0 "Le tonnerre de l’Est"
 podintroductions.16.desc:0 "Les steppes ne sont pas une terre pour les vampires. Peu de villes à cacher, peu de nations à manipuler et à plier à leur volonté. Mais, de l’est vient une nouvelle race de vampires, qui est à la maison sur les plaines sans fin et avec le peuple nomade mongol. Ces Anda, un rejeton de Gangrel, sont de fiers guerriers et suivent l’Empire mongol en pleine expansion avec ses conquêtes. Le conflit avec le gangrel occidental déjà présent semble inévitable et, plus encore, des tensions avec les Cainites européens sont à prévoir lorsque ces nouveaux arrivants arrivent. Le changement est une chose rare à venir avec les vampires, mais quand il vient avec une horde de chevaux archers tonnerre, le changement pourrait être la dernière chose que beaucoup d’entre eux éprouvent…"
 podintroductions.16.a:0 "Le changement n’est pas toujours le bienvenu…"
 podintroductions.17.t:0 "Vous qui entrez ici…"
 podintroductions.17.desc:0 "L’Europe de l’Est est la terre traditionnelle du clan Tzimisce, mais leur hégémonie a été récemment contestée par la montée du Tremere, soutenu par l’allemand et le hongrois Ventrue. Une guerre récente s’est terminée par un amer traité de paix entre Vladimir Rustovitch, voïvode des voïvodes, et Jurgen von Verden, croisé Ventrue. Un état tampon, l’Ordre Obertus, a été établi, dirigé par le courtier de la paix Myka Vykos. Maintenant, tout le monde lèche ses blessures, Rustovitch essayant d’assurer son contrôle du clan et le Ventrue hongrois résolvant une crise de succession avec la torpeur de leur chef, Bulscu. Enfin, Etrius dirige les usurpateurs à la place de Tremere, montrant la façade d’une pyramide unifiée contre les démons. Tout le monde sait que la guerre est inévitable dans cette région jusqu’à ce qu’un vampire soit assez puissant pour écraser ses rivaux une fois pour toutes. Qui sera-t-il ?"
 podintroductions.17.a:0 "Une terre à dompter."
 podintroductions.18.t:0 "Un rêve qui s'estompte"
 podintroductions.18.desc:0 "Les cendres de Constantinople sont encore chaudes et, pourtant, les vautours sont déjà autour de son cadavre. Le rêve de Michael, une utopie vampirique jamais vue depuis Carthage, est tombé avec son créateur, et un certain nombre de seigneurs de guerre et de vestiges de l’Empire brisé tentent de survivre. Le plus important d’entre eux est Alfonzo, l’un des instigateurs de la 4ème croisade, maintenant tenant Constantinople. L’ambitieux Lasombra s’incline encore devant les chefs de clan en Sicile, mais pour combien de temps ? Plus à l’ouest, Natalya Svyatoslav de la Brujah est l’une des dernières véritables croyants du Rêve encore en activité, espérant revendiquer pour elle-même le manteau de l’Archange Michel. Anna Comnena n’a pas de si grandes ambitions, utilisant Nikaea pour finalement obtenir l’Empire qui aurait dû être le sien même pendant ses jours de respiration. Comme beaucoup d’autres princes en herbe construisent des domaines dans les cendres de l’ancien, Constantinople pourrait renaître… ou mourir pour de bon."
 podintroductions.18.a:0 "Michael a-t-il prévu ce chaos ?"                                       
 podintroductions.19.t:0 "Grand-mère, grand-mère..."
 podintroductions.19.desc:0 "Pour autant que l’on se souvienne, la Russie abrite l’une des familles les plus puissantes de l’existence, Baba Yaga. Cette Nosferatu de 4e génération, dont on dit qu’elle est la véritable ancêtre du clan, fait partie intégrante de la terre et l’utilise pour se défendre contre son père vengeur. Heureusement pour tout le monde, la sorcière est en torpeur. Mais l’influence de son rideau d’ombre se fait toujours sentir, nourrie par son fidèle commandant en second, Viktor. Avec de telles conditions, il n’y a que trois types de vampires en Russie : les vassaux de la grand-mère, les braves, et les bientôt morts. Ces deux dernières catégories se chevauchent souvent..."
 podintroductions.19.a:0 "Méfiez-vous des petites filles..."                                       
 podintroductions.20.t:0 "Nouveau destin pour la vieille terre"
 podintroductions.20.desc:0 "Traditionnellement, une frontière de la Voïvodie tzimisce abrite les plus... excentriques fiefs, la Pologne vient dans sa propre entité, séparée, . L’autorité décrépite des Voïvodes, et leur anachronisme total, a permis à une nouvelle génération de Vampires de s’emparer et de prospérer. Le premier d’entre eux est Yitzhak ben Avraham, un dévot Brujah, rassemblant des disciples autour de Cracovie pour expulser le prince disparu, Razkoljna. Cela pourrait être le premier pas vers une Pologne libre de l’influence de Tzimisce. Mais de plus grands défis attendent, notamment l’éviction de l’abomination totale qu’est Hedeon Yaroslavich, un Tzimisce même considéré comme extrême par ses propres pairs..."
 podintroductions.20.a:0 "Je dois tenir compte de ce vent de changement ou être écrasé par lui." 
 podintroductions.21.t:0 "Terre des Hommes Libres"
 podintroductions.21.desc:0 "Loin de l’emprise écrasante des tyrans en Europe occidentale, la région baltique abrite deux constructions politiques d’un nouveau type pour les vampires. En Lituanie, Qarakh du Gangrel a unifié une large bande de païens libres d’esprit dans ce qu’il entend être le point d’arrêt du christianisme, et Ventrue, expansion dans l’est. Plus au nord, Karl le Bleu est à la tête d’un État libre d’Einherjar, peut-être le dernier de son genre puisque la Scandinavie tombe aux mains des sbires de Hardestadt. Ces deux expériences sont en grand danger, interne et externe, et reposent principalement sur le charisme de leurs dirigeants. Même leur bravoure et leur conviction pourraient se révéler futiles face à la prochaine attaque de Ventrue..."
 podintroductions.21.a:0 "Les derniers restes d’un âge de mort ne vont pas facilement descendre." 
 podintroductions.2001.t:0 "Bienvenue sur Princes of Darkness"
 podintroductions.2001.desc:0 "Tout d’abord, merci de joué au mod !\nPrinces of Darkness est une refonte du jeu de base, visant à donner vie à World of Darkness dans Crusader Kings 3. En tant que tel, il a de nombreux concepts de gameplay modifiés, et utilise la vaste tradition de son monde pour proposer une expérience différente tout autour."
 podintroductions.2001.a:0 "Parlons des mécaniques des vampires..." 
 podintroductions.2001.b:0 "...ou d’autres concepts modifiés" 
 podintroductions.2001.c:0 "Le monde et ses traditions" 
 podintroductions.2001.d:0 "C’est bon, on y va !" 
 podintroductions.2001.e:0 "Effacer mes traits surnaturels et aller au Generateur de Personnage" 
 podintroductions.2003.t:0 "Vampires 101"
 podintroductions.2003.desc:0 "La première chose à noter est que, en tant que Vampire, vous êtes immortel... en quelque sorte. Vous ne mourrez pas de vieillesse ou de maladie, mais être mis au flambeau ou décapité mettra toujours fin à votre vie. En tant que tel, la succession est une préoccupation moindre, mais toujours présente, pour vous. Dans la même veine, les mariages ne peuvent pas produire d’enfants, ils sont donc principalement un outil politique à la disposition de quelques religions.\nLes niveaux font partie intégrante du gameplay, encore plus qu’en CK3. Ici, il représente les principes philosophiques fondamentaux de votre caractère, qui l’aident à ne pas tomber dans la Bête. En effet, la Bête -une manifestation littérale de votre monstruosité intérieure- est l’un de vos pires ennemis, et la gestion de votre stress est primordiale pour ne pas en être la proie, car cela voudrait dire que votre personnage est devenu une perruque féroce, résultant en son abdication.\nRemarquez votre soif, un modificateur de noyau représentant votre besoin de sang. La soif est utilisée pour de nombreux régimes et pouvoirs, et réapprovisionner lentement ou avec la chasse active."
 podintroductions.2003.a:0 "Quelques concepts plus avancés"  
 podintroductions.2004.t:0 "Comment ne pas finir comme un flambeau vivant"
 podintroductions.2004.desc:0 "Les vampires sont lents à apprendre de nouvelles choses. En tant que tel, vous avez toujours accès aux modes de vie de base, mais à un taux de progression inférieur. Vous pouvez plutôt choisir d’investir votre temps dans les disciplines, en ouvrant les pouvoirs des damnés pour votre usage.\nLes constructions représentent votre influence sur la population mortelle. La plupart sont plafonnées par un contrôle de type stat et vous devrez choisir comment les équilibrer. Notons que les grands centres de population, représentés par des capitales duchés de haut développement, sont le plus grand atout dont tout Prince peut rêver.\nLa Guerre est sensiblement modifiée, l’accent étant davantage mis sur les chevaliers. La prouesse de vos chevaliers peut facilement vaincre un ennemi beaucoup plus nombreux, surtout si la plupart du temps composé de redevances. En tant que tel, méfiez-vous des grandes prouesses des vampires hostiles.\nDans un monde plein de tromperie et d’astuces, l’intrigue joue un plus grand rôle. Il y a de nouveaux schémas à découvrir, certains liés à vos pouvoirs, et la plupart des personnages ont des secrets qu’il vaut mieux ne pas dévoiler... ou utilisés pour du chantage si leur religion le permet."
 podintroductions.2004.a:0 "Retour aux bases"  
 podintroductions.2005.t:0 "L'histoire jusqu'ici..."
 podintroductions.2005.desc:0 "Le Monde des Ténèbres est un univers qui existe depuis plus de 30 ans, avec une centaine de livres et d’autres médias qui le couvrent. L’idée principale est que, dans notre monde, plusieurs factions de créatures surnaturelles interagissent sous la surface, créant un monde souterrain plein d’intrigues et d’histoires.\nLes vampires de la WoD sont principalement le résultat de la malédiction biblique contre Caine, le premier meurtrier, et la plupart retracent leur lignée à lui dans un système qu’ils appellent 'générations'. Cet arbre dynastique des morts-vivants s’est ramifié en plusieurs factions, les clans, chacun avec sa force, sa faiblesse et sa base de pouvoir géographique. nAu Moyen Âge : Les vampires, auxquels vous jouez maintenant, nous suivons le monde des morts-vivants à la croisée de plusieurs crises majeures. Le sac de Constantinople s’est produit, et a brisé le grand empire caïnite de l’époque, ayant un effet d’entraînement aussi loin que la France et la Perse. Pendant ce temps, l’Inquisition de l’Église recueille soutien et information, presque prêt à inaugurer l’âge de la rétribution sur les suceurs de sang maudits..."

