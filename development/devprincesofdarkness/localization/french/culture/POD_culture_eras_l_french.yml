 culture_era_dark_fantastic:0 "Fantastique Noir"
 culture_era_dark_fantastic_desc:0 "L'ère de la Rennaissance du Monde des Ténèbres, et le début des Mages: La Croisade des Sorciers. Comme l'ère Medievale Sombre des Vampires: Les Ages Sombres avant lui, le Fantastique Sombre est une version encore plus conspiratoire de cette ère historique, hantée par les bêtes des cauchemares et les démons au delà de leur compréhension humaine. Cependant, le Fantastique Sombre est un cadre plus merveilleux également, il bénéficie aussi bien des personnages de Hautes-Fantaisie et des Mages: L'ascension des esprits des la Renaissance historique eux-mêmes."
 culture_era_gothic_victorian:0 "Gothique Victorienne"
 culture_era_gothic_victorian_desc:0 "Le nom 'Gothique Victorienne' fait référence aux deux sensibilités qui éclairent le cadre: le romantisme ténébreux et condamné de la fiction gothique classique, et le règne de la reine Victoria I du Royaume-Uni, qui a gouverné l’Empire britannique du 20 juin 1837 jusqu’à sa mort, le 22 janvier 1901. Ces deux sensibilités supposent toutes deux un souci de changement social radical car il coexiste alternativement et entre en conflit avec le poids répressif de la tradition. L’époque Gothique Victorienne appartient à l’époque Victorienne:Les vampires s’étend sur la période de 1890 à 1897, et se termine non pas avec la mort de Victoria, mais avec la publication du roman de Bram Stoker Dracula – un événement qui a secoué le monde de la famille. La période gothique victorienne chevauche partiellement l’Ouest sauvage (ou "Wyld West"), le cadre du loup-garou The Wild West, bien que le thème et le ton des deux décors diffèrent considérablement. Le futur mage victorien pour Mage: L’Ascension traitera également de l’âge victorien"
 culture_era_final_nights:0 "Les Dernières Nuits"
 culture_era_final_nights_desc:0 "Dans l’eschatologie Cainite, les Dernières Nuits sont les nuits précédant la venue de la Géhenne et la fin des vampires. Une grande partie de la base de la croyance dans les Dernières Nuits provient de la tradition Noddist. Spécifiquement, le Livre de Nod. Les Dernières Nuits sont censées être précédées de plusieurs signes qui indiquent de grands changements dans la société Cainite et le réveil imminent des Antédiluviens, comme une augmentation du nombre de vampires à sang fin, les Principautés gouvernés par Caitiff, et les Kuei-jin envahissant l’Occident. Il est dit que la majorité des vampires ont un sentiment de ruine imminente pendant les dernières nuits"
 
