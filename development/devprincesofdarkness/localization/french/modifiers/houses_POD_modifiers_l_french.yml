l_french:
 house_hardestadt_modifier:0 "Maison Hardestadt"
 house_hardestadt_modifier_desc:0 "Bien que d’une lignée quelque peu trouble à l’ancêtre Ventrue, la Maison Hardestadt a déjà prouvé un sens aigu du pouvoir jamais vu depuis les nuits de la Rome Ventrue."
 house_nabonidus_modifier:0 "Maison Nabonidus"
 house_nabonidus_modifier_desc:0 "Cette lignée Assamite recluse est connue pour inspirer une grande foi en ses disciples, même avec les activités plus exotiques qu’elle semble avoir."
 house_shahiri_modifier:0 "Maison Sha'hiri"
 house_shahiri_modifier_desc:0 "La lignée de l’Aîné choisie par Haqim lui-même comme successeur est un choix consensuel pour le clan divisé. Bien qu’il pourrait également être dû à Sha’hiri étant connu comme en quelque sorte un jeu d'enfant."
 house_anath_modifier:0 "Maison Anath"
 house_anath_modifier_desc:0 "La Reine de la Guerre et de l’Amour est une figure obscure, mais son enfant a accompli de grands exploits à la fois diplomatique et martial. Ils sont connus pour être un peu téméraire et directe cependant."
 house_jamal_modifier:0 "Maison Jamal"
 house_jamal_modifier_desc:0 "Le chef implacable de la faction Ashirra dans le clan Assamite est un guerrier hors pair. Mais il n’est pas connu pour sa patience contre les Non-croyants."
 house_urshulgi_modifier:0 "Maison Ur'Shulgi"
 house_urshulgi_modifier_desc:0 "La lignée du Berger Noir est un mystère. Et pour le bien de tous, il doit rester non résolue."
 house_thetmes_modifier:0 "Maison Thetmes"
 house_thetmes_modifier_desc:0 "L’Araignée a des plans dans les plans. Et pas le temps de prendre soin de questions triviales telles que la souverainté."
 house_anosh_modifier:0 "Maison Anosh"
 house_anosh_modifier_desc:0 "Mal vu par tout son clan, la lignée Anosh est celle des visions et de l’expérimentation de l’inconnu."
 house_azrael_modifier:0 "Maison Azrael"
 house_azrael_modifier_desc:0 "Les meilleurs guerriers d’un clan de guerrier."
 house_nakurtum_modifier:0 "Maison Nakurtum"
 house_nakurtum_modifier_desc:0 "La téméraire et fougueuse Nakurtum a pris d’assaut le clan Assamite. Elle s’attend à une diligence raisonnable de ses sujets mais a du mal à gagner sa rigueur."
 house_abuilaf_modifier:0 "Maison Abu Ilaf"
 house_abuilaf_modifier_desc:0 "La maison mineure d’un descendant mineur de Haqim a principalement créé des aspirants dévoués, souvent reclus et retirés."
 house_shango_modifier:0 "Maison Shango"
 house_shango_modifier_desc:0 "Dirigeants et conseillers astucieux, les Shangos sont encore méfiants parmi les Laibons pour leurs manières insensibles. En tant que tel, il est assez rare d’avoir un Shango diriger un grand domaine sans représailles."
 house_wahsheen_modifier:0 "Maison Wah'Sheen"
 house_wahsheen_modifier_desc:0 "Il est difficile de gagner la confiance d’un Gangrel Ashirra, mais une fois que vous le faites, c’est un lien inébranlable."
 house_saad_modifier:0 "Maison Saad"
 house_saad_modifier_desc:0 "Les Bédouins du clan Assamite sont quelque peu désapprouvés et ont tendance à rester ensemble ou avec leurs tribus."
 house_zayyat_modifier:0 "Maison Zayyat"
 house_zayyat_modifier_desc:0 "La maison Zayyat brûle de la foi des nouveaux convertis. Un spectacle inspirant et effrayant."
 house_hannibal_modifier:0 "Maison Hannibal"
 house_hannibal_modifier_desc:0 "Bien qu’ils luttent courageusement et avec un esprit stratégique sûr, les membres de la Maison Hannibal semblent toujours voués à l’échec finallement."
 house_losario_modifier:0 "Maison Losario"
 house_losario_modifier_desc:0 "Les membres de la Maison Losario sont des marques de feu et des innovateurs, toujours en train de repousser les limites. Personne ne semble capable de rester fâché longtemps contre eux cependant."
 house_leeland_modifier:0 "Maison Leeland"
 house_leeland_modifier_desc:0 "Les Leelands sont les chefs passionnés du monde Caïnite libre. Les clans traditionnels les soupçonneront toujours de planifier quelque chose."
 house_menele_modifier:0 "Maison Menele"
 house_menele_modifier_desc:0 "Inlassables lorsqu’ils se battent pour leurs convictions, les membres de la Maison Menele sont souvent aveugles aux menaces plus subtiles."
 house_dominic_modifier:0 "Maison Dominic"
 house_dominic_modifier_desc:0 "Bien versés dans l’art de la guerre, les membres de la Maison Dominic sont malheureusement souvent des proies faciles pour leur bête particulièrement vorace."
 house_gersakkun_modifier:0 "Maison Gersakkun"
 house_gersakkun_modifier_desc:0 "Cette lignée presque oubliée n’a pas laissé sa marque sur l’histoire des Brujahs, bien qu’ayant produit quelques philosophes talentueux."
 house_truebrujah_modifier:0 "Maison Vrai Brujah"
 house_truebrujah_modifier_desc:0 "Personne ne sait s’il y a du vrai dans l’histoire bizarre de leur origine. Mais leur distanciation ne leur fait pas gagner des amis de toute façon."
 house_baytmushakis_modifier:0 "Maison Bay't Mushakis"
 house_baytmushakis_modifier_desc:0 "Les Brujahs musulmans ont été implacables dans leur chasse du Ventrue détesté. Ils sont des acharnés pour n’importe quel ami de leur grand ennemi."
 house_guillaume_modifier:0 "Maison Guillaume"
 house_guillaume_modifier_desc:0 "Justes et équitables, les membres de la Maison Guillaume se préoccupent plus de l’état de leur âme que de toute petite politicaillerie."
 house_azif_modifier:0 "Maison Azif"
 house_azif_modifier_desc:0 "La Maison Azif porte les stigmates de son âme avide qui vole un ancêtre. Quelques-uns sont prêts à oublier le crime."
 house_osebo_modifier:0 "Maison Osebo"
 house_osebo_modifier_desc:0 "Laissés à eux-mêmes, les Osebo sont des créatures à peine contenue de feu et de colère. Ils le savent eux-mêmes cependant, et sont à la recherche de clients justes afin de les garder en échec."
 house_giovanni_modifier:0 "Maison Giovanni"
 house_giovanni_modifier_desc:0 "Ceux-là aiment le garder dans la famille."
 house_lazarene_modifier:0 "Maison Lazarene"
 house_lazarene_modifier_desc:0 "Les mendiants ne peuvent pas choisir, chassés par leur propre clan, Lazare s’alliera avec n’importe qui."
 house_japhet_modifier:0 "Maison Japhet"
 house_japhet_modifier_desc:0 "Les chefs traditionnels du clan Cappadoce ont une approche très discrète. Cela peut être gratifiant... et dangereux."
 house_byzar_modifier:0 "Maison Byzar"
 house_byzar_modifier_desc:0 "Les membres de la Maison Byzar sont des bâtisseurs de civilisations. Ils ne sont cependant pas les meilleurs pour les défendre."
 house_premascine_modifier:0 "Maison Premascine"
 house_premascine_modifier_desc:0 "Si l’ambition était une vertu, voici ses anges."
 house_harbingersofskulls_modifier:0 "Maison Harbingers"
 house_harbingersofskulls_modifier_desc:0 "L’étrange groupe d'égorgeur des Cappadoces est beaucoup plus à l’aise dans l’ombre que sur le trône."
 house_lamia_modifier:0 "Maison Lamia"
 house_lamia_modifier_desc:0 "Personne ne connaît la véritable fin du jeu des filles guerrières de Lilith. Et elles ne le disent pas."
 house_mlawatu_modifier:0 "Maison Mia Watu"
 house_mlawatu_modifier_desc:0 "Vous ne pouvez pas faire confiance à un être qui cherche le pouvoir, les âmes et les corps des morts. Même si il sait les choses que vous désirez."
 house_almawt_modifier:0 "Maison Al Mawt"
 house_almawt_modifier_desc:0 "Attention de ne pas attirer la colère du monde musulman, les Cappadoces de cette maison ont peu d’alliés, mais de nombreux secrets."
 house_hecata_modifier:0 "Maison Hecata"
 house_hecata_modifier_desc:0 "Une nuit, la Déesse de la Mort accueillera tous ses enfants rebelles dans son étreinte froide."
 house_rusenko_modifier:0 "Maison Rusenko"
 house_rusenko_modifier_desc:0 "Si la folie est une échelle, il ne reste pas grand-chose à grimper."
 house_lhiannan_modifier:0 "Maison Lhiannan"
 house_lhiannan_modifier_desc:0 "Les reliques d’une époque révolue se battent jusqu’à leur dernier souffle. Et c’est un spectacle dangereux à voir."
 house_odin_modifier:0 "Maison Odin"
 house_odin_modifier_desc:0 "Le Père-de-Tout observe la dernière position de l’Einherjar. Et aucun lâche n’entrera dans le Valhalla."
 house_rufus_modifier:0 "Maison Rufus"
 house_rufus_modifier_desc:0 "Rufus a protégé ses montagnes pendant des milliers d’années. Il a l’intention de continuer pour un millier de plus."
 house_matasuntha_modifier:0 "Maison Matasuntha"
 house_matasuntha_modifier_desc:0 "La Hun a presque détruit Rome dans le passé. Elle n’a pas l’intention d’être arrêtée deux fois."
 house_hukros_modifier:0 "Maison Hukros"
 house_hukros_modifier_desc:0 "La lignée de Hukros est toujours à la recherche de vérités cachées, un esprit curieux qui ne s’entend pas bien avec ses coreligionnaires."
 house_aajav_modifier:0 "Maison Aajav"
 house_aajav_modifier_desc:0 "La bannière d’Aajav vole haut dans le ciel, le dernier cri de défiance d’un monde mourant. Il n’y a pas de retour en arrière maintenant."
 house_kurru_modifier:0 "Maison Kurru"
 house_kurru_modifier_desc:0 "Les membres de la Maison Kurru sont exceptionnellement à l’aise dans leur rôle de leader par rapport au reste du clan Gangrel. Leur approche directe de la domination les laisse souvent ouverts à des tactiques sournoises."
 house_vola_modifier:0 "Maison Vola"
 house_vola_modifier_desc:0 "Les vaillants habitants du Nord de la Maison Vola n’ont aucune patience pour les imbéciles. Il y a des raids et des pillages à faire!"
 house_anda_modifier:0 "Maison Anda"
 house_anda_modifier_desc:0 "Le fléau des steppes sont des guerriers sans égal, mais ils peuvent avoir du mal à s’adapter aux rigueurs de la domination de vastes étendues de terre."
 house_akunanse_modifier:0 "Maison Akunanse"
 house_akunanse_modifier_desc:0 "Les araignées sages de l’Afrique montrent peu d’intérêt pour le Jyhad. Cela les rend utiles en tant que voisins , mais misérables en tant que dirigeants."
 house_noiad_modifier:0 "Maison Noiad"
 house_noiad_modifier_desc:0 "Les étranges caïnites du Nord gelé sont des créatures sauvages, pas vraiment adaptées à gouverner les zones peuplées."
 house_montano_modifier:0 "Maison Montano"
 house_montano_modifier_desc:0 "Les chefs traditionnels du Clan Lasombra sont des mystiques reclus, souvent peu adaptés à leurs rôles."
 house_deruiz_modifier:0 "Maison De Ruiz"
 house_deruiz_modifier_desc:0 "Les ennemis détestés du musulman ibérique sont profondément enracinés dans la culture chevalresque ibérique et en font pleinement usage."
 house_narses_modifier:0 "Maison Narses"
 house_narses_modifier_desc:0 "Les anciens grands leaders de l’hérésie caïnites sont dispersés et brisés depuis la mort de leur archevêque. Leurs péchés n’ont pas été oubliés."
 house_boukephos_modifier:0 "Maison Boukephos"
 house_boukephos_modifier_desc:0 "L’enfant savant diplomate de Lasombra est un caïnite amical, aimé de la jeune génération. Il est souvent enclin à des crises d’errance loin de son royaume."
 house_sybil_modifier:0 "Maison Sybil"
 house_sybil_modifier_desc:0 "La lignée de la fille rejeté est à peine reconnue par le reste du clan. En tant que tel, ils ont appris à compter principalement sur eux-mêmes."
 house_gratiano_modifier:0 "Maison Gratiano"
 house_gratiano_modifier_desc:0 "Gratiano est destiné à de grandes choses. Et il tient à rappeler ce fait à tout le monde."
 house_khanommehr_modifier:0 "Maison Khanom Mehr"
 house_khanommehr_modifier_desc:0 "Loin de la politique, la Maison Khanom Mehr se consacre à la protection du clan et de son fondateur."
 house_karotos_modifier:0 "Maison Karotos"
 house_karotos_modifier_desc:0 "La lignée presque inconnue d’un mystérieux Lasombra porte quelques événements traumatiques passés mais a encore tout à prouver."
 house_qabilatalkhayal_modifier:0 "Maison Qabilat al-Khayal"
 house_qabilatalkhayal_modifier_desc:0 "Les Ashirra Lasombra sont sur la défensive, leur zèle implacable est à la fois une bénédiction et une malédiction en ces temps difficiles."
 house_allama_modifier:0 "Maison al-Lam'a"
 house_allama_modifier_desc:0 "Avec sa diplomatie souple, la petite Maison al-Lam assure sa survie, malgré sa réticence à utiliser des tactiques sournoises."
 house_tubalcain_modifier:0 "Maison Tubalcain"
 house_tubalcain_modifier_desc:0 "Maîtres de la Domination, la Maison Tubalcain n’apprécie pas les divergences d’opinions religieuses."
 house_tepelit_modifier:0 "Maison Tepelit"
 house_tepelit_modifier_desc:0 "Le reclus et presque inconnu Tepelit a vu des visions de son destin et certains disent, l’ont même accepté."
 house_blueeye_modifier:0 "Maison Blue Eye"
 house_blueeye_modifier_desc:0 "Cette lignée mythique de Lasombra est une lignée recluse, dont la plupart conviendraient qu’elle n’est pas apte à gouverner ou à occuper des postes de pouvoir."
 house_ramanga_modifier:0 "Maison Ramanga"
 house_ramanga_modifier_desc:0 "Une lignée impitoyable qui n’hésite pas à influencer ouvertement les mortels, la Maison de la Reine de Madagascar ne fait confiance qu’en matière de gouvernement."
 house_lamdiel_modifier:0 "Maison Lamdiel"
 house_lamdiel_modifier_desc:0 "Avec des visions sans fin de malheur et d’obscurité, il n’est pas facile d’être membre de la Maison Lamdiel."
 house_eater_modifier:0 "Maison Eater"
 house_eater_modifier_desc:0 "Il vous observe toujours, attendant le moment d’arracher vos mots si vous n’êtes pas prudent."
 house_brahina_modifier:0 "Maison Brahina"
 house_brahina_modifier_desc:0 "Créatures d’une passion intense, les membres de la Maison Brahina ont du mal à rester concentrés sur un sujet pendant longtemps."
 house_delaurent_modifier:0 "Maison De Laurent"
 house_delaurent_modifier_desc:0 "Érudits concentrés et talentueux, les De Laurent sont meilleurs seuls dans leur bibliothèque, que de statuer dans une grande salle d’audience."
 house_midian_modifier:0 "Maison Midian"
 house_midian_modifier_desc:0 "Les tyrans peuvent avoir de la chance. Mais ils s’épuiseront toujours plus tôt que plus tard."
 house_banes_modifier:0 "Maison Banes"
 house_banes_modifier_desc:0 "Connaître l’avenir peut être une aubaine. Mais il peut aussi briser une emprise déjà précaire sur la réalité."
 house_plague_modifier:0 "Maison Fléaux"
 house_plague_modifier_desc:0 "La Maison des Fléaux a une mission singulière et horrible qui les rend très dangereux si l'on voudrait se rapprocher d'eux."
 house_izaha_modifier:0 "Maison Izaha"
 house_izaha_modifier_desc:0 "Cette Maison Malkavienne est encore plus furieuse que d’habitude, mais il y a un côté étrange dans leurs yeux tordus."
 house_lerterimas_modifier:0 "Maison Lerterimas"
 house_lerterimas_modifier_desc:0 "Chassée par leur propre clan pour leur alliance avec un pouvoir plus sombre, la Maison Lerterimas court vers une apocalypse de leur propre fabrication."
 house_panehesy_modifier:0 "Maison Panehesy"
 house_panehesy_modifier_desc:0 "Cette Maison égyptienne de Malkav a tenu de grandes positions dans les royaumes égyptiens antiques. Il semblait tenir leur raison en échec, sinon pour apaiser leur recherche d’une puissance supérieure."
 house_nissiku_modifier:0 "Maison Nissiku"
 house_nissiku_modifier_desc:0 "Le Prince Intelligent sait quand jouer et quand charmer. Sa présence est encore ressentie dans sa lignée, qui est obligée de toujours trouver de nouvelles façons de se livrer à son esprit toujours en expansion."
 house_vrykolakas_modifier:0 "Maison Vrykolakas"
 house_vrykolakas_modifier_desc:0 "Celui qui s’est échappé court toujours, sans jamais se retourner."
 house_yagnatia_modifier:0 "Maison Yagnatia"
 house_yagnatia_modifier_desc:0 "La grand-mère a fini de s’enfuir. Sa couvée tiendra bon et se battra jusqu’à la fin si besoin est."
 house_baytmutasharid_modifier:0 "Maison Bay't Mutasharid"
 house_baytmutasharid_modifier_desc:0 "Les Nosferatus dans le monde musulman qui ont refusé de rejoindre le Hajj vivent une vie isolée, amère et en marge de la société."
 house_trajan_modifier:0 "Maison Trajan"
 house_trajan_modifier_desc:0 "Si le réseau de Trajan n’est pas au courant d’une information, cela ne vaut tout simplement pas la peine d’être connu."
 house_absalon_modifier:0 "Maison Absalon"
 house_absalon_modifier_desc:0 "L’évêque mort-vivant du Danemark occupe des postes de pouvoir prestigieux dans sa terre natale. La seule terre qui mérite qu’on s’y intéresse, évidemment."
 house_yima_modifier:0 "Maison Yima"
 house_yima_modifier_desc:0 "Le Saint Graal du clan Nosferatu est la cause à se rallier, à se réconforter ou à en mourir pour elle."
 house_alexius_modifier:0 "Maison Alexius"
 house_alexius_modifier_desc:0 "Brûlant de fureur fanatique, la Maison Alexius est prête à purifier tous les non-croyants qui se dressent sur leur chemin."
 house_malachite_modifier:0 "Maison Malachite"
 house_malachite_modifier_desc:0 "Le Rocher de Constantinople est aussi son dernier espoir. Aucun obstacle ne pourra bloquer le chemin de l’Elu de Michel."
 house_guruhi_modifier:0 "Maison Guruhi"
 house_guruhi_modifier_desc:0 "Traditionnellement les leaders du Laibon, les Guruhi priment leur place, loin du caniveau de leurs cousins du Nord."
 house_al_hajj_modifier:0 "Maison al-Hajj"
 house_al_hajj_modifier_desc:0 "Protecteurs des Villes Saintes, indomptables dans leur foi."
 house_chandraputra_modifier:0 "Maison Chandraputra"
 house_chandraputra_modifier_desc:0 "Le leader incontesté du Clan Ravnos depuis des millénaires ne restera pas inactif car ses frères sont constamment attaqués. Victoire ou mort sont les seuls choix pour le Général."
 house_ravana_modifier:0 "Maison Ravana"
 house_ravana_modifier_desc:0 "Le traître a vendu son âme il y a longtemps. Ne jamais sous-estimer l’allure du mal brut."
 house_hazimel_modifier:0 "Maison Hazimel"
 house_hazimel_modifier_desc:0 "...et, tandis que vous regardez dans l’Oeil, une connaissance éternelle en jaillit."
 house_alexandrite_modifier:0 "Maison Alexandrite"
 house_alexandrite_modifier_desc:0 "Prendre de l’or à la bouche du Serpent est une action dangereuse auquel les Alexandrites sont habitués."
 house_rroma_modifier:0 "Maison Phuri Dae"
 house_rroma_modifier_desc:0 "Loin de chez eux, ils restent ensemble, à l’abri de la tempête sans fin."
 house_kali_modifier:0 "Maison Kali"
 house_kali_modifier_desc:0 "Une lignée oubliée, son existence rayée des archives des Ravnos pour leurs crimes abominables... ou leurs opinions divergentes."
 house_baytmujirim_modifier:0 "Maison Bay't Mujirim"
 house_baytmujirim_modifier_desc:0 "Méfiés par le monde Ashirra plus large, les Ravnos musulmans sont une race auto-dépendante, robuste sinon cynique."
 house_kinyonyi_modifier:0 "Maison Kinyonyi"
 house_kinyonyi_modifier_desc:0 "Les messagers du royaume d’ébène font plaisir à voir dans la plupart des cours, même s’ils ne restent jamais longtemps."
 house_samiel_modifier:0 "Maison Samiel"
 house_samiel_modifier_desc:0 "Les Anges ont fini de se cacher, de battre en retraite ou de se cacher. Il est temps de faire la guerre."
 house_enosh_modifier:0 "Maison Enosh"
 house_enosh_modifier_desc:0 "Les sages conseillers de la Maison Enosh sont un groupe stoïque, qui considère rarement la violence comme une possibilité."
 house_rayzeel_modifier:0 "Maison Rayzeel"
 house_rayzeel_modifier_desc:0 "Les guérisseurs du clan Salubri ont vu tant de morts à l’heure actuelle. Leur esprit s’affaiblit pour chaque blessure qu’ils réparent."
 house_twilight_modifier:0 "Maison Clair-Obscur"
 house_twilight_modifier_desc:0 "Défenseurs de l’humanité, inlassables dans leur guerre contre le mal."
 house_hrorsh_modifier:0 "Maison Hrorsh"
 house_hrorsh_modifier_desc:0 "Non préparée contre l’assaut cruel du Tremere, la Maison Hrorsh est un rappel fantomatique d’un clan autrefois glorieux."
 house_mokur_modifier:0 "Maison Mokur"
 house_mokur_modifier_desc:0 "TLe dernier à tomber, comme Saulot l’avait prévu."
 house_watcher_modifier:0 "Maison Wu Zao"
 house_watcher_modifier_desc:0 "Alors que leurs cousins de l’Ouest tombent, ils se tiennent dans les ombres orientales, leur garde ne fait que commencer."
 house_khaibit_modifier:0 "Maison Khaibit"
 house_khaibit_modifier_desc:0 "La lignée du premier fils de Set porte le respect et la crainte de ses pairs."
 house_sarrasine_modifier:0 "Maison Sarrasine"
 house_sarrasine_modifier_desc:0 "Sarrasine tuerait ses parents pour n’importe quel pouvoir. En fait, il l’a déjà fait."
 house_jormungandr_modifier:0 "Maison Jormungandr"
 house_jormungandr_modifier_desc:0 "Ces hérétiques sont à peine engagés dans une cause, sauf leur propre profit et leur survie."
 house_isis_modifier:0 "Maison Isis"
 house_isis_modifier_desc:0 "Méfiez-vous de la femme méprisée. Surtout quand elle est la fille d’Isis, et qu'elle tien le secret de la vie et de la mort dans sa paume."
 house_tawaret_modifier:0 "Maison Taweret"
 house_tawaret_modifier_desc:0 "Taweret a déjà combattu Kemintiri paralysé et a survécu pour raconter l’histoire. Sa prouesse traverse sa lignée."
 house_nefertiti_modifier:0 "Maison Nefertiti"
 house_nefertiti_modifier_desc:0 "Si l’orgueil vient avant la chute, Néfertiti va tomber pour très, très longtemps."
 house_maatkare_modifier:0 "Maison Maatkare"
 house_maatkare_modifier_desc:0 "L’allure douce du Serpent est miséricordieuse... et si attirante."
 house_seterpenre_modifier:0 "Maison Seterpenre"
 house_seterpenre_modifier_desc:0 "Le diplomate Hiérophanant est assez ouvert d’esprit pour travailler avec des étrangers. Certains le qualifieraient même de doux."
 house_heru_modifier:0 "Maison Heru"
 house_heru_modifier_desc:0 "Attention, ce serpent a de sérieux crocs."
 house_scorpio_modifier:0 "Maison Scorpio"
 house_scorpio_modifier_desc:0 "Cette Maison montre un goût alarmant à l’élaboration de plans longs, étirés et apocalyptiques. Ce qui est encore plus alarmant est que certains pourraient effectivement marcher un jour..."
 house_porphyrion_modifier:0 "Maison Porphyrion"
 house_porphyrion_modifier_desc:0 "Les Diables de l’Inde préparent des plans incalculables pour apporter la gloire de Set dans le sous-continent. S’ils réussissent, ce ne sera agréable pour personne."
 house_osiris_modifier:0 "Maison Osiris"
 house_osiris_modifier_desc:0 "Traqués par le Serpent, les Enfants du Dieu de la mort sont presque tous avec leur père maintenant."
 house_damballah_modifier:0 "Maison Damballah"
 house_damballah_modifier_desc:0 "Quelque peu éloignés du clan principal, les enfants de Damballah sont un lot pragmatique, adaptant leur croyance aux croyances africaines."
 house_khaytall_modifier:0 "Maison Khay'Tall"
 house_khaytall_modifier_desc:0 "Les hérétiques bannis autrefois associés au Constantinople de Michel sont une lignée chassée. Leurs options s'épuisent chaque nuit qui passe."
 house_wepwawet_modifier:0 "Maison Wepwawet"
 house_wepwawet_modifier_desc:0 "Cette secte guerrière défend l’Egypte des menaces extérieures, menaces qu’elle classe eux-mêmes."
 house_mucalinda_modifier:0 "Maison Mucalinda"
 house_mucalinda_modifier_desc:0 "Les méprisés Naktanchara sont des rejetons bouddhiste du clan Setite. Recluse et sur la défensive, leur position est précaire."
 house_glycon_modifier:0 "Maison Glycon"
 house_glycon_modifier_desc:0 "Les escrocs sont une caste avide de pouvoir des guerriers du clan Setite. Aveugles aux intrigues, ils ne sont que des brutes pointées sur la cible la plus proche."
 house_echidna_modifier:0 "Maison Echidna"
 house_echidna_modifier_desc:0 "Les Gorgones ont prévu leur propre disparition. Leur acceptation étrange de cela les rend craintifs par la plupart des Caïnites."
 house_nephilim_modifier:0 "Maison Nephilim"
 house_nephilim_modifier_desc:0 "La plus prestigieuse Maison du clan Toreador est tombée dans des moments difficiles à la mort de son fondateur. Les germes de la grandeurs sont toujours là cependant."
 house_salianna_modifier:0 "Maison Salianna"
 house_salianna_modifier_desc:0 "Salianna a déjà tout perdu deux fois. Elle ne laissera pas cela se produire une troisième fois."
 house_callisti_modifier:0 "Maison Callisti y Callisto"
 house_callisti_modifier_desc:0 "Diplomates qualifiés, les membres de cette Maison ont tendance à oublier les petites idées pour les grandes, qui s’est déjà avéré coûteux pour eux."
 house_nicholas_modifier:0 "Maison Nicholas"
 house_nicholas_modifier_desc:0 "Avec une lignée fabriquée, et un comportement oubliable, Etienne de Poitiers a fait de sa Maison une cible difficile à cerner."
 house_andrew_modifier:0 "Maison Andrew"
 house_andrew_modifier_desc:0 "L’Archange de l’hérésie caïnite a imprégné sa Maison de sa vision pragmatique d’utiliser la religion comme facteur de motivation pour la guerre."
 house_helena_modifier:0 "Maison Hélène"
 house_helena_modifier_desc:0 "Si tu n’es pas tombée amoureuse d’un membre de la Maison d’Hélène, c’est que tu n’en as pas encore rencontré un."
 house_baldr_modifier:0 "Maison Baldr"
 house_baldr_modifier_desc:0 "Les Skalds du Nord essaient de garder leurs contes vivants avec la puissance de leurs chansons et de leurs voix."
 house_lubbock_modifier:0 "Maison Lubbock"
 house_lubbock_modifier_desc:0 "Perdus dans leurs passions, les membres de la Maison Lubbock sont des proies faciles dans l’impitoyable monde caïnite."
 house_volgirre_modifier:0 "Maison Volgirre"
 house_volgirre_modifier_desc:0 "Les petits maîtres de la petite-gens, de l’esclavage et des domaines. Les membres de la Maison Volgirre sont des seigneurs sadiques et cruels."
 house_apollo_modifier:0 "Maison Apollo"
 house_apollo_modifier_desc:0 "Petites et délicates fleurs, à la recherche du soleil et facilement piétinées par la guerre."
 house_rayeenalfen_modifier:0 "Maison Ray'een al-Fen"
 house_rayeenalfen_modifier_desc:0 "Les calligraphes du monde musulman ont été entraînés dans un schisme générationnel pendant longtemps, assez pour le marquer dans leur sang."
 house_ishtarri_modifier:0 "Maison Ishtarri"
 house_ishtarri_modifier_desc:0 "Rongés par une faim profonde de se livrer à leurs vices, les Ishtarri sont néanmoins habiles dans l’art subtil de manipuler l’information."
 house_goratrix_modifier:0 "Maison Goratrix"
 house_goratrix_modifier_desc:0 "Le porteur de lumière assurera un nouvel âge pour le clan, ou sera avalé par l’obscurité."
 house_etrius_modifier:0 "Maison Etrius"
 house_etrius_modifier_desc:0 "Le régent élu de Tremere mène une défense solide à la tête d’un clan battu. Une position peu enviable."
 house_leduc_modifier:0 "Maison Le Duc"
 house_leduc_modifier_desc:0 "L’ancien régent de France était un caïnite respecté, bien plus que son remplaçant, Goratrix."
 house_meerlinda_modifier:0 "Maison Meerlinda"
 house_meerlinda_modifier_desc:0 "La seule femme du Conseil des Sept est la seule qui maintient la pyramide ensemble. L’Angleterre sera son prix, si elle peut déjouer les Caïnites méfiants des îles."
 house_calderon_modifier:0 "Maison Calderon"
 house_calderon_modifier_desc:0 "L’Espagnol féroce défendra l’honneur de Tremere jusqu’à son dernier souffle, ignorant les forces plus sombres à l’œuvre."
 house_grimgroth_modifier:0 "Maison Grimgroth"
 house_grimgroth_modifier_desc:0 "Les fantômes de Mistridge sont toujours en colère jusqu’à ce soir, un nom prononcé sur un ton maudit : Grimgroth."
 house_cincao_modifier:0 "Maison De Cincao"
 house_cincao_modifier_desc:0 "Xavier est impitoyable dans ses méthodes, mais personne ne peut nier qu’il fournit des résultats étonnants en le faisant."
 house_telyavel_modifier:0 "Maison Telyavel"
 house_telyavel_modifier_desc:0 "Chassés en tant qu’hérétiques, les Magus de la Vieille Foi trouvent une relative sécurité avec des Caïnites aux vues similaires."
 house_trimira_modifier:0 "Maison Trimira"
 house_trimira_modifier_desc:0 "Des étrangers dans un pays hostile, forcés de faire des concessions pour survivre."
 house_kartarirya_modifier:0 "Maison Kartarirya"
 house_kartarirya_modifier_desc:0 "Les nombreux Tzimisce armés de l’Inde sont connus pour couper plusieurs têtes avant de poser des questions."
 house_yaroslavich_modifier:0 "Maison Yaroslavich"
 house_yaroslavich_modifier_desc:0 "Plus il devient puissant, plus Hedeon prend plaisir à écraser ses ennemis pathétiques."
 house_ruthvenski_modifier:0 "Maison Ruthvenski"
 house_ruthvenski_modifier_desc:0 "Les gardiens de la forme corporelle de Tzimisce sont aveuglés par leur position prestigieuse, ignorant les nombreuses menaces qu’elle comporte."
 house_vykos_modifier:0 "Maison Vykos"
 house_vykos_modifier_desc:0 "Myka est sur une longue quête de sens. La fin de la route se rapproche encore plus chaque nuit passant..."
 house_rustovitch_modifier:0 "Maison Rustovitch"
 house_rustovitch_modifier_desc:0 "Vladimir tente d’apprivoiser le clan Tzimisce par la force des armes. Un geste audacieux et potentiellement mortel."
 house_yorak_modifier:0 "Maison Yorak"
 house_yorak_modifier_desc:0 "Imaginez votre pire cauchemar sous forme humaine. Vous torturer pour l’éternité. Comme ses précédentes victimes vous observent, avant que vous les rejoigniez sur les murs de la cathédrale."
 house_tabak_modifier:0 "Maison Tabak"
 house_tabak_modifier_desc:0 "La Maison Tabak est élevé pour la souverainté, sachant exactement quand soutirer les dernière goutte de sang des paysans, ou quand courir lorsqu’ils sont surpassés."
 house_dracon_modifier:0 "Maison Dracon"
 house_dracon_modifier_desc:0 "Les pieux descendants du Dracon et de l’Obertus se sont mal adaptés à la guerre et ont évités les pratiques vicissitude de leurs frères."
 house_byelobog_modifier:0 "Maison Byelobog"
 house_byelobog_modifier_desc:0 "Le Dieu Blanc règne sur l'Hiver, mais ne se soucie pas de gouverner sur autre chose."
 house_triglav_modifier:0 "Maison Triglav"
 house_triglav_modifier_desc:0 "La Maison Triglav est consumée par sa querelle contre la Maison Dracon, ils sont à peine capable de faire autre chose."
 house_andeleon_modifier:0 "Maison Andeleon"
 house_andeleon_modifier_desc:0 "Loin des préoccupations les plus banales, Andeleon cherche la vérité au-delà des étoiles."
 house_demdemeh_modifier:0 "Maison Demdemeh"
 house_demdemeh_modifier_desc:0 "Le vrai savant sait qu’il doit transcender la chair pour devenir un Dieu."
 house_djavakhi_modifier:0 "Maison Djavakhi"
 house_djavakhi_modifier_desc:0 "Quand vous gouvernez avec une main de fer, ne baissez jamais les bras."
 house_nagloper_modifier:0 "Maison Nagloper"
 house_nagloper_modifier_desc:0 "Comment la Bête peut-elle vous contrôler si vous êtes la Bête elle-même ?"
 house_hrothgar_modifier:0 "Maison Hrothgar"
 house_hrothgar_modifier_desc:0 "Vous pouvez semer votre propre clan, mais pouvez-vous semer Ragnarok ?"
 house_jedrik_modifier:0 "Maison Jedrik"
 house_jedrik_modifier_desc:0 "Parfois, la plus grande menace de votre règne est plus proche de vous que vous ne le pensez."
 house_tinia_modifier:0 "Maison Tinia"
 house_tinia_modifier_desc:0 "Consommés par l’errance, les membres de la Maison Tinia aspirent à de nouvelles expériences exotiques."
 house_mithras_modifier:0 "Maison Mithras"
 house_mithras_modifier_desc:0 "Les descendants du Dieu Soleil rentrent dans le rang facilement, ayant été conditionnés par leur ancêtre depuis maintenant des siècles."
 house_alexander_modifier:0 "Maison Alexandre"
 house_alexander_modifier_desc:0 "Alexandre a prouvé son intendance astucieuse en régnant sur l’empire le plus puissant de l’Europe occidentale. Mais ses accès de colère étaient aussi légendaires."
 house_antonian_modifier:0 "Maison Antonian"
 house_antonian_modifier_desc:0 "L’architecte du Rêve a construit l’une des utopies les plus impressionnantes du monde caïnite. Jusqu’à ce qu’il ne craque et était détruit pour elle."
 house_camilla_modifier:0 "Maison Camilla"
 house_camilla_modifier_desc:0 "Les descendants de Rome sont fiers à juste titre de leur héritage. Le vaste prestige et la considération qu’ils exercent peuvent facilement les rendre indolents."
 house_eigermann_modifier:0 "Maison Eigermann"
 house_eigermann_modifier_desc:0 "Brutes et tyrans à peine intégrés dans le clan Ventrue, la Maison Eigermann est son pire ennemi."
 house_artemis_modifier:0 "Maison Artemis"
 house_artemis_modifier_desc:0 "Les Orthiens Ventrue saisissent des trônes et attendent rarement le moment où une lame peut accélérer le processus. Ils croient que la gloire leur est due, et la prennent sans attendre."
 house_bindusara_modifier:0 "Maison Bindusara"
 house_bindusara_modifier_desc:0 "L'érudit' errant est une source de connaissances, il a souvent cherché à apprendre les voies mystérieuses des générations passées."
 house_veddartha_modifier:0 "Maison Veddartha"
 house_veddartha_modifier_desc:0 "Presque synonyme de Ventrue lui-même, Veddartha est une Maison de souverain fier et diligent."
 house_arakur_modifier:0 "Maison Arakur"
 house_arakur_modifier_desc:0 "La lignée d’Arakur est réputée pour ses diableries, ses communions avec les démons et son orgueil. Ils sont aussi des lâches brevetés quand ils ne peuvent pas se frayer un chemin."
 house_medon_modifier:0 "Maison Medon"
 house_medon_modifier_desc:0 "Medon a l’honneur douteux d’être le premier vampire vraiment puissant à avoir été tué par les mortels. Une honte encore ressentie par sa lignée aujourd’hui."
 house_nefermeriisis_modifier:0 "Maison Nefer-meri-Isis"
 house_nefermeriisis_modifier_desc:0 "La féroce enfant de Ventrue préfère se salir les mains au combat. En tant que telle, sa lignée méprise de devoir compter sur les autres."
 house_arpad_modifier:0 "Maison Arpad"
 house_arpad_modifier_desc:0 "Tenace et bien ancrée dans la noblesse hongroise, la Maison Arpad est un ennemi difficile à déloger de leurs terres."
 house_antasia_modifier:0 "Maison Antasia"
 house_antasia_modifier_desc:0 "La sereine et bien connectée Julia Antasia nourrit sa couvée pour être une mère respectueuse et amicale, abordant toujours les questions avec soin et compassion."
 house_le_croise_modifier:0 "Maison le Croise"
 house_le_croise_modifier_desc:0 "Geoffrey est tourmenté par les mêmes problèmes de colère que son père. Il ne peut compter que sur son comportement chevaleresque pour le sauver de la colère de son clan."
 house_moloch_modifier:0 "Maison Molochim"
 house_moloch_modifier_desc:0 "Gardiens d’un monde ingrat, les Molochim sont pourchassés par les autres clans et le leur. Les premiers ne comprennent pas leur but, et les seconds le comprennent que trop bien."
 house_nergal_modifier:0 "Maison Nergalite"
 house_nergal_modifier_desc:0 "Un fléau sur un monde qu’ils veulent voir brûler, les enfants de Nergal sont les abominations les plus noires que la malédiction de Caïn ait jamais produit."
 house_angellisater_modifier:0 "Maison Azanaeli"
 house_angellisater_modifier_desc:0 "Les odieux Angellis Ater sont des usurpateurs au sein du clan Baali, à la recherche d’une voie démente vers la mort."
 house_wankuei_modifier:0 "Maison Wan Kuei"
 house_wankuei_modifier_desc:0 "Les Morts Affamés de Chine sont les maîtres d’un vaste Empire, mais ils souffrent de certaines limitations graves dont les Caïnites occidentaux pourraient profiter."
 house_asuratizayya_modifier:0 "Maison Asuratizayya"
 house_asuratizayya_modifier_desc:0 "Marqués comme hérétiques par les autres Wan Kuei, les Indiens Asuratizayya se tiennent toujours à un système rigide mais fonctionnel de castes et de hiérarchie."
 house_penangallan_modifier:0 "Maison Penangallan"
 house_penangallan_modifier_desc:0 "Les Wan Kuei de la Cour Écarlate, décentrés et matriarcaux, sont très turbulents, essayant de vivre leur vie jusqu’au bout."
 house_wanderers_modifier:0 "Maison Wanderers"
 house_wanderers_modifier_desc:0 "Rongés par Akumas, les Wan Kuei des steppes sont en sursis."
 dynn_nagaraja_modifier:0 "Nagaraja"
 dynn_nagaraja_modifier_desc:0 "La malédiction odieuse du Nagaraja en fait un lot ignoré, mais aussi résilient."
 dynn_unbound_modifier:0 "Unbound"
 dynn_unbound_modifier_desc:0 "La simple rumeur de l’existence d’un tel Caïnite et de sa lignée est une menace à l’ordre établi."
 dynn_kiasyd_modifier:0 "Kiasyd"
 dynn_kiasyd_modifier_desc:0 "Les Kiasyd reclus et mystérieux font des ravages dans leurs laboratoires d’alchimie, ignorant les menaces qui grandissent autour d’eux."
 dynn_impundulu_modifier:0 "Impundulu"
 dynn_impundulu_modifier_desc:0 "Les Impundulus sont à la recherche d'une échappatoire dans un contrat conclu il y a longtemps qui ralentirait leur mise à mort."
 house_ahrimane_modifier:0 "Ahrimane"
 house_ahrimane_modifier_desc:0 "Adisa ne s’est jamais mis à genoux ou a battu en retraite d’un combat. Ses filles non plus, Freya regarde après tout."
 house_feroux_modifier:0 "Feroux"
 house_feroux_modifier_desc:0 "Les soi-disant Gangrels grecs sont une lignée fière, ayant été l’une des principales forces derrière le Rêve de Constantinople. Sa perte pèse lourd sur leurs âmes."
 house_siren_modifier:0 "Filles de la Cacophonie"
 house_siren_modifier_desc:0 "Ils chantent pour moi, les sirènes des sept mers..."
 dynn_knightsofacre_modifier:0 "Chevalier d'Acre"
 dynn_knightsofacre_modifier_desc:0 "Les Chevaliers sont féroces au combat en effet, mais méprise les façons plus subtiles de perturber les plans de l’ennemi."
 dynn_swordofstjames_modifier:0 "Épée de St. James"
 dynn_swordofstjames_modifier_desc:0 "Soyons honnêtes, les disciples de Rodrigue sont des abrutis arrogants. Mais ils sont aussi durs comme des clous abrutis et arrogants !"
 dynn_redorder_modifier:0 "Ordre Rouge"
 dynn_redorder_modifier_desc:0 "Ils connaissent de terribles secrets sur les horreurs de l’inconnu. Mais tant de temps passé dans les bibliothèques les a aussi rendus assez... faibles à des tactiques plus ancrées."
 dynn_sistersjohn_modifier:0 "Sœur de St. John"
 dynn_sistersjohn_modifier_desc:0 "Tourmentées par de terribles visions de malheur, les Sœurs ont créé un sens administratif très robuste pour fonder leur existence terrible."
 dynn_oculidei_modifier:0 "Oculi Dei"
 dynn_oculidei_modifier_desc:0 "Les membres paranoïaques des Yeux de Dieu ont souvent raison au sujet de leurs peurs. Mais cela ne les rend pas aimés par leurs semblables pour autant."
 dynn_murnau_modifier:0 "Von Murnau"
 dynn_murnau_modifier_desc:0 "La fière Maison Allemande est habituée à traiter avec les paysans fraudeurs d’impôts. La crainte de Dieu n’est pas seulement pour les descendants de l’Enfer après tout."
 dynn_gantenbein_modifier:0 "Gantenbein"
 dynn_gantenbein_modifier_desc:0 "Les frères bogomistes zélés ont du mal à concilier leur foi honnête et leur besoin de sang de vampire. Cela les éloigne de leur troupeau."
