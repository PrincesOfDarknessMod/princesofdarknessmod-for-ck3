l_french:
 mithras_bane_modifier:0 "Malédiction de Mithras"
 mithras_bane_modifier_desc:0 "Ce prestigieux Vampire a évincé Mithras et ses semblables de Britannia. Un tel exploit est connu partout."
 politically_secure_modifier:0 "Stable Politiquement"
 politically_secure_modifier_desc:0 "Vous avez choisi de vous investir en reconstruisant votre utopie. Bien qu’ils ne le diront jamais vraiment, beaucoup sont reconnaissants de ce plan d’action."
 hostile_shadows_modifier:0 "Ombres Hostiles"
 hostile_shadows_modifier_desc:0 "Votre ascension fulgurante a fait beaucoup d’envieux. Il y aura des poignards qui vous attendront dans l’ombre pendant longtemps."
 blood_horn_modifier:0 "Corne de Sang"
 blood_horn_modifier_desc:0 "Vous avez redécouvert la célèbre corne de sang d’Odin, un artefact qui peut créer du sang à partir de n’importe quel liquide."
 broken_authority_modifier:0 "Autorité Contesté"
 broken_authority_modifier_desc:0 "Ce personnage a perdu une crédibilité alarmante. Une situation dangereuse dans la politique vampire."
 capital_past_modifier:0 "Relique d'Al Andalus"
 capital_past_modifier_desc:0 "Les mortels ont oublié l'époque Al Andalus, mais cette ville a une société de morts-vivants dédiée à la préservation des souvenirs de leur patrimoine commun."
 sword_of_troile_modifier:0 "Épée de Troile"
 sword_of_troile_modifier_desc:0 "L’une des armes les plus puissantes de l’histoire de la Famille, cette épée, apparemment en cristal, a été brandie par Troile elle-même au cours de ses nombreuses batailles pour la défense de Carthage. "
 zmei:0 "Zmei"
 zmei_flavor:0 "#F Des créatures redoutables d’un pouvoir immense, autrefois serviteurs du Wyrm, maintenant liées à Baba Yaga, la Petite Grand-Mère.#!"
 #zmei_legacy_perk_effect:0 "#F Des créatures redoutables d’un pouvoir immense, autrefois serviteurs du Wyrm, maintenant liées à Baba Yaga, la Petite Grand-Mère. #!" 
 babayaga_victory_opinion:0 "Loyal envers la Couronne"
 eyes_and_ears_modifier:0 "Des Yeux et des Oreilles"
 eyes_and_ears_modifier_desc:0 "En tant que chef du clan Nosferatu, votre réseau d’informateurs est sans égal."
 fortified_alamut_modifier:0 "Alamut Unifié"
 fortified_alamut_modifier_desc:0 "Libre de luttes internes, le Nid d’Aigle se dresse indomptable comme la première forteresse du monde caïnite."
 path_of_the_zealot_modifier:0 "Zélote Haqimite"
 path_of_the_zealot_modifier_desc:0 "Unis sous la bannière de la foi, chaque Assamite est maintenant un puissant défenseur de la vérité."
 path_of_the_diplomat_modifier:0 "Diplomate Haqimite"
 path_of_the_diplomat_modifier_desc:0 "Unis sous une nouvelle direction, chaque Assamite est maintenant capable de faire appel à des faveurs et à des amis du monde entier."
 path_of_the_sorcerer_modifier:0 "Sorcier Haqimite"
 path_of_the_sorcerer_modifier_desc:0 "Reclus, mais maintenant unis dans leurs recherches, le clan Assamite est le gardien de nombreux secrets inconnus."
 eternal_consul_modifier:0 "Consul Éternel"
 eternal_consul_modifier_desc:0 "Le souverain de Rome la Pécheresse est une créature charmante, qui n’a besoin que d’un murmure pour que les désirs les plus sombres se réalisent."
 lasombra_chronicles_modifier:0 "Les Chroniques de Lasombra"
 lasombra_chronicles_modifier_desc:0 "Les volumes concluant sur la montée du sauveur du clan Lasombra, fléau des Ashirra."
 eternal_caliph_modifier:0 "Calife Éternel"
 eternal_caliph_modifier_desc:0 "Le Calife Éternel victorieux des Ashirra est un être d’une immense autorité spirituelle et temporelle."
 ashirra_castle_modifier:0 "Castel Del'Ombro Ashirra"
 ashirra_castle_modifier_desc:0 "Alors que le clan Lasombra vient d’être dominé par les Ashirra, un nouveau, plus approprié, quartier général est en cours de construction."
 impressed_westerner_opinion:0 "Gangrel de l’Ouest impressionné"             
 collapse_civilisation_modifier:0 "Effondrement de la Civilisation"
 collapse_civilisation_modifier_desc:0 "Les loups sont à la porte, et vous pouvez à peine les tenir à l’écart. Votre contrôle ne s’étend pas beaucoup plus loin que votre salle du trône désormais."
 alpha_gangrel_modifier:0 "Gangrel Alpha"
 alpha_gangrel_modifier_desc:0 "Vous avez vaincu tous vos adversaires. Tout le clan vous traite avec respect, sinon avec obéissance."
 prime_councilor_modifier:0 "Premier Conseiller"
 prime_councilor_modifier_desc:0 "Régent du clan à la place de Tremere, cet individu a accès à des connaissances rares et peut compter sur la loyauté de ses congénaires."
 prime_curse_modifier:0 "Malédiction du Premier Conseiller"
 prime_curse_modifier_desc:0 "La malédiction du Premier Conseiller a touché cet individu, ce qui rend difficile pour eux de penser correctement."
 dark_nobility_modifier:0 "Noblesse Noire"
 dark_nobility_modifier_desc:0 "Régnant sur les châteaux ombragés et la population opprimée, le clan Tzimisce est l’un des dirigeants intimidants."
 kupala_empowered_modifier:0 "Habilité par Kupala"
 kupala_empowered_modifier_desc:0 "Vous avez conclu un accord avec le diable. Littéralement."
 kupala_depowered_modifier:0 "Désapprouvé par Kupala"
 kupala_depowered_modifier_desc:0 "Le Carpathe terrestre a pris la force vitale de cet individu afin de renforcer son serviteur préféré."
 sargon_codex_modifier:0 "Sargon Codex"
 sargon_codex_modifier_desc:0 "Le pouvoir ultime, ou du moins la connaissance, est à vous. Votre santé mentale ne l'est plus cenpendant."
 grateful_brethren_opinion:0 "Disciples Reconnaissants"
 sargon_fragment_modifier:0 "Fragment Sargon"
 sargon_fragment_modifier_desc:0 "Un simple fragment du Codex Sargon détruit est encore un puissant réceptacle de prophéties et de perspicacités."
 pseudo_third_modifier:0 "Troisième Pseudo"
 pseudo_third_modifier_desc:0 "Vous n’avez pas vraiment complété la diablerie de Cappadoce, mais vous êtes encore presque un niveau de puissance et de prestige de 3ème génération."
 cappadocian_purge_modifier:0 "Purge Cappadoce"
 cappadocian_purge_modifier_desc:0 "Le nouveau clan Giovanni se concentre sur l’élimination de ses anciens bienfaiteurs, et tous ceux qui voudraient les abriter."
 kill_on_sight_modifier:0 "Tuer à vu"
 kill_on_sight_modifier_desc:0 "Ciblés par leurs ennemis, ces personnages sont en sursis, chassés à chaque coin de rue."
 decentralized_rule_modifier:0 "Règne Décentralisé"
 decentralized_rule_modifier_desc:0 "Vous n’êtes que le gardien de la paix d’une variété de structures politiques différentes. En tant que tel, on vous respecte, mais on ne vous obéit pas toujours."
 serpent_allure_modifier:0 "Allure de Serpent"
 serpent_allure_modifier_desc:0 "Vous êtes bénis par Set lui-même, portant une aura palpable promettant l’accomplissement de chaque désir sombre."
 sword_of_samiel_modifier:0 "Épée de Samiel"
 sword_of_samiel_modifier_desc:0 "Le légendaire premier guerrier Salubri était un combattant hors pair, prêt à aller au-delà de son devoir contre les forces des ténèbres."
 saulot_heir_modifier:0 "Héritier de Saulot"
 saulot_heir_modifier_desc:0 "Vous êtes une créature aussi sage que Saulot lui-même, certains disent même que vous avez finalement trouvé Golconda après toutes ces années de conflit."
 usurpers_exposed_modifier:0 "Usurpateurs Exposés"
 usurpers_exposed_modifier_desc:0 "Le clan Tremere a été exposé pour ce qu’il est. Une bande de menteurs qui ont presque poussé le clan Salubri à l’extinction pour leur propre profit."
 herald_of_the_end_modifier:0 "Le Grand Ennemis"
 herald_of_the_end_modifier_desc:0 "Vous êtes Nergal renaissant, le précurseur de la fatalité et de la damnation de ce monde maudit. Ils s’inclineront tous, ou mourront."
 demons:0 "Démons terrestres"
 demons_flavor:0 "#F Les Anges déchus de la rébellion de Lucifer. Leur prison abyssale a des faiblesses, et ils peuvent être appelés sur le plan mortel et liés à un coût élevé.#!"
 demons_legacy_perk_effect:0 "#F Fallen Angels from the doomed Lucifer's rebellion. Their abyssal prison has weaknesses, and they can be summoned to the mortal plane and bound at a great cost. #!" 
 rebel_conqueror_modifier:0 "Le conquérant rebelle de l’Ouest"
 rebel_conqueror_modifier_desc:0 "Vous ne vous inclinez devant aucune cour ou ancêtre. Dans vos terres, votre volonté est suprême, et malheur à ceux qui vous défient."
 first_magaji_modifier:0 "Premier Magaji"
 first_magaji_modifier_desc:0 "Le premier Magaji officiellement reconnu de toute l’Afrique revêt une importance considérable dans la politique des Laibon."
 TARGET_IS_HUNTER:0 "Est un Inquisiteur $VALUE|=+0$"
 TARGET_IS_VAMPIRE:0 "Est un Vampire $VALUE|=+0$"
 chosen_of_light_modifier:0 "Élu de la Lumière"
 chosen_of_light_modifier_desc:0 "Il y a une étrange aura autour de ce personnage. Comme si le divin lui-même l’avait choisi pour un plus grand dessein."                                 
