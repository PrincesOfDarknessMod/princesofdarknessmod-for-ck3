 arsenal_of_the_beast_gaping_maw_modifier:0 "裂颌"
 arsenal_of_the_beast_gaping_maw_modifier_desc:0 "The character’s jaw unhinges or simply distends impossibly wide, presenting row upon row of glistening fangs."
 arsenal_of_the_beast_horns_modifier:0 "双角"
 arsenal_of_the_beast_horns_modifier_desc:0 "The character sprouts archetypal goat horns, antlers like a stag, unnatural bone spurs protruding from the skull or some other growth that enables goring attacks."
 arsenal_of_the_beast_lashing_tail_modifier:0 "鞭尾"
 arsenal_of_the_beast_lashing_tail_modifier_desc:0 "The character sports a powerful muscular tail."
