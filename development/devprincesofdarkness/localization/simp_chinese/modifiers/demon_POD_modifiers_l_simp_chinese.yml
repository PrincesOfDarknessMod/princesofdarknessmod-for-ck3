 arsenal_of_the_beast_tentacles_modifier:0 "触手"
 arsenal_of_the_beast_tentacles_modifier_desc:0 "The character has a long tentacle or prehensile tail."
 arsenal_of_the_beast_wings_modifier:0 "翅膀"
 arsenal_of_the_beast_wings_modifier_desc:0 "The character grows large wings from her back, stretching a third again as long as the character is tall at full extension."
 possessing_a_dead_body_modifier:0 "附身尸体"
 possessing_a_dead_body_modifier_desc:0 "附身死尸会造成对死尸的伤口特质增加，而非生命力损失修正，但直到你的所有的死尸容器都达到最大伤口等级前，你都会维持附体。"
