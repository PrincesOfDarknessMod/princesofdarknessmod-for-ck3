 trait_vampgeneration16_desc:0 "淡血种"
 trait_something_unusual:0 "略有怪异"
 trait_something_unusual_desc:0 "关于其似乎有什么不同寻常之处。"
 trait_revenant:0 "亡魂"
 trait_revenant_desc:0 "一个体内流淌着吸血鬼血液的独立血仆。"
 trait_oathbreaker:0 "破誓者"
 trait_oathbreaker_desc:0 "该角色违反了血誓。"
 trait_regnant:0 "血主"
 trait_regnant_desc:0 "这名角色创造了一个血仆。"
 trait_massregnant:0 "多仆血主"
 trait_massregnant_desc:0 "这名角色一次性创造了大量血仆。这通常意味着潜藏的打破。"
 trait_unbondable:0 "免疫血缚"
 trait_unbondable_desc:0 "该角色无法被血缚。"
 trait_exposed:0 "曝露"
 trait_exposed_desc:0 "该生物的超自然本质已经被凡人揭露。猎人会计划对他发起攻击。"
 trait_nagaraja:0 "那伽罗阇"
 trait_nagaraja_desc:0 "那伽罗阇是一种奇异的食肉吸血鬼血系，被千年圣战双方的所有血族成员所惧怕。"
 trait_hecata:0 "赫卡塔"
 trait_hecata_desc:0 "他们不是一个完全有机的氏族，从单一的上古耆宿和不间断的血系中派生出来，而是由乔凡尼和古老的卡帕多西亚氏族的残余以及他们相关的血系组成；包括那伽罗阇，尽管其与上古耆宿没有联系。"
 trait_impundulu:0 "魔蛇鹫"
 trait_impundulu_desc:0 "依附于凡人巫师集会的吸血鬼血系，他们被认为是莱本的传承之一。魔蛇鹫生前是一位强大的亡灵术师，娶了一个同样强大的生命女巫邦卡齐。"
 trait_sire:0 "尊长"
 trait_sire_desc:0 "这名吸血鬼创造了另一个他的同类。"
 trait_masssire:0 "尊长"
 trait_masssire_desc:0 "这名吸血鬼创造了大量吸血鬼。大部分道视之为对避世的违背。"
 trait_lamia:0 "拉米亚"
 trait_lamia_desc:0 "拉米亚是致力于保卫卡帕多西亚氏族的该隐之子血系，尽管最初他们是一群声称是亚当第一任妻子莉莉丝的后裔的密教徒。"
 trait_gangrel_greek:0 "希腊冈格罗"
 trait_gangrel_greek_desc:0 "希腊冈格罗是起源于黑暗时代的一条分支。\n\n早在巴比伦之前，冈格罗就已经在人类的城市中藏身。几个世纪过去了，这些冈格罗专注于在一个不同的环境中生存——一个充满独特危险的环境。"
 trait_ahrimane:0 "恶灵"
 trait_ahrimane_desc:0 "恶灵是一个罕见的，全女性血族的血系，最初存在于黑暗时代，由一位叫阿迪萨的女人领导。\n\n恶灵的故事，正如她们所说的那样，从女武神阿迪萨开始，她是挪威女神芙蕾雅的女儿。"
 trait_patron:0 "赞助者"
 trait_patron_desc:0 "对本Mod赞助过的人物"
 trait_werewolf_desc:0 "一种能够转换形态的超自然生物。他们自称「狼族」。"
 trait_wraith:0 "死灵"
 trait_wraith_desc:0 "一个被黑魔法或对他们留下的东西的依恋拖回了尘世的死去灵魂。"
 trait_koldunicsorcery:0 "库都魔术"
 trait_koldunicsorcery_desc:0 "库都魔术或库都术是棘秘魑掌握的一种该隐之子[bloodsorcery|E]。\n\n库都魔术从概念上来说类似于奇术，但实际应用却天差地别。"
 trait_koldunicsorceryadvanced:0 "高阶库都魔术"
 trait_koldunicsorceryadvanced_desc:0 "库都魔术或库都术是棘秘魑掌握的一种该隐之子[bloodsorcery|E]。\n\n库都魔术从概念上来说类似于奇术，但实际应用却天差地别。"
 trait_harbringersofskulls:0 "骸骨先知"
 trait_harbringersofskulls_desc:0 ""
 trait_raktasadhus_ashirra:0 ""
 trait_raktasadhus_ashirra_desc:0 ""
 trait_unusual:0 "怪异"
 trait_unusual_desc:0 "关于这人似乎有什么不同寻常之处。"
 trait_szlachta:0 "什拉赫塔"
 trait_szlachta_desc:0 "一个摄入了吸血鬼的血，然后被变幻术异能转变的凡人。"
 trait_zadruga:0 "家传血仆"
 trait_zadruga_desc:0 "棘秘魑称呼可遗传血仆的术语。在所有的氏族中，棘秘魑培育的血仆家庭最多。"
 trait_kinfolk:0 "狼嫡"
 trait_kinfolk_desc:0 "流着狼血，狼族的后代。"
 trait_truefaith:0 "真信"
 trait_truefaith_desc:0 "这个角色真的信仰神的存在。这是他灵魂的核心部分，让他能够获得一些可能被称为非自然的能力。但是要注意，有罪的人最终会被剥夺他们神圣天赋。"
 trait_beatific:0 "荣福"
 trait_beatific_desc:0 "他是神的化身，是创造奇迹的人，是黑暗世界中信仰的真正典范。这让他获得了一些可能被称为非自然的能力。但是要注意，有罪的人最终会被剥夺他们神圣天赋。"
 trait_turnedhunter:0 "被转化的猎人"
 trait_turnedhunter_desc:0 "此怪物猎人在行责期间被超自然力量转化了"
 trait_bloodgorged:0 "血酣"
 trait_bloodgorged_desc:0 "一位受益与想要给生命注入尽可能获得的最强大的血族精血的疯狂实验或者不洁仪式的存在。"
 trait_holy_seal:0 "神圣封印"
 trait_holy_seal_desc:0 "圣遗物和圣器残忍地，但却巧妙地嵌进了这个痛苦的个体的伤口，使其无法愈合。"
 trait_custom_bloodline:0 "[ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 trait_custom_bloodline_desc:0 "该隐之子的新生血系。尽管大多数血族都不将他们视同，但[ROOT.Char.GetDynasty.GetBaseNameNoTooltip]已经准备好展示他人谁才是暗夜的真正统治者。"
 trait_leading_front:0 "领军于前"
 trait_leading_front_desc:0 "阿尔忒弥斯·欧西雅为每位梵卓提供了模范，有时杀进你的敌人可能比计谋和外交更好地解决问题"
 trait_hun_tactics:0 "狂野战术"
 trait_hun_tactics_desc:0 "玛塔孙塔为每位冈格罗提供了模范，对你野性的利用会帮助你赢得胜利"
 trait_swift_movement:0 "迅捷移动"
 trait_swift_movement_desc: "汉尼拔为每位布鲁赫提供了模范，要知兵贵神速"
 trait_samiel_follower:0 "萨麦尔的追随者"
 trait_samiel_follower_desc:0 "萨麦尔为每位萨洛比提供了模范，即使你的运势不佳，也要打击邪恶，因为邪恶会在不经磨难的心灵中兴盛"
 trait_shadow_warrior:0 "受人敬畏"
 trait_shadow_warrior_desc:0 "贾迈勒为每位哈基姆之嗣提供了模范，如果他们在见到你之前就害怕你的行为，那战斗就已经赢了"
 trait_faithful_warrior:0 "虔信战士"
 trait_faithful_warrior_desc:0 "塔利克为每位诺斯费拉图提供了模范，为信仰而战是一项有价值的事业"
 trait_shadow_reconquista_warrior:0 "暗影作战"
 trait_shadow_reconquista_warrior_desc:0 "西尔维斯特·德·鲁伊斯为每位勒森魃提供了模范，要知战争中兵不厌诈"
 trait_caitiff_warrior:0 "劣族战士"
 trait_caitiff_warrior_desc:0 "劣族在这个阴暗的世界里是孤独的，所以他们学会了如何在战斗中保护自己。"
 trait_salubri_healer:0 "萨洛比医者"
 trait_salubri_healer_desc:0 "医者种姓，组成了「普通」血系的大部分，他们的目的是执行治疗和教导浩恩永生。"
 trait_salubri_warrior:0 "萨洛比武者"
 trait_salubri_warrior_desc:0 "武者种姓，由萨麦尔于巴力之战中建立。武者是流浪者，总是寻找着摧毁无论在何处滋生的邪恶。每位武者种姓的成员都会在引导仪式后获得一个天使名。"
 trait_salubri_watcher:0 "萨洛比观者"
 trait_salubri_watcher_desc:0 "观者种姓，由扫罗于东方之旅中建立。学者和盗贼，观者担当着其他萨洛比的保护者，保护他们不受那些否认他们存在和获得救赎的权利的人的伤害。"
 trait_teachings:0 "钱德拉布特拉的教导"
 trait_teachings_desc:0 "钱德拉布特拉为每位雷伏诺提供了模范，做一个好将军比做一个好战士更有用"