l_simp_chinese:
 trait_vampire:0 "吸血鬼"
 trait_vampire_desc:0 "该角色是不死族的一员。"
 trait_diablerist:0 "啖魂者"
 trait_diablerist_desc:0 "该角色是一位啖魂者，曾经吸食了其他吸血鬼的心血，吞噬其灵魂。"
 trait_infernalist:0 "唤魔者"
 trait_infernalist_desc:0 "该角色为了探研地狱而与恶魔力量契约。"
 trait_ghoul:0 "血仆"
 trait_ghoul_desc:0 "一位吸取了吸血鬼之血的凡人，又称食尸鬼。"
 trait_mortal:0 "凡人"
 trait_mortal_desc:0 "一只普通的人类。可悲的短命种……"
 trait_werewolf:0 "狼人"
 trait_mage:0 "法师"
 trait_mage_desc:0 "觉醒了化身的人类，这允许他们使用真正的魔法并扭曲现实定律。"
 trait_wight:0 "尸妖"
 trait_wight_desc:0 "一位尸妖是一位失去了所有人性的吸血鬼。他们已经面目全非，彻底与心兽融为一体。一位堕落成尸妖的角色无法被挽回和被玩家扮演。"
 trait_assamite:0 "哈基姆之嗣"
 trait_assamite_desc:0 "他们盘踞在中东的隐蔽堡垒之中，一直以来都被西方的血族认为是危险的刺客和啖魂者团体。"
 trait_assamite_laibon:0 "桑戈"
 trait_assamite_laibon_desc:0 "莱本的传承之一。作为约鲁巴风暴之神桑戈的崇拜者，桑戈也许是莱本最文明的遗产，仅次于大贵族古鲁希。"
 trait_baali:0 "巴力"
 trait_baali_desc:0 "一支与恶魔崇拜相关的吸血鬼血系。"
 trait_brujah:0 "布鲁赫"
 trait_brujah_desc:0 "发怒迅速并总是充满激情，他们重新获得了崇高哲学家和活动家氏族的地位。"
 trait_brujah_laibon:0 "欧瑟博"
 trait_brujah_laibon_desc:0 "莱本的传承之一。莱本的战士，欧瑟博他们的名字来源于西部阿善堤著名的豹的传说。"
 trait_brujah_ashirra:0 "巴耶特·穆萨克斯"
 trait_brujah_ashirra_desc:0 "伊斯兰信仰的布鲁赫氏族也称巴耶特·穆萨克斯，其中很多是迦太基血族。特别是在北非，年轻一代宣布吉哈德圣战，希望惩罚破坏了大实验的罗马血族。"
 trait_cacophony:0 "嘈杂之女"
 trait_cacophony_desc:0 "目前，嘈杂之女主要由女性组成（由于在教育一个拥有大多数男性音域的人方面存在相关困难），她们练习的是魔音术，这一异能允许她们通过唱歌来激发奇怪的效果。她们是最优秀的不死族合唱家，而举办她们的聚会是值得尊崇的。"
 trait_caitiff:0 "劣族"
 trait_caitiff_desc:0 "也称无氏族者，是那些不归于任何氏族的该隐之子。"
 trait_cappadocian:0 "卡帕多西亚"
 trait_cappadocian_desc:0 "离群索居的学者们痴迷于死亡和灵魂的奥秘。"
 trait_cappadocian_laibon:0 "姆拉·瓦图"
 trait_cappadocian_laibon_desc:0 "也许没有哪一群莱本像姆拉·瓦图一样受到冷落。尽管莱本作为一个整体已经失去了人性，但他们仍然按照许多非洲习俗的要求，对死者保持着健全的尊重。然而，姆拉·瓦图并不满足于仅仅与死去的祖先交流；他们试图在身体和灵魂上控制他们。"
 trait_cappadocian_ashirra:0 "卡比拉特·马特"
 trait_cappadocian_ashirra_desc:0 "卡帕多西亚氏族的伊斯兰分支在中东被称为卡比拉特·马特，是这些土地上最博学的血族之一。卡比拉特·马特在研究死者时必须小心谨慎，因为伊斯兰教高度重视死者；亵渎尸体可能会引起凡人和阿什拉派或有组织的伊斯兰血族的注意。"
 trait_gangrel:0 "冈格罗"
 trait_gangrel_desc:0 "野蛮人。原始，顽强，兽性。"
 trait_gangrel_laibon:0 "阿库南斯"
 trait_gangrel_laibon_desc:0 "莱本的传承之一。它们的名字和性质来自许多非洲民间传说中的「智慧蜘蛛」神话。他们以渊博的知识、睿智的决策和非政治性质而闻名。"
 trait_gangrel_ashirra:0 "瓦希恩"
 trait_gangrel_ashirra_desc:0 "虽然阿什拉派称所有的冈格罗氏族为「瓦希恩」，但在这两个部分之间存在着一条独特的界线，类似于城市和乡村冈格罗之间的划分，尽管关系更加敌对。"
 trait_gargoyle:0 "石像鬼"
 trait_gargoyle_desc:0 "那些似乎是会动的石雕的吸血鬼。"
 trait_giovanni:0 "乔凡尼"
 trait_giovanni_desc:0 "随着他的先祖升入鲜血，奥古斯都·乔瓦尼立即开始初拥出自己的家庭。在这样做的过程中，乔凡尼在卡帕多西亚氏族中变成了介于一支血系和密教之间的东西。作为[necromancy|E]的专家，乔凡尼与母族保持着轻微的分离。"
 trait_harbingersofskulls:0 "骸骨预告者"
 trait_harbingersofskulls_desc:0 "一支吸血鬼血系，面色苍白。此外，预告者们的皮肤收缩，使这些该隐之子显得骨瘦如柴，瘦骨嶙峋的四肢和脸都冻成了不朽的死亡微笑。"
 trait_kiasyd:0 "起亚赛德"
 trait_kiasyd_desc:0 "一支有着妖精血的吸血鬼血系遗传，遗传自勒森魃氏族的斯特拉斯堡的马可纽斯。"
 trait_lasombra:0 "勒森魃"
 trait_lasombra_desc:0 "勒森魃氏族是社会达尔文主义者，掠食者，优雅而无人性。"
 trait_lasombra_laibon:0 "锡·敦杜"
 trait_lasombra_laibon_desc:0 "他们的名字来源于巴伐利语中「影子」的意思，锡·敦杜最初来自刚果，直到一个错误的仪式迫使他们离开了他们的家园。他们现在居住在非洲东部的马赛族人中间。"
 trait_lasombra_ashirra:0 "卡比拉特·卡哈耶"
 trait_lasombra_ashirra_desc:0 "这支阿拉伯的勒森魃在伊斯兰世界的对应状况的血族中很有名，因为他们是屈指可数的基督徒占多数的氏族。伊斯兰教在族中只占有几个位置，尤其是伊比利亚，在族内造成了严重的裂痕。"
 trait_maeghar:0 "马伊格哈尔"
 trait_maeghar_desc:0 "诞生于当某该隐之子试图施加他的诅咒至某妖精血统生命时发生一系列孤立的意外。所有的马伊格哈尔都有一些身体特征表明他们的妖精本性，从细微的（雪白的皮肤和乌黑的头发）到显著的（六只手臂）。"
 trait_malkavian:0 "末卡维"
 trait_malkavian_desc:0 "被疯狂所诅咒的血族氏族。"
 trait_malkavian_ashirra:0 "巴耶特·马吉努"
 trait_malkavian_ashirra_desc:0 "阿什拉派末卡维族，巴耶特·马吉努，比西方的同族更受尊敬。许多人被当作顾问，保镖，甚至伊斯兰先知。"
 trait_nosferatu:0 "诺斯费拉图"
 trait_nosferatu_desc:0 "鬼怪们。隐秘，强壮，可怕。"
 trait_nosferatu_ashirra:0 "巴耶特·穆塔沙尔"
 trait_nosferatu_ashirra_desc:0 "在伊斯兰教成为主导力量后，阿什拉派的诺斯费拉图经历了某种分裂。巴耶特·穆塔沙尔是那些拒绝皈依伊斯兰教或放弃他们古老的作为猎人和恶巫的身份的诺斯费拉图。"
 trait_nosferatu_laibon:0 "古鲁希"
 trait_nosferatu_laibon_desc:0 "古鲁希相信自己是非洲的主人，是非洲土地和人民的合法统治者。"
 trait_oldclantzimisce:0 "旧棘秘魑"
 trait_oldclantzimisce_desc:0 "没有加入魔宴的棘秘魑氏族的成员。"
 trait_ravnos:0 "雷伏诺"
 trait_ravnos_desc:0 "雷伏诺以四处流浪和叫卖而闻名，他们是江湖骗子，乐得行骗行窃。"
 trait_ravnos_ashirra:0 "巴耶特·穆吉里姆"
 trait_ravnos_ashirra_desc:0 "巴耶特·穆吉里姆是阿拉伯语中的欺诈之氏族（穆吉里姆字面意思是罪犯）。他们在伊斯兰世界不受欢迎，因为他们的恶习导致他们与阿什拉派发生了许多不友好的对抗。"
 trait_ravnos_laibon:0 "斤养异"
 trait_ravnos_laibon_desc:0 "莱本的传承之一。斤养异的名字来源于卢甘达语中「鸟」的意思，反映了他们不断旅行的癖好，甚至超过了求知者阿库南斯。"
 trait_salubri:0 "萨洛比"
 trait_salubri_desc:0 "曾经强大的萨洛比氏族在他们的始祖扫罗被毁灭后几乎没有血系留下。"
 trait_salubri_ashirra:0 "阿明"
 trait_salubri_ashirra_desc:0 "伊斯兰萨洛比，也被称为阿明（意为「有德之人」），他们的运气不比其欧洲萨洛比更差。几个世纪以来，他们从北非到亚洲都一直监视着巴力，通常把自己伪装成其他氏族的成员。"
 trait_salubri_laibon:0 "恩库卢·瞾"
 trait_salubri_laibon_desc:0 "莱本的小支传承。恩库卢·瞾是瞾喇一系的几乎灭绝的后裔，在这支遗留之辈被追杀了几个世纪之后，其数量已经很少了。"
 trait_samedi:0 "萨姆堤"
 trait_samedi_desc:0 "起源于加勒比海，该血系的成员看起来都像僵尸或尸体。萨姆堤的外表看似如在不断腐烂。随着年龄的增长，腐烂的肉块会越来越频繁地从它们的身上脱落，无论它们走到哪里，死亡的气味都粘在它们身上。"
 trait_setite:0 "赛特之子"
 trait_setite_desc:0 "坚信他们的始祖是埃及神赛特的吸血鬼氏族。正统的赛特信仰认为赛特总有一天会回归统治或毁灭世界，虔诚的赛特之子为他的复活做准备。"
 trait_setite_raktasadhus:0 "底提耶"
 trait_setite_raktasadhus_desc:0 "底提耶是一个异教变体，它的始祖从埃及到印度寻找古老的神秘知识，并追杀谣言中逃往喜马拉雅山的奥西里斯的子嗣。"
 trait_setite_naktanchara:0 "那坦查拉"
 trait_setite_naktanchara_desc:0 "自从他们皈依佛教并开始反抗印度血族的种姓制度后，那坦查拉世系的血系就被排斥了。"
 trait_toreador:0 "妥芮朵"
 trait_toreador_desc:0 "吸血鬼氏族，以为最美丽、性感、诱惑、富有情感和魅力的血族而闻名。"
 trait_toreador_ashirra:0 "雷因·芬"
 trait_toreador_ashirra_desc:0 "伊斯兰妥芮朵为雷因·芬，通常被称为抄写吏，因为大多数都喜欢当书法家、作家和建筑师。"
 trait_toreador_laibon:0 "伊斯塔尔里"
 trait_toreador_laibon_desc:0 "莱本氏族的传承之一。伊斯塔尔里声称是巴比伦女神伊斯塔尔的后裔，但目前缺乏类似于古鲁希所有的那种与非洲的个人联系。"
 trait_tremere:0 "睿魔尔"
 trait_tremere_desc:0 "学者之氏族，专注于[bloodsorcery|E]。"
 trait_truebrujah:0 "真布鲁赫"
 trait_truebrujah_desc:0 "布鲁赫氏族的一支血系，声称是该世系始祖的上古耆宿的后裔，而不是他的啖魂者/子嗣。真布鲁赫以其冷静、超然的行为而闻名。"
 trait_tzimisce:0 "棘秘魑"
 trait_tzimisce_desc:0 "封建规矩和残暴的形体塑造的氏族。"
 trait_tzimisce_laibon:0 "纳格罗珀"
 trait_tzimisce_laibon_desc:0 "纳格罗珀的名字来自于「Khoikhoin」，意为「邪恶术士」，他们没有辜负最可怕的莱本的名声。他们允许心兽操控他们，引导他们进入任何你能想象到的堕落放纵，有的只被甚至认为可能在噩梦中出现。"
 trait_ventrue:0 "梵卓"
 trait_ventrue_desc:0 "统治者。高贵的，威严的，贵族气息的。"
 trait_ventrue_ashirra:0 "汉志"
 trait_ventrue_ashirra_desc:0 "汉志是梵卓的一个独特世系。与传统上与罗马人或基督教欧洲人联系在一起的氏族主体不同，汉志血系声称是阿拉伯本土世系的后裔。他们已经皈依了伊斯兰教，并被接纳为阿希什派的一部分，但他们的数量也相对较少。"
 trait_ventrue_raktasadhus:0 "檀那婆"
 trait_ventrue_raktasadhus_desc:0 "檀那婆是梵卓氏族的血系，该氏族以印度次大陆为中心。檀那婆是高贵的圣贤、苦行者和僧侣，是印度种姓制度中最受尊敬的吸血鬼。"
 trait_kueijin:0 "鬼人"
 trait_kueijin_desc:0 "传说鬼人是古代玉皇大帝挑选的「万千仙神」，引导和保护宇宙的万仙的堕落后裔。万仙最初是通过测试技能和勇气来挑选的，并以宇宙的气为食。然而，他们却误入歧途，学会了吸取生命之气，亵渎了这一证道试炼。"
 trait_animalism:0 "兽性术"
 trait_animalism_desc:0 "这一异能让吸血鬼更接近他们兽性的本性。这不仅允许他们与自然生物交流并获得对它们的统治，而且给予他们对心兽本身的影响力。\n\n兽性术在远离人类的部落中尤其普遍，尽管它的许多力量专门针对凡人和该隐之子的心兽。"
 trait_auspex:0 "观占术"
 trait_auspex_desc:0 "一个[GetTrait('vampire').GetName( GetNullCharacter )]的一种超自然[discipline|E]。以一个[game_concept_phlegmatic_lifestyle|E]的[focus|E]为表现。它能增强感知的力量，以[perks|E]为表现。"
 trait_celerity:0 "迅捷术"
 trait_celerity_desc:0 "迅捷术是一种异能使吸血鬼产生超自然的敏捷与反应能力。\n\n对一些该隐之子来说，人类的世界是处于慢动作的。在紧张的时候，会迅捷术的吸血鬼可以以惊人的速度移动，对于任何不懂异能的，无论是凡人还是不朽者，他们的行动都是模糊的。"
 trait_chimerstry:0 "虚幻术"
 trait_chimerstry_desc:0 "虚幻术是雷伏诺的标志性异能，能允许其将幻象施加于现实。幻觉的真实度取决于该隐之子的能力程度。"
 trait_daimoinon:0 "恶魔术"
 trait_daimoinon_desc:0 "恶魔术是一种恶魔的异能，只有巴力和最坏的吸血鬼恶魔才会实行。它的力量来自撒旦本身，通过使用恶魔术，巴力利用地狱的力量和那里的恶魔来挫败和堕落他们的敌人。"
 trait_dementation:0 "疯狂术"
 trait_dementation_desc:0 "疯狂术是一门被熟知为末卡维的特征的异能。\n\n疯狂术吸取吸血鬼自身的疯狂，并用它来获得深刻的洞察力或使他人疯狂。这种力量是末卡维氏族经常被认为既有洞察力又非常危险的主要原因之一。"
 trait_dominate:0 "支配术"
 trait_dominate_desc:0 "支配术是一种以吸血鬼的意志压倒另一个人的思想的异能，迫使受害者按照吸血鬼的命令思考或行动。"
 trait_fortitude:0 "坚韧术"
 trait_fortitude_desc:0 "坚韧术是一种异能，它能给予血族超凡的韧性，甚至能抵挡烈火和阳光。\n\n坚韧术也能防止操纵和控制，比如来自支配术和威仪术异能的。"
 trait_flight:0 "飞行术"
 trait_flight_desc:0 "飞行是一种超自然异能，是石像鬼血系所独有的，它能让这些吸血鬼飞翔。\n\n由于太重而不能用自然方式飞行，石像鬼必须使用这门异能飞行；其他能够飞行的该隐之子「例如，通过变形术变为蝙蝠或雾」不需要它，也无法学习。"
 trait_melpominee:0 "魔音术"
 trait_melpominee_desc:0 "魔音术异能与嘈杂之女同时显现，并与这一血系有着固有的联系。它允许拥有者使用语言和歌曲来产生各种超能力效果。"
 trait_mytherceria:0 "仙灵术"
 trait_mytherceria_desc:0 "仙灵术是一种在妖精血吸血鬼身上显现出来的异能，比如起亚赛德和马伊格哈尔。它赋予吸血鬼神秘的感知，窃取知识的能力，以及其他属于妖精的力量。"
 trait_necromancy:0 "[necromancy|E]"
 trait_necromancy_desc:0 "[necromancy|E]是一种[bloodsorcery|E]，专门针对亡灵世界：死灵和暗影之地。相比于传统[bloodsorcery|E]有不同的风格，也有各种各样的[necromancy|E]实践。它主要由乔凡尼氏族实施。"
 trait_obeah:0 "魂愈术"
 trait_obeah_desc:0 "魂愈术是一种萨洛比氏族独有的异能，也被称为治愈者魂健之道。\n\n魂愈术起源于扫罗在东方之旅中向鬼人学习的龙珠神通。学习魂愈术会导致第三只眼睛在前额中部发育。"
 trait_obfuscate:0 "混淆术"
 trait_obfuscate_desc:0 "混淆术是一种异能，允许吸血鬼隐藏自己，欺骗他人的思想，或使他们忽视使用者不想被看到的东西。\n\n混淆术是上古耆宿身上该隐的诅咒的一部分，将他们从创世中抹去。"
 trait_obtenebration:0 "幽暗术"
 trait_obtenebration_desc:0 "幽暗术据说会进一步诅咒使用它的吸血鬼，因为他将自己从上帝的恩典中进一步移出，并步入黑暗的深渊。因此，动物和人形生物都会忌讳使用者。幽暗术召唤出的超自然的黑暗对凡人、动物，甚至其他不习惯使用它的该隐之子来说都是极其可怕的。"
 trait_potence:0 "蛮力术"
 trait_potence_desc:0 "蛮力术是赋予吸血鬼身体活力和不可思议的力量的异能。具有蛮力术异能的吸血鬼拥有超越凡人界限的身体力量。"
 trait_presence:0 "威仪术"
 trait_presence_desc:0 "威仪术是一种超自然的诱惑和情感操纵的异能，允许血族吸引、拉拢和控制人群。\n\n威仪术软化了上帝对该隐之子的诅咒，使吸血鬼成为众人关注的焦点。要么是迷惑，诱惑，或是恐吓附近的人。"
 trait_protean:0 "变形术"
 trait_protean_desc:0 "变形术是一种让吸血鬼能够变身的技能，从长出野物的爪子到蒸发成一团烟雾。\n\n变形术是上帝对该隐的诅咒的一部分，它剥去了每个吸血鬼必须坚持的人性的外表，显露了他灵魂中的心兽。"
 trait_quietus:0 "寂灭术"
 trait_quietus_desc:0 "寂灭术是阿刹迈的标志性异能，赋予他们对他人血液的影响力。\n\n虽然每个阿刹迈种姓都拥有寂灭术作为一种氏族内的异能，但它主要是以武士种姓手中的刺杀工具而闻名，而较低等级的能力主要是为了达到这个目的。"
 trait_serpentis:0 "古蛇术"
 trait_serpentis_desc:0 "古蛇术是赛特信徒氏族的标志。它主要提供变形能力，虽然它也包含腐化和其他与蛇相关的特征。\n\n蛇对这个氏族有着近乎宗教意义的意义，尽管血族的科学家推测这与变形术的变化能力有关。"
 trait_spiritus:0 "精魂术"
 trait_spiritus_desc:0 "精魂术是恶灵血系中一门独特的异能，允许他们与兽形精魂互动。在最基本的层面上，它允许吸血鬼与精魂交谈并召唤精魂，但在更高的能力等级中，它可以从精魂中引导力量来增强恶灵。"
 trait_temporis:0 "时光术"
 trait_temporis_desc:0 "时光术是真布鲁赫所独有的一种异能。据推测，时光术是对迅捷术的一种改进，它赋予了该隐之子操纵时间流动本身的能力。"
 trait_thinbloodalchemy:0 "淡血种炼金术"
 trait_thinbloodalchemy_desc:0 "这是淡血种独有的异能，它允许他们模仿纯血吸血鬼的异能。\n\n淡血种炼金术是一个两个步骤的实践：使用适当的配方蒸馏血液混合物，然后通过喝掉所谓的混合饮品来激活，并引导其力量。"
 trait_valeren:0 "魂健术"
 trait_valeren_desc:0 "魂健术是萨洛比的神秘异能。其最基本的是，魂健术提供了对疼痛的控制和增强的军事能力，似乎允许战士们利用天堂的力量来征服他们的敌人。"
 trait_vicissitude:0 "变幻术"
 trait_vicissitude_desc:0 "变幻术是该隐之子最可怕的能力之一，它是棘秘魑的标志性能力，在其氏族之外几乎不为人所知。有经验的制作者可以用它雕刻一个目标的血肉和骨头，使他们成为一个异形美的生物或扭曲他们成为一个畸形的怪物。"
 trait_visceratika:0 "石变术"
 trait_visceratika_desc:0 "石变术异能是石像鬼血系独有的，是他们对石头、土壤和由其制造的东西的自然亲和力的延伸。\n\n石变术的特色是变形能力，类似变形术的那些，但是更强调防御。"
 trait_bloodsorcery:0 "[bloodsorcery|E]"
 trait_bloodsorcery_desc:0 "[bloodsorcery|E]指的是由吸血鬼使用的魔法，由宗教或超自然现象和该隐之子精血的力量推动。\n\n通过对[bloodsorcery|E]的应用，该隐之子可以召唤火焰，控制天气，以及做许多其他即使以吸血鬼的标准来看也是不自然的事情。"
 trait_animalismadvanced:0 "高阶兽性术"
 trait_animalismadvanced_desc:0 "这一异能让吸血鬼更接近他们兽性的本性。这不仅允许他们与自然生物交流并获得对它们的统治，而且给予他们对心兽本身的影响力。\n\n兽性术在远离人类的部落中尤其普遍，尽管它的许多力量专门针对凡人和该隐之子的心兽。"
 trait_auspexadvanced:0 "高阶观占术"
 trait_auspexadvanced_desc:0 "一个[GetTrait('vampire').GetName( GetNullCharacter )]的一种超自然[discipline|E]。以一个[game_concept_phlegmatic_lifestyle|E]的[focus|E]为表现。它能增强感知的力量，以[perks|E]为表现。"
 trait_celerityadvanced:0 "高阶迅捷术"
 trait_celerityadvanced_desc:0 "迅捷术是一种异能使吸血鬼产生超自然的敏捷与反应能力。\n\n对一些该隐之子来说，人类的世界是处于慢动作的。在紧张的时候，会迅捷术的吸血鬼可以以惊人的速度移动，对于任何不懂异能的，无论是凡人还是不朽者，他们的行动都是模糊的。"
 trait_chimerstryadvanced:0 "高阶虚幻术"
 trait_chimerstryadvanced_desc:0 "虚幻术是雷伏诺的标志性异能，能允许其将幻象施加于现实。幻觉的真实度取决于该隐之子的能力程度。"
 trait_dementationadvanced:0 "高阶疯狂术"
 trait_dementationadvanced_desc:0 "疯狂术是一门被熟知为末卡维的特征的异能。\n\n疯狂术吸取吸血鬼自身的疯狂，并用它来获得深刻的洞察力或使他人疯狂。这种力量是末卡维氏族经常被认为既有洞察力又非常危险的主要原因之一。"
 trait_dominateadvanced:0 "高阶支配术"
 trait_dominateadvanced_desc:0 "支配术是一种以吸血鬼的意志压倒另一个人的思想的异能，迫使受害者按照吸血鬼的命令思考或行动。\n\n支配术的吸血鬼诅咒的一面是它贬低了真正友谊或亲密关系的基本要素。支配术也会削弱使用者的同理心，你必须注意不要习惯于总是被谄媚者包围。"
 trait_flightadvanced:0 "高阶飞行术"
 trait_flightadvanced_desc:0 "飞行是一种超自然异能，是石像鬼血系所独有的，它能让这些吸血鬼飞翔。\n\n由于太重而不能用自然方式飞行，石像鬼必须使用这门异能飞行；其他能够飞行的该隐之子「例如，通过变形术变为蝙蝠或雾」不需要它，也无法学习。"
 trait_melpomineeadvanced:0 "高阶魔音术"
 trait_melpomineeadvanced_desc:0 "魔音术异能与嘈杂之女同时显现，并与这一血系有着固有的联系。它允许拥有者使用语言和歌曲来产生各种超能力效果。\n\n也以希腊悲剧缪斯女神「墨尔波墨涅」为名，魔音术是一个嘈杂侄女独有的异能。它探索了声音的力量，震撼着周围人的灵魂，让吸血鬼表演其他不可能的音效。"
 trait_mytherceriaadvanced:0 "高阶仙灵术"
 trait_mytherceriaadvanced_desc:0 "仙灵术是一种在妖精血吸血鬼身上显现出来的异能，比如起亚赛德和马伊格哈尔。它赋予吸血鬼神秘的感知，窃取知识的能力，以及其他属于妖精的力量。\n\n作为一个由妖精拥有的力量的集合，并且倾向于揭露新的认知，仙灵术已经把它的许多受害者逼到胡言乱语的疯狂，或者至少是沮丧。"
 trait_necromancyadvanced:0 "高阶亡灵术"
 trait_necromancyadvanced_desc:0 "[necromancy|E]是一种[bloodsorcery|E]，专门针对亡灵世界：死灵和暗影之地。相比于传统[bloodsorcery|E]有不同的风格，也有各种各样的[necromancy|E]实践。它主要由乔凡尼氏族实施。"
 trait_obeahadvanced:0 "高阶魂愈术"
 trait_obeahadvanced_desc:0 "魂愈术是一种萨洛比氏族独有的异能，也被称为治愈者魂健之道。\n\n魂愈术起源于扫罗在东方之旅中向鬼人学习的龙珠神通。学习魂愈术会导致第三只眼睛在前额中部发育。"
 trait_obfuscateadvanced:0 "高阶混淆术"
 trait_obfuscateadvanced_desc:0 "混淆术是一种异能，允许吸血鬼隐藏自己，欺骗他人的思想，或使他们忽视使用者不想被看到的东西。\n\n混淆术是上古耆宿身上该隐的诅咒的一部分，将他们从创世中抹去。经常使用这个异能的人发现自己脱离了社会，从不参与社会交往，只是观察。"
 trait_obtenebrationadvanced:0 "高阶幽暗术"
 trait_obtenebrationadvanced_desc:0 "幽暗术据说会进一步诅咒使用它的吸血鬼，因为他将自己从上帝的恩典中进一步移出，并步入黑暗的深渊。因此，动物和人形生物都会忌讳使用者。幽暗术召唤出的超自然的黑暗对凡人、动物，甚至其他不习惯使用它的该隐之子来说都是极其可怕的。"
 trait_potenceadvanced:0 "高阶蛮力术"
 trait_potenceadvanced_desc:0 "蛮力术是赋予吸血鬼身体活力和不可思议的力量的异能。具有蛮力术异能的吸血鬼拥有超越凡人界限的身体力量。"
 trait_presenceadvanced:0 "高阶威仪术"
 trait_presenceadvanced_desc:0 "威仪术是一种超自然的诱惑和情感操纵的异能，允许血族吸引、拉拢和控制人群。\n\n威仪术软化了上帝对该隐之子的诅咒，使吸血鬼成为众人关注的焦点。要么是迷惑，诱惑，或是恐吓附近的人。"
 trait_proteanadvanced:0 "高阶变形术"
 trait_proteanadvanced_desc:0 "变形术是一种让吸血鬼能够变身的技能，从长出野物的爪子到蒸发成一团烟雾。\n\n变形术是上帝对该隐的诅咒的一部分，它剥去了每个吸血鬼必须坚持的人性的外表，显露了他灵魂中的心兽。高阶使用者有时会发现自己的身体在未经自己同意的情况下移动，直接对自己的情绪做出反应，把自己带入尴尬的境地。"
 trait_quietusadvanced:0 "高阶寂灭术"
 trait_quietusadvanced_desc:0 "寂灭术是阿刹迈的标志性异能，赋予他们对他人血液的影响力。\n\n虽然每个阿刹迈种姓都拥有寂灭术作为一种氏族内的异能，但它主要是以武士种姓手中的刺杀工具而闻名，而较低等级的能力主要是为了达到这个目的。"
 trait_serpentisadvanced:0 "高阶古蛇术"
 trait_serpentisadvanced_desc:0 "古蛇术是赛特信徒氏族的标志。它主要提供变形能力，虽然它也包含腐化和其他与蛇相关的特征。\n\n蛇对这个氏族有着近乎宗教意义的意义，尽管血族的科学家推测这与变形术的变化能力有关。"
 trait_spiritusadvanced:0 "高阶精魂术"
 trait_spiritusadvanced_desc:0 "精魂术是恶灵血系中一门独特的异能，允许他们与兽形精魂互动。在最基本的层面上，它允许吸血鬼与精魂交谈并召唤精魂，但在更高的能力等级中，它可以从精魂中引导力量来增强恶灵。"
 trait_temporisadvanced:0 "高阶时光术"
 trait_temporisadvanced_desc:0 "时光术是真布鲁赫所独有的一种异能。据推测，时光术是对迅捷术的一种改进，它赋予了该隐之子操纵时间流动本身的能力。\n\n虽然这个异能很强大，但使用起来也会很吃力。"
 trait_thinbloodalchemyadvanced:0 "高阶淡血种炼金术"
 trait_thinbloodalchemyadvanced_desc:0 "这是淡血种独有的异能，它允许他们模仿纯血吸血鬼的异能。\n\n淡血种炼金术是一个两个步骤的实践：使用适当的配方蒸馏血液混合物，然后通过喝掉所谓的混合饮品来激活，并引导其力量。"
 trait_valerenadvanced:0 "高阶魂健术"
 trait_valerenadvanced_desc:0 "魂健术是萨洛比的神秘异能。其最基本的是，魂健术提供了对疼痛的控制和增强的军事能力，似乎允许战士们利用天堂的力量来征服他们的敌人。"
 trait_vicissitudeadvanced:0 "高阶变幻术"
 trait_vicissitudeadvanced_desc:0 "变幻术是该隐之子最可怕的能力之一，它是棘秘魑的标志性能力，在其氏族之外几乎不为人所知。有经验的制作者可以用它雕刻一个目标的血肉和骨头，使他们成为一个异形美的生物或扭曲他们成为一个畸形的怪物。"
 trait_visceratikaadvanced:0 "高阶石变术"
 trait_visceratikaadvanced_desc:0 "石变术异能是石像鬼血系独有的，是他们对石头、土壤和由其制造的东西的自然亲和力的延伸。\n\n石变术的特色是变形能力，类似变形术的那些，但是更强调防御。"
 trait_bloodsorceryadvanced:0 "高阶血魔术"
 trait_bloodsorceryadvanced_desc:0 "[bloodsorcery|E]指的是由吸血鬼使用的魔法，由宗教或超自然现象和该隐之子精血的力量推动。\n\n通过对[bloodsorcery|E]的应用，该隐之子可以召唤火焰，控制天气，以及做许多其他即使以吸血鬼的标准来看也是不自然的事情。"
 trait_fortitudeadvanced:0 "高阶坚韧术"
 trait_fortitudeadvanced_desc:0 "坚韧术是一种异能，它能给予血族超凡的韧性，甚至能抵挡烈火和阳光。\n\n坚韧术赋予了该隐之子抵抗各种伤害的能力，然而它却在滋生的傲慢和过度自信中完成了神的诅咒的一部分。"
 trait_oblivion:0 "湮灭术"
 trait_oblivion_desc:0 "湮灭术是一种异能，它允许使用者利用完全超自然的东西；通过湮灭术可以从深渊召唤超自然的黑暗和奴役幽灵，类似于[necromancy|E]。"
 trait_oblivionadvanced:0 "高阶湮灭术"
 trait_oblivionadvanced_desc:0 "湮灭术是一种异能，它允许使用者利用完全超自然的东西；通过湮灭术可以从深渊召唤超自然的黑暗和奴役幽灵，类似于[necromancy|E]。"
 trait_mortis:0 "死灵术"
 trait_mortis_desc:0 "死灵术异能基于对死亡的控制和操纵。更具体地说，死灵术是[bloodsorcery|E]的一种，专门针对尸体及其死后的状态。卡帕多西亚氏族是唯一对这一异能的有着自然亲和力的血族。"
 trait_mortisadvanced:0 "高阶死灵术"
 trait_mortisadvanced_desc:0 "死灵术异能基于对死亡的控制和操纵。更具体地说，死灵术是[bloodsorcery|E]的一种，专门针对尸体及其死后的状态。卡帕多西亚氏族是唯一对这一异能的有着自然亲和力的血族。"
 trait_nihilistics:0 "虚无术"
 trait_nihilistics_desc:0 "虚无术是那伽罗阇独会的一门异能，它允许他们穿透亡者障壁并与湮灭相连。除了一些冥界居民有关的应用之外，它的力量还允许吸血鬼将湮灭引入物质位面。"
 trait_nihilisticsadvanced:0 "高阶虚无术"
 trait_nihilisticsadvanced_desc:0 "虚无术是那伽罗阇独会的一门异能，它允许他们穿透亡者障壁并与湮灭相连。除了一些冥界居民有关的应用之外，它的力量还允许吸血鬼将湮灭引入物质位面。"
 trait_thanatosis:0 "坏死术"
 trait_thanatosis_desc:0 "坏死术是是萨姆堤血系独占的一种异能，涉及控制死亡和腐烂造成的后果。在某些方面，它类似于[necromancy|E]。这门异能研究各种形式的死亡。其使用者痴迷于死亡的表现，使除了最扭曲的血族外，其他血族都避着他们走。"
 trait_thanatosisadvanced:0 "坏死术"
 trait_thanatosisadvanced_desc:0 "坏死术是是萨姆堤血系独占的一种异能，涉及控制死亡和腐烂造成的后果。在某些方面，它类似于[necromancy|E]。这门异能研究各种形式的死亡。其使用者痴迷于死亡的表现，使除了最扭曲的血族外，其他血族都避着他们走。"
 trait_deimos:0 "恐怖术"
 trait_deimos_desc:0 "恐怖术是拉米亚在研究死者和莉莉丝的过程中创造的一门异能。它为吸血鬼提供了一些对他们掌握的无生命形态，例如黑暗精魂，的控制以及源自黑暗之母的庇护。它也被称为四体液之道。"
 trait_deimosadvanced:0 "高阶恐怖术"
 trait_deimosadvanced_desc:0 "恐怖术是拉米亚在研究死者和莉莉丝的过程中创造的一门异能。它为吸血鬼提供了一些对他们掌握的无生命形态，例如黑暗精魂，的控制以及源自黑暗之母的庇护。它也被称为四体液之道。"
 trait_abombo:0 "阿本博"
 trait_abombo_desc:0 "非洲的莱本所遵随的心路，专注于亡者与生者之间的联系；与[necromancy|E]的衣冠冢心路相似但又不同。它允许亡灵术师控制甚至重新分配幽灵的限缚。"
 trait_abomboadvanced:0 "高阶阿本博"
 trait_abomboadvanced_desc:0 "非洲的莱本所遵随的心路，专注于亡者与生者之间的联系；与[necromancy|E]的衣冠冢心路相似但又不同。它允许亡灵术师控制甚至重新分配幽灵的限缚。"
 trait_abombwe:0 "阿本威"
 trait_abombwe_desc:0 "阿本威是种由莱邦的阿库南斯传承和黑暗时代神秘的邦萨姆血系掌握的异能。"
 trait_abombweadvanced:0 "高阶阿本威"
 trait_abombweadvanced_desc:0 "阿本威是种由莱邦的阿库南斯传承和黑暗时代神秘的邦萨姆血系掌握的异能。阿本威利用吸血鬼与自己的（以及其他人的）心兽的紧密联系并加以控制，将心兽的力量用于各种目的。"
 trait_daimoinonadvanced:0 "高阶恶魔术"
 trait_daimoinonadvanced_desc:0 "恶魔术是一种恶魔的异能，只有巴力和最坏的吸血鬼恶魔才会实行。它的力量来自撒旦本身，通过使用恶魔术，巴力利用地狱的力量和那里的恶魔来挫败和堕落他们的敌人。"
 trait_sielanicthaumaturgy:0 "塞拉奇术"
 trait_sielanicthaumaturgy_desc:0 "塞拉奇术是受异教神特尔沃的启发，由特尔沃睿魔尔掌握，一条原居立陶宛的睿魔尔血系。\n\n特尔沃人学会了利用塞拉的力量，塞拉是潜伏在他们所居住的土地、石头、植物和动物中的万物之灵。"
 trait_sielanicthaumaturgyadvanced:0 "高阶塞拉奇术"
 trait_sielanicthaumaturgyadvanced_desc:0 "塞拉奇术是受异教神特尔沃的启发，由特尔沃睿魔尔掌握，一条原居立陶宛的睿魔尔血系。\n\n特尔沃人学会了利用塞拉的力量，塞拉是潜伏在他们所居住的土地、石头、植物和动物中的万物之灵。"
 trait_duranki:0 "杜-安-奇"
 trait_duranki_desc:0 "[durnaki|E]（天地之主）是一种[bloodsorcery|E]，由中东和非洲的血族掌握。这是一种非常古老的魔法，来自于各种各样的凡人宗教传统，存在于奇术之前，却于其在很多方面都很相似。"
 trait_durankiadvanced:0 "高阶杜-安-奇"
 trait_durankiadvanced_desc:0 "[durnaki|E]（天地之主）是一种[bloodsorcery|E]，由中东和非洲的血族掌握。这是一种非常古老的魔法，来自于各种各样的凡人宗教传统，存在于奇术之前，却于其在很多方面都很相似。"
 trait_ogham:0 "欧甘符文"
 trait_ogham_desc:0 "欧甘符文是一种基于凯尔特符文的非常受限的[bloodsorcery|E]，由菈亚南掌握，其借用血系中的精魂碎片，并集中力量于领域之中。"
 trait_oghamadvanced:0 "高阶欧甘符文"
 trait_oghamadvanced_desc:0 "欧甘符文是一种基于凯尔特符文的非常受限的[bloodsorcery|E]，由菈亚南掌握，其借用血系中的精魂碎片，并集中力量于领域之中。"
 trait_abyssmysticism:0 "深渊秘术"
 trait_abyssmysticism_desc:0 "深渊秘术是[bloodsorcery|E]的一种，源于幽暗术异能。显然，这种奥秘之术几乎完全由勒森魃氏族的成员掌握着。那些通晓着这些神秘之术的家伙被称为暗影者。"
 trait_abyssmysticismadvanced:0 "高阶深渊秘术"
 trait_abyssmysticismadvanced_desc:0 "深渊秘术是[bloodsorcery|E]的一种，源于幽暗术异能。显然，这种奥秘之术几乎完全由勒森魃氏族的成员掌握着。那些通晓着这些神秘之术的家伙被称为暗影者。"
 trait_sadhana:0 "修行"
 trait_sadhana_desc:0 "修行是印度[bloodsorcery|E]的一种形式，早于睿魔尔氏族著名的赫耳墨斯奇术几千年。它由印度的印度教婆罗门该隐之子掌握，他们被称为苦行血僧或甚至血婆罗门。"
 trait_sadhanaadvanced:0 "高阶修行"
 trait_sadhanaadvanced_desc:0 "修行是印度[bloodsorcery|E]的一种形式，早于睿魔尔氏族著名的赫耳墨斯奇术几千年。它由印度的印度教婆罗门该隐之子掌握，他们被称为苦行血僧或甚至血婆罗门。"
 trait_sihr:0 "西尔"
 trait_sihr_desc:0 "西尔（源自阿拉伯语「法术」）是伊斯兰世界广泛使用的一种[bloodsorcery|E]异能。在黑暗时代，它与其他形式的[bloodsorcery|E]的不同之处在于它的使用者需要在社群之道或天国之路有很高的心路等级才能使用该魔法。"
 trait_sihradvanced:0 "高阶西尔"
 trait_sihradvanced_desc:0 "西尔（源自阿拉伯语「法术」）是伊斯兰世界广泛使用的一种[bloodsorcery|E]异能。在黑暗时代，它与其他形式的[bloodsorcery|E]的不同之处在于它的使用者需要在社群之道或天国之路有很高的心路等级才能使用该魔法。"
 trait_akhu:0 "咒术"
 trait_akhu_desc:0 "咒术，通常被外乡人称为赛特魔术，是赛特信徒追遵的古老[bloodsorcery|E]学派。\n\n在埃及的全盛时期，也就是在因罗马帝国的统治而皈依基督教之前，魔法是很常见的，无论是对凡人还是吸血鬼都一样。"
 trait_akhuadvanced:0 "高阶咒术"
 trait_akhuadvanced_desc:0 "咒术，通常被外乡人称为赛特魔术，是赛特信徒追遵的古老[bloodsorcery|E]学派。\n\n在埃及的全盛时期，也就是在因罗马帝国的统治而皈依基督教之前，魔法是很常见的，无论是对凡人还是吸血鬼都一样。"
 trait_darkthaumaturgy:0 "暗黑奇术"
 trait_darkthaumaturgy_desc:0 "暗黑奇术是指从恶魔那里学来的奇术。\n\n吸血鬼可能会与恶魔达成契约以得知[bloodsorcery|E]的秘密，就像凡人法师学习其他地狱魔法一样；他们达成这项交易的代价为牺牲自己残余的灵魂，一种获取魔法力量的捷径。"
 trait_darkthaumaturgyadvanced:0 "高阶暗黑奇术"
 trait_darkthaumaturgyadvanced_desc:0 "暗黑奇术是指从恶魔那里学来的奇术。\n\n吸血鬼可能会与恶魔达成契约以得知[bloodsorcery|E]的秘密，就像凡人法师学习其他地狱魔法一样；他们达成这项交易的代价为牺牲自己残余的灵魂，一种获取魔法力量的捷径。"
 trait_thaumaturgy:0 "奇术"
 trait_thaumaturgy_desc:0 "奇术是吸血鬼氏族睿魔尔所使的一种被严控的[bloodsorcery|E]形式。\n\n通过详尽的研究和广泛的实验，奇术利用了睿魔尔还是一个法师集团时所使用的赫耳墨斯魔法异能，适应了由精血而不是精粹的内在魔力来推动。"
 trait_thaumaturgyadvanced:0 "高阶奇术"
 trait_thaumaturgyadvanced_desc:0 "奇术是吸血鬼氏族睿魔尔所使的一种被严控的[bloodsorcery|E]形式。\n\n通过详尽的研究和广泛的实验，奇术利用了睿魔尔还是一个法师集团时所使用的赫耳墨斯魔法异能，适应了由精血而不是精粹的内在魔力来推动。"
 trait_fae:0 "妖精"
 trait_fae_desc:0 ""
 trait_supehunter:0 "猎人"
 trait_supehunter_desc:0 "怪物猎人。"
 trait_torpor:0 "蛰眠"
 trait_torpor_desc:0 "与吸血鬼通常在白天进行的睡眠相比，蛰眠只是一种更深层次的停滞状态。蛰眠的时间长短取决于吸血鬼的人性或心路的评定，可以持续一天到一千年以上。据说，古代吸血鬼经常感到需要自愿的进入蛰眠状态，也被称为沉眠期。"
 trait_canon:0 "原作角色"
 trait_canon_desc:0 ""
 trait_demon:0 "恶魔"
 trait_demon_desc:0 "恶魔是堕落的天使，他们在创世的第一天选择与路西法和人类站在一起，而不是与上帝站在一起。为了惩罚他们的叛逆和不忠，天使长米迦勒把这些天使从天堂扔到深渊。"
 trait_vampgeneration1:0 "初代血族"
 trait_vampgeneration1_desc:0 "该隐，第一位吸血鬼。"
 trait_vampgeneration2:0 "次代血族"
 trait_vampgeneration2_desc:0 "该隐三子。被三代血族所谋杀。"
 trait_vampgeneration3:0 "三代血族"
 trait_vampgeneration3_desc:0 "此世代建立了血族的氏族"
 trait_vampgeneration4:0 "第四代血族"
 trait_vampgeneration4_desc:0 "此世代建立了大多数血系，不死族的宗族的家族。"
 trait_vampgeneration5:0 "第五代血族"
 trait_vampgeneration5_desc:0 "第五代吸血鬼。"
 trait_vampgeneration6:0 "第六代血族"
 trait_vampgeneration6_desc:0 "第六代吸血鬼。"
