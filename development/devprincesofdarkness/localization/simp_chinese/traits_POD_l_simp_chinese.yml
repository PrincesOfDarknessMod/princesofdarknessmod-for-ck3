 trait_vampgeneration12_desc:0 "第十二代吸血鬼。"
 trait_vampgeneration13:0 "第十三代血族"
 trait_vampgeneration13_desc:0 "接近淡血。"
 trait_vampgeneration14:0 "第十四代血族"
 trait_vampgeneration14_desc:0 "淡血种"
 trait_vampgeneration15:0 "第十五代血族"
 trait_vampgeneration15_desc:0 "淡血种"
