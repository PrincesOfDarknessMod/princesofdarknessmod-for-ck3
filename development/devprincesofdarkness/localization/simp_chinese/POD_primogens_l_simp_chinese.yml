 brujah_primogen_court_position:0 "布鲁赫首长"
 brujah_primogen_court_position_desc:1 "按照传统，$brujah_primogen_court_position$负责一个地区的战略战争，尽管他们有时也会涉足学术研究，忠实于他们战士学者的称号。"
 cappadocian_primogen_court_position:0 "卡帕多西亚首长"
 cappadocian_primogen_court_position_desc:1 "很少有人像卡帕多西亚那样对不死族的状况了解得这么多。如果他们愿意谈的话，可以从他们那里学到很多东西。"
 lasombra_primogen_court_position:0 "勒森魃首长"
 lasombra_primogen_court_position_desc:1 "暗影主宰是你身边的有用的盟友，但如果与之交恶，则是更致命的敌人。"
 toreador_primogen_court_position:0 "妥芮朵首长"
 toreador_primogen_court_position_desc:1 "每个有自尊的宫廷都有一个有才华的妥芮朵来处理其聚会。不过，“才华”的定义有时可能会引起争议。"
 tzimisce_primogen_court_position:0 "棘秘魑首长"
 tzimisce_primogen_court_position_desc:1 "当一名客人不再受欢迎，但你仍然需要他们回答几个问题时……你知道该找谁。"
 ventrue_primogen_court_position:0 "梵卓首长"
 ventrue_primogen_court_position_desc:1 "所谓的黑夜统治者期望有大量的权力和责任赋予他们，即使他们并不配拥有这些权力。"
 assamite_primogen_court_position:0 "哈基姆圣裔首长"
 assamite_primogen_court_position_desc:1 "哈基姆的子嗣们很尽责，是为了共同事业而遵守纪律的典范。大部分时间如此。"
 gangrel_primogen_court_position:0 "冈格罗首长"
 gangrel_primogen_court_position_desc:1 "冈格罗从不远离他们的族群，随时准备为他们提供帮助或阻挠。"
 malkavian_primogen_court_position:0 "末卡维首长"
 malkavian_primogen_court_position_desc:1 "预言家并不能控制预兆，但也许最好还是让他们站在你这边。"
 nosferatu_primogen_court_position:0 "诺斯费拉图首长"
 nosferatu_primogen_court_position_desc:1 "让诺斯费拉图帮你的忙总是一个好主意。困难在于真正确保他们是站在你这边的……"
 ravnos_primogen_court_position:0 "雷伏诺首长"
 ravnos_primogen_court_position_desc:1 "分裂和不和的家庭仍然是一个家庭。"
 setite_primogen_court_position:0 "赛特之子首长"
 setite_primogen_court_position_desc:1 "信仰之氏族可以在精神上引导你，但也许不能达到你所希望的结局。"
 tremere_primogen_court_position:0 "睿魔尔首长"
 tremere_primogen_court_position_desc:1 "篡位者带来了大量的礼物，也带来了更多的诅咒。"
 salubri_primogen_court_position:0 "萨洛比首长"
 salubri_primogen_court_position_desc:1 "牧人者正在死去，但他们的职责依然存在。"
 POD_primogens.0001.t:0 "首长机制"
 POD_primogens.0001.desc:1 "由于你是王国（或以上）级别的统治者，你现在可以安排次要宫廷职位——首长。\n该职位代表了你所在地区的每个[Clan|E]都希望有的邻近你的代表人。每个[Clan|E]都重视不同的技能，你可以从他们的能力等级中看到，但他们都希望被代表。\n如果你选择不任命某人（因为你付不起他们的薪水，或者因为其他地方需要他们，或者仅仅因为你还没有合适的人），你得知道这个特定的[Clan|E]在未来几年里提出抗议，让在你的领地里该[Clan|E]的每个成员对你有显著的好感度减值。"
 POD_primogens.0001.a:0 "明白"
 primogen_explanation_tt:0 "你具有三年期限，直到你的国家觉得这些席位被填充。"
 lack_primogen_opinion:1 "感到被边缘化"
 POD_primogens.0003.t:0 "氏族的情绪"
 POD_primogens.0003.desc:1 "作为一名强大的黑夜统治者，你经常被不死族社会的各个[Clan|E]评判。那些没有被你赐予首长职位的人在你的宫廷里被认为是被边缘化的，也许是因为他们在你的领地政治上无足轻重，或者仅仅是因为你现在的喜好。\n无论如何，你现在可以感觉到各氏族对你的统治的情绪再次发生转变。"
 POD_primogens.0003.a:0 "他们真正在想什么？"
