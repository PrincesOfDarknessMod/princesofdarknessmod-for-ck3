l_simp_chinese:
 culture_era_dark_fantastic:0 "幽暗奇幻"
 culture_era_dark_fantastic_desc:0 "《黑暗世界》的文艺复兴时期，《法师：术士圣战》的世设。就像《血族：幽暗纪元》之前的黑暗中世纪时代一样，幽暗奇幻更是该历史时代的阴暗版本，充斥着对人类来说不可名状的梦魇妖魔和恶魔。然而，幽暗奇幻是一个更奇妙的背景，很符合《法师：超凡入圣》的经典奇幻角色和历史中的文艺复兴精神。"
 culture_era_gothic_victorian:0 "哥特维多利亚"
 culture_era_gothic_victorian_desc:0 "「哥特维多利亚」这名字隐喻了对应世设的两种情怀：一种是古典哥特小说中忧郁、注定要失败的浪漫主义，另一种对应着英格兰维多利亚女王一世的统治时期，她从1837年6月20日统治大英帝国，直到1901年1月22日去世。这两种情怀都推断出一种对激进的社会变革的关注，因为它与传统本身的压制力量交替共存和互相冲突。《维多利亚血族》中的哥特维多利亚时代贯穿了从1890年到1897年的年份，并没有随着维多利亚的去世而结束，而是随着布拉姆·斯托克的小说《德古拉》的出版而结束——该事件彻底惊动了整个血族世界。哥特维多利亚时代与狂野西部部分重叠，《狼人：狂野西部》的世设，尽管这两个世设的主题和基调有很大的不同。即将显现的《法师：超凡入圣》中的维多利亚法师也将遭遇维多利亚时代。"
 culture_era_final_nights:0 "终末之夜"
 culture_era_final_nights_desc:0 "在该隐之子的末日预言中，终末之夜指的是火焚降临和血族灭亡之前的那些夜晚。终末之夜的大部分可信度基础来自于挪得学家写的传说，尤其是《挪得之书》。终末之夜应该是应由引起该隐之子社会的巨大变化和上古耆宿的苏醒的数个迹象标明，例如淡血种的增长，劣族成为亲王，和鬼人入侵西方，据说大多数吸血鬼拥有对终末之夜的末日预感。"