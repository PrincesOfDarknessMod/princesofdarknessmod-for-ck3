l_simp_chinese:
 POD_nocturne_on_personal_interaction:0 "化夜"
 POD_nocturne_on_personal_interaction_desc:0 "开始散发一种能够吸取所有邻近敌人的暗影"
 POD_nocturne_on_personal_interaction.tt:0 "如果你是一名指挥官，你将有机会在战斗中削减敌方骑士的勇武。但每有一位骑士受影响就会花费一定虔诚。"
 POD_nocturne_off_personal_interaction:0 "关闭化夜"
 POD_nocturne_off_personal_interaction_desc:0 "停止在战斗中使用化夜"
 POD_nocturne_off_personal_interaction.tt:0 "你将停止使用化夜"
 POD_drain_the_life_interaction:0 "众生衰竭"
 POD_drain_the_life_interaction_desc:0 "施展可怕的黑暗，吞噬它所接触的一切"
 POD_drain_the_life_interaction.tt:0 "你将在[recipient.GetFirstName]的国度释放可怖的黑暗"
