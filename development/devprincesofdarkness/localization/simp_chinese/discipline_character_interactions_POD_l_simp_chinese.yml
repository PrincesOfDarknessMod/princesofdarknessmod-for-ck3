 POD_blood_of_a_demon_interaction_option_infernalist_ct:0 "对地狱中的存在发誓忠诚，允许你从崇魔术的力量中获益而不需要付出虔诚作为代价。"
 POD_blood_of_a_demon_interaction_option_lustful:0 "驾驭罪恶：色欲"
