 POD_fortitude_interaction:0 "坚韧术"
 POD_fortitude_interaction_desc:0 "操作坚韧术[discipline|E]给予你的力量。"
 activate_toughness_loc:0 "激活坚韧不拔"
 deactivate_toughness_loc:0 "取消坚韧不拔"
 activate_prowess_from_pain_loc:0 "伤痛之力"
 activate_toughness_ct:0 "当它处于激活状态时，你的角色会受到坚韧术的超自然力量的保护。每当受到伤害时，其将有概率“抵消”伤害。如果成功，就不会受到伤害。无论成功与否，都会进行一次增长饥渴度检定。"
 deactivate_toughness_ct:0 "取消坚韧不拔。你将不再受到对伤害的保护，但你也不会再失去任何血来为[discipline|E]提供能量。"
 activate_prowess_from_pain_ct:0 "激活伤痛之力，从你的伤口中汲取力量。伤口越严重，力量就越大。"
 fortitude_failed_soaked_damage:0 "抵消伤害失败"
