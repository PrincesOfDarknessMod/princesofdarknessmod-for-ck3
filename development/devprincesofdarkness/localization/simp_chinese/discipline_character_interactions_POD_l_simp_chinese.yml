l_simp_chinese:
 POD_nocturne_on_personal_interaction:0 "化夜"
 POD_nocturne_on_personal_interaction_desc:0 "开始散发一种能够吸取所有邻近敌人的暗影"
 POD_nocturne_on_personal_interaction.tt:0 "如果你是一名指挥官，你将有机会在战斗中削减敌方骑士的勇武。但每有一位骑士受影响就会花费一定虔诚。"
 POD_nocturne_off_personal_interaction:0 "关闭化夜"
 POD_nocturne_off_personal_interaction_desc:0 "停止在战斗中使用化夜"
 POD_nocturne_off_personal_interaction.tt:0 "你将停止使用化夜"
 POD_drain_the_life_interaction:0 "流生入无"
 POD_drain_the_life_interaction_desc:0 "施展可怕的黑暗，吞噬它所接触的一切"
 POD_drain_the_life_interaction.tt:0 "你将在[recipient.GetFirstName]的国度释放可怖的黑暗"
 POD_shadow_twin_interaction:0 "暗影替身"
 POD_shadow_twin_interaction_desc:0 "创建暗影替身"
 POD_shadow_twin_interaction.tt:0 "你将尝试使用暗影替身"
 already_has_shadow_twin:0 "我已经有暗影替身了"
 POD_sense_the_sin_interaction:0 "感知罪恶"
 sense_the_sin_interaction_desc:0 "深入[recipient.GetFirstName]的头脑，把其性格中最糟糕的部分拉出来，让其比以前糟糕得更多。"
 sense_the_sin.ct:0 "#R 让乐子开始吧！"
 sense_the_sin.ct.sin:0 "深入[recipient.GetFirstName]的头脑，把其性格中最糟糕的部分拉出来，让其比以前糟糕得更多。"
 sense_the_sin.ct.virtue:0 "深入[recipient.GetFirstName]的头脑，将其最好的品质扭曲成嘲弄性的、累赘性的缺陷。"
 sense_the_sin_interaction_option_sin:0 "专注于#R 罪恶"
 sense_the_sin_interaction_option_virtue:0 "专注于#G 美德"
 global_not_need_sins_or_virtues:0 "目标需要有一个未被开发的罪恶。如果你有「淬毒美德」，那么一个未被污染的美德也行。"
 POD_psychomachia_interaction:0 "灵魂之战"
 POD_psychomachia_interaction_desc:0 "让[recipient.GetFirstName]和受之前「 感知罪恶」的力量所增强的其最坏本性的显象发起一场战斗。如果受害者获胜，他们将驾驭他们的黑暗特质，并将其用于自己的利益。但如果其输了，黑暗将反噬——要么让其更加无比的堕落，要么其心灵将逃到幸福的蛰眠中。"
 POD_psychomachia_interaction_ct:0 "如果能力成功，[recipient.GetName]将与一个被「 感知罪恶」增强的罪恶的显象进行决斗。被增强的罪恶越多，显象就越强，但潜在的收益也会增加。这种能力只能对每人使用一次。"
 POD_psychomachia_interaction_morepower:0 "强化显象"
 POD_psychomachia_interaction_lesspower:0 "弱化显象"
 POD_psychomachia_interaction_normal:0 "普通"
 POD_non_infernalists_pay:0 "唤魔术的地狱力量使灵魂受到伤害。只有黑暗力量的侍从（拥有唤魔者秘密/特质的人）才能从可怕的代价中解脱出来。"
 POD_infernalists_dont_pay:0 "作为唤魔者，地狱的领主保佑你免受唤魔术的代价。"
 POD_blood_of_a_demon_interaction:0 "恶魔之血"
 POD_blood_of_a_demon_interaction_desc:0 "使用唤魔术异能来给予黑暗力量"
 POD_blood_of_a_demon_interaction_option_infernalist:0 "成为唤魔者"
 POD_blood_of_a_demon_interaction_option_infernalist_ct:0 "对地狱中的存在发誓忠诚，允许你从唤魔术的力量中获益而不需要付出虔诚作为代价。"
 POD_blood_of_a_demon_interaction_option_lustful:0 "驾驭罪恶：色欲"
 POD_blood_of_a_demon_interaction_option_gluttonous:0 "驾驭罪恶：暴食"
 POD_blood_of_a_demon_interaction_option_greedy:0 "驾驭罪恶：贪婪"
 POD_blood_of_a_demon_interaction_option_lazy:0 "驾驭罪恶：懒惰"
 POD_blood_of_a_demon_interaction_option_wrathful:0 "驾驭罪恶：暴怒"
 POD_blood_of_a_demon_interaction_option_arrogant:0 "驾驭罪恶：傲慢"
 POD_blood_of_a_demon_interaction_option_deceitful:0 "驾驭罪恶：狡诈"
 POD_blood_of_a_demon_interaction_option_craven:0 "驾驭罪恶：怯懦"
 POD_blood_of_a_demon_interaction_option_arbitrary:0 "驾驭罪恶：专断"
 POD_blood_of_a_demon_interaction_sin_ct:0 "增强你的罪恶以增强自己。若没有长者技能，这只能执行一次。小心选择罪恶……"
 POD_blood_of_a_demon_other_interaction:0 "恶魔之血"
 POD_blood_of_a_demon_other_interaction_desc:0 "利用你被恶魔污染的血液来操纵他人——将你的意志强加给唤魔者，计谋引导他人对恶魔崇拜，当达到最高级别，可授予可怕的黑暗赠礼。"
 POD_blood_of_a_demon_other_interaction_option_infernalist_service:0 "要求服务"
 POD_blood_of_a_demon_other_interaction_option_infernalist_scheme:0 "诱使进入唤魔者"
 POD_blood_of_a_demon_other_interaction_option_lustful:0 "赐予黑暗赠礼：色欲"
 POD_blood_of_a_demon_other_interaction_option_gluttonous:0 "赐予黑暗赠礼：暴食"
