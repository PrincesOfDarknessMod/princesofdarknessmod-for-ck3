 fortitude_soaked_damage_ct:0 "你对坚韧术的掌握保护了你免受伤害。"
 armoured_flesh_ct:0 "你的装甲化肉体将保护你免于死亡"
 resilient_mind_loc:0 "坚韧心智"
 resilient_mind_ct:0 "你的坚韧术在你的心智和疯狂之间起着抗性作用，使你摆脱源自自然和魔法的狂乱。"
