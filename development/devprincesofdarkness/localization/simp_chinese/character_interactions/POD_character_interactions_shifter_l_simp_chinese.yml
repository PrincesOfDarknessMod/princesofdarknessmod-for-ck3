 POD_divide_interaction:0 "分化"
 POD_divide_interaction_desc:0 "你将在该国家里播下无序之种，让封臣对他们的领主感到不满。"
 divide_modifier:0 "分化"
 divide_modifier_desc:0 "你所做的一切或所说的一切似乎都被你的封臣们误解了。仿佛有一股邪恶的力量以某种方式扭曲了你的话语……"
 POD_packmember_interaction:0 "兽群创建"
