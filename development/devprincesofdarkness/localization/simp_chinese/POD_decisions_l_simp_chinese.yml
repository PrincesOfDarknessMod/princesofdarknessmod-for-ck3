 restore_red_order_desc:0 "我们主域的衰落不会停止我们的研究。通过神圣和邪恶的祝福，我们将夺回我们的土地。"
 restore_red_order_confirm:0 "让我们再深入一点。"
 restore_red_order_effect_tooltip:1 "你将创建红修会王国头衔。"
 restore_knights_of_acre:0 "重建亚柯骑士"
 restore_knights_of_acre_tooltip:1 "就像熔炉中的剑一样，我们将重铸天主之剑！"
 restore_knights_of_acre_desc:0 "只要还有教友挥舞着十字，修士会的传承就将延续下去。"
