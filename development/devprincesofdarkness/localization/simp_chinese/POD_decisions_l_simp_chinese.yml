 PODinquisition.9999.desc:0 "你决定把时间花在宫廷以外的地方来专注于源自你的灵魂深处的强烈的信仰之上。一个高尚的选择，毫无疑问，但是吸血鬼的政治不会等人，你必须选择你想要留给你的对手多少时间让他们在你身后策划密谋……"
 PODinquisition.9999.a:0 "我会花最少的时间"
 PODinquisition.9999.b:0 "我可以再努力一点，我会以后再重新掌控我的宫廷"
