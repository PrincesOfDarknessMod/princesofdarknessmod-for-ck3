 practicing_arts_decision:0 "修炼技艺"
 practicing_arts_decision_desc:1 "开悟没有练习就不会到来。正如所有东方哲学所教导的那样，在迷雾为你分开之前，你必须在身心灵上完善自己。强烈的训练将烧掉红尘妄想；在这种状态下，（也许）顿悟将会显现。"
 practicing_arts_decision_tooltip:1 "你将把时间集中在技艺的修炼。"
 practicing_arts_decision_confirm:1 "我想修炼技艺。"
 treking_wilds_decision:0 "探索荒野"
 treking_wilds_decision_desc:1 "大部分社团都有着心口相传的仪式，这一传统发自第四纪元的早期夜晚，社团可能长途跋涉深入遍布变化妖怪的荒野来修行血经。"
 treking_wilds_decision_tooltip:1 "你将把时间集中在寻求冒险上。"
 treking_wilds_decision_confirm:1 "我想深入荒野。"
 mortal_living_decision:0 "隐于凡间"
 mortal_living_decision_desc:1 "大部分社团都有着心口相传的仪式，这一传统发自第四纪元的早期夜晚，社团在每一年抽一个月扮演凡人角色。"
 mortal_living_decision_tooltip:1 "你将会拜访凡人的世界。"
 mortal_living_decision_confirm:1 "我要与凡人一同生活。"
 spirit_traveling_decision:0 "与灵互动"
 spirit_traveling_decision_desc:1 "你具有能沟通或影响阴阳双界的居民的能力。或甚至能穿越入阴阳双界。"
 spirit_traveling_decision_confirm:1 "来灵！"
 spirit_traveling_decision_tooltip:1 "你将选择如何与灵类互动。"
 witching_lands:0 "建立巫土"
 witching_lands_tooltip:1 "德鲁伊的时代到了。"
 witching_lands_desc:0 "随着德鲁伊教派和巫师吸血鬼的兴起，不列颠群岛的森林本身似乎已经叛逆了旧[cainite|E]统治。一个新合声的权杖之岛和绿宝石岛呼喊；德鲁伊——曾被所有[cainites|E]抗拒——现在胜利了，他们的黑森林将永远蔓延。"
 witching_lands_confirm:0 "且将直到永远。"
 witching_lands_effect_tooltip:1 "你将创建巫土头衔。"
 POD_convert_government_decision:0 "改变政体"
 POD_convert_government_decision_desc:1 "你正在使用一个不适用于你角色的政体类型。这决议允许你改变它。"
 POD_convert_government_decision_tooltip:1 "你正在使用一个不适用于你角色的政体类型。这决议允许你改变它。\n改变[government|E]类型，转为适用于你角色的[government|E]。"
 POD_convert_government_decision_confirm:1 "采取正道"
 restore_celestial_army_objective_decision:0 "重建天军"
 restore_celestial_army_objective_decision_desc:1 "数百年前，许多士选择了一条更宏伟的道途：称为“天军”，他们试图消灭任何地方的鬼神，甚至就算没有必要也会采取行动。许多士谴责这天军，因为他们对违反羿的主要教诲之一感到震惊。最终，士变得傲慢，驱逐了所有不属于天军的除妖师。不久之后，他们的总部在一次地震中被摧毁，只剩下了流浪者。"
 restore_celestial_army_objective_decision_tooltip:1 "夺回昆仑山那曾经天军最伟大的学院，之后决定士的未来。"
 restore_celestial_army_objective_decision_confirm:1 "新的总部？"