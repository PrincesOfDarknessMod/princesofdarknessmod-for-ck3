 restore_house_murnau_effect_tooltip:1 "你将创建穆尔瑙王国头衔。"
 restore_oculi_dei:0 "重建神目"
 restore_oculi_dei_tooltip:1 "我们是天主之眼。我们看到我们将重回家园。"
 restore_oculi_dei_desc:0 "为了让我们的网络更集中，你需要重夺佛兰德斯。"
 restore_oculi_dei_confirm:0 "我们重新登场。"
 restore_oculi_dei_effect_tooltip:1 "你将创建神目王国头衔。"
 restore_sword_of_st_james:0 "重建圣雅各伯之剑"
 restore_sword_of_st_james_tooltip:1 "那些魔物发起的收复失地运动是效仿我们战斗的可悲尝试。让他们好好看看我们是怎么做的。"
