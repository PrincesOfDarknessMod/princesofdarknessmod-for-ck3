 ask_pope_decision:0 "向圣父教宗询求资助"
 ask_pope_decision_desc:0 "你将向罗马主教询求支持功业的资金。"
 ask_pope_decision_confirm:0 "写信"
 ask_pope_decision_tooltip:0 "教宗会听到我们的祈求！"
 ask_pope_decision_effect_tooltip:0 "你需要一些技巧来处理圣座的拜占庭式政治"
 ask_pope.1.t:0 "要求资助"
 ask_pope.1.desc:0 "你的选择是，要么要求在创立宪章中所商定的货币援助数额，要么冒着惹恼教宗的风险，说服教宗进一步提供资金。"
 ask_pope.a:0 "请求额外的资金，夸大威胁。"
 ask_pope.a.success:0 "你描述出一幅关于隐现威胁的可怖景象。"
 ask_pope.a.failure:0 "教宗将你的报告斥为危言耸听。"
 ask_pope.b:0 "请求额外资金，强调功业的神圣性。"
 ask_pope.b.success:0 "你成功的打动到圣父教宗狂热的一面。"
 ask_pope.b.failure:0 "你没能把你的功业凌驾于教宗的其他开销之上。"
 ask_pope.c:0 "请求额外的资金，奉承圣父教宗。"
 ask_pope.c.success:0 "你挠到了圣父教宗的虚荣心来讨好他。"
 ask_pope.c.failure:0 "教宗看穿了你明显的奉承企图。"
 ask_pope.d:0 "申请额外资金，夸大你的开支。"
 ask_pope.d.success:0 "你把账目上的数字改来改去，证明了额外的资金是合理的。"
 ask_pope.d.failure:0 "教宗不会被你的原创性账本所愚弄。"
 ask_pope.e:0 "只需要求商定的金额。"
 ask_pope.a.success.t:0 "教宗信你。"
 ask_pope.a.success.desc:0 "圣父教宗被你所目睹的混乱和堕落深深震撼了。他寄出双倍津贴。"
 ask_pope.a.failure.t:0 "教宗怀疑你。"
 ask_pope.a.failure.desc:0 "你把你的报告夸张到如此荒诞的程度，让圣父教宗开始怀疑你除了编造故事之外还做了什么。"
 ask_pope.b.success.t:0 "教宗被说服了。"
 ask_pope.b.success.desc:0 "圣父教宗同意，对于一个牧师来说，没有比保护他的教众更公正的功业了。他寄出双倍津贴。"
 ask_pope.b.failure.t:0 "教宗重新考虑了他的开支。"
 ask_pope.b.failure.desc:0 "你对你的使命的不恰当描述提醒了圣父教宗他目前更多急需的开支。"
 ask_pope.c.success.t:0 "教宗开心得慷慨解囊。"
 ask_pope.c.success.desc:0 "你的微妙和精细的奉承使你成为圣父教宗最喜欢的被资助人之一。他寄出双倍津贴。"
 ask_pope.c.failure.t:0 "教主看穿了你的奉承。"
 ask_pope.c.failure.desc:0 "你对圣父教宗的粗暴奉承被看作是侮辱。"
 ask_pope.d.success.t:0 "你成功解释了你的预算来由。"
 ask_pope.d.success.desc:0 "圣父教宗承认，你的使命可能比最初预期的更昂贵。"
 ask_pope.d.failure.t:0 "你的账本值得怀疑。"
 ask_pope.d.failure.desc:0 "你笨拙的夸大自己开支的尝试导致教宗的会计师得出结论——你资金过剩。"
 ask_pope.e.t:0 "你会收到资金。"
 ask_pope.e.desc:0 "只要指定的基金里提供的金额，不多也不少。"
 conversion_decision:0 "集体皈依"
 conversion_decision_tooltip:0 "通过你的真信使你的国家皈依"
 conversion_decision_desc:0 "作为一个真信者，你可以组织一场宗教皈依运动以对抗那些古老的圣人。"
 conversion_decision_effect_tooltip:0 "你国家的廷臣会皈依你的信仰。"
 conversion_decision_confirm:0 "吾等将把他们曝露在光下！"
