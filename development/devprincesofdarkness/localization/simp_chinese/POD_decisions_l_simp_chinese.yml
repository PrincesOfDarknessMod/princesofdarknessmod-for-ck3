l_simp_chinese:
 groom_successor_decision:0 "寻找继承人"
 groom_successor_decision_tooltip:1 "你的仆人将会列出一些合适的候选人"
 groom_successor_decision_desc:0 "万鬼无法实行[Embrace|E]，大多数情况下也不能正常地生育子女。因此，如果你不想让你的努力因为一次不幸的事故而前功尽弃的话，你必须做好准备。你将要求你的仆人列出一些合适的候选人。"
 groom_successor_decision_effect_tooltip:1 "你将看到一些候选人，并可以一定威望为代价，从中选择一位作为你的孩子"
 groom_successor_decision_confirm:0 "开始搜寻"
 oust_mithras_objective_decision:0 "落日"
 oust_mithras_objective_decision_tooltip:1 "一旦你成功了，你将收获巨大的回报，并且永远削弱密特拉密教。"
 oust_mithras_objective_decision_desc:0 "密特拉为了逃避在大陆上的失败而跑到这里来，从此他和他的兄弟就成了这些岛屿上的煞星。阿尔比恩的血族从这个所谓的波斯“神”手中夺回自己的家园已经是很久之后的事了。"
 oust_mithras_objective_decision_effect_tooltip2:1 "这将削弱密特拉之道，给予你巨大的威望并召集一些新的战士保护阿尔比恩。"
 oust_mithras_objective_decision_confirm:0 "终于，是时候了"
 oust_mithras_custom_decision:0 "你不能有信仰密特拉之道的封臣，男爵除外。"
 oust_mithras_custom_decision2:0 "密特拉已经死亡或陷入[torpor|E]。"
 mithras_victory_objective_decision:0 "权杖和太阳"
 mithras_victory_objective_decision_tooltip:1 "随着密特拉密教的影响力越来越大，梵卓[clan|E]将落入其掌握之中"
 mithras_victory_objective_decision_desc:0 "在古罗马，密特拉曾一度接近于主宰着宗教界。今夜，人类似乎遥不可控，但作为梵卓的重要成员，仍然有可能通过信仰来控制[clan|E]。如果先把一些小事情处理掉……"
 mithras_victory_objective_decision_effect_tooltip2:1 "密特拉密教将赋予信徒力量，而大多数梵卓会皈依它，永远地在[clan|E]和信仰之中徘徊"
 mithras_victory_objective_decision_confirm:0 "氏族与信仰，是一体的"
 mithras_victory_custom_decision:0 "哈德施塔特，卡米拉和亚历山大，这三位梵卓[clan|E]统治的主要大敌，必须死亡或者陷入[torpor|E]。"
 mithras_victory_custom_decision2:0 "除了你或密特拉，没有其他人能拥有帝国头衔。除非他们是密特拉密教的成员。"
 toreador_victory_objective_decision:0 "幻梦再临"
 toreador_victory_objective_decision_tooltip:1 "一个将响彻[cainite|E]历史的关键时刻。"
 toreador_victory_objective_decision_desc:0 "1204年，不可思议的事情发生了，米迦勒，君士坦丁堡的幻梦之牧首，在他的城市被烧毁时死去。从他死的那时候起，无数死去的天使长的追随者们试图重建这个最神圣的乌托邦。"
 toreador_victory_objective_decision_confirm:0 "我希望米迦勒在注视着"
 toreador_victory_objective_decision_effect_tooltip:1 "你将面临一个抉择，重新恢复天使长的信仰或只是获得物质财富"
 shadow_reconquista_objective_decision:0 "暗影再征服"
 shadow_reconquista_objective_decision_tooltip:1 "这将取悦勒森魃[clan|E]的领袖，并且为你更伟大的未来铺平道路。"
 shadow_reconquista_objective_decision_desc:0 "勒森魃[clan|E]的[ashirra|E]分子为了保住自己的权力引发了一场几乎结束了勒森魃对伊比利亚的统治的内战，必须赶快阻止他们"
 shadow_reconquista_objective_decision_confirm:0 "他们的叛乱已经结束了"
 shadow_reconquista_objective_decision_effect_tooltip:1 "你将篡夺或创建暗影之海头衔，这在一段时间内可能带来负面名声"
 shadow_reconquista_objective_decision_custom:1 "在你的国家里不能有[ashirra|E]信徒。男爵不算入内。"
 einherjar_victory_objective_decision:0 "战胜诸神黄昏"
 einherjar_victory_objective_decision_tooltip:1 "在诸神黄昏之前，你的人民的还有未来的希望。"
 einherjar_victory_objective_decision_desc:0 "卡哈尔的子嗣们被基督教的到来压得喘不过气。奥丁失踪了，而他们的族人正用干草叉和火来反抗。由于日耳曼的梵卓血族已经占领了斯堪的纳维亚南部的城市，英灵战士的时代已经结束了。"
 einherjar_victory_objective_decision_confirm:0 "瓦尔哈拉虚席以待"
 einherjar_victory_objective_decision_effect_tooltip:1 "你将用你巨大而出乎意料的胜利来振兴英灵战士的信仰，并把它带到这个新时代。"
 ashirra_deconquista_objective_decision:0 "午夜之后的伊比利亚"
 ashirra_deconquista_objective_decision_tooltip:1 "在[ashirra|E]的支持下结束伊比利亚的内战是一项艰难的任务，但也有值得的回报。"
 ashirra_deconquista_objective_decision_desc:0 "自从勒森魃内战爆发以来，[ashirra|E]的信徒们遭受了一次又一次的挫折。有了暗影之海的支持，德·鲁伊斯的胜利似乎已成定局，但也许你还能扭转乾坤……"
 ashirra_deconquista_objective_decision_confirm:0 "虔诚之人已经胜利了"
 ashirra_deconquista_objective_decision_effect_tooltip:1 "你的胜利将削弱暗影之海的力量，让你伟大的事业又前进了一步，并且开始重建被战争蹂躏的伊比利亚。"
 ashirra_deconquista_objective_decision_custom:1 "在你的国家中不能有信仰暗夜之道的角色，男爵除外。"
 malkavian_victory_objective_decision:0 "小玩笑"
 malkavian_victory_objective_decision_tooltip:1 "末卡维在告诉你该做些什么！大概吧"
 malkavian_victory_objective_decision_desc:0 "你有一种强烈的欲望，或者一对未来的预视，或者一个炽热的梦……你必须需要召集末卡维[clan|E]的人在波希米亚开始一场大仪式。或在耶路撒冷。"
 malkavian_victory_objective_decision_confirm:0 "重要的事情来了！"
 malkavian_victory_objective_decision_effect_tooltip:1 "通过你对仪式的知识储备和精准把控，你将会完成它。你会吗？"
 senate_victory_objective_decision:0 "永恒的共和国"
 senate_victory_objective_decision_tooltip:1 "罗马已经陨落，但它的共和国精神还在。梵卓[clan|E]正在向新的方向发展，它可能会朝着更古老、更自豪的方向发展。"
 senate_victory_objective_decision_desc:0 "在堕落到原罪的深渊之前，不死罗马是所有拥护共和的[cainites|E]的乌托邦。所有——或者至少大多数——[clan|E]都能在元老院中占据一席之地。这份愿景现在依旧可以实现，若是能够先阻止德意志梵卓建立新帝国的企图的话……"
 senate_victory_objective_decision_confirm:0 "吾等既是元老院"
 senate_victory_objective_decision_effect_tooltip:1 "罗马共和国将会重建，并出台新的政策，对氏族们进行相应的奖励和惩罚。"
 senate_victory_objective_decision_custom:1 "要么黑十字封邑头衔是你的，要么其已经不存在。"
 brujah_victory_objective_decision:0 "迦太基"
 brujah_victory_objective_decision_tooltip:1 "我们永远不会忘记迦太基，人类与[cainites|E]的特洛伊尔乌托邦。被嫉妒的罗马人所焚烧，它的精神仍然附着在我们每个人身上。"
 brujah_victory_objective_decision_desc:0 "罗马和卡米拉摧毁了我们心爱的迦太基，完美的城市。但只要布鲁赫[clan|E]还在，它就永远不会消失。也许这时候罗马已经衰败，但我们可以看到乌托邦的重生。"
 brujah_victory_objective_decision_confirm:0 "特洛伊尔会感到骄傲"
 brujah_victory_objective_decision_effect_tooltip:1 "你可以选择如何处理这一重要时刻。无论是作为一种政治手段还是一个真正的、分裂的乌托邦。"
 brujah_victory_objective_decision_custom:1 "卡米拉，曾经摧毁了我们的城市的前今罗马亲王，必须死亡或者陷入[torpor|E]。"
 babayaga_victory_objective_decision:0 "你体贴的祖母"
 babayaga_victory_objective_decision_tooltip:1 "诺斯费拉图[clan|E]是注定要灭亡的，除非你想办法与鬼婆女王结盟。"
 babayaga_victory_objective_decision_desc:0 "诺斯费拉图[clan|E]的始祖，雅斯米利亚德正在外谋划着其后嗣的灭亡。唯一的希望就托付在曾成功拖住他的“小祖母”芭芭雅嘎身上。取悦她，也许你还能在即将来临的风暴中活下来。"
 babayaga_victory_objective_decision_confirm:0 "祖母，请听从我们的请求！"
 babayaga_victory_objective_decision_effect_tooltip:1 "诺斯费拉图[clan|E]将团结在芭芭雅嘎和她的天选选民——你的旗下。"
 babayaga_victory_objective_decision_custom:1 "芭芭雅嘎的老对手，白俄罗斯的突伽·辛，必须死亡或者陷入[torpor|E]。"
 nosferatu_victory_objective_decision:0 "黑暗中的恐怖"
 nosferatu_victory_objective_decision_tooltip:1 "威胁确实潜伏在黑暗当中。诺斯费拉图[clan|E]需要一位保护者。"
 nosferatu_victory_objective_decision_desc:0 "你的[clan|E]正是被它的始祖雅斯米利亚德追杀的。因此，你被迫躲在暗影中，等待他的愤怒吞噬你。但也许有人能团结[clan|E]进行反击……"
 nosferatu_victory_objective_decision_confirm:0 "我们会容忍你的，始祖"
 nosferatu_victory_objective_decision_effect_tooltip:1 "你将统一诺斯费拉图[clan|E]，这是一个强大的资产，拥有如此坚韧和狡猾的血统。"
 urshulgi_victory_objective_decision:0 "神之梦"
 urshulgi_victory_objective_decision_tooltip:1 "只有受宠爱的儿子乌尔·舒尔吉知道哈基姆的意思"
 urshulgi_victory_objective_decision_desc:0 "阿刹迈[clan|E]是在抗拒。我们的使命是净化世界上加音子嗣的不纯血统，并为我们的始祖哈基姆取回它。我们必须向他们展示真理。"
 urshulgi_victory_objective_decision_confirm:0 "黑牧人降世"
 urshulgi_victory_objective_decision_effect_tooltip:1 "阿刹迈[clan|E]会皈依你的密教，乌尔·舒尔吉之梦将收割走不洁者的灵魂。"
 urshulgi_victory_objective_decision_custom:1 "鹰巢控制权的主要竞争者，贾迈勒、纳穆尔图姆和阿什拉夫，必须死亡或者陷入[torpor|E]。"
 assamite_victory_objective_decision:0 "分裂的家族"
 assamite_victory_objective_decision_tooltip:1 "哈基姆的子嗣需要一个全新的、统一的领导层。"
 assamite_victory_objective_decision_desc:0 "阿刹迈[clan|E]因信仰冲突、密教崇拜、以及个人利益而分裂。这些分歧根深蒂固，很快就会危及[clan|E]的存在本身。我们必须修复这些分歧。"
 assamite_victory_objective_decision_confirm:0 "不再有兄弟相残"
 assamite_victory_objective_decision_effect_tooltip:1 "你将一统整个阿刹迈[clan|E]，并决定要将他们的命运引向何方。"
 assamite_victory_objective_decision_custom:1 "刀锋之网与失落部族这些分裂派系已被摧毁或在你的直辖之下。"
 sinner_victory_objective_decision:0 "原罪之政"
 sinner_victory_objective_decision_tooltip:1 "罪人能够改变这个被道德所束缚的时代。"
 sinner_victory_objective_decision_desc:0 "今夜，罪人是可悲之人，对堕落的渴望使他们失去理性。但罪人曾是最强大的[cainite|E]帝国罗马的统治者。我们可以重现这份辉煌。"
 sinner_victory_objective_decision_confirm:0 "各位朋友，各位罗马人，各位同胞，请你们听我说"
 sinner_victory_objective_decision_effect_tooltip:1 "永恒罗马将再次兴盛，原罪之路将重建政权。"
 ventrue_victory_objective_decision:0 "万王之王"
 ventrue_victory_objective_decision_tooltip:1 "这世上存在着太多血族之王了。"
 ventrue_victory_objective_decision_desc:0 "你属于王者之[clan|E]，但若你能够成为统治者的统治者呢？毕竟，团结一致的梵卓[clan|E]才是最强的……"
 ventrue_victory_objective_decision_confirm:0 "首先是梵卓氏族，然后是整个世界"
 ventrue_victory_objective_decision_effect_tooltip:1 "你将一统梵卓[clan|E]，确保其对所有血族的统治。"
 ventrue_victory_objective_decision_custom:1 "除了你之外没有梵卓持有帝国头衔。"
 lasombra_victory_objective_decision:0 "影中虔信"
 lasombra_victory_objective_decision_tooltip:1 "这场混乱的内战必须终止。你得趁早行动，否则就太迟了。"
 lasombra_victory_objective_decision_desc:0 "自[ashirra|E]分裂出去以来，勒森魃[clan|E]便身陷战争。这削弱了暗影之海对地中海的控制力，我们必须阻止这件事。"
 lasombra_victory_objective_decision_confirm:0 "是时候翻篇结束这段历史了"
 lasombra_victory_objective_decision_effect_tooltip:1 "残存的[ashirra|E]再也掀不起风浪，你将在[clan|E]中具备绝对的权威……暂时的。"
 lasombra_victory_objective_decision_custom:1 "午夜新月和[ashirra|E]哈里发国头衔必须已被销毁。"
 ashirra_victory_objective_decision:0 "新月破影"
 ashirra_victory_objective_decision_tooltip:1 "[ashirra|E]必须在内战中取得胜利。"
 ashirra_victory_objective_decision_desc:0 "你属于由穆斯林组成的[ashirra|E]，且与其出身的勒森魃[clan|E]身陷战争。为了虔信者们的安全，我们必须处理掉上一代勒森魃领导层。"
 ashirra_victory_objective_decision_confirm:0 "是时候清理掉游荡者"
 ashirra_victory_objective_decision_effect_tooltip:1 "残存的勒森魃基督徒将被赐予最后一次皈依的机会，而你作为永恒的哈里发的权力将得到保证。"
 ashirra_victory_objective_decision_custom:1 "暗影之海受你控制，或无人控制。"
 heretic_victory_objective_decision:0 "该隐真理"
 heretic_victory_objective_decision_tooltip:1 "若不采取行动，三位一体之该隐将回归到一个充斥着不信者的世界。"
 heretic_victory_objective_decision_desc:0 "被异乡人称为该隐异端的三位一体之该隐教会正在消失。在欧洲的所有地方都被追杀，领导层崩溃，整个教会都即将灭亡。回归已是奢望，但……信仰根本无需理由。"
 heretic_victory_objective_decision_confirm:0 "德谬哥在今夜遭受重击。"
 heretic_victory_objective_decision_effect_tooltip:1 "你将复兴教会，找到新的信仰，开拓新的时代。"
 anda_victory_objective_decision:0 "大草原之雷霆"
 anda_victory_objective_decision_tooltip:1 "若我们选择抵抗万鬼的反击，就必须果决迅速的征服这些新领土。"
 anda_victory_objective_decision_desc:0 "与蒙古人同行使安答繁荣昌盛。但中国的万鬼再次为战争集结，我们必须在他们进攻前巩固我们在西方的地位。"
 anda_victory_objective_decision_confirm:0 "这些大草原现在是我们的"
 anda_victory_objective_decision_effect_tooltip:1 "你将推迟万鬼的反击，且使西方的冈格罗加入你的阵营。"
 gangrel_victory_objective_decision:0 "天灾"
 gangrel_victory_objective_decision_tooltip:1 "你的世界正在消亡，但现在仍是反击的时候。"
 gangrel_victory_objective_decision_desc:0 "数个世纪以来，冈格罗都被排除在血族政治之外。更糟糕的是，他们的族裔还被追捕且强制皈依。我们必须阻止这件事。"
 gangrel_victory_objective_decision_confirm:0 "狼的纪元开始了。"
 gangrel_victory_objective_decision_effect_tooltip:1 "通过统一冈格罗[clan|E]，你将削弱那些所谓的文明氏族。"
 tremere_victory_objective_decision:0 "睿魔尔的意志"
 tremere_victory_objective_decision_tooltip:1 "睿魔尔[clan|E]还很年轻，而且四面皆敌。我们必须抓进时间巩固我们的地位。"
 tremere_victory_objective_decision_desc:0 "睿魔尔[clan|E]诞生于战火与苦痛。但是棘秘魑冷血无情，而我们对萨洛比展开的宣传攻势亦可以被逆转。我们必须继续并毁灭所有反对睿魔尔意志的人。"
 tremere_victory_objective_decision_confirm:0 "这个新的氏族，总算得以安定"
 tremere_victory_objective_decision_effect_tooltip:1 "你将成为[clan|E]的首席议员，并让残存的敌人身陷诅咒。"
 tremere_victory_objective_decision_custom:0 "棘秘魑军督领头衔必须已被销毁"
 tremere_victory_objective_decision_customb:0 "我们必须确保萨洛比没有持有帝国头衔"
 tzimisce_victory_objective_decision:0 "永恒的改变"
 tzimisce_victory_objective_decision_tooltip:1 "我们对放肆的篡位者的无能为力使我们成为[cainite|E]政治圈的笑柄已久。"
 tzimisce_victory_objective_decision_desc:0 "棘秘魑[clan|E]四分五裂，无法正确应对睿魔尔族的入侵。我们需要一个新的强大的领导者。"
 tzimisce_victory_objective_decision_confirm:0 "这是一场盛宴…"
 tzimisce_victory_objective_decision_effect_tooltip:1 "您将选择棘秘魑[clan|E]的前进之路。"
 tzimisce_victory_objective_decision_custom:0 "睿魔尔家族头衔必须已被销毁"
 cappadocian_victory_objective_decision:0 "萨尔贡圣书"
 cappadocian_victory_objective_decision_tooltip:1 "卡帕多西亚[clan|E]最神圣的圣物必须被取回。"
 cappadocian_victory_objective_decision_desc:0 "据说其中包含了萨尔贡（卡帕多修斯）在凡人阶段时所做的所有预言，圣书在当拉撒路输掉了与康斯坦西亚的战斗时丢失并被分成了碎片。重塑它这将是一个重要事件。"
 cappadocian_victory_objective_decision_confirm:0 "……它在呼唤我"
 cappadocian_victory_objective_decision_effect_tooltip:1 "你将选择如何处理这终极的知识之源。"
 giovanni_victory_objective_decision:0 "阴谋"
 giovanni_victory_objective_decision_tooltip:1 "卡帕多西亚[clan|E]阻碍了我们真正的潜力。我们可以做的更多。"
 giovanni_victory_objective_decision_desc:0 "我们是卡帕多西亚[clan|E]的新成员，但是我们的贡献已经超出了他们的提供的益处。是时候去作为一个独立[clan|E]去思考我们的未来了……"
 giovanni_victory_objective_decision_confirm:0 "让我们邀请我们亲爱的祖先来参加盛宴……"
 giovanni_victory_objective_decision_effect_tooltip:1 "您将推动乔凡尼[clan|E]的诞生。"
 giovanni_victory_objective_decision_custom:0 "埃尔吉耶斯受你控制，或无人控制。"
 furores_victory_objective_decision:0 "新的开始"
 furores_victory_objective_decision_tooltip:1 "我们正在缓慢的死于与长者和我们同族的小规模战争中，没有任何自由意志可言。这必须停止了。"
 furores_victory_objective_decision_desc:0 "腐朽的吸血鬼等级制度正在扼杀年轻一辈尝试做任何事的希望。如果要改变这种状况，就必须进行一场强烈的足以抵抗他们反击的革命。"
 furores_victory_objective_decision_confirm:0 "崭新的未来在等待。"
 furores_victory_objective_decision_effect_tooltip:1 "您将会把自由邦变成一个强大的政治实体。"
 setite_victory_objective_decision:0 "蛇之初拥"
 setite_victory_objective_decision_tooltip:1 "对赛特的忠诚皈依和对道德自由的极致渴望必须被广泛的传播开。"
 setite_victory_objective_decision_desc:0 "所谓的该隐子嗣是被误导了，相信了真理的扭曲倒影。我们都是赛特之子，在确保我们传统的边界下，我们将先迈出前进第一步让他们了解。"
 setite_victory_objective_decision_confirm:0 "让我们欢迎我们的新同胞。"
 setite_victory_objective_decision_effect_tooltip:1 "真相将会被广泛传播开，同时你也会同你[clan|E]的传统敌人做斗争。"
 setite_victory_objective_decision_custom:0 "[ashirra|E]哈里发国头衔必须已被销毁"
 salubri_victory_objective_decision:0 "最终审判"
 salubri_victory_objective_decision_tooltip:1 "许多人认为我们萨洛比[clan|E]只剩最后几个小时可活了，因为我们很快就会被我们众多的敌人所摧毁。"
 salubri_victory_objective_decision_desc:0 "萨洛比[clan|E]散布在各个地方，几乎被睿魔尔篡位者逼得绝种。更糟糕的是，像巴力这样的老敌人正在利用我们的弱点。我们必须进行反击。"
 salubri_victory_objective_decision_confirm:0 "复仇的滋味既快乐又痛苦。"
 salubri_victory_objective_decision_effect_tooltip:1 "你会统一[clan|E]，揭露睿魔尔的谎言和选择自己的道路。"
 salubri_victory_objective_decision_custom:0 "巴力的头衔，摩洛教团与阿扎那利教团，必须已被销毁。"
 baali_victory_objective_decision:0 "纪元的终结"
 baali_victory_objective_decision_tooltip:1 "这种腐朽和痛苦的幻觉必须以所有造物的燃烧而结束。"
 baali_victory_objective_decision_desc:0 "我们的主人内尔伽勒在上一次巴力之战中几乎终结了这个悲惨的世界。尽管摩洛教团比以往任何时候都更反对我们，但我们也许能够战胜他们，并加速所有人的灭亡。"
 baali_victory_objective_decision_confirm:0 "……于此，终结来临。"
 baali_victory_objective_decision_effect_tooltip:1 "你将统一巴力[clan|E]，并从深渊召唤强大的恶魔并开始最后的战争。"
 baali_victory_objective_decision_custom:0 "你的死敌，摩洛教团必须已被销毁。你[clan|E]的老对手，萨洛比的橄榄会议和阿刹迈的鹰巢帝国，同样。"
 molochim_victory_objective_decision:0 "封印之恶"
 molochim_victory_objective_decision_tooltip:1 "只有我们能够阻止先子的再临。我们的使命无私而又神圣。"
 molochim_victory_objective_decision_desc:0 "如果我们要阻止疯狂的黑天使唤醒远古的恐怖，就必须在正在进行的内战中彻底击退他们。不幸的是，我们还必须应对萨洛比和阿刹迈的敌意，他们不会区别对待我们和我们的堕落同胞。"
 molochim_victory_objective_decision_confirm:0 "现在，我们必须喂饱他们。"
 molochim_victory_objective_decision_effect_tooltip:1 "你将加强海隆的教义和它的追随者。"
 molochim_victory_objective_decision_custom:0 "你的死敌，阿扎那利教团必须已被销毁。你[clan|E]的老对手，萨洛比的橄榄会议和鹰巢的阿刹迈帝国，同样。"
 ravnos_victory_objective_decision:0 "西方与东方"
 ravnos_victory_objective_decision_tooltip:1 "背井离乡，你必须让自己成名。"
 ravnos_victory_objective_decision_desc:0 "你是那一小部分没有住在印度的雷伏诺[clan|E]的一员。大批的离去给你的同族带来了很多麻烦，使你你几乎不被认为是一个[cainite|E]。但也许你可以忍受，甚至在这样的环境下茁壮成长。"
 ravnos_victory_objective_decision_confirm:0 "一个新的雷伏诺氏族崭露头角。"
 ravnos_victory_objective_decision_effect_tooltip:1 "你将统一西方的雷伏诺[clan|E]，并且选择采取何种立场来对待东边的同胞们。"
 indian_victory_objective_decision:0 "终结永恒之战"
 indian_victory_objective_decision_tooltip:1 "南亚次大陆在战火和冲突中分崩离析。你必须挺身而出，采取行动。"
 indian_victory_objective_decision_desc:0 "已经没有人能够清楚的记得印度本土的[cainites|E]和万鬼之间的这场永恒之战到底持续了多久。除非有人能够团结分散各地的抵抗者，否则印度将永远无法从中解脱。"
 indian_victory_objective_decision_confirm:0 "终于，我们赢了"
 indian_victory_objective_decision_effect_tooltip:1 "你将团结整个印度，夺取转轮圣王的头衔，并开始清洗剩余的万鬼余孽。"
 kueijin_victory_objective_decision:0 "猩红之阳的崛起"
 kueijin_victory_objective_decision_tooltip:1 "永恒之战是一场险恶无比的战争，你的人民无法承受落败的苦果。"
 kueijin_victory_objective_decision_desc:0 "万鬼对印度的入侵已经僵持了数百年之久，付出了巨大的牺牲，但那些顽固的该隐人依然没有投降的意思。然而，你将不会重蹈前人的覆辙。"
 kueijin_victory_objective_decision_confirm:0 "将捷报传回中原朝廷。"
 kueijin_victory_objective_decision_effect_tooltip:1 "你将统一印度。之后你将会选择如何应对中原朝廷。"
 laibon_victory_objective_decision:0 "乌木国"
 laibon_victory_objective_decision_tooltip:1 "卡根的子嗣们总在内斗，这使得外国势力威胁着乌木国。"
 laibon_victory_objective_decision_desc:0 "非洲四分五裂，来自穆斯林世界的[cainites|E]们正在入侵我们的土地并将其据为己有。是时候将他们赶出去了。"
 laibon_victory_objective_decision_confirm:0 "我们保护了非洲。"
 laibon_victory_objective_decision_effect_tooltip:1 "您将统一乌木国，并获得如此成就带来的巨大声望。"
 restore_the_dream:0 "重建幻梦"
 restore_the_dream_tooltip:1 "只要还有一些吸血鬼相信它，幻梦仍能够涅槃重生。"
 restore_the_dream_desc:0 "1204年摧毁了无与伦比的乌托邦——君士坦丁堡的幻梦。对于[cainite|E]，这样的悲剧将会迎来一个可怕的黑暗时代，除非有人再次继承米迦勒的衣钵。"
 restore_the_dream_confirm:0 "过去如此，将来也会如此。"
 restore_the_dream_effect_tooltip:1 "你将创建幻梦帝国头衔。"
 restore_the_black_cross:0 "重建黑十字"
 restore_the_black_cross_tooltip:1 "德意志比以往更需要一个强大的梵卓领袖。"
 restore_the_black_cross_desc:0 "哈德施塔特的第一黑十字有缺点，但它仍然是梵卓的领导力证明，我们可以用它来合法化我们的统治。"
 restore_the_black_cross_confirm:0 "再一次立于十字架下。"
 restore_the_black_cross_effect_tooltip:1 "你将创建黑十字帝国头衔。"
 restore_the_voivodate:0 "重建军督领"
 restore_the_voivodate_tooltip:1 "棘秘魑皆桀骜不驯，必须由一位强人来领导。"
 restore_the_voivodate_desc:0 "作为一种政治工具，军督领一直备受争议。但这仍然是一个有声望的头衔，而且可以比以往任何时候都更强大。"
 restore_the_voivodate_confirm:0 "我们再一次进入这里。"
 restore_the_voivodate_effect_tooltip:1 "你将创建军督领帝国头衔。"
 restore_the_sea_of_shadows:0 "重建暗影之海"
 restore_the_sea_of_shadows_tooltip:1 "我们的始祖，勒森魃，需要一个强力的左膀右臂来协助他领导他的[clan|E]。"
 restore_the_sea_of_shadows_desc:0 "勒森魃国家一直都被蒙塔诺所领导，他们是勒森魃最忠诚的子嗣。但岁月变迁，一个新的适格者也可能走上前台。"
 restore_the_sea_of_shadows_confirm:0 "祖先，见证我的晋升！"
 restore_the_sea_of_shadows_effect_tooltip:1 "你将创建暗影之海帝国头衔。"
 restore_avalon:0 "重建阿瓦隆"
 restore_avalon_tooltip:1 "神国永不消亡。"
 restore_avalon_desc:0 "如你所知，密特拉更像是神而不是吸血鬼。无论他是否决定有一天回到他的追随者身边，你必须为他的追随者准备个凡人国家。"
 restore_avalon_confirm:0 "我们随时待命。"
 restore_avalon_effect_tooltip:1 "你将创建阿瓦隆帝国头衔。"
 restore_love:0 "重建爱之皇庭"
 restore_love_tooltip:1 "法兰西会是妥芮朵的，又或不会是"
 restore_love_desc:0 "爱之皇庭是妥芮朵母主在法兰西战胜梵卓的表现。这场宏大的政治和艺术冒险不能让它随着历史而腐烂。"
 restore_love_confirm:0 "毕竟爱是永恒的。"
 restore_love_effect_tooltip:1 "你将创建爱之皇庭帝国头衔。"
 restore_midgard:0 "重建米德加尔德"
 restore_midgard_tooltip:1 "奥丁仍在守护着我们。"
 restore_midgard_desc:0 "随着英灵战士在梵卓的入侵下分崩离析，米德加尔德承受了一次又一次的惨败。为了生存，他们需要一场大规模的反击和一位新的崇高之主。"
 restore_midgard_confirm:0 "诸神黄昏将择日再临。"
 restore_midgard_effect_tooltip:1 "你将创建米德加尔德帝国头衔。"
 restore_ashirra:0 "重建阿什拉派哈里发国"
 restore_ashirra_tooltip:1 "信士们需要一个家。"
 restore_ashirra_desc:0 "以吸血鬼的标准来看，[ashirra|E]哈里发国是一个新玩意儿。但其已获得了数百万人信仰的支持，不过即便如此，也需寻找合适良机才能再度崛起。"
 restore_ashirra_confirm:0 "真主至大！"
 restore_ashirra_effect_tooltip:1 "你将创建[ashirra|E]哈里发国帝国头衔。"
 restore_alamut:0 "重建鹰巢"
 restore_alamut_tooltip:1 "哈基姆的子嗣失去他们的家后是迷茫的。"
 restore_alamut_desc:0 "被誉为坚不可摧的鹰巢不仅仅是哈基姆派[clan|E]的堡垒。作为哈基姆意志和团结的政治象征，如果子嗣们想再次繁荣昌盛，它必须重回一体。"
 restore_alamut_confirm:0 "风向对我们有利。"
 restore_alamut_effect_tooltip:1 "你将建立鹰巢帝国头衔。"
 restore_giovanni:0 "重建家庭"
 restore_giovanni_tooltip:1 "家庭的起始阶段不会像预期般的一帆风顺。"
 restore_giovanni_desc:0 "乔凡尼遭受了挫折，但我们现在有了一个永恒的胜利。让我们从让家人团聚开始。"
 restore_giovanni_confirm:0 "完美的交易。"
 restore_giovanni_effect_tooltip:1 "你将创建乔凡尼王国头衔。"
 restore_ravnos:0 "重建氏族"
 restore_ravnos_tooltip:1 "永恒之战不容置疑。"
 restore_ravnos_desc:0 "我们已经失去了使雷伏诺[clan|E]统一的中心地带。我们的骄傲和精神受到了毁灭性的打击，我们必须尽快进行报复。"
 restore_ravnos_confirm:0 "战争还在继续。"
 restore_ravnos_effect_tooltip:1 "你将创建雷伏诺帝国头衔。"
 restore_setite:0 "重建氏族"
 restore_setite_tooltip:1 "神选之地必须由虔信者掌控。"
 restore_setite_desc:0 "埃及是我们[clan|E]和信仰的心脏地带。如果我们要将赛特的圣言传遍世界，我们必须首先确保对这里的统治。"
 restore_setite_confirm:0 "赞美赛特！"
 restore_setite_effect_tooltip:1 "你将创建赛特之子帝国头衔。"
 restore_talmahera:0 "重建塔尔玛埃拉"
 restore_talmahera_tooltip:1 "即使是以诺也必须站在大地上。"
 restore_talmahera_desc:0 "虽然我们仍然牢牢地统治着冥界，但切断我们与尘世的联系并不是一件好事。重新征服我们失去的要塞是首要任务。"
 restore_talmahera_confirm:0 "再一次打开大门。"
 restore_talmahera_effect_tooltip:1 "你将创建塔尔玛埃拉帝国头衔。"
 restore_obertus:0 "重建奥伯图斯教团"
 restore_obertus_tooltip:1 "君士坦丁堡的传承仍存于世。"
 restore_obertus_desc:0 "作为天国之道的追随者，我们不被棘秘魑[clan|E]的其他成员所信任。但我们可以恢复奥伯图斯教团，在这个艰难的时期给我们一些合法性。"
 restore_obertus_confirm:0 "为了圣子与圣父。"
 restore_obertus_effect_tooltip:1 "你将创建奥伯图斯王国头衔。"
 restore_moloch:0 "重建摩洛教团"
 restore_moloch_tooltip:1 "子嗣们必须被喂饱"
 restore_moloch_desc:0 "我们为了保护世界免受恶魔的伤害而进行的永恒之影战争进展不佳。如果我们要生存下去，我们必须再次团结在同一教团之下。"
 restore_moloch_confirm:0 "现在，前往深渊……"
 restore_moloch_effect_tooltip:1 "你将创建摩洛教团王国头衔。"
 restore_azaneal:0 "重建阿扎那利教团"
 restore_azaneal_tooltip:1 "我们仍可以打开深渊之门……"
 restore_azaneal_desc:0 "阿扎那利对巴力有一个愿景。尽管有一些挫折，我们仍然必须团结我们的同胞支持这一愿景，否则美好的结局永远不会到来。"
 restore_azaneal_confirm:0 "这是终局的开端。"
 restore_azaneal_effect_tooltip:1 "你将创建阿扎那利教团王国头衔。"
 restore_web:0 "重建刀锋之网"
 restore_web_tooltip:1 "我们还有很多耳目存在。"
 restore_web_desc:0 "为了乌尔·舒尔吉的回归必须做好准备。刀锋之网是我们控制哈基姆派[clan|E]的代理组织。它必须被重建。"
 restore_web_confirm:0 "现在，去占领鹰巢。"
 restore_web_effect_tooltip:1 "你将创建刀锋之网王国头衔。"
 restore_lost_tribe:0 "重建失落部族"
 restore_lost_tribe_tooltip:1 "阿诺什的愿景不止是一个领土。"
 restore_lost_tribe_desc:0 "如果我们要加速报复二代的任性的子嗣们，我们需要一个坚实的运作基础。达斯图尔·阿诺什的失落部族是完美的选择。"
 restore_lost_tribe_confirm:0 "去往以诺城……"
 restore_lost_tribe_effect_tooltip:1 "你将创建失落部族王国头衔。"
 restore_olives:0 "重建橄榄会议"
 restore_olives_tooltip:1 "萨洛比[clan|E]还未亡"
 restore_olives_desc:0 "魁维娅围绕十字军国家的最后一战值得称赞。如果我们要拯救萨洛比[clan|E]，我们可以注意她的方法。"
 restore_olives_confirm:0 "来吧，睿魔尔。"
 restore_olives_effect_tooltip:1 "你将创建橄榄会议王国头衔。"
 restore_see_of_nod:0 "重建挪得教区"
 restore_see_of_nod_tooltip:1 "虔信者需要一个教会。"
 restore_see_of_nod_desc:0 "该隐圣三一教会已经奄奄一息，到处都是无信者。要想显示信仰和武力，就必须夺回威尼斯大主教的席位。"
 restore_see_of_nod_confirm:0 "现在，传播给世界。"
 restore_see_of_nod_effect_tooltip:1 "你将创建挪得教区王国头衔。"
 restore_tremere:0 "重建睿魔尔"
 restore_tremere_tooltip:1 "每位魔法师都要学一课。"
 restore_tremere_desc:0 "我们的生存是不稳定的，敌人在向我们逼近，但睿魔尔若不坚强就什么也不是。如果需要的话，我们可以在任何地方重建[clan|E]权力中心。"
 restore_tremere_confirm:0 "准备好议会大厅。"
 restore_tremere_effect_tooltip:1 "你将创建睿魔尔家族帝国头衔。"
 restore_curtain:0 "重建暗影帷幕"
 restore_curtain_tooltip:1 "祖母需要帮助她的人。"
 restore_curtain_desc:0 "始祖的手下给了我们很深的打击。但是祖母还在沉眠，需要保护。我们决不能动摇。"
 restore_curtain_confirm:0 "安眠吧。"
 restore_curtain_effect_tooltip:1 "你将创建暗影帷幕帝国头衔。"
 restore_erciyes:0 "重建埃尔吉耶斯"
 restore_erciyes_tooltip:1 "先知之山是属于我们的"
 restore_erciyes_desc:0 "卡帕多修斯自己颁布法令，埃尔吉耶斯是[clan|E]的主要基础。我们必须团结起来，像首次那样征服它。"
 restore_erciyes_confirm:0 "这需要一些清理。"
 restore_erciyes_effect_tooltip:1 "你将创建埃尔吉耶斯王国头衔。"
 restore_crescent:0 "重建午夜新月"
 restore_crescent_tooltip:1 "伊比利亚尚未陷落。"
 restore_crescent_desc:0 "拜德尔试图阻止基督教再收复失地的努力并不顺利。但我们也许可以做得更好，再次团结伊比利亚南部的信徒们。"
 restore_crescent_confirm:0 "现在，放眼至北边……"
 restore_crescent_effect_tooltip:1 "你将创建午夜新月王国头衔。"
 restore_feral:0 "重建野者部族"
 restore_feral_tooltip:1 "我们应该再次团结！"
 restore_feral_desc:0 "许多冈格罗军阀试图通过外交手段或力量来团结[clan|E]。我们必须比他们做得更好，并要真正地成功。"
 restore_feral_confirm:0 "掠食开始。"
 restore_feral_effect_tooltip:1 "你将创建野者部族王国头衔。"
 restore_eastern:0 "重建东方领主"
 restore_eastern_tooltip:1 "带有匈牙利特征的梵卓。"
 restore_eastern_desc:0 "德意志东部的梵卓是一个罕见的品种，被人们以不信任的眼光看待。因此，他们应该像布尔斯库统治下的东方领主那样团结一致。"
 restore_eastern_confirm:0 "真正皇室回到了这片土地。"
 restore_eastern_effect_tooltip:1 "你将创建东方领主王国头衔。"
 restore_thunder:0 "重建无尽雷霆"
 restore_thunder_tooltip:1 "如果这个循环要继续下去，皇廷必须重建。"
 restore_thunder_desc:0 "无论是那些该隐人还是其他万鬼，我们总是处于寂灭边缘。但我们的信念极度坚定，皇朝将会再次崛起。"
 restore_thunder_confirm:0 "凤凰再次复活。"
 restore_thunder_effect_tooltip:1 "你将创建无尽雷霆帝国头衔。"
 restore_scarlet:0 "重建朱雀皇朝"
 restore_scarlet_tooltip:1 "朱雀皇朝掌握着万鬼在东南亚大部分地区的力量。"
 restore_scarlet_desc:0 "朱雀皇朝是一个强大的，但又有点局外的五大万鬼祖朝之一，对于任何野心勃勃的饿殍来说，朱雀皇朝都是一个合适的成就。"
 restore_scarlet_confirm:0 "朱雀重生。"
 restore_scarlet_effect_tooltip:1 "你将创建朱雀帝国头衔。"
 restore_celestial:0 "重建天之部族"
 restore_celestial_tooltip:1 "获取神格不是一项简单的任务。"
 restore_celestial_desc:0 "顽固不化的敬神者不受其他万鬼的欢迎，更不受该隐人的欢迎。因此，天之部族总是处于危险之中，但能够在任何地方苟活重建。"
 restore_celestial_confirm:0 "干预神的蝼蚁。"
 restore_celestial_effect_tooltip:1 "你将创建天之部族王国头衔。"
 restore_golden:0 "重建金十字"
 restore_golden_tooltip:1 "奥克西塔尼亚还不是法兰西的"
 restore_golden_desc:0 "反抗着巴黎爱之皇庭的暴政，金十字是奥克西塔尼亚的经历和独立的象征。一个我们可以使用的强大的口号。"
 restore_golden_confirm:0 "巴黎无法规定我们"
 restore_golden_effect_tooltip:1 "你将创建金十字王国头衔。"
 restore_grand:0 "重建大王庭"
 restore_grand_tooltip:1 "法兰西仍可以是我们的。"
 restore_grand_desc:0 "亚历山大的失误让梵卓[clan|E]失去了法兰西。但事情可以改变，我们可以重新成为这个强大王国的合法统治者。"
 restore_grand_confirm:0 "梵卓氏族的统治是无可争议的"
 restore_grand_effect_tooltip:1 "你将创建大王庭王国头衔。"
 restore_timisoara:0 "重建泰梅什巴纳特"
 restore_timisoara_tooltip:1 "东方迦太基。"
 restore_timisoara_desc:0 "多米尼克试图创建一个新的乌托邦，但又一次被邪恶的梵卓[clan|E]挫败。不过，他的想法还是有可取之处的，我们可以重整旗鼓，重新开始。"
 restore_timisoara_confirm:0 "充满希望的新开始。"
 restore_timisoara_effect_tooltip:1 "你将创建泰梅什巴纳特王国头衔。"
 restore_anda:0 "重建安答部族"
 restore_anda_tooltip:1 "马蹄之声现今仍闻。"
 restore_anda_desc:0 "安答面临着许多敌人，东边是记仇的万鬼，西边是敌对的冈格罗。但蒙古精神不是那么容易驯服的。部族将重新崛起。"
 restore_anda_confirm:0 "吾等再度跨上战马。"
 restore_anda_effect_tooltip:1 "你将创建安答部族帝国头衔。"
 ruler_exit_torpor:0 "从蛰眠醒来"
 ruler_exit_torpor_tooltip:1 "从蛰眠中苏醒不是一件容易的事情。"
 ruler_exit_torpor_desc:0 "任何称职的吸血鬼都有一个应急计划，以防自己不情愿地陷入[torpor|E]状态。既然你现在是其他吸血鬼名义上的统治者，这可能是启动应急计划的好时机。"
 ruler_exit_torpor_confirm:0 "我回来了。"
 restore_golconda:0 "重建戈尔康达"
 restore_golconda_tooltip:1 "扫罗的梦想永远不会真正消亡。"
 restore_golconda_desc:0 "戈尔康达是扫罗建立的与神圣境界同名的城市。对于任何想要加入他们始祖圣餐的萨洛比来说，这是最重要的。"
 restore_golconda_confirm:0 "又向启迪迈进了一步。"
 restore_golconda_effect_tooltip:1 "你将创建戈尔康达王国头衔。"
 restore_livonia:0 "重建利沃尼亚"
 restore_livonia_tooltip:1 "十字永远无法毁灭我们。"
 restore_livonia_desc:0 "几个世纪以来，兽性之道的信徒受到了十字的[cainites|E]骑士的压迫，在冈格罗喀喇的旗帜下团结了一段时间。这种抵抗精神仍然可以成为我们功业的强大资产。"
 restore_livonia_confirm:0 "寸步不让。"
 restore_livonia_effect_tooltip:1 "你将创建利沃尼亚野者王国头衔。"
 restore_reconquista:0 "重建勒森魃西班牙"
 restore_reconquista_tooltip:1 "伴随着信仰和暗影，我们将回归。"
 restore_reconquista_desc:0 "西班牙的勒森魃内战主要是一场政治事件，但它给[clan|E]的年轻成员带来了很多机会。通过利用它的遗产，我们将有望获得同样的回报。"
 restore_reconquista_confirm:0 "滚回你家去。"
 restore_reconquista_effect_tooltip:1 "你将创建暗影再征服王国头衔。"
