l_simp_chinese:
 building_type_blood_tax_01:0 "血税"
 building_type_blood_tax_01_desc:1 "#F 你正确保你的臣民们正在工作，直到他们咽下最后一口气。#!"
 building_blood_tax_01:0 "宽松的血税"
 building_blood_tax_01_desc:1 "你在这里公开向凡人们征税，但这不是促进当地经济繁荣的最合理计划。"
 building_blood_tax_02:0 "沉重的血税"
 building_blood_tax_02_desc:1 "在您的统治下凡人正在为钱流血。当然，在他们幸运的情况下。"
 building_blood_tax_03:0 "严荷的血税"
 building_blood_tax_03_desc:1 "你的金库正在迅速的被填充。毕竟你在统治一片贫瘠之地，谁在乎呢？"
 building_type_open_rule_01:0 "公开律法"
 building_type_open_rule_01_desc:1 "#F 没有你的坚定领导，无助的凡人没有任何益处。奇怪的是，他们似乎并不都赞同这个显而易见的事实。#!"
 building_open_rule_01:0 "强硬律法"
 building_open_rule_01_desc:1 "您是这片土地的主人，无论是对于吸血鬼还是其他种族。您是被敬畏的，但是反叛的声音开始增长了。"
 building_open_rule_02:0 "迫压律法"
 building_open_rule_02_desc:1 "凡人们坐等着每夜的一个处决。至少，在他们认为你听得到他们的时候……"
 building_open_rule_03:0 "暴政律法"
 building_open_rule_03_desc:1 "凡人是家畜，在你的恐惧和绝望的领地亦被视为此。他们会抓住任何机会来拯救自己。"
 building_type_forced_conscription_01:0 "强制征兵"
 building_type_forced_conscription_01_desc:1 "#F 你给了你领地所有人都有在你军队服务的荣誉。可惜的是，这会使你的仆从在管理郡县时超出他们实际的能力范畴。#!"
 building_forced_conscription_01:0 "小幅征兵效果"
 building_forced_conscription_01_desc:1 "你的一些人在外面，说服人们为你而死实际上是一件好事。"
 building_forced_conscription_02:0 "正规征兵效果"
 building_forced_conscription_02_desc:1 "在你的王国里，到处都是征兵中心，不参加是不可能的。"
 building_forced_conscription_03:0 "大规模征兵效果"
 building_forced_conscription_03_desc:1 "他们贡献服务并到时再死，但不是现在就死。"
 building_type_night_terror_01:0 "夜之猎手"
 building_type_night_terror_01_desc:1 "#F 带着你的仆群在晚上四处觅食是你的天性，你无法抗拒这种出门猎食猎物的渴望。#!"
 building_night_terror_01:0 "夜之畏惧"
 building_night_terror_01_desc:1 "当你屈服在你的欲望时，人们就会不断消失。你对省份的控制力降低了，但是你的仆群增多了。"
 building_night_terror_02:0 "夜之恐怖"
 building_night_terror_02_desc:1 "在频繁的掠食之间，你几乎无法恢复理智并统治自己的领土。"
 building_night_terror_03:0 "夜之惊骇"
 building_night_terror_03_desc:1 "你的仆群是唯一真理。其他人都是将被掠食的猎物。"
 building_type_influence_noble_01:0 "掌控贵族"
 building_type_influence_noble_01_desc:1 "#F 通过影响、勒索和诱惑，你可以密切关注这个国家的统治阶级。这样做会抑制其他凡人和黄金流动。#!"
 building_influence_noble_01:0 "轻微贵族掌控"
 building_influence_noble_01_desc:1 "这种程度的影响，已经开始破坏统治阶级的凝聚力，削弱他们的军事意识。\n这种程度需要25控制才能构建并保持启用。"
 building_influence_noble_02:0 "强烈贵族掌控"
 building_influence_noble_02_desc:1 "你对他们的控制越来越大，但从局外人的角度来看，事情开始恢复正常。\n这一程度需要50控制构建和保持启用。"
 building_influence_noble_03:0 "完全贵族掌控"
 building_influence_noble_03_desc:1 "统治阶级可能不知道，但他们现在是你的了，并且无人怀疑。\n此程度需要超过75控制才能构建并保持启用。"
 building_type_playing_courts_01:0 "掌控守夜人"
 building_type_playing_courts_01_desc:1 "#F 当地驻军对你的私人随从的训练和，嗯……供粮是很有帮助的。不过，你得动用一些关系来实现它#!"
 building_playing_courts_01:0 "轻微守夜人掌控"
 building_playing_courts_01_desc:1 "在大多数官员的鼻子底下，通过贿赂其他人，你的私人侍卫已经开始与当地民兵合作。\n此级别需要超过25控制才能构建并保持启用。"
 building_playing_courts_02:0 "强力守夜人掌控"
 building_playing_courts_02_desc:1 "您的手下现在是在当地人的帮助下保护城市的有价值的「雇佣公司」。双赢局面。至少对你来说。\n此级别需要超过50控制才能构建并保持启用。"
 building_playing_courts_03:0 "完全守夜人掌控"
 building_playing_courts_03_desc:1 "你再也不能把本地的人和你自己的人区分开了。无论如何，他们都以某种方式为你服务。\n此级别需要超过75控制才能构建并保持启用。"
 building_type_influence_underworld_01:0 "掌控黑社会"
 building_type_influence_underworld_01_desc:1 "#F 你可以从这个地区的亡命之徒身上榨取很多，无论是金钱还是精锐卫队的经验丰富的新兵。然而，煽动犯罪团伙也有其缺点。#!"
 building_influence_underworld_01:0 "轻微黑社会掌控"
 building_influence_underworld_01_desc:1 "帮助罪犯已经开始让你赚钱了。但这也激怒了当地的民众。\n此级别需要超过25控制才能构建并保持启用。"
 building_influence_underworld_02:0 "强烈黑社会掌控"
 building_influence_underworld_02_desc:1 "有了你的指路之手，你那帮恶棍制造的噪音越来越少，利润越来越多。\n此级别需要超过50控制才能构建并保持启用。"
 building_influence_underworld_03:0 "完全黑社会掌控"
 building_influence_underworld_03_desc:1 "你已经尽可能地抑制了你的亲信们最坏的本能。他们几乎和正规的战斗部队一样纪律严明。\n此级别需要超过75控制才能构建并保持启用。"
 building_type_influence_merchant_01:0 "掌控商人"
 building_type_influence_merchant_01_desc:1 "#F 商人很富有，而你需要黄金。这个等式很简单，但他们可能不会轻易给出来。#!"
 building_influence_merchant_01:0 "轻微商人掌控"
 building_influence_merchant_01_desc:1 "他们在抗拒，在抱怨，在挑起事端。但有些人已经开始支付给你完全合法的税。\n此级别需要超过25控制才能构建并保持启用。"
 building_influence_merchant_02:0 "强烈商人掌控"
 building_influence_merchant_02_desc:1 "大多数商人都被吓到了，持不同意见者也只能在小巷里交头接耳。\n此级别需要超过50控制才能构建并保持启用。"
 building_influence_merchant_03:0 "完全商人掌控"
 building_influence_merchant_03_desc:1 "你现在可以重新组合公会，展示你的增税计划，并仍然赢得雷鸣般的掌声。\n此级别需要超过75控制才能构建并保持启用。"
 building_type_prince_city_00:0 "亲王领"
 building_type_prince_city_00_desc:1 "#F 吸血鬼是城市居民。城市越大，吸血鬼就越令人恐惧，也越有声望。#!"
 building_prince_city_00:0 "城镇亲王"
 building_prince_city_00_desc:1 "你控制着一个人口稀少地区的首府。虽然不多，但总比没有好。"
 building_prince_city_005:0 "大城镇亲王"
 building_prince_city_005_desc:1 "你正在控制一个人口较少的地区首府。虽然不多，但总比没有好。\n这个级别需要超过5发展来构建并保持可用。"
 building_prince_city_01:0 "城市亲王"
 building_prince_city_01_desc:1 "你控制着整个小城市，或者一个大城市的一小部分。这只是第一步。\n这个级别需要超过10发展才能构建并保持可用。"
 building_prince_city_02:0 "郡城亲王"
 building_prince_city_02_desc:1 "你的宫廷受到尊敬和钦佩，因为你统治着这么多的凡人。\n这个级别需要超过20发展才能构建并保持可用。"
 building_prince_city_025:0 "大郡城亲王"
 building_prince_city_025_desc:1 "一个重要城市在你的掌控下，许多凡人都愿意或不愿意在这里受你的奴役。\n这个级别需要超过30发展才能构建并保持可用。"
 building_prince_city_03:0 "首都亲王"
 building_prince_city_03_desc:1 "凡人、国王和军阀居住在这个令人印象深刻的城市。你是他们的夜间伴侣。\n这个级别需要超过40发展才能建立并保持可用。"
 building_prince_city_04:0 "大都会亲王"
 building_prince_city_04_desc:1 "世界上最伟大的城市之一就生活在你的阴影之下。你的影响力在你的领域没有什么限制。\n这个级别需要超过60发展来构建并保持可用。"
 building_type_temple_set_01:0 "赛特神殿"
 building_type_temple_set_01_desc:1 "#F 你做梦也想不到的快乐就在这里。如果你愿意付出代价。#!"
 building_temple_set_01:0 "赛特神殿"
 building_temple_set_01_desc:1 "赛特的信仰有一种不可否认的诱惑力，使把你的灵魂卖给赛特信徒成为一种比拥有的任何其他权利都更诱人的前景。"
 building_type_devasthana_01:0 "控制印度庙"
 building_type_devasthana_01_desc:1 "#F 印度陷入了一场千年之久的圣战，以阻止阿修罗提伽耶。要赢得胜利，你需要信仰和坚不可摧的信念。#!"
 building_devasthana_01:0 "军事化印度庙"
 building_devasthana_01_desc:1 "在这里，在提婆的保护下，你会找到继续前行的力量。"
 building_type_brahmavihara_01:0 "婆罗门的导师"
 building_type_brahmavihara_01_desc:1 "#F 你的身体状况，虽然只是一段漫长旅程的一部分，却让你更难遵从佛陀的教诲。你可能需要一些帮助。#!"
 building_brahmavihara_01:0 "舍心"
 building_brahmavihara_01_desc:1 "在所有情况下保持中立是一个合适的测试。它是心灵平静和涅槃的途径。"
 building_type_low_war_01:0 "下位战争"
 building_type_low_war_01_desc:1 "#F 每时每刻都是战场，无论是政治上的还是现实上的。玉之战士时刻准备着。#!"
 building_low_war_01:0 "无尽下位战争"
 building_low_war_01_desc:1 "你总是在战斗，而休息是早已逝去的记忆。但是你的敌人也一样。"
 building_type_chantry_01:0 "礼拜堂"
 building_type_chantry_01_desc:1 "#F 一群法师的集会。经常发生无休止的阴谋诡计……直到一个共同的敌人出现。#!"
 building_chantry_01:0 "小礼拜堂"
 building_chantry_01_desc:1 "来自该地区的睿魔尔聚集在这里。这是一个结交朋友的好地方。同时也是一个找到敌人的更好的地方。"
 building_type_influence_the_tribes_01:0 "掌控部落"
 building_type_influence_the_tribes_01_desc:1 "#F 生活在穆斯林世界的边缘，许多部落的人可能对你有事业有用。#!"
 building_influence_the_tribes_01:0 "部落小掌控"
 building_influence_the_tribes_01_desc:1 "通过已经证明了你的价值和你的虔诚，你已经获得了相当数量的部落人的帮助。"
 building_type_underworld_portal_01:0 "通往冥界的门"
 building_type_underworld_portal_01_desc:1 "#F 作为少数了解冥界的吸血鬼之一，你可以利用它的专横的存在作为你的优势#!"
 building_underworld_portal_01:0 "通往冥界的通道"
 building_underworld_portal_01_desc:1 "鬼魂是饥肠辘辘的。环绕在你周围时，他们会更加渴望你敌人的心灵。"
 building_type_pairidaeza_01:0 "波斯庭院"
 building_type_pairidaeza_01_desc:1 "#F 这些花园是波斯祆教最伟大时代的遗留物，是吸血鬼坚持长期信仰的绿洲。#!"
 building_pairidaeza_01:0 "体面的波斯庭院"
 building_pairidaeza_01_desc:1 "一个休息和缅怀失去已久的黄金时代的地方。内心风暴之眼。"
 building_type_unending_party_01:0 "无尽派对"
 building_type_unending_party_01_desc:1 "#F 只有把每件事都推到极致，才能感受到生命的存在。一直都是。#!"
 building_unending_party_01:0 "年度派对"
 building_unending_party_01_desc:1 "有些客人永远都不想离开你的宴会。不过大多数人都做不到。"
 building_type_fallen_church_01:0 "堕落教堂"
 building_type_fallen_church_01_desc:1 "#F 你的灵魂早已迷失。所以，在这里，你要确保拯救每个人的灵魂。不管他们喜欢不喜欢#!"
 building_fallen_church_01:0 "堕落祭坛"
 building_fallen_church_01_desc:1 "这里听到了如此多的哭声，如此多的请求宽恕。而且，在最后，几乎没有救赎。"
 building_type_laboratory_01:0 "研究室"
 building_type_laboratory_01_desc:1 "#F 很多东西进入这里。一些离开。有些甚至成为整体的一部分。#!"
 building_laboratory_01:0 "血肉研究室"
 building_laboratory_01_desc:1 "在一件艺术品中，总能瞥见艺术家的身影。。有时，也有一些创造者的「朋友」。"
 building_type_mother_garden_01:0 "莉莉丝的花园"
 building_type_mother_garden_01_desc:1 "#F 真正的伊甸园只存在于第一个女人崇拜中，那个被亚当、该隐和上帝自己背叛的女人。#!"
 building_mother_garden_01:0 "「少女」的花园"
 building_mother_garden_01_desc:1 "作为「少女」，莉莉丝诱使其他人去发现隐藏在现实面纱背后的真相。"
 building_type_legacies_gathering_01:0 "遗世之流集会"
 building_type_legacies_gathering_01_desc:1 "#F 大多数时候，莱本喜欢在草率行动之前把事情商量一下。举办这样的聚会是一项享有声望的活动。#!"
 building_legacies_gathering_01:0 "大型集会"
 building_legacies_gathering_01_desc:1 "相当数量的宗族代表代表聚集在这里，讨论该地区和其他地区的未来。"
 building_type_throne_room_01:0 "王座室"
 building_type_throne_room_01_desc:1 "#F 不能从王座室的大小来判断一个统治者……但更大还是有帮助的。#!"
 building_throne_room_01:0 "体面的王座室"
 building_throne_room_01_desc:1 "在这里，人们做出了决定，策划了阴谋，做出了判断。希望是出于你。"
 building_type_influence_people_01:0 "掌控人群"
 building_type_influence_people_01_desc:1 "#F 从最好的到最坏的，人性就是一切。因此，你可以与社会的每一个层面相互纠缠，并从中学习。#!"
 building_influence_people_01:0 "人群大掌控"
 building_influence_people_01_desc:1 "每天晚上，通过与人类分享你的生活，你会学到更多东西。它提醒你怎样才能不变成怪物。"
 building_type_influence_clergy_01:0 "掌控神职"
 building_type_influence_clergy_01_desc:1 "#F 人性远非完美，但有些人对神的信仰不容忽视。你必须向这样的人学习。#!"
 building_influence_clergy_01:0 "神职大掌控"
 building_influence_clergy_01_desc:1 "你从圣人那里学到很多，从坏人那里学到更多。你只需要确保有时能理解其中的区别。"
 building_type_crypt_01:0 "墓穴"
 building_type_crypt_01_desc:1 "#F 你的工作需要适当的地点和用品。而且，最好是一个非常安静和隐蔽的地方，邻居们不会抱怨。#!"
 building_crypt_01:0 "大墓穴"
 building_crypt_01_desc:1 "独自在黑暗中，被尸体和腐烂的可憎之物包围。天堂的定义。"
 building_type_assassins_cell_01:0 "刺客之室"
 building_type_assassins_cell_01_desc:1 "#F 哈基姆之嗣在世界的每一个角落都有一个庞大的由探员，线人和其他有用的工具人组成的网络。#!"
 building_assassins_cell_01:0 "大型刺客之室"
 building_assassins_cell_01_desc:1 "哈基姆在这个地区的大量存在，让你有一些非常有用的准备为了你的更多…秘密的目的。"
 building_type_alamut_01:0 "鹰巢"
 building_type_alamut_01_desc:1 "#F 阿刹迈氏族可怕的隐形堡垒是由信仰、力量和谎言铸成的。#!"
 building_alamut_01:0 "分裂的鹰巢"
 building_alamut_01_desc:1 "与阿刹迈氏族一样，鹰巢内也被分为不同的种姓。修补这种分裂需要相当大的投资。"
 building_alamut_02:0 "恢复的鹰巢"
 building_alamut_02_desc:1 "尽管人们仍能听到和看到背后的激烈言辞和刀锋，但最严重的暴力爆发已被这些神圣的城墙排斥在外。"
 building_alamut_03:0 "阿拉穆特，鹰巢"
 building_alamut_03_desc:1 "至少在这里，阿刹迈氏族表现出了完美的凝聚力和对单一目标的奉献，使其成为一股可怕的力量。"
 building_type_rome_01:0 "罗马"
 building_type_rome_01_desc:1 "#F 罗马是该隐之子的中心，也是人类世界的中心。恢复它不死的伟大将是一个巨大的成就。#!"
 building_rome_01:0 "凡人的罗马"
 building_rome_01_desc:1 "神职人员在街道上徘徊，反对任何直接控制欧洲世界中心的企图。在这个阶段，罗马对他的主人来说是一个有声望的头衔，仅此而已。"
 building_rome_02:0 "分裂的罗马"
 building_rome_02_desc:1 "慢慢地，罗马的信仰被侵蚀，吸血鬼可以再次利用他们微妙的影响力为亲王谋利。"
 building_rome_03:0 "永恒罗马"
 building_rome_03_desc:1 "最后，罗马又回到了吸血鬼的手中。当该隐子嗣歌颂征服圣城的伟大统治者时，神职人员在黑暗中畏缩。"
 building_type_ceoris_01:0 "塞里奥斯大礼拜堂"
 building_type_ceoris_01_desc:1 "#F 睿魔尔的坚固堡垒是其大本营和学习中心。这是被围困的法师氏族最好的资产#!"
 building_ceoris_01:0 "分裂的塞里奥斯"
 building_ceoris_01_desc:1 "在教堂里有些睿魔尔仍然是凡人。他们怀疑那些诡计多舛的吸血鬼有奸诈行为，并且一直是议会计划的障碍。"
 building_ceoris_02:0 "掌控中的塞里奥斯"
 building_ceoris_02_desc:1 "随着他们的凡人同伴消失或被转化，睿魔尔家族们可以真正利用塞里奥斯的全部潜力。"
 building_ceoris_03:0 "无法攻取的塞里奥斯"
 building_ceoris_03_desc:1 "只要这个坚固的堡垒还在，睿魔尔氏族就不会倒下。换言之，至少从外部来看……"
 building_type_carthage_01:0 "迦太基"
 building_type_carthage_01_desc:1 "#F 布鲁赫氏族的梦想早已被复仇心切的梵卓埋葬。但是梦想真的会消亡吗？#!"
 building_carthage_01:0 "重建迦太基"
 building_carthage_01_desc:1 "重建特洛伊尔的城市将是一件代价高昂的事情，这是对世界的一个强有力的宣言。但回报和危险可能都是巨大的。"
 building_carthage_02:0 "新迦太基"
 building_carthage_02_desc:1 "罗马该隐之子最可怕的噩梦在你的领导下复活了。它不会再倒下。"
 building_carthage_03:0 "迦太基，布鲁赫之梦"
 building_carthage_03_desc:1 "一个启蒙的灯塔和一个人类与该隐之子之间合作的愿景在这里再次可见。"
 building_type_ombos_temple_01:0 "建立奥姆博斯神殿"
 building_type_ombos_temple_01_desc:1 "#F 作为赛特氏族奢华的核心，奥姆博斯据说也是赛特的最后安息之地。#!"
 building_ombos_temple_01:0 "失色的奥姆博斯"
 building_ombos_temple_01_desc:1 "最近，奥姆博斯被年轻的赛特族视为一个过去时代的遗迹，其合法性受到质疑。"
 building_ombos_temple_02:0 "恢复中的奥姆博斯"
 building_ombos_temple_02_desc:1 "改革和重建使寺庙重新站在了时代的前沿。"
 building_ombos_temple_03:0 "高耸的奥姆博斯"
 building_ombos_temple_03_desc:1 "作为整个宗教无可争议的中心，奥姆博斯是思想、礼拜和计谋的摇篮。一如既往。"
 building_type_erciyes_01:0 "埃尔吉耶斯"
 building_type_erciyes_01_desc:1 "#F 在古典时代，卡帕多西亚氏族从马尔卡维亚人手中夺走了山上的据点。从那时起，它就成为了学习和冥想的中心。#!"
 building_erciyes_01:0 "孤立的埃尔吉耶斯"
 building_erciyes_01_desc:1 "从各方面来看，埃尔吉耶斯都是一个完美的冥想场所。遗憾的是，它往往会让访客忽视来自外部的威胁。"
 building_erciyes_02:0 "开放的埃尔吉耶斯"
 building_erciyes_02_desc:1 "随着心态的改变和外部世界可以整理出通往堡垒的道路，埃尔吉耶斯成为一个世界性的学习中心。"
 building_erciyes_03:0 "埃尔吉耶斯，暗影修道院"
 building_erciyes_03_desc:1 "这座山堡既是一个休息的地方，也是整个氏族的中心，在它的城墙内可以看到连续的，但有控制的活动。"
 building_type_cathedral_of_flesh_01:0 "血肉大教堂"
 building_type_cathedral_of_flesh_01_desc:1 "#F 这完全令人憎恶的东西是几千年来由农民、奴隶、敌人、禽兽和许多其他受害者的血肉雕刻而成的，这些人被建在脉动、化脓的墙壁上。#!"
 building_cathedral_of_flesh_01:0 "怀敌意的大教堂"
 building_cathedral_of_flesh_01_desc:1 "受土地本身的污染，大教堂是任何入侵者的敌人，正如它是它的主人的敌人一样。输掉这场战斗意味着要成为其中的一部分。"
 building_cathedral_of_flesh_02:0 "沸腾的大教堂"
 building_cathedral_of_flesh_02_desc:1 "库帕拉的影响随着怪物开始服从它的主人而逐渐减弱。"
 building_cathedral_of_flesh_03:0 "可欺的大教堂"
 building_cathedral_of_flesh_03_desc:1 "库帕拉似乎暂时离开了。大教堂已经成为任何一个疯狂的库都术士都梦想着使用的极度可怕的工具。"
 building_type_castel_del_ombro_01:0 "暗影之堡"
 building_type_castel_del_ombro_01_desc:1 "#F 从远处是不可能分辨墙壁是由什么构成的，因为动态的阴影在几乎看不见的潮起潮落中爬过每一个表面。每天晚上日落后，潮水般的阴影从城堡深处升起，环绕城堡呈螺旋形，午夜过后，阴影会逆转并逐渐消失。#!"
 building_castel_del_ombro_01:0 "暗影之墓"
 building_castel_del_ombro_01_desc:1 "作为上古耆宿的安息地，这座城堡是一个可怕的地方，提醒着人们在每一个勒森魃周围都有不自然的空气。"
 building_castel_del_ombro_02:0 "暗影之堡"
 building_castel_del_ombro_02_desc:1 "作为血族皇庭的中心，城堡是氏族长者的司法工具。"
 building_castel_del_ombro_03:0 "开放城堡"
 building_castel_del_ombro_03_desc:1 "城门的开启意味着勒森魃自己已经离开了城堡。在这段时间里，它周围的疯狂气氛稍稍消退，让这个地方成为氏族的政治中心。"
 building_type_rabble_thugs_01:0 "暴民和恶棍"
 building_type_rabble_thugs_01_desc:1 "#F 有时，你必须忘记你的自尊并接触一些讨厌的人，以得到一些急需的支援。#!"
 building_rabble_thugs_01:0 "征召卑贱之人"
 building_rabble_thugs_01_desc:1 "很多人是不会被任何人错过的。他们是那种你可以用来快速创建一支战斗力的人。"
 building_rabble_thugs_02:0 "征召暴民"
 building_rabble_thugs_02_desc:1 "街头的乌合之众在夜晚的战场上毫无用处。但有时候，你不能太挑剔。\n这个级别需要超过5个开发度来构建并保持可用。"
 building_rabble_thugs_03:0 "征召不法之徒"
 building_rabble_thugs_03_desc:1 "罪犯数量众多，至少有一点战斗经验，是很好的素材。\n这个级别需要超过15开发度才能构建并保持可用。"
 building_type_sherwood_01:0 "舍伍德森林"
 building_type_sherwood_01_desc:1 "#F 愤怒运动就是在这里诞生的，并将繁荣几个世纪。这是避开了夜晚的暴君辛苦挣来的喘息之机。#!"
 building_sherwood_01:0 "掌控中的舍伍德"
 building_sherwood_01_desc:1 "罗宾·李兰德把舍伍德从密特拉的鼻子底下拽了出来，掌握了好几个世纪。这一对抗老暴君的大胆成就激励着愤怒的人们聚集起来，为这个事业更加努力地战斗。"
 building_sherwood_02:0 "扩展中的舍伍德"
 building_sherwood_02_desc:1 "舍伍德的自由男女现在在森林外战斗，这让罗宾为他的学生感到骄傲。"
 building_sherwood_03:0 "功成名就的舍伍德"
 building_sherwood_03_desc:1 "只要一提到舍伍德的勇敢捍卫者、暴君的歼灭者和自由的勇士，就会令暴君们胆战心惊。"
 building_type_vigiles_francia_01:0 "法兰克巡夜人"
 building_type_vigiles_francia_01_desc:1 "#F 由萨利安娜成立的一个特殊的精锐军团，巡夜人是一群忠诚的骑士，包括该隐之子和血仆，为他们的领主巡游领土。#!"
 building_vigiles_francia_01:0 "法兰克巡夜人：被动"
 building_vigiles_francia_01_desc:1 "法兰克巡夜人，由妥瑞朵骑士和血仆组成的精锐军团，随时准备回应对法兰克统治者的任何威胁。"
 building_vigiles_francia_02:0 "法兰克巡夜人：主动"
 building_vigiles_francia_02_desc:1 "在任何潜在的麻烦制造者到达之前，这些巡夜人就已经开始着手寻找他们，以改善他们对这片土地的控制。"
 building_vigiles_francia_03:0 "法兰克巡夜人：无所不在"
 building_vigiles_francia_03_desc:1 "这支日益壮大的部队理想化了骑士守则，现在守夜者是法兰克该隐之子君主的主要资源。"
 building_type_inquisition_fortress_01:0 "宗教裁判堡垒"
 building_type_inquisition_fortress_01_desc:1 "#F 在这里，勇敢的男男女女们与黑暗抗争。#!"
 building_inquisition_fortress_01:0 "宗教裁判城寨"
 building_inquisition_fortress_01_desc:1 "他们的人数可能很少，他们的防御可能是微不足道的，但他们的心会看到圣殿的光。"
 building_inquisition_fortress_02:0 "宗教裁判要塞"
 building_inquisition_fortress_02_desc:1 "在这里，世界的一小部分被善良的力量重新征服了。"
 building_inquisition_fortress_03:0 "宗教裁判大要塞"
 building_inquisition_fortress_03_desc:1 "看看这个由光明、地狱和绝望组成的坚不可摧的堡垒吧。"
 building_type_shrine_of_telyavel_01:0 "特亚维神龛"
 building_type_shrine_of_telyavel_01_desc:1 "#F 工匠之神对凡类或超凡的事物不感兴趣。除非付出相应的代价……#!"
 building_shrine_of_telyavel_01:0 "象征性的特亚维神龛"
 building_shrine_of_telyavel_01_desc:1 "即使没有神的祝福，这座神龛仍然是一个垂死的原始教徒世界的强大呼声。"
 building_shrine_of_telyavel_02:0 "觉醒的特亚维神龛"
 building_shrine_of_telyavel_02_desc:1 "铁匠之神注视着他的信徒，被他们的重新承诺所吸引。"
 building_shrine_of_telyavel_03:0 "暗影之林"
 building_shrine_of_telyavel_03_desc:1 "现在此处已与神的国度直接相连，许多勇士来到这里寻求神圣祝福。"
 building_type_giovanni_mausoleum_01:0 "乔万尼陵墓"
 building_type_giovanni_mausoleum_01_desc:1 "#F 有很多人进入这里。但很少有人离开。#!"
 building_giovanni_mausoleum_01:0 "狭小的乔万尼陵墓"
 building_giovanni_mausoleum_01_desc:1 "乔凡尼家庭作为夜之眷族来说还很年轻，但他们仍然非常专注于对死亡和灵魂的研究。"
 building_giovanni_mausoleum_02:0 "体面的乔万尼陵墓"
 building_giovanni_mausoleum_02_desc:1 "慢慢的，亡灵术师们将他们的注意力放到了外界，对于新的环境给他们带来的机会很感兴趣。"
 building_giovanni_mausoleum_03:0 "宏伟的乔万尼陵墓"
 building_giovanni_mausoleum_03_desc:1 "意大利人现在是一股不可忽视的力量。他们仍然是强大的亡灵术师，但也有能力参与政治游戏。"
 building_type_pit_of_malkav_01:0 "末卡维地穴"
 building_type_pit_of_malkav_01_desc:1 "#F 耶路撒冷的地下有个裂口。仅仅靠近就会让人感到痛苦。你的头感觉就要爆炸了。#!"
 building_pit_of_malkav_01:0 "开放的末卡维地穴"
 building_pit_of_malkav_01_desc:1 "如此之多的声音说出了如此之多矛盾的事情……即使是你也可以瞥见其中一些微弱的智慧。"
 building_pit_of_malkav_02:0 "隐藏的末卡维地穴"
 building_pit_of_malkav_02_desc:1 "您已经将石头扔进了坑中，现在这声音不再那么疯狂。 你将能够更好地理解它们。"
 building_pit_of_malkav_03:0 "关闭的末卡维地穴"
 building_pit_of_malkav_03_desc:1 "现在声音安静了不少，除非你非常靠近裂口。 您现在靠近它可以轻松地将疯狂的声音从智慧之声中分辨出来。"
 building_type_well_of_sacrifice_01:0 "牺牲之井"
 building_type_well_of_sacrifice_01_desc:1 "#F 地狱就在地球上，它就在这里。#!"
 building_well_of_sacrifice_01:0 "小牺牲之井"
 building_well_of_sacrifice_01_desc:1 "扔进井里后，他们就停止了哭泣。这让你不快。"
 building_well_of_sacrifice_02:0 "大牺牲之井"
 building_well_of_sacrifice_02_desc:1 "还有非常多的人需要感受永恒的空虚和无尽的饥饿。"
 building_well_of_sacrifice_03:0 "地狱牺牲之井"
 building_well_of_sacrifice_03_desc:1 "他们很快就会醒来。他们很快就会来。到那时，一切都会明白。"
 building_type_london_mithraeum_01:0 "伦敦密特拉神圣所"
 building_type_london_mithraeum_01_desc:1 "#F 密特拉教信仰最古老神殿之一，至今仍为太阳神的追随者所关注。#!"
 building_london_mithraeum_01:0 "隐蔽的密特拉神圣所"
 building_london_mithraeum_01_desc:1 "因为惧怕十字架，信徒们聚集在从前荣耀的阴影里。"
 building_london_mithraeum_02:0 "复苏的密特拉神圣所"
 building_london_mithraeum_02_desc:1 "密特拉的信徒在这里祈祷，寻求光明之神所承诺的救恩，这现在是一个公开的秘密。"
 building_london_mithraeum_03:0 "狂欢的密特拉神圣所"
 building_london_mithraeum_03_desc:1 "现在是轮到十字架躲藏的时候了，因为这片土地的真正信仰已经回归！"
 building_type_influence_law_01:0 "掌控立法者"
 building_type_influence_law_01_desc:1 "#F Obviously, you are above mortal law. But having your agents inside the forces keeping the public order in this county could be beneficial.#!"
 building_influence_law_01:0 "轻微立法者掌控"
 building_influence_law_01_desc:1 "A suggestion here and there in the right ear can go a long way to keep the common folk appeased."
 building_influence_law_02:0 "强烈立法者掌控"
 building_influence_law_02_desc:1 "You have a strong pull on the judiciary system here. Strong enough to be useable in many ways."
 building_influence_law_03:0 "完全立法者掌控"
 building_influence_law_03_desc:1 "You guessed it : at this stage, you are the law."
 building_type_haven_defenses_01:0 "避难所防御"
 building_type_haven_defenses_01_desc:1 "#F It's not mere paranoia, your enemies will come for you one night. And you better have a contingency plan when that happens.#!"
 building_haven_defenses_01:0 "轻度避难所防御"
 building_haven_defenses_01_desc:1 "Some traps and reliable agents dispersed across the county are a good start to any strong defense."
 building_haven_defenses_02:0 "重度避难所防御"
 building_haven_defenses_02_desc:1 "You are prepared for the worst to come, your contingency plan has a contingency plan of its own."
 building_haven_defenses_03:0 "极度避难所防御"
 building_haven_defenses_03_desc:1 "They will have to bring an entire raiding party to bring you down!"
 building_type_remote_haven_01:0 "偏远避难所"
 building_type_remote_haven_01_desc:1 "#F Sometimes, you have just to take a step back to plan your next move, far away from prying eyes.#!"
 building_remote_haven_01:0 "空荡的偏远避难所"
 building_remote_haven_01_desc:1 "This haven is far away from every hint of civilization. That's probably its only perk."
 building_remote_haven_02:0 "舒适的偏远避难所"
 building_remote_haven_02_desc:1 "This isn't your court, but still good enough for a short vacation."
 building_remote_haven_03:0 "奢华的偏远避难所"
 building_remote_haven_03_desc:1 "Your home away from home, perfectly safe and suitably prepared for your exquisite tastes."
 building_type_mercenary_company_01:0 "掌控佣兵"
 building_type_mercenary_company_01_desc:1 "#F Mortals have developed the idea of \"Mercenaries\", experienced soldiers for hire. It's certainly something you can use for your own benefit.#!"
 building_mercenary_company_01:0 "轻微佣兵掌控"
 building_mercenary_company_01_desc:1 "You have some connections among a local group. Enough to give you some options."
 building_mercenary_company_02:0 "强烈佣兵掌控"
 building_mercenary_company_02_desc:1 "You can count on a seasoned group of mortal soldiers to defend your interests in this area."
 building_mercenary_company_03:0 "完全佣兵掌控"
 building_mercenary_company_03_desc:1 "The mercenaries here are now your private defense army."
 building_type_influence_barracks_01:0 "掌控兵营"
 building_type_influence_barracks_01_desc:1 "#F Professional armies are making a comeback in mortal society. A rare opportunity for Cainites to influence some seasoned warriors to their cause.#!"
 building_influence_barracks_01:0 "轻微兵营掌控"
 building_influence_barracks_01_desc:1 "Some of the soldiers in the area are on your payroll. They make for useful allies in dire times."
 building_influence_barracks_02:0 "强烈兵营掌控"
 building_influence_barracks_02_desc:1 "Most of the regional army know your name, or work for someone who does."
 building_influence_barracks_03:0 "完全兵营掌控"
 building_influence_barracks_03_desc:1 "The local army knows who is their true master. And it's certainly not some pompous local noble."
 building_type_influence_burghers_01:0 "掌控市民"
 building_type_influence_burghers_01_desc:1 "#F A new social class is emerging in the mortal world. These 'burghers' have plentiful money but few actual military power. A perfect target for your shadowy dealings.#!"
 building_influence_burghers_01:0 "轻微市民掌控"
 building_influence_burghers_01_desc:1 "You have made some initial forays into the merchant class of this area.\nThis level requires more than 10 development to build and stay enabled."
 building_influence_burghers_02:0 "强烈市民掌控"
 building_influence_burghers_02_desc:1 "As a shadowy patron to some of the most rich merchants in this area, you are making considerable profits out of it.\nThis level requires more than 15 development to build and stay enabled."
 building_influence_burghers_03:0 "完全市民掌控"
 building_influence_burghers_03_desc:1 "The money flows in one direction only here, into your pockets.\nThis level requires more than 20 development to build and stay enabled."
 building_type_oculi_cell_01:0 "神眼之室"
 building_type_oculi_cell_01_desc:1 "#F The watchful eye of the Inquisition is never asleep.#!"
 building_oculi_cell_01:0 "小神眼之室"
 building_oculi_cell_01_desc:1 "They know your enemies' secrets... and your friends' too."
 building_oculi_cell_02:0 "大神眼之室"
 building_oculi_cell_02_desc:1 "You don't see them, but they see you."
 building_oculi_cell_03:0 "强力的神眼之室"
 building_oculi_cell_03_desc:1 "牠能看到……一切！"
 building_type_knights_patrol_01:0 "亚克骑士厅"
 building_type_knights_patrol_01_desc:1 "#F The faithful Sword of God is patrolling the streets, a reassuring presence for the innocents.#!"
 building_knights_patrol_01:0 "小亚克骑士厅"
 building_knights_patrol_01_desc:1 "A band of Knights train and patrol here, their bravery compensating their small number."
 building_knights_patrol_02:0 "大亚克骑士厅"
 building_knights_patrol_02_desc:1 "The populace is emboldened by the vision of the faithful soldiers of Christ training here."
 building_knights_patrol_03:0 "强力的亚克骑士厅"
 building_knights_patrol_03_desc:1 "Ready to strike at a moment notice, the Knights' presence in this province is without weakness."
 building_type_fortress_cross_01:0 "十字要塞"
 building_type_fortress_cross_01_desc:1 "#F The heavily fortified mother-house of the Knights of Acre is perhaps the most impressive stronghold of the Inquisition.#!"
 building_fortress_cross_01:0 "孤立的十字要塞"
 building_fortress_cross_01_desc:1 "Imposing, the headquarter of the Knights of Acre still lacks the political power of some other holy places of the Inquisition."
 building_fortress_cross_02:0 "熙攘的十字要塞"
 building_fortress_cross_02_desc:1 "Renowned as an important pilgrimage site for all aspiring Inquisitors, the Fortress is now the training center of the elite."
 building_fortress_cross_03:0 "真十字要塞"
 building_fortress_cross_03_desc:1 "With the fragment of the True Cross blessing its walls, the Fortress is now an indomitable beacon of light."
 building_type_st_scholastica_01:0 "圣思嘉"
 building_type_st_scholastica_01_desc:1 "#F The second most important patron Saint of the Red Order was the twin sister of St Benedict, a determined but pious woman.#!"
 building_st_scholastica_01:0 "圣思嘉修道院"
 building_st_scholastica_01_desc:1 "The most important convent of the Red Sisters is a strange place where the sisters are allowed way more freedom than most of their clerical brethren."
 building_st_scholastica_02:0 "圣思嘉图书馆"
 building_st_scholastica_02_desc:1 "One of the largest library available to the Inquisition, it also houses a collection of forbidden lore. Only the most pious Sisters can access it."
 building_st_scholastica_03:0 "圣思嘉圣物室"
 building_st_scholastica_03_desc:1 "To fight the Enemy, the Red Order doesn't shy away from unusual methods. It is here that they found their most formidable weapons."
 building_type_castle_von_murnau_01:0 "穆尔瑙的城堡"
 building_type_castle_von_murnau_01_desc:1 "#F The ancestral home of the famous family of Inquisitors. A place of worship and warfare.#!"
 building_castle_von_murnau_01:0 "穆尔瑙的庄园"
 building_castle_von_murnau_01_desc:1 "Luxurious and well connected, the manor is well integrated into the complex German nobility landscape."
 building_castle_von_murnau_02:0 "穆尔瑙的城堡"
 building_castle_von_murnau_02_desc:1 "With a wing reserved for the Inquisition affairs, Castle von Murnau has become an important resting place for traveling hunters."
 building_castle_von_murnau_03:0 "穆尔瑙的堡垒"
 building_castle_von_murnau_03_desc:1 "Ready to defend itself against any threats, the fortress stands defiant against the minions of darkness. Testament to a family's curse and blessing alike."
 building_type_the_nest_01:0 "The Nest"
 building_type_the_nest_01_desc:1 "#F Rodrigue's paranoia has build this maze of tunnels under Pamplona, hoping to use it as a surprise effect against the cursed bloodsuckers.#!"
 building_the_nest_01:0 "Small Nest"
 building_the_nest_01_desc:1 "Well built, but still small, the Nest primarily serves as a secure way to share information for the Knights of St-James."
 building_the_nest_02:0 "Large Nest"
 building_the_nest_02_desc:1 "Encompassing most of Pamplona, Rodrigue's network of tunnels and spies is now a formidable asset for the Iberian Inquisition."
 building_the_nest_03:0 "Formidable Nest"
 building_the_nest_03_desc:1 "Any foe of St-James that enters Pamplona is very unlikely to make it out alive. Rodrigue's network is now prepared to handle anything."
 building_type_st_cecila_01:0 "圣则济利亚修道院"
 building_type_st_cecila_01_desc:1 "#F The training headquarter of the Sisters of St-John is a place of quiet and contemplation in a ocean of maddening visions.#!"
 building_st_cecila_01:0 "圣则济利亚医院"
 building_st_cecila_01_desc:1 "Any Inquisitor wounded in the British Isles knows and thanks the knowledgeable Sisters present here for their care."
 building_st_cecila_02:0 "圣则济利亚驱魔院"
 building_st_cecila_02_desc:1 "The most skilled exorcists of the Inquisition are trained in St-Cecilia. No otherworldly spirit can resist their call, be it of peace or war."
 building_st_cecila_03:0 "圣则济利亚宗教裁判院"
 building_st_cecila_03_desc:1 "The Sisters are women of peace, but they know the Enemy isn't. The few that choose to dedicate their life to war are of formidable mind and piety."
 building_type_everard_players_01:0 "Everard's Players"
 building_type_everard_players_01_desc:1 "#F The famous troupe of artists under Everard d'Arras is actually one of the most important assets of the Oculi Dei, the spies of the Inquisition.#!"
 building_everard_players_01:0 "Le Courtois d'Arras"
 building_everard_players_01_desc:1 "One of Jean Bodel's play is a variation on the Biblical tale of the Prodigal Son."
 building_everard_players_02:0 "Play of St. Nicholas"
 building_everard_players_02_desc:1 "Where a pious Saint is entrusted with the gold of Pagan King."
 building_everard_players_03:0 "Gerner's Faithful"
 building_everard_players_03_desc:1 "The troupe is actually secretly protected by the Sword of St. James knights. Such a powerful boon has often helped the actors escape their most fervent critics."
 building_type_ipeasants_01:0 "Control the Farmlands"
 building_type_ipeasants_01_desc:1 "#F The honest, God-fearing people toiling in the fields are the backbone of this realm and our struggle.#!"
 building_ipeasants_01:0 "Preach to Peasants"
 building_ipeasants_01_desc:1 "The serfs are easily impressed by those of higher classes, sending our agents among them is sure to garner their support"
 building_ipeasants_02:0 "Radicalize the Peasants"
 building_ipeasants_02_desc:1 "The countryfolk are fearful, but empowered by our zeal, they can be turned into loyal allies to our cause.\nThis level requires more than 5 development to build and stay enabled."
 building_ipeasants_03:0 "Form Peasant Militias"
 building_ipeasants_03_desc:1 "Properly agitated against forces of darkness, the people of the farmlands can be turned into an organized force subject to our authority.\nThis level requires more than 10 development to build and stay enabled."
 building_ipeasants_04:0 "Summer. Harvest. War."
 building_ipeasants_04_desc:1 "The hearts of the peasantry are burning hot with righteous fury. They are God's angry flock and we are their shepherds.\nThis level requires more than 25 development to build and stay enabled."
 building_type_ieducation_01:0 "Control Religious Education"
 building_type_ieducation_01_desc:1 "#F By aiding the effort to teach the locals the word of God, we can help them become more pious, literate and sympathetic to our efforts.#!"
 building_ieducation_01:0 "Fund Sunday Schools"
 building_ieducation_01_desc:1 "The children of the common folk need to be aware of the importance of our mission, if not its exact nature."
 building_ieducation_02:0 "Fund the Seminary"
 building_ieducation_02_desc:1 "Under our subtle guidance the future generations of priests educated here will be ripe for recruitment to our cause. \nThis level requires more than 10 development to build and stay enabled."
 building_ieducation_03:0 "Fund the Theological University"
 building_ieducation_03_desc:1 "This is where the scholars of the Church shape its future. Our influence will ensure our key part in it.\nThis level requires more than 20 development to build and stay enabled."
 building_ieducation_04:0 "Weaponized Theology"
 building_ieducation_04_desc:1 "Thanks to total control over all matters pertaining to religious teaching, the very definitions of good and evil are tailored to our needs.\nThis level requires more than 30 development to build and stay enabled."
 building_type_ioutskirts_01:0 "Control the Outskirts"
 building_type_ioutskirts_01_desc:1 "#F Once tamed, the local wilderness can shroud our movements, not our enemies#!"
 building_ioutskirts_01:0 "Access Ruler's Forests"
 building_ioutskirts_01_desc:1 "The hunting grounds are exclusive property of the ruling family, petitioning for access will let us patrol them and meet the tresspassers"
 building_ioutskirts_02:0 "Arrange Pardons for Poachers"
 building_ioutskirts_02_desc:1 "The forests are home to poachers, outlaws not by choice, but necessity. Their expertise of the terrain makes it worth winning their loyalty.\nThis level requires more than 5 development to build and stay enabled."
 building_ioutskirts_03:0 "Securing Hunting Rights"
 building_ioutskirts_03_desc:1 "With bribery, threat and appeal to higher authority, we can wrestle official control of the forests away from the local ruler.\nThis level requires more than 10 development to build and stay enabled."
 building_ioutskirts_04:0 "Lord's Woods"
 building_ioutskirts_04_desc:1 "There is no single hunter, herbalist, berry picker or hermit living in the local wilderness who doesn't double as our agent.\nThis level requires more than 25 development to build and stay enabled."
 building_type_itownsfolk_01:0 "Control the Townsfolk"
 building_type_itownsfolk_01_desc:1 "#F Here people congregate and money changes hands, our cause requires both. #!"
 building_itownsfolk_01:0 "Street Preachers"
 building_itownsfolk_01_desc:1 "Where people at least pretend to be decent, preaching against sin and debauchery is bound to fall on more or less palpably sympathetic ears."
 building_itownsfolk_02:0 "Indulgences for Merchants"
 building_itownsfolk_02_desc:1 "Forgiveness of the Church doesn't come cheap. We have the means to make it cheaper and the merchants appreciate a good deal.\nThis level requires more than 10 development to build and stay enabled."
 building_itownsfolk_03:0 "Recruiting Guild Leadership"
 building_itownsfolk_03_desc:1 "If not by appeals to faith, then by promises of connections, the leaders of the craftsmen can be made into valuable agents.\nThis level requires more than 15 development to build and stay enabled."
 building_itownsfolk_04:0 "Holy Enterprise"
 building_itownsfolk_04_desc:1 "The merchants and craftsmen of this town have gotten a whole lot more pious since the day we arrived. It almost seems like there is no place here for the not-so-devout to do business.\nThis level requires more than 30 development to build and stay enabled."
 building_type_iunderworld_01:0 "Control the Underworld"
 building_type_iunderworld_01_desc:1 "#F The realm of shadows is where our enemies dwell. Cooperation with its mortal denizens is unseemly, but neccessary. #!"
 building_iunderworld_01:0 "Aid the Beggars and Urchins"
 building_iunderworld_01_desc:1 "The proper folk avert their gaze from the wretched. That's a part of what makes them invaluable assets."
 building_iunderworld_02:0 "Convert Common Criminals"
 building_iunderworld_02_desc:1 "Society has closed its doors on these thugs, thieves and swindlers, but we still have a use for them.\nThis level requires more than 10 development to build and stay enabled."
 building_iunderworld_03:0 "Infiltrating Organized Crime"
 building_iunderworld_03_desc:1 "Deals with the upper echelon of the criminal society are bound to compromise us, but their fruits may very well be worth it.\nThis level requires more than 15 development to build and stay enabled."
 building_iunderworld_04:0 "Sanctioned Vice"
 building_iunderworld_04_desc:1 "Men are sinful and it is not our priority to put those who make a living off of that fact out of work. As long as they contribute to the cause.\nThis level requires more than 30 development to build and stay enabled."
 building_type_igarrison_01:0 "Controlling the Garrison"
 building_type_igarrison_01_desc:1 "The armed men of this settlement are on the lookout for their lord's enemies. We can divert their attention to those more sinister.#!"
 building_igarrison_01:0 "Aid the Night Watch"
 building_igarrison_01_desc:1 "A watchman's work is never over, the help of our agents will be greatly appreciated."
 building_igarrison_02:0 "Recruit Garrison Officers"
 building_igarrison_02_desc:1 "Good soldiers don't ask questions when given orders by their officers. That makes the latter essential to our cause.\nThis level requires more than 5 development to build and stay enabled."
 building_igarrison_03:0 "Covert Garrison Control"
 building_igarrison_03_desc:1 "By any means available we will secure obedience of the highest ranking commanders of this garrison.\nThis level requires more than 10 development to build and stay enabled."
 building_igarrison_04:0 "Bastion of the Faithful"
 building_igarrison_04_desc:1 "Soldiers of all rank stationed in this city bow to our representatives, filled with pride of their holy task of protecting them.\nThis level requires more than 30 development to build and stay enabled."
 building_type_inquisition_church_01:0 "Church of the Inquisition"
 building_type_inquisition_church_01_desc:1 "#F The faithful need a gathering place free of the leeches' influence, our brothers and sisters, a place to contemplate.#!"
 building_inquisition_church_01:0 "Chapel of the Inquisition"
 building_inquisition_church_01_desc:1 "A small, peaceful, place protected by the Knights of God. An oasis in a desert."
 building_inquisition_church_02:0 "Church of the Inquisition"
 building_inquisition_church_02_desc:1 "Here, the corrupting influence of the vampires is kept at bay."
 building_inquisition_church_03:0 "Cathedral of the Inquisition"
 building_inquisition_church_03_desc:1 "A beacon of light in a world of darkness. The first of many, hopefully.\nThis level requires more than 20 development to build and stay enabled."
 building_inquisition_church_04:0 "Archcathedral of the Inquisition"
 building_inquisition_church_04_desc:1 "A monument to our devotion, it towers over the land as a challenge to the forces of evil.\nThis level requires more than 25 development to build and stay enabled."
 building_type_inquisition_office_01:0 "Office of the Inquisition"
 building_type_inquisition_office_01_desc:1 "#F A place to conduct our administration away from the prying eyes.#!"
 building_inquisition_office_01:0 "Office Cellar"
 building_inquisition_office_01_desc:1 "A well-hidden space to store and process our documents."
 building_inquisition_office_02:0 "Remote Office"
 building_inquisition_office_02_desc:1 "A modest townhouse where we can coordinate our efforts without attracting much attention."
 building_inquisition_office_03:0 "Office Building"
 building_inquisition_office_03_desc:1 "An impressive office building in the town's bussiest disctrict where its richest and most influential denizens come to do business.\nThis level requires more than 20 development to build and stay enabled."
 building_inquisition_office_04:0 "Office Quarter"
 building_inquisition_office_04_desc:1 "A section of the city exclusive to our brothers and sisters. It leaves no doubt about our grip on local and regional affairs.\nThis level requires more than 25 development to build and stay enabled."
 building_type_inquisition_palace_01:0 "Palace of the Inquisition"
 building_type_inquisition_palace_01_desc:1 "#F A place for our knights to gather, train and feast.#!"
 building_inquisition_palace_01:0 "Hunting Lodge"
 building_inquisition_palace_01_desc:1 "A remote estate suitable for engaging in every knight's favourite earthly pastime."
 building_inquisition_palace_02:0 "Inquisitorial Manor"
 building_inquisition_palace_02_desc:1 "An elegant residence where hospitality meets the highest of standards."
 building_inquisition_palace_03:0 "Palace of the Inquisition"
 building_inquisition_palace_03_desc:1 "A splendid palace, testament to the nobility of our cause. Few nobles of this land would ever consider refusing an invitation.\nThis level requires more than 20 development to build and stay enabled."
 building_inquisition_palace_04:0 "Grand Palace of the Inquisition"
 building_inquisition_palace_04_desc:1 "Our venerable house, opulent and imperial. Suitable to host kings, emperors and the Holy Father himself.\nThis level requires more than 25 development to build and stay enabled."
 building_type_inquisition_armory_01:0 "Armory of the Inquisition"
 building_type_inquisition_armory_01_desc:1 "#F Maintaining a significant military presence of our own in this region requires adequate infrastructure.#!"
 building_inquisition_armory_01:0 "Weapon Caches"
 building_inquisition_armory_01_desc:1 "Few of our agents are ever unarmed, but some tasks require heavier equipment. Then, these caches come handy."
 building_inquisition_armory_02:0 "Armory of the Inquisition"
 building_inquisition_armory_02_desc:1 "These halls filled with weapons and armour ensure our preparedness should the darkness rear its head."
 building_inquisition_armory_03:0 "Inquisitorial Weapons Workshops"
 building_inquisition_armory_03_desc:1 "Producing our own equipment is the best way to ensure it meets the unusual requirements our mission entails.\nThis level requires more than 20 development to build and stay enabled."
 building_inquisition_armory_04:0 "Inquisitorial Military Academy"
 building_inquisition_armory_04_desc:1 "In this extensive complex of military installations our knights are able to forge commoners into formidable weapons against evil.\nThis level requires more than 25 development to build and stay enabled."
 building_type_inquisition_keep_01:0 "Castle of the Inquisition"
 building_type_inquisition_keep_01_desc:1 "#F A place to keep all kinds of things safe, be it ourselves, our prisoners or our secrets. #!"
 building_inquisition_keep_01:0 "Tower of the Inquisition"
 building_inquisition_keep_01_desc:1 "The first physical manifestation of the protection we grant to these lands."
 building_inquisition_keep_02:0 "Keep of the Inquisition"
 building_inquisition_keep_02_desc:1 "Only our agents enter this fortification unnoticed, only screams leave it that way."
 building_inquisition_keep_03:0 "Castle of the Inquisition"
 building_inquisition_keep_03_desc:1 "A formidable stronghold against our vile enemies. Our schemes and machinations sprout from here like blood from an artery.\nThis level requires more than 20 development to build and stay enabled."
 building_inquisition_keep_04:0 "Fortress of the Inquisition"
 building_inquisition_keep_04_desc:1 "A mountain of stone and eager steel as unassailable as our faith. No sentient creature of the night is mad enough to attack it directly.\nThis level requires more than 25 development to build and stay enabled."
 building_type_inquisition_contact_01:0 "Contact Fellow Orders"
 building_type_inquisition_contact_01_desc:1 "#F Although we are few and our mission must remain secret, we are not alone in our struggle.#!"
 building_inquisition_contact_01:0 "Dead Drop Spot"
 building_inquisition_contact_01_desc:1 "A designated spot to exchange encrypted messages and share expertise with our fellow brothers and sisters in utmost secrecy."
 building_inquisition_contact_02:0 "Meeting Place"
 building_inquisition_contact_02_desc:1 "A place discreet enough for our order's agents to meet their counterparts face to face.\nThis level requires more than 10 development to build and stay enabled."
 building_inquisition_contact_03:0 "Weekly Conference"
 building_inquisition_contact_03_desc:1 "A regular gathering of experts in the field of combating the forces of hell taking place in privacy of our holdings.\nThis level requires more than 20 development to build and stay enabled."
 building_type_inquisition_acre_01:0 "Knights of Acre Training Grounds"
 building_type_inquisition_acre_01_desc:1 "#F Here our brothers perfect their holy craft of vanquishing the devil's servants.#!"
 building_inquisition_acre_01:0 "Sparring Grounds"
 building_inquisition_acre_01_desc:1 "A secluded meadow with plenty of room for combat training."
 building_inquisition_acre_02:0 "Training Camp"
 building_inquisition_acre_02_desc:1 "A forest training encampment with plenty enough infrastructure and expertise in place to benefit even the most seasoned warriors.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_acre_03:0 "Jousting Tournament"
 building_inquisition_acre_03_desc:1 "A jousting tournament under our patronage attracts the land's finest knights. The grounds provide a valuable training facility off season.\nThis level requires more than 10 development to build and stay enabled."
 building_type_inquisition_james_01:0 "Knights of St. James Hospice"
 building_type_inquisition_james_01_desc:1 "#F Providing safety and hospitality to pilgrims was our primary purpose and remains our specialty.#!"
 building_inquisition_james_01:0 "Pilgrim Guesthouse"
 building_inquisition_james_01_desc:1 "A modest establishment, but a welcome sight to a tired pilgrim nevertheless. Or a tired soldier of God in times more dire."
 building_inquisition_james_02:0 "Pilgrim Inn"
 building_inquisition_james_02_desc:1 "A lively, spacious and warm place with enough infrastructure to cater to the needs of travelers, whatever their purpose. \nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_james_03:0 "Pilgrim Hospice"
 building_inquisition_james_03_desc:1 "A bustling complex of buildings serving as a versatile logistics nexus to those driven by faith.\nThis level requires more than 10 development to build and stay enabled."
 building_type_inquisition_john_01:0 "Sisters of St. John Charity"
 building_type_inquisition_john_01_desc:1 "#F We serve the poor, the sick and the suffering without expectations of earthly rewards, yet the fruits of our effort reward us nonetheless.#!"
 building_inquisition_john_01:0 "Soup Kitchen"
 building_inquisition_john_01_desc:1 "A humble, but much appreciated initiative to provide food for those in need."
 building_inquisition_john_02:0 "移动医院"
 building_inquisition_john_02_desc:1 "A caravan of carts and wagons containing everything needed to provide care in remote places.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_john_03:0 "Asylum"
 building_inquisition_john_03_desc:1 "A safe and generous place to the realm's unfortunate. A small semblance of God's heavenly grace here on earth.\nThis level requires more than 10 development to build and stay enabled.\"building_type_inquisition_acre_01:0 \"Knights of Acre Cell"
 building_type_inquisition_red_01:0 "Red Order Library"
 building_type_inquisition_red_01_desc:1 "#F A place where words of God, words of men and words in tongues most unholy are made useful for our sacred cause.#!"
 building_inquisition_red_01:0 "Catacomb Library"
 building_inquisition_red_01_desc:1 "An underground crypt hosting not only the mortal remains of friars, but our most treasured tomes."
 building_inquisition_red_02:0 "Monastic Library"
 building_inquisition_red_02_desc:1 "A section of a local monastery dedicated to our sensitive research. Inaccessible to the uninitiated.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_red_03:0 "Forbidden Library"
 building_inquisition_red_03_desc:1 "A city block packed to the brim with manuscripts and grimoires too dangerous to remain outside our exclusive custody.\nThis level requires more than 10 development to build and stay enabled.\"building_type_inquisition_acre_01:0 \"Knights of Acre Cell"
 building_type_inquisition_murnau_01:0 "House von Murnau Mansion"
 building_type_inquisition_murnau_01_desc:1 "#F The honest, God-fearing people toiling in the fields are the backbone of this realm and our struggle.#!"
 building_inquisition_murnau_01:0 "Von Murnau Townhouse"
 building_inquisition_murnau_01_desc:1 "An urban residence not befitting the von Murnau name, but a useful outpost of our influence nonetheless."
 building_inquisition_murnau_02:0 "Von Murnau Mansion"
 building_inquisition_murnau_02_desc:1 "A luxurious abode for members of the family just as suitable to guest local men of importance.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_murnau_03:0 "Von Murnau City Palace"
 building_inquisition_murnau_03_desc:1 "A majestic marvel of architecture exemplifying the dynasty's splendor.\nThis level requires more than 10 development to build and stay enabled."
 building_type_inquisition_oculi_01:0 "神眼之室"
 building_type_inquisition_oculi_01_desc:1 "#The eyes speak, but are seldom heard. Conducting our affairs in seclusion ensures this.#!"
 building_inquisition_oculi_01:0 "Safehouse"
 building_inquisition_oculi_01_desc:1 "A chamber in a row of identical chambers with seemingly nothing special about it."
 building_inquisition_oculi_02:0 "Cellar Complex"
 building_inquisition_oculi_02_desc:1 "A spacious underground hub of connected cellars with each entrance safely under our control.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_oculi_03:0 "Tunnel Network"
 building_inquisition_oculi_03_desc:1 "An intricate web of interconnected basements, dungeons, sewers and caves. Allows for crossing great distances without being seen.\nThis level requires more than 10 development to build and stay enabled."