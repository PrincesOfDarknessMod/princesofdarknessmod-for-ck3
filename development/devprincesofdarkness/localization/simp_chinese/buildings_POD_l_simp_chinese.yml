l_simp_chinese:
 building_type_blood_tax_01:0 "血税"
 building_type_blood_tax_01_desc:1 "#F 你正确保你的臣民们正在工作，直到他们咽下最后一口气。#!"
 building_blood_tax_01:0 "宽松的血税"
 building_blood_tax_01_desc:1 "你在这里公开向凡人们征税，但这不是促进当地经济繁荣的最合理计划。"
 building_blood_tax_02:0 "沉重的血税"
 building_blood_tax_02_desc:1 "在您的统治下凡人正在为钱流血。当然，在他们幸运的情况下。"
 building_blood_tax_03:0 "严荷的血税"
 building_blood_tax_03_desc:1 "你的金库正在迅速的被填充。毕竟你在统治一片贫瘠之地，谁在乎呢？"
 building_type_open_rule_01:0 "公开统治"
 building_type_open_rule_01_desc:1 "#F 没有你的坚定领导，无助的凡人没有任何益处。奇怪的是，他们似乎并不都赞同这个显而易见的事实。#!"
 building_open_rule_01:0 "强硬统治"
 building_open_rule_01_desc:1 "您是这片土地的主人，无论是对于吸血鬼还是其他种族。您是被敬畏的，但是反叛的声音开始增长了。"
 building_open_rule_02:0 "迫压统治"
 building_open_rule_02_desc:1 "凡人们坐等着每夜的一个处决。至少，在他们认为你听得到他们的时候……"
 building_open_rule_03:0 "暴政统治"
 building_open_rule_03_desc:1 "凡人是家畜，在你的恐惧和绝望的领地亦被视为此。他们会抓住任何机会来拯救自己。"
 building_type_forced_conscription_01:0 "强制征兵"
 building_type_forced_conscription_01_desc:1 "#F 你给了你领地所有人都有在你军队服务的荣誉。可惜的是，这会使你的仆从在管理郡县时超出他们实际的能力范畴。#!"
 building_forced_conscription_01:0 "小幅征兵效果"
 building_forced_conscription_01_desc:1 "你的一些人在外面，说服人们为你而死实际上是一件好事。"
 building_forced_conscription_02:0 "正规征兵效果"
 building_forced_conscription_02_desc:1 "在你的王国里，到处都是征兵中心，不参加是不可能的。"
 building_forced_conscription_03:0 "大规模征兵效果"
 building_forced_conscription_03_desc:1 "他们贡献服务并到时再死，但不是现在就死。"
 building_type_night_terror_01:0 "夜之猎手"
 building_type_night_terror_01_desc:1 "#F 带着你的仆群在晚上四处觅食是你的天性，你无法抗拒这种出门猎食猎物的渴望。#!"
 building_night_terror_01:0 "夜之畏惧"
 building_night_terror_01_desc:1 "当你屈服在你的欲望时，人们就会不断消失。你对省份的控制力降低了，但是你的仆群增多了。"
 building_night_terror_02:0 "夜之恐怖"
 building_night_terror_02_desc:1 "在频繁的掠食之间，你几乎无法恢复理智并统治自己的领土。"
 building_night_terror_03:0 "夜之惊骇"
 building_night_terror_03_desc:1 "你的仆群是唯一真理。其他人都是将被掠食的猎物。"
 building_type_influence_noble_01:0 "掌控贵族"
 building_type_influence_noble_01_desc:1 "#F 通过影响、勒索和诱惑，你可以密切关注这个国家的统治阶级。这样做会抑制其他凡人和黄金流动。#!"
 building_influence_noble_01:0 "轻微贵族掌控"
 building_influence_noble_01_desc:1 "这种程度的影响，已经开始破坏统治阶级的凝聚力，削弱他们的军事意识。\n这个级别需要25以上的控制度来建立并保持启用。"
 building_influence_noble_02:0 "强烈贵族掌控"
 building_influence_noble_02_desc:1 "你对他们的控制越来越大，但从局外人的角度来看，事情开始恢复正常。\n这个级别需要50以上的控制度来建立并保持启用。"
 building_influence_noble_03:0 "完全贵族掌控"
 building_influence_noble_03_desc:1 "统治阶级可能不知道，但他们现在是你的了，并且无人怀疑。\n这个级别需要75以上的控制度来建立并保持启用。"
 building_type_playing_courts_01:0 "掌控守夜人"
 building_type_playing_courts_01_desc:1 "#F 当地驻军对你的私人随从的训练和，嗯……供粮是很有帮助的。不过，你得动用一些关系来实现它#!"
 building_playing_courts_01:0 "轻微守夜人掌控"
 building_playing_courts_01_desc:1 "在大多数官员的鼻子底下，通过贿赂其他人，你的私人侍卫已经开始与当地民兵合作。\n此级别需要超过25控制才能构建并保持启用。"
 building_playing_courts_02:0 "强力守夜人掌控"
 building_playing_courts_02_desc:1 "您的手下现在是在当地人的帮助下保护城市的有价值的「雇佣公司」。双赢局面。至少对你来说。\n此级别需要超过50控制才能构建并保持启用。"
 building_playing_courts_03:0 "完全守夜人掌控"
 building_playing_courts_03_desc:1 "你再也不能把本地的人和你自己的人区分开了。无论如何，他们都以某种方式为你服务。\n这个级别需要75以上的控制度来建立并保持启用。"
 building_type_influence_underworld_01:0 "掌控下层社会"
 building_type_influence_underworld_01_desc:1 "#F 你可以从这个地区的法外之徒身上榨取很多利益，无论是金钱还是为你的精锐卫队雇佣经验丰富的新兵。然而，煽动犯罪团伙也有其缺点。#!"
 building_influence_underworld_01:0 "轻微下层社会掌控"
 building_influence_underworld_01_desc:1 "帮助罪犯已经开始让你赚钱了。但这也激怒了当地的民众。\n这个级别需要25以上的控制度来建立并保持启用。"
 building_influence_underworld_02:0 "强烈下层社会掌控"
 building_influence_underworld_02_desc:1 "有了你的指导，你的恶棍团伙制造的不必要的麻烦越来越少，赚取的利润越来越多。\n这个级别需要50以上的控制度来建立并保持启用。"
 building_influence_underworld_03:0 "完全下层社会掌控"
 building_influence_underworld_03_desc:1 "你已经尽可能地压制了你的犯罪同伙们最恶劣的本性。他们几乎和正规的战斗部队一样纪律严明。\n这个级别需要75以上的控制度来建立并保持启用。"
 building_type_influence_merchant_01:0 "掌控商人"
 building_type_influence_merchant_01_desc:1 "#F 商人很富有，而你需要黄金。这个等式很简单，但他们可能不会轻易给出来。#!"
 building_influence_merchant_01:0 "轻微商人掌控"
 building_influence_merchant_01_desc:1 "他们在抗拒，在抱怨，在挑起事端。但有些人已经开始支付给你完全合法的税。\n这个级别需要25以上的控制度来建立并保持启用。"
 building_influence_merchant_02:0 "强烈商人掌控"
 building_influence_merchant_02_desc:1 "大多数商人都被吓到了，持不同意见者也只能在小巷里交头接耳。\n这个级别需要50以上的控制度来建立并保持启用。"
 building_influence_merchant_03:0 "完全商人掌控"
 building_influence_merchant_03_desc:1 "你现在可以重新组合公会，展示你的增税计划，并仍然赢得雷鸣般的掌声。\n这个级别需要75以上的控制度来建立并保持启用。"
 building_type_prince_city_00:0 "亲王领"
 building_type_prince_city_00_desc:1 "#F 吸血鬼是城市居民。城市越大，吸血鬼就越令人恐惧，也越有声望。#!"
 building_prince_city_00:0 "城镇亲王"
 building_prince_city_00_desc:1 "你控制着一个人口稀少地区的首府。虽然不多，但总比没有好。"
 building_prince_city_005:0 "大城镇亲王"
 building_prince_city_005_desc:1 "你正在控制一个人口较少的地区首府。虽然不多，但总比没有好。\n这个级别需要5以上的发展度来建立并保持启用。"
 building_prince_city_01:0 "城市亲王"
 building_prince_city_01_desc:1 "你控制着整个小城市，或者一个大城市的一小部分。这只是第一步。\n这个级别需要10以上的发展度来建立并保持启用。"
 building_prince_city_02:0 "郡城亲王"
 building_prince_city_02_desc:1 "你的宫廷受到尊敬和钦佩，因为你统治着这么多的凡人。\n这个级别需要20以上的发展度来建立并保持启用。"
 building_prince_city_025:0 "大郡城亲王"
 building_prince_city_025_desc:1 "一个你控制下的重要城市，许多凡人都自愿在这里受你的奴役。\n这个级别需要30以上的发展度来建立并保持启用。"
 building_prince_city_03:0 "首都亲王"
 building_prince_city_03_desc:1 "凡人、国王和军阀居住在这个令人印象深刻的城市。你是他们在夜间的同类。\n这个级别需要40以上的发展度来建立和保持启用。"
 building_prince_city_04:0 "大都会亲王"
 building_prince_city_04_desc:1 "世界上最伟大的城市之一就生活在你的阴影之下。你的影响力在你的领域没有什么限制。\n这个级别需要超过60发展来构建并保持可用。"
 building_type_temple_set_01:0 "赛特神殿"
 building_type_temple_set_01_desc:1 "#F 你做梦也想不到的快乐就在这里。如果你愿意付出代价。#!"
 building_temple_set_01:0 "赛特神殿"
 building_temple_set_01_desc:1 "赛特的信仰有一种不可否认的诱惑力，使把你的灵魂卖给赛特信徒成为一种比拥有的任何其他权利都更诱人的前景。"
 building_type_devasthana_01:0 "控制印度庙"
 building_type_devasthana_01_desc:1 "#F 印度陷入了一场千年之久的圣战，以阻止阿修罗提伽耶。要赢得胜利，你需要信仰和坚不可摧的信念。#!"
 building_devasthana_01:0 "军事化印度庙"
 building_devasthana_01_desc:1 "在这里，在提婆的保护下，你会找到继续前行的力量。"
 building_type_brahmavihara_01:0 "婆罗门的导师"
 building_type_brahmavihara_01_desc:1 "#F 你的身体状况，虽然只是一段漫长旅程的一部分，却让你更难遵从佛陀的教诲。你可能需要一些帮助。#!"
 building_brahmavihara_01:0 "舍心"
 building_brahmavihara_01_desc:1 "在所有情况下保持中立是一个合适的测试。它是心灵平静和涅槃的途径。"
 building_type_low_war_01:0 "局部战争"
 building_type_low_war_01_desc:1 "#F 每时每刻都是战场，无论是政治上的还是现实上的。玉之战士时刻准备着。#!"
 building_low_war_01:0 "无尽局部战争"
 building_low_war_01_desc:1 "你总是在战斗，而休息是早已逝去的记忆。但是你的敌人也一样。"
 building_type_chantry_01:0 "礼拜堂"
 building_type_chantry_01_desc:1 "#F 一群法师的集会。经常发生无休止的阴谋诡计……直到一个共同的敌人出现。#!"
 building_chantry_01:0 "小礼拜堂"
 building_chantry_01_desc:1 "来自该地区的睿魔尔聚集在这里。这是一个结交朋友的好地方。同时也是一个找到敌人的更好的地方。"
 building_type_influence_the_tribes_01:0 "掌控部落"
 building_type_influence_the_tribes_01_desc:1 "#F 生活在穆斯林世界的边缘，许多部落的人可能对你有事业有用。#!"
 building_influence_the_tribes_01:0 "部落小掌控"
 building_influence_the_tribes_01_desc:1 "通过已经证明了你的价值和你的虔诚，你已经获得了相当数量的部落人的帮助。"
 building_type_underworld_portal_01:0 "通往冥界的门"
 building_type_underworld_portal_01_desc:1 "#F 作为少数了解冥界的吸血鬼之一，你可以利用它的专横的存在作为你的优势#!"
 building_underworld_portal_01:0 "通往冥界的通道"
 building_underworld_portal_01_desc:1 "鬼魂是饥肠辘辘的。环绕在你周围时，他们会更加渴望你敌人的心灵。"
 building_type_pairidaeza_01:0 "波斯庭院"
 building_type_pairidaeza_01_desc:1 "#F 这些花园是波斯祆教最伟大时代的遗留物，是吸血鬼坚持长期信仰的绿洲。#!"
 building_pairidaeza_01:0 "体面的波斯庭院"
 building_pairidaeza_01_desc:1 "一个休息和缅怀失去已久的黄金时代的地方。内心风暴之眼。"
 building_type_unending_party_01:0 "无尽派对"
 building_type_unending_party_01_desc:1 "#F 只有把每件事都推到极致，才能感受到生命的存在。一直都是。#!"
 building_unending_party_01:0 "年度派对"
 building_unending_party_01_desc:1 "有些客人永远都不想离开你的宴会。不过大多数人都做不到。"
 building_type_fallen_church_01:0 "堕落教堂"
 building_type_fallen_church_01_desc:1 "#F 你的灵魂早已迷失。所以，在这里，你要确保拯救每个人的灵魂。不管他们喜欢不喜欢#!"
 building_fallen_church_01:0 "堕落祭坛"
 building_fallen_church_01_desc:1 "这里听到了如此多的哭声，如此多的请求宽恕。而且，在最后，几乎没有救赎。"
 building_type_laboratory_01:0 "研究室"
 building_type_laboratory_01_desc:1 "#F 很多东西进入这里。一些离开。有些甚至成为整体的一部分。#!"
 building_laboratory_01:0 "血肉研究室"
 building_laboratory_01_desc:1 "在一件艺术品中，总能瞥见艺术家的身影。。有时，也有一些创造者的「朋友」。"
 building_type_mother_garden_01:0 "莉莉丝的花园"
 building_type_mother_garden_01_desc:1 "#F 真正的伊甸园只存在于第一个女人崇拜中，那个被亚当、该隐和上帝自己背叛的女人。#!"
 building_mother_garden_01:0 "「少女」的花园"
 building_mother_garden_01_desc:1 "作为「少女」，莉莉丝诱使其他人去发现隐藏在现实面纱背后的真相。"
 building_type_legacies_gathering_01:0 "遗世之流集会"
 building_type_legacies_gathering_01_desc:1 "#F 大多数时候，莱本喜欢在草率行动之前把事情商量一下。举办这样的聚会是一项享有声望的活动。#!"
 building_legacies_gathering_01:0 "大型集会"
 building_legacies_gathering_01_desc:1 "相当数量的宗族代表代表聚集在这里，讨论该地区和其他地区的未来。"
 building_type_throne_room_01:0 "王座室"
 building_type_throne_room_01_desc:1 "#F 不能从王座室的大小来判断一个统治者……但更大还是有帮助的。#!"
 building_throne_room_01:0 "体面的王座室"
 building_throne_room_01_desc:1 "在这里，人们做出了决定，策划了阴谋，做出了判断。希望是出于你。"
 building_type_influence_people_01:0 "掌控人群"
 building_type_influence_people_01_desc:1 "#F 从最好的到最坏的，人性就是一切。因此，你可以与社会的每一个层面相互纠缠，并从中学习。#!"
 building_influence_people_01:0 "人群掌控"
 building_influence_people_01_desc:1 "每天晚上，通过与人类分享你的生活，你会学到更多东西。它提醒你怎样才能不变成怪物。"
 building_type_influence_clergy_01:0 "掌控神职"
 building_type_influence_clergy_01_desc:1 "#F 人性远非完美，但有些人对神的信仰不容忽视。你必须向这样的人学习。#!"
 building_influence_clergy_01:0 "神职群体掌控"
 building_influence_clergy_01_desc:1 "你从圣人那里学到很多，从坏人那里学到更多。你只需要确保有时能理解其中的区别。"
 building_type_crypt_01:0 "墓穴"
 building_type_crypt_01_desc:1 "#F 你的工作需要适当的地点和用品。而且，最好是一个非常安静和隐蔽的地方，邻居们不会抱怨。#!"
 building_crypt_01:0 "大墓穴"
 building_crypt_01_desc:1 "独自在黑暗中，被尸体和腐烂的可憎之物包围。天堂的定义。"
 building_type_assassins_cell_01:0 "刺客之室"
 building_type_assassins_cell_01_desc:1 "#F 哈基姆之嗣在世界的每一个角落都有一个庞大的由探员，线人和其他有用的工具人组成的网络。#!"
 building_assassins_cell_01:0 "大型刺客之室"
 building_assassins_cell_01_desc:1 "哈基姆在这个地区的大量存在，让你有一些非常有用的准备为了你的更多…秘密的目的。"
 building_type_alamut_01:0 "鹰巢"
 building_type_alamut_01_desc:1 "#F 阿刹迈氏族的可怕隐形坚垒是由信仰、力量和谎言铸成的。#!"
 building_alamut_01:0 "分裂的鹰巢"
 building_alamut_01_desc:1 "与阿刹迈氏族一样，鹰巢内也被分为不同的种姓。修补这种分裂需要相当大的投资。"
 building_alamut_02:0 "恢复的鹰巢"
 building_alamut_02_desc:1 "尽管人们仍能听到和看到背后的激烈言辞和刀锋，但最严重的暴力爆发已被这些神圣的城墙排斥在外。"
 building_alamut_03:0 "阿拉穆特，鹰巢"
 building_alamut_03_desc:1 "至少在这里，阿刹迈氏族表现出了完美的凝聚力和对单一目标的奉献，使其成为一股可怕的力量。"
 building_type_rome_01:0 "罗马"
 building_type_rome_01_desc:1 "#F 罗马是该隐之子的中心，也是人类世界的中心。恢复它不死的伟大将是一个巨大的成就。#!"
 building_rome_01:0 "凡人的罗马"
 building_rome_01_desc:1 "神职人员在街道上徘徊，反对任何直接控制欧洲世界中心的企图。在这个阶段，罗马对他的主人来说是一个有声望的头衔，仅此而已。"
 building_rome_02:0 "分裂的罗马"
 building_rome_02_desc:1 "慢慢地，罗马的信仰被侵蚀，吸血鬼可以再次利用他们微妙的影响力为亲王谋利。"
 building_rome_03:0 "永恒罗马"
 building_rome_03_desc:1 "最后，罗马又回到了吸血鬼的手中。当该隐子嗣歌颂征服圣城的伟大统治者时，神职人员在黑暗中畏缩。"
 building_type_ceoris_01:0 "塞里奥斯大礼拜堂"
 building_type_ceoris_01_desc:1 "#F 睿魔尔的坚固堡垒是其大本营和学习中心。这是被围困的法师氏族最好的资产#!"
 building_ceoris_01:0 "分裂的塞里奥斯"
 building_ceoris_01_desc:1 "在教堂里有些睿魔尔仍然是凡人。他们怀疑那些诡计多舛的吸血鬼有奸诈行为，并且一直是议会计划的障碍。"
 building_ceoris_02:0 "掌控中的塞里奥斯"
 building_ceoris_02_desc:1 "随着他们的凡人同伴消失或被转化，睿魔尔家族们可以真正利用塞里奥斯的全部潜力。"
 building_ceoris_03:0 "无法攻取的塞里奥斯"
 building_ceoris_03_desc:1 "只要这个坚固的堡垒还在，睿魔尔氏族就不会倒下。换言之，至少从外部来看……"
 building_type_carthage_01:0 "迦太基"
 building_type_carthage_01_desc:1 "#F 布鲁赫氏族的梦想早已被复仇心切的梵卓埋葬。但是梦想真的会消亡吗？#!"
 building_carthage_01:0 "重建迦太基"
 building_carthage_01_desc:1 "重建特洛伊尔的城市将是一件代价高昂的事情，这是对世界的一个强有力的宣言。但回报和危险可能都是巨大的。"
 building_carthage_02:0 "新迦太基"
 building_carthage_02_desc:1 "罗马该隐之子最可怕的噩梦在你的领导下复活了。它不会再倒下。"
 building_carthage_03:0 "迦太基，布鲁赫之梦"
 building_carthage_03_desc:1 "一个启蒙的灯塔和一个人类与该隐之子之间合作的愿景在这里再次可见。"
 building_type_ombos_temple_01:0 "建立奥姆博斯神殿"
 building_type_ombos_temple_01_desc:1 "#F 作为赛特氏族奢华的核心，奥姆博斯据说也是赛特的最后安息之地。#!"
 building_ombos_temple_01:0 "失色的奥姆博斯"
 building_ombos_temple_01_desc:1 "最近，奥姆博斯被年轻的赛特族视为一个过去时代的遗迹，其合法性受到质疑。"
 building_ombos_temple_02:0 "恢复中的奥姆博斯"
 building_ombos_temple_02_desc:1 "改革和重建使寺庙重新站在了时代的前沿。"
 building_ombos_temple_03:0 "高耸的奥姆博斯"
 building_ombos_temple_03_desc:1 "作为整个宗教无可争议的中心，奥姆博斯是思想、礼拜和计谋的摇篮。一如既往。"
 building_type_erciyes_01:0 "埃尔吉耶斯"
 building_type_erciyes_01_desc:1 "#F 在古典时代，卡帕多西亚氏族从马尔卡维亚人手中夺走了山上的据点。从那时起，它就成为了学习和冥想的中心。#!"
 building_erciyes_01:0 "孤立的埃尔吉耶斯"
 building_erciyes_01_desc:1 "从各方面来看，埃尔吉耶斯都是一个完美的冥想场所。遗憾的是，它往往会让访客忽视来自外部的威胁。"
 building_erciyes_02:0 "开放的埃尔吉耶斯"
 building_erciyes_02_desc:1 "随着心态的改变和外部世界可以整理出通往堡垒的道路，埃尔吉耶斯成为一个世界性的学习中心。"
 building_erciyes_03:0 "埃尔吉耶斯，暗影修道院"
 building_erciyes_03_desc:1 "这座山堡既是一个休息的地方，也是整个氏族的中心，在它的城墙内可以看到连续的，但有控制的活动。"
 building_type_cathedral_of_flesh_01:0 "血肉大教堂"
 building_type_cathedral_of_flesh_01_desc:1 "#F 这极其令人憎恶的东西是几千年来由农民、奴隶、敌人、禽兽和许多其他受害者的血肉雕刻而成的，这些人被埋进搏动着的、化脓溃烂的墙壁里。#!"
 building_cathedral_of_flesh_01:0 "怀敌意的大教堂"
 building_cathedral_of_flesh_01_desc:1 "受土地本身的污染，大教堂是任何入侵者的敌人，正如它是它的主人的敌人一样。输掉这场战斗意味着要成为其中的一部分。"
 building_cathedral_of_flesh_02:0 "沸腾的大教堂"
 building_cathedral_of_flesh_02_desc:1 "库帕拉的影响随着怪物开始服从它的主人而逐渐减弱。"
 building_cathedral_of_flesh_03:0 "可欺的大教堂"
 building_cathedral_of_flesh_03_desc:1 "库帕拉似乎暂时离开了。大教堂已经成为任何一个疯狂的库都术士都梦想着使用的极度可怕的工具。"
 building_type_castel_del_ombro_01:0 "暗影之堡"
 building_type_castel_del_ombro_01_desc:1 "#F 从远处是不可能分辨墙壁是由什么构成的，因为动态的阴影在几乎看不见的潮起潮落中爬过每一个表面。每天晚上日落后，潮水般的阴影从城堡深处升起，环绕城堡呈螺旋形，午夜过后，阴影会逆转并逐渐消失。#!"
 building_castel_del_ombro_01:0 "暗影之墓"
 building_castel_del_ombro_01_desc:1 "作为上古耆宿的安息地，这座城堡是一个可怕的地方，提醒着人们在每一个勒森魃周围都有不自然的空气。"
 building_castel_del_ombro_02:0 "暗影之堡"
 building_castel_del_ombro_02_desc:1 "作为血之宫廷的中心，城堡是氏族长者的司法工具。"
 building_castel_del_ombro_03:0 "开放城堡"
 building_castel_del_ombro_03_desc:1 "城门的开启意味着勒森魃自己已经离开了城堡。在这段时间里，它周围的疯狂气氛稍稍消退，让这个地方成为氏族的政治中心。"
 building_type_rabble_thugs_01:0 "暴民和恶棍"
 building_type_rabble_thugs_01_desc:1 "#F 有时，你必须忘记你的自尊并接触一些讨厌的人，以得到一些急需的支援。#!"
 building_rabble_thugs_01:0 "征召卑贱之人"
 building_rabble_thugs_01_desc:1 "很多人是不会被任何人错过的。他们是那种你可以用来快速创建一支战斗力的人。"
 building_rabble_thugs_02:0 "征召暴民"
 building_rabble_thugs_02_desc:1 "街头的乌合之众在夜晚的战场上毫无用处。但有时候，你不能太挑剔。\n这个级别需要超过5个开发度来构建并保持可用。"
 building_rabble_thugs_03:0 "征召不法之徒"
 building_rabble_thugs_03_desc:1 "罪犯们数量众多且至少有一点战斗经验，是很好的兵源。\n这个级别需要15以上的发展度来建立并保持启用。"
 building_type_sherwood_01:0 "舍伍德森林"
 building_type_sherwood_01_desc:1 "#F 愤怒运动就是在这里诞生的，并将繁荣几个世纪。这是避开了夜晚的暴君辛苦挣来的喘息之机。#!"
 building_sherwood_01:0 "掌控中的舍伍德"
 building_sherwood_01_desc:1 "罗宾·李兰德从密特拉的眼皮底下夺走了舍伍德并接掌了数个世纪。这一对抗老暴君的大胆成就激励着愤怒的人们聚集起来，为这个事业更加努力地战斗。"
 building_sherwood_02:0 "扩展中的舍伍德"
 building_sherwood_02_desc:1 "舍伍德的自由男女现在在森林外战斗，这让罗宾为他的学生感到骄傲。"
 building_sherwood_03:0 "功成名就的舍伍德"
 building_sherwood_03_desc:1 "只要一提到舍伍德的勇敢捍卫者、暴君的歼灭者和自由之战士，就会令暴君们胆战心惊。"
 building_type_vigiles_francia_01:0 "法兰克巡夜人"
 building_type_vigiles_francia_01_desc:1 "#F 由萨利安娜成立的一个特殊的精锐军团，巡夜人是一群忠诚的骑士，包括该隐之子和血仆，为他们的领主巡游领土。#!"
 building_vigiles_francia_01:0 "法兰克巡夜人：被动"
 building_vigiles_francia_01_desc:1 "法兰克巡夜人，由妥瑞朵骑士和血仆组成的精锐军团，随时准备回应对法兰克统治者的任何威胁。"
 building_vigiles_francia_02:0 "法兰克巡夜人：主动"
 building_vigiles_francia_02_desc:1 "在任何潜在的麻烦制造者到达之前，这些巡夜人就已经开始着手寻找他们，以改善他们对这片土地的控制。"
 building_vigiles_francia_03:0 "法兰克巡夜人：无所不在"
 building_vigiles_francia_03_desc:1 "这支日益壮大的部队理想化了骑士守则，现在巡夜人是法兰克该隐之子皇帝的主要资源。"
 building_type_inquisition_fortress_01:0 "裁判所堡垒"
 building_type_inquisition_fortress_01_desc:1 "#F 在这里，勇敢的男男女女们与黑暗抗争。#!"
 building_inquisition_fortress_01:0 "裁判所城寨"
 building_inquisition_fortress_01_desc:1 "他们的人数可能很少，他们的防御可能是微不足道的，但他们的心会看到圣殿的光。"
 building_inquisition_fortress_02:0 "裁判所要塞"
 building_inquisition_fortress_02_desc:1 "在这里，世界的一小部分被善良的力量重新征服了。"
 building_inquisition_fortress_03:0 "裁判所大要塞"
 building_inquisition_fortress_03_desc:1 "看看这个由光明、地狱和绝望组成的坚不可摧的堡垒吧。"
 building_type_shrine_of_telyavel_01:0 "特亚维神龛"
 building_type_shrine_of_telyavel_01_desc:1 "#F 工匠之神对凡类或超凡的事物不感兴趣。除非付出相应的代价……#!"
 building_shrine_of_telyavel_01:0 "象征性的特亚维神龛"
 building_shrine_of_telyavel_01_desc:1 "即使没有神的祝福，这座神龛仍然是一个垂死的原始教徒世界的强大呼声。"
 building_shrine_of_telyavel_02:0 "觉醒的特亚维神龛"
 building_shrine_of_telyavel_02_desc:1 "铁匠之神注视着他的信徒，被他们的重新承诺所吸引。"
 building_shrine_of_telyavel_03:0 "暗影之林"
 building_shrine_of_telyavel_03_desc:1 "现在此处已与神的国度直接相连，许多勇士来到这里寻求神圣祝福。"
 building_type_giovanni_mausoleum_01:0 "乔万尼陵墓"
 building_type_giovanni_mausoleum_01_desc:1 "#F 有很多人进入这里。但很少有人离开。#!"
 building_giovanni_mausoleum_01:0 "狭小的乔万尼陵墓"
 building_giovanni_mausoleum_01_desc:1 "乔凡尼家庭作为夜之眷族来说还很年轻，但他们仍然非常专注于对死亡和灵魂的研究。"
 building_giovanni_mausoleum_02:0 "体面的乔万尼陵墓"
 building_giovanni_mausoleum_02_desc:1 "慢慢的，亡灵术师们将他们的注意力放到了外界，对于新的环境给他们带来的机会很感兴趣。"
 building_giovanni_mausoleum_03:0 "宏伟的乔万尼陵墓"
 building_giovanni_mausoleum_03_desc:1 "意大利人现在是一股不可忽视的力量。他们仍然是强大的亡灵术师，但也有能力参与政治游戏。"
 building_type_pit_of_malkav_01:0 "末卡维地穴"
 building_type_pit_of_malkav_01_desc:1 "#F 耶路撒冷的地下有个裂口。仅仅靠近就会让人感到痛苦。你的头感觉就要爆炸了。#!"
 building_pit_of_malkav_01:0 "开放的末卡维地穴"
 building_pit_of_malkav_01_desc:1 "如此之多的声音说出了如此之多矛盾的事情……即使是你也可以瞥见其中一些微弱的智慧。"
 building_pit_of_malkav_02:0 "隐藏的末卡维地穴"
 building_pit_of_malkav_02_desc:1 "您已经将石头扔进了坑中，现在这声音不再那么疯狂。你将能够更好地理解它们。"
 building_pit_of_malkav_03:0 "关闭的末卡维地穴"
 building_pit_of_malkav_03_desc:1 "现在声音安静了不少，除非你非常靠近裂口。现在靠近它可以让你轻松地将疯狂从智慧之声中分出来。"
 building_type_well_of_sacrifice_01:0 "牺牲之井"
 building_type_well_of_sacrifice_01_desc:1 "#F 地狱就在地球上，它就在这里。#!"
 building_well_of_sacrifice_01:0 "小牺牲之井"
 building_well_of_sacrifice_01_desc:1 "扔进井里后，他们就停止了哭泣。这让你不快。"
 building_well_of_sacrifice_02:0 "大牺牲之井"
 building_well_of_sacrifice_02_desc:1 "还有非常多的人需要感受永恒的空虚和无尽的饥饿。"
 building_well_of_sacrifice_03:0 "地狱牺牲之井"
 building_well_of_sacrifice_03_desc:1 "他们很快就会醒来。他们很快就会来。到那时，一切都会明白。"
 building_type_london_mithraeum_01:0 "伦敦密特拉神圣所"
 building_type_london_mithraeum_01_desc:1 "#F 密特拉教信仰最古老神殿之一，至今仍为太阳神的追随者所关注。#!"
 building_london_mithraeum_01:0 "隐蔽的密特拉神圣所"
 building_london_mithraeum_01_desc:1 "因为惧怕十字架，信徒们聚集在从前荣耀的阴影里。"
 building_london_mithraeum_02:0 "复苏的密特拉神圣所"
 building_london_mithraeum_02_desc:1 "密特拉的信徒在这里祈祷，寻求光明之神所承诺的救恩，这现在是一个公开的秘密。"
 building_london_mithraeum_03:0 "狂欢的密特拉神圣所"
 building_london_mithraeum_03_desc:1 "现在是轮到十字架躲藏的时候了，因为这片土地的真正信仰已经回归！"
 building_type_influence_law_01:0 "掌控立法者"
 building_type_influence_law_01_desc:1 "#F 很明显，你凌驾于凡人的法律之上。但是让你的探员在里面维持这个省份的公共秩序依然是有益的。#!"
 building_influence_law_01:0 "轻微立法者掌控"
 building_influence_law_01_desc:1 "经常在耳边吹风有助于在保持很长的一段时间的民间平息。"
 building_influence_law_02:0 "强烈立法者掌控"
 building_influence_law_02_desc:1 "你在这里对司法系统有很强的拉动作用。强大到可以在很多方面加以利用。"
 building_influence_law_03:0 "完全立法者掌控"
 building_influence_law_03_desc:1 "你猜对了：在这个阶段，你就是法律。"
 building_type_haven_defenses_01:0 "避难性防御"
 building_type_haven_defenses_01_desc:1 "#F 这不是妄想，你的敌人总有一天会来找你。当这种情况发生时，你最好有一个应急计划。#!"
 building_haven_defenses_01:0 "轻度避难性防御"
 building_haven_defenses_01_desc:1 "分散在省份各地的一些陷阱和可靠的岗哨是任何强大防御的良好开端。"
 building_haven_defenses_02:0 "重度避难性防御"
 building_haven_defenses_02_desc:1 "你已经做好了最坏的打算，你的应急计划有自己的应急计划。"
 building_haven_defenses_03:0 "极度避难性防御"
 building_haven_defenses_03_desc:1 "他们要带一整支突击兵队才能把你打倒!"
 building_type_remote_haven_01:0 "偏远避难所"
 building_type_remote_haven_01_desc:1 "#F 有时候，你不得不退一步来计划下一步，远离窥探的目光。#!"
 building_remote_haven_01:0 "空荡的偏远避难所"
 building_remote_haven_01_desc:1 "这个避难所远离文明的气息。这可能是它唯一的好处。"
 building_remote_haven_02:0 "舒适的偏远避难所"
 building_remote_haven_02_desc:1 "这不是你的宫廷，但对于一个短期假期来说，这已经足够好了。"
 building_remote_haven_03:0 "奢华的偏远避难所"
 building_remote_haven_03_desc:1 "你住在离家很远的地方，非常安全并且符合你的精致品味。"
 building_type_mercenary_company_01:0 "掌控佣兵"
 building_type_mercenary_company_01_desc:1 "#F 凡人已经发展出了「雇佣兵」的概念，即可雇佣的有经验士兵。你当然可以为了自己的利益而使用它。#!"
 building_mercenary_company_01:0 "轻微佣兵掌控"
 building_mercenary_company_01_desc:1 "你在当地的团体中有一些关系。足够提供你一些选择。"
 building_mercenary_company_02:0 "强烈佣兵掌控"
 building_mercenary_company_02_desc:1 "你可以依靠一群经验丰富的凡人士兵来保护你在这个地区的利益。"
 building_mercenary_company_03:0 "完全佣兵掌控"
 building_mercenary_company_03_desc:1 "这里的佣兵现在是你的私人防卫军。"
 building_type_influence_barracks_01:0 "掌控兵营"
 building_type_influence_barracks_01_desc:1 "#F 职业军队正在凡人社会中卷土重来。这对该隐之子是一个难得的机会，来获取一些经验丰富的战士用于他的事业。#!"
 building_influence_barracks_01:0 "轻微兵营掌控"
 building_influence_barracks_01_desc:1 "这一带的一些士兵都在你的工资单上。他们在危急时刻是有用的盟友。"
 building_influence_barracks_02:0 "强烈兵营掌控"
 building_influence_barracks_02_desc:1 "大部分地方军队都知道你的名字，或者为那些知道你名字的人工作。"
 building_influence_barracks_03:0 "完全兵营掌控"
 building_influence_barracks_03_desc:1 "当地的军队知道谁才是他们真正的主人。当然也不是什么浮夸的地方贵族。"
 building_type_influence_burghers_01:0 "掌控市民"
 building_type_influence_burghers_01_desc:1 "#F 在凡人间，一个新的社会阶层正在出现。这些「布尔乔亚」有充足的金钱，但几乎没有实际的军事力量。用于秘密交易的完美目标。#!"
 building_influence_burghers_01:0 "轻微市民掌控"
 building_influence_burghers_01_desc:1 "你已经对这个地区的商人阶层做了一些初步的接触。\n这个级别需要10以上的发展度来建立并保持启用。"
 building_influence_burghers_02:0 "强烈市民掌控"
 building_influence_burghers_02_desc:1 "作为这个地区一些最富有商人的背后赞助人，你从中获得了可观的利润。\n这个级别需要15以上的发展度来建立和保持启用。"
 building_influence_burghers_03:0 "完全市民掌控"
 building_influence_burghers_03_desc:1 "钱在这里只流进一个方向，那就是你的口袋。\n这个级别需要20以上的发展度来建立并保持启用。"
 building_type_oculi_cell_01:0 "神目之室"
 building_type_oculi_cell_01_desc:1 "#F 裁判所的监察之眼永不入眠。#!"
 building_oculi_cell_01:0 "小神目之室"
 building_oculi_cell_01_desc:1 "他们知道你敌人的秘密……也知道你朋友的。"
 building_oculi_cell_02:0 "大神目之室"
 building_oculi_cell_02_desc:1 "你看不到他们，但他们看到了你。"
 building_oculi_cell_03:0 "强力的神目之室"
 building_oculi_cell_03_desc:1 "牠能看到……一切！"
 building_type_knights_patrol_01:0 "亚柯骑士厅"
 building_type_knights_patrol_01_desc:1 "#F 虔诚的上帝之剑正在街道上巡逻，他是一位保护无辜者的令人安心的存在。#!"
 building_knights_patrol_01:0 "小亚柯骑士厅"
 building_knights_patrol_01_desc:1 "一队骑士在这里训练和巡逻，他们的勇敢弥补了人数的不足。"
 building_knights_patrol_02:0 "大亚柯骑士厅"
 building_knights_patrol_02_desc:1 "民众们因为看到基督虔诚的士兵在这里受训而大受鼓舞。"
 building_knights_patrol_03:0 "强亚柯骑士厅"
 building_knights_patrol_03_desc:1 "驻扎在该省份的骑士们并不软弱，随时做好准备迎击敌人。"
 building_type_fortress_cross_01:0 "十字堡垒"
 building_type_fortress_cross_01_desc:1 "#F 亚柯骑士们戒备森严的总殿可能是裁判所里最令人惊叹的要塞。#!"
 building_fortress_cross_01:0 "孤立的十字堡垒"
 building_fortress_cross_01_desc:1 "真令人感慨，亚柯骑士的首领在裁判所的其他一些圣地仍然缺乏政治权力。"
 building_fortress_cross_02:0 "熙攘的十字堡垒"
 building_fortress_cross_02_desc:1 "被重新翻修成了一处提供给所有胸怀大志的裁判官使用的重要朝圣地后，堡垒如今成为了精锐们的训练中心。"
 building_fortress_cross_03:0 "真十字堡垒"
 building_fortress_cross_03_desc:1 "因为城墙受到了真十字碎片的祝福，堡垒如今成为了一个坚不可摧的信标。"
 building_type_st_scholastica_01:0 "圣思嘉"
 building_type_st_scholastica_01_desc:1 "#F 红修会第二重要的赞助者圣思嘉是圣本笃的孪生姐妹，一位意志坚定但信仰虔诚的女人。#!"
 building_st_scholastica_01:0 "圣思嘉修道院"
 building_st_scholastica_01_desc:1 "红修女们最重要的修道院是一个奇怪的地方，在那里修女们享有远超她们大多数神职同袍们的自由。"
 building_st_scholastica_02:0 "圣思嘉图书馆"
 building_st_scholastica_02_desc:1 "裁判所最大的图书馆之一，它还收藏着禁忌的传说。只有最虔诚的修女才能进入。"
 building_st_scholastica_03:0 "圣思嘉圣物室"
 building_st_scholastica_03_desc:1 "为了和敌人战斗，红修会不羞于使用非常规的手段。在这里她们找到了她们最强大的武器。"
 building_type_castle_von_murnau_01:0 "穆尔瑙的城堡"
 building_type_castle_von_murnau_01_desc:1 "#F 著名裁判官家族的祖宅。一个享有荣耀和财富的地方。#!"
 building_castle_von_murnau_01:0 "穆尔瑙的庄园"
 building_castle_von_murnau_01_desc:1 "品味奢华而又构思精巧，这座庄园和复杂的德意志贵族景观完美地融为一体。"
 building_castle_von_murnau_02:0 "穆尔瑙的城堡"
 building_castle_von_murnau_02_desc:1 "专门预留了一间侧厅用于裁判官事务，穆尔瑙的城堡成为了来访猎人的重要休息处。"
 building_castle_von_murnau_03:0 "穆尔瑙的堡垒"
 building_castle_von_murnau_03_desc:1 "堡垒挑衅着黑暗的仆从，准备好抵御任何威胁。这是家族所受的诅咒和祝福这两者的证明。"
 building_type_the_nest_01:0 "隐匿处"
 building_type_the_nest_01_desc:1 "#F 罗德里格的偏执建成了这座位于潘普洛纳地下的迷宫隧道，期待着有朝一日能在对抗被诅咒的吸血鬼时产生出其不意的效果。#!"
 building_the_nest_01:0 "小隐匿处"
 building_the_nest_01_desc:1 "建得很好，但依然很小，主要是作为圣雅各伯骑士分享信息的安全途径。"
 building_the_nest_02:0 "大隐匿处"
 building_the_nest_02_desc:1 "罗德里格的隧道网络和间谍网覆盖了潘普洛纳的大部分地方，如今成为了伊比利亚裁判所最惊人的财产。"
 building_the_nest_03:0 "坚固的隐匿处"
 building_the_nest_03_desc:1 "任何圣雅各伯的敌人一旦踏入潘普洛纳就不可能活着离开。罗德里格的网络如今准备好应对一切麻烦。"
 building_type_st_cecila_01:0 "圣则济利亚修道院"
 building_type_st_cecila_01_desc:1 "#F 圣约翰修女会的训练总部是一个需要在令人发狂的幻觉海洋里保持宁静和进行冥想的地方。#!"
 building_st_cecila_01:0 "圣则济利亚医院"
 building_st_cecila_01_desc:1 "任何在不列颠群岛受伤的裁判官都知道他们应该感谢博学的修女们能在这里照料他们。"
 building_st_cecila_02:0 "圣则济利亚驱魔师"
 building_st_cecila_02_desc:1 "裁判所最厉害的驱魔师是在圣则济利亚受训的。没有任何异世界的灵魂能抵抗他们的召唤，无论是处于和平或是战争。"
 building_st_cecila_03:0 "圣则济利亚裁判官"
 building_st_cecila_03_desc:1 "修女们是信奉和平的女人，但她们知道敌人不是。少数选择将一生投入到战争中的人拥有着卓越的智慧和虔诚。"
 building_type_everard_players_01:0 "埃弗拉德的演员"
 building_type_everard_players_01_desc:1 "#F 阿拉斯的埃弗拉德名下的著名艺术家剧团实际上是属于神目——裁判所的间谍的最重要的财产之一。#!"
 building_everard_players_01:0 "《阿拉斯的宫廷》"
 building_everard_players_01_desc:1 "让·博德尔写的剧本之一是对圣经中的浪子故事的改编。"
 building_everard_players_02:0 "《圣尼古拉斯》"
 building_everard_players_02_desc:1 "剧本中一位虔诚的圣徒被委托了属于异教徒国王的黄金。"
 building_everard_players_03:0 "《杰纳的虔信者》"
 building_everard_players_03_desc:1 "剧团实际上受到圣雅各伯之剑的骑士们保护。有着如此强力的助臂，演员们总能逃离他们最热情的批评者。"
 building_type_ipeasants_01:0 "掌控农田"
 building_type_ipeasants_01_desc:1 "#F 那些在田野间辛勤劳作，诚实而又畏惧上帝的人们是这个王国和我们的斗争的支柱。#!"
 building_ipeasants_01:0 "布道农民"
 building_ipeasants_01_desc:1 "农奴们很容易被那些上流阶级的人影响，将我们的代理人派到他们之中能确保我们获取他们的支持。"
 building_ipeasants_02:0 "催化农民"
 building_ipeasants_02_desc:1 "乡下人都很害怕，但若被我们的热情赋予力量，他们可以变成我们事业的忠实盟友。\n这个级别需要5以上的发展度来建立并保持启用。"
 building_ipeasants_03:0 "从农民到士兵"
 building_ipeasants_03_desc:1 "合理地煽动他们反抗黑暗力量，这些农民可以变成向我们的权威效忠的有组织的军队。\n这个级别需要10以上的发展度来建立并保持启用。"
 building_ipeasants_04:0 "夏祭战争"
 building_ipeasants_04_desc:1 "农民们的内心因正义的怒火而熊熊燃烧。他们是上帝的愤怒羔羊而我们是他们的羊倌。\n这个级别需要25以上的发展度来建立并保持启用。"
 building_type_ieducation_01:0 "掌控信仰教育"
 building_type_ieducation_01_desc:1 "#F 通过支持教授当地人上帝之言的行动，我们可以帮助他们变得更加虔诚，更有文化和对我们的行动表现出更多的赞同。#!"
 building_ieducation_01:0 "建设主日学校"
 building_ieducation_01_desc:1 "百姓的孩子们需要意识到我们使命的重要性，就算不知道它确切的本质。"
 building_ieducation_02:0 "建设神学院"
 building_ieducation_02_desc:1 "在我们的精心指导下，下一代在此接受教育的牧师们将为我们的事业做好加入的准备。\n这个级别需要10以上的发展度来建立并保持启用。"
 building_ieducation_03:0 "建设神学大学"
 building_ieducation_03_desc:1 "这里是教会的学者塑造教会未来的地方。我们的影响力将确保我们能在其中扮演关键的角色。\n这个级别需要20以上的发展度来建立并保持启用。"
 building_ieducation_04:0 "武化神学"
 building_ieducation_04_desc:1 "由于将涉及到宗教教育有关的一切事物都牢牢掌控在了手里，我们能按照我们的需要修改善与恶的定义。\n这个级别需要30以上的发展度来建立并保持启用。"
 building_type_ioutskirts_01:0 "掌控郊区"
 building_type_ioutskirts_01_desc:1 "#F 一旦被掌控，当地的荒原就能掩蔽我们的行动，而不会反过来帮助我们的敌人#!"
 building_ioutskirts_01:0 "进入统治者的林区"
 building_ioutskirts_01_desc:1 "狩猎区是统治者家庭的专属资产，请求通行权能让我们在其中巡行并找到入侵者"
 building_ioutskirts_02:0 "颁发偷猎者特赦"
 building_ioutskirts_02_desc:1 "森林是偷猎者的家园，在这里违法者并非出于自愿，而是被生存所迫。他们对于这片土地的熟悉值得我们赢得他们的忠诚。\n这个级别需要5以上的发展度来建立并保持启用。"
 building_ioutskirts_03:0 "确保狩猎权利"
 building_ioutskirts_03_desc:1 "通过贿赂，威胁和提供更高的地位，我们可以让森林脱离当地统治者的官方控制。\n这个级别需要10以上的发展度来建立并保持启用。"
 building_ioutskirts_04:0 "领主的树林"
 building_ioutskirts_04_desc:1 "没有哪个住在这片荒原里的猎人，药剂师，采莓人或隐士不是我们的密探。\n这个级别需要25以上的发展度来建立并保持启用。"
 building_type_itownsfolk_01:0 "镇民掌控"
 building_type_itownsfolk_01_desc:1 "#F 人群在这里聚集，金钱在这里流通，我们的事业需要这两方面的支持。#!"
 building_itownsfolk_01:0 "街区传教士"
 building_itownsfolk_01_desc:1 "在这里人们至少假装正派，宣扬拒绝罪恶，荒淫无道的行为差不多必定会被富有同理心的人发现。"
 building_itownsfolk_02:0 "大赦商人"
 building_itownsfolk_02_desc:1 "教会的宽恕可不便宜。我们有办法让它打个折，商人们会对这一不错的交易心存感激。\n这个级别需要10以上的发展度来建立并保持启用。"
 building_itownsfolk_03:0 "收买行会领导层"
 building_itownsfolk_03_desc:1 "如果不能利用信仰，那就依靠人脉方面的承诺，手工艺者们的领头人可以成为有价值的密探。\n这个级别需要15以上的发展度来建立并保持启用。"
 building_itownsfolk_04:0 "神圣企业"
 building_itownsfolk_04_desc:1 "这座城镇的商人和手工艺者们自从我们到来后变得越来越虔诚。看上去这里已经没有可以让那些不虔诚的人做生意的地方。\n这个级别需要30以上的发展度来建立并保持启用。"
 building_type_iunderworld_01:0 "控制下层社会"
 building_type_iunderworld_01_desc:1 "#F 我们的敌人居住在阴影下的国度里。和那里的凡人住民合作虽然不合宜，但是很有必要。#!"
 building_iunderworld_01:0 "援助乞丐和孤儿"
 building_iunderworld_01_desc:1 "正经人会把目光从可怜人身上移开。这也是他们成为无价之宝的一部分原因。"
 building_iunderworld_02:0 "转化常见罪犯"
 building_iunderworld_02_desc:1 "社会已经对这些暴徒，窃贼和骗子关上了大门，但是我们依然有他们的用武之地。\n这个级别需要10以上的发展度来建立并保持启用。"
 building_iunderworld_03:0 "渗透犯罪集团"
 building_iunderworld_03_desc:1 "和犯罪团体的上层做交易一定会给我们带来危害，但是其中的收益或许值得我们这么做。\n这个级别需要15以上的发展度来建立并保持启用。"
 building_iunderworld_04:0 "赦罪"
 building_iunderworld_04_desc:1 "人生来罪恶，让那些基于这一事实谋生的人失业不是我们的优先任务。只要他们为我们的事业作出贡献。\n这个级别需要30以上的发展度来建立并保持启用。"
 building_type_igarrison_01:0 "掌控守军"
 building_type_igarrison_01_desc:1 "这片聚居地的士兵在戒备着他们领主的敌人。我们可以把他们的注意力转到那些更邪恶的敌人身上。#!"
 building_igarrison_01:0 "援助守夜人"
 building_igarrison_01_desc:1 "守夜人的工作无休无止，我们的密探提供的帮助将让他们大为感激。"
 building_igarrison_02:0 "收买守军长官"
 building_igarrison_02_desc:1 "优秀的士兵从来不质疑他们长官下达的命令。这使得后者成为了我们事业的基础。\n这个级别需要5以上的发展度来建立并保持启用。"
 building_igarrison_03:0 "夺取守军控制权"
 building_igarrison_03_desc:1 "我们会采用一切可行的手段确保这些守军的最高等级长官的服从。\n这个级别需要10以上的发展度来建立并保持启用。"
 building_igarrison_04:0 "虔信者要塞"
 building_igarrison_04_desc:1 "驻扎在这座城市的各级士兵服从于我们的代表，心中充满了对保护他们这一神圣使命的自豪。\n这个级别需要30以上的发展度来建立并保持启用。"
 building_type_inquisition_church_01:0 "裁判教堂"
 building_type_inquisition_church_01_desc:1 "#F 虔信者们，我们的兄弟和姐妹，需要一个免受吸血鬼影响的聚集地，一个用来冥想的地方。#!"
 building_inquisition_church_01:0 "裁判礼拜堂"
 building_inquisition_church_01_desc:1 "一个由上帝的骑士们保护的宁静的小地方。沙漠里的一处绿洲。"
 building_inquisition_church_02:0 "裁判教堂"
 building_inquisition_church_02_desc:1 "在这里，吸血鬼腐化的影响被拒之门外。"
 building_inquisition_church_03:0 "大裁判教堂"
 building_inquisition_church_03_desc:1 "黑暗世界中的一座灯塔。希望能有更多的后继者。\n这个级别需要20以上的发展度来建立并保持启用。"
 building_inquisition_church_04:0 "大总主裁判教座堂"
 building_inquisition_church_04_desc:1 "铭记我们的虔诚的丰碑，它高高地矗立在岛上，对于邪恶力量来说是一项十足的挑战。\n这个级别需要25以上的发展度来建立并保持启用。"
 building_type_inquisition_office_01:0 "裁判所办公处"
 building_type_inquisition_office_01_desc:1 "#F 一个让我们远离窥视用来进行管理的地方。#!"
 building_inquisition_office_01:0 "办公室"
 building_inquisition_office_01_desc:1 "一个隐藏良好的空间来存储和处理我们的文件。"
 building_inquisition_office_02:0 "偏远办公所"
 building_inquisition_office_02_desc:1 "一栋低调的住宅，于此我们可以在不引起他人注意的情况下协调我们的行动。"
 building_inquisition_office_03:0 "办公楼"
 building_inquisition_office_03_desc:1 "位于城镇最繁华地段的一栋显眼的办公楼，镇里最富有和最有影响力的居民都来此办公。\n这个级别需要20以上的发展度来建立并保持启用。"
 building_inquisition_office_04:0 "办公城区"
 building_inquisition_office_04_desc:1 "城里专门留给我们的兄弟和姐妹的区域。不会有人质疑我们对当地和区域内的事务的支配权。\n这个级别需要25以上的发展度来建立并保持启用。"
 building_type_inquisition_palace_01:0 "裁判所宫殿"
 building_type_inquisition_palace_01_desc:1 "#F 一个让我们的骑士聚集、训练和办宴的地方。#!"
 building_inquisition_palace_01:0 "猎人小屋"
 building_inquisition_palace_01_desc:1 "A remote estate suitable for engaging in every knight's favourite earthly pastime."
 building_inquisition_palace_02:0 "裁判所府邸"
 building_inquisition_palace_02_desc:1 "An elegant residence where hospitality meets the highest of standards."
 building_inquisition_palace_03:0 "裁判所宫殿"
 building_inquisition_palace_03_desc:1 "A splendid palace, testament to the nobility of our cause. Few nobles of this land would ever consider refusing an invitation.\nThis level requires more than 20 development to build and stay enabled."
 building_inquisition_palace_04:0 "裁判所大宫殿"
 building_inquisition_palace_04_desc:1 "Our venerable house, opulent and imperial. Suitable to host kings, emperors and the Holy Father himself.\nThis level requires more than 25 development to build and stay enabled."
 building_type_inquisition_armory_01:0 "裁判所军械库"
 building_type_inquisition_armory_01_desc:1 "#F Maintaining a significant military presence of our own in this region requires adequate infrastructure.#!"
 building_inquisition_armory_01:0 "武器储藏处"
 building_inquisition_armory_01_desc:1 "Few of our agents are ever unarmed, but some tasks require heavier equipment. Then, these caches come handy."
 building_inquisition_armory_02:0 "裁判所军械库"
 building_inquisition_armory_02_desc:1 "These halls filled with weapons and armour ensure our preparedness should the darkness rear its head."
 building_inquisition_armory_03:0 "裁判所武器工坊"
 building_inquisition_armory_03_desc:1 "Producing our own equipment is the best way to ensure it meets the unusual requirements our mission entails.\nThis level requires more than 20 development to build and stay enabled."
 building_inquisition_armory_04:0 "裁判所军事学院"
 building_inquisition_armory_04_desc:1 "In this extensive complex of military installations our knights are able to forge commoners into formidable weapons against evil.\nThis level requires more than 25 development to build and stay enabled."
 building_type_inquisition_keep_01:0 "裁判所城堡"
 building_type_inquisition_keep_01_desc:1 "#F A place to keep all kinds of things safe, be it ourselves, our prisoners or our secrets. #!"
 building_inquisition_keep_01:0 "裁判所塔楼"
 building_inquisition_keep_01_desc:1 "The first physical manifestation of the protection we grant to these lands."
 building_inquisition_keep_02:0 "裁判所主楼"
 building_inquisition_keep_02_desc:1 "Only our agents enter this fortification unnoticed, only screams leave it that way."
 building_inquisition_keep_03:0 "裁判所城堡"
 building_inquisition_keep_03_desc:1 "A formidable stronghold against our vile enemies. Our schemes and machinations sprout from here like blood from an artery.\nThis level requires more than 20 development to build and stay enabled."
 building_inquisition_keep_04:0 "裁判所堡垒"
 building_inquisition_keep_04_desc:1 "A mountain of stone and eager steel as unassailable as our faith. No sentient creature of the night is mad enough to attack it directly.\nThis level requires more than 25 development to build and stay enabled."
 building_type_inquisition_contact_01:0 "联系友方修会"
 building_type_inquisition_contact_01_desc:1 "#F Although we are few and our mission must remain secret, we are not alone in our struggle.#!"
 building_inquisition_contact_01:0 "秘密情报交换点"
 building_inquisition_contact_01_desc:1 "A designated spot to exchange encrypted messages and share expertise with our fellow brothers and sisters in utmost secrecy."
 building_inquisition_contact_02:0 "会面地点"
 building_inquisition_contact_02_desc:1 "A place discreet enough for our order's agents to meet their counterparts face to face.\nThis level requires more than 10 development to build and stay enabled."
 building_inquisition_contact_03:0 "周度会议"
 building_inquisition_contact_03_desc:1 "A regular gathering of experts in the field of combating the forces of hell taking place in privacy of our holdings.\nThis level requires more than 20 development to build and stay enabled."
 building_type_inquisition_acre_01:0 "亚柯骑士训练场"
 building_type_inquisition_acre_01_desc:1 "#F Here our brothers perfect their holy craft of vanquishing the devil's servants.#!"
 building_inquisition_acre_01:0 "陪练场"
 building_inquisition_acre_01_desc:1 "A secluded meadow with plenty of room for combat training."
 building_inquisition_acre_02:0 "训练营地"
 building_inquisition_acre_02_desc:1 "A forest training encampment with plenty enough infrastructure and expertise in place to benefit even the most seasoned warriors.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_acre_03:0 "比武大赛"
 building_inquisition_acre_03_desc:1 "A jousting tournament under our patronage attracts the land's finest knights. The grounds provide a valuable training facility off season.\nThis level requires more than 10 development to build and stay enabled."
 building_type_inquisition_james_01:0 "圣雅各伯骑士团住宿所"
 building_type_inquisition_james_01_desc:1 "#F Providing safety and hospitality to pilgrims was our primary purpose and remains our specialty.#!"
 building_inquisition_james_01:0 "朝圣招待所"
 building_inquisition_james_01_desc:1 "A modest establishment, but a welcome sight to a tired pilgrim nevertheless. Or a tired soldier of God in times more dire."
 building_inquisition_james_02:0 "朝圣旅店"
 building_inquisition_james_02_desc:1 "A lively, spacious and warm place with enough infrastructure to cater to the needs of travelers, whatever their purpose. \nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_james_03:0 "朝圣住宿大院"
 building_inquisition_james_03_desc:1 "A bustling complex of buildings serving as a versatile logistics nexus to those driven by faith.\nThis level requires more than 10 development to build and stay enabled."
 building_type_inquisition_john_01:0 "圣约翰慈善修女会"
 building_type_inquisition_john_01_desc:1 "#F We serve the poor, the sick and the suffering without expectations of earthly rewards, yet the fruits of our effort reward us nonetheless.#!"
 building_inquisition_john_01:0 "救济粥棚"
 building_inquisition_john_01_desc:1 "A humble, but much appreciated initiative to provide food for those in need."
 building_inquisition_john_02:0 "移动医院"
 building_inquisition_john_02_desc:1 "A caravan of carts and wagons containing everything needed to provide care in remote places.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_john_03:0 "庇护所"
 building_inquisition_john_03_desc:1 "A safe and generous place to the realm's unfortunate. A small semblance of God's heavenly grace here on earth.\nThis level requires more than 10 development to build and stay enabled.\"building_type_inquisition_acre_01:0 \"Knights of Acre Cell"
 building_type_inquisition_red_01:0 "红修会图书馆"
 building_type_inquisition_red_01_desc:1 "#F A place where words of God, words of men and words in tongues most unholy are made useful for our sacred cause.#!"
 building_inquisition_red_01:0 "地下墓穴图书馆"
 building_inquisition_red_01_desc:1 "An underground crypt hosting not only the mortal remains of friars, but our most treasured tomes."
 building_inquisition_red_02:0 "修道院图书馆"
 building_inquisition_red_02_desc:1 "A section of a local monastery dedicated to our sensitive research. Inaccessible to the uninitiated.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_red_03:0 "禁忌图书馆"
 building_inquisition_red_03_desc:1 "A city block packed to the brim with manuscripts and grimoires too dangerous to remain outside our exclusive custody.\nThis level requires more than 10 development to build and stay enabled.\"building_type_inquisition_acre_01:0 \"Knights of Acre Cell"
 building_type_inquisition_murnau_01:0 "冯·穆尔瑙家族宅第"
 building_type_inquisition_murnau_01_desc:1 "#F The honest, God-fearing people toiling in the fields are the backbone of this realm and our struggle.#!"
 building_inquisition_murnau_01:0 "冯·穆尔瑙住房"
 building_inquisition_murnau_01_desc:1 "An urban residence not befitting the von Murnau name, but a useful outpost of our influence nonetheless."
 building_inquisition_murnau_02:0 "冯·穆尔瑙豪宅"
 building_inquisition_murnau_02_desc:1 "A luxurious abode for members of the family just as suitable to guest local men of importance.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_murnau_03:0 "冯·穆尔瑙市内宫殿"
 building_inquisition_murnau_03_desc:1 "A majestic marvel of architecture exemplifying the dynasty's splendor.\nThis level requires more than 10 development to build and stay enabled."
 building_type_inquisition_oculi_01:0 "神目之室"
 building_type_inquisition_oculi_01_desc:1 "#The eyes speak, but are seldom heard. Conducting our affairs in seclusion ensures this.#!"
 building_inquisition_oculi_01:0 "安全屋"
 building_inquisition_oculi_01_desc:1 "A chamber in a row of identical chambers with seemingly nothing special about it."
 building_inquisition_oculi_02:0 "迷宫"
 building_inquisition_oculi_02_desc:1 "A spacious underground hub of connected cellars with each entrance safely under our control.\nThis level requires more than 5 development to build and stay enabled."
 building_inquisition_oculi_03:0 "隧道网络"
 building_inquisition_oculi_03_desc:1 "An intricate web of interconnected basements, dungeons, sewers and caves. Allows for crossing great distances without being seen.\nThis level requires more than 10 development to build and stay enabled."
 building_type_elysium_01:0 "秘盟乐土"
 building_type_elysium_01_desc:1 "#F The focal point of kindred social life where the Prince holds their court. A place free from violence but not vicious struggle for prominence.#!"
 building_elysium_01:0 "特设乐土"
 building_elysium_01_desc:1 "A spot chosen for its safety and convenience, not illustriousness. Won't impress anyone notable, but the patrons appreciate it nonetheless."
 building_elysium_02:0 "互敬乐土"
 building_elysium_02_desc:1 "A proper establishment for kindred culture to blossom. The very walls of the locale encourage adherence to etiquette."
 building_elysium_03:0 "杰赫乐土"
 building_elysium_03_desc:1 "A vital nexus in the web of Camarilla's social connections. The Prince presiding over such a refined establishment enjoys worldwide recognition."
 building_type_haven_01:0 "魔宴密所"
 building_type_haven_01_desc:1 "#F To the ever-militant packs of the Sabbat, this place is both a family home and an armed outpost.#!"
 building_haven_01:0 "群体密所"
 building_haven_01_desc:1 "Although secure enough to hold communal rites and launch armed operations, this place could use more dignity and infrastructure."
 building_haven_02:0 "公共密所"
 building_haven_02_desc:1 "This solemn hybrid of a temple, military barracks and a lounge constitutes a building block in the architecture of the Jyhad."
 building_haven_03:0 "黑手支柱"
 building_haven_03_desc:1 "A rare, permanent haven of the Sabbat's most feared warriors. Only places vital to the sect's interest warrant their dreadful presence."