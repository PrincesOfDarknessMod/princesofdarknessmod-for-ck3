l_simp_chinese:
 beer_merchant.1.t:0 "啤酒商人"
 beer_merchant.1.desc:0 "一位商人走进你的办公室，恭恭敬敬地跟你打招呼，并向你解释他来访的原因：「在这片土地上旅行的时候，我在北边的一个修道院住了一夜。而修士们给我端来了我尝过的最美味的啤酒。啤酒是我的行业，我询问是否有可能从他们庞大且不断增长的库存中买入一部分卖给我的客户。有人让我向『上级』提议。我对谁是『上级』的调查让我找到了您，阁下。我们可以做个交易吗？」"
 beer_merchant.a:0 "你说是最好喝的？我们最好自己卖。"
 beer_merchant.a.success.ctt:0 "你将尝试建立自己的分销网络来卖啤酒。"
 beer_merchant.a.success.tt:0 "这可以补充我们的收入。"
 beer_merchant.a.failure.ctt:0 "你在商界的冒险只让你蒙了羞。"
 beer_merchant.a.failure.tt:0 "你将失去虔诚。"
 beer_merchant.b:0 "有比啤酒更神圣的大业需要有敏锐判断力和钱财相关才能的人。"
 beer_merchant.b.success.ctt:0 "你将招募该商人作为你的手下。"
 beer_merchant.b.success.tt:0 "一名老练的财政总管会加入你的宫廷"
 beer_merchant.b.failure.ctt:0 "商人见不到加入你的好处。"
 beer_merchant.b.failure.tt:0 "他将继续他的旅程。"
 beer_merchant.c:0 "我们不需要商人，只需要他的客户清单。"
 beer_merchant.c.success.ctt:0 "你要把商人灌醉，让他说出他的联系方式。"
 beer_merchant.c.success.tt:0 "轻松获利。"
 beer_merchant.c.failure.ctt:0 "那商人不会让自己被孤立的。"
 beer_merchant.c.failure.tt:0 "你的不正当手段将被曝光。"
 beer_merchant.a.success.t:0 "人总是不满足。"
 beer_merchant.a.success.desc:0 "商人的直觉是正确的，啤酒在消费者中广受欢迎，而你的分销网络近乎无法满足需求。"
 beer_merchant.a.success:0 "敬健康！"
 beer_merchant.a.failure.t:0 "找不到买家。"
 beer_merchant.a.failure.desc:0 "只有信仰和信念并不能使一个人精通市场营销，你无法吸引任何人对你的产品有注意。"
 beer_merchant.a.failure:0 "啤酒，有谁要么？"
 beer_merchant.b.success.t:0 "新的使命。"
 beer_merchant.b.success.desc:0 "从与商人的对话中可以看出，尽管他认为自己是一个幸运的人，但他总是渴望参与比积累财富更伟大、更有意义的事情。在忏悔的鼓舞下揭开了秘密的面纱后，你向他介绍了一直在呼唤他的大业。"
 beer_merchant.b.success:0 "你分发过了啤酒，现在该分发希望。"
 beer_merchant.b.failure.t:0 "继续做啤酒生意。"
 beer_merchant.b.failure.desc:0 "你笨拙地试图说服商人相信他在尘世的追求是空虚的，再加上你无法提供足够诱人的替代选择，这让他感到困惑又被冒犯，找借口离开了你的办公室。"
 beer_merchant.b.failure:0 "再多的钱也买不到这个傻瓜的救赎。"
 beer_merchant.c.success.t:0 "直中买家。"
 beer_merchant.c.success.desc:0 "你假装关心供应修士啤酒的场所，再加上不断地为商人斟酒，将商人的自信变成了自负。酒还没喝完，他就像在背诵一样列举了他的客户。你的计划非常成功，你的秘书躲在门后，仔细地做着笔记，这是你今晚最重要的事情。"
 beer_merchant.c.success:0 "你又想要什么？"
 beer_merchant.c.failure.t:0 "商人识破了你的诡计。"
 beer_merchant.c.failure.desc:0 "当你提议再喝一杯时，商人突然疑惑地看着你，并提醒你节制的美德。"
 beer_merchant.c.failure:0 "好吧，保护好你的秘密。"
 beer_merchant.d.t:0 "成交。"
 beer_merchant.d.desc:0 "你有比卖啤酒更重要的任务要做，而预付资金是你最喜欢的安排。"
 beer_merchant.d:0 "很高兴与你做生意。"
 heretic_event.1.t:0 "异端动摇贵族性"
 heretic_event.1.desc:0 "一位当地的贵族找你谈了一件他认为需要你关注的事情。一名有魅力的传教士住进了他的领地，引用《圣经》开始煽动农奴们反对他们的领主，据说内容是谴责任何形式的誓约和宣誓效忠。他认为这种颠覆性的学说破坏了他的职权，并希望你能处理好这名麻烦的革命家。"
 heretic_event.1.a:0 "处理异端这种事不在我们的管辖范围。"
 heretic_event.1.b:0 "他说他了解圣经？让我们见识见识。"
 heretic_event.1.c:0 "你想把他烧掉？当然，我们可以烧死他。"
 heretic_event.1.a.success.ctt:0 "你对自己在教会等级制度中的优越地位的模糊描述让贵族们眼花缭乱。"
 heretic_event.1.a.success.tt:0 "你将获得虔诚。"
 heretic_event.1.a.failure.ctt:0 "贵族会认为你是个挪用教堂资金的懒人。"
 heretic_event.1.a.failure.tt:0 "你将失去虔诚。"
 heretic_event.2.t:0 "神学辩论"
 heretic_event.2.desc:0 "传教士相信他的主张是有圣经背书的，但是识字并不能赋予一个人将圣经解释为教义所需的知识。我们将通过让他参与一场关于他的思想的神学辩论来测试他的知识。问题是我们的目标是什么。"
 heretic_event.2.a:0 "通过逼迫他承认自己是异端，使其自证其罪。"
 heretic_event.2.a.success.ctt:0 "传教士会暴露出自己是异端。"
 heretic_event.2.a.success.tt:0 "你要惩治异端，获得虔诚。"
 heretic_event.2.a.failure.ctt:0 "传教士要为自己的论题辩护，而不说违背教会既定教义的话。"
 heretic_event.2.a.failure.tt:0 "必须作出决定。"
 heretic_event.2.b:0 "让他看看教育不足的隐患。"
 heretic_event.2.b.success.ctt:0 "你会以卓越的神学知识打动传教士。"
 heretic_event.2.b.success.tt:0 "传教士加入了你的宫廷。"
 heretic_event.2.b.failure.ctt:0 "你让传教士意识到自己错误的尝试失败了。"
 heretic_event.2.b.failure.tt:0 "传教士会被释放，而你会失去威望。"
 heretic_event.211.t:0 "异端见着了火刑架"
 heretic_event.211.desc:0 "用圣经来挑起麻烦是不值得的。"
 heretic_event.212.t:0 "传教士避免自证其罪。"
 heretic_event.212.desc:0 "这位传教士小心翼翼地选择措辞，并把他的论点建立在普遍接受的假设之上，他成功地阐明了自己的观点，而没有涉足到异端邪说的领域。"
 heretic_event.212.a:0 "伶牙俐齿的人是最差劲的那种，烧死他。"
 heretic_event.212.a.tt:0 "即使没有什么正当的理由，你将会处死传教士，"
 heretic_event.212.b:0 "我想我们得放他走。"
 heretic_event.212.b.tt:0 "传教士将会被释放。"
 heretic_event.2121.t:0 "除非被证明是无辜的，否则他就是有罪。"
 heretic_event.2121.desc:0 "传教士可能是一个熟练而谨慎的演说家，但他仍然是一位异端。你知道他那些含糊其辞的暗示有多邪恶。他可能不愿意认罪，但他那令人讨厌的古怪行为足以判他死刑。当你宣判的时候，有什么在困扰着你，这种情况让你想起了什么，但你又不能确切地说出来。"
 heretic_event.2121.a:0 "字写在了纸上，就不能再收回。"
 heretic_event.2122.t:0 "传教士自由了。"
 heretic_event.2122.desc:0 "没有是异端的证据，就没有异端供你判刑。"
 heretic_event.221.t:0 "传教士加入了你的大业。"
 heretic_event.221.desc:0 "被你的知识和虔诚所感动，传教士决定留在你身边接受教导。"
 heretic_event.222.t:0 "传教士得意洋洋地离开了。"
 heretic_event.222.desc:0 "你失去了对辩论的控制也失去了囚禁传教士的理由。"
 heretic_event.11.t:0 "该贵族很惊讶"
 heretic_event.11.desc:0 "你间接地暗示你太位高任重了，没法帮助他，贵族对此感到尊重而非生气。"
 heretic_event.12.t:0 "该贵族很失望"
 heretic_event.12.desc:0 "你拒绝帮忙的行为降低了你在当地贵族中的地位。"
 heretic_event.3.t:0 "异端见着了火刑架"
 heretic_event.3.desc:0 "我们可能永远无法确定他是否符合被称为异端的形式标准，但他确实像异端一样燃烧。"
 defeated_general.1.t:0 "遭受挫败的将军"
 defeated_general.1.desc:0 "你的一个办公室职员带着一件非常微妙的事情来找你。说是有一位曾经声名显赫的将军，如今声名狼藉的忏悔者。自从被委派领导的一场战役变成一场灾难后，一种严重罪行的诱惑一直困扰着他，那就是自杀之罪。职员感到无能为力，并觉得认为你能做的更好，于是委托你让这个失败的人重拾希望。你们都去了他的住处，仆从让你进入指挥官的办公室，你看到他瘫坐在扶手椅上。简短而尴尬的介绍过后，将军对你说：「我不能再这样生活下去了，失去荣耀的阴影压得我喘不过气来。」"
 defeated_general.1.a:0 "我的好伙计，真正的辉煌日子还在后头呢!"
 defeated_general.a.success.ctt:0 "你要让将军重新振作精神，通过说服他全身心投入到你的大业中。"
 defeated_general.a.success.tt:0 "将军加入了你，摆脱了绝望。"
 defeated_general.a.meh.ctt:0 "将军会尝试为你工作，但他的精神还崩溃着。"
 defeated_general.a.meh.tt:0 "将军以坏掉的人的样子加入了你。"
 defeated_general.a.failure.ctt:0 "没有什么能让将军相信加入你的大业会让事情好转。"
 defeated_general.a.failure.tt:0 "将军将自杀。"
 defeated_general.1.b:0 "跟我说说那场战役的事情。"
 defeated_general.b.success.ctt:0 "你可以和将军进行一场有关军事问题的谈话，让他表达自己的悲痛。"
 defeated_general.b.success.tt:0 "你会得到一位战争方面的导师。"
 defeated_general.b.failure.ctt:0 "将军会因为你缺乏了解而不愿开口。"
 defeated_general.b.failure.tt:0 "将军没有在你身边找到安慰。"
 defeated_general.1.c:0 "我们可以确保你会有一个基督教式的葬礼。"
 defeated_general.1.c.tt:0 "你会为了经济利益而促成将军的自杀。"
 defeated_general.111.t:0 "新提议"
 defeated_general.111.desc:0 "「比撒拉逊人更可怕的敌人……一场长达千年的秘密战争……来自圣父本人的使命……是的，是的，我知道这会让我过去的职业失误变得相对无关紧要。阁下，我效忠于您！」"
 defeated_general.111.a:0 "你必以此而胜！"
 defeated_general.112.t:0 "勉强服务"
 defeated_general.112.desc:0 "「我不知道什么『神圣目的』之类的事，但如果你需要一个指挥官，我想指挥士兵总比在这里腐烂要好。」"
 defeated_general.112.a:0 "我想也是这样。"
 defeated_general.113.t:0 "当希望崩塌"
 defeated_general.113.desc:0 "「回到军队？好让更多好人因我而死？去你的！滚出我家，马上！」"
 defeated_general.113.a:0 "我听到凳子摔倒的声音了吗？"
 defeated_general.21.t:0 "从过去的错误学习"
 defeated_general.21.desc:0 "将军开始讲他的故事，但到了关于麻烦的部分犹豫了。但一个热切并用心倾听的人让他选择继续了下去。你向将军保证，没有人会谴责他当时所掌握的信息。从一个显然很了解军事情况的人那里听到这句话，对这个饱受折磨的人来说是一个巨大的解脱。在他讲完故事后，你们又花了几个小时讨论军事战略。当你终于离开时，仆人低声说：「谢谢你，自战后我就没见过他笑过。」"
 defeated_general.21.a:0 "让我们把这当成一件平常的事！"
 defeated_general.22.t:0 "被误解的士兵困境"
 defeated_general.22.desc:0 "将军开始讲述他的故事，但很快得出结论，任何试图解释他的悲剧的尝试都是浪费时间。你问问题时脸上困惑的表情暴露了你军事知识的缺乏，哪怕你的善意足够。「怎么说……事情变得糟透了。也许我改天再详细说明。我请求您的原谅，我尊贵的客人，但我现在实在是太累了。」"
 defeated_general.22.a:0 "也许我来的时候应该准备得更充分些。"
 defeated_general.3.t:0 "秃鹫的盛宴"
 defeated_general.3.desc:0 "将军在意识到你的提议后，看起来很震惊。很快，解脱和决心克服了他脸上的严峻表情。「好吧，我会把你写进我的遗嘱里。我必须说，我没有预料到这次会议的结果会是这样。但我想我一直都是傻瓜。别了。」"
 defeated_general.3.a:0 "钱无臭味，正如他们所说。"
 donors_daughter.1.t:0 "捐赠者的女儿"
 donors_daughter.1.desc:0 "An abbey hosting your regional base of operations is visited by a young noblewoman. She introduces herself as a daughter of a recently deceased friend of the cause, yet remains unaware why her father supplied you with funds and was tasked by her sibilings to investigate. Reading between the lines of her introduction makes it clear that the donor must have failed to prepare a written will and his children's decision to honour his dying wish of devoting a share of their inheritance to your cause will depend on this girl's impression of you.\n\n'Will Your Excellence show me around? I want to see everything that you do here.' - she asks."
 donors_daughter.1.a:0 "很乐意，女士，但你看，侧翼正在翻新……"
 donors_daughter.1.a.success.tt:0 "你会说服她省过敏感的地方。"
 donors_daughter.1.a.failure.tt:0 "女孩将看穿你的借口。"
 donors_daughter.1.a.success.ctt:0 "这次访问将会有一个更有利的结果。"
 donors_daughter.1.a.failure.ctt:0 "这次访问将会有一个不太好的结果。"
 donors_daughter.1.b:0 "嗯……好吧。"
 donors_daughter.1.c:0 "我们在大厅接待访客，其他一切都禁止入内。"
 donors_daughter.2.t:0 "捐赠者的女儿：你才华横溢的员工"
 donors_daughter.2.desc:0 "As you walk through the main hall, the young noblewoman notices the monk scribes handling your documents.\n'Oh, I heard a choir of monks singing one time at my aunt's funeral, it was so beautiful! Please, make them sing for me.' - she pleads."
 donors_daughter.2.a:0 "相信我，孩子，这些僧侣唱得很烂。"
 donors_daughter.2.a.success.tt:0 "女孩会被你对她耳朵的关心所吸引。"
 donors_daughter.2.a.failure.tt:0 "女孩会认为她的愿望不受尊重。"
 donors_daughter.2.a.success.ctt:0 "这次访问将会有一个更有利的结果。"
 donors_daughter.2.a.failure.ctt:0 "这次访问将会有一个不太好的结果。"
 donors_daughter.2.b:0 "你听到女士说的了。"
 donors_daughter.2.c:0 "他们在这里的任务不是招待客人。"
 donors_daughter.3.t:0 "捐赠者的女儿：诱人的服装"
 donors_daughter.31.desc:0 "When you reach your office chamber the visitor's gaze turns towards the headcap of Saint Wiborada a holy relic you proudly display on a dedicated stand. 'What a peculiar garment, I've never seen one in this style. It must be very old. I want to try it on!' she exclaims as the office clerks turn to you with worried expressions.."
 donors_daughter.32.desc:0 "When you reach your office chamber the visitor's gaze turns towards the veil of Saint Belina, a holy relic you proudly display on a dedicated stand. 'What a peculiar garment, I've never seen one in this style. It must be very old. I want to try it on!' she exclaims as the office clerks turn to you with worried expressions."
 donors_daughter.33.desc:0 "When you reach your office chamber the visitor's gaze turns towards the cloak of Saint Ludmila, a holy relic you proudly display on a dedicated stand. 'What a peculiar garment, I've never seen one in this style. It must be very old. I want to try it on!' she exclaims as the office clerks turn to you with worried expressions."
 donors_daughter.3.a:0 "女士，那东西太脏了。"
 donors_daughter.3.a.success.tt:0 "女孩会认为那是借口。"
 donors_daughter.3.a.failure.tt:0 "女孩将重新评价这件衣服的吸引力。"
 donors_daughter.3.a.success.ctt:0 "这次访问将会有一个更有利的结果。"
 donors_daughter.3.a.failure.ctt:0 "这次访问将会有一个不太好的结果。"
 donors_daughter.3.b:0 "去吧。"
 donors_daughter.3.c:0 "算了吧，小姐。"
 donors_daughter.4.t:0 "捐赠者的女儿：抉择时刻"
 donors_daughter.4.desc:0 "After you finally managed to bore the young lady senseless by listing all the charitable initiatives her father's money helped funding, both those actually taking place and those serving as cover for other operations, she decided she's seen and heard enough. You will know the extent of her generosity before she departs."
 donors_daughter.4.a:0 "她似乎很喜欢这里。"
 donors_daughter.4.b:0 "希望她在这里过得愉快。"
 donors_daughter.4.c:0 "希望她在这里过得愉快。"
 donors_daughter.4.d:0 "她最好还是走吧。"
 donors_daughter.4.e:0 "我才不管那小鬼过得开心不开心呢。"
 donors_daughter.5.t:0 "捐赠者的女儿：吸引超过预期"
 donors_daughter.5.desc:0 "'Your Excellence is the most magnanimous servant of Christ I have ever met. I'm still not entirely sure what you're doing here, but whatever it is, with you at the helm it deserves every piece of silver my family set aside but also a personal donation from me.'"
 donors_daughter.5.a:0 "是我的荣幸，女士。"
 donors_daughter.6.t:0 "捐赠者的女儿：足够的接待"
 donors_daughter.6.desc:0 "'Your Excellence is as pious as your cause and it would be impious of me to leave here without donating the entire sum I was authorized to part with. My father always managed our money well and I see this is no exception. Godspeed.'"
 donors_daughter.6.a:0 "再会吧。"
 donors_daughter.7.t:0 "捐赠者的女儿：缺乏接待"
 donors_daughter.7.desc:0 "'I think I've seen enough. I can't say I quite understand my father's devotion to supporting your endeavours, but if parting with this sum keeps me safe in the knowledge that his dying wish was fulfilled, so be it. Farewell, Your Excellence.'"
 donors_daughter.7.a:0 "那根本不值得花时间。"
 donors_daughter.8.t:0 "捐赠者的女儿：坏印象"
 donors_daughter.8.desc:0 "'Your Excellence's hospitality leaves much to be desired. I've never known my father to associate himself with such unpleasant individuals and whatever his business with you was, it is not something we wish to continue in this family. Farewell to you.'"
 donors_daughter.8.a:0 "我应该雇些人来做这件事。"
 donors_daughter.9.t:0 "捐赠者的女儿：偶像转变"
 donors_daughter.9.desc:0 "'Your Excellence disregarded my every request and made no effort to accommodate me in a way that befits a noblewoman, I feel I should turn on my heel and leave you with nothing, but at the same time I am awe-stricken by your dignity and focus. All my life I have been pampered and surrounded by sycophants reaching for scraps of my family wealth, you are different. It's clear your calling directs your eyes above this pettiness and whatever it is, I want to be a part of it. Staying here was never a part of the agreement I made with my brothers and I'm afraid I wouldn't be able to represent the estate if I made that choice, but I beg you, Your Excellence, free me from this meaningless, profligate existence and let me serve you.'"
 donors_daughter.9.a:0 "你还有很多要学，我的孩子。"
 donors_daughter.9.a.t:0 "这位年轻的贵族小姐加入了你的宫廷。"
 donors_daughter.9.a.desc:0 "[ddaughter.GetShortUIName]随时准备为大业服务。"
 donors_daughter.9.b:0 "一个值得称赞的追求，只是我们不缺人。"