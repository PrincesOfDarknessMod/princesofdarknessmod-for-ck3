 EARTH_SENSE_PERK_EFFECT:0 "#F The Garou can feel the “aura” of an area and determine if it is healthy or blighted.#!"
 HERB_CALL_PERK_EFFECT:0 "#F Through singing or chanting, a Garou can find helpful or medicinal plants, roots or bark even in poor areas such as deserts.#!"
 OAKSONG_PERK_EFFECT:0 "#F By using this Gift, a Garou can communicate with inanimate objects made of wood or some other organic substance.#!"
 LORE_OF_THE_LAND_PERK_EFFECT:0 "#F By eating, smoking or otherwise taking in a portion of the land, the Garou can sense things that happened in the immediate vicinity in the past.#!"
 EARTH_HEAL_PERK_EFFECT:0 "#F This Gift allows the Garou to help a piece of land recover from blight, Wyrm-taint, poisoning or some other type of environmental disturbance.#!"
 LAMBENT_SIGHT_PERK_EFFECT:0 "#F This Gift allows the Garou the ability to see under circumstances where sight would normally be impossible, such as in conditions of total darkness or if the Garou is blindfolded. #!"
 MOONPOOL_OF_SOKHTA_PERK_EFFECT:0 "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n#F 这种灵赋使狼族能够将清澈的积水变成月池，展现可能的未来的前景。#!"
 MOONRIVER_PERK_EFFECT:0 "#F By using this Gift, the Garou may swiftly travel across the surface of a body of water which reflects the moonlight.#!"
 MOONCAT_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_mooncat_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 该灵赋允许狼族变成一只小白猫。这能对于进入小地方（或逃离小地方）和保持隐蔽很有用。#!"
 MOONDREAM_PERK_EFFECT:0 "#F The Garou petitions Sokhta to grant her a prophetic dream before she falls asleep beneath the light of the moon.#!"
 FIND_THE_HEARTS_FLAME_PERK_EFFECT:0 "#F With this Gift the Garou can identify sources of energy or power, even when they are hidden or unfamiliar.#!"
 FLAME_OF_THE_WIND_RIDER_PERK_EFFECT:0 "#F This Gift makes the Garou harder to damage by engulfing her in a ghostly blue-white flame.#!"
 RIDE_THE_SOLAR_WINDS_PERK_EFFECT:0 "灵游花费时间：#P -20%#!。\n#F 该灵赋使狼族能够驾驭席卷以太界的太阳风，而不必担心被风暴抛离方向。#!"
 HAND_OF_THE_SUN_PERK_EFFECT:0 "#F The Garou’s hand blazes with a terrible heat and gives off a white-hot light, similar to a branding iron.#!"
 CLEANSING_FLAME_PERK_EFFECT:0 "#F The Garou can pinpoint an area (or an individual) and set the target ablaze with an intense and purifying flame. The fire can burn out all Wyrm-taint or human-made pollution from an area or cleanse an individual (provided the victim survives) of Wyrm-taint. #!"
 SPEED_OF_THE_MESSENGER_PERK_EFFECT:0 "#F This Gift increases the movement rate of the Garou so that he can travel long distances in short periods of time.#!"
 PLANETARYGIFTS_STICKY_FINGERS_PERK_EFFECT:0 "#F This trick coats the fingers of a Garou with a silvery substance that adheres to anything, making it possible to climb vertical surfaces with ease.#!"
 PLANETARYGIFTS_DELIBERATE_MISINFORMATION_PERK_EFFECT:0 "#F The Garou can slip confusing and contrary information into his target’s conversation, making their plans fall apart or otherwise causing them to suffer from a gross breakdown in communications.#!"
 MERCURIAL_MESSENGER_PERK_EFFECT:0 "#F This Gift enables a Garou who overhears a conversation or who is entrusted with a message to remember what she has heard.    #!"
 MADTHOUGHT_PERK_EFFECT:0 "#F The Garou can cause her enemies’ thought processes to speed up so radically that they literally think too rapidly to put any one plan into motion.#!"
 UNCLOAK_THE_HIDDEN_PERK_EFFECT:0 "#F By concentrating on a person, object or area, the Garou can determine whether or not her target is hiding anything.#!"
 SHADOW_OF_THE_EBON_WHISPERER_PERK_EFFECT:0 "#F This Gift makes the Garou as insubstantial as a shadow and as hard to see.#!"
 HIDDEN_HEART_PERK_EFFECT:0 "#F This Gift allows the Garou to take a dangerous piece of knowledge she possesses and lock it away in her mind so that it becomes inaccessible without a key.#!"
 WHISPER_IN_THE_DARK_PERK_EFFECT:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 这种天赋允许狼族确定一个对某个体不利的事实。#!"
 PLANETARYGIFTS_EBON_BINDING_PERK_EFFECT:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\nAs a [character_interaction|E], allows you give [GetModifier('ebon_binding_modifier').GetNameWithTooltip] to a target who has [secrets|E] known by you.\n#F This Gift allows the Garou to take her knowledge of someone’s fault, practice or secret vice and bind a fitting punishment to that person.#!"
 FIND_THE_CHILD_WITHIN_PERK_EFFECT:0 "#F With this Gift, a Garou can play upon an individual’s instinctive response to parental authority or affection and convince that person to follow a command or respond favorably to a suggestions that they might otherwise rebuff.#!"
 MANTLE_OF_THE_LAND_PERK_EFFECT:0 "#F The Garou draws forth a mist or fog from water in the atmosphere.#!"
 VEIL_OF_THE_MOTHER_PERK_EFFECT:0 "#F This Gift allows the Garou to assume a different appearance for a short period of time in order to confuse pursuers or escape detection.#!"
 MOTHERLY_GUARDIAN_PERK_EFFECT:0 "#F This Gift allows the Garou to “tag” an individual so that she can keep track of her target’s health and welfare.#!"
 BRING_FORTH_THE_FUTURE_PERK_EFFECT:0 "#F This Gift allows the Garou to call upon Tambiyah to change one facet of the individual’s future.#!"
 PLANETARYGIFTS_BATTLESENSE_PERK_EFFECT:0 "#F The Garou can sense the best direction from which to make an attack, taking into account the terrain of the battlefield, the numbers and placement of the enemy and the available forces at the Garou’s command or allied with her.#!"
 SHARDS_OF_ICY_RAGE_PERK_EFFECT:0 "#F The Garou invoking this Gift calls on the cold power of her Rage, converting her anger into physical ice.#!"
 NERIGALS_CALL_TO_ARMS_PERK_EFFECT:0 "#F This Gift allows the Garou to summon to her side any creatures of spirits allied to Nerigal or appropriate to the Ice Warrior.#!"
 CHALLENGE_OF_SINGLE_COMBAT_PERK_EFFECT:0 "允许你在战争中使用向仇敌发起挑战[character_interaction|E]。\n#F 通过调用冰战士的名字并向敌人发出直接挑战，狼族可以迫使她的对手按照公平竞争的潜规则进行一对一的战斗。#!"
 HEART_OF_THE_ICE_WARRIOR_PERK_EFFECT:0 "允许你动用意志力免收伤害。\n#F 通常只在最危急的情况下使用，这种天赋使狼族不受伤害，足以给她的对手以最后一击。#!"
 ROUSE_TO_ANGER_PERK_EFFECT:0 "作为[character_interaction|E]，允许你花费灵知来获得魂怒。\n#F 该灵赋使狼族能够说或做一些事情，使她的目标激起她内心的魂怒。#!"
 FOETRACKER_PERK_EFFECT:0 "#F By using this Gift, the Garou can follow her quarry without risking losing the trail.#!"
 SAVAGERY_OF_THE_TALONED_HUNTER_PERK_EFFECT:0 "作为[character_interaction|E]，允许你花费一点魂怒来获得两点魂怒。\n#F 该灵赋使狼族获得两倍魂怒的优势，从而增加攻击的凶猛程度和频率，或者使他在压力下取得比平时更多的成就。#!"
 HUNTERS_HORN_PERK_EFFECT:0 "#F This Gift enables the Garou to create a sound so horrible and mind-chilling that it sends enemies into utter panic and causes them to flee an area without regard for direction or destination.#!"
 PACK_MIND_PERK_EFFECT:0 "作为指挥官时，在战争中给予敌人骑士[GetModifier('pack_mind_modifier').GetNameWithTooltip]。\n#F 该灵赋迫使一群敌人表现得像同一心智的群体。#!"
 AURA_OF_LEADERSHIP_PERK_EFFECT:0 "#F This Gift surrounds the Garou with an aura of authority that enables her to assume the mantle of leadership for a brief period of time.#!"
 PROCLAMATION_OF_ACTION_PERK_EFFECT:0 "#F This Gift enables the Garou to force an end to discussion and take the course of action the character thinks is best.#!"
 PLANETARYGIFTS_UNDISPUTED_RULER_PERK_EFFECT:0 "#F This Gift allows a Garou to take over the leadership of a small gathering of humans or a group of spirits.#!"
 ENTHRONEMENT_PERK_EFFECT:0 "#F The Garou can create small or simple objects out of thin air – including mist, clouds or wind.#!"
 GRAND_GESTURE_PERK_EFFECT:0 "#F By bestowing appropriate gifts on an individual or a group, the Garou increases her esteem and reputation in the eyes of the recipients of her largesse.#!"
 SENSE_LIMITS_PERK_EFFECT:0 "#F The Garou can determine approximately the amount of Rage, Gnosis or Willpower within an individual.#!"
 PEACE_OF_THE_COUNSELOR_PERK_EFFECT:0 "解锁$purchase_truce_interaction$[interaction|E]。\n#F 该天赋使狼族能够使最激烈的讨论得到和平的结论。#!"
 PALL_OF_DESPAIR_PERK_EFFECT:0 "作为指挥官时，在战争中给予敌人骑士[GetModifier('pall_of_despair_modifier').GetNameWithTooltip]。\n#F 该灵赋给目标人物带来一股绝望的情绪，使受害者因极度忧郁的感受而无法行动。#!"
 HARMONIOUS_SLUMBER_PERK_EFFECT:0 "#F This Gift enables the Garou to create a perfect environment for sleep even in the most difficult circumstances.#!"
 BURDEN_OF_KNOWLEDGE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你使目标获得[GetModifier('murderous_frenzy_modifier').GetNameWithTooltip]，[GetModifier('change_for_better_modifier').GetNameWithTooltip]或自杀。\n#F 狼族用她自己所有的局限性知识来淹没一个人，使受害者意识到她所有的缺陷或失败，并提醒她所有已经犯下或造成的错误。#!"
 FIND_THE_PORTENT_PERK_EFFECT:0 "#F With this Gift, a Garou can call for and receive some omen or portent which can help her determine her next course of action.#!"
 HIDDEN_DEPTHS_PERK_EFFECT:0 "#F This Gift allows a Garou to uncover some hidden piece of information, or to decipher some cryptic passage of text.#!"
 UNRAVEL_PERK_EFFECT:0 "#F This Gift allows the Garou to put together seemingly random bits of information to form a tentative analysis of a situation and formulate a course of action.#!"
 BLANK_SLATE_PERK_EFFECT:0 "#F The Garou can completely remove a single piece of information from her own mind or from that of another.#!"
 DIPLOMATIC_IMMUNITY_PERK_EFFECT:0 "#F This Gift enables the Garou to walk about in the middle of a hostile group without provoking the outbreak of hostilities.#!"
 THREADS_OF_THE_TAPESTRY_PERK_EFFECT:0 "#F This Gift allows the Garou to determine the basic elements of a situation that seems confused or deliberately obfuscated.#!"
 FIXIT_PERK_EFFECT:0 "#F The Garou can figure out what’s wrong with a device and make on-the-spot repairs which allow the item to run or function for a short time.#!"
 TANGLING_THE_SKEIN_PERK_EFFECT:0 "#F This Gift enables the Garou to cause confusion among her enemies by mixing up their perceptions so that they cannot decide who to follow or what to do next.#!"
 SHANTARS_LOOM_PERK_EFFECT:0 "#F The use of this Gift allows the Garou to craft some item from the energy provided by either Gnosis, Rage or Willpower.#!"
 DROWN_PERK_EFFECT:0 "#F This Gift causes the lungs of an opponent to fill with liquid. The victim must receive immediate medical or magical assistance or die within a few minutes.#!"
 SENSE_OF_THE_TRANSFORMATION_PERK_EFFECT:0 "若你的任何亲朋好友本将死于死因神秘，现在将直接揭露谋杀他们的人。\n#F 有了该灵赋，狼族可以识别生物或物体的状态转变或重大变化。#!"
 SHORTEN_THE_ROAD_PERK_EFFECT:0 "灵游花费时间：#P -20%#!。\n#F 这种天赋使狼族能够将正常的抵达时间缩短三分之一，即使是在影界。#!"
 WYLD_SPIRITS_PERK_EFFECT:0 "作为指挥官时，在战争中给予敌人骑士[GetModifier('erratic_behavior_modifier').GetNameWithTooltip]。\n#F 狼族可以利用梅罗斯的反复无常的本性，用来使她的一个或多个对手受到无常行为的影响，从而使受害者在任何特定情况下都更难协调攻击或采取明智的行动。#!"
 SLEEPS_TRAVELS_PERK_EFFECT:0 "#F Through this Gift, a Garou’s spirit may journey to another location while his body sleeps.#!"
 ESSENTIAL_TRANSFORMATION_PERK_EFFECT:0 "作为[character_interaction|E]，允许你受伤来获得灵知。\n#F 该灵赋允许狼族将她的部分精华转化为灵知，以便在需要消耗大量灵性力量的情况下使用。#!"