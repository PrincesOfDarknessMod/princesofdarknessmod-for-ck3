 APOCALYPTIC_FORM_PERK_EFFECT:0 "若是[GetTrait('demon').GetName( GetPlayer )]，允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_angelic_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'POD_shapeshift_form_apocalyptic_damned_modifier' ).GetNameWithTooltip|L]。\n若是[thrall|E]，允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_lesser_modifier' ).GetNameWithTooltip|L]。\n#F 所有恶魔都有一个无代价的天启形态，具有人形，但更宏伟或更可怕。除了其改变的外观和声音，还有其他相关的外观特效，如苍白的光环、发光的眼睛等等。#!"
 PRETERNATURAL_REFLEXES_PERK_EFFECT:0 "#F The character gains additional base initiative.#!"
 HARDENED_FLESH_PERK_EFFECT:0 "#F The character's host body and Apocalyptic Form can soak lethal damage with full Stamina. Host bodies do not age as long as they are possessed, but resume where they left off if the demon vacates the body.#!"
 PERFECT_IMMUNITY_PERK_EFFECT:0 "你不会获得疾病。\n#F 该角色不会生病，不会受感染，甚至不能作为疾病的被动载体。只有超自然的疾病才能影响她。#!"
 REGENERATION_PERK_EFFECT:0 "As a [character_interaction|E], allows you to heal your wounds.\n#F The character can reflexively spend Resolve to instantly heal damage.#!"
 ARSENAL_OF_THE_BEAST_PERK_EFFECT:0 "解锁野兽的军火库变形选项。\n#F 角色生长出一种野兽武器。这些武器中的每一个都有自己的代价和效果，其中一些武器可以代表自然界中从未发现的可怕的变异。#!"
 INCREASED_HEALTH_PERK_EFFECT:0 "#F The character gains additional Bruised health.#!"
 SENSE_VITALITY_PERK_EFFECT:0 "#F With a glance, the character can determine the overall health of a being.#!"
 CONTAGION_MASTERY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你治疗或给予疾病。\n#F 角色可以触摸活人，并清除她身上所有的疾病和毒药。被排出的疾病和毒素会以惰性黑泥的形式付出到皮肤的表面。此外，该角色也可以通过触摸造成疾病。#!"
 ULTIMATE_HORROR_PERK_EFFECT:0 "#F The demon's infernal form exudes infinite primordial evil. Onlookers who behold the dread fallen gain a derangement.#!"
 WINGS_PERK_EFFECT:0 "解锁[GetModifier( 'arsenal_of_the_beast_wings_modifier' ).GetNameWithTooltip|L]到野兽的军火库变形中。\n#F 该角色从她的背上长出一双大翅膀，在完全伸展的情况下，能长达角色身高的三倍。这些翅膀可能类似于鸟、蝙蝠、蝴蝶或更奇怪的东西，也可是用火、光、云、影或展开的锯齿状水晶雕刻而成的。#!"
 INHUMAN_STRENGTH_PERK_EFFECT:0 "#F The character gains preternatural strength, whether visible as a bulky form or imbued upon the very visage of frailty.#!"
 INURED_TO_AGONY_PERK_EFFECT:0 "#F The character suffers no penalties for injuries unless Incapacitated.#!"
 DAMAGE_IMMUNITY_PERK_EFFECT:0 "你不再会获得[GetTrait('inappetetic').GetName( GetPlayer )]。\n#F 该角色无视由特定类型的来源造成的所有伤害。另外，该角色超越了凡人肉体的固有限制，例如对营养、空气、睡眠或同样重要的东西的需求。#!"
 HEALING_TOUCH_PERK_EFFECT:0 "作为[character_interaction|E]，允许你治疗目标的尚酷。\n#F 该角色可以通过接触来治疗活人。#!"
 RESHAPE_FLESH_PERK_EFFECT:0 "增强变形[character_interaction|E]以改变面貌。\n#F 恶魔可以命令活化动物物质在他的触摸下转变，甚至像蜡一样流动。#!"
 RELENTLESS_SOUL_PERK_EFFECT:0 "允许你不死于受伤。\n#F 每当角色受到致命伤害时，角色身体会保持在失能状态，而不是死亡。#!"
 UNYIELDING_PERK_EFFECT:0 "允许你动用意志力免收伤害。\n#F 该角色具有岩石般的耐久，并且完全无视所有的钝器伤害。#!"
 SPEED_OF_THOUGHT_PERK_EFFECT:0 "#F The character moves impossibly fast, accelerated beyond human limits.#!"
 DIVINE_POTENTIAL_PERK_EFFECT:0 "#F Demons can increase their Attributes and Abilities beyond human limits.#!"
 LONGEVITY_PERK_EFFECT:0 "#F The thrall stops aging for a period of several years or reduces his physical age by a like amount.#!"
 TRAIT_APTITUDE_PERK_EFFECT:0 "#F The character demonstrates surpassing excellence with a particular Ability or Attribute.#!"
 TRAIT_ENHANCEMENT_PERK_EFFECT:0 "#F One of the character's Abilities or Attributes has received infernal enhancement.#!"
 INVOCATION_OF_NAME_PERK_EFFECT:0 "#F A demon intuitively senses whenever someone speaks its name, and may follow that thread of contact back to spy upon the source.#!"
 DEVOUR_SOUL_PERK_EFFECT:0 "能够对[GetTrait('demon').GetName( GetPlayer )]使用$EXECUTION_DEVOUR_SOUL$[executions|E]选项。\n#F 在远离地狱之处，恶魔可以通过吞噬和同化他们同族的精华来永久地摧毁他们。#!"
 ENTHRALL_PERK_EFFECT:0 "解锁奴役[character_interaction|E]。\n#F 通过接触一位自愿接受的凡人，恶魔可以重塑目标的灵魂，以给予地狱力量之赠礼。#!"
 IMMORTAL_SPIRIT_PERK_EFFECT:0 "当不是[GetTrait('truefallen').GetName( GetPlayer )]或[GetTrait('earthbound').GetName( GetPlayer )]时，不会被物理招式伤害。\n#F 没有肉体外壳或宿匣时，恶魔灵魂将变为纯粹由决心构成的虚体存在。#!"
 ARCANA_POSSESSION_PERK_EFFECT:0 "作为[character_interaction|E]，允许你在灵体形态时附身角色或宝物。\n作为[character_interaction|E]，你能指定备用人类容器，以防当前容器出错。\n#F 没有宿主身体或宿匣作为安灵之处的恶魔可以通过附身寻求庇护。#!"
 RAVAGE_PERK_EFFECT:0 "能够对[thrall|E]使用$EXECUTION_DEVOUR_SOUL$[executions|E]选项。\n#F 在紧急情况下，恶魔可以吞噬他们的[thrall|E]的灵魂，以迅速补充他们的决心储备。#!"
 INVIOLATE_SOUL_PERK_EFFECT:0 "获得强力精神防护，让你免疫相关能力。\n无法被变为[GetTrait('wraith').GetName( GetPlayer )]。\n#F 该角色对附身和其他控制或压制她的灵魂的企图完全免疫。#!"
 SPIRIT_SIGHT_PERK_EFFECT:0 "解锁$POD_marked_for_return_interaction$[character_interaction|E]。\n解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#F 该角色可以感知所有本在世界或反映世界的临近灵界位面上无踪无迹地漫游的虚体灵体。#!"
 READ_THE_SIN_PERK_EFFECT:0 "#F The character may look into the heart of a subject, perceiving the stain of her dominant Vice as an aura of the appropriate color.#!"
 COMPEL_SIN_PERK_EFFECT:0 "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。\n#F 该角色能在一段时间内将他的罪恶投射到其他人身上，让他们感受到相关冲动。#!"
 READ_THE_HEART_PERK_EFFECT:0 "#F The character may glimpse the colors of a target's emotional halo glowing around and through the darkened stains of sin.#!"
 GIFT_OF_FAITH_PERK_EFFECT:0 "作为[character_interaction|E]，允许你捐赠决心来减少[stress|E]。\n#F 角色触碰或与他的魔奴进行眼神交流，捐出过剩的决心以获得意志力。#!"
 GREATER_INVOCATION_PERK_EFFECT:0 "解锁召唤[character_interaction|E]。\n#F 恶魔现在可以使用以名召唤来联系任何它知道名字的智慧生物，就像它召唤其他恶魔一样。#!"
 PERFECT_LIE_PERK_EFFECT:0 "#F The character speaks lies with flawless sincerity.#!"
 READ_THE_MIND_PERK_EFFECT:0 "#F The character may gaze at a sentient being and probe his thoughts and memories.#!"
 CONQUERING_WILL_PERK_EFFECT:0 "#F The character issues a spoken command in the inflection once used to convey the word of God.#!"
 COMMAND_THE_ETERNAL_SOUL_PERK_EFFECT:0 "作为[character_interaction|E]，你能发掘其他[GetTrait('demon').GetName( GetPlayer )]的真名。\n#F 通过使用以名召唤奥秘，恶魔说出恶魔的真名。#!"
 REAPERS_HUNGER_PERK_EFFECT:0 "每杀一人获得#V 1#!决心。\n#F 每当堕落者亲自杀死一位凡人，他们就会获得一点决心。#!"
 IMPLACABLE_VENGEANCE_PERK_EFFECT:0 "每有一[rival|E]叠加一层：[GetModifier( 'implacable_vengeance_perk_modifier' ).GetNameWithTooltip|L]\n#F 恶魔为它的猎物命名，并将它的整个魔生目标调整为毁灭她。只要恶魔警惕地、不间断地猎杀它的猎物，并直接向她的死亡努力，它就不需要睡眠、食物、饮料或空气。它不会感到疲劳或疼痛，也不会受到伤害惩罚；简而言之，它的存在超越了活人肉体的限制。#!"
 SHIELD_OF_SPITE_PERK_EFFECT:0 "#F Whenever anyone attempts magic that opens telepathic contact with the character, either to read or attack his mind or control him, the intruder suffers damage equal to the character's Torment.#!"
 LASH_OF_ANGUISH_PERK_EFFECT:0 "#F The character concentrates on a living or undead target in his line of sight and telepathically unleashes a surge of raw pain and despair.#!"
 SHROUDED_SOUL_PERK_EFFECT:0 "#F The character blurs in the mind's eye, becoming innocuous to the point of anonymity.#!"
 ARCANA_SIN_EATING_PERK_EFFECT:0 "作为[character_interaction|E]，允许你使目标凡人遭受压力爆发，以让你恢复决心。\n#F 角色可以通过放纵自己的恶行或目睹一个凡人放纵其所喜爱的罪来恢复决心。#!"
 RAVAGE_SINNER_PERK_EFFECT:0 "增强食罪[character_interaction|E]，一定概率直接吞噬目标灵魂。\n#F 恶魔可以引诱凡人目标陷入放荡，以便能够进食，但凡人必须真正地主动犯罪。#!"
 SOUL_BURN_PERK_EFFECT:0 "允许你在[GetModifier( 'resolve0_modifier' ).GetNameWithTooltip|L]时用[stress|E]来使用奥秘。\n#F 在紧急情况下，该角色可以食用自己的灵魂以获得力量。#!"
 CEREMENT_OF_WALKING_DUST_PERK_EFFECT:0 "作为[character_interaction|E]，允许你附身死亡地角色。该角色必须原本时你选定的备用容器（孩子）。\n#F 恶魔可以附身一具相当完整的尸体。#!"
 COMMAND_THE_DEAD_PERK_EFFECT:0 "解锁$POD_bind_interaction$[character_interaction|E]。\n解锁$POD_command_wraith_interaction$[character_interaction|E]。\n#F 恶魔可以命令在其面前的鬼魂，并期望其服从。#!"
 RAISE_THE_DEAD_PERK_EFFECT:0 "能够招募[GetMaA('zombu').GetName]作为[men_at_arms|E]。\n#F 这角色命令死人复活，说着亵渎性的嘲弄来为归于尘土的生命注入气息。#!"
 SPIRIT_STRIKE_PERK_EFFECT:0 "你可以在[single_combat_duel|E]通过物理招式伤害[GetTrait('wraith').GetName( GetPlayer )]。\n#F 该角色可以击中非物质的灵体。#!"
 EXCISE_SOUL_PERK_EFFECT:0 "解锁$EXECUTION_CONVERT_TO_WRAITH$[executions|E]选项。\n#F 角色袭击一个有实体的生命，导致其灵魂被撕裂出来，其身体立即死亡。#!"
 ABANDON_VESSEL_PERK_EFFECT:0 "作为[character_interaction|E]，允许你抛弃当前容器。\n#F 恶魔可以心甘情愿地离开不再满足其需求的容器的庇护。#!"
 THEFT_OF_FAITH_PERK_EFFECT:0 "能够对其他非魔者使用$EXECUTION_DEVOUR_SOUL$[executions|E]选项。\n#F 使用这个奥秘可以让恶魔对目标进行蹂躏，就像她是它的魔奴一样。#!"
 TRANSFER_VESSEL_PERK_EFFECT:0 "你不再需要先放弃你当前的容器才能去附身另一个。\n#F 通过接触一个潜在的新容器，恶魔可以直接尝试用附身来转移它的存在，而不会给自己带来任何风险。#!"
 USURPATION_OF_FLESH_PERK_EFFECT:0 "对所有[thrall|E]获得弱牵制。\n#F 恶魔可以使用该奥秘来控制魔奴的身体，像木偶一样控制该仆从。#!"
 VISAGE_OF_GLORY_PERK_EFFECT:0 "#F The character glows with the spark of divinity for a short time.#!"
 BEHOLD_THE_METATRON_PERK_EFFECT:0 "#F The demon becomes impossibly and terribly glorious for a short time, either recapturing its glory as one of God's Host or displaying to all who can see it the horror of Hell itself.#!"
 REVELATION_PERK_EFFECT:0 "作为[character_interaction|E]，允许你通过暴露自己来获得决心。\n#F 在没有更可靠的选择时，堕落者可以通过直接放大凡人对神性或诅咒的信仰来收获决心。#!"
 PATTERN_SENSE_PERK_EFFECT:0 "#F Demons have an instinctual sensitivity to the patterns of the natural order, having established those patterns at the beginning of time.#!"
 FORTUNATE_GUESS_PERK_EFFECT:0 "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n#F 该角色对机遇和命运的流动获得了一种不可思议的直觉。#!"
