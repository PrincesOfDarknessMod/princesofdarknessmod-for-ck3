 ANIMAL_PSI_PERK_EFFECT:0 "作为[character_interaction|E]，允许你获得宠物。\n#Weak 动物灵能是与动物相关的能力。动物越聪明或训练有素，就越容易接收指令。灵能者需要能清晰的看到相关动物，并且必须发出与动物相应的声音。#!"
 ANTI_PSI_PERK_EFFECT:0 "免疫灵能能力。\n#Weak 反灵能场是一种罕见的阻碍其他灵能的能力。虽然对狼族的灵赋或吸血鬼的律能毫无用处，但由于某些原因，它对法师的心灵领域提供了有限的保护。反灵能场是持续活跃的，并在任何时候都积极围绕着灵能者。#!"
 ASTRAL_PROJECTION_PERK_EFFECT:0 "允许进入[astral_reaches|E]。\n#Weak 可以将他们的灵体从身体中分离出来，在星界漫游。虽然在这种状态下无法影响现实世界，但他们仍然可以使用灵能能力。有报告说能听到其他实体的声音，且有数个使用这种能力的灵能者已经迷失了，他们的灵魂在远离盖亚的陌生空间游荡。#!"
 BIOCONTROL_PERK_EFFECT:0 "允许对自己使用心灵治疗[character_interaction|E]。\n#Weak 灵能者可以操控自己的身体。#!"
 PSYCHIC_CLAIRVOYANCE_PERK_EFFECT:0 "#Weak 灵能者可以在保持体内的意识的同时，把他们的感官投射出去。灵能者对观察的地点或人物越熟悉，就越容易做到。#!"
 CYBERKINESIS_PERK_EFFECT:0 "#Weak 赛博操控首次被观察到是在80年代末，有些人将其与心灵传动联系起来。它使灵能者能够控制电子设备。#!"
 CYBERPATHY_PERK_EFFECT:0 "#Weak 赛博感应，也叫赛博灵能，是连接电子设备的能力。灵能者可以读取存储在电子设备上的数据。他们不能用这种能力操作它，只是获得信息。#!"
 ECTOPLASMIC_GENERATION_PERK_EFFECT:0 "允许魂铸[GetTrait('wraith').GetName( GetPlayer )]囚犯。\n#Weak 灵能者可以创造出灵质，一种几分钟后就会蒸发回到冥界的粘性物质。灵质对幽土的死灵来说是固体。#!"
 EMPATHIC_HEALING_PERK_EFFECT:0 "增强心灵治疗[character_interaction|E]，允许治疗心理伤害。\n#Weak 灵能者可以建立一种移情联系，使他们能够影响另一个人的治疗过程。这也延伸到了精神疾病。灵能者把这些伤害带到自己身上，并以正常的速度治愈它们。#!"
 MIND_SHIELD_PERK_EFFECT:0 "免疫敌对心灵[character_interaction|E]。\n#Weak 灵能者可以建立精神防护，防止超自然的入侵。这包括法师的法术、吸血鬼的律能、换生灵的魔咒和其他基于心灵的能力。这种能力没有主动能力。相反，它只是提高了入侵者穿透灵能者头脑的难度。#!"
 NECRO_PSI_PERK_EFFECT:0 "当你在物质世界中时，也可以与影界的存在互动。\n解锁$POD_marked_for_return_interaction$[character_interaction|E]\n#Weak 亡灵灵能，也叫通灵，是一种允许灵能者与死者的鬼魂接触的能力。死者并不被强迫对这种沟通尝试作出反应，而且可能有敌意。灵能者也可以利用他们的能力为自己所用。#!"
 PRECOGNITION_PERK_EFFECT:0 "#Weak 灵能者可以瞥见概率最高的事件转折，有时甚至可以看到未来。#!"
 PSYCHIC_HEALING_PERK_EFFECT:0 "允许对他人使用心灵治疗[character_interaction|E]。\n#Weak 灵能者可以用他们的灵能力量治愈伤口和其他伤害。#!"
 PSYCHIC_HYPNOSIS_PERK_EFFECT:0 "作为[character_interaction|E]，允许你从目标获得好感度。\n#Weak 灵能者可以通过让他们进入恍惚状态，然后对他们进行催眠，将命令和建议植入他们的目标中。#!"
 PSYCHIC_INVISIBILITY_PERK_EFFECT:0 "#Weak 与吸血鬼的混淆术律能相似，灵能者可以掩盖他们的存在，不被旁人看到。有人把它比作一种大规模的催眠。录像机仍能正常记录他们的存在。#!"
 PSYCHIC_VAMPIRISM_PERK_EFFECT:0 "作为[character_interaction|E]，允许你通过吸取囚犯来减少压力或生命流失。\n#Weak 灵能者可以从目标身上吸取情感，在某些情况下甚至是生命力，供他们自己使用。由此产生的体验是一种令人振奋的欣快感，可以迅速使灵能者产生依赖。#!"
 PSYCHOKINESIS_PERK_EFFECT:0 "#Weak 念力，也叫心灵传动，允许灵能者不接触物体就能移动它们。只要他们保持对悬浮物体的控制，灵能者就可以用任何他们可以正常做的方式与它们互动。#!"
 PSYCHOMETRY_PERK_EFFECT:0 "解锁[buy_artifact_claim_interaction|E]\n[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#Weak 通过触摸，灵能者可以了解一件物品和过去与之互动的人的一些情况。情感上的共鸣越强烈，就越容易读懂。#!"
 PSYCHOPORTATION_PERK_EFFECT:0 "作为[character_interaction|E]，允许你传送到目标所在地。\n#Weak 利用他们的心智，灵能者可以短距离地传送。此外可以携带一小批无生命的物体一同传送。#!"
 PYROKINESIS_PERK_EFFECT:0 "#Weak 灵能者可以变出火来。他们对变出的火没有掌控或免疫，因此必须非常小心，以免自己被烧伤。#!"
 SOULSTEALING_PERK_EFFECT:0 "作为[character_interaction|E]，允许你通过吸取囚犯来增加灵能[lifestyle|E][experience|E]。\n#Weak 与精神吸能类似，窃魂吸取目标的精华以加强灵能者的力量。这种能力对那些灵魂有黑暗一面的超自然，如黯影或心兽，有效，但那部分会反击，往往会损害冒犯的灵能者的心理。#!"
 SYNERGY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你训练灵能者或测试他人的灵能天赋。\n#Weak 一种极其罕见的天赋，它允许灵能者将自己与其他灵能者联系起来，形成一个结合他们几种力量的格式塔实体。触摸是形成这种联系的必要条件。#!"
 PSYCHIC_TELEPATHY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你从目标获得弱牵制。\n#Weak 心灵感应是指用灵能者的心智支配另一个人的心智的才能。#!"
 PSI_LIFESTYLE_PERK_POINTS_TRIGGER:0 "灵能生活方式技能点：$NUM|V0$"