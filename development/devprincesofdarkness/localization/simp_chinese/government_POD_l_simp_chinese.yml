l_simp_chinese:
 traditions_government:0 "诫律制"
 traditions_government_adjective:0 "诫律制"
 traditions_government_realm:0 "该隐之子国度"
 traditions_government_vassals_label:1 "[cainite|E][obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 traditions_government_desc:1 "绝大多数吸血鬼国家都遵循该隐诫律，这是一套关于如何在人类和其他同类面前表现自己的行为的粗略准则。"
 free_state_government:0 "自由邦"
 free_state_government_adjective:0 "自由邦"
 free_state_government_realm:0 "自由邦"
 free_state_government_vassals_label:1 "封臣[obligations|E]基于每个[vassal|E]对于国家首领的[opinion|E]。"
 free_state_government_desc:1 "自由邦不接受该隐的条规，这是一个松散的联盟，由思想相近的[cainites|E]聚集在一个感召型的统治者身边。"
 legacy_rights:0 "#BLOODRED 第一诫律：血约#!"
 legacy_rights_none:0 "不受宗教保护"
 legacy_rights_none_short:0 "#BLOODRED 强制执行#!"
 legacy_rights_none_desc:2 "“尔之血造就吾之血脉，以吾之形。吾之诅咒归于尔，吾之救赎归于尔。吾代为神立于尔之上。吾既如此，吾之传统为吾之约。弃余既弃希望。”该隐说。\n\n[liege|E]可以[demand_conversion|E][vassal|E]\n[liege|E]可以在[vassals|E]的领地用[convert_county|E]"
 legacy_rights_protected:0 "受宗教保护"
 legacy_rights_protected_desc:2 "“尔之血造就吾之血脉，以吾之形。吾之诅咒归于尔，吾之救赎归于尔。吾代为神立于尔之上。吾既如此，吾之传统为吾之约。弃余既弃希望。”该隐说。\n\n#emphasis #bold [vassal|E]特权：#!#!\n[liege|E]不可以[demand_conversion|E][vassal|E]\n[liege|E]不可以在[vassals|E]的领地用[convert_county|E]\n\n#flavor [vassal|E]被授予特殊的保护地位，国家正式承认他们行使自己信仰[faith|E]的权利。#!"
 legacy_rights_protected_short:0 "#BLOODRED 自愿执行#!"
 destruction_rights:0 "#BLOODRED 第五诫律：灭亲#!"
 destruction_rights_none:0 "无灭亲权利"
 destruction_rights_none_desc:0 "“禁汝洒汝之长者血。此道惟属吾至亲者，他人莫可。血弱禁反长者。此为吾终之契。”该隐说。\n\n#flavor [vassal]不允许在他们的领土消灭同族。只有[liege]可以发起血猎。"
 destruction_rights_none_short:0 "#BLOODRED 无#!"
 destruction_rights_allowed:0 "允许灭亲"
 destruction_rights_allowed_desc:0 "“禁汝洒汝之长者血。此道惟属吾至亲者，他人莫可。血弱禁反长者。此为吾终之契。”该隐说。\n\n#emphasis #bold [liege]允许[vassal]实施报复法，并可在[vassal]的领土发起血猎。#!"
 destruction_rights_allowed_short:0 "#BLOODRED 允许#!"
 destruction_rights_open_war:0 "无限制战争"
 destruction_rights_open_war_desc:0 "“禁汝洒汝之长者血。此道惟属吾至亲者，他人莫可。血弱禁反长者。此为吾终之契。”该隐说。\n\n#emphasis #bold [vassal|E]特权：#!#!\n[vassal|E]可以不管[lieges|E][crown_authority|E]来发动[war|E]\n[vassal|E]在[realm|E]内[casus_bellis|E]付出#high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0] % #! 更少\n\n#flavor [vassal]不需要使用[hook]，如果他们[lieges] [crown_authority]禁止他们发动战争。这项特权也使[vassal]更容易在[realm|E]内发动战争，减少付出#high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0] % #!。#!"
 destruction_rights_open_war_short:0 "#BLOODRED 开战#!"
 progeny_rights:0 "#BLOODRED 第三诫律：后嗣#!"
 progeny_rights_none:0 "取缔造嗣权利"
 progeny_rights_none_short:0 "#BLOODRED 无#!"
 progeny_rights_none_desc:0 "“惟得长者许与祝，乃可再造。作为其最近我者之天，以其所掌。破此，汝与汝之后皆将死。”该隐说。\n\n#[vassal]不被其的[liege]允许制造后嗣。甚至制造血仆也是被禁止的。#!"
 progeny_rights_granted:0 "完全造嗣权利"
 progeny_rights_granted_short:0 "#BLOODRED 任意#!"
 progeny_rights_granted_desc:0 "“惟得长者许与祝，乃可再造。作为其最近我者之天，以其所掌。破此，汝与汝之后皆将死。”该隐说。\n\n#[vassal]被其的[liege]允许制造后嗣。 其中包含吸血鬼子嗣和血仆。#!"
 progeny_rights_ghouls:0 "血仆制造权"
 progeny_rights_ghouls_short:0 "#BLOODRED 血仆#!"
 progeny_rights_ghouls_desc:0 "“惟得长者许与祝，乃可再造。作为其最近我者之天，以其所掌。破此，汝与汝之后皆将死。”该隐说。\n\n#[vassal]被其的[liege]给予制造血仆的权利，但是吸血鬼子嗣不行。#!"
 progeny_rights_childer:0 "血族后嗣权利"
 progeny_rights_childer_short:0 "#BLOODRED 血族#!"
 progeny_rights_childer_desc:0 "“惟得长者许与祝，乃可再造。作为其最近我者之天，以其所掌。破此，汝与汝之后皆将死。”该隐说。\n\n#[vassal]被其的[liege]给予制造吸血鬼子嗣的权利，但是血仆不行。#!"
 blood_oaths:0 "#BLOODRED 第四诫律：责任#!"
 blood_oaths_none:0 "不需血誓"
 blood_oaths_none_short:0 "#BLOODRED 自由#!"
 blood_oaths_none_desc:0 "“汝之所为，乃汝之血，至于汝之制中出。至则一刻，其罪，其血，其刑皆归于汝。”该隐说。\n\n#[vassal]不需要向他们[liege]发血誓。#!"
 blood_oaths_required:0 "需要血誓"
 blood_oaths_required_short:0 "#BLOODRED 血誓#!"
 blood_oaths_required_desc:0 "“汝之所为，乃汝之血，至于汝之制中出。至则一刻，其罪，其血，其刑皆归于汝。”该隐说。\n\n#[vassal]必须向他们的[liege]发血誓并服用他们[liege]的血制成的血剂。这是个弱血缚（弱牵制）。#!"
 domain_revocation_rights:0 "#BLOODRED 第二诫律：领权#!"
 domain_revocation_rights_default:0 "剥夺领地"
 domain_revocation_rights_default_short:0 "#BLOODRED 领主第一#!"
 domain_revocation_rights_default_desc:0 "如果君权法允许，[liege]将被剥夺领地。"
 domain_revocation_rights_protected:0 "受保领地"
 domain_revocation_rights_protected_desc:0 "“如吾乃挪得之主也，汝之域自汝事。君为其主，凡人皆当尊此，不则受君之怒。其于入时献其，汝当以保其报。按理，汝可于君之境内田，其血自汝之。受之者也，管子之地，并与人君望之钧重。”该隐说。\n\n[vassal|E]特权：#!#!\n[liege|E]不能剥夺[vassals_possessive|E][titles|E]\n\n#flavor [vassal]被确保了他们的[titles]所有权，防止[liege|E]的剥夺——无论[liege|E]是否有[revoke_title_reason]。#!"
 domain_revocation_rights_protected_short:0 "#BLOODRED 蒙受保护#!"
 masquerade_protocol:0 "#BLOODRED 第六诫律：潜藏#!"
 masquerade_protocol_none:0 "不进行潜藏"
 masquerade_protocol_none_desc:0 "#flavor [liege]没有在[vassal]的领地内实施血之缄默。"
 masquerade_protocol_none_short:0 "#BLOODRED 无#!"
 masquerade_protocol_lax:0 "宽松的潜藏"
 masquerade_protocol_lax_desc:0 "“汝勿向非同血者见汝之性。如此将弃汝谓吾之盟也。”该隐说。\n\n#emphasis #bold [liege]只会因极端违反血之缄默的行为在[vassal]的领地进行逮捕。#!"
 masquerade_protocol_lax_short:0 "#BLOODRED 宽松#!"
 masquerade_protocol_strict:0 "严格的潜藏"
 masquerade_protocol_strict_desc:0 "“汝勿向非同血者见汝之性。如此将弃汝谓吾之盟也。”该隐说。\n\n#emphasis #bold [liege]会在[vassal]的领地实施严格诠释的血之缄默。#!"
 masquerade_protocol_strict_short:0 "#BLOODRED 严格#!"
 blood_tithe:0 "#BLOODRED 血贡#!"
 blood_tithe_none:0 "没有$blood_tithe$"
 blood_tithe_none_short:0 "#BLOODRED 无#!"
 blood_tithe_none_desc:0 "# [vassal]不应该为他们的[liege]献血。#!"
 blood_tithe_required:0 "血畜血贡"
 blood_tithe_required_short:0 "#BLOODRED 血畜#!"
 blood_tithe_required_desc:0 "# 应要求的情况下，[vassal]必须向其[liege]的宫廷提供一个血畜。通常，这意味着凡人的死亡。#!"
 blood_tithe_vampiric:0 "封臣精血血贡"
 blood_tithe_vampiric_short:0 "#BLOODRED 精血#!"
 blood_tithe_vampiric_desc:0 "# 应要求的情况下，[vassal]必须向其[liege]提供他们自己的吸血鬼之血。这会增加提供者的饥渴。#!"
 blood_tithe_childer:0 "子嗣血贡"
 blood_tithe_childer_short:0 "#BLOODRED 子嗣#!"
 blood_tithe_childer_desc:0 "# 应要求的情况下，[vassal]必须向其[liege]提供他们的一个子嗣。这常常会导致那个子嗣的消亡。#!"
 primogen_rights:0 "#BLOODRED 首长权利#!"
 primogen_rights_none:0 "无首长内阁席位"
 primogen_rights_none_desc:0 "#flavor 在首长[council]中，[vassal]不会被授予任何特殊的特权。"
 primogen_rights_none_short:0 "#BLOODRED 无#!"
 primogen_rights_guaranteed:0 "首长内阁席位"
 primogen_rights_guaranteed_desc:0 "#emphasis #bold [vassal|E]特权：#!#!\n#high $force_onto_council$#![interaction|E]可以自行使用\n\n#flavor [vassal]被赋予了特殊首长[council]特权，并会期望一个永久首长[council]席位。授予这项特权给过多[vassals]会最终导致[realm|E]的[powerful_vassals]失望。#!"
 primogen_rights_guaranteed_short:0 "#BLOODRED 确保#!"
 inquisition_government:0 "裁判所"
 inquisition_government_adjective:0 "裁判所"
 inquisition_government_realm:0 "裁判所"
 inquisition_government_vassals_label:1 "裁判官[obligations|E]基于[opinion|E]"
 inquisition_government_desc:1 "裁判官单元，他们会摧毁所有遇到的超自然事物。"
 kueijin_court_government:0 "皇朝制"
 kueijin_court_government_adjective:0 "皇朝制"
 kueijin_court_government_realm:0 "皇朝制"
 kueijin_court_government_vassals_label:1 "皇朝制[obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 kueijin_court_government_desc:1 "受诸老祖统治，其之正统性被称为受命于地。"
 indep_government:0 "自治者"
 indep_government_adjective:0 "自治者"
 indep_government_realm:0 "自治者"
 indep_government_vassals_label:1 "自治者[obligations|E]基于[opinion|E]"
 indep_government_desc:1 "为理想而聚合的无组织统治者。"
 celestial_army_government:0 "天军制"
 celestial_army_government_adjective:0 "天军制"
 celestial_army_government_realm:0 "天军制"
 celestial_army_government_vassals_label:1 "天军制[obligations|E]基于[liege|E]的[piety_level|E]"
 celestial_army_government_desc:1 "被认为早已消失的东方猎人的宏伟组织已经归来。"