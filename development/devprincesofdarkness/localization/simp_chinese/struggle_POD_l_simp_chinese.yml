l_simp_chinese:
 reconquista_struggle:0 "暗影再征服"
 reconquista_strugglee_desc:1 "自罗马帝国灭亡以来，勒森魃一直是伊比利亚地区的最高统治者。但这时代即将迎来一个血腥的结局，因为半岛上的凡人宗教纷争终于漫入了黑夜世界。\n勒森魃内战于1172年随着穆尔西亚的陷落而正式爆发，从那时起，双方的煽动者，如安布罗西奥·路易斯·蒙卡达和拜德尔，为了各自的利益而献上了战争之火。\n伊比利亚现在处于混乱之中，随着雇佣兵、外来者和机会主义者涌向某一方，谁（如果有的话）将从这个熔炉中获得胜利，还有待观察。"
 struggle_reconquista_phase_shadows:0 "暗影战争"
 struggle_reconquista_phase_hostility:0 "混乱"
 struggle_reconquista_phase_reprieve:0 "宽恕"
 pod_reconquista_struggle.0501.t:1 "暗影再征服"
 pod_reconquista_struggle.0501.desc:1 "自罗马帝国灭亡以来，勒森魃一直是伊比利亚地区的最高统治者。但这时代即将迎来一个血腥的结局，因为半岛上的凡人宗教纷争终于漫入了黑夜世界。\n勒森魃内战于1172年随着穆尔西亚的陷落而正式爆发，从那时起，双方的煽动者，如安布罗西奥·路易斯·蒙卡达和拜德尔，为了各自的利益而献上了战争之火。\n伊比利亚现在处于混乱之中，随着雇佣兵、外来者和机会主义者涌向某一方，谁（如果有的话）将从这个熔炉中获得胜利，还有待观察。\n\n"
 pod_reconquista_struggle.0501.desc.involved:0 "伊比利亚曾被冈格罗统治，然后是迦太基的布鲁赫和罗马的梵卓，现在……现在是我对这片土地提出宣称的时候了。\n\n"
 pod_reconquista_struggle.0501.desc.interloper:0 "伊比利亚曾被冈格罗统治，然后是迦太基的布鲁赫和罗马的梵卓，现在……现在是我对这片土地提出宣称的时候了。\n\n"
 pod_reconquista_struggle.0501.a:0 "把握命运！"
 secure_reconquista_foothold_decision_title:0 "伊比利亚立足点"
 secure_reconquista_foothold_decision_desc:0 "伊比利亚的勒森魃内战是一场机遇。他们不会对外部的威胁有任何准备。"
 secure_reconquista_foothold_decision_tooltip:0 "整合伊比利亚的一部分"
 secure_reconquista_foothold_decision_confirm:0 "成为最强。"
 reconquista_struggle_phase_hostility_or_opportunity_tt:0 "再征服斗争必须处于暗影战争或混乱阶段。"
 struggle_secure_reconquista_foothold_ends_the_struggle_tt:0 "暗影再征服结束。"
 pod_reconquista_struggle.100.t:0 "伊比利亚的黎明"
 pod_reconquista_struggle.100.desc:0 "分裂的勒森魃氏族给了半岛上的外来者一个巨大的机会。由于他们的兵刃相向，他们对外界的威胁视而不见，直到为时已晚。\n在新的领导层的带领下，伊比利亚正在慢慢忘记暗影再征服、午夜新月和他们所有的争吵。这是一个新的时代，在经历了伊比利亚冈格罗、迦太基布鲁赫、罗马梵卓和勒森魃之后，伊比利亚将不得不再次适应新的主人。"
 pod_reconquista_struggle.100.a:0 "伊比利亚需要着新血。"
 pod_reconquista_struggle.101.desc:0 "分裂的勒森魃氏族给了半岛上的外来者一个巨大的机会。由于他们的兵刃相向，他们对外界的威胁视而不见，直到为时已晚。\n在新的领导层的带领下，伊比利亚正在慢慢忘记暗影再征服、午夜新月和他们所有的争吵。这是一个新的时代，在经历了伊比利亚冈格罗、迦太基布鲁赫、罗马梵卓和勒森魃之后，伊比利亚将不得不再次适应新的主人。"
 pod_reconquista_struggle.101.a:0 "该死的闯入者。"
 shadow_reconquista_tt:0 "该结局只对非[ashirra|E]勒森魃可用"
 ashirra_reconquista_tt:0 "该结局只对[ashirra|E]和塔里克·哈基姆可用"
 noconquista_objective_decision:0 "第三条路"
 noconquista_objective_decision_tooltip:1 "现在是驱散伊比利亚上空的阴影的时候了。"
 noconquista_objective_decision_desc:0 "基督教的勒森魃和[ashirra|E]在信仰问题上的争吵，使伊比利亚无法实现其真正的潜力。这种情况不能再继续下去。"
 noconquista_objective_decision_confirm:0 "伊比利亚觉醒！"
 noconquista_objective_decision_effect_tooltip:1 "勒森魃国家将被削弱。你将获得一个强大的修正。如果你还没有，你将获得入侵的宣战理由，你还可以获得对其花费的折扣。"
 thirdway_reconquista_tt:0 "该结局只对非[ashirra|E]角色可用"
 thirdway_effect_tt:0 "勒森魃国家将被破碎权威修正削弱。如果你还没有，你将获得入侵的宣战理由，你还可以获得对其花费的折扣。"
 heir_yzebel_modifier:0 "耶洗别的继承者"
 heir_yzebel_modifier_desc:0 "第一位统一乐伊比利亚的吸血鬼，迦太基人耶洗别，在该角色上找到了她的传承。"
 pod1230objectives.113.t:0 "第三条路"
 pod1230objectives.113.desc:0 "伊比利亚有一个很长的历史。起初，伊比利亚是由一群游荡的冈格罗蛮族占据的，然后由迦太基的布鲁赫耶洗别统一，直到她被罗马的梵卓击败。然后，利用双方在战争后的脆弱，勒森魃进入半岛并迅速巩固了他们对该地区的控制。\n然而，他们的内战极大地削弱了他们的地位，以至于一个新的势力在伊比利亚崛起。许多人认为勒森魃会一直存在下去，但现在他们被证明是错误的。这片土地有了一个新的主人，而暗影之氏族只能为在他们的主场遭到如此彻底的失败而感到羞愧。"
 pod1230objectives.113.a:0 "我将比他们所有人都更持久！"
 pod1230objectives.114.a:0 "历史翻开了下一页。"
 struggle_parameter_unlocks_secure_reconquista_foothold_decision:0 "为伊比利亚或附近的未参与的角色解锁保障伊比利亚立足点决议。"
 pod_reconquista_struggle.1000.t:0 "紧张与机遇"
 pod_reconquista_struggle.1000.desc:0 "伊比利亚正处于崖边。每个吸血鬼都在试图利用他们对凡人民众的影响力来获得优势。这种持续的拉扯和推动使该地区的凡人几乎变得疯狂，对一切事物和人进行暴动和抗议。\n这种不自然的紧张局势为领主们提供了一些机会，而你的内阁正推动你去煽风点火，确保它不会很快停止。毕竟紧张的凡人就是容易被操纵的凡人。"
 pod_reconquista_struggle.1000.a:0 "让我们谨慎地将局势激化。"
 pod_reconquista_struggle.1000.b:0 "你提出了这个解决方案，你自己来做。"
 pod_reconquista_struggle.1000.c:0 "不，凡人太宝贵了，不能挥霍。"
 pod_reconquista_struggle.1000.d:0 "我为什么要在乎凡人呢？"
 pod_reconquista_struggle.1001.t:0 "午夜浴场"
 pod_reconquista_struggle.1001.desc:0 "豪华浴场是罗马时代的遗物，遍布伊比利亚，是有影响力的凡人喜欢的消遣方式。长期以来，这项业务一直由当地的该隐之子经营，他们以保密为荣，只在非常不定期的情况下与黑夜的亲王和苏丹打交道。\n但最近，一位穆斯林学者证明了洗澡对凡人的健康有好处，使这些秘密的“澡堂老板”走出隐蔽的地方，要求提供资金以扩大他们的业务。他们认为，健康的凡人是有用的凡人，因此你们都可以从这种扩张中受益。"
 pod_reconquista_struggle.1001.a:0 "你将获得我的支持。"
 pod_reconquista_struggle.1001.b:0 "把他们的浴场拆了，留下值钱的东西拿来给我！"
 pod_reconquista_struggle.1001.c:0 "我现在不做投资。"
 pod_reconquista_struggle.1020.t:0 "狮与刀"
 pod_reconquista_struggle.1020.desc:0 "在吞噬伊比利亚的冲突中，双方都有狂热者。罗德里戈之狮为基督教的勒森魃而战，即使是他们，有时也会因为战斗中的野蛮行为而感到困扰。对于[ashirra|E]来说，“刀锋之网”的名声已经无需证明，可怕的谋杀夜夜都在上演。\n最近有一队人马出现在你的首都，声称要追捕一名“非信者间谍”，然后留下了一堆尸体和破坏。\n像往常一样，你被留在这里处理后果。"
 pod_reconquista_struggle.1020.a:0 "尽快恢复秩序。"
 pod_reconquista_struggle.1020.b:0 "非信者间谍？！为了安全起见，抢劫和烧毁剩下的东西！"
 pod_reconquista_struggle.1020.c:0 "责备他人，然后继续前进。"
 pod_reconquista_struggle.3011.t:0 "守夜"
 pod_reconquista_struggle.3011.desc:0 "熙德对基督教的勒森魃产生了深远的影响。他的坟墓已成为有潜力的骑士的崇拜场所，其广泛传播的仪式被称为“守夜”。由于熙德也受到[ashirra|E]的尊重，当虔诚的朝圣者在伊比利亚各地活动履行职责时，双方达成了非正式的休战。\n但有时，而且比双方都承认的更多的是，这种休战没有得到尊重，旅行者成为暗影再征服的另一个牺牲品。这样一群基督徒勒森魃正在你的土地上移动，请求熙德之和，以便自由移动。你会怎么做？"
 pod_reconquista_struggle.3011.a:0 "一个值得尊重的习俗。"
 pod_reconquista_struggle.3011.b:0 "对通过我的土地征收微薄的税款似乎是合理的。"
 pod_reconquista_struggle.3011.c:0 "虔诚的教友们，请接受护卫和我的祝福。"
 pod_reconquista_struggle.3011.d:0 "等着受赎吧，天真的傻瓜们！"