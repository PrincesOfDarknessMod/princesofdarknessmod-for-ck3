 shade_realm_of_correspondence_title:0 "$spirit_travel_header$空间之影域"
 shade_realm_of_correspondence_desc:0 "与水星相关联的[shade_realm|E]。无法从地球直接抵达这个影域，而那些设法抵达那里的人发现自己在全维空间中按照不可知的几何移动。"
 shade_realm_of_correspondence_effect_desc:0 ""
 shade_realm_of_correspondence_option:0 "进入空间之影域"
 shade_realm_of_life_title:0 "$spirit_travel_header$生命之影域"
 shade_realm_of_life_desc:0 "与金星相关联的[shade_realm|E]。该界域是郁郁葱葱、不断变化的丛林。它与地球的相对可及性使其成为升华之战的频繁战场。"
 shade_realm_of_life_effect_desc:0 ""
 shade_realm_of_life_option:0 "进入生命之影域"
 shade_realm_of_forces_title:0 "$spirit_travel_header$力之影域"
 shade_realm_of_forces_desc:0 "与火星相关联的[shade_realm|E]。力之影域是永无止境的风暴，罕见的有相对平静的孤立地点。多赛梯堡占据了安定点之一，至少在它被摧毁之前是如此。和生命之影域一样，它也是一个频繁的（和危险的）法师战斗场地。"
 shade_realm_of_forces_effect_desc:0 ""
 shade_realm_of_forces_option:0 "进入力之影域"
 shade_realm_of_matter_title:0 "$spirit_travel_header$物质之影域"
 shade_realm_of_matter_desc:0 "与木星相关联的[shade_realm|E]。这个领域可能与空心地球有关，也可能只是类似，但规模要大得多——一个由恐龙、失落文明和其他不复存在的事物组成的帝国。"
 shade_realm_of_matter_effect_desc:0 ""
 shade_realm_of_matter_option:0 "进入物质之影域"
 shade_realm_of_time_title:0 "$spirit_travel_header$时间之影域"
 shade_realm_of_time_desc:0 "与土星相关联的[shade_realm|E]。任何进入时间之影域的访客都冒着严重的风险，因为即使是最轻微的移动也会导致时间扭曲和不受控制的时间旅行。"
 shade_realm_of_time_effect_desc:0 ""
 shade_realm_of_time_option:0 "进入时间之影域"
 shade_realm_of_spirit_title:0 "$spirit_travel_header$灵之影域"
 shade_realm_of_spirit_desc:0 "与天王星相关联的[shade_realm|E]。在灵之影域没有险棘：灵与凡人可以直接互动。法师的化身也有可能在这里显现实体并与他们交谈。"
 shade_realm_of_spirit_effect_desc:0 ""
 shade_realm_of_spirit_option:0 "进入灵之影域"
 shade_realm_of_mind_title:0 "$spirit_travel_header$心智之影域"
 shade_realm_of_mind_desc:0 "与海王星相关联的[shade_realm|E]。正如人们所期望的那样，心智之影域的性质是由人们觉得那里会有什么的想法所决定的。它像一面镜子一样反射出来访者自己的想法和感受。"
 shade_realm_of_mind_effect_desc:0 ""
 shade_realm_of_mind_option:0 "进入心智之影域"
 shade_realm_of_entropy_title:0 "$spirit_travel_header$熵之影域"
 shade_realm_of_entropy_desc:0 "与冥王星相关联的[shade_realm|E]。据称在这里，宇宙的大因果轮回被暴露无遗，它甚至可能与幽土有直接关联。"
 shade_realm_of_entropy_effect_desc:0 ""
 shade_realm_of_entropy_option:0 "进入熵之影域"