 bm_1230_warofprinces:0 "亲王之战"
 bm_1230_warofprinces_desc:0 "亲王之战是该隐之子历史上的一段冲突时期，开始于1204年第四次十字军东征导致君士坦丁堡沦陷后不久。此术语指的是血族亲王在无尽之夜结束后为争夺领土而发生的冲突。\n\n在宗教裁判所成立前不久，亲王们的战争开始了。尽管宗教裁判所最初只是长者们的工具，但他们很快就成为了对该隐之子的更大威胁。虽然尚不清楚亲王之战何时结束，但很可能会随着大反乱的到来而被迫中止。\n\n#bold 你能赢得这场战争的最终胜利吗？又或者在人类开始反抗他们的正当主人之时随同氏族一起被清算？#!"
 bookmark_warofprinces_montano:0 "蒙塔诺"
 bookmark_warofprinces_montano_desc:0 "勒森魃的忠实子嗣，同时也是横跨整个地中海的氏族之主。尽管蒙塔诺处于一个安全的位置，而且本身也是一个有权势的人，但一个大麻烦正在他视野外酝酿。伊比利亚半岛的内战、意大利老敌人的崛起以及氏族中年轻成员的不守规矩都令人担忧。君士坦丁堡最近向他臣服，但它的亲王阿方索肯定是不值得信任的。更明智的做法可能是暂时将注意力集中在意大利。小心那些野心勃勃的封臣，比如克劳狄·欧金尼奥和罗马亲王提图斯·梵卓鲁·卡米拉。\n\n#bold 你能再次确保勒森魃氏族作为欧洲最具影响力的氏族的正确地位么？#!"
 bookmark_warofprinces_camilla:0 "卡米拉"
 bookmark_warofprinces_camilla_desc:0 "提图斯·梵卓鲁·卡米拉在罗马的大部分辉煌历史时间中占据着它，可以说是历史上政治中最重要的该隐之子。在摧毁了迦太基并为原罪之路奠定了基础之后，他陷入了蛰眠。\n\n#bold 刚在一陌生的新世界下苏醒，你能再一次，为了一颤动的、堕落的罗马的荣耀统治整个该隐之子世界么？#!"
 bookmark_warofprinces_qawiya:0 "卡维娅·加杜巴"
 bookmark_warofprinces_qawiya_desc:0 "萨洛比氏族已支离破碎，几乎被睿魔尔家族的篡位者逼得绝种。耶路撒冷的母狮，萨麦尔的子嗣是他们最后的希望，是他们在面对贤士的攻击时最后的生存机会。她与该地区的亲王互相结盟，而此「奥利弗之席」有点不稳定，并受到附近的阿希拉和巴力的威胁。对这位萨洛比选民来说，确保自己的权力基础是明智的第一步。\n\n#bold 你能将徒劳的最后一战转变为萨洛比氏族的辉煌复兴么？#!"
 bookmark_warofprinces_alexander:0 "亚历山大"
 bookmark_warofprinces_alexander_desc:0 "在作为法兰西的绝对统治者超过一千年后，亚历山大因他长子乔弗里·杜·坦普尔领导的阴谋失去了一切。现在，被放逐到黑十字成为了被忌讳的客卿后，强大的玛土撒拉正在策划他的回归。除了惊人的个人能力和宣称外他几乎一无所有……这对大计划是微不足道的。对于曾经是最强大的梵卓子嗣之一的他来说，这几乎是从零开始。\n\n#bold 你能让乔弗里和萨利安娜为他们的背叛付出代价，并夺回属于你的王位么？或在这片东方土地上创造新的遗产？#!"
 bookmark_warofprinces_werter:0 "维特"
 bookmark_warofprinces_werter_desc:0 "古斯堪的纳维亚人的古老生活方式正在消亡，奥丁的子嗣们也在消亡。当德意志梵卓向斯堪的纳维亚发起最后的进攻时，大多数英灵战士都随从了他们的命运并迎接即将到来的诸神黄昏。\n\n#bold 作为你人民中最后的崇高之主，你是愿意平静地接受你的命运，还是为了瓦尔哈拉作出最后的抵抗？#!"
 bookmark_warofprinces_etrius:0 "伊崔乌斯"
 bookmark_warofprinces_etrius_desc:0 "作为最年轻的吸血鬼氏族，睿魔尔正处于一个艰难的位置。睿魔尔他本身也处于沉眠状态，好以消化吸榨扫罗后的成果，而永远忠诚的伊崔乌斯不得不面对棘秘魑的无情攻击。你还剩着一些优势，因为氏族的异能确保了团结，而德意志和匈牙利的梵卓在某种程度上支持你。你的敌人并不以耐心著名，你应该从他们的内部危机中寻找获利的机会。\n\n#bold 你能保证睿魔尔氏族能像睿魔尔那样在吸血鬼政治中拥有强大势力么？#!"
 bookmark_warofprinces_rustovitch:0 "罗斯托维奇"
 bookmark_warofprinces_rustovitch_desc:0 "大君主之荣誉并没有落在最年长或最强大的库都术士手中，而是落在了最雄心勃勃的棘秘魑手中。到目前为止，弗拉基米尔·鲁斯托维奇的统治有点复杂，他对十字军战士朱尔根·冯·费尔登实行了白色和平，对受人憎恨的睿魔尔实行了屈辱性的惩罚。在棘秘魑内部中，很多人都希望他下台，首先是他的前任，诺利兹。若鲁斯托维奇不是一位精明的政治家的话，他将会什么也不是，只要他能够确保一些关键的胜利，他的对手可能很快就会「消失」……\n\n#bold 「狼群克星」能带领内斗不休的棘秘魑领主对抗梵卓和睿魔尔篡位者的威胁吗？#!"
 bookmark_warofprinces_mithras:0 "密特拉"
 bookmark_warofprinces_mithras_desc:0 "一位有些神秘的存在，密特拉被一些人信奉为一位字面上的波斯和罗马神。尽管这似乎难以想象，但这让他得以创建一个由狂热子嗣和密教徒组成的忠心心腹来执行他的命令。在古罗马时期的一些密谋计划失败后，密特拉逃到英格兰，但很快就厌倦了英格兰领主之间的琐碎纷争。他觉得自己最好还是在蛰眠中度日，于是把国家交给了几个值得信赖的摄政王……他们很快就自作孽了。从他的蛰眠中苏醒后，密特拉迅速地重新巩固了他的权力，修复了他的摄政王们造成的大部分混乱。现在英格兰稳固了，但还没有完全被征服。此外，你将不得不对付威尔士的野蛮刚格罗，诺丁汉的叛逆歹徒和苏格兰的的残余维京英灵战士。之后，法兰西的权力真空可通过你在波尔多的飞地被利用。\n\n#bold 你能达到多远没有限制。见证不朽太阳的荣耀吧！#!"