 bookmark_patronwar_cecil_desc:0 ""
 bookmark_patronwar_lvcivs:0 "卢基乌斯"
 bookmark_patronwar_lvcivs_desc:0 ""
 bookmark_patronwar_seitheach:0 "赛依赫"
 bookmark_patronwar_seitheach_desc:0 ""
 bookmark_patronwar_chrysantha:0 "基桑塔"
 bookmark_patronwar_chrysantha_desc:0 ""
 bookmark_patronwar_zethraeus:0 "齐特雷"
 bookmark_patronwar_zethraeus_desc:0 ""
 bookmark_patronwar_eden:0 "伊甸"
 bookmark_patronwar_eden_desc:0 ""
 bookmark_patronwar_loukios:0 "卢基奥斯"
 bookmark_patronwar_loukios_desc:0 "一位有名望的罗马百夫长，秘密地信仰着伊西斯女神密教。在阻止罗马被哥特人部落瓦解的那些年里，当战争开始变得不可挽回时，卢基奥斯离开了。他越来越迷恋埃及神话，为了更好地了解他的女神，他去了筛沙之乡朝圣。不幸的是，他没有找到他所追寻的知识——只找到古蛇的信徒。赛特在古庙里迎接他。他对他对罗马军队的了解很感兴趣。"
 bookmark_patronwar_ciaran:0 "基厄兰"
 bookmark_patronwar_ciaran_desc:0 "基厄兰是一个爱尔兰旅行者，或者更准确地说，是一位爱尔兰流浪者（原文的字面意思为“走路的人”）。他是一个23岁的年轻人，他只是做他需要的事情来生存并支撑他的家庭。这通常意味着撒谎和欺骗，因为他没有很多其他技能。虽然有着不诚实的本性，他还是非常顾家之人，而且他把所有的爱尔兰流浪者看作是他的家庭。他几乎同样尊敬任何一个游牧民族。这就是他为一个奇怪的印度斯坦旅行者提供住所的原因，该人称自己为维斯瓦纳坦。\n\n他不知道的是，维斯瓦纳坦是一位玛土撒拉，雷伏诺[clan|E]的第五代吸血鬼，他周游世界来到了爱尔兰。随后他们的营地很快得遭到了当地人的袭击，而爱尔兰人也受了致命伤。因此维斯瓦纳坦违背了自己的原则，[Embrace|E]了基厄兰，救了他一命。他教会他矛盾之路，并警告他不要做他刚刚做过的事情。然后就走了。"
 bm_1230_inquisitor:0 "黑暗时代：裁判官"
 bm_1230_inquisitor_desc:0 "公元1230年。在一群强大的怪物猎人的带领下，神圣教廷终于意识到了吸血鬼的威胁。这些英雄组成了一个崭新的，隐秘的，名为暗影裁判所的组织，他们是第一批试图重新征服夜晚并击退恐怖之物的人类。摆在他们面前的目标是艰巨的，而这些被诅咒的吸血怪物有数个世纪的时间来巩固自己并准备反击。如果他们的牺牲会人类的美好未来铺平道路，那么所谓的“裁判官”们就会像烈士一样牺牲。他们为同一个目标而战，这是任何吸血鬼都无法比拟的。\n\n#bold 你就是这个对挽魂之战一无所知的世界的唯一希望。#!"
 bookmark_inquisitor_gauthier:0 "戈捷·德·丹皮尔"
 bookmark_inquisitor_gauthier_desc:0 "戈捷是一个小法兰西伯爵的第三子，他在很小的时候就听到了上帝的召唤，并以他唯一知道的方式回应了它：战斗。在第三次十字军东征中，他第一次遇到了一位吸血鬼，这让他看清了现实，此时他聚集了一群虔诚的骑士，他们一心要与邪恶作斗争。有证据证明他是暗影裁判所的创始人，在那里他是所有军事事务的领导者。戈捷是一名可怕的战士和富有魅力的领袖，但随着年龄的增长，他开始担心自己死后裁判所会发生什么。\n\n#bold 你的丰功伟绩已经过去了，但你仍然有时间确保亚柯骑士比你活得更久。这是你服侍上帝的一生的最后一项责任。#!"
 bookmark_inquisitor_leopold:0 "利奥波德·冯·穆尔瑙"
 bookmark_inquisitor_leopold_desc:0 "利奥波德是冯·穆尔瑙家族的一个小后裔，体弱多病，被诅咒拥有一种奇怪的能力：能够真正的“闻”到邪恶的力量。头脑敏锐的利奥波德并没有害怕它，而是利用他的天赋帮助揭露了几起发生在他家里的吸血鬼阴谋。但他并没有就此止步，他很快就来到罗马，向新成立的亚柯骑士献礼。从那时起，他就成为了暗影裁判所的主要推动力量，召集了所有试图与各种形式的邪恶作斗争的人。他的家族在他身后支持，利奥波德也许是裁判所最强的支柱，领导着所有夺回夜间的努力。\n\n#bold 穆尔瑙家族立场很坚定，且巴伐利亚已经确保，但这仅仅是战斗的开始。在最后一个吸血鬼被赶出上帝的光之前，你不能停下来。#!"
 bookmark_inquisitor_maria:0 "玛利亚·伊马库拉达"
 bookmark_inquisitor_maria_desc:0 "圣约翰修女会的现任领袖并不是该修士会的创始人，但她的意志与蒙福的前任特蕾莎修女一样坚定。称她个人强大是在暗示教宗只有一点点神圣。在经历了几次经验不足的裁判官的失败后，玛利亚·伊马库拉达决定亲自前往英伦诸岛，希望能找到这个臭名昭著的吸血鬼“神王”，其可能统治着英伦诸岛。有了她坚定的信仰和裁判所其他修士会的支持，玛利亚准备教会这个敌人世上只有一个神。\n\n#bold 你确定英格兰是吸血鬼活动的中心。发现并摧毁它将是对裁判所的巨大恩惠。你将见证神王陨落。#!"
 bookmark_inquisitor_vittoria:0 "维特多利亚·圣蒂尼·迪·帕尔马"
 bookmark_inquisitor_vittoria_desc:0 "维特多利亚是一位智力超常、对上帝有强烈爱的女人，她是红修会的非正式领袖，也是暗影裁判所的研究人员。她拥有一种不可思议的直觉，知道什么时候打破规则，什么时候准确地按照东正教方式行事。因此，她显然是最重要和最危险任务的人选：清除意大利本身的吸血鬼影响，保护圣座。随着维多利亚发现教廷间越来越多超自然腐化，她发现任务将比预想的更加复杂……\n\n#bold 你决心拯救教廷，而最好的方法就是揭露和消灭意大利的吸血鬼。你已经确定了两个主要目标，一个是米兰所谓的枢机主教，另一个是在罗马嘲笑教皇的憎恶之物……#!"
 bookmark_inquisitor_aignen:0 "善书者艾格尼恩"
 bookmark_inquisitor_aignen_desc:0 "欧西坦间谍首领是神目的首领，该修士会是裁判所的眼与耳。艾格尼恩曾是罗德里格·德·纳瓦拉的中尉，并当该朋友拒绝加入暗影裁判所时而与其决裂。艾格尼恩哀悼他失去的友谊，但他知道圣座将需要一个足智多谋的间谍的强大力量。前盟友对他不屑一顾，新盟友仍对他不信任，艾格尼恩走着有所用处和被视异端之间的孤独道路。\n\n#bold 法兰西是你的家，你知道这里孕育了吸血鬼力量。清洁派异端证明了这一切。与你能聚集的少数朋友，你必须采取行动来控制局势，并希望证明你对暗影裁判所有用。#!"
 bookmark_inquisitor_rodrigue:0 "罗德里格·德·纳瓦拉"
 bookmark_inquisitor_rodrigue_desc:0 "罗德里格是第一位接触到不死族的基督徒，他活了下来，然后选择拿起武器与之对抗。他是纳瓦拉的一个小贵族，正是在清洁派异端期间，他目睹了世界上真正的邪恶。从那时起，罗德里格就一直在疯狂地试图摧毁任何被认为的吸血鬼衍生物……在他偏执的头脑里，这几乎是每个人。因此，他拒绝加入暗影裁判所，并按照自己的方式行动，与圣雅各伯之剑受其支配。\n\n#bold 他们到处都是。暗影裁判所可能是盟友，但你不能冒险。如果他们想帮忙，那很好，但你要用你自己的方式和条件来拯救伊比利亚。#!"
 bookmark_inquisitor_bayezid:0 "巴耶齐德·甘滕宾"
 bookmark_inquisitor_bayezid_desc:0 "曾是是卡洛梅娜选民劣族[cainite|E]斯坦尼斯拉夫的血仆奴隶，巴耶齐德和他的兄弟巴西尔发现他们的鲍格米勒信仰受到了不死族利益的侵蚀。1204年，斯坦尼斯拉夫在米迦勒的幻梦的破灭之中被毁灭，甘滕宾兄弟也从他们的血缚中被解放。从那时起，他们就称自己为“卡洛梅娜的被遗忘者”，并带领着鲍格米勒的信徒在波斯尼亚各地攻击吸血鬼。\n\n#bold 卡洛梅娜，该隐的孪生姐妹，期望该隐的不死族子嗣被毁灭！#!"
 BOOKMARK_CHARACTER_DIFFICULTY_VERY_HARD:2 "#difficulty_hard 极难#!"
 bookmark_patronwar_jose:0 "何塞"
 bookmark_patronwar_jose_desc:0 ""
 bookmark_patronwar_hannibal:0 "汉尼拔"
 bookmark_patronwar_hannibal_desc:0 ""
 bookmark_patronwar_antariksha:0 "安塔裡克施·钱德拉"
 bookmark_patronwar_antariksha_desc:0 ""
 bookmark_patronwar_rostislav:0 "罗斯季斯拉夫"
 bookmark_patronwar_rostislav_desc:0 ""
 bookmark_warofprinces_hardestadt:0 "哈德施塔特"
 bookmark_warofprinces_hardestadt_desc:0 "哈德施塔特是第一位新生代梵卓亲王，比那些古罗马时代的长者更适应中世纪，来自于一个岌岌无名、毫无价值的世系。这位巴伐利亚军阀利用凡人的神圣罗马帝国将梵卓氏族的中心从罗马转移到了德意志，在这个过程中他巩固了自己在同胞中的掌控。\n哈德施塔特在掌权后极少遇到阻碍，但是一些问题依然存在，例如茱莉亚·安塔西亚治下的顽固的罗马人……\n\n#bold 你有一个强大的领地以及由你支配的子嗣和盟友，抛弃罗马的过往包袱，你将在即将到来的数个世纪定义何为梵卓。#!"
 bookmark_warofprinces_antasia:0 "茱莉亚·安塔西亚"
 bookmark_warofprinces_antasia_desc:0 "罗马共和国的女儿是另一个时代的梵卓，那时她的[clan|E]是永恒元老院的守护者，是[cainites|E]的无情世界中的乌托邦。那是茱莉亚的完美世界，每位梵卓都有着话语权，而投票权也不分年龄和性别。元老院的法律能成为[clan|E]未来千年的戒律……随后，卡米拉和他的堕落疯狂来了，紧随其后的是哈德施塔特和他无情的野心。\n于她的法兰克福亲王领，茱莉亚并没有失去将她的[clan|E]带回其根源的希望。理想主义可能仍然是梵卓[clan|E]的未来之路。\n\n#bold 你不能让哈德施塔特，或者更糟的卡米拉，支配梵卓[clan|E]的未来。你必须为元老院与共和国而战！#!"
 bookmark_warofprinces_jurgen:0 "约根·冯·费尔登"
 bookmark_warofprinces_jurgen_desc:0 "这位声名显赫的德意志骑士是哈德施塔特的得力助手，尽管他年纪轻轻，但他的名字已经远近闻名。约根是马格德堡的一位严格但公正的统治者，他是完美的梵卓骑士，同时也是勇敢和无情的野心家。\n约根最近对棘秘魑军督领发动了战争，并强迫建立了一个缓冲国。但这还不够，他已经在计划下一次进攻了……只要他能摆脱亚历山大，这个累赘的流亡法兰西亲王。\n\n#bold 你的荣誉就是你的承诺，这是你的野心所遭受的唯一限制。通过火和剑，通过征服和外交，梵卓[clan|E]总有一天会在你面前低头。#!"
 bookmark_warofprinces_anna:0 "安娜·科穆宁"
 bookmark_warofprinces_anna_desc:0 "作为拜占庭公主，安娜·科穆宁在凡生中被剥夺了她与生俱来的权利……在她亡生又被剥夺了第二次。当她于不死族的君士坦丁堡的权力结构中努力工作时，第四次十字军东征发生了，打破了世界渴望之城的任何理智表象。但安娜是个耐心细致的谋划者，她成功地确保拜占庭继承者王国中最强大的尼西亚成为她的领地。她对君士坦丁堡过去的梦想和乌托邦毫不在意，这使她与许多其他希腊幸存者产生了隔阂，但她不会让这些阻碍她取得战果。不再会了。\n\n#bold 君士坦丁堡终于在望了。不要让任何人挡在你的天命前，它最终将属于你。#!"
 bookmark_warofprinces_anadja:0 "阿娜佳"
 bookmark_warofprinces_anadja_desc:0 "作为一个波斯商人的女儿，阿娜佳注定要过着平淡无奇的生活，直到受人尊敬的贝利撒留和谢巴赫看上了她，把她当作自己的孩子抚养。有了这样令人印象深刻的导师们，阿娜佳很快就适应了[cainite|E]的世界，并很快被一个秘密的密教组织注意到，认为她是他们应许的救主。\n从那时起，阿娜佳已经成为亚美尼亚最有影响力的吸血鬼，并且仍然在接受她的“父母”和密教组织的指导。她现在已经长大到可以独立统治了，只有时间能证明她是否能达到对她的崇高期望。\n\n#bold 你已经为这一时刻做了专业的准备。是时候写下你自己的故事了，该结局只能由你来讲述。#!"
 exit_char_window:0 "返回"
 bm_1230_warofprinces_sub_ventrue:0 "梵卓氏族"
 bm_1230_warofprinces_sub_ventrue_desc:0 "自称是该隐之子世界的统治者，梵卓是黑夜的高贵的领主和女士。长期以来，他们一直是最自豪的吸血鬼世系之一，努力维持着荣誉、优雅的行为和领导的声誉。长期以来，贵族责任感充斥着这个家族，并伴随着一种真诚的信念，即梵卓知道什么对每个人都是最好的。\n最近一连串的挫折困扰着这些蓝血者，罗马的沦陷，以及法兰西——他们的据点之一——的丢失。尽管如此，梵卓氏族仍然统治着中世纪的夜晚。如它本该是。\n\n#bold 梵卓氏族的霸权是不可妥协的。教他们晓得。#!"
 main_sub_bookmark:0 "主要"
 ventrue_sub_bookmark:0 "梵卓"
 lasombra_sub_bookmark:0 "勒森魃"
 bm_1230_warofprinces_sub_lasombra:0 "勒森魃氏族"
 bm_1230_warofprinces_sub_lasombra_desc:0 "阴暗的掠夺者和无情的社会攀附者，勒森魃为个人的成功而存在，为个人的胜利而争斗，而不是仅仅为了戴上皇冠或坐上王座。他们相信强权即正义，并愿意牺牲一切来实现他们的目标。\n作为一个将精神信仰作为工具而不是寻求开明启蒙的氏族，他们善变的忠诚目前被困扰着暗影之海的大规模内战所凸显，他们那曾经横跨地中海的帝国。穆斯林在伊比利亚与基督徒作战，基督徒在意大利与异教徒作战，年轻人同时在各地与他们的长者作战。当勒森魃自相残杀时，其他氏族都松了一口气，他们知道若他们统一起来，他们能取得怎么样的成就。\n\n#bold 勒森魃氏族将于同族的血液中被重新铸造。溅血，并征服。#!"
 bookmark_warofprinces_lucita:0 "露西塔·德·阿拉贡"
 bookmark_warofprinces_lucita_desc:0 "作为阿拉贡国王阿方索二世的女儿，露西塔从小就渴望着独立和自由。她强烈的自立性和不屈不挠的意志让勒森魃红衣主教安布罗西奥·路易斯·蒙卡达无比欣赏并初拥了她。从那时起，露西塔就成了勒森魃[clan|E]的新星和她[Sire|E]的骄傲。尽管她已经获得了赞扬和许多成就，这位凶猛的公主已经又再一次渴望着，更多，更多的自由……这违背了她[Sire|E]和[clan|E]对她的期望。  \n\n#bold 没人能把你关入笼中太久，露西塔。争取你的独立，即使你要为此激怒你的整个[clan|E]。#!"
 bookmark_warofprinces_moncada:0 "安布罗西奥·路易斯·蒙卡达"
 bookmark_warofprinces_moncada_desc:0 "安布罗西奥·路易斯·蒙卡达是一个有野心、有才华、有信仰的人，生前是马德里的大主教。不出意外，蒙卡达充分利用了他的地位。然而，令许多人惊讶的是，他在这样做的同时，还坚持着严格的僧侣生活。他在信仰上是毋庸置疑的，在信念上是不可动摇的，在为他认为的天国事业上权力使用是坚决的。[Embrace|E]对蒙卡达的改变比人们想象的要小。他很快就成为了暗影再征服的主要推动力，他在勒森魃[clan|E]内部的影响力也在稳步上升，但他寻求权力的原因并没有改变。这不是为了蒙卡达（那个可怜的肉体外壳）的荣耀，而是为了上帝的荣耀。\n\n#bold 你注定要统治伊比利亚和勒森魃[clan|E]本身。上帝选择了你担任祂的神圣大任，你将遵从祂的意愿，就像你一贯所做的那样。#!"
 bookmark_warofprinces_badr:0 "拜德尔"
 bookmark_warofprinces_badr_desc:0 "随着伊比利亚勒森魃内战的进行，被称为[ashirra|E]的安达卢西亚[cainites|E]找到了一个新的领袖。格拉纳达的拜德尔。这位神秘的苏丹采取了强硬的立场，并将不同的泰法诸国召集到她的事业中。她的努力使[ashirra|E]社区产生了分歧，因为许多人认为她并不比基督徒好多少，但仍然设法减缓了可怕的再征服。随着她的名气越来越大，一些人开始对围绕她的谜团感兴趣……而其中有数个好奇的灵魂已经遭遇了痛苦的结局。拜德尔用阴暗的铁拳进行统治，但同样还是铁拳。\n\n#bold 你必须战胜再征服。这是你野心的跳板，那些阻挡你的人有祸了。#!"
 bookmark_warofprinces_lucius:0 "卢修斯·埃利乌斯·塞扬努斯"
 bookmark_warofprinces_lucius_desc:0 "卢修斯·埃利乌斯·塞扬努斯曾经是罗马禁卫军的一员，差点儿就成为了皇帝，但在他实现自己野心之前生命就截然而止。在台伯河岸边，据说是母狼发现罗穆卢斯和雷穆斯的地方，一名勒森魃从水流中拖出了塞扬努斯的尸体。在发现生命最后的余火还在他的胸中闪烁后，这位长者初拥了他。她离开时对其说：“就像你命中注定的那样，你必将再次掌权，消灭掉那些挑衅你的领主。你有超越尊长的潜力，切记要明智的使用它。”从那时起，本该成为皇帝的他现在寻求成为黑夜的帝皇，即将在这场盛大游戏中走出第一步......\n\n#bold 天亮之前，你要运用力量去威胁你最强大的同类。确保这次你的真正命运不要再被打断！#!"
 bookmark_warofprinces_gratiano:0 "葛莱西安诺·德·维罗纳"
 bookmark_warofprinces_gratiano_desc:0 "葛莱西安诺·德·维罗纳是勒森魃本人的最后一个子嗣，而且还很年轻，他在凡生中是一个不起眼的意大利贵族，导致许多人想知道为什么该上古耆宿如此青睐他。但葛莱西安诺知道答案：他生而伟大。维罗纳确信自己的重要性，现在正公开反对他的“长兄”蒙塔诺，即勒森魃[clan|E]的现任摄政。在维罗纳的宫廷里，葛莱西安诺清楚地知道，除了他[clan|E]中最年轻的家伙，他被所有的人鄙视和嘲笑。但是，即使是这样一个小而弱的权力基础也会随着时间的推移而增长，有一天晚上，葛莱西安诺可能就是那个嘲笑他们所有人的人……\n\n#bold 你必须迅速赢得尊重和权力，若你要挑战你“兄长”的头衔。接着，可能是时候和你的“父亲”本人谈谈了……#!"
 bookmark_warofprinces_alfonzo:0 "威尼斯的阿方索"
 bookmark_warofprinces_alfonzo_desc:0 "威尼斯的阿方索是纳尔西斯最有天赋的孩子之一，两个多世纪以来，他一直是君士坦丁堡最杰出的[cainite|E]。众所周知，阿方索煽动了1185年的拉丁人暴动，他还利用第四次十字军东征，宣称自己是世界渴望之城的亲王，来为他赢得了巨大的权力......以及许多流亡的希腊[cainites|E]永远的敌意。名义上阿方索像他的[Sire|E]一样是该隐异端的追随者，但他更像是冷酷的实用主义者，而且他已发誓效忠暗影之海以保证自身的权力，尽管这些人对他的信仰持着反对意见。不过，未来可能还需要与魔鬼进行许多交易......\n\n#bold 你为确保最大的奖赏而不懈努力。没有人可以从你手中夺走君士坦丁堡。#!"
 bookmark_warofprinces_suleiman:0 "苏莱曼·伊本·阿卜杜拉"
 bookmark_warofprinces_suleiman_desc:0 "苏莱曼首先在麦地那接触了穆罕默德，目的是让他成为对抗麦加强大的[cainites|E]的棋子。他本人复述说，在这一时刻，他看到了自身内心获得救赎的可能性，并皈依了先知传播的新宗教。随后，在先知的征服过程中，苏莱曼站在其一方，并成为了阿什拉教派的主要创始人之一，以初拥的方式来欢迎任何愿意继续追随这条道路的穆斯林。到目前为止，他的工作大部分是成功的，[ashirra|E]从伊比利亚扩至波斯，但他们表面上的团结开始形成裂痕。苏莱曼必须迅速采取行动，以免这种早期的分歧将他的终身事业削弱到一个危险的程度。\n\n#bold 维持[ashirra|E]的强大和团结，也许勒森魃[clan|E]本身可能会在某个夜晚得知真相。#!"
 toreador_sub_bookmark:0 "妥芮朵"
 bm_1230_warofprinces_sub_toreador:0 "妥芮朵氏族"
 bm_1230_warofprinces_sub_toreador_desc:0 "妥芮朵是以最美丽、最色情、最诱人、最感性和最有魅力的吸血鬼氏族而闻名。美学家们负责创造吸血鬼的传说，他们用美貌、爱情和肉欲来诱惑和引诱他们的猎物。\n他们也不避讳统治的艺术，直到最近，他们还在可以说在最伟大的吸血鬼帝国，君士坦丁堡的幻梦中掌握着权力。它的衰落动摇了这个氏族，但对法兰西的一次适时的接管意味着妥芮朵有了一个新的，不过还是很脆弱的驻点。除了法兰西，妥芮朵在整个欧洲和中东都拥有较小的权力地位，并且仍然是该隐之子世界的主要推动力量之一。\n\n#bold 黑夜需要一位新的、优雅但致命的统治者。让世界知道玫瑰也有刺。#!"
 bookmark_warofprinces_salianna:0 "萨利安娜"
 bookmark_warofprinces_salianna_desc:0 "萨利安娜大约于公元前170年出生在希腊，是古代诸神的圣女，她从未原谅过她的[Sire|E]，即强大的米迦勒，因为他在精神上玷污了她的纯洁。她拒绝帮助他实现关于永生的疯狂幻梦，并独自出走，但在定居巴黎之前的几个世纪中，她只见得背叛和欺骗。她终于在这里找到了成功，并努力使法兰西与它的吸血鬼霸主亚历山大一起繁荣。\n然后她又被背叛了，因为亚历山大在愤怒中杀死了她心爱的子嗣。这是最后一根稻草。她在亚历山大本人的子嗣的帮助下策划了一场政变，将梵卓赶出了法兰西。现在，萨利安娜是该地区的真正掌权者，但她的控制力仍然很弱……而亚历山大还未死。\n\n#bold 迅速巩固你的新力量。再也没有人能够背叛你了。#!"
 bookmark_warofprinces_isouda:0 "伊思妲·德·布莱斯"
 bookmark_warofprinces_isouda_desc:0 "伊思妲从不喜欢她作为小贵族的女儿所面临的命运。她非常痛恨这一点，以至于她狠狠地咬了一个潜在的追求者，以确保他明白她的意思。伊思妲在成为[cainite|E]之后并没有什么变化，她的优雅和美丽几乎没有掩盖住近乎野化的攻击性和残忍……这使她能够在她年轻的时候就获得作为爱之女王的权力。但这对伊思妲的野心来说太小了，她打算利用萨利安娜对法兰西不稳定的控制来实现自己的目的。安茹的女王不是一朵带刺的玫瑰，她是一朵带尖牙的玫瑰。\n\n#bold 在外表上，你是美丽的，优雅的，甚至是宜人的。在内心深处……你知道他们都是被你随意利用和抛弃的棋子。你的血腥扬升仅仅只是开始。#!"
 bookmark_warofprinces_melinda:0 "梅琳达·加尔布雷思"
 bookmark_warofprinces_melinda_desc:0 "梅琳达的过去被蒙上了一层神秘的面纱，唯一可以确定的是，她在被海伦绑架之前出生在西班牙。即使以玛土撒拉通常冷酷无情的[Embrace|E]方式来说，梅琳达的那段经历也是肮脏而残酷的，后来海伦感到厌烦，就把她独自留在这里自生自灭。从海伦“养育”的熔炉中走出来的梅琳达是一个无情的幸存者，除了自己的野心，她对任何事情都不屑一顾。一个真正的掠夺者现在在伊比利亚被释放出来，如果她必须在身后留下一堆尸体才能扬升，那就这样吧。\n\n#bold 你从海伦那里学到了很多东西，你知道真相：这个世界是一个血腥的战场，只有少数人可以茁壮成长。你将是其中之一。#!"
 bookmark_warofprinces_rafael:0 "拉斐尔·德·柯拉蓉"
 bookmark_warofprinces_rafael_desc:0 "拉斐尔在年轻时就被教会收留，很快就发现了他在密谋方面的才能。他没有什么技巧，也不热心，但他还是利用他的阴谋对当地的僧侣取得了一些影响，过上了舒适的生活。然后有一天晚上，卡利斯蒂–卡斯蒂略来了。这个异教女巫迷上了僧侣们的一个雕塑……拉斐尔谎称是他的作品。她因此初拥了他，并要求他再做一些这样的艺术，而这个骗子显然没有能力做到这一点。她很生气，差点当场杀了他，直到拉斐尔说他的欺骗行为也算是一种艺术形式，才求得一命。卡利斯蒂觉得很有趣，就同意了，让他在[cainite|E]世界中自生自灭。\n\n#bold 你不知道你到底是怎么活下来的，但你做到了。现在你需要了解这个陌生的新世界。也许还有其他的傻瓜可以欺骗？#!"
 bookmark_warofprinces_karl:0 "青之卡尔"
 bookmark_warofprinces_karl_desc:0 "作为一位北欧的说书人，卡尔与勇敢的比约恩一起南下寻找财富和冒险，在亚历山大城被一个不信神的妥芮朵初拥了。在与他的[Sire|E]学习了一段时间的阿拉伯人故事后，卡尔踏上了回家的路，利用他无尽的日子对北欧传统的所有故事进行编目。当基督教来临时，卡尔奋力抵抗，但很快预测到了不祥之兆。因此，他搬到了芬兰，创建了“自由邦”，这是最后的堡垒，他心爱的故事在这里得以延续……但即使在这片偏远的土地上，十字的阴影也在增长。\n\n#bold 你为一个比自己更伟大的事业而战，只要你有能力，你就会捍卫你的人民的传承。但你也知道大多数北欧故事的结局都…… #!"
 bookmark_warofprinces_rosamund:0 "伊斯灵顿的罗莎蒙"
 bookmark_warofprinces_rosamund_desc:0 "罗莎蒙是一名诺曼小贵族的女儿，自出生之后就一直被培养着要做大事。罗莎蒙幼时被选进了伊思妲·德·布莱斯的宫廷，在那里面茁壮地成长。她学会了如何表现得既谦虚而又迷人，用智慧与人辩论，用微笑醉人心魂。在她十七岁生日那天，她被叫到伊思妲面前来祝贺。随后她的女主人告诉了她其命运：加入[cainites|E]的行列。从那时起，罗莎蒙就被大王庭的强大梵卓统治者亚历山大本人深深迷恋上了，并且他还在流亡马格德堡时把罗莎蒙一起带走了。这位残酷的玛土撒拉愈夜变得发疯，罗莎蒙正在寻找任何她能找到的逃跑方式……\n\n#bold 趁现在还来得及，你必须得摆脱亚历山大。也许风度翩翩的马格德堡公爵约根·冯·费尔登能帮上忙？#!"
 brujah_sub_bookmark:0 "布鲁赫"
 bm_1230_warofprinces_sub_brujah:0 "布鲁赫氏族"
 bm_1230_warofprinces_sub_brujah_desc:0 "布鲁赫是一个以对激进哲学的强烈追求而闻名的战士学者氏族，他们经常以同样的纪律来训练他们的稚子的战斗和古典学。在古典时代，他们与梵卓平起平坐，在整个地中海地区拥有巨大的权力地位。后来，他们的乌托邦迦太基被毁于可恨的罗马人之手。现在，这个氏族堕落了，仍在哀悼失乐园，并从贤明的统治者衰落到今晚越来越常见的小逆徒。\n被他们的愤怒和悲伤所淹没，布鲁赫在已失的事业上大肆抨击，直到他们最终能够找到他们的新命运。一些长者担心，这可能永远不会发生。\n\n#bold 布鲁赫氏族正处于光荣的过去和未知的未来之间的过渡期。像你这样的伟大领袖将会成为决定未来数个世纪他们本我的火花。#!"
 bookmark_warofprinces_bjorn:0 "比约恩·加里森"
 bookmark_warofprinces_bjorn_desc:0 "这位可怕的巨人是不列颠群岛最后的英灵战士（维京吸血鬼）之一。比约恩在逃离他的族人对挪威发动的战争败北时滞留在苏格兰，他的目光越来越向西，投向传说中的文兰。但他的魅力和潜伏力量使他成为国内抵抗密特拉的实际集结点。尽管他不愿意再打一场败仗，但比约恩从未放弃过他的朋友，因此将再次为他们拿起斧头。\n\n#bold 你已经习惯了绝望的战斗。但也许这一次还有希望……#!"
 bookmark_warofprinces_leeland:0 "罗宾·李兰德"
 bookmark_warofprinces_leeland_desc:0 "这个兜帽之下的男人整个一生乃至亡生都在与暴君斗争。他那坚毅而沾满灰尘的面容在跨越中世纪的几次平民起义中都有出现——他直接参与了各种反对英国贵族的农民起义，是一名无政府主义倾向特别强烈的倡导者，经常在军事冲突中奋战在最前线。\n但无论他如何努力，他都无法击败密特拉，那位英格兰的“神王”。在柯克利斯修道院之战中惨败后，罗宾的光环和影响力大大减弱，密特拉正步步逼近，准备一绝后患。 在不列颠群岛，自由之光也许很快就会永远熄灭。\n\n#bold 你的事业正义，你的目标准确。这可能不足以赢得胜利，但足以创造传奇。#!"
 bookmark_warofprinces_veronique:0 "维罗妮克·德·奥尔良"
 bookmark_warofprinces_veronique_desc:0 "维罗妮克·德·奥尔良是一个多才多艺的女人。她是法兰西[cainites|E]（甚至更广）的有能政治家，是她的凡人朋友和盟友的坚定捍卫者，是强大的战士，是熟练的治疗师，即使在她极其年轻的时候，也是亲王之战的参与者。\n维罗妮克因她平和的心态和创新的思维而被再造，她总是与社会对抗，无论是凡人的还是吸血鬼的，都是如此。她最近在推翻法兰西亲王亚历山大的过程中发挥了作用，但对残酷的巴黎政治很警惕。因此，她回到了自己的家乡，而法兰西[cainites|E]则想知道她的下一个意外之举是什么。\n\n#bold 忠于自己的理想，让别人低估了你。他们很快就会明白，有情并不代表软弱。#!"
 bookmark_warofprinces_menele:0 "墨涅拉俄斯"
 bookmark_warofprinces_menele_desc:0 "墨涅拉俄斯是公元前13世纪的古希腊国王，他在凡生中被迦太基[cainites|E]所取得的成就所感动，由于他是一位强大的战士和演说家，很快就沦为旅行外交官的角色。因此，当大背叛来临时，他不在城里，背叛者是一位名叫海伦的美丽妥芮朵。\n他们之间的传奇仇恨从这一天开始。他们在无数的战场上厮杀，在他们的身后摧毁了无数的城市，但他们仍然没有人能够占到上风。墨涅拉俄斯对这场“游戏”越来越厌倦，尤其是当他看到布鲁赫[clan|E]在他周围分崩离析时。必须得有个结果了，不管它是什么。\n\n#bold 你的怒火终于平息了，但海伦还是必须得被绳之以法。然后，也许是时候治愈布鲁赫[clan|E]了。#!"
 bookmark_warofprinces_ecaterina:0 "伊卡捷琳娜"
 bookmark_warofprinces_ecaterina_desc:0 "在一个男人的世界里，伊卡捷琳娜是一个坚强的女人，在一次差点被强奸的经历中勉强活了下来，在最后一刻被她未来的[Sire|E]所救。她被他关于迦太基和每个人之间和平共处的乌托邦的故事所吸引，成为了一名狂热的普罗米修斯派。她太年轻了，没有真正的影响力，她很快就为自己制作了一个假身份，作为迦太基毁灭的幸存者，为她赢得了巨大的尊重和名声。\n她最近的举动是[Embrace|E]一个非常有前途的人，克里斯托夫·罗慕铎，他已经为她的认可付出了很多。他最近在与对抗一位强大的棘秘魑的终末之战后失踪，给她的计划带来了影响。\n\n#bold 找到克里斯托夫并确保他继续支持，那么你的事业就会更接近完成。#!"
 bookmark_warofprinces_yitzhak:0 "伊扎克·本·亚伯拉罕"
 bookmark_warofprinces_yitzhak_desc:0 "作为一位犹太拉比的独生子，伊扎克出生在布拉格，他对大多数事件的第一反应是同情和关怀，这一事实催化出了他受到的[Embrace|E]，他的[Sire|E]认为这种善意必须保留下来。尽管他现在受诅的状态值得震惊，但伊扎克的不死族化并没有改变他的行为，在欧洲游荡了几年后，他回到了自己的家乡波兰。\n在他的旅行中，他看到了犹太人在欧洲各地受到的待遇，以及许多吸血鬼在夜晚独自徘徊，因简单地效忠于他们的[clan|E]或辈代而被其他人排斥。他的精神责任是创造一个所有生命都能并肩存在的地方，就像上帝为他们安排的那样。\n\n#bold 波兰可能是你一直梦想的安全港湾。但许多障碍仍在你的路上。#!"
 bookmark_warofprinces_hektor:0 "赫克托"
 bookmark_warofprinces_hektor_desc:0 "赫克托在西罗马灭亡和拜占庭兴起时被再造，他在稚子时期听着希腊和迦太基的荣耀故事度过黑夜。由于对他的[Sire|E]和他的同辈缺乏对[clan|E]衰落做出实际行动的意愿感到沮丧，赫克托愤怒地四处寻找他可以把握的东西，以赋予他的存在以意义。\n赫克托召集了一群分割的年轻[cainites|E]，成功地在帝国组织了一场叛乱，夺取了许多爱琴海岛屿，建立了他的新迦太基。他现在担任这个新国家的独裁者，这是一个混合了希腊民主理想和迦太基政治与宗教的奇怪构造。\n\n#bold 你的乌托邦还很年轻，你即将做出的决定将铸就它的真正身份。#!"
 cappadocian_sub_bookmark:0 "卡帕多西亚"
 bm_1230_warofprinces_sub_cappadocian:0 "卡帕多西亚氏族"
 bm_1230_warofprinces_sub_cappadocian_desc:0 "卡帕多西亚是研究死亡和灵魂的学者，他们经常专注于这些，而忽略了世界上更大的事务。得天独厚的是，他们一般都很平和，对统治权、政治暗杀和其他不死族生活的礼节都不太关心。\n直到最近，卡帕多西亚氏族只在他们同名的地区处有权力地位，除了一些例外。这一事实随着野心勃勃的威尼斯乔凡尼家族的加入而改变。意大利的亡灵术师们在很短的时间内就利用他们相当大的商业影响力，成为地中海各地的重要权力者。\n\n#bold 随着乔凡尼家族的到来，卡帕多西亚氏族似乎将会从重要的结构性变化中受害，或受益。注意不要被那些……所取代#!"
 bookmark_warofprinces_japhet:0 "雅弗"
 bookmark_warofprinces_japhet_desc:0 "雅弗是卡帕多西亚[clan|E]的非正式领袖，无条件地忠于他的[Sire|E]卡帕多西亚本人。在埃尔吉耶斯领地上，雅弗的权威很强，但他的大多数同胞的隐居倾向限制了他对[clan|E]的实际权力。更糟糕的是，他必须与他那古怪的、经常受骗的[Sire|E]和他的宏伟愿景相协调，而后者经常与雅弗更为务实的观点相冲突。\n他仍然没有原谅将乔凡尼家族引入血统的做法，有种种迹象表明这不是一个好主意。这个忠实的儿子越来越认为，自己的“父亲”可能是卡帕多西亚[clan|E]通往繁荣的最大障碍。\n\n#bold 你必须在这些困难时期领导你的[clan|E]，并努力减轻你[Sire|E]的妄想症。这是一项忘恩负义的任务，但只有你能做到。#!"
 bookmark_warofprinces_bela:0 "贝拉·拉森科"
 bookmark_warofprinces_bela_desc:0 "贝拉在凡生中受过良好的神学教育，但他从未真正关心过信仰问题。他被一个狂热的忏悔的吸血鬼[Embrace|E]后，几乎没有改变这一事实，贝拉立刻陶醉在永生的荣耀中。当疯狂的预言家奥克塔维奥告诉他名为库帕拉的实体的伟大时，他发现了自己真正的使命。\n贝拉突然被他的新目标——成为这个黑暗生物的化身——所吞噬，他设法将索菲亚据为己有，这是他走向神化的第一步。在外界看来，拉森科是一个古怪但宜人的亲王。对有见识的人来说，他是对东欧稳定的最大威胁之一。\n\n#bold 你选择库帕拉，库帕拉也会选择你。即使你不得不牺牲整个城市来使其聆听。#!"
 bookmark_warofprinces_apacia:0 "阿帕西亚"
 bookmark_warofprinces_apacia_desc:0 "阿帕西亚于凡生时是斯基泰人，被训练成一名战士，并成为古代国王陵墓的守护者，这是一个非常荣耀的职位。其中一个坟墓是一位卡帕多西亚的藏身处，她很快就被初拥了，以继续她的职责，直到永远。\n最终，她的才能被卡帕多西亚本人注意到了，卡帕多西亚任命她为将军，进攻后来成为埃尔吉耶斯的山地堡垒。然而，不久之后，居民们开始反感阿帕西亚对研究和哲学的不感兴趣。事实上，他们中的许多人认为她是[clan|E]血统的耻辱，因为她仍然顽固地目不识丁。最终，她被要求离开。\n\n#bold 你到达了俄罗斯，在寒冷的西伯利亚汗国被尊称为女王。这些人在精神上与你心爱的斯基泰人如此接近，这赢得了你的心，你将尽力保护他们。#!"
 bookmark_warofprinces_augustus:0 "奥古斯都·乔凡尼"
 bookmark_warofprinces_augustus_desc:0 "新被初拥的威尼斯乔凡尼家族的领袖是一位无情的亡灵术师，他是罗马术士的后代。虽然奥古斯都自己是一位非常有能的亡灵术师，但他更多地是作为家族的族长而闻名，这个身份为他赢得了被卡帕多修斯本人初拥的荣誉。\n这一事实使他在[clan|E]中很少有朋友，大多数人认为他是一个随时准备背叛他们的新秀。已然永生，奥古斯都加强了对其家族的控制，将他们变成了一支纪律严明的军队，随时准备为他效劳。至于他的命令到底是什么，谁也不知道……\n\n#bold 在威尼斯的发展帮助下，你的家族的影响力正在快速增长。很快，你的恩人[clan|E]的用处就将消失……#!"
 bookmark_warofprinces_ambrogino:0 "安布罗吉奥·乔凡尼"
 bookmark_warofprinces_ambrogino_desc:0 "安布罗吉奥是位出生于乔凡尼家族的私生子，通过他的亡灵术掌握，结合他的恶毒和纯粹的野心，他获得了家族长老的注意。当卡帕多西亚[clan|E]开始初拥家族成员时，他是少数被选中接受迷吻的人之一。因此，他是极少数血统来自卡帕多修斯而非奥古斯都·乔凡尼的乔凡尼[cainites|E]之一。\n虽然他经常被认为是奥古斯都的右手，但安布罗吉奥的真正热情在于神秘学。他对神格的兴趣使他找到并破译了无数的古代文字和预言，但迄今为止，真理还没有被他发现。\n\n#bold 通往神格的钥匙一定就在这里的某个地方，不找到它你就不能停下来。#!"
 bookmark_warofprinces_claudius:0 "克劳狄乌斯·乔凡尼"
 bookmark_warofprinces_claudius_desc:0 "克劳狄乌斯既是奥古斯都·乔凡尼的儿子，也是他的子嗣，在他父亲被接受进入死亡之[clan|E]后不久就被初拥了。他是一个合格的亡灵术师，也是一个有能力的政治家，经常被认为是奥古斯都的右手……当这个头衔没有给安布罗吉奥·乔凡尼的时候，这个事实在两人之间造成了相当大的紧张气氛。\n克劳狄乌斯是少数几个了解奥古斯都真正计划的人之一，到目前为止，他只表现出对他父亲坚定不移的奉献。他目前的任务是监督威尼斯在堕落的拜占庭帝国中不断增长的财产，确保该家族在这个权力真空中脱颖而出。\n\n#bold 在你的新职责中勤奋努力，也许你最终可以一劳永逸地摆脱那个讨厌的安布罗吉奥。#!"
 bookmark_warofprinces_markus:0 "马库斯·穆萨·乔凡尼"
 bookmark_warofprinces_markus_desc:0 "马库斯·穆萨·乔凡尼是克劳狄乌斯最年轻的曾孙，因其敏锐的好奇心和敏锐的智力而被纳入[clan|E]。被接纳后，他就证明自己是位杰出的学者，最重要的是他是位优秀的历史学家。他对自己有着卡帕多西亚的血统感到自豪，并试图向[clan|E]中的怀疑者证明自己家族的价值。\n在第一次任命于君士坦丁堡后，马库斯与强大的流亡者拉撒路发生了冲突，并在收集到一些关键信息时成功逃脱。这些早期的成功使他成为家族的新星，而他的新任命可能会使他进一步提升。\n\n#bold 你既是乔凡尼，也是卡帕多西亚，你的两个家族都以把你算作他们的成员为荣。有什么会出错呢？#!"
 tzimisce_sub_bookmark:0 "棘秘魑"
 bm_1230_warofprinces_sub_tzimisce:0 "棘秘魑氏族"
 bm_1230_warofprinces_sub_tzimisce_desc:0 "如果有人说棘秘魑没有人性还是虐待狂，棘秘魑可能会赞扬他们的敏锐，然后证明他们对虐待狂的凡人式定义是可笑的微不足道。作为一个具有诫律和历史的氏族，从人们能记录以来，他们一直都是东欧的主人。\n从他们在特兰西瓦尼亚的居所，他们公开统治他们的小领地，不在乎可怜的牲畜的意见或福祉。最近，对可恨的梵卓和睿魔尔的挫折迫使他们统一在一个更大的军督领之下。但这种新建立的凝聚力是不稳定的，因为怪物之间没有荣耻。\n\n#bold 彻底的支配是棘秘魑氏族与生俱来的权利，其他所有人都应该明白自己的位置：匍匐在你脚下，乞求你的怜悯。不是说你还有什么…….#!"
 bookmark_warofprinces_myka:0 "迈卡·维科斯"
 bookmark_warofprinces_myka_desc:0 "学者，享乐主义者，无情的阴谋家……迈卡·维科斯是所有这些东西，甚至更多。曾经由睿魔尔魔法师培养的迈卡，在君士坦丁堡之幻梦的时代成为了一名有价值的奥伯图斯学者。当第四次十字军东征摧毁了这座城市时，他找到了一种新的信仰，一种无情的激情，并在他巴尔干的收养时家乡找到了新的政治诀窍。\n他的第一个重大成就是在梵卓和他自己的[clan|E]之间充当了和平缔造者……并在这个过程中为他流亡的希腊同胞们争取到了一个国家作为缓冲国。\n\n#bold 你在和平协议期间的诡计树立了很多敌人，他们不会再低估你了。准备好迎接即将到来的清算吧。#!"
 bookmark_warofprinces_hedeon:0 "海德翁·雅罗斯拉维奇"
 bookmark_warofprinces_hedeon_desc:0 "彻头彻底的邪恶和狡猾，海德翁除了自己的权力之外，对任何事情都不关心。他认为所有人类凡生（和[cainite|E]亡生）都只有在侍奉他时才有价值。他的城堡附近的村民被当作小白鼠，进行各种卑劣的实验。有些人现在在他的地牢里充当活陷阱，或者在他的堡垒的房间里充当活隔板。\n海德翁在波兰的真正影响力一直被他的（正确地说是被吓坏的）邻居们所限制，但克拉科夫的拉兹科利纳亲王最近的一阵[torpor|E]却带来了新的机遇……\n\n#bold 你显然是一位真正的棘秘魑应该是的最好例子。当你登上你的合法权位时，他们将尽情地恐惧和尖叫……#!"
 bookmark_warofprinces_razkoljna:0 "拉兹科利纳"
 bookmark_warofprinces_razkoljna_desc:0 "作为斯拉夫酋长的女儿出生，拉兹科利纳的丈夫在自己被[Embrace|E]之后与她分享了这个迷吻。他们很快就确立了自己作为部落真正领袖的地位，并以最强壮的战士为食，杀死了任何敢于反对他们的人。\n当基督教传教士来到波兰时，这标志着他们的末日开始了。她的[Sire|E]倒在了入侵者的剑下，但拉兹科利纳设法杀死了其余的攻击者。\n她很快宣称克拉科夫是她的领地，并开始鼓励其发展，同时设法抵御匈牙利的梵卓和她自己的族人。\n\n#bold 你最近在经历了一小段时间的[torpor|E]后重新苏醒了。这个意外的挫折让新的势力在波兰获得了影响力，这是你必须尽快纠正的事情。#!"
 bookmark_warofprinces_shaagra:0 "莎格拉"
 bookmark_warofprinces_shaagra_desc:0 "莎格拉是斯拉夫部落沃雷的生育女神、战争领袖和萨满，她被一个欣赏她的智慧和决心的棘秘魑初拥。她以他的名义进行征服，直到她在6世纪陷入[torpor|E]。\n最近，她在现在的布拉格被唤醒，她的力量和年龄使她很快就再次成为该地区的领头[cainite|E]。不过，仍有新的敌人要战胜，而且新一代的棘秘魑还不知道她的名字。莎格拉的新征服才刚刚开始。\n\n#bold 这对你来说是一个陌生的新世界，但有些事情永远不会改变。例如，你对战争和统治的渴求……#!"
 bookmark_warofprinces_yorak:0 "沃拉克"
 bookmark_warofprinces_yorak_desc:0 "沃拉克是最长者最早的子嗣之一，他是一位虔诚的库都和变化术师，致力于促进[clan|E]对血肉塑造的理解。他的杰作是“血肉大教堂”，这是一座令人厌恶的教堂堡垒，由农民、奴隶、对手、野兽和其他任何数量的受害者的血肉塑造而成，这些受害者被砌在建筑那脉动、化脓的墙壁上。\n由于沉浸在自己作为棘秘魑[clan|E]精神领袖的角色中，沃拉克已经有一段时间没有活跃在政治舞台上了，但棘秘魑的现状，即勉强的团结和受到的攻击，可能会迫使他很快审视自己的立场。\n\n#bold 一切都会改变，当大教堂的墙壁发出你喜欢的尖叫时，也许棘秘魑[clan|E]本身可能再次需要你的“温柔”触摸……#!"
 bookmark_warofprinces_darvag:0 "达瓦·格罗兹尼"
 bookmark_warofprinces_darvag_desc:0 "达瓦生前是现代乌克兰境内一个斯拉夫部落的贵族。他是一个坚定的原始教徒，并恶狠狠地拒绝皈依，发誓要亲自把教堂和城市夷为平地，这让一位初拥他的棘秘魑长者很开心。从那时起，格罗兹尼保护这座城市不受其他所有[cainites|E]的蹂躏，不是出于对基辅的忠诚，而是因为他想亲自摧毁这座城市。\n达瓦也是俄罗斯著名的神秘“芭芭雅嘎”的坚定盟友，并尽职尽责地做出（主要是活人）献祭，希望能取悦这位黑暗女神。\n\n#bold 基辅只有你能烧，其他人都不行。在祖母的注视下，你将看到你的复仇得到实现。#!"
 bookmark_warofprinces_noriz:0 "诺利兹"
 bookmark_warofprinces_noriz_desc:0 "诺利兹曾被认为是军督之督（棘秘魑[clan|E]的政治领袖），但他却堕落到了颓废和消沉的境地，满足于靠他作为长者亲王的荣誉和他过去辉煌的故事来维持生计。他艰难地发现，面对坚定的新敌人——弗拉基米尔·罗斯托维奇，过往的荣耀对他没有什么用。\n他的目标是成为喀尔巴阡山脉最强大的生物。他的对手认为他是个疯子，很危险，但不能否认诺利兹的战争策略的辉煌和他的阴谋和联盟的复杂性。随着罗斯托维奇最近对梵卓的挫败，一些人担心诺利兹的重新崛起是不可避免的……\n\n#bold 罗斯托维奇跌倒了。这是你等待的时刻，从你的颓废沉眠中站起来，给他们所有人一个教训。#!"
 assamite_sub_bookmark:0 "哈基姆圣裔"
 bm_1230_warofprinces_sub_assamite:0 "哈基姆圣裔氏族"
 bm_1230_warofprinces_sub_assamite_desc:0 "以中东的隐蔽堡垒鹰巢为基地，哈基姆圣裔自古就被西方该隐之子视为危险的刺客和吸榨者，但事实上他们是守护者、战士和学者，他们试图与亲王之战保持距离。\n哈基姆之嗣表面上是一个团结的氏族，实际上却因派系斗争而严重分裂。最近，一位新的、有争议的最长者的到来，使每个人都很紧张。这些问题使得新的敌人，主要是通过十字军东征，悄悄进入曾经完全在他们控制之下的中东地区。\n\n#bold 如果哈基姆圣裔能够团结起来，他们将成为一支不可阻挡的力量。他们需要一位配得上哈基姆的黑王座的人。也许那个人就是你？#!"
 bookmark_warofprinces_jamal:0 "贾迈勒"
 bookmark_warofprinces_jamal_desc:0 "在为圣地而战的圣战中，阿萨辛派的名字令人生畏。在所有阿萨辛派中，没有一个名字比贾迈勒的名字更伟大或更可怕。作为一名虔诚的穆斯林，贾迈勒是哈基姆圣裔的现任哈里发，也是他们战士种姓的领袖。\n作为一名狡猾而效率的将军，贾迈勒主要以他强大的战斗力而闻名，他的绰号是”不败者”。到目前为止，还没有人能够证明这是错误的。\n\n#bold 你站在哈基姆圣裔[clan|E]战士和穆斯林亲的领袖位置上。这两个职位都很重要，责任也很艰巨，但你是个有担当的人。你将带领信徒们取得胜利，不管是在鹰巢的内部还是外部。#!"
 bookmark_warofprinces_dastur:0 "达斯图尔·阿诺什"
 bookmark_warofprinces_dastur_desc:0 "达斯图尔生有异象，是聚集在琐罗亚斯德身边的魔法师之一。他结识了他未来的学者[Sire|E]，他们共同发现了一个神秘的遗迹，名为泣石。这一神奇的发现并不符合哈基姆圣裔领导层的意愿，他们被打上了异端的烙印，并强迫他们流亡。\n他们毫不畏惧，聚集了志同道合的学者和名人，听他们讲述洗拉的故事，她被该隐变成了石头。他们自称为“鹰巢的失落部族”，在遭到哈基姆圣裔的手下的直接攻击，导致达斯图尔的[Sire|E]丧生后，他们被迫隐居起来。目前[clan|E]派系林立，失落部族也许能得到预期的报复。\n\n#bold 你必须向你的[Sire|E]致敬，带领你的部族生存下去，若没对可恨的鹰巢后裔取得彻底胜利。#!"
 bookmark_warofprinces_fatima:0 "法蒂玛·法卡迪"
 bookmark_warofprinces_fatima_desc:0 "法蒂玛出生于一个在十字军东征期间与安拉捍卫者并肩作战的穆瓦希德摩尔战士家庭。 她的热情和技巧引起了哈基姆圣裔的注意。她被带到鹰巢，被埃及哈里发忒弥斯再造，并被训练成为了究极刺客。\n她的首项任务是确保第四次十字军东征永远到达不了中东海岸，这件事办得相当成功。 鹰巢现在期望她可以做出更伟大的事业，法蒂玛也打算展其锋芒。\n\n#bold 第四次十字军东征四分五裂，在内讧和贪婪中失败了，不过你的工作还没有彻底完成。处理干净它的残军，并在安纳托利亚建立一个强大的缓冲国以保护你的[clan|E]免受未来的入侵。#!"
 bookmark_warofprinces_alashrad:0 "阿什拉夫"
 bookmark_warofprinces_alashrad_desc:0 "阿什拉夫曾经是一名凡人法师和恶魔猎手，与哈基姆本人关系密切，直到一次事件导致他被[Embrace|E]。此后，他一直担任着阿姆尔——哈基姆圣裔的首席术士，并参加了巴力之战和其他无数次的战斗，成为[clan|E]中令人恐惧和敬仰的人物。\n在复杂的哈基姆派政治网络中，阿什拉夫是一个温和的人物，在这个动荡的时代领导他的小派别。他的敌意似乎只针对忒弥斯和他的刀锋之网，就此原因这位术士大师除了对他最信任的朋友外，拒绝透露。\n\n#bold 你知道哈基姆圣裔所有问题的核心是位真正的恶魔。他的代理人就在附近，必须加以解决，否则你将面临比毁灭更糟糕的命运。#!"
 bookmark_warofprinces_nakurtum:0 "纳穆尔图姆"
 bookmark_warofprinces_nakurtum_desc:0 "作为哈基姆最年长子嗣之一的纳穆尔图姆是家系的创立者，也是位负责记录[clan|E]历史，维护氏族精神方向的历史学家。她曾被认为已经湮没于历史之中，直到在1214年她出乎意料地回到了鹰巢，在那里她转变成了最长者，成为了整个[clan|E]的领袖。\n她无所顾忌地攫取权力，蔑视大多数其他派系，并进行了彻底的改革，这使得她的朋友寥寥无几，并导致[clan|E]本就不稳定的状况雪上加霜。许多人已经在策划新的最长者的到来......\n\n#bold 你是最长者，这些小派系将要么学会向你的权威低头，要么就被抹除殆尽。只有你才配坐上黑王座！#!"
 bookmark_warofprinces_ahmed:0 "艾哈迈德·伊本·宰亚特"
 bookmark_warofprinces_ahmed_desc:0 "宰亚特的儿子艾哈迈德生前是一名穆斯林贸易商和油料批发商。艾哈迈德的信仰更多地寄托在全能的硬币上，其成为一名穆斯林更多是被教育导致的而不是自己选择的。同样对宗教无感的哈基姆圣裔在793年初拥了他，艾哈迈德带着荣誉和警惕心开始了其学徒生涯，这让所有人，包括他自己都感到惊讶。\n作为最后的考验，他必须潜入十字军的营地偷出某样东西并暗杀掉卫兵。不管他到底是发现了什么，这都彻底改变了他，让这个男人转变为了一名虔诚的基督徒。自那以后，他一直不知疲倦地努力寻找其他同样经历过启示的人，并致力为圣地带来和平。\n\n#bold 你是基督徒和穆斯林之间的桥梁，也许是这片深深分裂的土地上唯一能坚守之人。你的任务重大，但你的信念毋庸置疑。#!"
 bookmark_warofprinces_thetmes:0 "忒弥斯"
 bookmark_warofprinces_thetmes_desc:0 "还是凡人时，忒弥斯是托勒密军队中的一名士兵，与克里奥帕特拉和她的罗马盟友作战。在他们失败后，他证明了自己是一个可怕的角斗士，并吸引了哈基姆圣裔的注意，后者初拥了他。他是一个骄傲的非信徒，多年来他的上位使[clan|E]内部出现了宗教裂痕。\n忒弥斯领导着 刀锋之网，这是一个狂热的刺客派系，他们是大多数外人对哈基姆圣裔的整体印象。但实际上，他并不只是个有着对血的渴望的贪婪者，忒弥斯有一个黑暗而强大的主人，他将确保准备好一切来迎接他的回归。\n\n#bold 黑牧人仍在沉睡，所以你将处理好哈基姆圣裔来迎接他的光荣归来。#!"
 gangrel_sub_bookmark:0 "冈格罗"
 bm_1230_warofprinces_sub_gangrel:0 "冈格罗氏族"
 bm_1230_warofprinces_sub_gangrel_desc:0 "比起大多数城市里的表亲，游牧者与荒野的关系更密切，冈格罗也更具有心兽的兽性一面，经常被称为原始的、野蛮的甚至是粗暴的怪物。\n冈格罗氏族在该隐之子的历史上占有重要地位，是古典时代所谓的“蛮族”的主要推动力之一。不过从那时起，他们的运气就开始缩减了。城市的发展和似乎不可阻挡的基督教浪潮削弱了他们的人民，他们大多是异教徒的后代。不过，大草原仍然是未被驯服的，而且冈格罗也不是那种不经过最后一战就放弃自己在这个世界上的地位的吸血鬼。\n\n#bold 这可能是欧洲非基督徒的最后一次欢呼，但你们将使它成为值得世代歌唱的欢呼。#!"
 bookmark_warofprinces_morrow:0 "莫罗"
 bookmark_warofprinces_morrow_desc:0 "作为一个年轻的孤儿，莫罗被培养成理想的冈格罗子嗣——自给自足的吸血鬼，并拥有卓越的才能。当她终于在一场致命的猫捉老鼠的游戏中成功追踪并打伤了她未来的 [Sire|E]时，他初拥了她。\n从那时起，她就获得了凶残战士的声誉。这个名声帮助她完成了召集同伴的任务。她相信，在文明不断增长的过程中，她的[clan|E]唯一的生存方式就是合作，所以她鼓励冈格罗组成族群。她最近对梵卓和棘秘魑的胜利，巩固了她作为[clan|E]主要战争领袖之一的名声。\n\n#bold 你看到了联合起来的冈格罗的光明前景。现在是实现这一梦想的时候了。#!"
 bookmark_warofprinces_viktor:0 "维克多"
 bookmark_warofprinces_viktor_desc:0 "维克多是一位强大而令人生畏的冈格罗，几个世纪以来，他一直是俄罗斯著名的可怕的芭芭雅嘎的心腹。作为唯一一个被信任到足以知道“小祖母”的计划的人，他在她陷入[torpor|E]之后被委托为她的摄政。\n维克多是一位狂热分子，不容忍任何对他女主人的不尊重，但他也被称为是一个光荣的敌人，一个喜欢公平竞争的人，不掩饰自己的真实意图。他现在必须捍卫她的国度，以抵御最近基督教于俄罗斯的来临，以及东方骑兵部落在草原上聚集的传言……\n\n#bold 芭芭雅嘎是[cainite|E]种族的救赎。你不能也不会辜负她。#!"
 bookmark_warofprinces_brunhilde:0 "布伦希尔德"
 bookmark_warofprinces_brunhilde_desc:0 "布伦希尔德出生于斯堪的纳维亚，她在自己的[Embrace|E]中感受到了重生，并迅速组建了瓦尔基里，狂热地侍奉她的祖尊奥丁，认为自己是北欧神话的现实衍现。她勇敢地与基督教的侵蚀影响作斗争，试图阻止他们人民的古老传统发生任何改变。\n然而，随着瑞典人民皈依基督教，这场斗争已经失败。尽管如此，当她的许多同胞倒在绝望或鲁莽的行动中时，布伦希尔德还没有失去希望。即使她的人民正在反对她，她也梦想着击退入侵的基督教[cainites|E]，并保存她的信仰。\n\n#bold 诸神黄昏已经到来，你知道结局。但现在放弃还为时过早。阿萨诸神在看着。#!"
 bookmark_warofprinces_dunlop:0 "邓洛普"
 bookmark_warofprinces_dunlop_desc:0 "从高贵的苏格兰氏族那里抢出名声和头衔的拦路强盗，“邓洛普伯爵”是一个冷酷无情的男人，喜欢随意使用暴力。邓洛普甚至在他的[Embrace|E]之前就已经是一个可怕的怪物，他把自己的儿子们培养得和他一样凶残，他生命中唯一的一线曙光是他无辜的女儿。\n他的倒台来自于他的贪婪，他袭击了强大的密特拉的财产。梵卓的反应是迅速而无情的，他让邓洛普卑躬屈膝，并杀死了他心爱的女儿作为惩罚。邓洛普被迫屈服，并从密特拉的眼中消失了。但这个受委屈的“伯爵”并没有忘记或原谅，他每天晚上都在策划他对手的倒台。\n\n#bold 密特拉把你的曙光夺走了。现在是时候让他明白，为什么苏格兰到现在还在害怕你的名字……#!"
 bookmark_warofprinces_qarakh:0 "喀喇"
 bookmark_warofprinces_qarakh_desc:0 "喀喇和他的[Sire|E]阿扎布生活在蒙古人中间，但喀喇是被未经允许就初拥的，所以他们从蒙古[cainites|E]那里匆匆跑了出来。阿扎布在战斗中受伤，使喀喇一路背着他来到利沃尼亚，在那里他与一伙试图抵抗基督教到来的被围困的原始教徒吸血鬼达成了共识。\n由于他天生的魅力和战斗力，喀喇很快就成为这些“利沃尼亚野者”的领袖，并吸引了许多其他寻找最后的胜利机会的原始教徒的注意。虽然还很年轻，但喀喇已经越来越习惯于他的新身份，并准备好捍卫他收养的家园，直到他最后的死亡。\n\n#bold 这可能是波罗的海原始教徒的最后一搏，但你要确保基督徒将为每一寸土地流血。#!"
 bookmark_warofprinces_valborg:0 "巴尔伯格"
 bookmark_warofprinces_valborg_desc:0 "巴尔伯格是一个内心强大的维京人，她不顾自己的安全而战斗。她已经接受了诺斯人的时代已经过去的事实，现在打算为剩下的唯一有价值的事业而战：她自己。\n巴尔伯格拥有可怕的船员和日益增长的无情佣兵声誉，她有很多机会进行杀戮和掠夺。她以自己的方式保持着古老的北欧信仰的扭曲版本，并吸引着越来越多的人加入她的“事业”。巴尔伯格其实并不关心。更多的追随者意味着更多的基督徒被杀害，更多的财富被掠夺。如果旧神对她不满意，他们肯定也不会跳出来。\n\n#bold 有人认为你会带领北欧人进入一个新时代。你不知道，但你肯定享受劈出你的道路去寻找答案。#!"
 bookmark_warofprinces_thomas:0 "托马斯·费鲁"
 bookmark_warofprinces_thomas_desc:0 "托马斯是一位小贵族的独生子，在去圣地朝圣之前，他一直是个冷酷无情的人。他的[Embrace|E]和幸运地加入君士坦丁堡[cainites|E]改变了他。\n在这个城市一些最伟大的人的教导和照顾下，托马斯成长为君士坦丁堡的尽职后裔，发誓要永远保护他的家园。当第四次十字军东征摧毁了这座城市并杀害了他的导师们时，他没能完成这项任务。\n托马斯从未像许多希腊[cainites|E]那样流亡，他仍然在他的城市里游荡，希望能拯救它。而且，即使他的导师们会不同意，也要对拉丁人进行一些应得的报复。\n\n#bold 你的地位很弱，而该死的拉丁人则根深蒂固。但你不能辜负梦想和你的导师们的回忆。这是你赎罪的时刻。#!"
 malkavian_sub_bookmark:0 "末卡维"
 bm_1230_warofprinces_sub_malkavian:0 "末卡维氏族"
 bm_1230_warofprinces_sub_malkavian_desc:0 "末卡维是一个神秘的、精神极度不正常的该隐之子群体。该氏族的成员在该隐之子和血畜中扮演着预言家和神谕者的角色，他们是被奇怪的强迫症和能感知他人无法感知的才能所束缚的阴森人物。他们也是臭名昭著的恶作剧者，他们的“玩笑”可从憨傻到残酷。\n在古典时代，他们是一个重要的氏族，因其预言天赋而深受尊重。然而，时代变了，基督教对末卡维是一个重大打击，现在被大多数人认为是纯粹的疯子。被贬为下位氏族，月触者已经失去了大部分的权力和威望。\n\n#bold 比起其他氏族，每位末卡维都是独特的生物，疯狂和清醒在争夺他们的思想。哪一个会赢？#!"
 bookmark_warofprinces_tryphosa:0 "特黎佛撒"
 bookmark_warofprinces_tryphosa_desc:0 "也许是古典时代最有影响力的末卡维，特黎佛撒是罗马的卡米拉的顾问，也是毁灭迦太基的炽热倡导者。正是由于她的不断表现和对强大的梵卓的影响，他终于对她所认为的恶魔出没的地狱之地采取了行动。\n特黎佛撒认为，她作为一位不死族的地位使她能够影响她所见证的未来的愿景，而这一点对于新一代的末卡维来说大多已经失去了。罗马沦陷后，特黎佛撒从未离开过意大利，等待卡米拉的回归来再次推动他前进。那个时候已经到来。\n\n#bold 卡米拉回来了，考虑到这个陌生的新世界与你心爱的罗马是如此不同，他肯定会比以前更需要你的指导。#!"
 bookmark_warofprinces_vasantasena:0 "春军"
 bookmark_warofprinces_vasantasena_desc:0 "春军是泰米尔皇帝大罗茶罗乍的女儿，被一个吸血鬼内侍诅咒，慢慢消亡。一个流浪的末卡维向她提供了一个解决方案，她勇敢地接受了这个方案，向她的父亲揭露了内侍的背叛行为，以她的生命作为了代价。她被她的拯救者带入不死族，开始周游世界。\n她宣扬反对血缚，拒绝对凡人抱有领主态度、传统的吸血鬼等级制度和所有失去自由意志的行为。她像刀锋一样挥舞着她的热情和魅力，她的名声迅速扩大。\n\n#bold 你是被压迫者之声。你将一次次打破束缚[cainite|E]社会的桎梏。#!"
 bookmark_warofprinces_louhi:0 "娄希"
 bookmark_warofprinces_louhi_desc:0 "一位神秘的吸血鬼，在整个[cainite|E]历史上很少被提及，从人们有记录以来，娄希一直是北芬兰的主要[cainite|E]。\n她是有史以来最有才华的奇术师之一，她创造了专属的返祖血仆，即狡猾的凯斯基宁。有传言说，她为上古耆宿勒森魃本人服务，原因不明。许多人担心她的计划会给这个地区带来厄运，甚至更多，但少数敢于前往冰冷的北方与她对抗的人再也没有回来。\n\n#bold 你正在努力工作，以取悦深渊主人。你正在取得进展，但总是需要更多的“志愿者”来测试你最新的魔药。#!"
 bookmark_warofprinces_anatole:0 "阿纳托尔"
 bookmark_warofprinces_anatole_desc:0 "阿纳托尔生为一位城市守卫的长子，他被期望跟随父亲的脚步，但他却在为上帝服务中找到了更高的使命。他的仪态和信仰引起了一个特别虔诚的吸血鬼的注意，他认为阿纳托尔可以促进基督教的事业。\n在此后的几年里，他已经作为所有形式的异端的狂热反对者而声名鹊起，击败了君士坦丁堡的卡洛梅娜的选民和巴黎的该隐异端。他的愿景仍在驱使他前进，做得更多。\n\n#bold 法国南部的清洁派异端是一些危险的异端[cainites|E]用于躲在背后的幌子。你必须找到并摧毁他们。#!"
 bookmark_warofprinces_elimelech:0 "以利米勒"
 bookmark_warofprinces_elimelech_desc:0 "以利米勒是拿俄米的丈夫，这在圣经的路得记中有记载。他被一个不知名的袭击者袭击并被初拥了。拿俄米发现她的丈夫在田野里游荡——一个冰冷的不死族空壳。她把他放在一个没有标记的浅坟里。三天后，他精神失常地站起来，忍受着没有泉水可以解救的饥渴。\n以利米勒从未从早期的夜晚中恢复过来，他经常迷失在他的心兽中，漫无目的地四处游荡，或者疯狂地攻击他人。以利米勒旅行最终将他带到了塔尔玛埃拉、无日之手，一个崇拜上古耆宿的末日死亡秘教。\n\n#bold 他们害怕并听从你。也许你的目的和救赎就在这震耳欲聋的情感合唱中。#!"
 bookmark_warofprinces_adolana:0 "拉斯休加斯的阿道拉那"
 bookmark_warofprinces_adolana_desc:0 "阿道拉那的大部分时间是在修道院里度过的，因为她那虐待狂哥哥把她送到那里去隐藏他的罪行。她拒绝再受挨打，很快就用她的话术将修女院变成了一个支离破碎的社会，在那里暴力是司空见惯的，但她现在是食物链的顶端。\n一位来自该隐异端的末卡维对她的才能印象深刻，初拥了她并扩张了她的野心。在几近崩溃的该隐教会帮助下，阿道拉那迅速升职，现在是陷入困境的挪得教区的一员，这是她信仰的最后堡垒。\n\n#bold 你在该隐教会找到了新家，但是……即使在家中，你也知道，如果你想避免再次受到伤害，你必须站在顶端。#!"
 bookmark_warofprinces_harold:0 "哈罗德·泽特勒"
 bookmark_warofprinces_harold_desc:0 "哈罗德·泽特勒是“三启示之环”的成员，这是一个由末卡维预言家、哲学家和神秘主义者组成的松散集体，他也是当睿魔尔开始摧毁萨洛比时的有力捍卫者。利用他所拥有的一点影响力来庇护和保护他们，但这不够，而且随着睿魔尔的清剿行动越来越深入，他变得越来越绝望。\n哈罗德恳求任何灵类实体甚至是神明帮助他，其中一位回应了。\n那天晚上，哈罗德·泽特勒重生了，成为他曾经珍视的一切的嘲弄者。\n\n#bold 你现在明白了这么多。没有痛苦就没有救赎，你将在一段时间内成为最有成就的艺术家，这要感谢你慷慨的新后援。#!"
 nosferatu_sub_bookmark:0 "诺斯费拉图"
 bm_1230_warofprinces_sub_nosferatu:0 "诺斯费拉图氏族"
 bm_1230_warofprinces_sub_nosferatu_desc:0 "具有所有该隐之子中最明显的诅咒，初拥将每个诺斯费拉图扭曲成一个可怕的畸形生物。他们是死者的间谍，收集信息并以低廉的价格出售。作为下层社会的主人，诺斯费拉图倾向于更加重视氏族团结和共同生存，因此即使算是敌人，彼此之间也相当融洽。\n诺斯费拉图在黑夜世界中从来都不是重要的领土拥有者，但由于他们在信息收集方面的无与伦比的才能，他们总是挥舞着巨大的，甚至是不可见的影响力。\n\n#bold 你的氏族是唯一能理解你的家。如果你们能都团结起来，很少有什么威胁是不能克服的。#!"
 bookmark_warofprinces_josef:0 "约瑟夫·兹维"
 bookmark_warofprinces_josef_desc:0 "约瑟夫在布拉格的犹太区出生和长大。作为一名拉比的儿子，他希望能继承父亲的事业。犹太人所遭遇的暴力并不少见，约瑟夫遭受的痛苦最为残酷，有一天晚上，一帮基督教男孩把他的半颗脑袋砸碎。如果不是因为他被诺斯费拉图的耶胡达[Embrace|E]，他早就死了。他问约瑟夫是否会保护其他人免受这种残暴行为的伤害，他只是握住这位诺斯费拉图的手作为回应。\n约瑟夫成为了布拉格诺斯费拉图社区的首领，在推翻其前任暴君亲王的过程中发挥了作用。在随后的权力真空中，他能已为自己和他的人民确保城市的安全。\n\n#bold 尽管布拉格是安全的，但一个新的威胁已经在东部显现，并可能危及你迄今为止的所有努力。你一定不能动摇。#!"
 bookmark_warofprinces_tarique:0 "塔利克"
 bookmark_warofprinces_tarique_desc:0 "在崛起之前，塔利克是一名西班牙血族，随后在伊斯兰教的黄金时代皈依。塔里克对“ 不可触碰 ”的麦加城非常着迷，于是他冒险来到阿拉伯半岛，凝视着穆斯林最神圣的场所。\n他参与了麦加的防御工作，以对抗末卡维的阴谋，并很快结识了[ashirra|E]（穆斯林[cainites|E]）领导人。塔里克因其坚定的信仰而聚集了一批追随者，塔利克声称，他和他的后嗣从此以后将成为伊斯兰教的守护者和麦加的管理者。\n\n#bold [ashirra|E]很稳固，但在周围仍有威胁。你是他们的磐石，你的神圣职责决不能动摇。#!"
 bookmark_warofprinces_malachite:0 "马拉希底斯"
 bookmark_warofprinces_malachite_desc:0 "马拉希底斯出生于9世纪，是位君士坦丁堡原住民，长大后成为一名东正教的牧师。不幸的是，他与一位有权有势的[cainite|E]发生了公开争执。为了伤害他的自尊心，他让马拉希底斯被一位诺斯费拉图初拥。\n重生为[cainite|E]后，马拉希底斯一直生活在绝望之中，直到他被君士坦丁堡牧首妥芮朵米迦勒收留，并成为幻梦最忠实的仆人。\n第四次十字军东征对马拉希底斯的精神是一个沉重的打击，但他知道，即使没有米迦勒，幻梦也必须持续下去。\n\n#bold 你必须把君士坦丁堡从法兰克人的控制下解放出来，并让这座城市恢复昔日的荣耀。作为米迦勒的继承人，这是你的责任。#!"
 bookmark_warofprinces_mnemach:0 "内马赫"
 bookmark_warofprinces_mnemach_desc:0 "内马赫出生在高卢的最后的独立日子里，被一个想要保护他们的文化和传统的诺斯费拉图拥抱。在他的指导下，她很快成为一名出色的女巫，并在卢泰西亚建立了自己的地盘，者不久后成为了巴黎。\n作为法兰西最古老的[cainites|E]之一，内马赫的影响力和权力是众所周知的，她的支持对于将巴黎的亚历山大赶下台至关重要。不过，她的真正目标仍不明确，这使得她身上的神秘光环更让其他[cainites|E]感到担忧。\n\n#bold 你赶走亚历山大是有原因的，而这个原因现在就在你的手中。你的过去，也许还有你的未来的一个片段，再次与你重逢。#!"
 bookmark_warofprinces_lukas:0 "卢卡斯"
 bookmark_warofprinces_lukas_desc:0 "对大多数人来说，卢卡斯可能会被误认为是一个神圣修士会的唱诗班成员。他无辜的外表掩盖了藏在下面的狡猾怪物，这个怪物以地狱的名义系统地腐蚀了上帝的房子。\n作为一个凡人男孩，卢卡斯为自己的完美美貌感到骄傲，当一个流浪的诺斯费拉图初拥了他，来教他一些谦卑的时候，他感到了恐惧。绝望的卢卡斯说，他愿意做任何事情来恢复他的美貌。\n在下方，有什么听到了他的恳求，并提出了他的条件……\n\n#bold 你的地狱后援要求越来越多的东西来保持他的交易结果。你别无选择，只能服从，因为你的美貌值得任何牺牲。#!"
 bookmark_warofprinces_gregor:0 "格雷戈尔"
 bookmark_warofprinces_gregor_desc:0 "格雷戈尔生前是一名条顿骑士，以其残忍和粗心而闻名。被一个希望惩罚他的诺斯费拉图初拥后，格雷戈尔反而很容易适应了他的新生活。\n他深入黑森林，很快就因杀死狼人和毁灭了一位强大而古老的尼克图库而闻名。对于像格雷戈尔这样年轻的人来说，这两项壮举几乎都是不可能的，这让很多人相信，在森林的最深处，有些事情并不像它看起来那样……\n\n#bold 你已经找到了你作为荆棘女士的骑士的真正目的。她给了你力量，并没有因为你对暴力的渴望而责备你。你们是完美的一对。#!"
 bookmark_warofprinces_zelios:0 "塞琉斯"
 bookmark_warofprinces_zelios_desc:0 "塞琉斯出生于一个富商家庭，他放弃了追求舒适的特权生活，而选择了发展一种有用的手艺。他游历了欧洲和其他地方，学习建筑的艺术和技术。\n一位诺斯费拉图意识到了这个年轻人的潜力，决定将他带入[clan|E]，这样他就可以改善他[clan|E]居住的战地。随着时间的推移，塞琉斯沉浸在自己的技艺中，专门为[cainites|E]领主建造城堡。\n\n#bold 你在贵族和工匠中都很有名，但你知道，你真正的杰作还在后面。特兰西瓦尼亚在召唤你，它可能是你找到自己命运的地方。#!"
 ravnos_sub_bookmark:0 "雷伏诺"
 bm_1230_warofprinces_sub_ravnos:0 "雷伏诺氏族"
 bm_1230_warofprinces_sub_ravnos_desc:0 "分裂严重的雷伏诺氏族起源于印度，但众所周知，他们一直在远方游荡。在他们的家乡，他们是强大的统治者，但在西方却不那么稳固，在那里他们只是被称为游荡的骗子、神秘主义者和流浪者。\n东方雷伏诺有自己的种姓制度，是由他们所谓的创始人吒婆多修罗的后代发展而来的。就他们而言，每位雷伏诺流亡者都有不同的观点、价值观和动机，导致在欧洲境内有着众多分支（或种姓）。\n\n#bold 在西方世界被鄙视，在印度则陷入与死敌的永恒之战中，雷伏诺氏族的未来将是一场艰苦的斗争。有很多事情要做。#!"
 bookmark_warofprinces_chandraputra:0 "查古拉普夏"
 bookmark_warofprinces_chandraputra_desc:0 "查古拉普夏既是拯救者又是施害者，既是侍从又是征服者，他最重要的一点是：忠诚。他是吒婆多修罗唯一没有以某种方式背叛他的[Sire|E]的子嗣，自然而然地承担起了印度族人的领导衣钵。\n在凡人入侵次大陆的第一批印欧征服者中，查古拉普夏也许是今夜最成功的将军，这在很大程度上是因为他对威胁他的[clan|E]的受诅的阿修罗提伽耶进行了永恒之战。\n\n#bold 战争从不改变，你也不会改变。你的敌人将明白，你永远不会动摇。#!"
 bookmark_warofprinces_karmenita:0 "卡门尼塔·约亚里"
 bookmark_warofprinces_karmenita_desc:0 "卡门尼塔自意大利，她很快就对罗马雷伏诺的颓废行为感到失望。她搬到了葡萄牙，以便探索她[Sire|E]教给她的“矛盾之道”私密版本的精神层面。在不了解原始教义的情况下，卡门尼塔形成了这样一种观念：在当代世界中能够茁壮成长的事物、概念等只能是有限的数量。\n她还热衷于无意识的犯罪行为和其他适合自我满足的行为，这在她的[clan|E]中非常普遍，引发了曾经的同胞们对她的不满。\n\n#bold 你正在从你的[Sire|E]留下的颓废混乱中慢慢创造自己的种姓。但你还有自己的家庭问题要处理……#!"
 bookmark_warofprinces_iago:0 "雅戈·卡斯提尔"
 bookmark_warofprinces_iago_desc:0 "地中海的“海盗亲王”是一位精明的船长，他被卡门尼塔·约亚里初拥到雷伏诺[clan|E]。但他们的观点很快就发生了冲突，这位耐心的[Sire|E]不喜欢她孩子的火爆脾气。因此，雅戈很快就从她手中逃到了科西嘉。\n雅戈证明了自己是一个有魅力的领导者，他完全接受了自己作为一个贪婪和欺骗性的海盗的新生活。不过，低估他将是一个错误，因为他的阴谋和操纵技能已经让许多追捕者死于非命。\n\n#bold 有钱可赚，也有傲慢的亲王们可打倒。地中海将是你的天下！#!"
 bookmark_warofprinces_mritunjay:0 "米伊特杰"
 bookmark_warofprinces_mritunjay_desc:0 "巴格达最新的亲王在对上一任亲王实施了精心策划的计谋后，升得了这个头衔，并在这个过程中对她进行了报复。作为一个喜欢享受生活中美好事物的人，米伊特杰对他的新职位当然很合意，但如果把他当成一个浮夸的小丑，那就错了。\n凭借其敏捷的头脑，米伊特杰已成为玩弄各派别的专家，并在此过程中确保了他的安全。随着巴格达最终落入他的手中，他将能够在更大范围内使用这种能力。\n\n#bold 巴格达是最大的奖品，但要真正确保它的安全，还需要应对各种威胁，包括凡人和不死族。#!"
 bookmark_warofprinces_marcia:0 "玛西娅·费利西娅·莉西娜"
 bookmark_warofprinces_marcia_desc:0 "作为最年长的帕伊杜米特活跃分子，玛西娅为她的种姓的传承感到自豪，这是一个战士和骑士的种姓，有着荣誉和责任。但与她对知识的渴望相比，她对战斗的热爱就显得微不足道了。玛西娅承担了为她[clan|E]撰写《伟大之作》的使命，她一直在努力收集有关她的不同同胞的信息。\n不过，她的一意孤行让她付出的代价越来越大，因为她可怕地看到雷伏诺家族陷入了颓废状态。她现在正考虑在政治上扮演一个更积极的角色。\n\n#bold 你不能看着你的[clan|E]沉溺于有罪的行为而无所事事。你可以创造历史，而不仅仅是书写历史。#!"
 bookmark_warofprinces_zoe:0 "佐伊"
 bookmark_warofprinces_zoe_desc:0 "佐伊曾经是君士坦丁堡的一名普通学徒，在1204年君士坦丁堡被洗劫期间受了致命伤，为了保住性命而被初拥。她与被流放的希腊民众一起旅行，很快就在一群裁判官面前失去了她的[Sire|E]。\n如果不是同路人阿纳托尔的耐心教导，佐伊将被愤怒和绝望所击垮。他们两个人互相学习，佐伊对可恨的裁判官进行了报复。终于得到了安宁，她成为她朋友的亲卫和义子嗣，并跟随他到法兰西南部进行个人使命。\n\n#bold 你欠阿纳托尔很多，而且你还可以从他那里学到更多，也许在这其中你能最终找到你在这个世界上的位置。#!"
 bookmark_warofprinces_etienne:0 "艾蒂安·德·法贝热"
 bookmark_warofprinces_etienne_desc:0 "艾蒂安从小就知道他是由罪而生，他周围的世界在上帝眼中是无用的。当十字军东征的号召发出后，他为了获得宽恕而加入。当他试图保护安条克附近的一个犹太商人时，他的伙伴们与他反目成仇，把他打倒在地，强迫他看着他们割断商人一家人的喉咙，留下艾蒂安在尸体中哭泣。就在那时，他遇到了他的[Sire|E]，被他的虔诚所感动。\n从那时起，艾蒂安就以守卫亚柯为己任，充当这座圣城的保护者。在这个动荡的时代，他的工作已经完成了。\n\n#bold 到目前为止，你已经成功地拯救了亚柯，但圣地的动荡从未结束。你还没有对你的罪孽有足够的忏悔。#!"
 setite_sub_bookmark:0 "赛特之子"
 bm_1230_warofprinces_sub_setite:0 "赛特之子氏族"
 bm_1230_warofprinces_sub_setite_desc:0 "赛特之子相信赛特有一天会回来统治或吞噬世界，而虔诚的赛特之子则将为他的复活做好准备。为此，该氏族保持独立于其他该隐之子的党派，并以精湛的技艺练习腐化、欺骗和古魔术。\n在大多数时候，赛特之子的行为更像是一个密教，而不是一个真正的氏族。赛特之子在他们的祖国埃及仍然很强大，但伊斯兰教的兴起严重削弱了他们在埃及以外的力量。为了寻找新的盟友并将他们的神的荣耀传播到更远的地方，曾经闭塞的赛特之子已经开始在世界各地旅行。\n\n#bold 拉对世界的铁腕掌控仍然令人窒息。只有当所有被误导的该隐之子都唱起对赛特的赞歌时，世界才能真正获得自由。#!"
 bookmark_warofprinces_nakhthorheb:0 "纳克塔内波"
 bookmark_warofprinces_nakhthorheb_desc:0 "在赛特失踪之前，信徒们没有任何组织。他们的神一失踪，圣显者就聚集在一起，宣布自己是[clan|E]的管家。\n纳克塔内波是最大的圣显者；正是他将他们牢牢地控制在手里。有传言说，他和赛特本人一样出生在同一个游牧部落里。虽然所有的法律和命令都必须经过七位长者的同意，但纳克塔内波才是这些命令的来源。\n\n#bold 随着赛特的消失，信徒们比以往更需要你的领导。不要辜负他们，也不要辜负他。#!"
 bookmark_warofprinces_kemintiri:0 "齐茉媞里"
 bookmark_warofprinces_kemintiri_desc:0 "齐茉媞里曾经是伊西斯的女祭司，引起了不该的赛特注意，由于她拒绝交出赛特寻求的她女神的秘密，她在她的初拥前受到了暴力折磨。即使是这种残酷的待遇也没有击垮她，她忍受了他的虐待很多个夜才设法逃脱。\n从那时起，齐茉媞里就成了赛特之子[clan|E]最可怕的敌人，只要有机会，她就会毁掉她憎恨的尊长的传承。她的传奇故事夜以继日地增长，人们纷纷传说这位美丽的伊西斯最后的女祭司，是落入腐朽[clan|E]的复仇天使。\n\n#bold 你的业务将永远不算完成，直到赛特珍视的一切都散落在风中。#!"
 bookmark_warofprinces_andreas:0 "安德烈亚斯·埃古普托斯"
 bookmark_warofprinces_andreas_desc:0 "安德烈亚斯曾经是早期基督教异端基督一性论的巴勒斯坦牧师，在流亡埃及期间遇到了赛特。安德烈亚斯证明了自己是一个聪明而好学的皈依者，他为自己的[clan|E]扮演了一个商人亲王的角色，在欧洲各地获得了联系和盟友。\n他无可挑剔的声誉和公平的交易帮助他建立了一个贸易帝国，但他真正的使命仍然是帮助别人找到赛特的真理，无论他们来自哪里。\n\n#bold 每个人都以他们自己的方式接受赛特。你只不过是他们一路走来所需要的耐心和理解的向导。#!"
 bookmark_warofprinces_neferu:0 "尼芙璐"
 bookmark_warofprinces_neferu_desc:0 "作为娜芙蒂蒂的侍女，尼芙璐是赛特在法老埃赫那吞的混乱时期的代理人，在推翻他的异端统治方面起了重要作用。她得到的回报是初拥和创建自己的神殿——火之庭。\n她专注于腐化试图征服埃及的外来吸血鬼，这项任务为她赢得了许多敌人。但是，不知何故，火之庭似乎总是能够生存下来，并且经常处于领先地位。\n\n#bold 你的宫廷缓慢而有条不紊地侵蚀着文明的支柱。许多人已经倒在了它的面前，未来还会有更多的人倒下。#!"
 bookmark_warofprinces_sarrasine:0 "萨拉金"
 bookmark_warofprinces_sarrasine_desc:0 "作为凡人时，萨拉金是查士丁尼大帝宫廷中的一个小男孩，他看见世俗领主往往不按照圣经的正统观念生活，而是听从幕后的主人。凯塔尔初拥了他，因为他在这个男孩身上看到了自己的影子。然而，萨拉金并没有对这些感情做出回应。在1204年第四次十字军东征洗劫君士坦丁堡期间，萨拉金试图[diablerie|E]他的[Sire|E]，但功亏一篑。\n虽然凯塔尔在东正教赛特之子中没有多少朋友，但他仍然有狂热的追随者支持他的事业，而萨拉金现在正在逃亡。\n\n#bold 这整个事件只是一个挫折。是时候重新开始了，这是你相当擅长的事情。#!"
 bookmark_warofprinces_arnulf:0 "阿努尔夫·耶梦加得松"
 bookmark_warofprinces_arnulf_desc:0 "阿努尔夫·耶梦加得松是一名诺斯商人，在9世纪时曾到过亚历山大港。在那里，他被引入一个崇拜古神赛特的血腥密教中，并最终被赛特信徒的一名成员授予了初拥。\n当阿努尔夫回到斯堪的纳维亚时，现在以耶梦加得松为姓，他建立了耶梦加得之殿，作为一个崇拜世界之蛇的末日密教。到目前为止，他已经在珠宝贸易中获得了一个立足点，并在远离埃及的地方培育了一个小型的赛特之子殖民地。\n\n#bold 当维京世界瓦解时，这将有新的财富和皈依者可供利用。令人激动，却又危险的时代。#!"
 bookmark_warofprinces_jean:0 "让·巴蒂斯特·德·蒙特龙"
 bookmark_warofprinces_jean_desc:0 "让·巴蒂斯特是喝醉了才参于了十字军，这是对他一时的宗教狂热的唯一解释。\n在西西里岛的墨西拿耽搁期间，他发现自己沉溺于各种堕落和异端邪说，自欺说是教宗曾承诺十字军战士的所有罪过都会得到宽恕。仅仅几个星期后，他就放弃了对十字军的责任，向赛特密教屈服。不幸的是，那不勒斯的神殿被毁了，他不得不逃回法兰西。\n从那时起，让·巴蒂斯特就成了巴黎夜生活之主，在这之中满足他每一个扭曲的欲望。\n\n#bold 亡生如此美妙。当你可以用大量的快乐和财富包围自己时，谁还在乎这个叫赛特的家伙呢？#!"
 tremere_sub_bookmark:0 "睿魔尔"
 bm_1230_warofprinces_sub_tremere:0 "睿魔尔氏族"
 bm_1230_warofprinces_sub_tremere_desc:0 "睿魔尔是最新的吸血鬼氏族，在他们的创始人开始寻求如何保留他那正逐渐消失的不朽性前，他们曾经是赫耳墨斯秘会的法师。这一探索使他和他家族的大多数人都变成了吸血鬼。\n自从他们诞生以来，睿魔尔已经树敌无数，从被他们侵占的领土的棘秘魑到被他们谋杀了扫罗的萨洛比。尽管如此，他们铁一般的纪律和强大的魔法使他们能够坚持下来……目前而言。\n\n#bold 睿魔尔氏族的地位摇摇欲坠，被四面八方的敌人围困着。他们将需要他们最杰出的成员的才能和智慧来生存。#!"
 bookmark_warofprinces_goratrix:0 "格拉崔克斯"
 bookmark_warofprinces_goratrix_desc:0 "格拉崔克斯是睿魔尔本人最亲密的朋友之一，也是最有前途的学生，是他设计了将睿魔尔家族的精英转化为吸血鬼的仪式。\n尽管取得了巨大的成功，但睿魔尔的另一个学生伊崔乌斯被选为该家族的摄政，这激怒了格拉崔克斯。作为流放者被送到法兰西，这位雄心勃勃、才华横溢的魔法师已经充分利用了他在这里的时间，在法兰西政治中获得了非常强大的影响力。\n\n#bold 睿魔尔家族里有一些腐烂的东西，你知道它。那个愚蠢的伊崔乌斯甚至都不了解它。你必须结束这流放，在为时已晚之前拯救睿魔尔[clan|E]。#!"
 bookmark_warofprinces_meerlinda:0 "梅琳达"
 bookmark_warofprinces_meerlinda_desc:0 "梅琳达是睿魔尔[clan|E]内部七人议会中头脑清醒且理性的一员。在旧睿魔尔家族中，她是唯一被睿魔尔认为有资格陪伴他到魔法的最高境界的女性。\n她得到了伊崔乌斯和格拉崔克斯的尊重，能够在议会中扮演协调人的角色。被派往英格兰，梅林达的身份是双重的。为[clan|E]准备一个新的家园若喀尔巴阡沦陷，并调查围绕圣杯的传言及其对吸血鬼的影响。\n\n#bold 让伊崔乌斯和格拉崔克斯互相掐架。当他们都失败时，睿魔尔[clan|E]将在这里重振旗鼓……在你的精心监督下。#!"
 bookmark_warofprinces_jervais:0 "贾维斯"
 bookmark_warofprinces_jervais_desc:0 "法兰西书记员的儿子，贾维斯有一点魔法天赋，足以吸引睿魔尔家族的注意，但还不足以独自成为一个强大的魔法师。\n不过，凭借着强烈的奉献精神和无情的野心，他还是成功地成为了睿魔尔最重要的大使之一，促成了对他的[clan|E]生存至关重要的联盟。\n作为对他持续良好服务的回报，贾维斯被赋予了可能是他接过的最危险的任务：摆脱利沃尼亚的睿魔尔分裂分子。\n\n#bold 你正在一步一步地在金字塔中攀登。你的决心将见证你的成功。#!"
 bookmark_warofprinces_rutor:0 "鲁托尔"
 bookmark_warofprinces_rutor_desc:0 "鲁托尔在棘秘魑的土地上出生和长大。他是为战争而生的，为对抗入侵祖国的睿魔尔而生的，他去参仗了，虽然不是他自己选择的。他的主人认为鲁托尔被血缚所制，但鲁托尔对此免疫，最后把她出卖给了她的敌人，赢得了睿魔尔[clan|E]的[Embrace|E]作为反逆的奖励。\n然而，鲁托尔一如既往地不满和叛逆，当他认为自己的学徒期结束后，他离开了，去建立自己的权力基地。经过多年的旅行和避免与他的[clan|E]接触，他最终来到了斯堪的纳维亚，在那里他成为了哥本哈根的亲王。\n\n#bold 你属于你自己，你将创造你自己的命运。#!"
 bookmark_warofprinces_xavier:0 "泽维尔·德·辛扫"
 bookmark_warofprinces_xavier_desc:0 "作为睿魔尔家族最强大的魔法师之一，泽维尔·德·辛扫并不是议会中非常活跃的成员，他更愿意把注意力集中在学习超自然的秘密上，甚至超越吸血鬼和法师。\n因此，也不奇怪泽维尔开始进军北非，他认为这是一个很好的行动基地，可以更多地了解这个对睿魔尔来说相当神秘的大陆。尽管如此，泽维尔也不回避他的职责，自从他到来后，睿魔尔在西班牙和马格里布的影响力都得到了极大的扩展。\n\n#bold 有秘密要学习，有协议要订立……当然，都是为了[clan|E]的荣耀。#!"
 bookmark_warofprinces_therimna:0 "泰瑞姆纳"
 bookmark_warofprinces_therimna_desc:0 "泰瑞姆纳曾经是格拉崔克斯的学徒，格拉崔克斯在她身上看到了固有的魔法火花，以及天赋和奉献精神。她很快就注意到了永生的机遇，并恳求她的主人[Embrace|E]她，她的主人也照做了，然后让她成为睿魔尔[clan|E]的正式刽子手，她对这个角色非常满意。\n然而，面对早期睿魔尔[clan|E]被迫面临的诸多危险，她失去了希望。她现在正在与任何愿意倾听和包庇她的亲王做交易，她知道睿魔尔发现她的背叛只是时间问题。\n\n#bold 你会活下去。无论付出多大的代价，遭受多大的背叛，承受多大的苦难，这一切最终都是值得的。#!"
 bookmark_warofprinces_virstania:0 "维斯塔尼亚"
 bookmark_warofprinces_virstania_desc:0 "维斯塔尼亚是睿魔尔法师团中最年轻的学徒，达到了法师等级。但由于她太年轻，她无法与其他魔法师建立友谊。\n格拉崔克斯相信维斯塔尼亚已经成熟，可以帮助他完成下一个计划。她被初拥了，在格拉崔克斯身边辅导了一年后，她被投入到孵化第一批石像鬼的工作中。她用坚定的爱沐浴它们，它们对她的反应就像小鸡对它们的母亲一样。随着岁月的流逝，维斯塔尼亚对她的作品的关心程度已经超过了她的睿魔尔同伴。\n\n#bold 你将为睿魔尔的战争作战，但你渴望有一天晚上，你美丽的婴儿终于可以自由。#!"
 bloodlines_sub_bookmark:0 "血系"
 bm_1230_warofprinces_sub_bloodlines:0 "血系"
 bm_1230_warofprinces_sub_bloodlines_desc:0 "十三主要氏族并非是唯一的黑夜的潜伏者。从德鲁伊派的菈亚南到亚洲的万鬼，血系有很多变体。这些血系与传统的该隐之氏族有一些内在的区别，无论是在他们的弱点、异能，还是两者上。这些血系中的许多，实际上是氏族中的氏族。\n有些是非常有影响力的，如亚洲的万鬼或草原上的安答，而其他的则在湮灭的边缘徘徊，这使得每种血系都是样不同的、复杂的事物。\n\n#bold 十三主要氏族一直以来都是根据他们的政治资产而入榜的，就像最近他们中的睿魔尔的上台一样。也许是时候进行另一次动荡了。#!"
 bookmark_warofprinces_deverra:0 "德维拉"
 bookmark_warofprinces_deverra_desc:0 "作为一个有魔法天赋的少女，德维拉出生在利沃尼亚一个信奉于特亚维神的家庭，她从未忘记自己真正的忠诚，甚至当睿魔尔[clan|E]收她为学徒时也是如此。她要求被调到她的故乡利沃尼亚，以便学习棘秘魑的库都魔术。\n很快她就因为原始教徒的行为方式而被其他族人指责，德维拉和她的女巫团不得不寻找新的盟友，她在蒙古军阀喀喇那里找到了。他们很快就不只是盟友了，她现在尽职尽责地保护他和她的族人免受即将到来的基督教的攻击。\n\n#bold 你的信仰正在消亡，但仍有复兴的希望。坚强地站起来，对特亚维尽职尽责，你仍然可能获胜。#!"
 bookmark_warofprinces_magda:0 "玛格达"
 bookmark_warofprinces_magda_desc:0 "玛格达出生在费尔博格最后入侵爱尔兰的前几年，年幼时就被收入德鲁伊教派的神职体系中。在入侵过程中，冷酷无情的费尔博格残害了玛格达的身体，并将她抛在一边，直到夜幕降临才勉强维持住生命。她的尊长选择了[Embrace|E]这个年轻的女孩，而不是看着她的天赋被死亡所剥夺。\n玛格达带着近乎疯狂的愤怒降临到这些入侵者身上，把他们扔回了他们来时的大海。在随后的几千年里，康诺特的女巫一直在寻找足够的血液来弥补她所认为的对她人民的阴险屠杀。\n\n#bold 诺曼人将付出代价，诺斯人将付出代价，罗马人将付出代价……爱尔兰很快就会被血染红。#!"
 bookmark_warofprinces_marconius:0 "马可纽斯"
 bookmark_warofprinces_marconius_desc:0 "在[Embrace|E]之前，马可纽斯是一名凡人法师，擅长炼金术，致力于创造一个完美的存在。在叛教者尤里安皇帝统治时期，他喝下了用哀怒廷妖精的血液制成的魔药，被迅速转变。\n不用说，其他勒森魃也注意到了。随着他在妖精世界中的人脉越来越多，以及他在斯特拉斯堡的据点迅速站稳了脚跟，到目前为止，他们还没有能力对他采取行动。然而，关于他在妖精“盟友”身上做实验的传闻可能很快就会在马可纽斯的防御中产生一个漏洞。\n\n#bold 你走着一条了解你的状况和保持你的亲王领安全之间的危险丝线。切勿坠落。#!"
 bookmark_warofprinces_chinkhai:0 "镇海"
 bookmark_warofprinces_chinkhai_desc:0 "在力量和年龄方面，镇海在大草原上几乎无人能敌。他是多布鲁为人类时的孙子，也是多布鲁为吸血鬼时的子嗣，几个世纪以来，他一直守护着他[Sire|E]的坟墓。他负责保卫他的人民——安答，对抗亚洲的万鬼和其他夜行怪物。\n打心底的游牧者，镇海在安答的土地上游荡，无论走到哪里都要伸张正义，无论是对入侵者还是对不守规矩的同胞们。就像他经常在草原做的一样，他既不善良也不宽容，他的正义往往是相当无情的。\n\n#bold 你被委托保卫安答，且你会这样做。可怜那些挡在你面前的人！#!"
 bookmark_warofprinces_catubodua:0 "波乌狄纳"
 bookmark_warofprinces_catubodua_desc:0 "波乌狄纳生为一个早已消失的乌尔王国的公主，被认为是生活在传说中的第二城的最美丽的女人。她与布鲁赫和特洛伊尔都很亲近，当他们都陷入血腥冲突时，她感到非常震惊。\n逃离城市后，她被称为高卢女神（她至今仍使用这个名字），也是加洛林王朝复兴的主要力量。她终于在法兰西找到了她所寻找的东西，于是她前往遥远的地方，寻找失落的知识来帮助她堕落的[clan|E]。\n\n#bold 你对布鲁赫做出了承诺，你打算遵守这个承诺，无论要花多少时间。#!"
 bookmark_warofprinces_dyanang:0 "达楠"
 bookmark_warofprinces_dyanang_desc:0 "朱雀皇朝的女帝，达楠，被称为是一位相对温和的统治者，让每人都自生自灭……大部分时间而言。尽管这样，或者也许是因为这样，她的皇朝被认为是一个充满暴力和疯狂的生活环境。\n她与吴哥和大越丛林中的凶民结成了奇怪但明显强大的联盟，使她在处理那些过分找死的人时有了很大的余地。\n\n#bold 你的宫廷很强大，现在可能是时候停止向内看了。印度的异端总是一种威胁，这种威胁夜夜变得更加令人担忧。#!"