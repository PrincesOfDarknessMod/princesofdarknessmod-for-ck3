 bm_868_constantinoplebynight:0 "君士坦丁堡之夜"
 bm_868_constantinoplebynight_desc:0 "米迦勒，君士坦丁堡的幻梦之牧首，一直扮演着凡人米海尔三世的角色。在安东尼乌斯被弑杀后，魔龙陷入了深深自责中。凯斯统治着安东尼恩的梵卓。威尼斯诺德大主教纳尔西斯希望将该隐异端扩展到拜占庭东部，以及意大利南部和西西里岛，传统上勒森魃的领地。崇高之主奥丁，英灵战士的领袖，将要面对比凶恶的芬里斯之子更可怕的威胁——他必须对抗即将到来的凡人皈依那被钉死之神的威胁。与此同时，整个西欧的梵卓都分裂为由互相竞争封建领地的氏族，其中最强大的是巴黎的亚历山大。守旧的普罗米修斯派多米尼克见到了机会，来复仇迦太基的覆灭，从他的基地出发征服马扎尔人。然而，某法师家族为己篡夺了该隐之血的力量，其将会颠覆血族社会。"
