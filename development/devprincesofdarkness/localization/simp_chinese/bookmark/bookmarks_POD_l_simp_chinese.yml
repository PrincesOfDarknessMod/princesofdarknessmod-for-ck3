l_simp_chinese:
 bm_868_constantinoplebynight:0 "君士坦丁堡之夜"
 bm_868_constantinoplebynight_desc:0 "米迦勒，君士坦丁堡的幻梦之牧首，一直扮演着凡人米海尔三世。魔龙在安东尼乌斯被弑杀后陷入了深深自责中。加犹统治着安东尼恩的梵卓。威尼斯诺德大主教纳尔西斯希望将该隐异端扩展到拜占庭东部，以及意大利南部和西西里岛，勒森魃自古以来的领地。崇高之主奥丁，英灵战士的领袖，将要面对比凶恶的芬里斯之子更可怕的威胁——他必须对抗即将到来的凡人皈依那被钉死之神的威胁。与此同时，整个西欧的梵卓都分裂为由互相竞争封建领地的氏族，其中最强大的是巴黎的亚历山大。守旧的普罗米修斯派多米尼克见到了机会，来复仇迦太基的覆灭，从他的基地出发征服马扎尔人。然而，某法师家族为己篡夺了该隐之血的力量，其将会颠覆血族社会。"
 bookmark_constantinoplebynight_michael:0 "米迦勒"
 bookmark_constantinoplebynight_michael_desc:0 "幻梦之牧首"
 bookmark_constantinoplebynight_odin:0 "崇高之主奥丁"
 bookmark_constantinoplebynight_odin_desc:0 "荣耀归于英灵战士！瓦尔哈拉等着我们！"
 bookmark_constantinoplebynight_montano:0 "蒙塔诺"
 bookmark_constantinoplebynight_montano_desc:0 "吾等见于暗影"
 bookmark_constantinoplebynight_narses:0 "纳尔西斯"
 bookmark_constantinoplebynight_narses_desc:0 "哥特人之槌"
 bookmark_constantinoplebynight_shahiri:0 "沙赫里，山中老人"
 bookmark_constantinoplebynight_shahiri_desc:0 "死亡从不敲门"
 bm_1230_warofprinces:0 "黑暗时代：吸血鬼"
 bm_1230_warofprinces_desc:0 "亲王之战是该隐之子历史上的一段冲突时期，开始于1204年第四次十字军东征导致君士坦丁堡沦陷后不久。此术语指的是血族亲王在无尽之夜结束后为争夺领土而发生的冲突。\n\n在裁判所成立前不久，亲王们的战争开始了。尽管裁判所最初只是长者们的工具，但他们很快就成为了对该隐之子的更大威胁。虽然尚不清楚亲王之战何时结束，但很可能会随着大反乱的到来而被迫中止。\n\n#bold 你能赢得这场战争的最终胜利吗？又或者在人类开始反抗他们的正当主人之时随同氏族一起被清算？#!"
 bookmark_warofprinces_montano:0 "蒙塔诺"
 bookmark_warofprinces_montano_desc:0 "勒森魃的忠实子嗣，同时也是横跨整个地中海的[clan|E]之主。尽管蒙塔诺处于一个安全的位置，而且本身也是一个有权势的人，但一个大麻烦正在他视野外酝酿。伊比利亚半岛的内战、意大利老敌人的崛起以及[clan|E]中年轻成员的不守规矩都使对[clan|E]安定的威胁。君士坦丁堡最近向他臣服，但它的亲王阿方索肯定是不值得信任的。更明智的做法可能是暂时将注意力集中在意大利。小心那些野心勃勃的封臣，比如克劳狄·欧亨尼奥和罗马亲王提图斯·梵卓鲁·卡米拉。\n\n#bold 你能再次确保勒森魃[clan|E]作为欧洲最具影响力的[clan|E]的正确地位么？#!"
 bookmark_warofprinces_camilla:0 "卡蜜拉"
 bookmark_warofprinces_camilla_desc:0 "提图斯·梵卓鲁·卡米拉在罗马的大部分辉煌历史中占据着重要地位，可以说是古代政治上最重要的[cainite|E]。卡米拉在梵卓历史是一位争议人物，他因其政治敏锐性和对他们最强大的帝国的光荣领导而闻名，但也因创立了原罪之路而受到忌讳，该道德准则对于大多数梵卓的喜好来说过于……堕落。\n尽管有这些争议，卡米拉还是召集[clan|E]发动该著名的战争，摧毁了迦太基，直到今晚，他的这一成就仍然受到称赞。他的[torpor|E]结束了罗马的光辉岁月，并预示着长夜的到来，梵卓[clan|E]的力量大大削弱。\n\n#bold 刚在一陌生的新世界下苏醒，你能再一次，为了一颤动的、堕落的罗马的荣耀统治整个[cainite|E]世界么？#!"
 bookmark_warofprinces_qawiya:0 "卡维娅·加杜巴"
 bookmark_warofprinces_qawiya_desc:0 "萨洛比[clan|E]已支离破碎，几乎被睿魔尔家族的篡位者逼得绝种。耶路撒冷的雌狮，萨麦尔的子嗣是他们最后的希望，是他们在面对贤士的攻击时最后的生存机会。她与该地区的亲王互相结盟，而此“橄榄会议”却有些不稳定，此外还有着附近的阿什拉派和巴力族的威胁。对这位萨洛比选民来说，确保自己的权力基础是明智的第一步。\n\n#bold 你能将徒劳的最后一战转变为萨洛比[clan|E]的辉煌复兴么？#!"
 bookmark_warofprinces_alexander:0 "亚历山大"
 bookmark_warofprinces_alexander_desc:0 "在作为法兰西的绝对统治者超过一千年后，亚历山大因他长子杰弗里·杜·坦普尔领导的阴谋失去了一切。现在，被放逐到黑十字成为了被忌讳的客卿后，强大的玛土撒拉正在策划他的回归。除了惊人的个人能力和宣称外他几乎一无所有……这对大计划是微不足道的。对于曾经是最强大的全能梵卓子嗣之一的他来说，这几乎是从零开始。\n\n#bold 你能让杰弗里和萨利安娜为他们的背叛付出代价，并夺回属于你的王位么？或在这片东方土地上创造新的遗产？#!"
 bookmark_warofprinces_werter:0 "维特"
 bookmark_warofprinces_werter_desc:0 "古斯堪的纳维亚人的古老生活方式正在消亡，奥丁的子嗣们也在消亡。当德意志梵卓向斯堪的纳维亚发起最后的进攻时，大多数英灵战士都随从了他们的命运并迎接即将到来的诸神黄昏。\n\n#bold 作为你人民中最后的崇高之主，你是愿意平静地接受你的命运，还是为了瓦尔哈拉作出最后的抵抗？#!"
 bookmark_warofprinces_etrius:0 "伊崔乌斯"
 bookmark_warofprinces_etrius_desc:0 "作为最年轻的吸血鬼[clan|E]，睿魔尔正处于一个艰难的位置。睿魔尔他本身也处于[torpor|E]状态，好以消化[diablerie|E]扫罗后的成果，而永远忠诚的伊崔乌斯不得不面对棘秘魑的无情攻击。你还剩着一些优势，因为[clan|E]著名的纪律确保了团结，而德意志和匈牙利的梵卓在某种程度上支持你。你的敌人并不以耐心著名，你应该从他们的内部危机中寻找获利的机会。\n\n#bold 你能保证睿魔尔[clan|E]能像睿魔尔那样在吸血鬼政治中拥有强大势力么？#!"
 bookmark_warofprinces_rustovitch:0 "罗斯托维奇"
 bookmark_warofprinces_rustovitch_desc:0 "军督之督的荣誉并没有落在最年长或最强大的库都术士手中，而是落在了最雄心勃勃的棘秘魑手中。到目前为止，弗拉基米尔·罗斯托维奇的统治有点复杂，他对十字军战士约根·冯·费尔登实行了无条件和平，对受人憎恨的睿魔尔实行了屈辱性的惩罚。在棘秘魑内部中，很多人都希望他下台，首先是他的前任，诺利兹。若罗斯托维奇不是一位精明的政治家的话，他将会什么也不是，只要他能够确保一些关键的胜利，他的对手可能很快就会“消失”……\n\n#bold “狼群克星”能带领内斗不休的棘秘魑领主对抗梵卓和睿魔尔篡位者的威胁吗？#!"
 bookmark_warofprinces_mithras:0 "密特拉"
 bookmark_warofprinces_mithras_desc:0 "密特拉被一些人信奉为一位字面上的波斯和罗马神。尽管这似乎难以想象，但这让他得以创建一个由狂热子嗣和密教徒组成的忠心心腹来执行他的命令。在古罗马时期的一些密谋计划失败后，密特拉逃到英格兰，但很快就厌倦了英格兰领主之间的琐碎纷争。他觉得自己最好还是在眠中度日，于是把国家交给了几个值得信赖的摄政王……他们很快就自作孽了。从[torpor|E]中苏醒后，密特拉迅速地巩固了他的权力，修复了他的摄政王们造成的大部分混乱。英格兰稳固了，但没有完全被征服。此外，你将不得不对付威尔士的野蛮冈格罗，诺丁汉的叛逆歹徒和苏格兰的的残余英灵战士。之后，法兰西的权力真空可通过你在波尔多的飞地被利用。\n\n#bold 你能达到多远没有限制。见证不朽之阳的荣耀吧！#!"
 bm_867_thelongnight:0 "凡人世界"
 bm_867_thelongnight_desc:0 "#R 该剧本中大多数有领地和头衔角色都是凡人，只有1%是吸血鬼。建议选择游戏规则“黑暗世界——无知世界”和“超自然霸权——凡人：愚夫俗子”。\n\n如果你将游戏规则设定为“黑暗世界”和“吸血鬼：避世潜藏”，你将会看到一个大多数有领地和头衔角色都是非原作吸血鬼的世界。我们强烈推荐公元1230年的亲王之战剧本，而不是该剧本。尽管如此，还是很多人想要一个几乎没有吸血鬼的凡俗世界，所以这就是了。其他人可以通过在选择此位于867年的“吸血鬼：避世潜藏”来享受一个更随意的吸血鬼沙盒。\n\n你可通过决议使用背景生成器定义你角色在黑暗世界的背景。祝你玩的开心！#"
 bookmark_thelongnight_neklan_premsyl:0 "内克兰·普雷姆西尔"
 bookmark_thelongnight_neklan_premsyl_desc:0 "适用于游玩返祖血仆\n普雷姆西尔返祖血仆家族的始祖，来自于一场棘秘魑对于波西米亚皇室血脉的实验。他们被认为是玛土撒拉布克迪拉卡和他的代理人无生者阿兹拉的仆从。\n\n你可能还记得电子游戏《吸血鬼：避世潜藏——救赎》里的他们。"
 bookmark_thelongnight_michael:0 "米迦勒"
 bookmark_thelongnight_michael_desc:0 "适用于游玩隐秘吸血鬼\n假扮成拜占庭皇帝米海尔三世的妥芮朵吸血鬼玛土撒拉米迦勒。作为吸血鬼的幻梦的天使长，他试图用这个假身份扩大自己在凡人世界的影响力。"
 bookmark_thelongnight_rurik_rurikid:0 "留里克"
 bookmark_thelongnight_rurik_rurikid_desc:0 "适用于游玩狼人，目前未实装\n有传言说留里克是芬里尔传人（狼人部族之一）的狼族。\n\n狼人还没有在本黑暗亲王Mod中被实装。"
 bookmark_thelongnight_theodosius:0 "狄奥多西"
 bookmark_thelongnight_theodosius_desc:0 "适用于游玩裁判官。\n希腊神学家，从前诺斯替异端转变而成的虔诚天主教徒，神秘主义知识分子，吸血鬼猎人和红修会的创始人。"
 bookmark_warofprinces_pustula:0 "塞尔维乌斯·马里乌斯·普斯图拉"
 bookmark_warofprinces_pustula_desc:0 "曾是古罗马的奴隶，在一场吸血鬼大战之后，他被一个名叫诺斯费拉图的吸血鬼初拥。然后在塔尼特巴尔的指导下，他通过写讽刺诗来发泄自己的愤怒。当他的导师失踪后，普斯图拉和他的同伴卡米拉密谋对付那些与塔尼特巴尔为敌的人，在陷入[torpor|E]之前，卡米拉把普斯图拉之路托付给了他。普斯图拉离开罗马，开始在国外传教，赢得了许多新的追随者。\n\n现在卡米拉已经苏醒，塞尔维乌斯必须决定是否帮助他的老盟友重建在原罪之路下的罗马的计划。"
 bookmark_warofprinces_esclarmonde:0 "埃斯克拉蒙德"
 bookmark_warofprinces_esclarmonde_desc:0 "曾经，埃斯克拉蒙德的宫廷是诗歌、爱情和艺术的中心。在她的耐心指导下，奥克西塔尼亚已经发展成为一个宽容与文明的要塞。\n然后，野蛮的法兰西人来了。他们以为埃斯克拉蒙德会在阿尔比派十字军的攻势面前迅速倒戈，但却惊讶地发现她是一位顽强的卫士和能干的政治家。这个地区遭受了巨大的损失，埃斯克拉蒙德为了生存不得不向“十字军”做出了许多妥协。但她还在这里，只要她在，奥克西塔尼亚就会延续下去。\n\n#bold 你还有时间重整旗鼓，建立新的联盟，但傲慢的法兰西人不会再低估你了。你必须坚强地站起来，拯救你心爱的国家，因为再没有其他人可以做到。#!"
 bookmark_warofprinces_roque:0 "罗克"
 bookmark_warofprinces_roque_desc:0 "罗克也许是最有影响力的末卡维亲王之一，他是一个技巧娴熟（但做事很强迫性）的阴谋家和计划者。他保住自己封地的能力为他赢得了勒森魃[clan|E]勉强的尊重，他在“暗影再征服”中扮演了自己的角色。他对阴谋和阴谋的迷恋迫使他暗待，看他能否在摧毁敌人之前驾驭他们成为有用的东西。\n\n罗克也是解密会的杰出追信徒，他认为暗影再征服带来的混乱预示着对所有[cainites|E]来说又一个伟大的毁灭时代。\n\n#bold 你的未来是不确定的，但如果你能控制住你的心魔，你可以在未来几个世纪里继续成为纳瓦拉的主要驱动力……甚至可能在半岛上扮演重要角色。#!"
 bookmark_warofprinces_natalya:0 "娜塔莉娅·斯维亚托斯拉夫"
 bookmark_warofprinces_natalya_desc:0 "娜塔莉娅是一位俄罗斯王族的女儿，在君士坦丁堡接受教育，她永远爱上了这座城市。她的行政技巧让她引起了布鲁赫的注意，布鲁赫给了她[Embrace|E]，她欣然接受了。\n\n娜塔莉娅全身投入的想要建立一个新的迦太基，她的[clan|E]之理想与米迦勒之幻梦的化身。十字军征服君士坦丁堡后，她逃到了伊庇鲁斯暴君那里，在那里她成功地成为了帖撒罗尼迦亲王。她将自己的城市视为有用的退路，但她梦想着从阿方索和拉丁野蛮人手中夺回君士坦丁堡。\n\n#bold 你也许是创造一个能与迦太基和君士坦丁堡匹敌的乌托邦的最后希望。尊重过去的成就，并利用它们来建设你梦想的更美好的未来。#!"
 bookmark_warofprinces_jasmin:0 "帕尔马的贾斯明"
 bookmark_warofprinces_jasmin_desc:0 "一位来自穆瓦希德王朝的哈基姆之子女术士。她设法重振阿什拉派在巴利阿里群岛的信仰，但她在让他们领会基督教的威胁这一方面却不太成功。巴利阿里群岛的吸血鬼们享受着与主流的[cainite|E]社会的隔离，形成了一个由隐居者、怪人和不合群者组成的混杂集合。"
 bookmark_warofprinces_durga_syn:0 "突伽·辛"
 bookmark_warofprinces_durga_syn_desc:0 "雷伏诺[clan|E]的善良导师也许是[cainite|E]俄罗斯的唯一正义力量。这片土地，被芭芭雅嘎和她的暗影帷幕所永远诅咒着，只会给那些反对暴虐巫婆的人带来痛苦和绝望。尽管有这些可怕的可能性，突伽·辛从未动摇，她的宫廷已经成为任何试图从芭芭雅嘎的下仆手中夺回这片古老土地的人的希望灯塔。如果突伽不能履行她的职责，暗影帷幕肯定会将整个欧洲卷入其中。\n\n#bold 让雷伏诺聚集在你明智的领导周围，打败芭芭雅嘎的疯狂仆从，为俄罗斯带来希望！#!"
 bookmark_warofprinces_maatkare:0 "玛阿特卡勒"
 bookmark_warofprinces_maatkare_desc:0 "玛阿特卡勒是是赛特之子[clan|E]的圣显者之一，作为赛特之妾，拥有近乎是倾世无双的美貌。她拥有巨大的影响力，统治着马格里布的坠落鹰巢神殿，在那里她小心翼翼地将赛特的影响力传播给当地误入歧途的[cainites|E]们。\n穆斯林伊比利亚半岛目前的崩溃产生了连锁反应，破坏了该地区的稳定。玛阿特卡勒现在正要好好利用下这个事实，在她的脑海中有了一个建立从伊比利亚到埃及的统一赛特之子[clan|E]的梦想……\n\n#bold 不管是否误入歧途，你都是赛特对他所有子嗣不死之爱的化身。你会向他们说明这一点，且他们会牢记于心。因为他们别无选择。#!"
 bookmark_warofprinces_matasuntha:0 "玛塔孙塔"
 bookmark_warofprinces_matasuntha_desc:0 "玛塔孙塔是老冈格罗中的一个传说。作为游牧民族匈奴人的领袖，她几乎让罗马人跪在她面前，直到403年阿尔卑斯山的一场天时不测才勉强让停下脚步。然后她被遗忘了，最近从[torpor|E]中醒来，发现这个新世界变得奇怪而可怕。她曾经骄傲的[clan|E]已经分裂，被十字架的仆众反推了回去，年轻的一代已不知道她的名字和她过去的功绩。然而，还有希望，当蒙古汗帐横扫草原时，玛塔孙塔认为他们是她子民的合格继承人。\n\n#bold 让草原上的其他冈格罗看看罗马在几个世纪前为什么向你求饶。随后，确保软弱的西方[cainites|E]再也不会忘记你的名字。#!"
 bookmark_warofprinces_dionysius:0 "狄奥尼修斯"
 bookmark_warofprinces_dionysius_desc:0 "狄奥尼修斯是一个平和、朴素的人，在他还是人类的日子里，他加入了对珀耳塞福涅的崇拜，徒劳地试着去寻找他死去的亲人。这种对死亡的迷恋，使他成为了卡帕多西亚族[Embrace|E]的对象。然而，成为不死族并没有改变狄奥尼乌斯多少，他拒绝追随他[clan|E]那病态的方式，反而更愿意关心凡人和死者。因为他在编纂人性这一面上功不可没，由此吸引了大量的追随者。\n他所赢得的巨大尊重使他被选为雅典的亲王，这一职责至今仍由他担任。他的城市现在接纳了大量来自君士坦丁堡陷落的难民……他们哭着喊着要报仇。\n\n#bold 你将不得不平衡你的信念， 和你对人性的信仰来应对希腊当前的混乱。也许你仁慈的领导方式是唯一的良药，可以阻止阻止第四次十字军东征所带来的无休止的疯狂。#!"
 bookmark_warofprinces_petaniqua:0 "佩塔尼夸"
 bookmark_warofprinces_petaniqua_desc:0 "佩塔尼夸曾被称为奥林匹亚，是马其顿腓力二世的妻子，亚历山大大帝的母亲。大多数人不知道的是，她也是西布莉密教的成员，一位疯狂的巴力族玛土撒拉。在她的“女神”的养育下，佩塔尼夸渐渐憎恨所有的男人，除了她的儿子，为了其她许要了这个世界。他得到了这个世界，但却被剥夺了永恒，只因库伯勒禁止佩塔尼夸把亚历山大变成吸血鬼。\n这是她理智逐渐衰退的开始，这种衰退一直持续到今晚。从那以后，佩塔尼夸进入了更深的地狱，与那些最好不为人知的实体签订了协议。她甚至不知道原因。\n\n#bold 一定有办法找到他。或者是一个强大到能让他复活的实体。然后，他将成为世界之王，一切将再次完美。#!"
 bookmark_warofprinces_absalon:0 "阿布萨隆"
 bookmark_warofprinces_absalon_desc:0 "他曾是隆德的大主教，也是丹麦最有权势的人之一，国王和[cainites|E]都对他爱不释手。一旦死亡降临，让他崛起成为国家的吸血鬼主人是件很容易的事。他早期的统治是成功的，他小心地平衡了南方的梵卓和北方的野蛮冈格罗。直到一场针对温德的睿魔尔的战役让阿布萨隆分心了几十年，因为他发现了一个可以改变他命运的强大秘密。\n没有他的细心指导，丹麦成了小军阀和流氓冒险家的牺牲品。但这不会持续太久，因为阿布萨隆现在准备回到他的土地上。\n\n#bold 夺回你与生俱来的权利，但小心地打出你的牌，因为南方和北方都希望你离开。#!"
 bookmark_warofprinces_helena:0 "特洛伊的海伦"
 bookmark_warofprinces_helena_desc:0 "许多军队都为了世界上最美丽的女人的一瞥而战斗。但海伦从来就不是一位陷入困境的少女，因为她很早就吸榨了她的[Sire|E]也是俘获她的人——米诺斯。吸血鬼政治圈很适合她，她在迦太基找到了庇护和爱。\n然而，爱并不能长久，当她意识到帮助迦太基抵抗罗马是徒劳的时候，她把自己的新家出卖给了拉丁人。而迦太基沦陷后唯剩的幸存者之一，斯巴达的墨涅拉俄斯，从那时起就在寻找毁灭她的机会。他们之间的冲突已经延续了几千年，成为了传说，但双方都没有占据上风。无数城市因此战争而沦陷。\n\n#bold 杀了墨涅拉俄斯。抹去他存在的一切痕迹。这样，他们所有人都会爱上你，并而绝望。#!"
 bookmark_warofprinces_tabitha:0 "泰贝莎·马斯里"
 bookmark_warofprinces_tabitha_desc:0 "当穆斯林国家在再征服前崩溃时，阿刹迈[clan|E]派出了一支最优秀的战士试图阻止入侵。在泰贝莎·马斯里的领导下，他们已经在巴达霍斯安家，并打算尽可能长时间地控制这座城市。泰贝莎并不是一位狂热者，她接受那些该战斗的人想逃跑而不是战斗。到目前为止，她已经接受了苏丹拜德尔的统一呼吁，但任对格拉纳达的统治者心存疑虑。她知道不统一会给虔诚的信徒带来末日，所以她的监视行动只有她自己知道。\n\n#bold 你的使命很简单：顶住基督教的再征服，让他们为每一寸占据的土地付出代价。接下来，也许，得知苏丹拜德尔的真正目的……#!"
 bm_1375_patronwar:0 "赞助之战"
 bm_1375_patronwar_desc:0 "这个剧本是按照我们的赞助者的意愿制作的，并不呈现跑团原作。黑死病之后，血族社会陷入混乱。随着血液供应的枯竭，许多吸血鬼进入了蛰眠状态，还有一些被消灭了。当人类从浩劫中挣扎回来时，经历了黑死病的血族们在灾难之后建立了新的帝国和王国。"
