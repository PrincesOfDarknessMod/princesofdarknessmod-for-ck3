 bookmark_patronwar_zethraeus:0 "齐特雷"
 bookmark_patronwar_zethraeus_desc:0 ""
 bookmark_patronwar_eden:0 "伊甸"
 bookmark_patronwar_eden_desc:0 ""
 bookmark_patronwar_loukios:0 "卢基奥斯"
 bookmark_patronwar_loukios_desc:0 "一位有名望的罗马百夫长，秘密地信仰着伊西斯女神密教。在阻止罗马被哥特人部落瓦解的那些年里，当战争开始变得不可挽回时，卢基奥斯离开了。他越来越迷恋埃及神话，为了更好地了解他的女神，他去了筛沙之乡朝圣。不幸的是，他没有找到他所追寻的知识——只找到古蛇的信徒。赛特在古庙里迎接他。他对他对罗马军队的了解很感兴趣。"
 bookmark_patronwar_ciaran:0 "基厄兰"
 bookmark_patronwar_ciaran_desc:0 "基厄兰是一个爱尔兰旅行者，或者更准确地说，是一位爱尔兰流浪者（原文的字面意思为「走路的人」）。他是一个23岁的年轻人，他只是做他需要的事情来生存并支撑他的家庭。这通常意味着撒谎和欺骗，因为他没有很多其他技能。虽然有着不诚实的本性，他还是非常顾家之人，而且他把所有的爱尔兰流浪者看作是他的家庭。他几乎同样尊敬任何一个游牧民族。这就是他为一个奇怪的印度斯坦旅行者提供住所的原因，该人称自己为维斯瓦纳坦。\n\n他不知道的是，维斯瓦纳坦是一位玛土撒拉，雷伏诺氏族的第五代吸血鬼，他周游世界来到了爱尔兰。随后他们的营地很快得遭到了当地人的袭击，而爱尔兰人也受了致命伤。因此维斯瓦纳坦违背了自己的原则，初拥了基厄兰，救了他一命。他教会他矛盾之路，并警告他不要做他刚刚做过的事情。然后就走了。"
 bm_1230_inquisitor:0 "黑暗时代：裁判官"
 bm_1230_inquisitor_desc:0 "公元1230年。在一群强大的怪物猎人的带领下，神圣的教会终于意识到了吸血鬼的威胁。这些英雄组成了一个崭新的，隐秘的，名为暗影裁判所的组织，他们是第一批试图重新征服夜晚并击退恐怖之物的人类。摆在他们面前的目标是艰巨的，而这些被诅咒的吸血怪物有数个世纪的时间来巩固自己并准备反击。如果他们的牺牲会人类的美好未来铺平道路，那么所谓的「裁判官」们就会像烈士一样牺牲。他们为同一个目标而战，这是任何吸血鬼都无法比拟的。\n\n#bold 你就是这个对挽魂之战一无所知的世界的唯一希望。#!"
 bookmark_inquisitor_gauthier:0 "戈捷·德·丹皮尔"
 bookmark_inquisitor_gauthier_desc:0 "戈捷是一个小法兰西伯爵的第三子，他在很小的时候就听到了上帝的召唤，并以他唯一知道的方式回应了它：战斗。在第三次十字军东征中，他第一次遇到了一位吸血鬼，这让他看清了现实，此时他聚集了一群虔诚的骑士，他们一心要与邪恶作斗争。有证据证明他是暗影裁判所的创始人，在那里他是所有军事事务的领导者。戈捷是一名可怕的战士和富有魅力的领袖，但随着年龄的增长，他开始担心自己死后裁判所会发生什么。\n\n#bold 你的丰功伟绩已经过去了，但你仍然有时间确保亚柯骑士比你活得更久。这是你服侍上帝的一生的最后一项责任。#!"
 bookmark_inquisitor_leopold:0 "利奥波德·冯·穆尔瑙"
 bookmark_inquisitor_leopold_desc:0 "利奥波德是冯·穆尔瑙家族的一个小后裔，体弱多病，被诅咒拥有一种奇怪的能力：能够真正的「闻」到邪恶的力量。头脑敏锐的利奥波德并没有害怕它，而是利用他的天赋帮助揭露了几起发生在他家里的吸血鬼阴谋。但他并没有就此止步，他很快就来到罗马，向新成立的亚柯骑士献礼。从那时起，他就成为了暗影裁判所的主要推动力量，召集了所有试图与各种形式的邪恶作斗争的人。他的家族在他身后支持，利奥波德也许是裁判所最强的支柱，领导着所有夺回夜间的努力。\n\n#bold 穆尔瑙家族立场很坚定，且巴伐利亚已经确保，但这仅仅是战斗的开始。在最后一个吸血鬼被赶出上帝的光之前，你不能停下来。#!"
 bookmark_inquisitor_maria:0 "玛利亚·伊马库拉达"
 bookmark_inquisitor_maria_desc:0 "圣约翰修女会的现任领袖并不是该教会的创始人，但她的意志与蒙福的前任特蕾莎修女一样坚定。称她个人强大是在暗示教宗只有一点点神圣。在经历了几次经验不足的裁判官的失败后，玛利亚·伊马库拉达决定亲自前往英伦诸岛，希望能找到这个臭名昭著的吸血鬼「神王」，其可能统治着英伦诸岛。有了她坚定的信仰和裁判所其他修士会的支持，玛利亚准备教会这个敌人世上只有一个神。\n\n#bold 你确定英格兰是吸血鬼活动的中心。发现并摧毁它将是对裁判所的巨大恩惠。你将见证神王陨落。#!"
 bookmark_inquisitor_vittoria:0 "维特多利亚·圣蒂尼·迪·帕尔马"
 bookmark_inquisitor_vittoria_desc:0 "维特多利亚是一位智力超常、对上帝有强烈爱的女人，她是红修会的非正式领袖，也是暗影裁判所的研究人员。她拥有一种不可思议的直觉，知道什么时候打破规则，什么时候准确地按照传统的方式行事。因此，她显然是最重要和最危险任务的人选：清除意大利本身的吸血鬼影响，保护罗马教廷。随着维多利亚发现教会间越来越多超自然腐化，她发现任务将比预想的更加复杂……\n\n#bold 你决心拯救教会，而最好的方法就是揭露和消灭意大利的吸血鬼。你已经确定了两个主要目标，一个是米兰所谓的枢机主教，另一个是在罗马嘲笑教皇的憎恶之物……#!"
 bookmark_inquisitor_aignen:0 "善书者艾格嫩"
 bookmark_inquisitor_aignen_desc:0 "欧西坦间谍首领是神目的首领，该修士会是裁判所的眼与耳。艾格嫩曾是罗德里格·德·纳瓦拉的中尉，并当该朋友拒绝加入暗影裁判所时而与其决裂。艾格嫩哀悼他失去的友谊，但他知道罗马教廷将需要一个足智多谋的间谍的强大力量。前盟友对他不屑一顾，新盟友仍对他不信任，艾格嫩走着有所用处和被视异端之间的孤独道路。\n\n#bold 法兰西是你的家，你知道这里孕育了吸血鬼力量。清洁派异端证明了这一切。与你能聚集的少数朋友，你必须采取行动来控制局势，并希望证明你对暗影裁判所有用。#!"
 bookmark_inquisitor_rodrigue:0 "罗德里格·德·纳瓦拉"
 bookmark_inquisitor_rodrigue_desc:0 "罗德里格是第一位接触到不死族的基督徒，他活了下来，然后选择拿起武器与之对抗。他是纳瓦拉的一个小贵族，正是在清洁派异端期间，他目睹了世界上真正的邪恶。从那时起，罗德里格就一直在疯狂地试图摧毁任何被认为的吸血鬼衍生物……在他偏执的头脑里，这几乎是每个人。因此，他拒绝加入暗影裁判所，并按照自己的方式行动，与圣雅各伯之剑受其支配。\n\n#bold 他们到处都是。暗影裁判所可能是盟友，但你不能冒险。如果他们想帮忙，那很好，但你要用你自己的方式和条件来拯救伊比利亚。#!"
 bookmark_inquisitor_bayezid:0 "巴耶齐德·甘滕宾"
 bookmark_inquisitor_bayezid_desc:0 "曾是是卡洛梅娜选民劣族该隐之子斯坦尼斯拉夫的血仆奴隶，巴耶齐德和他的兄弟巴西尔发现他们的鲍格米勒信仰受到了不死族利益的侵蚀。1204年，斯坦尼斯拉夫在米迦勒的幻梦的破灭之中被毁灭，甘滕宾兄弟也从他们的血缚中被解放。从那时起，他们就称自己为「卡洛梅娜的被遗忘者」，并带领着鲍格米勒的信徒在波斯尼亚各地攻击吸血鬼。\n\n#bold 卡洛梅娜，该隐的孪生姐妹，期望该隐的不死族子嗣被毁灭！#!"
 BOOKMARK_CHARACTER_DIFFICULTY_VERY_HARD:2 "#difficulty_hard 极难#!"
 bookmark_patronwar_jose:0 "何塞"
 bookmark_patronwar_jose_desc:0 ""
 bookmark_patronwar_hannibal:0 "汉尼拔"
 bookmark_patronwar_hannibal_desc:0 ""
 bookmark_patronwar_antariksha:0 "安塔裡克施·钱德拉"
 bookmark_patronwar_antariksha_desc:0 ""
 bookmark_patronwar_rostislav:0 "罗斯季斯拉夫"
 bookmark_patronwar_rostislav_desc:0 ""
 bookmark_warofprinces_hardestadt:0 "哈德施塔特"
 bookmark_warofprinces_hardestadt_desc:0 "哈德施塔特是第一位新生代梵卓亲王，比那些古罗马时代的长者更适应中世纪，来自于一个岌岌无名、毫无价值的世系。这位巴伐利亚军阀利用凡人的神圣罗马帝国将梵卓氏族的中心从罗马转移到了德意志，在这个过程中他巩固了自己在同族中的掌控。\n哈德施塔特在掌权后极少遇到阻碍，但是一些问题依然存在，例如茱莉亚·安塔西亚治下的顽固的罗马人……\n\n#bold 你有一个强大的领地以及由你支配的子嗣和盟友，抛弃罗马的过往包袱，你将在即将到来的数个世纪定义何为梵卓。#!"
 bookmark_warofprinces_antasia:0 "茱莉亚·安塔西亚"
 bookmark_warofprinces_antasia_desc:0 "罗马共和国的女儿是另一个时代的梵卓，那时她的氏族是永恒元老院的守护者，是该隐之子的无情世界中的乌托邦。那是茱莉亚的完美世界，每位梵卓都有着话语权，而投票权也不分年龄和性别。元老院的法律能成为氏族未来千年的戒律……随后，卡米拉和他的堕落疯狂来了，紧随其后的是哈德施塔特和他无情的野心。\n于她的法兰克福亲王领，茱莉亚并没有失去将她的氏族带回其根源的希望。理想主义可能仍然是梵卓氏族的未来之路。\n\n#bold 你不能让哈德施塔特，或者更糟的卡米拉，支配梵卓氏族的未来。你必须为元老院与共和国而战！#!"
 bookmark_warofprinces_jurgen:0 "约根·冯·费尔登"
 bookmark_warofprinces_jurgen_desc:0 "这位声名显赫的德意志骑士是哈德施塔特的得力助手，尽管他年纪轻轻，但他的名字已经远近闻名。约根是马格德堡的一位严格但公正的统治者，他是完美的梵卓骑士，同时也是勇敢和无情的野心家。\n约根最近对棘秘魑督军领发动了战争，并强迫建立了一个缓冲国。但这还不够，他已经在计划下一次进攻了……只要他能摆脱亚历山大，这个累赘的流亡法兰西亲王。\n\n#bold 你的荣誉就是你的承诺，这是你的野心所遭受的唯一限制。通过火和剑，通过征服和外交，梵卓氏族总有一天会在你面前低头。#!"
 bookmark_warofprinces_anna:0 "安娜·科穆宁"
 bookmark_warofprinces_anna_desc:0 "作为拜占庭公主，安娜·科穆宁在凡生中被剥夺了她与生俱来的权利……在她亡生又被剥夺了第二次。当她于不死族的君士坦丁堡的权力结构中努力工作时，第四次十字军东征发生了，打破了世界渴望之城的任何理智表象。但安娜是个耐心细致的谋划者，她成功地确保拜占庭继承者王国中最强大的尼西亚成为她的领地。她对君士坦丁堡过去的梦想和乌托邦毫不在意，这使她与许多其他希腊幸存者产生了隔阂，但她不会让这些阻碍她取得战果。不再会了。\n\n#bold 君士坦丁堡终于在望了。不要让任何人挡在你的天命前，它最终将属于你。#!"
 bookmark_warofprinces_anadja:0 "阿娜佳"
 bookmark_warofprinces_anadja_desc:0 "作为一个波斯商人的女儿，阿娜佳注定要过着平淡无奇的生活，直到受人尊敬的贝利撒留和谢巴赫看上了她，把她当作自己的孩子抚养。有了这样令人印象深刻的导师们，阿娜佳很快就适应了该隐之子的世界，并很快被一个秘密的密教组织注意到，认为她是他们应许的救世主。\n从那时起，阿娜佳已经成为亚美尼亚最有影响力的吸血鬼，并且仍然在接受她的「父母」和密教组织的指导。她现在已经长大到可以独立统治了，只有时间能证明她是否能达到对她的崇高期望。\n\n#bold 你已经为这一时刻做了专业的准备。是时候写下你自己的故事了，该结局只能由你来讲述。#!"
 exit_char_window:0 "返回"
 bm_1230_warofprinces_sub_ventrue:0 "梵卓氏族"
 bm_1230_warofprinces_sub_ventrue_desc:0 "自称是该隐之子世界的统治者，梵卓是黑夜的高贵的领主和女士。长期以来，他们一直是最自豪的吸血鬼世系之一，努力维持着荣誉、优雅的行为和领导的声誉。长期以来，贵族责任感充斥着这个家族，并伴随着一种真诚的信念，即梵卓知道什么对每个人都是最好的。\n最近一连串的挫折困扰着这些蓝血者，罗马的沦陷，以及法兰西——他们的据点之一——的丢失。尽管如此，梵卓氏族仍然统治着中世纪的夜晚。如它本该是。\n\n#bold 梵卓氏族的霸权是不可妥协的。教他们晓得。#!"
 main_sub_bookmark:0 "主要"
 ventrue_sub_bookmark:0 "梵卓"
 lasombra_sub_bookmark:0 "勒森魃"
 bm_1230_warofprinces_sub_lasombra:0 "勒森魃氏族"
 bm_1230_warofprinces_sub_lasombra_desc:0 "阴暗的掠夺者和无情的社会攀附者，勒森魃为个人的成功而存在，为个人的胜利而争斗，而不是仅仅为了戴上皇冠或坐上王座。他们相信强权即正义，并愿意牺牲一切来实现他们的目标。\n作为一个将精神信仰作为工具而不是寻求开明启蒙的氏族，他们善变的忠诚目前被困扰着暗影之海的大规模内战所凸显，他们那曾经横跨地中海的帝国。穆斯林在伊比利亚与基督徒作战，基督徒在意大利与异教徒作战，年轻人同时在各地与他们的长者作战。当勒森魃自相残杀时，其他氏族都松了一口气，他们知道若他们统一起来，他们能取得怎么样的成就。\n\n#bold 勒森魃氏族将于同族的血液中被重新铸造。溅血，并征服。#!"
 bookmark_warofprinces_lucita:0 "露西塔·德·阿拉贡"
 bookmark_warofprinces_lucita_desc:0 "The daughter of King Alfonso II of Aragon, Lucita always craved autonomy and freedom since her youngest age. Her fierce independence and indomitable will were irresistible to the powerful Lasombra Cardinal Ambrosio Luis Moncada and he embraced her. Since then, Lucita has been the rising star of clan Lasombra and the pride of her sire. Despite the praise she receives and the many achievements she already accomplished, the fierce princess is already craving, once again, more freedom... something that goes against both her sire and her clan wishes for her.\n\n#bold No one can cage you for long, Lucita. Earn your independence, even if you have to burn your whole clan for it.#!"
 bookmark_warofprinces_moncada:0 "安布罗西奥·路易斯·蒙卡达"
 bookmark_warofprinces_moncada_desc:0 "A man of ambition, talent, and faith, Ambrosio Luis Moncada was the Archbishop of Madrid in life. To no one's amazement, Monçada made the most of his position. To the surprise of many, however, he did so while holding himself to a strict monasticism. He was absolute in his faith, unshakable in his conviction, and resolute in his use of power for what he considered to be Heaven's causes. The Embrace changed Monçada less than one might suppose. He quickly became the main driving force behind the Shadow Reconquista and his influence inside clan Lasombra is rising steadily, but his reasons for seeking power have not changed. It is not for the glory of Monçada (that poor fleshly shell), but rather for the glory of God.\n\n#bold You are destined to rule over Iberia and clan Lasombra itself. God choose you for his holy task and you will comply with His will, as you always do.#!"
 bookmark_warofprinces_badr:0 "拜德尔"
 bookmark_warofprinces_badr_desc:0 "As the Iberian Lasombra civil war rages on, the Andalusian Cainites, known as Ashirra, have found a new leader : Badr of Granada. This mysterious Sultan has taken an unyielding stance and is rallying the disparate Taifas to her cause. Her effort has divided the Ashirra community, as many see her as not much better than the Christians, but has still managed to slow down the dreaded Reconquista. As her fame grows, some are starting to be interested in the mysteries surrounding her... and a few of those inquisitive souls have already met a painful end. Badr rules with a shadowy iron fist, but an iron fist all the same.\n\n#bold You must triumph against the Reconquista. This is a springboard for your ambition, and woe to those who stand in your way.#!"
 bookmark_warofprinces_lucius:0 "卢修斯·埃利乌斯·塞扬努斯"
 bookmark_warofprinces_lucius_desc:0 "Once a Praetorian of Rome, Lucius Aelius Sejanus almost rose to become Emperor but was cut short before he could achieve his ambition. Dying on the shores of the Tiber, the place where a she-wolf supposedly discovered Romulus and Remus, a Lasombra pulled Sejanus's body from the currents. Finding that the final embers of life still flickered within his breast, the elder Embraced him. She left him with these words: 'You will rule again, as you were always meant to do. Destroy the lords who sought to combat you. You have the potential to become greater than your master. Use it wisely'. Since then, the once would be Emperor now seeks to become Emperor of the Night, and his first moves in this grand game are coming soon...\n\n#bold One night, you will wield the power to threaten the mightiest of your kind. Make sure that your true destiny isn't cut short this time.#!"
 bookmark_warofprinces_gratiano:0 "葛莱西安诺·德·维罗纳"
 bookmark_warofprinces_gratiano_desc:0 "The last, and still very young, childe of Lasombra himself, Gratiano de Veronese was an unremarkable Italian noble in life, leading to many wondering why the Antediluvian favored him so. Gratiano knows the answer though : his own inherent greatness. Convincing himself of his importance, the Veronese is now chafing openly against his 'older brother' Montano, the current regent of clan Lasombra. From his court in Verona, Gratiano is well aware that he is despised and laughed at by all but the youngest of his own clan. But even such a small and weak powerbase can grow in time and one night, Gratiano might be the one laughing at them all...\n\n#bold You must earn respect and power quickly if you are to challenge your 'brother' for his title. Then, it might be time for a talk with your 'father' himself...#!"
 bookmark_warofprinces_alfonzo:0 "威尼斯的阿方索"
 bookmark_warofprinces_alfonzo_desc:0 "One of the most gifted childe of the influential Narses, Alfonzo of Venice has been the most prominent Latin Cainite in Constantinople for more than two centuries. Known to have instigated the Latin Riots of 1185, Alfonzo has also used the 4th Crusade to proclaim himself Prince of the ruined City of the World's Desire, earning him great power... and the eternal enmity of the many exiled Greeks Cainites. Nominally a follower of the Cainite Heresy like his sire was, Alfonzo is first and foremost a callous pragmatist, and has already sworn allegiance to the Sea of Shadows to secure his power, despite their opposing views on his faith. Many more deals with the devil might be needed in the future though...\n\n#bold You worked tirelessly to secure the greatest prize. No one will take Constantinople from you.#!"
 bookmark_warofprinces_suleiman:0 "苏莱曼·伊本·阿卜杜拉"
 bookmark_warofprinces_suleiman_desc:0 "Suleiman first approached Muhammad in Medina in order to make him a pawn to use against the powerful Cainites of Mecca. He himself retold that in this moment, he saw the possibility of salvation within him and submitted to the new religion the Prophet spread. Later, he stood by his side during his conquests and was one of the main founders of the Ashirra sect, welcoming any Muslim embraced and willing to continue following the word. His work has been mostly successful so far, with the Ashirra spreading from Iberia to Persia but cracks are beginning to form in their apparent unity. Suleiman must act quickly before this early disunity weakens his life work to a dangerous level.\n\n#bold Keep the Ashirra strong and united, and perhaps clan Lasombra itself might learn the truth one night.#!"
 toreador_sub_bookmark:0 "妥芮朵"
 bm_1230_warofprinces_sub_toreador:0 "妥芮朵氏族"
 bm_1230_warofprinces_sub_toreador_desc:0 "妥芮朵是以最美丽、最色情、最诱人、最感性和最有魅力的吸血鬼氏族而闻名。美学家们负责创造吸血鬼的传说，他们用美貌、爱情和肉欲来诱惑和引诱他们的猎物。\n他们也不避讳统治的艺术，直到最近，他们还在可以说在最伟大的吸血鬼帝国，君士坦丁堡的幻梦中掌握着权力。它的衰落动摇了这个氏族，但对法兰西的一次适时的接管意味着妥芮朵有了一个新的，不过还是很脆弱的驻点。除了法兰西，妥芮朵在整个欧洲和中东都拥有较小的权力地位，并且仍然是该隐之子世界的主要推动力量之一。\n\n#bold 黑夜需要一位新的、优雅但致命的统治者。让世界知道玫瑰也有刺。#!"
 bookmark_warofprinces_salianna:0 "萨利安娜"
 bookmark_warofprinces_salianna_desc:0 "Born in Greece around 170 BC, Salianna was a vestal of the ancient Gods and never forgave her sire, the powerful Michael, for his spiritual defilement of her purity. Refusing to help him in his mad dreams of immortality, she struck out on her own but only knew betrayal and deception for several centuries before settling in Paris. She finally found success here, and worked to make France prosper alongside Alexander, its vampiric overlord.\nAnd then she was betrayed again, as Alexander killed her own beloved childe in a fit of rage. It was the final straw. She orchestrated a coup d'etat with the help of Alexander's own childe and drove the Ventrue out of France. Now Salianna is the true power in the region, but her hold is still weak... and Alexander isn't dead.\n\n#bold Consolidate your new power quickly. No one will be able to betray you ever again.#!"
 bookmark_warofprinces_isouda:0 "伊思妲·德·布莱斯"
 bookmark_warofprinces_isouda_desc:0 "Isouda never liked the destiny laid out for her as a daughter of the minor nobility. She hated it so much that she ferociously bit one potential suitor to make sure he understood her point. Isouda didn't change much once becoming a Cainite, her grace and beauty barely hiding an almost feral aggressiveness and cruelty... that allowed her to secure power as a Queen of Love way earlier that her young age should allow. But it's far too small of an ambition for Isouda, and she intends to use Salianna's shaky hold on France to further her own ends. The Queen of Anjou is not a Rose with thorns, she is a Rose with sharpened teethes.\n\n#bold On the outside you are beautiful, graceful, even pleasant. On the inside... you know that they are all pawns to be used and discarded at your leisure. Your bloody ascension is merely starting.#!"
 bookmark_warofprinces_melinda:0 "梅琳达·加尔布雷思"
 bookmark_warofprinces_melinda_desc:0 "Melinda's past is shrouded in mystery with the only thing known for sure being that she was born in Spain before being abducted by Helena. Even for the Methuselah's usually callous Embrace methods, Melinda's one was a sordid and cruel affair before Helena grew bored and left her alone to fend for herself. The Melinda who emerged from the crucible of Helena's 'care' was a ruthless survivor, with no regards for anything but her own ambitions. A true predator is now unleashed in Iberia, and if she has to leave a pile of corpses behind her to ascend, so be it.\n\n#bold You have learned a lot from Helena and you know the truth : this world is a bloody battlefield where only a few can thrive. You will be one of those.#!"
 bookmark_warofprinces_rafael:0 "拉斐尔·德·柯拉蓉"
 bookmark_warofprinces_rafael_desc:0 "Taken by the Church at a young age, Rafael quickly found his talent for petty intrigues. Not very skilled or zealous, he nonetheless used his schemes to gain some influence over the local monks and live a comfortable life. Then one night, Callisti y Castillo came. This pagan witch became enamored with one of the monks' sculpture... one that Rafael took credit for. She thus Embraced him and asked him to make some more of this art, something that the con man was obviously incapable of doing. Angered, she nearly killed him on the spot until Rafael begged for his unlife by saying that his deception was a form of art after all. Amused, Callisti relented, and left him to fend for himself in the Cainite world.\n\n#bold You have no idea how in the hell you survived, but you did. Now you need to understand this strange new world. Perhaps there are other fools to deceive to learn more?#!"
 bookmark_warofprinces_karl:0 "青之卡尔"
 bookmark_warofprinces_karl_desc:0 "As a Norse tale-teller, Karl traveled south with Bjorn Ironside in search of riches and adventure and was Embraced in Alexandria by a disbelieving Toreador. After a time with his sire learning the stories of the Arabs, Karl made his way home, using his endless existence to catalog all the stories of the Norse tradition. When the Christian came, Karl fought hard, but soon saw the writing on the wall. As such, he moved to Finland to create the 'Free State', a last bastion where his beloved stories are kept alive... but even in this remote land, the shadow of the Cross is growing.\n\n#bold You fight for a greater cause than yourself, and you will defend your people's legacy as long as you are able. But you know how most Norse stories end...#!"
 bookmark_warofprinces_rosamund:0 "伊斯灵顿的罗萨蒙"
 bookmark_warofprinces_rosamund_desc:0 "Rosamund has been groomed for greatness since her birth as a daughter of a minor Norman noble. Chosen at a young age to join Isouda de Blaise's court, Rosamund thrived in it. She learned to appear both modest and coquettish, to spar with her wit, and charm with her smile. On her seventeenth birthday, she was called into Isouda's presence and congratulated. Then her mistress told her of her destiny: to be initiated into the ranks of the Cainites. Since then, Rosamund has enamored Alexander himself, the powerful Ventrue ruler of the Grand Court, and he took her with him on his exile to Magdeburg. The oppressive Methuselah is growing more and more unhinged by the night, and Rosamund is looking for any escape that she can find...\n\n#bold You must free yourself of Alexander before it's too late. Perhaps the dashing lord of Magdeburg, Jurgen von Verden, might help?#!"
 brujah_sub_bookmark:0 "布鲁赫"
 bm_1230_warofprinces_sub_brujah:0 "布鲁赫氏族"
 bm_1230_warofprinces_sub_brujah_desc:0 "A clan of warrior-scholars noted for their fierce devotion to radical philosophies, the Brujah will often train their neonates in combat and the classics with equal discipline. During the Classical era, they were the equal of the Ventrue, holding great positions of power across the Mediterranean. Then, their utopia of Carthage was destroyed at the hands of the hated Roman. Now the clan is a fallen one, still mourning the death of their paradise and decaying from their era of benevolent rulers to the petty rebels more and more common tonight.\nOverwhelmed by their anger and sorrow, the Brujah are lashing on lost causes until they can finally find their new destiny. Some elders worry that it might never happen.\n\n#bold Clan Brujah is in transition between its glorious past and an unknown future. Great leaders such as you might be the spark that will define who they are for centuries to come.#!"
 bookmark_warofprinces_bjorn:0 "比约恩·加里森"
 bookmark_warofprinces_bjorn_desc:0 "This fearsome giant is one of the last Einherjar - Vikings vampires - of the British Isles. Stranded in Scotland while fleeing from the losing battle that his people wage in Norway, Bjorn is looking ever more west to the Vinland of legends. But his charisma and quiet strength have made him the de facto rally point of the resistance against Mithras in the country. Despite his unwillingness of fighting yet another lost battle, Bjorn never give up on his friends and will as such pick up his axe for them once more.\n\n#bold You are accustomed to desperate battles. But maybe there is hope for this one...#!"
 bookmark_warofprinces_leeland:0 "罗宾·李兰德"
 bookmark_warofprinces_leeland_desc:0 "The man behind the hood has fought against tyrants his whole life and unlife. His hard and dirty features were present in several plebeian uprisings throughout the Middle Ages – taking a direct hand in various peasant uprisings against English nobility, being a particularly strong advocate of the anarchistic tendencies, often fighting at the forefront during military skirmishes.\nBut try as he might, he never could beat Mithras, the 'God-King' of England. Soundly defeated at the battle of Kirklees Abbey, Robin's aura and influence have weakened considerably and Mithras is closing in for the kill. The light of freedom might soon die for good in the British Isles.\n\n#bold Your cause is just, your aim is true. It might not suffice for victory, but it will for creating a legend.#!"
 bookmark_warofprinces_veronique:0 "维罗妮克·德·奥尔良"
 bookmark_warofprinces_veronique_desc:0 "Veronique d'Orleans is a woman of many skills. She is a capable politician among the Cainites of France (and even beyond), a staunch defender of her mortals friends and allies, a strong warrior, a skilled healer and a player, even at her extremely young age, in the War of Princes.\nSired because of her level-heidedness and innovative mind, Veronique is always pushing against what the society, be it mortal or vampiric, think of her. She has recently played a part in the overthrow of Alexander, the Prince of France, but is wary of the cutthroat Parisian politics. As such, she is back in her hometown while French Cainites wonder what her next unexpected move will be.\n\n#bold Stay true to your ideals and let others underestimate you. They will soon understand that compassion isn't weakness.#!"
 bookmark_warofprinces_menele:0 "墨涅拉俄斯"
 bookmark_warofprinces_menele_desc:0 "A king in ancient Greece during the 13th century BCE during his life, Menele was amazed by what the Cainites of Carthage had accomplished and soon fell into the role of traveling diplomat due to his reputation as a mighty warrior and orator. He was therefore not in the city by the time the great betrayal came, at the hands of a beautiful Toreador named Helena.\nTheir legendary rivalry started this day. They have fought over countless battlefields and destroyed cities in their wake but still, neither of them was able to gain the upper hand. Menele is getting weary of this 'game', especially as he sees clan Brujah falling apart all around him. A conclusion, whatever it might be, must be reached.\n\n#bold Your anger is finally dying down, but Helena must still be brought to justice. Then, it might be time to heal clan Brujah.#!"
 bookmark_warofprinces_ecaterina:0 "伊卡捷琳娜"
 bookmark_warofprinces_ecaterina_desc:0 "A strong headed woman in a world of men, Ecaterina barely survived a near rape experience, rescued by her future sire at the last moment. Engrossed by his stories about Carthage and the utopia of a peaceful coexistence between everyone, she became a fervent Promethean. Too young to be really influential, she soon crafted a fake identity for herself as a survivor of Carthage's destruction, earning her great respect and fame.\nHer most recent move has been the embrace of a very promising prospect, Christof Romuald, who has already gone above and beyond for her approval. His recent disappearance after an apocalyptic fight against a powerful Tzimisce has put a dent in her plans.\n\n#bold Find Christof and ensure his continued support, then your cause would be that much closer to completion.#!"
 bookmark_warofprinces_yitzhak:0 "以撒·本·亚伯拉罕"
 bookmark_warofprinces_yitzhak_desc:0 "Born in Prague as the only son of a Jewish Rabbi, Yitzhak's first response to most events is one of sympathy and caring, a fact that was the catalyst for his Embrace, his sire thinking that such kindness had to be preserved. Despite the shock warranted by his now cursed state, Yitzhak's death changed little in his behavior and after some years of wanderlust across Europe, he came back to his native Poland.\nDuring his travels, he saw how the Jews were treated around Europe and how many vampires wandered the nights alone, ostracized from others by simple allegiance to their clan or generation. His spiritual duty is to create a place where all beings could exist side-by-side, as God had meant them to be.\n\n#bold Poland could be the safe haven you always dreamed of. But many obstacles are still in your way.#!"
 bookmark_warofprinces_hektor:0 "赫克托"
 bookmark_warofprinces_hektor_desc:0 "Sired during the fall of Western Rome and the rise of the Byzantine state, Hektor spent his nights as a neonate listening to tales of Greek and Carthaginian glory. Frustrated with his sire and his peers lack of willingness to actually do something about the decline of the clan, Hektor cast about angrily for something he could seize on to give meaning to his existence.\nGathering a group of dissected young Cainites, Hektor successfully organized a rebellion in the empire, seizing many of the Aegean Islands to create his new Carthage. He now serves as Dictator of this new state, a strange construct of mixed Greek democratic ideals and Carthaginian's politics and religion.\n\n#bold Your utopia is still very young, and the decisions you must soon take will forge its true identity.#!"
 cappadocian_sub_bookmark:0 "卡帕多西亚"
 bm_1230_warofprinces_sub_cappadocian:0 "卡帕多西亚氏族"
 bm_1230_warofprinces_sub_cappadocian_desc:0 "Scholars of death and the soul, the Cappadocian and often focused on those while ignoring the larger affairs of the world. Blessed with a generally placid nature, they are much less concerned about rulership, political backstabbing and the other niceties of undead life.\nUntil recently, clan Cappadocian was only in a position of power in their namesake region outside of some exceptions. This fact has changed with the introduction of the ambitious Venetian Giovanni family into the blood. The Italian necromancers have in very little time used their considerable mercantile influence to become important powerplayers all around the Mediterranean.\n\n#bold With the arrival of the Giovanni, clan Cappadocian seems poised to suffer, or benefit, from important structural changes. Take care to not be swiped away by those...#!"
 bookmark_warofprinces_japhet:0 "雅弗"
 bookmark_warofprinces_japhet_desc:0 "The informal leader of clan Cappadocian, Japhet is unconditionally loyal to his sire, Cappadocius himself. From his domain in the Erciyes, Japhet's authority is strong but the reclusive tendencies of most of his brethren limit his practical power over the clan. Worse, he has to compose with his eccentric and often deluded sire and his visions of grandeur who often clashes with Japhet's much more pragmatic outlook.\nHe still hasn't forgiven the introduction of the Giovanni family into the blood, despite all the clear signs that it would be a bad idea. More and more, the faithful son thinks that his own 'father' might be the greatest obstacle to clan Cappadocian's prosperity.\n\n#bold You must lead your clan in these difficult times and try to mitigate your sire's fits of delusion. An ungrateful task, but one only you can achieve.#!"
 bookmark_warofprinces_bela:0 "贝拉·拉森科"
 bookmark_warofprinces_bela_desc:0 "Well educated in theology during his mortal life, Bela never truly cared for matters of faith. His Embrace by a fervently penitent vampire did little to change that fact and Bela instantly reveled in the glory of his immortality. He found his true calling when the mad prophet, Octavio, told him of the greatness of the entity named Kupala.\nSuddenly consumed by his new goal of becoming the avatar of this dark creature, Bela managed to claim Sofia as his own, his first step towards his own apotheosis. To the outside eye, Rusenko is an eccentric but pleasant Prince. To the knowledgeable, he is one of the greatest threats to the stability of Eastern Europe.\n\n#bold You choose Kupala, and Kupala will choose you. Even if you have to sacrifice entire cities to make it listen.#!"
 bookmark_warofprinces_apacia:0 "阿帕西亚"
 bookmark_warofprinces_apacia_desc:0 "A Scythian in life, Apacia was trained as a warrior and became the guardian of the tombs of the ancient kings, a position of great honor. One of the tombs was the haven of a Cappadocian though and she was soon Embraced to continue her duty for eternity.\nEventually, her talent came to be noticed by Cappadocius himself, who made her his general in the attack against the mountain keep that would later become Erciyes. Before long, however, the denizens came to resent Apacia's disinterest in their studies and philosophies. Indeed, many of them considered her an embarrassment to the clan's blood, as she remained stubbornly illiterate. Eventually, she was asked to leave.\n\n#bold You reached Russia and are revered as a Queen in the frigid Khanate of Sibir. These people, so close to your beloved Scythia in spirit, won your heart and you will do your best to protect them.#!"
 bookmark_warofprinces_augustus:0 "奥古斯都·乔凡尼"
 bookmark_warofprinces_augustus_desc:0 "The leader of the newly Embraced Venetian Giovanni family is a ruthless necromancer descending from a long line of Roman sorcerers. While a very competent necromancer himself, Augustus is better known as the family Patriarch, a role that has earned him the honor of being Embraced by Cappadocius himself.\nThis fact had made him very few friends among his new clan, most considering him as an upstart ready to betray them at a moment notice. Now immortal, Augustus has strengthened his hold on his lineage, turning them into a well disciplined army ready to do his bidding. What his bidding is exactly is anyone's guess...\n\n#bold Your family's reach is growing fast, helped by Venice's growth. Soon, the usefulness of your benefactor clan will run its course...#!"
 bookmark_warofprinces_ambrogino:0 "安布罗吉奥·乔凡尼"
 bookmark_warofprinces_ambrogino_desc:0 "Born a bastard to the Giovanni family, Ambrogino gained the notice of the family elders through his necromantic mastery combined with his viciousness and sheer ambition. When Clan Cappadocian began Embracing members of the family, he was one of the few chosen for the Kiss. As such, he is one of the very few Giovanni Cainites whose blood descends from Cappadocius and not Augustus Giovanni.\nWhile he is often considered to be Augustus' right hand, Ambrogino's true passion lies with the occult. His interest in godhood has led him to locate and decipher countless ancient texts and prophecies, but so far the truth has eluded him.\n\n#bold The key to godhood must be here somewhere, and you can't stop until you find it.#!"
 bookmark_warofprinces_claudius:0 "克劳狄乌斯·乔凡尼"
 bookmark_warofprinces_claudius_desc:0 "Both the son and the childe of Augustus Giovanni, Claudius was Embraced a short time after his father was accepted into the Clan of Death. A competent necromancer, he is also a capable politician and is often considered as Augustus' right hand... when this title isn't given to Ambrogino Giovanni instead, a fact that has created quite some tension between the two.\nClaudius is one of the few privy of Augustus' true plans and has shown nothing but unwavering devotion to his father so far. His current task is the supervision of the growing Venetian holdings in the fallen Byzantine Empire, making sure that the family emerges on top of this power vacuum.\n\n#bold Be diligent in your new duties, and perhaps you can finally get rid of that annoying Ambrogino once and for all.#!"
 bookmark_warofprinces_markus:0 "马库斯·穆萨·乔凡尼"
 bookmark_warofprinces_markus_desc:0 "Markus Musa Giovanni, Claudius youngest great-grandchilde, was inducted into the clan for his acute sense of curiosity and keen intellect. Once Embraced, he proved to be an exceptional scholar, and above all else an excellent historian. He took pride in his lineage as a Cappadocian and sought to prove the worth of his family to the skeptics in the Clan.\nAfter his first assignment in Constantinople, Markus had a run in with the powerful exile Lazarus and managed to escape from it while gathering some critical information. These early successes have made him the rising star of the family and his new mission might elevate him even further.\n\n#bold You are both a Giovanni and a Cappadocian and your two families are prideful of counting you as one of their members. What could go wrong?#!"
 tzimisce_sub_bookmark:0 "棘秘魑"
 bm_1230_warofprinces_sub_tzimisce:0 "棘秘魑氏族"
 bm_1230_warofprinces_sub_tzimisce_desc:0 "If someone were to call a Tzimisce inhuman and sadistic, the Tzimisce would probably commend them for their perspicacity, and then demonstrate that their mortal definition of sadism was laughably inadequate. A clan of tradition and history, they have been the masters of Eastern Europe for as long as anyone can remember.\nFrom their home in Transylvania, they rule their petty fiefs openly, uncaring about the pitiful cattle's opinion or well being. Recent setbacks against the hated Ventrue and Tremere have forced them to unify under a greater Voivodate. But this newfound cohesion is shaky, as there is no honor among monsters.\n\n#bold Utter domination is clan Tzimisce's birthright, and everyone else should understand their place : crawling at your feet and begging for your mercy. Not that you have any left...#!"
 bookmark_warofprinces_myka:0 "迈卡·维科斯"
 bookmark_warofprinces_myka_desc:0 "A scholar, a hedonist, a ruthless schemer... Myka Vykos is all those things and more. Once groomed by the Tremere magi, Myka became a valued Obertus scholar during the Dream of Constantinople's era. When the Fourth Crusade destroyed the city, he found a new faith, one of relentless passions, and a new knack for politics in his adopted home of the Balkans.\nHis first major achievement was to act as a peace maker between the Ventrue and his own clan... and securing a realm for his exiled Greek brethren as a buffer state in the process.\n\n#bold You have made many enemies with your trick during the peace deal and they won't underestimate you again. Be prepared for the reckoning to come.#!"
 bookmark_warofprinces_hedeon:0 "海德翁·雅罗斯拉维奇"
 bookmark_warofprinces_hedeon_desc:0 "Thoroughly evil and devious, Hedeon cares little about anything but his own power. He holds all human life (and Cainite unlife) as useful only in relation to service to him. The villagers near his castle are taken to serve as guinea pigs in various vile experiments. Some now function as living traps in his dungeons or as living partitions in the rooms of his fortress.\nHedeon's true influence in Poland has always been curtailed by his (rightly terrified) neighbors but the recent bout of torpor of Prince Razkoljna of Krakow has opened new opportunities...\n\n#bold You are clearly the best example of what a true Tzimisce should be. Let them fear and scream all they want as you ascend to your rightful throne...#!"
 bookmark_warofprinces_razkoljna:0 "拉兹科利纳"
 bookmark_warofprinces_razkoljna_desc:0 "Born as the daughter of a Slavic chieftain, Razkoljna's husband shared the kiss with her after his own Embrace. They soon established themselves as the true leaders of the tribe and fed on the strongest warriors and slayed any who dared to oppose them.\nWhen Christian missionaries came to Poland, it marked the beginning of their end. Her sire fell under the swords of the invaders, but Razkoljna managed to kill the rest of the attackers.\nShe soon claimed Krakow as her domain and began to encourage its growth, all the while managing to fend off the Hungarian Ventrue and her own clansmates.\n\n#bold You have recently awakened after a small period of torpor. This unforeseen setback has allowed new powers to gain influence in Poland, something that you must rectify as soon as possible.#!"
 bookmark_warofprinces_shaagra:0 "莎格拉"
 bookmark_warofprinces_shaagra_desc:0 "Fertility goddess, warleader, and shaman of the Slavic tribe known as the Vroi, Shaagra was Embraced by a Tzimisce appreciating her intelligence and determination. She conquered in his name until she felt into torpor in the 6th century.\nRecently awakened in what is now Prague, her sheer power and age has allowed her to quickly become the leading Cainite in the area once again. Still, there are new enemies to fight and a new generation of Tzimisce that doesn't know her name yet. Shaagra's new conquests are only beginning.\n\n#bold This is a strange new world for you but some things never change. Your thirst for war and domination for example...#!"
 bookmark_warofprinces_yorak:0 "沃拉克"
 bookmark_warofprinces_yorak_desc:0 "One of the first childer of the Eldest, Yorak is a a devoted koldun and Metamorphosist, seeking to further the clan's understanding of flesh crafting. His masterpiece is the Cathedral of Flesh, a harrowing church-fortress sculpted from the ﬂesh of peasants, slaves, rivals, beasts, and any number of other victims who were built into the pulsing, suppurating walls of the structure.\nEngrossed in his role as a spiritual leader of sort for the Tzimisce clan, Yorak hasn't been active in the political scene for a while but the current state of the Tzimisce, barely united and under assault, might force him to review his stance soon.\n\n#bold Everything changes and as the walls of the Cathedral scream to your liking, perhaps clan Tzimisce itself might need your 'gentle' touch once more...#!"
 bookmark_warofprinces_darvag:0 "达瓦·格罗兹尼"
 bookmark_warofprinces_darvag_desc:0 "In his lifetime, Darvag was a noble of a Slavic tribe in the modern Ukraine. He was a staunch paganist and refused viciously to convert, sworing an oath that he would personally raze the cathedral and the city to the ground, something that amused a Tzimisce Elder who Embraced him. Since then, Grozny protects the city from the ravages of all other Cainites, not out of loyalty to Kiev, but because he wants to destroy the city himself.\nDarvag is also a staunch ally of the mysterious 'Baba Yaga' of Russian fame and is dutifully making (mostly living) sacrifices in the hope of pleasing this dark goddess.\n\n#bold Kiev is yours to burn and no one else. Under the watchful eye of the Grandmother, your will see your vengeance fulfilled.#!"
 bookmark_warofprinces_noriz:0 "诺利兹"
 bookmark_warofprinces_noriz_desc:0 "Noriz was once considered Voivode among Voivodes (political leader of clan Tzimisce), but fell to decadence and dissipation, being content to subsist on the honor owed him as an elder prince of the blood and tales of his past glories. He discovered the hard way that past glories availed him little in the face of a new determined foe, Vladimir Rustovitch.\nHis goal is ascendance as the most powerful creature of the Carpathians. His rivals think him demented and dangerous, but cannot deny the brilliance of Noriz' war strategies and the complexities of his intrigues and alliances. With Rustovitch's recent setback against the Ventrue, some fear that Noriz' return to prominence is unavoidable...\n\n#bold Rustovitch stumbled. This is the moment you awaited to rise up from your decadent slumber and teach them all a lesson.#!"