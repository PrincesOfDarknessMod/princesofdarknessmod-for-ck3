 bookmark_patronwar_lvcivs_desc:0 ""
 bookmark_patronwar_seitheach:0 "赛依赫"
 bookmark_patronwar_seitheach_desc:0 ""
 bookmark_patronwar_chrysantha:0 "基桑塔"
 bookmark_patronwar_chrysantha_desc:0 ""
 bookmark_patronwar_zethraeus:0 "齐特雷"
 bookmark_patronwar_zethraeus_desc:0 ""
 bookmark_patronwar_eden:0 "伊甸"
 bookmark_patronwar_eden_desc:0 ""
 bookmark_patronwar_loukios:0 "卢基奥斯"
 bookmark_patronwar_loukios_desc:0 "一位有名望的罗马百夫长，秘密地信仰着伊西斯女神密教。在阻止罗马被哥特人部落瓦解的那些年里，当战争开始变得不可挽回时，卢基奥斯离开了。他越来越迷恋埃及神话，为了更好地了解他的女神，他去了筛沙之乡朝圣。不幸的是，他没有找到他所追寻的知识——只找到古蛇的信徒。赛特在古庙里迎接他。他对他对罗马军队的了解很感兴趣。"
 bookmark_patronwar_ciaran:0 "基厄兰"
 bookmark_patronwar_ciaran_desc:0 "基厄兰是一个爱尔兰旅行者，或者更准确地说，是一位爱尔兰流浪者（原文的字面意思为“走路的人”）。他是一个23岁的年轻人，他只是做他需要的事情来生存并支撑他的家庭。这通常意味着撒谎和欺骗，因为他没有很多其他技能。虽然有着不诚实的本性，他还是非常顾家之人，而且他把所有的爱尔兰流浪者看作是他的家庭。他几乎同样尊敬任何一个游牧民族。这就是他为一个奇怪的印度斯坦旅行者提供住所的原因，该人称自己为维斯瓦纳坦。\n\n他不知道的是，维斯瓦纳坦是一位玛土撒拉，雷伏诺[clan|E]的第五代吸血鬼，他周游世界来到了爱尔兰。随后他们的营地很快得遭到了当地人的袭击，而爱尔兰人也受了致命伤。因此维斯瓦纳坦违背了自己的原则，[Embrace|E]了基厄兰，救了他一命。他教会他矛盾之路，并警告他不要做他刚刚做过的事情。然后就走了。"
 bm_1230_inquisitor:0 "黑暗时代：裁判官"
 bm_1230_inquisitor_desc:0 "公元1230年。在一群强大的怪物猎人的带领下，神圣的教会终于意识到了吸血鬼的威胁。这些英雄组成了一个崭新的，隐秘的，名为暗影裁判所的组织，他们是第一批试图重新征服夜晚并击退恐怖之物的人类。摆在他们面前的目标是艰巨的，而这些被诅咒的吸血怪物有数个世纪的时间来巩固自己并准备反击。如果他们的牺牲会人类的美好未来铺平道路，那么所谓的“裁判官”们就会像烈士一样牺牲。他们为同一个目标而战，这是任何吸血鬼都无法比拟的。\n\n#bold 你就是这个对挽魂之战一无所知的世界的唯一希望。#!"
 bookmark_inquisitor_gauthier:0 "戈捷·德·丹皮尔"
 bookmark_inquisitor_gauthier_desc:0 "戈捷是一个小法兰西伯爵的第三子，他在很小的时候就听到了上帝的召唤，并以他唯一知道的方式回应了它：战斗。在第三次十字军东征中，他第一次遇到了一位吸血鬼，这让他看清了现实，此时他聚集了一群虔诚的骑士，他们一心要与邪恶作斗争。有证据证明他是暗影裁判所的创始人，在那里他是所有军事事务的领导者。戈捷是一名可怕的战士和富有魅力的领袖，但随着年龄的增长，他开始担心自己死后裁判所会发生什么。\n\n#bold 你的丰功伟绩已经过去了，但你仍然有时间确保亚柯骑士比你活得更久。这是你服侍上帝的一生的最后一项责任。#!"
 bookmark_inquisitor_leopold:0 "利奥波德·冯·穆尔瑙"
 bookmark_inquisitor_leopold_desc:0 "利奥波德是冯·穆尔瑙家族的一个小后裔，体弱多病，被诅咒拥有一种奇怪的能力：能够真正的“闻”到邪恶的力量。头脑敏锐的利奥波德并没有害怕它，而是利用他的天赋帮助揭露了几起发生在他家里的吸血鬼阴谋。但他并没有就此止步，他很快就来到罗马，向新成立的亚柯骑士献礼。从那时起，他就成为了暗影裁判所的主要推动力量，召集了所有试图与各种形式的邪恶作斗争的人。他的家族在他身后支持，利奥波德也许是裁判所最强的支柱，领导着所有夺回夜间的努力。\n\n#bold 穆尔瑙家族立场很坚定，且巴伐利亚已经确保，但这仅仅是战斗的开始。在最后一个吸血鬼被赶出上帝的光之前，你不能停下来。#!"
 bookmark_inquisitor_maria:0 "玛利亚·伊马库拉达"
 bookmark_inquisitor_maria_desc:0 "圣约翰修女会的现任领袖并不是该教会的创始人，但她的意志与蒙福的前任特蕾莎修女一样坚定。称她个人强大是在暗示教宗只有一点点神圣。在经历了几次经验不足的裁判官的失败后，玛利亚·伊马库拉达决定亲自前往英伦诸岛，希望能找到这个臭名昭著的吸血鬼“神王”，其可能统治着英伦诸岛。有了她坚定的信仰和裁判所其他修士会的支持，玛利亚准备教会这个敌人世上只有一个神。\n\n#bold 你确定英格兰是吸血鬼活动的中心。发现并摧毁它将是对裁判所的巨大恩惠。你将见证神王陨落。#!"
 bookmark_inquisitor_vittoria:0 "维特多利亚·圣蒂尼·迪·帕尔马"
 bookmark_inquisitor_vittoria_desc:0 "维特多利亚是一位智力超常、对上帝有强烈爱的女人，她是红修会的非正式领袖，也是暗影裁判所的研究人员。她拥有一种不可思议的直觉，知道什么时候打破规则，什么时候准确地按照传统的方式行事。因此，她显然是最重要和最危险任务的人选：清除意大利本身的吸血鬼影响，保护罗马教廷。随着维多利亚发现教会间越来越多超自然腐化，她发现任务将比预想的更加复杂……\n\n#bold 你决心拯救教会，而最好的方法就是揭露和消灭意大利的吸血鬼。你已经确定了两个主要目标，一个是米兰所谓的枢机主教，另一个是在罗马嘲笑教皇的憎恶之物……#!"
 bookmark_inquisitor_aignen:0 "善书者艾格嫩"
 bookmark_inquisitor_aignen_desc:0 "欧西坦间谍首领是神目的首领，该修士会是裁判所的眼与耳。艾格嫩曾是罗德里格·德·纳瓦拉的中尉，并当该朋友拒绝加入暗影裁判所时而与其决裂。艾格嫩哀悼他失去的友谊，但他知道罗马教廷将需要一个足智多谋的间谍的强大力量。前盟友对他不屑一顾，新盟友仍对他不信任，艾格嫩走着有所用处和被视异端之间的孤独道路。\n\n#bold 法兰西是你的家，你知道这里孕育了吸血鬼力量。清洁派异端证明了这一切。与你能聚集的少数朋友，你必须采取行动来控制局势，并希望证明你对暗影裁判所有用。#!"
 bookmark_inquisitor_rodrigue:0 "罗德里格·德·纳瓦拉"
 bookmark_inquisitor_rodrigue_desc:0 "罗德里格是第一位接触到不死族的基督徒，他活了下来，然后选择拿起武器与之对抗。他是纳瓦拉的一个小贵族，正是在清洁派异端期间，他目睹了世界上真正的邪恶。从那时起，罗德里格就一直在疯狂地试图摧毁任何被认为的吸血鬼衍生物……在他偏执的头脑里，这几乎是每个人。因此，他拒绝加入暗影裁判所，并按照自己的方式行动，与圣雅各伯之剑受其支配。\n\n#bold 他们到处都是。暗影裁判所可能是盟友，但你不能冒险。如果他们想帮忙，那很好，但你要用你自己的方式和条件来拯救伊比利亚。#!"
 bookmark_inquisitor_bayezid:0 "巴耶齐德·甘滕宾"
 bookmark_inquisitor_bayezid_desc:0 "曾是是卡洛梅娜选民劣族[cainite|E]斯坦尼斯拉夫的血仆奴隶，巴耶齐德和他的兄弟巴西尔发现他们的鲍格米勒信仰受到了不死族利益的侵蚀。1204年，斯坦尼斯拉夫在米迦勒的幻梦的破灭之中被毁灭，甘滕宾兄弟也从他们的血缚中被解放。从那时起，他们就称自己为“卡洛梅娜的被遗忘者”，并带领着鲍格米勒的信徒在波斯尼亚各地攻击吸血鬼。\n\n#bold 卡洛梅娜，该隐的孪生姐妹，期望该隐的不死族子嗣被毁灭！#!"
 BOOKMARK_CHARACTER_DIFFICULTY_VERY_HARD:2 "#difficulty_hard 极难#!"
 bookmark_patronwar_jose:0 "何塞"
 bookmark_patronwar_jose_desc:0 ""
 bookmark_patronwar_hannibal:0 "汉尼拔"
 bookmark_patronwar_hannibal_desc:0 ""
 bookmark_patronwar_antariksha:0 "安塔裡克施·钱德拉"
 bookmark_patronwar_antariksha_desc:0 ""
 bookmark_patronwar_rostislav:0 "罗斯季斯拉夫"
 bookmark_patronwar_rostislav_desc:0 ""
 bookmark_warofprinces_hardestadt:0 "哈德施塔特"
 bookmark_warofprinces_hardestadt_desc:0 "哈德施塔特是第一位新生代梵卓亲王，比那些古罗马时代的长者更适应中世纪，来自于一个岌岌无名、毫无价值的世系。这位巴伐利亚军阀利用凡人的神圣罗马帝国将梵卓氏族的中心从罗马转移到了德意志，在这个过程中他巩固了自己在同族中的掌控。\n哈德施塔特在掌权后极少遇到阻碍，但是一些问题依然存在，例如茱莉亚·安塔西亚治下的顽固的罗马人……\n\n#bold 你有一个强大的领地以及由你支配的子嗣和盟友，抛弃罗马的过往包袱，你将在即将到来的数个世纪定义何为梵卓。#!"
 bookmark_warofprinces_antasia:0 "茱莉亚·安塔西亚"
 bookmark_warofprinces_antasia_desc:0 "罗马共和国的女儿是另一个时代的梵卓，那时她的[clan|E]是永恒元老院的守护者，是[cainites|E]的无情世界中的乌托邦。那是茱莉亚的完美世界，每位梵卓都有着话语权，而投票权也不分年龄和性别。元老院的法律能成为[clan|E]未来千年的戒律……随后，卡米拉和他的堕落疯狂来了，紧随其后的是哈德施塔特和他无情的野心。\n于她的法兰克福亲王领，茱莉亚并没有失去将她的[clan|E]带回其根源的希望。理想主义可能仍然是梵卓[clan|E]的未来之路。\n\n#bold 你不能让哈德施塔特，或者更糟的卡米拉，支配梵卓[clan|E]的未来。你必须为元老院与共和国而战！#!"
 bookmark_warofprinces_jurgen:0 "约根·冯·费尔登"
 bookmark_warofprinces_jurgen_desc:0 "这位声名显赫的德意志骑士是哈德施塔特的得力助手，尽管他年纪轻轻，但他的名字已经远近闻名。约根是马格德堡的一位严格但公正的统治者，他是完美的梵卓骑士，同时也是勇敢和无情的野心家。\n约根最近对棘秘魑军督领发动了战争，并强迫建立了一个缓冲国。但这还不够，他已经在计划下一次进攻了……只要他能摆脱亚历山大，这个累赘的流亡法兰西亲王。\n\n#bold 你的荣誉就是你的承诺，这是你的野心所遭受的唯一限制。通过火和剑，通过征服和外交，梵卓[clan|E]总有一天会在你面前低头。#!"
 bookmark_warofprinces_anna:0 "安娜·科穆宁"
 bookmark_warofprinces_anna_desc:0 "作为拜占庭公主，安娜·科穆宁在凡生中被剥夺了她与生俱来的权利……在她亡生又被剥夺了第二次。当她于不死族的君士坦丁堡的权力结构中努力工作时，第四次十字军东征发生了，打破了世界渴望之城的任何理智表象。但安娜是个耐心细致的谋划者，她成功地确保拜占庭继承者王国中最强大的尼西亚成为她的领地。她对君士坦丁堡过去的梦想和乌托邦毫不在意，这使她与许多其他希腊幸存者产生了隔阂，但她不会让这些阻碍她取得战果。不再会了。\n\n#bold 君士坦丁堡终于在望了。不要让任何人挡在你的天命前，它最终将属于你。#!"
 bookmark_warofprinces_anadja:0 "阿娜佳"
 bookmark_warofprinces_anadja_desc:0 "作为一个波斯商人的女儿，阿娜佳注定要过着平淡无奇的生活，直到受人尊敬的贝利撒留和谢巴赫看上了她，把她当作自己的孩子抚养。有了这样令人印象深刻的导师们，阿娜佳很快就适应了[cainite|E]的世界，并很快被一个秘密的密教组织注意到，认为她是他们应许的救主。\n从那时起，阿娜佳已经成为亚美尼亚最有影响力的吸血鬼，并且仍然在接受她的“父母”和密教组织的指导。她现在已经长大到可以独立统治了，只有时间能证明她是否能达到对她的崇高期望。\n\n#bold 你已经为这一时刻做了专业的准备。是时候写下你自己的故事了，该结局只能由你来讲述。#!"
 exit_char_window:0 "返回"
 bm_1230_warofprinces_sub_ventrue:0 "梵卓氏族"
 bm_1230_warofprinces_sub_ventrue_desc:0 "自称是该隐之子世界的统治者，梵卓是黑夜的高贵的领主和女士。长期以来，他们一直是最自豪的吸血鬼世系之一，努力维持着荣誉、优雅的行为和领导的声誉。长期以来，贵族责任感充斥着这个家族，并伴随着一种真诚的信念，即梵卓知道什么对每个人都是最好的。\n最近一连串的挫折困扰着这些蓝血者，罗马的沦陷，以及法兰西——他们的据点之一——的丢失。尽管如此，梵卓氏族仍然统治着中世纪的夜晚。如它本该是。\n\n#bold 梵卓氏族的霸权是不可妥协的。教他们晓得。#!"
 main_sub_bookmark:0 "主要"
 ventrue_sub_bookmark:0 "梵卓"
 lasombra_sub_bookmark:0 "勒森魃"
 bm_1230_warofprinces_sub_lasombra:0 "勒森魃氏族"
 bm_1230_warofprinces_sub_lasombra_desc:0 "阴暗的掠夺者和无情的社会攀附者，勒森魃为个人的成功而存在，为个人的胜利而争斗，而不是仅仅为了戴上皇冠或坐上王座。他们相信强权即正义，并愿意牺牲一切来实现他们的目标。\n作为一个将精神信仰作为工具而不是寻求开明启蒙的氏族，他们善变的忠诚目前被困扰着暗影之海的大规模内战所凸显，他们那曾经横跨地中海的帝国。穆斯林在伊比利亚与基督徒作战，基督徒在意大利与异教徒作战，年轻人同时在各地与他们的长者作战。当勒森魃自相残杀时，其他氏族都松了一口气，他们知道若他们统一起来，他们能取得怎么样的成就。\n\n#bold 勒森魃氏族将于同族的血液中被重新铸造。溅血，并征服。#!"
 bookmark_warofprinces_lucita:0 "露西塔·德·阿拉贡"
 bookmark_warofprinces_lucita_desc:0 "作为阿拉贡国王阿方索二世的女儿，露西塔从小就渴望着独立和自由。她强烈的自立性和不屈不挠的意志让勒森魃红衣主教安布罗西奥·路易斯·蒙卡达无比欣赏并初拥了她。从那时起，露西塔就成了勒森魃[clan|E]的新星和她[Sire|E]的骄傲。尽管她已经获得了赞扬和许多成就，这位凶猛的公主已经又再一次渴望着，更多，更多的自由……这违背了她[Sire|E]和[clan|E]对她的期望。  \n\n#bold 没人能把你关入笼中太久，露西塔。争取你的独立，即使你要为此激怒你的整个[clan|E]。#!"
 bookmark_warofprinces_moncada:0 "安布罗西奥·路易斯·蒙卡达"
 bookmark_warofprinces_moncada_desc:0 "A man of ambition, talent, and faith, Ambrosio Luis Moncada was the Archbishop of Madrid in life. To no one's amazement, Monçada made the most of his position. To the surprise of many, however, he did so while holding himself to a strict monasticism. He was absolute in his faith, unshakable in his conviction, and resolute in his use of power for what he considered to be Heaven's causes. The [Embrace|E] changed Monçada less than one might suppose. He quickly became the main driving force behind the Shadow Reconquista and his influence inside [clan|E] Lasombra is rising steadily, but his reasons for seeking power have not changed. It is not for the glory of Monçada (that poor fleshly shell), but rather for the glory of God.\n\n#bold You are destined to rule over Iberia and [clan|E] Lasombra itself. God choose you for his holy task and you will comply with His will, as you always do.#!"
 bookmark_warofprinces_badr:0 "拜德尔"
 bookmark_warofprinces_badr_desc:0 "As the Iberian Lasombra civil war rages on, the Andalusian [cainites|E], known as Ashirra, have found a new leader : Badr of Granada. This mysterious Sultan has taken an unyielding stance and is rallying the disparate Taifas to her cause. Her effort has divided the Ashirra community, as many see her as not much better than the Christians, but has still managed to slow down the dreaded Reconquista. As her fame grows, some are starting to be interested in the mysteries surrounding her... and a few of those inquisitive souls have already met a painful end. Badr rules with a shadowy iron fist, but an iron fist all the same.\n\n#bold You must triumph against the Reconquista. This is a springboard for your ambition, and woe to those who stand in your way.#!"
 bookmark_warofprinces_lucius:0 "卢修斯·埃利乌斯·塞扬努斯"
 bookmark_warofprinces_lucius_desc:0 "卢修斯·埃利乌斯·塞扬努斯曾经是罗马禁卫军的一员，差点儿就成为了皇帝，但在他实现自己野心之前生命就截然而止。在台伯河岸边，据说是母狼发现罗穆卢斯和雷穆斯的地方，一名勒森魃从水流中拖出了塞扬努斯的尸体。在发现生命最后的余火还在他的胸中闪烁后，这位长者初拥了他。她离开时对其说：“就像你命中注定的那样，你必将再次掌权，消灭掉那些挑衅你的领主。你有超越尊长的潜力，切记要明智的使用它。”从那时起，本该成为皇帝的他现在寻求成为黑夜的帝皇，即将在这场盛大游戏中走出第一步......\n\n#bold 天亮之前，你要运用力量去威胁你最强大的同类。确保这次你的真正命运不要再被打断！#!"
 bookmark_warofprinces_gratiano:0 "葛莱西安诺·德·维罗纳"
 bookmark_warofprinces_gratiano_desc:0 "The last, and still very young, childe of Lasombra himself, Gratiano de Veronese was an unremarkable Italian noble in life, leading to many wondering why the Antediluvian favored him so. Gratiano knows the answer though : his own inherent greatness. Convincing himself of his importance, the Veronese is now chafing openly against his 'older brother' Montano, the current regent of [clan|E] Lasombra. From his court in Verona, Gratiano is well aware that he is despised and laughed at by all but the youngest of his own [clan|E]. But even such a small and weak powerbase can grow in time and one night, Gratiano might be the one laughing at them all...\n\n#bold You must earn respect and power quickly if you are to challenge your 'brother' for his title. Then, it might be time for a talk with your 'father' himself...#!"
 bookmark_warofprinces_alfonzo:0 "威尼斯的阿方索"
 bookmark_warofprinces_alfonzo_desc:0 "威尼斯的阿方索是纳尔西斯最有天赋的孩子之一，两个多世纪以来，他一直是君士坦丁堡最杰出的[cainite|E]。众所周知，阿方索煽动了1185年的拉丁人暴动，他还利用第四次十字军东征，宣称自己是世界渴望之城的亲王，来为他赢得了巨大的权力......以及许多流亡的希腊[cainites|E]永远的敌意。名义上阿方索像他的[Sire|E]一样是该隐异端的追随者，但他更像是冷酷的实用主义者，而且他已发誓效忠暗影之海以保证自身的权力，尽管这些人对他的信仰持着反对意见。不过，未来可能还需要与魔鬼进行许多交易......\n\n#bold 你为确保最大的奖赏而不懈努力。没有人可以从你手中夺走君士坦丁堡。#!"
 bookmark_warofprinces_suleiman:0 "苏莱曼·伊本·阿卜杜拉"
 bookmark_warofprinces_suleiman_desc:0 "苏莱曼首先在麦地那接触了穆罕默德，目的是让他成为对抗麦加强大的[cainites|E]的棋子。他本人复述说，在这一时刻，他看到了自身内心获得救赎的可能性，并皈依了先知传播的新宗教。随后，在先知的征服过程中，苏莱曼站在其一方，并成为了阿什拉教派的主要创始人之一，以初拥的方式来欢迎任何愿意继续追随这条道路的穆斯林。到目前为止，他的工作大部分是成功的，阿什拉派从伊比利亚扩至波斯，但他们表面上的团结开始形成裂痕。苏莱曼必须迅速采取行动，以免这种早期的分歧将他的终身事业削弱到一个危险的程度。\n\n#bold 维持阿什拉派的强大和团结，也许勒森魃[clan|E]本身可能会在某个夜晚得知真相。#!"
 toreador_sub_bookmark:0 "妥芮朵"
 bm_1230_warofprinces_sub_toreador:0 "妥芮朵氏族"
 bm_1230_warofprinces_sub_toreador_desc:0 "妥芮朵是以最美丽、最色情、最诱人、最感性和最有魅力的吸血鬼氏族而闻名。美学家们负责创造吸血鬼的传说，他们用美貌、爱情和肉欲来诱惑和引诱他们的猎物。\n他们也不避讳统治的艺术，直到最近，他们还在可以说在最伟大的吸血鬼帝国，君士坦丁堡的幻梦中掌握着权力。它的衰落动摇了这个氏族，但对法兰西的一次适时的接管意味着妥芮朵有了一个新的，不过还是很脆弱的驻点。除了法兰西，妥芮朵在整个欧洲和中东都拥有较小的权力地位，并且仍然是该隐之子世界的主要推动力量之一。\n\n#bold 黑夜需要一位新的、优雅但致命的统治者。让世界知道玫瑰也有刺。#!"
 bookmark_warofprinces_salianna:0 "萨利安娜"
 bookmark_warofprinces_salianna_desc:0 "Born in Greece around 170 BC, Salianna was a vestal of the ancient Gods and never forgave her [Sire|E], the powerful Michael, for his spiritual defilement of her purity. Refusing to help him in his mad dreams of immortality, she struck out on her own but only knew betrayal and deception for several centuries before settling in Paris. She finally found success here, and worked to make France prosper alongside Alexander, its vampiric overlord.\nAnd then she was betrayed again, as Alexander killed her own beloved childe in a fit of rage. It was the final straw. She orchestrated a coup d'etat with the help of Alexander's own childe and drove the Ventrue out of France. Now Salianna is the true power in the region, but her hold is still weak... and Alexander isn't dead.\n\n#bold Consolidate your new power quickly. No one will be able to betray you ever again.#!"
 bookmark_warofprinces_isouda:0 "伊思妲·德·布莱斯"
 bookmark_warofprinces_isouda_desc:0 "Isouda never liked the destiny laid out for her as a daughter of the minor nobility. She hated it so much that she ferociously bit one potential suitor to make sure he understood her point. Isouda didn't change much once becoming a [cainite|E], her grace and beauty barely hiding an almost feral aggressiveness and cruelty... that allowed her to secure power as a Queen of Love way earlier that her young age should allow. But it's far too small of an ambition for Isouda, and she intends to use Salianna's shaky hold on France to further her own ends. The Queen of Anjou is not a Rose with thorns, she is a Rose with sharpened teethes.\n\n#bold On the outside you are beautiful, graceful, even pleasant. On the inside... you know that they are all pawns to be used and discarded at your leisure. Your bloody ascension is merely starting.#!"
 bookmark_warofprinces_melinda:0 "梅琳达·加尔布雷思"
 bookmark_warofprinces_melinda_desc:0 "Melinda's past is shrouded in mystery with the only thing known for sure being that she was born in Spain before being abducted by Helena. Even for the Methuselah's usually callous [Embrace|E] methods, Melinda's one was a sordid and cruel affair before Helena grew bored and left her alone to fend for herself. The Melinda who emerged from the crucible of Helena's 'care' was a ruthless survivor, with no regards for anything but her own ambitions. A true predator is now unleashed in Iberia, and if she has to leave a pile of corpses behind her to ascend, so be it.\n\n#bold You have learned a lot from Helena and you know the truth : this world is a bloody battlefield where only a few can thrive. You will be one of those.#!"
 bookmark_warofprinces_rafael:0 "拉斐尔·德·柯拉蓉"
 bookmark_warofprinces_rafael_desc:0 "Taken by the Church at a young age, Rafael quickly found his talent for petty intrigues. Not very skilled or zealous, he nonetheless used his schemes to gain some influence over the local monks and live a comfortable life. Then one night, Callisti y Castillo came. This pagan witch became enamored with one of the monks' sculpture... one that Rafael took credit for. She thus Embraced him and asked him to make some more of this art, something that the con man was obviously incapable of doing. Angered, she nearly killed him on the spot until Rafael begged for his unlife by saying that his deception was a form of art after all. Amused, Callisti relented, and left him to fend for himself in the [cainite|E] world.\n\n#bold You have no idea how in the hell you survived, but you did. Now you need to understand this strange new world. Perhaps there are other fools to deceive to learn more?#!"
 bookmark_warofprinces_karl:0 "青之卡尔"
 bookmark_warofprinces_karl_desc:0 "As a Norse tale-teller, Karl traveled south with Bjorn Ironside in search of riches and adventure and was Embraced in Alexandria by a disbelieving Toreador. After a time with his [Sire|E] learning the stories of the Arabs, Karl made his way home, using his endless existence to catalog all the stories of the Norse tradition. When the Christian came, Karl fought hard, but soon saw the writing on the wall. As such, he moved to Finland to create the 'Free State', a last bastion where his beloved stories are kept alive... but even in this remote land, the shadow of the Cross is growing.\n\n#bold You fight for a greater cause than yourself, and you will defend your people's legacy as long as you are able. But you know how most Norse stories end...#!"
 bookmark_warofprinces_rosamund:0 "伊斯灵顿的罗莎蒙"
 bookmark_warofprinces_rosamund_desc:0 "罗莎蒙是一名诺曼小贵族的女儿，自出生之后就一直被培养着要做大事。罗莎蒙幼时被选进了伊思妲·德·布莱斯的宫廷，在那里面茁壮地成长。她学会了如何表现得既谦虚而又迷人，用智慧与人辩论，用微笑醉人心魂。在她十七岁生日那天，她被叫到伊思妲面前来祝贺。随后她的女主人告诉了她其命运：加入[cainites|E]的行列。从那时起，罗莎蒙就被大王庭的强大梵卓统治者亚历山大本人深深迷恋上了，并且他还在流亡马格德堡时把罗莎蒙一起带走了。这位残酷的玛土撒拉愈夜变得发疯，罗莎蒙正在寻找任何她能找到的逃跑方式……\n\n#bold 趁现在还来得及，你必须得摆脱亚历山大。也许风度翩翩的马格德堡公爵约根·冯·费尔登能帮上忙？#!"
 brujah_sub_bookmark:0 "布鲁赫"
 bm_1230_warofprinces_sub_brujah:0 "布鲁赫氏族"
 bm_1230_warofprinces_sub_brujah_desc:0 "布鲁赫是一个以对激进哲学的强烈追求而闻名的战士学者氏族，他们经常以同样的纪律来训练他们的稚子的战斗和古典学。在古典时代，他们与梵卓平起平坐，在整个地中海地区拥有巨大的权力地位。后来，他们的乌托邦迦太基被毁于可恨的罗马人之手。现在，这个氏族堕落了，仍在哀悼失乐园，并从贤明的统治者衰落到今晚越来越常见的小逆徒。\n被他们的愤怒和悲伤所淹没，布鲁赫在已失的事业上大肆抨击，直到他们最终能够找到他们的新命运。一些长者担心，这可能永远不会发生。\n\n#bold 布鲁赫氏族正处于光荣的过去和未知的未来之间的过渡期。像你这样的伟大领袖将会成为决定未来数个世纪他们本我的火花。#!"
 bookmark_warofprinces_bjorn:0 "比约恩·加里森"
 bookmark_warofprinces_bjorn_desc:0 "This fearsome giant is one of the last Einherjar - Vikings vampires - of the British Isles. Stranded in Scotland while fleeing from the losing battle that his people wage in Norway, Bjorn is looking ever more west to the Vinland of legends. But his charisma and quiet strength have made him the de facto rally point of the resistance against Mithras in the country. Despite his unwillingness of fighting yet another lost battle, Bjorn never give up on his friends and will as such pick up his axe for them once more.\n\n#bold You are accustomed to desperate battles. But maybe there is hope for this one...#!"
 bookmark_warofprinces_leeland:0 "罗宾·李兰德"
 bookmark_warofprinces_leeland_desc:0 "这个兜帽之下的男人整个一生乃至亡生都在与暴君斗争。他那坚毅而沾满灰尘的面容在跨越中世纪的几次平民起义中都有出现——他直接参与了各种反对英国贵族的农民起义，是一名无政府主义倾向特别强烈的倡导者，经常在军事冲突中奋战在最前线。\n但无论他如何努力，他都无法击败密特拉，那位英格兰的“神王”。在柯克利斯修道院之战中惨败后，罗宾的光环和影响力大大减弱，密特拉正步步逼近，准备一绝后患。 在不列颠群岛，自由之光也许很快就会永远熄灭。\n\n#bold 你的事业正义，你的目标准确。这可能不足以赢得胜利，但足以创造传奇。#!"
 bookmark_warofprinces_veronique:0 "维罗妮克·德·奥尔良"
 bookmark_warofprinces_veronique_desc:0 "Veronique d'Orleans is a woman of many skills. She is a capable politician among the [cainites|E] of France (and even beyond), a staunch defender of her mortals friends and allies, a strong warrior, a skilled healer and a player, even at her extremely young age, in the War of Princes.\nSired because of her level-heidedness and innovative mind, Veronique is always pushing against what the society, be it mortal or vampiric, think of her. She has recently played a part in the overthrow of Alexander, the Prince of France, but is wary of the cutthroat Parisian politics. As such, she is back in her hometown while French [cainites|E] wonder what her next unexpected move will be.\n\n#bold Stay true to your ideals and let others underestimate you. They will soon understand that compassion isn't weakness.#!"
 bookmark_warofprinces_menele:0 "墨涅拉俄斯"
 bookmark_warofprinces_menele_desc:0 "A king in ancient Greece during the 13th century BCE during his life, Menele was amazed by what the [cainites|E] of Carthage had accomplished and soon fell into the role of traveling diplomat due to his reputation as a mighty warrior and orator. He was therefore not in the city by the time the great betrayal came, at the hands of a beautiful Toreador named Helena.\nTheir legendary rivalry started this day. They have fought over countless battlefields and destroyed cities in their wake but still, neither of them was able to gain the upper hand. Menele is getting weary of this 'game', especially as he sees [clan|E] Brujah falling apart all around him. A conclusion, whatever it might be, must be reached.\n\n#bold Your anger is finally dying down, but Helena must still be brought to justice. Then, it might be time to heal [clan|E] Brujah.#!"
 bookmark_warofprinces_ecaterina:0 "伊卡捷琳娜"
 bookmark_warofprinces_ecaterina_desc:0 "A strong headed woman in a world of men, Ecaterina barely survived a near rape experience, rescued by her future [Sire|E] at the last moment. Engrossed by his stories about Carthage and the utopia of a peaceful coexistence between everyone, she became a fervent Promethean. Too young to be really influential, she soon crafted a fake identity for herself as a survivor of Carthage's destruction, earning her great respect and fame.\nHer most recent move has been the [Embrace|E] of a very promising prospect, Christof Romuald, who has already gone above and beyond for her approval. His recent disappearance after an apocalyptic fight against a powerful Tzimisce has put a dent in her plans.\n\n#bold Find Christof and ensure his continued support, then your cause would be that much closer to completion.#!"
 bookmark_warofprinces_yitzhak:0 "以撒·本·亚伯拉罕"
 bookmark_warofprinces_yitzhak_desc:0 "Born in Prague as the only son of a Jewish Rabbi, Yitzhak's first response to most events is one of sympathy and caring, a fact that was the catalyst for his [Embrace|E], his [Sire|E] thinking that such kindness had to be preserved. Despite the shock warranted by his now cursed state, Yitzhak's death changed little in his behavior and after some years of wanderlust across Europe, he came back to his native Poland.\nDuring his travels, he saw how the Jews were treated around Europe and how many vampires wandered the nights alone, ostracized from others by simple allegiance to their [clan|E] or generation. His spiritual duty is to create a place where all beings could exist side-by-side, as God had meant them to be.\n\n#bold Poland could be the safe haven you always dreamed of. But many obstacles are still in your way.#!"
 bookmark_warofprinces_hektor:0 "赫克托"
 bookmark_warofprinces_hektor_desc:0 "Sired during the fall of Western Rome and the rise of the Byzantine state, Hektor spent his nights as a neonate listening to tales of Greek and Carthaginian glory. Frustrated with his [Sire|E] and his peers lack of willingness to actually do something about the decline of the [clan|E], Hektor cast about angrily for something he could seize on to give meaning to his existence.\nGathering a group of dissected young [cainites|E], Hektor successfully organized a rebellion in the empire, seizing many of the Aegean Islands to create his new Carthage. He now serves as Dictator of this new state, a strange construct of mixed Greek democratic ideals and Carthaginian's politics and religion.\n\n#bold Your utopia is still very young, and the decisions you must soon take will forge its true identity.#!"
 cappadocian_sub_bookmark:0 "卡帕多西亚"
 bm_1230_warofprinces_sub_cappadocian:0 "卡帕多西亚氏族"
 bm_1230_warofprinces_sub_cappadocian_desc:0 "卡帕多西亚是研究死亡和灵魂的学者，他们经常专注于这些，而忽略了世界上更大的事务。得天独厚的是，他们一般都很平和，对统治权、政治暗杀和其他不死族生活的礼节都不太关心。\n直到最近，卡帕多西亚氏族只在他们同名的地区处有权力地位，除了一些例外。这一事实随着野心勃勃的威尼斯乔凡尼家族的加入而改变。意大利的亡灵术师们在很短的时间内就利用他们相当大的商业影响力，成为地中海各地的重要权力者。\n\n#bold 随着乔凡尼家族的到来，卡帕多西亚氏族似乎将会从重要的结构性变化中受害，或受益。注意不要被那些……所取代#!"
 bookmark_warofprinces_japhet:0 "雅弗"
 bookmark_warofprinces_japhet_desc:0 "The informal leader of [clan|E] Cappadocian, Japhet is unconditionally loyal to his [Sire|E], Cappadocius himself. From his domain in the Erciyes, Japhet's authority is strong but the reclusive tendencies of most of his brethren limit his practical power over the [clan|E]. Worse, he has to compose with his eccentric and often deluded [Sire|E] and his visions of grandeur who often clashes with Japhet's much more pragmatic outlook.\nHe still hasn't forgiven the introduction of the Giovanni family into the blood, despite all the clear signs that it would be a bad idea. More and more, the faithful son thinks that his own 'father' might be the greatest obstacle to [clan|E] Cappadocian's prosperity.\n\n#bold You must lead your [clan|E] in these difficult times and try to mitigate your [Sire|E]'s fits of delusion. An ungrateful task, but one only you can achieve.#!"
 bookmark_warofprinces_bela:0 "贝拉·拉森科"
 bookmark_warofprinces_bela_desc:0 "Well educated in theology during his mortal life, Bela never truly cared for matters of faith. His [Embrace|E] by a fervently penitent vampire did little to change that fact and Bela instantly reveled in the glory of his immortality. He found his true calling when the mad prophet, Octavio, told him of the greatness of the entity named Kupala.\nSuddenly consumed by his new goal of becoming the avatar of this dark creature, Bela managed to claim Sofia as his own, his first step towards his own apotheosis. To the outside eye, Rusenko is an eccentric but pleasant Prince. To the knowledgeable, he is one of the greatest threats to the stability of Eastern Europe.\n\n#bold You choose Kupala, and Kupala will choose you. Even if you have to sacrifice entire cities to make it listen.#!"
 bookmark_warofprinces_apacia:0 "阿帕西亚"
 bookmark_warofprinces_apacia_desc:0 "A Scythian in life, Apacia was trained as a warrior and became the guardian of the tombs of the ancient kings, a position of great honor. One of the tombs was the haven of a Cappadocian though and she was soon Embraced to continue her duty for eternity.\nEventually, her talent came to be noticed by Cappadocius himself, who made her his general in the attack against the mountain keep that would later become Erciyes. Before long, however, the denizens came to resent Apacia's disinterest in their studies and philosophies. Indeed, many of them considered her an embarrassment to the [clan|E]'s blood, as she remained stubbornly illiterate. Eventually, she was asked to leave.\n\n#bold You reached Russia and are revered as a Queen in the frigid Khanate of Sibir. These people, so close to your beloved Scythia in spirit, won your heart and you will do your best to protect them.#!"
 bookmark_warofprinces_augustus:0 "奥古斯都·乔凡尼"
 bookmark_warofprinces_augustus_desc:0 "The leader of the newly Embraced Venetian Giovanni family is a ruthless necromancer descending from a long line of Roman sorcerers. While a very competent necromancer himself, Augustus is better known as the family Patriarch, a role that has earned him the honor of being Embraced by Cappadocius himself.\nThis fact had made him very few friends among his new [clan|E], most considering him as an upstart ready to betray them at a moment notice. Now immortal, Augustus has strengthened his hold on his lineage, turning them into a well disciplined army ready to do his bidding. What his bidding is exactly is anyone's guess...\n\n#bold Your family's reach is growing fast, helped by Venice's growth. Soon, the usefulness of your benefactor [clan|E] will run its course...#!"
 bookmark_warofprinces_ambrogino:0 "安布罗吉奥·乔凡尼"
 bookmark_warofprinces_ambrogino_desc:0 "Born a bastard to the Giovanni family, Ambrogino gained the notice of the family elders through his necromantic mastery combined with his viciousness and sheer ambition. When [clan|E] Cappadocian began Embracing members of the family, he was one of the few chosen for the Kiss. As such, he is one of the very few Giovanni [cainites|E] whose blood descends from Cappadocius and not Augustus Giovanni.\nWhile he is often considered to be Augustus' right hand, Ambrogino's true passion lies with the occult. His interest in godhood has led him to locate and decipher countless ancient texts and prophecies, but so far the truth has eluded him.\n\n#bold The key to godhood must be here somewhere, and you can't stop until you find it.#!"
 bookmark_warofprinces_claudius:0 "克劳狄乌斯·乔凡尼"
 bookmark_warofprinces_claudius_desc:0 "Both the son and the childe of Augustus Giovanni, Claudius was Embraced a short time after his father was accepted into the [clan|E] of Death. A competent necromancer, he is also a capable politician and is often considered as Augustus' right hand... when this title isn't given to Ambrogino Giovanni instead, a fact that has created quite some tension between the two.\nClaudius is one of the few privy of Augustus' true plans and has shown nothing but unwavering devotion to his father so far. His current task is the supervision of the growing Venetian holdings in the fallen Byzantine Empire, making sure that the family emerges on top of this power vacuum.\n\n#bold Be diligent in your new duties, and perhaps you can finally get rid of that annoying Ambrogino once and for all.#!"
 bookmark_warofprinces_markus:0 "马库斯·穆萨·乔凡尼"
 bookmark_warofprinces_markus_desc:0 "Markus Musa Giovanni, Claudius youngest great-grandchilde, was inducted into the [clan|E] for his acute sense of curiosity and keen intellect. Once Embraced, he proved to be an exceptional scholar, and above all else an excellent historian. He took pride in his lineage as a Cappadocian and sought to prove the worth of his family to the skeptics in the [clan|E].\nAfter his first assignment in Constantinople, Markus had a run in with the powerful exile Lazarus and managed to escape from it while gathering some critical information. These early successes have made him the rising star of the family and his new mission might elevate him even further.\n\n#bold You are both a Giovanni and a Cappadocian and your two families are prideful of counting you as one of their members. What could go wrong?#!"
 tzimisce_sub_bookmark:0 "棘秘魑"
 bm_1230_warofprinces_sub_tzimisce:0 "棘秘魑氏族"
 bm_1230_warofprinces_sub_tzimisce_desc:0 "如果有人说棘秘魑没有人性还是虐待狂，棘秘魑可能会赞扬他们的敏锐，然后证明他们对虐待狂的凡人式定义是可笑的微不足道。作为一个具有诫律和历史的氏族，从人们能记录以来，他们一直都是东欧的主人。\n从他们在特兰西瓦尼亚的居所，他们公开统治他们的小领地，不在乎可怜的牲畜的意见或福祉。最近，对可恨的梵卓和睿魔尔的挫折迫使他们统一在一个更大的军督领之下。但这种新建立的凝聚力是不稳定的，因为怪物之间没有荣耻。\n\n#bold 彻底的支配是棘秘魑氏族与生俱来的权利，其他所有人都应该明白自己的位置：匍匐在你脚下，乞求你的怜悯。不是说你还有什么…….#!"
 bookmark_warofprinces_myka:0 "迈卡·维科斯"
 bookmark_warofprinces_myka_desc:0 "A scholar, a hedonist, a ruthless schemer... Myka Vykos is all those things and more. Once groomed by the Tremere magi, Myka became a valued Obertus scholar during the Dream of Constantinople's era. When the Fourth Crusade destroyed the city, he found a new faith, one of relentless passions, and a new knack for politics in his adopted home of the Balkans.\nHis first major achievement was to act as a peace maker between the Ventrue and his own [clan|E]... and securing a realm for his exiled Greek brethren as a buffer state in the process.\n\n#bold You have made many enemies with your trick during the peace deal and they won't underestimate you again. Be prepared for the reckoning to come.#!"
 bookmark_warofprinces_hedeon:0 "海德翁·雅罗斯拉维奇"
 bookmark_warofprinces_hedeon_desc:0 "Thoroughly evil and devious, Hedeon cares little about anything but his own power. He holds all human life (and [cainite|E] unlife) as useful only in relation to service to him. The villagers near his castle are taken to serve as guinea pigs in various vile experiments. Some now function as living traps in his dungeons or as living partitions in the rooms of his fortress.\nHedeon's true influence in Poland has always been curtailed by his (rightly terrified) neighbors but the recent bout of [torpor|E] of Prince Razkoljna of Krakow has opened new opportunities...\n\n#bold You are clearly the best example of what a true Tzimisce should be. Let them fear and scream all they want as you ascend to your rightful throne...#!"
 bookmark_warofprinces_razkoljna:0 "拉兹科利纳"
 bookmark_warofprinces_razkoljna_desc:0 "Born as the daughter of a Slavic chieftain, Razkoljna's husband shared the kiss with her after his own [Embrace|E]. They soon established themselves as the true leaders of the tribe and fed on the strongest warriors and slayed any who dared to oppose them.\nWhen Christian missionaries came to Poland, it marked the beginning of their end. Her [Sire|E] fell under the swords of the invaders, but Razkoljna managed to kill the rest of the attackers.\nShe soon claimed Krakow as her domain and began to encourage its growth, all the while managing to fend off the Hungarian Ventrue and her own clansmates.\n\n#bold You have recently awakened after a small period of [torpor|E]. This unforeseen setback has allowed new powers to gain influence in Poland, something that you must rectify as soon as possible.#!"
 bookmark_warofprinces_shaagra:0 "莎格拉"
 bookmark_warofprinces_shaagra_desc:0 "Fertility goddess, warleader, and shaman of the Slavic tribe known as the Vroi, Shaagra was Embraced by a Tzimisce appreciating her intelligence and determination. She conquered in his name until she felt into [torpor|E] in the 6th century.\nRecently awakened in what is now Prague, her sheer power and age has allowed her to quickly become the leading [cainite|E] in the area once again. Still, there are new enemies to fight and a new generation of Tzimisce that doesn't know her name yet. Shaagra's new conquests are only beginning.\n\n#bold This is a strange new world for you but some things never change. Your thirst for war and domination for example...#!"
 bookmark_warofprinces_yorak:0 "沃拉克"
 bookmark_warofprinces_yorak_desc:0 "One of the first childer of the Eldest, Yorak is a a devoted koldun and Metamorphosist, seeking to further the [clan|E]'s understanding of flesh crafting. His masterpiece is the Cathedral of Flesh, a harrowing church-fortress sculpted from the ﬂesh of peasants, slaves, rivals, beasts, and any number of other victims who were built into the pulsing, suppurating walls of the structure.\nEngrossed in his role as a spiritual leader of sort for the Tzimisce [clan|E], Yorak hasn't been active in the political scene for a while but the current state of the Tzimisce, barely united and under assault, might force him to review his stance soon.\n\n#bold Everything changes and as the walls of the Cathedral scream to your liking, perhaps [clan|E] Tzimisce itself might need your 'gentle' touch once more...#!"
 bookmark_warofprinces_darvag:0 "达瓦·格罗兹尼"
 bookmark_warofprinces_darvag_desc:0 "In his lifetime, Darvag was a noble of a Slavic tribe in the modern Ukraine. He was a staunch paganist and refused viciously to convert, sworing an oath that he would personally raze the cathedral and the city to the ground, something that amused a Tzimisce Elder who Embraced him. Since then, Grozny protects the city from the ravages of all other [cainites|E], not out of loyalty to Kiev, but because he wants to destroy the city himself.\nDarvag is also a staunch ally of the mysterious 'Baba Yaga' of Russian fame and is dutifully making (mostly living) sacrifices in the hope of pleasing this dark goddess.\n\n#bold Kiev is yours to burn and no one else. Under the watchful eye of the Grandmother, your will see your vengeance fulfilled.#!"
 bookmark_warofprinces_noriz:0 "诺利兹"
 bookmark_warofprinces_noriz_desc:0 "Noriz was once considered Voivode among Voivodes (political leader of [clan|E] Tzimisce), but fell to decadence and dissipation, being content to subsist on the honor owed him as an elder prince of the blood and tales of his past glories. He discovered the hard way that past glories availed him little in the face of a new determined foe, Vladimir Rustovitch.\nHis goal is ascendance as the most powerful creature of the Carpathians. His rivals think him demented and dangerous, but cannot deny the brilliance of Noriz' war strategies and the complexities of his intrigues and alliances. With Rustovitch's recent setback against the Ventrue, some fear that Noriz' return to prominence is unavoidable...\n\n#bold Rustovitch stumbled. This is the moment you awaited to rise up from your decadent slumber and teach them all a lesson.#!"
 assamite_sub_bookmark:0 "哈基姆圣裔"
 bm_1230_warofprinces_sub_assamite:0 "哈基姆圣裔氏族"
 bm_1230_warofprinces_sub_assamite_desc:0 "以中东的隐蔽堡垒鹰巢为基地，哈基姆圣裔自古就被西方该隐之子视为危险的刺客和吸榨者，但事实上他们是守护者、战士和学者，他们试图与亲王之战保持距离。\n哈基姆之嗣表面上是一个团结的氏族，实际上却因派系斗争而严重分裂。最近，一位新的、有争议的最长者的到来，使每个人都很紧张。这些问题使得新的敌人，主要是通过十字军东征，悄悄进入曾经完全在他们控制之下的中东地区。\n\n#bold 如果哈基姆圣裔能够团结起来，他们将成为一支不可阻挡的力量。他们需要一位配得上哈基姆的黑王座的人。也许那个人就是你？#!"
 bookmark_warofprinces_jamal:0 "贾迈勒"
 bookmark_warofprinces_jamal_desc:0 "Throughout the Holy Wars which are fought over the Holy Land, the name of the hashashiyyin is a name of dread. Of all the hashashiyyin, no name is greater or more terrible than that of Jamal. A devout Muslim, Jamal is the current Caliph of the Banu Haqim, the leader of their Warrior Caste.\nA cunning and effective general, Jamal is mostly known for his formidable battle prowess with his nickname of 'the Undefeated'. So far, no one has ever been able to prove it wrong.\n\n#bold You stand as leader of the Banu Haqim Warriors and the pro Muslim faction of the [clan|E]. Both are important positions and difficult responsibilities but you are a committed man. You will lead the faithful to victory, inside and outside of Alamut.#!"
 bookmark_warofprinces_dastur:0 "达斯图尔·阿诺什"
 bookmark_warofprinces_dastur_desc:0 "Dastur was born with visions, and was one of the magi who gathered around Zoroaster. He befriended his future [Sire|E], a scholar, and they both found a mysterious relic named the Weeping Stone. This miraculous discovery was not to the liking of the Banu Haqim's leadership who branded them both heretics and forced them into exile.\nUndaunted, they gathered like minded scholars and luminaries who listened to their stories of Zilah, she who was turned to stone by Caine. Calling themselves the 'Lost Tribe of Alamut', they have been forced to secrecy after a direct attack from Banu Haqim's agents that costed Dastur [Sire|E]'s life. With the current factionalism of the [clan|E] though, the Lost Tribe might be able to get its anticipated revenge.\n\n#bold You must honor your [Sire|E] by leading your Tribe to survival, if not outright victory, against the hated scions of Alamut.#!"
 bookmark_warofprinces_fatima:0 "法蒂玛·法卡迪"
 bookmark_warofprinces_fatima_desc:0 "法蒂玛出生于一个在十字军东征期间与安拉捍卫者并肩作战的穆瓦希德摩尔战士家庭。 她的热情和技巧引起了哈基姆圣裔的注意。她被带到鹰巢，奉埃及哈里发忒弥斯为尊长，并被训练成为了究极刺客。\n她的首项任务是确保第四次十字军东征永远到达不了中东海岸，这件事办得相当成功。 鹰巢现在期望她可以做出更伟大的事业，法蒂玛也打算展其锋芒。\n\n#bold 第四次十字军东征四分五裂，在内讧和贪婪中失败了，不过你的工作还没有彻底完成。处理干净它的残军，并在安纳托利亚建立一个强大的缓冲国以保护你的[clan|E]免受未来的入侵。#!"
 bookmark_warofprinces_alashrad:0 "阿什拉夫"
 bookmark_warofprinces_alashrad_desc:0 "Once a mortal mage and hunter of demons, Al-Ashrad was closely allied to Haqim himself until an incident that led to his [Embrace|E]. Since then, he has served as the Amr -head sorcerer- of the Banu Haqim, fighting in both Baali Wars and countless other battles, becoming a figure of fear and reverence in the [clan|E].\nIn the complex Haqimite political web, Al-Ashrad is a moderate figure and leads his small faction in these turbulent times. His hostility only seems reserved to Thetmes and his Web of Knives, for reasons that the master sorcerer refuses to disclose except to his most trusted friends.\n\n#bold You know the real demon at the heart of all the Banu Haqim's issues. His agents are close and must be dealt with or you will face a fate worse than destruction.#!"
 bookmark_warofprinces_nakurtum:0 "纳穆尔图姆"
 bookmark_warofprinces_nakurtum_desc:0 "作为哈基姆最年长子嗣之一的纳穆尔图姆是家系的创立者，也是位负责记录[clan|E]历史，维护氏族精神方向的历史学家。她曾被认为已经湮没于历史之中，直到在1214年她出乎意料地回到了鹰巢，在那里她转变成了最长者，成为了整个[clan|E]的领袖。\n她无所顾忌地攫取权力，蔑视大多数其他派系，并进行了彻底的改革，这使得她的朋友寥寥无几，并导致[clan|E]本就不稳定的状况雪上加霜。许多人已经在策划新的最长者的到来......\n\n#bold 你是最长者，这些小派系将要么学会向你的权威低头，要么就被抹除殆尽。只有你才配坐上黑王座！#!"
 bookmark_warofprinces_ahmed:0 "艾哈迈德·伊本·宰亚特"
 bookmark_warofprinces_ahmed_desc:0 "宰亚特的儿子艾哈迈德生前是一名穆斯林贸易商和油料批发商。艾哈迈德的信仰更多地寄托在全能的硬币上，其成为一名穆斯林更多是被教育导致的而不是自己选择的。同样对宗教无感的哈基姆圣裔在793年初拥了他，艾哈迈德带着荣誉和警惕心开始了其学徒生涯，这让所有人，包括他自己都感到惊讶。\n作为最后的考验，他必须潜入十字军的营地偷出某样东西并暗杀掉卫兵。不管他到底是发现了什么，这都彻底改变了他，让这个男人转变为了一名虔诚的基督徒。自那以后，他一直不知疲倦地努力寻找其他同样经历过启示的人，并致力为圣地带来和平。\n\n#bold 你是基督徒和穆斯林之间的桥梁，也许是这片深深分裂的土地上唯一能坚守之人。你的任务重大，但你的信念毋庸置疑。#!"
 bookmark_warofprinces_thetmes:0 "忒弥斯"
 bookmark_warofprinces_thetmes_desc:0 "As a mortal, Thetmes was a soldier in Ptolemy's army fighting against Cleopatra and her Roman allies. After their defeat, he proved himself as a fearsome gladiator and attracted the attention of the Banu Haqim, who Embraced him. A proud non believer, his ascendancy the years since caused religious fissures to open in the [clan|E].\nThetmes leads the Web of Knives, the fanatical faction of assassins and diablerists for hire that makes up the image that most outsiders have of the Banu Haqim as a whole. Truly though, he isn't just a greedy man with a hunger for blood, Thetmes has one dark and powerful master and he will make sure that everything is ready for his return...\n\n#bold The Black Shepherd sleeps still so it falls to you to prepare the Banu Haqim for his glorious return.#!"
 gangrel_sub_bookmark:0 "冈格罗"
 bm_1230_warofprinces_sub_gangrel:0 "冈格罗氏族"
 bm_1230_warofprinces_sub_gangrel_desc:0 "比起大多数城市里的表亲，游牧者与荒野的关系更密切，冈格罗也更具有心兽的兽性一面，经常被称为原始的、野蛮的甚至是粗暴的怪物。\n冈格罗氏族在该隐之子的历史上占有重要地位，是古典时代所谓的“蛮族”的主要推动力之一。不过从那时起，他们的运气就开始缩减了。城市的发展和似乎不可阻挡的基督教浪潮削弱了他们的人民，他们大多是异教徒的后代。不过，大草原仍然是未被驯服的，而且冈格罗也不是那种不经过最后一战就放弃自己在这个世界上的地位的吸血鬼。\n\n#bold 这可能是欧洲非基督徒的最后一次欢呼，但你们将使它成为值得世代歌唱的欢呼。#!"
 bookmark_warofprinces_morrow:0 "莫罗"
 bookmark_warofprinces_morrow_desc:0 "As an orphaned young girl, Morrow was cultivated as the ideal Gangrel childe – a solitary, self-sufficient vampire with superior skills. When she finally managed to track down and wound her prospective [Sire|E] in a deadly game of cat and mouse, he Embraced her.\nSince then, she garnered a reputation of a fierce warrior. This reputation helped her in the quest to gather her fellow Gangrel. She believes the only way for her [clan|E] to survive the advance of civilization is to cooperate, so she encourages the Gangrel to form packs. Her recent victory against both the Ventrue and the Tzimisce has consolidated her fame as one of the main warleader of the [clan|E].\n\n#bold You see a bright future for the united Gangrel. It is time to make this dream a reality.#!"
 bookmark_warofprinces_viktor:0 "维克多"
 bookmark_warofprinces_viktor_desc:0 "A powerful and intimidating Gangrel, Viktor has been the right hand of the terrifying Baba Yaga of Russian fame for centuries. As the only one trusted enough to know of the 'Little Grandmother's plans, he has been entrusted as her regent after her fall into [torpor|E].\nViktor is a fanatic with no tolerance for disrespect towards his mistress, but he is also known as an honorable foe, someone who enjoys a fair fight and doesn't hide his true intentions. He now has to defend her realm against the recent arrival of Christianity in Russia and the rumors of a horde of Eastern horse riders gathering in the steppes...\n\n#bold Baba Yaga is the salvation of the [cainite|E] race. You can't and won't fail her.#!"
 bookmark_warofprinces_brunhilde:0 "布伦希尔德"
 bookmark_warofprinces_brunhilde_desc:0 "Born among the people of Scandinavia, Brunhilde felt in her [Embrace|E] a rebirth and quickly formed the Valkyries who served her grandsire Odin with fervor, believing themselves to be real extensions of the Nordic myths. She fought bravely against the encroaching influence of Christianity, trying to prevent any change from the ancient ways of their people.\nThis fight has been lost however as the people of Sweden converted to Christianity. Still, while many of her brethren fell to despair or reckless action, Brunhilde hasn't lost hope yet. Even if her people are turning against her, she dreams of repelling the encroaching Christian [cainites|E] and preserving her faith.\n\n#bold Ragnarok has come and you know the ending. But it's still too early to give up. The Aesirs are watching.#!"
 bookmark_warofprinces_dunlop:0 "邓洛普"
 bookmark_warofprinces_dunlop_desc:0 "A highwayman who stole his name and title from the noble Scottish [clan|E], 'Count Dunlop' is a callous man that enjoys casual violence. Reigning as a terrifying monster even before his [Embrace|E], Dunlop raised his sons to be as murderous as he is, with the only ray of light in his life being his innocent daughter.\nHis downfall came when his greed made him attack the powerful Lord Mithras' holdings. The Ventrue's answer was swift and merciless, humbling Dunlop and killing his beloved daughter as a punishment. Dunlop was made to capitulate and vanished from Mithras' gaze and attention. But the wronged 'count' hasn't forgotten or forgiven and is plotting his rival's downfall every night.\n\n#bold Mithras took the light out of you. It is time to make him understand why Scotland still fears your name to this night...#!"
 bookmark_warofprinces_qarakh:0 "喀喇"
 bookmark_warofprinces_qarakh_desc:0 "Qarakh and his [Sire|E], Aajav, lived among the Mongols, but Qarakh was Embraced without permission, resulting in their hasty run from the Mongol [cainites|E]. Aajav was wounded during the battle, making Qarakh carry him all the way to Livonia where he made common cause with a band of beleaguered Pagan vampires trying to resist Christianity's arrival.\nOwing to his natural charisma and battle prowess, Qarakh was soon made leader of these 'Ferals of Livonia' and attracted the attention of many others Pagans looking for a triumphal last stand. While still young, Qarakh is growing more accustomed to his new role by the night and stands ready to defend his adopted homeland to his final death.\n\n#bold This might be the last stand of the Baltic Pagans, but you will make sure that the Christians will bleed for every inch of land.#!"
 bookmark_warofprinces_valborg:0 "瓦尔堡"
 bookmark_warofprinces_valborg_desc:0 "A Viking at heart, Valborg is a formidable Ulfhedinn who fights without thought for her own safety. She has accepted that the days of the Norse are past and now intends to fight for the only worthy cause left : herself.\nWith her fearsome crew and growing reputation as a ruthless mercenary, Valborg has plenty of opportunities for murder and pillage. In her own way, she is keeping a twisted version of the old Norse faith alive and is attracting more and more people to her 'cause'. Valborg doesn't really care. More followers means more Christians to be killed and more riches to be plundered. And if the old Gods are unhappy about her, they certainly aren't showing it.\n\n#bold Some think you will lead the Norse to a new age. You don't know, but you sure will have fun cleaving your way to an answer.#!"
 bookmark_warofprinces_thomas:0 "托马斯·费鲁"
 bookmark_warofprinces_thomas_desc:0 "The only son of a minor nobleman, Thomas was a sour and cruel man until he made a pilgrimage to the Holy Land. His [Embrace|E] and lucky entry into Constantinople's [cainites|E] changed him.\nTaught and cared for by some of the greatest minds of the city, Thomas blossomed into a dutiful scion of Constantinople, vowing to protect his adopted home forever. A task he failed to achieve when the 4th Crusade devastated the city and killed his mentors.\nThomas never went into exile like so many Greek [cainites|E], he still roams around his city hoping to save it. And, even if his mentors would disapprove, enact some well earned revenge on the Latins.\n\n#bold Your position is weak, and the accursed Latins well entrenched. But you can't fail the memory of the Dream and your teachers. This is your time for redemption.#!"
 malkavian_sub_bookmark:0 "末卡维"
 bm_1230_warofprinces_sub_malkavian:0 "末卡维氏族"
 bm_1230_warofprinces_sub_malkavian_desc:0 "末卡维是一个神秘的、精神极度不正常的该隐之子群体。该氏族的成员在该隐之子和血畜中扮演着预言家和神谕者的角色，他们是被奇怪的强迫症和能感知他人无法感知的才能所束缚的阴森人物。他们也是臭名昭著的恶作剧者，他们的“玩笑”可从憨傻到残酷。\n在古典时代，他们是一个重要的氏族，因其预言天赋而深受尊重。然而，时代变了，基督教对末卡维是一个重大打击，现在被大多数人认为是纯粹的疯子。被贬为下位氏族，月触者已经失去了大部分的权力和威望。\n\n#bold 比起其他氏族，每位末卡维都是独特的生物，疯狂和清醒在争夺他们的思想。哪一个会赢？#!"
 bookmark_warofprinces_tryphosa:0 "特里弗萨"
 bookmark_warofprinces_tryphosa_desc:0 "Perhaps the most influential Malkavian of the Classical Era, Tryphosa was an advisor for Camilla of Rome and a fiery advocate for Carthage's destruction. It was thanks to her constant presence and influence over the powerful Ventrue that he finally moved against what she saw as a demon infested hellhole.\nTryphosa believes that her place as an undead enables her to affect the visions of the future she witnesses, something that is mostly lost to the new generations of Malkavians. After Rome's fall, Tryphosa never left Italy, waiting for Camilla's return to once again drive him forward. That time has come.\n\n#bold Camilla is back and your guidance will surely be even more needed than before, considering this strange new world is so different from your beloved Rome.#!"
 bookmark_warofprinces_vasantasena:0 "春军"
 bookmark_warofprinces_vasantasena_desc:0 "Vasantasena was the daughter of the Tamil emperor Rajaraja the Great, cursed by a vampire chamberlain to slowly waste away. A wandering Malkavian offered her a solution which she bravely accepted, revealing the chamberlain's treachery to her father nearly at the cost of her life. Brought into undeath by her savior, she started traveling the world.\nShe preaches against the Blood Bond, rejects lordship over mortals, the traditional vampiric hierarchy and all loss of free will. She wields her zeal and charm like a knife, and her reputation is quickly growing.\n\n#bold You are the voice of the downtrodden. You will break the shackles that bind [cainite|E]'s society one at a time.#!"
 bookmark_warofprinces_louhi:0 "娄希"
 bookmark_warofprinces_louhi_desc:0 "A secretive vampire, with few recorded mentions throughout [cainite|E] history, Louhi has been the major [cainite|E] presence in Northern Finland as long as anyone can remember.\nOne of the most talented thaumaturge to ever exist, she has created her own brood of revenants, the devious Keskinen. Rumors have it that she serves the Lasombra Antediluvian himself for reasons unknown. Many are worried that her plans could spell doom for the region, or even more, but the few who dared travel to the icy North to confront her never came back.\n\n#bold You are working hard to please the Abyssal master. You are making progress, but there are always need of more 'volunteers' to test your latest potions...#!"
 bookmark_warofprinces_anatole:0 "阿纳托尔"
 bookmark_warofprinces_anatole_desc:0 "Born the eldest son of a city watch commander, and expected to follow in his father's footsteps, Anatole instead found a higher calling in serving God. His carriage and beliefs drew the attention of a particularly religious vampire who thought Anatole could further the cause of Christianity.\nIn the years since, he has already made a name for himself as a fervent opponent of heresy in all its forms, having defeated both the Calomena's Chosen of Constantinople and the [cainite|E] Heresy in Paris. His visions still drive him forwards to do even more.\n\n#bold The Cathar Heresy in Southern France is a front for some dangerous heretical [cainites|E] to hide behind. You must find and destroy them.#!"
 bookmark_warofprinces_elimelech:0 "以利米勒"
 bookmark_warofprinces_elimelech_desc:0 "Elimelech was the husband of Naomi, as told in the Bible in the Book of Ruth. He was attacked and Embraced by an unknown assailant. Naomi found her husband wandering in the fields – a cold, undead, empty shell. She placed him in a shallow unmarked grave. Three nights later, he rose up insane and suffering from a thirst no fountain could quench.\nElimelech never recovered from his early nights, often losing himself to his Beast and wandering around aimlessly or attacking others in a mad frenzy. Elimelech's travels finally led him to the Tal'mahe'Ra, an apocalyptic death cult worshiping the Antediluvians.\n\n#bold They fear and listen to you. Perhaps your purpose and salvation reside in this deafening chorus of emotions.#!"
 bookmark_warofprinces_adolana:0 "拉斯休加斯的阿道拉那"
 bookmark_warofprinces_adolana_desc:0 "Most of Adolana's life has been spent in a convent after her sadistic brother sent her there to hide his crimes. Refusing to take any more beatings, she soon used her way with words to turn the nunnery into a fractured society where violence was commonplace, but with her at the top of the food chain now.\nImpressed with her skills, a Malkavian of the [cainite|E] Heresy Embraced her and expanded her ambitions. Helped by the near collapse of the Church of Caine, Adolana has swiftly rose in the hierarchy and is now a member of the beleaguered See of Nod, the last bastion of her faith.\n\n#bold You found a new family in the Church of Caine but... even in a family you know that you must be on top if you want to avoid getting hurt again.#!"
 bookmark_warofprinces_harold:0 "哈罗德·泽特勒"
 bookmark_warofprinces_harold_desc:0 "A member of the the Circle of Three Revelations, a loose collective of Malkavian seers, philosophers and mystics, Harold Zettler was a strong defender of the Salubri when the Tremere started destroying them. Using the little influence he had to shelter and protect them wasn't enough and he grew more desperate as the Tremere purge gained traction.\nHarold pleaded to any spiritual entities or even Gods to help him and one of them answered.\nThat night, Harold Zettler was reborn as a mockery of everything he once held dear.\n\n#bold You understand so much more now. There is no salvation without pain and you will become the most accomplished artist of it in time, thanks to your generous new patron.#!"
 nosferatu_sub_bookmark:0 "诺斯费拉图"
 bm_1230_warofprinces_sub_nosferatu:0 "诺斯费拉图氏族"
 bm_1230_warofprinces_sub_nosferatu_desc:0 "具有所有该隐之子中最明显的诅咒，初拥将每个诺斯费拉图扭曲成一个可怕的畸形生物。他们是死者的间谍，收集信息并以低廉的价格出售。作为下层社会的主人，诺斯费拉图倾向于更加重视氏族团结和共同生存，因此即使算是敌人，彼此之间也相当融洽。\n诺斯费拉图在黑夜世界中从来都不是重要的领土拥有者，但由于他们在信息收集方面的无与伦比的才能，他们总是挥舞着巨大的，甚至是不可见的影响力。\n\n#bold 你的氏族是唯一能理解你的家。如果你们能都团结起来，很少有什么威胁是不能克服的。#!"
 bookmark_warofprinces_josef:0 "约瑟夫·兹维"
 bookmark_warofprinces_josef_desc:0 "Josef was born and raised in the Jewish Quarter of Prague as the son of a rabbi. Violence against Jews was not uncommon, and Josef suffered most brutally one night when a gang of Christian boys crushed half his head in. He would have died if not for his [Embrace|E] by the Nosferatu Yehuda. He asked if Josef would defend others from such brutality to which Josef could only squeeze the Nosferatu's hand in response.\nRising to become the head of the Nosferatu's community in Prague, Josef was instrumental in dethroning his previous tyrannical Prince. In the ensuing power vacuum, he was able to secure the city for himself and his people.\n\n#bold Despite Prague being safe, a new threat has risen to your East and could jeopardize all your efforts so far. You must not waver.#!"
 bookmark_warofprinces_tarique:0 "塔利克"
 bookmark_warofprinces_tarique_desc:0 "Before his rise, Tarique was a Spanish Kindred converted to Islam during its Golden Age. Enamored with the 'untouchable' city of Mecca, Tarique ventured to the Arabian Peninsula to gaze upon the holiest of Muslim sites.\nHe became involved with its defense against a Malkavian plot and soon befriended the Ashirra (Muslim [cainites|E]) leadership. Gathering a following impressed by his unshakable faith, Tarique then claimed that henceforth he and his progeny would become Hajj, religious guardians of Islam and stewards of Mecca.\n\n#bold The Ashirra stand strong, but they are still threats all around you. You are their rock and must not falter in your holy duty.#!"
 bookmark_warofprinces_malachite:0 "马拉希底斯"
 bookmark_warofprinces_malachite_desc:0 "Born in the 9th century as a native of Constantinople, Maleki grew to be an Eastern Orthodox priest. Unfortunately, he had a public disagreement with a powerful [cainite|E]. For wounding his pride, he had Maleki Embraced by a Nosferatu.\nReborn as a [cainite|E], Maleki lived in despair until he was taken under the wing of the Toreador Michael, Patriarch of Constantinople, and becoming the most faithful servant of the Dream.\nThe 4th Crusade was a crushing blow to Malachite's spirit, but he knows that even without Michael, the Dream must endure.\n\n#bold You must free Constantinople from Frankish control, and return the city to its former glory. As Michael's heir, it is your duty.#!"
 bookmark_warofprinces_mnemach:0 "内马赫"
 bookmark_warofprinces_mnemach_desc:0 "Born during the last days of independent Gaul, Mnemach was Embraced by a Nosferatu wanting to preserve their culture and traditions. Under his tutelage, she soon became an accomplished witch and established herself in Lutetia, soon to become Paris.\nOne of the oldest [cainites|E] of France, Mnemach's influence and power are well known, and her support was critical in ousting Alexander of Paris from power. Still, her true goals remain unclear, making the aura of mystery around her even more worrying to other [cainites|E].\n\n#bold You ousted Alexander for a reason, and this reason is now in your hands. A fragment of your past, and perhaps of your future, is reunited with you once more.#!"
 bookmark_warofprinces_lukas:0 "卢卡斯"
 bookmark_warofprinces_lukas_desc:0 "To most, Lukas could be mistaken for a choirboy of a holy order. His innocent appearance belies the cunning monster that dwells beneath, the monster who systematically corrupted a house of God in the name of Hell.\nProud of his perfect beauty as a mortal boy, Lukas was horrified when a vagrant Nosferatu Embraced him to teach him some humility. Despairing, Lukas said that he would do anything to restore his beauty.\nFar below, something heard his plea and presented his terms...\n\n#bold Your infernal patron asks for more and more to keep his end of the bargain. You have no choice but to comply for your beauty is worth any sacrifice.#!"
 bookmark_warofprinces_gregor:0 "格雷戈尔"
 bookmark_warofprinces_gregor_desc:0 "A Teutonic knight in life, Gregor was known for his cruelty and carelessness. Embraced by a Nosferatu hoping to punish him, Gregor instead adapted quite easily to his new existence.\nGoing deep into the Black Forest, he soon became famous for killing werewolves and destroying a powerful and ancient Niktuku. Both feats should be nigh impossible to someone as young as Gregor, leading many to believe that something is not quite as it seems in the deepest reaches of the forest...\n\n#bold You have found your true purpose as a knight of the Lady of Thorns. She gives you strength and doesn't berate you for your lust for violence. You are perfect for one another.#!"
 bookmark_warofprinces_zelios:0 "塞琉斯"
 bookmark_warofprinces_zelios_desc:0 "Born into a family of wealthy merchants, Zelios turned away from pursuing a life of comfortable privilege in favor of developing a useful craft. He traveled Europe and beyond, learning the art and science of architecture.\nA Nosferatu realized the potential of the young man and decided to bring him into the [clan|E], so that he could improve the warrens his [clan|E] populated. With eternity before him, Zelios immerses himself into his craft, specializing on constructing castles for [cainites|E] lords.\n\n#bold You are famous among nobility and craftsmen alike but you know that your true masterwork is yet to come. Transylvania calls to you, and it might be where you will find your destiny.#!"
 ravnos_sub_bookmark:0 "雷伏诺"
 bm_1230_warofprinces_sub_ravnos:0 "雷伏诺氏族"
 bm_1230_warofprinces_sub_ravnos_desc:0 "分裂严重的雷伏诺氏族起源于印度，但众所周知，他们一直在远方游荡。在他们的家乡，他们是强大的统治者，但在西方却不那么稳固，在那里他们只是被称为游荡的骗子、神秘主义者和流浪者。\n东方雷伏诺有自己的种姓制度，是由他们所谓的创始人吒婆多修罗的后代发展而来的。就他们而言，每位雷伏诺流亡者都有不同的观点、价值观和动机，导致在欧洲境内有着众多分支（或种姓）。\n\n#bold 在西方世界被鄙视，在印度则陷入与死敌的永恒之战中，雷伏诺氏族的未来将是一场艰苦的斗争。有很多事情要做。#!"
 bookmark_warofprinces_chandraputra:0 "查古拉普夏"
 bookmark_warofprinces_chandraputra_desc:0 "A savior and a monster, a servant and a conqueror, Chandraputra is one thing first and foremost : loyal. The only childe of Zapathasura to not have betrayed his [Sire|E] in one way or another, he has naturally assumed the mantle of leadership for his Indian clansmates.\nAmong the first Indo-European conquerors who invaded the subcontinent during his mortals days, Chandraputra is perhaps the most accomplished general of the night, in no small part due to the eternal war he wages against the accursed asurazitayya that threaten his [clan|E].\n\n#bold War never changes and you don't either. Your foes will understand that you will never falter.#!"
 bookmark_warofprinces_karmenita:0 "卡门尼塔·约亚里"
 bookmark_warofprinces_karmenita_desc:0 "Originally from Italy, Karmenita became quickly disillusioned with the decadent behavior of the Roman Ravnos. She relocated to Portugal in order to explore the spiritual side of the bastardized version of the Path of Paradox her [Sire|E] had taught her. Without knowledge of the original doctrines, Karmenita developed the notion that there could only a limited number of things, concepts, and so on, that can thrive in the contemporary world.\nShe is also a fervent enemy of the mindless criminality and other fits of self-gratification so common among her [clan|E], sparking discontent against her among her former brethren.\n\n#bold You are slowly creating your own caste from the decadent mess that your [Sire|E] left behind. But you have your own familial issues to deal with...#!"
 bookmark_warofprinces_iago:0 "雅戈·卡斯提尔"
 bookmark_warofprinces_iago_desc:0 "The 'Pirate Prince' of the Mediterranean is a shrewd captain who was Embraced in [clan|E] Ravnos by Karmenita Yoryari. Their views soon clashed though, with the patient [Sire|E] disliking her childe's fiery temper. As such Iago quickly escaped from her grasp to Corsica.\nProving himself a charismatic leader, Iago has fully embraced his new life as a greedy and deceitful pirate. Underestimating him would be a mistake though, as his skills for intrigue and manipulation have left many pursuers dead in their tracks.\n\n#bold There is money to be made and arrogant Princes to take down a notch or two. The Mediterranean is yours for the taking!#!"
 bookmark_warofprinces_mritunjay:0 "米伊特杰"
 bookmark_warofprinces_mritunjay_desc:0 "The newest Prince of Baghdad has risen to this title after a well planned scheme against the last Prince, taking his revenge against her in the process. As someone who enjoys the finer things of life, and unlife, Mritunjay is certainly appreciative of his new station, but taking him for a pompous buffoon would be a mistake.\nWith his quick mind, Mritunjay has become an expert on playing factions against one another, ensuring his safety in the process. With Baghdad finally in his hands, he will be able to use this ability on a larger scale.\n\n#bold Baghdad is the greatest of prizes, but there are threats, both mortal and undead, to deal with to truly secure it.#!"
 bookmark_warofprinces_marcia:0 "玛西娅·费利西娅·莉西娜"
 bookmark_warofprinces_marcia_desc:0 "As the oldest Phaedymite active, Marcia is proud of the legacy of her caste, one of warriors and knights, of honor and duty. But her love for battle pales in comparison with her lust for knowledge. Taking on the task of writing a Magnus Opum about her [clan|E], Marcia has been hard at work in compiling information on her disparate brethren.\nHer single mindedness is costing her more and more though, as she dreadfully sees the Ravnos falling into decadence. She is now contemplating taking a more politically active role.\n\n#bold You can't stay idle as your [clan|E] indulges in sinful behavior. You could make History, instead of just writing it.#!"
 bookmark_warofprinces_zoe:0 "佐伊"
 bookmark_warofprinces_zoe_desc:0 "Once a mere apprentice in Constantinople, Zoe was fatally wounded during the sack of the city in 1204 and Embraced to save her life. Traveling with the exiled Greek populace, she soon lost her [Sire|E] as well to a group of Inquisitors.\nOvercome with rage and despair, Zoe would have been broken if not for the patient tutoring of Anatole, a fellow traveler. The two of them learned from each other, and Zoe took her revenge against the hated Inquisitors. Finally at peace, she became the ward and honorary childe of her friend and has followed him to Southern France in his own personal quest.\n\n#bold You owe much to Anatole, and you can learn much more from him still, perhaps finally finding your place in this world in the process.#!"
 bookmark_warofprinces_etienne:0 "艾蒂安·德·法贝热"
 bookmark_warofprinces_etienne_desc:0 "Etienne grew up in the knowledge that he was born of sin and the world around him was unworthy in God's eyes. When the call of the Crusades was issued, he joined in in order to gain forgiveness. When he tried to protect a Jewish merchant near Antioch, he fellows turned against him, beating him down and forcing him to watch as they slit the throats of the merchant's family, leaving Etienne weeping amidst the corpses. It was then that he met his [Sire|E], moved by his piety.\nSince then, Etienne has tasked himself with guarding Acre and acting as the holy city's protector. In these turbulent times, his work is cut out for him.\n\n#bold You have managed to save Acre so far, but the unrest in the Holy Land is never over. You have not yet repented enough for your sins.#!"
 setite_sub_bookmark:0 "赛特之子"
 bm_1230_warofprinces_sub_setite:0 "赛特之子氏族"
 bm_1230_warofprinces_sub_setite_desc:0 "赛特之子相信赛特有一天会回来统治或吞噬世界，而虔诚的赛特之子则将为他的复活做好准备。为此，该氏族保持独立于其他该隐之子的党派，并以精湛的技艺练习腐化、欺骗和古魔术。\n在大多数时候，赛特之子的行为更像是一个密教，而不是一个真正的氏族。赛特之子在他们的祖国埃及仍然很强大，但伊斯兰教的兴起严重削弱了他们在埃及以外的力量。为了寻找新的盟友并将他们的神的荣耀传播到更远的地方，曾经闭塞的赛特之子已经开始在世界各地旅行。\n\n#bold 拉对世界的铁腕掌控仍然令人窒息。只有当所有被误导的该隐之子都唱起对赛特的赞歌时，世界才能真正获得自由。#!"
 bookmark_warofprinces_nakhthorheb:0 "纳克塔内波"
 bookmark_warofprinces_nakhthorheb_desc:0 "Before Set's disappearance, the Followers had no organization. Once their god went missing, the Hierophants came together and declared themselves the stewards of the [clan|E].\nNakhthorheb is the greatest of the Hierophants; it is he who holds them in an iron grip. Rumors say that he was born into the same nomad tribe as Set himself. While all laws and commands given must be agreed upon by all seven elders, it is Nakhthorheb who is the source of these commands.\n\n#bold With Set's disappearance, the faithful need your leadership more than ever. Do not fail them, or him.#!"
 bookmark_warofprinces_kemintiri:0 "齐茉媞里"
 bookmark_warofprinces_kemintiri_desc:0 "Once a priestess of Isis who attracted Set's unwanted attention, Kemintiri was violently tortured before her Embrace when she refused to give up the secret Set sought from her Goddess. Even this cruel treatment didn't break her, and she endured his abuse for many nights before managing to escape.\nSince that time, Kemintiri has become the worst enemy of the Setite [clan|E], destroying her hated Sire's legacy whenever she can. Her legend grows nightly and tales are being told of the beautiful last Priestess of Isis, an angel of vengeance falling upon a corrupted [clan|E].\n\n#bold Your work will never be done until everything Set holds dear is scattered to the winds.#!"
 bookmark_warofprinces_andreas:0 "安德烈亚斯·埃古普托斯"
 bookmark_warofprinces_andreas_desc:0 "Once a Palestinian priest of the heretic Monophysite sect in early Christendom, Andreas found Set during his exile in Egypt. Proving himself an intelligent and studious convert, Andreas has taken the role of a merchant prince for his [clan|E], gaining contacts and allies across Europe.\nHis impeccable reputation and fair dealings have helped him create a trading empire, but his true callings still are in helping others find Set's truth, no matter where they came from.\n\n#bold Each person accepts Set in their own way. You are merely the patient and understanding guide that they will need along the way.#!"
 bookmark_warofprinces_neferu:0 "尼芙璐"
 bookmark_warofprinces_neferu_desc:0 "A lady in waiting to Nefertiti, Neferu was Set's agent during the troubled times of Pharaoh Akhenaten, being instrumental in bringing down his heretical rule. Her reward was the Embrace and the creation of her own temple, the Fire Court.\nShe has specialized herself in corrupting foreign vampires trying to conquer Egypt, a task that has earned her many enemies. But, somehow, the Fire Court seems to always survive and come out on top more often than not.\n\n#bold Your court erodes the very pillars of civilization slowly and methodically. Many have already fallen to it, many more will do so in the future.#!"
 bookmark_warofprinces_sarrasine:0 "萨拉金"
 bookmark_warofprinces_sarrasine_desc:0 "As a mortal, Sarrasine was a young boy in the court of Justinian the Great, who saw that temporal lords often did not live according to the orthodoxy of the scripture, but to hidden masters. Khay'tall Embraced him because he saw something of himself in the boy. Sarrasine, however, did not reciprocate these feelings. During the sack of Constantinople by the Fourth Crusade in 1204, Sarrasine attempted [diablerie|E] on his [Sire|E], but narrowly failed.\nWhile Khay'Tall didn't have many friends among Orthodox Setites, he still had zealous followers to his cause and Sarrasine is now on the run.\n\n#bold This whole affair was merely a setback. Time to start anew, something you are quite skilled at doing.#!"
 bookmark_warofprinces_arnulf:0 "阿努尔夫·耶梦加得松"
 bookmark_warofprinces_arnulf_desc:0 "Arnulf Seamundsson was a Norse merchant who traveled to Alexandria during the 9th century. There, he was introduced into a blood cult dedicated to the ancient god Set and finally granted the embrace by a member of the Followers of Set.\nWhen Arnulf returned to Scandinavia, now known under the epithet Jormungandrsson, he founded the Hall of Jormungandr as a doomsday cult who worships the World-Serpent. He has so far gained a foothold into jewelry trade and fostered a small Setite colony far away from Egypt.\n\n#bold While the Viking world disintegrates, there are new riches and converts to be had. Exciting, if dangerous, times.#!"
 bookmark_warofprinces_jean:0 "让·巴蒂斯特·德·蒙特龙"
 bookmark_warofprinces_jean_desc:0 "Jean-Baptiste was drunk when he took the cross, it's the only explanation for his momentary bout of religious fervor.\nWhile delayed in Messina, Sicily, he found himself indulging in all manner of depravity and heresies under the rationale that the Pope had promised all sins would be forgiven to Crusaders. After only a few weeks, he abandoned his duty to the Cross and gave in to the Cult of Set. Unfortunately, the Neapolitan temple was destroyed and he had to flee back to France.\nSince then, Jean-Baptiste has become the master of Paris' night life, satisfying his every twisted desire in the process.\n\n#bold Unlife is good. Who cares about this Set guy while you can surround yourself with pleasure and riches aplenty?#!"
 tremere_sub_bookmark:0 "睿魔尔"
 bm_1230_warofprinces_sub_tremere:0 "睿魔尔氏族"
 bm_1230_warofprinces_sub_tremere_desc:0 "睿魔尔是最新的吸血鬼氏族，在他们的创始人开始寻求如何保留他那正逐渐消失的不朽性前，他们曾经是赫耳墨斯秘会的法师。这一探索使他和他家族的大多数人都变成了吸血鬼。\n自从他们诞生以来，睿魔尔已经树敌无数，从被他们侵占的领土的棘秘魑到被他们谋杀了扫罗的萨洛比。尽管如此，他们铁一般的纪律和强大的魔法使他们能够坚持下来……目前而言。\n\n#bold 睿魔尔氏族的地位摇摇欲坠，被四面八方的敌人围困着。他们将需要他们最杰出的成员的才能和智慧来生存。#!"
 bookmark_warofprinces_goratrix:0 "格拉崔克斯"
 bookmark_warofprinces_goratrix_desc:0 "One of the closest friends, and most promising student, of Tremere himself, Goratrix was the one to devise the ritual that transformed the House of Tremere's elite into vampires.\nDespite this great success, it was Etrius, Tremere's other student, that was chosen to act as regent for the House, infuriating Goratrix. Sent to France as an exile of sort, the ambitious and talented magus has already made the most of his time here, gaining a very strong influence on French politics.\n\n#bold There is something rotten in House Tremere and you know it. This fool Etrius doesn't even begin to understand it. You must end this exile and save [clan|E] Tremere before it's too late.#!"
 bookmark_warofprinces_meerlinda:0 "梅琳达"
 bookmark_warofprinces_meerlinda_desc:0 "Meerlinda is the sober-minded and rational part of the Inner Council of Seven of [clan|E] Tremere. Within the old House Tremere, she was the only woman deemed worthy by Tremere to accompany him to the highest reaches of magic.\nShe has the respect of both Etrius and Goratrix, being able to play the role of the peacemaker within the council. Sent to England, Meerlinda's role is double. Preparing a new home for the [clan|E] if the Carpathians fall, and investigating the rumors around the Holy Grail and its effect on vampires.\n\n#bold Let Etrius and Goratrix go at each other's throats. When they both fail, [clan|E] Tremere will renew itself here... under your careful supervision.#!"
 bookmark_warofprinces_jervais:0 "贾维斯"
 bookmark_warofprinces_jervais_desc:0 "The son of a French scribe, Jervais had a little spark of magical talent, enough to attract the attention of House Tremere, but not enough to become a powerful magus on his own.\nStill, with a strong dedication combined with a ruthless ambition, he managed to become one of the foremost ambassadors of the Tremere, fomenting alliances crucial to his [clan|E]'s survival.\nFor his reward to his continued good service, Jervais has been tasked with perhaps his most dangerous quest yet : getting rid of the schismatics Tremere in Livonia.\n\n#bold You are climbing the Pyramid one step at a time. Your determination will see you through.#!"
 bookmark_warofprinces_rutor:0 "鲁托尔"
 bookmark_warofprinces_rutor_desc:0 "Rutor was born and raised on Tzimisce lands. He was bred for war, war against the Tremere who had invaded the ancestral homeland and to war he went, though not of his own choosing. His master believed Rutor suborned by the blood bond, but Rutor was immune to this and ended up betraying him to her enemies, earning the [Embrace|E] from [clan|E] Tremere as a backhanded reward.\nRutor, however, was as malcontent and rebellious as always and when he thought his period of apprenticeship over, he left to establish a powerbase of his own. After years of traveling and avoiding contact with his [clan|E], he has ended up in Scandinavia, where he makes a bid to become Prince of Copenhagen.\n\n#bold You are your own master, and you will make you own destiny.#!"
 bookmark_warofprinces_xavier:0 "泽维尔·德·辛扫"
 bookmark_warofprinces_xavier_desc:0 "One of the most powerful magus of House Tremere, Xavier de Cincao is not a very politically active member of the Council, preferring to focus his attention on learning the secrets of the supernatural, even beyond vampires and mages.\nAs such, it was no great surprise when Xavier started making inroads into North Africa, seeing it as a good base of operations to learn more about this continent, quite mysterious to the Tremere. Still, Xavier doesn't shy away from his duties either, and Tremere's influence in both Spain and the Maghreb has been greatly expanded since his arrival.\n\n#bold There are secrets to be learned, pacts to be made... all for the glory of the [clan|E], of course.#!"
 bookmark_warofprinces_therimna:0 "泰瑞姆纳"
 bookmark_warofprinces_therimna_desc:0 "Therimna was once Goratrix' apprentice, who saw in her both inherent magical spark as well as talent and dedication. She soon noticed the failing of immortality, and begged her master to [Embrace|E] her which he did, before making her the official executioner of [clan|E] Tremere, a role in which she reveled.\nIn the face of the many dangers the early [clan|E] Tremere was forced to face however, she lost hope. She is now making deals with any Prince willing to listen and harbor her, knowing that it's only a matter of time before the Tremere find her betrayal.\n\n#bold You will survive. No matter the costs, the betrayals or the hardships you will have to endure, this is all worth it in the end.#!"
 bookmark_warofprinces_virstania:0 "维斯塔尼亚"
 bookmark_warofprinces_virstania_desc:0 "Virstania was the youngest apprentice in the Tremere order to earn the rank of mage. But because she was so young she was unable to form friendships with the other magi.\nGoratrix believed Virstania was ripe to aid him in his next project. She was Embraced and, after a year of tutoring at Goratrix' side, she was put to work hatching the first of the Gargoyles. She bathed them in unwavering love and they responded to her as baby chicks to their mother. As the years pass, Virstania has come to care more for her creations than her fellow Tremere.\n\n#bold You will fight the Tremere's wars, but you long for the night where your beautiful babies can finally be free.#!"
 bloodlines_sub_bookmark:0 "血系"
 bm_1230_warofprinces_sub_bloodlines:0 "血系"
 bm_1230_warofprinces_sub_bloodlines_desc:0 "十三主要氏族并非是唯一的黑夜的潜伏者。从德鲁伊派的菈亚南到亚洲的万鬼，血系有很多变体。这些血系与传统的该隐之氏族有一些内在的区别，无论是在他们的弱点、异能，还是两者上。这些血系中的许多，实际上是氏族中的氏族。\n有些是非常有影响力的，如亚洲的万鬼或草原上的安答，而其他的则在湮灭的边缘徘徊，这使得每种血系都是样不同的、复杂的事物。\n\n#bold 十三主要氏族一直以来都是根据他们的政治资产而入榜的，就像最近他们中的睿魔尔的上台一样。也许是时候进行另一次动荡了。#!"
 bookmark_warofprinces_deverra:0 "德维拉"
 bookmark_warofprinces_deverra_desc:0 "Born as a magically gifted girl in Livonia to a family devoted to the God Telyavel, Deverra never forgot her true allegiance, even when [clan|E] Tremere took her in as an apprentice. She asked to be transferred to her homeland Livonia, in order to study the Koldunic Sorcery of the Tzimisce.\nSoon censured by the rest of the Clan for her pagan ways, Deverra and her coven had to search for new allies, which she found in the Mongol warlord Qarakh. They soon become more than just allies and she now dutifully protects both him and her people from the coming Christian onslaught.\n\n#bold Your faith is dying, but there is still hope for a renewal. Stand strong and dutiful to Telyavel and you might still prevail.#!"
 bookmark_warofprinces_magda:0 "玛格达"
 bookmark_warofprinces_magda_desc:0 "Magda was born in the years before the Fir Bolg's final invasion of Ireland, inducted at a young age into the druidic priesthood. During the invasion, the Fir Bolg brutalized Magda's body and left her for dead, barely clinging to life until nightfall. Her sire chose to [Embrace|E] the young girl rather than see her talents lost to death.\nMagda descended upon the interlopers with a fury that bordered on the insane, casting them back into the sea whence they came. Over the millennia that followed, the Witch of Connaught has sought to take enough blood to make up for what she sees as the insidious murder of her people's ways.\n\n#bold The Normans will pay, the Norse will pay, the Romans will pay... Ireland will run red with blood soon enough.#!"
 bookmark_warofprinces_marconius:0 "马可纽斯"
 bookmark_warofprinces_marconius_desc:0 "A mortal mage before the [Embrace|E], Marconius specialized in alchemy and worked to create a perfect being. During the reign of Emperor Justinian the Apostate, he drank a potion made with Unseelie Fae blood, rapidly changing in the process.\nNeedless to say, other Lasombra noticed. With his growing contacts in the Fae world and his quickly secured stronghold of Strasbourg, they haven't been able to act against him so far. Rumors of him experimenting on his fae 'allies' could soon create a breach in Marconius' defenses however.\n\n#bold You walk a dangerous line between learning more about your condition and keeping your Princedom secure. Be sure not to fall.#!"
 bookmark_warofprinces_chinkhai:0 "钦卡海"
 bookmark_warofprinces_chinkhai_desc:0 "In power and age, Chinkhai is almost unrivaled in the Steppes. A grandson of Dobrul the man and a childe of Dobrul the vampire, he has watched over his [Sire|E]'s tomb for centuries. He is responsible for the defense of his people, the Anda, against the Asian Wan Kuei and other monsters of the night.\nA nomad at heart, Chinkhai is marauding the Anda lands, dispensing justice wherever he goes, be it against trespassing intruders or his unruly brethren. Like the steppe in which he spends so much time, he is neither kind nor forgiving and his brand of justice is often quite merciless.\n\n#bold You have been entrusted to defend the Anda and you will do so. Pity to those standing in your way.#!"
 bookmark_warofprinces_catubodua:0 "波乌狄纳"
 bookmark_warofprinces_catubodua_desc:0 "Born as a princess of the long gone kingdom of Ur, Catubodua was considered the most beautiful woman living in the fabled Second City. Close to both Brujah and Troile, she was horrified when they both got into a bloody conflict.\nFleeing the city, she has since been known as a Gallic Goddess (of whom she still uses the name to this night) and a major force behind the Carolingian renewal. Finally finding what she was looking for in France, she has departed to faraway lands, seeking lost knowledge to help her failing [clan|E].\n\n#bold You made a promise to Brujah and you intend on keeping it, no matter the time it will take.#!"
 bookmark_warofprinces_dyanang:0 "达楠"
 bookmark_warofprinces_dyanang_desc:0 "朱雀皇朝的女帝，达楠，被称为是一位相对温和的统治者，让每人都自生自灭……大部分时间而言。尽管这样，或者也许是因为这样，她的皇朝被认为是一个充满暴力和疯狂的生活环境。\n她与吴哥和大越丛林中的凶民结成了奇怪但明显强大的联盟，使她在处理那些过分找死的人时有了很大的余地。\n\n#bold 你的宫廷很强大，现在可能是时候停止向内看了。印度的异端总是一种威胁，这种威胁夜夜变得更加令人担忧。#!"