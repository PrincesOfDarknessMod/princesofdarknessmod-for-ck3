 POD_brujah_cadre_interaction:0 "布鲁赫：组成部伍"
 POD_brujah_cadre_interaction_desc:0 "对一位布鲁赫来说，与其他[clan|E]的人一起做事是很困难的——其脾气爆发得太频繁，灾难随之而来。但是，当他们自己从事一项共同的功业时，组成队伍的布鲁赫（或部伍）将是一股不可忽视的力量。"
 POD_brujah_cadre_interaction_ct:0 "每有一位布鲁赫骑士在你的军队中服役，都将累加一层对骑士效能的增益。你和你的部伍也会变得更亲密，对彼此产生影响。再次使用时，原部伍将解散。"
 POD_gangrel_challenge_interaction:0 "挑战阿尔法"
