 POD_etrius_abuse_interaction_desc:0 "作为睿魔尔本人的心腹，是时候使用你在[clan|E]内的力量了。"
 POD_maatkare_interaction:0 "引诱"
 POD_maatkare_interaction_desc:0 "帮助这个被误导的[cainite|E]了解关于赛特之荣耀的真相。"
