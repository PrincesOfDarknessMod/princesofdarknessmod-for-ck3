 POD_ventrue_succor_interaction:0 "应当的救助"
 POD_ventrue_succor_interaction_desc:0 "梵卓[clan|E]遵守着互相救助的伦理——当一位梵卓处于危难时，其他梵卓有义务帮助其等。当然，凡事都有代价。"
 POD_toreador_rumor_mill_interaction:0 "谣言工厂"
 POD_toreador_rumor_mill_interaction_desc:0 "妥芮朵[clan|E]是操纵社交机器的专家。通过利用这个技巧，你可以捏造一个诽谤性的宣称——并让它成真。至少对其他人来说是这样。"
