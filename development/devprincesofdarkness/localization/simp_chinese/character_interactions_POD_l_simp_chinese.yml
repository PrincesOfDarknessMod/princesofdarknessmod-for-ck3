 POD_bond_prisoner_interaction:0 "血缚囚犯"
 POD_bond_prisoner_interaction_desc:0 "强行把你吸血鬼的精血喂给[scope:recipient]，在你们之间建立起一种神秘的联系。血缚会让他们感受到虚假的爱，并对你做出积极的反应。如果他们已经和你有部分血缚，它将被替换为强迫观念。#R 让他们做你的奴隶！"
