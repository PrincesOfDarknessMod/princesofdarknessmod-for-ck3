l_simp_chinese:
 podintroductions.1.t:0 "黑玫瑰"
 podintroductions.1.desc:0 "当凡人在法兰西在阿尔比十字军的内部混乱中挣扎时，吸血鬼统治的法兰西也同样举步维艰。亚历山大，第四代梵卓血族，在不到两年前还是法兰西巴黎的亲王。他被一场由妥瑞朵族赛丽安娜和他自己的子嗣杰弗里·杜·坦普尔领导的政变推翻了。妥瑞朵女王在面对自己同族和其他法兰西王后们的反对下已经控制了国家并试图巩固自己的地位。另一方面，杰弗里得到了巴黎为战利品，同时有时间他可以以自己的血脉为由去竞争王位。至于南边，图卢兹的埃斯克拉芒正在利用清洁派起义来达到自己目的，但可能很快就会面对北法兰西的怒火。这个国家在这场磨难中会找到一个比亚历山大更好的新统治者吗？还是会被混乱和毁坏所席卷？"
 podintroductions.1.a:0 "在我的统治下，法兰西会更好……"
 podintroductions.2.t:0 "无聊的英格兰神王"
 podintroductions.2.desc:0 "大不列颠的吸血鬼历史与梵卓密特拉密教不可分。这位第四代血族先是波斯神，后是罗马神，在基督教进行驱逐之前，他的密教几乎遍及整个欧洲。带着他的狂热分子撤往英格兰的土地后，他迅速积聚了力量……并开始厌倦了这个地方的琐碎。诺曼人的入侵摧毁了他的权力宝座，迫使他苏醒以恢复秩序。150年后，密特拉再一次对英格兰漠不关心，他的许多臣民，像康沃尔的休和罗宾·李兰德，已经获得了事实上的独立，并筹划他的灭亡。更糟糕的是，威尔士和苏格兰仍然受控于古老的德鲁伊教和北欧血族之下。没有人能说密特拉是否能再次粉碎这个新的反对派，或者只是让它在他的鼻子底下溃烂，直到为时已晚。"
 podintroductions.2.a:0 "神王万岁……目前来说。"
 podintroductions.3.t:0 "众王与巫士之地"
 podintroductions.3.desc:0 "作为梵卓氏族无可争议的核心，德意志牢牢地掌握在哈德施塔特的人手中。然而，即使是他的统治也不是没有受到挑战，比如德意志西部的茱莉亚·安塔西亚和巴伐利亚难以捉摸的伊尔丝·雷纳格这样的伪装者。在南面，篡位者睿魔尔氏族正处境危险，东欧恶毒的棘秘魑氏族正在迅速逼近他们的据点。他们与强大的梵卓的防御协议也许是他们唯一的生命线。法兰西流亡的亲王，巴黎的亚历山大就在附近，有着伟力归于自身的强大力量的吸血鬼，虽然他在政治上却是孤立的。哈德施塔特必须迅速行动，抑制住他子嗣尤尔根的野心，摧毁茱莉亚和伊尔斯的势力基地，并在有或没有睿魔尔的帮助下确保他的东部阵线。德意志将成为梵卓氏族王冠上的明珠，或者化为灰烬。"
 podintroductions.3.a:0 "罗马已是过眼云烟，未来在这里。"
 podintroductions.4.t:0 "暗影收复失地运动"
 podintroductions.4.desc:0 "伊比利亚是勒森魃氏族传统的权力中心，但凡人的收复失地运动使贤士陷入了一场痛苦的内战。北部，西尔维斯特·德·鲁伊斯领导着基督教氏族勒森魃，有着统治整个伊比利亚半岛的明确野心。不过，他必须注意他那些野心勃勃的封臣们，比如安布罗西奥·路易斯·蒙卡达或阿拉贡的露西塔。在南部，经过几十年的内讧，自称为阿希拉派的穆斯林勒森魃氏族在安达卢西亚的巴德尔发现了一位值得尊敬的苏丹。在其他地方，新老的亲王们，从帝王般的梵卓氏族到野性的刚格罗，都注意到这些贤士们的弱点，并等待合适的时机出手。这再征服可能是伊比利亚勒森魃统治的最后一丝气息。"
 podintroductions.4.a:0 "只要给我一些时间，伊比利亚将再度统一。"
 podintroductions.5.t:0 "诸神黄昏"
 podintroductions.5.desc:0 "北欧人的信仰早已从凡人的脑海中消失，但对斯堪的那维亚的吸血鬼仍然存在。它的拥护者，勇猛的英灵战士还坚持自己的信念……但是希望正在迅速消退。「崇高之主」维特和瓦尔基里的首领乌尔夫斯多蒂尔陷入了沮丧几近蛰眠。不过，有些人仍在继续战斗，例如布伦希尔德和「歪眼」瓦尔比约格，他们试图摧毁哈德施塔特率领的入侵的基督教吸血鬼。使英灵战士感到乐观的一线希望是，新来者很难团结一致，彼此争吵，最显着的是在丹麦分裂为了三个伪装者。在北部的荒原上，一群冷酷无情的暴徒称自己为禁闭原罪，他们在这片贫瘠的土地上建立了一个让人质疑的宣称。无论他们是新的盟友还是敌人，北欧人的最后一场战役已经临近，十字似乎再次成为人们的最爱……"
 podintroductions.5.a:0 "斯堪的纳维亚将与过去不再一样。"
 podintroductions.6.t:0 "帝国的安魂曲"
 podintroductions.6.desc:0 "如果说中世纪的意大利是一个分裂的国家，那么夜晚的意大利就是一个火药桶。强大的老吸血鬼们争夺着欧洲人口最多的城市。在意大利北部，梵卓枢机法布里齐奥·乌尔菲拉在米兰坐镇，牢牢掌握着意大利教会的大权。在威尼斯，卡帕多西亚氏族的乔瓦尼后裔是一个横跨海洋的贸易帝国的主人，时间会告诉我们他们的关注点是在意大利本土还是在东方，就像他们的父辈氏族一样。在西西里岛，勒森魃氏族的首都由忠诚的蒙塔诺守卫着，但是过度扩张和西班牙的内战使这片暗影之海变得脆弱。最后，所有的目光都聚焦在罗马，提图斯·梵卓鲁·卡米拉最近在这里苏醒。这位永恒的执政官是罗马帝国和迦太基灭亡的幕后主谋，他开创了一个梵卓领导的新时代。当其他小领袖和不朽的国王在意大利其他地方崛起时，亲王们的战争从来没有像这里这样危险过。"
 podintroductions.6.a:0 "条条大道通罗马。"
 podintroductions.7.t:0 "无路可退"
 podintroductions.7.desc:0 "十字军邦联摇摇欲坠地立于黎凡特，一个更危险的吸血鬼联邦在他们中间崛起。奥利弗之席是该地区各城市亲王们之间的约定，由幸存者卡维娅·加杜巴领导。「母狮」是一位萨洛比，自其始祖扫罗死于新近崛起的睿魔尔氏族之手后，这个氏族在西欧几乎灭绝。这个变弱的氏族的大多数成员已经躲藏起来，但卡维娅仍打算坚持立场。尽管如此，她不稳定的联盟已经处于危险之中，因为强大的大马士革正陷入字面上的疯狂深渊。达舒夫，那个古老的妥瑞朵苏丹已经把他的灵魂卖给了未知的力量，只有他的后嗣和一个孤独的阿刹迈战士站在一场灾难的路上。这个会约会是一个垂死氏族的最后一次欢呼，还是一个光明未来的希望？"
 podintroductions.7.a:0 "耶路撒冷是奇迹之城，毕竟……"
 podintroductions.8.t:0 "面纱之后"
 podintroductions.8.desc:0 "阿拉伯是阿希拉派活动的所在地，穆斯林吸血鬼通过共同的信仰超越氏族团结在一起。他们在半岛上的地位很稳固，但是耶路撒冷被十字军夺去，埃及被古蛇夺去，这使他们与马格里布和安达卢西亚的兄弟们断绝了关系。更糟糕的是，美索不达米亚已经再次落入地狱主义者巴力之手，由阿扎内尔的内尔伽勒派领导。他的目标是占领该地区的大城市，大马士革，巴格达和提尔，为了他邪恶的主人的回归，他需要献祭人口。具有讽刺意味的是，他最强的对手是蒂尔的塔尼特，另一个巴力，摩洛克希姆的一个分支。这种对抗使重新崛起的巴力陷入了内战，并给穆斯林信徒带来了他们可以被制止的希望。否则，整个世界都将处于危险之中。"
 podintroductions.8.a:0 "文明的摇篮也可能是它的临终之床。"
 podintroductions.9.t:0 "斗篷与弯刀"
 podintroductions.9.desc:0 "波斯是阿刹迈氏族的所在地，这是一个外人眼中的神秘团体。在新加冕的、极具争议的长老纳穆尔图姆的统治下，他们表面上的团结正在出现裂痕，因为不同的派系开始发挥他们的权力。刀锋之网的希摩斯想让他的氏族成为一个狂热的刺客崇拜组织，准备为他的黑暗之主归来准备一支军队。术士们的阿什拉夫正走在一条温和的道路上，他将阿刹迈视为法官和外交官。最后，战士们的贾马尔是一位虔诚的穆斯林，他乐于与麦地那的阿希拉哈里发恢复友好关系。这一政治动荡促进了该地区另一个组织的发展，即达斯图尔·阿诺什的失落部族，一个崇拜第二代吸血鬼的异端。分裂和低效使阿刹迈陷入瘫痪，他们是会找到一个新的共同目标，还是会爆发内战？"
 podintroductions.9.a:0 "我将通过外交或其他手段一统波斯。"
 podintroductions.11.t:0 "永恒之战"
 podintroductions.11.desc:0 "从一开始，印度就一直是雷伏诺氏族与阿修罗提伽耶或万鬼，一群神秘的亚洲「吸血鬼」，之间的战争舞台。没有胜利者，双方战斗人员都处于崩溃的边缘，各派都在密谋推翻现任领导人。在西部，钱德拉布特拉正集结雷伏诺进行另一场战斗。而在东方，达楠带领着红龙发起另一个冲锋。而其他政权，从达埃纳到棘秘魑的卡塔里利亚，都在不停息的风暴中寻找机会。最终会浮现出赢家吗？"
 podintroductions.11.a:0 "很显然，我是印度和平的唯一希望。"
 podintroductions.12.t:0 "不断堕落"
 podintroductions.12.desc:0 "虽然迦太基在几个世纪前就被烧毁了，但在马格里布仍能感受到迦太基的遗失。该地区自此被不同的阿希拉派——穆斯林吸血鬼——苏丹瓜分，但他们中没有一个真正成功地巩固了该地区。两位最好的人选是索福尼斯巴和扎姆拉 马图布。索福尼斯巴是突尼斯的老领导人，她仍然记得在迦太基时期她的城市的陷落。阿尔及尔的扎姆拉 马图布则是位年轻的富有野心的勒森魃。赛特之子在这里也有立足之地，就像睿魔尔氏族一样。马格里布有着分裂的权力和丰富的历史，对于任何爱冒险的亲王或苏丹来说，马格里布都是诱人的奖赏。"
 podintroductions.12.a:0 "我们需要离开迦太基。"
 podintroductions.13.t:0 "金字塔的阴影之中"
 podintroductions.13.desc:0 "埃及已经忍受了许多外来的征服者，而它的本地不死族如果没有耐心和韧性就什么都不是。真正的权力在吉萨，赛特族的心腹。自由氏族——或者腐败氏族——取决于你问谁——正准备让自己的力量从十字军东征所创造的权力真空中获利。毫无疑问，他们的第一个目标将是开罗。由强大的第五代梵卓安东尼乌斯领导，这座城市不会轻易陷落，如果公开宣战，它可以挫败蛇们。每个人都确信赛特信徒将很快采取他们的第一步行动，但是没有人能说准是什么时候，如果他们这样做了，他们将会被阻止……"
 podintroductions.13.a:0 "埃及和我们一样都是不朽的。"
 podintroductions.14.t:0 "二元之地"
 podintroductions.14.desc:0 "非洲本土的吸血鬼是莱本，一个松散的多血系的联合和自我创造的吸血者们。他们掌握着大陆上大部分的真正权力，但必须与众多在他们的土地上寻求名声和财富的冒险家或小军阀竞争。更糟糕的是，非洲还是一些真正古老的生物的家园，从它是人类摇篮的时候起就一直在那里。随着同穆斯林阿希拉派与世界开放的各种新道路，莱本是否能够在变化的时代适应和昌盛还有待观察。"
 podintroductions.14.a:0 "机遇与危险并存。"
 podintroductions.15.t:0 "直入云霄"
 podintroductions.15.desc:0 "在外人看来，西藏是非常奇怪的吸血鬼的家园……如果他们能被称为吸血鬼的话!所谓的纯白流亡者是中国的饿鬼——万鬼的一部分，在东方有着牢固的地位。然而在西方，甚至有更奇怪的事物存在，从恶魔崇拜可憎的事物到已死的埃及神的启示信徒。吐蕃远离任何真正的不死族权利中心，对大多数吸血鬼来说，西藏只是一个次要的地方。但是神秘的事物可以给那些寻求足够深入的人带来回报……"
 podintroductions.15.a:0 "吐蕃沉浸在其自己的世界之中。"
 podintroductions.16.t:0 "东方惊雷"
 podintroductions.16.desc:0 "大草原不适合吸血鬼居住。很少有城市来隐藏，很少有国家要操纵和屈从于他们的意志。但是，从东方来了一种新的吸血鬼，这种吸血鬼生活在无边无际的平原上，与游牧的蒙古人生活在一起。这些鞍鞑，一个刚格罗分支，是骄傲的战士，跟随大规模扩张的蒙古帝国征战。与已经存在的西方刚格罗的冲突似乎是不可避免的，而且，当这些新来者到来时与欧洲该隐之子的紧张关系也在所难免。对于吸血鬼来说，变化是很罕见的，但当它与雷鸣般的大批游牧骑马弓箭手一同出现时，变化可能是他们中许多人经历的最后一件事……"
 podintroductions.16.a:0 "改变并不总是受欢迎……"
 podintroductions.17.t:0 "汝等进入此地……"
 podintroductions.17.desc:0 "东欧是棘秘魑氏族的传统领地，但最近他们的霸权受到了由德意志和匈牙利梵卓氏族支持的睿魔尔氏族的崛起的挑战。最近的战争以一项痛苦的和平条约结束了，条约的双方是大君主弗拉基米尔·鲁斯托维奇，和梵卓的十字军战士尤尔根·冯·维尔登。缓冲地，奥伯图斯秩序已经建立，由和平调解人迈卡·维科斯领导。现在，每个人都在舔着自己的伤口，鲁斯托维奇试图确保他对氏族的控制，而匈牙利梵卓则试图在他们的首领布尔斯库的蛰眠下来解决继承危机。最后，厄特里乌斯代替睿魔尔领导篡位者，展现出对抗谶魔的统一金字塔的正面形象。每个人都知道在这个地区，战争是不可避免的，除非一个吸血鬼有足够的力量来一劳永得地摧毁他的对手。会是谁呢？"
 podintroductions.17.a:0 "一块待驯服的土地。"
 podintroductions.18.t:0 "褪色的梦"
 podintroductions.18.desc:0 "君士坦丁堡的灰烬还在燃烧，秃鹫已经在它的尸体上盘旋。米迦勒的梦想是一个自迦太基以来从未出现过的吸血鬼乌托邦，随着创作者的陨落，一些军阀和帝国的残余试图生存下来。其中最重要的是阿方索，他是第四次十字军东征的煽动者之一，现在控制着君士坦丁堡。雄心勃勃的勒森魃仍然向在西西里岛的氏族首领鞠躬，但能鞠多久呢？再往西，布鲁赫族的娜塔莉亚 斯维亚托斯拉夫是最后一个仍然活跃的真正的梦想信徒之一，她希望自己能获得「天使长」米迦勒的青睐。安娜 科姆纳娜则没有这样的雄心壮志，利用尼西亚最终得到了帝国，应该在她能呼吸的日子里一直应该是她的。就像其他雄心勃勃的亲王在旧城的废墟上建立领地一样，君士坦丁堡可能会重生……也可能永远消亡。"
 podintroductions.18.a:0 "米迦勒是否已经预见到这场混乱？"
 podintroductions.19.t:0 "祖母，祖母……"
 podintroductions.19.desc:0 "在所有人的记忆中，俄罗斯是存在的最强大的血族之一芭芭雅嘎的家园。这个第四代的诺斯弗拉图，传说是氏族的真正祖先，是这片土地的重要组成部分，并利用它来保护自己不受她复仇的尊长的伤害。这个地区的人来说幸运的是，「巫师」在蛰眠。但她的暗影铁幕的影响仍然可以感觉到，这是由她忠实的二号人物维克多培育出来的。在这样的条件下，俄罗斯只有三种类型的吸血鬼：「祖母」的封臣，那些勇敢的，和即将死去的吸血鬼。而后两类常常相互重叠。"
 podintroductions.19.a:0 "小心那些小女孩……"
 podintroductions.20.t:0 "旧世界的新命运"
 podintroductions.20.desc:0 "传统上，波兰是棘秘魑君主领的边疆，是古怪邪恶的家园，现在它正逐渐形成自己的、独立的实体。君主们摇摇欲坠的权威，以及他们完全的脱离时代，让新一代的吸血鬼得以立足并繁荣起来。首先是虔诚的布鲁赫氏族的以撒·本·亚伯拉罕，他在克拉科夫周围聚集追随者，驱逐曾经的亲王拉兹科利纳。这可能是使波兰摆脱棘秘魑影响的第一步。但更大的挑战还在等着我们，最引人注目的是要驱逐那个绝对令人厌恶的人，那就是海德翁·雅罗斯拉维奇，一个被同族认为极端的棘秘魑……"
 podintroductions.20.a:0 "我必须留意这改革之风，否则就会被它摧毁。"
 podintroductions.21.t:0 "自由之地"
 podintroductions.21.desc:0 "远离西欧暴君的残暴统治，波罗的海地区是两种新型吸血鬼派系结构的发源地。在立陶宛，刚格罗氏族的喀喇已经团结了一大批自由意志的原始教徒，他打算将其作为基督教和梵卓氏族向东方扩张的停靠点。在更远的北方，蓝色卡尔领导着一个英灵战士自由邦，也许是最后一个这样的州了，因为斯堪的纳维亚正在被哈代施塔特的奴才们所控制。这两项实验都面临着巨大的冒险，无论是内部的还是外部的，而且主要依赖于他们领导人的超凡魅力。即使他们的勇气和信念对于即将到来的梵卓氏族的猛攻是徒劳的。"
 podintroductions.21.a:0 "一位老不死的残余可没那么容易灰飞烟灭。"
 podintroductions.2001.t:0 "欢迎来到黑暗亲王"
 podintroductions.2001.desc:0 "首先，谢谢你玩这个模组！\n《黑暗亲王》是对基础游戏的彻底改造，旨在将黑暗世界带入十字军之王3中的生活。因此，它改变了许多游戏玩法概念，并使用其世界的广泛内容来提出一种不同的体验。"
 podintroductions.2001.a:0 "让我们来谈谈吸血鬼的主要机制……"
 podintroductions.2001.b:0 "……或者其他概念"
 podintroductions.2001.c:0 "这个世界和其故事背景"
 podintroductions.2001.d:0 "我这样就行，直接开始吧！"
 podintroductions.2001.e:0 "抹去我的超自然特质，并进入角色生成器"
 podintroductions.2003.t:0 "吸血鬼101问"
 podintroductions.2003.desc:0 "首先要注意的是，作为一个吸血鬼，你是永生的……某种程度上。你不会死于年老或疾病，但被处以火形或斩首仍然会结束你的生命。因此，继承是一个较小的，但仍然存在需要关注的点。同样的道理，婚姻不能生儿育女，所以婚姻大多是少数宗教可用的政治工具。\n宗教是游戏玩法的核心部分，甚至比CK3本体里更重要。在这里，它代表了你的角色的核心哲学原则，帮助他不沦为禽兽。事实上，心兽——你内在的怪物的真实表现——是你最坏的敌人之一，管理你的压力是最重要的，不要成为它的牺牲品，因为这意味着你的角色变成了一个野生尸妖，导致他不可扮演。\n注意你的饥渴值，一个代表你对血液需求的核心修正。饥饿被用于许多计划和能力，并会由缓慢的自动补充或积极的猎食补充。"
 podintroductions.2003.a:0 "一些进阶概念"
 podintroductions.2004.t:0 "如何才能不烛化为烬"
 podintroductions.2004.desc:0 "吸血鬼学习新事物很慢。因此，你仍然可以使用基本的生活方式，但在一个较低的进展速度。相反，你可以选择把你的时间投入到训练中，开放诅咒的力量供你使用。\n建筑代表了你对芸芸众生的影响。大多数都有像控制这样的属性上限，你必须选择如何平衡它们。值得注意的是，以高度发展的公国首都为代表的主要人口中心是任何一个亲王都能梦想到的最大资产。\n战争被明智地改变了，更多地强调了骑士。你的骑士的英勇可以轻易地战胜更多的敌人，特别是当大部分是由征军组成的时候。因此，要小心那些高能力的敌对吸血鬼。\n在一个充满欺骗和诡计的世界里，阴谋诡计扮演着更重要的角色。有一些新的计划需要去发现，一些和你的能力有关，而且大多数角色都有秘密，最好不要说出去…或者在宗教允许的情况下被用来勒索。"
 podintroductions.2004.a:0 "回到初始选项"
 podintroductions.2005.t:0 "到目前为止的故事……"
 podintroductions.2005.desc:0 "黑暗世界是一个发行了30多年的世界观，有上百本书和其他流媒体类型有关于它。其主要设定是，在我们的世界中，几个超自然生物派系在表层下相互作用，创造了一个充满阴谋和故事的里世界。\n黑暗世界的吸血鬼主要是圣经中对该隐的诅咒的结果，该隐是第一位谋杀犯，大多数都可以追溯他们的血统到他的身上，他们称之为「世代」。这颗不死族王朝之树已经分裂成几个派系和氏族，每个派系都有自己的力量、弱点和地理权力基础。\n在你正在玩的《幽暗纪元：血族》中，我们正在几个重大危机的十字路口追寻不死族的世界。君士坦丁堡之劫已经发生，并摧毁了当时主要的该隐之子帝国，其涟漪效应远及法兰西和波斯。与此同时，教廷的宗教裁判所正在获取支持和信息，几乎准备好迎接对被诅咒的吸血鬼的报复时代……"