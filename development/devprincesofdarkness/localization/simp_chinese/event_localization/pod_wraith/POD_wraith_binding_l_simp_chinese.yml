l_simp_chinese:
 POD_wraith_binding.100.t:0 "魔法与意志的考验"
 POD_wraith_binding.100.desc:0 "While going about your normal business as a wraith, you feel a powerful pull towards an unknown locataion. Someone is messing with your connection to the mortal world!\n Arriving in a summoning chamber, you meet your summoner - a necromancer named [actor.GetFirstNameNoTooltip]. Already, the binding ritual is starting to affect you and warp your being."
 POD_wraith_binding.100.option.a:0 "我 不 会 被 约 束 ！"
 POD_wraith_binding.100.option.b:0 "当然抵抗。"
 POD_wraith_binding.100.option.c:0 "抵抗是徒劳的……我会报仇的，就是晚一点。"
 POD_wraith_binding.200.t:0 "魔法与意志的考验"
 POD_wraith_binding.200.desc:0 "The ritual ground ready, you call upon the dark magics of the abyss and pull the target wraith to your prepared circle. \n Through a hole in mortal reality comes [recipient.GetFirstNameNoTooltip], face contorted in pain and rage. Now that the ghost is here, it is time for the binding."
 POD_wraith_binding.200.wp:0 "不管怎样还是继续。"
 POD_wraith_binding.200.wp.tt_willpower:0 "[recipient.GetFirstNameNoTooltip] has exerted their will to better hide [recipient.GetHerHis] movements and clandestine conversations."
 POD_wraith_binding.200.blood.tt_success:00 "成功"
 POD_wraith_binding.200.wp.success.desc:0 "胜利"
 POD_wraith_binding.200.wp.tt_success:0 "[recipient.GetTitledFirstName]将听从于我！"
 POD_wraith_binding.200.wp.failure.desc:0 "失败"
 POD_wraith_binding.200.blood.tt_failure:0 "挫败"
 POD_wraith_binding.200.wp.tt_failure:0 "[recipient.GetTitledFirstName]抵抗了我约束尝试。"
 POD_wraith_binding.200.option.wp:0 "发挥我的意志。我将成为[recipient.GetHerHis]的主人！"
 POD_wraith_binding.200.blood:0 "Exert my will and blood. The abyss will grant me power over death and the dead."
 POD_wraith_binding.200.option.c:0 "Abandon this endevaour, I no longer wish to bind [recipient.GetHerHim]."
 POD_wraith_binding.200.option.c.tt:0 "该尝试将会失败。"
 POD_wraith_binding.300.t:0 "[recipient.GetFirstNameNoTooltip]的约束……"
 POD_wraith_binding.300.desc:0 "I have successfuly ivoked the dread powers of oblivion to force [recipient.GetTitledFirstName] into undying service. The question is, how strong is the binding?"
 POD_wraith_binding.300.option.a:0 "正如其所应当。"
 POD_wraith_binding.300.twolevels:0 "约束强度将增大两个等级！"
 POD_wraith_binding.300.threelevels:0 "约束强度将增大三个等级！"
 POD_wraith_binding.400.t:0 "约束住了！"
 POD_wraith_binding.400.desc:0 "Despite your efforts at fighting the dark powers of [actor.GetTitledFirstName], the magic has forced you to become an unwilling slave to [actor.GetHerHim]."
 POD_wraith_binding.400.option.a:0 "我的独立性……没了。"
 POD_wraith_binding.500.t:0 "约束失败"
 POD_wraith_binding.500.desc:0 "[recipient.GetTitledFirstName]抵抗了我约束[recipient.GetHerHim]的尝试。"
 POD_wraith_binding.500.option.a:0 "挫败！"
 POD_wraith_binding.600.t:0 "约束失败"
 POD_wraith_binding.600.desc:0 "[actor.GetTitledFirstName]已经放弃了[actor.GetTitledHerHis]尝试强制你服侍他的尝试。"
 POD_wraith_binding.600.option.a:0 "我的独立性安全了！"