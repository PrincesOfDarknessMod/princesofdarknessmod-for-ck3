l_simp_chinese:
 POD_wraith_binding.100.t:0 "魔法与意志的考验"
 POD_wraith_binding.100.desc:0 "当你作为一个死灵做你的死灵事时，你感到一股强大的力量将你拉向一个未知的地方。有人在搅乱你和凡界的联系！\n到达召唤室后，你遇到了你的召唤者——一位名叫[actor.GetFirstNameNoTooltip]的亡灵术师。缚灵仪式已经开始影响你并扭曲你的存在。"
 POD_wraith_binding.100.option.a:0 "我！不！会！被！控！制！"
 POD_wraith_binding.100.option.b:0 "当然抵抗。"
 POD_wraith_binding.100.option.c:0 "抵抗是徒劳的……我会报仇的，就是晚一点。"
 POD_wraith_binding.200.t:0 "魔法与意志的考验"
 POD_wraith_binding.200.desc:0 "仪式准备好了，你催动来自深渊的黑暗魔法，把目标死灵拉到你准备好的魔法阵里。\n通过在凡界的一个裂隙，[recipient.GetFirstNameNoTooltip]出现了，他的脸因痛苦和愤怒而扭曲。既然幽灵已经来了，就该是缚灵的时候了。"
 POD_wraith_binding.200.wp:0 "不管怎样还是继续。"
 POD_wraith_binding.200.wp.tt_willpower:0 "[recipient.GetFirstNameNoTooltip]发挥了其意志力来隐藏[recipient.GetHerHis]的移动并隐蔽了谈话。"
 POD_wraith_binding.200.blood.tt_success:00 "成功"
 POD_wraith_binding.200.wp.success.desc:0 "胜利"
 POD_wraith_binding.200.wp.tt_success:0 "[recipient.GetTitledFirstName]将听从于我！"
 POD_wraith_binding.200.wp.failure.desc:0 "失败"
 POD_wraith_binding.200.blood.tt_failure:0 "失败"
 POD_wraith_binding.200.wp.tt_failure:0 "[recipient.GetTitledFirstName]抵抗了我缚灵尝试。"
 POD_wraith_binding.200.option.wp:0 "发挥我的意志。我将成为[recipient.GetHerHis]的主人！"
 POD_wraith_binding.200.blood:0 "激起我的意志与血液。深渊将给我战胜死亡和死者的力量。"
 POD_wraith_binding.200.option.c:0 "放弃继续努力，我不再想要束缚[recipient.GetHerHim]。"
 POD_wraith_binding.200.option.c.tt:0 "该尝试将会失败。"
 POD_wraith_binding.300.t:0 "[recipient.GetFirstNameNoTooltip]之缚……"
 POD_wraith_binding.300.desc:0 "我成功引动了湮灭的可怖力量，使[recipient.GetTitledFirstName]永久的侍奉于我。问题是，束缚该多强？"
 POD_wraith_binding.300.option.a:0 "正如其所应当。"
 POD_wraith_binding.300.twolevels:0 "束缚强度将增大两个等级！"
 POD_wraith_binding.300.threelevels:0 "束缚强度将增大三个等级！"
 POD_wraith_binding.400.t:0 "缚灵成功！"
 POD_wraith_binding.400.desc:0 "你尝试抵抗[actor.GetTitledFirstName]的黑暗力量，但是那魔法还是强制你成为了[actor.GetHerHim]的非自愿奴隶。"
 POD_wraith_binding.400.option.a:0 "我的独立性……没了。"
 POD_wraith_binding.500.t:0 "缚灵失败"
 POD_wraith_binding.500.desc:0 "[recipient.GetTitledFirstName]抵抗了我缚灵[recipient.GetHerHim]的尝试。"
 POD_wraith_binding.500.option.a:0 "挫败！"
 POD_wraith_binding.600.t:0 "缚灵失败"
 POD_wraith_binding.600.desc:0 "[actor.GetTitledFirstName]已经放弃了[actor.GetTitledHerHis]尝试强制你服侍他的尝试。"
 POD_wraith_binding.600.option.a:0 "我的独立性安全了！"