l_simp_chinese:
 POD_spiritual_guidance.001.t:0 "精神指导"
 POD_spiritual_guidance.001.desc:0 "[student.GetFirstName] 过着罪孽深重的生活。你觉得你可以帮助 [student.GetHerHim] ，但 [student.GetSheHe] 会听吗？ 赎罪、赦罪的道路毕竟是一个漫长而艰辛的过程，并不适合所有人。"
 POD_spiritual_guidance.001.option.a:0 "我会帮助 [student.GetHerHim]"
 POD_spiritual_guidance.001.option.a.tt:0 "你试图帮助[student.GetFirstName]"
 POD_spiritual_guidance.001.option.b:0 "我没感到它"
 POD_spiritual_guidance.001.option.b.tt:0 "你放弃了帮助 [student.GetFirstName] 的尝试"
 POD_spiritual_guidance.002.t:0 "试图帮助"
 POD_spiritual_guidance.002.desc:0 "[teacher.GetFirstName] 走近你，提出要帮助你成为更好的神的仆人。你的回答会是什么？你可能在最终成为一个更好的人，或者只是在等待宝贵的时间，很难说。"
 POD_spiritual_guidance.002.option.a:0 "我欣然接受 [teacher.GetHerHis] 的提议"
 POD_spiritual_guidance.002.option.a.tt:0 "一堂课开始了"
 POD_spiritual_guidance.002.option.b:0 "我并不觉得这是我想要的走向"
 POD_spiritual_guidance.002.option.b.tt:0 "你拒绝"
 POD_spiritual_guidance.102.t:0 "抗拒"
 POD_spiritual_guidance.102.desc:0 "[student.GetFirstName]不想要你「帮助」 [student.GetHerHim]。看起来对他来说，救赎之路过于漫长了。上帝将是灵魂在末途的唯一审判。"
 POD_spiritual_guidance.102.option.a:0 "真遗憾……"
 POD_spiritual_guidance.102.option.a.tt:0 "[student.GetFirstName] 拒绝你的提议"
 POD_spiritual_guidance.202.t:0 "精神指导2"
 POD_spiritual_guidance.202.desc:0 "真正忠于职守的人，不应做出罪恶的行为。[student.GetFirstName]  还未准备好全心全意地侍奉上帝。而你神圣的使命就是帮助 [student.GetHerHim] 更好地去理解。你会成为他现在所需要的良师吗？"
 POD_spiritual_guidance.202.option.a:0 "你的色欲不能蒙蔽你的心智"
 POD_spiritual_guidance.202.option.a.tt:0 "你将尝试改掉[student.GetHerHis]的色欲"
 POD_spiritual_guidance.202.option.a.desc:0 "信仰考验"
 POD_spiritual_guidance.202.option.a.success:0 "成功"
 POD_spiritual_guidance.202.option.a.failure:0 "失败"
 POD_spiritual_guidance.202.option.a.failure.tt:0 "你未能帮助到 [student.GetFirstName]"
 POD_spiritual_guidance.202.option.b:0 "愤怒控制不了你"
 POD_spiritual_guidance.202.option.b.tt:0 "你将试着改掉[student.GetHerHis]的怒气"
 POD_spiritual_guidance.202.option.b.desc:0 "信仰考验"
 POD_spiritual_guidance.202.option.b.success:0 "成功"
 POD_spiritual_guidance.202.option.b.failure:0 "失败"
 POD_spiritual_guidance.202.option.b.failure.tt:0 "你没能帮到 [student.GetFirstName]"
 POD_spiritual_guidance.202.option.c:0 "你也不是那么的厉害"
 POD_spiritual_guidance.202.option.c.tt:0 "你会试着改掉 [student.GetHerHis] 傲慢的个性"
 POD_spiritual_guidance.202.option.c.desc:0 "信仰考验"
 POD_spiritual_guidance.202.option.c.success:0 "成功"
 POD_spiritual_guidance.202.option.c.failure:0 "失败"
 POD_spiritual_guidance.202.option.c.failure.tt:0 "你未能帮助到 [student.GetFirstName]"
 POD_spiritual_guidance.202.option.d:0 "你休息得太多了"
 POD_spiritual_guidance.202.option.d.tt:0 "你会试着改掉 [student.GetHerHis] 懒惰的个性"
 POD_spiritual_guidance.202.option.d.desc:0 "信仰考验"
 POD_spiritual_guidance.202.option.d.success:0 "成功"
 POD_spiritual_guidance.202.option.d.failure:0 "失败"
 POD_spiritual_guidance.202.option.d.failure.tt:0 "你未能帮助到 [student.GetFirstName]"
 POD_spiritual_guidance.202.option.e:0 "你吃太多了"
 POD_spiritual_guidance.202.option.e.tt:0 "你会试着改掉 [student.GetHerHis] 不良的饮食习惯"
 POD_spiritual_guidance.202.option.e.desc:0 "信仰考验"
 POD_spiritual_guidance.202.option.e.success:0 "成功"
 POD_spiritual_guidance.202.option.e.failure:0 "失败"
 POD_spiritual_guidance.202.option.e.failure.tt:0 "你未能帮助到 [student.GetFirstName]"
 POD_spiritual_guidance.202.option.f:0 "贪婪是不好的"
 POD_spiritual_guidance.202.option.f.tt:0 "你会试着改掉 [student.GetHerHis] 贪婪的个性"
 POD_spiritual_guidance.202.option.f.desc:0 "信仰考验"
 POD_spiritual_guidance.202.option.f.success:0 "成功"
 POD_spiritual_guidance.202.option.f.failure:0 "失败"
 POD_spiritual_guidance.202.option.f.failure.tt:0 "你未能帮助到 [student.GetFirstName]"
 POD_spiritual_guidance.202.option.g:0 "你的心长满着尖刺"
 POD_spiritual_guidance.202.option.g.tt:0 "你会试着改掉 [student.GetHerHis] 睚眦必报的个性"
 POD_spiritual_guidance.202.option.g.desc:0 "信仰考验"
 POD_spiritual_guidance.202.option.g.success:0 "成功"
 POD_spiritual_guidance.202.option.g.failure:0 "失败"
 POD_spiritual_guidance.202.option.g.failure.tt:0 "你未能帮助到 [student.GetFirstName]"
 POD_spiritual_guidance.302.t:0 "精神指导3"
 POD_spiritual_guidance.302.desc:0 "你设法去除了[student.GetHerHis]的罪恶。但你还没有完成，现在是时候向[student.GetFirstName]展示高尚的生活方式了。也许通过例子？只是要注意不要让自己陷入傲慢原罪。"
 POD_spiritual_guidance.302.option.a:0 "心胜于物"
 POD_spiritual_guidance.302.option.a.tt:0 "[student.GetFirstName]  变得守身如玉"
 POD_spiritual_guidance.302.option.b:0 "你应该知道什么时候该适可而止"
 POD_spiritual_guidance.302.option.b.tt:0 "[student.GetFirstName] 变得温和"
 POD_spiritual_guidance.302.option.c:0 "分享即是关怀"
 POD_spiritual_guidance.302.option.c.tt:0 "[student.GetFirstName] 变得慷慨"
 POD_spiritual_guidance.302.option.d:0 "你应该容忍他人"
 POD_spiritual_guidance.302.option.d.tt:0 "[student.GetFirstName] 变得宽容大量"
 POD_spiritual_guidance.302.option.e:0 "无论在什么情况下，你都要冷静"
 POD_spiritual_guidance.302.option.e.tt:0 "[student.GetFirstName] 变得冷静"
 POD_spiritual_guidance.302.option.f:0 "你不比别人好多少"
 POD_spiritual_guidance.302.option.f.tt:0 "[student.GetFirstName] 变得谦卑"
 POD_spiritual_guidance.302.option.g:0 "你将休于天堂"
 POD_spiritual_guidance.302.option.g.tt:0 "[student.GetFirstName] 变得勤奋"
 POD_spiritual_guidance.402.t:0 "失败的精神指导"
 POD_spiritual_guidance.402.desc:0 "[teacher.GetFirstName] 让你失望了！在所有这些讲道之后……有些人的灵魂注定不会被拯救。"
 POD_spiritual_guidance.402.option.a:0 "失望至极"
 POD_spiritual_guidance.402.option.a.tt:0 "精神指导失败了"
 POD_spiritual_guidance.502.t:0 "成功的精神指导"
 POD_spiritual_guidance.502.desc:0 "[teacher.GetFirstName] 成功地给你指明了正确的道路。你罪孽深重的日子快结束了，现在你要靠自己的力量变得更好。"
 POD_spiritual_guidance.502.option.a:0 "[teacher.GetSheHe] 的方法真的成功了！"
 POD_spiritual_guidance.502.option.a.tt:0 "你现在是一个更好的人"