l_simp_chinese:
 POD_imprison.002.title:0 "囚禁：[targetdefender.GetFirstName]"
 POD_imprison.002.desc:0 "你尝试囚禁[targetdefender.GetFirstName]，但是其竟敢抵抗你，你该做什么？"
 POD_imprison.002.option.a:0 "[targetdefender.GetFirstName]将听从于我！"
 POD_imprison.002.option.b:0 "[targetdefender.GetFirstName]无法抵挡我的魅惑。"
 POD_imprison.002.option.c:0 "我将手撕[targetdefender.GetHerHim]！"
 POD_imprison.002.option.d:0 "[attacker_marshal.GetFirstName]将让[targetdefender.GetHerHim]处于[targetdefender.GetHerHis]的位置！"
 POD_imprison.002.option.e:0 "[attacker_marshal.GetFirstName]肯定知道怎么抓住这种魔物！"
 POD_imprison.002.option.success:0 "[attacker.GetFirstName]胜利"
 POD_imprison.002.option.a.desc:0 "支配的冲突"
 POD_imprison.002.option.b.desc:0 "性格的冲突"
 POD_imprison.002.option.c.desc:0 "勇武的对决"
 POD_imprison.002.option.d.desc:0 "一场勇武的对决，你的军事统帅代表了你"
 POD_imprison.002.option.d.success:0 "[attacker_marshal.GetFirstName]胜利"
 POD_imprison.002.option.failure:0 "[targetdefender.GetFirstName]胜利"
 POD_imprison.002.option.a.tt.attacker_wins:0 "我支配了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.a.tt.attacker_lost:0 "[targetdefender.GetFirstName]的意志过于强大无法支配"
 POD_imprison.002.option.b.tt.attacker_wins:0 "我魅惑了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.b.tt.attacker_lost:0 "[targetdefender.GetFirstName]对我的魅力免疫。"
 POD_imprison.002.option.c.tt.attacker_wins:0 "我在个人决斗中战胜了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.c.tt.attacker_lost:0 "我在个人决斗中败给了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.d.tt.attacker_wins:0 "[attacker_marshal.GetFirstName]在个人决斗中战胜了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.d.tt.attacker_lost:0 "[attacker_marshal.GetFirstName]在个人决斗中败给了[targetdefender.GetFirstName]。"
 POD_imprison.102.title:0 "新的囚犯"
 POD_imprison.102.desc.dominate:0 "你成功的将[targetdefender.GetFirstName]的心智束绑在你的意志之下，现在[targetdefender.GetSheHe]将毫无意见的进入你的监狱。"
 POD_imprison.102.desc.presence:0 "你成功的使[targetdefender.GetFirstName]为了讨好你自愿进入[targetdefender.GetHerHis]的新监狱房间。"
 POD_imprison.102.desc.prowess:0 "你赢了。[targetdefender.GetFirstName]再也不能抵抗你。这将教会所有人反抗你的下场。"
 POD_imprison.102.desc.marshal:0 "[attacker_marshal.GetFirstName]战胜了[targetdefender.GetFirstName]。这将教会大家如何反对你权威的下场。"
 POD_imprison.102.option.a:0 "现在我该对你做什么？"
 POD_imprison.202.title:0 "战败"
 POD_imprison.202.desc:0 "你战败了，你的目标逃离了你。也许你该换个时机再次尝试？"
 POD_imprison.202.option.a:0 "这只是一次小挫折。"
 POD.imprison.302.title:0 "通过纯粹的意志"
 POD_imprison.302.desc.dominate:0 "你支配[targetdefender.GetFirstName]的尝试失败了。你可以尝试通过蛮力抓住[targetdefender.GetHerHim]。"
 POD_imprison.302.desc.presence:0 "[targetdefender.GetFirstName]抵抗住了你的魅惑。你可以尝试通过蛮力抓住[targetdefender.GetHerHim]。"
 POD_imprison.302.option.a:0 "[targetdefender.GetFirstName]逃不掉的！"
 POD_imprison.302.option.b:0 "我失败了……"
 POD_imprison.302.option.b.tt:0 "你的囚禁尝试失败了。[targetdefender.GetFirstName]将获得一个对你的弱牵制。"
 POD_imprison.002.desc.hunter:0 "你尝试囚禁一位地狱眷族，[targetdefender.GetFirstName]，但是蚂蟥不喜欢神的仆人抓他们。你该做什么？"
 POD_imprison.002.option.f:0 "现在不是时候"
 POD_imprison.002.option.e.desc:0 "你的军事能力对抗蚂蟥的勇武"
 POD_imprison.002.option.e.success:0 "[attacker_marshal.GetFirstName]抓住了一只邪恶的恶魔"
 POD_imprison.002.option.e.failure:0 "[targetdefender.GetFirstName]想出了办法逃跑"
 POD_imprison.002.option.e.tt.attacker_wins:0 "[targetdefender.GetFirstName]将在你的监狱里腐烂！"
 POD_imprison.002.option.e.tt.attacker_lost:0 "[targetdefender.GetFirstName]逃走了"
 POD_imprison.002.option.f.tt:0 "你不会停下囚禁[targetdefender.GetFirstName]的尝试。"
 POD_imprison.102.desc.hunter:0 "[attacker_marshal.GetFirstName]成功地利用吸血鬼的弱点抓住了这只邪恶的野兽，[targetdefender.GetFirstName]。这将教会每一只地狱眷族不要反对你。"
 POD_imprison.202.desc.hunter:0 "[attacker_marshal.GetFirstName]失败了。其的计划没有成功，现在该魔鬼化身，[targetdefender.GetFirstName]，逃走了！也许你该在合适的时候再试一次？"