 POD_chargen.2.option.h:0 "木乃伊"
 POD_chargen.2.option.i:0 "死灵"
 POD_chargen.3.t:0 "初代"
 POD_chargen.3.desc:0 "谁是吸血鬼的始祖？"
 POD_chargen.3.option.a:0 "如挪得之书所写：被天主诅咒的该隐"
 POD_chargen.3.option.i:0 "阿什拉派说是被真主所诅咒的加音"
 POD_chargen.3.option.c:0 "故事说吸血鬼是卡根的后代"
 POD_chargen.3.option.b:0 "黑暗之母说吸血鬼有很多起源"
 POD_chargen.3.option.h:0 "对奥西里斯进行报复的赛特"
 POD_chargen.3.option.g:0 "被奥丁用如尼符文救活的将死战士卡纳尔"
 POD_chargen.3.option.f:0 "由卑帝利所创造，被吒婆多修罗所猎杀的堕落仆众"
 POD_chargen.3.option.e:0 "受诅的万鬼，万千鬼怪"
 POD_chargen.3.option.d:0 "我不知道吸血鬼从哪来"
 POD_chargen.3.option.j:0 "也许我不是吸血鬼……"
 POD_chargen.3.option.j.tt:0 "你重新考虑扮演哪种超自然生物。"
 POD_chargen.4.t:0 "次代"
 POD_chargen.4.desc:0 "你的[clan|E]从哪位该隐的子嗣遗传而来？"
