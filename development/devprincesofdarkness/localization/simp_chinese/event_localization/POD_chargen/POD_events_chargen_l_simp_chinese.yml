 POD_chargen.1300.t:0 "返祖血仆"
 POD_chargen.1300.desc:0 "吞噬着他们的吸血鬼侍主的血的血奴，这些血仆获得了血族的一部分力量。他们的一些孩子出生时血管里就有吸血鬼的血液。随着对血的掌握，他们比他们的父母更强大。通常称之“返祖血仆”，而棘秘魑[clan|E]的血仆后裔则被称为“家传血仆”。你是从哪一系的返祖血仆来的？"
