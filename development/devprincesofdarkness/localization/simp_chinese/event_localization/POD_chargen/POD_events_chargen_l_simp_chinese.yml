 POD_chargen.1360.option.c:0 "我带领着支系家族。"
 POD_chargen.1370.t:0 "潜藏"
 POD_chargen.1370.desc:0 "血之缄默是指将你的超自然本性的秘密保密于凡人。如果血畜知道你是怪物，它们将会试图消灭你。或更糟。其他超自然生物也会来摧毁你以确保他们自己的生存。另一些超自然反而会拒绝隐藏，而是陶醉于揭露其怪物本性所带来的恐惧之中。在公共场合使用明显的超自然力量，或不仔细掩盖吸食后留下的尸体线索；所有这些都会增加返祖血仆的[masquerade|E]暴露度。"
 POD_chargen.1370.option.a:0 "我的超自然本性被隐藏起来了。"
 POD_chargen.1380.t:0 "饥渴"
 POD_chargen.1380.desc:0 "心兽是饥渴的。吸血鬼靠血来维持他们的永生。血液也助长了他们的超自然力量。那血还在返祖血仆的血管里流淌。使用你的超能力如[disciplines|E]或神奇治愈力量将会增加你的饥渴度。返祖血仆对吸血鬼的血越饥渴，他们就会变得越不理智，越绝望，越暴力，越紧张。随着时间的推移，返祖血仆会将他们的一部分血变成吸血鬼血……有效地互相残食。返祖血仆还可以通过摄取吸血鬼的血来减少饥渴。"
 POD_chargen.1380.option.a:0 "我敢使用我的黑暗天赋的力量吗？"
 POD_chargen.900.t:0 "学会"
 POD_chargen.900.desc:0 "你属于那支末卡维的秘密学会？"
 POD_chargen.900.option.a:0 "解密会"
 POD_chargen.900.option.b:0 "狂喜会"
 POD_chargen.900.option.c:0 "为恶会"
 POD_chargen.1400.t:0 "裁判所的修士会"
 POD_chargen.1400.desc:0 "裁判所被分为数个修士会，每个修士会都有数个特点。\n亚柯骑士和圣雅各伯之剑是军事骑士团，通过授任有资格的候选人来获得继承人。他们都发誓保持独身。\n圣约翰修女会是有经验的管理人员，但只是管理女性。作为修女，她们也没有传统意义上的家庭。\n神目，裁判所的间谍头目，也有是能授任成员，但也可以拥有家庭。\n红修会，探究神秘的研究人员，能授任男人也能授任女人。\n最后，贵族家族冯·穆尔瑙如同一个正常的中世纪家庭，但每个成员在成年后都有机会成为猎人。"
 POD_chargen.1400.option.a:0 "亚柯骑士"
 POD_chargen.1400.option.b:0 "圣雅各伯之剑"
 POD_chargen.1400.option.c:0 "圣约翰修女会"
 POD_chargen.1400.option.d:0 "神目"
 POD_chargen.1400.option.e:0 "红修会"
 POD_chargen.1400.option.f:0 "冯·穆尔瑙"
 POD_chargen.1400.option.g:0 "其他非暗影裁判所的猎人"
 POD_chargen.1400.option.h:0 "也许我并非是猎人"
 POD_chargen.1500.t:0 "受猎猎人"
 POD_chargen.1500.desc:0 "并不是所有的猎人属于暗影裁判所的一部分。许多人知晓黑暗世界的怪物，他们选择用勇气和决心去战斗。一些猎人曾经是暗影裁判所的成员，但觉得教会的要求过于繁琐而离开了教廷；但他们继续猎杀着不死族。但并不是所有的猎人都是出于高尚的原因而去追捕非生者。\n在1230年，要想成为一名不属于“暗影裁判所”的猎人是一件更加困难的事情。"
 POD_chargen.1500.option.a:0 "具有真信的独立猎人"
 POD_chargen.1500.option.b:0 "没有真信的独立猎人"
 POD_chargen.1500.option.c:0 "士，东方猎人"
 POD_chargen.1500.option.d:0 "回到暗影裁判所"
 POD_chargen.1500.option.e:0 "也许我并非是猎人"
