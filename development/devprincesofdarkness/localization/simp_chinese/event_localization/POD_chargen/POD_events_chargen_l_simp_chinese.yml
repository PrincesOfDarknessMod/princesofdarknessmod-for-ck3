l_simp_chinese:
 POD_chargen.1.t:0 "欢迎来到背景生成器"
 POD_chargen.1.desc:0 "通过这个事件链，你将能定制你在《黑暗世界》中的角色。这个过程会移除你所有的超自然特质。你将能选择你的超自然生物类型，你的[clan|E]，你的家族，你的辈代，你可能的[Sire|E]，你的[disciplines|E]，你的心路，和你的掠食者类型。\n\n根据你目前的蓝本角色，你可能会被移除一些遗留亲属。"
 POD_chargen.1.option.a:0 "我真的想使用背景生成器"
 POD_chargen.1.option.a.tt:0 "#R 请确认你想要这么做！操作无法恢复！这会清空你所有的超自然特质，修正和秘密！！！#！"
 POD_chargen.1.option.b:0 "什么也不改并退出背景生成器"
 POD_chargen.2.t:0 "夜间何物出没？"
 POD_chargen.2.desc:0 "你是哪种超自然生物？"
