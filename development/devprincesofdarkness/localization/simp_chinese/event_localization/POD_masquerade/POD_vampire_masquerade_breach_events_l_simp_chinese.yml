l_simp_chinese:
 POD_vampire_masquerade_breach.100.title:0 "潜藏的疏漏"
 POD_vampire_masquerade_breach.100.desc:0 "[mortal.GetTitledFirstName]看到了你打破了血之缄默，发现了你是个吸血鬼。潜藏被打破了。应该怎么处理他们？"
 POD_vampire_masquerade_breach.100.a:0 "让他们忘了这事。"
 POD_vampire_masquerade_breach.100.b:0 "暂时无视他们。"
 POD_vampire_masquerade_breach.100.c:0 "贿赂他们来闭嘴"
 POD_vampire_masquerade_breach.100.d:0 "杀了他们。"
 POD_vampire_masquerade_breach.100.e:0 "吸干[mortal.GetTitledFirstName]的血，杀了。"
 POD_vampire_masquerade_breach.100.d.tt.beast:0 "#R 猎物已经察觉到了掠食者的气息——现在动手，以免成为别人的猎物。"
 POD_vampire_masquerade_breach.100.e.tt.beast:0 "#R 一石二鸟！"
 POD_vampire_masquerade_breach.100.d.notwounded:0 "你毫发无伤地战胜了弱小的凡人"
 POD_vampire_masquerade_breach.100.d.wounded:0 "该凡人有些……麻烦。"
 POD_vampire_masquerade_breach.100.d.woundedtoast:0 "在断气之前，[mortal.GetTitledFirstName]成功击伤了你。"
 POD_vampire_masquerade_breach.100.d.woundedtoastitle:0 "负伤"
 POD_vampire_masquerade_breach.300.title:0 "潜藏的疏漏"
 POD_vampire_masquerade_breach.300.desc:0 "[mortal.GetTitledFirstName]看到了[vampire_exposes_masquerade.GetTitledFirstName]违反了血之缄默，发现了[vampire_exposes_masquerade.GetFirstName]是个吸血鬼。潜藏被打破了。应该怎么处理[mortal.GetFirstName]？"
 POD_vampire_masquerade_breach.300.a:0 "让[mortal.GetTitledFirstName]失忆。"
 POD_vampire_masquerade_breach.300.b:0 "暂时无视[mortal.GetTitledFirstName]。"
 POD_vampire_masquerade_breach.300.c:0 "给[mortal.GetTitledFirstName]一笔封口费。"
 POD_vampire_masquerade_breach.300.d:0 "杀了[mortal.GetTitledFirstName]。"
 POD_vampire_masquerade_breach.400.title:0 "潜藏的疏漏"
 POD_vampire_masquerade_breach.400.desc:0 "[vampire_exposes_masquerade.GetTitledFirstName]违反了血之缄默，发现了其是吸血鬼。潜藏被打破了。应该怎么处理[vampire_exposes_masquerade.GetFirstName]？"
 POD_vampire_masquerade_breach.400.a:0 "原谅[vampire_exposes_masquerade.GetTitledFirstName]以换取一个人情。"
 POD_vampire_masquerade_breach.400.b:0 "原谅[vampire_exposes_masquerade.GetTitledFirstName]"
 POD_vampire_masquerade_breach.400.c:0 "命令我的下仆逮捕[vampire_exposes_masquerade.GetTitledFirstName]"
 POD_vampire_masquerade_breach.400.d:0 "这不是原谅或忘记[vampire_exposes_masquerade.GetTitledFirstName]"
 POD_vampire_masquerade_breach.400.c.Arrest:0 "[vampire_exposes_masquerade.GetTitledFirstName]被锁链拷上带到了我的地牢。"
 POD_vampire_masquerade_breach.400.c.ArrestNotificationtitle:0 "疏漏遏制住了"
 POD_vampire_masquerade_breach.400.c.ArrestNotification:0 "[vampire_exposes_masquerade.GetTitledFirstName]被囚禁了"
 POD_vampire_masquerade_breach.400.c.Escape:0 "[vampire_exposes_masquerade.GetTitledFirstName]逃脱了捕捉"
 POD_vampire_masquerade_breach.400.c.EscapeNotificationtitle:0 "[vampire_exposes_masquerade.GetTitledFirstName]逃跑了！"
 POD_vampire_masquerade_breach.400.c.EscapeNotification:0 "我的下仆没能带回来[vampire_exposes_masquerade.GetTitledFirstName]。#R 无能之辈。"
 POD_opinion_breached_masquerade:0 "破漏了的潜藏"
 POD_masquerade_breach:0 "潜藏破漏"
 POD_masquerade_breach_desc:0 "一个吸血鬼违反了血之缄默。潜藏被打破了。"
 trait_POD_knows_too_much:0 "知道的太多"
 trait_POD_knows_too_much_desc:0 "该凡人于一瞥之下见证了超自然并活了下来……目前而言。"