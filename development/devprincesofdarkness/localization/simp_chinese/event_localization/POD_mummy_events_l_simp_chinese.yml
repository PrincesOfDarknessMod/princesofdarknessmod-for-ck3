l_simp_chinese:
 alchemy_preparaion_head:0 "炼金："
 podmummy.1000.t:0 "$alchemy_preparaion_head$收集材料"
 podmummy.1000.desc:0 "你收集了哪些材料？"
 podmummy.1000.a:0 "常见材料"
 podmummy.1000.b:0 "罕见材料"
 podmummy.1000.c:0 "稀有材料"
 podmummy.1000.d:0 "珍稀材料"
 podmummy.1000.e:0 "独特材料"
 podmummy.1010.t:0 "$alchemy_preparaion_head$鉴定"
 podmummy.1010.desc:0 "知识就是力量。具体了解任何物体、生物或物质的组成，就能使炼金术师对其有所掌控。炼金术师能意识到物质的固有特性，而这些特性是单纯的化学家所无法发现的。"
 podmummy.1010.b:0 "只用学识来鉴定"
 podmummy.1010.a:0 "使用能力来鉴定"
 podmummy.1010.fail:0 "失败"
 podmummy.1010.fail_result:0 "材料失去了略微的有效度"
 podmummy.1010.critical_fail:0 "大失败"
 podmummy.1010.critical_fail_result:0 "材料失去了所有的有效度"
 podmummy.1110.t:0 "$alchemy_preparaion_head$嬗变"
 podmummy.1110.desc:0 "许多炼金术过程仅仅是为了将一种物质变成另一种物质，比如众所周知的从贱金属中创造黄金的追求。其结果可能是原本物质的提纯形式，全新的物质，又或者是奇怪的混合物。"
 podmummy.1110.a:0 "使用能力来嬗变"
 podmummy.1110.b:0 "使用能力来停滞"
 podmummy.1110.fail:0 "失败"
 podmummy.1110.fail_result:0 "材料失去跟你的溯源技能等级成正比的有效度。"
 podmummy.1210.t:0 "$alchemy_preparaion_head$催化"
 podmummy.1210.desc:0 "许多炼金术制剂的主要目标是能够引起其他物质或形式的变化。在极度熟练后，炼金术师甚至可以把自己的身体变成催化剂，以引起周围世界的变化。"
 podmummy.1210.a:0 "我成功了！"
 podmummy.1999.t:0 "$alchemy_preparaion_head$结果"
 podmummy.1999.desc_super_fail:0 "爆炸！你受伤了。"
 podmummy.1999.desc_fail:0 "你制作出了失败作。"
 podmummy.1999.desc_trash:0 "空无"
 podmummy.1999.desc_comma:0 "、"
 podmummy.1999.a:0 "啊啊！"
 podmummy.1999.b:0 "我不需要这个……"
 podmummy.1999.c:0 "就这样吧。"
 podmummy.700.t:0 "尸幕"
 podmummy.700.desc:0 "冥界与皮肤之地被一个被称为”尸幕“的神秘屏障分开。尸幕使大多数生物无法感知暗影之地，并使死人无法看到皮肤之地的活动。它在部分地区极其强大，于某些地方又极其薄弱，但它无处不在永不缺席。\n\n你可以通过能力将尸幕强化或弱化，如果被提升到10，当地的灵类得耗费意志力不然必须逃离本地。"
 podmummy.700.a:0 "增强尸幕。"
 podmummy.700.b:0 "削弱尸幕。"
 amulet_creation_head:0 "护符制作："
 podmummy.2000.t:0 "$amulet_creation_head$收集材料"
 podmummy.2000.desc:0 "你收集了哪些材料？"
 podmummy.2010.t:0 "$amulet_creation_head$升阶"
 podmummy.2010.desc:0 "你已经想办法精炼了一次这些材料，你应该马上开始制作护符吗？"
 podmummy.2010.a:0 "它能更上一层。"
 podmummy.2010.b:0 "已经够了。"
 podmummy.2010.fail:0 "失败"
 podmummy.2010.fail_result:0 "你被迫以制作当前等级的护符。"
 podmummy.2999.t:0 "$amulet_creation_head$结果"
 podmummy.2999.desc:0 "你开始创作护符，你想要做哪一个？"
 podmummy.1010.critical_success:0 "大成功"
 podmummy.1010.critical_success_result:0 "材料取得了双倍的有效度"
 podmummy.1010.success:0 "成功"
 podmummy.1010.success_result:0 "材料取得了略微的有效度"
 podmummy.1110.success:0 "成功"
 podmummy.1110.success_result:0 "材料取得跟你的溯源技能等级成正比的有效度"
 podmummy.1999.desc_success_opening:0 "在长久的制作过程之后，你取得了："
 podmummy.1999.desc_success_ending:0 "在你的炼金产物槽位。"
 podmummy.2010.success:0 "成功"
 podmummy.2010.success_result:0 "你将制造更高一级的护符"
 effigy_creation_head:0 "俑像制作："
 podmummy.3000.t:0 "$effigy_creation_head$收集材料"
 podmummy.3000.desc:0 "你收集了哪些材料？"
 podmummy.3010.t:0 "$effigy_creation_head$升阶"
 podmummy.3010.desc:0 "你已经想办法精炼了一次这些材料，你应该马上开始制作俑像吗？"
 podmummy.3010.a:0 "它能更上一层。"
 podmummy.3010.b:0 "就这样吧。"
 podmummy.3010.success:0 "成功"
 podmummy.3010.success_result:0 "你将制造更高一级的俑像"
 podmummy.3010.fail:0 "失败"
 podmummy.3010.fail_result:0 "你被迫以制作当前等级的俑像。"
 podmummy.3999.t:0 "$effigy_creation_head$结果"
 podmummy.3999.desc:0 "你开始创作俑像，你想要做哪一个？"
 learning_true_names_head:0 "学习真名"
 podmummy.4000.t:0 "$learning_true_names_head$选择"
 podmummy.4000.desc:0 "你想要干什么？"
 podmummy.4000.a:0 "练习发音。"
 podmummy.4000.b:0 "学习新的真名"
 podmummy.4100.t:0 "$learning_true_names_head$练习发音"
 podmummy.4100.desc:0 "真名魔法来得并不容易。真名必须被理解，并以严格的方式发音。一个不耐烦的书写人会发现，她说得不恰当的列涅不会产生任何效果。"
 podmummy.4100.a:0 "我有时间。"
 podmummy.4101.t:0 "$learning_true_names_head$调音方法"
 podmummy.4101.desc_nasal:0 "你练习了如何正确发出鼻音辅音。"
 podmummy.4101.desc_plosive:0 "你练习了如何正确发出塞音辅音。"
 podmummy.4101.desc_trill:0 "你练习了如何正确发出颤音辅音。"
 podmummy.4101.desc_flap:0 "你练习了如何正确发出闪音辅音。"
 podmummy.4101.desc_fricative:0 "你练习了如何正确发出擦音辅音。"
 podmummy.4101.desc_approximant:0 "你练习了如何正确发出近音辅音。"
 podmummy.4101.desc_lateral:0 "你练习了如何正确发出边音辅音。"
 podmummy.4101.desc_clicks:0 "你练习了如何正确发出搭嘴音辅音。"
 podmummy.4101.desc_implosive:0 "你练习了如何正确发出內爆音辅音。"
 podmummy.4101.desc_ejective:0 "你练习了如何正确发出挤喉音辅音。"
 podmummy.4101.desc_affricate:0 "你练习了如何正确发出塞擦音辅音。"
 podmummy.4101.desc_vowels:0 "你练习了如何正确发出元音。"
 podmummy.4101.a:0 "咳咳。"
 podmummy.4200.t:0 "$learning_true_names_head$发现新名"
 podmummy.4200.desc:0 "学习一个真名并不是简单的听一次名字就可以了。它是一个将名字分解成各个组成它的词，学习每个词的含义，学习它们的正确发音和节奏，然后将它们重新组合成列涅的课题。"
 podmummy.4200.a:0 "这需要时间和投入。"
 podmummy.4201.t:0 "$learning_true_names_head$新名发现"
 podmummy.4201.desc_opening:0 "你成功发现了一个新列涅 ——"
 podmummy.4201.desc_self:0 "”自己“"
 podmummy.4201.desc_fallback:0 "或你并没发现任一个。"
 podmummy.4201.desc_ending:0 "！"
 podmummy.4201.a:0 "我很欣慰。"