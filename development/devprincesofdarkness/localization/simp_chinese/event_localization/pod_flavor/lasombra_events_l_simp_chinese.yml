l_simp_chinese:
 pod_lasombraevents.1.n:0 "寻脸"
 pod_lasombraevents.1.desc:0 "脸。你在过去已经敏锐地意识到了它们。无论是凡人、吸血鬼还是一堆排列整齐的石头，所有东西都有一张脸。当然，也包括你。只是，跟你[clan|E]所有人一样，你被诅咒再也见不着你的脸和你的身体。你有多久没有看到自己的倒影了？你到底有没有见过它？许久以前你还是个凡人……而当其他人第一次看到你时，他们有什么反应？他们是害怕，还是陶醉，还是在你背后笑？\n这些问题影响你太多了，现在是时候做点什么了。最直接的方法是聘请一位艺术家，让其为你画像。至少，这可能会减轻你的痛苦。"
 pod_lasombraevents.1.loverdesc:0 "脸。你在过去已经敏锐地意识到了它们。无论是凡人、吸血鬼还是一堆排列整齐的石头，所有东西都有一张脸。当然，也包括你。只是，跟你[clan|E]所有人一样，你被诅咒再也见不着你的脸和你的身体。你有多久没有看到自己的倒影了？你到底有没有见过它？许久以前你还是个凡人……而当其他人第一次看到你时，他们有什么反应？他们是害怕，还是陶醉，还是在你背后笑？\n这些问题影响你太多了，现在是时候做点什么了。最直接的方法是聘请一位艺术家，让其为你画像。你也可以让你的爱人[helper.GetTitledFirstName]对你进行一个漂亮的描述，也许有用？"
 pod_lasombraevents.1.a:0 "我需要一幅画像……"
 pod_lasombraevents.1.b:0 "我不需要它。"
 pod_lasombraevents.1.c:0 "呵！我不需要！"
 pod_lasombraevents.1.d:0 "我会寻求帮助。"
 pod_lasombraevents.1.a.t:0 "你雇佣了一名艺术家来为你画像。"
 pod_lasombraevents.1.b.t:0 "你有更重要的事需要花钱"
 pod_lasombraevents.1.b.beast:0 "#R 你不需要任何东西。你有我。#!"
 pod_lasombraevents.1.c.t:0 "你总是看起来不错。"
 pod_lasombraevents.1.d.t:0 "而你会得到帮助。"