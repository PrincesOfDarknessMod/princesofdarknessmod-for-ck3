l_simp_chinese:
 POD_demon_maintenance.10.t:0 "容器"
 POD_demon_maintenance.10.desc:0 "为了留在尘世中，恶魔必须居住在某种物理容器中。恶魔憎恨他们的容器，一个他们必须躲在其中的上帝的无用世界里的壳；虽然比虚无空荡的深渊要好，但容器仍然是某种形式的监狱，在肉体中度过的每一刻都是另一个憎恨上帝的理由。他们期待着有一天能把整个物质世界点燃，在他们令人憎恶的灵国里舒适地观看光辉地毁灭。"
 POD_demon_maintenance.10.option.a:0 "我附身在人类宿主中。"
 POD_demon_maintenance.10.option.b:0 "我处于石之牢狱之中。"
 POD_demon_maintenance.10.option.c:0 "我缚于大地。"
 POD_demon_maintenance.10.option.c.tt:0 "你将无法移动你的首都或成为指挥官，且会在首都被占后退位。"
 reliquarie_destroyed_notification:0 "宿匣被毁"
 POD_demon_maintenance.11.t:0 "石之监牢"
 POD_demon_maintenance.11.desc:0 "大多数落入尘世的恶魔都存在宿匣中，这些宿匣是由它们的崇拜者创造出来供它们居住的无生命物体。当恶魔被召唤时，仪式会集中在宿匣上；恶魔会出现在宿匣中，它的灵与物品的物融为一体。"
 POD_demon_maintenance.11.option.a:0 "我宿于武器"
 POD_demon_maintenance.11.option.b:0 "我宿于盔甲"
 POD_demon_maintenance.11.option.c:0 "我宿于权器"
 POD_demon_maintenance.11.option.d:0 "我宿于书"
 POD_demon_maintenance.11.option.e:0 "我宿于家具"
 POD_demon_maintenance.11.option.f:0 "我宿于饰品"
 artifact_reliquarie_name:0 "宿匣"
 artifact_reliquarie_description:0 "#Bold 若宝物被摧毁，附身于此的[GetTrait('demon').GetName( GetNullCharacter )]将失去[GetTrait('earthbound').GetName( GetNullCharacter )][trait|E]。#!\n有着[owner.GetTitledFirstNameNoTooltip]灵魂于此，此宿匣取得了[GetTrait('demon').GetName( GetNullCharacter )]的部分特性。"
 POD_demon_arcana.100.t:0 "购买野兽军火"
 POD_demon_arcana.100.desc:0 "获得新兽性武器。"
 artifact_new_reliquarie_name:0 "恶魔之[this_artifact.GetNameNoTooltip]"
 artifact_new_reliquarie_desc:0 "[this_artifact.GetDesc]\n\n有着[owner.GetTitledFirstNameNoTooltip]附身于它，此宿匣取得了[GetTrait('demon').GetName( GetNullCharacter )]的部分特性。"
 artifact_old_reliquarie_desc:0 "[this_artifact.GetDesc]\n\n[owner.GetTitledFirstNameNoTooltip]不再附身于此宝物。"