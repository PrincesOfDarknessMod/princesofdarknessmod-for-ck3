l_simp_chinese:
 podregionalpersons.2.t:0 "被猎猎人"
 podregionalpersons.2.desc:0 "一段时间以来，你的随从们都在谈论在你的区域有一位在猎杀该隐之子的凡人的传言。很明显，在大多数情况下，凡人的这种行为中很少能成功，特别是当他们走一条独狼之路时，就像这个人似乎在做的那样。\n有趣的是，尽管有这些缺点，这位猎人已经显示出一些早期性成功，许多黑暗的小巷因为他而变得安全。他的行踪诡秘，你真的不确定他会袭击哪里，甚至他会不会袭击。但如果你愿意的话，你可以让间谍在民众间追踪他。"
 podregionalpersons.2.a:0 "我需要知道关于他的一切"
 podregionalpersons.2.custom:0 "请注意，可能会有严重的后果......"
 podregionalpersons.2.b:0 "这与我无关"
 podregionalpersons.2.customb:0 "你不会再听到他的消息了"
 podregionalpersons.2.c:0 "我需要知道关于他的一切"
 podregionalpersons.2.customc:0 "也许你可以招揽这个人才？"
 podregionalpersons.4.t:0 "被猎猎人2"
 podregionalpersons.4.desc:0 "You found him. This elusive hunter is one Karl Schrekt from Vienna. A man of few words, he was difficult to track down, and even more difficult to assess.\nThe zeal of God's fury burns inside him, that is plain to see, but it is tainted by a bitterness that makes him unaware of the suffering he causes during his hunts. You fear that his soul is on the brink, and God's army will lose an impressive man if his faith falters even more.\nPerhaps you can remind him of the glory of God and shows him the virtues of working in a coherent group? It will be an hard debate though, as the man is nothing if not stubborn..."
 podregionalpersons.4.a:0 "教友，留心上帝的教诲"
 podregionalpersons.4.effect.success.desc:0 "你成功地说服卡尔加入了你的事业"
 podregionalpersons.4.success:0 "卡尔加入了你！"
 podregionalpersons.4.failure.effect.desc:0 "你的信仰受到了考验，但你最终还是说服了他。"
 podregionalpersons.4.failure:0 "卡尔加入了你！"
 podregionalpersons.4.critical.failure.effect.desc:0 "他迷失在光明之中..."
 podregionalpersons.4.critical.failure:0 "卡尔走了"
 podregionalpersons.4.c:0 "他已经走得太远了"
 podregionalpersons.3.t:0 "被猎猎人2"
 podregionalpersons.3.desc:0 "在你的区域内制造混乱的独行猎人仍然在躲避你，但你至少对他的作案手法有了一个大致的了解。有了这样的认识，你已经设计了两个行动计划来误导他，并希望能抓住这个人。\n这两个计划都需要你牵线搭桥，很可能会引起你行动上不必要的注意。不过你现在不能退缩，因为似乎猎人本人也在向你的位置靠拢......。此时的对抗是不可避免的。"
 podregionalpersons.3.a:0 "我们给他设个圈套吧"
 podregionalpersons.3.b:0 "我比较喜欢直接对峙"
 podregionalpersons.5.t:0 "被猎猎人3"
 podregionalpersons.5.desc:0 "You must confess that you are somewhat nervous. At this time, your agents must be waiting at the old manor you set up as a front to trap the elusive hunter. You know his name now, Karl Schrekt from Vienna, a lone wolf with a drive rarely seen even among his zealous kind. You are fairly confident that you planned your trap well, and your men are good enough to subdue him.\nBut... if he were to escape, or worse, kill your men, he would deal a very serious blow to your control over the area. And you would also have lost your only chance of capturing him."
 podregionalpersons.5.a:0 "现在没有回头路了"
 podregionalpersons.5.effect.success.desc:0 "计划顺利进行"
 podregionalpersons.5.success:0 "我们抓到他了！"
 podregionalpersons.5.failure.effect.desc:0 "他造成了一些伤害，但你赢了"
 podregionalpersons.5.failure:0 "我们抓到他了！……差点"
 podregionalpersons.5.critical.failure.effect.desc:0 "卡尔耍弄了你的探员后逃跑了"
 podregionalpersons.5.critical.failure:0 "他抓到我们了……"
 podregionalpersons.6.t:0 "被猎猎人3"
 podregionalpersons.6.desc:0 "Average attendance at your court tonight when, suddenly, several torches come tumbling from nowhere in the middle of the room. You barely manage to contain your terrified Beast as the cries of horror and frenzying vampires are heard all around you.\nAs you attempt to flee the chaotic scene, an hooded figure blocks your way, seemingly unaware of the fire raging around you.\nNot saying a word, he starts closing in on you, a burning torch on each hand. The maddening zeal in his eyes leaves no doubt, it looks like the elusive lone wolf hunter found you before you found him..."
 podregionalpersons.6.a:0 "阻止他！快！"
 podregionalpersons.6.effect.success.desc:0 "你设法制服并抓住他！"
 podregionalpersons.6.success:0 "我们抓到他了！"
 podregionalpersons.6.failure.effect.desc:0 "他造成了一些伤害，但你赢了"
 podregionalpersons.6.failure:0 "我们抓到他了！……差点"
 podregionalpersons.6.critical.failure.effect.desc:0 "你最后看到的是火，到处都是火"
 podregionalpersons.6.critical.failure:0 "好暖……"