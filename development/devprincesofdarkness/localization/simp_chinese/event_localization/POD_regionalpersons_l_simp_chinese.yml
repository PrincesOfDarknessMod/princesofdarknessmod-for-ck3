l_simp_chinese:
 podregionalpersons.2.t:0 "被猎猎人"
 podregionalpersons.2.desc:0 "一段时间以来，你的随从们都在谈论在你的区域有一位在猎杀[cainites|E]的凡人的传言。很明显，在大多数情况下，凡人的这种行为中很少能成功，特别是当他们走一条独狼之路时，就像这个人似乎在做的那样。\n有趣的是，尽管有这些缺点，这位猎人已经显示出一些早期性成功，许多黑暗的小巷因为他而变得安全。他的行踪诡秘，你真的不确定他会袭击哪里，甚至他会不会袭击。但如果你愿意的话，你可以让间谍在民众间追踪他。"
 podregionalpersons.2.a:0 "我需要知道关于他的一切"
 podregionalpersons.2.custom:0 "请注意，可能会有严重的后果……"
 podregionalpersons.2.b:0 "这与我无关"
 podregionalpersons.2.customb:0 "你不会再听到他的消息了"
 podregionalpersons.2.c:0 "我需要知道关于他的一切"
 podregionalpersons.2.customc:0 "也许你可以招揽这个人才？"
 podregionalpersons.4.t:0 "被猎猎人2"
 podregionalpersons.4.desc:0 "你找到了他。这个难以捉摸的猎人叫卡尔·施瑞克，来自维也纳。他是个沉默寡言的人，很难被追踪，更难以评估他的为人。\n上帝之怒的狂热在他体内燃烧，这很显而易见的，但它被一种苦所污染，使他未能察觉他在猎杀过程中造成的痛苦。你担心他的灵魂濒临崩溃，如果他的信仰再次动摇，上帝的军队就将失去一个了不起的人。\n也许你可以让他想起上帝的荣耀，向他展示在一个协调一致的团队中合作的美德？但这将是一场激烈的辩论，因为这个人很固执……"
 podregionalpersons.4.a:0 "教友，留心上帝的教诲"
 podregionalpersons.4.effect.success.desc:0 "你成功地说服卡尔加入了你的事业"
 podregionalpersons.4.success:0 "卡尔加入了你！"
 podregionalpersons.4.failure.effect.desc:0 "你的信仰受到了考验，但你最终还是说服了他。"
 podregionalpersons.4.failure:0 "卡尔加入了你！"
 podregionalpersons.4.critical.failure.effect.desc:0 "他迷失在光之中……"
 podregionalpersons.4.critical.failure:0 "卡尔走了"
 podregionalpersons.4.c:0 "他已经走得太远了"
 podregionalpersons.3.t:0 "被猎猎人2"
 podregionalpersons.3.desc:0 "在你的区域内制造混乱的独行猎人仍然在躲避你，但你至少对他的作案手法有了一个大致的了解。有了这样的认识，你已经设计了两个行动计划来误导他，并希望能抓住这个人。\n这两个计划都需要你牵线搭桥，很可能会引起你行动上不必要的注意。不过你现在不能退缩，因为似乎猎人本人也在向你的位置靠拢……此时的对抗是不可避免的。"
 podregionalpersons.3.a:0 "我们给他设个圈套吧"
 podregionalpersons.3.b:0 "我比较喜欢直接对峙"
 podregionalpersons.5.t:0 "被猎猎人3"
 podregionalpersons.5.desc:0 "你必须承认你有些紧张。此时，你的派员们一定在你设下的旧庄园里等着，你要以此为掩护诱捕那个难以捉摸的猎人。你现在知道他的名字了，来自维也纳的卡尔·施施瑞克，一只有一种即使在他那群狂热的同类中也很少见的动力的独狼。你确信你的圈套策划得很好，你的手下也足够棒，能够制服他。\n但是……如果他逃跑了，或者更糟，杀了你的人，他会对你对此地区的控制造成严重的打击。你也会失去抓住他的唯一机会。"
 podregionalpersons.5.a:0 "现在没有回头路了"
 podregionalpersons.5.effect.success.desc:0 "计划顺利进行"
 podregionalpersons.5.success:0 "我们抓到他了！"
 podregionalpersons.5.failure.effect.desc:0 "他造成了一些伤害，但你赢了"
 podregionalpersons.5.failure:0 "我们抓到他了！……差点"
 podregionalpersons.5.critical.failure.effect.desc:0 "卡尔耍弄了你的代理人们后逃跑了"
 podregionalpersons.5.critical.failure:0 "他抓到我们了……"
 podregionalpersons.6.t:0 "被猎猎人3"
 podregionalpersons.6.desc:0 "今晚你正例行在宫廷出席，但突然，数个火把从房间中间的某个地方滚了出来。你几乎无法控制住你那惊恐的心兽，因为周围都是恐惧和血狂的吸血鬼的哭喊声。\n当你试图逃离该混乱的场景时，一位戴兜帽的人挡住了你的路，似乎没有意识到大火在周围肆虐。\n他什么也没说，开始靠近你，一只手拿着燃烧的火把。他眼中那令人发狂的狂热毫无疑问地表明，那位难以捉摸的独狼猎人在你找到他之前就找到了你……"
 podregionalpersons.6.a:0 "阻止他！快！"
 podregionalpersons.6.effect.success.desc:0 "你设法制服并抓住他！"
 podregionalpersons.6.success:0 "我们抓到他了！"
 podregionalpersons.6.failure.effect.desc:0 "他造成了一些伤害，但你赢了"
 podregionalpersons.6.failure:0 "我们抓到他了！……差点"
 podregionalpersons.6.critical.failure.effect.desc:0 "你最后看到的是火，到处都是火"
 podregionalpersons.6.critical.failure:0 "好暖……"
 podregionalpersons.7.t:0 "乌尔夫之殿"
 podregionalpersons.7.desc:0 "有消息告诉你传说中的乌尔夫之殿已被找到了。\n这个靠近挪威的小岛据说蕴藏着著名的瓦尔达人——北欧符文法师的宝藏。他们的时代已经一去不复返了，因为对基督教上帝的信仰已经席卷了整个大陆。但他们似乎仍有一小部分人守在殿内，保护着可能是宝藏的地方，鉴于他们在过去几个世纪里拥有的力量……\n你会怎么处理这些信息？"
 podregionalpersons.7.a:0 "我说是时候劫掠了！"
 podregionalpersons.7.custom:0 "请注意，可能会有严重的后果……"
 podregionalpersons.7.b:0 "我们必须保护这些奥丁的仆从们！"
 podregionalpersons.7.c:0 "我还有更紧急的事要处理"
 podregionalpersons.7.customb:0 "你不会再被这个故事困扰了"
 podregionalpersons.8.t:0 "乌尔夫之殿2"
 podregionalpersons.8.desc:0 "乌尔夫之殿是一个不起眼的小渔村，而非你想象中的宏伟黄金城市。\n不过，当你审视周围的环境时，你应知道不要低估可能居住在这里的符文法师秘社。就像你看到的，你有两个选择：在他们没有预料到的情况下全力攻击他们，或者假装与他们保持友谊，当机会出现时在背后捅他们一刀。"
 podregionalpersons.8.a:0 "我们将把这些蠢货送到英灵殿！"
 podregionalpersons.8.effect.success.desc:0 "你轻而易举地征服了整个村庄"
 podregionalpersons.8.failure.effect.desc:0 "你受到了严重的打击，但是村庄是你的了"
 podregionalpersons.8.critical.failure.effect.desc:0 "符文法师会击倒你的军队"
 podregionalpersons.8.failure:0 "你受到了打击"
 podregionalpersons.8.b:0 "让我们见见我们的新“朋友”……"
 podregionalpersons.8.effect.success.descb:0 "他们真心的欢迎你"
 podregionalpersons.8.critical.failure.effect.descb:0 "他们看起来很可疑……"
 podregionalpersons.9.t:0 "乌尔夫之殿3"
 podregionalpersons.9.desc:0 "正如你所料，这场战斗很艰难，符文法师是被突袭，但并非毫无抵抗。你的大部分部队要么受伤，要么直接被杀死，被陷阱，被平民或被法师。\n但现在，你在厅内，只有他们的领袖站在你面前。在他身后，你已经可以看到闪闪发光的黄金宝藏……\n你可以跑过去，在逃跑前尽可能多地拿走金子。或者你可以尝试挑战这个强大的挪威法师，用决斗获得全部奖励。"
 podregionalpersons.9.a:0 "我不怕这人"
 podregionalpersons.9.effect.success.desc:0 "你将这人斩成两半！钱是你的了！"
 podregionalpersons.9.success:0 "完全胜利！"
 podregionalpersons.9.critical.failure.effect.desc:0 "你没准备好……"
 podregionalpersons.9.critical.failure:0 "终结"
 podregionalpersons.9.b:0 "我不怕这人……但我还是选择跑路"
 podregionalpersons.10.t:0 "乌尔夫之殿3"
 podregionalpersons.10.desc:0 "你被完全击溃了。符文法师有着大量陷阱，神秘的警告系统，而平民完全支持着他们。你们的军队坚持了足够的时间，好只让你在内的一小群人用来到这里的船逃跑。\n现在，你必须为未来做准备，因为这次挫折显然会影响你在国内的声望。但是你仍然可以控制传言的发展……"
 podregionalpersons.10.a:0 "这是一个清洗我国家叛徒的计谋！"
 podregionalpersons.10.b:0 "他们有数百人！并且奥丁也和他们一起战斗！"
 podregionalpersons.11.t:0 "乌尔夫之殿3"
 podregionalpersons.11.desc:0 "你让符文法师们认为你是站在他们一边的。因此，当他们最终了解你的本性时已经太晚了。你的军队已经杀死了大部分的秘社成员并控制了村庄。\n但现在，你看到两个幸存的秘社成员开始行动了。他们的领袖，一个被称为布兰德的坚毅挪威人，正试图把你拖住，让另一个成员收集宝藏逃跑。\n如果你浪费一些时间对付布兰德，你会失去部分金币，但却有可能获得一个有用的囚犯……"
 podregionalpersons.11.a:0 "这个人的价值比简单的金钱更高……"
 podregionalpersons.11.b:0 "钱！更多钱！"
 podregionalpersons.12.t:0 "乌尔夫之殿3"
 podregionalpersons.12.desc:0 "他们很容易就看穿了你的诡计。在他们知道了你隐瞒着的真实意图后，他们彻底的击垮了你。\n你的人几乎没能守住阵地好让让你逃到过来的船上。显然，这一挫折会对你在国内的声望造成重大打击，但是……你还是可以控制局势的发展，尽管不多。"
 podregionalpersons.12.a:0 "这是一个清洗我国家叛徒的计谋！"
 podregionalpersons.12.b:0 "他们有数百人！并且奥丁也和他们一起战斗！"
 podregionalpersons.13.t:0 "乌尔夫之殿2"
 podregionalpersons.13.desc:0 "符文法师很难被劝服。他们是一群厌世的人，隐藏了如此久，但你们共同的传统帮你们找到了共识。你让他们知道，他们的立场已经受到了影响，其他人会比你更具敌意。\n因此，他们现在正准备离开，并给你一小部分他们的财富，以回报你的帮助。不过，如果你有足够的说服力，你将能会说服他们加入你的国家，享受你的保护，这显然会带来更多的好处。"
 podregionalpersons.13.a:0 "跟我们来！诸神黄昏还是可以避免的"
 podregionalpersons.13.effect.success.desc:0 "他们被说服了！"
 podregionalpersons.13.critical.failure.effect.desc:0 "他们未被说服……"
 podregionalpersons.13.b:0 "谢了兄弟，一路顺风"
 podregionalpersons.13.critical.failure:0 "他们未被说服……"
 podregionalpersons.14.t:0 "乌尔夫之殿3"
 podregionalpersons.14.desc:0 "你成功说服瓦尔达人加入你的国家，在你的庇护之下。他们已经开始在你的首都提供相当大的帮助，使用他们的神秘能力来帮助民众。\n尽管……他们的宝藏也被他们一起带到了这里，你可以从背后捅他们一刀，为自己攫取宝藏，然后驱逐符文法师。你确定奥丁不会介意。"
 podregionalpersons.14.a:0 "让我们的新朋友感到宾至如归"
 podregionalpersons.14.b:0 "……钱就是钱"
 podregionalpersons.15.t:0 "最后的清洁派"
 podregionalpersons.15.desc:0 "一位奇怪的人最近来到了你的宫廷。这个小男孩显然避难自蒙塞居尔，清洁派最后的堡垒，最近落入十字军之手。关于这件事，你已经听过许多相互矛盾的报道，从著名的在围城之前被隐藏起来的清洁派宝藏，到“清洁派基督”在被带到火刑架时对基督徒的诅咒。\n你不能否认这孩子的虔诚，但让他在你的宫廷里传教可能会很危险，因为清洁派的敌人比他们的朋友多得多……"
 podregionalpersons.15.a:0 "邀请他进行神学辩论"
 podregionalpersons.15.b:0 "让他说，但仔细观察他"
 podregionalpersons.15.c:0 "把他赶出去，他只会带来麻烦"
 podregionalpersons.16.t:0 "最后的清洁派2"
 podregionalpersons.16.desc:0 "这场辩论很有趣，从那以后有了更多的争论。也许“纯洁之人”有道理？这个小男孩告诉你，即使在你受诅的状态下，你也可以追随真信。\n这很诱人，但从政治上讲，你皈依了一个非常不被信任的信仰，可能会产生严重的后果……"
 podregionalpersons.16.a:0 "我灵魂的救赎比政治更有价值"
 podregionalpersons.16.b:0 "我很高兴与你谈话，但你得走了"
 podregionalpersons.17.t:0 "最后的清洁派2"
 podregionalpersons.17.desc:0 "由于你还没有把他赶出你的宫廷，这个小男孩已经开始把你看成是周围少数几个经得起检验的[cainites|E]之一了。因此，他提出了让其他难民为您服务的想法，这无疑将有助于您的国家的繁荣。\n另一种方法是抓住这个男孩，“询问”他，直到他说出他所知道的关于传说中的蒙塞居尔宝藏的一切……"
 podregionalpersons.17.a:0 "这里欢迎你的人民"
 podregionalpersons.17.b:0 "让我们谈谈钱的事情……"
 podregionalpersons.18.t:0 "怪物"
 podregionalpersons.18.desc:0 "某人……或者有什么东西于夜晚徘徊在你城市的街道上。其并不是你的人民。这东西已经被指控犯有大屠杀，而且是最可怕的大屠杀。就连你们的一些派员，尽管已经疲惫不堪，也似乎被他们所看到的恐怖景象所困扰。甚至有更黑暗的传言说是最不圣洁类的实验。\n这个城市在恐惧中退缩，你必须在人们开始调查夜间生命之前采取行动。你可以巧妙地提醒凡人的裁判所，希望他们能阻止他。或者你可以让他疯狂一段时间，然后找到遵守的模式。最后，你或还可以在夜间加倍巡逻和守卫，把他吓到另一个更脆弱的城镇。"
 podregionalpersons.18.a:0 "让圣洁对战不洁"
 podregionalpersons.18.custom:0 "这将使你多曝露一点点，但也许能拦住那怪物"
 podregionalpersons.18.b:0 "在他的疯狂意见中一定有个好主意"
 podregionalpersons.18.customb:0 "怪物将继续它的暴行，但也许会有线索出现。"
 podregionalpersons.18.c:0 "吓唬他"
 podregionalpersons.18.customc:0 "你要在夜里帮助凡人守卫，确保他永远离开你的城市。"
 podregionalpersons.19.t:0 "怪物2"
 podregionalpersons.19.desc:0 "这反噬了。以可怕的方式。\n那个潜伏在夜晚的东西发现了你巧妙地为审判他而设置的裁判室，并以此为样板建了一个……一个很血腥的版本，于镇中心。\n随着尸体的堆积，城市陷入了恐慌，你已经听到了上帝派员的精英团队正在净化城市的报道。即使这意味着要把它夷为平地。\n你还是不知道是谁，是什么！你的宫廷正处于狂乱之中，请求你保持低调，在一切还来得及之前忘掉这该死的行为……"
 podregionalpersons.19.a:0 "即使要我自己去找，我也会知道真相的!"
 podregionalpersons.19.custom:0 "正当裁判所封闭你所在的城市时，你继续你的调查……"
 podregionalpersons.19.b:0 "……让我们忘记这一切"
 podregionalpersons.19.customb:0 "你取消掉了这次猎食，并在裁判所搜捕时低调行事"
 podregionalpersons.20.t:0 "怪物3"
 podregionalpersons.20.desc:0 "他找到你了。那个让你的城市惊恐万分，还让整个裁判所大军四处逃窜的怪物就在你面前。一个出奇得普通的德意志人，名叫思卓曼，正静静地环视着你那些不安的延臣。\n“我听说过很多关于你们这类人的事。真的很迷人。我很想了解更多。也许我们可以达成协议？我帮你对付那些讨厌的裁判所，作为回报，你得告诉我所有关于吸血鬼生物学的知识。”\n这人显得不正常，即便是作为一个凡人，他也能让大多数人感到不舒服。这或许是你可以利用的……"
 podregionalpersons.20.a:0 "一个有趣的建议"
 podregionalpersons.20.b:0 "这是一段美好友谊的开始……"
 podregionalpersons.21.t:0 "怪物2"
 podregionalpersons.21.desc:0 "这反噬了。以可怕的方式。\n你没有找到任何关于怪物的线索，更糟糕的是，他已经开始针对你的人，已经有一个失踪的派员，你怀疑他不会回来了。或者不是整块的回来。\n随着尸体的堆积，城市陷入了恐慌，你已经听到了上帝派员的精英团队正在净化城市的报道。即使这意味着要把它夷为平地。\n你还是不知道是谁，是什么！你的宫廷正处于狂乱之中，请求你保持低调，在一切还来得及之前忘掉这该死的行为……"
 podregionalpersons.21.a:0 "即使要我自己去找，我也会知道真相的!"
 podregionalpersons.21.custom:0 "正当裁判所封闭你所在的城市时，你继续你的调查……"
 podregionalpersons.21.b:0 "……让我们忘记这一切"
 podregionalpersons.21.customb:0 "你取消掉了这次猎食，并在裁判所搜捕时低调行事"
 podregionalpersons.22.t:0 "寂静"
 podregionalpersons.22.desc:0 "一个叫贝克尔的吸血鬼被带到你面前。这个阿刹迈在没有得到你的许可的情况下攻击了你势力范围附近的第七次十字军的一群骑士。这种行为是不能容忍的，因为它肯定会吸引不必要的注意到你的领地。\n贝克尔道歉，并解释说，他释放的是一名年轻的穆斯林战士，他打算[Embrace|E]这名战士。他提议给你一笔钱，以表示他对你的不敬并非有意。你可以接受……或者你也可以把那个诱人的适任者当成自己的，尽管你对他还不太了解。"
 podregionalpersons.22.a:0 "给贝克尔开门，让他的门徒见见我的房间"
 podregionalpersons.22.custom:0 "你了解了关于这年轻战士的事，但这可能有后果"
 podregionalpersons.22.b:0 "你被原谅了"
 podregionalpersons.23.t:0 "寂静2"
 podregionalpersons.23.desc:0 "你知道了从贝克尔那里“救”出来的那个年轻人的名字，塔里克。不幸的是，十字军也知道了他们的囚犯现在由你照顾，他们似乎一心想把他再抓回来。这足以让他们现在对你的领地展开了全面且相当鲁莽的攻击。\n你可以试着击退他们，但你的超自然能力有可能会吸引更多不必要的注意。或者你可以把塔里克留给他们，忘掉这个烦恼。"
 podregionalpersons.23.a:0 "我希望他值得……"
 podregionalpersons.23.custom:0 "你离开了塔里克，以及所有故事，于你身后"
 podregionalpersons.23.b:0 "我再也不参与这事了"
 podregionalpersons.23.effect.success.desc:0 "胜利，现在看看你的门徒……"
 podregionalpersons.23.critical.failure.effect.desc:0 "他们成功带回了塔里克……"
 podregionalpersons.23.critical.failure:0 "他们带回了塔里克……"
 podregionalpersons.24.t:0 "寂静3"
 podregionalpersons.24.desc:0 "你很好地应对了十字军的反击。不过你没有预料到的是，你的守卫突然死亡，而你的帐篷周围更是突然笼罩在一片寂静之中。这份寂静只被一句淡淡的“我要拿回属于我的东西”打破了，你这时突然意识到贝克尔在这里，而且他没有忘记你偷了他未来的子嗣。\n你现在要对付的是一位强大的老阿刹迈，他一心想要摧毁你，而你身边只有一个年轻的，虽然很勇敢的凡人……"
 podregionalpersons.24.a:0 "让我们起舞……"
 podregionalpersons.24.custom:0 "虽然不是很光荣，但效率很高"
 podregionalpersons.24.b:0 "我会抓起塔里克，然后跑得远远的"
 podregionalpersons.24.effect.success.desc:0 "胜利，塔里克终于是你的了！"
 podregionalpersons.24.critical.failure.effect.desc:0 "如果你失败了，死亡将很快降临……"
 podregionalpersons.24.critical.failure:0 "就这样结束了……"
 podregionalpersons.24.success:0 "你赢了！"
 podregionalpersons.25.t:0 "幻梦尾声"
 podregionalpersons.25.desc:0 "第四次十字军东征虽然在道德上有污点，但却给意大利城邦带来了巨大的财富，这些财富大多来自于掠夺的希腊文物。许多人，包括拜占庭[cainites|E]，也在逃离混乱，到其他地方寻求庇护。\n你最近听说过这样一个商队，正在离你的土地不远的地方旅行。像大多数难民一样，他们很容易成为你的派员的猎物，而且他们可偷走他们随身携带的任何财富。\n另一种方法就是在您的宫廷欢迎他们。一个高尚的行为，也可能带来新的可能性……没有人会无缘无故地说你慷慨大方。"
 podregionalpersons.25.a:0 "让我们欢迎这些可怜的远亲"
 podregionalpersons.25.custom:0 "你再也不想听到这个故事了"
 podregionalpersons.25.b:0 "给我点有价值的东西！"
 podregionalpersons.25.c:0 "这些事配不上我"
 podregionalpersons.26.t:0 "幻梦尾声2"
 podregionalpersons.26.desc:0 "拜占庭难民很感激你的帮助。他们谈论起他们伟大的城市君士坦丁堡，以及他们更伟大的精神领袖米迦勒。\n这个幻梦之牧首随着他的城市一起陨落了，但他们仍然把他说成一位几乎比起[cainite|E]更近乎为神的实体。作为赠礼，他们中的一个人给了你一个“镜像”圣索菲亚的碎片，这里是米迦勒陨落前居住的地方。你可以接受……但这个遗物确实有些奇怪的地方。"
 podregionalpersons.26.a:0 "你们的陪伴就够了，谢谢"
 podregionalpersons.26.b:0 "……我的宝贝"
 podregionalpersons.27.t:0 "幻梦尾声2"
 podregionalpersons.27.desc:0 "你轻易地摆脱了商队薄弱的防御。战利品并没有你想要的那么多，但仍然足够让你花点时间。不过，有一件东西你们的人在分享战利品的过程中被激烈争夺。\n这一小块玻璃，也许来自镜子或窗户，对人有一种迷人的影响，好像在呼唤他们的灵魂。你知道米迦勒吧，在君士坦丁堡沦陷之前，他几乎像其中的吸血鬼一样神圣……会不会和他有关？"
 podregionalpersons.27.a:0 "我就拿钱"
 podregionalpersons.27.b:0 "给我！"
 podregionalpersons.28.t:0 "幻梦尾声3"
 podregionalpersons.28.desc:0 "碎片这几天一直在你身边。它甚至在你的梦里！君士坦丁堡的幻梦，一个帝国，三位一体的玛土撒拉联合起来，走向一个更大的乌托邦……\n你可以感觉到它在慢慢侵蚀你的意志力，让你想起一些你甚至不应该知道的事情。不久之后，你就不再是原来的你了，这可能是你保有理智的最后机会了。"
 podregionalpersons.28.a:0 "幻梦即是我的一切"
 podregionalpersons.28.b:0 "我不是傀儡！"
 podregionalpersons.29.t:0 "颅骨之父"
 podregionalpersons.29.desc:0 "当凡人的再征服还在伊比利亚肆虐时，一个机遇出现了。在一场战斗中，有人看到一个名叫罗德里戈的士兵表现出奇怪的行为和更奇怪的能力。有传言说他是传说中的法师之一，是扭曲现实的大师。可能是位涉世不深的家伙，否则你的派员肯定不能把他带到你的宫廷上见他。\n这个安静的男人显然对你们的集会无动于衷，似乎很乐意用眼角观察你们。你要拿他怎么办？"
 podregionalpersons.29.a:0 "我能接触到许多你会感兴趣的作品"
 podregionalpersons.29.custom:0 "你再也不想听到这个故事了"
 podregionalpersons.29.b:0 "骗他为你服务"
 podregionalpersons.29.effect.success.desc:0 "罗德里戈暂时的留在你的宫廷"
 podregionalpersons.29.critical.failure.effect.desc:0 "罗德里戈离开了你的宫廷"
 podregionalpersons.29.critical.failure:0 "罗德里戈走了……"
 podregionalpersons.29.c:0 "他对我来说没用"
 podregionalpersons.30.t:0 "颅骨之父2"
 podregionalpersons.30.desc:0 "罗德里戈已经很好地适应了你的宫廷，并且很喜欢从你和其他吸血鬼那里学习更多关于死亡的知识。他对来世的迷恋似乎是无止境的，虽然你在与他的交谈中学到了很多东西，但你必须承认，这开始让你感到困扰。\n你可以通过初拥罗德里戈，让他更接近你的影响来缩短其研究时间，或者只是等待和观察。"
 podregionalpersons.30.a:0 "让我们一起学习更多"
 podregionalpersons.30.b:0 "是时候加入我们了"
 podregionalpersons.31.t:0 "颅骨之父"
 podregionalpersons.31.desc:0 "罗德里戈已经乖乖地接受了你的决定，停止了他的研究，并打算让你[Embrace|E]他。和往常一样，他对这件事的感受诡异地保持沉默，你不知道他是认为这是一种惩罚还是奖励。\n不管真相如何，他现在已经可以在你的宫廷内接受你所给予的任何任务或未来。"
 podregionalpersons.31.a:0 "一段新的命运等待着他"
 podregionalpersons.32.t:0 "颅骨之父3"
 podregionalpersons.32.desc:0 "你的法师客人揭露了关于死亡和来世的真相，有些事情在他来到你的宫廷之前你甚至都不敢考虑。\n他对这类事情仍然很冷静，而且清楚地告诉你，如果你继续庇护他，更多的事情还在后头。但你会觉得自己走得太远太快了……"
 podregionalpersons.32.a:0 "真理如此之近！"
 podregionalpersons.32.b:0 "让我们停在这里"
 podregionalpersons.33.t:0 "颅骨之父4"
 podregionalpersons.33.desc:0 "这些夜晚，你几乎不再出现在自己的宫廷里，而是更愿意与罗德里戈进行交流，谈论他对死亡和冥界的迷人见解。这位法师甚至快要打开通往传说中的始祖之城以诺的传送门! 那里有什么奇妙的事物正等着你去领悟呢？\n你迫不及待地想继续这段迷人的旅程，但一种纠结的感觉却让你临时退缩了。就好像你正在直视着深渊......"
 podregionalpersons.33.a:0 "更远处还有什么呢？"
 podregionalpersons.33.b:0 "我必须立刻终结这疯狂举动！"
 podregionalpersons.33.custom:0 "挽回一切的最后机会……"
 podregionalpersons.34.t:0 "颅骨之父5"
 podregionalpersons.34.desc:0 "你见着了以诺城！你看到了这座奇迹之城、看到了该隐的黑王座……看到了一切！罗德里戈已经走了，但已经不需要他了，因为你现在明白多了。你不必为其他吸血鬼的琐事操心，因为你知道了真相。即使你大部分时间都记不起来……\n好吧，没关系，你看到以诺了！还是以拿？一切都那么模糊……"
 podregionalpersons.34.a:0 "我现在已经摆脱了那些琐碎的政治"
 podregionalpersons.35.t:0 "猎犬"
 podregionalpersons.35.desc:0 "当英格兰仍在对法兰西发动看似永恒的战争时，你会听到这场冲突提供的一个机遇。一个叫埃德蒙·菲茨亨利的凡人，其看起来比他看上去的要重要得多。作为一个小贵族的私生子，年轻的埃德蒙对超自然的了解似乎比大多数凡人都要多。\n这一事实可以解释他最近在法兰西战场上取得的巨大胜利。你可能想进一步调查，但其他吸血鬼已经在追踪他了。"
 podregionalpersons.35.a:0 "我会劝服他们说他是我的猎物"
 podregionalpersons.35.custom:0 "你再也不想听到这个故事了"
 podregionalpersons.35.b:0 "指给他们一条错路"
 podregionalpersons.35.effect.success.desc:0 "他们偏离了你的目标"
 podregionalpersons.35.critical.failure.effect.desc:0 "他们还在和你竞争"
 podregionalpersons.35.c:0 "这凡人对我来说没用"
 podregionalpersons.37.t:0 "猎犬：迷踪"
 podregionalpersons.37.desc:0 "你的对手还在追踪埃德蒙，他们让你的调查更加困难。到目前为止，你已经尝试着对它进行微妙的处理，但是如果你还想继续这个调查的话，也许是时候采取更激烈的行动了。"
 podregionalpersons.37.a:0 "每个人都有自己的价值"
 podregionalpersons.37.b:0 "将裁判所送到他们路途中。那会让他们忙上一阵子。"
 podregionalpersons.37.c:0 "这不值得"
 podregionalpersons.36.t:0 "猎犬2"
 podregionalpersons.36.desc:0 "你开始对埃德蒙·菲茨亨利的背景故事有了更多的了解。他实际上就是狼人所称的“狼嫡”，显然是指这些野蛮动物大家庭中的一员。这就能解释他的力量和超自然的神秘知识了。\n更有趣的是，不管出于什么原因，他都在躲避他们，这可能意味着他会欢迎你的帮助。可悲的是，这也意味着这些狼人正在接近他，并不会友善的接受你的干涉……"
 podregionalpersons.36.a:0 "这些野兽尊重力量。让我们打爆他们的头。"
 podregionalpersons.36.b:0 "准备伏击！"
 podregionalpersons.36.effect.success.desc:0 "狼群被赶回了森林"
 podregionalpersons.36.critical.failure.effect.desc:0 "狼人们并没害怕"
 podregionalpersons.36.c:0 "这变得太危险了。我放弃。"
 podregionalpersons.38.t:0 "猎犬：迷踪"
 podregionalpersons.38.desc:0 "你没能摆脱那些寻找埃德蒙的狼人。现在，他们显然也盯上你了。在你继续追猎之前，你必须先彻底地对付他们。\n你会试图自己去转移他们的注意力，还是让他们把愤怒释放在你的资产上"
 podregionalpersons.38.a:0 "烟与镜"
 podregionalpersons.38.b:0 "我的地盘里少几个凡人也没什么关系"
 podregionalpersons.38.c:0 "这不值得"
 podregionalpersons.39.t:0 "猎犬3"
 podregionalpersons.39.desc:0 "你来到了一个阴暗的法国战场，终于成功地追踪到了这位埃德蒙·菲茨亨利。这个人不负众望，是个精明的指挥官，也是个可靠的战士，显然他的血管里流淌着狼人的血液。\n但死亡不等人，所以你找上了他，提出保护他免受狼人猎手的追杀，还有更诱人的不死之身。埃德蒙显然很感兴趣，并加入了你的宫廷。\n他只要求你叫他的出生名，现在他不用再隐藏自己的血统了。"
 podregionalpersons.39.a:0 "欢迎来到暗夜，“塔利”"
 podregionalpersons.41.t:0 "风自东来"
 podregionalpersons.41.desc:0 "被称为安答的冈格罗血系，自从他们的凡人同行蒙古崛起成为中国的主人以来，已经享受了很长一段时间的繁荣。他们利用这种联系控制了天朝的几个主要城市，杀死或驱逐了当地的万鬼。\n但这一时期已经结束，元朝被明朝的崛起所粉碎，万鬼回归，统一在一个新的宗派“五行宗”之下。他们已经将安答血统从他们的故土和大部分东方大草原上清除，现在正在向西望去。他们看上去不会停止，直到最后一位安答躺在地上，缓慢而痛苦地死去……"
 podregionalpersons.41.a:0 "清算时刻到了"
 podregionalpersons.41.player_warningb:0 "一支强大的万鬼军队很快就会出现在敖尔告"
 first_quincunxwarlord_event_troops:0 "五行宗先锋"