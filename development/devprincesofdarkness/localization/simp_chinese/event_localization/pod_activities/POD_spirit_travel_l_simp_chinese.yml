l_simp_chinese:
 spirit_travel_header:0 "灵游："
 POD_spirit_travel.1001.t:0 "$spirit_travel_header$灵感"
 POD_spirit_travel.1001.desc:0 "邻近绝壁的灵界区域被称为镜像之地，因为其看起来就像附近中原地区的倒影而得名。\n\n由于这是你的第一次灵界旅行，看到这奇异的景色让你感到悟得了什么。"
 POD_spirit_travel.1001.a:0 "厉害！"
 POD_spirit_travel.1002.t:0 "$spirit_travel_header$灵师教导"
 POD_spirit_travel.1002.desc_opening:0 "你进入了灵界，尽可能的深，然后你遇到了一位"
 POD_spirit_travel.1002.desc_high:0 "上古者，历史记录上的万鬼，太上老祖"
 POD_spirit_travel.1002.desc_yin:0 "阎魔"
 POD_spirit_travel.1002.desc_yang:0 "强大灵类"
 POD_spirit_travel.1002.desc_low:0 "普通灵类"
 POD_spirit_travel.1002.desc_ending:0 "，其向你分享了一些心法理解。"
 POD_spirit_travel.1002.a:0 "我的灵师。"
 POD_spirit_travel.1100.t:0 "外交挑战"
 POD_spirit_travel.1100.desc:0 "你被住在这个区域的人拦住了，也许你可以说服他们告诉你如何通过？影界的居民是出了名的难以理解，甚至更难以说服。"
 POD_spirit_travel.1110.t:0 "军事挑战"
 POD_spirit_travel.1110.desc:0 "你被一个棋局所阻止，是时候展示你有多善于此道了。不过，以缚灵形式玩“动态”战役，一开始是很难掌握的，这使得这是一种令人不安的超现实体验。"
 POD_spirit_travel.1120.t:0 "管理挑战"
 POD_spirit_travel.1120.desc:0 "你被一个数学谜题拦住了，你善于此么？你必须先破译诡计多端的灵类所使用的数字，这使问题更难解决。"
 POD_spirit_travel.1130.t:0 "谋略挑战"
 POD_spirit_travel.1130.desc:0 "你在路上遇到了一个强大的灵卫，也许你可以用一些小把戏来分散其的注意力？不过最好让人信服，他看起来真的不友好。"
 POD_spirit_travel.1140.t:0 "学识挑战"
 POD_spirit_travel.1140.desc:0 "你被一个字谜拦住了，你能解决这个问题吗？影界是“真实”世界的扭曲版本，你可以找到一些规律和线索，至少对你有一点意义。"
 POD_spirit_travel.1100.a:0 "我会尽我全力。"
 POD_spirit_travel.1100.critical_success:0 "大成功"
 POD_spirit_travel.1100.success:0 "成功"
 POD_spirit_travel.1100.fail:0 "失败"
 POD_spirit_travel.1100.critical_fail:0 "大失败"
 POD_spirit_travel.101.t:0 "$spirit_travel_header$迷失于大风暴"
 POD_spirit_travel.101.desc:0 "你无法在大风暴中确定自己的方向，现在你又回到了你起始的地方。"
 POD_spirit_travel.101.a:0 "行吧。"
 UNDERWORLD_TOOLTIP:0 "你无法进入冥界：\n@warning_icon!#X $TRIGGER_OR$#!\n$has_wraith_trait_tooltip$\n$has_kueijin_trait_tooltip$\n$has_ex_nihilo_perk_tooltip$\n$has_separate_ka_perk_tooltip$\n$has_lesser_spirit_projection_perk_tooltip$"
 SPIRIT_TRAVELING_TOOLTIP:0 "穿越中……"
 spirit_travel_arrived_title:0 "目的地已触及"
 spirit_travel_arrived_desc:0 "你已经到达灵界的选定目标位置。"
 skinlands_option:0 "回到物质世界"
 shadowlands_option:0 "深入幽土"
 tempest_option:0 "深入大风暴"
 spirit_wilds_option:0 "踏入灵之荒野"
 near_dreaming_option:0 "遇见近梦界"
 dark_kingdom_of_clay_option:0 "前往业境"
 dark_kingdom_of_iron_option:0 "前往冥河城"
 dark_kingdom_of_ivory_option:0 "前往幽灵之丛"
 dark_kingdom_of_jade_option:0 "前往黄泉"
 dark_kingdom_of_obsidian_option:0 "前往剥皮之地"
 dark_kingdom_of_sand_option:0 "前往阿蒙提"
 shadow_realm_to_skinlands_option_tooltip:0 "这个选项可用是因为你拥有[GetPerk('empower_ba_perk').GetName( GetPlayer )][perk|E]。"
 skinlands_title:0 "$spirit_travel_header$皮肤之地"
 skinlands_desc:0 "死灵把活人的世界称为皮肤之地；这与幽土形成鲜明对比，后者是死者的土地和死灵的家园。\n这基本上是你的起点，从这里开始，你有数个可选项——取决于你的能力——从这里开始前往哪里。\n请注意，从一个位面到另一个位面的旅行将需要时间。"
 spirit_wilds_title:0 "$spirit_travel_header$灵之荒野"
 spirit_wilds_desc:0 "灵之荒野是中影界的另一个名称，是近界之间的空间。这一影界部分反映了自然环境，包括其原始状态和受污染的状态。"
 near_dreaming_title:0 "$spirit_travel_header$近梦界"
 near_dreaming_desc:0 "近梦界是[dreaming|E]中最接近世俗世界的部分。"
 shadowlands_title:0 "$spirit_travel_header$幽土"
 shadowlands_desc:0 "幽土是现实的镜像”皮肤“，生者界域的每一个地点在幽土都有一个相应的地点，在大多数情况下，这些地点遵守传统的距离法则。"
 tempest_title:0 "$spirit_travel_header$大风暴"
 tempest_desc:0 "大风暴是一个由能量、记忆和[GetTrait('spectre').GetName( GetPlayer )]组成的永恒恶湍，它从迷宫城中发出，并不断向幽土和冥府倾泻灵质和材料。"
 shadow_realm_title:0 "$spirit_travel_header$影子国度"
 shadow_realm_desc:0 "影子国度是木乃伊在冥界的根据地，在他们准备好再次回到在自己的身体里之前，他们会去那里进行自我再生，且在此处其等可避免怨灵或恶湍的侵袭。"
 dark_kingdom_of_clay_title:0 "$spirit_travel_header$黏土冥府"
 dark_kingdom_of_clay_desc:0 "业境，外人称为黏土[dark_kingdom|E]，是大风暴中属于澳大利亚原住民的界域。"
 dark_kingdom_of_iron_title:0 "$spirit_travel_header$铁之冥府"
 dark_kingdom_of_iron_desc:0 "冥河城是西方死灵的首都，是一座难以理解的巨大城市，位于大风暴深处的泣绝岛。它是西方死灵各组织的主要总部所在地。"
 dark_kingdom_of_ivory_title:0 "$spirit_travel_header$象牙冥府"
 dark_kingdom_of_ivory_desc:0 "幽灵之丛，也被称为象牙[dark_kingdom|E]，是非洲死灵——又称阿班博——的幽土。"
 dark_kingdom_of_jade_title:0 "$spirit_travel_header$玉之冥府"
 dark_kingdom_of_jade_desc:0 "黄泉，又称玉之[dark_kingdom|E]，是专门为亚洲的死者服务的冥界部分，并由他们控制。"
 dark_kingdom_of_obsidian_title:0 "$spirit_travel_header$黑曜石冥府"
 dark_kingdom_of_obsidian_desc:0 "剥皮之地是对中美洲掌握的死者国度的称呼，是强大的黑曜石[dark_kingdom|E]的一部分。"
 dark_kingdom_of_sand_title:0 "$spirit_travel_header$沙之冥府"
 dark_kingdom_of_sand_desc:0 "沙之[dark_kingdom|E]阿蒙提是属于不朽者的冥界冥府。它的居民不是死灵，而是不朽者，其等在死后会来到这幽土。"
 skinlands_effect_desc:0 "效果：\n$BULLET_WITH_TAB$待在皮肤之地的非[GetTrait('risen').GetName( GetPlayer )]的[GetTrait('wraith').GetName( GetPlayer )]将每年损失#N 1#!执念。\n$BULLET_WITH_TAB$每有一约束[GetTrait('wraith').GetName( GetPlayer )]，其主人就得每年花一定[stress|E]来使其待在皮肤之地。"
 spirit_wilds_effect_desc:0 ""
 near_dreaming_effect_desc:0 ""
 shadowlands_effect_desc:0 "效果：\n$BULLET_WITH_TAB$待在幽土的[GetTrait('wraith').GetName( GetPlayer )]将每年获得#P  1#!执念。"
 tempest_effect_desc:0 "效果：\n$BULLET_WITH_TAB$#N 50%#!的概率迷失于大风暴。\n$BULLET_WITH_TAB$能从恶湍中收集宝物碎片。"
 shadow_realm_effect_desc:0 ""
 dark_kingdom_of_clay_effect_desc:0 "效果：\n$BULLET_WITH_TAB$待在该[dark_kingdom|E]的[GetTrait('wraith').GetName( GetPlayer )]将每年获得#P  1#!执念。"
 dark_kingdom_of_iron_effect_desc:0 "效果：\n$BULLET_WITH_TAB$待在该[dark_kingdom|E]的[GetTrait('wraith').GetName( GetPlayer )]将每年获得#P  1#!执念。"
 dark_kingdom_of_ivory_effect_desc:0 "效果：\n$BULLET_WITH_TAB$待在该[dark_kingdom|E]的[GetTrait('wraith').GetName( GetPlayer )]将每年获得#P  1#!执念。"
 dark_kingdom_of_jade_effect_desc:0 "效果：\n$BULLET_WITH_TAB$待在该[dark_kingdom|E]的[GetTrait('wraith').GetName( GetPlayer )]将每年获得#P  1#!执念。"
 dark_kingdom_of_obsidian_effect_desc:0 "效果：\n$BULLET_WITH_TAB$待在该[dark_kingdom|E]的[GetTrait('wraith').GetName( GetPlayer )]将每年获得#P  1#!执念。"
 dark_kingdom_of_sand_effect_desc:0 ""
 tab_spirit_travel:0 "#T 灵界#!"
 periphery_title:0 "$spirit_travel_header$周界"
 periphery_desc:0 "周界，有时也被称为“软影界”，是介于[penumbra|E]和物质世界之间的地方或——如许多化兽族裔所说——思想状态。"
 periphery_effect_desc:0 ""
 periphery_option:0 "若我改变思绪……"
 astral_plane_title:0 "$spirit_travel_header$星界"
 astral_plane_desc:0 "星界是庸界的最低层，是与[astral_reaches|E]相联的已知[penumbra|E]之一。"
 astral_plane_effect_desc:0 ""
 astral_plane_option:0 "升入星界"
 vulgate_title:0 "$spirit_travel_header$庸界"
 vulgate_desc:0 "庸界——也被称为想象世界——是[astral_reaches|E]的最低部分。它包含了人类（也许还有一些其他物种）的集体哲学和思维方式所想到的常识概念。"
 vulgate_effect_desc:0 ""
 vulgate_option:0 "升入庸界"
 spiers_title:0 "$spirit_travel_header$锥界"
 spiers_desc:0 "宇宙学家认为，锥界是众人的思想集中在同一个概念上的结果，导致它从庸界上升到更高的界域。"
 spiers_effect_desc:0 ""
 spiers_option:0 "升入锥界"
 epiphamy_title:0 "$spirit_travel_header$悟界"
 epiphamy_desc:0 "悟界——或智思世界，按照赫耳墨斯秘会和天国颂歌对它的分类，或泛维度元宇宙，按照理性之子对它们的称呼——是在[astral_reaches|E]内最难达到的区域之一。"
 epiphamy_effect_desc:0 ""
 epiphamy_option:0 "升入悟界"
 atrocity_realm_title:0 "$spirit_travel_header$暴行界域"
 atrocity_realm_desc:0 "暴行界域，被法师们称为荒土，是近界域之一。忌灵在这里繁衍。"
 atrocity_realm_effect_desc:0 ""
 atrocity_realm_option:0 "踏入暴行界域"
 battleground_title:0 "$spirit_travel_header$战界"
 battleground_desc:0 "战界，在东方被称为斗魂界，是影界中的近界域之一，包含着有史以来的每一场战斗，从最早的新石器时代部落与熊和狼的冲突，刀耕之治和魂怒之战，直到目前中东内部的冲突和黑帮战争。"
 battleground_effect_desc:0 "效果：\n$BULLET_WITH_TAB$概率获得新指挥官特质，取决于你的[martial_skill|E]"
 battleground_option:0 "踏入战界"
 cyberrealm_title:0 "$spirit_travel_header$赛博界"
 cyberrealm_desc:0 "赛博界是影界的十三近界域之一。这界域也许代表了织者在影界的影响力的顶峰。它被法师们称为敌托邦。"
 cyberrealm_effect_desc:0 ""
 cyberrealm_option:0 "踏入赛博界"
 erebus_title:0 "$spirit_travel_header$厄瑞玻斯"
 erebus_desc:0 "厄瑞玻斯常常被比作狼族的“地狱”，但实际上是个净化精神的地方。"
 erebus_effect_desc:0 ""
 erebus_option:0 "踏入厄瑞玻斯"
 flux_realm_title:0 "$spirit_travel_header$变界"
 flux_realm_desc:0 "变界，变化界，或辐射界是近影界中的界域。它是强大的纯净、未被稀释的奇原能量库，未被织者的章程所污染。"
 flux_realm_effect_desc:0 ""
 flux_realm_option:0 "踏入变界"
 hy_brasil_title:0 "$spirit_travel_header$易巴席尔"
 hy_brasil_desc:0 "一个从失落的阿卡迪亚永远分离出来的妖精领域。"
 hy_brasil_effect_desc:0 ""
 hy_brasil_option:0 "踏入易巴席尔"
 legendary_realm_title:0 "$spirit_travel_header$传奇界"
 legendary_realm_desc:0 "传奇界是位于近影界的近界域之一。在该界域穿越的狼族可以体验他们传奇先祖的生活。"
 legendary_realm_effect_desc:0 ""
 legendary_realm_option:0 "踏入传奇界"
 mountains_of_heaven_title:0 "$spirit_travel_header$天山"
 mountains_of_heaven_desc:0 "天山是阳界中的影界界域。该界域表现为在云海之上的庞大山脉链，甚至使伟大的喜马拉雅山脉也相形见绌。"
 mountains_of_heaven_effect_desc:0 ""
 mountains_of_heaven_option:0 "爬上天山"
 pangaea_title:0 "$spirit_travel_header$盘古界"
 pangaea_desc:0 "盘古界是原始地球的投影，展示了文明、人类历史，甚至是刀耕之治之前的世界面貌。"
 pangaea_effect_desc:0 ""
 pangaea_option:0 "踏入盘古界"
 scar_title:0 "$spirit_travel_header$疤痕"
 scar_desc:0 "疤痕是影界的近界域之一。它是工业革命在生锈的繁荣理想下被腐蚀成对灵魂的磨砺压榨的显现。"
 scar_effect_desc:0 ""
 scar_option:0 "踏入疤痕"
 summer_country_title:0 "$spirit_travel_header$夏乡"
 summer_country_desc:0 "夏乡是位于地球近影界的近界域之一。它现在只是个神话，因为它已经消逝了几十年了。传说中，该界域反映了盖亚对她的孩子们的纯洁又无尽的爱。"
 summer_country_effect_desc:0 ""
 summer_country_option:0 "踏入夏乡"
 tiger_lands_title:0 "$spirit_travel_header$虎原"
 tiger_lands_desc:0 "虎原是东方影界的一个阳界域，是濒危动物的灵和因人类砍伐而失去家园的灵的避难所。"
 tiger_lands_effect_desc:0 ""
 tiger_lands_option:0 "踏入虎原"
 umi_title:0 "$spirit_travel_header$羽海"
 umi_desc:0 "作为中原最强大的影界界域之一，羽海声称整个太平洋都是它的管辖范围，尽管某些波利尼西亚和印度尼西亚的灵域对此不以为然。"
 umi_effect_desc:0 ""
 umi_option:0 "踏入羽海"
 wolfhome_title:0 "$spirit_travel_header$狼之家"
 wolfhome_desc:0 "狼之家是近界域之一，位于地球的近影界。它是狼族经常光顾的地方。该界域是一片广阔的原始荒野。这里隐藏着对原始奥秘的答案。"
 wolfhome_effect_desc:0 ""
 wolfhome_option:0 "踏入狼之家"
 deep_umbra_title:0 "$spirit_travel_header$深影界"
 deep_umbra_desc:0 "深影界，也叫深宇宙，是地球影界空间之外的浩瀚界域。它主要是无穷无尽的虚空。从人类的角度来看，深影界即是深太空、外太空或整个宇宙。"
 deep_umbra_effect_desc:0 ""
 deep_umbra_option:0 "飞入深影界"
 hades_title:0 "$spirit_travel_header$哈迪斯"
 hades_desc:0 "卡比里的主要[shadow_realm|E]被成为哈迪斯，来自希腊神话中的冥界。"
 hades_effect_desc:0 ""
 gates_of_heaven_title:0 "$spirit_travel_header$天门"
 gates_of_heaven_desc:0 "天降大任于重生者。八天尊给予天亲使命旨意。他们奉旨，且必须执行天意。当他们失败时，他们将在天门花时间沉思，为自己做好准备，以便不再失败。"
 gates_of_heaven_effect_desc:0 ""
 sea_of_shadows_title:0 "$spirit_travel_header$黯影之海"
 sea_of_shadows_desc:0 "黯影之海是死灵们用来描述大风暴的“底层”的术语，它围绕着迷宫城和湮灭流淌和流入。"
 sea_of_shadows_effect_desc:0 "效果：\n$BULLET_WITH_TAB$#N 75%#!的概率迷失于大风暴。\n$BULLET_WITH_TAB$能以更大的风险从恶湍中收集更高级的宝物碎片。"
 sea_of_shadows_option:0 "深入黯影之海"
 labyrinth_title:0 "$spirit_travel_header$迷宫城"
 labyrinth_desc:0 "迷宫城的结构相对来说很少，任何地图都无法描绘它；所有的地标随时可能移动。"
 labyrinth_effect_desc:0 "效果：\n$BULLET_WITH_TAB$#N 90%#!的概率在离开时迷失于此地。\n$BULLET_WITH_TAB$每月获得[stress|E]。\n$BULLET_WITH_TAB$无视以上效果若你是阿波菲斯（妖蛆）的仆从。"
 labyrinth_option:0 "深入迷宫城"
 oblivion_title:0 "#X $spirit_travel_header$湮灭#!"
 oblivion_desc:0 "#X 湮灭是熵本身，是不断变幻的毁灭与疯狂之力，没有什么能从那回来。#!"
 oblivion_effect_desc:0 "#X 效果：\n$BULLET_WITH_TAB$入此地者，其存在将被抹除。#!"
 oblivion_option:0 "#X 末于湮灭#!"
 abyss_title:0 "$spirit_travel_header$深渊"
 abyss_desc:0 "深渊，也被称为地狱或无底坑，是上帝创造的黑暗维度，用于关押堕落者的永恒监狱。"
 abyss_effect_desc:0 ""
 abyss_option:0 "堕入深渊"
 aetherial_realm_title:0 "$spirit_travel_header$以太界"
 aetherial_realm_desc:0 "以太界。也被称为乙太界，是影界内最广的近界域，横跨灵之荒野，直到影幕。它在物质世界的景象即是天空，不断循环着黑夜和白天。"
 aetherial_realm_effect_desc:0 ""
 aetherial_realm_option:0 "飞入以太界"
 first_horizon_title:0 "$spirit_travel_header$初穹界"
 first_horizon_desc:0 "初穹界位于地球大气层的边缘，遍布着穹界界域，包括有影域。"
 first_horizon_effect_desc:0 ""
 first_horizon_option:0 "飞入初穹界"
 true_horizon_title:0 "$spirit_travel_header$真穹界"
 true_horizon_desc:0 "真穹界，被科技联盟称为亚空间，被以太之子称为以太空间，是位于近影界和远影界之间的广阔影界。对沉睡者来说，它表现为太阳和小行星带之间的空间。"
 true_horizon_effect_desc:0 ""
 true_horizon_option:0 "飞入真穹界"
 far_horizon_title:0 "$spirit_travel_header$远穹界"
 far_horizon_desc:0 "远穹界大致对应于小行星带的所在处。"
 far_horizon_effect_desc:0 ""
 far_horizon_option:0 "飞入远穹界"
 POD_spirit_travel.102.t:0 "#X $spirit_travel_header$落入湮灭#!"
 POD_spirit_travel.102.desc:0 "#X 你落入了湮灭……#!"
 POD_spirit_travel.102.a:0 "#X ……#!"
 DREAMING_TOOLTIP:0 "你无法进入梦界：\n@warning_icon!#X $TRIGGER_OR$#!\n$has_fae_trait_tooltip$\n$has_kueijin_trait_tooltip$\n$has_see_the_lands_of_the_spirit_perk_tooltip$"
 glen_title:0 "$spirit_travel_header$幽谷"
 glen_desc:0 "幽谷是[penumbra|E]的一个区域，饱和于奇原能量。幽谷通常与物质世界中未受开发的荒野地区联系在一起（所有它们越来越稀少，越来难进入）。"
 glen_effect_desc:0 "效果：\n$BULLET_WITH_TAB$待在此地的[GetTrait('werewolf').GetName( GetPlayer )]角色每月失去一定[stress|E]。"
 glen_option:0 "休于幽谷"
 far_dreaming_title:0 "$spirit_travel_header$远梦界"
 far_dreaming_desc:0 "远梦界是[dreaming|E]的一部分，对应于人类的集体梦境。"
 far_dreaming_effect_desc:0 ""
 far_dreaming_option:0 "遇见远梦界"
 deep_dreaming_title:0 "$spirit_travel_header$深梦界"
 deep_dreaming_desc:0 "深梦界是[dreaming|E]中离着苏醒世界最远的部分。"
 deep_dreaming_effect_desc:0 ""
 deep_dreaming_option:0 "遇见深梦界"
 inventium_title:0 "$spirit_travel_header$构界"
 inventium_desc:0 "构界是[astral_reaches|E]的界域之一，充满了人类梦寐以求的所有发明。这些发明以一种可察的爆裂声显现出来，并轻轻地落入巨大的堆积物中，充满了整个界域的各地。"
 inventium_effect_desc:0 ""
 inventium_option:0 "升入构界"
 courts_title:0 "$spirit_travel_header$诸庭"
 courts_desc:0 "沿着峰界，旅行者可以到达诸庭，诸庭代表了类似想法的星界体化认知，比如缪斯之或元素之庭。"
 courts_effect_desc:0 ""
 courts_option:0 "升入诸庭"
 river_of_death_title:0 "$spirit_travel_header$死亡之河"
 river_of_death_desc:0 "死亡之河是大风暴中的一条水路，是冥河城通往幽土和其他冥府的主要旁路。"
 river_of_death_effect_desc:0 ""
 river_of_death_option:0 "潜入死亡之河"
 sunless_sea_title:0 "$spirit_travel_header$无日之海"
 sunless_sea_desc:0 "命名缘由自它上面的天空永远是黑暗的，来自船只和信标等来源的光线在无日之海可在几英里外看到，因为它从水面上散射开来。"
 sunless_sea_effect_desc:0 ""
 sunless_sea_option:0 "潜入无日之海"
 far_shore_title:0 "$spirit_travel_header$彼岸"
 far_shore_desc:0 "彼岸是冥界的一块神秘领地，由被称为“光辉者”的达尔菲人实体控制。对现代冥河城民来说，彼岸是由异端控制的领土，不值得信任。"
 far_shore_effect_desc:0 ""
 far_shore_option:0 "前往彼岸"
 weeping_bay_title:0 "$spirit_travel_header$泣湾"
 weeping_bay_desc:0 "泣湾位于灵魂之海和无日之海的中间，是冥河城的主要港口，也是与其他各个死城的联系。海湾的形状很有特点，呈半月形，并不断充斥着被灵铸成海湾的死灵的呜咽和呻吟。"
 weeping_bay_effect_desc:0 ""
 weeping_bay_option:0 "前往泣湾"
 sea_of_souls_title:0 "$spirit_travel_header$灵魂之海"
 sea_of_souls_desc:0 "围绕着冥河城和泣绝岛建造的保护性海墙。它的名字来自于那些被锻造或灌进墙体结构中的不幸的死灵。"
 sea_of_souls_effect_desc:0 ""
 sea_of_souls_option:0 "潜入灵魂之海"
 isle_of_sorrows_title:0 "$spirit_travel_header$泣绝岛"
 isle_of_sorrows_desc:0 "泣绝岛是一个岩石岛，位于死亡之河的三角洲，在大风暴的深处。"
 isle_of_sorrows_effect_desc:0 ""
 isle_of_sorrows_option:0 "前往泣绝岛"
 veinous_stair_title:0 "$spirit_travel_header$静脉阶梯"
 veinous_stair_desc:0 "静脉阶梯是一条从冥河城直接通往迷宫城的通道。幽土最稳定的地方，由未知类型的黑色石头组成。"
 veinous_stair_effect_desc:0 ""
 veinous_stair_option:0 "潜入静脉阶梯"
 well_of_the_void_title:0 "$spirit_travel_header$虚空之井"
 well_of_the_void_desc:0 "虚空之井是湮灭的物理表象，位于迷宫城的中心和底部。"
 well_of_the_void_effect_desc:0 "效果：\n$BULLET_WITH_TAB$#N 90%#!的概率在离开时迷失于此地。\n$BULLET_WITH_TAB$#N 9%#!的概率在离开时被抹除存在。\n$BULLET_WITH_TAB$每月获得大量[stress|E]。\n$BULLET_WITH_TAB$无视以上效果若你接受阿波菲斯（妖蛆）的腐化或已经是仆从。"
 well_of_the_void_option:0 "#X 落入虚空之井#!"
 court_of_eshtarra_title:0 "$spirit_travel_header$埃什塔拉的宫廷"
 court_of_eshtarra_desc:0 "埃什塔拉，歌者，是狼族占星学中地球星君。"
 court_of_eshtarra_effect_desc:0 ""
 court_of_eshtarra_option:0 "拜见地球星君"
 court_of_sokhta_title:0 "$spirit_travel_header$索赫塔的宫廷"
 court_of_sokhta_desc:0 "索赫塔是露娜的法相之一，该太神是狼族和其他许多变形者的守护神，她的宫廷里有许多月使和其他同情狼国的灵。"
 court_of_sokhta_effect_desc:0 ""
 court_of_sokhta_option:0 "拜见太阴星君"
 court_of_katanka_sonnak_title:0 "$spirit_travel_header$卡坦卡·索纳克的宫廷"
 court_of_katanka_sonnak_desc:0 "卡坦卡·索纳克，风骑士，是狼族中占星学的太阳星君。"
 court_of_katanka_sonnak_effect_desc:0 ""
 court_of_katanka_sonnak_option:0 "拜见太阳星君"
 weaver_reaches_title:0 "$spirit_travel_header$织者境"
 weaver_reaches_desc:0 "织者境是搁浅的固化现实，类似于天文学家的数据化地图。这张网的交叉节点将冷恒星和冻结行星锁定在一个非自然的对称性上。没有生命的迹象存在。巨大的织者之灵，如“星蜘蛛”，在网中巡逻和维护，并确保一切都保持在其规定的位置。"
 weaver_reaches_effect_desc:0 ""
 weaver_reaches_option:0 "进入织者境"
 wyld_reaches_title:0 "$spirit_travel_header$奇原境"
 wyld_reaches_desc:0 "奇原境是一个混沌的地方。行星和彗星根据不断变化的法则相互碰撞，相互舞动。燃烧的冷太阳冻结了周围的一切，而其他的恒星则以其周边的反重力波将一切推开。"
 wyld_reaches_effect_desc:0 ""
 wyld_reaches_option:0 "进入奇原境"
 wyrm_reaches_title:0 "$spirit_travel_header$妖蛆境"
 wyrm_reaches_desc:0 "妖蛆境的恒星已经烧成了没有生命的躯壳，或者坍塌成了黑洞，通常直接通向秽恶界域。满是污染和火焰的星云在它们周围旋转，遮住了它们的星座，使它们成为影界天空中的黑暗斑点，不被任何人看到。"
 wyrm_reaches_effect_desc:0 ""
 wyrm_reaches_option:0 "进入妖蛆境"
 shard_realm_of_prime_title:0 "$spirit_travel_header$根源之碎域"
 shard_realm_of_prime_desc:0 "与地球和月球相关联的[shard_realm|E]。"
 shard_realm_of_prime_effect_desc:0 ""
 shard_realm_of_prime_option:0 "进入根源之碎域"
 malfeas_title:0 "$spirit_travel_header$秽恶界域"
 malfeas_desc:0 "秽恶界域是位于深影界的疯狂妖蛆神体界域。这是一个地狱般的噩梦世界，充满了所有可以想象的可怕东西，还有一些可怕到仅仅试图想象就会使人发疯的事物。"
 malfeas_effect_desc:0 ""
 malfeas_option:0 "堕入秽恶界域"
 temple_obscura_title:0 "$spirit_travel_header$暗隐寺庙"
 temple_obscura_desc:0 "暗隐寺庙是秽恶界域的一个地点，位于黑螺旋迷宫的入口。它是清真寺和大教堂的混合体，是东方宣礼塔和西方柱身凹槽的混合体。"
 temple_obscura_effect_desc:0 ""
 temple_obscura_option:0 "进入暗隐寺庙"
 black_spiral_labyrinth_title:0 "$spirit_travel_header$黑螺旋迷宫"
 black_spiral_labyrinth_desc:0 "黑螺旋迷宫，在中原被称为玄黑迷宫，是秽恶界域内的一个螺旋形迷宫，里面有难以想象的妖蛆之恐怖。"
 black_spiral_labyrinth_effect_desc:0 ""
 black_spiral_labyrinth_option:0 "行于黑螺旋"
 POD_spirit_travel.103.t:0 "$spirit_travel_header$陷于迷宫城"
 POD_spirit_travel.103.desc:0 "你无法在无意义的迷宫城中确定自己的方向，现在你又回到了你起始的地方。 "
 POD_spirit_travel.103.a:0 "我迷失了"
 POD_spirit_travel.1010.t:0 "$spirit_travel_header$禁忌亵渎"
 POD_spirit_travel.1010.desc:0 "你已身处虚空之井。见不到任何逃跑的机会，也许你应该听从那诱人的低语……"
 POD_spirit_travel.1010.a:0 "我向你屈服，巨蛇！"
 POD_spirit_travel.1010.b:0 "绝不！"
 POD_spirit_travel.1200.t:0 "$spirit_travel_header$恶湍"
 POD_spirit_travel.1200.desc:0 "恶湍从迷宫城中喷发而出，可以触及大风暴所在的任何地方——从幽土到[dark_kingdom|E]。恶湍由冥界的事物组成——遗物、怨灵和大风暴本身，从灵质雨到灵火雨不等。大风暴是一场回忆的风暴，幸运的拾荒者可以找到一两件藏在渣滓中的有用物品。"
 POD_spirit_travel.1200.a:0 "我可以在里面找到什么有用的东西。"
 POD_spirit_travel.1200.b:0 "我该躲起来。"
 POD_spirit_travel.1003.t:0 "$spirit_travel_header$灵师教导"
 POD_spirit_travel.1003.a:0 "我的灵师。"
 ASTRAL_REACHES_TOOLTIP:0 "你无法进入[astral_reaches|E]：\n@warning_icon!#X $TRIGGER_OR$#!\n$has_mage_trait_tooltip$\n$has_kueijin_trait_tooltip$\n$has_psychic_projection_perk_tooltip$\n$has_separate_ba_perk_tooltip$\n$has_see_the_lands_of_the_spirit_perk_tooltip$"
