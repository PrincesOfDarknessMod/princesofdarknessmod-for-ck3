l_simp_chinese:
 spirit_travel_header:0 "灵界穿越："
 POD_spirit_travel.998.t:0 "$spirit_travel_header$强制回归"
 POD_spirit_travel.998.desc:0 "你因能量不足而被强制遣返。"
 POD_spirit_travel.998.a:0 "我呆的太久了！"
 POD_spirit_travel.999.t:0 "$spirit_travel_header$回归"
 POD_spirit_travel.999.desc:0 "你如你所愿地结束了穿越。"
 POD_spirit_travel.999.a:0 "大地！我回来了。"
 POD_spirit_travel.1001.t:0 "$spirit_travel_header$灵感"
 POD_spirit_travel.1001.desc:0 "邻近绝壁的灵界区域被称为镜像之地，因为其看起来就像附近中原地区的倒影而得名。\n\n由于这是你的第一次灵界旅行，看到这奇异的景色让你感到悟得了什么。"
 POD_spirit_travel.1001.a:0 "厉害！"
 POD_spirit_travel.1002.t:0 "$spirit_travel_header$灵师教导"
 POD_spirit_travel.1002.desc_opening:0 "你进入了灵界，尽可能的深，然后你遇到了一位"
 POD_spirit_travel.1002.desc_high:0 "上古者，历史记录上的万鬼，太上老祖"
 POD_spirit_travel.1002.desc_yin:0 "阎魔"
 POD_spirit_travel.1002.desc_yang:0 "强大灵类"
 POD_spirit_travel.1002.desc_low:0 "普通灵类"
 POD_spirit_travel.1002.desc_ending:0 "，其向你分享了一些心法理解。"
 POD_spirit_travel.1002.a:0 "我的灵师。"
 POD_umbra_travel.100.t:0 "$spirit_travel_header$半影界"
 POD_umbra_travel.100.desc:0 "你正处于半影界。半影界反映了物理现实，但是是“本该”的现实。虽然现被分割，但两者曾经是结合在一起的。灵界仍然关联着物质世界，因为如果它完全消失，地球就无法维持生命。"
 POD_umbra_travel.100.a:0 "我将向”上“而去。"
 POD_umbra_travel.100.b:0 "我将向”外“而去。"
 POD_umbra_travel.100.c:0 "那是条小道？"
 POD_umbra_travel.100.e:0 "若我改变心绪……"
 POD_umbra_travel.100.f:0 "我想要再探索一下这里。"
 POD_umbra_travel.100.g:0 "我想回到物质世界。"
 POD_umbra_travel.200.t:0 "$spirit_travel_header$星界"
 POD_umbra_travel.200.desc:0 "你正处于星界，也被称为星光界、星影界、高影界或上影界。星界是思想、观念、概念的国度。"
 POD_umbra_travel.200.b:0 "我想要再探索一下这里。"
 POD_umbra_travel.200.c:0 "我将向”下“而去。"
 POD_umbra_travel.300.t:0 "$spirit_travel_header$灵之荒野"
 POD_umbra_travel.300.desc:0 "你正处于灵之荒野。灵之荒野是中影界的另一个名称，是近界之间的空间。"
 POD_umbra_travel.300.b:0 "我想要再探索一下这里。"
 POD_umbra_travel.300.c:0 "我将向”内“而去。"
 POD_umbra_travel.400.t:0 "$spirit_travel_header$近梦界"
 POD_umbra_travel.400.desc:0 "你正处于近梦界。梦界是一个独立的宇宙。据说，只要知道如何寻找，任何和所有东西都可以在这里找到。"
 POD_umbra_travel.400.b:0 "我想要再探索一下这里。"
 POD_umbra_travel.400.c:0 "愿我能够回去？"
 POD_underworld_travel.100.t:0 "$spirit_travel_header$暗影之地"
 POD_underworld_travel.100.desc:0 "你正处于暗影之地。暗影之地是现实的一个镜像”皮肤“，生者国度的每一个地点在暗影之地都有一个相应的地点，在大多数情况下，这些地点遵守传统的距离法则。"
 POD_underworld_travel.100.a:0 "我将向”下“而去。"
 POD_underworld_travel.100.b:0 "若我改变心绪……"
 POD_underworld_travel.100.c:0 "我想要再探索一下这里。"
 POD_underworld_travel.100.d:0 "我想回到物质世界。"
 POD_underworld_travel.200.t:0 "$spirit_travel_header$风暴"
 POD_underworld_travel.200.desc:0 "你正处于灵魂风暴。灵魂风暴是一个由能量、记忆和恶灵组成的永恒漩涡，它从迷界中发出，并不断向暗影之地和黑暗诸国倾泻灵质和材料。"
 POD_underworld_travel.200.b:0 "我想要再探索一下这里。"
 POD_underworld_travel.200.c:0 "我将向”上“而去。"
 POD_spirit_travel.1100.t:0 "外交挑战"
 POD_spirit_travel.1100.desc:0 "你被土著拦住了，也许你可以说服他们告诉你如何通过这里。"
 POD_spirit_travel.1110.t:0 "军事挑战"
 POD_spirit_travel.1110.desc:0 "你被一个棋局所阻止，是时候展示你多善于此道了。"
 POD_spirit_travel.1120.t:0 "管理挑战"
 POD_spirit_travel.1120.desc:0 "你被一个数学谜题拦住了，你善于此么？"
 POD_spirit_travel.1130.t:0 "谋略挑战"
 POD_spirit_travel.1130.desc:0 "你在路上遇到了一个强大的敌人，也许你可以用一些小把戏来分散其的注意力？"
 POD_spirit_travel.1140.t:0 "学识挑战"
 POD_spirit_travel.1140.desc:0 "你被一个字谜拦住了，你能解决这个问题吗？"
 POD_spirit_travel.1100.a:0 "我会尽我全力。"
 POD_spirit_travel.1100.critical_success:0 "大成功"
 POD_spirit_travel.1100.success:0 "成功"
 POD_spirit_travel.1100.fail:0 "失败"
 POD_spirit_travel.1100.critical_fail:0 "大失败"