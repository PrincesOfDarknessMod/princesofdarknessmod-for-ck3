l_simp_chinese:
 POD_daimonion_events.1000.title:0 "感知罪恶——障碍"
 POD_daimonion_events.1000.desc:0 "即使有了恶魔的力量，无知的人为了控制自己的欲望而设置的障碍也很难击倒。能否解放这欲望就全靠你能不能溜进[recipient.GetFirstName]的头脑中。首先，你必须得突破这障碍。"
 POD_daimonion_events.1000.option.a:0 "血之力就足够了。"
 POD_daimonion_events.1000.a.tt_true_faith:0 "其用信仰抵抗了我！"
 POD_daimonion_events.1000.a.success.desc:0 "胜利！"
 POD_daimonion_events.1000.a.failure.desc:0 "败北"
 POD_daimonion_events.1000.a.tt_success:0 "其的罪恶将增长并反噬其。"
 POD_daimonion_events.1000.a.tt_failure:0 "[recipient.GetSheHe]不在触及范围"
 POD_daimonion_events.1000.option.b:0 "我的意志将粉碎其的防御！"
 POD_daimonion_events.1000.option.c:0 "今晚不是合适的时候……"
 POD_daimonion_events.1000.option.c.tt:0 "放弃"
 POD_daimonion_events.1000.option.b.tt.beast:0 "#R 我想我是这里的坏家伙……"
 POD_daimonion_events.2000.title:0 "感知罪恶——胜利"
 POD_daimonion_events.2000.desc:0 "我已经突破了心灵防线，恶魔的力量扭曲和腐化了[recipient.GetName]。"
 POD_daimonion_events.2000.option_a:0 "又一灵魂落入我名录"
 POD_daimonion_events.3000.title:0 "感知罪恶——玷污"
 POD_daimonion_events.3000.desc:0 "你的一生都在压制你的情感和需求。你听从别人告诉你什么是对的，什么是错的。你压制自己并迫使自己变得更好。\n #R 为何？\n 不再了。你知道你想要什么，和你需要做什么。"
 POD_daimonion_events.3000.desc.auspex:0 "是的，有些事情是不对劲。这些情绪，它并不来自你。你隐约看到了一位……男人？女人？恶魔？很难说。但你的超自然感官向你展示出了一个名字——[actor.GetFirstNameNoTooltip]。"
 POD_daimonion_events.3000.option_a:0 "这很爽"
 POD_daimonion_events.4000.title:0 "感知罪恶——失败"
 POD_daimonion_events.4000.desc:0 "这不是你的目标向其的罪恶屈服的那一晚，但这只是时间问题——所有的天使都将堕落，当其到了地狱时，你会在等着其。"
 POD_daimonion_events.4000.option_a:0 "很快的……"
 POD_daimonion_events.5000.title:0 "灵魂之战——结果"
 POD_daimonion_events.5000.option.loss:0 "你好，黑暗，我的老朋友……"
 POD_daimonion_events.5000.option.loss.ct:0 "你将获得几项新罪恶，以及它们的增强版本"
 POD_daimonion_events.5000.option.victory:0 "只有最强的英雄才能够主宰自己"
 POD_daimonion_events.5000.desc.victory:0 "你在与自己最糟糕的部分作斗争——罪恶、缺陷和黑暗。而你赢了。黑暗仍然在你体内，但现在它对你作出回应。\n\n你的罪的力量是由你来挥霍的。"
 POD_daimonion_events.5000.desc.loss:0 "这一切都太突然了——该显象凭空出现，用你身上每一参差不齐的、有缺陷的部分的力量进行攻击。这毫无希望……你怎么可能与一个使你的一切都显得如此弱小的存在战斗？\n\n你不能。最好还是放弃。"
 POD_daimonion_events.5000.loss.toast:0 "[recipient.GetFirstName]输了"
 POD_daimonion_events.5000.loss.toast.torpor:0 "其很快陷入了[torpor|E]以逃避"
 POD_daimonion_events.5000.loss.toast.sins:0 "其屈服于堕落"
 POD_daimonion_events.5000.victory.toasttitle:0 "[recipient.GetFirstName]赢了"
 POD_daimonion_events.5000.victory.toast:0 "[recipient.GetFirstName]获得了对自身罪恶的掌控"
 POD_daimonion_events.5001.title:0 "灵魂之战——开场"
 POD_daimonion_events.5001.desc:0 "一场与心灵最黑暗的部分的战斗——这就是你给[recipient.GetName]规定的命运。唉，其不知道这种对峙的价值，并试图抵抗。让堤溃蚁孔吧。"
 POD_daimonion_events.5001.a.tt_success:0 "争斗将开始"
 POD_daimonion_events.5001.a.tt_failure:0 "[recipient.GetSheHe]将在无知的情况下保有安全"
 POD_daimonion_events.5001.power_fail:0 "灵魂之战失败"
 invite_infernalist_decision:0 "引诱唤魔者"
 invite_infernalist_decision_desc:0 "通过引导你自身扭曲的力量，找到一位被恶魔缠身的凡人，并把其吸引到你身边。"
 invite_infernalist_decision_tooltip:0 "让有才能的唤魔者为你服务"
 invite_infernalist_decision_effect_tooltip:0 "一位唤魔者加入了你的宫廷"
 invite_infernalist_decision_tp:0 "黑暗能提供……"
 invite_infernalist_decision_confirm:0 "如同蜘蛛入网……"