l_simp_chinese:
 podintroductionswerewolves.2.t:0 "赞美太阳！"
 podintroductionswerewolves.2.desc:0 "在毁灭性的剥皮瘟疫之后，日耀族群可能是西欧幸存的最强大的狼人前哨。然而，其创始人之后的继任并不顺利，而且是本无缘的局外人，黑怒的海伦，成为了圣地的领袖。\n不过，这还是可简单处理的部分。邻近的吸血鬼已经迅速地扑向衰弱的族群，并占领了其南部的大部分领土。如果海伦想作为一个传奇人物被人们记住，她就必须在附近强大的吸血鬼和裁判官去发动变乱之前，迅速稳固她周围的环境。"
 podintroductionswerewolves.2.a:0 "我们将重新铸就我们的荣耀。"
 podintroductionswerewolves.3.t:0 "不绝如缕"
 podintroductionswerewolves.3.desc:0 "狼人在伊比利亚的存在几乎消失了。曾经强大的星域族群在与邻近的圣雅各伯骑士团的战争中遭到了毁灭性的打击，当尘埃落定时，唯一的赢家是吸血鬼。随着大多数领导人和战士的死亡，族群就像被摧毁了一样，直到一个奇怪的外来者，啮骨者的露西尔出现。\n这个狡猾的骗子设法用错综复杂的计划迷惑了蚂蟥和裁判官，使星域得以稍稍恢复。令所有人惊讶的是，甚至惊讶到她自己，即她成为了被围困的幸存者的实际统治者。尽管如此，即使取得了这些小胜利，她的处境也几乎是绝望的。她的伎俩和诡计是否足以拯救伊比利亚狼族？"
 podintroductionswerewolves.3.a:0 "逆境求生？"
 podintroductionswerewolves.4.t:0 "后日谈"
 podintroductionswerewolves.4.desc:0 "在整个斯堪的纳维亚，芬里尔仔兽高呼他们最近对可恨的沃坦（又称奥丁）的胜利。但即使是他们也知道，这场胜利让他们付出的代价远远超过了他们能够承受的范围。随着他们最好的战士和战争领袖的死亡和离去，一个未经检验的领袖已经崛起，奥丁的子民正在迅速集结到南方，为他们受诅的神报仇。\n再往东，白海族群的盖亚之子观察着局势，担心这场战争也会很快吞噬他们。他们应该犹豫是在附近的俄罗斯寻找新的朋友，还是全力支持芬里尔仔兽所进行的无望战争？他们的答案可能会改变斯堪的纳维亚狼人的命运。"
 podintroductionswerewolves.4.a:0 "没有胜利的滋味"
 podintroductionswerewolves.5.t:0 "凯尔特的最后一战"
 podintroductionswerewolves.5.desc:0 "芬尼安部族一直是不列颠群岛的一支强大力量，但却被剥皮瘟疫大幅削减了，使它对被称为密特拉的强大吸血鬼敞开大门。他们在威尔士勉强支撑着，在一位久经考验和富有魅力的领导人，布拉达王的领导下，在狂海圣地重新集结。\n尽管他令人尊敬，但许多人都在想，也许即使是他没法对这种绝望的局面做些什么。也许凯尔特人的时代真的结束了？或者，这将是芬尼安最伟大的故事的开始，即他们再征服自己家园的光荣故事？"
 podintroductionswerewolves.5.a:0 "至少，这将是一个值得讲述的故事"
 podintroductionswerewolves.6.t:0 "狼之地"
 podintroductionswerewolves.6.desc:0 "俄罗斯和大草原仍然是一片未被开发的土地，狼人在这里处于强势地位。来自强大的新月族群，尤里·特瓦里维奇统治着银牙，是其部族的典范。他对抗芭芭雅嘎的受诅的影幕的事迹已经成为传奇。\n再往东，赤爪已经撤退到冬林圣地，舔舐他们的伤口，因为他们已经被剥皮瘟疫伤害得相当严重。\n最后，在南部，影爵仍在与棘秘魑展开永恒的战争。他们也被剥皮瘟疫削弱了，被破退后，但任可以从正在进行的棘秘魑/睿魔尔战争中获益，以恢复其领土损失。"
 podintroductionswerewolves.6.a:0 "如果我们能团结起来……"
 podintroductionswerewolves.7.t:0 "十字军狼群"
 podintroductionswerewolves.7.desc:0 "亚科是人类监护者的土地，这个奇特的部族在人类的城市中感到自在。不过这并不意味着他们比其他狼人少了什么，最近为争夺光誓圣地的领导权而发生的无情战争就说明了这一点。随着尘埃落定，目前是海外帝国的女士伊萨博·杜·洛朗担任着阿尔法。\n由于专注于这场内部冲突，人类监护者对该地区的吸血鬼带来的日益增长的威胁视而不见。这种威胁，如果不迅速而果断地处理，可能会给城狼带来灭顶之灾。"
 podintroductionswerewolves.7.a:0 "光明之誓破灭了？"
 podintroductionswerewolves.8.t:0 "远离埃及"
 podintroductionswerewolves.8.desc:0 "自从他们败给可恨的埃及“神”赛特后，寂静漫游者就一直在他们永生的统治者——智慧的乌普奥特身后逃亡。根据观占迹象和预言，他们在马拉喀什附近发现了卜塔之轮，并从那时起一直忙于为自己夺取周围的地区。\n寂静漫游者人数不多，也不是最善战的狼族，但由于有了新的目标感和他们尊敬的阿尔法的耐心领导，他们终于又找到了希望。有些人甚至梦想着有一天能再次见到埃及……"
 podintroductionswerewolves.8.a:0 "新的希望"
 podintroductionswerewolves.9.t:0 "世界之巅"
 podintroductionswerewolves.9.desc:0 "远离狼国的其他人，小小的星占部族一直在喜马拉雅山上繁衍生息。他们天性沉思、耐心，一直满足于在相对平静的环境中生活。然而，目前这种状态不可能永远持续下去。\n最近，一个强大的邪灵的袭击被聪明的尚卡尔视为一种预兆。如果星占一直与世隔绝，拒绝与外界的任何联系，等待他们的只有灭亡。带着一种混合着恐惧和好奇的感觉，星占现在数个世纪以来第一次向外看去。等待他们的是什么？"
 podintroductionswerewolves.9.a:0 "一整个新世界可供探索"