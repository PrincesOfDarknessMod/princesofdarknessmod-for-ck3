l_simp_chinese:
 podintroductions.1.t:0 "黑玫瑰"
 podintroductions.1.desc:0 "当凡人的法兰西在阿尔比十字军的内部混乱中挣扎时，吸血鬼的法兰西也同样举步维艰。亚历山大，第四代梵卓血族，在不到两年前还是法兰西和巴黎的亲王。他被一场由妥芮朵族赛丽安娜和他自己的子嗣杰弗里·杜·坦普尔领导的政变推翻了。妥芮朵女王已经夺取了国家的控制权并试图巩固自己的地位，以面对自己同族和其他法兰西王后们的反对。另一方面，杰弗里得到了巴黎作为战利品，但假以时日，他可以以自己的血脉为由去竞争王位。至于南边，图卢兹的埃斯克拉芒正在利用清洁派起义来达到自己目的，但可能很快就会面对北法兰西的怒火。这个国家在这场磨难中会找到一个比亚历山大更好的新统治者吗？还是会被混乱和毁坏所席卷？"
 podintroductions.1.a:0 "在我的统治下，法兰西会更好……"
 podintroductions.2.t:0 "无聊的英格兰神王"
 podintroductions.2.desc:0 "不列颠尼亚的吸血鬼历史与梵卓的密特拉密不可分。先是波斯神，后是罗马神，在基督教驱逐这位第四代血族之前，他的密教几乎遍及整个欧洲。带着他的狂热分子撤往英格兰的土地后，他迅速积聚了力量……并渐渐厌倦了这个地方的渺小。因为经常性地陷入蛰眠中，诺曼人的入侵摧毁了他的权力宝座，迫使他苏醒以恢复秩序。150年后，密特拉再一次对英格兰漠不关心，他的许多臣民，像康沃尔的休和罗宾·李兰德，已经获得了事实上的独立，并筹划着他的灭亡。更糟糕的是，威尔士和苏格兰仍然支持着属于德鲁伊教和北欧血族的古老宗教小屋。没有人能真正地说出密特拉是否能再次粉碎这个新的反对派，或者只是让它在他的鼻子底下溃烂，直到为时已晚。"
 podintroductions.2.a:0 "神王万岁……目前来说。"
 podintroductions.3.t:0 "众王与巫士之地"
 podintroductions.3.desc:0 "作为梵卓氏族无可争议的核心，德意志牢牢地掌握在哈德施塔特的人手中。然而，即使是他的统治也不是没有受到挑战，比如德意志西部的茱莉亚·安塔西亚和巴伐利亚难以捉摸的伊尔丝·雷纳格这样的伪装者。在南面，篡位者睿魔尔氏族正处境危险，东欧恶毒的棘秘魑氏族正在迅速逼近他们的据点。他们与强大的梵卓的防御协议也许是他们唯一的生命线。法兰西流亡的亲王，巴黎的亚历山大就在附近，有着伟力归于自身的强大力量的吸血鬼，虽然他在政治上却是孤立的。哈德施塔特必须迅速行动，抑制住他子嗣约根的野心，摧毁茱莉亚和伊尔斯的势力基地，并在有或没有睿魔尔的帮助下确保他的东部阵线。德意志将成为梵卓氏族王冠上的明珠，或者化为灰烬。"
 podintroductions.3.a:0 "罗马已是过眼云烟，未来在这里。"
 podintroductions.4.t:0 "暗影再征服"
 podintroductions.4.desc:0 "伊比利亚是勒森魃氏族传统的权力中心，但凡人的收复失地运动使贤士陷入了一场痛苦的内战。北部，西尔维斯特·德·鲁伊斯领导着信奉基督教的正统勒森魃氏族，有着统治整个伊比利亚半岛的明确野心。不过，他必须注意他那些野心勃勃的封臣们，比如安布罗西奥·路易斯·蒙卡达或阿拉贡的露西塔。在南部，经过几十年的内讧，自称为阿什拉派的穆斯林勒森魃氏族，发觉安达卢西亚的拜德尔是一位值得尊敬的苏丹。在其他地方的新老亲王，从帝王般的梵卓氏族到野性的冈格罗，都注意到这些贤士们的弱点，并等待合适的时机出手。这再征服可能是伊比利亚勒森魃统治的最后一丝气息。"
 podintroductions.4.a:0 "只要给我一些时间，伊比利亚将再度统一。"
 podintroductions.5.t:0 "诸神黄昏"
 podintroductions.5.desc:0 "北欧人的信仰早已从凡人的脑海中消失，但对斯堪的那维亚的吸血鬼仍然存在。它的拥护者，勇猛的英灵战士还坚持自己的信念……但是希望正在迅速消退。「崇高之主」维特和瓦尔基里的首领乌尔夫斯多蒂尔陷入了沮丧几近蛰眠。不过，有些人仍在继续战斗，例如布伦希尔德和「独眼」瓦尔比约格，他们试图摧毁哈德施塔特率领的入侵的基督教吸血鬼。使英灵战士感到乐观的一线希望是，新来者很难团结一致，彼此争吵，最显着的是在丹麦分裂为了三个伪装者。在北部的荒原上，一群冷酷无情的狂徒称自己为禁闭原罪，他们在这片贫瘠的土地上建立了一个让人质疑的宣称。无论他们是新的盟友还是敌人，北欧人的最后一场战役已经临近，十字似乎再次成为人们的最爱……"
 podintroductions.5.a:0 "斯堪的纳维亚将与过去不再一样。"
 podintroductions.6.t:0 "帝国的安魂曲"
 podintroductions.6.desc:0 "如果说中世纪的意大利是一个分裂的国家，那么夜晚的意大利就是一个火药桶。强大的老吸血鬼们争夺着欧洲人口最多的城市。在意大利北部，梵卓枢机法布里齐奥·乌尔菲拉在米兰坐镇，牢牢掌握着意大利教会的大权。在威尼斯，卡帕多西亚氏族的乔瓦尼后裔是一个横跨海洋的贸易帝国的主人，时间会告诉我们他们的关注点是在意大利本土还是在东方，就像他们的父辈氏族一样。在西西里岛，勒森魃氏族的首都由忠诚的蒙塔诺守卫着，但是过度扩张和西班牙的内战使这片暗影之海变得脆弱。最后，所有的目光都聚焦在罗马，提图斯·梵卓鲁·卡蜜拉最近在这里苏醒。这位永恒的执政官是罗马帝国和迦太基灭亡的幕后主谋，他开创了一个梵卓领导的新时代。当其他小领袖和不朽的国王在意大利其他地方崛起时，亲王们的战争从来没有像这里这样危险过。"
 podintroductions.6.a:0 "条条大道通罗马。"
 podintroductions.7.t:0 "无路可退"
 podintroductions.7.desc:0 "十字军邦联摇摇欲坠地立于黎凡特，一个更危险的吸血鬼联邦在他们中间崛起。奥利弗之席是该地区各城市亲王们之间的协约，由幸存者卡维娅·加杜巴领导。「母狮」是一位萨洛比，自其始祖扫罗死于新近崛起的睿魔尔氏族之手后，该氏族就在西欧几乎灭绝。虚弱氏族的大多数成员已经躲藏起来，但卡维娅仍打算坚持立场。尽管如此，她那不稳定的联盟已经处于危险之中，因为强大的大马士革正字面意思上的陷入疯狂深渊。达舒夫，那个古老的妥芮朵苏丹已经把他的灵魂卖给了未知的力量，只有他的子嗣和一个孤独的阿刹迈战士还伫立面对注定要发生的灾难。此协约将是一个垂死氏族的最后一场欢呼，还是通往光明未来的希望？"
 podintroductions.7.a:0 "耶路撒冷是奇迹之城，毕竟……"
 podintroductions.8.t:0 "面纱之后"
 podintroductions.8.desc:0 "阿拉伯是阿什拉派活动的所在地，穆斯林吸血鬼通过共同的信仰超越氏族团结在一起。他们在半岛上的地位很稳固，但是耶路撒冷被十字军夺去，埃及被古蛇夺去，这使他们与马格里布和安达卢西亚的兄弟们断绝了关系。更糟糕的是，美索不达米亚已经再次落入地狱主义者巴力之手，由阿扎内尔的内尔伽勒派领导。他的目标是占领该地区的大城市，大马士革，巴格达和提尔，为了他邪恶的主人的回归，他需要献祭人口。具有讽刺意味的是，他最强的对手是蒂尔的塔尼特，另一个巴力，摩洛克希姆的一个分支。这种对抗使重新崛起的巴力陷入了内战，并给穆斯林信徒带来了他们可以被制止的希望。否则，整个世界都将处于危险之中。"
 podintroductions.8.a:0 "文明的摇篮也可能是它的临终之床。"
 podintroductions.9.t:0 "斗篷与弯刀"
 podintroductions.9.desc:0 "波斯是阿刹迈氏族的所在地，这是一个外人眼中的神秘团体。在新加冕的、极具争议的最长者纳穆尔图姆的统治下，他们表面上的团结正在出现裂痕，因为不同的派系开始发挥他们的权力。刀锋之网的忒弥斯想让他的氏族成为一个狂热的刺客密教，准备为他的黑暗之主归来准备一支军队。术士们的阿什拉夫正走在一条温和的道路上，他将阿刹迈视为法官和外交官。最后，战士们的贾马尔是一位虔诚的穆斯林，他乐于与麦地那的阿什拉派哈里发国恢复友好关系。这一政治动荡促进了该地区另一个群体的发展，即达斯图尔·阿诺什的失落部族，一个崇拜二代吸血鬼的异端。分裂和低效使阿刹迈陷入瘫痪，他们是会找到一个新的共同目标，还是会爆发内战？"
 podintroductions.9.a:0 "我将通过外交或其他手段一统波斯。"
 podintroductions.11.t:0 "永恒之战"
 podintroductions.11.desc:0 "从一开始，印度就一直是雷伏诺氏族与阿修罗提伽耶或万鬼，一群神秘的亚洲「吸血鬼」，之间的战争舞台。没有胜利者，双方战斗人员都处于崩溃的边缘，各派都在计谋推翻现任领导人。在西部，钱德拉布特拉正集结雷伏诺进行另一场战斗。而在东方，达楠带领着小龙们发起另一个冲锋。而其他政权，从达埃纳到棘秘魑的卡塔里利亚，都在不停息的风暴中寻找机会。最终会浮现出赢家吗？"
 podintroductions.11.a:0 "很显然，我是印度和平的唯一希望。"
 podintroductions.12.t:0 "不断堕落"
 podintroductions.12.desc:0 "虽然迦太基在几个世纪前就被烧毁了，但在马格里布仍能感受到迦太基的陷落。该地区自此被不同的阿什拉派——穆斯林吸血鬼——苏丹瓜分，但他们中没有一个真正成功地巩固了该地区。两位最好的人选是索福尼斯巴和扎姆拉·马图布。索福尼斯巴是突尼斯的老领导人，她仍然记得在迦太基时期她的城市的陷落。阿尔及尔的扎姆拉·马图布则是位年轻的富有野心的勒森魃。赛特之子在这里也有立足之地，就像睿魔尔氏族一样。马格里布有着分裂的权力和丰富的历史，对于任何爱冒险的亲王或苏丹来说，马格里布都是诱人的奖赏。"
 podintroductions.12.a:0 "我们需要离开迦太基。"
 podintroductions.13.t:0 "金字塔的阴影之中"
 podintroductions.13.desc:0 "埃及已经忍受了许多外来的征服者，而它的本地不死族如果没有耐心和韧性就什么都不是。真正的权力在吉萨，赛特族的心腹。自由氏族——或者腐败氏族——取决于你问谁——正准备让自己的力量从十字军东征所创造的权力真空中获利。毫无疑问，他们的第一个目标将是开罗。由强大的第五代梵卓安东尼乌斯领导，这座城市不会轻易陷落，如果公开宣战，它可以挫败蛇们。每个人都确信赛特信徒将很快采取他们的第一步行动，但是没有人能说准是什么时候，如果他们这样做了，他们将会被阻止……"
 podintroductions.13.a:0 "埃及和我们一样都是不朽的。"
 podintroductions.14.t:0 "二元之地"
 podintroductions.14.desc:0 "非洲本土的吸血鬼是莱本，一个松散的多血系的联合和自我创造的吸血怪物们。他们掌握着大陆上大部分的真正权力，但必须与众多在他们的土地上寻求名声和财富的冒险家或小军阀竞争。更糟糕的是，非洲还是一些真正古老的生物的家园，从它是人类摇篮的时候起就一直在那里。随着同穆斯林阿什拉派与世界开放的各种新道路，莱本是否能够在变化的时代适应和昌盛还有待观察。"
 podintroductions.14.a:0 "机遇与危险并存。"
 podintroductions.15.t:0 "直入云霄"
 podintroductions.15.desc:0 "在外人看来，西藏是非常奇怪的吸血鬼的家园……如果他们能被称为吸血鬼的话!所谓的纯白流亡者是中国的饿鬼——万鬼的一部分，在东方有着牢固的地位。然而在西方，甚至有更奇怪的事物存在，从恶魔崇拜可憎的事物到已死的埃及神的启示信徒。吐蕃远离任何真正的不死族权利中心，对大多数吸血鬼来说，西藏只是一个次要的地方。但是神秘的事物可以给那些寻求足够深入的人带来回报……"
 podintroductions.15.a:0 "吐蕃沉浸在其自己的世界之中。"
 podintroductions.16.t:0 "东方惊雷"
 podintroductions.16.desc:0 "大草原不适合吸血鬼居住。很少有城市来隐藏，很少有国家要操纵和屈从于他们的意志。但是，从东方来了一种新的吸血鬼，这种吸血鬼生活在无边无际的平原上，与游牧的蒙古人生活在一起。这些安答，一条冈格罗分支，是骄傲的战士，跟随大规模扩张的蒙古帝国征战。与已经存在的西方冈格罗的冲突似乎是不可避免的，而且，当这些新来者到来时与欧洲该隐之子的紧张关系也在所难免。对于吸血鬼来说，变化是很罕见的，但当它与雷鸣般的大批游牧骑马弓箭手一同出现时，变化可能是他们中许多人经历的最后一件事……"
 podintroductions.16.a:0 "改变并不总是受欢迎……"
 podintroductions.17.t:0 "汝等进入此地……"
 podintroductions.17.desc:0 "东欧是棘秘魑氏族的传统领地，但最近他们的霸权受到了由德意志和匈牙利梵卓氏族支持的睿魔尔氏族的崛起的挑战。最近的战争以一项痛苦的和平条约结束了，条约的双方是督军统领弗拉基米尔·鲁斯托维奇，和梵卓的十字军战士约根·冯·费尔登。缓冲地，奥伯图斯秩序已经建立，由和平调解人迈卡·维科斯领导。现在，每个人都在舔着自己的伤口，鲁斯托维奇试图确保他对氏族的控制，而匈牙利的梵卓则试图在他们的首领布尔斯库的蛰眠下来解决继承危机。最后，厄特里乌斯代替睿魔尔领导篡位者，展现出对抗魔物的统一金字塔的正面形象。每个人都知道在这个地区，战争是不可避免的，除非一个吸血鬼有足够的力量来一劳永得地摧毁他的对手。会是谁呢？"
 podintroductions.17.a:0 "一块待驯服的土地。"
 podintroductions.18.t:0 "褪色的梦"
 podintroductions.18.desc:0 "君士坦丁堡的灰烬还在燃烧，秃鹫已经在它的尸体上盘旋。米迦勒的幻梦，一个自迦太基以来再未出现过的吸血鬼乌托邦，和它的创作者一起陨落，而一些军阀和帝国的残余试图生存下来。其中最重要的是阿方索，他是第四次十字军东征的煽动者之一，现在控制着君士坦丁堡。雄心勃勃的勒森魃仍然在向西西里岛的氏族首领臣服，但能持续多久呢？再往西，布鲁赫族的娜塔莉亚·斯维亚托斯拉夫是最后一个仍然活跃的真正的幻梦信徒之一，她希望自己能继承「天使长」米迦勒的衣钵。安娜·科穆宁则没有这样的雄心壮志，利用尼西亚最终得到了在她还活着时就应该属于她的帝国。就像其他雄心勃勃的亲王在旧城的废墟上建立领地一样，君士坦丁堡可能会重生……也可能永远消亡。"
 podintroductions.18.a:0 "米迦勒是否已经预见到这场混乱？"
 podintroductions.19.t:0 "祖母，祖母……"
 podintroductions.19.desc:0 "在所有人的记忆中，俄罗斯是存在的最强大的血族之一芭芭雅嘎的家园。这个第四代的诺斯费拉图，传说是氏族的真正始祖，是这片土地的重要组成部分，并利用它来保护自己不受她复仇的尊长的伤害。这个地区的人来说幸运的是，「女巫」在蛰眠。但她的暗影帷幕的影响仍然可以感觉到，这是由她忠实的二号人物维克多培育出来的。在这样的条件下，俄罗斯只有三种类型的吸血鬼：「祖母」的封臣，那些勇敢的，和即将死去的吸血鬼。而后两类常常相互重叠。"
 podintroductions.19.a:0 "小心那些小女孩……"
 podintroductions.20.t:0 "旧世界的新命运"
 podintroductions.20.desc:0 "传统上，波兰是棘秘魑督军领的边疆，是更……古怪魔物的家园，现在它正逐渐形成自己的、独立的实体。督军们摇摇欲坠的权威，以及他们完全的脱离时代，让新一代的吸血鬼得以立足并繁荣起来。首先是虔诚的布鲁赫氏族的以撒·本·亚伯拉罕，他在克拉科夫周围聚集追随者，驱逐曾经的亲王拉兹科利纳。这可能是使波兰摆脱棘秘魑影响的第一步。但更大的挑战还在等着我们，最引人注目的是要驱逐那个绝对令人厌恶的人，那就是海德翁·雅罗斯拉维奇，一个甚至会被同族认为过于极端的棘秘魑……"
 podintroductions.20.a:0 "我必须留意这改革之风，否则就会被它摧毁。"
 podintroductions.21.t:0 "自由之地"
 podintroductions.21.desc:0 "远离西欧暴君的残暴统治，波罗的海地区是两种新型吸血鬼派系结构的发源地。在立陶宛，冈格罗氏族的喀喇已经团结了一大批自由意志的原始教徒，他打算将其作为基督教和梵卓氏族向东方扩张的停靠点。在更远的北方，蓝色卡尔领导着一个英灵战士自由邦，也许是最后一个这样的州了，因为斯堪的纳维亚正在被哈德施塔特的下仆们所控制。这两项实验都面临着巨大的冒险，无论是内部的还是外部的，而且主要依赖于他们领导人的超凡魅力。即使他们的勇气和信念对于即将到来的梵卓氏族的猛攻是徒劳的。"
 podintroductions.21.a:0 "一位老不死的残余可没那么容易灰飞烟灭。"
 podintroductions.2001.t:0 "欢迎来到黑暗亲王"
 podintroductions.2001.desc:0 "首先，感谢您玩这个Mod！\n《黑暗亲王》是对基础游戏的彻底改造，旨在将《黑暗世界》带入十字军之王3中。因此，它改变了许多玩法概念，并使用原作世界观的广泛内容来提供一种不同的体验。"
 podintroductions.2001.a:0 "让我们来谈谈吸血鬼的主要机制……"
 podintroductions.2001.b:0 "……或者其他概念"
 podintroductions.2001.c:0 "这个世界和其故事背景"
 podintroductions.2001.d:0 "我这样就行，直接开始吧！"
 podintroductions.2001.e:0 "抹去我的超自然特质，并进入角色生成器"
 podintroductions.2003.t:0 "吸血鬼101问"
 podintroductions.2003.desc:0 "首先要注意的是，作为一个吸血鬼，你是永生的……某种程度上。你不会死于年老或疾病，但被处以火形或斩首仍然会结束你的亡生。因此，继承是一个较小的，但仍然需要一点关注的地方。同样的道理，婚姻不能使你生儿育女，所以婚姻大多是少数宗教可用的政治工具。\n宗教是玩法的核心部分，甚至比在CK3本体里的更重要。在这里，它代表了你的角色的核心哲学原则，帮助他不沦落为兽。事实上，心兽——你内在的怪物的真实表现——是你最坏的敌人之一，因此管理你的压力极度重要，使你不成为它的猎物，这意味着你的角色变成了一位野生尸妖，导致他不可扮演。\n注意你的饥渴，这代表着你对血液需求的核心修正。饥渴被用于许多计谋和能力，并会由缓慢的自动补充或通过积极猎食来手动补充。"
 podintroductions.2003.a:0 "一些进阶概念"
 podintroductions.2004.t:0 "如何才能不烛化为烬"
 podintroductions.2004.desc:0 "吸血鬼学习新事物很慢。因此，你仍然可以使用基础生活方式，但会有更低的升级速度。但是，你可以选择把你的时间投入到异能中，开放诅咒的力量供你使用。\n建筑代表了你对芸芸众生的影响。大多数都有不同的属性增减，你必须策划如何平衡它们。值得注意的是，以高度发展的公国首都为例的主要人口中心是任何一位亲王都能梦想到的最大资产。\n战争被明显地改变了，更大地强调了骑士。你的骑士的勇武能力使其可以轻易地战胜更多的敌人，特别是当大部分都是征召兵的时候。因此，要小心那些高勇武能力的敌对吸血鬼。\n在一个充满欺骗和诡计的世界里，谋略能力扮演着更重要的角色。有一些新的计谋供你使用，一些和你的能力有关，而且大多数角色都有秘密，你可以不说出它们……又或者在宗教允许的情况下用来勒索。"
 podintroductions.2004.a:0 "回到初始选项"
 podintroductions.2005.t:0 "到目前为止的故事……"
 podintroductions.2005.desc:0 "《黑暗世界》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n《黑暗世界》的吸血鬼主要来源于圣经中对该隐（第一个谋杀犯）的诅咒，他们中的大多数都可以追溯血统世系到他的身上，这一体系被称之为「世代」。这棵不死族宗族之树已经分裂成数个派系和氏族，每个派系都有自己的力量、弱点和地缘权力基础。\n在你正在玩的《黑暗时代：吸血鬼》中，我们正在几个重大危机的十字路口演绎不死族的世界。君士坦丁堡之劫已经发生，并摧毁了当时主要的该隐之子帝国，其涟漪效应远及法兰西和波斯。与此同时，教廷的裁判所正在获取支持和信息，几乎准备好开启一个惩罚被诅咒的吸血怪物的时代……"
 podintroductions.2102.t:0 "欢迎来到黑暗裁判官"
 podintroductions.2102.desc:0 "首先，感谢您玩这个Mod！\n《黑暗亲王》是对基础游戏的彻底改造，旨在将《黑暗世界》带入十字军之王3中。因此，它改变了许多玩法概念，并使用原作世界观的广泛内容来提供一种不同的体验。"
 podintroductions.2102.a:0 "让我们来谈谈裁判官的主要机制……"
 podintroductions.2102.b:0 "……或修士会的特殊能力"
 podintroductions.2102.c:0 "关于裁判所的资料"
 podintroductions.2102.d:0 "我这样就行，直接开始吧！"
 podintroductions.2103.t:0 "启明"
 podintroductions.2103.desc:0 "1230年，裁判所才刚刚建立。你们的敌人，吸血鬼，在数量和武器上都比你们强。他们有强大的阴谋能力，并可以使用骑士轻易破坏你的大部分军队，特别是你的征召兵。\n你有一些优势，其中之一是你强大的建筑群和生活方式树。你还有独特的计谋，用以找到怪物的巢穴，在那里你可以对吸血鬼进行一对一的行动。很明显，他们会保护自己……\n准备面对艰苦的一局，你必须耐心等待并好好建立你的力量基础，所有的同时，猎杀你最具威胁性的邻居，直到你足够强大到以收复夜晚。"
 podintroductions.2103.a:0 "修士会的工具箱"
 podintroductions.2103.c:0 "关于裁判所的资料"
 podintroductions.2104.c:0 "关于裁判所的资料"
 podintroductions.2104.t:0 "光之彩虹"
 podintroductions.2104.desc:0 "每个修士会都有自己的方式来确保继承人。圣雅各伯之剑，亚柯骑士和红修会可以与年轻的凡人进行角色互动，使他们成为自己的侍从或游戏所判定的「孩子」。圣约翰修女会也可以这样做，但只能收年轻女性。\n冯·穆尔瑙家族就像游戏本体的家族一样，但每个冯·穆尔瑙家族的人在他或她的一生中都有机会成为一名裁判官。最后，神目既可以授任新成员，也可以组建家庭，但除非有授任，否则他们的家庭不会自然而然的成为裁判官。"
 podintroductions.2104.a:0 "回到初始选项"
 podintroductions.2105.t:0 "到目前为止的故事……"
 podintroductions.2105.desc:0 "《黑暗世界》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在玩《黑暗时代：裁判官》，它讲述了一群被驱使的凡人如何真正改变世界的故事。他们是第一群真正看清吸血鬼避世真相的人，并在教会的支持下开始了暗影裁判。\n摆在他们面前的任务是艰巨的，而在1230年，他们仅仅触及了他们偶然发现的世界的表面。怀着不死的信念，他们勇敢地迈出了对抗地狱眷族的第一步……\n这些新人裁判官并不知道，他们的勇气和动力将为吸血鬼开启一个持续数个世纪的痛苦与火焰的时代。"
 podintroductions.22.t:0 "在白十字之下"
 podintroductions.22.desc:0 "这里是亚柯骑士诞生的地方。26年前，戈捷·德·丹皮尔在君士坦丁堡的熊熊烈火中与被称为吸血鬼的怪物战斗。他感应到了上帝的召唤，因此拿起剑对抗这些真正的敌人。\n从那以后，戈捷带领着来自他位于塞浦路斯的要塞的暗影裁判所的军事力量发挥着重要作用，但时不我待。年老的戈捷知道他有生之年大概率看不到替上帝重夺君士坦丁堡的梦想成真。\n因此，戈捷正在为挑选继任者做准备，计划着让下一代的亚柯骑士引领基督徒获得对抗吸血怪物的最终胜利。他们就是上帝之剑，保卫人类对抗黑暗中的怪物的最后的守护者们。"
 podintroductions.22.a:0 "我们将拯救人类，或死于尝试"
 podintroductions.23.t:0 "清洁派之影"
 podintroductions.23.desc:0 "罗马教廷第一次明白吸血鬼的威胁时是在对抗清洁派教徒的阿尔比十字军时期。那时，他们发现法兰西南部的可怜人，大多数时候，都是被这些受诅咒的生物给误导了。\n冕下在那时候对法兰西表现出特别的兴趣并不值得奇怪，那时候的法兰西很明显是吸血鬼感染的高发地。裁判所的行动由图卢兹的艾格嫩领导，他是一个神秘的人，著名的罗德里格·德·纳瓦拉昔日的友人。作为一个崛起中的间谍网络——神目——的大师，艾格嫩谋划深远，清楚地知道法兰西的情况远比罗马认为的还要糟糕。走错任何一步他都将万劫不复……"
 podintroductions.23.a:0 "要狂热，但也要耐心和狡猾"
 podintroductions.24.t:0 "太阳对十字"
 podintroductions.24.desc:0 "英格兰对于罗马教廷来说一直是一片令人费解的土地。长期坚持着古老的宗教活动，和巫术甚至其他更糟糕的东西有关的谣言时不时地出现，这座岛屿从来没有被真正地驯服。\n玛利亚修女，圣约翰修女会的领袖，是众多试图理解侵蚀着这片土地的腐化的根源的裁判官之一。修女们出现的幻觉中描述了一位被称为「密特拉」的实体，他宣称自己是一位神灵，每当太阳落山后就会出现。\n有着这样清晰可见的目标，再以她们长久的热情为武器，修女们准备好在一场她们才刚开始理解了一小部分的战斗中领导裁判所。"
 podintroductions.24.a:0 "独一真神"
 podintroductions.25.t:0 "贵族狂热"
 podintroductions.25.desc:0 "冯·穆尔瑙，一个被上帝诅咒——或祝福——的德意志贵族家族，因为他们能够字面意思上的闻到邪恶的气味。这一特征，再加上他们在巴伐利亚的据点，使他们成为暗影裁判所无价的伙伴。\n他们的参与由利奥波德·冯·穆尔瑙协调，此人体弱多病，却有着超凡的智慧和魄力。他实际上是裁判所之建立的幕后谋士和它的非正式领导者。\n在他强有力的领导下，巴伐利亚已经成为世界各地裁判官的希望灯塔，成为一旦邪恶的吸血鬼被净化后尘世会变得如何的承诺。利奥波德还远没有完成这一目标，不过他已经在计划他的下一步了，就是将各裁判所修士会合并成一个新团体……"
 podintroductions.25.a:0 "挺出对抗黑暗的一家"
 podintroductions.26.t:0 "族内其首"
 podintroductions.26.desc:0 "不管暗影裁判所让你怎么想，但实际上罗德里格·德·纳瓦拉才是第一位对抗黑暗的人。这个小贵族参加了阿尔比十字军东征，并发现自己有证据表明有「什么」在那。\n这一发现，以及此后无数次试图让他闭嘴的吸血鬼行动，都对罗德里格的理智造成了影响。如今，这位圣雅各伯骑士团创始人的敌人到处都是，甚至在他的裁判官同僚中也是如此。因此，他没有正式加入暗影裁判所，但勉强接受他们对伊比利亚再征服的支持。\n圣座担心，罗德里格的固执可能会成为一个严重的问题，因为吸血鬼很清楚他的存在，而教会无法让半岛感受到它的全部力量。"
 podintroductions.26.a:0 "一位独自面对黑暗的偏执者"
 podintroductions.27.t:0 "兽之腹"
 podintroductions.27.desc:0 "圣座愿意相信意大利不受吸血鬼的腐化。但是，揭露的事实表明枢机主教法布里齐奥·乌尔菲拉实际上一直是地狱眷族，这让教宗冕下极为震惊。\n为了不让民众感到恐慌，他指派了红修会的非正式领导人维特多利亚·圣蒂尼·迪·帕尔马对这一近在咫尺的威胁进行评估。\n有着藏书丰富的修会图书馆供她使用，维特多利亚已经有了一些非常惊人的发现。吸血怪物在意大利随处可见，甚至在夜幕降临时在圣城游行。\n然而强大的力量已将她的小房间团团包围，如果她不小心，她的调查甚至可能在开始之前就结束……"
 podintroductions.27.a:0 "基督教的核心受到威胁"
 podintroductions.101.t:0 "你到目前为止的故事"
 podintroductions.101.desc:0 "虎落平阳被犬欺，海伦，也就是现在的你，世界上最美丽的女人，沦落到在一个遥远的小岛上与你的死敌搏斗。很久以前，人们崇拜着你，人们为了看你一眼而浴血拼杀。墨涅拉俄斯偷走了你的一切。\n固执的斯巴达国王无法接受你在布匿战争中站在罗马一边的事实，并从那以后一直在追杀你。他摧毁了你深爱的庞培以及无数你喜爱的仆从和子嗣。现在，你身边只有你的宝贝帕里斯……但你已经厌倦了逃避。\n是时候结束这千年的恩怨了，迈锡尼的女儿。摧毁墨涅拉俄斯和他愚蠢的乌托邦梦想！\n到那时，也只有到那时，未来才会再次变得光明。"
 podintroductions.101.a:0 "现在该结束了"
 podintroductions.helena:0 "一旦墨涅拉俄斯死了，你就可以获得一个特殊决议"
 podintroductions.102.t:0 "你到目前为止的故事"
 podintroductions.102.desc:0 "阿布萨隆大人，丹麦之父，您对受诅的波罗的海睿魔尔的长征使您的领地向冒牌者和冒险者敞开了大门。他们必须被解决，因为您是丹麦唯一需要的统治者。\n在粉碎这些笨蛋的同时，您可能想要了解更多关于你在旅途中于鲁加发现的的奇怪仪式。您还在想这些信徒想干什么，让他们的神复活吗？显然这是用于阻止您的最后一招，但……\n如果您能成功地驾驭自己身上的神灵「斯凡特维德」的力量……您将势不可挡！\n是时候让您重新征服丹麦并开始您的化神飞升了，阿布萨隆大人。这显然是您真正的命运。"
 podintroductions.102.a:0 "首先丹麦，随后……"
 podintroductions.absalon:0 "你可以投资一个特殊决议来逐步破解斯凡特维德的仪式"
 podintroductions.103.t:0 "你到目前为止的故事"
 podintroductions.103.desc:0 "强大的密特拉，你在英格兰的回归是一个巨大的成功，入侵的诺曼吸血鬼终于被解决了。然而，仍然有一些问题需要解决，各种不法之徒和独立亲王正在挑战你的统治。\n然而，真正的问题在别处，因为你已经能感觉到长年累月的困乏在你的灵魂中蔓延。你也很了解如果你再睡的话你的摄政们一定会把事情搞砸的。\n然而最近，你在你的血中感觉到你的旧爱，赛特之子的齐茉媞里，再次苏醒了。也许你可以把她叫来，和她重归于好？她在你的宫廷里一直是一个纷争人物，你的封臣们可能不会欢迎她的归来……但谁在乎他们的意见呢？"
 podintroductions.103.a:0 "回到我身边来吧，伊西斯的至爱"
 podintroductions.mithras:0 "你派人去找齐茉媞里，这花费许多，并可能会激怒你的封臣"
 podintroductions.103.b:0 "和你的前任复合从来都不是一个好主意"
 podintroductions.mithrasb:0 "你忘了整个故事"
 podintroductions.104.t:0 "你到目前为止的故事"
 podintroductions.104.desc:0 "督军罗斯托维奇，你的统治陷入了危机。尽管你击败了约根和他的梵卓，但你还是被血族突然的背后捅了一刀，被迫签署了无条件和平协议。你的封臣们对此并不满意。\n「太年轻！太西方！无能粉碎睿魔尔！」他们说。这些蠢货，只能勉强守住他们可怜的城堡，对战争和统治一无所知。尽管如此，你还是需要它们。\n你必须回到你的「战争审判」的策略，与你自己的封臣进行小规模的战争以遏制他们的野心。他们会再次学会尊重你。"
 podintroductions.104.a:0 "让魔物飨宴开始吧"
 podintroductions.vlad:0 "作为罗斯托维奇，你有一个与你的直属封臣的特殊角色互动"
 podintroductions.105.t:0 "你到目前为止的故事"
 podintroductions.105.desc:0 "伊崔乌斯大人，你的对手格拉崔克斯被流放到了法兰西，使你成为了睿魔尔的宠臣和家族领袖。尽管如此，你还是要面对氏族内外的威胁。你东方的棘秘魑督军领是一个永远存在的问题，但你也必须确保没有其他魔法师试图篡夺你的合法位置。\n作为创始人的得力助手，你有很多工具来确保这种情况不会发生。一定要明智地使用它们，为睿魔尔家族带来荣耀！……当然，也为了你自己。"
 podintroductions.105.a:0 "金字塔由我指令"
 podintroductions.etrius:0 "作为伊崔乌斯，你有一个与你的直属睿魔尔封臣的特殊角色互动"
 podintroductions.106.t:0 "你到目前为止的故事"
 podintroductions.106.desc:0 "令人惊怖的玛塔孙塔，你刚刚醒来来到了这个陌生的新世界，远离了你深爱的匈人的光辉岁月。尽管如此，还是有一些新的草原骑士需要帮助，一些新的「文明」需要摧毁！\n但你一个人做不到这，冈格罗氏族已经忘记你了。因此，你必须依靠你自己的后代。森德拉克已经在那里了，但宰亚特已经皈依了一种奇怪的新宗教，而且是你无法触及的……但沃罗丘斯，大概是三者中最强大的一位，倒是很有机会争取。\n你可以召唤他，尽管考虑到距离，这将花费你大量的能量。或者你可以把他忘了。"
 podintroductions.106.a:0 "让我们再一起同骑吧，我的子嗣！"
 podintroductions.106.b:0 "我自己一个人做就行了"
 podintroductions.107.t:0 "你到目前为止的故事"
 podintroductions.107.desc:0 "无畏的泰贝莎，你已经被最长者亲自送到伊比利亚来了，她给的任务很明确：阻止再征服运动。\n这是极大的荣誉，也是极大的责任，因为你氏族中最受尊敬的成员都认为你能够击退基督教勒森魃之潮。\n你把巴达霍斯作为你的权力中心，尽可能接近前线，但你现在被迫玩一个你不太熟悉的游戏，政治游戏。\n安达卢西亚分裂着，但分裂会导致灭亡。因此，到目前为止，你已经接受了拜德尔对联合的穆斯林该隐之子的冷酷领导，但您担心她的方法在长期来看可能会导致进一步的不团结。\n你不会让你的长者失望，但摆在你面前的任务仍然令人恐惧，而真正的威胁可能比你最初想象的更近……"
 podintroductions.107.a:0 "我将成为安达卢西亚之盾"
 podintroductions.tabitha:0 "作为泰贝莎，你有一个限时决议"
 podintroductions.108.t:0 "你到目前为止的故事"
 podintroductions.108.desc:0 "罗克大人，伊比利亚现在一片混乱。勒森魃的内战可能会吞噬所有人，包括你。如果你想生存下去，你必须时刻有所准备。\n你的狡猾和外交技巧使你赢得了邻居的尊重，即使你是下位氏族之一。很明显，他们仍然鄙视你，如果你表现出软弱，他们会毫不犹豫地粉碎你。记住，他们只有在别无选择的情况下才会接受你作为他们的同伴。\n你也被称作是一位有天赋的，尽管做事很强迫性的，阴谋家，这可能是你在可怕的时期到来时最大的资产。利用好它，你甚至可能成为新伊比利亚半岛最杰出的领导人之一。"
 podintroductions.108.a:0 "我必须提前计划"
 podintroductions.roque:0 "作为罗克，你可以投资一个能在完成时给予特殊加成的计谋"
 podintroductions.109.t:0 "你到目前为止的故事"
 podintroductions.109.desc:0 "蒙塔诺大人，暗影之海活在一片狼藉当中。伊比利亚内战，第四次十字军东征的灾难以及卡蜜拉在罗马的崛起已经使得你所掌控且从你尊长那里接过的庞大帝国几乎化为乌有。\n不能再这样下去了，否则会招致氏族的混乱，因为那些年轻的伪君子已经开始传播关于你作为一个失败领导者的谣言。\n为了恢复你的权威，行动方案很简单。确保西西里和意大利的安全，向勒森魃氏族展示你们仍然是一支不可忽视的力量。只有到那时，你才会再次受到尊重。"
 podintroductions.109.a:0 "还有许多事情要做"
 podintroductions.montano:0 "作为蒙塔诺，你有一个能恢复你摇摇欲坠的权威的特殊决议"
 podintroductions.110.t:0 "你到目前为止的故事"
 podintroductions.110.desc:0 "娜塔莉娅大人，君士坦丁堡在焚烧而你的新乌托邦梦想也随着化为灰烬。以你在希腊的强大地位，你可能是这座世界渴望之城的唯一希望……但是拉丁人已经盘的根深蒂固了。你需要一个计划。\n另一位幸存者安娜·科穆宁是围攻这座城市的完美盟友，但你知道……安娜她冷酷无情，野心勃勃，只在乎权力。\n另一种解决方法是忠于你的理想，并向剩下的米迦勒派寻求帮助。强大的马拉希底斯，米迦勒的选民，能帮上大忙。但他绝不会接受与安娜结盟，所以只能二选一。\n实用主义还是理想主义是摆在你面前的选择。选哪项，帝国独一的统治者？"
 podintroductions.110.a:0 "实用主义。我需要安娜的军队"
 podintroductions.110.b:0 "理想主义。马拉希底斯将指引我。"
 podintroductions.natalya:0 "你将与尼西亚的安娜·科穆宁结盟"
 podintroductions.111.t:0 "你到目前为止的故事"
 podintroductions.111.desc:0 "睿智的突伽·辛，俄罗斯比任何时候都需要你。你永远的敌人，可怕的芭芭雅嘎，现在还在沉睡，但她的暗影帷幕间谍仍然在他们对被诅鬼婆的暴政崇拜下压迫着你的故土。\n你将需要所有可集齐的帮助，来面对这艰巨任务。幸运的是，你被认为是可能是该隐之子世界最伟大的导师，你可以利用这个事实。\n把最棒的人聚集在您的周围，尊敬的导师，并带领他们走向胜利！"
 podintroductions.111.a:0 "新的一代将拯救我们"
 podintroductions.durgasyn:0 "作为突伽·辛，你在教育新后代时总具有一项特殊的，总是有益的，选项"
 podintroductions.112.t:0 "你到目前为止的故事"
 podintroductions.112.desc:0 "赞美赛特，也赞美你玛阿特卡勒，他最心爱的配偶，因为你拯救了误入歧途的「该隐之子」种族。当你看到这么多你所爱的子嗣没有遵从他的教导时，你的心会流泪。尽管如此，希望还是存在的，因为伊比利亚 勒森魃内战的混乱让他们中的许多人误入歧途，寻找指引。\n作为圣显者之一，赛特之子氏族的合法领袖，你很乐意提供这样的指导。只有全世界都在赞美他，你才会停止。到那时，也只有到那时，他才会凯旋而归到你身边……"
 podintroductions.112.a:0 "那么多可怜的灵魂等着被解放"
 podintroductions.maatkare:0 "作为玛阿特卡勒，你具有一项特殊角色互动用于转变任何非狂热非信者。该选项只在你处于赛特之道宗教时可用。"
 podintroductions.113.t:0 "你到目前为止的故事"
 podintroductions.113.desc:0 "卡维娅大人，你刚刚巩固的橄榄会议已经有一个新的危机正在引起您的注意。强大的大马士革城市已经沦陷在唤魔者的影响之下，它的疯狂将吞噬整个地区。\n玛纳尔，一位亲王的子嗣，比斯塔克，哈基姆派使节，是这座城市仅存的两名神志正常的吸血鬼，现在正请求你的帮助来净化这座城市。他们都发誓，如果你保证支持他们的事业，他们会尽他们所能帮助你。\n拯救大马士革将向世界传递一个强有力的信息，那就是萨洛比氏族仍然健在，但你也知道，这会让你成为巴力势力的首要目标，直到这座城市被拯救……"
 podintroductions.113.a:0 "我们必须赶上，否则就太晚了"
 podintroductions.113.b:0 "遗憾的是，会议目前太弱了"
 podintroductions.qawiyya:0 "要去掉负面修正，你必须在70年内拿下大马士革和巴尔米拉"
 podintroductions.114.t:0 "你到目前为止的故事"
 podintroductions.114.desc:0 "腓力背叛了你。卡山德背叛了你。就连亚历山大也背叛了你，他的命运就在眼前，却那么快就死去了。你孤身一人，佩塔尼夸。\n但在这里，你找到了力量和新的目标。当你彻底地回避人类的时候，新的盟友蜂拥而来，被称为「黑旋舞者」的狼人。他们崇拜一位叫做「妖蛆」的黑暗实体。\n也许这就是拯救你的关键，佩塔尼夸。走在这黑螺旋中可能会拯救你……或者进一步处刑你。\n但你还能往下走多远？"
 podintroductions.114.a:0 "真相就在下面"
 podintroductions.petaniqua:0 "作为佩塔尼夸，你有一项来行于黑螺旋的决议。请注意，这远非一种安全的尝试……"
 podintroductions.115.t:0 "你到目前为止的故事"
 podintroductions.115.desc:0 "狄奥尼修斯大人，第四次十字军东征的动荡正在蔓延到你所热爱的雅典。难民们来到这座城市，他们感到身心俱失。作为人性之路的主要倡导者之一，你有责任庇护这些可怜的灵魂。\n但你也可以在这个被毁的希腊重建秩序，以避免这样的创伤性事件再次发生。作为一个受人爱戴的老师和导师，一定要找到并培养你未来最好的接班人。该隐之子氏族现在比以往任何时候都需要他们。"
 podintroductions.115.a:0 "于烬重生"
 podintroductions.dionysius:0 "作为狄奥尼修斯，你在教育新后代时总具有一项特殊的，总是有益的，选项"