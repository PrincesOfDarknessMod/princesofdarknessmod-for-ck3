l_simp_chinese:
 POD_disciplinetrain.100.t:0 "异能训练"
 POD_disciplinetrain.100.desc:0 "If your retainer has vampiric blood in [disciplinetrainee.GetHerHis] veins but does not know a discipline you know, you may train [disciplinetrainee.GetHerHim] in that discipline. It is not a free process, you will have to share blood with [disciplinetrainee.GetHerHim]. More importantly, you will need to share your experience and accumualted blood resonance. Some disciplines are more difficult to teach than others, and as such will drain your willpower causing stress. You will teach [disciplinetrainee.GetFirstName] to..."
 POD_disciplinetrain.100.option.a:0 "获取强大的蛮力"
 POD_disciplinetrain.100.option.b:0 "以超自然的敏捷移动"
 POD_disciplinetrain.100.option.c:0 "Endure damage and fortify [disciplinetrainee.GetHerHis] mind"
 POD_disciplinetrain.100.option.d:0 "跟动物对话"
 POD_disciplinetrain.100.option.e:0 "强化[disciplinetrainee.GetHerHis]感官"
 POD_disciplinetrain.100.option.f:0 "操控心智"
 POD_disciplinetrain.100.option.g:0 "魅惑他人"
 POD_disciplinetrain.100.option.h:0 "Hide in plain sight"
 POD_disciplinetrain.100.option.i:0 "变形"
 POD_disciplinetrain.100.option.j:0 "Fleshcraft"
 POD_disciplinetrain.100.option.k:0 "Summon the shadow of death"
 POD_disciplinetrain.100.option.l:0 "Wield occult magick"
 POD_disciplinetrain.100.option.m:0 "Nothing at this time"