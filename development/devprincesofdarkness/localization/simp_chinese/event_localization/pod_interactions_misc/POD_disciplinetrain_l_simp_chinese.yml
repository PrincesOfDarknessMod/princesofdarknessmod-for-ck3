 POD_disciplinetrain.100.option.i:0 "变形"
 POD_disciplinetrain.100.option.j:0 "重塑血肉"
 POD_disciplinetrain.100.option.k:0 "召唤死亡阴影"
 POD_disciplinetrain.100.option.l:0 "行使隐秘魔法"
 POD_disciplinetrain.100.option.m:0 "现在什么也不做"
