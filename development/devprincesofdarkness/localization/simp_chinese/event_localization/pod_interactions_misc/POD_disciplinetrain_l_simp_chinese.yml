 POD_disciplinetrain.100.t:0 "[discipline|E]训练"
 POD_disciplinetrain.100.desc:0 "如果你家臣[disciplinetrainee.GetHerHis]血管里流着吸血鬼的血，但不了解一项你知道的[discipline|E]，你可以发掘[disciplinetrainee.GetHerHim]的那项[discipline|E]。这不是无代价的，你必须将血分享给[disciplinetrainee.GetHerHim]。更重要的是，你需要分享你的经验和积累的血液谐响。有些[disciplines|E]比其他更难教，因此会消耗你的意志力，造成压力。你将教会[disciplinetrainee.GetFirstName]去如何……"
 POD_disciplinetrain.100.option.a:0 "获取强大的蛮力"
 POD_disciplinetrain.100.option.b:0 "以超自然的敏捷移动"
 POD_disciplinetrain.100.option.c:0 "忍受伤害并巩固[disciplinetrainee.GetHerHis]的心智"
 POD_disciplinetrain.100.option.d:0 "跟动物对话"
 POD_disciplinetrain.100.option.e:0 "强化[disciplinetrainee.GetHerHis]的感官"
 POD_disciplinetrain.100.option.f:0 "操控心智"
 POD_disciplinetrain.100.option.g:0 "魅惑他人"
