l_simp_chinese:
 podkueijin.1.t:0 "一位合适的继承人？"
 podkueijin.1.desc:0 "你的仆人带着他们所能找到的饿殍回来了。他们中的一些人比其他人更有才华，但也需要更多的手段来束至你的仪式。无论如何，这仍然是一场赌博，在做出选择之前，你没有时间亲自检查他们，因为你给他们的突然关注会吸引敌人的注意。"
 podkueijin.1.a:0 "我不需要能力太出众的人。以免他们成为威胁……"
 podkueijin.1.a.tt:0 "新的继承人将出现，可将其看作你自己的子嗣。"
 podkueijin.1.b:0 "这一个至少看起来还行。"
 podkueijin.1.c:0 "我们会对这位保持密切关注。"
 podkueijin.1.d:0 "要就要最好的"
 podkueijin.100.t:0 "失衡"
 podkueijin.100.desc:0 "鬼人必须精心调控体内阴阳二气的平衡。阴气过盛会导致鬼人的外观极度近似于尸体或者非人，与之相对，阳气过盛可能导致多种致命的血族疾病爆发。"
 podkueijin.100.a:0 "一世过度自私的惩罚。"
 podkueijin.100.a.tt:0 "你对阴的偏移使得你逐渐变丑并且成为猎巫人的潜在目标。"
 podkueijin.100.b:0 "一生渴求的惩罚。"
 podkueijin.100.b.tt:0 "你对阳的偏移使得你成为爆发血族疾病的源头。"
 podkueijin.101.t:0 "僵尸"
 podkueijin.101.desc:0 "僵尸是彻头彻尾的怪物，无论如何都无法混入人群。僵尸肉体会慢慢变成病态的灰色，而骨头则变成漆黑色。皮肤起皱并压缩在骨头周围。獠牙变长并滴落毒液，黑色的尖刺从背部、关节和肋骨处长出来。整个身体发出磷光，闪烁着阴性能量。"
 podkueijin.101.a:0 "我是个怪物中的怪物。"
 podkueijin.1000.t:0 "气乏"
 podkueijin.1000.desc:0 "你只有勉强的一丝气来达成你的需求。但你的恶魄给了你一个提议，它将给你必要的魔气以度过难关，只要你给它一点容忍。你知道这是「饮鸩止渴」，但为了生存……"
 podkueijin.1000.a:0 "这是唯一的选择。"
 podkueijin.200.t:0 "阴阳倾向"
 podkueijin.200.desc:0 "阴气较多的震旦族裔是强大负能量的汇聚体，他们理智，冷静，残忍。\n阳气较多的震旦族裔则与之相反，贪婪的吞噬生命能量，他们是热情的生物，亲近凡人并富有情感。\n少数震旦族裔的能量是平衡的，他们的躯体同时保持着生与死的力量，二者和谐共处。\n你希望成为哪种？它会改变你的用气方式。"
 podkueijin.200.a:0 "阴"
 podkueijin.200.b:0 "平衡"
 podkueijin.200.c:0 "阳"
 podkueijin.300.t:0 "一位合适的继承人？"
 podkueijin.300.desc:0 "你叫你的侍从搜索在你的领地周围的魑魅的信息，你已经准备了必要的材料来举办使其他们成为䰢的仪式。一些信息被收集到了，你可以指定更多的要求以深入探索，但越是具体，代价就越高。\n首先，你想要一些最近死去并刚被转生的凡人，还是一些失去所有人性并唤醒了他们的形魄的「十」？"
 podkueijin.300.a:0 "一些刚死掉的农民就够了。"
 podkueijin.300.b:0 "受训的猎魔人。"
 podkueijin.300.exit:0 "忘了吧，放弃搜索。"
 podkueijin.300.nocost:0 "增加这搜索要求不会添加额外代价。"
 podkueijin.300.lowcost:0 "增加这搜索要求会耗费一小点威望作为代价。"
 podkueijin.300.highcost:0 "增加这搜索要求会耗费许多威望作为代价。"
 podkueijin.300.middlecost:0 "增加这搜索要求会耗费一定的威望作为代价。"
 podkueijin.300.back:0 "回到之前的选项。"
 podkueijin.310.t:0 "一位合适的继承人？"
 podkueijin.310.desc:0 "你想要你的继承人有怎样的年龄和性别？越年轻越难找，并会耗费更多。"
 podkueijin.310.a:0 "青年男人"
 podkueijin.310.b:0 "中年男人"
 podkueijin.310.c:0 "老年男人"
 podkueijin.310.d:0 "青年女人"
 podkueijin.310.e:0 "中年女人"
 podkueijin.310.f:0 "老年女人"
 podkueijin.320.t:0 "一位合适的继承人？"
 podkueijin.320.desc:0 "随着时间和努力，你的侍从最终会找到一个满足额外要求的目标，但这将增加最终要付出的代价。"
 podkueijin.320.a:0 "给我找一个在转生前就有这种身体特征的人。"
 podkueijin.320.b:0 "一些普通人就足够了。"
 podkueijin.321.t:0 "一位合适的继承人？"
 podkueijin.321.desc:0 "美貌如何？"
 podkueijin.321.a:0 "万里挑一"
 podkueijin.321.b:0 "千里挑一"
 podkueijin.321.c:0 "百里挑一"
 podkueijin.321.d:0 "普普通通"
 podkueijin.322.t:0 "一位合适的继承人？"
 podkueijin.322.desc:0 "智慧如何？"
 podkueijin.322.a:0 "万里挑一"
 podkueijin.322.b:0 "千里挑一"
 podkueijin.322.c:0 "百里挑一"
 podkueijin.322.d:0 "普普通通"
 podkueijin.323.t:0 "一位合适的继承人？"
 podkueijin.323.desc:0 "健壮如何？"
 podkueijin.323.a:0 "万里挑一"
 podkueijin.323.b:0 "千里挑一"
 podkueijin.323.c:0 "百里挑一"
 podkueijin.323.d:0 "普普通通"
 podkueijin.324.t:0 "一位合适的继承人？"
 podkueijin.324.desc:0 "其他要求？"
 podkueijin.324.a:0 "白化病"
 podkueijin.324.b:0 "巨人"
 podkueijin.324.c:0 "侏儒"
 podkueijin.324.d:0 "不需要更多了"
 podkueijin.325.t:0 "一位合适的继承人？"
 podkueijin.325.desc:0 "这是你在派出搜索队之前改变条件的最后机会。"
 podkueijin.325.a:0 "就这些了，去找人！"
 podkueijin.325.b:0 "返回并重新选择。"
 podkueijin.350.t:0 "一位合适的继承人"
 podkueijin.350.desc:0 "你的侍从给你带来了一个最符合你所有要求的人，现在是时候让这个人学习心法并成为你的继承人了。"
 podkueijin.350.a:0 "进行仪式"
 podkueijin.400.t:0 "心法教育1"
 podkueijin.400.desc:0 "到目前为止，你的弟子表现得相当乏善可陈。如果你继续训练，其可能会做得更好……或者也许其已经没有改善的希望？"
 podkueijin.400.a:0 "你需要更多训练。"
 podkueijin.400.b:0 "好吧，至少比什么没有强"
 podkueijin.400.nolearn:0 "你的弟子没能在心法上有所建树"
 podkueijin.401.t:0 "心法教育2"
 podkueijin.401.desc:0 "到目前为止，你的弟子一直表现很一般。如果你不是在寻找一个有天赋的弟子，这可能是足够的，但也许你可以通过更多的训练让其变得更好？"
 podkueijin.401.a:0 "你需要更多训练。"
 podkueijin.401.b:0 "不是最好的，但也不是最糟的"
 podkueijin.402.t:0 "心法教育3"
 podkueijin.402.desc:0 "你的弟子表现得很好，对基础的理解很扎实。这可能已经足够了，若非你要寻找完美的继承人？"
 podkueijin.402.a:0 "你需要更多训练。"
 podkueijin.402.b:0 "就当你准备好出师了。"
 podkueijin.403.t:0 "心法教育4"
 podkueijin.403.desc:0 "在古代，教育䰢需要十年时间，但当第五纪元到来时，只需两年就成了常态。你的弟子很幸运的能够学到底，甚至还能青出于蓝胜于蓝。"
 podkueijin.403.a:0 "你已经学会了我能教你的所有东西。"
 podkueijin.300.hugecost:0 "增加这搜索要求会耗费巨大的威望作为代价。"
 podkueijin.320.a.tt:0 "你将可在一系列天生特征中选择"
 podkueijin_education:0 "你将再训练该弟子一年。其可能会有所建树，或者一事无成。"
 podkueijin.400.learn:0 "你的弟子提升了其的心法"