l_simp_chinese:
 podkueijin.1.t:0 "一位合适的继承人？"
 podkueijin.1.desc:0 "你的仆人带着他们所能找到的饿殍回来了。他们中的一些人比其他人更有才华，但也需要更多的手段来束至你的仪式。无论如何，这仍然是一场赌博，在做出选择之前，你没有时间亲自检查他们，因为你给他们的突然关注会吸引敌人的注意。"
 podkueijin.1.a:0 "我不需要能力太出众的人。以免他们成为威胁……"
 podkueijin.1.a.tt:0 "新的继承人将出现，可将其看作你自己的子嗣。"
 podkueijin.1.b:0 "这一个至少看起来还行。"
 podkueijin.1.c:0 "我们会对这位保持密切关注。"
 podkueijin.1.d:0 "要就要最好的。"
 podkueijin.100.t:0 "心法"
 podkueijin.100.desc:0 "鬼人被送回世间偿还罪业，探索如何去完成这一试炼是不可避免的，所有鬼人都追随一种心法的指引，此为鬼人追寻自身于伟大轮回中的意义的方式。通过遵循心法的指引，一个鬼人能学会如何驾驭阴阳二气，了解自身不死的本性，并让自己重返宿业的轮回之中。"
 podkueijin.100.a:0 "我已然达到菩萨境界"
 podkueijin.100.b:0 "我即将达到菩萨境界"
 podkueijin.200.t:0 "失衡"
 podkueijin.200.desc:0 "鬼人必须精心调控体内阴阳二气的平衡。阴气过盛会导致鬼人的外观极度近似于尸体或者非人，与之相对，阳气过盛可能导致多种致命的血族疾病爆发。\n\n你总是能用“挪转阴阳”来调整你的阴阳状态。"
 podkueijin.200.a:0 "一世过度自私的惩罚。"
 podkueijin.200.b:0 "我将把阳气注入我的身体来暂时逆转一点平衡。"
 podkueijin.200.c:0 "一生渴求的惩罚"
 podkueijin.300.t:0 "一位合适的继承人？"
 podkueijin.300.desc:0 "你叫你的侍从搜索在你的领地周围的魑魅的信息，你已经准备了必要的材料来举办使其他们成为䰢的仪式。一些信息被收集到了，你可以指定更多的要求以深入探索，但越是具体，代价就越高。\n首先，你想要一些刚从黄泉转生回来的古人，还是一些失去所有人性并唤醒了其心魔的“士”？"
 podkueijin.300.a:0 "一些刚死掉的农民就够了。"
 podkueijin.300.b:0 "受训的猎魔人。"
 podkueijin.300.exit:0 "忘了吧，放弃搜索。"
 podkueijin.300.nocost:0 "增加这搜索要求不会添加额外代价。"
 podkueijin.300.lowcost:0 "增加这搜索要求会耗费一小点威望作为代价。"
 podkueijin.300.highcost:0 "增加这搜索要求会耗费许多威望作为代价。"
 podkueijin.300.middlecost:0 "增加这搜索要求会耗费一定的威望作为代价。"
 podkueijin.300.back:0 "回到之前的选项。"
 podkueijin.310.t:0 "一位合适的继承人？"
 podkueijin.310.desc:0 "你想要你的继承人有怎样的年龄和性别？越年轻越难找，并会耗费更多。"
 podkueijin.310.a:0 "青年男人"
 podkueijin.310.b:0 "中年男人"
 podkueijin.310.c:0 "老年男人"
 podkueijin.310.d:0 "青年女人"
 podkueijin.310.e:0 "中年女人"
 podkueijin.310.f:0 "老年女人"
 podkueijin.320.t:0 "一位合适的继承人？"
 podkueijin.320.desc:0 "随着时间和努力，你的侍从最终会找到一个满足额外要求的目标，但这将增加最终要付出的代价。"
 podkueijin.320.a:0 "给我找一个在转生前就有这种身体特征的人。"
 podkueijin.320.b:0 "一些普通人就足够了。"
 podkueijin.321.t:0 "一位合适的继承人？"
 podkueijin.321.desc:0 "美貌如何？"
 podkueijin.321.a:0 "万里挑一"
 podkueijin.321.b:0 "千里挑一"
 podkueijin.321.c:0 "百里挑一"
 podkueijin.321.d:0 "普普通通"
 podkueijin.322.t:0 "一位合适的继承人？"
 podkueijin.322.desc:0 "智慧如何？"
 podkueijin.322.a:0 "万里挑一"
 podkueijin.322.b:0 "千里挑一"
 podkueijin.322.c:0 "百里挑一"
 podkueijin.322.d:0 "普普通通"
 podkueijin.323.t:0 "一位合适的继承人？"
 podkueijin.323.desc:0 "健壮如何？"
 podkueijin.323.a:0 "万里挑一"
 podkueijin.323.b:0 "千里挑一"
 podkueijin.323.c:0 "百里挑一"
 podkueijin.323.d:0 "普普通通"
 podkueijin.324.t:0 "一位合适的继承人？"
 podkueijin.324.desc:0 "其他要求？"
 podkueijin.324.a:0 "白化病"
 podkueijin.324.b:0 "巨人"
 podkueijin.324.c:0 "侏儒"
 podkueijin.324.d:0 "不需要更多了"
 podkueijin.325.t:0 "一位合适的继承人？"
 podkueijin.325.desc:0 "这是你在派出搜索队之前改变条件的最后机会。"
 podkueijin.325.a:0 "就这些了，去找人！"
 podkueijin.325.b:0 "返回并重新选择。"
 podkueijin.350.t:0 "一位合适的继承人"
 podkueijin.350.desc:0 "你的侍从给你带来了一个最符合你所有要求的人，现在是时候让这个人学习心法并成为你的继承人了。"
 podkueijin.350.a:0 "进行仪式"
 podkueijin.400.t:0 "心法教育1"
 podkueijin.400.desc:0 "到目前为止，你的弟子表现得相当乏善可陈。如果你继续训练，其可能会做得更好……或者也许其已经没有改善的希望？"
 podkueijin.400.a:0 "你需要更多训练。"
 podkueijin.400.b:0 "好吧，至少比什么都没有强"
 podkueijin.400.nolearn:0 "你的弟子没能在心法上有所建树"
 podkueijin.401.t:0 "心法教育2"
 podkueijin.401.desc:0 "到目前为止，你的弟子一直表现很一般。如果你不是在寻找一个有天赋的弟子，这可能是足够的，但也许你可以通过更多的训练让其变得更好？"
 podkueijin.401.a:0 "你需要更多训练。"
 podkueijin.401.b:0 "不是最好的，但也不是最糟的。"
 podkueijin.402.t:0 "心法教育3"
 podkueijin.402.desc:0 "你的弟子表现得很好，对基础的理解很扎实。这可能已经足够了，若非你要寻找完美的继承人？"
 podkueijin.402.a:0 "你需要更多训练。"
 podkueijin.402.b:0 "就当你准备好出师了。"
 podkueijin.403.t:0 "心法教育4"
 podkueijin.403.desc:0 "在古代，教育䰢需要十年时间，但当第五纪元到来时，只需两年就成了常态。你的弟子很幸运的能够学到底，甚至还能青出于蓝胜于蓝。"
 podkueijin.403.a:0 "你已经学会了我能教你的所有东西。"
 podkueijin.300.hugecost:0 "增加这搜索要求会耗费巨大的威望作为代价。"
 podkueijin.320.a.tt:0 "你将可在一系列天生特征中选择"
 podkueijin_education:0 "你将再训练该弟子一年。其可能会有所建树，或者一事无成。"
 podkueijin.400.learn:0 "你的弟子提升了其的心法"
 podkueijin.500.t:0 "心法精进"
 podkueijin.500.desc:0 "由于你的心法等级已经很高深，现在每一次进阶都会提升你的气德，所以现在你必须选择你想扩展的气德的阴阳。"
 podkueijin.500.a:0 "皆阴。"
 podkueijin.500.b:0 "皆阳。"
 podkueijin.500.c:0 "并皆。"
 podkueijin.600.t:0 "第五纪元"
 podkueijin.600.desc:0 "纪元之轮已经转到了下一纪元，随着新纪元的到来，进食变得更困难，气变得更稀少，开悟需要更长时间。\n\n神体现在被圣体所取代，你可以保留你目前的技能，但你不能再在神体中取得进展（尚未实装）。"
 podkueijin.600.a:0 "黑暗纪元。"
 podkueijin.700.t:0 "绝壁"
 podkueijin.700.desc:0 "中原的灵界受一道神秘的壁障阻碍，这道壁障被称作绝壁，它阻隔了灵界和凡界之间的直接接触。绝壁在部分地区极其强大，于某些地方又极其薄弱，但绝壁无处不在永不缺席。\n\n你可以通过能力将绝壁强化或弱化，如果被提升到10，当地无法使用任何气类异能，同时当地的灵类耗费意志力不然必须逃离本地，此类环境下使用气池能量会极大不适而且困难。"
 podkueijin.700.a:0 "强化绝壁。"
 podkueijin.700.b:0 "弱化绝壁。"
 podkueijin.800.t:0 "失控"
 podkueijin.800.desc:0 "你已然乏气，也许是你是阳属万鬼所以比其他万鬼更容易感到饥渴，又或者你没能掌握阴阳流转所以只能使用一属的气。总之到了现在这地步，你失去了控制并疯一般的冲入了人群去取得些气……"
 podkueijin.800.a:0 "真是羞耻。"
 podkueijin.200.d:0 "我将把阴气注入我的身体来暂时逆转一点平衡。"
 podkueijin.100.c:0 "我已然达到老祖境界"
 podkueijin.100.d:0 "我已然达到上官境界"
 podkueijin.100.e:0 "我已然达到耆那境界"
 podkueijin.110.t:0 "阴阳"
 podkueijin.110.desc:0 "阴气较多的震旦族裔是强大负能量的汇聚体，他们理智，冷静，残忍。\n阳气较多的震旦族裔则与之相反，贪婪的吞噬生命能量，他们是热情的生物，亲近凡人并富有情感。\n少数震旦族裔的能量是平衡的，他们的躯体同时保持着生与死的力量，二者和谐共处。"
 podkueijin.110.a:0 "我倾向于阴。"
 podkueijin.110.b:0 "我倾向平衡。"
 podkueijin.110.c:0 "我倾向于阳。"
 podkueijin.120.t:0 "气"
 podkueijin.120.desc:0 "纪元之轮被阴阳二气结合推动，二者的象征是黑龙和猩红女王，创生的能量依然充斥于世间，被称之为气，其在阴阳两界中流转变换，存在于世间万物之中。\n\n和血族一样，鬼人受无尽的饥饿折磨，鬼人的气池的总点数如果少于5点，那其将陷入饥荒状态。\n\n当鬼人吸纳超出自身气德的气池点数时（失衡的鬼人能容纳相应类型的超量气池点数而不受副作用惩罚），他被视作气亢。鬼人如果耗尽了一种气池点数，那他也被视作气亢。"
 podkueijin.120.a:0 "吾气长存"
 podkueijin.200.a.tt:0 "你对阴的偏移使得你逐渐变丑并且成为猎巫人的潜在目标。"
 podkueijin.200.c.tt:0 "你对阳的偏移使得你成为爆发血族疾病的源头。"
 podkueijin.201.t:0 "僵尸"
 podkueijin.201.desc:0 "僵尸是彻头彻尾的怪物，无论如何都无法混入人群。僵尸肉体会慢慢变成病态的灰色，而骨头则变成漆黑色。皮肤起皱并压缩在骨头周围。獠牙变长并滴落毒液，黑色的尖刺从背部、关节和肋骨处长出来。整个身体发出磷光，闪烁着阴性能量。"
 podkueijin.201.a:0 "我是个怪物中的怪物"
 podkueijin.900.t:0 "气乏"
 podkueijin.900.desc:0 "如果万鬼费尽了体内所有的气，那其将会崩塌腐化，于此状态下使用气时（不论是使用技艺或者是维持自身状态），他损失健康作为替代，直到最后油尽灯枯灰飞烟灭。"
 podkueijin.900.a:0 "我需要气！"
 podkueijin.1011.a:0 "我当然会参加。"
 podkueijin.1011.b:0 "我就勉为其难参加一下吧。"
 podkueijin.1011.c:0 "很遗憾，我很忙。"
 podkueijin.1012.desc:0 "我在此邀请你参加我在[barony.GetNameNoTier]举办的庆典！这将会是一场盛会，值得你光临。"
 podkueijin.1013.desc:0 "我在此邀请你参加我在[barony.GetNameNoTier]的宫廷举办的庆典！这将会是一场盛会，有令人愉快的‘甜点’和娱乐。"
 semblance_of_the_ebon_dragon_perk_tooltip:0 "这个选项可用是因为你拥有玄龙法相技能。"
 semblance_of_the_scalet_queen_perk_tooltip:0 "这个选项可用是因为你拥有殷母法相技能。"
 podkueijin.710.t:0 "气机制设置"
 podkueijin.710.desc:0 "你将能选择当动用时先用哪属气，以及食气时是否过亢。"
 podkueijin.710.a:0 "先消耗：#bold 阴气#/阳气/随机。"
 podkueijin.710.b:0 "先消耗：阴气/#bold 阳气#/随机。"
 podkueijin.710.c:0 "先消耗：阴气/阳气/#bold 随机#。"
 podkueijin.710.d:0 "当食气时：#bold 不过亢#/过亢。"
 podkueijin.710.e:0 "当食气时：不过亢/#bold 过亢#。"
 podkueijin.710.f:0 "就这样吧。"
 podkueijin.1010.desc:0 "我不知道你为什么接受我的邀请却反而去参加[other_host.GetTitledFirstNamePossessive]的庆典，但我会记住这件事的。"
 podkueijin.1010.a:0 "真是不幸。"
 podkueijin.1011.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 podkueijin.1011.opening_desc:0 "我特此邀请你参加我在[barony.GetNameNoTier]举办的庆典！"
 podkueijin.1011.host_likes_me:0 "我期待你的光临，你要是不来我会非常想你的。"
 podkueijin.1011.host_gets_along_with_me:0 "如果你这样一位显赫的[ROOT.Char.GetTitleTierName]能出席，会让我倍感荣幸。"
 podkueijin.1011.host_dislikes_me:0 "我期望所有有影响力的人都能出席，很不幸也包括你。"
 podkueijin.1011.d:0 "不，我拒绝！"
 podkueijin.1012.a:0 "这是我的荣幸。"
 podkueijin.1012.b:0 "我有更重要的事要处理。"
 podkueijin.1013.a:0 "这是我的荣幸。"
 podkueijin.1013.b:0 "我有更重要的事要处理。"
 podkueijin.1021.t:0 "庆典：令人愉快的聚会"
 podkueijin.1021.desc:0 "宾客们聚集在大厅，他们都是领地远近的名人。\n\n情绪多么明亮，精神多么高涨，庆典开始了！"
 podkueijin.1021.a:0 "欢迎，朋友们！"
 podkueijin.1021.a.tt:0 "庆典开始了"
 podkueijin.1022.t:0 "热烈欢迎"
 podkueijin.1022.likes_host:0 "所有客人都已到大厅集合，而我们彬彬有礼的东道主，[activity.GetOwner.GetTitledFirstName]，欢迎我们前来赴席！"
 podkueijin.1022.dislikes_host:0 "所有客人都已到大厅集合，而我们[activity.GetOwner.Custom('InsultAdjective')]东道主[activity.GetOwner.GetTitledFirstName]，总算来欢迎我们了。"
 podkueijin.1022.a.gregarious:0 "我等不及要和大家交谈了！"
 podkueijin.1022.a.shy:0 "这里有很多人……"
 podkueijin.1022.a:0 "我十分期待！"
 podkueijin.1022.b:0 "这最好值得我花时间。"
 podkueijin.1041.t:0 "庆典：当我的客人们离开时"
 podkueijin.1041.desc:0 "随着所有人返回他们各自的家，我可以很自豪地说，庆典非常成功！"
 podkueijin.1041.spouse:0 "\n\n我非常感谢我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))][spouse.GetFirstName]让这场活动如此成功，当[spouse.GetSheHe]送别最后几位宾客离开时，我感到无限感激。"
 podkueijin.1041.no_spouse:0 "不管怎样，我仍然庆幸这场让我殚精竭虑的活动目前终于结束了。"
 podkueijin.1041.a:0 "下次再见！"
 podkueijin.1042.t:0 "庆典：回家"
 podkueijin.1042.desc:0 "真是一场盛典啊！将来很长一段时间内我都会记得在[host.GetTitledFirstNamePossessive]的大厅度过的美好时光。\n\n现在是时候洗去‘甜点’的痕迹，重拾我身为超自然世界领主的责任了。"
 podkueijin.1042.a:0 "再见，[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]！"
 podkueijin.1090.t:0 "放弃责任"
 podkueijin.1090.desc:0 "这简直是灾难！\n\n在我做好一切准备后，我的客人却来到了一场没有东道主的庆典！\n他们已经回家了，而我也给他们留下了极其糟糕的印象。"
 podkueijin.1090.a:0 "我可能会后悔的。"
 podkueijin.1091.t:0 "惨淡的庆典"
 podkueijin.1091.desc:0 "真是不敢相信。尽管我发出邀请并做了准备，没有一个客人出现在我的庆典上。\n\n没关系！我将独自享受这些‘甜点’，而大厅里的回荡的脚步声是我仅需的同伴！"
 podkueijin.1091.a:0 "我真的就是这样的孤家寡人吗？"
 podkueijin.1091.b:0 "我感觉有些宽慰。"
 podkueijin.1092.t:1 "庆典：缺席"
 podkueijin.1092.desc:0 "丑闻！[activity.GetOwner.GetTitledFirstName]居然没在[activity.GetOwner.GetHerHis]自己举办的庆典上现身！\n\n[activity.GetOwner.GetSheHe]是想要戏耍我们所有人吗？"
 podkueijin.1092.a:0 "真是浪费时间！"
 podkueijin.1093.t:0 "庆典：庆典结束"
 podkueijin.1093.desc:1 "随着[host.Custom2('MyCharacterIntroduction', ROOT.Char)]突然暴毙，[host.GetHerHis]的庆典也告终。\n\n闷闷不乐的客人们渐渐离场，我默默祈祷，希望[ROOT.Char.GetFaith.HighGodNameAlternate]能像[host.GetFirstName]热情地欢迎我们来到[host.GetHerHis]的大厅那样，将[host.GetSheHe]迎入[ROOT.Char.GetFaith.PositiveAfterLife]。"
 podkueijin.1093.a:1 "庆典结束了。"
 podkueijin.1094.desc:0 "由于我现在被扔进了铁牢，我筹划的盛大庆典也得取消了。哎，我花了那么多小时在准备工作上面……全泡汤了！"
 podkueijin.1095.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U]被囚禁，[host.GetHerHis]的盛大庆典也被迫中止。真是时运不济啊！"
 podkueijin.1101.t:0 "提升圣体"
 podkueijin.1101.desc:0 "你持续的比试和训练带来了一些结果，你成功地将你的心法知识融入到了你的技艺。不过，到底融入了多少？"
 podkueijin.1101.a:0 "我提升了我的技艺。"
 podkueijin.1101.b:0 "我获得了一些经验。"
 podkueijin.1101.c:0 "我只学到了点皮毛。"
 podkueijin.1102.t:0 "提升气功"
 podkueijin.1102.desc:0 "你不断的协调环境的气脉已经有了一些结果，你成功地将你的心法知识融入到了你的技艺。不过，到底融入了多少？"
 podkueijin.1103.t:0 "提升灵功"
 podkueijin.1103.desc:0 "你不断的对你灵魂的掌控已经有了一些结果，你成功地将你的心法知识融入到了你的技艺。不过，到底融入了多少？"
 podkueijin.1104.t:0 "提升魔功"
 podkueijin.1104.desc:0 "你不断的跟你心魔的妥协已经有了一些结果，你成功地将你的心法知识融入到了你的技艺。不过，到底融入了多少？"
 podkueijin.1400.t:0 "灵界穿越"
 podkueijin.1400.desc:0 "使用你控制的龙脉，你可以准备一块美玉并用其启动仪式，使你能够进入绝壁以外的灵界。或者你可以使用一些强大的技艺，无代价地通过绝壁。"
 podkueijin.1400.a:0 "我准备了进入阴界所需的物品。"
 podkueijin.1400.b:0 "我有进入阴界所需的技艺！"
 podkueijin.1400.c:0 "我准备了进入阳界所需的物品"
 podkueijin.1400.d:0 "我有进入阳界所需的技艺！"
 podkueijin.1401.t:0 "灵感"
 podkueijin.1401.desc:0 "邻近绝壁的灵界区域被称为镜像之地，因为其看起来就像附近中原地区的倒影而得名。\n\n由于这是你的第一次灵界旅行，看到这奇异的景色让你感到悟得了什么。"
 podkueijin.1401.a:0 "妙！"
 podkueijin.1411.t:0 "灵类教导"
 podkueijin.1411.desc:0 "你进入了灵界，尽可能的深，然后你遇到了一位善教的灵类导师，其向你分享了一些心法理解。"
 podkueijin.1411.a:0 "那是位普通灵类。"
 podkueijin.1411.b:0 "那是位阎王或类似的强大灵类。"
 podkueijin.1411.c:0 "那是位上古者，历史记录上的万鬼，太上老祖。"
 podkueijin.1501.t:0 "最优赠礼"
 podkueijin.1501.desc:0 "随着门童宣布着他们作为礼物的奇珍异宝，客人们一个接一个地进来了，其中最特别的是[friendly_guest.GetFirstNameNoTooltip]的，真正闻所未闻。"
 podkueijin.1501.a:0 "非常棒！"
 podkueijin.1601.t:0 "龙舟赛"
 podkueijin.1601.desc:0 "龙舟赛开始了，被分为两队，红和黑，你可以小赌一下哪队会赢。"
 podkueijin.1601.a:0 "红队。"
 podkueijin.1601.b:0 "黑队。"
 podkueijin.1201.t:0 "卜算"
 podkueijin.1201.desc:0 "你擅长一切占卜技巧和预兆解读，根据你的技能等级，你也许能在凡人中建立起一个繁荣的产业链。"
 podkueijin.1201.a:0 "我会读手相。"
 podkueijin.1201.b:0 "我懂得一些紫微斗数。"
 podkueijin.1201.c:0 "我能预测天机。"
 podkueijin.1301.t:0 "荒野之战"
 podkueijin.1301.desc:0 "你进入了荒野，寻求挑战。"
 podkueijin.1301.a:0 "我与一些凡人相斗。"
 podkueijin.1301.b:0 "我与一些士和变化妖怪相斗。"
 podkueijin.1301.c:0 "我与自己相斗。"
 kueijin_scheme.100.t:0 "吞魂"
 kueijin_scheme.100.desc:0 "你能看到受害者的灵魂被吸纳进入了你的第三眼。现在你将选择对其做啥。"
 kueijin_scheme.100.a:0 "净化该灵魂。"
 kueijin_scheme.100.b:0 "折磨该灵魂。"
 kueijin_scheme.100.c:0 "吞噬该灵魂！"