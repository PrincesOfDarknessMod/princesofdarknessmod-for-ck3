l_simp_chinese:
 POD_inquisition_face_sins.001.t:0 "直面汝罪"
 POD_inquisition_face_sins.001.desc:0 "你开始觉得自己的生活方式，不配得到上帝赐予你的恩典。你的信仰曾经是不可动摇的，但最近你感觉到你的决心出现了裂痕。\n是这个世界真的注定要灭亡？还是你做得不够好？怀疑正在困扰着你，这种危机越来越影响你的效率。你必须做点什么，也许该从成为一个更好的人开始。"
 POD_inquisition_face_sins.001.option.a:0 "我应该更好的理解牠的方式"
 POD_inquisition_face_sins.001.option.a.tt:0 "你会对这做点什么"
 POD_inquisition_face_sins.001.option.b:0 "我一点也不在乎……"
 POD_inquisition_face_sins.001.option.b.tt:0 "你将什么也不做，这会有所代价"
 POD_inquisition_face_sins.002.t:0 "直面汝罪2"
 POD_inquisition_face_sins.002.desc:0 "在思考了如何才能更深入地了解神的恩典之后，你得出了两个选择：向那些过去的真正虔诚之士学习或向神的仆人寻求帮助。"
 POD_inquisition_face_sins.002.option.a:0 "我应该寻求过去圣人的永恒智慧"
 POD_inquisition_face_sins.002.option.a.tt:0 "你将尝试了解更多关于过往虔信徒的事"
 POD_inquisition_face_sins.002.option.a.desc:0 "学识与决心"
 POD_inquisition_face_sins.002.option.a.success:0 "你成功的更好的理解了牠的方式"
 POD_inquisition_face_sins.002.option.a.success.tt:0 "我更好的理解牠了"
 POD_inquisition_face_sins.002.option.a.failure:0 "你没能更好的理解了牠的方式"
 POD_inquisition_face_sins.002.option.a.failure.tt:0 "也许，我最终不是牠的仆人？"
 POD_inquisition_face_sins.002.option.b:0 "我应该到附近的教堂寻求帮助"
 POD_inquisition_face_sins.002.option.b.tt:0 "你将请求当地的牧师和僧侣帮助你"
 POD_inquisition_face_sins.002.option.b.desc:0 "外交与决心"
 POD_inquisition_face_sins.002.option.b.success:0 "你成功的更好的理解了牠的方式"
 POD_inquisition_face_sins.002.option.b.success.tt:0 "我更好的理解牠了"
 POD_inquisition_face_sins.002.option.b.failure:0 "你没能更好的理解了牠的方式"
 POD_inquisition_face_sins.002.option.b.failure.tt:0 "也许，我最终不是牠的仆人？"
 POD_inquisition_face_sins.102.t:0 "恢复信仰"
 POD_inquisition_face_sins.102.desc.learning:0 "在花了很长时间阅读关于过往的虔诚者们的古书后，你明白了，上帝的方式与人的方式是不同的。如果他把祝福给了你，一位纯粹的罪人，你就得让他骄傲。"
 POD_inquisition_face_sins.102.desc.diplomacy:0 "在过去的几天里，你和很多神的仆人交谈过，现在你终于开始明白，你如何看待自己并不重要，唯一重要的是神如何看待你。如果他认为你配得上你的祝福，你要确保这些祝福不会浪费。"
 POD_inquisition_face_sins.102.option.a:0 "上主作为何等奥秘"
 POD_inquisition_face_sins.102.option.a.tt:0 "你保留了你的神圣力量"
 POD_inquisition_face_sins.003.t:0 "信仰危机"
 POD_inquisition_face_sins.003.desc.learning:0 "即使你花了很长时间试图通过阅读古书来了解过往的虔诚者们，这也没有任何意义。也许，你终究不是他的仆人。或者至少是有缺陷的一位。你只需要祈祷就足够了。"
 POD_inquisition_face_sins.003.desc.diplomacy:0 "甚至当地的牧师和修道士也没有帮助你了解上帝和牠的行事方式。也许，你终究不是他的仆人。或者至少是有缺陷的一位。你只需要祈祷就足够了。"
 POD_inquisition_face_sins.003.option.a:0 "我已然迷失"
 POD_inquisition_face_sins.003.option.a.tt:0 "你失去了你的神圣力量……一段时间"
 POD_inquisition_face_sins.004.t:0 "信仰危机2"
 POD_inquisition_face_sins.004.desc:0 "你已经很久没有使用神赐予的神力了。也许，你已经失去了信心，或是祂对你失去了信心。但如果你愿意的话，你可以尝试重新获取你的力量。\n对于真信之人来说，永远都不会太晚。毕竟只有不努力走这条道路才是罪，而不是不走。"
 POD_inquisition_face_sins.004.option.a:0 "我会尽我所能恢复我的信仰"
 POD_inquisition_face_sins.004.option.a.tt:0 "你会努力恢复你的信仰，不惜一切代价"
 POD_inquisition_face_sins.004.option.b:0 "我不能放弃"
 POD_inquisition_face_sins.004.option.b.tt:0 "你将试着更好地了解你自己和上主"
 POD_inquisition_face_sins.004.option.b.desc:0 "学识挑战"
 POD_inquisition_face_sins.004.option.b.success:0 "你成功地更好地了解了牠和你自己"
 POD_inquisition_face_sins.004.option.b.failure:0 "你没能更好地了解牠和你自己"
 POD_inquisition_face_sins.004.option.b.failure.tt:0 "你没能让你的力量回归……目前而言"
 POD_inquisition_face_sins.004.option.c:0 "我现在没时间做这种事"
 POD_inquisition_face_sins.004.option.c.tt:0 "你现在不会试图恢复你的信仰"
 POD_inquisition_face_sins.004.option.d:0 "说真的？我一点也不在乎"
 POD_inquisition_face_sins.004.option.d.tt:0 "你将再也没法恢复你的信仰"