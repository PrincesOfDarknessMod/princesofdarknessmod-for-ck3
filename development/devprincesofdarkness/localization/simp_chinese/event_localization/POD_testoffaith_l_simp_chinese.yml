 POD_test_of_faith.101.option.d:0 "我会容忍的"
 POD_test_of_faith.101.option.d.tt:0 "你变得宽宏大量"
 POD_test_of_faith.101.option.e:0 "我不比别人更好"
 POD_test_of_faith.101.option.e.tt:0 "你变得谦卑"
 POD_test_of_faith.101.option.f:0 "你知道什么时候该适可而止"
 POD_test_of_faith.101.option.f.tt:0 "你变得节制"
 POD_test_of_faith.101.option.g:0 "我将休于天堂"
 POD_test_of_faith.101.option.g.tt:0 "你变得勤勉"
 POD_test_of_faith.201.t:0 "考验失败"
 POD_test_of_faith.201.desc:0 "你失败了。你的注意力还不够集中。也许你应该稍后再来？\n爬不上山顶并不可耻，可耻的是一开始就拒绝尝试。"
 POD_test_of_faith.201.option.a:0 "我还没准备好"
 POD_test_of_faith.201.option.a.tt:0 "你失败了"