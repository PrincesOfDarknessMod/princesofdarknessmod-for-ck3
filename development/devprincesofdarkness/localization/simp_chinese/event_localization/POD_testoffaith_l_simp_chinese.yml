 POD_test_of_faith.001.t:0 "信仰考验"
 POD_test_of_faith.001.desc:0 "有些人可以活在罪中，但神的仆人不能。如果你不够高尚，你就不配得到他的恩典，而且你知道你不够。是时候改变你自己了，摆脱那些让你不值得拥有的罪恶。这的确是一条艰难的道路，但也是必须的。"
 POD_test_of_faith.001.option.a:0 "色欲不能蒙蔽我的思想"
 POD_test_of_faith.001.option.a.tt:0 "你将尝试改掉你的色欲"
