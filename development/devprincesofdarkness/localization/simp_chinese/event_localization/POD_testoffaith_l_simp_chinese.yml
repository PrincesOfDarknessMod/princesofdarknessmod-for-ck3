 POD_test_of_faith.101.t:0 "考验成功"
 POD_test_of_faith.101.desc:0 "你成功了。现在你差不多完成了。牠是你应许的，有德之道才是对的。你想要改善你生活和行为的哪一部分？"
 POD_test_of_faith.101.option.a:0 "心胜于物"
 POD_test_of_faith.101.option.a.tt:0 "你变得忠贞"
 POD_test_of_faith.101.option.b:0 "无论在什么情况下我都会冷静"
