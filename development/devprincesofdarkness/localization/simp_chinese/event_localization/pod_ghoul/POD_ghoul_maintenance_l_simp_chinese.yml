l_simp_chinese:
 POD_ghoul_maintenance.50.t:0 "被我的上主所唾弃"
 POD_ghoul_maintenance.50.desc:0 "我的上主已经不再支持我了。我也不再为他服务了。他不会再给予我吸血鬼的血了。没有这样的血液，我最终会变老并死亡。"
 POD_ghoul_maintenance.50.option.a:0 "我因这而恨他们。"
 POD_ghoul_maintenance.50.option.b:0 "也许这就是最好的。"
 POD_ghoul_maintenance.300.t:0 "亡魂"
 POD_ghoul_maintenance.300.desc:0 "我成为了一位亡魂。"
 POD_ghoul_maintenance.300.option.a:0 "血的力量！"
 POD_ghoulthrall_release_option.tt:0 "将会从你的侍从中解放一位血仆奴隶。"