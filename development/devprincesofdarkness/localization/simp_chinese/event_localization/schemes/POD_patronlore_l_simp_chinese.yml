l_simp_chinese:
 POD_patronlore.100.t:0 "血族野史"
 POD_patronlore.100.option.a:0 "关闭血族野史"
 POD_patronlore.100.desc:0 "还没有写关于其的资料（会补的！）。\n\n"
 POD_patronlore.100.t.560027:0 "赞助资料：卢基奥斯"
 POD_patronlore.100.desc.560027:0 "一位有名望的罗马百夫长，秘密地信仰着伊西斯女神密教。在阻止罗马被哥特人部落瓦解的那些年里，当战争开始变得不可挽回时，卢基奥斯离开了。他越来越迷恋埃及神话，为了更好地了解他的女神，他去了筛沙之乡朝圣。不幸的是，他没有找到他所追寻的知识——只找到古蛇的信徒。赛特在古庙里迎接他。他对他对罗马军队的了解很感兴趣。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560002:0 "赞助资料：基厄兰"
 POD_patronlore.100.desc.560002:0 "基厄兰是一个爱尔兰旅行者，或者更准确地说，是一位爱尔兰流浪者（原文的字面意思为“走路的人”）。他是一个23岁的年轻人，他只是做他需要的事情来生存并支撑他的家庭。这通常意味着撒谎和欺骗，因为他没有很多其他技能。虽然有着不诚实的本性，他还是非常顾家之人，而且他把所有的爱尔兰流浪者看作是他的家庭。他几乎同样尊敬任何一个游牧民族。这就是他为一个奇怪的印度斯坦旅行者提供住所的原因，该人称自己为维斯瓦纳坦。\n\n他不知道的是，维斯瓦纳坦是一位玛土撒拉，雷伏诺[clan|E]的第五代吸血鬼，他周游世界来到了爱尔兰。随后他们的营地很快得遭到了当地人的袭击，而爱尔兰人也受了致命伤。因此维斯瓦纳坦违背了自己的原则，[Embrace|E]了基厄兰，救了他一命。他教会他矛盾之路，并警告他不要做他刚刚做过的事情。然后就走了。\n\n即使现在是血族，基厄兰也不忍心离开他的家人和他的人民。特别是当他们面对他们所接触到的社区的偏见和敌意时。爱尔兰的这种敌意越来越大，导致他们不久之后就离开了。 基厄兰决心为他们找到一个安全的家。\n\n于是他们开始旅行，一走就是几十年，沿途接济其他游牧民族。不幸的是，基厄兰没能履行他对维斯瓦纳坦的承诺，于一次他救了他的族人中一个名叫凯奥姆的年轻女子的命。她是他的族群中唯一一个由他亲自抚养的血族，但一路上确实有许多人加入了他们的旅程。有些是雷伏诺，有些不是。正如维斯瓦纳坦告诉他的那样，基厄兰会向他的族人以外的任何人宣布他的族人是冈格罗（尽管他尽力保持潜藏）。\n\n最终，他们到达了匈牙利。主要通过欺骗、操纵和适量的梦幻术，这三样东西是基厄兰最擅长的，他说服了当地的男爵，允许他的族人在这里安家，不受打扰。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560007:0 "赞助资料：何塞·德·卡拉马尔"
 POD_patronlore.100.desc.560007:0 "何塞于凡生在伊比利亚半岛北部某处的鱼贩子家庭，但他早年的大部分时间都是在街上惹事。他比大多数同龄男孩都要大，并利用这种体型来吓唬其他孩子。他在青少年时期就知道人们会花钱买信息，所以他开始尽可能多地收集信息，通过偷听、谨慎跟踪或单纯的恐吓来进行勒索或交易。他最终成为一个年轻的成年人，在萨里亚市经营一个小的信息圈，在那里他被一个来访的吸血鬼注意到。他注意到了何塞的才能，并觉得他能成为完美的候选者。何塞和他的尊长之间的关系很不稳定，最后何塞吸榨了长者。\n\n在13世纪，何塞成为小家族德·卡拉马尔的首领和唯一的血族，接管了拉科鲁尼亚公国，并向自己承诺，他将以心兽的名义统治伊比利亚半岛。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560017:0 "赞助资料：凯拉·沙多维"
 POD_patronlore.100.desc.560017:0 "作为贵族的私生子出生，他学会了宫廷密谋以生存，尽管他是一个多病的孩子。26岁那年，当他正在为他的主人制作一个把柄时，一位吸血鬼闯入了他的城堡并初拥了他。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560013:0 "赞助资料：加夫列"
 POD_patronlore.100.desc.560013:0 "加夫列是个小贵族。像他的父亲和祖父一样，在凡生时是一名士兵。他被培养成了他的人民的保护者。\n\n作为一个吸血鬼，他变态地以猎杀和吸食他以前的土地上的凡人为乐。\n\n尽管对他的氏族很忠诚，加夫列却很难理解棘秘魑的高级哲学。他通过将自己隐居在他的领地并专注于繁殖血仆血统来进行补偿。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560014:0 "赞助资料：德卡迪恩·纳什"
 POD_patronlore.100.desc.560014:0 "他从埃及的采石场被挖出来，当时他的学习力和洞察力引起了他尊长的注意。多年来，他在已经老旧的城市中旅行，他的尊长灌输了对知识的渴求，以帮助他对抗时间的停滞。作为塔里克·萨玛的追随者，德卡迪恩相信自我和心兽之间的斗争是真主的终极考验。德卡迪恩在尼罗河口定居，那里是许多北非人生活的开始，他勤奋工作，把学习和信仰带给他周围的人。他的实验通常是内化的，但他过去曾采取过极端的措施，如把整个村庄的人都吃掉，或亲自执行一个月的禁食，以净化当地部落的身心（和弱者）。作为采石场为数不多的识字者之一，这也是他最初被接纳的原因，德卡迪恩一直保持着大量的日记和书面文字，因此他的宫廷对教育和策略的重视超过了其他任何特征。随着睿魔尔和梵卓对棘秘魑的战争故事的流传，德卡迪恩越来越关注保护他的工作，并在北非变得积极主动，试图阻止国王和金字塔控制埃及的人民。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560019:0 "赞助资料：雅利安·德·格雷"
 POD_patronlore.100.desc.560019:0 "雅利安·德·格雷出生为无地的骑士，他在主子的宫廷里度过了他的童年。他在战斗中表现出了自己的能力，为他赢得了领主卫队中最年轻的成员的位置，很快就在他的军队中获得了指挥职位。在诺曼底的一次叛乱中，这个年轻人有了机会证明自己。在五年的时间里，他被抓了三次。两次被赎回，一次逃脱。尽管有这些不幸的情况，但他的勇敢和技巧受到了赞扬，赢得了国王本人的信任。他职业生涯的高潮带来了战争的结束，在1119年的布雷米勒之战中，他成功地击溃了敌人的骑兵，并率领骑兵冲向他们的右翼。这次机动与他得到的命令毫无关系，被描述为“天才的一击”和“纯粹的疯狂行为”。无论是哪种情况，它都导致了一场决定性的胜利，而这场胜利似乎让雅利安失去了生命。也就是说，在他著名的冲锋的影响下，他开始追击撤退的军队，追上了支假撤的部队。他发现自己被包围在敌人的防线后面，在那里他被一根长矛刺穿，被抛在那里等死。他的手下发现他还活着，把他带到营地接受治疗，但康复的希望不大。当一个人走进帐篷时，一个朋友正坐在他身边。他认出了他，是国王的一个顾问。他的朋友应那人的要求离开了，只剩下他们两个人。“这看起来一点也不妙。我说你还有一个小时，也许两个小时。”那人没有等待回答。“我可以确保你能活下来，作为回报，你将在你的余生中对我誓忠，不管那是多长时间。你接受吗？”在痛苦和神志不清中，他接受了，并在一个陌生的地方醒来，为一个完全不同的主人服务。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560020:0 "赞助资料：居鲁士·海利德"
 POD_patronlore.100.desc.560020:0 "威廉出生在斯特拉斯堡的一个富有的织工家庭，他总是充满了好奇心。为了寻求新的秘密，他开始在教会的庇护下学习。入教后，他在圣奥迪尔山顶的霍恩堡修道院成为一名修士。在学习经典的同时，他对“异教徒之墙”也越来越好奇，这是一堵围绕着山的古老的凯尔特墙，被认为比基督教更早。他还了解到关于奇怪生物的故事，这些生物在邻近的黑林山地区出没。巨大的人形生物，七英尺高，有黑色的眼睛。\n\n他对墙的起源和对原始教事务越来越感兴趣的禁忌探索，使他受到了睿魔尔氏族中一个流浪的受弃者乔纳斯·赫里德的注意。在得到这位的初拥后，他离开了他的修道院生活，去旅行，远离太阳。\n\n在他的亡生，他和乔纳斯来到博洛尼亚，在那里他们在1088年大学的建立中发挥了支持作用。威廉对古代的知识很感兴趣，他从波斯的故事中得到灵感，取了一个新名字——居鲁士。一个新的名字代表了他的一生。\n\n1180年，在试图与他的祖先重新加入睿魔尔氏族的努力失败后，他回到了他的家乡，靠近莱茵的科尔马市。不用说，这就是他被斯特拉斯堡的马可纽斯联系上的全部原因，他是吉雅希德血系的创始人，也曾是法师。尽管来自不同的氏族，但他们的学术兴趣使他们走到了一起。以知识的名义，他们形成了一种同盟。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560025:0 "赞助资料：伊甸·瓦尔滕"
 POD_patronlore.100.desc.560025:0 "绑架凡人（特别是优秀的生理标本，强壮的，美丽的，等等）会引起人们的注意；特别是当大多数被绑架的人被发现时……已是遗体。死者似乎被残忍地实验过；他们的一些肢体或器官被扭曲得几乎无法辨认。唉，好助手是很难找的，那些伊甸“信赖 ”的人有（雇佣）任务处理这些失败品时，通常只是把尸体扔在一个随便的地方，假设它们只是被算作该地区的更多谋杀事故（凡俗的那种）。然而，任何对变幻术的影响有一点了解的人都会保有怀疑。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560030:0 "赞助资料：帕特里克·拉莫斯"
 POD_patronlore.100.desc.560030:0 "被初拥后，他只能自生自灭，赢得尊重的唯一方法是通过力量和权力。由于没有氏族的支持，帕特里克渴望有一天能将该隐之子和凡人置于控制之下，他将不惜一切代价获得权力并按照自己的意愿建立世界。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560031:0 "赞助资料：加百列·费利佩·德·拉·卡斯塔"
 POD_patronlore.100.desc.560031:0 "加百列是一位曾是贵族家庭的后代，自出生以来就被培养为统治者。在他受初拥之后，他选择避开众人的目光，从阴影中进行统治，这作为勒森魃氏族的成员是相称的。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560028:0 "赞助资料：露西娅·卡纳莱"
 POD_patronlore.100.desc.560028:0 "露西娅像是突然登场的，幸运的是，在她崛起的过程中，她的许多对手都有“不幸的事故”或特别突然的改变。她的尊长被确认为一个被称为朱塞佩的阴暗男人，最后一次被看到是在与她会面的路上；不知道他的命运是被吸榨，还是仅仅是终焉之死，以结清最后的尾巴。如果你的间谍总管不是很能干，也许就不应该激怒她。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560032:0 "赞助资料：莉莉安娜·史赞托维奇"
 POD_patronlore.100.desc.560032:0 "被她的尊长斯托弗·拉芬斯堡初拥，祖先可追袭到魔龙。在她初拥的早期，她发现斯托弗是崇魔者，在他的另一个子嗣米格尔·巴巴内格拉的帮助下，追捕了斯托弗并将他最终杀死。 现在，她努力确保自己在军督布兰科维努宫廷内的地位，尽管他们对彼此的心路有敌意。她仍然对她以前的祖传血仆养父母持有一定程度的孝心，并试图保护和确保她的老家族在这个世界上的地位，但收效甚微。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560048:0 "赞助资料：安塔里克沙·钱德拉"
 POD_patronlore.100.desc.560048:0 "足够古老到可能真的是《梨俱吠陀》中的一人，钱德拉是《梨俱吠陀》中的月神。安塔里克沙是空间之神。出生于公元前1500年左右，可能在同一时期被初拥。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560041:0 "赞助资料：哈孔·斐斯通"
 POD_patronlore.100.desc.560041:0 "由于他的皮肤像尸体一样苍白，他小时候总是引起大家的注意，他大部分时间都在森林里觅食，后来开始打猎，他很聪明，很狡猾，后来加入了一个盗贼团，以袭击在诺马克旅行的士兵和商人而闻名。\n\n他在盗贼团中的角色是收集信息，并利用这些信息来策划伏击行动。\n\n一天晚上，一个有血缚的冈格罗带着杀意接近了盗贼的藏身处，屠杀了里面的大多数人，或者使他们处于危急状态，之后，冈格罗逃离了现场，里面的每个人不是躺在地上成为尸体，就是在流血，哈孔很“幸运”，只有中度出血，并试图烧灼伤口来止血。\n\n后来他在包扎好伤口后试图走出藏身处，但没走出多远就看到月光下一个朦胧的身影，那人指挥他走近，他照做了，没过多久就感到一阵微弱的疼痛，接着是一种异样的快感，然后一切都变黑了。\n\n他的尊长是来自暗影之海中的受弃者，但从未提及。他的尊长教会了他很多东西，如何更有效地操纵人们，以及深渊是多么的美丽。在亡生的后期，在吞噬了一个妥芮朵的灵魂并对精血上瘾后，他开始登场。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560043:0 "赞助资料：阿那托利俄斯·泰涅布里斯"
 POD_patronlore.100.desc.560043:0 "他是小商人的儿子，出生在摩尔多瓦诸公国之一的切尔诺夫策村。他从小就知道如何调和并获得必要的关系。一天晚上，他遇到了一个陪同拜占庭帝国大使的年轻女孩。这个女孩漂亮得令人吃惊，但更重要的是，除了她之外，再没有其他卫兵。这种情况下，阿那托利俄斯和他的哥哥在当地的一家小酒馆里结识了这个女孩。根据她的说法，他们与基辅大公谈判后回来，在这里换马和休息。由于他天生的魅力，阿那托利俄斯能够说服女孩在他们家过夜……至少他当时是这么想的。这是他作为人类的最后一夜。清晨，他发现了他的家人被肢解和风干的尸体。在他哥哥冰冷的尸体上，他发现了一条信息。“下次见面将在我的地盘。你的亚莲恩”。几天后，妥芮朵的仆人与他联系，并就与其他亲属的会面地点作出指示。\n\n自从他被接纳到一个新的家庭，9年过去了。阿那托利俄斯能够将自己打造成一个忠诚、有执行力和聪明的家族成员。在这么短的时间内，他得以把以前的地方统治者赶走，并宣誓效忠于军督领的统治者。无论是弗拉基米尔·罗斯托维奇还是母主都不怀疑他的忠诚。但是，如果忠诚和誓言不过是幌子，而新的“家庭”是为旧的、真正的家庭复仇的主要目标呢？时间会告诉我们。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560049:0 "赞助资料：戈姆"
 POD_patronlore.100.desc.560049:0 "此人是一位凶猛的战士。他在战场上的意志和他对部队和地利的精心掌控使他获得了许多成功的战斗。在其中一次战斗中，他被布伦希尔德发现了。当他在杀死四个刺客后奄奄一息时，她初拥了他，让他独自在荒野中生存。在那些日子里，他了解到社交能力和计谋是如何只为弱者服务的，并利用他的狡猾和力量，以稳定的效率进行狩猎。在了解到自己成为什么之后，他开始积极废止那些唾弃神灵的人。作为一个指挥官和刽子手，他被派去杀死生命之树的腐烂根须。任何偏离道路的英灵战士都必须为他们对神灵犯下的罪行负责，他们中很少有人能活到加入基督教的时候。然而，他每打赢一场战役，就会有其他战役失败，基督教徒似乎从未退缩过。更糟的是，他们毒害了他的羊群的心，英灵战士之间的许多争吵导致了米德加尔德的崩塌。在奥丁消失后，他对人类未能认识到真正的力量和未能坚持阿萨传统感到厌恶，他把自己重新关在他的故乡海尔古姆，不参加任何新的战斗。但他从未失去信仰。如果奥丁醒来，他将再次拿起他的斧头，再次冲向战场。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560050:0 "赞助资料：汉尼拔·巴卡"
 POD_patronlore.100.desc.560050:0 "在第二次布匿战争期间，罗马父母会告诉他们的孩子：“汉尼拔在门外”，以此来吓唬他们。有传言说他在迦太基被布鲁赫的玛土撒拉特洛伊尔初拥，但他是在城市被摧毁后是幸存下来还是与城市一起灭亡，这一点仍不得而知。有些人甚至质疑是否真有一位汉尼拔。是有的。汉尼拔在哈图沙的废墟中从蛰眠中醒来，回到了他的祖屋，从那里他有一个想法，而且只有一个想法：摧毁——罗马——或者类似的东西。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560053:0 "赞助资料：鲁阿兹·萨瑟兰"
 POD_patronlore.100.desc.560053:0 "他是基督教的大主教。他相信吸血鬼是天主意志的一部分，但初拥使他发生了偏转。他认为吸血鬼是人类的牧羊人，人类只是牲畜，通过吸血鬼的意志被引导到他们认为和看到的正确事情上。虽然他认为人类不应该撒谎或杀人（除非他们的吸血鬼领主告诉他们这样做），但他认为吸血鬼被允许使用这些工具“用于更大的善”。他相信人们或好或坏，非此即彼，并以黑白两色看待世界。他被格拉崔克斯接纳为牧师，对宗教和神秘学有着丰富的知识。当被初拥时，萨瑟兰偏转了。到了一个程度，甚至格拉崔克斯不得不把他送去马耳他一段时间，以便他能平静下来，让他的头脑清醒。他的应对机制使他仍然相信自己是天主的代理人，但后来他开始把世界看成是黑与白，善与恶。就像任何追随邪恶的人一样，最终他用邪恶的工具来打败邪恶，并变得对权力充满渴望。在他看来，所有这些都是为了最终达到他为神圣罗马帝国和睿魔尔至上的目标，这将使他走上一条黑暗的道路。传统的“睿魔尔领导人没有勇气去做该做的事”。伊利丹风格。现在他是一个非常好的睿魔尔。担任大司祭职位。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560066:0 "赞助资料：阿尔托莉雅·潘德拉贡"
 POD_patronlore.100.desc.560066:0 "她声称要领导不列颠人的防御工作，对抗入侵的撒克逊人，并在凡人中伪装成一个男人。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560067:0 "赞助资料：埃尔德·迭戈"
 POD_patronlore.100.desc.560067:0 "迭戈是一个基督教圣修士会的前僧侣。他曾经是一名猎人，但在一次成功的猎杀后，被一位感兴趣的尊长初拥了——且并不太关心迭戈干掉的几个稚子。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560072:0 "赞助资料：摩加诺·穆尔查"
 POD_patronlore.100.desc.560072:0 "One of those who was present when Tremere drank the drought which transformed him into a vampire. Originally a mage too young to be embraced by the clan founder himself, Morgano was embraced by Goratrix shortly after the ceremony. He had been instrumental in the capture of a number of Styrian Tzimice and post embrace set out to learn the secrets of their blood. Due to his proximity to the Ritual of Usurpation, the clan discipline of the Tzimisce, Vicissitude was present in his blood. This rare trait that occasionally appeared in Tremere throughout the ages quickly became the focal point for Morgano's studies. He believed that the manipulation of flesh and bone through Vicissitude could potentially unlock many alchemical secrets and quickly learned new ways to implement the power into his Thaumaturgical blood sorcery.\n\nThis unique gift of his, and the relative success of his experiments gained him notoriety amongst his clan. Morgano Murchadha's hunger for power was reflected in the cruel nature of his experiments and he had a hand in causing the Tzimisce declare their war upon the fledgling house Tremere. As a result Morgano was exiled from house Tremere and he and his followers were spared the blood bond in the structuring of the pyramid in 1037. Outraged by his exclusion from Tremere politics and urged by his hunger for power, he took the few he had embraced with him and created the House of Murchadha, a cadet branch of the original tremere who set up their base in Esztergom after murdering the original Viovode situated there in an act of monomancy.\n\nFrom his new seat of power, Morgano of the House of Murchadha began launching invasions of the surrounding Visegrad, inspite of the vast number of enemies around him. Many of his followers, whilst believing such attacks were suicidal, were surpised to find themselves winning repeated victories. The different Viovodes in Hungary were as much in conflict with eachother and the main branch of House Tremere as they were with Murchadha.\n\nThese initial victories led to the capture of many fairly powerful kindred who sated Morgano's desire to experiment and create new powers, thus he instead turned his focus from conquest for a while into travel. Morgano ventured into the Baronies of Avalon and the Courts of Love in France where he reportedly sired 2 of his childer. A young noble girl by the name of Charlotte in the Kentish city of Canterbury was his first childer, it is unclear if it was some fleeting mortal concept of love that drove him to do so or some other aspect of her that captivated his interest. His other childe was a travelling mage from the order of Hermes that he coincidentally met by the name of Niklaus. By the time of their meeting Morgano was a formidable wielder of blood magic and utilized other vampiric disciplines, specifically vicissitude to get close enough to people that they were unable to react to his attack. Niklaus hated Morgano for embracing him, he considered it a cruel joke on Morgano's behalf and spent many years trying to track him down to his Esztergom chantry.\n\nMorgano became known for his madness in more recent nights, after having emerged from his secluded research, the Warlock saw many of the lesser kindred such as Caitiff had risen to positions of prominence. Having studied the Gehenna profecies heavily, he took this as an omen and began his own crusade to wash Europe clean of the clanless, rallying many traditionalist vampires to his side as he did so. Whilst he used to experiment on his captives, the Mad Lord of House Murchadha now chose to burn his enemies at the stake or in their homes, sometimes whole villages and towns were burned to the ground if there were rumours that they harbored the clanless. Yet because of his isolation and the indifference of the high clans, no one has stopped Morgano's mad scouring of Hungary.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560074:0 "赞助资料：布兰德·德·德雷克"
 POD_patronlore.100.desc.560074:0 "他是一个被称为“德·德雷克”的有能战士。他击退了在周围地区强行索贡的丹麦人。他拒绝向丹麦人付款。在随后的战斗中，荷兰人取得了胜利，800名丹麦人中有500人被杀，包括他们的领袖。然而，荷兰人也失去了他们的领袖。\n\n或者大众是这样想的，实际上他在战斗中被初拥了，被着魔了，改变了他的身份，并从那时起在欧洲旅行，寻找他的归宿。最终，他回到了荷兰，在阴影中进行统治，同时努力恢复自己的理智——或者说屈服于疯狂。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560076:0 "赞助资料：埃登·凯瑟琳"
 POD_patronlore.100.desc.560076:0 "埃登被一位真布鲁赫长者所接纳，他关心的是白嚎的消失和腐败。作为与白嚎一起协作的德鲁伊的后裔，他的尊长希望埃登能对这个谜团提供一些见解。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560079:0 "赞助资料：露娜·莫宁斯塔"
 POD_patronlore.100.desc.560079:0 "作为人类时，露娜总是与她的同龄人不同。她对生与死持怀疑态度，对怪异的事物感兴趣，并爱上了黑夜。有些东西使她平静下来。缓慢但无情的微风穿过她父母房子的岩石时，其他孩子会吓到，她却感到舒适和安全。木头在她脚下的破裂声和黑暗房间的寂静激发了她的想象力。她的美貌似乎是永恒的，但在她拒绝邻居男孩的求爱并被宣布为女巫时，她的美貌几乎熄灭了。当审问者把她送上木桩时，她愤怒和痛苦的哭声传到了当地的一个吸血鬼领主那里，他看到了她对人类的无情仇恨。他救了她，并在不久之后初拥了她。他想看看这样一个美丽而疯狂的人在自取灭亡之前能造成怎样的混乱和痛苦，或者她是否能通过在黑夜宫廷中升阶，成为真正的夜之女主人。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560081:0 "赞助资料：凯莉娅·忒尔狄亚"
 POD_patronlore.100.desc.560081:0 "凯莉娅于公元390年出生在罗马城，生活中是罗马百夫长的第三个孩子。关于她的凡生，人们知道的不多，只是因为没多少可知道的，更不用说她那个时代的大部分记录都被销毁了；她在罗马过着平淡的生活，直到公元410年高卢人洗劫了罗马。她的父亲和哥哥们在战斗中丧生，在试图逃离时，她发现自己被一个血族袭击了。她尽力反击，但这从一开始就是一场无望的战斗，她被轻蔑地打败了。\n\n不知是哪位吸血鬼转化了她，都让她自生自灭了——她作为吸血鬼的新身份很快就被当地人发现了，她只是勉强设法毫发无伤地逃脱了。她逃到了东北部，花了近一个世纪的时间才牢牢掌握了她的新能力，以及如何避免被发现——或招致其他同类的愤怒。只有在又过了两个世纪之后，她才终于为自己开辟了一个地方，无论多么小。但这是一个开始——是否是一个大的开始，还有待观察。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560084:0 "赞助资料：米歇尔·特诺克蒂斯"
 POD_patronlore.100.desc.560084:0 "人们对他的了解并不多，因为他通常都是独来独往地研究深渊。众所周知的是，在他被再造之前，他已经发现了深渊的存在并开始研究。这引起了勒森魃氏族的注意，并最终导致了他目前的不死族状态。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560086:0 "赞助资料：亚历撒库斯"
 POD_patronlore.100.desc.560086:0 "亚历撒库斯在被初拥之前是一个简单的人，在希腊某个早已被遗忘的小村庄里长大。在生活的后期，亚历撒库斯成为一个难以捉摸的神秘主义者，许多人来到这里接受他们的祝福和仪式。他周游列国，那时的夜晚远没有现在这样血腥。在他旅行的某个地方，他几乎丧生，但被巴力之一从死亡中救出并初拥了他。\n\n多年来因其尊长的艺术进行的痛苦训练使他变得强大，但却牺牲了他自己的理智。如今，他像一个隐居的隐士一样生活在一座专门为他量身定做的塔里，操纵着他所在的伯爵领的民众，几乎像一个邪教一样领导他们，而他则是崇拜的中心。他们敬畏地看着他居住的塔，但他们主人的目光早已落在了其他地方。他脑海中的声音谈到了宏伟的成就，他听从这些声音将是明智的。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560070:0 "赞助资料：安倍晴明"
 POD_patronlore.100.desc.560070:0 "日本平安时代中期的阴阳大师。阴阴道是一种自然科学、天文、历法、占卜和魔法系统，以中国的阴阳和五行哲学为基础在日本独立发展。除了他在历史上的突出地位外，他还是日本民间传说中的传奇人物，在许多故事中都有描绘。安倍晴明作为阴阳师，为天皇和平安时代政府工作，就处理问题的正确精神方式提供建议。他为天皇和政府的福祉祈祷，并就各种问题提供建议。他也是一位占星家，预测星象事件。他的寿命非常长，没有任何重大疾病，这促使人们相信他有神秘的力量。在他生命的最后阶段，他被东方的一位萨洛比所初拥。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560073:0 "赞助资料：希梅诺·菲茨罗伊"
 POD_patronlore.100.desc.560073:0 "在被初拥之前，希梅诺·菲茨罗伊是瓦伦西亚的一个小贵族——与某个西班牙国王有远亲关系（他声称是这样）。他建立了一些恶名，因为他自由地与无良商人、盗贼和黑帮混在一起的事实。他的堕落和为自己的利益弯曲法律的意愿引起了一个强大的勒森魃的注意，他在寻找一个值得初拥的凡人。\n\n在初拥之后，希梅诺发现自己被阴暗的海浪所吸引——正如一些勒森魃一样。他招募了他在前世认识的罪犯作为船员，开始了充满冒险、战斗和大量掠夺战利品的伟大航程。对一些海盗来说，袭击和狂欢已经足够了，但希梅诺最终发现他的海上生活……受到了限制。利用十字军东征造成的黎凡特地区的混乱，他夺取了几个关键港口的控制权，决定“开店”。鸦廷由此诞生。从那时起，希梅诺的势力略有扩大，包括了叙利亚的大部分/全部地区和海上的一些零星土地。希梅诺的梦想是建立一个强大的海盗王国，足以自治而不用担心别人插手它的事务；在那里，每个吸血鬼都可以自由地生活和死亡。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560080:0 "赞助资料：玛特泰·耶尔贝根"
 POD_patronlore.100.desc.560080:0 "As with a good number of Tzimisce, Yelbeghen has primarily discarded its mortal past. It was once Matthaios Dragastes, a Romaniote Jewish mystic who practiced the Kabbalah Ma’asit using Qliphothic magic in ages past. Matthaios’ study and skill with such magics made him a person of interest for the Vampires who dwelt within Ancient Constantinople and eventually a childe of the Tzimisce Methuselah Andeleon (Likely Urdo \"Master of Hellhounds, but perhaps Jedrik \"the scholar\") gave the embrace to the mystic under his sire’s instructions.\n\nUnder Andeleon’s tutelage, Dragastes studied the discipline of Vicissitude in all its many forms, and his mastery of the discipline swiftly grew beyond his years in a similar fashion to all of Andeleon’s progeny. As his mastery of Vicissitude solidified, Dragestes found that when he reached out to the Qliphoth, as he had done when he was alive, he could feel an ancient intelligence that dwelt within the anti-life pressing against his consciousness. Under Andeleon’s guidance, the mystic communed with this great intelligence. They revealed to him many great secrets of Vicissitude and told him of the ancient, unnumbered crimes of beings called the Nephilim. Drawn by these Eldritch entities, Matthaios sojourned into the Shadowlands and journeyed to the forests of D’hainu, the ruins of the Second City, and the roots of Mount Meru.\n\nIn these travels, the Watcher’s, as these Qliphothic entities called themselves, broke down Matthaios’ mind and rebuilt it as an extension of their own. Driven mad by eldritch revelations and possessed by these malevolent entities, Matthaios added direction and voice to the emerging Assaku brood that slowly grew like a tumor in Kindred society. Matthaios became a sort of prophet for the Assaku, communicating directly with the Watchers and proclaiming maddening revelations in their name. As the main line of communication between the growing Assaku blood cult in Constantinople, and the Qliphothic masters they served, the rest of Andeleon’s brood began to name Dragastes the “Whisperer in Darkness” as he became a Hierophant for the Growing blood cult.\n\nPosing as a wandering mystic, Dragastes used his Vicissitude to heal the sick and wounded of both Kine and Kindred alike. However, With every healing, his tainted blood spread to the masses, rotting them from the inside out and corrupting them into mere extensions of the Assaku’s will. Potentially Dragastes’ curse may have spread across much of the Mediterranean. However, the Assaku, or more correctly the Watcher’s who dominated his will, had underestimated the other Kindred of the City. The Dracon, an ancient Tzimisce whose knowledge of Vicissitude eclipsed even that of the Assaku, rooted out many of Matthaios’ cults and swiftly drove the rogue Tzimisce to flee the city. However, some remnants of Dragastes’ madness remained in the fringes of ancient Byzantium, though centuries of preparation and plotting had been undone in a brief few years. Although the victory of the Trinity over the Assaku had been swift, the Methuselahs who ruled Constantinople covered up the vanquished Blood cult to preserve the image of a stable and infallible Dream.\n\nFollowing Dragastes’ expulsion from Constantinople, the wandering Hierophant of the Assaku would seemingly vanish off the face of the map. Some would whisper that the Assaku cult had been pursued across Europe and the middle east by the Elioud. Only recently, the “Whisperer in Darkness” has resurfaced under a new name in the furthest corners of Siberia, having seemingly thrown off the pursuit of the Tal’mahe’ra for the time being.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560012:0 "赞助资料：伊扎尔达·基耶斯洛夫斯基"
 POD_patronlore.100.desc.560012:0 "伊扎尔达出生在一个相当成功的家庭，这让她在成长过程中被各种问题包围，其中大部分是她自己造成的。在她的早年，她显示出作为学者的天赋。\n然而，她选择了一条不同的道路，秘密地将自己沉浸在神秘学中。关于她秘密研究的谣言很快就传开了，再加上她极不寻常的外表，使伊扎尔达成为一个被抛弃的人。在一个决定性的夜晚，这位年轻的少女知道了这些谣言有多糟糕，因为她被打成了残废，在街上被打得半死。也许不那么令人惊讶的是，找到并帮助她的人不是别人，而是巫团的成员。\n在巫团的指导下，伊扎尔达迅速学会并成长为一个相当有头脑的女巫。但这位女士又一次在半夜被人扑倒。虽然，这一次，被打残的是她自己的巫团的姐妹们，是她饥渴的受害者。\n一旦过了稚子阶段，伊扎尔达就离开了她的[Sire|E]梅兰迪斯，并放逐了自己，仍然对她的姐妹们的死亡充满了悲伤。在这期间，她深入研究了自己的[clan|E]历史，发现了关于解密会的文本和信息。\n现在，在学会的启发下，她回到了自己的故乡文奇察，轻松地当上了女伯爵。然而，这只是一个更复杂的计划的第一步，该计划旨在提升末卡维和解密会的地位。同时，她将站在中间，准备在世界范围内释放真正的知识并收获其力量。\n\n此非原作角色由赞助者设定提供。"
 POD_patronlore.100.t.560093:0 "资料：阿姆杜乌斯"
 POD_patronlore.100.desc.560093:0 "阿姆杜乌斯于787年出生在法兰西，是查理大帝统治时期宫廷中的一名法兰西贵族。他是查理大帝最亲密的顾问之一，也是一个极其聪明的人。他以其狡猾和奸诈的头脑而闻名，但也被法兰西宫廷中常见的妄想症所困扰。在查理大帝去世的当晚，他被阿扎那利初拥，很快就接受了他的新亡生，并摆脱了他的旧生活，他的原名也消失在历史中。教团现在只知道阿姆杜乌斯。他学崇魔术学得很快，在教团中被称为地狱眷族领主，并因其实验和研究在血系中受到高度尊重。\n\n此非原作角色由赞助者设定提供。"