l_simp_chinese:
 POD_mesmerize.100.t:0 "你被支配了。"
 POD_mesmerize.100.desc:0 "[schemer.GetTitledFirstName]在支配你并索要一个人情。"
 POD_mesmerize.100.option.a:0 "运用我的意志力去抵抗支配。"
 POD_mesmerize.100.option.b:0 "抗拒支配。"
 POD_mesmerize.100.option.c:0 "接受支配。"
 POD_mesmerize.200.t:0 "正在支配[target.GetFirstNameNoTooltip]"
 POD_mesmerize.200.desc:0 "我以意志命令[target.GetTitledFirstName]。但[target.GetSheHe|U]正在抗拒我的支配！"
 POD_mesmerize.200.option.a:0 "激起血液来支配[target.GetHerHim]。"
 POD_mesmerize.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip]掌握着坚韧术[discipline|E]并抵抗了我的力量。"
 POD_mesmerize.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip]发挥了[target.GetHerHis]的意志力来抵抗我的能力。"
 POD_mesmerize.200.a.success.desc:0 "成功"
 POD_mesmerize.200.a.tt_success:0 "[target.GetTitledFirstName]将给予你一个人情。"
 POD_mesmerize.200.a.failure.desc:0 "失败"
 POD_mesmerize.200.a.tt_failure:0 "[target.GetTitledFirstName]将抵抗你的支配。"
 POD_mesmerize.200.option.b:0 "激起血液然后发挥我的意志。我是主人！"
 POD_mesmerize.200.option.b.tt.beast:0 "#R 我是主人！#!"
 POD_mesmerize.200.option.c:0 "这简直是在浪费时间，我不再想支配[target.GetHerHim]。"
 POD_mesmerize.200.option.c.tt:0 "支配将会失败。"
 POD_mesmerize.300.t:0 "[target.GetFirstNameNoTooltip]已受催眠"
 POD_mesmerize.300.desc:0 "通过使用我的支配术[discipline|E]，[target.GetTitledFirstName]将听从我的命令。\n\n提示：要使用你的命令，请使用命令傀儡角色互动。"
 POD_mesmerize.300.desc.short_term:0 "\n\n由于你没有潜心暗导技能，你只有数天的时间来下达你的命令。"
 POD_mesmerize.300.option.a:0 "现在，我想让[target.GetHerHim]做什么？"
 POD_mesmerize.300.option.a.tt.beast:0 "#R 血！我们需要血！#!"
 POD_mesmerize.400.t:0 "我无法拒绝的债务"
 POD_mesmerize.400.desc:0 "我欠[schemer.GetTitledFirstName]的。"
 POD_mesmerize.400.option.a:0 "我该怎么向[schemer.GetHerHim]交代呢？"
 POD_mesmerize.500.t:0 "抵抗支配"
 POD_mesmerize.500.desc:0 "[target.GetTitledFirstName]抵抗了我的支配。"
 POD_mesmerize.500.option.a:0 "这不可能！"
 POD_mesmerize.500.option.a.tt.beast:0 "#R 打到其听话为止！#!"
 POD_mesmerize.600.t:0 "抵抗支配"
 POD_mesmerize.600.desc:0 "我已经摆脱了[schemer.GetTitledFirstName]的支配之精神枷锁。"
 POD_mesmerize.600.option.a:0 "我有钢铁般的意志！"
 POD_mesmerize.700_toast_title:0 "支配已过期！"
 POD_mesmerize.700_toast_ct:0 "若你想命令[target.GetName]，你必须得启动一个新计谋。"