l_simp_chinese:
 POD_summon.100.t:0 "你正被别人召唤"
 POD_summon.100.desc:0 "你感受到了一种强烈的冲动，想跟[schemer.GetTitledFirstName]站到一边。"
 POD_summon.100.option.a:0 "运用我的意志力去抵抗召唤。"
 POD_summon.100.option.b:0 "抗拒召唤。"
 POD_summon.100.option.c:0 "接受召唤。"
 POD_summon.200.t:0 "正在召唤[target.GetFirstNameNoTooltip]"
 POD_summon.200.desc:0 "我感受到我的神秘能量触碰到了[target.GetTitledFirstName]的心智，[target.GetSheHe|U]正在抵抗我的召唤。"
 POD_summon.200.option.a:0 "激起血液来召唤[target.GetHerHim]。"
 POD_summon.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip]掌握着坚韧术异能并抵抗我的力量。"
 POD_summon.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip]用他的意志抵抗我的力量。"
 POD_summon.200.a.success.desc:0 "成功"
 POD_summon.200.a.tt_success:0 "[target.GetTitledFirstName]将会到达我的宫廷"
 POD_summon.200.a.failure.desc:0 "失败"
 POD_summon.200.a.tt_failure:0 "[target.GetTitledFirstName]将抵抗我的召唤"
 POD_summon.200.option.b:0 "激起血液，发挥我的意志。我的意志不可拒绝！"
 POD_summon.200.option.b.tt.beast:0 "#R 很好！把他们带过来！"
 POD_summon.200.option.c:0 "算了，我不想要[target.GetHerHim]了。"
 POD_summon.200.option.c.tt:0 "召唤将会失败。"
 POD_summon.200.option.c.tt.beast:0 "#R 不！他们要逃脱了！#"
 POD_summon.300.t:0 "[target.GetFirstNameNoTooltip]受到了召唤。"
 POD_summon.300.desc:0 "通过运用我的神秘力量，[target.GetTitledFirstName]已经到达我的宫廷。"
 POD_summon.300.option.a:0 "欢迎来到我家，蜘蛛对苍蝇说道。"
 POD_summon.300.option.a.tt.beast:0 "#R 晚餐时间！#"
 POD_summon.400.t:0 "你已到达"
 POD_summon.400.desc:0 "你发现你正处于[schemer.GetTitledFirstName]的宫廷中。"
 POD_summon.400.option.a:0 "我的新家。"
 POD_summon.500.t:0 "抵抗召唤"
 POD_summon.500.desc:0 "[target.GetTitledFirstName]抵抗了我的召唤。"
 POD_summon.500.option.a:0 "真是失败！"
 POD_summon.500.option.a.tt.beast:0 "#R 让我们抓住并吃了他们！ #"
 POD_summon.600.t:0 "抵抗召唤"
 POD_summon.600.desc:0 "你不再感受到[schemer.GetTitledFirstName]的召唤。"
 POD_summon.600.option.a:0 "离我的心智远点！"