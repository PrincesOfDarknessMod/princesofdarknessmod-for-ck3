l_simp_chinese:
 POD_embrace.100.t:0 "初拥"
 POD_embrace.100.desc:0 "我精心安排了一切，使[scheme.GetTarget.GetFirstName]落入我的控制之下。在一处隐密的角落，[victim.GetSheHe]已无法逃脱。即使这意味着是对[victim.GetHerHis]的诅咒，我也要授予其永生吗？[victim.GetSheHe]会感激我，还是[victim.GetSheHe]会永远怨恨我？我的[Sire|E]有过这些想法么？"
 POD_embrace.100.option.a:0 "[Embrace|E][scheme.GetTarget.GetFirstName]"
 POD_embrace.100.option.a.tt:0 "我会杀了[scheme.GetTarget.GetFirstName]然后将[victim.GetHerHim]转化为吸血鬼。这会扣除你的虔诚，还会有增加你的饥渴度和曝露[masquerade|E]的风险。"
 POD_embrace.100.option.a.tt.beast:0 "#R 对！将其吸干然后给予一滴我们的鲜血。我们总能将其全部收回！#"
 POD_embrace.100.option.b:0 "让[victim.GetHerHim]走。"
 POD_embrace.100.option.b.tt.beast:0 "#R 不！不要让[victim.GetHerHim]跑掉！我已经等了这个时刻太久！我们已经等了这个时刻太久。#"
 POD_embrace.200.t:0 "初拥"
 POD_embrace.200.desc:0 "该猎人，[scheme.GetTarget.GetFirstName]被关在一个严密保护的牢房里任你[Embrace|E]。不幸的是，让他配得上这一切的那些猛人，会让这一过程变得困难。"
 POD_embrace.200.option.a:0 "强行[Embrace|E]该猎人"
 POD_embrace.200.option.a.s.tt:0 "你抓住了猎人，并吸干了他们的血。"
 POD_embrace.200.option.a.f.tt:0 "猎人有个可怕的惊喜要给你。"
 POD_embrace.210.desc:0 "喉咙还在滴血，[scheme.GetTarget.GetFirstName]用愤恨的眼神看着你。该猎人会将你赐予的不死亡生会当做礼物接受还是会坚信这是一个可怕的诅咒呢，还有待观察。"
 POD_embrace.220.desc:0 "牢房的门被打开，你从房间的另一边跳向你的目标。在飞行途中，你发现你慷慨提供给囚犯的木凳少了只腿。[scheme.GetTarget.GetFirstName]展示了坚定的眼神，举起了一根锋利的木桩。你的爪子够到了受害者的身体，但你自己的惯性一直把你的心捅向木桩尖。"
 POD_embrace.200.option.b:0 "偷偷地接近猎人"
 POD_embrace.200.option.b.s.tt:0 "一口咬进一位无准备者的脖子，一位熟睡的受害者。"
 POD_embrace.200.option.b.f.tt:0 "猎人只想睡觉……"
 POD_embrace.230.desc:0 "当在你靠近的时候[victim.GetHerHis]的脖子时，[scheme.GetTarget.GetFirstName]看起来睡得很熟。就在那一刻，你意识到牢房中强烈恶臭的来源。那是灯油吗？[scheme.GetTarget.GetFirstName]打开了[victim.GetHerHis]眼，抓住你的衣领，凑耳说“去死吧，魔物。”只有当你注意到火花时，你才意识到即将发生什么。"
 POD_embrace.200.option.c:0 "让其相信这是让其延续其存在的唯一办法"
 POD_embrace.200.option.c.s.tt:0 "你劝服了猎人说亡生可是美好的。"
 POD_embrace.200.option.c.f.tt:0 "猎人劝服了你什么……"
 POD_embrace.240.desc:0 "你试图说服即将成为你子嗣的人亡生是一种福报时，你过于急于回答问题。甚至连你自己都觉得难以回答的问题。这是真的吗？你已经绝望地失去了一切让生活变得可以忍受的东西吗？"
 POD_embrace.200.option.d:0 "这是个坏主意。"
 POD_embrace.200.option.d.tt:0 "世上有那么多凡人，为啥我要成为一个发誓要杀死血族的人的[Sire|E]？"
 POD_embrace.210.t:0 "就像从瞎乞丐手里拿走硬币一般。"
 POD_embrace.210.option.a:0 "放心吧，我的子嗣。"
 POD_embrace.210.option.a.tt:0 "[scheme.GetTarget.GetFirstName]成为了你的子嗣。"
 POD_embrace.220.t:0 "消失在黑暗中。"
 POD_embrace.220.option.a:0 "为啥？为啥是木凳？"
 POD_embrace.220.option.a.tt:0 "你死了。"
 POD_embrace.230.t:0 "被油浸透的床层燃起了熊熊烈火。"
 POD_embrace.230.option.a:0 "[victim.GetSheHe]是怎么弄到油的？"
 POD_embrace.230.option.a.tt:0 "你死了。"
 POD_embrace.240.t:0 "结果这根本就不是福报。"
 POD_embrace.240.option.a:0 "你需要点时间来考虑。"
 POD_embrace.240.option.a.tt:0 "你被这次谈话深深地扰乱了。"