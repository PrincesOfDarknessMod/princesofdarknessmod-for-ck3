l_simp_chinese:
 POD_embrace.100.t:0 "初拥"
 POD_embrace.100.desc:0 "我精心安排了一切，使[scheme.GetTarget.GetFirstName]落入我的控制之下。[victim.GetSheHe]在隐密的角落也不能逃脱。即使这意味着对[victim.GetHerHis]诅咒，我也要授予他永生吗？[victim.GetSheHe]会感激我，还是[victim.GetSheHe]会永远怨恨我？我的尊长有这些想法吗？"
 POD_embrace.100.option.a:0 "初拥[scheme.GetTarget.GetFirstName]"
 POD_embrace.100.option.a.tt:0 "我会杀了[scheme.GetTarget.GetFirstName]然后将[victim.GetHerHim]转化为吸血鬼。这会扣除你的虔诚，可能增加你的饥渴，也可能有暴露潜藏的风险。"
 POD_embrace.100.option.a.tt.beast:0 "#R 对！将其吸干然后给予一滴我们的鲜血。我们总能将其全部收回！#"
 POD_embrace.100.option.b:0 "让[victim.GetHerHim]走。"
 POD_embrace.100.option.b.tt.beast:0 "#R 不！不要让[victim.GetHerHim]跑掉！我已经等了这个时刻太久！我们已经等了这个时刻太久。#"