l_simp_chinese:
 POD_hunteradoption.100.t:0 "新的曙光"
 POD_hunteradoption.100.desc:0 "经过全面的训练，你确信你的骑士侍从已经准备好加入对抗黑暗的战斗。有了这种努力，你就确信上帝的造物将比你活得更久，并且触须下去，直到不可避免的胜利。你希望你的学徒有一天仅仅因为他的出现就能使地狱的力量退却。但在那之前，还有很多工作要做……"
 POD_hunteradoption.100.option.a:0 "我教的是军事事务"
 POD_hunteradoption.100.option.a.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.100.option.b:0 "武艺是我们的主要关注点"
 POD_hunteradoption.100.option.b.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.100.option.c:0 "我的骑士侍从已经了解在每处阴影都有地狱的代理人"
 POD_hunteradoption.100.option.c.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.101.t:0 "新的曙光"
 POD_hunteradoption.101.desc:0 "作为暗影裁判所里跳动的心脏，圣约翰修女会背负着沉重的负担，这是她们无法轻松分担的。尽管如此，经过这段时间的全面训练，您对自己新学徒的能力保有信心。上帝的另一位新娘已经准备好了，能够在当黑暗笼罩你的时候，接过你的衣钵。略显的安慰，但仍然是种安慰。"
 POD_hunteradoption.101.option.a:0 "她学会了很多"
 POD_hunteradoption.101.option.a.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.101.option.b:0 "她将让罗马教廷繁荣"
 POD_hunteradoption.101.option.b.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.101.option.c:0 "她已经准备好传播圣言了"
 POD_hunteradoption.101.option.c.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.102.t:0 "新的曙光"
 POD_hunteradoption.102.desc:0 "尽管经常被中伤，但红修会仍然是裁判所的重要组成部分。在无尽的求知欲的驱使下，许多成员经常发现自己被吸引到一条更黑暗的道路上。你尽你所能教导你的学徒避免这样的命运。"
 POD_hunteradoption.102.option.a:0 "我的学徒学会了很多"
 POD_hunteradoption.102.option.a.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.102.option.b:0 "我的学徒将让罗马教廷繁荣"
 POD_hunteradoption.102.option.b.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.102.option.c:0 "我的学徒已经了解秘密的力量"
 POD_hunteradoption.102.option.c.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.103.t:0 "新的曙光"
 POD_hunteradoption.103.desc:0 "神目是猎人的秘密警察，是一股正当的、令人畏惧的力量，即使对其他裁判官也不例外。他们知道的比大多数人想的要多得多，是关于夜间居民的最可靠的信息来源。然而，神目的成员倾向于偏执到极端，目中到处都是阴谋……但通常情况下，他们都是对的。"
 POD_hunteradoption.103.option.a:0 "开眼！"
 POD_hunteradoption.103.option.a.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.104.t:0 "新的曙光"
 POD_hunteradoption.104.desc:0 "冯·穆尔瑙一家有幸能够「闻到」邪恶的气味。就其本身而言，他们是裁判所的猎犬，是一笔宝贵的资产，尽管他们非神职的行事方式使他们与其他修士会格格不入。该家的裁判官通常会把另一位更年轻的家庭成员作为学徒，直到他或她能够独自与黑暗作斗争。"
 POD_hunteradoption.104.option.a:0 "我的学徒已经了解秘密的力量"
 POD_hunteradoption.104.option.a.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.104.option.b:0 "我的学徒将让罗马教廷繁荣"
 POD_hunteradoption.104.option.b.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"
 POD_hunteradoption.104.option.c:0 "我的学徒已经准备好传播上帝之言了"
 POD_hunteradoption.104.option.c.tt:0 "训练人很艰苦，但你现在有了一个可以在黑暗吞没你后继任的新继承人"