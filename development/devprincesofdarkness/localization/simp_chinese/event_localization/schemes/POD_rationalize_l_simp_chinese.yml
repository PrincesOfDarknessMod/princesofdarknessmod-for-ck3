l_simp_chinese:
 POD_rationalize.100.t:0 "你被支配了。"
 POD_rationalize.100.desc:0 "[schemer.GetTitledFirstName]在支配你并索要一个人情。"
 POD_rationalize.100.option.a:0 "运用我的意志力去抵抗支配。"
 POD_rationalize.100.option.b:0 "抗拒支配。"
 POD_rationalize.100.option.c:0 "接受支配。"
 POD_rationalize.200.t:0 "正在支配[target.GetFirstNameNoTooltip]"
 POD_rationalize.200.desc:0 "我的意志命令[target.GetTitledFirstName]。[target.GetSheHe|U]正在抗拒我的支配。"
 POD_rationalize.200.option.a:0 "唤醒血脉来支配[target.GetHerHim]。"
 POD_rationalize.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip]掌握着坚韧术异能并抵抗我的力量。"
 POD_rationalize.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip]发挥了[target.GetHerHis]意志力来抵抗我的能力。"
 POD_rationalize.200.a.success.desc:0 "成功"
 POD_rationalize.200.a.tt_success:0 "[target.GetTitledFirstName]会自欺给你一个人情。"
 POD_rationalize.200.a.failure.desc:0 "失败"
 POD_rationalize.200.a.tt_failure:0 "[target.GetTitledFirstName]将抵抗你的支配。"
 POD_rationalize.200.option.b:0 "激起血液然后发挥我的意志。我是主人！"
 POD_rationalize.200.option.b.tt.beast:0 "#R 我是主人！#"
 POD_rationalize.200.option.c:0 "这简直是在浪费时间，我不再想支配[target.GetHerHim]。"
 POD_rationalize.200.option.c.tt:0 "支配将会失败。"
 POD_rationalize.300.t:0 "[target.GetFirstNameNoTooltip]自欺了"
 POD_rationalize.300.desc:0 "通过运用我的支配术异能，[target.GetTitledFirstName]会自欺欠我一个人情。"
 POD_rationalize.300.option.a:0 "现在，我想让[target.GetHerHim]做什么？"
 POD_rationalize.300.option.a.tt.beast:0 "#R 血！我们需要血！#"
 POD_rationalize.400.t:0 "我无法拒绝的债务"
 POD_rationalize.400.desc:0 "我欠[schemer.GetTitledFirstName]的。"
 POD_rationalize.400.option.a:0 "我该怎么向[schemer.GetHerHim]交代呢？"
 POD_rationalize.500.t:0 "抵抗支配"
 POD_rationalize.500.desc:0 "[target.GetTitledFirstName]抵抗了我的支配。"
 POD_rationalize.500.option.a:0 "这不可能！"
 POD_rationalize.500.option.a.tt.beast:0 "#R 打到他们听话为止！#"
 POD_rationalize.600.t:0 "吸血鬼可以放大他们的其他支配能力，同时影响更多的人。"
 POD_rationalize.600.desc:0 "我已经摆脱了[schemer.GetTitledFirstName]的精神枷锁的支配。"
 POD_rationalize.600.option.a:0 "我有钢铁般的意志！"