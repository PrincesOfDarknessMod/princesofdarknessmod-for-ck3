l_simp_chinese:
 POD_vamphunt.1.t:0 "血！"
 POD_vamphunt.1.desc:0 "你追踪到了你的猎物。你的猎物在你的血吻下屈服。你打算吸多少血？"
 POD_vamphunt.1.option.a:0 "不吸血。让他们毫发无伤的离开。"
 POD_vamphunt.1.option.b:0 "喝一点，就一点点。"
 POD_vamphunt.1.option.c:0 "稍微喝点。他们只会觉得有些虚弱，但不会有大碍。"
 POD_vamphunt.1.option.d:0 "多喝一些，让他们卧床不起。"
 POD_vamphunt.1.option.e:0 "吸干他们，牺牲他们的生命来完全满足我的饥渴。"