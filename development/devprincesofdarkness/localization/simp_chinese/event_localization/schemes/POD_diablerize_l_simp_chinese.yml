l_simp_chinese:
 POD_diablerize.100.t:0 "吸榨：[diablerie_location.GetNameNoTooltip]"
 POD_diablerize.100.desc:0 "我追踪着[defender.GetFirstName]到[defender.GetHerHis]在[diablerie_location.GetNameNoTooltip]的藏身处。一切准备就绪，而现在我终于可以袭击[defender.GetHerHim]并吸走所有[defender.GetHerHis]的血，甚至[defender.GetHerHis]的灵魂！个人风险相当大，但回报更大。我下定决心并对[defender.GetFirstName]发动我最致命的攻击。"
 POD_diablerize.100.option.a:0 "攻击[defender.GetTitledFirstName]"
 POD_diablerize.100.option.a.tt:0 "一场斗争接踵而来，如果我输了，我也会被毁灭。我将用我全部的意志力和血之力来取得成功。"
 POD_diablerize.100.option.a.tt.beast:0 "#R 攻击！我们会得到[defender.GetHerHis]的心头血！#!"
 POD_diablerize.100.option.b:0 "放弃这肮脏的追求。"
 POD_diablerize.100.option.b.tt.beast:0 "#R 我知道[defender.GetSheHe]很虚弱。我嗅到了！不要现在撤退！#!"
 POD_diablerize.200.t:0 "一次致命的攻击"
 POD_diablerize.200.desc:0 "[attacker.GetFirstName]在[diablerie_location.GetNameNoTooltip]抓到了我。[attacker.GetHerHis|U]正因心兽饥渴而眼光闪烁！我该做什么？"
 POD_diablerize.200.option.a:0 "逃跑"
 POD_diablerize.200.option.a.tt.beast:0 "#R 蠢货，快跑！#!"
 POD_diablerize.200.option.a.tt:0 "一次针对机动的军事属性对抗检定会决定你是否可以从[attacker.GetFirstName]攻击中逃跑"
 POD_diablerize.200.option.a.desc:0 "机动比拼"
 POD_diablerize.200.option.a.success:0 "[defender.GetFirstName]赢了"
 POD_diablerize.200.option.a.tt.defender_wins:0 "我逃出来了！"
 POD_diablerize.200.option.a.tt.celerityadvanced:0 "我有高阶迅捷术！"
 POD_diablerize.200.option.a.tt.potenceadvanced:0 "我有高阶蛮力术！"
 POD_diablerize.200.option.a.tt.blink:0 "我能在眨眼间移动。"
 POD_diablerize.200.option.a.tt.traversal:0 "我可以在墙上跑并穿过水域。"
 POD_diablerize.200.option.a.tt.soaring_leap:0 "我可以腾空而起。"
 POD_diablerize.200.option.a.tt.uncanny_grip:0 "我可以附墙不落。"
 POD_diablerize.200.option.a.failure:0 "[attacker.GetFirstName]赢了"
 POD_diablerize.200.option.a.tt.attacker_wins:0 "[attacker.GetFirstName]抓到我了"
 POD_diablerize.200.option.b:0 "快藏！"
 POD_diablerize.200.option.b.tt:0 "一次针对躲藏与搜寻的谋略能力对抗检定会决定你是否可以从[attacker.GetFirstName]攻击中逃跑。"
 POD_diablerize.200.option.b.desc:0 "一场捉迷藏竞赛。"
 POD_diablerize.200.option.b.tt.beast:0 "#R 黑夜是我们的护甲！#!"
 POD_diablerize.200.option.b.tt.obfuscateadvanced:0 "我有高阶混淆术！"
 POD_diablerize.200.option.b.tt.oblivionadvanced:0 "我有高阶湮灭术！"
 POD_diablerize.200.option.b.tt.cloak_of_shadows:0 "我可以隐藏自己在阴影之中。"
 POD_diablerize.200.option.b.tt.silence_of_death:0 "我悄无声息的移动。"
 POD_diablerize.200.option.b.tt.unseen_passage:0 "我只是个无形过客。"
 POD_diablerize.200.option.b.tt.vanish:0 "我可以直接消失不见。"
 POD_diablerize.200.option.b.tt.stygian_shroud:0 "我可以召唤冥河尸幕。"
 POD_diablerize.200.option.b.tt.shadow_step:0 "我能潜入暗影。"
 POD_diablerize.200.option.b.success:0 "[defender.GetFirstName]赢了"
 POD_diablerize.200.option.b.tt.defender_wins:0 "我藏过去了！"
 POD_diablerize.200.option.b.failure:0 "[attacker.GetFirstName]赢了"
 POD_diablerize.200.option.b.tt.attacker_wins:0 "[attacker.GetFirstName]抓到我了。"
 POD_diablerize.200.option.c:0 "魅惑！"
 POD_diablerize.200.option.c.tt.beast:0 "#R [attacker.GetSheHe]怎么能攻击我们？！我们明明对[attacker.GetSheHe]这么好！#!"
 POD_diablerize.200.option.c.desc:0 "性格的冲突"
 POD_diablerize.200.option.c.tt:0 "一次外交能力对抗检定会决定你是否可以使用威仪术[discipline|E]让[attacker.GetFirstName]停止[attacker.GetHerHis]的攻击"
 POD_diablerize.200.option.c.tt.entrancement:0 "我在魅惑。"
 POD_diablerize.200.option.c.tt.majesty:0 "吾有强威！"
 POD_diablerize.200.option.c.success:0 "[defender.GetFirstName]赢了"
 POD_diablerize.200.option.c.tt.defender_wins:0 "我魅惑[attacker.GetFirstName]！"
 POD_diablerize.200.option.c.failure:0 "[attacker.GetFirstName]赢了"
 POD_diablerize.200.option.c.tt.attacker_wins:0 "[attacker.GetFirstName]对我的魅力免疫。"
 POD_diablerize.200.option.d:0 "催眠！"
 POD_diablerize.200.option.d.desc:0 "支配的冲突"
 POD_diablerize.200.option.d.tt.beast:0 "#R [attacker.GetSheHe|U]将会听令！#!"
 POD_diablerize.200.option.d.tt:0 "一次管理能力对抗检定会决定你是否可以使用支配术[discipline|E]命令[attacker.GetFirstName]停止[attacker.GetHerHis]的攻击"
 POD_diablerize.200.option.d.tt.mesmerize:0 "我可催眠精神脆弱者。"
 POD_diablerize.200.option.d.tt.rationalize:0 "我可以让血奴们把我的命令当成是他们自己的意愿。"
 POD_diablerize.200.option.d.tt.submerged_directive:0 "我可以暗示指令，把弱者变成我的卒子。"
 POD_diablerize.200.option.d.tt.terminal_decree:0 "我可下达必遵指令。"
 POD_diablerize.200.option.d.success:0 "[defender.GetFirstName]赢了"
 POD_diablerize.200.option.d.tt.defender_wins:0 "我支配了[attacker.GetFirstName]！"
 POD_diablerize.200.option.d.failure:0 "[attacker.GetFirstName]赢了"
 POD_diablerize.200.option.d.tt.attacker_wins:0 "[attacker.GetFirstName]的意志力过强无法被支配。"
 POD_diablerize.200.option.e:0 "变形！"
 POD_diablerize.200.option.e.tt.beast:0 "#R [attacker.GetSheHe]不能进食[attacker.GetSheHe]无法掌控的！#!"
 POD_diablerize.200.option.e.tt:0 "一次学识能力对抗会决定你是否可以使用[discipline|E]变形为虚体形态并规避[attacker.GetFirstName]的伏击。"
 POD_diablerize.200.option.f:0 "攻击！"
 POD_diablerize.200.option.f.tt.beast:0 "#R 我会得到[attacker.GetHerHis]的血！#!"
 POD_diablerize.200.option.f.tt:0 "一次勇武能力对抗检定会决定是[attacker.GetFirstName]还是你赢得搏斗。"
 POD_diablerize.250.t:0 "吸榨：战斗！"
 POD_diablerize.250.option.a.success:0 "……太快了！"
 POD_diablerize.250.option.a.failure:0 "我抓住了这只逃跑的老鼠！"
 POD_diablerize.275.t:0 "逃离战斗！"
 POD_diablerize.275.desc.success:0 "我能够逃离[attacker.GetFirstName]。[attacker.GetSheHe|U]离我远远的，已经看不到了。"
 POD_diablerize.275.desc.failure:0 "我跑的不够快。[attacker.GetFirstName]抓住了我。"
 POD_diablerize.275.option.a.success:0 "我必须远离[attacker.GetHerHim]。"
 POD_diablerize.275.option.a.failure:0 "或[attacker.GetHerHim]或我！"
 POD_diablerize.300.t:0 "吸榨：躲藏！"
 POD_diablerize.300.desc.success:0 "[defender.GetFirstName]跑的够快来逃离我。我到处都找不到[defender.GetHerHim]。"
 POD_diablerize.300.desc.failure:0 "[defender.GetFirstName]尝试躲开我。这没用的。我能看到[defender.GetSheHe]在哪。"
 POD_diablerize.300.option.a.success:0 "失败！"
 POD_diablerize.300.option.a.failure:0 "攻击！"
 POD_diablerize.325.t:0 "躲避战斗！"
 POD_diablerize.325.desc.success:0 "差点。我成功躲开了[attacker.GetFirstName]。现在我只需要悄悄的离开并不引起注意，我就能远离[attacker.GetHerHim]。"
 POD_diablerize.325.desc.failure:0 "我尝试躲藏，但[attacker.GetFirstName]找到我了。"
 POD_diablerize.325.option.a.success:0 "我需要掩盖我的踪迹。"
 POD_diablerize.325.option.a.failure:0 "或[attacker.GetHerHim]或我！"
 POD_diablerize.350.t:0 "吸榨：魅惑！"
 POD_diablerize.350.desc.success:0 "看看[defender.GetHerHis]的眼睛，我才发现[defender.GetFirstName]是如此的迷人。我真的喜欢他。我怎么能伤害[defender.GetHerHim]。如果不是为了沐浴在[defender.GetHerHis]的光辉下，我为什么会在这里？"
 POD_diablerize.350.desc.failure:0 "[defender.GetFirstName]尝试使我着迷，但我的头脑还没有那么脆弱，不会轻信这种赤裸的伎俩。我将获得[defender.GetHerHis]的血！"
 POD_diablerize.350.option.a.success:0 "我太爱你了。"
 POD_diablerize.350.option.a.success.tt:0 "当我被[defender.GetFirstName]魅惑时，我将无法再次尝试[diablerize|E][defender.GetHerHim]。"
 POD_diablerize.350.option.a.failure:0 "你的魅惑对我毫无效果。"
 POD_diablerize.375.t:0 "魅惑敌人"
 POD_diablerize.375.desc.success:0 "通过我威仪术[discipline|E]，我魅惑了[attacker.GetFirstName]。当被着迷时，[attacker.GetSheHe]对我来说不是威胁。"
 POD_diablerize.375.desc.failure:0 "我尝试获取[attacker.GetFirstName]的目光并施用我的威仪术到[attacker.GetHerHim]上使他软化。但[attacker.GetSheHe]反而又快又怒的向我冲来，看来我失败了。"
 POD_diablerize.375.option.a.success:0 "是的，就是如此。我是你喜欢的人。"
 POD_diablerize.375.option.a.success.tt:0 "当[attacker.GetFirstName]被我魅惑时，[attacker.GetSheHe]不能再次尝试[diablerize|E]我。"
 POD_diablerize.375.option.a.failure:0 "[attacker.GetSheHe]为何不爱我！"
 POD_diablerize.425.t:0 "催眠敌人"
 POD_diablerize.425.desc.success:0 "通过我的支配术[discipline|E]，我将[attacker.GetHerHis]的意志如同陶工对黏土一般重塑。首先我强迫[attacker.GetHerHim]“停！”，现在的话我该试试其他有趣的命令了。"
 POD_diablerize.425.desc.failure:0 "我侵入[attacker.GetHerHis]的脑海。那如同堡垒一般而我无法深入。[attacker.GetSheHe|U]对我的重复命令无动于衷。"
 POD_diablerize.425.option.a:0 "滚出这地方。并别回来了。"
 POD_diablerize.425.option.a.tt:0 "[attacker.GetFirstName]对你的[diablerie|E]计谋已终结。"
 POD_diablerize.425.option.b:0 "你会帮我一个重要的忙。"
 POD_diablerize.425.option.b.tt:0 "我将获得[attacker.GetFirstName]的牵制"
 POD_diablerize.425.option.e:0 "你现在是我的囚犯了。"
 POD_diablerize.425.option.e.tt:0 "我会监禁[attacker.GetFirstName]。"
 POD_diablerize.425.option.c:0 "在太阳下焚烧吧。"
 POD_diablerize.425.option.c.sunrise:0 "在太阳下焚烧吧。"
 POD_diablerize.425.option.c.behead:0 "去断头台，囚犯。乖。"
 POD_diablerize.425.option.c.fire:0 "自己滚到火堆上。"
 POD_diablerize.425.option.c.tt:0 "[attacker.GetFirstName]会自杀并承受终焉之死。"
 POD_diablerize.425.option.d:0 "为啥[attacker.GetSheHe]不听我的！"
 POD_diablerize.400.t:0 "吸榨：支配术！"
 POD_diablerize.400.desc.success:0 "[defender.GetFirstName]侵入我的脑海。我没法抵抗[defender.GetHerHis]的意志。我被完全的支配了。[defender.GetSheHe|U]强迫我“停！”"
 POD_diablerize.400.desc.leave:0 "随后[defender.GetFirstName]命令，“滚出这地方并别回来了”。"
 POD_diablerize.400.desc.favor:0 "随后[defender.GetFirstName]命令，“你会帮我一个重要的忙”。"
 POD_diablerize.400.desc.favor.tt:0 "[defender.GetFirstName]给予你一个牵制。"
 POD_diablerize.400.desc.die:0 "[defender.GetFirstName]给予你一最终命令，“在太阳下焚烧吧”。"
 POD_diablerize.400.desc.sunrise:0 "[defender.GetFirstName]给予你一最终命令，“在太阳下焚烧吧”。"
 POD_diablerize.400.desc.behead:0 "[defender.GetFirstName]给予你一最终命令，“去断头台，囚犯。乖”。"
 POD_diablerize.400.desc.fire:0 "[defender.GetFirstName]给予你一最终命令，“自己滚到火堆上”。"
 POD_diablerize.400.desc.prison:0 "[defender.GetFirstName]命令你进入监牢，“你现在是我的囚犯了”。"
 POD_diablerize.400.desc.failure:0 "当我冲向[defender.GetFirstName]，[defender.GetSheHe]全力凝视着我并带着强制口气命令我“停！”，但[defender.GetSheHe|U]无法掌控我！"
 POD_diablerize.400.option.a.success:0 "悉听尊便。"
 POD_diablerize.400.option.d.failure:0 "滚出我的脑海！"
 POD_diablerize.450.t:0 "吸榨：变形！"
 POD_diablerize.450.desc.success:0 "在我眼前，[defender.GetFirstName]神奇的转化为一种无形形态。我无法抓到[defender.GetHerHim]。我甚至不能触碰到[defender.GetHerHim]。而就这样，[defender.GetSheHe]走了。"
 POD_diablerize.450.desc.failure:0 "[defender.GetFirstName]开始变身。[defender.GetHerHis]的身体开始转变形态。[defender.GetSheHe]不够快以逃离我！"
 POD_diablerize.450.option.a.success:0 "攻击！"
 POD_diablerize.450.option.a.failure:0 "失败！"
 POD_diablerize.475.t:0 "变化形态"
 POD_diablerize.475.desc.success:0 "我专注于我的[discipline|E]并转化为一无形形态。它在[attacker.GetFirstName]碰到我之前成功了。随后我简单的逃掉了。"
 POD_diablerize.475.desc.failure:0 "我开始变身为一无形形态。但我没能在[attacker.GetFirstName]踩在我身上之前完成。"
 POD_diablerize.475.option.a.success:0 "这不会是最后一次这个把戏救了我。"
 POD_diablerize.475.option.a.failure:0 "那么来肉体对抗肉体！"
 POD_diablerize.500.t:0 "吸榨：最终决战"
 POD_diablerize.500.desc:0 "不再逃，不再藏，不再更多精神把戏。[defender.GetFirstName]已经无法摆脱我。是最终一战的时候了。"
 POD_diablerize.500.option.a:0 "攻击[defender.GetHerHim]！"
 POD_diablerize.500.option.a.tt.beast:0 "#R 好！所有[defender.GetHerHis]的血都是我的！……我说我们的。所有[defender.GetHerHis]的血都是我们的！#!"
 POD_diablerize.500.option.a.tt.attacker_wins:0 "[attacker.GetFirstName]赢了！"
 POD_diablerize.500.option.a.tt.defender_wins:0 "[defender.GetFirstName]赢了！"
 POD_diablerize.500.option.a.desc:0 "勇武的对决"
 POD_diablerize.500.option.a.success:0 "胜利！"
 POD_diablerize.500.option.a.failure:0 "失败！"
 POD_diablerize.500.option.b:0 "太冒险了，我要放弃这个计谋。"
 POD_diablerize.510.t:0 "撤退"
 POD_diablerize.510.desc:0 "[attacker.GetFirstName]不会实施这次攻击并会撤退。"
 POD_diablerize.510.option.a:0 "终于解脱了"
 POD_diablerize.515.t:0 "吸榨：对于胜者，有奖！"
 POD_diablerize.515.desc.success:0 "该战斗残酷而又迅速。我获得了胜利而[defender.GetFirstName]倒在了我的脚下。"
 POD_diablerize.515.desc.failure:0 "我本以为我准备好了，但[defender.GetFirstName]的战斗能力远远超过了我。我被打败了。"
 POD_diablerize.515.option.a.success:0 "现在该怎么处理我的战利品呢？"
 POD_diablerize.515.option.a.failure:0 "我将陷入[torpor|E]，不知我的命运将会怎样。"
 POD_diablerize.525.t:0 "战斗！"
 POD_diablerize.525.desc.success:0 "[attacker.GetFirstName]的战斗能力远远超过了我。我被打败了。"
 POD_diablerize.525.desc.failure:0 "该战斗残酷而又迅速。我获得了胜利而[attacker.GetFirstName]倒在了我的脚下。"
 POD_diablerize.525.option.a.failure:0 "消灭[attacker.GetFirstName]。这是[attacker.GetHerHim]的终焉之死。"
 POD_diablerize.525.option.b.failure:0 "[attacker.GetSheHe]现在是我的囚犯了。"
 POD_diablerize.525.option.c.failure:0 "我将离开，胜利已经足够甜美。"
 POD_diablerize.525.option.d.failure:0 "我会得到[attacker.GetHerHis]的心头血！"
 POD_diablerize.525.option.e.success:0 "我将陷入[torpor|E]，不知我的命运将会怎样。"
 POD_diablerize.550.t:0 "吸榨：失败"
 POD_diablerize.550.desc.destruction:0 "我被[defender.GetFirstName]消灭了。"
 POD_diablerize.550.desc.imprisonment:0 "我被[defender.GetFirstName]囚禁了。"
 POD_diablerize.550.desc.release:0 "[defender.GetFirstName]让我走了。我不懂……"
 POD_diablerize.550.desc.diablerie:0 "[defender.GetFirstName]的尖牙咬入我的皮肉。[defender.GetSheHe]吸走了我所有的血。我原以为我是猎人，但我却是猎物。"
 POD_diablerize.550.option.a:0 "就这样告一段落了。"
 POD_diablerize.600.t:0 "吸榨！"
 POD_diablerize.600.desc:0 "不仅杀死而且还吞噬另一个存在的灵魂是最令人发指的行为之一。大多数血族认为这是最恶劣的罪行。然而，没啥比这还能让心兽更渴望。\n\n最终，[victim.GetFirstName]在我掌握之中。我是该将[victim.GetHerHis]的吸到只剩[victim.GetHerHis]的存在的核心？我是该榨取[victim.GetHerHis]的心头血？我还是该将[victim.GetHerHim]抽干抹净？"
 POD_diablerize.600.option.a:0 "吸榨[victim.GetTitledFirstName]的灵魂！"
 POD_diablerize.600.option.a.tt:0 "[victim.GetTitledFirstName]已被消灭！"
 POD_diablerize.600.option.a.tt.beast:0 "#R 好！快干！#!"
 POD_diablerize.600.option.b:0 "不吸榨[victim.GetFirstName]"
 POD_diablerize.600.option.b.tt.beast:0 "#R 别让他们走！[victim.GetSheHe]不配那血！我们配！#!"
 POD_diablerize.650.t:0 "饶命？"
 POD_diablerize.650.desc:0 "我失败了。我确信[attacker.GetFirstName]会毁灭我。奇怪的，[attacker.GetSheHe]只是走开了。"
 POD_diablerize.650.option.a:0 "这是那最后一丝人性吗?"
 POD_diablerize.700.t:0 "不凋花！"
 POD_diablerize.700.option.a:0 "。"
 POD_diablerize.700.desc:0 "吞噬[victim.GetTitledFirstName]的灵魂"
 POD_diablerize.800.t:0 "不从之魂"
 POD_diablerize.800.desc:0 "我感到[unconquered_soul.GetFirstName]进入了我的脑海，正努力着掌握我的身体！我都干了什么？！"
 POD_diablerize.800.option.a:0 "坚持住！我不会被打败的！"
 POD_diablerize.800.option.b:0 "屈服吧，让[unconquered_soul.GetFirstName]来接管。"
 POD_diablerize.4000.t:0 "吸榨计谋失败！"
 POD_diablerize.4000.desc:0 "天有不测风云，我对[defender.GetFirstName]的[diablerize|E]计谋失败了。"
 POD_diablerize.4000.option.a:0 "可恶！总有一晚[defender.GetFirstName]你的血将是我的！"
 POD_diablerize.250.option.a.tt.defender_wins:0 "受攻者逃跑了！"
 POD_diablerize.250.desc:0 "[defender.GetFirstName]逃离了我！我需要尽力追赶，否则这整个计谋就会失败。可恶的懦夫！"
 POD_diablerize.250.option.a:0 "让我们开始追逐吧！"
 POD_diablerize.250.option.b:0 "都这样了也不值得努力。"
 POD_diablerize.250.option.a.tt.attacker_wins:0 "无处可逃……"
 POD_diablerize.250.option.b.tt.beast:0 "#R 别让跑了！血在呼唤！#!"
 POD_diablerize.250.option.a.toast:0 "逃离！"
 POD_diablerize.1000.t:0 "吸榨：决斗"
 POD_diablerize.1000.desc:0 "没更多把戏了，是时候一劳永逸地结束这一切了。你们中只有一个人可以从这里走出去。\n你们中的一个人寻求力量，而另一个人寻求保护其的灵魂，但在黑暗世界里，没有崇高的功业。最强的，或更狡猾的，将获胜。"
 POD_diablerize.1000.option.a:0 "现在没有回头路了。"
 POD_diablerize.601.t:0 "吸榨：胜利！"
 POD_diablerize.601.desc:0 "你打败了试图吞噬你灵魂的愚蠢吸血鬼。相应惩罚必须与这一未遂行为的严重性相符。"
 POD_diablerize.601.option.a:0 "我将慈悲的赐予你迅速一死。"
 POD_diablerize.251.t:0 "吸榨：躲藏！"
 POD_diablerize.251.desc:0 "[defender.GetFirstName]试图从我这里逃走！躲在附近的某个地方，或者使用力量来误导我的感官……我需要注意每一个小细节来抓住这个胆小鬼。"
 POD_diablerize.251.option.a:0 "让我们开始追逐吧！"
 POD_diablerize.251.option.b:0 "都这样了也不值得努力。"
 POD_diablerize.251.option.a.tt.attacker_wins:0 "你找到了懦夫！"
 POD_diablerize.251.option.a.success:0 "无处可逃……"
 POD_diablerize.251.option.a.desc:0 "猫和老鼠"
 POD_diablerize.251.option.a.failure:0 "消失无踪……"
 POD_diablerize.251.option.a.tt.defender_wins:0 "受攻者逃跑了！"
 POD_diablerize.252.t:0 "吸榨：魅惑！"
 POD_diablerize.252.desc:0 "[defender.GetFirstName]试图使用[defender.GetHerHis]强大的威仪术来魅惑我！我必须抵抗，否则我将陷入无力。我必须理智地对抗这致命的、感性的、完美的诱惑……我该么？\n#R 想想美味的血，你这傻瓜，其他啥的都不重要！#!"
 POD_diablerize.252.option.a:0 "我的意志属于我！"
 POD_diablerize.252.option.a.tt.attacker_wins:0 "是时候结束这一切了！"
 POD_diablerize.252.option.a.success:0 "你失败了！"
 POD_diablerize.252.option.a.desc:0 "抵抗完美。"
 POD_diablerize.252.option.a.failure:0 "如此美丽……"
 POD_diablerize.252.option.a.tt.defender_wins:0 "为何抵抗？"
 POD_diablerize.253.t:0 "吸榨：自欺！"
 POD_diablerize.253.desc:0 "[defender.GetFirstName]试图使用[defender.GetHerHis]强大的支配术能力来控制我！我必须反抗，否则我将陷入无力。我必须调动我所有的意志力来抵制这种对我思想的入侵。我不敢想象如果我输了会发生什么……\n#R 抵抗啊你这蠢货！长个精神尖刺！#!"
 POD_diablerize.253.option.a:0 "我的意志属于我！"
 POD_diablerize.253.option.a.tt.attacker_wins:0 "是时候结束这一切了！"
 POD_diablerize.253.option.a.success:0 "你失败了！"
 POD_diablerize.253.option.a.desc:0 "意志的碾压"
 POD_diablerize.253.option.a.failure:0 "我此生的意义就是服侍。"
 POD_diablerize.253.option.a.tt.defender_wins:0 "尊有何愿？"
 POD_diablerize.254.t:0 "吸榨：变形！"
 POD_diablerize.254.desc:0 "[defender.GetFirstName]试图从我手中逃脱！利用[defender.GetHerHis]相当大的变形能力，到目前为止，[defender.GetSheHe]已经成功地多次避开了我。我将不得不利用环境，巧妙地找到一个方法，将这个胆小鬼逼到墙角。"
 POD_diablerize.254.option.a:0 "我会抓到你！"
 POD_diablerize.254.option.b:0 "都这样了也不值得努力。"
 POD_diablerize.254.option.a.tt.attacker_wins:0 "你抓住了你的猎物！"
 POD_diablerize.254.option.a.success:0 "抓到你了！"
 POD_diablerize.254.option.a.desc:0 "滑溜的餐点"
 POD_diablerize.254.option.a.failure:0 "消失无踪……"
 POD_diablerize.254.option.a.tt.defender_wins:0 "受攻者逃跑了！"
 POD_diablerize.254.option.a.toast:0 "逃离！"
 POD_diablerize.200.option.g:0 "放出猎犬！"
 POD_diablerize.200.option.g.tt.beast:0 "#R 零嘴时间到孩子们#!"
 POD_diablerize.200.option.g.tt:0 "一次军事能力对抗检定会决定是[attacker.GetFirstName]还是你赢得搏斗。"
 POD_diablerize.255.t:0 "吸榨：兽性术！"
 POD_diablerize.255.desc:0 "[defender.GetFirstName]并不孤单。一群凶猛的野兽正朝我走来，试图保护它们的主人。如果我想接近我的猎物，我就必须从他们中间杀出一条路来。"
 POD_diablerize.255.option.a:0 "别档我道！"
 POD_diablerize.255.option.b:0 "……快跑！"
 POD_diablerize.255.option.a.tt.attacker_wins:0 "你抓住了你的猎物！"
 POD_diablerize.255.option.a.success:0 "你再也没有毛绒朋友了！"
 POD_diablerize.255.option.a.desc:0 "滑溜的餐点"
 POD_diablerize.255.option.a.failure:0 "离我远点！"
 POD_diablerize.255.option.a.tt.defender_wins:0 "拦下它们！拦下！"
 POD_diablerize.255.option.b.tt.beast:0 "#R 懦夫！留下来战啊！#!"
 POD_diablerize.200.option.h:0 "活烧它们！"
 POD_diablerize.200.option.h.tt.beast:0 "#R 火！烧它们，别咱们！#!"
 POD_diablerize.200.option.h.tt:0 "一次学识能力对抗检定会决定是[attacker.GetFirstName]还是你赢得搏斗。"
 POD_diablerize.256.t:0 "吸榨：血魔术！"
 POD_diablerize.256.desc:0 "[defender.GetFirstName]并非毫无准备。一系列的仪式和强大的法术保护着这个藏身处，我将不得不非常小心，以免踩到一些陷阱……这可能会变得很不妙。"
 POD_diablerize.256.option.a:0 "我会做的！"
 POD_diablerize.256.option.b:0 "……快跑！"
 POD_diablerize.256.option.a.tt.attacker_wins:0 "你抓住了你的猎物！"
 POD_diablerize.256.option.a.success:0 "现在就剩你和我了！"
 POD_diablerize.256.option.a.desc:0 "陷阱众多"
 POD_diablerize.256.option.a.failure:0 "这是……？"
 POD_diablerize.256.option.a.tt.defender_wins:0 "#R 好烫！#!"
 POD_diablerize.256.option.b.tt.beast:0 "#R 懦夫！滚进来！#!"
 POD_diablerize.810.t:0 "不从之魂的征兆"
 POD_diablerize.810.desc:0 "你的一位仆人指出，你平日的小动作有所变化，这对你的同类来说并不经常发生。这让你想起了关于[diablerie|E]的可怕后果及其对你灵魂的潜在伤害的传言。\n会不会是最近的受害者正试图反噬？这的确是一个令人担忧的可能性……"
 POD_diablerize.810.option.a:0 "这非常非常不对……"
 POD_diablerize.600.option.c:0 "就单单杀了其，吸榨太危险了。"
 POD_diablerize.600.option.c.tt.beast:0 "普通的常规谋杀，这选项让你的灵魂不受风险。但也没有力量的增长。"