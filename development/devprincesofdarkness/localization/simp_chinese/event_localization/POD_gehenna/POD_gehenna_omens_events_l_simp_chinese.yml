l_simp_chinese:
 POD_gehenna_omens.1231.notification:0 "火焚末日之预兆"
 POD_gehenna_omens.1231.desc:0 "双头奶牛已诞生。"
 POD_gehenna_omens_1231_notification_tooltip:0 "双头奶牛已诞生。"
 POD_gehenna_omens.1240.t:0 "火焚末日之预兆"
 POD_gehenna_omens.1240.opening:0 "来自俄罗斯的消息:"
 POD_gehenna_omens.1240.desc:0 "银牙的双狼尤里·塔里维奇与索菲娅·塔里维奇带领着一对狼人对抗俄罗斯的残忍者戈里尼奇·沙卡拉，其队伍还包括其他五位银牙族人：亚美尼亚的乔治、鲍里斯、福马、瓦西里和乌尔特拉。此外追随他们的还有：彼得，来自玻璃行者；乌卢，来自星占；亦果瓦·克霍夫，来自啮骨者；穆罕默德，来自寂静漫游者；凯佳，来自黑怒；以及芬里尔传人的英雄拉格纳。乌尔特拉、拉格纳、鲍里斯和凯佳都在战斗中牺牲了，如同索菲娅，而尤里在给予沙卡拉最后一击的时候跟其同归于尽。"
 POD_gehenna_omens.1240.a:0 "戈里尼奇被激怒了！"
 POD_gehenna_omens.1240.a.tt.beast:0 "#R 愤怒解决一切！"
 POD_gehenna_omens.1241.t:0 "火焚末日之预兆"
 POD_gehenna_omens.1241.opening:0 "来自俄罗斯的消息:"
 POD_gehenna_omens.1241.desc:0 "蒙古汗帐像洪水一样从大草原上涌来，横扫了俄罗斯的土地，它的凡人国王们在一场暴力的洪流中被淹没。但更令人不安的是据说有一群狼人混在人类大潮中。这个狼人部落称自己为影爵，并在他们身后留下了血畜与血族的尸体。月兽的暴行是否预示着火焚末日的到来？"
 POD_gehenna_omens.1241.a:0 "那些蒙古人和他们的狗将会前进到哪！？"
 POD_gehenna_omens.1242.t:0 "火焚末日：伊希姆·乌尔·巴尔苏醒！"
 POD_gehenna_omens.1242.desc:0 "在上古时代，[enkara.GetFirstName]的尊长，[izhim.GetFirstName]被深缚恶魔纳姆塔尔的巨手所吸收，消失在了她的眼前。在他的低语召唤下，[enkara.GetFirstName]来到[izhim.GetFirstName]跟前，给他喂血。伊希姆深深地汲取着恩卡拉，每吸一口，他就越来越多地从液体石头中浮来，直到最后，他把她推到恶魔的手中，取代他的位置。对恩卡拉解释道，她是唯一值得当纳姆塔尔的祭品的存在。她是他唯一真正爱的人，他现在已经准备好与纳姆塔尔签订契约，献祭他唯一的真爱，以不再受折磨，并最终释放哈基姆圣裔身上的饥渴诅咒的全部潜力。现在他自称三重受诅，他又一次获得了自由！"
 POD_gehenna_omens.1242.a:0 "哈基姆圣裔什么时候才会填满他们的饥渴？"
 POD_gehenna_omens.1242.a.tt:0 "有些可怕的事情发生了。"
 POD_gehenna_omens.1242.a.tt.beast:0 "#R 亦或是某些好事！ #"
 POD_cult_of_izhim_ur_baal:0 "伊希姆·乌尔·巴尔的密教"
 POD_gehenna_omens.1244.t:0 "火焚末日：厄喀德那的预言结局！"
 POD_gehenna_omens.1244.desc:0 "很久以前，[scylla.GetHouse.GetBaseName]预言了[last_of_the_glycon.GetHouse.GetBaseName]的毁灭以及他们自己的灭亡。为了规避预言，勇者们徒劳地毁灭了巫师们。最后一位格里肯，[last_of_the_glycon.GetFirstName]，杀死了厄喀德那的子嗣。当[scylla.GetFirstName]被碾成尘土时，她恸哭着说出了最后一条预言：“尼罗河的蛇，必在奴隶的脚下挣扎。”\n\n有传言说厄喀德那巫师还存在着。"
 POD_gehenna_omens.1244.a:0 "诱使战士加入我的宫廷。"
 POD_gehenna_omens.1244.a_success_glycon_1:0 "[last_of_the_glycon.GetFirstName]加入你的宫廷。"
 POD_gehenna_omens.1244.a.tt.beast:0 "#R 不，他渴望我们的血！我们很清楚这种饥渴！#"
 POD_gehenna_omens.1244.b:0 "为巫师提供庇护"
 POD_gehenna_omens.1244.b_success_witch_1:0 "[witch_of_echidna_1.GetFirstName]加入了你的宫廷。"
 POD_gehenna_omens.1244.b_success_witch_2:0 "[witch_of_echidna_2.GetFirstName]加入了你的宫廷。"
 POD_gehenna_omens.1244.b_success_witch_3:0 "[witch_of_echidna_3.GetFirstName]加入了你的宫廷。"
 POD_gehenna_omens.1244.b.tt.beast:0 "#R 好！引诱他们来这并取走他们的血！#"
 POD_gehenna_omens.1244.c:0 "预言实现了！最后的提丰派与我无关。"
 POD_gehenna_omens.1244.c.tt.beast:0 "#R 终于解脱了！我们不会为这些注定要失败的密教徒们流任何眼泪。#"
 POD_gehenna_omens.1251.notification:0 "火焚末日之预兆：第二次吕贝克大火"
 POD_gehenna_omens.1251.desc:0 "吕贝克市遭受了第二次大火灾。它的许多木制建筑变成了灰烬。\n\n也许他们应该试着用石头盖房子?"
 POD_gehenna_omens.1252.notification:0 "火焚末日之预兆：暗影裁判所"
 POD_gehenna_omens.1252.desc:0 "天主教教会的暗影裁判所发现并消灭了一位梵卓吸血鬼。\n\n即使他只有这么小的年纪，也过于傲慢了。"
 POD_gehenna_omens.1253.notification:0 "火焚末日之预兆：乌特勒支之火"
 POD_gehenna_omens.1253.desc:0 "一场大火在荷兰的乌得勒支市肆虐了九个晚上，摧毁了城市的大部分地区。\n\n是暗影裁判所为了净化血族而烧毁了城市吗？"
 POD_gehenna_omens.1257.notification:0 "火焚末日之预兆：撒玛拉斯喷发"
 POD_gehenna_omens.1257.desc:0 "在遥远的东方龙目岛上，撒玛拉斯山已经爆发了！就像之前的庞贝一样，帕玛坦城已经被彻底摧毁。在200多英里之外的爪哇有火山灰落下。烟柱蒙蔽了太阳。"
 POD_gehenna_omens.1258.notification:0 "火焚末日之预兆：巴格达洗劫"
 POD_gehenna_omens.1258.desc:0 "蒙古的伊尔汗国洗劫了伟大的城市巴格达。这座城市现已人烟稀少，满目疮痍。智慧宫被毁坏。底格里斯河因血而红，因毁书而黑。随着穆斯台绥木的死亡，阿拔斯哈里发王朝也随之灭亡。"
 POD_gehenna_omens.1259.notification:0 "火焚末日之预兆：阿瓦隆极冬"
 POD_gehenna_omens.1259.desc:0 "它开始于神秘的干雾和持续的云。北方的冬天尤其严酷。饥荒已经蔓延到北部地区，而英格兰受到的打击尤其严重。伦敦饿死了两万多人。这是即将到来的永恒的妖精之冬吗？"
 POD_gehenna_omens.1268.notification:0 "火焚末日之预兆：西里西亚地震"
 POD_gehenna_omens.1268.desc:0 "整个大地都震动了，给阿达纳城带来了毁灭。六万多人被压死。所有的建筑物都倒塌了。"
 POD_gehenna_omens.1271.notification:0 "火焚末日之预兆：第三次吕贝克大火"
 POD_gehenna_omens.1271.desc:0 "第三次大火灾只烧毁了吕贝克市的一部分。果然石头建筑比木头建筑好得多。"
 POD_gehenna_omens.1287.t:0 "火焚末日：露西亚洪水的余波"
 POD_gehenna_omens.1287.desc:0 "在圣露西亚日之晚，一场巨大的风暴淹没了弗里西亚海岸。八万人被冲走淹死。数以百计的村庄随之消失。在这北方的冬至，该洪水和大规模死亡发生在一个最不祥的时刻，此时生者和死者之间的屏障是最薄的。有几个血族先知已经出现在混乱中，意图实现所预。奇怪的是，她们都叫露西。"
 POD_gehenna_omens.1287.a:0 "自然灾害自然发生，并不遵循旧神或新神的旨意。"
 POD_gehenna_omens.1287.a.tt:0 "那些记得的人说，这次洪水比1212年在诺德荷兰的北海大洪水还要严重。挪威荷兰的洪水持续了六个月，但圣露西亚日的灾难是在一夜之间发生的。这是欧洲历史上最严重的洪水。形成了一片新的海洋，被称为「须德海」。"
 POD_gehenna_omens.1287.a.tt.malk:0 "#MALKBLUE 这~剧~本~的~范~围~大~概~在~三~到~十~七~之~间~！#"
 POD_gehenna_omens.1287.b:0 "露西亚已回来带来救赎或毁灭。而我将被救赎！"
 POD_gehenna_omens.1287.b.tt:0 "公元4世纪时，圣露西亚把食物带给了藏在罗马地下墓穴里的基督徒，但我们这些不死族对那里发生的事情却另有看法。露西亚神奇地治好了的来自她的祈祷者的病。随后露西亚拒绝嫁给一个她订婚的原始教徒。原始教徒们试图将她烧死在火刑柱上，但失败了。他们用矛刺穿她的喉咙，但她没有停止说话。他们挖出了她的眼睛，但却又奇迹般地恢复了。直到一位牧师赋予她作为基督徒的最后权利，她才死去。\n\n她的遗体在西西里静静地躺了400年。然后，这些文物被转移到君士坦丁堡，以避免撒拉森人的入侵者。然后她的尸体在1204年君士坦丁堡洗劫期间消失了，米迦勒的幻梦也随之陷毁。\n\n为什么上帝回用旧约的方式，在圣露西亚的圣夜用史诗般的洪水来惩罚弗里西亚的恶人？这些灵魂中的许多人接受了「渔民」的信仰，并寻求到「远岸」的乐园的路线。圣露西亚号召我们回到天国之路上。"
 POD_gehenna_omens.1287.b.tt.malk:0 "#MALKBLUE 热~十~字~面~包~！热~十~字~面~包~！一~便~士~一~个~，一~便~士~两~个~，热~十~字~面~包~！如~果~你~没~有~女~儿~，那~就~给~你~的~儿~子~。一~便~士~一~个~，一~便~士~两~个~，热~十~字~面~包~！#"
 POD_gehenna_omens.1287.c:0 "路西夜行队又出发了！我要准备好马加入她！"
 POD_gehenna_omens.1287.c.tt:0 "北欧人对这个可怕的夜晚有另一个名字，「路西之夜」。路西是一种邪恶的女性超自然生物，据说她和她的追随者路西夜行队一起在空中飞行。在那个漫长的黑夜里，巨魔、邪恶灵类和亡者会成群结队地出现，去捕食那些粗心大意的人类。孩子是他们最喜欢的食物，会直接将其拉出家门。北欧人整夜不睡，以保护他们的家人。现在由于这场灾难，许多北欧人都死了。那些遵守旧道的人们的命运将是在尼福尔海姆为海拉服务，他们的灵魂将在那里为诸神黄昏而建造她的舰队。"
 POD_gehenna_omens.1287.c.tt.malk:0 "#MALKBLUE 我~的~长~矛~和~魔~盔~！你~的~长~矛~和~魔~盔~？长~矛~和~魔~盔~！魔~盔？魔~盔~！魔盔……耶啊！魔~盔~与~我~将~会~给~你~一~条~例~子~！#"
 POD_gehenna_omens.1287.d:0 "爱丽娜是莉莉丝的化身之一，见证她的辉煌！"
 POD_gehenna_omens.1287.d.tt:0 "露西来自拉丁语「lux」既光明使者。她的希腊名为爱丽娜。露西亚、路西、路西法或爱丽娜——全部只是神圣的莉莉丝的现身。随着莉莉丝的魔法创造了这洪水来嘲弄德谬哥，莉莉丝的女祭司已前来宣称她们被诅咒的灵魂。拉米亚回应了这召唤与这个世界和暗影之地作战。"
 POD_gehenna_omens.1287.d.tt.malk:0 "#MALKBLUE 不~许~取~笑~莉~莉~！哈哈！好吧。也~许~一~小~笑~……哗！呃啊！咕噗！#"
 POD_gehenna_omens.1287.e:0 "弗里西亚将由亲王和法律统治，而非已死之神的密教徒。"
 POD_gehenna_omens.1287.e.tt.malk:0 "#MALKBLUE 每~个~宫~廷~都~需~要~宫~廷~小~丑~！#"
 POD_gehenna_omens.1287.f:0 "不管是否神秘，这对我来说都无关紧要。我走自己的路。"
 POD_gehenna_omens.1287.f.tt.malk:0 "#MALKBLUE 划~，划~，划~你~的~船~，呼~救~随~着~不~再~响~ #"
 POD_gehenna_omens.1260.notification:0 "火焚末日之预兆：拜伯尔斯屠杀"
 POD_gehenna_omens.1260.desc:0 "在埃及，马穆鲁克苏丹开始了对非穆斯林超自然者的无情清洗。而蛇正藏在洞里。"
 POD_gehenna_omens.1287.e.tt:0 "弗里西亚将由亲王和法律统治，而非已死之神的密教徒。"