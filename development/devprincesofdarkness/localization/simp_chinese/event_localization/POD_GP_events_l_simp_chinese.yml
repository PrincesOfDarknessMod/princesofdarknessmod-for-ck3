l_simp_chinese:
 podgreatpersons.0001.t:0 "阿不都·拉提甫·巴格达迪"
 podgreatpersons.0001.desc:0 "作为著名的历史学家和哲学家，阿卜杜-拉蒂夫-巴格达迪在中东地区广泛旅行多年后，最近搬回了巴格达。他的著作和对人类灵魂、心灵和身体的认识已经被人们奉为圭臬，甚至连萨拉丁本人也给予他赞助。随着年龄的增长，他越来越隐蔽，这很可能是你唯一的机会为自己获得这样一个优秀的后嗣。"
 podgreatpersons.0001.a:0 "金钱无关紧要。"
 podgreatpersons.0001.b:0 "是时候拉点关系了。"
 podgreatpersons.0001.c:0 "没有其他竞争者我们会更好。"
 podgreatpersons.0001.d:0 "带过来就是了！"
 podgreatpersons.0001.custom:0 "这位伟人会加入你的宫廷，给予你一个进行初拥的间隙。带着这样的人物会增加你潜藏的曝露度。"
 podgreatpersons.0001.customb:0 "该伟人会一直在周边徘徊直到被死亡召唤。"
 podgreatpersons.0002.t:0 "爱丽丝·吉蒂勒"
 podgreatpersons.0002.desc:0 "你听闻到了一则不寻常的故事：最近一个名叫爱丽丝·吉蒂勒的狡猾的凡人逃脱了审判，她被指控的罪名有行巫术、异端、献祭动物以及和一个疑似名为“罗宾”的恶魔交媾。所有与她有关的人要么已经被除以火刑了，要么就是即将被处决，但是她仍然多次挫败了教会捉捕她的企图，因而她的能力不容否认。你的一个探子告知你，她已经流亡到你领地的附近，你开始思索你是否愿意将一位野心勃勃而又睿智的女巫当作你的后嗣……"
 podgreatpersons.0003.t:0 "贾拉勒丁·穆罕默德·鲁米"
 podgreatpersons.0003.desc:0 "鲁米作为一名杰出的教法学家和神学家而广为人知，但使他更为出名的是他的加扎勒，即波斯诗歌。鲁米是一个广受人喜爱的男人，即使在穆斯林社群之外也是这样，他最近还完成了他的杰作——玛斯纳维。据信，他已经病入膏肓，并且他已经预见了他自己的死亡。你有一个小渠道去初拥他，以资助他完成他未尽的著作，或者说……使他创作更多和该隐之子相关的作品。"
 podgreatpersons.0004.t:0 "艾格尼丝·兰道夫"
 podgreatpersons.0004.desc:0 "随着凡人的苏格兰独立战争的激烈战火持续不断，艾格尼丝·邓巴尔这个名字开始引起你的注意。这位凶悍的苏格兰女人以任何凡人都无法比肩的坚韧意志，守住了她那座无人领导的城堡。这座城堡的这名女士用她巧妙的诡计和敏捷的智慧，将英格兰两万大军玩弄于股掌之上，这使得她勇名大振。她现在陷入了无爱的婚姻中，几乎没有继承任何东西的期望，你或许可以说服这样一名勇敢的女人将她出色的技巧为你所用，或许甚至还能使其成为你的后嗣……"
 podgreatpersons.0005.t:0 "艾格尼丝·索蕾"
 podgreatpersons.0005.desc:0 "你刚得知法兰西的凡人国王路易九世正试图毒杀王室情妇阿涅丝·索雷尔。这名声名不佳的女士一直对国王有强大的影响力，现在有关她美貌的传言已经在你的宫廷内传开了。如果你不快速行动的话，法兰西将会失去其最美丽的一朵鲜花。如果你行动的话……那么，也许你可以确保这朵鲜花永远不会凋零。"
 podgreatpersons.0006.t:0 "亚历山大·涅夫斯基？"
 podgreatpersons.0006.desc:0 "令人惊讶的是，你听说一个自称是亚历山大·涅夫斯基的人最近出现在附近的一个小镇上。这不太可能，因为大名鼎鼎的弗拉基米尔大亲王目前正在金帐汗帐执行外交任务。这个人声称已经了解该隐之子社会，并希望被「以自己接受的初拥方式」来获得永生，而不是被奴役。你对这个故事有疑问，但是你能让一位可能的对手初拥罗斯的英雄，德意志和瑞典之敌么？至少，你可以让他到你的宫廷来，并按自己心意决定……"
 podgreatpersons.0007.t:0 "帕多瓦的安多尼？"
 podgreatpersons.0007.desc:0 "你们的一个派员报告说有一位自称是著名圣人帕多瓦的安多尼的人在附近的城镇被发现。这不太可能，因为你很确定真正的安东尼去年去世了，并且被罗马封为圣徒。真正的方济各会修道士是一个在世圣人，他的灵光能够从几英里外燃烧你的同类。仍然……也许这是值得探查的。他可能是他的一个活着的同伴，也可能是一个有学问的人，值得考虑收为子嗣。"
 podgreatpersons.0008.t:0 "安东尼奥·德·内布里哈"
 podgreatpersons.0008.desc:0 "作为那个时代最伟大的人文主义者之一，安东尼奥·德·内布里哈写了很多书，你的宫廷经常引用。你不是特别热衷于该关于凡人的「人文主义」思潮，但你不能否认这个人的才华。他的寿命正要耗尽，你想知道现在是不是合适的时候让他进入你的宫廷。也许让自己有一个有「现代思想」的子嗣可能会有好处。"
 podgreatpersons.0009.t:0 "巴巴·伊沙克·卡法尔苏尔迪"
 podgreatpersons.0009.desc:0 "一位凡人最近在安纳托利亚东北部制造了相当大的骚动。该伊沙克宣称自己是脱凡的弥赛亚，他聚集了许多追随者，甚至领导了反对塞尔柱苏丹的公开叛乱。正如通常的凡人，这是一场短命的尝试，这位自称「脱凡」的将很快被行刑。你认为这个男人并不缺乏魅力和动力。也许有了合适的老师，他可以成为一个有趣的子嗣……"
 podgreatpersons.0010.t:0 "贝亚特里斯·达·席尔瓦？"
 podgreatpersons.0010.desc:0 "托莱多宫殿的圣母无染原罪修会发生了一些事情。报告写的很模糊，但你的派员声称他们终于接近了该地方，哪怕其周围有着真信灵光。他们跟踪了似乎遭到不明势力袭击的幸存者，并认为他们很好地处理了事件后修会创始人贝亚特里斯·达·席尔瓦的位置。这似乎有些鞭长莫及，尤其是因为贝亚特里斯对该隐之子来说太神圣而无法接近，但这仍然是一个机会。你可以找到这个女人，把她带到你身边。她可能会有用……"
 podgreatpersons.0011.t:0 "彼济达·比格尔之女？"
 podgreatpersons.0011.desc:0 "知晓着你的名声，一位自称彼济达·比格尔之女的年轻女人找到了你的一位代理人，要求「摆脱教会的束缚」。你的手下说这位女人和我们所知道的那个即将在瑞典建立新骑士团的女圣人有相似之处，但是年龄不匹配。稍微挖掘一下，你就可以有把握地说她是她的一位女儿，塞西莉亚，她在很小的时候被她圣洁的母亲强行困在修道院里。虽然塞西莉亚的价值不如彼济达本人，但她看起来仍然是一个有潜力、有用、又有决心的年轻女性。一位值得初拥的人？"
 podgreatpersons.0012.t:0 "锡耶纳的加大利纳？"
 podgreatpersons.0012.desc:0 "你听说过锡耶纳的加大利纳，一个年轻圣洁的女人，她自以行世的天主之力而闻名，也许是目前罗马教会的最热心活跃的倡导者，即使双方有时看起来有分歧。因此，当另一位女人最近出现，声称是加大利纳的姐姐博纳文图拉时，你很惊讶。看来她是用一些不该说的方法存活下来的，现在她希望从历史中消失，因为她的「死亡」对加大利纳来说是一个深刻的教训。这是一个不寻常的要求，因为这个女人似乎仍然对天主和她的妹妹非常虔诚，但还不足让其牺牲自己的生命。你在考虑你的下一步行动。"
 podgreatpersons.0013.t:0 "亚西西的嘉勒？"
 podgreatpersons.0013.desc:0 "你的一位小对手对圣达勉教堂，亚西西的圣嘉勒和她的修女们居住的地方，采取了大胆的行动。很明显，这位傻瓜和他的伙伴们没有活下来，真信渗透了这个地区，但他们任设法引起了相当大的骚乱。据说嘉勒的一位修女，碧翠丝，在袭击中「失踪」了。虽然你无法与虔诚又充满美德的嘉勒本人抗衡，但初拥她的修女会对教会造成道德上的打击……"
 podgreatpersons.0014.t:0 "切萨雷·波吉亚"
 podgreatpersons.0014.desc:0 "无情的意大利人切萨雷·波吉亚，目前正在比亚纳面临艰难的围城。到目前为止，这个人已经证明了自己非常足智多谋，在意大利的战役中，他的名字出现在许多胜战之中，同时也遭到了许多背叛。随着他父亲劳得力的去世和充满敌意的新教宗的上位，他开始被众多的敌人逼得走投无路。如果你希望自己有个有声望的子嗣，现在是采取行动的最好时机。毕竟，围城期间任何事情都可能发生。"
 podgreatpersons.0015.t:0 "克里斯蒂娜·德·皮桑"
 podgreatpersons.0015.desc:0 "法兰西宫廷几十年来司空见惯的一幕，著名作家兼教师克里斯蒂娜·德·皮桑最近搬到了一所女修道院来度过她生命中的最后几年。她的作品在很多圈子里都得到了高度赞扬，包括该隐之子，因为它们详细阐述了统治地位的真正定义、对未来的乐观看法以及女性在法兰西历史上的地位。她的身体可能正在变弱，但她的思维似乎一如既往地敏锐，因为她最近发表了一首关于圣女贞德命运的诗。你的一些廷臣想让她成为该隐之子社会的一员。只为了保护她的才能，这是肯定的。"
 podgreatpersons.0016.t:0 "柯拉·迪·里恩佐"
 podgreatpersons.0016.desc:0 "最近，凡人的罗马的喧嚣比往常更大。主要的原因是一位柯拉·迪·里恩佐，一位靠个人魅力成为城市领袖的平民……而且成了两次。他梦想建立一个新的罗马帝国，其显然是被自己的宏伟妄想所迷惑。但当涉及到战争的时候，这个男人却反而很弱，很容易被打到。你的派员怀疑他是真的有天赋还只是运气太好。事实是罗马的暴民们现在显然开始反对他了，这是你初拥一个不太讨喜，但可能有用的子嗣的机会。"
 podgreatpersons.0017.t:0 "但丁·阿利吉耶里"
 podgreatpersons.0017.desc:0 "尽管你的宫廷和同伴不理解这一点，但你非常喜欢最近出版的一部名为「神曲」的史诗。它有着……能深入到你的灵魂深处的东西，尤其是在你这种情况下，仿佛作者比凡人更了解上帝与恶魔。这个叫但丁·阿利吉耶里的人，现在运气很差，被他的大多数政治盟友放逐和抛弃。如果他遇到了不幸的事故，也不会有人介意。随后，你就可以把他带到你的宫廷，得到你想要的答案。毕竟，一位永生的生命也该有足够的时间去理解神性。"
 podgreatpersons.0018.t:0 "黛安·德·普瓦捷"
 podgreatpersons.0018.desc:0 "黛安·德·普瓦捷在近二十五年来一直是法兰西王权背后的真正力量。据你所知，她并没有通过密谋或谋杀来达到这个位置……这将使她成为一个完美的初拥候选人。在法兰西，如果没有精明的才智和良好的政治判断力，是不可能拥有如此强大的权力的，而这两点正是王室最受欢迎的人物所具备的。随着亨利二世的去世，她的主要竞争对手凯瑟琳·德·美第奇迁入，剥夺了国王给予她的所有权力和资产。黛安似乎并没有打算报复，而且似乎接受了自己化作路人的命运。现在正是为你找一位首席顾问的好时机……"
 podgreatpersons.0019.t:0 "长腿爱德华？"
 podgreatpersons.0019.desc:0 "英格兰的前任国王，爱德华一世，四年前去世了。你饶有兴趣地追踪他的生活，因为他是一位著名的立法者、精明的政治家和有能力的将军，所有这些品质都是该隐之子社会所珍视的……当然还要一丝恐惧和残忍，也是这位已故国王所具有的品质。要想初拥他是不可能的，因为他受到教会代理人的保护，就像所有国王一样，但你最近听说，他最信赖的伙伴，莱西的亨利，有迹象表明他要离开人世了。作为一个忠诚而有能力的人，他曾很好地见证过长腿的战术，甚至可以成为一位初拥候选人。"
 podgreatpersons.0020.t:0 "伊丽莎白·巴托里"
 podgreatpersons.0020.desc:0 "你的一位派员带着一份令人不安的报告从恰赫季采城堡回来了，似乎伊丽莎白·巴托里，那个被控六百多起谋杀，沐浴在处女的血并食用的女人，实际上并不是一位吸血鬼……目前而言。对于她的审判是残酷无情的，听到关于她的酷刑的详细描述甚至会让那些最坚韧的该隐之子感到不安，其包括焚烧、冷冻、使用活蚂蚁或掏空内脏。有时所有的这些一起用。但如果她不是吸血鬼……这意味着她能成为优秀的，又可能有点精神错乱的，初拥候选人。"
 podgreatpersons.0021.t:0 "匈牙利的伊丽莎白？"
 podgreatpersons.0021.desc:0 "你的一位小对手最近对柯那德·冯·马尔堡采取了行动。柯那德·冯·马尔堡是一位著名的裁判官，也是最近去世的匈牙利的圣丽莎的前导师。那个傻瓜被粉碎了，但是造成余波很依在，关于「该隐之子阴谋」的线索越来越多。其中一位是一个年轻的女人，她是裁判官的另一个学生，她亲眼目睹了该隐之赠。让她消失可能会引起怀疑，但她能是有用的，无论是用来打击裁判所，还是作为一个潜在的候选人。奇怪的是，这个女人也跟圣人一样叫伊丽莎白，且似乎很接近圣人此时的年龄。也许柯那德自己也有秘密……"
 podgreatpersons.0022.t:0 "恩斯特·冯·曼斯费尔德"
 podgreatpersons.0022.desc:0 "你的派员报告说恩斯特·冯·曼斯费尔德，臭名昭著的雇佣兵头目目前在波斯尼亚，并处于绝症状态。这个诡计多端的德意志人已经为自己赢得了一个技术娴熟的名声，一个即使不是很可靠，但也值得雇佣的人。他因在三十年战争中支持新教徒而闻名……尽管他自认为是虔诚的天主教徒。他有优秀的军事血统和……开放的思想，他可以成为一位有价值的初拥候选人。"
 podgreatpersons.0023.t:0 "尤斯塔斯·付维尔"
 podgreatpersons.0023.desc:0 "所谓的「付维尔」帮派几十年来一直是英格兰谈论的话题。这些绿林好汉可能比暴徒强不了多少，他们有足够的运气或能力来针对爱德华二世的随从。国王本就受人轻视，更不能让任何人不信尤斯塔斯这帮人不是什么劫富济贫的英雄人物。经过多年的探索，你的派员终于找到了那位年老的绿林好汉。你现在将能够获得一位强力的战士和愚民煽动者。"
 podgreatpersons.0024.t:0 "斐波那契"
 podgreatpersons.0024.desc:0 "凡人正在流行一种新的时尚。「印度-阿拉伯」数字系统开始被使用，在你看来明显优于古老的罗马数字系统。你很确定凡人会在适当的时候恢复理智，但是你对这个理论的支持者很好奇，列奧納多·波那契，也被称为斐波那契。这位老人在发表了他的论文后定居在比萨。你不能否认他的知识，你可以「邀请」他到你的宫廷上进行辩论。或者也许其他……家庭性目的？"
 podgreatpersons.0025.t:0 "弗洛里安·盖尔"
 podgreatpersons.0025.desc:0 "一段时间以来，凡人的农民战争一直是你们的眼中钉，因为农民会在战争中大批死亡，这很浪费食物。不过弗洛里安·盖尔的出现带来了新机会，他是领导「黑佣兵团」的无荣誉贵族，这是一支与农民并肩作战的重骑兵部队。虽然对普通人来说，盖尔已经是一位受欢迎的英雄，但他也冷酷无情，容易发怒，这使他成为了一位在外到处惹麻烦的人。看来，在他们最后一次在英戈尔施塔特战败后，你的派员找到了他的位置。处于败方又被围在死地，盖尔面临死亡只是时间问题。但如果你介入……"
 podgreatpersons.0026.t:0 "加莱亚佐·马里亚·斯福尔扎"
 podgreatpersons.0026.desc:0 "过去的几年里，你一直被加莱亚佐·马里亚·斯福尔扎的故事所娱乐，他是米兰的凡人公爵。作为一个想象力丰富的人，他创造了许多新的折磨方式，包括心理上的和生理上的。你的宫廷特别喜欢「把人钉进他的棺材中」这条。显然，这并没有让他在米兰和其他地方交到很多朋友，有理由认为他很快就会被赶下台，这很可能会是通过暴力实施的。你在考虑是否亲自安排他的死亡，然后把他带回宫廷。至少，他可以成为一位非常活泼的吸血鬼……"
 podgreatpersons.0027.t:0 "杰弗里·乔叟"
 podgreatpersons.0027.desc:0 "你听说著名诗人兼公务员杰弗里·乔叟在遭到匪徒伏击并受了重伤。他不再年轻，他的光辉岁月也随着他的赞助人理查二世的退位而逝去。尽管如此，他还是一位能干的外交家和杰出的诗人，是最早将中世纪英语作为文学工具使用的人之一。这样一位在政治和诗歌方面都有学问的人，使其成为子嗣的话，的确有点意思。"
 podgreatpersons.0028.t:0 "吉尔·德·雷"
 podgreatpersons.0028.desc:0 "圣女贞德的一位同伴吉尔·德·雷最近很堕落。失去了财产和同辈的善意之后，这位贵族似乎求助于更多的……恶魔的赞助。对他的审判是一件肮脏的事情，其证词中的谋杀的残忍程度甚至让大多数该隐之子都感到厌恶。这些指控的真实性很难承认，毕竟，即使是凡人也会通过阴谋互相攻击。吉尔很快就会面临绞刑……除非你介入，用另一个可怜的人代替他。作为一个凡人，吉尔无疑显示出了成为初拥候选人的潜力……"
 podgreatpersons.0029.t:0 "吉罗拉莫·萨佛纳罗拉"
 podgreatpersons.0029.desc:0 "最近，道明会修士萨佛纳罗拉在佛罗伦萨掀起了一场暴动，他通过向善良的人们鼓吹荣耀归于他们和破灭归于敌人的愿景，将执政的美第奇赶下了台。事实证明，这个人很有韧性，他抵制了教会将其逐出教会的企图，甚至安抚了法兰西国王，跟他建立一个伪联盟。然而，他的好运已经在最近耗尽了，因为他搞砸了本来是要向佛罗伦萨人民证明他的神佑的烈火裁判。他现在被一群愤怒的暴民关在监狱里，缺乏任何支持，这位佛罗伦萨一度的实际统治者将很快面临火刑……除非你插手。当然，萨佛纳罗拉有让人们追随他的天赋，而这在该隐之子政治中是一种宝贵的品质。"
 podgreatpersons.0030.t:0 "戈特弗里德·冯·伯利欣根"
 podgreatpersons.0030.desc:0 "雇佣兵头子戈特弗里德·「格茨」·冯·伯利欣根最近成了你们宫廷里的常谈话题。这位暴脾气又满嘴脏话的德意志人以长时间怀恨在心而闻名，更出名的是他在一次围城中失去了一只手臂。这一事并没有阻止「格茨」很久，因为他立即用一种奇怪的铁义体代替它，并回到战场上。在经历了漫长的战争、被俘和受伤之后，这位「铁拳」终于开始显示出岁月不饶人之处，他回到了自己的家族庄园，在宁静中度过了最后的日子。你们的宫廷争辩说，这样一位顽强的和受磨炼的人，对你毫无疑问的正义事业而言，将是一笔大投资，既使你成为夜晚的统治者。"
 podgreatpersons.0031.t:0 "海德维奇"
 podgreatpersons.0031.desc:0 "有消息告诉你一位名叫海德维奇的贵妇人正在经过你的城市。虽然他们的调查并没有透露太多关于她的过去，但你的派员描述她是一位熟练的女诗人和作家，从她的外表看，她经历了很多，但仍然坚持下了去。这种强烈的个性和博学的背景使她成为一位值得关注的人，甚至可能值得考虑当做一位初拥候选人。"
 podgreatpersons.0032.t:0 "赫尔曼·冯·萨尔察"
 podgreatpersons.0032.desc:0 "自上任以来，这位条顿骑士团的宗师一直让德意志的该隐之子头疼不已。即使是黑十字，德意志该隐之子修会，也不能刺穿保护这个人的真信。正因如此，再加上他作为指挥官和外交官的出色才能，赫尔曼已经能够抑制大多数对他的骑士团的该隐之子影响。不过，最近有些事情发生了变化，条顿骑士发动了一场无声的反抗，把他大权旁落，成为一个傀儡。随着岁月的流逝，他一生的事业也在崩溃，赫尔曼的信仰也在逐渐减弱。这将是极好的机会，来对教会士兵进行舒畅又打脸的报复……"
 podgreatpersons.0033.t:0 "伊本·阿拉比"
 podgreatpersons.0033.desc:0 "穆斯林世界最著名的学者之一最近搬到了大马士革。伊本·阿拉比是一位著名的学者、神秘主义者和哲学家，他创作了近850部作品。甚至连该隐之子世界也被他引起了注意，关于他对世界内部运作的真实认识，各种争论如雨后春笋般冒了出来。现在只是一位老人，伊本似乎在疯狂地试图在死前完成《麦加的启示》的第二稿。将永生的恩赐授予这样的人是很诱人的，即使你知道该隐的诅咒会深刻地改变一个人……"
 podgreatpersons.0034.t:0 "伊本·赫勒敦"
 podgreatpersons.0034.desc:0 "著名学者、政治家和历史学家伊本·赫勒敦再次受到众多敌人的威胁。这位老冒险家的一生充满了阴谋诡计、军事征服和担任过许多显赫的政府职位。尽管如此，他最为人所知的还是他关于帝国的周期性兴衰的杰出著作，这使他成为被派去与蒙古领主的帖木儿谈判的使者之一。最近重返政坛后，他对一个秘密政党的效忠过事又回归困扰着他，他的日子似乎屈指可数了，因为他喜欢惹是生非，而且年事已高。你的一些廷臣劝你考虑把他转成子嗣，否则就太晚了。"
 podgreatpersons.0035.t:0 "玛格丽塔·卢蒂"
 podgreatpersons.0035.desc:0 "这位「交际花的女王」自抵达罗马以来，就一直是罗马一个悦目的景象。作为一个精明的女人，她成功地攀上了罗马最著名的名人——交际花间的顶端。圣职人员和艺术家（如拉斐尔）都崇拜她，她是这座圣城里富有而有影响力的人物。但看来这一切都要结束了，因为她目前正在与显然是自己服用的毒药进行斗争，而且失败了。虽然你不确定她为什么要自杀，也许是一个微不足道的世俗原因，比如「真爱」，但你知道这是一个初拥一个应该很容易在暗夜宫廷上找到自己位置的人的机会。"
 podgreatpersons.0036.t:0 "扬·胡斯？"
 podgreatpersons.0036.desc:0 "最近，「胡斯派运动」已经成为了该隐之子的主要担忧。一些人对使教会分崩离析的想法着迷，另一些人似乎对这种改革主义理论真正感兴趣。不过，该运动的领袖胡斯本人，也将不久于人世，因为对他的审判很可能会导致他被迅速处决。一群年轻的「胡斯派」该隐之子组织了一次大胆的营救行动……并很悲惨的失败了。但在事后，你的派员注意到有个人在街上流浪，自称是牧师本人。由于审判正在顺利进行，这是非常不可能的，但他可能是胡斯的信徒，因袭击而错乱了。无论如何，作为一名该隐之子袭击的幸存者，他对你的保密工作构成了威胁……"
 podgreatpersons.0037.t:0 "扬·杰士卡"
 podgreatpersons.0037.desc:0 "你一直在密切关注一名杰出的将军扬·杰士卡的生涯。这位胡斯派的首领已经被证明非常有能力，用创新的战术将一群乌合之众变成了一支能够击败欧洲最优秀骑士的军队。最明显的是火药的使用，这是一种致命的新武器，会给你带来麻烦。你已经知道杰士卡又在打仗了，但是瘟疫已经侵袭了他，他的日子似乎屈指可数了。你强烈地考虑采取行动把他带到你的宫廷，因为他会是一位很有价值的军事领袖，一位可以向你第一手解释这些新武器的危险的人。"
 podgreatpersons.0038.t:0 "蓬巴杜夫人"
 podgreatpersons.0038.desc:0 "法兰西有一个悠久的传统，即国王都有着权势的情妇和密友。但是，您必须承认，您听到的关于让娜-安托瓦妮特·普瓦松的消息是不同寻常的。近年来，这位王室情妇，曾经的「国王之友」当他们的关系更贞洁时，其权力与路易十五不相上下，甚至更大。她的魅力、政治敏锐性和坚实的朋友圈使她很有权势……并被宫廷的很多人憎恨，随着她虚弱的体质最终超过了她的决心，她的生命也将结束，因为她的疾病将无法让她活下来。凡人的法兰西将失去一颗宝石，但该隐之子的法兰西也许将可以赢得一颗宝石……"
 podgreatpersons.0039.t:0 "珍妮·德·克里松"
 podgreatpersons.0039.desc:0 "你的派员通知你臭名昭著的「布列塔尼母狮」和她的孩子最近在一个偏远地区遭遇海难。这位母狮是珍妮·德·克里松，一位布列塔尼的贵妇，她发誓要为十多年前她丈夫因怯战而被处决一事向法兰西国王复仇。从那时起，她就在布列塔尼附近以惊人的成功击败了法兰西舰队。一个任性而实际的女人，她每次只留下一个幸存者来讲述这个故事，她给你的许多廷臣留下了深刻的印象。她最近的失败和她盟友与船员伙伴的孤立给了你一个机会「邀请」她到你的宫廷。也许你可以让这样一头母狮成为你的子嗣……"
 podgreatpersons.0040.t:0 "圣女贞德？"
 podgreatpersons.0040.desc:0 "随着法兰西与英格兰之间的战争愈演愈烈，「奥尔良的少女」一直是着该隐之子的一个大麻烦。这本来是一个方便密谋和掠食的机会，现在却变成了一场几乎圣战般的战争。真信在蔓延，你已经数不清有多少该隐之子被蜂拥向贞德的旗帜的狂热者所焚烧。她自己是无懈可击的，她被一种看似神圣的信念所保护，但……她的近亲却不是。这很琐碎，但你可以报复她的家人，只因她造成的所有麻烦，特别是当英格兰人最终抓住了她，使她（大概）无害化了。如果运气好的话，他们甚至可以成为有用的卒子。"
 podgreatpersons.0041.t:0 "约翰·卡伯特"
 podgreatpersons.0041.desc:0 "这是一个变革和探索的时代，这两件事都是该隐之子不擅长处理的。当欧洲开始越来越多进入伟大的未知的探险，你们好奇什么样的恐怖，和机会，等待着他们。你决心不被抛在后面，因此，你调查了当代最伟大的探险家之一，约翰·卡伯特。这位坚强的船长最近刚从他的许多次大西部之旅中回来，他如果有你这样的永生的赞助人将能做更多的事情。授予他永生也是一种选择，它可以让你在未来抢先一步，无论是在这里还是在广阔的蓝色海洋之外。"
 podgreatpersons.0042.t:0 "约翰·霍克伍德"
 podgreatpersons.0042.desc:0 "佣兵在意大利生活很常见。这些人被雇来为该国富裕的城邦发动战争，他们对效忠的态度常常像他们对货币的贪婪一样善变。他们的领袖之一，英格兰人约翰·霍克伍德，在这里度过了他的大部分职业生涯，为许多城市而战。一个残忍和贪婪的人，从某种程度上讲，他也被认为是最好的指挥官和战略家。他的时间不多了，他上次行军做的事也来找他了，你的一些廷臣们认为，这将是一个很好的接近他的机会。长生不老的承诺会轻易地诱惑这样的人，他会证明自己是有用的……如果你能使他服从你的意愿。"
 podgreatpersons.0043.t:0 "列奥纳多·达·芬奇"
 podgreatpersons.0043.desc:0 "一段时间以来，弗朗索瓦一世非常喜欢一位意大利艺术家，甚至还送了他一座城堡供他个人使用。你已经监视了这个人，必须承认他在多个领域拥有纯粹的天赋。然而，你并不是唯一一个仰慕他的人，因为看起来有一群虔心者密切监视着他，使任何近距离接触都变得不可能。但是最近，你知道达芬奇的健康每况愈下，这迫使国王常常安排时间去拜访他的老朋友。这可能是你「邀请」当代最伟大的思想家到你的宫廷里的最好机会……"
 podgreatpersons.0044.t:0 "卢克雷齐娅·博尔贾"
 podgreatpersons.0044.desc:0 "你总是在寻找可选的初拥候选人，而博尔贾家族就不缺这样的人。教宗亚历山大六世的女儿卢克雷齐娅对她的父亲和兄弟来说是一笔不小的财富。她美丽、聪明、意志坚强，是文艺复兴时期的完美公主。在你的书中，关于她中毒和背后残酷阴谋的谣言是加分项，因为这将使她更适合成为不死族。你的派员在等着你的回复。"
 podgreatpersons.0045.t:0 "马可·波罗"
 podgreatpersons.0045.desc:0 "该隐之子世界很大，你总是渴望了解更多关于你在国外可能结交到的奇怪的朋友，或者最有可能的敌人。一位叫做马可·波罗的威尼斯商人出现了。据称，这名拥有平静家庭生活的男子已经在震旦旅行了几十年。在这段时间里，他很可能在国外找到了一些关于暗夜世界的有趣信息或线索。显然，你可以只看他的笔记，但你也可以做得更好……你的派员已准备好按照你的要求参观波罗庄园。"
 podgreatpersons.0046.t:0 "玛格丽特一世"
 podgreatpersons.0046.desc:0 "近20年来，玛格丽特·卡佩一直统治着勃艮第和佛兰德斯。她丈夫的早逝和她孩子的巨大影响使她成为这个地区不可忽视的一股力量。意志坚强，但她不是最仁慈的统治者，在她统治期间发生的无数叛乱和镇压可以证明。尽管如此，她还是一个有能力的女政治家，她的头脑能够承受不死族的严峻性，因此，你正在考虑在她死之前采取大胆的行初拥她。"
 podgreatpersons.0047.t:0 "迈克尔·斯科特"
 podgreatpersons.0047.desc:0 "腓特烈二世的科学顾问和宫廷占星家是一位奇怪的英格兰人，名叫迈克尔·斯科特。这位显然很有学问的人经常被指控使用黑魔法，因为他似乎比任何人都更了解这个世界的内部运作。就你所知，他并没有被任何超自然的力量附身……目前而言。你对他对天堂和上帝的认识特别感兴趣，因为你是被造物主诅咒的存在，你想知道斯科特是否能在这一努力中发挥作用。把他从皇帝宫廷中分离出来，并把他的死伪装成一场意外并不容易，但这在你的力量范围之内。"
 podgreatpersons.0048.t:0 "明道加斯"
 podgreatpersons.0048.desc:0 "凡人的立陶宛正在慢慢地皈依基督教，正如同许多东欧国家之前所做的那样。在这里，这个过程是血腥而无情的，因为当地的宗教反对骑士团。随着首位立陶宛国王明道加斯的加冕以及他进入教会的洗礼，转折点可能已经到来。尽管他远非狂热者，在与鞑靼人和其他公爵争夺王位的过程中，他已经数次改变宗教信仰。虽然毫无疑问的愤世嫉俗，明道加斯已经完成了很多军事和行政成就，因此，当你知道一个致命的阴谋，一场会杀死他的报复，你在考虑你的选择。初拥一位国王总是有风险的，但他的权力基础足够薄弱，你有可能成功。"
 podgreatpersons.0049.t:0 "尼科洛·马基雅维利"
 podgreatpersons.0049.desc:0 "你被最近送给你的一份手稿吸引住了。《亲王》是对该隐之子政治和统治阶级的完美研究……而竟然这是一位凡人写的！这位马基雅维利远没有得到你认为他应得的名声，因为「道德」和「公正统治」的小问题他的杰作被撕碎了。如果凡人不能欣赏这部作品背后的天才之处，你当然可以给他一个更好的交易。一笔关于永生的交易……"
 podgreatpersons.0050.t:0 "尼古拉斯‧赞內金"
 podgreatpersons.0050.desc:0 "佛兰德斯多年来一直受到农民起义的困扰。这当然是个机会，毕竟在战争时期进食要容易得多。奇怪的是，这种特殊的反抗持续了很长一段时间，如同凡人的不和一般长久，令人惊讶的是，他们成功地占领了几个城镇和抓了伯爵本人。你毫无疑问它会被碾碎，但是……这种忍耐力是有好领导在只会农民的标志。也许你可以让你的派员在下次战斗中「询问」叛军领袖的情况……"
 podgreatpersons.0051.t:0 "尼斯福鲁斯·布莱米底斯"
 podgreatpersons.0051.desc:0 "君士坦丁堡的陷落造成许多伟大学者的损失。不过，也有些人能够在混乱的余波中茁壮成长，比如尼斯福鲁斯·布莱米底斯。作为一名教师、作家和神学家，他居住在尼西亚，那里的皇帝给予他充足的庇护。他已经教过许多伟大的人物，比如亲王，现在他正考虑退休，在宁静的修道院中度过晚年。随着帝国财富的减少，这种罗马晚期文化的灯塔越来越少。因此，你在考虑给他永生，至少保存那一小部分。"
 podgreatpersons.0052.t:0 "开普敦的蓬斯"
 podgreatpersons.0052.desc:0 "十字军对你所统治的地区是一个可怕的打击，但他们的优势是给你带来了一些有趣的人。例如，一个来自奥弗涅的游吟诗人，已经成为你宫廷里的谈资一段时间了。他魅力四射，乐观向上，脑光灵活，言语敏捷，能通过大胆的爱与骑士的歌让最严厉的十字军战士着迷。这样的才能当然可以在该隐之子政治中发挥作用，有着能言善语可以让你走得很远。"
 podgreatpersons.0053.t:0 "劳得力·迪波吉亚"
 podgreatpersons.0053.desc:0 "教宗一直是吸血鬼的头痛之处，真信的纯粹力量让任何入侵都变得不可能。随着现任教宗亚历山大六世的上任，这种情况有所改变，他似乎更关注世俗事务而非永恒事务。他在这方面也相当成功，通过征服和精明的外交手段，扩大了教宗国的势力范围和他家族的权力。他那不那么神圣的灵性给了你一个千古难遇的机会：你可以派人到圣座去「拯救」劳得力·迪波吉亚，他目前因食物中毒或毒药中毒卧床不起。然后，一旦藏在宫廷里，教宗就归你了……"
 podgreatpersons.0054.t:0 "聋子罗伊"
 podgreatpersons.0054.desc:0 "加利西亚本身是个国家，尽管它由卡斯蒂利亚国王统治。即使按当时的标准来看，这个与世隔绝的地区也是独裁统治者的家园。这些贵族经常对普通民众漠不关心，四年前就达到了沸点，一场起义开始了。叛军由一个名叫聋子罗伊的小贵族领导。他在早期取得了一些胜利，但风向正在改变，因为更有经验的贵族军队正在严厉镇压叛乱。虽然他们似乎注定要失败，但也许他们的领导人对你还是有些用处的。一个充满激情和军事思想的子嗣有它的吸引力……"
 podgreatpersons.0055.t:0 "斯坎德培"
 podgreatpersons.0055.desc:0 "一段时间以来，奥斯曼一直是欧洲的主要担忧。战败的瓦尔纳十字军和君士坦丁堡的陷落为他们的进一步扩张铺平了道路。但是，近二十五年来，他们一直被一个名叫斯坎德培的人挫败，他仅用很少的兵力就成功阻止了强大的土耳其战争机器。这位年长的将军在欧洲被誉为英雄，他再次团结了新联盟，但一种致命的疾病让他失去了控制。在没有康复希望的情况下，你想知道这是否是一个「拯救」他并把他带到你的宫廷的好时机。毕竟，失去这样一位才华横溢的防御大师是一件憾事。"
 podgreatpersons.0056.t:0 "斯诺里·斯蒂德吕松"
 podgreatpersons.0056.desc:0 "冰岛是一个偏远的国家，即使对其他斯堪的纳维亚人来说也是如此，但你注意到一个关于斯诺里·斯蒂德吕松的故事，他显然是岛上最有权势的政治家。作为一位研究北欧神话的学者，斯诺里在混乱的冰岛和挪威政治中摸爬滚打了几十年，但似乎挪威国王已经受够了这混乱。你们的一个派员报告说，有一场针对冰岛议员的暗杀正在进行中。当然，这与你无关，但是如果你愿意，你可以选择拯救斯诺里并将其带回宫廷。他可以成为一个有趣的初拥候选人。"
 podgreatpersons.0057.t:0 "速不台"
 podgreatpersons.0057.desc:0 "蒙古汗帐把从中国到波兰的所有敌人都消灭了。在政治上，成吉思汗当然是主要因素，但在军事上，他的主要战略家速不台才是幕后的那个人。他组织了二十多次战役，打了六十五场胜仗，在大草原上声名远扬。在七十二岁高龄的时候，速不台终于决定从战场上撤退，这给了你一个在没有整个军队的窥视的情况下去初拥他的大好机会。"
 podgreatpersons.0058.t:0 "亚维拉的德兰？"
 podgreatpersons.0058.desc:0 "自从西班牙的裁判所开始活动以来，伊比利亚已经变得对吸血鬼来说相当不舒服。你已经尝试了许多大大小小的计划来减少教会的影响，而且效果很好，直到亚维拉的德兰来了。这位固执的修女几乎独自一人进行了改革，重新点燃了伊比利亚对基督教的热情。你在她的路上设置了许多障碍，包括你在裁判所和教会的间谍，但都无济于事。现在，你是在让这件事过去，掩盖你的痕迹。这样做的最后一步是「照顾」你的宠物，教宗特使埃吉迪奥·卡哈尔，自从他没能阻止她以来，他一直在逃避你的愤怒。但没人能一直逃脱你的手掌心……"
 podgreatpersons.0059.t:0 "狄奥多尔·梅托齐特斯"
 podgreatpersons.0059.desc:0 "罗马的政治变化无常，而一个人的命运很容易改变。其中一个人就是随后的安德洛尼卡二世的宠儿狄奥多尔·梅托齐特斯。作为一位学者、艺术赞助人和著名的外交家，狄奥多尔的职业生涯大部分归功于他的个人才能，但也归功于他与正确的人之间的友谊。当安德洛尼卡被赶下台后，梅托齐特斯在宫廷中失去了所有的声誉，现在隐居在修道院中度过余生。您的一些廷臣认为这样做是对一个有才能的人的浪费，您可以干预一下，也许可以帮助一个心怀感激的未来子嗣恢复前途。"
 podgreatpersons.0060.t:0 "狄奥多拉·帕拉尔洛基娜"
 podgreatpersons.0060.desc:0 "经过近六十年的拉丁统治，君士坦丁堡再次被罗马残余势力占领。一段艰苦的复辟时期正在进行，这是由皇后狄奥多拉·帕拉尔洛基娜亲自宣布的。作为新皇族坚定的母主，她经受住了许多政治和宗教风暴。她丈夫的早逝给她留下了一个相对强权的位置，她用来引导明智的赞助和建筑工程。她是希腊人重新掌权的有力象征，你知道你的许多对手想要干涉她。如果你想行动起来占有这个象征，现在就是时候。"
 podgreatpersons.0061.t:0 "特奥多尔·冯·诺伊霍夫"
 podgreatpersons.0061.desc:0 "一个有趣的人物最近来到了聚特芬。这个人，特奥多尔·冯·诺伊霍夫，负债累累，他卖掉了自己的头衔……科西嘉岛的王位。事实上，在热那亚岛上发生了一场短暂的叛乱之后，居民们就把这位德意志冒险家「加冕」为他们未来的国王。他只担任了几个月的任期，他的「王国」就分崩离析了。现在，他来了，就像一个失去了一切的骗子。但至少，他讲了一个很好的故事。这里有过前途更糟糕的子嗣而非一个能逗你开心的人。"
 podgreatpersons.0062.t:0 "特奥巴尔多·德·纳瓦拉"
 podgreatpersons.0062.desc:0 "很少有人能比特奥巴尔多·德·纳瓦拉更能代表骑士的理想。他经历过致命的阴谋（并策划了一些阴谋），参加过一次成功的十字军，爱上了一位有夫之妇（一位重要的女王），作为一个受人爱戴的「叙事诗人」写过许多歌曲。同时，他还成功地从香槟伯爵上位成纳瓦拉国王，并在那里成功地统治。你最近了解到，在从香槟之旅回来的路上，特奥巴尔多得了重病，他的护送者放慢了速度。这可能是一个独特的机会，你的派员会「拯救」垂死的国王，并把他带到你的宫廷。像他这样有成就的人是一位有趣的初拥候选人。"
 podgreatpersons.0063.t:0 "托马斯·阿奎那？"
 podgreatpersons.0063.desc:0 "你的一位小对手对阿基诺的一个庄园发动了一次鲁莽的攻击。你也不知道为什么，他有着那里的家族的人质，而他们被一个叫托马斯的家族成员彻底清洗了。这位博学的人想要加入道明会，并且似乎显现出极度的聪慧，他已经为教会提出了许多新的想法。无论如何，他的真信把你的对手焚烧，你现在就剩下一堆烂摊子要应付了。托马斯本身是无懈可击的，但你可以从让他的母亲「消失」开始。你的派员认为这个女人实际上是一个可选的初拥候选人，在过去使用了一些不光明的策略来实现她的目标。"
 podgreatpersons.0064.t:0 "托马斯·闵采尔"
 podgreatpersons.0064.desc:0 "宗教改革正如火如荼地进行着，它一开始对吸血鬼来说还是件好事，但随着教会的衰弱，现在跑来跑去的圣人比以往任何时候都要多。你试图打压他们的任何努力充其量都是无果而终。有个叫托马斯·闵采尔的传教士特别给你带来麻烦，他创立了一个「上帝永恒联盟」，主要由越来越多的叛逆农民组成。他对即将到来的末日充满热情的谈论让你紧张，你正在考虑派遣一些你的派员在他的下一次战斗中把他带到你的宫廷。然后，你就可以让他看到地狱的真面目……"
 podgreatpersons.0065.t:0 "帖木儿？"
 podgreatpersons.0065.desc:0 "自从帖木儿开始他残酷的征战之路以来，他一直是你的主要问题。他自称是成吉思汗的继承者，到目前为止没有人能阻挡他，他的战争导致无数城市被掠夺和烧毁，这对吸血鬼的狩猎场来说可不是什么好事。当该隐之子难民开始在你的宫廷中制造麻烦时，你会考虑一个可能的解决方案。到目前为止，任何抓捕或杀死他的企图都失败了，似乎他受到某种超自然力量的保护。另一种选择是诱拐他最喜欢的妻子也是最亲密的顾问。如果运气好的话，这可能会让他稍微停顿一下。运气不好的话，你也知道她被称作才华横溢又美丽动人，这两种有趣的品质使得她值得初拥。"
 podgreatpersons.0066.t:0 "托马斯·德·托尔克马达"
 podgreatpersons.0066.desc:0 "在暗夜世界里，裁判所已经如火如荼地活动了相当一段时间。但是，最近，随着西班牙裁判所得到教宗的正式承认，它已经获得了足够的支持来在凡人国家中传播自己。这使得伊比利亚的该隐之子的亡生变得更加艰难，你的臣民也会因为你「做得不够」而轻视你。裁判所太强大了，现在已经无法推翻，但对其领袖托马斯·德·托尔克马达的擒贼先擒王式打击，将是一场道德上的胜利，而你可以好好利用。只要你能初拥他……"
 podgreatpersons.0067.t:0 "乌尔里希·冯·列支敦士登"
 podgreatpersons.0067.desc:0 "一种新的时尚正在这些变化无常的凡人身上流行起来，那就是「宫廷爱情」，里面有穿着闪亮盔甲的骑士的故事，还有与已婚女士的纯洁浪漫。和所有与凡人有关的事物一样，这将无法经受住时间的考验，但在那之前……理解他们当前的想法总是好的。你的派员向你推荐了一个名叫乌尔里希·冯·列支敦士登的人，他是一个流浪骑士和诗人，是骑士精神的典范。这个人能言善辩，臂膀结实，对你的用处可不止一个方面。"
 podgreatpersons.0068.t:0 "瓦斯科·达·伽马"
 podgreatpersons.0068.desc:0 "最近，随着一位名叫瓦斯科·达·伽马的葡萄牙探险家的旅行，与欧洲的接触正在增加。虽然这个人说的是富有的贸易大联盟，但他的行动却表明了事实并非如此。他屠杀了一艘旅行的穆斯林船只上的平民，并以一支完整的舰队来报复所谓的扎摩林国王的侮辱。现在很明显，葡萄牙人带着征服者的心态来了，我们必须给他们一个教训。抓住并初拥无情的「印度副王」将是对任何试图侵占你们家园的欧洲该隐之子的警告。"
 podgreatpersons.0069.t:0 "瓦特·泰勒"
 podgreatpersons.0069.desc:0 "人们对国王理查二世和瓦特·泰勒会面的结果有一种期待的气氛，他们都主持了贵族和农民起义之间的和平会议。泰勒是叛军领导人中最顽固的，迄今为止，他拒绝国王做出任何让步。你可以肯定的是，许多重要的该隐之子人物聚集在会议的阴影下，特别是围绕着泰勒的情人，一位来自博林布鲁克的女族长。同样地，你也热衷于派遣一些你自己的代理人到现场，以确保你不会落后于你的竞争对手的计划。唯一剩下的问题是你代理人的行动力度。你会给他们提供足够的资源和金钱来赢取这场竞赛的「奖品」，还是只是命令他们旁观竞赛？"
 podgreatpersons.0070.t:0 "威廉·华莱士"
 podgreatpersons.0070.desc:0 "随着苏格兰独立战争的持续，苏格兰人失去了一位主要指挥官。威廉·华莱士在福尔柯克战败后就失宠了，但他仍然是苏格兰的守护者之一，也是苏格兰人民的有力象征。自福尔柯克以来，华莱士一直在欧洲各地寻找支持他的事业的人，直到他回到英格兰，在那里他被抓获。审判已经开始，这次审判的判决不会让任何人感到惊讶。苏格兰人可能会坚持并团结在他们的殉道者身后，但失去这样一个意志坚定的人将是一种耻辱。你可以牵线搭桥，在他被处决前安排一个接替者。然后，他就全归你了……"
 podgreatpersons.0071.t:0 "纳迦什"
 podgreatpersons.0071.desc:0 "一个精神错乱的老人最近在埃及闹得沸沸扬扬。这个人声称是「第一位永生者」和「尼赫喀拉」的皇帝。他说他的一个法术出了严重的错误，把他丢到了「我们的世界」。奇怪的是，他知道吸血鬼，即使他对他们有一些奇怪的误解（他坚持认为只有五条「血系」）。在任何情况下，他都是一个累赘，因为他很明显太过自我，可能会给我们带来一些不必要的关注。因此，你可以派一些你的代理人把他带到你的宫廷，然后亲自处理他。"
 podgreatpersons.0072.t:0 "萨德·达瓦"
 podgreatpersons.0072.desc:0 "一位犹太政治家最近名声大噪。萨德出身贫寒，而他对国家事务的掌控能力使他成为蒙古可汗宫廷里的一笔宝贵财富。同样以其广博的医学知识和对艺术的赞助而闻名，这位犹太大维齐尔仍然有一个很大的缺点：他的自大。\n他的敌人很多，从因腐败而受到鞭打的蒙古官员，到感觉受到外国人阻碍的穆斯林。在可汗的保护下，萨德至今领先一步，但他的好运已经不多了，因为他的保护神最近生病了。想要谋杀他的阴谋的数量甚至以该隐之子的标准来看都令人印象深刻。因此，如果你想采取行动，让他远离尘世政治，现在正是时候。这样的人肯定会成为一个很好的初拥候选人。"
 Sa_ad_al_Dawla:0 "萨德·达瓦"
 Abu_al_Baqa_ar_Rundi:0 "阿布·拜盖·伦迪"
 podgreatpersons.0073.t:0 "阿布·拜盖·伦迪"
 podgreatpersons.0073.desc:0 "随着安达卢西亚的城市因再征服一个接一个地落入基督教手中，黄金时代的遗产也随之消失。一位塞维利亚的作家自封来不朽化这些失落城市的荣耀。\n他的这首诗采用了古典的哀叹形式，被称为「安达卢西亚的挽歌」，在他作为难民逃入的马格里布王国获得了广泛的赞誉。\n尽管如此，帮助安达卢西亚人的实际支持却寥寥无几，而阿布·拜盖现在已是一个疲惫的老人，不太可能看到他的梦想实现。除非你赐予他永恒的时间，让他策划复仇……"
 Sheikh_Bedreddin:0 "谢赫·贝德尔丁"
 podgreatpersons.0074.t:0 "谢赫·贝德尔丁"
 podgreatpersons.0074.desc:0 "奥斯曼苏丹国正在遭受大规模爆发的叛乱。虽然军事局势似乎在朝着有利于苏丹的方向发展，但你对叛军的领袖感到了兴趣。\n这位复杂的人物，谢赫·贝德尔丁，是第一位宣扬资产集体所有制以及基督徒和穆斯林间的平等的神学家。他在军事事务上也毫不懈怠，曾担任过奥斯曼王子穆萨的首席军事教官。在吸血鬼的缓慢政治中，革命性的思维方式是危险的，但你仍然想要确保这个叛逆者最终在你的控制之下……"
 Alauddin_Ali_Shah:0 "阿拉乌丁·阿里·沙"
 podgreatpersons.0075.t:0 "阿拉乌丁·阿里·沙"
 podgreatpersons.0075.desc:0 "孟加拉最近上演了三位王子之间争夺苏丹国的控制权的激烈权力斗争。这场战争之所以引起你的兴趣是因为其中一位参战者，阿拉乌丁·阿里·沙，的残酷野心。\n这个曾经被赶下台的人，以冷冰冰的效率通过杀戮和篡位获得了他目前的权力基础。很难说他是否能在当前的战争中重现这一成就，但这样一个熟练而残忍的领导人对你的宫廷是有用的……"
 Birger_Jarl:0 "比尔格·雅尔"
 podgreatpersons.0076.t:0 "比尔格·雅尔"
 podgreatpersons.0076.desc:0 "比尔格·雅尔在外交和战争方面都是一位有成就的政治家，几十年来一直是瑞典的真正力量。他巧妙地利用教会来推动自己的目标，遏制了大多数巨头的权力，为日后建立一个强大的中央集权的瑞典王国铺平了道路。\n然而，这名男子不仅被战争和野心所驱使，他提出的在偏远地区建立一个名为「斯德哥尔摩」的新城市的建议也结出了硕果。不过，他的寿命终究要完了，这位自称瑞典公爵的人可能很快就会迎来自己的最终命运。除非你打算为他安排另一种命运……"
 Zawisza_Czarny:0 "扎维沙·恰尔内"
 podgreatpersons.0077.t:0 "扎维沙·恰尔内"
 podgreatpersons.0077.desc:0 "你一直以极大的兴趣关注着一位叫扎维沙·恰尔内的人的生涯。这位以骁勇善战著称的波兰骑士长久以来一直是值得初拥的目标。\n扎维沙是许多大赛的获胜者，是军队的领袖，甚至是外交官，他有许多有用的才能，你渴望他被取用于你。他最近称他的国王是懦夫，因为他在与奥斯曼土耳其人的战斗中逃跑了，并计划独自继续这场战争。一个勇敢的，自杀性的，行动。远离着宫廷和大部分军队，现在是你出击的好时机。"
 Seguin_de_Badefol:0 "塞甘·德·巴德福"
 podgreatpersons.0078.t:0 "塞甘·德·巴德福"
 podgreatpersons.0078.desc:0 "作为法兰西约翰二世雇佣的雇佣兵，塞甘在战争结束时过的并不好，转而从事强盗和打劫。他攻占了60座城堡，击溃了皇家军队，成为东法兰西事实上的统治者，直到教皇和国王给了他一大笔钱才罢手。\n现在塞甘很富有，但仍在从事雇佣兵工作，他受雇于纳瓦拉国王卡洛斯二世……直到他试图从他那里敲诈更多的金子。国王让人下毒了他，塞甘现在正慢慢死去。\n这样的「创业家」可能是一个很有前途的候选人……"
 Owain_Lawgoch:0 "欧文·劳戈赫"
 podgreatpersons.0079.t:0 "欧文·劳戈赫"
 podgreatpersons.0079.desc:0 "格温内斯古老的威尔士国王的最后一位男性后裔，这片土地上最优秀的战士之一最近引起了大家的注意。这个人的职业生涯很长，因为他决心重夺其合法的王位，甚至发动了两次入侵，在英格兰引起恐慌。\n他的第一支舰队因风暴而无法登陆，而第二支舰队则被调遣去支援法兰西国王。在没有入侵威尔士的时候，欧文在百年战争中为法兰西作战，并指挥一队威尔士雇佣兵对抗佩德罗，卡斯蒂利亚的残酷者。\n他最近与卡斯蒂利亚国王达成了协议，并计划在他的帮助下入侵夺回他的家园。你得知英格兰派了一个间谍去杀他，这可能是你把他绑架到你宫廷的绝佳掩护。"
 Roger_de_Flor:0 "罗杰·德·弗洛尔"
 podgreatpersons.0080.t:0 "罗杰·德·弗洛尔"
 podgreatpersons.0080.desc:0 "最初是圣殿骑士团的成员，罗杰·德·弗洛尔在做出于亚柯之围中的可耻行为后被从骑士团开除。他控制了一艘圣殿骑士团的战舰，并收取巨额费用将平民运送到塞浦路斯的安全地带。当了一段时间的海盗后，罗杰看到了一个获取财富的机会。他用被开除的阿拉贡士兵创建了一个雇佣团——加泰罗尼亚大队。\n从那以后，他成为拜占庭政治中的一支重要力量，作为一名成功的雇佣兵队长对抗土耳其人。然而，罗杰的大胆可能会导致他的死亡，因为他在安纳托利亚建立一个雇佣军王国的野心让他树敌众多。\n这给了你一个伪造他被谋杀的机会，并将其收为己有。"
 podgreatpersons.0081.t:0 "麻风者亚当"
 podgreatpersons.0081.desc:0 "英格兰最近正经历着一场犯罪浪潮，其中最著名的强盗头目叫麻风者亚当。\n在他最著名的犯罪中，亚当得知菲利帕王后把自己的珠宝留在了当地的一个商人那里。麻风者的团伙包围了商人的房子，要求他交出珠宝。愤怒的商人拒绝了，并顽强地应对了数次攻击，直到亚当恼羞成怒，放火烧楼。于是，情况发生了变化，商人和他的家人想逃出去，而亚当却把他们关在屋里，直到他们把珠宝丢了出去。\n从那以后，这个现在很有钱的强盗就再也没有被抓到过……直到你的代理人偶然发现了他的老巢，主要是靠运气。\n这位年老的不法之徒已经表现出了狡猾和力量，你想知道他是否能成为一个值得的子嗣。"
 Momchil:0 "莫姆奇尔"
 podgreatpersons.0082.t:0 "莫姆奇尔"
 podgreatpersons.0082.desc:0 "莫姆奇尔是一位保加利亚强盗，他在罗多彼山脉建立了一支农民组成的个人军队，他曾短暂地效忠于塞尔维亚的斯特凡·乌罗什，却在当前的拜占庭内战中真正崭露头角。在一次令人印象深刻的背叛表现中，莫姆奇尔在1343年、1344年和1345年连换阵营。\n通过两面作战，他得以在边境地区建立起自己的势力。\n他已经成为一个巨大的威胁，以至于拜占庭人和土耳其人现在联合起来要一劳永逸地对付他。他似乎不太可能抵挡住这样的袭击。\n这个人显然已经表现出了在吸血鬼社会中做成事所需要的天生野心和狡诈，因此，你的廷臣们正在敦促你考虑在即将到来的战斗中派人伪装其假死，然后把他带到你的面前。"
 Arnaud_de_Cervole:0 "阿尔诺·德·塞沃利"
 podgreatpersons.0083.t:0 "阿尔诺·德·塞沃利"
 podgreatpersons.0083.desc:0 "韦利讷的主助祭，直到他发现雇佣兵的职业更符合他的胃口，阿尔诺组建了第一个「大佣兵团」，并带领它进入普罗旺斯，它才避免遭受战争中的严重破坏。没过多久，佣兵们就把这里变成了一片荒地。\n1358年，基本上把教宗绑架为人质，主助祭成就了他的恶名，他包围了阿维尼翁的教宗所在地，并要求了2万弗罗林作为离开该地区的赎金。此后，阿尔诺基本上又回到了合法的雇佣军工作中。\n在他的职业生涯中，他结识了许多敌人，因此主动要求加入远离法兰西的十字军东征。不过这次战役的后勤部分很不稳定，主助祭现在被困在离你势力范围不远的地方。\n或许有机会向他请愿，让他把其的才能借给你的宫廷？"
 Robert_of_Geneva:0 "罗伯特·德·日内瓦"
 podgreatpersons.0084.t:0 "罗伯特·德·日内瓦"
 podgreatpersons.0084.desc:0 "你早就怀疑阿维尼翁的现任教宗克莱孟七世可能是位吸血鬼。主要是因为他骗取了一座被围困的城市，许诺手下留情，然后在「血！更多的血！」的呼喊声中杀死了里面的所有人，这为他赢得了其的称号。\n不过奇怪的是，他似乎只是一个普通的，虽然不正常的，但野心勃勃的凡人。身为教宗，他学识渊博，手艺高超，自年轻时当过司令官，因此熟悉战事。\n他显然也不像你听说的其他大多数教宗那样，受到真信的保护。因此，他是一个诱人的初拥候选人……"
 Louis_d_Estouteville:0 "路易斯·德埃斯图特维尔"
 podgreatpersons.0085.t:0 "路易斯·德埃斯图特维尔"
 podgreatpersons.0085.desc:0 "在百年战争中，当法兰西在英格兰的攻击下崩溃时， 圣米歇尔山仍然在抵抗。由119名法兰西骑士防守的这个小圣地，已经击退了由20000多名英格兰人组成的军队……两次。\n骑士们由一位叫路易斯·德埃斯图特维尔的人领导，他是法兰西军队的一位坚强的队长。骑士们被他们奇迹般的胜利所鼓舞，已经开始解放诺曼底的乡村，而英格兰人则争先恐后地进行防御。\n在目前的混乱中，于路易斯远离着圣地，这也许是一个独特的机会，让你招募到这样一位技艺高超的领袖人物。"
 Lodewyk_van_Bercken:0 "路德维克·范·贝肯"
 podgreatpersons.0086.t:0 "路德维克·范·贝肯"
 podgreatpersons.0086.desc:0 "这些变幻莫测的凡人又有了新追求：钻石。这种公认的漂亮饰品是他们所有宫廷的话题，也是真正的现代贵族的标志。你可能想模仿他们，像他们说的那样与时俱进。\n来这样做的最好机会最近出现在路德维克·范·贝肯身上，这位精明的佛兰德珠宝商发明了一种新的钻石抛光工具，助火了钻石的突然流行。对你来说，还有什么比在眼皮底下窃取他们的珍贵工匠，来嘲弄这些凡人更好的事呢？"
 Lorenz_Helmschmied:0 "洛伦茨·黑尔姆斯米德"
 podgreatpersons.0087.t:0 "洛伦茨·黑尔姆斯米德"
 podgreatpersons.0087.desc:0 "哈布斯堡家族的宫廷装甲师，一位叫洛伦茨·黑尔姆斯米德的人，最近引起了你的注意。这位极富天赋的工匠创造了这个时代一些技术上最创新、艺术上最复杂的盔甲。不少于两位神圣罗马帝国的皇帝都装备他的作品参加战斗。\n作为一个吸血鬼，你不需要像那些虚弱的凡人那样的保护，但是，有这样一个有天赋的人为你工作，既是会带来声望，也是有用的。而且你不希望你的敌人在你之前抓住他，以免他们最终用这些极好的盔甲来对付你……"
 Robert_Porter:0 "罗伯特·波特"
 podgreatpersons.0088.t:0 "罗伯特·波特"
 podgreatpersons.0088.desc:0 "作为黑夜的统治者，你需要一个在各个领域方面有才能的人，如战争、管理、外交……一个人能够假装精通其中几个领域是很罕见的。但你可能在一个叫罗伯特·波特的人身上发现了例外。\n波特是议会派的热心成员，开始时他是他们的铁匠，后来被任命为骑兵队队长。然后他还发表了一篇宣传文章，最后被任命为议会派一个驻军的财务总管。毫无疑问，一个拥有如此多样技能的人可以在你的宫廷中发挥作用。"
 Daniel_Hopfer:0 "丹尼尔·霍普弗"
 podgreatpersons.0089.t:0 "丹尼尔·霍普弗"
 podgreatpersons.0089.desc:0 "最近，一位名叫丹尼尔·霍普弗的巧匠引起了大家的注意。他是一位德意志艺术家，是第一个在版画中使用蚀刻技术的人，从而使盔甲的装饰比以往更加精美。他还与其他工匠合作，并且已经有一批热心的弟子跟随他的脚步。\n他的作品的质量已经引起了帝国宫廷的注意，但如果你现在采取行动，你可能比他们更快。哪个自尊心强的暗夜统治者会放弃由这一领域最好的大师之一制作一套著名的盔甲的可能性？"
 William_Dampier:0 "威廉·丹皮尔"
 podgreatpersons.0090.t:0 "威廉·丹皮尔"
 podgreatpersons.0090.desc:0 "作为一名海盗、探险家、航海家、私掠者和博物学家，威廉·丹皮尔船长可能是你在很长一段时间内听到的最引人兴趣的适任者之一。他一次又一次地展示了在亡生时所需要的勇气，他的勇敢和对同龄人的残忍是很大的帮助。\n这样一个人可以成为一个强大的资产……只要拴紧他的项圈。请记住，众所周知，他曾无数次地背叛了他的雇主。这种恶徒只对自己负责。"
 Catherine_Deshayes:0 "Catherine Deshayes"
 podgreatpersons.0091.t:0 "Catherine Deshayes"
 podgreatpersons.0091.desc:0 "Someone will be burned at the stake for witchcraft in Paris tomorrow. Not really an uncommon occurence really, but this specific 'witch' caught your interest. This woman has specialized herself in fortune telling for the high and mighty. Then in alchemy, then in poisoning, then in black mass... there seems to be no limits to where she would have gone to extort some gold from the gullible French aristocracy.\nHer fortunes turned when she started to use Satanic imagery for her rituals which made a series of poisoning in the French court be attributed to her.\nRegardless of the truth of the matter, such an... innovative 'entrepreneur' could be useful to your court in many ways."
 Ontsifor_Lukinich:0 "Ontsifor Lukinich"
 podgreatpersons.0092.t:0 "Ontsifor Lukinich"
 podgreatpersons.0092.desc:0 "Coming from a family of Novgorodian boyar, Ontsifor has been elected posadnik (mayor) of the city several times. He first appeared in your agents' report when he led the city's troops against the recent Swedish invasion, managing to do quite well despite being disadvantaged.\nNot only a soldier, Ontsifor also reformed the office of posadnik, creating a new ruling collective of several members, a first in Novgorodian politics as far as you know. A man with such a skillset could certainly be useful to your worthy cause."
 podgreatpersons.0093.t:0 "伊万"
 podgreatpersons.0093.desc:0 "A young, apparently simpleminded, man has been the talk of your area recently. The youngest brother of his family, Ivan is always cheerful and kind to the point of foolishness. He is also often the (unwilling) hero of many tall tales, from dragons to kidnapped princesses, where he always somehow wins at the end.\nYou suspect a clever Malkavian prank as the real cause of this story, but what if Ivan was indeed gifted with extraordinary luck or another supernatural gift? You could bring him to your court to investigate at the very least."
 Kudeyar:0 "Kudeyar"
 podgreatpersons.0094.t:0 "Kudeyar"
 podgreatpersons.0094.desc:0 "Apparently the illegitimate elder brother of Ivan the Terrible, the man known as Kudeyar has quickly became a legend around your region. Leading a band of Cossacks near the Don River, his martial skills and fearless bravery have made him renowned throughout the land. The fact that he is targeting mostly nobles, or other not really popular figures, also help in crafting his image as a hero for the poor and the downtrodden. An impressive commander and skilled propagandist such as him could be of use to you."
 Ivan_Bolotnikov:0 "Ivan Bolotnikov"
 podgreatpersons.0095.t:0 "Ivan Bolotnikov"
 podgreatpersons.0095.desc:0 "The Time of Troubles are upon mortal Russia, and various warlords are competing against each other. One of them is a resourceful ex bishop, who escaped prisons and slavery several times before coming back as a rebel leader.\nIn these chaotic times though, he quickly shed any pretenses of fighting for anything but himself and was soon more feared than respected, especially after the destruction of several towns he orchestrated. Certainly a valuable quality if he was to join the world of the night. You have an opportunity to do just that actually, as he has recently surrendered and will probably soon face execution."
 Dmitri_Ivanovich:0 "Dmitri Ivanovich"
 podgreatpersons.0096.t:0 "Dmitri Ivanovich"
 podgreatpersons.0096.desc:0 "After an unsuccessful attack on Moscow, another warlord bites the dust as the Time of Troubles continues in Russia. This one made himself known as the lost son of Ivan the Terrible, which isn't very original, and somehow managed to gain enough credibility to amass an impressive army.\nHis military fortunes were mixed, but you most admired his capabilities of sticking to a lie as he was able to rally nobles and peasants alike behind his false banner. Perhaps you could make use of him? He certainly seems to have the necessary prerequisites to become an able, if not really trustworthy, childe."
 Alena_Arzamasskaia:0 "Alena Arzamasskaia"
 podgreatpersons.0097.t:0 "Alena Arzamasskaia"
 podgreatpersons.0097.desc:0 "Another peasant revolt is getting crushed in mortal Russia, but this one hold a special interest to you. One of the rebel leader was a fearsome woman, apparently an ex nun, who masqueraded as a man to lead her army. Her skills in both archery and medicine made her quite the foe, and she was only captured after shooting down a number of Tsarists in the convent where she took refuge.\nEven torture could not break her, and she will soon be burned at the stake while still not having betrayed her men. It would be a shame to lose such a promising mortal so soon and you ponder whether to interfere or not."
 Domentijan:0 "Domentijan"
 podgreatpersons.0098.t:0 "Domentijan"
 podgreatpersons.0098.desc:0 "A monk, scribe, writer and philosopher, Domentijan has been well appreciated by your court for some time, his works being discussed at length. Although quite fond of the monastical life, he is no recluse either, having worked for several courts and made his own pilgrimage to Jerusalem.\nSuch a learned and well traveled man could be an asset to your court, perhaps even a potential childe. As he is now quite old, it would be quite easy to fake his death if you so wished."
 Milos_Obilic:0 "Milos Obilic"
 podgreatpersons.0099.t:0 "Milos Obilic"
 podgreatpersons.0099.desc:0 "The Sultan of the Ottomans, Murad, has recently been assassinated on the battlefield by a fearless Serbian knight. Details are sketchy but the attack seems to have been a daring assault, perhaps with just a touch of deceit involved. You are on the lookout for potential Cainite involvement but folk tales surrounding this new hero are already making it difficult to discern the truth.\nYou clearly doubt that he is a 'son of a dragon' or that he got help from, before slaying, Baba Yaga. One thing is for sure though, this man is a great fighter and is resourceful. Enough qualities for you to consider him as a potential embrace candidate."
 Jefimija:0 "Jefimija"
 podgreatpersons.0100.t:0 "Jefimija"
 podgreatpersons.0100.desc:0 "An unhappy mother and sorrowful wife, Jefimija lost everything in her life... multiple times. Her son died an infant, her husband and brothers died in war, before her patron and her friend died in the same war later on. Then, her country got partitioned by Austrians and Ottomans.\nThese hardships proved to ber her inspiration though, and she created some very well received laments, a form of long and sad poetry. Your unbeating heart isn't easily moved nowadays, but this might be an exception. What does she still have to lose but her life now anyways?"
 Ivan_Gundulic:0 "Ivan Gundulic"
 podgreatpersons.0101.t:0 "Ivan Gundulic"
 podgreatpersons.0101.desc:0 "An accomplished diplomat and learned man of the Ragusan Republic, Deivo Franov Gundulic comes from a noble lineage that has been in your area for a long time now. This particular scion of theirs is a fervent Catholic, and is using his literary talent to help this cause. As a member of the city government, he also displays interesting capabilities in administrative skills.\nYou are considering making a move, such a man could be of use. Perhaps to write an inflammatory pamphlet against your rivals?"
 Giorgio_da_Sebenico:0 "Giorgio da Sebenico"
 podgreatpersons.0102.t:0 "Giorgio da Sebenico"
 podgreatpersons.0102.desc:0 "An Italian master architect has been renovating the Sibenik Cathedral of St James for decades now. Clearly showing a skill and a patience very much unlike those fleeting mortals, you have been intrigued by this man and his work. Some look at his achievements and see inspiration from the divine and, although you have a much different relation with God than most mortals, you are also feeling something peculiar at least.\nWhile an architect isn't exactly the obvious career path you want for an embrace candidate, there might be some merit into looking deeper this time. If nothing else, at least to renovate your probably quite antiquated interior."
 Marin_Drzic:0 "Marin Drzic"
 podgreatpersons.0103.t:0 "Marin Drzic"
 podgreatpersons.0103.desc:0 "One peculiar mortal has been captivating your court lately. After a career as an interpreter, scrivener and church musician, Marin Drzic lives the life of an adventurer, outlaw and comedy writer. Even more interesting, he is actually coming quite close to unearth the Cainite presence in Dubrovnik.\nIndeed, your agents intercepted several letters from him addressed to the Medici of Firenze, asking them from help to get rid of the 'small elitist aristocracy that truly governs his city'. You are in no immediate danger but you can't deny that this mortal has proved his talents and his resourcefulness more than enough to, perhaps, warrant an audience with you.\nTime for him to meet these 'secret masters'."
 Rodion_Oslyabya:0 "Rodion Oslyabya"
 podgreatpersons.0104.t:0 "Rodion Oslyabya"
 podgreatpersons.0104.desc:0 "As the Russians celebrate their victory over the Mongols in the battle of Kulikovo, you have been made aware of the contributions of one of their commanders. This man, apparently a monk or a boyar himself, led the Russian knights with great courage and efficiency.\nUnhorsed, he was thought dead for a while, but reemerged during the battle and distinguished himself once again. His achievements have earned him the respect of the Russians leaders, and he is soon to depart to the Byzantine Empire for a diplomatic mission. You could interfere as such a zealous and charismatic general could certainly be of use to your plans."
 Alexander_Peresvet:0 "Alexander Peresvet"
 podgreatpersons.0105.t:0 "Alexander Peresvet"
 podgreatpersons.0105.desc:0 "You are casually following the news in the mortal world, and it seems that the Russians mortals are doing their best to free themselves from the Mongol's yoke. It is of little concern to you but war often breeds useful talent and, as such, your agents have been keeping an eye on things.\nTheir latest discovery was one Alexander Peresvet, a monk that fought a duel at the start of the recent battle against a Tatar champion. It ended in a draw, and your agents barely saved the mortal before the battle begun. Clearly, this warrior is a brave and committed soul as few are those willing to risk their lives as such. You could use him as a champion of your own, or perhaps even embrace him."
 Ivan_Vyrodkov:0 "Ivan Vyrodkov"
 podgreatpersons.0106.t:0 "Ivan Vyrodkov"
 podgreatpersons.0106.desc:0 "Russia's days look grim for its mortals as Ivan the Terrible has instituted the Oprichnina, a policy of mass repression and execution to consolidate his rule. One of the potential victims is a man you are loathe to lose to petty mortals politics.\nIvan Vyrodkov has been the main military engineer of Russia for decades now and has invented new revolutionary designs like the battery tower. He is also credited of massive architectural feats in various cities, and constructing a 12 metre high siege tower in just one night. You could interfere and spare him Ivan the Terrible's wrath, resulting in a grateful and brilliant military engineer at your service."
 Yermak_Timofeyevich:0 "Yermak Timofeyevich"
 podgreatpersons.0107.t:0 "Yermak Timofeyevich"
 podgreatpersons.0107.desc:0 "As the nascent mortal Russian Empire is making its first conquests in Siberia, one man has been leading them : Yermak Timofeyevich, a cossack, adventurer and charismatic leader of men. Once a lowly thug and river pirate, his combat experience secured him a military post where he soon excelled. He was then chosen as the leader of the Siberian expedition and you have heard of his exploits and conquests ever since.\nDeath waits for no man though, and you also heard of a planned ambush by the Tatars that will probably cut short his career. It could be the perfect time to fake his death and introduce him to your court. Perhaps you too have uncharted lands to conquer."
 Ridolfo_Fioravanti:0 "Ridolfo Fioravanti"
 podgreatpersons.0108.t:0 "Ridolfo Fioravanti"
 podgreatpersons.0108.desc:0 "The whims of the powerful are sometimes petty indeed as you recently heard that Ivan III, ruler of mortal Russia, put his once favorite Italian architect in jail. Ridolfo Fioravanti comes from Bologna where he worked as one of the most sought after architects in Italy, before being invited to Moskow. Since then, he has been building the Dormition Cathedral and all was well until he had the audacity of asking the Tsar to come back to his native Italy for his last years.\nNot one to accept such injustice, you could rescue him from his cell... and bind him to be your eternal servant instead."
 Dionisius:0 "Dionisius"
 podgreatpersons.0109.t:0 "Dionisius"
 podgreatpersons.0109.desc:0 "A monumental fresco painting of the Virgin Nativity Cathedral of the Ferapontov Monastery in Vologda Oblast has recently been unveiled to the public. A tremendous work that is the culmination of a strong career in icon painting by one man named Dionisius.\nHis creations are characterized by an aura of serenity and peace that seems to affect even the Cainites' raging inner Beasts. He is now old and tired though, and this was certainly his latest work. At is always the temptation with such interesting mortals, you have the possibility of saving his artistic genius by cursing him forever."
 William_de_Burgh:0 "William de Burgh"
 podgreatpersons.0110.t:0 "William de Burgh"
 podgreatpersons.0110.desc:0 "Ireland is a land of danger and heroes. You don't fear danger and you could use heroes so you are keeping an eye on the mortals of the Emerald Isle. One has distinguished himself recently.\nWilliam de Blurgh, magnate and deputy justiciar, is a proven commander, having led his men both in victory and defeat. His strong diplomatic skills and unwavering loyalty to his Earl also kept the feuding families of Connacht in check during his tenure. Something that isn't easily done in the complicated politics of the Isle.\nWilliam caught a nasty disease recently and probably won't make it, which could be the occasion for you to 'invite' him to your court."
 Godred_Magnusson:0 "Godred Magnusson"
 podgreatpersons.0111.t:0 "Godred Magnusson"
 podgreatpersons.0111.desc:0 "The last remnant of Viking Britannia, the Isle of Mann, has finally fallen to Scottish forces but the Northmen don't intent to go down easily. Led by the bastard son of the last King of the Isles, they prepared a rebellion and stormed the Scottish positions before being forced to a field battle.\nFaced with superior numbers, the rebels were soundly defeated but their leader, Godred Magnusson, managed to escape. Despite this setback, this 'last Viking' of Britannia has shown a strong temperament and ambition that could be useful. Now that he is alone and on the run, it could be easy for you to bring him to your court for further discussion about his fate."
 Lucino_Dal_Verme:0 "Lucino Dal Verme"
 podgreatpersons.0112.t:0 "Lucino Dal Verme"
 podgreatpersons.0112.desc:0 "One of those 'Condottiero', the Italian mercenaries, has recently moved to Constantinople. This one is quite the legend, defender of Lucca and Bologna, governor of Genoa, captain-general of Piedmont, conqueror of Crete... and available to the highest bidder, as are most of these mercenaries.\nLuchino is certainly an interesting prospect, a man of war of course, but also a man who has survived the deadly Italian intrigues and even thrived on it. Perhaps you could arrange a meeting with him and become his new employer..."
 Julian_Cesarini:0 "Julian Cesarini"
 podgreatpersons.0113.t:0 "Julian Cesarini"
 podgreatpersons.0113.desc:0 "The last mortal Crusade against the Ottomans ended in chaos after the disastrous battle of Varna, but it also provided an enticing opportunity for you. The cardinal Julian Cesarini has been located by your agents, on his own and vulnerable.\nThis man has been the mastermind behind the Papacy's diplomatic efforts for decades, almost solving the Schism with the Orthodox Church and then gathering the Western Kings for the current Crusade. Such a brilliant diplomat with a strong sense of duty doesn't come into your web often, and you are considering your next moves carefully."
 Vidyapati:0 "Vidyapati"
 podgreatpersons.0114.t:0 "Vidyapati"
 podgreatpersons.0114.desc:0 "Mortal customs change often, and too quickly for your tastes most of the time. Even a basic concept such as language isn't exempt. The prakrit-derived late Abahattha has just begun to transition into early versions of the Eastern languages such as Maithili and Bhojpuri.\nYou will need a mortal expert to decipher these changes for you. Your agents say that there will be no one better than Vidyapati, a popular poet of the royal courts of Bengal who has recently retired to his home town. He is also known as a able diplomat and a zealous Hindu, meaning he could be useful as a ghoul or a childe, and not only a translator."
 Atukuri_Molla:0 "Atukuri Molla"
 podgreatpersons.0115.t:0 "Atukuri Molla"
 podgreatpersons.0115.desc:0 "An interesting mortal has come to your attention recently. Atukuri Molla is a popular poet, and as her popularity spread, she was invited to Sessions court and got an opportunity to recite Ramayana in front of Krishnadevaraya and his poets.\nMolla claims Sri Shiva as Guru, and her inspiration is said to have come from Pothanna, who wrote Bhagavata purana in Telugu. Like him, she is Saiva Hindu, but writes the story of Rama (an incarnation of Vishnu) and also refuses to dedicate her Ramayana to any king, a general practice for poets nowadays.\nFamous poets are always a lively, and prestigious, distraction to have at court, which means that you are considering bringing her closer to the night world."
 Boleslaus:0 "Boleslaus"
 podgreatpersons.0116.t:0 "Boleslaus"
 podgreatpersons.0116.desc:0 "Mortal conflicts are always a time of opportunity for your kind. The recent Mongol invasion of Central Europe is no exception. The Christians lost the battle of Legnica and your agents have lurked in the shadows, and bring you news of the whereabouts of one Boleslaus, self proclaimed 'duke of Bohemia'.\nThis ambitious man has spent his whole life fighting for a long lost claim of his family, before joining his erstwhile foes into defending the realm. Despite the loss, he illustrated himself by his bravery and skills at both a commander and a warrior. Your agents stand poised to bring him to your court, if you want to use him as a ghoul or a potential childe candidate."
 Guillaume_de_Sonnac:0 "Guillaume de Sonnac"
 podgreatpersons.0117.t:0 "Guillaume de Sonnac"
 podgreatpersons.0117.desc:0 "The mortal Seventh Crusade is coming to a close after the defeat of the Crusaders in the battle of Mansurah. Despite their earlier victories, the Christians charged too soon into the city, and only three knights of the original 280 came back to their home camp.\nOne of them is Guillaume de Sonnac, the Grandmaster of the Templar order, who fought his way out of the city but lost an eye in the process. He is now desperately leading a lost defense against the Muslim counterattack. Known as an able diplomat and skilled general, de Sonnac could be an interesting recruit for your court. Your agents are ready to exploit the ongoing chaos to fake his death, then bring him to you."
 Ibn_Taymiyyah:0 "Ibn Taymiyyah"
 podgreatpersons.0118.t:0 "Ibn Taymiyyah"
 podgreatpersons.0118.desc:0 "An Islamic jurist, scholar, muhaddith, theologian, judge, philosopher, economist and polymath, Ibn Taymiyyah has come to your attention for his diplomatic involvement with the Ilkhanid ruler Ghazan Khan and for his involvement at the Battle of Marj al-Saffar which ended the Mongol invasions of the Levant.\nA member of the Hanbali school, Ibn Taymiyyah's iconoclastic views on widely accepted doctrines such as the veneration of saints and the visitation to their tomb-shrines makes him unpopular with many scholars and rulers of the time, under whose orders he was imprisoned several times.\nNow languishing in a Damascene prison, you can't shake the feeling that the talent of the man who saved the Levant is being wasted. Perhaps an intervention on your part is in order."
 Madan_Rai:0 "Madan Rai"
 podgreatpersons.0119.t:0 "Madan Rai"
 podgreatpersons.0119.desc:0 "A new mortal ruler has ascended to the throne of the Gour Kingdom and this had led to a change in most of the civil servants of the realm. Of particular interest to you is the firing of Madan Rai, the last chief minister of the late king, who has always appeared to be a competent and diligent man.\nHe is renowned for luring the main general of the rival Brahmachal realm to his side, launching a series of events that culminated in the victory of the Gour Kingdom without even having to start a war. Such a devious and commited mind could certainly be of use to you."
 Sikandar_Khan_Ghazi:0 "Sikandar Khan Ghazi"
 podgreatpersons.0120.t:0 "Sikandar Khan Ghazi"
 podgreatpersons.0120.desc:0 "Surprising news as your agents somehow got hold of the Wazir (chief minister) of the Lakhnauti Kingdom. It seems that the man almost drown while fishing and was separated of his entourage. This raises some interesting questions for you as, despite this somewhat shameful event, Sikandar is a renowned general and capable administrator. He has been instrumental in his lord's conquest of the area. Perhaps he could become instrumental in yours?\nJust keep him away from fishing spots."
 Ertugrul:0 "Ertugrul"
 podgreatpersons.0121.t:0 "Ertugrul"
 podgreatpersons.0121.desc:0 "A Malkavian courtier of yours has been going on and on about how you must interfere with the life of a Bey of the Sultanate of Rum named Ertugrul. This tribe leader by birth is somewhat unremarkable, if at least skilled as a ruler of his small corner of Asia Minor. As such, you have ignored this Malkavian's ramblings for a long time.\nUntil the mad Malkavian killed himself by facing the sun, while screaming that 'it's too late!'. With somewhat of a dreadful feeling after this ominous event, you review your position concerning Ertugrul. Perhaps this mortal is indeed meant for great things and could be of use to you?"
 Qutui_Khatun:0 "Qutui Khatun"
 podgreatpersons.0122.t:0 "Qutui Khatun"
 podgreatpersons.0122.desc:0 "The mortal Mongol Empire is crumbling under troubled successions and civil wars but chaos bring opportunities to one such as yourself. Qutui Khatun, the mother of one of the recently assassinated Khan, has been a major political force despite the loss of her husband and now her son. The best proof being that the new Khan is currently marching on her city to stop her, as she is trying to secure support for herself.\nAs she is also known as a skilled administrator and diplomat, she has enough qualities to warrant your attention. You could fake her death and bring her to your court, where her final destiny would be in your hands."
 Tiramakhan_Traore:0 "Tiramakhan Traore"
 podgreatpersons.0123.t:0 "Tiramakhan Traore"
 podgreatpersons.0123.desc:0 "Your agents are following the mortals of Africa closely, and recently bring news to you about an interesting prospect. Tiramakhan Traore is a general of the Mali Empire that has led an expedition westwards, in search of new lands to conquer and settle. He did both quite admirably, defeating the Bainuk king Kikikor and annexing his state before founding many new Mandinka towns.\nHis mission accomplished, Traore is now resting in Mampating without his army, a rare position of vulnerability that you could exploit. You could probably use such a man for your own ends."
 Abul_Hasan_ash_Shadhili:0 "Abul Hasan ash-Shadhili"
 podgreatpersons.0124.t:0 "Abul Hasan ash-Shadhili"
 podgreatpersons.0124.desc:0 "A learned old man has recently stopped in your area as illness struck him. This old man is the renowned Abul Hasan ash-Shadhili, a theologian of great prestige. Known to have traveled far and wide to meet with the most famous scholars of this age, Abul then founded his own school of thought, and many disciples are already spreading his word to the four corners of the Muslim world.\nAlso a great debater and skilled in legal administration, he has many qualities that make him an attractive target. You could, perhaps, fake his death by illness and then bring him to your court. He could be useful, perhaps as a ghoul or even a prospective childe."
 Sayyida_al_Hurra:0 "Sayyida al Hurra"
 podgreatpersons.0125.t:0 "Sayyida al Hurra"
 podgreatpersons.0125.desc:0 "The pirate queen of Tetouan is a legend among Muslims, and a nightmare among Christians. Born in an exiled Andalusian family, she received the best of educations and was then wed to the governor of her city. When he died, she was entrusted with his role by the populace who already respected her as a capable administrator.\nSayyida al Hurra then lived a life of adventure and romance, marrying a Sultan, becoming a corsair and making the Mediterranean hell for the Spanish. But all things must come to an end, and she has recently been overthrown after a coup. You have been waiting for a long time in the hopes of finding a way to ensnare this prodigious woman in your web. This might be the opportunity."
 Mary_Wolverston:0 "Mary Wolverston"
 podgreatpersons.0126.t:0 "Mary Wolverston"
 podgreatpersons.0126.desc:0 "A peculiar 'smuggler' has recently been sentenced to death in London. This Cornish noblewoman, Mary Wolverston, apparently had a vast network of bribes, threats and thugs at her disposal to prey on the ships near the Carrick harbor. She greatly enjoyed this life of institutionalized piracy, and even boarded the Marie of San Sebastian when she heard rumors of its treasures.\nThis direct attack was a step too far, and she was caught while fencing stolen goods from her theft. As her death sentence has been promulgated, she will soon disappear from mortal minds. Perhaps an opportunity for you to 'save' this ruthless businesswoman for your own ends?"
 Agnes_Hotot:0 "Agnes Hotot"
 podgreatpersons.0127.t:0 "Agnes Hotot"
 podgreatpersons.0127.desc:0 "A young woman made quite the sensation in a recent tourney. As her father fell ill and couldn't protect his honor, Agnes secretly took his armor, rode off and knocked her opponent off his horse. As he laid in the dirt, she removed her helmet and let down her hair to reveal her true identity.\nYour inquiries have revealed that she is of a minor lineage, and could easily be captured by your agents and brought to your court if you so wished. Perhaps do you fancy a gallant lady knight defending your undead honor?"
 Vendela_Skytte:0 "Vendela Skytte"
 podgreatpersons.0128.t:0 "Vendela Skytte"
 podgreatpersons.0128.desc:0 "You have been following the life a young Swedish noblewoman for a while now. Famed for her learning and academics qualities, Vendela Skytte is also admired for her beauty and wit. She holds a salon and participates in the contemporary intellectual debate. She also surrounds herself with scientists and artists and conducts religious debates.\nThe woman is still quite young, but you are already quite fond of her, and worried that she might soon attract the attention of some of your rivals. As such, you are pondering acting to bring her to your court now, just to be safe."
 Samuel_Cockburn:0 "Samuel Cockburn"
 podgreatpersons.0129.t:0 "Samuel Cockburn"
 podgreatpersons.0129.desc:0 "Various mortals armies have been traversing your area for some time now, apparently embroiled in Gustav II of Sweden's wars in Russia and the Baltics. One of the commanders is a Scottish mercenary named Samuel Cockburn, a veteran of numerous battles and sieges. The number of campaigns he seems to have participated in is impressive, and the man certainly knows how to run his company.\nYou can understand such a soul, driven by both a lust for glory and gold. He could make for a fine childe, or a deadly rival. Maybe it's still worth the risk."
 Torsten_Stalhandske:0 "Torsten Stalhandske"
 podgreatpersons.0130.t:0 "Torsten Stalhandske"
 podgreatpersons.0130.desc:0 "You are always on the lookout for potential recruits and one of your agents tells you about a Finnish officer that shows promise. Albeit a short man, Torsten Stalhandske is exceptionally strong; when a captured enemy officer is led into the Swedish camp, he will shake their hands so hard that blood would appear under their fingernails in what he calls 'an honest Swedish handshake'.\nHe is also reputed to be a brilliant commander of men, leading terrifying cavalry charges or defending positions for several years alike.\nA man as powerful, mentally and physically, as he is could certainly be an interesting prospect."
 Ibn_Battuta:0 "Ibn Battuta"
 podgreatpersons.0131.t:0 "Ibn Battuta"
 podgreatpersons.0131.desc:0 "A fascinating mortal recently came back to Marrakech after an awe inspiring journey. Ibn Battuta visited most of southern Eurasia, including Central Asia, Southeast Asia, South Asia, China and the Iberian Peninsula and he is now compiling an account of his travels in a book. Even for a creature of your age and experience, this mortal saw things that you probably can't even begin to imagine. And he lived to tell the tale, proving a rarely seen strength of character.\nIf you want to know more about such a learned man, and his journeys, you could 'invite' him at your court. First persons accounts are more reliable than mere books, clearly."
 Saadi_Shirazi:0 "Saadi Shirazi"
 podgreatpersons.0132.t:0 "Saadi Shirazi"
 podgreatpersons.0132.desc:0 "Coming from a long line of religious scholars, Saadi Shirazi is perhaps the best of them. A major poet and prose writer, he is already recognized as one of the greatest of the age.\nHis major work, the Bustan, consists of stories aptly illustrating the standard virtues recommended to Muslims (justice, liberality, modesty, contentment) and reflections on the behavior of dervishes and their ecstatic practices.\nHaving completed his works, and age catching up to him, Saadi now lives in his native Shiraz as a respected scholar. Some of your courtiers have pushed the idea of 'saving' him from death by bringing him to your court."
 Ibrahim_Pasha:0 "Ibrahim Pasha"
 podgreatpersons.0133.t:0 "Ibrahim Pasha"
 podgreatpersons.0133.desc:0 "The powerful Grand Vizier of the Ottoman Empire has long been considered as the true power behind the throne. A masterful diplomat, he was behind the Franco-Ottoman alliance and convinced the Western Christians to turn Hungary into an Ottoman vassal state.\nHis wealth and arrogance grew along with his successes, until he behaved as if he was in charge, not the Sultan. This has finally caught up with him, and Suleiman seems very close on ordering his execution. Ibrahim is oblivious to the threat but you aren't. It could be the perfect opportunity for you to fake his death and bring him back to your court. You could use a Grand Vizier... as long as he knows his place."
 Krokodeilos_Kladas:0 "Krokodeilos Kladas"
 podgreatpersons.0134.t:0 "Krokodeilos Kladas"
 podgreatpersons.0134.desc:0 "In the mortal world, Greece has fallen to the Ottomans' conquests, but the people still resists. One such rebel, Krokodeilos Kladas, has been working with Venice to harass the Turks. A competent military leader, he has won several pitched battles before Venice signed a peace treaty with the Ottomans.\nNow left without external support, Krokodeilos has a price put on his head by both the Turks and his old Venetian allies, and his fortunes have turned. Despite several bold attempts of helping new rebellions spread across Greece, he has recently been captured after a battle near Monemvasia. His fate is sealed, unless you wish to intervene."
 Ivo_Senjanin:0 "Ivo Senjanin"
 podgreatpersons.0135.t:0 "Ivo Senjanin"
 podgreatpersons.0135.desc:0 "In the mortals of your region, the exploits of one named Ivo Senjanin are starting to become legendary. As a hajduk captain, he fought against the Ottomans all over the Balkans, including Albania, Bosnia, Herzegovina and Croatia. He participated in battles of the Ottoman–Venetian War in Lepanto, Cyprus, Egypt, Morea, and during the Long Turkish War in Sisak, Klis and Petrinja.\nAfter the end of his military career, he became an Uskok, a type of pirate while in Senj, where he was recently arrested for stealing and ultimately found guilty. His execution is planned to happen very shortly, leaving you only a small window of opportunity to act if you so wish it."
 Starina_Novak:0 "Starina Novak"
 podgreatpersons.0136.t:0 "Starina Novak"
 podgreatpersons.0136.desc:0 "A renowned Hadjuk, the mortal rebels against the Ottomans, has been captured and will soon be burned near your city. This man, Starina Novak, has quite the career. He was part of the attack on Bulgarian Sofia which earned him great reputation after he and his 700 soldiers tricked the Turks by changing route through the Balkan mountains and successfully surprise-attacked the Turkish forces only leaving behind 8 of his soldiers and capturing vast amounts of livestock and supplies from the Ottomans. He then liberated Plevna, Rahovo, Vratsa, Vidin, and Florentin.\nNumerous smaller victories are also credited to him, making him a very skilled military commander. He might be of more use to you living than burned to death."
 Sinan_Reis:0 "Sinan Reis"
 podgreatpersons.0137.t:0 "Sinan Reis"
 podgreatpersons.0137.desc:0 "A Barbary corsair has recently landed on Indian shores, apparently to aid a mortal ruler against a Portuguese invasion. Sinan Reis is one of the pirates sailing under the famed Ottoman admiral Hayreddin Barbarossa. Having a deep hatred of the Iberians since his forced exile from his home, Sinan fought in several key battles against the Spanish and the Holy Roman Empire.\nRenowned for his good tactical sense and being one of Barbarossa's favorites, this man has many qualities that could be of use to you. You understand very well the appeal of vengeance after all."
 Gaspar_de_Gama:0 "Gaspar de Gama"
 podgreatpersons.0138.t:0 "Gaspar de Gama"
 podgreatpersons.0138.desc:0 "A Portuguese expedition recently arrived in Hormuz and an intriguing character is with them. Even the name of this linguist is mysterious, as he adopted his current one after being found by the famed explorer Vasco de Gama. What is known though is that he is fluent in many languages, and familiar with the geopolitics and customs of India.\nThese assets, and his natural charisma, have made him very valued by the Portuguese, who always rely on him when trading with (or conquering) new lands. Clearly, this man has skills that can be of use to your cause and you could use your local influence to make sure that he falls into your web."
 Constantine_de_Baberon:0 "Constantine de Baberon"
 podgreatpersons.0139.t:0 "Constantine de Baberon"
 podgreatpersons.0139.desc:0 "You have been following the career of one Armenian noble for a while now. Constantine recently schemed his way into making sure that his son will inherit the Armenian throne. To do that, he first killed (after torturing and poisoing him) the current king, misled the loyal nobles to a wrong rescue mission then took the castle where the queen stayed and forced her to marry him.\nSuch ruthless ambitious is worthy of many Cainites' plots and certainly warrants your attention. Perhaps Constantine is ready to bring his talents for the lords of the night? You could fake his death and bring him to your court, where he could become a useful agent, or even a potential childe."