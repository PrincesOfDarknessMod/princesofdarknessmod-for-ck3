l_simp_chinese:
 POD_education_events.1.t:0 "教育"
 POD_education_events.1.desc:0 "你的新子嗣已经迈出了[victim.GetHerHis]的第一步。现在已经有足够的经验了解如何进食，很快就该接受正规的教育了，这对[victim.GetHerHis]未来很重要，也对你们的关系很重要。你选择什么教育方法？"
 POD_education_events.1.option.a:0 "教会[victim.GetFirstName][victim.GetHerHis]位置"
 POD_education_events.1.option.b:0 "让[victim.GetHerHim]待在身边，但带有一些自由"
 POD_education_events.1.option.c:0 "[victim.GetFirstName]会想出[victim.GetHerHis]办法的"
 POD_education_events.1.option.obedience:0 "这种教育可以提供听话，但无灵性的，子嗣"
 POD_education_events.1.option.lenient:0 "平衡的教育"
 POD_education_events.1.option.free:0 "通过这种教育，[victim.GetFirstName]更有可能变好，也更有自由精神"
 POD_education_events.2.t:0 "教育：棍棒"
 POD_education_events.2.desc:0 "如今的年轻人……你还没开始教育那蠢货，你就听到有人抱怨你做事的方式「苛刻」和「不公正」。好像他们会学到别的东西似的！\n无论如何，你可以看出你的子嗣在你的压力下快要崩溃的迹象，如果你不让步。显然，你可以改变你的方法，但「改变」不是吸血鬼能轻易做到的事情。"
 POD_education_events.2.option.a:0 "老方法是最好的"
 POD_education_events.2.option.b:0 "我会让步，目前来说"
 POD_education_events.3.t:0 "教育：人类联系"
 POD_education_events.3.desc:0 "你的子嗣还有人际关系，朋友，家庭等等。对于大多数年轻的吸血鬼来说，[victim.GetHerHim]很难对他们放手。很明显，你知道得更清楚，这些感觉最好是隐藏起来，因为潜藏因周边人类的鲁莽行为而受到威胁。而且你经常和你爱的人鲁莽行事。\n也许是时候让你的子嗣学会放下过去了？"
 POD_education_events.3.option.a:0 "我会为[victim.GetFirstName]掩饰，让年轻人有自己的梦想"
 POD_education_events.3.option.b:0 "孩子，我们得谈谈……"
 POD_education_events.4.t:0 "教育：自由！"
 POD_education_events.4.desc:0 "最近，你没太能照顾你的子嗣。你希望这种新获得的自由能让[victim.GetFirstName]发现一些有趣的[victim.GetHerHis]本人见解，但……不完全是。\n这个不守规矩的稚子还在怨恨你将其变成了吸血鬼，其开始公开质疑你的权威，也不回应你罕见的召唤。如果你现在不停止这种行为，事态可能会迅速升级。"
 POD_education_events.4.option.a:0 "孩子，我们得谈谈……"
 POD_education_events.4.option.b:0 "总会过去的，大概"
 POD_education_events.100.t:0 "教育：信仰问题"
 POD_education_events.100.desc:0 "到目前为止，你的子嗣还遵从你的信仰，主要是因为你这么觉得。但显然，[victim.GetSheHe]还远未了解心兽的内部运作方式以及如何处理它。你将不得不花一些时间来开始这部分的教学，或者聘请一些有学问的心路实践者来帮助你的后代。"
 POD_education_events.100.option.a:0 "首先要知道的是……"
 POD_education_events.100.option.b:0 "认真听老师讲课。他们并不便宜。"
 POD_education_events.101.t:0 "教育：人性的诱惑"
 POD_education_events.101.desc:0 "不顾您的教导，你的子嗣还是受了人性之道的诱惑，这并不奇怪。毕竟，对稚子来说，这是最容易追随的心路，试着接近凡人的脚步。\n你正计划上演一场盛大的信仰秀，在接下来的几个月里不干涉人类，作为事情真相的证明给你的子嗣。或者你也可以顺其自然。"
 POD_education_events.101.option.a:0 "接下来的几个月我们将被禁足"
 POD_education_events.101.option.b:0 "年轻人就是年轻人"
 POD_education_events.102.t:0 "教育：叛逆的诱惑"
 POD_education_events.102.desc:0 "令人不安的消息，你的间谍终于追踪到你的子嗣最近的失踪是因一伙在你的国度边缘的叛军。这些所谓的「狂徒」对任何有自尊的吸血鬼来说都是一种瘟疫，他们想要废除血的优良传统，徒劳无功地试图获得「自由」。\n你的子嗣必须马上认识到[victim.GetHerHis]错误，否则[victim.GetSheHe]甚至会开始相信这些愚蠢的事情！"
 POD_education_events.102.option.a:0 "回你的房间去，没有我的准许不许离开！"
 POD_education_events.102.option.b:0 "总会过去的，一切都这样"
 POD_education_events.300.t:0 "教育：结束"
 POD_education_events.300.desc:0 "你已经尽力了。你的子嗣已经学会了你的处境，学会了控制心兽的方法，甚至学会了如何接近氏族和他们的微妙之处。也许这就足够了。或者也许你已经制造了你所面对的最危险的敌人。\n时间会证明一切，时间总是会证明一切。"
 POD_education_events.300.option.a:0 "你不再是无助的雏儿了。但你依然是我的子嗣。"
 POD_education_events.5.t:0 "教育：从容的子嗣"
 POD_education_events.5.desc:0 "到目前为止，你的子嗣已经适应了[victim.GetHerHis]新状况。[victim.GetFirstName]不再大惊小怪，[victim.GetSheHe]会聆听你的命令，还是一位勤奋的学生。\n这可能不会持续很久，但已经比大多数子嗣好了。所以趁你还能享受的时候好好享受吧。"
 POD_education_events.5.option.a:0 "我对你很高兴，孩子"
 POD_education_events.5.option.b:0 "你将在我的宫廷留下好印象"
 POD_education_events.6.t:0 "教育：好于外交的子嗣"
 POD_education_events.6.desc:0 "自从[victim.GetHerHis]暗夜导入后，[victim.GetFirstname]就对宫廷礼仪表现出了浓厚的兴趣。总是试图了解更多关于你种族的氏族和各种政治，[victim.GetSheHe]已经是你外交牌库中的宝贵资产。\n你也知道羽翼未全的人都是善变的，这种兴趣可能不会持久。正因为如此，你正在考虑尽快兑现这笔资产。"
 POD_education_events.6.option.a:0 "到目前为止你做得很好，孩子"
 POD_education_events.6.option.b:0 "你将在未来几周内陪同我的外交官"
 POD_education_events.7.t:0 "教育：顺从的子嗣"
 POD_education_events.7.desc:0 "你又一次通过这个特殊的子嗣证明了你的高超技能。每一位尊长估计都羡慕你，你的后代在尽[victim.GetSheHe]所能顺从地提供帮助，同时也在感谢把[victim.GetHerHim]带到暗夜的伟大指路人。\n你可以集中精力让[victim.GetHerHim]成为长期有用的盟友，或者暂时只是一个可靠的助手。"
 POD_education_events.7.option.a:0 "让我们谈谈未来，孩子"
 POD_education_events.7.option.b:0 "回去工作"
 POD_education_events.8.t:0 "教育：精神的子嗣"
 POD_education_events.8.desc:0 "你的新子嗣很喜欢暗夜。怀着强烈的好奇心，[victim.GetSheHe]很快就学会了在该隐之子世界生存所需的基本知识。你很欣赏，也很欣慰这似乎没有给[victim.GetHerHim]离家独立的想法……目前来说。\n下一步就是要知道你是否会让[victim.GetHerHim]继续这样做，或者为了你的利益，试着和[victim.GetHerHim]更紧密地合作。"
 POD_education_events.8.option.a:0 "啊，年轻多好！"
 POD_education_events.8.option.b:0 "让我们合作吧，孩子"
 POD_education_events.9.t:0 "教育：不圆滑的子嗣"
 POD_education_events.9.desc:0 "你的子嗣到目前为止做得还不错，除了一个方面：宫廷礼仪。出于某种原因，[victim.GetSheHe]不能完全理解在宫廷上应该遵守的适当礼节。这真的没有那么难！如果你想挽回这一外交技能，你将不得不手把手教[victim.GetHerHim]宫廷政治。这可不是什么光荣的事。"
 POD_education_events.9.option.a:0 "待在这儿看着。什么也别说。"
 POD_education_events.9.option.b:0 "……行吧，这人还会有别的用处的，大概"
 POD_education_events.103.t:0 "教育：金钱的诱惑"
 POD_education_events.103.desc:0 "你的新子嗣在[victim.GetHerHis]适应吸血鬼的过程中表现得相当古怪。[victim.GetSheHe]认为[victim.GetHerHis]新状况最好用于……赚钱。[victim.GetSheHe]整天都在谈论永生如何意味着轻易的投资、新的机遇和诸如此类的废话。\n当你叹气时，你安慰自己说，这至少是一个比试图谋杀你更好的爱好。但你可能还是想带[victim.GetHerHim]走出这个「阶段」。"
 POD_education_events.103.option.a:0 "这里是你该死的钱。请自便。"
 POD_education_events.103.option.b:0 "……那些雏儿接下来还会想什么？"
 POD_education_events.104.t:0 "教育：虔诚的子嗣"
 POD_education_events.104.desc:0 "你的子嗣很容易就接受了你的信条作为[victim.GetHerHis]信仰。你对到目前为止的进步感到很高兴，除了持续的改进之外别无他求。作为一名成功的老师，你也通过这段共同的经历获得了更深的理解。"
 POD_education_events.104.option.a:0 "正如其所应当"
 POD_education_events.105.t:0 "教育：享乐的诱惑"
 POD_education_events.105.desc:0 "你的子嗣适应了[victim.GetHerHis]新环境。也许有点太好了……[victim.GetFirstName]把[victim.GetHerHis]时间花在与凡人，甚至其他吸血鬼的聚会上，以一种非常堕落的方式。\n显然，你更希望[victim.GetHerHim]用[victim.GetHerHis]永生做些有用的事，但现在说服[victim.GetHerHim]可能是一项艰巨的任务。"
 POD_education_events.105.option.a:0 "把这凡人放下，孩子，我们得谈谈"
 POD_education_events.105.option.b:0 "我不在乎……"
 POD_education_events.10.t:0 "教育：好于管理的子嗣"
 POD_education_events.10.desc:0 "[victim.GetFirstName]自[victim.GetHerHis]初拥以来一直很有进取心。[victim.GetSheHe]列出了几个计划，以增加你的影响力，并列出新可贿赂的人以确保它不被发现。\n你正在考虑把这个热切的稚子推向这个方向，或者现在就就地利用[victim.GetHerHis]对这些事情的洞察力。"
 POD_education_events.10.option.a:0 "你的天赋就在于此，孩子"
 POD_education_events.10.option.b:0 "真有意思，多跟我说说你的计划吧"
 POD_education_events.11.t:0 "教育：不解的子嗣"
 POD_education_events.11.desc:0 "你的后代没能理解，作为一个吸血鬼，规则与在凡生的是不同的。[victim.GetHerHis]作为一个活人的习惯时正在妨碍[victim.GetHerHim]，管理线人和间谍网络似乎超出了目前[victim.GetHerHis]理解力。\n你可以组织一个「实践任务」来教[victim.GetHerHim]诀窍，或者干脆放弃这一部分的训练过程。"
 POD_education_events.11.option.a:0 "跟我来并看好了，孩子"
 POD_education_events.11.option.b:0 "档案对你来说是禁区"
 POD_education_events.106.t:0 "教育：冠冕的诱惑"
 POD_education_events.106.desc:0 "你的新后代对吸血鬼的权力结构很着迷。[victim.GetSheHe]想知道所有关于谁统治什么，以及你如何达到你现在的地位，成为一位夜晚的统治者。\n伴着奉承，这可能会使[victim.GetHerHim]迅速接近征服之道，一项你可能不赞成的东西。"
 POD_education_events.106.option.a:0 "让我们先把精力放在思想上吧，孩子"
 POD_education_events.106.option.b:0 "为什么，是的，我可以谈论我自己！"
 POD_education_events.12.t:0 "教育：好于计谋的子嗣"
 POD_education_events.12.desc:0 "你的新子嗣喜欢吸血鬼政治的阴暗隐秘气氛。[victim.GetSheHe]已经战胜了其他一些稚子，并在阴谋方面显示出了强大的天赋。你可以让[victim.GetHerHim]自己去磨练这些技能，或者你可以在[victim.GetHerHis]帮助下制定一些你正在计划的紧迫计划。"
 POD_education_events.12.option.a:0 "你做得很好，孩子。就是用其做些不那么好的……"
 POD_education_events.12.option.b:0 "你觉得这些计划咋么样？"
 POD_education_events.13.t:0 "教育：轻信的子嗣"
 POD_education_events.13.desc:0 "你的后代很难适应这新亡生。[victim.GetFirstName]只会看表面，没有考虑到吸血鬼政治中每个人都在撒谎。到目前为止，你尽了最大的努力去教[victim.GetHerHim]，却毫无结果。这已经开始让你心烦了。"
 POD_education_events.13.option.a:0 "这些人不是你的朋友。我们没有朋友。"
 POD_education_events.13.option.b:0 "嘛，至少其对我来说不再是威胁"
 POD_education_events.107.t:0 "教育：铁拳的诱惑"
 POD_education_events.107.desc:0 "你的子嗣对统治问题表现出了极大的兴趣。到目前为止，这种兴趣使[victim.GetHerHim]得出结论：强权即真理。虽然你不一定同意，但你必须承认，你已经从[victim.GetHerHis]做事方式中获得了一些有趣的见解。也许鼓励[victim.GetHerHim]继续下去会带来更多的经验？"
 POD_education_events.107.option.a:0 "有比纯粹的力量更重要的能力，孩子"
 POD_education_events.107.option.b:0 "也许我们终究可以互相学习"
 POD_education_events.14.t:0 "教育：友好的子嗣"
 POD_education_events.14.desc:0 "到目前为止，你的后代已经很好地适应了亡生。你必须承认，在初拥之前，你就与[victim.GetHerHim]有一种更强烈的联系。也许这一次，你孤独的漫漫长夜将充满新的友谊。"
 POD_education_events.14.option.a:0 "让我们多谈一点，孩子"
 POD_education_events.108.t:0 "教育：天国的诱惑"
 POD_education_events.108.desc:0 "你的子嗣总在[victim.GetHerHis]凡生时有信仰。正因为如此，你就不会对[victim.GetSheHe]想追随天国之路而感到意外了。然而，你没有预料到的是，[victim.GetSheHe]到目前为止表现出的纯粹的热情。如今，打动你的东西并不多，但也许纯粹的奉献可以是其中之一？"
 POD_education_events.108.option.a:0 "我就是我"
 POD_education_events.108.option.b:0 "你是我的启蒙之光，孩子"
 POD_education_events.15.t:0 "教育：擅长军事的子嗣"
 POD_education_events.15.desc:0 "吸血鬼的战争和凡人的战争完全不同。这是一件相对保密的事情，使用少量的精锐部队，他们需要灵活的技能。幸运的是，你的子嗣似乎对这种战争方式带来的挑战有一种天生的理解。\n你将如何鼓励[victim.GetHerHim]利用这些初步的成功？"
 POD_education_events.15.option.a:0 "你自己看着办，孩子"
 POD_education_events.15.option.b:0 "你应该把你的专长集中在一个领域，孩子"
 POD_education_events.16.t:0 "教育：无力的子嗣"
 POD_education_events.16.desc:0 "在所有的问题中，你的子嗣似乎遇到了关于吸血鬼战争的问题。很明显，这些战争与凡人的战争截然不同，因为由数量很少的精锐部队进行，对于一个没有准备的指挥官来说，这些战争很难评估。你可以忘记这个问题，因为并不是所有的吸血鬼都注定要见到战场，或者组织一些当地的凡人部队来让你的孩子学到一些东西。"
 POD_education_events.16.option.a:0 "专注于你的其他课程，孩子"
 POD_education_events.16.option.b:0 "让我们跟凡人下一盘战棋吧，孩子"
 POD_education_events.17.t:0 "教育：平庸的子嗣"
 POD_education_events.17.desc:0 "到目前为止，你的新后代做得还不错。也没显现什么特别之处，这让你觉得[victim.GetSheHe]可能在其他方面有用。也许用来杀鸡儆猴？绝大多数的该隐之子都很好地展示了他们后代的才华，但你可以将这种习惯反过来。将你子嗣的心智碾碎，展示毫无理由的残酷，你会在以后的很长一段时间里都让人惧怕……"
 POD_education_events.17.option.a:0 "这将不会痛……很久"
 POD_education_events.17.option.b:0 "这家伙依然能有用"
 POD_education_events.109.t:0 "教育：残暴的诱惑"
 POD_education_events.109.desc:0 "你的子嗣似乎太急切地接受了[victim.GetHerHis]的暗夜怪物新身份。你已经听说过他参与的令人不安的「派对」和「实验」的故事，有些甚至是[victim.GetSheHe]组织的。不幸的是，这个小坏蛋可能不会轻易接受你在这件事上的权威……"
 POD_education_events.109.option.a:0 "你得立刻停止这种疯狂行为！"
 POD_education_events.109.option.b:0 "只要这不影响我……"
 POD_education_events.18.t:0 "教育：好于学识的子嗣"
 POD_education_events.18.desc:0 "你的子嗣对该隐之子的悠久历史非常着迷。那些氏族，那些神话，那些流言……所有[victim.GetSheHe]能学到的东西。[victim.GetSheHe]可能真的对一些你很久都没想过的事情有深刻的见解。也许你们可以一起工作？"
 POD_education_events.18.option.a:0 "你得到我的继续学习许可了，孩子"
 POD_education_events.18.option.b:0 "你对这些故事怎么看，孩子？"
 POD_education_events.19.t:0 "教育：愚笨的子嗣"
 POD_education_events.19.desc:0 "你的后代对[victim.GetSheHe]必须学习的大量新信息感到烦恼。氏族、该隐之子种族历史、神话……好像太多了。如果你不赶快做点什么，你的子嗣很可能会放弃，这可能会成为[victim.GetHerHis]进入暗夜的一个障碍。"
 POD_education_events.19.option.a:0 "……这家伙将有其他用处"
 POD_education_events.19.option.b:0 "让我们花点时间一起学习，孩子"
 POD_education_events.110.t:0 "教育：安于现状"
 POD_education_events.110.desc:0 "最近，你的子嗣正在以比以前更谨慎的方式接触[victim.GetHerHis]亡生。[victim.GetSheHe]满足于呆在暗处，似乎满足于让他人承担责任和承担危险，即使[victim.GetSheHe]经常在需要时提供[victim.GetHerHis]专业知识。虽然让你放心有一个看似值得信赖的子嗣，但你可能对未来另有打算。"
 POD_education_events.110.option.a:0 "长点志气，孩子！"
 POD_education_events.110.option.b:0 "又少了个可能的仇敌……大概"
 POD_education_events.200.t:0 "教育：引见"
 POD_education_events.200.desc:0 "是时候将你的子嗣正式介绍给你的宫廷了……真是么？这个该隐社会的传统环节既充满了机会也充满了危险 因为你的封臣和附庸们肯定会在你的新门生身上寻找任何值得利用的弱点。\n你可以跳过整个事件，但这不会给你带来好印象。"
 POD_education_events.200.option.a:0 "好好表现吧"
 POD_education_events.200.option.b:0 "你的事他们没必要知道"
 POD_education_events.201.t:0 "教育：烦人的封臣"
 POD_education_events.201.desc:0 "在你子嗣介绍自己期间，你的一个封臣不放过任何一次空隙来对你的子嗣进行唠叨。不够好，不值得拥护，浪费时间……你可以看到，你的子嗣在这时还能勉强控制住了此时[victim.GetHerHis]脾气。\n如果你不想让这两个人互相仇视的话，你必须得介入。"
 POD_education_events.201.option.a:0 "只要其等不恨我……"
 POD_education_events.201.option.b:0 "不要再说了"
 POD_education_events.202.t:0 "教育：友善的封臣"
 POD_education_events.202.desc:0 "在介绍的过程中，你的一个封臣真的很喜欢你的子嗣。无论是真心的还是有政治意向的，只要能在你的国度内维持和平，其实并不重要。他们正在互相谈心的时候你加入到了他们的行列。"
 POD_education_events.202.option.a:0 "我很高兴你过得不错"
 POD_education_events.202.option.b:0 "好耶！我选的子嗣真棒！"
 POD_education_events.203.t:0 "教育：狡诈的封臣"
 POD_education_events.203.desc:0 "你的子嗣在介绍时犯了一个小错误。出乎意料的是，你的一个封臣很快就帮你掩盖过去，以至于没有造成影响。\n你明白为什么当这条诡计多端的蛇来找你，告诉你你现在欠[victim.GetHerHim]……"
 POD_education_events.203.option.a:0 "你赢下这一局"
 POD_education_events.203.option.b:0 "我不欠你什么！"
 POD_education_events.204.t:0 "教育：入迷的封臣"
 POD_education_events.204.desc:0 "你的一个封臣被你的子嗣的完美无瑕的介绍所迷惑了然后他现在想和你的子嗣.……私下谈谈。很明显，这对你来说是个让[victim.GetHerHim]欠你人情的好办法，但你的后代可能不喜欢被当做礼物使用。"
 POD_education_events.204.option.a:0 "孩子来这，我想要把你介绍给……"
 POD_education_events.204.option.b:0 "很可惜，我不能接受你的要求"
 POD_education_events.205.t:0 "教育：足够"
 POD_education_events.205.desc:0 "你的子嗣的介绍……很顺利。虽说不是很成功，但也不算失误。你想想，在吸血鬼的社会里，即使取得一般的成功，也已经相当困难了吧。"
 POD_education_events.205.option.a:0 "非常平均"
 POD_education_events.206.t:0 "教育：无瑕"
 POD_education_events.206.desc:0 "你的子嗣的一切表现都非常顺利，甚至超出了你的预期。你的封臣们对你新后代的印象感到深刻，更对你作为尊长的品质同理。这将会在一段时间内给你留下很好的印象。"
 POD_education_events.206.option.a:0 "完美的结果"
 POD_education_events.207.t:0 "教育：被掩盖的失败"
 POD_education_events.207.desc:0 "从表面上看，你的子嗣的介绍似乎一切都很顺利。但在内心深处，你知道出了些问题。你的延臣们都在满口谀词，然后互相簇拥着，低声交谈。\n也许他们计划此举已经有一段时间了，也可能是你做了什么让他们不高兴的事。不管是什么原因，这可能是将来的一个问题。"
 POD_education_events.207.option.a:0 "政治永不会停止"
 POD_education_events.208.t:0 "教育：过于成功"
 POD_education_events.208.desc:0 "你的子嗣在[victim.GetHerHis]介绍中给人留下了很好的第一印象。或许有点太伟大了……在你那些急于破坏计划的臣子们的鼓励下，[victim.GetSheHe]开始有了自大的幻想。\n显然，这已经超出了[victim.GetHerHis]现在的地位和权力，但这个无耻的小鬼几乎是在公开谋划[victim.GetSheHe]作为你的继承人的「未来」任期。你得小心翼翼地管住[victim.GetSheHe]……"
 POD_education_events.208.option.a:0 "无礼的白痴！"
 POD_education_events.209.t:0 "教育：受打动的封臣"
 POD_education_events.209.desc:0 "你的子嗣在宫廷中的表现很顺利。除了[victim.GetSheHe]从你一个有权势的封臣那里赢得了明显的诚意之外，并没有什么不寻常的地方。这场小小的外交秀对你来说是有利的，无论是对附庸还是对你的子嗣。"
 POD_education_events.209.option.a:0 "显然，我的子嗣在我的许可下讲话"
 POD_education_events.209.option.b:0 "选了你真不错，孩子"
 POD_education_events.210.t:0 "教育：礼物"
 POD_education_events.210.desc:0 "在你的子嗣第一次进入宫廷的时候，你的一些封臣带着一份慷慨的礼物来到这里……是给你的后代的，而不是给你。他们显然是想通过让你把礼物据为己有来制造你们之间的裂痕。虽说剧情不怎么精妙，但还是很有诱惑力的……"
 POD_education_events.210.option.a:0 "孩子你还很年轻，这是我的"
 POD_education_events.210.option.b:0 "那就好好享受吧"
 POD_education_events.211.t:0 "教育：有才的子嗣"
 POD_education_events.211.desc:0 "你必须承认，你的子嗣很会抚平延臣们的小怨气，和他们的自尊心。其实好到你在把他介绍给宫廷时什么都不需要做。\n也许现在还早，但你在想，是否可以利用你那充满天赋的后代来减轻你的统治负担，至少是暂时的。"
 POD_education_events.211.option.a:0 "孩子，让我们来谈谈新的责任"
 POD_education_events.211.option.b:0 "我会休息的，当我……嘛"
 POD_education_events.1001.t:0 "子对父"
 POD_education_events.1001.desc:0 "你看着你最新的子嗣，还在从你慷慨赠予[victim.GetHerHim]的血液中恢复过来。这个孩子会变成什么样子？是朋友，是仆从，还是敌人？你在思考这个问题，因为新的雏儿站起来迎接你的目光。\n等等，这个样子，不会是……\n你反应太迟了，因为[victim.GetSheHe]用[victim.GetHerHis]新力量抓住了你，并将[victim.GetHerHis]獠牙刺入你的脖子。你感觉到自己的意识正在逐渐丧失，直到你的心兽，曾经是你最大的盟友，催促你去战斗。你不会轻易放弃的！"
 POD_education_events.1001.option.a:0 "还不会太迟！"
 POD_education_events.1001.effect.success.desc:0 "你将你的子嗣推开"
 POD_education_events.1001.critical.failure.effect.desc:0 "……幸福的感觉太强烈了"
 POD_education_events.1002.t:0 "子对父：宽恕？"
 POD_education_events.1002.desc:0 "你使出了最大的意志力和体力，才从你子嗣致命的拥吮中挣脱出来。你现在完全意识到了威胁，你的敌人已经失去了优势。[victim.GetSheHe]现在正在仔细地考量你，恐惧隐藏在[victim.GetHerHis]眼后。\n随着你的知觉和力量的回归，如果你愿意，你现在可以粉碎这个傲慢的小杂种。或者你也可以原谅并忘记，因为你非常清楚，上古之血对新初拥的雏儿有多大的吸引力……"
 POD_education_events.1002.option.a:0 "你有你的野心。我尊重这一点。"
 POD_education_events.1002.option.b:0 "你不值得拥有我的血脉！"
 POD_education_events.1003.t:0 "老者之尘"
 POD_education_events.1003.desc:0 "太迟了。你让他起死回生的血液赋予了[victim.GetHerHim]力量，你最新的子嗣已经吸干了你的血让你无力抵抗。这就是结局，被你自己的后代杀死，就像你之前和之后的许多人一样。\n当你的意识越来越远地滑落，被一种人造的幸福吞噬中时，一种奇特的讽刺残留着。\n直到一切在黑暗中结束，就像你一直期待的那样。"
 POD_education_events.1003.option.a:0 "你总有一天也会被弑父的"
 POD_education_events.1.option.d:0 "运用你娴熟的教学技巧"
 POD_education_events.1.option.durga:0 "作为突伽·辛，你具有能保证让你的子嗣在[victim.GetHerHis]初期就展现伟大的独特选项"
 POD_education_events.20.t:0 "教育：完美导师"
 POD_education_events.20.desc:0 "作为最受尊敬的西雷伏诺长者，突伽·辛，你在你的时代教导了许多年轻小伙，你甚至很喜欢这样做，不知从什么地方出现，将您神秘的智慧带给困惑的稚子。\n因此，把你的才华运用到你自己的后代身上是很容易的。这里轻轻戳一下，那里轻轻推一下，其就会变成你想要的样子。"
 POD_education_events.20.option.a:0 "聆听你的心兽，然后将它拽倒"
 POD_education_events.20.option.b:0 "粉红归于玫瑰，蓝血归于领主"
 POD_education_events.20.option.c:0 "要解开你自有的秘密，你必须寻找你自有的钥匙"
 POD_education_events.100.option.c:0 "我可以告诉你更多关于我们心路的事"
 POD_education_events.100.dionysius:0 "作为狄奥尼修斯，你可以使用这个选项，以确保你的子嗣会留在你的心路上，并被很好的训知关于其的事"
 POD_education_events.111.t:0 "教育：完美导师"
 POD_education_events.111.desc:0 "很少有该隐之子能像你一样塑造了一条人性之路塑造心路，狄奥尼索斯大人。它显然给了你对这些问题的敏锐的洞察力，你已经学习和辩论了很长一段时间。\n因此，很少有人比你更有资格教授这方面的知识。你现在在照顾的幼小的雏儿确实很幸运。"
 POD_education_events.111.option.a:0 "跟此新鲜的思维辩论，我将会学到很多东西"
 POD_education_events.111.option.b:0 "我有很多东西要教你"
 POD_education_events.22.t:0 "教育：灰烬骑士"
 POD_education_events.22.desc:0 "你的氏族具有强力的尚武传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这满是军伍思想的环境下，新的勇士将诞生于此。希望其忠诚于你。"
 POD_education_events.22.option.a:0 "再给我跑十圈！"
 POD_education_events.21.t:0 "教育：灰烬贵族"
 POD_education_events.21.desc:0 "你的氏族具有强力的贵族传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这上流环境下，新的暗夜贵族将诞生于此。希望其忠诚于你。"
 POD_education_events.21.option.a:0 "尊重优于你的，并利用剩下的"
 POD_education_events.23.t:0 "教育：灰烬执事"
 POD_education_events.23.desc:0 "你的氏族具有强力的治政传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这尽职环境下，新的暗夜间的统治者将诞生于此。希望其忠诚于你。"
 POD_education_events.23.option.a:0 "我会留意你的建议，以一定程度"
 POD_education_events.24.t:0 "教育：灰烬盗贼"
 POD_education_events.24.desc:0 "你的氏族具有强力的游荡传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这竞争环境下，新的暗夜间的狩猎者将诞生于此。希望其忠诚于你。"
 POD_education_events.24.option.a:0 "带走你的东西"
 POD_education_events.25.t:0 "教育：灰烬密教徒"
 POD_education_events.25.desc:0 "你的氏族具有强力的牟利于密教传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这书卷环境下，新的暗夜先知将诞生于此。希望其忠诚于你。"
 POD_education_events.25.option.a:0 "让他们赢得自己的救赎"