l_simp_chinese:
 PODanarchrevolt.0002.t:0 "大反乱"
 PODanarchrevolt.0002.desc:0 "随着裁判所的大火席卷整个欧洲，情况对血族社会来说变得越来越可怕。被用作可燃肉盾来对抗天主士兵的年轻吸血鬼，已经愤怒地站了起来反抗他们的长者，这就是现在所谓的「大反乱」。\n到目前为止，大反乱主要由雏儿、狂徒和布鲁赫以及一些机会主义者组成。但一些人担心，如果不采取措施，情况可能会像滚雪球一样继续壮大。这些叛党的每个个体是弱小的，但他们为了一种在血族中很罕见的东西而不懈地战斗：原则。"
 PODanarchrevolt.0002.a:0 "时间将会给这些年轻人教训。"
 PODanarchrevolt.0002.b:0 "世界上所有雏儿们，团结起来！"
 anarch_revolt_effect_message:0 "大多数年轻吸血鬼，布鲁赫和狂徒将加入叛党的事业。他们变得更加大胆，难以遏制。"
 anarch_revolt_name:0 "大反乱"
 anarch_revolt_doctrine_name:0 "自由斗士"
 anarch_revolt_doctrine_desc:0 "叛党为一些很少有该隐之子知道的事情而战：一项有价值的事业。"
 PODanarchrevolt.0004.t:0 "大反乱：勒森魃之死"
 PODanarchrevolt.0004.desc:0 "Although many are hard pressed to believe it, it seems that a cataclysmic event happened in Castel del Ombro recently. The center of power of Clan Lasombra has been the target of a daring assault lead by a group of Lasombra Anarchs helped by some of the best agents of the dreaded Assamite Warrior caste.\nThe reports of the actual assault are sketchy, and only one Lasombra emerged alive from the fortress but if he is to be believed... Lasombra himself is dead. This event has emboldened Anarchs everywhere, and a large majority of Clan Lasombra has now rallied to the cause of the rebellious childer. The Anarch Revolt is heating up night after night."
 PODanarchrevolt.0004.a:0 "他们应该掂量一下自己的分量！"
 PODanarchrevolt.0004.b:0 "也许我该反思一下我的立场……"
 lasombra_revolt_effect_message:0 "勒森魃氏族将加入叛党的事业。只有其中最强大的统治者会抵抗。"
 slayer_of_gods:0 "屠神者"
 slayer_of_gods_desc:0 "这位角色，大概，杀死了一位至高全能的上古耆宿。他赢得了同份量的尊敬和恐惧。"
 PODanarchrevolt.0006.t:0 "大反乱：艾布西密拉德之死"
 PODanarchrevolt.0006.desc:0 "The impossible has happened.\nIn one of the deepest forests of Russia, a group of Anarch Nosferatu managed to track down what they claimed to be the resting place of the monstrous progenitor of their clan, Absimilliard. After a terrible battle against the guardians of the tomb, only one of the assailants remained but he has, if he is to be believed, slain the Antediluvian in his sleep. All around the world, Clan Nosferatu is finally breathing free for the first time since its creation and now join their hero's ranks en masse.\nAll across Russia, the maniacal laugh of an old lady can be heard night after night since the event..."
 nosferatu_revolt_effect_message:0 "诺斯弗拉图氏族将加入叛党的事业。只有其中最强大的统治者会抵抗。"
 PODanarchrevolt.0008.t:0 "大反乱：伊娜依娅之死"
 PODanarchrevolt.0008.desc:0 "Grave news comes from the frozen North, the Anarch Gangrel pack that left to track down Ennoia, the progenitor of their clan, has returned. Or at least one of them.\nThis harrowed but proud survivor spins tales of wonders and monsters, of betrayals and battles worthy of Ragnarok itself. But, at the end, the warrior talks about the death of Ennoia, killed in her torpored sleep after the terrible fight against her tomb's guardians. Obviously, it is incredibly difficult to verify such claims but they've already had a powerful ripple effect in the Gangrel Clan as many have joined the Anarch cause. The revolt is heating up night after night."
 gangrel_revolt_effect_message:0 "冈格罗氏族将加入叛党的事业。只有其中最强大的统治者会抵抗。"
 PODanarchrevolt.0010.t:0 "大反乱：棘秘魑之死"
 PODanarchrevolt.0010.desc:0 "It happened again.\nA group of Tzimisce anarchs has made a raid against some elders of their clan, with the ostensible goal of securing the resting place of the Antediluvian. After acquiring this information, their army marched on the Monastery of Semog where a terrible battle ensued with the defending Szlachta. Emerging victorious, the Anarchs somehow managed to dispel the magical protections of the tomb and their leader greedily consumed Tzimisce himself.\nThis stunning victory has plunged the old clan into the hands of the Revolt, claiming their place as one of the few lineages that managed to get rid of its progenitor."
 tzimisce_revolt_effect_message:0 "棘秘魑氏族将加入叛党的事业。只有其中最强大的统治者会抵抗。"
 PODanarchrevolt.0012.t:0 "大反乱：亚力科之死"
 PODanarchrevolt.0012.desc:0 "Arikel, the progenitor of the Toreador clan, always appeared aloof from the Great Game played by the Antediluvians. It hasn't been enough to shield her from the Anarch Revolt though.\nReports have come to you that a daring force of Toreador anarchs has attacked her haven in Crete, apparently helped by information provided by some elder Nosferatu. The rest of the story is confusing, with some surviving members claiming that Arikel was asleep, while others speak of a great battle, but they all are in agreement saying that the Bull-Dancer of Enoch has fallen to her own lineage.\nEmboldened by this news, clan Toreador is now taking a much more active role in the Anarch Revolt."
 toreador_revolt_effect_message:0 "妥瑞朵氏族将加入叛党的事业。只有其中最强大的统治者会抵抗。"
 PODanarchrevolt.0014.t:0 "大反乱：梵卓之死"
 PODanarchrevolt.0014.desc:0 "Even the clan of Kings isn't spared the madness of the Anarch Revolt. Somewhere deep in Persia, a coterie of Ventrue anarchs stumbled upon the Antediluvian's tomb. Some say they were looking for Haqim, the Assamite's progenitor, and were misled by his cunning childer, others are simply talking about an obvious and quite crude powergrab.\nWhatever the actual reason, these Ventrue have returned, claiming the kill of their long missing progenitor. Although dubious, this claim has led many Ventrue into the Anarch Revolt, where they easily slip into leadership positions. Most Anarchs are concerned that this is a threat to the actual ideology of the Revolt, but they aren't really in a position to deny such a powerful helping hand reaching out to them."
 ventrue_revolt_effect_message:0 "梵卓氏族将加入叛党的事业。只有其中最强大的统治者会抵抗。"