l_simp_chinese:
 PODthorns.0002.t:0 "荆棘大会"
 PODthorns.0002.desc:0 "由自在[cainite|E]世界肆虐的大反乱，陪有仍然存在的裁判所，一件前所未有的事件发生了。几位来自不同[Clans|E]的长者呼吁召开一场和解大会，并为该血族建立一个新组织。\n这个组织，即秘盟，将是一个包罗万象的党派，它关心的是保护[masquerade|E]和维持长者与稚子之间的关系。许多血族，尤其是叛党们，对这一倡议持谨慎态度，但它已经是一个令人惊讶的政治成功，因为几乎整个欧洲的代表都聚集在了一起讨论这一提议。\n血族的未来，将可能在这英格兰小镇的邻近夜晚内决定。"
 PODthorns.0002.a:0 "改革即将来临"
 thorn_begins_effect_message:0 "每个[Clan|E]将会选择一个立场来对待这个提议。如果你足够强大，你就可以成为自己[Clan|E]的代表。"
 PODthorns.0003.t:0 "荆棘大会：梵卓"
 PODthorns.0003.desc:0 "旧习惯是永恒的，因此，梵卓[Clan|E]将迎接大会。许多人期望王者能找到一种方法来确保他们对任何新党派的领导。他们的选择也很可能影响到他们的传统对手，夜晚的统治者，勒森魃和棘秘魑。"
 PODthorns.0003.a:0 "秘盟就是未来。"
 PODthorns.0003.b:0 "我们永远不会成为这种疯狂行为的一部分！"
 PODthorns.0003.c:0 "中立性是我们生存的关键。"
 choose_camarilla_effect_message:0 "你加入秘盟，[Clan|E]的大部分人都会跟随你。"
 choose_opposition_effect_message:0 "你保持了你的立场，带着你[Clan|E]的大多数加入了叛党"
 choose_independance_effect_message:0 "你和你的[Clan|E]不进行任何改变。"
 PODthorns.0004.t:0 "荆棘大会：秘盟梵卓"
 PODthorns.0004.desc:0 "一个并不那么令人惊讶的决策，梵卓已经与新生的秘盟站到统一阵营，可能是希望在他们还可以的时候掌握权力。在其他代表讨论这一行动时，大会继续进行。"
 PODthorns.0004.a:0 "秘盟的胜利。"
 PODthorns.0004.b:0 "我必须加入他们！"
 PODthorns.0005.t:0 "荆棘大会：反方梵卓"
 PODthorns.0005.desc:0 "在荆棘大会的开始阶段，事态发生了令人惊讶的转折，当梵卓代表冲出谈判桌，称整个过程是一个悲哀的笑话。看来梵卓[Clan|E]将不会加入秘盟，并与叛党反方结盟，也许是希望给目前没有领导的运动带来秩序。"
 PODthorns.0005.a:0 "反方的胜利。"
 PODthorns.0006.t:0 "荆棘大会：中立梵卓"
 PODthorns.0006.desc:0 "在荆棘大会的开始阶段，事态发生了令人惊讶的转折，因为梵卓代表宣布在可预见的未来他的[Clan|E]会完全中立。也许梵卓没有资格领导这个新兴的党派？这是大胆的勒森魃和棘秘魑谈判代表所宣称的，他们现在嗅到了让自己担当领导角色的机会。"
 PODthorns.0006.a:0 "是什么让一个[Clan|E]变得中立？"
 PODthorns.0007.t:0 "荆棘大会：勒森魃"
 PODthorns.0007.desc:0 "当勒森魃的代表准备他的声明时，许多人期望贤士们能站在梵卓的对立面。毕竟，一个党派里容不下这么多掌权[Clans|E]。"
 PODthorns.0008.t:0 "荆棘大会：秘盟勒森魃"
 PODthorns.0008.desc:0 "在一场充满激情的演讲中，勒森魃的代表宣布，他的[Clan|E]完全支持新生的秘盟。已经并为其机构概述了计划，显然是遵循凡人教廷的圣秩制度，许多人期望贤士们担当新党派的领导席位。"
 PODthorns.0009.t:0 "荆棘大会：反方勒森魃"
 PODthorns.0009.desc:0 "看来秘盟会有一个强大的敌人，勒森魃[Clan|E]。它的代表诅咒了已决定的提议，匆忙地离开了大会。围绕着叛党功业，贤士们已经在为他们自己的新党派准备草案。"
 PODthorns.0010.t:0 "荆棘大会：中立勒森魃"
 PODthorns.0010.desc:0 "看来勒森魃[Clan|E]已经结束了对夜晚的统治者宝座的窥视。当他们的代表宣布他们的中立选择时，其他人已经在推测贤士们现在会把精力集中在更神秘的事情上。"
 PODthorns.0011.t:0 "荆棘大会：布鲁赫"
 PODthorns.0011.desc:0 "作为原初叛党运动的大部分成员，布鲁赫[Clan|E]的成员对如何面对大会仍然存在很大分歧。一些人认为这是耻辱的投降，另一些人则认为这是签订体面的和平协议的可能。在这样一个分歧和充满激情的谈判前景下，他们的代表将成为决定的声音。"
 PODthorns.0012.t:0 "荆棘大会：秘盟布鲁赫"
 PODthorns.0012.desc:0 "终于，布鲁赫放下了武器。这是一个漫长而艰难的过程，但和平协议已经签署。这个[Clan|E]现在是秘盟不可分割的一部分，尽管其强硬派对此颇有怨言。"
 PODthorns.0013.t:0 "荆棘大会：反方布鲁赫"
 PODthorns.0013.desc:0 "战争从不改变，布鲁赫也不会。反叛的[Clan|E]拒绝下台并与新生的秘盟签署和平协约。大反乱仍将继续，但一些人正在考虑将分裂的运动改革成一个更有凝聚力的派别，以便更好地继续战斗。"
 PODthorns.0014.t:0 "荆棘大会：中立布鲁赫"
 PODthorns.0014.desc:0 "几乎没有人能预测到布鲁赫[Clan|E]谈判的结果。在一场坚定的演讲中，其代表只是说，他们永远不会再向另一权威低头。因此，布鲁赫离开大会时就像他们进入大会时一样分裂。"
 PODthorns.0015.t:0 "荆棘大会：末卡维"
 PODthorns.0015.desc:0 "让我们说亮话吧。没有人知道末卡维[Clan|E]在大会上将采取什么立场，甚至可能连他们的代表都不知道。然而，尽管他们很危险，但不能低估这些疯子，聚集在这里的许多派别都在博取他们。"
 PODthorns.0016.t:0 "荆棘大会：秘盟末卡维"
 PODthorns.0016.desc:0 "末卡维族[Clan|E]加入了秘盟，得到了该党派代表谨慎的掌声。尽管有些人会把这种帮助称为诅咒，但新生的秘盟似乎满足于危险的先知站在他们一边。"
 PODthorns.0017.t:0 "荆棘大会：反方末卡维"
 PODthorns.0017.desc:0 "看来末卡维[Clan|E]已经预见到了……关于大反乱的重要事情。他们的代表，用一种骇人听闻的方式描述了一件末日事件，正式召集了他的[Clan|E]加入了大反乱的功业。对于叛党而言，它们和其他人一样对这一突然的转折感到惊讶。"
 PODthorns.0018.t:0 "荆棘大会：中立末卡维"
 PODthorns.0018.desc:0 "作为一个由先知和议员组成的[Clan|E]，末卡维已经在持续的冲突中表明了他们的中立立场。看来每个人在将来都有可能享受到利用它们的乐趣。"
 PODthorns.0019.t:0 "荆棘大会：妥芮朵"
 PODthorns.0019.desc:0 "尽管米迦勒早已离去，妥芮朵仍然是一个强大的[Clan|E]，在欧洲有着坚实的权力基础。因为他们是第一个提出在秘盟实施强迫性[masquerade|E]的想法的人，他们很可能会选择这个党派。但是他们热情的天性也会使他们亲近大反乱……"
 PODthorns.0020.t:0 "荆棘大会：秘盟妥芮朵"
 PODthorns.0020.desc:0 "不出所料，妥芮朵[Clan|E]正式加入了秘盟，他们对执行[masquerade|E]的关心超过了他们的热情。"
 PODthorns.0021.t:0 "荆棘大会：反方妥芮朵"
 PODthorns.0021.desc:0 "当妥芮朵代表发表了激动人心的演说赞扬叛党功业时，燃烧的激情和情感赢得了那一天。看来妥芮朵与掌权[Clans|E]的传统联盟结束了，目前而言。"
 PODthorns.0022.t:0 "荆棘大会：中立妥芮朵"
 PODthorns.0022.desc:0 "令每个人惊讶的是，妥芮朵代表宣布在可预见的未来，他的[Clan|E]保持中立。也许玫瑰厌倦了战争和叛乱？"
 PODthorns.0023.t:0 "荆棘大会：睿魔尔"
 PODthorns.0023.desc:0 "魔法师爆炸性地进入了血族的政治世界，许多人都希望看到他们被永远地粉碎。他们很可能会加入秘盟，希望能在那里找到庇护，作为交换，他们掌握了强大的血术法供党派使用。"
 PODthorns.0024.t:0 "荆棘大会：秘盟睿魔尔"
 PODthorns.0024.desc:0 "就像大多数大会成员所期待的那样，睿魔尔宣誓效忠秘盟。许多人已经将他们视为这个新生党派的宝座背后的真正力量。"
 PODthorns.0025.t:0 "荆棘大会：反方睿魔尔"
 PODthorns.0025.desc:0 "大会上出现了令人惊讶的反转，因为睿魔尔宣布支持叛党运动。这是他们金字塔的失败，还是更宏伟计划的一部分？"
 PODthorns.0026.t:0 "荆棘大会：中立睿魔尔"
 PODthorns.0026.desc:0 "看起来魔法师将不会屈服于任何人，除了他们自己，因为他们的代表已经宣布他们在持续的冲突中保持中立。毫无疑问，他们作为雇佣兵的服务将会备受追捧。"
 PODthorns.0027.t:0 "荆棘大会：棘秘魑"
 PODthorns.0027.desc:0 "强大的东欧魔物[Clan|E]预计将采取立场，反对令人讨厌的大敌睿魔尔。许多年长的成员也认真考虑过保持中立，因为他们大多不关心他们阴暗城堡之外的世界。"
 PODthorns.0028.t:0 "荆棘大会：秘盟棘秘魑"
 PODthorns.0028.desc:0 "尽管争论很激烈，棘秘魑[Clan|E]还是同意加入秘盟。很多细节仍有待讨论，比如在特兰西瓦尼亚的[masquerade|E]……"
 PODthorns.0029.t:0 "荆棘大会：反方棘秘魑"
 PODthorns.0029.desc:0 "困惑和愤怒在荆棘大会上蔓延开来，因为棘秘魑代表刚刚向他的对手丢了他的一块肥大的身体部位，然后冲了出去。看来棘秘魑对秘盟的提议不太满意。"
 PODthorns.0030.t:0 "荆棘大会：中立棘秘魑"
 PODthorns.0030.desc:0 "棘秘魑[Clan|E]最年长的成员似乎赢得了内部辩论，因为他们的代表刚刚宣布魔物在这场正在进行的战争中保持中立。许多人因特兰西瓦尼亚的[masquerade|E]状况而对该决定表示担忧。"
 PODthorns.0031.t:0 "荆棘大会：冈格罗"
 PODthorns.0031.desc:0 "冈格罗不能再否认了，他们的世界正在灭亡。不管他们在夜空下如何英勇，他们的凡人都在被十字架或新月所动摇。在这个快速变化的环境中，许多人都在寻找归属感。每个派系都想成为该归属地。"
 PODthorns.0032.t:0 "荆棘大会：秘盟冈格罗"
 PODthorns.0032.desc:0 "冈格罗代表勉强接受了加入秘盟。也许这个[Clan|E]现在会找到一个新的目标，成为这个党派的执行者和血之猎犬。"
 PODthorns.0033.t:0 "荆棘大会：反方冈格罗"
 PODthorns.0033.desc:0 "有些人会说，冈格罗已经屈服于他们野性的一面，因为他们选择承诺支持叛党功业，也许是为了寻求一场值得一打的战争。无论如何，这对叛党来说是一个巨大的福音。"
 PODthorns.0034.t:0 "荆棘大会：中立冈格罗"
 PODthorns.0034.desc:0 "机警的冈格罗[Clan|E]似乎已经受够了这个自己置身其中的陌生新世界。宣布了中立，只有它们才会选择下一个猎物。"
 PODthorns.0035.t:0 "荆棘大会：诺斯费拉图"
 PODthorns.0035.desc:0 "乍一看，诺斯费拉图似乎对秘盟很感兴趣。他们总是在寻找皮肤来对抗他们始祖的恐怖阴影，他们寻求数量带来的力量。然而，凭借精明的外交手腕，他们可以找到其他力量。"
 PODthorns.0036.t:0 "荆棘大会：秘盟诺斯费拉图"
 PODthorns.0036.desc:0 "当诺斯费拉图的代表宣布他的[Clan|E]完全支持新生的秘盟时，这并不令人惊讶。从现在起，这个新党派可以依靠一个忠诚而强大的线人网络。"
 PODthorns.0037.t:0 "荆棘大会：反方诺斯费拉图"
 PODthorns.0037.desc:0 "在荆棘大会期间，诺斯费拉图加入了叛党运动。许多人想知道隐匿之人是否有一些秘密信息打破了对秘盟的平衡局势……"
 PODthorns.0038.t:0 "荆棘大会：中立诺斯费拉图"
 PODthorns.0038.desc:0 "过了几个晚上人们才注意到这一点，但诺斯费拉图的代表已经从大会上消失了。看来隐匿之人不会参与党派的诞生。"
 PODthorns.0039.t:0 "荆棘大会：赛特信徒"
 PODthorns.0039.desc:0 "虽然他们已经被正式邀请加入秘盟，但没有人真的认为赛特的子嗣们会接受。他们神秘的行事方式使他们与新党派的框架非常不一致。"
 PODthorns.0040.t:0 "荆棘大会：秘盟赛特之子"
 PODthorns.0040.desc:0 "当赛特信徒代表在震惊的观众面前接受加入秘盟的提议时，所有人都在猜测这一选择背后的动机是什么。古蛇刚刚被允许进入庭园了吗？"
 PODthorns.0041.t:0 "荆棘大会：反方赛特之子"
 PODthorns.0041.desc:0 "秘盟，一个吸血鬼的中央集权机构的诞生，似乎比任何人想象的都更激怒了赛特之子。在谈到赛特作为“伟大的解放者”的看法时，他们的代表承诺[Clan|E]要为叛党的功业奋斗。"
 PODthorns.0042.t:0 "荆棘大会：中立赛特之子"
 PODthorns.0042.desc:0 "赛特之子的代表礼貌地拒绝了秘盟半心半意的提议，却做了一件每个人都认为最有可能的结果：在持续的斗争中，确认了他的[Clan|E]的中立性。"
 PODthorns.0043.t:0 "荆棘大会：阿刹迈"
 PODthorns.0043.desc:0 "当奥斯曼帝国的扩张威胁到欧洲时，新生的秘盟在如何处理这一问题上存在分歧。阿刹迈在土耳其人的阴影下一直非常活跃，荆棘大会将是双方解决分歧的一个至少尝试机会。"
 PODthorns.0044.t:0 "荆棘大会：秘盟阿刹迈"
 PODthorns.0044.desc:0 "在两派令人惊讶的外交表现中，阿刹迈和秘盟达成了一项开创性的安排，使哈基姆的子嗣牢固地加入了新党派。东西方关系的新时代正在开启。"
 PODthorns.0045.t:0 "荆棘大会：反方阿刹迈"
 PODthorns.0045.desc:0 "秘盟和阿刹迈之间的谈判已经破裂。整个大会似乎使事情变得更糟，因为哈基姆的子嗣们承诺帮助叛党运动，以期望打破旧的和新的欧洲[cainites|E]秩序。"
 PODthorns.0046.t:0 "荆棘大会：中立阿刹迈"
 PODthorns.0046.desc:0 "阿刹迈的代表离开了大会，不过什么也没改变。哈基姆的子嗣们对西方[cainites|E]事务的脆弱中立仍在继续。"
 PODthorns.0047.t:0 "荆棘大会：卡帕多西亚"
 PODthorns.0047.desc:0 "死亡之[Clan|E]一直以来都四分五裂，并经历了多次的清洗和重组。但即使如此，它依然一直是个受人尊敬的[Clan|E]，虽然他们有隐居的习惯，但也收到了加入秘盟的正式邀请。"
 PODthorns.0048.t:0 "荆棘大会：秘盟卡帕多西亚"
 PODthorns.0048.desc:0 "经过长时间的讨论，秘盟和死亡之[Clan|E]似乎已经达成了协议。因此这新生派系又多了一个成员，并已经在为这个成就而自喜了。"
 PODthorns.0049.t:0 "荆棘大会：反方卡帕多西亚"
 PODthorns.0049.desc:0 "尽管没人清楚到底发生了什么，但秘盟和死亡之[Clan|E]之间的谈判已经完全翻转。这个[Clan|E]觉得自己受到了侮辱，于是选择加入到叛党的运动当中，而叛党对这种突如其来的支持感到相当惊讶。"
 PODthorns.0050.t:0 "荆棘大会：中立卡帕多西亚"
 PODthorns.0050.desc:0 "正如大会中大多数人所预料的那样，死亡之[Clan|E]已宣布在正在进行的冲突中保持中立。他们将一如既往地保持其神秘而隐遁的学者群体。"
 PODthorns.0051.t:0 "荆棘大会：萨洛比"
 PODthorns.0051.desc:0 "尽管有许多敌人，萨洛比仍然是一支不容小觑的力量。他们一直忍耐到今晚，显然有被邀请参加大会。大多数人认为他们会站在令人憎恨的睿魔尔[Clan|E]的对立面，但保持中立也是一个很大的可能性，因为无休止的战争已经让他们付出了沉重的代价。"
 PODthorns.0052.t:0 "荆棘大会：秘盟萨洛比"
 PODthorns.0052.desc:0 "秘盟庆祝萨洛比正式加入他们。他们已经承诺帮助遏制关于他们新盟友的虚假信息，并恢复他们作为医者[Clan|E]的真实地位。"
 PODthorns.0053.t:0 "荆棘大会：反方萨洛比"
 PODthorns.0053.desc:0 "复仇是萨洛比[Clan|E]当下的主题。他们想要为他们所忍受的一切恐怖报复，他们在叛党运动中找到了新的盟友。也许是共同的苦难让他们走到了一起。"
 PODthorns.0054.t:0 "荆棘大会：中立萨洛比"
 PODthorns.0054.desc:0 "他们的生存之战让萨洛比[Clan|E]付出了很多代价。是时候让他们的灵魂和身体都得到治愈了。他们的代表用这些话证实了[Clan|E]在目前的危机中的中立态度。"
 PODthorns.0055.t:0 "荆棘大会：雷伏诺"
 PODthorns.0055.desc:0 "对于西方的[cainites|E]来说，雷伏诺一直是局外人，但随着印度[Clan|E]在欧洲越来越多地登场，这种情况正在迅速改变。尽管大多数人认为他们会在正在进行的战争中保持谨慎的中立，但他们还是被邀请参加大会，以示对这种新获得的力量的认可。"
 PODthorns.0056.t:0 "荆棘大会：秘盟雷伏诺"
 PODthorns.0056.desc:0 "在这重大的时刻，雷伏诺下了于欧洲迄今为止最关键的一步：他们决定加入新生的秘盟。该党派在宣布结盟时感到谨慎的乐观。"
 PODthorns.0057.t:0 "荆棘大会：反方雷伏诺"
 PODthorns.0057.desc:0 "出乎大家意料的是，雷伏诺[Clan|E]支持了叛党运动。这是他们刚到欧洲时受到西方亲王恶劣对待的结果吗？几乎没有人能回答，但叛党张开双臂欢迎它们的新兄弟。"
 PODthorns.0058.t:0 "荆棘大会：中立雷伏诺"
 PODthorns.0058.desc:0 "正如大多数人所预料的那样，雷伏诺已经证实了他们在长者和稚子之间的战争中保持中立。印度[Clan|E]距离这盘棋很远，仍在艰难地争取被这些遥远的土地所接受。"
 PODthorns.0059.t:0 "荆棘大会：劣族"
 PODthorns.0059.desc:0 "两个世纪前，劣族还只存在于传闻，一旦他们出现在城市里，就会被猎杀而死。但时代变了，他们不能再被忽视了。他们邀请自己参加大会，并希望帮助叛党运动，叛党运动与他们有许多共同的不满。"
 PODthorns.0060.t:0 "荆棘大会：秘盟劣族"
 PODthorns.0060.desc:0 "大会上出现了令人震惊的进展，劣族加入了秘盟。经过多次辩论，以及对拟议的官方党派宪法的修改，两派达成了一致。一个新的黎明为被蹂躏的[cainite|E]种族而闪耀。"
 PODthorns.0061.t:0 "荆棘大会：反方劣族"
 PODthorns.0061.desc:0 "叛党运动发现自己得到了劣族的支持。这并不令人惊讶，因为他们大多都有同样的敌人和不满之处，但对稚子的功业来说仍然是一个巨大的福音。"
 PODthorns.0062.t:0 "荆棘大会：中立劣族"
 PODthorns.0062.desc:0 "劣族在大会上选择了谨慎的行动方针。尽管他们对秘盟有疑虑，但他们正试图通过宣布中立而不进一步与它对抗。"
 PODthorns.0063.t:0 "荆棘大会：结束"
 PODthorns.0063.desc:0 "当最后一批代表离开会场时，每个人都已经在计划下一步行动了。秘盟还没有达到它计划中的对血族的绝对统治。反方则正在讨论将叛党运动改革成一个全新的组织来对抗秘盟。最后，中立派正在准备协议和结盟，以确保他们的生存。一个充满不确定的未来新[cainite|E]时代开始了。"
 PODthorns.0063.a:0 "这场大棋的下一步又将如何？"