l_simp_chinese:
 PODbirthsabbat.0002.t:0 "新教派的诞生"
 PODbirthsabbat.0002.desc:0 "虚伪、无耻、傲慢的荆棘条约现已成为过去，新成立的「秘盟」认为他们已经取得了胜利，并确保了大反乱的结束。\n你应知道。这次运动唯一需要赢得的是一个强大又集权的领导。你的领导。从荆棘条约开始你就一直在思考这个问题，如果你能创建一个教派来反抗秘盟呢？\n大多数叛党已经加入了这个崭新又诱人的事业。魔宴正在崛起，而你愿意做它的先驱么？"
 PODbirthsabbat.0002.a:0 "该隐需要一位摄政。他需要我。"
 PODbirthsabbat.0002.b:0 "……这是一个很坏的主意"
 sabbat_founder_modifier:0 "魔宴创始人"
 sabbat_founder_modifier_desc:0 "这个角色是可怕的魔宴的创始人之一。他总是受到无情的黑手的保护，在这个教派互战时代，他拥有相当大的权力。"
 sabbat_begins_effect_message:0 "大多数叛党都已经加入了新生的魔宴"
 PODbirthsabbat.0004.t:0 "魔宴的诞生"
 PODbirthsabbat.0004.desc:0 "大反乱受到了荆棘条约和秘盟诞生的有力打击。然而，该运动并没有消亡，实际上它已经重生，变得更加……有罪。\n这个自称为魔宴的新教派在心怀不满的叛党中积聚了巨大的动力。它的核心信条仍然是相当模糊的，但对秘盟的敌意是明显的，因此潜藏更松懈，而对该隐本人的崇拜则被允许。这些改革后的叛党是否只是新该隐之子秩序的一个小麻烦，还是能否能够再次改变暗夜的风景呢，仍需观察。"
 PODbirthsabbat.0004.a:0 "也许他们是对的?"
 PODbirthsabbat.0004.b:0 "他们根本没有机会"