l_simp_chinese:
 POD_anteshuntabsi.1.t:0 "猎神"
 POD_anteshuntabsi.1.desc:0 "大反乱是前所未有的危机……和机遇。由于大多数氏族处于混乱，和裁判所在阻止长者们进行远程交流，古老的该隐之子前所未有地脆弱。\n一些报复心最强烈的叛党正计划大胆的袭击这些氏族的始祖——上古耆宿，希望重演睿魔尔对扫罗的吸榨。你愿意一试吗？潜在的回报是诱人的，但风险……远远超出想象。这些实体比起人，更接近于神。"
 POD_anteshuntabsi.1.a:0 "我将狩猎狩猎者——诺斯费拉图的艾布西密拉德"
 POD_anteshuntabsi.1.b:0 "……我不想找死"
 big_freaking_warning:0 "#R 你成功的机会低得离谱。如果你在乎你角色的存续，就不要尝试这样做。你已经被警告过了。#"
 POD_anteshuntabsi.2.t:0 "猎神：找到鬼婆"
 POD_anteshuntabsi.2.desc:0 "艾布西密拉德的所在地不为人知，这是你的追求要克服的第一个障碍。唯一有线索的人可能是芭芭雅嘎，他的任性的子嗣，也是他长期以来愤怒的目标。问题是……她也躲起来了。\n要想找到她，你可以痛苦地自己寻找任何有关她的信息，或者向她的副手，暗影帷幕的维克多咨询，寻求组成对抗艾布西密拉德的潜在联盟。如果维克多还活着，并且还活跃着。"
 POD_anteshuntabsi.2.a:0 "我会亲自找到她的！"
 POD_anteshuntabsi.2.effect.success.desc:0 "你的追求又向前推进了一步"
 POD_anteshuntabsi.2.critical.failure.effect.desc:0 "一次挫折，却不是整件事的终结"
 POD_anteshuntabsi.2.b:0 "我会和维克多找到共同点的"
 POD_anteshuntabsi.2.c:0 "亲爱的祖母，是时候反击了！"
 skip_viktor:0 "作为维克多，你可以跳过这个阶段。你知道芭芭雅嘎在哪。"
 POD_anteshuntabsi.2.d:0 "我是她的天选选民，我知道她在哪！"
 skip_objectivedone:0 "由于体贴的祖母的目标已经被完成，芭芭雅嘎早就展露了自己。你可以安全地跳过这个阶段。"
 POD_anteshuntabsi.4.t:0 "猎神：强行向前"
 POD_anteshuntabsi.4.desc:0 "到目前为止，你还无法获得艾布西密拉德的所在地，这是你杀死艾布西密拉德的追求的第一步。\n你需要加强你的研究，这意味着更多的金钱、时间和整体资源的花费，这很可能是一个愚蠢的错误。也许是时候重新考虑这个行径了……或者不管不顾地继续下去。"
 POD_anteshuntabsi.4.a:0 "我不会这么容易就被挫败！"
 anteabsi_continue:0 "你的追求继续"
 POD_anteshuntabsi.4.b:0 "我怂了"
 anteabsi_end:0 "你的追求终于此"
 POD_anteshuntabsi.3.t:0 "猎神：夜中匕首"
 POD_anteshuntabsi.3.desc:0 "你正准备前往芭芭雅嘎的家，却接到关于神秘谋杀案的报告。你的一个随行人员被暗杀了，这其实并不奇怪，但袭击的细节更令人关注。\n凶手在受害者附近的墙上留下了一个用血写的字：“尼克图库”。\n你在研究艾布西密拉德的时候听说过这个词，似乎是他的血缚子嗣，没有灵魂的杀人机器，一心想要摧毁任何威胁到他们始祖的事物。\n看来你现在是他们的候选名单上的一员。而且你很确定你必须在他们对付你之前对付他们……"
 POD_anteshuntabsi.3.a:0 "我必须尽快阻止他们"
 anteabsi_nictuku:0 "你现在有五个决议来摆脱尼克图库对你的追踪。如果能完成，将有助于你追求的后期阶段。"
 abraxes_decision:0 "对付奥巴瑟"
 abraxes_decision_tooltip:1 "迷惑迷雾之主"
 abraxes_decision_desc:0 "尼克图库奥巴瑟是位诈骗大师。你必须编造一些误导线索来让他不再纠缠你。"
 abraxes_decision_effect_tooltip:1 "奥巴瑟将不会干涉你追求的后期阶段"
 abraxes_decision_confirm:0 "让它完成"
 echidna_decision:0 "对付厄喀德那"
 echidna_decision_tooltip:1 "愚弄愚弄之母"
 echidna_decision_desc:0 "尼克图库厄喀德那是恐怖之母。你必须编造一些误导线索来让她不再纠缠你。"
 echidna_decision_effect_tooltip:1 "厄喀德那将不会干涉你追求的后期阶段"
 echidna_decision_confirm:0 "让它完成"
 gorgo_decision:0 "对付戈尔戈"
 gorgo_decision_tooltip:1 "沉默那于黑暗中尖嚎之女"
 gorgo_decision_desc:0 "尼克图库戈尔戈是噩梦之主。你必须编造一些误导线索来让她不再纠缠你。"
 gorgo_decision_effect_tooltip:1 "戈尔戈将不会干涉你追求的后期阶段"
 gorgo_decision_confirm:0 "让它完成"
 nuckalavee_decision:0 "对付纳克拉维"
 nuckalavee_decision_tooltip:1 "驯服无皮者"
 nuckalavee_decision_desc:0 "尼克图库纳克拉维是地狱骐骥。你必须编造一些误导线索来让他不再纠缠你。"
 nuckalavee_decision_effect_tooltip:1 "纳克拉维将不会干涉你追求的后期阶段"
 nuckalavee_decision_confirm:0 "让它完成"
 gayomart_decision:0 "对付加约玛特"
 gayomart_decision_tooltip:1 "移动固者"
 gayomart_decision_desc:0 "尼克图库加约玛特是位坚定的战士。你必须编造一些误导线索来让他不再纠缠你。"
 gayomart_decision_effect_tooltip:1 "加约玛特将不会干涉你追求的后期阶段"
 gayomart_decision_confirm:0 "让它完成"
 babayaga_bound_modifier:0 "缚于鬼婆"
 babayaga_bound_modifier_desc:1 "你属于芭芭雅嘎。即使保持你的理智完好无损也被证明是困难的。"
 POD_anteshuntabsi.5.t:0 "猎神：祖母之助"
 POD_anteshuntabsi.5.desc:0 "你找到了芭芭雅嘎。该难以捉摸的诺斯费拉图和你想象的一样可怕，但她也不是傻瓜。她知道大反乱带来的可能性，并且正在听你提出结盟打击她可怕的尊长。\n你说完话后的沉默是漫长而又令人生厌的，直到她向你伸出手臂时才被打破。信息很明确，她想让你喝一口她的血，这会让你对她忠诚。\n这是一个沉重的代价，但如果没有她的帮助，你没有机会打败艾布西密拉德，甚至找不到他！"
 POD_anteshuntabsi.5.a:0 "如果这是唯一的办法的话……"
 POD_anteshuntabsi.5.b:0 "拔腿就跑！"
 POD_anteshuntabsi.5.effect.success.desc:0 "你设法逃跑了！"
 POD_anteshuntabsi.5.critical.failure.effect.desc:0 "你被抓住了……"
 POD_anteshuntabsi.5.critical.failure:0 "进锅！"
 anteabsi_end_baba:0 "该选择将结束你的追求……也许还包括你的亡生"
 POD_anteshuntabsi.6.t:0 "猎神：进入森林"
 POD_anteshuntabsi.6.desc:0 "你的猎物在俄罗斯荒野深处的某个地方。你已经召集了你最值得信赖的同伴，芭芭雅嘎也是如此。总而言之，这是一支强大的队伍，现在正走在你的身边，但是……你还远远没有信心。\n艾布西密拉德肯定会有几个致命的保障措施来保护他的歇息地，甚至连鬼婆自己也对可能在等你的可怕的尼克图库有所警惕。\n这是你的追求的最后一步，但它可能是最困难的一步。"
 POD_anteshuntabsi.6.a:0 "现在没有回头路了"
 POD_anteshuntabsi.7.t:0 "猎神：达瓦之怒"
 POD_anteshuntabsi.7.desc:0 "当你走入密林时，你的队伍突然遭到一群可怕的野兽般的狼人们的伏击。这些生物行动迅速，每次杀戮后都会退入森林。\n直到芭芭雅嘎的副手之一达瓦·格罗兹尼突然追着它们冲了过来。野兽们措手不及，无法迅速逃离。很快，狂野的棘秘魑就盯上了他们，并成功地将他们拖住，足以让你的队伍将他们砍成碎片。\n你继续你的路途，你的探险队大部分都是完整的。"
 POD_anteshuntabsi.7.a:0 "鬼婆能提供有用的盟友"
 darvaghelped:0 "达瓦·格罗兹尼还活着，所以你能跳过该历程部分"
 POD_anteshuntabsi.8.t:0 "猎神：猛兽之怒"
 POD_anteshuntabsi.8.desc:0 "当你走入密林时，你的队伍突然遭到一群可怕的野兽般的狼人们的伏击。这些生物行动迅速，每次杀戮后都会退入森林。\n必须应对这些无情的攻击，否则你的随行人员就会被一一分而食之。你可以为它们设置一个陷阱，或者准备一个坚固的防御。\n无论如何，必须做点什么，很快，你就能听到你位置附近再次传来狼群的嚎叫声……"
 POD_anteshuntabsi.8.a:0 "排成圆阵！"
 POD_anteshuntabsi.8.effect.success.desc:0 "你击退了怪物，你的追求继续"
 POD_anteshuntabsi.8.critical.failure.effect.desc:0 "又一战死之人……"
 POD_anteshuntabsi.8.critical.failure:0 "你被吃了"
 POD_anteshuntabsi.9.t:0 "猎神：古特卡的牺牲"
 POD_anteshuntabsi.9.desc:0 "有一头巨大的生物挡住了你的路。这只有鳞的，油腻的，浑身显着恶心的东西，和你以前遇到的任何东西都不一样。芭芭雅嘎形容它是她的尊长的“最爱宠物”。而且它挡住了你的路。\n幸运的是，鬼婆有一个解决方案：把被称为“古特卡”的可怜生物扔到它身上。自从你离开后，这只吸血鬼的躯壳就一直跟着你，显然它找到了自己的用处，为你争取了一些时间来绕过艾布西密拉德的“宠物”。\n谁知道呢？这只怪物也许会能可怜另一只怪物。"
 POD_anteshuntabsi.9.a:0 "鬼婆能提供有用的盟友"
 gutkahelped:0 "古特卡还活着，所以你能跳过该历程部分"
 POD_anteshuntabsi.10.t:0 "猎神：艾布西密拉德的宠物"
 POD_anteshuntabsi.10.desc:0 "有一头巨大的生物挡住了你的路。这只有鳞的，油腻的，浑身显着恶心的东西，和你以前遇到的任何东西都不一样。芭芭雅嘎形容它是她的尊长的“最爱宠物”。而且它挡住了你的路。\n没有办法绕过它，你必须要战斗。那东西可以把你劈成两半，只要用手一挥……爪一挥……不管是什么，但你已经无法回头了。"
 POD_anteshuntabsi.10.a:0 "我应该重新考虑我的人生选择"
 POD_anteshuntabsi.10.effect.success.desc:0 "你杀死了怪物，你的追求继续"
 POD_anteshuntabsi.10.critical.failure.effect.desc:0 "又一战死之人……"
 POD_anteshuntabsi.10.critical.failure:0 "你裂开了"
 POD_anteshuntabsi.11.t:0 "猎神：暹罗的机灵"
 POD_anteshuntabsi.11.desc:0 "你迷路了。已经无法否认。森林在对你耍花招，掩盖你的足迹，或者突然改变你面前的道路。你所在处没有无限的血液补给，所以你必须迅速行动。\n幸运的是，你的队伍里有一位俄罗斯最好的追踪者，暹罗。这位令人不安的鬼婆的 “外孙”很快就会带领你走出这个不自然的迷宫，提醒你在路途中多么需要芭芭雅嘎的帮助。"
 POD_anteshuntabsi.11.a:0 "鬼婆能提供有用的盟友"
 siamkohelped:0 "暹罗还活着，所以你能跳过该历程部分"
 POD_anteshuntabsi.12.t:0 "猎神：迷失"
 POD_anteshuntabsi.12.desc:0 "你迷路了。已经无法否认。森林在对你耍花招，掩盖你的足迹，或者突然改变你面前的道路。你所在处没有无限的血液补给，所以你必须迅速行动。\n在你的随行人员中，有那样的年老强大的吸血鬼，所以你估计养料的缺乏很快就会变成一场血腥的屠杀。这迷宫里一定有线索或者规律，你可以利用它趁早逃出去。"
 POD_anteshuntabsi.12.a:0 "这边……还是那边？"
 POD_anteshuntabsi.12.effect.success.desc:0 "你找到了一条出口，你的追求继续"
 POD_anteshuntabsi.12.critical.failure.effect.desc:0 "迷失在森林中"
 POD_anteshuntabsi.12.critical.failure:0 "没有出口"
 POD_anteshuntabsi.13.t:0 "猎神：奥巴瑟"
 POD_anteshuntabsi.13.desc:0 "当你继续深入森林的旅程时，一团浓雾突然降临在你的队伍中。显然是有超自然因素作祟，它实在的阻碍了你的视野，你很快就被与你的同伴分割。\n而这时，尖叫声开始响起。\n你一次次被伏击，你的敌人利用这雾气的掩护将你隔离。如果你不迅速找到摆脱这种局面的方法，很快就会全军覆没。"
 POD_anteshuntabsi.13.a:0 "围到我身边来！"
 POD_anteshuntabsi.13.effect.success.desc:0 "敌人再也不敢攻击了。你的追求继续。"
 POD_anteshuntabsi.13.critical.failure.effect.desc:0 "又一战死之人……"
 POD_anteshuntabsi.13.critical.failure:0 "灭于迷雾"
 POD_anteshuntabsi.14.t:0 "猎神：厄喀德那"
 POD_anteshuntabsi.14.desc:0 "吸血鬼是不会生病的。这是你很久之前了解到自己状况时知道得第一件事。那么……为什么你现在感觉如此糟糕？而且你也不是唯一的一个，因为你的整个队伍似乎突然被森林里散发出来的污秽之气所影响。\n芭芭雅嘎认为，这是尼克图库之一的厄喀德那所为。鬼婆正在准备一种药水来帮助你生存，但她需要一些非常特殊的成分，而你的时间不多了。你必须快准狠。"
 POD_anteshuntabsi.14.a:0 "采蘑菇自救……"
 POD_anteshuntabsi.14.effect.success.desc:0 "我感觉好多了！"
 POD_anteshuntabsi.14.critical.failure.effect.desc:0 "那颜色看着不太对劲……"
 POD_anteshuntabsi.14.critical.failure:0 "终于疾病"
 POD_anteshuntabsi.15.t:0 "猎神：戈尔戈"
 POD_anteshuntabsi.15.desc:0 "这片被诅咒的森林从你的旅程开始就一直在让你紧张，但情况却越来越糟。一阵震耳欲聋的尖嚎声在不久前就开始作响，而且似乎是从你周围的各个地方传来的。\n而且也不是单纯的凡人或动物的尖叫，当你的耳朵里开始涌出鲜血时，你很快就意识到这一点。你必须找到它的源头，并迅速将其清除，否则你就会失血过多。对于一个不死的血蛭来说，这是一种讽刺的命运。"
 POD_anteshuntabsi.15.a:0 "你能闭嘴么？！"
 POD_anteshuntabsi.15.effect.success.desc:0 "安宁与平静终于来临"
 POD_anteshuntabsi.15.critical.failure.effect.desc:0 "你没有足够快地找到来源……"
 POD_anteshuntabsi.15.critical.failure:0 "终于尖嚎"
 POD_anteshuntabsi.16.t:0 "猎神：纳克拉维"
 POD_anteshuntabsi.16.desc:0 "你的队伍被……不知什么攻击了。一群像马一样的怪物从树林里涌了出来，踩死了你的几个追随者。你很快就躲到了一边，但从它们的蹄声来看，它们很快就会从另一边发动攻击。\n如果你的随行人员像现在这样彻底的乱了阵脚，很可能这群群落每次出击都会把你们踩在脚下，直到没有人站起来。你必须迅速做出反应，才能扭转战局。"
 POD_anteshuntabsi.16.a:0 "准备迎接他们的冲锋！"
 POD_anteshuntabsi.16.effect.success.desc:0 "你把他们推了回去！"
 POD_anteshuntabsi.16.critical.failure.effect.desc:0 "他们把你踩踏至死"
 POD_anteshuntabsi.16.critical.failure:0 "死于踩踏"
 POD_anteshuntabsi.17.t:0 "猎神：加约玛特"
 POD_anteshuntabsi.17.desc:0 "你已经接近旅程的终点了，你能感觉到。但有一个新的障碍在你的路上，森林的变换道路的速度正在加快，而且越来越没有意义。很明显，其中尼克图库中的一位在玩弄你，可能是想孤立你，或者把你逼疯。\n在经历了如此艰辛的旅程后，你的意志力还能承受多少，是有限度的，你想结束它。你必须找到一种规律，一种线索，甚至只是用蛮力，来迅速走出这个幻境。"
 POD_anteshuntabsi.17.a:0 "我厌倦了这些把戏！"
 POD_anteshuntabsi.17.effect.success.desc:0 "你驱散了幻境"
 POD_anteshuntabsi.17.critical.failure.effect.desc:0 "我太累了……"
 POD_anteshuntabsi.17.critical.failure:0 "失于迷宫"
 POD_anteshuntabsi.18.t:0 "猎神：瓦西里莎"
 POD_anteshuntabsi.18.desc:0 "你已经到了旅途的终点，因为你能感觉到艾布西密拉德的存在就在附近。最后的障碍似乎是一只……小女孩。\n她看起来很天真，但芭芭雅嘎眼中纯粹的恐惧告诉你不是这样。她说：“你淘气了，祖母。”\n鬼婆没有回应，而是对小女孩发起了诅咒，她那令人毛骨悚然的笑容似乎只会张得越来越大。\n你在进行最后的战斗，即使有芭芭雅嘎在你身边，你也不觉得有多大胜算......"
 POD_anteshuntabsi.18.a:0 "最终决战！"
 POD_anteshuntabsi.18.effect.success.desc:0 "你做到了！"
 POD_anteshuntabsi.18.critical.failure.effect.desc:0 "差点就赢了……"
 POD_anteshuntabsi.18.critical.failure:0 "顽皮的处罚"
 POD_anteshuntabsi.19.t:0 "猎神：胜利？"
 POD_anteshuntabsi.19.desc:0 "你击败通往艾布西密拉德的路途的最后一个障碍，伟大的远古者就在你面前，幸运的处在蛰眠中。芭芭雅嘎已经开始吸他的血，上演几千年以来的一直在计划的复仇。\n因为你是有用的和忠诚的，她答应给你一份强有力的上古耆宿的血。不足以让你对她构成威胁，但仍足以大幅增加你自己的力量。\n但鬼婆现在忙着，贪婪地吞噬着她尊长的灵魂。你也许可以在背后捅她一刀，然后把全部奖赏夺给你自己。但如果她意料到了呢？"
 POD_anteshuntabsi.19.a:0 "该奖赏就超过预期了"
 POD_anteshuntabsi.19.b:0 "他的灵魂属于我！"
 POD_anteshuntabsi.19.effect.success.desc:0 "你偷袭了芭芭雅嘎"
 POD_anteshuntabsi.19.critical.failure.effect.desc:0 "贪婪不是好事"
 POD_anteshuntabsi.19.critical.failure:0 "贪婪杀死了你"
 young_third_modifier:0 "年轻的三代"
 young_third_modifier_desc:1 "你太年轻了，不可能像其他三代那样成为末日级威胁。不过，你可能是世界上最可怕，最强大的吸血鬼了。"
 POD_anteshuntabsi.20.t:0 "猎神：胜利"
 POD_anteshuntabsi.20.desc:0 "你偷袭了芭芭雅嘎，在她反应过来之前，干净利落地杀了她。她没来得及吞噬艾布西密拉德的灵魂。因此，究极的战利品就在你的面前。\n现在没有什么能阻止你，终极的力量就在前方，你将成为活跃在大地上的最强大的存在……假以时日。\n要小心，因为很多人会嫉妒你的力量，并试图窃取它，而被你吞掉灵魂的旧日支配者可能会试图控制你的身体。\n如果你能经受住这些考验，那么……这个世界将真正的成为你的游乐场。"
 POD_anteshuntabsi.20.a:0 "我做到了"
 POD_anteshuntabsi.1.c:0 "我将猎杀“暗影”——勒森魃"
 POD_anteshuntlasomb.1.t:0 "猎神：准备"
 POD_anteshuntlasomb.1.desc:0 "关于勒森魃的好消息是，他很容易找到，因为自从罗马沦陷以来，他大部分时间都睡在暗影之堡。坏消息是，那城堡可能是除了鹰巢之外最坚固的该隐之子堡垒，而勒森魃本人一直受他的后嗣保卫。\n如果你要突破城堡的防御，你需要帮助，更不用说最终取得成功了。是时候撒开大网，集结一支真正强大的力量了。"
 POD_anteshuntlasomb.1.a:0 "向四面八方派遣使者"
 lasombra_support_warning:1 "你得到的援助越多，袭击就越容易"
 POD_anteshuntlasomb.2.t:0 "猎神：阿刹迈"
 POD_anteshuntlasomb.2.desc:0 "首先响应你的号召的是一群训练有素的阿刹迈刺客。这些强大的战士，被诅咒为渴望其他该隐之子的血液，享受与具有如此强大血液的敌人战斗的机会。\n他们会是你项目的重要资产，但他们的服务并不便宜……"
 POD_anteshuntlasomb.2.a:0 "钱不紧要"
 POD_anteshuntlasomb.2.b:0 "还不如去抢！"
 POD_anteshuntlasomb.3.t:0 "猎神：叛党"
 POD_anteshuntlasomb.3.desc:0 "席卷欧洲的叛党显然对你的计划表现出浓厚的兴趣。杀死一位上古耆宿，对他们来说就近似取得最终胜利，而你是为数不多的愿意冒这个险的人之一。\n他们可能是有用的，如果没有别的原因，他们可以在袭击时作为肉盾，但与一群不明事故的稚子结盟将相当损耗你的声望。"
 POD_anteshuntlasomb.3.a:0 "长者们都去死吧！当然，除了我"
 POD_anteshuntlasomb.3.b:0 "回到你的地盘去"
 POD_anteshuntlasomb.4.t:0 "猎神：人脉与盟友"
 POD_anteshuntlasomb.4.desc:0 "作为一位显赫的暗夜领主，这些年你已经结交了很多人脉，甚至是正式的盟友。如果你想有机会攻破暗影之堡的话，或许是时候找他们帮点忙了。\n不过这就不用说了，在吸血鬼的世界里，没有什么是免费的，即使是和“朋友”打交道……"
 POD_anteshuntlasomb.4.a:0 "我需要所有我能得到的帮助"
 POD_anteshuntlasomb.4.b:0 "贪得无厌的贱货！"
 POD_anteshuntlasomb.5.t:0 "猎神：抉择"
 POD_anteshuntlasomb.5.desc:0 "你已经召集了一支军队，希望能有足够的力量来占领暗影之堡。当你再一次检查你的行动计划时，你被营地里传来的叫喊声打扰了。\n看来，这么多目标不同的吸血鬼聚集在一个地方，导致紧张的气氛很浓厚，你建立的脆弱联盟已经受到了威胁。如果你现在不阻止，事态可能会升级。在这么拥挤的空间里，哪怕只是一次血狂，都可能是灾难性的……"
 POD_anteshuntlasomb.5.a:0 "大家保持镇静！"
 POD_anteshuntlasomb.5.effect.success.desc:0 "大多数都保持了冷静"
 POD_anteshuntlasomb.5.critical.failure.effect.desc:0 "血狂时间到……"
 POD_anteshuntlasomb.5.critical.failure:0 "出乎意料的结局"
 POD_anteshuntlasomb.8.t:0 "猎神：失败的袭击"
 POD_anteshuntlasomb.8.desc:0 "尽管你尽了最大的努力，你还是没有准备好应对暗影之堡的防守。它的驻军是一回事，但周围的暗影则是另一回事。当你开始攻击时，它们就活跃了起来，这时你才知道，你没机会了。\n淹沒你的随行人员，有时会把他们扔到别的地方，或者只是吞噬他们，它们让你的军队的任何协调都变得很短。由于你们剩下的能战斗的人不多，你们只能拖延不可避免的败北。在这里和那里取得一些小胜利，或者展示勇武，并不能改变最终的结果。\n当暗影吞噬你的时候，你认为你竟然蠢的以为会赢，但至少……"
 POD_anteshuntlasomb.8.a:0 "……我尽力了"
 POD_anteshuntlasomb.7.t:0 "猎神：成功的袭击"
 POD_anteshuntlasomb.7.desc:0 "暗影之堡的防卫和你所担心的一样可怕。纯粹由暗影构成的建筑，强大的勒森魃吸血鬼，训练有素的血仆军队……你差点没能成功。\n但你有充分的准备，你也注意到勒森魃最强大的子嗣本人并不在那里，也许在里面等着你……你有一种沉甸甸的感觉，这还远远没有结束。暗影之堡就在你面前敞开……但远非毫无防备。"
 POD_anteshuntlasomb.7.a:0 "我不会被阻止！"
 POD_anteshuntlasomb.9.t:0 "猎神：暗隐"
 POD_anteshuntlasomb.9.desc:0 "里面很黑。你也没期待会是别样，但在如此漆黑的黑暗中，即使是吸血鬼也很难看清东西。那就是袭击开始的时候。\n似乎无处不在，黑暗自己动了起来并冲击你的团队。你想过许多，但是……你如何对抗黑暗本身？再多的剑、拳头或法术都不够……\n暗影之堡的第一项内部考验可能已经是你的最后一项了。"
 POD_anteshuntlasomb.9.a:0 "点火！火把，魔法，啥都用上！"
 POD_anteshuntlasomb.9.effect.success.desc:0 "光明暂时赢得胜利"
 POD_anteshuntlasomb.9.critical.failure.effect.desc:0 "太暗了……"
 POD_anteshuntlasomb.9.critical.failure:0 "你好，黑暗……"
 POD_anteshuntlasomb.10.t:0 "猎神：被遗弃的女儿"
 POD_anteshuntlasomb.10.desc:0 "又一条黑暗的走廊，又一个障碍物挡住了你的去路。这位女人，显然也是勒森魃的子嗣，不过似乎并没有伤害你的意思。\n这位“西比尔”对她自己的尊长颇有恨意，居然提议帮助你去杀他。她说，如果没有她的支持，即使你能进入城堡的中心地带，你也没有机会。\n这可能是一个陷阱，但这也可能是你通往真正成功的唯一途径……"
 POD_anteshuntlasomb.10.a:0 "我接受你的提议，黑暗淑女"
 POD_anteshuntlasomb.10.b:0 "我不需要帮助！"
 sybil_help_tooltip:0 "西比尔在之后的路上会帮助你……大概"
 POD_anteshuntlasomb.11.t:0 "猎神：新贵"
 POD_anteshuntlasomb.11.desc:0 "“勒森魃是我的！”\n你转过身来，看到一位看似正直的意大利贵族用谋杀似的眼神看着你。葛莱西安诺，勒森魃最新的子嗣，已明确表示要杀死自己的父亲……而你妨碍了他。\n除了战斗别无选择。这是你和他的宿命。你们中只有一个人会尝到勒森魃的血。"
 POD_anteshuntlasomb.11.a:0 "用决斗来决定命运吧"
 POD_anteshuntlasomb.11.effect.success.desc:0 "我占据了优势！"
 POD_anteshuntlasomb.11.critical.failure.effect.desc:0 "他占据了优势！"
 POD_anteshuntlasomb.11.critical.failure:0 "命运已决……"
 POD_anteshuntlasomb.12.t:0 "猎神：后手"
 POD_anteshuntlasomb.12.desc:0 "另一条走廊，另一个障碍。一位勒森魃的子嗣，可农·梅尔，已经与你团队打了起来，但你能够战胜她。\n她被打败了，现在她在求饶，这肯定会让你的追求变得更易达到。不过你能承受得起留下她的性命吗？\n当你在思考下一步的行动时，你突然瞥见她的长袍内有一点动静……"
 POD_anteshuntlasomb.12.a:0 "立刻杀了她！"
 POD_anteshuntlasomb.12.effect.success.desc:0 "你避免了她最后的攻击"
 POD_anteshuntlasomb.12.critical.failure.effect.desc:0 "你没能避免她最后的攻击"
 POD_anteshuntlasomb.12.critical.failure:0 "这不公平……"
 POD_anteshuntlasomb.13.t:0 "猎神：海盗"
 POD_anteshuntlasomb.13.desc:0 "你的团队已经到达了一个大房间，装饰着古老的雕像，显然是源自古希腊的多利安人。你很快就指出了几个看起来像是在使用青铜剑和盾牌的阴暗人物。\n如果故事是真的，勒森魃在海洋文明中很重要，所以似乎笼罩时代的最后一位吸血鬼正挡在你的面前。"
 POD_anteshuntlasomb.13.a:0 "他们应该被放到博物馆里！"
 POD_anteshuntlasomb.13.effect.success.desc:0 "你用法律惩戒了那些海盗"
 POD_anteshuntlasomb.13.critical.failure.effect.desc:0 "你被送上了喂鲨跳板……"
 POD_anteshuntlasomb.13.critical.failure:0 "该死的海盗……"
 POD_anteshuntlasomb.14.t:0 "猎神：傀儡师"
 POD_anteshuntlasomb.14.desc:0 "你的团队被一群看似辈代不高却很年轻的吸血鬼扰乱。他们本身并没有什么大的威胁，但他们就是不断的来袭。每一次他们的袭击，你都会失去一两个随队成员，这可能会导致你死于损耗。\n一定有一个人，在这个城堡的某个地方，策划了这种懦弱的战术。必须嘚对付这个“傀儡师”。"
 POD_anteshuntlasomb.14.a:0 "滚出来！"
 POD_anteshuntlasomb.14.effect.success.desc:0 "你找了他！"
 POD_anteshuntlasomb.14.critical.failure.effect.desc:0 "为时已晚……"
 POD_anteshuntlasomb.14.critical.failure:0 "不敌众而死"
 POD_anteshuntlasomb.15.t:0 "猎神：看守"
 POD_anteshuntlasomb.15.desc:0 "一扇门挡住了你的去路。不过不是什么普通的门，它看起来完全是由暗影构成的，这意味着你根本不知道如何打开它。\n幸运的是，一个吸血鬼正站在它的前面，似乎没有威胁。讲通他不爱他的尊长，他可能会被说服打开它。或者，如果你的论证不够充分，他可能会让门吞噬你。\n是时候考验一下你文斗能力了。"
 POD_anteshuntlasomb.15.a:0 "首先……"
 POD_anteshuntlasomb.15.effect.success.desc:0 "门开了"
 POD_anteshuntlasomb.15.critical.failure.effect.desc:0 "门开了你"
 POD_anteshuntlasomb.15.critical.failure:0 "被门所杀"
 POD_anteshuntlasomb.16.t:0 "猎神：死忠"
 POD_anteshuntlasomb.16.desc:0 "很显然，他就该在这里。蒙塔诺，勒森魃的左膀右臂，也是最忠诚的忠臣，正站在你的面前，他的眼睛里有着深深的决心。这位老战士不会从他的职责中退缩，你也不会。\n无需多言。你们中只有一个人能活着走出城堡。"
 POD_anteshuntlasomb.16.a:0 "最后一战？"
 POD_anteshuntlasomb.16.effect.success.desc:0 "蒙塔诺被打败了"
 POD_anteshuntlasomb.16.critical.failure.effect.desc:0 "你被打败了"
 POD_anteshuntlasomb.16.critical.failure:0 "虽死犹荣"
 POD_anteshuntlasomb.17.t:0 "猎神：宝库"
 POD_anteshuntlasomb.17.desc:0 "你到了暗影之堡的地下室区域，勒森魃本人大概就躺在那里。有趣的是，你是你的随行队伍中唯一的幸存者……这意味着如果你找到了他，你就不用分享上古耆宿的血了。\n事实上，你很快就注意到，这个宝库区域是一个迷宫，而且是一个漆黑的迷宫。墙壁是由暗影组成的，布局也在不断变化。如果你不小心，你可能会永远迷失在这里……"
 POD_anteshuntlasomb.17.a:0 "我会找出一条路……"
 POD_anteshuntlasomb.17.effect.success.desc:0 "最终的藏宝室就在眼前"
 POD_anteshuntlasomb.17.critical.failure.effect.desc:0 "我又回到出口了……"
 POD_anteshuntlasomb.17.critical.failure:0 "迷失于黑暗"
 POD_anteshuntlasomb.18.t:0 "猎神：胜利"
 POD_anteshuntlasomb.18.desc:0 "你在暗影之堡的核心，你能感觉到勒森魃的存在……但你看不到他。上古耆宿在进入蛰眠之前似乎已经和阴影融为一体了，这让吸榨他变得更加困难了。\n幸运的是，西比尔并没有忘记你，而那个任性的女儿走了出来，并开始了一个仪式，将上古耆宿的精髓带回了他的身体。你等待着，等待着，直到最后上古耆宿的身体在你面前重构。\n西比尔向你告别，一如既往的神秘，你独自一人面对你的天命——无尽的力量。\n然后你就出手了。"
 POD_anteshuntlasomb.18.a:0 "胜利的滋味如此甜美又血香"
 POD_anteshuntlasomb.19.t:0 "猎神：胜利？"
 POD_anteshuntlasomb.19.desc:0 "你在暗影之堡的核心，你能感觉到勒森魃的存在……但你看不到他。上古耆宿在进入蛰眠之前似乎已经和阴影融为一体了，这让吸榨他变得更加困难了。\n你没有办法找到他的灵魂到底在哪里，而且你也不知道怎么对影子吸榨……但你还是尝试着，向黑暗发起冲击，遵循你的兽性本能，复仇泄怒般的在这个房间里扫荡。\n这是个令人精疲力竭的过程，并不是你预想的那种令人振奋的感觉，然而，你却感觉到自己身上涌起一股力量。\n你取得了……什么。也许不是你所追求的终极力量，但你绝对赢了，而且，就世界其他地方所晓，你打败了一位上古耆宿。"
 POD_anteshuntlasomb.19.a:0 "不完全的胜利"
 POD_anteshuntset.1.t:0 "猎神：寻找带路人"
 POD_anteshuntset.1.desc:0 "你把目光投向赛特，赛特之子氏族名字所来之神。按理说，他应该躺在埃及的某个地方，被他的狂热后嗣好好守护着。但埃及很大，你不能拿着这么敏感的问题去问当地人。\n你的第一要务是要得到上古耆宿目前位置的线索。因此，你必须要派出你的代理人，带着大量的金钱，远赴各地，诱使一些有用的线人前来。"
 POD_anteshuntset.1.a:0 "不惜代价"
 POD_anteshuntset.1.b:0 "……让我再想想"
 set_end_warning:0 "你放弃了这愚蠢的追求"
 POD_anteshuntset.2.t:0 "猎神：准备"
 POD_anteshuntset.2.desc:0 "你找到了一条可靠的线索。火之庭，最大的赛特之子神殿之一，也许知道关于赛特位置的更多。你正在准备去神殿时，一种恐惧的感觉席卷了你，。\n你询问关于赛特的信息时并没谨慎，他的氏族可能已经在追踪你了。你必须为这次旅行仔细策划你的旅途，否则你的追求很快结束。"
 POD_anteshuntset.2.a:0 "打蛇打七寸……"
 POD_anteshuntset.2.effect.success.desc:0 "一段平淡无奇的旅程"
 POD_anteshuntset.2.critical.failure.effect.desc:0 "好吧，局势升温的很快……"
 POD_anteshuntset.2.critical.failure:0 "伏击！"
 POD_anteshuntset.3.t:0 "猎神：炽热魅惑"
 POD_anteshuntset.3.desc:0 "你到了火之庭，现在，你必须想办法让他们告诉你赛特的位置。强迫是行不通的，因为他们已是狂热者和折磨人的高手。\n所以你选择了外交手段。神殿的女主人，一个名叫锡拉的迷人的赛特之子，已经很客气地欢迎了你，对你走进蛇穴的勇气印象深刻。\n但现在，她正甜言蜜语地问你，为什么她不应该现在就在这里杀了你。毕竟你对他们的神是个威胁……"
 POD_anteshuntset.3.a:0 "这样还有什么乐趣么？"
 POD_anteshuntset.3.effect.success.desc:0 "令人信服的论据"
 POD_anteshuntset.3.critical.failure.effect.desc:0 "他们不喜欢乐趣……"
 POD_anteshuntset.3.critical.failure:0 "被斩首"
 POD_anteshuntset.4.t:0 "猎神：第一考验"
 POD_anteshuntset.4.desc:0 "到目前为止，锡拉一直在通融，但她不会轻易交出你需要的信息。你必须经受一些 “友好的考验”，看看你是否有资格出现在赛特的面前。\n第一项很简单。锡拉向你展示的是一些精致的凡人，其等擅长以你那该死的头脑所能以想象的任何方式取悦你的同类。这是一个明显的陷阱，因为你很容易在这里展有的快感中迷失很久，但你还是要品尝一下，否则女东道主会生气的……"
 POD_anteshuntset.4.a:0 "节制，节制……"
 POD_anteshuntset.5.t:0 "猎神：第二考验"
 POD_anteshuntset.5.desc:0 "你在火之庭的下一项考验将是一场精彩的斗兽场战斗。赛特之子确实喜欢他们的血腥娱乐，你并不惊讶的看到你的胜算不多。\n你的对手是一群狼人。说实话，他们是可怜的生物，因为他们经常被赛特之子虐待。被驱使到只剩下无意识的愤怒，他们在这场战斗中将对你毫不留情。"
 POD_anteshuntset.5.a:0 "人类对抗荒野"
 POD_anteshuntset.5.effect.success.desc:0 "他们结束了其等的痛苦"
 POD_anteshuntset.5.critical.failure.effect.desc:0 "你结束了你的痛苦"
 POD_anteshuntset.5.critical.failure:0 "赴死……"
 POD_anteshuntset.6.t:0 "猎神：第三考验"
 POD_anteshuntset.6.desc:0 "你现在被“邀请”来参加一局国际象棋比赛……用活人棋子和你作为国王之一。不用说，任何被吃的棋子都会被立即处理掉，这意味着这场友谊赛的赌注是你所能想象到的那么高。\n在这个可怕的游戏中，被选为棋子的可怜人的哀嚎和尖叫阻碍着你集中精力……"
 POD_anteshuntset.6.a:0 "专注于棋盘中心……"
 POD_anteshuntset.6.effect.success.desc:0 "将军！"
 POD_anteshuntset.6.critical.failure.effect.desc:0 "这看起来不妙……"
 POD_anteshuntset.6.critical.failure:0 "将军！"
 POD_anteshuntset.7.t:0 "猎神：第四考验"
 POD_anteshuntset.7.desc:0 "你已经被护送到了火之庭的地下入口。女东道主锡拉只是告诉你，你必须找到出口才能完成这次考验。\n你以为会是一个迷宫，但第一个地下房间其实是一个刑讯室，一位看起来瘦弱的赛特之子血仆正在对一位无助的牧师施展他的“艺术”。这位拷问者还算友好，说着自己的工作，并没有做出阻止你继续前进的举动。在这种令人费解的情况下，你会怎么做呢？"
 POD_anteshuntset.7.a:0 "营救牧师？"
 POD_anteshuntset.7.b:0 "继续前进？"
 POD_anteshuntset.8.t:0 "猎神：第四考验2"
 POD_anteshuntset.8.desc:0 "地道延续，一位看起来很焦急的家伙在更远的地方等着你。他自称是一位火之庭的棘秘魑“客人”，他说你的考验很简单：你必须忍受他在你的身体上的“实验”一段时间。然后，也只有到那时，他才会打开下一扇门。\n他向你保证，他将让你处于，大致上，和你开始时一样的状态。这并不完全令人欣慰，但似乎你在这件事上别无选择……"
 POD_anteshuntset.8.a:0 "好吧，我们开始吧……"
 POD_anteshuntset.9.t:0 "猎神：第四考验3"
 POD_anteshuntset.9.desc:0 "你就快搞定这该死的地下场所了。一位静坐的血仆正在两扇门前等着你：“右边的那扇会让你在没有任何新障碍的情况下完成考验。左边的那扇会长得多，难得多，但也会带你走到最后。选吧。”\n血仆不知道更多，只是一遍又一遍地重复这句话，把你一个人留在这个令人困惑的抉择面前。"
 POD_anteshuntset.9.b:0 "右边那扇？还用想么？"
 POD_anteshuntset.9.a:0 "左边那扇！我喜欢痛苦和折磨！"
 POD_anteshuntset.12.t:0 "猎神：赛特的诱惑"
 POD_anteshuntset.12.desc:0 "你已经完成了考验，锡拉张开双臂欢迎你回来。你受到了奢华的宴请，整个神殿都在歌颂你。锡拉大方地躺在你身边，一边向你讲述着赛特的伟大，一边告诉你，你追求猎杀像他那样的仁慈之神是多么愚蠢。\n……而你也只能同意，该考验暴露了你灵魂的真面目。也许是你在这一路上做出的错误选择，也许是你从一开始就已经堕落了，但你无力抵抗赛特之子的诱惑。他们现在是你的同教教友了。"
 antesetcorrupted:0 "你的追求就此结束"
 POD_anteshuntset.12.a:0 "赞美赛特！"
 POD_anteshuntset.11.t:0 "猎神：意志的坚韧"
 POD_anteshuntset.11.desc:0 "你已经完成了考验，锡拉张开双臂欢迎你回来。你受到了奢华的宴请，整个神殿都在歌颂你。锡拉大方地躺在你身边，一边向你讲述着赛特的伟大，一边告诉你，你追求猎杀像他那样的仁慈之神是多么愚蠢。\n但你很坚强，你设法转移了她引诱你加入她事业的企图。在别无选择的情况下，锡拉终于透露了一条可能对你有帮助的信息。赛特的身体被一个名为“狮缠”的朋党保护着。如果你找到他们，你就会更接近你的目标。"
 POD_anteshuntset.11.a:0 "快到了……"
 POD_anteshuntset.13.t:0 "猎神：寻到狮缠"
 POD_anteshuntset.13.desc:0 "寻找狮缠并不是一个简单的过程。不过现在你至少得到了一个名字，你可以开始研究这个线索了。\n你有两个选择，雇人远距离搜索，或者自己动手。这两种方式都会花费不菲，但必须要做。你现在离赛特太近了，不能放弃。"
 POD_anteshuntset.13.a:0 "去找！"
 POD_anteshuntset.13.b:0 "如果你想把事儿做好……"
 POD_anteshuntset.14.t:0 "猎神：驯狮"
 POD_anteshuntset.14.desc:0 "你已经找到了狮缠。他们在埃及附近不停地迁移，赛特的石棺带着走。你设法得知了他们的行踪，并计划了一次伏击。\n这肯定会是一场激烈的战斗，因为赛特的亲卫队不可能是容易打败的对手。你下达了发动攻击的命令，你的目光飘向了车队的中心，你的战利品就在近在咫尺的地方……"
 POD_anteshuntset.14.a:0 "我来找你了……"
 POD_anteshuntset.14.effect.success.desc:0 "他们完蛋了！"
 POD_anteshuntset.14.critical.failure.effect.desc:0 "我完蛋了……"
 POD_anteshuntset.14.critical.failure:0 "就差那么点了……"
 POD_anteshuntset.16.t:0 "猎神：选民"
 POD_anteshuntset.16.desc:0 "狮缠被打败了，在你和赛特的石棺之间只有一位幸存者……但不“只是”一位幸存者。你听说过这位所谓的赛特选民的故事。一代又一代被选为赛特本人的保镖的库弗·阿姆-赫鲁，可能是大地上最强的赛特之子。\n他一生的目的就是阻止像你这样的人威胁他的神，他似乎非常渴望实现这一点……你道途上最后的一个障碍可能是最难的一个。"
 POD_anteshuntset.16.a:0 "让我们起舞……"
 POD_anteshuntset.16.effect.success.desc:0 "选民倒下！"
 POD_anteshuntset.16.critical.failure.effect.desc:0 "该死的！"
 POD_anteshuntset.16.critical.failure:0 "就差那么点了……"
 POD_anteshuntset.17.t:0 "猎神：原初恐怖"
 POD_anteshuntset.17.desc:0 "在你面前躺着一个男人的身体，有个难以言喻的兽头，全身赤裸只穿有一条简单的腰带。一种恐惧直面而来，这种恐惧甚至使赤骇显得微不足道。\n你动不了，并且确信你将会死，确信这是注定的，而上古耆宿将会用你的血来解渴。\n动用你所有的力量，你飞跃向前，开始吸取该蛰眠生物的精血。\n你的心智炸开了。"
 POD_anteshuntset.17.a:0 "我必须抵抗！"
 POD_anteshuntset.17.effect.success.desc:0 "再来一点……"
 POD_anteshuntset.17.critical.failure.effect.desc:0 "……我在哪？"
 POD_anteshuntset.18.t:0 "猎神：胜利"
 POD_anteshuntset.18.desc:0 "你回想起关于遥远的关于力量的回忆，难以想象的力量，在你身上涌动，还有巨大的呼啸声，淹没了其他所有的感知。你也晓得有一种剧痛涌来，仿佛太阳本身吞噬了你。你的身体不自觉地颤抖着，惊悚的感觉是如此的无所不在，以至于在此夜晚，你其他的恐惧都失去了对你的控制。\n但你做到了。你现在是活跃中的最强大的吸血鬼，或者之一。你的棋局现在设在众神的棋盘上。"
 POD_anteshuntset.18.a:0 "胜利的滋味如此甜美"
 POD_anteshuntset.19.t:0 "猎神：胜利？"
 POD_anteshuntset.19.desc:0 "你回想起关于遥远的关于力量的回忆，难以想象的力量，在你身上涌动，还有巨大的呼啸声，淹没了其他所有的感知。你也晓得有一种剧痛涌来，仿佛太阳本身吞噬了你。你的身体不自觉地颤抖着，惊悚的感觉是如此的无所不在，以至于在此夜晚，你其他的恐惧都失去了对你的控制。\n在大家看来，你做到了，你杀了一位上古耆宿。但你总有一种纠结的感觉，总觉得有什么地方不对劲……"
 POD_anteshuntset.19.a:0 "尽管如此，这也是一场胜利"
 POD_anteshuntabsi.1.d:0 "我将猎杀埃及之神——赛特"
 POD_anteshunttzimisce.1.t:0 "猎神：追踪最长者"
 POD_anteshunttzimisce.1.desc:0 "最长者，又或广为所知称呼——棘秘魑，关于其有很多故事。这应该会对你的追求有所帮助，但这也给他目前的位置笼罩上了不少的神秘色彩。因此，重要的第一步将是研究那些传言和半真半假的故事，形成一个连贯的故事。也许那时你就能追踪到他。"
 POD_anteshunttzimisce.1.a:0 "给一些挪得学家付钱来做这事"
 POD_anteshunttzimisce.1.b:0 "我会自己去做的"
 POD_anteshunttzimisce.1.effect.success.desc:0 "这很合理"
 POD_anteshunttzimisce.1.critical.failure.effect.desc:0 "这完全说不通啊！"
 POD_anteshunttzimisce.3.t:0 "猎神：矛盾的结果"
 POD_anteshunttzimisce.3.desc:0 "围绕着棘秘魑的所有传言都很难让人理解，你被卡住了。如果你想继续下去，你将需要善于此的熟练者的帮助。这对你的自尊心是个打击，因为你本想想自己做。这打击是否足够微不足道，相比于处于该旅程末端的究极力量？"
 POD_anteshunttzimisce.3.a:0 "给我找来最好的挪得学家！"
 POD_anteshunttzimisce.3.b:0 "让我们放弃这整个愚蠢的行为"
 antetzimisce_continue:0 "你的追求继续"
 antetzimisce_end:0 "你的追求就此结束"
 POD_anteshunttzimisce.2.t:0 "猎神：萨麦尔的故事"
 POD_anteshunttzimisce.2.desc:0 "根据你的消息来源，你正站在伟大的萨洛比战士萨麦尔在很久以前与棘秘魑战斗的地方。目前还不清楚是萨麦尔被误导了，以为自己在与巴力唤魔者作战，还是最长者确实是他的目标。\n无论如何，萨麦尔都没能离开这里，而棘秘魑本人也勉强活了下来。现在你如果想找到下一块拼图，就必须深入这个不祥的隧道网络。"
 POD_anteshunttzimisce.2.a:0 "我不害怕黑暗"
 POD_anteshunttzimisce.2.effect.success.desc:0 "找到了！"
 POD_anteshunttzimisce.2.critical.failure.effect.desc:0 "我迷失了……"
 POD_anteshunttzimisce.2.critical.failure:0 "还在搜索……"
 POD_anteshunttzimisce.4.t:0 "猎神：达米克的故事"
 POD_anteshunttzimisce.4.desc:0 "你现在在萨尔米泽杰图萨的废墟，达契亚的前首都中。更准确的说，是在达米克·卢希梵的城堡的遗迹中，你怀疑他在棘秘魑与萨麦尔之战后，一直是棘秘魑还在恢复的身体的看护者。\n这里已经没有多少东西了，但你发现地下室还是可以进入的。经过长时间的搜索，你发现了可能是很久以前的一棵树的干枯残骸。这是个有趣的线索，你必须去破译，但你的眼睛却被吸引在看起来像一颗从树上掉下来的任然多汁的苹果上……"
 POD_anteshunttzimisce.4.a:0 "那东西在这里干什么？"
 POD_anteshunttzimisce.4.effect.success.desc:0 "太危险了"
 POD_anteshunttzimisce.4.critical.failure.effect.desc:0 "好味！"
 POD_anteshunttzimisce.4.critical.failure:0 "整个吞下"
 POD_anteshunttzimisce.5.t:0 "猎神：伊利亚什的故事"
 POD_anteshunttzimisce.5.desc:0 "在于达米克的城堡中恢复后，最长者似乎又化形了，这次侵入了一位年轻的棘秘魑的身体。有了这些信息，你追踪这位可怜的灵魂的下落，搜到了一个名字：塞尔诺格修道院。\n然而在去那里之前，你需要做一些认真的准备，比如招募一队能够处理可能守护着你猎物之恐怖的团队。"
 POD_anteshunttzimisce.5.a:0 "钱不紧要"
 POD_anteshunttzimisce.5.b:0 "这也太花钱了吧！"
 POD_anteshunttzimisce.6.t:0 "猎神：与魔鬼的交易"
 POD_anteshunttzimisce.6.desc:0 "在你研究棘秘魑的过程中，经常会出现一个名字：库帕拉。这个“恶魔”，显然与特兰西瓦尼亚的广阔土地合了体，长期以来一直是最长者的敌人。因此，也不令人感到惊讶，当某天晚上，一位遮掩着的身影来到你面前，并向你提供他的主人的祝福，如果你愿意的话。\n恶魔正在注视着你，如果你在未来的考验中需要他，他会帮助你。你现在有了一位强大的盟友……但要小心滥用他的慷慨。"
 POD_anteshunttzimisce.6.a:0 "有帮助总是好的……我猜"
 antetzimisce_kupala:0 "在该追求的剩余时间里，你将可以寻求库帕拉的帮助"
 POD_anteshunttzimisce.7.t:0 "猎神：兰巴赫的故事"
 POD_anteshunttzimisce.7.desc:0 "自从你开始准备攻击塞尔诺格后，一位奇怪的家伙就一直跟着你。这位兰巴赫·卢希梵看起来并不具有威胁性，恰恰相反，他看起来就像一个被无意义的低语所困扰的可怜的吸血鬼躯壳。\n尽管不是末卡维的预言家，但你的一些随从认为他可能与棘秘魑有某种联系，因此，对你的计划是一种威胁。你很难想象这个可怜的废人会成为任何人的问题，但外表可能会误导人……"
 POD_anteshunttzimisce.7.a:0 "他可以跟着一起去"
 POD_anteshunttzimisce.7.b:0 "把这个卑贱玩意赶出我的视线！"
 POD_anteshunttzimisce.8.t:0 "猎神：准备"
 POD_anteshunttzimisce.8.desc:0 "要拿下塞尔诺格，你需要一支军队。或者至少要有足够的肉盾来对付可能保卫这个地方的恐怖。幸运的是，叛党是完美的解决方案。他们数量众多，渴望干掉一位上古耆宿，而且没有人会真的想念他们。\n因此，你正在和他们当地最大的团体谈判，说服他们加入你。不过这并不是很顺利，因为他们要的是“认可”和保证不被利用在某个长者的阴谋中。这两点你都没有，所以你必须在事态进一步升级之前，硬着头皮说服他们。"
 POD_anteshunttzimisce.8.a:0 "别喊了，听着！"
 POD_anteshunttzimisce.8.effect.success.desc:0 "他们同意！"
 POD_anteshunttzimisce.8.critical.failure.effect.desc:0 "事态升级了……"
 POD_anteshunttzimisce.8.critical.failure:0 "斗殴致死"
 POD_anteshunttzimisce.9.t:0 "猎神：在塞尔诺格之外"
 POD_anteshunttzimisce.9.desc:0 "你终于到了塞尔诺格修道院。这座建筑位于树线之上的高高的山脊上。一座废弃的堡垒巍然耸立，它漆黑的墙壁在天空中形成了一个黑暗的骨架，一个向星空开放的建筑空壳。与要塞相连的是一座古老的大教堂，外观上条件更好，但险恶方面不比它的邻居建筑逊色。\n而你也有所意料。一小队黑骑兵正在楼梯前等着你。这么远看不清楚他们的特征，但他们可能是守卫着要塞的一些特殊品种的返祖血仆。冲突是不可避免的。"
 POD_anteshunttzimisce.9.a:0 "冲锋！"
 POD_anteshunttzimisce.9.effect.success.desc:0 "胜利！"
 POD_anteshunttzimisce.9.critical.failure.effect.desc:0 "不敌……"
 POD_anteshunttzimisce.9.critical.failure:0 "死于踩踏"
 POD_anteshunttzimisce.10.t:0 "猎神：楼梯"
 POD_anteshunttzimisce.10.desc:0 "根据你的调查，上修道院的台阶应该有1236个断断续续、曲曲折折的台阶。那为什么感觉你已经爬了两倍的台阶？你没有那么多时间，你开始怀疑有人在搞鬼，也许是某种神奇的幻觉，或者是更邪恶的东西。\n你必须找到解决的办法，否则你就会一直在爬这个东西，直到太阳升起，那将是一个坏消息。"
 POD_anteshunttzimisce.10.a:0 "肯定有种规律……"
 POD_anteshunttzimisce.10.b:0 "库帕拉！解除这个魔法！"
 rely_on_kupala:0 "你依靠库帕拉来克服这个障碍"
 POD_anteshunttzimisce.10.effect.success.desc:0 "幻觉被消除了"
 POD_anteshunttzimisce.10.critical.failure.effect.desc:0 "没有结束的迹象……"
 POD_anteshunttzimisce.10.critical.failure:0 "还在攀登……"
 POD_anteshunttzimisce.11.t:0 "猎神：塞尔诺格的入口"
 POD_anteshunttzimisce.11.desc:0 "大教堂的内部反映出一种黑暗的不祥气氛。这座建筑似乎是由某个疯狂设计师通过其疯癫的想象雕刻而成的。怪异的雕像可能是天使，但却像魔鬼，它们俯视着通过拱门进入曾经的圣殿的人。大教堂内的空气中弥漫着一股霉味和阴冷的气味，仿佛有什么永在垂死的东西嵌在石头里，现在又渗出了它的精髓，形成了永久腐烂的瘴气。\n不知道为什么，这种恶臭对该隐之子来说也是危险的，因为你开始剧烈咳嗽。你最好尽快找到源头，免得被它淹没。"
 POD_anteshunttzimisce.11.a:0 "顺着臭味……"
 POD_anteshunttzimisce.11.b:0 "库帕拉！我该去哪？"
 POD_anteshunttzimisce.11.effect.success.desc:0 "你烧掉了造成这种情况的那堆尸体"
 POD_anteshunttzimisce.11.critical.failure.effect.desc:0 "你在走廊里迷失了方向……"
 POD_anteshunttzimisce.11.critical.failure:0 "迷失又恶臭"
 POD_anteshunttzimisce.12.t:0 "猎神：中央大厅"
 POD_anteshunttzimisce.12.desc:0 "诡异的呻吟声充斥在洞穴式的中央大厅里，回荡在高高的拱形梁柱上，混杂在尖锐的嘈杂尖叫声中，模仿着经历着长期残酷折磨的痛苦的受害者的哭声。\n教堂的祭坛下隐藏着一个陷阱门。在地板的木板上切开，拉起它的铁环，门就会打开。一条狭窄而黑暗的楼梯通向大教堂的地下圣坛，希望是你探索的终点。"
 POD_anteshunttzimisce.12.a:0 "我才不怕呢……我觉得……"
 POD_anteshunttzimisce.13.t:0 "猎神：塞尔诺格的地下圣坛"
 POD_anteshunttzimisce.13.desc:0 "你很接近。你能感觉到。在那里，在这个地下圣坛的中心，你可以看到一个石棺，希望是棘秘魑的。遗憾的是，有一小队仆从生物挡住了你的去路。你可以在其中认出一些瑶夔和什拉赫塔，但也有一些其他形态各异的恐怖生物。\n你不怕怪物，但这仍将是一场可怕的战斗。这些都是没有头脑的战争构装体，一心想要保护这个地方。"
 POD_anteshunttzimisce.13.a:0 "拿起武器！"
 POD_anteshunttzimisce.13.b:0 "库帕拉！把你的力量借给我！"
 POD_anteshunttzimisce.13.effect.success.desc:0 "很近了！"
 POD_anteshunttzimisce.13.critical.failure.effect.desc:0 "……远远莫及"
 POD_anteshunttzimisce.13.critical.failure:0 "剁为肉泥"
 POD_anteshunttzimisce.15.t:0 "猎神：胜利……"
 POD_anteshunttzimisce.15.desc:0 "当你走近石棺去领取你的奖品时，一直在跟踪你的兰巴赫，发出了惊恐的叫声。惊讶之余，你停下了动作……及时避免了被里面畸形尸体射出的肉柱刺中。\n你没有让不那么蛰眠的上古耆宿恢复过来，你把你的獠牙插进了应该是他的脖子里，闲来无事想知道兰巴赫是故意救你还是纯粹的运气。在任何情况下，你做到了，三代的力量现在流经于你。\n你比以往任何时候都要强大，但是……那你为什么还能感受到一种真正的恐惧？"
 POD_anteshunttzimisce.15.a:0 "有点不对劲……"
 POD_anteshunttzimisce.16.t:0 "猎神：胜利？……"
 POD_anteshunttzimisce.16.desc:0 "当你走近石棺去领取你的奖品时，一根肉柱从里面那具并不腐烂的尸体上射来，刺穿了你的胸膛。你几乎没剩下意识，主要是被你的心兽驱使着，急忙将你的獠牙刺入这个畸形生物的脖子。剩下的事件发生在一连串勉强可辨的图像和声音中。\n最后，你还活着，而且比以前更加强大。石棺里也没有留下什么东西。不过……你还是觉得有些不对劲，好像有人一直在观察你，而且就快要动手了……"
 POD_anteshunttzimisce.16.a:0 "有点不对劲……"
 POD_anteshunttzimisce.18.t:0 "猎神：恶魔"
 POD_anteshunttzimisce.18.desc:0 "当你以胜利姿态离开塞尔诺格时，一条孤独的身影拦住了你，在长长的修道院楼梯井的底部等着你。他的特征模糊不清，但你还是认出了他的身份。库帕拉，特兰西瓦尼亚的恶魔和棘秘魑的宿敌。\n你在帮助他的部分中做得很好，但在你身上仍有最长者的残余，而库帕拉不能拥有这些。是时候测试你新取得的力量了。"
 POD_anteshunttzimisce.18.a:0 "最终决战"
 POD_anteshunttzimisce.18.effect.success.desc:0 "恶魔被打倒了"
 POD_anteshunttzimisce.18.victory:0 "最终胜利！"
 POD_anteshunttzimisce.18.critical.failure.effect.desc:0 "不敌"
 POD_anteshunttzimisce.18.critical.failure:0 "打入地狱"
 POD_anteshunttzimisce.19.t:0 "猎神：恶魔"
 POD_anteshunttzimisce.19.desc:0 "当你以胜利姿态离开塞尔诺格时，一条孤独的身影拦住了你，在长长的修道院楼梯井的底部等着你。他的特征模糊不清，但你还是认出了他的身份。库帕拉，特兰西瓦尼亚的恶魔和棘秘魑的宿敌。\n你在帮助他的部分中做得很好，但在你身上仍有最长者的残余，而库帕拉不能拥有这些。你能感觉到恶魔对你灵魂的拉扯，因为你每次求助其都会来作祟你，这让他变得更强大。是时候测试你新取得的力量了，希望它们足够。"
 POD_anteshunttzimisce.19.a:0 "最终决战"
 endofthequest:0 "不管是胜利还是死亡，这都是这次追求的终结。"
 POD_anteshunttzimisce.19.effect.success.desc:0 "恶魔被打倒了"
 POD_anteshunttzimisce.19.victory:0 "最终胜利！"
 POD_anteshunttzimisce.19.critical.failure.effect.desc:0 "不敌"
 POD_anteshunttzimisce.19.critical.failure:0 "打入地狱"
 POD_anteshunttzimisce.20.t:0 "猎神：恶魔"
 POD_anteshunttzimisce.20.desc:0 "当你以胜利姿态离开塞尔诺格时，一条孤独的身影拦住了你，在长长的修道院楼梯井的底部等着你。他的特征模糊不清，但你还是认出了他的身份。库帕拉，特兰西瓦尼亚的恶魔和棘秘魑的宿敌。\n你在帮助他的部分中做得很好，但在你身上仍有最长者的残余，而库帕拉不能拥有这些。你是如此依赖他才走到这一步，以至于你还没有意识到这样的帮助所要付出的代价。当恶魔说出一些含有力量的玄奥之名，开始拆散你的灵魂时，你才明白。而这一切都太晚了。"
 POD_anteshunttzimisce.20.a:0 "恶有恶报"
 instakillkupala:0 "你太依赖库帕拉了，所以你付出了代价"
 POD_anteshuntabsi.1.e:0 "我将猎杀最长者——棘秘魑"