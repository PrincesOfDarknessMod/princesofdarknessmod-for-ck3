l_simp_chinese:
 PODcanon_chars.1.t:0 "新的开始"
 PODcanon_chars.1.desc:0 "终于结束了。那个蠢货，斯巴达的墨涅拉俄斯，已经死了，而你，千百年来第一次，可以随心所欲了。胜利感觉……比你想象的要空虚，因为你突然失去了你亡生中的目标……但你会继续活下去，一如既往。\n这个世界已经忘记了你，甚至连最老的妥芮朵都认为你是个神话。这可能对你有利。现在是时候回到[cainite|E]政治的世界了，一个你非常熟悉的世界，但有一个明显的优势：没有重要的人真的怀疑你真正的权力。\n这是一种非常有用的资产，你打算尽可能长时间地保留它……"
 PODcanon_chars.1.a:0 "我的飞升终于可以开始了"
 PODcanon_chars.helena:0 "你解锁了对外地统治者的新角色互动：渗入"
 PODcanon_chars.2.t:0 "神的觉醒"
 PODcanon_chars.2.desc:0 "终于完成了。你几乎完成了召唤斯凡特维德降临到自愿宿主的仪式。你迫不及待地想要感受神的力量流淌在你永恒的血管里！\n不过有个小问题，在你的研究过程中，你发现宿主的心智应该会因为斯凡特维德的到来而被抹除掉。很明显，你意志坚强，不会像一些被你击垮的白痴密教徒那样轻易颓败，但是……这仍然令人担忧。\n简单地解读这个仪式已经教会了你很多，可能本身就是一个足够的奖励。\n或者你可以召唤一位神并试着让祂屈从于你的意志。选择权在你手中……也许这是最后一次了。"
 PODcanon_chars.2.a:0 "究极力量！"
 PODcanon_chars.2.b:0 "……我感觉不太妙"
 PODcanon_chars.3.t:0 "神之间的浪漫"
 PODcanon_chars.3.desc:0 "她回来了。\n伊西斯心爱的女儿再次加入了你的阵营，一股矛盾的情绪又回到了你的身边。你这一次拥有的是激情，虽然转瞬即逝。也许你的故事会更经得起时间的考验，因为现在你们都长大了，希望也更聪明了。\n至少，这将是有趣的，特别是当你的封臣已经在你背后抱怨。齐茉媞里从来都不是他们当中最受欢迎的人物。\n但你不在乎。她回来了，亡生似乎值得再活一段时间，希望是很长一段时间。"
 PODcanon_chars.3.a:0 "让我们依照我们的想法去重建这片土地"
 PODcanon_chars.mithras:0 "你解锁了一项限时的大决议"
 PODcanon_chars.4.t:0 "战争审判"
 PODcanon_chars.4.desc:0 "你已经谋略了一系列快速而果断的小规模战斗来对付这个反叛的封臣。如果你能取得胜利，你就可以暂时不受叛乱的影响，至少是这个人的。\n不过在发动攻击前最好确定一下成功的概率，如果你输了，后果会比根本不尝试这样的行动更糟糕......"
 PODcanon_chars.4.a:0 "迈向胜利！"
 PODcanon_chars.4.b:0 "今晚不是那晚"
 PODcanon_chars.4.effect.success.desc:0 "胜利将暂时性的崩坏封臣的精神"
 PODcanon_chars.4.success:0 "胜利！"
 PODcanon_chars.4.critical.failure.effect.desc:0 "失败将鼓励封臣的叛乱精神"
 PODcanon_chars.4.failure:0 "失败……"
 PODcanon_chars.5.t:0 "仰望金字塔"
 PODcanon_chars.5.desc:0 "现在是时候使用你作为睿魔尔[clan|E]之主的正当权力，来进行一些老式的封闭政治。既然你站在金字塔的顶端，你就会赢得最后的胜利，问题是你能从中得到什么具体的好处。\n这么多的选择，后果却如此之小！除了显而易见地惹恼你下面的人。不过这其实都无所谓。"
 PODcanon_chars.5.a:0 "偷走其他人的主意"
 PODcanon_chars.5.b:0 "让其他人为你的失败负责"
 PODcanon_chars.5.c:0 "征用[clan|E]金库"
 PODcanon_chars.5.d:0 "我没心情应对政治"
 PODcanon_chars.6.t:0 "鹰巢的奖励"
 PODcanon_chars.6.desc:0 "哈基姆的子嗣的领导人对伊比利亚午夜新月的进展感到高兴。他们向你致以最诚挚的问候和祝贺，同时也向你表示支持，向维齐尔、术士和战士种姓的稚子们表示祝贺。\n你的工作还没有完成，但你身上的压力现在不那么沉重了，看起来他们终于相信你会为[clan|E]的最大利益着想。甚至有可能让伊比利亚成为一个配得上哈基姆本人的未来重要据点。"
 PODcanon_chars.6.a:0 "我将是鹰巢十年内的话题人物"
 PODcanon_chars.7.t:0 "计中计"
 PODcanon_chars.7.desc:0 "你对这个潜在的敌人有了更多的了解。这对你来说总是一种奇怪的安慰，罗克亲王，因为你喜欢智取你的敌人，让他们落入一个无法陶土的阴谋之网。\n尽管如此，你有时并不只是为了搞阴谋而搞阴谋。您可以利用获得的信息进行进一步的计划！"
 PODcanon_chars.7.a:0 "对这家伙启用更多的计谋！"
 PODcanon_chars.7.b:0 "勾心斗角是一种舒缓的消遣……"
 PODcanon_chars.7.c:0 "让每个人都知道你的阴谋技巧有多厉害！"
 PODcanon_chars.8.t:0 "兴风作浪"
 PODcanon_chars.8.desc:0 "蒙塔诺大人，随着意大利大部分地区在你的控制下回归，你向勒森魃[clan|E]证明了你仍然是一个有效而果断的统治者。显然，要恢复暗影之海在地中海世界的位置还有很多工作要做，但至少，你作为[clan|E]首领的地位不再有争议。\n你现在可以使用它来宣称对任何任性的勒森魃亲王领的统治权。"
 PODcanon_chars.8.a:0 "我可以做得更好"
 PODcanon_chars.montano:0 "你现在在与任何勒森魃统治者的“提议附庸”互动的接受度上有专属增益"
 PODcanon_chars.9.t:0 "携爱初拥"
 PODcanon_chars.9.desc:0 "美丽的玛阿特卡勒，当你全身心投入某件事时，你很难被阻挡，但[cainites|E]是固执的生物。如果你要展示赛特之爱，它将需要你所有会得的说服和诱惑技巧来实现。\n失败的风险总是存在的，这将会让你在赛特无情的眼神中付出相当大的代价……"
 PODcanon_chars.9.a:0 "赛特的荣耀不能等待"
 PODcanon_chars.9.b:0 "今晚不是那晚"
 PODcanon_chars.9.effect.success.desc:0 "胜过意志将使该角色皈依赛特之道"
 PODcanon_chars.9.success:0 "赞美赛特！"
 PODcanon_chars.9.critical.failure.effect.desc:0 "失败将使你付出一些代价"
 PODcanon_chars.9.failure:0 "我输了……"
 PODcanon_chars.10.t:0 "行于黑螺旋"
 PODcanon_chars.10.desc:0 "你见过那些“黑旋舞者”，他们的一举一动显得丧心病狂，即使是按照你的松散标准。你受到的痛苦有微小的可能得到解答，但这值得吗？唯一可以肯定的是，一旦你从这个被诅咒的地方回去，你整个人就不会再和之前一样了……"
 PODcanon_chars.10.a:0 "现在没有回头路了"
 PODcanon_chars.10.b:0 "这是个非常非常坏的主意"
 PODcanon_chars.petaniqua:0 "你更有可能从现在回到比起点更糟糕的地方。但也许有一丝希望能做点有价值的事……"
 PODcanon_chars.11.t:0 "疯于黑螺旋"
 PODcanon_chars.11.desc:0 "人们认为你已经从黑螺旋中回来了，相较之前并没有任何改变。但你自己更清楚，你未从那里回来，从来没有。而它现在与你同在。\n而这些……你所看到的东西将永远不会离开你的视野。也许整个世界只是它的延伸。或者你只是走得太远，不再去关心。\n你不会想再回到那里。还是说你想？"
 PODcanon_chars.11.a:0 "再也没有光了"
 PODcanon_chars.12.t:0 "明于黑螺旋"
 PODcanon_chars.12.desc:0 "你不记得你在黑螺旋中的大部分旅程，是……也许这是最好的结果。你没有发现隐藏的真相，或肮脏的恐怖。如果你有，你会对他们有一些记忆，对吗？\n不管怎么说，尽管遇到了所谓的挫折，你还是很欣慰地离开了那里。奇怪的是，现在外面的世界似乎很舒适。"
 PODcanon_chars.12.a:0 "情况本来可能更糟"
 PODcanon_chars.13.t:0 "黑螺旋之力"
 PODcanon_chars.13.desc:0 "毫无疑问，黑螺旋是一个究极疯狂的地方。但你的凡生和亡生经历了这么多，这次它并没有击垮你。你克服了恐惧，“它”对你的表现感到满意。\n尽管有这力量的展示，你会承认你很高兴再次加入外面的世界。这一点也不轻松。"
 PODcanon_chars.13.a:0 "我不容易被吓到"
 PODcanon_chars.14.t:0 "黑螺旋之礼"
 PODcanon_chars.14.desc:0 "你找到了他。\n也许是黑螺旋怜悯你， 或是被你的奉献精神所打动。又或许这只是一个梦， 也就是你那破碎心灵的幻想。但你不关心。\n他现在和你在一起了，一切都会再一次好起来的。"
 PODcanon_chars.14.a:0 "你注定要成为世界之王"
 PODcanon_chars.petaniqua2:0 "从现在开始，你没有理由再行于黑螺旋了"
 podintroductions.116.t:0 "你的过往"
 podintroductions.116.desc:0 "哈德施塔特大人，到目前为止，你的政治升迁是非常出色的。从一个被漠视的世系和边境处地起家，你成功地利用凡人的神圣罗马帝国的崛起，将梵卓[clan|E]从罗马重新集中到德意志。\n不过，旧习难改，你不得不与罗马遗民的领袖茱莉亚·安塔西亚合作，才走到这一步。现在可能是时候“重新谈判”你们的伙伴关系，把这些尘封的古物放到属于它们的博物馆里去。\n你有强大的盟友和忠诚的子嗣，让他们保持亲近并注意他们的处位，历史将由你来书写。"
 podintroductions.116.a:0 "德意志即是未来"
 podintroductions.hardestadt:0 "作为哈德施塔特，你有一个与你的子嗣的专属角色互动，用以驾驭其等。"
 pressure_on_modifier:0 "施加压力"
 pressure_on_modifier_desc:0 "这个角色正处于要做到最好的压力之下。"
 PODcanon_chars.15.t:0 "绷紧缰绳"
 PODcanon_chars.15.desc:0 "你的子嗣回应了你的召唤，急切地想听到你的诉求。你是出了名的严格的[Sire|E]，是那种不轻易容忍失败的人。不过，没有人可以否认，你的教育选择造就了他们这一代中最有天赋的稚子。其他人……他们往往没能过久的玷污你的声誉。"
 PODcanon_chars.15.a:0 "做得更好！"
 PODcanon_chars.15.b:0 "永不满足"
 PODcanon_chars.15.c:0 "你是一个毫无价值的失败者！"
 PODcanon_chars.hardestadt_tooltip:0 "只要这个角色一直是仇敌，你就不能再召来其。"
 POD_hardestadt_interaction:0 "绷紧缰绳"
 POD_hardestadt_interaction_desc:0 "召集你的子嗣进行谈话"
 podintroductions.117.t:0 "你的过往"
 podintroductions.117.desc:0 "安塔西亚女士，你在你于流放中在德意志的居所中坚强地站立着，但你的心却在为凯旋罗马而隐隐作痛。梵卓[clan|E]已经从它在永恒元老院的高贵根基上跌落得很远，而你是唯一能阻止哈德施塔特和卡米拉把你心爱的[clan|E]变成自己的玩物的人。\n虽然这一努力需要时间，但你最近在你的探索中发现了一个令人惊讶的盟友。诺斯费拉图族的安吉瓦是一个奇怪的人，喜欢着幻想故事，但他已经证明是一个值得信赖的朋友，更是一个值得你去争取的人。凭借你们的联合力量，真正理想的罗马仍有希望。"
 podintroductions.117.a:0 "元老院不会堕落"
 podintroductions.antasia:0 "作为茱莉亚·安塔西亚，只要你们保持朋友关系，你就可以获得与安吉瓦的专属角色互动。"
 POD_antasia_interaction:0 "友善交谈"
 POD_antasia_interaction_desc:0 "邀请安吉瓦进行一次愉快的交谈"
 PODcanon_chars.16.t:0 "说书人安吉瓦"
 PODcanon_chars.16.desc:0 "当你第一次见到他时，你希望安吉瓦能洞悉你的祖尊，梵卓本人。遗憾的是，事实并非如此，因为即使是像他这么老的家伙，也从未遇到过上古耆宿。尽管如此，该诺斯费拉图还是有很多关于[cainite|E]世界的故事，其中一些你甚至很难相信。\n不过安吉瓦并不介意，他只是很高兴与你分享它们。从这样一个古老而古怪的吸血鬼那里获得如此友好的、没有欺骗的洞察力，是一种祝福，你不打算破坏。"
 PODcanon_chars.16.a:0 "真的吗？太不可思议了！"
 PODcanon_chars.17.t:0 "自信者安吉瓦"
 PODcanon_chars.17.desc:0 "安吉瓦今晚很安静，似乎很乐意倾听你的烦恼。在[cainite|E]世界里，一个人能够向另一个人倾诉而不用担心被欺骗或操纵，这是很罕见的。但你对这个老诺斯费拉图感到放心，知道你们的目标是紧密一致的。对你来说，拥有这种奢侈的生活是不小的祝福，而且每次你和他在一起的时候，岁月沉眠似乎都不那么旖旎。"
 PODcanon_chars.17.a:0 "友谊是宝贵的财富"
 PODcanon_chars.18.t:0 "战士安吉瓦"
 PODcanon_chars.18.desc:0 "安吉瓦今晚很激动，谈到了他的[clan|E]所面临的严重威胁：尼克图库。你以前也见过他这样，虽然你对他说的事情一无所知，但你更愿意幽默地对待他。甚至当他突然要求在你们之间进行决斗训练，以便“在他们来的时候做好准备”。你不是每天晚上都能和这样一位经验丰富的战士比试，你肯定能学到一些东西。"
 PODcanon_chars.18.a:0 "我们将做好准备"
 podintroductions.118.t:0 "你的过往"
 podintroductions.118.desc:0 "亚历山大大人，你曾经是世界上最重要的梵卓，对查理曼大帝本人耳提面命。现在，你被受诅的萨利安娜和你的叛徒子嗣杰弗里从你心爱的法兰西流放了。你会回来的，但有其他事情需要你的关注。\n约根·冯·费尔登大人，你现居处的东道主，已经召集了一支小部队来帮助你，履行他作为年轻同族的职责。接受它将是有帮助的，但也意味着你基本上沦为到为得帮助而乞求。拒绝它更符合你的地位……但无疑会激怒马格德堡的亲王。在这里做出正确的决定，这可能是你凯旋回到整个[cainite|E]世界的第一块垫脚石。"
 podintroductions.118.a:0 "感谢帮助，约根大人"
 podintroductions.118.b:0 "王不求人！"
 alexander_black_cross_event_troops:0 "黑十字血仆"
 alexander_help_modifier:0 "人脉通达"
 alexander_help_modifier_desc:0 "由于有一位强大的引路人的帮助，你在上层圈子中的好评不断。"
 podintroductions.119.t:0 "你的过往"
 podintroductions.119.desc:0 "约根大人，自从你被[Embrace|E]以来，就一直在以惊人的速度崛起。但最近在与军督领的战争中遭到的小挫折使你的影响力受到了削弱。不过，随着流亡的法兰西亲王亚历山大来到你的宫廷，一个新的机会出现了。\n到目前为止，你一直是个完美的东道主，继续这样做对你的野心有利，因为亚历山大在[clan|E]中仍有着很大威望。但这位强大的梵卓并非是单独前来的，他还带来了伊斯灵顿的罗莎蒙，这位美之[clan|E]中最美的倾世佳丽，也是个偷走你心的妙人儿。\n你最近向这位女士表白了你的感情，但似乎亚历山大本人也看上了她。因此，必须要做出选择了……"
 podintroductions.119.a:0 "爱……"
 podintroductions.119.b:0 "或力量？"
 jurgen_love_tooltip:0 "罗莎蒙将加入你的宫廷，将她的地盘托管给你。"
 podintroductions.120.t:0 "你的过往"
 podintroductions.120.desc:0 "赞美伟大的卡米拉，罗马与梵卓[clan|E]过往的无可争辩的主人！\n在该幸福的时代，所有的人都在你面前俯首称臣。该下地狱的迦太基在你的命令下被摧毁，一切都很完美，直到你陷入[torpor|E]。很显然，没有人能够继承你的衣钵，帝国也同你一共衰落。你最近于这个新世界苏醒过来，与你所知道的那个世界如此不同……但仍然充满了机会。\n重申你对你心爱的罗马的控制很容易，但现在更大的挑战在等着你。\n你是原罪永恒执政，你的未来只能是永生的荣耀和颓废的快乐。"
 podintroductions.120.a:0 "罗马永恒"
 podintroductions.camilla:0 "作为卡米拉，你在“主办欢会​” 活动期间有一项专属的、更有利的、更可能触发的事件。"
 POD_elysium_events.25.t:0 "像罗马人一样狂欢"
 POD_elysium_events.25.desc:0 "除了是最强大的梵卓之一和精明的政治动物之外，你还被称为所有[cainite|E]中最好的派对主持人。毕竟，你在罗马帝国时期开创了该整个概念，你完全知道该如何进行。\n血将流淌，而每人都会有一段美妙的时光，由于你的精心策划，使罗马伟大的如此一小部分将在今晚得以延续。"
 POD_elysium_events.25.option.a:0 "让我们开始狂欢吧！"
 anna_ambition_modifier:0 "燃烧的野心"
 anna_ambition_modifier_desc:0 "安娜将不惜一切代价来获得她与生俱来的权利。你可以帮助她或被她撇开，没有中间地带。"
 podintroductions.121.t:0 "你的过往"
 podintroductions.121.desc:0 "尊贵的女士，你来自最伟大的希腊血统，君士坦丁堡应属于你，即使成为吸血鬼也没有改变这个事实。你很好地适应了你的新状态，并在第四次十字军东征发生时迅速地攀升拜占庭阶级。随着米迦勒和幻梦的毁灭，以及拉丁吸血鬼的胜利，你的城市再次离你渐行渐远。\n然而，还没走投无路，因为拉丁人难以巩固他们的地位，这使你能够帮助继任者帝国尼西亚开始运作。在这个强大的权力基础上，你离实现你永恒的野心如此之近……\n继续前进吧，诸皇的女儿，达成你的天命！"
 podintroductions.121.a:0 "我的世界渴望之城……"
 podintroductions.anna:0 "你可通过一项要求你守住君士坦丁堡的专属决议来提升你的初始修正"
 anna_decision:0 "生于紫室"
 anna_decision_tooltip:1 "拉丁人的压迫必须被终结"
 anna_decision_desc:0 "君士坦丁堡必须是你的，这于此时比任何其他都重要。你将把它从受诅的拉丁勒森魃手中解放出来，然后开始你对这个世界上最伟大城市的永恒统治。"
 anna_decision_effect_tooltip:1 "你将达成你的野心。"
 anna_decision_confirm:0 "终于！"
 anna_ambition_fulfilled_modifier:0 "达成野心"
 anna_ambition_fulfilled_modifier_desc:0 "科穆宁现在是君士坦丁堡的永生和永恒的统治者。如它本该是。"
 podintroductions.122.t:0 "你的过往"
 podintroductions.122.desc:0 "阿娜佳女士，你简单的生活随着贝利撒留和谢巴赫的到来而陷入混乱。这两个吸血鬼对你很有好感，并教给你很多如何在黑夜社会中生存的知识……然后你的生活变得更加奇怪了，一个秘密的末日密教——“黑手”——宣布你是其应许的领导者。\n尽管发生了这些事情，但到目前为止你做得很好，亚美尼亚在你的统治下已经成为一个强大的要塞，吸引了这个密教的成员和来自拜占庭的难民。你的“养父母” 还在这里，在帮助稳定你的新国家方面提供了宝贵的帮助，但现在是时候把事情掌握在你自己手中了。\n你得到了最好的指导，许多人已经把你看作是世界上最重要的[cainites|E]之一，但你的故事是你自己的，只有你自己才能书写。"
 podintroductions.122.a:0 "我是我自己的[cainite|E]"
 podintroductions.anadja:0 "只要谢巴赫与贝利撒留还活着，你就可以通过决议要求进一步的辅导。"
 anadja_decision:0 "向最优秀者学习"
 anadja_decision_tooltip:1 "总有提高的空间。"
 anadja_decision_desc:0 "谢巴赫与贝利撒留一直乐于帮助你提升，尽管他们的课程有时会相当费力。"
 anadja_decision_effect_tooltip:1 "训练课程将开始"
 anadja_decision_confirm:0 "我准备好了。"
 anadja_custom_decision:0 "该决议将于你取有25军事、20外交和20密谋，又或谢巴赫与贝利撒留两者死去时不可用。"
 PODcanon_chars.19.t:0 "向最优秀者学习"
 PODcanon_chars.19.desc:0 "贝利撒留在凡生中曾经是一位伟大的将军，然后为君士坦丁堡的[cainite|E]的幻梦处理许多军事事务。从他身上可以学到很多东西。而谢巴赫则是一位间谍和大使专家，常常同时兼任，可以教你这些课题。你今晚要问他们什么？"
 PODcanon_chars.19.a:0 "告诉我更多关于军事战役的事，贝利撒留"
 PODcanon_chars.19.b:0 "外交是一项复杂的课题……"
 PODcanon_chars.19.c:0 "……也许跟密谋一样复杂"
 PODcanon_chars.19.d:0 "我改变主意了"
 shaky_secrets_modifier:0 "将泄的秘密"
 shaky_secrets_modifier_desc:0 "他们知道你在藏着什么，而他们想找出来。"
 shrouded_secrets_modifier:0 "虚藏的秘密"
 shrouded_secrets_modifier_desc:0 "你的秘密被一层稀薄的暗影所保护着。"
 darkened_secrets_modifier:0 "黑暗中的秘密"
 darkened_secrets_modifier_desc:0 "他们完全不晓得你。也将没有人能会。"
 secrets_secrets_modifier:0 "秘密中的秘密"
 secrets_secrets_modifier_desc:0 "棋盘上的棋子，经由你的手操纵。"
 podintroductions.123.t:0 "你的过往"
 podintroductions.123.desc:0 "Sultan Badr, you have assumed control of the Midnight Crescent and the cornered Ashirra are wisely rallying behind you. Take notice of those that don't, for later punishment.\nYou must respect the Christian Shadow Reconquista, as both de Ruiz and his lineage are formidable opponents, but your most pressing matter is one of secrecy.\nYou are hiding many things from your new 'loyal' followers, things that you don't want them to find despite their insistence. Use your mastery of shadows and intrigue to hide yourself behind an impenetrable veil of mystery before it's too late. Only then will you be able to root the Christians out of Iberia."
 podintroductions.123.a:0 "真理由我塑造"
 podintroductions.badr:0 "到1300年之前，你可以使用一项专属决议，来提升你的初始修正。"
 badr_decision:0 "拜德尔的秘法"
 badr_decision_tooltip:1 "他们决不能知道。"
 badr_decision_desc:0 "作为午夜新月的新统治者，所有的目光都投向了你。你必须在为时已晚之前好好隐藏自己。"
 badr_decision_decision_effect_tooltip:1 "辛秘深藏。"
 badr_decision_confirm:0 "他们决不会知道。"
 podintroductions.124.t:0 "你的过往"
 podintroductions.124.desc:0 "Pious Suleiman, times are hard for the Faithful Ashirra. The despicable Christian Lasombra have declared war on your people, plunging Iberia and the Maghreb into disarray. But there is trouble closer to home as well. Your once friend Khalid is rallying troops in Mesopotomia after a violent disagreement with you about interfering, or not, in mortals affairs. Your own childe, Haroun el-La'il, has also made a bid for independence after his heretical dogma has been revealed.\nYou must act Suleiman. The Ashirra need unity now more than ever and perhaps concessions need to be made to achieve this goal. Though an hardline stance is also a possibility..."
 podintroductions.124.a:0 "绝不妥协"
 podintroductions.124.b:0 "哈立德，我们有更大的威胁得对付！"
 podintroductions.124.c:0 "哈罗恩，我们可以多谈谈你的理论……"
 podintroductions.125.t:0 "你的过往"
 podintroductions.125.desc:0 "Fearless Lucita, after being trapped in the mortal world for being a woman, you are now trapped in the undead one for being a Lasombra. This can't continue. You are a free spirit, yearning for independence, and you won't wait for the centuries needed to become an elder to achieve it.\nYour first target should be your own [Sire|E], Ambrosio Luis Moncada, a fool who thinks that he can control you. Then [clan|E] Lasombra itself must understand that you aren't their 'rising star', you are your own woman and these decrepit idiots will learn to respect you.\nThe chaos that is an Iberia engulfed in your [clan|E]'s civil war will be the perfect opportunity for you to stake your own claim to greatness. You just have to exploit it well."
 podintroductions.125.a:0 "不自由毋宁死"
 podintroductions.lucita:0 "作为露西塔，你可以通过达成你的专属决议，来提高你的起始修正"
 caged_lucita_modifier:0 "受困的露西塔"
 caged_lucita_modifier_desc:0 "你还不是你自己故事的主人公，这让你愤怒不已。"
 unleashed_lucita_modifier:0 "受释的露西塔"
 unleashed_lucita_modifier_desc:0 "你自己的故事终于开始了。这将是光荣的。"
 lucita_decision:0 "露西塔的宿命"
 lucita_decision_tooltip:1 "时候到了"
 lucita_decision_desc:0 "你得先处理好困住你的最后一道枷锁。随后，将是反击时刻。"
 lucita_decision_confirm:0 "终于，自由了！"
 lucita_custom_decision:0 "安布罗西奥·路易斯·蒙卡达必须死"
 good_moncada_modifier:0 "完美世界"
 good_moncada_modifier_desc:0 "无论她是爱你还是恨你，露西塔都活着。你的世界是完美和谐的。"
 podintroductions.126.t:0 "你的过往"
 podintroductions.126.desc:0 "Pious Moncada, Iberia is in turmoil and God has called upon you to save it. Your [Sire|E], Sylvester de Ruiz, officially leads the Christian effort but you are the real power behind the throne. For now he is useful, but you might want to step into the light at one point.\nAnd then, there is Lucita... an angel sent by God to guide you no doubt, even if she doesn't realize it. Since her [Embrace|E], you have been the best you ever been, sharper, quicker, stronger. She will learn to appreciate you in time but until then, you need to make sure that she stays safe. You can't even stomach what would become of your poor soul if something happened to her..."
 podintroductions.126.a:0 "上帝赐予了我最棒的礼物"
 podintroductions.moncada:0 "作为蒙卡达，只要露西塔还活着，你就能享受这个修正。但如果她死了……"
 PODcanon_chars.20.t:0 "你的世界的末日"
 PODcanon_chars.20.desc:0 "她死了。\n露西塔，你的引路天使，死了。\n你已经失去希望了。这个世界可能也失去希望了，因为这显然证明上帝已经放弃了祂最忠实的仆人。你还能继续这种可悲的亡生吗？即使尝试又有什么意义呢？……也许，也许这是一项考验，就像上帝以前所做的那么多次。如果是这样，这将是你整个亡生中最艰难的一次。\n也许你会忍耐，但你甚至不确定你是否愿意。"
 PODcanon_chars.20.a:0 "她走了……"
 bad_moncada_modifier:0 "破碎世界"
 bad_moncada_modifier_desc:0 "露西塔已经死了。你现在是一个没有灵魂的躯壳，继续着毫无意义的亡生。"
 podintroductions.127.t:0 "你的过往"
 podintroductions.127.desc:0 "Prince Alfonzo, after centuries of waiting, Constantinople is finally yours. Be careful though, those cowardly Greek vampires fled when you expertly used the 4th Crusade to your advantage and are now rallying their troops and agents against you. You have wisely bend the knee to the See of Shadows to get their protection as you consolidate your rule. A temporary process of course, as you have greater ambitions than staying a mere vassal.\nYou care little for your 'faith' in the [cainite|E] Heresy and would change it in a heartbeat if it was needed, though there might still be opportunities to have by clinging to it.\nExpand the Latin rule and get rid of Byzantine's remnants as soon as possible. Your ascension is only beginning!"
 podintroductions.127.a:0 "新的胜利即将来临"
 podintroductions.alfonzo:0 "作为阿方索，你是唯一一位可以通过专属决议创建拉丁帝国的人。"
 alfonzo_decision:0 "拉丁之治"
 alfonzo_decision_tooltip:1 "是时候处理残余了"
 alfonzo_decision_desc:0 "你是拉丁人战胜希腊人的象征。接纳并利用这一形象为自己打造一个新的帝国。"
 alfonzo_decision_confirm:0 "拜占庭亡了"
 bad_gratiano_modifier:0 "新贵"
 bad_gratiano_modifier_desc:0 "你是勒森魃家族的不受宠子嗣。这没带来任何帮助！"
 podintroductions.128.t:0 "你的过往"
 podintroductions.128.desc:0 "Lord Gratiano, the powerful Lasombra himself saw your greatness and Embraced you into his [clan|E]. This act enraged your new 'brethren' and you have been branded as an upstart since then, denied the numerous responsibilities and titles that should be yours. You have to start from scratch.\nFor that purpose, you choose Verona, a city you know well since your mortals days, and the foothold has been made but... nothing has changed yet. They still laugh at you, insult you behind your back, plot your demise even! This must stop.\nYou will show them why Lasombra choose you. You will show them that Gratiano de Veronese was born to rule!"
 podintroductions.128.a:0 "他们会明白……"
 podintroductions.gratiano:0 "要摆脱葛莱西安诺的初始修正，你必须完成一项专属决议。"
 gratiano_decision:0 "天生的统治者"
 gratiano_decision_tooltip:1 "他们会学会的。"
 gratiano_decision_desc:0 "向勒森魃[clan|E]证明，你不仅仅是爸爸的新宠。取得一些他们必须注重的成就。"
 gratiano_decision_confirm:0 "他们已然学会"
 podintroductions.129.t:0 "你的过往"
 podintroductions.129.desc:0 "Lord Sejanus, after your fateful [Embrace|E], you drifted for quite a long time in Europe looking for a place to start your Empire of the Night. Your current location is promising, if perhaps a little too close to the powerful Hardestadt. You will have to deal with him.\nYou easily secured Princedom over this area because you received some very unexpected help. One strange English Tzimisce named Jack has been awed by you and your dreams and eagerly pledged himself to your service. After a brief inquiry, you think he is trustworthy and actually quite capable for such a young vampire.\nFinding a lesser recognizing your greatness is always gratifying, perhaps you could reward him with an important role on your burgeoning realm?"
 podintroductions.129.a:0 "我可以利用你"
 podintroductions.129.b:0 "我不需要任何帮助！"
 podintroductions.130.t:0 "你的过往"
 podintroductions.130.desc:0 "Lady Salianna, your coup against Alexander was a great success and you now finally control most of France. You had to make some concessions to make it happen though, most notably with Alexander's childe, Geoffrey du Temple, who got Paris itself as his reward. If you are to truly strengthen your hold on the country, you will need the prestigious capital in your hands.\nGeoffrey is young and gullible but has many friends who could be trouble. You will have to tread carefully in order to outsmart him without unnecessary bloodshed."
 podintroductions.130.a:0 "是时候反思一下我们的关系了"
 salianna_intro_tooltip:0 "在接下来的日子里，你会引发一些考虑你与杰弗里的关系的事件。"
 PODcanon_chars.21.t:0 "战胜杰弗里"
 PODcanon_chars.21.desc:0 "要开始实施你取得巴黎的密谋，你必须孤立杰弗里。他的派员和人脉网络并不强大，但身为一位梵卓，对你的一些臣民来说，他是一个比你更“合法”的法兰西统治者。通过一些贿赂和隐晦的威胁，你可以改变这种状况。显然，他们会很容易理解，你会成为一个比一些愚蠢的军阀更好的巴黎亲王。"
 PODcanon_chars.21.a:0 "小菜一碟"
 PODcanon_chars.21.b:0 "我会让杰弗里留着他的战利品"
 salianna_exit_tooltip:0 "你放弃了为你自己取得巴黎的计划"
 PODcanon_chars.22.t:0 "剪除杰弗里的羽翼"
 PODcanon_chars.22.desc:0 "你很容易就摆脱了大部分杰弗里的试探性支持者，除了剩下两个人。安茹女王伊思妲·德·布莱斯已经表明了她的反对意见，但是……反正她已经厌恶你了，所以谁在乎呢？\n更麻烦的是顽固的弗朗索瓦·德阿伦库。这位有权有势的里昂亲王已经承诺为杰弗里的事业效力，永不变节。如果你继续你的行动路线，你将面对一个新的强大敌人。"
 PODcanon_chars.22.a:0 "或多或少……"
 PODcanon_chars.22.b:0 "我会让杰弗里留着他的战利品"
 PODcanon_chars.23.t:0 "巴黎，我回来了"
 PODcanon_chars.23.desc:0 "你已经完成了准备工作，现在准备以破竹之势将杰弗里驱出巴黎。这座城市将成为你的爱之皇廷的强大首都，并确保妥芮朵在法兰西的优势地位世代相传。\n最后要解决的问题是杰弗里本人。没有了巴黎，他基本上就没有爪牙了，如果你认为他没有更多的用处，你可以把他扔到一边。或者你可以把他留在手边，以便在将来执行另一项任务。在任何情况下，他显然对此事没有发言权。"
 PODcanon_chars.23.a:0 "我将在胜利中获得恩典"
 PODcanon_chars.23.b:0 "娇气的血侍对我没用"
 podintroductions.131.t:0 "你的过往"
 podintroductions.131.desc:0 "Lady Isouda, during the chaos of Alexander's fall, you were beaten to the finish line for leadership of the Courts of Love by Salianna. This has not to be the end of your career though. Your hold on Anjou is still strong, and Salianna is vulnerable as long as her power isn't consolidated.\nYou will have need of help for the future battles, be they political or military. Fortunately, you have a strong handle on how to 'educate' your childer and to get rid of the useless weak ones. Use this to your advantage, and France might finally be yours."
 podintroductions.131.a:0 "战争还没有结束"
 isouda_intro_tooltip:0 "作为伊思妲，你在教育子嗣方面有一种更有回报，但有风险的专属可能性。"
 POD_education_events.1.option.e:0 "让我们看看其是否在我的宫廷里幸存下来……"
 POD_education_events.1.option.isouda:0 "作为伊思妲，你可以把你的子嗣放在无情的角斗场，或者说你的宫廷上。他们将从中变得更加强大……如果他们能活下来的话。"
 POD_education_events.26.t:0 "教育：可用的子嗣"
 POD_education_events.26.desc:0 "试炼已经结束，看起来这位还算是有用。嗯，勉强还不错吧，但说实话，你有一点点失望。也许你下次应加点料，让其在你无情的宫廷里蠕动求生的时候获得更多挑战，而看起来更有乐趣？嘛，改夜再想吧。"
 POD_education_events.26.option.a:0 "干得不错我猜"
 POD_education_events.27.t:0 "教育：无用的子嗣"
 POD_education_events.27.desc:0 "试炼已经结束，嗯，而这位没能度过。哦，好吧，反正还有很多凡人可以试炼。至少在中途完结之前，其看起来都很有趣。目睹无助的稚子陷入你的宫廷的阴谋网中，总是给你一种深深的满足感。"
 POD_education_events.27.option.a:0 "真的是最好的娱乐"
 podintroductions.132.t:0 "你的过往"
 podintroductions.132.desc:0 "埃斯克拉蒙德女士，你是公认的自阿尔比派十字军开始以来的奥克人抵抗法兰西的领袖……虽然你对奥克西塔尼亚本身并不那么关心，不过这也是个有用的针对公众视线的伪装。\n由于你的一种独特能力，该障眼法更上一层。通过以你过世的[Sire|E]告诉你的方式使用威仪术，你能够使任何男人迷失在一个他是骑士而你是公主的童话故事中。显然，从此，这位善良的公主可以指挥她勇敢的骑士杀死“怪物”，以保护她……"
 podintroductions.132.a:0 "我们每人都扮演着一位角色"
 esclarmonde_intro_tooltip:0 "作为埃斯克拉蒙德，你有一项可对你国度内的男人使用的专属角色互动，该允许你魅惑他们。这将需要花费虔诚。"
 POD_esclarmonde_interaction:0 "埃斯克拉蒙德的童话魔咒"
 POD_esclarmonde_interaction_desc:0 "勇敢的骑士，请在我需要的时候帮助我吧！"
 faydit_modifier:0 "埃斯克拉蒙德的童话魔咒"
 faydit_modifier_desc:0 "这个可怜的灵魂迷失在幻觉中，以为自己是美丽的埃斯克拉蒙德公主的骑士。"
 podintroductions.133.t:0 "你的过往"
 podintroductions.133.desc:0 "Fearless Melinda, your [Sire|E], Helena, abandoned you after getting bored of tormenting you. You are now left to fend for yourself but your have learned one important thing from your time under Helena's 'tutelage' : it's you against them.\nThose that will kiss your feet and prove useful might live. The others... you will have so much fun dealing with the others.\nIf this world has to be plunged into eternal horror for you to be powerful, respected and independent, then so be it.\nYou will reign in Hell, and damn the Heavens."
 podintroductions.133.a:0 "我想我现在明白了，“母亲”"
 melinda_intro_tooltip:0 "作为梅琳达·加尔布雷思，你有一项专属决议，只要你的首都还没有完全毁掉，你就可以蹂躏你的首都，获得一些快速的回报。"
 melinda_decision:0 "暴动！"
 melinda_decision_tooltip:1 "是时候发泄一下了"
 melinda_decision_desc:0 "在你的首都有许多无助的凡人。现在可能是时候让他们知道，末日的到来比他们想象的要快……"
 melinda_decision_confirm:0 "……而地狱紧随她后"
 podintroductions.134.t:0 "你的过往"
 podintroductions.134.desc:0 "Cunning Rafael, let's be honest, you have no idea of what the hell is going on. You barely saved your unlife by tricking your [Sire|E] into thinking that you are an artist of schemes and mischief but you still have no real clue on how this whole vampire society works.\nFrom the few things you have gathered, it would be best for you to learn very fast, because clueless vampires make for dead vampires most of the time. You have only one advantage to speak of, your wits. You are capable of convincing almost anyone to go along with almost anything. This might be your lifeline..."
 podintroductions.134.a:0 "我能做到！"
 rafael_intro_tooltip:0 "作为拉斐尔，你有一项花费声望来欺骗其他有地统治者给你一些东西的专属角色互动。具体回报取决于他们的特质。"
 POD_rafael_interaction:0 "我的超值提议！"
 POD_rafael_interaction_desc:0 "向这位统治者提出一个非同寻常的提议"
 PODcanon_chars.24.t:0 "诱人的骗局"
 PODcanon_chars.24.desc:0 "拉斐尔，你的完美推销让这个人着迷了。现在是时候去收割了，你想要什么？它将取决于你所处的角度。"
 PODcanon_chars.24.a:0 "你可以相信我！"
 rafael_trusting_tooltip:0 "这个选项可用是因为你的目标拥有轻信他人或合群特质。"
 PODcanon_chars.24.b:0 "……然后我的[Sire|E]就抛弃了我！"
 rafael_compassionate_tooltip:0 "这个选项可用是因为你的目标拥有慈悲特质。"
 PODcanon_chars.24.c:0 "这很吸引人，我肯定会皈依的！"
 rafael_zealous_tooltip:0 "这个选项可用是因为你的目标拥有狂热特质。"
 PODcanon_chars.24.d:0 "有意思的东西，让我记个笔记！"
 rafael_diligent_tooltip:0 "这个选项可用是因为你的目标拥有勤勉或耐心特质。"
 PODcanon_chars.24.e:0 "该死的，我从来没敢这么做！"
 rafael_brave_tooltip:0 "这个选项可用是因为你的目标拥有勇敢或固执特质。"
 PODcanon_chars.24.f:0 "你简直是最棒的！"
 rafael_ambitious_tooltip:0 "这个选项可用是因为你的目标拥有野心勃勃或傲慢特质。"
 PODcanon_chars.24.g:0 "亡生很棒！"
 rafael_content_tooltip:0 "这个选项可用是因为你的目标拥有安于现状或谦卑特质。"
 PODcanon_chars.24.h:0 "他们绝对是来抓我们的！"
 rafael_deceitful_tooltip:0 "这个选项可用是因为你的目标拥有狡诈或多疑特质。"
 PODcanon_chars.24.i:0 "……这很形象"
 rafael_cynical_tooltip:0 "这个选项可用是因为你的目标拥有愤世嫉俗或冷酷特质。"
 PODcanon_chars.24.j:0 "说的不错！"
 rafael_end_tooltip:0 "你没有更多角度来进逼该目标！"
 podintroductions.135.t:0 "你的过往"
 podintroductions.135.desc:0 "Fair Rosamund, here you are in Magdeburg almost abducted by the exiled Methuselah Alexander. The once ruler of France says that he loves you, but you know that his cold heart will one night be angered enough to destroy you as he did with his previous 'soulmates'. You need allies.\nAnd who better than the bold Jurgen von Verden? You have known him for a while now, and you both are very fond of each other. But your love won't be able to truly grow, even if you married him, until Alexander is dealt with once and for all. You have been taught well, and you are no helpless damsel Rosamund, you know what to do."
 podintroductions.135.a:0 "爱战胜一切"
 rosamund_intro_tooltip:0 "作为罗莎蒙，只要你和约根仍然是灵魂伴侣，你就有一项专属决议可以使用。"
 love_triumph_modifier:0 "爱的胜利"
 love_triumph_modifier_desc:0 "……他们从此就幸福地生活在了一起。大概。"
 rosamund_decision:0 "三角恋"
 rosamund_decision_tooltip:1 "是时候简化你的爱情生活了"
 rosamund_decision_desc:0 "亚历山大是一个压迫性的控制狂，随时都可能在愤怒中杀死你。你得对付他。"
 rosamund_decision_confirm:0 "圆满的结局"
 rosamund_custom_decision:0 "亚历山大必须死"
 rosamund_custom_decisionb:0 "你必须得是约根·冯·费尔登的灵魂伴侣"
 podintroductions.136.t:0 "你的过往"
 podintroductions.136.desc:0 "Wise Karl, your initiative for preserving the old ways has so far been a success. The Free State is still young, but grows more assured every night... but trouble are on the horizon.\nYour two main allies, Eirik Longtooth and Ulfsdottir, have reached a breaking point and are at each other's throat. Eirik is a powerful warrior but his utter lack of care for the mortals upsets the Valkyrie. In return, Ulfsdottir's quiet acceptance of the slow end of your ways enrages Longtooth.\nIf you want the Free State to endure, you need to choose a side... and probably deal with the one that will feel wronged."
 podintroductions.136.a:0 "你是个怪物，埃里克，必须得有人阻止你"
 podintroductions.136.b:0 "我们必须为了大业而战，乌尔夫斯多蒂尔！"
 podintroductions.136.c:0 "你们都是蠢货！"
 podintroductions.137.t:0 "你的过往"
 podintroductions.137.desc:0 "Powerful Bjorn, you are once again dragged into a losing war. As you were sailing for Vinland, you were shipwrecked in Scotland and are the only survivor of your initial crew. The local vampires, mostly refugees from Mithras' iron grip on the isles, were very welcoming, so much that you feel indebted to them.\nAnd you are not the kind of man of leaving a friend behind so here you are, leading the war effort against Mithras' inevitable attack on this land. You will need a new crew for such a daunting task and only the best and most loyal will do."
 podintroductions.137.a:0 "新地方，老麻烦"
 bjorn_intro_tooltip:0 "作为比约恩，你有着可以让某人成为你的队友的专属角色互动。\n你最多只能有5个无地的吸血鬼作为队友，而且他们需要对你有好感才会接受。"
 bjorn_crew_modifier:0 "比约恩的队友"
 bjorn_crew_modifier_desc:0 "比约恩·加里森的队伍的成员，一个留给训练有素的战士的位置"
 POD_bjorn_crew_opinion:0 "比约恩的队友"
 POD_bjorn_interaction:0 "邀请加入你的队伍"
 POD_bjorn_interaction_desc:0 "该角色将成为你的5个队友之一"
 POD_bjorn_crew_interaction_limit:0 "该角色必须对你好感为正，而且你不能有超过5个队友"
 POD_bjorn_opinion_limit:0 "该角色必须对你好感为正"
 podintroductions.138.t:0 "你的过往"
 podintroductions.138.desc:0 "Fearless Robin, the future of your rebellion looks dire. The hated tyrant, Mithras, has won the latest pitched battle between you two several years ago, severely reducing your influence over the British Isles. Still there is hope, as he has not yet gone for the kill, perhaps busy with other matters or simply bored as very old vampires like him tend to be. This might be your chance.\nPrepare quickly in case of another attack, plant the seed of rebellion in those who are willing to listen and take down Mithras once and for all. Only then will the British Isles be truly free."
 podintroductions.138.a:0 "我被逼到了墙角，但我还没有被击败"
 leeland_intro_tooltip:0 "作为罗宾，你有一项在年轻吸血鬼中播下叛变的种子的专属角色互动，给其他国度造成混乱。"
 seed_of_rebellion_leeland_modifier:0 "叛变之种"
 seed_of_rebellion_leeland_modifier_desc:0 "这个角色已经被一个传奇的不法之徒推到了叛变的边缘"
 POD_leeland_interaction:0 "叛变之种"
 POD_leeland_interaction_desc:0 "在该年轻吸血鬼心智中播下叛变的种子"
 podintroductions.139.t:0 "你的过往"
 podintroductions.139.desc:0 "Lady Veronique, you are back in your home city after your Parisian adventure. You helped in the coup against Alexander, the tyrannical Prince of France, and gained some recognition in the process. Sadly, you also lost many trusted retainers to the deceitful Jean Baptiste de Montrond. You might have to 'repay' him one night.\nBeyond this burgeoning rivalry, your position is mostly secure. You are already hard at work rebuilding your entourage of mortals friends, an oddity among [cainites|E], but one that gives you strength. Use your trust in humanity to your advantage and those that underestimate you will soon learn that you can be as skilled in any field of expertise as they are."
 podintroductions.139.a:0 "我会以自己的方式参与他们的棋局"
 veronique_intro_tooltip:0 "作为维罗妮克，只要你还具有人性之道信仰，你在“巡视首都​”活动中就有着专属事件。"
 POD_survey_events.150.t:0 "巡视：维罗妮克的伴随者"
 POD_survey_events.150.desc:0 "你是少数几位真正会与凡人培养一些关系的[cainites|E]之一，而不是只把他们当作牲畜或更大棋局中的棋子。因此，你在城里实际上有一些朋友，愿意在许多不同的事情上帮助你。就像所有的人脉一样，你必须不时地拜访他们，处理他们可能遇到的任何相关麻烦，但你总是发现这是一些有意义的经历。凡人对不断变化的世界的适应性比任何[cainite|E]所想象的要强得多。"
 POD_survey_events.150.option.a:0 "很高兴再次见到你！"
 veronique_survey_tooltip:0 "只要维罗妮克坚持人性之道信仰，这种专属巡视结果就会一直发生在她身上。"
 podintroductions.140.t:0 "你的过往"
 podintroductions.140.desc:0 "Great Menele of Sparta, you have chased the traitorous Helena for centuries now and there seems to be no end to this conflict. She obviously needs to be punished for having engineered your beloved Carthage's destruction but you also mourn for the decline of your [clan|E]. You could do a lot to help it recover... if you weren't so preoccupied with the hunt for your nemesis.\nYour legendary rivalry must end one way or another, then it might still be time to heal your broken [clan|E]."
 podintroductions.140.a:0 "终结永恒恩怨……"
 menele_intro_tooltip:0 "作为墨涅拉俄斯，你有一项专属决议，需要你先解决海伦这麻烦。如果你达成了它，你就可以解锁一个角色互动，能让其他布鲁赫了解你[clan|E]的光辉。"
 menele_decision:0 "斯巴达对特洛伊"
 menele_decision_desc:0 "海伦已经占据了你过多的时间。处理掉她，之后还有更重要的事需要你关注。"
 menele_decision_confirm:0 "终于！"
 menele_decision_tooltip:0 "海伦必须死，或者不再是你的敌人"
 menele_decision_effect_tooltip:0 "你将可以解锁一个让其他布鲁赫了解你[clan|E]的光辉的角色互动"
 PODcanon_chars.25.t:0 "新的开始"
 PODcanon_chars.25.desc:0 "终于，与海伦的这桩破事过去了。这花了很长时间，但你终于意识到，她最大的背叛并不是帮助罗马人对抗迦太基，而实际上是在你的[clan|E]最需要你的时候让你分心了。\n布鲁赫依然分裂，被愤怒和悲伤所淹没，是辉煌的古时夜晚的苍白反转。这不一定是唯一的出路。你是传奇的墨涅拉俄斯，只要你开口，即使是你[clan|E]中最顽固的成员也会倾听。你必须成为他们前进的指路明灯，因为没有其他人能做到。"
 PODcanon_chars.25.a:0 "我们是迦太基的遗裔"
 menele_victory_tooltip:0 "你将可以解锁一个让其他布鲁赫了解你[clan|E]的光辉的新角色互动"
 POD_menele_teachings_interaction:0 "迦太基的教诲"
 POD_menele_teachings_interaction_desc:0 "让其他布鲁赫记起他们的光荣历史和光明的未来。"
 PODcanon_chars.26.t:0 "课程"
 PODcanon_chars.26.desc:0 "作为仍活跃在这些夜的最受尊敬的布鲁赫，你有足够的影响力让你的[clan|E]的任何成员坐下来听你说话，只要你用心去做。\n在准备工作完成后，你只需要考虑你到底要教这个人什么。如果说与海伦的冲突教会了你什么，那就是你没有足够的时间只浪费在一个人身上。"
 PODcanon_chars.26.a:0 "掌控你的心兽只有一种办法"
 PODcanon_chars.26.b:0 "让我们谈谈迦太基"
 PODcanon_chars.26.c:0 "自控是关键"
 ANTI_HEDEON_PACT:0 "反海德翁协定"
 podintroductions.141.t:0 "你的过往"
 podintroductions.141.desc:0 "Lord Yitzhak, you have recently managed to considerably expand your influence over Poland thanks to Prince Razkoljna's troubles with a Ventrue incursion. But you aren't the only one to profit from this event. Hedeon Yaroslavich, a vicious monster even for his already quite sadistic [clan|E], has also made his domain grow quite considerably. His dark shadow now looms ever closer to engulfing Poland.\nThere might be a way out. You don't trust Razkoljna, but you know she is a far lesser evil than Hedeon, and she probably feels the same way about you. Negotiating a truce between you two could allow you both to focus on Hedeon first. After that obviously, all bets are off..."
 podintroductions.141.a:0 "拉兹科利纳亲王，让我谈谈"
 podintroductions.141.b:0 "她不比海德翁好多少！"
 podintroductions.142.t:0 "你的过往"
 podintroductions.142.desc:0 "Lord Hektor, New Lacadaemonia is secure thanks to your strong leadership. The crumbling Byzantine Empire all around your domain might even present opportunities for expansion if you so desire. Though there are also troubles at home to deal with.\nYou rule with the advise of a Senate, in the Carthaginian tradition, but this august institution stands divided. Most senators want you to follow the path of an idealized and pure Carthage. A growing minority wants a more pragmatic approach, with including the most unsavory elements of ancient Carthage. Your support for one or the other faction will pave the way for your realm's focus in the coming years."
 podintroductions.142.a:0 "大会开始！"
 hektor_intro_tooltip:0 "作为赫克托，你有一项专属决定，那就是召集参议院并选择你未来几年的重心。\n如果安条克和莫林这两位党派领导人还活着，你可以选择一个更强大的重心。"
 hektor_decision:0 "参议院大会"
 hektor_decision_tooltip:1 "我需要参议院的建议"
 hektor_decision_desc:0 "在即将到来的参议院任期内，你会偏向哪一党派？"
 hektor_decision_confirm:0 "开会时请保持秩序！"
 hektor_decision_effect_tooltip:0 "你将选择未来几年的政策。"
 PODcanon_chars.27.t:0 "参议院"
 PODcanon_chars.27.desc:0 "赫克托，你的新生迦太基参议院的这次新大会和以往一样。理想主义者斥责你“ 背叛”了他们亲爱的乌托邦，而实用主义者则敦促你想想为什么迦太基曾如此强大，且不计代价。值得庆幸的是，最后的决定权只属于你。"
 PODcanon_chars.27.a:0 "为理想而战！"
 PODcanon_chars.27.b:0 "迦太基是首要且主要的理想。"
 PODcanon_chars.27.c:0 "两者间持平是唯一的途径。"
 PODcanon_chars.27.d:0 "必须做出牺牲！"
 PODcanon_chars.27.e:0 "狼群已在我等门外！"
 antiochus_alive_tooltip:0 "这个选项可用是因为安条克还活着。"
 maureen_alive_tooltip:0 "这个选项可用是因为莫林还活着。"
 full_idealist_support_modifier:0 "彻底支持理想主义"
 full_idealist_support_modifier_desc:0 "迦太基是一个纯粹而完美的乌托邦。没有人可以反驳这个事实。"
 idealist_support_modifier:0 "支持理想主义"
 idealist_support_modifier_desc:0 "迦太基是一个值得为之斗争的理想，尽管它可能有任何缺陷。"
 pragmatist_support_modifier:0 "支持实用主义"
 pragmatist_support_modifier_desc:0 "我们并不生活在梦中。必须得有牺牲。"
 full_pragmatist_support_modifier:0 "彻底支持实用主义"
 full_pragmatist_support_modifier_desc:0 "如果没有它的梦魇，迦太基的幻梦就一无是处。"
 podintroductions.143.t:0 "你的过往"
 podintroductions.143.desc:0 "Lady Ecaterina, you have so far been able to grow your influence in the region in no small part thanks to your very talented childe, Christof Romuald. Sadly your reckless offspring has gone missing after what seems to be a brutal battle in Vysehrad castle. The madman tried to storm the fortress on his own by hacking and slashing all the Tzimisce horrors guarding it!\nStill, Christof will be Christof and you know that, properly guided, he can be very useful. You could organize a search party in the ruins of Vysehrad to find him and bring him back to you. Or maybe his usefulness has run its course?"
 podintroductions.143.a:0 "我又有一项任务要给你，克里斯托夫"
 podintroductions.143.b:0 "他那由阴谋组成防护似乎已经持续不了多久了"
 podintroductions.144.t:0 "你的过往"
 podintroductions.144.desc:0 "Lord Augutus, you have been quick to seize upon the opportunities given to you by the [Embrace|E]. Your family's mercantile (and necromantic) empire is growing and these indolent Cappadocians don't expect a thing. Still, you are only one man and you must first focus your efforts on finally wrestling control of Venice itself.\nFor the other matters, you can rely on your three lieutenants, Claudius, Ambrogino and Ignazio. Each has his own specific strong suit and all of them want your approval. If you play your cards right, you can keep them useful and busy squabbling among each other (and not scheming against you) for a long time."
 podintroductions.144.a:0 "我等的扬升开始了"
 augustus_intro_tooltip:0 "作为奥古斯都，你有一项专属决议，让你可以偏爱众副手中的之一，只要其还活着。"
 augustus_decision:0 "你的右手"
 augustus_decision_tooltip:1 "吵闹但是有用的子嗣"
 augustus_decision_desc:0 "哪位副手在接下来的年里会有你的偏爱？"
 augustus_decision_confirm:0 "让我想想……"
 augustus_decision_effect_tooltip:0 "你将选择在接下来的年里偏爱的副手"
 augustus_custom_decision:0 "至少克劳狄乌斯、伊尼亚齐奥或安布罗吉奥中的一人还活着"
 claudius_support_modifier:0 "克劳狄乌斯的支持"
 claudius_support_modifier_desc:0 "克劳狄乌斯是个阴险狡诈的混蛋。但他是你的阴险狡诈的混蛋。"
 ignazio_support_modifier:0 "伊尼亚齐奥的支持"
 ignazio_support_modifier_desc:0 "伊尼亚齐奥并不是最聪明的乔凡尼，但他强力的剑术可能是非常有用的。"
 ambrogino_support_modifier:0 "安布罗吉奥的支持"
 ambrogino_support_modifier_desc:0 "安布罗吉奥的野心大到对其不利的地步。最好还是满足和亲近他。"
 PODcanon_chars.28.t:0 "副手"
 PODcanon_chars.28.desc:0 "作为家族的族长，你的宠爱本就是一种宝贵的资源。你的三个主要代理人总是想讨好你，并超越其的竞争对手。这个小竞争还有一个好处，就是让其分割开来，忙着在其等之间策划阴谋互相针对，而不是反抗你。双赢。\n但最终，该信任谁和该拒绝谁，只能由你自己选择。"
 PODcanon_chars.28.a:0 "克劳狄乌斯是我最宠爱的儿子。"
 PODcanon_chars.28.b:0 "安布罗吉奥是我们间最棒的。"
 PODcanon_chars.28.c:0 "伊尼亚齐奥的简易方法很有用。"
 PODcanon_chars.28.d:0 "这次没人赢得我的青睐"
 claudius_alive_tooltip:0 "这个选项可用是因为克劳狄乌斯还活着。"
 ambrogino_alive_tooltip:0 "这个选项可用是因为安布罗吉奥还活着。"
 ignazio_alive_tooltip:0 "这个选项可用是因为伊尼亚齐奥还活着。"
 podintroductions.145.t:0 "你的过往"
 podintroductions.145.desc:0 "Lord Ambrogino, you are destined for greatness. Despite being a mere bastard of the Giovanni family, you have already achieved much and know more about your new vampiric condition than the rest of the family, Augustus included. Still this is merely the beginning, as your head is spinning with the possibilities in front of you.\nYou need more occult texts, more lost prophecies, more cryptic parchments. There is a truth to be found somewhere and this truth can lead to Godhood, you are sure of it. The journey will be long but the reward... the reward will be your wildest dream, no your destiny!, coming true."
 podintroductions.145.a:0 "我将寻到关键"
 ambrogino_intro_tooltip:0 "作为安布罗吉奥，你在完成“萨尔贡圣书”决议后将获得一项专属决议。"
 ambrogino_sargon_codex_modifier:0 "安布罗吉奥的宿命"
 ambrogino_sargon_codex_modifier_desc:0 "萨尔贡圣书所展示的比你所能想像出的还要多！神格从未如此触手可及……"
 pod1230objectives.49.c:0 "我知道该如何掌控它……"
 sargon_ambrogino_tooltip:0 "这个选项只对安布罗吉奥·乔凡尼可用"
 podintroductions.146.t:0 "你的过往"
 podintroductions.146.desc:0 "Lord Claudius, that conniving, scheming bastard Ambrogino has gone too far this time. You have long groomed your own great-great-granddaughter, Lucretia, for a prestigious position as one of your childer but that greedy thief somehow convinced your own father Augustus to gift Lucretia to him! This is the last straw.\nYou are Augustus' heir, both in life and unlife. Ambrogino is nothing more than a jumped up son of a maid thinking too highly of himself. It is time to get rid of him once and for all... and of Lucretia too, as she has been tainted by the bastard's blood now. Only then will you be able to assume your rightful place as Augustus' right hand."
 podintroductions.146.a:0 "他将为这一阴谋感到后悔！"
 claudius_intro_tooltip:0 "作为安布罗吉奥，你有一项除掉克劳狄乌斯和卢克丽霞来获得收益的专属决议。"
 rightful_giovanni_heir_modifier:0 "正当的乔凡尼继承人"
 rightful_giovanni_heir_modifier_desc:0 "没有人可以否认你现在是你父亲遗产的真正继承人。"
 claudius_decision:0 "乔凡尼的继承者"
 claudius_decision_tooltip:1 "唯有你，没有他人，是奥古斯都的继承者"
 claudius_decision_desc:0 "除掉那个讨厌的安布罗吉奥和他从你那里偷走的最受他宠的子嗣！这将是对任何潜在的对手的有力警告。"
 claudius_decision_confirm:0 "正义的胜利！"
 claudius_custom_decision:0 "卢克丽霞和安布罗吉奥都必须死"
 weak_falsinar_modifier:0 "微弱的法尔西纳之助"
 weak_falsinar_modifier_desc:0 "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 podintroductions.147.t:0 "你的过往"
 podintroductions.147.desc:0 "Lord Markus Musa, your fame in both your family and your [clan|E] is rising fast. You have proven yourself more than capable by thwarting Lazarus' mad scheme in Egypt. The cost was high though and you lost your two trusted retainers in the battle. One of them, Falsinar, has proven to be quite the willful soul as, even from the Underworld, he is still helping you as best as he can.\nFalsinar is a weak and young wraith still, but you are a skilled necromancer and as such you have identified two possibilities to help your spectral friend manifest himself more easily in your world. Both opportunities won't be easy to achieve but you and Falsinar have all the time in the world anyway."
 podintroductions.147.a:0 "亡灵术师与死灵，完美的搭档"
 markus_intro_tooltip:0 "作为马库斯·穆萨，你有两项当达成时能强化法尔西纳的专属决议"
 markus_nikita_decision:0 "死亡节点"
 markus_nikita_decision_tooltip:1 "关键之一在于克罗地亚"
 markus_nikita_decision_desc:0 "斯雷代茨的尼基塔，挪得大主教，似乎在引诱一些强大的亡灵能量到他身边。这是个加强法尔西纳的机会。"
 markus_nikita_decision_confirm:0 "又一受我束缚的灵魂"
 markus_nikita_custom_decision:0 "斯雷代茨的尼基塔必须死"
 markus_nikita_decision_effect_tooltip:0 "法尔西纳将变得更强"
 medium_falsinar_modifier:0 "法尔西纳之助"
 medium_falsinar_modifier_desc:0 "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 high_falsinar_modifier:0 "强力的法尔西纳之助"
 high_falsinar_modifier_desc:0 "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 markus_egypt_decision:0 "回到埃及"
 markus_egypt_decision_tooltip:1 "这个地方有一些不好的回忆……"
 markus_egypt_decision_desc:0 "法尔西纳在埃及为保护你免受拉撒路的伤害而死。你从未能够找回他的遗体。若做到了肯定会帮助你加强他的死灵。"
 markus_egypt_decision_confirm:0 "适当的安葬"
 markus_egypt_decision_effect_tooltip:0 "法尔西纳将变得更强"
 podintroductions.148.t:0 "你的过往"
 podintroductions.148.desc:0 "Lord Japhet, your role as an informal leader of [clan|E] Cappadocian is an ungrateful one. Your brethren are known for being quite reclusive and mostly pay no heed to your august responsibility. Worse still, your own [Sire|E], Cappadocius himself, is often lost in his delusions of grandeur or fits of madness. But as the founder of the [clan|E], his word is law and you are nothing if not dutiful.\nHis latest fancy has seen the Venetian Giovanni Embraced into the Blood, something you strongly disagreed with. You have no choice but to carry on though, limiting your [Sire|E]'s worst excesses while preserving the integrity of [clan|E] Cappadocian. Eternity has never felt so long."
 podintroductions.148.a:0 "我的工作从未完成"
 japhet_intro_tooltip:0 "作为雅弗，你有一项检视卡帕多修斯的专属小决议。不过要小心他的奇行。"
 japhet_decision:0 "父之罪"
 japhet_decision_tooltip:1 "希望他正处于好心情……"
 japhet_decision_desc:0 "你是埃尔吉耶斯，卡帕多修斯本人的居所的看守人。这是一个巨大的荣誉……也是一个巨大的负担，因为上古耆宿往往是难以理解的。"
 japhet_decision_confirm:0 "没有回头路了"
 japhet_decision_effect_tooltip:0 "你将检视卡帕多修斯，期望他还好……而且没太迷失在自己的幻想世界里。"
 PODcanon_chars.29.t:0 "卡帕多修斯：计划"
 PODcanon_chars.29.desc:0 "他又来了……你庄严的[Sire|E]，可敬的卡帕多修斯自己又开始了他的妄想，想要[diablerize|E]上帝。作为一个热衷于基督教的人，他一直以自己扭曲的方式迷恋着“全一的上帝”。你很肯定奥古斯都·乔凡尼的[Embrace|E]也与此有某种联系。\n在任何情况下，他都在详细讲述他的疯狂计划，当然希望得到你的热情批准。你没有办法和他讲道理，但你至少希望不要在被这个疯狂的追求拖得太深。"
 PODcanon_chars.29.a:0 "这可能仍有一些缺陷。"
 PODcanon_chars.29.b:0 "多么完美的计划，[Sire|E]！"
 PODcanon_chars.29.c:0 "*叹气* 是的，这很厉害"
 PODcanon_chars.30.t:0 "卡帕多修斯：导师"
 PODcanon_chars.30.desc:0 "你尊敬的[Sire|E]今晚的心情很好，很安静，把你带回到了他的妄想心开始游荡之前的美好时光。他实际上很高兴见到你，你们谈论了你们所看到的许多奇迹和恐怖。正是在这些轻松的时光里，你回忆起了卡帕多修斯曾经是一位伟大的人，希望现在也能如此。\n你离开他的房间时，更加坚定了继续工作的决心，而且比进来时更加聪慧了。"
 PODcanon_chars.30.a:0 "萨尔贡[Sire|E]如何？"
 PODcanon_chars.30.b:0 "我期望我能认识以诺本人……"
 PODcanon_chars.30.c:0 "我们能谈谈亚设么？"
 PODcanon_chars.31.t:0 "卡帕多修斯：牧师"
 PODcanon_chars.31.desc:0 "卡帕多修斯是一个狂热的信徒，他对基督教的看法是扭曲的。因此，他想参加弥撒……或亲自担任牧师，尽管这显然很讽刺。\n你已经习惯于处理他的这种癖好，但总是很难避免不必要的关注，因为你的[Sire|E]对他的吸血鬼状况并不完全谨慎。"
 PODcanon_chars.31.a:0 "我将举办圣餐"
 PODcanon_chars.31.b:0 "祈祷就够了"
 PODcanon_chars.31.c:0 "安全第一"
 podintroductions.149.t:0 "你的过往"
 podintroductions.149.desc:0 "Lord Bela, you have finally found your purpose in life. The petty chains of Christian morality aren't for you, you are destined for so much more! Kupala, this benevolent and powerful entity, is looking for an avatar on Earth and who better than you?\nObviously some sacrifices will have to be made... or a lot. But who cares about a person, a city or even an entire nation in the face of apotheosis? You certainly don't. Soon you wil rip apart the fragile veil of sanity of this doomed world, then all will be ashes, blood and fire.\nAnd in this cataclysmic rebirth, you will stand as the only survivor."
 podintroductions.149.a:0 "一个垂死世界的最后喘息……"
 bela_intro_tooltip:0 "作为贝拉·拉森科，你有一项为库帕拉献祭你的廷臣的专属决议。如果你做得够多，谁知道会发生什么？"
 bela_decision:0 "库帕拉崛起"
 bela_decision_tooltip:1 "送他们下地狱！"
 bela_decision_desc:0 "库帕拉需要献祭才能显现在这个不幸的世界上。而你非常乐意提供。"
 bela_decision_confirm:0 "地狱在崛起。"
 bela_decision_effect_tooltip:0 "完成了……"
 kupala_rising_weakest:0 "隐然的库帕拉影响"
 kupala_rising_weakest_desc:1 "伟大的恶魔已经注意到你的努力……"
 kupala_rising_weak:0 "微弱的库帕拉影响"
 kupala_rising_weak_desc:0 "伟大的深缚种已经注意到你的持续努力……"
 kupala_rising_medium:0 "中等的库帕拉影响"
 kupala_rising_medium_desc:0 "伟大的大公爵把你当作祂最喜爱的侍从……"
 kupala_rising_strong:0 "强力的库帕拉影响"
 kupala_rising_strong_desc:0 "伟大的大天使现在离你很近，在你耳边低语，让你做更多的事……"
 kupala_avatar_modifier:0 "库帕拉的化身"
 kupala_avatar_modifier_desc:0 "……而地狱随祂其后"
 PODcanon_chars.32.t:0 "吾等为一"
 PODcanon_chars.32.desc:0 "该宿主很有趣。显然，与你的末日形态相比，它是相当脆弱的，但它能用。你不能否认它为把你召唤入一个更适合这个世界的形态所做的巨大努力。在你接管的过程中，你很高兴能迅速吞噬他的灵魂。\n在那个该死的监狱里关了那么久之后，你终于自由了，现在有很多事情可做。尽管你有相当大的力量，但这脆弱的身体在崩溃之前只能承受这么多，所以你必须小心。不过，感谢召唤你的那个傻瓜，你有的是时间。\n毕竟通往地狱最安全的那条道路是渐进的那一条。"
 PODcanon_chars.32.a:0 "天堂在垂泪"
 silver_attacks_modifier:0 "银牙劫掠"
 silver_attacks_modifier_desc:1 "狼族在这个省份里很不安分，不断地试探你控制力的极限。"
 podintroductions.150.t:0 "你的过往"
 podintroductions.150.desc:0 "Lady Apacia, your adopted people is in danger. Your control over the Khanate of Sibir is challenged by packs of rabid Silver Fangs Lupines, angry at your presence in what they consider as their homeland. You could fight them, but it would be a long and arduous process and your position in the region is already quite insecure.\nAnother solution is presenting itself though, the Anda, vampires from the Mongol culture, are quickly claiming the Steppes for themselves. Their leader has recently sent a message asking for your fealty to his Horde in return for his protection against the marauding Lupines. Perhaps a temporary loss of independence is worth the safety of your people?"
 podintroductions.150.a:0 "我不需要任何帮助！"
 podintroductions.150.b:0 "大草原在统一"
 podintroductions.151.t:0 "你的过往"
 podintroductions.151.desc:0 "Lord Myka, your clever move during the recent peace treaty resulted in your Obertus Order being established as a buffer state between the German Ventrue and your clansmates to the East. This position is insecure though and much still needs to be done.\nYou also recently learned that Nikita of Sredetz, the Archbishop of Nod, might be related to one of the most closely guarded secrets of [clan|E] Tzimisce. Your scholarly mind can't resist the allure of such a find but you will have to storm Nikita's city to learn more which might be a daunting prospect. As always, take care to balance your intellectuals pursuits with your more secular ambitions. This has always been your very own path to greatness."
 podintroductions.151.a:0 "一刻也不能耽误。"
 myka_intro_tooltip:0 "作为迈卡·维科斯，你有一项学得挪德大主教的秘密的专属决议。其收益可能将是远大于迈卡所能把握的……"
 myka_decision:0 "黑暗的秘密"
 myka_decision_tooltip:1 "寻求不可知的真相"
 myka_decision_desc:0 "斯雷代茨的尼基塔隐藏着棘秘魑[clan|E]最重要的秘密之一。与他打交道，冲进他的藏身处，并得知真相。"
 myka_decision_confirm:0 "我必须要知道！"
 myka_decision_effect_tooltip:0 "迈卡将获得新生。"
 PODcanon_chars.33.t:0 "丑陋的真相"
 PODcanon_chars.33.desc:0 "所有这些充满幻想的探索都只是一个陷阱。\n你在尼基塔的藏身处里没有发现任何真相，除了意识到尼基塔在你知道他是谁之前就已经死了，并被一个强大的棘秘魑玛土撒拉所冒充。而这位玛土撒拉引导你来到了这里，因为他发现你会成为比已故大主教更好的“宿主”。\n你已经可以看到它的卷须，不管是精神上的还是其他方面的，都在伸来将你融合到一个更“适当”的形式中去。\n这可能是迈卡·维科斯的终末。"
 PODcanon_chars.33.a:0 "……一切都改变了"
 PODcanon_chars.33.b:0 "快跑！"
 podintroductions.152.t:0 "你的过往"
 podintroductions.152.desc:0 "Lord Noriz, the time of indolent decadence is over. While it is certainly amusing pitting your childer against each other in death matches, you must not forget that you were once the master of [clan|E] Tzimisce. Vladimir Rustovitch, that cowardly usurper, took it from you but his humiliating defeat against the German Ventrue is the opportunity you awaited.\nYou must press your rightful claim as Voivode of Voivodes and deal with Rustovitch once and for all. Then your lineage can reclaim the prestige that is its due."
 podintroductions.152.a:0 "这是你最终的错误，弗拉基米尔……"
 noriz_intro_tooltip:0 "作为诺利兹，如果你成为军督领的领袖，你将能解锁一项专属决议。如果达成，它将提高你的起始修正。"
 house_noriz_modifier:0 "诺利兹家族"
 house_noriz_modifier_desc:1 "真正的军督之督已然回归。特兰西瓦尼亚比以往任何时候都更令人恐惧。"
 noriz_decision:0 "军督的回归"
 noriz_decision_tooltip:1 "罗斯托维奇的时代已经结束"
 noriz_decision_desc:0 "许多人认为你很怠惰，迷失在颓废中。夺回你的头衔，证明他们错了。"
 noriz_decision_confirm:0 "他们将再次下跪"
 noriz_custom_decision:0 "弗拉基米尔·罗斯托维奇必须死。"
 podintroductions.153.t:0 "你的过往"
 podintroductions.153.desc:0 "Lady Razkoljna, your recent fall into [torpor|E] has seen your control over Poland weakened. Still, Krakow hasn't fallen so you have a strong base from which to launch your reconquest.\nIt is especially important to you as you are one of the few vampires that truly cares about the well being of its city. Not from any misplaced sentiment of kindness obviously, but from the pragmatic standpoint that a strong city means a strong Prince. You must quickly reconstruct your web of influence in Krakow and help its prosperity once again. The city must become mighty indeed, as befell a capital of your new Tzimisce empire."
 podintroductions.153.a:0 "特兰西瓦尼亚已是过去，此处可是未来。"
 raz_intro_tooltip:0 "作为拉兹科利纳，你在“巡视首都​”活动中就有着专属事件。"
 POD_survey_events.160.t:0 "巡视：拉兹科利纳的首都"
 POD_survey_events.160.desc:0 "你比任何棘秘魑都更了解一个发达的凡人社区的重要性。因此，你在克拉科夫长期以来一直在实践引导一座城市走向繁荣的艺术。你学到的宝贵经验使你更容易巧妙地将你的首都向你的目标发展。不过，这仍然是一个令人疲惫的过程，你可能更想控制自己的劳逸。"
 POD_survey_events.160.option.a:0 "没有时间可以浪费了"
 POD_survey_events.160.option.b:0 "永恒在我身旁"
 raz_survey_tooltip:0 "只要你扮演拉兹科利纳，就可以得到该专属巡视结果。"
 podintroductions.154.t:0 "你的过往"
 podintroductions.154.desc:0 "Lord Hedeon, you have recently grown your influence in Poland thanks to Prince Razkoljna's time in [torpor|E]. And as your influence grows so do the screams of the mortals in your 'care', clearly the most pleasant of sounds. Your fortress is always in need of more renovation and as such you obviously need more cattle to skin and dismember for artistic purposes.\nWhat better way to acquire more than crushing Razkoljna and the other Polish usurpers then bringing their pathetic cities into your fold? You are an imaginative man after all, think of all the things you could do with so many helpless mortals added to your domain..."
 podintroductions.154.a:0 "艺术家的负担很重。"
 hedeon_intro_tooltip:0 "作为海德翁，当你折磨一个人的时候，你会得到巨量的压力缓解和一些密谋生活方式的经验。"
 podintroductions.155.t:0 "你的过往"
 podintroductions.155.desc:0 "Lord Yorak, as the eldest childe of Tzimisce active in Transylvania, you have assumed the role of a spiritual leader for your [clan|E]. It has been strengthened by your construction of the Cathedral of Flesh, a masterful achievement in the art of fleshcrafting.\nStill, you were once a political force as well and you might need to become one once more, as your brethren are assailed by the German Ventrue and their Tremere allies. Clearly, you are the only one with enough clout to really unify the [clan|E]. And for those who disagree? Well, the Cathedral is always hungry..."
 podintroductions.155.a:0 "开门……"
 yorak_intro_tooltip:0 "作为沃拉克，只要你还掌控着大教堂，你就拥有着一项专属处决方式。"
 EXECUTION_YORAK:0 "喂给大教堂"
 cathedral_famished_modifier:0 "极饥的大教堂"
 cathedral_famished_modifier_desc:1 "在最近的开胃菜之后，大教堂想要更多。许多许多。"
 cathedral_hungry_modifier:0 "饥饿的大教堂"
 cathedral_hungry_modifier_desc:1 "随着可怜的灵魂被喂养到它永无止境的饥饿中，这个令人发疯的结构越发扩大了。"
 cathedral_satiated_modifier:0 "饱食的大教堂"
 cathedral_satiated_modifier_desc:1 "大教堂看上去保持着平静，若非那无数受害者的惨叫声。"
 podintroductions.156.t:0 "你的过往"
 podintroductions.156.desc:0 "Fearsome Darvag, Kiev is at your mercy and you will one night have your revenge on its fickle population who betrayed your ancient religion. But more pressing matters are at hand.\nThe Tzimisce Voivodate to your west asked for your fealty but you refused, knowing that there are far greater powers than they. The Little Grandmother of Russian fame, Baba Yaga, is close, you can feel it. It doesn't matter if she is asleep or not, you know that she is the only Goddess of these lands and you also know the stories : she will bless those that will show proper deference. Well, you are sure that the people of Kiev will be happy to serve as offerings..."
 podintroductions.156.a:0 "听我说，祖母！"
 darvag_intro_tooltip:0 "作为达瓦，你具有一项专属处决方式。"
 EXECUTION_DARVAG:0 "献祭给芭芭雅嘎"
 baba_intrigued_modifier:0 "受鬼婆关注"
 baba_intrigued_modifier_desc:1 "芭芭雅嘎对你对她的大奉献表现出了兴趣。"
 baba_pleased_modifier:0 "芭芭雅嘎的赞许"
 baba_pleased_modifier_desc:1 "俄罗斯鬼婆对你的狂热奉献很欢喜。"
 baba_delighted_modifier:0 "最爱之孙"
 baba_delighted_modifier_desc:1 "很明显，你现在是她的最爱，能得到最棒赠礼的人。"
 podintroductions.157.t:0 "你的过往"
 podintroductions.157.desc:0 "Lady Shaagra, as your control over Bohemia grows, you have learned an interesting information. Vukodlak, a Tzimisce even older than you, was active in Prague recently until his fall into [torpor|E] after a titanic battle against some unknown assailants.\nVukodlak is a sadistic and arrogant madman but you can't deny his powers and skills. If you were to rescue him, he might be amicable to an alliance at least for a while. His strength would be a great asset to help ease your return into power... but it could also backfire in the future, Vukodlak being quite ambitious on his own as well."
 podintroductions.157.a:0 "怪物亦有荣誉。"
 podintroductions.157.b:0 "……这听起来像个很坏的主意。"
 podintroductions.158.t:0 "你的过往"
 podintroductions.158.desc:0 "Fearsome Jamal, the mere mention of your name strikes fear in the hearts of the unbelievers trying to invade your land. But this isn't enough.\nAs the leader of the Banu Haqim warrior caste you are a respected and powerful figure within the [clan|E], a fact that you must use to make sure that your brethren don't stray from the true path. Too many competing factions, and a deluded Eldest, try to impede your unique vision for the Banu Haqim's future. Use your supreme prowess and leadership capabilities to good effect and their futile efforts will certainly fail."
 podintroductions.158.a:0 "By diplomacy or war, we will triumph."
 jamal_intro_tooltip:0 "As Jamal, you can use a character interaction to start a duel with any non Banu Haqim character"
 POD_jamal_interaction:0 "不败者"
 POD_jamal_interaction_desc:0 "你将与这个角色开始决斗。有一人将归于尘土。"
 podintroductions.159.t:0 "你的过往"
 podintroductions.159.desc:0 "Lord Dastur, the current chaos in the Banu Haqim [clan|E] is giving your Lost Tribe some hope of a better tomorrow. Still, you are worried.\nYou have discovered that agents of an apocalyptic cult named the 'Manus Nigrum' have infiltrated your realm for some unknown, but probably nefarious, purpose. You could launch a wide purge of supposed agents of this cult but this could appear as a paranoid and reckless move. The other option would be to keep a more lenient watch on them, but that could also allow them to gain more and more influence."
 podintroductions.159.a:0 "让我们砍下这“黑手”"
 podintroductions.159.b:0 "他们还不是威胁……目前而言。"
 podintroductions.160.t:0 "你的过往"
 podintroductions.160.desc:0 "Fearless Fatima, your mission to hamper the 4th Crusade has been a resounding success so far. But there is still work to do.\nAlamut has sent new orders, you are to make sure that the remnants of the crusader army stuck in Anatolia are dealt with. Then, the elders would like for you to carve a new fiefdom in the region by using the chaos of the Byzantine Empire's fall as a cover. This would make a great buffer state against any further Frank incursions in your homeland.\nGreat expectations to be sure, but you are not known for failure. You won't disappoint them this time either."
 podintroductions.160.a:0 "我的使命很明确。"
 fatima_intro_tooltip:0 "作为法蒂玛，你就有一项要求你掌控安纳托利亚到1300的专属决议。"
 fatima_decision:0 "终结十字军"
 fatima_decision_tooltip:1 "法兰克人不属于此！"
 fatima_decision_desc:0 "第四次十字军东征的最后残余势力必须得到解决，来为哈基姆圣裔确保安纳托利亚。"
 fatima_decision_confirm:0 "使命完成"
 fatima_decision_effect_tooltip:0 "鹰巢向您送来了问候……和奖励。"
 podintroductions.161.t:0 "你的过往"
 podintroductions.161.desc:0 "Wise Al-Ashrad, the Banu Haqim are in turmoil. The factionalism within your [clan|E] has reached a boiling point and you know that this is the moment some dark forces waited to try to seize control of the [clan|E]. You will have to be strong.\nThankfully, you are prepared. You are a blood sorcerer beyond compare and your knowledge of the occult will certainly come in handy in the troubled times ahead. Cultivate this strength, study your enemy then strike decisively. Only you can protect the Banu Haqim from the terror lurking within."
 podintroductions.161.a:0 "谨慎的策划将确保胜利"
 alashrad_intro_tooltip:0 "作为阿什拉夫，你有一个特殊的决定，允许你每十年提高一次你的学识。"
 alashrad_decision:0 "学无止境"
 alashrad_decision_tooltip:1 "我必须找到答案……"
 alashrad_decision_desc:0 "阿什拉夫你知道很多东西，但总是有更多的物事需要破译和理解。你的追求将永远不会结束。"
 alashrad_decision_confirm:0 "……就差那么点了"
 broken_alamut_modifier:0 "最弱的最长者"
 broken_alamut_modifier_desc:0 "你对鹰巢的最长者的宣称是极其脆弱的。没有人尊重你，你对局势的控制也在不断恶化。"
 podintroductions.162.t:0 "你的过往"
 podintroductions.162.desc:0 "Lady Nakurtum, the situation is dire. The Banu Haqim have not accepted your takeover as Eldest. The [clan|E] lies fractured.\nYou control Alamut itself but not much more, the other elders paying lip service to your authority. The situation drifts closer to civil war by the night. Perhaps it is unavoidable at this point.\nIf you want to salvage your position, you will have to strike quickly and decisively for the Children of Haqim don't respect weakness."
 podintroductions.162.a:0 "吾即哈基姆之摄政！"
 nakurtum_intro_tooltip:0 "作为纳穆尔图姆，你有两项专属决议，允许你摆脱开始的负面修正。"
 nakurtum_losing_control_modifier:0 "失控"
 nakurtum_losing_control_modifier_desc:0 "你几乎无法控制鹰巢本身。其他一切都在从你薄弱的掌握中滑落。"
 nakurtum_eldest_decision:0 "赢得尊重"
 nakurtum_eldest_decision_tooltip:1 "我将向他们证明我的价值！"
 nakurtum_eldest_decision_desc:0 "如果你想作为哈基姆圣裔的最长者长久地生存下去，你就必须证明自己。主张对哈基姆之子的家园进行控制是一个好的开始。"
 nakurtum_eldest_decision_confirm:0 "我有自信"
 nakurtum_control_decision:0 "稳定你的统治"
 nakurtum_control_decision_tooltip:1 "我将向他们证明我的价值！"
 nakurtum_control_decision_desc:0 "如果你想作为哈基姆圣裔的最长者长久地生存下去，你就必须证明自己。主张对哈基姆之子的家园进行控制是一个好的开始。"
 nakurtum_control_decision_confirm:0 "我有自信"
 podintroductions.163.t:0 "你的过往"
 podintroductions.163.desc:0 "Lord Ahmed, you have participated in the creation of the Diet of Olives hoping for lasting peace in the area, but you still have some reservations. Perhaps you will have to find another way, one that might force you more into action.\nSadly, your faith has isolated you from the rest of the [clan|E]. As such, you might have to rely on finding promising prospects and introduce them to your unique philosophy. This will be a long task but for peace in the Holy Land? It's worth it."
 podintroductions.163.a:0 "世上最重要的任务"
 ahmed_intro_tooltip:0 "作为艾哈迈德，只要你还具有基督之道信仰，你总是会在教育子嗣的信仰教学部分取得成功。"
 POD_education_events.100.option.d:0 "聆听主的话语"
 POD_education_events.100.ahmed:0 "作为艾哈迈德，你可以使用这个选项，确保你的子嗣遵循你的宗教。只有当你留在基督之道上时，才可以使用这个选项。"
 podintroductions.164.t:0 "你的过往"
 podintroductions.164.desc:0 "Lord Thetmes, you have made considerable progress recently. The Banu Haqim are more divided than ever, meaning that your Web of Knives can wield much more influence than before. Still, there is much work to be done before the [clan|E] is ready for your Master's return.\nTake notice of the other factions around you and crush them swiftly. You can't let another Elder take over the Banu Haqim. Once Alamut is fully secured by your brethren, you can be sure that the Black Shepherd will reward you handsomely for are you not his most trusted servant?"
 podintroductions.164.a:0 "应许的时代将会来临。"
 thetmes_intro_tooltip:0 "作为忒弥斯，如果你完成了“神之梦”目标，你将获得额外的奖励。"
 pod1230objectives.24.customthetmes:0 "作为忒弥斯，你获得了额外的奖励。乌尔·舒尔吉为你的持续服务而祝福你。"
 podintroductions.165.t:0 "你的过往"
 podintroductions.165.desc:0 "Fearsome Morrow, your fame among [clan|E] Gangrel is growing by the night, thanks to your recent victory against the Ventrue of the Black Cross and the Tzimisce Voivodate. But this is merely a beginning.\nIf you want to truly unify the [clan|E], you will have to continue in this direction, proving that you are indeed the most powerful warleader. A tool that you are already famous for is your habit of showing up uninvited into potential foes' courts and making a show of force before leaving. This tactic has served you well in the past and could continue to do so."
 podintroductions.165.a:0 "兽之纪元即将到来。"
 morrow_intro_tooltip:0 "作为莫罗，你有一项针对有地统治者的专属角色互动，让你可以通过实力彰显吓唬他们。"
 show_of_force_morrow_modifier:0 "实力彰显"
 show_of_force_morrow_modifier_desc:0 "该角色已经被莫罗的突然出现和在宫廷上的悄悄威胁吓坏了。"
 POD_morrow_interaction:0 "彰显实力"
 POD_morrow_interaction_desc:0 "通过突然出现在其的宫廷来吓唬这个统治者。"
 podintroductions.166.t:0 "你的过往"
 podintroductions.166.desc:0 "Lord Viktor, your mistress Baba Yaga entrusted you with her realm as she recovers from the terrible battle against her [Sire|E]. You won't disappoint.\nThe rise of Christianity and the Eastern hordes are proving to be a great concern and you must quickly secure your surroundings so that the Grandmother can sleep in peace. Take also notice of Durga Syn to your West, a long time opponent to Baba Yaga.\nIf you manage to deal with all those threats, there is no doubt in your mind that the Grandmother will be pleased and reward you accordingly..."
 podintroductions.166.a:0 "好好睡吧，祖母，我在看着。"
 viktor_intro_tooltip:0 "作为忒弥斯，如果你完成了“体贴的祖母”目标，你将获得额外的奖励。"
 pod1230objectives.20.custom.viktor:0 "作为维克多，你获得了额外的奖励。芭芭雅嘎对她的最宠侍从非常满意。"
 podintroductions.167.t:0 "你的过往"
 podintroductions.167.desc:0 "Lady Brunhilde, the Einherjar are dying. Your faith is being replaced by the White God and his followers and your brethren are given up hope. Werter himself, the one chosen by Odin to lead you in these troubled times, seems close to the breaking point. You must act.\nYou have a strong respect for Werter and he was a worthy friend for centuries, but you must now force him to abdicate his position as All High of Midgard before he leads you all to ruin. It is time for the Valkyries to save Scandinavia with you at their helm!"
 podintroductions.167.a:0 "英灵殿还能再等一会儿。"
 brunhilde_intro_tooltip:0 "作为布伦希尔德，在未来几个月里，你将有几个事件让你能篡夺米德加尔德头衔。"
 PODcanon_chars.34.t:0 "信仰与力量"
 PODcanon_chars.34.desc:0 "你现在已经向米德加尔德的其他居民表明了你的野心：你必须尽快取代维特成为领袖。这在你的同胞中引发了一些争论，但最初的支持率很高，尤其是在那些仍想反对基督教的人中。\n维特本人对你的举动其实并不感到惊讶，但他敦促你重新考虑你的立场。他毕竟是被奥丁本人选中的人，违背全父的意志可能比倒向白神更糟糕。"
 PODcanon_chars.34.a:0 "奥丁会理解的。"
 brunhilde_exit_tooltip:0 "你放弃了控制米德加尔德的计划。"
 PODcanon_chars.34.b:0 "……他言之在理。"
 PODcanon_chars.35.t:0 "传统与力量"
 PODcanon_chars.35.desc:0 "出现了一个反对你夺权的强大对手：芬兰自由邦的青之卡尔。这位英勇的英灵战士是一位坚定的传统主义者，他不赞成你的行动，理由和维特一样：奥丁没有选择你，甚至可能北欧信仰的终结就是你的宿命。\n在这个阶段没什么能改变他的想法，你要么接受他的敌意，要么完全放弃你的计划。"
 PODcanon_chars.35.a:0 "我铸就我自己的命运。"
 PODcanon_chars.35.b:0 "……他言之在理。"
 PODcanon_chars.36.t:0 "新的萨迦传奇"
 PODcanon_chars.36.desc:0 "你现在已经强大到足以称霸米德加尔德，而且值得庆幸的是，维特并不想和你比拼，也不想发起一场血腥的内战。现在你要考虑的最后一件事是如何处理你的胜利。\n按照惯例，你应该羞辱维特和他的软弱政策，这样你就可以从头开始。但把这位强大的奥丁子嗣留在你身边也会有好处。"
 PODcanon_chars.36.a:0 "败者为耻！"
 PODcanon_chars.36.b:0 "让我们合作吧。"
 podintroductions.168.t:0 "你的过往"
 podintroductions.168.desc:0 "Lord Dunlop, you have awaited your opportunity for vengeance for a long time. Mithras killed your beloved daughter and he will pay dearly for this murder. You are not known for forgiveness or mercy after all.\nIt will be a difficult process, as Mithras is well entrenched in the British Isles and his get protects him. That thought actually makes you pause... perhaps you could target his childer to make him endure a fraction of the pain you felt that fateful night?"
 podintroductions.168.a:0 "你不会被忘记的，玛丽。"
 dunlop_intro_tooltip:0 "作为邓洛普，你有一项杀死密特拉和他的孩子们的专属决议。"
 mary_dunlop_avenged_modifier:0 "玛丽之仇已报"
 mary_dunlop_avenged_modifier_desc:0 "复仇的感觉很甜蜜。每个人都可以见到，曾经的那位可怕的邓洛普伯爵回来了。"
 dunlop_decision:0 "复仇与清算"
 dunlop_decision_tooltip:1 "亲爱的，宝贝的玛丽·伊丽莎白……"
 dunlop_decision_desc:0 "密特拉和他的子嗣将为杀害你心爱的女儿付出沉重的代价。清算正在向他们降临。"
 dunlop_decision_confirm:0 "为纪念你……"
 dunlop_custom_decision:0 "密特拉必须死"
 dunlop_custom_decision2:0 "格赖恩特，密特拉最宠的最幼子嗣，必须死。"
 dunlop_custom_decision3:0 "马库斯·维鲁斯，密特拉最忠诚且付出最多的子嗣，必须死。"
 dunlop_custom_decision4:0 "克瑞透斯，密特拉的最长子嗣，必须死。"
 podintroductions.169.t:0 "你的过往"
 podintroductions.169.desc:0 "Lord Qarakh, you are leading the Ferals of Livonia against the ongoing Western assault. So far the situation is under control but it is only a matter of time before your realm is under attack once again. Your beloved Deverra has proposed a solution.\nUsing her mystical connection to the God of this land, Telyavel, she could enact a ritual that would give you immense strength, perhaps enough to save your people. But the cost... the cost would be Deverra's own life. Something that breaks your heart merely thinking about it.\nWill you allow it?"
 podintroductions.169.a:0 "不！我需要你！"
 podintroductions.169.b:0 "你不会被忘记的，亲爱的。"
 podintroductions.170.t:0 "你的过往"
 podintroductions.170.desc:0 "Fearless Valborg, Ragnarok is coming but you are more than ready to take advantage of it. There are plenty of opportunities for a skilled warrior such as yourself. Some would call it a parody of the 'true Norse faith' but you prefer to call it a mere adaptation for these changing times.\nFrom your beloved ship, the Red Thor, you are ready to plunder and pillage for fortune and glory. And if the old gods disapprove, they can always come here and say it to your trusty hammer's face!"
 podintroductions.170.a:0 "起航！"
 valborg_intro_tooltip:0 "作为瓦尔堡，你有一项赚取一些“小钱”的专属小决议。"
 valborg_decision:0 "佣兵合约"
 valborg_decision_tooltip:1 "维京待雇！"
 valborg_decision_desc:0 "对于经验丰富的北欧战士组成的艰苦团队来说，机运无处不在。"
 valborg_decision_confirm:0 "指明我们的目标！"
 valborg_decision_effect_tooltip:0 "你将得在合约间选择。"
 red_thor_weakened_modifier:0 "红托尔的虚弱"
 red_thor_weakened_modifier_desc:0 "你的一些战士正在执行雇佣兵任务，这小小削弱了你对你的国家的控制。"
 red_thor_depleted_modifier:0 "红托尔的空虚"
 red_thor_depleted_modifier_desc:0 "你的许多战士都在执行雇佣兵任务，削弱了你对你的国家的控制。"
 red_thor_empty_modifier:0 "红托尔的空无"
 red_thor_empty_modifier_desc:0 "你的战士们都在执行雇佣兵任务，严重削弱了你对你的国家的控制。"
 PODcanon_chars.37.t:0 "红托尔起航"
 PODcanon_chars.37.desc:0 "你的船员准备出发了，许多外国[cainites|E]急于征召他们参加自己的小规模战争。你必须做出的选择是关于合同的难度。难度越大，奖励就越多，但你必须投入更多的战士来完成任务。如果他们在海外，他们显然不能再在国内帮助你。"
 PODcanon_chars.37.a:0 "简易就行了。"
 PODcanon_chars.37.b:0 "这个似乎很适度。"
 PODcanon_chars.37.c:0 "最难的！"
 PODcanon_chars.37.d:0 "我们现在不出航。"
 podintroductions.171.t:0 "你的过往"
 podintroductions.171.desc:0 "Lord Thomas, despite your best efforts, Constantinople has fallen to the Latins. But it is not over yet.\nYou are not the kind of man to give up and even if most of the Greek [cainites|E] have gone to exile, you will still fight. It's an uphill battle to be sure but you have decades of experience as the main enforcer in the very same city. You will make unlife for the Latins' [cainites|E] hell, then strike and finish them once and for all!"
 podintroductions.171.a:0 "清算将来。"
 thomas_intro_tooltip:0 "作为托马斯，你有一项针对有地统治者的专属角色互动，让你可以在战争前削弱他们。"
 guerilla_thomas_modifier:0 "希腊冈格罗游击战"
 guerilla_thomas_modifier_desc:0 "被组织良好的希腊冈格罗盯上，该角色很难保持对其国度的控制。"
 POD_thomas_interaction:0 "游击战"
 POD_thomas_interaction_desc:0 "通过发动一些游击行动来扰乱这个统治者的国度。"
 podintroductions.172.t:0 "你的过往"
 podintroductions.172.desc:0 "Lady Tryphosa, Camilla has awakened and taken control of Rome once again, just as you anticipated. You were once a close friend of his and a trusted advisor and with that role you wielded a tremendous amount of influence. Perhaps you could do so again?\nYou could make your presence known to the powerful Ventrue and enter his service once more. This would provide some useful protection against the treacherous Lasombra to the South. Or you could continue on your own, perhaps Camilla isn't part of your future this time."
 podintroductions.172.a:0 "欢迎回来，执政官。"
 podintroductions.172.b:0 "他的时代过去了。"
 podintroductions.173.t:0 "你的过往"
 podintroductions.173.desc:0 "Lady Vasantasena, you are furious. In your years of wandering and preaching for freedom you never saw such an abomination as this 'House Tremere'. These mages are all oppressed under a tyrannical Council and, worse still, forced to endure the blood bond to the last one! This can't continue.\nLuckily, the Tremere clearly underestimate you and haven't really noticed your presence and influence yet. This is a great opportunity to break down this 'pyramid' from the inside. This will be your masterpiece and the whole [cainite|E] world will sprung with hope once you are done!"
 podintroductions.173.a:0 "让我们打破他们的枷锁。"
 vasantasena_intro_tooltip:0 "作为春军，你有一项专属决议，如果成功的话，将允许你创造你自己的信仰。"
 vasantasena_decision:0 "打破金字塔"
 vasantasena_decision_tooltip:1 "这个可憎的东西必须被打倒！"
 vasantasena_decision_desc:0 "睿魔尔家族反对你所珍视的一切。你必须采取行动。"
 vasantasena_decision_effect_tooltip:1 "你编译了你自己的心路，为将来的进一步解放铺平道路。"
 vasantasena_decision_confirm:0 "金字塔已被推倒！"
 podintroductions.174.t:0 "你的过往"
 podintroductions.174.desc:0 "Louhi, your pact with the Abyssal master is progressing well. You have pledged your allegiance to him and he is pleased by your work so far, but there is more to be done.\nThe far North where you reside is isolated, which is useful for the solitude but limit the scale of your experiments, especially concerning your well crafted revenants, the Keskinen. Perhaps you could expand your realm? You know that the servants of your master would be happy to help in such an endeavor..."
 podintroductions.174.a:0 "机遇，机遇！"
 louhi_intro_tooltip:0 "作为娄希，只要你还留在深渊之路上，你就能通过决议生成黯影，一种本来是勒森魃独有的兵士。"
 louhi_decision:0 "阴暗业务"
 louhi_decision_tooltip:1 "你在暗处有些朋友。"
 louhi_decision_desc:0 "深渊主人是慷慨的。请求他的支持。"
 louhi_decision_effect_tooltip:1 "你将选择召唤多少只黯影。"
 louhi_decision_confirm:0 "听我说！"
 PODcanon_chars.38.t:0 "阴暗业务"
 PODcanon_chars.38.desc:0 "你已经准备好向深渊主人献上你的祭品了。你想尝试召唤他的多少个仆人？"
 PODcanon_chars.38.a:0 "只是其中的一些。"
 PODcanon_chars.38.b:0 "更多！"
 PODcanon_chars.38.c:0 "所有！"
 PODcanon_chars.38.d:0 "转念一想……"
 louhi_small_shades_tt:0 "一组黯影会被加入到你的可用兵士中。"
 louhi_medium_shades_tt:0 "两组黯影会被加入到你的可用兵士中。"
 louhi_high_shades_tt:0 "三组黯影会被加入到你的可用兵士中。"
 podintroductions.175.t:0 "你的过往"
 podintroductions.175.desc:0 "Lord Anatole, you have been doing God's work by humiliating the Parisian [cainite|E] Heresy but your task isn't completed yet. These Southern lands are full of heretics hiding behind or among the Cathars.\nYou have obtained the right to operate within the region and you are confident that you will succeed in time. The roots of the corruption might run deeper than you first thought however, and you might need to remove some Princes from their offices to uncover them. After that... God wiil choose your next path, as He always does."
 podintroductions.175.a:0 "让我们开始吧。"
 anatole_intro_tooltip:0 "作为阿纳托尔，你有一项专属小决议来理解上帝对你的意愿。"
 anatole_decision:0 "上帝的意愿"
 anatole_decision_tooltip:1 "祂对我有什么计划？"
 anatole_decision_desc:0 "你的信念很强，但祂的做事方法很神秘。你必须抽出时间来理解它们。"
 anatole_decision_effect_tooltip:1 "你会获得一个愿景，可能是好的，也可能是坏的。"
 anatole_decision_confirm:0 "前进的道路……"
 PODcanon_chars.39.t:0 "上帝之怒"
 PODcanon_chars.39.desc:0 "你做错了什么吗？还是只是祂对你不满意？你可能永远不知道，但你知道的是，上帝对你不满意。你刚刚收到的恐惧和愤怒的幻象很清楚：你必须改变你的做事方式。"
 PODcanon_chars.39.a:0 "我必须得做的更好！"
 PODcanon_chars.39.b:0 "在我得到救赎之前，我不会休息。"
 PODcanon_chars.39.c:0 "我尽力了！"
 PODcanon_chars.40.t:0 "上帝之狂热"
 PODcanon_chars.40.desc:0 "你总是可以改进和做得更多。这就是你收到的最新异象所提醒你的。你的狂热被重新激发，你的目标感从未如此强烈。\n你将把这个巨大的恩惠引向何处？"
 PODcanon_chars.40.a:0 "了解圣经"
 PODcanon_chars.40.b:0 "当众传教。"
 PODcanon_chars.40.c:0 "理解我的定位。"
 PODcanon_chars.41.t:0 "上帝的意愿"
 PODcanon_chars.41.desc:0 "由于最近的一个异象，你在附近发现了一个吸血鬼异端的巢穴。可悲的是，这个人隐藏在众目睽睽之下，与这片土地上的凡人统治者有着强大的联系。对他采取行动肯定会引起一些不必要的注意。\n但你真的能拒绝对这样一位受诅的灵魂施用上帝的正义吗？"
 PODcanon_chars.41.a:0 "他的灵魂将得到净化。"
 PODcanon_chars.41.b:0 "救赎仍然是一个可选项。"
 PODcanon_chars.41.c:0 "这次我不能采取行动。"
 broken_talmahera_modifier:0 "难当的德尔罗"
 broken_talmahera_modifier_desc:0 "你对塔尔玛埃拉的德尔罗（被服侍者）的宣称是非常弱的。没有人尊重你，你对局势的控制也在不断恶化。"
 podintroductions.176.t:0 "你的过往"
 podintroductions.176.desc:0 "Lord Elimelech, after your fair share of confused wandering, you have ended up in this strange death cult named the Tal'mahe'Ra. They have their own weird ideas from what you have seen so far like worshiping the Antediluvians.\nYour Biblical age and considerable personal power made you feared and dreaded by this cult and they have taken to just following you, and your orders, around. Maybe this is the purpose for your unlife that you missed so far? If you decide to stick around though, you will have to consolidate the weak hold you have over them quickly."
 podintroductions.176.a:0 "奇怪的发展。"
 elimelech_intro_tooltip:0 "作为以利米勒，你有两个专属决议，可以让你摆脱开始时的负面修正。"
 elimelech_losing_control_modifier:0 "失控"
 elimelech_losing_control_modifier_desc:0 "你几乎无法控制你的王座室本身。其他一切都在从你薄弱的掌握中滑落。"
 elimelech_delroh_decision:0 "赢得你的权力"
 elimelech_delroh_decision_tooltip:1 "我将向他们证明我的领导能力！"
 elimelech_delroh_decision_desc:0 "如果你想长期作为塔尔玛埃拉的德尔罗（被服侍者）活下去，你就得证明自己。主张对周围土地的控制是一个好的开始。"
 elimelech_delroh_decision_confirm:0 "尊重我的权威！"
 elimelech_control_decision:0 "稳定你的统治"
 elimelech_control_decision_tooltip:1 "我将向他们证明我的领导能力！"
 elimelech_control_decision_desc:0 "你对神秘的塔尔玛埃拉的统治是一个奇怪的现象，没有人期望它能持续很长时间。证明他们错了。"
 elimelech_control_decision_confirm:0 "我还在这！"
 elimelech_custom_decision:0 "该决议只有在1300后开始才能达成。"
 podintroductions.177.t:0 "你的过往"
 podintroductions.177.desc:0 "Lord Zettler, you understand so much more now. The three headed dragon has shown you the truth.\nYou were naive trying to ward the Salubri against the Tremere for in the end, are you not all ashes? There is only one constant in this damnable existence and that is the one of pain. Thanks to the many blessings of your new patron, you will learn all of its secrets and become its ultimate artist.\nThe screams will never stop but you will understand them now."
 podintroductions.177.a:0 "终于有了明确的答案。"
 zettler_intro_tooltip:0 "作为泽特勒，你有一项能调用三头巨龙的示相之一来帮助你的决议。"
 zettler_beast_of_war_modifier:0 "战争之兽"
 zettler_beast_of_war_modifier_desc:0 "最年轻的幼弟，一个由不受约束的暴怒和愤怒组成的生物。"
 zettler_eater_of_souls_modifier:0 "吞魂者"
 zettler_eater_of_souls_modifier_desc:0 "中间的兄弟，也就是最终会吞噬一切者。"
 zettler_defiler_modifier:0 "亵渎者"
 zettler_defiler_modifier_desc:0 "最年长的兄长，能败坏它所接触的一切。"
 zettler_decision:0 "三兄弟"
 zettler_decision_tooltip:1 "巨龙对你言语，对你的奉献感到高兴。"
 zettler_decision_desc:0 "巨龙的三个头分别代表不同的示相和不同的好处，可以用于你的目标。"
 zettler_decision_effect_tooltip:1 "在未来五年内，你将在这三大示相中选择其一。"
 zettler_decision_confirm:0 "神圣之助……"
 PODcanon_chars.42.t:0 "三头巨龙"
 PODcanon_chars.42.desc:0 "你的后援是一个强大的实体，但即使对你来说也是很神秘。到目前为止，你所了解的是它分为三个“头”，它们几乎是不同的生物，但在某种程度上仍然是整体的一部分。\n每一个都渴望你的奉献，并承诺如果你遵从的话会有回报。"
 PODcanon_chars.42.a:0 "战争之兽"
 PODcanon_chars.42.b:0 "吞魂者"
 PODcanon_chars.42.c:0 "亵渎者"
 PODcanon_chars.42.d:0 "我现在不做选择。"
 podintroductions.178.t:0 "你的过往"
 podintroductions.178.desc:0 "Lady Adolana, as the [cainite|E] Heresy crumbles all around you, you have used this chaos to get a seat on the See of Nod despite your young age. You know how to make the best of a bad situation after all.\nSince your arrival here, you have been very suspicious of the current Archbishop of Nod who seems oddly unconcerned by the critical state of your Church. Perhaps it is time for a change of leadership? You could press the matter at the next session of the Curia, making sure that everybody knows of your ambition... which can be a double edged sword, obviously."
 podintroductions.178.a:0 "我们需要变革！"
 podintroductions.178.b:0 "大主教有我的全力支持。"
 lucita_decision_effect_tooltip:1 "这终于发生了！"
 josef_terrified_modifier:0 "压力之下"
 josef_terrified_modifier_desc:0 "你冥冥感觉到，莎格拉要抓到你了。你得立刻往后看！"
 podintroductions.179.t:0 "你的过往"
 podintroductions.179.desc:0 "Lord Josef, you have been hard at work securing Prague after your revolt against the last Prince's tyrannical rule but a new problem has already arisen.\nShaagra, the one who ruled Bohemia in ancient times, has awoken and easily wrestled control of the Eastern part of the country. She will certainly want more, and you are rightly terrified of what such an ancient being could do to you. You must find a way to get rid of her!"
 podintroductions.179.a:0 "还有希望！"
 josef_intro_tooltip:0 "作为约瑟夫，你可以通过达成你的专属决议，来提高你的起始修正。"
 josef_breathing_modifier:0 "喘息空间"
 josef_breathing_modifier_desc:0 "莎格拉不在了，你可以重新呼吸了……非字面意思。"
 josef_decision:0 "波希米亚的命运"
 josef_decision_tooltip:1 "她要来了！"
 josef_decision_desc:0 "莎格拉，这个曾经以铁腕统治波西米亚的远古恐怖，又回来了。她肯定不会欣赏你占有她这么多的“正当”土地。"
 josef_decision_confirm:0 "……好险"
 josef_custom_decision:0 "莎格拉必须死"
 podintroductions.180.t:0 "你的过往"
 podintroductions.180.desc:0 "Lord Tarique, Mecca and Medina are securely in pious Ashirra hands in no small part thanks to you. But you work isn't over yet.\nOther important cities like Cairo, Damascus and Cordoba are still in conflict or outright controlled by enemies of the faith. This can't be allowed to continue! You know your duty and won't stop until the Ashirra protects the faithful from Arabia to Iberia."
 podintroductions.180.a:0 "朝觐必胜。"
 tarique_intro_tooltip:0 "作为塔利克，你有一项专属目标，即确保伊斯兰教最重要的城市。"
 tarique_guardian_modifier:0 "圣城守护者"
 tarique_guardian_modifier_desc:0 "守护者的威望和虔诚远近闻名。是少有的真正献身于某项事业的[cainites|E]之一。"
 tarique_decision:0 "圣城守护者"
 tarique_decision_tooltip:1 "你的使命很明确。"
 tarique_decision_desc:0 "你已经在麦加的恩典下重生了，你想让别人也有这种受祝福的经历。因此，必须保护信仰中最重要的城市。"
 tarique_decision_confirm:0 "我的使命已完成。"
 podintroductions.181.t:0 "你的过往"
 podintroductions.181.desc:0 "Lord Malachite, the time for wandering and despair is over. You must act.\nThe Latins are well entrenched in Constantinople, and this affront to Michael's memory must not stand. You were his rock, his protege and you must now repay his kindness by saving his legacy.\nConstantinople is eternal. The Dream is eternal. Make sure that the damned Latins understand this soon enough."
 podintroductions.181.a:0 "我们不值得，牧首。"
 malachite_intro_tooltip:0 "作为马拉希底斯，如果你完成“幻梦再临”目标，你会得到额外的奖励。"
 pod1230objectives.6.c:0 "他们知道我是谁。"
 pod1230objectives.6.custom.malachite:0 "这个选项可用是因为你扮演着马拉希底斯。"
 podintroductions.182.t:0 "你的过往"
 podintroductions.182.desc:0 "Lady Mnemach your attention is divided.\nOne one hand, the aftermath of Salianna's coup leaves France in a vulnerable position. You have many contacts and enough influence that you could capitalize on that to finally bring back this land to its ancients roots.\nOn the other hand, you finally got your sister back. Suleviae had her mind thoroughly broken by centuries of Ventrue conditioning though, and barely recognizes you. You loved her dearly once, and helping her could perhaps restore her memories. But you can't do that arduous task while also entering the French political arena."
 podintroductions.182.a:0 "家人就是家人。"
 podintroductions.182.b:0 "那些时刻已经一去不返了。"
 podintroductions.183.t:0 "你的过往"
 podintroductions.183.desc:0 "Lord Lukas, despite being Embraced by a Nosferatu, you have managed to save your perfect beauty... for a price. Your infernal patron asked for 100 souls in your first 100 years of existence and you already delivered but... he now wants more and at a quicker pace.\nYou have no choice though as any sacrifice is worth it if you can keep your youthful appearance. It is time to open your Drowned Monastery and expand. You will need more people to ensnare and corrupt as long as your benefactor is hungry for more. He will be satisfied soon enough...\nRight? "
 podintroductions.183.a:0 "完美之化身。"
 lukas_intro_tooltip:0 "作为卢卡斯，你的地狱后援会定期要求你献祭你的首都发展度（如果足够）或随机一位宫廷成员。你可以拒绝，但卢卡斯的理智可能无法承受再一次失去美貌。"
 PODcanon_chars.43.t:0 "完美之亲王"
 PODcanon_chars.43.desc:0 "你的后援回来了，提醒你必须偿还的债务。必须做出献祭，莫有妥协，以挽救你的无瑕的皮肤。\n如果你的首都人口足够多，你可以献祭其中一些。否则，你将不得不让恶魔从你的宫廷中挑选。或者……你可以完全拒绝玩这个可怕的游戏，但你知道其代价……"
 PODcanon_chars.43.a:0 "谁会怀念一些愚蠢的凡人呢？"
 PODcanon_chars.43.b:0 "廷臣，他们有什么用？"
 PODcanon_chars.43.c:0 "……我不能这样继续下去了。"
 lukas_sacrifice_dev_tt:0 "你必须有一个发展度超过5的首都，才能在未来的要求中保有这个选项。"
 gregor_knight_modifier:0 "女士的骑士"
 gregor_knight_modifier_desc:0 "格雷戈尔生活在自己的幻想世界里，他必须永远不离开他心爱的女士。"
 podintroductions.184.t:0 "你的过往"
 podintroductions.184.desc:0 "Fearsome Gregor, you finally found a purpose for your life. Those pathetic Teutonic Knights were too afraid of your strength to accept you but the Lady of Thorns is different.\nShe doesn't care about your so called 'cruelty' and even makes you feel stronger than ever. She is in need of a diligent champion, and you are the chosen one. She seems possessive though and doesn't like when you stray too far from her, which might be an issue in the long term.\nNo matter, you have monsters to slay in her name!"
 podintroductions.184.a:0 "为完美女士而设的完美骑士。"
 gregor_intro_tooltip:0 "作为格雷戈尔，你有一项专属小决议，允许你向女士寻求更多的帮助，或者与她断绝关系。"
 gregor_decision:0 "与女士见面"
 gregor_decision_tooltip:1 "我是她忠实的仆人。"
 gregor_decision_desc:0 "女士赋予了你力量，但如果你要，她可以帮助你更多。如果她对你的占有欲太强，你也可以尝试与她断绝关系。"
 gregor_decision_confirm:0 "为您服务。"
 gregor_decision_effect_tooltip:0 "你将与女士见面。她可以在一段时间内赋予你力量，或者你可以与她断绝关系。"
 PODcanon_chars.44.t:0 "荆棘女士"
 PODcanon_chars.44.desc:0 "在她的森林深处，女士在等待你，就像你第一个见到她的晚上一样美丽。她微笑着，热情地感谢你的持续服务。\n作为温柔善良的后援，如果你有任何要求，她无疑会倾听你的请求。或者她可能有自己的要求。"
 PODcanon_chars.44.a:0 "我谦卑地请求您的祝福。"
 PODcanon_chars.44.b:0 "新的仆人？当然行，我的女士。"
 PODcanon_chars.44.c:0 "这种疯狂举动必须结束！"
 gregor_briey_tooltip:0 "你必须控制布里埃省份，才能呢保这选项可用。"
 PODcanon_chars.44.d:0 "我将在其他时候拜访她。"
 gregor_is_done_tooltip:0 "你今后将无法再与女士互动。"
 podintroductions.185.t:0 "你的过往"
 podintroductions.185.desc:0 "Famed Zelios, you are already known as the most proficient architect of the world of the night. You have build castles and manors for the undead lords and ladies for decades now. Still, your true masterwork eludes you.\nA hunch has led you to Transylvania where the earth itself seems... different. These strange geomantic energies are begging to be harnessed by your masterful hands, and you can't wait to get started."
 podintroductions.185.a:0 "最好的材料？"
 zelios_intro_tooltip:0 "作为达瓦，你具有一项专属建筑——塞琉斯工坊。"
 building_type_architect_workshop_01:0 "塞琉斯工坊"
 building_type_architect_workshop_01_desc:1 "#F 每一座建筑都是从一位好工匠手中的好工具开始的。#!"
 building_architect_workshop_01:0 "塞琉斯工坊"
 building_architect_workshop_01_desc:1 "塞琉斯在这里有自己的工场，为他的计划和学徒们准备一些即将到来的高超的建筑工程。"
 podintroductions.186.t:0 "你的过往"
 podintroductions.186.desc:0 "Lord Chandraputra, you know your duty.\nWar is in your blood and your [Sire|E] entrusted you with the prestigious, but difficult, task of finally securing India for the Ravnos. The accursed asuratizayya are strong opponents and the other Indian [cainites|E] aren't helping by not submitting to your righteous leadership. No matter, you will triumph sooner or later.\nYou are the steadfast regent and warmaster of your [clan|E]. Ready your armies, rally your troops, and march to victory!"
 podintroductions.186.a:0 "我们的宿命将用血写成。"
 chandraputra_intro_tooltip:0 "作为查古拉普夏，你具有一项提高你军事相关技巧的专属小决议。"
 chandraputra_decision:0 "战争的鼓声"
 chandraputra_decision_tooltip:1 "战争是一件复杂的事情，你必须做好准备。"
 chandraputra_decision_desc:0 "从很久以前的凡人时代起，你就一直是战争之主。尽管如此，仍有改进的余地。"
 chandraputra_decision_confirm:0 "老将军配新战术。"
 chandraputra_decision_effect_tooltip:0 "在接下来的五年里，你将把精力集中在与战争有关的特定事务上，来获得一些加值。"
 chandraputra_martial_modifier:0 "战争之主"
 chandraputra_martial_modifier_desc:0 "查古拉普夏领导的军队似乎有超自然的速度，几乎不需要喘息就能压上。"
 chandraputra_knights_modifier:0 "激烈的演练"
 chandraputra_knights_modifier_desc:0 "你的勇士们永远不会变得足够好到能满足你的眼光。但他们可以通过一些老式的演练来接近它。"
 PODcanon_chars.45.t:0 "战争的鼓声"
 PODcanon_chars.45.desc:0 "即使你具有丰富的战争经验也不一定足以确保胜利。总是有新的战术需要研究，新的训练方法需要设计，或者新的战斗计划需要制定。你必须保持勤奋。"
 PODcanon_chars.45.a:0 "兵贵神速。"
 PODcanon_chars.45.b:0 "我现在就想准备一场模拟战役！"
 PODcanon_chars.45.c:0 "我想知道有关最近的凡人战役的消息。"
 PODcanon_chars.45.d:0 "你还自称是勇士？"
 podintroductions.187.t:0 "你的过往"
 podintroductions.187.desc:0 "Lady Karmenita, you have been so hard at work in promoting your new Ravnos caste that you didn't saw the fall into sin of your childe, Iago Castille, until it was too late.\nYour once promising student is now a mere brigand, plundering the seas from his haven in Corsica. This isn't the legacy you want for your lineage.\nYou could try to send him a message, easing your relations in the hopes of a future reconciliation. Or maybe it's best to really forget about him."
 podintroductions.187.a:0 "对我们来说还不算太晚，孩子。"
 podintroductions.187.b:0 "他已经太过分了。"
 podintroductions.188.t:0 "你的过往"
 podintroductions.188.desc:0 "Fearless Iago, you are the master of the Mediterranean... or hope to be at least. Your pirate haven in Corsica could get you there in time.\nLeave the arrogant Princes to their petty schemes, you know where true power is and you are shrewd enough to take it by any means necessary.\nWhen all the sailors of the Mediterranean fear your name and your chests are brimming with gold... this is when you will truly triumph!"
 podintroductions.188.a:0 "全员出动！"
 iago_intro_tooltip:0 "作为雅戈，你有一项寻求掠夺和财富的专属决议。"
 iago_decision:0 "起航"
 iago_decision_tooltip:1 "船员们都很不安分，也许是时候出航了？"
 iago_decision_desc:0 "执政是不错，但你需要风在后方，掠夺在前方，才能真正感觉到活着。或近乎。"
 iago_decision_confirm:0 "风在后方！"
 iago_decision_effect_tooltip:0 "你将得在目标间选择。"
 iago_crew_weakened_modifier:0 "船员空虚"
 iago_crew_weakened_modifier_desc:0 "你的一些水手在上次的掠夺后再也没有回来，这在一定程度上削弱了你对你国度的控制。"
 iago_crew_depleted_modifier:0 "船员枯竭"
 iago_crew_depleted_modifier_desc:0 "你的许多水手在上次的掠夺后再也没有回来，削弱了你对你国度的控制。"
 iago_crew_empty_modifier:0 "无船员"
 iago_crew_empty_modifier_desc:0 "你的船员在上次的掠夺中几乎被杀到了只剩最后一个人，严重削弱了你对你的国度的控制。"
 PODcanon_chars.46.t:0 "海盗亲王起航"
 PODcanon_chars.46.desc:0 "你的船员已经准备好出发了，而且有许多富有的目标可选。你必须做出的选择是关于掠夺的难度。难度越大，回报越多，但在跳帮过程中你将失去更多的船员。如果他们死了，就显然不能再在家园里帮助你。"
 PODcanon_chars.46.a:0 "小猎物，小风险。"
 PODcanon_chars.46.b:0 "这个似乎很适度。"
 PODcanon_chars.46.c:0 "史上最大的劫掠！"
 PODcanon_chars.46.d:0 "我们现在不出航。"
 podintroductions.189.t:0 "你的过往"
 podintroductions.189.desc:0 "Lord Mritunjay, after a long wait and some careful planning, you have finally secured Baghdad for yourself. Time to enjoy your new power!\nOr maybe not, as the court is more and more worried about the so called 'Mongol Horde', these mortals horsemen attacking the Caliphate right now. You are unconvinced as they were recently beaten at Irbil, but you hear the urging of caution from your advisors. Perhaps you could keep some of the spoils of your victory in reserve if these dire omens come true?"
 podintroductions.189.a:0 "我可以先等一等，然后再享受亡生。"
 podintroductions.189.b:0 "我的钱，我想怎么用就怎么用！"
 mritunjay_intro_tooltip:0 "你得提前计划，以防蒙古人靠近你的城市。"
 baghdad_recovering_modifier:0 "恢复中"
 baghdad_recovering_modifier_desc:0 "多亏了你的精心策划，蒙古军队造成的损失没那么严重。城市正在恢复中。"
 PODcanon_chars.47.t:0 "睿智亲王"
 PODcanon_chars.47.desc:0 "蒙古军队终于停止了对巴格达这座美丽城市的掠夺和破坏。这是个令人痛苦的经历，但由于你的精心准备，你得以保存了大部分的东西。你不寒而栗地想，如果没有像你这样的准备，会发生什么。\n好吧，时间总是在流逝，但至少由于你的努力，你心爱的巴格达将保持是个伟大的学识和文化中心。"
 PODcanon_chars.47.a:0 "我在三十年前抉择得很好。"
 podintroductions.190.t:0 "你的过往"
 podintroductions.190.desc:0 "Lady Marcia, you have been hard at work completing your treatise on [clan|E] Ravnos and its numerous castes. You might have to focus your attention elsewhere for a while though.\nDuring your travels, you noticed the fall into decadence of a large part of the [clan|E], a far cry from the noble virtues your [Sire|E] and yourself uphold. If you act quickly enough, you might offer a rally point and an example to follow for the younger generations, perhaps saving your [clan|E]'s legacy in the process. You might even write a chapter or two about it in your Magnus Opum if you got the time."
 podintroductions.190.a:0 "该行动了。"
 marcia_intro_tooltip:0 "作为玛西娅，你有一项专属决议，那就是在一段时间内专注于你的写作，让你可在各种生活方式的回报中进行选择。"
 marcia_decision:0 "雷伏诺[clan|E]之人"
 marcia_decision_tooltip:1 "没时间写稿了。"
 marcia_decision_desc:0 "你没有忘记你在引用雷伏诺[clan|E]的每一个血统方面上的无止境的工作。你应该继续。"
 marcia_decision_confirm:0 "主题将是……"
 marcia_decision_effect_tooltip:0 "你将得在主题重点间选择。"
 PODcanon_chars.48.t:0 "雷伏诺氏族之人"
 PODcanon_chars.48.desc:0 "随着你继续对你的[clan|E]各血统的概述，你对他们的专长了解得越来越多。就像任何一本好书一样，你非常肯定，你最终学到的东西会比你的读者读到的东西还要多。"
 PODcanon_chars.48.a:0 "帕伊杜米特，骄傲的骑士。"
 PODcanon_chars.48.b:0 "普日·达伊，狡猾的诡计者。"
 PODcanon_chars.48.c:0 "亚历山得利特，精明的商人。"
 PODcanon_chars.48.d:0 "巴希利特，聪慧的狂热者。"
 podintroductions.191.t:0 "你的过往"
 podintroductions.191.desc:0 "Lady Zoe, after losing both your city and your [Sire|E] in quick succession, you were almost lost to despair and anger. Thankfully, Anatole took you under his wing and you both grew to be better persons for it.\nYou clearly feel indebted to him and so you have accepted to follow in his latest quest in Southern France. Perhaps it is here that you will finally find a purpose for your unlife? Many people lost as much as you did because of the Albigensian Crusade, and you could help them rebuild. You are sure that Anatole will agree on this plan, and would probably even help you again if he could."
 podintroductions.191.a:0 "也许是个新家？"
 zoe_intro_tooltip:0 "作为佐伊，你有一个与阿纳托尔的专属角色互动，用以寻求他的帮助。"
 POD_zoe_interaction:0 "共同成长"
 POD_zoe_interaction_desc:0 "阿纳托尔和你仍然可以从对方身上学到很多东西。"
 PODcanon_chars.49.t:0 "两个迷失的灵魂"
 PODcanon_chars.49.desc:0 "阿纳托尔是一个复杂的人，经常迷失在他的愿景中。但当他在精神正常的时候，他总是对你很好，很有耐心。他经常隐晦地告诉你，你是他在现实世界中的“锚”之一，而且他似乎真的很感谢你的友谊。\n在任何情况下，你们两个人在一起的时间总是以你们两个人对事物的新看法而告终。这是一个走向智慧的漫长旅程，但至少有一个朋友在你身边。"
 PODcanon_chars.49.a:0 "让我们今晚好好聊聊。"
 PODcanon_chars.49.b:0 "关于……我明白了。"
 PODcanon_chars.49.c:0 "你有一个愿景？我们可以一起理解它。"
 PODcanon_chars.49.d:0 "祈祷？……这可能有帮助。"
 etienne_support_modifier:0 "约根名义上的附庸"
 etienne_support_modifier_desc:0 "约根·冯·费尔登仍然认为你是他的附庸，并向你提供支持和帮助，尽管这涉及到遥远的距离。"
 podintroductions.192.t:0 "你的过往"
 podintroductions.192.desc:0 "Lord Etienne, you are caught between two opposing forces. Following the recent Crusade, you have secured your control over Acre thanks to the help of the German knights of Jurgen von Verden, and then swore fealty to him in exchange. But the recent birth of the Diet of Olives has put pressure on you.\nIts leader, Qawiyya el Ghaduba, wants your allegiance since you are clearly in her sphere of influence. Jurgen is too far away to really matter, but he has promised support if you, at least nominally, stays his vassal. This would probably infuriate Qawiyya however."
 podintroductions.192.a:0 "我在这必须要务实一点。"
 podintroductions.192.b:0 "我将忠实于我的承诺。"
 podintroductions.193.t:0 "你的过往"
 podintroductions.193.desc:0 "Lady Kemintiri, you have just awakened from a long [torpor|E] after a gruesome fight against one of Set's cursed spawn. You endured, as you always do.\nSet took everything from you, except the one thing he truly wanted, and you will return the favor. His pitiful lineage of cronies and sycophants must be purged. True, you are alone against the full might of a whole [clan|E] but... there is a very real reason why they already fear you. And you will give them more in the future."
 podintroductions.193.a:0 "我希望你在注视着。"
 kemintiri_intro_tooltip:0 "作为齐茉媞里，你有一项专属目标，即摧毁赛特的密教。"
 kemintiri_decision:0 "伊西斯的复仇"
 kemintiri_decision_tooltip:1 "蛇必须被碾碎。"
 kemintiri_decision_desc:0 "一旦赛特之子和他们被诅咒的密教不再存在，赛特的名字被沉入泥浆……那时你才与他扯平。"
 kemintiri_decision_confirm:0 "伊西斯怜悯我。"
 kemintiri_decision_effect_tooltip:0 "赛特之子将消失，其信徒将改信人性之道。"
 podintroductions.194.t:0 "你的过往"
 podintroductions.194.desc:0 "Lord Andreas, you are renowned as a fair and dependable caravan master. True, you often use these travels to preach Set's glory but you nonetheless always keep your word.\nYou have recently made a stop in this region, taking the time to teach your newest recruits about their role in Set's plans and, less importantly, in your caravan. It will be soon time to depart once more, but the roads are becoming more difficult each year. Perhaps it would be wise to keep this area as a home base of sort between your journeys."
 podintroductions.194.a:0 "尊敬赛特，尊敬圣言。"
 andreas_intro_tooltip:0 "作为安德烈亚斯，你可以通过一项小决议来踏上旅行队旅行，以获得各种回报，代价是离政一段时间。"
 andreas_decision:0 "旅行队主"
 andreas_decision_tooltip:1 "让我们回顾一下各种可能性。"
 andreas_decision_desc:0 "作为一个著名的旅行队主，你总是有机会接受流浪[cainites|E]的各种提议。"
 andreas_decision_confirm:0 "让我们来谈些生意。"
 andreas_decision_effect_tooltip:0 "你将能提供各种工作机会。"
 andreas_away_modifier:0 "旅行队主"
 andreas_away_modifier_desc:0 "安德烈亚斯正在引导他的一个旅行队，使他经常移动，暂时没法关注他的国度。"
 PODcanon_chars.50.t:0 "旅行队主"
 PODcanon_chars.50.desc:0 "由于你出色的声誉，很多人愿意为你向导。像往常一样，你也会利用这段离开你的国度的时间，将赛特的话语传播得更远更广，但有一个问题：这段旅程会有多长？要你的国度不受影响，你在国外呆的时间是有限制的。"
 PODcanon_chars.50.a:0 "一段小旅程会很好。"
 PODcanon_chars.50.b:0 "我可以处理这个。"
 PODcanon_chars.50.c:0 "没有我，这国度也会很好。"
 PODcanon_chars.50.d:0 "这里需要我。"
 podintroductions.195.t:0 "你的过往"
 podintroductions.195.desc:0 "Lord Nakhthorheb, you are Set's regent until he deems the world worthy enough to come back. But you have to work with the other Hierophants.\nThis august assembly wisely defers to you most of the time, but they still offer useful advice when needed. As Set's foremost guardian, it is your duty to protect the [clan|E] and bring the unbelievers into the fold. A long process to be sure, but you have eternity on your side."
 podintroductions.195.a:0 "荣耀归于杜阿特之主。"
 nakh_intro_tooltip:0 "作为纳克塔内波，只要赛特彭雷和玛阿特卡勒还活着，你就可以用一个小决议来召集圣显者聚会。"
 nakh_decision:0 "圣显者的聚会"
 nakh_decision_tooltip:1 "我们得谈谈。"
 nakh_decision_desc:0 "作为赛特之子[clan|E]的主要领导人，你仍然要听取其他方面的意见。因为身份，你的同僚圣显者们是最值得信赖的。"
 nakh_decision_confirm:0 "今晚的议程……"
 nakh_decision_effect_tooltip:0 "你将被提供未来五年的行动方案。"
 nakh_custom_decision:0 "这个决议只要赛特彭雷和玛阿特卡勒还活着就可用。"
 seterpenre_advice_modifier:0 "赛特彭雷提供建议"
 seterpenre_advice_modifier_desc:0 "思想前卫的赛特彭雷总是想把注意力放在对外关系和[clan|E]形象上。"
 maatkare_advice_modifier:0 "玛阿特卡勒提供建议"
 maatkare_advice_modifier_desc:0 "耐心的玛阿特卡勒希望专注于你自己的土地，使埃及成为大地上最伟大的地方，值得赛特归来。"
 PODcanon_chars.51.t:0 "圣显者的会晤"
 PODcanon_chars.51.desc:0 "这类事件总是很容易预测的。吸血鬼毕竟不会有太大的变化，他们的政治立场也是如此。作为他们中最重要的圣显者，你总是拥有最后的决定权，但即使是你也知道，有时听从别人的建议也是有好处的。"
 PODcanon_chars.51.a:0 "赛特彭雷，我们将遵循你的计划。"
 PODcanon_chars.51.b:0 "玛阿特卡勒，这次你是对的。"
 PODcanon_chars.51.c:0 "我们将按我的方式来！"
 podintroductions.196.t:0 "你的过往"
 podintroductions.196.desc:0 "Lady Neferu, your Fire Court is growing in power nightly. But you can do more.\nYour reputation as a mistress of mysteries and corruption is well deserved and there are few beings who can leave the Court without pledging their undying soul to Set. This is a reputation you must foster, as it will help your ascension in Set's hierarchy. Soon, they will all learn to both fear and love your tender care in equal measures."
 podintroductions.196.a:0 "欢迎你，祝你住得愉快……"
 neferu_intro_tooltip:0 "作为尼芙璐，你有一项专属的通过火之庭释放囚犯的选项。"
 NEFERU_RELEASE:0 "火之庭的试炼"
 sarrasine_running_modifier:0 "逃亡中"
 sarrasine_running_modifier_desc:0 "凯塔尔的追随者仍在追杀你。这无疑使事务变得复杂了。"
 podintroductions.197.t:0 "你的过往"
 podintroductions.197.desc:0 "Lord Sarrasine, things didn't really go as planned. Your [diablerie|E] of Khay'Tall failed and you had to make an hasty escape to save your skin from his angry followers. Time to bounce back.\nYou have joined the remnants of the 4th Crusade as you sense weakness in them, they could be brought down from the inside and the Greeks are too busy retaking Constantinople to jump at the opportunity. As such, you might be able to carve your own fief in Anatolia before anybody else can react. It's only then that you will be strong enough to avoid your pursuers for good."
 podintroductions.197.a:0 "是时候脱下我的皮了。"
 sarrasine_intro_tooltip:0 "作为萨拉金，你开始时有一个负面修正，可通过一项专属决议来摆脱它。"
 sarrasine_decision:0 "末路"
 sarrasine_decision_tooltip:1 "我已经厌倦了逃跑。"
 sarrasine_decision_desc:0 "只有当你变得足够强大，让他们感到害怕时，凯塔尔的追随者才会停止追杀你。还有什么地方比摇摇欲坠的拜占庭帝国更适合做这件事呢？"
 sarrasine_decision_confirm:0 "现在该谁逃了？"
 podintroductions.198.t:0 "你的过往"
 podintroductions.198.desc:0 "Lord Arnulf, your Jormungandr cult is growing nicely, quite helped by the turmoil in the region. Still, there are issues to deal with.\nThe foremost among them being Valdis, your own childe, who has fancy ideas about a 'proper' cult to the Scandinavian Gods. Let's be honest for a second, you are here for the money and power and you are more than happy leaving the godly stuff to the priests.\nYou might need Valdis in the future though and making inroads towards a reconciliation, even as insincere as they would be, could be a wise move."
 podintroductions.198.a:0 "我当然关心诸神，瓦尔季斯！"
 podintroductions.198.b:0 "不，她没救了。"
 podintroductions.199.t:0 "你的过往"
 podintroductions.199.desc:0 "Lord Jean-Baptiste, unlife is looking quite good. Your start was rocky, but you bounced back nicely and are now one of France's most successful 'night entrepreneur'.\nYou provide quality entertainment for the highest sphere of mortal, and [cainite|E], politicians. There is money to be made, and if the saying about money and power is true, you are about to become very powerful very soon."
 podintroductions.199.a:0 "是时候扩大我的业务范围了！"
 jean_intro_tooltip:0 "作为让·巴蒂斯特，你具有一项专属建筑系列：掌控夜生活。"
 building_type_influence_night_life_01:0 "掌控夜生活"
 building_type_influence_night_life_01_desc:1 "#F 让·巴蒂斯特敏锐的商业意识可以在本省份中得到很好的利用。#!"
 building_influence_night_life_01:0 "掌控赌场"
 building_influence_night_life_01_desc:1 "庄家总会赢。"
 building_influence_night_life_02:0 "掌控酒馆"
 building_influence_night_life_02_desc:1 "遗忘你的悲伤，但不要遗忘你的钱包。"
 building_influence_night_life_03:0 "掌控妓院"
 building_influence_night_life_03_desc:1 "据称没有人会去的地方，但每天晚上却仍然神秘地满员。"
 podintroductions.200.t:0 "你的过往"
 podintroductions.200.desc:0 "Lord Goratrix, despite all you have done for the House, Tremere himself exiled you to France. Clearly a symptom of a greater disease eating at your [clan|E].\nAnd this isn't this babbling buffoon Etrius that will uncover the truth! That idiot is still trying to undermine you, even as he has been made Regent of House Tremere. No matter, you will use the fertile political situation in France to create your own power base, then go back triumphantly to the heartlands of the Tremere. You will save your House, even from itself if need be."
 podintroductions.200.a:0 "我会回来的。"
 goratrix_intro_tooltip:0 "作为格拉崔克斯，只要伊崔乌斯还活着，你就得忍受他的鬼把戏。"
 PODcanon_chars.52.t:0 "伊崔乌斯的鬼把戏"
 PODcanon_chars.52.desc:0 "又一个伊崔乌斯用于损害你的阴谋被揭穿了。像往常一样，这是一个意志薄弱的粗鲁者的微弱侵犯。可悲的是，在可预见的未来，它仍会扰乱你的计划，你将不得不以某种方式处理它。"
 PODcanon_chars.52.a:0 "贿赂那些为他工作的傻瓜。"
 PODcanon_chars.52.b:0 "我有的是人去处理这个问题！"
 PODcanon_chars.52.c:0 "行，我自己来。"
 podintroductions.201.t:0 "你的过往"
 podintroductions.201.desc:0 "Lady Meerlinda, despite some difficulties, you have been able to establish a strong Tremere presence in England. Mithras isn't making your life easy though, and you will have to watch his next moves carefully.\nYou have also been searching for information concerning the fabled Holy Grail and its effect on vampires. To this end, you have identified two likely sources, the castles of Avalon and of the Bitter Ashes where two orders of 'vampires knights' reside. If you could explore these fortresses, you might find, if not the Grail itself, at least some interesting tidbits about it."
 podintroductions.201.a:0 "也许我是这片土地的摩根勒菲。"
 meerlinda_intro_tooltip:0 "作为梅琳达，你有一项专属决议，即获取两大城堡以得到回报。"
 meerlinda_morgan_modifier:0 "摩根勒菲再世"
 meerlinda_morgan_modifier_desc:0 "梅琳达没有找到圣杯，但她肯定找到了一些东西。她现在是这些岛屿的美丽、强大而可怕的妖女。"
 meerlinda_decision:0 "英格兰的妖精"
 meerlinda_decision_tooltip:1 "传说故事往往藏有真相的火花。"
 meerlinda_decision_desc:0 "阿瓦隆的城堡和怨烬的城堡肯定隐藏着一些关于圣杯的秘密。获取它们，并将它们隐藏的力量据为己有。"
 meerlinda_decision_confirm:0 "……亚瑟王有何用？"
 podintroductions.202.t:0 "你的过往"
 podintroductions.202.desc:0 "Lord Jervais, your ascension continues. Thanks to your great knowledge of the Germanic diplomatic scene, you have been tasked with a rewarding, if difficult, mission. Destroying the leader of the schismatics known as 'Telyavelic Tremere', Deverra, and the Gangrel supporting her.\nYou have assembled a coterie of reliable and talented clansmates, but you are still vastly outnumbered by the foes. This might be your greatest challenge yet."
 podintroductions.202.a:0 "我们必须谨慎谋划。"
 jervais_intro_tooltip:0 "作为德维拉，你有一项专属决议，那就是除掉德维拉和利沃尼亚野者来获得奖赏。"
 jervais_rising_modifier:0 "明日之星"
 jervais_rising_modifier_desc:0 "贾维斯在睿魔尔金字塔中的地位继续快速提升，给整个[clan|E]留下了深刻的印象。"
 jervais_decision:0 "利沃尼亚的克星"
 jervais_decision_tooltip:1 "我必须在该分裂蔓延之前终结它。"
 jervais_decision_desc:0 "伊崔乌斯的命令很明确。杀死特亚维派的首领德维拉，以及庇护她的利沃尼亚野者。"
 jervais_decision_confirm:0 "任务完成。"
 jervais_custom_decision:0 "德维拉必须死。"
 jervais_custom_decision2:0 "利沃尼亚野者必须被毁灭。"
 rutor_running_modifier:0 "逃亡中"
 rutor_running_modifier_desc:0 "睿魔尔因你的背叛想要你死，并且正在追杀你。这无疑使事务变得复杂了。"
 podintroductions.203.t:0 "你的过往"
 podintroductions.203.desc:0 "Lord Rutor, you have enough of being ordered around, be it by Tzimisce or Tremere. You won't bow to anyone ever again.\nYou escaped House Tremere by running towards Denmark, a fortuitous choice seeing as the region is lacking a strong centralized vampiric power. Perhaps it could be you? If you were to act quickly and decisively enough to secure a solid powerbase, your [clan|E] would have to give up on its chase. Then, it would finally be your turn to give orders, a very tantalizing prospect indeed."
 podintroductions.203.a:0 "新的开始？"
 rutor_intro_tooltip:0 "作为鲁托尔，你可以通过达成你的专属决议，来除掉你的起始修正"
 rutor_decision:0 "末路"
 rutor_decision_tooltip:1 "我已经厌倦了逃跑。"
 rutor_decision_desc:0 "睿魔尔[clan|E]将永远不会停止对你的追杀，除非你足够强大，迫使他们暂停。是时候掌控局面了。"
 rutor_decision_confirm:0 "现在该谁逃了？"
 faithful_xavier_modifier:0 "忠诚议员"
 faithful_xavier_modifier_desc:0 "作为睿魔尔精英的典范，没有人怀疑泽维尔对事业的承诺。"
 unfaithful_xavier_modifier:0 "忠诚议员？"
 unfaithful_xavier_modifier_desc:0 "没人怀疑泽维尔对事业的承诺……至少在公开场合不会。"
 podintroductions.204.t:0 "你的过往"
 podintroductions.204.desc:0 "Lord Xavier, you have arrived in Northern Africa determined to uncover the mysteries of this continent for the glory of your [clan|E]. At least, that's the official version.\nIn truth, the rest of the council wasn't really happy with your decision to leave them while the heartland itself is besieged. But you gave them no choice, as you are tired of the petty intrigues at home and long for something greater. You will have to carefully balance your official duties to the Tremere with your relentless quest for knowledge and secrets."
 podintroductions.204.a:0 "为了睿魔尔[clan|E]的荣耀！"
 podintroductions.204.b:0 "为了睿魔尔[clan|E]的荣耀……"
 therimna_secrets5_modifier:0 "剩余秘密：5"
 therimna_secrets5_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets4_modifier:0 "剩余秘密：4"
 therimna_secrets4_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets3_modifier:0 "剩余秘密：3"
 therimna_secrets3_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets2_modifier:0 "剩余秘密：2"
 therimna_secrets2_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets1_modifier:0 "剩余秘密：1"
 therimna_secrets1_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 podintroductions.205.t:0 "你的过往"
 podintroductions.205.desc:0 "Lady Therimna, the Tremere are done for, you know it. And you won't sink with that ship.\nYou escaped your [clan|E] with many interesting secrets about blood sorcery under your belt, secrets that many would pay dearly to acquire. These could be your lifeline, as you are too important to kill as long as you hold them... but you are also a much more important target to take down for the Tremere themselves.\nYou will have to strike a balance between selling your secrets for some always important gold and keeping them for the leeway they give you."
 podintroductions.205.a:0 "我的存活是最重要的。"
 therimna_intro_tooltip:0 "作为泰瑞姆纳，你开始时具有5个秘密，你可以通过一个小决议出售，改变它们给你的减益和增益的平衡。"
 therimna_decision:0 "讨价还价"
 therimna_decision_tooltip:1 "万物皆有价。"
 therimna_decision_desc:0 "你所拥有的血魔术的秘密使你成为睿魔尔的目标，但也使你成为一位对其他人来说过于重要不该被杀的人。你愿意用这种相对的平静来换取金钱吗？"
 therimna_decision_confirm:0 "成交。"
 podintroductions.206.t:0 "你的过往"
 podintroductions.206.desc:0 "Lady Virstania, you have finally found solace and company in your beloved Gargoyles. Far from the cruelty and brutality of the rest of your brethren, only them truly understand you.\nYour heart aches at the thought of letting them go to the slaughter for the senseless Tremere's wars. For now though, you have little choice and must play their game. But you are dedicated about changing that soon enough. Your beautiful babies can only be truly cared for by their loving mother after all..."
 podintroductions.206.a:0 "家庭是最重要的。"
 virstania_intro_tooltip:0 "作为维斯塔尼亚，你能使用决议来生成石像鬼兵士军团。"
 virstania_decision:0 "漂亮的石宝宝"
 virstania_decision_tooltip:1 "还有更多正在到来！"
 virstania_decision_desc:0 "你是石像鬼之母，你必须帮助它们正确地生活。这是一项巨大的责任，但也是你最大的幸福。"
 virstania_decision_confirm:0 "嘘……妈妈在这。"
 virstania_decision_effect_tooltip:0 "你将选择生成多少石像鬼。"
 PODcanon_chars.53.t:0 "诞生"
 PODcanon_chars.53.desc:0 "下一批石像鬼几乎已经准备好了。然而，贪婪的睿魔尔已经在试图从你手中夺走它们，如果你想拯救它们，你必须迅速行动。你想救下多少？"
 PODcanon_chars.53.a:0 "我至少救了其中的一些。"
 PODcanon_chars.53.b:0 "我必须拯救更多！"
 PODcanon_chars.53.c:0 "所有！"
 PODcanon_chars.53.d:0 "这次我无法帮助他们……"
 virstania_small_gargoyles_tt:0 "一组石像鬼会被加入到你的可用兵士中。"
 virstania_medium_gargoyles_tt:0 "两组石像鬼会被加入到你的可用兵士中。"
 virstania_high_gargoyles_tt:0 "三组石像鬼会被加入到你的可用兵士中。"
 angry_fays_marconius_modifier:0 "愤怒的妖精"
 angry_fays_marconius_modifier_desc:0 "通过对神秘的妖精进行实验，你学到了很多东西……但你也在制造强大的敌人。"
 podintroductions.207.t:0 "你的过往"
 podintroductions.207.desc:0 "Lord Marconius, you have been hard at work trying to understand your new condition as one of the Kiasyd. Obviously, the best course of action was to 'experiment' on some captured Fae, since you seem to share some similarities with them. They aren't happy with that though.\nYou also know that [clan|E] Lasombra is looking for any sign of weakness to target you, and this schism with your allies might be what they were waiting for. You might need to be careful in balancing your thirst for knowledge and your precarious alliance with the Fae."
 podintroductions.207.a:0 "令人为难的情况。"
 marconius_intro_tooltip:0 "作为马可纽斯，你可以具有一项平衡你与妖精的关系的决议。"
 marconius_decision:0 "你与妖精"
 marconius_decision_tooltip:1 "如何接触他们……"
 marconius_decision_desc:0 "无论你喜欢与否，妖精都是你的国度的一个重要部分。因此，你必须谨慎选择对他们的立场。"
 marconius_decision_confirm:0 "是时候重新考虑我的选择了？"
 marconius_decision_effect_tooltip:0 "你将选择如何接触妖精。"
 happy_fays_marconius_modifier:0 "有帮助的妖精"
 happy_fays_marconius_modifier_desc:0 "妖精认为你是一个有用的，即使是善变的盟友，而且目前更喜欢是你在权位上，而不是另一位吸血鬼。"
 PODcanon_chars.54.t:0 "你与妖精"
 PODcanon_chars.54.desc:0 "由于你的国家对妖精的历史意义，它正在与妖精合作，而你必须处理好这个问题。他们是有用的盟友，尤其是用于对付你的同族族人的潜在报复，但他们也是非常有趣的实验对象，可以了解你这么一位被妖精眷染的[cainite|E]的状况。决定，决定……"
 PODcanon_chars.54.a:0 "遗憾的是，我现在需要他们作为盟友。"
 PODcanon_chars.54.b:0 "我将暂时保持距离。"
 PODcanon_chars.54.c:0 "有太多可了解的了！"
 podintroductions.208.t:0 "你的过往"
 podintroductions.208.desc:0 "Lord Chinkhai, your duty is to protect the Anda. The steppes are vast however, and you have to wander a lot to deal with the various issues arising night after night.\nIt has become worse since your people have taken on calling to you as the ultimate authority to settle disputes and other minor conflicts. As the informal 'Judge of the Steppes' you have a lot of power, power that you are starting to understand enough to use for the greater good of your brethren. Whether they know it or not."
 podintroductions.208.a:0 "判官与军阀。"
 chinkhai_intro_tooltip:0 "作为钦卡海，你有一项专属的审判你封臣的角色互动。"
 POD_chinkhai_interaction:0 "大草原之判官"
 POD_chinkhai_interaction_desc:0 "我将开庭。"
 PODcanon_chars.55.t:0 "审判"
 PODcanon_chars.55.desc:0 "作为安答部族的究极权威，你可以完全自由地以你喜欢的方式开始和结束任何审判。然而，你要维护自己的声誉，太过宽松可能会被看作是一种软弱。"
 PODcanon_chars.55.a:0 "无罪！"
 PODcanon_chars.55.b:0 "有罪！"
 PODcanon_chars.55.c:0 "本案尚无定论。"
 podintroductions.209.t:0 "你的过往"
 podintroductions.209.desc:0 "Fearsome Magda, one more invader tries to despoil your beautiful island. This Mithras is but the latest in a long list of foreign conquerors taking what is yours. You will not allow it.\nYour people is long gone and your faith is barely a memory, even to you at this point. Only your fury remains, and it is time to let it speaks for you. The isles have been corrupted beyond repair and you will have to destroy everything in your path to make them pure again.\nIt will be bloody, but they are only reaping what they sow."
 podintroductions.209.a:0 "他们将付出代价。"
 magda_intro_tooltip:0 "作为玛格达，你可以在低发展度的省份中建造专属建筑系列。"
 building_type_magda_purge_01:0 "玛格达的清洗"
 building_type_magda_purge_01_desc:1 "#F 该让岛屿重新开始了。崭新且血腥的开始。#!"
 building_magda_purge_01:0 "玛格达的部群"
 building_magda_purge_01_desc:1 "在玛格达的指挥下，冈格罗部群在这片土地上游荡，在他们的路上散布恐怖和死亡。\n这个级别需要省份具有11以下的发展度来建立和保持启用。"
 building_magda_purge_02:0 "玛格达的部族"
 building_magda_purge_02_desc:1 "野蛮的强者为王法则已经重新控制了这里。文明在玛格达的记仇部族的爪子和獠牙下轰然倒塌。\n这个级别需要省份具有6以下的发展度来建立和保持启用。"
 podintroductions.210.t:0 "你的过往"
 podintroductions.210.desc:0 "Lady Catubodua, you have finally left France after quite a long time spent here. You finally found what you searched and it is time to move on.\nBrujah himself trusted you to keep his [clan|E] on the right path but the task is immense. You will have to make yourself known to the rest of your brethren, and grow you already impressive legend. Only then will they accept that you are the true inheritor of Brujah's legacy."
 podintroductions.210.a:0 "要做的事情还很多。"
 catubodua_intro_tooltip:0 "作为波乌狄纳，你不能[Embrace|E]，因为她在第一位子嗣之后就发誓不再这样做。\n你还具有一项专属决议，用以增长你的传奇，给其他氏族族人留下深刻印象。"
 catu_heir_of_brujah_modifier:0 "布鲁赫的嗣女"
 catu_heir_of_brujah_modifier_desc:0 "终于，布鲁赫[clan|E]正在痊愈。一位配得上布鲁赫和特洛伊尔的女继承人已经崛起，将带领战士–学者们进入一个新的、光明的时代。"
 catubodua_decision:0 "布鲁赫的复兴"
 catubodua_decision_tooltip:1 "我不能让他失望。"
 catubodua_decision_desc:0 "骄傲的布鲁赫不会接受新的统治者，除非他或她能完美地代表他们[clan|E]的战士又学者的一面。显然，同时还要是个成功的统治者。"
 catubodua_decision_confirm:0 "新的时代开始了。"
 podintroductions.211.t:0 "你的过往"
 podintroductions.211.desc:0 "Lady Deverra, your people are in grave danger. As the Christian followers become more and more aggressive, [clan|E] Tremere has sent a coterie led by Jervais to kill you and the other Telyavelic.\nLuckily, you found Qarakh and are now under the protection of the Ferals of Livonia. Still, you will not rest easy until this Tremere's attack is dealt with, and the frontiers of the Feral secure. The safety of you and yours is at this price."
 podintroductions.211.a:0 "特亚维保佑我们。"
 deverra_intro_tooltip:0 "作为德维拉，你有一项专属决议，那就是摆脱贾维斯，将野者的疆域向东扩展。"
 deverra_blessed_modifier:0 "特亚维的选民"
 deverra_blessed_modifier_desc:0 "德维拉显然是特亚维的选民。她的信仰散发着光芒，让所有人都能看到，这对十字的追随者来说是一位剩敌，他们还没有赢。"
 deverra_decision:0 "特亚维的选民"
 deverra_decision_tooltip:1 "我不能让他失望。"
 deverra_decision_desc:0 "你的人民在未来的混乱时期依靠你和野者的保护。如果你能杀死在攻的睿魔尔首领，并确保你东部边界的安全，你的情况将会得到改善。"
 deverra_decision_confirm:0 "我们忍过了。"
 deverra_custom_decision:0 "贾维斯必须死。"
 deverra_custom_decision2:0 "你或你的领主完全控制了波美拉尼亚公爵领。"
 deverra_custom_decision3:0 "你或你的领主完全控制了普鲁士公爵领。"
 podintroductions.212.t:0 "你的过往"
 podintroductions.212.desc:0 "达楠女士，你的皇朝很强大。由于您与大越和吴哥丛林中的凶民结盟，您的东部边界是安全的。只有西方现在需要您的关注。\n印度一直是一个难以驯服的地区，充满了无尽天雷皇朝的异端和所谓的[cainites|E]造成的问题。也许你的东方朋友可以伸出他们的爪子和獠牙，帮助你安抚这个不守规矩的地区？"
 podintroductions.212.a:0 "朱雀高舞。"
 dyanang_intro_tooltip:0 "作为达楠，你有一项专属的招募狼人兵士小决议。"
 dyanang_decision:0 "凶民"
 dyanang_decision_tooltip:1 "朋友们，我需要你们的帮助。"
 dyanang_decision_desc:0 "你的皇朝和丛林王国的凶民之间的良好关系可以被利用来获得帮助。"
 dyanang_decision_confirm:0 "欢迎，并谢谢你。"
 dyanang_decision_effect_tooltip:0 "你将选择生成多少狼人兵士。"
 PODcanon_chars.56.t:0 "来自丛林的帮助"
 PODcanon_chars.56.desc:0 "自从1210年黄金障壁——武无私地拯救了被称为廊开的中龙龙化人的生命后，可怕的变化妖怪会就成了你暂时的盟友。滥用这种友谊仍然是不明智的，但你仍然可以指望他们在需要时帮助你。"
 PODcanon_chars.56.a:0 "一支战队就够了。"
 PODcanon_chars.56.b:0 "需要两支战队。"
 PODcanon_chars.56.c:0 "你有多少我要多少。"
 PODcanon_chars.56.d:0 "实际上，我可以自己处理情况。"
 dyanang_small_werewolves_tt:0 "一组狼人会被加入到你的可用兵士中。"
 dyanang_medium_werewolves_tt:0 "两组狼人会被加入到你的可用兵士中。"
 dyanang_high_werewolves_tt:0 "三组狼人会被加入到你的可用兵士中。"