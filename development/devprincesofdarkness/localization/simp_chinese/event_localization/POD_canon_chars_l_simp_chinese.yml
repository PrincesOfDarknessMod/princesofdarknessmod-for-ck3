l_simp_chinese:
 PODcanon_chars.1.t:0 "新的开始"
 PODcanon_chars.1.desc:0 "终于结束了。那个蠢货，斯巴达的墨涅拉俄斯，已经死了，而你，千百年来第一次，可以随心所欲了。胜利感觉……比你想象的要空虚，因为你突然失去了你亡生中的目标……但你会继续活下去，一如既往。\n这个世界已经忘记了你，甚至连最老的妥芮朵都认为你是个神话。这可能对你有利。现在是时候回到该隐之子政治的世界了，一个你非常熟悉的世界，但有一个明显的优势：没有重要的人真的怀疑你真正的权力。\n这是一种非常有用的资产，你打算尽可能长时间地保留它……"
 PODcanon_chars.1.a:0 "我的飞升终于可以开始了"
 PODcanon_chars.helena:0 "你解锁了对外地统治者的新角色互动：渗入"
 PODcanon_chars.2.t:0 "神的觉醒"
 PODcanon_chars.2.desc:0 "终于完成了。你几乎完成了召唤斯凡特维德降临到自愿宿主的仪式。你迫不及待地想要感受神的力量流淌在你永恒的血管里！\n不过有个小问题，在你的研究过程中，你发现宿主的心智应该会因为斯凡特维德的到来而被抹除掉。很明显，你意志坚强，不会像一些被你击垮的白痴密教徒那样轻易颓败，但是……这仍然令人担忧。\n简单地解读这个仪式已经教会了你很多，可能本身就是一个足够的奖励。\n或者你可以召唤一位神并试着让牠屈从于你的意志。选择权在你手中……也许这是最后一次了。"
 PODcanon_chars.2.a:0 "究极力量！"
 PODcanon_chars.2.b:0 "……我感觉不太妙"
 PODcanon_chars.3.t:0 "神之间的浪漫"
 PODcanon_chars.3.desc:0 "她回来了。\n伊西斯心爱的女儿再次加入了你的阵营，一股矛盾的情绪又回到了你的身边。你这一次拥有的是激情，虽然转瞬即逝。也许你的故事会更经得起时间的考验，因为现在你们都长大了，希望也更聪明了。\n至少，这将是有趣的，特别是当你的封臣已经在你背后抱怨。齐茉媞里从来都不是他们当中最受欢迎的人物。\n但你不在乎。她回来了，亡生似乎值得再活一段时间，希望是很长一段时间。"
 PODcanon_chars.3.a:0 "让我们依照我们的想法去重建这片土地"
 PODcanon_chars.mithras:0 "你解锁了一项限时的大决议"
 PODcanon_chars.4.t:0 "战争审判"
 PODcanon_chars.4.desc:0 "你已经谋略了一系列快速而果断的小规模战斗来对付这个反叛的封臣。如果你能取得胜利，你就可以暂时不受叛乱的影响，至少是这个人的。\n不过在发动攻击前最好确定一下成功的概率，如果你输了，后果会比根本不尝试这样的行动更糟糕......"
 PODcanon_chars.4.a:0 "迈向胜利！"
 PODcanon_chars.4.b:0 "今晚不是那晚"
 PODcanon_chars.4.effect.success.desc:0 "胜利将暂时性的崩坏封臣的精神"
 PODcanon_chars.4.success:0 "胜利！"
 PODcanon_chars.4.critical.failure.effect.desc:0 "失败将鼓励封臣的叛乱精神"
 PODcanon_chars.4.failure:0 "失败……"
 PODcanon_chars.5.t:0 "仰望金字塔"
 PODcanon_chars.5.desc:0 "现在是时候使用你作为睿魔尔氏族之主的正当权力，来进行一些老式的封闭政治。既然你站在金字塔的顶端，你就会赢得最后的胜利，问题是你能从中得到什么具体的好处。\n这么多的选择，后果却如此之小！除了显而易见地惹恼你下面的人。不过这其实都无所谓。"
 PODcanon_chars.5.a:0 "偷走其他人的主意"
 PODcanon_chars.5.b:0 "让其他人为你的失败负责"
 PODcanon_chars.5.c:0 "征用氏族金库"
 PODcanon_chars.5.d:0 "我没心情应对政治"
 PODcanon_chars.6.t:0 "鹰巢的奖励"
 PODcanon_chars.6.desc:0 "哈基姆的子嗣的领导人对伊比利亚午夜新月的进展感到高兴。他们向你致以最诚挚的问候和祝贺，同时也向你表示支持，向维齐尔、术士和战士种姓的稚子们表示祝贺。\n你的工作还没有完成，但你身上的压力现在不那么沉重了，看起来他们终于相信你会为氏族的最大利益着想。甚至有可能让伊比利亚成为一个配得上哈基姆本人的未来重要据点。"
 PODcanon_chars.6.a:0 "我将是阿拉穆特十年内的话题人物"
 PODcanon_chars.7.t:0 "计中计"
 PODcanon_chars.7.desc:0 "你对这个潜在的敌人有了更多的了解。这对你来说总是一种奇怪的安慰，罗克亲王，因为你喜欢智取你的敌人，让他们落入一个无法陶土的阴谋之网。\n尽管如此，你有时并不只是为了搞阴谋而搞阴谋。您可以利用获得的信息进行进一步的计划！"
 PODcanon_chars.7.a:0 "对这家伙启用更多的计谋！"
 PODcanon_chars.7.b:0 "勾心斗角是一种舒缓的消遣……"
 PODcanon_chars.7.c:0 "让每个人都知道你的阴谋技巧有多厉害！"
 PODcanon_chars.8.t:0 "兴风作浪"
 PODcanon_chars.8.desc:0 "蒙塔诺大人，随着意大利大部分地区在你的控制下回归，你向勒森魃氏族证明了你仍然是一个有效而果断的统治者。显然，要恢复暗影之海在地中海世界的位置还有很多工作要做，但至少，你作为氏族首领的地位不再有争议。\n你现在可以使用它来宣称对任何任性的勒森魃亲王领的统治权。"
 PODcanon_chars.8.a:0 "我可以做得更好"
 PODcanon_chars.montano:0 "你现在在与任何勒森魃统治者的「提议附庸」互动的接受度上有专属增益"
 PODcanon_chars.9.t:0 "携爱初拥"
 PODcanon_chars.9.desc:0 "美丽的玛阿特卡勒，当你全身心投入某件事时，你很难被阻挡，但该隐之子是固执的生物。如果你要展示赛特之爱，它将需要你所有会得的说服和诱惑技巧来实现。\n失败的风险总是存在的，这将会让你在赛特无情的眼神中付出相当大的代价……"
 PODcanon_chars.9.a:0 "赛特的荣耀不能等待"
 PODcanon_chars.9.b:0 "今晚不是那晚"
 PODcanon_chars.9.effect.success.desc:0 "胜过意志将使该角色皈依赛特之道"
 PODcanon_chars.9.success:0 "赞美赛特！"
 PODcanon_chars.9.critical.failure.effect.desc:0 "失败将使你付出一些代价"
 PODcanon_chars.9.failure:0 "我输了……"
 PODcanon_chars.10.t:0 "行于黑螺旋"
 PODcanon_chars.10.desc:0 "你见过那些「黑旋舞者」，他们的一举一动显得丧心病狂，即使是按照你的松散标准。你受到的痛苦有微小的可能得到解答，但这值得吗？唯一可以肯定的是，一旦你从这个被诅咒的地方回去，你整个人就不会再和之前一样了……"
 PODcanon_chars.10.a:0 "现在没有回头路了"
 PODcanon_chars.10.b:0 "这是个非常非常坏的主意"
 PODcanon_chars.petaniqua:0 "你更有可能从现在回到比起点更糟糕的地方。但也许有一丝希望能做点有价值的事……"
 PODcanon_chars.11.t:0 "疯于黑螺旋"
 PODcanon_chars.11.desc:0 "人们认为你已经从黑螺旋中回来了，相较之前并没有任何改变。但你自己更清楚，你未从那里回来，从来没有。而它现在与你同在。\n而这些……你所看到的东西将永远不会离开你的视野。也许整个世界只是它的延伸。或者你只是走得太远，不再去关心。\n你不会想再回到那里。还是说你想？"
 PODcanon_chars.11.a:0 "再也没有光了"
 PODcanon_chars.12.t:0 "明于黑螺旋"
 PODcanon_chars.12.desc:0 "你不记得你在黑螺旋中的大部分旅程，是……也许这是最好的结果。你没有发现隐藏的真相，或肮脏的恐怖。如果你有，你会对他们有一些记忆，对吗？\n不管怎么说，尽管遇到了所谓的挫折，你还是很欣慰地离开了那里。奇怪的是，现在外面的世界似乎很舒适。"
 PODcanon_chars.12.a:0 "情况本来可能更糟"
 PODcanon_chars.13.t:0 "黑螺旋之力"
 PODcanon_chars.13.desc:0 "毫无疑问，黑螺旋是一个究极疯狂的地方。但你的凡生和亡生经历了这么多，这次它并没有击垮你。你克服了恐惧，「它」对你的表现感到满意。\n尽管有这力量的展示，你会承认你很高兴再次加入外面的世界。这一点也不轻松。"
 PODcanon_chars.13.a:0 "我不容易被吓到"
 PODcanon_chars.14.t:0 "黑螺旋之礼"
 PODcanon_chars.14.desc:0 "你找到了他。\n也许是黑螺旋怜悯你， 或是被你的奉献精神所打动。又或许这只是一个梦， 也就是你那破碎心灵的幻想。但你不关心。\n他现在和你在一起了，一切都会再一次好起来的。"
 PODcanon_chars.14.a:0 "你注定要成为世界之王"
 PODcanon_chars.petaniqua2:0 "从现在开始，你没有理由再行于黑螺旋了"
 podintroductions.116.t:0 "你的过往"
 podintroductions.116.desc:0 "哈德施塔特大人，到目前为止，你的政治升迁是非常出色的。从一个被漠视的世系和边境处地起家，你成功地利用凡人的神圣罗马帝国的崛起，将梵卓从罗马重新集中到德意志。\n不过，旧习难改，你不得不与罗马遗民的领袖茱莉亚·安塔西亚合作，才走到这一步。现在可能是时候「重新谈判」你们的伙伴关系，把这些尘封的古物放到属于它们的博物馆里去。\n你有强大的盟友和忠诚的子嗣，让他们保持亲近并注意他们的处位，历史将由你来书写。"
 podintroductions.116.a:0 "德意志即是未来"
 podintroductions.hardestadt:0 "作为哈德施塔特，你有一个与你的子嗣的专属角色互动，用以驾驭其等。"
 pressure_on_modifier:0 "施加压力"
 pressure_on_modifier_desc:0 "这个角色正处于要做到最好的压力之下。"
 PODcanon_chars.15.t:0 "绷紧缰绳"
 PODcanon_chars.15.desc:0 "你的子嗣回应了你的召唤，急切地想听到你的诉求。你是出了名的严格的尊长，是那种不轻易容忍失败的人。不过，没有人可以否认，你的教育选择造就了他们这一代中最有天赋的稚子。其他人……他们往往没能过久的玷污你的声誉。"
 PODcanon_chars.15.a:0 "做得更好！"
 PODcanon_chars.15.b:0 "永不满足"
 PODcanon_chars.15.c:0 "你是一个毫无价值的失败者！"
 PODcanon_chars.hardestadt_tooltip:0 "只要这个角色一直是仇敌，你就不能再召来其。"
 POD_hardestadt_interaction:0 "绷紧缰绳"
 POD_hardestadt_interaction_desc:0 "召集你的子嗣进行谈话"
 podintroductions.117.t:0 "你的过往"
 podintroductions.117.desc:0 "安塔西亚女士，你在你于流放中在德意志的居所中坚强地站立着，但你的心却在为凯旋罗马而隐隐作痛。梵卓氏族已经从它在永恒元老院的高贵根基上跌落得很远，而你是唯一能阻止哈德施塔特和卡米拉把你心爱的氏族变成自己的玩物的人。\n虽然这一努力需要时间，但你最近在你的探索中发现了一个令人惊讶的盟友。诺斯费拉图族的安吉瓦是一个奇怪的人，喜欢着幻想故事，但他已经证明是一个值得信赖的朋友，更是一个值得你去争取的人。凭借你们的联合力量，真正理想的罗马仍有希望。"
 podintroductions.117.a:0 "元老院不会堕落"
 podintroductions.antasia:0 "作为茱莉亚·安塔西亚，只要你们保持朋友关系，你就可以获得与安吉瓦的专属角色互动。"
 POD_antasia_interaction:0 "友善交谈"
 POD_antasia_interaction_desc:0 "邀请安吉瓦进行一次愉快的交谈"
 PODcanon_chars.16.t:0 "说书人安吉瓦"
 PODcanon_chars.16.desc:0 "当你第一次见到他时，你希望安吉瓦能洞悉你的祖尊，梵卓本人。遗憾的是，事实并非如此，因为即使是像他这么老的家伙，也从未遇到过上古耆宿。尽管如此，该诺斯费拉图还是有很多关于该隐之子世界的故事，其中一些你甚至很难相信。\n不过安吉瓦并不介意，他只是很高兴与你分享它们。从这样一个古老而古怪的吸血鬼那里获得如此友好的、没有欺骗的洞察力，是一种祝福，你不打算破坏。"
 PODcanon_chars.16.a:0 "真的吗？太不可思议了！"
 PODcanon_chars.17.t:0 "自信者安吉瓦"
 PODcanon_chars.17.desc:0 "安吉瓦今晚很安静，似乎很乐意倾听你的烦恼。在该隐之子世界里，一个人能够向另一个人倾诉而不用担心被欺骗或操纵，这是很罕见的。但你对这个老诺斯费拉图感到放心，知道你们的目标是紧密一致的。对你来说，拥有这种奢侈的生活是不小的祝福，而且每次你和他在一起的时候，岁月沉眠似乎都不那么旖旎。"
 PODcanon_chars.17.a:0 "友谊是宝贵的财富"
 PODcanon_chars.18.t:0 "战士安吉瓦"
 PODcanon_chars.18.desc:0 "安吉瓦今晚很激动，谈到了他的氏族所面临的严重威胁：尼克图库。你以前也见过他这样，虽然你对他说的事情一无所知，但你更愿意幽默地对待他。甚至当他突然要求在你们之间进行决斗训练，以便「在他们来的时候做好准备」。你不是每天晚上都能和这样一位经验丰富的战士比试，你肯定能学到一些东西。"
 PODcanon_chars.18.a:0 "我们将做好准备"
 podintroductions.118.t:0 "你的过往"
 podintroductions.118.desc:0 "亚历山大大人，你曾经是世界上最重要的梵卓，对查理曼大帝本人耳提面命。现在，你被受诅的萨利安娜和你的叛徒子嗣杰弗里从你心爱的法兰西流放了。你会回来的，但有其他事情需要你的关注。\n约根·冯·费尔登大人，你现居处的东道主，已经召集了一支小部队来帮助你，履行他作为年轻同族的职责。接受它将是有帮助的，但也意味着你基本上沦为到为得帮助而乞求。拒绝它更符合你的地位……但无疑会激怒马格德堡的亲王。在这里做出正确的决定，这可能是你凯旋回到整个该隐之子世界的第一块垫脚石。"
 podintroductions.118.a:0 "感谢帮助，约根大人"
 podintroductions.118.b:0 "王不求人！"
 alexander_black_cross_event_troops:0 "黑十字血仆"
 alexander_help_modifier:0 "人脉通达"
 alexander_help_modifier_desc:0 "由于有一位强大的引路人的帮助，你在上层圈子中的好评不断。"
 podintroductions.119.t:0 "你的过往"
 podintroductions.119.desc:0 "约根大人，自从你被初拥以来，你的升迁一直在以惊人的速度进行着。但最近在对督军领的战争中遇到的小挫折，使您的影响力受到了削弱。不过，随着流亡的法兰西亲王亚历山大来到你的宫廷，一个新的机会出现了。\n到目前为止，你一直是个完美的东道主，继续这样做对你的野心有利，因为亚历山大在族中仍有很大的威望。但这位强大的梵卓并不是一个人来的，他还带来了伊斯灵顿的罗萨蒙，这位美之氏族中最美丽的人，也是偷走你心的人。\n你最近向这位女士表白了你的感情，但似乎亚历山大本人也看上了她。因此，必须做出选择……"
 podintroductions.119.a:0 "爱……"
 podintroductions.119.b:0 "或力量？"
 jurgen_love_tooltip:0 "罗萨蒙将加入你的宫廷，将她的地盘托管给你。"
 podintroductions.120.t:0 "你的过往"
 podintroductions.120.desc:0 "赞美伟大的卡米拉，罗马与梵卓氏族过往的无可争辩的主人！\n在该幸福的时代，所有的人都在你面前俯首称臣。该下地狱的迦太基在你的命令下被摧毁，一切都很完美，直到你陷入蛰眠。很显然，没有人能够继承你的衣钵，帝国也同你一共衰落。你最近于这个新世界苏醒过来，与你所知道的那个世界如此不同……但仍然充满了机会。\n重申你对你心爱的罗马的控制很容易，但现在更大的挑战在等着你。\n你是原罪永恒执政，你的未来只能是永生的荣耀和颓废的快乐。"
 podintroductions.120.a:0 "罗马永恒"
 podintroductions.camilla:0 "作为卡米拉，你在「主办欢会​」 活动期间有一项专属的、更有利的、更可能触发的事件。"
 POD_elysium_events.25.t:0 "像罗马人一样狂欢"
 POD_elysium_events.25.desc:0 "除了是最强大的梵卓之一和精明的政治动物之外，你还被称为所有该隐之子中最好的派对主持人。毕竟，你在罗马帝国时期开创了该整个概念，你完全知道该如何进行。\n血将流淌，而每人都会有一段美妙的时光，由于你的精心策划，使罗马伟大的如此一小部分将在今晚得以延续。"
 POD_elysium_events.25.option.a:0 "让我们开始狂欢吧！"
 anna_ambition_modifier:0 "燃烧的野心"
 anna_ambition_modifier_desc:0 "安娜将不惜一切代价来获得她与生俱来的权利。你可以帮助她或被她撇开，没有中间地带。"
 podintroductions.121.t:0 "你的过往"
 podintroductions.121.desc:0 "尊贵的女士，你来自最伟大的希腊血统，君士坦丁堡应属于你，即使成为吸血鬼也没有改变这个事实。你很好地适应了你的新状态，并在第四次十字军东征发生时迅速地攀升拜占庭阶级。随着米迦勒和幻梦的毁灭，以及拉丁吸血鬼的胜利，你的城市再次离你渐行渐远。\n然而，还没走投无路，因为拉丁人难以巩固他们的地位，这使你能够帮助继任者帝国尼西亚开始运作。在这个强大的权力基础上，你离实现你永恒的野心如此之近……\n继续前进吧，诸皇的女儿，达成你的天命！"
 podintroductions.121.a:0 "我的世界渴望之城……"
 podintroductions.anna:0 "要提升你的初始修正，你可以使用一个要求你守住君士坦丁堡的专属决议"
 anna_decision:0 "生于紫室"
 anna_decision_tooltip:1 "拉丁人的压迫必须被终结"
 anna_decision_desc:0 "君士坦丁堡必须是你的，这于此时比任何其他都重要。你将把它从受诅的拉丁勒森魃手中解放出来，然后开始你对这个世界上最伟大城市的永恒统治。"
 anna_decision_effect_tooltip:1 "你将达成你的野心。"
 anna_decision_confirm:0 "终于！"
 anna_ambition_fulfilled_modifier:0 "达成野心"
 anna_ambition_fulfilled_modifier_desc:0 "科穆宁现在是君士坦丁堡的永生和永恒的统治者。如它本该是。"
 podintroductions.122.t:0 "你的过往"
 podintroductions.122.desc:0 "阿娜佳女士，你简单的生活随着贝利撒留和谢巴赫的到来而陷入混乱。这两个吸血鬼对你很有好感，并教给你很多如何在黑夜社会中生存的知识……然后你的生活变得更加奇怪了，一个秘密的末日密教——「黑手」——宣布你是其应许的领导者。\n尽管发生了这些事情，但到目前为止你做得很好，亚美尼亚在你的统治下已经成为一个强大的要塞，吸引了这个密教的成员和来自拜占庭的难民。你的「养父母」 还在这里，在帮助稳定你的新国家方面提供了宝贵的帮助，但现在是时候把事情掌握在你自己手中了。\n你得到了最好的指导，许多人已经把你看作是世界上最重要的该隐之子之一，但你的故事是你自己的，只有你自己才能书写。"
 podintroductions.122.a:0 "我是我自己的该隐之子"
 podintroductions.anadja:0 "只要谢巴赫与贝利撒留还活着，你就可以通过决议要求进一步的辅导。"
 anadja_decision:0 "向最优秀者学习"
 anadja_decision_tooltip:1 "总有提高的空间。"
 anadja_decision_desc:0 "谢巴赫与贝利撒留一直乐于帮助你提升，尽管他们的课程有时会相当费力。"
 anadja_decision_effect_tooltip:1 "训练课程将开始"
 anadja_decision_confirm:0 "我准备好了。"
 anadja_custom_decision:0 "该决议将于你取有25军事、20外交和20密谋，又或谢巴赫与贝利撒留两者死去时不可用。"
 PODcanon_chars.19.t:0 "向最优秀者学习"
 PODcanon_chars.19.desc:0 "贝利撒留在凡生中曾经是一位伟大的将军，然后为君士坦丁堡的该隐之子的幻梦处理许多军事事务。从他身上可以学到很多东西。而谢巴赫则是一位间谍和大使专家，常常同时兼任，可以教你这些课题。你今晚要问他们什么？"
 PODcanon_chars.19.a:0 "告诉我更多关于军事战役的事，贝利撒留"
 PODcanon_chars.19.b:0 "外交是一项复杂的课题……"
 PODcanon_chars.19.c:0 "……也许跟密谋一样复杂"
 PODcanon_chars.19.d:0 "我改变主意了"
 shaky_secrets_modifier:0 "将泄的秘密"
 shaky_secrets_modifier_desc:0 "他们知道你在藏着什么，而他们想找出来。"
 shrouded_secrets_modifier:0 "虚藏的秘密"
 shrouded_secrets_modifier_desc:0 "你的秘密被一层稀薄的暗影所保护着。"
 darkened_secrets_modifier:0 "黑暗中的秘密"
 darkened_secrets_modifier_desc:0 "他们完全不晓得你。也将没有人能会。"
 secrets_secrets_modifier:0 "秘密中的秘密"
 secrets_secrets_modifier_desc:0 "棋盘上的棋子，经由你的手操纵。"
 podintroductions.123.t:0 "你的过往"
 podintroductions.123.desc:0 "Sultan Badr, you have assumed control of the Midnight Crescent and the cornered Ashirra are wisely rallying behind you. Take notice of those that don't, for later punishment.\nYou must respect the Christian Shadow Reconquista, as both de Ruiz and his lineage are formidable opponents, but your most pressing matter is one of secrecy.\nYou are hiding many things from your new 'loyal' followers, things that you don't want them to find despite their insistence. Use your mastery of shadows and intrigue to hide yourself behind an impenetrable veil of mystery before it's too late. Only then will you be able to root the Christians out of Iberia."
 podintroductions.123.a:0 "真理由我塑造"
 podintroductions.badr:0 "到1300年之前，你可以使用一项专属决议，来提升你的初始修正。"
 badr_decision:0 "拜德尔的秘法"
 badr_decision_tooltip:1 "他们决不能知道。"
 badr_decision_desc:0 "作为午夜新月的新统治者，所有的目光都投向了你。你必须在为时已晚之前好好隐藏自己。"
 badr_decision_decision_effect_tooltip:1 "辛秘深藏。"
 badr_decision_confirm:0 "他们决不会知道。"
 podintroductions.124.t:0 "你的过往"
 podintroductions.124.desc:0 "Pious Suleiman, times are hard for the Faithful Ashirra. The despicable Christian Lasombra have declared war on your people, plunging Iberia and the Maghreb into disarray. But there is trouble closer to home as well. Your once friend Khalid is rallying troops in Mesopotomia after a violent disagreement with you about interfering, or not, in mortals affairs. Your own childe, Haroun el-La'il, has also made a bid for independence after his heretical dogma has been revealed.\nYou must act Suleiman. The Ashirra need unity now more than ever and perhaps concessions need to be made to achieve this goal. Though an hardline stance is also a possibility..."
 podintroductions.124.a:0 "绝不妥协"
 podintroductions.124.b:0 "哈立德，我们有更大的威胁得对付！"
 podintroductions.124.c:0 "哈罗恩，我们可以多谈谈你的理论……"
 podintroductions.125.t:0 "你的过往"
 podintroductions.125.desc:0 "Fearless Lucita, after being trapped in the mortal world for being a woman, you are now trapped in the undead one for being a Lasombra. This can't continue. You are a free spirit, yearning for independence, and you won't wait for the centuries needed to become an elder to achieve it.\nYour first target should be your own sire, Ambrosio Luis Moncada, a fool who thinks that he can control you. Then clan Lasombra itself must understand that you aren't their 'rising star', you are your own woman and these decrepit idiots will learn to respect you.\nThe chaos that is an Iberia engulfed in your clan's civil war will be the perfect opportunity for you to stake your own claim to greatness. You just have to exploit it well."
 podintroductions.125.a:0 "不自由毋宁死"
 podintroductions.lucita:0 "作为露西塔，你可以通过达成你的专属决议，来提高你的起始修正"
 caged_lucita_modifier:0 "受困的露西塔"
 caged_lucita_modifier_desc:0 "你还不是你自己故事的主人公，这让你愤怒不已。"
 unleashed_lucita_modifier:0 "受释的露西塔"
 unleashed_lucita_modifier_desc:0 "你自己的故事终于开始了。这将是光荣的。"
 lucita_decision:0 "露西塔的宿命"
 lucita_decision_tooltip:1 "时候到了"
 lucita_decision_desc:0 "你得先处理好困住你的最后一道枷锁。随后，将是反击时刻。"
 lucita_decision_decision_effect_tooltip:1 "这终于发生了！"
 lucita_decision_confirm:0 "终于，自由了！"
 lucita_custom_decision:0 "安布罗西奥·路易斯·蒙卡达必须死"
 good_moncada_modifier:0 "完美世界"
 good_moncada_modifier_desc:0 "无论她是爱你还是恨你，露西塔都活着。你的世界是完美和谐的。"
 podintroductions.126.t:0 "你的过往"
 podintroductions.126.desc:0 "Pious Moncada, Iberia is in turmoil and God has called upon you to save it. Your sire, Sylvester de Ruiz, officially leads the Christian effort but you are the real power behind the throne. For now he is useful, but you might want to step into the light at one point.\nAnd then, there is Lucita... an angel sent by God to guide you no doubt, even if she doesn't realize it. Since her Embrace, you have been the best you ever been, sharper, quicker, stronger. She will learn to appreciate you in time but until then, you need to make sure that she stays safe. You can't even stomach what would become of your poor soul if something happened to her..."
 podintroductions.126.a:0 "上帝赐予了我最棒的礼物"
 podintroductions.moncada:0 "作为蒙卡达，只要露西塔还活着，你就能享受这个修正。但如果她死了……"
 PODcanon_chars.20.t:0 "你的世界的末日"
 PODcanon_chars.20.desc:0 "她死了。\n露西塔，你的引路天使，死了。\n你已经失去希望了。这个世界可能也失去希望了，因为这显然证明上帝已经放弃了牠最忠实的仆人。你还能继续这种可悲的亡生吗？即使尝试又有什么意义呢？……也许，也许这是一项考验，就像上帝以前所做的那么多次。如果是这样，这将是你整个亡生中最艰难的一次。\n也许你会忍耐，但你甚至不确定你是否愿意。"
 PODcanon_chars.20.a:0 "她走了……"
 bad_moncada_modifier:0 "破碎世界"
 bad_moncada_modifier_desc:0 "露西塔已经死了。你现在是一个没有灵魂的躯壳，继续着毫无意义的亡生。"
 podintroductions.127.t:0 "你的过往"
 podintroductions.127.desc:0 "Prince Alfonzo, after centuries of waiting, Constantinople is finally yours. Be careful though, those cowardly Greek vampires fled when you expertly used the 4th Crusade to your advantage and are now rallying their troops and agents against you. You have wisely bend the knee to the See of Shadows to get their protection as you consolidate your rule. A temporary process of course, as you have greater ambitions than staying a mere vassal.\nYou care little for your 'faith' in the Cainite Heresy and would change it in a heartbeat if it was needed, though there might still be opportunities to have by clinging to it.\nExpand the Latin rule and get rid of Byzantine's remnants as soon as possible. Your ascension is only beginning!"
 podintroductions.127.a:0 "新的胜利即将来临"
 podintroductions.alfonzo:0 "作为阿方索，你是唯一一个可以通过专属决议创建拉丁帝国的人。"
 alfonzo_decision:0 "拉丁之治"
 alfonzo_decision_tooltip:1 "是时候处理残余了"
 alfonzo_decision_desc:0 "你是拉丁人战胜希腊人的象征。接纳并利用这一形象为自己打造一个新的帝国。"
 alfonzo_decision_confirm:0 "拜占庭亡了"
 bad_gratiano_modifier:0 "新贵"
 bad_gratiano_modifier_desc:0 "你是勒森魃家族的不受宠子嗣。这没带来任何帮助！"
 podintroductions.128.t:0 "你的过往"
 podintroductions.128.desc:0 "Lord Gratiano, the powerful Lasombra himself saw your greatness and Embraced you into his clan. This act enraged your new 'brethren' and you have been branded as an upstart since then, denied the numerous responsibilities and titles that should be yours. You have to start from scratch.\nFor that purpose, you choose Verona, a city you know well since your mortals days, and the foothold has been made but... nothing has changed yet. They still laugh at you, insult you behind your back, plot your demise even! This must stop.\nYou will show them why Lasombra choose you. You will show them that Gratiano de Veronese was born to rule!"
 podintroductions.128.a:0 "他们会明白……"
 podintroductions.gratiano:0 "要摆脱葛莱西安诺的初始修正，你必须完成一项专属决议。"
 gratiano_decision:0 "天生的统治者"
 gratiano_decision_tooltip:1 "他们会学会的。"
 gratiano_decision_desc:0 "向勒森魃氏族证明，你不仅仅是爸爸的新宠。取得一些他们必须注重的成就。"
 gratiano_decision_confirm:0 "他们已然学会"
 podintroductions.129.t:0 "你的过往"
 podintroductions.129.desc:0 "Lord Sejanus, after your fateful Embrace, you drifted for quite a long time in Europe looking for a place to start your Empire of the Night. Your current location is promising, if perhaps a little too close to the powerful Hardestadt. You will have to deal with him.\nYou easily secured Princedom over this area because you received some very unexpected help. One strange English Tzimisce named Jack has been awed by you and your dreams and eagerly pledged himself to your service. After a brief inquiry, you think he is trustworthy and actually quite capable for such a young vampire.\nFinding a lesser recognizing your greatness is always gratifying, perhaps you could reward him with an important role on your burgeoning realm?"
 podintroductions.129.a:0 "我可以利用你"
 podintroductions.129.b:0 "我不需要任何帮助！"
 podintroductions.130.t:0 "你的过往"
 podintroductions.130.desc:0 "Lady Salianna, your coup against Alexander was a great success and you now finally control most of France. You had to make some concessions to make it happen though, most notably with Alexander's childe, Geoffrey du Temple, who got Paris itself as his reward. If you are to truly strengthen your hold on the country, you will need the prestigious capital in your hands.\nGeoffrey is young and gullible but has many friends who could be trouble. You will have to tread carefully in order to outsmart him without unnecessary bloodshed."
 podintroductions.130.a:0 "是时候反思一下我们的关系了"
 salianna_intro_tooltip:0 "在接下来的日子里，你会引发一些考虑你与杰弗里的关系的事件。"
 PODcanon_chars.21.t:0 "战胜杰弗里"
 PODcanon_chars.21.desc:0 "要开始实施你取得巴黎的密谋，你必须孤立杰弗里。他的派员和人脉网络并不强大，但身为一位梵卓，对你的一些臣民来说，他是一个比你更「合法」的法兰西统治者。通过一些贿赂和隐晦的威胁，你可以改变这种状况。显然，他们会很容易理解，你会成为一个比一些愚蠢的军阀更好的巴黎亲王。"
 PODcanon_chars.21.a:0 "小菜一碟"
 PODcanon_chars.21.b:0 "我会让杰弗里留着他的战利品"
 salianna_exit_tooltip:0 "你放弃了为你自己取得巴黎的计划"
 PODcanon_chars.22.t:0 "剪除杰弗里的羽翼"
 PODcanon_chars.22.desc:0 "你很容易就摆脱了大部分杰弗里的试探性支持者，除了剩下两个人。安茹女王伊思妲·德·布莱斯已经表明了她的反对意见，但是……反正她已经厌恶你了，所以谁在乎呢？\n更麻烦的是顽固的弗朗索瓦·德阿伦库。这位有权有势的里昂亲王已经承诺为杰弗里的事业效力，永不变节。如果你继续你的行动路线，你将面对一个新的强大敌人。"
 PODcanon_chars.22.a:0 "或多或少……"
 PODcanon_chars.22.b:0 "我会让杰弗里留着他的战利品"
 PODcanon_chars.23.t:0 "巴黎，我回来了"
 PODcanon_chars.23.desc:0 "你已经完成了准备工作，现在准备以破竹之势将杰弗里驱出巴黎。这座城市将成为你的爱之皇廷的强大首都，并确保妥芮朵在法兰西的优势地位世代相传。\n最后要解决的问题是杰弗里本人。没有了巴黎，他基本上就没有爪牙了，如果你认为他没有更多的用处，你可以把他扔到一边。或者你可以把他留在手边，以便在将来执行另一项任务。在任何情况下，他显然对此事没有发言权。"
 PODcanon_chars.23.a:0 "我将在胜利中获得恩典"
 PODcanon_chars.23.b:0 "娇气的血侍对我没用"
 podintroductions.131.t:0 "你的过往"
 podintroductions.131.desc:0 "Lady Isouda, during the chaos of Alexander's fall, you were beaten to the finish line for leadership of the Courts of Love by Salianna. This has not to be the end of your career though. Your hold on Anjou is still strong, and Salianna is vulnerable as long as her power isn't consolidated.\nYou will have need of help for the future battles, be they political or military. Fortunately, you have a strong handle on how to 'educate' your childer and to get rid of the useless weak ones. Use this to your advantage, and France might finally be yours."
 podintroductions.131.a:0 "战争还没有结束"
 isouda_intro_tooltip:0 "作为伊思妲，你在教育子嗣方面有一种更有回报，但有风险的专属可能性。"
 POD_education_events.1.option.e:0 "让我们看看其是否在我的宫廷里幸存下来……"
 POD_education_events.1.option.isouda:0 "作为伊思妲，你可以把你的子嗣放在无情的角斗场，或者说你的宫廷上。他们将从中变得更加强大……如果他们能活下来的话。"
 POD_education_events.26.t:0 "教育：可用的子嗣"
 POD_education_events.26.desc:0 "试炼已经结束，看起来这位还算是有用。嗯，勉强还不错吧，但说实话，你有一点点失望。也许你下次应加点料，让其在你无情的宫廷里蠕动求生的时候获得更多挑战，而看起来更有乐趣？嘛，改夜再想吧。"
 POD_education_events.26.option.a:0 "干得不错我猜"
 POD_education_events.27.t:0 "教育：无用的子嗣"
 POD_education_events.27.desc:0 "试炼已经结束，嗯，而这位没能度过。哦，好吧，反正还有很多凡人可以试炼。至少在中途完结之前，其看起来都很有趣。目睹无助的稚子陷入你的宫廷的阴谋网中，总是给你一种深深的满足感。"
 POD_education_events.27.option.a:0 "真的是最好的娱乐"
 podintroductions.132.t:0 "你的过往"
 podintroductions.132.desc:0 "埃斯克拉蒙德女士，你是公认的自阿尔比派十字军开始以来的奥克人抵抗法兰西的领袖……虽然你对奥克西塔尼亚本身并不那么关心，不过这也是个有用的针对公众视线的伪装。\n由于你的一种独特能力，该障眼法更上一层。通过以你过世的尊长告诉你的方式使用 威仪术，你能够使任何男人迷失在一个他是骑士而你是公主的童话故事中。显然，从此，这位善良的公主可以指挥她勇敢的骑士杀死「怪物」，以保护她……"
 podintroductions.132.a:0 "我们每人都扮演着一位角色"
 esclarmonde_intro_tooltip:0 "作为埃斯克拉蒙德，你有一项可对你国度内的男人使用的专属角色互动，该允许你魅惑他们。这将需要花费虔诚。"
 POD_esclarmonde_interaction:0 "埃斯克拉蒙德的童话魔咒"
 POD_esclarmonde_interaction_desc:0 "勇敢的骑士，请在我需要的时候帮助我吧！"
 faydit_modifier:0 "埃斯克拉蒙德的童话魔咒"
 faydit_modifier_desc:0 "这个可怜的灵魂迷失在幻觉中，以为自己是美丽的埃斯克拉蒙德公主的骑士。"
 podintroductions.133.t:0 "你的过往"
 podintroductions.133.desc:0 "Fearless Melinda, your sire, Helena, abandoned you after getting bored of tormenting you. You are now left to fend for yourself but your have learned one important thing from your time under Helena's 'tutelage' : it's you against them.\nThose that will kiss your feet and prove useful might live. The others... you will have so much fun dealing with the others.\nIf this world has to be plunged into eternal horror for you to be powerful, respected and independent, then so be it.\nYou will reign in Hell, and damn the Heavens."
 podintroductions.133.a:0 "我想我现在明白了，「母亲」"
 melinda_intro_tooltip:0 "作为梅琳达·加尔布雷思，你有一项专属决议，只要你的首都还没有完全毁掉，你就可以蹂躏你的首都，获得一些快速的回报。"
 melinda_decision:0 "暴动！"
 melinda_decision_tooltip:1 "是时候发泄一下了"
 melinda_decision_desc:0 "在你的首都有许多无助的凡人。现在可能是时候让他们知道，末日的到来比他们想象的要快……"
 melinda_decision_confirm:0 "……而地狱紧随她后"
 podintroductions.134.t:0 "你的过往"
 podintroductions.134.desc:0 "Cunning Rafael, let's be honest, you have no idea of what the hell is going on. You barely saved your unlife by tricking your sire into thinking that you are an artist of schemes and mischief but you still have no real clue on how this whole vampire society works.\nFrom the few things you have gathered, it would be best for you to learn very fast, because clueless vampires make for dead vampires most of the time. You have only one advantage to speak of, your wits. You are capable of convincing almost anyone to go along with almost anything. This might be your lifeline..."
 podintroductions.134.a:0 "我能做到！"
 rafael_intro_tooltip:0 "作为拉斐尔，你有一项花费声望来欺骗其他有地统治者给你一些东西的专属角色互动。具体回报取决于他们的特质。"
 POD_rafael_interaction:0 "我的超值提议！"
 POD_rafael_interaction_desc:0 "向这位统治者提出一个非同寻常的提议"
 PODcanon_chars.24.t:0 "诱人的骗局"
 PODcanon_chars.24.desc:0 "拉斐尔，你的完美推销让这个人着迷了。现在是时候去收割了，你想要什么？它将取决于你所处的角度。"
 PODcanon_chars.24.a:0 "你可以相信我！"
 rafael_trusting_tooltip:0 "这个选项可用是因为你的目标拥有轻信他人或合群特质。"
 PODcanon_chars.24.b:0 "……然后我的尊长就抛弃了我！"
 rafael_compassionate_tooltip:0 "这个选项可用是因为你的目标拥有慈悲特质。"
 PODcanon_chars.24.c:0 "这很吸引人，我肯定会皈依的！"
 rafael_zealous_tooltip:0 "这个选项可用是因为你的目标拥有狂热特质。"
 PODcanon_chars.24.d:0 "有意思的东西，让我记个笔记！"
 rafael_diligent_tooltip:0 "这个选项可用是因为你的目标拥有勤勉或耐心特质。"
 PODcanon_chars.24.e:0 "该死的，我从来没敢这么做！"
 rafael_brave_tooltip:0 "这个选项可用是因为你的目标拥有勇敢或固执特质。"
 PODcanon_chars.24.f:0 "你简直是最棒的！"
 rafael_ambitious_tooltip:0 "这个选项可用是因为你的目标拥有野心勃勃或傲慢特质。"
 PODcanon_chars.24.g:0 "亡生很棒！"
 rafael_content_tooltip:0 "这个选项可用是因为你的目标拥有安于现状或谦卑特质。"
 PODcanon_chars.24.h:0 "他们绝对是来抓我们的！"
 rafael_deceitful_tooltip:0 "这个选项可用是因为你的目标拥有狡诈或多疑特质。"
 PODcanon_chars.24.i:0 "……这很形象"
 rafael_cynical_tooltip:0 "这个选项可用是因为你的目标拥有愤世嫉俗或冷酷特质。"
 PODcanon_chars.24.j:0 "说的不错！"
 rafael_end_tooltip:0 "你没有更多角度来进逼该目标！"
 podintroductions.135.t:0 "你的过往"
 podintroductions.135.desc:0 "Fair Rosamund, here you are in Magdeburg almost abducted by the exiled Methuselah Alexander. The once ruler of France says that he loves you, but you know that his cold heart will one night be angered enough to destroy you as he did with his previous 'soulmates'. You need allies.\nAnd who better than the bold Jurgen von Verden? You have known him for a while now, and you both are very fond of each other. But your love won't be able to truly grow, even if you married him, until Alexander is dealt with once and for all. You have been taught well, and you are no helpless damsel Rosamund, you know what to do."
 podintroductions.135.a:0 "爱战胜一切"
 rosamund_intro_tooltip:0 "作为罗萨蒙，只要你和约根仍然是灵魂伴侣，你就有一个专属决议可以使用。"
 love_triumph_modifier:0 "爱的胜利"
 love_triumph_modifier_desc:0 "……他们从此就幸福地生活在了一起。大概。"
 rosamund_decision:0 "三角恋"
 rosamund_decision_tooltip:1 "是时候简化你的爱情生活了"
 rosamund_decision_desc:0 "亚历山大是一个压迫性的控制狂，随时都可能在愤怒中杀死你。你得对付他。"
 rosamund_decision_confirm:0 "圆满的结局"
 rosamund_custom_decision:0 "亚历山大必须死"
 rosamund_custom_decisionb:0 "你必须得是约根·冯·费尔登的灵魂伴侣"
 podintroductions.136.t:0 "你的过往"
 podintroductions.136.desc:0 "Wise Karl, your initiative for preserving the old ways has so far been a success. The Free State is still young, but grows more assured every night... but trouble are on the horizon.\nYour two main allies, Eirik Longtooth and Ulfsdottir, have reached a breaking point and are at each other's throat. Eirik is a powerful warrior but his utter lack of care for the mortals upsets the Valkyrie. In return, Ulfsdottir's quiet acceptance of the slow end of your ways enrages Longtooth.\nIf you want the Free State to endure, you need to choose a side... and probably deal with the one that will feel wronged."
 podintroductions.136.a:0 "你是个怪物，埃里克，必须得有人阻止你"
 podintroductions.136.b:0 "我们必须为了大业而战，乌尔夫斯多蒂尔！"
 podintroductions.136.c:0 "你们都是蠢货！"
 podintroductions.137.t:0 "你的过往"
 podintroductions.137.desc:0 "Powerful Bjorn, you are once again dragged into a losing war. As you were sailing for Vinland, you were shipwrecked in Scotland and are the only survivor of your initial crew. The local vampires, mostly refugees from Mithras' iron grip on the isles, were very welcoming, so much that you feel indebted to them.\nAnd you are not the kind of man of leaving a friend behind so here you are, leading the war effort against Mithras' inevitable attack on this land. You will need a new crew for such a daunting task and only the best and most loyal will do."
 podintroductions.137.a:0 "新地方，老麻烦"
 bjorn_intro_tooltip:0 "作为比约恩，你有着可以让某人成为你的队友的专属角色互动。\n你最多只能有5个无地的吸血鬼作为队友，而且他们需要对你有好感才会接受。"
 bjorn_crew_modifier:0 "比约恩的队友"
 bjorn_crew_modifier_desc:0 "比约恩·加里森的队伍的成员，一个留给训练有素的战士的位置"
 POD_bjorn_crew_opinion:0 "比约恩的队友"
 POD_bjorn_interaction:0 "邀请加入你的队伍"
 POD_bjorn_interaction_desc:0 "该角色将成为你的5个队友之一"
 POD_bjorn_crew_interaction_limit:0 "该角色必须对你好感为正，而且你不能有超过5个队友"
 POD_bjorn_opinion_limit:0 "该角色必须对你好感为正"
 podintroductions.138.t:0 "你的过往"
 podintroductions.138.desc:0 "Fearless Robin, the future of your rebellion looks dire. The hated tyrant, Mithras, has won the latest pitched battle between you two several years ago, severely reducing your influence over the British Isles. Still there is hope, as he has not yet gone for the kill, perhaps busy with other matters or simply bored as very old vampires like him tend to be. This might be your chance.\nPrepare quickly in case of another attack, plant the seed of rebellion in those who are willing to listen and take down Mithras once and for all. Only then will the British Isles be truly free."
 podintroductions.138.a:0 "我被逼到了墙角，但我还没有被击败"
 leeland_intro_tooltip:0 "作为罗宾，你有一项在年轻吸血鬼中播下叛变的种子的专属角色互动，给其他国度造成混乱。"
 seed_of_rebellion_leeland_modifier:0 "叛变之种"
 seed_of_rebellion_leeland_modifier_desc:0 "这个角色已经被一个传奇的不法之徒推到了叛变的边缘"
 POD_leeland_interaction:0 "叛变之种"
 POD_leeland_interaction_desc:0 "在该年轻吸血鬼心智中播下叛变的种子"
 podintroductions.139.t:0 "你的过往"
 podintroductions.139.desc:0 "Lady Veronique, you are back in your home city after your Parisian adventure. You helped in the coup against Alexander, the tyrannical Prince of France, and gained some recognition in the process. Sadly, you also lost many trusted retainers to the deceitful Jean Baptiste de Montrond. You might have to 'repay' him one night.\nBeyond this burgeoning rivalry, your position is mostly secure. You are already hard at work rebuilding your entourage of mortals friends, an oddity among Cainites, but one that gives you strength. Use your trust in humanity to your advantage and those that underestimate you will soon learn that you can be as skilled in any field of expertise as they are."
 podintroductions.139.a:0 "我会以自己的方式参与他们的棋局"
 veronique_intro_tooltip:0 "作为维罗妮克，只要你还具有人性之道信仰，你在「巡视首都​」活动中就有着专属事件。"
 POD_survey_events.150.t:0 "巡视：维罗妮克的伴随者"
 POD_survey_events.150.desc:0 "你是少数几位真正会与凡人培养一些关系的该隐之子之一，而不是只把他们当作牲口或更大棋局中的棋子。因此，你在城里实际上有一些朋友，愿意在许多不同的事情上帮助你。就像所有的人脉一样，你必须不时地拜访他们，处理他们可能遇到的任何相关麻烦，但你总是发现这是一些有意义的经历。凡人对不断变化的世界的适应性比任何该隐之子所想象的要强得多。"
 POD_survey_events.150.option.a:0 "很高兴再次见到你！"
 veronique_survey_tooltip:0 "只要维罗妮克坚持人性之道信仰，这种专属巡视结果就会一直发生在她身上。"
 podintroductions.140.t:0 "你的过往"
 podintroductions.140.desc:0 "Great Menele of Sparta, you have chased the traitorous Helena for centuries now and there seems to be no end to this conflict. She obviously needs to be punished for having engineered your beloved Carthage's destruction but you also mourn for the decline of your clan. You could do a lot to help it recover... if you weren't so preoccupied with the hunt for your nemesis.\nYour legendary rivalry must end one way or another, then it might still be time to heal your broken clan."
 podintroductions.140.a:0 "终结永恒恩怨……"
 menele_intro_tooltip:0 "作为墨涅拉俄斯，你有一项专属决议，需要你先解决海伦这麻烦。如果你达成了它，你就可以解锁一个角色互动，能让其他布鲁赫了解你氏族的光辉。"
 menele_decision:0 "斯巴达对特洛伊"
 menele_decision_desc:0 "海伦已经占据了你过多的时间。处理掉她，之后还有更重要的事需要你关注。"
 menele_decision_confirm:0 "终于！"
 menele_decision_tooltip:0 "海伦必须死，或者不再是你的敌人"
 menele_decision_effect_tooltip:0 "你将可以解锁一个让其他布鲁赫了解你氏族的光辉的角色互动"
 PODcanon_chars.25.t:0 "新的开始"
 PODcanon_chars.25.desc:0 "Finally, this unpleasant business with Helena is behind you. It has taken a long time, but you finally realized that her greatest betrayal wasn't helping the Romans against Carthage, but was in fact keeping you distracted at the moment your clan needed you the most.\nThe Brujah lie scattered, overwhelmed by anger and sorrow, a pale reflection of their glorious ancient nights. It doesn't have to be the only way forward. You are a legend Menele, and even the most stubborn member of your clan will listen if you talk. You have to be the guiding light for them going forwards, for no one else can."
 PODcanon_chars.25.a:0 "我们是迦太基的遗裔"
 menele_victory_tooltip:0 "你将可以解锁一个让其他布鲁赫了解你氏族的光辉的新角色互动"
 POD_menele_teachings_interaction:0 "迦太基的教诲"
 POD_menele_teachings_interaction_desc:0 "让其他布鲁赫记起他们的光荣历史和光明的未来。"
 PODcanon_chars.26.t:0 "课程"
 PODcanon_chars.26.desc:0 "作为仍活跃在这些夜的最受尊敬的布鲁赫，你有足够的影响力让你的氏族的任何成员坐下来听你说话，只要你用心去做。\n在准备工作完成后，你只需要考虑你到底要教这个人什么。如果说与海伦的冲突教会了你什么，那就是你没有足够的时间浪费在一个人身上。"
 PODcanon_chars.26.a:0 "掌控你的心兽只有一种办法"
 PODcanon_chars.26.b:0 "让我们谈谈迦太基"
 PODcanon_chars.26.c:0 "自控是关键"
 ANTI_HEDEON_PACT:0 "反海德翁协定"
 podintroductions.141.t:0 "你的过往"
 podintroductions.141.desc:0 "Lord Yitzhak, you have recently managed to considerably expand your influence over Poland thanks to Prince Razkoljna's troubles with a Ventrue incursion. But you aren't the only one to profit from this event. Hedeon Yaroslavich, a vicious monster even for his already quite sadistic clan, has also made his domain grow quite considerably. His dark shadow now looms ever closer to engulfing Poland.\nThere might be a way out. You don't trust Razkoljna, but you know she is a far lesser evil than Hedeon, and she probably feels the same way about you. Negotiating a truce between you two could allow you both to focus on Hedeon first. After that obviously, all bets are off..."
 podintroductions.141.a:0 "拉兹科利纳亲王，让我谈谈"
 podintroductions.141.b:0 "她不比海德翁好多少！"
 podintroductions.142.t:0 "你的过往"
 podintroductions.142.desc:0 "Lord Hektor, New Lacadaemonia is secure thanks to your strong leadership. The crumbling Byzantine Empire all around your domain might even present opportunities for expansion if you so desire. Though there are also troubles at home to deal with.\nYou rule with the advise of a Senate, in the Carthaginian tradition, but this august institution stands divided. Most senators want you to follow the path of an idealized and pure Carthage. A growing minority wants a more pragmatic approach, with including the most unsavory elements of ancient Carthage. Your support for one or the other faction will pave the way for your realm's focus in the coming years."
 podintroductions.142.a:0 "大会开始！"
 hektor_intro_tooltip:0 "作为赫克托，你有一项专属决定，那就是召集参议院并选择你未来几年的重心。\n如果安条克和莫林这两位党派领导人还活着，你可以选择一个更强大的重心。"
 hektor_decision:0 "参议院大会"
 hektor_decision_tooltip:1 "我需要参议院的建议"
 hektor_decision_desc:0 "在即将到来的参议院任期内，你会偏向哪一党派？"
 hektor_decision_confirm:0 "开会时请保持秩序！"
 hektor_decision_effect_tooltip:0 "你将选择未来几年的政策。"
 PODcanon_chars.27.t:0 "参议院"
 PODcanon_chars.27.desc:0 "赫克托，你的新生迦太基参议院的这次新大会和以往一样。理想主义者斥责你「 背叛」了他们亲爱的乌托邦，而实用主义者则敦促你想想为什么迦太基曾如此强大，且不计代价。值得庆幸的是，最后的决定权只属于你。"
 PODcanon_chars.27.a:0 "为理想而战！"
 PODcanon_chars.27.b:0 "迦太基是首要且主要的理想。"
 PODcanon_chars.27.c:0 "两者间持平是唯一的途径。"
 PODcanon_chars.27.d:0 "必须做出牺牲！"
 PODcanon_chars.27.e:0 "狼群已在我等门外！"
 antiochus_alive_tooltip:0 "这个选项可用是因为安条克还活着。"
 maureen_alive_tooltip:0 "这个选项可用是因为莫林还活着。"
 full_idealist_support_modifier:0 "彻底支持理想主义"
 full_idealist_support_modifier_desc:0 "迦太基是一个纯粹而完美的乌托邦。没有人可以反驳这个事实。"
 idealist_support_modifier:0 "支持理想主义"
 idealist_support_modifier_desc:0 "迦太基是一个值得为之斗争的理想，尽管它可能有任何缺陷。"
 pragmatist_support_modifier:0 "支持实用主义"
 pragmatist_support_modifier_desc:0 "我们并不生活在梦中。必须得有牺牲。"
 full_pragmatist_support_modifier:0 "彻底支持实用主义"
 full_pragmatist_support_modifier_desc:0 "如果没有它的梦魇，迦太基的幻梦就一无是处。"
 podintroductions.143.t:0 "你的过往"
 podintroductions.143.desc:0 "Lady Ecaterina, you have so far been able to grow your influence in the region in no small part thanks to your very talented childe, Christof Romuald. Sadly your reckless offspring has gone missing after what seems to be a brutal battle in Vysehrad castle. The madman tried to storm the fortress on his own by hacking and slashing all the Tzimisce horrors guarding it!\nStill, Christof will be Christof and you know that, properly guided, he can be very useful. You could organize a search party in the ruins of Vysehrad to find him and bring him back to you. Or maybe his usefulness has run its course?"
 podintroductions.143.a:0 "我又有一项任务要给你，克里斯托夫"
 podintroductions.143.b:0 "他那由阴谋组成防护似乎已经持续不了多久了"
 podintroductions.144.t:0 "你的过往"
 podintroductions.144.desc:0 "Lord Augutus, you have been quick to seize upon the opportunities given to you by the Embrace. Your family's mercantile (and necromantic) empire is growing and these indolent Cappadocians don't expect a thing. Still, you are only one man and you must first focus your efforts on finally wrestling control of Venice itself.\nFor the other matters, you can rely on your three lieutenants, Claudius, Ambrogino and Ignazio. Each has his own specific strong suit and all of them want your approval. If you play your cards right, you can keep them useful and busy squabbling among each other (and not scheming against you) for a long time."
 podintroductions.144.a:0 "Our ascension begins"
 augustus_intro_tooltip:0 "As Augustus, you have a special decision where you can favor one of your lieutenants more than the others, as long as they are alive of course."
 augustus_decision:0 "你的右手"
 augustus_decision_tooltip:1 "Bickering but useful children"
 augustus_decision_desc:0 "Which lieutenant will you favor for the upcoming years?"
 augustus_decision_confirm:0 "让我想想……"
 augustus_decision_effect_tooltip:0 "You will choose which lieutenant to favor for the coming years."
 augustus_custom_decision:0 "At least one of Claudius, Ignazio and Ambrogino must be alive"
 claudius_support_modifier:0 "克劳狄乌斯的支持"
 claudius_support_modifier_desc:0 "Claudius is a scheming and conniving bastard. But he is your scheming and conniving bastard."
 ignazio_support_modifier:0 "伊尼亚齐奥的支持"
 ignazio_support_modifier_desc:0 "Ignazio isn't the brightest Giovanni by far, but his strong sword arm is very useful."
 ambrogino_support_modifier:0 "安布罗吉奥的支持"
 ambrogino_support_modifier_desc:0 "Ambrogino is too ambitious for his own good. Better keep him close and satisfied."
 PODcanon_chars.28.t:0 "副手"
 PODcanon_chars.28.desc:0 "As the Patriarch of the family, your favor is a precious resource in itself. Your three main agents are always looking to please you and outdo their competitors. This little game has also the benefit of keeping them divided and busy scheming among themselves and not against you. A win-win really.\nIn the end though, the choice of who to trust and who to spurn is yours alone."
 PODcanon_chars.28.a:0 "克劳狄乌斯是我最宠爱的儿子。"
 PODcanon_chars.28.b:0 "安布罗吉奥是我们间最棒的。"
 PODcanon_chars.28.c:0 "伊尼亚齐奥的简易方法很有用。"
 PODcanon_chars.28.d:0 "这次没人赢得我的青睐"
 claudius_alive_tooltip:0 "这个选项可用是因为克劳狄乌斯还活着。"
 ambrogino_alive_tooltip:0 "这个选项可用是因为安布罗吉奥还活着。"
 ignazio_alive_tooltip:0 "这个选项可用是因为伊尼亚齐奥还活着。"
 podintroductions.145.t:0 "你的过往"
 podintroductions.145.desc:0 "Lord Ambrogino, you are destined for greatness. Despite being a mere bastard of the Giovanni family, you have already achieved much and know more about your new vampiric condition than the rest of the family, Augustus included. Still this is merely the beginning, as your head is spinning with the possibilities in front of you.\nYou need more occult texts, more lost prophecies, more cryptic parchments. There is a truth to be found somewhere and this truth can lead to Godhood, you are sure of it. The journey will be long but the reward... the reward will be your wildest dream, no your destiny!, coming true."
 podintroductions.145.a:0 "I will find the key"
 ambrogino_intro_tooltip:0 "As Ambrogino, you have a special option if you achieve the 'Sargon Codex' decision."
 ambrogino_sargon_codex_modifier:0 "安布罗吉奥的宿命"
 ambrogino_sargon_codex_modifier_desc:0 "The Sargon Codex showed you so much more than you ever imagined! Godhood is closer than ever..."
 pod1230objectives.49.c:0 "I know how to handle it..."
 sargon_ambrogino_tooltip:0 "这个选项只对安布罗吉奥·乔凡尼可用"
 podintroductions.146.t:0 "你的过往"
 podintroductions.146.desc:0 "Lord Claudius, that conniving, scheming bastard Ambrogino has gone too far this time. You have long groomed your own great-great-granddaughter, Lucretia, for a prestigious position as one of your childer but that greedy thief somehow convinced your own father Augustus to gift Lucretia to him! This is the last straw.\nYou are Augustus' heir, both in life and unlife. Ambrogino is nothing more than a jumped up son of a maid thinking too highly of himself. It is time to get rid of him once and for all... and of Lucretia too, as she has been tainted by the bastard's blood now. Only then will you be able to assume your rightful place as Augustus' right hand."
 podintroductions.146.a:0 "He will regret this scheme!"
 claudius_intro_tooltip:0 "As Claudius, you have a special decision to get rid of Ambrogino and Lucretia for a reward"
 rightful_giovanni_heir_modifier:0 "Rightful Giovanni's Heir"
 rightful_giovanni_heir_modifier_desc:0 "No one can deny that you are the true heir of your father's legacy now."
 claudius_decision:0 "乔凡尼的继承者"
 claudius_decision_tooltip:1 "唯有你，没有他人，是奥古斯都的继承者"
 claudius_decision_desc:0 "Getting rid of that pesky Ambrogino and his favorite childe, that he stole from you!, would be a powerful warning to any would be rival"
 claudius_decision_confirm:0 "正义的胜利！"
 claudius_custom_decision:0 "Both Lucretia and Ambrogino must be dead"
 weak_falsinar_modifier:0 "Weak Falsinar's Help"
 weak_falsinar_modifier_desc:0 "Your faithful Falsinar still does his best from the underworld to help you."
 podintroductions.147.t:0 "你的过往"
 podintroductions.147.desc:0 "Lord Markus Musa, your fame in both your family and your clan is rising fast. You have proven yourself more than capable by thwarting Lazarus' mad scheme in Egypt. The cost was high though and you lost your two trusted retainers in the battle. One of them, Falsinar, has proven to be quite the willful soul as, even from the Underworld, he is still helping you as best as he can.\nFalsinar is a weak and young wraith still, but you are a skilled necromancer and as such you have identified two possibilities to help your spectral friend manifest himself more easily in your world. Both opportunities won't be easy to achieve but you and Falsinar have all the time in the world anyway."
 podintroductions.147.a:0 "Necromancer and wraith, a perfect duo"
 markus_intro_tooltip:0 "As Markus Musa, you have two special decision that can improve Falsinar if achieved."
 markus_nikita_decision:0 "死亡节点"
 markus_nikita_decision_tooltip:1 "One key lies in Croatia"
 markus_nikita_decision_desc:0 "Nikita of Sredetz, the Archbishop of Nod, seems to lure some powerful necromantic energies to his side. This is an opportunity to strengthen Falsinar."
 markus_nikita_decision_confirm:0 "Another sould bound to me"
 markus_nikita_custom_decision:0 "Nikita of Sredetz must be dead"
 markus_nikita_decision_effect_tooltip:0 "Falsinar will become stronger"
 medium_falsinar_modifier:0 "Falsinar's Help"
 medium_falsinar_modifier_desc:0 "Your faithful Falsinar still does his best from the underworld to help you."
 high_falsinar_modifier:0 "Strong Falsinar's Help"
 high_falsinar_modifier_desc:0 "Your faithful Falsinar still does his best from the underworld to help you."
 markus_egypt_decision:0 "回到埃及"
 markus_egypt_decision_tooltip:1 "Some bad memories from this place..."
 markus_egypt_decision_desc:0 "Falsinar died protecting you from Lazarus in Egypt. You never were able to recover his remains. Doing so would certainly help you strengthen his wraith."
 markus_egypt_decision_confirm:0 "A proper burial"
 markus_egypt_decision_effect_tooltip:0 "Falsinar will become stronger"
 podintroductions.148.t:0 "你的过往"
 podintroductions.148.desc:0 "Lord Japhet, your role as an informal leader of clan Cappadocian is an ungrateful one. Your brethren are known for being quite reclusive and mostly pay no heed to your august responsibility. Worse still, your own sire, Cappadocius himself, is often lost in his delusions of grandeur or fits of madness. But as the founder of the clan, his word is law and you are nothing if not dutiful.\nHis latest fancy has seen the Venetian Giovanni Embraced into the Blood, something you strongly disagreed with. You have no choice but to carry on though, limiting your sire's worst excesses while preserving the integrity of clan Cappadocian. Eternity has never felt so long."
 podintroductions.148.a:0 "My work will never be done"
 japhet_intro_tooltip:0 "As Japhet you have a special minor decision to check on Cappadocius. Beware his eccentricities though."
 japhet_decision:0 "父之罪"
 japhet_decision_tooltip:1 "希望他正处于好心情……"
 japhet_decision_desc:0 "You are the keeper of the Erciyes, the home of Cappadocius himself. A great honor... and a great burden since the Antediluvian is often hard to understand."
 japhet_decision_confirm:0 "没有回头路了"
 japhet_decision_effect_tooltip:0 "You will check on Cappadocius himself, hoping to find him well... and not too lost in his own fanciful world."
 PODcanon_chars.29.t:0 "卡帕多修斯：计划"
 PODcanon_chars.29.desc:0 "Here he goes again... your august sire, the venerable Cappadocius himself is once again working on his deluded plan to diablerize God. A zealous convert to Christianity, he has always been fascinated by the 'One God' in his own twisted way. You are pretty sure that Augustus Giovanni's Embrace is somehow tied to it as well.\nIn any case, he is speaking at length of his mad scheme, hoping for your enthusiastic approval of course. There is no way that you could reason with him, but you would at least prefer to not be dragged too deep in this demented quest."
 PODcanon_chars.29.a:0 "There might still be some flaws."
 PODcanon_chars.29.b:0 "What a perfect plan, sire!"
 PODcanon_chars.29.c:0 "*Sigh* Yes, this is brilliant"
 PODcanon_chars.30.t:0 "Cappadocius : The Mentor"
 PODcanon_chars.30.desc:0 "Your esteemed sire is of a good, quiet, mood tonight, bringing you back to better times before his deluded mind started to wander. He is actually pleased to see you and you are talking about the many wonders and horrors you both saw. It is in these simple times that you are reminded of the great person Cappadocius was and hopefully can still be.\nYou leave his room more determined to continue your work and wiser than you entered."
 PODcanon_chars.30.a:0 "萨尔贡的尊长如何？"
 PODcanon_chars.30.b:0 "我期望我能认识以诺本人……"
 PODcanon_chars.30.c:0 "我们能谈谈亚设么？"
 PODcanon_chars.31.t:0 "卡帕多修斯：牧师"
 PODcanon_chars.31.desc:0 "Cappadocius is a fervent believer in his, admittedly twisted, version of Christianity. As such, it isn't uncommon for him to want to attend the mass... or serve as the priest himself, despite the obvious irony of such a situation.\nYou are accustomed to dealing with this fancy of his, but it is always hard to avoid unwanted attention since your sire isn't exactly careful about his vampiric condition."
 PODcanon_chars.31.a:0 "我将举办圣餐"
 PODcanon_chars.31.b:0 "祈祷就够了"
 PODcanon_chars.31.c:0 "安全第一"
 podintroductions.149.t:0 "你的过往"
 podintroductions.149.desc:0 "Lord Bela, you have finally found your purpose in life. The petty chains of Christian morality aren't for you, you are destined for so much more! Kupala, this benevolent and powerful entity, is looking for an avatar on Earth and who better than you?\nObviously some sacrifices will have to be made... or a lot. But who cares about a person, a city or even an entire nation in the face of apotheosis? You certainly don't. Soon you wil rip apart the fragile veil of sanity of this doomed world, then all will be ashes, blood and fire.\nAnd in this cataclysmic rebirth, you will stand as the only survivor."
 podintroductions.149.a:0 "The last gasps of a dying world..."
 bela_intro_tooltip:0 "As Bela Rusenko, you have a special decision to sacrifice your counties for Kupala. If you do it enough, who knows what might happen?"
 bela_decision:0 "库帕拉崛起"
 bela_decision_tooltip:1 "Let's give them hell!"
 bela_decision_desc:0 "Kupala requires sacrifices to manifest on this wretched world. You are more than happy to provide."
 bela_decision_confirm:0 "Hell is rising."
 bela_decision_effect_tooltip:0 "完成了……"
 kupala_rising_weakest:0 "Feint Kupala's Influence"
 kupala_rising_weakest_desc:1 "The Great Demon has noticed your efforts..."
 kupala_rising_weak:0 "Weak Kupala's Influence."
 kupala_rising_weak_desc:0 "The Great Earthbound is pleased by your ongoing efforts..."
 kupala_rising_medium:0 "Medium Kupala's Influence"
 kupala_rising_medium_desc:0 "The Great Archduke is thinking of you as His favorite servant..."
 kupala_rising_strong:0 "Strong Kupala's Influence"
 kupala_rising_strong_desc:0 "The Great Archangel is very close to you now, whispering in your ear to do more..."
 kupala_avatar_modifier:0 "Kupala's Avatar"
 kupala_avatar_modifier_desc:0 "...and Hell followed with Him"
 PODcanon_chars.32.t:0 "We Are One"
 PODcanon_chars.32.desc:0 "This host is interesting. Obviously, it is quite fragile compared to your apocalyptic form but it will do. You can't deny the great efforts made by it to summon you into a more appropriate form for this world. You were pleased enough to devour his soul quickly during you takeover.\nFinally free after all those eons caged in this damned prison, you have much to do. And despite your considerable powers, this frail body can only take so much before breaking down so you will have to be careful. Still, you have all the time in the world thanks to the idiot who summoned you.\nThe safest road to Hell is the gradual one after all."
 PODcanon_chars.32.a:0 "The Heavens are weeping"
 silver_attacks_modifier:0 "Silver Fangs Raids"
 silver_attacks_modifier_desc:1 "The Lupines are restless in this province, constantly testing the limits of your control."
 podintroductions.150.t:0 "你的过往"
 podintroductions.150.desc:0 "Lady Apacia, your adopted people is in danger. Your control over the Khanate of Sibir is challenged by packs of rabid Silver Fangs Lupines, angry at your presence in what they consider as their homeland. You could fight them, but it would be a long and arduous process and your position in the region is already quite insecure.\nAnother solution is presenting itself though, the Anda, vampires from the Mongol culture, are quickly claiming the Steppes for themselves. Their leader has recently sent a message asking for your fealty to his Horde in return for his protection against the marauding Lupines. Perhaps a temporary loss of independence is worth the safety of your people?"
 podintroductions.150.a:0 "I don't need any help!"
 podintroductions.150.b:0 "The Steppes are uniting"
 podintroductions.151.t:0 "你的过往"
 podintroductions.151.desc:0 "Lord Myka, your clever move during the recent peace treaty resulted in your Obertus Order being established as a buffer state between the German Ventrue and your clansmates to the East. This position is insecure though and much still needs to be done.\nYou also recently learned that Nikita of Sredetz, the Archbishop of Nod, might be related to one of the most closely guarded secrets of clan Tzimisce. Your scholarly mind can't resist the allure of such a find but you will have to storm Nikita's city to learn more which might be a daunting prospect. As always, take care to balance your intellectuals pursuits with your more secular ambitions. This has always been your very own path to greatness."
 podintroductions.151.a:0 "Not a moment to lose."
 myka_intro_tooltip:0 "As Myka Vykos, you have a special decision to learn the secrets of the Archbishop of Nod. The reward might be more than Myka can handle though..."
 myka_decision:0 "Dark Secrets"
 myka_decision_tooltip:1 "Seeking the unknowable truth"
 myka_decision_desc:0 "Nikita of Sredetz hides one of the most important secrets of clan Tzimisce. Deal with him, storm his haven and learn the truth."
 myka_decision_confirm:0 "I must know!"
 myka_decision_effect_tooltip:0 "Myka will be reborn anew."
 PODcanon_chars.33.t:0 "The Ugly Truth"
 PODcanon_chars.33.desc:0 "All of this fanciful quest had just been a setup.\nYou found no truth in Nikita's haven, beyond the realization that Nikita was dead long before you even knew of him and impersonated by a powerful Tzimisce Methuselah. And this Methuselah guided you here, as he found you would make a better 'host' than the late Archbishop.\nYou can already see its tendrils, spiritual or otherwise, reaching out to meld you to a more 'appropriate' form for your merging.\nThis might be where it ends for Myka Vykos."
 PODcanon_chars.33.a:0 "...Everyting changes"
 PODcanon_chars.33.b:0 "Run away!"
 podintroductions.152.t:0 "你的过往"
 podintroductions.152.desc:0 "Lord Noriz, the time of indolent decadence is over. While it is certainly amusing pitting your childer against each other in death matches, you must not forget that you were once the master of clan Tzimisce. Vladimir Rustovitch, that cowardly usurper, took it from you but his humiliating defeat against the German Ventrue is the opportunity you awaited.\nYou must press your rightful claim as Voivode of Voivodes and deal with Rustovitch once and for all. Then your lineage can reclaim the prestige that is its due."
 podintroductions.152.a:0 "This was your last mistake Vladimir..."
 noriz_intro_tooltip:0 "As Noriz, you have a special decision achievable if you become the leader of the Voivodate. It will improve your starting house modifier if achieved."
 house_noriz_modifier:0 "House Noriz"
 house_noriz_modifier_desc:1 "The true Voivode of Voivodes has returned. Transylvania is more feared than it has ever been."
 noriz_decision:0 "The Return of the Voivode"
 noriz_decision_tooltip:1 "Rustovitch's time has ended"
 noriz_decision_desc:0 "Many think you indolent and lost to decadence. Prove them wrong by reclaiming your title."
 noriz_decision_confirm:0 "They will kneel once again"
 noriz_custom_decision:0 "Vladimir Rustovitch must be dead."
 podintroductions.153.t:0 "你的过往"
 podintroductions.153.desc:0 "Lady Razkoljna, your recent fall into torpor has seen your control over Poland weakened. Still, Krakow hasn't fallen so you have a strong base from which to launch your reconquest.\nIt is especially important to you as you are one of the few vampires that truly cares about the well being of its city. Not from any misplaced sentiment of kindness obviously, but from the pragmatic standpoint that a strong city means a strong Prince. You must quickly reconstruct your web of influence in Krakow and help its prosperity once again. The city must become mighty indeed, as befell a capital of your new Tzimisce empire."
 podintroductions.153.a:0 "Transylvania is old news, here is the future."
 raz_intro_tooltip:0 "As Razkoljna, you have a special event available during the survey capital activity."
 POD_survey_events.160.t:0 "The Survey : Razkoljna's Capital"
 POD_survey_events.160.desc:0 "You know the importance of a well developed mortal community more than any Tzimisce. As such, you have been practicing the art of guiding a city towards prosperity for a long time in Krakow. The valuable lessons you learned make it easier for you to subtly develop your capital towards your goal. It is still an exhausting process though, and you might want to pace yourself."
 POD_survey_events.160.option.a:0 "There is no time to waste"
 POD_survey_events.160.option.b:0 "I have eternity on my side"
 raz_survey_tooltip:0 "This special outcome of the survey is available as long as you play Razkoljna."
 podintroductions.154.t:0 "你的过往"
 podintroductions.154.desc:0 "Lord Hedeon, you have recently grown your influence in Poland thanks to Prince Razkoljna's time in torpor. And as your influence grows so do the screams of the mortals in your 'care', clearly the most pleasant of sounds. Your fortress is always in need of more renovation and as such you obviously need more cattle to skin and dismember for artistic purposes.\nWhat better way to acquire more than crushing Razkoljna and the other Polish usurpers then bringing their pathetic cities into your fold? You are an imaginative man after all, think of all the things you could do with so many helpless mortals added to your domain..."
 podintroductions.154.a:0 "Heavy is the burden of an artist."
 hedeon_intro_tooltip:0 "As Hedeon, you get a massive stress relief and some intrigue xp when you torture someone."
 podintroductions.155.t:0 "你的过往"
 podintroductions.155.desc:0 "Lord Yorak, as the eldest childe of Tzimisce active in Transylvania, you have assumed the role of a spiritual leader for your clan. It has been strengthened by your construction of the Cathedral of Flesh, a masterful achievement in the art of fleshcrafting.\nStill, you were once a political force as well and you might need to become one once more, as your brethren are assailed by the German Ventrue and their Tremere allies. Clearly, you are the only one with enough clout to really unify the clan. And for those who disagree? Well, the Cathedral is always hungry..."
 podintroductions.155.a:0 "Open the gates..."
 yorak_intro_tooltip:0 "As Yorak, you have a special execution method that allows you to feed the Cathedral as long as you control it"
 EXECUTION_YORAK:0 "Feed to the Cathedral"
 cathedral_famished_modifier:0 "Famished Cathedral"
 cathedral_famished_modifier_desc:1 "After the recent appetizer, the Cathedral wants more. So many more."
 cathedral_hungry_modifier:0 "Hungry Cathedral"
 cathedral_hungry_modifier_desc:1 "The maddening structure expands more and more as poor souls are fed to its neverending hunger."
 cathedral_satiated_modifier:0 "Satiated Cathedral"
 cathedral_satiated_modifier_desc:1 "The apparent calm reigning in the Cathedral is only troubled by the screams of its countless victims."
 podintroductions.156.t:0 "你的过往"
 podintroductions.156.desc:0 "Fearsome Darvag, Kiev is at your mercy and you will one night have your revenge on its fickle population who betrayed your ancient religion. But more pressing matters are at hand.\nThe Tzimisce Voivodate to your west asked for your fealty but you refused, knowing that there are far greater powers than they. The Little Grandmother of Russian fame, Baba Yaga, is close, you can feel it. It doesn't matter if she is asleep or not, you know that she is the only Goddess of these lands and you also know the stories : she will bless those that will show proper deference. Well, you are sure that the people of Kiev will be happy to serve as offerings..."
 podintroductions.156.a:0 "Heed me Grandmother!"
 darvag_intro_tooltip:0 "As Darvag, you have access to a special execution method."
 EXECUTION_DARVAG:0 "Sacrifice to Baba Yaga"
 baba_intrigued_modifier:0 "Noticed by the Hag"
 baba_intrigued_modifier_desc:1 "Baba Yaga has show interest in your devotion to her greatness."
 baba_pleased_modifier:0 "Baba Yaga Pleased"
 baba_pleased_modifier_desc:1 "The Russian Hag is pleased with your zealous devotion."
 baba_delighted_modifier:0 "Favorite Grandson"
 baba_delighted_modifier_desc:1 "Clearly you are her favorite now, the one who gets the best gifts."
 podintroductions.157.t:0 "你的过往"
 podintroductions.157.desc:0 "Lady Shaagra, as your control over Bohemia grows, you have learned an interesting information. Vukodlak, a Tzimisce even older than you, was active in Prague recently until his fall into torpor after a titanic battle against some unknown assailants.\nVukodlak is a sadistic and arrogant madman but you can't deny his powers and skills. If you were to rescue him, he might be amicable to an alliance at least for a while. His strength would be a great asset to help ease your return into power... but it could also backfire in the future, Vukodlak being quite ambitious on his own as well."
 podintroductions.157.a:0 "There is honor among monsters."
 podintroductions.157.b:0 "...That sounds like a very bad idea."