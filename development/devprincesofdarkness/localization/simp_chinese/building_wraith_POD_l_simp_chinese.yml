l_simp_chinese:
 building_type_necropolis_01:0 "死城"
 building_type_necropolis_01_desc:0 "#F 死城是死者的城市，是位于幽土的诡域混合体。死城是围绕着中央影堡组成的，这是一个巨大的加固诡域，以便在恶湍中存留。#!"
 building_necropolis_01:0 "小型死城"
 building_necropolis_01_desc:0 "这里有一座小影堡，一些鬼魂在堡内的受诅大厅里活动。"
 building_necropolis_02:0 "中型死城"
 building_necropolis_02_desc:0 "影堡被一座小村庄的鬼魂所包围，而现在这个死城成为了村庄死灵的家。"
 building_necropolis_03:0 "大型死城"
 building_necropolis_03_desc:0 "这座死城现以是是死灵的城镇，矗立在它的领域之上，它的墙壁是抵御恶湍的屏障，是疯狂之海中的理智之岛。至少对死灵来说是这样的。"
 building_necropolis_04:0 "巨型死城"
 building_necropolis_04_desc:0 "This necropolis shall endure past all the Umbra freezing over, and here, no wraith shall even shudder. Or so they think."
 building_type_haunted_house_01:0 "闹鬼鬼屋"
 building_type_haunted_house_01_desc:0 "#F 诡域是死灵们寻求庇护的地方。某些地区在皮肤之地以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。鬼房是最常见的，在那里他们可能会找到在亡生中的少量平静。#!"
 building_haunted_house_01:0 "闹鬼小屋"
 building_haunted_house_01_desc:0 "一座曾经有人居住过的小楼，现在已经成为了死灵的休憩场所。它又小又拥挤，但至少还能使用。"
 building_haunted_house_02:0 "闹鬼房屋"
 building_haunted_house_02_desc:0 "What was once a family's home, is now a place of brief sanctuary amidst the terrors of the skinlands."
 building_haunted_house_03:0 "闹鬼豪宅"
 building_haunted_house_03_desc:0 "What was once a seat of decadent excess, is now a palace of the miserable and the dead."
 building_haunted_house_04:0 "闹鬼庄园"
 building_haunted_house_04_desc:0 "祸不单行。而在这里，有着一整个团队。"
 building_type_haunted_field_01:0 "闹鬼野地"
 building_type_haunted_field_01_desc:0 "#F 诡域是死灵们寻求庇护的地方。某些地区在皮肤之地以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。荒野并不明显，但不眠死者可以这里的空地晃荡，找到一丝内心平静。#!"
 building_haunted_field_01:0 "阴森野地"
 building_haunted_field_01_desc:0 "有时，田野间的孩子们会被风中的耳语和行间的沙沙声吓到。"
 building_haunted_field_02:0 "可怕野地"
 building_haunted_field_02_desc:0 "在此野外之地，有报告说看到无头骑士经过。"
 building_haunted_field_03:0 "恐怖野地"
 building_haunted_field_03_desc:0 "This field is a place of local hysteria, as rumors abound of the dead that haunt this place."
 building_haunted_field_04:0 "骇人野地"
 building_haunted_field_04_desc:0 "The dead here are in such force, one would think the Wild Hunt has returned to this cursed place."
 building_type_haunted_castle_01:0 "闹鬼城堡"
 building_type_haunted_castle_01_desc:0 "#F 诡域是死灵们寻求庇护的地方。某些地区在皮肤之地以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。城堡是顶级的诡域，一个至少可以给于死灵安全的假象的堡垒。#!"
 building_haunted_castle_01:0 "闹鬼城塞"
 building_haunted_castle_01_desc:0 "An outpost of war that has since been abandoned, the locals now whisper on how the 'warriors' that haunt this place."
 building_haunted_castle_02:0 "闹鬼城堡"
 building_haunted_castle_02_desc:0 "The guards here speak of the dead of the dungeons walking the halls at night, and the armor occasionally turns to watch these guards."
 building_haunted_castle_03:0 "闹鬼堡垒"
 building_haunted_castle_03_desc:0 "When this place is besieged, the attackers find strange forces seem to hinder them. Not that it makes the living defending this place any more at ease..."
 building_haunted_castle_04:0 "闹鬼要塞"
 building_haunted_castle_04_desc:0 "There will come a fortress called Osoweic, where dead men shall rise. Here, this bastion is a mirror into the horrors of war, the madness of death, and the hate of the dead."
 building_type_soulsmithy_01:0 "灵铸铺"
 building_type_soulsmithy_01_desc:0 "#F 灵铸是将一个死灵转化为物品的手艺。它既是一种惩罚，也是一种制作工艺。#!"
 building_soulsmithy_01:0 "小灵铸铺"
 building_soulsmithy_01_desc:0 "A small furnace, serving double duty as an execution site and forge, this Soulforge at least gets the job done."
 building_soulsmithy_02:0 "大灵铸铺"
 building_soulsmithy_02_desc:0 "Your forge has since been expanded, and now wraiths shudder at the thought of being brought to this place."
 building_soulsmithy_03:0 "灵钢钢厂"
 building_soulsmithy_03_desc:0 "The forge has truly grown, and the factory smithies would pale to it, and even the axe happiest executioner couldn't catch up with the dead you could process here."
 building_soulsmithy_04:0 "冥钢钢厂"
 building_soulsmithy_04_desc:0 "整个影界的死灵对这可怕的死亡工厂感到恐惧，因为这里的武器和军火是以最完美的质量为标准而制造的。一个完美无瑕的产品需要付出可怕的代价。完美。"
 building_type_tithe_of_the_dead_01:0 "死税"
 building_type_tithe_of_the_dead_01_desc:0 "#F 死税的要求是两枚压在刚死去的死灵眼睛里的硬币；这些遗物硬币将被交给努德里，而努德里又会用它们来制货。#!"
 building_tithe_of_the_dead_01:0 "宽松死税"
 building_tithe_of_the_dead_01_desc:0 "想要安全通行，就得交适度的死税。这对于那些过世的人来说很糟糕，但他们在这个问题上没有任何发言权。"
 building_tithe_of_the_dead_02:0 "高额死税"
 building_tithe_of_the_dead_02_desc:0 "A hefty toll, the dead are beginning to mutter about 'expensiveness', but let them mutter. It is your coin now."
 building_tithe_of_the_dead_03:0 "沉重死税"
 building_tithe_of_the_dead_03_desc:0 "Your assessors are now feared throughout your domains, and for good reason. The coin must flow, no matter what."
 building_tithe_of_the_dead_04:0 "严荷死税"
 building_tithe_of_the_dead_04_desc:0 "Recently Dead, the Old Dead, Wraith or other traveler, it's all the same to you. Where there is profit to be made, there is your domain!"
 building_type_lux_veritatis_01:0 "真理之光"
 building_type_lux_veritatis_01_desc:0 "#F 真理之光规定所有的伟大人类作品都要收集起来，无论在哪里都要保存，并把它们存放在参议院下面的金库里，供所有人享有，以便所有的艺术和历史都能得到永久的保存。#!"
 building_lux_veritatis_01:0 "微型宝库"
 building_lux_veritatis_01_desc:0 "A personal vault, you have hidden away a small time capsule of the local art and beauty here, to hopefully preserve it from the sands of time. It may not mean a lot to the world, but it means a lot to you."
 building_lux_veritatis_02:0 "小型宝库"
 building_lux_veritatis_02_desc:0 "Your little hideaway for the relics of mankind has been expanded, and you have a few trinkets that are truly worth preserving. You hope it will be enough."
 building_lux_veritatis_03:0 "大型宝库"
 building_lux_veritatis_03_desc:0 "Your bunker of art and culture has gotten some acclaim, as you now hold truly priceless relics, in the hopes of preserving it against the ravages of history. It might actually work! Probably."
 building_lux_veritatis_04:0 "巨型宝库"
 building_lux_veritatis_04_desc:0 "The greatest museums of mortals are nothing to your vaults of lore, culture, and history. Every enterprising archaeologist would want a mere glance at your collection, and here, the sagas of mankind have at least a single wretched soul to remember them."
 building_type_haunted_cemetery_01:0 "闹鬼墓园"
 building_type_haunted_cemetery_01_desc:0 "#F 诡域是死灵们寻求庇护的地方。某些地区在皮肤之地以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。墓园总是好选择，因为它有能力收容非常多的死灵。#!"
 building_haunted_cemetery_01:0 "闹鬼坟地"
 building_haunted_cemetery_01_desc:0 "Where a dead man lies, a wraith may find a moment of respite amidst the worms in their bones."
 building_haunted_cemetery_02:0 "闹鬼墓园"
 building_haunted_cemetery_02_desc:0 "Where the dead lie, wraiths may find a place to stop and gather, a small oasis amidst the terrors of the dead."
 building_haunted_cemetery_03:0 "闹鬼荒冢"
 building_haunted_cemetery_03_desc:0 "A great gathering of the dead, be it the sleeping and restless dead alike, there is the illusion of peace here."
 building_haunted_cemetery_04:0 "闹鬼陵墓"
 building_haunted_cemetery_04_desc:0 "凡人惧怕这个地方，并用沙哑的耳语互传这里有死亡的搅动，还有其中的恐怖。他们是对的。"