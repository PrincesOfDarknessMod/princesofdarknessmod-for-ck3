 game_concept_neteru:0 "奈特鲁"
 game_concept_neteru_desc:0 "$game_concept_neteru$是聚集在一位重生者身边崇拜它的密教徒。你此世的家族成员会自动成为你的奈特鲁，其他则需要你使用[character_interaction|E]来获得。奈特鲁作为凡人被赐予头衔，也可以持有木乃伊建筑，但只有你是他们的领主时才会建造这些建筑。"
 game_concept_abombwe:0 "阿本威"
 game_concept_abombwe_desc:0 "阿本威是种由莱本的阿库南斯传承和黑暗时代神秘的邦萨姆血系掌握的[discipline|E]。阿本威利用吸血鬼与自己的（以及其他人的）心兽的紧密联系并加以控制，将心兽的力量用于各种目的。"
 game_concept_penumbra:0 "半影界"
 game_concept_penumbra_desc:0 "半影界，也被称为地球之影，是直接围绕物质世界的灵性世界。许多，但非所有地形特征在那里都有镜像。"
 game_concept_astral_reaches:0 "星光界"
 game_concept_astral_reaches_desc:0 "星光界，也被称为星影界、高影界、或上影界，是思想、观念、概念的界域。"
 game_concept_dark_kingdom:0 "冥府"
 game_concept_dark_kingdom_desc:0 "冥府是冥界大风暴中的小块稳定现实区域。诸冥府中的每一个都声称对某一特定地理区域的死灵拥有统治权。"
 game_concept_shadow_realm:0 "影子国度"
 game_concept_shadow_realm_desc:0 "影子国度是木乃伊在冥界的根据地，在他们准备好再次回到在自己的身体里之前，他们会去那里进行自我再生，且在此处其等可避免怨灵或恶湍的侵袭。"
 game_concept_shard_realm:0 "碎域"
 game_concept_shard_realm_desc:0 "在天国颂歌看来，每片碎域都是太一的一部分。每片碎域都与太阳系中的一颗行星相连，并形成它自己的专属影界。每片碎域都与特定的魔法领域相通，其具有主宰地位。每片碎域也都与对应的影域相连，据传通向由某一魔法领域主导的平行宇宙。每片碎域都居住着一位强大的太神，并受其统治。"
 game_concept_dreaming:0 "梦界"
 game_concept_dreaming_desc:0 "就像度假明信片，当人类开始更相信冷酷的事实（和寒铁），而不是心血来潮和幻想时，世界的神话部分就分出了一个重叠的现实相位，被称为梦界。"
