 setting_web_of_knives_difficulty_hard:0 "致命版刀锋之网"
 setting_web_of_knives_difficulty_hard_desc:0 "刀锋之网的哈基姆圣裔刺客现在可以触及在世界任何一处的目标，这意味着他们血腥任务的完成只是时间问题。"