 single_combat.0001.desc.my_feedback.POD_stand_upon_the_dragons_back:0 "你把握住了地面和自身的链接。"
 single_combat.0001.desc.my_feedback.POD_dragon_ward:0 "我睁大我的第三只眼并生成一片强力的护卫光壁。"
