 single_combat.0001.desc.opponent_response.POD_wind_attack:0 "The wind is on, and my opponent is quicker than ever."
 single_combat.0001.desc.opponent_response.POD_demon_claws:0 "My opponent has taken the form of a fearsome demon."
 single_combat.0001.desc.opponent_response.POD_tormented_essence:0 "痛苦、愤怒和绝望瞬间吞噬了我的灵魂。"
 single_combat.0001.desc.opponent_response.POD_adamantums_wrath:0 "我的对手已经变成了一位可怕的恶魔。"
 single_combat.0031.desc.sc_defender.POD_bite:0 "我的对手毫不费力地躲开了我的前扑，并具有了反击的机会。"
 single_combat.0031.desc.sc_defender.POD_blood_surge:0 "我没能催起我体内的血，因为我需要每一份注意力来保持对敌人的优势。"
 single_combat.0031.desc.sc_defender.POD_blood_heal:0 "我没能催起我体内的血，因为我需要每一份注意力来保持对敌人的优势。"
 single_combat.0031.desc.sc_defender.POD_blink:0 "过快过速，我偏离了原本锁定的位置。"
 single_combat.0031.desc.sc_defender.POD_lightning_strike:0 "我的攻击，虽然快，但没准头，打空了。"
 single_combat.0031.desc.sc_defender.POD_split_second:0 "尽管时间的流逝有偏差，但我的敌人却似乎适应得相当好。"
 single_combat.0031.desc.sc_defender.POD_unerring_aim:0 "绝对精准……但缺乏强度，勉强擦伤目标。"
 single_combat.0031.desc.sc_defender.POD_lethal_body:0 "如果没有精确度，强度就什么都不是，因为我强力的攻击没有击中目标。"
 single_combat.0031.desc.sc_defender.POD_brutal_feed:0 "我的獠牙错过了对手的脖子，使其了有机会进行反击。"
 single_combat.0031.desc.sc_defender.POD_earthshock:0 "保持平稳，我的对手几乎没有受到地震的影响。"
 single_combat.0031.desc.sc_defender.POD_fist_of_caine:0 "我蛮力术强化的攻击所带起的风对我的敌人来说如同春风一般。"
 single_combat.0031.desc.sc_defender.POD_toughness:0 "尽管我的韧性被增强，但对手强大的攻击仍然让我痛不欲生。"
 single_combat.0031.desc.sc_defender.POD_flesh_of_marble:0 "坚石可以被击碎，正如我的对手现在那开天辟地的一击所要证明的那样。"
 single_combat.0031.desc.sc_defender.POD_prowess_from_pain:0 "即使是吸血鬼受虐狂也有极限。当前的疼痛过大了，既不愉悦和也无用。"
 single_combat.0031.desc.sc_defender.POD_feral_weapons:0 "晓得危险，我的敌人巧妙地躲开了我致命的利爪。"
 single_combat.0031.desc.sc_defender.POD_shapechange:0 "在动物本能的支配下，我的攻击是强力的，但缺乏足够的精准，没法命中。"
 single_combat.0031.desc.sc_defender.POD_vanish:0 "察觉到了微小的不致之处，我的对手设法发现了我。"
 single_combat.0031.desc.sc_defender.POD_nocturne:0 "我的敌人似乎几乎没有被暗影所拖累，仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_defender.POD_arms_of_ahriman:0 "迅速移开，我的对手设法摆脱了触手的束缚。"
 single_combat.0031.desc.sc_defender.POD_the_darkness_within:0 "没有破绽，我的敌人近乎完美地避开了回旋的暗影。"
 single_combat.0031.desc.sc_defender.POD_aegis_of_shadows:0 "如同光驱散黑暗，我的对手强大的攻击击碎了我的暗影盔甲。"
 single_combat.0031.desc.sc_defender.POD_compel:0 "由于其顽强的意志力，我的对手无视了我的命令。"
 single_combat.0031.desc.sc_defender.POD_terminal_decree:0 "由于其顽强的意志力，我的对手无视了我的命令。"
 single_combat.0031.desc.sc_defender.POD_daunt:0 "我的对手完全没有被我的强化所吓倒，仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_defender.POD_dread_gaze:0 "我的对手实际上似乎很喜欢把他最惧怕的噩梦打成肉酱，使得恐惧目光相当无用。"
 single_combat.0031.desc.sc_defender.POD_extinguish_vitae:0 "我对手的血对这些花招来说太强了，其血还如原样。"
 single_combat.0031.desc.sc_defender.POD_scorpions_touch:0 "如果你不会用毒，那再致命也没用，你的对手非常小心地避开了你的下一击。"
 single_combat.0031.desc.sc_defender.POD_theft_of_vitae:0 "我对手的血对这些花招来说太强了，其血还在原躯。"
 single_combat.0031.desc.sc_defender.POD_baals_curse:0 "如果你不会用毒，那再致命也没用，你的对手非常小心地避开了你的下一击。"
 single_combat.0031.desc.sc_defender.POD_cauldron_of_blood:0 "我对手的血对我来说太强了，尽管我尽了最大努力，其血仍然是冷的。"
 single_combat.0031.desc.sc_defender.POD_touch_of_oblivion:0 "湮灭之触甚至都没能给我的对手造成擦伤，真是无用。"
 single_combat.0031.desc.sc_defender.POD_stygian_shroud:0 "即使其的感官被障壁所遮断，我的对手仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_defender.POD_fire_torch:0 "No lucky break this time, my torch is effortlessly dodged."
 single_combat.0031.desc.sc_defender.POD_fire_bombs:0 "The small concoction is easily dodged by my foe."
 single_combat.0031.desc.sc_defender.POD_fire_spewer:0 "With wildly inaccurate targeting, the fire doesn't even go near its intended target."
 single_combat.0031.desc.sc_defender.POD_crossbow_shot:0 "The Shot goes way wide of its intended target."
 single_combat.0031.desc.sc_defender.POD_unleash_dogs:0 "The animals are quickly dispatched."
 single_combat.0031.desc.sc_defender.POD_stake_attack:0 "My reckless attack is easily dodged."
 single_combat.0031.desc.sc_defender.POD_oculi_trust:0 "It doesn't seem to really stop them for long though."
 single_combat.0031.desc.sc_defender.POD_oculi_wine:0 "My reckless attack is easily dodged."
 single_combat.0031.desc.sc_defender.POD_acre_catechumen:0 "I fail to capitalize on this renewed strength quickly enough though."
 single_combat.0031.desc.sc_defender.POD_acre_flesh:0 "...but my opponent doesn't care and their next charge is as strong as ever."
 single_combat.0031.desc.sc_defender.POD_acre_flight:0 "It doesn't seem enough though, and my foe easily matches me."
 single_combat.0031.desc.sc_defender.POD_acre_auto:0 "Not quite, as it is easily dodged."
 single_combat.0031.desc.sc_defender.POD_murnau_mirror:0 "It isn't enough though, and I'm still outmatched right now."
 single_combat.0031.desc.sc_defender.POD_murnau_arcana:0 "With great powers... come great risks of backlash."
 single_combat.0031.desc.sc_defender.POD_sisters_hosanna:0 "I fail to capitalize on this renewed strength quickly enough though."
 single_combat.0031.desc.sc_defender.POD_sisters_oratorio:0 "It doesn't seem to really stop them for long though."
 single_combat.0031.desc.sc_defender.POD_bone_obedience:0 "But the relentless charge of my opponent still hurts."
 single_combat.0031.desc.sc_defender.POD_five_poison_cloud:0 "It is dodged at the last second though."
 single_combat.0031.desc.sc_defender.POD_ching_shih:0 "My opponent isn't impressed though, and strikes quickly."
 single_combat.0031.desc.sc_defender.POD_long_neck:0 "But not limitless accuracy, as I miss my next attack."
 single_combat.0031.desc.sc_defender.POD_bloodlash:0 "It doesn't account for much, as my opponent easily steps aside."
 single_combat.0031.desc.sc_defender.POD_goblin_scorch:0 "It is dodged at the last second though."
 single_combat.0031.desc.sc_defender.POD_goblin_lantern:0 "My opponent carefully avoids me during this time."
 single_combat.0031.desc.sc_defender.POD_bone_dance:0 "My opponent doesn't seem sleepy though."
 single_combat.0031.desc.sc_defender.POD_dragon_dance:0 "Despite my enhanced capabilities, I fail to take the advantage."
 single_combat.0031.desc.sc_defender.POD_chi_interrupt:0 "I can't find it, and I'm pushed aside."
 single_combat.0031.desc.sc_defender.POD_thousand_hell_stare:0 "It only makes them stronger."
 single_combat.0031.desc.sc_defender.POD_wind_attack:0 "But not enough to win this duel yet it seems."
 single_combat.0031.desc.sc_defender.POD_demon_claws:0 "My opponent isn't impressed though, and strikes quickly."
 single_combat.0031.desc.sc_defender.POD_tormented_essence:0 "这只使其变得更强了。"
 single_combat.0031.desc.sc_defender.POD_adamantums_wrath:0 "但我的对手并不以为然，并迅速出击。"
