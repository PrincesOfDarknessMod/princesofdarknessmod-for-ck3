 single_combat.0031.desc.sc_attacker.POD_goblin_lantern.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_bone_dance.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_dragon_dance.injury:0 "I'm pushed back, barely keeping up."
 single_combat.0031.desc.sc_attacker.POD_chi_interrupt.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_thousand_hell_stare.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_wind_attack.injury:0 "I'm pushed back, barely keeping up."
 single_combat.0031.desc.sc_attacker.POD_demon_claws.injury:0 "I'm hurt, but still standing."
 single_combat.0031.desc.sc_attacker.POD_tormented_essence.injury:0 "其还以强有力的反击。"
 single_combat.0031.desc.sc_attacker.POD_adamantums_wrath.injury:0 "我受伤了，但我还站着。"
 single_combat.0031.desc.sc_attacker.POD_bite.fatality:0 "而且它来得很快，以一掌劈脸的形式，将其切成了恰好的两半。"
 single_combat.0031.desc.sc_attacker.POD_blood_surge.fatality:0 "而这小小的分心足以让我的对手利用优势，其以迅雷不及掩耳之势击中了你的脖子。你的头很快就滚到了地上，眼见着不行了。"
 single_combat.0031.desc.sc_attacker.POD_blood_heal.fatality:0 "而这小小的分心足以让我的对手利用优势，其以迅雷不及掩耳之势击中了你的脖子。你的头很快就滚到了地上，眼见着不行了。"
 single_combat.0031.desc.sc_attacker.POD_blink.fatality:0 "而且我惨败的甚至比我预想的还要严重。不过我不会再失去任何东西了，往好的来说。"
 single_combat.0031.desc.sc_attacker.POD_lightning_strike.fatality:0 "而我对手的反击却非如此。我的心脏被刺穿，爆裂了开来。血腥的结局。"
 single_combat.0031.desc.sc_attacker.POD_split_second.fatality:0 "而不出意外的话我会被下一击击中。而且这一击对准了我的脖子。不光彩的结局。"
 single_combat.0031.desc.sc_attacker.POD_unerring_aim.fatality:0 "拉近了距离，我的敌人为我的放肆打了我一拳。随后打脸。接着把我的头拔了下来。"
 single_combat.0031.desc.sc_attacker.POD_lethal_body.fatality:0 "而我的对手则没这样。而这很痛。直到最后不痛了，黑暗吞噬了你。"
 single_combat.0031.desc.sc_attacker.POD_brutal_feed.fatality:0 "而且它来得很快，以一掌劈脸的形式，将其切成了恰好的两半。"
 single_combat.0031.desc.sc_attacker.POD_earthshock.fatality:0 "被失误所分心，我没能注意到袭来的一击。也永远没法注意了。"
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine.fatality:0 "而他的反击要强得多了，我很快就倒地了，什么也做不了，只能看着终结一击向我殴来。"
 single_combat.0031.desc.sc_attacker.POD_toughness.fatality:0 "看上去这次的坚韧术还不够。不足以挽救紧接着的针对你的脖子的强力一击。"
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.fatality:0 "我感到自己如同处于地震的中心。很快就被它吞噬了，再无法睁眼。"
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.fatality:0 "我的对手确保了这很快就会更痛。直到无法再痛。"
 single_combat.0031.desc.sc_attacker.POD_feral_weapons.fatality:0 "其的反击也同样危险，我没法于下一轮中向我袭来的强力一击中自救。"
 single_combat.0031.desc.sc_attacker.POD_shapechange.fatality:0 "我的对手利用人类世代驯服野生动物的经验，开始将我的动物形态打得落花流水。在这一次人与自然的较量中，人类取得了巨大的胜利。"
 single_combat.0031.desc.sc_attacker.POD_vanish.fatality:0 "而其的下一击很是猛厉。下下一击也是。下下下一击……"
 single_combat.0031.desc.sc_attacker.POD_nocturne.fatality:0 "而这被其几乎完美的下一击所证明。下下一击也是。下下下一击……"
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman.fatality:0 "因这一失败而分心，我不得不忍受一些快速的反击。在我目前的状态下，我没有能力迅速恢复。这很快结束了。"
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within.fatality:0 "而我面对其的下一击却没能那么完美。永生总是会因死亡而结束。"
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows.fatality:0 "不再无敌的人显然会受到极大的痛苦。但是真正的死亡后就不会了，你很快就会知道这点。"
 single_combat.0031.desc.sc_attacker.POD_compel.fatality:0 "随后命令其一拳崩头上。算是成了。我的头咕噜噜的滚下了身体。"
 single_combat.0031.desc.sc_attacker.POD_terminal_decree.fatality:0 "随后命令其一拳崩头上。算是成了。我的头咕噜噜的滚下了身体。"
 single_combat.0031.desc.sc_attacker.POD_daunt.fatality:0 "而这被其几乎完美的下一击所证明。下下一击也是。下下下一击……"
 single_combat.0031.desc.sc_attacker.POD_dread_gaze.fatality:0 "而作为挨打的一方，这很痛。当你很快感觉到该隐的诅咒离开你的身体时，你有略有安慰，至少你残酷的帮助你的敌人地克服了其的恐惧。"
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae.fatality:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。我失去了我的胆，和我的永生之身。"
 single_combat.0031.desc.sc_attacker.POD_scorpions_touch.fatality:0 "你在闪避其的时候也缺乏了同样的谨慎，你最终输掉了战斗。最终，唯有黑暗"
 single_combat.0031.desc.sc_attacker.POD_theft_of_vitae.fatality:0 "很快，对手的拳头就殴到了我的脸上让我飞了出去。同时，我的头也从我的身体上飞了出去。"
 single_combat.0031.desc.sc_attacker.POD_baals_curse.fatality:0 "你在闪避其的时候也缺乏了同样的谨慎，你最终输掉了战斗。最终，唯有黑暗"
 single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood.fatality:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。我失去了我的胆，和我的永生之身。"
 single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion.fatality:0 "甚至没有被吓倒，在这战斗回合中，我最终输了这场战斗。最终，唯有黑暗。"
 single_combat.0031.desc.sc_attacker.POD_stygian_shroud.fatality:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。我失去了我的胆，和我的永生之身。"
 single_combat.0031.desc.sc_attacker.POD_fire_torch.fatality:0 "My pitiful attack is then countered by a masterful strike. I won't recover from this one."
 single_combat.0031.desc.sc_attacker.POD_fire_bombs.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_fire_spewer.fatality:0 "The next strike from my opponent is way more accurate than that though. My head if cut off my shoulders in a swift motion."
 single_combat.0031.desc.sc_attacker.POD_crossbow_shot.fatality:0 "The next strike from my opponent is way more accurate than that though. My head if cut off my shoulders in a swift motion."
 single_combat.0031.desc.sc_attacker.POD_unleash_dogs.fatality:0 "My opponent throw one of my own dogs at me in retaliation. I catch him by reflexes, which appears to be a wrong move as my opponent closes on to me for a critical blow."
 single_combat.0031.desc.sc_attacker.POD_stake_attack.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_oculi_trust.fatality:0 "I'm quickly push back by a relentless assault. Cornered, I fall to the ground, helpless."
 single_combat.0031.desc.sc_attacker.POD_oculi_wine.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_acre_catechumen.fatality:0 "My opponent's counterattack catches me off guard and connects. The end comes in a flash of steel."
 single_combat.0031.desc.sc_attacker.POD_acre_flesh.fatality:0 "It hurts quite a lot. Enough to distract me from the next blow. This one doesn't hurt for long."
 single_combat.0031.desc.sc_attacker.POD_acre_flight.fatality:0 "Or even outmatch me, as I'm pushed back. And back. Until there is no where left to go."
 single_combat.0031.desc.sc_attacker.POD_acre_auto.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_murnau_mirror.fatality:0 "I'm pushed back, barely keeping up. The duel doesn't last long after that, I'm out of my league."
 single_combat.0031.desc.sc_attacker.POD_murnau_arcana.fatality:0 "This one exploded right to my face. Then exploded my face as well."
 single_combat.0031.desc.sc_attacker.POD_sisters_hosanna.fatality:0 "My opponent's counterattack catches me off guard and connects. The end comes in a flash of steel."
 single_combat.0031.desc.sc_attacker.POD_sisters_oratorio.fatality:0 "My opponent's counterattack catches me off guard and connects. The end comes in a flash of steel."
 single_combat.0031.desc.sc_attacker.POD_bone_obedience.fatality:0 "I'm pushed back, barely keeping up. The duel doesn't last long after that, I'm out of my league."
 single_combat.0031.desc.sc_attacker.POD_five_poison_cloud.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_ching_shih.fatality:0 "I'm hurt, but still standing. Until I'm not. It ends as it started, in darkness."
 single_combat.0031.desc.sc_attacker.POD_long_neck.fatality:0 "My opponent doesn't, and I'm wounded. Badly enough that the rest of the fight is a certain affair."
 single_combat.0031.desc.sc_attacker.POD_bloodlash.fatality:0 "Before connecting with a swift strike that injures me. Badly enough that the rest of the fight is a foregone conclusion."
 single_combat.0031.desc.sc_attacker.POD_goblin_scorch.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_goblin_lantern.fatality:0 "They then counter with a powerful blow. My head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0031.desc.sc_attacker.POD_bone_dance.fatality:0 "They then counter with a powerful blow. My head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0031.desc.sc_attacker.POD_dragon_dance.fatality:0 "I'm pushed back, barely keeping up. The duel doesn't last long after that, I'm out of my league."
 single_combat.0031.desc.sc_attacker.POD_chi_interrupt.fatality:0 "They then counter with a powerful blow. My head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0031.desc.sc_attacker.POD_thousand_hell_stare.fatality:0 "They then counter with a powerful blow. My head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0031.desc.sc_attacker.POD_wind_attack.fatality:0 "I'm pushed back, barely keeping up. The duel doesn't last long after that, I'm out of my league."
 single_combat.0031.desc.sc_attacker.POD_demon_claws.fatality:0 "I'm hurt, but still standing. Until I'm not. It ends as it started, in darkness."
 single_combat.0031.desc.sc_attacker.POD_tormented_essence.fatality:0 "其还以强有力的反击。我的头没能受住，啪的一下掉到了地上。"
 single_combat.0031.desc.sc_attacker.POD_adamantums_wrath.fatality:0 "我受伤了，但我还站着。直到我站不住了。其终如其始。在黑暗之中。"
 single_combat.0041.desc.sc_defender.POD_bite:0 "我向前扑去，试图将我锋利的獠牙刺入我面前诱人的脖子。"
 single_combat.0041.desc.sc_defender.POD_blood_surge:0 "我催动了我的血之力获得力量。"
 single_combat.0041.desc.sc_defender.POD_blood_heal:0 "我催动了我的血之力来缝合我的伤口，并医治我自己。"
 single_combat.0041.desc.sc_defender.POD_blink:0 "我向前冲的速度比眼睛所能捕捉的还要快，希望我的对手没能预料到我的动作。"
 single_combat.0041.desc.sc_defender.POD_lightning_strike:0 "我用迅捷术的力量进行本能地攻击，试图抓住我的对手的破绽。"
 single_combat.0041.desc.sc_defender.POD_split_second:0 "随着迅捷术的生效，时间在我周围变慢了。我必须利用这个机会。"
 single_combat.0041.desc.sc_defender.POD_unerring_aim:0 "由于我对迅捷术的掌握，我的下一击将是绝对精准的。"
 single_combat.0041.desc.sc_defender.POD_lethal_body:0 "蛮力术使我能够以用雪崩般的冲击力蹦向我的对手。"
 single_combat.0041.desc.sc_defender.POD_brutal_feed:0 "我冲向前扑往颈部，期望能在几秒钟内就给我的对手放空血。"
 single_combat.0041.desc.sc_defender.POD_earthshock:0 "猛击大地，我将使地面在我等之下颤抖。"
 single_combat.0041.desc.sc_defender.POD_fist_of_caine:0 "多亏蛮力术，我的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0041.desc.sc_defender.POD_toughness:0 "我的肉体具有了非自然的抗性，应该能挡住任何来袭的攻击。"
 single_combat.0041.desc.sc_defender.POD_flesh_of_marble:0 "我的肉体变成了超自然的坚石，不再受任何损害。希望如此。"
 single_combat.0041.desc.sc_defender.POD_prowess_from_pain:0 "我的伤口供养我，让我在瞬间内变得更强大。"
 single_combat.0041.desc.sc_defender.POD_feral_weapons:0 "我的利爪长了出来，准备把我的对手劈成两半。"
 single_combat.0041.desc.sc_defender.POD_shapechange:0 "通过我的动物形态，我先用獠牙扑向我的对手。"
 single_combat.0041.desc.sc_defender.POD_vanish:0 "我从视线中消失，试图迷惑我的对手。"
 single_combat.0041.desc.sc_defender.POD_nocturne:0 "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0041.desc.sc_defender.POD_arms_of_ahriman:0 "黑色的触手从地里出现，试图攻击我的敌人。"
 single_combat.0041.desc.sc_defender.POD_the_darkness_within:0 "暗影在我的对手周围回旋，寻找破绽。"
 single_combat.0041.desc.sc_defender.POD_aegis_of_shadows:0 "暗影盔甲显现在我身上，保护我免受伤害。"
 single_combat.0041.desc.sc_defender.POD_compel:0 "我向我的对手发出了简短的命令。"
 single_combat.0041.desc.sc_defender.POD_terminal_decree:0 "我向我的对手发出命令，让其伤害自己。"
 single_combat.0041.desc.sc_defender.POD_daunt:0 "我变得更宏伟，更有力量，应该足以震慑我的敌人。"
 single_combat.0041.desc.sc_defender.POD_dread_gaze:0 "我显现为我敌人最惧怕的噩梦。"
 single_combat.0041.desc.sc_defender.POD_extinguish_vitae:0 "我手一挥，使我对手的血液静止了。"
 single_combat.0041.desc.sc_defender.POD_scorpions_touch:0 "我抽出一些我的血，将它转化为毒。"
 single_combat.0041.desc.sc_defender.POD_theft_of_vitae:0 "我让血从我的敌人喉内涌出，然后将它引向我。"
 single_combat.0041.desc.sc_defender.POD_baals_curse:0 "我抽出一些我的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0041.desc.sc_defender.POD_cauldron_of_blood:0 "随着我的手一挥，我让对手的血液在其血管中沸腾。"
 single_combat.0041.desc.sc_defender.POD_touch_of_oblivion:0 "我触碰我的对手，将湮灭的原始熵力注入其中。"
 single_combat.0041.desc.sc_defender.POD_stygian_shroud:0 "我将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0041.desc.sc_defender.POD_fire_torch:0 "I hope for a lucky break while swinging madly my torch."
 single_combat.0041.desc.sc_defender.POD_fire_bombs:0 "I launch the alchemical fire towards my opponent."
 single_combat.0041.desc.sc_defender.POD_fire_spewer:0 "The strange machine spits out fire wildly."
 single_combat.0041.desc.sc_defender.POD_crossbow_shot:0 "The shot is fired, seeking its target."
 single_combat.0041.desc.sc_defender.POD_unleash_dogs:0 "The dogs rush towards my foe, hungry for blood and flesh."
 single_combat.0041.desc.sc_defender.POD_stake_attack:0 "I lunge forwards stake first."
 single_combat.0041.desc.sc_defender.POD_oculi_trust:0 "The words of God are spoken, feeling my foe with dread."
 single_combat.0041.desc.sc_defender.POD_oculi_wine:0 "I lunge towards my opponent, seeking to make contact for my curse to take hold."
 single_combat.0041.desc.sc_defender.POD_acre_catechumen:0 "The words of God are spoken, feeling me with power."
 single_combat.0041.desc.sc_defender.POD_acre_flesh:0 "The words of God are spoken, feeling me with endurance."
 single_combat.0041.desc.sc_defender.POD_acre_flight:0 "Blessed by the Divine, I am quicker than ever."
 single_combat.0041.desc.sc_defender.POD_acre_auto:0 "I ready myself for what could be the final blow."
 single_combat.0041.desc.sc_defender.POD_murnau_mirror:0 "The mirror of God shows me the path to match this fiend's prowess."
 single_combat.0041.desc.sc_defender.POD_murnau_arcana:0 "I ready myself to take control over the fiend's powers."
 single_combat.0041.desc.sc_defender.POD_sisters_hosanna:0 "I sing the glory of God, filling me with strength."
 single_combat.0041.desc.sc_defender.POD_sisters_oratorio:0 "I sing the glory of God, filling my foe with horror."
 single_combat.0041.desc.sc_defender.POD_bone_obedience:0 "My bones start to become unbreakable."
 single_combat.0041.desc.sc_defender.POD_five_poison_cloud:0 "The black Yin energy of the cloud hurls towards my foe."
 single_combat.0041.desc.sc_defender.POD_ching_shih:0 "The terrible monster form is now mine "
 single_combat.0041.desc.sc_defender.POD_long_neck:0 "I extend my limbs, giving me limitless reach."
 single_combat.0041.desc.sc_defender.POD_bloodlash:0 "A tendril of blood is created, giving me new opportunities."
 single_combat.0041.desc.sc_defender.POD_goblin_scorch:0 "The spirit flames are hurled towards my opponent."
 single_combat.0041.desc.sc_defender.POD_goblin_lantern:0 "I turn into a glowing orb of fire."
 single_combat.0041.desc.sc_defender.POD_bone_dance:0 "The dance is completed, creating a veil of lethargy in the area."
 single_combat.0041.desc.sc_defender.POD_dragon_dance:0 "The dance is complete, and the trance has started."
 single_combat.0041.desc.sc_defender.POD_chi_interrupt:0 "I lunge for my opponent, looking for its critical Chi junctures."
 single_combat.0041.desc.sc_defender.POD_thousand_hell_stare:0 "Pain, anger and despair suddenly consume my opponent's soul."
 single_combat.0041.desc.sc_defender.POD_wind_attack:0 "The wind is on, and I am quicker than ever."
 single_combat.0041.desc.sc_defender.POD_demon_claws:0 "I am the demon and he is me. We will prevail."
 single_combat.0041.desc.sc_defender.POD_tormented_essence:0 "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
 single_combat.0041.desc.sc_defender.POD_adamantums_wrath:0 "我乃恶魔而其为我。我等将获胜。"
 single_combat.0041.desc.opponent_response.POD_bite:0 "我的敌人冲了过来，试图将其锋利的獠牙插入我诱人的脖子。"
 single_combat.0041.desc.opponent_response.POD_blood_surge:0 "我的敌人催动了其血之力来给予其力量。"
 single_combat.0041.desc.opponent_response.POD_blood_heal:0 "我的敌人催动了其血之力来缝合其的伤口。"
 single_combat.0041.desc.opponent_response.POD_blink:0 "我的敌人向我冲的速度比眼睛所能捕捉的还要快，希望我能预料到其动作。"
 single_combat.0041.desc.opponent_response.POD_lightning_strike:0 "我的敌人用迅捷术的力量进行本能地攻击，试图抓住我的破绽。"
 single_combat.0041.desc.opponent_response.POD_split_second:0 "随着迅捷术的生效，时间在我们周围变慢了。我的对手肯定会利用这个机会。"
 single_combat.0041.desc.opponent_response.POD_unerring_aim:0 "由于其对迅捷术的掌握，我敌人的下一击将是绝对精准的。"
 single_combat.0041.desc.opponent_response.POD_lethal_body:0 "通过蛮力术，我的对手得以用雪崩般的冲击力蹦向了我。"
 single_combat.0041.desc.opponent_response.POD_brutal_feed:0 "我的敌人冲向我扑往颈部，期望能在几秒钟内就给我放空血。"
 single_combat.0041.desc.opponent_response.POD_earthshock:0 "猛击大地，我的敌人使地面在我等之下颤抖。"
 single_combat.0041.desc.opponent_response.POD_fist_of_caine:0 "多亏蛮力术，我的敌人的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0041.desc.opponent_response.POD_toughness:0 "我的对手的肉体具有了非自然的抗性，也许能挡住任何来袭的攻击。"
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble:0 "我的对手的肉体变成了超自然的坚石，不再受任何损害。"
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain:0 "我的敌人伤口供养了其，让其在瞬间内变得更强大。"
 single_combat.0041.desc.opponent_response.POD_feral_weapons:0 "我敌人的利爪长了出来，准备把我劈成两半。"
 single_combat.0041.desc.opponent_response.POD_shapechange:0 "我敌人通过动物形态，先用獠牙扑向了我。"
 single_combat.0041.desc.opponent_response.POD_vanish:0 "我的敌人从视线中消失，试图迷惑我。"
 single_combat.0041.desc.opponent_response.POD_nocturne:0 "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman:0 "黑色的触手从地里出现，试图攻击我。"
 single_combat.0041.desc.opponent_response.POD_the_darkness_within:0 "暗影在我周围回旋，寻找破绽。"
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows:0 "暗影盔甲显现在我的敌人身上，保护其免受伤害。"
 single_combat.0041.desc.opponent_response.POD_compel:0 "我的对手通过支配术向我发出了简短的命令。"
 single_combat.0041.desc.opponent_response.POD_terminal_decree:0 "我的敌人向我发出命令，让我伤害自己。"
 single_combat.0041.desc.opponent_response.POD_daunt:0 "我的敌人变得更宏伟，更有力量，也许足以震慑我。"
 single_combat.0041.desc.opponent_response.POD_dread_gaze:0 "我的敌人显现为我最惧怕的噩梦。令人心烦意乱的景象。"
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae:0 "随着其的手一挥，我的敌人让我的血液静止了。"
 single_combat.0041.desc.opponent_response.POD_scorpions_touch:0 "我敌人抽出一些其的血液，将它转化为毒。"
 single_combat.0041.desc.opponent_response.POD_theft_of_vitae:0 "我的敌人让血从我喉内涌出，然后将它引向其口。"
 single_combat.0041.desc.opponent_response.POD_baals_curse:0 "我的敌人抽出一些其的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0041.desc.opponent_response.POD_cauldron_of_blood:0 "随着其的手一挥，我的敌人让我的血液在我的血管中沸腾。"
 single_combat.0041.desc.opponent_response.POD_touch_of_oblivion:0 "我的对手触碰了我，将湮灭的原始熵力注入我中。"
 single_combat.0041.desc.opponent_response.POD_stygian_shroud:0 "我的敌人将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0041.desc.opponent_response.POD_fire_torch:0 "My opponent hopes for a lucky break while swinging madly their torch."
 single_combat.0041.desc.opponent_response.POD_fire_bombs:0 "My opponent launches some alchemical fire towards me."
 single_combat.0041.desc.opponent_response.POD_fire_spewer:0 "My opponent's strange machine spits out fire wildly."
 single_combat.0041.desc.opponent_response.POD_crossbow_shot:0 "My opponent's shot is fired, seeking its target."
 single_combat.0041.desc.opponent_response.POD_unleash_dogs:0 "The dogs rush towards me, hungry for blood and flesh."
 single_combat.0041.desc.opponent_response.POD_stake_attack:0 "My foe lunges forwards stake first."
 single_combat.0041.desc.opponent_response.POD_oculi_trust:0 "The words of God are spoken, feeling me with dread."
 single_combat.0041.desc.opponent_response.POD_oculi_wine:0 "My foe lunges towards me, seeking to make contact for their curse to take hold."
 single_combat.0041.desc.opponent_response.POD_acre_catechumen:0 "The words of God are spoken, feeling my opponent with power."
 single_combat.0041.desc.opponent_response.POD_acre_flesh:0 "The words of God are spoken, feeling my opponent with endurance."
 single_combat.0041.desc.opponent_response.POD_acre_flight:0 "Blessed by the Divine, my foe is quicker than ever."
 single_combat.0041.desc.opponent_response.POD_acre_auto:0 "My opponent ready themselves for what could be the final blow."
 single_combat.0041.desc.opponent_response.POD_murnau_mirror:0 "The mirror of God shows my opponent the path to match my prowess."
 single_combat.0041.desc.opponent_response.POD_murnau_arcana:0 "My foe ready themselves to take control over my powers."
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna:0 "My opponent sings the glory of God, filling them with strength."
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio:0 "My opponent sings the glory of God, filling me with horror."
 single_combat.0041.desc.opponent_response.POD_bone_obedience:0 "My opponent's bones start to become unbreakable."
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud:0 "The black Yin energy of the cloud hurls towards me."
 single_combat.0041.desc.opponent_response.POD_ching_shih:0 "The terrible monster form is now facing me."
 single_combat.0041.desc.opponent_response.POD_long_neck:0 "My foe's extends their limbs, giving them limitless reach."
 single_combat.0041.desc.opponent_response.POD_bloodlash:0 "A tendril of blood is created, giving my opponent new opportunities."
 single_combat.0041.desc.opponent_response.POD_goblin_scorch:0 "The spirit flames are hurled towards me."
 single_combat.0041.desc.opponent_response.POD_goblin_lantern:0 "My opponent turns into a glowing orb of fire."
 single_combat.0041.desc.opponent_response.POD_bone_dance:0 "The dance is completed, creating a veil of lethargy in the area."
 single_combat.0041.desc.opponent_response.POD_dragon_dance:0 "The dance is complete, and the trance has started."
 single_combat.0041.desc.opponent_response.POD_chi_interrupt:0 "My foe lunges for me, looking for my critical Chi junctures."
 single_combat.0041.desc.opponent_response.POD_thousand_hell_stare:0 "Pain, anger and despair suddenly consume my soul."
 single_combat.0041.desc.opponent_response.POD_wind_attack:0 "The wind is on, and my opponent is quicker than ever."
 single_combat.0041.desc.opponent_response.POD_demon_claws:0 "My opponent has taken the form of a fearsome demon."
 single_combat.0041.desc.opponent_response.POD_tormented_essence:0 "痛苦、愤怒和绝望瞬间吞噬了我的灵魂。"
 single_combat.0041.desc.opponent_response.POD_adamantums_wrath:0 "我的对手已经变成了一位可怕的恶魔。"
 single_combat.0041.desc.opponent_response.POD_bite.injury:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。在为时已晚之前，其勉强从这个致命的擒抱中抽身而出。"
 single_combat.0041.desc.opponent_response.POD_blood_surge.injury:0 "我可以看到我变得更高、更强，被血赋予了力量。我迅速地利用了我的优势。"
 single_combat.0041.desc.opponent_response.POD_blood_heal.injury:0 "随着血之力对我的治疗，我所有的伤口都在我眼前消失了。我迅速的利用了我的优势。"
 single_combat.0041.desc.opponent_response.POD_blink.injury:0 "而其没料到，在狂攻之下，其很快就沦落到需要进行回复的地步。"
 single_combat.0041.desc.opponent_response.POD_lightning_strike.injury:0 "而我做到了，我的敌人很快就被该出其不意的攻击击退。"
 single_combat.0041.desc.opponent_response.POD_split_second.injury:0 "我的对手没有做好足够的准备，一发强烈的一击就向其袭来，对于其被扰乱的时间感来说这太快了。"
 single_combat.0041.desc.opponent_response.POD_unerring_aim.injury:0 "我的对手什么也做不了，只能接招，感得其的不死族肉体在抗议这种虐待。"
 single_combat.0041.desc.opponent_response.POD_lethal_body.injury:0 "我的对手勉强的站起来了，感觉像是一整栋屋子垮在了其身上。"
 single_combat.0041.desc.opponent_response.POD_brutal_feed.injury:0 "我的对手设法从该致命的擒抱中挣脱了出来，但还是感受到了我的獠牙所带来的剧痛。"
 single_combat.0041.desc.opponent_response.POD_earthshock.injury:0 "我的对手摔倒了，而我利用了这个机会残酷地攻击。其勉强避开了要落在其脖子上的那一击。"
 single_combat.0041.desc.opponent_response.POD_fist_of_caine.injury:0 "该暴风就像匕首一样刺入其的皮肤，每次唰过都会割掉其大片的永生血肉。"
 single_combat.0041.desc.opponent_response.POD_toughness.injury:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble.injury:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain.injury:0 "在这种可怕力量的推动下，我打出了可怕的一击，让我的对手踉跄后退。"
 single_combat.0041.desc.opponent_response.POD_feral_weapons.injury:0 "它近乎发生了，因为我的敌人勉强设法避免了绝对致命的一扫。"
 single_combat.0041.desc.opponent_response.POD_shapechange.injury:0 "我的对手被这突如其来的变化惊呆了，被我击中了，不得不用尽全力地推开我变成的怪物。"
 single_combat.0041.desc.opponent_response.POD_vanish.injury:0 "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.opponent_response.POD_nocturne.injury:0 "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.injury:0 "我的毒死后避开了其中一条，但没能避开第二条……而这些东西打人很疼。"
 single_combat.0041.desc.opponent_response.POD_the_darkness_within.injury:0 "它突然地冲进了我对手的喉中，其不得不动用其所有的意志力来驱赶它。"
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.injury:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.opponent_response.POD_compel.injury:0 "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.opponent_response.POD_terminal_decree.injury:0 "其顺从地做了，感到更多的是羞辱而不是痛苦。"
 single_combat.0041.desc.opponent_response.POD_daunt.injury:0 "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.opponent_response.POD_dread_gaze.injury:0 "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae.injury:0 "因此，我的对手突然感到变得相当虚弱，而心兽正在为预定的胜利而咆哮。"
 single_combat.0041.desc.opponent_response.POD_scorpions_touch.injury:0 "受此影响，我敌人感到了不适，行动迟缓了起来。"
 single_combat.0041.desc.opponent_response.POD_theft_of_vitae.injury:0 "我敌人无力阻止它，其宝贵的血是我的了！"
 single_combat.0041.desc.opponent_response.POD_baals_curse.injury:0 "受此影响，我敌人感到了不适，行动迟缓了起来。"
 single_combat.0041.desc.opponent_response.POD_cauldron_of_blood.injury:0 "烫！烫！"
 single_combat.0041.desc.opponent_response.POD_touch_of_oblivion.injury:0 "我敌人的血中突然混入了恶性的暗影，试图占据其的身体。这不是一个愉快的经历。"
 single_combat.0041.desc.opponent_response.POD_stygian_shroud.injury:0 "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.opponent_response.POD_fire_torch.injury:0 "My opponent barely dodges it, but not before some of the fire burns their flesh."
 single_combat.0041.desc.opponent_response.POD_fire_bombs.injury:0 "My opponent barely dodges it, but not before some of the fire burns their flesh."
 single_combat.0041.desc.opponent_response.POD_fire_spewer.injury:0 "My opponent barely dodges it, but not before some of the fire burns their flesh."
 single_combat.0041.desc.opponent_response.POD_crossbow_shot.injury:0 "It strikes my foe with a resounding sound, and they are beaten back for this round."
 single_combat.0041.desc.opponent_response.POD_unleash_dogs.injury:0 "My opponent dispatches them, but not quickly enough, they manage to tear at them for a while."
 single_combat.0041.desc.opponent_response.POD_stake_attack.injury:0 "The stake misses my opponent's heart, but still grazes them quite painfully."
 single_combat.0041.desc.opponent_response.POD_oculi_trust.injury:0 "As such, my foe is unable to avoid the next strike coming their way."
 single_combat.0041.desc.opponent_response.POD_oculi_wine.injury:0 "My opponent is hurt, and part of their flesh turn to ashes before they can entangle themselves."
 single_combat.0041.desc.opponent_response.POD_acre_catechumen.injury:0 "The next blow that strikes my foe is especially painful."
 single_combat.0041.desc.opponent_response.POD_acre_flesh.injury:0 "My opponent can't break my defense, and the counterattack is painful."
 single_combat.0041.desc.opponent_response.POD_acre_flight.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_acre_auto.injury:0 "Not quite, but it's still a very painful one as my foe recoils from it."
 single_combat.0041.desc.opponent_response.POD_murnau_mirror.injury:0 "As such, my foe is unable to avoid the next strike coming their way."
 single_combat.0041.desc.opponent_response.POD_murnau_arcana.injury:0 "Surprised, the backfire from it hurts my opponent pretty bad."
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna.injury:0 "The next blow that strikes my foe is especially painful."
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_bone_obedience.injury:0 "My opponent can't break my defense, and the counterattack is painful."
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud.injury:0 "My opponent is engulfed in it, and barely manages to escape before it's too late."
 single_combat.0041.desc.opponent_response.POD_ching_shih.injury:0 "Quicker, sturdier and stronger than they are, my foe is outmatched."
 single_combat.0041.desc.opponent_response.POD_long_neck.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_bloodlash.injury:0 "My opponent is surprised by it, and quickly beaten back by the assault."
 single_combat.0041.desc.opponent_response.POD_goblin_scorch.injury:0 "My opponent is engulfed in it, and barely manages to escape before it's too late."
 single_combat.0041.desc.opponent_response.POD_goblin_lantern.injury:0 "This strange tactic surprised my foe, and they are badly burnt before coming back to their senses."
 single_combat.0041.desc.opponent_response.POD_bone_dance.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_dragon_dance.injury:0 "Quicker, sturdier and stronger than they are, my foe is outmatched."
 single_combat.0041.desc.opponent_response.POD_chi_interrupt.injury:0 "My opponent is struck once, but manages to avoid the second one. Still painful though."
 single_combat.0041.desc.opponent_response.POD_thousand_hell_stare.injury:0 "In this difficult state of mind, my foe unable to defend themselves properly."
 single_combat.0041.desc.opponent_response.POD_wind_attack.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_demon_claws.injury:0 "Quicker, sturdier and stronger than they are, my foe is outmatched."
 single_combat.0041.desc.opponent_response.POD_tormented_essence.injury:0 "在这种艰难的心灵状态下，其无法准确地保护自己。"
 single_combat.0041.desc.opponent_response.POD_adamantums_wrath.injury:0 "比其更快、更准、更狠，其陷入下风。"
 single_combat.0041.desc.opponent_response.POD_bite.fatality:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。其很快就屈服于该迷吻，而我胜利的滋味是血腥且甜蜜的。"
 single_combat.0041.desc.opponent_response.POD_blood_surge.fatality:0 "我可以看到我变得更高，更强壮，被血赋予了力量。我迅速利用了我的优势，以以迅雷不及掩耳之势进行斩首的方式结束了战斗。败者的头颅在地上滚动着，直到与我的脚碰撞后才停了下来。"
 single_combat.0041.desc.opponent_response.POD_blood_heal.fatality:0 "随着血之力对我的治疗，我所有的伤口都在我眼前消失了。我迅速利用了我的优势，以以迅雷不及掩耳之势进行斩首的方式结束了战斗。败者的头颅在地上滚动着，直到与我的脚碰撞后才停了下来。"
 single_combat.0041.desc.opponent_response.POD_blink.fatality:0 "而其没料到。狂攻在其在我面前化为灰烬前不会停止。"
 single_combat.0041.desc.opponent_response.POD_lightning_strike.fatality:0 "而我做到了，我的敌人很快就被该出其不意的攻击击退。再退……再退……直到没有地方可以再退。"
 single_combat.0041.desc.opponent_response.POD_split_second.fatality:0 "我的对手没有做好足够的准备，一发强烈的一击就向其袭来，对于其被扰乱的时间感来说这太快了。这招将其适当地切成了两半，且令人舒适地对称。"
 single_combat.0041.desc.opponent_response.POD_unerring_aim.fatality:0 "我的对手什么也做不了，只能在看着我击中其两眼之间的位置。当他们向后倒下时，我没有抑制住胜利的喜悦。"
 single_combat.0041.desc.opponent_response.POD_lethal_body.fatality:0 "我的对手感觉像是一整栋屋子垮在了其身上，而当其陷入下风时，我占据了上风。所以这一切都结束了。"
 single_combat.0041.desc.opponent_response.POD_brutal_feed.fatality:0 "我的对手并没能设法从这个致命的擒抱中抽身。其很快就屈服于该迷吻，而我胜利的滋味是血腥且甜蜜的。"
 single_combat.0041.desc.opponent_response.POD_earthshock.fatality:0 "我的对手摔倒了，而我利用了这个机会残酷地攻击。其没能避开了要落在其脖子上的那一击。"
 single_combat.0041.desc.opponent_response.POD_fist_of_caine.fatality:0 "该暴风就像匕首一样刺入其的皮肤，每次唰过都会割掉其大片的永生血肉。直到只剩下一副骨架。随后便是灰烬。"
 single_combat.0041.desc.opponent_response.POD_toughness.fatality:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble.fatality:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain.fatality:0 "在这种可怕力量的推动下，我打出了强有力的一击，将敌人的内脏炸得血肉模糊。"
 single_combat.0041.desc.opponent_response.POD_feral_weapons.fatality:0 "而这一切都发生了，因为我的对手没能避开向其袭来的致命一扫。"
 single_combat.0041.desc.opponent_response.POD_shapechange.fatality:0 "我的对手被这突如其来的变化惊呆了，被我击中了，试图用尽全力地推开我变成的怪物。但这没有用，自然在这一回合已经赢了人类。"
 single_combat.0041.desc.opponent_response.POD_vanish.fatality:0 "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.opponent_response.POD_nocturne.fatality:0 "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.fatality:0 "我的对手避开了其中一条，但没有避开第二条……这使其又被弹向第一条。感谢猛烈抨击的触手我得到了胜利。"
 single_combat.0041.desc.opponent_response.POD_the_darkness_within.fatality:0 "它突然冲进了我对手的喉中，仅仅几秒钟后，一场血与影的爆炸结束了这场决斗。"
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.fatality:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.opponent_response.POD_compel.fatality:0 "这让我的敌人措手不及，我利用了这机会，干净利落地割断了其的脖子。"
 single_combat.0041.desc.opponent_response.POD_terminal_decree.fatality:0 "而其顺从地做了，一次又一次。我发出邪恶的笑声，因为我曾经的敌人把自己砸死了。"
 single_combat.0041.desc.opponent_response.POD_daunt.fatality:0 "这让我的敌人措手不及，我立刻将我的优势利用到了极点。"
 single_combat.0041.desc.opponent_response.POD_dread_gaze.fatality:0 "这让我的敌人措手不及，我立刻将我的优势利用到了极点。"
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae.fatality:0 "因此，我的对手突然感到变得相当虚弱，而心兽正在为预定的胜利而咆哮。我向前冲去，一拳打穿了心脏。"
 single_combat.0041.desc.opponent_response.POD_scorpions_touch.fatality:0 "受此影响，我敌人感到了不适，行动迟缓了起来。我仁慈将其赐死，用迅速的一击杀死其，而非死于毒的缓慢折磨。"
 single_combat.0041.desc.opponent_response.POD_theft_of_vitae.fatality:0 "我敌人无力阻止它，其宝贵的血是我的了！没有血，吸血鬼就只是灰烬。正如其很快在我面前证明的那样。"
 single_combat.0041.desc.opponent_response.POD_baals_curse.fatality:0 "受此影响，我敌人感到了不适，行动迟缓了起来。我仁慈将其赐死，用迅速的一击杀死其，而非死于毒的缓慢折磨。"
 single_combat.0041.desc.opponent_response.POD_cauldron_of_blood.fatality:0 "烫！烫！多么令人愉快的百变篝火。"
 single_combat.0041.desc.opponent_response.POD_touch_of_oblivion.fatality:0 "我敌人的血中突然混入了恶性的暗影，试图占据我的身体。当每一盎司的血液都被消灭时，暗影就会顺从地消失。"
 single_combat.0041.desc.opponent_response.POD_stygian_shroud.fatality:0 "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.opponent_response.POD_fire_torch.fatality:0 "My opponent's pitiful attack is then countered by a masterful strike. They won't recover from this one."
 single_combat.0041.desc.opponent_response.POD_fire_bombs.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.opponent_response.POD_fire_spewer.fatality:0 "My next strike is way more accurate though. It's a clean and satisfying head cut."
 single_combat.0041.desc.opponent_response.POD_crossbow_shot.fatality:0 "My next strike is way more accurate though. It's a clean and satisfying head cut."
 single_combat.0041.desc.opponent_response.POD_unleash_dogs.fatality:0 "I throw one of their dogs at them in retaliation. They catch him by reflexes, giving me more than enough time to score a critical blow."
 single_combat.0041.desc.opponent_response.POD_stake_attack.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.opponent_response.POD_oculi_trust.fatality:0 "They are quickly pushed back by my relentless assault. Cornered, they fall to the ground, helpless."
 single_combat.0041.desc.opponent_response.POD_oculi_wine.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.opponent_response.POD_acre_catechumen.fatality:0 "My counterattack catches them off guard and connects. The end comes in a flash of steel."
 single_combat.0041.desc.opponent_response.POD_acre_flesh.fatality:0 "It hurts quite a lot. Enough to distract them from the next blow. This one doesn't hurt for long."
 single_combat.0041.desc.opponent_response.POD_acre_flight.fatality:0 "Or even outmatch them, as I push them back. And back. Until there is no where left to go."
 single_combat.0041.desc.opponent_response.POD_acre_auto.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.opponent_response.POD_murnau_mirror.fatality:0 "They are pushed back, barely keeping up. Way out of their league!"
 single_combat.0041.desc.opponent_response.POD_murnau_arcana.fatality:0 "This one exploded right to their face. Then exploded their face as well."
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna.fatality:0 "My counterattack catches them off guard and connects. The end comes in a flash of steel."
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio.fatality:0 "My counterattack catches them off guard and connects. The end comes in a flash of steel."
 single_combat.0041.desc.opponent_response.POD_bone_obedience.fatality:0 "They are pushed back, barely keeping up. Way out of their league!"
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.opponent_response.POD_ching_shih.fatality:0 "They are hurt, but still standing. Until they are not. It ends as it started, in darkness."
 single_combat.0041.desc.opponent_response.POD_long_neck.fatality:0 "I don't, and my opponent is wounded. Badly enough that the rest of the fight is a certain affair."
 single_combat.0041.desc.opponent_response.POD_bloodlash.fatality:0 "Before connecting with a swift strike that injures them. Badly enough that the rest of the fight is a foregone conclusion."
 single_combat.0041.desc.opponent_response.POD_goblin_scorch.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.opponent_response.POD_goblin_lantern.fatality:0 "I then counter with a powerful blow. Their head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0041.desc.opponent_response.POD_bone_dance.fatality:0 "I then counter with a powerful blow. Their head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0041.desc.opponent_response.POD_dragon_dance.fatality:0 "They are pushed back, barely keeping up. Way out of their league!"
 single_combat.0041.desc.opponent_response.POD_chi_interrupt.fatality:0 "I then counter with a powerful blow. Their head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0041.desc.opponent_response.POD_thousand_hell_stare.fatality:0 "I then counter with a powerful blow. Their head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0041.desc.opponent_response.POD_wind_attack.fatality:0 "They are pushed back, barely keeping up. Way out of their league!"
 single_combat.0041.desc.opponent_response.POD_demon_claws.fatality:0 "They are hurt, but still standing. Until they are not. It ends as it started, in darkness."
 single_combat.0041.desc.opponent_response.POD_tormented_essence.fatality:0 "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.opponent_response.POD_adamantums_wrath.fatality:0 "其受伤了，但其还站着。直到其站不住了。其终如其始。于黑暗之中。"
 single_combat.0041.desc.sc_attacker.POD_bite:0 "我向前扑去，试图将我锋利的獠牙刺入我面前诱人的脖子。"
 single_combat.0041.desc.sc_attacker.POD_blood_surge:0 "我催动了我的血之力获得力量。"
 single_combat.0041.desc.sc_attacker.POD_blood_heal:0 "我催动了我的血之力来缝合我的伤口，并医治我自己。"
 single_combat.0041.desc.sc_attacker.POD_blink:0 "我向前冲的速度比眼睛所能捕捉的还要快，希望我的对手没能预料到我的动作。"
 single_combat.0041.desc.sc_attacker.POD_lightning_strike:0 "我用迅捷术的力量进行本能地攻击，试图抓住我的对手的破绽。"
 single_combat.0041.desc.sc_attacker.POD_split_second:0 "随着迅捷术的生效，时间在我周围变慢了。我必须利用这个机会。"
 single_combat.0041.desc.sc_attacker.POD_unerring_aim:0 "由于我对迅捷术的掌握，我的下一击将是绝对精准的。"
 single_combat.0041.desc.sc_attacker.POD_lethal_body:0 "蛮力术使我能够以用雪崩般的冲击力蹦向我的对手。"
 single_combat.0041.desc.sc_attacker.POD_brutal_feed:0 "我冲向前扑往颈部，期望能在几秒钟内就给我的对手放空血。"
 single_combat.0041.desc.sc_attacker.POD_earthshock:0 "猛击大地，我将使地面在我等之下颤抖。"
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine:0 "多亏蛮力术，我的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0041.desc.sc_attacker.POD_toughness:0 "我的肉体具有了非自然的抗性，应该能挡住任何来袭的攻击。"
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble:0 "我的肉体变成了超自然的坚石，不再受任何损害。希望如此。"
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain:0 "我的伤口供养我，让我在瞬间内变得更强大。"
 single_combat.0041.desc.sc_attacker.POD_feral_weapons:0 "我的利爪长了出来，准备把我的对手劈成两半。"
 single_combat.0041.desc.sc_attacker.POD_shapechange:0 "通过我的动物形态，我先用獠牙扑向我的对手。"
 single_combat.0041.desc.sc_attacker.POD_vanish:0 "我从视线中消失，试图迷惑我的对手。"
 single_combat.0041.desc.sc_attacker.POD_nocturne:0 "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman:0 "黑色的触手从地里出现，试图攻击我的敌人。"
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within:0 "暗影在我的对手周围回旋，寻找破绽。"
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows:0 "暗影盔甲显现在我身上，保护我免受伤害。"
 single_combat.0041.desc.sc_attacker.POD_compel:0 "我向我的对手发出了简短的命令。"
 single_combat.0041.desc.sc_attacker.POD_terminal_decree:0 "我向我的对手发出命令，让其伤害自己。"
 single_combat.0041.desc.sc_attacker.POD_daunt:0 "我变得更宏伟，更有力量，应该足以震慑我的敌人。"
 single_combat.0041.desc.sc_attacker.POD_dread_gaze:0 "我显现为我敌人最惧怕的噩梦。"
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae:0 "我手一挥，使我对手的血液静止了。"
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch:0 "我抽出一些我的血，将它转化为毒。"
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae:0 "我让血从我的敌人喉内涌出，然后将它引向我。"
 single_combat.0041.desc.sc_attacker.POD_baals_curse:0 "我抽出一些我的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood:0 "随着我的手一挥，我让对手的血液在其血管中沸腾。"
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion:0 "我触碰我的对手，将湮灭的原始熵力注入其中。"
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud:0 "我将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0041.desc.sc_attacker.POD_fire_torch:0 "I hope for a lucky break while swinging madly my torch."
 single_combat.0041.desc.sc_attacker.POD_fire_bombs:0 "I launch the alchemical fire towards my opponent."
 single_combat.0041.desc.sc_attacker.POD_fire_spewer:0 "The strange machine spits out fire wildly."
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot:0 "The shot is fired, seeking its target."
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs:0 "The dogs rush towards my foe, hungry for blood and flesh."
 single_combat.0041.desc.sc_attacker.POD_stake_attack:0 "I lunge forwards stake first."
 single_combat.0041.desc.sc_attacker.POD_oculi_trust:0 "The words of God are spoken, feeling my foe with dread."
 single_combat.0041.desc.sc_attacker.POD_oculi_wine:0 "I lunge towards my opponent, seeking to make contact for my curse to take hold."
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen:0 "The words of God are spoken, feeling me with power."
 single_combat.0041.desc.sc_attacker.POD_acre_flesh:0 "The words of God are spoken, feeling me with endurance."
 single_combat.0041.desc.sc_attacker.POD_acre_flight:0 "Blessed by the Divine, I am quicker than ever."
 single_combat.0041.desc.sc_attacker.POD_acre_auto:0 "I ready myself for what could be the final blow."
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror:0 "The mirror of God shows me the path to match this fiend's prowess."
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana:0 "I ready myself to take control over the fiend's powers."
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna:0 "I sing the glory of God, filling me with strength."
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio:0 "I sing the glory of God, filling my foe with horror."
 single_combat.0041.desc.sc_attacker.POD_bone_obedience:0 "My bones start to become unbreakable."
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud:0 "The black Yin energy of the cloud hurls towards my foe."
 single_combat.0041.desc.sc_attacker.POD_ching_shih:0 "The terrible monster form is now mine "
 single_combat.0041.desc.sc_attacker.POD_long_neck:0 "I extend my limbs, giving me limitless reach."
 single_combat.0041.desc.sc_attacker.POD_bloodlash:0 "A tendril of blood is created, giving me new opportunities."
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch:0 "The spirit flames are hurled towards my opponent."
 single_combat.0041.desc.sc_attacker.POD_goblin_lantern:0 "I turn into a glowing orb of fire."
 single_combat.0041.desc.sc_attacker.POD_bone_dance:0 "The dance is completed, creating a veil of lethargy in the area."
 single_combat.0041.desc.sc_attacker.POD_dragon_dance:0 "The dance is complete, and the trance has started."
 single_combat.0041.desc.sc_attacker.POD_chi_interrupt:0 "I lunge for my opponent, looking for its critical Chi junctures."
 single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare:0 "Pain, anger and despair suddenly consume my opponent's soul."
 single_combat.0041.desc.sc_attacker.POD_wind_attack:0 "The wind is on, and I am quicker than ever."
 single_combat.0041.desc.sc_attacker.POD_demon_claws:0 "I am the demon and he is me. We will prevail."
 single_combat.0041.desc.sc_attacker.POD_tormented_essence:0 "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
 single_combat.0041.desc.sc_attacker.POD_adamantums_wrath:0 "我乃恶魔而其为我。我等将获胜。"
 single_combat.0041.desc.sc_attacker.POD_bite.injury:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。在为时已晚之前，其勉强从这个致命的擒抱中抽身而出。"
 single_combat.0041.desc.sc_attacker.POD_blood_surge.injury:0 "我可以看到我变得更高、更强，被血赋予了力量。我迅速地利用了我的优势。"
 single_combat.0041.desc.sc_attacker.POD_blood_heal.injury:0 "随着血之力对我的治疗，我所有的伤口都在我眼前消失了。我迅速的利用了我的优势。"
 single_combat.0041.desc.sc_attacker.POD_blink.injury:0 "而其没料到，在狂攻之下，其很快就沦落到需要进行回复的地步。"
 single_combat.0041.desc.sc_attacker.POD_lightning_strike.injury:0 "而我做到了，我的敌人很快就被该出其不意的攻击击退。"
 single_combat.0041.desc.sc_attacker.POD_split_second.injury:0 "我的对手没有做好足够的准备，一发强烈的一击就向其袭来，对于其被扰乱的时间感来说这太快了。"
 single_combat.0041.desc.sc_attacker.POD_unerring_aim.injury:0 "我的对手什么也做不了，只能接招，感得其的不死族肉体在抗议这种虐待。"
 single_combat.0041.desc.sc_attacker.POD_lethal_body.injury:0 "我的对手勉强的站起来了，感觉像是一整栋屋子垮在了其身上。"
 single_combat.0041.desc.sc_attacker.POD_brutal_feed.injury:0 "我的对手设法从该致命的擒抱中挣脱了出来，但还是感受到了我的獠牙所带来的剧痛。"
 single_combat.0041.desc.sc_attacker.POD_earthshock.injury:0 "我的对手摔倒了，而我利用了这个机会残酷地攻击。其勉强避开了要落在其脖子上的那一击。"
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine.injury:0 "该暴风就像匕首一样刺入其的皮肤，每次唰过都会割掉其大片的永生血肉。"
 single_combat.0041.desc.sc_attacker.POD_toughness.injury:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble.injury:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain.injury:0 "在这种可怕力量的推动下，我打出了可怕的一击，让我的对手踉跄后退。"
 single_combat.0041.desc.sc_attacker.POD_feral_weapons.injury:0 "它近乎发生了，因为我的敌人勉强设法避免了绝对致命的一扫。"
 single_combat.0041.desc.sc_attacker.POD_shapechange.injury:0 "我的对手被这突如其来的变化惊呆了，被我击中了，不得不用尽全力地推开我变成的怪物。"
 single_combat.0041.desc.sc_attacker.POD_vanish.injury:0 "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.sc_attacker.POD_nocturne.injury:0 "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman.injury:0 "我的毒死后避开了其中一条，但没能避开第二条……而这些东西打人很疼。"
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within.injury:0 "它突然地冲进了我对手的喉中，其不得不动用其所有的意志力来驱赶它。"
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows.injury:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.sc_attacker.POD_compel.injury:0 "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.sc_attacker.POD_terminal_decree.injury:0 "其顺从地做了，感到更多的是羞辱而不是痛苦。"
 single_combat.0041.desc.sc_attacker.POD_daunt.injury:0 "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.sc_attacker.POD_dread_gaze.injury:0 "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.injury:0 "因此，我的对手突然感到变得相当虚弱，而心兽正在为预定的胜利而咆哮。"
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch.injury:0 "受此影响，我敌人感到了不适，行动迟缓了起来。"
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae.injury:0 "我敌人无力阻止它，其宝贵的血是我的了！"
 single_combat.0041.desc.sc_attacker.POD_baals_curse.injury:0 "受此影响，我敌人感到了不适，行动迟缓了起来。"
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood.injury:0 "烫！烫！"
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion.injury:0 "我敌人的血中突然混入了恶性的暗影，试图占据其的身体。这不是一个愉快的经历。"
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud.injury:0 "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.sc_attacker.POD_fire_torch.injury:0 "My opponent barely dodges it, but not before some of the fire burns their flesh."
 single_combat.0041.desc.sc_attacker.POD_fire_bombs.injury:0 "My opponent barely dodges it, but not before some of the fire burns their flesh."
 single_combat.0041.desc.sc_attacker.POD_fire_spewer.injury:0 "My opponent barely dodges it, but not before some of the fire burns their flesh."
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot.injury:0 "It strikes my foe with a resounding sound, and they are beaten back for this round."
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs.injury:0 "My opponent dispatches them, but not quickly enough, they manage to tear at them for a while."
 single_combat.0041.desc.sc_attacker.POD_stake_attack.injury:0 "The stake misses my opponent's heart, but still grazes them quite painfully."
 single_combat.0041.desc.sc_attacker.POD_oculi_trust.injury:0 "As such, my foe is unable to avoid the next strike coming their way."
 single_combat.0041.desc.sc_attacker.POD_oculi_wine.injury:0 "My opponent is hurt, and part of their flesh turn to ashes before they can entangle themselves."
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen.injury:0 "The next blow that strikes my foe is especially painful."
 single_combat.0041.desc.sc_attacker.POD_acre_flesh.injury:0 "My opponent can't break my defense, and the counterattack is painful."
 single_combat.0041.desc.sc_attacker.POD_acre_flight.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_acre_auto.injury:0 "Not quite, but it's still a very painful one as my foe recoils from it."
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror.injury:0 "As such, my foe is unable to avoid the next strike coming their way."
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana.injury:0 "Surprised, the backfire from it hurts my opponent pretty bad."
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna.injury:0 "The next blow that strikes my foe is especially painful."
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_bone_obedience.injury:0 "My opponent can't break my defense, and the counterattack is painful."
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud.injury:0 "My opponent is engulfed in it, and barely manages to escape before it's too late."
 single_combat.0041.desc.sc_attacker.POD_ching_shih.injury:0 "Quicker, sturdier and stronger than they are, my foe is outmatched."
 single_combat.0041.desc.sc_attacker.POD_long_neck.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_bloodlash.injury:0 "My opponent is surprised by it, and quickly beaten back by the assault."
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch.injury:0 "My opponent is engulfed in it, and barely manages to escape before it's too late."
 single_combat.0041.desc.sc_attacker.POD_goblin_lantern.injury:0 "This strange tactic surprised my foe, and they are badly burnt before coming back to their senses."
 single_combat.0041.desc.sc_attacker.POD_bone_dance.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_dragon_dance.injury:0 "Quicker, sturdier and stronger than they are, my foe is outmatched."
 single_combat.0041.desc.sc_attacker.POD_chi_interrupt.injury:0 "My opponent is struck once, but manages to avoid the second one. Still painful though."
 single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare.injury:0 "In this difficult state of mind, my foe unable to defend themselves properly."
 single_combat.0041.desc.sc_attacker.POD_wind_attack.injury:0 "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_demon_claws.injury:0 "Quicker, sturdier and stronger than they are, my foe is outmatched."
 single_combat.0041.desc.sc_attacker.POD_tormented_essence.injury:0 "在这种艰难的心灵状态下，其无法准确地保护自己。"
 single_combat.0041.desc.sc_attacker.POD_adamantums_wrath.injury:0 "比其更快、更准、更狠，其陷入下风。"
 single_combat.0041.desc.sc_attacker.POD_bite.fatality:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。其很快就屈服于该迷吻，而我胜利的滋味是血腥且甜蜜的。"
 single_combat.0041.desc.sc_attacker.POD_blood_surge.fatality:0 "我可以看到我变得更高，更强壮，被血赋予了力量。我迅速利用了我的优势，以以迅雷不及掩耳之势进行斩首的方式结束了战斗。败者的头颅在地上滚动着，直到与我的脚碰撞后才停了下来。"
 single_combat.0041.desc.sc_attacker.POD_blood_heal.fatality:0 "随着血之力对我的治疗，我所有的伤口都在我眼前消失了。我迅速利用了我的优势，以以迅雷不及掩耳之势进行斩首的方式结束了战斗。败者的头颅在地上滚动着，直到与我的脚碰撞后才停了下来。"
 single_combat.0041.desc.sc_attacker.POD_blink.fatality:0 "而其没料到。狂攻在其在我面前化为灰烬前不会停止。"
 single_combat.0041.desc.sc_attacker.POD_lightning_strike.fatality:0 "而我做到了，我的敌人很快就被该出其不意的攻击击退。再退……再退……直到没有地方可以再退。"
 single_combat.0041.desc.sc_attacker.POD_split_second.fatality:0 "我的对手没有做好足够的准备，一发强烈的一击就向其袭来，对于其被扰乱的时间感来说这太快了。这招将其适当地切成了两半，且令人舒适地对称。"
 single_combat.0041.desc.sc_attacker.POD_unerring_aim.fatality:0 "我的对手什么也做不了，只能在看着我击中其两眼之间的位置。当他们向后倒下时，我没有抑制住胜利的喜悦。"
 single_combat.0041.desc.sc_attacker.POD_lethal_body.fatality:0 "我的对手感觉像是一整栋屋子垮在了其身上，而当其陷入下风时，我占据了上风。所以这一切都结束了。"
 single_combat.0041.desc.sc_attacker.POD_brutal_feed.fatality:0 "我的对手并没能设法从这个致命的擒抱中抽身。其很快就屈服于该迷吻，而我胜利的滋味是血腥且甜蜜的。"
 single_combat.0041.desc.sc_attacker.POD_earthshock.fatality:0 "我的对手摔倒了，而我利用了这个机会残酷地攻击。其没能避开了要落在其脖子上的那一击。"
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine.fatality:0 "该暴风就像匕首一样刺入其的皮肤，每次唰过都会割掉其大片的永生血肉。直到只剩下一副骨架。随后便是灰烬。"
 single_combat.0041.desc.sc_attacker.POD_toughness.fatality:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble.fatality:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain.fatality:0 "在这种可怕力量的推动下，我打出了强有力的一击，将敌人的内脏炸得血肉模糊。"
 single_combat.0041.desc.sc_attacker.POD_feral_weapons.fatality:0 "而这一切都发生了，因为我的对手没能避开向其袭来的致命一扫。"
 single_combat.0041.desc.sc_attacker.POD_shapechange.fatality:0 "我的对手被这突如其来的变化惊呆了，被我击中了，试图用尽全力地推开我变成的怪物。但这没有用，自然在这一回合已经赢了人类。"
 single_combat.0041.desc.sc_attacker.POD_vanish.fatality:0 "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.sc_attacker.POD_nocturne.fatality:0 "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman.fatality:0 "我的对手避开了其中一条，但没有避开第二条……这使其又被弹向第一条。感谢猛烈抨击的触手我得到了胜利。"
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within.fatality:0 "它突然冲进了我对手的喉中，仅仅几秒钟后，一场血与影的爆炸结束了这场决斗。"
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows.fatality:0 "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.sc_attacker.POD_compel.fatality:0 "这让我的敌人措手不及，我利用了这机会，干净利落地割断了其的脖子。"
 single_combat.0041.desc.sc_attacker.POD_terminal_decree.fatality:0 "而其顺从地做了，一次又一次。我发出邪恶的笑声，因为我曾经的敌人把自己砸死了。"
 single_combat.0041.desc.sc_attacker.POD_daunt.fatality:0 "这让我的敌人措手不及，我立刻将我的优势利用到了极点。"
 single_combat.0041.desc.sc_attacker.POD_dread_gaze.fatality:0 "这让我的敌人措手不及，我立刻将我的优势利用到了极点。"
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.fatality:0 "因此，我的对手突然感到变得相当虚弱，而心兽正在为预定的胜利而咆哮。我向前冲去，一拳打穿了心脏。"
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch.fatality:0 "受此影响，我敌人感到了不适，行动迟缓了起来。我仁慈将其赐死，用迅速的一击杀死其，而非死于毒的缓慢折磨。"
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae.fatality:0 "我敌人无力阻止它，其宝贵的血是我的了！没有血，吸血鬼就只是灰烬。正如其很快在我面前证明的那样。"
 single_combat.0041.desc.sc_attacker.POD_baals_curse.fatality:0 "受此影响，我敌人感到了不适，行动迟缓了起来。我仁慈将其赐死，用迅速的一击杀死其，而非死于毒的缓慢折磨。"
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood.fatality:0 "烫！烫！多么令人愉快的百变篝火。"
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion.fatality:0 "我敌人的血中突然混入了恶性的暗影，试图占据我的身体。当每一盎司的血液都被消灭时，暗影就会顺从地消失。"
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud.fatality:0 "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.sc_attacker.POD_fire_torch.fatality:0 "My opponent's pitiful attack is then countered by a masterful strike. They won't recover from this one."
 single_combat.0041.desc.sc_attacker.POD_fire_bombs.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.sc_attacker.POD_fire_spewer.fatality:0 "My next strike is way more accurate though. It's a clean and satisfying head cut."
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot.fatality:0 "My next strike is way more accurate though. It's a clean and satisfying head cut."
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs.fatality:0 "I throw one of their dogs at them in retaliation. They catch him by reflexes, giving me more than enough time to score a critical blow."
 single_combat.0041.desc.sc_attacker.POD_stake_attack.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.sc_attacker.POD_oculi_trust.fatality:0 "They are quickly pushed back by my relentless assault. Cornered, they fall to the ground, helpless."
 single_combat.0041.desc.sc_attacker.POD_oculi_wine.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen.fatality:0 "My counterattack catches them off guard and connects. The end comes in a flash of steel."
 single_combat.0041.desc.sc_attacker.POD_acre_flesh.fatality:0 "It hurts quite a lot. Enough to distract them from the next blow. This one doesn't hurt for long."
 single_combat.0041.desc.sc_attacker.POD_acre_flight.fatality:0 "Or even outmatch them, as I push them back. And back. Until there is no where left to go."
 single_combat.0041.desc.sc_attacker.POD_acre_auto.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror.fatality:0 "They are pushed back, barely keeping up. Way out of their league!"
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana.fatality:0 "This one exploded right to their face. Then exploded their face as well."
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna.fatality:0 "My counterattack catches them off guard and connects. The end comes in a flash of steel."
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio.fatality:0 "My counterattack catches them off guard and connects. The end comes in a flash of steel."
 single_combat.0041.desc.sc_attacker.POD_bone_obedience.fatality:0 "They are pushed back, barely keeping up. Way out of their league!"
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.sc_attacker.POD_ching_shih.fatality:0 "They are hurt, but still standing. Until they are not. It ends as it started, in darkness."
 single_combat.0041.desc.sc_attacker.POD_long_neck.fatality:0 "I don't, and my opponent is wounded. Badly enough that the rest of the fight is a certain affair."
 single_combat.0041.desc.sc_attacker.POD_bloodlash.fatality:0 "Before connecting with a swift strike that injures them. Badly enough that the rest of the fight is a foregone conclusion."
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch.fatality:0 "They don't easily dodge the punch to their face that comes next though. Or the next one, until their head falls from their shoulders."
 single_combat.0041.desc.sc_attacker.POD_goblin_lantern.fatality:0 "I then counter with a powerful blow. Their head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0041.desc.sc_attacker.POD_bone_dance.fatality:0 "I then counter with a powerful blow. Their head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0041.desc.sc_attacker.POD_dragon_dance.fatality:0 "They are pushed back, barely keeping up. Way out of their league!"
 single_combat.0041.desc.sc_attacker.POD_chi_interrupt.fatality:0 "I then counter with a powerful blow. Their head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare.fatality:0 "I then counter with a powerful blow. Their head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0041.desc.sc_attacker.POD_wind_attack.fatality:0 "They are pushed back, barely keeping up. Way out of their league!"
 single_combat.0041.desc.sc_attacker.POD_demon_claws.fatality:0 "They are hurt, but still standing. Until they are not. It ends as it started, in darkness."
 single_combat.0041.desc.sc_attacker.POD_tormented_essence.fatality:0 "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.sc_attacker.POD_adamantums_wrath.fatality:0 "其受伤了，但其还站着。直到其站不住了。其终如其始。于黑暗之中。"
