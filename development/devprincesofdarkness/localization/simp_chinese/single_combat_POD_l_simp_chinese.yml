 single_combat.0031.desc.sc_attacker.POD_five_poison_cloud.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_ching_shih.fatality:0 "I'm hurt, but still standing. Until I'm not. It ends as it started, in darkness."
 single_combat.0031.desc.sc_attacker.POD_long_neck.fatality:0 "My opponent doesn't, and I'm wounded. Badly enough that the rest of the fight is a certain affair."
 single_combat.0031.desc.sc_attacker.POD_bloodlash.fatality:0 "Before connecting with a swift strike that injures me. Badly enough that the rest of the fight is a foregone conclusion."
 single_combat.0031.desc.sc_attacker.POD_goblin_scorch.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_goblin_lantern.fatality:0 "They then counter with a powerful blow. My head doesn't like it, and decides to fall to the floor in protest."
 single_combat.0031.desc.sc_attacker.POD_bone_dance.fatality:0 "They then counter with a powerful blow. My head doesn't like it, and decides to fall to the floor in protest."
