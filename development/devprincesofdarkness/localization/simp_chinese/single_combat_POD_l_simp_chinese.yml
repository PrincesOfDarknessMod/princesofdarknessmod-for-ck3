 single_combat.0031.desc.sc_attacker.POD_goblin_scorch.fatality:0 "不过，我没能轻易躲开接下来打在我脸上的那一拳。或者下一击，直到我的头从肩膀上掉下来。"
 single_combat.0031.desc.sc_attacker.POD_goblin_lantern.fatality:0 "其还以强有力的反击。我的头没能受住，啪的一下掉到了地上。"
 single_combat.0031.desc.sc_attacker.POD_bone_dance.fatality:0 "其还以强有力的反击。我的头没能受住，啪的一下掉到了地上。"
 single_combat.0031.desc.sc_attacker.POD_dragon_dance.fatality:0 "我被推了回去，近乎不能站稳。决斗没持续多久，我出局了。"
 single_combat.0031.desc.sc_attacker.POD_chi_interrupt.fatality:0 "其还以强有力的反击。我的头没能受住，啪的一下掉到了地上。"
 single_combat.0031.desc.sc_attacker.POD_thousand_hell_stare.fatality:0 "其还以强有力的反击。我的头没能受住，啪的一下掉到了地上。"
 single_combat.0031.desc.sc_attacker.POD_wind_attack.fatality:0 "我被推了回去，近乎不能站稳。决斗没持续多久，我出局了。"
 single_combat.0031.desc.sc_attacker.POD_demon_claws.fatality:0 "我受伤了，但我还站着。直到我站不住了。其终如其始。在黑暗之中。"
 single_combat.0031.desc.sc_attacker.POD_tormented_essence.fatality:0 "其还以强有力的反击。我的头没能受住，啪的一下掉到了地上。"
 single_combat.0031.desc.sc_attacker.POD_adamantums_wrath.fatality:0 "我受伤了，但我还站着。直到我站不住了。其终如其始。在黑暗之中。"
 single_combat.0041.desc.sc_defender.POD_bite:0 "我向前扑去，试图将我锋利的獠牙刺入我面前诱人的脖子。"
 single_combat.0041.desc.sc_defender.POD_blood_surge:0 "我催动了我的血之力获得力量。"
 single_combat.0041.desc.sc_defender.POD_blood_heal:0 "我催动了我的血之力来缝合我的伤口，并医治我自己。"
 single_combat.0041.desc.sc_defender.POD_blink:0 "我向前冲的速度比眼睛所能捕捉的还要快，希望我的对手没能预料到我的动作。"
 single_combat.0041.desc.sc_defender.POD_lightning_strike:0 "我用迅捷术的力量进行本能地攻击，试图抓住我的对手的破绽。"
 single_combat.0041.desc.sc_defender.POD_split_second:0 "随着迅捷术的生效，时间在我周围变慢了。我必须利用这个机会。"
 single_combat.0041.desc.sc_defender.POD_unerring_aim:0 "由于我对迅捷术的掌握，我的下一击将是绝对精准的。"
 single_combat.0041.desc.sc_defender.POD_lethal_body:0 "蛮力术使我能够以用雪崩般的冲击力蹦向我的对手。"
 single_combat.0041.desc.sc_defender.POD_brutal_feed:0 "我冲向前扑往颈部，期望能在几秒钟内就给我的对手放空血。"
 single_combat.0041.desc.sc_defender.POD_earthshock:0 "猛击大地，我将使地面在我等之下颤抖。"
 single_combat.0041.desc.sc_defender.POD_fist_of_caine:0 "多亏蛮力术，我的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0041.desc.sc_defender.POD_toughness:0 "我的肉体具有了非自然的抗性，应该能挡住任何来袭的攻击。"
 single_combat.0041.desc.sc_defender.POD_flesh_of_marble:0 "我的肉体变成了超自然的坚石，不再受任何损害。希望如此。"
 single_combat.0041.desc.sc_defender.POD_prowess_from_pain:0 "我的伤口供养我，让我在瞬间内变得更强大。"
 single_combat.0041.desc.sc_defender.POD_feral_weapons:0 "我的利爪长了出来，准备把我的对手劈成两半。"
 single_combat.0041.desc.sc_defender.POD_shapechange:0 "通过我的动物形态，我先用獠牙扑向我的对手。"
 single_combat.0041.desc.sc_defender.POD_vanish:0 "我从视线中消失，试图迷惑我的对手。"
 single_combat.0041.desc.sc_defender.POD_nocturne:0 "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0041.desc.sc_defender.POD_arms_of_ahriman:0 "黑色的触手从地里出现，试图攻击我的敌人。"
 single_combat.0041.desc.sc_defender.POD_the_darkness_within:0 "暗影在我的对手周围回旋，寻找破绽。"
 single_combat.0041.desc.sc_defender.POD_aegis_of_shadows:0 "暗影盔甲显现在我身上，保护我免受伤害。"
 single_combat.0041.desc.sc_defender.POD_compel:0 "我向我的对手发出了简短的命令。"
 single_combat.0041.desc.sc_defender.POD_terminal_decree:0 "我向我的对手发出命令，让其伤害自己。"
 single_combat.0041.desc.sc_defender.POD_daunt:0 "我变得更宏伟，更有力量，应该足以震慑我的敌人。"
 single_combat.0041.desc.sc_defender.POD_dread_gaze:0 "我显现为我敌人最惧怕的噩梦。"
 single_combat.0041.desc.sc_defender.POD_extinguish_vitae:0 "我手一挥，使我对手的血液静止了。"
 single_combat.0041.desc.sc_defender.POD_scorpions_touch:0 "我抽出一些我的血，将它转化为毒。"
 single_combat.0041.desc.sc_defender.POD_theft_of_vitae:0 "我让血从我的敌人喉内涌出，然后将它引向我。"
 single_combat.0041.desc.sc_defender.POD_baals_curse:0 "我抽出一些我的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0041.desc.sc_defender.POD_cauldron_of_blood:0 "随着我的手一挥，我让对手的血液在其血管中沸腾。"
 single_combat.0041.desc.sc_defender.POD_touch_of_oblivion:0 "我触碰我的对手，将湮灭的原始熵力注入其中。"
 single_combat.0041.desc.sc_defender.POD_stygian_shroud:0 "我将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0041.desc.sc_defender.POD_fire_torch:0 "我疯狂地挥舞火炬期望能幸运的击中。"
 single_combat.0041.desc.sc_defender.POD_fire_bombs:0 "我向我的对手丢出炼金火。"
 single_combat.0041.desc.sc_defender.POD_fire_spewer:0 "奇怪的机器开始疯狂喷火"
 single_combat.0041.desc.sc_defender.POD_crossbow_shot:0 "我对着目标一箭射出。"
 single_combat.0041.desc.sc_defender.POD_unleash_dogs:0 "充满着对血和肉的渴望，这些狗冲向我的敌人。"
 single_combat.0041.desc.sc_defender.POD_stake_attack:0 "我带着尖桩向前冲出。"
 single_combat.0041.desc.sc_defender.POD_oculi_trust:0 "天主之语被口述而出，我的敌人感到了畏惧。"
 single_combat.0041.desc.sc_defender.POD_oculi_wine:0 "我向我的对手冲去，想要碰到其便我的诅咒能够生效。"
 single_combat.0041.desc.sc_defender.POD_acre_catechumen:0 "天主之语被口述而出，给予了我力量。"
 single_combat.0041.desc.sc_defender.POD_acre_flesh:0 "天主之语被口述而出，给予了我坚韧。"
 single_combat.0041.desc.sc_defender.POD_acre_flight:0 "在神圣的保佑下，我从未如此之快。"
 single_combat.0041.desc.sc_defender.POD_acre_auto:0 "我准备好了最后一击。"
 single_combat.0041.desc.sc_defender.POD_murnau_mirror:0 "上帝之镜为我指明了与这个魔物的勇武相匹配的途径。"
 single_combat.0041.desc.sc_defender.POD_murnau_arcana:0 "我准备好接管这个魔物的力量了。"
 single_combat.0041.desc.sc_defender.POD_sisters_hosanna:0 "我歌颂上帝的荣耀，这使我充满了力量。"
 single_combat.0041.desc.sc_defender.POD_sisters_oratorio:0 "我歌颂上帝的荣耀，这使我敌人充满了惊恐。"
 single_combat.0041.desc.sc_defender.POD_bone_obedience:0 "我的骨头开始变得牢不可破。"
 single_combat.0041.desc.sc_defender.POD_five_poison_cloud:0 "阴气云雾向我敌人飘了过去。"
 single_combat.0041.desc.sc_defender.POD_ching_shih:0 "当前这可怖的怪物形态就是我"
 single_combat.0041.desc.sc_defender.POD_long_neck:0 "我伸展我的四肢，让我能无不可及。"
 single_combat.0041.desc.sc_defender.POD_bloodlash:0 "一条条血鞭被制造了出来，给了我新的机会。"
 single_combat.0041.desc.sc_defender.POD_goblin_scorch:0 "真火向我的敌人飘了过去。"
 single_combat.0041.desc.sc_defender.POD_goblin_lantern:0 "我变成了一团鬼火太阳。"
 single_combat.0041.desc.sc_defender.POD_bone_dance:0 "舞蹈已成，在该地区形成了一层让人昏昏欲睡的幔幕。"
