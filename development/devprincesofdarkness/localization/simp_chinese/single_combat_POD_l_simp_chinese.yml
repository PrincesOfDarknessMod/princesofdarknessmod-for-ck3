 single_combat.0031.desc.opponent_response.POD_fire_bombs:0 "My opponent launches some alchemical fire towards me."
 single_combat.0031.desc.opponent_response.POD_fire_spewer:0 "My opponent's strange machine spits out fire wildly."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot:0 "My opponent's shot is fired, seeking its target."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs:0 "The dogs rush towards me, hungry for blood and flesh."
 single_combat.0031.desc.opponent_response.POD_stake_attack:0 "My foe lunges forwards stake first."
 single_combat.0031.desc.opponent_response.POD_oculi_trust:0 "The words of God are spoken, feeling me with dread."
 single_combat.0031.desc.opponent_response.POD_oculi_wine:0 "My foe lunges towards me, seeking to make contact for their curse to take hold."
 single_combat.0031.desc.opponent_response.POD_acre_catechumen:0 "The words of God are spoken, feeling my opponent with power."
 single_combat.0031.desc.opponent_response.POD_acre_flesh:0 "The words of God are spoken, feeling my opponent with endurance."
 single_combat.0031.desc.opponent_response.POD_acre_flight:0 "Blessed by the Divine, my foe is quicker than ever."
 single_combat.0031.desc.opponent_response.POD_acre_auto:0 "My opponent ready themselves for what could be the final blow."
 single_combat.0031.desc.opponent_response.POD_murnau_mirror:0 "The mirror of God shows my opponent the path to match my prowess."
 single_combat.0031.desc.opponent_response.POD_murnau_arcana:0 "My foe ready themselves to take control over my powers."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna:0 "My opponent sings the glory of God, filling them with strength."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio:0 "My opponent sings the glory of God, filling me with horror."
 single_combat.0031.desc.opponent_response.POD_bone_obedience:0 "My opponent's bones start to become unbreakable."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud:0 "The black Yin energy of the cloud hurls towards me."
 single_combat.0031.desc.opponent_response.POD_ching_shih:0 "The terrible monster form is now facing me."
 single_combat.0031.desc.opponent_response.POD_long_neck:0 "My foe's extends their limbs, giving them limitless reach."
 single_combat.0031.desc.opponent_response.POD_bloodlash:0 "A tendril of blood is created, giving my opponent new opportunities."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch:0 "The spirit flames are hurled towards me."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern:0 "My opponent turns into a glowing orb of fire."
 single_combat.0031.desc.opponent_response.POD_bone_dance:0 "The dance is completed, creating a veil of lethargy in the area."
 single_combat.0031.desc.opponent_response.POD_dragon_dance:0 "The dance is complete, and the trance has started."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt:0 "My foe lunges for me, looking for my critical Chi junctures."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare:0 "Pain, anger and despair suddenly consume my soul."
 single_combat.0031.desc.opponent_response.POD_wind_attack:0 "The wind is on, and my opponent is quicker than ever."
 single_combat.0031.desc.opponent_response.POD_demon_claws:0 "My opponent has taken the form of a fearsome demon."
 single_combat.0031.desc.opponent_response.POD_tormented_essence:0 "Pain, anger and despair suddenly consume my soul."
 single_combat.0031.desc.opponent_response.POD_adamantums_wrath:0 "My opponent has taken the form of a fearsome demon."
 single_combat.0031.desc.opponent_response.POD_bite.injury:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。在为时已晚之前，我勉强从该致命的擒抱中抽身而出。"
 single_combat.0031.desc.opponent_response.POD_blood_surge.injury:0 "即使从我现在所处的位置，我也能看到其变得更高、更强，被血赋予了力量。"
 single_combat.0031.desc.opponent_response.POD_blood_heal.injury:0 "血之力治愈了我的敌人，我眼睁睁的见着我之前所做的努力都白费了。"
 single_combat.0031.desc.opponent_response.POD_blink.injury:0 "而我没料到，在狂攻之下，我很快就沦落到需要进行回复的地步。"
 single_combat.0031.desc.opponent_response.POD_lightning_strike.injury:0 "而其做到了，我很快就被该出其不意的攻击击退。"
 single_combat.0031.desc.opponent_response.POD_split_second.injury:0 "我没有做好足够的准备，一发强烈的一击就向我袭来，对于我被扰乱的时间感来说这太快了。"
 single_combat.0031.desc.opponent_response.POD_unerring_aim.injury:0 "我什么也做不了，只能接招，我感得我的不死族肉体在抗议这种虐待。"
 single_combat.0031.desc.opponent_response.POD_lethal_body.injury:0 "我勉强的站起来了，感觉像是一整栋屋子垮在了我身上。"
 single_combat.0031.desc.opponent_response.POD_brutal_feed.injury:0 "感受到对手的獠牙带来的剧痛后，我设法从该致命的擒抱中抽身而出。"
 single_combat.0031.desc.opponent_response.POD_earthshock.injury:0 "I fall and my opponent uses this opportunity to brutally strike me. I barely avoid the blow landing on my neck."
 single_combat.0031.desc.opponent_response.POD_fist_of_caine.injury:0 "This tempest is like daggers to my skin, cutting large swathes of my undead flesh with each movement."
 single_combat.0031.desc.opponent_response.POD_toughness.injury:0 "Nothing seems to be able to pierce this defense. I exhaust myself trying to break through."
 single_combat.0031.desc.opponent_response.POD_flesh_of_marble.injury:0 "Nothing seems to be able to pierce this defense. I exhaust myself trying to break through."
 single_combat.0031.desc.opponent_response.POD_prowess_from_pain.injury:0 "Fueled by this terrible power, my opponent strikes a terrible blow that has me stumbling back."
 single_combat.0031.desc.opponent_response.POD_feral_weapons.injury:0 "And it almost happens, as I barely manage to avoid a certainly fatal swipe coming my way."
 single_combat.0031.desc.opponent_response.POD_shapechange.injury:0 "Surprised by this sudden change, I'm hit and have to furiously push back the monster from me."
 single_combat.0031.desc.opponent_response.POD_vanish.injury:0 "As such, I don't see the next blow coming from behind me. And it hurts."
 single_combat.0031.desc.opponent_response.POD_nocturne.injury:0 "As such, I don't see the next blow coming from behind me. And it hurts."
 single_combat.0031.desc.opponent_response.POD_arms_of_ahriman.injury:0 "I avoid one of them but not the second... and these things hurt."
 single_combat.0031.desc.opponent_response.POD_the_darkness_within.injury:0 "They suddenly jump into my mouth, and I have to use all my willpower to expel them."
 single_combat.0031.desc.opponent_response.POD_aegis_of_shadows.injury:0 "Nothing seems to be able to pierce this defense. I exhaust myself trying to break through."
 single_combat.0031.desc.opponent_response.POD_compel.injury:0 "It catches me off guard, and I'm soon recovering from a blow struck while I was distracted."
 single_combat.0031.desc.opponent_response.POD_terminal_decree.injury:0 "Which I obediently do, first feeling humiliation than pain."
 single_combat.0031.desc.opponent_response.POD_daunt.injury:0 "It catches me off guard, and I'm soon recovering from a blow struck while I was distracted."
 single_combat.0031.desc.opponent_response.POD_dread_gaze.injury:0 "It catches me off guard, and I'm soon recovering from a blow struck while I was distracted."
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae.injury:0 "As such, I'm suddenly feeling quite weaker and the Beast is roaring in anger."
 single_combat.0031.desc.opponent_response.POD_scorpions_touch.injury:0 "Struck by it, I'm feeling sick and my movements are sluggish."
 single_combat.0031.desc.opponent_response.POD_theft_of_vitae.injury:0 "I am powerless to stop it, my precious blood!"
 single_combat.0031.desc.opponent_response.POD_baals_curse.injury:0 "Hurt by it, I'm feeling sick and my movements are sluggish."
 single_combat.0031.desc.opponent_response.POD_cauldron_of_blood.injury:0 "烫！烫！"
 single_combat.0031.desc.opponent_response.POD_touch_of_oblivion.injury:0 "我的血中突然混入了恶性的暗影，试图占据我的身体。这不是一个愉快的经历。"
 single_combat.0031.desc.opponent_response.POD_stygian_shroud.injury:0 "因此，我没能预到来自我背后的下一击。而这很痛。"
 single_combat.0031.desc.opponent_response.POD_fire_torch.injury:0 "I barely dodge it, but not before some of the fire burns my flesh."
 single_combat.0031.desc.opponent_response.POD_fire_bombs.injury:0 "I barely dodge it, but not before some of the fire burns my flesh."
 single_combat.0031.desc.opponent_response.POD_fire_spewer.injury:0 "I barely dodge it, but not before some of the fire burns my flesh."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot.injury:0 "It strikes me with a resounding sound, and I'm beaten back for this round."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs.injury:0 "I dispatch them, but not quickly enough, they manage to tear at me for a while."
 single_combat.0031.desc.opponent_response.POD_stake_attack.injury:0 "The stake misses my heart, but still grazes me quite painfully."
 single_combat.0031.desc.opponent_response.POD_oculi_trust.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_oculi_wine.injury:0 "I'm hurt, and part of my flesh turn to ashes before I can entangle myself."
 single_combat.0031.desc.opponent_response.POD_acre_catechumen.injury:0 "The next blow that strikes me is especially painful."
 single_combat.0031.desc.opponent_response.POD_acre_flesh.injury:0 "I can't break my opponent's defense, and the counterattack is painful."
 single_combat.0031.desc.opponent_response.POD_acre_flight.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_acre_auto.injury:0 "Not quite, but it's still a very painful one as I recoil from it."
 single_combat.0031.desc.opponent_response.POD_murnau_mirror.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_murnau_arcana.injury:0 "Surprised, the backfire from it hurts me pretty bad."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna.injury:0 "The next blow that strikes me is especially painful."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_bone_obedience.injury:0 "I can't break my opponent's defense, and the counterattack is painful."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud.injury:0 "I'm engulfed in it, and barely manages to escape before it's too late."
 single_combat.0031.desc.opponent_response.POD_ching_shih.injury:0 "Quicker, sturdier and stronger than me, I'm outmatched."
 single_combat.0031.desc.opponent_response.POD_long_neck.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_bloodlash.injury:0 "I'm surprised by it, and quickly beaten back by the assault."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch.injury:0 "I'm engulfed in it, and barely manages to escape before it's too late."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern.injury:0 "This strange tactic surprised me, and I'm badly burnt before coming back to my senses."
 single_combat.0031.desc.opponent_response.POD_bone_dance.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_dragon_dance.injury:0 "Quicker, sturdier and stronger than me, I'm outmatched."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt.injury:0 "I'm struck once, but manage to avoid the second one. Still painful though."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare.injury:0 "In this difficult state of mind, I'm unable to defend myself properly."
 single_combat.0031.desc.opponent_response.POD_wind_attack.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_demon_claws.injury:0 "Quicker, sturdier and stronger than me, I'm outmatched."
 single_combat.0031.desc.opponent_response.POD_tormented_essence.injury:0 "In this difficult state of mind, I'm unable to defend myself properly."
 single_combat.0031.desc.opponent_response.POD_adamantums_wrath.injury:0 "Quicker, sturdier and stronger than me, I'm outmatched."
 single_combat.0031.desc.opponent_response.POD_bite.fatality:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。当我迷失在这一迷吻带来的狂愉中时，想要抽身已经太晚了。接下來的事大家都知道了，不过该事跟我无关了。"
 single_combat.0031.desc.opponent_response.POD_blood_surge.fatality:0 "即使从我现在所处的位置，我也能看到其变得更高、更强，被血赋予了力量。突然间其变得极猛极快，我甚至没有看到那一击的到来，就被切成了两半。"
 single_combat.0031.desc.opponent_response.POD_blood_heal.fatality:0 "血之力治愈了我的敌人，我眼睁睁的见着我之前所做的努力都白费了。突然间其变得极猛极快，我甚至没有看到那一击的到来，就被切成了两半。"
 single_combat.0031.desc.opponent_response.POD_blink.fatality:0 "而我没料到。狂攻还未停止，或者至少在我还活着的时候不会停止。"
 single_combat.0031.desc.opponent_response.POD_lightning_strike.fatality:0 "而其做到了，我很快就被该出其不意的攻击击退。我的对手利用这个机会再次攻击我，我瘫倒在地，无力阻止终结一击。"
 single_combat.0031.desc.opponent_response.POD_split_second.fatality:0 "我没有做好足够的准备，一发强烈的一击就向我袭来，对于我被扰乱的时间感来说这太快了。那是我最后一次感受到的感知。"
 single_combat.0031.desc.opponent_response.POD_unerring_aim.fatality:0 "我什么也做不了，只能在看着其击中我两眼之间的位置。我的对手冷笑着看着我倒下，无力再保护自己。"
 single_combat.0031.desc.opponent_response.POD_lethal_body.fatality:0 "感觉像是一整栋屋子垮在了我身上，我只见着我的对手把我的头夹在其的双手之间并……结束了。"
 single_combat.0031.desc.opponent_response.POD_brutal_feed.fatality:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。当我迷失在这一迷吻带来的狂愉中时，想要抽身已经太晚了。接下來的事大家都知道了，不过该事跟我无关了。"
 single_combat.0031.desc.opponent_response.POD_earthshock.fatality:0 "I fall and my opponent uses this opportunity to brutally strike me. I can't avoid the blow landing on my neck. My head rolls on the floor and stops at my opponent's feet."
 single_combat.0031.desc.opponent_response.POD_fist_of_caine.fatality:0 "This tempest is like daggers to my skin, cutting large swathes of my undead flesh with each movement. I'm quickly reduced to a skeleton, and even quicker to ashes."
 single_combat.0031.desc.opponent_response.POD_toughness.fatality:0 "Nothing seems to be able to pierce this defense. I exhaust myself trying to break through. I don't see the counterattack coming, and I will never see anything else coming again."
 single_combat.0031.desc.opponent_response.POD_flesh_of_marble.fatality:0 "Nothing seems to be able to pierce this defense. I exhaust myself trying to break through. I don't see the counterattack coming, and I will never see anything else coming again."
 single_combat.0031.desc.opponent_response.POD_prowess_from_pain.fatality:0 "Fueled by this terrible power, my opponent strikes a terrible blow that reduce my undead heart to a pulp. It does a painful sound as everything goes dark."
 single_combat.0031.desc.opponent_response.POD_feral_weapons.fatality:0 "And it happens, the only saving grace being that it don't hurt for long."
 single_combat.0031.desc.opponent_response.POD_shapechange.fatality:0 "Surprised by this sudden change, I'm hit and soon gored to true death by this monster."
 single_combat.0031.desc.opponent_response.POD_vanish.fatality:0 "As such, I don't see the next blow coming from behind me. And it rips my guts apart, making a mess all around as I explode into blood and gore."
 single_combat.0031.desc.opponent_response.POD_nocturne.fatality:0 "As such, I don't see the next blow coming from behind me. And it rips my guts apart, making a mess all around as I explode into blood and gore."
 single_combat.0031.desc.opponent_response.POD_arms_of_ahriman.fatality:0 "I avoid one of them but not the second... and it bounces me back towards the first one. I serve as a punching bag for a while before everything goes dark."
 single_combat.0031.desc.opponent_response.POD_the_darkness_within.fatality:0 "They suddenly jump into my mouth, and I have to use all my willpower to expel them. I don't manage to do it in time and my blood, and myself, disappear into darkness."
 single_combat.0031.desc.opponent_response.POD_aegis_of_shadows.fatality:0 "Nothing seems to be able to pierce this defense. I exhaust myself trying to break through. I don't see the counterattack coming, and I will never see anything else coming again."
 single_combat.0031.desc.opponent_response.POD_compel.fatality:0 "It catches me off guard, and I'm soon too distracted to see the blow that comes next. And it's the last one."
 single_combat.0031.desc.opponent_response.POD_terminal_decree.fatality:0 "Which I obediently do, slowly killing myself as my opponent laughs all the while. My last thought is for hoping that no one will ever know how I died."
 single_combat.0031.desc.opponent_response.POD_daunt.fatality:0 "It catches me off guard, and I'm soon too distracted to see the blow that comes next. And it's the last one."
 single_combat.0031.desc.opponent_response.POD_dread_gaze.fatality:0 "It catches me off guard, and I'm soon too distracted to see the blow that comes next. And it's the last one."
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae.fatality:0 "As such, I'm suddenly feeling quite weaker and the Beast is roaring in anger. Not for long however as my opponent uses my distraction to strike a perfect blow at my neck. Who needs a head anyway?"
 single_combat.0031.desc.opponent_response.POD_scorpions_touch.fatality:0 "Struck by it, I'm feeling sick and my movements are sluggish. In this sorry state, I'm quickly overpowered by my foe who has the mercy of giving me a quick death instead of letting the poison do its thing."
 single_combat.0031.desc.opponent_response.POD_theft_of_vitae.fatality:0 "I am powerless to stop it, my precious blood is stolen from me until there is nothing left. And with no blood left... Ashes is all that remain."
 single_combat.0031.desc.opponent_response.POD_baals_curse.fatality:0 "Hurt by it, I'm feeling sick and my movements are sluggish. In this sorry state, I'm quickly overpowered by my foe who has the mercy of giving me a quick death instead of letting the poison do its thing."
 single_combat.0031.desc.opponent_response.POD_cauldron_of_blood.fatality:0 "烫！烫！我已经变成了火！……随后灰烬。"
 single_combat.0031.desc.opponent_response.POD_touch_of_oblivion.fatality:0 "我的血中突然混入了恶性的暗影，试图占据我的身体。当我的生命力被汲尽时，我瘫倒在地上，很快就变成了一堆灰烬和旋转的黑暗。"
 single_combat.0031.desc.opponent_response.POD_stygian_shroud.fatality:0 "因此，我没能预到来自我背后的下一击。这把我的内脏撕了开来，我爆成血肉模糊的一团，周围一片脏乱。"
 single_combat.0031.desc.opponent_response.POD_fire_torch.fatality:0 "The fire completely engulfs me and soon, all is ashes."
 single_combat.0031.desc.opponent_response.POD_fire_bombs.fatality:0 "The fire completely engulfs me and soon, all is ashes."
 single_combat.0031.desc.opponent_response.POD_fire_spewer.fatality:0 "The fire completely engulfs me and soon, all is ashes."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot.fatality:0 "It strikes me between the eyes then emerge from the back of my end. All is pain. Then darkness."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs.fatality:0 "I'm soon on the ground, barely pushing back these beasts. My opponents looms towards me and strikes at my helpless form..."
 single_combat.0031.desc.opponent_response.POD_stake_attack.fatality:0 "The stake goes through my heart, and everything goes dark."
 single_combat.0031.desc.opponent_response.POD_oculi_trust.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_oculi_wine.fatality:0 "I'm hurt, and my flesh turn to ashes before I do anything. A quick end at least."
 single_combat.0031.desc.opponent_response.POD_acre_catechumen.fatality:0 "The next blow that strikes me is indeed the one, cleaving me in half as the shattered parts of me fall to the floor."
 single_combat.0031.desc.opponent_response.POD_acre_flesh.fatality:0 "I can't break my opponent's defense, and the counterattack is a critical one. I stood no chance."
 single_combat.0031.desc.opponent_response.POD_acre_flight.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_acre_auto.fatality:0 "The next blow that strikes me is indeed the one, cleaving me in half as the shattered parts of me fall to the floor."
 single_combat.0031.desc.opponent_response.POD_murnau_mirror.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_murnau_arcana.fatality:0 "Surprised, the backfire from it is critical and explodes to my face. And explodes my face as well."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna.fatality:0 "The next blow that strikes me is is a critical one. I stood no chance."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_bone_obedience.fatality:0 "I can't break my opponent's defense, and the counterattack is a critical one. I stood no chance."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud.fatality:0 "I'm engulfed in it, and dies in a poisonous cough crawling to the floor."
 single_combat.0031.desc.opponent_response.POD_ching_shih.fatality:0 "Quicker, sturdier and stronger than me, I'm outmatched. And quickly dispatched in a swift and merciless strike."
 single_combat.0031.desc.opponent_response.POD_long_neck.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_bloodlash.fatality:0 "I'm surprised by it, and quickly beaten back by the assault. My foe seizes the opportunity, and my head is soon rolling on the floor."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch.fatality:0 "I'm engulfed in it, and dies in a blazing inferno."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern.fatality:0 "I'm engulfed in it, and dies in a blazing inferno."
 single_combat.0031.desc.opponent_response.POD_bone_dance.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_dragon_dance.fatality:0 "Quicker, sturdier and stronger than me, I'm outmatched. And quickly dispatched in a swift and merciless strike."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt.fatality:0 "I'm struck once, twice then thrice... with the blood stopping in my veins, I'm paralyzed. It doesn't take long for my opponent to end my misery."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare.fatality:0 "In this difficult state of mind, I'm unable to defend myself properly. It is a fatal weakness, and one that I won't have to regret for long."
 single_combat.0031.desc.opponent_response.POD_wind_attack.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_demon_claws.fatality:0 "Quicker, sturdier and stronger than me, I'm outmatched. And quickly dispatched in a swift and merciless strike."
 single_combat.0031.desc.opponent_response.POD_tormented_essence.fatality:0 "In this difficult state of mind, I'm unable to defend myself properly. It is a fatal weakness, and one that I won't have to regret for long."
 single_combat.0031.desc.opponent_response.POD_adamantums_wrath.fatality:0 "Quicker, sturdier and stronger than me, I'm outmatched. And quickly dispatched in a swift and merciless strike."
 single_combat.0031.desc.sc_attacker.POD_bite:0 "我的对手毫不费力地躲开了我的前扑，并具有了反击的机会。"
 single_combat.0031.desc.sc_attacker.POD_blood_surge:0 "我没能催起我体内的血，因为我需要每一份注意力来保持对敌人的优势。"
 single_combat.0031.desc.sc_attacker.POD_blood_heal:0 "我没能催起我体内的血，因为我需要每一份注意力来保持对敌人的优势。"
 single_combat.0031.desc.sc_attacker.POD_blink:0 "过快过速，我偏离了原本锁定的位置。"
 single_combat.0031.desc.sc_attacker.POD_lightning_strike:0 "我的攻击，虽然快，但没准头，打空了。"
 single_combat.0031.desc.sc_attacker.POD_split_second:0 "尽管时间的流逝有偏差，但我的敌人却似乎适应得相当好。"
 single_combat.0031.desc.sc_attacker.POD_unerring_aim:0 "绝对精准……但缺乏强度，勉强擦伤目标。"
 single_combat.0031.desc.sc_attacker.POD_lethal_body:0 "如果没有精确度，强度就什么都不是，因为我强力的攻击没有击中目标。"
 single_combat.0031.desc.sc_attacker.POD_brutal_feed:0 "我的獠牙错过了对手的脖子，使其了有机会进行反击。"
 single_combat.0031.desc.sc_attacker.POD_earthshock:0 "Steady on their feet, my opponent is barely moved by the earthquake."
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine:0 "The wind moved by my Potence enhanced attacks are barely a small breeze to my foe."
 single_combat.0031.desc.sc_attacker.POD_toughness:0 "Despite my enhanced toughness, the powerful blows of my opponent still hurt like hell."
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble:0 "Marble can be broken, as the earth shattering blows of my opponent are proving right now."
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain:0 "Even a masochist vampire has limits. It hurts way too much to be pleasurable and useful right now."
 single_combat.0031.desc.sc_attacker.POD_feral_weapons:0 "My foe deftly dodges my deadly claws, knowing their danger."
 single_combat.0031.desc.sc_attacker.POD_shapechange:0 "Overwhelmed by the animal instincts, my attacks are brutal but lack sufficient precision to land."
 single_combat.0031.desc.sc_attacker.POD_vanish:0 "Looking for the small inconsistencies in the area, my opponent manages to spot me."
 single_combat.0031.desc.sc_attacker.POD_nocturne:0 "My foe seems barely slowed by the shadows, still fighting at their best."
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman:0 "Quickly moving out of the way, my opponent manages to get out of the arms' reach."
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within:0 "No opening presents itself, my foe avoids the swirling shadows almost perfectly."
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows:0 "As light dispels darkness, my opponent's powerful moves shatters my shadow armor."
 single_combat.0031.desc.sc_attacker.POD_compel:0 "In a supreme effort of willpower, my opponent disregards my command."
 single_combat.0031.desc.sc_attacker.POD_terminal_decree:0 "In a supreme effort of willpower, my opponent disregards my command."
 single_combat.0031.desc.sc_attacker.POD_daunt:0 "My opponent isn't daunted by my enhanced presence at all, still fighting at their best."
 single_combat.0031.desc.sc_attacker.POD_dread_gaze:0 "My opponent actually seems to relish beating their worst nightmare to pulp, making dread gaze quite ineffective."
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae:0 "My opponent's blood is too strong for parlor tricks, and is still as effective as ever."
 single_combat.0031.desc.sc_attacker.POD_scorpions_touch:0 "A deadly poison is useless if you can't administer it, and your opponent takes great care in avoiding your next blows."
 single_combat.0031.desc.sc_attacker.POD_theft_of_vitae:0 "My opponent's blood is too strong for parlor tricks and annoyingly stays in their body."
 single_combat.0031.desc.sc_attacker.POD_baals_curse:0 "A deadly poison is useless if you can't administer it, and your opponent takes great care in avoiding your next blows."
 single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood:0 "我的对手的血对我来说太强了，尽管我尽了最大努力，其的血仍然是冷的。"
 single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion:0 "湮灭之触几乎没能擦伤我的对手，真是无用。"
 single_combat.0031.desc.sc_attacker.POD_stygian_shroud:0 "即使他们的感官被障壁所遮断，我的对手仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_attacker.POD_fire_torch:0 "No lucky break this time, my torch is effortlessly dodged."
 single_combat.0031.desc.sc_attacker.POD_fire_bombs:0 "The small concoction is easily dodged by my foe."
 single_combat.0031.desc.sc_attacker.POD_fire_spewer:0 "With wildly inaccurate targeting, the fire doesn't even go near its intended target."
 single_combat.0031.desc.sc_attacker.POD_crossbow_shot:0 "The Shot goes way wide of its intended target."
 single_combat.0031.desc.sc_attacker.POD_unleash_dogs:0 "The animals are quickly dispatched."
 single_combat.0031.desc.sc_attacker.POD_stake_attack:0 "My reckless attack is easily dodged."
 single_combat.0031.desc.sc_attacker.POD_oculi_trust:0 "It doesn't seem to really stop them for long though."
 single_combat.0031.desc.sc_attacker.POD_oculi_wine:0 "My reckless attack is easily dodged."
 single_combat.0031.desc.sc_attacker.POD_acre_catechumen:0 "I fail to capitalize on this renewed strength quickly enough though."
 single_combat.0031.desc.sc_attacker.POD_acre_flesh:0 "...but my opponent doesn't care and their next charge is as strong as ever."
 single_combat.0031.desc.sc_attacker.POD_acre_flight:0 "It doesn't seem enough though, and my foe easily matches me."
 single_combat.0031.desc.sc_attacker.POD_acre_auto:0 "Not quite, as it is easily dodged."
 single_combat.0031.desc.sc_attacker.POD_murnau_mirror:0 "It isn't enough though, and I'm still outmatched right now."
 single_combat.0031.desc.sc_attacker.POD_murnau_arcana:0 "With great powers... come great risks of backlash."
 single_combat.0031.desc.sc_attacker.POD_sisters_hosanna:0 "I fail to capitalize on this renewed strength quickly enough though."
 single_combat.0031.desc.sc_attacker.POD_sisters_oratorio:0 "It doesn't seem to really stop them for long though."
 single_combat.0031.desc.sc_attacker.POD_bone_obedience:0 "But the relentless charge of my opponent still hurts."
 single_combat.0031.desc.sc_attacker.POD_five_poison_cloud:0 "It is dodged at the last second though."
 single_combat.0031.desc.sc_attacker.POD_ching_shih:0 "My opponent isn't impressed though, and strikes quickly."
 single_combat.0031.desc.sc_attacker.POD_long_neck:0 "But not limitless accuracy, as I miss my next attack."
 single_combat.0031.desc.sc_attacker.POD_bloodlash:0 "It doesn't account for much, as my opponent easily steps aside."
 single_combat.0031.desc.sc_attacker.POD_goblin_scorch:0 "It is dodged at the last second though."
 single_combat.0031.desc.sc_attacker.POD_goblin_lantern:0 "My opponent carefully avoids me during this time."
 single_combat.0031.desc.sc_attacker.POD_bone_dance:0 "My opponent doesn't seem sleepy though."
 single_combat.0031.desc.sc_attacker.POD_dragon_dance:0 "Despite my enhanced capabilities, I fail to take the advantage."
 single_combat.0031.desc.sc_attacker.POD_chi_interrupt:0 "I can't find it, and I'm pushed aside."
 single_combat.0031.desc.sc_attacker.POD_thousand_hell_stare:0 "It only makes them stronger."
 single_combat.0031.desc.sc_attacker.POD_wind_attack:0 "But not enough to win this duel yet it seems."
 single_combat.0031.desc.sc_attacker.POD_demon_claws:0 "My opponent isn't impressed though, and strikes quickly."
 single_combat.0031.desc.sc_attacker.POD_tormented_essence:0 "It only makes them stronger."
 single_combat.0031.desc.sc_attacker.POD_adamantums_wrath:0 "My opponent isn't impressed though, and strikes quickly."
 single_combat.0031.desc.sc_attacker.POD_bite.injury:0 "而它来得很快，是以一拳打脸的形式。"
 single_combat.0031.desc.sc_attacker.POD_blood_surge.injury:0 "而这小小的分心足以让我的对手通过迅速地一击取得优势。"
 single_combat.0031.desc.sc_attacker.POD_blood_heal.injury:0 "而这小小的分心足以让我的对手通过迅速地一击取得优势。"
 single_combat.0031.desc.sc_attacker.POD_blink.injury:0 "而我如同所预想的那样挂彩了。"
 single_combat.0031.desc.sc_attacker.POD_lightning_strike.injury:0 "而我对手的反击却非如此。"
 single_combat.0031.desc.sc_attacker.POD_split_second.injury:0 "而不出意外的话我会被下一击击中。"
 single_combat.0031.desc.sc_attacker.POD_unerring_aim.injury:0 "拉近了距离，我的敌人为我的放肆打了我一拳。"
 single_combat.0031.desc.sc_attacker.POD_lethal_body.injury:0 "而我的对手则没这样。而这很痛。"
 single_combat.0031.desc.sc_attacker.POD_brutal_feed.injury:0 "而它来得很快，是以一拳打脸的形式。"
 single_combat.0031.desc.sc_attacker.POD_earthshock.injury:0 "Distracted by this failure, I don't see the next strike coming."
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine.injury:0 "His strikes are much more to me though and I'm soon recovering with difficulty from them."
 single_combat.0031.desc.sc_attacker.POD_toughness.injury:0 "It seems like Fortitude wasn't enough this time."
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.injury:0 "I feel like being at the center of an earthquake."
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.injury:0 "My opponent quickly makes sure that it soon hurts even more."
 single_combat.0031.desc.sc_attacker.POD_feral_weapons.injury:0 "Their counterattack is no less dangerous, and I'm beaten for this bout."
 single_combat.0031.desc.sc_attacker.POD_shapechange.injury:0 "Channeling generations of humanity taming the wild life, my opponent starts to beat the living daylight out of my animal form."
 single_combat.0031.desc.sc_attacker.POD_vanish.injury:0 "His next strike does as well."
 single_combat.0031.desc.sc_attacker.POD_nocturne.injury:0 "As is proved by their next, almost perfect, strike."
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman.injury:0 "Distracted by this failure, I have to endure some quick reprisal."
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within.injury:0 "I don't do so good against their next strike sadly."
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows.injury:0 "Not being invulnerable hurts like hell apparently."
 single_combat.0031.desc.sc_attacker.POD_compel.injury:0 "And then commands their fist to go into my head. It works."
 single_combat.0031.desc.sc_attacker.POD_terminal_decree.injury:0 "And then commands their fist to go into my head. It works."
 single_combat.0031.desc.sc_attacker.POD_daunt.injury:0 "As is proved by their next, almost perfect, strike."
 single_combat.0031.desc.sc_attacker.POD_dread_gaze.injury:0 "And it quite hurts to be on the receiving end of it."
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae.injury:0 "Which I soon can confirm when a blood enhanced kick strikes me in the guts."
 single_combat.0031.desc.sc_attacker.POD_scorpions_touch.injury:0 "You lack the same care in avoiding theirs though, and you end up losing this part of the fight."
 single_combat.0031.desc.sc_attacker.POD_theft_of_vitae.injury:0 "Mine takes a leap out when my opponent's punch connects with my face though."
 single_combat.0031.desc.sc_attacker.POD_baals_curse.injury:0 "You lack the same care in avoiding theirs though, and you end up losing this part of the fight."
 single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood.injury:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。"
 single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion.injury:0 "甚至没有被吓倒，在这战斗回合中，我的敌人占了上风。"
 single_combat.0031.desc.sc_attacker.POD_stygian_shroud.injury:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。"
 single_combat.0031.desc.sc_attacker.POD_fire_torch.injury:0 "My pitiful attack is then countered by a masterful strike. It hurts."
 single_combat.0031.desc.sc_attacker.POD_fire_bombs.injury:0 "I don't easily dodge the punch to my face that comes next though."
 single_combat.0031.desc.sc_attacker.POD_fire_spewer.injury:0 "The next strike from my opponent is way more accurate than that though."
 single_combat.0031.desc.sc_attacker.POD_crossbow_shot.injury:0 "The next strike from my opponent is way more accurate than that though."
 single_combat.0031.desc.sc_attacker.POD_unleash_dogs.injury:0 "My opponent throw one of my own dogs at me in retaliation."
 single_combat.0031.desc.sc_attacker.POD_stake_attack.injury:0 "I don't easily dodge the punch to my face that comes next though."
 single_combat.0031.desc.sc_attacker.POD_oculi_trust.injury:0 "I'm quickly push back by a relentless assault."
 single_combat.0031.desc.sc_attacker.POD_oculi_wine.injury:0 "I don't easily dodge the punch to my face that comes next though."
 single_combat.0031.desc.sc_attacker.POD_acre_catechumen.injury:0 "My opponent's counterattack catches me off guard and connects."
 single_combat.0031.desc.sc_attacker.POD_acre_flesh.injury:0 "It hurts quite a lot."
 single_combat.0031.desc.sc_attacker.POD_acre_flight.injury:0 "Or even outmatch me, as I'm pushed back."
 single_combat.0031.desc.sc_attacker.POD_acre_auto.injury:0 "I don't easily dodge the punch to my face that comes next though."
 single_combat.0031.desc.sc_attacker.POD_murnau_mirror.injury:0 "I'm pushed back, barely keeping up."
 single_combat.0031.desc.sc_attacker.POD_murnau_arcana.injury:0 "This one exploded right to my face."
 single_combat.0031.desc.sc_attacker.POD_sisters_hosanna.injury:0 "My opponent's counterattack catches me off guard and connects."
 single_combat.0031.desc.sc_attacker.POD_sisters_oratorio.injury:0 "My opponent's counterattack catches me off guard and connects."
 single_combat.0031.desc.sc_attacker.POD_bone_obedience.injury:0 "I'm pushed back, barely keeping up."
 single_combat.0031.desc.sc_attacker.POD_five_poison_cloud.injury:0 "I don't easily dodge the punch to my face that comes next though."
 single_combat.0031.desc.sc_attacker.POD_ching_shih.injury:0 "I'm hurt, but still standing."
 single_combat.0031.desc.sc_attacker.POD_long_neck.injury:0 "My opponent doesn't, and I'm wounded."
 single_combat.0031.desc.sc_attacker.POD_bloodlash.injury:0 "Before connecting with a swift strike that injures me."
 single_combat.0031.desc.sc_attacker.POD_goblin_scorch.injury:0 "I don't easily dodge the punch to my face that comes next though."
 single_combat.0031.desc.sc_attacker.POD_goblin_lantern.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_bone_dance.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_dragon_dance.injury:0 "I'm pushed back, barely keeping up."
 single_combat.0031.desc.sc_attacker.POD_chi_interrupt.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_thousand_hell_stare.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_wind_attack.injury:0 "I'm pushed back, barely keeping up."
 single_combat.0031.desc.sc_attacker.POD_demon_claws.injury:0 "I'm hurt, but still standing."
 single_combat.0031.desc.sc_attacker.POD_tormented_essence.injury:0 "They then counter with a powerful blow."
 single_combat.0031.desc.sc_attacker.POD_adamantums_wrath.injury:0 "I'm hurt, but still standing."
 single_combat.0031.desc.sc_attacker.POD_bite.fatality:0 "而且它来得很快，以一掌劈脸的形式，将其切成了恰好的两半。"
 single_combat.0031.desc.sc_attacker.POD_blood_surge.fatality:0 "而这小小的分心足以让我的对手利用优势，其以迅雷不及掩耳之势击中了你的脖子。你的头很快就滚到了地上，眼见着不行了。"
 single_combat.0031.desc.sc_attacker.POD_blood_heal.fatality:0 "而这小小的分心足以让我的对手利用优势，其以迅雷不及掩耳之势击中了你的脖子。你的头很快就滚到了地上，眼见着不行了。"
 single_combat.0031.desc.sc_attacker.POD_blink.fatality:0 "而且我惨败的甚至比我预想的还要严重。不过我不会再失去任何东西了，往好的来说。"
 single_combat.0031.desc.sc_attacker.POD_lightning_strike.fatality:0 "而我对手的反击却非如此。我的心脏被刺穿，爆裂了开来。血腥的结局。"
 single_combat.0031.desc.sc_attacker.POD_split_second.fatality:0 "而不出意外的话我会被下一击击中。而且这一击对准了我的脖子。不光彩的结局。"
 single_combat.0031.desc.sc_attacker.POD_unerring_aim.fatality:0 "拉近了距离，我的敌人为我的放肆打了我一拳。随后打脸。接着把我的头拔了下来。"
 single_combat.0031.desc.sc_attacker.POD_lethal_body.fatality:0 "而我的对手则没这样。而这很痛。直到最后不痛了，黑暗吞噬了你。"
 single_combat.0031.desc.sc_attacker.POD_brutal_feed.fatality:0 "而且它来得很快，以一掌劈脸的形式，将其切成了恰好的两半。"
 single_combat.0031.desc.sc_attacker.POD_earthshock.fatality:0 "Distracted by this failure, I don't see the next strike coming. And now, I won't see anything ever again."
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine.fatality:0 "His strikes are much more to me though and I'm soon crumbling to the ground, unable to do nothing but stare at the bashing end coming my way."
 single_combat.0031.desc.sc_attacker.POD_toughness.fatality:0 "It seems like Fortitude wasn't enough this time. Not was it enough to save from the powerful strike aimed at your neck coming next."
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.fatality:0 "I feel like being at the center of an earthquake. And you are soon swallowed by it, never to be seen again."
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.fatality:0 "My opponent quickly makes sure that it soon hurts even more. Until it doesn't."
 single_combat.0031.desc.sc_attacker.POD_feral_weapons.fatality:0 "Their counterattack is no less dangerous, and I'm unable to save myself from the next round of powerful strikes coming my way."
 single_combat.0031.desc.sc_attacker.POD_shapechange.fatality:0 "Channeling generations of humanity taming the wild life, my opponent starts to beat the living daylight out of my animal form. A resounding victory for humanity in this episode of man versus wild."
 single_combat.0031.desc.sc_attacker.POD_vanish.fatality:0 "His next strike does as well. And the next one. And the next one..."
 single_combat.0031.desc.sc_attacker.POD_nocturne.fatality:0 "As is proved by their next, almost perfect, strike. And the next one. And the next one..."
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman.fatality:0 "Distracted by this failure, I have to endure some quick reprisal. In my current state, I'm not able to recover quickly enough. This will soon be over."
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within.fatality:0 "I don't do so good against their next strike sadly. Immortality always ends up in death somehow."
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows.fatality:0 "Not being invulnerable hurts like hell apparently. Being truly dead won't though, as you will soon learn."
 single_combat.0031.desc.sc_attacker.POD_compel.fatality:0 "And then commands their fist to go into my head. It works. My head doesn't like it and decide to dislodge itself from my body."
 single_combat.0031.desc.sc_attacker.POD_terminal_decree.fatality:0 "And then commands their fist to go into my head. It works. My head doesn't like it and decide to dislodges itself from my body."
 single_combat.0031.desc.sc_attacker.POD_daunt.fatality:0 "As is proved by their next, almost perfect, strike. And the next one. And the next one..."
 single_combat.0031.desc.sc_attacker.POD_dread_gaze.fatality:0 "And it quite hurts to be on the receiving end of it. As you soon feel the curse of Caine leaving your body, you have the small comfort of having helped your foe brutally overcome their fear at least."
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae.fatality:0 "Which I soon can confirm when a blood enhanced kick strikes me in the guts. I soon have no guts, and no immortality either."
 single_combat.0031.desc.sc_attacker.POD_scorpions_touch.fatality:0 "You lack the same care in avoiding theirs though, and you end up losing this fight. In the end, there is only darkness."
 single_combat.0031.desc.sc_attacker.POD_theft_of_vitae.fatality:0 "Mine takes a leap out when my opponent's punch connects with my face though. In protest, my head decides to dislodge itself from my body."
 single_combat.0031.desc.sc_attacker.POD_baals_curse.fatality:0 "You lack the same care in avoiding theirs though, and you end up losing this fight. In the end, there is only darkness."
 single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood.fatality:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。我失去了我的胆，和我的不朽之身。"
 single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion.fatality:0 "甚至没有被吓倒，在这战斗回合中，我最终输了这场战斗。最终，唯有黑暗。"
 single_combat.0031.desc.sc_attacker.POD_stygian_shroud.fatality:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。我失去了我的胆，和我的不朽之身。"
 single_combat.0031.desc.sc_attacker.POD_fire_torch.fatality:0 "My pitiful attack is then countered by a masterful strike. I won't recover from this one."
 single_combat.0031.desc.sc_attacker.POD_fire_bombs.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_fire_spewer.fatality:0 "The next strike from my opponent is way more accurate than that though. My head if cut off my shoulders in a swift motion."
 single_combat.0031.desc.sc_attacker.POD_crossbow_shot.fatality:0 "The next strike from my opponent is way more accurate than that though. My head if cut off my shoulders in a swift motion."
 single_combat.0031.desc.sc_attacker.POD_unleash_dogs.fatality:0 "My opponent throw one of my own dogs at me in retaliation. I catch him by reflexes, which appears to be a wrong move as my opponent closes on to me for a critical blow."
 single_combat.0031.desc.sc_attacker.POD_stake_attack.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_oculi_trust.fatality:0 "I'm quickly push back by a relentless assault. Cornered, I fall to the ground, helpless."
 single_combat.0031.desc.sc_attacker.POD_oculi_wine.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_acre_catechumen.fatality:0 "My opponent's counterattack catches me off guard and connects. The end comes in a flash of steel."
 single_combat.0031.desc.sc_attacker.POD_acre_flesh.fatality:0 "It hurts quite a lot. Enough to distract me from the next blow. This one doesn't hurt for long."
 single_combat.0031.desc.sc_attacker.POD_acre_flight.fatality:0 "Or even outmatch me, as I'm pushed back. And back. Until there is no where left to go."
 single_combat.0031.desc.sc_attacker.POD_acre_auto.fatality:0 "I don't easily dodge the punch to my face that comes next though. Or the next one, until my head falls from my shoulders."
 single_combat.0031.desc.sc_attacker.POD_murnau_mirror.fatality:0 "I'm pushed back, barely keeping up. The duel doesn't last long after that, I'm out of my league."
 single_combat.0031.desc.sc_attacker.POD_murnau_arcana.fatality:0 "This one exploded right to my face. Then exploded my face as well."
 single_combat.0031.desc.sc_attacker.POD_sisters_hosanna.fatality:0 "My opponent's counterattack catches me off guard and connects. The end comes in a flash of steel."
 single_combat.0031.desc.sc_attacker.POD_sisters_oratorio.fatality:0 "My opponent's counterattack catches me off guard and connects. The end comes in a flash of steel."
