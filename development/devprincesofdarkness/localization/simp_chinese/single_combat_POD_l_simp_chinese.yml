 single_combat.0031.desc.opponent_response.POD_unerring_aim:0 "由于其对迅捷术的掌握，我敌人的下一击将是绝对精准的。"
 single_combat.0031.desc.opponent_response.POD_lethal_body:0 "通过蛮力术，我的对手得以用雪崩般的冲击力蹦向了我。"
 single_combat.0031.desc.opponent_response.POD_brutal_feed:0 "我的敌人冲向我扑往颈部，期望能在几秒钟内就给我放空血。"
 single_combat.0031.desc.opponent_response.POD_earthshock:0 "猛击大地，我的敌人使地面在我等之下颤抖。"
 single_combat.0031.desc.opponent_response.POD_fist_of_caine:0 "多亏蛮力术，我的敌人的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0031.desc.opponent_response.POD_toughness:0 "我的对手的肉体具有了非自然的抗性，也许能挡住任何来袭的攻击。"
 single_combat.0031.desc.opponent_response.POD_flesh_of_marble:0 "我的对手的肉体变成了超自然的坚石，不再受任何损害。"
 single_combat.0031.desc.opponent_response.POD_prowess_from_pain:0 "我的敌人伤口供养了其，让其在瞬间内变得更强大。"
 single_combat.0031.desc.opponent_response.POD_feral_weapons:0 "我敌人的利爪长了出来，准备把我劈成两半。"
 single_combat.0031.desc.opponent_response.POD_shapechange:0 "我敌人通过动物形态，先用獠牙扑向了我。"
 single_combat.0031.desc.opponent_response.POD_vanish:0 "我的敌人从视线中消失，试图迷惑我。"
 single_combat.0031.desc.opponent_response.POD_nocturne:0 "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0031.desc.opponent_response.POD_arms_of_ahriman:0 "黑色的触手从地里出现，试图攻击我。"
 single_combat.0031.desc.opponent_response.POD_the_darkness_within:0 "暗影在我周围回旋，寻找破绽。"
 single_combat.0031.desc.opponent_response.POD_aegis_of_shadows:0 "暗影盔甲显现在我的敌人身上，保护其免受伤害。"
 single_combat.0031.desc.opponent_response.POD_compel:0 "我的对手通过支配术向我发出了简短的命令。"
 single_combat.0031.desc.opponent_response.POD_terminal_decree:0 "我的敌人向我发出命令，让我伤害自己。"
 single_combat.0031.desc.opponent_response.POD_daunt:0 "我的敌人变得更宏伟，更有力量，也许足以震慑我。"
 single_combat.0031.desc.opponent_response.POD_dread_gaze:0 "我的敌人显现为我最惧怕的噩梦。令人心烦意乱的景象。"
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae:0 "随着其的手一挥，我的敌人让我的血液静止了。"
 single_combat.0031.desc.opponent_response.POD_scorpions_touch:0 "我敌人抽出一些其的血液，将它转化为毒。"
 single_combat.0031.desc.opponent_response.POD_theft_of_vitae:0 "我的敌人让血从我喉内涌出，然后将它引向其口。"
 single_combat.0031.desc.opponent_response.POD_baals_curse:0 "我的敌人抽出一些其的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0031.desc.opponent_response.POD_cauldron_of_blood:0 "随着其的手一挥，我的敌人让我的血液在我的血管中沸腾。"
 single_combat.0031.desc.opponent_response.POD_touch_of_oblivion:0 "我的对手触碰了我，将湮灭的原始熵力注入我中。"
 single_combat.0031.desc.opponent_response.POD_stygian_shroud:0 "我的敌人将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0031.desc.opponent_response.POD_fire_torch:0 "My opponent hopes for a lucky break while swinging madly their torch."
 single_combat.0031.desc.opponent_response.POD_fire_bombs:0 "My opponent launches some alchemical fire towards me."
 single_combat.0031.desc.opponent_response.POD_fire_spewer:0 "My opponent's strange machine spits out fire wildly."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot:0 "My opponent's shot is fired, seeking its target."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs:0 "The dogs rush towards me, hungry for blood and flesh."
 single_combat.0031.desc.opponent_response.POD_stake_attack:0 "My foe lunges forwards stake first."
 single_combat.0031.desc.opponent_response.POD_oculi_trust:0 "The words of God are spoken, feeling me with dread."
 single_combat.0031.desc.opponent_response.POD_oculi_wine:0 "My foe lunges towards me, seeking to make contact for their curse to take hold."
 single_combat.0031.desc.opponent_response.POD_acre_catechumen:0 "The words of God are spoken, feeling my opponent with power."
 single_combat.0031.desc.opponent_response.POD_acre_flesh:0 "The words of God are spoken, feeling my opponent with endurance."
 single_combat.0031.desc.opponent_response.POD_acre_flight:0 "Blessed by the Divine, my foe is quicker than ever."
 single_combat.0031.desc.opponent_response.POD_acre_auto:0 "My opponent ready themselves for what could be the final blow."
 single_combat.0031.desc.opponent_response.POD_murnau_mirror:0 "The mirror of God shows my opponent the path to match my prowess."
 single_combat.0031.desc.opponent_response.POD_murnau_arcana:0 "My foe ready themselves to take control over my powers."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna:0 "My opponent sings the glory of God, filling them with strength."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio:0 "My opponent sings the glory of God, filling me with horror."
 single_combat.0031.desc.opponent_response.POD_bone_obedience:0 "My opponent's bones start to become unbreakable."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud:0 "The black Yin energy of the cloud hurls towards me."
 single_combat.0031.desc.opponent_response.POD_ching_shih:0 "The terrible monster form is now facing me."
 single_combat.0031.desc.opponent_response.POD_long_neck:0 "My foe's extends their limbs, giving them limitless reach."
 single_combat.0031.desc.opponent_response.POD_bloodlash:0 "A tendril of blood is created, giving my opponent new opportunities."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch:0 "The spirit flames are hurled towards me."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern:0 "My opponent turns into a glowing orb of fire."
 single_combat.0031.desc.opponent_response.POD_bone_dance:0 "The dance is completed, creating a veil of lethargy in the area."
 single_combat.0031.desc.opponent_response.POD_dragon_dance:0 "The dance is complete, and the trance has started."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt:0 "My foe lunges for me, looking for my critical Chi junctures."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare:0 "Pain, anger and despair suddenly consume my soul."
 single_combat.0031.desc.opponent_response.POD_wind_attack:0 "The wind is on, and my opponent is quicker than ever."
 single_combat.0031.desc.opponent_response.POD_demon_claws:0 "My opponent has taken the form of a fearsome demon."
 single_combat.0031.desc.opponent_response.POD_tormented_essence:0 "痛苦、愤怒和绝望瞬间吞噬了我的灵魂。"
 single_combat.0031.desc.opponent_response.POD_adamantums_wrath:0 "我的对手已经变成了一位可怕的恶魔。"
 single_combat.0031.desc.opponent_response.POD_bite.injury:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。在为时已晚之前，我勉强从该致命的擒抱中抽身而出。"
 single_combat.0031.desc.opponent_response.POD_blood_surge.injury:0 "即使从我现在所处的位置，我也能看到其变得更高、更强，被血赋予了力量。"
 single_combat.0031.desc.opponent_response.POD_blood_heal.injury:0 "血之力治愈了我的敌人，我眼睁睁的见着我之前所做的努力都白费了。"
 single_combat.0031.desc.opponent_response.POD_blink.injury:0 "而我没料到，在狂攻之下，我很快就沦落到需要进行回复的地步。"
 single_combat.0031.desc.opponent_response.POD_lightning_strike.injury:0 "而其做到了，我很快就被该出其不意的攻击击退。"
 single_combat.0031.desc.opponent_response.POD_split_second.injury:0 "我没有做好足够的准备，一发强烈的一击就向我袭来，对于我被扰乱的时间感来说这太快了。"
 single_combat.0031.desc.opponent_response.POD_unerring_aim.injury:0 "我什么也做不了，只能接招，我感得我的不死族肉体在抗议这种虐待。"
 single_combat.0031.desc.opponent_response.POD_lethal_body.injury:0 "我勉强的站起来了，感觉像是一整栋屋子垮在了我身上。"
 single_combat.0031.desc.opponent_response.POD_brutal_feed.injury:0 "感受到对手的獠牙带来的剧痛后，我设法从该致命的擒抱中抽身而出。"
 single_combat.0031.desc.opponent_response.POD_earthshock.injury:0 "我摔倒了，而我的对手利用了这个机会残酷地攻击我。我勉强避开了要落在我脖子上的那一击。"
 single_combat.0031.desc.opponent_response.POD_fist_of_caine.injury:0 "该暴风就像匕首一样刺入我的皮肤，每次唰过都会割掉我大片的永生血肉。"
 single_combat.0031.desc.opponent_response.POD_toughness.injury:0 "似乎没有什么能够穿透该防护。我因过多的突破尝试而耗尽了力气。"
 single_combat.0031.desc.opponent_response.POD_flesh_of_marble.injury:0 "似乎没有什么能够穿透该防护。我因过多的突破尝试而耗尽了力气。"
 single_combat.0031.desc.opponent_response.POD_prowess_from_pain.injury:0 "在这种可怕力量的推动下，我的对手打出了可怕的一击，让我踉跄后退。"
 single_combat.0031.desc.opponent_response.POD_feral_weapons.injury:0 "它近乎发生了，因为我勉强设法避免了绝对致命的一扫。"
 single_combat.0031.desc.opponent_response.POD_shapechange.injury:0 "我被这突如其来的变化惊呆了，我被击中了，不得不用尽全力地推开那怪物。"
 single_combat.0031.desc.opponent_response.POD_vanish.injury:0 "因此，我没能预到来自我背后的下一击。而这很痛。"
 single_combat.0031.desc.opponent_response.POD_nocturne.injury:0 "因此，我没能预到来自我背后的下一击。而这很痛。"
 single_combat.0031.desc.opponent_response.POD_arms_of_ahriman.injury:0 "我避开了其中一条，但没能避开第二条……而这很伤。"
 single_combat.0031.desc.opponent_response.POD_the_darkness_within.injury:0 "它突然地冲进了我的喉中，我不得不动用我所有的意志力来驱赶它。"
 single_combat.0031.desc.opponent_response.POD_aegis_of_shadows.injury:0 "似乎没有什么能够穿透该防护。我因过多的突破尝试而耗尽了力气。"
 single_combat.0031.desc.opponent_response.POD_compel.injury:0 "这使得我措手不及，被猛地借机一击。"
 single_combat.0031.desc.opponent_response.POD_terminal_decree.injury:0 "我顺从地做了，感到更多的是羞辱而不是痛苦。"
 single_combat.0031.desc.opponent_response.POD_daunt.injury:0 "这使得我措手不及，被猛地借机一击。"
 single_combat.0031.desc.opponent_response.POD_dread_gaze.injury:0 "这使得我措手不及，被猛地借机一击。"
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae.injury:0 "因此，我突然感到变得相当虚弱，心兽在愤怒地咆哮。"
 single_combat.0031.desc.opponent_response.POD_scorpions_touch.injury:0 "受此影响，我感到了不适，行动迟缓了起来。"
 single_combat.0031.desc.opponent_response.POD_theft_of_vitae.injury:0 "我无力阻止它，我宝贵的血啊！"
 single_combat.0031.desc.opponent_response.POD_baals_curse.injury:0 "受此影响，我感到了不适，行动迟缓了起来。"
 single_combat.0031.desc.opponent_response.POD_cauldron_of_blood.injury:0 "烫！烫！"
 single_combat.0031.desc.opponent_response.POD_touch_of_oblivion.injury:0 "我的血中突然混入了恶性的暗影，试图占据我的身体。这不是一个愉快的经历。"
 single_combat.0031.desc.opponent_response.POD_stygian_shroud.injury:0 "因此，我没能预到来自我背后的下一击。而这很痛。"
 single_combat.0031.desc.opponent_response.POD_fire_torch.injury:0 "I barely dodge it, but not before some of the fire burns my flesh."
 single_combat.0031.desc.opponent_response.POD_fire_bombs.injury:0 "I barely dodge it, but not before some of the fire burns my flesh."
 single_combat.0031.desc.opponent_response.POD_fire_spewer.injury:0 "I barely dodge it, but not before some of the fire burns my flesh."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot.injury:0 "It strikes me with a resounding sound, and I'm beaten back for this round."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs.injury:0 "I dispatch them, but not quickly enough, they manage to tear at me for a while."
 single_combat.0031.desc.opponent_response.POD_stake_attack.injury:0 "The stake misses my heart, but still grazes me quite painfully."
 single_combat.0031.desc.opponent_response.POD_oculi_trust.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_oculi_wine.injury:0 "I'm hurt, and part of my flesh turn to ashes before I can entangle myself."
 single_combat.0031.desc.opponent_response.POD_acre_catechumen.injury:0 "The next blow that strikes me is especially painful."
 single_combat.0031.desc.opponent_response.POD_acre_flesh.injury:0 "I can't break my opponent's defense, and the counterattack is painful."
 single_combat.0031.desc.opponent_response.POD_acre_flight.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_acre_auto.injury:0 "Not quite, but it's still a very painful one as I recoil from it."
 single_combat.0031.desc.opponent_response.POD_murnau_mirror.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_murnau_arcana.injury:0 "Surprised, the backfire from it hurts me pretty bad."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna.injury:0 "The next blow that strikes me is especially painful."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_bone_obedience.injury:0 "I can't break my opponent's defense, and the counterattack is painful."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud.injury:0 "I'm engulfed in it, and barely manages to escape before it's too late."
 single_combat.0031.desc.opponent_response.POD_ching_shih.injury:0 "Quicker, sturdier and stronger than me, I'm outmatched."
 single_combat.0031.desc.opponent_response.POD_long_neck.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_bloodlash.injury:0 "I'm surprised by it, and quickly beaten back by the assault."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch.injury:0 "I'm engulfed in it, and barely manages to escape before it's too late."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern.injury:0 "This strange tactic surprised me, and I'm badly burnt before coming back to my senses."
 single_combat.0031.desc.opponent_response.POD_bone_dance.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_dragon_dance.injury:0 "Quicker, sturdier and stronger than me, I'm outmatched."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt.injury:0 "I'm struck once, but manage to avoid the second one. Still painful though."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare.injury:0 "In this difficult state of mind, I'm unable to defend myself properly."
 single_combat.0031.desc.opponent_response.POD_wind_attack.injury:0 "As such, I'm unable to avoid the next strike coming my way."
 single_combat.0031.desc.opponent_response.POD_demon_claws.injury:0 "Quicker, sturdier and stronger than me, I'm outmatched."
 single_combat.0031.desc.opponent_response.POD_tormented_essence.injury:0 "在这种艰难的心灵状态下，我无法准确地保护自己。"
 single_combat.0031.desc.opponent_response.POD_adamantums_wrath.injury:0 "比我更快、更准、更狠，我陷入下风。"
 single_combat.0031.desc.opponent_response.POD_bite.fatality:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。当我迷失在这一迷吻带来的狂愉中时，想要抽身已经太晚了。接下來的事大家都知道了，不过该事跟我无关了。"
 single_combat.0031.desc.opponent_response.POD_blood_surge.fatality:0 "即使从我现在所处的位置，我也能看到其变得更高、更强，被血赋予了力量。突然间其变得极猛极快，我甚至没有看到那一击的到来，就被切成了两半。"
 single_combat.0031.desc.opponent_response.POD_blood_heal.fatality:0 "血之力治愈了我的敌人，我眼睁睁的见着我之前所做的努力都白费了。突然间其变得极猛极快，我甚至没有看到那一击的到来，就被切成了两半。"
 single_combat.0031.desc.opponent_response.POD_blink.fatality:0 "而我没料到。狂攻还未停止，或者至少在我还活着的时候不会停止。"
 single_combat.0031.desc.opponent_response.POD_lightning_strike.fatality:0 "而其做到了，我很快就被该出其不意的攻击击退。我的对手利用这个机会再次攻击我，我瘫倒在地，无力阻止终结一击。"
 single_combat.0031.desc.opponent_response.POD_split_second.fatality:0 "我没有做好足够的准备，一发强烈的一击就向我袭来，对于我被扰乱的时间感来说这太快了。那是我最后一次感受到的感知。"
 single_combat.0031.desc.opponent_response.POD_unerring_aim.fatality:0 "我什么也做不了，只能在看着其击中我两眼之间的位置。我的对手冷笑着看着我倒下，无力再保护自己。"
 single_combat.0031.desc.opponent_response.POD_lethal_body.fatality:0 "感觉像是一整栋屋子垮在了我身上，我只见着我的对手把我的头夹在其的双手之间并……结束了。"
 single_combat.0031.desc.opponent_response.POD_brutal_feed.fatality:0 "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。当我迷失在这一迷吻带来的狂愉中时，想要抽身已经太晚了。接下來的事大家都知道了，不过该事跟我无关了。"
 single_combat.0031.desc.opponent_response.POD_earthshock.fatality:0 "我摔倒了，而我的对手利用了这个机会残酷地攻击我。我没能避开了要落在我脖子上的那一击。我的头就这样滚到了我的对手的脚下。"
 single_combat.0031.desc.opponent_response.POD_fist_of_caine.fatality:0 "该暴风就像匕首一样刺入我的皮肤，每次唰过都会割掉我大片的永生血肉。我很快就变成了一副骨架，甚至更快得变成了灰烬。"
 single_combat.0031.desc.opponent_response.POD_toughness.fatality:0 "似乎没有什么能够穿透该防护。我因过多的突破尝试而耗尽了力气。没能注意到袭来的反击。也永远没法再注意了。"
 single_combat.0031.desc.opponent_response.POD_flesh_of_marble.fatality:0 "似乎没有什么能够穿透该防护。我因过多的突破尝试而耗尽了力气。没能注意到袭来的反击。也永远没法再注意了。"
 single_combat.0031.desc.opponent_response.POD_prowess_from_pain.fatality:0 "在这种可怕力量的推动下，我的对手打出了可怕的一击，将我的不死族心脏打成了肉酱。痛苦的声音响起，一切都变得黑暗。"
 single_combat.0031.desc.opponent_response.POD_feral_weapons.fatality:0 "而这发生了，唯一值得庆幸的是，它不会疼很久。"
 single_combat.0031.desc.opponent_response.POD_shapechange.fatality:0 "我被这突如其来的变化惊呆了，我被这个怪物击中了，很快就被它刺死了。"
 single_combat.0031.desc.opponent_response.POD_vanish.fatality:0 "因此，我没能预到来自我背后的下一击。这把我的内脏撕了开来，我爆成血肉模糊的一团，周围一片脏乱。"
 single_combat.0031.desc.opponent_response.POD_nocturne.fatality:0 "因此，我没能预到来自我背后的下一击。这把我的内脏撕了开来，我爆成血肉模糊的一团，周围一片脏乱。"
 single_combat.0031.desc.opponent_response.POD_arms_of_ahriman.fatality:0 "我避开了其中一条，但没有避开第二条……它又把我弹向第一条。在一切都变暗之前，我当了一阵子的皮球。"
 single_combat.0031.desc.opponent_response.POD_the_darkness_within.fatality:0 "它突然地冲进了我的喉中，我不得不动用我所有的意志力来驱赶它。我没能及时做到这一点，我的血和我自己都于黑暗中消逝。"
 single_combat.0031.desc.opponent_response.POD_aegis_of_shadows.fatality:0 "似乎没有什么能够穿透该防护。我因过多的突破尝试而耗尽了力气。没能注意到袭来的反击。也永远没法再注意了。"
 single_combat.0031.desc.opponent_response.POD_compel.fatality:0 "这使得我措手不及，没能注意到向我袭来的一击。也是终结一击。"
 single_combat.0031.desc.opponent_response.POD_terminal_decree.fatality:0 "我顺从地做了，在我对手的笑声中慢慢地杀了自己。我最后的想法是希望没有人知道我是怎么死的。"
 single_combat.0031.desc.opponent_response.POD_daunt.fatality:0 "这使得我措手不及，没能注意到向我袭来的一击。也是终结一击。"
 single_combat.0031.desc.opponent_response.POD_dread_gaze.fatality:0 "这使得我措手不及，没能注意到向我袭来的一击。也是终结一击。"
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae.fatality:0 "因此，我突然感到变得相当虚弱，心兽在愤怒地咆哮。然而没多久，我的对手就利用了我的分心，对我的脖子进行了完美的一击。我头呢？"
 single_combat.0031.desc.opponent_response.POD_scorpions_touch.fatality:0 "受此影响，我感到了不适，行动迟缓了起来。在这种不妙的状态下，我很快就被我的敌人制服了，其怜悯地让我迅速死亡，而不是让毒继续发挥它的作用。"
 single_combat.0031.desc.opponent_response.POD_theft_of_vitae.fatality:0 "我无力阻止它，我宝贵的血被不断偷走，直到什么都不剩。而随着血的消失……就只剩灰烬了。"
 single_combat.0031.desc.opponent_response.POD_baals_curse.fatality:0 "受此影响，我感到了不适，行动迟缓了起来。在这种不妙的状态下，我很快就被我的敌人制服了，其怜悯地让我迅速死亡，而不是让毒继续发挥它的作用。"
 single_combat.0031.desc.opponent_response.POD_cauldron_of_blood.fatality:0 "烫！烫！我已经变成了火！……随后灰烬。"
 single_combat.0031.desc.opponent_response.POD_touch_of_oblivion.fatality:0 "我的血中突然混入了恶性的暗影，试图占据我的身体。当我的生命力被汲尽时，我瘫倒在地上，很快就变成了一堆灰烬和旋转的黑暗。"
 single_combat.0031.desc.opponent_response.POD_stygian_shroud.fatality:0 "因此，我没能预到来自我背后的下一击。这把我的内脏撕了开来，我爆成血肉模糊的一团，周围一片脏乱。"
 single_combat.0031.desc.opponent_response.POD_fire_torch.fatality:0 "The fire completely engulfs me and soon, all is ashes."
 single_combat.0031.desc.opponent_response.POD_fire_bombs.fatality:0 "The fire completely engulfs me and soon, all is ashes."
 single_combat.0031.desc.opponent_response.POD_fire_spewer.fatality:0 "The fire completely engulfs me and soon, all is ashes."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot.fatality:0 "It strikes me between the eyes then emerge from the back of my end. All is pain. Then darkness."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs.fatality:0 "I'm soon on the ground, barely pushing back these beasts. My opponents looms towards me and strikes at my helpless form..."
 single_combat.0031.desc.opponent_response.POD_stake_attack.fatality:0 "The stake goes through my heart, and everything goes dark."
 single_combat.0031.desc.opponent_response.POD_oculi_trust.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_oculi_wine.fatality:0 "I'm hurt, and my flesh turn to ashes before I do anything. A quick end at least."
 single_combat.0031.desc.opponent_response.POD_acre_catechumen.fatality:0 "The next blow that strikes me is indeed the one, cleaving me in half as the shattered parts of me fall to the floor."
 single_combat.0031.desc.opponent_response.POD_acre_flesh.fatality:0 "I can't break my opponent's defense, and the counterattack is a critical one. I stood no chance."
 single_combat.0031.desc.opponent_response.POD_acre_flight.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_acre_auto.fatality:0 "The next blow that strikes me is indeed the one, cleaving me in half as the shattered parts of me fall to the floor."
 single_combat.0031.desc.opponent_response.POD_murnau_mirror.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_murnau_arcana.fatality:0 "Surprised, the backfire from it is critical and explodes to my face. And explodes my face as well."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna.fatality:0 "The next blow that strikes me is is a critical one. I stood no chance."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_bone_obedience.fatality:0 "I can't break my opponent's defense, and the counterattack is a critical one. I stood no chance."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud.fatality:0 "I'm engulfed in it, and dies in a poisonous cough crawling to the floor."
 single_combat.0031.desc.opponent_response.POD_ching_shih.fatality:0 "Quicker, sturdier and stronger than me, I'm outmatched. And quickly dispatched in a swift and merciless strike."
 single_combat.0031.desc.opponent_response.POD_long_neck.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_bloodlash.fatality:0 "I'm surprised by it, and quickly beaten back by the assault. My foe seizes the opportunity, and my head is soon rolling on the floor."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch.fatality:0 "I'm engulfed in it, and dies in a blazing inferno."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern.fatality:0 "I'm engulfed in it, and dies in a blazing inferno."
 single_combat.0031.desc.opponent_response.POD_bone_dance.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_dragon_dance.fatality:0 "Quicker, sturdier and stronger than me, I'm outmatched. And quickly dispatched in a swift and merciless strike."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt.fatality:0 "I'm struck once, twice then thrice... with the blood stopping in my veins, I'm paralyzed. It doesn't take long for my opponent to end my misery."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare.fatality:0 "In this difficult state of mind, I'm unable to defend myself properly. It is a fatal weakness, and one that I won't have to regret for long."
 single_combat.0031.desc.opponent_response.POD_wind_attack.fatality:0 "As such, I'm unable to avoid the next strike coming my way. And the next one. And... until there is nothing left to see."
 single_combat.0031.desc.opponent_response.POD_demon_claws.fatality:0 "Quicker, sturdier and stronger than me, I'm outmatched. And quickly dispatched in a swift and merciless strike."
 single_combat.0031.desc.opponent_response.POD_tormented_essence.fatality:0 "在这种艰难的心灵状态下，我无法准确地保护自己。这是一个致命的弱点，也是一个不会让我后悔太久的弱点。"
 single_combat.0031.desc.opponent_response.POD_adamantums_wrath.fatality:0 "比我更快、更准、更狠，我陷入下风。并在迅速而无情的打击中被立即粉碎了。"
 single_combat.0031.desc.sc_attacker.POD_bite:0 "我的对手毫不费力地躲开了我的前扑，并具有了反击的机会。"
 single_combat.0031.desc.sc_attacker.POD_blood_surge:0 "我没能催起我体内的血，因为我需要每一份注意力来保持对敌人的优势。"
 single_combat.0031.desc.sc_attacker.POD_blood_heal:0 "我没能催起我体内的血，因为我需要每一份注意力来保持对敌人的优势。"
 single_combat.0031.desc.sc_attacker.POD_blink:0 "过快过速，我偏离了原本锁定的位置。"
 single_combat.0031.desc.sc_attacker.POD_lightning_strike:0 "我的攻击，虽然快，但没准头，打空了。"
 single_combat.0031.desc.sc_attacker.POD_split_second:0 "尽管时间的流逝有偏差，但我的敌人却似乎适应得相当好。"
 single_combat.0031.desc.sc_attacker.POD_unerring_aim:0 "绝对精准……但缺乏强度，勉强擦伤目标。"
 single_combat.0031.desc.sc_attacker.POD_lethal_body:0 "如果没有精确度，强度就什么都不是，因为我强力的攻击没有击中目标。"
 single_combat.0031.desc.sc_attacker.POD_brutal_feed:0 "我的獠牙错过了对手的脖子，使其了有机会进行反击。"
 single_combat.0031.desc.sc_attacker.POD_earthshock:0 "保持平稳，我的对手几乎没有受到地震的影响。"
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine:0 "我蛮力术强化的攻击所带起的风对我的敌人来说如同春风一般。"
 single_combat.0031.desc.sc_attacker.POD_toughness:0 "尽管我的韧性被增强，但对手强大的攻击仍然让我痛不欲生。"
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble:0 "坚石可以被击碎，正如我的对手现在那开天辟地的一击所要证明的那样。"
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain:0 "即使是吸血鬼受虐狂也有极限。当前的疼痛过大了，既不愉悦和也无用。"
 single_combat.0031.desc.sc_attacker.POD_feral_weapons:0 "晓得危险，我的敌人巧妙地躲开了我致命的利爪。"
 single_combat.0031.desc.sc_attacker.POD_shapechange:0 "在动物本能的支配下，我的攻击是强力的，但缺乏足够的精准，没法命中。"
 single_combat.0031.desc.sc_attacker.POD_vanish:0 "察觉到了微小的不致之处，我的对手设法发现了我。"
 single_combat.0031.desc.sc_attacker.POD_nocturne:0 "我的敌人似乎几乎没有被暗影所拖累，仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman:0 "迅速移开，我的对手设法摆脱了触手的束缚。"
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within:0 "没有破绽，我的敌人近乎完美地避开了回旋的暗影。"
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows:0 "如同光驱散黑暗，我的对手强大的攻击击碎了我的暗影盔甲。"
 single_combat.0031.desc.sc_attacker.POD_compel:0 "由于其顽强的意志力，我的对手无视了我的命令。"
 single_combat.0031.desc.sc_attacker.POD_terminal_decree:0 "由于其顽强的意志力，我的对手无视了我的命令。"
 single_combat.0031.desc.sc_attacker.POD_daunt:0 "我的对手完全没有被我的强化所吓倒，仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_attacker.POD_dread_gaze:0 "我的对手实际上似乎很喜欢把他最惧怕的噩梦打成肉酱，使得恐惧目光相当无用。"
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae:0 "我对手的血对这些花招来说太强了，其血还如原样。"
 single_combat.0031.desc.sc_attacker.POD_scorpions_touch:0 "如果你不会用毒，那再致命也没用，你的对手非常小心地避开了你的下一击。"
 single_combat.0031.desc.sc_attacker.POD_theft_of_vitae:0 "我对手的血对这些花招来说太强了，其血还在原躯。"
 single_combat.0031.desc.sc_attacker.POD_baals_curse:0 "如果你不会用毒，那再致命也没用，你的对手非常小心地避开了你的下一击。"
 single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood:0 "我对手的血对我来说太强了，尽管我尽了最大努力，其血仍然是冷的。"
 single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion:0 "湮灭之触甚至都没能给我的对手造成擦伤，真是无用。"
 single_combat.0031.desc.sc_attacker.POD_stygian_shroud:0 "即使其的感官被障壁所遮断，我的对手仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_attacker.POD_fire_torch:0 "No lucky break this time, my torch is effortlessly dodged."
 single_combat.0031.desc.sc_attacker.POD_fire_bombs:0 "The small concoction is easily dodged by my foe."
 single_combat.0031.desc.sc_attacker.POD_fire_spewer:0 "With wildly inaccurate targeting, the fire doesn't even go near its intended target."
 single_combat.0031.desc.sc_attacker.POD_crossbow_shot:0 "The Shot goes way wide of its intended target."
 single_combat.0031.desc.sc_attacker.POD_unleash_dogs:0 "The animals are quickly dispatched."
 single_combat.0031.desc.sc_attacker.POD_stake_attack:0 "My reckless attack is easily dodged."
 single_combat.0031.desc.sc_attacker.POD_oculi_trust:0 "It doesn't seem to really stop them for long though."
 single_combat.0031.desc.sc_attacker.POD_oculi_wine:0 "My reckless attack is easily dodged."
 single_combat.0031.desc.sc_attacker.POD_acre_catechumen:0 "I fail to capitalize on this renewed strength quickly enough though."
 single_combat.0031.desc.sc_attacker.POD_acre_flesh:0 "...but my opponent doesn't care and their next charge is as strong as ever."
 single_combat.0031.desc.sc_attacker.POD_acre_flight:0 "It doesn't seem enough though, and my foe easily matches me."
 single_combat.0031.desc.sc_attacker.POD_acre_auto:0 "Not quite, as it is easily dodged."
 single_combat.0031.desc.sc_attacker.POD_murnau_mirror:0 "It isn't enough though, and I'm still outmatched right now."
 single_combat.0031.desc.sc_attacker.POD_murnau_arcana:0 "With great powers... come great risks of backlash."
 single_combat.0031.desc.sc_attacker.POD_sisters_hosanna:0 "I fail to capitalize on this renewed strength quickly enough though."
 single_combat.0031.desc.sc_attacker.POD_sisters_oratorio:0 "It doesn't seem to really stop them for long though."
 single_combat.0031.desc.sc_attacker.POD_bone_obedience:0 "But the relentless charge of my opponent still hurts."
 single_combat.0031.desc.sc_attacker.POD_five_poison_cloud:0 "It is dodged at the last second though."
 single_combat.0031.desc.sc_attacker.POD_ching_shih:0 "My opponent isn't impressed though, and strikes quickly."
 single_combat.0031.desc.sc_attacker.POD_long_neck:0 "But not limitless accuracy, as I miss my next attack."
 single_combat.0031.desc.sc_attacker.POD_bloodlash:0 "It doesn't account for much, as my opponent easily steps aside."
 single_combat.0031.desc.sc_attacker.POD_goblin_scorch:0 "It is dodged at the last second though."
 single_combat.0031.desc.sc_attacker.POD_goblin_lantern:0 "My opponent carefully avoids me during this time."
 single_combat.0031.desc.sc_attacker.POD_bone_dance:0 "My opponent doesn't seem sleepy though."
 single_combat.0031.desc.sc_attacker.POD_dragon_dance:0 "Despite my enhanced capabilities, I fail to take the advantage."
 single_combat.0031.desc.sc_attacker.POD_chi_interrupt:0 "I can't find it, and I'm pushed aside."
 single_combat.0031.desc.sc_attacker.POD_thousand_hell_stare:0 "It only makes them stronger."
 single_combat.0031.desc.sc_attacker.POD_wind_attack:0 "But not enough to win this duel yet it seems."
 single_combat.0031.desc.sc_attacker.POD_demon_claws:0 "My opponent isn't impressed though, and strikes quickly."
 single_combat.0031.desc.sc_attacker.POD_tormented_essence:0 "这只使其变得更强了。"
 single_combat.0031.desc.sc_attacker.POD_adamantums_wrath:0 "但我的对手并不以为然，并迅速出击。"
 single_combat.0031.desc.sc_attacker.POD_bite.injury:0 "而它来得很快，是以一拳打脸的形式。"
 single_combat.0031.desc.sc_attacker.POD_blood_surge.injury:0 "而这小小的分心足以让我的对手通过迅速地一击取得优势。"
 single_combat.0031.desc.sc_attacker.POD_blood_heal.injury:0 "而这小小的分心足以让我的对手通过迅速地一击取得优势。"
 single_combat.0031.desc.sc_attacker.POD_blink.injury:0 "而我如同所预想的那样挂彩了。"
 single_combat.0031.desc.sc_attacker.POD_lightning_strike.injury:0 "而我对手的反击却非如此。"
 single_combat.0031.desc.sc_attacker.POD_split_second.injury:0 "而不出意外的话我会被下一击击中。"
 single_combat.0031.desc.sc_attacker.POD_unerring_aim.injury:0 "拉近了距离，我的敌人为我的放肆打了我一拳。"
 single_combat.0031.desc.sc_attacker.POD_lethal_body.injury:0 "而我的对手则没这样。而这很痛。"
 single_combat.0031.desc.sc_attacker.POD_brutal_feed.injury:0 "而它来得很快，是以一拳打脸的形式。"
 single_combat.0031.desc.sc_attacker.POD_earthshock.injury:0 "被失误所分心，我没能注意到袭来的一击。"
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine.injury:0 "而他的反击要强得多了，我艰难地就从该一击中恢复过来。"
 single_combat.0031.desc.sc_attacker.POD_toughness.injury:0 "看上去这次的坚韧术还不够"
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.injury:0 "我感到自己如同处于地震的中心。"
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.injury:0 "我的对手确保了这很快就会更痛。"
 single_combat.0031.desc.sc_attacker.POD_feral_weapons.injury:0 "其的反击也同样危险，在这回合我处于下风。"
 single_combat.0031.desc.sc_attacker.POD_shapechange.injury:0 "我的对手利用人类世代驯服野生动物的经验，开始将我的动物形态打得落花流水。"
 single_combat.0031.desc.sc_attacker.POD_vanish.injury:0 "而其的下一击很是猛厉。"
 single_combat.0031.desc.sc_attacker.POD_nocturne.injury:0 "而这被其几乎完美的下一击所证明。"
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman.injury:0 "因这一失败而分心，我不得不忍受一些快速的反击。"
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within.injury:0 "而我面对其的下一击却没能那么完美。"
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows.injury:0 "不再无敌的人显然会受到极大的痛苦。"
 single_combat.0031.desc.sc_attacker.POD_compel.injury:0 "随后命令其一拳崩头上。算是成了。"
 single_combat.0031.desc.sc_attacker.POD_terminal_decree.injury:0 "随后命令其一拳崩头上。算是成了。"
 single_combat.0031.desc.sc_attacker.POD_daunt.injury:0 "而这被其几乎完美的下一击所证明。"
 single_combat.0031.desc.sc_attacker.POD_dread_gaze.injury:0 "而作为挨打的一方，这很痛。"
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae.injury:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。"
 single_combat.0031.desc.sc_attacker.POD_scorpions_touch.injury:0 "你在闪避其的时候也缺乏了同样的谨慎，你最终输掉了这一回合。"
 single_combat.0031.desc.sc_attacker.POD_theft_of_vitae.injury:0 "很快，对手的拳头就殴到了我的脸上让我飞了出去。"
 single_combat.0031.desc.sc_attacker.POD_baals_curse.injury:0 "你在闪避其的时候也缺乏了同样的谨慎，你最终输掉了这一回合。"
 single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood.injury:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。"
 single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion.injury:0 "甚至没有被吓倒，在这战斗回合中，我的敌人占了上风。"
 single_combat.0031.desc.sc_attacker.POD_stygian_shroud.injury:0 "我很快就确认到了这一点，因为我的胆被一只由血强化的脚踢中了。"
 single_combat.0031.desc.sc_attacker.POD_fire_torch.injury:0 "My pitiful attack is then countered by a masterful strike. It hurts."
