 single_combat.0001.tt.POD_stand_upon_the_dragons_back:0 "#D 你将自己深深的扎根于大地。"
 single_combat.0001.POD_dragon_ward:0 "离我远点！"
 single_combat.0001.tt.POD_dragon_ward:0 "#D 你生成一片强力的护卫光壁将你对手推开。"
