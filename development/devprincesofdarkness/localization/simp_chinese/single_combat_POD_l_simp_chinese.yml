 single_combat.0001.desc.opponent_response.POD_five_poison_cloud:0 "The black Yin energy of the cloud hurls towards me."
 single_combat.0001.desc.opponent_response.POD_ching_shih:0 "The terrible monster form is now facing me."
 single_combat.0001.desc.opponent_response.POD_long_neck:0 "My foe's extends their limbs, giving them limitless reach."
 single_combat.0001.desc.opponent_response.POD_bloodlash:0 "A tendril of blood is created, giving my opponent new opportunities."
 single_combat.0001.desc.opponent_response.POD_goblin_scorch:0 "The spirit flames are hurled towards me."
