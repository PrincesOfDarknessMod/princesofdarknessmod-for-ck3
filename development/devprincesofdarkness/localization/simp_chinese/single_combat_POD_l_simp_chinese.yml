 single_combat.0041.desc.sc_defender.POD_bite:0 "我向前扑去，试图将我锋利的獠牙刺入我面前诱人的脖子。"
 single_combat.0041.desc.sc_defender.POD_blood_surge:0 "我催动了我的血之力获得力量。"
 single_combat.0041.desc.sc_defender.POD_blood_heal:0 "我催动了我的血之力来缝合我的伤口，并医治我自己。"
 single_combat.0041.desc.sc_defender.POD_blink:0 "我向前冲的速度比眼睛所能捕捉的还要快，希望我的对手没能预料到我的动作。"
 single_combat.0041.desc.sc_defender.POD_lightning_strike:0 "我用迅捷术的力量进行本能地攻击，试图抓住我的对手的破绽。"
 single_combat.0041.desc.sc_defender.POD_split_second:0 "随着迅捷术的生效，时间在我周围变慢了。我必须利用这个机会。"
 single_combat.0041.desc.sc_defender.POD_unerring_aim:0 "由于我对迅捷术的掌握，我的下一击将是绝对精准的。"
 single_combat.0041.desc.sc_defender.POD_lethal_body:0 "蛮力术使我能够以用雪崩般的冲击力蹦向我的对手。"
 single_combat.0041.desc.sc_defender.POD_brutal_feed:0 "我冲向前扑往颈部，期望能在几秒钟内就给我的对手放空血。"
 single_combat.0041.desc.sc_defender.POD_earthshock:0 "Striking the earth, I make the floor itself tremble under us."
 single_combat.0041.desc.sc_defender.POD_fist_of_caine:0 "Thanks to Potence, the air moved by my brawling motions is a deadly weapon in itself."
 single_combat.0041.desc.sc_defender.POD_toughness:0 "My flesh turn unnaturally resistant, hopefully blocking any incoming blow."
 single_combat.0041.desc.sc_defender.POD_flesh_of_marble:0 "My flesh turns to supernatural marble, impervious to any damage. Hopefully."
 single_combat.0041.desc.sc_defender.POD_prowess_from_pain:0 "My wounds feed me, I'm growing stronger by the second."
 single_combat.0041.desc.sc_defender.POD_feral_weapons:0 "My claws are outstretched ready to cleave my opponent in half."
 single_combat.0041.desc.sc_defender.POD_shapechange:0 "I use my animal form to jump at my opponent fangs first."
 single_combat.0041.desc.sc_defender.POD_vanish:0 "I disappear from sight, trying to confuse my opponent."
 single_combat.0041.desc.sc_defender.POD_nocturne:0 "Shadows swirl around our battlefield, making it difficult to see."
 single_combat.0041.desc.sc_defender.POD_arms_of_ahriman:0 "Black tentacles appear from the earth and try to strike at my foe."
 single_combat.0041.desc.sc_defender.POD_the_darkness_within:0 "Shadows swirl around my opponent, looking for an opening."
 single_combat.0041.desc.sc_defender.POD_aegis_of_shadows:0 "A shadow armor appears around me, protecting me from harm."
 single_combat.0041.desc.sc_defender.POD_compel:0 "I issue a quick order to my opponent."
 single_combat.0041.desc.sc_defender.POD_terminal_decree:0 "I issue an order to my opponent to hurt themselves."
 single_combat.0041.desc.sc_defender.POD_daunt:0 "I appear grander, more powerful, hopefully enough to deter my foe."
 single_combat.0041.desc.sc_defender.POD_dread_gaze:0 "I appear as my foe's worst nightmare."
 single_combat.0041.desc.sc_defender.POD_extinguish_vitae:0 "With a flick of my hand, I make my opponent's blood inert."
 single_combat.0041.desc.sc_defender.POD_scorpions_touch:0 "I draw some of my blood, transmuting it into poison."
 single_combat.0041.desc.sc_defender.POD_theft_of_vitae:0 "I make the blood pour out of my foe's mouth then guide it to me."
 single_combat.0041.desc.sc_defender.POD_baals_curse:0 "I draw some of my blood and transform it into an extremely aggressive poison."
 single_combat.0041.desc.sc_defender.POD_cauldron_of_blood:0 "随着我的手一挥，我让对手的血液在其的血管中沸腾。"
 single_combat.0041.desc.sc_defender.POD_touch_of_oblivion:0 "我触碰我的对手，将湮灭的原始熵力注入其中。"
 single_combat.0041.desc.sc_defender.POD_stygian_shroud:0 "我将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0041.desc.sc_defender.POD_fire_torch:0 "I hope for a lucky break while swinging madly my torch."
 single_combat.0041.desc.sc_defender.POD_fire_bombs:0 "I launch the alchemical fire towards my opponent."
 single_combat.0041.desc.sc_defender.POD_fire_spewer:0 "The strange machine spits out fire wildly."
 single_combat.0041.desc.sc_defender.POD_crossbow_shot:0 "The shot is fired, seeking its target."
 single_combat.0041.desc.sc_defender.POD_unleash_dogs:0 "The dogs rush towards my foe, hungry for blood and flesh."
 single_combat.0041.desc.sc_defender.POD_stake_attack:0 "I lunge forwards stake first."
 single_combat.0041.desc.sc_defender.POD_oculi_trust:0 "The words of God are spoken, feeling my foe with dread."
 single_combat.0041.desc.sc_defender.POD_oculi_wine:0 "I lunge towards my opponent, seeking to make contact for my curse to take hold."
 single_combat.0041.desc.sc_defender.POD_acre_catechumen:0 "The words of God are spoken, feeling me with power."
 single_combat.0041.desc.sc_defender.POD_acre_flesh:0 "The words of God are spoken, feeling me with endurance."
 single_combat.0041.desc.sc_defender.POD_acre_flight:0 "Blessed by the Divine, I am quicker than ever."
 single_combat.0041.desc.sc_defender.POD_acre_auto:0 "I ready myself for what could be the final blow."
 single_combat.0041.desc.sc_defender.POD_murnau_mirror:0 "The mirror of God shows me the path to match this fiend's prowess."
 single_combat.0041.desc.sc_defender.POD_murnau_arcana:0 "I ready myself to take control over the fiend's powers."
 single_combat.0041.desc.sc_defender.POD_sisters_hosanna:0 "I sing the glory of God, filling me with strength."
 single_combat.0041.desc.sc_defender.POD_sisters_oratorio:0 "I sing the glory of God, filling my foe with horror."
 single_combat.0041.desc.sc_defender.POD_bone_obedience:0 "My bones start to become unbreakable."
 single_combat.0041.desc.sc_defender.POD_five_poison_cloud:0 "The black Yin energy of the cloud hurls towards my foe."
 single_combat.0041.desc.sc_defender.POD_ching_shih:0 "The terrible monster form is now mine "
 single_combat.0041.desc.sc_defender.POD_long_neck:0 "I extend my limbs, giving me limitless reach."
 single_combat.0041.desc.sc_defender.POD_bloodlash:0 "A tendril of blood is created, giving me new opportunities."
 single_combat.0041.desc.sc_defender.POD_goblin_scorch:0 "The spirit flames are hurled towards my opponent."
 single_combat.0041.desc.sc_defender.POD_goblin_lantern:0 "I turn into a glowing orb of fire."
 single_combat.0041.desc.sc_defender.POD_bone_dance:0 "The dance is completed, creating a veil of lethargy in the area."
 single_combat.0041.desc.sc_defender.POD_dragon_dance:0 "The dance is complete, and the trance has started."
 single_combat.0041.desc.sc_defender.POD_chi_interrupt:0 "I lunge for my opponent, looking for its critical Chi junctures."
 single_combat.0041.desc.sc_defender.POD_thousand_hell_stare:0 "Pain, anger and despair suddenly consume my opponent's soul."
 single_combat.0041.desc.sc_defender.POD_wind_attack:0 "The wind is on, and I am quicker than ever."
 single_combat.0041.desc.sc_defender.POD_demon_claws:0 "I am the demon and he is me. We will prevail."
