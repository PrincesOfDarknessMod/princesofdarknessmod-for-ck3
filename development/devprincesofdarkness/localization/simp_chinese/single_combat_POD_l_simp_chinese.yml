l_simp_chinese:
 single_combat.0001.POD_bite:0 "我的利齿就足以对付你了！"
 single_combat.0001.tt.POD_bite:0 "#D 你咬了[my_foe.GetFirstName]。"
 single_combat.0001.tt.POD_bite.beast:0 "#R 咬！咬！咬！"
 single_combat.0001.POD_blood_surge:0 "我的血将给予我力量"
 single_combat.0001.tt.POD_blood_surge:0 "#D 你激涌起你的血并变得更强了"
 single_combat.0001.tt.POD_blood_surge.beast:0 "#R 我们会用这份力量碾碎一切！"
 single_combat.0001.POD_blood_heal:0 "回复时间到"
 single_combat.0001.tt.POD_blood_heal:0 "#D 你治愈了你的伤口"
 single_combat.0001.tt.POD_blood_heal.beast:0 "#R 区区小伤对我们不值一提!"
 single_combat.0001.POD_blink: "你都见不到我出手！"
 single_combat.0001.tt.POD_blink: "#D 通过你的迅捷术力量，你攻击[my_foe.GetFirstName]时其甚至没能注意到"
 single_combat.0001.tt.POD_blink.beast:0 "#R [my_foe.GetSheHe]都见不到我们出手！"
 single_combat.0001.POD_lightning_strike:0 "我将神速一击！"
 single_combat.0001.tt.POD_lightning_strike:0 "#D 通过你的迅捷术力量，你将以[my_foe.GetSheHe]没能反应的速度攻击[my_foe.GetFirstName]"
 single_combat.0001.tt.POD_lightning_strike.beast:0 "#R 瞬闪一击！"
 single_combat.0001.POD_split_second:0 "迅如疾风！"
 single_combat.0001.tt.POD_split_second:0 "#D 通过你的迅捷术力量，你将变得超快，以至于[my_foe.GetFirstName]都反应不能"
 single_combat.0001.tt.POD_split_second.beast:0 "#R 我等既快又猛！"
 single_combat.0001.POD_unerring_aim:0 "必中！"
 single_combat.0001.tt.POD_unerring_aim:0 "#D 你以非自然的准头击向了[my_foe.GetFirstName]"
 single_combat.0001.tt.POD_unerring_aim.beast:0 "#R 我等必中！"
 single_combat.0001.POD_lethal_body:0 "我要灭了你！"
 single_combat.0001.tt.POD_lethal_body:0 "#D 你攻向了[my_foe.GetFirstName]，徒手切开[my_foe.GetHerHis]的肉体。"
 single_combat.0001.tt.POD_lethal_body.beast:0 "#R 手撕[my_foe.GetHerHim]！就现在！"
 single_combat.0001.POD_brutal_feed:0 "我要吸干你！"
 single_combat.0001.tt.POD_brutal_feed:0 "#D 通过你的蛮力术力量，你可以迅速吸取[my_foe.GetFirstName]的部分血液"
 single_combat.0001.tt.POD_brutal_feed.beast:0 "#R 好！我们将大快朵颐！"
 single_combat.0001.POD_earthshock:0 "我将劈开大地！"
 single_combat.0001.tt.POD_earthshock:0 "#D 你做出引起地震的强烈攻击"
 single_combat.0001.tt.POD_earthshock.beast:0 "#R 地面无法承受我们的力量！"
 single_combat.0001.POD_fist_of_caine:0 "我要手撕你！"
 single_combat.0001.tt.POD_fist_of_caine:0 "#D 你用能够手撕对方的如此之强的力量攻击[my_foe.GetFirstName]"
 single_combat.0001.tt.POD_fist_of_caine.beast:0 "#R 手撕[my_foe.GetHerHim]！就现在！"
 single_combat.0001.POD_toughness:0 "伤我可不容易！"
 single_combat.0001.tt.POD_toughness:0 "#D 你调用你的血来变得更坚韧"
 single_combat.0001.tt.POD_toughness.beast:0 "#R 盔甲有何用？"
 single_combat.0001.POD_flesh_of_marble:0 "你伤不了我！"
 single_combat.0001.tt.POD_flesh_of_marble:0 "#D 你的皮肤变得几乎无坚不摧"
 single_combat.0001.tt.POD_flesh_of_marble.beast:0 "#R 没人能摧毁我们！"
 single_combat.0001.POD_prowess_from_pain:0 "受伤只会让我变得更强！"
 single_combat.0001.tt.POD_prowess_from_pain:0 "#D 你将从你的伤口获得额外的力量"
 single_combat.0001.tt.POD_prowess_from_pain.beast:0 "#R 一点小伤没法阻碍我们！"
 single_combat.0001.POD_feral_weapons:0 "我的利爪将抓伤你！"
 single_combat.0001.tt.POD_feral_weapons:0 "#D 你调用你的天然武器来攻击[my_foe.GetFirstName}。"
 single_combat.0001.tt.POD_feral_weapons.beast:0 "#R 狩猎时间到！"
 single_combat.0001.POD_shapechange:0 "我将变兽！"
 single_combat.0001.tt.POD_shapechange:0 "#D 你转变成一种可怖的动物形态来攻击[my_foe.GetFirstName]"
 single_combat.0001.tt.POD_shapechange.beast:0 "#R 猛兽来了！"
 single_combat.0001.POD_vanish:0 "你看不到我！"
 single_combat.0001.tt.POD_vanish:0 "#D 你消失了"
 single_combat.0001.tt.POD_vanish.beast:0 "#R 猎物可见不着猎人"
 single_combat.0001.POD_nocturne:0 "你无法逃离我的暗影！"
 single_combat.0001.tt.POD_nocturne:0 "#D 你招出一片能取走[my_foe.GetFirstName]能力的可怕暗影"
 single_combat.0001.tt.POD_nocturne.beast:0 "#R [my_foe.GetSheHe]将害怕黑暗"
 single_combat.0001.POD_arms_of_ahriman:0 "连影子也将攻击你！"
 single_combat.0001.tt.POD_arms_of_ahriman:0 "#D 你召唤出暗影触手来攻击你的敌人"
 single_combat.0001.tt.POD_arms_of_ahriman.beast:0 "#R 即使影子也听从我们！"
 single_combat.0001.POD_the_darkness_within:0 "黑暗使我更强！"
 single_combat.0001.tt.POD_the_darkness_within:0 "#D 你吸收影子并变得更强了"
 single_combat.0001.tt.POD_the_darkness_within.beast:0 "#R 我等即是黑暗！"
 single_combat.0001.POD_aegis_of_shadows:0 "你无法穿透我的暗影盔甲！"
 single_combat.0001.tt.POD_aegis_of_shadows:0 "#D 你召唤暗影盔甲来保护你"
 single_combat.0001.tt.POD_aegis_of_shadows.beast:0 "#R 暗影将护佑我们！"
 single_combat.0001.POD_compel:0 "听从于我！"
 single_combat.0001.tt.POD_compel:0 "#D 你下达了简单的命令来获得对[my_foe.GetFirstName]的优势"
 single_combat.0001.tt.POD_compel.beast:0 "#R 我们统御一切！"
 single_combat.0001.POD_terminal_decree:0 "伤害自己！"
 single_combat.0001.tt.POD_terminal_decree:0 "#D 你命令[my_foe.GetFirstName]去伤害[my_foe.GetHerHim]自己"
 single_combat.0001.tt.POD_terminal_decree.beast:0 "#R 我们有着绝对的控制！"
 single_combat.0001.POD_daunt:0 "我即是你的至暗恐惧！"
 single_combat.0001.tt.POD_daunt:0 "#D 你调用了你的威仪术力量来威吓[my_foe.GetFirstName]"
 single_combat.0001.tt.POD_daunt.beast:0 "#R 我们是[my_foe.GetHerHis]最害怕的恐惧！"
 single_combat.0001.POD_dread_gaze:0 "看着我的眼睛！"
 single_combat.0001.tt.POD_dread_gaze:0 "#D 通过你的威仪术力量，你将[my_foe.GetFirstName]凝固于一处"
 single_combat.0001.tt.POD_dread_gaze.beast:0 "#R 我们双眼如蛇！"
 single_combat.0001.POD_extinguish_vitae:0 "给我你的血！"
 single_combat.0001.tt.POD_extinguish_vitae:0 "#D 你偷走了[my_foe.GetFirstName]一部分的血"
 single_combat.0001.tt.POD_extinguish_vitae.beast:0 "#R 血！终于！"
 single_combat.0001.POD_scorpions_touch:0 "一点毒液就能对付你！"
 single_combat.0001.tt.POD_scorpions_touch:0 "#D 你下毒[my_foe.GetFirstName]"
 single_combat.0001.tt.POD_scorpions_touch.beast:0 "#R 我们直击如蝎！"
 single_combat.0001.POD_theft_of_vitae:0 "你的血将是我的！"
 single_combat.0001.tt.POD_theft_of_vitae:0 "#D 你偷走了[my_foe.GetFirstName]的一部分血，并在过程中伤害[my_foe.GetHerHim]"
 single_combat.0001.tt.POD_theft_of_vitae.beast:0 "#R 血！我们将大快朵颐！"
 single_combat.0001.POD_baals_curse:0 "你无法抵抗我的毒！"
 single_combat.0001.tt.POD_baals_curse:0 "#D 你于[my_foe.GetFirstName]施加了强力的毒"
 single_combat.0001.tt.POD_baals_curse.beast:0 "#R 你将因痛苦而嚎！"
 single_combat.0001.POD_cauldron_of_blood:0 "你的血将沸腾！"
 single_combat.0001.tt.POD_cauldron_of_blood:0 "#D 通过血魔术的力量，你将沸腾[my_foe.GetFirstName]体内的血"
 single_combat.0001.tt.POD_cauldron_of_blood.beast:0 "#R 你将熟！"
 single_combat.0001.POD_touch_of_oblivion:0 "我的触碰将摧毁你的身体！"
 single_combat.0001.tt.POD_touch_of_oblivion:0 "#D 你使用你的湮灭术来通过触碰[my_foe.GetFirstName]对其造成伤害"
 single_combat.0001.tt.POD_touch_of_oblivion.beast:0 "#R 凋零！"
 single_combat.0001.POD_stygian_shroud:0 "黑暗将为你而来！"
 single_combat.0001.tt.POD_stygian_shroud:0 "#D 通过你的湮灭术力量，你召唤了让[my_foe.GetFirstName]盲目的黑暗"
 single_combat.0001.tt.POD_stygian_shroud.beast:0 "#R 黑暗将袭击[my_foe.GetHerHim]！"
 single_combat.0001.POD_fire_torch:0 "上帝之光将驱开你！"
 single_combat.0001.tt.POD_fire_torch:0 "#D 你疯狂地挥舞着光炬。"
 single_combat.0001.POD_fire_bombs:0 "该调和物应该有效……"
 single_combat.0001.tt.POD_fire_bombs:0 "#D 你掷出一些炼金火。"
 single_combat.0001.POD_fire_spewer:0 "火！火！火！"
 single_combat.0001.tt.POD_fire_spewer:0 "#D 你使用了你的临时喷火器。"
 single_combat.0001.POD_crossbow_shot:0 "稳住，瞄准……开火！"
 single_combat.0001.tt.POD_crossbow_shot:0 "#D 弩箭将被射出。"
 single_combat.0001.POD_unleash_dogs:0 "放出战犬！"
 single_combat.0001.tt.POD_unleash_dogs:0 "#D 字面意思上的血肉造物。"
 single_combat.0001.POD_stake_attack:0 "我知道你的弱点！"
 single_combat.0001.tt.POD_stake_attack:0 "#D 你将尖桩对准了对方心脏"
 single_combat.0001.POD_oculi_trust:0 "赞美上帝！"
 single_combat.0001.tt.POD_oculi_trust:0 "#D 你尝试强制使对方为其的罪忏悔"
 single_combat.0001.POD_oculi_wine:0 "生命将放逐死亡！"
 single_combat.0001.tt.POD_oculi_wine:0 "#D 你尝试触碰对方来转变他的血肉。"
 single_combat.0001.POD_acre_catechumen:0 "主即我剑！"
 single_combat.0001.tt.POD_acre_catechumen:0 "#D 通过祈祷，你尝试强化你的能力。"
 single_combat.0001.POD_acre_flesh:0 "主即我盾！"
 single_combat.0001.tt.POD_acre_flesh:0 "#D 通过祈祷，你尝试强化你的能力。"
 single_combat.0001.POD_acre_flight:0 "吾乃上帝之怒！"
 single_combat.0001.tt.POD_acre_flight:0 "#D 你成为火与剑的神圣旋风。"
 single_combat.0001.POD_acre_auto:0 "……肃静"
 single_combat.0001.tt.POD_acre_auto:0 "#D 你沉寂了所有的想法，只专注于这场决斗的终结一击。"
 single_combat.0001.POD_murnau_mirror:0 "你偷走的力量是我的了！"
 single_combat.0001.tt.POD_murnau_mirror:0 "#D 你尝试强化你自己到同级于你的对手"
 single_combat.0001.POD_murnau_arcana:0 "你的力量变换无常……"
 single_combat.0001.tt.POD_murnau_arcana:0 "#D 你尝试让你对手的能力对付其自己。"
 single_combat.0001.POD_sisters_hosanna:0 "主将赐予你力量"
 single_combat.0001.tt.POD_sisters_hosanna:0 "#D 你赞颂着上帝的荣光，期望祂回应。"
 single_combat.0001.POD_sisters_oratorio:0 "唱诵上帝之歌。"
 single_combat.0001.tt.POD_sisters_oratorio:0 "#D 这首圣洁的赞美诗可能会使这些不洁的生物受残害。"
 single_combat.0001.POD_bone_obedience:0 "我无敌了！"
 single_combat.0001.tt.POD_bone_obedience:0 "#D 你使你的骨骼结构钙化，像岩石晶体一样增长。"
 single_combat.0001.POD_five_poison_cloud:0 "我呸！"
 single_combat.0001.tt.POD_five_poison_cloud:0 "#D 你喷吐出一阵高度浓缩的阴气吐息"
 single_combat.0001.POD_ching_shih:0 "吾将化僵……"
 single_combat.0001.tt.POD_ching_shih:0 "#D 你转变成僵尸形态，畸形但加强版的你真实自我"
 single_combat.0001.POD_long_neck:0 "触手及远。"
 single_combat.0001.tt.POD_long_neck:0 "#D 你延伸你的四肢或颈部到令人印象深刻的长度"
 single_combat.0001.POD_bloodlash:0 "血即吾兵。"
 single_combat.0001.tt.POD_bloodlash:0 "#D 允许你制造出致命的血鞭。"
 single_combat.0001.POD_goblin_scorch:0 "焚烧吧！"
 single_combat.0001.tt.POD_goblin_scorch:0 "#D 你喷出一团真火。"
 single_combat.0001.POD_goblin_lantern:0 "吾将化身为火！"
 single_combat.0001.tt.POD_goblin_lantern:0 "#D 你暂时进入自焚状态，允许你变成一团鬼火太阳"
 single_combat.0001.POD_bone_dance:0 "该睡了。"
 single_combat.0001.tt.POD_bone_dance:0 "#D 通过仪式，你试图让每个人都变得昏昏欲睡。"
 single_combat.0001.POD_dragon_dance:0 "该来真的了。"
 single_combat.0001.tt.POD_dragon_dance:0 "#D 你进入战斗专注状态。"
 single_combat.0001.POD_chi_interrupt:0 "点穴！"
 single_combat.0001.tt.POD_chi_interrupt:0 "#D 你试图阻止对手体内的气的流动，造成痛苦的痉挛。"
 single_combat.0001.POD_thousand_hell_stare:0 "感受吾痛！"
 single_combat.0001.tt.POD_thousand_hell_stare:0 "#D 你把你的负面精神能量像刀子一样掷到受害者的灵魂中。"
 single_combat.0001.POD_wind_attack:0 "你跟的上么？"
 single_combat.0001.tt.POD_wind_attack:0 "#D 通过使用妖风，你以超自然速度移动。"
 single_combat.0001.POD_demon_claws:0 "我受够了！"
 single_combat.0001.tt.POD_demon_claws:0 "#D 你转变出你的魔态，尝试劈开你的对手。"
 single_combat.0001.POD_tormented_essence:0 "感受吾痛！"
 single_combat.0001.tt.POD_tormented_essence:0 "#D 你把你的负面精神能量像刀子一样掷到受害者的灵魂中。"
 single_combat.0001.POD_adamantums_wrath:0 "我受够了！"
 single_combat.0001.tt.POD_adamantums_wrath:0 "#D 你转变出你的恶魔形态，尝试劈开你的对手。"
 single_combat.0001.desc.my_feedback.POD_bite:0 "我向前扑去，试图将我锋利的獠牙刺入我面前诱人的脖子。"
 single_combat.0001.desc.my_feedback.POD_blood_surge:0 "我催动了我的血之力获得力量。"
 single_combat.0001.desc.my_feedback.POD_blood_heal:0 "我催动了我的血之力来缝合我的伤口，并医治我自己。"
 single_combat.0001.desc.my_feedback.POD_blink:0 "我向前冲的速度比眼睛所能捕捉的还要快，希望我的对手没能预料到我的动作。"
 single_combat.0001.desc.my_feedback.POD_lightning_strike:0 "我用迅捷术的力量进行本能地攻击，试图抓住我的对手的破绽。"
 single_combat.0001.desc.my_feedback.POD_split_second:0 "随着迅捷术的生效，时间在我周围变慢了。我必须利用这个机会。"
 single_combat.0001.desc.my_feedback.POD_unerring_aim:0 "由于我对迅捷术的掌握，我的下一击将是绝对精准的。"
 single_combat.0001.desc.my_feedback.POD_lethal_body:0 "蛮力术使我能够以用雪崩般的冲击力蹦向我的对手。"
 single_combat.0001.desc.my_feedback.POD_brutal_feed:0 "我冲向前扑往颈部，期望能在几秒钟内就给我的对手放空血。"
 single_combat.0001.desc.my_feedback.POD_earthshock:0 "猛击大地，我将使地面在我等之下颤抖。"
 single_combat.0001.desc.my_feedback.POD_fist_of_caine:0 "多亏蛮力术，我的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0001.desc.my_feedback.POD_toughness:0 "我的肉体具有了非自然的抗性，应该能挡住任何来袭的攻击。"
 single_combat.0001.desc.my_feedback.POD_flesh_of_marble:0 "我的肉体变成了超自然的坚石，不再受任何损害。希望如此。"
 single_combat.0001.desc.my_feedback.POD_prowess_from_pain:0 "我的伤口供养我，让我在瞬间内变得更强大。"
 single_combat.0001.desc.my_feedback.POD_feral_weapons:0 "我的利爪长了出来，准备把我的对手劈成两半。"
 single_combat.0001.desc.my_feedback.POD_shapechange:0 "通过我的动物形态，我先用獠牙扑向我的对手。"
 single_combat.0001.desc.my_feedback.POD_vanish:0 "我从视线中消失，试图迷惑我的对手。"
 single_combat.0001.desc.my_feedback.POD_nocturne:0 "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0001.desc.my_feedback.POD_arms_of_ahriman:0 "黑色的触手从地里出现，试图攻击我的敌人。"
 single_combat.0001.desc.my_feedback.POD_the_darkness_within:0 "暗影在我的对手周围回旋，寻找破绽。"
 single_combat.0001.desc.my_feedback.POD_aegis_of_shadows:0 "暗影盔甲显现在我身上，保护我免受伤害。"
 single_combat.0001.desc.my_feedback.POD_compel:0 "我向我的对手发出了简短的命令。"
 single_combat.0001.desc.my_feedback.POD_terminal_decree:0 "我向我的对手发出命令，让其伤害自己。"
 single_combat.0001.desc.my_feedback.POD_daunt:0 "我变得更宏伟，更有力量，应该足以震慑我的敌人。"
 single_combat.0001.desc.my_feedback.POD_dread_gaze:0 "我显现为我敌人最惧怕的噩梦。"
 single_combat.0001.desc.my_feedback.POD_extinguish_vitae:0 "我手一挥，使我对手的血液静止了。"
 single_combat.0001.desc.my_feedback.POD_scorpions_touch:0 "我抽出一些我的血，将它转化为毒。"
 single_combat.0001.desc.my_feedback.POD_theft_of_vitae:0 "我让血从我的敌人喉内涌出，然后将它引向我。"
 single_combat.0001.desc.my_feedback.POD_baals_curse:0 "我抽出一些我的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0001.desc.my_feedback.POD_cauldron_of_blood:0 "随着我的手一挥，我让对手的血液在其血管中沸腾。"
 single_combat.0001.desc.my_feedback.POD_touch_of_oblivion:0 "我触碰我的对手，将湮灭的原始熵力注入其中。"
 single_combat.0001.desc.my_feedback.POD_stygian_shroud:0 "我将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0001.desc.my_feedback.POD_fire_torch:0 "我疯狂地挥舞火炬期望能幸运的击中。"
 single_combat.0001.desc.my_feedback.POD_fire_bombs:0 "我向我的对手丢出炼金火。"
 single_combat.0001.desc.my_feedback.POD_fire_spewer:0 "奇怪的机器开始疯狂喷火"
 single_combat.0001.desc.my_feedback.POD_crossbow_shot:0 "我对着目标一箭射出。"
 single_combat.0001.desc.my_feedback.POD_unleash_dogs:0 "充满着对血和肉的渴望，这些狗冲向我的敌人。"
 single_combat.0001.desc.my_feedback.POD_stake_attack:0 "我带着尖桩向前冲出。"
 single_combat.0001.desc.my_feedback.POD_oculi_trust:0 "天主之语被口述而出，我的敌人感到了畏惧。"
 single_combat.0001.desc.my_feedback.POD_oculi_wine:0 "我向我的对手冲去，想要碰到其便我的诅咒能够生效。"
 single_combat.0001.desc.my_feedback.POD_acre_catechumen:0 "天主之语被口述而出，给予了我力量。"
 single_combat.0001.desc.my_feedback.POD_acre_flesh:0 "天主之语被口述而出，给予了我坚韧。"
 single_combat.0001.desc.my_feedback.POD_acre_flight:0 "在神圣的保佑下，我从未如此之快。"
 single_combat.0001.desc.my_feedback.POD_acre_auto:0 "我准备好了最后一击。"
 single_combat.0001.desc.my_feedback.POD_murnau_mirror:0 "上帝之镜为我指明了与这个魔物的勇武相匹配的途径。"
 single_combat.0001.desc.my_feedback.POD_murnau_arcana:0 "我准备好接管这个魔物的力量了。"
 single_combat.0001.desc.my_feedback.POD_sisters_hosanna:0 "我歌颂上帝的荣耀，这使我充满了力量。"
 single_combat.0001.desc.my_feedback.POD_sisters_oratorio:0 "我歌颂上帝的荣耀，这使我敌人充满了惊恐。"
 single_combat.0001.desc.my_feedback.POD_bone_obedience:0 "我的骨头开始变得牢不可破。"
 single_combat.0001.desc.my_feedback.POD_five_poison_cloud:0 "阴气云雾向我敌人飘了过去。"
 single_combat.0001.desc.my_feedback.POD_ching_shih:0 "当前这可怖的怪物形态就是我"
 single_combat.0001.desc.my_feedback.POD_long_neck:0 "我伸展我的四肢，让我能无不可及。"
 single_combat.0001.desc.my_feedback.POD_bloodlash:0 "一条条血鞭被制造了出来，给了我新的机会。"
 single_combat.0001.desc.my_feedback.POD_goblin_scorch:0 "真火向我的敌人飘了过去。"
 single_combat.0001.desc.my_feedback.POD_goblin_lantern:0 "我变成了一团鬼火太阳。"
 single_combat.0001.desc.my_feedback.POD_bone_dance:0 "舞蹈已成，在该地区形成了一层让人昏昏欲睡的幔幕。"
 single_combat.0001.desc.my_feedback.POD_dragon_dance:0 "舞蹈已成，该兴奋起来了。"
 single_combat.0001.desc.my_feedback.POD_chi_interrupt:0 "我冲向我的对手，寻找其的气脉穴位。"
 single_combat.0001.desc.my_feedback.POD_thousand_hell_stare:0 "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
 single_combat.0001.desc.my_feedback.POD_wind_attack:0 "风起云涌，我从未如此之快。"
 single_combat.0001.desc.my_feedback.POD_demon_claws:0 "我乃恶魔而其为我。我等将获胜。"
 single_combat.0001.desc.my_feedback.POD_tormented_essence:0 "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
 single_combat.0001.desc.my_feedback.POD_adamantums_wrath:0 "我乃恶魔而其为我。我等将获胜。"
 single_combat.0001.desc.opponent_response.POD_bite:0 "我的敌人冲了过来，试图将其锋利的獠牙插入我诱人的脖子。"
 single_combat.0001.desc.opponent_response.POD_blood_surge:0 "我的敌人催动了其血之力来给予其力量。"
 single_combat.0001.desc.opponent_response.POD_blood_heal:0 "我的敌人催动了其血之力来缝合其的伤口。"
 single_combat.0001.desc.opponent_response.POD_blink:0 "我的敌人向我冲的速度比眼睛所能捕捉的还要快，希望我能预料到其动作。"
 single_combat.0001.desc.opponent_response.POD_lightning_strike:0 "我的敌人用迅捷术的力量进行本能地攻击，试图抓住我的破绽。"
 single_combat.0001.desc.opponent_response.POD_split_second:0 "随着迅捷术的生效，时间在我们周围变慢了。我的对手肯定会利用这个机会。"
 single_combat.0001.desc.opponent_response.POD_unerring_aim:0 "由于其对迅捷术的掌握，我敌人的下一击将是绝对精准的。"
 single_combat.0001.desc.opponent_response.POD_lethal_body:0 "通过蛮力术，我的对手得以用雪崩般的冲击力蹦向了我。"
 single_combat.0001.desc.opponent_response.POD_brutal_feed:0 "我的敌人冲向我扑往颈部，期望能在几秒钟内就给我放空血。"
 single_combat.0001.desc.opponent_response.POD_earthshock:0 "猛击大地，我的敌人使地面在我等之下颤抖。"
 single_combat.0001.desc.opponent_response.POD_fist_of_caine:0 "多亏蛮力术，我的敌人的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0001.desc.opponent_response.POD_toughness:0 "我的对手的肉体具有了非自然的抗性，也许能挡住任何来袭的攻击。"
 single_combat.0001.desc.opponent_response.POD_flesh_of_marble:0 "我的对手的肉体变成了超自然的坚石，不再受任何损害。"
 single_combat.0001.desc.opponent_response.POD_prowess_from_pain:0 "我的敌人伤口供养了其，让其在瞬间内变得更强大。"
 single_combat.0001.desc.opponent_response.POD_feral_weapons:0 "我敌人的利爪长了出来，准备把我劈成两半。"
 single_combat.0001.desc.opponent_response.POD_shapechange:0 "我敌人通过动物形态，先用獠牙扑向了我。"
 single_combat.0001.desc.opponent_response.POD_vanish:0 "我的敌人从视线中消失，试图迷惑我。"
 single_combat.0001.desc.opponent_response.POD_nocturne:0 "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0001.desc.opponent_response.POD_arms_of_ahriman:0 "黑色的触手从地里出现，试图攻击我。"
 single_combat.0001.desc.opponent_response.POD_the_darkness_within:0 "暗影在我周围回旋，寻找破绽。"
 single_combat.0001.desc.opponent_response.POD_aegis_of_shadows:0 "暗影盔甲显现在我的敌人身上，保护其免受伤害。"
 single_combat.0001.desc.opponent_response.POD_compel:0 "我的对手通过支配术向我发出了简短的命令。"
 single_combat.0001.desc.opponent_response.POD_terminal_decree:0 "我的敌人向我发出命令，让我伤害自己。"
 single_combat.0001.desc.opponent_response.POD_daunt:0 "我的敌人变得更宏伟，更有力量，也许足以震慑我。"
 single_combat.0001.desc.opponent_response.POD_dread_gaze:0 "我的敌人显现为我最惧怕的噩梦。令人心烦意乱的景象。"
 single_combat.0001.desc.opponent_response.POD_extinguish_vitae:0 "随着其的手一挥，我的敌人让我的血液静止了。"
 single_combat.0001.desc.opponent_response.POD_scorpions_touch:0 "我敌人抽出一些其的血液，将它转化为毒。"
 single_combat.0001.desc.opponent_response.POD_theft_of_vitae:0 "我的敌人让血从我喉内涌出，然后将它引向其口。"
 single_combat.0001.desc.opponent_response.POD_baals_curse:0 "我的敌人抽出一些其的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0001.desc.opponent_response.POD_cauldron_of_blood:0 "随着其的手一挥，我的敌人让我的血液在我的血管中沸腾。"
 single_combat.0001.desc.opponent_response.POD_touch_of_oblivion:0 "我的对手触碰了我，将湮灭的原始熵力注入我中。"
 single_combat.0001.desc.opponent_response.POD_stygian_shroud:0 "我的敌人将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
