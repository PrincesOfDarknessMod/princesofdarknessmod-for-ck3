 single_combat.0001.desc.opponent_response.POD_acre_flesh:0 "The words of God are spoken, feeling my opponent with endurance."
 single_combat.0001.desc.opponent_response.POD_acre_flight:0 "Blessed by the Divine, my foe is quicker than ever."
 single_combat.0001.desc.opponent_response.POD_acre_auto:0 "My opponent ready themselves for what could be the final blow."
 single_combat.0001.desc.opponent_response.POD_murnau_mirror:0 "The mirror of God shows my opponent the path to match my prowess."
 single_combat.0001.desc.opponent_response.POD_murnau_arcana:0 "My foe ready themselves to take control over my powers."
 single_combat.0001.desc.opponent_response.POD_sisters_hosanna:0 "My opponent sings the glory of God, filling them with strength."
 single_combat.0001.desc.opponent_response.POD_sisters_oratorio:0 "My opponent sings the glory of God, filling me with horror."
