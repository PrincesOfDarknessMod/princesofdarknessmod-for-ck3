 single_combat.0041.desc.opponent_response.POD_blood_atemi.fatality:0 "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.opponent_response.POD_stand_upon_the_dragons_back.fatality:0 "其被推了回去，近乎不能站稳。出局吧！"
 single_combat.0041.desc.opponent_response.POD_dragon_ward.fatality:0 "其被推了回去，近乎不能站稳。出局吧！"
 single_combat.0041.desc.sc_attacker.POD_blood_atemi:0 "我向我的对手冲去，想要让其体内循环会陷入紊乱。"
 single_combat.0041.desc.sc_attacker.POD_stand_upon_the_dragons_back:0 "你把握住了地面和自身的链接。"
 single_combat.0041.desc.sc_attacker.POD_dragon_ward:0 "我睁大我的第三只眼并生成一片强力的护卫光壁。"
 single_combat.0041.desc.sc_attacker.POD_blood_atemi.injury:0 "我对手避开了一击，但没能避开第二击。这很伤。"
