 FIVE_POISON_CLOUD_PERK_EFFECT:0 "允许你喷吐出一阵高度浓缩的阴气吐息或者浓雾，雾气内的金属腐蚀，血肉朽烂，植物枯萎凋零。\n\n获得一项决斗选项。"
 CHING_SHIH_PERK_EFFECT:0 "让你暂时变为魃犼僵尸形态。\n\n获得一项决斗选项和一项变形选项。"
 LONG_NECK_PERK_EFFECT:0 "让你的四肢或颈部伸展到令人印象深刻的长度。\n\n获得一项决斗选项。"
 DETACH_LIMB_PERK_EFFECT:0 "让你身体的一部分脱离主体独自活动。\n\n解锁一项间谍活动选项。"
 LOTUS_BREATH_PERK_EFFECT:0 "允许你喷吐出一片乳白色的云雾，期中混杂了过量的阳气。所有吸纳这片云雾的生物如登极乐飘飘欲仙进而语无伦次不受控制。"
 PELESIT_PERK_EFFECT:0 "让你可以操控自身躯体上的大量微生物，用于探测或其他多种用途。\n\n解锁一项间谍活动选项。"
 TEN_THOUSAND_FORMS_EFFECT:0 "允许你在质量不变的情况下将你的身体塑造成你需要的任何样子。\n\n获得多项变形选项。"
 PERMEATE_PERK_EFFECT:0 "允许你膨胀或萎缩自己的身体。\n\n解锁一项间谍活动选项。"
 BLOOD_ATEMI_PERK_EFFECT:0 "允许你控制被害者身体中的血液。\n\n获得一项决斗选项。"
 FLOW_LIKE_BLOOD_PERK_EFFECT:0 "允许你如血液一般无固定状态。\n\n获得一项变形选项。"
 BLOODLASH_PERK_EFFECT:0 "允许你挥舞水鞭一样来挥动血液。\n\n获得一项决斗选项。"
 BLOOD_AWAKENING_PERK_EFFECT:0 "允许你唤醒或凝固该阳属灵类或死灵。\n\n获得唤醒或凝固灵类角色互动。"
 GOBLIN_FACE_PERK_EFFECT:0 "你眼睛和嘴巴闪烁着骇人的能量火焰。\n\n获得一项变形选项。"
 GOBLIN_SPARK_PERK_EFFECT:0 "允许你召唤一个无害的球状小灵火，它会发出柔和的光，并根据制造者的意愿扭曲成各种形状。"
 GOBLIN_SHAPES_PERK_EFFECT:0 "允许你用大量的鬼火构筑复杂的形体。"
 GOBLIN_SCORCH_PERK_EFFECT:0 "允许你如同上古年代的巨龙一般喷吐冷焰或者真火。\n\n获得一项决斗选项。"
 GOBLIN_LANTERN_PERK_EFFECT:0 "允许你进入彻底的自焚状态，周身充斥着大量的鬼火。\n\n获得一项决斗选项和一项变形选项。"
 STAND_UPON_THE_DRAGONS_BACK_PERK_EFFECT:0 "把握地面和自身的链接，将自己深深的扎根于大地。\n\n获得一项决斗选项。"
 TREAD_THE_THRASHING_DRAGONS_TAIL_PERK_EFFECT:0 "通过将自身的气律散布于周遭环境，让自身变得不可思议的轻盈，安稳行走于各类险阻之上如履平地，甚至可以踏浪行波。"
 PLACATE_THE_EARTH_DRAGON_PERK_EFFECT:0 "通过轻柔的吟颂，鬼人可以安抚大地，岩石，树木的灵。\n\n解锁一项间谍活动选项。"
 HARNESSING_THE_DRAGONS_BREATH_PERK_EFFECT:0 "调律自身的气脉，捕捉地脉的律动，于此可依靠地脉的涌动来进行滑翔飞行。"
 JADE_SERVANT_OF_THE_AUGUST_PERSONAGE_PERK_EFFECT:0 "鬼人完美的调控周遭的五行元气，将传统的五行元素——金木水火土——依其意志塑形变化附着于自身。\n\n解锁多个变形选项。"
 SHROUDED_MOON_PERK_EFFECT:0 "允许你和周边的阴影完美融为一体。\n\n获得一项变形选项。"
 YIN_MANTLE_PERK_EFFECT:0 "允许你将内在阴气引导为阴暗的敌意将人所覆盖，凡人无法察觉这种异常。对他们来说，就像如坠冰窟的寒意。"
 BONE_DANCE_PERK_EFFECT:0 "通过一系列特定的舞姿和神秘缓慢的回旋舞蹈，你能将自身的阴气散步于周边氛围，处于影响范围内的目标变得昏昏欲睡且任意受人摆布。\n\n获得一项决斗选项。"
 EIGHTFOLD_YIN_MANTLE_PERK_EFFECT:0 "类似于初级的阴引仙绫，只不过这时你可以自行塑造周身的气场，将其塑造成任意造型。"
 SEMBLANCE_OF_THE_EBON_DRAGON_PERK_EFFECT:0 "允许你将阴气导引至全身，将自身转换为至阴无极之态。\n\n进入和待在阴界不再有耗费并获得一项变形选项。"
 PRINCIPLE_OF_MOTION_PERK_EFFECT:0 "允许你发掘体内的阳气的力量来强化自身的动作。"
 WHITE_TIGER_CORPSE_PERK_EFFECT:0 "通过调律阴气操控自身的肌肤和骨髓，如此一来可以变得透明不可视。\n\n获得一项变形选项。"
 DRAGON_DANCE_PERK_EFFECT:0 "通过特定的站桩入定，行宫踏步，甚至是诡异的跳大神，让你可进入战斗狂热状态，处于此类状态下可以施展多项惊人的战斗技艺。\n\n获得一项决斗选项。"
 EIGHTFOLD_YANG_MANTLE_PERK_EFFECT:0 "类似于初级的阳引仙绫，只不过这时你可以自行塑造周身的气场，将其塑造成任意造型。"
 SEMBLANCE_OF_THE_SCALET_QUEEN_PERK_EFFECT:0 "允许你将阳气的力量引导至全身，将自身转换完全的纯阳无极之态。\n\n进入和待在阳界不再有耗费并获得一项变形选项。"
 MASTER_FLOW_PERK_EFFECT:0 "让你能快速的调节自身的气脉运转。\n\n允许你在用光你选的气池的气后能动用另一阴阳属性气池。"
 ADJUST_BALANCE_PERK_EFFECT:0 "允许你调节受害者体内的气脉平衡，让因超量的阴阳二气走火入魔，也可用于调节平衡。\n\n解锁同名角色互动。"
 SHIFT_THE_BALANCE_PERK_EFFECT:0 "允许你调节自身的阴阳等级。将自身的阴或者阳等级转化为对立的能量。\n\n增强同名角色互动。"
 CHI_INTERRUPT_PERK_EFFECT:0 "允许你扰乱他人的气脉运行，使他人陷入抽搐痉挛。\n\n获得一项决斗选项。"
 CHI_MASTERY_PERK_EFFECT:0 "允许你让对方体内的气脉流失或气脉逆行。\n\n解锁弱者道之用角色互动。"
 SPIRIT_CALL_PERK_EFFECT:0 "联系灵界，通过将自己编制塑造的有趣（或吵闹生厌）叙事来吸引附近泉水岩石之灵——或者是死者的鬼魂。\n\n解锁对死灵目标用的召唤角色互动。"
 CHI_WARD_PERK_EFFECT:0 "允许你通过调律当地的龙脉强化或者弱化当地的绝壁。\n\n解锁强化或弱化本地绝壁决议。"
 CHI_SHAPING_PERK_EFFECT:0 "允许你将当地的龙脉塑形变化，不论是飞沙，墙壁，巢穴，甚至是风水陷阱。\n\n允许你能够升级掌握龙脉建筑。"
 RIDE_THE_DRAGON_PERK_EFFECT:0 "允许你进入通常的龙脉并进行同调，驾驭它来进行快速移动。"
 CHI_RIFT_PERK_EFFECT:0 "允许你在中原与灵界之间打开传送门，溢出毁灭性的气元风暴。\n\n解锁同名角色互动。"
 RASA_PERK_EFFECT:0 "窥见过去和未来的片段。"
 CHI_SIGHT_PERK_EFFECT:0 "允许你可以细致观察灵界的面貌。\n\n解锁观测本地绝壁决议。"
 DRAGON_WARD_PERK_EFFECT:0 "允许你大睁你的第三只眼并注入大量的内气，进而生成一片强力的护卫光壁。\n\n获得一项决斗选项。"
 SPIRIT_EATING_PERK_EFFECT:0 "这一惊人的异能允许你将目标的灵魂从躯体内移除，来治愈或者抚慰目标的创痛，或直接吞咽受害者的灵魂。\n\n解锁同名角色互动。"
 SCRUTINIZE_PERK_EFFECT:0 "允许你使用此项能力探测自己或他人内心的黑暗。\n\n解锁一项间谍活动选项。"
 CLEAVE_THE_DEMON_PERK_EFFECT:0 "允许你分离自身的魂魄，让其中之一掌控身体而另一游离身外。"
 LASH_THE_DEMON_PERK_EFFECT:0 "允许你将其他鬼神与他们的黑暗面分开。\n\n解锁同名角色互动。"
 TWO_BECOME_ONE_PERK_EFFECT:0 "允许你暂时将魂魄合二为一，随之而来的启明会随着效果结束而消散，进而带来无限沮丧。"
 NO_MIND_PERK_EFFECT:0 "通过一系列的冥想，鬼人将他的意识放空，将自己交由万物指引。"
 BLOOD_YOGA_PERK_EFFECT:0 "通过深度的冥想，鬼人将过往的噩梦挥之一空并以更快的速度恢复他的精神状态。\n\n允许没有相关信条也能使用避世冥想决议，需要耗费威望，若有相关信条不耗费且会获得虔诚。"
 DISTANT_DEATH_KATA_PERK_EFFECT:0 "通过全身心的放松发挥出一记全身全灵的攻击，神秘的直接将伤害传达至目标身上。\n\n解锁同名角色互动。"
 IRON_SOUL_PERK_EFFECT:0 "完美驾驭自身的内在力量。"
 HARMONY_WITH_THE_ALL_PERK_EFFECT:0 "允许你把意念投入伟大轮回，溯回上古的第一纪元，于此状态下一举一动无有瑕疵不谐，任何行动都能下意识的完美达成。\n\n解锁同名角色互动。"
 EVALUATE_PERK_EFFECT:0 "允许你明确了解他人神魂的状态，以此获得各种信息上的优势。\n\n解锁一项间谍活动选项。"
 SOUL_BRIDGE_PERK_EFFECT:0 "允许你可以和他人建立稳定的心灵链接。\n\n解锁同名角色互动。"
 AUTHORITY_PERK_EFFECT:0 "允许你被他人敬畏甚至支配其，就如同臣子面对皇帝一般."
 THOUSAND_HELL_STARE_PERK_EFFECT:0 "允许你驾驭自身的负罪感，困惑，愤怒，饥饿并以将其灌入受害者的灵魂。\n\n解锁一项决斗选项和投射负能量角色互动。"
 SOUL_SHACKLES_PERK_EFFECT:0 "允许你达成持续性，甚至是永久性的灵魂链接。\n\n解锁同名角色互动。"
 BLACK_WIND_PERK_EFFECT:0 "催动魄来增强速度。\n\n在第二级时解锁一项决斗选项。"
 DEMON_SHINTAI_PERK_EFFECT:0 "根据等级获得魔体特性。\n\n在第二级时解锁一项决斗选项和在第三级时解锁一项变形选项。"
 YANG_MANTLE_PERK_EFFECT:0 "允许导引自身的阳气在周身形成无形气场，让对象被极大吸引共情。"
 PURIFICATION_PERK_EFFECT:0 "此项异能源自古老的光辉岁月，彼时的万仙使用这一能力来治愈凡俗驱散恶秽。\n\n解锁同名角色互动。"
 YOKE_THE_DEMON_PERK_EFFECT:0 "允许你在心灵上触及自己的魂魄，将自己的心魔分离并降伏驾驭。分离的心魔可以威吓那些弱小的生物或探测敌人。"
