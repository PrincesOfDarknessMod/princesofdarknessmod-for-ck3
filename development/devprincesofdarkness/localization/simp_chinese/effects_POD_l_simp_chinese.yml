 TOUGHNESS_PERK_EFFECT:0 "所有拥有这种能力的吸血鬼都有一种天生才能，可以忽略那些会给他们带来不方便甚至残疾的伤害。"
 UNSWAYABLE_MIND_PERK_EFFECT:0 "使用者获得了一种神秘的能力，可以抵抗任何通过世俗的魅惑、胁迫和诡计来左右他们的企图。"
 CLOAK_OF_SHADOWS_PERK_EFFECT:0 "站在原地不动，使用者就会融入到周围的环境中。只要他们有某种掩护，不出声，不移动，那就只有机械或超自然的手段才能发现他们。"
 CLOAK_THE_GATHERING_PERK_EFFECT:0 "吸血鬼可以将他们的同伴庇护在混淆之幕下。"
 IMPOSTORS_GUISE_PERK_EFFECT:0 "只要做好准备，吸血鬼可以让自己变成任何体型和性别的特定个体。使用者必须仔细研究被模仿的对象。否则当遇到与被模仿对象非常熟悉的人时，这种伪装就失效了。"
 MASK_OF_THOUSAND_FACES_PERK_EFFECT:0 "比起消失，使用这种能力的吸血鬼可以让自己以一个不起眼的陌生人的身份显现出来。一个预计会出现在该地区的人。"
 SILENCE_OF_DEATH_PERK_EFFECT:0 "这种力量会让使用者完全无声无息，让其发出的所有声音失效。与一般意义上的混淆术不同，这种能力只在听觉上起作用，但作为交换，它的作用更强大。吸血鬼需要制造出很大的声音来打破这种寂静。"
 UNSEEN_PASSAGE_PERK_EFFECT:0 "有了这个能力，吸血鬼现在可以移动的同时保持隐秘。增加你的间谍总管寻找秘密任务的成功概率。"
 VANISH_PERK_EFFECT:0 "吸血鬼似乎眨眼间就消失了，连对他们的记忆也变得模糊不清。"
 BRUTAL_FEED_PERK_EFFECT:0 "在短短几秒钟内，你在伤害你的受害者时吞下大量的鲜血。虽然混乱，但结果很有效。你现在可以在激烈的战斗中使用你的新进食方法，并且可以伪装尸体的咬伤。"
 EARTHSHOCK_PERK_EFFECT:0 "你的力量含带有元素之力。你可以将拳头或脚砸向地面，产生冲击波来将对手击摔和击碎建筑物。"
 FISTS_OF_CAINE_PERK_EFFECT:0 "你可以赤手造成严重的伤害，对凡人和其他吸血鬼都是致命的。你那双手还能肢解、刺穿、刺穿、斩首，甚至可以把心脏从胸腔里直接扯出来。"
 LETHAL_BODY_PERK_EFFECT:0 "使用这种力量，你能够造成可怕的伤害，赤手空拳地撕开皮肤，捶断骨头。"
 PROWESS_PERK_EFFECT:0 "有蛮力术的吸血鬼可以从血液中获得比没有蛮力术的吸血鬼强大得多的力量。"
 SOARING_LEAP_PERK_EFFECT:0 "拥有比手臂和拳头更不圣洁的力量，你可以比任何凡人跳得更高更远。"
 UNCANNY_GRIP_PERK_EFFECT:0 "将自身的非凡之力集于脚趾和手指，你的抓地力几乎能让你自己的四肢钻进到任何表面，使你能够攀爬，甚至挂在墙壁和天花板的不支撑点上。"
 AWE_PERK_EFFECT:0 "任何人只要看到吸血鬼就会莫名其妙地被他们吸引。那些听了吸血鬼的人可能会突然在一些他们曾经持有不同观点的问题上达成一致。\n\n启用交友计谋."
 DAUNT_PERK_EFFECT:0 "吸血鬼使用「威仪术」来排斥人，而不是吸引他们。有了这种力量，使用者就会显得很有威胁性，并散发出强大的威严，足以让大多数凡人移开视线，就连其他吸血鬼也会对使用者三思而行。"
 DREAD_GAZE_PERK_EFFECT:0 "短暂地暴露他们的吸血鬼本样，使用者能向一个目标灌输究极的惊怖。"
 LINGERING_KISS_PERK_EFFECT:0 "吸血鬼的迷吻会让凡人产生近乎狂乐的感觉，但这种力量会把其他的迷吻留在尘土中。被吸血者吸食的人类会对迷吻上瘾，沉迷其中，甚至会寻找吸血鬼反复献食。\n\n当你猎食时，你可以选择把你的受害者加入你的牧群。"
 MAJESTY_PERK_EFFECT:0 "在该异能的顶峰，吸血鬼可以把他们的脸色夸张到超自然的水平。威压气场达到神圣或地狱的等级。\n\n你在掩盖潜藏角色互动中拥有更好的选择。"
 EARTH_MELD_PERK_EFFECT:0 "吸血鬼与土壤融为一体，沉入大地。除非陷入沉眠，否则吸血鬼会在第二天晚上再次复活。"
 EYES_OF_THE_BEAST_PERK_EFFECT:0 "吸血鬼可以将一种超自然的红光射入他们的眼睛，即使在完全没有光的情况下也能让他们看到东西。"
 THE_UNFETTERED_HEART_PERK_EFFECT:0 "掌握了变形术的力量后，使用者的内在变得可塑，几乎是粘性的。心脏是吸血鬼精血和亡生的所在，它将在胸腔内自由地分离和移动，虽然动作很迟缓。"
 WEIGHT_OF_THE_FEATHER_PERK_EFFECT:0 "吸血鬼可以减少自身的有效质量和密度，使自己变得几乎毫无重量。"
 BLOODFORM_PERK_EFFECT:0 "使用高阶变幻术技巧，你可以立即转化成一池有知觉的精血。作为一个角色互动，你现在可以变形为难以捉摸的鲜血形态。"
 MALLEABLE_VISAGE_PERK_EFFECT:0 "使用者可以用简单、美观的方式改变自己的身体。他们可以更高或更结实。他们可以通过重塑喉部来改变自己的声音或者采用新的肤色，眼睛颜色，头发等等。作为一个角色互动，你现在可以调整你的脸，或你血仆的脸。"
 THE_BODY_IMPOLITIC_PERK_EFFECT:0 "可以说，这是世间最令人毛骨悚然的变幻术天赋，分肢而控允许使用者将他们的一部分知觉投入肉体，然后将其与躯干分离，让其执行他们的命令。增加你的间谍总管寻找秘密任务的成功概率。"
 TRANSMOGRIFY_THE_MORTAL_CLAY_PERK_EFFECT:0 "你可以进行突异的转变，不仅是对你自己，而且对任何你能控制足够长的时间来传达你的想象模样的事物。作为一个角色互动，你现在可以召集什拉赫塔军队。"
 ASHES_TO_ASHES_PERK:0 "一种角色互动，让你可以远程摧毁一只血仆。"
 MERITOCRACY_LEGACY_1_PERK_EFFECT:0 "除了以上的效果，每位新裁判官还将更强壮和健美。\n\n健全的心灵寓于强健的体魄。"
