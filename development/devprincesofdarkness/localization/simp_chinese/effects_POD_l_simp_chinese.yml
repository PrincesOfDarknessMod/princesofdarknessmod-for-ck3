 TOREADOR_LEGACY_2_PERK_EFFECT:0 "对勾引计谋强度的增益。\n特洛伊人将得到她的报复，即使世界必须提前焚烧。"
 TOREADOR_LEGACY_3_PERK_EFFECT:0 "对相同信仰好感度的增益。\n大天使失去了他的思想，世界失去了他最后的希望。黑暗时代将永远不会结束。"
 TOREADOR_LEGACY_4_PERK_EFFECT:0 "允许没有结婚就能结成同盟。\n小心被蔑视的女人，因为她的怒火永远不会结束。"
 TOREADOR_LEGACY_5_PERK_EFFECT:0 "对每威望等级可获得的谋略能力的增益，解锁一个传播关于目标的虚假谣言的特殊角色互动。\n最不可能的英雄可以在最不可能的地方被找到。"
 SALUBRI_LEGACY_1_PERK_EFFECT:0 "更难敌人伤亡加成。\n她的复仇是一个可怕的景象，但没有火是永久燃烧下去的。"
 SALUBRI_LEGACY_2_PERK_EFFECT:0 "根据具有军事教育的宗族成员数目解锁特殊指挥官特质。\n萨洛比之剑永不知道失败，即使死亡。"
 SALUBRI_LEGACY_3_PERK_EFFECT:0 "每月虔诚加成，解锁你宗族的种性机制。\n当世界在她周围焚烧的时候，她将高歌。也许这就足够了。"
 SALUBRI_LEGACY_4_PERK_EFFECT:0 "封臣好感加成。\n聪慧的已经在战争来临的时候就准备好避难所了。"
 SALUBRI_LEGACY_5_PERK_EFFECT:0 "减少60%的圣战花费。\n叛徒从未面对制裁，并笑到了最后。对于一位坏掉的男人来说，这是一场痛苦的胜利。"
 LASOMBRA_LEGACY_1_PERK_EFFECT:0 "谋略加成。\n被忌讳的女儿策划着她的复仇。对付阴影，她将使用究极的火焰。"
 LASOMBRA_LEGACY_2_PERK_EFFECT:0 "根据具有军事教育的宗族成员数目解锁特殊指挥官特质。\n暗影再征服将取得成功，但其最终的胜利者可能不是显而易见的那位。"
 LASOMBRA_LEGACY_3_PERK_EFFECT:0 "减少转变信仰花费。\n诚然，最仁慈者甚至超越了死亡。"
 LASOMBRA_LEGACY_4_PERK_EFFECT:0 "谋略加成。\n为谋划而谋划，本身就是一种艺术形式。"
 LASOMBRA_LEGACY_5_PERK_EFFECT:0 "减少创建与改革信仰花费。\n君士坦丁堡进行了痛苦的报复，因为威尼斯与她一同烧毁了。"
 BANUHAQIM_LEGACY_1_PERK_EFFECT:0 "恐怖值加成。\n隐藏在秘密面纱之后，哈基姆圣裔带来的恐惧远远超出其中东边界。"
 BANUHAQIM_LEGACY_2_PERK_EFFECT:0 "根据具有军事教育的宗族成员数目解锁特殊指挥官特质。\n不败者将更上一层。即使死亡也不会偷走他的荣誉。"
 BANUHAQIM_LEGACY_3_PERK_EFFECT:0 "减少创建头衔花费。\n如果没有同龄者的支持，成为最长者并没有什么意义。"
 BANUHAQIM_LEGACY_4_PERK_EFFECT:0 "轻骑兵兵士加成。\n迦太基人的叛徒仍然在夜里游荡，是所有真正的哈基姆圣裔的耻辱。"
 BANUHAQIM_LEGACY_5_PERK_EFFECT:0 "不同信仰好感加成。\n黑牧人将净化这不值者的大地。这是即将末日的这一世界的唯一救赎。"
 MALKAVIAN_LEGACY_1_PERK_EFFECT:0 "家族好感加成。\n末日的预言者很少受到欢迎，但往往说的是正确的。"
 MALKAVIAN_LEGACY_2_PERK_EFFECT:0 "根据压力等级获得收入加成，解锁一个“借用”能力的特殊个人角色互动。\n最后一位真正的末卡维亲王勇敢地与迦太基的恐怖进行了斗争，赢得了所有人的尊重。"
 MALKAVIAN_LEGACY_3_PERK_EFFECT:0 "虔诚加成，解锁一个，如果另一个统治者有任何末卡维的廷臣，就可以削弱其计谋阻力的特殊角色互动。\n我在说谎？你在说谎？世 界 在 说 谎 ？！"
 MALKAVIAN_LEGACY_4_PERK_EFFECT:0 "恐怖值加成。\n只是和我的廷臣们的头们一起吃一顿漂亮的、花哨的晚餐。"
 MALKAVIAN_LEGACY_5_PERK_EFFECT:0 "根据信仰等级获得的学识能力加成。\n当你一开始就没有灵魂的时候，把你的灵魂卖给恶魔还会是坏事吗？"
 NOSFERATU_LEGACY_1_PERK_EFFECT:0 "允许没有结婚就能结成同盟。\n骄傲的怪物站在高处，对抗夜晚的恐怖，将他的[clan|E]提升到更高的高度。"
 NOSFERATU_LEGACY_2_PERK_EFFECT:0 "根据具有军事教育的宗族成员数目解锁特殊指挥官特质。\n中东的上古者都比不上塔利克成熟的技能和不死的信念。"
 NOSFERATU_LEGACY_3_PERK_EFFECT:0 "管理和直辖上限加成。\n丹麦是由阿布萨隆打造的，也是为阿布萨隆打造的，而并将由他来解体。"
 NOSFERATU_LEGACY_4_PERK_EFFECT:0 "优势加成。\n愤怒和仇恨是糟糕的谋士，但却是心兽的最佳燃料。"
 NOSFERATU_LEGACY_5_PERK_EFFECT:0 "恐怖值加成。\n小祖母是唯一的、可怕的、对抗更可怕的恐怖的希望。"
