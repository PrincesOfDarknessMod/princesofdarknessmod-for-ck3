 PROWESS_PERK_EFFECT:0 "有蛮力术的吸血鬼可以从血液中获得比没有蛮力术的吸血鬼强大得多的力量。"
 SOARING_LEAP_PERK_EFFECT:0 "拥有比手臂和拳头更不圣洁的力量，你可以比任何凡人跳得更高更远。"
 UNCANNY_GRIP_PERK_EFFECT:0 "将自身的非凡之力集于脚趾和手指，你的抓地力几乎能让你自己的四肢钻进到任何表面，使你能够攀爬，甚至挂在墙壁和天花板的不支撑点上。"
 AWE_PERK_EFFECT:0 "任何人只要看到吸血鬼就会莫名其妙地被他们吸引。那些听了吸血鬼的人可能会突然在一些他们曾经持有不同观点的问题上达成一致。\n\n启用交友计谋."
 DAUNT_PERK_EFFECT:0 "吸血鬼使用“威仪术”来排斥人，而不是吸引他们。有了这种力量，使用者就会显得很有威胁性，并散发出强大的威严，足以让大多数凡人移开视线，就连其他吸血鬼也会对使用者三思而行。"
