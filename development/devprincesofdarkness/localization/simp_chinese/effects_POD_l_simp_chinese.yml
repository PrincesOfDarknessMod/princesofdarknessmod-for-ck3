 masquerade_exposure_increase_effect.tt:0 "曝露度将增加。"
 masquerade_exposure_decrease_effect.tt:0 "曝露度将减少。"
 hunger_increase_effect.tt:0 "饥渴值将增加。"
 hunger_decrease_effect.tt:0 "饥渴值将减少。"
 BOND_FAMULUS_PERK_EFFECT:0 "一种角色互动，使你能[bind_famulus|E]，与一只动物血缚并与其形成精神链接。"
 ANIMAL_SUCCULENCE_PERK_EFFECT:0 "吸血鬼可以通过捕食动物来消除额外的饥渴。作为一种角色互动，你可以比其他吸血鬼更好的汲取动物。"
 ANIMAL_DOMINION_PERK_EFFECT:0 "“野狗？不！大老鼠！”\n\n吸血鬼控制兽类的力量现在已经足够强大，可以指挥群体和团队，如同它们是自己身体的延伸。作为一种角色互动，让你可以生成一支动物军队。"
 INCORPOREAL_FORM_PERK_EFFECT:0 "允许使用[incorporeal_form|E]。"
 DRAUGHT_OF_ELEGANCE_PERK_EFFECT:0 "你的血液中充满了迅捷术的力量，并能把你力量的一部分传递给任何喝了它的人。作为一种角色互动，让你可以赐予他人你的超自然敏捷。"
 RATIONALIZE_PERK_EFFECT:0 "启用自欺计谋和自欺角色互动。"
 DRAUGHT_OF_ENDURANCE_PERK_EFFECT:0 "你的血液中充满了坚韧术的力量，并能把你力量的一部分传递给任何喝了它的人。\n\n作为一种角色互动，让你可以赐予他人你的超自然耐力。"
 TENEBROUS_AVATAR_PERK_EFFECT:0 "一种角色互动，让你可以变如暗影。"
 DRAUGHT_OF_MIGHT_PERK_EFFECT:0 "你的血液中充满了蛮力术的力量，并能把你力量的一部分传递给任何喝了它的人。作为一种角色互动，让你可以赐予他人你的超自然肉体力量。"
 ENTRANCEMENT_PERK_EFFECT:0 "吸血鬼把他们非自然的吸引力集中在一个人身上，灌输给他们一种着迷或迷恋，类似于神魂颠倒地坠入爱河或遇见自己一生的偶像。\n\n启用[entrance_scheme|E]。"
 SUMMON_PERK_EFFECT:0 "吸血鬼可以召唤任何一个人，无论是凡人或吸血鬼，只要其等曾经被用过使人亲近、迷人魅惑或威压气场，或者至少被尝过一次血。\n\n启用[summon_scheme|E]。"
 FERAL_WEAPONS_PERK_EFFECT:0 "吸血鬼可以把其的天然武器快速生长到可怕的大小。作为一种角色互动，让你可以把你的爪子变成致命的武器。"
 SHAPECHANGE_PERK_EFFECT:0 "吸血鬼可以呈现为动物的形态，通常是与他们[clan|E]相关的动物，或者是他们最常捕食的猎物。作为一种角色互动，让你可以变形成动物。"
 METAMORPHOSIS_PERK_EFFECT:0 "你变成动物形态的能力增强了。作为一种角色互动，让你可以变形成更大的动物。"
 MIST_FORM_PERK_EFFECT:0 "吸血鬼获得了变成一团云雾的传奇能力，可以被眼光察觉，但除了火，阳光和超自然威胁，其他任何东西都无法触及该雾。作为一种角色互动，让你可以变形成迷雾。"
 NEEDS_DISCIPLINE_TEXT:0 "#N 须知你得有基础[discipline|E]特质才能点此树上的技能 #"
 ventrue_clan_bane:0 "该人类不在你的食谱偏好中，吸食其会需要进行一次意志检定。"
 ventrue_clan_bane_anim:0 "梵卓不借助意志力是不能吞下动物的血液的。"
 GAINS_FAITH_LIFESTYLE_XP:1 "获得$VALUE|V0$[faith_lifestyle|E]经验"
