 TELEPATHY_PERK_EFFECT:0 "具有最高级别的观占术时，吸血鬼可以真正的读心，以及投射他们自己的思想到别人的思想内。\n\n你能使用心灵感应角色互动来搜找秘密。"
 DOMINUS_VOBISCUM_PERK_EFFECT:0 "一种角色互动，让你可以祝福另一位角色以暂时提升他的属性。"
 INTERCESSION_PERK_EFFECT:0 "一种角色互动，让你可以给予另一位角色虔诚，并有很小的机会赐予他真信特质。"
 HOLY_BULWARK_PERK_EFFECT:0 "你现在不受任何形式的精神能力的影响。"
 LAY_OF_HANDS_PERK_EFFECT:0 "一种角色互动，让你可以治愈大多数伤病。"
 PENANCE_PERK_EFFECT:0 "一种角色互动，让你可以选择一位吸血鬼以诅咒他（属性减益）。"
 CONVERSION_PERK_EFFECT:0 "一项让你可以立即将自己的国家转化为你的信仰的决议，但要付出高昂的虔诚代价。"
 CORROSIVE_VITAE_PERK:0 "让你在掩盖潜藏角色互动中拥有更好的选择。"
 A_TASTE_OF_BLOOD_PERK:0 "提升间谍首脑在任务查找秘密的能力。"
 CLOUD_MEMORY_PERK:0 "你解锁让人们遗忘特定事件的选择。"
 MESMERIZE_PERK:0 "你将解锁绑架计谋。"
 THE_FORGETFUL_MIND_PERK:0 "让你在掩盖潜藏角色互动中拥有更好的选择。这也启用一种能使受害者得到特定精神错乱的角色互动。"
 SUBMERGED_DIRECTIVE_PERK:0 "你谋杀计谋招募同谋的接受率上升。"
 MASS_MANIPULATION_PERK:0 "一种角色互动，让你可以生成一支疯子军队。"
 SHADOW_CLOAK_PERK:0 "提升你的间谍首脑在任务查找秘密的能力"
 OBLIVIONS_SIGHT_PERK:0 "一种角色互动，让你可以命令死灵对抗其他角色。"
 TOUCH_OF_OBLIVION_PERK:0 "一种角色互动，让你可以缚灵。"
 SHADOW_PERSPECTIVE_PERK:0 "提升你的间谍首脑在任务查找秘密的能力"
 REND_THE_OSSEOUS_FRAME_PERK_EFFECT:0 "掌握到这一阶段，你已经进步到能控制骨头了。单独使用“骨架重塑”就可以对目标造成可怕的伤害。当与皮肉重塑同时使用时，将能把噩梦变为现实。"
 AWAKEN_THE_ZULO_SHAPE_PERK_EFFECT:0 "作为一种角色互动，让你可以变形成可怖的祖罗形态，如同噩梦中出来般的八英尺高生物，布满鳞片和油腻的皮毛，像猿类一样的手臂上长着参差的黑甲，背脊上还长着一排笔直的棘刺。"
 DRAWING_OUT_THE_BEAST_PERK_EFFECT:0 "吸血鬼可以在血狂时将其心兽投射出去，将其转移到附近的目标身上，可以是凡人也可以是吸血鬼。"
 FERAL_WHISPERS_PERK_EFFECT:0 "吸血鬼可以与野外和城市的野兽交流，让吸血鬼可以说服动物为之服务，不过和人类一样，动物很少会同意违背它们本性或危害它们的事情。"
 QUELL_THE_BEAST_PERK_EFFECT:0 "通过盯住目标的眼睛，吸血鬼迫使他们内心的心兽暂时沉睡。"
 SENSE_THE_BEAST_PERK_EFFECT:0 "吸血鬼能够感知到在凡人，吸血鬼，以及其他超自然生物中的心兽存在，获得对其等的天性，饥渴以及敌意的认知。"
 SUBSUME_THE_SPIRIT_PERK_EFFECT:0 "吸血鬼可以将自己的思想完全转移到动物的体内。他们可以控制动物，自由使用它的感官，即使在平常天也能保持清醒。"
 CLAIRVOYANCE_PERK_EFFECT:0 "通过闭上眼睛，进入一种轻微的恍惚状态，吸血鬼将能掌握它周围环境。"
 HEIGHTENED_SENSES_PERK_EFFECT:0 "吸血鬼的感官敏锐到超乎寻常的程度，使他们能够在漆黑的环境中看到东西，听到超声波频率，嗅到对畏缩的猎物的恐惧。\n\n你可以通过决议逃离监狱。"
 PREMONITION_PERK_EFFECT:0 "吸血鬼的经验会能灵光闪现。这些可能会以愤怒、突发灵感甚至是生动的想象的形式出现。虽然这些幻象永远不会太精确，但它们可以让吸血鬼脱离危险，或者揭示以前被忽视的真相。\n\n提升你的间谍首脑在任务查找秘密的能力。"
 SCRY_THE_SOUL_PERK_EFFECT:0 "通过专注于一个人，吸血鬼可以感知到那个人的精神状态，显现为一种变化的有色灵光。灵光揭示了很少的精确信息，但确实提供了许多大概的线索，例如，情绪状态，谐响和超自然特征。\n\n你可以选择“捕捉凡人”角色互动捉到的凡人将拥有的谐响类型。"
 SENSE_THE_UNSEEN_PERK_EFFECT:0 "吸血鬼的感官变得与超越世俗的维度相协调，允许他们感知肉眼看不到的存在。"
 SHARE_THE_SENSES_PERK_EFFECT:0 "吸血鬼通过心灵接触，就能进入另一个凡人或吸血鬼的感官，看到、听到、感觉到他们的所作所为。"
 SPIRITS_TOUCH_PERK_EFFECT:0 "通过触摸无生命的物体或地面，吸血鬼可以感受到那些曾经触摸过那个物体或去过该地的人留下的情感残余，而善于理解者能从中获得提示。"
 BLINK_PERK_EFFECT:0 "你现在的动作如此迅速，与敌人交战或逃跑都在眨眼之间，以至于对一个毫无准备的旁观者来说，你几乎像是在传送，一阵急促的风是你唯一留下的痕迹。"
 CATS_GRACE_PERK_EFFECT:0 "你获得超自然的平衡和优雅，变得能够行走甚至横跨最纤细的壁架和支撑物。"
 FLEETNESS_PERK_EFFECT:0 "你对迅捷术的掌握，现在可以让你以令人目眩的速度来移动和反应。"
 LIGHTNING_STRIKE_PERK_EFFECT:0 "比双眼能捕抓到的速度更快，你可以用拳头或近战武器以如此之快的速度攻击对手，让对手无法自卫或采取规避行动。"
 RAPID_REFLEXES_PERK_EFFECT:0 "虽然吸血鬼的身体仍然不能违背自然法则，但拥有这种能力的他们能瞬间感知事件，并能以超人的敏捷性做出反应。"
 SPLIT_SECOND_PERK_EFFECT:0 "以你超强感知的速度行动，伏击你的人将发现他们的猎物已经站在他们身后，恳求者请求的帮助在讲完之前就完成了。"
 TRAVERSAL_PERK_EFFECT:0 "在一定的速度下，你可以沿着任何表面奔跑或攀爬，包括爬上墙壁，甚至穿越液体介质。"
