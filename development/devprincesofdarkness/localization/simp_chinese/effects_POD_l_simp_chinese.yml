 TELEPATHY_PERK_EFFECT:0 "具有最高级别的观占术时，吸血鬼可以真正的读心，以及投射他们自己的思想到别人的思想内。\n\n你能使用心灵感应角色互动来搜找秘密。"
 DOMINUS_VOBISCUM_PERK_EFFECT:0 "一种角色互动，让你可以祝福另一位角色以暂时提升他的属性。"
 INTERCESSION_PERK_EFFECT:0 "一种角色互动，让你可以给予另一位角色虔诚，并有很小的机会赐予他真信特质。"
 HOLY_BULWARK_PERK_EFFECT:0 "你现在不受任何形式的精神能力的影响。"
 LAY_OF_HANDS_PERK_EFFECT:0 "一种角色互动，让你可以治愈大多数伤病。"
 PENANCE_PERK_EFFECT:0 "一种角色互动，让你可以选择一位吸血鬼以诅咒他（属性减益）。"
 CONVERSION_PERK_EFFECT:0 "一个决议，让你可以立即将自己的国家转化为你的信仰，但要付出高昂的虔诚代价。"
 CORROSIVE_VITAE_PERK:0 "让你在掩盖潜藏角色互动中拥有更好的选择。"
 A_TASTE_OF_BLOOD_PERK:0 "提升间谍首脑在任务查找秘密的能力。"
 CLOUD_MEMORY_PERK:0 "你解锁让人们遗忘特定事件的选择。"
 MESMERIZE_PERK:0 "你将解锁绑架计谋。"
 THE_FORGETFUL_MIND_PERK:0 "让你在掩盖潜藏角色互动中拥有更好的选择。这也启用一种能使受害者得到特定精神错乱的角色互动。"
 SUBMERGED_DIRECTIVE_PERK:0 "你谋杀计谋招募同谋的接受率上升。"
 MASS_MANIPULATION_PERK:0 "一种角色互动，让你可以招出一支疯子军队。"
 SHADOW_CLOAK_PERK:0 "提升你的间谍首脑在任务查找秘密的能力"
 OBLIVIONS_SIGHT_PERK:0 "一种角色互动，让你可以命令死灵对抗其他角色。"
 TOUCH_OF_OBLIVION_PERK:0 "一种角色互动，让你可以缚灵。"
 SHADOW_PERSPECTIVE_PERK:0 "提升你的间谍首脑在任务查找秘密的能力"
 REND_THE_OSSEOUS_FRAME_PERK_EFFECT:0 "掌握到这一阶段，你已经进步到能控制骨头了。单独使用「骨架重塑」就可以对目标造成可怕的伤害。当与皮肉重塑同时使用时，将能把噩梦变为现实。"
 AWAKEN_THE_ZULO_SHAPE_PERK_EFFECT:0 "作为一种角色互动，让你可以变形成可怖的祖罗形态，如同噩梦中出来般的八英尺高生物，布满鳞片和油腻的皮毛，像猿类一样的手臂上长着参差的黑甲，背脊上还长着一排笔直的棘刺。"
 DRAWING_OUT_THE_BEAST_PERK_EFFECT:0 "吸血鬼可以在血狂时将其心兽投射出去，将其转移到附近的目标身上，可以是凡人也可以是吸血鬼。"
 FERAL_WHISPERS_PERK_EFFECT:0 "吸血鬼可以与野外和城市的野兽交流，让吸血鬼可以说服动物为之服务，不过和人类一样，动物很少会同意违背它们本性或危害它们的事情。"
 QUELL_THE_BEAST_PERK_EFFECT:0 "通过盯住目标的眼睛，吸血鬼迫使他们内心的心兽暂时沉睡。"
 SENSE_THE_BEAST_PERK_EFFECT:0 "吸血鬼能够感知到在凡人，吸血鬼，以及其他超自然生物中的心兽存在，获得对其等的天性，饥渴以及敌意的认知。"
 SUBSUME_THE_SPIRIT_PERK_EFFECT:0 "吸血鬼可以将自己的思想完全转移到动物的体内。他们可以控制动物，自由使用它的感官，即使在平常天也能保持清醒。"
 CLAIRVOYANCE_PERK_EFFECT:0 "通过闭上眼睛，进入一种轻微的恍惚状态，吸血鬼将能掌握它周围环境。"
 HEIGHTENED_SENSES_PERK_EFFECT:0 "吸血鬼的感官敏锐到超乎寻常的程度，使他们能够在漆黑的环境中看到东西，听到超声波频率，嗅到对畏缩的猎物的恐惧。\n\n你可以通过一个决议逃离监狱。"
 PREMONITION_PERK_EFFECT:0 "吸血鬼的经验会能灵光闪现。这些可能会以愤怒、突发灵感甚至是生动的想象的形式出现。虽然这些幻象永远不会太精确，但它们可以让吸血鬼脱离危险，或者揭示以前被忽视的真相。\n\n提升你的间谍首脑在任务查找秘密的能力。"
 SCRY_THE_SOUL_PERK_EFFECT:0 "通过专注于一个人，吸血鬼可以感知到那个人的精神状态，显现为一种变化的有色灵光。灵光揭示了很少的精确信息，但确实提供了许多大概的线索，例如，情绪状态，根质和超自然特征。\n\n你可以选择「寻找凡人」角色互动找到的凡人将拥有的根质类型。"
 SENSE_THE_UNSEEN_PERK_EFFECT:0 "吸血鬼的感官变得与超越世俗的维度相协调，允许他们感知肉眼看不到的存在。"
 SHARE_THE_SENSES_PERK_EFFECT:0 "吸血鬼通过心灵接触，就能进入另一个凡人或吸血鬼的感官，看到、听到、感觉到他们的所作所为。"
 SPIRITS_TOUCH_PERK_EFFECT:0 "通过触摸无生命的物体或地面，吸血鬼可以感受到那些曾经触摸过那个物体或去过该地的人留下的情感残余，而善于理解者能从中获得提示。"
 BLINK_PERK_EFFECT:0 "你现在的动作如此迅速，与敌人交战或逃跑都在眨眼之间，以至于对一个毫无准备的旁观者来说，你几乎像是在传送，一阵急促的风是你唯一留下的痕迹。"
 CATS_GRACE_PERK_EFFECT:0 "你获得超自然的平衡和优雅，变得能够行走甚至横跨最纤细的壁架和支撑物。"
 FLEETNESS_PERK_EFFECT:0 "你对迅捷术的掌握，现在可以让你以令人目眩的速度来移动和反应。"
 LIGHTNING_STRIKE_PERK_EFFECT:0 "比双眼能捕抓到的速度更快，你可以用拳头或近战武器以如此之快的速度攻击对手，让对手无法自卫或采取规避行动。"
 RAPID_REFLEXES_PERK_EFFECT:0 "虽然吸血鬼的身体仍然不能违背自然法则，但拥有这种能力的他们能瞬间感知事件，并能以超人的敏捷性做出反应。"
 SPLIT_SECOND_PERK_EFFECT:0 "以你超强感知的速度行动，伏击你的人将发现他们的猎物已经站在他们身后，恳求者请求的帮助在讲完之前就完成了。"
 TRAVERSAL_PERK_EFFECT:0 "在一定的速度下，你可以沿着任何表面奔跑或攀爬，包括爬上墙壁，甚至穿越液体介质。"
 DEFY_BANE_PERK_EFFECT:0 "通过消耗一些能量，吸血鬼可以让自己暂时抵抗火和阳光，以及其他可能让他们陷入终焉之死的严重伤口。"
 FLESH_OF_MARBLE_PERK_EFFECT:0 "血之力量使吸血鬼的皮肤变硬，呈现出大理石般的光泽，却仍然柔软，在被打破和复原之前，几乎可以阻止任何打击。"
 FORTIFY_THE_INNER_FACADE_PERK_EFFECT:0 "这种力量可以让使用者保护自己的思想和情感不受超自然力量的窥探，而不是强化吸血鬼的身体结构。"
 PROWESS_FROM_PAIN_PERK_EFFECT:0 "伤害和损伤现在只会助长吸血鬼的力量，每受到一次打击、撕裂或撕扯，就会变得更强更快。"
 RESILIENCE_PERK_EFFECT:0 "被赋予了超自然的耐力，使用者的身体意志得到加强。"
 TOUGHNESS_PERK_EFFECT:0 "所有拥有这种能力的吸血鬼都有一种天生才能，可以忽略那些会给他们带来不方便甚至残疾的伤害。"
 UNSWAYABLE_MIND_PERK_EFFECT:0 "使用者获得了一种神秘的能力，可以抵抗任何通过世俗的魅惑、胁迫和诡计来左右他们的企图。"
 CLOAK_OF_SHADOWS_PERK_EFFECT:0 "站在原地不动，使用者就会融入到周围的环境中。只要他们有某种掩护，不出声，不移动，那就只有机械或超自然的手段才能发现他们。"
 CLOAK_THE_GATHERING_PERK_EFFECT:0 "吸血鬼可以将他们的同伴庇护在混淆之幕下。"
 IMPOSTORS_GUISE_PERK_EFFECT:0 "只要做好准备，吸血鬼可以让自己变成任何体型和性别的特定个体。使用者必须仔细研究被模仿的对象。否则当遇到与被模仿对象非常熟悉的人时，这种伪装就失效了。"
 MASK_OF_THOUSAND_FACES_PERK_EFFECT:0 "比起消失，使用这种能力的吸血鬼可以让自己以一个不起眼的陌生人的身份显现出来。一个预计会出现在该地区的人。"
 SILENCE_OF_DEATH_PERK_EFFECT:0 "这种力量会让使用者完全无声无息，让其发出的所有声音失效。与一般意义上的混淆术不同，这种能力只在听觉上起作用，但作为交换，它的作用更强大。吸血鬼需要制造出很大的声音来打破这种寂静。"
 UNSEEN_PASSAGE_PERK_EFFECT:0 "有了这个能力，吸血鬼现在可以移动的同时保持隐秘。增加你的间谍总管寻找秘密任务的成功概率。"
 VANISH_PERK_EFFECT:0 "吸血鬼似乎眨眼间就消失了，连对他们的记忆也变得模糊不清。"
 BRUTAL_FEED_PERK_EFFECT:0 "在短短几秒钟内，你在伤害你的受害者时吞下大量的鲜血。虽然混乱，但结果很有效。你现在可以在激烈的战斗中使用你的新进食方法，并且可以伪装尸体的咬伤。"
 EARTHSHOCK_PERK_EFFECT:0 "你的力量含带有元素之力。你可以将拳头或脚砸向地面，产生冲击波来将对手击摔和击碎建筑物。"
 FISTS_OF_CAINE_PERK_EFFECT:0 "你可以赤手造成严重的伤害，对凡人和其他吸血鬼都是致命的。你那双手还能肢解、刺穿、刺穿、斩首，甚至可以把心脏从胸腔里直接扯出来。"
 LETHAL_BODY_PERK_EFFECT:0 "使用这种力量，你能够造成可怕的伤害，赤手空拳地撕开皮肤，捶断骨头。"
 PROWESS_PERK_EFFECT:0 "有蛮力术的吸血鬼可以从血液中获得比没有蛮力术的吸血鬼强大得多的力量。"
 SOARING_LEAP_PERK_EFFECT:0 "拥有比手臂和拳头更不圣洁的力量，你可以比任何凡人跳得更高更远。"
 UNCANNY_GRIP_PERK_EFFECT:0 "将自身的非凡之力集于脚趾和手指，你的抓地力几乎能让你自己的四肢钻进到任何表面，使你能够攀爬，甚至挂在墙壁和天花板的不支撑点上。"
 AWE_PERK_EFFECT:0 "任何人只要看到吸血鬼就会莫名其妙地被他们吸引。那些听了吸血鬼的人可能会突然在一些他们曾经持有不同观点的问题上达成一致。\n\n启用交友计谋."
 DAUNT_PERK_EFFECT:0 "吸血鬼使用「威仪术」来排斥人，而不是吸引他们。有了这种力量，使用者就会显得很有威胁性，并散发出强大的威严，足以让大多数凡人移开视线，就连其他吸血鬼也会对使用者三思而行。"
 DREAD_GAZE_PERK_EFFECT:0 "短暂地暴露他们的吸血鬼本样，使用者能向一个目标灌输究极的惊怖。"
 LINGERING_KISS_PERK_EFFECT:0 "吸血鬼的迷吻会让凡人产生近乎狂乐的感觉，但这种力量会把其他的迷吻留在尘土中。被吸血者吸食的人类会对迷吻上瘾，沉迷其中，甚至会寻找吸血鬼反复献食。\n\n当你猎食时，你可以选择把你的受害者加入你的牧群。"
 MAJESTY_PERK_EFFECT:0 "在该异能的顶峰，吸血鬼可以把他们的脸色夸张到超自然的水平。威压气场达到神圣或地狱的等级。\n\n你在掩盖潜藏角色互动中拥有更好的选择。"
 EARTH_MELD_PERK_EFFECT:0 "吸血鬼与土壤融为一体，沉入大地。除非陷入沉眠，否则吸血鬼会在第二天晚上再次复活。"
 EYES_OF_THE_BEAST_PERK_EFFECT:0 "吸血鬼可以将一种超自然的红光射入他们的眼睛，即使在完全没有光的情况下也能让他们看到东西。"
 THE_UNFETTERED_HEART_PERK_EFFECT:0 "掌握了变形术的力量后，使用者的内在变得可塑，几乎是粘性的。心脏是吸血鬼精血和亡生的所在，它将在胸腔内自由地分离和移动，虽然动作很迟缓。"
 WEIGHT_OF_THE_FEATHER_PERK_EFFECT:0 "吸血鬼可以减少自身的有效质量和密度，使自己变得几乎毫无重量。"
 BLOODFORM_PERK_EFFECT:0 "使用高阶变幻术技巧，你可以立即转化成一池有知觉的精血。作为一个角色互动，你现在可以变形为难以捉摸的鲜血形态。"
 MALLEABLE_VISAGE_PERK_EFFECT:0 "使用者可以用简单、美观的方式改变自己的身体。他们可以更高或更结实。他们可以通过重塑喉部来改变自己的声音或者采用新的肤色，眼睛颜色，头发等等。作为一个角色互动，你现在可以调整你的脸，或你血仆的脸。"
 THE_BODY_IMPOLITIC_PERK_EFFECT:0 "可以说，这是世间最令人毛骨悚然的变幻术天赋，分肢而控允许使用者将他们的一部分知觉投入肉体，然后将其与躯干分离，让其执行他们的命令。增加你的间谍总管寻找秘密任务的成功概率。"
 TRANSMOGRIFY_THE_MORTAL_CLAY_PERK_EFFECT:0 "你可以进行突异的转变，不仅是对你自己，而且对任何你能控制足够长的时间来传达你的想象模样的事物。作为一个角色互动，你现在可以召集什拉赫塔军队。"
 ASHES_TO_ASHES_PERK:0 "一种角色互动，让你可以远程摧毁一只血仆。"
 MERITOCRACY_LEGACY_1_PERK_EFFECT:0 "除了以上的效果，每位新裁判官还将更强壮和健美。\n\n健全的心灵寓于强健的体魄。"
 MERITOCRACY_LEGACY_2_PERK_EFFECT:0 "除了以上的效果，每位新裁判官还将是更好的刀剑大师或猎人。\n\n汝欲和平，必先备战。"
