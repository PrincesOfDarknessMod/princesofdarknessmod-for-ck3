 SHADOW_PLAY_PERK_EFFECT:0 "虽然这种能力不允许人物创造无源的影子，但它允许一个人操纵、移动和使环境中的影子活动起来。这可以赋予社会效果，比如利用影子使自己更有气势，或者根据自己的需要塑造一个环境，创造暗影区域来隐藏一个人或物体。"
 NOCTURNE_PERK_EFFECT:0 "解锁[nocturne|E]能力。目前对敌方的减益：-2勇武。"
 NIGHT_SHADES_PERK_EFFECT:0 "允许你能通过生成军队[character_interaction|E]，以个人身份召唤黯影。"
 ARMS_OF_AHRIMAN_PERK_EFFECT:0 "有了这个能力，勒森魃将能黑暗塑造成触手，可以攻击、限制和抓取敌人。"
 TENEBROUS_AVATAR_OBTENEBRATION_PERK_EFFECT:0 "解锁[tenebrous_avatar|E]能力。"
