 THE_BODY_IMPOLITIC_PERK_EFFECT:0 "可以说，这是世间最令人毛骨悚然的变幻术天赋，分肢而控允许使用者将他们的一部分知觉投入肉体，然后将其与躯干分离，让其执行他们的命令。增加你的间谍总管寻找秘密任务的成功概率。"
