 OUBLIETTE_PERK_EFFECT:0 "解锁[abduction|E]计谋"
 WALK_THE_ABYSS_PERK_EFFECT:0 "通过穿越深渊，还能力允许角色进入一片黑暗中，并从视线范围内的第二片黑暗中走出来。角色也可以使用这个能力，将他们的手伸入影子中，在第二片影子的范围内抓住某个东西。"
 DRAIN_THE_LIFE_PERK_EFFECT:0 "解锁[drain_the_life|E]能力。"
 DARK_WHISPERS_PERK_EFFECT:0 "有了这种能力，角色可以用近距离的影子来投射其的感情。"
 GOD_IN_DARKNESS_PERK_EFFECT:0 "增强[tenebrous_avatar|E]能力。"
 DARKSIGHT_PERK_EFFECT:0 "[elder_perk|E]，只有三到七代吸血鬼能点这个技能。增强[abyss_eyes|E]能力。"
 SHADOWSTEP_PERK_EFFECT:0 "[elder_perk|E]，只有三到七代吸血鬼能够点这个技能。吸血鬼消失在影中，滑过“迷界”，在穿越了比死亡更肮脏和比饥渴还饥渴的东西之后重新出现。他们踏入一片足以覆盖他们的暗影，并从一个他们可以看到的暗影中重新出现。"
 SHADOW_TWIN_PERK_EFFECT:0 "[elder_perk|E]，只有三到六代吸血鬼能点这个技能。解锁[shadow_twin|E]能力。"
 AEGIS_OF_SHADOWS_PERK_EFFECT:0 "[elder_perk|E]，只有三到五代吸血鬼能点这个技能。将你自身防护在一个强力的暗影盔甲中。"
 DEVOUR_ALL_HOPE_PERK_EFFECT:0 "[elder_perk|E]，只有三到五代吸血鬼能点这个技能。增强[nocturne|E]能力。目前对敌方的减益：-5勇武。"
 AHRIMANS_DEMESNE_PERK_EFFECT:0 "[elder_perk|E]，只有三到四代吸血鬼能点这个技能。增强[drain_the_life|E]能力。现在能减益整个国家，无论大小。"
