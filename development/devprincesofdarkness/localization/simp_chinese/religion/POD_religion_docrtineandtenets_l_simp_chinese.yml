 doctrine_vampirebloodoath_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_vampireghouling_ignorant_name:0 "无知"
 doctrine_vampireghouling_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_bloodsorcery_ignorant_name:0 "无知"
 doctrine_bloodsorcery_ignorant_desc:0 "根本就没有魔法这回事。"
 doctrine_infernalism_ignorant_name:0 "无知"
 doctrine_infernalism_ignorant_desc:0 "魔鬼只是一个用词罢了，对吧？"
 doctrine_vampirism_ignorant_name:0 "无知"
 doctrine_vampirism_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_lycanthropy_ignorant_name:0 "无知"
 doctrine_lycanthropy_ignorant_desc:0 "不要再问MoD开发者什么时候会添加这个特性了！当我们添加它时，你自然就会知道了！"
 doctrine_magicraft_ignorant_name:0 "无知"
 doctrine_magicraft_ignorant_desc:0 "根本就没有魔法这回事。"
 doctrine_haunting_ignorant_name:0 "无知"
 doctrine_haunting_ignorant_desc:0 "你死了，就没了。"
 doctrine_glamour_ignorant_name:0 "无知"
 doctrine_glamour_ignorant_desc:0 "你不觉得你已经老于相信圣诞老人的年纪了么？"
 special_doctrine_ignorance_name:0 "不要引起注意"
 special_doctrine_ignorance_desc:0 "凡人对黑暗世界中的超自然生物一无所知。我们应该保持这种状态。"
 doctrine_parameter_hostility_override_special_doctrine_ignorance:0 "无知[faiths|E]如凡人无知者使得他们对黑暗世界的超自然生物不成威胁。希望让凡人保持无知的信仰将其等视为[GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V]而非#V 敌对#!"
 doctrine_parameter_hostility_override_ignorance_hostility_doctrine:0 "无知[faiths|E]如凡人无知者使得他们对黑暗世界的超自然生物不成威胁。希望让凡人保持无知的信仰将其等视为[GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V]而非#V 敌对#!"
 doctrine_parameter_vampireselectivefeeding:0 ""
 tenet_bloodcommunion_name:0 "血圣餐"
 tenet_bloodcommunion_desc:0 "神化信徒的血圣餐是凡人圣餐仪式的不圣洁版。在该信仰中，它与其有许多相同的功能。当然，这里的血并不是比喻——而是会有活人献祭。"
 tenet_exaltedideals_name:0 "崇高理想"
 tenet_exaltedideals_desc:0 "智力、身体和美貌的完善是理想的，而与其对立就是犯罪。完善不只是一种精神状态，更是向低等人开战的理由。"
 special_doctrine_ashirra_pillars_kindred_name:0 "阿什拉派支柱"
 special_doctrine_ashirra_pillars_kindred_desc:0 "虽然那些在伊斯兰教早期阶段皈依的人来自非常不同的氏族和背景，但他们都相信某自己更伟大的存在。"
 doctrine_parameter_hostility_override_special_doctrine_ashirra_pillars_kindred:0 "其他有[ashirra|E]支柱教义的血族[faiths|E]都被认为是正义，而不是#V 敌对#!"