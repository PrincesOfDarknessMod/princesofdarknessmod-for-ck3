 conviction_opinion_active_opinion_name:0 "信念者同类"
 doctrine_parameter_opinion_of_conviction_opinion_active:0 "其他有信念的[opinion|E]：$VALUE|+=0$"
 doctrine_nomarriage_name:0 "不婚"
 doctrine_nomarriage_desc:0 "该宗教没有婚姻。"
 doctrine_onlyconcubines_name:0 "只有侍妾"
 doctrine_onlyconcubines_desc:0 "该宗教只有侍妾，没有配偶。"
 doctrine_vampirethemasquerade_ignorant_name:0 "不知"
 doctrine_vampirethemasquerade_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_oathbreaking_ignorant_name:0 "不知"
 doctrine_oathbreaking_ignorant_desc:0 "破誓不视为一个罪行。"
 doctrine_parameter_oathbreaking_ignorant:0 "有[GetTrait('oathbreaker').GetName( GetPlayer )][trait|E]的角色被无视。"
 doctrine_vampirefrenzy_ignorant_name:0 "不知"
 doctrine_vampirefrenzy_ignorant_desc:0 "是什么让一个人这般失控？"
 doctrine_parameter_vampirefrenzy_ignorant:0 "有[GetTrait('wight').GetName( GetPlayer )][trait|E]的角色正遭受着一种未知的疾病。"
 doctrine_supehunting_ignorant_name:0 "不知"
 doctrine_supehunting_ignorant_desc:0 "教会确实对异端过于狂热了。"
 doctrine_parameter_supehunting_ignorant:0 "有[GetTrait('supehunter').GetName( GetPlayer )][trait|E]的角色对这个宗教是一种未知的奉行。"
 tenet_conviction_and_instinct_name:0 "信念与天性"
 tenet_conviction_and_instinct_desc:0 "吸血鬼不会因为严重伤害或杀死凡人而丢失虔诚。吸血鬼不会因为血狂而丢失虔诚。"
 tenet_conviction_and_selfcontrol_name:0 "信念与自控"
 tenet_conviction_and_selfcontrol_desc:0 "吸血鬼不会因为严重伤害或杀死凡人而丢失虔诚。吸血鬼会因为血狂而丢失虔诚。"
 tenet_conscience_and_selfcontrol_name:0 "良知与自控"
 tenet_conscience_and_selfcontrol_desc:0 "吸血鬼会因为严重伤害或杀死凡人而丢失虔诚。吸血鬼会因为血狂而丢失虔诚。"
 tenet_conscience_and_instinct_name:0 "良知与天性"
 tenet_conscience_and_instinct_desc:0 "吸血鬼会因为严重伤害或杀死凡人而丢失虔诚。吸血鬼不会因为血狂而丢失虔诚。"
 tenet_orun_and_aye_name:0 "奥伦和艾"
 tenet_orun_and_aye_desc:0 "莱本在两条不同的道德心路上度过一生：艾，这是他们对人类的道德：奥伦，这是他们对超自然的道德。"
 tenet_pursuit_of_knowledge_name:0 "追寻知识"
 tenet_pursuit_of_knowledge_desc:0 "对知识的执着追求。罪孽包括：没有在有机会的时候进行研究，拒绝进行实验，拒绝与心路同道者分享自己的见解。"
 tenet_greed_is_good_name:0 "贪即是善"
 tenet_greed_is_good_desc:0 "金钱就是力量，而因此可以使用财富来获得影响力以及餍足他们的心兽。"
 tenet_scorched_heart_name:0 "空心"
 tenet_scorched_heart_desc:0 "由拉斯莫尼库斯开创，通过系统性地根除吸血鬼内心的每一种情感来控制心兽。"
 tenet_isolation_name:0 "隔离"
 tenet_isolation_desc:0 "由拉斯莫尼库斯开创，通过系统性地根除吸血鬼内心的每一种情感来控制心兽。"
 tenet_vengeance_of_lilith_name:0 "莉莉丝的复仇"
 tenet_vengeance_of_lilith_desc:0 "该隐的子嗣破坏了莉莉丝的花园并杀害她的子嗣们的。只有妥芮朵和诺斯费拉图没有破坏，为了表示尊重，他们还在死去的子嗣们的脸蒙上了面纱。因此，他们免受莉莉丝追随者的报复。"
 tenet_continued_life_name:0 "延续凡生"
 tenet_continued_life_desc:0 "一些不死族试图尽可能地继续他们的凡人生活。虽然这有助于他们与自己的晚年凡人生活保持联系，但也增加了[masquerade|E]的曝露。继续使用神秘力量来显出有生气也会增加饥饿感。"
 tenet_vengeance_of_samiel_name:0 "萨麦尔的复仇"
 tenet_vengeance_of_samiel_desc:0 "在扫罗不在的时候，“神圣上主”的指挥官米迦勒拜访了萨麦尔。天使长指示武者之王抄写了法典，以及法典中新武者获取力量和血化所必需的适当仪式。"
 tenet_devoted_to_michael_name:0 "献身于米迦勒"
 tenet_devoted_to_michael_desc:0 "天使长之道是十三世纪拜占庭流行的天国之路。它是为了纪念君士坦丁堡的堕落牧首米迦勒。此道的追随者被称为米迦勒派。"
 tenet_fellow_conviction_opinion:0 "信念者同类"
 conviction_opinion_active_county_opinion_name:0 "信念者同类国家"
 doctrine_haunting_name:0 "作祟"
 doctrine_haunting_crime_name:0 "罪行"
 doctrine_haunting_crime_desc:0 "幽灵必须被关在阴间。\n\n死者之魂\n\n铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切"
 doctrine_haunting_shunned_name:0 "忌讳"
 doctrine_haunting_shunned_desc:0 "幽灵是从尸体上分离出来的灵魂。它们可能会试图附身我们的身体。\n\n死者之魂\n\n铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切"
 doctrine_haunting_accepted_name:0 "接纳"
 doctrine_haunting_accepted_desc:0 "死灵可以很有用。那些懂得召唤死灵与缚灵死灵之术的人可以为了任何缘由使用它们。\n\n死者之魂\n\n铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切"
 doctrine_parameter_haunting_illegal:0 "有[GetTrait('wraith').GetName( GetPlayer )][trait|E] 是[criminals|E]。有[GetTrait('possessed_1').GetName( GetPlayer )]或[GetTrait('oblivion').GetName( GetPlayer )][trait|E]的角色会被[shunned|E]。"
 doctrine_parameter_haunting_shunned:0 "有[GetTrait('wraith').GetName( GetPlayer )]、[GetTrait('possessed_1').GetName( GetPlayer )]或[GetTrait('oblivion').GetName( GetPlayer )][trait|E]的角色会被[shunned|E]。"
 doctrine_parameter_haunting_accepted:0 "有[GetTrait('wraith').GetName( GetPlayer )]或[GetTrait('oblivion').GetName( GetPlayer )][trait|E]的角色是被完全接纳的。"
 tenet_apotheosis_name:0 "神化"
 tenet_apotheosis_desc:0 ""
 special_doctrine_ecumenical_hunters_name:0 "普世猎人"
 special_doctrine_ecumenical_hunters_desc:0 "虽然猎人的背景和信仰各不相同，但他们在与黑暗世界的超自然恐怖的斗争中获得了共同的牵绊。"
 doctrine_parameter_hostility_override_special_doctrine_ecumenical_hunters:0 "视其他拥有普世猎人教条的猎人[faiths|E]为[GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V]而非#V 敌对#!"
