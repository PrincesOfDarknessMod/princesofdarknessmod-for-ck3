l_simp_chinese:
 doctrine_vampirethemasquerade_name:0 "潜藏"
 doctrine_vampirethemasquerade_strict_name:0 "严格的潜藏"
 doctrine_vampirethemasquerade_strict_desc:0 "血之缄默是严格执行的。许多血族对这样严厉的执法感到愤怒。\n\n不要和吟游诗人交朋友，他们会歌颂你太多。\n\n不为人知。寻求阴影。\n\n不要让牧师、诗人或农民看到你吸食。无人能看见后安然离开。\n\n十字架稳固之时，确保你自身的安全。"
 doctrine_vampirethemasquerade_lax_name:0 "宽松的潜藏"
 doctrine_vampirethemasquerade_lax_desc:0 "血之缄默的执行是宽松的。虽然血族努力掩盖他们的存在，但他们有时也会犯可怕的错误，且没有受到长者的惩罚。"
 doctrine_vampirethemasquerade_none_name:0 "不进行潜藏"
 doctrine_vampirethemasquerade_none_desc:0 "吸血鬼行为不注重对血畜保密。"
 doctrine_vampirethemasquerade_consent_name:0 "只有从自愿者处吸食"
 doctrine_vampirethemasquerade_consent_desc:0 "吸血鬼虽然不受社会欢迎，但他们会寻求“捐赠者”的同意。"
 doctrine_vampirethemasquerade_cult_name:0 "血之密教"
 doctrine_vampirethemasquerade_cult_desc:0 "吸血鬼有一个秘密结社或血之密教，将其神化为血神。"
 doctrine_vampirethemasquerade_family_name:0 "家族秘密"
 doctrine_vampirethemasquerade_family_desc:0 "吸血鬼的食物来自特定的凡人家庭，这些家庭可能对吸血鬼的情况有所了解。他们热衷于维持自己的血洁净，唾弃“不洁”的人。"
 doctrine_parameter_vampirethemasquerade_strict:0 "有着[trait|E]：[GetTrait('predatortype_consensualist').GetName( GetPlayer )]、[GetTrait('predatortype_cultist').GetName( GetPlayer )]或[GetTrait('predatortype_familias').GetName( GetPlayer )]的角色都是[criminals|E]"
 doctrine_parameter_vampirethemasquerade_lax:0 "有着[trait|E]：[GetTrait('predatortype_consensualist').GetName( GetPlayer )]、[GetTrait('predatortype_cultist').GetName( GetPlayer )]或[GetTrait('predatortype_familias').GetName( GetPlayer )]的角色都被[shunned|E]"
 doctrine_parameter_vampirethemasquerade_none:0 "吸血鬼不存在。"
 doctrine_parameter_vampirethemasquerade_family:0 "有[GetTrait('predatortype_alleycat').GetName( GetPlayer )]，[GetTrait('predatortype_bedlamite').GetName( GetPlayer )]，[GetTrait('predatortype_farmer').GetName( GetPlayer )]，[GetTrait('predatortype_footpad').GetName( GetPlayer )]或[GetTrait('predatortype_graverobber').GetName( GetPlayer )][trait|E]的角色都被忌讳。有[GetTrait('predatortype_familias').GetName( GetPlayer )][trait|E]的角色是被接纳的。"
 doctrine_parameter_vampirethemasquerade_cult:0 "有着[trait|E]：[GetTrait('predatortype_consensualist').GetName( GetPlayer )]或[GetTrait('predatortype_familias').GetName( GetPlayer )]的角色都被忌讳。而有着[GetTrait('predatortype_cultist').GetName( GetPlayer )][trait|E]的角色都被接受。"
 doctrine_parameter_vampirethemasquerade_consent:0 "有[GetTrait('predatortype_alleycat').GetName( GetPlayer )][trait|E]的角色是[criminals|E]。有[GetTrait('predatortype_cauchemar').GetName( GetPlayer )]或[GetTrait('predatortype_extortionist').GetName( GetPlayer )][trait|E]的角色是被忌讳的。有[GetTrait('predatortype_consensualist').GetName( GetPlayer )][trait|E]的角色是被称赞的。所有其他的掠食者类型都是被接纳的。"
 doctrine_oathbreaking_name:0 "破誓"
 doctrine_oathbreaking_crime_name:0 "罪行"
 doctrine_oathbreaking_crime_desc:0 "誓言是律法的基础。不守誓言的人将失去尊严，并且他们的生命将被剥夺。"
 doctrine_oathbreaking_shunned_name:0 "忌讳"
 doctrine_oathbreaking_shunned_desc:0 "不守誓言的人是不可信任的。小心他们。"
 doctrine_oathbreaking_accepted_name:0 "接受"
 doctrine_oathbreaking_accepted_desc:0 "破誓是被接受的。谁会相信不死族的话？"
 doctrine_parameter_oathbreaking_illegal:0 "有[GetTrait('oathbreaker').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_oathbreaking_shunned:0 "有[GetTrait('oathbreaker').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]"
 doctrine_parameter_oathbreaking_accepted:0 "有[GetTrait('oathbreaker').GetName( GetPlayer )][trait|E]的角色都被完全接纳"
 doctrine_vampirebloodoath_name:0 "血誓"
 doctrine_vampirebloodoath_crime_name:0 "罪行"
 doctrine_vampirebloodoath_crime_desc:0 "被血缚比被奴役更糟糕，因为它不仅束缚了身体，也束缚了心灵和思想。"
 doctrine_vampirebloodoath_shunned_name:0 "忌讳"
 doctrine_vampirebloodoath_shunned_desc:0 "血誓和成为血主的血奴一样，都是一种约束，如果发生的话，一定要谨慎选择。记住箴言。第一口，我会吸。第二口，我接受。第三口，我拒绝。"
 doctrine_vampirebloodoath_accepted_name:0 "接受"
 doctrine_vampirebloodoath_accepted_desc:0 "血誓是我们社会的基础。效忠的誓言应该通过某种程度的血之仆役来执行。"
 doctrine_parameter_vampirebloodoath_illegal:0 "有[GetTrait('bloodoath').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_vampirebloodoath_shunned:0 "有[GetTrait('bloodoath').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]"
 doctrine_parameter_vampirebloodoath_accepted:0 "有[GetTrait('bloodoath').GetName( GetPlayer )][trait|E]的角色是被接纳的。"
 doctrine_vampireghouling_name:0 "血仆封臣"
 doctrine_vampireghouling_crime_name:0 "罪行"
 doctrine_vampireghouling_crime_desc:0 "血仆威胁着血之缄默，不要给无价值者分享血液。\n\n汝辈不当成为赛斯子嗣之神明，\n否则天主之戒备将与日俱增，永久断绝该隐之血脉，\n勿忘和蔼之亚斯他录，\n勿忘丰饶之巴尔，\n勿忘强壮之塔木兹，\n汝辈当知，若为赛斯子嗣之神明，\n其必将以天主之武器奋起反抗，并征服吾族，\n汝辈当如牧者引导其羊群般引导赛斯子嗣，于必要之时剔除彼辈之劣种，\n汝辈当清洁彼辈之血脉，使彼辈远离疾病之侵扰。"
 doctrine_vampireghouling_shunned_name:0 "忌讳"
 doctrine_vampireghouling_shunned_desc:0 "我们是掠食者，不是猎物。与血畜分享你的血将暴露你自己的弱点。\n\n汝辈不当成为赛斯子嗣之神明，\n否则天主之戒备将与日俱增，永久断绝该隐之血脉，\n勿忘和蔼之亚斯他录，\n勿忘丰饶之巴尔，\n勿忘强壮之塔木兹，\n汝辈当知，若为赛斯子嗣之神明，\n其必将以天主之武器奋起反抗，并征服吾族，\n汝辈当如牧者引导其羊群般引导赛斯子嗣，于必要之时剔除彼辈之劣种，\n汝辈当清洁彼辈之血脉，使彼辈远离疾病之侵扰。"
 doctrine_vampireghouling_accepted_name:0 "接受"
 doctrine_vampireghouling_accepted_desc:0 "血畜的职责是为我们服务，当他们被血缚束缚时，他们会成为更好的仆役。\n\n受服侍者\n\n为汝辈以该隐之力量所祝福者，可为守护汝等而居于汝之房屋，其不应为任一血族所[Embrace|E]，而应于恰当之时贡献彼辈之鲜血：\n令其成为汝辈之力量，不会因日光而削弱之力量，令其成为汝辈之双目，不会因白日而致盲之双目，令其成为汝辈之双耳，不会因沉眠而失聪之双耳。\n令彼辈被称之以赛斯子嗣中最伟大、最有特权者。\n令其沉迷于血族之华服，令其享乐于血族之天籁，令其耽溺于血族之美酒。\n吾辈应护其不受他人阻挠与伤害，吾辈应反抗拥吮他人仆从之血族，若非受到挑衅，否则血族不得杀戮他人之仆从。"
 doctrine_vampireghouling_mass_name:0 "接纳制造大量血仆"
 doctrine_vampireghouling_mass_desc:0 "血族之血可建立军队。\n\n受服侍者\n\n为汝辈以该隐之力量所祝福者，可为守护汝等而居于汝之房屋，其不应为任一血族所[Embrace|E]，而应于恰当之时贡献彼辈之鲜血：\n令其成为汝辈之力量，不会因日光而削弱之力量，令其成为汝辈之双目，不会因白日而致盲之双目，令其成为汝辈之双耳，不会因沉眠而失聪之双耳。\n令彼辈被称之以赛斯子嗣中最伟大、最有特权者。\n令其沉迷于血族之华服，令其享乐于血族之天籁，令其耽溺于血族之美酒。\n吾辈应护其不受他人阻挠与伤害，吾辈应反抗拥吮他人仆从之血族，若非受到挑衅，否则血族不得杀戮他人之仆从。"
 doctrine_parameter_vampireghouling_illegal:0 "有[GetTrait('ghoul').GetName( GetPlayer )][trait|E]，[GetTrait('regnant').GetName( GetPlayer )][trait|E]或[GetTrait('massregnant').GetName( GetPlayer )]的角色是[criminals|E]。"
 doctrine_parameter_vampireghouling_shunned:0 "有[GetTrait('ghoul').GetName( GetPlayer )][trait|E]或[GetTrait('regnant').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]。有[GetTrait('massregnant').GetName( GetPlayer )]的角色是[criminals|E]。"
 doctrine_parameter_vampireghouling_accepted:0 "有[GetTrait('ghoul').GetName( GetPlayer )][trait|E]或[GetTrait('regnant').GetName( GetPlayer )][trait|E]的角色是被完全接纳的。有[GetTrait('massregnant').GetName( GetPlayer )]的角色是[criminals|E]。"
 doctrine_parameter_vampireghouling_mass:0 "有[GetTrait('ghoul').GetName( GetPlayer )][trait|E]，[GetTrait('regnant').GetName( GetPlayer )][trait|E]或[GetTrait('massregnant').GetName( GetPlayer )]的角色是被完全接纳的。"
 doctrine_bloodsorcery_name:0 "血魔术"
 doctrine_bloodsorcery_crime_name:0 "罪行"
 doctrine_bloodsorcery_crime_desc:0 "血魔术是对所有血族的威胁，所以其应该被禁止。\n\n启迪之族\n\n力量之母，暗之莉莉丝，乃彼辈之中最为伟大者，但纷纷而来仍有他者。\n汝辈不当啜饮彼辈之鲜血，否则其将诱捕汝等，谨防彼辈，其乃诡计多端之众。\n彼辈知晓亚当之知识，彼辈知晓夏娃之智慧，彼辈乃烈焰之使者，土壤之耕者，兽群之牧者，书写之造者，彼辈乃日耀之子民，初升之明星。\n彼辈会将汝等拖入其之旅途，抵制！抵制！彼辈之路途漠视饥饿，鲜血，与躯体。\n汝辈不当信任一切目视拂晓者。\n切记，拂晓乃汝等死亡之使者"
 doctrine_bloodsorcery_shunned_name:0 "忌讳"
 doctrine_bloodsorcery_shunned_desc:0 "血术士是一个可疑的群体，最多只是一种有时必要的邪恶。\n\n启迪之族\n\n力量之母，暗之莉莉丝，乃彼辈之中最为伟大者，但纷纷而来仍有他者。\n汝辈不当啜饮彼辈之鲜血，否则其将诱捕汝等，谨防彼辈，其乃诡计多端之众。\n彼辈知晓亚当之知识，彼辈知晓夏娃之智慧，彼辈乃烈焰之使者，土壤之耕者，兽群之牧者，书写之造者，彼辈乃日耀之子民，初升之明星。\n彼辈会将汝等拖入其之旅途，抵制！抵制！彼辈之路途漠视饥饿，鲜血，与躯体。\n汝辈不当信任一切目视拂晓者。\n切记，拂晓乃汝等死亡之使者"
 doctrine_bloodsorcery_accepted_name:0 "接受"
 doctrine_bloodsorcery_accepted_desc:0 "魔法充斥着我们周围的世界，我们有权利也有特权像我们的祖先那样融入其中。"
 doctrine_parameter_bloodsorcery_illegal:0 "有[GetTrait('bloodsorcery').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_bloodsorcery_shunned:0 "有[GetTrait('bloodsorcery').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]"
 doctrine_parameter_bloodsorcery_accepted:0 "有[GetTrait('bloodsorcery').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_infernalism_name:0 "崇魔"
 doctrine_infernalism_crime_name:0 "罪行"
 doctrine_infernalism_crime_desc:0 "崇魔意味着将地狱带上人间大地。不要与黑暗交易：届时其将带走我们所有。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现崇魔者需追杀并将其消灭。"
 doctrine_infernalism_shunned_name:0 "忌讳"
 doctrine_infernalism_shunned_desc:0 "与恶魔契约者已种下他们的消亡。不要与黑暗交易：届时其将带走我们所有。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现崇魔者需追杀并将其消灭。"
 doctrine_infernalism_accepted_name:0 "接受"
 doctrine_infernalism_accepted_desc:0 "修炼崇魔是通往真正力量之路"
 doctrine_parameter_infernalism_illegal:0 "有[GetTrait('infernalist').GetName( GetPlayer )][trait|E]或[GetTrait('baali').GetName( GetPlayer )][trait|E]的角色是[criminals|E]。"
 doctrine_parameter_infernalism_shunned:0 "有[GetTrait('infernalist').GetName( GetPlayer )][trait|E]或[GetTrait('baali').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]"
 doctrine_parameter_infernalism_accepted:0 "有[GetTrait('infernalist').GetName( GetPlayer )][trait|E]或[GetTrait('baali').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_vampirediablerie_name:0 "吸榨"
 doctrine_vampirediablerie_crime_name:0 "罪行"
 doctrine_vampirediablerie_crime_desc:0 "吞噬另一个血族的灵魂是我们同类中最严重的罪行。\n\n告别辞，令人生畏的[diablerie|E]\n\n汝辈不当寻求汝之长者的鲜血，汝辈不当寻求汝[Sire|E]之[Sire|E]的鲜血，汝辈不当寻求汝之造者的鲜血，否则当汝因汝不灭之原罪付出代价时，汝将切身感受火葬柴堆之高热。"
 doctrine_vampirediablerie_shunned_name:0 "忌讳"
 doctrine_vampirediablerie_shunned_desc:0 "一旦吸血鬼尝到了其他吸血鬼的血的滋味，他们会停在哪里呢？"
 doctrine_vampirediablerie_accepted_name:0 "接受"
 doctrine_vampirediablerie_accepted_desc:0 "血液属于那些有足够力量来保存它的人。"
 doctrine_vampirediablerie_ignorant_name:0 "不知"
 doctrine_vampirediablerie_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_parameter_vampirediablerie_illegal:0 "有[GetTrait('diablerist').GetName( GetPlayer )]或[GetTrait('predatortype_bloodleech').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_vampirediablerie_shunned:0 "有[GetTrait('diablerist').GetName( GetPlayer )]或[GetTrait('predatortype_bloodleech').GetName( GetPlayer )][trait|E]的角色被[shunned|E]"
 doctrine_parameter_vampirediablerie_accepted:0 "有[GetTrait('diablerist').GetName( GetPlayer )]或[GetTrait('predatortype_bloodleech').GetName( GetPlayer )][trait|E]的角色是被完全接纳的"
 doctrine_parameter_vampirediablerie_ignorant:0 "我们对[GetTrait('diablerist').GetName( GetPlayer )]或[GetTrait('predatortype_bloodleech').GetName( GetPlayer )][trait|E]一无所知"
 doctrine_vampirefrenzy_name:0 "血狂"
 doctrine_vampirefrenzy_crime_name:0 "罪行"
 doctrine_vampirefrenzy_crime_desc:0 "被心兽控制就是变成心兽。记住谚语，控制心兽，别让它控制你。"
 doctrine_vampirefrenzy_shunned_name:0 "忌讳"
 doctrine_vampirefrenzy_shunned_desc:0 "所有血族都反抗心兽的需求，不要轻易屈服。记住谚语，控制心兽，别让它控制你。"
 doctrine_vampirefrenzy_accepted_name:0 "接受"
 doctrine_vampirefrenzy_accepted_desc:0 "乘风破浪！当我们最需要的时候，心兽就是力量！"
 doctrine_parameter_vampirefrenzy_illegal:0 "有[GetTrait('wight').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_vampirefrenzy_shunned:0 "有[GetTrait('wight').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_vampirefrenzy_accepted:0 "有[GetTrait('wight').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_vampirethinblood_name:0 "淡血"
 doctrine_vampirethinblood_crime_name:0 "罪行"
 doctrine_vampirethinblood_crime_desc:0 "淡血种会带来火焚末日！无论在何处发现都要将其消灭！"
 doctrine_vampirethinblood_shunned_name:0 "忌讳"
 doctrine_vampirethinblood_shunned_desc:0 "淡血种是火焚末日的一种预兆。他们被规避和忌讳。"
 doctrine_vampirethinblood_accepted_name:0 "接受"
 doctrine_vampirethinblood_accepted_desc:0 "晚生种和其他吸血鬼一样，只是弱一点。"
 doctrine_vampirethinblood_ignorant_name:0 "不知"
 doctrine_vampirethinblood_ignorant_desc:0 "我们不知道关于吸血鬼的血的事。"
 doctrine_parameter_vampirethinblood_illegal:0 "有着[GetTrait('caitiff').GetName( GetPlayer )]，[GetTrait('vampgeneration14').GetName( GetPlayer )]，[GetTrait('vampgeneration15').GetName( GetPlayer )]和[GetTrait('vampgeneration16').GetName( GetPlayer )][traits|E]的角色是[criminals|E]"
 doctrine_parameter_vampirethinblood_shunned:0 "有着[GetTrait('caitiff').GetName( GetPlayer )]，[GetTrait('vampgeneration14').GetName( GetPlayer )]，[GetTrait('vampgeneration15').GetName( GetPlayer )]和[GetTrait('vampgeneration16').GetName( GetPlayer )][traits|E]的角色是被[shunned|E]"
 doctrine_parameter_vampirethinblood_accepted:0 "有着[GetTrait('caitiff').GetName( GetPlayer )]，[GetTrait('vampgeneration14').GetName( GetPlayer )]，[GetTrait('vampgeneration15').GetName( GetPlayer )]和[GetTrait('vampgeneration16').GetName( GetPlayer )][traits|E]的角色是被接纳的"
 doctrine_parameter_vampirethinblood_ignorant:0 "我们对[GetTrait('caitiff').GetName( GetPlayer )]，[GetTrait('vampgeneration15').GetName( GetPlayer )]和[GetTrait('vampgeneration16').GetName( GetPlayer )][traits|E]一无所知。"
 doctrine_vampirism_name:0 "吸血"
 doctrine_vampirism_crime_name:0 "罪行"
 doctrine_vampirism_crime_desc:0 "血吸虫异怪必须被消灭"
 doctrine_vampirism_shunned_name:0 "忌讳"
 doctrine_vampirism_shunned_desc:0 "可怜这些不能再看日出的不幸者。"
 doctrine_vampirism_accepted_name:0 "接受"
 doctrine_vampirism_accepted_desc:0 "血族是被接纳的。"
 doctrine_parameter_vampirism_illegal:0 "有[GetTrait('vampire').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_vampirism_shunned:0 "有[GetTrait('vampire').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_vampirism_accepted:0 "有[GetTrait('vampire').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_lycanthropy_name:0 "狼人"
 doctrine_lycanthropy_crime_name:0 "罪行"
 doctrine_lycanthropy_crime_desc:0 "狼群必须被消灭。\n\n月之野兽\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 doctrine_lycanthropy_shunned_name:0 "忌讳"
 doctrine_lycanthropy_shunned_desc:0 "虽然和我们同样是超自然生物，但狼人和我们不一样。和我们一点都不一样。\n\n月之野兽\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 doctrine_lycanthropy_accepted_name:0 "接受"
 doctrine_lycanthropy_accepted_desc:0 "狼族是被接纳的。"
 doctrine_parameter_lycanthropy_illegal:0 "有[GetTrait('werewolf').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_lycanthropy_shunned:0 "有[GetTrait('werewolf').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_lycanthropy_accepted:0 "有[GetTrait('werewolf').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_magicraft_name:0 "魔法"
 doctrine_magicraft_crime_name:0 "罪行"
 doctrine_magicraft_crime_desc:0 "法师必须被消灭。\n\n启迪之族\n\n力量之母，暗之莉莉丝，乃彼辈之中最为伟大者，但纷纷而来仍有他者。\n汝辈不当啜饮彼辈之鲜血，否则其将诱捕汝等，谨防彼辈，其乃诡计多端之众。\n彼辈知晓亚当之知识，彼辈知晓夏娃之智慧，彼辈乃烈焰之使者，土壤之耕者，兽群之牧者，书写之造者，彼辈乃日耀之子民，初升之明星。\n彼辈会将汝等拖入其之旅途，抵制！抵制！彼辈之路途漠视饥饿，鲜血，与躯体。\n汝辈不当信任一切目视拂晓者。\n切记，拂晓乃汝等死亡之使者"
 doctrine_magicraft_shunned_name:0 "忌讳"
 doctrine_magicraft_shunned_desc:0 "虽然和我们同样是超自然生物，但法师和我们不一样。和我们一点都不一样。\n\n启迪之族\n\n力量之母，暗之莉莉丝，乃彼辈之中最为伟大者，但纷纷而来仍有他者。\n汝辈不当啜饮彼辈之鲜血，否则其将诱捕汝等，谨防彼辈，其乃诡计多端之众。\n彼辈知晓亚当之知识，彼辈知晓夏娃之智慧，彼辈乃烈焰之使者，土壤之耕者，兽群之牧者，书写之造者，彼辈乃日耀之子民，初升之明星。\n彼辈会将汝等拖入其之旅途，抵制！抵制！彼辈之路途漠视饥饿，鲜血，与躯体。\n汝辈不当信任一切目视拂晓者。\n切记，拂晓乃汝等死亡之使者"
 doctrine_magicraft_accepted_name:0 "接受"
 doctrine_magicraft_accepted_desc:0 "法师是被接纳的。"
 doctrine_parameter_magicraft_illegal:0 "有[GetTrait('mage').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_magicraft_shunned:0 "有[GetTrait('mage').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_magicraft_accepted:0 "有[GetTrait('mage').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_glamour_name:0 "梦华"
 doctrine_glamour_crime_name:0 "罪行"
 doctrine_glamour_crime_desc:0 "妖精必须被消灭。"
 doctrine_glamour_shunned_name:0 "忌讳"
 doctrine_glamour_shunned_desc:0 "虽然和我们同样是超自然生物，但妖精和我们不一样。和我们一点都不一样。\n\n荒野子民\n\n疯狂族类，荒野子民，听吾一言，勿饮其血！\n汝辈当观察彼辈，彼辈之生态令其美丽，彼辈之奥秘令其迷人，彼辈之战技令其致命。\n暗夜生物中之孤独者，彼辈于大地之中与吾族为伴，彼辈于吾族仍有呼吸之时送来解渴之清水。\n如吾一般，彼辈已遭流放，如吾之后裔一般，彼辈无家可归，如吾之后裔之后裔一般，彼辈徘徊徜徉，如吾之先母与先父一般，彼辈知之过多。\n但彼辈仍保有自身之计策，事关彼辈，听吾一言，铭记于心：保持沉默！\n闭口不言\n观察，并学习"
 doctrine_glamour_accepted_name:0 "接受"
 doctrine_glamour_accepted_desc:0 "妖精是被接纳的。\n\n荒野子民\n\n疯狂族类，荒野子民，听吾一言，勿饮其血！\n汝辈当观察彼辈，彼辈之生态令其美丽，彼辈之奥秘令其迷人，彼辈之战技令其致命。\n暗夜生物中之孤独者，彼辈于大地之中与吾族为伴，彼辈于吾族仍有呼吸之时送来解渴之清水。\n如吾一般，彼辈已遭流放，如吾之后裔一般，彼辈无家可归，如吾之后裔之后裔一般，彼辈徘徊徜徉，如吾之先母与先父一般，彼辈知之过多。\n但彼辈仍保有自身之计策，事关彼辈，听吾一言，铭记于心：保持沉默！\n闭口不言\n观察，并学习"
 doctrine_parameter_glamour_illegal:0 "有[GetTrait('fae').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_glamour_shunned:0 "有[GetTrait('fae').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_glamour_accepted:0 "有[GetTrait('fae').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_supehunting_name:0 "猎巫"
 doctrine_supehunting_crime_name:0 "罪行"
 doctrine_supehunting_crime_desc:0 "猎巫人必须被消灭。\n\n当十字有了目标时，你最好有找到安身之处。"
 doctrine_supehunting_shunned_name:0 "忌讳"
 doctrine_supehunting_shunned_desc:0 "最好不要招惹他们的注意。\n\n当十字有了目标时，你最好有找到安身之处。"
 doctrine_supehunting_accepted_name:0 "接受"
 doctrine_supehunting_accepted_desc:0 "猎巫人是被接纳的。"
 doctrine_parameter_supehunting_illegal:0 "有[GetTrait('supehunter').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_supehunting_shunned:0 "有[GetTrait('supehunter').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_supehunting_accepted:0 "有[GetTrait('supehunter').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 tenet_vampiremasquerade_name:0 "潜藏"
 tenet_vampiremasquerade_desc:0 "血之缄默。汝勿向非同血者见汝之性。如此将弃汝谓吾之盟也。"
 tenet_vampireprogeny_name:0 "后嗣"
 tenet_vampireprogeny_desc:0 "惟得长者之许，方可再造。破此，汝与汝之后皆将死。若不得长者许而造一，汝与汝之后皆将死。"
 tenet_vampiredestruction_name:0 "毁灭"
 tenet_vampiredestruction_desc:0 "禁汝灭同类。灭之权惟汝之长。惟尔中最长者乃可召血猎。"
 tenet_vampiretouchstone_name:0 "心眷"
 tenet_vampiretouchstone_desc:0 "血族可以选择一位凡人作为心眷来保持其与人性的相连。该血族获得虔诚。并将有更多心眷相关事件。"
 tenet_vampireremorse_name:0 "懊悔"
 tenet_vampireremorse_desc:0 "血族反思他们的行为，为他们的恶行感到后悔，获得虔诚。"
 tenet_vampireblushoflife_name:0 "生之红晕"
 tenet_vampireblushoflife_desc:0 "血族可以模仿活人生活。这可以帮助他们的[masquerade|E]和回忆何为人类并获得虔诚。"
 tenet_vampirenecromanticexperimention_name:0 "亡灵实验"
 tenet_vampirenecromanticexperimention_desc:0 "铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切\n当吾于日升中天之刻沉眠时，吾兄弟之鲜血便于吾耳边哀号\n吾之兄弟，次生者亚伯，于吾耳畔尖叫\n铭记于心：彼辈乃已死之魂灵\n彼辈之力量非汝等所拥有\n汝辈当倾听彼辈之言词：其话语中蕴含智慧\n汝辈当塞听彼辈之歌声：其旋律内暗藏湮没\n\n死刑既给予抑郁质，又给予虔诚。"
 tenet_vampirenemetamorphopsisexperimention_name:0 "亡灵实验"
 tenet_vampirenemetamorphopsisexperimention_desc:0 "处决既增加胆汁质经验又增加虔诚。"
 tenet_vampireauctoritasritae_name:0 "公共仪式"
 tenet_vampireauctoritasritae_desc:0 "一套由所有魔宴成员参与的十三项仪式。"
 tenet_vampireamaranth_name:0 "不凋花"
 tenet_vampireamaranth_desc:0 "[diablerie|E]实践"
 tenet_vampiremonomacy_name:0 "血斗"
 tenet_vampiremonomacy_desc:0 "一场光荣的决斗，最终以[diablerie|E]结束。血斗仪式用以解决所有魔宴之间的争端。"
 tenet_infernalism_name:0 "崇魔"
 tenet_infernalism_desc:0 "通过与魔鬼签订契约获得恶魔式的叙擢。"
 tenet_vampireinquisition_name:0 "裁判所"
 tenet_vampireinquisition_desc:0 "记住：天主的子嗣，智天使，炽天使，天使长，其之触碰将如米迦勒之焰般焚烧汝辈。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现崇魔者需追杀并将其消灭。"
 tenet_pleasure_name:0 "愉悦"
 tenet_pleasure_desc:0 "享乐者对狂喜的追求"
 tenet_cruelty_name:0 "残暴"
 tenet_cruelty_desc:0 "愉悦通过受苦获得"
 tenet_quiritare_name:0 "尖嚎"
 tenet_quiritare_desc:0 "抵抗心兽或试图安抚它是不可能的，所以你要完全把自己交给它，执行它的意愿。"
 tenet_legacyoftrinity_name:0 "三一传承"
 tenet_legacyoftrinity_desc:0 "法典规定了三大[clan|E]：妥芮朵，棘秘魑和梵卓的优越性。其他[clan|E]的成员需征得检察官的同意才可再造；三大主要[clan|E]的成员可以再造任何他们想要的人。只有三大主要[clan|E]的成员可以将领地遗赠给另一个吸血鬼，而在这个领地内的每个吸血鬼都有义务依法典行事。"
 tenet_legacyofashes_name:0 "灰烬传承"
 tenet_legacyofashes_desc:0 "法典规定，任何杀死三大主要[clan|E]成员的人都将面临一场血猎。"
 tenet_legacyofshadow_name:0 "影之传承"
 tenet_legacyofshadow_desc:0 "法典规定，[cainites|E]不能向非同血者透露它们的本性。这样做就等于放弃同血声称。"
 tenet_oaths_name:0 "约誓"
 tenet_oaths_desc:0 "我们的法律来自我们长者的指令，而该隐的指令凌驾于一切之上。宣誓是封建秩序的基础。"
 tenet_vampirehighclans_name:0 "上位氏族"
 tenet_vampirehighclans_desc:0 "上位[clan|E]优于下位[clan|E]。下位[clan|E]是最终会屈服于心兽的堕落者。他们不适合当统治者或体面人。"
 tenet_vampireselectivefeeding_name:0 "选择性摄食"
 tenet_vampireselectivefeeding_desc:0 "汝辈不当啜饮月之野兽，荒野子民，罹患恶疾者，精神错乱者，嗜酒如命者。"
 tenet_enkrateia_reie_sophrosyne_name:0 "自律 胆量 审慎"
 tenet_enkrateia_reie_sophrosyne_desc:0 "理智地对待亡生，此道集中于三个基本概念，被认为是布鲁赫在迦太基之夜中的潜在后嗣所追求的基本特征：自律、胆量、审慎。自律指的是内在的力量。胆量指的是道德的勇气。审慎意味着对自我的控制，代表了所有“哲学家”的理想化目标：控制住布鲁赫之怒。"
 special_doctrine_three_pillars_kindred_name:0 "三支柱"
 special_doctrine_three_pillars_kindred_desc:0 "封建社会的基础是城堡、教堂和城镇。血族社会对于此的镜像是王者之路、天国之路、人性之路之间相互包容。"
 doctrine_parameter_hostility_override_special_doctrine_three_pillars_kindred:0 "其他有三支柱教义的血族[faiths|E]都被认为是[GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V]，而不是#V 敌对#!"
 tenet_fellow_selfcontrol_opinion:0 "自控者同类"
 doctrine_parameter_selfcontrol_opinion_active:0 ""
 selfcontrol_opinion_active_opinion_name:0 "自控者同类"
 selfcontrol_opinion_active_county_opinion_name:0 "自控者同类郡县"
 doctrine_parameter_opinion_of_selfcontrol_opinion_active:0 "其他自控者的[opinion|E]：$VALUE|+=0$"
 tenet_fellow_instinct_opinion:0 "天性者同类"
