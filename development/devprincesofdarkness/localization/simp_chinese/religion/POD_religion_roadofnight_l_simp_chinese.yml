 vianoctis_desc:0 "教世者能感到该隐的诅咒和他们自己的诅咒的重量，甚至比那些遵守天国之道的人更重。同样像挪得学家，教世者寻求救赎和宽恕，而赢得它需要痛苦和净化。然而，相比于教世者相当温和的方式，教世者积极地行走在人类世界，惩罚和杀害凡人罪人。"
