 raktasadhus:0 "苦行血僧"
 raktasadhus_adj:0 "苦行血僧"
 raktasadhus_adherent:0 "苦行血僧"
 raktasadhus_adherent_plural:0 "苦行血僧"
 raktasadhus_des:0 "印度的吸血鬼掌握着一种被称为「修持」的血魔术。尽管实际上有不修持的印度该隐之子，复数词苦行血僧仍然有时被用来集体指所有的印度该隐之子，很大程度上是因为他们还没有把他们短暂效忠的网络正式形成一个实际的教派或皇庭。如果不是因为南印度的无尽天雷皇朝和东印度的猩红之龙皇朝的震旦族裔吸血鬼的反对，这些效忠甚至可能根本就不存在。"
 mayaparisatya:0 "摩耶婆梨娑底"
 mayaparisatya_adj:0 "摩耶婆梨娑底"
 mayaparisatya_adherent:0 "罗刹"
 mayaparisatya_adherent_plural:0 "罗刹"
 mayaparisatya_desc:0 "矛盾之道在很大程度上归功于印度教的某些教义。根据它，血族永远被锁在宇宙的虚幻循环（摩耶）之外。大多数存在都能进入轮回，一种不断的转世重生循环，而血族被排除在该循坏之外。每个个体都有自己的目标，或者说自性，而被排除在循环之外的吸血鬼没有。"
 viaparadox:0 "矛盾之道"
 viaparadox_adj:0 "矛盾之道"
 viaparadox_adherent:0 "欺诈者"
 viaparadox_adherent_plural:0 "欺诈者"
 viaparadox_desc:0 "欺诈者相信每个人都有一个更高的目标，包括他们自己、其他吸血鬼和凡人。他们的天命是引导每个人走向其命中更高的位置。如果需要，这包括死亡，特别是那些他们认为过于任性的血族，他们已经从他们真正的命运中堕落了。凡人在这些致命的惩罚中更安全，因为他们更直接地参与宇宙的生命之轮。"
 pathofdevaraja:0 "提婆罗阇之道"
 pathofdevaraja_adj:0 "提婆罗阇之道"
 pathofdevaraja_adherent:0 "天赐者"
 pathofdevaraja_adherent_plural:0 "天赐者"
 pathofdevaraja_desc:0 "此道的追随者不相信要有什么神权来统治。相反，他们相信他们必须自己赢得统治的权利，并在他们的人民眼中成为神。神不会创造臣民和下级，而是创造信徒和崇拜者。"
 pathofdaitya:0 "底提耶之道"
 pathofdaitya_adj:0 "底提耶之道"
 pathofdaitya_adherent:0 "弄蛇者"
 pathofdaitya_adherent_plural:0 "弄蛇者"
 pathofdaitya_desc:0 "底提耶崇拜湿婆，并宣称领导所有崇拜湿婆的吸血鬼。底提耶把他们的种姓义务看作是与凡人婆罗门教的奇异反面。作为恶魔，他们必须与神战斗，并努力推翻世界的道德秩序。然而，作为婆罗门，他们必须努力让他们的吸血鬼同胞履行自己的种姓义务，比如谋杀者、骗子、亵渎神圣仪式者以及其他所有被指派给恶魔的可憎使命。"
 tariqeltanaqud:0 "塔里克·塔那库德"
 tariqeltanaqud_adj:0 "塔里克·塔那库德"
 tariqeltanaqud_adherent:0 "卡达尔"
 tariqeltanaqud_adherent_plural:0 "穆哈迪恩"
 tariqeltanaqud_desc:0 "作为主要的印度系和堕落的西方系之间的十字路口，穆斯林拉雷伏诺横跨两个世界，但同时也被两个世界所排斥。他们是被放逐的流浪者，被阿什拉派所憎恶。"
 samsara:0 "轮回"
 samsara_adj:0 "轮回"
 samsara_adherent:0 ""
 samsara_adherent_plural:0 ""
 samsara_desc:0 "现代的矛盾之道，也称为轮回，是雷伏诺稚子的新生。它不像摩耶婆梨娑底那样僵化，但也不允许西方该道的肆意残忍和享乐主义。它的道德规范和摩耶婆梨娑底是一样的，但是原罪阶级被调整了，以允许与不遵循这条道的吸血鬼互动。"