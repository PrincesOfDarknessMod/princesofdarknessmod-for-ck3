 avarice:0 "贪婪"
 avarice_adj:0 "贪婪"
 avarice_desc:0 "贪婪之恶魔想要占有一切，控制他们所看到的一切，并拒绝别人具有。与暴食者不同，贪婪之恶魔并不想消耗他们所觊觎的东西，他们想永远保留这些东西，直到它们崩溃成无用的垃圾的很久之后。贪婪之恶魔往往是微妙而狡猾的，他们着眼于长期的收益；对于一位永生的生命来说，花上三个世纪来获得对一个国家或密教的影响并不是什么大的努力，只要你最后能完全控制它。"
 avarice_adherent:0 "贪婪之恶魔"
 avarice_adherent_plural:0 "贪婪之恶魔"
 envy:0 "嫉妒"
 envy_adj:0 "嫉妒"
 envy_desc:0 "嫉妒之恶魔试图摧毁那些拥有恶魔所缺乏的东西的人——自由、爱、希望和上帝祝福给予的安慰。这些恶魔并不希望自己拥有这些东西；他们想要的是惩罚那些敢于拥有这些东西的人，其等因为拥有这些祝福而感到自己高人一等。只有在把其他人都拖入泥潭之后，这些恶魔才能得到满足，因为他们知道现在在尘世中没有其他人比他们更幸福。"
 envy_adherent:0 "嫉妒之恶魔"
 envy_adherent_plural:0 "嫉妒之恶魔"
 gluttony:0 "暴食"
 gluttony_adj:0 "暴食"
 gluttony_desc:0 "Demons of gluttony crave sensation, to indulge every appetite and desire past the point of satiation and to keep going. Mortals usually associate gluttony with a desire for food, but truly it is simply the desire to consume, to use more resources than necessary. A demon on a gluttonous rampage chooses a particular resource — food, faith, human lives — and takes obscene joy not just in using up or destroying that thing, but flaunting the destruction and consumption to those now forced to go without."
 gluttony_adherent:0 "暴食之恶魔"
 gluttony_adherent_plural:0 "暴食之恶魔"
 lust:0 "色欲"
 lust_adj:0 "色欲"
 lust_desc:0 "Demons of lust become lost in the urges and sensations of the physical, maddened by the possibilities of physical indulgence. These demons possess followers on a regular basis, gorging themselves on pleasure and activity before relishing the sensations of the vessels’ hideous deaths. Lusty demons are often obsessed with sex, but it’s not the only form of physical pleasure they desire — they embark on orgies of eating, fighting, drinking and destruction in the time they have available in a vessel."
 lust_adherent:0 "色欲之恶魔"
 lust_adherent_plural:0 "色欲之恶魔"
 pride:0 "傲慢"
 pride_adj:0 "傲慢"
 pride_desc:0 "All demons understand the sin of pride, perhaps better than humans ever could. It was pride that was the First Sin, the sin of Lucifer and all the angels who rebelled against God rather than accept His decrees. Demons of pride still place themselves above all other entities, and demand the worship and adulation of mortal and demon alike. Lost in arrogance, a prideful demon might raze a city as punishment for a minor slight, or torture an entire society until every member agrees to love and worship it unconditionally."
 pride_adherent:0 "傲慢之恶魔"
 pride_adherent_plural:0 "傲慢之恶魔"
 sloth:0 "怠惰"
 sloth_adj:0 "怠惰"
 sloth_desc:0 "Demons of sloth are hardly lazy; that’s a misguided, mortal view of the sin. Sloth is the need for simplicity, for convenience — an ultimately sociopathic disinterest in the world. Demons of sloth are almost all demons of death, who once shepherded souls to their final rewards. Now they crave the solitude and calm of death, the serenity of an empty world. These demons are rare, because the nothingness of Hell tends to swallow them forever; those remaining are monsters who would snuff out a country to silence a crying child, who long for absolute destruction and a world of dust and gravestones."
 sloth_adherent:0 "怠惰之恶魔"
 sloth_adherent_plural:0 "怠惰之恶魔"
 wrath:0 "暴怒"
 wrath_adj:0 "暴怒"
 wrath_desc:0 "Demons of wrath are whirlwinds of carnage and destruction, monsters who rampage and kill for the sheer joy of destruction. Wrath is more than just a lust for violence, though; it is the claim of righteous anger, of inflicting punishment on those who have transgressed. Some demons of wrath see themselves as enforcers of a social order, but others don’t bother to tell themselves such lies. In any case, the demon’s obsession is with lashing out and destroying anything that frustrates, blocks or simply inconveniences it."
 wrath_adherent:0 "暴怒之恶魔"
 wrath_adherent_plural:0 "暴怒之恶魔"