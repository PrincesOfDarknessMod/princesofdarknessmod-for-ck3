l_simp_chinese:
 burning_faith_name:0 "灼热信仰"
 burning_faith_doctrine_name:0 "密特拉的战士"
 burning_faith_doctrine_desc:0 "作为不屈之阳的战士，我们必须像他一样强大。黑夜世界终将看到太阳的光芒。"
 undead_aesir_name:0 "不死阿萨"
 undead_aesir_doctrine_name:0 "重建英灵战士"
 undead_aesir_doctrine_desc:0 "卡哈尔的战士们渴望荣耀和战斗，他们理所当然地被弱小的[cainites|E]所惧怕。"
 restored_republic_name:0 "重建共和国"
 restored_republic_doctrine_name:0 "元老院重开"
 restored_republic_doctrine_desc:0 "对于一个[cainite|E]机构来说，元老院的思想出人意料地开放。但压力和血腥丝毫不亚于其他人。"
 senatorial_clans_name:0 "共和国之友"
 senatorial_clans_doctrine_name:0 "元老之氏族"
 senatorial_clans_doctrine_desc:0 "元老院还没有忘记君士坦丁堡或迦太基的米迦勒的背叛。他们腐朽的“[clan|E]”在神圣的元老院大厅里不受欢迎。"
 vengeful_carthage_name:0 "怀仇的迦太基"
 vengeful_carthage_doctrine_name:0 "无情的乌托邦"
 vengeful_carthage_doctrine_desc:0 "迦太基有数代人的错误需要纠正。最好是罗马叛徒的血。"
 broken_hope_name:0 "破碎希望"
 broken_hope_doctrine_name:0 "失落的乌托邦"
 broken_hope_doctrine_desc:0 "新迦太基只是一个没有灵魂的政治工具。真正的普罗米修斯派精神已经被这场新的失败压垮了。"
 secure_anda_name:0 "保护安答"
 secure_anda_doctrine_name:0 "治理帝国"
 secure_anda_doctrine_desc:0 "从熟练的好战者开始，安答也成为熟练的政治家，利用他们蒙古亲属的宗教宽容作为基础。"
 crimsom_curia_name:0 "绯红教廷"
 crimsom_curia_doctrine_name:0 "重建挪得教区"
 crimsom_curia_doctrine_desc:0 "该隐圣三一教会的恢复教会理事会正在处理日常事务……同时也呼吁在救主到来之前扩大教会的统治权。"
 militarized_experiments_name:0 "恐怖之坊"
 militarized_experiments_doctrine_name:0 "军事化实验"
 militarized_experiments_doctrine_desc:0 "扭曲的恐怖和令人憎恶的事物现在更经常被棘秘魑[clan|E]用作突击部队。"
 warden_network_name:0 "看守网络"
 warden_network_doctrine_name:0 "遍布眼线"
 warden_network_doctrine_desc:0 "摩洛教团比以往任何时候都更加统一，确保任何看守都能在任何地方找到帮助。"
 knights_acre_name:0 "亚柯骑士"
 knights_acre_doctrine_name:0 "天主的待拔之剑"
 knights_acre_doctrine_desc:0 "勇敢的骑士们现在完全致力于裁判所的目的，准备对地狱眷族释放神圣之怒。"
 oculi_dei_name:0 "神目"
 oculi_dei_doctrine_name:0 "监察之眼"
 oculi_dei_doctrine_desc:0 "神目已经控制了其多疑的成员，使其成为对抗邪恶的强大资产。"
 sisters_stjohn_name:0 "圣约翰修女会"
 sisters_stjohn_doctrine_name:0 "天主关照"
 sisters_stjohn_doctrine_desc:0 "修女会是裁判所的核心，是支撑它穿过蠕动的黑暗的磐石。"
 red_order_name:0 "红修会"
 red_order_doctrine_name:0 "小心的守护者"
 red_order_doctrine_desc:0 "红修会是裁判所的守秘人。他们只有在极其谨慎的情况下才会公开自己的知识。"
 von_murnau_name:0 "冯·穆尔瑙家族"
 von_murnau_doctrine_name:0 "天主的猎犬"
 von_murnau_doctrine_desc:0 "该德意志家庭全身心地投入到裁判所的功业中，并带来了相当多的资源。"
 great_awakening_name:0 "大觉醒"
 great_awakening_doctrine_name:0 "大觉醒"
 great_awakening_doctrine_desc:0 "长久以来，卡洛梅娜的被遗忘者一直在挣扎着大众揭示真相，但他们不再挣扎了。无论他们在哪里传教，人们都听从的并追随他们。"