l_simp_chinese:
 burning_faith_name:0 "灼热信仰"
 burning_faith_doctrine_name:0 "密特拉的战士"
 burning_faith_doctrine_desc:0 "作为不屈之阳的战士，我们必须像他一样强大。暗夜世界终将看到太阳的光芒。"
 undead_aesir_name:0 "不死阿萨"
 undead_aesir_doctrine_name:0 "重建英灵战士"
 undead_aesir_doctrine_desc:0 "卡哈尔的战士们渴望荣耀和战斗，他们理所当然地被弱小的该隐之子所惧怕。"
 restored_republic_name:0 "重建共和国"
 restored_republic_doctrine_name:0 "元老院重开"
 restored_republic_doctrine_desc:0 "对于一个该隐之子机构来说，元老院的思想出人意料地开放。但压力和血腥丝毫不亚于其他人。"
 senatorial_clans_name:0 "共和国之友"
 senatorial_clans_doctrine_name:0 "元老之氏族"
 senatorial_clans_doctrine_desc:0 "元老院还没有忘记君士坦丁堡或迦太基的米迦勒的背叛。他们腐朽的「氏族」在神圣的元老院大厅里不受欢迎。"
 vengeful_carthage_name:0 "怀仇的迦太基"
 vengeful_carthage_doctrine_name:0 "无情的乌托邦"
 vengeful_carthage_doctrine_desc:0 "迦太基有数代人的错误需要纠正。最好是罗马叛徒的血。"
 broken_hope_name:0 "破碎希望"
 broken_hope_doctrine_name:0 "失落的乌托邦"
 broken_hope_doctrine_desc:0 "新迦太基只是一个没有灵魂的政治工具。真正的普罗米修斯派精神已经被这场新的失败压垮了。"
 secure_anda_name:0 "保护鞍鞑"
 secure_anda_doctrine_name:0 "治理帝国"
 secure_anda_doctrine_desc:0 "从熟练的好战者开始，鞍鞑也成为熟练的政治家，利用他们蒙古亲属的宗教宽容作为基础。"
 crimsom_curia_name:0 "猩红教廷"
 crimsom_curia_doctrine_name:0 "重建挪得教区"
 crimsom_curia_doctrine_desc:0 "该隐圣三一教会的恢复教会理事会正在处理日常事务……同时也呼吁在救世主到来之前扩大教会的统治权。"
 militarized_experiments_name:0 "恐怖之坊"
 militarized_experiments_doctrine_name:0 "军事化实验"
 militarized_experiments_doctrine_desc:0 "扭曲的恐怖和令人憎恶的事物现在更经常被棘秘魑氏族用作突击部队。"
 warden_network_name:0 "看守网络"
 warden_network_doctrine_name:0 "遍布眼线"
 warden_network_doctrine_desc:0 "摩洛骑士团比以往任何时候都更加统一，确保任何区长都能在任何地方找到帮助。"
 knights_acre_name:0 "亚克骑士"
 knights_acre_doctrine_name:0 "Readied Sword of God"
 knights_acre_doctrine_desc:0 "The brave Knights are fully committed to the Inquisition purpose now, ready to unleash holy fury on the hellspawns."
 oculi_dei_name:0 "神眼"
 oculi_dei_doctrine_name:0 "监察之眼"
 oculi_dei_doctrine_desc:0 "The Oculi Dei has reined down its more paranoid members, making it an even more formidable asset against Evil."
 sisters_stjohn_name:0 "圣约翰的修女"
 sisters_stjohn_doctrine_name:0 "Godly Care"
 sisters_stjohn_doctrine_desc:0 "The Sisters are the heart of the Inquisition, the very rock that supports it through the creeping darkness."
 red_order_name:0 "红骑士团"
 red_order_doctrine_name:0 "Careful Guardians"
 red_order_doctrine_desc:0 "The Red Order is the keeper of secrets of the Inquisition. And they only release their knowledge with the utmost precaution."
 von_murnau_name:0 "冯 穆尔瑙家族"
 von_murnau_doctrine_name:0 "上帝的猎犬"
 von_murnau_doctrine_desc:0 "The German family is fully committed to the cause of Inquisition, bringing its considerable resources to bear."