 faceofthegods:0 "众佛相"
 faceofthegods_adj:0 "众佛相"
 faceofthegods_adherent:0 "佛徒"
 faceofthegods_adherent_plural:0 "佛徒"
 faceofthegods_desc:0 "可能是最极端的异端邪说，众佛相声称万鬼都是被流放的仙佛。他们和信徒建立了自己的宗教，并从祷告中提取气。"
 flameoftherisingphoenix:0 "涅凤焱"
 flameoftherisingphoenix_adj:0 "涅凤焱"
 flameoftherisingphoenix_adherent:0 "凤凰"
 flameoftherisingphoenix_adherent_plural:0 "凤凰"
 flameoftherisingphoenix_desc:0 "涅凤焱心法认为转生的意义是为了弥补一个人人生中的罪行。该心法以其成员在短时间内迅速堕落（偶尔则是失踪）而闻名。"
 deviltiger:0 "魔虎啸"
 deviltiger_adj:0 "魔虎啸"
 deviltiger_adherent:0 "魔虎"
 deviltiger_adherent_plural:0 "魔虎"
 deviltiger_desc:0 "魔虎啸相信他们是过去无能邪魔的替代者；他们惩罚罪人，通过痛苦和暴力寻求启迪。"
 songoftheshadow:0 "幽影颂"
 songoftheshadow_adj:0 "幽影颂"
 songoftheshadow_adherent:0 "颂伶"
 songoftheshadow_adherent_plural:0 "颂伶"
 songoftheshadow_desc:0 "崇阴的幽影颂，也被称为骨花，是冷酷的逻辑性的亡灵术师，他们寻求冷静的理性和强制的心法平衡。他们也通过他们的后代与凡人社会紧密联系在一起，甚至在几个世纪之后，他们也常常帮助他们的家人。"
 resplendentcrane:0 "华鹤道"
 resplendentcrane_adj:0 "华鹤道"
 resplendentcrane_adherent:0 "推事"
 resplendentcrane_adherent_plural:0 "推事"
 resplendentcrane_desc:0 "华鹤道是一个高度墨守成规的法家学派集合，致力于逆转纪元之轮，恢复美德。"
 thrashingdragon:0 "腾龙舞"
 thrashingdragon_adj:0 "腾龙舞"
 thrashingdragon_adherent:0 "舞优"
 thrashingdragon_adherent_plural:0 "舞优"
 thrashingdragon_desc:0 "经常被误解的腾龙舞心法自认是死者，但寻求通过模仿和与生者互动来达到大彻大悟。尽管有一些华鹤道的深刻质疑，但它们是完全公认的心法，即使他们在亡生以自己的方式进食和发生关系。"
 thousandwhispers:0 "千呤道"
 thousandwhispers_adj:0 "千呤道"
 thousandwhispers_adherent:0 "呤者"
 thousandwhispers_adherent_plural:0 "呤者"
 thousandwhispers_desc:0 "呤者们生活在一系列的面具中，他们在死后建立新的身份，以便理解凡人的生活并希望超越它。"
 inwardway:0 "内修众"
 inwardway_adj:0 "内修众"
 inwardway_adherent:0 "修者"
 inwardway_adherent_plural:0 "修众"
 inwardway_desc:0 "作为中庸心法的变体，内修者追求着道家心路，而非追随儒家朝廷。"
 wayofthetenthousandscreams:0 "万嚎道"
 wayofthetenthousandscreams_adj:0 "万嚎道"
 wayofthetenthousandscreams_adherent:0 "嚎徒"
 wayofthetenthousandscreams_adherent_plural:0 "嚎徒"
 wayofthetenthousandscreams_desc:0 "与五大正道相对立的心法。它的追随者鼓吹与诸阎魔的联合，并视他们的新情形为一种担任毁灭者来辅助玉皇大帝的方式。"
