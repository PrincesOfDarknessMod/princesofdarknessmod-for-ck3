 daughtersofthesun:0 "太阳之女"
 daughtersofthesun_adj:0 "太阳之女"
 daughtersofthesun_adherent:0 "女儿"
 daughtersofthesun_adherent_plural:0 "女儿"
 daughtersofthesun_desc:0 "伊斯兰教前的末卡维神秘密教，崇拜三位该隐之子“女神”。他们被麦加流放，大多被胜利的穆斯林阿什拉派逼迫躲藏。"
 eyesofmalakai:0 "玛拉基之眼"
 eyesofmalakai_adj:0 "玛拉基之眼"
 eyesofmalakai_adherent:0 "眼"
 eyesofmalakai_adherent_plural:0 "眼"
 eyesofmalakai_desc:0 "表面崇拜着神话中的末卡维双胞姐妹，这个疯狂的密教组织经常不知从哪里冒出来，走过的道路只留下疯狂和毁灭。"