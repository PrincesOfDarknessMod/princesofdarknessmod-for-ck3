 ordos_religion_desc:0 "学会是黑暗时代的神秘密教，其成员完全是从末卡维氏族的吸血鬼中招募的。学会致力于破译古代末卡维的占卜术，并释放他们疯狂中战胜心兽的潜力。他们在旧世界分裂成一个个小密教教派，每个教派都是独立的，只有通过自己的方式才能被识别出来。"
