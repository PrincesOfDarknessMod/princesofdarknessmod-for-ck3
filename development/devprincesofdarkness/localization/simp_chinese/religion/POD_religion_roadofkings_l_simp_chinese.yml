 cleopatrans:0 "伊玛的克利奥帕特拉派"
 cleopatrans_adj:0 "克利奥帕特拉派"
 cleopatrans_adherent:0 "克利奥帕特拉派"
 cleopatrans_adherent_plural:0 "克利奥帕特拉派"
 cleopatrans_desc:0 "这个密教是伊玛，神话中没有受到其氏族诅咒影响的诺斯费拉图，和埃及美丽的法老克利奥帕特拉两者故事的融合。这种迷恋让氏族变得强大，很多亲王都是克利奥帕特拉派，直到罗马帝国灭亡。从此以后，这个密教就像死了一般。"