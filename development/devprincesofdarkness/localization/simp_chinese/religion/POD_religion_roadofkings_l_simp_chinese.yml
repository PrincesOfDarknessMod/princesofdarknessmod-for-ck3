 holy_order_miles_of_mithras:0 "密特拉之慈悲"
 roadofkings_religious_head_title_name:0 "征服之楷模"
 cleopatrans:0 "伊玛的克利奥帕特拉派"
 cleopatrans_adj:0 "克利奥帕特拉派"
 cleopatrans_adherent:0 "克利奥帕特拉派"
 cleopatrans_adherent_plural:0 "克利奥帕特拉派"
 cleopatrans_desc:0 "这个密教是伊玛，神话中没有受到其[Clan|E]诅咒影响的诺斯费拉图，和埃及美丽的法老克利奥帕特拉两者故事的融合。这种迷恋让[Clan|E]变得强大，很多亲王都是克利奥帕特拉派，直到罗马帝国灭亡。从此以后，这个密教就像死了一般。"
 path_of_carnal_desire:0 "肉欲之道"
 path_of_carnal_desire_adj:0 "肉欲之道"
 path_of_carnal_desire_adherent:0 "施欲者"
 path_of_carnal_desire_adherent_plural:0 "施欲者"
 path_of_carnal_desire_desc:0 "赞助者设定的非原作官设宗教。\n\n也被称作欲望之道，此道不是关于屈服于快感，而是关于利用欲望作为控制工具。虽然它和纵欲之道一样色情，但它关于本性的部分更少，更多是通过性欲进行掌控。它是在岩石上唱歌的塞壬，而不是追求她们的找死水手。与原罪之路的追随者不同，欲者更符合王者之路的规范和传统，因此他们在上位[Clans|E]的宫廷上找到了庇护所。\n\n众所周知，施欲者与纵欲者有着宗教上的竞争，这种竞争在意大利各地的卧室和妓院里上演。"
 holy_order_order_of_whores:0 "巴比伦大淫妇骑士团"
 holy_order_order_of_dominatrices:0 "欢愉骑士团"
 holy_order_studs_of_desire:0 "色诱骑士团"
 viaofficii:0 "职务之道"
 viaofficii_adj:0 "职务之道"
 viaofficii_adherent:0 "誓者"
 viaofficii_adherent_plural:0 "誓者"
 viaofficii_desc:0 "赞助者设定的非原作官设宗教。\n\n也被称作职责之路，该心路由塞嫩·福斯沃恩——白色守望者——研发，以严厉强制血之缄默。其等采取极端手段来保持潜藏。"
 tenet_carnal_desire_name:0 "肉欲"
 tenet_carnal_desire_desc:0 "肉欲被施欲者作为一种工具来使用。工具被用得越多，使用它的人就越熟练。"
 doctrine_parameter_piety_gain_from_had_sex_with_effect:0 "信徒会因为共赴巫山而获得[piety|E]"
 doctrine_parameter_become_socialite_active:0 "解锁“成为名媛”[decision|E]"
 become_socialite_decision:0 "成为名媛"
 become_socialite_decision_desc:0 "施欲者经常从事“最古老的职业”，以此来招揽猎物并迅速赚取钱财。"
 become_socialite_decision_tooltip:0 "挂出红灯"
 become_socialite_decision_confirm:0 "挂出红灯"
 stop_being_socialite_decision:0 "停止卖淫"
 stop_being_socialite_decision_desc:0 "你现在已经在灵魂伴侣中找到了真爱，继续买春似乎已经不再值得。"
 stop_being_socialite_decision_tooltip:0 "停止卖身"
 stop_being_socialite_decision_confirm:0 "停止卖身"
 socialite_modifier:0 "名媛"
 socialite_modifier_desc:0 "娼妓"
 pod_patron_work_in_a_brothel_decision:0 "到妓院工作"
 pod_patron_work_in_a_brothel_decision_desc:0 "去妓院为客户提供服务可以快速赚取一些钱。 对于施欲者来说，这可以让他们回顾起一点他们的人性，以便他们可以抵御心兽的攻击。"