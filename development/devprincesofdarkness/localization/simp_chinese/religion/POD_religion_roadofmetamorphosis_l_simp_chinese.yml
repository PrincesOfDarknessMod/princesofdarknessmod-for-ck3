 viaapotheosis_adherent_plural:0 "化神者"
 viaapotheosist_desc:0 "信徒们努力着超越他们的生理限制，提高他们的精神和身体能力，直到他们与神没有区别。竞争性仪式包括向上位生物卑躬屈膝并向以换取血祭换取学识。在终身追求完美的过程中，变幻术是最常见的异能，尽管实践者被鼓励使用几乎所有可用的力量来实现他们理想的和自我的目标（甚至恶魔契约和啖魂）。"
