 viamutationis_adj:0 "库都术士"
 viamutationis_adherent:0 "修者"
 viamutationis_adherent_plural:0 "修众"
 viamutationis_desc:0 "变化之路的追随者对知识的利用不是为了别人，而是为了自己。那些成为修者的人，在发现自己的能力时，过着孤独、内向的生活。他们依靠于谜语和零散的信息，并通常给出相似的答案作为回报。"
 pathoftheflesh:0 "肉体之道"
 pathoftheflesh_adj:0 "库都体修"
 pathoftheflesh_adherent:0 "体修者"
 pathoftheflesh_adherent_plural:0 "体修众"
 pathoftheflesh_desc:0 "这条心路的真正目标完全是物理的。身体的转变导致在物质世界获得巨大的力量。只有当精神能帮助生理转变时，精神才被认为是重要的。"
 pathofthespirit:0 "精神之道"
 pathofthespirit_adj:0 "库都灵修"
 pathofthespirit_adherent:0 "灵修者"
 pathofthespirit_adherent_plural:0 "灵修众"
 pathofthespirit_desc:0 "这条心路的真正目标是完全的精神转变。他们视物质世界为一种幻觉和一种分散注意力的东西，充其量只是一种辅助精神成长的简单工具。"
