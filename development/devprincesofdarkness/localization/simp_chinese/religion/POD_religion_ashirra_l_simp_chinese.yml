 ashirra_religion_desc:0 "阿希拉（来自阿拉伯语的氏族一词）是信仰安拉的伊斯兰吸血鬼教派，从幽暗纪元开始就统治着阿拉伯和北非。阿什伊拉的成员相信，如果他们选择追随安拉，就会得到救赎，这是穆罕默德的承诺之一。"
