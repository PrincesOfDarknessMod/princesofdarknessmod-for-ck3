 tariqelumma:0 "塔里克·乌玛"
 tariqelumma_adj:0 "阿希拉"
 tariqelumma_adherent:0 "阿希拉"
 tariqelumma_adherent_plural:0 "阿希拉"
 tariqelumma_desc:0 "伊斯兰血族的人性之路。 它与其的西方双生子差别不大，并且双方经常交流或分析经验。"
 tariqelsama:0 "塔里克·萨马"
 tariqelsama_adj:0 "萨马"
 tariqelsama_adherent:0 "萨马"
 tariqelsama_adherent_plural:0 "萨马"
 tariqelsama_desc:0 "在凡人时是穆斯林的该隐之子可能会坚持这条道，因为他们认为安拉的世界计划包括了吸血鬼，而对他的意志保持顺从也许能帮助他们控制心兽。"
 tariqelharb:0 "塔里克·哈尔卜"
 tariqelharb_adj:0 "哈尔卜"
 tariqelharb_adherent:0 "哈尔卜"
 tariqelharb_adherent_plural:0 "哈尔卜"
 tariqelharb_desc:0 "伊斯兰血族的王者之路。由于在穆斯林世界少有梵卓，这条道不如西方的征服之道流行。然而，许多苏丹和埃米尔仍然享受着它所带来的权力的提升。"
 tariqelbedouin:0 "塔里克·贝都因"
 tariqelbedouin_adj:0 "贝都因"
 tariqelbedouin_adherent:0 "贝都因"
 tariqelbedouin_adherent_plural:0 "贝都因"
 tariqelbedouin_desc:0 "伊斯兰血族的兽性之路。其由宰亚特——塔里克·贝都因的始祖和阿希拉派哈里发的密友——创立，这使他们更注重文明生活。相对于其的西方双生子。"
 tariqealaam:0 "塔里克·阿拉姆"
 tariqealaam_adj:0 "舒哈达"
 tariqealaam_adherent:0 "舒哈达"
 tariqealaam_adherent_plural:0 "舒哈达"
 tariqealaam_desc:0 "阿希拉的舒哈达，这些殉道者把自己作为不会死的牺牲品，这样其他人就不必再受苦了。他们会心甘情愿地牺牲自己来阻止被认为是不神圣的东西造成的腐化，尤其是恶魔或其他该隐之子。"