 hunters_religion_adj:0 "猎人"
 hunters_religion_adherent:0 "猎人"
 hunters_religion_adherent_plural:0 "猎人"
 hunters_religion_desc:0 "人类还没有放弃他们的世界。这些勇敢的英雄与声称会奴役他们的可憎之物战斗。"
 shadowinquisition:0 "暗影裁判所"
 shadowinquisition_adj:0 "裁判所"
 shadowinquisition_adherent:0 "裁判官"
 shadowinquisition_adherent_plural:0 "裁判官"
 shadowinquisition_desc:0 "暗影裁判所是天主教廷在黑暗中世纪时期策划的一场秘密运动。与教宗的以异教徒为目标的宗教裁判所不同，暗影裁判所的目标是吸血鬼、狼人、法师和其他“撒旦的仆从”，目的是毁灭或拯救他们。它的存在是短暂的，但它的成功将永远改变[cainite|E]世界。"
 independenthunters:0 "独立猎人"
 independenthunters_adj:0 "独立猎人"
 independenthunters_adherent:0 "猎人"
 independenthunters_adherent_plural:0 "猎人"
 independenthunters_desc:0 "这些猎人独立于教会行政团体，以他们自己的方式与黑暗世界里的超自然恐怖进行着另类的战争。虽然他们缺少大机构里的资源，但他们也不用受到繁杂的种族或官僚规矩的制约。这些猎人中的大多数都靠他们自己发现超自然威胁，但也有一部分是厌烦了暗影裁判所的规矩，而不再听命于高层，如今按自己的方式行事。"
 shadowinquisition_religious_head_title:0 "大裁判官"
 shadowinquisition_religious_head_title_name:0 "大裁判官职务"
 shih_faith:0 "士之信念"
 shih_faith_adj:0 "士之信念"
 shih_faith_adherent:0 "士"
 shih_faith_adherent_plural:0 "士"
 shih_faith_desc:0 "几个世纪以来，士变得多种多样并在中央王国各地散布开来，他们改变了自己的哲学以使其契合他们所居住的地区。\n但这些宗教信仰并不是他们信仰的根本。所有士都明白，他们在个人层面上的一些实践与他们作为狩魔人所遵循的真理几乎没什么关系。"
 shih_faith_religious_head_title:0 "天师"
 shih_faith_religious_head_title_name:0 "天师殿"