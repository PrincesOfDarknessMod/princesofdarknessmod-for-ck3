 roadofagramainyu:0 "安哥拉·曼纽之路"
 roadofagramainyu_adj:0 "安哥拉·曼纽之路"
 roadofagramainyu_adherent:0 "腐化者"
 roadofagramainyu_adherent_plural:0 "腐化者"
 roadofagramainyu_desc:0 "认为自己——缚于安哥拉·曼纽、饥渴和永夜——是被安哥拉·曼纽诅咒的琐罗亚斯德信徒。他们必须探索这种存在的状态，一旦他们完全理解了邪恶，就能选择为善并回到阿胡拉·马兹达的恩典中。当然，并不是所有人都能成功。"
 roadofahuramazda:0 "阿胡拉·马兹达之路"
 roadofahuramazda_adj:0 "阿胡拉·马兹达之路"
 roadofahuramazda_adherent:0 "忏悔者"
 roadofahuramazda_adherent_plural:0 "忏悔者"
 roadofahuramazda_desc:0 "通向救赎的心路需经过阿胡拉·马兹达。在经历了安哥拉·曼纽的邪恶之后，他们选择成为善，回到阿胡拉·马兹达的恩典中。阿胡拉·马兹达之路的初心者广泛地用水净化自己。"
 pathofdaena:0 "达埃纳之道"
 pathofdaena_adj:0 "达埃纳之道"
 pathofdaena_adherent:0 "平信徒"
 pathofdaena_adherent_plural:0 "平信徒"
 pathofdaena_desc:0 "达埃纳之道教导说善良的行为、遵守法律和义务会带来巨大的个人力量。按照这些法律和职责行事，就会得到应有的奖励。法律为公民社会提供结构；违反法律，社会本身就会崩溃。"
 cultofzilah:0 "洗拉密教"
 cultofzilah_adj:0 "洗拉密教"
 cultofzilah_adherent:0 "密教徒"
 cultofzilah_adherent_plural:0 "密教徒"
 cultofzilah_desc:0 "一群围拥泣之主和他的门徒阿诺什的[cainites|E]。在于失落的山谷中发现一块泣石之后，这个密教就成为了二代吸血鬼洗拉的崇拜者。他们现在是三代的敌人，他们反叛了该隐和该隐的子嗣们的指令。"