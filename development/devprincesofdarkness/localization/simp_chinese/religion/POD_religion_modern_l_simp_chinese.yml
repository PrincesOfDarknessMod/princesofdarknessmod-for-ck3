 modernanarch_religion:0 "叛党"
 modernanarch_religion_adj:0 "叛党"
 modernanarch_religion_adjerent:0 "叛党"
 modernanarch_religion_adherent_plural:0 "叛党"
 modernanarch_religion_desc:0 "叛党是拒绝维持该隐之子社会现状的吸血鬼。"
 modernanarch_high_god_name:0 "自由"
 modernanarch_high_god_name_alternate:0 "自由"
 modernanarch_creator_god_name:0 "自由"
 freeanarch:0 "自由叛党"
 freeanarch_adj:0 "叛党"
 freeanarch_adherent:0 "叛党"
 freeanarch_adherent_plural:0 "叛党"
 freeanarch_desc:0 "这些该隐之子永远不会屈服于任何权威，除非是他们自己选择的权威，无论情况如何。叛党要塞通常狂野不羁，但对许多年轻的吸血鬼来说，却是希望和自由的灯塔。而对于他们的长者是必须快速解决之物。"
 camarilla_religion:0 "秘盟"
 camarilla_religion_adj:0 "秘盟"
 camarilla_religion_adjerent:0 "秘盟"
 camarilla_religion_adherent_plural:0 "秘盟"
 camarilla_religion_desc:0 "除了防止越来越多的凡人大众发现吸血鬼的存在，维持该隐之子社会的现状也是秘盟的目的；因此，它的结构和诫律在很大程度上反映了黑暗时代封建欧洲的该隐之子社会。"
 camahumanity:0 "秘盟（人性）"
 camahumanity_adj:0 "秘盟"
 camahumanity_adherent:0 "秘盟"
 camahumanity_adherent_plural:0 "秘盟"
 camahumanity_desc:0 "鼓励血族尽可能地融入凡人之中，并保留因坚持自己的人类特性而产生的礼貌和沉着。几乎所有秘盟成员都遵守人性之「道」，而其他的教化之道则被强烈地劝阻，通常只有长老遵循。"
 sabbat_religion:0 "魔宴"
 sabbat_religion_adj:0 "魔宴"
 sabbat_religion_adjerent:0 "魔宴"
 sabbat_religion_adherent_plural:0 "魔宴"
 sabbat_religion_desc:0 "魔宴是由拒绝诫律的该隐之子组成的松散组织。与秘盟不同的是，魔宴信奉上古耆宿和该隐。也被称为该隐之剑，因为他们相信一旦火焚末日到来，他们将会是他用来摧毁上古耆宿的军队。"
 pathofhonorableaccord:0 "荣耀协约之道"
 pathofhonorableaccord_adj:0 "魔宴爱国者"
 pathofhonorableaccord_adherent:0 "爱国者"
 pathofhonorableaccord_adherent_plural:0 "爱国者"
 pathofhonorableaccord_desc:0 "荣耀协约之道是一条教化之道，它通过严格的实践高尚和侠义的行为来栓住心兽。荣誉之道的该隐之子非常重视仪式和典礼。因此，魔宴的骑士们总是会参加战争聚会、祭祀、庆典和其他集体活动。整体来说，该道的追随者寻求在对一项大业的忠诚的共同旗帜下，将教派中不同的派别编织在一起。"
