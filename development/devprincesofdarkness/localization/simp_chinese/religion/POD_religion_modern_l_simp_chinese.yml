l_simp_chinese:
 modernanarch_religion:0 "叛党"
 modernanarch_religion_adj:0 "叛党"
 modernanarch_religion_adherent:0 "叛党"
 modernanarch_religion_adherent_plural:0 "叛党"
 modernanarch_religion_desc:0 "叛党是拒绝维持[cainite|E]社会现状的吸血鬼。"
 modernanarch_high_god_name:0 "自由"
 modernanarch_high_god_name_alternate:0 "自由"
 modernanarch_creator_god_name:0 "自由"
 freeanarch:0 "自由叛党"
 freeanarch_adj:0 "自由叛党"
 freeanarch_adherent:0 "自由叛党"
 freeanarch_adherent_plural:0 "自由叛党"
 freeanarch_desc:0 "这些[cainites|E]永远不会屈服于任何权威，除非是他们自己选择的权威，无论情况如何。叛党要塞通常狂野不羁，但对许多年轻的吸血鬼来说，却是希望和自由的灯塔。而对于他们的长者是必须快速解决之物。"
 camarilla_religion:0 "秘盟"
 camarilla_religion_adj:0 "秘盟"
 camarilla_religion_adherent:0 "秘盟"
 camarilla_religion_adherent_plural:0 "秘盟"
 camarilla_religion_desc:0 "除了防止越来越多的凡人大众发现吸血鬼的存在，维持[cainite|E]社会的现状也是秘盟的目的；因此，它的结构和诫律在很大程度上反映了黑暗时代封建欧洲的[cainite|E]社会。"
 camahumanity:0 "秘盟人性之道"
 camahumanity_adj:0 "秘盟人性之道"
 camahumanity_adherent:0 "秘盟"
 camahumanity_adherent_plural:0 "秘盟"
 camahumanity_desc:0 "鼓励血族尽可能地融入凡人之中，并保留因坚持自己的人类特性而产生的礼貌和沉着。几乎所有秘盟成员都遵守人性之“道”，而其他的教化心路则被强烈地劝阻，通常只有长老遵循。"
 sabbat_religion:0 "魔宴"
 sabbat_religion_adj:0 "魔宴"
 sabbat_religion_adherent:0 "魔宴"
 sabbat_religion_adherent_plural:0 "魔宴"
 sabbat_religion_desc:0 "魔宴是由拒绝诫律的[cainites|E]组成的松散组织。与秘盟不同的是，魔宴信奉[antediluvians|E]和该隐。也被称为该隐之剑，因为他们相信一旦火焚末日到来，他们将会是他用来摧毁[antediluvians|E]的军队。"
 pathofhonorableaccord:0 "荣耀协约之道"
 pathofhonorableaccord_adj:0 "魔宴荣耀协约之道"
 pathofhonorableaccord_adherent:0 "血亲"
 pathofhonorableaccord_adherent_plural:0 "血亲"
 pathofhonorableaccord_desc:0 "荣耀协约之道是一条教化心路，它通过严格的实践高尚和侠义的行为来栓住心兽。\n荣誉之道的[cainites|E]非常重视仪式和典礼。因此，魔宴的骑士们总是会参加战争聚会、祭祀、庆典和其他集体活动。整体来说，该道的追随者寻求在对一项功业的忠诚的共同旗帜下，将教派中不同的派别编织在一起。"
 pathofdeathandthesoul:0 "死亡与灵魂之道"
 pathofdeathandthesoul_adj:0 "魔宴死亡与灵魂之道"
 pathofdeathandthesoul_adherent:0 "死灵徒"
 pathofdeathandthesoul_adherent_plural:0 "死灵徒"
 pathofdeathandthesoul_desc:0 "死亡与灵魂之道是一条教化心路，通过对死亡、不死和灵魂的分别研究来抑制心兽。\n作为一条更有学术性的心路，死灵徒将吸血鬼式存在视为探索生命和死亡之谜的一种手段。他们将宇宙分为由血肉和物理构成的理性领域以及由痛苦、神秘和超自然现象构成的非理性领域。为了探索这些差异并找到他们问题的答案，吸血鬼必须探索自己的状态和灵魂的本质。"
 pathofpowerandtheinnervoice:0 "力量与心声之道"
 pathofpowerandtheinnervoice_adj:0 "魔宴力量与心声之道"
 pathofpowerandtheinnervoice_adherent:0 "统一者"
 pathofpowerandtheinnervoice_adherent_plural:0 "统一者"
 pathofpowerandtheinnervoice_desc:0 "力量与心声之道是一条教化心路，通过严格的决心和世俗力量的积累来控制心兽。\n该道的追随者相信真理就在他们自己身上，最好通过对个人启蒙的内在探索来找到，最终导向力量的积累。对自我和外部世界的控制是唯一值得追求的目标。为此，吸血鬼必须发展他的能力，扩大他的影响，并布置他的棋子。"
 pathofthebeast:0 "心兽之道"
 pathofthebeast_adj:0 "魔宴心兽之道"
 pathofthebeast_adherent:0 "心兽"
 pathofthebeast_adherent_plural:0 "心兽"
 pathofthebeast_desc:0 "心兽之道是一条寻求控制心兽的教化心路，其等视心兽的冲动为自然而然，并接受他们作为猎人中的猎人的身份。\n该道的追随者们没有组织，避开了文明的束缚，他们经常放弃科技，而选择他们的不死族形态所固有的天赋。"
 pathofmetamorphosis:0 "变化之道"
 pathofmetamorphosis_adj:0 "魔宴变化之道"
 pathofmetamorphosis_adherent:0 "变化者"
 pathofmetamorphosis_adherent_plural:0 "变化者"
 pathofmetamorphosis_desc:0 "变化之道是一条教化心路，通过研究心兽的极限和一般吸血鬼的极限来控制心兽。\n他们相信下一步是一种类似于神化的状态，他们称之为阿兹·达哈卡，取自波斯神话中的龙，而且他们会做任何事情——无论任何——来实现它。这是一种疏远、孤独的哲学，除了维持生计外，远离任何需求。"
 pathofcathari:0 "清洁之道"
 pathofcathari_adj:0 "魔宴清洁之道"
 pathofcathari_adherent:0 "阿尔比派"
 pathofcathari_adherent_plural:0 "阿尔比派"
 pathofcathari_desc:0 "清洁之道将自己塑造成中世纪清洁派的直接对应物：吸血鬼是古老的阿其翁（掌权者）灵类，是德谬哥（巨匠造物主）的狱卒，被放在这个世界上以确保人类永远不会突破它。该隐被善良的造物主诅咒具有肉体和无尽的痛苦，但在其中被置于人类之上，以评估人类并诱使他们远离灵知。为此，阿尔比派（该道追随者的正式称谓）鼓励凡人的花费和物质主义，并故意打破古代清洁派的许多禁忌。"
 pathofcaine:0 "该隐之道"
 pathofcaine_adj:0 "魔宴该隐之道"
 pathofcaine_adherent:0 "挪得学家"
 pathofcaine_adherent_plural:0 "挪得学家"
 pathofcaine_desc:0 "该隐之道是一条模仿黑暗之父以抵御心兽的教化心路。\n该隐之道的核心在于对吸血鬼本质的例证：存在之谜、吸血鬼形态的局限性以及[Embrace|E]带来的变化都促使挪得学家陷入无休止的猜测、辩论、学习和研究。学术研究和历史洞察力是有价值的，但吸血鬼必须同时在精神和身体上得到发展，以探索其不死族形态的极限。"
 pathofharmony:0 "和谐之道"
 pathofharmony_adj:0 "魔宴和谐之道"
 pathofharmony_adherent:0 "和谐者"
 pathofharmony_adherent_plural:0 "和谐者"
 pathofharmony_desc:0 "心兽之道的一个变种，其认为心兽是吸血鬼生存的必要条件。\n和谐者不相信有任何存在是非自然的。单纯的存在就意味着个人或力量有一个位置。这包括吸血鬼。是的，吸血鬼在自然秩序中的作用有些令人不快，但兔子很可能会对狐狸有同样的感觉。"
 pathofnight:0 "暗夜之道"
 pathofnight_adj:0 "魔宴暗夜之道"
 pathofnight_adherent:0 "虚无者"
 pathofnight_adherent_plural:0 "虚无者"
 pathofnight_desc:0 "暗夜之道，有时也被称为盟夜之道，是一条宣扬接受心兽和该隐的诅咒的教化心路。[cainites|E]必须利用他们的力量为吸血鬼的既定目的服务——对凡人造成破坏并激发恐惧，从而找到超脱。"
 sabbat_religious_head_title:0 "耆老"
 sabbat_religious_head_title_name:0 "耆老"
 sabbat_religious_text:0 "挪得之书"
 vasantasenadharma:0 "春军心法"
 vasantasenadharma_adj:0 "春军心法"
 vasantasenadharma_adherent:0 "春军信徒"
 vasantasenadharma_adherent_plural:0 "春军信徒"
 vasantasenadharma_desc:0 "春军和她的末卡维尊长恩玛达花了整个中世纪环游世界，宣扬反对血缚。他们拒绝血绊、传统的血族等级制度，以及所有自由意志的丧失。最终，他们通过千年圣战责难了上古耆宿的残酷暴政，在魔宴形成期间加入其中。"
 camaanarchs:0 "秘盟叛党"
 camaanarchs_adj:0 "秘盟叛党"
 camaanarchs_adherent:0 "叛党"
 camaanarchs_adherent_plural:0 "叛党"
 camaanarchs_desc:0 "大多数叛党尊重并维护[masquerade|E]和其他一些传统，即使他们不尊重实行这些传统的吸血鬼或从这些传统中获益的系统。\n根据荆棘大会的条款，叛党被视为秘盟的一个派别，与魔宴不同，他们是被容忍的。"
 pathofredemption:0 "赎罪之道"
 pathofredemption_adj:0 "魔宴赎罪之道"
 pathofredemption_adherent:0 "殉道者"
 pathofredemption_adherent_plural:0 "殉道者"
 pathofredemption_desc:0 "赎罪之道是一条教化心路，它通过为天主服务而努力获得救赎来对抗心兽。自然，这些主张在当前的受诅者社会中有些不方便，但该道的追随者往往更坚定地要获得恩典，而不是关心他人。"