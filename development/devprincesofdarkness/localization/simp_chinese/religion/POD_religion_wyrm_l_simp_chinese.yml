 wyrm_religion:0 "妖蛆"
 wyrm_religion_adj:0 "妖蛆"
 wyrm_religion_adherent:0 "妖蛆"
 wyrm_religion_adherent_plural:0 "妖蛆"
 wyrm_religion_desc:0 "在狼族的神学中，妖蛆是至高太神之一。妖蛆的目的是净化和纠正尘世，使其进一步堕入熵。他通过消除奇原的创造和织者的结构来实现这一目的。\n随着人类的出现，妖蛆逐渐受到限制，直到他被逼疯，一心想要毁灭一切。因此，妖蛆现在是毁灭、混沌、黑暗和腐败之灵，是狼族所反对的一切的本质。"
 wyrm_high_god_name:0 "妖蛆"
