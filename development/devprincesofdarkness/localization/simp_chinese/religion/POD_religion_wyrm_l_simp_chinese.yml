 blackspiraldancer:0 "黑螺旋舞者"
 blackspiraldancer_adj:0 "黑螺旋舞者"
 blackspiraldancer_adherent:0 "黑螺旋舞者"
 blackspiraldancer_adherent_plural:0 "黑螺旋舞者"
 blackspiraldancer_desc:0 "可怕的黑螺旋舞者也被称为失落部族，他们是叛向妖蛆的狼族。他们曾经被称为“白嚎”，在该部族试图靠自己打倒妖蛆后，已经被腐化到了底。"
 wyrm:0 "妖蛆"
 wyrm_adj:0 "妖蛆"
 wyrm_adherent:0 "眷族"
 wyrm_adherent_plural:0 "眷族"
 wyrm_desc:0 "在狼族的神学中，妖蛆是至高太神之一。妖蛆的目的是净化和纠正尘世，使其进一步堕入熵。他通过消除奇原的创造和织者的结构来实现这一目的。\n随着人类的出现，妖蛆逐渐受到限制，直到他被逼疯，一心想要毁灭一切。因此，妖蛆现在是毁灭、混沌、黑暗和腐败之灵，是狼族所反对的一切的本质。"
 beastofwar:0 "战争之兽"
 beastofwar_adj:0 "战争之兽"
 beastofwar_adherent:0 "战士"
 beastofwar_adherent_plural:0 "战士"
 beastofwar_desc:0 "战争之兽是三相妖蛆的三头之一。它是灾祸之妖蛆，是无端愤怒之怪，神挡杀神佛挡杀佛。无限愤怒助长了它，而毁灭本能则引导它。它的爪牙从自我毁灭的突击队，到以碾压和消灭受害者为乐的彪形蠢汉，不一而足。战争之兽通过人类行事时，可以将健康的竞争退化为残酷的冲突，最终达到不分敌我的嗜血杀戮。"
 eaterofsouls:0 "噬魂者"
 eaterofsouls_adj:0 "噬魂者"
 eaterofsouls_adherent:0 "噬魂者"
 eaterofsouls_adherent_plural:0 "噬魂者"
 eaterofsouls_desc:0 "消耗之妖蛆是三相妖蛆的三大示相之一，它试图吞噬所有的造物，以同样的方式享用物质、能量和精神。噬魂者以世界上的污秽为食，并使自己膨胀。噬魂者是对疯狂织者想控制其影响范围内一切的需要的嘲弄：它被无意识地驱使去吞噬所有的造物，不顾一切地试图摧毁固有的破碎宇宙。"
 defiler:0 "亵渎者"
 defiler_adj:0 "亵渎者"
 defiler_adherent:0 "亵渎者"
 defiler_adherent_plural:0 "亵渎者"
 defiler_desc:0 "亵渎者是归墟与腐朽的阴暗实体，是存在的所有堕落的冲动和本能的体现。 亵渎者通过引诱其猎物屈服于自己的低级本能来征服，引导受玷污者踏入鲁莽的危险。它的受害者走在一条从个人选择到自我毁灭的阴暗道路上。一些影爵断言，亵渎者的第一个受害者即是它自己。他们说它现在被对自己的自我厌恶所驱使，愚蠢地认为如果它玷污了一切，它就会重新获得控制并恢复平衡。"
 foebok:0 "大怖"
 foebok_adj:0 "大怖"
 foebok_adherent:0 "恐惧者"
 foebok_adherent_plural:0 "恐惧者"
 foebok_desc:0 "恐惧是人类所知的最强烈和最古老的情感。妖蛆在这方面也没有什么不同：意识到自己被困住了，它惊慌失措，于是就产生了这种冲动。恐惧可以促使任何生物做出最可怕的事情。三相妖蛆的所有方面似乎都在表达恐惧，没有一个恶神真正地在为它服务，因为恐惧存在于一切之中。然而，当黑螺旋舞者希望接近大怖时，他们会召唤哈卡肯——“恐惧之心”。"
 mouthofvorax_adj:0 "大饕之口"
 mouthofvorax_adherent:0 "贪婪者"
 mouthofvorax_adherent_plural:0 "贪婪者"
 mouthofvorax:0 "大饕之口"
 mahsstrac:0 "大尊"
 mahsstrac_adj:0 "大尊"
 mahsstrac_adherent:0 "傲慢者"
 mahsstrac_adherent_plural:0 "傲慢者"
 mahsstrac_desc:0 "One of the youngest and perhaps the most evolved, Mahsstrac grew out of the Wyrm's realization that it was helpless to do anything while imprisoned, and could only influence the world outside by manipulating lesser entities into doing its bidding. It cultivates a sense of authority and leadership in its targets, causing them to seek out dominance and control as a means to an end. They become brutal tyrants and dictators. Once again this particular Urge does not have need of a Maeljin servant, as it can function on its own. Spirals call upon the mighty and well known totem Incarna known as Green Dragon, 'Destroyer of Life and Crusher of Enemies'.\nIn Latin, it is referred as 'Superbia', a deadly sin of the Catholic Church."
 karnala:0 "大欲"
 karnala_adj:0 "大欲"
 karnala_adherent:0 "色欲者"
 karnala_adherent_plural:0 "色欲者"
 karnala_desc:0 "With the Great Serpent entrapped by the Weaver's web, the Serpent yearned for release, for freedom, for what it wanted more than anything else. As this yearning grew, so did Karnala. The object for that desire was lost, for Karnala was able to gain freedom, while the Wyrm was left to rot. Karnala represents the state of desiring, desiring for anything: object, emotion, person, or place. Those touched by this Urge have difficulty seeing past their own gratification. Soon they are consumed by their own desire and try not only to own what they want, but try and become that thing, thus furthering the endless desire. The Maeljin Incarna serving this Urge is Empress Aliara, the Countess of Desire.\nThe Catholic Church prescribes chastity so as to avoid the deadly sin of 'Carnal'."
 abhorra:0 "大憎"
 abhorra_adj:0 "大憎"
 abhorra_adherent:0 "妒恨者"
 abhorra_adherent_plural:0 "妒恨者"
 abhorra_desc:0 "The Wyrm has a lot to resent, and as this resentment fed in on itself, it soon gained enough energy to break free, not only becoming the root emotion of malevolence, but also innate self-loathing that turns one upon others. Touched by this Urge, mortals become repelled by a person, or a group of people, situations, or even minor things that remind them of imperfections in themselves. They become more and more aggressive, going to great lengths to provoke hostilities upon those they hate. The Duke of Hate, Lord Steel, is Maeljin to this Urge.\nDespite its warmongering in the Crusades, the Catholic Church regards wrath as deadly sin--which they call 'Ira'."
 angu:0 "大虐"
 angu_adj:0 "大虐"
 angu_adherent:0 "残酷者"
 angu_adherent_plural:0 "残酷者"
 angu_desc:0 "Far more abstract and complex than most of the other Urge Wyrms, Angu came far later than most of the others. It is believed to be derived from Abhorra. When first explaining its state of imprisonment and anguish to potential allies, it found that it could not express itself adequately enough. Instead it wished for a way to show them what it was experiencing and what it was feeling. Angu made this possible. Working on a subconscious level, it drives its victims into ignoring their empathy and understanding of other beings' pain. Those possessed by this Urge learn how to inflict all forms of abuse: mental, physical, or even emotional. The Caliph of Pain, Lady Aife, does Angu's bidding."
 baashkai:0 "大蛮"
 baashkai_adj:0 "大蛮"
 baashkai_adherent:0 "暴力者"
 baashkai_adherent_plural:0 "暴力者"
 baashkai_desc:0 "Basic, crude, and mindless are words describing this Urge. It grows from an ingrained compulsion to continue conflict long after its goal of escape was met. While he can cloud the judgment of others, he can do little in the way of forcing himself into another who consciously rejects him. However, with all the other Urges he can easily provoke and make mortals give him an entrance into their souls. Chieftain of Rage, General of the Armies of the Wyrm, and Patron of Abuse, The Hellbringer is the engine of brutality for Ba'ashkai."
 khaaloobh:0 "大痨"
 khaaloobh_adj:0 "大痨"
 khaaloobh_adherent:0 "孢子"
 khaaloobh_adherent_plural:0 "孢子"
 khaaloobh_desc:0 "Only vaguely understood, and only rumored to really exist, Khaaloobh has been denoted as the Urge of Consumption, indulgence, and decay. When the Wyrm convulsed strong enough in the webs, he distorted the immediate area around it. This signifies a breaking of the order around it. And whilst it is not broken, the web is definitely not in order. This urge even affects the Wyrm's minions, causing them to break down, whether it be mentally, emotionally, or even physically. The Dancers turn to Dark Fungus when wanting to reach this Urge and his Maeljin is known as Knight Entropy, the Wyrm's Spawn."
 pseulak:0 "大奸"
 pseulak_adj:0 "大奸"
 pseulak_adherent:0 "欺诈者"
 pseulak_adherent_plural:0 "欺诈者"
 pseulak_desc:0 "The moment the Wyrm started to deny what had happened to it, and that it would not soon be let free, this urge was brought forth, fully formed with a life all its own. While deception is a natural survival tactic, Pseulak takes this to a different level. It encourages others to lie, and do it with more and more ease, becoming either comfortable in the lies they have spun, or topping more lies to cover the lies. Soon they will find themselves believing their own falsehoods. The Fallen tribe appeals to this urge with Kirijama, the 'Hidden Foe\", and its Maeljin is Corruption's Advocate, the Chamberlain of Lies, the Honorable Maine duBois, Esquire."
 sykora:0 "大妄"
 sykora_adj:0 "大妄"
 sykora_adherent:0 "偏执者"
 sykora_adherent_plural:0 "偏执者"
 sykora_desc:0 "The Urge of paranoia was formed when the Wyrm first sensed the severing of its connection with the rest of creation, and with the world against it came its own personal distrust. Sykora lurks in the shadows of the mind, between the irreconcilable senses of how things should be and how they truly are. In this space, it builds complex and irrational mental constructs that go against rational thought, causing people to withdraw into themselves or lash out at those that do not agree with their notion of reality. Black Spirals contact this Urge using the tribal totem Whippoorwill and The Archbishop of Madness, Doge Klypse is its Maeljin."
 cultofdespair:0 "绝望邪教"
 cultofdespair_adj:0 "绝望邪教"
 cultofdespair_adherent:0 "沮丧者"
 cultofdespair_adherent_plural:0 "沮丧者"
 cultofdespair_desc:0 "A cult dedicated to the Nameless Angel of Despair, an umbrella term for a number of cults and fringe groups that have committed mass suicide in her name.\nFinally exhausted from struggling against the webs, the Wyrm lost all hope of gaining the merest freedom. This only quickened the corruption, decay, degradation, and widespread loss wrought by the other heads of the Hydra. Gree, the Urge Wyrm of Despair, eats at one's will, grinding out hope of ever bettering oneself, and making one focus on one's mistakes. The Despair eats at them, and they slowly give up on trying anything. After the full death of the Camazotz, Bat became the voice for despair, while Gree's Maeljin is The Nameless Angel of Despair."
 lethargg:0 "大惰"
 lethargg_adj:0 "大惰"
 lethargg_adherent:0 "怠惰者"
 lethargg_adherent_plural:0 "怠惰者"
 lethargg_desc:0 "Considered to be the child of Gree, this Urge came after despair. With nothing to do but wait, the Wyrm grew uncaring of what its real fate was. Like with despair, victims become at a loss what to do. Cutting themselves off from their emotions, they contemplate suicidal thoughts, with little or no regard to whom they may affect. Though some see it as the weakest link in the chain of the Urges, perhaps its greatest evil is when nobody bothers to do anything to help these souls. The Maeljin of this Urge is The Master of Stagnation, Lord of Disease, Thurifuge.\nThe Catholic Church regards Lethargg as a the deadly sin of sloth, which they call 'Acedia'."
 hrugg:0 "大沼"
 hrugg_adj:0 "大沼"
 hrugg_adherent:0 "泥烂者"
 hrugg_adherent_plural:0 "泥烂者"
 hrugg_desc:0 "The Essence of Sludge, is an elemental spirit of the Wyrm. H’rugg is the distorted counterpart to the element of earth and is composed of the solid portions of the Wyrm’s form. Its corrosive nature transforms anything it touches into more sludge. In a more diluted form, it is poisonous, causing sickness, both physical and mental. It makes victims cling to their beliefs even when presented with clear evidence that disproves them"
 hoga:0 "大霾"
 hoga_adj:0 "大霾"
 hoga_adherent:0 "咳嗽者"
 hoga_adherent_plural:0 "咳嗽者"
 hoga_desc:0 "The Essence of Smog, is an elemental spirit of the Wyrm. Hoga is the corrupted version of the element of air, composed of the gaseous parts of the Wyrm’s body. Its noxious fumes poison or corrupt creatures who breathe it. This element manifests in the physical world as poisonous exhaust fumes from cars and factories, and the foul smoke from burning toxic refuse. Limited exposure produces shortness of breath and muddled thoughts, while larger amounts cause breathing disorders like asthma and fatal lung diseases."
 furmas:0 "大辐"
 furmas_adj:0 "大辐"
 furmas_adherent:0 "癌瘤者"
 furmas_adherent_plural:0 "癌瘤者"
 furmas_desc:0 "Furmas is both the Wyrm’s perversion of fire and the spiritual manifestation of radioactivity. Composed of the Wyrm’s blood, balefire twists and warps whatever it touches. Found naturally deep within the earth. Balefire is by far the most popular element used by the Black Spiral Dancers. The day that Balefire becomes common place the Apocalypse is at hand."
 wakshaa:0 "大毒"
 wakshaa_adj:0 "大毒"
 wakshaa_adherent:0 "污毒者"
 wakshaa_adherent_plural:0 "污毒者"
 wakshaa_desc:0 "The Essence of Toxin, is an elemental spirit of the Wyrm. Wakshaa is the Wyrm's deadly parody of the element of water as well as the remains of the liquid portions of the Wyrm’s body. It physically manifests as a brightly colored deadly poison, found in many industrial chemicals and a multitude of corrupted street drugs. In large doses, it kills instantly and poisons the victim’s flesh. In smaller doses, it produces outburst of violent emotions, causing a slow wasting sickness."
 blackspiraldancer_religion:0 "黑螺旋舞者"
 blackspiraldancer_religion_adj:0 "黑螺旋舞者"
 blackspiraldancer_religion_adherent:0 "黑螺旋舞者"
 blackspiraldancer_religion_adherent_plural:0 "黑螺旋舞者"
 blackspiraldancer_religion_desc:0 "可怕的黑螺旋舞者也被称为失落部族，他们是叛向妖蛆的狼族。他们曾经被称为“白嚎”，在该部族试图靠自己打倒妖蛆后，已经被腐化到了底。"
 cluithi:0 "克卢伊德派"
 cluithi_adj:0 "克卢伊德派"
 cluithi_adherent:0 "克卢伊德派"
 cluithi_adherent_plural:0 "克卢伊德派"
 cluithi_desc:0 "在黑螺旋舞者部族内部，有一个阵营竭力保留了白嚎的遗产。克卢伊德派仍然在苏格兰最荒凉的荒野和森林中游荡，模仿他们祖先数个世纪前的样子。他们撕毁自己的衣服，自豪地在身上涂抹蓝色颜料，并展示皮克特式纹身。该阵营的统治者也有精英主义倾向，认为自己是部族的贵族。该部族的名字源自一位曾经的皮克特国统治者。许多克卢伊德派认为自己是克卢伊德——最早带领皮克特人来到喀里多尼亚的英雄——最忠实的孩子。不幸的是，他们所谓的“知识”使他们能够为他们所喜欢的任何怪异或亵渎的做法辩护。"
 princesofruin:0 "废墟亲王"
 princesofruin_adj:0 "废墟亲王"
 princesofruin_adherent:0 "废墟亲王"
 princesofruin_adherent_plural:0 "废墟亲王"
 princesofruin_desc:0 "废墟亲王坚持认为怒嚎末日之战已经结束，并且已经完成。他们宣扬自我放纵，声称世界的垂死之躯现在是他们的了，他们可以随意统治和对待。腐化者的善战勇士，他们声称放纵自己的基本本能就是对妖蛆的绝对崇拜。废墟亲王认为更传统的黑螺旋舞者是乡下人和宗教狂热者；这两种主义的拥护者之间的暴力冲突很常见。"
 seekersoftheancient:0 "寻古者"
 seekersoftheancient_adj:0 "寻古者"
 seekersoftheancient_adherent:0 "寻古者"
 seekersoftheancient_adherent_plural:0 "寻古者"
 seekersoftheancient_desc:0 "这片土地上的黑暗德鲁伊们寻求与古迹周围的大气和风水进行商议。他们并不颂扬灵，而是呼唤其元素的美德，间接地召唤它，通过自然界行事。这间接地赋予他们洞察力和力量，使他们能够发展和指导与周围景观相联系的坑堑。他们作为萨满，冒着被囚禁和精神错乱的危险，与不可想象的灵交流，直接获得洞察力。黑螺旋舞者萨满知道限制自己与这种巨大力量的接触，通常通过属于他们的中间人行事，包括约束的灵、遥远对话的道具和受迷惑的诱饵。"
 tenet_banepossession_name:0 "忌灵附身"
 tenet_banepossession_desc:0 "忌灵是为妖蛆服务的邪恶灵类。忌灵的种类很广，从弱小的、相对无害的到可怕的、能够撕裂周围现实的强大生物都有。弱小的忌灵经常被用来污染人类和动物，把他们变成堕妖。为忌灵寻找宿主被妖蛆邪教视为一项神圣的任务。"
 mouthofvorax_desc:0 "The Mouth of Vorax, a cult dedicated to the demon \"Vorax\"--the Urge-Wyrm Vorus. It is centered around ritual cannibalism.\nGrowing from a desperate attempt to bring creation back in its control, Vorus grasps at everything within its reach. It is uncaring about why it has what it gains, only that it has it. There are not any Maeljin for this urge, because of the nature of the beast. Giving up something of yourself to imbue a human with your power means you have less of something. Dancers invoke Relshab, the \"Faceless Eater\", to intercede for them with this Wyrm.\nIt is known to the Shadow Inquisition as the deadly sin--'Avaritia'."