 holy_order_order_of_estries:0 "艾斯提瑞骑士团"
 holy_order_the_pure:0 "纯洁者"
 consumptionism:0 "食用主义"
 consumptionism_adj:0 "食用主义"
 consumptionism_adherent:0 "食用主义者"
 consumptionism_adherent_plural:0 "食用主义者"
 consumptionism_desc:0 "上帝已死，被该隐所啖魂。然后该隐成了下一世代的尊长，上帝在他体内的火花也被分裂了。因此，食用主义者认为，不该杀死血族的生命……除非先啖魂了上帝在他体内的火花。"
 divisionism:0 "除外主义"
 divisionism_adj:0 "除外主义"
 divisionism_adherent:0 "除外主义者"
 divisionism_adherent_plural:0 "除外主义者"
 divisionism_desc:0 "上帝将牠的精髓分享给所有的血族，但只有足够圣洁的虔信者才配得上它。因此，除外主义者试图皈依或啖魂其他吸血鬼。"