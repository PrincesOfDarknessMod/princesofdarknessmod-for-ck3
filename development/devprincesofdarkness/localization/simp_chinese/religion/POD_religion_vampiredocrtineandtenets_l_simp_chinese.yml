 tenet_vampiremasquerade_name:0 "潜藏"
 tenet_vampiremasquerade_desc:0 "血之缄默。汝勿向非同血者见汝之性。如此将弃汝谓吾之盟也。"
 tenet_vampireprogeny_name:0 "繁育"
 tenet_vampireprogeny_desc:0 "惟得长者之许，方可再造。破此，汝与汝之后皆将死。若不得长者许而造一，汝与汝之后皆将死。"
 tenet_vampiredestruction_name:0 "毁灭"
 tenet_vampiredestruction_desc:0 "禁汝灭同类。灭之权惟汝之长。惟尔中长者乃可召血猎。"
 tenet_vampiretouchstone_name:0 "心眷"
 tenet_vampiretouchstone_desc:0 "血族可以选择一位凡人作为心眷来保持其与人性的相连。该血族获得虔诚。并将有更多心眷相关事件。"
 tenet_vampireremorse_name:0 "懊悔"
 tenet_vampireremorse_desc:0 "血族反思他们的行为，为他们的恶行感到后悔，获得虔诚。"
 tenet_vampireblushoflife_name:0 "仿生"
 tenet_vampireblushoflife_desc:0 "血族可以模仿活人生活。这可以帮助他们的潜藏和回忆何为人类并获得虔诚。"
 tenet_vampirenecromanticexperimention_name:0 "死灵法术实验"
 tenet_vampirenecromanticexperimention_desc:0 "铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切\n当吾于日升中天之刻沉眠时，吾兄弟之鲜血便于吾耳边哀号\n吾之兄弟，次生者亚伯，于吾耳畔尖叫\n铭记于心：彼辈乃已死之魂灵\n彼辈之力量非汝等所拥有\n汝辈当倾听彼辈之言词：其话语中蕴含智慧\n汝辈当塞听彼辈之歌声：其旋律内暗藏湮没\n\n死刑既产生了抑郁质共鸣，又产生了虔诚。"
 tenet_vampirenemetamorphopsisexperimention_name:0 "死灵法术实验"
 tenet_vampirenemetamorphopsisexperimention_desc:0 "死刑既产生胆汁质经验，又产生了虔诚。"
 tenet_vampireauctoritasritae_name:0 "公共仪式"
 tenet_vampireauctoritasritae_desc:0 "一套由所有魔宴成员参与的十三项仪式。"
 tenet_vampireamaranth_name:0 "不凋花"
 tenet_vampireamaranth_desc:0 "吸榨尝试"
 tenet_vampiremonomacy_name:0 "血斗"
 tenet_vampiremonomacy_desc:0 "一场光荣的决斗，最终以吸榨结束。血斗仪式用以解决所有魔宴之间的争端。"
 tenet_infernalism_name:0 "唤魔"
 tenet_infernalism_desc:0 "通过与魔鬼签订契约获得恶魔授权力量。"
 tenet_vampireinquisition_name:0 "宗教裁判所"
 tenet_vampireinquisition_desc:0 "记住：上帝的子嗣，智天使，炽天使，天使长，其之触碰将如米迦勒之焰般焚烧汝辈。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现唤魔者需追杀并将其消灭。"
 tenet_pleasure_name:0 "愉悦"
 tenet_pleasure_desc:0 "享乐者对狂喜的追求"
 tenet_cruelty_name:0 "残暴"
 tenet_cruelty_desc:0 "愉悦通过受苦获得"
 tenet_quiritare_name:0 "嚎叫"
 tenet_quiritare_desc:0 "抵抗心兽或试图安抚它是不可能的，所以你要完全把自己交给它，执行它的意愿。"
 tenet_legacyoftrinity_name:0 "三一之遗"
 tenet_legacyoftrinity_desc:0 "法典规定了三个氏族：妥瑞朵，棘秘魑和梵卓的优越性。其他氏族的成员需征得判官的同意才可发展子嗣；三个主要氏族的成员可以发展任何他们想要的人。只有三个主要氏族的成员可以将领地遗赠给另一个吸血鬼，而在这个领地内的每个吸血鬼都有义务依法典行事。"
 tenet_legacyofashes_name:0 "余烬之遗"
 tenet_legacyofashes_desc:0 "法典规定，任何血族杀死三个主要氏族的成员都将面临一场血猎。"
 tenet_legacyofshadow_name:0 "暗影之遗"
 tenet_legacyofshadow_desc:0 "法典规定，该隐之子不能向非血统者透露它们的本性。这样做就等于放弃血统声称。"
 tenet_oaths_name:0 "誓约者"
 tenet_oaths_desc:0 "我们的法律来自我们长者的指令，而该隐的指令凌驾于一切之上。宣誓是封建秩序的基础。宣誓是一位君主所能做出的最神圣的契约。一位打破誓言的领主威胁着社会所有人，因为他已退化为兽。宣誓的人有向破誓的人宣战的理由，并剥夺他们的头衔。"
 tenet_vampirehighclans_name:0 "上位氏族"
 tenet_vampirehighclans_desc:0 "上位氏族优于下位氏族。下位氏族是最终会屈服于心兽的堕落者。他们不适合当统治者或体面人。"
 tenet_vampireselectivefeeding_name:0 "选择性摄食"
 tenet_vampireselectivefeeding_desc:0 "汝辈不当啜饮月之野兽，荒野子民，罹患恶疾者，精神错乱者，嗜酒如命者。\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。\n\n疯狂族类，荒野子民，听吾一言，勿饮其血！\n汝辈当观察彼辈，彼辈之生态令其美丽，彼辈之奥秘令其迷人，彼辈之战技令其致命。\n暗夜生物中之孤独者，彼辈于大地之中与吾族为伴，彼辈于吾族仍有呼吸之时送来解渴之清水。\n如吾一般，彼辈已遭流放，如吾之后裔一般，彼辈无家可归，如吾之后裔之后裔一般，彼辈徘徊徜徉，如吾之先母与先父一般，彼辈知之过多。\n但彼辈仍保有自身之计策，事关彼辈，听吾一言，铭记于心：保持沉默！\n闭口不言\n观察，并学习"
 tenet_enkrateia_reie_sophrosyne_name:0 "自律 胆量 审慎"
 tenet_enkrateia_reie_sophrosyne_desc:0 "这条道是一种智慧的生活方式，它集中于三个基本概念，被认为是迦太基的黑夜中布鲁赫后裔潜在所追求的基本特征：自律、胆量、审慎。\n\n自律指的是内在的力量。正如人性之道所要求的那样，「哲学家」被动地接受即将到来的挫折是不够的。相反，他必须将他的理性磨砺成一把利剑，把他的意志磨砺成一块盾牌，抵御那些会使他堕落的力量。在实践中，这意味着「哲学家」通常具有很强的意志力和自控能力，或者积极追求这些品质。\n\n胆量指的是道德勇气。「哲学家」不能因为害怕疯狂或其他堕落而逃避追求启蒙或道德品质的责任。相反，他必须用理性和自律来面对困境，避开现今定义布鲁赫的浮躁特征。\n\n审慎意味着对自我的控制，代表了所有「哲学家」的理想化目标：控制住布鲁赫的愤怒。这也意味着，布鲁赫已经致力于心灵、精神和身体永恒的发展。「哲学家」通过努力改善身体和心灵的属性和能力来发展审慎，而不是专注于异能或社会特质。"
 special_doctrine_three_pillars_kindred_name:0 "三支柱"
 special_doctrine_three_pillars_kindred_desc:0 "封建社会的基础是城堡、教堂和城镇。血族社会对于此的镜像是王者之路、天国之路、人性之路之间相互包容。"
 doctrine_parameter_hostility_override_special_doctrine_three_pillars_kindred:0 "其他有三支柱教义的血族[faiths|E]都被认为是[GetHostilityLevelName( FAITH_DOCTRINE_PARAMETER.GetIntValue )|V]，而不是#V 敌对#!"
