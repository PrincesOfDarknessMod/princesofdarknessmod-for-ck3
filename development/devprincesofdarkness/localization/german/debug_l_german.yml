 test.4.desc:0 "Gesamtcharaktere: [ROOT.Var('local_copy_disease_data_global_character_amount').GetValue]\nVorzeitige (Alter < 60) Krankheitstode: [ROOT.Var('local_copy_disease_data_global_premature_death_amount').GetValue]\nChance auf vorzeitigen Krankheitstod: [ROOT.Var('disease_data_calc_premature_disease_death_percentage').GetValue]%\n\nAllgemeine Krankheiten:\nChance auf allgemeine Krankheit: [ROOT.Var('disease_data_calc_common_disease_percentage').GetValue]%\nAnsteckungschance für krank: [ROOT.Var('disease_data_calc_ill_percentage').GetValue]%\nVorzeitige Todeschance für krank: [ROOT.Var('disease_data_calc_ill_premature_death_chance').GetValue]%\nAnsteckungschance für Lungenentzündung: [ROOT.Var('disease_data_calc_pneumonic_percentage').GetValue]%\nVorzeitige Todeschance für Lungenentzündung: [ROOT.Var('disease_data_calc_pneumonic_premature_death_chance').GetValue]%\n\nSCHWERE KRANKHEITEN:\nChance für Schwere Krankheiten: [ROOT.Var('disease_data_calc_serious_disease_percentage').GetValue]%\nAnsteckungschance für gichtgeplagt: [ROOT.Var('disease_data_calc_gout_ridden_percentage').GetValue]%\nVorzeitige Todeschance für gichtgeplagt: [ROOT.Var('disease_data_calc_gout_ridden_premature_death_chance').GetValue]%\nAnsteckungschance für Aussatz: [ROOT.Var('disease_data_calc_leper_percentage').GetValue]%\nVorzeitige Todeschance für Aussatz: [ROOT.Var('disease_data_calc_leper_premature_death_chance').GetValue]%\nAnsteckungschance für Typhus: [ROOT.Var('disease_data_calc_typhus_percentage').GetValue]%\nVorzeitige Todeschance für Typhus: [ROOT.Var('disease_data_calc_typhus_premature_death_chance').GetValue]%\nAnsteckungschance für Schwindsucht: [ROOT.Var('disease_data_calc_consumption_percentage').GetValue]%\nVorzeitige Todeschance für Schwindsucht: [ROOT.Var('disease_data_calc_consumption_premature_death_chance').GetValue]%\nAnsteckungschance für Krebs: [ROOT.Var('disease_data_calc_cancer_percentage').GetValue]%\nVorzeitige Todeschance für Krebs: [ROOT.Var('disease_data_calc_cancer_premature_death_chance').GetValue]%\nAnsteckungschance für Liebesbläschen: [ROOT.Var('disease_data_calc_lovers_pox_percentage').GetValue]%\nVorzeitige Todeschance für Liebesbläschen: [ROOT.Var('disease_data_calc_lovers_pox_premature_death_chance').GetValue]%\nAnsteckungschance für Lues: [ROOT.Var('disease_data_calc_great_pox_percentage').GetValue]%\nVorzeitige Todeschance für Lues: [ROOT.Var('disease_data_calc_great_pox_premature_death_chance').GetValue]%\nAnsteckungschance für Blattern: [ROOT.Var('disease_data_calc_smallpox_percentage').GetValue]%\nVorzeitige Todeschance für Blattern: [ROOT.Var('disease_data_calc_smallpox_premature_death_chance').GetValue]%\nAnsteckungschance für Pest: [ROOT.Var('disease_data_calc_bubonic_plague_percentage').GetValue]%\nVorzeitige Todeschance für Pest: [ROOT.Var('disease_data_calc_bubonic_plague_premature_death_chance').GetValue]%\n\nhej[a_value.GetName]hey"
