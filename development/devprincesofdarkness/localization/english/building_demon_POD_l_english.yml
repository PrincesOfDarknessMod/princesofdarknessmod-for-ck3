l_english:
 building_type_bastion_01:0 "Bastion"
 building_type_bastion_01_desc:0 "#F Bastions were strongholds of the rebellious Elohim in the War of Wrath on Earth, where they gathered their strength, perfected their skills, and tutored their mortal consorts.#!"
 building_bastion_01:0 "Small Bastion"
 building_bastion_01_desc:0 "There is a small outpost here that serves as the foundation of a Bastion. There is still much work to be done."
 building_bastion_02:0 "Large Bastion"
 building_bastion_02_desc:0 "What was once a small outpost has become a respectable stronghold, where your position is now decently strong."
 building_bastion_03:0 "Gargantuan Bastion"
 building_bastion_03_desc:0 "This sprawling complex is a dense and byzantine bulwark against your enemies."
 building_bastion_04:0 "Colossal Bastion"
 building_bastion_04_desc:0 "Imposing and glorious, this bulwark of your power is a testament to your will."
 building_bastion_05:0 "Enormous Bastion"
 building_bastion_05_desc:0 "Enough to rival the gates of heaven, your Bastion could weather any mortal assault."
 building_bastion_06:0 "Monumental Bastion"
 building_bastion_06_desc:0 "From here, you could weather the Fires of Revelation."
 
 building_type_ministry_of_dragons_01:0 "Ministry of Dragons"
 building_type_ministry_of_dragons_01_desc:0 "#F The Ministry of Dragons also called the Censors, has the task of questioning and challenging authority. Said authority being God, of course.#!"
 building_ministry_of_dragons_01:0 "Minor Ministry of Dragons"
 building_ministry_of_dragons_01_desc:0 "Within here, you have a few souls dedicated to the Path of the Dragon."
 building_ministry_of_dragons_02:0 "Respectable Ministry of Dragons"
 building_ministry_of_dragons_02_desc:0 "Now mimicking the minor offices of the Fallen still yet trapped in the Abyss, they have begun to grow."
 building_ministry_of_dragons_03:0 "Major Ministry of Dragons"
 building_ministry_of_dragons_03_desc:0 "Even the mortals around you are beginning to question their purpose and divinity itself, echoing the calls of your Censors."
 building_ministry_of_dragons_04:0 "Greater Ministry of Dragons"
 building_ministry_of_dragons_04_desc:0 "Your Censors are now influential throughout the region, expanding the power they, and by extension you, draw upon."
 building_ministry_of_dragons_05:0 "Powerful Ministry of Dragons"
 building_ministry_of_dragons_05_desc:0 "Even the other Earthbound themselves hesitate under the weathering questions of your Censors now, your influence undeniable."
 building_ministry_of_dragons_06:0 "Eternal Ministry of Dragons"
 building_ministry_of_dragons_06_desc:0 "Let nothing be questioned. Let everything be permitted. All there is you, and your truth. No other belief is safe."
 
 building_type_ministry_of_eagles_01:0 "Ministry of Eagles"
 building_type_ministry_of_eagles_01_desc:0 "#F The Ministry of Eagles, also called the Watchers, has the task of gaining intelligence about potential enemies.#!"
 building_ministry_of_eagles_01:0 "Minor Ministry of Eagles"
 building_ministry_of_eagles_01_desc:0 "You now have a few spies, your first Watchers, beginning to expand your gaze."
 building_ministry_of_eagles_02:0 "Respectable Ministry of Eagles"
 building_ministry_of_eagles_02_desc:0 "Your Watchers now have throughout the district of your base of operations, reporting back to you on a regular basis."
 building_ministry_of_eagles_03:0 "Major Ministry of Eagles"
 building_ministry_of_eagles_03_desc:0 "The entire population center of this domain is now under your gaze, and few things go through here without your knowledge."
 building_ministry_of_eagles_04:0 "Greater Ministry of Eagles"
 building_ministry_of_eagles_04_desc:0 "Secrets and Gossip alike are all known to you, your Watchers' gaze now covering the rural areas, next to nothing escaping your gaze."
 building_ministry_of_eagles_05:0 "Powerful Ministry of Eagles"
 building_ministry_of_eagles_05_desc:0 "Your Watchers now know of all things in this area, and your spies are unparalleled, the envy of even the other Earthbound."
 building_ministry_of_eagles_06:0 "Eternal Ministry of Eagles"
 building_ministry_of_eagles_06_desc:0 "There will be stories of a 'Big Brother' that mortals will tell. You have ascended beyond that."
 
 building_type_ministry_of_aurochs_01:0 "Ministry of Aurochs"
 building_type_ministry_of_aurochs_01_desc:0 "#F The Ministry of Aurochs, also called the Warders, has the task of defending the Court and enforce it's laws.#!"
 building_ministry_of_aurochs_01:0 "Minor Ministry of Aurochs"
 building_ministry_of_aurochs_01_desc:0 "You now have a small team of body guards, your first Warders meant to defend you in this domain."
 building_ministry_of_aurochs_02:0 "Respectable Ministry of Aurochs"
 building_ministry_of_aurochs_02_desc:0 "A small force is here now, enough to provide a respectable security detail."
 building_ministry_of_aurochs_03:0 "Major Ministry of Aurochs"
 building_ministry_of_aurochs_03_desc:0 "The scope of your power is now enough that you have a small army of Warders at your command."
 building_ministry_of_aurochs_04:0 "Greater Ministry of Aurochs"
 building_ministry_of_aurochs_04_desc:0 "Your Warders now span your court, their influence alone dissuading violence."
 building_ministry_of_aurochs_05:0 "Powerful Ministry of Aurochs"
 building_ministry_of_aurochs_05_desc:0 "The Warders now equal a small army, of a grade matched by few, with power nigh unmatched."
 building_ministry_of_aurochs_06:0 "Eternal Ministry of Aurochs"
 building_ministry_of_aurochs_06_desc:0 "Heaven itself would need to consider the pros and cons of attacking an army like yours."
 
 building_type_ministry_of_lions_01:0 "Ministry of Lions"
 building_type_ministry_of_lions_01_desc:0 "#F The Ministry of Lions, also called the Swords, has the task of fighting against threats to the Court.#!"
 building_ministry_of_lions_01:0 "Minor Ministry of Lions"
 building_ministry_of_lions_01_desc:0 "You have contracted a few Swords, who now act as 'cleaners' for locals you want removed."
 building_ministry_of_lions_02:0 "Respectable Ministry of Lions"
 building_ministry_of_lions_02_desc:0 "A military force that can now fight a good battle, your Swords are now your trusted right hand."
 building_ministry_of_lions_03:0 "Major Ministry of Lions"
 building_ministry_of_lions_03_desc:0 "Your Warders now exert their control over an entire city, waging war within at your beck and call."
 building_ministry_of_lions_04:0 "Greater Ministry of Lions"
 building_ministry_of_lions_04_desc:0 "The first sign of your expanding reach, the other Fallen have begun to fear your trusted Swords."
 building_ministry_of_lions_05:0 "Powerful Ministry of Lions"
 building_ministry_of_lions_05_desc:0 "Mortal armies would fear to face a handful of your Swords, and your reach expands even further, the burning blade of your ambition."
 building_ministry_of_lions_06:0 "Eternal Ministry of Lions"
 building_ministry_of_lions_06_desc:0 "Heaven ought to tremble before your forces."
 
 building_type_ministry_of_dust_01:0 "Ministry of Dust"
 building_type_ministry_of_dust_01_desc:0 "#F The Ministry of Dust, also called the Ministry of Man or the Guides, has the task of safekeeping of the mortal flock as well as the advancement of the Court.#!"
 building_ministry_of_dust_01:0 "Minor Ministry of Dust"
 building_ministry_of_dust_01_desc:0 "A few guardians have been set about to your cultists, currently now an unseen force that must warn you when the need arises."
 building_ministry_of_dust_02:0 "Respectable Ministry of Dust"
 building_ministry_of_dust_02_desc:0 "Your Guides now stand ever vigilant of your cults, in the small places they reside."
 building_ministry_of_dust_03:0 "Major Ministry of Dust"
 building_ministry_of_dust_03_desc:0 "The Guides regularly act as liaisons, now an everpresent concern in the lives of your cultists and their enemies."
 building_ministry_of_dust_04:0 "Greater Ministry of Dust"
 building_ministry_of_dust_04_desc:0 "Guides now hold greater power of the local realm itself, firm wards of your sources of faith and power."
 building_ministry_of_dust_05:0 "Powerful Ministry of Dust"
 building_ministry_of_dust_05_desc:0 "The Guides are now champions of your domain, your cultists safe and protected, and their enemies dare not harm your precious stock of faith."
 building_ministry_of_dust_06:0 "Eternal Ministry of Dust"
 building_ministry_of_dust_06_desc:0 "Ashes to Ashes, Dust to Dust, all here is kept safe here, under your eternal gaze."
 
 building_type_infernal_cult_01:0 "Cult"
 building_type_infernal_cult_01_desc:0 "#F The cults of demons are always based on a single lie — that it is better to be damned for eternity in the next life than to deny yourself what you want in this one.#!"
 building_infernal_cult_01:0 "Tiny Cult"
 building_infernal_cult_01_desc:0 "Within a few holy places, the whispers of your power have begun."
 building_infernal_cult_02:0 "Small Cult"
 building_infernal_cult_02_desc:0 "A few holy men are holy no longer, your thrall now beginning to truly grow."
 building_infernal_cult_03:0 "Moderate Cult"
 building_infernal_cult_03_desc:0 "You now have an entire building secretly dedicated to your worship, a beacon of power and faith for you alone."
 building_infernal_cult_04:0 "Large Cult"
 building_infernal_cult_04_desc:0 "Everyone in the city knows the name of your head priest, and you can gorge yourself on faith, a true delight!"
 building_infernal_cult_05:0 "Massive Cult"
 building_infernal_cult_05_desc:0 "Your influence in the hearts and faith of mortals has grown to be the official doctrine of this area, with more faith than you would have ever asked for in the past."
 building_infernal_cult_06:0 "Eternal Cult"
 building_infernal_cult_06_desc:0 "Not even the cults of the Elohim of days long past equal what you have now."