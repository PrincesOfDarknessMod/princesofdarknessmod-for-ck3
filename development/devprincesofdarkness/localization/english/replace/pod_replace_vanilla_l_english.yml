 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_3:0 "[ROOT.Char.GetFullNameNoTooltip] has passed on at [ROOT.Char.MakeScope.ScriptValue('true_age')] years of age."
