 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WICKED:1 "[ROOT.Char.GetFullNamePossessiveNoTooltip] soul has finally been cast to [ROOT.Char.GetFaith.NegativeAfterLife] at [ROOT.Char.MakeScope.ScriptValue('true_age')] years of age."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WOUNDED:0 "[ROOT.Char.GetFullNameNoTooltip] has finally found peace at [ROOT.Char.MakeScope.ScriptValue('true_age')] years of age."
