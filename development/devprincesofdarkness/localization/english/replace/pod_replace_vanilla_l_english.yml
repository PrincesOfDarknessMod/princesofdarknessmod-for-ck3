l_english: 
 # Replace game_rules loca
 setting_on_generate_families_desc:0 "#R Keep this rule on 'Off' or unintended things will happen.#! Most landed historical characters with no recorded family will have a spouse and up to three children generated for them. This reduces the risk of an early game over."
 setting_off_generate_families_desc:0 "#R Keep this rule on 'Off' or unintended things will happen.#! Landed historical characters with no recorded family will NOT have a family generated for them. This increases the risk of an early game over."
 setting_on_generate_families_ai_only_desc:0 "#R Keep this rule on 'Off' or unintended things will happen.#! Most landed historical AI characters with no recorded family will have a spouse and up to three children generated for them. This increases the risk of an early game over."
 # Replace perks loca
 planned_cultivation_perk_name:0 "Worldly"
 DOMESTIC_AFFAIRS_EFFICIENCY_BONUS:0 "[domestic_affairs|E] Efficiency: #P +[EmptyScope.ScriptValue('chains_of_loyalty_percentage')|0]%#! \nUnlocks the [buy_artifact_claim_interaction|E]"
 # Replace religion_core_tenets loca
 doctrine_parameter_piety_from_feasts_active:1 "Hosting a [feast|E] or an Elysium earns [piety|E]"
 #This would collide with duke_female_polish, so english loca has used cynical_no_collide instead, but other languages have kept this key in the bottom of stress_threshold_events_1_l_XXX.yml for no reason
