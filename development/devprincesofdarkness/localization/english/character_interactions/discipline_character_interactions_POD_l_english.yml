 POD_blood_of_a_demon_interaction_option_infernalist:0 "Become an Infernalist" 
 POD_blood_of_a_demon_interaction_option_infernalist_ct:0 "Swear your allegiance to infernal beings, allowing you to benefit from the powers of Daimonion without a piety price."
