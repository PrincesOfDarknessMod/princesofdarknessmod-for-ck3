 POD_fortitude_interaction:0 "Fortitude"
 POD_fortitude_interaction_desc:0 "Manage the powers granted to you by the Fortitude [discipline|E]."
 activate_toughness_loc:0 "Activate Toughness"
 deactivate_toughness_loc:0 "Deactivate Toughness"
 activate_prowess_from_pain_loc:0 "Prowess from Pain"
 activate_toughness_ct:0 "While this is active, your character is protected by the supernatural power of Fortitude. Every time they would take damage, they have a chance to 'soak' the damage. If they succeed, they will not suffer the wound. Succeed or fail, a rouse (hunger) check will be performed to power the attempt."
 deactivate_toughness_ct:0 "Deactivate Toughness. You will no longer be protected from injury, but you will also not lose any more blood to power the discipline."
 activate_prowess_from_pain_ct:0 "Activate Prowess from Pain, drawing strength from your wounds. The more dire the wound, the greater the strength."
 fortitude_failed_soaked_damage:0 "Failed to soak damage"
 fortitude_soaked_damage:0 "Damage Soaked"
 fortitude_soaked_damage_ct:0 "Your mastery of Fortitude has protected you from being injured."
 armoured_flesh_ct:0 "Your armored flesh will prevent you from dying"
 resilient_mind_loc:0 "Resilient Mind"
 resilient_mind_ct:0 "Your Fortitude acts a buffer between your mind and insanity, purging you of derangement both natural and magical in origin."
 prowess_from_pain_valid:0 "You must be wounded to use Prowess from Pain."
 
