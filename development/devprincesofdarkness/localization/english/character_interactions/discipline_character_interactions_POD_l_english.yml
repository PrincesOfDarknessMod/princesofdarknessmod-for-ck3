 POD_sense_the_sin_interaction:0 "Sense the Sin"
 sense_the_sin_interaction_desc:0 "Delve into [recipient.GetFirstName]'s mind, pulling the worst parts of [recipient.GetHerHis] personality out and making them far, far worse than before."
 sense_the_sin.ct:0 "#R Let the fun begin!#!"
 sense_the_sin.ct.sin:0 "Delve into [recipient.GetFirstName]'s mind, pulling the worst parts of [recipient.GetHerHis] personality out and making them far, far worse than before."
 sense_the_sin.ct.virtue:0 "Delve into [recipient.GetFirstName]'s mind, twisting [recipient.GetHerHis] best qualities into mocking, overwhelming handicaps."
 sense_the_sin_interaction_option_sin:0 "Focus on #R Sins#!"
 sense_the_sin_interaction_option_virtue:0 "Focus on #G Virtues#!"
 global_not_need_sins_or_virtues:0 "Target needs to have an unexploited sin. If you have the perk Poisoned Virtue, an untainted virtue will do as well."
 POD_psychomachia_interaction:0 "Psychomachia"
 POD_psychomachia_interaction_desc:0 "Initiate a battle between [recipient.GetFirstName] and a manifestation of [recipient.GetHerHis] worst nature, previously amplified by the Sense the Sin power. Should the victim prevail, they shall master [recipient.GetHerHis] dark traits and harness them to [recipient.GetHerHis] benefit. But should they lose, the darkness shall overcome - either they will descend to ever greater depravity, or [recipient.GetHerHis] psyche shall flee to blissful [torpor|E]."
 POD_psychomachia_interaction_ct:0 "If the power succeeds,[recipient.GetName] will fight a duel against a manifestation of the sins amplified by the Sense the Sin. The more amplified sins, the stronger the manifestation will be, but the potential gain will also grow. This power can only be used once on each person."
 POD_psychomachia_interaction_morepower:0 "Empower the Manifestation"
 POD_psychomachia_interaction_lesspower:0 "Weaken the Manifestation"
 POD_psychomachia_interaction_normal:0 "Normal"
 
 POD_non_infernalists_pay:0 "The infernal powers of Daimonion take a toll on the soul. Only the servants of dark powers (those with the infernalist secret/trait) are freed from the terrible price."
 POD_infernalists_dont_pay:0 "As an infernalist, the lords of hell protect you from the price of Daimonion."
 
