 POD_wereshapeshift_interaction_desc:0 "Use your rage to shapeshift your form."
 POD_wereshapeshift_interaction_options_heading:0 "Into what form shall I shapeshift?"
 POD_wereshapeshift_interaction_homid:0 "Return to a Homid form."
 POD_wereshapeshift_interaction_crinos:0 "Shapeshift to Crinos form."
 POD_wereshapeshift_interaction_lupus:0 "Shapeshift to Lupus form."
 POD_wereshapeshift_interaction_glabro:0 "Shapeshift to Glabro form."
 POD_wereshapeshift_interaction_hispo:0 "Shapeshift to Hispo form."
 
 POD_wereshapeshift_diseae_heal.0001.desc:0 "I Have Recovered From My Illness"
 
