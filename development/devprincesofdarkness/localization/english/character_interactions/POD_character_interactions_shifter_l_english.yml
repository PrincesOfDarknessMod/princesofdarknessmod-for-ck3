 POD_inspiration_interaction:0 "Inspiration"
 POD_inspiration_interaction_desc:0 "As the Alpha of this pack, it is your duty to show your strength in order to inspire your followers."
 inspiration_modifier:0 "Inspiration"
 inspiration_modifier_desc:0 "With your Alpha near, your battle prowess has been enhanced." 
 pack_tactics_modifier:0 "Pack Tactics"
 pack_tactics_modifier_desc:0 "To the outsider eye, your pack moves as one."
 strength_will_modifier:0 "Strength of Will"
 strength_will_modifier_desc:0 "An unstoppable force, a pack united to a single purpose : the destruction of their enemies."

 POD_divide_interaction:0 "Divide"
 POD_divide_interaction_desc:0 "You will sow the seed of discord in this realm, leaving the vassals discontent with their liege."
 divide_modifier:0 "Divide"
 divide_modifier_desc:0 "Everything you do or say seems to be misinterpreted by your vassals. As if a malign force twisted your words somehow..."
    
 POD_primal_song_interaction:0 "Primal Song"
 POD_primal_song_interaction_desc:0 "You will choose between one of the songs you know, gaining various bonus depending on your choice."
 POD_werewolves_interactions.1.t:0 "Primal Songs"
 POD_werewolves_interactions.1.desc:0 "Galliard Werewolves are the voice of the People, calling them to battle and inspiring them to greatness in life and in death. They are also keepers of traditions, carrying the lore of tribes all the way back to the beginning.\nAs the storytellers around the campfire, Galliard pass down stories and songs told since the beginning of time. Which one will it be today?"
 POD_werewolves_interactions.1.option.a:0 "A song of tribal unity."
 primal_song_modifier:0 "Song of Unity"
 primal_song_modifier_desc:0 "Like the heroes of old, we must stand together!"
 POD_werewolves_interactions.1.option.b:0 "A retelling of ancient victories."
 song_heroes_modifier:0 "Song of Heroes"
 song_heroes_modifier_desc:0 "There is wisdom to be find in the victories, and even the defeats, of our ancestors."
 POD_werewolves_interactions.1.option.c:0 "A tale of blood and battle."
 song_rage_modifier:0 "Song of Rage"
 song_rage_modifier_desc:0 "First and foremost, we are warriors and must always remember our fighting spirit."
 POD_werewolves_interactions.1.option.d:0 "A tale of unity and courage."
 song_siren_modifier:0 "Song of the Siren"
 song_siren_modifier_desc:0 "By following the call, we grow stronger."
 
 POD_wereshapeshift:0 "Shapeshift"
