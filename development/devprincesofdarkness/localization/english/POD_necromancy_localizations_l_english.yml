 #Necromancy Paths
 cappadociannecromancyadvanced_perk_name:0 "Advanced Cappadocian Necromancy"
 giovanninecromancyadvanced_perk_name:0 "Advanced Giovanni Necromancy"
 harbingernecromancyadvanced_perk_name:0 "Advanced Harbinger Necromancy"
 lamianecromancyadvanced_perk_name:0 "Advanced Lamia Necromancy"
 impundulunecromancyadvanced_perk_name:0 "Advanced Impundulu Necromancy"
 nagarajanecromancyadvanced_perk_name:0 "Advanced Nagaraja Necromancy"

 needs_cappadocian_necromancy_path_training:0 "@warning_icon!#X You need to receive training in Cappadocian Necromancy paths to take this perk.#!"
 needs_giovanni_necromancy_path_training:0 "@warning_icon!#X You need to receive training in Giovanni Necromancy paths to take this perk.#!"
 needs_harbinger_necromancy_path_training:0 "@warning_icon!#X You need to receive training in Harbinger Necromancy paths to take this perk.#!"
 needs_lamia_necromancy_path_training:0 "@warning_icon!#X You need to receive training in Lamian Necromancy paths to take this perk.#!"
 needs_impundulu_necromancy_path_training:0 "@warning_icon!#X You need to receive training in Impundulu Necromancy paths to take this perk.#!"
 needs_nagaraja_necromancy_path_training:0 "@warning_icon!#X You need to receive training in Nagaraja Necromancy paths to take this perk.#!"


 #Sepulchre Path
 insight_perk_name:0 "Peering across the Shroud"
 summon_soul_perk_name:0 "Summon Soul"
 compel_soul_perk_name:0 "Compel Soul"
 haunting_perk_name:0 "Haunting"
 torment_perk_name:0 "Torment"

 insight_perk_effect:0 "If any of your relatives or friends are murdered in mysterious circumstances, you will know their murderers identity."
 insight_perk_flavor:0 "#weak The dead walk among us unseen and unheard. To command them, a necromancer must be able to perceive them.#!"
 summon_soul_perk_effect:0 "As a [character_interaction|E], you can mark a character's soul so they return as a [GetTrait('wraith').GetName( GetPlayer )] when they die."
 summon_soul_perk_flavor:0 "#weak Summon Soul allows a necromancer to summon a ghost back from the Underworld .#!"
 compel_soul_perk_effect:0 "You can bind Wraiths to your will as a [character_interaction|E]."
 compel_soul_perk_flavor:0 "#weak Using this power, a vampire can bend a ghost to her will for a short time. This ability requires supreme confidence, as a failure of resolve can lead to disastrous consequences for a necromancer.#!"
 haunting_perk_effect:0 "Makes it easier to bind a [GetTrait('wraith').GetName( GetPlayer )] via the Bind Wraith [character_interaction|E]."
 haunting_perk_flavor:0 "#weak A necromancer uses the power of her blood to bind a ghost into an object or location.#!"
 torment_perk_effect:0 "Unlocks a [single_combat_duel|E] move usable if your opponent is a [GetTrait('wraith').GetName( GetPlayer )]."
 torment_perk_flavor:0 "#weak With use of Torment, a necromancer may strike at a ghost’s incorporeal body as if he himself were a ghost."

 #Bone Path
 seal_of_abamixtra_perk_name:0 "Seal of Abamixtra"
 awaken_the_homoncular_servant_perk_name:0 "Awaken the Homoncular Servant"
 shambling_hordes_perk_name:0 "Shambling Hordes"
 soul_stealing_perk_name:0 "Baleful Exorcism"
 necromancy_possession_perk_name:0 "Daemonic Possession"

 seal_of_abamixtra_perk_flavor:0 "#weak By invoking the Seal of Abamixtra, a necromancer can raise a corpse or group of corpses to perform a simple task.#!"
 awaken_the_homoncular_servant_perk_flavor:0 "#weak With this power, a necromancer can take a small piece of a corpse and transform it into a grotesque sort of familiar.#!"
 shambling_hordes_perk_flavor:0 "#weak With the use of this power, a necromancer can create a group of walking dead minions to attack her enemies.#!"
 soul_stealing_perk_effect:0 "Unlock $EXECUTION_CONVERT_TO_WRAITH$ [executions|E]."
 soul_stealing_perk_flavor:0 "#weak With but a word and a forceful gesture, a necromancer can exorcise a mortal’s soul from his own body."
 necromancy_possession_perk_effect:0 "Targets whose souls are marked for return or executed via $EXECUTION_CONVERT_TO_WRAITH$ [executions|E] will now start as a [GetTrait('risen').GetName( GetPlayer )] instead of only a lost soul."
 necromancy_possession_perk_flavor:0 "#weak Daemonic Possession allows a necromancer to channel a soul into a freshly-dead body.#!"

 #Ash Path
 shroudsight_perk_name:0 "Shroudsight"
 lifeless_tongues_perk_name:"Tongue of the Dark Kingdoms"
 touch_the_nether_perk_name:0 "Touch the Nether"
 ex_nihilo_perk_name:"Ex Nihilo"
 shroud_mastery_perk_name:"Shroud Mastery"

 shroudsight_perk_effect:0 "Unlocks the Find Wraith [character_interaction|E]"
 shroudsight_perk_flavor:0 "#weak Shroudsight allows a vampire to gaze directly into the Underworld.#!"
 lifeless_tongues_perk_effect:0 "As a [character_interaction|E], you can command a [GetTrait('wraith').GetName( GetPlayer )] to act against other characters."
 lifeless_tongues_perk_flavor:0 "#weak When uttering the Tongue of the Dark Kingdoms, a necromancer can converse with ghosts in the Underworld.#!"
 touch_the_nether_perk_effect:0 "Allows you to interact with beings of Umbra when you are in the material world."
 touch_the_nether_perk_flavor:0 "#weak While invoking Touch the Nether, a necromancer may stand on both sides of the Shroud; she manifests physically in the Underworld while remaining corporeal in the lands of the living.#!"
 ex_nihilo_perk_effect:0 "Gain acess to the Underworld during spiritual travels."
 ex_nihilo_perk_flavor:0 "#weak Ex Nihilo allows a necromancer to physically enter the Underworld. While in the Underworld, she appears as a particularly solid ghost.#!"
 shroud_mastery_perk_effect:0 "Unlock Manipulate the Shroud option in umbra panel."
 shroud_mastery_perk_flavor:0 "#weak With this power, the necromancer can greatly aid or hinder the ability of ghosts to function in the living world.#!"

 #Grave's Decay Path
 necromancy_ashes_to_ashes_perk_name:0 "Ashes to Ashes"
 rigor_mortis_perk_name:0 "Rigor Mortis"
 ashen_ladys_embrace_perk_name:0 "Ashen Lady's Embrace"
 gift_of_melancholia_perk_name:0 "Gift of Melancholia"
 dust_to_dust_perk_name:0 "Dust to Dust"

 necromancy_ashes_to_ashes_perk_effect:0 "Reduces the risk of Masquarade exposure and improves the Cover Masquerade [character_interaction|E]."
 necromancy_ashes_to_ashes_perk_flavor:0 "#weak While some Cainites slaughter indiscriminately and fear no consequences for their actions, other Cainites feel the need to be a bit more discreet. Use of this power turns a human corpse into a pile of unremarkable ash roughly one-fifth the weight of the original body.#!"
 rigor_mortis_perk_flavor:0 "#weak With this power, the necromancer can make any target as stiff and still as a corpse.#!"
 ashen_ladys_embrace_perk_effect:0 "Unlocks Ashen Lady's Embrace duel move"
 ashen_ladys_embrace_perk_flavor:0 "#weak The Ashen Lady’s Embrace causes a target’s limb to age, dry out, and wither like grapes left on the vine.#!"
 gift_of_melancholia_perk_effect:0 "Unlocks the ability to spread disease in enemy realms as a [character_interaction|E]"
 gift_of_melancholia_perk_flavor:0 "#weak This power inflicts a virulent wasting illness on mortals and Cainites alike.#!"
 dust_to_dust_perk_effect:0 "Upgrades Ashen Lady's Embrace to Dust to Dust"
 dust_to_dust_perk_flavor:0 "#weak As Ashes to Ashes affects corpses, so Dust to Dust affects the bodies of vampires. Invoking Dust to Dust allows a necromancer to reduce another vampire into a pile of ashes as though he had been stranded in the sunlight or burned at the stake.#!"

 #Corpse in the Monster Path
 mortuus_in_vultus_perk_name:0 "Mortuus in Vultus"
 algor_mortis_perk_name:0 "Algor Mortis"
 intimations_of_mortality_perk_name:0 "Intimations of Mortality"
 benedictio_mortem_perk_name:0 "Benedictio Mortem"
 benedictio_vitae_perk_name:0 "Benedictio Vitae"

 mortuus_in_vultus_perk_flavor:0 "#weak A Cainite can make herself appear as if she was a long-dead corpse.#!"
 algor_mortis_perk_flavor:0 "#weak With the use of Algor Mortis, a vampire is able to transform herself into a cool, melancholy creature, unmoved by mortal pain or emotional manipulation.#!"
 intimations_of_mortality_perk_effect:0 "As a [character_interaction|E] you can increase a vampires susceptability to stress while also preventing them from using Blood Surge to boost their stats."
 intimations_of_mortality_perk_flavor:0 "#weak Intimations of Mortality inflicts the more unpleasant and irritating aspects of mortality upon a vampire.#!"
 benedictio_mortem_perk_flavor:0 "#weak With this power, a necromancer fully assumes the aspect of a corpse and is able to slough off the weaknesses of his vampiric condition.#!"
 benedictio_vitae_perk_flavor:0 "#weak With Benedictio Vitae, a Cainite is able to enjoy many of the best aspects of mortal life without forsaking the power of her vampiric nature.#!"

 #Path of Skulls
 calvaria_emissius_perk_name:0 "Calvaria Emissus"
 consilium_mortuus_perk_name:0 "Consilium Mortuus"
 ammorsus_vicarius_perk_name:0 "Ammorsus Vicarius"
 exedo_animus_perk_name:0 "Exedo Animus"
 degulo_perk_name:0 "Degulo"

 calvaria_emissius_perk_flavor:0 "#weak One of Clan Cappadocian’s most prized secrets is the ability to spy via the eye-sockets of the dead.#!"
 consilium_mortuus_perk_effect:0 "TODO"
 consilium_mortuus_perk_flavor:0 "#weak By conversing with the decapitated head of the departed target, it transpires that prying a guaranteed truth from decayed lips is quite possible.#!"
 ammorsus_vicarius_perk_flavor:0 "#weak Using this power, the necromancer can grip the mandible and maxillae of the skull to use as a bizarre close-quarters weapon, affix the skull to a spear-point to attack from distance, or even leave the skull alone, to act as a trap.#!"
 exedo_animus_perk_effect:0 "TODO"
 exedo_animus_perk_flavor:0 "#weak By bearing a skull — either from a mortal or Cainite — the necromancer forms a sympathetic bond with the skull’s former owner.#!"
 degulo_perk_effect:0 "TODO"
 degulo_perk_flavor:0 "#weak Degulo is the method by which a necromancer consumes a fragment of soul and retains it forever as a part of himself#!"

 #Path of the Twilight Garden
 whispers_of_the_soul_perk_name:0 "Whispers of the Soul"
 kiss_of_the_dark_mother_perk_name:0 "Kiss of the Dark Mother"
 dark_humours_perk_name:0 "Dark Humours"
 caul_of_the_neverborn_perk_name:0 "Caul of the Neverborn"
 lament_of_dhainu_perk_name:0 "Lament of D'hainu"

 whispers_of_the_soul_perk_flavor:0 "#weak Merely hearing a whisper of the true name of the Dark Mother is enough to drive mortals mad, and fill the hearts of the Cainites with terror#!"
 kiss_of_the_dark_mother_perk_effect:0 "TODO Duel move upgrade"
 kiss_of_the_dark_mother_perk_flavor:0 "#weak The Lilin bites her tongue and fills her mouth with a foul, acrid mix of black bile and vitae. Her bite becomes even more terrible, and she can devour the life from her victims with ease#!"
 dark_humours_perk_flavor:0 "#weak The Lamiae are known for their athleticism and mastery of their bodies. Not only are they able to perform feats of incredible physical prowess, but they can also manipulate the balance of humors in their body by sheer force of will.#!"
 caul_of_the_neverborn_perk_effect:0 "Unlocks the Find Wraith [character_interaction|E]"
 caul_of_the_neverborn_perk_flavor:0 "#weak With the use of this power, the Lamia strengthens her connection to the black heart of the Dark Mother. Giving her both increased resilience and the ability to see into the Shadowlands.#!"
 lament_of_dhainu_perk_flavor:0 "#weak The Lamia howls in agony, and the very earth trembles. A miasma of writhing darkness rises from the ground and ensnares her enemies. Those caught by the darkness are not physically bound, but are immediately stricken with emotional anguish so rich and raw that they seek to end their lives in the most expedient way possible.#!"

 #Nightshade Path
 tend_the_body_garden_perk_name:0 "Tend the Body Garden"
 witchs_fruit_perk_name:0 "Witch's Fruit"
 raise_the_green_one_perk_name:0 "Raise the Green One"
 wails_and_whispers_perk_name:0 "Wails and Whispers"
 cthonic_womb_perk_name:0 "Cthonic Womb"

 tend_the_body_garden_perk_effect:0 "Reduces the risk of Masquarade exposure and improves the Cover Masquerade [character_interaction|E]"
 tend_the_body_garden_perk_flavor:0 "#weak A necromancer with this power can speed up or slow the process of decay, turning a dead mortal into a bloated host for flies in seconds or nullifying the decay of Final Death.#!"
 witchs_fruit_perk_effect:0 "Unlocks a [character_interaction|E] that allows you to poison mortals with necromantically infused fruit."
 witchs_fruit_perk_flavor:0 "#weak Every plant relies on death to grow. Rotting things enrich the soil, and the trees, vines, and grasses drink up necrotic echoes along with vital nutrients. A necromancer can awaken this death aura by exposing their fruits to her blood.#!"
 raise_the_green_one_perk_effect:0 "Unlocks the ability to raise a Green One as a [character_interaction|E]."
 raise_the_green_one_perk_flavor:0 "#weak Nightshade necromancers can raise a corpse bound and strengthened by plant matter. Leaves cover its skin and strong vines supplement its rotted sinews. The living shell grants speed and self-preservation instincts not seen in other animated dead.#!"
 wails_and_whispers_perk_effect:0 "Unlocks the ability to make a target vulnerable to murder schemes as a [character_interaction|E]"
 wails_and_whispers_perk_flavor:0 "#weak As the necromancer’s understanding deepens, she explores the wavering barrier between life and death. When she screams like a banshee, she can lure a soul to its demise, increasing the chance of a fatal injury.#!"
 cthonic_womb_perk_effect:0 "Draining a mortal as part of feeding will raise them as a [GetTrait('wraith').GetName( GetPlayer )]"
 cthonic_womb_perk_flavor:0 "#weak At the apex of this Path, a necromancer combines murder and fertility to give birth to the ghost of a mortal she has slain.#!"

 #Vitreous Path
 eyes_of_the_wraith_perk_name:0 "Eyes of the Wraith"
 aura_of_decay_perk_name:0 "Aura of Decay"
 soul_feasting_perk_name:0 "Pischacha’s Feast"
 curse_of_the_maelstrom_perk_name:0 "Curse of the Maelstrom"
 nightcry_perk_name:0 "Nightcry"

 eyes_of_the_wraith_perk_flavor:0 "#weak By invoking this power, the necromancer can see the world the way that the Restless Dead do.#!"
 aura_of_decay_perk_flavor:0 "#weak This power hastens the inevitable fate of any inanimate object caught within the necromancer’s dreadful aura, allowing the vampire to cause any object to decay into a ruined heap.#!"
 soul_feasting_perk_effect:0 "Enables the Soul Feasting [character_interaction|E] which allows you to drain a bound [GetTrait('wraith').GetName( GetPlayer )] to sate your hunger."
 soul_feasting_perk_flavor:0 "#weak Pischacha’s Feast allows a vampire to subsist on the ambient energies of entropy that permeate the haunted places of the world, or feed directly on the corpus of a ghost.#!"
 curse_of_the_maelstrom_perk_effect:0 "Enables the Curse of the Maelstrom [character_interaction|E] which allows you to apply a debuff to the capital of another character."
 curse_of_the_maelstrom_perk_flavor:0 "#weak The necromancer can curse her surroundings summoning Spectres to cause mayhem and destruction.#!"
 nightcry_perk_flavor:0 "#weak With use of Night Cry, a necromancer is able to display her mastery of the forces of entropy. She may either direct it away from her allies to aid them, or she may channel it directly into her foes and hinder them#!"

 #Haunting Path
 song_of_the_dead_perk_name:0 "Song of the Dead"
 summon_wisp_perk_name:0 "Summon Wisp"
 harrowing_perk_name:0 "Harrowing"
 phantasms_perk_name:0 "Phantasms"
 spectral_menacing_perk_name:0 "Spectral Menacing"

 song_of_the_dead_perk_effect:0 "Unlocks the ability to cause stress to an enemy as a [character_interaction|E]"
 song_of_the_dead_perk_flavor:0 "#weak The vampire chants, weaving unheard words into the song and instilling an unhealthy fascination with death in his listener.#!"
 summon_wisp_perk_flavor:0 "#weak The vampire infuses droplets of his blood with the ephemeral energy of the Underworld, summoning a sphere of flickering lights. The wisp may lure unsuspecting mortals into a trap or provide a clever distraction.#!"
 harrowing_perk_effect:0 "Improves the Song of the Dead [character_interaction|E]"
 harrowing_perk_flavor:0 "#weak Harrowing extends the terror inflicted by Song of the Dead by haunting her in her sleep, turning her dreams to nightmarish visions of her own death#!"
 phantasms_perk_flavor:0 "#weak The vampire sculpts the energy of the Underworld into elaborate hallucinations that terrorize the living. #!"
 spectral_menacing_perk_effect:0 "TODO"
 spectral_menacing_perk_flavor:0 "#weak The vampire rends the shroud between life and the Underworld around his victim, calling malicious ghosts to haunt her.#!"

 #Cenotaph Path
 touch_of_death_perk_name:0 "Touch of Death"
 reveal_the_catene_perk_name:0 "Reveal the Catene"
 tread_upon_the_grave_perk_name:0 "Tread Upon The Grave"
 death_knell_perk_name:0 "Death Knell"
 ephemeral_binding_perk_name:0 "Ephemeral Binding"

 touch_of_death_perk_effect:0 "TODO"
 touch_of_death_perk_flavor:0 "#weak The necromancer is attuned to the residual energy left by a ghost’s passage or touch, allowing her to determine if an object, person, or area had been touched or influenced by a ghost.#!"
 reveal_the_catene_perk_effect:0 "TODO"
 reveal_the_catene_perk_flavor:0 "#weak The necromancer recognizes the ashen mark left on objects by the dead, allowing her to distinguish between ghostly playthings and fetters.#!"
 tread_upon_the_grave_perk_effect:0 "TODO"
 tread_upon_the_grave_perk_flavor:0 "#weak The necromancer feels when she is close to the world of the dead. One necromancer might use her natural perception, whilst another might scry, but both can sense where the Underworld touches the living world.#!"
 death_knell_perk_effect:0 "TODO"
 death_knell_perk_flavor:0 "#weak The necromancer feels when she is close to the world of the dead. A necromancer might use her natural perception, whilst another might scry, but both can sense where the Underworld touches the living world.#!"
 ephemeral_binding_perk_effect:0 "TODO"
 ephemeral_binding_perk_flavor:0 "#weak By infusing an object, person, or place with her own ashen energy, the necromancer can create an artificial fetter rather than have to rely on finding one by chance.#!"

 #Misc Necromancy Localization
 POD_unfinished_content:0 "#R Unfinished content#!"

 full_giovanni_necromancy_tooltip:0 "You gain the full Giovanni Necromancy tree."
 full_cappadocian_necromancy_tooltip:0 "You gain the full Cappadocian Necromancy tree."
 full_harbinger_necromancy_tooltip:0 "You gain the full Harbinger Necromancy tree."
 full_lamia_necromancy_tooltip:0 "You gain the full Lamia Necromancy tree."
 full_nagaraja_necromancy_tooltip:0 "You gain the full Nagaraja Necromancy tree."
 full_impundulu_necromancy_tooltip:0 "You gain the full Impundulu Necromancy tree."

 POD_masquerade_risk_decrease_necromancy_ashes_to_ashes_tt:0 "My Necromancy [discipline|E] of Ashes to Ashes decreases my risk of Masquerade exposure."
 POD_masquerade_risk_decrease_necromancy_tend_the_body_garden_tt:0 "My Necromancy [discipline|E] of Tend the Body Garden decreases my risk of Masquerade exposure."

 POD_find_wraith_interaction:0 "Find Wraith"
 POD_find_wraith_interaction_desc:0 "Search your territory for a [GetTrait('wraith').GetName( GetPlayer )] vulnerable to your actions."
 POD_find_wraith.100.t:0 "Something strange in the neighborhood"
 POD_find_wraith.100.desc:0 "Searching the area, you find a lone spirit that would be vulnerable to your machinations."
 POD_find_wraith.100.option.a:0 "Now what shall I do with you?"

 POD_curse_of_the_maelstrom_interaction:0 "Curse of the Maelstrom"
 POD_curse_of_the_maelstrom_interaction_desc:0 "Summon Spectres to bring mayhem and destruction upon the enemy capital"
 POD_curse_of_the_maelstrom_interaction.tt:0 "Summon Spectres to bring mayhem and destruction upon the enemy capital reducing building speed, tax income and control"
 POD_curse_of_the_maelstrom.100.t:0 "Curse of the Maelstrom"
 POD_curse_of_the_maelstrom.100.desc:0 "With but a deep inhalation and a forceful exhale you can summon forth Spectres, terrible ghosts that worship Oblivion, upon thy foe and while to a mundane observer there will be no evidence that anything has happened, even infants in their cradle will sense that something terrible is coming."
 POD_curse_of_the_maelstrom.100.option.a:0 "Let fly the servants of Oblivion!"
 POD_curse_of_the_maelstrom.100.option.a.tt:0 "You call down Spectres upon [target.GetFirstName]'s capital county"
 POD_curse_of_the_maelstrom.100.option.b:0 "The time is not yet right"
 POD_curse_of_the_maelstrom.100.option.b.tt:0 "You abandon your plans to curse their realm. For now..."
 POD_capital_county_maelstrom_cursed_toast:0 "[attacker.GetFirstName] has summoned Spectres to wreak havok in your capital!"
 POD_maelstrom_cursed_enemy_realm_toast:0 "Spectres are running rampant through [target.GetFirstName]'s capital"

 POD_wails_and_whispers_interaction:0 "Wails and Whispers"
 POD_wails_and_whispers_interaction_desc:0 "Reduce the targets resistance to murder schemes"
 POD_wails_and_whispers_interaction.tt:0 "Using your powers of necromancy you can make the target more vulnerable to murder schemes for 5 years"
 POD_wails_and_whispers.100.t:0 "Wails and Whispers"
 POD_wails_and_whispers.100.desc:0 "As the necromancer’s understanding deepens, she explores the wavering barrier between life and death. When she screams like a banshee, she can lure a soul to its demise, increasing the chance of a fatal injury"
 POD_wails_and_whispers.100.option.a:0 "Let me whisper in your ear"
 POD_wails_and_whispers.100.option.b:0 "Maybe I should reconsider"
 POD_wails_and_whispers.100.option.b.tt:0 "The time is not right. But it may be soon..."
 POD_wails_and_whispers_actor_toast:0 "Success!"
 POD_wails_and_whispers_actor_toast.desc:0 "[recipient.GetFirstName] is more vulnerable to hostile schemes"
 POD_wails_and_whispers_enemy_toast:0 "Despair!"
 POD_wails_and_whispers_enemy_toast.desc:0 "[actor.GetFirstName] has cursed you using Wails and Whispers!"
 POD_wails_and_whispers_failure_toast:0 "Failure!"
 POD_wails_and_whispers_failure_toast.desc:0 "You fail to use Wails and Whispers on [recipient.GetFirstName]!"

 POD_cthonic_womb_perk_effect.tt:0 "[victim.GetFirstName] will return from death as a [GetTrait('wraith').GetName( GetPlayer )]"

 POD_intimations_of_mortality_perk_interaction:0 "Intimations of Mortality"
 POD_intimations_of_mortality_interaction_desc:0 "Curses the target vampire with the more unpleasant and irritating aspects of mortality"
 POD_intimations_of_mortality_interaction.tt:0 "Using your powers of necromancy you can make the target less able to deal with stress and unable to use Blood Surge for 1 year"
 POD_intimations_of_mortality.100.t:0 "Intimations of Mortality"
 POD_intimations_of_mortality.100.desc:0 "Intimations of Mortality inflicts the more unpleasant and irritating aspects of mortality upon a vampire. These experiences are culled directly from the Discipline user’s memory and include such experiences as mortal hunger and thirst, the need to eliminate waste, poor sensory acuity, and vulnerability to physical trauma that even a neonate vampire could shrug off"
 POD_intimations_of_mortality.100.option.a:0 "[recipient.GetFirstName] needs a reminder of what mortality feels like"
 POD_intimations_of_mortality.100.option.a.tt:0 "Let's see how [recipient.GetSheHe] handles this"
 POD_intimations_of_mortality.100.option.b:0 "Maybe I should reconsider"
 POD_intimations_of_mortality.100.option.b.tt:0 "Maybe [recipient.GetSheHe] doesn't deserve this. At least not right now..."
 POD_intimations_of_mortality_actor_toast:0 "Success!"
 POD_intimations_of_mortality_actor_toast.desc:0 "[recipient.GetFirstName] is more vulnerable to stress"
 POD_intimations_of_mortality_enemy_toast:0 "Weakness!"
 POD_intimations_of_mortality_enemy_toast.desc:0 "[actor.GetFirstName] has cursed you using Intimations of Mortality!"
 POD_intimations_of_mortality_failure_toast:0 "Failure!"
 POD_intimations_of_mortality_failure_toast.desc:0 "You fail to use Intimations of Mortality on [recipient.GetFirstName]!"

 POD_gift_of_melancholia_perk_interaction:0 "Gift of Melancholia"
 POD_gift_of_melancholia_interaction_desc:0 "Inflict a virulent wasting illness upon the enemy realm. The disease is highly contagious among mortals, who can spread it to each other by mere proximity."
 POD_gift_of_melancholia_interaction.tt:0 "Inflict a virulent wasting illness upon the enemy realm. The disease is highly contagious among mortals, who can spread it to each other by mere proximity."
 POD_gift_of_melancholia_actor_toast:0 "Disease is running rampant through [recipient.GetFirstName]'s realm"
 POD_gift_of_melancholia_actor_toast.desc:0 "Hopefully you won't come to regret this"
 POD_gift_of_melancholia_enemy_toast:0 "Disease is running rampant through your realm"
 POD_gift_of_melancholia_enemy_toast.desc:0 "It seems impossible to stop at this point"
 POD_gift_of_melancholia_failure_toast:0 "You fail to spread illness in [recipient.GetFirstName]'s realm"
 POD_gift_of_melancholia_failure_toast.desc:0 "But there will be more opportunities in the future..."
 POD_gift_of_melancholia.100.t:0 "Gift of Melancholia"
 POD_gift_of_melancholia.100.desc:0 "This power inflicts a virulent wasting illness on mortals and Cainites alike. Both are afflicted with a disease that causes dizziness, weakness, malaise, and nausea. The disease is highly contagious among mortals, who can spread it to each other by mere proximity. \n\nOnce the disease has started spreading there is no way to stop it due to its' virulent nature meaning the only option is to let it burn itself out. You also have no way to control how the disease spreads after the first infection so if you are not careful your own lands may suffer the same fate."
 POD_gift_of_melancholia.100.option.a:0 "I come bearing terrible gifts"
 POD_gift_of_melancholia.100.option.b:0 "Maybe I should reconsider"
 POD_gift_of_melancholia.100.option.b.tt:0 "You abandon your plans to spread illness in their realm. For now..."
 POD_gift_of_melancholia_interaction_success:0 "The disease will break out in [target.GetFirstName]'s capital county and spread from there over time"
 POD_gift_of_melancholia_interaction_failure:0 "The disease fails to take hold"

 POD_witchs_fruit_interaction:0 "Witch's Fruit"
 POD_witchs_fruit_interaction_desc:0 "Use intrigue to trick a mortal to consume edible plant matter exposed to necrotic energies"
 POD_witchs_fruit_interaction.tt:0 "Use intrigue to trick a mortal to consume edible plant matter exposed to necrotic energies"
 POD_witchs_fruit.100.t:0 "Witch's Fruit"
 POD_witchs_fruit.100.desc:0 "Every plant relies on death to grow. Rotting things enrich the soil, and the trees, vines, and grasses drink up necrotic echoes along with vital nutrients. A necromancer can awaken this death aura by exposing their fruits to her blood. She awakens and concentrates their trace necrotic energies so that any mortal who consumes them will be disoriented by twisted visions of ghosts and long-fallen buildings while under their influence."
 POD_witchs_fruit.100.option.a:0 "It is time for [recipient.GetFirstName] to taste the forbidden fruit"
 POD_witchs_fruit.100.option.a.tt:0 "Perhaps a nice red apple..."
 POD_witchs_fruit.100.option.b:0 "Maybe I should reconsider"
 POD_witchs_fruit.100.option.b.tt:0 "The fruits are not yet ripe..."
 POD_witchs_fruit_actor_toast:0 "Success!"
 POD_witchs_fruit_actor_toast.desc:0 "How do you like them apples [recipient.GetFirstName]?"
 POD_witchs_fruit_enemy_toast:0 "Confusion!"
 POD_witchs_fruit_enemy_toast.desc:0 "Something you ate really isn't agreeing with you"
 POD_witchs_fruit_failure_toast:0 "Failure!"
 POD_witchs_fruit_failure_toast.desc:0 "[recipient.GetFirstName] did not consume the Witch's Fruit"

 POD_raise_the_green_one_interaction:0 "Raise the Green One"
 POD_raise_the_green_one_interaction_desc:0 "Raise a corpse bound and strengthened by plant matter."
 POD_raise_the_green_one_interaction.tt:0 "Raise a corpse bound and strengthened by plant matter. Leaves that cover its skin and strong vines supplement it's rotten sinews. The living shell grants speed and self-preservation instincts not seen in other animated dead."

 POD_song_of_the_dead_interaction:0 "Song of the Dead"
 POD_song_of_the_dead_interaction_desc:0 "Cause the target to gain stress over time"
 POD_song_of_the_dead_interaction.tt:0 "Cause the target to gain stress over time"
 POD_song_of_the_dead_disable_interaction:0 "Stop singing"
 POD_song_of_the_dead_disable_interaction_desc:0 "You stop singing the Song of the Dead"
 POD_song_of_the_dead_disable_interaction.tt:0 "You stop singing the Song of the Dead letting the target finally relax"
 POD_song_of_the_dead.100.t:0 "Song of the Dead"
 POD_song_of_the_dead.100.desc:0 "The vampire chants, weaving unheard words into the song and instilling an unhealthy fascination with death in his listener. Afflicted individuals find themselves drawn to lonely, inauspicious places as they sink into depression; mortality concerns them as never before and they see ill omens everywhere. If affected by this power for an extended period, mortals go mad and become suicidal, while vampires eventually succumb to torpor"
 POD_song_of_the_dead.100.option.a:0 "I shall sing you the song of my people"
 POD_song_of_the_dead.100.option.b:0 "Maybe I should reconsider"
 POD_song_of_the_dead.100.option.b.tt:0 "There will be other opportunities for a sing-along."
 POD_song_of_the_dead_actor_toast:0 "Success!"
 POD_song_of_the_dead_actor_toast.desc:0 "[target.GetFirstName] is affected by your Song of the Dead"
 POD_song_of_the_dead_enemy_toast:0 "Despair!"
 POD_song_of_the_dead_enemy_toast.desc:0 "[attacker.GetFirstName] has inflicted their Song of the Dead upon you"
 POD_song_of_the_dead_failure_toast:0 "Failure!"
 POD_song_of_the_dead_failure_toast.desc:0 "[target.GetFirstName] is unaffected by your Song of the Dead"
 POD_song_of_the_dead_disaster_toast:0 "Disaster!"
 POD_song_of_the_dead_disaster_toast.desc:0 "You are affected by he very fate you sought to bring down upon [recipient.GetFirstName]."
 POD_song_of_the_dead_continues_toast:0 "The Song of the Dead continues"
 POD_song_of_the_dead_continues_toast.desc:0 "This is the song that never ends..."
 POD_song_of_the_dead_continues_target_toast.desc:0 "[attacker.GetFirstName] is still singing the Song of the Dead"
 POD_song_of_the_dead_ends_toast:0 "The Song of the Dead ends"
 POD_song_of_the_dead_ends_attacker_toast.desc:0 "You stop singing the Song of the Dead to [target.GetFirstName]"
 POD_song_of_the_dead_ends_target_toast.desc:0 "[attacker.GetFirstName] is no longer singing the Song of the Dead to you"
