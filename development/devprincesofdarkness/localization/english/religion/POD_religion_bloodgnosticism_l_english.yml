 viapura:0 "Via Pura"
 viapura_adj:0 "Katharoi"
 viapura_adherent:0 "Kathar"
 viapura_adherent_plural:0 "Katharoi"
 viapura_desc:0 "In an era of increasing resistance to clerical authority, they’ve chosen Gnostic dualism as the sword best forged for their aims. The Zealots build religions with almost cynical calculation, drawing from Neoplatonism, apocryphal Scripture and other obscure sources. They’ve named themselves Katharoi, and support mortal Cathars (the same word, spoken in French and Latin) not as patrons, but spiritual guides."
 
 holy_order_the_pure:0 "The Pure"

 calomenaschosen:0 "Calomena's Chosen"
 calomenaschosen_adj:0 "Chosen"
 calomenaschosen_adherent:0 "Chosen"
 calomenaschosen_adherent_plural:0 "Chosen"
 calomenaschosen_desc:0 "The Chosen were founded by the Caitiff Stanislav. Founded in the Western Balkans, this cult seems loosly derived from the Bogomil heresy. The Chosen believe that Caine was a childe of the devil and this his children  are the most vile manifestations on earth.  Calomenas, Caine's Twin Sister, is believed to be preparing to return an destroy the vile Cainites, cleansing the world for the glorious Spirit of God.  The Clanless are her chosen instruments. The organize circles led by vampires with ghouls and mortal members. Stanislav was martyered in 1204 during the end of Michael's Dream and the Bitter Crusade, but his cult lurches onward to Gehenna."
