 #Hunter-Group Faiths
 
 shadowinquisition:0 "Shadow Inquisition"
 shadowinquisition_adj:0 "Inquisition"
 shadowinquisition_adherent:0 "Inquisitor"
 shadowinquisition_adherent_plural:0 "Inquisitors"
 shadowinquisition_desc:0 "The Shadow Inquisition is a secret campaign orchestrated by the Catholic Church during the Dark Medieval period. Unlike the Papal Inquisition, which is targeted at heretics, the Shadow Inquisition targets vampires, werewolves, mages and other "servants of Satan" for either destruction or salvation. Its existence will be short lived, but its successes will change the Cainite world forever."
 
 calomenasforsaken:0 "Calomena's Forsaken"
 calomenasforsaken_adj:0 "Forsaken"
 calomenasforsaken_adherent:0 "Forsaken"
 calomenasforsaken_adherent_plural:0 "Forsaken"
 calomenasforsaken_desc:0 "Scourges of the Cainite race, the Forsaken are a group of hunters beliving in the Bogomil heresy. They believe Calomena was the sister of Caine, and they are to bring about the destruction Caine's children--the vampires. They believe in a dualist philsophy and also observe the harsh poverty upheld by most Bogomils."
 