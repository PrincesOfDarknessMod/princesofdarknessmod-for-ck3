 wyrm_religion_desc:0 "In the theology of the Garou, the Wyrm is one of the higher Celestines. The Wyrm's purpose is the cleansing and rectification of Creation, furthering its descent into Entropy. He achieves this by eliminating that which the Wyld creates and the Weaver structures.\nWith the advent of humanity, the Wyrm was progressively constrained until he was driven mad, hellbent on destroying everything. Consequently, the Wyrm is now a spirit of destruction, chaos, darkness, and corruption, the essence of everything the Garou oppose."
