 #Perk Effects and Flavor
 bond_famulus_perk_effect:0 "As a [character_interaction|E] you can [bind_famulus|E], Blood Bonding an animal and forming a mental link with it."
 bond_famulus_perk_flavor:0 "#weak Only death releases a famulus once bound. As long as it receives vampire Blood on a regular basis, the famulus does not age#!"
 sense_the_beast_perk_flavor:0 "#weak The vampire can sense the Beast present in mortals, vampires, and other supernaturals, gaining a sense of their nature, hunger, and hostility#!"
 feral_whispers_perk_flavor:0 "#weak The vampire can commune with the beasts of the wild and the city. Feral Whispers allows two-way communication with animals. A cat might not be interested in debating the merits of church scripture but happily discusses the lack of prey around the local cathedral.#!"
 animal_succulence_perk_effect:0 "The vampire can slake additional Hunger by feeding on animals. As a [character_interaction|E], you can drain animals to better effect than other vampires."
 animal_succulence_perk_flavor:0 "#weak Vampires usually find an animal’s blood lacking in sustenance. It tastes repulsive, and it hardly nourishes undead veins. Some elder practitioners of Animalism, however, have developed sufficient affinity for the blood of beasts that they can efficiently sustain themselves from the wild.#!"
 quell_the_beast_perk_flavor:0 "#weak By locking eyes with a target, the vampire cows their inner Beast into temporary slumber. Mortals affected thus become apathetic, unable to take any actions other than to stay alive, while vampires’ bestial urges temporarily abate, for better or worse#!"
 call_of_the_wild_perk_effect:0 "Unlocks the ability to recruit Controlled Animals as Special Men-at-Arms. They will start out weak, you can only ever have one regiment of these and their size is idependent of any innovations you possess."
 call_of_the_wild_perk_flavor:0 "#weak With this power, the Beast instills the vampire’s voice with a deep affinity for a given animal. She howls, shrieks, caws, or otherwise imitates an animal noise. Any animal of the chosen species within earshot are summoned to the vampire, and some will come, depending on the vampire’s raw ability#!"
 subsume_the_spirit_perk_flavor:0 "#weak The vampire can completely transfer its mind into the body of an animal. They can control the animal and use its senses freely, even during the day should they manage to stay awake. #!"
 unliving_hive_perk_flavor:0 "#weak Most often seen amongst the Nosferatu, this unnerving power allows the user to extend their animal influence to swarms of insects such as flies or roaches.#!"
 drawing_out_the_beast_perk_effect:0 ""
 drawing_out_the_beast_perk_flavor:0 "#weak The vampire can project their Beast at the moment of terror or fury frenzy, transferring it into a nearby subject, either mortal or vampire. That person immediately experiences the frenzy instead, going on a merciless rampage or fleeing in terror depending on the trigger#!"
 animal_dominion_perk_flavor:0 "#weak The power the vampire holds over beasts is now great enough to command flocks and packs as if they were extensions of their own body. At a gesture, animals lay down their lives by the dozens, even hundreds, to appease their master#!"
 tongue_of_beasts_perk_flavor:0 "#weak This power expands the gifts of Whispers to the Wild. Instead of being able to speak to a single animal, the vampire may speak to any and all animals without establishing eye contact.#!"
 send_the_eighth_plague_perk_effect:0 "TODO"
 send_the_eighth_plague_perk_flavor:0 "#weak This is one of the most destructive powers among any of the Disciplines. An ancient Gangrel called Valentinian demonstrated its immense potential for ruination shortly after the Fourth Crusade. Angry with Italian Cainites intruding upon his lands, he called upon his mastery of Animalism and brought starvation down on an entire trading town.#!"
 crimson_fury_perk_effect:0 "TODO"
 crimson_fury_perk_flavor:0 "#weak This power is the subject of much rumor and conjecture, as it has very little visible effect. Upon reaching this level of mastery, the vampire may choose to allow his Beast to roam freely through his veins. His blood causes frenzy in mortals and vampires who taste it. Should a diablerist successfully consume the vampire's soul, she may well meet a grisly end as the vampire's Beast eats her away from the inside#!"
 eyes_of_the_forest_perk_flavor:0 "#weak This awe-inspiring powers is at the root of many folk tales about brooding forests and forbidding mountains. The animals and even insects within the area serve as the vampires's eyes and ears, providing her with an intimate knowledge of the nighttime goings-on of her domain.#!"
 plague_of_beasts_perk_flavor:0 "#weak A Methuselah master of Animalism can bring about plagues of Biblical proportion. Expanding on Call the Wild, the vampire summons forth animals to her. However, instead of calling out in one animal’s tongue, the Beast itself cries out over miles or kilometers. This summons every animal to swarm around the Cainite, causing utter bedlam.#!"

