 attuned_to_yang_modifier:0 "Attuned to Yang"
 attuned_to_yang_modifier_desc:0 "A mortal or vampire attuned to Yang becomes feverish and manic."
 state_of_balance_modifier:0 "State of Balance"
 state_of_balance_modifier_desc:0 "A mortal restored to a state of Balance enjoys greatly improved physical and mental health."
  
