l_english:
 game_concept_numina:0 "numina"
 game_concept_numina_desc:0 "Numina is an umbrella term for the supernatural powers that are available to mortals and Sleepers. Three main groups of numina have been outlined and includes [psi_lifestyle|E], sorcery, and [faith_lifestyle|E]."

 game_concept_psi_lifestyle:0 "Psychic Phenomena"
 game_concept_psi_lifestyle_desc:0 "A category of [numina|E]. The ability to alter (or remotely observe) reality, directly tied to the mind/brain of the character."
 
 psi_lifestyle_name:0 "Psi"
 psi_lifestyle_desc:0 "I will focus on the powers that come from Psychic Phenomena."
