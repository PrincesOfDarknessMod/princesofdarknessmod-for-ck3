 APOCALYPTIC_FORM_PERK_EFFECT:0 "Allow shapeshift to [GetModifier( 'POD_shapeshift_form_apocalyptic_angelic_modifier' ).GetNameWithTooltip|L] or [GetModifier( 'POD_shapeshift_form_apocalyptic_damned_modifier' ).GetNameWithTooltip|L] as [GetTrait('demon').GetName( GetPlayer )].\nAllow shapeshift to [GetModifier( 'POD_shapeshift_form_apocalyptic_lesser_modifier' ).GetNameWithTooltip|L] as [thrall|E].\n#F All demons have an Apocalyptic Form for no cost, human-like in shape, though certainly grander or more terrible. Apart from its altered appearance and voice, and any associated cosmetic effects such as a pale halo, glowing eyes and the like.#!"
 PRETERNATURAL_REFLEXES_PERK_EFFECT:0 "#F The character gains additional base initiative.#!"
 HARDENED_FLESH_PERK_EFFECT:0 "#F The character's host body and Apocalyptic Form can soak lethal damage with full Stamina. Host bodies do not age as long as they are possessed, but resume where they left off if the demon vacates the body.#!"
 PERFECT_IMMUNITY_PERK_EFFECT:0 "You won't get diseases.\n#F The character cannot take ill, suffer infection or even serve as a passive carrier of disease. Only supernatural maladies can affect her.#!"
 REGENERATION_PERK_EFFECT:0 "As a [character_interaction|E], allows you to heal your wounds.\n#F The player can reflexively spend a point of Resolve each turn to instantly heal one level of the character's lethal damage or all levels of bashing damage.#!"
 ARSENAL_OF_THE_BEAST_PERK_EFFECT:0 "#F The character grows a bestial weapon. Each of these features has its own cost and effect, and some of these traits can represent horrific mutations never found in nature.#!"
 INCREASED_HEALTH_PERK_EFFECT:0 "#F The character gains additional Bruised health.#!"
 RESILIENCE_PERK_EFFECT:0 "#F The character gains additional resistance to injury.#!"
 SENSE_VITALITY_PERK_EFFECT:0 "#F With a glance, the character can determine the overall health of a being.#!"
 CONTAGION_MASTERY_PERK_EFFECT:0 "#F The character may touch a living being and purge her of all disease and poisons. Expelled diseases and toxins rise to the surface of the skin as an inert black sludge. Alternately, the character's touch can inflict disease.#!"
 ULTIMATE_HORROR_PERK_EFFECT:0 "#F The demon's infernal form exudes infinite primordial evil. Onlookers who behold the dread fallen gain a derangement.#!"
 WINGS_PERK_EFFECT:0 "#F The character grows large wings from her back, stretching a third again as long as the character is tall at full extension. These may resemble those of a bird, bat, butterfly or something stranger still, perhaps sculpted out of fire, light, clouds, shadow or unfurling, jagged crystal.#!"
 INHUMAN_STRENGTH_PERK_EFFECT:0 "#F The character gains preternatural strength, whether visible as a bulky form or imbued upon the very visage of frailty.#!"
 INURED_TO_AGONY_PERK_EFFECT:0 "#F The character suffers no penalties for injuries unless Incapacitated.#!"
 DAMAGE_IMMUNITY_PERK_EFFECT:0 "You won't gain [GetTrait('inappetetic').GetName( GetPlayer )] any more.\n#F The character ignores all damage inflicted by a specific type of source. Alternately, the character surpasses an inherent limitation of mortal flesh, such as the need for sustenance, air, sleep or something equally important.#!"
 HEALING_TOUCH_PERK_EFFECT:0 "As a [character_interaction|E], allows you to heal target's wounds.\n#F The character can heal living beings with a touch.#!"
 RESHAPE_FLESH_PERK_EFFECT:0 "#F The demon may command living animal matter to shift and even flow like wax under his touch.#!"
 RELENTLESS_SOUL_PERK_EFFECT:0 "Allows you to not die by wounds.\n#F Whenever the character suffers lethal damage that reduces her below Incapacitated, the character's body remain at Incapacitated instead of dying.#!"
 UNYIELDING_PERK_EFFECT:0 "Allow you to spend willpower instead of taking wounds.\n#F The character has the durability of stone and ignores all sources of bashing damage outright.#!"
 SPEED_OF_THOUGHT_PERK_EFFECT:0 "#F The character moves impossibly fast, accelerated beyond human limits.#!"
 ARCANA_INCORPOREAL_FORM_PERK_EFFECT:0 "[GetModifier( 'POD_shapeshift_form_incorporeal_modifier' ).GetNameWithTooltip|L]\n#F The character transforms his body from solid flesh and bone to an intangible or dissolved state.#!"
 DIVINE_POTENTIAL_PERK_EFFECT:0 "#F Demons can increase their Attributes and Abilities beyond human limits.#!"
 LONGEVITY_PERK_EFFECT:0 "#F The thrall stops aging for a period of several years or reduces his physical age by a like amount.#!"
 TRAIT_APTITUDE_PERK_EFFECT:0 "#F The character demonstrates surpassing excellence with a particular Ability or Attribute.#!"
 TRAIT_ENHANCEMENT_PERK_EFFECT:0 "#F One of the character's Abilities or Attributes has received infernal enhancement.#!"
 INVOCATION_OF_NAME_PERK_EFFECT:0 "#F A demon intuitively senses whenever someone speaks its name, and may follow that thread of contact back to spy upon the source.#!"
 DEVOUR_SOUL_PERK_EFFECT:0 "Unlock $EXECUTION_DEVOUR_SOUL$ [executions|E] option to [GetTrait('demon').GetName( GetPlayer )].\n#F Away from Hell, demons can permanently destroy their own kind by consuming and assimilating their essence.#!"
 ENTHRALL_PERK_EFFECT:0 "Unlock Enthrall [character_interaction|E].\n#F By touching a willing mortal, a demon can reshape the target's soul to receive a gift of infernal power.#!"
 IMMORTAL_SPIRIT_PERK_EFFECT:0 "Can't be hurt with physical moves when you are not [GetTrait('truefallen').GetName( GetPlayer )] or [GetTrait('earthbound').GetName( GetPlayer )].\n#F Without the casement of flesh or a reliquary, a demon's soul exists as an incorporeal being of pure Resolve.#!"
 ARCANA_POSSESSION_PERK_EFFECT:0 "As a [character_interaction|E], allows you to possess a character or artifact while in spirit state.\nAs a [character_interaction|E], allows you to designate your next human vessel in case of the current one is out of use.\n#F Demons without the sanctuary of a host body or reliquary can seek that shelter through the act of possession.#!"
 RAVAGE_PERK_EFFECT:0 "Unlock $EXECUTION_DEVOUR_SOUL$ [executions|E] option to convert to [thrall|E].\n#F In emergencies, demons can devour the souls of their [thrall|E]s to quickly replenish their stores of Resolve.#!"
 INVIOLATE_SOUL_PERK_EFFECT:0 "Gain strong mental defenses, making you immune to some mental powers.\nCan't be covert to [GetTrait('wraith').GetName( GetPlayer )].\n#F The character is completely immune to possession and other attempts to control or suppress her soul.#!"
 SPIRIT_SIGHT_PERK_EFFECT:0 "Unlock $POD_marked_for_return_interaction$ [character_interaction|E].\nUnlock $seek_aid_of_the_spirits_decision$ [decision|E].\n#F The character can perceive all incorporeal spirits normally roaming invisibly through the world or the close spiritual planes reflecting the world.#!"
 READ_THE_SIN_PERK_EFFECT:0 "#F The character may look into the heart of a subject, perceiving the stain of her dominant Vice as an aura of the appropriate color.#!"
 COMPEL_SIN_PERK_EFFECT:0 "#F The character may project his Vice onto others for a time, giving them a taste of his own urges.#!"
 READ_THE_HEART_PERK_EFFECT:0 "#F The character may glimpse the colors of a target's emotional halo glowing around and through the darkened stains of sin.#!"
 GIFT_OF_FAITH_PERK_EFFECT:0 "#F The character touches or makes eye contact with his thrall, donate excessive Resolve to gain Willpower.#!"
 GREATER_INVOCATION_PERK_EFFECT:0 "#F The demon may now use Invocation of Name to contact any sentient being whose name it knows, just as it can invoke other demons.#!"
 PERFECT_LIE_PERK_EFFECT:0 "#F The character speaks lies with flawless sincerity.#!"
 READ_THE_MIND_PERK_EFFECT:0 "#F The character may gaze at a sentient being and probe his thoughts and memories.#!"
 CONQUERING_WILL_PERK_EFFECT:0 "#F The character issues a spoken command in the inflection once used to convey the word of God.#!"
 COMMAND_THE_ETERNAL_SOUL_PERK_EFFECT:0 "#F The demon speaks the True Name of a demon using the Arcana Invocation of Name.#!"
 REAPERS_HUNGER_PERK_EFFECT:0 "#F Whenever the fallen personally kills a mortal, they gains a single point of Resolve.#!"
 IMPLACABLE_VENGEANCE_PERK_EFFECT:0 "#F The demon names its prey and attunes its entire being to her destruction. For as long as the demon vigilantly and unceasingly hunts its quarry and works directly toward her death, it does not need sleep, food, drink or air. It feels no fatigue or pain and suffers no wound penalties; in short, it exists beyond the constraints of living flesh.#!"
 SHIELD_OF_SPITE_PERK_EFFECT:0 "#F Whenever anyone attempts magic that opens telepathic contact with the character, either to read or attack his mind or control him, the intruder suffers damage equal to the character's Torment.#!"
 LASH_OF_ANGUISH_PERK_EFFECT:0 "#F The character concentrates on a living or undead target in his line of sight and telepathically unleashes a surge of raw pain and despair.#!"
 SHROUDED_SOUL_PERK_EFFECT:0 "#F The character blurs in the mind's eye, becoming innocuous to the point of anonymity.#!"
 ARCANA_SIN_EATING_PERK_EFFECT:0 "#F The character can regain Resolve by indulging his Vice or witnessing a mortal indulging the favored sin.#!"
 RAVAGE_SINNER_PERK_EFFECT:0 "#F The demon can lure a mortal victim into debauchery to enable feeding, but the mortal must truly sin of her own accord.#!"
 SOUL_BURN_PERK_EFFECT:0 "#F The character may cannibalize her own soul for power in emergencies.#!"
 CEREMENT_OF_WALKING_DUST_PERK_EFFECT:0 "#F The demon may use the Arcana Possession to enter a reasonably intact corpse.#!"
 COMMAND_THE_DEAD_PERK_EFFECT:0 "Unlock $POD_bind_interaction$ [character_interaction|E].\nUnlock $POD_command_wraith_interaction$ [character_interaction|E].\n#F The demon may command a ghost in its presence and expect obedience.#!"
 RAISE_THE_DEAD_PERK_EFFECT:0 "Can recruit [GetMaA('zombu').GetName] as [men_at_arms|E].\n#F The character commands the dead to rise, speaking blasphemous mockeries of the Word that breathed life into dust.#!"
 SPIRIT_STRIKE_PERK_EFFECT:0 "You can hurt [GetTrait('wraith').GetName( GetPlayer )] with physical moves in [single_combat_duel|E].\n#F The character can strike immaterial spirits.#!"
 EXCISE_SOUL_PERK_EFFECT:0 "Unlock $EXECUTION_CONVERT_TO_WRAITH$ [executions|E] option.\n#F The character strikes a corporeal being, his soul tears free and the body instantly dies.#!"
 ABANDON_VESSEL_PERK_EFFECT:0 "As a [character_interaction|E], allows you to abandon your current vessel.\n#F The demon can willingly leave the sanctuary of a vessel that no longer fulfills its needs.#!"
 THEFT_OF_FAITH_PERK_EFFECT:0 "#F Use of this Arcana permits the demon to Ravage the target as if she were its thrall.#!"
 TRANSFER_VESSEL_PERK_EFFECT:0 "You no longer need to abandon your current vessel to possess another one.\n#F By touching a prospective new vessel, a demon may attempt to transfer its being with Possession without any risk to itself.#!"
 USURPATION_OF_FLESH_PERK_EFFECT:0 "#F A demon may use this Arcana to seize control of a thrall's body, controlling the servant like a puppet.#!"
 VISAGE_OF_GLORY_PERK_EFFECT:0 "#F The character glows with the spark of divinity for a short time.#!"
 BEHOLD_THE_METATRON_PERK_EFFECT:0 "#F The demon becomes impossibly and terribly glorious for a short time, either recapturing its glory as one of God's Host or displaying to all who can see it the horror of Hell itself.#!"
 REVELATION_PERK_EFFECT:0 "As a [character_interaction|E], allows you to drain Resolve from witnesses.\n#F In the absence of more reliable options, the fallen can harvest Resolve by directly magnifying a mortal's belief in divinity or damnation.#!"
 PATTERN_SENSE_PERK_EFFECT:0 "#F Demons have an instinctual sensitivity to the patterns of the natural order, having established those patterns at the beginning of time.#!"
 FORTUNATE_GUESS_PERK_EFFECT:0 "You will receive a notification if someone intent to murder your friends or family.\nYou will receive a notification if someone intent to seduce your lovers or consorts.\n#F The character gains an uncanny intuition for the flow of chance and destiny.#!"
 FORETELL_PERK_EFFECT:0 "#F The character may discern likely events of the future.#!"
 ALTER_FATE_PERK_EFFECT:0 "#F The demon may stretch or even tear the destiny of an individual by speaking his name and proclaiming the changes imposed on his future.#!"
 BEYOND_NOW_PERK_EFFECT:0 "#F Confronted with the inexorable forward march of time, the demon steps sideways out of the moment. Demons can use this Arcana to escape from enemies, bypass sentries, perfectly dodge volleys of arrows, stab an enemy in the back or literally make time to think about something important.#!"
 CERTAINTIES_OF_CHANCE_PERK_EFFECT:0 "#F From merely observing the flow of chance, the character may now direct the outcome.#!"
 PORTAL_MASTERY_PERK_EFFECT:0 "#F The character lays her hand upon a door, window or other point of entry that she desires to open or seal.#!"
 ARCANA_PREMONITION_PERK_EFFECT:0 "#F Like a spider in its web, the character senses vibrations in the strands of fate when danger approaches.#!"
 SCRY_PERK_EFFECT:0 "#F The character concentrates and names a location, object or being familiar to her, revealing the target and surrounding location.#!"
 SHARPENED_SENSES_PERK_EFFECT:0 "#F The character attunes his preternatural awareness to unravel the hidden details and secrets of the world.#!"
 SHORTENED_PATH_PERK_EFFECT:0 "#F The character reaches out her will through space and pulls, guiding a specific journey to take less time than normal.#!"
 STEP_BETWEEN_PERK_EFFECT:0 "#F The character gently warps space, vanishing and reappearing in a blur of light or wavering shadow.#!"
 TOUCH_FROM_AFAR_PERK_EFFECT:0 "#F The demon extends its preternatural will to use Arcana on a distant target.#!"
 TWIST_OF_FATE_PERK_EFFECT:0 "#F The character inherits friends, fame or wealth by a disturbing preponderance of strange coincidence.#!"
 OPEN_GATE_PERK_EFFECT:0 "#F The demon bends or tears space into a brief portal connecting its location with another place.#!"
 CELESTIAL_RADIANCE_PERK_EFFECT:0 "Allow shapeshift to [GetModifier( 'POD_shapeshift_form_light_modifier' ).GetNameWithTooltip|L].\n#F The character may emit and control light by unveiling the burning power of her soul.#!"
 INVISIBILITY_PERK_EFFECT:0 "Allow shapeshift to [GetModifier( 'POD_shapeshift_form_mist_modifier' ).GetNameWithTooltip|L].\n#F The character blurs and fades from view, shrouded from the eye of the world.#!"
 SHADOW_MASTERY_PERK_EFFECT:0 "Allow shapeshift to [GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L].\n#F The character may control darkness by exerting the greater darkness of his damned soul.#!"
