 ENSHROUD_PERK_EFFECT:0 " #Bold No longer needed to make a sacrifice to access the Tempest.#!\nA Harbinger can manipulate the membrane between the Shadowlands and Tempest, allowing them to enter the Tempest without opening a Nihil or use the Tempest for concealment."
 WEATHER_EYE_PERK_EFFECT:0 "#Bold Spirit traveling time: #P -10%#!#!\nA Harbinger is always aware of current conditions in the nearby Tempest, and can take shortcuts between two Shadowlands locations."
 PHANTOM_WINGS_PERK_EFFECT:0 "#Bold Spirit traveling time: #P -10%#!#!\nA Harbinger can grow wings to glide through the Tempest and Shadowlands."
 RETURN_PERK_EFFECT:0 "#Bold Can access the corresponding [dark_kingdom|E] in the Tempest.#!\nA Harbinger may travel from any location in the Tempest to their home by the fastest route possible."
 FLICKER_PERK_EFFECT:0 "#Bold Spirit traveling time: #P -20%#!#!\nA Harbinger may bend the Tempest to teleport themselves to another location."
 STORMREADER_PERK_EFFECT:0 "#Bold You will no longer get lost in the Tempest.#!\nA Harbinger gains an intuitive sense of the Tempest, allowing them to cut travel times when traveling to or from a location in the Tempest, and to navigate so as to avoid a Maelstrom or mitigate its effects."
 TEMPEST_RIDERS_CANCELEER_PERK_EFFECT:0 "A Harbinger can grow metallic black wings, allowing them to glide, attack, and protect others."
 ARCANOI_OUBLIETTE_PERK_EFFECT:0 "#Bold Unlock $EXECUTION_BANISH_TO_TEMPEST$ [executions|E] option.#!\nA Harbinger may send another wraith directly into the Tempest."
 
