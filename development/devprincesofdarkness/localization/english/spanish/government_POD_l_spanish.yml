l_spanish:
 traditions_government:0 "Tradiciones"
 traditions_government_adjective:0 "Tradiciones"
 traditions_government_realm:0 "Reino cainita"
 traditions_government_vassals_label:1 "Las [obligaciones|E] cainitas se basan en el [contrato_feudal|E] de cada [vasallo|E]"
 traditions_government_desc:1 "La gran mayoría de los reinos de Vampiros siguen las Tradiciones de Caine, un código de conducta algo tosco sobre cómo comportarse con los mortales y otros afines."
 free_state_government:0 "Estado libre"
 free_state_government_adjective:0 "Libre"
 free_state_government_realm:0 "Estado libre"
 free_state_government_vassals_label:1 "Las [obligaciones|E] de los vasallos se basan en la opinión de cada [vasallo|E] sobre el líder del reino."
 free_state_government_desc:1 "Al no aceptar las leyes de Caine, los Estados Libres son una alianza poco firme de cainitas de mentalidad similar que se reúnen en torno a un gobernante carismático."
 inquisition_government:0 "Orden de la Inquisición"
 inquisition_government_adjective:0 "Inquisición"
 inquisition_government_realm:0 "Orden de la Inquisición"
 inquisition_government_vassals_label:1 "Las obligaciones de los inquisidores se basan en su opinión."
 inquisition_government_desc:1 "Una célula de inquisidores que destruye la influencia sobrenatural allí donde la encuentra."

 legacy_rights:0 "La primera tradición: El Pacto"
 legacy_rights_none:0 "Religiosamente desprotegido"
 legacy_rights_none_short:0 "Forzado"
 legacy_rights_none_desc:2 "“Tu sangre te hace mi cría, hecha a mi imagen. Mi maldición es tuya, y mi salvación es tuya. Me sitúo ante ti y por encima de ti como dios-regente. Yo soy el camino, mis Tradiciones mi pacto. Renuncia a mí y renuncia a toda esperanza"
 legacy_rights_protected:0 "Protegido religiosamente"
 legacy_rights_protected_desc:2 "“Tu sangre te hace mi cría, hecha a mi imagen. Mi maldición es tuya, y mi salvación es tuya. Estoy delante y por encima de ti como el dios-regente. Yo soy el camino, mis tradiciones de mi pacto. yo renuncio y renunciar a toda esperanza “. Así habló Caine \ n \ n #emphasis #bold [vassal|E] Privileges:#!#!\nThe [liege|E] no puede [demand_conversion|E] de su [vassal|E]\nThe [liege|E] no puede [convert_county|E] en su [vassals|E]' lands\n\n#flavor el [vassal|E] se le concede un estatus de protección especial, con el reino reconocimiento oficial de su derecho a practicar su propia [faith|E] #!"
 legacy_rights_protected_short:0 "No aplicado"

 destruction_rights:0 "La quinta tradición: La Destrucción"
 destruction_rights_none:0 "Sin derechos de destrucción"
 destruction_rights_none_desc:0 "“Arte prohibido tú que se derrame la sangre de otro de tu especie que es mayor. Este derecho sólo pertenece a la más cercana a mí y nadie más. Está prohibido que los de la sangre más débil a levantarse contra sus mayores. Este es mi pacto final “. Así habló Caine. \n\n#flavor El [vassal] no está permitido para destruir vampiros en su dominio. Sólo el [liege] puede llamar a un Caza de Sangre."
 destruction_rights_none_short:0 "Nada"
 destruction_rights_allowed:0 "Destrucción permitida"
 destruction_rights_allowed_desc:0 "“Arte prohibido tú que se derrame la sangre de otro de tu especie que es mayor. Este derecho sólo pertenece a la más cercana a mí y nadie más. Está prohibido que los de la sangre más débil a levantarse contra sus mayores. Este es mi pacto final “. Así habló Caine. \n\n#emphasis #bold El [liege] permite a la [vassal] para hacer cumplir la Lextalionis y llamar a una caza de sangre en el dominio [vassal] . #!"
 destruction_rights_allowed_short:0 "Permite"
 destruction_rights_open_war:0 "Guerra abierta"
 destruction_rights_open_war_desc:0 "“Arte prohibido tú que se derrame la sangre de otro de tu especie que es mayor. Este derecho sólo pertenece a la más cercana a mí y nadie más. Está prohibido que los de la sangre más débil a levantarse contra sus mayores. Este es mi pacto final “. Así habló Caine.\n\n#emphasis #bold [vassal|E] Privilegios:#!#!\nEl [vassal|E] puede declarar [war|E] sin contar con [lieges|E] [crown_authority|E]\nEl [vassal|E] paga #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! less for [casus_bellis|E] within the [realm|E]\n\n#flavor The [vassal] no tiene que gastar anzuelo [hook] con su señor [lieges] [crown_authority] para ir a la guerra. Esto permite a [vassal] declarar guerras internas [realm|E], reduciendo en coste #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
 destruction_rights_open_war_short:0 "Lib.Guerra"

 progeny_rights:0 "La tercera tradición: La Progenie"
 progeny_rights_none:0 "Sin derechos de progenie"
 progeny_rights_none_short:0 "Ninguno"
 progeny_rights_none_desc:0 "“Solamente puedes crear a otra con el permiso y la bendición de tu mayor. Para crear es la providencia de los más cercanos a mí, porque ellos serán responsables. Romper este, y ambos ti, y tu descendencia será matado “. Así habló Caine. \n\n# El [vassal] no tiene derechos para crear la progenie por su [liege]. Incluso se prohíbe la creación de necrófagos. #!"
 progeny_rights_granted:0 "Derechos de progenie completos"
 progeny_rights_granted_short:0 "Cualquiera"
 progeny_rights_granted_desc:0 "“Solamente puedes crear a otra con el permiso y la bendición de tu mayor. Para crear es la providencia de los más cercanos a mí, porque ellos serán responsables. Romper este, y ambos ti, y tu descendencia será matado “. Así habló Caine.\n\n#  El [vassal] tiene todos los derechos para crear la progenie por su [liege]. Esto incluye tanto vampíros o necrófagos. #!"
 progeny_rights_ghouls:0 "Derechos de creación de ghouls"
 progeny_rights_ghouls_short:0 "Ghouls"
 progeny_rights_ghouls_desc:0 "“Solamente puedes crear a otra con el permiso y la bendición de tu mayor. Para crear es la providencia de los más cercanos a mí, porque ellos serán responsables. Romper este, y ambos ti, y tu descendencia será matado “. Así habló Caine.\n\n# El [vassal] ha sido concedida por sus [liege] los derechos para crear necrófagos, pero no chiquillos vampírica. #!"
 progeny_rights_childer:0 "Derechos de la progenie vampírica"
 progeny_rights_childer_short:0 "vampírica"
 progeny_rights_childer_desc:0 "“Solamente puedes crear a otra con el permiso y la bendición de tu mayor. Para crear es la providencia de los más cercanos a mí, porque ellos serán responsables. Romper este, y ambos ti, y tu descendencia será matado “. Así habló Caine"

 blood_oaths:0 "La cuarta tradición: La Contabilidad"
 blood_oaths_none:0 "No se requieren juramentos de sangre"
 blood_oaths_none_short:0 "Libre"
 blood_oaths_none_desc:0 "“Los que te crean son tu propia sangre, hasta el lanzamiento de tu cargo. Hasta ese momento, sus pecados, su sangre y sus castigos son tuyos “. Así habló Caine.\n\n# El [vassal] no se requiere la prestación de juramento de sangre a su [liege].#!"
 blood_oaths_required:0 "Se requieren juramentos de sangre"
 blood_oaths_required_short:0 "Juramentos"
 blood_oaths_required_desc:0 "“Los que te crean son tu propia sangre, hasta el lanzamiento de tu cargo. Hasta ese momento, sus pecados, su sangre y sus castigos son tuyos “. Así habló Caine.\n\n# El [vassal] debe jurar un juramento de sangre a su [liege] y consumir un poco de sangre de su [liege]. Se trata de un vínculo de sangre menor y un gancho débil. #!"

 domain_revocation_rights:0 "La segunda tradición: El dominio"
 domain_revocation_rights_default:0 "Revocación del dominio"
 domain_revocation_rights_default_short:0 "A discreccion"
 domain_revocation_rights_default_desc:0 "El [liege] podrá revocar un dominio proporcionado la corona leyes lo permiten."
 domain_revocation_rights_protected:0 "Protegido"
 domain_revocation_rights_protected_desc:0 "“Como soy maestra de Nod, tu dominio es tu propia preocupación. Tú eres su amo, y todos se respeten esta o sufrir tu ira. Todo va a presentarse al entrar, y tú les protegerá a su vez. Por la derecha, has permite cazar dentro de los límites de tu dominio, su sangre es tuyo. Aceptar su responsabilidad, dominio de tu ministro, y pagar los demás el mismo respeto te espera “. Así habló Caine .\n\n[vassal|E] Privilege:#!#!\nEl [liege|E] no puede revocar [vassals_possessive|E] [titles|E]\n\n#flavor El [vassal] tiene revocación protegida [titles], evitando que [liege|E] pueda revorcarlos [liege|E] tengo o no una[revoke_title_reason].#!"
 domain_revocation_rights_protected_short:0 "Protegido"

 masquerade_protocol:0 "La sexta tradición: La Mascarada"
 masquerade_protocol_none:0 "Sin Masquerade"
 masquerade_protocol_none_desc:0 "#flavor El [liege] no cumplir la silencio de Sangre en la [vasallo] 's de dominio."
 masquerade_protocol_none_short:0 "Nada"
 masquerade_protocol_lax:0 "Mascarada laxa"
 masquerade_protocol_lax_desc:0 "“Siempre dejarás de revelar tu verdadera naturaleza a los que no de la sangre. Si lo hace, deberá renunciar a tus reclamaciones a mis convenios “. Así habló Caine. \n\n#emphasis #bold El [liege] sólo hace cumplir las violaciónes extremas de silencio de sangre en el dominio [vassal].#!"
 masquerade_protocol_lax_short:0 "Laxa"
 masquerade_protocol_strict:0 "Mascarada estricta"
 masquerade_protocol_strict_desc:0 "“Siempre dejarás de revelar tu verdadera naturaleza a los que no de la sangre. Si lo hace, deberá renunciar a tus reclamaciones a mis convenios “. Así habló Caine.\n\n#emphasis #bold el [liege] impone una interpretación estricta de silencio de sangre en el dominio [vassal].#!"
 masquerade_protocol_strict_short:0 "S.Estricto"

 blood_tithe:0 "Diezmo de sangre"
 blood_tithe_none:0 "No hay Diezmo"
 blood_tithe_none_short:0 "Nada"
 blood_tithe_none_desc:0 "# El [vassal] debe ninguna diezmo de sangre a su [liege]. #!]"
 blood_tithe_required:0 "Diezmo de sangre Kine"
 blood_tithe_required_short:0 "Rebaño"
 blood_tithe_required_desc:0 "# En la demanda, el [vassal] debe suministrar una de las vacas al tribunal de su [liege]. Por lo general, esto significa la muerte de los mortales. #!"
 blood_tithe_vampiric:0 "Diezmo de sangre del vasallo"
 blood_tithe_vampiric_short:0 "Su sangre"
 blood_tithe_vampiric_desc:0 "# En la demanda, el [vassal] debe proporcionar su propia sangre vampírica a su [liege].  Esto aumentará el hambre de los donantes. #!"
 blood_tithe_childer:0 "Diezmo de sangre vampírica"
 blood_tithe_childer_short:0 "Un hijo"
 blood_tithe_childer_desc:0 "# En la demanda, el [vassal] debe proporcionar uno de sus chiquillos a su [liege]. Esto a menudo conduce a la destrucción del chiquillo. #!"

 primogen_rights:0 "Derechos de los primogénitos"
 primogen_rights_none:0 "Sin asiento en el Consejo de Primogénicos"
 primogen_rights_none_desc:0 "El #flavor [vassal] no se concede ningún privilegio fuera de lo común cuando se trata de la primogenitura [council]."
 primogen_rights_none_short:0 "Nada"
 primogen_rights_guaranteed:0 "Asiento en el Consejo Primógeno"
 primogen_rights_guaranteed_desc:0 "#emphasis #bold [vassal|E] Privilegio:#!#!\nEl #high $force_onto_council$#! [interaction|E] puede usar \n\n#flavor El [vassal] vasallo tiene un trato especial y los siguientes [council] privilegios, y esperará un asiento en el consejo [council]. Conceder muchas veces esto, enfadará a los [vassals] poderosos [powerful_vassals] del [realm|E].#!"
 primogen_rights_guaranteed_short:0 "Garantizado"

 

