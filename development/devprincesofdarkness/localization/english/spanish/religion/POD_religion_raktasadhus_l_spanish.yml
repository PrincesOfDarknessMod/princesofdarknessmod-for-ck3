 #Rakta-sadhu-Group Faiths
 raktasadhus:0 "Rakta-sadhus"
 raktasadhus_adj:0 "Rakta-sadhus"
 raktasadhus_adherent:0 "Rakta-sadhu"
 raktasadhus_adherent_plural:0 "Rakta-sadhus"
 raktasadhus_des:0 "Los vampiros de la India practican una forma de hechicería de la sangre llamada Sadhana. A pesar del hecho de que hay Cainitas indios que no practican la Sadhana, el término plural raktasadhus se sigue utilizando a veces para referirse colectivamente a todos los Cainitas indios, en gran parte porque todavía no han formalizado su red de lealtades efímeras en una secta o Corte real. Aunque esas lealtades podrían no haber llegado a existir en absoluto si no fuera por la oposición de los vampiros catayos de la Corte de los Truenos Infinitos del sur de la India y de la Corte del Dragón Escarlata del este de la India."
 
 mayaparisatya:0 "Mayaparisatya"
 mayaparisatya_adj:0 "Mayaparisatya"
 mayaparisatya_adherent:0 "Rakshasa"
 mayaparisatya_adherent_plural:0 "Rakshasa"
 mayaparisatya_desc:0 "El Camino de la Paradoja tiene una gran deuda con ciertos principios del hinduismo. Según éste, los Kindred están encerrados perpetuamente fuera del ciclo ilusorio del universo (maya). Mientras que la mayoría de los seres se reencarnan a través del saṃsāra, un enredo continuo en el ciclo de renacimiento, los Kindred han eludido ese ciclo. Cada individuo tiene su propio propósito, o svadharma, aunque los vampiros, excluidos del ciclo, han perdido el suyo."

 viaparadox:0 "Camino de la paradoja"
 viaparadox_adj:0 "Paradoja"
 viaparadox_adherent:0 "Engañador"
 viaparadox_adherent_plural:0 "Engañadores"
 viaparadox_desc:0 "Los Engañadores creen en un propósito superior para todos, incluidos ellos mismos, otros vampiros y los mortales. Su tarea en la vida es guiar a todos hacia su destino superior. Si es necesario, esto incluye la muerte, especialmente para los Kindred a los que consideran descarriados y alejados de su verdadero destino. Los mortales están más a salvo de estos castigos fatales, ya que están más directamente implicados en el ciclo vital del universo."

 pathofdevaraja:0 "Camino de Devaraja"
 pathofdevaraja_adj:0 "Devaraja"
 pathofdevaraja_adherent:0 "Divino"
 pathofdevaraja_adherent_plural:0 "Divinos"
 pathofdevaraja_desc:0 "Los seguidores de este camino no creen en algún derecho divino para gobernar. En cambio, creen que deben ganarse el derecho a gobernar y elevarse a la divinidad a los ojos de su pueblo. Los Divinos no crean súbditos e inferiores, sino seguidores y adoradores."

 pathofdaitya:0 "Camino de Daitya"
 pathofdaitya_adj:0 "Daitya"
 pathofdaitya_adherent:0 "Encantador de serpientes"
 pathofdaitya_adherent_plural:0 "Encantador de serpientes"
 pathofdaitya_desc:0 "Los Daitya veneran a Shiva, y reclaman el liderazgo de todos los vampiros que adoran a Shiva. Los Daitya ven su deber de casta como una extraña inversión del brahmanismo mortal. Como demonios, deben luchar contra los dioses y esforzarse por derrocar el orden moral del mundo. Como brahmanes, sin embargo, deben esforzarse por mantener a sus compañeros vampiros dentro de sus deberes de casta particulares como asesinos, embaucadores, profanadores de ritos sagrados y todos los demás papeles aborrecibles asignados a los demonios."
 
 tariqeltanaqud:0 "Tariq el-Tanaqud"
 tariqeltanaqud_adj:0 "Tariq el-Tanaqud"
 tariqeltanaqud_adherent:0 "Khadae"
 tariqeltanaqud_adherent_plural:0 "Al-Mukhadieun"
 tariqeltanaqud_desc:0 "Como encrucijada entre la línea principal de la India y la decadente de Occidente, los Ravnos musulmanes están a caballo entre ambos mundos, pero también son rechazados por ambos. Desconocidos y vagabundos, son aborrecidos por los Ashirra".

 samsara:0 "Samsara"
 samsara_adj:0 "Samsara"
 samsara_adherent:0 ""
 samsara_adherent_plural:0 ""
 samsara_desc:0 "El moderno Camino de la Paradoja, también llamado Saṃsāra, es una creación de los neonatos de Ravnos. No es tan rígido como el Mayaparistya, pero tampoco permite la crueldad y el hedonismo gratuitos del Camino Occidental. Su Ética es la misma que la de la Mayaparistya, pero la Jerarquía de Pecados ha sido modificada para permitir la interacción con los vampiros que no siguen la senda."
