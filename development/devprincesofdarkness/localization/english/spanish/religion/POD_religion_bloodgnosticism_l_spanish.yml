 viacain:0 "Herejía cainita"
 viacain_adj:0 "Cainita"
 viacain_adherent:0 "Cainita"
 viacain_adherent_plural:0 "Cainitas"
 viacain_desc:0 "La herejía cainita es una creencia herética que practican principalmente los cainitas cristianos, sobre todo, pero no exclusivamente, los vampiros Lasombra. Está muy impregnada de gnosticismo y emplea a un rebaño de sacerdotes y clérigos humanos. Históricamente, la Herejía surgió de varios cultos de sangre en los que los vampiros eran adorados como dioses. Los vampiros, debido a sus cuerpos incorruptibles, su independencia del mundo material y el poder que otorgan sus disciplinas, eran considerados por algunos gnósticos como criaturas de espiritualidad superior y eran buscados para recibir enseñanzas a cambio de vitae."
 
