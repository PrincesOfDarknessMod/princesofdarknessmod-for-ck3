 blackmagdalene:0 "Church of the Magdalena la negra"
 blackmagdalene_adj:0 "Magdalena la negra"
 blackmagdalene_adherent:0 "Magdalena la negra"
 blackmagdalene_adherent_plural:0 "Magdalena la negras"
 blackmagdalene_desc:0 "Se desplazan por toda Europa desde su base en Marsella para seducir y corromper a los fieles. Utilizan la misma doctrina que la Herejía Cainita, incluyendo la Comunión de Sangre. Identifican a Santa María Magdalena con Isis y la Sofía gnóstica. Los conventos magdalenitas a menudo sirven como casas de "prostitución en el templo", recordando los antiguos cultos de fertilidad del Levante, y ocultan amargos y sangrientos rituales de castración y canibalismo de los misterios más oscuros. Cualquier sacerdote lujurioso sabe dónde pueden encontrar saciedad sus pensamientos más escabrosos, y la gente común ha empezado a identificar a Santa María Magdalena con la innominada "mujer tomada en adulterio" gracias a los excesos del culto. Las "representaciones de la pasión", casi pornográficas, que realizan los magdalenistas el 22 de julio, fiesta de la Magdalena, han sido denunciadas por los sacerdotes de toda Francia. Los Seguidores de Set envían deliberadamente a sus miembros más descarados y menos sutiles a iniciar sectas magdalenistas".
