 swarmofsamael_desc:0 "Controlado por los Baali, el Enjambre sostiene que los Ialdabaoth son cabezas gemelas de la misma Bestia. El Enjambre hace hincapié en las tradiciones escatológicas del Euagetaematikon más que en la Comunión de Sangre o en los elementos cristoides, pero revela rápidamente los misterios más oscuros del infernalismo a los incautos. La Curia Carmesí no tiene reparos en denunciar los cultos heréticos de los Baali".
