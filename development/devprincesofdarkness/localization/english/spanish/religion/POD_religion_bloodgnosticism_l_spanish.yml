 eschatologists_desc:0 "Una facción del clan Graverobber cree devotamente en la Herejía Cainita, aunque con un énfasis más cristológico que la secta principal. Los escatólogos creen que son la prole tanto de Caine como de Cristo, y que ofrecer su vitae a los mortales es un sacramento en sí mismo.  Los escatólogos recorren las carreteras secundarias de Europa y celebran "avivamientos" masivos en los que se producen asombrosos milagros de sangre y Disciplina. La mayor de estas asambleas tiene lugar el 17 de diciembre, la Fiesta de San Lázaro."
