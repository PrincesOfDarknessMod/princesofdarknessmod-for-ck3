 viapura:0 "Vía Pura"
 viapura_adj:0 "Katharoi"
 viapura_adherent:0 "Kathar"
 viapura_adherent_plural:0 "Katharoi"
 viapura_desc:0 "En una época de creciente resistencia a la autoridad clerical, han elegido el dualismo gnóstico como la espada mejor forjada para sus objetivos. Los zelotes construyen religiones con un cálculo casi cínico, basándose en el neoplatonismo, las Escrituras apócrifas y otras fuentes oscuras. Se llaman a sí mismos Katharoi, y apoyan a los mortales cátaros (la misma palabra, hablada en francés y en latín) no como mecenas, sino como guías espirituales."
 
 holy_order_the_pure:0 "La Pura"

 calomenaschosen:0 "Los elegidos de Calomena"
 calomenaschosen_adj:0 "Elegidos"
 calomenaschosen_adherent:0 "Elegidos"
 calomenaschosen_adherent_plural:0 "Elegidos"
 calomenaschosen_desc:0 "Los Elegidos fueron fundados por el Caitiff Stanislav. Fundado en los Balcanes occidentales, este culto parece derivar libremente de la herejía bogomil. Los Elegidos creen que Caine era un hijo del diablo y que sus hijos son las manifestaciones más viles de la tierra. Se cree que Calomena, la hermana gemela de Caine, se está preparando para regresar y destruir a los viles cainitas, limpiando el mundo para el glorioso Espíritu de Dios. Los Clanless son sus instrumentos elegidos. Organizan círculos dirigidos por vampiros con miembros necrófagos y mortales. Stanislav fue martirizado en 1204 durante el final del Sueño de Miguel y la Cruzada Amarga, pero su culto avanza hacia la Gehenna".
