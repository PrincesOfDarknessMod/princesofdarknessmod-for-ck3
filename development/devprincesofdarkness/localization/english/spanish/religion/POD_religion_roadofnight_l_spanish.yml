 #Redeemer-Group Faiths
 vianoctis:0 "Vía Noctis"
 vianoctis_adj:0 "Noctis"
 vianoctis_adherent:0 "Redentor"
 vianoctis_adherent_plural:0 "Redentores"
 vianoctis_desc:0 "Los redentores sienten el peso de la maldición de Caine y su propia condena, incluso más que los que siguen la Vía Caeli. También al igual que los noddistas, los redentores buscan la redención y el perdón, y para ganárselo requieren sufrimiento y purificación. Sin embargo, en lugar de las formas bastante benignas de los noddistas, los redentores recorren activamente el mundo de los hombres, castigando y matando a los pecadores mortales."

 tariqallail:0 "Tariq al-Lail"
 tariqallail_adj:0 "Asdiqa al-Lail"
 tariqallail_adherent:0 "Inspirado"
 tariqallail_adherent_plural:0 "Inspirado"
 tariqallail_desc:0 "Los amigos de la noche entre la parentela islámica. Bastante raros para empezar, el cisma entre la parte cristiana y musulmana del clan ha convertido a ambos grupos en parias."

 pathoftheheavenlyabode:0 "Camino de la Morada Celestial"
 pathoftheheavenlyabode_adj:0 "Celestial"
 pathoftheheavenlyabode_adherent:0 "Vengador"
 pathoftheheavenlyabode_adherent_plural:0 "Vengadores"
 pathoftheheavenlyabode_desc:0 "Los seguidores de esta senda creen que, para salvar verdaderamente un alma, el cuerpo mortal debe ser destruido tan pronto como el alma haya encontrado la redención, para evitar una mayor corrupción."

 holy_order_children_of_the_night:0 "Hijos de la noche"
 holy_order_fallen_angels:0 "Ángeles caídos"
