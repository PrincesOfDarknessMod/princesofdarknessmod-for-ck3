 #Scholar-Group Faiths
 viaossium:0 "Vía Ossium"
 viaossium_adj:0 "Ossium"
 viaossium_adherent:0 "Erudito"
 viaossium_adherent_plural:0 "Eruditos"
 viaossium_desc:0 "Los seguidores de Camino de Huesos valoran el conocimiento por encima de todo. Mediante el estudio intenso de lo desconocido, los Eruditos mantienen a raya a sus Bestias. Llegarán a casi cualquier extremo para aprender algo nuevo, pero no se sacrificarán innecesariamente por una causa. Al fin y al cabo, su propio conocimiento acumulado es demasiado importante como para dejar que otros lo manejen. Al mismo tiempo, los eruditos no temen a la muerte; les fascina".
 
 tariqelatham:0 "Tariq el-A'Tham"
 tariqelatham_adj:0 "A'Tham"
 tariqelatham_adherent:0 "Erudito"
 tariqelatham_adherent_plural:0 "Erudito"
 tariqelatham_desc:0 "Principalmente una rama de la principal Via Ossium en el mundo musulmán, los Tariq el-A'Tham se benefician de los conocimientos más antiguos que se mantienen vivos en esta parte del mundo. Sin embargo, sus prácticas, a veces insensibles, pueden ponerlos en desacuerdo con los celosos Ashirra o los vigilantes Hijos de Haqim."
 
 followersoflazarus:0 "Seguidores de Lázaro"
 followersoflazarus_adj:0 "Lazareno"
 followersoflazarus_adherent:0 "Infitiore"
 followersoflazarus_adherent_plural:0 "Infitiores"
 followersoflazarus_desc:0 "Los Seguidores de Lázaro, también llamados Infitiores, eran los capadocios que por una u otra razón no respondieron a la llamada que dio lugar a la Fiesta de la Locura y evitaron así el sacrificio del clan. Al no estar seguros de que se les hubiera perdonado y al sentirse traicionados por su fundador, se divorciaron del cuerpo principal del clan Capadocio. Lázaro era considerado informalmente el líder de los Infitiores".
 
 pathofthewheel:0 "Camino de la Rueda"
 pathofthewheel_adj:0 "Rueda"
 pathofthewheel_adherent:0 "Científico"
 pathofthewheel_adj:0 "Científico"
 pathofthewheel_adherent_plural:0 "Científicos"
 pathofthewheel_desc:0 "Los miembros de esta senda creen que los Vampiros están atrapados en el exterior del ciclo y deben seguir adelante. Buscan cualquier medio científico para empujar a todos los Cainitas de vuelta al ciclo de la vida."
 
 roadoftheabyss:0 "Camino del Abismo"
 roadoftheabyss_adherent:0 "Místico"
 roadoftheabyss_adj:0 "Abisal"
 roadoftheabyss_adj:0 "Místico"
 roadoftheabyss_adherent_plural:0 "Místicos"
 roadoftheabyss_desc:0 "Los místicos están inmersos en el estudio imperecedero de una fuerza que trasciende y, en última instancia, se opone a toda luz y vida. La humanidad y conceptos como el bien o el mal tienen poca utilidad para aquellos que estudian los misterios de la oscuridad exterior."

