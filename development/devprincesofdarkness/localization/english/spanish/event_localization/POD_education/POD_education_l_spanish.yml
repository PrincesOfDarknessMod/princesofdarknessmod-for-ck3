l_spanish:

 POD_education_events.1.t:0 "Una educación"
 POD_education_events.1.desc:0 "Tu nuevo hijo ha dado [victim.GetHerHis] sus primeros pasos en la noche. Ahora tiene la experiencia suficiente para entender cómo alimentarse, y pronto será el momento de comenzar una educación formal, que será muy importante para el futuro de [victim.GetHerHis], pero también para vuestra relación. ¿Cuál será su enfoque?"
 POD_education_events.1.option.a:0 "Enseñar a [victim.GetFirstName] [victim.GetHerHis] el lugar"
 POD_education_events.1.option.b:0 "Mantener a [victim.GetHerHim] cerca, pero con algunas libertades"
 POD_education_events.1.option.c:0 "[víctima.GetFirstName] se dará cuenta por sí mismo [víctima.GetHerHis]"
 POD_education_events.1.option.obedience:0 "Esta educación puede proporcionar niños obedientes, aunque no inspirados"
 POD_education_events.1.option.lenient:0 "Una educación equilibrada"
 POD_education_events.1.option.free:0 "Con esta educación, [victim.GetFirstName] es más probable que salga bien, pero también más libre"
 POD_education_events.1.option.d:0 "Aplica tus magistrales habilidades de enseñanza"
 POD_education_events.1.option.durga:0 "Como Durga Syn, puedes asegurarte de que tu childe se convierta en algo grande para los primeros pasos de [victim.GetHerHis] con esta opción única" 
 POD_education_events.2.t:0 "Una educación : el palo"
 POD_education_events.2.desc:0 "Los jóvenes de hoy en día... Apenas se ha empezado a enseñar a lo tonto que se oyen quejas sobre la 'dureza' e 'injusticia' con la que se hacen las cosas. Como si fueran a aprender de otra manera! En cualquier caso, puedes reconocer las señales de que tu hijo está a punto de romperse bajo tu presión si no cedes. Podrías, obviamente, cambiar tu enfoque, pero "cambiar" no es algo que los vampiros hagan fácilmente".
 POD_education_events.2.option.a:0 "Los viejos métodos funcionan mejor"
 POD_education_events.2.option.b:0 "Voy a ceder, por ahora"
 POD_education_events.3.t:0 "Una educación: lazos humanos"
 POD_education_events.3.desc:0 "Tu hijo aún tiene vínculos humanos, amigos, familia y demás. Como para la mayoría de los vampiros jóvenes, es muy difícil para [victim.GetHerHim] dejarlos ir. Obviamente, tú lo sabes mejor, y es mejor mantener estos sentimientos en secreto, ya que la Mascarada está en peligro por las acciones precipitadas con los mortales. Y a menudo haces acciones precipitadas con tus seres queridos.\N¿Tal vez sea hora de que tu childe aprenda a dejar ir el pasado?"
 POD_education_events.3.option.a:0 "Cubriré a [víctima.GetFirstName]. deja que los jóvenes tengan sus sueños"
 POD_education_events.3.option.b:0 "Childe, tenemos que hablar..."
 POD_education_events.4.t:0 "Una educación : Libertad"
 POD_education_events.4.desc:0 "Últimamente, no has podido ocuparte mucho de tu hijo. Esperabas que esta nueva libertad se tradujera en algunas ideas interesantes que [victim.GetFirstName] pudiera descubrir por sí mismo, pero... no del todo.\NTodavía resentido contigo por haberte convertido en vampiro, este revoltoso neonato ha empezado a dudar públicamente de tu autoridad, y a no responder a tus raras convocatorias. Esto podría escalar rápidamente si no detienes este comportamiento ahora".
 POD_education_events.4.option.a:0 "Childe, tenemos que hablar..."
 POD_education_events.4.option.b:0 "Se te pasará, probablemente"
 POD_education_events.100.t:0 "Una educación: asuntos de fe"
 POD_education_events.100.desc:0 "Hasta ahora, tu hijo ha seguido tu fe sobre todo porque tú lo has dicho. Sin embargo, es obvio que [victim.GetSheHe] está lejos de comprender el funcionamiento interno de la Bestia y cómo tratarla. Tendrá que tomarse un tiempo para iniciar esta parte de la enseñanza, o contratar a algunos doctos practicantes de la Vía para que ayuden a su progenie".
 POD_education_events.100.option.a:0 "Lo primero que hay que saber..."
 POD_education_events.100.option.b:0 "Escucha bien a tus maestros. No eran baratos".
 POD_education_events.100.option.c:0 "Puedo contarte mucho más sobre nuestro Camino"
 POD_education_events.100.dionysius:0 "Como Dionysius, puedes usar esta opción para asegurarte de que tu childe permanecerá en tu camino y será bien enseñado sobre él"
 POD_education_events.101.t:0 "Una educación : tentado por la humanidad"
 POD_education_events.101.desc:0 "No es una gran sorpresa que, a pesar de tus enseñanzas, tu childe haya sido tentado por la Vía Humanitatis. Al fin y al cabo, es el camino más fácil de seguir para un neonato, y tratar de seguir de cerca los pasos de los mortales.\NPiensas hacer una gran demostración de fe, no interfiriendo con la humanidad durante los próximos meses, como prueba para tu hij@ de la verdad en el asunto. O puedes dejarlo pasar".
 POD_education_events.101.option.a:0 "Estamos castigados durante los próximos meses"
 POD_education_events.101.option.b:0 "Los jóvenes serán jóvenes"
 POD_education_events.102.t:0 "Una educación: tentada por la rebeldía"
 POD_education_events.102.desc:0 "Informes inquietantes, ya que tus espías han rastreado la reciente desaparición de tu childe hasta un grupo de rebeldes en los límites de tu reino. Estos llamados 'Furores' son una plaga para cualquier vampiro que se respete a sí mismo, queriendo abolir las bellas tradiciones de la sangre en un vano intento de 'libertad'.\N¡Hay que mostrarle rápidamente a tu childe el error de [victim.GetHerHis], o [victim.GetSheHe] incluso podría empezar a creer en estas idioteces!"
 POD_education_events.102.option.a:0 "¡Vete a tu habitación y no salgas de ella hasta que yo lo diga!"
 POD_education_events.102.option.b:0 "Pasará, como todas las cosas"
 POD_education_events.300.t:0 "Una educación: el final"
 POD_education_events.300.desc:0 "Has hecho lo que has podido. Tu hijo ha aprendido las formas de tu condición, los métodos a utilizar para controlar a la Bestia, e incluso cómo acercarse a los clanes y sus sutilezas. Tal vez sea suficiente. O quizás hayas creado el enemigo más peligroso al que te enfrentarás jamás. El tiempo lo dirá, como siempre lo hace".
 POD_education_events.300.option.a:0 "Ya no eres un novato indefenso. Pero sigues siendo mi hijo".
 POD_education_events.5.t:0 "Una educación : Childe fácil"
 POD_education_events.5.desc:0 "Hasta ahora, tu childe se ha tomado bastante bien la nueva condición de [victim.GetHerHis]. [victim.GetFirstName] no hace aspavientos, [victim.GetSheHe] escucha tus órdenes, y es en general un estudiante diligente.\NPuede que no dure, pero ya es mejor que la mayoría de los niños. Así que disfrútalo mientras puedas".
 POD_education_events.5.option.a:0 "Estoy complacido contigo, chiquillo"
 POD_education_events.5.option.b:0 "Causarás una buena impresión en mi corte"
 POD_education_events.6.t:0 "Una educación : Diplomático Childe"
 POD_education_events.6.desc:0 "Desde la introducción de [victim.GetHerHis] en la noche, [victim.GetFirstname] ha mostrado un gran interés en la etiqueta de la corte. Siempre tratando de aprender más sobre los clanes y las diversas políticas de su raza, [victim.GetSheHe] ya es un activo valioso en tu arsenal diplomático.\NSin embargo, sabes que los novatos son inconstantes, y este interés podría no durar. Por lo tanto, estás considerando sacar provecho de esto tan pronto como sea posible".
 POD_education_events.6.option.a:0 "Lo estás haciendo bien hasta ahora, chaval"
 POD_education_events.6.option.b:0 "Acompañarás a mis diplomáticos durante las próximas semanas"
 POD_education_events.7.t:0 "Una educación : Childe obediente"
 POD_education_events.7.desc:0 "Has vuelto a demostrar tus habilidades superiores con este childe específico. La envidia de todos los posibles sire, tu progenie está ayudando obedientemente en todo lo que puede [victim.GetSheHe], todo ello mientras da las gracias al gran patrón que trajo a [victim.GetHerHim] a la noche.\NPodrías concentrar tus próximos esfuerzos en hacer de [victim.GetHerHim] un aliado útil a largo plazo, o simplemente un asistente fiable por ahora."
 POD_education_events.7.option.a:0 "Hablemos del futuro, chaval"
 POD_education_events.7.option.b:0 "Vuelve al trabajo"
 POD_education_events.8.t:0 "Una educación: animada childe"
 POD_education_events.8.desc:0 "Tu nuevo niño se ha adaptado a la noche como un encanto. Con una ávida curiosidad, [victim.GetSheHe] ha aprendido rápidamente por su cuenta los conocimientos básicos necesarios para sobrevivir en el mundo cainita. Te sientes agradecido, y también aliviado de que esto no parezca haberle dado a [víctima.GetHerHim] ideas de independencia... todavía.\NEl siguiente paso es saber si dejarás que [víctima.GetHerHim] siga por este camino, o intentarás trabajar más estrechamente con [víctima.GetHerHim] para tu beneficio."
 POD_education_events.8.option.a:0 "¡Ah, volver a ser joven!"
 POD_education_events.8.option.b:0 "Trabajemos juntos, childe"
 POD_education_events.9.t:0 "Una educación : Childe torpe"
 POD_education_events.9.desc:0 "Tu childe lo está haciendo bastante bien hasta ahora, excepto en un aspecto: la etiqueta de la corte. Por alguna razón, [victim.GetSheHe] no puede entender el protocolo adecuado que debe observarse en el tribunal. No es tan difícil, en realidad. Si quiere salvar las habilidades diplomáticas de este, tendrá que enseñar a [victim.GetHerHim] la política de la corte con el ejemplo. Lo cual no es lo más glorioso".
 POD_education_events.9.option.a:0 "Quédate aquí y observa. Y no digas nada".
 POD_education_events.9.option.b:0 "...Bueno, este tendrá otro uso, espero"
 POD_education_events.103.t:0 "Una educación: tentada por el oro"
 POD_education_events.103.desc:0 "Su nuevo childe ha demostrado ser bastante extravagante en [victim.GetHerHis] la adaptación al vampirismo. [victim.GetSheHe] cree que la nueva condición de [victim.GetHerHis] se utiliza mejor para... ganar dinero. Mientras suspiras, te consuelas pensando que al menos es un pasatiempo mejor que intentar asesinarte. Pero igual quieres sacar a [víctima.GetHerHim] de esta 'fase'".
 POD_education_events.103.option.a:0 "Aquí tienes tu maldito oro. Haz lo que quieras".
 POD_education_events.103.option.b:0 "...¿Qué se les ocurrirá ahora a esos malditos volantones?"
 POD_education_events.104.t:0 "Una educación : Fiel Childe"
 POD_education_events.104.desc:0 "Tu childe ha adoptado fácilmente tus propios principios como fe [victim.GetHerHis]. Estás satisfecho por los progresos mostrados hasta ahora y no esperas más que una mejora continua. Como profesor de éxito, también has alcanzado una comprensión más profunda gracias a esta experiencia compartida."
 POD_education_events.104.option.a:0 "Como debe ser"
 POD_education_events.105.t:0 "Una educación: tentada por el hedonismo"
 POD_education_events.105.desc:0 "Tu hijo se ha tomado bien la nueva condición de [victim.GetHerHis]. Quizás demasiado bien... [victim.GetFirstName] pasa el tiempo de [victim.GetHerHis] de fiesta con los mortales, o incluso con otros vampiros, de forma bastante depravada.\NObviamente, preferirías que [victim.GetHerHim] hiciera cosas útiles con la inmortalidad de [victim.GetHerHis], pero convencer a [victim.GetHerHim] podría ser una tarea ardua en este momento."
 POD_education_events.105.option.a:0 "Baja a este mortal childe, tenemos que hablar"
 POD_education_events.105.option.b:0 "Ni siquiera me importa en este momento..."
 POD_education_events.10.t:0 "Una educación : Steward Childe"
 POD_education_events.10.desc:0 "[victim.GetFirstName] ha sido emprendedor desde el abrazo de [victim.GetHerHis], [victim.GetSheHe] ha delineado varios proyectos para agregar regiones atípicas a su influencia y nuevas personas a las que sobornar para asegurarse de permanecer oculto.\nConsideras permitir al neonato continuar en esta dirección, o usar el conocimiento de [victim.GetHerHis] sobre tales asuntos ahora mismo."
 POD_education_events.10.desc:0 "[victim.GetFirstName] ha sido emprendedor desde el abrazo de [victim.GetHerHis], [victim.GetSheHe] ha esbozado varios proyectos para añadir regiones atípicas a su influencia, y nuevas personas a las que sobornar para asegurarse de que permanezcan ocultas.
 POD_education_events.10.option.a:0 "Tienes un talento aquí, childe"
 POD_education_events.10.option.b:0 "Interesante, cuéntame más sobre tus planes"
 POD_education_events.11.t:0 "Una educación : Childe despistada"
 POD_education_events.11.desc:0 "A tu progenie le cuesta entender que, como vampiro, las reglas son diferentes a las de la vida mortal. Los hábitos de [víctima.GetHerHis] como ser vivo están obstaculizando a [víctima.GetHerHim], y la administración de la red de informantes y agentes parece estar muy por encima de la comprensión de [víctima.GetHerHis] ahora mismo.\NPodrías organizar una "misión de práctica" para enseñar a [víctima.GetHerHim] las cuerdas, o simplemente renunciar a esta parte del proceso de entrenamiento."
 POD_education_events.11.option.a:0 "Sígueme y observa, niño"
 POD_education_events.11.option.b:0 "Los libros de registro están fuera de tu alcance"
 POD_education_events.106.t:0 "Una Educación : Tentada por la Corona"
 POD_education_events.106.desc:0 "Tu nueva progenie está fascinada por la estructura de poder de los vampiros, y [victim.GetSheHe] quiere saberlo todo sobre quién gobierna qué, y cómo alcanzaste tu actual posición como gobernante de la noche.\NAunque es un halago, esto está acercando rápidamente a [victim.GetHerHim] a la Via Regalis, algo que quizá no apruebes."
 POD_education_events.106.option.a:0 "Centrémonos en lo espiritual por un rato, childe"
 POD_education_events.106.option.b:0 "¡Por qué sí puedo hablar de mí mismo!"
 POD_education_events.12.t:0 "Una educación : Childe de Schemer"
 POD_education_events.12.desc:0 "A tu nuevo childe le encanta el ambiente de capa y espada de la política vampírica. [victim.GetSheHe] ya ha sido más listo que otros neonatos y ha demostrado un gran talento para la intriga. Podrías empujar a [victim.GetHerHim] a perfeccionar estas habilidades por su cuenta, o podrías utilizar la ayuda para algunos planes urgentes que estás planeando actualmente..."
 POD_education_events.12.option.a:0 "Lo estás haciendo muy bien childe. Sólo toma para no hacerlo demasiado grande..."
 POD_education_events.12.option.b:0 "¿Qué te parecen estos planes?"
 POD_education_events.13.t:0 "Una educación : Outwitted Childe"
 POD_education_events.13.desc:0 "Su progenie tiene problemas para adaptarse a esta nueva vida. [victim.GetFirstName] se toma la mayor parte de lo que se dice al pie de la letra, y no tiene en cuenta que, bueno, todo el mundo miente en la política vampírica. Sus mejores esfuerzos para enseñar a [victim.GetHerHim] han sido, hasta ahora, infructuosos. Y está empezando a ponerte de los nervios".
 POD_education_events.13.option.a:0 "Esta gente no son tus amigos. No tenemos amigos".
 POD_education_events.13.option.b:0 "Bueno, este no será amenazante para mí al menos"
 POD_education_events.107.t:0 "Una educación: tentado por el puño enguantado"
 POD_education_events.107.desc:0 "Su hijo ha mostrado un gran interés por las cuestiones de gobierno. Un interés que ha hecho que [victim.GetHerHim], hasta ahora, concluya que la fuerza hace el bien. Aunque no estás necesariamente de acuerdo, debes admitir que ya has recogido algunas ideas interesantes por la forma de hacer las cosas de [victim.GetHerHis]. ¿Quizás animar a [víctima.GetHerHim] a continuar le aportaría más experiencia?"
 POD_education_events.107.option.a:0 "El poder es algo más que la fuerza bruta, niña"
 POD_education_events.107.option.b:0 "Tal vez podamos aprender unos de otros, después de todo"
 POD_education_events.14.t:0 "Una educación : Childe Amistoso"
 POD_education_events.14.desc:0 "Tu progenie se ha adaptado bastante bien a la no-vida hasta ahora. Debes admitir que sientes una conexión aún más fuerte con [victim.GetHerHim] que la que habías previsto antes del abrazo. Quizá esta vez, por una vez, tus largas noches de soledad se llenen de una nueva compañía."
 POD_education_events.14.option.a:0 "Hablemos un poco más, niña"
 POD_education_events.108.t:0 "Una educación: tentada por los cielos"
 POD_education_events.108.desc:0 "Tu childe siempre necesitó algo en lo que creer durante los días mortales de [victim.GetHerHis]. Por ello, no te sorprende demasiado que [victim.GetSheHe] se lanzara a la Via Caeli como camino de predilección de [victim.GetHerHis]. Sin embargo, lo que no esperabas es el gran fervor que [victim.GetSheHe] ha mostrado hasta ahora. Hoy en día no te conmueven muchas cosas, pero quizás una muestra de pura devoción pueda ser una de esas pocas cosas..."
 POD_education_events.108.option.a:0 "Soy lo que soy"
 POD_education_events.108.option.b:0 "Eres una visión inspiradora, niña"
 POD_education_events.15.t:0 "Una educación : Martial Childe"
 POD_education_events.15.desc:0 "Las guerras de los vampiros son muy diferentes a las de los mortales. Son relativamente secretas y utilizan un número reducido de tropas de élite, por lo que requieren un conjunto de habilidades flexibles. Por suerte, tu hijo parece tener una comprensión natural de los retos que este estilo de guerra conlleva.\N¿Cómo vas a animar a [victim.GetHerHim] a utilizar estos éxitos iniciales?"
 POD_education_events.15.option.a:0 "Continúa por tu cuenta, childe"
 POD_education_events.15.option.b:0 "Deberías centrar tu experiencia en un área, childe"
 POD_education_events.16.t:0 "Una educación : Childe desdentado"
 POD_education_events.16.desc:0 "De todas las cosas, parece que es con la escala del conflicto vampírico con lo que tu childe está teniendo problemas. Obviamente es muy diferente a la guerra mortal, con su pequeño número de tropas de élite, estas batallas pueden ser difíciles de evaluar para un comandante no preparado. Podrías olvidar el tema, ya que no todos los vampiros están destinados a ver un campo de batalla de todos modos, u organizar un "ejemplo en vivo" con algunas tropas mortales locales para que tu childe aprenda un par de cosas."
 POD_education_events.16.option.a:0 "Concéntrate en tus otros estudios, childe"
 POD_education_events.16.option.b:0 "Vamos a jugar una partida de guerra con los mortales, childe"
 POD_education_events.17.t:0 "Una educación : Childe no espectacular"
 POD_education_events.17.desc:0 "Hasta ahora, tu nueva progenie lo ha hecho bastante bien. Sin embargo, nada espectacular, lo que te ha hecho pensar que [victim.GetSheHe] podría ser útil de otras maneras. ¿Tal vez como ejemplo? La mayoría de los cainitas hacen gran alarde de la brillantez de su progenie, pero tú podrías invertir esta costumbre. Aplasta la mente de tu childe, sin más razón que la pura crueldad, y serías temido durante bastante tiempo después..."
 POD_education_events.17.option.a:0 "No dolerá... mucho tiempo"
 POD_education_events.17.option.b:0 "Este todavía puede ser útil"
 POD_education_events.109.t:0 "Una educación: tentada por la crueldad"
 POD_education_events.109.desc:0 "Tu hijo parece haber abrazado [victim.GetHerHis] su nueva condición de monstruo de la noche con demasiadas ganas. Has oído historias de "fiestas" y "experimentos" perturbadores en los que [victim.GetSheHe] ha participado, o incluso ha organizado. Lamentablemente, el pequeño desgraciado probablemente no aceptará fácilmente tu autoridad en este asunto..."
 POD_education_events.109.option.a:0 "¡Detendrás esta locura de inmediato!"
 POD_education_events.109.option.b:0 "Mientras no me afecte..."
 POD_education_events.18.t:0 "Una educación : Childe estudioso"
 POD_education_events.18.desc:0 "A tu childe le fascina la vasta historia de la raza cainita. Los clanes, los mitos, los rumores... todo lo que [victim.GetSheHe] puede aprender de verdad. [victim.GetSheHe] podría tener conocimiento de algunos asuntos en los que no pensabas desde hace tiempo. ¿Tal vez podrían trabajar juntos?"
 POD_education_events.18.option.a:0 "Tienes mi bendición para continuar, childe"
 POD_education_events.18.option.b:0 "¿Qué te parece esta historia, childe?"
 POD_education_events.19.t:0 "Una educación : Childe lenta"
 POD_education_events.19.desc:0 "Tu progenie tiene problemas con la gran cantidad de información nueva que tiene que aprender [victim.GetSheHe]. Los clanes, la historia de la raza cainita, los mitos... parece que es demasiado. Si no haces algo pronto, es probable que tu hijo se rinda, lo que podría ser un obstáculo para la iniciación de [victim.GetHerHis] en la noche".
 POD_education_events.19.option.a:0 "...Este servirá para otro propósito"
 POD_education_events.19.option.b:0 "Tomemos un tiempo para estudiar juntos, childe"
 POD_education_events.20.t:0 "Una educación: el maestro perfecto"
 POD_education_events.20.desc:0 "Como el anciano más respetado de los Ravnos occidentales, has enseñado a muchos jóvenes en tu época, Durga Syn. Incluso disfrutas haciéndolo, apareciendo de la nada para traer a los confundidos neonatos tu, a menudo críptica, sabiduría.\NComo tal, es bastante fácil aplicar tus grandes talentos a tu propia progenie. Un suave pinchazo aquí, un sutil empujón allá y éste se convertirá exactamente en lo que quieres".
 POD_education_events.20.option.a:0 "Escucha a tu Bestia, luego lucha contra ella"
 POD_education_events.20.option.b:0 "La rosa es para las rosas, el azul es para los señores" 
 POD_education_events.20.option.c:0 "Para abrir tu propio misterio, debes buscar tu propia llave"
 POD_education_events.110.t:0 "Una educación : Falta de ambición"
 POD_education_events.110.desc:0 "Últimamente, su hijo se está acercando a la vida de [victim.GetHerHis] de una manera más cuidadosa que antes. Satisfecho por permanecer en las sombras, [victim.GetSheHe] parece contentarse con dejar las responsabilidades y los peligros a los demás, aunque [victim.GetSheHe] a menudo proporciona la experiencia de [victim.GetHerHis] cuando es necesario. Aunque le tranquiliza tener un hijo aparentemente de confianza, es posible que tenga otros planes para el futuro".
 POD_education_events.110.option.a:0 "¡Crece la espina dorsal, childe!"
 POD_education_events.110.option.b:0 "Un rival potencial menos... probablemente"
 POD_education_events.111.t:0 "Una educación: profesor perfecto"
 POD_education_events.111.desc:0 "Pocos cainitas pueden presumir de haber dado forma a un camino como usted lo hizo con el Camino de la Humanidad, señor Dionisio. Es obvio que te dio una visión aguda de estos asuntos, y has estado aprendiendo y debatiendo sobre ellos durante mucho tiempo.\NComo tal, hay muy pocas personas más cualificadas para enseñar sobre esto que tú. El novato que tiene a su cargo ahora mismo es un auténtico privilegiado".
 POD_education_events.111.option.a:0 "Aprenderé mucho debatiendo con una mente fresca"
 POD_education_events.111.option.b:0 "Tengo mucho que enseñarte"
 POD_education_events.200.t:0 "Una educación : La presentación"
 POD_education_events.200.desc:0 "Es hora de que tu hijo sea presentado formalmente a tu corte... ¿o no? Esta parte tradicional de la sociedad cainita está llena de oportunidades y peligros, ya que tus cortesanos y vasallos seguramente buscarán cualquier debilidad que valga la pena explotar en tu nuevo protegido."
 POD_education_events.200.option.a:0 "Compórtate ahí dentro"
 POD_education_events.200.option.b:0 "No es necesario que sepan de ti"
 POD_education_events.201.t:0 "Una educación : Vasallo molesto"
 POD_education_events.201.desc:0 "Durante la presentación de tu hijo, uno de tus vasallos aprovechó todas las oportunidades disponibles para fastidiar a tu progenie. No es lo suficientemente bueno, no es digno del Abrazo, es una pérdida de tiempo... Puedes ver que tu hija apenas está controlando el temperamento de [víctima.GetHerHis] en este momento.\NEs posible que quieras intervenir si no quieres que estos dos se odien."
 POD_education_events.201.option.a:0 "Mientras no me odien..."
 POD_education_events.201.option.b:0 "Sólo deja de hablar"
 POD_education_events.202.t:0 "Una educación : Vasallo amistoso"
 POD_education_events.202.desc:0 "Uno de tus vasallos se ha fijado en tu hijo durante la presentación. Genuino o con mentalidad política, realmente no importa mientras mantenga la paz en tu reino. Te unes a ellos mientras hablan animadamente entre ellos".
 POD_education_events.202.option.a:0 "Me alegro de que se lleven bien"
 POD_education_events.202.option.b:0 "¡Pues sí! Elijo muy bien a mi hijo"
 POD_education_events.203.t:0 "Una educación : Vasallo intrigante"
 POD_education_events.203.desc:0 "Tu childe cometió un pequeño error durante la presentación. Sorprendentemente, uno de tus vasallos ayudó a encubrirlo lo suficientemente rápido como para no tener repercusiones.\NEntiendes por qué cuando esta serpiente intrigante se acerca a ti, diciéndote que le debes a [victim.GetHerHim] ahora..."
 POD_education_events.203.option.a:0 "Has ganado esta ronda"
 POD_education_events.203.option.b:0 "¡No te debo nada!"
 POD_education_events.204.t:0 "Una educación : Vasallo infatuado"
 POD_education_events.204.desc:0 "Uno de tus vasallos ha quedado prendado de la impecable presentación de tu hijo y ahora pide un poco de... tiempo en privado con tu progenie. Obviamente, sería una forma fácil de conseguir que [victim.GetHerHim] esté en deuda con usted, pero su progenie podría no apreciar ser utilizada como una especie de regalo."
 POD_education_events.204.option.a:0 "Ven aquí childe, quiero presentarte a alguien..."
 POD_education_events.204.option.b:0 "Lamentablemente, no puedo aceptar tu petición"
 POD_education_events.205.t:0 "Una educación : suficiente"
 POD_education_events.205.desc:0 "La presentación de su hijo fue... bastante buena. No fue un éxito rotundo ni mucho menos, pero tampoco un desatino. Supongo que, en la sociedad vampírica, incluso lograr un éxito medio ya es bastante difícil de todos modos."
 POD_education_events.205.option.a:0 "Claramente mediocre"
 POD_education_events.206.t:0 "Una educación : Sin defectos"
 POD_education_events.206.desc:0 "Todo lo relacionado con la presentación de su hijo fue muy bien, incluso por encima de sus expectativas. Tus vasallos quedaron impresionados por tu nueva progenie, y aún más por tus cualidades como padre. Esto se reflejará bien en ti durante algún tiempo".
 POD_education_events.206.option.a:0 "Un resultado perfecto"
 POD_education_events.207.t:0 "Una educación: un fracaso envuelto"
 POD_education_events.207.desc:0 "En la superficie, todo parece haber ido bien en la presentación de tu hijo. Pero en el fondo, sabes que algo salió mal. Tus vasallos eran todo palabras melosas, y se congregaban unos en torno a otros, hablando en voz baja.\NQuizás planearon este movimiento durante algún tiempo, o tal vez hiciste algo que los molestó. Sea cual sea la razón, esto podría ser un problema en el futuro".
 POD_education_events.207.option.a:0 "La política nunca se detiene"
 POD_education_events.208.t:0 "Una educación : demasiado exitosa"
 POD_education_events.208.desc:0 "Su hijo ha causado una gran primera impresión durante la presentación de [victim.GetHerHis]. Tal vez un poco demasiado grande en realidad ... Alentada por tus vasallos, deseosos de echar por tierra tus planes, [victim.GetSheHe] ha empezado a tener delirios de grandeza.\N-Evidentemente, esto está muy por encima de la posición o el poder de [victim.GetHerHis] en este momento, pero el insolente cachorro está conspirando casi abiertamente para la 'futura' tenencia de [victim.GetHerHis] como tu heredero. Tendrás que frenar a este con cuidado...".
 POD_education_events.208.option.a:0 "¡Idiota insolente!"
 POD_education_events.209.t:0 "Una educación : Vasallo impresionado"
 POD_education_events.209.desc:0 "La presentación de tu childe a la corte va bien. Nada realmente fuera de lo normal, excepto la aparentemente genuina buena voluntad [victim.GetSheHe] ganada por uno de tus poderosos vasallos. Esta pequeña muestra de diplomacia puede ser aprovechada en tu beneficio, ya sea hacia el vasallo o hacia tu childe."
 POD_education_events.209.option.a:0 "Obviamente, mi childe está hablando con mi bendición"
 POD_education_events.209.option.b:0 "Te elijo bien, childe"
 POD_education_events.210.t:0 "Una educación: el regalo"
 POD_education_events.210.desc:0 "Durante la primera presentación de tu childe en la corte, un pequeño número de tus vasallos llega con un generoso regalo... para tu progenie, no para ti. Evidentemente, intentan crear una ruptura entre vosotros haciendo que reclames el regalo para ti. Un complot no tan sutil, pero aún así tentador por su valor..."
 POD_education_events.210.option.a:0 "Eres demasiado joven, esto es mío"
 POD_education_events.210.option.b:0 "Disfruta entonces"
 POD_education_events.211.t:0 "Una educación: niño superdotado"
 POD_education_events.211.desc:0 "Tienes que admitir que tu hijo es bastante bueno a la hora de suavizar las pequeñas quejas de tus vasallos y acariciar sus egos aún más pequeños. Lo suficientemente bueno, de hecho, como para que no necesites nada durante esta introducción a la corte.\NPuede que sea pronto, pero te estás preguntando si podrías utilizar a tu dotada progenie para aliviar tu carga de gobernante, al menos durante un tiempo."
 POD_education_events.211.option.a:0 "Hablemos de las nuevas responsabilidades, childe"
 POD_education_events.211.option.b:0 "Descansaré cuando esté... bien"
 POD_education_events.1001.t:0 "Hijos contra padres"
 POD_education_events.1001.desc:0 "Miras a tu hijo más reciente, que aún se recupera de la sangre que tan generosamente le regalaste [victim.GetHerHim]. ¿En qué se convertirá éste? ¿Un amigo, un sirviente, un enemigo? Reflexionas sobre ello mientras el nuevo polluelo se levanta para encontrarse con tu mirada.\NEspera, esta mirada, no puede ser...\NReaccionas demasiado tarde cuando [victim.GetSheHe] te agarra con la nueva fuerza de [victim.GetHerHis] y te clava los colmillos de [victim.GetHerHis] en el cuello. Sientes que tu conciencia cae en el olvido hasta que tu Bestia, por una vez tu mayor aliada, te insta a luchar. No te rendirás tan fácilmente".
 POD_education_events.1001.option.a:0 "¡Aún no es demasiado tarde!"
 POD_education_events.1001.effect.success.desc:0 "Empujas a tu hijo hacia atrás"
 POD_education_events.1001.critical.failure.effect.desc:0 "...la sensación de felicidad es demasiado fuerte"
 POD_education_events.1002.t:0 "Hijos contra padres: ¿piedad?"
 POD_education_events.1002.desc:0 "En un esfuerzo supremo de fuerza de voluntad y fuerza física, has conseguido zafarte del abrazo mortal de tu hijo. Ahora eres plenamente consciente de la amenaza, y tu enemigo ha perdido la ventaja. Con tu conciencia y tus poderes recuperados, puedes aplastar a este insolente cachorro si te place. O puedes perdonar y olvidar, ya que conoces muy bien el atractivo de la sangre vieja para el novato recién abrazado..."
 POD_education_events.1002.option.a:0 "Tienes ambición. Puedo respetar eso".
 POD_education_events.1002.option.b:0 "¡No eres digno de mi sangre!"
 POD_education_events.1003.t:0 "Cenizas de lo viejo"
 POD_education_events.1003.desc:0 "Es demasiado tarde. Potenciado por la sangre que usaste para devolver a la vida a [victim.GetHerHim], tu más reciente childe ha conseguido drenarte lo suficiente como para hacerte impotente para resistir. Así es como terminará entonces, asesinado por tu propia progenie, como tantos antes, y después, de ti.\NUna pintoresca ironía, que no se te escapa a medida que tu conciencia se aleja cada vez más, consumida por una dicha artificial.\NHasta que todo termine, en la oscuridad, como siempre esperaste."
 POD_education_events.1003.option.a:0 "Siempre hay que matar al padre algún día"
                   
