l_spanish:
 POD_vampire_masquerade_breach.100.title:0 "Violación de la Mascarada"
 POD_vampire_masquerade_breach.100.desc:0 "[mortal.GetTitledFirstName] te vio violar el Silencio de la Sangre, revelándote como vampiro.  La Mascarada ha sido violada. ¿Qué se hará con ellos?"
 POD_vampire_masquerade_breach.100.a:0 "Hacerles olvidar".
 POD_vampire_masquerade_breach.100.b:0 "Ignóralos por ahora".
 POD_vampire_masquerade_breach.100.c:0 "Sobornarlos para que no digan nada".
 POD_vampire_masquerade_breach.100.d:0 "Mátalos".
 POD_vampire_masquerade_breach.100.e:0 "Drena la sangre de [mortal.GetTitledFirstName], matándolos. "
 POD_vampire_masquerade_breach.100.d.tt.beast:0 "#R La presa ha olido al depredador - ataca ahora, no sea que tú mismo te conviertas en presa."
 POD_vampire_masquerade_breach.100.e.tt.beast:0 "#R ¡Dos pájaros de un tiro!" 
 POD_vampire_masquerade_breach.100.d.notwounded:0 "Superas al insignificante mortal ileso"
 POD_vampire_masquerade_breach.100.d.wounded:0 "El mortal prueba.... problemático"
 POD_vampire_masquerade_breach.100.d.woundedtoast:0 "Antes de caer, [mortal.GetTitledFirstName] ha conseguido herirte".
 POD_vampire_masquerade_breach.100.d.woundedtoastitle:0 "Herido"

 POD_vampire_masquerade_breach.300.title:0 "Violación de la Mascarada"       
 POD_vampire_masquerade_breach.300.desc:0 "[mortal.GetTitledFirstName] vio a [vampire_exposes_masquerade.GetTitledFirstName] violar el Silencio de la Sangre, revelando a [vampire_exposes_masquerade.GetFirstName] como vampiro.  La Mascarada ha sido violada. ¿Qué se hará con [mortal.GetFirstName]?"
 POD_vampire_masquerade_breach.300.a:0 "Hacer olvidar a [mortal.GetTitledFirstName]".
 POD_vampire_masquerade_breach.300.b:0 "Ignora a [mortal.GetTitledFirstName] por ahora. "
 POD_vampire_masquerade_breach.300.c:0 "Sobornar a [mortal.GetTitledFirstName] para que no diga nada".
 POD_vampire_masquerade_breach.300.d:0 "Mata a [mortal.GetTitledFirstName]".
 
 POD_vampire_masquerade_breach.400.title:0 "Brecha de la Mascarada"
 POD_vampire_masquerade_breach.400.desc:0 "[vampiro_expone_mascarada.GetTitledFirstName] ha violado el Silencio de la Sangre, revelándose como vampiro.  La Mascarada ha sido violada. ¿Qué se hará con [vampiro_expone_mascarada.GetFirstName]?"
 POD_vampire_masquerade_breach.400.a:0 "Perdona a [vampire_exposes_masquerade.GetTitledFirstName] por un favor".
 POD_vampire_masquerade_breach.400.b:0 "Perdona a [vampire_exposes_masquerade.GetTitledFirstName]".
 POD_vampire_masquerade_breach.400.c:0 "Ordena a mis secuaces que arresten a [vampire_exposes_masquerade.GetTitledFirstName]".
 POD_vampire_masquerade_breach.400.d:0 "Esto no se perdona ni se olvida [vampire_exposes_masquerade.GetTitledFirstName]".
 POD_vampire_masquerade_breach.400.c.Arrest:0 "[vampire_exposes_masquerade.GetTitledFirstName] es llevado a mi mazmorra encadenado".
 POD_vampire_masquerade_breach.400.c.ArrestNotificationtitle:0 "Violación contenida"
 POD_vampire_masquerade_breach.400.c.ArrestNotification:0 "[vampire_exposes_masquerade.GetTitledFirstName] ha sido encarcelado."
 POD_vampire_masquerade_breach.400.c.Escape:0 "[vampire_exposes_masquerade.GetTitledFirstName] evade la captura."
 POD_vampire_masquerade_breach.400.c.EscapeNotificationtitle:0 "[vampire_exposes_masquerade.GetTitledFirstName] ¡escapó!"
 POD_vampire_masquerade_breach.400.c.EscapeNotification:0 "Tus secuaces no han conseguido traer a [vampire_exposes_masquerade.GetTitledFirstName]. #R debiluchos".

 POD_opinion_breached_masquerade:0 "Mascarada violada"
 POD_masquerade_breach:0 "Violación de la mascarada"
 POD_masquerade_breach_desc:0 "Un vampiro ha violado el Silencio de la Sangre.  La Mascarada ha sido violada".
 
 trait_POD_knows_too_much:0 "Sabe demasiado"
 trait_POD_knows_too_much_desc:0 "Este mortal ha sido testigo de un atisbo de lo sobrenatural y ha sobrevivido... por ahora".
 
 
 

