l_spanish:
 POD_masquerade_enforcement.001.t:0 "Aplicación de la mascarada"
 POD_masquerade_enforcement.001.desc:0 "[target.GetFirstName] pone en peligro la existencia de toda la estirpe al no seguir la mascarada. Es hora de arreglar este problema."
 POD_masquerade_enforcement.001.option.a:0 "¡Te ordeno que obedezcas!"
 POD_masquerade_enforcement.001.option.a.tt:0 "Usar dominar para imponer la máscara sobre [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.desc:0 "Un choque de voluntades"
 POD_masquerade_enforcement.001.option.a.success:0 "Domina con éxito [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.tt.enforcer_wins:0 "Obliga a [target.GetHerHim] a obedecer"
 POD_masquerade_enforcement.001.option.a.failure:0 "Fallas al dominar [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.tt.enforcer_lost:0 "[target.GetSheHe|U] se resiste a tu enviste"
 POD_masquerade_enforcement.001.option.b:0 "Oh, [target.GetFirstName], ¿realmente quieres desobedecerme?"
 POD_masquerade_enforcement.001.option.b.tt:0 "Usar 'presencia' para imponer la máscarada sobre [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.b.desc:0 "Un duelo de encantos"
 POD_masquerade_enforcement.001.option.b.success:0 "Utilizar con éxito 'presencia' en [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.b.tt.enforcer_wins:0 "Usando tu disciplina de Presencia haces que [target.GetHerHim] te obedezca"
 POD_masquerade_enforcement.001.option.b.failure:0 "Fallo en el uso de 'presencia' en [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.b.tt.enforcer_lost:0 "[target.GetSheHe|U] resiste"
 POD_masquerade_enforcement.001.option.c:0 "Vamos a ver cómo puedo obligarte a obedecer..."
 POD_masquerade_enforcement.001.option.c.tt:0 "Usa tu habilidad de intriga para imponer la máscara sobre [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.c.desc:0 "Un duelo de ingenio"
 POD_masquerade_enforcement.001.option.c.success:0 "Utiliza con éxito las maquinaciones en [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.c.tt.enforcer_wins:0 "Usando tu ingenio haces que [target.GetHerHim] te obedezca"
 POD_masquerade_enforcement.001.option.c.failure:0 "Fallas al jugar con [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.c.tt.enforcer_lost:0 "[target.GetSheHe|U] resiste tus maquinaciones"
 POD_masquerade_enforcement.001.option.d:0 "Un soborno, ¿qué podría ser un mejor estímulo?"
 POD_masquerade_enforcement.001.option.d.tt:0 "Usa el oro y tu influencia para imponer la mascarada sobre [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.desc:0 "Un duelo de palabras y oro"
 POD_masquerade_enforcement.001.option.d.success:0 "Soborno exitoso [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.tt.enforcer_wins:0 "Usando tu dinero e influencia haces que [target.GetHerHim] te obedezca"
 POD_masquerade_enforcement.001.option.d.failure:0 "Fallo en el soborno de [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.tt.enforcer_lost:0 "[target.GetSheHe|U] rechaza"
 POD_masquerade_enforcement.001.option.e:0 "Voy a dejar pasar esta... por una vez"
 POD_masquerade_enforcement.001.option.e.tt:0 "Podrías obtener un gancho en [target.GetFirstName]"
 POD_masquerade_enforcement.002.t:0 "Éxito en la aplicación de la mascarada"
 POD_masquerade_enforcement.002.desc.dominate:0 "Con tu poder de controlar las mentes menores, has conseguido obligar a [target.GetFirstName] a obedecerte y a tener más cuidado con los mortales, [target.GetFirstName] debería estar agradecértelo"
 POD_masquerade_enforcement.002.desc.presence:0 "[target.GetFirstName] claramente no puede resistirse a tu encanto sobrenatural, [target.GetFirstName] quiere mantener la mascarada,, siguiendo tus consejos... al menos eso es lo que piensa [target.GetFirstName]."
 POD_masquerade_enforcement.002.desc.intrigue:0 "Unas pocas palabras aquí, una pista sabiamente colocada allí, y ahora [target.GetFirstName] mantendrá la mascarada lo suficiente como para complacerte. Las maquinaciones, pueden hacer que todos hagan lo que quieras incluso sin invocar los poderes de la sangre de Caine."
 POD_masquerade_enforcement.002.desc.bribe:0 "Oro, cosa que todos quieren tener, al igual que sus "hermanos" mortales. Usando tu oro e influencia hiciste que [target.GetFirstName] mantuviera la mascarada lo suficientemente buena como para no poner el mundo kindred en peligro, al menos por ahora."
 POD_masquerade_enforcement.002.option.a:0 "Trabajo bien hecho"
 POD_masquerade_enforcement.002.option.a.tt:0 "La exposición de la mascarada [target.GetFirstName] disminuirá"
 POD_masquerade_enforcement.003.t:0 "Aplicación fallida de la mascarada"
 POD_masquerade_enforcement.003.desc.dominate:0 "[target.GetFirstName] se las arregla para resistir tus poderes de control mental, tal vez su voluntad es demasiado fuerte, o tal vez simplemente te descuidaste. Realmente no importa, lo que importa es el hecho de que has fallado."
 POD_masquerade_enforcement.003.desc.presence:0 "Pensaste que nadie podría resistir tu encanto antinatural, pero parece que [target.GetFirstName] de hecho resistió. Has fracasado, pero quizá puedas vengarte... después de algún tiempo."
 POD_masquerade_enforcement.003.desc.intrigue:0 "[target.GetFirstName] logró ver a través de tus tramas, no lograste nada al tratar de que siguiera tu voluntad."
 POD_masquerade_enforcement.003.desc.bribe:0 "El oro, pensabas que el oro gobierna a todos. Pero tal vez te equivocaste, [target.GetFirstName] se ha resistido a tu oro y ni siquiera tu influencia te ayudó. Ahora has perdido tu oro, y tu objetivo sigue amenazando la mascarada"
 POD_masquerade_enforcement.003.option.a:0 "Esto no es nada, sino un mero contratiempo"
