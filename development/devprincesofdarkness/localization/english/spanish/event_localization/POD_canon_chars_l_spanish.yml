l_spanish:

 PODcanon_chars.1.t:0 "Nuevos comienzos"
 PODcanon_chars.1.desc:0 "Por fin está hecho. La tonta, Menele de Esparta, ha muerto y tú eres, por primera vez en milenios, libre de hacer lo que quieras. La victoria se siente más... vacía de lo que hubieras pensado, ya que de repente has perdido lo que ha sido tu propósito en la no-vida... pero seguirás adelante, como siempre lo haces.\NEl mundo te ha olvidado, e incluso los más viejos Toreador te consideran un mito en este momento. Esto podría jugar a tu favor. Es hora de volver al mundo de la política cainita, un mundo que conoces muy bien, pero con una clara ventaja: nadie importante sospecha siquiera de tus verdaderos poderes.\NEsta es una baza que te resultará muy útil, y que pretendes conservar el mayor tiempo posible..."
 PODcanon_chars.1.a:0 "Mi ascensión puede comenzar por fin"
 PODcanon_chars.helena:0 "Has desbloqueado una nueva interacción de personaje sobre los gobernantes extranjeros: Infiltrar"
 PODcanon_chars.2.t:0 "Despertar de un Dios"
 PODcanon_chars.2.desc:0 "Por fin está hecho. Casi has completado el ritual para invocar a Svantevit en un huésped dispuesto. No puedes esperar a sentir el poder de un Dios fluyendo a través de tus venas eternas! Hay un pequeño problema, sin embargo, durante tu investigación, encontraste que la mente del anfitrión se supone que debe ser borrada por la llegada de Svantevit. Obviamente, tienes una fuerte voluntad y no te rendirías tan fácilmente como algunos de los idiotas cultistas que aplastaste, pero... esto sigue siendo preocupante.\NEl simple hecho de descifrar el ritual ya te ha enseñado mucho, y podría ser una recompensa suficiente en sí misma.\NO podrías invocar a un Dios y tratar de doblegarlo a tu voluntad. La elección es tuya... quizás por última vez".
 PODcanon_chars.2.a:0 "¡Poder definitivo!"
 PODcanon_chars.2.b:0 "...no lo siento"
 PODcanon_chars.3.t:0 "Romance de los dioses"
 PODcanon_chars.3.desc:0 "Ella ha vuelto.\NLa amada hija de Isis se ha unido de nuevo a tu lado, y una ráfaga de emociones conflictivas se precipita hacia ti. Lo que tuvisteis esta vez fue apasionado, aunque fugaz. Tal vez vuestra historia resista mejor la prueba del tiempo ahora que ambos sois mayores y, con suerte, más sabios.\NComo mínimo, será interesante, sobre todo porque tus vasallos ya están refunfuñando a tus espaldas. Kemintiri nunca fue la figura más popular entre ellos.\NPero no te importa. Ha vuelto y parece que merece la pena volver a vivir, ojalá sea por mucho tiempo".
 PODcanon_chars.3.a:0 "Rehagamos esta tierra a nuestra imagen"
 PODcanon_chars.mithras:0 "Has desbloqueado una nueva decisión importante programada"
 PODcanon_chars.4.t:0 "Prueba de guerra"
 PODcanon_chars.4.desc:0 "Has planeado una sucesión de escaramuzas rápidas y decisivas contra este rebelde vasallo tuyo. Si consigues la victoria, estarás a salvo de la rebelión, de ésta al menos, durante un tiempo.\NSin embargo, más vale que te asegures antes de lanzar el ataque, si pierdes, las consecuencias serán peores que no intentar tal acción..."
 PODcanon_chars.4.a:0 "¡Adelante con la victoria!"
 PODcanon_chars.4.b:0 "Esta noche no es la noche"
 PODcanon_chars.4.effect.success.desc:0 "La victoria romperá el espíritu vasallo durante un tiempo"
 PODcanon_chars.4.success:0 "¡Victoria!"
 PODcanon_chars.4.critical.failure.effect.desc:0 "Perder envalentonará el espíritu rebelde del vasallo"
 PODcanon_chars.4.failure:0 "Derrotado..."
 PODcanon_chars.5.t:0 "Mirando a la pirámide"
 PODcanon_chars.5.desc:0 "Es hora de que utilices tu legítimo poder como maestro del clan Tremere para hacer algo de política hermética a la antigua. Ya que estás en la cima de la pirámide, ganarás al final, es sólo una cuestión de lo que ganarás específicamente con ello.|¡Tantas opciones con tan pocas consecuencias! Excepto molestar a los de abajo, obviamente. No es que importe mucho".
 PODcanon_chars.5.a:0 "Robar las ideas de otro"
 PODcanon_chars.5.b:0 "Culpar a otro de tus fracasos"
 PODcanon_chars.5.c:0 "Requisar de las arcas del clan"
 PODcanon_chars.5.d:0 "No estoy de humor para la política"
 PODcanon_chars.6.t:0 "Recompensas de Alamut"
 PODcanon_chars.6.desc:0 "Los dirigentes de los Hijos de Haqim están satisfechos por el progreso de la Media Luna en Iberia. Te envían sus saludos y felicitaciones, junto con refuerzos, prometiendo neonatos de las castas visir, hechicero y guerrero.\NTu trabajo aún no ha terminado, pero la presión sobre ti es ahora menos aplastante, pues parece que por fin confían en que tienes en mente el mejor interés del clan. Incluso quizás haciendo de Iberia una futura gran fortaleza digna del propio Haqim".
 PODcanon_chars.6.a:0 "Soy la comidilla de la década en Alamut"
 PODcanon_chars.7.t:0 "Parcelas dentro de parcelas"
 PODcanon_chars.7.desc:0 "Has conseguido saber más sobre este potencial enemigo. Siempre es una sensación extrañamente reconfortante para ti, Príncipe Roque, ya que te encanta ser más astuto que tus enemigos y enredarlos en una red de tramas improbables.\NAún así, a veces no maquinas sólo por maquinar. Podrías aprovechar la información que obtuviste para conspirar aún más".
 PODcanon_chars.7.a:0 "¡Comienza más conspiraciones contra este!"
 PODcanon_chars.7.b:0 "La intriga es un pasatiempo tan relajante..."
 PODcanon_chars.7.c:0 "¡Que todo el mundo conozca el alcance de tus habilidades intrigantes!"
 PODcanon_chars.8.t:0 "Haciendo olas"
 PODcanon_chars.8.desc:0 "Lord Montano, con el regreso de la mayor parte de Italia bajo tu control, demostró al clan Lasombra que sigue siendo un gobernante eficaz y decisivo. Obviamente, todavía queda mucho por hacer para restaurar el lugar adecuado del Mar de las Sombras en el mundo mediterráneo, pero, al menos, tu posición como jefe del clan ya no está en disputa.\nAhora que puedes hacerlo. Utilíza el poder para reclamar el poder sobre cualquier principado Lasombra descarriado."
 PODcanon_chars.8.desc:0 "Señor Montano, con el regreso de la mayor parte de Italia bajo tu control, has demostrado al clan Lasombra que sigues siendo un gobernante eficaz y decisivo. Obviamente, aún queda mucho por hacer para restaurar el lugar que le corresponde al Mar de las Sombras en el mundo mediterráneo, pero, al menos, tu posición como jefe del clan ya no es discutida.
 PODcanon_chars.8.a:0 "Puedo hacerlo aún mejor"
 PODcanon_chars.montano:0 "Ahora tienes una bonificación especial a la aceptación de la interacción "Ofrecer vasallaje" con cualquier gobernante Lasombra"
 PODcanon_chars.9.t:0 "Un abrazo cariñoso"
 PODcanon_chars.9.desc:0 "Es difícil resistirse a ti cuando pones tu mente en algo, hermosa Maatkare, pero los cainitas son criaturas obstinadas. Si has de mostrarle a éste el amor de Set, se necesitarán todas tus considerables habilidades de persuasión y seducción para lograrlo.\NSiempre existe el riesgo de fracasar, lo que te costaría bastante a los implacables ojos de Set..."
 PODcanon_chars.9.a:0 "La gloria de Set no puede esperar"
 PODcanon_chars.9.b:0 "Esta noche no es la noche"
 PODcanon_chars.9.effect.success.desc:0 "Ganar hará que este personaje se convierta a Vía Set"
 PODcanon_chars.9.success:0 "¡Alabado sea Set!"
 PODcanon_chars.9.critical.failure.effect.desc:0 "Perder te costará bastante"
 PODcanon_chars.9.failure:0 "He fallado..."
 PODcanon_chars.10.t:0 "Caminando por la espiral negra"
 PODcanon_chars.10.desc:0 "Has visto a esos "Bailarines de la Espiral Negra", están completamente locos, incluso para tus flojos estándares. ¿Merece la pena la ínfima posibilidad de una respuesta a tu dolor? Lo único que se puede decir con seguridad es que no serás el mismo una vez que vuelvas de este lugar maldito..."
 PODcanon_chars.10.a:0 "Ya no hay vuelta atrás"
 PODcanon_chars.10.b:0 "Esto es una muy muy mala idea"
 PODcanon_chars.petaniqua:0 "Es más que probable que vuelvas de aquí peor de lo que empezaste. Pero puede haber una pequeña esperanza de algo que valga la pena..."
 PODcanon_chars.11.t:0 "La locura de la espiral negra"
 PODcanon_chars.11.desc:0 "La gente cree que has vuelto de la Espiral Negra relativamente sin cambios. Pero tú lo sabes mejor, nunca volviste de ella. Está contigo ahora. Y estas... cosas que viste nunca saldrán de tu visión. Tal vez el mundo entero es simplemente una extensión de ella. O simplemente estás demasiado lejos para que te importe. No quieres volver allí. ¿O sí?"
 PODcanon_chars.11.a:0 "Ya no hay luz"
 PODcanon_chars.12.t:0 "Claridad de la espiral negra"
 PODcanon_chars.12.desc:0 "No recuerdas mucho de tu viaje en la Espiral Negra, lo cual es... probablemente lo mejor. No has encontrado verdades ocultas, ni sórdidos horrores. Si lo hubieras hecho, tendrías algunos recuerdos de ellos, ¿no? De todos modos, a pesar de lo que podría llamarse un contratiempo, te sientes aliviado de haber salido de allí. El mundo exterior parece extrañamente agradable ahora".
 PODcanon_chars.12.a:0 "Podría haber sido peor"
 PODcanon_chars.13.t:0 "Fuerza de la Espiral Negra"
 PODcanon_chars.13.desc:0 "No hay duda de que la Espiral Negra es un lugar de absoluta locura. Pero has pasado por tanto en tu vida, y sin vida, que no te ha destrozado esta vez. Has vencido tus miedos, y "eso" ha quedado satisfecho con tu actuación.\NA pesar de esta demostración de fuerza, admitirás estar contento de volver a unirte al mundo exterior. No ha sido ni mucho menos una experiencia relajante..."
 PODcanon_chars.13.a:0 "No me asusto fácilmente"
 PODcanon_chars.14.t:0 "Regalo de la espiral negra"
 PODcanon_chars.14.desc:0 "Lo has encontrado.\NQuizás la Espiral Negra se apiadó de ti, o quedó impresionada por tu dedicación. Tal vez sea sólo un sueño, una fantasía de tu mente rota. No te importa. Él está contigo ahora, y todo estará bien una vez más".
 PODcanon_chars.14.a:0 "Estás destinado a ser el Rey del mundo"
 PODcanon_chars.petaniqua2:0 "No tienes motivos para caminar por la Espiral Negra a partir de ahora"
 
 
 
 
 
 
 
