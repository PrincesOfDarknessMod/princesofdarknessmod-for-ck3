l_spanish:

 POD_test_of_faith.001.t:0 "Una prueba de fe"
 POD_test_of_faith.001.desc:0 "Algunas personas pueden vivir en pecado, los siervos de Dios no. No mereces su gracia, si no eres lo suficientemente virtuoso, y sabes que no lo eres. Es hora de cambiarte a ti mismo, de deshacerte de esos pecados que te hacen no ser digno. Un camino arduo sin duda, pero necesario".
 POD_test_of_faith.001.option.a:0 "La lujuria no nublará mi mente"
 POD_test_of_faith.001.option.a.tt:0 "Intentarás deshacerte de tu lujuria"
 POD_test_of_faith.001.option.a.desc:0 "Prueba de fe"
 POD_test_of_faith.001.option.a.success:0 "Tienes éxito"
 POD_test_of_faith.001.option.a.failure:0 "Usted fracasa"
 POD_test_of_faith.001.option.a.failure.tt:0 "Usted falla la prueba"
 POD_test_of_faith.001.option.b:0 "No soy tan bueno después de todo"
 POD_test_of_faith.001.option.b.tt:0 "Intentarás deshacerte de tu arrogancia"
 POD_test_of_faith.001.option.b.desc:0 "Prueba de fe"
 POD_test_of_faith.001.option.b.success:0 "Tienes éxito"
 POD_test_of_faith.001.option.b.failure:0 "Usted fracasa"
 POD_test_of_faith.001.option.b.failure.tt:0 "Usted falla la prueba"
 POD_test_of_faith.001.option.c:0 "Intentaré no tener el corazón lleno de rencor"
 POD_test_of_faith.001.option.c.tt:0 "Intentarás deshacerte de tu vena vengativa"
 POD_test_of_faith.001.option.c.desc:0 "Prueba de fe"
 POD_test_of_faith.001.option.c.success:0 "Tienes éxito"
 POD_test_of_faith.001.option.c.failure:0 "Usted fracasa"
 POD_test_of_faith.001.option.c.failure.tt:0 "Usted falla la prueba"
 POD_test_of_faith.001.option.d:0 "No dejaré que mi ira me controle"
 POD_test_of_faith.001.option.d.tt:0 "Intentarás deshacerte de tu ira"
 POD_test_of_faith.001.option.d.desc:0 "Prueba de fe"
 POD_test_of_faith.001.option.d.success:0 "Tienes éxito"
 POD_test_of_faith.001.option.d.failure:0 "Usted fracasa"
 POD_test_of_faith.001.option.d.failure.tt:0 "Usted falla la prueba"
 POD_test_of_faith.001.option.e:0 "Tal vez, coma demasiado"
 POD_test_of_faith.001.option.e.tt:0 "Intentarás deshacerte de tus malos hábitos alimenticios"
 POD_test_of_faith.001.option.e.desc:0 "Prueba de fe"
 POD_test_of_faith.001.option.e.success:0 "Tienes éxito"
 POD_test_of_faith.001.option.e.failure:0 "Usted fracasa"
 POD_test_of_faith.001.option.e.failure.tt:0 "Usted falla la prueba"
 POD_test_of_faith.001.option.f:0 "Estoy descansando demasiado"
 POD_test_of_faith.001.option.f.tt:0 "Intentarás deshacerte de tu pereza"
 POD_test_of_faith.001.option.f.desc:0 "Prueba de fe"
 POD_test_of_faith.001.option.f.success:0 "Tienes éxito"
 POD_test_of_faith.001.option.f.failure:0 "Usted fracasa"
 POD_test_of_faith.001.option.f.failure.tt:0 "Usted falla la prueba"
 POD_test_of_faith.001.option.g:0 "La codicia no es buena"
 POD_test_of_faith.001.option.g.tt:0 "Intentarás deshacerte de tu codicia"
