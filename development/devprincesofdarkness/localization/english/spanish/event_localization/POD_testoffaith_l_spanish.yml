 POD_test_of_faith.101.t:0 "Una prueba con éxito"
 POD_test_of_faith.101.desc:0 "Has tenido éxito. Ahora ya casi has terminado. Le servirás bien, y el camino virtuoso es el camino correcto. ¿Qué parte de tu vida y comportamiento quieres mejorar?" 
 POD_test_of_faith.101.option.a:0 "Mente antes que carne"
 POD_test_of_faith.101.option.a.tt:0 "Te vuelves casto" 
 POD_test_of_faith.101.option.b:0 "Estaré tranquilo sin importar las circunstancias"
 POD_test_of_faith.101.option.b.tt:0 "Te vuelves tranquilo" 
 POD_test_of_faith.101.option.c:0 "Compartir es cuidar"
 POD_test_of_faith.101.option.c.tt:0 "Te vuelves generoso" 
 POD_test_of_faith.101.option.d:0 "Pondré la otra mejilla"
 POD_test_of_faith.101.option.d.tt:0 "Te vuelves indulgente" 
 POD_test_of_faith.101.option.e:0 "No soy mejor que otras personas"
 POD_test_of_faith.101.option.e.tt:0 "Te vuelves humilde" 
 POD_test_of_faith.101.option.f:0 "Sé cuándo es suficiente"
 POD_test_of_faith.101.option.f.tt:0 "Te templarás" 
 POD_test_of_faith.101.option.g:0 "Descansaré en el cielo"
 POD_test_of_faith.101.option.g.tt:0 "Te vuelves diligente" 
  
 POD_test_of_faith.201.t:0 "Una prueba fallida"
 POD_test_of_faith.201.desc:0 "Has fallado. Tu concentración no ha sido lo suficientemente perfecta. ¿Quizá deberías volver a intentarlo más tarde? No hay que avergonzarse por fracasar en la escalada de la montaña, sólo por negarse a intentarlo en primer lugar."
 POD_test_of_faith.201.option.a:0 "Todavía no estoy preparado"
 POD_test_of_faith.201.option.a.tt:0 "Has fracasado"
