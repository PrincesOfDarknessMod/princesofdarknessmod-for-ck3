l_spanish:

 POD_spiritual_guidance.001.t:0 "Orientación espiritual"
 POD_spiritual_guidance.001.desc:0 "[student.GetFirstName] vive una vida pecaminosa. Cree que puede ayudar a [student.GetHerHim], pero ¿le escuchará [student.GetSheHe]? El camino hacia la redención y la absolución de los pecados puede ser un proceso largo y arduo, después de todo, no apto para todos."
 POD_spiritual_guidance.001.option.a:0 "Ayudaré a [student.GetHerHim]"
 POD_spiritual_guidance.001.option.a.tt:0 "Intentarás ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.001.option.b:0 "No lo siento"
 POD_spiritual_guidance.001.option.b.tt:0 "Abandonas tu intento de ayudar a [student.GetFirstName]"
 
 
 POD_spiritual_guidance.002.t:0 "Intentas ayudar"
 POD_spiritual_guidance.002.desc:0 "[profesor.GetFirstName] se acercó a ti y te ofreció ayudarte a ser un mejor siervo de Dios. ¿Cuál será tu respuesta? Puede que al final te conviertas en una mejor persona, o simplemente esperes un tiempo valioso, es difícil de decir."
 POD_spiritual_guidance.002.option.a:0 "Acepto con gratitud la oferta de [teacher.GetHerHis]"
 POD_spiritual_guidance.002.option.a.tt:0 "Comienza una lección"
 POD_spiritual_guidance.002.option.b:0 "Creo que no me gusta por dónde va esto"
 POD_spiritual_guidance.002.option.b.tt:0 "Te niegas"
 
 POD_spiritual_guidance.102.t:0 "Una negativa"
 POD_spiritual_guidance.102.desc:0 "[estudiante.GetFirstName] no quiere que 'ayudes' a [estudiante.GetHerHim}. Parece que el camino de la redención era demasiado escalonado para éste. De todos modos, Dios será el único juez del alma al final".
 POD_spiritual_guidance.102.option.a:0 "Qué pena.."
 POD_spiritual_guidance.102.option.a.tt:0 "[student.GetFirstName] rechazó tu oferta"
 
 POD_spiritual_guidance.202.t:0 "Orientación espiritual II"
 POD_spiritual_guidance.202.desc:0 "Una persona verdaderamente devota no actuará de forma pecaminosa. [student.GetFirstName] no está preparado para servir a Dios con plena eficacia. Y tu misión sagrada es ayudar a [student.GetHerHim] a entender mejor a Dios. ¿Serás el devoto maestro que se necesita ahora?".
 POD_spiritual_guidance.202.option.a:0 "Tu lujuria no nublará tu mente"
 POD_spiritual_guidance.202.option.a.tt:0 "Intentarás librarte de la lujuria [estudiante.GetHerHis]"
 POD_spiritual_guidance.202.option.a.desc:0 "Prueba de fe"
 POD_spiritual_guidance.202.option.a.success:0 "Éxito"
 POD_spiritual_guidance.202.option.a.failure:0 "Fracaso" 
 POD_spiritual_guidance.202.option.a.failure.tt:0 "No consigues ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.b:0 "Tu ira no te controla"
 POD_spiritual_guidance.202.option.b.tt:0 "Intentarás deshacerte de la ira de [student.GetHerHis]"
 POD_spiritual_guidance.202.option.b.desc:0 "Prueba de fe"
 POD_spiritual_guidance.202.option.b.success:0 "Éxito"
 POD_spiritual_guidance.202.option.b.failure:0 "Fracaso" 
 POD_spiritual_guidance.202.option.b.failure.tt:0 "No consigues ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.c:0 "No eres tan bueno después de todo"
 POD_spiritual_guidance.202.option.c.tt:0 "Intentarás deshacerte de la arrogancia de [student.GetHerHis]"
 POD_spiritual_guidance.202.option.c.desc:0 "Prueba de fe"
 POD_spiritual_guidance.202.option.c.success:0 "Éxito"
 POD_spiritual_guidance.202.option.c.failure:0 "Fracaso" 
 POD_spiritual_guidance.202.option.c.failure.tt:0 "No has podido ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.d:0 "Descansas demasiado"
 POD_spiritual_guidance.202.option.d.tt:0 "Intentas deshacerte de la pereza de [student.GetHerHis]"
 POD_spiritual_guidance.202.option.d.desc:0 "Prueba de fe"
 POD_spiritual_guidance.202.option.d.success:0 "Éxito"
 POD_spiritual_guidance.202.option.d.failure:0 "Fracaso" 
 POD_spiritual_guidance.202.option.d.failure.tt:0 "No consigues ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.e:0 "Comes demasiado"
 POD_spiritual_guidance.202.option.e.tt:0 "Intentarás deshacerte de los malos hábitos alimenticios de [student.GetHerHis]"
 POD_spiritual_guidance.202.option.e.desc:0 "Prueba de fe"
 POD_spiritual_guidance.202.option.e.success:0 "Éxito"
 POD_spiritual_guidance.202.option.e.failure:0 "Fracaso" 
 POD_spiritual_guidance.202.option.e.failure.tt:0 "No consigues ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.f:0 "La codicia no es buena"
 POD_spiritual_guidance.202.option.f.tt:0 "Intentarás librarte de la codicia de [student.GetHerHis]"
 POD_spiritual_guidance.202.option.f.desc:0 "Prueba de fe"
 POD_spiritual_guidance.202.option.f.success:0 "Éxito"
 POD_spiritual_guidance.202.option.f.failure:0 "Fracaso" 
 POD_spiritual_guidance.202.option.f.failure.tt:0 "No consigues ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.g:0 "Tu corazón está lleno de rencor"
 POD_spiritual_guidance.202.option.g.tt:0 "Intentarás librarte de [student.GetHerHis] la venganza"
 POD_spiritual_guidance.202.option.g.desc:0 "Prueba de fe"
 POD_spiritual_guidance.202.option.g.success:0 "Éxito"
 POD_spiritual_guidance.202.option.g.failure:0 "Fracaso" 
 POD_spiritual_guidance.202.option.g.failure.tt:0 "No consigues ayudar a [student.GetFirstName]"
 
 POD_spiritual_guidance.302.t:0 "Orientación espiritual III"
 POD_spiritual_guidance.302.desc:0 "Has conseguido librarte del pecado de [student.GetHerHis]. Pero aún no has terminado, ahora es el momento de mostrar a [student.GetFirstName] la forma virtuosa de vivir. ¿Tal vez con el ejemplo? Sólo ten cuidado de no caer tú mismo en el pecado de la soberbia..."
 POD_spiritual_guidance.302.option.a:0 "La mente antes que la carne"
 POD_spiritual_guidance.302.option.a.tt:0 "[student.GetFirstName] se convierte en casto"
 POD_spiritual_guidance.302.option.b:0 "Debes saber cuándo es suficiente"
 POD_spiritual_guidance.302.option.b.tt:0 "[student.GetFirstName] se calma"
 POD_spiritual_guidance.302.option.c:0 "Compartir es cuidar"
 POD_spiritual_guidance.302.option.c.tt:0 "[estudiante.GetFirstName] se vuelve generoso"
 POD_spiritual_guidance.302.option.d:0 "Hay que poner la otra mejilla"
 POD_spiritual_guidance.302.option.d.tt:0 "[estudiante.GetFirstName] se vuelve indulgente"
 POD_spiritual_guidance.302.option.e:0 "Debes estar tranquilo sin importar las circunstancias"
 POD_spiritual_guidance.302.option.e.tt:0 "[student.GetFirstName] se calma"
 POD_spiritual_guidance.302.option.f:0 "No eres mejor que otras personas"
 POD_spiritual_guidance.302.option.f.tt:0 "[estudiante.GetFirstName] se vuelve humilde"
 POD_spiritual_guidance.302.option.g:0 "Descansarás en el cielo"
 POD_spiritual_guidance.302.option.g.tt:0 "[estudiante.GetFirstName] se vuelve diligente"
 
 POD_spiritual_guidance.402.t:0 "Orientación espiritual fallida"
 POD_spiritual_guidance.402.desc:0 "[profesor.GetFirstName] te ha fallado! Después de todos esos discursos... Algunas almas simplemente no están destinadas a ser salvadas".
 POD_spiritual_guidance.402.option.a:0 "Muy decepcionante"
 POD_spiritual_guidance.402.option.a.tt:0 "La orientación espiritual ha fracasado"
 
 POD_spiritual_guidance.502.t:0 "Orientación espiritual exitosa"
 POD_spiritual_guidance.502.desc:0 "[profesor.GetFirstName] consiguió mostrarte el camino correcto. Tus días pecaminosos casi han terminado, ahora tienes que ser mejor por tus propias fuerzas."
 POD_spiritual_guidance.502.option.a:0 "[teacher.GetSheHe] realmente lo hizo!"
 POD_spiritual_guidance.502.option.a.tt:0 "Ahora eres una persona mejor"
 
