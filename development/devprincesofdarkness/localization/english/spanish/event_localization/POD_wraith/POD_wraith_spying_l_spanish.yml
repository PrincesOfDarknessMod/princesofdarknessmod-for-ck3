l_spanish:
 POD_wraith_spying.100.t:0 "Ojos invisibles"
 POD_wraith_spying.100.desc:0 "Sientes que te observan. Algo no está del todo bien. Temes que si sigues operando como de costumbre, la presencia incógnita deduzca tus secretos.\NQuizás sea el momento adecuado para los dobles de cuerpo, los códigos y otros medios de confundir a un vigilante. Por supuesto, podrías estar simplemente paranoico....."
 POD_wraith_spying.100.option.a:0 "Ejercer mi fuerza de voluntad y ocultar mis secretos".
 POD_wraith_spying.100.option.b:0 "Ocultar mis secretos".
 POD_wraith_spying.100.option.c:0 "Sólo está en mi imaginación".
 
 POD_wraith_spying.200.t:0 "Espiando a [recipient.GetFirstNameNoTooltip]"
 POD_wraith_spying.200.desc:0 "Ha llegado el momento de usar mi invisibilidad sobre [recipient.GetTitledFirstName] y descubrir algunos secretos, pero [recipient.GetSheHe] se resiste."
 POD_wraith_spying.200.option.a:0 "Continúa de todos modos".
 POD_wraith_spying.200.a.tt_willpower:0 "[recipient.GetFirstNameNoTooltip] ha ejercido su voluntad para ocultar mejor los movimientos y las conversaciones clandestinas de [recipient.GetHerHis]."
 POD_wraith_spying.200.a.tt_auspex:0 "[recipient.GetFirstNameNoTooltip]'s powers allow him to see the unseen, robing you of your invisibility."
 POD_wraith_spying.200.a.success.desc:0 "Victoria"
 POD_wraith_spying.200.a.tt_success:0 "¡Los secretos de [recipient.GetTitledFirstName] serán conocidos por mí!"
 POD_wraith_spying.200.a.failure.desc:0 "Derrota"
 POD_wraith_spying.200.a.tt_failure:0 "[recipient.GetTitledFirstName] se resistió a mi intento de espionaje."
 POD_wraith_spying.200.option.b:0 "Ejerce mi voluntad. Conoceré todos los secretos de [recipient.GetHerHis]"
 
 POD_wraith_spying.200.option.c:0 "Abandona este esfuerzo, ya no deseo espiar a [recipient.GetHerHim]".
 POD_wraith_spying.200.option.c.tt:0 "El intento fracasará".
 
 
 POD_wraith_spying.300.t:0 "Se han encontrado los secretos de [recipient.GetFirstNameNoTooltip]".
 POD_wraith_spying.300.desc:0 "He aprendido los secretos de [recipient.GetTitledFirstName] observando a [recipient.GetHerHim]."
 POD_wraith_spying.300.option.a:0 "Es como debe ser".
 

 POD_wraith_spying.400.t:0 "Sus secretos han sido revelados"
 POD_wraith_spying.400.desc:0 "Habiendo fracasado el intento de ocultar tus posesiones y conversaciones a [actor.GetTitledFirstName], tus secretos son ahora conocidos por [actor.GetHerHim]." 
 POD_wraith_spying.400.option.a:0 "Mis secretos ya no están ocultos".
 
 POD_wraith_spying.500.t:0 "Espionaje frustrado"
 POD_wraith_spying.500.desc:0 "[recipient.GetTitledFirstName] ha resistido mi intento de espiar a [recipient.GetHerHim]." 
 POD_wraith_spying.500.option.a:0 "¡Frustrado!"
 POD_wraith_spying.500.option.a.tt.beast:0 "#¡Debemos conocer los secretos de [recipient.GetHerHis]!#"

 POD_wraith_spying.600.t:0 "Espionaje frustrado"
 POD_wraith_spying.600.desc:0 "[actor.GetTitledFirstName] ha abandonado el intento de [actor.GetTitledHerHis] de robar sus secretos." 
 POD_wraith_spying.600.option.a:0 "¡Mis secretos están a salvo!"
 POD_wraith_spying.600.toasttitle:0 "¡Espectro frustrado!"
 POD_wraith_spying.600.toasttext:0 "El espectro que enviaste no consiguió aprender ninguno de los secretos de tus objetivos".
 POD_wraith_spying.300.toasttitle:0 "¡Espectro frustrado!"
 POD_wraith_spying.300.toasttext:0 "Tu espectro ha recuperado información valiosa para tu uso".
 
 
 
 turned_to_wraith:0 "El objetivo morirá y renacerá como espectro en tu corte. O, si ya es un espectro, se debilitará significativamente y será atraído a tu corte".