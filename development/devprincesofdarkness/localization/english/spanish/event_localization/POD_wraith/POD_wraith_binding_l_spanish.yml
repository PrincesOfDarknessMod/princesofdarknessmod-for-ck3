l_spanish:
 POD_wraith_binding.100.t:0 "Ataduras de magia y voluntad".
 POD_wraith_binding.100.desc:0 "Mientras realizas tus actividades normales como espectro, sientes una poderosa atracción hacia un lugar desconocido. Al llegar a una cámara de invocación, te encuentras con tu invocador, un nigromante llamado [actor.GetFirstNameNoTooltip]. El ritual de vinculación ya está empezando a afectarte y a deformar tu ser".
 POD_wraith_binding.100.option.a:0 "Yo. NO. SER. CONTROLADO!"
 POD_wraith_binding.100.option.b:0 "Resiste, por supuesto".
 POD_wraith_binding.100.option.c:0 "Resistir es inútil... La venganza, pero más tarde".
 
 POD_wraith_binding.200.t:0 "Ataduras de magia y voluntad".
 POD_wraith_binding.200.desc:0 "El terreno del ritual está listo, invocas la magia oscura del abismo y atraes al espectro objetivo a tu círculo preparado. \A través de un agujero en la realidad mortal llega [recipient.GetFirstNameNoTooltip], con la cara contorsionada por el dolor y la rabia. Ahora que el fantasma está aquí, es el momento de la atadura".
 POD_wraith_binding.200.wp:0 "Continúa de todos modos".
 POD_wraith_binding.200.wp.tt_willpower:0 "[recipient.GetFirstNameNoTooltip] ha ejercido su voluntad para ocultar mejor [recipient.GetHerHis] los movimientos y las conversaciones clandestinas."
 POD_wraith_binding.200.blood.tt_success:00 "Éxito"
 POD_wraith_binding.200.wp.success.desc:0 "Victoria"
 POD_wraith_binding.200.wp.tt_success:0 "[recipient.GetTitledFirstName] ¡me obedecerá!"
 POD_wraith_binding.200.wp.failure.desc:0 "Derrota"
 POD_wraith_binding.200.blood.tt_failure:0 "Fracaso"
 POD_wraith_binding.200.wp.tt_failure:0 "[recipient.GetTitledFirstName] se resistió a mi intento de vinculación."
 POD_wraith_binding.200.option.wp:0 "Ejerce mi voluntad. Seré el amo de [recipient.GetHerHis]"
 POD_wraith_binding.200.blood:0 "Ejerce mi voluntad y mi sangre. El abismo me concederá poder sobre la muerte y los muertos".
 
 POD_wraith_binding.200.option.c:0 "Abandona este esfuerzo, ya no deseo atar a [recipient.GetHerHim]."
 POD_wraith_binding.200.option.c.tt:0 "El intento fallará".
 
 
 POD_wraith_binding.300.t:0 "[recipient.GetFirstNameNoTooltip] obligación.."
 POD_wraith_binding.300.desc:0 "He logrado invocar los terribles poderes del olvido para obligar a [recipient.GetTitledFirstName] a servir eternamente. La pregunta es, ¿cómo de fuerte es la atadura?"
 POD_wraith_binding.300.option.a:0 "Es como debe ser".
 POD_wraith_binding.300.twolevels:0 "¡La potencia de la atadura se incrementará en dos niveles!"
 POD_wraith_binding.300.threelevels:0 "¡La potencia de la vinculación se incrementará en tres niveles!"

 POD_wraith_binding.400.t:0 "¡Enlazado!"
 POD_wraith_binding.400.desc:0 "A pesar de tus esfuerzos por luchar contra los poderes oscuros de [actor.GetTitledFirstName], la magia te ha obligado a convertirte en un esclavo involuntario de [actor.GetHerHim]." 
 POD_wraith_binding.400.option.a:0 "Mi independencia... Perdida".
 
 POD_wraith_binding.500.t:0 "Atadura fallida"
 POD_wraith_binding.500.desc:0 "[recipient.GetTitledFirstName] se ha resistido a mi intento de vincular a [recipient.GetHerHim]." 
 POD_wraith_binding.500.option.a:0 "¡Frustrado!"


 POD_wraith_binding.600.t:0 "Vinculación frustrada"
 POD_wraith_binding.600.desc:0 "[actor.GetTitledFirstName] ha abandonado el intento de [actor.GetTitledHerHis] de forzarte a servir." 
 POD_wraith_binding.600.option.a:0 "¡Mi independencia está a salvo!"
 
 
 
