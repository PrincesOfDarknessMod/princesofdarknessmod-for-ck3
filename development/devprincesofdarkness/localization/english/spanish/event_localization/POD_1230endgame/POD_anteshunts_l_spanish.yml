l_spanish:

 POD_anteshuntabsi.1.t:0 "Dioses cazadores"
 POD_anteshuntabsi.1.desc:0 "La Revuelta Anarca es un momento de crisis sin precedentes... y de oportunidades. Con la mayoría de los clanes en desorden, y la Inquisición impidiendo a los ancianos la comunicación a larga distancia, los antiguos cainitas son vulnerables como nunca antes.\NAlgunos de los anarcas más vengativos están planeando atrevidos ataques contra los antediluvianos, progenitores de los clanes, con la esperanza de volver a promulgar la diablura de Tremere de Saulot. ¿Intentará usted esta empresa? Las recompensas potenciales son atractivas pero los riesgos... los riesgos están más allá de la imaginación. Estas entidades están más cerca de los dioses que de los simples humanos".
 POD_anteshuntabsi.1.a:0 "Cazaré al cazador, Absimilliard del Nosferatu"
 POD_anteshuntabsi.1.b:0 "...no tengo deseos de morir"
 big_freaking_warning:0 "#R Tus posibilidades de éxito en esta búsqueda son absurdamente bajas. No lo intentes si te preocupa el bienestar de tu personaje. Has sido advertido".
 POD_anteshuntabsi.2.t:0 "La caza : Encontrar a la bruja"
 POD_anteshuntabsi.2.desc:0 "La ubicación de Absimilliard es desconocida, lo que supone el primer obstáculo a superar en tu búsqueda. La única persona que podría tener una pista al respecto es Baba Yaga, su hija díscola y el blanco de su ira durante tanto tiempo. El problema es que... ella también se esconde.\NPara encontrarla, puedes, penosamente, buscar tú mismo cualquier información sobre ella o preguntar a su segundo al mando, Viktor de la Cortina de Sombras, sobre una posible alianza contra Absimilliard. Si todavía está vivo y activo, obviamente".
 POD_anteshuntabsi.2.a:0 "¡La encontraré yo mismo!"
 POD_anteshuntabsi.2.effect.success.desc:0 "Avanzas un paso más en tu búsqueda"
 POD_anteshuntabsi.2.critical.failure.effect.desc:0 "Un contratiempo, pero no el fin de las cosas" 
 POD_anteshuntabsi.2.b:0 "Encontraré un terreno común con Viktor"
 POD_anteshuntabsi.2.c:0 "Querida abuela, es hora de contraatacar"
 skip_viktor:0 "Como Viktor, puedes saltarte esta fase. Ya sabes dónde está Baba Yaga".
 POD_anteshuntabsi.2.d:0 "¡Soy su campeón elegido, sé dónde está!"
 skip_objectivedone:0 "Como el objetivo de la abuela cuidadora se ha conseguido, Baba Yaga se ha revelado. Puedes saltarte esta fase sin problemas".
 POD_anteshuntabsi.4.t:0 "La caza : Forzando el camino"
 POD_anteshuntabsi.4.desc:0 "Hasta ahora, has sido incapaz de conseguir la ubicación de Baba Yaga, el primer paso hacia tu búsqueda de matar a Absimilliard.\NTienes que intensificar tu investigación, lo que significa gastar más oro, tiempo y recursos en general en lo que probablemente sea una tontería en el mejor de los casos. Tal vez sea el momento de reconsiderar este curso de acción... o seguir adelante a pesar de todo".
 POD_anteshuntabsi.4.a:0 "¡No me dejaré frustrar tan fácilmente!"
 anteabsi_continue:0 "Tu búsqueda continúa"
 POD_anteshuntabsi.4.b:0 "Es mejor parar ahora"
 anteabsi_end:0 "Tu búsqueda termina aquí"
 POD_anteshuntabsi.3.t:0 "La caza : Dagas en la noche"
 POD_anteshuntabsi.3.desc:0 "Te estás preparando para el viaje hacia la casa de Baba Yaga cuando te llegan informes de un misterioso asesinato. Un miembro de tu séquito ha sido asesinado, lo cual no es sorprendente, pero los detalles del ataque son más preocupantes. El asesino ha dejado una palabra, escrita con sangre, en una pared cerca de la víctima: 'Nictuku'. Has oído hablar de él durante tu investigación sobre Absimilliard, parece ser su hijo ligado a la sangre, todas máquinas asesinas sin alma empeñadas en destruir cualquier cosa que amenace a su progenitor. Y estás bastante seguro de que debes ocuparte de ellos, antes de que ellos se ocupen de ti..."
 POD_anteshuntabsi.3.a:0 "Debo detenerlos rápidamente"
 anteabsi_nictuku:0 "Ahora tienes acceso a cinco decisiones para deshacerte de los Nictuku de tu rastro. Si lo haces, esto te ayudará en las etapas posteriores de tu búsqueda".
 abraxes_decision:0 "Tratar con Abraxes"
 abraxes_decision_tooltip:1 "Mistiendo al Señor de las Nieblas"
 abraxes_decision_desc:0 "El Nictuku Abraxes es un maestro del engaño. Debes fabricar un rastro de despiste para mantenerlo alejado de ti".
 abraxes_decision_effect_tooltip:1 "Abraxes no intervendrá en las últimas etapas de tu búsqueda" 
 abraxes_decision_confirm:0 "Hazlo"
 echidna_decision:0 "Tratar con Echidna"
 echidna_decision_tooltip:1 "Engañar a la Madre de la Suciedad"
 echidna_decision_desc:0 "El Nictuku Echidna es la madre de los horrores. Debes fabricar un rastro de despiste para mantenerla alejada de ti".
 echidna_decision_effect_tooltip:1 "La equidna no intervendrá en las últimas etapas de tu búsqueda" 
 echidna_decision_confirm:0 "Hazlo"
 gorgo_decision:0 "Enfrentarse a Gorgo"
 gorgo_decision_tooltip:1 "Silenciar a la que grita en la oscuridad"
 gorgo_decision_desc:0 "La Nictuku Gorgo es la dueña de las pesadillas. Debes fabricar un rastro de despiste para mantenerla alejada de ti".
 gorgo_decision_effect_tooltip:1 "Gorgo no intervendrá en las últimas etapas de tu búsqueda" 
 gorgo_decision_confirm:0 "Hazlo"
 nuckalavee_decision:0 "Cómo lidiar con Nuckalavee"
 nuckalavee_decision_tooltip:1 "Domar al Nuckalavee"
 nuckalavee_decision_desc:0 "El Nictuku Nuckalavee es el corcel del infierno. Debes fabricar un rastro de despiste para mantenerlo alejado de ti".
 nuckalavee_decision_effect_tooltip:1 "El Nuckalavee no intervendrá en las últimas etapas de tu búsqueda" 
 nuckalavee_decision_confirm:0 "Hazlo"
 gayomart_decision:0 "Tratar con Gayomart"
 gayomart_decision_tooltip:1 "Mover lo inamovible"
 gayomart_decision_desc:0 "El Nictuku Gayomart es el un guerrero inamovible. Debes fabricar un rastro de despiste para mantenerlo alejado de ti".
 gayomart_decision_effect_tooltip:1 "Gayomart no intervendrá en las últimas etapas de tu búsqueda" 
 gayomart_decision_confirm:0 "Hazlo"
 babayaga_bound_modifier:0 "Atado a la bruja"
 babayaga_bound_modifier_desc:1 "Perteneces a Baba Yaga. Incluso mantener tu cordura intacta está siendo un obstáculo".
 POD_anteshuntabsi.5.t:0 "La caza : La ayuda de la abuela"
 POD_anteshuntabsi.5.desc:0 "Has encontrado a Baba Yaga. La escurridiza Nosferatu es tan aterradora como imaginabas, pero tampoco es tonta. Sabe de las posibilidades que trae la Revuelta Anarca y está escuchando tu oferta de alianza para golpear a su temido sire.\NEl silencio después de que terminas de hablar es largo y rallante, y sólo se rompe cuando ella te presenta su brazo. El mensaje es claro, quiere que tomes un sorbo de su sangre, lo que te convertiría en leal a ella.\NEs un costo muy alto a pagar, pero no tienes posibilidades de derrotar a Absimilliard, ¡o incluso de encontrarlo!, sin su ayuda".
 POD_anteshuntabsi.5.a:0 "Si esta es la única manera..."
 POD_anteshuntabsi.5.b:0 "¡Corre como un demonio!"
 POD_anteshuntabsi.5.effect.success.desc:0 "¡Consigues huir!"
 POD_anteshuntabsi.5.critical.failure.effect.desc:0 "Te atrapan..."
 POD_anteshuntabsi.5.critical.failure:0 "¡Al pozo!"
 anteabsi_end_baba:0 "Esta elección pondrá fin a tu búsqueda... y quizás a tu vida"
 POD_anteshuntabsi.6.t:0 "La caza: hacia el bosque"
 POD_anteshuntabsi.6.desc:0 "Tu presa está en algún lugar de las profundidades del bosque ruso. Has reunido a tus compañeros de mayor confianza y Baba Yaga ha hecho lo mismo. En definitiva, es una fuerza formidable la que ahora camina a tu lado pero... Todavía estás lejos de estar seguro.\NAbsimilliard seguro que tiene varias salvaguardas mortales para proteger su lugar de descanso e incluso la propia Hag desconfía de los temidos Nictuku que probablemente te esperan.\NEs el último paso de tu búsqueda, pero podría ser el más difícil."
 POD_anteshuntabsi.6.a:0 "Ya no hay vuelta atrás"
 POD_anteshuntabsi.7.t:0 "La caza : La furia de Darvag"
 POD_anteshuntabsi.7.desc:0 "Mientras te adentras en el denso bosque, tu grupo se ve repentinamente emboscado por una manada de temibles bestias parecidas a los lupinos. Estas criaturas son rápidas y se retiran al bosque después de cada muerte.\N-Esto es así hasta que Darvag Grozny, uno de los lugartenientes de Baba Yaga, carga repentinamente tras ellos. Las bestias fueron sorprendidas y no pudieron huir con la suficiente rapidez. Pronto, el feral Tzimisce se les echó encima y consiguió retenerlos el tiempo suficiente para que tu grupo los hiciera pedazos.\NContinúa tu búsqueda con tu expedición casi intacta."
 POD_anteshuntabsi.7.a:0 "La bruja tiene aliados útiles"
 darvaghelped:0 "Que Darvag Grozny esté vivo te permite saltarte esta parte del viaje"
 POD_anteshuntabsi.8.t:0 "La caza : Furia Bestial"
 POD_anteshuntabsi.8.desc:0 "Mientras te adentras en el denso bosque, tu grupo se ve repentinamente emboscado por una manada de temibles bestias parecidas a los lupinos. Estas criaturas son rápidas y se retiran al bosque después de cada muerte.\NHay que hacer frente a estos implacables ataques, o tu séquito será destrozado de uno en uno. Podrías tenderles una trampa, o preparar una sólida defensa.\NEn cualquier caso, hay que hacer algo, y pronto, ya que oyes a los lobos aullar de nuevo cerca de tu posición..."
 POD_anteshuntabsi.8.a:0 "¡Formad un círculo!"
 POD_anteshuntabsi.8.effect.success.desc:0 "Repeles a los monstruos, tu búsqueda continúa"
 POD_anteshuntabsi.8.critical.failure.effect.desc:0 "Otro que muerde el polvo..."
 POD_anteshuntabsi.8.critical.failure:0 "Te han mordido"
 POD_anteshuntabsi.9.t:0 "La caza : El sacrificio de Gutka"
 POD_anteshuntabsi.9.desc:0 "Hay una criatura gigante que te impide el paso. Esta criatura escamosa, grasienta y desagradable no se parece a nada que hayas encontrado antes. Baba Yaga la describe como su "mascota favorita". Afortunadamente, la bruja tiene una solución: lanzarle la lamentable criatura conocida como "Gutka". Esta cáscara de vampiro te ha estado siguiendo desde tu partida y aparentemente ha encontrado un propósito al ganarte algo de tiempo para eludir a la 'mascota' de Absimilliard.\N¿Quién sabe? El monstruo podría incluso apiadarse de otro monstruo".
 POD_anteshuntabsi.9.a:0 "La bruja tiene aliados útiles"
 gutkahelped:0 "Que la Gutka esté viva te ha permitido saltarte esta parte del viaje"
 POD_anteshuntabsi.10.t:0 "La caza : Mascota de Absimilliard"
 POD_anteshuntabsi.10.desc:0 "Hay una criatura gigante que te impide el paso. Esta criatura escamosa, grasienta y desagradable no se parece a nada que hayas encontrado antes. Baba Yaga la describe como su 'mascota favorita'. Y está en tu camino. No hay manera de evitarlo y tendrás que luchar. Esa cosa podría partirte por la mitad con sólo un golpe de sus manos... garras... lo que sea, pero ya has pasado el punto de no retorno".
 POD_anteshuntabsi.10.a:0 "Debería replantearme mis opciones de vida"
 POD_anteshuntabsi.10.effect.success.desc:0 "Matas al monstruo, tu búsqueda continúa"
 POD_anteshuntabsi.10.critical.failure.effect.desc:0 "Otro que muerde el polvo..."
 POD_anteshuntabsi.10.critical.failure:0 "Te han cortado"
 POD_anteshuntabsi.11.t:0 "La caza : La astucia de Siamko"
 POD_anteshuntabsi.11.desc:0 "Estás perdido. Ya no se puede negar. El bosque te está jugando una mala pasada, cubriendo tus huellas o cambiando de repente los caminos que tienes delante. No tienes un suministro infinito de sangre a tu disposición, así que debes actuar con rapidez.\NAfortunadamente, tienes a uno de los mejores rastreadores de Rusia en tu grupo, Siamko. El inquietante "nieto" de la Bruja no tarda en sacarte de este laberinto antinatural, recordándote lo mucho que necesitabas la ayuda de Baba Yaga en esta búsqueda."
 POD_anteshuntabsi.11.a:0 "La Bruja tiene aliados útiles"
 siamkohelped:0 "Que Siamko esté vivo te ha permitido saltarte esta parte del viaje"
 POD_anteshuntabsi.12.t:0 "La caza : Perdida"
 POD_anteshuntabsi.12.desc:0 "Estás perdido. Ya no se puede negar. El bosque te está jugando una mala pasada, cubriendo tus huellas o cambiando de repente los caminos que tienes delante. No tienes un suministro infinito de sangre a tu disposición, así que debes actuar con rapidez.\NCon vampiros tan viejos y poderosos en tu entorno, calculas que la falta de sustento podría convertirse pronto en un baño de sangre. Debe haber una pista o un patrón en este laberinto que puedas aprovechar para salir antes de que sea demasiado tarde".
 POD_anteshuntabsi.12.a:0 "¿Por aquí... o por allá?"
 POD_anteshuntabsi.12.effect.success.desc:0 "Encuentras una salida, tu búsqueda continúa"
 POD_anteshuntabsi.12.critical.failure.effect.desc:0 "Perdido en el bosque"
 POD_anteshuntabsi.12.critical.failure:0 "No hay salida"
 POD_anteshuntabsi.13.t:0 "La caza : Abraxes"
 POD_anteshuntabsi.13.desc:0 "Mientras continuáis vuestro viaje por el bosque, una densa niebla cae de repente sobre vuestro grupo. Claramente de origen sobrenatural, dificulta mucho vuestro campo de visión, y rápidamente quedáis aislados de vuestros compañeros.\NY es entonces cuando empiezan a producirse los gritos.\NOs están emboscando de uno en uno, vuestro enemigo utiliza la cobertura de esta niebla para aislaros. Si no encontráis una forma de salir de esta situación rápidamente, todo acabará muy pronto."
 POD_anteshuntabsi.13.a:0 "¡Reúnanse a mi alrededor!"
 POD_anteshuntabsi.13.effect.success.desc:0 "El enemigo ya no se atreve a atacar. Su búsqueda continúa".
 POD_anteshuntabsi.13.critical.failure.effect.desc:0 "Otro que muerde el polvo..."
 POD_anteshuntabsi.13.critical.failure:0 "Un final brumoso"
 POD_anteshuntabsi.14.t:0 "La caza : Echidna"
 POD_anteshuntabsi.14.desc:0 "Los vampiros no pueden enfermar. Eso es una de las primeras cosas que aprendiste sobre tu condición hace tiempo. Entonces... ¿por qué te sientes tan mal ahora? Y tampoco eres el único, ya que todo tu grupo parece repentinamente afectado por la nauseabundidad que emana del bosque.\NBaba Yaga cree que esto es obra de Echidna, una de las Nictuku. La bruja está preparando una poción para ayudarte a sobrevivir, pero necesita unos ingredientes muy específicos, y se te acaba el tiempo. Tendrás que ser rápido e impecable".
 POD_anteshuntabsi.14.a:0 "Recogiendo setas para salvar mi vida..."
 POD_anteshuntabsi.14.effect.success.desc:0 "¡Me siento mejor!"
 POD_anteshuntabsi.14.critical.failure.effect.desc:0 "Ese color no se ve bien..."
 POD_anteshuntabsi.14.critical.failure:0 "Un final enfermizo"
 POD_anteshuntabsi.15.t:0 "La caza : Gorgo"
 POD_anteshuntabsi.15.desc:0 "Este maldito bosque te ha puesto de los nervios desde el principio de tu viaje, pero cada vez es peor. Un grito ensordecedor ha comenzado no hace mucho, y parece provenir de todas partes a tu alrededor.\NY tampoco es un simple grito mortal o animal, como pronto te das cuenta cuando la sangre comienza a salir de tus oídos. Debes encontrar la fuente de la misma y eliminarla rápidamente o simplemente serás desangrado. Un destino irónico para una sanguijuela imperecedera".
 POD_anteshuntabsi.15.a:0 "¿Quieres callarte?"
 POD_anteshuntabsi.15.effect.success.desc:0 "Por fin paz y tranquilidad"
 POD_anteshuntabsi.15.critical.failure.effect.desc:0 "No encuentras la fuente lo suficientemente rápido ..."
 POD_anteshuntabsi.15.critical.failure:0 "Un final a gritos"
 POD_anteshuntabsi.16.t:0 "La caza : Nuckalavee"
 POD_anteshuntabsi.16.desc:0 "Tu grupo es atacado por... algo. Una horda de monstruos de aspecto equino ha surgido del bosque y ha pisoteado a varios de tus seguidores. Te has agachado a un lado con suficiente rapidez, pero, a juzgar por el sonido de sus cascos, pronto atacarán por el otro lado.\NSi tu séquito sigue totalmente desorganizado como ahora, es probable que esta horda se limite a pisotearte cada vez que ataque, hasta que no quede nadie en pie. Debes reaccionar rápidamente para cambiar las tornas".
 POD_anteshuntabsi.16.a:0 "¡Prepárate para su carga!"
 POD_anteshuntabsi.16.effect.success.desc:0 "¡Los haces retroceder!"
 POD_anteshuntabsi.16.critical.failure.effect.desc:0 "Te pisotean hasta la muerte"
 POD_anteshuntabsi.16.critical.failure:0 "Te pisotean hasta la muerte"
 POD_anteshuntabsi.17.t:0 "La caza : Gayomart"
 POD_anteshuntabsi.17.desc:0 "Estás cerca del final de tu viaje, puedes sentirlo. Pero hay un nuevo obstáculo en tu camino, los caminos cambiantes del bosque se mueven más rápido, y cada vez tienen menos sentido. Está claro que uno de los Nictuku está jugando contigo, probablemente intentando aislarte, o llevándote a la locura.\NHay límites en cuanto a lo que tu fuerza de voluntad puede aguantar después de un viaje tan arduo, y quieres ponerle fin. Debes encontrar un patrón, una pista o incluso simplemente forzar tu salida de esta ilusión rápidamente".
 POD_anteshuntabsi.17.a:0 "¡Estoy cansado de estos juegos!"
 POD_anteshuntabsi.17.effect.success.desc:0 "Disipas la ilusión"
 POD_anteshuntabsi.17.critical.failure.effect.desc:0 "Estoy tan cansado..."
 POD_anteshuntabsi.17.critical.failure:0 "Perdido en un laberinto"
 POD_anteshuntabsi.18.t:0 "La caza : Vasilisa"
 POD_anteshuntabsi.18.desc:0 "Estás al final de tu viaje, ya que puedes sentir la presencia de Absimilliard cerca. El último obstáculo parece ser una... niña pequeña.\NParece bastante inocente, pero la mirada de puro terror en los ojos de Baba Yaga te dice lo contrario. La bruja no responde, sino que lanza una maldición a la niña, cuya espeluznante sonrisa no hace más que aumentar. Estás en la última pelea, e incluso con Baba Yaga a tu lado, no te gustan mucho tus posibilidades..."
 POD_anteshuntabsi.18.a:0 "¡Una última batalla!"
 POD_anteshuntabsi.18.critical.failure.effect.desc:0 "Tan cerca de la victoria ..."
 POD_anteshuntabsi.18.effect.success.desc:0 "¡Lo has conseguido!"
 POD_anteshuntabsi.18.critical.failure:0 "Travieso y castigado"
 POD_anteshuntabsi.19.t:0 "La caza : ¿Victoria?"
 POD_anteshuntabsi.19.desc:0 "Has derrotado el último obstáculo en tu camino hacia Absimilliard y el gran antiguo yace ante ti, en letargo afortunadamente. Baba Yaga ya ha empezado a chupar su sangre, ejecutando una venganza tramada desde hace milenios.\NComo fuiste útil y leal, te ha prometido una parte de la potente sangre de Antediluviano. No lo suficiente como para convertirte en una amenaza para ella, pero sí para aumentar tu propio poder.\NSin embargo, la bruja está distraída ahora mismo, comiendo con avidez el alma de su sire. Podrías ser capaz de apuñalarla por la espalda y reclamar el premio completo para ti... Pero, ¿y si ella lo está esperando?"
 POD_anteshuntabsi.19.a:0 "Una recompensa más que suficiente"
 POD_anteshuntabsi.19.b:0 "¡Su alma es mía!" 
 POD_anteshuntabsi.19.effect.success.desc:0 "Sorprendes a Baba Yaga"
 POD_anteshuntabsi.19.critical.failure.effect.desc:0 "La codicia no es buena"
 POD_anteshuntabsi.19.critical.failure:0 "La avaricia te ha matado"
 young_third_modifier:0 "El joven tercero"
 young_third_modifier_desc:1 "Eres demasiado joven para ser la amenaza apocalíptica que son los otros de la 3ª generación. Aun así, probablemente seas el vampiro activo más temido y poderoso del mundo."
 POD_anteshuntabsi.20.t:0 "La caza : Victoria"
 POD_anteshuntabsi.20.desc:0 "Has sorprendido a Baba Yaga y la has matado limpiamente antes de que pudiera reaccionar. No tuvo tiempo de consumir el alma de Absimilliard. Como tal, el premio final está justo delante de ti.\NNNNNNnada te detendrá ahora, el poder definitivo está por delante y te convertirás en el ser más poderoso activo en la Tierra... con el tiempo.\NTen cuidado, ya que muchos envidiarán tu poder e intentarán robarlo y el Grandioso cuya alma estás comiendo probablemente intentará tomar el control de tu cuerpo.\NSi consigues sobrevivir a estas pruebas entonces... el mundo será realmente tu patio de recreo."
 POD_anteshuntabsi.20.a:0 "Lo he hecho"














