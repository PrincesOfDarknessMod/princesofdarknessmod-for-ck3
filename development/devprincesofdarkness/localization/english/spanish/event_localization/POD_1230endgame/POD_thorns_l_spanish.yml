l_spanish:

 PODthorns.0002.t:0 "La Convención de las Espinas"
 PODthorns.0002.desc:0 "Mientras la Revuelta Anarquista hace estragos en el mundo cainita, ayudada por la todavía presente Inquisición, se ha producido un hecho sin precedentes. Varios ancianos de varios clanes han convocado una reunión de paz, y el establecimiento de una nueva organización para los Kindred.\NEsta organización, la Camarilla, sería una secta inclusiva que se ocuparía de proteger la Mascarada y las relaciones entre ancianos y neonatos. Mucha gente, especialmente entre los Anarcas, desconfía de esta iniciativa, pero ya es un éxito político sorprendente, ya que representantes de casi toda Europa se están reuniendo para hablar de esta propuesta.\NEl futuro de los Kindred podría decidirse en esta pequeña ciudad inglesa en las próximas noches."
 PODthorns.0002.a:0 "El cambio se acerca"
 thorn_begins_effect_message:0 "Cada clan elegirá una postura respecto a esta propuesta. Si eres lo suficientemente fuerte, podrías ser el representante de tu propio clan". 
 PODthorns.0003.t:0 "Espinas: El Ventrue"
 PODthorns.0003.desc:0 "Las viejas costumbres son inmortales y, como tal, es el Clan Ventrue el que abrirá la Convención. Muchos esperan que los Reyes encuentren una forma de asegurar su liderazgo sobre cualquier nueva secta. También es muy probable que su elección afecte a sus tradicionales rivales como gobernantes de la noche, los Lasombra y los Tzimisce."
 PODthorns.0003.a:0 "La Camarilla es el futuro"
 PODthorns.0003.b:0 "¡Nunca formaremos parte de esta locura!"
 PODthorns.0003.c:0 "La neutralidad es la clave de nuestra supervivencia"
 choose_camarilla_effect_message:0 "Si te unes a la Camarilla, la mayoría del clan te seguirá" 
 choose_opposition_effect_message:0 "Te pones en la oposición, uniéndote a los Anarcas con la mayoría de tu clan" 
 choose_independance_effect_message:0 "Nada cambia para ti ni para tu clan" 
 PODthorns.0004.t:0 "Espinas: Camarilla Ventrue"
 PODthorns.0004.desc:0 "En un movimiento no tan sorprendente, los Ventrue se han alineado con la naciente Camarilla, probablemente esperando tomar las riendas del poder mientras puedan. La Convención continúa mientras los otros representantes discuten este movimiento".
 PODthorns.0004.a:0 "Una victoria para la Camarilla"
 PODthorns.0004.b:0 "¡Debo unirme a ellos!"
 PODthorns.0005.t:0 "Espinas : Oposición Ventrue"
 PODthorns.0005.desc:0 "Sorprendente giro de los acontecimientos en la fase inicial de la Convención de Thorns, ya que el representante de Ventrue ha abandonado la mesa de negociación, calificando todo el proceso de triste broma. Parece que el Clan Ventrue no tomará parte en la Camarilla y se ha alineado con la oposición anarquista, quizás con la esperanza de poner orden en el movimiento hasta ahora sin líder."
 PODthorns.0005.a:0 "Una victoria para la oposición"
 PODthorns.0006.t:0 "Espinas: Ventrue Neutral"
 PODthorns.0006.desc:0 "Sorprendente giro de los acontecimientos en la apertura de la Convención de Thorns, ya que el representante Ventrue ha anunciado la total neutralidad de su clan para el futuro inmediato. ¿Quizás los Ventrue no estaban en condiciones de reclamar el liderazgo sobre las sectas emergentes? Eso es lo que reclaman los envalentonados negociadores Lasombra y Tzimisce, que ahora huelen la oportunidad de asumir ellos mismos un papel de liderazgo."
 PODthorns.0006.a:0 "¿Qué hace que un clan se vuelva neutral?"
 PODthorns.0007.t:0 "Espinas: Los Lasombra"
 PODthorns.0007.desc:0 "Mientras el representante de los Lasombra prepara su declaración, muchos esperan que los Magisters estén en el lado opuesto de los Ventrue. Después de todo, sólo puede haber un número determinado de clanes gobernantes en una secta".
 PODthorns.0008.t:0 "Espinas: Camarilla Lasombra"
 PODthorns.0008.desc:0 "En un apasionado discurso, el representante de Lasombra declara a su clan totalmente a favor de la naciente Camarilla. Ya está esbozando un plan para sus instituciones, aparentemente siguiendo la jerarquía de la Iglesia mortal, muchos esperan que los Magisters estén en el asiento principal de la nueva secta."
 PODthorns.0009.t:0 "Espinas: Oposición Lasombra"
 PODthorns.0009.desc:0 "Parece que la Camarilla tendrá un poderoso enemigo en la forma del Clan Lasombra. Su representante ha maldecido la propuesta de resolución y ha abandonado la Convención a toda prisa. Reunidos en torno a la causa anarca, los Magisters ya están preparando un borrador para su propia nueva secta."
 PODthorns.0010.t:0 "Espinas: Neutral Lasombra"
 PODthorns.0010.desc:0 "Parece que el Clan Lasombra ha terminado de pretender el trono de gobernantes de la noche. Mientras su representante anuncia su elección de neutralidad, otros ya teorizan que los Magister centrarán ahora sus esfuerzos en asuntos más sombríos y místicos."
 PODthorns.0011.t:0 "Espinas: La Brujah"
 PODthorns.0011.desc:0 "Una gran mayoría del movimiento anarquista original, los miembros del Clan Brujah, aún están bastante divididos sobre cómo abordar la Convención. Algunos la ven como una rendición humillante, otros como la posibilidad de un tratado de paz honorable. Con una visión tan dividida, y apasionada, de la negociación, será su representante quien tenga la voz decisiva."
 PODthorns.0012.t:0 "Espinas: Camarilla Brujah"
 PODthorns.0012.desc:0 "Finalmente, los Brujah han depuesto las armas. Ha sido un proceso largo y arduo, pero se ha firmado la paz. El clan es ahora parte integrante de la Camarilla, a pesar de las quejas de sus partidarios."
 PODthorns.0013.t:0 "Espinas: Oposición Brujah"
 PODthorns.0013.desc:0 "La guerra nunca cambia, al igual que la Brujah. El clan rebelde se ha negado a renunciar y a firmar un tratado de paz con la naciente Camarilla. La Revuelta Anarca continúa, pero algunos están estudiando la posibilidad de reformar el movimiento dividido en una secta más cohesionada, para continuar mejor la lucha."
 PODthorns.0014.t:0 "Espinas: Neutral Brujah"
 PODthorns.0014.desc:0 "Pocos podían predecir el resultado de la negociación del Clan Brujah. En un discurso decidido, su representante ha dicho simplemente que no volverán a inclinarse ante otra autoridad. Así, los Brujah salen de la convención tan divididos como entraron en ella".
 PODthorns.0015.t:0 "Espinas: El Malkavian"
 PODthorns.0015.desc:0 "Seamos sinceros. Nadie tiene pistas de la postura que adoptará el Clan Malkavian durante la convención, probablemente ni siquiera su representante. Aun así, por muy peligrosos que sean, los lunáticos no deben ser subestimados, y son cortejados por las numerosas facciones aquí reunidas."
 PODthorns.0016.t:0 "Espinas: Camarilla Malkavian"
 PODthorns.0016.desc:0 "El clan Malkav se ha unido a la Camarilla ante el prudente aplauso de los representantes de esta secta. Aunque algunos llamarían a esta ayuda una maldición, la naciente Camarilla parece satisfecha de tener a los peligrosos profetas de su lado."
 PODthorns.0017.t:0 "Espinas: Oposición Malkavian"
 PODthorns.0017.desc:0 "Parece que el Clan Malkav ha previsto... algo importante sobre la Revuelta Anarca al parecer. Su representante, en una descripción un tanto escabrosa de un evento apocalíptico, ha unido oficialmente a su clan a la causa de la rebelión. Los anarcas, por su parte, están tan sorprendidos como los demás por este repentino giro de los acontecimientos."
 PODthorns.0018.t:0 "Espinas: Neutral Malkavian"
 PODthorns.0018.desc:0 "Volviendo a sus raíces como clan de profetas y consejeros, los Malkavian han declarado su neutralidad en el conflicto en curso. Parece que todo el mundo tendrá el dudoso placer de manejarlos en el futuro".
 PODthorns.0019.t:0 "Espinas: El Toreador"
 PODthorns.0019.desc:0 "Aunque Miguel hace tiempo que se fue, los Toreador siguen siendo un poderoso clan con una sólida base de poder en toda Europa. Como fueron los primeros en proponer la idea de la Mascarada forzada para la Camarilla, probablemente elegirán esta secta. Pero su naturaleza apasionada también puede acercarlos a la Revuelta..."
 PODthorns.0020.t:0 "Espinas: Camarilla Toreador"
 PODthorns.0020.desc:0 "Como era de esperar, el Clan Toreador se ha unido formalmente a la Camarilla, su preocupación por el cumplimiento de la Mascarada ha pesado más que su espíritu apasionado."
 PODthorns.0021.t:0 "Espinas: Oposición Toreador"
 PODthorns.0021.desc:0 "La pasión y la emoción ardientes han ganado la partida, ya que el representante de los Toreador ha pronunciado un encendido discurso alabando la causa anarca. Parece que la tradicional alianza de los Toreador con los clanes gobernantes ha terminado, por ahora."
 PODthorns.0022.t:0 "Espinas: Toreador neutral"
 PODthorns.0022.desc:0 "Sorprendiendo a todos, el representante de los Toreador ha anunciado la neutralidad de su clan para el futuro inmediato. ¿Quizás los Roses se han hartado de la guerra y la rebelión?"
 PODthorns.0023.t:0 "Espinas: Los Tremere"
 PODthorns.0023.desc:0 "Los Magii han hecho una entrada explosiva en el mundo de la política Kindred y a muchos no les gustaría nada más que verlos aplastados para siempre. Es probable que se unan a la Camarilla, esperando encontrar refugio en ella, a cambio de su poderoso dominio de la hechicería de sangre a disposición de la secta."
 PODthorns.0024.t:0 "Espinas: Camarilla Tremere"
 PODthorns.0024.desc:0 "Como la mayoría de la convención esperaba, los Tremere han jurado su lealtad a la Camarilla. Muchos los ven ya como el verdadero poder detrás del trono en la naciente secta."
 PODthorns.0025.t:0 "Espinas: Oposición Tremere"
 PODthorns.0025.desc:0 "Sorprendente acontecimiento en la Convención, ya que los Tremere han anunciado su apoyo al Movimiento Anarquista. ¿Es esto un fallo en su pirámide o parte de un plan mayor?"
 PODthorns.0026.t:0 "Espinas: Neutral Tremere"
 PODthorns.0026.desc:0 "Parece que los Magos no se inclinarán ante nadie más que ante los suyos, ya que su representante ha anunciado su neutralidad en el conflicto actual. Sin duda, sus servicios como hechiceros mercenarios serán muy solicitados".
 PODthorns.0027.t:0 "Espinas: Los Tzimisce"
 PODthorns.0027.desc:0 "Se espera que el poderoso clan de los Fiendos del Este se posicione en contra de los odiados enemigos Tremere. La neutralidad también es una opción considerada seriamente por muchos de sus miembros más antiguos, ya que en su mayoría no les importa el mundo fuera de sus sombríos castillos."
 PODthorns.0028.t:0 "Espinas: Camarilla Tzimisce"
 PODthorns.0028.desc:0 "Aunque el debate fue muy reñido, el Clan Tzimisce aceptó unirse a la Camarilla. Sin embargo, aún quedan muchos detalles por debatir, como la Mascarada en Transilvania..."
 PODthorns.0029.t:0 "Espinas: Oposición Tzimisce"
 PODthorns.0029.desc:0 "La confusión y el enfado corren como la pólvora en la Convención de Thorns, ya que el representante de Tzimisce acaba de lanzar una parte de su anatomía de gran tamaño a uno de sus oponentes antes de salir furioso. Parece que a los tzimisce no les gusta la propuesta de la Camarilla".
 PODthorns.0030.t:0 "Espinas: Tzimisce neutral"
 PODthorns.0030.desc:0 "Los miembros más antiguos del clan Tzimisce parecen haber ganado el debate interno, ya que su representante acaba de anunciar la neutralidad de los Fiends en la guerra en curso. Muchos han expresado su preocupación por el estado de la Mascarada en Transilvania con tal decisión."
 PODthorns.0031.t:0 "Espinas: El Gangrel"
 PODthorns.0031.desc:0 "Los Gangrel ya no pueden negarlo, su mundo está muriendo. No importa su destreza bajo el cielo nocturno, sus mortales se han dejado llevar por la Cruz o la Media Luna. En este entorno que cambia rápidamente, muchos buscan un lugar al que pertenecer. A todas las facciones les gustaría ser ese lugar".
 PODthorns.0032.t:0 "Espinas: Camarilla Gangrel"
 PODthorns.0032.desc:0 "El representante de Gangrel ha aceptado a regañadientes unirse a la Camarilla. Quizá el clan encuentre ahora un nuevo propósito como ejecutores y sabuesos de esta secta."
 PODthorns.0033.t:0 "Espinas: Oposición Gangrel"
 PODthorns.0033.desc:0 "Algunos dirían que los Gangrel han cedido a su lado salvaje, ya que han optado por comprometer su apoyo a la causa anarca, quizás buscando una guerra que merezca la pena. Una tremenda ventaja para los rebeldes en cualquier caso".
 PODthorns.0034.t:0 "Espinas: Gangrel Neutral"
 PODthorns.0034.desc:0 "El receloso Clan Gangrel parece estar harto de este extraño y nuevo mundo al que se ven arrojados. Declarando su neutralidad, sólo ellos elegirán el próximo objetivo de su interminable caza."
 PODthorns.0035.t:0 "Espinas: El Nosferatu"
 PODthorns.0035.desc:0 "A primera vista, los Nosferatu parecen muy aficionados a la idea de la Camarilla. Siempre buscando protección contra los horrores de su progenitor, buscan la fuerza en el número. Sin embargo, con una diplomacia astuta, podrían encontrarla en una solución diferente".
 PODthorns.0036.t:0 "Espinas: Camarilla Nosferatu"
 PODthorns.0036.desc:0 "No fue una gran sorpresa cuando el representante de los Nosferatu anunció el apoyo total de su clan a la naciente Camarilla. La nueva secta puede contar con una leal y poderosa red de informantes a partir de ahora."
 PODthorns.0037.t:0 "Espinas: Oposición Nosferatu"
 PODthorns.0037.desc:0 "Sorprendente noticia durante la Convención de Thorns, los Nosferatu se han unido al movimiento Anarca. Muchos se preguntan si los Ocultos tienen alguna información secreta que ha inclinado la balanza contra la Camarilla..."
 PODthorns.0038.t:0 "Espinas: Neutral Nosferatu"
 PODthorns.0038.desc:0 "Pasaron varias noches antes de que se notara, pero el representante de los Nosferatu ha desaparecido de la Convención. Parece que los Ocultos no participarán en el nacimiento de las sectas".
 PODthorns.0039.t:0 "Espinas: Los seguidores de Set"
 PODthorns.0039.desc:0 "Aunque han sido invitados oficialmente a unirse a la Camarilla, nadie espera realmente que los hijos de Set acepten. Sus formas místicas los hacen muy contrarios al marco propuesto para la nueva secta."
 PODthorns.0040.t:0 "Espinas: Camarilla Setites"
 PODthorns.0040.desc:0 "Mientras el representante de los Seguidores de Set acepta la propuesta de unirse a la Camarilla ante un público atónito, todos se preguntan ya cuál es el motivo ulterior de esta elección. ¿Acaba de ser aceptada la serpiente en el jardín?"
 PODthorns.0041.t:0 "Espinas: Oposición Setites"
 PODthorns.0041.desc:0 "Parece que la creación de la Camarilla, una autoridad centralizada para los vampiros, ha enfadado a los setitas más de lo que nadie esperaba. Hablando de la percepción de Set como "Gran Libertador", su representante ha comprometido al clan con la causa del Anarca".
 PODthorns.0042.t:0 "Espinas: Setites neutrales"
 PODthorns.0042.desc:0 "Rechazando cortésmente la oferta a medias de la Camarilla, el representante de los Setites ha hecho lo que todos pensaban que era el resultado más probable: confirmar la neutralidad de su clan en la lucha en curso."
 PODthorns.0043.t:0 "Espinas: El Asamita"
 PODthorns.0043.desc:0 "Mientras la expansión de los otomanos amenaza a Europa, la naciente Camarilla está dividida sobre cómo manejarla. Los assamitas han sido muy activos a la sombra de los turcos, y la Convención de las Espinas será una oportunidad para que ambos bandos intenten al menos resolver sus diferencias."
 PODthorns.0044.t:0 "Espinas: Camarilla Assamite"
 PODthorns.0044.desc:0 "En un sorprendente despliegue de diplomacia por parte de ambas facciones, los Assamitas y la Camarilla han llegado a un acuerdo pionero, que incorpora a los Hijos de Haqim a la nueva secta. Se abre una nueva era de relaciones entre Oriente y Occidente".
 PODthorns.0045.t:0 "Espinas : Oposición Assamita"
 PODthorns.0045.desc:0 "Las conversaciones se han roto entre la Camarilla y los Assamitas. Parece que toda la Convención ha empeorado las cosas, ya que los Hijos de Haqim han prometido su ayuda al movimiento anarquista, con la esperanza de destrozar el viejo, y nuevo, orden de los cainitas europeos."
 PODthorns.0046.t:0 "Espinas: Neutral Assamite"
 PODthorns.0046.desc:0 "Mientras el representante asamita abandona la Convención, nada ha cambiado mucho. La tenue neutralidad de los Hijos de Haqim en los asuntos de los cainitas occidentales continúa".
 PODthorns.0047.t:0 "Espinas : El Capadocio"
 PODthorns.0047.desc:0 "El Clan de la Muerte siempre ha estado dividido, y ha soportado muchas purgas y reestructuraciones. Aun así, siempre ha sido un clan respetado y, a pesar de sus hábitos de reclusión, ha recibido a partir de ahora una invitación formal para unirse a la Camarilla."
 PODthorns.0048.t:0 "Espinas: Camarilla Cappadocian"
 PODthorns.0048.desc:0 "Tras una larga discusión, parece que la Camarilla y el Clan de la Muerte han llegado a un acuerdo. La naciente secta tiene un miembro más, y ya se felicita por este logro."
 PODthorns.0049.t:0 "Espinas: Oposición Cappadocian"
 PODthorns.0049.desc:0 "Aunque nadie está muy seguro de lo que ha pasado exactamente, las conversaciones entre la Camarilla y el Clan de la Muerte se han vuelto completamente contraproducentes. Sintiéndose insultados y maltratados, han optado por unir fuerzas con el movimiento anarquista, que está bastante sorprendido por este repentino apoyo."
 PODthorns.0050.t:0 "Espinas: Neutral Cappadocian"
 PODthorns.0050.desc:0 "Como la mayoría de la gente de la Convención esperaba, el Clan de la Muerte ha declarado su neutralidad en el conflicto en curso. Seguirán siendo el misterioso y solitario grupo de eruditos que siempre han sido".
 PODthorns.0051.t:0 "Espinas: Los Salubri"
 PODthorns.0051.desc:0 "A pesar de sus muchos enemigos, los Salubri siguen siendo una fuerza a tener en cuenta. Han resistido hasta esta noche y, obviamente, fueron invitados a la Convención. La mayoría espera que tomen el lado opuesto al odiado clan Tremere, pero la neutralidad también es una gran posibilidad, ya que la guerra interminable ya les ha costado mucho."
 PODthorns.0052.t:0 "Espinas: Camarilla Salubri"
 PODthorns.0052.desc:0 "La Camarilla se felicita porque el Salubri se une oficialmente a ellos. Ya se han comprometido a ayudar a frenar la campaña de desinformación que se está llevando a cabo sobre sus nuevos aliados, y a devolverles su verdadero lugar como clan de Sanadores."
 PODthorns.0053.t:0 "Espinas: Oposición Salubri"
 PODthorns.0053.desc:0 "Retribución es el nombre del momento para el clan Salubri. Quieren vengarse de todos los horrores que han sufrido, y han encontrado nuevos aliados en el Movimiento Anarquista. Tal vez su sufrimiento común los unió".
 PODthorns.0054.t:0 "Espinas: Neutral Salubri"
 PODthorns.0054.desc:0 "Su lucha por la supervivencia le ha costado mucho al clan Salubri. Es hora de que se curen, tanto el alma como el cuerpo". Con estas palabras, su representante confirma la neutralidad del clan en la crisis actual."
 PODthorns.0055.t:0 "Espinas: Los Ravnos"
 PODthorns.0055.desc:0 "Los Ravnos siempre han sido ajenos a los cainitas occidentales, pero este estado de cosas está cambiando rápidamente a medida que el clan indio está cada vez más presente en Europa. Como guiño a esta nueva fuerza, han sido invitados a la Convención, aunque la mayoría de la gente piensa que se mantendrán en una cauta neutralidad en la guerra en curso."
 PODthorns.0056.t:0 "Espinas: Camarilla Ravnos"
 PODthorns.0056.desc:0 "En un momento trascendental, los Ravnos realizan su movimiento más crucial en Europa hasta el momento: han decidido unirse a la naciente Camarilla. Un cauto optimismo se respira en la secta ante el anuncio de esta alianza."
 PODthorns.0057.t:0 "Espinas: Oposición Ravnos"
 PODthorns.0057.desc:0 "Para sorpresa de todos, el Clan Ravnos se ha puesto del lado del Movimiento Anarquista. ¿Es la consecuencia del mal trato que recibieron de los Príncipes de Occidente al llegar a Europa? Pocos pueden responder, pero los anarcas están recibiendo a sus nuevos hermanos con los brazos abiertos."
 PODthorns.0058.t:0 "Espinas: Neutral Ravnos"
 PODthorns.0058.desc:0 "Como la mayoría esperaba, los Ravnos han confirmado su neutralidad en la guerra entre ancianos y neonatos. El clan indio está jugando el juego largo, y todavía está en el arduo proceso de ser aceptado en estas tierras lejanas."
 PODthorns.0059.t:0 "Espinas: El Caitiff"
 PODthorns.0059.desc:0 "Los Caitiff eran un mero rumor hace dos siglos, y cazados hasta la muerte si alguna vez aparecían en una ciudad. Pero los tiempos han cambiado y ya no se les puede ignorar. Se han autoinvitado a la Convención y se espera que ayuden al Movimiento Anarquista, que comparte muchas de sus quejas."
 PODthorns.0060.t:0 "Espinas: Camarilla Caitiff"
 PODthorns.0060.desc:0 "Impactante acontecimiento en la Convención ya que los Caitiff se han unido a la Camarilla. Tras muchos debates y cambios en la propuesta de constitución oficial de la secta, las dos facciones han llegado a un acuerdo. Un nuevo amanecer brilla para los oprimidos de la raza cainita".
 PODthorns.0061.t:0 "Espinas: Oposición Caitiff"
 PODthorns.0061.desc:0 "El Movimiento Anarquista se encuentra reforzado con la lealtad de los Caitiff. No es realmente una sorpresa, ya que comparten en su mayoría las mismas quejas y enemigos, pero sigue siendo una poderosa ayuda para la causa de los neonatos."
 PODthorns.0062.t:0 "Espinas: Caitiff neutral"
 PODthorns.0062.desc:0 "Los Caitiff han elegido un curso de acción prudente en la Convención. A pesar de sus recelos con la Camarilla, intentan no antagonizarla más anunciando su neutralidad."
 PODthorns.0063.t:0 "Espinas: el fin"
 PODthorns.0063.desc:0 "Mientras los últimos representantes abandonan la zona de la convención, todos planean ya su próximo movimiento. La Camarilla aún no ha logrado su planeada supremacía total sobre la raza Kindred. La Oposición está hablando de reformar el Movimiento Anarquista en una nueva organización para contrarrestar a la Camarilla. Por último, los neutrales están preparando pactos y alianzas para asegurar su supervivencia. Comienza una nueva era de la historia cainita, con un futuro incierto por delante".
 PODthorns.0063.a:0 "¿Cuál será el siguiente movimiento del Gran Juego?"
                                         
     

   
 
