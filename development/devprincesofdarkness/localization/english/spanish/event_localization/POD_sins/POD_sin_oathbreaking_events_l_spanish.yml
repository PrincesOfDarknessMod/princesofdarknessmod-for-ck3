 POD_sin_oathbreaking.100.t:0 "Rompe la tregua, rompe el juramento"
 POD_sin_oathbreaking.100.desc:0 "Tus violaciones de la tregua se han extendido mucho. Ahora se te conoce como un rompejuramentos. Esto es malo. Algunos incluso lo consideran un crimen".
 POD_POD_sin_oathbreaking.100.a:0 "Mis palabras no son mis vínculos"
 

