l_spanish:

 pod_knights.1.t:0 "El campeón arrogante"
 pod_knights.1.desc:0 "Te han informado de que uno de tus campeones se ha descuidado recientemente. Involucrado en una pelea con mortales, [knight.GetSheHe] utilizó los poderes de la sangre para aplastarlos fácilmente, una clara violación de la Mascarada. Peor aún, [knight.GetSheHe] luego se jactó de ello en la ciudad. Este comportamiento seguramente atraerá la mirada indeseada de la Inquisición, pero aún podrías salvar la situación si cortas tu asociación con este molesto fanfarrón".
 pod_knights.1.a:0 "¡Fuera de mi vista, idiota!"
 pod_knights.1.b:0 "Estás perdonado, esta vez"
 pod_knights.2.t:0 "El Campeón Engañoso"
 pod_knights.2.desc:0 "Uno de tus campeones ha sido un verdadero dolor de cabeza durante bastante tiempo. Difundiendo rumores tras rumores, pensaste durante un tiempo que [knight.GetSheHe] estaba preparando algún complot contra ti. Pero después de una cuidadosa investigación, estás bastante seguro de que lo hace más por gusto que por algún motivo ulterior.\NAún así, se trata de una clara amenaza para tu credibilidad y es posible que quieras tomar medidas más pronto que tarde."
 pod_knights.2.a:0 "¡Vete, chismoso molesto!"
 pod_knights.2.b:0 "...Demasiado importante como para desecharlo sin más, por desgracia"
 pod_knights.3.t:0 "El Campeón iracundo" 
 pod_knights.3.desc:0 "No sabes cómo empezó realmente. Pero uno de tus campeones, conocido por ser bastante fogoso, ha entrado en frenesí en medio de tu corte por un insulto insignificante o algo parecido. Tienes dos opciones, podrías llamar a los guardias y a tus otros guerreros para someter a este berserker. Aunque, tal vergüenza social probablemente significaría que [knight.GetSheHe] nunca volverá a estar a tu servicio.\NO podrías simplemente dejar que el frenesí siga su curso, sin importarte las víctimas potenciales del mismo..."
 pod_knights.3.a:0 "Echar a esta bestia de mi vista"
 pod_knights.3.b:0 "Es hora de sacrificar a los vasallos, supongo"
 pod_knights.4.t:0 "El campeón Craven" 
 pod_knights.4.desc:0 "Uno de tus campeones es un conocido cobarde. Siempre buscando una forma de salir de las peleas, [knight.GetSheHe] se ha convertido en el hazmerreír de tu corte, aunque ninguno se atreve a decirlo en voz alta... todavía. Está claro que esto cambiará muy pronto, y será toda una mancha para tu prestigio acoger a un individuo así.\NPodrías simplemente soportarlo, o apartar al cobarde de tu servicio antes de que se convierta en un problema."
 pod_knights.4.a:0 "Espantar a este idiota de mi corte"
 pod_knights.4.b:0 "Que hablen, no me importa"
 pod_knights.5.t:0 "El campeón codicioso" 
 pod_knights.5.desc:0 "Es la cuarta vez en este mes que uno de tus campeones pide más dinero. Ya no sabes si se trata de armaduras, armas o caballos. O tal vez [knight.GetSheHe] ni siquiera se preocupó de ocultar la pura avaricia esta vez.\N-Evidentemente, tienes derecho a hacer que se detenga aquí y ahora, pero ¿acaso estás valorando más la destreza marcial que el oro?"
 pod_knights.5.a:0 "Echa a este codicioso bastardo de mi corte"
 pod_knights.5.b:0 "Tendrás tu maldito caballo, o armadura, lo que sea"
 pod_knights.6.t:0 "El campeón paranoico" 
 pod_knights.6.desc:0 "Uno de tus campeones está acusando... bueno, a casi todos de conspirar contra tu legítimo gobierno. Ya sean mortales, cortesanos, vasallos o transeúntes al azar. Estás bastante seguro de que esto es una ligera simplificación de la situación, pero... quizá [knight.GetSheHe] tenga algo de razón. Tus consejeros te dicen que eches a esta mala influencia de tu corte, pero... ¡¿quizá ellos también están en esta conspiración global?!"
 pod_knights.6.a:0 "Aunque tienen un punto..."
 pod_knights.6.b:0 "¡Traidores! En todas partes!"
 pod_knights.7.t:0 "El campeón cínico" 
 pod_knights.7.desc:0 "Siempre el abogado del diablo, uno de tus campeones está constantemente molestando a la corte, y a ti mismo, sobre la hipocresía de los Caminos y la inevitable victoria de la Bestia sobre todos los cainitas al final. Algunos de tus cortesanos te han pedido que retires a este cínico personaje de tu entorno antes de que sus discursos empiecen a erosionar la fuerza de voluntad de todos tus seguidores."
 pod_knights.7.a:0 "La salvación del alma no tiene precio"
 pod_knights.7.b:0 "...pero puede esperar un poco más"
 pod_knights.8.t:0 "El campeón vengativo" 
 pod_knights.8.desc:0 "Un campeón ha acudido a ti, pidiendo venganza contra un desaire percibido [knight.GetSheHe] soportado en un pueblo cercano. Sabes que este personaje es muy apasionado en estos asuntos y esto podría llegar lejos, muy lejos. Pero también sabes que [knight.GetSheHe] no se tomará a bien que le digas que no a esta petición..."
 pod_knights.8.a:0 "Ocúpate de esto tú mismo"
 pod_knights.8.b:0 "Ayudaré, pero no quemaremos todo el lugar... Al menos no del todo"

   
   
   
   
   
   
  
   
   
  
 
