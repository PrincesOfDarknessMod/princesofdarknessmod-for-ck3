l_spanish:

 POD_auspex.100.t:0 "Invasión psíquica"
 POD_auspex.100.desc:0 "[actor.GetTitledFirstName] está intentando robar tus secretos de tu mente".
 POD_auspex.100.option.a:0 "Ejercer mi fuerza de voluntad para resistir el ataque telepático".
 POD_auspex.100.option.b:0 "Luchar contra la intrusión psíquica".
 POD_auspex.100.option.c:0 "Aceptar la intrusión psíquica".
 
 POD_auspex.200.t:0 "Lectura de la mente [recipient.GetFirstNameNoTooltip]"
 POD_auspex.200.desc:0 "Ha llegado el momento de invadir la psique de [recipient.GetTitledFirstName], pero [recipient.GetSheHe] se resiste."
 POD_auspex.200.option.a:0 "Despierta la sangre para espiar a [recipient.GetHerHim]".
 POD_auspex.200.a.tt_willpower:0 "[recipient.GetFirstNameNoTooltip] ha ejercido su voluntad para resistirse a tu telepatía."
 POD_auspex.200.a.tt_fortitude:0 "[recipient.GetFirstNameNoTooltip] es experto en la disciplina de la fortaleza y se resiste a su manipulación."
 POD_auspex.200.a.success.desc:0 "Victoria"
 POD_auspex.200.a.tt_success:0 "¡Los secretos de [recipient.GetTitledFirstName] serán conocidos por mí!"
 POD_auspex.200.a.failure.desc:0 "Derrota"
 POD_auspex.200.a.tt_failure:0 "[recipient.GetTitledFirstName] se resistió a mi intento de espionaje telepático."
 POD_auspex.200.option.b:0 "Despierta la sangre y ejerce mi voluntad. Mi mente lo verá todo".
 POD_auspex.200.option.b.tt.beast:0 "#¡R [recipient.GetSheHe|U] debe resquebrajarse bajo nuestro poder mental! #"
 POD_auspex.200.option.c:0 "Abandona este esfuerzo, ya no deseo espiar psíquicamente a [recipient.GetHerHim]".
 POD_auspex.200.option.c.tt:0 "La telepatía fracasará".
 POD_auspex.200.option.c.tt.beast:0 "#R ¡Como la presa, estamos ciegos! #"
 
 POD_auspex.300.t:0 "La mente de [receptor.GetFirstNameNoTooltip] ha sido violada"
 POD_auspex.300.desc:0 "He aprendido el secreto de [recipient.GetTitledFirstName] de los susurros de la mente de [recipient.GetHersHis]."
 POD_auspex.300.option.a:0 "Es como debe ser".
 POD_auspex.300.option.a.tt.beast:0 "#R Ahora, ¿qué hacer con este dulce conocimiento? #"

 POD_auspex.400.t:0 "Tu mente ha sido violada"
 POD_auspex.400.desc:0 "Habiendo perdido la batalla de voluntades contra [actor.GetTitledFirstName], tus secretos son ahora conocidos por [actor.GetHerHim]". 
 POD_auspex.400.option.a:0 "Mi mente ya no es mi santuario"
 
 POD_auspex.500.t:0 "Espionaje telepático resistido"
 POD_auspex.500.desc:0 "[recipient.GetTitledFirstName] ha resistido mi intento de espiar a [recipient.GetHerHim]" 
 POD_auspex.500.option.a:0 "¡Frustrado!"
 POD_auspex.500.option.a.tt.beast:0 "#R ¡Consigamos más sangre y volvamos a intentarlo! #"

 POD_auspex.600.t:0 "Espionaje telepático resistido"
 POD_auspex.600.desc:0 "[actor.GetTitledFirstName] ha abandonado el intento de [actor.GetTitledHerHis] de invadir tu mente". 
 POD_auspex.600.option.a:0 "¡Mi mente es mía!"

 

