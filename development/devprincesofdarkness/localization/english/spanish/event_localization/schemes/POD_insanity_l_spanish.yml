 POD_insanity.001.option.d:0 "La verdad derrumbará las vanas esperanzas de [defender.GetHerHis]"
 POD_insanity.001.option.d.tt:0 "Duelo de mayordomos entre tú y [defender.GetFirstName]"
 POD_insanity.001.option.d.tt.beast:0 "#R ¡Oh, cruel verdad! #"
 POD_insanity.001.option.e:0 "No hay regalos para [defender.GetHerHim]"
 POD_insanity.001.option.e.tt:0 "Detendrás tus intentos de infligir locura a [defender.GetFirstName]"
 POD_insanity.001.option.e.tt.beast:0 "#R ¿Por qué te detienes, tonto? #"  
     
