 POD_insanity.001.t:0 "Regalos de locura"
 POD_insanity.001.desc:0 "¡Todo está listo, ahora puedo compartir mi locura con [defender.GetFirstName]! [defender.GetSheHe|U] estará agradecido por estos regalos, ¿verdad [defender.GetSheHe]?"
 POD_insanity.001.option.a:0 "¡Un regalo de saber, eso es lo que necesita [defender.GetSheHe]!"
 POD_insanity.001.option.a.tt:0 "Duelo de aprendizaje entre tú y [defender.GetFirstName]"
 POD_insanity.001.option.a.tt.beast:0 "¡La maldición de saber romperá la mente de [defender.GetHerHis]! #"
 POD_insanity.001.option.b:0 "Sombras, ¿hablan?"
