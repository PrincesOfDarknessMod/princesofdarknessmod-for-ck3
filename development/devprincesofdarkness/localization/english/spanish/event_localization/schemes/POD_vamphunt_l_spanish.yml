l_spanish:

 POD_vamphunt.1.t:0 "¡Sangre!"
 POD_vamphunt.1.desc:0 "Has rastreado a tu presa. Das el primer mordisco y [target.GetSheHe] sucumbe al beso. ¿Cuánta sangre vas a beber?"
 POD_vamphunt.1.option.a:0 "No tomes ninguna. Deja que [target.GetHerHim] salga ileso".
 POD_vamphunt.1.option.b:0 "Toma un poco. Sólo un sorbo".
 POD_vamphunt.1.option.c:0 "Toma un trago. [target.GetSheHe|U] se debilitará pero estará bien".
 POD_vamphunt.1.option.d:0 "Toma mucho, hiriendo a [target.GetHerHim]".
 POD_vamphunt.1.option.e:0 "Tómalo todo, matando a [target.GetFirstName] y saciando completamente mi hambre".
 POD_vamphunt.1.option.f:0 "Haz a [target.GetHerHim] adicto a la dicha de mi beso, para que [target.GetSheHe] me ruegue que me alimente de [target.GetHerHim]."

