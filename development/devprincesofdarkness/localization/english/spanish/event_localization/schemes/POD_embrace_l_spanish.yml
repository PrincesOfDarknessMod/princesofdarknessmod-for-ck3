l_spanish:

 POD_embrace.100.t:0 "El abrazo"
 POD_embrace.100.desc:0 "He orquestado los acontecimientos para que [scheme.GetTarget.GetFirstName] haya caído en mis garras. En un lugar apartado, [victim.GetSheHe] no podrá escapar. ¿Concederé la inmortalidad aunque signifique la condena de [victim.GetHerHis]? ¿Estará [víctima.ConsigueSu] agradecida, o [víctima.ConsigueSu] estará resentida conmigo para siempre? ¿Tenía mi sire estos pensamientos?"
 POD_embrace.100.option.a:0 "Abraza a [scheme.GetTarget.GetFirstName]"
 POD_embrace.100.option.a.tt:0 "Matarás a [scheme.GetTarget.GetFirstName] y luego transformarás a [victim.GetHerHim] en un vampiro. Esto te costará piedad, puede aumentar tu hambre y puede suponer el riesgo de exponer la mascarada".  
 POD_embrace.100.option.a.tt.beast:0 "#R ¡Sí! Déjenlos secos y luego denles una sola gota de nuestra sangre. Siempre podemos recuperarla toda! #" 
 POD_embrace.100.option.b:0 "Deja que [victim.GetHerHim] se vaya".
 POD_embrace.100.option.b.tt.beast:0 "#R ¡No! ¡No dejes que [victim.GetHerHim] se escape! ¡He esperado demasiado tiempo para esto! Hemos esperado demasiado tiempo para esto.#"
 POD_embrace.200.t:0 "El abrazo"
 POD_embrace.200.desc:0 "El cazador, [scheme.GetTarget.GetFirstName] está asegurado en una celda de retención a la espera del abrazo. Por desgracia, la misma fiereza que le hace merecedor de él, dificultará el proceso."
 POD_embrace.200.option.a:0 "Abraza al cazador por la fuerza".
 POD_embrace.200.option.a.s.tt:0 "Inmovilizas al cazador y le drenas la sangre".
 POD_embrace.200.option.a.f.tt:0 "El cazador tiene una desagradable sorpresa para ti".
 POD_embrace.210.desc:0 "Con la garganta aún chorreando sangre, [scheme.GetTarget.GetFirstName] te mira con ojos resentidos. Está por ver si tu don de la no vida eterna será aceptado como tal o si el cazador se aferrará a la convicción de que es una terrible maldición."
 POD_embrace.220.desc:0 "Las puertas de la celda se abren de golpe y saltas por la habitación hacia tu objetivo. En pleno vuelo te das cuenta de que al taburete de madera que generosamente has proporcionado a tu prisionero le falta una pata. [scheme.GetTarget.GetFirstName] te lanza una mirada decidida y levanta una estaca afilada. Sus garras alcanzan el cuerpo de la víctima, pero su propio impulso sigue llevando su corazón hacia la punta de la estaca".
 POD_embrace.200.option.b:0 "Acércate sigilosamente al cazador".
 POD_embrace.200.option.b.s.tt:0 "Muerde el cuello de una víctima desprevenida y dormida".
 POD_embrace.200.option.b.f.tt:0 "El cazador sólo fingía dormir..."
 POD_embrace.230.desc:0 "[scheme.GetTarget.GetFirstName] parece estar profundamente dormido mientras te inclinas hacia el cuello de [victim.GetHerHis]. En ese momento te das cuenta de la fuente del olor avasallador que hay en la celda. ¿Es aceite de lámpara? [scheme.GetTarget.GetFirstName] abre los ojos de [victim.GetHerHis], te agarra por el cuello y te susurra "Muere, demonio". Sólo cuando notas el percutor de fuego te das cuenta de lo que está a punto de ocurrir".
 POD_embrace.200.option.c:0 "Convéncelos de que es la única forma de continuar su existencia"
 POD_embrace.200.option.c.s.tt:0 "Convence al cazador de que la no-vida puede ser virtuosa"
 POD_embrace.200.option.c.f.tt:0 "El cazador te convence de algo..."
 POD_embrace.240.desc:0 "En tu intento de persuadir a tu pronto hijo de que la no-vida es una bendición, estabas ansioso por responder preguntas. Preguntas difíciles que exigían respuestas que incluso tú encontrabas profundamente perturbadoras. ¿Es cierto? ¿Estás irremediablemente perdido para todo lo que hace soportable la existencia?"
 POD_embrace.200.option.d:0 "Esto es una mala idea".
 POD_embrace.200.option.d.tt:0 "De todos los mortales del mundo, ¿por qué iba a engendrar a uno que ha jurado asesinar a sus parientes?"
 POD_embrace.210.t:0 "Como tomar una moneda de un mendigo ciego".
 POD_embrace.210.option.a:0 "Descansa tranquilo, hijo mío".
 POD_embrace.210.option.a.tt:0 "[scheme.GetTarget.GetFirstName] se convierte en tu childe".
 POD_embrace.220.t:0 "Fundido a negro".
 POD_embrace.220.option.a:0 "¿Por qué? ¿Por qué un taburete de madera?"
 POD_embrace.220.option.a.tt:0 "Te mueres".
 POD_embrace.230.t:0 "La ropa de cama empapada de aceite se convierte en un infierno".
 POD_embrace.230.option.a:0 "¿Cómo consiguió [victim.GetSheHe] el aceite?"
 POD_embrace.230.option.a.tt:0 "Se muere".
 POD_embrace.240.t:0 "No es una bendición después de todo".
 POD_embrace.240.option.a:0 "Necesito tiempo para pensar".
 POD_embrace.240.option.a.tt:0 "Te molesta mucho la conversación".
 
 

