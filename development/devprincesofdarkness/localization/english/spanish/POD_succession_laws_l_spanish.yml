l_spanish:
 vampire_elective_succession_law:0 "El más poderoso"
 vampire_elective_succession_law_effects:0 "Cuando se produce un cambio de liderazgo en la sociedad Kindred, suele ser el candidato más poderoso, o con más contactos, el que se lleva el premio. El [gobernante|E] y todos los [de_jure|E] [vasallos|E] directos de uno o dos [rangos|E] por debajo del [título|E] pueden nominar a un [heredero|E] de entre ellos y la [familia_cercana|E] del gobernante."
 vampire_elective_candidates:0 "Familiares cercanos, reclamantes y electores"
 vampire_elective_candidates_tooltip:0 "Para ser un Candidato suficientemente poderoso, un personaje debe cumplir una de las siguientes condiciones:\n$EFFECT_LIST_BULLET$ Ser un miembro legítimo [close_family|E] del gobernante actual. \n$EFFECT_LIST_BULLET$Ser un [reclamante|E] del título.\n$EFFECT_LIST_BULLET$Ser un [elector|E] feudal válido para el título"
 vampire_elective_electors:0 "Gobernante y vasallos"
 vampire_elective_electors_tooltip:0 "Para ser un [elector|E] válido en la sociedad Kindred, un vasallo debe cumplir todas las condiciones siguientes: \n$EFFECT_LIST_BULLET$Ser un [de_jure|E] vasallo del título\n$EFFECT_LIST_BULLET$Ser un vasallo directo del título\n$EFFECT_LIST_BULLET$Ser sólo uno o dos [rangos|E] por debajo del título"
 tooltip_vampire_vote_strength_diplomacy:0 "Alta diplomacia"
 tooltip_vampire_vote_strength_intrigue:0 "Alta Intriga"
 tooltip_vampire_elector_vote_decrepit:0 "Este chico es viejo. Como, muy viejo. Mejor ponte de su lado bueno."

