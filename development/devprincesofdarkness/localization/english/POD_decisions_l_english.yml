 inquisition_victory_objective_decision:0 "The Light of God"
 inquisition_victory_objective_decision_tooltip:1 "The ultimate victory is at hand"
 inquisition_victory_objective_decision_desc:0 "The Shadow Inquisition is ready to be reborn as one. Finally, The army of Light is ready to finish the fight against the Darkness."
 inquisition_victory_objective_decision_effect_tooltip2:1 "You will unify the Shadow Inquisition, ensuring your place into the legend" 
 inquisition_victory_objective_decision_confirm:0 "Victory, at last"
 invite_prospect_decision:0 "Invite Prospect"
 invite_prospect_decision_tooltip:0 "Find someone worthy of ordination"
 invite_prospect1.tt:0 "Invite a prospect"
 invite_prospect1_decision_desc:0 "Christendom is teeming with the sort of talent we could use, but prying the best prospects away from their superiors will take some convincing."
 prospect.t:0 "A new prospect arrived."
 prospect.desc:0 "The promising candidate is awaiting your interview."        
