 blackfury_objective_decision:0 "Daughters of Gaia"
 blackfury_objective_decision_tooltip:1 "The Black Furies must step up and lead the Garou Nation."
 blackfury_objective_decision_desc:0 "If the Black Furies are to lead the Garou Nation away from its petty squables, they must first find a worthy Matriarch and consolidate their homeland."
 blackfury_objective_decision_effect_tooltip:1 "You will get the Black Furies Empire title, a powerful relic of your tribe and be one step closer to uniting the Garou." 
 blackfury_objective_decision_confirm:0 "Mothers, daughters and leaders"
 blackfury_decision_custom:0 "The Caern of the Sun's Glory, in Sundgau, must be fully built."

 pod1230objectives_werewolves.1.t:0 "Daughters of Gaia"
 pod1230objectives_werewolves.1.desc:0 "The Black Furies have long been tied to their ancestral Mediterranean homeland. The rise of Rome and the growth of cities that accompanied it marked the end of their dominance over the region and helped the vampires reduce the Furies' influence little by little. No more.\nThanks to a succession of powerful Matriarchs, the cunning use of mortal institutions against the vampires and some daring assaults worthy of the Amazons, the Black Furies have once again solidified a solid foothold in Italy.\nThe other tribes are watching now, wondering if the Furies can capitalize on this surprising victory. Maybe Gaia truly intend for her champions to be united under her daughters after all?   "
 pod1230objectives_werewolves.1.a:0 "Mother, hear our cry of victory!"
 pod1230objectives_werewolves.2.a:0 "Presumptuous Lupines!"
 pod1230objectives_werewolves.2.b:0 "The Amazons ride once more"
 
  
 
 
 
 