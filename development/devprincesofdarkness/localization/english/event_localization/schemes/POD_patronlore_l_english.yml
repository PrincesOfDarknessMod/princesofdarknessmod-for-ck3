 POD_patronlore.100.t:0 "Kindred Apocrypha"
 POD_patronlore.100.option.a:0 "Close the Kindred Apocrypha."
 POD_patronlore.100.desc:0 "There is no lore written for this space (yet!)\n\n" 
 POD_patronlore.100.t.560027:0 "Patron Lore: Loukios"
 POD_patronlore.100.desc.560027:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nOnce a Roman centurion of some renown and secret follower of the cult of the goddess Isis. In the years precluding Rome's collapse to Gothic hordes, Loukios deserted when the wars began to grow helpless and became ever more enamored with the Egyptian mythos to the point that he made a pilgrimage to the land of the sifting sands to better understand his goddess. Unfortunately he found not the knowledge he had so sought--only the Followers of the Serpent. Set greeted him at the old temples. They had taken an interest in him or perhaps his knowledge of the Roman military..\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560002:0 "Patron Lore: Ciarán"
 POD_patronlore.100.desc.560002:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nCiarán was an Irish Traveller, or more accurately, a Mincéirí or one of an lucht siúil (literally, 'the walking people'). He was a young man of twenty-three that simply did what he needed to survive and support his family. Often that meant lying and cheating because he did not have many other skills. Regardless of his dishonest nature family was always the most important thing to him, and he saw all of an lucht siúil as his family. Any nomad he respected almost as much. Which was why he offered a home to a strange Hindustani traveller calling himself Viswanathan.\n\nUnbeknowst to him, Viswanathan was a methuselah, a fifth-generation Vampire of Clan Ravnos and a man who had travelled across the known world to find himself in Ireland. Fortunate, because their camp would soon be raided by locals and the Irishman fatally wounded. Viswanathan betrayed his own principles to embrace Ciarán, saving his life. He taught him of the Path of Paradox, and warned him to never do what he just did. Then he was gone.\n\nEven now Kindred, Ciarán could not bear to  leave his family and his people behind. Especially when they faced such prejudice and hostility from the communities they came into contact with. This hostility in Ireland was growing to a head of steam, which lead them to leaving not long afterward.  Ciarán became determined to find them a safe home.\n\nSo they travelled, for decades, picking up other nomads along the way. Unfortunately Ciarán could not keep his promise to Viswanathan and did once save the life of a young woman among his people, named Caiomhe. She was the only Kindred among his community who he personally sired, but many others did join them in the journey along the way. Some Ravnos, some not. As Viswanathan had told him, Ciarán would declare his clan as Gangrel to anyone other than his people (although he did his best to maintain the masquerade with them).\n\nEventually, they reached Hungary. Largely through deception, manipulation and a healthy dose of Chimerstry, the three things Ciarán was best at, he convinced the local barons to allow his people to make a home here, unbothered.\n\nThis non canon character has been commissioned by a Patron." 
 POD_patronlore.100.t.560007:0 "Patron Lore: José deCalamar"
 POD_patronlore.100.desc.560007:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nJosé's mortal life was born to a fish monger and his wife somewhere on the northern Iberian Peninsula, but he spent most of his early years on the streets causing trouble. He was larger than most boys his age and used that size to intimidate other children. He learned in his early adolescent that people would pay for information, so he started starting to gather as much information as he could for blackmail or trade through eavesdropping, discretely following, or just plain intimidation. He ended up as a young adult running a small information ring in the city of Sarria where he was noticed by a visiting vampire. He noticed José's talents, and decided he would make a perfect candidate to sire. José and his sire had a tumultuous relationship, which ended with José diablerizing the elder.\n\nIn the 1300s, José becomes the head and sole kindred of the small house deCalamar, taking over the duchy of A Corunnà and promising himself that he would rule the Iberian Peninsula in the name of the Beast.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560017:0 "Patron Lore: Kylar Shadovie"
 POD_patronlore.100.desc.560017:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nBorn as a bastard son of a noble, he learned court intrique to survive, even though he was a sickly child. At 26 years of age while fabricating a hook on his liege, a vampire broke into his castle and embraced him." 
 POD_patronlore.100.t.560013:0 "Patron Lore: Gavrili"
 POD_patronlore.100.desc.560013:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nGavrili was a petty noble. A soldier in mortal life, like his father and grandfather before him. He was raised to be a protector of his people.\n\nAs a vampire he takes a perverse pleasure in hunting and feeding on mortals from his former lands.\n\nDespite being loyal to his clan, Gavrili struggles to understand the higher philosophy of the Tzimisce. He compensates by reclusing himself in his domain and focussing on breeding ghoul lineages.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560014:0 "Patron Lore: Descardion Namesh"
 POD_patronlore.100.desc.560014:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nHe was plucked from the quarries of Egypt when his learning and insight caught the attention of his sire. For years he traveled through cities already old, his sire instilling a thirst for knowledge to help fight the stagnation of time. As a follower of Tariq el-Sama, Descardion believes that the struggle between self and the beast are an ultimate test by Allah. Descardion has settled at the the mouth of the Nile where life begins for many in North Africa, and works diligently to bring about learning and faith to those around him. His experiments are often internalized but he has taken extreme measures in the past such as ghouling an entire village or personally enforcing month-long fasts to purge mind and body (and weak individuals) from local tribes. As one of the few literate people in the quarry, a reason he was initially embraced, Descardion has maintained a volume of journals and prizes the written word such that his court values education and tactics more than any other trait. As tales travel of the Tremere and Ventrue wars against the Tzimisce, Descardion has become increasingly concerned about protecting his work and has become pro-active in North Africa seeking to prevent the Kings and Pyramid from controlling the people of Egypt.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560019:0 "Patron Lore: Aryan de Gray"
 POD_patronlore.100.desc.560019:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nBorn to a landless knight sworn to the Earl of Chester, Aryan de Gray spent his childhood tutored at his liege's court. He showed himself capable in combat, earning him a place as the youngest member of his lord's guard, this was soon followed by a position of command in his armies. The young man would have a chance to prove himself during a rebellion in Normandy. Over the course of five years he managed to be captured three times. Twice he was ransomed, and once he escaped. In spite of these unfortunate situations, he was lauded for his bravery and skill, earning the trust of the king himself. The highpoint of his career brought an end to the war, at the Battle of Brémule 1119 he managed to rout the enemy cavalry and led a charge into their right flank. The maneuver had nothing to do with the orders he was given and was described as both "a stroke of genius" and "an act of sheer lunacy". In either case, it led to a decisive victory, one that seemed to cost Aryan his life. Namely, after the impact of his famous charge, he began to pursue the retreating army, followed by a token force at best. He found himself surrounded behind enemy lines, where he was impaled by a spear and left for dead. His own men found him still alive and brought him to be treated at camp, but there was little hope of recovery. A friend was sitting by his side when a man walked into the tent. He recognized him, one of the king's advisors. His friend left at the man's request and the two of them were left alone. "That does not look good at all. I'd say you have an hour, maybe two." The man didn't wait for an answer "I can make sure you survive this, in return you will be sworn to me for the rest of your life, however long that may be. Do you accept?" In his pain and delirium, he did and woke up in an unfamiliar place serving an entirely different master.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560020:0 "Patron Lore: Cyrus Helid"
 POD_patronlore.100.desc.560020:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nSon of a rich weaver familly and born in Strasbourg, Wilhelm always was curious. Seeking new secrets, he started by learning under the church wing. Taking his vows, he became a monk in the Hohenbourg abbey, on the top of the 'Mount St Odil'. While he learned classics, he also became increasingly curious about the 'Pagan Wall' (Heidenmauer), an ancient celtic wall surrounding the mountain, thought to predate christianity. He also learned about tales of strange creatures, haunting the neighbooring Schwarzwald. Great humanoids, seven foot tall and with black eyes.\n\n His forbidden quest to know the origins or the wall and his increasingly interest for pagan affairs brought to him the attention of one wandering outcast of the Tremere Clan, Jonas Helid. After being embraced by this one, he leaved his monastic life behind to travel, away from the sun.\n\nDuring his unlife, he and Jonas travelled to Bologna where they took a supportive role in the foundation of the University in 1088. Interested in knowledge from the ancient times, Wilhelm took inspiration of Persian tales for his new name--Cyrus. A new name for his unlife.\n\nIn 1180, after a failed attempt to rejoin the Tremere Clan with his sire, he came back at his home region, near the rhenish city of Kolmar. Needless to say, that's all it took for him to be contacted by Marconius of Strasbourg, the founder of the Kiasyd bloodline, and former mage. Despite being from different clans,their academic interests brought them together. In the name of knowledge, they forged an allegiance.\n\nThis non canon character has been commissioned by a Patron." 
 POD_patronlore.100.t.560025:0 "Patron Lore: Eden Varten"
 POD_patronlore.100.desc.560025:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nKidnapping mortals (particularly fine physical specimens, strong, beautiful, etc.) draws attention; particularly when most of those taken are found... as remains. The deceased seem to have been cruelly experimented upon; with some of their limbs or organs warped almost beyond recognition. Alas, good help is hard to find and those 'trusted' individuals Eden tasked (hirelings) with disposing of the failures, decided to just dump the bodies somewhere convenient, assuming they would just be counted as more murders (of a mundane sort) in the region. However, anyone even remotely familiar with the effects of Vicissitude would have their suspicious heightened.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560030:0 "Patron Lore: Patrick Ramos"
 POD_patronlore.100.desc.560030:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nEmbraced and left to fend for himself, the only way to earn respect is through might and power.With no clan to hold him back Patrick yearns for the day where he can bring Cainites and Mortals under control and will do anything it takes to gain power and build the world in his image.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560031:0 "Patron Lore: Gabriel Felipe de la Casta"
 POD_patronlore.100.desc.560031:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nScion of a once-noble family, Gabriel has been groomed for rulership since birth. After his Embrace, he has opted to stay out of the limelight and rule from the shadows instead, as befits a member of the Lasombra clan.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560028:0 "Patron Lore: Lucia Canale"
 POD_patronlore.100.desc.560028:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nLucia seemingly appeared out of nowhere, and as luck would have it, many of her opponents in her rise to power had 'unfortunate accidents' or exceptionally sudden changes of heart. Her sire was identified as a shadowy man known as Guiseppe who was last seen on his way to a meeting with her; it is unknown if his fate was Diablerie, staking, or simply Final Death to tie up the last loose end. Perhaps not one to anger if your spymaster isn't very competent.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560032:0 "Patron Lore: Liliana Szantovich"
 POD_patronlore.100.desc.560032:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nGroomed for the embrace by her Sire, Stoffer Ravensburg, who draws his ancestry from The Dracon.  Early in her embrace, it was discovered that Stoffer was an Infernalist, and with the help of his other childe, Miguel Barbaneagra, hunted down Stoffer and put him to final death.  Now she works to secure her position within Voivode Brancoveanu's court, despite their animosities to one another's road. She still holds a level of loyalty to her old Revenant upbringing, and seeks to protect and secure her old Family's place within the world to little success.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560048:0 "Patron Lore: Antariksha-Chandra"
 POD_patronlore.100.desc.560048:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nOld enough to probably really be part of the Rig-Veda, Chandra is the god of the Moon in the Rig-Veda. Antariksha is the god of Space. Born around 1500 BCE, Embraced probably around the same.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560041:0 "Patron Lore: Hakon Fystond"
 POD_patronlore.100.desc.560041:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nHe always caught everyone's attention as a child due to his skin being pale as a corpse, he spent most of his childhood in the forest foraging and later started hunting, he was clever and sly and later joined a band of thieves known for attacking soldiers and merchants traveling though Nordmark. \n\nHis role in the band of thieves were gather information and using that to plan ambushes.\n\nOne night a blood bond Gangrel approached the thieves hideout with murderous intent slaughtering most people inside or putting them in a critical condition, after that, the Gangrel fled the scene and everyone inside is either a corpse on the floor or bleeding out, Hakon was 'lucky?' enough to only have a moderate bleeding and tried cauterize the wounds to stop the bleeding.\n\nHe later tried to get out of the hideout after patching his wounds, but didn't get far outside before he saw a shadowy figure in the moonlight, that commanded him to approach, he did and not much sooner he felt a faint pain followed by a otherworldly pleasure, then everything went black.\n\nHis sire was a outcast from the sea of shadows, but never mentioned why. His sire taught him a lot, how to manipulate people more efficiently and how beautiful the abyss is. Later in life after consuming the soul of a Toreador and becoming addicted to vitae he started acting weirdly and his mood would randomly without explanation change.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560043:0 "Patron Lore: Anatolios Tenebris"
 POD_patronlore.100.desc.560043:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nThe son of small merchants, was born in the village of Chernivtsi in one of the Moldavian principalities. From childhood he knew how to conciliate and acquire the necessary connections. One evening, he met a young girl who was accompanying the ambassador of the Byzantine Empire. The girl was amazingly beautiful, but more importantly, besides her, there were no more guards. This circumstance allowed Anatolius and his elder brother to make acquaintance with girl in a local tavern. According to her story, they returned after negotiations with the Kiev prince and stayed here for changing horses and some rest. Thanks to his natural charm, Anatolios was able to convince the girl to stay overnight at their house... at least that's what he thought then. It was the last night for him as a human. In the morning he found the mutilated and dried bodies of his family. On cold corpse of his elder brother he found a message: 'The next meeting will be at my place. Your Arianne.' A few days later, the servants of the Toreador contacted him and gave instructions about the meeting place with the rest of the relatives.\n\n9 years have passed since he was accepted into a new family. Anatolios was able to establish himself as a loyal, executive and intelligent member of the clan. In such a short period, he was able to remove the former local ruler and swear allegiance to  the ruler of Voivodate. Neither Vladimir Rustovich nor the Matriarch not doubt his loyalty. But what if loyalty and vows are nothing more than pretense and the new 'family' is the main goal for revenge for the old, true family? Time will tell.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560049:0 "Patron Lore: Gorm"
 POD_patronlore.100.desc.560049:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nThe man was a fierce warrior. His will on the battlefield and his careful management of troops and positionning led him to get many successful battles. He was spotted during one of those by Brunhilde. As he was dying after killing four assaillants, she embraced him and left him alone in the wilds to survive. During those times, he learnt how much social abilities and schemes serve only the weak and used his cunning and strength to hunt with unrelenting effectivness. After learning what he had become, he began to actively lay waste to those who would spit on the gods. Acting as a commander and executioner, he was sent to kill off the rotten roots of the tree of life. Any Einherjar who strayed from the path had to answer for their crimes against the gods and few of them lived long enough to join the christians. Alas with every battle he won, others were lost and the christians never seemed to back away. Worse, they poisoned the hearts of his flock and the many quarrels amongst the Einherjar led Midgar to crumble. After Odin disappeared, disgusted with the human failure to recognise true power and uphold the ways of the Aesir, he recluded himself in his ancestral home of Helgum, not participating in any new battle. But he never lost faith. If Odin was to wake up, he would take his axes again and storm the battlefield once again.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560050:0 "Patron Lore: Hannibal Barcid"
 POD_patronlore.100.desc.560050:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nRoman parents would frighten their children by telling them, Hannibal ante portas--'Hannibal is at the gates'--during the Second Punic War. Rumors persist that he was Embraced by the Brujah methuselah Troile in Carthage, but it remains unknown if he survived the destruction of the city or perished with it. Some even question if there was a Hannibal. There was. Awakened from Torpor in the ruins of Hattusa, Hannibal returns to his ancestral home and from there he has one thought, and one thought only. Destroy. Rome. Or something like that.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560053:0 "Patron Lore: Ruadh Sutherland"
 POD_patronlore.100.desc.560053:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nHe was an Archbishop of Christianity. He beleives that Vampires are part of the will of God, but the Embrace had him tilted. He believes that the vampires are shepherds of humans, who is but a cattle to be guided through the wills of vampires to what they think and see are the correct thing to do. While he beleives that humans shouldnt lie, or murder (unless their vampire lords tell them to), he beleives that vampries are allowed to use the tools "For a Greater Good". He beleives people are good or evil, either or and sees the world in black and white. He was embraced by Goratrix as a priest with an immense knowledge of Religion and the Occult. When Embraced, Sutherland tilted. To an extent that even Goratrix had to send him for a while to Malta, so he could calm down, and get his mind straight. His coping mecanism made him still beleives that he is an agent of God, but then he start seeing the world as black and white, Good and Evil. As any Evil chaser, eventually he used Evil's tools to beat Evil and became power hungry. In his mind, all to eventually reach his goals of Supremacy for the HRE and for the TREMERES which will bring him to a dark path. The traditional "The Tremere leaders dont have the courage to do what needs to be done". Illidan style. Now he is a very good Tremere. He holds the Pontifex position. I'd start him with Scholar or Theologian (or both?) as well as Torturer. 3 is probably too much though.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560066:0 "Patron Lore: Arturia Pendragon"
 POD_patronlore.100.desc.560066:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nShe claims to lead the defense of Britain against the invading Saxons wilst disguised as a man among the mortals.\n\nThis non canon character has been commissioned by a Patron." 
 POD_patronlore.100.t.560067:0 "Patron Lore: Elder Diego"
 POD_patronlore.100.desc.560067:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nDiego is a former monk of a christian holy order. He used to be a hunter but was embraced after a successful hunt by a sire who thought it would be funny -- and didn't much care about the couple of neonates Diego picked off.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560072:0 "Patron Lore: Morgano Murchadh"
 POD_patronlore.100.desc.560072:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nOne of those who was present when Tremere drank the drought which transformed him into a vampire. Originally a mage too young to be embraced by the clan founder himself, Morgano was embraced by Goratrix shortly after the ceremony. He had been instrumental in the capture of a number of Styrian Tzimice and post embrace set out to learn the secrets of their blood. Due to his proximity to the Ritual of Usurpation, the clan discipline of the Tzimisce, Vicissitude was present in his blood. This rare trait that occasionally appeared in Tremere throughout the ages quickly became the focal point for Morgano's studies. He believed that the manipulation of flesh and bone through Vicissitude could potentially unlock many alchemical secrets and quickly learned new ways to implement the power into his Thaumaturgical blood sorcery.\n\nThis unique gift of his, and the relative success of his experiments gained him notoriety amongst his clan. Morgano Murchadha's hunger for power was reflected in the cruel nature of his experiments and he had a hand in causing the Tzimisce declare their war upon the fledgling house Tremere. As a result Morgano was exiled from house Tremere and he and his followers were spared the blood bond in the structuring of the pyramid in 1037. Outraged by his exclusion from Tremere politics and urged by his hunger for power, he took the few he had embraced with him and created the House of Murchadha, a cadet branch of the original tremere who set up their base in Esztergom after murdering the original Viovode situated there in an act of monomancy.\n\nFrom his new seat of power, Morgano of the House of Murchadha began launching invasions of the surrounding Visegrad, inspite of the vast number of enemies around him. Many of his followers, whilst believing such attacks were suicidal, were surpised to find themselves winning repeated victories. The different Viovodes in Hungary were as much in conflict with eachother and the main branch of House Tremere as they were with Murchadha.\n\nThese initial victories led to the capture of many fairly powerful kindred who sated Morgano's desire to experiment and create new powers, thus he instead turned his focus from conquest for a while into travel. Morgano ventured into the Baronies of Avalon and the Courts of Love in France where he reportedly sired 2 of his childer. A young noble girl by the name of Charlotte in the Kentish city of Canterbury was his first childer, it is unclear if it was some fleeting mortal concept of love that drove him to do so or some other aspect of her that captivated his interest. His other childe was a travelling mage from the order of Hermes that he coincidentally met by the name of Niklaus. By the time of their meeting Morgano was a formidable wielder of blood magic and utilized other vampiric disciplines, specifically vicissitude to get close enough to people that they were unable to react to his attack. Niklaus hated Morgano for embracing him, he considered it a cruel joke on Morgano's behalf and spent many years trying to track him down to his Esztergom chantry.\n\nMorgano became known for his madness in more recent nights, after having emerged from his secluded research, the Warlock saw many of the lesser kindred such as Caitiff had risen to positions of prominence. Having studied the Gehenna profecies heavily, he took this as an omen and began his own crusade to wash Europe clean of the clanless, rallying many traditionalist vampires to his side as he did so. Whilst he used to experiment on his captives, the Mad Lord of House Murchadha now chose to burn his enemies at the stake or in their homes, sometimes whole villages and towns were burned to the ground if there were rumours that they harbored the clanless. Yet because of his isolation and the indifference of the high clans, no one has stopped Morgano's mad scouring of Hungary.\n\nThis non canon character has been commissioned by a Patron." 
 POD_patronlore.100.t.560074:0 "Patron Lore: Brand de Draeck"
 POD_patronlore.100.desc.560074:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nHe was a Warrior Potestate known as 'De Draeck'. He fought of the Danes who were forcing tribute in the surrounding area. He refused to pay the Danes. A battle ensued where the Dutch came out on top with 500 out of 800 Danes slain including their leader. The Dutch however also lost their leader.\n\nOr so was thought, in actuality he was embraced during the battle, became possessed, changed his identity and has since then travelled Europe to find his place. Eventualy he retrned to Holland to rule from the shadows while struggling to regain his sanity--or succumbing to madness.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560076:0 "Patron Lore: Aedan Cathasach"
 POD_patronlore.100.desc.560076:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nAedan was embraced by a True Brujah elder concerned with disappearance and corruption of the white howlers. As a descendant of the druids that worked with the White Howlers, his sire hoped Aedan could provide some insight into the mystery.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560079:0 "Patron Lore: Luna Morningstar"
 POD_patronlore.100.desc.560079:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nAs a human Luna was always different from her piers. Conteplative of life and death, interested in the bizzare and in love with the night. Something about it calmed her. The slow but unrelenting breeze that passed thru the rocks of her parents house that would spook other kids made her feel cozy and safe. The cracking of wood under her feet and the silence of a dark room inspired her imagination. Her beauty seemed timeles but was almost extinguished as she rejected a neighbouring boys advances and was proclaimed a witch. As the inquisitors prepeared her for the stake her cryes of anger and anguish reached a local vampire lord that saw her unrelenting hatered for the Human race. He saved her and soon after embraced her. He wanted to see what caos and suffering such a beautifull and mad individual could do before dooming herself or if she can rise thru the ranks of the night court and become a true Mistress of the night.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560081:0 "Patron Lore: Caelia Tertia"
 POD_patronlore.100.desc.560081:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nBorn in 390 AD in the city of Rome, Caelia in life was the third child of a Roman Centurion. Not much is known about her Human life simply because there isn't much to know, not to mention that most records from her time were destroyed; she lived an uneventful life in Rome until the Gauls sacked it in 410 AD. Her father and elder brothers were killed in the fighting, and while trying to flee she found herself attacked by a Kindred. She fought back as best she could, but it was a hopeless battle from the start and she was defeated with contemptuous ease.\n\nWhatever vampire that turned her then left her to fend for herself - her new identity as a vampire was swiftly found out by the local populace and she only barely managed to escape unharmed. She fled into the northeast, taking nearly a century simply to get a firm grasp of her new powers and how to avoid detection - or incurring the wrath of other kindred. Only after another two centuries had passed did she finally carve out a place for herself, however small. But it is a start--whether of something big or not remains to be seen.\n\nThis non canon character has been commissioned by a Patron." 
 POD_patronlore.100.t.560084:0 "Patron Lore: Michel Tenoctis"
 POD_patronlore.100.desc.560084:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nNot much is known about him as he normal keeps to himself to study the Abyss. All that is known is he had already discovered the existence of and started to study the Abyss before he was sired. That's what drew the attention of the Lasombra clan and eventually led to his current state of undeath, courtesy of the aforementioned clan.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560086:0 "Patron Lore: Alexarchus"
 POD_patronlore.100.desc.560086:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nAlexarchus was a simple man before his embrace, raised in a small village somewhere in Greece which has long since been forgotten. Later in life, Alexarchus became an elusive mystic, to which many people came to receive their blessings and rites. He traveled the lands, when the nights were much less bloody than they are now. Somewhere along his travels he nearly perished, but was saved from death and embraced by one of the Baali.\n\nYears of excruciating training in the arts of his Sire made him powerful, at the cost of his own sanity. Nowadays he lives as a reclusive hermit in a tower specifically tailored to his needs, manipulating the populace in his county and leading them almost like a Cult, with him at the center of worship. They look to the tower he inhabits in awe, but the eyes of their master have long since fallen elsewhere. The voices in his mind speak of grand accomplishments, and he would be wise to listen to them.\n\nThis non canon character has been commissioned by a Patron."  
 POD_patronlore.100.t.560070:0 "Patron Lore: Abe no Seimei"
 POD_patronlore.100.desc.560070:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nAn onmyōji, a leading specialist of onmyōdō during the middle of the Heian period in Japan. Onmyōdō is a system of natural science, astronomy, almanac, divination and magic that developed independently in Japan based on the Chinese philosophies of yin and yang and wuxing (five elements). In addition to his prominence in history, he is a legendary figure in Japanese folklore and has been portrayed in a number of stories. Seimei worked as onmyōji for emperors and the Heian government, advising on the spiritually correct way to deal with issues. He prayed for the well-being of emperors and the government as well as advising on various issues. He was also an astrologer and predicted astrological events. He enjoyed an extremely long life, free from any major illness, which contributed to the popular belief that he had mystical powers. Towards the end of his life, he was embraced by one of the eastern Salburi.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560073:0 "Patron Lore: Jimeno FitzRoy"
 POD_patronlore.100.desc.560073:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nPrior to his embrace, Jimeno FitzRoy was a minor noble in Valencia - distantly related to some Spanish King (or so he claims). He built up something of an ill-repute, owing to the fact that he freely mingled with unscrupulous merchants, thieves, and blackguards. His deviancy and willingness to bend laws for his benefit would draw the attention of a powerful Lasombra, looking for a mortal to embrace.\n\nFollowing the embrace, Jimeno found himself drawn to the murky waves - as some Lasombra are. He recruited the criminals he knew in his previous life to crew his ships and set off on a great voyage filled with adventure, battle, and lots of plundered booty. Raiding and reveling is good enough for some corsairs, but Jimeno eventually found his life at sea... restricting. Using the chaos in the Levant caused by the crusades, he seized control of a few key ports and decided to 'set-up shop'. The Court of Crows was born. Since then, Jimeno's power has expanded slightly to encompass most of Syria and few scattered lands across the sea. Jimeno dreams of creating a pirate kingdom mighty enough to rule itself without fear of others meddling in its affairs; where every vampire will be free to live and die as he pleases.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560080:0 "Patron Lore: Matthaios Yelbeghen"
 POD_patronlore.100.desc.560080:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nAs with a good number of Tzimisce, Yelbeghen has primarily discarded its mortal past. It was once Matthaios Dragastes, a Romaniote Jewish mystic who practiced the Kabbalah Ma’asit using Qliphothic magic in ages past. Matthaios’ study and skill with such magics made him a person of interest for the Vampires who dwelt within Ancient Constantinople and eventually a childe of the Tzimisce Methuselah Andeleon (Likely Urdo "Master of Hellhounds, but perhaps Jedrik "the scholar") gave the embrace to the mystic under his sire’s instructions.\n\nUnder Andeleon’s tutelage, Dragastes studied the discipline of Vicissitude in all its many forms, and his mastery of the discipline swiftly grew beyond his years in a similar fashion to all of Andeleon’s progeny. As his mastery of Vicissitude solidified, Dragestes found that when he reached out to the Qliphoth, as he had done when he was alive, he could feel an ancient intelligence that dwelt within the anti-life pressing against his consciousness. Under Andeleon’s guidance, the mystic communed with this great intelligence. They revealed to him many great secrets of Vicissitude and told him of the ancient, unnumbered crimes of beings called the Nephilim. Drawn by these Eldritch entities, Matthaios sojourned into the Shadowlands and journeyed to the forests of D’hainu, the ruins of the Second City, and the roots of Mount Meru.\n\nIn these travels, the Watcher’s, as these Qliphothic entities called themselves, broke down Matthaios’ mind and rebuilt it as an extension of their own. Driven mad by eldritch revelations and possessed by these malevolent entities, Matthaios added direction and voice to the emerging Assaku brood that slowly grew like a tumor in Kindred society. Matthaios became a sort of prophet for the Assaku, communicating directly with the Watchers and proclaiming maddening revelations in their name. As the main line of communication between the growing Assaku blood cult in Constantinople, and the Qliphothic masters they served, the rest of Andeleon’s brood began to name Dragastes the “Whisperer in Darkness” as he became a Hierophant for the Growing blood cult.\n\nPosing as a wandering mystic, Dragastes used his Vicissitude to heal the sick and wounded of both Kine and Kindred alike. However, With every healing, his tainted blood spread to the masses, rotting them from the inside out and corrupting them into mere extensions of the Assaku’s will. Potentially Dragastes’ curse may have spread across much of the Mediterranean. However, the Assaku, or more correctly the Watcher’s who dominated his will, had underestimated the other Kindred of the City. The Dracon, an ancient Tzimisce whose knowledge of Vicissitude eclipsed even that of the Assaku, rooted out many of Matthaios’ cults and swiftly drove the rogue Tzimisce to flee the city. However, some remnants of Dragastes’ madness remained in the fringes of ancient Byzantium, though centuries of preparation and plotting had been undone in a brief few years. Although the victory of the Trinity over the Assaku had been swift, the Methuselahs who ruled Constantinople covered up the vanquished Blood cult to preserve the image of a stable and infallible Dream.\n\nFollowing Dragastes’ expulsion from Constantinople, the wandering Hierophant of the Assaku would seemingly vanish off the face of the map. Some would whisper that the Assaku cult had been pursued across Europe and the middle east by the Elioud. Only recently, the “Whisperer in Darkness” has resurfaced under a new name in the furthest corners of Siberia, having seemingly thrown off the pursuit of the Tal’mahe’ra for the time being.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560012:0 "Lore: Izalda Kishlovsky"
 POD_patronlore.100.desc.560012:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nIzalda was born in a fairly successful family, which wasn't enough to keep her from growing up surrounded by problems, most of them of her own making. In her early years she displayed a natural talent as a scholar.\nHowever, she chose a different path, secretly immersing herself in the occult. Rumors of her secret searches quickly spread and, together with her highly unusual appearance, turned Izalda into an outcast. During a fateful night the young maiden learned how bad the rumors were, as she was left maimed and beaten half to death in the streets. Maybe not so surprisingly, the one to find and help her was no other than a member of a witch coven.\nUnder the coven’s guidance, Izalda rapidly learned and grew up to be a rather resourceful witch. But yet again the lady was jumped on in the middle of the night. Although, this time, the ones maimed were her own sisters from the coven, victims of her hunger.\nOnce passed the neonate stage, Izalda left her [Sire|E], Mellandis, and exiled herself, still full of sorrow for her sister’s death. During this time she fell deep into her own [Clan|E] history, coming across texts and information about the Ordo Aenigmatis.\nNow,inspired by the way of the Ordo, she has returned to Leczyca, her hometown, easily taking place as countess. That, however, being only the first step of a much more elaborate plan to elevate both the Malkavians and the Ordo Aenigmatic. In the meantime, she’ll stand right in the middle, ready to unleash true knowledge over the world and harvest its power.\n\nThis non canon character has been commissioned by a Patron."
 POD_patronlore.100.t.560093:0 "Lore: Amducious"
 POD_patronlore.100.desc.560093:0 "This character was created by one of our supporters and isn't an official part of the WoD.\nBorn in France in 787, Amducious was a French noble in the court of Charlemagne at the height of his reign. He was one of Charlemagne's closest advisors and an extremely intelligent man. He was known for his cunning and devious mind but was also plagued with the paranoia that was common in the French court. Embraced by Azaneal on the night of Charlemagne's death, he quickly took to his new unlife and shed his old one, his original name lost to history. The Order now knows only Amducious. Quick to his studies of Daimoinon, he became known as the Hell-Spawned Lord within the Order and highly respected within the bloodline for his experiments and studies.\n\nThis non canon character has been commissioned by a Patron."
