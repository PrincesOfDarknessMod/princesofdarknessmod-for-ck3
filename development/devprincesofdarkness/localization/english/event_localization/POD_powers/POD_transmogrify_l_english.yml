 POD_transmogrify.100.t:0 "Transmogrification"
 POD_transmogrify.100.desc:0 "With the use of the discipline of vicissitude, I can transmogrify my subject into a beauty or a beast.  Their flesh is my clay, and I am an artist of sinew, bone and blood. There is a chance they do not survive the procedure."
 POD_transmogrify.100.option.a:0 "Manipulate their visage"
 POD_transmogrify.100.option.b:0 "Modify their body"
 POD_transmogrify.100.option.c:0 "Enhance them for combat"
 POD_transmogrify.100.option.d:0 "Modify their senses"
 POD_transmogrify.100.option.e:0 "Do nothing"
 
 POD_transmogrify.experiment.desc:0 "Your learning will be challenged by the experiment"
 
 POD_transmogrify.200.t:0 "Transmogrification of the Malleable Visage"
 POD_transmogrify.200.desc:0 "How should I modify their appearance? There is a chance they do not survive the procedure."
 POD_transmogrify.200.option.a:0 "Craft their features into conventional notions of beauty"
 POD_transmogrify.200.option.b:0 "Mutiliate them to appear ugly to mortal society"
 POD_transmogrify.200.option.c:0 "Extract the pigment from their skin"
 POD_transmogrify.200.option.d:0 "Return pigment to their skin."
 POD_transmogrify.200.option.e:0 "Scar them"
 POD_transmogrify.200.option.f:0 "Remove their scars"
 POD_transmogrify.200.option.g:0 "Remove their scales"
 POD_transmogrify.200.option.h:0 "Scalify their skin"
 POD_transmogrify.200.option.i:0 "Craft them in my image"
 POD_transmogrify.200.option.j:0 "Do nothing"
 
 POD_transmogrify.300.t:0 "Transmogrification of the Mortal Clay "
 POD_transmogrify.300.desc:0 "How should I modify their appearance? There is a chance they do not survive the procedure."
 POD_transmogrify.300.option.a:0 "Transform them into a giant"
 POD_transmogrify.300.option.b:0 "Shrink them into a dwarf"
 POD_transmogrify.300.option.c:0 "Shape then to an average height."
 POD_transmogrify.300.option.d:0 "Twist their spine into a hunchback"
 POD_transmogrify.300.option.e:0 "Untwist their spine"
 POD_transmogrify.300.option.f:0 "Improve their feet"
 POD_transmogrify.300.option.g:0 "Club their feet"
 POD_transmogrify.300.option.h:0 "Enhance their limbs"
 POD_transmogrify.300.option.i:0 "Weaken their limbs"
 POD_transmogrify.300.option.j:0 "Restore their missing leg"
 POD_transmogrify.300.option.k:0 "Restore their genitals"
 POD_transmogrify.300.option.l:0 "Remove their genitals"
 #POD_transmogrify.300.option.m:0 "Profane Hieros Gamos"
 POD_transmogrify.300.option.n:0 "Do nothing"
 
 POD_transmogrify.350.t:0 "Transmogrification of the Senses"
 POD_transmogrify.350.desc:0 "How should I modify their senses? There is a chance they do not survive the procedure."
 POD_transmogrify.350.option.a:0 "Give them new eyes"
 POD_transmogrify.350.option.b:0 "Remove their eyes"
 POD_transmogrify.350.option.c:0 "Add a third eye"
 POD_transmogrify.350.option.d:0 "Remove third eye"
 POD_transmogrify.350.option.e:0 "Enhance hearing"
 POD_transmogrify.350.option.f:0 "Normal ears"
 POD_transmogrify.350.option.g:0 "Enhance smelling" 
 POD_transmogrify.350.option.h:0 "Normal nose"
 POD_transmogrify.350.option.i:0 "Do nothing" 

 POD_transmogrify.400.t:0 "Transmogrification Rending the Osseous Frame"
 POD_transmogrify.400.desc:0 "How should I modify their appearance? There is a chance they do not survive the procedure."
 POD_transmogrify.400.option.a:0 "Equip them with feral weapons"
 POD_transmogrify.400.option.b:0 "Protect them with armor of bone"
 POD_transmogrify.400.option.c:0 "They should have horns"
 POD_transmogrify.400.option.d:0 "Remove feral weapons"
 POD_transmogrify.400.option.e:0 "Remove the armor of bone"
 POD_transmogrify.400.option.f:0 "Remove the horns"
 POD_transmogrify.400.option.g:0 "Do nothing"

 POD_transmogrify.greatsuccess:0 "Experiment will be a great success"
 POD_transmogrify.moderatesuccess:0 "Experiment will be a moderate success"
 POD_transmogrify.smallsuccess:0 "Experiment will be a small success"
 POD_transmogrify.failure:0 "Experiment will be a failure"

 POD_transmogrify.500.t:0 "Transmogrification"
 POD_transmogrify.500.desc:0 "The subject has been transformed."
 POD_transmogrify.500.option.a:0 "Continue with the experiments."
 POD_transmogrify.500.option.b:0 "Enough for that now."
 
 POD_transmogrify.600.t:0 "Transmogrification"
