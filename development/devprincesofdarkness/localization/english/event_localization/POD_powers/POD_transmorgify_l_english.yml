 POD_transmorgify.200.option.b:0 "Mutiliate them to appear ugly to mortal society"
 POD_transmorgify.200.option.c:0 "Extract the pigment from their skin"
 POD_transmorgify.200.option.d:0 "Return pigment to their skin."
 POD_transmorgify.200.option.e:0 "Scar them"
 POD_transmorgify.200.option.f:0 "Remove their scars"
 POD_transmorgify.200.option.g:0 "Remove their scales"
 POD_transmorgify.200.option.h:0 "Scalify their skin"
 POD_transmorgify.200.option.i:0 "Craft them in my image"
 POD_transmorgify.200.option.j:0 "Do nothing"
 
