 POD_transmorgify.300.option.f:0 "Club their feet"
 POD_transmorgify.300.option.g:0 "Untwist their spine"
 POD_transmorgify.300.option.h:0 "Enhance their limbs"
 POD_transmorgify.300.option.i:0 "Weaken their limbs"
 POD_transmorgify.300.option.j:0 "Restore their missing leg"
 POD_transmorgify.300.option.k:0 "Restore their genitals"
