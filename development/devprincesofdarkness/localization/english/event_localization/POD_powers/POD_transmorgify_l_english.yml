l_english:

 POD_transmorgify.100.t:0 "Transmorgification"
 POD_transmorgify.100.desc:0 "With the use of the discipline of vicissitude, I can transmorgify my subject into a beauty or a beast.  Their flesh is my clay, and I am an artist of sinnew, bone and blood. There is a chance they do not survive the procedure."
 POD_transmorgify.100.option.a:0 "Manipulate their visage"
 POD_transmorgify.100.option.b:0 "Modify their body"
 POD_transmorgify.100.option.c:0 "Enhance them for combat"
 POD_transmorgify.100.option.d:0 "Do nothing"
 
 POD_transmorgify.experiment.desc:0 "Your learning will be challenged by the experiment"
 
