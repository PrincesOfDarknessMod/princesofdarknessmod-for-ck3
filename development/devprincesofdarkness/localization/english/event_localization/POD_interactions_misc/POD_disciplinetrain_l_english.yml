 POD_disciplinetrain.120.t:0 "Qiao Training"
 POD_disciplinetrain.120.desc:0 "Shih methods of training have changed very little over the centuries. The mind of a Shih must be properly molded in order to resist the temptations and terrors of the shen and, therefore, it is the first area where training begins. You will teach [disciplinetrainee.GetFirstName] the Qiao of..."
