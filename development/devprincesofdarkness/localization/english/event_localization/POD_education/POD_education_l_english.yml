l_english:

 POD_education_events.1.t:0 "An Education"
 POD_education_events.1.desc:0 "Your new childe has taken his first tentative steps into the night. Now experienced enough to understand how to feed, it will soon be time to begin a formal education, which will be very important for his future, but also for your relationship. What will your approach be?"
 POD_education_events.1.option.a:0 "Teach him his place"
 POD_education_events.1.option.b:0 "Keep him close, but with some liberties"
 POD_education_events.1.option.c:0 "He will figure it on his own"
 POD_education_events.1.option.obedience:0 "This education can provide obedient, if uninspired, childer"
 POD_education_events.1.option.lenient:0 "A balanced education"
 POD_education_events.1.option.free:0 "With this education, the childe is more likely to turn out good, but also more free spirited"
 POD_education_events.2.t:0 "An Education : The Stick"
 POD_education_events.2.desc:0 "The youngsters nowadays... You have barely started teaching the fool that you hear complaints about the 'harsh' and 'unjust' way your are doing things. As if they would learn otherwise!\nAnyway, you can recognize the signs of your childe being close to break under your pressure if you don't relent. You could, obviously, change your approach, but 'changing' isn't something vampires easily do."
 POD_education_events.2.option.a:0 "The old methods work best"
 POD_education_events.2.option.b:0 "I will relent, for now"
 POD_education_events.3.t:0 "An Education : Human Ties"
 POD_education_events.3.desc:0 "Your childe still has human ties, friends, family and such. As for most young vampires, it is very difficult for him to let them go. Obviously, you know better, and these feelings are better kept under wraps, as the Masquerade is endangered by rash actions around mortals. And you often make rash actions with your loved ones.\nPerhaps it is time for your childe to learn to let go of the past?"
 POD_education_events.3.option.a:0 "I will cover up for him, let the youth have their dreams"
 POD_education_events.3.option.b:0 "Childe, we must talk..."
 POD_education_events.4.t:0 "An Education : Freedom!"
 POD_education_events.4.desc:0 "Lately, you haven't been able to take care of your childe much. You hoped that this newfound freedom would result in some interesting insights he could discover on his own but... not quite.\nStill resenting you for being turned into a vampire, this unruly neonate has started publicly doubting your authority, and not answering your rare summons. This could escalate quickly if you don't stop this behavior now."
 POD_education_events.4.option.a:0 "Childe, we need to talk..."
 POD_education_events.4.option.b:0 "It will pass, probably"
 POD_education_events.100.t:0 "An Education : Matters of Faith"
 POD_education_events.100.desc:0 "So far, your childe has followed your faith mostly because you said so. Obviously though, he is far from understanding the inner workings of the Beast and how to dealt with it. You will have to take some time to start this part of the teaching, or hire some learned practitioners of the Road to help your progeny along."
 POD_education_events.100.option.a:0 "The first thing to know..."
 POD_education_events.100.option.b:0 "Listen well to your teachers. They weren't cheap."
 POD_education_events.101.t:0 "An Education : Tempted by Humanity"
 POD_education_events.101.desc:0 "It's not a big surprise that, despite your teachings, your childe has been tempted by Via Humanitatis. It is, after all, the easiest road to follow for a neonate, and try to closely walk into the mortals' footsteps.\nYou are planning to stage a grand show of faith, by not interfering with humanity for the coming months, as a proof to your childe of the truth in the matter. Or you could just let it slide."
 POD_education_events.101.option.a:0 "We are grounded for the coming months"
 POD_education_events.101.option.b:0 "Youth will be youth"
 POD_education_events.102.t:0 "An Education : Tempted by Rebellion"
 POD_education_events.102.desc:0 "Disturbing reports as your spies have finally tracked the recent vanishing of your childe to a group of rebels in the fringes of your realm. These so called 'Furores' are a plague to any self respecting vampire, wanting to abolish the fine traditions of the blood in a vain attempt of 'freedom'.\nYour childe must be quickly shown the error of his ways, or he even might start to believe in these idiocies!"
 POD_education_events.102.option.a:0 "Go to your chamber and don't leave it until I say so!"
 POD_education_events.102.option.b:0 "It will pass, as all things do"
 POD_education_events.300.t:0 "An Education : The End"
 POD_education_events.300.desc:0 "You have done what you could. Your childe has learned the ways of your condition, the methods to use to control the Beast, and even how to approach the clans and their subtleties. Perhaps it will suffice. Or perhaps you have created the most dangerous foe you will ever face.\nTime will tell, at it always does."
 POD_education_events.300.option.a:0 "You are no longer an helpless fledgling. But you are still my childe."
 POD_education_events.5.t:0 "An Education : Easygoing Childe"
 POD_education_events.5.desc:0 "So far, your childe has taken well enough to his new condition. He doesn't make a fuss, listen to your commands, and is all around a diligent student.\nIt might not last, but it's already better than most childer. So you enjoy it while you can."
 POD_education_events.5.option.a:0 "I'm pleased with you, childe"
 POD_education_events.5.option.b:0 "You will make a good impression at my court"
 POD_education_events.6.t:0 "An Education : Diplomat Childe"
 POD_education_events.6.desc:0 "Since his introduction to the night, your childe has shown a keen interest in court etiquette. Always trying to learn more about the clans and the various politics of your race, he is already a valuable asset in your diplomatic arsenal.\nYou know that fledglings are fickle though, and this interest might not last. As such, you are considering cashing in this as soon as possible."
 POD_education_events.6.option.a:0 "You are doing well so far, childe"
 POD_education_events.6.option.b:0 "You will accompany my diplomats for the coming weeks"
 POD_education_events.7.t:0 "An Education : Obedient Childe"
 POD_education_events.7.desc:0 "You have again proved your superior skills with this specific childe. The envy of every prospective sire, your progeny is obediently helping in every way he can, all the while giving thanks to the great patron that brought him to the night.\nYou could concentrate your next efforts on making him an useful ally long term, or simply a reliable assistant for now."
 POD_education_events.7.option.a:0 "Let us talk about the future, childe"
 POD_education_events.7.option.b:0 "Get back to work"
 POD_education_events.8.t:0 "An Education : Spirited Childe"
 POD_education_events.8.desc:0 "You new childe has taken to the night like a charm. With an avid curiosity, he has quickly learned on his own the basic knowledge needed to survive in the Cainite world. You are appreciative, and also relieved that this doesn't seem to have given him ideas of independence... yet.\nThe next step is knowing if you will let him continue on this way, or try to work closer with him for your advantage."
 POD_education_events.8.option.a:0 "Ah, to be young again!"
 POD_education_events.8.option.b:0 "Let us work together, childe"
 POD_education_events.9.t:0 "An Education : Clumsy Childe"
 POD_education_events.9.desc:0 "You childe is doing well enough so far, except in one aspect : court etiquette. For some reason, he can't quite wrap up his head around the proper protocol to be observed in court. It's not that hard really! If you want to salvage this one diplomacy skills, you will have to teach him court politics by example. Which isn't the most glorious thing to do."
 POD_education_events.9.option.a:0 "Stay right here and watch. And don't say a thing."
 POD_education_events.9.option.b:0 "...Well, this one will have other use, I hope"
 POD_education_events.103.t:0 "An Education : Tempted by Gold"
 POD_education_events.103.desc:0 "Your new childe has proven to be quite quirky in his adaptation to vampirism. He thinks that his new condition is best used at... making money. He talks all day long about how immortality means easy investments, new opportunities and such nonsense.\nAs you sigh, you console yourself by thinking that it's at least a better hobby than trying to murder you. But you might still want to bring him out of this 'phase'."
 POD_education_events.103.option.a:0 "Here is your damn gold. Knock yourself out."
 POD_education_events.103.option.b:0 "...What will those damn fledglings think of next?"
 POD_education_events.104.t:0 "An Education : Faithful Childe"
 POD_education_events.104.desc:0 "Your childe has easily adopted your own tenets as his faith. You are pleased by the progress shown so far and expect nothing more than continued improvement. As a successful teacher, you also attained a deeper understanding thanks to this shared experience."
 POD_education_events.104.option.a:0 "As it should be"
 POD_education_events.105.t:0 "An Education : Tempted by Hedonism"
 POD_education_events.105.desc:0 "Your childe has taken well to his new condition. Perhaps a bit too well... He spends his time partying with mortals, or even other vampires, in a quite depraved fashion.\nObviously, you would prefer him doing useful things with his immortality, but convincing him might be an arduous task at this point."
 POD_education_events.105.option.a:0 "Put this mortal down childe, we have to talk"
 POD_education_events.105.option.b:0 "I don't even care at this point..."
 POD_education_events.10.t:0 "An Education : Steward Childe"
 POD_education_events.10.desc:0 "Your new progeny has been enterprising since his embrace. He has outlined several projects to add outlier regions to your influence, and new people to bribe to make sure that it's stay hidden.\nYou are considering pushing the eager neonate further into this direction, or using his insight on such matters right now."
 POD_education_events.10.option.a:0 "You got a talent right here, childe"
 POD_education_events.10.option.b:0 "Interesting, tell me more about your plans"
 POD_education_events.11.t:0 "An Education : Clueless Childe"
 POD_education_events.11.desc:0 "Your progeny has an hard time understanding that, as a vampire, rules are different than they were in mortal life. His habits as a living being are hindering him, and administrating the web of informants and agents seem way above his understanding right now.\nYou could organize a 'practice mission' to teach him the ropes, or just give up on this part of the training process."
 POD_education_events.11.option.a:0 "Follow me and observe, childe"
 POD_education_events.11.option.b:0 "The records books are off limits to you"
 POD_education_events.106.t:0 "An Education : Tempted by the Crown"
 POD_education_events.106.desc:0 "Your new progeny is fascinated by the power structure of the vampires. He wants to know everything about who rules what, and how you achieved your current station as a ruler of the night.\nWhile flattering, this is quickly bringing him closer to the Via Regalis, something you might not approve of."
 POD_education_events.106.option.a:0 "Let us focus on the spiritual for a while, childe"
 POD_education_events.106.option.b:0 "Why yes I can talk about myself!"
 POD_education_events.12.t:0 "An Education : Schemer Childe"
 POD_education_events.12.desc:0 "Your new childe loves the cloak and dagger ambiance of vampire politics. He has already outwitted some other neonates, and shown a serious talent for intrigue. You could push him more towards honing these skills on his own, or you could use the help for some pressing schemes you are currently planning..."
 POD_education_events.12.option.a:0 "You are doing great childe. Just take to not do too great..."
 POD_education_events.12.option.b:0 "What do you think of these plans?"
 POD_education_events.13.t:0 "An Education : Outwitted Childe"
 POD_education_events.13.desc:0 "Your progeny has trouble adjusting to this new unlife. He takes most of what is said at face value, and doesn't consider that, well, everybody lies in vampire politics. Your best efforts to teach him have been, so far, fruitless. And it is starting to get on your nerves."
 POD_education_events.13.option.a:0 "These people aren't your friends. We don't have friends."
 POD_education_events.13.option.b:0 "Well, this one won't be threatening to me at least"
 POD_education_events.107.t:0 "An Education : Tempted by the Gloved Fist"
 POD_education_events.107.desc:0 "Your childe has shown a serious interest into matters of rulership. An interest that has made him, so far, conclude that might makes right. While you don't necessarily agree, you must admit that you have already picked up some interesting insights by his way of doing things. Perhaps encouraging him to continue would yield further experience?"
 POD_education_events.107.option.a:0 "There is more to power than raw strength, childe"
 POD_education_events.107.option.b:0 "Perhaps we can learn of each other, after all"
 POD_education_events.14.t:0 "An Education : Friendly Childe"
 POD_education_events.14.desc:0 "Your progeny has adapted quite well to the unlife so far. You must admit that you feel an even stronger connection with him that you anticipated before the embrace. Perhaps this time, for once, your long nights of loneliness will be filled with newfound companionship."
 POD_education_events.14.option.a:0 "Let us talk some more, childe"
 POD_education_events.108.t:0 "An Education : Tempted by the Heavens"
 POD_education_events.108.desc:0 "Your childe always needed something to believe in during his mortal days. As such, you aren't overly surprised that he lashed on the Via Caeli as his road of predilection. What you weren't expecting though, is the sheer fervor he shown so far. You aren't moved by many things nowadays, but perhaps a pure show of devotion can be one of those few things?"
 POD_education_events.108.option.a:0 "I am what I am"
 POD_education_events.108.option.b:0 "You are an inspiring sight, childe"
 POD_education_events.15.t:0 "An Education : Martial Childe"
 POD_education_events.15.desc:0 "Vampire wars are very different than mortal ones. A thing of relative secrecy, using a few number of elite troops, they require a flexible skillset. Luckily, your childe seems to have a natural understanding of the challenges that such a warfare style brings to the table.\nHow will you encourage him to use these initial successes?"
 POD_education_events.15.option.a:0 "Continue on your own, childe"
 POD_education_events.15.option.b:0 "You should focus your expertise on one area, childe"
 POD_education_events.16.t:0 "An Education : Toothless Childe"
 POD_education_events.16.desc:0 "Of all things, it seems to be with the scale of vampire conflict that your childe is having trouble with. Obviously very different than mortal warfare, with their small number of elite troops, these battles can be difficult to assess for an unprepared commander. You could forget the issue, as not all vampires are destined to see a battlefield anyway, or organize a 'live example' with some local mortal troops to make your childe learn a thing or two."
 POD_education_events.16.option.a:0 "Concentrate on your other studies, childe"
 POD_education_events.16.option.b:0 "Let us play a wargame with mortals, childe"
 POD_education_events.17.t:0 "An Education : Unspectacular Childe"
 POD_education_events.17.desc:0 "So far, your new progeny has been doing good enough. Nothing spectacular though, which has made you think that he could be useful in other ways. Maybe as an example? Most cainites give great show of their progeny's brilliance, but you could reverse this habit. Crush your childe's mind, for no reason than sheer cruelty, and you would be feared for quite a while after..."
 POD_education_events.17.option.a:0 "It won't hurt... long"
 POD_education_events.17.option.b:0 "This one can still be useful"
 POD_education_events.109.t:0 "An Education : Tempted by Cruelty"
 POD_education_events.109.desc:0 "Your childe seems to have embraced his new condition as a monster of the night a little too eagerly. You have heard tales of disturbing 'parties' and 'experiments' that he has been a part of, or even organized. Sadly, the little wretch will probably not accept easily your authority on this matter..."
 POD_education_events.109.option.a:0 "You will stop this craziness at once!"
 POD_education_events.109.option.b:0 "As long as it doesn't impact me..."
 POD_education_events.18.t:0 "An Education : Studious Childe"
 POD_education_events.18.desc:0 "Your childe is fascinated by the vast history of the Cainite race. The clans, the myths, the rumors... everything he can learn about really. He might actually have insight into some matters you didn't thought about for long while now. Perhaps you could work together?"
 POD_education_events.18.option.a:0 "You have my blessing to continue, childe"
 POD_education_events.18.option.b:0 "What do you think of this story, childe?"
 POD_education_events.19.t:0 "An Education : Slow Childe"
 POD_education_events.19.desc:0 "Your progeny has trouble with the vast amount of new information he has to learn. The clans, the history of the Cainite race, the myths... it seems to be too much. If you don't do something soon, your childe will probably give up, which might be an hindrance for his initiation into the night."
 POD_education_events.19.option.a:0 "...This one will serve another purpose"
 POD_education_events.19.option.b:0 "Let us take some time to study together, childe"
 POD_education_events.110.t:0 "An Education : Lack of Ambition"
 POD_education_events.110.desc:0 "As of late, your childe is approaching his unlife in a more careful manner than before. Satisfied by staying in the shadows, he appears content on letting responsibilities and dangers to others, even still he often provides his expertise when needed. Although reassuring for you to have a seemingly trustworthy childe, you might have other plans for the future."
 POD_education_events.110.option.a:0 "Grow a spine, childe!"
 POD_education_events.110.option.b:0 "One less potential rival... probably"
 POD_education_events.200.t:0 "An Education : The Presentation"
 POD_education_events.200.desc:0 "It is time for your childe to be formally presented to your court... or it is? This traditional part of Cainite society is fraught with both opportunities and dangers as your courtiers and vassals will certainly look for any weakness worth exploiting in your new protege.\nYou could skip the whole affair, but this won't reflect well on you."
 POD_education_events.200.option.a:0 "Behave yourself in there"
 POD_education_events.200.option.b:0 "No need for them to know about you"
 POD_education_events.201.t:0 "An Education : Annoying Vassal"
 POD_education_events.201.desc:0 "During your childe's presentation, one of your vassals took every opportunity available to nag on your progeny. Not good enough, not worthy of the Embrace, waste of time... You can see that your childe is barely keeping his temper in check at this point.\nYou might want to intervene if you don't want these two to hate each other."
 POD_education_events.201.option.a:0 "As long as they don't hate me..."
 POD_education_events.201.option.b:0 "Just stop talking"
 POD_education_events.202.t:0 "An Education : Friendly Vassal"
 POD_education_events.202.desc:0 "One of your vassals really took a liking in your childe during the presentation. Genuine or politically minded, it doesn't really matter as long as it keep the peace in your realm. You join them as they are talking heartily to each other."
 POD_education_events.202.option.a:0 "I am glad you are getting along"
 POD_education_events.202.option.b:0 "Why yes! I choose my childe very well!"
 POD_education_events.203.t:0 "An Education : Scheming Vassal"
 POD_education_events.203.desc:0 "Your childe made a small mistake during the presentation. Surprisingly, one of your vassals helped cover it up quickly enough to not have repercussions.\nYou understand why when this scheming snake comes to you, telling you that you owe him now..."
 POD_education_events.203.option.a:0 "You won this round"
 POD_education_events.203.option.b:0 "I owe you nothing!"
 POD_education_events.204.t:0 "An Education : Infatuated Vassal"
 POD_education_events.204.desc:0 "One of your vassals has been smitten by your childe's flawless presentation and is now asking for some... private time with your progeny. Obviously, it would be an easy way for you to get him in your debt, but your progeny might not appreciate be used as some sort of gift."
 POD_education_events.204.option.a:0 "Come here childe, I want to introduce you to someone..."
 POD_education_events.204.option.b:0 "Sadly, I can't accept your demand"
 POD_education_events.205.t:0 "An Education : Good Enough"
 POD_education_events.205.desc:0 "Your childe's presentation went... well enough. Not a smashing success by any means, but not a blunder either. You suppose that, in vampiric society, even achieving an average success is already quite hard anyway."
 POD_education_events.205.option.a:0 "Distinctly average"
 POD_education_events.206.t:0 "An Education : Flawless"
 POD_education_events.206.desc:0 "Everything about your childe's presentation went very well, even above your expectations. Your vassals were impressed by your new progeny, and even more impressed by your qualities as a sire. This will reflect well on you for some time."
 POD_education_events.206.option.a:0 "A perfect outcome"
 POD_education_events.207.t:0 "An Education : Shrouded Failure"
 POD_education_events.207.desc:0 "On the surface, everything appears to have gone well for your childe's presentation. But deep down, you know that something went wrong. Your vassals were all honeyed words, and congregated around one another, talking in hushed tones.\nPerhaps they planned this move for some time, or perhaps you did something to upset them. Whatever the reason, this might be an issue in the future."
 POD_education_events.207.option.a:0 "Politics never stop"
 POD_education_events.208.t:0 "An Education : Too Successful"
 POD_education_events.208.desc:0 "Your childe has made a great first impression during his presentation. Perhaps a little too great actually... Encouraged by your vassals, eager to throw a wrench in your plans, he has started to have delusions of grandeur.\nObviously, this is way above his station or power right now, but the impudent whelp is almost openly plotting for his 'future' tenure as your heir. You will have to rein this one carefully..."
 POD_education_events.208.option.a:0 "Insolent idiot!"
 POD_education_events.209.t:0 "An Education : Impressed Vassal"
 POD_education_events.209.desc:0 "The presentation of your childe to the court is going well. Nothing really out of the ordinary, except the apparently genuine goodwill he earned from one of your powerful vassal. This small show of diplomacy can be leveraged to your advantage, either towards the vassal or your childe."
 POD_education_events.209.option.a:0 "Obviously, my childe is speaking with my blessing"
 POD_education_events.209.option.b:0 "I choose you well, childe"
 POD_education_events.210.t:0 "An Education : The Gift"
 POD_education_events.210.desc:0 "During your childe's first introduction to the court, a small number of your vassals arrive with a generous gift... for your progeny, not for you. They are obviously trying to create a rift between you two by making you claim the gift for yourself. A not so subtle plot, but still enticing by its sheer value..."
 POD_education_events.210.option.a:0 "You are too young childe, this is mine"
 POD_education_events.210.option.b:0 "Enjoy yourself then"
 POD_education_events.211.t:0 "An Education : Gifted Childe"
 POD_education_events.211.desc:0 "You must admit, your childe is pretty good at smoothing your vassals' petty grievances and stroking their even pettier egos. Good enough actually that you don't need to anything during this introduction to the court.\nIt might be early, but you are wondering if you could use you gifted progeny to ease your burden of rulership, at least for a while."
 POD_education_events.211.option.a:0 "Let us talk about new responsibilities, childe"
 POD_education_events.211.option.b:0 "I will rest when I'm... well"
 POD_education_events.1001.t:0 "Sons against Fathers"
 POD_education_events.1001.desc:0 "You look upon your newest childe, still recovering from the blood you so generously gifted him. What will this one turn out to be? A friend, a servant, a foe? You ponder on this as the new fledgling rises up to meet your gaze.\nWait, this look, it couldn't be...\nYou react too late as he grabs you with his newfound strength and plunge his fangs in your neck. You sense your consciousness failing into oblivion until your Beast, for once your greatest ally, urges you to fight. You won't give up so easily!"
 POD_education_events.1001.option.a:0 "It isn't too late yet!"
 POD_education_events.1001.effect.success.desc:0 "You push your childe back"
 POD_education_events.1001.critical.failure.effect.desc:0 "...the blissful sensation is too strong"
 POD_education_events.1002.t:0 "Sons against Fathers : Mercy?"
 POD_education_events.1002.desc:0 "In a supreme effort of willpower and physical strength, you managed to extract yourself from your childe's deadly embrace. You are now fully aware of the threat, and your foe has lost the advantage. He is now carefully considering you, fear lurking behind his eyes.\nWith your full conscience and powers returning, you can now crush this insolent whelp if it pleases you. Or you could forgive and forget, for you know all too well the allure of old blood to the newly embraced fledgling..."
 POD_education_events.1002.option.a:0 "You have ambition. I can respect that."
 POD_education_events.1002.option.b:0 "You are not worthy of my blood!"
 POD_education_events.1003.t:0 "Ashes of the Old"
 POD_education_events.1003.desc:0 "It is too late. Empowered by the blood you used to bring him back to life, your newest childe has managed to drain you enough to make you powerless to resist. This is how it will end then, killed by your own progeny, like so many before, and after, you.\nA quaint irony, not lost to you as your consciousness slips further and further away, consumed by an artificial bliss.\nUntil it all ends, in darkness, as you always expected."
 POD_education_events.1003.option.a:0 "You must always kill the father one day"
                   
                                        
                                 
               

 