l_english:

 alchemy_preparaion_head:0 "Alchemical Preparations:"
 podmummy.1000.t:0 "$alchemy_preparaion_head$ Gather Material"
 podmummy.1000.desc:0 "Which materials have you gathered to use?"
 podmummy.1000.a:0 "Common Materials"
 podmummy.1000.b:0 "Uncommon Materials"
 podmummy.1000.c:0 "Rare Materials"
 podmummy.1000.d:0 "Exotic Materials"
 podmummy.1000.e:0 "Unique Materials"

 podmummy.1010.t:0 "$alchemy_preparaion_head$ Identification"
 podmummy.1010.desc:0 "Knowledge is power. Understanding specifically what composes any object, creature or substance gives the alchemist potential power over it. Alchemists become aware of substances’ inherent properties that mere chemists never uncover."
 podmummy.1010.a:0 "Use power to identify"
 podmummy.1010.b:0 "Use knowledge Only"
 podmummy.1010.a:0 "Use power to identify"
 podmummy.1010.critical_sucess:0 "Critical Success"
 podmummy.1010.critical_sucess_result:0 "Your preparation gains double effectiveness."
 podmummy.1010.sucess:0 "Success"
 podmummy.1010.sucess_result:0 "Your preparation maintains those effectiveness."
 podmummy.1010.fail:0 "Fail"
 podmummy.1010.fail_result:0 "Your preparation loses some effectiveness."
 podmummy.1010.critical_fail:0 "Critical Fail: Materials lose all effect."
 podmummy.1010.critical_fail_result:0 "Your preparation loses all effectiveness."

 podmummy.1110.t:0 "$alchemy_preparaion_head$ Transmutation"
 podmummy.1110.desc:0 "Many alchemical processes seek simply to change one substance into another, such as the well-known quest to create gold from lesser materials. The result may be a purified form of the original substance, a new substance altogether or a strange blend of the mixture’s components."
 podmummy.1110.a:0 "Use power to transmute"
 podmummy.1110.b:0 "Use power of stasis"
 podmummy.1110.sucess:0 "Success"
 podmummy.1110.sucess_result:0 "You preparation gains random effectiveness depending on your level of Quiddity."
 podmummy.1110.fail:0 "Fail"
 podmummy.1110.fail_result:0 "You preparation loses random effectiveness depending on your level of Quiddity."

 podmummy.1210.t:0 "$alchemy_preparaion_head$ Catalyst"
 podmummy.1210.desc:0 "Many alchemical preparations have as their primary goal the ability to cause change in other substances or forms. At the heights of mastery, the alchemist may even transform her own body into a catalyst that is capable of causing changes in the world around her."
 podmummy.1210.a:0 "I succeeded!"

 podmummy.1999.t:0 "$alchemy_preparaion_head$ Result"
 podmummy.1999.desc_super_fail:0 "Explosion! You are hurt."
 podmummy.1999.desc_fail:0 "You created a bad batch."
 podmummy.1999.desc_sucess_opening:0 "After months of planning, your preparation has succeeded, now you have:"
 podmummy.1999.desc_trash:0 "Empty Slot"
 podmummy.1999.desc_comma:0 ", "
 podmummy.1999.desc_sucess_ending:0 "in your alchemical product slots."
 podmummy.1999.a:0 "Ahhh!"
 podmummy.1999.b:0 "I don't need this..."
 podmummy.1999.c:0 "So be it."