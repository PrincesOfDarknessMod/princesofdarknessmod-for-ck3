 podmummy.700.t:0 "The Shroud"
 podmummy.700.desc:0 "The Underworld are separated from the Skinlands by a mystic barrier known as the Shroud. The Shroud makes the Shadowlands imperceptible to most living creatures and obscures Skinlands activity to the dead. It is stronger in some areas, weaker in others, but it is never entirely absent.\n\nThe Shroud may never be lowered below 1, and if it is raised to 10, spirits in a vicinity must spend Willpower or flee the area; in any event, they will be extremely uncomfortable and unable."
 podmummy.700.a:0 "Strengthening the Shroud."
 podmummy.700.b:0 "Weakening the Shroud."

