 POD_mummy_scheme.100.t:0 "Eye of Sakhmet"
 POD_mummy_scheme.100.desc:0 "You inscribed the symbol of Sakhmet on the target, rendering wound healing more difficult and long-lasting."
 POD_mummy_scheme.100.a:0 "Good."
 
 POD_discover_true_name_outcome.2000.t:0 "You failed to learn [target.GetTitledFirstName]'s ren!"
 POD_discover_true_name_outcome.2000.desc:0 "After spending months breaking down the name into component words, learning their correct enunciation, learning the meaning of each and attempting to discover their innermost nature, I have failed."
 POD_discover_true_name_outcome.2000.a:0 "I give up."
 POD_discover_true_name_outcome.2000.b:0 "[target.GetTitledFirstName]'s ren will be mine to command!"