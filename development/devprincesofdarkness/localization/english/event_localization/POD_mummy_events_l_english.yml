l_english:

 podmummy.100.t:0 "The Shroud"
 podmummy.100.desc:0 "The Underworld is separated from the Skinlands by a mystic barrier known as the Shroud. The Shroud makes the Shadowlands imperceptible to most living creatures and obscures Skinlands activity to the dead. It is stronger in some areas and weaker in others, but it is never entirely absent.\n\nThe Shroud may never be lowered below 1, and if it is raised to 10, spirits in a vicinity must spend Willpower or flee the area."
 podmummy.100.a:0 "Strengthening the Shroud."
 podmummy.100.b:0 "Weakening the Shroud."
 
 podmummy.200.t:0 "Chattel"
 podmummy.200.desc:0 "You can activate a chattel to become a replica of your currently equipped artifact (tinker not included). It won't be possible if you don't have any equipped, or the level of your chattel is lower than the rarity of that artifact, like lesser chattel only can be replica of common artifact, complex chattel up to masterwork... etc."
 podmummy.200.a:0 "Craft a replica of my weapon."
 podmummy.200.b:0 "Craft a replica of my armor."
 podmummy.200.c:0 "Craft a replica of my regalia."
 podmummy.200.d:0 "Craft a replica of my crown."
 podmummy.200.e:0 "I don't want craft a replica now."
 
 podmummy.300.t:0 "Judgement"
 podmummy.300.desc:0 "You has been killed, now you found you self in Underworld, and shall pass a judgement to prove you are worth to resurrect."
 podmummy.300.a:0 "Weigh my Sins."
 
 podmummy.301.t:0 "Resurrecting"
 podmummy.301.desc:0 "Even passed the judgement, you still need some time to restore you body to be prepared to reborn. Still, you can use some item to shortens the time needed to resurrect."
 podmummy.301.a:0 "I can use my illustrious scarab of life."
 podmummy.301.b:0 "I can use my famed scarab of life."
 podmummy.301.c:0 "I can use my masterwork scarab of life."
 podmummy.301.d:0 "I can use my common scarab of life."
 podmummy.301.e:0 "I don't have any thing."

 alchemy_preparaion_head:0 "Alchemical Preparations:"
 podmummy.1000.t:0 "$alchemy_preparaion_head$ Gather Material"
 podmummy.1000.desc:0 "Which materials have you gathered to use?"
 podmummy.1000.a:0 "Common Materials"
 podmummy.1000.b:0 "Uncommon Materials"
 podmummy.1000.c:0 "Rare Materials"
 podmummy.1000.d:0 "Exotic Materials"
 podmummy.1000.e:0 "Unique Materials"

 podmummy.1010.t:0 "$alchemy_preparaion_head$ Identification"
 podmummy.1010.desc:0 "Knowledge is power. Understanding specifically what composes any object, creature, or substance gives the alchemist potential power over it. Alchemists become aware of substances’ inherent properties that mere chemists never uncover."
 podmummy.1010.a:0 "Use power to identify"
 podmummy.1010.b:0 "Use knowledge only"
 podmummy.1010.a:0 "Use power to identify"
 podmummy.1010.critical_success:0 "Critical Success"
 podmummy.1010.critical_success_result:0 "Your preparation gains double effectiveness."
 podmummy.1010.success:0 "Success"
 podmummy.1010.success_result:0 "Your preparation maintains effectiveness."
 podmummy.1010.fail:0 "Fail"
 podmummy.1010.fail_result:0 "Your preparation loses some effectiveness."
 podmummy.1010.critical_fail:0 "Critical Fail: Materials lose all effect."
 podmummy.1010.critical_fail_result:0 "Your preparation loses all effectiveness."

 podmummy.1110.t:0 "$alchemy_preparaion_head$ Transmutation"
 podmummy.1110.desc:0 "Many alchemical processes seek to simply change one substance into another, such as the well-known quest to create gold from lesser materials. The result may be a purified form of the original substance, a new substance altogether or a strange blend of the mixture’s components."
 podmummy.1110.a:0 "Use power to transmute"
 podmummy.1110.b:0 "Use power of stasis"
 podmummy.1110.success:0 "Success"
 podmummy.1110.success_result:0 "You preparation gains random effectiveness depending on your level of Quiddity."
 podmummy.1110.fail:0 "Fail"
 podmummy.1110.fail_result:0 "You preparation loses random effectiveness depending on your level of Quiddity."

 podmummy.1210.t:0 "$alchemy_preparaion_head$ Catalyst"
 podmummy.1210.desc:0 "Many alchemical preparations have as their primary goal the ability to cause change in other substances or forms. At the heights of mastery, the alchemist may even transform her own body into a catalyst that is capable of causing changes in the world around her."
 podmummy.1210.a:0 "I succeeded! #weak (Effectiveness [ROOT.Var('alchemy_craft_outcome').GetValue|0])#!"

 podmummy.1999.t:0 "$alchemy_preparaion_head$ Result"
 podmummy.1999.desc_super_fail:0 "Explosion! You are hurt."
 podmummy.1999.desc_fail:0 "You created a bad batch."
 podmummy.1999.desc_success_opening:0 "After months of planning, your preparation has succeeded, now you have:"
 podmummy.1999.desc_trash:0 "Empty Slot"
 podmummy.1999.desc_comma:0 ", "
 podmummy.1999.desc_success_ending:0 "in your alchemical product slots."
 podmummy.1999.a:0 "Ahhh!"
 podmummy.1999.b:0 "I don't need this..."
 podmummy.1999.c:0 "So be it."
 
 amulet_creation_head:0 "Amulet Creation:"
 podmummy.2000.t:0 "$amulet_creation_head$ Gather Material"
 podmummy.2000.desc:0 "Which materials have you gathered to use?"
 
 podmummy.2999.t:0 "$amulet_creation_head$ Result"
 podmummy.2999.desc:0 "You start to creat amulet, which one you have in mind?"
 podmummy.2999.a:0 "I want a higher level amulet. #weak (Current Level [ROOT.Var('amulets_craft_product_level').GetValue|0])#!"
 podmummy.2999.success:0 "Success"
 podmummy.2999.success_result:0 "You will craft amulet with one more level up."
 podmummy.2999.fail:0 "Fail"
 podmummy.2999.fail_result:0 "You are forced to craft amulet with current level."
 
 effigy_creation_head:0 "Effigy Creation:"
 podmummy.3000.t:0 "$effigy_creation_head$ Gather Material"
 podmummy.3000.desc:0 "What materials have you gathered to use?"
 
 podmummy.3999.t:0 "$effigy_creation_head$ Result"
 podmummy.3999.desc:0 "You start to creat the effigy, which one you have in mind?"
 podmummy.3999.a:0 "I want a higher level effigy. #weak (Current Level [ROOT.Var('effigy_craft_product_level').GetValue|0])#!"
 podmummy.3999.success:0 "Success"
 podmummy.3999.success_result:0 "You will craft the effigy with one more level up."
 podmummy.3999.fail:0 "Fail"
 podmummy.3999.fail_result:0 "You are forced to craft the effigy with current level."
 
 learning_true_names_head:0 "Learning True Names:"
 podmummy.4000.t:0 "$learning_true_names_head$ Choose"
 podmummy.4000.desc:0 "What do you want to do?"
 podmummy.4000.a:0 "Practice pronuntiation."
 podmummy.4000.b:0 "Learn a new true name."
 
 podmummy.4100.t:0 "$learning_true_names_head$ Practice Pronuntiation"
 podmummy.4100.desc:0 "The magic of true names does not come easily: A true name must be understood and pronounced with exacting care. An impatient scribe will find that her improperly spoken ren fails to have any effect whatsoever."
 podmummy.4100.a:0 "I have time."
 
 podmummy.4101.t:0 "$learning_true_names_head$ Manner of articulation"
 podmummy.4101.desc_nasal:0 "You practiced a bit about how to pronounce nasal consonants."
 podmummy.4101.desc_plosive:0 "You practiced a bit about how to pronounce plosive consonants."
 podmummy.4101.desc_trill:0 "You practiced a bit about how to pronounce trill consonants."
 podmummy.4101.desc_flap:0 "You practiced a bit about how to pronounce flap consonants."
 podmummy.4101.desc_fricative:0 "You practiced a bit about how to pronounce fricative consonants."
 podmummy.4101.desc_approximant:0 "You practiced a bit about how to pronounce approximant consonants."
 podmummy.4101.desc_lateral:0 "You practiced a bit about how to pronounce lateral consonants."
 podmummy.4101.desc_clicks:0 "You practiced a bit about how to pronounce clicks consonants."
 podmummy.4101.desc_implosive:0 "You practiced a bit about how to pronounce implosive consonants."
 podmummy.4101.desc_ejective:0 "You practiced a bit about how to pronounce ejective consonants."
 podmummy.4101.desc_affricate:0 "You practiced a bit about how to pronounce affricate consonants."
 podmummy.4101.desc_vowels:0 "You practiced a bit about how to pronounce vowels."
 podmummy.4101.a:0 "Chogh, Chogh."
 
 podmummy.4200.t:0 "$learning_true_names_head$ Discovering a New Ren"
 podmummy.4200.desc:0 "Learning a true name isn’t a simple matter of hearing a name once. It’s a matter of breaking down the name into component words, learning the meaning of each, learning their correct enunciation and pacing, and then putting them back together into the whole ren."
 podmummy.4200.a:0 "It takes time and dedication."
 
 podmummy.4201.t:0 "$learning_true_names_head$ New Ren Discoverd"
 podmummy.4201.desc_opening:0 "You has succesfully learned a new ren -"
 podmummy.4201.desc_true_name_crop:0 "“Crop”"
 podmummy.4201.desc_true_name_weed:0 "“Weed”"
 podmummy.4201.desc_true_name_flower:0 "“Flower”"
 podmummy.4201.desc_true_name_thorn:0 "“Thorn”"
 podmummy.4201.desc_true_name_tree:0 "“Tree”"
 podmummy.4201.desc_true_name_mushroom:0 "“Mushroom”"
 podmummy.4201.desc_true_name_eye:0 "“Eye”"
 podmummy.4201.desc_true_name_leg:0 "“Leg”"
 podmummy.4201.desc_true_name_face:0 "“Face”"
 podmummy.4201.desc_true_name_genital:0 "“Genital”"
 podmummy.4201.desc_fallback:0 "or you may not have learned anything"
 podmummy.4201.desc_ending:0 "!"
 podmummy.4201.a:0 "I am glad."