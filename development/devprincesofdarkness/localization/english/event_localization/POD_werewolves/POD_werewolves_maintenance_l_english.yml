l_english:

 POD_werewolves_maintenance.2.t:0 "First Change"
 POD_werewolves_maintenance.2.desc:0 "The First Change is the name for the first shapeshifting of a young Garou (and for most Fera). Usually it comes along with the first frenzy and the first usage of the Crinos battle-form in highly stressful situations.\nYou have just experienced this traumatic event and are now officially a werewolf, a full on member of your tribe with all the responsibilities and privileges entailed by such a role."
 POD_werewolves_maintenance.2.option.a:0 "I'm an adult now"

 POD_werewolves_maintenance.3.t:0 "New Generation"
 POD_werewolves_maintenance.3.desc:0 "The wolves' population of your area has recently experienced an handful of First Change among them. As is the duty of any self serving Tribe, you have been scouting for those lost pups and brought the most deserving home with you.\nAfter a time of adaptation needed to teach those lupus the ways of the world beyond their forests, they are now ready to become fully fledged members of your pack."
 POD_werewolves_maintenance.3.option.a:0 "Welcome, wyld brothers and sisters"

