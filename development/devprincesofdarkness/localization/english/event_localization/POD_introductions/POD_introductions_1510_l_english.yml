l_english:

 podintroductions1500.10.t:0 "Burning Roses"
 podintroductions1500.10.desc:0 "The Inquisition started and was at its peak in France, and the [cainite|E] political structure has suffered quite a lot from it. Salianna and Esclarmonde have both been betrayed and ousted by the ruthless Beatrix who now rules the Courts of Love with the pivotal help of her two champions : Francois Villon and Eon de l'Etoile.\nWhile her ascension was quick and showed a keen political mind, it wasn't enough to avoid the ambitious Isouda's attempted coup however, and France was then divided between the two queens. The birth of the sects changed little to this state of affairs, Beatrix joining the Camarilla and Isouda the Sabbat, and it seems that the ideological battle takes a backseat to the ambitions of the last Queens of Love.\nFrance has a long way to go before finally achieving stability once more."
 podintroductions1500.10.a:0 "Two Queens for one crown."
 podintroductions1500.11.t:0 "The Unconcerned God-King of England"
 podintroductions1500.11.desc:0 "Since his return after the Norman invasion of 1066, Mithras has once again secured his hold over England. With his rivals undermined and his cult on the rise, the God King was looking outwards... until the Black Plague, the inquisition and the Anarch Revolt all happened in close succession.\nIt took several decades to deal with these issues that Mithras blamed on the Tremere, which he quickly expelled from his island. Victorious once again, Mithras was then taken by surprise when that annoying Hardestadt secured a major diplomatic victory by creating the Camarilla. Feeling that such a momentous occasion should have been his to lead, Mithras is since then weighting his options. Joining the Camarilla would be the logical choice, but taking an alternate path would wipe off the smug smile on that infuriating German's face, which is something sounding quite attractive to the master of England..."
 podintroductions1500.11.a:0 "England and the continent at odds? You don't say!"
 podintroductions1500.12.t:0 "Sins of the Father"
 podintroductions1500.12.desc:0 "Hardestadt's secure rule over Germany and shrewd policies during the Age of the Inquisition and the Anarch Revolt led to him creating the Camarilla, a major effort to ensure [cainite|E] survival in the face of these new threats. Still, not everything is peaceful under the Black Cross, Hardestadt's callous treatment of his charismatic childe Jurgen von Verden led to widespread rebellion in his old followers' ranks, led by Lucretia von Hardtz.\nThe founder of the Camarilla has now lost much of his power in Eastern Germany, where the remnants of the Anarch Revolt, Jurgen's vengeful followers and other petty warlords gather with only one thing in common : an undying hatred for the new self proclaimed most important [cainite|E] of the undead world."
 podintroductions1500.12.a:0 "Jurgen still casts a long shadow over Germany..."
 podintroductions1500.13.t:0 "His Eminence's Realm"
 podintroductions1500.13.desc:0 "In a surprising short amount of time (for a [cainite|E]), Ambrosio Luis Moncada managed to win the Shadow Reconquista, get rid of his [Sire|E] and participate in the creation of the Sabbat, leading to the adoption of an ecclesiastic hierarchy for this burgeoning sect.\nThere seems to be no limits to what the Cardinal can achieve, and many are starting to believe that he is truly blessed by God himself as His instrument. To these rumors, Moncada only answers with a smile and a blessing before returning to his enigmatic goal.\nIt seems unlikely that the small enclaves of independent Iberian powers will be able to withstand Moncada's disciplined troops of fanatical believers for much longer. Blessed by God or not, Iberia has only one master for the time being."
 podintroductions1500.13.a:0 "Has God chosen His side?"
 podintroductions1500.14.t:0 "After Ragnarok"
 podintroductions1500.14.desc:0 "Ragnarok has come and gone for the the Viking vampires, the so called Einherjar. With Werter and Brunhilde defeated, Scandinavia is now a land like so many others, divided by politics and personal ambitions.\nIn Denmark, after securing Copenhagen, the rogue Tremere Rutor must now face the retribution of his angered [clan|E], led by the powerful Meerlinda. In Sweden and Norway, the Camarilla has taken a strong foothold thanks to the invading German Ventrue, but the Sabbat controls most of the North leaving the fate of the region quite uncertain. Further up North, in the wastes where few men dare to travel, relics of a bygone age try to survive in this world where they lost and their Gods have died."
 podintroductions1500.14.a:0 "A new beginning after the end."
 podintroductions1500.15.t:0 "The Race For Rome"
 podintroductions1500.15.desc:0 "Italy has changed a lot thanks to the fires of the Inquisition and of the Anarch Revolt. The victorious Lasombra Anarchs have swept across the North and rallied behind the Sabbat under the leadership of Giangaleazzo and Gratiano, two heroes of the Revolt.\nIn the South, the collapse of the Sea of Shadows' authority has profited to an unlikely outsider, Antonio Cardona of the Ventrue. Ruling his realm like an extended family with a strong focus on the duties and rights of the Sicilian people, this strange independent has enjoyed a large amount of success so far.\nGratiano and Giangaleazzo are nominally allied to one another, making the Sabbat the most likely winner for Italy. But stranger things have already happened in this cradle of empires..."
 podintroductions1500.15.a:0 "Two against one? Doesn't seem fair."
 podintroductions1500.16.t:0 "The Levantine Collapse"
 podintroductions1500.16.desc:0 "The Diet of Olives, this last hurrah of the Salubri [clan|E] didn't last long, leaving the Prince of Jerusalem, Lucius Trebus Rufus, to pick up the pieces. Under his fair and mostly benevolent rule, the Levant enjoyed an unprecedented period of peace... until his assassination during the Anarch Revolt by his own childe.\nWith any semblance of authority destroyed, the Levant is once again a bloody battleground between minor Princes and warlords.\nStrangely, the best hope for the region might come from Damascus. Purged of its demons by a combined Salubri-Assamite effort, the city is now ruled by the levelheaded Mannal, a strong and wise ruler that many would welcome. Time will tell if she chooses to focus on Damascus itself or answer this call."
 podintroductions1500.16.a:0 "The unstable land of Faith is true to its reputation."
 podintroductions1500.17.t:0 "Unwelcome Newcomers"
 podintroductions1500.17.desc:0 "Once mostly unified under the [ashirra|E], the Middle-East had to endure the first full scale assault directed by the Camarilla. While this effort targeted Alamut and the Children of Haqim, it has also broken the stability of the region, especially since many of the attackers stayed in Mesopotamia under the leadership of Menele himself.\nHelped by this upheaval, another insidious threat emerged. Kemintiri, the famous rogue childe of Set, has set her sights on the region as well, to achieve a mysterious goal that only she knows about. Divided by internal conflict between which stance to adopt against these outsiders, will the [ashirra|E] be able to reclaim their land?"
 podintroductions1500.17.a:0 "The rules of hospitality might need to be broken this time..."
 podintroductions1500.18.t:0 "Broken and Defeated"
 podintroductions1500.18.desc:0 "The proud Children of Haqim have been humbled by the Camarilla. In its first full scale assault, they breached Alamut's gates and forced a surrender, putting a stop to the [clan|E]'s expansion in the Ottoman's footsteps. Worse, a curse has been levied upon them as part of the peace treaty, weakening them even further. The Children of Haqim are nothing if not resilient however, and have already started to rebuild.\nIronically, these defeats helped unify the warring factions and they are now getting stronger under the new leadership of Jamal, their most renowned warrior.\nThe Camarilla is watching with apprehension as Alamut reasserts itself, wondering if they just delayed the inevitable..."
 podintroductions1500.18.a:0 "The Eagle's nest prepares itself, vengeance in its heart."
 podintroductions1500.19.t:0 "Shifting Tides"
 podintroductions1500.19.desc:0 "India has been spared from the Inquisition and the Anarch Revolt but has suffered from one massive event nonetheless : the collapse of the Scarlet Phoenix Court. Once the principal opponent to the Ravnos in the so called 'Eternal War', the Burmese Court has crumbled unto itself, plagued by corruption and betrayal.\nAs various minors leaders try to pick up the pieces, this event leaves a strong opportunity for the Ravnos to finally strikes a decisive blow to their sworn enemies. Still, the path to victory won't exactly be easy as the second major Wan Kuei court, the Infinite Thunder, is still strong and poised to counter the Ravnos's advance at every step.\nIndia's fate might have finally shifted, but it is too soon to call a victor yet."
 podintroductions1500.19.a:0 "A lasting change or a mere footnote?"
  podintroductions.12.t:0 "Still Falling"
 podintroductions.12.desc:0 "Although it has been burnt centuries ago, the loss of Carthage is still felt in the Maghreb. The area has since been carved between various [ashirra|E] sultans, but none of them has really managed to consolidate the region. The two best poised to do so are Sophoniba, the very old leader of Tunis who still remembers the loss of her city alongside Carthage, and Zamra Matoub of Algiers, a young and ambitious Lasombra. The Setites also have a foothold here, as do [clan|E] Tremere. With this divided patchwork or powers, and rich history, the Maghreb is a tantalizing prize for any adventurous prince or sultan."
 podintroductions.12.a:0 "We need to move on from Carthage."
 podintroductions.13.t:0 "In the Pyramid's Shadow"
 podintroductions.13.desc:0 "Egypt has endured many foreign conquerors, and its native undead are nothing if not patient and resilient. The real power here lies in Gizeh, with the heart of [clan|E] Setite. The [clan|E] of freedom –or corruption depending on who you ask- is preparing its forces to profit from the vacuum of power created by the crusades. Their first target will undoubtedly be Cairo. Led by the powerful 5th generation Ventrue Antonius, the city won’t fall easily though and could thwart the Serpents if open war was declared. Everyone is sure that the Followers of Set will make their first move soon, but nobody can say when, and if, they will be stopped when they do…"
 podintroductions.13.a:0 "Egypt is as immortal as we are."
 podintroductions.14.t:0 "Land of Duality"
 podintroductions.14.desc:0 "Africa's native Vampires are the Laibon, a loose association of multiple bloodlines and self created bloodsuckers. They hold most of the true power in the continent but must contend with the many adventurers or petty warlords looking for fame and fortune in their lands. Even worse, Africa is also home to some truly ancient creatures, still there from the time where it was the cradle of humanity. With various new roads opening with the Muslim, and [ashirra|E], world, it remains to be seen if the Laibon will be able to adapt and prosper in the changing times."
 podintroductions.14.a:0 "Opportunities and dangers aplenty."
 podintroductions.15.t:0 "In the Skies"
 podintroductions.15.desc:0 "To outsiders, Tibet is home to very strange Vampires... if they can be called Vampires at all! The so called White Exiles are part of the Wan Kuei, the Hungry Ghosts of China, and are firmly established in the east. In the west though, even stranger things dwell from demon worshiping abominations to illuminated followers of a dead Egyptian god. Far away from any true center of undead power, Tibet is very much a sideshow to most Vampires. But mysteries can hold rewards to those who seek deep enough..."
 podintroductions.15.a:0 "Tibet is very much its own world."
 podintroductions.16.t:0 "Thunder from the East"
 podintroductions.16.desc:0 "The steppes aren’t a land for Vampires. Few cities to hide, few nations to manipulate and bend to their will. But, from the east comes a new breed of Vampires, one that is at home on the unending plains and with the nomadic Mongol people. These Anda, a Gangrel offshoot, are proud warriors and follow the massively expanding Mongol Empire with its conquests. Conflict with the already present Gangrel of the west seems inevitable and, even further, tensions with the European [cainites|E] are to be expected when these newcomers arrive. Change is a rare thing to come by with Vampires, but when it comes with a thunderous horde of horse archers, change could be the last thing many of them experience…"
 podintroductions.16.a:0 "Change isn't always welcome…"
 podintroductions.17.t:0 "Ye who enter here…"
 podintroductions.17.desc:0 "Eastern Europe is the traditional land of the Tzimisce [clan|E], but their hegemony has been recently contested by the rise of the Tremere, backed by German and Hungarian Ventrue. A recent war has been ended with a bitter peace treaty between Vladimir Rustovitch, voivode of voivodes, and Jurgen von Verden, Ventrue crusader. A buffer state, the Obertus Order, has been established, headed by the broker of peace Myka Vykos. Now, everyone lick their wounds, Rustovitch trying to assure his control of the [clan|E] and the Hungarian Ventrue solving a succession crisis with the [torpor|E] of their leader, Bulscu. Finally, Etrius is leading the Usurpers in Tremere's stead, showing the facade of an unified pyramid against the fiends. Everyone knows that war is inevitable in this region until a Vampire stands powerful enough to crush his rivals once and for all. Who will it be?"
 podintroductions.17.a:0 "A land to be tamed."
 podintroductions.18.t:0 "Fading Dream"
 podintroductions.18.desc:0 "The ashes of Constantinople are still hot and, yet, vultures are already circling over its corpse. Michael’s Dream, a vampiric utopia never seen since Carthage, has fallen with its creator, and a number of warlords and remnants of the broken Empire are trying to survive. The most important of them is Alfonzo, one of the instigators of the 4th Crusade, now holding Constantinople. The ambitious Lasombra still bow to the [clan|E] leaders in Sicily, but for how long? Further west, Natalya Svyatoslav of the Brujah is one of the last true believers of the Dream still active, hoping to claim the mantle of the ‘Archangel’ Michael for herself. Anna Comnena hasn't such lofty ambitions, using Nikaea to finally get the Empire that should have been hers even during her breathing days. As many others aspiring princes build domains in the ashes of the old, Constantinople could be reborn anew… or dead for good."
 podintroductions.18.a:0 "Has Michael foreseen this chaos?"                                       
 podintroductions.19.t:0 "Grandmother, grandmother..."
 podintroductions.19.desc:0 "As far as anyone can remember, Russia is home to one of the most powerful kindred in existence, Baba Yaga. This 4th generation Nosferatu, rumored to be the true progenitor of the [clan|E], is very much part of the land, and uses it to defend herself against her vengeful [Sire|E]. Luckily for all in the area, the witch is in [torpor|E]. But the influence of her Shadow Curtain is still felt, nurtured by her loyal second in command, Viktor. With such conditions, there are only three types of Vampires in Russia : the vassals of the Grandmother, the brave, and the soon to be dead. The latter two categories oftentimes overlapping each other..."
 podintroductions.19.a:0 "Beware the little girls..."                                       
 podintroductions.20.t:0 "New Fate for the Old Land"
 podintroductions.20.desc:0 "Traditionally a frontier of the Tzimisce Voivodate home to the more... eccentric fiends, Poland is coming into its own, separate, entity. The crumbling authority of the Voivodes, and their utter anachronism, has allowed a new generation of Vampires to take hold and prosper. First among them is Yitzhak ben Avraham, a devout Brujah, gathering followers around Krakow to expel the bygone prince, Razkoljna. This could be the first step towards a Poland free of Tzimisce's influence. But greater challenges await, most notably ousting the utter abomination that is Hedeon Yaroslavich, a Tzimisce even considered extreme by his own peers..."
 podintroductions.20.a:0 "I must heed this wind of change or be crushed by it." 
 podintroductions.21.t:0 "Land of the Free"
 podintroductions.21.desc:0 "Far from the crushing grip of tyrants in Western Europe, the Baltic area is home to two political constructs of a new type for Vampires. In Lithuania, Qarakh of the Gangrel has unified a wide band of free spirited pagans into what he intends to be the stopping point of Christianism, and Ventrue, expansion into the east. Further north, Karl the Blue is leading an Einherjar Free State, perhaps the last of its kind as Scandinavia is falling to Hardestadt's minions. Both of these experiments are in great peril, internal and external, and mostly rely on the sheer charisma of their leaders. Even their bravery and conviction could prove futile against the coming Ventrue onslaught..."
 podintroductions.21.a:0 "The last remnants of a dying age won't go down easily." 

