 POD_darkling_mirror.death_management.option.a:0 "My evilness has returned"
 POD_darkling_mirror.death_management.option.a.tt:0 "Your split P'o and you are one again"

 PODquincunx.100.t:0 "News from China"
 PODquincunx.100.desc:0 "A messenger comes to you, bearing news from the East.\nIn a scroll sent to Emperor Da of the White Tiger Court, the remaining true Black Tortoise Court Wan Kuei renounce both the light of Heaven and the darkness of Yomi.\nThis letter confirms the former faction's legitimacy, which make the White Tiger and Yellow Emperor Courts call for a meeting of all influential Ancestors in three year from now to assess the situation."
 PODquincunx.100.option.a:0 "Should I assist?"
 
 PODquincunx.110.t:0 "News from China : Council of Dragons"
 PODquincunx.110.desc:0 "The congregation of Ancestors met at the Shaolin monastery near Changan, it declared that foreigners, particular those Kin-Jin, were to blame for the fall of the August Courts.\nIn response, they will establish a new order - the Quincunx. It will consist of several courts in the five cardinal directions: the Blood Court in the north, the Flesh Court in the east, the Flame Court in the south, the Bone Court in the west, and the Jade Court in the center."
 PODquincunx.110.option.a:0 "A new order rises in China."
 
 PODquincunx.201.t:0 "Destiny of Scarlet Phonix Court"
 PODquincunx.201.desc:0 "Black Tortoise and Yellow Emperor Wan Kuei pressed against your court, and politically minded Wan Kuei in all courts hurl allegations of akuma with litte or no evidence. Is time for you to decide Scarlet Phoenix, separat form northerner's courts and proclaims new Courts. Or obey their mandate to mantain unite."
 PODquincunx.201.option.a:0 "Declare independence."
 PODquincunx.201.option.b:0 "Purge all Yomi-tainted."
 
 PODquincunx.200.t:0 "The End of the Scarlet Phoenix Court"
 PODquincunx.200.desc:0 "The Scarlet Phoenix Court has always been isolated from the Chinese courts and it has come to no surprise that they decided to not take part in the Quincunx meeting.\nAs a new age dawns upon them, they have decided to rename themselves into the Golden Courts and keep their independence."
 PODquincunx.200.option.a:0 "The Wheel of Ages is turning."
 
 PODquincunx.210.t:0 "The End of the Azure Dragon Court"
 PODquincunx.210.desc:0 "The civility between Japanese gaki and the Hungry Dead of the mainland has ended. Korean survivors eventually traveled south and helped form the Quincunx. The Korean/Japanese Azure Dragon Court is no more, divided between the Green Courts of Korea, allied to the Quincunx, and the Clans of the Sun in Nihon/Japan."
 PODquincunx.210.option.a:0 "The Wheel of Ages is turning."
 
 PODquincunx.220.t:0 "The End of the Yellow Emperor Court"
 PODquincunx.220.desc:0 "The attack on Emperor Wang Hongben fragmented the Golden Jade Society, pulling the Courts of the Yellow Emperor apart. The situation worsened by the destruction of the Mongol conquest and accusation of helping the infernalists Akuma.\nWith the Treaty of the Quincunx, the Yellow Emperor Court is now reformed into the Jade Court."
 PODquincunx.220.option.a:0 "The Wheel of Ages is turning."
 
 PODquincunx.230.t:0 "The End of the White Tiger Court"
 PODquincunx.230.desc:0 "The Court of the White Tiger split into competing factions when Empress Fan abandoned her position, Emperor Da's attempts to bring peace failed.\nAfter the swath of destruction brought by the Mongols and Akuma from the Black Tortoise court; the survivors joined the newly formed Quincunx.\nThe White Tiger Court is no more."
 PODquincunx.230.option.a:0 "The Wheel of Ages is turning."
 
 PODquincunx.240.t:0 "The End of the Black Tortoise Court"
 PODquincunx.240.desc:0 "As the Ming armies attack Karakorum, dozen of Wu from all the August Courts descend on the city for revenge, and the nighttime battle lasts for weeks. In the end, the Akuma infested Black Tortoise Court is no more: those still uncorrupted have joined the Quincunx, the others have been put to the torch or the sword."
 PODquincunx.240.option.a:0 "The Wheel of Ages is turning."
 
 