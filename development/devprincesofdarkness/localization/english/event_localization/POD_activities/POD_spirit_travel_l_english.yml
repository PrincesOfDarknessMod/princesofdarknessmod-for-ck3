l_english:
 tab_spirit_travel:0 "#T Umbra#!"
 spirit_travel_header:0 "Reaching:"
 
 # Location event
 
 POD_spirit_travel.101.t:0 "$spirit_travel_header$ Lost in Tempest"
 POD_spirit_travel.101.desc:0 "You couldn't orientate yourself in the ever-shifting Tempest, you ended in the same place where you started."
 POD_spirit_travel.101.a:0 "Fine."
 
 # End travel event
 
 POD_spirit_travel.998.t:0 "$spirit_travel_header$ Forced to Return"
 POD_spirit_travel.998.desc:0 "You ended your spirit travel because you ran out of energy."
 POD_spirit_travel.998.a:0 "I stayed too long!"
 
 POD_spirit_travel.999.t:0 "$spirit_travel_header$ Return"
 POD_spirit_travel.999.desc:0 "You ended your spirit travel as you wished."
 POD_spirit_travel.999.a:0 "Earth! I am back."
 
 # KJ only event
 
 POD_spirit_travel.1001.t:0 "$spirit_travel_header$ Inspiration"
 POD_spirit_travel.1001.desc:0 "The areas of the spirit worlds close to the Wall are called the Mirror Lands, so named because they appear as ghostly reflections of the nearby Middle Kingdom.\n\nThis is your first spirit travel, looking at this extraordinary view makes you feel inspired."
 POD_spirit_travel.1001.a:0 "It's amazing!"
 
 POD_spirit_travel.1002.t:0 "$spirit_travel_header$ Teaching of Spirit"
 POD_spirit_travel.1002.desc_opening:0 "You entered the Spirit World, as deep you can, then you received instructions from a"
 POD_spirit_travel.1002.desc_high:0 "ancient, historic Wan Kuei, a Grand Ancestor"
 POD_spirit_travel.1002.desc_yin:0 "Yama King"
 POD_spirit_travel.1002.desc_yang:0 "powerful spirit"
 POD_spirit_travel.1002.desc_low:0 "normal spirit"
 POD_spirit_travel.1002.desc_ending:0 "who shared some dharma understanding."
 POD_spirit_travel.1002.a:0 "My spirit mentor."
 
 # Common event
 
 POD_spirit_travel.1100.t:0 "Diplomacy Challenge"
 POD_spirit_travel.1100.desc:0 "You are stopped by someone who live in this area, maybe you can convince them to show you how to pass here."
 POD_spirit_travel.1110.t:0 "Martial Challenge"
 POD_spirit_travel.1110.desc:0 "You are stopped by a riddle in form of wargame, is time to show how good are you to that."
 POD_spirit_travel.1120.t:0 "Stewardship Challenge"
 POD_spirit_travel.1120.desc:0 "You are stopped by a riddle in form of a equation, are you good in math?"
 POD_spirit_travel.1130.t:0 "Intrigue Challenge"
 POD_spirit_travel.1130.desc:0 "You meet a strong foe in your path, maybe you can distract them with some trick?"
 POD_spirit_travel.1140.t:0 "Learning Challenge"
 POD_spirit_travel.1140.desc:0 "You are stopped by a puzzle, can you solve that?"
 POD_spirit_travel.1100.a:0 "I will do my best."
 POD_spirit_travel.1100.critical_success:0 "Critical Success"
 POD_spirit_travel.1100.success:0 "Success"
 POD_spirit_travel.1100.fail:0 "Fail"
 POD_spirit_travel.1100.critical_fail:0 "Critical Fail"
 
 # Umbra gui
 
 UMBRA_TOOLTIP:0 "Has the power to access the umbra"
 UNDERWORLD_TOOLTIP:0 "Has the power to access the underworld"
 SPIRIT_TRAVELING_TOOLTIP:0 "Traveling..."
 spirit_travel_arrived_title:0 "You have Arrived"
 spirit_travel_arrived_desc:0 "You have reached another plane of the spirit world."
 
 shadow_realm_to_skinlands_option_tooltip:0 "This option is available because I have the [GetPerk('empower_ba_perk').GetName( GetPlayer )] [perk|E]."
 
 skinlands_title:0 "$spirit_travel_header$ Skinlands"
 skinlands_desc:0 "Wraiths refer to the world of the living as the Skinlands; this contrasts with the Shadowlands, the lands of the dead and the wraiths' home."
 skinlands_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] that are not [GetTrait('risen').GetName( GetPlayer )] lose #N 1#! Pathos every year while stay in Skinlands.\n$BULLET_WITH_TAB$ Necromancer gain stress every year to mantain bound [GetTrait('wraith').GetName( GetPlayer )] in Skinlands."
 skinlands_option:0 "Return to the material world"
 
 periphery_title:0 "$spirit_travel_header$ Periphery"
 periphery_desc:0 "The Periphery, sometimes also called the "Soft Umbra", is a place - or a state of mind, as many Fera would point out - between the Penumbra and the Material World."
 periphery_effect_desc:0 ""
 periphery_option:0 "If I change my mind..."
 
 astral_plane_title:0 "$spirit_travel_header$ Astral plane"
 astral_plane_desc:0 "The astral plane is actually the lowest level of the Vulgate, one of known [penumbra|E] linked to the [astral_reaches|E]."
 astral_plane_effect_desc:0 ""
 astral_plane_option:0 "I am going 'up'"

 vulgate_title:0 "$spirit_travel_header$ Vulgate"
 vulgate_desc:0 "A Vulgate- also known as Mundus Imaginalis- is the lowest part of the [astral_reaches|E]. It incorporates the most easiest accesible concepts that the collective philosophy and mindsets of humanity (and, possibly, some other species) has thought of."
 vulgate_effect_desc:0 ""
 vulgate_option:0 "Ascend to Vulgate"

 spiers_title:0 "$spirit_travel_header$ Spiers"
 spiers_desc:0 "Cosmologists believe that the Spires are the result many minds concentrating on the same idea, causing it to be elevated from the Vulgate into a higher realm. Along the Spires, the traveler can reach the Courts, which represent astral embodiments of similar ideas, like the Court of Muses or the Elemental Court."
 spiers_effect_desc:0 ""
 spiers_option:0 "Ascend to Spiers"

 epiphamy_title:0 "$spirit_travel_header$ Epiphamy"
 epiphamy_desc:0 "Epiphamies - or Mundus Intelligibilis, as the Order of Hermes and the Celestial Chorus classifies them, or Pandimensional Metaverse, as the Technocracy calls them - are among the most difficult areas to attain within the High Umbra."
 epiphamy_effect_desc:0 ""
 epiphamy_option:0 "Ascend to Epiphamy"

 spirit_wilds_title:0 "$spirit_travel_header$ Spirit Wilds"
 spirit_wilds_desc:0 "The Spirit Wilds are another name for the Middle Umbra, particularly the space between the Near Realms. This part of the Umbra reflects the natural environment, both in its pristine state and the toxic."
 spirit_wilds_effect_desc:0 ""
 spirit_wilds_option:0 "I am going 'out'"

 atrocity_realm_title:0 "$spirit_travel_header$ Atrocity Realm"
 atrocity_realm_desc:0 "The Atrocity Realm, known to mages as the Wasteland, is one of the Near Realms. Banes breed here."
 atrocity_realm_effect_desc:0 ""
 atrocity_realm_option:0 "Go atrocity"

 battleground_title:0 "$spirit_travel_header$ Battleground"
 battleground_desc:0 "The Battleground, known in the East as the Realm of Fighting Spirits,  is a Near Realm within the Umbra containing every battle that has ever been fought, from the earliest conflicts between neolithic tribes against bears and wolves, the Impergium and the Wars of Rage up to the current conflicts within the Middle East and gang wars."
 battleground_effect_desc:0 ""
 battleground_option:0 "To battle"

 cyberrealm_title:0 "$spirit_travel_header$ CyberRealm"
 cyberrealm_desc:0 "The CyberRealm is one of the thirteen Near Realms in the Umbra. This realm represents perhaps the pinnacle of the Weaver's influence in the Umbra. It is called Dystopia by mages."
 cyberrealm_effect_desc:0 ""
 cyberrealm_option:0 "Go cyber"

 erebus_title:0 "$spirit_travel_header$ Erebus"
 erebus_desc:0 "Often compared to Garou 'hell,' Erebus is actually a place of spiritual cleansing."
 erebus_effect_desc:0 ""
 erebus_option:0 "Go to erebus"

 flux_realm_title:0 "$spirit_travel_header$ Flux Realm"
 flux_realm_desc:0 "The Flux, Flux Realm, or Radiance is a Realm within the Near Umbra. It is a powerful reservoir of pure, undiluted Wyld energy, untainted by the chartering of the Weaver."
 flux_realm_effect_desc:0 ""
 flux_realm_option:0 "Give flux"

 hy_brasil_title:0 "$spirit_travel_header$ Hy-Brasil"
 hy_brasil_desc:0 "A domain of the faeries sundered forever from lost Arcadia. "
 hy_brasil_effect_desc:0 ""
 hy_brasil_option:0 "Fairy"

 legendary_realm_title:0 "$spirit_travel_header$ Legendary Realm"
 legendary_realm_desc:0 "The Legendary Realm is one of the Near Realms located in the Near Umbra. Garou traveling through this realm can experience the lives of their legendary ancestors. "
 legendary_realm_effect_desc:0 ""
 legendary_realm_option:0 "See the legend"

 mountains_of_heaven_title:0 "$spirit_travel_header$ Mountains of Heaven"
 mountains_of_heaven_desc:0 "The Mountains of Heaven are an Umbral Realm within the Yang World. The Realm manifests as a great chain of mountains, dwarfing even the mighty Himalayas, crests above a sea of clouds. "
 mountains_of_heaven_effect_desc:0 ""
 mountains_of_heaven_option:0 "Climb the Montain"

 pangaea_title:0 "$spirit_travel_header$ Pangaea"
 pangaea_desc:0 "Pangaea is a reflection of primal Earth, showing the world as it was before civilization, human history, and even the Impergium."
 pangaea_effect_desc:0 ""
 pangaea_option:0 "Go to Pangaea"

 scar_title:0 "$spirit_travel_header$ Scar"
 scar_desc:0 "Scar is one of the Near Realms of the Umbra. It is a manifestation of the industrial revolution corrupted into a soul grinding oppression under a rusted prosperity ideal."
 scar_effect_desc:0 ""
 scar_option:0 "The scar"

 summer_country_title:0 "$spirit_travel_header$ Summer Country"
 summer_country_desc:0 "The Summer Country is one of the Near Realms located in Earth's Near Umbra. It is now little more than a myth, as it’s been fading away for decades. Legends say the realm is a reflection of Gaia’s pure and boundless love for Her children. "
 summer_country_effect_desc:0 ""
 summer_country_option:0 "Summer time"

 tiger_lands_title:0 "$spirit_travel_header$ Tiger Lands"
 tiger_lands_desc:0 "The Tiger Lands are a Yang Realm within the Eastern Umbra that acts as a refugee for the spirits of threatened animals and spirits who have lost their homes following human clearcuttings."
 tiger_lands_effect_desc:0 ""
 tiger_lands_option:0 "See the tiger"

 umi_title:0 "$spirit_travel_header$ Umi"
 umi_desc:0 "One of the mightiest Umbral realms of the Middle Kingdom, the domain of Umi claims the entire Pacific as its purview, though certain Polynesian and Indonesian spirit realms beg to differ. "
 umi_effect_desc:0 ""
 umi_option:0 "Under the Sea"

 wolfhome_title:0 "$spirit_travel_header$ Wolfhome"
 wolfhome_desc:0 "Wolfhome is one of the Near Realms, located in Earth's Near Umbra. It is frequented by Garou. This realm is a vast expanse of pristine wilderness. Answers to primal mysteries are hidden here."
 wolfhome_effect_desc:0 ""
 wolfhome_option:0 "Wolfhome"

 deep_umbra_title:0 "$spirit_travel_header$ Deep Umbra"
 deep_umbra_desc:0 "Deep Umbra, also called the Deep Universe, is a vast realm outside Earth's Umbral space. It is largely an immense void. From the human perspective, the Deep Umbra is deep space, outer space, or the whole of the universe."
 deep_umbra_effect_desc:0 ""
 deep_umbra_option:0 "Enter the deep space."
 
 shadowlands_title:0 "$spirit_travel_header$ Shadowlands"
 shadowlands_desc:0 "The Shadowlands are a mirror 'skin' of reality, with every location in the breathing realm having a corresponding location in the Shadowlands which, for the most part, obey conventional rules of distance."
 shadowlands_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] gain #P 1#! Pathos every year while stay in Shadowlands."
 shadowlands_option:0 "Go into the shadow"
 
 tempest_title:0 "$spirit_travel_header$ Tempest"
 tempest_desc:0 "The Tempest is a perpetually swirling maelstrom of energy, memories and Spectres issuing from the Labyrinth and continuously raining plasma and materials on both the Shadowlands and Dark Kingdoms."
 tempest_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ #N 50%#! of chance being lost in the Tempest."
 tempest_option:0 "I am going to 'dive'"
 
 dark_kingdom_of_clay_title:0 "$spirit_travel_header$ Dark Kingdom of Clay"
 dark_kingdom_of_clay_desc:0 "Karta, known to outsiders as the [dark_kingdom|E] of Clay, is the realm in the Tempest that belongs to the aboriginal people of Australia."
 dark_kingdom_of_clay_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] gain #P 1#! Pathos every year while stay in this [dark_kingdom|E]."
 dark_kingdom_of_clay_option:0 "Travel to Karta"
 
 dark_kingdom_of_iron_title:0 "$spirit_travel_header$ Dark Kingdom of Iron"
 dark_kingdom_of_iron_desc:0 "Stygia is the capital of the western dead, an incomprehensibly huge city located on the Isle of Sorrows deep in the Tempest. It is the location of the major headquarters of the various organizations of western wraiths."
 dark_kingdom_of_iron_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] gain #P 1#! Pathos every year while stay in this [dark_kingdom|E]."
 dark_kingdom_of_iron_option:0 "Travel to Stygia"
 
 dark_kingdom_of_ivory_title:0 "$spirit_travel_header$ Dark Kingdom of Ivory"
 dark_kingdom_of_ivory_desc:0 "The Bush of Ghosts, which also goes by the [dark_kingdom|E] of Ivory, is the Shadowlands for the abambo, or the wraiths of Africa."
 dark_kingdom_of_ivory_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] gain #P 1#! Pathos every year while stay in this [dark_kingdom|E]."
 dark_kingdom_of_ivory_option:0 "Travel to Bush of Ghosts"
 
 dark_kingdom_of_jade_title:0 "$spirit_travel_header$ Dark Kingdom of Jade"
 dark_kingdom_of_jade_desc:0 "The Yellow Springs, also called the [dark_kingdom|E] of Jade, is a part of the Underworld dedicated to and controlled by the dead of Asia."
 dark_kingdom_of_jade_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] gain #P 1#! Pathos every year while stay in this [dark_kingdom|E]."
 dark_kingdom_of_jade_option:0 "Travel to Yellow Springs"
 
 dark_kingdom_of_obsidian_title:0 "$spirit_travel_header$ Dark Kingdom of Obsidian"
 dark_kingdom_of_obsidian_desc:0 "The Flayed Lands is the name for the kingdom of the dead that held dominion over Central America, part of the mighty [dark_kingdom|E] of Obsidian."
 dark_kingdom_of_obsidian_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] gain #P 1#! Pathos every year while stay in this [dark_kingdom|E]."
 dark_kingdom_of_obsidian_option:0 "Travel to Flayed Lands"
 
 dark_kingdom_of_sand_title:0 "$spirit_travel_header$ Dark Kingdom of Sand"
 dark_kingdom_of_sand_desc:0 "Amenti, the [dark_kingdom|E] of Sand, is the Dark Kingdom of the Undying in the Underworld. It's not populated by wraiths, but by Immortals, who died and found themselves back in the Shadowlands."
 dark_kingdom_of_sand_effect_desc:0 ""
 dark_kingdom_of_sand_option:0 "Travel to Amenti"

 shadow_realm_title:0 "$spirit_travel_header$ Shadow Realm"
 shadow_realm_desc:0 "Shadow Realms are places in the Underworld that Mummies visit in order to regenerate themselves until they are ready to inhabit their bodies again and that grant them protection against the predations of Spectres or Maelstroms."
 shadow_realm_effect_desc:0 ""

 hades_title:0 "$spirit_travel_header$ Hades"
 hades_desc:0 "The central [shadow_realm|E] of cabiri kind was called Hades, after the mythical greek underworld."
 hades_effect_desc:0 ""

 gates_of_heaven_title:0 "$spirit_travel_header$ Gates of Heaven"
 gates_of_heaven_desc:0 "Responsibility weighs heavily on all of the Reborn. The Eight Immortals give the Wu T’ian missions. They receive instruction, and they must carry out the will of heaven. When they fail, they spend time in contemplation at the Gates of Heaven, preparing themselves so that they will not fail again."
 gates_of_heaven_effect_desc:0 ""
 
 sea_of_shadows_title:0 "$spirit_travel_header$ Sea of Shadows"
 sea_of_shadows_desc:0 "Sea of Shadows is a term used by Wraiths to describe the "bottom" layer of the Tempest which flows around and into the Labyrinth and Oblivion."
 sea_of_shadows_effect_desc:0 ""
 sea_of_shadows_option:0 "Dive deeper"
 
 labyrinth_title:0 "$spirit_travel_header$ Labyrinth"
 labyrinth_desc:0 "The Labyrinth is the interface between Oblivion and the Underworld. As many things are in the Underworld, Oblivion is a concept and a physical entity - there is a physical location, the Well of the Void that comprises Oblivion - the Labyrinth is that area surrounding it."
 labyrinth_effect_desc:0 ""
 labyrinth_option:0 "Go thought the Labyrinth"
 
 oblivion_title:0 "$spirit_travel_header$ Oblivion"
 oblivion_desc:0 "Oblivion is entropy itself, a constantly churning force of destruction and madness from which there is no return."
 oblivion_effect_desc:0 ""
 oblivion_option:0 "End in Oblivion"
 
 abyss_title:0 "$spirit_travel_header$ Abyss"
 abyss_desc:0 "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen."
 abyss_effect_desc:0 ""
 abyss_option:0 "Fall in Abyss"

 aetherial_realm_title:0 "$spirit_travel_header$ Aetherial Realm"
 aetherial_realm_desc:0 "The Aetherial Realm, also known as Aetheria, is the farthest expanse of the Near Realm within the Umbra that spans over the Spirit Wilds up to the Membrane. It is reflected in the physical world as the skies above that constantly cycle through night and day."
 aetherial_realm_effect_desc:0 ""
 aetherial_realm_option:0 "I am going to 'fly'"

 first_horizon_title:0 "$spirit_travel_header$ First Horizon"
 first_horizon_desc:0 " The First Horizon lies at the edge of Earth's atmosphere and is studded with Horizon Realms, including the Shade Realms. "
 first_horizon_effect_desc:0 ""
 first_horizon_option:0 "I am going out to exit the earth."

 true_horizon_title:0 "$spirit_travel_header$ True Horizon"
 true_horizon_desc:0 "The True Horizon, also called Subspace by the Technocracy and Etherspace by the Sons of Ether, is a vast expanse of the Umbra located between the Near Umbra and Far Umbra. To Sleepers, it manifests as the space between the Sun and the asteroid belt. "
 true_horizon_effect_desc:0 ""
 true_horizon_option:0 "I am going to space"

 far_horizon_title:0 "$spirit_travel_header$ Far Horizon"
 far_horizon_desc:0 "The Far Horizon corresponds roughly to the location of the asteroid belt."
 far_horizon_effect_desc:0 ""
 far_horizon_option:0 "I am going to the astroy belt"
 
 near_dreaming_title:0 "$spirit_travel_header$ Near Dreaming"
 near_dreaming_desc:0 "The Near Dreaming is the part of the Dreaming closest to the Mundane World."
 near_dreaming_effect_desc:0 ""
 near_dreaming_option:0 "Is that a trod?"