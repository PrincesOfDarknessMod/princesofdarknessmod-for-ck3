l_english:
 spirit_travel_header:0 "Reaching:"
 
 # End travel event
 
 POD_spirit_travel.998.t:0 "$spirit_travel_header$ Forced to Return"
 POD_spirit_travel.998.desc:0 "You ended your spirit travel because you ran out of energy."
 POD_spirit_travel.998.a:0 "I stayed too long!"
 
 POD_spirit_travel.999.t:0 "$spirit_travel_header$ Return"
 POD_spirit_travel.999.desc:0 "You ended your spirit travel as you wished."
 POD_spirit_travel.999.a:0 "Earth! I am back."
 
 # KJ only event
 
 POD_spirit_travel.1001.t:0 "$spirit_travel_header$ Inspiration"
 POD_spirit_travel.1001.desc:0 "The areas of the spirit worlds close to the Wall are called the Mirror Lands, so named because they appear as ghostly reflections of the nearby Middle Kingdom.\n\nThis is your first spirit travel, looking at this extraordinary view makes you feel inspired."
 POD_spirit_travel.1001.a:0 "It's amazing!"
 
 POD_spirit_travel.1002.t:0 "$spirit_travel_header$ Teaching of Spirit"
 POD_spirit_travel.1002.desc_opening:0 "You entered the Spirit World, as deep you can, then you received instructions from a"
 POD_spirit_travel.1002.desc_high:0 "ancient, historic Wan Kuei, a Grand Ancestor"
 POD_spirit_travel.1002.desc_yin:0 "Yama King"
 POD_spirit_travel.1002.desc_yang:0 "powerful spirit"
 POD_spirit_travel.1002.desc_low:0 "normal spirit"
 POD_spirit_travel.1002.desc_ending:0 "who shared some dharma understanding."
 POD_spirit_travel.1002.a:0 "My spirit mentor."
 
 # Common event
 
 POD_spirit_travel.1100.t:0 "Diplomacy Challenge"
 POD_spirit_travel.1100.desc:0 "You are stopped by someone who live in this area, maybe you can convince them to show you how to pass here."
 POD_spirit_travel.1110.t:0 "Martial Challenge"
 POD_spirit_travel.1110.desc:0 "You are stopped by a riddle in form of wargame, is time to show how good are you to that."
 POD_spirit_travel.1120.t:0 "Stewardship Challenge"
 POD_spirit_travel.1120.desc:0 "You are stopped by a riddle in form of a equation, are you good in math?"
 POD_spirit_travel.1130.t:0 "Intrigue Challenge"
 POD_spirit_travel.1130.desc:0 "You meet a strong foe in your path, maybe you can distract them with some trick?"
 POD_spirit_travel.1140.t:0 "Learning Challenge"
 POD_spirit_travel.1140.desc:0 "You are stopped by a puzzle, can you solve that?"
 POD_spirit_travel.1100.a:0 "I will do my best."
 POD_spirit_travel.1100.critical_success:0 "Critical Success"
 POD_spirit_travel.1100.success:0 "Success"
 POD_spirit_travel.1100.fail:0 "Fail"
 POD_spirit_travel.1100.critical_fail:0 "Critical Fail"
 
 # Unused
 
 POD_spirit_travel.100.a:0 "I want to explore here a bit more."
 POD_spirit_travel.101.t:0 "$spirit_travel_header$ Lost in Tempest"
 POD_spirit_travel.101.desc:0 "You couldn't orientate yourself in the ever-shifting Tempest, you ended in the same place where you started."
 POD_spirit_travel.101.a:0 "Fine."
 
 # Umbra gui
 
 UMBRA_TOOLTIP:0 "Has the power to access the umbra"
 UNDERWORLD_TOOLTIP:0 "Has the power to access the underworld"
 SPIRIT_TRAVELING_TOOLTIP:0 "Traveling..."
 spirit_travel_arrived_title:0 "You have Arrived"
 spirit_travel_arrived_desc:0 "You have reached another plane of the spirit world."
 
 skinlands_option:0 "Return to the material world"
 penumbra_option:0 "If I change my mind..."
 shadowlands_option:0 "Go into the shadow"
 tempest_option:0 "I am going to 'dive'"
 astral_reaches_option:0 "I am going 'up'"
 spirit_wilds_option:0 "I am going 'out'"
 near_dreaming_option:0 "Is that a trod?"
 dark_kingdom_of_clay_option:0 "Travel to Karta"
 dark_kingdom_of_iron_option:0 "Travel to Stygia"
 dark_kingdom_of_ivory_option:0 "Travel to Bush of Ghosts"
 dark_kingdom_of_jade_option:0 "Travel to Yellow Springs"
 dark_kingdom_of_obsidian_option:0 "Travel to Flayed Lands"
 dark_kingdom_of_sand_option:0 "Travel to Amenti"
 shadow_realm_to_skinlands_option_tooltip:0 "This option is available because I have the [GetPerk('empower_ba_perk').GetName( GetPlayer )] [perk|E]."
 
 skinlands_title:0 "$spirit_travel_header$ Skinlands"
 skinlands_desc:0 "Wraiths refer to the world of the living as the Skinlands; this contrasts with the Shadowlands, the lands of the dead and the wraiths' home."
 skinlands_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] that are not [GetTrait('risen').GetName( GetPlayer )] lose #N 1#! Pathos every year while stay in Skinlands.\n$BULLET_WITH_TAB$ Necromancer gain stress every year to mantain bound [GetTrait('wraith').GetName( GetPlayer )] in Skinlands."

 penumbra_title:0 "$spirit_travel_header$ Penumbra"
 penumbra_desc:0 "The Penumbra mirrors physical reality, but reality as it is "supposed" to be. Though divided, the two were once joined. The spirit world still touches the material one, for were it gone completely, Earth could not sustain life. "
 penumbra_effect_desc:0 ""

 astral_reaches_title:0 "$spirit_travel_header$ Astral Reaches"
 astral_reaches_desc:0 "The Astral Reaches, also called the Astral Plane, the Astral Umbra, the High Umbra, or the Upper Umbra are the realms of thought, of idea, of concept."
 astral_reaches_effect_desc:0 ""
 
 spirit_wilds_title:0 "$spirit_travel_header$ Spirit Wilds"
 spirit_wilds_desc:0 "The Spirit Wilds are another name for the Middle Umbra, particularly the space between the Near Realms."
 spirit_wilds_effect_desc:0 ""
 
 near_dreaming_title:0 "$spirit_travel_header$ Near Dreaming"
 near_dreaming_desc:0 "The Dreaming is a universe unto its own. It is said that any and all things may be found there, if one knows how to look."
 near_dreaming_effect_desc:0 ""
 
 shadowlands_title:0 "$spirit_travel_header$ Shadowlands"
 shadowlands_desc:0 "The Shadowlands are a mirror 'skin' of reality, with every location in the breathing realm having a corresponding location in the Shadowlands which, for the most part, obey conventional rules of distance."
 shadowlands_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ [GetTrait('wraith').GetName( GetPlayer )] gain #P 1#! Pathos every year while stay in Shadowlands."

 tempest_title:0 "$spirit_travel_header$ Tempest"
 tempest_desc:0 "The Tempest is a perpetually swirling maelstrom of energy, memories and Spectres issuing from the Labyrinth and continuously raining plasma and materials on both the Shadowlands and Dark Kingdoms."
 tempest_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$ Travel time to other plane: #N +100%#!"

 shadow_realm_title:0 "$spirit_travel_header$ Shadow Realm"
 shadow_realm_desc:0 "Shadow Realms are places in the Underworld that Mummies visit in order to regenerate themselves until they are ready to inhabit their bodies again and that grant them protection against the predations of Spectres or Maelstroms."
 shadow_realm_effect_desc:0 ""

 dark_kingdom_of_clay_title:0 "$spirit_travel_header$ Dark Kingdom of Clay"
 dark_kingdom_of_clay_desc:0 "Karta, known to outsiders as the Dark Kingdom of Clay, is the realm in the Tempest that belongs to the aboriginal people of Australia."
 dark_kingdom_of_clay_effect_desc:0 ""

 dark_kingdom_of_iron_title:0 "$spirit_travel_header$ Dark Kingdom of Iron"
 dark_kingdom_of_iron_desc:0 "Stygia is the capital of the western dead, an incomprehensibly huge city located on the Isle of Sorrows deep in the Tempest. It is the location of the major headquarters of the various organizations of western wraiths."
 dark_kingdom_of_iron_effect_desc:0 ""

 dark_kingdom_of_ivory_title:0 "$spirit_travel_header$ Dark Kingdom of Ivory"
 dark_kingdom_of_ivory_desc:0 "The Bush of Ghosts, which also goes by the Dark Kingdom of Ivory, is the Shadowlands for the abambo, or the wraiths of Africa."
 dark_kingdom_of_ivory_effect_desc:0 ""

 dark_kingdom_of_jade_title:0 "$spirit_travel_header$ Dark Kingdom of Jade"
 dark_kingdom_of_jade_desc:0 "The Yellow Springs, also called the Dark Kingdom of Jade, is a part of the Underworld dedicated to and controlled by the dead of Asia."
 dark_kingdom_of_jade_effect_desc:0 ""

 dark_kingdom_of_obsidian_title:0 "$spirit_travel_header$ Dark Kingdom of Obsidian"
 dark_kingdom_of_obsidian_desc:0 "The Flayed Lands is the name for the kingdom of the dead that held dominion over Central America, part of the mighty Dark Kingdom of Obsidian."
 dark_kingdom_of_obsidian_effect_desc:0 ""

 dark_kingdom_of_sand_title:0 "$spirit_travel_header$ Dark Kingdom of Sand"
 dark_kingdom_of_sand_desc:0 "Amenti, the Dark Kingdom of Sand, is the Dark Kingdom of the Undying in the Underworld. It's not populated by wraiths, but by Immortals, who died and found themselves back in the Shadowlands."
 dark_kingdom_of_sand_effect_desc:0 ""

