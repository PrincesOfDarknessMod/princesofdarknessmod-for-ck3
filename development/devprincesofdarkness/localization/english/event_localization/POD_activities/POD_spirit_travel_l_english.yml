l_english:
 spirit_travel_header:0 "Reaching:"
 
 # Common event
 
 
 POD_spirit_travel.998.t:0 "$spirit_travel_header$ Forced to Return"
 POD_spirit_travel.998.desc:0 "You ended your spirit travel because you are run out of energy."
 POD_spirit_travel.998.a:0 "I stay too long!"
 
 POD_spirit_travel.999.t:0 "$spirit_travel_header$ Return"
 POD_spirit_travel.999.desc:0 "You ended your spirit travel as you wish."
 POD_spirit_travel.999.a:0 "Earth! I am back."
 
 POD_spirit_travel.1001.t:0 "$spirit_travel_header$ Inspiration"
 POD_spirit_travel.1001.desc:0 "The areas of the spirit worlds close to the Wall are called the Mirror Lands, so named because they appear as ghostly reflections of the nearby Middle Kingdom.\n\nThis is your first spirit travel, looking at this extraordinary view makes you feel inspired."
 POD_spirit_travel.1001.a:0 "It's amazing!"
 
 POD_spirit_travel.1002.t:0 "$spirit_travel_header$ Teaching of Spirit"
 POD_spirit_travel.1002.desc_opening:0 "You entered the Spirit World, as deep you can, then you received instructions from a"
 POD_spirit_travel.1002.desc_high:0 "ancient, historic Wan Kuei, a Grand Ancestor"
 POD_spirit_travel.1002.desc_yin:0 "Yama King"
 POD_spirit_travel.1002.desc_yang:0 "powerful spirit"
 POD_spirit_travel.1002.desc_low:0 "normal spirit"
 POD_spirit_travel.1002.desc_ending:0 "who shared some dharma understanding."
 POD_spirit_travel.1002.a:0 "My spirit mentor."
 
 POD_spirit_travel.1100.t:0 "Diplomacy Challenge"
 POD_spirit_travel.1100.desc:0 "You are stopped by someone who live in this area, maybe you can convince them to show you how to pass here."
 POD_spirit_travel.1110.t:0 "Martial Challenge"
 POD_spirit_travel.1110.desc:0 "You are stopped by a riddle in form of wargame, is time to show how good are you to that."
 POD_spirit_travel.1120.t:0 "Stewardship Challenge"
 POD_spirit_travel.1120.desc:0 "You are stopped by a riddle in form of a equation, are you good in math?"
 POD_spirit_travel.1130.t:0 "Intrigue Challenge"
 POD_spirit_travel.1130.desc:0 "You meet a strong foe in your path, maybe you can distract them with some trick?"
 POD_spirit_travel.1140.t:0 "Learning Challenge"
 POD_spirit_travel.1140.desc:0 "You are stopped by a puzzle, can you solve that?"
 POD_spirit_travel.1100.a:0 "I will do my best."
 POD_spirit_travel.1100.critical_success:0 "Critical Success"
 POD_spirit_travel.1100.success:0 "Success"
 POD_spirit_travel.1100.fail:0 "Fail"
 POD_spirit_travel.1100.critical_fail:0 "Critical Fail"
 
 # Umbra event
 
 POD_umbra_travel.100.t:0 "$spirit_travel_header$ Penumbra"
 POD_umbra_travel.100.desc:0 "You are in the penumbra. The Penumbra mirrors physical reality, but reality as it is "supposed" to be. Though divided, the two were once joined. The spirit world still touches the material one, for were it gone completely, Earth could not sustain life. "
 POD_umbra_travel.100.a:0 "I am going "up"."
 POD_umbra_travel.100.b:0 "I am going "out"."
 POD_umbra_travel.100.c:0 "Is that a trod?"
 POD_umbra_travel.100.e:0 "If I change my mind..."
 POD_umbra_travel.100.f:0 "I want explore here a bit more."
 POD_umbra_travel.100.g:0 "I want return to material world."
 
 POD_umbra_travel.200.t:0 "$spirit_travel_header$ Astral Reaches"
 POD_umbra_travel.200.desc:0 "You are in the Astral Reaches, also called the Astral Plane, the Astral Umbra, the High Umbra, or the Upper Umbra. The Astral Reaches are the realms of thought, of idea, of concept."
 POD_umbra_travel.200.b:0 "I want explore here a bit more."
 POD_umbra_travel.200.c:0 "I am going "down"."
 
 POD_umbra_travel.300.t:0 "$spirit_travel_header$ Spirit Wilds"
 POD_umbra_travel.300.desc:0 "You are in the Spirit Wilds. The Spirit Wilds are another name for the Middle Umbra, particularly the space between the Near Realms."
 POD_umbra_travel.300.b:0 "I want explore here a bit more."
 POD_umbra_travel.300.c:0 "I am going "in"."
 
 POD_umbra_travel.400.t:0 "$spirit_travel_header$ Near Dreaming"
 POD_umbra_travel.400.desc:0 "You are in the Near Dreaming. The Dreaming is a universe unto its own. It is said that any and all things may be found there, if one knows how to look."
 POD_umbra_travel.400.b:0 "I want explore here a bit more."
 POD_umbra_travel.400.c:0 "Wish I can come back?"
 
 # Underworld map
 
 POD_underworld_travel.100.t:0 "$spirit_travel_header$ Shadowlands"
 POD_underworld_travel.100.desc:0 "You are in into the Shadowlands. The Shadowlands are a mirror "skin" of reality, with every location in the breathing realm having a corresponding location in the Shadowlands which, for the most part, obey conventional rules of distance."
 POD_underworld_travel.100.a:0 "I am going "down"."
 POD_underworld_travel.100.b:0 "If I change my mind..."
 POD_underworld_travel.100.c:0 "I want explore here a bit more."
 POD_underworld_travel.100.d:0 "I want return to material world."
 
 POD_underworld_travel.200.t:0 "$spirit_travel_header$ Tempest"
 POD_underworld_travel.200.desc:0 "You are in the Tempest. The Tempest is a perpetually swirling maelstrom of energy, memories and Spectres issuing from the Labyrinth and continuously raining plasm and materials on both the Shadowlands and Dark Kingdoms."
 POD_underworld_travel.200.a:0 "I want find something stable."
 POD_underworld_travel.200.b:0 "I want explore here a bit more."
 POD_underworld_travel.200.c:0 "I am going "up"."
 
 POD_underworld_travel.300.b:0 "I want explore here a bit more."
 POD_underworld_travel.300.c:0 "I am going to "dive"."
 
 POD_underworld_travel.301.t:0 "$spirit_travel_header$ Shadow Realm"
 POD_underworld_travel.301.desc:0 "You are in the Shadow Realm. Shadow Realms are places in the Underworld that Mummies visit in order to regenerate themselves until they are ready to inhabit their bodies again and that grant them protection against the predations of Spectres or Maelstroms."
 POD_underworld_travel.301.a:0 "I should go back."
 
 POD_underworld_travel.310.t:0 "$spirit_travel_header$ Dark Kingdom of Clay"
 POD_underworld_travel.310.desc:0 "You are in the Dark Kingdom of Clay. Dark Kingdoms are pockets of stable reality within the Tempest of the Underworld.\nKarta, known to outsiders as the Dark Kingdom of Clay, is the realm in the Tempest that belongs to the aboriginal people of Australia."

 POD_underworld_travel.320.t:0 "$spirit_travel_header$ Dark Kingdom of Iron"
 POD_underworld_travel.320.desc:0 "You are in the Dark Kingdom of Iron. Dark Kingdoms are pockets of stable reality within the Tempest of the Underworld.\nStygia is the capital of the western dead, an incomprehensibly huge city located on the Isle of Sorrows deep in the Tempest. It is the location of the major headquarters of the various organizations of western wraiths."

 POD_underworld_travel.330.t:0 "$spirit_travel_header$ Dark Kingdom of Ivory"
 POD_underworld_travel.330.desc:0 "You are in the Dark Kingdom of Ivory. Dark Kingdoms are pockets of stable reality within the Tempest of the Underworld.\nThe Bush of Ghosts, which also goes by the Dark Kingdom of Ivory, is the Shadowlands for the abambo, or the wraiths of Africa."

 POD_underworld_travel.340.t:0 "$spirit_travel_header$ Dark Kingdom of Jade"
 POD_underworld_travel.340.desc:0 "You are in the Dark Kingdom of Jade. Dark Kingdoms are pockets of stable reality within the Tempest of the Underworld.\nThe Yellow Springs, also called the Dark Kingdom of Jade, is a part of the Underworld dedicated to and controlled by the dead of Asia."

 POD_underworld_travel.350.t:0 "$spirit_travel_header$ Dark Kingdom of Obsidian"
 POD_underworld_travel.350.desc:0 "You are in the Dark Kingdom of Obsidian. Dark Kingdoms are pockets of stable reality within the Tempest of the Underworld.\nThe Flayed Lands is the name for the kingdom of the dead that held dominion over Central America, part of the mighty Dark Kingdom of Obsidian."

 POD_underworld_travel.360.t:0 "$spirit_travel_header$ Dark Kingdom of Sand"
 POD_underworld_travel.360.desc:0 "You are in the Dark Kingdom of Sand. Dark Kingdoms are pockets of stable reality within the Tempest of the Underworld.\nAmenti, the Dark Kingdom of Sand, is the Dark Kingdom of the Undying in the Underworld. It's not populated by wraiths, but by Immortals, who died and found themselves back in the Shadowlands."
