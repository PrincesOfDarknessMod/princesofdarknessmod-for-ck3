 POD_natural_disasters.0003.t:0 "Weather Sight"
 POD_natural_disasters.0003.desc:0 "Your weather sight has predicted that there will be a dangerous disaster in [target_title.GetNameNoTierNoTooltip], what are you gonna do?"
 POD_natural_disasters.0003.a:0 "I must stop it!"
 POD_natural_disasters.0003.b:0 "I will make it even more powerful!"
 POD_natural_disasters.0003.c:0 "Just ignore it."
 
