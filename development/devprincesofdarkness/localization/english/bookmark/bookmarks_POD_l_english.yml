 bm_1230_warofprinces_sub_lasombra:0 "Clan Lasombra" 
 bm_1230_warofprinces_sub_lasombra_desc:0 "Shadowy predators and ruthless social climbers, the Lasombra exist for their own success, fighting for personal victories rather than solely for a crown to wear or a throne sit upon. They believe that might makes right, and are willing to sacrifice anything to achieve their goals. A clan that uses spirituality as a tool rather than seeking honest enlightenment, their fickle loyalties are currently highlighted by the massive civil war that is plaguing the Sea of Shadows, their once Mediterranean spanning empire. Muslims fight Christians in Iberia, Christians fight Heretics in Italy and the youth fight their elders everywhere at once. The others clans sigh in relief as the Lasombra tear themselves apart, knowing what they could achieve if they were to unify instead.\n\n#bold Clan Lasombra will be forged anew in its own blood. Spill if forth, and conquer.#!" 
 bookmark_warofprinces_lucita:0 "Lucita de Aragon"
 bookmark_warofprinces_lucita_desc:0 "The daughter of King Alfonso II of Aragon, Lucita always craved autonomy and freedom since her youngest age. Her fierce independence and indomitable will were irresistible to the powerful Lasombra Cardinal Ambrosio Luis Moncada and he embraced her. Since then, Lucita has been the rising star of clan Lasombra and the pride of her sire. Despite the praise she receives and the many achievements she already accomplished, the fierce princess is already craving, once again, more freedom... something that goes against both her sire and her clan wishes for her.\n\n#bold No one can cage you for long, Lucita. Earn your independence, even if you have to burn your whole clan for it.#!"
 bookmark_warofprinces_moncada:0 "Ambrosio Luis Moncada"
 bookmark_warofprinces_moncada_desc:0 "A man of ambition, talent, and faith, Ambrosio Luis Moncada was the Archbishop of Madrid in life. To no one's amazement, Monçada made the most of his position. To the surprise of many, however, he did so while holding himself to a strict monasticism. He was absolute in his faith, unshakable in his conviction, and resolute in his use of power for what he considered to be Heaven's causes. The Embrace changed Monçada less than one might suppose. He quickly became the main driving force behind the Shadow Reconquista and his influence inside clan Lasombra is rising steadily, but his reasons for seeking power have not changed. It is not for the glory of Monçada (that poor fleshly shell), but rather for the glory of God.\n\n#bold You are destined to rule over Iberia and clan Lasombra itself. God choose you for his holy task and you will comply with His will, as you always do.#!"
 bookmark_warofprinces_badr:0 "Badr"
 bookmark_warofprinces_badr_desc:0 "As the Iberian Lasombra civil war rages on, the Andalusian Cainites, known as Ashirra, have found a new leader : Badr of Granada. This mysterious Sultan has taken an unyielding stance and is rallying the disparate Taifas to her cause. Her effort has divided the Ashirra community, as many see her as not much better than the Christians, but has still managed to slow down the dreaded Reconquista. As her fame grows, some are starting to be interested in the mysteries surrounding her... and a few of those inquisitive souls have already met a painful end. Badr rules with a shadowy iron fist, but an iron fist all the same.\n\n#bold You must triumph against the Reconquista. This is a springboard for your ambition, and woe to those who stand in your way.#!"
 bookmark_warofprinces_lucius:0 "Lucius Aelius Sejanus"
 bookmark_warofprinces_lucius_desc:0 "Once a Praetorian of Rome, Lucius Aelius Sejanus almost rose to become Emperor but was cut short before he could achieve his ambition. Dying on the shores of the Tiber, the place where a she-wolf supposedly discovered Romulus and Remus, a Lasombra pulled Sejanus's body from the currents. Finding that the final embers of life still flickered within his breast, the elder Embraced him. She left him with these words: 'You will rule again, as you were always meant to do. Destroy the lords who sought to combat you. You have the potential to become greater than your master. Use it wisely'. Since then, the once would be Emperor now seeks to become Emperor of the Night, and his first moves in this grand game are coming soon...\n\n#bold One night, you will wield the power to threaten the mightiest of your kind. Make sure that your true destiny isn't cut short this time.#!"
 bookmark_warofprinces_gratiano:0 "Gratiano de Veronese"
 bookmark_warofprinces_gratiano_desc:0 "The last, and still very young, childe of Lasombra himself, Gratiano de Veronese was an unremarkable Italian noble in life, leading to many wondering why the Antediluvian favored him so. Gratiano knows the answer though : his own inherent greatness. Convincing himself of his importance, the Veronese is now chafing openly against his 'older brother' Montano, the current regent of clan Lasombra. From his court in Verona, Gratiano is well aware that he is despised and laughed at by all but the youngest of his own clan. But even such a small and weak powerbase can grow in time and one night, Gratiano might be the one laughing at them all...\n\n#bold You must earn respect and power quickly if you are to challenge your 'brother' for his title. Then, it might be time for a talk with your 'father' himself...#!"
 bookmark_warofprinces_alfonzo:0 "Alfonzo of Venice"
 bookmark_warofprinces_alfonzo_desc:0 "One of the most gifted childe of the influential Narses, Alfonzo of Venice has been the most prominent Latin Cainite in Constantinople for more than two centuries. Known to have instigated the Latin Riots of 1185, Alfonzo has also used the 4th Crusade to proclaim himself Prince of the ruined City of the World's Desire, earning him great power... and the eternal enmity of the many exiled Greeks Cainites. Nominally a follower of the Cainite Heresy like his sire was, Alfonzo is first and foremost a callous pragmatist, and has already sworn allegiance to the Sea of Shadows to secure his power, despite their opposing views on his faith. Many more deals with the devil might be needed in the future though...\n\n#bold You worked tirelessly to secure the greatest prize. No one will take Constantinople from you.#!"
 bookmark_warofprinces_suleiman:0 "Suleiman ibn Abdullah"
 bookmark_warofprinces_suleiman_desc:0 "Suleiman first approached Muhammad in Medina in order to make him a pawn to use against the powerful Cainites of Mecca. He himself retold that in this moment, he saw the possibility of salvation within him and submitted to the new religion the Prophet spread. Later, he stood by his side during his conquests and was one of the main founders of the Ashirra sect, welcoming any Muslim embraced and willing to continue following the word. His work has been mostly successful so far, with the Ashirra spreading from Iberia to Persia but cracks are beginning to form in their apparent unity. Suleiman must act quickly before this early disunity weakens his life work to a dangerous level.\n\n#bold Keep the Ashirra strong and united, and perhaps clan Lasombra itself might learn the truth one night.#!"
        
        
       
            
       
      

