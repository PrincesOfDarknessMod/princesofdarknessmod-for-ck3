 bm_1375_patronwar:0 "The Patron War"
 bm_1375_patronwar_desc:0 "After the Black Death, chaos gripped Kindred society. With the drying up of the blood supply, many vampires went into torpor, others were destroyed. As humanity claws its way back from devastation, kindred who endured the black death forge new empires and kingdoms in the aftermath."
 bookmark_patronwar_cecil:0 "Cecil"
 bookmark_patronwar_cecil_desc:0 ""
 bookmark_patronwar_lvcivs:0 "Lvcivs"
 bookmark_patronwar_lvcivs_desc:0 "" 
