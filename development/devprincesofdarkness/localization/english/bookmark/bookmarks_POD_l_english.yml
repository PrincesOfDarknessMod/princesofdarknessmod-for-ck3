 bm_1230_warofprinces_sub_ventrue:0 "Clan Ventrue" 
 bm_1230_warofprinces_sub_ventrue_desc:0 "The self proclaimed rulers of the Cainite world, the Ventrue are the regal lords and ladies of the night. They have long been one of the proudest lines of vampires, working hard to maintain a reputation for honor, genteel behavior, and leadership. A sense of noblesse oblige has long pervaded the clan, accompanied by the genuine belief that the Ventrue know what is best for everyone.\nA recent string of setbacks have plagued the Blue Bloods with the fall of Rome and the loss of France as one of their strongholds. Still, clan Ventrue rules the medieval night. At it should be.\n\n#bold Clan Ventrue dominance is not negotiable. Make them learn.#!" 
 bookmark_warofprinces_alexander:0 "Alexander"
 bookmark_warofprinces_alexander_desc:0 "After more than a millennia as the absolute ruler of France, Alexander lost everything to a conspiracy led by his own childe, Geoffrey du Temple. Now in exile as a shunned guest of the Black Cross, the powerful Methuselah is plotting his return. He has almost nothing to his name, except his impressive personal power and legitimacy... which counts for little in the grand scheme of things. It is almost a new start for the once all powerful great childe of Ventrue.\n\n#bold Will you be able to make Geoffrey and Salianna pay for their betrayal and take back your rightful throne... or create a new legacy in these eastern lands?#!"
 bookmark_warofprinces_camilla:0 "Camilla"
 bookmark_warofprinces_camilla_desc:0 "Titus Venturus Camille held Rome for most of its glorious history, being, arguably, the most politically important Cainite of Antiquity. Camilla is a divisive figure in Ventrue history, famous for his political acumen and glorious leadership of their most powerful empire, but also shunned for having founded the Road of Sin, a code of morality far too... decadent for most Ventrue tastes.\nDespite these critics, Camilla famously rallied his clan to wage war and destroy Carthage and is still lauded for this achievement to this night. His fall into torpor ended Rome's glory days and heralded the Long Night where the power of Clan Ventrue waned considerably.\n\n#bold Having recently awoken to a strange new world, will you rise to once again rule the entire Cainite world for the glory of a vibrant, decadent Rome?#!"
 bookmark_warofprinces_hardestadt:0 "Hardestadt"
 bookmark_warofprinces_hardestadt_desc:0 "Hardestadt is the first among a new generation of Ventrue leaders better accustomed to the medieval world than their Roman elders. Coming from a shrouded lineage with few assets, the Bavarian warlord expertly used the ascension of the mortal Holy Roman Empire to shift the center of gravity of the Ventrue from Rome to Germany, cementing his influence over his brethren in the process.\nHardestadt has known very few setbacks since his ascension to power but there are still matters to be resolved, like the stubborn Romans under Julia Antasia...\n\n#bold You have a powerful realm and influential childer and allies at your disposal. Get rid of the bygones of Rome and you will define what being a Ventrue means for centuries to come.#!"
 bookmark_warofprinces_antasia:0 "Julia Antasia"
 bookmark_warofprinces_antasia_desc:0 "The daughter of the Roman Republic is a Ventrue of another age, one where her clan was the guardian of the Eternal Senate, an utopia in the ruthless world of the Cainites. It was Julia's perfect world, every Ventrue had the right of speech and voting power was irrespective of age or sex. The laws of the senate were to become the traditions of the clan for the next millennia... Then, Camilla and his decadent madness came, followed by Hardestadt and his ruthless ambition.\nFrom her princedom in Frankfurt, Julia hasn't lost hope of bringing back her clan to its roots. Idealism might still be a path for clan Ventrue's future.\n\n#bold You can't let Hardestadt, or worse Camilla, dictate the future of clan Ventrue. You must fight for the Senate and the Republic!#!"
 bookmark_warofprinces_jurgen:0 "Jurgen von Verden"
 bookmark_warofprinces_jurgen_desc:0 "The vaunted German knight is the right hand of Hardestadt and, despite his young age, has already made his name known far and wide. A strict, but fair, ruler of Magdeburg, Jurgen is the perfect Ventrue knight, brave and ruthlessly ambitious at the same time.\nJurgen recently waged war against the Tzimisce Voivodate and forced the creation of a buffer state. But this isn't enough and he is already planning his next offensive... as soon as he can get rid of Alexander, the cumbersome exiled prince of France.\n\n#bold Your honor is your word, and that is the only limit you will suffer to your ambition. By fire and sword, by conquests and diplomacy, clan Ventrue will one day bow before you.#!"
 bookmark_warofprinces_anna:0 "Anna Comnena"
 bookmark_warofprinces_anna_desc:0 "A Byzantine princess, Anna Comnena was denied her birthright during her life... and a second time during her unlife. As she worked her way up the power structure of undead Constantinople, the 4th Crusade happened, breaking any semblance of sanity in the City of World's Desire. But Anna is a patient and careful plotter and she managed to secure the most powerful Byzantine successor kingdom, Nikaea, as her domain. She cares nothing for Constantinople's past dreams and utopia, which has estranged her to many other Greek survivors but she won't let that stop her from her prize. Not again.\n\n#bold Constantinople is finally within sight. Let no one stand in front of your destiny and it will finally be yours.#!"
 bookmark_warofprinces_anadja:0 "Anadja"
 bookmark_warofprinces_anadja_desc:0 "The daughter of a Persian merchant, Anadja was destined to an unremarkable life until the vaunted Belisarius and Shabah took a liking in her, raising her as their own childe. With such impressive mentors, Anadja was quick to adapt to the Cainite world and was soon noticed by a secretive cult seeing her as their promised savior.\nSince then, Anadja has become the most influential vampire in Armenia and is still receiving the mentoring of both her 'parents' and the cult. She is now old enough to rule on her own and only time will tell if she will live up to the lofty expectations placed on her.\n\n#bold You have been expertly prepared for this moment. It is time to write your own story and the ending is only yours to tell.#!"
    
