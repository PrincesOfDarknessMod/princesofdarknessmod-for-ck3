 # Qiao #

 CELESTIAL_PUNISHMENT_PERK_EFFECT:0 "#Bold Unlock make prayer character interaction.#!\nThese prayers work as a warning to the shen. When they strike their target, they ignite, causing no physical damage but burning the P'o of the target. These paper prayers are as effective as thrown knives and resist even the strongest natural winds while on route to their target."
 DIVINE_BINDINGS_PERK_EFFECT:0 "#Bold Enhance make prayer character interaction.#!\nWhen cast toward a shen target, these innocuous sheets of paper move against the wind and even circumvent obstacles to strike. Once the prayers hit the target, they glow with an eerie green energy and expand, becoming thicker and longer as they wrap themselves around the shen."
 HEAVENLY_FLAMES_PERK_EFFECT:0 "#Bold Enhance make prayer character interaction.#!\nWhen this prayer strikes a target shen, it immediately bursts into bright-blue flames that cause aggravated damage. As with Divine Bindings, the prayer moves around obstacles to reach their target."
 CELESTIAL_FIRES_PERK_EFFECT:0 "#Bold Enhance make prayer character interaction.#!\nCelestial Fires is identical to Heavenly Flames, with one exception: The damage may not be soaked without special defenses."
 HEAVENS_THUNDER_PERK_EFFECT:0 "#Bold Enhance make prayer character interaction.#!\nThis, the most powerful of the Shih's prayers, is virtually unstoppable once cast. As the prayers leave the Shih's hand, they glow fiercely and move with the speed of lightning toward their destination. When they strike the shen, they explode in balls of electrical fury capable of grievously wounding almost any demon."
 STEEL_SKIN_PERK_EFFECT:0 "You increase your Stamina by use of this power."
 DRAGONS_SPEED_PERK_EFFECT:0 "You increase your Dexterity by use of this power."
 TIGERS_STRENGTH_PERK_EFFECT:0 "You use this ability to increase your Strength in preparation for combat."
 CELESTIAL_EYES_PERK_EFFECT:0 "You increase your Perception using this level of the Mo Kung Qiao."
 BODY_OF_THE_DRAGON_PERK_EFFECT:0 "You increase all of your Attributes to superhuman levels."
 OPENED_EYES_PERK_EFFECT:0 "The Shih can see the shen for what they are. The Shih can also ignore the effects of the Delirium."
 DIVINE_PERCEPTIONS_PERK_EFFECT:0 "This power entitles the Shih to view the spirit of another being, It works like a lie detector for the most part, but the Shih can also see when a mortal or other entity is possessed by a demon."
 WIND_TALK_PERK_EFFECT:0 "#Bold Add more chance of calming a local spirit in the 'spirit interaction' decision.#!\nThe Shih employing this ability can listen to the denizens of the spirit realms and communicate with them. The shen are not, however, obligated to respond to any questions or demands the Shih might make."
 CELESTIAL_WINDOW_PERK_EFFECT:0 "#Bold Add more chance of calming a local spirit in the 'spirit interaction' decision.#!\nThe Shih employing this ability interacts on all levels with one denizen of the Yin or Yang Realm. For all intents and purposes, the chosen spirit is on the same level of existence as the Shih. That spirit can be touched, hurt, helped or engaged in combat as if both the Shih and the spirit were in the same place."
 CELESTIAL_DOORWAY_PERK_EFFECT:0 "#Bold Add more chance of calming a local spirit in the 'spirit interaction' decision.#!\nThe Shih can actively interact with the spirit worlds; however, this course of action is not necessarily the wisest to take. While the character actually remains in the Middle Kingdom, he can see and affect the Yin and Yang Worlds around him. Although, the denizens of those realms can return the favor, and many of them aren't fond of the Shih."
 BARRIER_OF_PAIN_PERK_EFFECT:0 "#Bold Unlock chi heal character interaction to heal scars.#!\nThe Shih can force herself to shut out pain at this level."
 THE_CLOSING_WOUND_PERK_EFFECT:0 "#Bold Enhance chi heal character interaction to heal wounds.#!\nAt this level, the Shih is able to heal wounds. Bruised flesh loses its tenderness; wounds knit themselves back together and leave fresh scars."
 SPIRITUAL_HEALING_PERK_EFFECT:0 "#Bold Enhance chi heal character interaction to heal lost body parts.#!\nThe Shih can re knit bones and rebuild nerve tissue with this ability. This process is painful and often risky if used in a combat situation. The bones must be reset properly or the Shih risks crippling herself permanently."
 ESCAPE_FROM_DEATH_PERK_EFFECT:0 "#Bold Allow you to spend willpower instead of taking wounds. Enhance chi heal character interaction to heal illness or lesser physical disavantages.#!\nThe Shih using this ability can regenerate even burs and other energy damage. While very useful, Escape from Death is also very costly."
 FLAMES_OF_THE_PHOENIX_PERK_EFFECT:0 "#Bold Allow you to not be killed by wounds. Enhance chi heal character interaction to heal several new diseases or physical disavantages.#!\nThe character using this ability completely regenerates herself on a cellular level. This power can't bring a character back from the dead, but it reverses the effects of radiation poisoning, cancer, severe trauma and even old age."
 THOUSAND_FISTS_PERK_EFFECT:0 "The Shih focuses his Yang Chi and cuts loose with multiple punches. The strikes are superhuman-fast, often blurring in the air."
 SPEAR_HAND_PERK_EFFECT:0 "The Shih focuses his Yang Chi and ignites the energy around one hand. This energy ripples the air and burns intensely."
 BURNING_GHOSTS_PERK_EFFECT:0 "The Shih knight focuses his Chi, slowing him to combat wraiths and sirits of all types. His skin glows with a golden light, and Chi energies wrap around him. The Shih's body doesn't actually strike the spirits but the aura of power surrounding him does."
 STEEL_BODY_PERK_EFFECT:0 "The Shih focuses his Yin Chi, toughening his body and increasing his ability to inflict damage. Every muscle in the Shih's body tautens, and his skin becomes far more resilient,"
 THOUSAND_SWORDS_PERK_EFFECT:0 "The Shih concentrates his Chi, then lashes out against his enemies in a furry of actions. Each strike opens wounds in his enemy, and the sound of the impacts is like that of metal striking metal."
 FROZEN_RIVER_PERK_EFFECT:0 "The Shih uses her Yang Chi to build a protective barrier around her own life force, thus preventing the theft of her Chi."
 STOLEN_SERPENT_PERK_EFFECT:0 "The Shih can capture any ranged supernatural attack directed against him and then send it hurtling back at the opponent who cast it. This is a dangerous business, as the Shih must demonstrate perfect timing in order to seize the mystical energies thrown at him."
 CELESTIAL_BARRIER_PERK_EFFECT:0 "#Bold Unlock the character interaction of the same name.#!\nWith this power, the Shih temporarily blocks the shen's ability to take Chi from other sources."
 CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT:0 "#Bold Unlock 'steal chi' character interaction.#!\nThe Shih using this ability is able to steal Chi from a shen. While stolen Chi is no longer available to the shen, neither can the Shih use the stolen Chi."
 BITE_OF_THE_MU_PERK_EFFECT:0 "#Bold Enhance 'steal chi' character interaction.#!\nThe Shih using this ability not only steals the Chi from a target shen, but also uses that Chi in an attack against the shen. This procedure is a very risky one, for it awakens the Shih's P'o."
 EYES_OF_THE_DRAGON_PERK_EFFECT:0 "The Shih stares down an opponent. Intimidation is the key to avoiding combat successfully. ."
 DARK_REFLECTION_PERK_EFFECT:0 "This power forces the enemies of the Shih to realize the consequences of their actions. Shih use this power when pronouncing judgment on a shen."
 HUNTED_EYES_PERK_EFFECT:0 "This power works on Hungry Dead and Restless Dead alike. Staring into the eyes of an opponent, the Shih forces the target to re experience any time spent in the Yomi World."
 VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT:0 "#Bold Add more chance of calming a local spirit in the 'spirit interaction' decision.#!\nA Shih employing this power can command one spirit to accomplish one simple task."
 DIVINE_ORDINANCE_PERK_EFFECT:0 "The Shih inspires overwhelming fear in all opponents within visual range."
 BALANCE_OF_THE_SPIRIT_PERK_EFFECT:0 "#Bold Unlock exorcism character interaction to restore imbalance.#!\nThe Shih can discern the spiritual imbalances of Yin and Yang and attermpt to restore proper order with this power."
 FOCUS_OF_THE_MIND_PERK_EFFECT:0 "#Bold Enhance exorcism character interaction to reduce stress.#!\nShih use a great deal of their Willpower fighting against shen. This power lets them regain their resolve and once again perform their sacred duties."
 NIGHTMARE_EXORCISM_PERK_EFFECT:0 "#Bold Enhance exorcism character interaction to remove negative stress traits.#!\nMany Shih turn to drugs and alcohol in an effort to alleviate their mental anguish. Shih using this power take a more direct approach by erasing the memory's emotional impact and, hopefully, removing the mental scars that memory creates."
 SELF_EXORCISM_PERK_EFFECT:0 "#Bold Enhance exorcism character interaction to remove negative mental traits.#!\nShih, like all mortals, are subject to the risks of demonic possession. With this power, the demon hunter engages in psychic battle with a demon that has successfully managed to gain entry to her body, acquiring a second chance to expel the demon."
 MENTAL_DOMINION_PERK_EFFECT:0 "#Bold Enhance exorcism character interaction to reduce all stress.#!\nA Shih using this power can fully restore her Willpower and actually weaken her P'o."
 CLOUD_WALKING_PERK_EFFECT:0 "This power lets the Shih move silently and without leaving a trail, even while running. The Shih leaves behind no scent to indicate that he has ever been in the area."
 WATER_TREADING_PERK_EFFECT:0 "With this power, the Shih is able to travel over unstable surfaces, such as water or quicksand, and to use virtually any surface, even leaves on a tree, for the purpose of climbing."
 WIND_STRIKE_PERK_EFFECT:0 "The Shih uses an opponent's own momentum to throw an enemy incredible distances."
 MOUNTAIN_STANCE_PERK_EFFECT:0 "The Shih absorbs the impact of an attack, redirecting the force into the ground."
 CELESTIAL_WIND_PERK_EFFECT:0 "The Shih using this power focuses his Chi to stop a target from advancing and possibly even sends an opponent crashing backward."
 HEAVENS_JUDGMENT_PERK_EFFECT:0 "The prayers prepared by this Qiao literally burn Chi out of the body of the shen,returning that stolen lifeforce to the environment to enliven it."
 DIVINE_PROHIBITION_PERK_EFFECT:0 "This most powerful of I Shen techniques cuts a target off from outside sources of Chi."
 TEN_OX_STRENGTH_PERK_EFFECT:0 "The Shih is capable of momentary feats of super-human strength."
 DIAMOND_BODY_PERK_EFFECT:0 "A Shih using this gift manifests tremendous capacity to shrug off damage."
 SIGHT_WITHOUT_EYES_PERK_EFFECT:0 "Using this technique, a Shih can see and detect without the use of physical senses, perceiving with spirit alone."
 THE_EYE_OF_HEAVEN_PERK_EFFECT:0 "A Shih with this level of mastery can see with the Eye of Heaven, perceiving any place."
 THE_LIZARDS_TAIL_PERK_EFFECT:0 "The Shih can actually regenerate missing limbs or organs; basically any damage that does not result in death."
 ASHES_OF_THE_PHOENIX_PERK_EFFECT:0 "Shih with true mastery of the Bridge of the Phoenix can return from death."
 HUNDRED_WARRIORS_STRIKE_PERK_EFFECT:0 "Filled with furious Chi, the Shih becomes a whirlwind of devastation."
 HEAVEN_THUNDER_STRIKE_PERK_EFFECT:0 "The Shih canconcentrate Chi into a blow that can sunder steel or shake the ground with the force of an earthouake."
 RIGHTEOUS_HUNGRY_SPIRIT_PERK_EFFECT:0 "The Shih's soul is so empowered that any attempt to drain or steal his Chi not only fails automatically, but the hunter may steal Chi away from the attacker."
 DEMON_EATING_TECHNIQUET_PERK_EFFECT:0 "The Shih's close-combat attacks (armed an unarmed) against shen not only inflict harm but dissipate the target's Chi."
 MANTLE_OF_HEAVEN_PERK_EFFECT:0 "Cloaked in the divine protection of Heaven, a demon hunter becomes a terriblefoe in the eyes of shen."
 DIVINE_MANDATE_PERK_EFFECT:0 "Speaking with the voice of Heaven, the Shih can command any shen and expect obedience."
 MOUNTAIN_MEDITATION_PERK_EFFECT:0 "Shih using this master discipline achieve a degree of tranquility that makes them as unshakable as the roots of a mountain."
 WALKING_IN_BALANCE_PERK_EFFECT:0 "The Shih is so perfectly balanced between Yin and Yang that she overcomes any outside attempt to disrupther internal Chi balance."
 ARROW_CUTTING_PERK_EFFECT:0 "The Shih's reflexes are superhumanly fast, capable of deflecting any ranged attack, even a hail of bullets."
 WIND_RACING_PRANA_PERK_EFFECT:0 "Using this power, a Shih can apply a momentary burst of superhuman speed."
 
