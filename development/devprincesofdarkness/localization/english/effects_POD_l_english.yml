 BODY_MENDING_TECHNIQUE_PERK_EFFECT:0 "Unlock Chi Heal [character_interaction|E].\n#F Body-Mending Technique allows an immortal to heal damage caused by injury or sickness via ritualistic means.#!"
 LINGERING_AID_OF_THE_CAREGIVER_PERK_EFFECT:0 "Bonus to Chi Heal [character_interaction|E].\n#F An immortal with this ritual can transfer enough energy to keep his patient healing at an accelerated rate even if he leaves her side.#!"
 SEE_THE_LANDS_OF_THE_SPIRIT_PERK_EFFECT:0 "Gain access to the Yang World.\n#F With this spell, the Wu T'ian can enter the Umbra.#!"
 SENSE_LUCKS_FLOW_PERK_EFFECT:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F A Wu T'ian with this spell can sense the fluctuations of joss, discerning the good or bad luck surrounding people, places, and events.#!"
 SNAKE_FIST_STRIKE_PERK_EFFECT:0 "#F To counter the regenerative abilities of demons and other supernaturals, a Wu T'ian can use this spell to mystically quicken their strikes and transform their bodies into deadly weapons#!"
 SWEET_DREAMSS_CARESS_PERK_EFFECT:0 "Bonus to Chi Heal [character_interaction|E].\n#F Counteracting exhaustion with the uplifting vitality of pure Yang energy, Sweet Dream's Caress allows an immortal to banish his own or another's fatigue by lightly pressing his fingers on major acupuncture points.#!"
 CALL_THE_SPIRITS_PERK_EFFECT:0 "Unlock $seek_aid_of_the_spirits_decision$ [decision|E].\n#F This spell allows an immortal to summon elemental and nature spirits.#!"
 DRUNKEN_MONKEY_DANCE_PERK_EFFECT:0 "#F Swaying and bobbing as though completely inebriated, a Wu T'ian under the effects of this spell somehow avoids fists, bullets, and other violence leveled against him with an ease that baffles and frustrates his opponents.#!"
 LEAPING_TIGER_POUNCE_PERK_EFFECT:0 "#F Charging his muscles with energy, a Wu T'ian with this spell can leap amazing distances.#!"
 SPIRIT_LANTERN_PERK_EFFECT:0 "#F With a gesture, a Wu T'ian with Spirit Lantern can form a ball of ghost-flame in the palm of his hand, illuminating his surroundings with soft golden light that frightens demons and other unclean beings.#!"
 STORMWIND_PRANA_PERK_EFFECT:0 "#F Drawing on the principle of motion that embodies the essence of Yang, the Wu T'ian employ this family of spells to dramatically increase their speed.#!"
 BIND_THE_DEMONS_SERVANT_PERK_EFFECT:0 "Unlock $POD_send_to_shadowland_character_interaction$ [character_interaction|E].\n#F This spell allows an immortal to banish or bind lesser spirits and demons of the Yang Realms.#!"
 ELEGANT_CRANE_DEFTNESS_PERK_EFFECT:0 "#F Buoyed by their yang Chi, Wu T'ian with this art become preternaturally light and agile, capable of balancing effortlessly on the narrowest ledges, running across unstable surfaces like water and quicksand or using the leaves of a tree to support their weight for climbing.#!"
 OPENING_THE_THIED_EYE_PERK_EFFECT:0 "#F With this spell, a Wu T'ian can pierce the Veil and awaken mortals to the hidden world of the shen.#!"
 THE_CLEARING_OF_THE_WAY_PERK_EFFECT:0 "Unlock Manipulate the Wall option in umbra panel.\n#F With this spell, the Wu Feng can manipulate the Wall rating in his immediate surroundings.#!"
 FLAME_HAND_STRIKE_PERK_EFFECT:0 "#F His hands wreathed in an aura of burning Chi, an immortal with this spell bathes his enemies in fire with every touch.#!"
 MANTLE_OF_DIVINE_AUTHORITY_PERK_EFFECT:0 "#F Calling on the mandate of the August Personage of Jade and the faithful stewardship of the Eight Immortals, a Wu T'ian who dares to speak the celestial words of power at the core of this spell invokes the authority and righteous power of the Jade Throne.#!"
 PLAGUE_CURING_METHOD_PERK_EFFECT:0 "Bonus to Chi Heal [character_interaction|E].\n#F With this spell, the Wu T'ian can transfer Yang energy into a patient's body after tending him for at least 15 minutes.#!"
 TEN_PACES_STRIKE_PERK_EFFECT:0 "#F Bypassing the usual need for physical contact, a Wu T'ian with this spell can invisibly project the force of a single martial arts attack across an intervening distance by the power of his focused Chi.#!"
 WALK_THE_BARRIERS_PERK_EFFECT:0 "#F Walk the Barriers allows an immortal to transfer his physical form into the Yang Realm.#!"
 RESTORATION_OF_YOUTHS_VIGOR_PERK_EFFECT:0 "Bonus to Chi Heal [character_interaction|E].\n#F Masters of Feng Tan can perform the miracle of the rebirth of the phoenix to undo the ravages of time and renew the vitality of a mortal's youth.#!"
 GENTLE_TYPHOONS_PASSING_PERK_EFFECT:0 "#F Invoked during combat, Gentle Typhoon's passing transforms a Feng Tan master into an eye of perfect calm at the heart of a furious whirlwind of fists.#!"
 TRANSCENDANT_LIVING_FLAME_PERK_EFFECT:0 "Bonus to Chi Heal [character_interaction|E].\n#F With this last resort spell, the Wu T'ian can restore himself or an ally to full health, given that the situation is deemed desperate enough by Heaven.#!"
 HUNDRED_SHADOW_CLOUD_PERK_EFFECT:0 "Give [GetModifier('shadow_cloud_modifier').GetNameWithTooltip] to enemy knight in combat as commander.\n#F With this spell, a Wu T'ian can cause a thick cloud of spectral darkness to billow from his shadow like black fog.#!"
 IRON_BODY_MEDITATION_PERK_EFFECT:0 "#F Iron Body Meditation allows a Wu T'ian to channel yin energy through his flesh, fortifying his body against injury by meditating for an hour.#!"
 LESSER_SPIRIT_PROJECTION_PERK_EFFECT:0 "Gain access to Yin World.\n#F With this spell, the Wu T'ian can enter the Underworld.#!"
 STILL_THE_FLUTTERING_WING_PERK_EFFECT:0 "Chance to cause wounds to enemy knights in combat.\n#F Targets affected by Still the Fluttering Wing suffer brief paralysis.#!"
 LUNGTAN_UNSEEN_PASSAGE_PERK_EFFECT:0 "#F By initiating this spell, the Xian Lung can affect his Arcane rating to remain anonymous and a near faceless person.#!"
 THE_WAY_OF_THE_CALM_SOUL_PERK_EFFECT:0 "#F The Way of the Calm Soul allows a Wu T'ian to ease states of panic or anxiety (such as Frenzy) in one individual.#!"
 EBON_BONDS_PERK_EFFECT:0 "#F With a word and a gesture, an immortal can conjure mystical black ribbons out of a target's own shadow to ensnare him in bonds as soft as silk and strong as steel.#!"
 ICE_HAND_STRIKE_PERK_EFFECT:0 "#F Enveloping his hands in a blue nimbus of freezing yin, a Wu T'ian under the effects of this spell leaves behind numbing cold with every strike.#!"
 KNOW_THE_WANDERING_SOUL_PERK_EFFECT:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F With this Ritual, the Xian Lung can gain insight into even the strangest mortals, animals, and spirits.#!"
 NO_MIND_KATA_PERK_EFFECT:0 "#F By clearing his mind and allowing the serenity of the Tao to wash over him, a Wu T'ian with this spell can exert his will to perform truly superhuman feats in a previously chosen area.#!"
 BRAMBLES_ON_THE_ROAD_PERK_EFFECT:0 "Unlock Manipulate the Wall option in umbra panel.\n#F By using this Ritual, the Xian Lung can raise the Shroud rating in his vicinity.#!"
 GHOST_WALKING_METHOD_PERK_EFFECT:0 "#F When invoking this spell, the Xian Lung becomes undetectable for several chosen sense.#!"
 PROJECTION_OF_INWARD_BEING_PERK_EFFECT:0 "#F With this spell, a Wu T'ian can unmask a concealed supernatural being by infusing a target's shadow with Chi so that it assumes the form of its owner's true self (Crinos form for Hengeyokai, Mien for Hsien etc.).#!"
 SHIELD_OF_FORTUNE_PERK_EFFECT:0 "#F The Xian Lung can wrap himself in joss, engendering bad luck in those who want him harm.#!"
 BLUR_THE_MIND_PERK_EFFECT:0 "#F By invoking this spell, the Xian Lung can make his victim forget events that happened in its recent vicinity.#!"
 PROTECT_AGAINST_THE_DEMON_PERK_EFFECT:0 "#F With this ritual, the Xian Lung can create wards that block demons and other servants of the Yama Kings from entering an area.#!"
 SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT:0 "#F With this ritual, the Xian Lung prepare for the Sixth Age.#!"
 WHISPERING_STONES_PERK_EFFECT:0 "#F With this Ritual, the Xian Lung can record memories of the dead from the Tempest to translate documents in unknown-or extinct- languages.#!"
 DEATH_TOUCH_PERK_EFFECT:0 "#F Reserved only for the most terrible demons, the legendary dim mak enables masters of Lung Tan to catastrophically disrupt the Chi flow of a single target, crippling or killing with but a touch.#!"
 EYE_OF_THE_TEMPEST_PERK_EFFECT:0 "#F By meditating letting go of all fear and doubt, the Xian Lung's inner calm can even quell storms, or creating a protected 'bubble' if the storm proves to fierce.#!"
 TREAD_THE_DRAGON_TRACKS_PERK_EFFECT:0 "As a [character_interaction|E], allows you to teleport commanding army.\n#F With this Ritual, the Xian Lung can attune his inner Chi to the flow of a nearby Dragon Line and travel to Dragon Nest in a manner of seconds after spending an hour meditating within a Dragon Nest or along a Dragon Line.#!"
 GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_godbody_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F Recalling the majesty of the Wan Xian before their fall from grace, Godbody of the Celestial Emperor surrounds its caster in a nimbus of silvery light that illuminates the way before the Wu T'ian, induces a mind-state into mortals similar to the Fog and forces tainted supernaturals to flee.#!"                                                                                                                                     

