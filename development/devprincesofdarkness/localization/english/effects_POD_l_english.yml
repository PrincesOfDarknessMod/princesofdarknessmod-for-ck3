 AUTHORITY_PERK_EFFECT:0 "Allow you to assume an aura of natural authority that affects everyone near to you."
 THOUSAND_HELL_STARE_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves. Unlock project negative psychic energy [character_interaction|E]. Bonus chance to maul an enemy knight in combat.#!\nAllow you to channel all your guilt, frustration, anger, and hunger into your Hun soul and then project this negative psychic energy like a knife into victim's soul."
 SOUL_SHACKLES_PERK_EFFECT:0 "#Bold Unlock $POD_bind_interaction$ [character_interaction|E]. Unlock the [character_interaction|E] of the same name.#!\nAllow you to create permanent bonds between your Hun and the Hun of another person."
 TAMING_THE_FIRE_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nYou can command and redirect a cathayan in Fire- or Wave Soul."
 CORRUPT_THE_WILL_PERK_EFFECT:0 "You can reduce the temporary Willpower of your opposite."
 VOICE_OF_THE_EMPEROR_PERK_EFFECT:0 "#Bold Can recruit [GetMaA('crowds').GetName] as [men_at_arms|E].#!\nWith this power, you can sway the opinions and actions of a crowd of mortals — as many as can hear you. Those who listen to you believe what you say, and will be strongly inclined to do as you command."
 DIVINE_FETTERS_PERK_EFFECT:0 "#Bold Unlock $POD_command_wraith_interaction$ [character_interaction|E].#!\nYou can broaden your command of Authority to include other Shen."
 
 # Black Wind #

 BLACK_WIND_PERK_EFFECT:0 "Allowing the rage of the P'o to channel itself through your body, you become inhumanly swift — a typhoon of destruction."
 A_THOUSAND_CUTS_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves. Bonus chance to maim an enemy knight in combat.#!\nThis power allows you to focus your P'o so that you become a veritable whirlwind in combat. Your arms a blur; your feet are as fast as lightning; you can strike a target (or targets) so many times that there is almost no way for it to avoid the blows."
 TREADING_THE_TIDE_DRAGONS_BACK_PERK_EFFECT:0 "Allow you to move with such speed that you can run across the surface of the water without falling in."
 DIVINE_WHIRLWIND_PERK_EFFECT:0 "#Bold Bonus chance to kill an enemy knight in combat.#!\nYour very thoughts instantly become actions, allowing you to hit your target multiple times before they can even respond."
 TRANSCENDING_PO_PERK_EFFECT:0 "You have learned how not to let darker aspects of your nature get the best of you. By soothing yourself with the calming energies of Yin Chi, you can keep a hold on your bestial side."
 
