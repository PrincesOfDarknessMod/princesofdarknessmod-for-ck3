 DRAGON_WARD_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves#!\nAllow you to create a barrier of chi that turns away any attackers."
 PURIFICATION_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThis power, a legacy of more noble days, was used by the Wan Xian of old to cleanse their mortal subjects and domains of demonic taint."
 SPIRIT_EATING_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name. Bonus to cause brutal mual to enemy knight in combat.#!\nAllow you to sever the ties that hold a soul to its body to either purify it or devour it."
 SHIELD_OF_THE_SOUL_PERK_EFFECT:0 "Protects your own soul against attacks from other supernaturals."
 BANKING_THE_FIRE_CALMING_THE_WAVES_PERK_EFFECT:0 "With but a touch, you can bring one of your brethren out from under the tumultuous control of their souls, restoring their balance."
 SOUL_TAINT_PERK_EFFECT:0 "You can make your victim displeasing to anyone in your presence after briefly touching it."
