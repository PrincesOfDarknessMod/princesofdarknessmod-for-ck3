 SOOTHING_THE_SOUL_PERK_EFFECT:0 "#Bold Bonus chance to maim an enemy knight in combat.#!\nBy caressing out inconsistencies and eddies in the Chi flow of a subject, you can make your target lethargic in inner peace, similar to the effects of the Kiss."
 ACCENTUATE_CHI_PERK_EFFECT:0 "You can cause the target to experience extreme swings in mood and energy. Yin-energies cause the victim to become languid, dull-minded, and slow, while Yang energies make the subject restless and agitated."
 OPENING_THE_GATES_PERK_EFFECT:0 "#Bold Bonus chance to kill an enemy knight in combat.#!\nYou can cause Chi to burn your target from the inside out"
