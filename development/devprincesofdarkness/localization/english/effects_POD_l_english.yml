 SHROUDED_MOON_PERK_EFFECT:0 "#Bold Unlock a shapeshift option.#!\nAllow you tp turn invisible by cladding yourself in shadows."
 YIN_MANTLE_PERK_EFFECT:0 "Allow you to channel your internal Yin energy into an animus that shrouds you. This animus, or mantle, is invisible to mortals, but it feels to them like a cold breeze in the air."
 BONE_DANCE_PERK_EFFECT:0 "#Bold Unlock duel moves.#!\nBy performing a series of complicated and painful postures, you can channel Yin energy in an area, turning everyone within lethargic."
 EIGHTFOLD_YIN_MANTLE_PERK_EFFECT:0 "Like the initial Yin Mantle, only that the Yin energy manifests as a crackling black aura of Yin energy that can be shaped according to the user's wishes."
 SEMBLANCE_OF_THE_EBON_DRAGON_PERK_EFFECT:0 "#Bold Unlock a shapeshift option. No more cost to enter and stay in the Yin World.#!\nAllow you to become insubstantial as your body mass shifts into the Yin World."
 YIN_SHIELD_PERK_EFFECT:0 "You form your Yin animus into a protective carapace around your body."
 YIN_NIHILUS_PERK_EFFECT:0 "Allow you to create a deadly halo of Yin energy that sears everyone near to the user."
 TOUCH_OF_RUST_PERK_EFFECT:0 "You can cause metal of any kind to quickly crumble down."
 IRON_CORPSE_PERK_EFFECT:0 "#Bold Unlock a shapeshift option.#!\nAllow you to transform your very flesh into metal. In this form, your combat abilities rise as your fingers turn into razor claws, but on the downside, you becomes unable to swim."
 
 # Yang Prana #

 PRINCIPLE_OF_MOTION_PERK_EFFECT:0 "Amplifies movements with Yang Chi."
