# Serpentis
 
 ENCHANTING_GAZE_PERK_EFFECT:0 "This power makes the vampire the proverbial flame to a moth. She takes on an alluring, enchanting feature, such as a serpent’s gold eyes or a pearlescent sheen to her skin. She can paralyze with a glance, and mortals in her vicinity find themselves drawn to her."
 SERPENTS_FLESH_PERK_EFFECT:0 "Unlocks [serpents_flesh|E] power."
 TYPHONIC_MAW_PERK_EFFECT:0 "The vampire’s jaw becomes a ferocious, malleable thing she can control in a variety of ways. Her jaw distends to her chest, her fangs grow to the size of small daggers, her tongue forks at the tip and lashes out a meter long, and her throat expands to consume anything she can get her mouth around."
 MASTER_OF_SNAKES_PERK_EFFECT:0 "Allows you to summon snakes in Spawn Army personal character interaction."
 SMOOTH_SCALES_PERK_EFFECT:0 "Buffs [serpents_flesh|E] power."
 FORM_OF_THE_SNAKE_PERK_EFFECT:0 "Allows you to transform into a large serpent and small snake under shapeshift personal character interaction."
 TYPHONIC_AVATAR_PERK_EFFECT:0 "Unlocks [typhonic_avatar|E] power."
 SERPENT_EYES_PERK_EFFECT:0 "Unlocks [serpent_eyes|E] power."
 MOTHER_OF_MONSTERS_PERK_EFFECT:0 "Allows you to summon typhonic beasts in Spawn Army personal character interaction."
 FORM_OF_THE_STORM_PERK_EFFECT:0 "Buffs [typhonic_avatar|E] power."
 ECHIDNAS_VENOM_PERK_EFFECT:0 "At this level, the vampire’s bite becomes venomous as a death adder."
 THE_HEART_OF_DARKNESS_PERK_EFFECT:0 "Unlocks [heart_of_darkness|E] power."
 COBRA_FANGS_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. The vampire's fangs become venomous."
 APOPHIS_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Further buffs [typhonic_avatar|E] power."
 HEART_THIEF_PERK_EFFECT:0 "[elder_perk|E], only 3-6th generation vampires can buy this perk. Buffs [heart_of_darkness|E] power, allowing to steal hearts from other characters as a scheme or from prisoners as a simple character interaction. It you have someone's heart, it is easy to kill them or to force them into torpor."
 TEMPTATION_PERK_EFFECT:0 "[elder_perk|E], only  3-5th generation vampires can buy this perk. The vampire becomes extremely hard to resist."
 BREATH_OF_THE_BASILISK_PERK_EFFECT:0 "[elder_perk|E], only 3-5th generation vampires can buy this perk. The vampire can exhale poisoning and corrosive mist."
 GODHEAD_PERK_EFFECT:0 "[elder_perk|E], only 3-4th generation vampires can buy this perk. Unlocks [godhead|E] power."

