 LIGHTEN_THE_SHADOW_PERK_EFFECT:0 "The Mummy can calm the darker sides of a target, for example pulling a vampire out of Frenzy."
 LOYAL_COMPANION_PERK_EFFECT:0 "#Bold Your pets and warhorses will be resurrected when they die.#!\nAfter mummifying a specifically loyal animal, the Mummy can resurrect it as a spectral servant."
 OPEN_THE_SEBKHET_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Mummy rips the Shroud open, allowing himself and other persons to walk into Duat."
 SHADOW_TALISMAN_PERK_EFFECT:0 "#Bold Allow you to start the craft activity even in Umbra.#!\nThe Mummy can take Amulet he created with via the Amulet Hekau into the Underworld."
 SPEAR_OF_ANUBIS_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves.#!\nBy cutting open his palm, the Mummy can manifest the power of Oblivion in a dark spear who deals aggravated damage and bypasses any mundane protection."
 WALKING_IN_THE_SHADOW_OF_ANUBIS_PERK_EFFECT:0 "#Bold Spirit traveling time: #P -40%#!#!\nThe Mummy can travel instantaneous through the different worlds of the Tellurian, provided he knows of their existence."
 CASTING_AWAY_PERK_EFFECT:0 "#Bold Unlock $EXECUTION_BANISH_TO_TEMPEST$ [executions|E] option.#!\nThe Mummy can hurl his target into the raging winds of the Tempest."
 DARK_WALL_OF_HATSHEPSUT_PERK_EFFECT:0 "#Bold You will no longer be attacked by wraiths.#!\nDeveloped by the Shemsu-Heru Hatshepsut as a minor variation of the Rite of the Sun-King, this spell creates a wall of Sekhem that hinders any spirit to cross it and raises the local Shroud."
 EMPOWER_BA_PERK_EFFECT:0 "#Bold Allow returning to the Material World more quickly when resurrected.#!\nThe Mummy can strengthen his ba to return more quickly to his corpse."
 EMPOWER_KA_PERK_EFFECT:0 "#Bold You will no longer be murdered when you are in the Umbra.#!\nThe Mummy strengthens his ka to protect his body more efficiently during his death-cycle."
 HEART_OF_REINCARNATION_PERK_EFFECT:0 "#Bold Allow choosing another mother when you are resurrecting in [shadow_realm|E].#!\nBy infusing a small object with his essence, the mummy can bypass the total destruction of his body by reincarnating in the child of the next woman who touches the object."
 SEPARATE_KHAIBIT_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Mummy can sever his own khaibit, transforming it into a [GetTrait('spectre').GetName( GetPlayer )]-like creature that acts on the behest of its creator."
 SPIRIT_THE_BODY_AWAY_PERK_EFFECT:0 "#Bold You can murder an umbral spirit.#!\nThe Mummy can turn dead flesh into plasm, bringing his body across the Shroud."
 TRANSFIXING_GAZE_PERK_EFFECT:0 "With a glare, the Mummy can stir the Khaibit in a target, paralyzing them for a short period of time."
 BARRING_THE_GATES_PERK_EFFECT:0 "#Bold Unlock Manipulate the Shroud option in umbra panel.#!\nThe Mummy can raise the strength of the local Shroud to prevent any wraithly incursions."
 CALL_OF_OBLIVION_PERK_EFFECT:0 "The Mummy immediately forces the soul of his target out of its body, passing on to whatever fate awaits it."
 PROMISE_MADE_BEFORE_AMMUTS_SCALES_PERK_EFFECT:0 "#Bold Unlock Grant Extra Life [character_interaction|E].#!\nThe Mummy can transfer a fragment of the Spell of Life on a willing mortal after consulting with the Judges of Ma'at on the case."
 UNMAKING_PERK_EFFECT:0 "#Bold Unlock $EXECUTION_UNMAKING$ [executions|E] option.#!\nThe Mummy can toss anything into the Well of the Void, erasing it from existence."
 
 # Nomenclature
 
 ASKING_THE_TREES_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Amenti can control plant life to a limited degree."
 FORGETTING_THE_STONE_PERK_EFFECT:0 "The Amenti can make certain inorganic materials vanish."
 FORGETTING_THE_TREE_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Amenti can make organic materials, like wood, vanish."
 NAME_THE_SECRET_PERK_EFFECT:0 "The Amenti can divine hidden weaknesses from studying the True Name of a target."
 NAMING_THE_WARNING_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves.#!\nThrough intoning syllables of their True Name, the Amenti can scare enemies away."
 BECOMING_THE_STONE_PERK_EFFECT:0 "#Bold Unlock several shapeshift option.#!\nThe Amenti can transform his flesh into a mineral whose Name they know."
 BECOMING_THE_TREE_PERK_EFFECT:0 "#Bold Unlock several shapeshift option.#!\nThe Amenti can transform his flesh into a plant."
 CLOUD_THE_NAME_PERK_EFFECT:0 "The Amenti can obscure his own True Name, hiding from enemies who also use this art."
 COMMAND_THE_BEAST_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Amenti can cow an animal to his service."
 MEND_FLESH_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Amenti can command tissue to grow back together."
 BECOME_ANIMAL_PERK_EFFECT:0 "#Bold Unlock several shapeshift option.#!\nThe Amenti can transform himself into an animal whose True Name he has divined."
 COMMAND_THOUGHT_PERK_EFFECT:0 "#Bold Unlock the Command [character_interaction|E].#!\nThe Amenti can issue a verbal command that a sentient target has to follow."
 NAME_THE_HEKAU_PERK_EFFECT:0 "The Amenti can unravel other supernatural arts aimed against him."
 WHISPERS_TO_THE_HEART_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Amenti can inspire any emotion in a target."
 ENSLAVE_PERK_EFFECT:0 "#Bold Bonus to the Command [character_interaction|E].#!\nThe Amenti can bind a target to his will for an extended period of time."
 FORTIFY_FLESH_PERK_EFFECT:0 "#Bold Unlock a shapeshift option.#!\nThe Amenti can grant their skin the qualities of stone."
 NAMING_THE_BODYS_DESTRUCTION_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Amenti can target his enemies' body parts by speaking their True Names and commanding them to wither."
 SPEAKING_ALL_NAMES_PERK_EFFECT:0 "The Amenti can gain an immediate vocabulary in any language through his knowledge of True Names."
 FORGETTING_THE_NAME_PERK_EFFECT:0 "#Bold Unlock the Banish from Existence [character_interaction|E].#!\nThe Amenti can erase the True Name of a target, banishing it from existence and erasing all records."
 PTAHS_WORD_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nThe Amenti can create a small, inanimate object by speaking its True Name."
 WHISPERS_TO_THE_BODY_PERK_EFFECT:0 "#Bold Unlock a shapeshift option.#!\nThe Amenti can reshape his own form by speaking its True Name and commanding it to do what he desires."
 WORDS_OF_AUTHORITY_PERK_EFFECT:0 "#Bold Bonus to the Command [character_interaction|E].#!\nThe Amenti speaks one sentence that all who hear are obliged to fulfill to the best of their abilities."
 ECHO_THE_LESSER_NAME_PERK_EFFECT:0 "#Bold You will also discover target courtiers' true name during the Discover True Name scheme.#!\nThe Amenti can gain an understanding of the True Name of basic things or concepts merely by listening to the resonance carried by Sekhem."
 NAME_OF_SEKHEM_PERK_EFFECT:0 "#Bold Unlock the Draw sekhem [character_interaction|E].#!\nThe Amenti can command Sekhem, drawing it to himself to replenish his own reservoirs, or directing it to an ally."
 NAME_OF_SKILL_PERK_EFFECT:0 "The Amenti can learn or enhance a skill through knowledge of a relevant True Name."
 RIDDLE_OF_THE_SPHINX_PERK_EFFECT:0 "#Bold Bonus to the Command [character_interaction|E].#!\nThe Amenti can ask a question and instill the need into a target to answer it."
 BECOMING_THE_PERSON_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nBy utilizing a persons True Name, the Amenti becomes that person, truly gaining an understanding of what this person is like."
 ECHO_THE_GREATER_NAME_PERK_EFFECT:0 "#Bold You will also discover target vassals' true name in Discover True Name scheme.#!\nThe Amenti can gain an understanding of the True Name of more complex things or concepts."
 NAME_OF_THE_ATTRIBUTE_PERK_EFFECT:0 "The Amenti can raise his attributes by using their True Name."
 NAMES_OF_THE_FORGOTTEN_PERK_EFFECT:0 "#Bold Can recruit [GetMaA('the_lost_ancients').GetName] as [men_at_arms|E].#!\nThrough diligent research, the Amenti can create a True Name for a being who has lost theirs."
 NAME_OF_THE_WILL_PERK_EFFECT:0 "The Amenti can raise his willpower by using their True Name."
 RENAMING_THE_HEKAU_PERK_EFFECT:0 "The Amenti can rearrange the laws of a specific supernatural power, for example redefining the Discipline of a vampire or the paradigm of a mage."
 
