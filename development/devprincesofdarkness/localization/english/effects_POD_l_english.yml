 LONG_NECK_PERK_EFFECT:0 "Allow you to stretch your limbs or neck to impressive lengths.\n\nUnlock a duel move."
 DETACH_LIMB_PERK_EFFECT:0 "Allow you to animate your body part to act apart from main body.\n\nUnlock a spy option."
 LOTUS_BREATH_PERK_EFFECT:0 "Allow you to exhales a cloud of Yang energy that turns mortals dreamy, giggly and generally incoherent."
 PELESIT_PERK_EFFECT:0 "Allow you to construct small creatures from your own flesh and send them out for errands.\n\nUnlock a spy option."
 TEN_THOUSAND_FORMS_PERK_EFFECT:0 "Allow you to shape your body in any form desired as long as it retains the same mass as your original body.\n\nUnlock several shapeshift option."
 BODY_OF_THE_MOUSE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to shrink, modifying your own body mass.\n\nUnlock several shapeshift option."
 BODY_OF_THE_SERPENT_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Your body becomes as flexible as rubber, allowing you to slide through small spaces.\n\nUnlock several shapeshift options."
 BLOAT_PERK_EFFECT:0 "$same_o_higher_dharma_header$ By absorbing masses of Yang Chi from the environment, you can increase your body size.\n\nUnlock several shapeshift options."
 UNCHAINING_THE_FORM_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can attain every shape and form you desires, regardless of body mass.\n\nUnlock several shapeshift options."
 
 # Blood Shintai #

 PERMEATE_PERK_EFFECT:0 "Allow you to swell or shrivel own body.\n\nUnlock a spy option."
 BLOOD_ATEMI_PERK_EFFECT:0 "Allow you to move blood in victim's body.\n\nUnlock a duel move."
 FLOW_LIKE_BLOOD_PERK_EFFECT:0 "Allow you to become as fluid as blood.\n\nUnlock a shapeshift option."
 BLOODLASH_PERK_EFFECT:0 "Allow you to create a lethal tendril of blood.\n\nUnlock a duel move."
 BLOOD_AWAKENING_PERK_EFFECT:0 "Allow you to awake or freeze Yang Spirit or Wraiths.\n\nUnlock awake spirit and freeze spirit character interactions and add a chance of gaining more piety in the first option of spirit interaction."
 BLOOD_BLADE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to create a weapon made of blood that causes aggravated damage."
 BLOOD_OF_THE_SCORPION_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to poison the target with Yin blood toxin."
 CORRUPTION_OF_THE_BLOOD_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to cause the victim's blood to become toxic."
 BLOOD_LEECHING_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to burst the victim's blood from pores into you."
 
 # Ghost-Flame Shintai #

 GOBLIN_FACE_PERK_EFFECT:0 "Orifices in your face begin to blaze with heat, allowing you to see in pitch darkness and inflicting greater damage with your bite.\n\nUnlock a shapeshift option."
 GOBLIN_SPARK_PERK_EFFECT:0 "Allow you to summon a tiny ball of spirit fire that cannot actually harm anything , but emits a soft light and can be twisted into various shapes according to its creator's wishes."
 GOBLIN_SHAPES_PERK_EFFECT:0 "Allow you to twist flames into various forms according to your desires."
 GOBLIN_SCORCH_PERK_EFFECT:0 "Allow you to exhale a gout of spirit flames.\n\nUnlock a duel move."
 GOBLIN_LANTERN_PERK_EFFECT:0 "Allow you to temporarily ignite your form, even allowing you to turn into a glowing orb of fire.\n\nUnlock a duel move and a shapeshift option."
 GOBLIN_SWORD_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to manifest a fiery sword within your hand that can harm both physical as well as spiritual objects."
 GOBLIN_PORTAL_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to use fire as a gateway to teleport to any other flame within a certain radius."
 GOBLIN_CALL_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to call spirits of fire from either the Yin or the Yang Worlds to do your biding.\n\nAdd chance of gaining more piety in the first option of the spirit interaction decision."
 MANTLE_OF_THE_FLAME_EMPEROR_PERK_EFFECT:0 "$same_o_higher_dharma_header$ With a brief command, you can cause another person to burn from the inside out by consuming their internal chi."
 
 # Jade Shintai #

 STAND_UPON_THE_DRAGONS_BACK_PERK_EFFECT:0 "Allow you to channel Chi from the Earth’s natural flows into your body, and vice versa, rooting yourself to the Earth.\n\nUnlock a duel move."
 TREAD_THE_THRASHING_DRAGONS_TAIL_PERK_EFFECT:0 "By polarizing your Chi in line with that of your surroundings, you makes yourself preternaturally deft and light. You may walk safely and steadily along the narrowest of ledges, the most unstable ground, and even the surface of lakes or oceans."
 PLACATE_THE_EARTH_DRAGON_PERK_EFFECT:0 "By gently singing to the spirits of earth, stone, and wood, you may cast yourself into their embrace.\n\nEnhance a spy option and add a chance of gaining more piety in the first option of spirit interaction decision."
 HARNESSING_THE_DRAGONS_BREATH_PERK_EFFECT:0 "By attuning your body to local streams of Chi, may actually fly along “updrafts” of energy. "
 JADE_SERVANT_OF_THE_AUGUST_PERSONAGE_PERK_EFFECT:0 "The ultimate attuning of Chi to surroundings, this power draws upon the Five Element theory as well as great mastery of Chi. You may channel spiritual energies of the classic Five Elements — Metal, Wood, Water, Fire, and Earth — through your form, thus gaining the properties of the element in the process.\n\nUnlock several shapeshift options."
 STONE_FISH_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You learn to become one with the earth — literally. You can sink into it as effortlessly as a man walks into a pool of water."
 BLADE_OF_STONE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to create weapons of stone — not just blades, but any sort of melee weapon."
 TASTE_OF_JADE_PERK_EFFECT:0 " $same_o_higher_dharma_header$ Allow you to attune a piece of ordinary jade to Chi energies, turning it into a piece of true jade for a time."
 AUGMENT_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to attune yourself to the ambient Chi in an area, moreover actually to improve it and increase its power."
 
 # Yin Prana #

 SHROUDED_MOON_PERK_EFFECT:0 "Allow you tp turn invisible by cladding yourself in shadows.\n\nUnlock a shapeshift option."
 YIN_MANTLE_PERK_EFFECT:0 "Allow you to channel your internal Yin energy into an animus that shrouds you. This animus, or mantle, is invisible to mortals, but it feels to them like a cold breeze in the air."
 BONE_DANCE_PERK_EFFECT:0 "By performing a series of complicated and painful postures, you can channel Yin energy in an area, turning everyone within lethargic.\n\nUnlock a duel move."
 EIGHTFOLD_YIN_MANTLE_PERK_EFFECT:0 "Like the initial Yin Mantle, only that the Yin energy manifests as a crackling black aura of Yin energy that can be shaped according to the user's wishes."
 SEMBLANCE_OF_THE_EBON_DRAGON_PERK_EFFECT:0 "Allow you to become insubstantial as your body mass shifts into the Yin World.\n\nNo more cost to enter and stay in the Yin World and unlock a shapeshift option."
 YIN_SHIELD_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You form your Yin animus into a protective carapace around your body."
 YIN_NIHILUS_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to create a deadly halo of Yin energy that sears everyone near to the user."
 TOUCH_OF_RUST_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can cause metal of any kind to quickly crumble down."
 IRON_CORPSE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to transform your very flesh into metal. In this form, your combat abilities rise as your fingers turn into razor claws, but on the downside, you becomes unable to swim.\n\nUnlock a shapeshift option."
 
 # Yang Prana #

 PRINCIPLE_OF_MOTION_PERK_EFFECT:0 "Amplifies movements with Yang Chi."
 YANG_MANTLE_PERK_EFFECT:0 "Allow you to attune your internal chi to the aura of a living person, making you appear much friendlier and more attractive."
 DRAGON_DANCE_PERK_EFFECT:0 "Through a series of wild leaps, acrobatic katas, and yogic posturings, enters a battle trance. Capable of impressive combat feats while in this state.\n\nUnlock a duel move."
 EIGHTFOLD_YANG_MANTLE_PERK_EFFECT:0 "Like the initial Yang Mantle, only that the Yang energy manifests as a roiling crimson aura of Yang energy that can be shaped according to the user's wishes."
 SEMBLANCE_OF_THE_SCALET_QUEEN_PERK_EFFECT:0 "Allow you to become insubstantial, as your body mass shifts into the Yang World.\n\nNo more cost to enter and stay in the Yang World and unlock a shapeshift option."
 YANG_SHIELD_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You form your Yang animus into a glowing aura around your body that protects you."
 YANG_PHOENIX_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to create scarlet flames of raw Yang energy that sear everyone near the user."
 TOUCH_OF_CORRUPTION_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to cause wood or any other organic material to quickly decay, refilling your own chi reservoirs."
 OAKEN_CORPSE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to transform your very flesh into wood. In this form, your combat abilities rise as your fingers turn into deadly stakes and will float in water.\n\nUnlock a shapeshift option."
 
 # Equilibrium #

 MASTER_FLOW_PERK_EFFECT:0 "Allow you control over the flow of chi within your body more efficiently.\n\nAllow you to use another aspected chi when you run out of chi of your preference."
 ADJUST_BALANCE_PERK_EFFECT:0 "Allow you create to minor variants to a target's internal balance of chi, possibly allowing to create imbalances or cure it.\n\nUnlock the character interaction of the same name."
 SHIFT_THE_BALANCE_PERK_EFFECT:0 "Allow you to alter your internal chi balance, becoming either Yin or Yang imbalanced.\n\nEnhance the character interaction of the same name."
 CHI_INTERRUPT_PERK_EFFECT:0 "Allow you to stop the internal flow of chi within a target, causing painful spasms.\n\nUnlock a duel move."
 CHI_MASTERY_PERK_EFFECT:0 "Allow you to drain chi from your target or willingly corrupt chi within the body.\n\nUnlock the character interaction of the same name."
 SOOTHING_THE_SOUL_PERK_EFFECT:0 "$same_o_higher_dharma_header$ By caressing out inconsistencies and eddies in the Chi flow of a subject, you can make your target lethargic in inner peace, similar to the effects of the Kiss."
 ACCENTUATE_CHI_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can cause the target to experience extreme swings in mood and energy. Yin-energies cause the victim to become languid, dull-minded, and slow, while Yang energies make the subject restless and agitated."
 OPENING_THE_GATES_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can cause Chi to burn your target from the inside out"
 ADJUST_THE_TRUE_BALANCE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can create a permanent chi imbalance within your target. Alternatively, it can dispel lasting imbalances, and even cure illnesses like cancer within a mortal target.\n\nEnhance the adjust balance character interaction."
 
 # Tapestry #

 SPIRIT_CALL_PERK_EFFECT:0 "Lure nearby spirits or wraiths towards you.\n\nUnlock summon character interaction to wraiths target and add a chance of gaining more piety in the first option of the spirit interaction decision."
 CHI_WARD_PERK_EFFECT:0 "Allow you to affect the local Wall rating.\n\nUnlock strengthening or weakening the Wall decision."
 CHI_SHAPING_PERK_EFFECT:0 "Allow you to manipulate the currents of chi beneath the earth for a variety of effects, like invoking joss, weakening chi based attacks, or trapping local spirit.\n\nAllows you to upgrade the control the Dragon Line building."
 RIDE_THE_DRAGON_PERK_EFFECT:0 "Allow you to travel along a Dragon Line, teleporting yourself across it."
 CHI_RIFT_PERK_EFFECT:0 "Allow you to create a portal between the Middle Kingdom and the spiritual realms, unleashing a tempest of elemental chi that wreaks havoc in an area.\n\nUnlock the character interaction of the same name."
 CELESTIAL_NEEDLE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can open Chi Rifts and other gaps between the worlds."
 DRAGON_CHARIOT_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can travel with several companions alongside a Dragon Line."
 CHI_CASTLE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can form a temporary Dragon Nest, thereby upsetting the spiritual balance and invoking the ire of spirits and other shen."
 THE_DRAGONS_RAPINE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to throw an opponent along a dragon line, able to expulse them from the flow anywhere, even in solid objects."
 
 # Chi'iu Muh #
 
 RASA_PERK_EFFECT:0 "Catch glimpses of ages past and ages to come."
 CHI_SIGHT_PERK_EFFECT:0 "Sense the world of spirits as clearly as the material world.\n\nUnlock Trace the Dragon's Blood decision."
 DRAGON_WARD_PERK_EFFECT:0 "Allow you to create a barrier of chi that turns away any attackers.\n\nUnlock a duel move."
 PURIFICATION_PERK_EFFECT:0 "This power, a legacy of more noble days, was used by the Wan Xian of old to cleanse their mortal subjects and domains of demonic taint.\n\nUnlock the character interaction of the same name."
 SPIRIT_EATING_PERK_EFFECT:0 "Allow you to sever the ties that hold a soul to its body to either purify it or devour it.\n\nUnlock the character interaction of the same name."
 SHIELD_OF_THE_SOUL_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Protects your own soul against attacks from other supernaturals."
 BANKING_THE_FIRE_CALMING_THE_WAVES_PERK_EFFECT:0 "$same_o_higher_dharma_header$ With but a touch, you can bring one of your brethren out from under the tumultuous control of their souls, restoring their balance."
 SOUL_TAINT_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can make your victim displeasing to anyone in your presence after briefly touching it."
 SOUL_EXCHANGE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to switch the soul of any person with that of another."
 
 # Cultivation #

 SCRUTINIZE_PERK_EFFECT:0 "Becomes privy to the dark urges within yourself and others.\n\nUnlock a spy option."
 CLEAVE_THE_DEMON_PERK_EFFECT:0 "Allow you to separate your P'o from your Hun, leaving the other part of the soul in spirit form. "
 LASH_THE_DEMON_PERK_EFFECT:0 "Allow you to separate other shen from their darker sides.\n\nUnlock the character interaction of the same name."
 YOKE_THE_DEMON_PERK_EFFECT:0 "Allow you to pluck the P'o from the Hun, and subordinates the internal Demon. A Demon thus subordinated can be used to intimidate lesser creatures and watch for enemies."
 TWO_BECOME_ONE_PERK_EFFECT:0 "Allow you to temporaly fuse your Hun and P'o, giving you a taste of Enlightenment that can send you spiraling into depravity all the quicker."
 EVOCATION_OF_MADNESS_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow your victim to give in to their P'o Nature for just a short while -- the briefest of moments, perhaps, but always long enough to warp the victim's mind."
 DEGRADATION_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to force another cathayan into Shadow Soul, all the while forcing them to watch helplessly as their P'o runs rampart."
 STRENGTHENING_THE_DEMON_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You briefly cultivate the darkness within yourself, the better to take advantage of the power of darkness."
 DARKLING_MIRROR_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to split your P'o apart from your Hun and body for use as an evil servant."
 
 # Internalize #

 NO_MIND_PERK_EFFECT:0 "Allow you to purge your Hun from distracting thoughts, which increases the difficulties to Frenzy."
 BLOOD_YOGA_PERK_EFFECT:0 "By performing ritualistic motions and katas, Wan-kuei can recollect Willpower more easily.\n\nUnlock the meditate in seclusion decision even if you don't have the necesary tenet, you just need pay prestige, if you already have the necesary tenet, you will receive piety."
 DISTANT_DEATH_KATA_PERK_EFFECT:0 "By slowly inhaling and exhaling while punching in the air, you may mystically transfer your punch on your target.\n\nUnlock the character interaction of the same name."
 IRON_SOUL_PERK_EFFECT:0 "Turns inner energies into strengthening your mind and body."
 HARMONY_WITH_THE_ALL_PERK_EFFECT:0 "Allow you to cast your consciousness to the beginnings cosmic cycle, temporarily allowing you to draw upon the perfection of the First Age.\n\nUnlock the character interaction of the same name."
 REAPING_THE_DRAGONS_ROAD_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can take Chi straight from dragon lines and nests by sheer force of will.\n\nAllow you to not raise Wall level when you have the control dragon line building by Osmosis."
 STEEL_SOUL_PERK_EFFECT:0 "$same_o_higher_dharma_header$ A refinement of Iron Soul, it allows your near miraculous feats."
 ARMOR_OF_ENLIGHTENMENT_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Your wisdom and insight prevent your from taking physical harm from an opponent.\n\nAllow you to gain stress instead of taking a wound."
 HOLDING_THE_GREEN_DEMON_AT_BAY_PERK_EFFECT:0 "$same_o_higher_dharma_header$ With this power, you can force your soul to remain inside your body, even if you suffered lethal wounds.\n\nAllow you to not die by wounds."
 power_prevent_you_dead_from_wound_ct:0 "Your power prevented your death from this wound!"
 
 # Obligation #

 EVALUATE_PERK_EFFECT:0 "Allow you to scan the Hun of your opposite to discern weaknesses.\n\nUnlock a spy option."
 SOUL_BRIDGE_PERK_EFFECT:0 "Allow you to link your Hun with the Hun of your opposite, allowing you to appear more trustworthy.\n\nUnlock the character interaction of the same name."
 AUTHORITY_PERK_EFFECT:0 "Allow you to assume an aura of natural authority that affects everyone near to you."
 THOUSAND_HELL_STARE_PERK_EFFECT:0 "Allow you to channel all your guilt, frustration, anger, and hunger into your Hun soul and then project this negative psychic energy like a knife into victim's soul.\n\nUnlock a duel move and project negative psychic energy character interaction."
 SOUL_SHACKLES_PERK_EFFECT:0 "Allow you to create permanent bonds between your Hun and the Hun of another person.\n\nUnlock the character interaction of the same name."
 TAMING_THE_FIRE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can command and redirect a cathayan in Fire- or Wave Soul."
 CORRUPT_THE_WILL_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can reduce the temporary Willpower of your opposite."
 VOICE_OF_THE_EMPEROR_PERK_EFFECT:0 "$same_o_higher_dharma_header$ With this power, you can sway the opinions and actions of a crowd of mortals — as many as can hear you. Those who listen to you believe what you say, and will be strongly inclined to do as you command.\nUnlock a new Spawn Army option."
 DIVINE_FETTERS_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You can broaden your command of Authority to include other Shen."
 
 # Black Wind #

 BLACK_WIND_PERK_EFFECT:0 "Allowing the rage of the P'o to channel itself through your body, you become inhumanly swift — a typhoon of destruction."
 A_THOUSAND_CUTS_PERK_EFFECT:0 "$same_o_higher_dharma_header$ This power allows you to focus your P'o so that you become a veritable whirlwind in combat. Your arms a blur; your feet are as fast as lightning; you can strike a target (or targets) so many times that there is almost no way for it to avoid the blows.\n\nUnlock a duel move."
 TREADING_THE_TIDE_DRAGONS_BACK_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to move with such speed that you can run across the surface of the water without falling in."
 DIVINE_WHIRLWIND_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Your very thoughts instantly become actions, allowing you to hit your target multiple times before they can even respond."
 TRANSCENDING_PO_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You have learned how not to let darker aspects of your nature get the best of you. By soothing yourself with the calming energies of Yin Chi, you can keep a hold on your bestial side."
 
 # Demon Shintai #

 DEMON_SHINTAI_PERK_EFFECT:0 "Gain one additional demonic feature as your level increases.\n\nUnlock demonic feature shapeshift option, and unlock a duel move at level 2"
 ADVANCED_DEMON_SHINTAI_PERK_EFFECT:0 "Only with same or higher dharma level can you buy the same level perk. Gain two additional demonic features as level increases.\n\nUnlock transform demonic feature shapeshift option that allow you to reset all features at final level."
 
 same_o_higher_dharma_header:"Only with same or higher dharma level can you buy this perk."
 
 # Qiao #

 CELESTIAL_PUNISHMENT_PERK_EFFECT:0 "These prayers work as a warning to the shen. When they strike their target, they ignite, causing no physical damage but burning the P'o of the target. These paper prayers are as effective as thrown knives and resist even the strongest natural winds while on route to their target.\n\nUnlock make prayer character interaction."
 DIVINE_BINDINGS_PERK_EFFECT:0 "When cast toward a shen target, these innocuous sheets of paper move against the wind and even circumvent obstacles to strike. Once the prayers hit the target, they glow with an eerie green energy and expand, becoming thicker and longer as they wrap themselves around the shen.\n\nEnhance make prayer character interaction."
 HEAVENLY_FLAMES_PERK_EFFECT:0 "When this prayer strikes a target shen, it immediately bursts into bright-blue flames that cause aggravated damage. As with Divine Bindings, the prayer moves around obstacles to reach their target.\n\nEnhance make prayer character interaction."
 CELESTIAL_FIRES_PERK_EFFECT:0 "Celestial Fires is identical to Heavenly Flames, with one exception: The damage may not be soaked without special defenses.\n\nEnhance make prayer character interaction."
 HEAVENS_THUNDER_PERK_EFFECT:0 "This, the most powerful of the Shih's prayers, is virtually unstoppable once cast. As the prayers leave the Shih's hand, they glow fiercely and move with the speed of lightning toward their destination. When they strike the shen, they explode in balls of electrical fury capable of grievously wounding almost any demon.\n\nEnhance make prayer character interaction."
 STEEL_SKIN_PERK_EFFECT:0 "You increase your Stamina by use of this power."
 DRAGONS_SPEED_PERK_EFFECT:0 "You increase your Dexterity by use of this power."
 TIGERS_STRENGTH_PERK_EFFECT:0 "You use this ability to increase your Strength in preparation for combat."
 CELESTIAL_EYES_PERK_EFFECT:0 "You increase your Perception using this level of the Mo Kung Qiao."
 BODY_OF_THE_DRAGON_PERK_EFFECT:0 "You increase all of your Attributes to superhuman levels."
 OPENED_EYES_PERK_EFFECT:0 "The Shih can see the shen for what they are. The Shih can also ignore the effects of the Delirium."
 DIVINE_PERCEPTIONS_PERK_EFFECT:0 "This power entitles the Shih to view the spirit of another being, It works like a lie detector for the most part, but the Shih can also see when a mortal or other entity is possessed by a demon."
 WIND_TALK_PERK_EFFECT:0 "The Shih employing this ability can listen to the denizens of the spirit realms and communicate with them. The shen are not, however, obligated to respond to any questions or demands the Shih might make.\n\nAdd a chance of gaining more piety in the first option of the spirit interaction decision."
 CELESTIAL_WINDOW_PERK_EFFECT:0 "The Shih employing this ability interacts on all levels with one denizen of the Yin or Yang Realm. For all intents and purposes, the chosen spirit is on the same level of existence as the Shih. That spirit can be touched, hurt, helped or engaged in combat as if both the Shih and the spirit were in the same place.\n\nAdd a chance of gaining more piety in the first option of the spirit interaction decision."
 CELESTIAL_DOORWAY_PERK_EFFECT:0 "The Shih can actively interact with the spirit worlds; however, this course of action is not necessarily the wisest to take. While the character actually remains in the Middle Kingdom, he can see and affect the Yin and Yang Worlds around him. Although, the denizens of those realms can return the favor, and many of them aren't fond of the Shih.\n\nAdd a chance of gaining more piety in the first option of the spirit interaction decision."
 BARRIER_OF_PAIN_PERK_EFFECT:0 "The Shih can force herself to shut out pain at this level.\n\nUnlock chi heal character interaction to heal scars"
 THE_CLOSING_WOUND_PERK_EFFECT:0 "At this level, the Shih is able to heal wounds. Bruised flesh loses its tenderness; wounds knit themselves back together and leave fresh scars.\n\nEnhance chi heal character interaction to heal wounds."
 SPIRITUAL_HEALING_PERK_EFFECT:0 "The Shih can re knit bones and rebuild nerve tissue with this ability. This process is painful and often risky if used in a combat situation. The bones must be reset properly or the Shih risks crippling herself permanently.\n\nEnhance chi heal character interaction to heal lost body parts."
 ESCAPE_FROM_DEATH_PERK_EFFECT:0 "The Shih using this ability can regenerate even burs and other energy damage. While very useful, Escape from Death is also very costly.\n\nAllow you to spend willpower instead of taking wounds and enhance chi heal character interaction to heal illness or lesser physical disavantages."
 FLAMES_OF_THE_PHOENIX_PERK_EFFECT:0 "The character using this ability completely regenerates herself on a cellular level. This power can't bring a character back from the dead, but it reverses the effects of radiation poisoning, cancer, severe trauma and even old age.\n\nAllow you to not be killed by wounds and enhance chi heal character interaction to heal several new diseases or physical disavantages."
 THOUSAND_FISTS_PERK_EFFECT:0 "The Shih focuses his Yang Chi and cuts loose with multiple punches. The strikes are superhuman-fast, often blurring in the air."
 SPEAR_HAND_PERK_EFFECT:0 "The Shih focuses his Yang Chi and ignites the energy around one hand. This energy ripples the air and burns intensely."
 BURNING_GHOSTS_PERK_EFFECT:0 "The Shih knight focuses his Chi, slowing him to combat wraiths and sirits of all types. His skin glows with a golden light, and Chi energies wrap around him. The Shih's body doesn't actually strike the spirits but the aura of power surrounding him does."
 STEEL_BODY_PERK_EFFECT:0 "The Shih focuses his Yin Chi, toughening his body and increasing his ability to inflict damage. Every muscle in the Shih's body tautens, and his skin becomes far more resilient,"
 THOUSAND_SWORDS_PERK_EFFECT:0 "The Shih concentrates his Chi, then lashes out against his enemies in a furry of actions. Each strike opens wounds in his enemy, and the sound of the impacts is like that of metal striking metal."
 FROZEN_RIVER_PERK_EFFECT:0 "The Shih uses her Yang Chi to build a protective barrier around her own life force, thus preventing the theft of her Chi."
 STOLEN_SERPENT_PERK_EFFECT:0 "The Shih can capture any ranged supernatural attack directed against him and then send it hurtling back at the opponent who cast it. This is a dangerous business, as the Shih must demonstrate perfect timing in order to seize the mystical energies thrown at him."
 CELESTIAL_BARRIER_PERK_EFFECT:0 "With this power, the Shih temporarily blocks the shen's ability to take Chi from other sources.\n\nUnlock the character interaction of the same name."
 CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT:0 "The Shih using this ability is able to steal Chi from a shen. While stolen Chi is no longer available to the shen, neither can the Shih use the stolen Chi.\n\nUnlock steal chi character interaction."
 BITE_OF_THE_MU_PERK_EFFECT:0 "The Shih using this ability not only steals the Chi from a target shen, but also uses that Chi in an attack against the shen. This procedure is a very risky one, for it awakens the Shih's P'o.\n\nEnhance steal chi character interaction."
 EYES_OF_THE_DRAGON_PERK_EFFECT:0 "The Shih stares down an opponent. Intimidation is the key to avoiding combat successfully. ."
 DARK_REFLECTION_PERK_EFFECT:0 "This power forces the enemies of the Shih to realize the consequences of their actions. Shih use this power when pronouncing judgment on a shen."
 HUNTED_EYES_PERK_EFFECT:0 "This power works on Hungry Dead and Restless Dead alike. Staring into the eyes of an opponent, the Shih forces the target to re experience any time spent in the Yomi World."
 VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT:0 "A Shih employing this power can command one spirit to accomplish one simple task.\n\nAdd a chance of gaining more piety in the first option of the spirit interaction decision."
 DIVINE_ORDINANCE_PERK_EFFECT:0 "The Shih inspires overwhelming fear in all opponents within visual range."
 BALANCE_OF_THE_SPIRIT_PERK_EFFECT:0 "The Shih can discern the spiritual imbalances of Yin and Yang and attermpt to restore proper order with this power.\n\nUnlock exorcism character interaction to restore imbalance."
 FOCUS_OF_THE_MIND_PERK_EFFECT:0 "Shih use a great deal of their Willpower fighting against shen. This power lets them regain their resolve and once again perform their sacred duties.s\n\nEnhance exorcism character interaction to reduce stress."
 NIGHTMARE_EXORCISM_PERK_EFFECT:0 "Many Shih turn to drugs and alcohol in an effort to alleviate their mental anguish. Shih using this power take a more direct approach by erasing the memory's emotional impact and, hopefully, removing the mental scars that memory creates.\n\nEnhance exorcism character interaction to remove negative stress traits."
 SELF_EXORCISM_PERK_EFFECT:0 "Shih, like all mortals, are subject to the risks of demonic possession. With this power, the demon hunter engages in psychic battle with a demon that has successfully managed to gain entry to her body, acquiring a second chance to expel the demon.\n\nEnhance exorcism character interaction to remove negative mental traits."
 MENTAL_DOMINION_PERK_EFFECT:0 "A Shih using this power can fully restore her Willpower and actually weaken her P'o.\n\nEnhance exorcism character interaction to reduce all stress."
 CLOUD_WALKING_PERK_EFFECT:0 "This power lets the Shih move silently and without leaving a trail, even while running. The Shih leaves behind no scent to indicate that he has ever been in the area."
 WATER_TREADING_PERK_EFFECT:0 "With this power, the Shih is able to travel over unstable surfaces, such as water or quicksand, and to use virtually any surface, even leaves on a tree, for the purpose of climbing."
 WIND_STRIKE_PERK_EFFECT:0 "The Shih uses an opponent's own momentum to throw an enemy incredible distances."
 MOUNTAIN_STANCE_PERK_EFFECT:0 "The Shih absorbs the impact of an attack, redirecting the force into the ground."
 CELESTIAL_WIND_PERK_EFFECT:0 "The Shih using this power focuses his Chi to stop a target from advancing and possibly even sends an opponent crashing backward."

 # Meritocracy #
 
 MERITOCRACY_LEGACY_1_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor will be Strong and Athletic.\n\nMens sana in corpore sano."
 MERITOCRACY_LEGACY_2_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor will be a better Blademaster or Hunter.\n\nSi vis pacem, para bellum."
 MERITOCRACY_LEGACY_3_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor will have their Education quality increased by 1.\n\nScientia potentia est."
 MERITOCRACY_LEGACY_4_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor will have higher occurence or quality of positive Congenital Traits.\n\nGenuflectant omnes in plano."
 MERITOCRACY_LEGACY_5_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor have a higher chance of possessing True Faith.\n\nBis orat qui bene cantat."
 
 # Unity #
 
 UNITY_LEGACY_1_PERK_EFFECT:0 "In addition to the above effect, you will have a better success chance when choosing the martial or stewardship approach in the Find Lair scheme.\n\nPacta clara, boni amici."
 UNITY_LEGACY_2_PERK_EFFECT:0 "In addition to the above effect, you will complete Find Lair schemes faster.\n\nConveniens homini est hominem servare voluptas."
 UNITY_LEGACY_3_PERK_EFFECT:0 "Beatius est magis dare quam accipere."
 UNITY_LEGACY_4_PERK_EFFECT:0 "In addition to the above effect, training new apprentices will be more effective.\n\nArtificem commendat opus."
 UNITY_LEGACY_5_PERK_EFFECT:0 "Nulla vis maior pietate vera est."
 
 #Servitude legacy #
 
 SERVITUDE_LEGACY_2_PERK_EFFECT:0 "Feudal obligation will be raised."
 
 #Aspiration legacy #
 
 ASPIRATION_LEGACY_2_PERK_EFFECT:0 "Feudal obligation will be lowered."
 ASPIRATION_LEGACY_5_PERK_EFFECT:0 "Higher chance of inheriting [disciplines|E]."
 
 #Ventrue legacy #
 
 VENTRUE_LEGACY_1_PERK_EFFECT:0 "Bonus to heavy infantry MaA, unlocks a special character interaction to exchange hooks with other Ventrue.\nCamilla build the greatest Empire the [cainite|E] world has known or will ever know. [clan|E] Ventrue truly started with him."
 VENTRUE_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe Spartan Goddess charged bravely against Carthage's horrors. [clan|E] Ventrue will always honor her sacrifice."
 VENTRUE_LEGACY_3_PERK_EFFECT:0 "Unlocks a special character interaction to enforce [masquerade|E].\nMedon's idiotic death taught a valuable lesson to the Ventrue. Don't underestimate mortals."
 VENTRUE_LEGACY_4_PERK_EFFECT:0 "Cultural fascination bonus and monthly piety bonus.\nThe explorer is never truly sated for the world is as endless as her wanderlust."
 VENTRUE_LEGACY_5_PERK_EFFECT:0 "Bonus to heavy cavalry MaA.\nThe Persian general ascended to godhood at the sounds of thundering cataphracts."
 
 #Setite legacy #
 
 SETITE_LEGACY_1_PERK_EFFECT:0 "Piety bonus, unlocks special MaA.\nThe first son, the most devoted, is an exemplar for all Setites."
 SETITE_LEGACY_2_PERK_EFFECT:0 "Unlocks the Befriend scheme. You can use it for 7 maximum friends (up from 5).\nThere is no shame in eating the forbidden fruit in good company."
 SETITE_LEGACY_3_PERK_EFFECT:0 "Diplomacy bonus per prestige level.\nThere is always redemption in Set's embrace, even for the most stubborn 'Kindred'."
 SETITE_LEGACY_4_PERK_EFFECT:0 "Unlocks special Founding Temple building.\nBask in His glory and pray, for He will return to save us all."
 SETITE_LEGACY_5_PERK_EFFECT:0 "Buffs the Seduce scheme.\nThe lost daughter, the accursed, the Great Enemy... she will face retribution."
 
 #Baali legacy #
 
 BAALI_LEGACY_1_PERK_EFFECT:0 "Unlocks special MaA.\nAnd I looked, and behold a pale horse: and his name that sat upon him was Death and Hell followed with him."
 BAALI_LEGACY_2_PERK_EFFECT:0 "Dread bonus.\nAnd I saw when the lamb opened one of the seals, and I heard, as it were the noise of thunder, one of the four beasts saying, Come and see."
 BAALI_LEGACY_3_PERK_EFFECT:0 "+1 max hostile scheme.\nAnd I beheld, and lo a black horse; and he that sat on him had a pair of balances in his hand."
 BAALI_LEGACY_4_PERK_EFFECT:0 "MaA maintenance bonus.\nAnd I saw, and behold a white horse: and he that sat on him had a bow; and a crown was given unto him; and he went forth conquering and to conquer."
 BAALI_LEGACY_5_PERK_EFFECT:0 "Intimidated vassals contribution bonus.\nAnd there went out another horse that was red: and power was given to him that sat thereon to take peace from the earth, and that they should kill one another: and there was given unto him a great sword."
 
 #Gangrel legacy #
 
 GANGREL_LEGACY_1_PERK_EFFECT:0 "Unlocks special MaA, bonus to light infantry MaA.\nThe All-Father watches, proudly, as his children faces Ragnarok with bravery and honor."
 GANGREL_LEGACY_2_PERK_EFFECT:0 "Bonus to light cavalry MaA, Unlocks a special commander trait for every dynasty member with martial education.\nI ride with millions! I am the Scourge of God! And I will watch your world... burn."
 GANGREL_LEGACY_3_PERK_EFFECT:0 "Lowers new faith creation cost.\nThe bloody mother will have her revenge and the children of Caine will pay their debt tenfold."
 GANGREL_LEGACY_4_PERK_EFFECT:0 "Bonus to piety, unlocks a special character interaction to challenge other characters to duels for hooks.\nAnd he wept, for there was no more worlds left to conquer."
 GANGREL_LEGACY_5_PERK_EFFECT:0 "Bonus to monthly control in counties.\nThe cornered beast safeguards her flock, and strikes back with fury and an undying purpose."
 
   #Ravnos legacy #
 
 RAVNOS_LEGACY_1_PERK_EFFECT:0 "House opinion bonus, unlocks special MaA.\nThe kind mother of the Rroma safeguards her people and gives them purpose."
 RAVNOS_LEGACY_2_PERK_EFFECT:0 "Bonus to heavy cavalry MaA, unlocks a special commander trait for every dynasty member with martial education.\nAn eternal war needs an eternal general. Chandraputra is that man."
 RAVNOS_LEGACY_3_PERK_EFFECT:0 "Learning bonus, unlocks special character interaction to perform a ritual to gain wisdom.\nThe Rakshasa of Rakshasas cut off his eye to finally see."
 RAVNOS_LEGACY_4_PERK_EFFECT:0 "Prestige bonus.\nIf you live in Egypt, act like an Egyptian."
 RAVNOS_LEGACY_5_PERK_EFFECT:0 "Dread bonuses.\nThe accursed, the monster, the demon... the terror in each Ravnos' unbeating heart."
 
  #Cappadocian legacy #
 
 CAPPADOCIAN_LEGACY_1_PERK_EFFECT:0 "Learning per piety level bonus, unlocks a special character interaction to send your childer as councilors to other rulers.\nThe faithful son hides his fears but prepare for the worst that will soon come."
 CAPPADOCIAN_LEGACY_2_PERK_EFFECT:0 "Unlocks special character interaction to hire Lamia bodyguard.\nThe Dark Mother hides secrets that only her daughters could truly comprehend."
 CAPPADOCIAN_LEGACY_3_PERK_EFFECT:0 "Scheme resistance and power bonus.\nThe outcast and forgotten Cappadocian ruling branch will one day wear masks."
 CAPPADOCIAN_LEGACY_4_PERK_EFFECT:0 "Bonus to monthly income per stress level, stewardship bonus.\nByzantium was a city of dreams long before Constantine ever set foot in it."
 CAPPADOCIAN_LEGACY_5_PERK_EFFECT:0 "House opinion bonus.\nThe traitor son knows the truth, and unites the house against him with a purpose."
 
  #Brujah legacy #
 
 BRUJAH_LEGACY_1_PERK_EFFECT:0 "Reduced stress gains.\nThe King of Sparta is as unfeeling as the cold tip of his spear. Except when a particular Troyan is concerned."
 BRUJAH_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nHe almost saved Carthage from ruin. The Brujah remember his triumph, and mourn his defeat."
 BRUJAH_LEGACY_3_PERK_EFFECT:0 "Unlocks abduct scheme, bonus to abduct scheme, unlocks a special personal character interaction to form a cadre of Brujah knights.\nThe noble outlaw will defeat tyrants and kings with sword, bow and wits."
 BRUJAH_LEGACY_4_PERK_EFFECT:0 "Build cost and monthly income bonus.\nTo truly understand the Byzantine bureaucratic system you need a Russian princess."
 BRUJAH_LEGACY_5_PERK_EFFECT:0 "Knight and prowess bonus.\nThe first traitor fought hard for her utopia but Carthage fell long before the Roman came."
 
  #Tzimisce legacy #
 
 TZIMISCE_LEGACY_1_PERK_EFFECT:0 "Unlocks special MaA.\nThe unliving has no concern for morality. You will serve."
 TZIMISCE_LEGACY_2_PERK_EFFECT:0 "Bonus to monthly income.\nThe noble of the night carry the dreaded legacy of the Tzimisce [clan|E]."
 TZIMISCE_LEGACY_3_PERK_EFFECT:0 "Unlocks special MaA.\nHorrors and monsters come forth the flesh pits, ready to reclaim the Tzimisce's birthright."
 TZIMISCE_LEGACY_4_PERK_EFFECT:0 "Removes penalty to opinion for different faith.\nThe Holy Spirit has ascended, leaving only ruins in his wake."
 TZIMISCE_LEGACY_5_PERK_EFFECT:0 "Unlocks special Sanctuary of Flesh building.\nYou who enter here... won't ever leave."
 
  #Tremere legacy #
 
 TREMERE_LEGACY_1_PERK_EFFECT:0 "Unlocks special MaA.\nWhen you war for your very survival, sacrifices must be made. Plenty of sacrifices."
 TREMERE_LEGACY_2_PERK_EFFECT:0 "Bonus to liege opinion.\nThe only woman to have earned the respect of Tremere is the very foundation of the Pyramid."
 TREMERE_LEGACY_3_PERK_EFFECT:0 "Bonus to house opinion.\nIn the Pyramid, you all have a purpose and a place. Below your betters."
 TREMERE_LEGACY_4_PERK_EFFECT:0 "Bonus to maximum MaA cap.\nShe loves her creations and they love her in return. The Pyramid will soon tremble."
 TREMERE_LEGACY_5_PERK_EFFECT:0 "Bonus to learning per piety level.\nLearning and wisdom are the often forgotten qualities that make a true Tremere magus."
 
  #Toreador legacy #
 
 TOREADOR_LEGACY_1_PERK_EFFECT:0 "Diplomacy bonus.\nArt and decadence are one and the same to some."
 TOREADOR_LEGACY_2_PERK_EFFECT:0 "Bonus to seduce scheme power.\nThe Troyan will have her revenge, even if the world has to burn beforehand."
 TOREADOR_LEGACY_3_PERK_EFFECT:0 "Bonus to same faith opinion.\nThe archangel lost his mind and the world lost his last hope. The Dark Ages will never end."
 TOREADOR_LEGACY_4_PERK_EFFECT:0 "Allows to form alliances without marriage.\nBeware the scorned woman, for her fury will never end."
 TOREADOR_LEGACY_5_PERK_EFFECT:0 "Bonus to intrigue per prestige level, unlocks a special character interaction to spread false rumors about a target.\nThe most unlikely of heroes can be found in the most unlikely of places."
 
 #Salubri legacy #
 
 SALUBRI_LEGACY_1_PERK_EFFECT:0 "Hard enemy casualty bonus.\nHer vengeance is a terrifying sight but no fire burns forever."
 SALUBRI_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe Sword of the Salubri never knew defeat, even in death."
 SALUBRI_LEGACY_3_PERK_EFFECT:0 "Monthly piety bonus, unlocks caste system for your dynasty.\nShe will sing as the world burns around her. And perhaps will it be enough."
 SALUBRI_LEGACY_4_PERK_EFFECT:0 "Vassal opinion bonus.\nWise is the man that prepares for shelter when war is coming."
 SALUBRI_LEGACY_5_PERK_EFFECT:0 "60% Holy Wars cost reduction.\nThe traitor never faced justice and had the last laugh. A bitter victory for a broken man."
 
 #Lasombra legacy#
 
 LASOMBRA_LEGACY_1_PERK_EFFECT:0 "Intrigue bonus.\nThe shunned daughter plots her revenge. Against shadows she will use the ultimate fire."
 LASOMBRA_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe Shadow Reconquista will succeed, but its ultimate victor might not be the obvious one."
 LASOMBRA_LEGACY_3_PERK_EFFECT:0 "Faith conversion cost reduction.\nTruly, the Most Merciful transcends even death."
 LASOMBRA_LEGACY_4_PERK_EFFECT:0 "Intrigue bonus.\nPlotting for the sake of plotting is an art form in itself."
 LASOMBRA_LEGACY_5_PERK_EFFECT:0 "Faith creation and reformation cost reduction.\nConstantinople had its bitter revenge as Venice burns with her."
 
  #Banu Haqim legacy#
 
 BANUHAQIM_LEGACY_1_PERK_EFFECT:0 "Dread bonus.\nHidden behind a veil of secrecy, the Banu Haqim are feared far beyond their Middle Eastern borders."
 BANUHAQIM_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe Undefeated will rise to new heights. Even death won't stole his honor."
 BANUHAQIM_LEGACY_3_PERK_EFFECT:0 "Title creation cost reduction.\nBeing the Eldest doesn't mean much without the support of your peers."
 BANUHAQIM_LEGACY_4_PERK_EFFECT:0 "Light cavalry MaA bonuses.\nThe Carthaginian's traitor still wanders the night, a shame upon all true Banu Haqim."
 BANUHAQIM_LEGACY_5_PERK_EFFECT:0 "Different faith opinion bonuses.\nThe Black Shepherd will purge the Earth of the unworthy. This is the only salvation coming to this doomeed world."
 
  #Malkavian legacy#
 
 MALKAVIAN_LEGACY_1_PERK_EFFECT:0 "House opinion bonus.\nProphets of doom are rarely welcome, but often right."
 MALKAVIAN_LEGACY_2_PERK_EFFECT:0 "Income per stress level bonus, unlocks a special personal character interaction to 'borrow' skills.\nThe last true Malkavian Prince fought bravely against Carthage's horrors and earned the respect of all."
 MALKAVIAN_LEGACY_3_PERK_EFFECT:0 "Prestige bonus, unlocks a special character interaction to debuff scheme resistance of another ruler if they have any Malkavian courtier.\nAm I lying? Are you lying? IS THE WORLD LYING?!"
 MALKAVIAN_LEGACY_4_PERK_EFFECT:0 "Dread bonus.\nJust a nice, fancy, dinner with the heads of my courtiers."
 MALKAVIAN_LEGACY_5_PERK_EFFECT:0 "Learning per piety level bonus.\nIs selling your soul to evil bad when you didn't have a soul to begin with?"
 
  #Nosferatu legacy#
 
 NOSFERATU_LEGACY_1_PERK_EFFECT:0 "Allows to form alliances without marriage.\nThe proud monster stands tall against the horrors of the night, uplifting his [clan|E] to greater heights."
 NOSFERATU_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe ancients of the Middle East were no match for Tarique's proven skills and undying faith."
 NOSFERATU_LEGACY_3_PERK_EFFECT:0 "Stewardship and domain limit bonus.\nDenmark was made by and for Absalon, and will be unmade by him."
 NOSFERATU_LEGACY_4_PERK_EFFECT:0 "Advantage bonus.\nFury and hatred make for poor advisors, but great fuel for the Beast."
 NOSFERATU_LEGACY_5_PERK_EFFECT:0 "Dread bonus.\nThe Little Grandmother is the only, terrifying, hope against even more dreadful horrors."

   #Caitiff legacy#
 
 CAITIFF_LEGACY_1_PERK_EFFECT:0 "Dynasty opinion bonus"
 CAITIFF_LEGACY_2_PERK_EFFECT:0 "Prowess and hostile scheme resistance bonus"
 CAITIFF_LEGACY_3_PERK_EFFECT:0 "Prestige and piety gain bonus"
 CAITIFF_LEGACY_4_PERK_EFFECT:0 "Unlocks Thinbloods MaA"
 CAITIFF_LEGACY_5_PERK_EFFECT:0 "Knight bonus, unlocks a special commander trait for every dynasty member with martial education"
 
