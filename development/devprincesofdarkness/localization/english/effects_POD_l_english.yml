 YANG_SHIELD_PERK_EFFECT:0 "You form your Yang animus into a glowing aura around your body that protects you."
 YANG_PHOENIX_PERK_EFFECT:0 "#Bold Chance to maim an enemy knight in combat.#!\nAllow you to create scarlet flames of raw Yang energy that sear everyone near the user."
