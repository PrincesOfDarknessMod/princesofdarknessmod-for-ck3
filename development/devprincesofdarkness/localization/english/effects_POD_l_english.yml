 WHITE_TIGER_CORPSE_PERK_EFFECT:0 "Your body becomes transparent.\n\nUnlock a shapeshift option."
 BONE_OBEDIENCE_PERK_EFFECT:0 "Allow you bone structure to calcify and grow like rock crystals.\n\nUnlock a duel move and a shapeshift option."
 FIVE_POISON_CLOUD_PERK_EFFECT:0 "Allow you to exhale a poisonous cloud of black Yin energy.\n\nUnlock a duel move."
 CHING_SHIH_PERK_EFFECT:0 "Allow you to temporarily assume the Ch'ing Shih form.\n\nUnlock a duel move and a shapeshift option." 
 IKEHONE_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Allow you to rearrange the bone structure of any creature with a skeleton to your liking."
 SKELETAL_SCULPTING_PERK_EFFECT:0 "$same_o_higher_dharma_header$ Now you can bypass the flesh of your target and affect the bones directly"
 CORPSE_AWAKENING_PERK_EFFECT:0 "$same_o_higher_dharma_header$ You infuse corpses with Yin Chi, raising them as an undead and mindless servant."
 FORM_OF_INFERNAL_FAVOR_PERK_EFFECT:0 "$same_o_higher_dharma_header$ A refined form of the Ch'ing Shih that is even more horrifying and often possesses appendages like tentacles or spikes."
 
