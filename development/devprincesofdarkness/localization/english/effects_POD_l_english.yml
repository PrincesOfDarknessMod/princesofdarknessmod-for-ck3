 YOKE_THE_DEMON_PERK_EFFECT:0 "#Bold Unlock a po manipulation option.#!\nAllow you to pluck the P'o from the Hun, and subordinates the internal Demon. A Demon thus subordinated can be used to intimidate lesser creatures and watch for enemies."
 TWO_BECOME_ONE_PERK_EFFECT:0 "#Bold Unlock a po manipulation option.#!\nAllow you to temporaly fuse your Hun and P'o, giving you a taste of Enlightenment that can send you spiraling into depravity all the quicker."
 EVOCATION_OF_MADNESS_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nAllow your victim to give in to their P'o Nature for just a short while -- the briefest of moments, perhaps, but always long enough to warp the victim's mind."
 DEGRADATION_PERK_EFFECT:0 "#Bold Remove piety requirement of the Evocation of Madness [character_interaction|E].#!\nAllow you to force another cathayan into Shadow Soul, all the while forcing them to watch helplessly as their P'o runs rampart."
 STRENGTHENING_THE_DEMON_PERK_EFFECT:0 "#Bold Unlock a po manipulation option.#!\nYou briefly cultivate the darkness within yourself, the better to take advantage of the power of darkness."
 DARKLING_MIRROR_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nAllow you to split your P'o apart from your Hun and body for use as an evil servant."
 
 # Internalize #

 NO_MIND_PERK_EFFECT:0 "Allow you to purge your Hun from distracting thoughts, which increases the difficulties to Frenzy."
 BLOOD_YOGA_PERK_EFFECT:0 "#Bold Unlock the meditate in seclusion [decision|E] even if you don't have the necessary tenet, you just need to pay prestige. If you already have the necessary tenet, you will receive piety.#!\nBy performing ritualistic motions and katas, Wan-kuei can recollect Willpower more easily."
 DISTANT_DEATH_KATA_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name. Bonus chance to cause severe injury to an enemy knight in combat.#!\nBy slowly inhaling and exhaling while punching in the air, you may mystically transfer your punch on your target."
 IRON_SOUL_PERK_EFFECT:0 "Turns inner energies into strengthening your mind and body."
 HARMONY_WITH_THE_ALL_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nAllow you to cast your consciousness to the beginnings cosmic cycle, temporarily allowing you to draw upon the perfection of the First Age."
 REAPING_THE_DRAGONS_ROAD_PERK_EFFECT:0 "#Bold Allow you to not raise Wall level when you have the 'control dragon line' building by Osmosis.#!\nYou can take Chi straight from dragon lines and nests by sheer force of will."
 STEEL_SOUL_PERK_EFFECT:0 "A refinement of Iron Soul, it allows your near miraculous feats."
 ARMOR_OF_ENLIGHTENMENT_PERK_EFFECT:0 "#Bold Allow you to gain stress instead of taking a wound.#!\nYour wisdom and insight prevent your from taking physical harm from an opponent."
 HOLDING_THE_GREEN_DEMON_AT_BAY_PERK_EFFECT:0 "#Bold Allow you to not die by wounds.#!\nWith this power, you can force your soul to remain inside your body, even if you suffered lethal wounds."
 
