 PREDATORS_COMMUNION_PERK_EFFECT:0 "The Vampire is the greatest predator in his territory and senses whenever a potential ally or rival is nearby"
 INVOKING_THE_PREDATOR_PERK_EFFECT:0 "Sculpt the malleable darkness inside and push it outward to copy aspects of predatory animals."
 TAMING_THE_BEAST_PERK_EFFECT:0 "Tap into the beast to turn the power of your frenzy into a tool, improving your physical prowess in a number of ways while risking a full-blown frenzy."
 UNSEEN_HIBERNATION_PERK_EFFECT:0 "The Vampire makes his lair inside natural formations, plants, or earth by melting into the darkness hidden under their surface."
 WHISTLING_UP_THE_BEAST_PERK_EFFECT:0 "Use your mastery of the Beast to pull the Beast of others (or your own) to the forefront."
 POWER_FROM_DARKNESS_PERK_EFFECT:0 "Mortals and supernaturals alike cower in fear when they hear the roar of a vampire with this power."
 PREDATORS_TRANSFORMATION_PERK_EFFECT:0 "Assume the form of predators using the Shapechange [character_interaction|E]"
 STALKING_DARKNESS_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. A vampire who has mastered Abombwe is a predator through and through, stalking their foes through the darkness."
 PREDATORS_MASTERY_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Use your Beast to dominate other beasts; be they natural or supernatural, animal or man."
 INCARNATE_DARKNESS_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Become a mass of darkness, writhing and turning as it tries to emulate predators not known to man. Unlocks the Incarnate Darkness form"

