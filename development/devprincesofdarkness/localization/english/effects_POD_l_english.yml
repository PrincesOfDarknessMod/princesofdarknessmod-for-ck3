 # Black Wind #

 BLACK_WIND_PERK_EFFECT:0 "#F Allowing the rage of the P'o to channel itself through your body, you become inhumanly swift — a typhoon of destruction.#!"
 A_THOUSAND_CUTS_PERK_EFFECT:0 "Unlock [single_combat_duel|E] moves.\nBonus chance to maim an enemy knight in combat.\n#F This power allows you to focus your P'o so that you become a veritable whirlwind in combat. Your arms a blur; your feet are as fast as lightning; you can strike a target (or targets) so many times that there is almost no way for it to avoid the blows.#!"
 TREADING_THE_TIDE_DRAGONS_BACK_PERK_EFFECT:0 "#F Allow you to move with such speed that you can run across the surface of the water without falling in.#!"
 DIVINE_WHIRLWIND_PERK_EFFECT:0 "Bonus chance to kill an enemy knight in combat.\n#F Your very thoughts instantly become actions, allowing you to hit your target multiple times before they can even respond.#!"
 TRANSCENDING_PO_PERK_EFFECT:0 "#F You have learned how not to let darker aspects of your nature get the best of you. By soothing yourself with the calming energies of Yin Chi, you can keep a hold on your bestial side.#!"
 
 # Demon Shintai #

 DEMON_SHINTAI_PERK_EFFECT:0 "Unlock [single_combat_duel|E] moves.\nUnlock demonic feature shapeshift option.\n#F Gain one additional demonic feature as your level increases.#!"
 ADVANCED_DEMON_SHINTAI_PERK_EFFECT:0 "Unlock transform demonic feature shapeshift option that allows you to reset all features at the final level.\n#F Gain two additional demonic features as level increases.#!"
 
 # Qiao #

 CELESTIAL_PUNISHMENT_PERK_EFFECT:0 "Unlock Make Prayer [character_interaction|E].\nBonus chance to cause wounds to enemy knight in combat with [GetModifier('warning_prayer_modifier').GetNameWithTooltip].\n#F These prayers work as a warning to the shen. When they strike their target, they ignite, causing no physical damage but burning the P'o of the target. These paper prayers are as effective as thrown knives and resist even the strongest natural winds while on route to their target.#!"
 DIVINE_BINDINGS_PERK_EFFECT:0 "Bonus to Make Prayer [character_interaction|E].\nBonus chance to cause severe injuries to enemy knight in combat with [GetModifier('glowing_prayer_modifier').GetNameWithTooltip].\n#F When cast toward a shen target, these innocuous sheets of paper move against the wind and even circumvent obstacles to strike. Once the prayers hit the target, they glow with an eerie green energy and expand, becoming thicker and longer as they wrap themselves around the shen.#!"
 HEAVENLY_FLAMES_PERK_EFFECT:0 "Bonus to Make Prayer [character_interaction|E].\nBonus chance to cause severe injuries to enemy knight in combat with [GetModifier('bursing_prayer_modifier').GetNameWithTooltip].\n#F When this prayer strikes a target shen, it immediately bursts into bright-blue flames that cause aggravated damage. As with Divine Bindings, the prayer moves around obstacles to reach their target.#!"
 CELESTIAL_FIRES_PERK_EFFECT:0 "Bonus to Make Prayer [character_interaction|E].\nBonus chance to maul enemy knights in combat with [GetModifier('indenfensible_prayer_modifier').GetNameWithTooltip].\n#F Celestial Fires is identical to Heavenly Flames, with one exception: The damage may not be soaked without special defenses.#!"
 HEAVENS_THUNDER_PERK_EFFECT:0 "Bonus to Make Prayer [character_interaction|E].\nBonus chance to maul enemy knights in combat with [GetModifier('explosive_prayer_modifier').GetNameWithTooltip].\n#F This, the most powerful of the [GetTrait('shih').GetName( GetPlayer )]'s prayers, is virtually unstoppable once cast. As the prayers leave the [GetTrait('shih').GetName( GetPlayer )]'s hand, they glow fiercely and move with the speed of lightning toward their destination. When they strike the shen, they explode in balls of electrical fury capable of grievously wounding almost any demon.#!"
 STEEL_SKIN_PERK_EFFECT:0 "#F You increase your Stamina by use of this power.#!"
 DRAGONS_SPEED_PERK_EFFECT:0 "#F You increase your Dexterity by use of this power.#!"
 TIGERS_STRENGTH_PERK_EFFECT:0 "#F You use this ability to increase your Strength in preparation for combat.#!"
 CELESTIAL_EYES_PERK_EFFECT:0 "#F You increase your Perception using this level of the Mo Kung Qiao.#!"
 BODY_OF_THE_DRAGON_PERK_EFFECT:0 "#F You increase all of your Attributes to superhuman levels.#!"
 OPENED_EYES_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )] can see the shen for what they are. The [GetTrait('shih').GetName( GetPlayer )] can also ignore the effects of the Delirium.#!"
 DIVINE_PERCEPTIONS_PERK_EFFECT:0 "#F This power entitles the [GetTrait('shih').GetName( GetPlayer )] to view the spirit of another being, It works like a lie detector for the most part, but the [GetTrait('shih').GetName( GetPlayer )] can also see when a mortal or other entity is possessed by a demon.#!"
 WIND_TALK_PERK_EFFECT:0 "Unlock $POD_marked_for_return_interaction$ [character_interaction|E].\nUnlock $seek_aid_of_the_spirits_decision$ [decision|E].\n#F The [GetTrait('shih').GetName( GetPlayer )] employing this ability can listen to the denizens of the spirit realms and communicate with them. The shen are not, however, obligated to respond to any questions or demands the [GetTrait('shih').GetName( GetPlayer )] might make.#!"
 CELESTIAL_WINDOW_PERK_EFFECT:0 "Unlock $POD_bind_interaction$ [character_interaction|E].\n#F The [GetTrait('shih').GetName( GetPlayer )] employing this ability interacts on all levels with one denizen of the Yin or Yang Realm. For all intents and purposes, the chosen spirit is on the same level of existence as the [GetTrait('shih').GetName( GetPlayer )]. That spirit can be touched, hurt, helped or engaged in combat as if both the [GetTrait('shih').GetName( GetPlayer )] and the spirit were in the same place.#!"
 CELESTIAL_DOORWAY_PERK_EFFECT:0 "Unlock $POD_send_to_shadowland_character_interaction$ [character_interaction|E].\n#F The [GetTrait('shih').GetName( GetPlayer )] can actively interact with the spirit worlds; however, this course of action is not necessarily the wisest to take. While the character actually remains in the Middle Kingdom, he can see and affect the Yin and Yang Worlds around him. Although, the denizens of those realms can return the favor, and many of them aren't fond of the [GetTrait('shih').GetName( GetPlayer )].#!"
 BARRIER_OF_PAIN_PERK_EFFECT:0 "Unlock Chi Heal [character_interaction|E], allow heal scars.\n#F The [GetTrait('shih').GetName( GetPlayer )] can force herself to shut out pain at this level.#!"
 THE_CLOSING_WOUND_PERK_EFFECT:0 "Bonus to Chi Heal [character_interaction|E], allow to heal wounds.\n#F At this level, the [GetTrait('shih').GetName( GetPlayer )] is able to heal wounds. Bruised flesh loses its tenderness; wounds knit themselves back together and leave fresh scars.#!"
 SPIRITUAL_HEALING_PERK_EFFECT:0 "Bonus to Chi Heal [character_interaction|E], allow to heal physical defects.\n#F The [GetTrait('shih').GetName( GetPlayer )] can re knit bones and rebuild nerve tissue with this ability. This process is painful and often risky if used in a combat situation. The bones must be reset properly or the [GetTrait('shih').GetName( GetPlayer )] risks crippling herself permanently.#!"
 ESCAPE_FROM_DEATH_PERK_EFFECT:0 "Allow you to spend willpower instead of taking wounds.\nBonus to Chi Heal [character_interaction|E], allow heal illness or lesser physical disadvantages.\n#F The [GetTrait('shih').GetName( GetPlayer )] using this ability can regenerate even burs and other energy damage. While very useful, Escape from Death is also very costly.#!"
 FLAMES_OF_THE_PHOENIX_PERK_EFFECT:0 "Allow you to not be killed by wounds.\nBonus to Chi Heal [character_interaction|E], allow heal several new diseases or physical disadvantages.\n#F The character using this ability completely regenerates herself on a cellular level. This power can't bring a character back from the dead, but it reverses the effects of radiation poisoning, cancer, severe trauma and even old age.#!"
 THOUSAND_FISTS_PERK_EFFECT:0 "Bonus chance to cause wounds to enemy knights in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] focuses his Yang Chi and cuts loose with multiple punches. The strikes are superhuman-fast, often blurring in the air.#!"
 SPEAR_HAND_PERK_EFFECT:0 "Bonus chance to cause severe injuries to enemy knights in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] focuses his Yang Chi and ignites the energy around one hand. This energy ripples the air and burns intensely.#!"
 BURNING_GHOSTS_PERK_EFFECT:0 "Bonus chance to cause severe injuries to enemy knights in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] knight focuses his Chi, slowing him to combat wraiths and spirits of all types. His skin glows with a golden light, and Chi energies wrap around him. The [GetTrait('shih').GetName( GetPlayer )]'s body doesn't actually strike the spirits but the aura of power surrounding him does.#!"
 STEEL_BODY_PERK_EFFECT:0 "Bonus chance to maul enemy knights in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] focuses his Yin Chi, toughening his body and increasing his ability to inflict damage. Every muscle in the [GetTrait('shih').GetName( GetPlayer )]'s body tautens, and his skin becomes far more resilient,#!"
 THOUSAND_SWORDS_PERK_EFFECT:0 "Bonus chance to maul enemy knights in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] concentrates his Chi, then lashes out against his enemies in a furry of actions. Each strike opens wounds in his enemy, and the sound of the impacts is like that of metal striking metal.#!"
 FROZEN_RIVER_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )] uses her Yang Chi to build a protective barrier around her own life force, thus preventing the theft of her Chi.#!"
 STOLEN_SERPENT_PERK_EFFECT:0 "Bonus chance to cause severe injuries to enemy knights in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] can capture any ranged supernatural attack directed against him and then send it hurtling back at the opponent who cast it. This is a dangerous business, as the [GetTrait('shih').GetName( GetPlayer )] must demonstrate perfect timing in order to seize the mystical energies thrown at him.#!"
 CELESTIAL_BARRIER_PERK_EFFECT:0 "As a [character_interaction|E], allows you to make target suffer [GetModifier( 'celestial_barrier_modifier' ).GetNameWithTooltip|L].\n#F With this power, the [GetTrait('shih').GetName( GetPlayer )] temporarily blocks the shen's ability to take Chi from other sources.#!"
 CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT:0 "Unlock 'Steal Chi' [character_interaction|E].\n#F The [GetTrait('shih').GetName( GetPlayer )] using this ability is able to steal Chi from a shen. While stolen Chi is no longer available to the shen, neither can the [GetTrait('shih').GetName( GetPlayer )] use the stolen Chi.#!"
 BITE_OF_THE_MU_PERK_EFFECT:0 "Bonus to 'Steal Chi' [character_interaction|E].\nBonus chance to maul enemy knights in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] using this ability not only steals the Chi from a target shen, but also uses that Chi in an attack against the shen. This procedure is a very risky one, for it awakens the [GetTrait('shih').GetName( GetPlayer )]'s P'o.#!"
 EYES_OF_THE_DRAGON_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )] stares down an opponent. Intimidation is the key to avoiding combat successfully.#!"
 DARK_REFLECTION_PERK_EFFECT:0 "#F This power forces the enemies of the [GetTrait('shih').GetName( GetPlayer )] to realize the consequences of their actions. [GetTrait('shih').GetName( GetPlayer )] use this power when pronouncing judgment on a shen.#!"
 HUNTED_EYES_PERK_EFFECT:0 "#F This power works on Hungry Dead and Restless Dead alike. Staring into the eyes of an opponent, the [GetTrait('shih').GetName( GetPlayer )] forces the target to re experience any time spent in the Yomi World.#!"
 VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT:0 "Unlock $POD_command_wraith_interaction$ [character_interaction|E].\n#F A [GetTrait('shih').GetName( GetPlayer )] employing this power can command one spirit to accomplish one simple task.#!"
 DIVINE_ORDINANCE_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )] inspires overwhelming fear in all opponents within visual range.#!"
 
 BALANCE_OF_THE_SPIRIT_PERK_EFFECT:0 "Unlock 'Exorcism' [character_interaction|E], allow restore imbalance.\n#F The [GetTrait('shih').GetName( GetPlayer )] can discern the spiritual imbalances of Yin and Yang and attempt to restore proper order with this power.#!"
 FOCUS_OF_THE_MIND_PERK_EFFECT:0 "Bonus to 'Exorcism' [character_interaction|E], allow reduce stress.\n#F [GetTrait('shih').GetName( GetPlayer )] use a great deal of their Willpower fighting against shen. This power lets them regain their resolve and once again perform their sacred duties.#!"
 NIGHTMARE_EXORCISM_PERK_EFFECT:0 "Bonus to 'Exorcism' [character_interaction|E], allow remove negative stress traits.\n#F Many [GetTrait('shih').GetName( GetPlayer )] turn to drugs and alcohol in an effort to alleviate their mental anguish. [GetTrait('shih').GetName( GetPlayer )] using this power take a more direct approach by erasing the memory's emotional impact and, hopefully, removing the mental scars that memory creates.#!"
 SELF_EXORCISM_PERK_EFFECT:0 "Bonus to 'Exorcism' [character_interaction|E], allow remove negative mental traits.\n#F [GetTrait('shih').GetName( GetPlayer )], like all mortals, are subject to the risks of demonic possession. With this power, the demon hunter engages in psychic battle with a demon that has successfully managed to gain entry to her body, acquiring a second chance to expel the demon.#!"
 MENTAL_DOMINION_PERK_EFFECT:0 "Bonus to 'Exorcism' [character_interaction|E], allow reduce all stress.\n#F A [GetTrait('shih').GetName( GetPlayer )] using this power can fully restore her Willpower and actually weaken her P'o.#!"
 CLOUD_WALKING_PERK_EFFECT:0 "#F This power lets the [GetTrait('shih').GetName( GetPlayer )] move silently and without leaving a trail, even while running. The [GetTrait('shih').GetName( GetPlayer )] leaves behind no scent to indicate that he has ever been in the area.#!"
 WATER_TREADING_PERK_EFFECT:0 "#F With this power, the [GetTrait('shih').GetName( GetPlayer )] is able to travel over unstable surfaces, such as water or quicksand, and to use virtually any surface, even leaves on a tree, for the purpose of climbing.#!"
 WIND_STRIKE_PERK_EFFECT:0 "Bonus chance to cause severe injuries to enemy knights in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] uses an opponent's own momentum to throw an enemy incredible distances.#!"
 MOUNTAIN_STANCE_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )] absorbs the impact of an attack, redirecting the force into the ground.#!"
 CELESTIAL_WIND_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )] using this power focuses his Chi to stop a target from advancing and possibly even sends an opponent crashing backward.#!"

 HEAVENS_JUDGMENT_PERK_EFFECT:0 "Bonus to Make Prayer [character_interaction|E].\nBonus chance to kill an enemy knight in combat with [GetModifier('burn_out_prayer_modifier').GetNameWithTooltip].\n#F The prayers prepared by this Qiao literally burn Chi out of the body of the shen,returning that stolen lifeforce to the environment to enliven it.#!"
 DIVINE_PROHIBITION_PERK_EFFECT:0 "Bonus to Make Prayer [character_interaction|E].\nBonus chance to kill an enemy knight in combat with [GetModifier('cut_off_prayer_modifier').GetNameWithTooltip].\n#F This most powerful of I Shen techniques cuts a target off from outside sources of Chi.#!"
 TEN_OX_STRENGTH_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )] is capable of momentary feats of super-human strength.#!"
 DIAMOND_BODY_PERK_EFFECT:0 "#F A [GetTrait('shih').GetName( GetPlayer )] using this gift manifests tremendous capacity to shrug off damage.#!"
 SIGHT_WITHOUT_EYES_PERK_EFFECT:0 "#F Using this technique, a [GetTrait('shih').GetName( GetPlayer )] can see and detect without the use of physical senses, perceiving with spirit alone.#!"
 THE_EYE_OF_HEAVEN_PERK_EFFECT:0 "#F A [GetTrait('shih').GetName( GetPlayer )] with this level of mastery can see with the Eye of Heaven, perceiving any place.#!"
 THE_LIZARDS_TAIL_PERK_EFFECT:0 "Bonus to Chi Heal [character_interaction|E], allow healing of lost body parts.\n#F The [GetTrait('shih').GetName( GetPlayer )] can actually regenerate missing limbs or organs; basically any damage that does not result in death.#!"
 ASHES_OF_THE_PHOENIX_PERK_EFFECT:0 "Allow resurrection if you die by unnatural cause.\n#F [GetTrait('shih').GetName( GetPlayer )] with true mastery of the Bridge of the Phoenix can return from death.#!"
 HUNDRED_WARRIORS_STRIKE_PERK_EFFECT:0 "Bonus chance to kill an enemy knight in combat.\n#F Filled with furious Chi, the [GetTrait('shih').GetName( GetPlayer )] becomes a whirlwind of devastation.#!"
 HEAVEN_THUNDER_STRIKE_PERK_EFFECT:0 "Bonus chance to kill an enemy knight in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )] can concentrate Chi into a blow that can sunder steel or shake the ground with the force of an earthquake.#!"
 RIGHTEOUS_HUNGRY_SPIRIT_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )]'s soul is so empowered that any attempt to drain or steal his Chi not only fails automatically, but the hunter may steal Chi away from the attacker.#!"
 DEMON_EATING_TECHNIQUET_PERK_EFFECT:0 "Bonus chance to kill an enemy knight in combat.\n#F The [GetTrait('shih').GetName( GetPlayer )]'s close-combat attacks (armed an unarmed) against shen not only inflict harm but dissipate the target's Chi.#!"
 MANTLE_OF_HEAVEN_PERK_EFFECT:0 "#F Cloaked in the divine protection of Heaven, a demon hunter becomes a terrible foe in the eyes of shen.#!"
 DIVINE_MANDATE_PERK_EFFECT:0 "#F Speaking with the voice of Heaven, the [GetTrait('shih').GetName( GetPlayer )] can command any shen and expect obedience.#!"
 MOUNTAIN_MEDITATION_PERK_EFFECT:0 "#F [GetTrait('shih').GetName( GetPlayer )] using this master discipline achieve a degree of tranquility that makes them as unshakable as the roots of a mountain.#!"
 WALKING_IN_BALANCE_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )] is so perfectly balanced between Yin and Yang that she overcomes any outside attempt to disrupt her internal Chi balance.#!"
 ARROW_CUTTING_PERK_EFFECT:0 "#F The [GetTrait('shih').GetName( GetPlayer )]'s reflexes are superhumanly fast, capable of deflecting any ranged attack, even a hail of bullets.#!"
 WIND_RACING_PRANA_PERK_EFFECT:0 "#F Using this power, a [GetTrait('shih').GetName( GetPlayer )] can apply a momentary burst of superhuman speed.#!"
 
 # Meritocracy #
 
 MERITOCRACY_LEGACY_1_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor will be Strong and Athletic.\n\nMens sana in corpore sano."
 MERITOCRACY_LEGACY_2_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor will be a better Blademaster or Hunter.\n\nSi vis pacem, para bellum."
 MERITOCRACY_LEGACY_3_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor will have their Education quality increased by 1.\n\nScientia potentia est."
 MERITOCRACY_LEGACY_4_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor will have higher occurrence or quality of positive Congenital Traits.\n\nGenuflectant omnes in plano."
 MERITOCRACY_LEGACY_5_PERK_EFFECT:0 "In addition to the above effect, every new Inquisitor have a higher chance of possessing True Faith.\n\nBis orat qui bene cantat."
 
 # Unity #
 
 UNITY_LEGACY_1_PERK_EFFECT:0 "In addition to the above effect, you will have a better success chance when choosing the martial or stewardship approach in the Find Lair scheme.\n\nPacta clara, boni amici."
 UNITY_LEGACY_2_PERK_EFFECT:0 "In addition to the above effect, you will complete Find Lair schemes faster.\n\nConveniens homini est hominem servare voluptas."
 UNITY_LEGACY_3_PERK_EFFECT:0 "Beatius est magis dare quam accipere."
 UNITY_LEGACY_4_PERK_EFFECT:0 "In addition to the above effect, training new apprentices will be more effective.\n\nArtificem commendat opus."
 UNITY_LEGACY_5_PERK_EFFECT:0 "Nulla vis maior pietate vera est."
 
 #Servitude legacy #
 
 SERVITUDE_LEGACY_2_PERK_EFFECT:0 "Feudal obligation will be raised."
 
 #Aspiration legacy #
 
 ASPIRATION_LEGACY_2_PERK_EFFECT:0 "Feudal obligation will be lowered."
 ASPIRATION_LEGACY_5_PERK_EFFECT:0 "Higher chance of inheriting [disciplines|E]."
 
 #Ventrue legacy #
 
 VENTRUE_LEGACY_1_PERK_EFFECT:0 "Bonus to heavy infantry MaA, unlocks a special [character_interaction|E] to exchange hooks with other Ventrue.\nCamilla build the greatest Empire the [cainite|E] world has known or will ever know. [Clan|E] Ventrue truly started with him."
 VENTRUE_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe Spartan Goddess charged bravely against Carthage's horrors. [Clan|E] Ventrue will always honor her sacrifice."
 VENTRUE_LEGACY_3_PERK_EFFECT:0 "Unlocks a special [character_interaction|E] to enforce [masquerade|E].\nMedon's idiotic death taught a valuable lesson to the Ventrue. Don't underestimate mortals."
 VENTRUE_LEGACY_4_PERK_EFFECT:0 "Cultural fascination bonus and monthly piety bonus.\nThe explorer is never truly sated for the world is as endless as her wanderlust."
 VENTRUE_LEGACY_5_PERK_EFFECT:0 "Bonus to heavy cavalry MaA.\nThe Persian general ascended to godhood at the sounds of thundering cataphracts."
 
 #Setite legacy #
 
 SETITE_LEGACY_1_PERK_EFFECT:0 "Piety bonus and can recruit [GetMaA('snakes').GetName] as [men_at_arms|E].\nThe first son, the most devoted, is an exemplar for all Setites."
 SETITE_LEGACY_2_PERK_EFFECT:0 "Unlocks the Befriend scheme. You can use it for 7 maximum friends (up from 5).\nThere is no shame in eating the forbidden fruit in good company."
 SETITE_LEGACY_3_PERK_EFFECT:0 "Diplomacy bonus per prestige level.\nThere is always redemption in Set's embrace, even for the most stubborn 'Kindred'."
 SETITE_LEGACY_4_PERK_EFFECT:0 "Unlocks special [GetBuilding('founding_temple_01').GetName] building.\nBask in His glory and pray, for He will return to save us all."
 SETITE_LEGACY_5_PERK_EFFECT:0 "Makes the Seduce scheme more effective.\nThe lost daughter, the accursed, the Great Enemy... she will face retribution."
 
 #Baali legacy #
 
 BAALI_LEGACY_1_PERK_EFFECT:0 "Unlocks special MaA.\nAnd I looked, and behold a pale horse: and his name that sat upon him was Death and Hell followed with him."
 BAALI_LEGACY_2_PERK_EFFECT:0 "Dread bonus.\nAnd I saw when the lamb opened one of the seals, and I heard, as it were the noise of thunder, one of the four beasts saying, Come and see."
 BAALI_LEGACY_3_PERK_EFFECT:0 "+1 max hostile scheme.\nAnd I beheld, and lo a black horse; and he that sat on him had a pair of balances in his hand."
 BAALI_LEGACY_4_PERK_EFFECT:0 "MaA maintenance bonus.\nAnd I saw, and behold a white horse: and he that sat on him had a bow; and a crown was given unto him; and he went forth conquering and to conquer."
 BAALI_LEGACY_5_PERK_EFFECT:0 "Intimidated vassals contribution bonus.\nAnd there went out another horse that was red: and power was given to him that sat thereon to take peace from the earth, and that they should kill one another: and there was given unto him a great sword."
 
 #Gangrel legacy #
 
 GANGREL_LEGACY_1_PERK_EFFECT:0 "Unlocks special MaA, bonus to light infantry MaA.\nThe All-Father watches, proudly, as his children faces Ragnarok with bravery and honor."
 GANGREL_LEGACY_2_PERK_EFFECT:0 "Bonus to light cavalry MaA, Unlocks a special commander trait for every dynasty member with martial education.\nI ride with millions! I am the Scourge of God! And I will watch your world... burn."
 GANGREL_LEGACY_3_PERK_EFFECT:0 "Lowers new faith creation cost.\nThe bloody mother will have her revenge and the children of Caine will pay their debt tenfold."
 GANGREL_LEGACY_4_PERK_EFFECT:0 "Bonus to piety, unlocks a special [character_interaction|E] to challenge other characters to duels for hooks.\nAnd he wept, for there was no more worlds left to conquer."
 GANGREL_LEGACY_5_PERK_EFFECT:0 "Bonus to monthly control in counties.\nThe cornered beast safeguards her flock, and strikes back with fury and an undying purpose."
 
   #Ravnos legacy #
 
 RAVNOS_LEGACY_1_PERK_EFFECT:0 "House opinion bonus, unlocks special MaA.\nThe kind mother of the Rroma safeguards her people and gives them purpose."
 RAVNOS_LEGACY_2_PERK_EFFECT:0 "Bonus to heavy cavalry MaA, unlocks a special commander trait for every dynasty member with martial education.\nAn eternal war needs an eternal general. Chandraputra is that man."
 RAVNOS_LEGACY_3_PERK_EFFECT:0 "Learning bonus, unlocks special [character_interaction|E] to perform a ritual to gain wisdom.\nThe Rakshasa of Rakshasas cut off his eye to finally see."
 RAVNOS_LEGACY_4_PERK_EFFECT:0 "Prestige bonus.\nIf you live in Egypt, act like an Egyptian."
 RAVNOS_LEGACY_5_PERK_EFFECT:0 "Dread bonuses.\nThe accursed, the monster, the demon... the terror in each Ravnos' unbeating heart."
 
  #Cappadocian legacy #
 
 CAPPADOCIAN_LEGACY_1_PERK_EFFECT:0 "Learning per piety level bonus, unlocks a special [character_interaction|E] to send your childer as councilors to other rulers.\nThe faithful son hides his fears but prepare for the worst that will soon come."
 CAPPADOCIAN_LEGACY_2_PERK_EFFECT:0 "Unlocks special [character_interaction|E] to hire Lamia bodyguard.\nThe Dark Mother hides secrets that only her daughters could truly comprehend."
 CAPPADOCIAN_LEGACY_3_PERK_EFFECT:0 "Scheme resistance and power bonus.\nThe outcast and forgotten Cappadocian ruling branch will one day wear masks."
 CAPPADOCIAN_LEGACY_4_PERK_EFFECT:0 "Bonus to monthly income per stress level, stewardship bonus.\nByzantium was a city of dreams long before Constantine ever set foot in it."
 CAPPADOCIAN_LEGACY_5_PERK_EFFECT:0 "House opinion bonus.\nThe traitor son knows the truth, and unites the house against him with a purpose."
 
  #Brujah legacy #
 
 BRUJAH_LEGACY_1_PERK_EFFECT:0 "Reduced stress gains.\nThe King of Sparta is as unfeeling as the cold tip of his spear. Except when a particular Trojan is concerned."
 BRUJAH_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nHe almost saved Carthage from ruin. The Brujah remember his triumph, and mourn his defeat."
 BRUJAH_LEGACY_3_PERK_EFFECT:0 "Unlocks abduct scheme, bonus to abduct scheme, unlocks a special personal [character_interaction|E] to form a cadre of Brujah knights.\nThe noble outlaw will defeat tyrants and kings with sword, bow and wits."
 BRUJAH_LEGACY_4_PERK_EFFECT:0 "Build cost and monthly income bonus.\nTo truly understand the Byzantine bureaucratic system you need a Russian princess."
 BRUJAH_LEGACY_5_PERK_EFFECT:0 "Knight and prowess bonus.\nThe first traitor fought hard for her utopia but Carthage fell long before the Roman came."
 
  #Tzimisce legacy #
 
 TZIMISCE_LEGACY_1_PERK_EFFECT:0 "Unlocks special MaA.\nThe unliving has no concern for morality. You will serve."
 TZIMISCE_LEGACY_2_PERK_EFFECT:0 "Bonus to monthly income.\nThe noble of the night carry the dreaded legacy of the Tzimisce [Clan|E]."
 TZIMISCE_LEGACY_3_PERK_EFFECT:0 "Unlocks special MaA.\nHorrors and monsters come forth the flesh pits, ready to reclaim the Tzimisce's birthright."
 TZIMISCE_LEGACY_4_PERK_EFFECT:0 "Removes penalty to opinion for different faith.\nThe Holy Spirit has ascended, leaving only ruins in his wake."
 TZIMISCE_LEGACY_5_PERK_EFFECT:0 "Unlocks special [GetBuilding('sanctuary_of_flesh_01').GetName] building.\nYou who enter here... won't ever leave."
 
  #Tremere legacy #
 
 TREMERE_LEGACY_1_PERK_EFFECT:0 "Unlocks special MaA.\nWhen you war for your very survival, sacrifices must be made. Plenty of sacrifices."
 TREMERE_LEGACY_2_PERK_EFFECT:0 "Bonus to liege opinion.\nThe only woman to have earned the respect of Tremere is the very foundation of the Pyramid."
 TREMERE_LEGACY_3_PERK_EFFECT:0 "Bonus to house opinion.\nIn the Pyramid, you all have a purpose and a place. Below your betters."
 TREMERE_LEGACY_4_PERK_EFFECT:0 "Bonus to maximum MaA cap.\nShe loves her creations and they love her in return. The Pyramid will soon tremble."
 TREMERE_LEGACY_5_PERK_EFFECT:0 "Bonus to learning per piety level.\nLearning and wisdom are the often forgotten qualities that make a true Tremere magus."
 
  #Toreador legacy #
 
 TOREADOR_LEGACY_1_PERK_EFFECT:0 "Diplomacy bonus.\nArt and decadence are one and the same to some."
 TOREADOR_LEGACY_2_PERK_EFFECT:0 "Bonus to seduce scheme power.\nThe Trojan will have her revenge, even if the world has to burn beforehand."
 TOREADOR_LEGACY_3_PERK_EFFECT:0 "Bonus to same faith opinion.\nThe archangel lost his mind and the world lost his last hope. The Dark Ages will never end."
 TOREADOR_LEGACY_4_PERK_EFFECT:0 "Bonus to claim throne scheme.\nBeware the scorned woman, for her fury will never end."
 TOREADOR_LEGACY_5_PERK_EFFECT:0 "Bonus to intrigue per prestige level, unlocks a special [character_interaction|E] to spread false rumors about a target.\nThe most unlikely of heroes can be found in the most unlikely of places."
 
 #Salubri legacy #
 
 SALUBRI_LEGACY_1_PERK_EFFECT:0 "Hard enemy casualty bonus.\nHer vengeance is a terrifying sight but no fire burns forever."
 SALUBRI_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe Sword of the Salubri never knew defeat, even in death."
 SALUBRI_LEGACY_3_PERK_EFFECT:0 "Monthly piety bonus, unlocks caste system for your dynasty.\nShe will sing as the world burns around her. And perhaps will it be enough."
 SALUBRI_LEGACY_4_PERK_EFFECT:0 "Vassal opinion bonus.\nWise is the man that prepares for shelter when war is coming."
 SALUBRI_LEGACY_5_PERK_EFFECT:0 "60% Holy Wars cost reduction.\nThe traitor never faced justice and had the last laugh. A bitter victory for a broken man."
 
 #Lasombra legacy#
 
 LASOMBRA_LEGACY_1_PERK_EFFECT:0 "Intrigue bonus.\nThe shunned daughter plots her revenge. Against shadows she will use the ultimate fire."
 LASOMBRA_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe Shadow Reconquista will succeed, but its ultimate victor might not be the obvious one."
 LASOMBRA_LEGACY_3_PERK_EFFECT:0 "Faith conversion cost reduction.\nTruly, the Most Merciful transcends even death."
 LASOMBRA_LEGACY_4_PERK_EFFECT:0 "Intrigue bonus.\nPlotting for the sake of plotting is an art form in itself."
 LASOMBRA_LEGACY_5_PERK_EFFECT:0 "Faith creation and reformation cost reduction.\nConstantinople had its bitter revenge as Venice burns with her."
 
  #Banu Haqim legacy#
 
 BANUHAQIM_LEGACY_1_PERK_EFFECT:0 "Dread bonus.\nHidden behind a veil of secrecy, the Banu Haqim are feared far beyond their Middle Eastern borders."
 BANUHAQIM_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe Undefeated will rise to new heights. Even death won't stole his honor."
 BANUHAQIM_LEGACY_3_PERK_EFFECT:0 "Title creation cost reduction.\nBeing the Eldest doesn't mean much without the support of your peers."
 BANUHAQIM_LEGACY_4_PERK_EFFECT:0 "Light cavalry MaA bonuses.\nThe Carthaginian's traitor still wanders the night, a shame upon all true Banu Haqim."
 BANUHAQIM_LEGACY_5_PERK_EFFECT:0 "Different faith opinion bonuses.\nThe Black Shepherd will purge the Earth of the unworthy. This is the only salvation coming to this doomed world."
 
  #Malkavian legacy#
 
 MALKAVIAN_LEGACY_1_PERK_EFFECT:0 "House opinion bonus.\nProphets of doom are rarely welcome, but often right."
 MALKAVIAN_LEGACY_2_PERK_EFFECT:0 "Income per stress level bonus, unlocks a special personal [character_interaction|E] to 'borrow' skills.\nThe last true Malkavian Prince fought bravely against Carthage's horrors and earned the respect of all."
 MALKAVIAN_LEGACY_3_PERK_EFFECT:0 "Prestige bonus, unlocks a special [character_interaction|E] to reduce the scheme resistance of another ruler if they have any Malkavian courtier.\nAm I lying? Are you lying? IS THE WORLD LYING?!"
 MALKAVIAN_LEGACY_4_PERK_EFFECT:0 "Dread bonus.\nJust a nice, fancy, dinner with the heads of my courtiers."
 MALKAVIAN_LEGACY_5_PERK_EFFECT:0 "Learning per piety level bonus.\nIs selling your soul to evil bad when you didn't have a soul to begin with?"
 
  #Nosferatu legacy#
 
 NOSFERATU_LEGACY_1_PERK_EFFECT:0 "Allows to form alliances without marriage.\nThe proud monster stands tall against the horrors of the night, uplifting his [Clan|E] to greater heights."
 NOSFERATU_LEGACY_2_PERK_EFFECT:0 "Unlocks a special commander trait for every dynasty member with martial education.\nThe ancients of the Middle East were no match for Tarique's proven skills and undying faith."
 NOSFERATU_LEGACY_3_PERK_EFFECT:0 "Stewardship and domain limit bonus.\nDenmark was made by and for Absalon, and will be unmade by him."
 NOSFERATU_LEGACY_4_PERK_EFFECT:0 "Advantage bonus.\nFury and hatred make for poor advisors, but great fuel for the Beast."
 NOSFERATU_LEGACY_5_PERK_EFFECT:0 "Dread bonus.\nThe Little Grandmother is the only, terrifying, hope against even more dreadful horrors."

   #Caitiff legacy#
 
 CAITIFF_LEGACY_1_PERK_EFFECT:0 "Dynasty opinion bonus"
 CAITIFF_LEGACY_2_PERK_EFFECT:0 "Prowess and hostile scheme resistance bonus"
 CAITIFF_LEGACY_3_PERK_EFFECT:0 "Prestige and piety gain bonus"
 CAITIFF_LEGACY_4_PERK_EFFECT:0 "Unlocks Thinbloods MaA"
 CAITIFF_LEGACY_5_PERK_EFFECT:0 "Knight bonus, unlocks a special commander trait for every dynasty member with martial education"
 
