 # Jade Shintai #

 STAND_UPON_THE_DRAGONS_BACK_PERK_EFFECT:0 "#Bold Unlock duel moves.#!\nAllow you to channel Chi from the Earth’s natural flows into your body, and vice versa, rooting yourself to the Earth."
 TREAD_THE_THRASHING_DRAGONS_TAIL_PERK_EFFECT:0 "By polarizing your Chi in line with that of your surroundings, you makes yourself preternaturally deft and light. You may walk safely and steadily along the narrowest of ledges, the most unstable ground, and even the surface of lakes or oceans."
 PLACATE_THE_EARTH_DRAGON_PERK_EFFECT:0 "#Bold Enhance a spy option.#!\nBy gently singing to the spirits of earth, stone, and wood, you may cast yourself into their embrace."
 HARNESSING_THE_DRAGONS_BREATH_PERK_EFFECT:0 "By attuning your body to local streams of Chi, may actually fly along “updrafts” of energy. "
 JADE_SERVANT_OF_THE_AUGUST_PERSONAGE_PERK_EFFECT:0 "#Bold Unlock several shapeshift options.#!\nThe ultimate attuning of Chi to surroundings, this power draws upon the Five Element theory as well as great mastery of Chi. You may channel spiritual energies of the classic Five Elements — Metal, Wood, Water, Fire, and Earth — through your form, thus gaining the properties of the element in the process."
 STONE_FISH_PERK_EFFECT:0 "You learn to become one with the earth — literally. You can sink into it as effortlessly as a man walks into a pool of water."
 BLADE_OF_STONE_PERK_EFFECT:0 "Allow you to create weapons of stone — not just blades, but any sort of melee weapon."
 TASTE_OF_JADE_PERK_EFFECT:0 " Allow you to attune a piece of ordinary jade to Chi energies, turning it into a piece of true jade for a time."
 AUGMENT_PERK_EFFECT:0 "Allow you to attune yourself to the ambient Chi in an area, moreover actually to improve it and increase its power."
 
