 CELESTIAL_NEEDLE_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nYou can mend opened Chi Rifts and other gaps between the worlds."
 DRAGON_CHARIOT_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nYou can travel with several companions alongside a Dragon Line."
 CHI_CASTLE_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nYou can form a temporary Dragon Nest, thereby upsetting the spiritual balance and invoking the ire of spirits and other shen."
