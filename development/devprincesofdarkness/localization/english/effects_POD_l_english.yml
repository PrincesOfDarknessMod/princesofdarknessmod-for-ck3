 DEMON_SHINTAI_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves. Unlock demonic feature shapeshift option.#!\nGain one additional demonic feature as your level increases."
 ADVANCED_DEMON_SHINTAI_PERK_EFFECT:0 "#Bold Unlock transform demonic feature shapeshift option that allows you to reset all features at the final level.#!\nGain two additional demonic features as level increases."
 
