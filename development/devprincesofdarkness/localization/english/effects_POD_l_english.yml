 SOOTHING_THE_SOUL_PERK_EFFECT:0 "By caressing out inconsistencies and eddies in the Chi flow of a subject, you can make your target lethargic in inner peace, similar to the effects of the Kiss."
 ACCENTUATE_CHI_PERK_EFFECT:0 "You can cause the target to experience extreme swings in mood and energy. Yin-energies cause the victim to become languid, dull-minded, and slow, while Yang energies make the subject restless and agitated."
 OPENING_THE_GATES_PERK_EFFECT:0 "You can cause Chi to burn your target from the inside out"
 ADJUST_THE_TRUE_BALANCE_PERK_EFFECT:0 "#Bold Enhance the 'adjust balance' character interaction#!\nYou can create a permanent chi imbalance within your target. Alternatively, it can dispel lasting imbalances, and even cure illnesses like cancer within a mortal target."
 
