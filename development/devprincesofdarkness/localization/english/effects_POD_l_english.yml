 BODY_MEDING_TECHNIQUE_PERK_EFFECT:0 "Body-Mending Technique allows an immortal to heal damage caused by injury or sickness via ritualistic means."
 LINGERING_AID_OF_THE_CAREGIVER_PERK_EFFECT:0 "An immortal with this ritual can transfer enough energy to keep his patient healing at an accelerated rate even if he leaves her side."
 SEE_THE_LANDS_OF_THE_SPIRIT_PERK_EFFECT:0 "#Bold Gain access to the Yang World.#!\nWith this spell, the Wu T'ian can enter the Umbra."
 SENSE_LUCKS_FLOW_PERK_EFFECT:0 "#Bold [espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!#!\nA Wu T'ian with this spell can sense the fluctuations of joss, discerning the good or bad luck surrounding people, places, and events."
 SNAKE_FIST_STRIKE_PERK_EFFECT:0 "To counter the regenerative abilities of demons and other supernaturals, a Wu T'ian can use this spell to mystically quicken their strikes and transform their bodies into deadly weapons"
 SWEET_DREAMSS_CARESS_PERK_EFFECT:0 "Counteracting exhaustion with the uplifting vitality of pure Yang energy, Sweet Dream's Caress allows an immortal to banish his own or another's fatigue by lightly pressing his fingers on major acupuncture points."
 CALL_THE_SPIRITS_PERK_EFFECT:0 "This spell allows an immortal to summon elemental and nature spirits."
 DRUNKEN_MONKEY_DANCE_PERK_EFFECT:0 "Swaying and bobbing as though completely inebriated, a Wu T'ian under the effects of this spell somehow avoids fists, bullets, and other violence leveled against him with an ease that baffles and frustrates his opponents."
 LEAPING_TIGER_POUNCE_PERK_EFFECT:0 "Charging his muscles with energy, a Wu T'ian with this spell can leap amazing distances."
 SPIRIT_LANTERN_PERK_EFFECT:0 "With a gesture, a Wu T'ian with Spirit Lantern can form a ball of ghost-flame in the palm of his hand, illuminating his surroundings with soft golden light that frightens demons and other unclean beings."
 STORMWIND_PRANA_PERK_EFFECT:0 "Drawing on the principle of motion that embodies the essence of Yang, the Wu T'ian employ this family of spells to dramatically increase their speed."
 BIND_THE_DEMONS_SERVANT_PERK_EFFECT:0 "This spell allows an immortal to banish or bind lesser spirits and demons of the Yang Realms."
 ELEGANT_CRANE_DEFTNESS_PERK_EFFECT:0 "Buoyed by their yang Chi, Wu T'ian with this art become preternaturally light and agile, capable of balancing effortlessly on the narrowest ledges, running across unstable surfaces like water and quicksand or using the leaves of a tree to support their weight for climbing."
 OPENING_THE_THIED_EYE_PERK_EFFECT:0 "With this spell, a Wu T'ian can pierce the Veil and awaken mortals to the hidden world of the shen."
 THE_CLEARING_OF_THE_WAY_PERK_EFFECT:0 "#Bold Unlock Manipulate the Wall option in umbra panel.#!\nWith this spell, the Wu Feng can manipulate the Wall rating in his immediate surroundings."
 FLAME_HAND_STRIKE_PERK_EFFECT:0 "His hands wreathed in an aura of burning Chi, an immortal with this spell bathes his enemies in fire with every touch."
 MANTLE_OF_DIVINE_AUTHORITY_PERK_EFFECT:0 "Calling on the mandate of the August Personage of Jade and the faithful stewardship of the Eight Immortals, a Wu T'ian who dares to speak the celestial words of power at the core of this spell invokes the authority and righteous power of the Jade Throne."
 PLAGUE_CURING_METHOD_PERK_EFFECT:0 "With this spell, the Wu T'ian can transfer Yang energy into a patient's body after tending him for at least 15 minutes."
 TEN_PACES_STRIKE_PERK_EFFECT:0 "Bypassing the usual need for physical contact, a Wu T'ian with this spell can invisibly project the force of a single martial arts attack across an intervening distance by the power of his focused Chi."
 WALK_THE_BARRIERS_PERK_EFFECT:0 "Walk the Barriers allows an immortal to transfer his physical form into the Yang Realm."
 RESTORATION_OF_YOUTHS_VIGOR_PERK_EFFECT:0 "Masters of Feng Tan can perform the miracle of the rebirth of the phoenix to undo the ravages of time and renew the vitality of a mortal's youth."
 GENTLE_TYPHOONS_PASSING_PERK_EFFECT:0 "Invoked during combat, Gentle Typhoon's passing transforms a Feng Tan master into an eye of perfect calm at the heart of a furious whirlwind of fists."
 TRANSCENDANT_LIVING_FLAME_PERK_EFFECT:0 "With this last resort spell, the Wu T'ian can restore himself or an ally to full health, given that the situation is deemed desperate enough by Heaven."
 HUNDRED_SHADOW_CLOUD_PERK_EFFECT:0 "With this spell, a Wu T'ian can cause a thick cloud of spectral darkness to billow from his shadow like black fog."
 IRON_BODY_MEDITATION_PERK_EFFECT:0 "Iron Body Meditation allows a Wu T'ian to channel yin energy through his flesh, fortifying his body against injury by meditating for an hour."
 LESSER_SPIRIT_PROJECTION_PERK_EFFECT:0 "#Bold Gain acess to Yin World.#!\nWith this spell, the Wu T'ian can enter the Underworld."
 STILL_THE_FLUTTERING_WING_PERK_EFFECT:0 "Targets affected by Still the Fluttering Wing suffer brief paralysis and can do nothing until they have "burned" the spell's successes by declaring an equal number of actions."
 LUNGTAN_UNSEEN_PASSAGE_PERK_EFFECT:0 "By initiating this spell, the Xian Lung can affect his Arcane rating to remain anonymous and a near faceless person."
 THE_WAY_OF_THE_CALM_SOUL_PERK_EFFECT:0 "The Way of the Calm Soul allows a Wu T'ian to ease states of panic or anxiety (such as Frenzy) in one individual."
 EBON_BONDS_PERK_EFFECT:0 "With a word and a gesture, an immortal can conjure mystical black ribbons out of a target's own shadow to ensnare him in bonds as soft as silk and strong as steel."
 ICE_HAND_STRIKE_PERK_EFFECT:0 "Enveloping his hands in a blue nimbus of freezing yin, a Wu T'ian under the effects of this spell leaves behind numbing cold with every strike."
 KNOW_THE_WANDERING_SOUL_PERK_EFFECT:0 "With this Ritual, the Xian Lung can gain insight into even the strangest mortals, animals, and spirits."
 NO_MIND_KATA_PERK_EFFECT:0 "By clearing his mind and allowing the serenity of the Tao to wash over him, a Wu T'ian with this spell can exert his will to perform truly superhuman feats in a previously chosen area."
 BRAMBLES_ON_THE_ROAD_PERK_EFFECT:0 "#Bold Unlock Manipulate the Wall option in umbra panel.#!\nBy using this Ritual, the Xian Lung can raise the Shroud rating in his vicinity."
 GHOST_WALKING_METHOD_PERK_EFFECT:0 "When invoking this spell, the Xian Lung becomes undetectable for one chosen sense per success."
 PROJECTION_OF_INWARD_BEING_PERK_EFFECT:0 "With this spell, a Wu T'ian can unmask a concealed supernatural being by infusing a target's shadow with Chi so that it assumes the form of its owner's true self (Crinos form for Hengeyokai, Mien for Hsien etc.)."
 SHIELD_OF_FORTUNE_PERK_EFFECT:0 "The Xian Lung can wrap himself in joss, engendering bad luck in those who want him harm."
 BLUR_THE_MIND_PERK_EFFECT:0 "By invoking this spell, the Xian Lung can make his victim forget events that happened in its recent vicinity"
 PROTECT_AGAINST_THE_DEMON_PERK_EFFECT:0 "With this ritual, the Xian Lung can create wards that block demons and other servants of the Yama Kings from entering an area. "
 SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT:0 "With this ritual, the Xian Lung prepare for the Sixth Age."
 WHISPERING_STONES_PERK_EFFECT:0 "With this Ritual, the Xian Lung can record memories of the dead from the Tempest to translate documents in unknown-or extinct- languages."
 DEATH_TOUCH_PERK_EFFECT:0 "Reserved only for the most terrible demons, the legendary dim mak enables masters of Lung Tan to catastrophically disrupt the Chi flow of a single target, crippling or killing with but a touch."
 EYE_OF_THE_TEMPEST_PERK_EFFECT:0 "By meditating letting go of all fear and doubt, the Xian Lung's inner calm can even quell storms, or creating a protected "bubble" if the storm proves to fierce."
 TREAD_THE_DRAGON_TRACKS_PERK_EFFECT:0 "#Bold Unlock the [character_interaction|E] of the same name.#!\nWith this Ritual, the Xian Lung can attune his inner Chi to the flow of a nearby Dragon Line and travel to Dragon Nest in a manner of seconds after spending an hour meditating within a Dragon Nest or along a Dragon Line."
 GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT:0 "Recalling the majesty of the Wan Xian before their fall from grace, Godbody of the Celestial Emperor surrounds its caster in a nimbus of silvery light that illuminates the way before the Wu T'ian, induces a mind-state into mortals similar to the Fog and forces tainted supernaturals to flee."                                                                                                                                     

 #Abombwe

 PREDATORS_COMMUNION_PERK_EFFECT:0 "The Vampire is the greatest predator in his territory and senses whenever a potential ally or rival is nearby"
 INVOKING_THE_PREDATOR_PERK_EFFECT:0 "Sculpt the malleable darkness inside and push it outward to copy aspects of predatory animals."
 TAMING_THE_BEAST_PERK_EFFECT:0 "Tap into the beast to turn the power of your frenzy into a tool, improving your physical prowess in a number of ways while risking a full-blown frenzy."
 UNSEEN_HIBERNATION_PERK_EFFECT:0 "The Vampire makes his lair inside natural formations, plants, or earth by melting into the darkness hidden under their surface."
 WHISTLING_UP_THE_BEAST_PERK_EFFECT:0 "Use your mastery of the Beast to pull the Beast of others (or your own) to the forefront."
 POWER_FROM_DARKNESS_PERK_EFFECT:0 "Mortals and supernaturals alike cower in fear when they hear the roar of a vampire with this power."
 PREDATORS_TRANSFORMATION_PERK_EFFECT:0 "Assume the form of predators using the Shapechange [character_interaction|E]"
 STALKING_DARKNESS_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. A vampire who has mastered Abombwe is a predator through and through, stalking their foes through the darkness."
 PREDATORS_MASTERY_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Use your Beast to dominate other beasts; be they natural or supernatural, animal or man."
 INCARNATE_DARKNESS_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Become a mass of darkness, writhing and turning as it tries to emulate predators not known to man. Unlocks the Incarnate Darkness form"

