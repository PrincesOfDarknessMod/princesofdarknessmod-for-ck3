 YANG_SHIELD_PERK_EFFECT:0 "You form your Yang animus into a glowing aura around your body that protects you."
 YANG_PHOENIX_PERK_EFFECT:0 "Allow you to create scarlet flames of raw Yang energy that sear everyone near the user."
 TOUCH_OF_CORRUPTION_PERK_EFFECT:0 "Allow you to cause wood or any other organic material to quickly decay, refilling your own chi reservoirs."
 OAKEN_CORPSE_PERK_EFFECT:0 "#Bold Unlock a shapeshift option.#!\nAllow you to transform your very flesh into wood. In this form, your combat abilities rise as your fingers turn into deadly stakes and will float in water."
 
