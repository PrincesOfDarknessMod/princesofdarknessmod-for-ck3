 # Animalism # 
 
 ANIMAL_DOMINION_PERK_EFFECT:0 "'Wild dogs? Nay! Rats!' \n \nThe power the vampire holds over beasts is now great enough to command flocks and packs as if they were extensions of their own body. As a [character_interaction|E], you can spawn an army of animals." 
 ANIMAL_SUCCULENCE_PERK_EFFECT:0 "The vampire can slake additional Hunger by feeding on animals. As a [character_interaction|E], you can drain animals to better effect than other vampires."
 BOND_FAMULUS_PERK_EFFECT:0 "As a [character_interaction|E] you can [bind_famulus|E], Blood Bonding an animal and forming a mental link with it."
 DRAWING_OUT_THE_BEAST_PERK_EFFECT:0 "The vampire can project their Beast at the moment of frenzy, transferring it into a nearby subject, either mortal or vampire."
 FERAL_WHISPERS_PERK_EFFECT:0 "The vampire can commune with the beasts of the wild and the city, allowing the vampire to persuade animals into performing services for the, though, like humans, animals seldom agree to things that go against their nature or endanger them."
 QUELL_THE_BEAST_PERK_EFFECT:0 "By locking eyes with a target, the vampire cows their inner Beast into temporary slumber." 
 SENSE_THE_BEAST_PERK_EFFECT:0 "The vampire can sense the Beast present in mortals, vampires, and other supernaturals, gaining a sense of their nature, hunger, and hostility."
 SUBSUME_THE_SPIRIT_PERK_EFFECT:0 "The vampire can completely transfer its mind into the body of an animal. They can control the animal and use its senses freely, even during the day should they manage to stay awake."

 # Auspex # 
 
 CLAIRVOYANCE_PERK_EFFECT:0 "By closing their eyes and entering a light trance, the vampire becomes master of its surroundings."
 HEIGHTENED_SENSES_PERK_EFFECT:0 "The vampire's senses sharpen to a preternatural degree, giving them the ability to see in pitch darkness, hear ultrasonic frequencies and smell the fear of cowering prey. \n \nYou can escape from prison through a [decision|E]"
 PREMONITION_PERK_EFFECT:0 "The vampire experiences flashes of insight. These may take the form of raised hackles, sudden inspiration, or even vivid visions. While never too precise, these visions can nudge the vampire out of harm's way or reveal a truth previously overlooked. \n \n[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 SCRY_THE_SOUL_PERK_EFFECT:0 "By focusing on a person, the vampire can perceive the state of that person's psyche as a shifting aura of colors. Auras reveal little precise information but provide clues regarding many subjects, e.g., the emotional state, the resonance, and supernatural traits. \n \nYou can choose what type of resonance the mortals found via the Find Mortals [character_interaction|E] will have"
 SENSE_THE_UNSEEN_PERK_EFFECT:0 "The senses of the vampire become attuned to dimensions beyond the mundane, allowing them to sense presences otherwise hidden from the naked eye."
 SHARE_THE_SENSES_PERK_EFFECT:0 "By reaching out with their mind, the vampire can tap into the senses of another mortal or vampire, seeing, hearing, and feeling what they do."
 SPIRITS_TOUCH_PERK_EFFECT:0 "By touching an inanimate object or a ground, the vampire can sense emotional residues. Those who have handled that object or walked this path in the past leave hints for the skilled reader."
 TELEPATHY_PERK_EFFECT:0 "At the highest levels of Auspex, the vampire can now literally read minds, as well as project their own thoughts into the minds of others. \n \nYou can use the Telepathy [character_interaction|E] to find secrets."
 PSYCHIC_PROJECTION_EFFECT:0 "The Kindred with this ability projects her senses out of her physical shell, stepping from her body as an entity of pure thought. \n \nGain access to the Astral Plane during spiritual travels."
 
 # Blood Sorcery #

 INCORPOREAL_FORM_PERK_EFFECT:0 "Enable the use of [incorporeal_form|E]."
 CORROSIVE_VITAE_PERK:0 "You unlock a better option for the cover masquerade [character_interaction|E]."
 A_TASTE_OF_BLOOD_PERK:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"

 # Celerity # 
 BLINK_PERK_EFFECT:0 "Unlock a personal character interaction to vastly increase the movement speed of your army. At this stage, it's very costly.\n\n#flavor You now move so swiftly, engaging a foe or escaping in the blink of an eye, that to an unprepared observer you almost appear to teleport, a rush of wind the only sign of your passing.#!"
 CATS_GRACE_PERK_EFFECT:0 "\n\n#flavor You gain supernatural balance and grace, becoming able to walk and even across the slimmest of ledges and supports.#!"
 DRAUGHT_OF_ELEGANCE_PERK_EFFECT:0 "\n\n#flavor Your blood becomes saturated with the power of Celerity, conveying part of your power to anyone who drinks of it. As a [character_interaction|E], you can gift someone with your supernatural quickness.#!"
 FLEETNESS_PERK_EFFECT:0 "\n\n#flavor Your mastery of Celerity now allows you to move and react with dizzying speed.#!"
 LIGHTNING_STRIKE_PERK_EFFECT:0 "The Blink character interaction no longer gives you the Drained modifier.\n\n#flavor Faster than the eye can follow, you can strike with fist or melee weapon at such speed that your opponents are unable to defend themselves or take evasive action.#!"
 RAPID_REFLEXES_PERK_EFFECT:0 "\n\n#flavor While their bodies still can't defy the laws of nature, vampires with this power perceive events instantly and can react to them with superhuman alacrity.#!"
 SPLIT_SECOND_PERK_EFFECT:0 "The Blink character interaction no longer gives you stress.\n\n#flavor Acting with the speed of your supercharged perception, your ambushers find their prey already standing behind them, and favors asked are completed before the words leave the supplicants mouth.#!"
 TRAVERSAL_PERK_EFFECT:0 "\n\n#flavor With blurring speed, you can run or climb along any surface, including running up walls and even crossing liquid mediums.#!"

 # Dominate # 

 RATIONALIZE_PERK_EFFECT:0 "By convincing the victim he acted under his own volition, you unlock a new dominate command - start a scheme. You can also get more gold by using dominate commands."
 CLOUD_MEMORY_PERK:0 "You unlock choices to make people forget in specific events."
 MESMERIZE_PERK:0 "You unlock the abduct scheme. In addition, you will gain the ability to command others in various ways, opening the mesmerize scheme."
 THE_FORGETFUL_MIND_PERK:0 "You unlock a better option for the cover masquerade [character_interaction|E]. It also allows a [character_interaction|E] that can lead the victim to a specific derangement. Additionally, you can change a single personality trait of your herd and ghouls, and lock memories of your secrets in your opponents."
 SUBMERGED_DIRECTIVE_PERK:0 "You have better odds at recruiting agents for your murder schemes. Your dominate hooks also last longer, allowing you to issue commands at a later date."
 MASS_MANIPULATION_PERK:0 "Can recruit [GetMaA('maniacs').GetName] as [men_at_arms|E]."
 DEEP_MEMORIES_PERK:0 "You can now change all personality traits of your ghouls and herd"  
 CONDITIONING_PERK:0 "By dominating a person several times within 10 years and using a command to reduce free will, the vampire can eventually make them an ideal servant, giving a strong dominate hook that cannot be resisted. Can be maintained with further dominate commands."
 WILL_CONQUERS_PERK:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Your dominate commands become much harder to resist."
 TERMINAL_DECREE_PERK:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Adds a new dominate command: Attempt Suicide."
 REWRITE_PERSONALITY_PERK:0 "[elder_perk|E], only 3-6th generation vampires can buy this perk. You can turn a vampire into an exact copy of you mentally. Each time you use the power (found under the forgetful mind interaction), the target becomes a bit like you, from skills changing to personality traits and even other traits."
 CONCORD_OF_SUBMISSION_PERK:0 "[elder_perk|E], only 3-6th generation vampires can buy this perk. Add the dominate option: Stop War -  forces the target to cease hostility in white peace."
 MOLD_HUMOURS_PERK:0 "[elder_perk|E], only 3-5th generation vampires can buy this perk. Unlocks the ability to change the resonance of your herd"
 SPEAK_THROUGH_THE_BLOOD_PERK:0 "[elder_perk|E], only 3-4th generation vampires can buy this perk. Issue a command that will echo through your bloodline, affecting each and every one of your progeny and forcing them to action."
 
 # Fortitude # 

 DEFY_BANE_PERK_EFFECT:0 "By preparing themselves with an expenditure of power, the vampire can make themselves temporarily resistant to fire and sunlight as well as other grievous wounds that would threaten them with Final Death. When using Toughness, the vampire is immune to maiming during large battles."
 DRAUGHT_OF_ENDURANCE_PERK_EFFECT:0 "Your blood becomes saturated with the power of Fortitude, conveying part of your power to anyone who drinks of it. \n \nAs a [character_interaction|E], you can give your supernatural toughness to someone."
 FLESH_OF_MARBLE_PERK_EFFECT:0 "The power of the Blood causes the skin of the vampire to harden, taking on a marble-like sheen that is still supple but stops almost any blow before momentarily breaking and reforming."
 FORTIFY_THE_INNER_FACADE_PERK_EFFECT:0 "Instead of hardening the vampire's physical frame, this power allows the user to protect their thoughts and emotions from supernatural prying."
 PROWESS_FROM_PAIN_PERK_EFFECT:0 "Unlock a new Fortitude [character_interaction|E]. Injuries and impairments now only fuel the powers of the vampire, who grows stronger and faster from each blow, rend, or tear received." #Grants you a [character_interaction|E] to embrace the pain and use it to make yourself stronger.
 RESILIENCE_PERK_EFFECT:0 "Endowed with supernatural endurance, the user's physical resolve is strengthened."
 TOUGHNESS_PERK_EFFECT:0 "Unlock a new Fortitude [character_interaction|E]. All vampires with this power exhibit an innate ability to ignore the damage that would otherwise inconvenience and even disable others of their kind. With this perk, you will be able to soak injuries, using the blood to prevent yourself from being wounded."
 UNSWAYABLE_MIND_PERK_EFFECT:0 "The user gains a mystical ability to resist any attempts to sway them through mundane charms, coercion, and wiles."
 BLESSING_OF_VITALITY_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Confer more of your unnatural resilience with your draught of endurance, granting your chosen target the benefits of the toughness power while the draught lasts."
 KNIGHTS_BANE_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Grants a duel move to destroy your opponent's weapon with your bare flesh, dealing them damage in the process."
 CURSE_THE_LAUREL_PERK_EFFECT:0 "[elder_perk|E], only 3-6th generation vampires can buy this perk. Move a stake away from your heart, eventually removing it."
 WRATH_OF_THE_MARTYR_PERK_EFFECT:0 "[elder_perk|E], only 3-6th generation vampires can buy this perk. Improve the bonus from Prowess from Pain by increase the power you draw from pain." 
 ARMOURED_FLESH_PERK_EFFECT:0 "[elder_perk|E], only 3-5th generation vampires can buy this perk. This perk will allow you to soak what could have been a killing blow in some circumstances. Nothing short of a lethal strike will kill you. No amount of wounds will ever end your life, but only complete destruction or decapitation."
 RESILIENT_MIND_PERK_EFFECT:0 "[elder_perk|E], only 3-4th generation vampires can buy this perk. Unlock a new Fortitude [character_interaction|E]. Your mind sheds derangement and animalistic quirks while becoming resistant to mind-altering powers."
 
 # Obfuscate # 
 
 CLOAK_OF_SHADOWS_PERK_EFFECT:0 "Standing perfectly still, the user blends into the surroundings. As long as they have some cover, make no sound, and don't move, only mechanical or supernatural means can detect them."
 CLOAK_THE_GATHERING_PERK_EFFECT:0 "The vampire can shelter their companions under the cloak of Obfuscate."
 IMPOSTORS_GUISE_PERK_EFFECT:0 "With preparation, the vampire can make themselves appear as a specific individual of any build and gender. The user must carefully study the subject. Otherwise, the charade fails when meeting anyone with more than a casual familiarity with the person being mimicked."
 MASK_OF_THOUSAND_FACES_PERK_EFFECT:0 "Instead of disappearing, the vampire using this power can make themselves appear as a nondescript stranger: someone expected to be present in the area."
 SILENCE_OF_DEATH_PERK_EFFECT:0 "This power completely silences the user, nullifying all sound made by them. Unlike Obfuscate in general, this power works only on the sense of hearing, but in exchange, operates more robustly. A vampire needs to make a whole lot of noise to break this silence."
 UNSEEN_PASSAGE_PERK_EFFECT:0 "With this power, the vampire can now move around while staying hidden. [espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 VANISH_PERK_EFFECT:0 "The vampire appears to vanish in the blink of an eye; even the memory of them becomes foggy and indistinct."
 
 # Oblivion # 

 TENEBROUS_AVATAR_PERK_EFFECT:0 "As a [character_interaction|E], you can transform into shadows."
 SHADOW_CLOAK_PERK:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 OBLIVIONS_SIGHT_PERK:0 "As a [character_interaction|E], you can command wraith against other characters."
 TOUCH_OF_OBLIVION_PERK:0 "As a [character_interaction|E], you can bind wraiths."
 SHADOW_PERSPECTIVE_PERK:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 ASHES_TO_ASHES_PERK:0 "As a [character_interaction|E], you can try to destroy a [ghoul|E] from afar."
 
 # Necromancy # 
 
 INSIGHT_PERK_EFFECT:"If any of your relatives or friends are murdered in mysterious circumstances, you will know their murderers."
 SUMMON_SOUL_PERK_EFFECT:"As a [character_interaction|E], you can summon a character's soul when they died."
 LIFELESS_TONGUES_PERK_EFFECT:"As a [character_interaction|E], you can command wraith against other characters."
 COMPEL_SOUL_PERK_EFFECT:"As a [character_interaction|E], you can bind wraiths."
 EX_NIHILO_PERK_EFFECT:"Gain access to the Underworld during spiritual travels."
 SOUL_STEALING_PERK_EFFECT:"Unlock $EXECUTION_CONVERT_TO_WRAITH$ [executions|E] option."
 SHROUD_MASTERY_PERK_EFFECT:"Unlock Manipulate the Shroud option in umbra panel."
 SOUL_FEASTING_PERK_EFFECT:"Allow drain bound [GetTrait('wraith').GetName( GetPlayer )]."
 ZOMBIE_PERK_EFFECT:"[elder_perk|E], only 3-7th generation vampires can buy this perk. Can recruit [GetMaA('zombu').GetName] as [men_at_arms|E]."
 TORMENT_PERK_EFFECT:"[elder_perk|E], only 3-6th generation vampires can buy this perk. You can hurt [GetTrait('wraith').GetName( GetPlayer )] with physical move in [single_combat_duel|E]."
 SEVERING_THE_TIES_OF_DEATH_PERK_EFFECT:"[elder_perk|E], only 3-6th generation vampires can buy this perk. Max number of bound wraith: #P +5#!"
 NECROMANCY_SOUL_EXCHANGE_PERK_EFFECT:"[elder_perk|E], only 3-5th generation vampires can buy this perk. As a [character_interaction|E], you can exchange the personality traits of two character."
 NECROMANCY_POSSESSION_PERK_EFFECT:"[elder_perk|E], only 3-4th generation vampires can buy this perk. Target of marked for return now will start as a [GetTrait('risen').GetName( GetPlayer )] instead of only a lost soul."
 INUREMENT_PERK_EFFECT:"[elder_perk|E], only 3-4th generation vampires can buy this perk. You will now resurrect as a [GetTrait('wraith').GetName( GetPlayer )] when you die. Be warned that it will still disable most of your vampire powers and influence, weakening you a lot."

 # Potence # 
 
 BRUTAL_FEED_PERK_EFFECT:0 "Unlocks a duel move.\n\n#flavor In mere seconds, you swallow torrents of blood while mauling your victim. The result is efficient if messy. You can now use your new feeding method in the heat of battle and can disguise the mangled remains of the victim.#!"
 DRAUGHT_OF_MIGHT_PERK_EFFECT:0 "As a [character_interaction|E], you can gift someone with your supernatural strength.\n\n#flavor Your blood becomes saturated with the power of Potence, conveying part of your power to anyone who drinks of it.#!"
 EARTHSHOCK_PERK_EFFECT:0 "\n\n#flavor Your strength becomes an elemental force. You can slam your fist or foot into the ground, creating a shockwave that throws opponents prone and shatters buildings.#!"
 FISTS_OF_CAINE_PERK_EFFECT:0 "You gain an increased chance to severely wound enemy characters in battle.\n\n#flavor Your bare hands can inflict grievous injuries, lethal to both mortals and other vampires. They can dismember, pierce, impale, decapitate, and even rip a heart out of the chest.#!"
 LETHAL_BODY_PERK_EFFECT:0 "You gain an increased chance to wound enemy characters during a battle.\n\n#flavor Using this power, you are capable of causing horrendous damage, tearing the skin and breaking bones with bare hands.#!"
 PROWESS_PERK_EFFECT:0 "\n\n#flavor Vampires with Potence gain far greater strength from their Blood than those who lack it.#!"
 SOARING_LEAP_PERK_EFFECT:0 "\n\n#flavor Possessing unholy strength in more than arms and fists, you can leap far higher and further than any mortal.#!"
 UNCANNY_GRIP_PERK_EFFECT:0 "\n\n#flavor Focusing your unnatural strength into toes and fingers, your grip and burrow your extremities into almost any surface, enabling you to climb and even hang otherwise unsupported from walls and ceilings.#!"
 
 # Presence # 

 AWE_PERK_EFFECT:0 "Anyone in the presence of the vampire finds their attention inexplicably drawn to them. Those listening to the vampire speak might suddenly agree on subjects where they once held different viewpoints. \n \nUnlock the Befriend scheme."
 DAUNT_PERK_EFFECT:0 "Instead of attracting people, the vampire uses Presence to repel. With this power, the user appears threatening and exudes an aura of menace powerful enough to make most mortals avoid their attention and even vampires think twice about acting against them."
 DREAD_GAZE_PERK_EFFECT:0 "Briefly exposing their vampiric nature, the user instills a single subject with utter terror."
 ENTRANCEMENT_PERK_EFFECT:0 "The vampire focuses their unnatural allure on a single person, instilling in them a rapt fascination or infatuation akin to falling head over heels in love or meeting one's lifelong idol. \n \nEnables the [entrance_scheme|E]."
 LINGERING_KISS_PERK_EFFECT:0 "The Kiss of a vampire induces near-ecstasy in mortals, but this power leaves other Kisses in the dust. Mortals fed upon by the user become addicted to the Kiss, obsessing over it and even seeking the vampire out for repeated feedings. \n \nWhen you hunt, you can choose to add your victims to your Herd."
 MAJESTY_PERK_EFFECT:0 "At this pinnacle of the [discipline|E], the vampire can amplify their countenance to supernatural levels. To experience Majesty is to be in the presence of the divine - or the infernal. \n \nYou unlock a better option for the cover masquerade [character_interaction|E]."
 SUMMON_PERK_EFFECT:0 "The vampire can call to themselves any person, mortal or vampire, upon whom they've previously used Awe, Entrancement, or Majesty, or who has tasted their Blood at least once. \n \nEnables the [summon_scheme|E]."
 IRONCLAD_COMMAND_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Enhances previous Presence powers"
 COOPERATION_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. [peace|E] Acceptance: #P +[EmptyScope.ScriptValue('cooperation_value')|0]#!"
 PHOBIA_PERK_EFFECT:0 "[elder_perk|E], only 3-6th generation vampires can buy this perk. Unlocks [phobia|E] power."
 MASK_OF_EMPATHY_PERK_EFFECT:0 "[elder_perk|E], only 3-5th generation vampires can buy this perk. Unlocks [mask_of_empathy|E] power."
 BLOODLUST_PERK_EFFECT:0 "[elder_perk|E], only 3-5th generation vampires can buy this perk. Enhances [phobia|E] power."
 PERFECT_WORLD_PERK_EFFECT:0 "[elder_perk|E], only 3-4th generation vampires can buy this perk. Unlocks [perfect_world|E] power."
 
 # Protean #
 
 EARTH_MELD_PERK_EFFECT:0 "Becoming one with the soil, the vampire sinks into the earth. Unless in [torpor|E], the vampire rises again the following night."
 EYES_OF_THE_BEAST_PERK_EFFECT:0 "The vampire can will a supernatural red gleam into their eyes, giving them sight even in the total absence of light."
 FERAL_WEAPONS_PERK_EFFECT:0 "The vampire can extend their natural weapons to monstrous proportions. As a [character_interaction|E], you can grow your claws into deadly weapons."
 METAMORPHOSIS_PERK_EFFECT:0 "Your ability to assume the shape of an animal has grown. As a [character_interaction|E], you can now shapeshift into a bigger bestial form."
 MIST_FORM_PERK_EFFECT:0 "The vampire gains the legendary power to turn into a cloud of mist, perceivable to the eye but untouchable by anything save fire, sunlight, and supernatural aggression. As a [character_interaction|E], you can now shift into an elusive mist form."
 SHAPECHANGE_PERK_EFFECT:0 "The vampire can assume the shape of an animal, usually one associated with their [Clan|E] or the type of prey they most commonly hunt. As a [character_interaction|E], you can now shapeshift into a bestial form."
 THE_UNFETTERED_HEART_PERK_EFFECT:0 "Having mastered the power of Protean, the very insides of the user become malleable, almost viscous. The heart, seat of the vitae and unlife of the vampire, detaches and moves freely, if sluggishly, within the chest."
 WEIGHT_OF_THE_FEATHER_PERK_EFFECT:0 "The vampire can reduce their effective mass and density, making themselves almost weightless."

 # Vicissitude # 
 
 AWAKEN_THE_ZULO_SHAPE_PERK_EFFECT:0 "As a [character_interaction|E], you can now shapeshift into the fearsome Zulo form, an eight-foot-tall nightmare of scales and greasy fur, apelike arms tipped with jagged black nails, and a bristling row of spines tracing the length of its backbone."
 BLOODFORM_PERK_EFFECT:0 "Using advanced Vicissitude techniques, you instantly transform into a pool of sentient Vitae. As a [character_interaction|E], you can now shapeshift into the elusive blood form."
 MALLEABLE_VISAGE_PERK_EFFECT:0 "The user may alter their own body in simple, cosmetic ways. They can be taller or stockier. They can change their voice by reshaping their larynx or can adopt a new skin tone, new eye color, new hair, and so on. As a [character_interaction|E], you can now tweak your face or your ghouls'."
 REND_THE_OSSEOUS_FRAME_PERK_EFFECT:0 "At this stage of mastery, you have progressed to manipulating bone. Used on its own, Rend the Osseous Frame can inflict terrible damage upon a subject. When used in conjunction with Transmogrify the Mortal Clay, nightmares become possible."
 THE_BODY_IMPOLITIC_PERK_EFFECT:0 "Arguably the most ghoulish of Vicissitude's gifts, The Body Impolitic allows the user to invest a portion of their sentience in the flesh of their body. They can then sever it from the trunk to do its bidding. [espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 TRANSMOGRIFY_THE_MORTAL_CLAY_PERK_EFFECT:0 "You may perform dramatic alterations, and not just upon yourself, but upon any subject, you can subdue long enough to impart your vision. Can recruit [GetMaA('szlachta').GetName] as [men_at_arms|E]."
 CHIROPTERAN_FORM_PERK_EFFECT:0 "If you are of the 7th generation or lower, you now have access to a new shapeshift option, the Chiropteran form."
 DRACUL_FORM_PERK_EFFECT:0 "If you are of the 4th generation or lower, you now have access to a new shapeshift option, the Dracul form."
 
 # Obtenebration #
 
 EYES_OF_THE_ABYSS_PERK_EFFECT:0 "Unlocks [abyss_eyes|E] power."
 SHADOW_PLAY_PERK_EFFECT:0 "While this ability does not allow characters to create shadows that do not already exist, it allows one to manipulate, move, and animate ambient shadows. This can grant social effects, such as using shadows to make yourself more imposing, or shape an environment to suit your needs, creating areas of shadow in which to hide a person or object."
 NOCTURNE_PERK_EFFECT:0 "Unlocks [nocturne|E] power. Reduces the prowess of enemies by 2."
 NIGHT_SHADES_PERK_EFFECT:0 "Can recruit [GetMaA('shades').GetName] as [men_at_arms|E]"
 ARMS_OF_AHRIMAN_PERK_EFFECT:0 "With this ability, a Lasombra shapes the darkness into tentacles that can attack, restrain, and grapple foes."
 TENEBROUS_AVATAR_OBTENEBRATION_PERK_EFFECT:0 "Unlocks [tenebrous_avatar|E] power."
 THE_DARKNESS_WITHIN_PERK_EFFECT:0 "Enhances [nocturne|E] power. Reduces the prowess of enemies by a total of 3."
 OUBLIETTE_PERK_EFFECT:0 "Unlocks [GetScheme('abduct').GetTypeName] [scheme|E]"
 WALK_THE_ABYSS_PERK_EFFECT:0 "By traversing the Abyss, this ability allows a character to enter a patch of darkness and emerge from a second patch of darkness within eyesight. Characters may also use this ability to extend their reach into a shadow and grasp something within reach of a second shadow."
 DRAIN_THE_LIFE_PERK_EFFECT:0 "Unlocks [drain_the_life|E] power."
 DARK_WHISPERS_PERK_EFFECT:0 "With this ability, a character can use nearby shadows to project her feelings into."
 GOD_IN_DARKNESS_PERK_EFFECT:0 "Enhances [tenebrous_avatar|E] power."
 DARKSIGHT_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Enhances [abyss_eyes|E] power."
 SHADOWSTEP_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. The vampire disappears into shadow, skating across the Labyrinth to reemerge after travelling across something fouler than death and twice as hungry. They step into a shadow large enough to cover them, and reemerge from one they can see."
 SHADOW_TWIN_PERK_EFFECT:0 "[elder_perk|E], only 3-6th generation vampires can buy this perk. Unlocks [shadow_twin|E] power."
 AEGIS_OF_SHADOWS_PERK_EFFECT:0 "[elder_perk|E], only 3-5th generation vampires can buy this perk. Cover yourself in powerful shadow armor."
 DEVOUR_ALL_HOPE_PERK_EFFECT:0 "[elder_perk|E], only 3-5th generation vampires can buy this perk. Enhances [nocturne|E] power even further. Reduces the prowess of enemies by a total of 5."
 AHRIMANS_DEMESNE_PERK_EFFECT:0 "[elder_perk|E], only 3-4th generation vampires can buy this perk. Enhances [drain_the_life|E] power. Now it can affect whole realms, no matter the size."
 
 # Serpentis
 
 ENCHANTING_GAZE_PERK_EFFECT:0 "This power makes the vampire the proverbial flame to a moth. She takes on an alluring, enchanting feature, such as a serpent’s gold eyes or a pearlescent sheen to her skin. She can paralyze with a glance, and mortals in her vicinity find themselves drawn to her."
 SERPENTS_FLESH_PERK_EFFECT:0 "Unlocks [serpents_flesh|E] power."
 TYPHONIC_MAW_PERK_EFFECT:0 "The vampire’s jaw becomes a ferocious, malleable thing she can control in a variety of ways. Her jaw distends to her chest, her fangs grow to the size of small daggers, her tongue forks at the tip and lashes out a meter long, and her throat expands to consume anything she can get her mouth around."
 MASTER_OF_SNAKES_PERK_EFFECT:0 "Can recruit [GetMaA('snakes').GetName] as [men_at_arms|E]."
 SMOOTH_SCALES_PERK_EFFECT:0 "Enhances [serpents_flesh|E] power."
 FORM_OF_THE_SNAKE_PERK_EFFECT:0 "Allows you to transform into a large serpent and small snake under shapeshift personal [character_interaction|E]."
 TYPHONIC_AVATAR_PERK_EFFECT:0 "Unlocks [typhonic_avatar|E] power."
 SERPENT_EYES_PERK_EFFECT:0 "Unlocks [serpent_eyes|E] power."
 MOTHER_OF_MONSTERS_PERK_EFFECT:0 "Can recruit [GetMaA('serpentis_monsters').GetName] as [men_at_arms|E]."
 FORM_OF_THE_STORM_PERK_EFFECT:0 "Enhances [typhonic_avatar|E] power."
 ECHIDNAS_VENOM_PERK_EFFECT:0 "At this level, the vampire’s bite becomes venomous as a death adder."
 THE_HEART_OF_DARKNESS_PERK_EFFECT:0 "Unlocks [heart_of_darkness|E] power."
 COBRA_FANGS_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. The vampire's fangs become venomous."
 APOPHIS_PERK_EFFECT:0 "[elder_perk|E], only 3-7th generation vampires can buy this perk. Further enhances [typhonic_avatar|E] power."
 HEART_THIEF_PERK_EFFECT:0 "[elder_perk|E], only 3-6th generation vampires can buy this perk. Enhances [heart_of_darkness|E] power, allowing to steal hearts from other characters as a scheme or from prisoners as a simple [character_interaction|E]. It you have someone's heart, it is easy to kill them or to force them into torpor."
 TEMPTATION_PERK_EFFECT:0 "[elder_perk|E], only  3-5th generation vampires can buy this perk. The vampire becomes extremely hard to resist."
 BREATH_OF_THE_BASILISK_PERK_EFFECT:0 "[elder_perk|E], only 3-5th generation vampires can buy this perk. The vampire can exhale poisoning and corrosive mist."
 GODHEAD_PERK_EFFECT:0 "[elder_perk|E], only 3-4th generation vampires can buy this perk. Unlocks [godhead|E] power."
 
 # Faith #
 
 PATRIS_NOT_PRIMARY_TEXT:0 "Sophia Patris is the primary path of lay orders, complete your order's primary path or find True Faith to unlock it."
 FILIUS_NOT_PRIMARY_TEXT:0 "Sedulitas Filius is the primary path of knightly orders, complete your order's primary path or find True Faith to unlock it."
 SPIRITUS_NOT_PRIMARY_TEXT:0 "Boni Spiritus is the primary path of monastic orders, complete your order's primary path or find True Faith to unlock it."
 SHADOW_INQUISITION_ONLY_TEXT:0 "Holy Arts are developed and used exclusively by the agents of the Shadow Inquisition."
 
 DOMINUS_VOBISCUM_PERK_EFFECT:0 "As a [character_interaction|E], you can bless another character for a temporary stat boost."
 INTERCESSION_PERK_EFFECT:0 "As a [character_interaction|E], you can give piety to another character with a small chance of granting him the True Faith trait."
 HOLY_BULWARK_PERK_EFFECT:0 "You are now immune to mind powers of any sort."
 LAY_OF_HANDS_PERK_EFFECT:0 "As a [character_interaction|E], you can now heal yourself of most ailments."
 PENANCE_PERK_EFFECT:0 "As a [character_interaction|E], you can curse a vampire, reducing their stats."
 CONVERSION_PERK_EFFECT:0 "As a [decision|E], you can instantly convert your realm to your religion, for a hefty piety cost."
 
 PRY_OPEN_PERK_EFFECT: "Bear witness to the target's thoughts and desires. Helps building a connection."
 UNWAVERING_VISION_PERK_EFFECT: "Discover the target's contacts among mortal men allowing you to cripple their influence."
 UNEARTH_PERK_EFFECT:0 "Reveal events that took place in a given spot; useful for tracking escaping targets. (Increased chance of taking prisoners in a siege)"
 LIFTING_THE_VEIL_PERK_EFFECT:0 "Render the target's attempts at deception futile leading to a fruitful interrogation."
 REVELATION_PERK_EFFECT: "Expose the foul nature of the target to the Flock and leave it subjected to their judgement."
 
 SUNDER_PERK_EFFECT:0 "This power gives a weapon an energy of its own, allowing it to strike with holy vengeance anything it touches."
