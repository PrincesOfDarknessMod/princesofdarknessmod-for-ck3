 # Ghost-Flame Shintai #

 GOBLIN_FACE_PERK_EFFECT:0 "#Bold Unlock a shapeshift option.#!\nOrifices in your face begin to blaze with heat, allowing you to see in pitch darkness and inflicting greater damage with your bite."
 GOBLIN_SPARK_PERK_EFFECT:0 "Allow you to summon a tiny ball of spirit fire that cannot actually harm anything , but emits a soft light and can be twisted into various shapes according to its creator's wishes."
 GOBLIN_SHAPES_PERK_EFFECT:0 "Allow you to twist flames into various forms according to your desires."
 GOBLIN_SCORCH_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves. Chance to maul an enemy knight in combat.#!\nAllow you to exhale a gout of spirit flames."
 GOBLIN_LANTERN_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves. Unlock a shapeshift option. Chance to maul an enemy knight in combat.#!\nAllow you to temporarily ignite your form, even allowing you to turn into a glowing orb of fire."
 GOBLIN_SWORD_PERK_EFFECT:0 "#Bold Chance to maim an enemy knight in combat.#!\nAllow you to manifest a fiery sword within your hand that can harm both physical as well as spiritual objects."
 GOBLIN_PORTAL_PERK_EFFECT:0 "Allow you to use fire as a gateway to teleport to any other flame within a certain radius."
 GOBLIN_CALL_PERK_EFFECT:0 "#Bold Add more chance of calming a local spirit in the '$POD_calm_local_spirit_interaction$' [character_interaction|E].#!\nAllow you to call spirits of fire from either the Yin or the Yang Worlds to do your biding."
 MANTLE_OF_THE_FLAME_EMPEROR_PERK_EFFECT:0 "#Bold Chance to kill an enemy knight in combat.#!\nWith a brief command, you can cause another person to burn from the inside out by consuming their internal chi."
 
 # Jade Shintai #

 STAND_UPON_THE_DRAGONS_BACK_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves.#!\nAllow you to channel Chi from the Earth’s natural flows into your body, and vice versa, rooting yourself to the Earth."
 TREAD_THE_THRASHING_DRAGONS_TAIL_PERK_EFFECT:0 "By polarizing your Chi in line with that of your surroundings, you makes yourself preternaturally deft and light. You may walk safely and steadily along the narrowest of ledges, the most unstable ground, and even the surface of lakes or oceans."
 PLACATE_THE_EARTH_DRAGON_PERK_EFFECT:0 "#Bold Bonus to a spy option.#!\nBy gently singing to the spirits of earth, stone, and wood, you may cast yourself into their embrace."
 HARNESSING_THE_DRAGONS_BREATH_PERK_EFFECT:0 "By attuning your body to local streams of Chi, may actually fly along “updrafts” of energy. "
 JADE_SERVANT_OF_THE_AUGUST_PERSONAGE_PERK_EFFECT:0 "#Bold Unlock several shapeshift options.#!\nThe ultimate attuning of Chi to surroundings, this power draws upon the Five Element theory as well as great mastery of Chi. You may channel spiritual energies of the classic Five Elements — Metal, Wood, Water, Fire, and Earth — through your form, thus gaining the properties of the element in the process."
 STONE_FISH_PERK_EFFECT:0 "You learn to become one with the earth — literally. You can sink into it as effortlessly as a man walks into a pool of water."
 BLADE_OF_STONE_PERK_EFFECT:0 "#Bold Chance to maim an enemy knight in combat.#!\nAllow you to create weapons of stone — not just blades, but any sort of melee weapon."
 TASTE_OF_JADE_PERK_EFFECT:0 " Allow you to attune a piece of ordinary jade to Chi energies, turning it into a piece of true jade for a time."
 AUGMENT_PERK_EFFECT:0 "Allow you to attune yourself to the ambient Chi in an area, moreover actually to improve it and increase its power."
 
 # Yin Prana #

 SHROUDED_MOON_PERK_EFFECT:0 "#Bold Unlock a shapeshift option.#!\nAllow you to turn invisible by cladding yourself in shadows."
 YIN_MANTLE_PERK_EFFECT:0 "Allow you to channel your internal Yin energy into an animus that shrouds you. This animus, or mantle, is invisible to mortals, but it feels to them like a cold breeze in the air."
 BONE_DANCE_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves. More chance to cause a severe injury to an enemy knight in combat.#!\nBy performing a series of complicated and painful postures, you can channel Yin energy in an area, turning everyone within lethargic."
 EIGHTFOLD_YIN_MANTLE_PERK_EFFECT:0 "Like the initial Yin Mantle, only that the Yin energy manifests as a crackling black aura of Yin energy that can be shaped according to the user's wishes."
 SEMBLANCE_OF_THE_EBON_DRAGON_PERK_EFFECT:0 "#Bold Unlock a shapeshift option. No longer need to pay gold to access the Yin World during spiritual travels.#!\nAllow you to become insubstantial as your body mass shifts into the Yin World."
 YIN_SHIELD_PERK_EFFECT:0 "You form your Yin animus into a protective carapace around your body."
 YIN_NIHILUS_PERK_EFFECT:0 "#Bold Chance to maim an enemy knight in combat.#!\nAllow you to create a deadly halo of Yin energy that sears everyone near to the user."
 TOUCH_OF_RUST_PERK_EFFECT:0 "#Bold Bonus chance to kill an enemy knight in combat.#!\nYou can cause metal of any kind to quickly crumble down."
 IRON_CORPSE_PERK_EFFECT:0 "#Bold Unlock a shapeshift option.#!\nAllow you to transform your very flesh into metal. In this form, your combat abilities rise as your fingers turn into razor claws, but on the downside, you becomes unable to swim."
 
