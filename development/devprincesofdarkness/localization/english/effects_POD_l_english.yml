 DRAGON_DANCE_PERK_EFFECT:0 "#Bold Unlock [single_combat_duel|E] moves. Bonus chance to cause a severe injury to an enemy knight in combat.#!\nThrough a series of wild leaps, acrobatic katas, and yogic posturings, enters a battle trance. Capable of impressive combat feats while in this state."
