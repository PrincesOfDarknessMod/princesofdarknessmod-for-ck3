 stress_threshold.2331.t:0 "Нервный срыв: властитель отстраняется"
 stress_threshold.2331.desc.intro:0 "В последнее время мои придворные, кажется, избегают меня любой ценой. По шепоткам я понимаю, что "
 stress_threshold.2331.desc.calm:0 "они нервничают из-за моего спокойствия и считают его холодностью"
 stress_threshold.2331.desc.brave:0 "мою храбрость принимают за кровожадность"
 stress_threshold.2331.desc.ambitious:0 "они думают, будто я не остановлюсь ни перед чем в погоне за амбициями, что для меня нет ничего святого"
 stress_threshold.2331.desc.just:0 "они считают мое правление слишком суровым и поговаривают, что я слишком придерживаюсь буквы закона, а не духа"
 stress_threshold.2331.desc.callous:0 "они говорят, что у меня нет сердца, что мне наплевать на всех, кроме себя"
 stress_threshold.2331.desc.stubborn:0 "они считают меня слишком [Select_CString(ROOT.Char.IsFemale, 'упрямой, негибкой, неспособной', 'упрямым, негибким, неспособным' )] на компромисс"
 stress_threshold.2331.desc.fallback:0 "они считают меня слишком [Select_CString(ROOT.Char.IsFemale, 'равнодушной, слишком отчужденной', 'равнодушным, слишком отчужденным' )]"
 stress_threshold.2331.desc.rump:0 ", но это лишь значит, что я правлю твердой рукой. Это не значит, что я чудовище.\n\n... Ведь так?"
 stress_threshold.2331.a.reclusive.gain:0 "Я тоже не хочу #EMP их#! видеть!"
 stress_threshold.2331.a.reclusive.effect:0 "$stress_threshold.2331.a.reclusive.gain$"
 stress_threshold.2331.a.reclusive.opinion_list:0 "Ваши [Concept( 'courtiers', 'придворные' )|E] изгнаны"
 stress_threshold.2331.b.irritable.gain:0 "Проклятые неблагодарные скоты!"
 stress_threshold.2331.b.irritable.effect:0 "$stress_threshold.2331.b.irritable.gain$"
 stress_threshold.2331.c.profligate.gain:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.2331.c.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.2331.d.improvident.gain:0 "Золото и серебро купят мне их любовь!"
 stress_threshold.2331.d.improvident.effect:0 "$stress_threshold.2331.d.improvident.gain$"
 stress_threshold.2331.e.journaller.gain:0 "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.2331.e.journaller.effect:0 "$stress_threshold.1711.e.journaller.gain$"
