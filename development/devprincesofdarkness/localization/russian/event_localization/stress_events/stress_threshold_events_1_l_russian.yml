 stress_threshold.3411.t:0 "Нервный срыв: я [Select_CString(ROOT.Char.IsFemale, 'недостойна', 'недостоин' )]"
 stress_threshold.3411.desc.intro:0 "Я не могу этого сделать. Просто не могу. [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L]... нет, ни минутой дольше! Как вообще можно #EMP справиться#! с таким напряжением? Неважно,"
 stress_threshold.3411.desc.generous:0 "сколько я отдаю, сколь щедро поступаю со своими подданными, — кто-то все равно прозябает в бедности, кто-то все равно будет меня ненавидеть."
 stress_threshold.3411.desc.diligent:0 "сколь усердно я работаю, сколько бессонных ночей провожу за работой, — беды державы лишь множатся."
 stress_threshold.3411.desc.patient:0 "сколь терпеливо я выслушиваю беды просителей, — я просто не могу дать им хороших решений."
 stress_threshold.3411.desc.humble:0 "сколь редко я позволяю своей гордыне вставать на пути долга, — я чувствую, что мое высокомерие заживо пожирает меня."
 stress_threshold.3411.desc.shy:0 "сколько сил я трачу на поддержание двора, — вид собравшихся придворных ввергает меня в ужас."
 stress_threshold.3411.desc.just:0 "насколько справедливы мои решения, с каким пылом я следую закону, — преступность все равно расползается по всем уголкам моей державы."
 stress_threshold.3411.desc.trusting:0 "как часто я прощаю людей, делаю им одолжения или позволяю им сомневаться, — постоянно происходит нечто чудовищное."
 stress_threshold.3411.desc.compassionate:0 "как часто я пытаюсь собирать двор и выслушивать простолюдинов, — снаружи сотни других всегда ждут моей помощи."
 stress_threshold.3411.desc.forgiving:0 "$stress_threshold.3411.desc.trusting$"
 stress_threshold.3411.desc.fallback:0 "сколько усилий я прилагаю, — я все делаю неправильно, а все мои достижения рассыпаются в прах у меня в руках."
 stress_threshold.3411.desc.rump:0 "\n\nОчевидно, что я #EMP никогда#! не стану [Select_CString(ROOT.Char.IsFemale, 'достойной', 'достойным' )] власти. Чем-то #EMP придется#! пожертвовать."
 stress_threshold.3411.a.reclusive.gain:1 "НЕ СМОТРИТЕ НА МЕНЯ!"
 stress_threshold.3411.a.reclusive.effect:0 "$stress_threshold.2351.a.reclusive.gain$"
 stress_threshold.3411.b.flagellant.gain:0 "Моя плоть за прощение!"
 stress_threshold.3411.b.flagellant.effect:0 "$stress_threshold.3411.b.flagellant.gain$"
 stress_threshold.3411.c.profligate.gain:0 "Грандиозные памятники одурачат моих подданных..."
 stress_threshold.3411.c.profligate.effect:0 "$stress_threshold.3411.c.profligate.gain$"
 stress_threshold.3411.d.improvident.gain:0 "Что если сокровищница будет принадлежать всем?"
 stress_threshold.3411.d.improvident.effect:0 "$stress_threshold.3411.d.improvident.gain$"
 stress_threshold.3411.e.contrite.gain:0 "Мир #EMP должен#! узнать о моей невменяемости!"
 stress_threshold.3411.e.contrite.effect:0 "$stress_threshold.3411.e.contrite.gain$"
 stress_threshold.3411.f.inappetetic.gain:0 "Опустошить кладовые! Я не заслуживаю никакой соблазнительной пищи."
 stress_threshold.3411.f.inappetetic.effect:0 "$stress_threshold.3411.f.inappetetic.gain$"
 stress_threshold.3411.f.inappetetic.list:0 "Все [Concept( 'courtier', 'придворные' )|E] и [Concept( 'guest', 'гости' )|E], голодавшие вместе с вами"
 stress_threshold.3411.g.journaller.gain:0 "Мои старые дневники! Нужно изучить мои недостатки..."
 stress_threshold.3411.g.journaller.effect:0 "$stress_threshold.3411.g.journaller.gain$"
 stress_threshold.3411.h.confider.gain:0 "$stress_threshold.1701.h.confider.gain$"
 stress_threshold.3411.h.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
 stress_threshold.3411.i.athletic.gain:0 "Я не могу убежать от ответственности, но можно попытаться..."
 stress_threshold.3411.i.athletic.effect:0 "$stress_threshold.3411.i.athletic.gain$"
 stress_threshold.3411.j.drunkard.gain:0 "Принесите мне бочонок выпивки, я утоплю в нем свои печали."
 stress_threshold.3411.j.drunkard.effect:0 "$stress_threshold.3411.j.drunkard.gain$"
 stress_threshold.3411.k.hashishiyah.gain:0 "Мне нужно столько гашиша, чтобы избавиться от стыда."
 stress_threshold.3411.k.hashishiyah.effect:0 "$stress_threshold.3411.k.hashishiyah.gain$"
 stress_threshold.3411.l:0 "Ну хватит! Я отрекаюсь!"
 stress_threshold.3411.l.list:0 "Все [Concept( 'vassal', 'вассалы' )|E], которые не ненавидят вас"
 stress_threshold.3411.l.tt:0 "Все [Concept( 'claims', 'претензии' )|E] на ваши [Concept( 'titles', 'титулы' )|E] становятся [Concept( 'pressed', 'обоснованными' )|E]"

 stress_threshold.3421.t:0 "Нервный срыв: власть порока"
 stress_threshold.3421.desc.intro:0 "«Сюзерен, — молит слуга, — сделайте что-нибудь! [burning_holding.GetNameNoTier] полыхает! Вы должны послать помощь!»\n\n"
 stress_threshold.3421.desc.lustful:0 "Я потягиваюсь, мои руки играючи касаются прекрасной юной плоти. Хор стонов за моей спиной не стихает даже при посетителе."
 #Go full Denethor:
 stress_threshold.3421.desc.gluttonous:0 "Я продолжаю закидывать еду в рот, приостанавливая свое одинокое пиршество только через несколько минут — когда становится ясно, что гонец не уйдет без четких указаний."
 stress_threshold.3421.desc.greedy:0 "Я невозмутимо продолжаю пересчитывать монеты. Сияющие груды серебра и золота звенят, словно башенки крошечного замка, разложенные по размеру и чистоте. Это значительная часть моего богатства."
 stress_threshold.3421.desc.lazy:0 "Мои глаза остаются закрытыми. Я медленно покачиваюсь в гамаке наверху самой высокой моей башни, и мое одиночество нарушают лишь гонец и груда мягких подушек и одеял."
 stress_threshold.3421.desc.arrogant:0 "Я продолжаю работать над моделью новой — более совершенной версии идеального дворца. Она подобна мне в каждой детали: поскольку ее делаю я, в ней совершенно все до мелочей."
 stress_threshold.3421.desc.craven:0 "Я остаюсь в безопасности за тяжелой, окованной железом дверью. Потребуется десяток крепких солдат, чтобы вломиться сюда. И в этой безопасной комнате без окон мне не грозит никакая опасность."
 stress_threshold.3421.desc.gregarious:0 "Я едва слышу гонца сквозь шумный смех и веселье за моей спиной. Моя вечеринка в самом разгаре, и она длится уже несколько дней."
 stress_threshold.3421.desc.cynical:0 "Я недоверчиво всматриваюсь в гонца, что стоит за дверью моего убежища. Полыхает, да? Явная и очевидная ложь. Откуда мне знать, что это действительно кто-то из #EMP моих#! слуг? Это может быть кто угодно! Нужно как можно скорее избавиться от него."
 stress_threshold.3421.desc.zealous:0 "Перед моими глазами все также стоит [ROOT.GetCharacter.GetFaith.ReligiousText], меня окружают священные символы веры, и я молюсь в надежде, что [ROOT.GetCharacter.GetFaith.HighGodName] наставит меня. И лишь когда становится ясно, что гонец не уйдет, я оборачиваюсь."
 stress_threshold.3421.desc.stubborn:0 "Мои глаза остаются закрытыми, а кровать — нетронутой. Я не собираюсь менять свой распорядок дня без #EMP крайне#! весомой на то причины. Только когда гонец повторяет свой вопрос, я встряхиваюсь."
 stress_threshold.3421.desc.fallback:0 "Я стою на вершине высочайшей башни моей столицы и взираю вниз, плотно сжав губы. Кажется, я здесь уже несколько дней, и каждый раз, когда я покидаю это место, происходит что-то ужасное."
 stress_threshold.3421.desc.rump:0 "\n\n«Кажется, я [Select_CString(ROOT.Char.IsFemale, 'велела', 'велел' )] меня не беспокоить», — отвечаю я. Только эта комната, эта реальность, имеют смысл для моего уставшего разума."
 stress_threshold.3421.a.rakish.gain:0 "Приведите мне компаньона, и я отправлю помощь."
 stress_threshold.3421.a.rakish.effect:0 "$stress_threshold.3421.a.rakish.gain$"
 stress_threshold.3421.b.reclusive.gain:0 "Разбирайтесь сами! Оставьте меня в покое!"
 stress_threshold.3421.b.reclusive.effect:0 "$stress_threshold.3421.b.reclusive.gain$"
 stress_threshold.3421.c.irritable.gain:0 "Да что б вас всех, убогих, я разберусь с этим!"
 stress_threshold.3421.c.irritable.effect:0 "$stress_threshold.3421.c.irritable.gain$"
 stress_threshold.3421.d.flagellant.gain:0 "Что?! Меня нужно покарать за новую оплошность!"
 stress_threshold.3421.d.flagellant.effect:0 "$stress_threshold.3421.d.flagellant.gain$"
 stress_threshold.3421.e.profligate.gain:0 "Раздавайте казну! Защищайте рынки!"
 stress_threshold.3421.e.profligate.effect:0 "$stress_threshold.3421.e.profligate.gain$"
 stress_threshold.3421.f.comfort_eater.gain:0 "Приготовьте сытный обед, я скоро появлюсь."
 stress_threshold.3421.f.comfort_eater.effect:0 "$stress_threshold.3421.f.comfort_eater.gain$"
 stress_threshold.3421.g.drunkard.gain:0 "Приготовьте бочонок лучшего напитка, я скоро появлюсь."
 stress_threshold.3421.g.drunkard.effect:0 "$stress_threshold.3421.g.drunkard.gain$"
 stress_threshold.3421.h.hashishiyah.gain:0 "Приготовьте тарелку пирогов, я скоро буду."
 stress_threshold.3421.h.hashishiyah.effect:0 "$stress_threshold.3421.h.hashishiyah.gain$"
 stress_threshold.3421.i:0 "Пусть они все #EMP сгорят#!."
 stress_threshold.3421.b.reclusive.list:0 "Все [Concept( 'vassal', 'вассалы' )|E], у которых есть сердце"

