 stress_threshold.2331.h.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2331.i.hashishiyah.gain:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2331.i.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2331.j:0 "Мне не нужна любовь, только подчинение."

 stress_threshold.2341.t:0 "Нервный срыв: уклонение от обязанностей"
 stress_threshold.2341.desc.intro:0 "Проклятье, мне нужно время на себя! Что с того, что я не буду появляться при дворе несколько дней? Или даже месяцев? Власть — моя привилегия, и только мне решать, пользоваться ей или нет.\n\nЯ [ROOT.GetCharacter.GetTitleAsNameNoTooltip],"
 stress_threshold.2341.desc.lazy:0 "и мне нужно отдохнуть!"
 stress_threshold.2341.desc.craven:0 "и если мне не хочется подвергать себя опасностям придворной жизни, то это мое дело!"
 stress_threshold.2341.desc.shy:0 "и если мне не хочется общаться с толпами придворных, то я не буду этого делать!"
 stress_threshold.2341.desc.arbitrary:0 "и у меня нет обязанностей, кроме тех, что выбираю я!"
 stress_threshold.2341.desc.fickle:0 "$stress_threshold.2341.desc.arbitrary$"
 stress_threshold.2341.desc.fallback:0 "и мои решения не подлежат обсуждению!"
 stress_threshold.2341.a.reclusive.gain:0 "Подите прочь! Вы все!"
 stress_threshold.2341.a.reclusive.effect:0 "$stress_threshold.2341.a.reclusive.gain$"
 stress_threshold.2341.a.reclusive.list_courtier:0 "$stress_threshold.2331.a.reclusive.opinion_list$"
