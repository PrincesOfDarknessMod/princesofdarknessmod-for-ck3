 stress_threshold.2311.t:0 "Нервный срыв: тени прошлого"
 stress_threshold.2311.desc.intro:0 "Я в задумчивости сижу на троне, а сердце терзают воспоминания о делах давно минувших дней."
 stress_threshold.2311.desc.generous:0 "Была ли моя щедрость достаточной? Помогла ли она людям?"
 stress_threshold.2311.desc.diligent:0 "Была ли моя работа достаточно усердной? Помогли ли мои труды кому-нибудь или, наоборот, все усугубили?"
 stress_threshold.2311.desc.wrathful:0 "Как часто меня охватывала ярость? Был ли мой гнев нацелен на виновных или невинных?"
 stress_threshold.2311.desc.patient:0 "Не были ли мои действия слишком осторожными? Не было ли мое терпение лишь красивым прикрытием моей нерешительности?"
 stress_threshold.2311.desc.arrogant:0 "Не моя ли гордыня завела меня сюда? И не ждет ли меня потом столь же грандиозное падение?"
 stress_threshold.2311.desc.humble:0 "[Select_CString(ROOT.Char.IsFemale, 'Была ли я достаточно хороша', 'Был ли я достаточно хорош' )]? Что если [Select_CString(ROOT.Char.IsFemale, 'другая', 'другой' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'справилась', 'справился' )] бы лучше?"
 stress_threshold.2311.desc.deceitful:0 "Я [Select_CString(ROOT.Char.IsFemale, 'запуталась', 'запутался' )] в паутине собственной лжи? Да, моя ложь была умной, но, возможно, мой обман преследует меня даже сейчас?"
 stress_threshold.2311.desc.zealous:0 "Правда ли за мной присматривает [ROOT.GetCharacter.GetFaith.HighGodName]? Была ли моя вера факелом во тьме или же костром для моих собственных прихотей?"
 stress_threshold.2311.desc.fallback:0 "Я [Select_CString(ROOT.Char.IsFemale, 'была права? Или ошибалась?', 'был прав? Или ошибался?' )]"
 stress_threshold.2311.desc.rump:0 "Правильно ли я поступаю?\n\nГолова раскалывается... Зачем [ROOT.GetCharacter.GetFaith.HighGodName] вручает мне власть, если знает, что я буду страдать от этого?"
