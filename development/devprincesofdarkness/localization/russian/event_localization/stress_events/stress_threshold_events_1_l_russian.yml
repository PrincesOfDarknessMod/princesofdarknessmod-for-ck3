 stress_threshold.2341.f.drunkard.gain:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2341.f.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2341.g.hashishiyah.gain:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2341.g.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2341.h:0 "Будьте вы прокляты, наглецы!"

 stress_threshold.2351.t:0 "Нервный срыв: неуместные замечания"
 stress_threshold.2351.desc.intro:0 "Я сижу, пропуская мимо ушей трагическую историю крестьянина. Если честно, я едва понимаю, о чем речь. Мой разум заполнен моими собственными заботами.\n\n"
 stress_threshold.2351.desc.content:0 "«Почему вы не можете #EMP довольствоваться#! тем, что у вас осталось?»"
 stress_threshold.2351.desc.cynical:0 "«Пфф, откуда мне знать, что ты не #EMP лжешь#!?»"
 stress_threshold.2351.desc.paranoid:0 "«#EMP Правдоподобная#! история. Должно быть, ты иноземный шпион!»"
 stress_threshold.2351.desc.sadistic:0 "«Знаешь, в моей темнице есть #EMP идеальное#! место для тебя»,"
 stress_threshold.2351.desc.vengeful:0 "«Наверняка ты заслуживаешь #EMP все#!, что с тобой случилось»,"
 stress_threshold.2351.desc.fallback:0 "«О, [ROOT.GetCharacter.GetFaith.HighGodName], как же ты #EMP воняешь#!»,"
 stress_threshold.2351.desc.rump:0 "— отвечаю я, не подумав.\n\nВокруг нас воцаряется тишина. Все смотрят на ошарашенного простолюдина и меня. Очевидно, это не тот ответ, что они ждали."
 stress_threshold.2351.a.reclusive.gain:0 "#EMP Уходите#!, все вы!"
 stress_threshold.2351.a.reclusive.effect:0 "$stress_threshold.2351.a.reclusive.gain$"
 stress_threshold.2351.b.irritable.gain:0 "А чего вы от меня ждали, молокососы?"
 stress_threshold.2351.b.irritable.effect:0 "$stress_threshold.2351.b.irritable.gain$"
 stress_threshold.2351.c.profligate.gain:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.2351.c.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.2351.d.improvident.gain:0 "$stress_threshold.1711.d.improvident.gain$"
 stress_threshold.2351.d.improvident.effect:0 "$stress_threshold.1711.d.improvident.gain$"
 stress_threshold.2351.e.inappetetic.gain:0 "$stress_threshold.1721.h.inappetetic.gain$"
 stress_threshold.2351.e.inappetetic.effect:0 "$stress_threshold.1721.h.inappetetic.gain$"
 stress_threshold.2351.f.journaller.gain:0 "Возможно, я буду делать портретики просителей в дневнике..."
 stress_threshold.2351.f.journaller.effect:0 "$stress_threshold.2351.f.journaller.gain$"
 stress_threshold.2351.g.drunkard.gain:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2351.g.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2351.h.hashishiyah.gain:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2351.h.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2351.i:0 "Прошу прощения. А теперь, пожалуйста, повтори свою историю..."

 stress_threshold.3401.t:0 "Нервный срыв: выстрел в гонца"
 stress_threshold.3401.desc.intro:0 "Кажется, в моей голове бушует шторм. Я ерзаю, пытаясь поудобнее устроиться на троне, пока гонец рассказывает мне какую-то бессмысленную душещипательную историю о пиратах или бандитах или еще какой-то ерунде.\n\nДавление нарастает, его нужно куда-то выплеснуть, и почти непроизвольно мой рот начинает произносить слова."
 stress_threshold.3401.desc.vengeful:0 "«Разве не ты бросил в меня яйцом несколько лет назад?"
 stress_threshold.3401.desc.wrathful:0 "«Да как ты смеешь беспокоить меня подобной ерундой?"
 stress_threshold.3401.desc.impatient:0 "«Говори уже, идиот! Ар-р, слишком медленно!"
 stress_threshold.3401.desc.arbitrary:0 "«О [ROOT.GetCharacter.GetFaith.HighGodName], как же от тебя смердит."
 stress_threshold.3401.desc.paranoid:0 "«Думаешь, я поверю столь явной лжи? Сразу видно, что ты наемный убийца!"
 stress_threshold.3401.desc.callous:0 "«Меня не волнуют подобные мелочи."
 stress_threshold.3401.desc.sadistic:0 "«Своей плохой службой ты подаешь дурной пример."
 stress_threshold.3401.desc.fallback:0 "$stress_threshold.3401.desc.wrathful$"
 stress_threshold.3401.desc.rump:0 "#EMP Обезглавить этого дурня!#!»\n\nДвор вокруг нас охватывает гробовая тишина."
 stress_threshold.3401.a.reclusive.gain:0 "И прочь с глаз моих, вы все!"
 stress_threshold.3401.a.reclusive.effect:0 "$stress_threshold.3401.a.reclusive.gain$"
 stress_threshold.3401.a.reclusive.list:0 "Все [Concept( 'character', 'персонажи' )|E], не являющиеся вашими домочадцами"
 stress_threshold.3401.b.irritable.gain:0 "И обезглавить всякого, кто попытается заговорить со мной!"
 stress_threshold.3401.b.irritable.effect:0 "$stress_threshold.3401.b.irritable.gain$"
