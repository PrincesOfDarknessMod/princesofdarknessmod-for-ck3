#Character Modifiers
 encouraged_city_burn_modifier:0 "Пусть все горит"
 encouraged_city_burn_modifier_desc:0 "Этот персонаж позволил целому владению сгореть дотла."
 lashing_out_at_victims_modifier:0 "Срывается на несчастных"
 lashing_out_at_victims_modifier_desc:0 "Этот персонаж постоянно выплескивает свой гнев на тех, кто нуждается в помощи."
 lost_in_lust_modifier:0 "Похоть затмила все"
 lost_in_lust_modifier_desc:0 "Этот персонаж пытается забыть о прошлом в чужих объятиях."
 agonising_irritations_modifier:0 "Мучительное раздражение"
 agonising_irritations_modifier_desc:0 "Этот персонаж пытается забыть о прошлом, злясь на настоящее."
 scars_over_scars_modifier:0 "Шрамы поверх шрамов"
 scars_over_scars_modifier_desc:0 "Этот персонаж пытается заглушить воспоминания земной болью."
 trying_to_buy_happiness_modifier:0 "Пытается купить счастье"
 trying_to_buy_happiness_modifier_desc:0 "Этот персонаж пытается заглушить воспоминания, покупая безделушки."
 outer_monologue_modifier:0 "Внешний монолог"
 outer_monologue_modifier_desc:0 "Этот персонаж ищет прощения за свои прошлые ошибки, постоянно рассказывая о них."
 sated_by_mistakes_modifier:0 "Пища из ошибок"
 sated_by_mistakes_modifier_desc:0 "Этот персонаж питается скорее сожалениями, чем земной пищей."
 refuge_in_words_modifier:0 "Убежище в словах"
 refuge_in_words_modifier_desc:0 "Этот персонаж топит свое прошлое в замаранных кляксами записях."
 sorely_needed_confidant_modifier:0 "Болтун"
 sorely_needed_confidant_modifier_desc:0 "Этот персонаж постоянно рассказывает доверенному лицу о своем прошлом."
 long_walks_of_the_mind_modifier:0 "Долгие прогулки от себя"
 long_walks_of_the_mind_modifier_desc:0 "Этот персонаж ищет спасения от своего прошлого, подолгу гуляя в одиночку."
 bottom_of_a_bottle_modifier:0 "Дно бутылки"
 bottom_of_a_bottle_modifier_desc:0 "Этот персонаж пытается утопить свое прошлое на дне бутылки."
 fogging_hard_memories_modifier:0 "Затуманенные воспоминания"
 fogging_hard_memories_modifier_desc:0 "Этот персонаж забывается при помощи пирогов с гашишем."
 high_blood_pressure_modifier:0 "Повышенное давление"
 high_blood_pressure_modifier_desc:0 "Раздраженность этого персонажа плохо сказывается на сердце."
 regular_walking_routes_modifier:0 "Регулярные прогулки"
 regular_walking_routes_modifier_desc:0 "Этот персонаж постоянно совершает прогулки одним и тем же маршрутом, в одиночестве..."
 symbol_of_folly_modifier:0 "Символ сумасбродства"
 symbol_of_folly_modifier_desc:0 "Знаменитый плащ этого персонажа стал символом невыполненных обязательств."
 deserted_halls_modifier:0 "Пустующие залы"
 deserted_halls_modifier_desc:0 "Немногие бывают в залах этого персонажа, обрекая его на одиночество..."
 glut_of_furniture_modifier:0 "Переизбыток мебели"
 glut_of_furniture_modifier_desc:0 "Залы этого персонажа забиты дрянной, безвкусной мебелью."
 strange_recluse_modifier:0 "Странное затворничество"
 strange_recluse_modifier_desc:0 "Этот персонаж постоянно пребывает в уединении и говорит странные вещи своим посетителям..."
 grouchy_ruler_modifier:0 "Ворчливый правитель"
 grouchy_ruler_modifier_desc:0 "Этот персонаж ворчит и перебрасывается лишь парой слов с теми, кто все-таки решает его навестить."
 suspicious_sketcher_modifier:0 "Подозрительные наброски"
 suspicious_sketcher_modifier_desc:0 "Этот персонаж всегда делает наброски и пометки во время разговора..."
 carrion_writer_modifier:0 "Гнилостный писатель"
 carrion_writer_modifier_desc:0 "Этот персонаж ведет дневник, используя очень особенные чернила."
 pickled_human_head_footstool:0 "Засоленная человеческая голова"
 pickled_human_head_footstool_desc:0 "Этот персонаж настаивает на использовании жуткой подставки для ног."
 ostentatious_follies_modifier:0 "Показное безумие"
 ostentatious_follies_modifier_desc:0 "Земли этого персонажа полны недостроенных уродливых памятников собственному величию."
 extreme_tax_rebates_modifier:0 "Чрезмерные налоговые льготы"
 extreme_tax_rebates_modifier_desc:0 "Известно, что этот персонаж возвращает налоги любому простолюдину, который попросит об этом!"
 obsessed_autobiographer_modifier:0 "Помешанный автобиограф"
 obsessed_autobiographer_modifier_desc:0 "Этот персонаж занимается исключительно тем, что перечитывает собственные дневники: на остальное едва ли хватает времени."
 scopophobic_modifier:0 "Скопофобия"
 scopophobic_modifier_desc:0 "Этот персонаж #EMP ненавидит#! чужие взгляды."
 running_from_responsibilities_modifier:0 "Бегство от ответственности"
 running_from_responsibilities_modifier_desc:0 "Этот персонаж слишком буквально понимает бегство от ответственности."
 tragic_drunk_modifier:0 "Трагическое пьянство"
 tragic_drunk_modifier_desc:0 "Этот персонаж больше всего на свете боится протрезветь."
 tragic_stoner_modifier:0 "Трагический гашишизм"
 tragic_stoner_modifier_desc:0 "$tragic_drunk_modifier_desc$"

#Title Modifiers
 controlled_urban_fires_modifier:0 "Контролируемый пожар"
 controlled_urban_fires_modifier_desc:0 "В одном из владений этого графства с трудом удалось избежать большого пожара."
 managed_urban_fires_modifier:0 "Управляемый пожар"
 managed_urban_fires_modifier_desc:0 "Большой пожар причинил значительный ущерб одному из владений этого графства."
 uncontrolled_urban_fires_modifier:0 "Разбушевавшийся пожар"
 uncontrolled_urban_fires_modifier_desc:0 "Большой пожар почти полностью уничтожил одно из владений этого графства."
 an_influx_of_eager_beggars_modifier:0 "Приток попрошаек"
 an_influx_of_eager_beggars_modifier_desc:0 "Жадные до денег попрошайки выстраиваются вдоль улиц многочисленных поселений."
 deplenished_forests_and_fields_modifier:0 "Опустошенные леса и поля"
 deplenished_forests_and_fields_modifier_desc:0 "Леса этого графства были опустошены, а дичь перебита ради пиршеств сюзерена."
