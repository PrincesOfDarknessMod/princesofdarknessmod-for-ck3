 stress_threshold.2321.t:0 "Нервный срыв: придворные-обманщики"
 stress_threshold.2321.desc.intro:0 "Люди используют в своих интересах любой мой поступок!"
 stress_threshold.2321.desc.impatient:0 "Моя жизнь — череда долгих нудных объяснений, на которые у меня нет времени!"
 stress_threshold.2321.desc.honest:0 "Мой двор врет мне в лицо — весь день, ежедневно, простолюдины и знать!"
 stress_threshold.2321.desc.trusting:0 "$stress_threshold.2321.desc.honest$"
 stress_threshold.2321.desc.compassionate:0 "Мои подданные постоянно злоупотребляют моим состраданием, с готовностью выжимая из меня каждую каплю понимания!"
 stress_threshold.2321.desc.forgiving:0 "Мое милосердие подвергается испытанию каждый день (иногда — дважды в день) легионом назойливых, неблагодарных людишек!"
 stress_threshold.2321.desc.fallback:0 "Мой двор кишит паразитами! Упырями! Пиявками!"
 stress_threshold.2321.desc.rump:0 "Моя кровь закипает от этого!\n\nЯ так больше не могу! Если я что-нибудь с этим не сделаю, я закричу!"
 stress_threshold.2321.a.irritable.gain:0 "Возможно, я закричу в любом случае!"
 stress_threshold.2321.a.irritable.effect:0 "$stress_threshold.2321.a.irritable.gain$"
