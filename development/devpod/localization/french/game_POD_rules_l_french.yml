 rule_world_of_darkness:0 "World of Darkness"
 setting_world_of_monsters:0 "World of Darkness"
 setting_world_of_monsters_desc:0 "La plupart des personnages titrés sont des créatures surnaturelles, ou ceux qui les chassent."
