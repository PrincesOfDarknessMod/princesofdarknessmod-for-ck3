l_french:
 building_type_blood_tax_01:0 "Taxe de Sang"
 building_type_blood_tax_01_desc:1 "#F Vous vous assurez que vos mortels travaillent, littéralement, jusqu’à leur dernier souffle.#!"
 building_blood_tax_01:0 "Taxe de sang Faible"
 building_blood_tax_01_desc:1 "Vous imposez ouvertement les mortels ici. Ce n’est toutefois pas le plan le plus solide sur le plan économique pour la prospérité du comté."
 building_blood_tax_02:0 "Taxe de sang Importante"
 building_blood_tax_02_desc:1 "Les mortels sont saignés à blanc pour leur argent sous votre règne. C’est-à-dire quand ils sont chanceux."
 building_blood_tax_03:0 "Taxe de sang Oppressive"
 building_blood_tax_03_desc:1 "Vos coffres se reconstituent rapidement. Qui se soucie que vous gouverniez une friche stérile de toute façon?"
 building_type_open_rule_01:0 "Règne ouvert"
 building_type_open_rule_01_desc:1 "#F Les mortels impuissants ne sont pas bons sans votre ferme direction. Étrangement, ils ne semblent pas tous d’accord avec cette vérité évidente.#!"
 building_open_rule_01:0 "Règne Strict"
 building_open_rule_01_desc:1 "Vous êtes le seigneur de toute cette terre, Vampire ou autre. Vous êtes craint, mais les murmures de rébellion se développent."
 building_open_rule_02:0 "Règne Oppresif"
 building_open_rule_02_desc:1 "Une exécution par nuit garde les mortels en ligne. Au moins, quand ils pensent que vous pouvez les entendre..."
 building_open_rule_03:0 "Règne Tyrannique"
 building_open_rule_03_desc:1 "Les mortels sont des bovins, et traités comme tels dans votre royaume de peur et de désespoir. Ils essaieront de se libérer si une opportunité se présente."
 building_type_forced_conscription_01:0 "Consription Forcée"
 building_type_forced_conscription_01_desc:1 "#F Vous permettez à tous au sein de votre royaume d'avoir l’honneur de servir dans vos armées. Malheureusement, autant de recrue ont tendance à dépasser votre capacité militaire et donc votre disposition à gouverner le comté.#!"
 building_forced_conscription_01:0 "Conscription Forcée Faible"
 building_forced_conscription_01_desc:1 "Quelques-uns de vos agents sont dehors, convainquant les gens que mourir pour vous est une noble cause."
 building_forced_conscription_02:0 "Conscription Forcée Importante"
 building_forced_conscription_02_desc:1 "Des centres de recrutement forcé apparaissent partout dans votre royaume, et l’absence n’est pas une option."
 building_forced_conscription_03:0 "Conscription Forcée Oppresive "
 building_forced_conscription_03_desc:1 "Ils servent et meurent sur le champ de bataille, ou ils ne le font pas et meurent maintenant"
 building_type_night_terror_01:0 "Chasseur Nocturne"
 building_type_night_terror_01_desc:1 "#F Rôder la nuit avec votre meute est votre vraie nature, vous ne pouvez pas arrêter l’envie d’aller chasser une proie impuissante.#!"
 building_night_terror_01:0 "Peur Nocturne"
 building_night_terror_01_desc:1 "Des gens disparaissent quand vous cédez à vos envies bestiale. Votre contrôle sur le comté diminue, mais votre meute est renforcée"
 building_night_terror_02:0 "Terreur Nocturne"
 building_night_terror_02_desc:1 "Vous êtes à peine capable de revenir à vous mêmes et de diriger votre royaume entre les chasses revigorantes que vous menez."
 building_night_terror_03:0 "Cauchemar Nocturne"
 building_night_terror_03_desc:1 "Votre meute est la seule qui compte. Tous les autres ne sont que des proies à chasser."
 building_type_influence_noble_01:0 "Influencer les Nobles"
 building_type_influence_noble_01_desc:1 "#F Grâce à un mélange d’incitation, de chantage et de séduction, vous pouvez garder un œil sur les dirigeants mortels de ce comté. Cela laissera les autres humains en échec, et vos caisse continueront à se remplir .#!"
 building_influence_noble_01:0 "Légère Influence sur les Nobles"
 building_influence_noble_01_desc:1 "A ce niveau d’influence, vous avez commencé à perturber la cohésion de la classe dirigeante, réduisant leur capacité martiale. \n Ce niveau nécessite plus de 25 en contrôle pour être construit et rester actif."
 building_influence_noble_02:0 "Forte Influence sur les Nobles"
 building_influence_noble_02_desc:1 "Votre contrôle sur eux grandit, et les choses commencent à revenir à la normale de leur point de vue. \n Ce niveau nécessite plus de 50 contrôles pour construire et rester actif."
 building_influence_noble_03:0 "Influence Totale sur les Nobles"
 building_influence_noble_03_desc:1 "La classe dirigeante ne le sait peut-être pas, mais ils sont à vous maintenant. Et personne ne se doute de rien. \n Ce niveau nécessite plus de 75 contrôles pour construire et rester actif."
 building_type_playing_courts_01:0 "Influence sur les Gardes"
 building_type_playing_courts_01_desc:1 "#F La garnison locale pourrait être un atout bienvenu pour vous permettre de vous entraîner et de vous nourrir. Vous devrez simplement tirer quelques ficelles pour y arriver...#!"
 building_playing_courts_01:0 "Légère Influence sur les Gardes"
 building_playing_courts_01_desc:1 "A l'insu de la plupart des fonctionnaires, et en soudoyant le reste, votre garde personnelle a commencé à travailler avec la milice locale. \n Ce niveau nécessite plus de 25 en contrôle pour être construit et rester actif."
 building_playing_courts_02:0 "Forte Influence sur les Gardes"
 building_playing_courts_02_desc:1 "Vos hommes sont désormais une précieuse "compagnie de mercenaire" protégeant la ville avec l’aide de ses habitants. Une situation gagnant/gagnant. Pour vous du moins. \n Ce niveau nécessite plus de 50 en contrôle pour être construit et rester actif."
 building_playing_courts_03:0 "Influence Totale sur les Gardes"
 building_playing_courts_03_desc:1 "Vous pouvez difficilement différencier les hommes locaux des vôtres. Ils vous servent tous d’une façon ou d’une autre. \n Ce niveau nécessite plus de 75 en contrôle pour être construit et rester actif."
 building_type_influence_underworld_01:0 "Influencer la Pègre"
 building_type_influence_underworld_01_desc:1 "#F Vous pourriez soutirer beaucoup des hors-la-loi de cette région, que ce soit de l’argent ou des recrues expérimentées pour votre garde d’élite. Cependant, attiser la pègre a ses inconvénients.#!"
 building_influence_underworld_01:0 "Légère Influence sur la Pègre"
 building_influence_underworld_01_desc:1 "Aider les criminels a commencé à devenir rentable pour vous. Mais cela a également mis en colère la population locale. \n Ce niveau nécessite plus de 25 en contrôle pour être construit et rester actif."
 building_influence_underworld_02:0 "Forte Influence sur la Pègre"
 building_influence_underworld_02_desc:1 "Grâce à votre charisme et votre autorité, votre bande de mécréants fait moins parler d'elle et plus de profits. \n Ce niveau nécessite plus de 50 en contrôle pour être construit et rester actif."
 building_influence_underworld_03:0 "Influence Totale sur la Pègre"
 building_influence_underworld_03_desc:1 "Vous avez réduit autant que possible les pires instincts de vos sbires. Ils sont presque aussi disciplinés qu’une force de combat régulière. \n Ce niveau nécessite plus de 75 en contrôle pour être construit et rester actif."
 building_type_influence_merchant_01:0 "Influencer les Marchands"
 building_type_influence_merchant_01_desc:1 "#F Les marchands sont riches, et vous avez besoin d’or. La solution est simple, mais ils ne l'accepteront pas facilement.#!"
 building_influence_merchant_01:0 "Légère Influence sur les Marchands"
 building_influence_merchant_01_desc:1 "Ils résistent, se plaignent et créent des problèmes. Mais certains ont commencé à payer votre impôt tout à fait légitime. \n Ce niveau nécessite plus de 25 en contrôle pour être construit et rester actif."
 building_influence_merchant_02:0 "Forte Influence sur les Marchands"
 building_influence_merchant_02_desc:1 "La plupart des marchands ont été intimidés, et la contestation a été réduite à de simple chuchotement dans les ruelles. \n Ce niveau nécessite plus de 50 en contrôle pour être construit et rester actif."
 building_influence_merchant_03:0 "Influence Totale sur les Marchands"
 building_influence_merchant_03_desc:1 "Vous pouvez maintenant réunir les guildes marchandes et mettre en place de nouveaux impôts et encore être accueillis par la foule et les applaudissements. \n Ce niveau nécessite plus de 75 en contrôle pour être construit et rester actif."
 building_type_prince_city_00:0 "Principauté"
 building_type_prince_city_00_desc:1 "#F Les vampires sont des citadins. Plus la ville est grande, plus un vampire est craint et prestigieux.#!"
 building_prince_city_00:0 "Prince de la Ville"
 building_prince_city_00_desc:1 "Vous contrôlez une petite ville de province. Ce n’est pas grand-chose, mais c’est mieux que rien."
 building_prince_city_005:0 "Prince de la Grande Ville"
 building_prince_city_005_desc:1 "Vous contrôlez une ville sale et puante. Les habitants savent que vous êtes important par votre manque de saleté. \n Ce niveau nécessite plus de 5 développements pour être construit et rester actif." 
 building_prince_city_01:0 "Prince de la Cité"
 building_prince_city_01_desc:1 "Vous contrôlez la totalité d’une petite cité, ou une petite partie d’une plus grande. C’est un début. \n Ce niveau nécessite plus de 10 développements pour être construit et rester actif."
 building_prince_city_02:0 "Prince de la Cité Régionale"
 building_prince_city_02_desc:1 "Votre cour est respectée et admirée puisque vous régnez sur de nombreux mortels. \n Ce niveau nécessite plus de 20 développements pour être construit et rester permis."
 building_prince_city_025:0 "Prince de la Grande Cité Régionale "
 building_prince_city_025_desc:1 "Une cité importante est sous votre contrôle, beaucoup de mortels sont volontairement sous votre emprise ici. \n Ce niveau nécessite plus de 30 développements pour être construit et rester actif." 
 building_prince_city_03:0 "Prince de la Capitale"
 building_prince_city_03_desc:1 "Les mortels, les rois et les seigneurs de guerre habitent dans cette ville impressionnante. Vous êtes leur homologue nocturne. \n Ce niveau nécessite plus de 40 développements pour être construit et rester permis."
 building_prince_city_04:0 "Prince de la Métropole"
 building_prince_city_04_desc:1 "L’une des plus grandes villes du monde vit dans votre ombre. Votre influence ne connaît pas de limites dans votre domaine. \n Ce niveau nécessite plus de 60 développements pour être construit et rester actif."
 building_type_temple_set_01:0 "Temple de Set"
 building_type_temple_set_01_desc:1 "#F Des plaisirs au-delà de vos rêves les plus fous vous attendent ici. Si vous êtes prêt à en payer le prix.#!"
 building_temple_set_01:0 "Temple of Set"
 building_temple_set_01_desc:1 "L’adoration de Set a un attrait indéniable, faisant de la vente de votre âme à la Setite une perspective beaucoup plus attirante qu’elle ne l'est réellement..."
 building_type_devasthana_01:0 "Contrôler la Devasthana"
 building_type_devasthana_01_desc:1 "#F L’Inde est enfermée dans une guerre sainte millénaire pour arrêter l’asuratizayya. Pour la gagner, vous aurez besoin de la foi et d'une conviction inébranlable.#!"
 building_devasthana_01:0 "Militaire Devasthana"
 building_devasthana_01_desc:1 "Ici, vous trouverez la force de continuer, sous la protection des Dévas."
 building_type_brahmavihara_01:0 "Mentors du Brahmavihara"
 building_type_brahmavihara_01_desc:1 "#F Votre condition actuel, bien que la simple partie d’un voyage plus long, rend plus difficile le suivie des enseignements de Bouddha. Vous pourriez avoir besoin d’aide.#!"
 building_brahmavihara_01:0 "Upekkha"
 building_brahmavihara_01_desc:1 "Rester neutre en toutes circonstances est un test approprié. C’est la voie vers la tranquillité d’esprit et le Nirvana."
 building_type_low_war_01:0 "Basse Guerre"
 building_type_low_war_01_desc:1 "#F Chaque instant est un champ de bataille, qu’il soit politique ou physique. Un guerrier de Jade est toujours prêt#!"
 building_low_war_01:0 "Une Guerre sans Fin"
 building_low_war_01_desc:1 "Vous vous battez toujours, et le répit n'est qu'un lointain souvenir. Mais vos ennemis ont tendance à l’être aussi."
 building_type_chantry_01:0 "La Chantrie"
 building_type_chantry_01_desc:1 "#F Une congrégation de mages. Le plus souvent, le théâtre d’intrigues sans fin... jusqu’à ce qu’un ennemi commun émerge.#!"
 building_chantry_01:0 "Modeste Chantrie"
 building_chantry_01_desc:1 "Les Tremeres de la région se rassemblent ici. C’est un bon endroit pour se faire des amis. Et un meilleur endroit encore pour se faire des rivaux."
 building_type_influence_the_tribes_01:0 "Influencer la Tribus"
 building_type_influence_the_tribes_01_desc:1 "#F Vivant aux confins du monde musulman, beaucoup de membres des tribus pourraient être utiles à votre noble cause.#!"
 building_influence_the_tribes_01:0 "Influence Légère Tribale"
 building_influence_the_tribes_01_desc:1 "Après avoir prouvé votre valeur et votre piété, vous avez obtenu l’aide d’un nombre conséquent de membres de la tribu."
 building_type_underworld_portal_01:0 "Portail des Enfers"
 building_type_underworld_portal_01_desc:1 "#F Étant l’un des rares vampires connaissant les Enfers, vous pouvez utiliser sa puissance à votre avantage.#!"
 building_underworld_portal_01:0 "Brèche dans les Enfers"
 building_underworld_portal_01_desc:1 "Les fantômes sont avides d'âmes. Autour de vous, ils ont tendance à avoir particulièrement faim de l’esprit de vos ennemis."
 building_type_pairidaeza_01:0 "Pairidaeza"
 building_type_pairidaeza_01_desc:1 "#F Vestiges du grand âge de la Perse Zoroastrienne, ces jardins sont une oasis pour les vampires qui s’accrochent à une foi lointaine.#!"
 building_pairidaeza_01:0 "Respectable Pairidaeza"
 building_pairidaeza_01_desc:1 "Un endroit pour se reposer et se souvenir de l’âge d’or perdu depuis bien longtemps. L’œil d’une tempête interne."
 building_type_unending_party_01:0 "Fête Eternelle"
 building_type_unending_party_01_desc:1 "#F La seule façon de se sentir vivant est de pousser tout à son extrême. Tout le temps.#!"
 building_unending_party_01:0 "Fête de l'Année"
 building_unending_party_01_desc:1 "De nombreux invités ne veulent tout simplement pas quitter votre festin. La plupart d’entre eux ne peuvent pas, de toute façon."
 building_type_fallen_church_01:0 "Église des Déchus"
 building_type_fallen_church_01_desc:1 "#F Votre âme est perdue depuis longtemps. Alors qu'ici, vous vous assurerez d'au moins sauver l’âme de tous les autres. Qu’ils le veuillent ou non.#!"
 building_fallen_church_01:0 "Autel des Déchus"
 building_fallen_church_01_desc:1 "Tant de cris ont été entendus ici, tant de demandes de miséricorde. Et, au final, si peu de rédemption."
 building_type_laboratory_01:0 "Laboratoire"
 building_type_laboratory_01_desc:1 "#F De nombreuses choses entrent ici. Peu en repartent. Certains font même partie du tout.#!"
 building_laboratory_01:0 "Laboratoire de chair"
 building_laboratory_01_desc:1 "Dans une œuvre d’art, il y a toujours un aperçu de l’artiste. Parfois, aussi un bout des 'amis' du créateur aussi."
 building_type_mother_garden_01:0 "Jardin de Lilith"
 building_type_mother_garden_01_desc:1 "#F Le véritable Eden se trouve seulement dans l’adoration de la première femme, celle trahie par Adam, Caine, et Dieu lui-même.#!"
 building_mother_garden_01:0 "Jardin de la Vierge"
 building_mother_garden_01_desc:1 "En tant que vierge, Lilith incite les autres à trouver la vérité cachée derrière le voile de la réalité."
 building_type_legacies_gathering_01:0 "Assemblée de Légendes "
 building_type_legacies_gathering_01_desc:1 "#F La plupart du temps, Laibon préfère discuter des choses avant d’agir dans la précipitation. Accueillir un tel rassemblement est une tâche prestigieuse.#!"
 building_legacies_gathering_01:0 "Grande Assemblée"
 building_legacies_gathering_01_desc:1 "Un nombre respectable de représentants des familles sont réunis ici, débattant de l’avenir de la région et au-delà."
 building_type_throne_room_01:0 "Salle du Trône"
 building_type_throne_room_01_desc:1 "#F Un souverain ne peut pas être jugé par la taille de sa salle du trône... Mais c'est d'une grande aidequand même.#!"
 building_throne_room_01:0 "Honorable Salle du Trône"
 building_throne_room_01_desc:1 "Ici, des décisions sont prises, des intrigues apparaissent et des jugements ont été rendus. J’espère par vous."
 building_type_influence_people_01:0 "Influencer le Peuple "
 building_type_influence_people_01_desc:1 "#F Du meilleur au pire, l'humanité est tout. En tant que tel, vous pouvez vous mêler à toutes les couches de la société et en tirer des leçons.#!"
 building_influence_people_01:0 "Grande Influence Populaire"
 building_influence_people_01_desc:1 "Chaque nuit, vous apprenez quelque chose de plus en partageant votre vie avec les humains. Cela vous rappelle comment ne pas devenir un monstre."
 building_type_influence_clergy_01:0 "Influencer le Clergé"
 building_type_influence_clergy_01_desc:1 "#F L’humanité est loin d’être parfaite, mais la foi de certains hommes dans le Divin ne peut être ignorée. Vous devez apprendre de tels hommes.#!"
 building_influence_clergy_01:0 "Grande Influence sur le Clergé"
 building_influence_clergy_01_desc:1 "Vous apprenez beaucoup des Hommes Saints, mais bien plus des hommes mauvais. Vous n’avez qu’à vous assurer de comprendre la différence entre les deux."
 building_type_crypt_01:0 "Crypte"
 building_type_crypt_01_desc:1 "#F Vos travaux exige un endroit adéquat et des outils particuliers. Et, de préférence, aussi un emplacement très calme et isolé où les voisins ne se plaindront pas.#!"
 building_crypt_01:0 "Grande Crypte"
 building_crypt_01_desc:1 "Seul dans l’obscurité, entouré de cadavres et d’abominations pourrissantes. La définition du paradis."
 building_type_assassins_cell_01:0 "Reéseau d'Assasin"
 building_type_assassins_cell_01_desc:1 "#F Les Enfants de Haqim disposent d’un vaste réseau d’agents, d’informateurs et d’autres outils utiles dans toutes les parties du monde.#!"
 building_assassins_cell_01:0 "Important Réseau"
 building_assassins_cell_01_desc:1 "La grande présence Haqimite dans cette zone vous permet d’avoir un échapatoire très utile pour vos projets plus... sournois."
 building_type_alamut_01:0 "Alamut"
 building_type_alamut_01_desc:1 "#F La redoutable forteresse cachée du clan Assamite est un rempart de foi, de force et de mensonges.#!"
 building_alamut_01:0 "Alamut Divisé"
 building_alamut_01_desc:1 "Tout comme le clan Assamite, Alamut est divisé entre différentes castes. Il faudra un investissement considérable pour remettre en état ce schisme."
 building_alamut_02:0 "Alamut Rétablie"
 building_alamut_02_desc:1 "Bien qu’il y ait encore des complots et des coups de poignards dans le dos, les pires explosions de violence ont été bannies de ces murs sacrés."
 building_alamut_03:0 "Alamut, Nid d'Aigle"
 building_alamut_03_desc:1 "Au moins ici, le clan Assamite montre sa parfaite cohésion et son dévouement à un but préçis, ce qui en fait une puissance effrayante à combattre."
 building_type_rome_01:0 "Rome"
 building_type_rome_01_desc:1 "#F Rome était autant le centre du monde caïnite que celui des Hommes. Le restaurer à la grandeur des ténébres serait une réalisation énorme.#!"
 building_rome_01:0 "Rome aux Mortels "
 building_rome_01_desc:1 "Des hommes saints rôdent dans les rues, contestant toute tentative de contrôle direct sur le centre du monde européen. A ce stade, Rome est un titre prestigieux pour son propriétaire, rien de plus."
 building_rome_02:0 "Rome Divisé"
 building_rome_02_desc:1 "Lentement, la foi de Rome s'affaiblit et les vampires peuvent à nouveau utiliser leur influence au profit du prince."
 building_rome_03:0 "Rome Eternelle"
 building_rome_03_desc:1 "Enfin, Rome est de nouveau entre des mains vampiriques. Les hommes saints rôdent dans l’obscurité tandis que les enfants de Caïn chantent les louanges du grand souverain qui a conquis la ville sacré."
 building_type_ceoris_01:0 "Ceoris"
 building_type_ceoris_01_desc:1 "#F La puissante forteresse des Tremere est à la fois un bastion et un centre d’apprentissage. C’est le meilleur atout du clan de Magus.#!"
 building_ceoris_01:0 "Ceoris Divisé"
 building_ceoris_01_desc:1 "Certains Tremeres sont encore des mortels de la Chantrie. Ils soupçonnent les intrigues des vampires et sont un obstacle constant aux plans du Conseil."
 building_ceoris_02:0 "Ceoris Controlé"
 building_ceoris_02_desc:1 "Comme leurs homologues mortels disparaissent ou sont convertis, les membres de la Chambre des Tremeres peuvent vraiment utiliser Ceoris à son plein potentiel."
 building_ceoris_03:0 "Ceoris Imprenable"
 building_ceoris_03_desc:1 "Tant que cette puissante forteresse se dresse, le clan Tremere ne peut pas tomber. En tout cas, de l’extérieur du moins..."
 building_type_carthage_01:0 "Carthage"
 building_type_carthage_01_desc:1 "#F Le rêve du clan Brujah est mort depuis longtemps, enterré par le vengeur Ventrue. Mais les rêves peuvent-t-ils vraiment disparaitre?#!"
 building_carthage_01:0 "Carthage Reconstruite"
 building_carthage_01_desc:1 "Une déclaration forte au monde, la reconstruction de la ville de Troile sera une affaire coûteuse, et remplie de dangers. Cependant la récompense en vaudrait la peine...
 building_carthage_02:0 "Nouvelle Carthage"
 building_carthage_02_desc:1 "Le pire cauchemar des Caïnites Romains est de voir Carthage revenir à la vie sous votre direction forte. Elle ne tombera pas à nouveau."
 building_carthage_03:0 "Carthage, le Rêve des Brujah"
 building_carthage_03_desc:1 "Un phare d’illumination et une vision de coopération entre les mortels et les Caïnites est de nouveau visibles à cet endroit."
 building_type_ombos_temple_01:0 "Temple Fondateur de Ombos"
 building_type_ombos_temple_01_desc:1 "#F Le cœur extravagant du clan Setite, Ombos est aussi le dernier lieu de repos de Set.#!"
 building_ombos_temple_01:0 "Ombos Occulté"
 building_ombos_temple_01_desc:1 "Ces derniers temps, Ombos a été considéré comme une relique d’une époque révolue par les jeunes Setites, sa légitimité est remise en question."
 building_ombos_temple_02:0 "Ombos Retrouvé"
 building_ombos_temple_02_desc:1 "Les réformes et les reconstructions ont restauré le temple, et l'ont placé au premier rang de l’âge actuel."
 building_ombos_temple_03:0 "Ombos Imposant"
 building_ombos_temple_03_desc:1 "Centre incontesté de toute une religion, Ombos est le berceau de pensées, d’adoration et de schémas. Comme il l’a toujours été."
 building_type_erciyes_01:0 "Erciyes"
 building_type_erciyes_01_desc:1 "#F La forteresse montagneuse du clan Cappadoce fut enlevée aux Malkaviens à l’époque classique. Depuis, c’est un centre d’apprentissage et de méditation.#!"
 building_erciyes_01:0 "Erciyes Isolé"
 building_erciyes_01_desc:1 "Loin de... tout, Erciyes est un endroit parfait pour la contemplation. Il a malheureusement tendance à faire oublier à ses les clients les menaces de l'extérieur."
 building_erciyes_02:0 "Ouverture d'Erciyes"
 building_erciyes_02_desc:1 "Comme les mentalités changent, le monde extérieur peut maintenant travailler dans la forteresse, le mont Erciyes devient un centre mondain d’apprentissage."
 building_erciyes_03:0 "Erciyes, Monastère des Ténébres"
 building_erciyes_03_desc:1 "Maintenant, le monastère est autant un lieu de répit que le centre d’un clan entier, la forteresse de la montagne voit son activité continuée, mais contrôlée."
 building_type_cathedral_of_flesh_01:0 "Cathédrale de Chair"
 building_type_cathedral_of_flesh_01_desc:1 "#F Cette abomination a été sculptée pendant des millénaires à partir de la chair des paysans, des esclaves, des rivaux, des bêtes, et d’un certain nombre d’autres victimes.#!"
 building_cathedral_of_flesh_01:0 "Cathédrale Hostile"
 building_cathedral_of_flesh_01_desc:1 "Entachée par la terre elle-même, la cathédrale est autant ennemie des intrus que de son propriétaire. Et perdre cette bataille, cela signifie en faire partie."
 building_cathedral_of_flesh_02:0 "Cathédrale Bouillonnante"
 building_cathedral_of_flesh_02_desc:1 "L’influence de Kupala s’atténue un peu, alors que la création monstrueuse commence à obéir à son propriétaire."
 building_cathedral_of_flesh_03:0 "Cathédrale Intimidé"
 building_cathedral_of_flesh_03_desc:1 "Kupala semble parti, pour le moment. La cathédrale est devenue un instrument de crainte que n’importe quel Kolduniste fou rêverait de manier."
 building_type_castel_del_ombro_01:0 "Chateau d'Ombro"
 building_type_castel_del_ombro_01_desc:1 "#F Il est impossible de dire de loin de quoi sont faits les murs, car des ombres animées rampent sur chaque surface dans un va et vient à peine perceptible. Chaque nuit, après le coucher du soleil, des marées d'ombres sortent et s’enroulent autour du château en spirale.#!"
 building_castel_del_ombro_01:0 "Tombe des Ténèbres"
 building_castel_del_ombro_01_desc:1 "Lieu de repos de l’Antédiluvien lui-même, le château est un endroit terrible, un rappel de l'aura autour de Lasombra."
 building_castel_del_ombro_02:0 "Chateau des Ténèbres"
 building_castel_del_ombro_02_desc:1 "Centre de la cour du sang, le château sert d’instrument judiciaire pour les anciens du clan."
 building_castel_del_ombro_03:0 "Chateau Ouvert"
 building_castel_del_ombro_03_desc:1 "L’ouverture des portes signifie que Lasombra lui-même est parti du château. Pendant ce temps, l’air de folie autour de lui s’estompe un peu, pour laisser le lieu servir de centre politique du clan."
 NOT_ITS_DEVELOPMENT_LEVEL_TRIGGER:1 "Cette zone a besoin de plus de développement! Regardez la description."
 building_type_rabble_thugs_01:0 "Racaille et Voyous"
 building_type_rabble_thugs_01_desc:1 "#F Parfois, vous devez oublier votre fierté et traiter avec des mortels peu recommandables pour obtenir rapidement quelques renforts bien nécessaires.#!"
 building_rabble_thugs_01:0 "Enrôler les Opprimés"
 building_rabble_thugs_01_desc:1 "Beaucoup de gens ne manqueront à personne. C'est le genre de personnes que vous pouvez utiliser pour créer à la hâte une force de combat."
 building_rabble_thugs_02:0 "Enrôler les Voyous "
 building_rabble_thugs_02_desc:1 "La racaille de rue est de peu d’utilité sur les champs de bataille. Cependant parfois, vous ne pouvez pas être regardant sur la qualité. \n Ce niveau nécessite plus de 5 en développement pour être cosntruit et rester actif."
 building_rabble_thugs_03:0 "Enrôler les Hors-la-loi"
 building_rabble_thugs_03_desc:1 "Les crriminels sont nombreux et avec au moins un minimum d’expérience de combat, ils sont suffisant pour être jeté en pature. \n Ce niveau nécessite plus de 15 en développement pour ëtre construit et rester actif."
 building_type_sherwood_01:0 "Forêt de Sherwood"
 building_type_sherwood_01_desc:1 "#F C’est ici que le mouvement des Furores est né et prospérera pendant des siècles. Un répit durement gagné des tyrans de la nuit.#!"
 building_sherwood_01:0 "Sherwood Contrôlé"
 building_sherwood_01_desc:1 "Robin Leeland a lutté contre Sherwood sous le nez de Mithras et l’a tenu pendant des siècles. Cet exploit audacieux contre un si vieux tyran a incité les Furores à se rassembler et à lutter pour la cause."
 building_sherwood_02:0 "Sherwood Étendue"
 building_sherwood_02_desc:1 "Les hommes et les femmes libres de Sherwood se battent maintenant à l’extérieur de la forêt, ce qui rend Robin fier de ses disciples."
 building_sherwood_03:0 "Sherwood Triomphant"
 building_sherwood_03_desc:1 "Même en étant éloignés, les tyrans tremblent devant la simple mention des courageux défenseurs de Sherwood, des tueurs de despotes et des guerriers de la liberté."
 building_type_vigiles_francia_01:0 "Vigiles Francs"
 building_type_vigiles_francia_01_desc:1 "#F Créés par Salianna en tant que corps d’élite spécial, les Vigiles sont un groupe de chevaliers dévoués, à la fois caïnites et goules, parcourant le royaume pour leur seigneur.#!"
 building_vigiles_francia_01:0 "Vigiles Francs : Passif"
 building_vigiles_francia_01_desc:1 "Les Vigiles Francs, corps d’élite des Chevaliers Toreador et des Goules, se tiennent prêts à répondre à toute menace contre les dirigeants français de la nuit."
 building_vigiles_francia_02:0 "Vigiles Francs : Pro-actif"
 building_vigiles_francia_02_desc:1 "Les Vigiles ont pris sur eux de chasser tous les fauteurs de troubles potentiels avant même d’arriver, améliorant leur contrôle sur les territoires."
 building_vigiles_francia_03:0 "Vigiles Francs : Omniprésent"
 building_vigiles_francia_03_desc:1 "Une puissance toujours croissante idéalisant le code chevaleresque, les Vigiles sont maintenant la principale ressource et force de tout empereur caïnite français."
 building_type_inquisition_fortress_01:0 "Forteresse de l'Inquisition"
 building_type_inquisition_fortress_01_desc:1 "#F De là, des hommes et des femmes d’un grand courage se dressent contre l’obscurité.#!"
 building_inquisition_fortress_01:0 "Fort de l’Inquisition"
 building_inquisition_fortress_01_desc:1 "Ils ne sont peut être pas nombreux, leurs défenses sont certes risibles, mais ont peut voir à travers leurs coeurs la lumière du sanctuaire."
 building_inquisition_fortress_02:0 "Bastion de l'Inquisition"
 building_inquisition_fortress_02_desc:1 "Ici, une petite partie du monde a été reconquise par les forces du bien."
 building_inquisition_fortress_03:0 "Haut lieu de l'Inquisition"
 building_inquisition_fortress_03_desc:1 "Regardez cette forteresse indomptable de lumière, de serviteurs de l’enfer et de désespoir."
 building_type_shrine_of_telyavel_01:0 "Sanctuaire de Telyavel"
 building_type_shrine_of_telyavel_01_desc:1 "#F Le dieu forgeron n’est pas intéressé par les affaires des mortelles, ou des immortelles d'ailleurs. À moins d'y mettre le prix...#!"
 building_shrine_of_telyavel_01:0 "Sanctuaire symbolique de Telyavel"
 building_shrine_of_telyavel_01_desc:1 "Sans la bénédiction de Dieu, ce sanctuaire reste tout de même un puissant cri de ralliement pour un monde païen mourant."
 building_shrine_of_telyavel_02:0 "Sanctuaire éveillé de Telyvael"
 building_shrine_of_telyavel_02_desc:1 "Le Dieu forgeron observe ses fidèles, intrigué par leur engagement renouvelé pour sa cause."
 building_shrine_of_telyavel_03:0 "Bosquet des Ombres"
 building_shrine_of_telyavel_03_desc:1 "Maintenant un lien direct c'est créé le royaume de Dieu, beaucoup de champions viennent ici pour gagner sa bénédiction divine."
 building_type_giovanni_mausoleum_01:0 "Le Mausolée de Giovanni"
 building_type_giovanni_mausoleum_01_desc:1 "#F Beaucoup de gens entrent ici. Très peu en repartent.#!"
 building_giovanni_mausoleum_01:0 "Petit Mausolée de Giovanni"
 building_giovanni_mausoleum_01_desc:1 "La famille Giovanni est encore jeune, et est toujours très concentrée sur ses études sur la mort et l’âme."
 building_giovanni_mausoleum_02:0 "Mausolée de Giovanni Respectable"
 building_giovanni_mausoleum_02_desc:1 "Lentement, les Nécromanciens tournent leurs regards vers l’extérieur, intéressés par les opportunités que leur offrent leur nouvelle condition."
 building_giovanni_mausoleum_03:0 "Immense Mausolée de Giovanni"
 building_giovanni_mausoleum_03_desc:1 "Les Italiens sont maintenant une force avec laquelle il faut compter. Toujours de puissants nécromanciens, mais ils sont aussi capables de jouer le jeu politique de la cour."
 building_type_pit_of_malkav_01:0 "Fosse de Malkav"
 building_type_pit_of_malkav_01_desc:1 "#F Une brèche ouverte se trouve en dessous de Jérusalem. Rien que le fait de se rapprocher rend chacun de vos mouvements douloureux. Votre tête a l’impression qu’elle est sur le point d’exploser.#!"
 building_pit_of_malkav_01:0 "Fosse à ciel ouvert de Malkav"
 building_pit_of_malkav_01_desc:1 "Tant de voix qui disent tant de choses contradictoires... même si vous pouvez toutefois entrevoir un léger bout de sagesse dans certaines d’entre elles."
 building_pit_of_malkav_02:0 "Fosse dissimulée de Malkav"
 building_pit_of_malkav_02_desc:1 "Vous avez jeté des pierres dans la fosse et les voix sont moins frénétiques maintenant. Vous êtes plus en mesure de les comprendre."
 building_pit_of_malkav_03:0 "Fosse fermée de Malkav"
 building_pit_of_malkav_03_desc:1 "Les voix sont calmes maintenant, sauf si vous êtes trop proche de la fosse. Restez à bonne distance vous permet de calmer vos pulsions avec facilité maintenant."
 building_type_well_of_sacrifice_01:0 "Puits des Sacrifices"
 building_type_well_of_sacrifice_01_desc:1 "#F L’Enfer est sur Terre, il est juste ici.#!"
 building_well_of_sacrifice_01:0 "Puits Mineur de Sacrifice "
 building_well_of_sacrifice_01_desc:1 "Une fois jetés dans la fosse, celle-ci arrêtent de se lamenter. Cela vous attriste."
 building_well_of_sacrifice_02:0 "Puits Majeur de Sacrifice"
 building_well_of_sacrifice_02_desc:1 "Tant d’autres auraient besoin de sentir le vide éternel et sa faim éternelle."
 building_well_of_sacrifice_03:0 "Puits Infernal de Sacrifice"
 building_well_of_sacrifice_03_desc:1 "Bientôt Ils se réveilleront. Bientôt Ils viendront. Et alors, tous comprendront."
 building_type_london_mithraeum_01:0 "Londres Mithraeum"
 building_type_london_mithraeum_01_desc:1 "#F L’un des plus anciens temple de la foi mithraïque, toujours tenu par les disciples du Dieu Soleil.#!"
 building_london_mithraeum_01:0 "Mithraeum Caché"
 building_london_mithraeum_01_desc:1 "Craignant la Croix, les fidèles se rassemblent dans l’ombre de leur gloire passée."
 building_london_mithraeum_02:0 "Renaissance de Mithraeum"
 building_london_mithraeum_02_desc:1 "C’est maintenant un secret de polichinelle que les fidèles de Mithra prient ici, cherchant le salut promis par le Dieu de la Lumière."
 building_london_mithraeum_03:0 "Mithraeum Triomphant"
 building_london_mithraeum_03_desc:1 "Il est temps que la Croix se cache, car la vraie foi de ces terres est revenue !"
 building_type_influence_law_01:0 "Influencer les Législateurs"
 building_type_influence_law_01_desc:1 "#F Évidemment, vous êtes au-dessus de la loi des mortelles. Mais avoir des agents à l’intérieur des forces garant de l’ordre public dans ce comté pourrait être bénéfique.#!"
 building_influence_law_01:0 "Légère Influence sur les Législateurs"
 building_influence_law_01_desc:1 "Une suggestion chuchoté à l'oreille des bonnes personnes peut être un bon moyen pour garder le peuple apaisé."
 building_influence_law_02:0 "Forte Influence sur les Législateurs"
 building_influence_law_02_desc:1 "Vous exercez une forte pression sur le système judiciaire. Assez forte pour vous en sevrir dans de nombreuses situations."
 building_influence_law_03:0 "Influence Totale sur les Législateurs"
 building_influence_law_03_desc:1 "Vous l’avez deviné : à ce stade, vous êtes la loi."
 building_type_haven_defenses_01:0 "Défense du Repaire"
 building_type_haven_defenses_01_desc:1 "#F Ce n’est pas juste de la paranoïa, vos ennemis viendront pour vous un jour ou l'autre. Et vous feriez mieux d’avoir un plan d’urgence quand cela arrivera.#!"
 building_haven_defenses_01:0 "Légère Défense du Repaire"
 building_haven_defenses_01_desc:1 "Certains pièges et agents fiables dispersés à travers le comté sont un bon début à toute défense digne de ce noms."
 building_haven_defenses_02:0 "Forte Défense du Repaire"
 building_haven_defenses_02_desc:1 "Vous êtes prêt pour le pire, votre plan d’urgence a son propre plan d’urgence."
 building_haven_defenses_03:0 "Massif Défense du Repaire"
 building_haven_defenses_03_desc:1 "They will have to bring an entire raiding party to bring you down!"
 building_type_remote_haven_01:0 "Repaire Isolé"
 building_type_remote_haven_01_desc:1 "#F Parfois, il suffit de prendre un peu de recul pour planifier son prochain mouvement, loin des regards indiscrets.#!"
 building_remote_haven_01:0 "Repaire Isolé et Clairsemé"
 building_remote_haven_01_desc:1 "Cette abris est loin de tout signe de civilisation. C’est probablement son seul avantage."
 building_remote_haven_02:0 "Confortable Repaire Isolé"
 building_remote_haven_02_desc:1 "Ce n’est pas votre cour, mais suffisament spacieux pour de courtes vacances."
 building_remote_haven_03:0 "Luxieux Repaire Isolé"
 building_remote_haven_03_desc:1 "Votre maison loin de toutes habitations, parfaitement sûr et convenablement préparé pour vos goûts exquis."
 building_type_mercenary_company_01:0 "Influencer les Mercenaires"
 building_type_mercenary_company_01_desc:1 "#F Les mortels ont développé l’idée de "Mercenaires", des soldats expérimentés à embaucher. C’est certainement quelque chose que vous pourriez utiliser pour votre bénéfice personnel.#!"
 building_mercenary_company_01:0 "Légère Influence sur les Mercenaires"
 building_mercenary_company_01_desc:1 "Vous avez des liens avec un groupe local. Assez pour vous donner des possibilités."
 building_mercenary_company_02:0 "Forte Influence sur les Mercenaires"
 building_mercenary_company_02_desc:1 "Vous pouvez compter sur un groupe chevronné de soldats pour défendre vos intérêts sur ce territoire."
 building_mercenary_company_03:0 "Influence Totale sur les Mercenaires"
 building_mercenary_company_03_desc:1 "Les mercenaires sont maintenant votre armée de défense privée."
 building_type_influence_barracks_01:0 "Influencer les Casernes"
 building_type_influence_barracks_01_desc:1 "#F Les armées professionnelles font leur retour dans la société humaine. Une occasion rare pour les Caïnites d’influencer certains guerriers chevronnés à leur cause.#!"
 building_influence_barracks_01:0 "Légère Influence sur les Casernes"
 building_influence_barracks_01_desc:1 "Certains des soldats de la région reçoivent une paie de votre part. Ils deviennent des alliés utiles dans les moments difficiles."
 building_influence_barracks_02:0 "Forte Influence sur les Casernes"
 building_influence_barracks_02_desc:1 "La plupart des membres de l’armée régionale connaissent votre nom, ou travaillent pour quelqu’un qui le connaît."
 building_influence_barracks_03:0 "Influence Totale sur les Casernes"
 building_influence_barracks_03_desc:1 "L’armée locale sait qui est son vrai maître. Et ce n’est certainement pas un noble local pompeux."
 building_type_influence_burghers_01:0 "Influencer les Bourgeois"
 building_type_influence_burghers_01_desc:1 "#F Une nouvelle classe sociale émerge dans le monde des mortels. Ces 'bourgeois' ont beaucoup d’argent mais peu de pouvoir militaire réel. Une cible parfaite pour vos transactions douteuses.#!"
 building_influence_burghers_01:0 "Légère Influence sur les Bourgeois"
 building_influence_burghers_01_desc:1 "Vous avez fait quelques tentative de corruption dans la classe commerçante.  \n Ce niveau nécessite plus de en 10 développement pour être construit et rester actif."
 building_influence_burghers_02:0 "Forte Influence sur les Bourgeois"
 building_influence_burghers_02_desc:1 "En tant que mécène de certains des marchands les plus riches de la région, vous en tirez des profits considérables. \n Ce niveau nécessite plus de 15 en développement pour ëtre construit et rester actif."
 building_influence_burghers_03:0 "Influence Totale sur les Bourgeois"
 building_influence_burghers_03_desc:1 "L’argent circule dans une seule direction par ici, dans vos poches.  \n Ce niveau nécessite plus de 20 en développement pour ëtre construit et rester actif."
 #building_type_inquisition_church_01:0 "Eglise de l'Inquisition"
 #building_type_inquisition_church_01_desc:1 "#F Les fidèles ont besoin d’un lieu de rassemblement libre de l’influence de ces sangsues.#!"
 #building_inquisition_church_01:0 "Chapelle de l'Inquisition"
 #building_inquisition_church_01_desc:1 "Un petit lieu paisible protégé par les Chevaliers de Dieu. Une oasis dans un désert."
 #building_inquisition_church_02:0 "Basilique de l'Inquisition"
 #building_inquisition_church_02_desc:1 "Ici, l’influence corruptrice des vampires est tenue à distance."
 #building_inquisition_church_03:0 "Cathédrale de l'Inquisition"
 #building_inquisition_church_03_desc:1 "Un phare de lumière dans un monde d’obscurité. Le premier d’une longue série, espérons-le."
 building_type_oculi_cell_01:0 "Réseau de l'Oculi Dei"
 building_type_oculi_cell_01_desc:1 "#F L’œil vigilant de l’Inquisition ne dort jamais.#!"
 building_oculi_cell_01:0 "Petit Réseau de l'Oculi Dei"
 building_oculi_cell_01_desc:1 "Ils connaissent les secrets de vos ennemis... et de vos amis aussi."
 building_oculi_cell_02:0 "Grand Réseau de l'Oculi Dei"
 building_oculi_cell_02_desc:1 "Tu ne les vois pas, mais eux ils te voient."
 building_oculi_cell_03:0 "Immense Réseau de l'Oculi Dei"
 building_oculi_cell_03_desc:1 "Ils voient... tout !"
 building_type_knights_patrol_01:0 "Ordre des Chevaliers d’Acre"
 building_type_knights_patrol_01_desc:1 "#F La fidèle Épée de Dieu patrouille dans les rues, une présence rassurante pour les innocents.#!"
 building_knights_patrol_01:0 "Petit Ordre des Chevaliers d'Acre"
 building_knights_patrol_01_desc:1 "Une bande de chevaliers s’entraîne et patrouille par ici, leur bravoure compensant leur petit nombre."
 building_knights_patrol_02:0 "Grand Ordre des Chevaliers d'Acre"
 building_knights_patrol_02_desc:1 "La population est enhardie par la vision des fidèles soldats du Christ qui s'entraînent et patrouillent."
 building_knights_patrol_03:0 "Puissant Ordre des Chevaliers d'Acre"
 building_knights_patrol_03_desc:1 "Prêts à frapper à tout moment, la présence des Chevaliers dans cette province est sans faiblesse."
 building_type_fortress_cross_01:0 "Forteresse de la Croix"
 building_type_fortress_cross_01_desc:1 "#F La maison mère des Chevaliers d’Acre, fortement fortifiée, est peut-être la forteresse la plus impressionnante de l’Inquisition.#!"
 building_fortress_cross_01:0 "Forteresse de la Croix Isolé"
 building_fortress_cross_01_desc:1 "Imposant, le siège des Chevaliers d’Acre manque tout de même du pouvoir politique de certains autres lieux saints de l’Inquisition."
 building_fortress_cross_02:0 "Forteresse Animée de la Croix"
 building_fortress_cross_02_desc:1 "Reconnue comme un important lieu de pèlerinage pour tous les aspirants inquisiteurs, la forteresse est maintenant le centre de formation de l’élite."
 building_fortress_cross_03:0 "Véritable Forteresse de la Croix"
 building_fortress_cross_03_desc:1 "Avec le fragment de la Vraie Croix bénissant ses murs, la Forteresse est maintenant un phare de lumière indomptable."
 building_type_st_scholastica_01:0 "St. Scholastica"
 building_type_st_scholastica_01_desc:1 "#F La deuxième patronne la plus importante de l’Ordre rouge était la sœur jumelle de saint Benoît, une femme déterminée mais pieuse.#!"
 building_st_scholastica_01:0 "Couvent de St. Scholastica"
 building_st_scholastica_01_desc:1 "Le couvent le plus important des Sœurs Rouges est un endroit étrange où les sœurs ont beaucoup plus de liberté que la plupart de leurs frères cléricaux."
 building_st_scholastica_02:0 "Bibliothèque de St. Scholastica"
 building_st_scholastica_02_desc:1 "L’une des plus grandes bibliothèques de l’Inquisition, elle abrite également une collection d'écrits interdites. Seules les sœurs les plus pieuses peuvent y accéder."
 building_st_scholastica_03:0 "Artéfacts de St. Scholastica"
 building_st_scholastica_03_desc:1 "Pour combattre l’Ennemi, l’Ordre Rouge n'hésite pas à utiliser des méthodes peu orthodoxe. C’est grâce à cela qu’ils ont trouvé leurs armes les plus redoutables."
 building_type_castle_von_murnau_01:0 "Citadelle von Murnau"
 building_type_castle_von_murnau_01_desc:1 "#F La maison ancestrale de la célèbre famille des Inquisiteurs. Un lieu de culte et de guerre.#!"
 building_castle_von_murnau_01:0 "Manoir von Murnau"
 building_castle_von_murnau_01_desc:1 "Luxueux et bien placé, le manoir est bien intégré dans le paysage politique de la noblesse allemande."
 building_castle_von_murnau_02:0 "Château von Murnau"
 building_castle_von_murnau_02_desc:1 "Avec une aile spécialement réservée aux affaires de l’Inquisition, le château von Murnau est devenu un lieu de repos important pour les chasseurs itinérants."
 building_castle_von_murnau_03:0 "Forteresse von Murnau"
 building_castle_von_murnau_03_desc:1 "Prête à se défendre contre toute menace, la forteresse résiste aux sbires des ténébres. Témoignage de la bénédiction d’une famille."
 building_type_the_nest_01:0 "Les Galeries"
 building_type_the_nest_01_desc:1 "#F La paranoïa de Rodrigue l'a fait construire ce labyrinthe de tunnels sous Pampelune, espérant s'en servir comme effet de surprise contre les maudits suceurs de sang.#!"
 building_the_nest_01:0 "Petite Galerie Souterainne"
 building_the_nest_01_desc:1 "Bien construit, mais encore petit, le Nest sert principalement de moyen sécurisé de partager des informations pour les Chevaliers de St-James."
 building_the_nest_02:0 "Large Galerie Souterraine"
 building_the_nest_02_desc:1 "Le réseau de tunnels et d’espions de Rodrigue, qui couvre la majeure partie de Pampelune, est aujourd’hui un atout formidable pour l’Inquisition ibérique."
 building_the_nest_03:0 "Immense Galerie Souterraine"
 building_the_nest_03_desc:1 "Tout ennemi de St-James qui entre dans Pampelune n'a aucune chance d'en sortir vivant. Le réseau de Rodrigue est maintenant paré à gérer n'importe quel situation."
 building_type_st_cecila_01:0 "Couvent de Sainte-Cécile"
 building_type_st_cecila_01_desc:1 "#F Le siège de formation des Sœurs de St-Jean est un lieu de calme et de contemplation dans un océan de visions désespérantes.#!"
 building_st_cecila_01:0 "Hôpital de Sainte-Cécile"
 building_st_cecila_01_desc:1 "Tous les inquisiteurs blessés dans les îles britanniques savent et remercient les sœurs présentes ici pour leurs soins."
 building_st_cecila_02:0 "Les Exorcistes de Sainte-Cécile"
 building_st_cecila_02_desc:1 "Les exorcistes les plus habiles de l’Inquisition sont formés à Sainte-Cécile. Aucun esprit surnaturel ne peut résister à leur appel, qu’il soit de paix ou de guerre."
 building_st_cecila_03:0 "Inquisiteurs de Sainte-Cécile"
 building_st_cecila_03_desc:1 "Les Sœurs sont des femmes de paix, mais elles savent que l’Ennemi ne l’est pas. Les quelques-unes qui choisissent de consacrer leur vie à la guerre sont d’un esprit et d’une piété redoutables."
 building_type_everard_players_01:0 "Joueurs d'Everard"
 building_type_everard_players_01_desc:1 "#F La célèbre troupe d’artistes d’Everard d’Arras est en fait l’un des plus importants atouts de l’Oculi Dei, les espions de l’Inquisition.#!"
 building_everard_players_01:0 "Le Courtois d'Arras"
 building_everard_players_01_desc:1 "L’une des pièces de Jean Bodel est une variation du récit biblique du Fils prodigue."
 building_everard_players_02:0 "Pièce de St. Nicholas"
 building_everard_players_02_desc:1 "Où un saint pieux est chargé de l’or du roi païen."
 building_everard_players_03:0 "Fidèle Gerner"
 building_everard_players_03_desc:1 "La troupe est en fait secrètement protégée par l’épée des chevaliers de St. James. Une telle aubaine a souvent aidé les acteurs à ignorer." 
 building_type_ipeasants_01:0 "Contrôler les terres agricoles"
 building_type_ipeasants_01_desc:1 "#F Les gens honnêtes et qui craignent Dieu travaillant dans les champs sont l’épine dorsale de ce royaume et de notre lutte.#!"
 building_ipeasants_01:0 "Sermonner les paysans"
 building_ipeasants_01_desc:1 "Les serfs sont facilement impressionnés par les membres des classes supérieures, l’envoi de nos agents parmi eux est un moyen sûr de recueillir leur soutien"
 building_ipeasants_02:0 "Radicaliser les Paysans"
 building_ipeasants_02_desc:1 "Les habitants sont craintifs, mais impressionnés par votre zèle, ils peuvent être transformés en alliés fidèles à notre cause. \n Ce niveau nécessite plus de 5 en développement pour être construit et rester actif."
 building_ipeasants_03:0 "Former la Milice Paysanne"
 building_ipeasants_03_desc:1 " Contre les forces de l’obscurité, le peuple des terres agricoles peut être transformé en une force organisée soumise à notre autorité. \n Ce niveau nécessite plus de 10 en développement pour être construit et rester actif."
 building_ipeasants_04:0 "Été. Récolte. Guerre."
 building_ipeasants_04_desc:1 "Les cœurs de la paysannerie brûlent d'une rage juste. Ils sont le troupeau en colère de Dieu et nous sommes leurs bergers. \n Ce niveau nécessite plus de 25 en développement pour être construit et rester actif."
 building_type_ieducation_01:0 "Contrôler l’éducation religieuse"
 building_type_ieducation_01_desc:1 "#F En aidant à enseigner la parole de Dieu aux habitants, nous pouvons les aider à devenir plus pieux, alphabétisés et sympathiques et donc les rallier à notre cause.#!"
 building_ieducation_01:0 "Financer les Ecoles du Dimanche"
 building_ieducation_01_desc:1 "Les enfants du peuple doivent être conscients de l’importance de notre mission, au moins de sa nature exacte."
 building_ieducation_02:0 "Financer le Séminaire"
 building_ieducation_02_desc:1 "Sous notre subtile direction, les futures générations de prêtres éduqués ici seront acquises à notre cause. \n Ce niveau nécessite plus de 10 développements pour être être construit et rester actif."
 building_ieducation_03:0 "Financer l’Université de Théologie"
 building_ieducation_03_desc:1 "C’est là que les savants de l’Église façonnent son avenir. Notre influence ici nous assurera la confiance des prêtres. \n Ce niveau nécessite plus de 20 en développement pour être construit et rester actif."
 building_ieducation_04:0 "Théologie armée "
 building_ieducation_04_desc:1 "Grâce au contrôle total de toutes les questions relatives à l'enseignement religieux, les définitions mêmes du bien et du mal sont adaptées à nos besoins.\n Ce niveau nécessite plus de 30 en développement pour être construit et rester actif." 
 building_type_ioutskirts_01:0 "Contrôler les périphéries"
 building_type_ioutskirts_01_desc:1 "#F Une fois apprivoisé, le terrain local peut couvrir nos mouvements.#!"
 building_ioutskirts_01:0 "Accès aux forêts royale"
 building_ioutskirts_01_desc:1 "Les terrains de chasse sont la propriété exclusive de la famille régnante, insister pour avoir l’accès nous permettrais de patrouiller et de rencontrer les passants."
 building_ioutskirts_02:0 "Obtenir la réhabilitation des braconniers"
 building_ioutskirts_02_desc:1 "Les forêts abritent des braconniers, des hors-la-loi non par choix, mais par nécessité. Leur expertise du terrain en vaut la peine. \n Ce niveau nécessite plus de 5 en développement pour être cosntruit et rester actif."
 building_ioutskirts_03:0 "Obtenir des Droits de Chasse"
 building_ioutskirts_03_desc:1 "Grâce à la corruption, la menace et l'intervention d'autorités supérieures, nous pouvons lutter contre le contrôle officiel des forêts loin de la régementation locale. /n Ce niveau nécessite plus de 10 en développement pour être être construit et rester actif."
 building_ioutskirts_04:0 "Seigneur des Bois"
 building_ioutskirts_04_desc:1 "Il n'y a pas un seul chasseur, herboriste, cueilleur de baies ou ermite vivant dans la nature sauvage locale qui ne soit pas notre agent. \n Ce niveau nécessite plus de 25 en développement pour être construit et rester activé."
 building_type_itownsfolk_01:0 "Controler les Citadins"
 building_type_itownsfolk_01_desc:1 "#F Ici les gens se rassemblent et l’argent va de mains en mains, notre cause exige d'être présent.#!"
 building_itownsfolk_01:0 "Prêcheurs de Rue"
 building_itownsfolk_01_desc:1 "Là où les gens prétendent être décents, la prédication contre le péché et la débauche pourrait dans des mains plus ou moins sympatique à notre cause."
 building_itownsfolk_02:0 "Indulgence pour les Marchands"
 building_itownsfolk_02_desc:1 "Le pardon de l’Église ne coûte pas cher. Nous avons les moyens de le rendre moins cher encore et les marchands apprécient beaucoup. \n Ce niveau nécessite plus de 10 en développement pour être construit et rester actif."
 building_itownsfolk_03:0 "Recruter un Dirigeant "
 building_itownsfolk_03_desc:1 "Si ce n’est pas par la foi, alors cela sera par des promesses de liens, les chefs des artisans peuvent être transformés en agents précieux. \n Ce niveau nécessite plus de 15 en développement pour être construit et rester actif."
 building_itownsfolk_04:0 "Sainte Entreprise"
 building_itownsfolk_04_desc:1 "Les marchands et artisans de cette ville sont devenus beaucoup plus pieux depuis le jour de notre arrivée. Il semble quasiment qu'il n'y ait pas de place ici pour les moins dévots pour faire des affaires. \n Ce niveau nécessite plus de en 30 développement pour être construit et rester activé."
 building_type_iunderworld_01:0 "Contrôlez le Monde Souterrain"
 building_type_iunderworld_01_desc:1 "#F Le royaume des ombres est là où nos ennemis demeurent. La coopération avec ses mortels n'est pas plaisante, mais nécessaire.#!"
 building_iunderworld_01:0 "Aider les Mendiants et les Gamins"
 building_iunderworld_01_desc:1 "Les bonnes personnes détournent leur regard des misérables. C’est en partie ce qui fait d’eux des atouts inestimables."
 building_iunderworld_02:0 "Convertir les Criminels de Droit Commun"
 building_iunderworld_02_desc:1 "La société a fermé ses portes à ces voyous, voleurs et escrocs, mais nous en avons encore besoin. \n Ce niveau nécessite plus de 10 développements pour être contruit et rester actif."
 building_iunderworld_03:0 "Infiltrer le Crime Organisé"
 building_iunderworld_03_desc:1 "Des accords avec les hauts membres de la société criminelle sont vouées à nous compromettre, mais leurs atouts pourraient très bien en valoir la peine. \n Ce niveau nécessite plus de 15 en développement pour être contruit et rester actif."
 building_iunderworld_04:0 "Vice sanctionné"
 building_iunderworld_04_desc:1 "Les hommes sont pécheurs et ce n'est pas notre priorité de mettre au chômage ceux qui vivent de ce fait. Tant qu'ils contribuent à la cause. \n Ce niveau nécessite plus de 30 en développement pour être construit et rester activé." 
 building_type_igarrison_01:0 "Contrôler la Garnison"
 building_type_igarrison_01_desc:1 "Les hommes armés de cette colonie sont à l’affût des ennemis de leur seigneur. Nous pourrions détourner leur attention vers des choses plus sinistres.#!"
 building_igarrison_01:0 "Aidez les Veilleurs Nocturnes"
 building_igarrison_01_desc:1 "Le travail d’un gardien n’est jamais terminé, l’aide de nos agents serait grandement appréciés."
 building_igarrison_02:0 "Recruter des Officiers de Garnison"
 building_igarrison_02_desc:1 "Les bons soldats ne posent pas de questions lorsqu’ils reçoivent des ordres de leurs officiers. Cela rend ces derniers essentiel à notre cause. \n Ce niveau nécessite plus de 5 en développement pour être construit et rester actif."
 building_igarrison_03:0 "Contrôle de la Garnison"
 building_igarrison_03_desc:1 "Par tous les moyens disponibles, nous obtiendrons l’obéissance des plus hauts commandants de cette garnison. \n Ce niveau nécessite plus de 10 en développement pour être contruit et rester actif."
 building_igarrison_04:0 "Bastion de la Foi"
 building_igarrison_04_desc:1 "Les soldats de tous grades stationnés dans cette ville s'inclinent devant nos représentants, remplis de fierté de leur mission sacrée de les protéger.\n Ce niveau nécessite plus de 30 en développement pour être construit et rester actif."
 building_type_inquisition_church_01:0 "Eglise de l'Inquisition"
 building_type_inquisition_church_01_desc:1 "#F Les fidèles ont besoin d'un lieu de rassemblement libre de l'influence des sangsues, nos frères et sœurs, un lieu de contemplation.#!"
 building_inquisition_church_01:0 "Chapelle de l'Inquisition"
 building_inquisition_church_01_desc:1 "Un petit endroit paisible protégé par les Chevaliers de Dieu. Une oasis dans un désert."
 building_inquisition_church_02:0 "Eglise de l'Inquisition"
 building_inquisition_church_02_desc:1 "Ici, l'influence corruptrice des vampires est tenue à distance."
 building_inquisition_church_03:0 "Cathédrale de l'Inquisition"
 building_inquisition_church_03_desc:1 "Un phare de lumière dans un monde de ténèbres. Le premier de beaucoup, espérons-le."
 building_inquisition_church_04:0 "Arche-cathédrale de l'Inquisition"
 building_inquisition_church_04_desc:1 "Monument à notre dévotion, il domine la terre comme un défi aux forces du mal."
 building_type_inquisition_office_01:0 "Office de l'Inquisition"
 building_type_inquisition_office_01_desc:1 "#F Un endroit pour diriger notre administration loin des regards indiscrets.#!"
 building_inquisition_office_01:0 "Bureaux d'Office"
 building_inquisition_office_01_desc:1 "Un espace bien caché pour stocker et traiter nos documents."
 building_inquisition_office_02:0 "Bureaux éloignés"
 building_inquisition_office_02_desc:1 "Une modeste maison où nous pouvons coordonner nos efforts sans attirer l’attention."
 building_inquisition_office_03:0 "Bâtiment Administratif"
 building_inquisition_office_03_desc:1 "Un bâtiment de bureaux impressionnant dans le plus luxueux district de la ville où les habitants les plus riches et les plus influents viennent faire affaires."
 building_inquisition_office_04:0 "Quartier Géneral"
 building_inquisition_office_04_desc:1 "Une section de la ville exclusive à nos frères et sœurs. Elle montre notre emprise sur les affaires locales et régionales."
 building_type_inquisition_palace_01:0 "Palais de l'Inquisition"
 building_type_inquisition_palace_01_desc:1 "#F Un endroit où nos chevaliers se rassemblent, s’entraînent et festoient.#!"
 building_inquisition_palace_01:0 "Cabane de Chasseur"
 building_inquisition_palace_01_desc:1 "Un domaine reculé approprié pour le passe-temps préféré de chaque chevalier."
 building_inquisition_palace_02:0 "Manoir Inquisitorial"
 building_inquisition_palace_02_desc:1 "Une résidence élégante où l’hospitalité répond aux plus hauts standards."
 building_inquisition_palace_03:0 "Palais de l'Inquition"
 building_inquisition_palace_03_desc:1 "Un magnifique palais, témoignage de la noblesse de notre cause. Peu de nobles de cette terre envisageraient de refuser une invitation."
 building_inquisition_palace_04:0 "Grand Palace de l'Inquisition"
 building_inquisition_palace_04_desc:1 "Notre vénérable, opulente et impériale maison est respecté de tous. Parfaite pour accueillir les rois, les empereurs et le Saint-Père lui-même."
 building_type_inquisition_armory_01:0 "Armurerie de l’Inquisition"
 building_type_inquisition_armory_01_desc:1 "#F Le maintien d’une présence militaire importante dans cette région exige une infrastructure adéquate.#!"
 building_inquisition_armory_01:0 "Caches d'Armes"
 building_inquisition_armory_01_desc:1 "Peu de nos agents ne sont pas armés, mais certaines tâches nécessitent un équipement plus lourd."
 building_inquisition_armory_02:0 "Arsenal de l'Inquisition"
 building_inquisition_armory_02_desc:1 "Ces couloirs remplis d’armes et d’armures assurent notre préparation si l’obscurité se fait sentir."
 building_inquisition_armory_03:0 "Ateliers d’Armes d'Inquisiteur"
 building_inquisition_armory_03_desc:1 "Produire notre propre équipements est le meilleur moyen de s’assurer qu’ils répondent aux exigences particulières de notre mission."
 building_inquisition_armory_04:0 "Académie Militaire de l'Inquisition"
 building_inquisition_armory_04_desc:1 "Dans ce vaste ensemble d’installations militaires, nos chevaliers sont capables de transformer des roturiers en redoutables armes contre le mal."
 building_type_inquisition_keep_01:0 "Château de l’Inquisition"
 building_type_inquisition_keep_01_desc:1 "#F Un endroit pour garder toutes sortes de choses en sécurité, que ce soit nous-mêmes, nos prisonniers ou nos secrets.#!"
 building_inquisition_keep_01:0 "Tour de l’Inquisition"
 building_inquisition_keep_01_desc:1 "La première manifestation physique de notre protection sur ces terres."
 building_inquisition_keep_02:0 "Donjon de l'Inquisition"
 building_inquisition_keep_02_desc:1 "Seuls nos agents entrent dans ces fortification sans être remarqués."
 building_inquisition_keep_03:0 "Citadelle de l'Inquisition"
 building_inquisition_keep_03_desc:1 "Une redoutable citadelle pour contrer nos vils ennemis. Nos plans et desseins jaillissent d’ici tel le sang d’une artère."
 building_inquisition_keep_04:0 "Forteresse de l’Inquisition"
 building_inquisition_keep_04_desc:1 "Une montagne de pierre et d’acier ardent aussi inattaquable que notre foi. Aucune créature de la nuit n’est assez folle pour l’attaquer directement."
 building_type_inquisition_contact_01:0 "Contacter nos Agents"
 building_type_inquisition_contact_01_desc:1 "#F Bien que nous soyons peu nombreux et que notre mission doive rester secrète, nous ne sommes pas seuls dans notre lutte.#!"
 building_inquisition_contact_01:0 "Cachette pour Messagers"
 building_inquisition_contact_01_desc:1 "Un endroit désigné pour échanger des messages cryptés et partager l’expertise avec nos frères et sœurs dans le plus grand secret."
 building_inquisition_contact_02:0 "Lieu de Recontre"
 building_inquisition_contact_02_desc:1 "Un endroit assez discret pour que nos agents rencontrent leurs homologues en face à face. \n Ce niveau nécessite plus de 10 développements pour être construit et rester actif."
 building_inquisition_contact_03:0 "Conférence Hebdomadaire"
 building_inquisition_contact_03_desc:1 "Un rassemblement régulier d’experts dans le domaine de la lutte contre les forces de l’enfer se déroule dans nos locaux. \n Ce niveau nécessite plus de 20 développements pour être contruit et rester actif."
 building_type_inquisition_acre_01:0 "Terrains d’Entraînement des Chevaliers d’Acre"
 building_type_inquisition_acre_01_desc:1 "#F Ici nos frères perfectionnent leur saint art de vaincre les serviteurs du diable.#!"
 building_inquisition_acre_01:0 "Terrain d'Affrontement "
 building_inquisition_acre_01_desc:1 "Une prairie isolée avec beaucoup de place pour l’entraînement au combat."
 building_inquisition_acre_02:0 "Camps d'd’Entraînement"
 building_inquisition_acre_02_desc:1 "Un campement d’entraînement en forêt avec suffisamment d’infrastructures et d’expertise en place pour que même les guerriers les plus chevronnés puissent en profiter. \n Ce niveau nécessite plus de 5 développements pour être construit et rester actif."
 building_inquisition_acre_03:0 "Tournois de Joutes"
 building_inquisition_acre_03_desc:1 "Un tournoi de joute sous notre patronage attire des chevaliers venant du monde entier. Le terrain dispose d'installation d’entraînement précieuse hors saison. \n Ce niveau nécessite plus de 10 développements pour être construit et rester actif."
 building_type_inquisition_james_01:0 "Hospice des Chevaliers de St. James"
 building_type_inquisition_james_01_desc:1 "#F Assurer la sécurité et l’hospitalité aux pèlerins était notre objectif principal et reste notre spécialité.#!"
 building_inquisition_james_01:0 "Taverne pour Pélerins"
 building_inquisition_james_01_desc:1 "Un établissement modeste, mais néanmoins un spectacle bienvenu pour un pèlerin ou un soldat fatigué."
 building_inquisition_james_02:0 "Auberge pour Pélerins"
 building_inquisition_james_02_desc:1 "Un lieu vivant, spacieux et chaleureux avec suffisamment d'équipements pour répondre aux besoins des voyageurs, quel que soit leur but. \n Ce niveau nécessite plus de 5 développements pour être contruit et rester actif."
 building_inquisition_james_03:0 "Hospice pour Pélerins"
 building_inquisition_james_03_desc:1 "Un vaste complexe remplie de bâtiments servant de lien à ceux conduits par la foi. \n Ce niveau nécessite plus de 10 développements pour être contruit et rester activé."
 building_type_inquisition_john_01:0 "Sœurs de la Charité de St. John"
 building_type_inquisition_john_01_desc:1 "#F Nous servons les pauvres, les malades et les souffrants sans attendre de récompense matériel, mais les fruits de nos effort nous récompensent néanmoins.#!"
 building_inquisition_john_01:0 "Soupe Populaire"
 building_inquisition_john_01_desc:1 "Une initiative humble, mais très appréciée pour fournir de la nourriture à ceux qui en ont besoin."
 building_inquisition_john_02:0 "Hôpital Ambulant"
 building_inquisition_john_02_desc:1 "Un convoie de voiturettes et de chariots contenant tout le nécessaire pour prodiguer des soins dans des endroits reculés. \n Ce niveau nécessite plus de 5 développements pour être contruit et rester actif."
 building_inquisition_john_03:0 "Asile"
 building_inquisition_john_03_desc:1 "Un endroit sûr et généreux pour les malheureux du royaume. Un semblant de grâce de Dieu ici sur terre. \n Ce niveau nécessite plus de 10 développements pour être contruit et rester actif."
 building_type_inquisition_red_01:0 "Bibliothèque de l’Ordre rouge"
 building_type_inquisition_red_01_desc:1 "#F Un lieu où les paroles de Dieu, les paroles des hommes et les paroles dans les langues les plus profanes sont rendues utiles pour notre cause sacrée.#!"
 building_inquisition_red_01:0 "Bibliothèque Souterraine"
 building_inquisition_red_01_desc:1 "Une crypte souterraine abritant non seulement les restes mortels de nos frères, mais aussi nos tomes les plus précieux."
 building_inquisition_red_02:0 "Bibliothèque du Monastère"
 building_inquisition_red_02_desc:1 "Une section d’un monastère local dédié à nos recherches sensibles. Inaccessible aux non-initiés. \n Ce niveau nécessite plus de 5 en développement pour être contruit et rester actif."
 building_inquisition_red_03:0 "Bibliothèque Oubliée"
 building_inquisition_red_03_desc:1 "Une immense batîsse rempli de manuscrits et de grimoires trop dangereux pour rester en dehors de notre garde exclusive. \n Ce niveau nécessite plus de 10 développements pour être construit et rester actif."
 building_type_inquisition_murnau_01:0 "Maison von Murnau"
 building_type_inquisition_murnau_01_desc:1 "#F Les gens honnêtes et craignant Dieu travaillant dans les champs sont l’épine dorsale de ce royaume et de notre lutte.#!"
 building_inquisition_murnau_01:0 "Maison de ville Von Murnau"
 building_inquisition_murnau_01_desc:1 "Une résidence urbaine pas digne du nom de von Murnau, mais un avant-poste utile de notre influence néanmoins."
 building_inquisition_murnau_02:0 "Manoir Von Murnau"
 building_inquisition_murnau_02_desc:1 "Une demeure de luxe pour les membres de la famille mais aussi parfaitement adapté aux invités d’importance. \n Ce niveau nécessite plus de 5 en développement pour être contruit et rester actif."
 building_inquisition_murnau_03:0 "Palace von Murnau"
 building_inquisition_murnau_03_desc:1 "Une merveille architectural illustrant la splendeur de la dynastie. \n Ce niveau nécessite plus de 10 en développement pour être contruit et rester actif."
 building_type_inquisition_oculi_01:0 "Réseau de l'Oculi Dei"
 building_type_inquisition_oculi_01_desc:1 "#Les yeux parlent, mais sont rarement entendus. Mener nos affaires en solitaire assure cela.#!"
 building_inquisition_oculi_01:0 "Planque"
 building_inquisition_oculi_01_desc:1 "Une chambre dans une rangée de chambres identiques avec apparemment rien de spécial à ce sujet."
 building_inquisition_oculi_02:0 "Complexe"
 building_inquisition_oculi_02_desc:1 "Un centre souterrain de caves connectées avec de nombreuses entrées sécurisées. \n Ce niveau nécessite plus de 5 développements pour être construit et rester actif."
 building_inquisition_oculi_03:0 "Réseau de Tunnel"
 building_inquisition_oculi_03_desc:1 "Un réseau complexe de sous-sols, donjons, égouts et grottes interconnectés. Permettant de traverser de grandes distances sans être vu. \n Ce niveau nécessite plus de 10 en développement pour être contruit et rester actif."
 building_type_elysium_01:0 "Elysium de la Camarilla"
 building_type_elysium_01_desc:1 "#F Le point focal de la vie sociale apparentée où le Prince tient sa cour. Un endroit exempt de violence mais pas de lutte vicieuse pour la proéminence.#!"
 building_elysium_01:0 "Ad hoc Elysium"
 building_elysium_01_desc:1 "Un endroit choisi pour sa sécurité et sa commodité, pas pour son illustérité. N'impressionnera personne de notable, mais les clients l'apprécient néanmoins."
 building_elysium_02:0 "Respectable Elysium"
 building_elysium_02_desc:1 "Un établissement propice à l'épanouissement de la culture apparentée. Les murs mêmes du lieu encouragent le respect de l'étiquette."
 building_elysium_03:0 "Proéminent Elysium"
 building_elysium_03_desc:1 "Un établissement propice à l'épanouissement de la culture apparente. Les murs mêmes du lieu encouragent le respect de l'étiquette."
 building_type_haven_01:0 "Havre du Sabbat"
 building_type_haven_01_desc:1 "#F Pour les meutes toujours militantes du Sabbat, cet endroit est à la fois une maison familiale et un avant-poste armé.#!"
 building_haven_01:0 "Havre de sang"
 building_haven_01_desc:1 "Bien que suffisamment sécurisé pour organiser des rites communautaires et lancer des opérations armées, cet endroit pourrait utiliser plus de dignité et d'infrastructure."
 building_haven_02:0 "Havre Communal"
 building_haven_02_desc:1 "Cet hybride solennel d'un temple, de casernes militaires et d'un salon constitue un élément constitutif de l'architecture du Jyhad"
 building_haven_03:0 "Colonne de la main noire "
 building_haven_03_desc:1 "Un refuge rare et permanent pour les guerriers les plus redoutés du Sabbat. Seuls les lieux vitaux pour l'intérêt de la secte justifient leur affreuse présence."
                           
                      
                        
                 
               
                
                 
                
         
       
 
 
 
 