 POD_wraith_haunting.100.t:0 "Hanté"
 POD_wraith_haunting.100.desc:0 "Vous êtes déterminé à faire de [recipient.GetTitledFirstName] un misérable, mais vous ne pouvez pas être partout. Sur quoi concentrez-vous vos efforts?"
 POD_wraith_haunting.100.a:0 "[recipient.GetFirstNameNoTooltip] ne trouvera pas la paix."
 POD_wraith_haunting.100.b:0 "Je veux perturber [recipient.GetHerHis] sommeil. "
 POD_wraith_haunting.100.c:0 "[recipient.GetHerHis|U] les espions valent mon effort."
 POD_wraith_haunting.100.d:0 "Mes attaques devraient se concentrer sur les collecteurs d'impôts."
 POD_wraith_haunting.100.e:0 "Le général et [recipient.GetHerHis] sessions d'entrainement."
 POD_wraith_haunting.100.f:0 "[recipient.GetHerHis|U] tribunal est la bonne cible."
 POD_wraith_haunting.200.t:0 "Hante!"
 POD_wraith_haunting.200.desc:0 "Vous ressentez une présence invisible dans la nuit - un fantôme a décidé de vous jouer des tours de volaille, générant toutes sortes d'effets néfastes."
 POD_wraith_haunting.200.a:0 "Comme si les morts-vivants n'étaient pas assez mauvais!"


