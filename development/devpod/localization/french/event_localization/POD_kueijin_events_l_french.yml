l_french:

 podkueijin.1.t:0 "Un digne successeur?"
 podkueijin.1.desc:0 "Vos serviteurs sont revenus avec ce qu'ils ont pu trouver de mort vivants. Certains d'entre eux sont plus talentueux que d'autres, mais nécessiteront également plus de levier pour se lier à votre service. Ce sera quand même un pari de toute façon, vous n'avez pas le temps de les revoir personnellement avant de faire votre choix, car l'attention soudaine que vous leur porterez attirera l'attention des rivaux."
 podkueijin.1.a:0 "Je n'ai pas besoin de quelqu'un de trop qualifié. De peur qu'ils ne deviennent une menace ..."
 podkueijin.1.a.tt:0 "Un nouvel héritier apparaîtra, considéré comme votre propre enfant."
 podkueijin.1.b:0 "Celui-ci semble au moins tolérable."
 podkueijin.1.c:0 "Nous allons regarder la carrière de celui-ci avec grand intérêt."
 podkueijin.1.d:0 "Seule la meilleure perspective fera l'affaire"




