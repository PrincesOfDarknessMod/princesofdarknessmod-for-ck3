l_french:

 POD_ghoul_maintenance.50.t:0 "Rejeté par mon Domitor"
 POD_ghoul_maintenance.50.desc:0 "Mon domitor m’a retiré son patronage. Je ne suis plus à leur service. Ils ne me feront plus don de leur sang vampirique. Sans ce sang, je finirai par vieillir et mourir."
 POD_ghoul_maintenance.50.option.a:0 "Je les déteste pour ça."
 POD_ghoul_maintenance.50.option.b:0 "C’est peut-être mieux ainsi."
 POD_ghoul_maintenance.300.t:0 "Revenir à la vie"
 POD_ghoul_maintenance.300.desc:0 "Je suis devenu un revenant."
 POD_ghoul_maintenance.300.option.a:0 "Le pouvoir du sang !"
 POD_ghoulthrall_release_option.tt:0 "Va libérer une goule à votre service."
 
