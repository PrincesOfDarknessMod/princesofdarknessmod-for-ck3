l_french:

 POD_gehenna_omens.1231.notification:0 "Présage de la Gehenna"
 POD_gehenna_omens.1231.desc:0 "Une vache à deux têtes est née."
 POD_gehenna_omens_1231_notification_tooltip:0 "Oui vraiment, Une vache à deux têtes est née."
 
 POD_gehenna_omens.1240.t:0 "Présage de la Gehenna"
 POD_gehenna_omens.1240.opening:0 "Des nouvelles venues de Russie :"
 POD_gehenna_omens.1240.desc:0 "Les jumeaux Yuri Tvarivich et Sophia Tvarivich ont mené plusieurs loups-garous contre les Zmei, Sharkala le Cruel en Russie, dont cinq Crocs d’argent – Georges of Armenai, Boris, Foma, Vassili et Utra. Ils étaient également accompagnés par Pyotor, lui des Marcheurs de Verre ; Ulu, lui des Stargazers ; le Rongeur d’Os Igor Valkof ; Mehmet, lui des Araignées Silencieuses ; Katja, elle des Furies Noires, et le du héros de Fenris Ragnor. Utra, Ragnor, Boris, et Katja sont tous morts dans la bataille, tout comme Sophia, et Yuri a été écrasé par Sharkala Utr quand il a livré le coup final."
 POD_gehenna_omens.1240.a:0 "Les Zmei sont en colère !" 
 POD_gehenna_omens.1240.a.tt.beast:0 "#R La rage fait chier ! "

 POD_gehenna_omens.1241.t:0 "Présage de la Gehenna"
 POD_gehenna_omens.1241.opening:0 "Des nouvelles venues de Russie :"
 POD_gehenna_omens.1241.desc:0 "La Horde Mongole vient de l’autre côté des steppes comme un grand déluge, balayant les terres de la Russie, ses rois mortels balayés dans un déluge de violence. Mais ce qui est encore plus troublant, ce sont les histoires de paquets de lupins mêlés à la marée humaine. Cette tribu de loups-garous se fait appeler les Seigneurs de l’Ombre et laisse les corps de familles mortels et de Kindreds  dans leur sillage. Le déchaînement des Bêtes de la Lune préfigure-t-il la venue de la Gehenna ?"
 POD_gehenna_omens.1241.a:0 "Jusqu’où iront ces Mongols et leurs chiens ?" 
 
 POD_gehenna_omens.1242.t:0 "Présage de la Gehenna: Izhim ur-Baal se Réveille !"
 POD_gehenna_omens.1242.desc:0 "Dans le passé ancien, le père de [enkara.GetFirstName], [izhim.GetFirstName], avait disparu sous ses yeux quand il a été absorbé par la main gigantesque du démon terrestre Namtaru. Convoqué par ses chuchotements, [enkara.GetFirstName] vint à [izhim.GetFirstName] et lui donna son sang. Izhim buvait profondément en Enkara, et de chaque gorgée il sortait de plus en plus de la pierre liquide jusqu’à ce que, finalement, il la poussât dans la main démoniaque pour prendre sa place. Expliquant à Enkara qu’elle était le seul sacrifice digne de Namtaru. Elle était la seule qu’il aimait vraiment et il était maintenant prêt à offrir son seul véritable amour dans un contrat avec Namtaru pour échapper à la souffrance et enfin libérer le plein potentiel de la malédiction de la soif sur les Banu Haqim. Maintenant qu’il s’appelle le Troisième-Damné, il est une fois de plus libre !"
 POD_gehenna_omens.1242.a:0 "Comment les Banu Haqim vont-ils satisfaire leur soif ?"  
 POD_gehenna_omens.1242.a.tt:0 "Une chose terrible est arrivée."
 POD_gehenna_omens.1242.a.tt.beast:0 "#R Ou quelque chose de merveilleux ! #"
 POD_cult_of_izhim_ur_baal:0 "Culte d’Izhim ur-Baal"
 
 POD_gehenna_omens.1244.t:0 "Présage de la Gehenna: Annonce de la fin de l’Echidna !"
 POD_gehenna_omens.1244.desc:0 "Il y a longtemps, le [scylla.GetHouse.GetBaseName] a prophétisé la fin du [last_of_the_glycon.GetHouse.GetBaseName] ainsi que leur propre disparition. Dans un effort futile pour éviter la prophétie, les Guerriers cherchèrent à détruire les Sorcières. Le dernier du Glycon, [last_of_the_glycon.GetFirstName], a tué le petit d’Echidna. Tandis que [scylla.GetFirstName] tombait en poussière, elle hurla une dernière prophétie 'Sous le pied d’un esclave se tordront les serpents du Nil'.\n\nIl y aurait des rumeurs racontant que quelques-unes des Sorcières d’Echidna survivent encore."
 POD_gehenna_omens.1244.a:0 "Incitez le guerrier à rejoindre ma cour."
 POD_gehenna_omens.1244.a_success_glycon_1:0 "[last_of_the_glycon.GetFirstName] se joint à votre cour."
 POD_gehenna_omens.1244.a.tt.beast:0 "#R Non! Il a soif de notre sang! Nous connaissons bien la soif!#"
 POD_gehenna_omens.1244.b:0 "Offrir un refuge aux sorcières"
 POD_gehenna_omens.1244.b_success_witch_1:0 "[witch_of_echidna_1.GetFirstName] se joint à votre cour."
 POD_gehenna_omens.1244.b_success_witch_2:0 "[witch_of_echidna_2.GetFirstName] se joint à votre cour."
 POD_gehenna_omens.1244.b_success_witch_3:0 "[witch_of_echidna_3.GetFirstName] se joint à votre cour."
 POD_gehenna_omens.1244.b.tt.beast:0 "#R Oui ! Attire-les ici et prenons leur sang !#"
 POD_gehenna_omens.1244.c:0 "La prophétie est accomplie ! Les derniers Typhonistes ne me concernent pas."
 POD_gehenna_omens.1244.c.tt.beast:0 "#R Bon débarras ! Nous ne pleurons pas sur ces adorateurs condamnés. #"
 
 POD_gehenna_omens.1251.notification:0 "Présage de la Gehenna: Deuxième grand incendie de Lübeck"
 POD_gehenna_omens.1251.desc:0 "La ville de Lübeck subit une seconde grande conflagaration. Ses nombreux bâtiments en bois tombent en lambeau et se transforment en cendres.\n\nIls devraient peut-être essayer de construire avec de la pierre ?"

 POD_gehenna_omens.1252.notification:0 "Présage de la Gehenna: L'Inquisition des Ombres"
 POD_gehenna_omens.1252.desc:0 "L’Inquisition des Ombres de l’Église catholique a découvert et détruit un vampire Ventrue.\n\nIl était beaucoup trop arrogant pour un si jeune Vampire."

 POD_gehenna_omens.1253.notification:0 "Présage de la Gehenna: Incendie d'Utrecht"
 POD_gehenna_omens.1253.desc:0 "Un grand incendie a fait rage à travers la ville d’Utrecht dans le comté de Nedersticht durant neuf nuits, détruisant la majeure partie de la ville.\n\nL’Inquisition des Ombres brûle-t-elle les villes pour purger la Kindred ?"

 POD_gehenna_omens.1257.notification:0 "Présage de la Gehenna: Éruption de Samalas"
 POD_gehenna_omens.1257.desc:0 "Loin à l’est sur la petite île de Lombrok, la montagne de Samalas a explosé ! Comme Pompéi avant elle, la ville de Pamatan a été complètement détruite. A Plus de 200 Km au loin, la cendre tombe toujours sur Java. La fumée efface le soleil."

 POD_gehenna_omens.1258.notification:0 "Présage de la Gehenna: Le sac de Bagdad"
 POD_gehenna_omens.1258.desc:0 "Le Mongol Ilkhanat a saccagé la grande ville de Bagdad. La ville est dépeuplée et ruinée. La Maison de la Sagesse est détruite. Le Tigre est rouge de sang et noir de l’encre des livres détruits. Avec la mort d’Al-Musta’sim, ainsi meurt aussi le califat abbasside."

 POD_gehenna_omens.1259.notification:0 "Présage de la Gehenna: Le grand hiver d’Avalon" 
 POD_gehenna_omens.1259.desc:0 "Tout a commencé par un brouillard sec et mystérieux et d'un nuage persistant. L’hiver dans le Nord a été particulièrement rigoureux. Une famine s’est répandue dans les terres du nord dont la Grande-Bretagne fut particulièrement frappée. Vingt mille mortels meurent de faim à Londres. Est-ce le prochain hiver éternel des Fée ?"
 
 POD_gehenna_omens.1260.notification:0 "Présage de la Gehenna: La Purge de Baybar" 
 POD_gehenna_omens.1260.desc:0 "En Egypte, le sultan des Mamelouks entame une purge implacable contre les surnaturels non musulmans. Les serpents se cachent dans leurs trous."
 
 POD_gehenna_omens.1268.notification:0 "Présage de la Gehenna: Tremblement de terre en Cilicie"
 POD_gehenna_omens.1268.desc:0 "Le sol même a tremblé, apportant la ruine à la ville d’Adana. Plus de soixante mille mortels ont été écrasés à mort. Tous les bâtiments se sont effondrés."

 POD_gehenna_omens.1271.notification:0 "Présage de la Gehenna: Troisième grand incendie de Lübeck"
 POD_gehenna_omens.1271.desc:0 "Un troisième grand incendie brûle une partie de la ville de Lübeck. Les bâtiments en pierre s’en tirent beaucoup mieux que les bâtiments en bois."
 
 POD_gehenna_omens.1287.t:0 "Présage de la Gehenna: À la suite de l’inondation de Lucian"
 POD_gehenna_omens.1287.desc:0 "Le soir de Sainte-Lucie, une énorme tempête inonde la côte de la Frise. Quatre-vingt mille personnes ont été emportées par la noyade. Des centaines de villages ont perdu la vie. Étant sur le solstice d’hiver pour les terres du Nord, l’inondation et la mort de masse est arrivé à un moment le plus inquiétant où la barrière entre les vivants et les morts est plus mince. Plusieurs prophètes de la kindred sont apparus dans ce chaos avec l’intention de saisir praxis. Curieusement, ils sont tous appelés Lucy."
 POD_gehenna_omens.1287.a:0 "Les catastrophes naturelles se produisent, ce n’est pas la volonté des dieux, anciens ou nouveaux."
 POD_gehenna_omens.1287.a.tt:0 "Ceux qui se souviennent disent que cette inondation était pire que la Grande Inondation de la mer du Nord de Noord-Holland en 1212. L’inondation de Noor-Holland a duré six mois, mais la catastrophe de Sainte-Lucie est survenue en une seule nuit. C’est la pire inondation de l’histoire de l’Europe. Une nouvelle mer se forme qui s’appellera un soir 'Zuiderzee'."
 POD_gehenna_omens.1287.a.tt.malk:0 "#MALKBLUE Il y en à eu bien d'autre dans cette période! #"
 POD_gehenna_omens.1287.b:0 "Lucia est revenue pour apporter la rédemption ou la destruction. Je serai rachetée !"
 POD_gehenna_omens.1287.b.tt:0 "Au 4ème siècle après JC, Sainte-Lucie a apporté de la nourriture aux chrétiens cachés dans les catacombes sous Rome, mais nous morts-vivants avons d’autres idées sur ce qui se passait là-bas. Lucia fut guérie comme par magie d’une maladie des prières de Lucia. Lucia refusa alors d’épouser un païen dont elle était fiancée. Les païens ont essayé de la brûler au bûcher, mais ils ont échoué. Ils l’ont poignardée à la gorge avec une lance, mais elle n’a pas cessé de parler. Ils lui ont arraché les yeux, mais ils ont été miraculeusement restaurés. Elle ne serait pas morte jusqu’à ce qu’un prêtre lui récite les derniers droits d'un Chrétiens.\n\nCe corps est resté intact en Sicile pendant 400 ans. Puis les reliques ont été déplacées à Constantinople pour se protéger des incursions sarrasines. Puis son cadavre disparut pendant le pillage de Constantinople en 1204 et la ruine du rêve de Michaël.\n\nPourquoi Dieu a-t-il repris les voies de l’Ancien Testament en punissant les méchants de Frise par ce déluge épique lors de la sainte nuit de Sainte-Lucie? Beaucoup de ces âmes avaient accepté la foi des Pêcheurs et cherchaient à parcourir le paradis des Lointains Rivages. Sainte Lucia nous appelle à retourner sur la Route du Ciel."
 POD_gehenna_omens.1287.b.tt.malk:0 "#MALKBLUE Brioches chaudes! Brioches chaudes! Un par cent, deux par cent, Brioches chaudes! Si vous n'avez pas de filles, donnez les à vos fils.  Un par cent, deux par cent, Brioches chaudes!#"
 POD_gehenna_omens.1287.c:0 "Un tour de Lussiferda à nouveau! Préparez mon coursier à la rejoindre!"
 POD_gehenna_omens.1287.c.tt:0 "Les Normands ont un autre nom pour cette nuit terrible, 'Lussinatta'. La Lussi, une sorte de surnaturel féminin maléfique, aurait chevauché dans les airs avec ses disciples la Lussiferda. Les trolls, les esprits maléfiques et les morts se lèveraient en masse pour s’attaquer aux mortels imprudents en cette longue et sombre nuit. Les enfants sont leurs repas préférés, étant arrachés directement de leurs maisons. Northmen rester éveillé toute la nuit pour garder leurs ménages. Maintenant avec cette dévastation, beaucoup de ces hommes du Nord sont morts. Les gens qui pratiquent les anciennes manières sentent leur destin au service de Hel à Niflheim où leurs âmes construiront sa flotte pour Ragnarok."
 POD_gehenna_omens.1287.c.tt.malk:0 "#MALKBLUE Ma lance et mon casque magique! Ta lance et mon casque magique? Lance et casque magique! Casque magique? Casque magique! Casque magique... OUI! Casque magique et je vous donnerais un échantillon!#"
 POD_gehenna_omens.1287.d:0 "Alina est un avatar de Lilith, voyez son éclat !"
 POD_gehenna_omens.1287.d.tt:0 "Lucy vient du mot latin 'lux' pour apporter la lumière. Son nom grec est Alina. Lucia, Lussi, Lucifer ou Alina — toutes les manifestations de la divine Lilith. Avec la magie de Lilith créant ce déluge en se moquant du Démiurge, la prêtresse de Lilith est venue réclamer leurs âmes damnées. Les Lamia répondent à l’appel aux armes dans ce monde et dans les Terres des Ombres."
 POD_gehenna_omens.1287.d.tt.malk:0 "#MALKBLUE PaS De bLaGUe sUr Lil! LOL! Ok. PeUT-êtRe JuSTe UnE bLa... HIC! ErGh! GuLP! #"
 POD_gehenna_omens.1287.e:0 "La Frise sera gouvernée par les princes et la loi, pas les cultes d’un dieu mort."
 POD_gehenna_omens.1287.e.tt:0 "La Frise sera gouvernée par les princes et la loi, pas les cultes d’un dieu mort."
 POD_gehenna_omens.1287.e.tt.malk:0 "#MALKBLUE Chaque courtisants devraient être des bouffons du roi! #"
 POD_gehenna_omens.1287.f:0 "Mystique ou pas, cela n’a pas d’importance pour moi. Je vais mon suivre propre chemin."
 POD_gehenna_omens.1287.f.tt.malk:0 "#MALKBLUE Rangé rangé rangéé votre bateau, doucement vers en bas #"
 
 
 






