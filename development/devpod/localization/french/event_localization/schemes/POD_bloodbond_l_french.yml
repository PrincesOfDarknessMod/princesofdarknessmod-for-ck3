l_french:

 POD_bloodbond.100.t:0 "Liaisons par le sang"
 POD_bloodbond.100.desc:0 "[schemer.GetTitledFirstName] essaie de vous lier par le sang."
 POD_bloodbond.100.option.a:0 "Exercez ma volonté pour résister au lien sanguin."
 POD_bloodbond.100.option.b:0 "Refusez le lien sanguin.
 POD_bloodbond.100.option.c:0 "Acceptez le lien sanguin."
 
 POD_bloodbond.200.t:0 "Lier par le sang [target.GetFirstNameNoTooltip]"
 POD_bloodbond.200.desc:0 "Le complot est en place pour lié par le sang [target.GetTitledFirstName], mais [target.GetSheHe] résiste."
 POD_bloodbond.200.option.a:0 "Réveillez le sang pour [target.GetHerHim] liée par le sang."
 POD_bloodbond.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] a exercé sa volonté afin de résister à une liaison par le sang."
 POD_bloodbond.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] est habile dans la discipline de la Force d'âme et résiste à votre manipulation."
 POD_bloodbond.200.a.success.desc:0 "Victoire"
 POD_bloodbond.200.a.tt_success:0 "[target.GetTitledFirstName]sera lié par le sang à moi."
 POD_bloodbond.200.a.failure.desc:0 "Échec"
 POD_bloodbond.200.a.tt_failure:0 "[target.GetTitledFirstName] a résisté à ma tentative de liaison sanguine."
 POD_bloodbond.200.option.b:0 "Réveillez le sang et exercez ma volonté. On ne me refusera pas !"
 POD_bloodbond.200.option.b.tt.beast:0 "#R [target.GetSheHe|U] doit m'aimer! #"
 POD_bloodbond.200.option.c:0 "Abandonnez cette tâche, je ne veux plus me lier par le sang."
 POD_bloodbond.200.option.c.tt:0 "Le lien sanguin va échouer."
 POD_bloodbond.200.option.c.tt.beast:0 "#R On devrait prendre du sang, pas le donner !#"
 
 POD_bloodbond.300.t:0 "[target.GetFirstNameNoTooltip] est lié par le sang"
 POD_bloodbond.300.desc:0 "[target.GetTitledFirstName] a été lié à moi par le sang."
 POD_bloodbond.300.option.a:0 "C’est comme il se doit."
 POD_bloodbond.300.option.a.tt.beast:0 "#R Que dois-je en faire ? #"

 POD_bloodbond.400.t:0 "Vous avez été lié par le sang"
 POD_bloodbond.400.desc:0 "En ayant bu le sang de [schemer.GetTitledFirstName], vous êtes maintenant lié." 
 POD_bloodbond.400.option.a:0 "J'agirais selon sa volonté."
 
 POD_bloodbond.500.t:0 "Opposition à la Liaison Sanguine"
 POD_bloodbond.500.desc:0 "[target.GetTitledFirstName] a résisté à ma tentative de me lier avec son sang." 
 POD_bloodbond.500.option.a:0 "Déjoué !"
 POD_bloodbond.500.option.a.tt.beast:0 "#R Prenons plus de sang et réessayons ! #"

 POD_bloodbond.600.t:0 "Opposition à la Liaison Sanguine"
 POD_bloodbond.600.desc:0 "[schemer.GetTitledFirstName] a abandonné son complot de liaison sanguine." 
 POD_bloodbond.600.option.a:0 "Je ne serai pas son esclave de sang!"

 

