l_french:

 POD_vamphunt.1.t:0 "Du Sang !"
 POD_vamphunt.1.desc:0 "Vous avez suivi votre proie. Vous prenez la première morsure et [target.GetSheHe] succombe au baiser. Combien de sang boirez-vous?"
 POD_vamphunt.1.option.a:0 "Ne prenez rien. Laissez-[target.GetHerHim] partir sain et sauf."
 POD_vamphunt.1.option.b:0 "Un peu. Juste une gorgée."
 POD_vamphunt.1.option.c:0 "Prenez un verre. [target.GetSheHe|U] va faiblir, mais ça ira."
 POD_vamphunt.1.option.d:0 "En prendre beaucoup, quitte à [target.GetHerHim] blesser."
 POD_vamphunt.1.option.e:0 "Prenez tout, en les tuant et en satisfaisant complètement ma soif."
 POD_vamphunt.1.option.f:0 "Rendez [target.GetHerHim] accros au bonheur de mon baiser, alors [target.GetSheHe] me supplieront de me nourrir sur [target.GetHerHim]."

