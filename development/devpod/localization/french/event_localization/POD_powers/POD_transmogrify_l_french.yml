 POD_transmogrify.200.option.k:0 "Faites preuve de créativité avec Vicissitude"
 POD_transmogrify.200.option.l:0 "Revenir sur leur trait avec Vicissitude"
 POD_transmogrify.200.option.a:0 "Façonner leurs traits dans des notions conventionnelles de beauté"
 POD_transmogrify.200.option.b:0 "Les mutiler pour les rendre laids à la société mortelle"
 POD_transmogrify.200.option.c:0 "Extraire le pigment de leur peau"
 POD_transmogrify.200.option.d:0 "Remettre le pigment sur leur peau."
 POD_transmogrify.200.option.e:0 "Les défigurer"
 POD_transmogrify.200.option.f:0 "Enlever leurs cicatrices"
 POD_transmogrify.200.option.g:0 "Retirer leurs écailles"
 POD_transmogrify.200.option.h:0 "Ecailler leur peau"
 POD_transmogrify.200.option.i:0 "Fais-les à mon image"
 POD_transmogrify.200.option.j:0 "Ne faisons rien"
 
