 POD_transmogrify.100.t:0 "Transfiguration"
 POD_transmogrify.100.desc:0 "Avec l’utilisation de la discipline de la vicissitude, je peux transformer mon sujet en une beauté ou une bête.  Leur chair est mon argile, et je suis un artiste du tendon, de l’os et du sang. Il y a une chance qu’ils ne survivent pas à la procédure."
 POD_transmogrify.100.option.a:0 "Manipuler leur visage"
 POD_transmogrify.100.option.b:0 "Modifier leur corps"
 POD_transmogrify.100.option.c:0 "Les améliorer pour le combat"
 POD_transmogrify.100.option.d:0 "Modifier leurs sens"
 POD_transmogrify.100.option.e:0 "Ne faisons rien"
 
 POD_transmogrify.experiment.desc:0 "Votre érudition sera remis en question par l’expérience"
 
