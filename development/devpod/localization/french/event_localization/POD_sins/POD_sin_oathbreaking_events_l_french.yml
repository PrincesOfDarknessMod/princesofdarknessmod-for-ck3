 POD_sin_oathbreaking.t:0 "Briseur de trêve, Briseur de serment"
 POD_sin_oathbreaking.100.desc:0 "Votre violation de la trêve s'est propagée à travers le monde. Vous êts maintenant connu en tant que briseurs de serments. Ce n'est pas bon. Certains le voit comme un crime."
 POD_sin_oathbreaking.100.a:0 "Mes mots ne sont pas mes chaînes"
 

