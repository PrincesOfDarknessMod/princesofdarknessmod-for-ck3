 ask_pope_decision:0 "Demandez des fonds au Saint-Père"
 ask_pope_decision_desc:0 "Vous demanderez de l'or à l'évêque de Rome pour soutenir la cause."
 ask_pope_decision_confirm:0 "Ecrire la lettre"
 ask_pope_decision_tooltip:0 "Le Pape entendra certainement mon appel!"
 ask_pope_decision_effect_tooltip:0 "Il vous faudra un peu de finesse de votre part pour gérer la politique byzantine du Saint-Siège"
 ask_pope.1.t:0 "Demande de financement"
 ask_pope.1.desc:0 "Votre choix est soit de régler le montant de l'aide monétaire prévue dans la charte fondatrice de l'ordre, soit de persuader le pape d'aller plus loin dans les coffres au risque de le contrarier."
 ask_pope.a:0 "Demandez des fonds supplémentaires, exagérez la menace."
 ask_pope.a.success:0 "Vous allez convaincre le pape que la chrétienté est sur le point d'être submergée par les ténèbres."
 ask_pope.a.failure:0 "Le pape rejettera votre rapport comme source de peur."
 ask_pope.b:0 "Demander des fonds supplémentaires, souligner la sainteté de la cause."
 ask_pope.b.success:0 "Vous ferez appel au côté zélé du Saint-Père."
 ask_pope.b.failure:0 "Vous échouerez à élever votre cause au-dessus des autres dépenses du pape."
 ask_pope.c:0 "Demandez des fonds supplémentaires, flattez le Saint-Père."
 ask_pope.c.success:0 "Vous ferez appel à la vanité du Saint-Père pour être bien vu."
 ask_pope.c.failure:0 "Le pape verra à travers vos tentatives évidentes de flatterie."
 ask_pope.d:0 "Demandez des fonds supplémentaires, gonflez vos dépenses." 
 ask_pope.d.success:0 "Vous falsifierez les chiffres dans les registres pour justifier un financement supplémentaire."
 ask_pope.d.failure:0 "Le pape ne se laissera pas berner par votre comptabilité créative."
 ask_pope.e:0 "Demandez simplement la somme convenue."
 ask_pope.a.success.t:0 "Le pape vous croit."
 ask_pope.a.success.desc:0 "Le Saint-Père est profondément secoué par le chaos et la dépravation dont vous avez été témoin. Il envoie une double allocation"
 ask_pope.a.failure.t:0 "Le pape est sceptique."
 ask_pope.a.failure.desc:0 "Vous avez embelli votre rapport à un tel degré fantastique, le Saint-Père commence à douter que vous puissiez faire autre chose que fabriquer des histoires."
 ask_pope.b.success.t:0 "Le pape est convaincu."
 ask_pope.b.success.desc:0 "Le Saint-Père est d'accord, il n'y a pas de cause plus juste pour un ecclésiastique que de protéger son troupeau. Il envoie une double allocation."
 ask_pope.b.failure.t:0 "Le pape reconsidère ses dépenses."
 ask_pope.b.failure.desc:0 "Votre description inepte de la cause de votre commande a rappelé au Saint-Père des dépenses plus immédiates."
 ask_pope.c.success.t:0 "Le pape est flatté."
 ask_pope.c.success.desc:0 "Votre flatterie subtile et finement ajustée a fait de vous l'une des personnes préférées du Saint-Père à financer. Il envoie une double allocation."
 ask_pope.c.failure.t:0 "Le pape voit à travers votre flatterie."
 ask_pope.c.failure.desc:0 "Vos tentatives brutales de flatter le Saint-Père ont été reçues comme des insultes."
 ask_pope.d.success.t:0 "Vous avez réussi à justifier le budget."
 ask_pope.d.success.desc:0 "Le Saint-Père a admis que votre mission pourrait être une entreprise plus coûteuse que prévu initialement."
 ask_pope.d.failure.t:0 "Vos livres sont suspects."
 ask_pope.d.failure.desc:0 "Votre tentative inepte de gonfler vos dépenses a conduit les comptables papaux à conclure que vous êtes, en fait, sur-financé."
 ask_pope.e.t:0 "Vous recevez un financement."
 ask_pope.e.desc:0 "Juste le montant fourni dans le fonds désigné, ni plus, ni moins." 
 conversion_decision:0 "Conversion de masse"
 conversion_decision_tooltip:0 "Convertissez votre royaume en utilisant votre vraie foi"
 conversion_decision_desc:0 "En vrai croyant, vous pourriez organiser une campagne de prosélytisme rivalisant avec celles des saints d'autrefois."
 conversion_decision_effect_tooltip:0 "Vos comtés de royaume se convertiront à votre foi."
 conversion_decision_confirm:0 "Nous leur montrerons la Lumière!"
 reclusion_decision:0 "Concentrez-vous sur votre foi"
 reclusion_decision_tooltip:0 "Passez du temps en contemplation pour avoir un aperçu de votre vraie foi"
 reclusion_decision_desc:0 "En vous retirant de la politique graveleuse des Caïnites, vous pouvez, espérons-le, acquérir une certaine tranquillité d'esprit et une foi renouvelée."
 reclusion_decision_effect_tooltip:0 "On vous présentera un choix sur la façon d'obtenir de l'expérience de style de vie de la Foi"
 reclusion_decision_confirm:0 "Enfin la paix"
 reclusive_leader_modifier:0 "Chef reclus"
 reclusive_leader_modifier_desc:0 "Vous avez récemment passé du temps loin des intrigues judiciaires. Ceci est considéré comme une faiblesse par vos rivaux."
 PODinquisition.9999.t:0 "La voie du divin"
 PODinquisition.9999.desc:0 "Vous avez choisi de passer quelque temps loin de votre cour pour vous concentrer sur la foi brûlante qui jaillit du cœur de votre âme. Un choix vertueux, sans doute, mais la politique vampirique n'attend personne, et vous devez choisir combien de temps exactement vous souhaitez laisser vos rivaux comploter derrière votre dos ..."
 PODinquisition.9999.a:0 "Je passerai le strict minimum de temps"
 PODinquisition.9999.b:0 "Je peux pousser pour un peu plus, je reprendrai le contrôle de mon terrain plus tard"
 PODinquisition.9999.c:0 "Je peux faire les deux!"
 PODinquisition.9999.c.effect.success.desc:0 "Une belle réussite vous permettra de progresser plus loin que prévu"
 PODinquisition.9999.cb.effect.success.desc:0 "Vous avez réussi vos études"
 PODinquisition.9999.cc.effect.success.desc:0 "Un échec complet, vous avez perdu à la fois votre temps et votre capital politique"
 PODinquisition.9999.c.success:0 "Un succès complet!"
 PODinquisition.9999.cb.success:0 "Un juste succès"
 PODinquisition.9999.cc.success:0 "Un échec total ..."
