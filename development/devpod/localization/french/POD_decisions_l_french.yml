l_french:
 groom_successor_decision:0 "Cherchez un successeur"
 groom_successor_decision_tooltip:1 "Vos serviteurs vous proposeront un certain nombre de candidats"
 groom_successor_decision_desc:0 "Les Wan Kuei ne sont pas capables d’embrasser ou, la plupart du temps, d’avoir des enfants naturellement. Ainsi, si vous ne voulez pas que votre dur labeur soit gaspillé en cas d’accident malheureux, vous devez être préparé. Vous demanderez à vos serviteurs de présenter un certain nombre de candidats appropriés."
 groom_successor_decision_effect_tooltip:1 "On vous présentera un groupe de candidats et vous pourrez en accepter un comme votre propre enfant moyennant des frais de prestige."
 groom_successor_decision_confirm:0 "Démarrer les recherches"
 oust_mithras_objective_decision:0 "Coucher du soleil"
 oust_mithras_objective_decision_tooltip:1 "Si vous réussissez, vous récolterez de grandes récompenses et paralyserez à jamais le Culte de Mithras"
 oust_mithras_objective_decision_desc:0 "Mithra et sa proie ont été une plaie sur ces îles depuis qu’il est venu en courant ici, fuyant ses échecs sur le continent. Il est grand temps que la famille d’Albion réclame sa patrie de ce soi-disant Dieu persan."
 oust_mithras_objective_decision_effect_tooltip:1 "Publier une proclamation pour dire que Britannia est libre de l’influence de Mithras."
 oust_mithras_objective_decision_effect_tooltip2:1 "Cela paralysera la Via Mithras, vous accordera un grand prestige et formera un nouveau groupe de guerriers dédiés à la défense d’Albion." 
 oust_mithras_objective_decision_confirm:0 "Enfin, il est temps"
 oust_mithras_custom_decision:0 "Vous devez ne pas avoir de vassaux de la foi Via Mithras. Les barons ne comptent pas."
 oust_mithras_custom_decision2:0 "Mithra lui-même doit être mort ou en torpeur."
 mithras_victory_objective_decision:0 "Le Sceptre et le Soleil"
 mithras_victory_objective_decision_tooltip:1 "Alors que le Culte de Mithras grandit en influence, le clan Ventrue tombera à sa portée"
 mithras_victory_objective_decision_desc:0 "Mithra a failli dominer le paysage religieux une fois déjà, dans la Rome antique. Ce soir, l’humanité semble inaccessible, mais en tant que membre éminent du Ventrue, il y a toujours une possibilité de prendre le contrôle du clan via la foi. Si certaines petites affaires sont traitées en premier..."
 mithras_victory_objective_decision_effect_tooltip2:1 "Le culte de Mithra sera habilité, et la plupart des Ventrue se convertiront à elle, à jamais entremêlant le clan et la foi" 
 mithras_victory_objective_decision_confirm:0 "Clan et foi, ne font qu'un"
 mithras_victory_custom_decision:0 "Hardestadt, Camilla et Alexandre, les trois principaux rivaux pour la domination du clan Ventrue, doivent être mort ou mis hors d'état."
 mithras_victory_custom_decision2:0 "Aucun autre Ventrue que vous ou Mithra ne peut détenir le titre d'empire. Sauf s’ils sont eux-mêmes membres du Culte de Mithra."
 toreador_victory_objective_decision:0 "Encore Rêver"
 toreador_victory_objective_decision_tooltip:1 "Une occasion mémorable qui résonnera tout au long de l’histoire de Caïnite."
 toreador_victory_objective_decision_desc:0 "En 1204, l’impensable s’est produit, Michael, patriarche du rêve de Constantinople, est mort. Depuis ce temps fatidique, de nombreux disciples de l’archange décédé ont tenté de recréer cette utopie très sainte."
 toreador_victory_objective_decision_confirm:0 "J’espère que Michael regarde"
 toreador_victory_objective_decision_effect_tooltip:1 "Vous aurez le choix entre renouveler la foi de l’Archange ou simplement profiter de récompenses matérielles." 
 shadow_reconquista_objective_decision:0 "Reconquista de l’Ombre"
 shadow_reconquista_objective_decision_tooltip:1 "Cela plaira aux chefs du clan Lasombra et, en plus, pavera votre chemin de gloire et d'or."
 shadow_reconquista_objective_decision_desc:0 "Dans une tentative malavisée de conserver leur pouvoir politique, les membres Ashirra du clan Lasombra ont déclenché une guerre civile qui a presque mis fin à la domination Lasombra sur l’Ibérie. Ils doivent être arrêtés dès que possible."
 shadow_reconquista_objective_decision_confirm:0 "Leur rébellion est terminée"
 shadow_reconquista_objective_decision_effect_tooltip:1 "Vous allez surpasser, ou créer, le titre de Mer des Ténèbres. Cela peut s’avérer impopulaire pendant un certain temps." 
 shadow_reconquista_objective_decision_custom:1 "Il ne doit pas y avoir de fidèles Ashirra dans votre royaume. Les barons ne comptent pas." 
 einherjar_victory_objective_decision:0 "Vaincre Ragnarok"
 einherjar_victory_objective_decision_tooltip:1 "Au-delà de Ragnarok se trouve la possibilité d’un avenir pour votre peuple."
 einherjar_victory_objective_decision_desc:0 "Les enfants de Caharl sont pressés par la venue du christianisme. Odin a disparu et leur peuple se retourne contre eux avec des fourches et du feu. Comme le Ventrue allemand a déjà sécurisé des villes dans le sud de la Scandinavie, il semble que le temps de l’Einherjar est terminé."
 einherjar_victory_objective_decision_confirm:0 "Le Valhalla est assuré"
 einherjar_victory_objective_decision_effect_tooltip:1 "Vous utiliserez vos victoires extraordinaires et inattendues pour revitaliser la foi d’Einherjar et l’amener à une nouvelle ère." 
 ashirra_deconquista_objective_decision:0 "Iberia après Minuit"
 ashirra_deconquista_objective_decision_tooltip:1 "Mettre fin à la guerre civile ibérique en faveur de l’Ashirra est une entreprise énorme, mais avec des récompenses qui en valent la peine."
 ashirra_deconquista_objective_decision_desc:0 "Les fidèles d’Ashirra ont essuyé des revers depuis le début de la guerre civile de Lasombra. Avec le soutien de la Mer des Ténèbres, la victoire de De Ruiz semble assurée. Mais peut-être que vous pouvez encore renverser la tendance..."
 ashirra_deconquista_objective_decision_confirm:0 "Les fidèles ont triomphé."
 ashirra_deconquista_objective_decision_effect_tooltip:1 "Votre victoire paralysera la puissance de la Mer des Ténèbres, vous donnera des possibilités pour les grandes choses à venir et vous permettra de reconstruire l'Iberia." 
 ashirra_deconquista_objective_decision_custom:1 "Il ne doit pas y avoir de personnages de Via Noctis dans votre royaume. Les barons ne comptent pas." 
 malkavian_victory_objective_decision:0 "La Petite Farce"
 malkavian_victory_objective_decision_tooltip:1 "Malkav vous parle et vous dit de faire des choses! Probablement."
 malkavian_victory_objective_decision_desc:0 "Vous avez une pulsion, ou une vision prophétique, ou un rêve fiévreux... de toute façon, vous êtes presque sûr que vous avez besoin de rassembler le clan Malkavian pour faire un grand rituel en Bohême. Ou Jérusalem."
 malkavian_victory_objective_decision_confirm:0 "Choses Importantes à venir!"
 malkavian_victory_objective_decision_effect_tooltip:1 "Vous accomplirez un rituel avec une précision parfaite et la connaissance de ce que vous faites. Probablement." 
 senate_victory_objective_decision:0 "La République éternelle"
 senate_victory_objective_decision_tooltip:1 "Rome est tombée, mais pas son esprit républicain. Le clan Ventrue se déplace vers de nouvelles directions, mais il peut être influencé par des doctrines plus âgés, plus fiers."
 senate_victory_objective_decision_desc:0 "Avant sa corruption, la Rome morte-vivante était une utopie des républicains caïnites. Le rêve d’un Sénat où tous les clans peuvent avoir un représentant est toujours réalisable. Si la tentative malavisée de Ventrue allemand pour construire un nouvel empire est d’abord empêchée..."
 senate_victory_objective_decision_confirm:0 "Nous sommes le Sénat"
 senate_victory_objective_decision_effect_tooltip:1 "La Rome Républicaine sera reconstruite, et de nouvelles politiques seront mises en place pour récompenser et punir les clans en conséquence." 
 senate_victory_objective_decision_custom:1 "Le titre des Fiefs de la Croix Noire doit être le vôtre, ou ne doit pas exister.Il ne peut en être autrement." 
 brujah_victory_objective_decision:0 "Carthage"
 brujah_victory_objective_decision_tooltip:1 "Nous n’oublierons jamais Carthage, l’utopie de Troile des hommes et des caïnites. Brûlé par les Romains jaloux, son esprit vit toujours dans chacun de nous."
 brujah_victory_objective_decision_desc:0 "Rome et Camilla ont détruit notre bien-aimée Carthage, la ville parfaite. Mais elle ne sera jamais vraiment partie aussi longtemps que le clan Brujah vit encore. Peut-être cette époque, où Rome elle-même est tombée, pourraient-ils voir renaître notre utopie."
 brujah_victory_objective_decision_confirm:0 "Troile serait fier"
 brujah_victory_objective_decision_effect_tooltip:1 "Vous aurez le choix sur la façon de gérer ce moment important. Soit comme un outil politique, soit comme une véritable utopie qui divise." 
 brujah_victory_objective_decision_custom:1 "Camilla, le prince de Rome qui a détruit notre ville, doit être mort ou en hors d'état." 
 babayaga_victory_objective_decision:0 "Votre grand-mère attentionnée"
 babayaga_victory_objective_decision_tooltip:1 "Le clan Nosferatu est condamné, à moins que vous réussissiez à conclure une alliance avec la reine Hag."
 babayaga_victory_objective_decision_desc:0 "Absimilliard, l’ancêtre du clan Nosferatu est là, planifiant la mort de sa progéniture. Le seul espoir réside dans Baba Yaga, la petite grand-mère, qui a réussi à le retenir une fois auparavant. Faites-lui plaisir, et peut-être survivrez-vous à la tempête."
 babayaga_victory_objective_decision_confirm:0 "Grand-mère, écoute notre appel !"
 babayaga_victory_objective_decision_effect_tooltip:1 "Le clan Nosferatu s’unira derrière Baba Yaga et son champion choisi, vous." 
 babayaga_victory_objective_decision_custom:1 "Le vieux rival de Baba Yaga, Durga Syn de la Rus Blanche, doit être mort ou hors d'état." 
 nosferatu_victory_objective_decision:0 "Horreurs dans le Noir"
 nosferatu_victory_objective_decision_tooltip:1 "Les menaces se cachent dans l’obscurité. Le clan Nosferatu a besoin d’un protecteur."
 nosferatu_victory_objective_decision_desc:0 "Votre clan est pourchassé par son ancêtre, Absimilliard. Vous êtes alors forcé de rôder dans l’ombre, attendant que sa colère vous consume. Mais peut-être quelqu’un pourrait-il unir le clan et riposter..."
 nosferatu_victory_objective_decision_confirm:0 "Nous te suivrons, fondateur"
 nosferatu_victory_objective_decision_effect_tooltip:1 "Vous allez unifier le clan Nosferatu, c'est un atout puissant d'avoir une lignée aussi résiliente et astucieuse."  
 urshulgi_victory_objective_decision:0 "Un Dieu Rêve"
 urshulgi_victory_objective_decision_tooltip:1 "Seul le fils favorisé, Ur-Shulgi, connaît la volonté de Haqim."
 urshulgi_victory_objective_decision_desc:0 "Le clan Assamite est dans le déni. Notre destin est de purifier la terre du sang impur des enfants de Khayyin et de le récupérer pour notre ancêtre, Haqim. Nous devons leur montrer la vérité."
 urshulgi_victory_objective_decision_confirm:0 "L'Ascension du Berger Noir"
 urshulgi_victory_objective_decision_effect_tooltip:1 "Le clan Assamite se convertira à votre culte, et le rêve d’Ur-Shulgi détruira les âmes des impurs." 
 urshulgi_victory_objective_decision_custom:1 "Les principaux rivaux pour le contrôle d’Alamut, Jamal, Nakurtum et Al-Ashrad, doivent être morts ou hors d'état." 
 assamite_victory_objective_decision:0 "Une Maison Divisé"
 assamite_victory_objective_decision_tooltip:1 "Les enfants de Haqim ont besoin d’un nouveau leadership unificateur."
 assamite_victory_objective_decision_desc:0 "Le clan Assamite est divisé entre les confessions concurrentes, les cultes secrets et les intérêts personnels. Ces divisions sont profondes et menacent de détruire le clan. Elles doivent être réglées."
 assamite_victory_objective_decision_confirm:0 "Frère contre frères"
 assamite_victory_objective_decision_effect_tooltip:1 "Vous unifierez le clan Assamite et choisirez un chemin pour son destin."  
 assamite_victory_objective_decision_custom:1 "Les sectes dissidentes, Web of Knives et Lost Tribe, sont soit détruites, soit sous votre contrôle."  
 sinner_victory_objective_decision:0 "Le Péché Politique"
 sinner_victory_objective_decision_tooltip:1 "Les pécheurs peuvent transformer cette ère moralement convenue en bien plus."
 sinner_victory_objective_decision_desc:0 "Ce soir, les pécheurs sont des créatures désolées, à peine cohérentes dans leur désir de décadence. Mais une fois, que les pécheurs auront régnés sur le plus puissant empire caïnite, Rome elle-même. Ils pourraient être ainsi à nouveaux."
 sinner_victory_objective_decision_confirm:0 "Amis, Romains, Compatriotes, prêtez-moi l'oreilles"
 sinner_victory_objective_decision_effect_tooltip:1 "La Rome éternelle sera restaurée. La Chemin du Péché recréera sa domination politique." 
 ventrue_victory_objective_decision:0 "Roi des Rois"
 ventrue_victory_objective_decision_tooltip:1 "Il y a trop de rois de Kindred dans ce monde."
 ventrue_victory_objective_decision_desc:0 "Vous êtes du clan des Souverains, mais si vous pouviez être le souverain des souverains ? Le clan Ventrue est à son plus fort quand il est uni après tout..."
 ventrue_victory_objective_decision_confirm:0 "En premier le clan Ventrue, puis le reste du monde."
 ventrue_victory_objective_decision_effect_tooltip:1 "Vous unifierez le clan Ventrue, assurant sa domination sur la race Kindred."  
 ventrue_victory_objective_decision_custom:1 "Aucun autre Ventrue que vous ne peut détenir un titre d'Empire."  
 lasombra_victory_objective_decision:0 "La foi dans l’ombre"
 lasombra_victory_objective_decision_tooltip:1 "Cette guerre civile désordonnée doit cesser. Il faut agir avant qu’il ne soit trop tard."
 lasombra_victory_objective_decision_desc:0 "Le clan Lasombra est en guerre contre lui-même depuis la sécession du mouvement Ashirra. Cela a affaibli l’emprise de la Mer des Ténèbres sur la Méditerranée et doit cesser maintenant."
 lasombra_victory_objective_decision_confirm:0 "Il est temps de terminer cette page de notre histoire."
 lasombra_victory_objective_decision_effect_tooltip:1 "Le mouvement Ashirra restant sera paralysé et votre autorité sur le clan sera absolue... pour un moment." 
 lasombra_victory_objective_decision_custom:1 "Le Croissant de Minuit et les titres du califat Ashirra doivent être détruits."  
 ashirra_victory_objective_decision:0 "Croissant d'Ombre"
 ashirra_victory_objective_decision_tooltip:1 "Le mouvement Ashirra doit triompher de la guerre civile en cours."
 ashirra_victory_objective_decision_desc:0 "Le clan Lasombra est en guerre, et la partie musulmane a formé une coalition dont vous faites partie, les Ashirra. Pour que les fidèles soient en sécurité, il faut s’occuper de l’ancienne direction de Lasombra."
 ashirra_victory_objective_decision_confirm:0 "Il est temps de nettoyer les traînards."
 ashirra_victory_objective_decision_effect_tooltip:1 "Le Chrétien restant Lasombra aura une dernière chance de se convertir et votre autorité en tant que Calife Éternel sera assurée."  
 ashirra_victory_objective_decision_custom:1 "Soit vous contrôlez la Mer des Ténèbres, soit personne ne le fait."  
 heretic_victory_objective_decision:0 "Vérité jusqu’à Caine"
 heretic_victory_objective_decision_tooltip:1 "Si rien n’est fait, le Troisième Caïn retournera dans un monde condamné plein d’incroyants."
 heretic_victory_objective_decision_desc:0 "L’Église de la Troisième Caïne, ou hérésie caïnite pour les étrangers, est en train de mourir. Chassé dans presque tous les coins de l’Europe, son leadership brisé, il fait face à l’extinction. Un retour est peu probable, mais... la foi n’a pas besoin de raison après tout."
 heretic_victory_objective_decision_confirm:0 "Le démiurge a reçu un coup dur cette nuit."
 heretic_victory_objective_decision_effect_tooltip:1 "Vous revigorerez l’Église, trouvant de nouvelles croyances et une nouvelle ère d’expansion." 
 anda_victory_objective_decision:0 "Le tonnerre des steppes"
 anda_victory_objective_decision_tooltip:1 "Ces nouvelles terres ont besoin d’une conquête rapide et décisive si nous voulons endurer la contre-attaque de Wan Kuei."
 anda_victory_objective_decision_desc:0 "Voyageant avec notre famille mongole, les Anda ont prospéré. Mais les Chinois Wan Kuei se rassemblent pour la guerre, et nous devons consolider notre position à l’ouest avant leur attaque."
 anda_victory_objective_decision_confirm:0 "Ces steppes sont à nous."
 anda_victory_objective_decision_effect_tooltip:1 "Vous retarderez la contre-attaque de Wan Kuei et inspirerez Western Gangrel à vous rejoindre."  
 gangrel_victory_objective_decision:0 "Le Fléau"
 gangrel_victory_objective_decision_tooltip:1 "Votre monde se meurt, mais il est encore temps de riposter."
 gangrel_victory_objective_decision_desc:0 "Pendant des siècles, le Gangrel a été chassé de la politique des Vampires. Pire, leur famille a été pourchassée et convertie de force. Il faut que cela cesse."
 gangrel_victory_objective_decision_confirm:0 "L’Âge du Loup commence."
 gangrel_victory_objective_decision_effect_tooltip:1 "En unifiant le clan Gangrel, vous paralyserez les clans dits civilisés." 
 tremere_victory_objective_decision:0 "La volonté des Tremeres"
 tremere_victory_objective_decision_tooltip:1 "Le clan Tremere est jeune et entouré d’ennemis. Nous devons renforcer notre position avant qu’il ne soit trop tard."
 tremere_victory_objective_decision_desc:0 " Le clan Tremere est né dans la guerre et la douleur. Les Tzimicès sont implacables, et notre campagne de propagande contre les Salubri pourrait encore être renversée. Nous ne devons pas nous arrêter et écraser tous ceux qui s’opposent à la volonté des Tremeres."
 tremere_victory_objective_decision_confirm:0 "Un nouveau clan, enfin en sécurité"
 tremere_victory_objective_decision_effect_tooltip:1 "Vous deviendrez le Premier Conseiller du clan, et libérerez une malédiction sur vos ennemis restants."  
 tremere_victory_objective_decision_custom:0 "La Voïvodie Tzimisce doit être détruite."
 tremere_victory_objective_decision_customb:0 "Nous devons nous assurer que les Salubri n’ont pas de titre d’empire."
 tzimisce_victory_objective_decision:0 "Changement Eternel"
 tzimisce_victory_objective_decision_tooltip:1 "Notre incapacité à écraser les impudents Usurpateurs a fait de nous la risée de la politique caïnienne pendant trop longtemps."
 tzimisce_victory_objective_decision_desc:0 "Le clan Tzimisce est divisé, incapable de répondre correctement à la faible menace qui devrait être les incursions des Tremeres. Nous avons besoin d’un nouveau leadership plus fort."
 tzimisce_victory_objective_decision_confirm:0 "Cet appel à un festin..."
 tzimisce_victory_objective_decision_effect_tooltip:1 "Vous choisirez la voie à suivre pour le Clan Tzimisce." 
 tzimisce_victory_objective_decision_custom:0 "Le titre de la Maison de Tremere doit être détruit."
 cappadocian_victory_objective_decision:0 "Le codex Sardon"
 cappadocian_victory_objective_decision_tooltip:1 "La plus sainte relique du clan Cappadoce doit être retrouvée."
 cappadocian_victory_objective_decision_desc:0 "Dit pour contenir toutes les prophéties faites par Sargon -Cappadoce- au cours de ses jours mortels, le codex a été perdu et divisé en fragments quand Lazare a perdu sa bataille contre Constance. Les retrouvés serait un événement mémorable."
 cappadocian_victory_objective_decision_confirm:0 "... Il m’appelle"
 cappadocian_victory_objective_decision_effect_tooltip:1 "Vous choisirez quoi faire avec cette source de connaissance ultime."  
 giovanni_victory_objective_decision:0 "La Conspiration"
 giovanni_victory_objective_decision_tooltip:1 "Le clan Cappadoce freine notre véritable potentiel. Nous pouvons faire beaucoup plus."
 giovanni_victory_objective_decision_desc:0 "Nous sommes un nouvel ajout au clan Cappadoce mais nos 'bienfaiteurs' ont déjà dépassé leur utilité. Il est temps de penser à notre avenir en tant que clan indépendant..."
 giovanni_victory_objective_decision_confirm:0 "Invitons notre cher ancêtre à une fête..."
 giovanni_victory_objective_decision_effect_tooltip:1 "Vous allez mettre en mouvement la naissance du clan Giovanni." 
 giovanni_victory_objective_decision_custom:0 "Soit vous contrôlez les Erciyes, soit personne ne le fait."
 furores_victory_objective_decision:0 "Nouveaux Départs"
 furores_victory_objective_decision_tooltip:1 "Nous sommes en train de mourir lentement avec les petites guerres des anciens ou de notre espèce. Il faut que cela cesse."
 furores_victory_objective_decision_desc:0 "La hiérarchie corrompue des vampires étouffe tout espoir que les plus jeunes puissent faire quoi que ce soit. Si cela doit changer, il doit y avoir une révolution assez forte pour supporter leur contre-attaque."
 furores_victory_objective_decision_confirm:0 "Un tout nouvel avenir nous attend."
 furores_victory_objective_decision_effect_tooltip:1 "Vous allez confédérer les États libres en une nouvelle entité politique puissante."  
 setite_victory_objective_decision:0 "L’étreinte du serpent"
 setite_victory_objective_decision_tooltip:1 "L’étreinte aimante de Set et le plus grand désir de liberté morale qui doit être répandus partout."
 setite_victory_objective_decision_desc:0 "Les soi-disant enfants de Caïn sont induits en erreur, croyant en une parodie tordue de la vérité. Nous sommes tous des Setites, et en sécurisant nos frontières traditionnelles, nous ferons le premier pas pour leur faire comprendre."
 setite_victory_objective_decision_confirm:0 "Accueillons nos nouveaux frères."
 setite_victory_objective_decision_effect_tooltip:1 "La vérité se répandra partout, et vous livrerez le combat aux ennemis traditionnels de votre clan." 
 setite_victory_objective_decision_custom:0 "Le califat d’Ashirra doit être détruit."
 salubri_victory_objective_decision:0 "Le Jugement"
 salubri_victory_objective_decision_tooltip:1 "Beaucoup pensent que nous vivons les dernières heures du Salubri en tant que clan, car nous sommes rapidement détruits par nos nombreux ennemis."
 salubri_victory_objective_decision_desc:0 "Le clan Salubri est dispersé, presque poussé à l’extinction par l’assaut brutal des usurpateurs du clan Tremere. Pire encore, des ennemis plus âgés comme les Baali profitent de notre faiblesse. Nous devons riposter avant qu’il ne soit trop tard."
 salubri_victory_objective_decision_confirm:0 "La vengeance a un goût amer."
 salubri_victory_objective_decision_effect_tooltip:1 "Vous unifierez le clan, exposerez les mensonges du clan Tremere et choisirez un chemin pour le votre." 
 salubri_victory_objective_decision_custom:0 "The Baali titles, Order of Moloch and Azaneal, must be destroyed."
 baali_victory_objective_decision:0 "la Fin des Âges"
 baali_victory_objective_decision_tooltip:1 "Cette illusion corrompue et douloureuse de la réalité doit se terminer par l’incendie de toute la Création."
 baali_victory_objective_decision_desc:0 "Notre maître, Nergal, en est venue presque à mettre fin à ce monde misérable pendant les guerres Baali précédentes. Bien que les Molochim  s'opposent à nous plus que jamais, nous pourrions être en mesure de les surmonter et de précipité la fin de tous."
 baali_victory_objective_decision_confirm:0 "... Et ainsi, la fin commence."
 baali_victory_objective_decision_effect_tooltip:1 "Vous allez unifier le clan Baali, invoquer de puissants démons des fosses et commencer la guerre finale." 
 baali_victory_objective_decision_custom:0 "Votre rival, l’Ordre de Moloch doit être détruit. Comme doivent l'être les ennemis habituels de votre clan, la Diète Salubri des Oliviers et l’empire Assamite d’Alamut."
 molochim_victory_objective_decision:0 "Chasser les Mauvais Esprits"
 molochim_victory_objective_decision_tooltip:1 "Nous sommes les seuls à empêcher les Enfants de revenir. Notre devoir est ingrat, mais sacré."
 molochim_victory_objective_decision_desc:0 "Si nous voulons empêcher les fous d’Azanaeli de réveiller d’anciennes horreurs, ils doivent être battus en arrière de manière décisive dans la guerre civile en cours. Malheureusement, nous devons aussi faire face à l’inimitié des Salubri et des Assamites, qui ne font pas de différence entre nous et nos frères tombés."
 molochim_victory_objective_decision_confirm:0 "Et maintenant, nous devons les nourrir."
 molochim_victory_objective_decision_effect_tooltip:1 "Vous renforcerez les doctrines de Hyron et ses disciples." 
 molochim_victory_objective_decision_custom:0 "Votre rival, l’Ordre d’Azaneal doit être détruit. Comme doivent être les ennemis habituels de votre clan, la Diète Salubri des Oliviers et l’empire Assamite d’Alamut."
 ravnos_victory_objective_decision:0 "Ouest et l'Est"
 ravnos_victory_objective_decision_tooltip:1 "Loin de chez vous, vous devez vous faire un nom."
 ravnos_victory_objective_decision_desc:0 "Vous faites partie de la petite minorité du clan Ravnos qui n’habite pas en Inde. Cet exode a causé beaucoup de problèmes à vos proches car vous êtes à peine reconnu comme un caïnite. Mais peut-être que vous pouvez le supporter, et même prospérer dans ces circonstances."
 ravnos_victory_objective_decision_confirm:0 "Un nouveau clan Ravnos émerge."
 ravnos_victory_objective_decision_effect_tooltip:1 "Vous unifierez le clan occidental Ravnos et choisirez une position à adopter envers vos frères orientaux." 
 indian_victory_objective_decision:0 "Mettre fin à l’Éternel"
 indian_victory_objective_decision_tooltip:1 "Le sous-continent est déchiré par la guerre et les conflits. Vous devez prendre des mesures."
 indian_victory_objective_decision_desc:0 "La guerre éternelle entre les caïnites indiens indigènes et l’envahisseur Wan Kuei a duré aussi longtemps que n’importe qui peut se rappeler. L’Inde ne sera jamais libre si personne ne peut unir ses défenseurs dispersés."
 indian_victory_objective_decision_confirm:0 "Finalement, on a gagné."
 indian_victory_objective_decision_effect_tooltip:1 "Vous allez unir l’Inde, réclamer le manteau de Chakravarti et commencer la purge des Wan Kuei restants." 
 kueijin_victory_objective_decision:0 "Lever du soleil écarlate"
 kueijin_victory_objective_decision_tooltip:1 "La guerre éternelle est une affaire sordide, que votre peuple ne peut pas se permettre de perdre."
 kueijin_victory_objective_decision_desc:0 "L’invasion de l’Inde par Wan Kuei est au point mort depuis des millénaires, avec des milliers de morts sans que le têtu Kain-Jin ne se rapproche de la reddition. Vous ne serez pas pris avec le même destin."
 kueijin_victory_objective_decision_confirm:0 "Envoyez un message aux Maisons des Tribunaux."
 kueijin_victory_objective_decision_effect_tooltip:1 "Vous unirez l’Inde. Ensuite, vous choisirez comment traiter avec les Maisons des Tribunaux." 
 laibon_victory_objective_decision:0 "Le Royaume d’ébène"
 laibon_victory_objective_decision_tooltip:1 "Les Enfants de Cagn sont toujours en conflit, ce qui a permis à des menaces étrangères de s’emparer du Royaume d’ébène."
 laibon_victory_objective_decision_desc:0 "L’Afrique est désunie, avec des caïnites envahissant le monde musulman et au-delà revendiquant notre terre comme les leurs. Il est temps de les repousser."
 laibon_victory_objective_decision_confirm:0 "Nous avons protégé l’Afrique."
 laibon_victory_objective_decision_effect_tooltip:1 "Vous unirez le Royaume d’ébène et récolterez le prestige massif à venir pour un tel accomplissement." 
 restore_the_dream:0 "Restaurer le rêve"
 restore_the_dream_tooltip:1 "Tant que certains Vampires y croient, le Rêve peut encore renaître de ses cendres."
 restore_the_dream_desc:0 "1204 a détruit l’utopie sans égal qu'était le rêve de Constantinople. Une telle tragédie inaugurera une terrible ère d’obscurité pour le monde caïnite, à moins que quelqu’un ne reprenne le manteau de Michel Strogoff."
 restore_the_dream_confirm:0 "Comme c’était, ça le sera."
 restore_the_dream_effect_tooltip:1 "Vous créerez le titre de d'Empire de Rêve." 
 restore_the_black_cross:0 "Restauration de la Croix-Noire"
 restore_the_black_cross_tooltip:1 "L’Allemagne a plus que jamais besoin d’un leadership Ventrue fort."
 restore_the_black_cross_desc:0 "La première Croix-Noire de Hardestadt avait des défauts, mais c’était néanmoins un témoignage de la direction de Ventrue que nous pouvions utiliser pour légitimer notre règne."
 restore_the_black_cross_confirm:0 "Sous la croix encore une fois."
 restore_the_black_cross_effect_tooltip:1 "Vous créerez le titre d'Empire de la Croix-Noire." 
 restore_the_voivodate:0 "Restauration de la Voïvodie"
 restore_the_voivodate_tooltip:1 "Les Tzimicès sont indisciplinés et ont besoin d’un leadership fort."
 restore_the_voivodate_desc:0 "Outil politique, la Voïvodie a toujours été contestée. Mais c’est toujours un titre prestigieux, qui pourrait être renforcé plus que jamais."
 restore_the_voivodate_confirm:0 "Nous entrons ici encore une fois."
 restore_the_voivodate_effect_tooltip:1 "Vous créerez le titre d'Empire de Voïvodie." 
 restore_the_sea_of_shadows:0 "Restaurer la Mer des Ténèbres"
 restore_the_sea_of_shadows_tooltip:1 "Notre ancêtre, Lasombra, a besoin d’une main droite forte pour diriger son clan."
 restore_the_sea_of_shadows_desc:0 "Le royaume de Lasombra avait toujours été dirigé par Montano, le plus loyal des enfants de Lasombra. Mais les temps changent, et un nouveau favori pourrait arriver."
 restore_the_sea_of_shadows_confirm:0 "Père, voyez mon ascension !"
 restore_the_sea_of_shadows_effect_tooltip:1 "Vous allez créer le titre d'Empire de Mer des Ténèbres." 
 restore_avalon:0 "Restauration d’Avalon"
 restore_avalon_tooltip:1 "Un royaume de Dieu ne meurt jamais vraiment."
 restore_avalon_desc:0 "Comme vous le savez, Mithra est plus Dieu que Vampire. Qu’il décide de revenir un jour à ses disciples, vous devez préparer le royaume des mortels pour ses disciples."
 restore_avalon_confirm:0 "On se tient prêts."
 restore_avalon_effect_tooltip:1 "Vous créerez le titre d'Empire d'Avalon ." 
 restore_love:0 "Restauration des Cours de l’amour"
 restore_love_tooltip:1 "La France sera Toreador, ou pas du tout."
 restore_love_desc:0 "Les Cours d’Amour sont l’expression du triomphe du Matriarche Toreador sur le Ventrue en France. Cette grande entreprise politique et artistique ne peut pas être laissée pour compte comme l’histoire."
 restore_love_confirm:0 "L’amour est éternel, après tout."
 restore_love_effect_tooltip:1 "Vous allez créer le titre d'Empire de Cour de l’Amour." 
 restore_midgard:0 "Restauration de Midgard"
 restore_midgard_tooltip:1 "Odin veille toujours sur nous."
 restore_midgard_desc:0 "Midgard a subi revers après revers alors que l'Einherjar s'effondrait avant l'invasion des Ventrues. Pour survivre, ils auront besoin d'une contre-attaque massive et d'un nouveau Tout-Puissant."
 restore_midgard_confirm:0 "Ragnarok peut attendre."
 restore_midgard_effect_tooltip:1 "Vous créez l'Empire de Midgard." 
 restore_ashirra:0 "Restauration du Caliphat Ashirra"
 restore_ashirra_tooltip:1 "Les fidèles ont besoin d'une maison."
 restore_ashirra_desc:0 "Le califat Ashirra était une jeune création selon la notion du temps des vampires. Mais il est soutenu par la foi de millions de personnes et, en tant que tel, peut se relever une fois de plus en temps voulu."
 restore_ashirra_confirm:0 "Dieu est grand."
 restore_ashirra_effect_tooltip:1 "Vous créez le titre de Caliphat Ashirra." 
 restore_alamut:0 "Restauration d'Alamut"
 restore_alamut_tooltip:1 "Les enfants de Haqim sont perdus sans leurs terres."
 restore_alamut_desc:0 "Réputé imprenable, Alamut était plus qu'une forteresse pour le clan Haqimite. Symbole politique de la volonté et de l'unité de Haqim, il doit être guéri si les enfants veulent à nouveau prospérer."
 restore_alamut_confirm:0 "Le vent tourne en notre faveur."
 restore_alamut_effect_tooltip:1 "Vous créez l'Empire d'Alamut." 
 restore_giovanni:0 "Restauration de la Famille"
 restore_giovanni_tooltip:1 "Les débuts de la Famille n'ont pas été aussi réussis que supposés."
 restore_giovanni_desc:0 "Les Giovannis ont subi des revers, mais nous avons maintenant une éternité pour nous imposer. Commençons par rassembler la Famille."
 restore_giovanni_confirm:0 "L'Echange Parfait."
 restore_giovanni_effect_tooltip:1 "Vous créez le Royaume Giovanni." 
 restore_ravnos:0 "Restauration du Clan"
 restore_ravnos_tooltip:1 "La Guerre Eternelle ne permet aucune dissidence."
 restore_ravnos_desc:0 "Nous avons perdu le cœur unificateur du clan Ravnos. Ce coup écrasant porté à notre fierté et à notre esprit doit être vengé le plus rapidement possible."
 restore_ravnos_confirm:0 "La guerre fait rage."
 restore_ravnos_effect_tooltip:1 "Vous créez l'Empire Ragnos." 
 restore_setite:0 "Restaurer le Clan"
 restore_setite_tooltip:1 "La terre élue doit être contrôlée par les fidèles."
 restore_setite_desc:0 "L'Égypte a toujours été le cœur de notre clan et de notre foi. Si nous voulons répandre la parole de Set dans le monde, nous devons d'abord garantir notre règne ici."
 restore_setite_confirm:0 "Set soit loué!"
 restore_setite_effect_tooltip:1 "Vous créez l'Empire Setite." 
 restore_talmahera:0 "Restaurer le Tal'mahe'Ra"
 restore_talmahera_tooltip:1 "Même Enoch doit avoir un pied sur Terre."
 restore_talmahera_desc:0 "Bien que nous gouvernions toujours fermement dans le monde souterrain, avoir notre connexion avec le royaume des mortels interrompue n'est pas une bonne chose. La reconquête de nos bastions perdus est une priorité."
 restore_talmahera_confirm:0 "Ouvrez à nouveau les portails."
 restore_talmahera_effect_tooltip:1 "Vous créez l'empire du Tal'mahe'Ra Empire." 
 restore_obertus:0 "Restaurer l'Ordre d'Obertus"
 restore_obertus_tooltip:1 "L'héritage de Constantinople est toujours vivant."
 restore_obertus_desc:0 "En tant que disciples de Via Caeli, nous nous méfions du reste du clan Tzimisce. Mais nous pourrions rétablir l'Ordre Obertus d'autrefois pour nous donner une certaine légitimité en ces temps difficiles."
 restore_obertus_confirm:0 "Pour le fils et le père."
 restore_obertus_effect_tooltip:1 "Vous créez le Royaume de l'Ordre d'Obertus." 
 restore_moloch:0 "Restaurer l'Ordre de Moloch"
 restore_moloch_tooltip:1 "L'Enfant doit être nourri."
 restore_moloch_desc:0 "Notre éternelle guerre de l'ombre pour protéger le monde des démons se déroule mal. Si nous voulons survivre, nous devons à nouveau nous unir sous un même Ordre."
 restore_moloch_confirm:0 "Maintenant, au travail ..."
 restore_moloch_effect_tooltip:1 "Vous allez créer l'Ordre de Moloch." 
 restore_azaneal:0 "Rétablissement de l'Ordre d'Azaneal"
 restore_azaneal_tooltip:1 "Nous avons beaucoup de travail..."
 restore_azaneal_desc:0 "Azaneal avait une vision pour les Baali. Malgré quelques revers, nous devons encore unir nos frères derrière cette vision, sinon la fin bénie ne viendra jamais."
 restore_azaneal_confirm:0 "Le Début de la fin."
 restore_azaneal_effect_tooltip:1 "Vous restaurez l'Ordre d'Azanael." 
 restore_web:0 "Restauration de la toile des couteaux"
 restore_web_tooltip:1 "Nous avons encore plein d'oreilles."
 restore_web_desc:0 "Le retour d'Ur-Shulgi doit être préparé. Le Rideau des Ombres est notre organisation mandataire pour prendre le contrôle du clan Haqimite. Il doit être reconstruit."
 restore_web_confirm:0 "Maintenant, reprendre Alamut!"
 restore_web_effect_tooltip:1 "Je vais restaurer le Rideau des Ombres !" 
 restore_lost_tribe:0 "Restauration de la Tribu Perdue"
 restore_lost_tribe_tooltip:1 "La vision d'Anosh est plus qu'un simple territoire."
 restore_lost_tribe_desc:0 "Si nous voulons hâter la vengeance de la 2e génération de leurs enfants rebelles, nous avons besoin d'une base d'opération solide. La Tribu Perdue de Dastur Anosh était parfaite."
 restore_lost_tribe_confirm:0 "Sur les traves d'Enoch..."
 restore_lost_tribe_effect_tooltip:1 "Vous avez aller restaurer la Tribu Perdue." 
 restore_olives:0 "Restauration du Régime des olives"
 restore_olives_tooltip:1 "Le clan Salubri n'est pas encore mort."
 restore_olives_desc:0 "La dernière bataille de Qawiya autour des États croisés était louable. Si nous voulons sauver le clan Salubri, nous pourrions prendre note de ses méthodes."
 restore_olives_confirm:0 "Viens ici Tremere !"
 restore_olives_effect_tooltip:1 "Vous recréez le Régime des Olives !" 
 restore_see_of_nod:0 "Restauration de la Mer des Ombres"
 restore_see_of_nod_tooltip:1 "La Vraie Foi a besoin d'une Eglise."
 restore_see_of_nod_desc:0 "L'Église du Troisième Caïn est sur ses dernières réserves, harcelée par des incroyants de partout. Une démonstration de foi et de force doit être faite en récupérant Venise, siège du premier archevêque."
 restore_see_of_nod_confirm:0 "Maintenant il faut faire passer le message."
 restore_see_of_nod_effect_tooltip:1 "Vous recréez la Mer des Ombres." 
 restore_tremere:0 "Restauration des Tremere"
 restore_tremere_tooltip:1 "Tous les mages doivent étudier."
 restore_tremere_desc:0 "Notre survie est précaire, avec des ennemis se refermant sur nous, mais les Tremere sont résilients. Nous pourrions reconstruire le siège du pouvoir du clan, si nécessaire."
 restore_tremere_confirm:0 "Preparer la chambre du Concil"
 restore_tremere_effect_tooltip:1 "Vous recréez la Dynastie Tremere." 
 restore_curtain:0 "Restauration du Rideau d'Ombre"
 restore_curtain_tooltip:1 "La grand-mère a besoin de ses aides."
 restore_curtain_desc:0 "Les agents du Progéniteur ont porté des coups profonds contre nous. Mais la grand-mère dort toujours et a besoin de protection. Nous ne devons pas faiblir."
 restore_curtain_confirm:0 "Dormez paisiblement."
 restore_curtain_effect_tooltip:1 "Restaurez le Rideau des Ombres" 
 restore_erciyes:0 "Restauration des Erciyes"
 restore_erciyes_tooltip:1 "La montagne prophétique nous appartient de droit."
 restore_erciyes_desc:0 "Cappadocius lui-même a décrété que les Erciyes sont la base principale du clan. Nous devons la réunir et la conquérir comme nous l'avons fait la première fois."
 restore_erciyes_confirm:0 "Il faudra un certain nettoyage."
 restore_erciyes_effect_tooltip:1 "Vous avez restauré les Erciyes." 
 restore_crescent:0 "Restauration du Croissant de minuit"
 restore_crescent_tooltip:1 "Iberia n'est pas encore perdue."
 restore_crescent_desc:0 "La tentative de Badr d'arrêter la reconquête chrétienne ne s'est pas bien déroulée. Mais nous pourrions mieux réussir et unir à nouveau le sud de la péninsule ibérique pour les fidèles."
 restore_crescent_confirm:0 "Maintenant, regardons vers le nord ..."
 restore_crescent_effect_tooltip:1 "Maintenant, direction le nord ...." 
 restore_feral:0 "Restauration de la Horde feral"
 restore_feral_tooltip:1 "Nous devrions nous rassembler une fois de plus!"
 restore_feral_desc:0 "De nombreux seigneurs de guerre Gangrel ont tenté d'unir le clan par la diplomatie ou la force. Nous devons faire mieux qu'eux et réussir réellement."
 restore_feral_confirm:0 "La chasse commence."
 restore_feral_effect_tooltip:1 "Vous avez restaurer la Horde Feral." 
 restore_eastern:0 "Restauration des Seigneurs de l'Est"
 restore_eastern_tooltip:1 "Les Ventrue avec les caractéristiques des Hongrois."
 restore_eastern_desc:0 "Les Ventrue à l'est de l'Allemagne sont une race rare, considérée avec méfiance. En tant que tels, ils devraient être unis sous les seigneurs de l'Est comme autrefois sous Bulscu."
 restore_eastern_confirm:0 "Le vrai pouvoir revient sur ces terres."
 restore_eastern_effect_tooltip:1 "Vous avez restaurer les Seigneurs de l'Est." 
 restore_thunder:0 "Restauration du Tonnerre infini"
 restore_thunder_tooltip:1 "La Cour doit être reconstruite pour que le cycle se poursuive."
 restore_thunder_desc:0 "Étranger à la fois à Kin-Jin et aux autres Wan Kuei, nous sommes toujours au bord de l'extinction. Mais notre foi est forte et la Cour peut se relever."
 restore_thunder_confirm:0 "Le phénix est ressuscité."
 restore_thunder_effect_tooltip:1 "Vous avez restauré le Tonnerre Infini." 
 restore_scarlet:0 "Restauration de la Cour écarlate"
 restore_scarlet_tooltip:1 "La Cour écarlate détient le pouvoir de Wan Kuei pour la majeure partie de l'Asie du Sud-Est."
 restore_scarlet_desc:0 "Membre puissant, mais quelque peu étranger, des cinq augustes des cours du Wan Kuei, le dragon écarlate est un trophée approprié pour tout ambitieux."
 restore_scarlet_confirm:0 "Un nouveau dragon en plein essor."
 restore_scarlet_effect_tooltip:1 "Vous avez restaurer la Cour écarlate" 
 restore_celestial:0 "Restauration de la Tribu Céleste"
 restore_celestial_tooltip:1 "La divinité n'est pas un voyage facile."
 restore_celestial_desc:0 "Les impénitents ne sont pas les bienvenus par les autres Wan Kuei, et encore moins par Kin Jin. En tant que telle, la tribu céleste est toujours en danger, mais elle est suffisamment flexible pour être reconstruite là où c'est nécessaire."
 restore_celestial_confirm:0 "Les fourmis se mêlent des dieux."
 restore_celestial_effect_tooltip:1 "Vous avez restaurer la Tribu Céleste" 
 restore_golden:0 "Restaurer la croix d'or"
 restore_golden_tooltip:1 "Occitanie n'est pas encore Française."
 restore_golden_desc:0 "S'élevant contre la tyrannie de la Cour de l'Amour parisienne, la Croix d'Or est un symbole du savoir-faire et de l'indépendance occitanienne. Un cri de ralliement puissant que nous pourrions utiliser."
 restore_golden_confirm:0 "Paris ne nous définit pas."
 restore_golden_effect_tooltip:1 "Nous avons crée la Croix d'Or." 
 restore_grand:0 "Restaurer la Grande Cour"
 restore_grand_tooltip:1 "La France peut encore être la nôtre."
 restore_grand_desc:0 "Les maladresses d'Alexandre ont fait perdre la France pour le Clan Ventrue. Mais les choses peuvent changer, et nous pourrions revenir en tant que dirigeants légitimes de ce puissant royaume."
 restore_grand_confirm:0 "La domination Ventrue n'est pas contestable."
 restore_grand_effect_tooltip:1 "Vous avez créer la Grande Cour." 
 restore_timisoara:0 "Restauration du Timisoara Banat"
 restore_timisoara_tooltip:1 "La Carthage de l'Ouest."
 restore_timisoara_desc:0 "Les tentatives de Dominique de créer une nouvelle utopie ont été contrecarrées, une fois de plus, par le vil Clan Ventrue. Pourtant, son idée avait des mérites, et nous pouvions ramasser les morceaux et recommencer."
 restore_timisoara_confirm:0 "Un espoir et un nouveau départ."
 restore_timisoara_effect_tooltip:1 "Vous avez créer le Timisoara Banat." 
 restore_anda:0 "Restauration de la Horde Anda"
 restore_anda_tooltip:1 "Les sons des chevaux peuvent encore être entendus."
 restore_anda_desc:0 "L'Anda fait face à de nombreux ennemis, avec Wan Kuei vengeur à l'est et Gangrel hostile à l'ouest. Mais l'esprit mongol n'est pas si facilement apprivoisé. La Horde se relèvera."
 restore_anda_confirm:0 "Encore une fois !"
 restore_anda_effect_tooltip:1 "Vous avez restaurer la Horde Anda." 
 ruler_exit_torpor:0 "Se réveiller de la torpeur"
 ruler_exit_torpor_tooltip:1 "Sortir du sommeil n'est pas la chose la plus simple."
 ruler_exit_torpor_desc:0 "Tout vampire digne de ce nom a un plan d'urgence au cas où il tomberait dans la torpeur sans le vouloir. Comme vous êtes maintenant le dirigeant nominal des autres vampires, ce pourrait être le bon moment pour activer ledit plan d'urgence."
 ruler_exit_torpor_confirm:0 "Je suis de retour."
 restore_golconda:0 "Restauration de Golconda"
 restore_golconda_tooltip:1 "Le rêve de Saulot ne mourra jamais vraiment."
 restore_golconda_desc:0 "Golconde est la ville où Saulot a trouvé l'état béni du même nom. C'est de la plus haute importance pour tout Salubri qui cherche à rejoindre son ancêtre dans cette sainte communion."
 restore_golconda_confirm:0 "Un pas de plus vers l'illumination."
 restore_golconda_effect_tooltip:1 "Vous avez récréer Golconde." 
 restore_livonia:0 "Restauration de la Livonie"
 restore_livonia_tooltip:1 "La croix ne nous détruira jamais."
 restore_livonia_desc:0 "Pressés depuis des siècles par les chevaliers Caïnites de la Croix, les adeptes de la Via Bestiae se sont unifiés, pour un temps, sous la bannière du Gangrel Qarakh. Cet esprit de résistance pourrait encore être un puissant atout pour notre cause."
 restore_livonia_confirm:0 "Pas un pas en arrière. "
 restore_livonia_effect_tooltip:1 "Vous allez créer le titre du royaume des Ferals de Livonie." 
 restore_reconquista:0 "Restauration de l'Espagne Lasombra"
 restore_reconquista_tooltip:1 "Avec Foi et Ombre, nous reviendrons."
 restore_reconquista_desc:0 "La guerre civile de Lasombra en Espagne était principalement une affaire politique, mais elle a offert de nombreuses opportunités aux plus jeunes membres du clan. En exploitant son héritage, nous espérons pouvoir récolter les mêmes récompenses."
 restore_reconquista_confirm:0 "Retour à la maison."
 restore_reconquista_effect_tooltip:1 "Nous avons créer la Reconquista des Ombres." 
 PODcustom_vampire_decision:0 "Vampire personnalisé"
 PODcustom_vampire_decision_tooltip:1 "#R Assurez-vous que vous souhaitez vraiment faire cela. Voulez-vous effacer tous vos traits surnaturels et accéder au générateur de personnages? #"
 PODcustom_vampire_decision_desc:0 "Assurez-vous que vous voulez vraiment faire cela. Voulez-vous effacer tous vos traits surnaturels et accéder au générateur de personnages?"
 PODcustom_vampire_decision_confirm:0 "Effacer tous les traits surnaturels et accéder au générateur de personnages"
 knights_support_objective_decision:0 "Soutien des Chevaliers d'Acre"
 knights_support_objective_decision_tooltip:1 "Si vous souhaitez unifier l'Inquisition des Ombres, vous aurez besoin de l'aide des Chevaliers"
 knights_support_objective_decision_desc:0 "Les Chevaliers d'Acre sont l'un des cinq ancêtres de l'Inquisition de l'ombre. Si vous souhaitez assurer un succès durable à l'organisation, vous aurez besoin de leur soutien complet."
 knights_support_objective_decision_effect_tooltip2:1 "Les Chevaliers enverront l'un de leur meilleur soldat pour vous aider. Vous revigorerez également l'Inquisition et serez à un pas de plus vers son unification." 
 knights_support_objective_decision_confirm:0 "L'épée de Dieu est prête"
 knights_support_custom_decision:0 "Montano et Alfonzo de Venise, les deux principaux adversaires vampires des Chevaliers, doivent être morts ou en torpeur."
 sisters_support_objective_decision:0 "Soutien des Sœurs de Saint-Jean"
 sisters_support_objective_decision_tooltip:1 "Si vous voulez unifier l'Inquisition de l'Ombre, vous aurez besoin de l'aide des Sœurs"
 sisters_support_objective_decision_desc:0 "Les Sœurs de Saint-Jean sont l'un des cinq ancêtres de l'Inquisition de l'ombre. Si vous souhaitez assurer un succès durable à l'organisation, vous aurez besoin de leur soutien complet."
 sisters_support_objective_decision_effect_tooltip2:1 "Les sœurs enverront l'un de leurs meilleurs soldats pour vous aider. Vous allez également revigorer l'Inquisition et vous rapprocher de son unification." 
 sisters_support_objective_decision_confirm:0 "Le Cœur de Dieu se tient prêt"
 sisters_support_custom_decision:0 "Mithras et Marcus Verus, les deux principaux adversaires vampires des Sœurs, doivent être morts ou en torpeur."
 oculi_support_objective_decision:0 "Assistance de l'Oculi Dei"
 oculi_support_objective_decision_tooltip:1 "Si vous souhaitez unifier l'inquisition de l'ombre, vous aurez besoin de l'aide d'Oculi"
 oculi_support_objective_decision_desc:0 "L'Oculi Dei est l'un des cinq ancêtres de l'inquisition de l'ombre. Si vous souhaitez assurer un succès durable à l'organisation, vous aurez besoin de leur soutien complet."
 oculi_support_objective_decision_effect_tooltip2:1 "L'Oculi enverra l'un de ses meilleurs soldats pour vous aider. Vous allez également revigorer l'Inquisition et vous rapprocher de son unification." 
 oculi_support_objective_decision_confirm:0 "Les yeux de Dieu regardent"
 oculi_support_custom_decision:0 "Salianna et Esclarmonde, les deux principaux adversaires vampires de l'Oculi Dei, doivent être morts ou en torpeur."
 red_support_objective_decision:0 "Soutien de l'Ordre Rouge"
 red_support_objective_decision_tooltip:1 "Si vous souhaitez unifier l'Inquisition de l'ombre, vous aurez besoin de l'aide de l'Ordre"
