 #Settite-Group Faiths
 viaset:0 "Voie de Set"
 viaset_adj:0 "Setite"
 viaset_adherent:0 "Setite"
 viaset_adherent_plural:0 "Setites"
 viaset_desc:0 "La branche principale du clan de Set est un culte adorant leur antédiluvien (ou dieu littéralement) comme le libérateur de toute l’humanité."
 
 viaapep:0 "Voie d'Apep"
 viaapep_adj:0 "Apepite"
 viaapep_adherent:0 "Apepite"
 viaapep_adherent_plural:0 "Apepites"
 viaapep_desc:0 "Ces figures voient leur état de morts-vivants comme un cadeau béni du Serpent-du-Chaos, et non comme une malédiction. En conséquence, ils se délectent de chaos et d’auto-satisfaction. Ils voient Apep, le Serpent-du-Chaos comme un avatar de Set."
 
 pathofsubversion:0 "Voie de la Subversion"
 pathofsubversion_adj:0 "Corruption"
 pathofsubversion_adherent:0 "Corrupteur"
 pathofsubversion_adherent_plural:0 "Corrupteurs"
 pathofsubversion_desc:0 "Ce n’est qu’à travers la corruption des grandes institutions que les gens peuvent être libérés. Les corrupteurs sont d’excellents agents dans les religions et les États organisés."
 
