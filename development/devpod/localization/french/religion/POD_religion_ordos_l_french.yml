 #Scholar-Group Faiths
 
 ordoaenigmatis:0 "Ordo Aenigmatis"
 ordoaenigmatis_adj:0 "Aenigmatis"
 ordoaenigmatis_adherent:0 "Mystique"
 ordoaenigmatis_adherent_plural:0 "Mystiques"
 ordoaenigmatis_desc:0 "Cet Ordo s’intéressait aux énigmes et aux symboles, dégageant des significations cachées, déchiffrant des mythes et des légendes pour parvenir à une véritable connaissance du monde, d’eux-mêmes et de la Bête."
 
 ordosecstasis:0 "Ordo Ecstasis"
 ordosecstasis_adj:0 "Ecstasis"
 ordosecstasis_adherent:0 "Mystique"
 ordosecstasis_adherent_plural:0 "Mystiques"
 ordosecstasis_desc:0 "Cet Ordo s’intéressait aux transes et aux Frénétiques, cherchant à communiquer avec leur Bête pour enfin l’assouvir par des extrêmes de plaisir et de douleur."
 
 ordomaleficus:0 "Ordo Maleficus"
 ordomaleficus_adj:0 "Maleficus"
 ordomaleficus_adherent:0 "Mystique"
 ordomaleficus_adherent_plural:0 "Mystiques"
 ordomaleficus_desc:0 "Peu de choses sont enregistrées sur cet Ordo, sauf qu’ils étaient des infernalistes qui cherchaient de plus grands mystères avec l’aide des Forces de l'Au-delà."
 
 jocastian:0 "Jocastian"
 jocastian_adj:0 "Jocastian"
 jocastian_adherent:0 "Jocastian"
 jocastian_adherent_plural:0 "Jocastians"
 jocastian_desc:0 "Une secte petite et obscure (et peut-être une lignée malkavienne) qui a pris naissance dans le Sabbat comme un culte nodiste, mais qui est depuis devenu indépendant. Alors que la plupart des Jocastiens sont des Malkaviens, il y a aussi quelques Brujah et d’autres Parents savants dans leurs rangs. Ils se consacrent à démêler la véritable histoire des Caïnites et rivalisent avec les Mnemosyne. Bien que certains savants les considèrent comme une lignée en raison de la pratique qu’un maître se laisse diaboliser par un étudiant afin de préserver les connaissances qu’il a recueillies, ils ne sont pas différents de leur clan parent."
 
 mnemosyne:0 "Mnemosyne"
 mnemosyne_adj:0 "Mnemosyne"
 mnemosyne_adherent:0 "Mystique"
 mnemosyne_adherent_plural:0 "Mystiques"
 mnemosyne_desc:0 "Les Mnemosyne, ou Chercheurs-de-Mémoire, sont un culte de Noddistes comprenant des savants malkaviens ; certains suggèrent que les Mnemosyne sont en fait une lignée des Malkaviens. Leur membre le plus en vue est Aristote de Laurent. Les membres du culte cherchent à connaître l’histoire de la Famille, et la plupart d’entre eux suivent la Route de Caïn. Le culte est en conflit avec les Jocastatians et, jusqu’à récemment, le Ventrue aîné Bindusara. Ses membres pratiquent une forme de diablerie; quand un aîné pense que son temps est venu, il permet à un jeune Parent de le diabler afin que ses connaissances puissent être transmises. C’est la raison pour laquelle le culte est parfois appelé une lignée. Le culte est nommé d’après la muse grecque de la mémoire."
 
 ordovaticinii:0 "Ordo Vaticinii"
 ordovaticinii_adj:0 "Vaticinii"
 ordovaticinii_adherent:0 "Mystique"
 ordovaticinii_adherent_plural:0 "Mystiques"
 ordovaticinii_desc:0 "Cet Ordo est obsédé par les prophéties de la Géhenna."
 
 
