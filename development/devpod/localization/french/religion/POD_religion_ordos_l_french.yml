 ordos_religion_desc:0 "Les ordos étaient des cultes mystérieux du Moyen Age, dont les membres étaient exclusivement recrutés parmi les vampires du clan Malkavian. Les Ordos étaient dédiés à déchiffrer les techniques de divination des Malkaviens d’autrefois et de libérer le potentiel dans leur folie pour surmonter la Bête. Ainsi, seuls les Malkaviens ont été admis dans leurs rangs. Ils ont été dispersés à travers le Vieux Monde dans de petits cultes, chacun indépendant et seulement identifiable par leurs méthodes."
