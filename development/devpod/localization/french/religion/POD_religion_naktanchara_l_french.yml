 naktanchara_desc:0 "La foi Naktanchara combine des éléments du bouddhisme tantrique, du culte spirituel, du culte traditionnel Nāga ainsi que de l’hindouisme. Les adorateurs de Naktanchara sont considérés comme bouddhistes, bien que leurs pratiques soient considérées comme quelque peu orthodoxes."
 