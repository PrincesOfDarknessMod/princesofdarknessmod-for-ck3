 naktanchara_religion_desc:0 "Naktanchara suit les enseignements du Bouddha Gautama et des "éclairés" subséquents, afin de surmonter la souffrance de l’existence, infligée par le cycle sans fin de changement par la mort et la renaissance. Atteindre l’illumination est le chemin pour se libérer de Samsara, dans la non-existence du Nirvana."
