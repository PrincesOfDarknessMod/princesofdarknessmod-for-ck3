 war_avatar_of_great_fenris:0 "War Avatar of Great Fenris"
 war_avatar_of_great_fenris_flavor:0 "#F As the ultimate expression of the pact between tribe and totem, the greatest Get heroes my summon the war-avatar of their tribal totem to aid them in their hour of need.#!"

 materialized_banes:0 "Materialized Banes"
 materialized_banes_flavor:0 "#F Evil spirits convinced, or sometimes coerced, to send help to the Dancer in their time of need. They make for difficult opponents to predict.#!"
 
 wyrm_elemental:0 "Wyrm Elemental"
 wyrm_elemental_flavor:0 "#F Elemental spirits of the Wyrm itself.#!"
 
 phantasies:0 "Phantasies"
 phantasies_flavor:0 "#F Plasmics that strongly resemble living creatures.#!"
 
 deliriums:0 "Deliriums"
 deliriums_flavor:0 "#F Plasmics that appear to be modified animals, such as winged horses or cats with antennae.#!"
 
 legendaries:0 "Legendaries"
 legendaries_flavor:0 "#F Plasmics that emulate some type of mythical beast, such as a Phoenix.#!"
 
 wyrds:0 "Wyrds"
 wyrds_flavor:0 "#F Plasmics that have no reference point to a living or legendary creatures.#!"
 
 dopplegangers:0 "Dopplegangers"
 dopplegangers_flavor:0 "#F Dopplegangers are wraiths whose Shadows have consumed them, but they retain their personalities, free will and knowledge of Arcanos.#!"
 
 animate_chimera:0 "Animate Chimera"
 animate_chimera_flavor:0 "#F Animate chimera are simply chimera that have either life or the appearance of life.#!"
 
 enochian_guards:0 "Enochian Temple Guards"
 enochian_guards_flavor:0 "#F The warriors of old assembled once more to protect their immortal masters.#!"
 
 maryannu:0 "Maryannu"
 maryannu_flavor:0 "#F The chariot-warrior mounted nobility might have been forgotten by the mortals but this proud tradition still survive in those that knew it during their previous lives.#!"
  
 romani_scouts:0 "Romani Scouts"
 romani_scouts_flavor:0 "#F Speedy and hardy horse riders adept at finding the best way of approach to a battle.#!"
  
  
  