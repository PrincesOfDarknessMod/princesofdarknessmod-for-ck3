brujah_primogen_court_position:0 "Brujah Primogen"
 brujah_primogen_court_desc:1 "El $brujah_primogen_court_position$ es tradicionalmente responsable de la guerra estratégica en un dominio, aunque también podría incursionar en la erudición a veces, manteniéndose fiel a su apodo de los Eruditos Guerreros."
 cappadocian_primogen_court_position:0 "Primogénito capadocio"
 brujah_primogen_court_position_desc:1 "El $brujah_primogen_court_position$ es tradicionalmente responsable de la guerra estratégica en un dominio, aunque a veces también puede incursionar en la erudición, manteniéndose fiel a su apodo de Warriors Scholars."
 cappadocian_primogen_court_position_desc:1 "Pocos saben tanto como los capadocianos sobre la condición de no muerto. Se puede aprender mucho de ellos, si están dispuestos a hablar".
 lasombra_primogen_court_position:0 "Lasombra Primogen"
 lasombra_primogen_court_position_desc:1 "Los Maestros de las Sombras son un aliado útil para tener de tu lado, pero un enemigo mucho más mortífero si se les cruza."
 toreador_primogen_court_position:0 "Toreador Primogen"
 toreador_primogen_court_position_desc:1 "Toda corte que se precie tiene un Toreador con talento para manejar sus reuniones. Aunque la definición de "talento" puede ser controvertida a veces".
 tzimisce_primogen_court_position:0 "Tzimisce Primogen"
 tzimisce_primogen_court_position_desc:1 "Cuando un invitado ya no es bienvenido pero aún necesitas que responda a unas preguntas... ya sabes a quién llamar".
 ventrue_primogen_court_position:0 "Ventrue Primogen"
 ventrue_primogen_court_position_desc:1 "Los llamados gobernantes de la noche esperan que se les otorgue una gran cantidad de poder y responsabilidades, incluso cuando no lo merecen."
 assamite_primogen_court_position:0 "Banu Haqim Primogen"
 assamite_primogen_court_position_desc:1 "Los hijos de Haqim son obedientes y un ejemplo de disciplina hacia una causa común. La mayoría de las veces".
 gangrel_primogen_court_position:0 "Gangrel Primogen"
 gangrel_primogen_court_position_desc:1 "Un Gangrel nunca está lejos de su manada, listo para ayudar o entorpecer en su nombre."
 malkavian_primogen_court_position:0 "Primogénico Malkavian"
 malkavian_primogen_court_position_desc:1 "Los videntes no controlan los presagios, pero tal vez sea mejor tenerlos de tu lado todavía."
 nosferatu_primogen_court_position:0 "Nosferatu Primogen"
 nosferatu_primogen_court_position_desc:1 "Tener a los Nosferatu a tu favor siempre es una buena idea. La dificultad radica en asegurarse realmente de que están de tu lado..."
 ravnos_primogen_court_position:0 "Ravnos Primogen"
 ravnos_primogen_court_position_desc:1 "Una familia dividida y enemistada sigue siendo una familia igualmente."
 setite_primogen_court_position:0 "Setite Primogen"
 setite_primogen_court_position_desc:1 "El Clan de la Fe puede guiarte espiritualmente, pero quizás no al final que deseabas."
 tremere_primogen_court_position:0 "Tremere Primogen"
 tremere_primogen_court_position_desc:1 "Los Usurpadores traen regalos en abundancia, y maldiciones aún más."
 salubri_primogen_court_position:0 "Salubri Primogen"
 salubri_primogen_court_position_desc:1 "Los Pastores de la humanidad están muriendo, pero su deber permanece."

 POD_primogens.0001.t:0 "Mecánica de los Primogénicos"
 POD_primogens.0001.desc:1 "Como tienes un nivel de Reino (o superior) como gobernante, ahora tienes acceso a los puestos de la corte menor de los Primogénicos.\nEstos puestos representan la expectativa de cada [Clan|E] de tu zona de tener un representante cerca de ti. Cada [Clan|E] valora un conjunto diferente de habilidades, como puedes ver en sus puntuaciones de aptitud, pero todos ellos esperan estar representados.\NSi decides no nombrar a alguien (porque no puedes permitirte su salario, o porque se le necesita en otro lugar, o simplemente porque no tienes a nadie adecuado todavía), puedes esperar que este [Clan|E] específico proteste en los próximos años, dándote un notable malus de opinión con cada miembro de ese [Clan|E] en tu reino."
 POD_primogens.0001.a:0 "Entendido"
 primogen_explanation_tt:0 "Tienes un periodo de gracia de tres años hasta que tu reino espere que se cubran esos puestos."

 lack_primogen_opinion:1 "Se siente marginado"

 POD_primogens.0003.t:0 "Estado de ánimo de los clanes"
 POD_primogens.0003.desc:1 "Como poderoso gobernante de la noche, eres juzgado constantemente por los distintos [Clan|E]s de la sociedad de los no muertos. Aquellos a los que no has favorecido con un puesto de Primogénito se consideran marginados en tu corte, quizás por su insignificancia política en tu reino, o simplemente por tu capricho actual.\NEn cualquier caso, ahora puedes sentir que el ánimo de los Clanes hacia tu gobierno está cambiando de nuevo."
 POD_primogens.0003.a:0 "¿Qué piensan realmente?"
