 afrodisíaco_celebrador_puesto_de_corte:0 "Celebrante afrodisíaco"
 aphrodisiac_celebrant_court_position:0 "Celebrante afrodisíaco"
 aphrodisiac_celebrant_court_position_desc:1 "Un puesto muy disputado con la política social, el Celebrante Afrodisíaco tiene el honor de presidir el Afrodisíaco, donde los Pecadores celebran la llegada de la Primavera con un festival muy vibrante, y decadente."

 lord_of_misrule_court_position:0 "Señor del desgobierno"
 lord_of_misrule_court_position_desc:1 "Elegido durante la Saturnalia, el Señor del Desgobierno tiene total inmunidad y la utiliza para burlarse y menospreciar a todas las autoridades cainitas establecidas en la zona."
