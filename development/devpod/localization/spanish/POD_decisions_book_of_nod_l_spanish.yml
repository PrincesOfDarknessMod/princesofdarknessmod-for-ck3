l_spanish:
 POD_book_of_nod_decision:0 "Libro de Nod"
 POD_book_of_nod_decision_tooltip:0 "El Libro de Nod es un artefacto significativo de la tradición Cainita."
 POD_book_of_nod_decision_opening_desc:0 "Revisarás tu colección de cuentos del Libro de Nod para montaje o lectura."
 POD_book_of_nod_decision_effect_tooltip:1 "Puedes ensamblar partes del Libro de Nod o leer el texto.\n\nUna colección de textos antiguos, considerados sagrados para los Cainitas nodistas. Consta de múltiples recensiones y fragmentos que han sido reensamblados por varios eruditos Vástagos. Tradicionalmente, la transmisión principal de la historia de Caín es oral, mientras que los textos con los eventos más importantes de la historia de Caín están muy bien guardados para proteger a los Cainitas. Se desconoce su autor, aunque a menudo se cita a Malkav, Saulot e incluso Caine por haber escrito partes de él, si no todo. Algunos consideran que todo el libro son mitos o mentiras, una historia que los vampiros inventaron para explicar su existencia o una herramienta utilizada para engañar a otros para que piensen y actúen de cierta manera. La pieza más antigua del Libro está fechada justo antes de la época de Sumeria, alrededor del 4500 a."
 POD_book_of_nod_decision_confirm:0 "Considere el Libro de Nod"
