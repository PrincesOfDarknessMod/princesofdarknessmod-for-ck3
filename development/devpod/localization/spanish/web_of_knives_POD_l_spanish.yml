 POD_web_de_cuchillos.3.t:0 "Prueba : Derrotado"
 POD_web_of_knives.3.desc:0 "Has sido considerado indigno durante el juicio. La Red de Cuchillos no funcionará contigo por ahora y tendrás que esperar un tiempo antes de volver a intentarlo, si es que quieres considerarlo. Sin embargo, no se ha perdido nada de valor real, excepto un poco de orgullo".
 POD_web_of_knives.3.a:0 "La próxima vez, estaré preparado"
 web_trial_failure_tooltip:0 "Podrás volver a intentarlo dentro de 5 años" 
 POD_web_of_knives.3.b:0 "¡Estos lunáticos no merecen mi tiempo!"

 POD_web_of_knives.5.a:0 "¡Gloria a Haqim!"
 POD_web_de_cuchillos.2.t:0 "Prueba de la humanidad"
 POD_web_of_knives.5.effect.success.desc:0 "¡Te creen!"
 POD_web_of_knives.5.success:0 "¡Estás dentro!"
 POD_web_of_knives.5.critical.failure.effect.desc:0 "no te creen..."
 POD_web_of_knives.5.critical.failure:0 "No confíes en las sectas"
 POD_web_of_knives.5.c:0 "Debo declinar cortésmente"
 POD_web_of_knives.2.desc:0 "La segunda prueba es en realidad bastante sencilla. Debes matar al mortal concreto que se te presenta. No se responden preguntas, no se dan razones.\NSólo un asesinato sin sentido.\N-Está claro que están probando si eres capaz de seguir órdenes, sin importar lo brutales o idiotas que puedan parecer. También es probable que estén juzgando tus límites morales, ya que los miembros de la Red son conocidos como vampiros muy inhumanos."
 POD_web_of_knives.2.a:0 "El asesinato sin sentido es"
 POD_web_of_knives.2.b:0 "Esto está yendo demasiado lejos... por ahora"
 POD_web_of_knives.2.c:0 "¡Esto está yendo demasiado lejos!"

 POD_web_of_knives.5.t:0 "Prueba de fe"
 POD_web_of_knives.5.desc:0 "La última prueba es en realidad más una promesa que otra cosa. La Red de Cuchillos cree en un cuento fantasioso en el que Haqim se abrazó a sí mismo para luchar contra los 'Hijos Malditos de Khayyin'. Todo su asunto de los asesinos no es más que una fachada para matar impunemente a tantos [cainitas|E] como sea posible y apoderarse poco a poco de todo su [Clan|E].\NEstá claro que están dementes y deliran... o lo están? Tal vez haya algo en un culto de asesinos sangrientos e impenitentes que te atraiga. O simplemente podrías fingir que crees en sus fantasiosas historias... pero está claro que se ofenderían gravemente si se enteraran".
 POD_web_de_cuchillos.5.a:0 "¡Gloria a Haqim!"
 POD_web_of_knives.5.b:0 "Gloria a Haqim..."
 POD_web_de_cuchillos.5.effect.success.desc:0 "¡Te creen!"
 POD_web_de_cuchillos.5.success:0 "¡Estás dentro!"
 POD_web_of_knives.5.critical.failure.desc:0 "No te creen..." 
 POD_web_de_cuchillos.5.critical.failure:0 "No te fíes de las sectas"    
 POD_web_de_cuchillos.5.c:0 "Debo declinar cortésmente"
 join_web_tooltip:0 "Te unirás a la web, obteniendo acceso a un nuevo panel con contratos a cumplir"
