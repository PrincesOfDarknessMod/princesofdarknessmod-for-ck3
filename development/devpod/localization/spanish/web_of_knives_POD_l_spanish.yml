 POD_web_of_knives.1.desc:0 "Has sido contactado por uno de los escurridizos reclutadores de Web of Knives. Habrá tres pruebas bajo su supervisión y la primera será una "simple" prueba de habilidad contra él. Utilizando la espada o la intriga, tendrás que impresionarle lo suficiente para que el proceso continúe. Puedes elegir entre estos dos tipos de habilidades de asesino para demostrar".
