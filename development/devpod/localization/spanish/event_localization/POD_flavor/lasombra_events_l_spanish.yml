l_spanish:
 pod_lasombraevents.1.n:0 "viendo caras"
 pod_lasombraevents.1.desc:0 "Caras. La última semana has sido muy consciente de ellos. Ya sean mortales, vampiros o un montón de rocas dispuestas a la perfección, todo tiene una cara. Incluyéndote a ti, por supuesto. Excepto que, como todos los de nuestro [Clan|E], estás condenado a no volver a ver tu cara o tu cuerpo nunca más. ¿Cuánto tiempo ha pasado desde la última vez que viste tu propio reflejo? ¿Alguna vez lo has visto, de todos modos? Fuiste un mortal hace tanto tiempo... ¿Cómo reaccionan las demás personas cuando te ven por primera vez? ¿Están asustados, en trance o se ríen a tus espaldas?\nEstas preguntas te están afectando demasiado y es hora de hacer algo al respecto. La forma más sencilla es contratar a un artista y pedirle que dibuje tu retrato. Por lo menos, puede aliviar el dolor."
 pod_lasombraevents.1.loverdesc:0 "Caras. Los últimos días has sido muy consciente de ellos. Ya sean mortales, vampiros o un montón de rocas dispuestas a la perfección, todo tiene una cara. Incluyéndote a ti, por supuesto. Excepto que, como todos los de nuestro [Clan|E], estás condenado a no volver a ver tu cara o tu cuerpo nunca más. ¿Cuánto tiempo ha pasado desde la última vez que viste tu propio reflejo? ¿Alguna vez lo has visto, de todos modos? Fuiste un mortal hace tanto tiempo... ¿Cómo reaccionan las demás personas cuando te ven por primera vez? ¿Están asustados, en trance o se ríen a tus espaldas?\nEstas preguntas te están afectando demasiado y es hora de hacer algo al respecto. La forma más sencilla es contratar a un artista y pedirle que dibuje tu retrato. También podrías pedirle a tu amante, [helper.GetTitledFirstName], que te describa bien, ¿quién sabe?"
 pod_lasombraevents.1.a:0 "Necesito un retrato..."
 pod_lasombraevents.1.b:0 "No tengo necesidad de ello."
 pod_lasombraevents.1.c:0 "¡Pff! ¡No necesito esto!"
 pod_lasombraevents.1.d:0 "Pediré ayuda."
 pod_lasombraevents.1.a.t:0 "Contratas a un artista para que haga tu retrato."
 pod_lasombraevents.1.b.t:0 "Tienes cosas más urgentes en las que gastar dinero."
 pod_lasombraevents.1.b.beast:0 "#R No necesitas nada. Me tienes.#!"
 pod_lasombraevents.1.c.t:0 "Siempre te ves bien."
 pod_lasombraevents.1.d.t:0 "Y ayudarte a recibir."
