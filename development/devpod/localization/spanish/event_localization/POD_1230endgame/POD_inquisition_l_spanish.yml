l_spanish:

 PODinquisition.0001.t:0 "Edad de la inquisition"
 PODinquisition.0001.desc:0 "Han llegado a su conocimiento informes preocupantes. La llamada 'inquisition de la Sombra' parece haberse hartado de la parte de la Sombra de su título. De repente están reuniendo apoyo entre los gobernantes e instituciones de los mortales, lo que ha causado un efecto dominó en todo el mundo. Este movimiento ha sido planeado durante décadas, quizás siglos, y todos sus ataques hasta ahora han sido meras misiones de contención y expediciones de recopilación de información. El verdadero alcance de la conspiración que tiene como objetivo a los Vampiros podría ser mucho más grande de lo que nunca se anticipó. \N - En todas partes, los mortales se están armando detrás de los Cazadores dotados, decididos a acabar con los monstruos de la noche que les han acosado durante tanto tiempo. \N - La venganza se acerca".
 PODinquisition.0001.a:0 "Esto se acabará, seguramente".
 PODinquisition.0001.b:0 "¡A las armas hermanos y hermanas! Terminemos la cacería!"
 PODinquisition.1001.player_warningb:0 "Los inquisidores que aparecerán durante este periodo de tiempo siempre aceptarán ofertas de vasallaje por tu parte, si decides ofrecérselo"
 PODinquisition.1001.t:0 "La inquisition : Francia"
 PODinquisition.1001.desc:0 "Es aquí donde comenzó la inquisition.\NDurante el levantamiento cátaro, muchos hombres de la tela encontraron su camino en el sur de Francia, buscando herejes. Encontraron mucho más. La Francia cainita se vio envuelta en una intriga entre París y Toulouse, y ambos bandos se alegraron de utilizar a los mortales y el levantamiento en su propio beneficio.\NNo esperaban la gran fe y determinación de la Iglesia. Los vampiros fueron asesinados en manada durante la Cruzada Albigense, y la información fue llevada a la Santa Sede sobre esta nueva amenaza. El resto es Historia.\NAsí, no es de extrañar que Francia sea un objetivo principal y temprano de la inquisition abierta que se está llevando a cabo en todo el mundo ahora."
 PODinquisition.1001.a:0 "La Cruz ha venido a purgar Francia una vez más"
 PODinquisition.1001.player_warning:0 "No queda mucho tiempo para prepararse"
 PODinquisition.1002.t:0 "La inquisition : Gran Bretaña"
 PODinquisition.1002.desc:0 "La inquisition siempre tuvo problemas para trabajar en Inglaterra. El dominio de Mitra sobre el país, y la insularidad de la gente de aquí, dificultaron que los agentes de Dios cumplieran su santa misión. Sin embargo, nunca cedieron, y se encontró una solución adecuada: utilizar la Orden Bretona del Armiño como escenario para la purga de Inglaterra.\NY así, ha comenzado, detrás de su Abuela, bretones y británicos leales y piadosos marchan juntos hacia el proceso de limpieza de las islas. Es un asalto total, la Iglesia no tiene reservas y tiene la intención de golpear decisivamente a la resistencia de los chupasangres. Si esta audaz táctica funciona, Inglaterra aún podría salvarse".
 PODinquisition.1002.a:0 "Parece que la Iglesia nunca cederá, ni siquiera aquí"
 PODinquisition.1003.t:0 "La inquisition : Alemania"
 PODinquisition.1003.desc:0 "Aunque Francia es donde se encuentra el verdadero origen de la inquisition, Alemania es su corazón palpitante. Una vez que la inquisition medieval en la sombra comenzó a disolverse, fue un noble austriaco, Leopold von Murnau, quien reunió a todos los que atendían la llamada de Dios en su sociedad secreta. Esta "Sociedad de Leopold" ha sido la fuerza principal detrás del asalto de la Iglesia durante siglos, y ahora está preparando su asalto final.\NSin embargo, la Sociedad no es una fuerza militar, y, después de algunos compromisos, le corresponderá a la Orden Teutónica purgar a los secuaces del Infierno del Santo Imperio Romano. Debidamente informados de las proezas de sus enemigos, los Caballeros se han afianzado en Dortmund, desde donde planean expandir lenta pero seguramente la justa furia de Dios."
 PODinquisition.1003.a:0 "¿Están los teutones a la altura de esta monumental tarea?"
 PODinquisition.1005.t:0 "La inquisition : Iberia"
 PODinquisition.1005.desc:0 "Iberia siempre ha sido un centro de fe. Como tal, las órdenes militares son abundantes, lo que supuso una oportunidad muy sólida para la inquisition en la sombra. Fue bastante fácil convencer a las distintas órdenes de la necesidad de purgar Iberia de los chupasangres, pero fue más difícil hacer que trabajaran juntos.\NLa Iglesia utilizó la figura de Rodrigue de Navarre, el fundador de la primera rama de la inquisition, como punto de encuentro para los ibéricos. Este esquema demostró funcionar bien, y es una inmensa fuerza de caballeros de la Cruz la que ahora se está acumulando en Portugal para iniciar la liberación de Iberia. Con todos los Reinos y Órdenes trabajando de la mano finalmente, parece que la victoria de la inquisition aquí está asegurada."
 PODinquisition.1005.a:0 "Se esperaba"
 PODinquisition.1006.t:0 "La inquisition : Escandinavia"
 PODinquisition.1006.desc:0 "El alcance de la inquisition en Escandinavia siempre ha sido pobre. La tierra es dura, está dividida, e incluso los inquisidores más celosos dudan de que los cainitas puedan realmente prosperar aquí. Como tal, apuntar a esta área no estaba en el plan inicial de la Santa Sede.\NEs la dedicación y la verdadera fe de un norteño, Albjorn, lo que hizo cambiar de opinión a su Santidad. Albjorn argumentó su caso, describiendo el insidioso dominio de los vampiros sobre el buen rebaño de Escandinavia, especialmente en el lejano Norte. Convencida, Roma ha considerado oportuno armar una sólida expedición para ayudar a Albjorn en su búsqueda. El tiempo dirá si fue una buena elección o no".
 PODinquisition.1006.a:0 "La Cruz llega hasta los confines del mundo"
 PODinquisition.1007.t:0 "La inquisition : Italia"
 PODinquisition.1007.desc:0 "No debería sorprender que la inquisition haya guardado sus mejores tropas para la propia Italia. Corrompida desde hace tiempo por los hijos malditos de Caine, la Santa Sede quiere desatar una retribución sobre los italianos no vista desde el diluvio bíblico.\NJean de Lastic, el famoso defensor de Rodas y gran maestro de los Caballeros Hospitalarios, tiene la misión de quemar a todos los vampiros que encuentre. Y se le ha asignado una formidable fuerza para ayudarle en esta piadosa tarea. En lo que respecta a la Santa Sede, el mundo entero pende de la balanza de la batalla italiana. No habrá compromisos, ni rendición, ni piedad. Italia se salvará, como Dios lo exige".
 PODinquisition.1007.a:0 "¿Si este es el fin de los cainitas italianos?"
 PODinquisition.1008.t:0 "La inquisition : Levante"
 PODinquisition.1008.desc:0 "Los Estados Cruzados hace tiempo que desaparecieron en el Levante, pero la Iglesia nunca olvidó los inquietantes informes que llegaban de ellos. Estaba claro que, incluso en esta tierra, la más sagrada, los malditos cainitas gobiernan la noche.\NAtacar aquí siempre fue una perspectiva difícil para la inquisition de la Sombra, ya que la tierra estaba en manos hostiles, pero... estas manos hostiles siguen siendo humanas. Y así, comenzó un largo y arduo proceso diplomático, en el que los mejores negociadores de Italia trabajaron día y noche para convencer a sus antiguos enemigos de que les dejaran operar en el Levante. Finalmente lograron convencerlos y, mientras la inquisition se levanta por todas partes, un dedicado contingente de santos caballeros está preparado para salvar a Tierra Santa de la más asquerosa de las amenazas."
 PODinquisition.1008.a:0 "En Tierra Santa, los cainitas han unido a los mortales contra ellos"
 PODinquisition.1009.t:0 "La inquisition : Arabia"
 PODinquisition.1009.desc:0 "Aunque el mundo musulmán carece de una larga tradición de órdenes sagradas, eso no significa que esté ciego ante la amenaza cainita. Durante mucho tiempo, la propia Meca sirvió de perfecta protección, repeliendo a los monstruos por la pura fe que emanaba de ella. Pero los tiempos cambian, y los astutos chupasangres parecen haber ideado una contramedida. No obstante, no todo está perdido, ya que una pequeña familia de miembros de la tribu con ideas afines se ha encargado de organizar la caza. Creciendo rápidamente gracias a sus considerables registros hasta ahora, esta nueva sociedad, los Ikhwan al-Safa, es ahora lo suficientemente fuerte como para lanzar un gran asalto a las posiciones cainitas conocidas."
 PODinquisition.1009.a:0 "El sol abrasador podría ser el fin de los Arabian Kindred"
 PODinquisition.1010.t:0 "La inquisition : Persia"
 PODinquisition.1010.desc:0 "Una excepción en el amplio mundo musulmán, los cazadores nunca fueron capaces de echar raíces en Persia, siendo el control total del Clan Haqimite en la región el culpable más probable. Aunque una organización no es lo único que importa a un cazador dedicado. Como tal, los individuos, o incluso las pequeñas bandas, siempre fueron una espina en el costado de los Hijos de Caine aquí.\NMientras el resto del mundo se ve envuelto en el contraataque mortal, se ha formado una apresurada alianza de varios grupos pequeños en Persia, para aprovechar el caos circundante y, con suerte, asestar un golpe demoledor a los monstruos de la noche."
 PODinquisition.1010.a:0 "Persia es más antigua de lo que la mayoría de los humanos creen"
 PODinquisition.1011.t:0 "La inquisition : India"
 PODinquisition.1011.desc:0 "La India tiene una larga tradición de caza de monstruos. Sin embargo, a menudo esta tradición ha sido utilizada como fuente por grupos no mucho mejores que las propias presas y esta práctica ha obstaculizado gravemente la creación de una organización unificada, como lo que ocurrió en Europa.\NAsí, incluso cuando el mundo occidental estalla en llamas, la India se mantiene relativamente intacta por el caos. Sin embargo, pequeños informes indican una congregación de cazadores de ideas afines alrededor de Sindh, lo que podría justificar cierta precaución por parte de los verdaderos gobernantes de la India."
 PODinquisition.1011.a:0 "Nada cambia realmente en la tierra de la Guerra Eterna"
 PODinquisition.1012.t:0 "La inquisition : Magreb"
 PODinquisition.1012.desc:0 "Lejos del alcance de la inquisition cristiana, el Magreb sigue mirando con interés el asalto masivo a los cainitas. Habiendo sufrido durante mucho tiempo la misma amenaza, sus habitantes han formado una tradición de cazadores solitarios, los Sayyad al-Ghulan.\NEstos cazadores buscan ahora, por primera vez, agruparse, esperando aprovechar el caos europeo para cazar a los Cainitas que busquen refugio en sus costas."
 PODinquisition.1012.a:0 "Aquí no hay refugio para los vampiros"
 PODinquisition.1013.t:0 "La inquisition : Egipto"
 PODinquisition.1013.desc:0 "Los egipcios son conscientes de la presencia de monstruos desde hace mucho tiempo. Fue el propio Baybars, el primer sultán mameluco, quien descubrió la verdad sobre los adoradores de serpientes que se escondían en sus tierras. La purga que orquestó todavía la sienten los setitas, pero, por desgracia, el propio Baybars fue asesinado por uno de sus agentes.\NDesde entonces, los cainitas han vuelto a sus templos, recuperando su fuerza perdida. Pero en medio del levantamiento europeo contra este enemigo, el legado de Baybars es continuado por un grupo masivo de jóvenes mamelucos, decididos a vengar a su antepasado caído."
 PODinquisition.1013.a:0 "¿Podrán las Serpientes soportar esta tormenta una vez más?"
 PODinquisition.1014.t:0 "La inquisition : Transilvania"
 PODinquisition.1014.desc:0 "A día de hoy, la Iglesia sigue conmocionada por el gran número de informes sobre vampiros que se arrastran por Transilvania. Con algunos de ellos actuando como verdaderos nobles, o incluso peor, ¡como dioses! Lamentablemente para la inquisition de la Sombra, el disputado panorama religioso de esta zona nunca les permitió afianzarse y contener la situación aquí.\NAsí que tuvieron que hacer algo nuevo, y esto ha llegado en forma de "delegar" la tarea de purga a la Orden del Dragón. Esta sociedad caballeresca sabe una cantidad sorprendente de vampiros y demás, y ha sido hasta ahora una gran aliada de la inquisition. Pero, en los rincones de Roma, algunos sospechan que podría ser necesaria una mirada más cercana a ellos una vez terminada su tarea..."
 PODinquisition.1014.a:0 "Dragones contra Vampiros"
 PODinquisition.1015.t:0 "La inquisition : Grecia"
 PODinquisition.1015.desc:0 "La inquisition de la Sombra conoce la presencia de chupasangres en Grecia desde la 4ª Cruzada, de la que obviamente son culpables. ¿Cómo podría haber salido tan mal de otra manera? Durante mucho tiempo, el Imperio Latino fue pensado como una base para atacar cuando la inquisition se revelara, pero... esta parte del plan obviamente ha salido mal.\NSu Santidad no ha olvidado las almas cristianas de oriente, por muy descarriadas que estén. Como tal, recientemente creó la Orden de Nuestra Señora de Belén, con la justa tarea de purgar a los asquerosos cainitas de estas tierras perdidas. Entonces, tal vez, pueda Byzantium ser verdaderamente salvada en alma si no en cuerpo".
 PODinquisition.1015.a:0 "Los francos están de vuelta en Roma Oriental"
 PODinquisition.1016.t:0 "La inquisition : Rusia"
 PODinquisition.1016.desc:0 "La Iglesia Ortodoxa tiene su propio cuerpo inquisitorial, el grupo de cazadores conocido como los Akritai. Respetados incluso por la inquisition de las Sombras por su implacable búsqueda de la justicia, los Akritai estaban al tanto del plan de sus homólogos occidentales para una gran ofensiva contra los no muertos.\NHa costado un poco convencerlos y negociar, pero finalmente han accedido a participar en ella, reuniendo información sobre los cainitas rusos y sus agentes. Esta información será muy útil ahora, ya que el propio Exarca de los Akritai está saliendo al campo cerca de Moscú para lanzar la ofensiva más importante de su organización hasta el momento."
 PODinquisition.1016.a:0 "De Rusia vienen..."
 PODinquisition.1017.t:0 "La inquisition : Europa del Este"
 PODinquisition.1017.desc:0 "La inquisition en la sombra tiene un conflicto con Europa del Este. Aunque la gran presencia de paganos en el pasado parece indicar la influencia de los Cainitas, tuvieron problemas para confirmar realmente esa teoría. Por ello, Roma decidió jugar a largo plazo, creando la Orden de Dobrzyn hace dos siglos.\NEstos caballeros han mantenido un perfil bajo, incluso se disolvieron oficialmente después de un tiempo, pero su verdadera tarea está empezando ahora. Reuniendo a un grupo de dedicados guerreros de la fe, y ayudados por el largo alcance de la red de la inquisition en la Sombra, la Orden está lanzando su ataque total contra las abominaciones impías como parte de la gran Cruzada de la inquisition contra los vampiros."
 PODinquisition.1017.a:0 "¡Hasta las órdenes olvidadas vuelven a luchar!"
