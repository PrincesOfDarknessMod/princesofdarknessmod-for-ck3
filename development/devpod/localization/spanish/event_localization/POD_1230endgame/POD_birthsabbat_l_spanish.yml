l_spanish:

 PODbirthsabbat.0002.t:0 "Nacimiento de una nueva secta"
 PODbirthsabbat.0002.desc:0 "La hipocresía y la desvergonzada arrogancia de la Convención de las Espinas han quedado atrás, y la recién creada 'Camarilla' cree haber ganado y asegurado el fin de la Revuelta Anarca.\NSabes que no es así. Lo único que el movimiento necesita para ganar es un fuerte liderazgo centralizado. Tu liderazgo. Has estado pensando en ello desde Thorns, ¿qué pasaría si pudieras crear una secta para oponerse a la Camarilla?\NYa, la mayoría de los Anarcas se han unido a esta nueva y tentadora causa. El Sabbat se está levantando, ¿serás su heraldo?"
 PODbirthsabbat.0002.a:0 "Caine necesita un regente. Me necesita a mí".
 PODbirthsabbat.0002.b:0 "...esta es una idea terrible" 
 sabbat_founder_modifier:0 "Fundador del Sabbat"
 sabbat_founder_modifier_desc:0 "Este personaje es uno de los fundadores del temido Sabbat. Siempre protegido por la despiadada Mano Negra, tiene una autoridad trascendental en estos tiempos de conflicto sectario."
 sabbat_begins_effect_message:0 "La mayoría de los anarcas ya se han unido al naciente Sabbat"
 PODbirthsabbat.0004.t:0 "Nacimiento del Sabbat"
 PODbirthsabbat.0004.desc:0 "La Revuelta Anarca ha recibido un fuerte golpe con la Convención de las Espinas y el nacimiento de la Camarilla. Sin embargo, el movimiento no ha muerto y ha renacido en algo más... siniestro. Esta nueva secta, que se llama a sí misma el Sabbat, ha cobrado un gran impulso entre los anarcas descontentos. Sus principios básicos son todavía bastante nebulosos, pero se aprecia una clara oposición a la Camarilla, ya que la Mascarada es más laxa, y se permite el culto al propio Caine. Queda por ver si estos Anarcas reformados serán sólo una molestia para el nuevo orden cainita, o si serán capaces de transformar el paisaje nocturno una vez más."
 PODbirthsabbat.0004.a:0 "¿Tal vez tengan razón?"
 PODbirthsabbat.0004.b:0 "No tienen ninguna posibilidad" 
 PODbirthsabbat.100.t:0 "Caminos de la Iluminación"
 PODbirthsabbat.100.desc:0 "Tomando las lecciones de los Caminos de la Edad Oscura, los Sabbat experimentan con nuevos Caminos de la Iluminación. Los Caminos buscan reconciliar las creencias y la moral de un vampiro con su condición de no muerto, para dar a sus no-vivos una forma de pensar que sea compatible con las necesidades del cuerpo vampírico y las exigencias de la Bestia. Los caminos son modos activos de moralidad, comparados con la pasividad de la Humanidad. Mientras que un vampiro con Humanidad ve cómo su brújula moral se erosiona lentamente y pierde terreno frente a la Bestia, un seguidor de la Senda lucha contra ella o la acepta como parte de sí mismo. ¿Cómo decidiré?"
 PODbirthsabbat.100.a:0 "Seguir mi instinto"
 PODbirthsabbat.100.b:0 "Estudiar cuidadosamente los alterantivos"

 PODbirthsabbat.200.t:0 "Caminos de la Iluminación"
 PODbirthsabbat.200.desc:0 "Habiendo estudiado y reflexionado profundamente sobre mi moral, he elegido seguir el Camino de..."
 PODbirthsabbat.200.a:0 "Acuerdo Honorable"
 PODbirthsabbat.200.b:0 "El poder y la voz interior" 
 PODbirthsabbat.200.c:0 "La Bestia"
 PODbirthsabbat.200.d:0 "Armonía"
 PODbirthsabbat.200.e:0 "'Cathari'"
 PODbirthsabbat.200.f:0 "Cain"
 PODbirthsabbat.200.g:0 "La muerte y el alma"
 PODbirthsabbat.200.h:0 "'Vasantasenadharma'"
 PODbirthsabbat.200.i:0 "Metamorfosis"
 PODbirthsabbat.200.j:0 "Noche"

 
   
 
