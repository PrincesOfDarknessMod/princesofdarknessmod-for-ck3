l_spanish:
 POD_ashen_prospect.001.t:0 "Invitar a Ashen"
 POD_ashen_prospect.001.desc:0 "Su estatus e influencia en los mundos de tinieblas te permiten atraer a posibles empleados a su corte."
 POD_ashen_prospect.001.option.a:0 "Prospección de nobles"
 POD_ashen_prospect.001.option.a.tt:0 "Convoca a cainitas de noble herencia que puedan servirte."
 POD_ashen_prospect.001.option.b:0 "Prospección de caballeros"
 POD_ashen_prospect.001.option.b.tt:0 "Envíe una llamada a los cainitas de destreza marcial y fuerza de armas."
 POD_ashen_prospect.001.option.c:0 "Prospección de senescales"
 POD_ashen_prospect.001.option.c.tt:0 "Atrae a los mayordomos y senescales a tu corte con promesas de riqueza y prestigio."
 POD_ashen_prospect.001.option.d:0 "Prospección de ladrones"
 POD_ashen_prospect.001.option.d.tt:0 "Invita a los cainitas expertos en pasar desapercibidos y descuidar la autoridad del príncipe"
 POD_ashen_prospect.001.option.e:0 "Prospección de cultista"
 POD_ashen_prospect.001.option.e.tt:0 "Llegar a los cainitas ambiciosos que controlan a los mortales en los cultos"
 POD_ashen_prospect.101.t:0 "¡La convocatoria ha sido atendida!"
 POD_ashen_prospect.101.desc.noble:0 "No todos los miembros de la nobleza buscan gobernar; algunos se contentan con servir cerca de los puestos de poder. Por un precio, sus consejos pueden ser tuyos."
 POD_ashen_prospect.101.desc.knight:0 "Las guerras de los mortales dan lugar a un mundo lleno de cainitas expertos en los caminos de la guerra dispuestos a entregar su espada y su servicio a un príncipe generoso, por el precio adecuado."
 POD_ashen_prospect.101.desc.seneschal:0 "Aunque las existencias y los inventarios pueden diferir de los del mundo mortal, un señor cainita sensato valora un buen senescal para administrar sus posesiones. "
 POD_ashen_prospect.101.desc.thief:0 "Incluso los parientes no pueden vivir una vida honorable, cuando son oprimidos por los que gobiernan, tener uno de ellos a tu servicio puede ser útil"
 POD_ashen_prospect.101.desc.cult:0 "La religión es muy importante para los mortales. Por eso algunos cainitas se ponen una máscara de Dioses o de sus siervos para manipular a los parientes para que sean sus secuaces"
 POD_ashen_prospect.101.option.a:0 "Elijo a [prospect_one.GetFirstName]"
 POD_ashen_prospect.101.option.a.tt:0 "[prospect_one.GetFirstName] se une a su corte, [prospect_two.GetFirstName] y [prospect_three.GetFirstName] son despedidos"
 POD_ashen_prospect.101.option.b:0 "Elijo a [prospect_two.GetFirstName]"
 POD_ashen_prospect.101.option.b.tt:0 "[prospect_two.GetFirstName] se une a su corte, [prospect_one.GetFirstName] y [prospect_three.GetFirstName] son despedidos"
 POD_ashen_prospect.101.option.c:0 "Elijo a [prospect_three.GetFirstName]"
 POD_ashen_prospect.101.option.c.tt:0 "[prospect_three.GetFirstName] se une a su corte, [prospect_one.GetFirstName] y [prospect_two.GetFirstName] son despedidos"
