l_spanish:
 groom_successor_decision:0 "Buscar un sucesor"
 groom_successor_decision_tooltip:1 "Sus sirvientes le sugerirán una serie de candidatos adecuados"
 groom_successor_decision_desc:0 "Los Wan Kuei no son capaces de abrazar o, la mayoría de las veces, tener hijos de forma natural. Por ello, si no quieres que tu duro trabajo se eche a perder en caso de un desafortunado accidente, debes estar preparado. Pedirás a tus sirvientes que traigan un número de candidatos adecuados".
 groom_successor_decision_effect_tooltip:1 "Te presentarán un grupo de candidatos y podrás aceptar a uno como hijo tuyo a cambio de una cuota de prestigio"
 groom_successor_decision_confirm:0 "Comienza la búsqueda"
 oust_mithras_objective_decision:0 "Poner el sol"
 oust_mithras_objective_decision_tooltip:1 "Si tienes éxito, obtendrás grandes recompensas y paralizarás para siempre el Culto de Mitra"
 oust_mithras_objective_decision_desc:0 "Mithras y su get han sido una plaga en estas islas desde que llegó corriendo hasta aquí, huyendo de sus fracasos en el continente. Ya es hora de que los Kindred de Albión reclamen su patria a este llamado "Dios" persa."
 #expulsar_mithras_objetivo_decisión_efecto_tooltip:1 "Emitir una proclamación para decir que Britannia está libre de la influencia de Mithras".
 oust_mithras_objective_decision_effect_tooltip2:1 "Esto paralizará la Vía Mitra, te otorgará un gran prestigio y formará un nuevo grupo de guerreros dedicados a la defensa de Albión." 
 oust_mithras_objective_decision_confirm:0 "Finalmente, ha llegado el momento"
 oust_mithras_custom_decision:0 "No necesitas tener vasallos de la fe de la Vía Mitra. Los barones no importan".
 oust_mithras_custom_decision2:0 "Es necesario que el propio Mithras esté muerto o en letargo".
 mithras_victory_objective_decision:0 "El cetro y el sol"
 mithras_victory_objective_decision_tooltip:1 "A medida que el Culto de Mitra crezca en influencia, el clan Ventrue caerá en sus garras"
 mithras_victory_objective_decision_effect_tooltip2:1 "El Culto de Mitra será potenciado, y la mayoría de los Ventrue se convertirán a él, entrelazando para siempre el clan y la fe"
 mithras_victory_objective_decision_desc:0 "Mithras ha estado a punto de dominar el panorama religioso una vez ya, en la Antigua Roma. Esta noche, la humanidad parece inalcanzable, pero como miembro destacado de los Ventrue, aún existe la posibilidad de hacerse con el control del clan a través de la fe. Si primero se resuelven algunos pequeños asuntos..."
 mithras_victory_objective_decision_confirm:0 "Clan y fe, como uno solo"
 mithras_victory_custom_decision:0 "Hardestadt, Camilla y Alexander, los tres principales rivales por el dominio del clan Ventrue, deben estar muertos o en letargo"
 mithras_victory_custom_decision2:0 "Ningún otro Ventrue que no seas tú o Mithras puede tener un título del Imperio. A menos que sean miembros del propio Culto de Mithras".
 toreador_victory_objective_decision:0 "Volver a soñar"
 toreador_victory_objective_decision_tooltip:1 "Un momento trascendental que resonará en toda la Historia Cainita".
 toreador_victory_objective_decision_desc:0 "En 1204 ocurrió lo impensable, Miguel, Patriarca del Sueño de Constantinopla, murió mientras su ciudad ardía. Desde ese fatídico momento, numerosos seguidores del Arcángel muerto han intentado recrear esta santísima utopía."
 toreador_victory_objective_decision_confirm:0 "Espero que Miguel esté mirando"
 toreador_victory_objective_decision_effect_tooltip:1 "Se te presentará la posibilidad de elegir entre renovar la fe del Arcángel o simplemente disfrutar de las recompensas materiales." 
 shadow_reconquista_objective_decision:0 "Reconquista de la sombra"
 shadow_reconquista_objective_decision_tooltip:1 "Esto complacerá a los líderes del clan Lasombra y, bueno, te allanará el camino a cosas más grandes que están por venir."
 shadow_reconquista_objective_decision_desc:0 "En un intento erróneo de conservar su poder político, los miembros Ashirra del clan Lasombra han desencadenado una guerra civil que ha estado a punto de acabar con el dominio Lasombra en Iberia. Hay que detenerlos cuanto antes".
 shadow_reconquista_objective_decision_confirm:0 "Su rebelión ha terminado"
 shadow_reconquista_objective_decision_effect_tooltip:1 "Usurparás, o crearás, el título de Mar de las Sombras. Esto puede resultar impopular durante algún tiempo". 
 shadow_reconquista_objective_decision_custom:1 "No debe haber ningún fiel de Ashirra en tu reino. Los barones no cuentan". 
 einherjar_victory_objective_decision:0 "Derrotar a Ragnarok"
 einherjar_victory_objective_decision_tooltip:1 "Más allá del Ragnarok se encuentra la posibilidad de un futuro para tu pueblo."
 einherjar_victory_objective_decision_desc:0 "Los Hijos de Caharl están muy presionados por la llegada del cristianismo. Odín ha desaparecido y su propio pueblo se vuelve contra ellos con horcas y fuego. Como los Ventrue alemanes ya han asegurado ciudades en el sur de Escandinavia, parece que el tiempo de los Einherjar ha terminado."
 ashirra_deconquista_objective_decision:0 "Iberia después de la medianoche"
 ashirra_deconquista_objective_decision_tooltip:1 "Terminar la guerra civil de Iberia a favor de los Ashirra es una empresa tremenda, pero con recompensas dignas."
 ashirra_deconquista_objective_decision_desc:0 "Los Ashirra han sufrido un revés tras otro desde el inicio de la guerra civil del clan Lasombra. Con el apoyo del Mar de las Sombras, la victoria de la rama "De Ruiz" parece asegurada. Pero tal vez aún pueda cambiar las tornas..."
 ashirra_deconquista_objective_decision_confirm:0 "Los fieles han triunfado"
 ashirra_deconquista_objective_decision_effect_tooltip:1 "Tu victoria paralizará el poder del Mar de las Sombras, te pondrá en la línea de las cosas más grandes por venir y te permitirá reconstruir la Iberia desgarrada por la guerra."
 ashirra_deconquista_objective_decision_custom:1 "No debe haber personajes de Via Noctis en tu reino. Los barones no cuentan."
 einherjar_victory_objective_decision_confirm:0 "El Valhalla está asegurado"
 einherjar_victory_objective_decision_effect_tooltip:1 "Utilizarás tus tremendas e inesperadas victorias para revitalizar la fe Einherjar y llevarla a esta nueva era." 
 malkavian_victory_objective_decision_effect_tooltip:1 "Cumplirás un ritual con perfecta precisión y conocimiento de lo que estás haciendo. Probablemente."

 malkavian_victory_objective_decision:0 "La pequeña travesura"
 malkavian_victory_objective_decision_tooltip:1 "¡Malkav te habla y te dice que hagas cosas! Probablemente".
 malkavian_victory_objective_decision_desc:0 "Tienes una compulsión, o una visión profética, o un sueño febril... en cualquier caso, estás casi seguro de que tienes que reunir al clan Malkavian para hacer una gran cosa ritual en Bohemia. O en Jerusalén".
 malkavian_victory_objective_decision_confirm:0 "¡Se avecinan cosas importantes!"

 senate_victory_objective_decision:0 "La República Eterna"
 senate_victory_objective_decision_tooltip:1 "Roma ha caído, pero no su espíritu republicano. El Clan Ventrue se mueve en nuevas direcciones, pero puede ser agitado hacia otras más antiguas y orgullosas."
 senate_victory_objective_decision_desc:0 "Antes de su corrupción en un pozo decadente de pecado, la Roma no muerta era una utopía de cainitas republicanos. El sueño de un Senado en el que todos, bueno la mayoría, de los clanes puedan tener un representante es todavía alcanzable. Si primero se frena el intento equivocado de los Ventrue alemanes de construir un nuevo imperio..."
 senate_victory_objective_decision_confirm:0 "Somos el Senado"
 senate_victory_objective_decision_effect_tooltip:1 "Se reconstruirá la Roma republicana y se pondrán en marcha nuevas políticas para premiar y castigar a los Clanes en consecuencia." 
 senate_victory_objective_decision_custom:1 "El título de los Feudos de la Cruz Negra debe ser tuyo, o no existir". 
 brujah_victory_objective_decision:0 "Cartago"
 brujah_victory_objective_decision_tooltip:1 "Nunca olvidaremos Cartago, la utopía de Troile de hombres y cainitas. Quemada por los celosos romanos, su espíritu sigue vivo en todos y cada uno de nosotros."
 brujah_victory_objective_decision_desc:0 "Roma y Camilla destruyeron nuestra querida Cartago, la ciudad perfecta. Pero nunca desaparecerá de verdad mientras el clan Brujah siga vivo. Tal vez estos tiempos, en los que la propia Roma ha caído, puedan ver el renacimiento de nuestra utopía."
 brujah_victory_objective_decision_confirm:0 "Troile estaría orgulloso"
 brujah_victory_objective_decision_effect_tooltip:1 "Tendrás que elegir cómo manejar este importante momento. O como una herramienta política o como una verdadera utopía divisoria". 
 brujah_victory_objective_decision_custom:1 "Camilla, el entonces y ahora Príncipe de Roma que una vez ha destruido nuestra ciudad, debe estar muerto o en letargo." 
 babayaga_victory_objective_decision:0 "Tu abuela cariñosa"
 babayaga_victory_objective_decision_tooltip:1 "El Clan Nosferatu está condenado, a no ser que consigas aliarte con la Reina de las Hadas."
 babayaga_victory_objective_decision_desc:0 "Absimilliard, progenitor del clan Nosferatu está ahí fuera, planeando la desaparición de su progenie. La única esperanza reside en Baba Yaga, la Pequeña Abuela, que ya consiguió detenerlo una vez. Complácela y tal vez pueda sobrevivir a la tormenta que se avecina".
 babayaga_victory_objective_decision_confirm:0 "¡Abuela, atiende nuestra súplica!"
 babayaga_victory_objective_decision_effect_tooltip:1 "El clan Nosferatu se unirá tras Baba Yaga y su campeón elegido, tú". 
 babayaga_victory_objective_decision_custom:1 "La vieja rival de Baba Yaga, Durga Syn de la Rus Blanca, debe estar muerta o en letargo". 
 nosferatu_victory_objective_decision:0 "Horrores en la oscuridad"
 nosferatu_victory_objective_decision_tooltip:1 "Las amenazas acechan literalmente en la oscuridad. El clan Nosferatu necesita un protector".
 nosferatu_victory_objective_decision_desc:0 "Tu clan es perseguido por su propio progenitor, Absimilliard. Como tal, te ves obligado a esconderte en las sombras, esperando que su ira te consuma. Pero quizás alguien pueda unir al clan y devolver el golpe..."
 nosferatu_victory_objective_decision_confirm:0 "Te soportaremos, fundador"
 nosferatu_victory_objective_decision_effect_tooltip:1 "Unificarás al clan Nosferatu, una poderosa baza a tener en cuenta con un linaje tan resistente y astuto."  
 urshulgi_victory_objective_decision:0 "Un dios sueña"
 urshulgi_victory_objective_decision_tooltip:1 "Sólo el hijo predilecto, Ur-Shulgi, conoce la voluntad de Haqim".
 urshulgi_victory_objective_decision_desc:0 "El clan Assamite está en negación. Nuestro destino es limpiar la tierra de la sangre impura de los Hijos de Khayyin y reclamarla para nuestro progenitor, Haqim. Debemos mostrarles la verdad".
 urshulgi_victory_objective_decision_confirm:0 "El Pastor Negro asciende"
 sinner_victory_objective_decision_tooltip:1 "Los pecadores pueden transformar esta época moralmente tensa en mucho más."
 urshulgi_victory_objective_decision_effect_tooltip:1 "El clan Assamite se convertirá a su culto, y el sueño de Ur-Shulgi segará las almas de los impuros". 
 urshulgi_victory_objective_decision_custom:1 "Los principales rivales por el control de Alamut, Jamal, Nakurtum y Al-Ashrad, deben estar muertos o en letargo." 
 assamite_victory_objective_decision:0 "Una casa dividida"
 assamite_victory_objective_decision_tooltip:1 "Los Hijos de Haqim necesitan un nuevo liderazgo unificador".
 assamite_victory_objective_decision_desc:0 "El clan Assamite está dividido entre fes rivales, cultos secretos e intereses personales. Estas divisiones son profundas y amenazan con destruir el clan en poco tiempo. Deben ser curadas".
 assamite_victory_objective_decision_confirm:0 "Ya no hay hermanos contra hermanos"
 assamite_victory_objective_decision_effect_tooltip:1 "Unificarás al clan Assamite y elegirás un camino para su destino".  
 ventrue_victory_objective_decision_effect_tooltip:1 "Unificarás el clan Ventrue, asegurando su dominio sobre los vampiros."
 assamite_victory_objective_decision_custom:1 "Las sectas escindidas, Red de Cuchillos y Tribu Perdida, están destruidas o bajo tu control."  
 sinner_victory_objective_decision:0 "El pecado político"

 sinner_victory_objective_decision_desc:0 "Esta noche, los Pecadores son criaturas lamentables, apenas coherentes en su ansia de decadencia. Pero una vez, los Pecadores gobernaron el Imperio Cainita más poderoso, la propia Roma. Podría volver a ser así".
 sinner_victory_objective_decision_confirm:0 "Amigos, romanos, compatriotas, prestadme vuestros oídos"
 sinner_victory_objective_decision_effect_tooltip:1 "La Roma eterna será restaurada. El Camino del Pecado recreará su dominio político". 
 ventrue_victory_objective_decision:0 "Rey de Reyes"
 ventrue_victory_objective_decision_tooltip:1 "Hay demasiados reyes del Kindred en este mundo".
 ventrue_victory_objective_decision_desc:0 "Eres del clan de los gobernantes, pero ¿y si pudieras ser el gobernante de los gobernantes? El clan Ventrue es más fuerte cuando está unido, después de todo..."
 ventrue_victory_objective_decision_confirm:0 "Primero el clan Ventrue, luego el mundo"
  
 ventrue_victory_objective_decision_custom:1 "Ningún Ventrue que no seas tú podrá tener un título del Imperio".  
 lasombra_victory_objective_decision:0 "Fe en las sombras"
 lasombra_victory_objective_decision_tooltip:1 "Esta desordenada guerra civil debe terminar. Hay que actuar antes de que sea demasiado tarde".
 lasombra_victory_objective_decision_desc:0 "El Clan Lasombra está en guerra consigo mismo desde la secesión del movimiento Ashirra. Esto ha debilitado el dominio del Mar de las Sombras en el Mediterráneo y es necesario detenerlo ahora."
 lasombra_victory_objective_decision_confirm:0 "Es hora de cerrar esta página de nuestra Historia"
 lasombra_victory_objective_decision_effect_tooltip:1 "El movimiento Ashirra restante quedará paralizado y tu autoridad sobre el clan será absoluta... por un tiempo". 
 lasombra_victory_objective_decision_custom:1 "Hay que destruir la Media Luna y los títulos del Califato Ashirra".  
 ashirra_victory_objective_decision:0 "La Media Luna sobre las Sombras"
 ashirra_victory_objective_decision_tooltip:1 "El movimiento Ashirra debe triunfar en la guerra civil en curso."
 ashirra_victory_objective_decision_desc:0 "El Clan Lasombra está en guerra, y la parte musulmana ha formado una coalición de la que formas parte, los Ashirra. Para que los fieles estén a salvo, hay que acabar con el antiguo liderazgo de los Lasombra".
 ashirra_victory_objective_decision_confirm:0 "Es hora de limpiar a los rezagados"
 ashirra_victory_objective_decision_effect_tooltip:1 "Los Lasombra cristianos restantes tendrán una última oportunidad de convertirse y tu autoridad como Califa Eterno estará asegurada."  
 ashirra_victory_objective_decision_custom:1 "O controlas el Mar de las Sombras, o nadie lo hace".  
 heretic_victory_objective_decision:0 "La verdad hasta Caine"
 heretic_victory_objective_decision_tooltip:1 "Si no se hace nada, el Tercer Caine volverá a un mundo condenado y lleno de incrédulos".
 gangrel_victory_objective_decision_confirm:0 "Comienza la Edad del Lobo."
 gangrel_victory_objective_decision_effect_tooltip:1 "Al unificar el clan Gangrel, paralizarás los llamados clanes civilizados."
 heretic_victory_objective_decision_desc:0 "La Iglesia del Tercer Caine, o Herejía Cainita para los forasteros, está agonizando. Perseguida en casi todos los rincones de Europa, su liderazgo roto, se enfrenta a la extinción. Un regreso es improbable, pero... la fe no necesita de la razón después de todo".
 heretic_victory_objective_decision_confirm:0 "El Demiurgo recibe un duro golpe esta noche".
 heretic_victory_objective_decision_effect_tooltip:1 "Reforzará la Iglesia, encontrando nuevas creencias y una nueva era de expansión." 
 anda_victory_objective_decision:0 "Trueno de las estepas"
 anda_victory_objective_decision_tooltip:1 "Estas nuevas tierras necesitan una conquista rápida y decisiva si queremos aguantar el contraataque de los Wan Kuei."
 anda_victory_objective_decision_desc:0 "Viajando con nuestros parientes mongoles, los Anda han prosperado. Pero los chinos Wan Kuei se reúnen para la guerra, y debemos consolidar nuestra posición en el oeste antes de su ataque."
 anda_victory_objective_decision_confirm:0 "Estas estepas son nuestras ahora"
 anda_victory_objective_decision_effect_tooltip:1 "Retrasarás el contraataque de los Wan Kuei e inspirarás a los Gangrel del oeste a unirse a ti"  
 gangrel_victory_objective_decision:0 "El azote"
 gangrel_victory_objective_decision_tooltip:1 "Tu mundo se está muriendo, pero aún es hora de contraatacar".
 gangrel_victory_objective_decision_desc:0 "Durante siglos, los Gangrel han sido expulsados de la política vampírica. Y lo que es peor, sus parientes han sido perseguidos y convertidos a la fuerza. Esto tiene que acabar".


 tremere_victory_objective_decision:0 "La voluntad de Tremere"
 tremere_victory_objective_decision_tooltip:1 "El clan Tremere es joven y está rodeado de enemigos. Debemos dar un paso adelante y fortificar nuestra nueva posición antes de que sea demasiado tarde."
 tremere_victory_objective_decision_desc:0 "El clan Tremere nació en la guerra y el dolor. Los Tzimisce son implacables, y nuestra campaña de propaganda contra los Salubri aún podría dar un vuelco. No debemos detenernos y aplastar a todos los que se oponen a la voluntad de Tremere".
 tremere_victory_objective_decision_confirm:0 "Un nuevo clan, seguro al fin"
 tremere_victory_objective_decision_effect_tooltip:1 "Te convertirás en el Primer Consejero del clan, y desata una maldición sobre tus enemigos restantes."  
 tremere_victory_objective_decision_custom:0 "El Voivodato de Tzimisce debe ser destruido"
 tremere_victory_objective_decision_customb:0 "Debemos asegurarnos de que los Salubri no tengan un título de imperio"
 tzimisce_victory_objective_decision:0 "Cambio eterno"
 tzimisce_victory_objective_decision_tooltip:1 "Nuestra incapacidad para abatir a los impúdicos usurpadores nos ha convertido en el hazmerreír de la política cainita durante demasiado tiempo."
 tzimisce_victory_objective_decision_desc:0 "El clan Tzimisce yace dividido, incapaz de responder adecuadamente a la insignificante amenaza que deberían ser las incursiones Tremere. Necesitamos un nuevo liderazgo más fuerte".
 tzimisce_victory_objective_decision_confirm:0 "Esta convocatoria de fiesta..."
 tzimisce_victory_objective_decision_effect_tooltip:1 "Elegirás el camino a seguir para el Clan Tzimisce". 
 tzimisce_victory_objective_decision_custom:0 "El título de la Casa de Tremere debe ser destruido"
 cappadocian_victory_objective_decision:0 "El códice de Sargón"
 cappadocian_victory_objective_decision_tooltip:1 "La reliquia más sagrada del clan Cappadocian debe ser recuperada"
 cappadocian_victory_objective_decision_desc:0 "Se dice que contiene todas las profecías hechas por Sargón -Cappadocius- durante sus días mortales, el códice se perdió y se dividió en fragmentos cuando Lázaro perdió su batalla contra Constancia. Reforzarlo sería un acontecimiento trascendental".
 cappadocian_victory_objective_decision_confirm:0 "...Me llama"
 cappadocian_victory_objective_decision_effect_tooltip:1 "Tú elegirás qué hacer con esta fuente de conocimiento definitiva".  
 giovanni_victory_objective_decision:0 "La conspiración"
 giovanni_victory_objective_decision_tooltip:1 "El clan Cappadocian está frenando nuestro verdadero potencial. Podemos ser mucho más".
 giovanni_victory_objective_decision_desc:0 "Somos una nueva incorporación al clan Cappadocian, pero nuestros "benefactores" ya han superado su utilidad. Es hora de pensar en nuestro futuro como clan independiente..."
 giovanni_victory_objective_decision_confirm:0 "Invitemos a nuestro querido antepasado a una fiesta..."
 giovanni_victory_objective_decision_effect_tooltip:1 "Pondrás en marcha el nacimiento del clan Giovanni". 
 giovanni_victory_objective_decision_custom:0 "O controlas a los Erciyes, o nadie lo hace".
 furores_victory_objective_decision:0 "Nuevos comienzos"
 furores_victory_objective_decision_tooltip:1 "Estamos muriendo lentamente en las guerras mezquinas de los Ancianos o de los de nuestra especie, sin ningún tipo de libre albedrío. Esto tiene que acabar".
 furores_victory_objective_decision_desc:0 "La corrupta jerarquía de los Vampiros está estrangulando cualquier esperanza de que los más jóvenes hagan algo. Para que esto cambie, debe haber una revolución lo suficientemente fuerte como para soportar su contraataque."
 furores_victory_objective_decision_confirm:0 "Un nuevo futuro nos espera".
 furores_victory_objective_decision_effect_tooltip:1 "Confederarás los Estados Libres en una nueva y poderosa entidad política."  
 setite_victory_objective_decision:0 "El abrazo de la serpiente"
 setite_victory_objective_decision_tooltip:1 "El abrazo amoroso de Set y el máximo deseo de libertad moral deben difundirse a lo largo y ancho."
 setite_victory_objective_decision_desc:0 "Los llamados Hijos de Caine están engañados, creyendo en una parodia retorcida de la verdad. Todos somos setitas, y asegurando nuestras fronteras tradicionales, daremos el primer paso para que lo entiendan."
 setite_victory_objective_decision_confirm:0 "Demos la bienvenida a nuestros nuevos hermanos".
 setite_victory_objective_decision_effect_tooltip:1 "La verdad se difundirá a lo largo y ancho, y llevaréis la lucha a los enemigos tradicionales de vuestro clan." 
 setite_victory_objective_decision_custom:0 "El Califato de Ashirra debe ser destruido".
 salubri_victory_objective_decision:0 "El ajuste de cuentas"
 salubri_victory_objective_decision_tooltip:1 "Muchos piensan que estamos viviendo las últimas horas de los Salubri como clan, ya que somos rápidamente destruidos por nuestros numerosos enemigos."
 salubri_victory_objective_decision_desc:0 "El clan Salubri yace disperso, casi abocado a la extinción por el brutal asalto de los usurpadores Tremere. Y lo que es peor, enemigos más antiguos como los Baali se están aprovechando de nuestra debilidad. Debemos contraatacar antes de que sea demasiado tarde".
 salubri_victory_objective_decision_confirm:0 "La venganza tiene un sabor agridulce".
 salubri_victory_objective_decision_effect_tooltip:1 "Unificarás el clan, desenmascararás las mentiras de los Tremere y elegirás un camino para ti". 
 salubri_victory_objective_decision_custom:0 "Los títulos de los Baali, Orden de Moloch y Azaneal, deben ser destruidos".
 baali_victory_objective_decision:0 "El fin de los tiempos"
 baali_victory_objective_decision_tooltip:1 "Esta ilusión corrupta y dolorosa de la realidad debe terminar con la quema de toda la Creación."
 baali_victory_objective_decision_desc:0 "Nuestro maestro, Nergal, estuvo muy cerca de acabar con este miserable mundo durante las anteriores Guerras Baali. Aunque los Molochim se oponen a nosotros más que nunca, podríamos ser capaces de vencerlos y acelerar la perdición de todos."
 baali_victory_objective_decision_confirm:0 "...Y así, el fin comienza".
 baali_victory_objective_decision_effect_tooltip:1 "Unificarás al Clan Baali, convocarás a poderosos demonios de las fosas y comenzarás la guerra final". 
 baali_victory_objective_decision_custom:0 "Tu rival, la Orden de Moloch, debe ser destruida. Como también deben serlo los enemigos habituales de tu clan, la Dieta Salubri de los Olivos y el imperio asamita de Alamut."
 molochim_victory_objective_decision:0 "Evitando el mal"
 molochim_victory_objective_decision_tooltip:1 "Somos los únicos que impiden el regreso de los Niños. Nuestro deber es ingrato, pero sagrado".
 molochim_victory_objective_decision_desc:0 "Si queremos evitar que los dementes azanaeli despierten antiguos horrores, hay que derrotarlos con decisión en la guerra civil en curso. Lamentablemente, también debemos hacer frente a la enemistad de los salubri y los asamitas, que no discriminan entre nosotros y nuestros hermanos caídos."
 molochim_victory_objective_decision_confirm:0 "Y ahora, debemos alimentarlos".
 molochim_victory_objective_decision_effect_tooltip:1 "Fortalecerás las doctrinas de Hyron y sus seguidores". 
 molochim_victory_objective_decision_custom:0 "Tu rival, la Orden de Azaneal, debe ser destruida. Al igual que deben serlo los enemigos habituales de tu clan, la Dieta Salubri de los Olivos y el imperio asamita de Alamut."
 ravnos_victory_objective_decision:0 "Oeste y Este"
 ravnos_victory_objective_decision_tooltip:1 "Lejos de casa, debes hacerte un nombre".
 ravnos_victory_objective_decision_desc:0 "Eres parte de la pequeña minoría del Clan Ravnos que no habita en la India. Este éxodo ha causado muchos problemas a tu parentela, ya que apenas se te reconoce como cainita. Pero quizás puedas aguantar, e incluso prosperar en estas circunstancias".
 ravnos_victory_objective_decision_confirm:0 "Surge un nuevo Clan Ravnos".
 ravnos_victory_objective_decision_effect_tooltip:1 "Unificarás el Clan Ravnos occidental y elegirás una postura a adoptar hacia tus hermanos orientales." 
 indian_victory_objective_decision:0 "Acabar con los eternos"
 indian_victory_objective_decision_tooltip:1 "El subcontinente está desgarrado por la guerra y las luchas. Debes dar un paso adelante y entrar en acción".
 indian_victory_objective_decision_desc:0 "La Guerra Eterna entre los cainitas nativos de la India y los Wan Kuei invasores se ha prolongado desde que se tiene memoria. La India nunca será libre a menos que alguien pueda unir a sus dispares defensores".
 indian_victory_objective_decision_confirm:0 "Por fin, hemos ganado".
 indian_victory_objective_decision_effect_tooltip:1 "Unirás a la India, reclamarás el manto de Chakravarti y comenzarás la purga de los Wan Kuei restantes". 
 kueijin_victory_objective_decision:0 "Ascenso de El Sol Escarlata"
 kueijin_victory_objective_decision_tooltip:1 "La Guerra Eterna es un asunto sórdido, que tu pueblo no puede permitirse perder."
 kueijin_victory_objective_decision_desc:0 "La invasión de los Wan Kuei en la India lleva milenios estancada, con miles de muertos sin que los obstinados Kain-Jin estén más cerca de la rendición. Tú no correrás la misma suerte".
 kueijin_victory_objective_decision_confirm:0 "Envía un mensaje a los Tribunales del Interior".
 kueijin_victory_objective_decision_effect_tooltip:1 "Unirás a la India. Entonces elegirás cómo tratar con los Tribunales del Interior". 
 laibon_victory_objective_decision:0 "El Reino de Ébano"
 laibon_victory_objective_decision_tooltip:1 "Los Hijos de Cagn siempre están peleando entre sí, y esto ha permitido que las amenazas extranjeras se afiancen en el Reino de Ébano."
 laibon_victory_objective_decision_desc:0 "África está desunida, con cainitas invasores del mundo musulmán y de más allá que reclaman nuestra tierra como propia. Es hora de hacerlos retroceder".
 laibon_victory_objective_decision_confirm:0 "Hemos protegido a África".
 witching_lands:0 "Fundando las Tierras de las Brujas"
 witching_lands_tooltip:1 "Ha llegado la hora de los druidas."
 witching_lands_desc:0 "Con el surgimiento de los cultos druídicos y los vampiros brujos, los bosques de las Islas Británicas parecen haberse rebelado contra los antiguos dominios Cainitas. Un nuevo coro clama en las Islas Cetro y Esmeralda; los druidas, una vez rechazados por todos los Cainitas, ahora triunfan y sus oscuros bosques se extenderán para siempre."
 witching_lands_confirm:0 "Por los siglos de los siglos."
 witching_lands_effect_tooltip:1 "Crearás el título Witching-Lands."
 laibon_victory_objective_decision_effect_tooltip:1 "Unirás el Reino de Ébano y cosecharás el enorme prestigio que conlleva tal logro." 
 restore_the_dream:0 "Restaurar el sueño"
 restore_the_dream_tooltip:1 "Mientras algunos Vampiros crean en él, el Sueño aún puede resurgir de sus cenizas".
 restore_the_dream_desc:0 "1204 destruyó la utopía sin parangón que era el Sueño de Constantinopla. Semejante tragedia marcará el comienzo de una terrible era de oscuridad para el mundo cainita, a menos que alguien vuelva a tomar el manto de Miguel."
 restore_the_dream_confirm:0 "Como fue, será".
 restore_the_dream_effect_tooltip:1 "Crearás el título de Imperio del Sueño". 
 restore_the_black_cross:0 "Restaurar la Cruz Negra"
 restore_the_black_cross_tooltip:1 "Alemania necesita más que nunca un liderazgo fuerte de Ventrue".
 restore_the_black_cross_desc:0 "La primera Cruz Negra de Hardestadt tenía fallos, pero no obstante era un testamento de liderazgo Ventrue que podíamos utilizar para legitimar nuestro gobierno."
 restore_the_black_cross_confirm:0 "Bajo la Cruz una vez más".
 restore_the_black_cross_effect_tooltip:1 "Crearás el título del Imperio de la Cruz Negra". 
 restore_the_voivodate:0 "Restaurar el Voivodato"
 restore_the_voivodate_tooltip:1 "Los tzimisce son unos revoltosos y necesitan un liderazgo fuerte."
 restore_the_voivodate_desc:0 "Herramienta política, el Voivodato siempre ha sido disputado. Pero sigue siendo un título prestigioso, y podría hacerse más fuerte que nunca."
 restore_the_voivodate_confirm:0 "Entramos aquí una vez más".
 restore_the_voivodate_effect_tooltip:1 "Crearás el título de Imperio de Voivodato". 
 restore_the_sea_of_shadows:0 "Restaurar el Mar de las Sombras"
 restore_the_sea_of_shadows_tooltip:1 "Nuestro progenitor, Lasombra, necesita una mano derecha fuerte para liderar su clan".
 restore_the_sea_of_shadows_desc:0 "El reino de Lasombra siempre había sido liderado por Montano, el hijo más leal de Lasombra. Pero los tiempos están cambiando, y un nuevo favorito podría pasar al frente".
 restore_the_sea_of_shadows_confirm:0 "¡Padre, ve mi ascensión!"
 restore_the_sea_of_shadows_effect_tooltip:1 "Crearás el título de Imperio del Mar de las Sombras". 
 restore_avalon:0 "Restaurar Avalon"
 restore_avalon_tooltip:1 "El reino de un Dios nunca muere de verdad".
 restore_avalon_desc:0 "Como sabes, Mitra es más Dios que Vampiro. Si un día decide volver con sus seguidores, debes preparar un reino mortal para sus seguidores."
 restore_avalon_confirm:0 "Estamos preparados".
 restore_avalon_effect_tooltip:1 "Crearás el título de Imperio de Avalon". 
 restore_love:0 "Restaurar las Cortes del Amor"
 restore_love_tooltip:1 "Francia será Toreador, o no lo será".
 restore_love_desc:0 "Las Cortes del Amor fueron la expresión del triunfo de la Matriarca Toreador sobre los Ventrue en Francia. Esta gran empresa política y artística no puede dejarse pudrir como historia."
 restore_love_confirm:0 "El amor es eterno, después de todo".
 restore_love_effect_tooltip:1 "Crearás el título de Imperio de las Cortes del Amor". 
 restore_midgard:0 "Restaurar Midgard"
 restore_midgard_tooltip:1 "Odín sigue velando por nosotros".
 restore_midgard_desc:0 "Midgard ha sufrido un revés tras otro al desmoronarse los Einherjar ante la invasión Ventrue. Para sobrevivir, necesitarán un contraataque masivo y un nuevo Todopoderoso".
 restore_midgard_confirm:0 "El Ragnarok puede esperar".
 restore_midgard_effect_tooltip:1 "Crearás el título de Imperio de Midgard". 
 restore_ashirra:0 "Restaurar el Califato de Ashirra"
 restore_ashirra_tooltip:1 "Los fieles necesitan un hogar".
 restore_ashirra_desc:0 "El Califato de Ashirra fue una creación joven para los estándares de los Vampiros. Pero ya está respaldado por la fe de millones de personas y, como tal, sólo puede levantarse una vez más a su debido tiempo."
 restore_ashirra_confirm:0 "Dios es verdaderamente grande".
 restore_ashirra_effect_tooltip:1 "Crearás el título de Imperio del Califato de Ashirra". 
 restore_alamut:0 "Restaurar Alamut"
 restore_alamut_tooltip:1 "Los hijos de Haqim están perdidos sin su hogar".
 restore_alamut_desc:0 "Con fama de inexpugnable, Alamut era más que una fortaleza para el Clan Haqim. Símbolo político de la voluntad y la unidad de Haqim, debe recuperarse si los Hijos quieren volver a prosperar."
 restore_alamut_confirm:0 "El viento vuelve a estar a nuestro favor".
 restore_alamut_effect_tooltip:1 "Crearás el título de Imperio de Alamut". 
 restore_giovanni:0 "Restauración de la familia"
 restore_giovanni_tooltip:1 "Los comienzos de la Familia no fueron tan suaves como se esperaba."
 restore_giovanni_desc:0 "Los Giovanni han sufrido contratiempos, pero ahora tenemos una eternidad para salir adelante. Empecemos por volver a unir a la familia".
 restore_giovanni_confirm:0 "El trato perfecto".
 restore_giovanni_effect_tooltip:1 "Crearás el título del Reino Giovanni". 
 restore_ravnos:0 "Restauración del clan"
 restore_ravnos_tooltip:1 "La Guerra Eterna no permite ninguna disidencia".
 restore_ravnos_desc:0 "Hemos perdido el corazón unificador del Clan Ravnos. Este aplastante golpe a nuestro orgullo y espíritu debe ser vengado lo antes posible."
 restore_ravnos_confirm:0 "La guerra continúa".
 restore_ravnos_effect_tooltip:1 "Crearás el título de Imperio de Ravnos". 
 restore_setite:0 "Restaurar el clan"
 restore_setite_tooltip:1 "La Tierra Elegida debe ser controlada por los Fieles".
 restore_setite_desc:0 "Egipto siempre ha sido el corazón de nuestro clan y nuestra fe. Si queremos difundir la palabra de Set por el mundo, primero debemos asegurar nuestro dominio aquí."
 restore_setite_confirm:0 "¡Set sea alabado!"
 restore_setite_effect_tooltip:1 "Crearás el título de Imperio Setita". 
 restore_talmahera:0 "Restaurar el Tal'mahe'Ra"
 restore_talmahera_tooltip:1 "Incluso Enoch debe tener un punto de apoyo en la Tierra".
 restore_talmahera_desc:0 "Aunque seguimos gobernando con firmeza en el Inframundo, que se corte nuestra conexión con el reino mortal no es algo bueno. Reconquistar nuestros bastiones perdidos es una prioridad".
 restore_talmahera_confirm:0 "Abrir los portales una vez más".
 restore_talmahera_effect_tooltip:1 "Crearás el título de Imperio Tal'mahe'Ra". 
 restore_obertus:0 "Restaurar la Orden de Obertus"
 restore_obertus_tooltip:1 "El legado de Constantinopla sigue vivo".
 restore_obertus_desc:0 "Como seguidores de Via Caeli, el resto del Clan Tzimisce desconfía de nosotros. Pero podríamos restablecer la Orden Obertus de antaño para darnos cierta legitimidad en estos tiempos difíciles."
 restore_obertus_confirm:0 "Por el Hijo y el Padre".
 restore_obertus_effect_tooltip:1 "Crearás el título del Reino Obertus". 
 restore_moloch:0 "Restaurar la Orden de Moloch"
 restore_moloch_tooltip:1 "Hay que alimentar a los Niños".
 restore_moloch_desc:0 "Nuestra eterna guerra en la sombra para proteger al mundo de los demonios ha ido mal. Si queremos sobrevivir, debemos unirnos bajo una sola Orden una vez más".
 restore_moloch_confirm:0 "Ahora, a las fosas..."
 restore_moloch_effect_tooltip:1 "Crearás el título del Reino de la Orden de Moloch". 
 restore_azaneal:0 "Restaurar la Orden de Azaneal"
 restore_azaneal_tooltip:1 "Todavía podemos abrir las fosas..."
 restore_azaneal_desc:0 "Azaneal tuvo una visión para los baales. A pesar de algunos contratiempos, aún debemos unir a nuestros hermanos detrás de esta visión, o el bendito final nunca llegará."
 restore_azaneal_confirm:0 "El principio del fin".
 restore_azaneal_effect_tooltip:1 "Crearás el título del Reino de la Orden de Azaneal". 
 restore_web:0 "Restauración de la Red de Cuchillos"
 restore_web_tooltip:1 "Tenemos muchas orejas todavía".
 restore_web_desc:0 "Hay que preparar el regreso de Ur-Shulgi. La Red de Cuchillos es nuestra organización sustituta para tomar el control del Clan Haqimite con este fin. Debe ser reconstruida".
 restore_web_confirm:0 "Ahora, a tomar el control de Alamut".
 restore_web_effect_tooltip:1 "Crearás el título del Reino de la Red de Cuchillos". 
 restore_lost_tribe:0 "Restaurar la tribu perdida"
 restore_lost_tribe_tooltip:1 "La visión de Anosh es más que un territorio".
 restore_lost_tribe_desc:0 "Si queremos acelerar la venganza de la 2ª Generación de su childe díscolo, necesitamos una base de operaciones sólida. La Tribu Perdida de Dastur Anosh era una perfecta".
 restore_lost_tribe_confirm:0 "En el camino de Enoch..."
 restore_lost_tribe_effect_tooltip:1 "Crearás el título del Reino de la Tribu Perdida". 
 restore_olives:0 "Restauración de la Dieta de los Olivos"
 restore_olives_tooltip:1 "El Clan Salubri aún no ha muerto".
 restore_olives_desc:0 "La última resistencia de Qawiya en torno a los Estados Cruzados fue encomiable. Si queremos salvar al Clan Salubri, podríamos tomar nota de sus métodos".
 restore_olives_confirm:0 "Ven a buscar un poco, Tremere".
 restore_olives_effect_tooltip:1 "Crearás el título del Reino de la Dieta de las Aceitunas". 
 restore_see_of_nod:0 "Restauración de la sede de Nod"
 restore_see_of_nod_tooltip:1 "Los Fieles necesitan una Iglesia".
 restore_see_of_nod_desc:0 "La Iglesia del Tercer Caine está en las últimas, acosada por incrédulos en todas partes. Hay que hacer una demostración de fe, y de fuerza, recuperando Venecia, la sede del primer Arzobispo."
 restore_see_of_nod_confirm:0 "Ahora, a correr la voz".
 restore_see_of_nod_effect_tooltip:1 "Crearás el título de Reino de la Sede de Nod". 
 restore_tremere:0 "Restaurar los Tremere"
 restore_tremere_tooltip:1 "Todo Magus necesita un estudio".
 restore_tremere_desc:0 "Nuestra supervivencia es precaria, con los enemigos acercándose a nosotros, pero los Tremere no son nada si no son resistentes. Podríamos reconstruir la sede del poder del Clan en cualquier lugar, si fuera necesario".
 restore_tremere_confirm:0 "Prepara las Cámaras del Consejo".
 restore_tremere_effect_tooltip:1 "Crearás el título de Imperio de la Casa de los Tremere". 
 restore_curtain:0 "Restaurar la Cortina de las Sombras"
 restore_curtain_tooltip:1 "La Abuela tiene necesidad de sus ayudantes".
 restore_curtain_desc:0 "Los agentes del Progenitor han asestado profundos golpes contra nosotros. Pero la Abuela aún duerme y necesita protección. No debemos flaquear".
 restore_curtain_confirm:0 "Que tengas un sueño tranquilo".
 restore_curtain_effect_tooltip:1 "Crearás el título de Imperio de la Cortina de Sombras". 
 restore_erciyes:0 "Restaurar los erciyes"
 restore_erciyes_tooltip:1 "La montaña profética es nuestra por derecho".
 restore_erciyes_desc:0 "El propio Capadocio decretó que los Erciyes son la base principal del Clan. Debemos reunirnos y conquistarla como hicimos la primera vez".
 restore_erciyes_confirm:0 "Necesitará algo de limpieza".
 restore_erciyes_effect_tooltip:1 "Creará el título del Reino de Erciyes". 
 restore_crescent:0 "Restauración de la Media Luna"
 restore_crescent_tooltip:1 "Iberia aún no está perdida".
 restore_crescent_desc:0 "El intento de Badr de detener la Reconquista cristiana no ha ido bien. Pero puede que nos vaya mejor y volvamos a unir el sur de Iberia para los fieles."
 restore_crescent_confirm:0 "Ahora, a mirar hacia el norte..."
 restore_crescent_effect_tooltip:1 "Crearás el título de Reino de la Media Luna". 
 restore_feral:0 "Restaurar la Horda Feral"
 restore_feral_tooltip:1 "¡Deberíamos reunirnos una vez más!"
 restore_feral_desc:0 "Muchos señores de la guerra de Gangrel han intentado unir el Clan mediante la diplomacia o la fuerza. Debemos hacerlo mejor que ellos y tener éxito de verdad".
 restore_feral_confirm:0 "Comienza la cacería".
 restore_feral_effect_tooltip:1 "Crearás el título de Reino de la Horda Feral". 
 restore_eastern:0 "Restauración de los Señores del Este"
 restore_eastern_tooltip:1 "Ventrue con características húngaras".
 restore_eastern_desc:0 "Los Ventrue al este de Alemania son una raza rara, vista con desconfianza. Como tales, deberían unirse como lo hicieron en su día los Señores del Este bajo Bulscu".
 restore_eastern_confirm:0 "La verdadera realeza vuelve a estas tierras".
 restore_eastern_effect_tooltip:1 "Crearás el título del Reino de los Señores del Este". 
 restore_thunder:0 "Restaura el Trueno Infinito"
 restore_thunder_tooltip:1 "La Corte debe ser reconstruida si se quiere continuar el ciclo."
 restore_thunder_desc:0 "Ajenos tanto a Kin-Jin como a otros Wan Kuei, siempre estamos al borde de la extinción. Pero nuestra fe es fuerte, y la Corte puede volver a levantarse".
 restore_thunder_confirm:0 "El fénix se ha levantado de nuevo".
 restore_thunder_effect_tooltip:1 "Crearás el título de Imperio del Trueno Infinito". 
 restore_scarlet:0 "Restaurar la Corte Escarlata"
 restore_scarlet_tooltip:1 "La Corte Escarlata mantiene el poder de los Wan Kuei en la mayor parte del sureste de Asia."
 restore_scarlet_desc:0 "Un miembro poderoso, pero algo ajeno, de las cinco Cortes augustas de los Wan Kuei, el Dragón Escarlata es un trofeo adecuado para cualquier ambicioso Muerto de hambre."
 restore_scarlet_confirm:0 "Un nuevo dragón en ascenso".
 restore_scarlet_effect_tooltip:1 "Crearás el título del Imperio del Dragón Escarlata". 
 restore_celestial:0 "Restauración de la tribu celestial"
 restore_celestial_tooltip:1 "La divinidad no es un viaje fácil".
 restore_celestial_desc:0 "Los Dioses impenitentes no son bienvenidos por otros Wan Kuei, y menos aún por los Kin Jin. Por ello, la Tribu Celestial siempre está en peligro, pero es lo suficientemente flexible como para reconstruirse donde sea necesario."
 restore_celestial_confirm:0 "Las hormigas se entrometen con los dioses".
 restore_celestial_effect_tooltip:1 "Crearás el título de Reino de la Tribu Celestial". 
 restore_golden:0 "Restaurar la Cruz de Oro"
 restore_golden_tooltip:1 "Occitania aún no es francesa".
 restore_golden_desc:0 "Levantándose contra la tiranía de la Corte del Amor de París, la Cruz de Oro es un símbolo de la pericia y la independencia de Occitania. Un poderoso grito de guerra que podríamos utilizar".
 restore_golden_confirm:0 "París no nos define".
 restore_golden_effect_tooltip:1 "Crearás el título del Reino de la Cruz de Oro". 
 restore_grand:0 "Restaurar la Gran Corte"
 restore_grand_tooltip:1 "Francia puede seguir siendo nuestra".
 restore_grand_desc:0 "Los errores de Alejandro hicieron perder Francia para el Clan Ventrue. Pero las cosas pueden cambiar, y podríamos volver a ser los legítimos gobernantes de este poderoso Reino."
 restore_grand_confirm:0 "El dominio de los Ventrue no es negociable".
 restore_grand_effect_tooltip:1 "Crearás el título de Reino de la Gran Corte". 
 restore_timisoara:0 "Restaurar el Banato de Timisoara"
 restore_timisoara_tooltip:1 "Cartago del Este".
 restore_timisoara_desc:0 "Los intentos de Dominic de crear una nueva utopía se han visto frustrados por, una vez más, el vil Clan Ventrue. Aun así, su idea tenía méritos, y podríamos recoger los pedazos y empezar de nuevo".
 restore_timisoara_confirm:0 "Un esperanzador nuevo comienzo".
 restore_timisoara_effect_tooltip:1 "Crearás el título del Reino del Banato de Timisoara". 
 restore_anda:0 "Restauración de la Horda de Anda"
 restore_anda_tooltip:1 "Todavía se oyen los sonidos de los caballos".
 restore_anda_desc:0 "Los Anda se enfrentan a muchos enemigos, con los vengativos Wan Kuei al este y los hostiles Gangrel al oeste. Pero el espíritu mongol no es tan fácil de domar. La Horda se levantará de nuevo".
 restore_anda_confirm:0 "Cabalgamos una vez más".
 restore_anda_effect_tooltip:1 "Crearás el título de Imperio de la Horda de Anda". 
 ruler_exit_torpor:0 "Salir del letargo"
 ruler_exit_torpor_tooltip:1 "Gobernar desde el letargo no es lo más fácil".
 ruler_exit_torpor_desc:0 "Cualquier Vampiro que se precie tiene un plan de contingencia por si cae en el letargo sin querer. Como ahora eres el gobernante nominal de otros Vampiros, podría ser un buen momento para activar dicho plan de contingencia."
 ruler_exit_torpor_confirm:0 "He vuelto".
 restore_golconda:0 "Restaurar Golconda"
 restore_golconda_tooltip:1 "El sueño de Saulot nunca morirá del todo".
 restore_golconda_desc:0 "Golconda es la ciudad en la que Saulot encontró el bendito estado del mismo nombre. Es de suma importancia para cualquier Salubri que busque unirse a su progenitor en esta santa comunión."
 restore_golconda_confirm:0 "Un paso más hacia la iluminación".
 restore_golconda_effect_tooltip:1 "Crearás el título del Reino de Golconda". 
 restore_livonia:0 "Restaurar Livonia"
 restore_livonia_tooltip:1 "La Cruz nunca nos destruirá".
 restore_livonia_desc:0 "Duramente presionados durante siglos por los caballeros cainitas de la Cruz, los seguidores de Via Bestiae se han unificado, durante un tiempo, bajo el estandarte del Gangrel Qarakh. Este espíritu de resistencia podría seguir siendo una poderosa baza para nuestra causa."
 restore_livonia_confirm:0 "Ni un paso atrás".
 restore_livonia_effect_tooltip:1 "Crearás el título de Reino de los Ferales de Livonia". 
 restore_reconquista:0 "Restauración de la España de Lasombra"
 restore_reconquista_tooltip:1 "Con Fe y Sombras, volveremos".
 restore_reconquista_desc:0 "La guerra civil de los Lasombra en España fue sobre todo un asunto político, pero trajo muchas oportunidades a los miembros más jóvenes del clan. Aprovechando su legado, esperamos poder cosechar las mismas recompensas."
 restore_reconquista_confirm:0 "De vuelta a nuestra casa".
 restore_reconquista_effect_tooltip:1 "Crearás el título del Reino Reconquista de la Sombra". 
 restore_red_order:0 "Restaurar el Orden Rojo"
 restore_red_order_tooltip:1 "Hemos conocido el infierno. Tomamos su conocimiento impío, para complementar la palabra de lo divino".
 restore_red_order_desc:0 "La caída de nuestro dominio principal no detiene nuestras investigaciones. A través de la bendición santa e impía, retomaremos nuestra tierra".
 restore_red_order_confirm:0 "Vamos a profundizar".
 restore_red_order_effect_tooltip:1 "Recrearás el título del Reino de la Orden Roja". 
 restore_knights_of_acre:0 "Restaurar los Caballeros de Acre"
 restore_knights_of_acre_tooltip:1 "¡Como la espada fundida, volveremos a forjar la espada de Dios!"
 restore_knights_of_acre_desc:0 "Mientras haya un hermano empuñando la Cruz, el legado de la orden perdurará".
 restore_knights_of_acre_confirm:0 "Hemos recuperado nuestro Hogar".
 restore_knights_of_acre_effect_tooltip:1 "Volverás a crear el título del Reino de los Caballeros de Acre". 
 restore_sisters_of_st_john:0 "Restablecerás a las Hermanas de San Juan"
 restore_sisters_of_st_john_tooltip:1 "Mientras haya una hermana viva, nuestra misión continuará".
 restore_sisters_of_st_john_desc:0 "La caída de la rama principal de la Orden nunca significó su destrucción. Cualquier hermana puede retomar el manto y continuar la santa obra".
 restore_sisters_of_st_john_confirm:0 "Hemos recuperado nuestra Casa".
 restore_sisters_of_st_john_effect_tooltip:1 "Volverás a crear el título del Reino de las Hermanas de San Juan". 
 restore_house_murnau:0 "Restauras el reino de la casa Murnau"
 restore_house_murnau_tooltip:1 "Baviera es nuestra. Se llevaron nuestra cuna y nuestra sangre. Derramemos la suya".
 restore_house_murnau_desc:0 "La historia de Baviera y de la Casa están entrelazadas. Tendrás que retomar la tierra de tus ancestros para continuar tu lucha. "
 restore_house_murnau_confirm:0 "Hemos recuperado nuestra Casa".
 restore_house_murnau_effect_tooltip:1 "Volverás a crear el título del Reino de Murnau".  
 restore_oculi_dei:0 "Restaurar el Oculi Dei"
 restore_oculi_dei_tooltip:1 "Somos los Oculi Dei. Vimos nuestro regreso a nuestro hogar"
 restore_oculi_dei_desc:0 "Para centralizar nuestra red, hay que retomar Flandes"
 restore_oculi_dei_confirm:0 "Estamos de vuelta en el Canal".
 knights_support_objective_decision_effect_tooltip2:1 "Los Caballeros enviarán a uno de sus mejores para ayudarte. También revitalizarás la Inquisición y estarás un paso más cerca de unificarla."
 restore_oculi_dei_effect_tooltip:1 "Recrearás el título del Reino de Oculus Dei".  
 restore_sword_of_st_james:0 "Restaurar la espada de Santiago"
