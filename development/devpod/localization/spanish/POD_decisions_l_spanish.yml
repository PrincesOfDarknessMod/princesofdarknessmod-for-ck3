avenge_arikels_shame_objective_decision:0 "Vengar la vergüenza de Arikel "
avenge_arikels_shame_objective_decision_tooltip:0 "Tu antepasado fue avergonzado hace mucho tiempo y los viejos rencores nunca mueren realmente."
avenge_arikels_shame_objective_decision_desc:0 "El fundador del [ Clan|E ] Toreador, Arikel , una vez gobernó como una diosa de Sumer. Su acérrimo rival, Ennoia de los Gangrel, la obligó a salir, creando una enemistad entre los dos que subsiste hasta esta noche."
avenge_arikels_shame_objective_decision_effect_tooltip:0 "Tu fama como principal defensor de Arikel estará asegurada y el clan Gangrel será avergonzado."
avenge_arikels_shame_objective_decision_confirm:0 "Un mal hecho bien"
