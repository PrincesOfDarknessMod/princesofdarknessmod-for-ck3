toreador_grandeur_victory_objective_decision_desc:0 "Los mejores Toreador son pioneros, respetados y admirados en todas partes por sus audaces esfuerzos artísticos y eruditos. Debes esforzarte por ser el mecenas más famoso del mundo de los muertos vivientes".
toreador_grandeur_victory_objective_decision_effect_tooltip:1 "Serás respetado entre los Toreador como el seguidor, y las mentes más brillantes de esta era acudirán a tu reino".
toreador_grandeur_victory_objective_decision_confirm:0 "Una obra maestra en proceso"
