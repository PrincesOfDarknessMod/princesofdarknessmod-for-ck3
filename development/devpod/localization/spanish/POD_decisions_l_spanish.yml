library_victory_objective_decision_desc:0 "Perteneces a un clan erudito que conoce el valor y el poder ocultos detrás de la palabra escrita. Debes asegurarte de tener a tu disposición la mayor biblioteca de esta época."
library_victory_objective_decision_effect_tooltip:1 "Podrás aprender nuevos estilos de vida más rápido y las innovaciones de tu cultura también se beneficiarán".
library_victory_objective_decision_confirm:0 "Una biblioteca que rivaliza con la antigua Alejandría"
