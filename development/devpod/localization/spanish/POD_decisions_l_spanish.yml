POD_create_amulets_decision_tooltip:1 "Intentarás fabricar un amuleto con el material que obtuviste".
POD_create_amulets_decision_confirm:1 "¿Dónde está mi pincel?"
POD_create_effigy_decision:0 "Crear efigie"
POD_create_effigy_decision_desc:1 "Los hechizos y rituales de efigies se basan en los ideales de la magia compasiva y la fabricación de objetos espirituales. Dichos objetos pueden servir como reliquias para el alma en el más allá o artefactos poderosos en el mundo material. Una imagen o modelo puede tener el poder de hacer que su destino afecte a la cosa que representa".
POD_create_effigy_decision_tooltip:1 "Intentarás fabricar una efigie con el material que obtuviste".
POD_create_effigy_decision_confirm:1 "¿Dónde está mi graver?"
POD_study_true_name_decision:0 "Aprender nombres verdaderos"
POD_study_true_name_decision_desc:1 "Descubrir un nuevo ren (nombre) es una tarea exigente. Por lo general , un escriba que ha desarrollado cierta habilidad con la nomenclatura conoce algunos nombres verdaderos".
POD_study_true_name_decision_tooltip:1 "Intentarás mejorar tus conocimientos sobre nomenclatura."
POD_study_true_name_decision_confirm:1 "Ten paciencia".
 
travel_to_umbra_decision:0 "Viaja a Umbra"
travel_to_umbra_decision_desc:1 "La Umbra, también llamada el mundo de los espíritus, la sombra o la sombra aterciopelada. Algunos consideran que la Umbra es una dimensión, un universo o una realidad alternativos o paralelos."
travel_to_umbra_decision_tooltip:1 "Entrarás en un reino que existe al lado del mundo material y, sin embargo, está separado".
travel_to_umbra_decision_confirm:1 "Estoy subiendo"
travel_to_yang_world_decision:0 "Viaja al Mundo Yang"
travel_to_yang_world_decision_desc:1 "Un reino de chi positivo que flota "por encima" del plano físico. Albergando un número casi infinito de reinos y habitantes espirituales, el Mundo Yang rebosa energía."
travel_to_underworld_decision:0 "Viaje al inframundo"
travel_to_underworld_decision_desc:1 "El Inframundo, también conocido como la Umbra Oscura o el Contrario , es el dominio de los muertos y los recuerdos."
travel_to_yin_world_decision:0 "Viaja al Mundo Yin"
travel_to_yin_world_decision_desc:1 "El Mundo Yin es la tierra del Chi Negativo y se encuentra "debajo" de las tierras de la Carne. En contraste con la feroz vitalidad del Mundo Yang, el Mundo Yin es un lugar de serenidad y desapego."
travel_to_underworld_decision_tooltip:1 "Entrarás en un reino que existe junto al mundo material y, sin embargo, está separado".
travel_to_underworld_decision_confirm:1 "Voy a “bajar”"
 
end_the_diaspora_objective_decision:0 "Acabar con la diáspora"
end_the_diaspora_objective_decision_desc:1 "Desde la caída de Khem ante las fuerzas de Alejandro en el 332 a. C., los Shemsu-Heru han tratado a Amenti como su capital y casi abandonaron su tierra natal después del surgimiento del Islam. Es hora de restaurar tu patria. "
end_the_diaspora_objective_decision_tooltip:1 "Recuperarás tu antiguo hogar."
end_the_diaspora_objective_decision_confirm:1 "Nuestro hogar"
in_name_of_horus_objective_decision:0 "Cruzada de Horus"
in_name_of_horus_objective_decision_desc:1 "Horus, el hijo de Osiris y el más grande de los Imperecederos, lideró a la mayoría de las momias en una cruzada para limpiar el mundo de su tío asesino, Set , quien era el sirviente de Apofis. Terminarás esta cruzada y conocerás Horus en su castillo para demostrar tu gloria".
in_name_of_horus_objective_decision_tooltip:1 "Le demostrarás a Horus tu espíritu."
in_name_of_horus_objective_decision_confirm:1 "¡En nombre de Horus!"
in_name_of_horus_objective_decision_custom:1 "No debe haber ningún gobernante setita independiente en el mundo. Los condes no cuentan."
lightning_the_land_of_faith_objective_decision:0 "Iluminando la tierra de la fe"
lightning_the_land_of_faith_objective_decision_desc:1 " Sekhem fluyendo a través del mundo y concentrado dentro de la Red de Fe. Y la tierra de Fe son todas las tierras dentro de los límites de la Red de Fe. Es hora de reconquistar esas tierras del sirviente de la oscuridad."
lightning_the_land_of_faith_objective_decision_tooltip:1 "Acabarás con la raíz del mal."
lightning_the_land_of_faith_objective_decision_confirm:1 "Luz sobre la oscuridad"
wandering_good_man_objective_decision:0 "Buen hombre errante"
wandering_good_man_objective_decision_desc:1 "Después de todo, los ismaelitas siguen siendo Shemsu-Heru , la única diferencia entre ellos es su lealtad. Los ismaelitas ven a Horus como un tirano mezquino cuya estrechez de miras lo ciega a los males mayores del mundo. Tú demostrarás el camino Horus había elegido es ineficaz".
wandering_good_man_objective_decision_tooltip:1 " Tu amable nombre ha sido conocido por la historia"
wandering_good_man_objective_decision_confirm:1 "La amabilidad es la clave"
wandering_good_man_objective_decision_custom:1 "Has detenido 7 desastres naturales: ([ CHARACTER.MakeScope.GetVariable (' stopped_natural_hazard_count ').GetValue|0]/7)"
pure_evil_objective_decision:0 "Maldad pura"
pure_evil_objective_decision_desc:1 "Las momias de Bane se oponen a Ma'at en un nivel instintivo y mantienen el espíritu retorcido de que el mundo ya está roto y la única forma de repararlo es dejar que Apofis devore el resto. Los sirvientes de la Serpiente están llenos de su esencia y obligado a cumplir su voluntad".
pure_evil_objective_decision_tooltip:1 "Tienes que demostrar a todos que eres pura maldad."
pure_evil_objective_decision_confirm:1 "La maldad es la clave"
pure_evil_objective_decision_customa:1 "Has tenido 7 desastres naturales graves : ([ CHARACTER.MakeScope.GetVariable ('aggravated_natural_hazard_count').GetValue|0]/7)"
pure_evil_objective_decision_customb:1 "Has matado a 100 personas: ([ CHARACTER.MakeScope.GetVariable ('pod_killed_person_count').GetValue|0]/100)"
pure_evil_objective_decision_customc:1 "Has matado a un alma gemela."


