advance_dharma_desc:0 "Los Wan Kuei avanzan en su Dharma logrando momentos de iluminación, llamados dah. Estos momentos llegan rara vez y pueden desencadenarse por una gran comprensión del propio Dharma u, ocasionalmente, por una gran desviación de él. Cada paso del camino es progresivamente más difícil, con el tiempo entre los momentos de iluminación tomando años, luego siglos, los milenios en los niveles más altos. Los Wan Kuei más iluminados pasan gran parte de su tiempo en contemplación, persiguiendo esos momentos de claridad".
