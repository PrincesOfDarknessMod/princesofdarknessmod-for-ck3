restore_celestial_army_objective_decision:0 "Restaurar ejército celestial"
restore_celestial_army_objective_decision_desc:1 "Hace cien años, muchos shih eligieron seguir un camino más grandioso: llamándose a sí mismos el 'Ejército Celestial', estos cazadores de demonios intentaron destruir el shen dondequiera que habitaran, incluso cuando no era necesario que actuaran. Muchos shih denunció a este Ejército Celestial, porque estaban horrorizados por la violación de uno de los principales comandos de Yi. Eventualmente, el Shih se enorgulleció y desterró a todos los cazadores de demonios que no pertenecían al Ejército Celestial. Fue entonces cuando su cuartel general fue destruido durante un terremoto, dejando atrás sólo a los vagabundos".
restore_celestial_army_objective_decision_tooltip:1 "La mayor escuela del Ejército Celestial se construyó en el Kun lunes Montañas , recupéralas y luego decide qué camino quieres seguir"
