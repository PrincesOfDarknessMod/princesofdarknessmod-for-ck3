 greek_fire_objective_decision:0 "Recuperar el fuego griego"
 greek_fire_objective_decision_desc:0 "En nuestros numerosos encuentros con siervos de Satanás de los que beben sangre, el fuego ha demostrado ser su mayor debilidad. No hace mucho que los romanos dominaban los mares con su aterradora arma de fuego, pero su secreto se ha perdido. Es hora de recuperarlo y rediseñarlo para nuestros propósitos".
 greek_fire_objective_decision_tooltip:0 "Utiliza el fuego griego contra tus enemigos".
 greek_fire_objective_decision_effect_tooltip:0 "Ganarás una habilidad para equipar a tus compañeros cazadores con armamento basado en el fuego."
 greek_fire_objective_decision_custom1:0 "Buscar la fórmula en la ciudad requiere 12 de Intriga y controlar Constantinopla."
 greek_fire_objective_decision_custom2:0 "Recuperar el secreto de una "persona" requiere que tú o tu cortesano tengáis el rasgo Torturador y capturar a uno de los desalmados que se rumorea que lo conocen: Belisario, Symeon, Alejo, Dracón, Guardián de la Fe".
 greek_fire_objective_decision_custom3:0 "Descubrir la fórmula por ti mismo requiere Aprendizaje de 20 y que tu cultura descubra la innovación del Pensamiento Renacentista."
 greek_fire_objective_decision_confirm:0 "¡Que se haga la luz!"
 ghoulbro_objective_decision:0 "Marcha sobre la ciudad"
 ghoulbro_objective_decision_desc:0 "Constantinopla es donde Basilio y Bayezid empezaron a predicar. Entonces predicaban las mentiras de sus amos, pero con su caída y la de la Ciudad, los hermanos abrieron los ojos a una nueva verdad. Una verdad que debe ser plasmada en el más virulento de los evangelios y llevada por fieles predicadores a tantas almas como sea posible. Y en ningún lugar hay más almas que donde todo empezó, la Gran Ciudad de Constantinopla".
 ghoulbro_objective_decision_tooltip:0 "Vuelve de tu exilio y reúne el rebaño".
 ghoulbro_objective_decision_effect_tooltip:0 "Despertarás a las miserables masas para que sigan tu causa".
