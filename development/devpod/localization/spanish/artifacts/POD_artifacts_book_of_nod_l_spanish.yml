 artifact_book_of_nod_name:0 "Libro de asentimiento"
 artifact_book_of_nod_description:0 "Una colección de textos antiguos, considerados sagrados por los cainitas noddistas. Consiste en múltiples recensiones y fragmentos que han sido reensamblados por varios eruditos Kindred. Tradicionalmente, la transmisión principal de la historia de Caine es oral, mientras que los textos con los acontecimientos más importantes de la historia cainita están fuertemente custodiados para proteger a los cainitas. Hay que mencionar que, dejando a un lado las propias creencias personales, los textos y las notas que se han transmitido a lo largo de los años deben tratarse con gran precaución. Existen numerosos interrogantes abiertos sobre la historia del Libro de Nod. Se desconoce su autor, aunque a menudo se cita a Malkav, Saulot e incluso a Caine como autores de partes de él, si no de todo. Sin embargo, es posible que haya tenido muchos autores y editores a lo largo de los miles de años transcurridos desde la época de los acontecimientos que describe, lo que hace dudar mucho de su veracidad. Algunos consideran que todo el libro es un mito o una mentira, una historia inventada por los vampiros para explicar su existencia o una herramienta utilizada para engañar a los demás para que piensen y actúen de una determinada manera. A estas dudas se suma el hecho de que muchos de los escritos atribuidos al Libro de Nod son increíblemente vagos o contradictorios, y a veces parecen ser auténticos engaños, lo que crea algunos grandes (y a menudo violentos) cismas de interpretación entre los grupos noddistas. El fragmento más antiguo del Libro está fechado justo antes de la época de Sumer, alrededor del 4500 a.C.

 artifact_chronicle_of_caine_name:0 "Chronicle of Caine"
 artifact_chronicle_of_caine_description:0 "Crónica del "Libro de Nod". Este tomo comprende los siguientes fragmentos: El primero de los tiempos, La llegada de Lilith, La magia de Lilith, La tentación de Caine, El cuento de Zillah, El cuento de la arpía y El cuento de la primera ciudad. Aunque se identifica a Caine con el "Caín" mencionado en el Libro del Génesis, estos Cuentos no deben compararse con el canon bíblico estándar. En sus propias palabras, Caine relata cuáles fueron los motivos que le llevaron a la maldición, dando sus puntos de vista personales sobre los acontecimientos que rodearon los días posteriores a la Caída del Hombre, y su historia de ser el Padre Oscuro."
