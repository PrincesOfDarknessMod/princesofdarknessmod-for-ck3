 artifact_chronicle_of_shadows_name:0 "crónica de sombras"
 artifact_chronicle_of_shadows_description:0 "Crónica del "Libro de Nod". Una colección de trozos y fragmentos que se discute si forman parte del Libro de Nod. Hay analistas que afirman que esta sección había sido diluida por los eruditos y escritores de Cartago, que se tomaron licencias poéticas para escribir las 'Leyes de Caine'. Incluso se ha dicho que la Crónica de las Sombras no es más que una colección de propaganda creada por la Camarilla para apoyar su tiránico reinado. Mientras que algunos creen que se trata de una elaborada broma de los Malkavian, otros creen que estos textos proceden directamente del propio Padre Oscuro, especialmente los trece mandamientos que se entregaron en tablillas auténticamente envejecidas."
 artifact_chronicle_of_secrets_name:0 "crónica de los secretos"
 artifact_chronicle_of_secrets_description:0 "Una crónica de 'El Libro de Nod'. Contiene profecías y visiones de un evento llamado Gehenna. A algunos les parece que las preocupaciones de este evento se han transmitido de generación en generación y han provocado una oleada de paranoia y miedo que continúa repercutiendo entre los Cainitas y los Canaille."
 artifact_first_of_times_name:0 "primero de los tiempos"
 artifact_first_of_times_description:0 "Caine explica que sacrificó a su hermano, Abel, por amor. Su 'Padre' expulsó a Caine para que vagara en la oscuridad en la Tierra de Nod. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_coming_of_lilith_name:0 "Venida de Lilith"
 artifact_coming_of_lilith_description:0 "Caine explica que sacrificó a su hermano, Abel, por amor. Su 'Padre' expulsó a Caine para que vagara en la oscuridad en la Tierra de Nod. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_liliths_magick_name:0 "La magia de Lilith"
 artifact_liliths_magick_description:0 "Caín desea tener los dones de poder que tiene Lilith. Después de cierta persistencia, Lilith, vacilante, comienza la ceremonia del Despertar cortándose con un cuchillo y sangrando en un recipiente para que él beba. Caín participa. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_temptation_of_caine_name:0 "Tentación de Caín"
 artifact_temptation_of_caine_description:0 "Caín es visitado por tres ángeles que son agentes de Dios. Cada ángel le ofrece a Caín la oportunidad de arrepentirse por el asesinato de Abel. Al rechazar al Arcángel Miguel, Caín y sus hijos son maldecidos con una debilidad al fuego. Al rechazar a Raphael, Caine y sus hijos están malditos con la vulnerabilidad a la luz del sol. Al rechazar a Uriel, Caín y sus hijos son maldecidos con la Bestia dentro por sed de sangre. Aparece entonces un cuarto ángel, el que es Gabriel. Este ángel ofrece Golconda, el único camino a la 'luz' por la misericordia de Dios. Caine está 'Despertado' y se desarrolla con las disciplinas. Con todos estos poderes, deja a Lilith. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_zillahs_tale_name:0 "El cuento de Zillah"
 artifact_zillahs_tale_description:0 "Caine se enamora de Zillah y busca casarse con ella. Él hace todo lo que se le ocurre para que ella lo desee, pero ella no lo quiere. Caine se frustra tanto que se tira del pelo. Finalmente busca la magia de Crone, quien finalmente lo engaña para establecer un vínculo de sangre. Este descubrimiento del vínculo de sangre es lo que finalmente une a Zillah con Caine para que él pueda conseguir que se case con él. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_tale_of_the_crone_name:0 "Cuento de la vieja"
 artifact_tale_of_the_crone_description:0 "El lazo de sangre que tiene a Caine unido a la Anciana, lo tiene a él en su servidumbre. Después de un año de obediencia y de evitar su sangre, le preguntó a la Bruja cómo ser más poderoso que sus chiquillos, por temor a que pudieran tomar el control. Esta investigación era realmente parte de un plan para usar esta información en su contra. Ella le proporciona un arma de madera de tuza viva y le explica cómo usarla. Después de aceptar el arma, Caine la apuñala en el corazón, rompiendo el vínculo de sangre. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_tale_of_the_first_city_name:0 "Cuento de la primera ciudad"
 artifact_tale_of_the_first_city_description:0 "Caine expresa estar en soledad durante un eón. Busca estar de nuevo con los mortales y encuentra una ciudad habitada por los "Hijos de Seth". Le aceptan como rey y gobierna durante algún tiempo, sintiéndose de nuevo solo en su poder. Un joven llamado Enoch pide ser el hijo de Caine. A pesar de la advertencia de Uriel sobre tener hijos, Caine abraza a Enoch, su primer hijo. Caine proclama entonces que esta Primera Ciudad sea conocida como la Ciudad de Enoch. Su nuevo hijo, Enoch, le suplica que le dedique unos hermanos. Caine acepta y hace que Irad y Zillah se abracen. Ellos, a su vez, crean más progenie. Por miedo a propagar su maldición, Caine ordena que no se hagan más hijos. Ellos obedecen y la ciudad prospera durante años, convirtiéndose en un gran Imperio. Entonces llegó el Diluvio y destruyó la Ciudad de Enoch y a todos los "Hijos de Seth". Caine estaba tan molesto, que desapareció. Sus hijos y nietos supervivientes le buscaron, y cuando le encontraron, Caine les dijo que se fueran. Abandonados a su suerte, se desató una gran guerra en la que trece antediluvianos "mataron" a sus ancianos: Enoch, Irad y Zillah. Cuando Caine descubrió lo ocurrido, buscó a los antediluvianos. Habían reconstruido una nueva ciudad conocida como la Segunda Ciudad y habían producido otra generación de vampiros. Sin que los Antediluvianos lo supieran, el Padre Oscuro Caine maldijo a sus descendientes con las debilidades características de cada clan. Finalmente, la ciudad está en constante estado de guerra, muere y los Kindred se dispersan. El relato concluye con la profecía de una última ciudad, la Ciudad de la Gehena. Forma parte de la "Crónica de Caine" en el "Libro de Nod"."
