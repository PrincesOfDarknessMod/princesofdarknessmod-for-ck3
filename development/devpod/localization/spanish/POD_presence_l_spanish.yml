l_spanish:
 POD_perfect_world.001.t:0 "Un mundo perfecto"
POD_perfect_world.001.desc:0 "Eres un ser de considerable poder y tu dominio de la Presencia es monumental. Miras a tu dominio y ves a todos esos kines que se dejan la vida, sin preocuparse por el panorama general. Pero tienes el poder de cambiar eso, de hacer que vivan de la manera que tú consideras adecuada, un poder para hacer de tu dominio un mundo perfecto... para ti.\N¿Pero cuál es tu mundo perfecto?"
POD_perfect_world.001.a:0 "Los inspiraré para que sean grandes, gobernar sobre las élites es mejor"
POD_perfect_world.001.a.tt:0 "Obtienes un poderoso modificador que se aplica a tu capital, el modificador aumenta el desarrollo"
POD_perfect_world.001.a.tt.beast:0 "#R Ah, ¿por qué querríamos gobernar a los campesinos?"
POD_perfect_world.001.b:0 "Este mundo es cruel, deberían construir sus fuerzas para ayudar a mis planes".
POD_perfect_world.001.b.tt:0 "Obtienes un poderoso modificador que se aplica a tu capital, el modificador aumenta tu poder militar."
POD_perfect_world.001.b.tt.beast:0 "#R La guerra se acerca"
POD_perfect_world.001.c:0 "Ahora no es el momento"
POD_perfect_world.001.c.tt:0 "Abandonarás tus intentos de hacer que los mortales actúen como deseas"
POD_perfect_world.001.c.tt.beast:0 "#R ¡No! Los controlaremos!"

POD_perfect_world.002.t:0 "Un mundo perfecto"
POD_perfect_world.002.desc:0 "Tuviste que gastar mucho poder y algunos kine notaron que pasaba algo raro, ¡pero el relevo fue fenomenal! Ya ves cómo actúan los mortales en tu visión, y estás listo para cosechar los beneficios"
POD_perfect_world.002.option.a:0 "Ah, qué perfección"
POD_perfect_world.002.option.a.tt:0 "Has conseguido influir en los mortales de la ciudad"

POD_mask_of_empathy.001.t:0 "Máscara de empatía"
POD_mask_of_empathy.001.desc:0 "Todo está en movimiento, usando tus inmensos poderes de Presencia, ahora eres capaz de hacer un movimiento. Expandes tu voluntad y tu encanto antinatural y ya puedes sentir que tu objetivo está cerca, muy cerca. ¿Procederás?"
POD_mask_of_empathy.001.option.a:0 "Es hora de romper sus lazos"
POD_mask_of_empathy.001.option.a.tt:0 "Intentarás usar el poder de Máscara de Empatía"
POD_mask_of_empathy.001.option.a.desc:0 "Batalla de voluntades"
POD_mask_of_empathy.001.option.a.success:0 "Éxito"
POD_mask_of_empathy.001.option.a.tt.attacker_wins:0 "[target.GetFirstName] y [target_relation.GetFirstName] ya no están conectados"
POD_mask_of_empathy.001.option.a.failure:0 "Fallo"
POD_mask_of_empathy.001.option.a.tt.defender_wins:0 "Has fallado y tu voluntad se tambalea"
POD_mask_of_empathy.001.option.b:0 "No es el momento"
POD_mask_of_empathy.001.option.b.tt:0 "Abandonarás tus intentos de impedir que [target.GetFirstName] y [target_relation.GetFirstName] estén conectados"

POD_mask_of_empathy.002.t:0 "Máscara de empatía"
POD_mask_of_empathy.002.desc:0 "Has tenido éxito, ya puedes sentir que [target.GetFirstName] y [target_relation.GetFirstName] no sienten lo mismo el uno por el otro"
POD_mask_of_empathy.002.option.a:0 "Ah, claro que no han podido resistirse a mis encantos"
POD_mask_of_empathy.002.option.a.tt:0 "Has triunfado"
POD_mask_of_empathy.002.option.a.tt.beast:0 "#R ¡Los controlamos!"

POD_mask_of_empathy.002.t:0 "Máscara de empatía"
POD_mask_of_empathy.002.desc:0 "Has tenido éxito, ya puedes sentir que [target.GetFirstName] y [target_relation.GetFirstName] no sienten lo mismo el uno por el otro"
POD_mask_of_empathy.002.option.a:0 "Ah, claro que no han podido resistirse a mis encantos"
POD_mask_of_empathy.002.option.a.tt:0 "Has triunfado"
POD_mask_of_empathy.002.option.a.tt.beast:0 "#R ¡Los controlamos!"

POD_mask_of_empathy.003.t:0 "Máscara de empatía"
POD_mask_of_empathy.003.desc:0 "Has fallado, [target.GetFirstName] y [target_relation.GetFirstName] siguen conectados entre sí. Apenas has conseguido que no te atrapen, eso es un plus"
POD_mask_of_empathy.003.option.a:0 "Qué pena"
POD_mask_of_empathy.003.option.a.tt:0 "Has fallado"
POD_mask_of_empathy.003.option.a.tt:0 "#R Qué decepción"
 POD_mask_of_empathy.003.option.a.tt.beast:0 "#R Qué decepción"
