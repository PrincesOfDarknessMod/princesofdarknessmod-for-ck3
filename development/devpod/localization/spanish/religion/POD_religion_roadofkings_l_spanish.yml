 holy_order_viziers_contigency:0 "La contingencia de los visires"
 holy_order_scions_of_mithras:0 "Vástagos de Mitra"
 holy_order_lions_of_mithras:0 "Leones de Mitra"
 holy_order_miles_of_mithras:0 "Millas de Mithras"
cleopatrans:0 "Cleopatrans de Yima"
 cleopatrans_adj:0 "Cleopatran"
 cleopatrans_adherent_plural:0 "Cleopatra"
 cleopatrans_adherent:0 "Cleopatran"
 cleopatrans_adherente_plural:0 "Cleopatrans"
 path_of_carnal_desire:0 "Camino del deseo carnal"
 path_of_carnal_desire_adj:0 "Deseo"
 cleopatrans_desc:0 "Este culto es una fusión entre el cuento de Yima, este mítico Nosferatu aparentemente no afectado por su maldición [Clan|E], y Cleopatra, la bella faraona egipcia. Esta fascinación hizo poderoso al [Clan|E], y muchos príncipes fueron Cleopatras hasta la caída del Imperio Romano. El culto está como muerto desde entonces".
 path_of_carnal_desire_adherent_plural:0 "Deseado"
 
 camino_del_deseo_carnal:0 "Camino del deseo carnal"
 camino_del_deseo_carnal_adj:0 "Deseo"
 holy_order_studs_of_desire:0 "señuelo del deseo"
 path_of_carnal_desire_adherent:0 "Deseo"
 camino_del_deseo_carnal_adherente_plural:0 "Deseado"
 path_of_carnal_desire_desc:0 "Esta religión no canónica ha sido encargada por un Patrón.También conocida como Via Carnalium Desideriorum, esta senda no trata de entregarse al placer, sino del uso de la lujuria como herramienta de control. Aunque es tan erótica como la Via Voluptarius, se trata menos del instinto y más de la dominación a través del deseo sexual. Son las sirenas las que cantan en las rocas, no los marineros condenados que las buscan. A diferencia de los seguidores de la Vía del Pecado, los Deseados se ajustan a las normas de la Vía de los Reyes y a sus tradiciones, por lo que encuentran socorro en las cortes de los Altos Clanes.\NSe sabe que los Deseados tienen una rivalidad religiosa con los Voluptuarios que se desarrolla en dormitorios ahd burdeles de toda Italia." 
 holy_order_order_of_whores:0 "Orden de Babilonia"
 holy_order_order_of_dominatrices:0 "Orden del Deseo"
 holy_order_tuds_of_desire:0 "Orden del deseo"
 
 viaofficii:0 "Via Officii"
 viaofficii_adj:0 "Deber"
 viaofficii_adherent:0 "Juramento"
 viaofficii_adherent_plural:0 "Jurado"
 viaofficii_desc:0 "Esta religión no canónica ha sido encargada por un Patrón.\NTambién conocido como el Camino del Deber, este camino fue desarrollado por Senen Forsworn--el Vigilante Blanco--para hacer cumplir estrictamente el Silencio de la Sangre. Toman acciones extremas para mantener la integridad de la Mascarada".
 building_type_cecilia_palace_01:0 "Palacio de Cecilia"
 building_type_cecilia_palace_01_desc:0 ""
 building_cecilia_palace_01:0 ""
 building_cecilia_palace_01_desc:0 ""
 tenet_carnal_desire_name:0 "Deseo carnal"
 tenet_carnal_desire_desc:0 "Un tenet no canónico solicitado por un patrón."
  
 shatteredspear:0 "Lanza destrozada"
 shatteredspear_adj:0 "Destrozado"
 shatteredspear_adherent:0 "Espartano"
 shatteredspear_adherent_plural:0 "Espartanos"
 shatteredspear_desc:0 "Aquellos que llevan el legado de Artemisa Orthia, la primera y más querida de los hijos de Ventrue y diosa de la antigua Esparta, que lideró la vanguardia contra los Brujah de Cartago y cayó luchando contra la oscuridad que se apoderó de esa ciudad en sus viles garras.\NLa Lanza opera en secreto, cada guerrero se mantiene firme contra la marea de la Gehenna y las fuerzas diabólicas que acechan fuera de la civilizada sociedad cainita."
 

