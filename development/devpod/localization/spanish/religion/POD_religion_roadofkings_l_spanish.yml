 #Scion-Group Faiths
 viaregalis:0 "Vía Regalis"
 viaregalis_adj:0 "Regalis"
 viaregalis_adherent:0 "Luminarias"
 viaregalis_adherent_plural:0 "Luminarias"
 viaregalis_desc:0 "Los seguidores de Via Regalis controlan su Bestia gobernando a los demás. Los mortales son inferiores, las promesas se cumplirán, el poder lo es todo".

 viaequitum:0 "Via Equitum"
 viaequitum_adj:0 "Equitum"
 viaequitum_adherent:0 "Paladín"
 viaequitum_adherent_plural:0 "Paladines"
 viaequitum_desc:0 "Los que siguen la Senda de la Caballería creen que, como seres superiores, están obligados a defender a los inferiores a ellos, tanto cainitas como humanos. Estos Vástagos creen firmemente en los conceptos del deber y el honor".

 viamercator:0 "Vía Mercator"
 viamercator_adj:0 "Mercator"
 viamercator_adherent:0 "Mercator"
 viamercator_adherent_plural:0 "Mercaderes"
 viamercator_desc:0 "Para estos Vástagos que siguen la Senda del Mercader, el poder y el dinero van de la mano; por lo tanto, dedican gran parte de su tiempo a adquirir riquezas y a utilizarlas para afectar sutilmente a las cosas entre bastidores. Sin embargo, también valoran su propia reputación, y harán todo lo posible para asegurarse de que sea positiva."

 viatyrannus:0 "Vía Tyrannus"
 viatyrannus_adj:0 "Tyrannus"
 viatyrannus_adherent:0 "Tirano"
 viatyrannus_adherent_plural:0 "Tiranos"
 viatyrannus_desc:0 "Aunque muchos tienen fama de fieros, controladores y ávidos de poder, los Vástagos de la Senda del Tirano también se encuentran entre los más honrados de la Vía Regalis. Si uno de ellos tiene una obligación contigo la cumplirá, sin importar el coste. Sin embargo, son los más propensos a gobernar a través del miedo en lugar de la apelación".

 viaconsuasor:0 "Via Consuasor"
 viaconsuasor_adj:0 "Consuasor"
 viaconsuasor_adherent:0 "Visir"
 viaconsuasor_adherent_plural:0 "Visires"
 viaconsuasor_desc:0 "Los Vástagos de esta Senda del Visir se contentan con aconsejar más que con gobernar directamente, pero eso no los hace menos adeptos a ejercer el poder que los demás del Camino de los Reyes. De hecho, estos Vástagos se encuentran entre los mejores a la hora de realizar manipulaciones sutiles y de darse cuenta de los detalles que podrían amenazar la influencia de los que mandan."
 
 viamithras:0 "Vía Mitra"
 viamithras_adj:0 "Mitraísmo"
 viamithras_adherent:0 "Mitraísta"
 viamithras_adherent_plural:0 "Mitristas"
 viamithras_desc:0 "Los mitraístas están a caballo entre la Vía Regalis y un culto real. Aunque el poder y el honor se mantienen en alta estima, la devoción a un dios real, Mitra, es primordial. Todavía se mantienen fieles a una organización que data de los días de gloria del culto, en la Antigua Roma".

 viaentelechia:0 "Vía Entelechia"
 viaentelechia_adj:0 "Entelechia"
 viaentelechia_adherent:0 "Dedicado"
 viaentelechia_adherent_plural:0 "Dedicado"
 viaentelechia_desc:0 "Los Dedicados se definen por las tres bases de la Entelechia: Andreia, virilidad; enkratia, fuerza interior; y sophrosyne, control interior. Las restricciones humanas como la piedad o la simpatía (o la consideración) están por debajo de ellos. Cuando un Dedicado se encuentra con un grupo de sus compañeros de clan, asume el liderazgo sobre ellos, señalando la evidente inferioridad de sus contrarios y no rehuyendo matar a los vampiros que desobedezcan sus órdenes."		
 
 codexoflegacies:0 "Códice de Legados"
 codexoflegacies_adj:0 "Códice de Legados"
 codexoflegacies_adherent:0 "Soñador"
 codexoflegacies_adherent_plural:0 "Soñadores"
 codexoflegacies_desc:0 "Los cainitas de Constantinopla no se adhirieron a las seis Tradiciones de Caine. En su lugar, el Brujah Tribonius creó el Códice de Legados, una colección de preceptos que pretendía cimentar el gobierno de la Trinidad y los tres clanes gobernantes: los Toreador, los Tzimisce y los Ventrue. Un consejo de tres Quaesitors -uno de cada uno de esos tres clanes- supervisaba el códice y juzgaba a los que rompían sus preceptos".
 
