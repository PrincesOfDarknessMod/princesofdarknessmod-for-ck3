 POD_mummy_command_effigy.100.t:0 "你的俑像已回归"
 POD_mummy_command_effigy.100.desc:0 "你的俑像已经完成任务归来，带着满满一箱的金钱回来了。"
 POD_mummy_command_effigy.100.option.a:0 "轻松获利。"
 POD_mummy_command_effigy.200.t:0 "你的俑像已回归"
 POD_mummy_command_effigy.200.desc:0 "你的俑像已经完成任务归来，其等将你的名字传得很远很广。"
 POD_mummy_command_effigy.200.option.a:0 "世界将知道我是谁。"
 POD_mummy_command_effigy.300.t:0 "你的俑像已回归"
 POD_mummy_command_effigy.300.desc:0 "你的俑像已经完成任务归来，为你的功业提供了他们的力量。"
 POD_mummy_command_effigy.300.option.a:0 "他们是我的得力助手。"
 POD_mummy_command_effigy.400.t:0 "你的俑像已回归"
 POD_mummy_command_effigy.400.desc:0 "你的俑像已经完成任务归来，已经帮助你的家庭变得更加强大。"
 POD_mummy_command_effigy.400.option.a:0 "我的血统随着每一代人的成长而变得更加强大。"