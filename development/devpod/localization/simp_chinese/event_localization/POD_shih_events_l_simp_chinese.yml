l_simp_chinese:
 podshih.1010.t:0 "天军与裁判所"
 podshih.1010.desc:0 "在天军重建百年之后，对鬼神展开全面战争的机会出现了。\n在西方，天主教会的暗影裁判所已经开始清洗他们自己的土地，使你也能够加大战争强度。是时候结束这一切了。"
 podshih.1010.a:0 "我将参与。"
 podshih.1010.a.tt:0 "我将能使用[empire|E][GetPlayer.GetFaith.Custom('GHWName')][casus_belli|E]。"
 podshih.100.t:0 "免战牌"
 podshih.100.desc:0 "[shih.GetFirstName]想要跟你签署和平条约。[GetTrait('shih').GetName( GetPlayer )]时常这么做，因为他们需要时间来平复因敌意和暴力引发的心魔。"
 podshih.100.a:0 "我同意。"
 podshih.100.b:0 "我不接受。"