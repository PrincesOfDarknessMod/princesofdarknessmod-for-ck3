l_simp_chinese:
 POD_blood_tithe_kine.100.t:0 "血贡到达"
 POD_blood_tithe_kine.100.desc:0 "[recipient.GetTitledFirstName]已经发送了所要求的血贡。该贡品被称为“[kine_tithe.GetFirstName]”。据说[kine_tithe.GetHerHis|U]的血液含有"
 POD_blood_tithe_kine.100.desc.negligible:0 "微弱"
 POD_blood_tithe_kine.100.desc.fleeting:0 "平淡"
 POD_blood_tithe_kine.100.desc.intense:0 "强烈"
 POD_blood_tithe_kine.100.desc.acute:0 "极锐"
 POD_blood_tithe_kine.100.desc.choleric:0 "胆汁质"
 POD_blood_tithe_kine.100.desc.melancholic:0 "抑郁质"
 POD_blood_tithe_kine.100.desc.phlegmatic:0 "黏液质"
 POD_blood_tithe_kine.100.desc.sanguine:0 "多血质"
 POD_blood_tithe_kine.100.desc.finish:0 "共鸣。"
 POD_blood_tithe_kine.100.option.a:0 "我将让其加入我的牧群。"
 POD_blood_tithe_kine.100.option.b:0 "将其丢入我的地牢。"
 POD_blood_tithe_kine.100.option.b.tt:0 "[kine_tithe.GetFirstName]将被监禁。"
 POD_blood_tithe_kine.100.option.b.imprison:0 "血畜血贡被丢在了地牢。"
 POD_blood_tithe_kine.100.option.c:0 "欢迎来到我的宫廷，[kine_tithe.GetFirstName]。"
 POD_blood_tithe_kine.100.option.d:0 "我现在就享用。"
 POD_blood_tithe_kine.100.option.e:0 "这血皿无法令人接受，重新给我带一只。"
 POD_blood_tithe_kine.100.option.f:0 "滚出我的视线。"