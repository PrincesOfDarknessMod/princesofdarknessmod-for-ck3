l_simp_chinese:
 POD_vampire_blood_surge.100.t:0 "血涌！"
 POD_vampire_blood_surge.100.desc:0 "血液能超自然地增强你的才能，但它有可能会唤醒你的饥渴。"
 POD_vampire_blood_surge.100.option.a:0 "来战！"
 POD_vampire_blood_surge.100.option.a.tt.beast:0 "#BLOODRED 杀戮时间到！#!"
 POD_vampire_blood_surge.100.option.h:0 "我想变得更强壮！"
 POD_vampire_blood_surge.100.option.h.tt.beast:0 "#BLOODRED 我们是永生的！#!"
 POD_vampire_blood_surge.100.option.b:0 "变得更擅长战术"
 POD_vampire_blood_surge.100.option.b.tt.beast:0 "#BLOODRED 战争。战争从未改变。战争中总是会有很多人流血。#!"
 POD_vampire_blood_surge.100.option.c:0 "让我变得更有魅力"
 POD_vampire_blood_surge.100.option.c.tt.beast:0 "#BLOODRED 欢迎来到我的会客厅。#!"
 POD_vampire_blood_surge.100.option.d:0 "帮我提升计算能力"
 POD_vampire_blood_surge.100.option.d.tt.beast:0 "#BLOODRED 我们需要更多的牧群。我们总需要更多的血。我能帮你得到。让我来帮你吧。#!"
 POD_vampire_blood_surge.100.option.e:0 "杀人于无声"
 POD_vampire_blood_surge.100.option.e.tt.beast:0 "#BLOODRED 掠食开始！#!"
 POD_vampire_blood_surge.100.option.f:0 "适当的精血使用可以成倍地提高智商。"
 POD_vampire_blood_surge.100.option.f.tt.beast:0 "#BLOODRED 不容置疑。让我们尽快尽早的补满我们的精血。#!"
 POD_vampire_blood_surge.100.option.g:0 "我暂时不会冒着增加饥渴的风险。"
 POD_vampire_blood_surge.100.option.g.tt.beast:0 "#BLOODRED 你会的，而且很快就会。我等着。#!"