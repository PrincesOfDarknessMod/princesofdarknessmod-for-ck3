 tariqelumma: "塔里克·乌玛"
 tariqelumma_adj: "乌玛之道"
 tariqelumma_adherent: "阿什拉派"
 tariqelumma_adherent_plural: "阿什拉派"
 tariqelumma_desc: "伊斯兰血族的人性之路。它与其的西方双生子差别不大，并且双方经常交流或分析经验。"
 tariqelsama: "塔里克·萨玛"
 tariqelsama_adj: "萨玛之道"
 tariqelsama_adherent: "萨玛"
 tariqelsama_adherent_plural: "萨玛"
 tariqelsama_desc: "在凡人时是穆斯林的$pod_cainites$可能会坚持这条心路，因为他们认为真主的世界计划包括了吸血鬼，而对祂的意志保持顺从也许能帮助他们控制心兽。"
 tariqelharb: "塔里克·哈尔卜"
 tariqelharb_adj: "哈尔卜之道"
 tariqelharb_adherent: "哈尔卜"
 tariqelharb_adherent_plural: "哈尔卜"
 tariqelharb_desc: "伊斯兰血族的王者之路。由于在穆斯林世界少有梵卓，这条心路不如西方的征服之道流行。然而，许多苏丹和埃米尔仍然享受着它所带来的权力的提升。"
 tariqelbedouin: "塔里克·贝都因"
 tariqelbedouin_adj: "贝都因之道"
 tariqelbedouin_adherent: "贝都因"
 tariqelbedouin_adherent_plural: "贝都因"
 tariqelbedouin_desc: "伊斯兰血族的兽性之路。其由宰亚特——塔里克·贝都因的始祖和[ashirra|E]哈里发的密友——创立，这使他们更注重文明生活。相对于其的西方双生子。"
 tariqealaam: "塔里克·阿拉姆"
 tariqealaam_adj: "舒哈达之道"
 tariqealaam_adherent: "舒哈达"
 tariqealaam_adherent_plural: "舒哈达"
 tariqealaam_desc: "[ashirra|E]的舒哈达，这些殉道者把自己作为不会死的牺牲品，这样其他人就不必再受苦了。他们会心甘情愿地牺牲自己来阻止被认为是不神圣的东西造成的腐化，尤其是恶魔或其他$pod_cainites$。"
 sheperdsofislam: "伊斯兰牧人"
 sheperdsofislam_adj: "伊斯兰牧人"
 sheperdsofislam_adherent: "见证人"
 sheperdsofislam_adherent_plural: "见证人"
 sheperdsofislam_desc: "牧人是[ashirra|E]运动中一个小规模但非常活跃的部分，他们的任务是保护[cainite|E]世界的关键人物。这些人物中的许多人甚至不知道他们的神秘保护者。他们经常与埃及的赛特之子发生冲突，后者阻碍了他们在其本土地区的努力。"
 ashirra_religious_head_title_name: "伊玛目"
 ashirra_death_deity_name_possessive: "火狱"
 tariqallail: "塔里克·莱尔"
 tariqallail_adj: "莱尔之友"
 tariqallail_adherent: "受启示者"
 tariqallail_adherent_plural: "受启示者"
 tariqallail_desc: "在伊斯兰血族中的黑夜之友。有着相当罕见的起源，该[Clan|E]中基督教和穆斯林的分裂使这两个群体都遭到排斥。"
 ashirra_divine_realm: "天国"
 ashirra_witchgodname_the_horned_god_possessive: "衰旦的"