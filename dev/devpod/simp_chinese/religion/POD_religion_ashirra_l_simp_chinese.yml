 ashirra_religion_desc: "[ashirra|E]（来自阿拉伯语的“氏族”一词）是信仰真主的伊斯兰吸血鬼教派，从黑暗时代开始就统治着阿拉伯和北非。[ashirra|E]的成员相信，如果他们选择追随真主，就会得到救赎，这是穆罕默德的承诺之一。"
