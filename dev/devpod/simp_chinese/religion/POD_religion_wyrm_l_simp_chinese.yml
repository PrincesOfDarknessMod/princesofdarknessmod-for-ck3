 blackspiraldancer: "黑螺旋舞者"
 blackspiraldancer_adj: "黑螺旋舞者"
 blackspiraldancer_adherent: "黑螺旋舞者"
 blackspiraldancer_adherent_plural: "黑螺旋舞者"
 blackspiraldancer_desc: "可怕的黑螺旋舞者也被称为失落部族，他们是叛向妖蛆的狼族。他们曾经被称为“白嚎”，在该部族试图靠自己打倒妖蛆后，已经被腐化到了底。"
 wyrm: "妖蛆"
 wyrm_adj: "妖蛆"
 wyrm_adherent: "眷族"
 wyrm_adherent_plural: "眷族"
 wyrm_desc: "在狼族的神学中，妖蛆是至高天神之一。妖蛆的目的是净化和纠正尘世，使其更迟一步堕入熵。祂通过消除奇原的创造和织者的结构来实现这一目的。\n随着人类的出现，妖蛆逐渐受到限制，直到祂被逼疯，一心想要毁灭一切。因此，妖蛆现在是毁灭、混沌、黑暗和腐败之灵，是狼族所反对的一切的本质。"
 beastofwar: "战争之兽"
 beastofwar_adj: "战争之兽"
 beastofwar_adherent: "战士"
 beastofwar_adherent_plural: "战士"
 beastofwar_desc: "战争之兽是三相妖蛆的三头之一。它是灾祸之妖蛆，是无端愤怒之怪，神挡杀神佛挡杀佛。无限愤怒助长了它，而毁灭本能则引导它。它的爪牙从自我毁灭的突击队，到以碾压和消灭受害者为乐的彪形蠢汉，不一而足。战争之兽通过人类行事时，可以将健康的竞争退化为残酷的冲突，最终达到不分敌我的嗜血杀戮。"
 eaterofsouls: "噬魂者"
 eaterofsouls_adj: "噬魂者"
 eaterofsouls_adherent: "噬魂者"
 eaterofsouls_adherent_plural: "噬魂者"
 eaterofsouls_desc: "消耗之妖蛆是三相妖蛆的三大示相之一，它试图吞噬所有的造物，以同样的方式享用物质、能量和精神。噬魂者以世界上的污秽为食，并使自己膨胀。噬魂者是对疯狂织者想控制其影响范围内一切的需要的嘲弄：它被无意识地驱使去吞噬所有的造物，不顾一切地试图摧毁固有的破碎宇宙。"
 defiler: "亵渎者"
 defiler_adj: "亵渎者"
 defiler_adherent: "亵渎者"
 defiler_adherent_plural: "亵渎者"
 defiler_desc: "亵渎者是归墟与腐朽的阴暗实体，是存在的所有堕落的冲动和本能的体现。亵渎者通过引诱其猎物屈服于自己的低级本能来征服，引导受玷污者踏入鲁莽的危险。它的受害者走在一条从个人选择到自我毁灭的阴暗道路上。一些影爵断言，亵渎者的第一个受害者即是它自己。他们说它现在被对自己的自我厌恶所驱使，愚蠢地认为如果它玷污了一切，它就会重新获得控制并恢复平衡。"
 foebok: "大怖"
 foebok_adj: "大怖"
 foebok_adherent: "恐惧者"
 foebok_adherent_plural: "恐惧者"
 foebok_desc: "恐惧是人类所知的最强烈和最古老的情感。妖蛆在这方面也没有什么不同：意识到自己被困住了，它惊慌失措，于是就产生了该恶惑。恐惧可以促使任何生物做出最可怕的事情。三相妖蛆的所有方面似乎都在表达恐惧，没有一个恶神真正地在为它服务，因为恐惧存在于一切之中。然而，当黑螺旋舞者希望接近大怖时，他们会召唤哈卡肯——“恐惧之心”。"
 mouthofvorax_adj: "大饕之口"
 mouthofvorax_adherent: "贪婪者"
 mouthofvorax_adherent_plural: "贪婪者"
 mouthofvorax: "大饕之口"
 mahsstrac: "大尊"
 mahsstrac_adj: "大尊"
 mahsstrac_adherent: "傲慢者"
 mahsstrac_adherent_plural: "傲慢者"
 mahsstrac_desc: "大尊是当中最年轻，且可能是进化程度最高的一种，它是在妖蛆意识到意识到自己在囚禁中，只能通过操纵较低级的实体来影响外界的无能情况下化出来的，来影响外面的世界。它在目标身上植入了一种对权威与领导的渴望，使他们追求统治和控制，以达到目的。他们成为了残酷的暴君和独裁者。该特别的恶惑同样不需要恶神侍从，因为它可以独立行事。黑螺旋舞者呼唤其强大而著名的图腾化身——绿龙，“生命的毁灭者和敌人的碾碎者”。\n在拉丁语中，它被称作“傲慢”，是天主教会的一种致命原罪。"
 karnala: "大欲"
 karnala_adj: "大欲"
 karnala_adherent: "色欲者"
 karnala_adherent_plural: "色欲者"
 karnala_desc: "随着巨蛇被织者的网困住，就渴望着释放，渴望着自由，渴望着它最想要的东西。随着这种渴望的增长，大欲也在增长。该渴望的客体已经失去了，因为大欲获得了自由，而织者则被抛在一边腐烂。大欲代表了渴望，对任何事物的渴望：物体、情感、人物或地方。被该恶惑触动的人很难看清自己的满足感。很快，他们就被自己的欲望所吞噬，不仅试图拥有他们想要的东西，还试图成为那个东西，从而进一步加深了无尽的欲望。为该恶惑服务的恶神灵君是阿利亚拉女皇，欲望之女伯爵。"
 abhorra: "大瞋"
 abhorra_adj: "大瞋"
 abhorra_adherent: "妒恨者"
 abhorra_adherent_plural: "妒恨者"
 abhorra_desc: "妖蛆有许多怨恨，随着它的自我滋生，该怨恨很快就获得了足够的能量来挣脱，不仅成为恶毒的情绪根本，而且还使人自我厌恶并转移到他人身上。受到该恶惑的触动，凡人会被一个人或一群人，情况，甚至是提醒他们自己不完美的小事所排斥。他们会变得越来越有攻击性，不惜一切代价向他们所憎恨的人挑起敌对行动。仇恨公爵，钢铁领主，是该恶惑的恶神。\n尽管该恶惑促使了十字军战争，但天主教会将这份怒火视为致命的原罪——他们称之为“愤怒”。"
 angu: "大虐"
 angu_adj: "大虐"
 angu_adherent: "残酷者"
 angu_adherent_plural: "残酷者"
 angu_desc: "大虐比大多数其他妖蛆恶惑要抽象和复杂得多，它比大多数其他的来得晚。它被认为是来自于大瞋。当第一次向潜在的盟友解释它的监禁和痛苦状态时，它发现自己无法充分地表达自己。相反，它希望有一种方法来向他们展示它所经历的和它所感受到的。大虐使这成为可能。在潜意识层面上运作，它驱使它的受害者忽视他们的同情心和对其他生命的痛苦的理解。那些被该恶惑暂居的人学会了如何施加各种形式的虐待：精神的、身体的，甚至是情感的。痛苦之哈里发，艾弗女士，听从大虐的吩咐。"
 baashkai: "大蛮"
 baashkai_adj: "大蛮"
 baashkai_adherent: "暴力者"
 baashkai_adherent_plural: "暴力者"
 baashkai_desc: "基本的、粗糙的、无意识的是描述该恶惑的词语。它是从一种根深蒂固的强迫力中成长起来的，在其达成逃离目标后很长时间内还继续纷争。虽然它可以蒙蔽他人的判断，但想强行让自己进入另一个有意识地拒绝它的人的话，它没啥能做的。然而，通过其他恶惑，他可以轻易地挑拨并使凡人给它一个进入其等灵魂的入口。愤怒之酋长，妖蛆军队的将军，虐待的守护者，地狱使者是大蛮之残暴的发动机。"
 khaaloobh: "大痨"
 khaaloobh_adj: "大痨"
 khaaloobh_adherent: "孢子"
 khaaloobh_adherent_plural: "孢子"
 khaaloobh_desc: "只是隐约受知，只在传闻中真实存在，大痨被指为消费，放纵和腐烂的恶惑。当妖蛆在织网中抽搐得足够厉害时，它就会扭曲自身周围的区域。这标志着它周围的秩序被打破了。虽然它没有被击碎，但这张网肯定不符合秩序。该恶惑甚至影响到了妖蛆的爪牙，并使他们崩溃，无论是在精神、情感，甚至是身体上。当黑螺旋舞者想要触及该恶惑时，他们会求助于黑暗真菌，其恶神则被称为妖蛆衍体，熵之骑士。"
 pseulak: "大奸"
 pseulak_adj: "大奸"
 pseulak_adherent: "欺诈者"
 pseulak_adherent_plural: "欺诈者"
 pseulak_desc: "当妖蛆开始否认发生在它身上的事情，以及它不会很快被释放的时候，该恶惑被激发了出来，完全化为一位自主的生命。虽然欺骗是一种自然的生存策略，但大奸将其提升到一个不同的层次。它鼓励别人撒谎，而且会越说越轻松，要么对自己编织的谎言感到舒服，要么顶着更多的谎言来掩盖谎言。很快他们就会发现自己相信了自己的假话。堕落部族通过“隐藏的大敌”基里伽玛来呼唤该恶惑，它的恶神是腐蚀的维护人，谎言的侍从长，尊贵的缅因·迪布瓦先生。"
 sykora: "大妄"
 sykora_adj: "大妄"
 sykora_adherent: "偏执者"
 sykora_adherent_plural: "偏执者"
 sykora_desc: "当妖蛆第一次感觉到它与其他造物的联系被切断时，偏执之恶惑就形成了，随着世界对它的反对，它自己也产生了个人的不信任。大妄潜伏在心灵的阴影当中，在事物应该是怎么样和它们其实是什么这两种不可调和的感觉之间。在这个空间里，它建立了复杂和非理性的心理结构，与理性思维相悖，导致人们退缩到自己身上，或者对那些不同意他们现实观念的人大打出手。黑螺旋舞者用部族图腾夜鹰与该恶惑接触，它的恶神是疯狂之大主教，多格·克莱普斯。"
 cultofdespair: "绝望邪教"
 cultofdespair_adj: "绝望邪教"
 cultofdespair_adherent: "绝望者"
 cultofdespair_adherent_plural: "绝望者"
 cultofdespair_desc: "一个信奉无名绝望天使的邪教组织，是一些以她的名义大规模自杀的邪教和边缘团体的总称。\n最终在与网的斗争中筋疲力尽后，妖蛆失去了获得最轻微的自由的希望。这只会加速九头蛇的其他头所造成的腐败、衰败、堕落和广泛损伤。大丧，妖蛆的绝望恶惑，吞噬着人的意志，磨灭改善自己的希望，使人专注于自己的错误。绝望吞噬着他们，他们慢慢地放弃了任何尝试。在卡玛佐兹完全死亡后，蝙蝠成为了绝望的代言人，大丧的恶神是无名绝望天使。"
 lethargg: "大惰"
 lethargg_adj: "大惰"
 lethargg_adherent: "怠惰者"
 lethargg_adherent_plural: "怠惰者"
 lethargg_desc: "该恶惑是在绝望之后产生的，一般被认为是大丧的孩子。由于除了等待之外无计可施，妖蛆越来越不关心它真正的命运是什么。与绝望一样，受害者变得不知所措。他们切断自己的情感，考虑自杀的想法，很少或根本不去思考他们可能会影响到谁。虽然有些人认为它是恶惑链条中最薄弱的一环，但它最大的邪恶在于无人去帮助这些灵魂。该恶惑的恶神为停滞与疾病之主，瑟里夫格。\n天主教会认为大惰是一种致命的懒惰原罪，他们称之为“怠惰”。"
 hrugg: "大沼"
 hrugg_adj: "大沼"
 hrugg_adherent: "泥烂者"
 hrugg_adherent_plural: "泥烂者"
 hrugg_desc: "大沼的本质是妖蛆的一种元素之灵。大沼是土元素的扭曲对应物，由妖蛆形态的固体部分组成。它的腐蚀性质将它所接触到的任何东西转化为更多的淤泥。在更稀薄的形式下它是有毒的，并从而导致身体和精神上的疾病。它使受害者坚持自己的迷信，即使有明确的证据推翻这。"
 hoga: "大霾"
 hoga_adj: "大霾"
 hoga_adherent: "咳嗽者"
 hoga_adherent_plural: "咳嗽者"
 hoga_desc: "大霾的本质，是妖蛆的一种元素之灵。大霾是气元素的腐化版本，由妖蛆身体的气态部分组成。它的毒气会毒害或腐蚀吸入它的生物。这种元素在黑暗中世纪的物质世界的表现形式为来自德尔斐神谕的预言烟雾、各种形成“地狱之门”的天坑、围城中燃烧沥青散发的恶臭烟雾以及各种神秘教派的吸烟仪式，而大量的接触会导致呼吸障碍，如哮喘和致命的肺部疾病。"
 furmas: "大辐"
 furmas_adj: "大辐"
 furmas_adherent: "癌瘤者"
 furmas_adherent_plural: "癌瘤者"
 furmas_desc: "大辐既是妖蛆的变态之火，也是辐射的灵性表现。由妖蛆的血液组成，恶火所接触到的一切都会扭曲和变形。能在地球深处自然发现。恶火是迄今为止黑螺旋舞者最流行使用的元素。恶火变得普遍的那一天，怒嚎末日就在眼前。"
 wakshaa: "大毒"
 wakshaa_adj: "大毒"
 wakshaa_adherent: "污毒者"
 wakshaa_adherent_plural: "污毒者"
 wakshaa_desc: "大毒的本质是妖蛆的一种元素之灵。大毒是妖蛆对水元素的黑暗戏仿，也是妖蛆身体中液体部分的残骸。它在物理上表现为一种颜色鲜艳地致命毒药，在黑暗中世纪，它表现为腐败的葡萄酒、啤酒和烈酒。在大剂量的情况下，它能立即杀死受害者并毒害他们的肉体。小剂量时，它会产生暴力情绪的爆发，导致缓慢的消耗性疾病。"
 blackspiraldancer_religion: "黑螺旋舞者"
 blackspiraldancer_religion_adj: "黑螺旋舞者"
 blackspiraldancer_religion_adherent: "黑螺旋舞者"
 blackspiraldancer_religion_adherent_plural: "黑螺旋舞者"
 blackspiraldancer_religion_desc: "可怕的黑螺旋舞者也被称为失落部族，他们是叛向妖蛆的狼族。他们曾经被称为“白嚎”，在该部族试图靠自己打倒妖蛆后，已经被腐化到了底。"
 cluithi: "克卢伊德派"
 cluithi_adj: "克卢伊德派"
 cluithi_adherent: "克卢伊德派"
 cluithi_adherent_plural: "克卢伊德派"
 cluithi_desc: "在黑螺旋舞者部族内部，有一个阵营竭力保留了白嚎的遗产。克卢伊德派仍然在苏格兰最荒凉的荒野和森林中游荡，模仿他们祖先数个世纪前的样子。他们撕毁自己的衣服，自豪地在身上涂抹蓝色颜料，并展示皮克特式纹身。该阵营的统治者也有精英主义倾向，认为自己是部族的贵族。该部族的名字源自一位曾经的皮克特国统治者。许多克卢伊德派认为自己是克卢伊德——最早带领皮克特人来到喀里多尼亚的英雄——最忠实的孩子。"
 princesofruin: "废墟亲王"
 princesofruin_adj: "废墟亲王"
 princesofruin_adherent: "废墟亲王"
 princesofruin_adherent_plural: "废墟亲王"
 princesofruin_desc: "废墟亲王坚持认为怒嚎末日之战已经结束，并且已经完成。他们宣扬自我放纵，声称世界的垂死之躯现在是他们的了，他们可以随意统治和对待。腐化者的善战勇士，他们声称放纵自己的基本本能就是对妖蛆的绝对崇拜。废墟亲王认为更传统的黑螺旋舞者是乡下人和宗教狂热者；这两种主义的拥护者之间的暴力冲突很常见。"
 seekersoftheancient: "寻古者"
 seekersoftheancient_adj: "寻古者"
 seekersoftheancient_adherent: "寻古者"
 seekersoftheancient_adherent_plural: "寻古者"
 seekersoftheancient_desc: "这片土地上的黑暗德鲁伊们寻求与古迹周围的大气和风水进行商议。他们并不颂扬灵，而是呼唤其元素的美德，间接地召唤它，通过自然界行事。这间接地赋予他们洞察力和力量，使他们能够发展和指导与周围景观相联系的坑堑。他们作为萨满，冒着被囚禁和精神错乱的危险，与不可想象的灵交流，直接获得洞察力。"
 mouthofvorax_desc: "大饕之口，是一个信奉恶魔“大饕”——妖蛆恶惑大饕的邪教。它以食人仪式为重点。\n大饕的诞生来自于一次将造物带回控制之下的绝望尝试，大饕抓住了它所能触及到的一切。它不关心为什么它能获得，只关心它能得到什么。由于兽性的本性，该恶惑没有任何恶神辅助。放弃自己的一些东西，将自己的力量灌输给一个人类，意味着所拥有的东西会变少。黑螺旋舞者会祈求“无面食者”雷尔沙布为他们与该妖蛆交涉。\n它被暗影裁判所称为致命的原罪——“贪婪”。"
 hellcats: "地狱猫"
 hellcats_adj: "地狱猫"
 hellcats_adherent: "地狱猫"
 hellcats_adherent_plural: "地狱猫"
 hellcats_desc: "当黑螺旋舞者袭击了苏格兰的祟利坎芭丝特的年度辩论会时，他们把其中一些逼进了[UmbraGlossary('black_spiral_labyrinth')]，以便让他们皈依妖蛆。那些活下来的人变成了地狱猫，他们一贯的真率疯狂变成了自我毁灭和无意识的攻击性。等待怒嚎末日来纪念他们的黑暗之父，这些被污染的生物带来了他们与妖精的幻觉天赋和各种妖蛆灵具的有效联系，他们以芭丝特式的好奇心构建了这种关系。"
