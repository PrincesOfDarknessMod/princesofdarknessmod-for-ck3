 wyrm_religion: "妖蛆"
 wyrm_religion_adj: "妖蛆"
 wyrm_religion_adherent: "妖蛆"
 wyrm_religion_adherent_plural: "妖蛆"
 wyrm_religion_desc: "在狼族的神学中，妖蛆是至高天神之一。妖蛆的目的是净化和纠正尘世，使其更迟一步堕入熵。祂通过消除奇原的创造和织者的结构来实现这一目的。\n随着人类的出现，妖蛆逐渐受到限制，直到祂被逼疯，一心想要毁灭一切。因此，妖蛆现在是毁灭、混沌、黑暗和腐败之灵，是狼族所反对的一切的本质。"
