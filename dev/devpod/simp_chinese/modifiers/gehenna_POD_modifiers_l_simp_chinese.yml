l_simp_chinese:
 POD_izhim_ur_baal_curse_modifier: "巴力血咒：全开"
 POD_county_great_fire_modifier: "被大火焚毁"
 POD_county_great_flood_modifier: "被大洪水所淹没"
 POD_county_great_sacking_modifier: "在一场洗劫中被摧毁"
 POD_county_great_famine_modifier: "大饥荒"
 POD_county_great_earthquake_modifier: "被剧烈地震所破坏"
 POD_izhim_ur_baal_curse_modifier_desc: "哈基姆圣裔渴望吸食其他吸血鬼的血液，并且很难抗拒它。他们在巴力大战中击败的敌人发出了最后的笑声。"
 POD_baali_curse_normal_modifier: "巴力血咒：适当"
 POD_baali_curse_normal_modifier_desc: "哈基姆圣裔已经适应了巴力血咒给予的对血的渴望。虽然仍然是障碍，但现在大部分已经得到掌控。"
 POD_baali_curse_jamal_modifier: "巴力血咒：信仰防护"
 POD_baali_curse_jamal_modifier_desc: "贾迈勒教导哈基姆圣裔通过对神的信仰来防范巴力的诅咒。无论你相信谁，真正的安宁只能在大能中找到。"
 POD_baali_curse_thetmes_modifier: "巴力血咒：接纳"
 POD_baali_curse_thetmes_modifier_desc: "为什么要抗争？忒弥斯提出了一个很好的观点。如果有人软弱到让自己会被吸榨，这意味着他们的灵魂作为你的食物可能比他们更有用。"