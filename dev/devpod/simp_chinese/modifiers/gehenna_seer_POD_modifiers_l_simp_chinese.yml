l_simp_chinese:
 gehenna_seer_03_modifier: "预言：以诺山谷之战"
 gehenna_seer_04_modifier: "预言：留意舞动的黯影"
 gehenna_seer_05_modifier: "预言：精血将如钻石般稀有"
 gehenna_seer_06_modifier: "预言：三亲王之首"
 gehenna_seer_07_modifier: "预言：无族者将到来并掌权"
 gehenna_seer_08_modifier: "预言：夏娃的最后一位女儿"
 gehenna_seer_09_modifier: "预言：极北丛林的远古饥渴"
 gehenna_seer_10_modifier: "预言：被遗忘的城市深处蛰动的古老黑暗"
 gehenna_seer_11_modifier: "预言：漆黑的日耀"
 gehenna_seer_12_modifier: "预言：倾听这渡鸦的泣诉"
 gehenna_seer_13_modifier: "预言：世界将步入酷寒"
 gehenna_seer_14_modifier: "预言：地狱之力将倾泻于世"
 gehenna_seer_15_modifier: "预言：血之帝国"
 gehenna_seer_16_modifier: "预言：长达千年的统治"
 gehenna_seer_17_modifier: "预言：舍特子嗣将奋起反抗"
 gehenna_seer_18_modifier: "预言：彼辈应于旭日东升之时守护吾族之房屋"
 gehenna_seer_19_modifier: "预言：水将覆也"
 gehenna_seer_20_modifier: "预言：钢铁巨像"
 gehenna_seer_21_modifier: "预言：从时之初便闻得兄弟之血"
 gehenna_seer_22_modifier: "预言：度经五百年的弃厅"
 gehenna_seer_23_modifier: "预言：五百年中，七族并立"
 gehenna_seer_24_modifier: "预言：聆听先知的话语"
 gehenna_seer_25_modifier: "预言：远古的恐怖只是即将到来之物的梦"
 gehenna_seer_26_modifier: "预言：没有鬼魂的坟墓"
 gehenna_seer_27_modifier: "预言：掘尽世界寻找最后一滴真相"