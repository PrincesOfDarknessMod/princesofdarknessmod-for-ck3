l_simp_chinese:
 POD_azhi_dahaka_journey.1.t: "研究阿兹·达哈卡"
 POD_azhi_dahaka_journey.1.desc: "阿兹·达哈卡是波斯语中代表恶魔阿里曼的三头龙。对棘秘魑来说，它是蜕变者的圣杯，是一种终极的开悟状态，可能通过大量使用易变术来实现。\n你的研究证实了你的初步印象，通往易变涅槃的道路并非只有一条，而是多种多样的。你必须开辟自己的道路，避免前人所犯的错误。"
 POD_azhi_dahaka_journey.1.a: "进度"
 POD_azhi_dahaka_journey.2.t: "阿兹·达哈卡：永恒变化之龙"
 POD_azhi_dahaka_journey.2.desc: "阿兹·达哈卡、魔龙、伊卢扬卡什、德古拉和利维坦，皆为巨龙。你不禁好奇，为什么这只巨兽在棘秘魑的神话中占据如此重要的地位。其实答案很简单。从人类文明的萌芽开始，巨龙的阴影就盘旋在人类的传说之上。凡人畏惧这些巨大蛇形生物，而对棘秘魑而言，它象征着伟大的蜕变。巨龙是混沌边缘的蜕变先兆，它螺旋和蜿蜒的形态永远处于运动之中。吸引你的并非它的外貌，而是它化茧成蝶的潜力——以及超越这一切的可能性。它们是我们尚未真正实现的蜕变的真实体现。\n它们是通向你飞升的第一条道路。"
 POD_azhi_dahaka_journey.2.a: "为了成就永恒变化之龙……"
 POD_azhi_dahaka_journey.2.a.success: "你的仪式会成功，你会永远改变，让你更接近阿兹·达哈卡。"
 POD_azhi_dahaka_journey.2.a.failure: "你的仪式将会成功，#R 但持续的变化将会超出你的承受范围。#!"
 POD_azhi_dahaka_journey.3.t: "阿兹·达哈卡"
 POD_azhi_dahaka_journey.3.desc: "一般而言，除了少数显眼的例外，棘秘魑并不倾向于虔诚信仰某物。当你可以将自己塑造为神时，为何要崇拜某个彼方的神灵呢？他们不是真正的神明，也没有真正的教义。易变涅槃是氏族超验主义的象征、图腾和焦点。\n从魔龙到伊卢扬卡什，从德古拉到利维坦，龙的形象深深嵌套于棘秘魑的神话中。凡人畏惧的东西，正是我们所追求的——并非龙的字面或物理形态，而是龙作为变革者的象征。我们追求超凡的境界，行走在易变涅槃蜿蜒的螺旋中，凝视它的无数张口与双眼。在混沌与永恒交织的运动中，我们会找到跳动的龙之心，并尽情吸取其中的力量。\n隐喻得以具现，谜题化为血肉。易变涅槃是我们无神、异类灵性中的翼手天使。\n现在，它是你的了。"
 POD_azhi_dahaka_journey.3.a: "我自由了。"
 POD_azhi_dahaka_journey.4.t: "阿兹·达哈卡？"
 POD_azhi_dahaka_journey.4.desc: "阿兹·达哈卡并非某种涅槃状态，蜕变者通过它与宇宙合而为一，恰恰相反——经历蜕变是为了彻底脱离受造者的身份，成为在这个宇宙中不再受制于自我的独立存在的意志。\n至少有些人是这么认为的。蜕变是一种孤独的追求。你真的实现它了吗？还是你只是在永恒变化的漩涡中迷失了自我？"
 POD_azhi_dahaka_journey.4.a: "#beast 我自由了。#!"