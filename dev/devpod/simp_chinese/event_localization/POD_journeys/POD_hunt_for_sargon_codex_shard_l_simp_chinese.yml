l_simp_chinese:
 all_sargon_codex_shards_are_in_possession: "所有的萨尔贡圣典残篇都属于他人！"
 POD_hunt_for_sargon_codex_shard.tt: "你将把残篇返还给它们的‘合法’拥有者。"
 POD_hunt_for_sargon_codex_shard.3.t: "探寻萨尔贡圣典之旅：小村庄"
 POD_hunt_for_sargon_codex_shard.3.desc: "我对萨尔贡圣典的搜寻将我带到一个小村庄，据我收集的信息，一个萨尔贡圣典的残篇在当地出售。我的怀疑得到了证实，我看到残篇在一个摊位上售卖。我该怎么处理这件事？"
 POD_hunt_for_sargon_codex_shard.3.a: "我直接买下它。"
 POD_hunt_for_sargon_codex_shard.3.b: "我会偷走它。"
 POD_hunt_for_sargon_codex_shard.3.c: "杀光所有人然后夺取它。"
 POD_hunt_for_sargon_codex_shard.3.d: "我会用我的控制能力让摊主直接把它送给我。"
 POD_hunt_for_sargon_codex_shard.4.t: "探寻萨尔贡圣典之旅：家族传承"
 POD_hunt_for_sargon_codex_shard.4.desc: "我对萨尔贡圣典的搜寻将我带到一个显赫的家族，据说圣典是他们家族传承的宝物之一。当然，他们不太愿意轻易放弃它。我该怎么处理这件事？"
 POD_hunt_for_sargon_codex_shard.4.a: "直接偷走它。"
 POD_hunt_for_sargon_codex_shard.4.b: "杀光所有人然后直接拿走它。"
 POD_hunt_for_sargon_codex_shard.4.c: "用我的心灵控制能力让家主亲手交出来。"
 POD_hunt_for_sargon_codex_shard.5.t: "探寻萨尔贡圣典之旅：藏身处"
 POD_hunt_for_sargon_codex_shard.5.desc: "我对萨尔贡圣典的搜寻将我带到一个吸血鬼藏身处的废墟，据传圣典就位于此地。根据你所收集的情报，这些传闻是正确的，消息来源证实圣典确实在庇护所内。不幸的是，你的消息来源无法亲自取回它，所以这部分工作得由你来完成。你的选择有限，但圣典就在等待你。"
 POD_hunt_for_sargon_codex_shard.5.a: "突袭废墟。"
 POD_hunt_for_sargon_codex_shard.5.b: "收买一些凡人去洗劫这个地方。"
 POD_hunt_for_sargon_codex_shard.5.c: "用你的支配能力控制当地的凡人去洗劫这个地方。"
 POD_hunt_for_sargon_codex_shard.6.t: "探寻萨尔贡圣典之旅：稚子"
 POD_hunt_for_sargon_codex_shard.6.desc: "我对萨尔贡圣典的搜寻将我带到了一个稚子的藏身处，我确认他们正在出售圣典残篇。见面后，我发现他们并不知道残篇的真正价值，但他们开的价格离谱。该怎么处理呢？"
 POD_hunt_for_sargon_codex_shard.6.a: "接受高价交易。"
 POD_hunt_for_sargon_codex_shard.6.b: "让他们知道欺骗长者的后果。"
 POD_hunt_for_sargon_codex_shard.7.t: "探寻萨尔贡圣典之旅：凡人密教"
 POD_hunt_for_sargon_codex_shard.7.desc: "我对萨尔贡圣典的搜寻将我带到了一个凡人教派，这些凡人似乎将残篇奉为神圣的遗物。令人沮丧的是，他们拒绝与残篇分离。他们的信仰是真诚的，控制他们似乎不起作用。你只有两种选择。"
 POD_hunt_for_sargon_codex_shard.7.a: "直接偷走它。"
 POD_hunt_for_sargon_codex_shard.7.b: "屠杀他们。"
 POD_hunt_for_sargon_codex_shard.8.desc: "我对萨尔贡圣典的搜寻将我带到了这里……\n但没有找到任何残篇。我的消息有误，我白白浪费了时间……"
 POD_hunt_for_sargon_codex_shard.8.a: "该死。"
 POD_hunt_for_sargon_codex_shard.7.c: "与他们的信仰辩论。"