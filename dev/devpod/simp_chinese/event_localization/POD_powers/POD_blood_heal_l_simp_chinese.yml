l_simp_chinese:
 POD_vampire_blood_heal.100.t: "#BLOODRED 血愈！#!"
 POD_vampire_blood_heal.100.desc: "#BLOODRED 血液能超自然地治愈你的伤口，但它有可能会唤醒你的饥渴。#!"
 POD_vampire_blood_heal.100.option.a: "治愈我的伤口"
 POD_vampire_blood_heal.100.option.a.tt.beast: "#BLOODRED 我们需要得到更多的血。#!"
 POD_vampire_blood_heal.100.option.b: "治愈我的残缺"
 POD_vampire_blood_heal.100.option.b.tt.beast: "#BLOODRED 你真的是把事情弄得一团糟。#!"
 POD_vampire_blood_heal.100.option.c: "让我缺失的眼睛重新长出来"
 POD_vampire_blood_heal.100.option.c.tt.beast: "#BLOODRED 掠食者有两双眼睛！#!"
 POD_vampire_blood_heal.100.option.d: "重新接上我的腿"
 POD_vampire_blood_heal.100.option.d.tt.beast: "#BLOODRED 我们现在就可以把他们赶走。#!"
 POD_vampire_blood_heal.100.option.e: "我暂时不会冒着增加饥渴的风险。"
 POD_vampire_blood_heal.100.option.e.tt.beast: "#BLOODRED 你会的，而且很快就会。我等着。#!"
 POD_vampire_blood_heal.100.option.f: "治好我的瞎眼。"
 POD_vampire_blood_heal.100.option.f.tt.beast: "#BLOODRED 又或我们可以像蝙蝠一样掠食。#!"
 POD_vampire_blood_heal.100.option.g: "治好我的伤疤。"
 POD_vampire_blood_heal.100.option.g.tt.beast: "#BLOODRED 浪费血液。#!"