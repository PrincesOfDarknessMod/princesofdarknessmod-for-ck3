l_simp_chinese:
 POD_inquisition_face_sins.001.t: "直面汝罪"
 POD_inquisition_face_sins.001.desc: "你开始觉得自己的生活方式，不配得到天主赐予你的恩典。你的信仰曾经是不可动摇的，但最近你感觉到你的决心出现了裂痕。\n是这个世界真的注定要灭亡？还是你做得不够好？怀疑正在困扰着你，这种危机越来越影响你的效率。你必须做点什么，也许该从成为一个更好的人开始。"
 POD_inquisition_face_sins.001.option.a: "我应该更好的理解祂的方式"
 POD_inquisition_face_sins.001.option.a.tt: "你会对这做点什么，这可能会化解这场危机，也可能付出更多损失。"
 POD_inquisition_face_sins.001.option.b: "我一点也不在乎……"
 POD_inquisition_face_sins.001.option.b.tt: "你将什么也不做，这会有所代价"
 POD_inquisition_face_sins.002.t: "直面汝罪（二）"
 POD_inquisition_face_sins.002.desc: "在思考了如何才能更深入地了解神的恩典之后，你得出了两个选择：向那些过去的真正虔诚之士学习或向神的仆人寻求帮助。"
 POD_inquisition_face_sins.002.option.a: "我应该寻求过去圣人的永恒智慧"
 POD_inquisition_face_sins.002.option.a.tt: "你将尝试了解更多关于过往虔信徒的事"
 POD_inquisition_face_sins.002.option.a.desc: "学识与决心"
 POD_inquisition_face_sins.002.option.a.success: "你成功的更好的理解了祂的方式"
 POD_inquisition_face_sins.002.option.a.success.tt: "我更好的理解祂了"
 POD_inquisition_face_sins.002.option.a.failure: "你没能更好的理解了祂的方式"
 POD_inquisition_face_sins.002.option.a.failure.tt: "也许，我最终不是祂的仆人？"
 POD_inquisition_face_sins.002.option.b: "我应该到附近的教堂寻求帮助"
 POD_inquisition_face_sins.002.option.b.tt: "你将请求当地的牧师和僧侣帮助你"
 POD_inquisition_face_sins.002.option.b.desc: "外交与决心"
 POD_inquisition_face_sins.002.option.b.success: "你成功的更好的理解了祂的方式"
 POD_inquisition_face_sins.002.option.b.success.tt: "我更好的理解祂了"
 POD_inquisition_face_sins.002.option.b.failure: "你没能更好的理解了祂的方式"
 POD_inquisition_face_sins.002.option.b.failure.tt: "也许，我最终不是祂的仆人？"
 POD_inquisition_face_sins.102.t: "恢复信仰"
 POD_inquisition_face_sins.102.desc.learning: "在花了很长时间阅读关于过往的虔诚者们的古书后，你明白了，天主的方式与人的方式是不同的。如果他把祝福给了你，一位纯粹的罪人，你就得让他骄傲。"
 POD_inquisition_face_sins.102.desc.diplomacy: "在过去的几天里，你和很多神的仆人交谈过，现在你终于开始明白，你如何看待自己并不重要，唯一重要的是神如何看待你。如果他认为你配得上你的祝福，你要确保这些祝福不会浪费。"
 POD_inquisition_face_sins.102.option.a: "上主作为何等奥秘"
 POD_inquisition_face_sins.102.option.a.tt: "你保留了你的神圣力量"
 POD_inquisition_face_sins.003.t: "信仰危机"
 POD_inquisition_face_sins.003.desc.learning: "即使你花了很长时间试图通过阅读古书来了解过往的虔诚者们，这也没有任何意义。也许，你终究不是祂的仆人。或者至少是有缺陷的一位。你只需要祈祷就足够了。"
 POD_inquisition_face_sins.003.desc.diplomacy: "甚至当地的牧师和修道士也没有帮助你了解神和祂的行事方式。也许，你终究不是祂的仆人。或者至少是有缺陷的一位。你只需要祈祷就足够了。"
 POD_inquisition_face_sins.003.option.a: "我已然迷失"
 POD_inquisition_face_sins.003.option.a.tt: "你失去了你的神圣力量……一段时间"
 POD_inquisition_face_sins.004.t: "信仰危机（二）"
 POD_inquisition_face_sins.004.desc: "你已经很久没有使用神赐予的神力了。也许，你已经失去了信心，或是祂对你失去了信心。但如果你愿意的话，你可以尝试重新获取你的力量。\n对于真信之人来说，永远都不会太晚。毕竟只有不努力走这条道路才是罪，而不是不走。"
 POD_inquisition_face_sins.004.option.a: "我会尽我所能恢复我的信仰"
 POD_inquisition_face_sins.004.option.a.tt: "你会努力恢复你的信仰，不惜一切代价"
 POD_inquisition_face_sins.004.option.b: "我不能放弃"
 POD_inquisition_face_sins.004.option.b.tt: "你将试着更好地了解你自己和上主"
 POD_inquisition_face_sins.004.option.b.desc: "学识挑战"
 POD_inquisition_face_sins.004.option.b.success: "你成功地更好地了解了祂和你自己"
 POD_inquisition_face_sins.004.option.b.failure: "你没能更好地了解祂和你自己"
 POD_inquisition_face_sins.004.option.b.failure.tt: "你没能让你的力量回归……目前而言"
 POD_inquisition_face_sins.004.option.c: "我现在没时间做这种事"
 POD_inquisition_face_sins.004.option.c.tt: "你现在不会试图恢复你的信仰"
 POD_inquisition_face_sins.004.option.d: "说真的？我一点也不在乎"
 POD_inquisition_face_sins.004.option.d.tt: "你将再也没法恢复你的信仰"
 POD_inquisition_face_sins.001.generic.tt: "#R 出现该信仰危机的原因是，你的角色至少有一种中世纪基督教七宗罪特质。#!"