l_simp_chinese:
 POD_insanity.001.t: "疯狂之赐"
 POD_insanity.001.desc: "一切都准备好了，现在我可以和[defender.GetFirstName]分享我的疯狂了[defender.GetSheHe|U]会很感激这样的赠礼的，[defender.GetSheHe]会么？"
 POD_insanity.001.option.a: "学识之赠礼，这就是[defender.GetSheHe]所需要的！"
 POD_insanity.001.option.a.tt: "你和[defender.GetFirstName]之间进行学识能力对决。"
 POD_insanity.001.option.a.tt.beast: "#beast 知识的诅咒将损坏[defender.GetHerHis]的心智！#!"
 POD_insanity.001.option.b: "影子，它们会说话吗？"
 POD_insanity.001.option.b.tt: "你和[defender.GetFirstName]之间进行谋略能力对决。"
 POD_insanity.001.option.b.tt.beast: "#beast [defender.GetSheHe|U]将不再于黑暗中感到安全！#!"
 POD_insanity.001.option.c: "[defender.GetHerHis|U]的脑海看上去有足够空间来放……另一个人。"
 POD_insanity.001.option.c.tt: "你和[defender.GetFirstName]之间进行军事能力对决。"
 POD_insanity.001.option.c.tt.beast: "#beast [defender.GetSheHe|U]的脑海将不止有其自己一人！#!"
 POD_insanity.001.option.d: "真相将碾压[defender.GetHerHis]的残存希望"
 POD_insanity.001.option.d.tt: "你和[defender.GetFirstName]之间进行管理能力对决。"
 POD_insanity.001.option.d.tt.beast: "#beast 噢，残酷的事实！#!"
 POD_insanity.001.option.e: "不施加给[defender.GetHerHim]"
