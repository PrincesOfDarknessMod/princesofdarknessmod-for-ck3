l_simp_chinese:
 POD_heart_of_darkness.001.t: "黑暗之心"
 POD_heart_of_darkness.001.desc: "现在是离人性更远的时候了。一切都准备好了，一个黑暗的仪式将允许你移除自己的心，成为自己命运的主宰，你的心兽对你的影响越来越小。但你有足够的勇气继续下去吗？"
 POD_heart_of_darkness.001.option.a: "时候到了"
 POD_heart_of_darkness.001.option.a.tt: "你将移除你的心"
 POD_heart_of_darkness.001.option.a.tt.beast: "#beast 大错特错！#!"
 POD_heart_of_darkness.001.option.b: "我还没准备好"
 POD_heart_of_darkness.001.option.b.tt: "你放弃了接受仪式的尝试"
 POD_heart_of_darkness.001.option.b.tt.beast: "#beast 这就对了！没有我，你就无法生存！#!"
 POD_heart_of_darkness.002.t: "无心"
 POD_heart_of_darkness.002.desc: "它完成了，仪式达成了。你感觉你的情绪变得迟钝，使你更容易生存。缺点是，你变得更难理解别人，现在你的敌人可能会找到你的心并摧毁它。但最大的好处与心兽有关，它现在更安静了，更容易克服。"
 POD_heart_of_darkness.002.option.a: "情绪无法控制我！"
 POD_heart_of_darkness.002.option.a.tt: "你成功地取出了你的心，但你可以随时把它放回你的胸腔里。"
 POD_heart_of_darkness.003.option.a.success: "你成功地偷了心脏。"
 POD_heart_of_darkness.003.option.a.failure: "你没能偷走心脏。"
 POD_manage_hearts_tooltip: "现在，你可以通过对自己使用角色互动来管理这颗心。"