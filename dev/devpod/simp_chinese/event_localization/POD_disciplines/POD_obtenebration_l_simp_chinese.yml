l_simp_chinese:
 POD_drain_the_life.001.t: "众生衰竭"
 POD_drain_the_life.001.desc: "以你目前的幽暗术等级，你可以将[target.GetFirstNamePossessive]的首都笼罩在黑暗中。但这样力量是有代价的。"
 POD_drain_the_life.001.desc.ahrimans_demesne: "你是黑暗之主。凭借你对深渊的巨大掌握，你可以将整个[target.GetFirstName]控制的国度笼罩在黑暗中，吞噬它所接触的一切。这样的力量是有代价的，[target.GetFirstName]不会高兴。"
 POD_drain_the_life.001.option.a: "凭借我对深渊的巨大控制力，我将把[target.GetHerHis]的国度笼罩在黑暗之中！"
 POD_drain_the_life.001.option.a.tt: "你将尝试对[target.GetFirstName]的国度施放众生衰竭，这种力量将影响[target.GetSheHe]控制的每一个伯爵领，甚至是[target.GetHerHis]的封臣控制的地区。"
 POD_drain_the_life.001.option.a.desc: "黑暗挑战"
 POD_drain_the_life.001.option.a.success: "你成功使用了众生衰竭能力"
 POD_drain_the_life.001.option.a.tt.attacker_wins: "[target.GetFirstNamePossessive]的国度淹没在黑暗中，该将吞噬了它所接触的一切。"
 POD_drain_the_life.001.option.a.failure: "你没能用出众生衰竭能力"
 POD_drain_the_life.001.option.a.tt.attacker_lost: "你失败了"
 POD_drain_the_life.001.option.b: "很快，[target.GetFirstNamePossessive]的首都将被笼罩在黑暗中。"
 POD_drain_the_life.001.option.b.tt: "在[target.GetFirstNamePossessive]的首都伯爵领施展了众生衰竭"
 POD_drain_the_life.001.option.c: "还不是时候"
 POD_drain_the_life.001.option.c.tt: "你将停止在[target.GetFirstNamePossessive]的领地上施放众生衰竭的尝试。"
 POD_whole_realm_was_drained_toast: "可怖的黑暗被[attacker.GetFirstName]释放到你的国度。"
 POD_drained_enemy_realm_toast: "你成功得在[target.GetFirstNamePossessive]的国度释放出可怖的黑暗"
 POD_drain_the_life_failed_toast: "你没能在[target.GetFirstNamePossessive]的国度中释放出可怖的黑暗。"
 POD_capital_county_drained_toast: "可怖的黑暗被[attacker.GetFirstName]释放在你的首都。"
 POD_shadow_twin.001.t: "暗影分身"
 POD_shadow_twin.001.desc: "凭着你对幽暗术的掌握，你可以尝试将自己的影子活动起来，使其成为自己的双重身。这样的生物在千年圣战的永恒斗争中会有很大的帮助，但这样的力量是有代价的。"
 POD_shadow_twin.001.option.a: "我指使着暗影，是时候让其服从了"
 POD_shadow_twin.001.option.a.tt: "你将尝试制造一位暗影分身"
 POD_shadow_twin.001.option.a.desc: "与你内心的黑暗作斗争"
 POD_shadow_twin.001.option.a.tt.success: "一位暗影分身已被成功造出"
 POD_shadow_twin.001.option.a.tt.failure: "你没能制造出一位暗影分身"
 POD_shadow_twin.001.option.b: "还不到时候"
 POD_shadow_twin.001.option.b.tt: "你将放弃制造暗影分身的想法"
 POD_shadow_twin.002.t: "暗影分身（二）"
 POD_shadow_twin.002.desc: "凭着你对幽暗术的掌握，你成功地制造出了一位暗影分身，现在是时候发出指令了。"
 POD_shadow_twin.002.option.a: "所有暗影都该听从于我"
 POD_shadow_twin.002.option.a.tt: "一位暗影分身已被成功造出。"
 POD_shadow_twin.003.t: "暗影分身（二）"
 POD_shadow_twin.003.desc: "即使以是你目前对幽暗术的掌握，也不足以制造出一位暗影分身……目前而言。"
 POD_shadow_twin.003.option.a: "我还没有准备好指令暗影"
 POD_shadow_twin.003.option.a.tt: "你没能制造出一位暗影分身"
 POD_shadow_twin.death_management.t: "失去你自我的一部分"
 POD_shadow_twin.death_management.desc: "噩耗传来，你的暗影分身，你自己灵魂的一部分，已经死亡。你能感觉到内心的可怕空虚。"
 POD_shadow_twin.death_management.option.a: "又一个化为尘土的……"
 POD_shadow_twin.death_management.option.a.tt: "你的暗影分身死了"
 POD_commune_with_the_abyss.001.t: "深渊对谈"
 POD_commune_with_the_abyss.001.desc: "深渊在聆听。它是隐秘的汇流之地，据说它能听到任何低语。借助这种力量，你将自己完全融入阴影之中，与你的思想合二为一。合一后，你可以向黑暗提出一个问题，而黑暗没有隐藏答案的权利。\n这个答案将是真实且完整的，不会被隐晦的谜语掩盖。深渊只会隐藏真相，但不会混淆它或满怀妒忌地守护它。"
 POD_commune_with_the_abyss.001.a: "“我是否已经发挥出我的全部潜力？”"
 POD_commune_with_the_abyss.001.a.tt: "你将触发另一个事件，以选择你将获得的凡人[lifestyle|E]。"
 POD_commune_with_the_abyss.001.b: "“人类的未来走向何方？”"
 POD_commune_with_the_abyss.001.c: "“莉莉丝教会该隐的是什么？”"
 POD_commune_with_the_abyss.001.c.tt: "你将触发另一个事件，以选择你将获得的吸血鬼[lifestyle|E]。"
 POD_commune_with_the_abyss.001.d: "“我的廷臣们在对我隐瞒什么？”"
 POD_commune_with_the_abyss.001.d.tt: "你将揭露宫廷中的所有秘密和阴谋。"
 POD_commune_with_the_abyss.002.t: "深渊对谈：学识"
 POD_commune_with_the_abyss.002.desc: "“我还能取得进步吗？”这个问题得到了肯定的回答，随即各种你仍可改进的领域的知识涌入你的脑海。"
 POD_commune_with_the_abyss.002.a: "魅力与威仪。"
 POD_commune_with_the_abyss.002.b: "战略与领导。"
 POD_commune_with_the_abyss.002.c: "统治与影响力。"
 POD_commune_with_the_abyss.002.d: "欺诈与谎言。"
 POD_commune_with_the_abyss.002.e: "知识与智慧。"
 POD_commune_with_the_abyss.003.t: "深渊对谈——神秘学识"
 POD_commune_with_the_abyss.003.desc: "“莉莉丝教给该隐的是什么？”答案揭示了许多内容，因为正是她帮助该隐掌握了血律，并将其转化为至今仍被吸血鬼使用的各类能力。在深渊召唤出的无数图像中，有些清晰地留在你的脑海中，帮助你达到了新的理解境界。"
 POD_commune_with_the_abyss.003.a: "通向兽性术的第一步。"
 POD_commune_with_the_abyss.003.b: "该隐的愤怒与强大的怒火。"
 POD_commune_with_the_abyss.003.c: "莉莉丝离开该隐，让他沉思的那些夜晚。"
 POD_commune_with_the_abyss.003.d: "该隐情感的力量。"
 POD_commune_with_the_abyss.003.e: "血液一直是关键。"