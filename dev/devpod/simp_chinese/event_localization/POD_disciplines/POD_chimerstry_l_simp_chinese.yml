l_simp_chinese:
 POD_mirror_duplicate.001.t: "镜像倒影"
 POD_mirror_duplicate.001.desc: "凭着你对虚幻术的掌握技能，你可以尝试将自己的倒影活动起来，使其成为自己的双重身。这样的生物在千年圣战的永恒斗争中会有很大的帮助，但这样的力量是有代价的。"
 POD_mirror_duplicate.001.option.a: "我指使着倒影，是时候让其服从了"
 POD_mirror_duplicate.001.option.a.tt: "你将尝试制造一位镜像倒影"
 POD_mirror_duplicate.001.option.a.desc: "与现实作斗争"
 POD_mirror_duplicate.001.option.a.tt.success: "一位镜像倒影已被成功造出"
 POD_mirror_duplicate.001.option.a.tt.failure: "你没能制造出一位镜像倒影"
 POD_mirror_duplicate.001.option.b: "还不到时候"
 POD_mirror_duplicate.001.option.b.tt: "你将放弃制造镜像倒影的想法"
 POD_mirror_duplicate.002.t: "镜像倒影（二）"
 POD_mirror_duplicate.002.desc: "凭着你对虚幻术的掌握，你成功地制造出了一位镜像倒影，现在是时候发出指令了。"
 POD_mirror_duplicate.002.option.a: "所有倒影都该听从于我"
 POD_mirror_duplicate.002.option.a.tt: "一位镜像倒影已被成功造出。"
 POD_mirror_duplicate.003.t: "镜像倒影（二）"
 POD_mirror_duplicate.003.desc: "即使以是你目前对虚幻术的掌握，也不足以制造出一位镜像倒影……目前而言。"
 POD_mirror_duplicate.003.option.a: "我还没有准备好指令倒影"
 POD_mirror_duplicate.003.option.a.tt: "你没能制造出一位镜像倒影"
 POD_mirror_duplicate.death_management.t: "失去你自我的倒影"
 POD_mirror_duplicate.death_management.desc: "噩耗传来，你的镜像倒影，你自己的另一面，已经死亡。"
 POD_mirror_duplicate.death_management.option.a: "又一个化为尘土的……"
 POD_mirror_duplicate.death_management.option.a.tt: "你的镜像倒影死了"