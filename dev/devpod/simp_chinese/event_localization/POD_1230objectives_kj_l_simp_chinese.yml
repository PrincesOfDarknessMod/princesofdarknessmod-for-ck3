 pod1230objectives_kj.1.t: "心法灵光"
 pod1230objectives_kj.1.desc: "[kuei_jin|E]因其本质，视己身为根本之不洁。然其仍承天命而行。心法指引她寻得此天命，助其超脱原初之态。智慧——及其渴求——常随年岁增长，初为[kuei_jin|E]时，她往往沉溺凡俗琐事。因新得之力而骄，她通常重返故土，了结旧怨，割据一方。然时移世易，她终悟凡尘之争如散米千粒——琐碎难拾，乏味无益。\n活得够久以品味永生之[kuei_jin|E]，终会追求远超凡俗之力。心路之途需凡人百世光阴；途中灵光——称为顿悟——如夜中明灯，催其前行。\n顿悟乃灵光乍现，诸事豁然开朗。此闪光昭示心法修行之进境。天命得道者，知如何辨识并把握此珍贵（却易逝）之瞬。\n此刻非其时。"
 pod1230objectives_kj.1.a: "是时候了"
 pod1230objectives_kj.1.b: "此刻非其时"
 pod1230objectives_kj.2.t: "百云之境"
 pod1230objectives_kj.2.desc: "心法至高之境，如山中云雾水滴般无形，似夜色气息般难述。[kuei_jin|E]需历凡人百世，方明百云之玄奥。此前，纵能诵经、解公案、驭元素，亦未得真谛。\n“百云”乃终极平静之喻，超然之境，连天命职责亦可暂置。百云非力量（虽浅薄者或如是观），亦非幻象（虽愚者或如是惑）。入百云（智者知其为象征，非实体）者，临神域之门，却驻足引渡后人。\n如构成其之雾霭，百云无质无形。无经文可纳其髓，无教诲可传其真。有言达此境者已非吸血鬼——或已成终极之吸血鬼。或许二者皆是。神明缄默。\n而须弥山坡陡峭非常。"
 pod1230objectives_kj.2.a: "重归完美之时已至"
 pod1230objectives_kj.3.t: "退步"
 pod1230objectives_kj.3.desc: "[kuei_jin|E]——尤以年轻者为甚——或行自私之举，蒙蔽顿悟。恶魔嗜此过，伺机诱之。若耽于凡俗之欲，或永失开悟。先贤有言：不能超脱琐碎者，当永溺其中！\n然人非完璧。纵伟大老祖亦有失察天命之时。唯当跌倒者忘却长生可再试，方为真败。"
 pod1230objectives_kj.3.a: "从此败中习而进"