l_simp_chinese:
 POD_wraith_stress_events.0010.t: "黯影力量增强"
 POD_wraith_stress_events.0010.desc: "最近日子不好过，整天跟自己较劲更是烦人。时间一天天过去，那种阴暗面越来越明显。我就稍微放松了一下警惕，结果就被钻了空子……"
 POD_wraith_stress_events.0010.a: "该死"
 POD_wraith_stress_events.0020.t: "黯影发动攻击！"
 POD_wraith_stress_events.0020.desc: "时光流逝，我深陷苦楚。黯影的甜言蜜语无济于事，#weak  抑或它们确实起了作用？#! 我想放弃，但我不会。我将继续前行。#weak  但或许是迈向湮灭？#!"
 POD_wraith_stress_events.0020.a: "我在乎吗？"
 POD_wraith_stress_events.0020.a.a: "你的黯影已掌控了你！"
 POD_wraith_stress_events.0020.a.b: "这次你的黯影未能得逞。"
 POD_wraith_stress_events.0030.t: "甜蜜的湮灭"
 POD_wraith_stress_events.0030.desc: "生存艰难，苟活更甚。苦难之日更迭，永无止境。#weak 我#!与#bold 暗影#!——若我仍能分清二者——难得达成共识：这世界黑暗而痛苦，#beast 不如焚尽一切#!"
 POD_wraith_stress_events.0030.a: "焚烬"