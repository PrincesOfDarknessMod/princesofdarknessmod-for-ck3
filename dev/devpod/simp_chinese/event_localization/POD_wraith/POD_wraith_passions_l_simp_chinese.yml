l_simp_chinese:
 POD_wraith_passions.100.t: "获得炽情"
 POD_wraith_passions.100.desc: "你的炽情与你是谁以及你为什么要成为一位死灵有着千丝万缕的联系，所以你获得了10点点数，可以用来任意分配。你可以持有10个小炽情，每个为1点，或者两个大炽情，每个为5点。等级较高的炽情要求较高，但你从其中获得更多收益。较小的炽情要求较低，但提供的收益也较少。"
 POD_wraith_passions.100.option.a: "找到我的凶手#weak （[ROOT.Var('passion_count').GetValue|0]/5）#!"
 POD_wraith_passions.100.option.b: "积蓄财富#weak （[ROOT.Var('passion_count').GetValue|0]/2）#!"
 POD_wraith_passions.100.option.c: "成为高贵之鬼#weak （[ROOT.Var('passion_count').GetValue|0]/3）#!"
 POD_wraith_passions.100.option.d: "成为超脱典范#weak （[ROOT.Var('passion_count').GetValue|0]/2）#!"
 POD_wraith_passions.100.option.e: "充实你的宝库#weak （[ROOT.Var('passion_count').GetValue|0]/4）#!"
 POD_wraith_passions.100.option.f: "建造一座奇观#weak （[ROOT.Var('passion_count').GetValue|0]/2）#!"
 POD_wraith_passions.100.option.g: "交至交朋友#weak （[ROOT.Var('passion_count').GetValue|0]/3）#!"
 POD_wraith_passions.100.option.h: "保护我的家族#weak （[ROOT.Var('passion_count').GetValue|0]/2）#!"
 POD_wraith_passions.100.option.i: "杀了我的仇人#weak （[ROOT.Var('passion_count').GetValue|0]/4）#!"
 POD_wraith_passions.100.option.back: "完成。"