 POD_wraith_shadow.004.t: "黯影的回归"
 POD_wraith_shadow.004.desc: "你形体化的黯影受到了意外，并不得不回归。"
 POD_wraith_shadow.004.option.a: "我的黯影回归了"
 POD_wraith_shadow.004.option.a.tt: "你的黯影和你又合一了"
 POD_wraith_shadow.004.t_ferryman: "纠缠命运"
 POD_wraith_shadow.004.desc_ferryman: "帕西淮和摆渡人仍有联系，如果其中一样被摧毁，另一样也会被摧毁。"
 POD_wraith_shadow.004.option.b: "我的帕西淮走了，我也一样……"