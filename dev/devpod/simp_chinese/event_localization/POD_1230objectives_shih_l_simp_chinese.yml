l_simp_chinese:
 pod1230objectives_shih.1.t: "重探羿训练法"
 pod1230objectives_shih.1.desc: "羿传统上被尊为士族始祖。这位商朝人物毕生传奇，最初对统治大地的超自然存在怀有敌意，后领悟到它们亦是自然秩序的一环。羿遂以漫长生命专诛真正威胁人类之恶，并在此过程中从友善的超自然存在处习得诸多技艺。这些教导奠定了士族根基，使其成为延续至今的强大势力。此外，羿系统整理了“巧”技，授予合格弟子，令其能公平对抗真正的邪恶。"
 pod1230objectives_shih.1.a: "羿大师充满智慧。"
 pod1230objectives_shih.2.t: "延续羿的传承"
 pod1230objectives_shih.2.desc: "羿并非完人。这位士族创始人虽主张与超自然存在和解，但当家人遭其杀害时仍陷入暴怒。他以不死木所制神弓血洗仇敌，因此被超自然存在称为“神射手”。然而士族皆知，羿为此次破戒付出惨痛代价——每支怒箭皆耗其本源，最终灵魂污浊，不久离世。明智的士族由此注重心性修炼，与武艺并重。"
 pod1230objectives_shih.2.a: "愤怒乃大敌"
 pod1230objectives_shih.3.t: "正义与睿智之业"
 pod1230objectives_shih.3.desc: "羿逝后，猎魔人一度重组为专诛超自然的“天军”，却渐趋傲慢，奴役凡人，屠戮异己。坚守羿之教导的士族拒绝臣服，此举后来被证实明智——超自然存在罕见地联合摧毁了昆仑山的天军总部。幸存的士族视此为自然秩序对背离者的惩戒。而今随着你势力增长，有人主张天军理念正义，只是手段有误，怂恿你重拾这争议衣钵。"
 pod1230objectives_shih.3.a: "昔日愚行，今仍愚行"
 pod1230objectives_shih.3.b: "天军重临！"
 pod1230objectives_shih.3.c: "我当自立"