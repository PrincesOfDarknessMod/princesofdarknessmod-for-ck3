l_simp_chinese:
 POD_martyrs.1.t: "殉道者的游行"
 POD_martyrs.1.desc: "一个接一个，你所珍视的人在与敌对者的斗争中丧生。无论他们的美德多么耀眼，他们的火焰皆被无情的黑暗所吞噬、窒息和熄灭，似乎只是时间问题。有时，当你闭上眼睛时，你会看到那些猛烈又过早地死去的人的脸，用难以辨认的表情看着你。"
 POD_martyrs.1.a: "我很荣幸能追随他们的脚步。"
 POD_martyrs.1.a.tt: "这个选项可用是因为你拥有[GetTrait('beatific').GetName( GetPlayer )]特质。"
 POD_martyrs.1.b: "主在告诉我什么？"
 POD_martyrs.1.b.tt: "你会祈求指引。"
 POD_martyrs.1.c: "我不会让这种事发生在我身上！"
 POD_martyrs.1.c.tt: "你将参加一个关于自卫的速成课程。"
 POD_martyrs.1.d: "每个人最终都要死去。"
 POD_martyrs.2.t: "真信无需质疑"
 POD_martyrs.2.desc: "你早就知道这一点：只有一个方向可走，那就是走向神的光。对你或其他任何人来说，路上有什么样的苦难是完全不重要的，根本没有其他选择。不管你是要踩到燃烧的余烬还是毒蛇，这都不会影响你，因为你在跟随主。"
 POD_martyrs.2.a: "毫无悬念。"
 POD_martyrs.3.t: "拿起你的十字！"
 POD_martyrs.3.desc: "在你祈祷不久，你经历了一种温和的鼓动，使你的思想陷入一个单一的、清晰的结论。你一生都在发誓要追随基督的道路，为什么你要在最后一段偏离它？随主殉道将是你信仰的最终表达，这一信念像闷热的夏日里的清凉泉水一样冲刷着你。你的心灵被摆正了，并被充满了喜悦。"
 POD_martyrs.3.a: "哈利路亚！"
 POD_martyrs.4.t: "震耳欲聋的寂静。"
 POD_martyrs.4.desc: "你把自己关起来安安静静地祈祷，不像往常一样有亲近天主的舒适感觉，你被一种压倒性的孤独感所淹没。你的脑海中没有一丝一毫的低语安慰，甚至没有那抚摸你灵魂的最纤柔的触碰，只有寂静。你是孤独的，比以往任何时候都更孤独。"
 POD_martyrs.4.a: "主啊，主啊，您为什么要抛弃我？"
 POD_martyrs.5.t: "武装好了并准备就绪。"
 POD_martyrs.5.desc: "无论面对的是崇魔的憎恶还是普通的暴徒，精通武器总是没有坏处的，经过几周的紧张演练和比武，你确实感觉熟练了许多。这套新获得的技巧是否能让你在与敌人的下一次对抗中毫发无损并不确定，但你在握有武器时找到了安心感。你知道你不是无敌的，但至少你不会感到毫无防备。"
 POD_martyrs.5.a: "我将把福音，或这锋利的钢针，送到他们的心里。"
 POD_martyrs.6.t: "无望无助。"
 POD_martyrs.6.desc: "几个星期过去了，你几乎不能在不伤害自己的情况下执行教给你的技巧，也不能在不摔倒的情况下摆出各种姿势。你确实逃了几节课，但一个人一天只能做这么多。不管是什么原因，训练的结果是痛苦的，令人失望的，你觉得自己好像只能勉强抵挡一个练习用的假人，更不用说地狱的衍体了。"
 POD_martyrs.6.a: "我感到比开始之前更脆弱。"
 POD_martyrs.7.t: "生活是残酷的，随后就是死亡。"
 POD_martyrs.7.desc: "被撒旦的衍体肢解或死于某种肮脏的瘟疫，这有什么区别呢？有谁能说一个比另一个更好或更坏？一个人应该珍惜他们不在可怕的痛苦中的每一刻，因为它只会变得更糟。"
 POD_martyrs.7.a: "就这样吧。"