l_simp_chinese:
 inquisition_full_support_modifier: "全力教宗援助"
 inquisition_full_support_modifier_desc: "你有了教宗的全力支持，因此有了教会本身的支持。荣耀归于上帝！"
 PODask_pope.1.t: "圣下：额我略九世"
 PODask_pope.1.desc: "暗影裁判所在很多方面都是天主教会的直接延伸，其大部分资金和支持直接来自天主教会。教宗额我略是这项功业的狂热倡导者，以至于他正在考虑建立一个“公开”裁判所，以便在未来处理不那么超自然的威胁。拥有如此强大的个人的直接对接，对于正在成长中的暗影裁判所来说，是一个不可轻言浪费的恩惠。\n许多裁判官担心额我略的继任者可能不会那么热衷于支持你的努力，也许是由于超自然的干扰，或者仅仅是他们不感兴趣（或不相信威胁）。如果这种情况发生，很可能整个组织都会受到影响。裁判官计划在短期内尽可能地做能做到的，并为额我略的健康长寿祈祷。"
 PODask_pope.1.a: "圣下万岁！"
 PODask_pope.3.t: "白烟，白云"
 PODask_pope.3.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n枢机主教们这次选择得很好，新教宗完全支持暗影裁判所，利用他所有相当大的影响力，确保你们不会缺少任何可以帮助你们对抗真正威胁的东西。"
 PODask_pope.4.t: "白烟，晴空"
 PODask_pope.4.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗选择不以任何形式干涉暗影裁判所的事务。虽然你希望罗马能提供更明确的支持，但至少没有对你的命令进行反对。目前，这已经足够了。"
 PODask_pope.4.a: "圣下万岁。"
 inquisition_no_support_modifier: "教宗禁令"
 inquisition_no_support_modifier_desc: "你们不再是天主教会的正式成员。只有少数教廷的高级成员仍然支持你们。"
 PODask_pope.5.t: "白烟，黑云"
 PODask_pope.5.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n令人担忧的是，当新教宗被告知暗影裁判所的存在时，他感到非常震惊。教皇指责这是一个肮脏的秘密，他想在他的任期内摆脱这个秘密，他已经正式撤回了教会的所有支持。这是一个可怕的情况，但可能有一个解决方案：一些枢机主教仍然支持你的事业，如果你提供适当的支持，他们仍然可以保持你和教会之间的沟通渠道。"
 PODask_pope.5.a: "圣下万岁……"
 PODask_pope.5.b: "我们知道的更清楚。"
 PODask_pope.6.t: "白烟，浮影"
 PODask_pope.6.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗是一个有灵性倾向的人，对你们的组织等世俗事务不怎么关心。似乎枢机主教在他的任期内会有更大的重要性，这对你来说是一个令人担忧的消息，因为他们经常是超自然影响的目标。你可以尝试对他们展开全面调查，但这势必会引起一些人的不满。"
 PODask_pope.6.a: "让我们只针对真正的腐败者。"
 PODask_pope.6.b: "异端将被清除！"
 PODask_pope.6.effect.success.desc: "成功的调查！"
 PODask_pope.6.critical.failure.effect.desc: "处处受阻……"
 PODask_pope.7.t: "白烟，白影"
 PODask_pope.7.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n为了帮助暗影裁判所，新教宗正在计划对其他信仰和他们自己的猎人组织进行外交宣传。显然，你被期望加入，并帮助消除他们与天主教会之间过去的误解，以使这一过程顺利进行。圣下有提供帮助的倾向，所以你也可以说服他，这将是一个徒劳的努力，而把资金转到其他地方。"
 PODask_pope.7.a: "一个绝妙的想法，圣下。"
 PODask_pope.7.b: "那些异端不能被信任。"
 PODask_pope.7.effect.success.desc: "成功的谈判！"
 PODask_pope.7.critical.failure.effect.desc: "成功，但有代价。"
 PODask_pope.8.t: "白烟，金风"
 PODask_pope.8.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n虽然没有彻底敌视暗影子裁判所，但新教宗确信你们夸大了实际威胁。因此，他下令大量削减提供给你们的资金，这些资金帮助你们建立了大部分的实地工作。你将不得不审查你现有的所有进程，如果你想继续保持现在的状态，可能会做出一些艰难的削减。"
 PODask_pope.8.a: "是时候整顿了。"
 PODask_pope.8.b: "是时候削减开支了。"
 PODask_pope.8.effect.success.desc: "成功的整顿！"
 PODask_pope.8.critical.failure.effect.desc: "这让事情变得更糟了……"
 inquisition_disorganized_levies_modifier: "跃跃欲试又缺乏经验"
 inquisition_disorganized_levies_modifier_desc: "许多新兵正在加入这场美好的战斗。然而，他们的数量之多和完全没有经验造成了问题。"
 PODask_pope.9.t: "白烟，血风"
 PODask_pope.9.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗渴望帮助暗影裁判所，因此发出号召，让所有有能力的人加入你们的队伍，而不先通知你。这当然是出于好意，但这种姿态在你们的队伍中造成了相当大的混乱，因为这些新招募的人与你们期望的裁判所斗士的标准相差甚远。这将需要一些努力来解决。"
 PODask_pope.9.a: "是时候整顿了。"
 PODask_pope.9.b: "接纳所有人，以后再处理。"
 PODask_pope.10.t: "白烟，白风"
 PODask_pope.10.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗并不排斥暗影裁判所，但他对以他的名义进行的一些行动的道德性感到担忧。作为一个精明的神学家，他要求与你交谈，以帮助你们两个人评估这些结果是否真的值得付出威胁灵魂的代价。你显然相信答案是肯定的，但让圣下同意这一点可能比较困难。"
 PODask_pope.10.a: "辩论时间到。"
 PODask_pope.10.b: "圣下是对的，显而依然。"
 PODask_pope.10.effect.success.desc: "圣下同意！"
 PODask_pope.10.critical.failure.effect.desc: "我完了？"
 PODask_pope.11.t: "白烟，白雾"
 PODask_pope.11.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗并不争论暗影裁判所的重要性，而是担心它可能给他带来的公众形象影响。毕竟，你们的组织不在直接监督之下，随时都有可能走火入魔。由于对教会的影响将是可怕的，圣下要求你切断与他的大部分联系。这将意味着暗影裁判所将更加退居幕后，这可能是一把双刃剑。"
 PODask_pope.11.a: "圣下已经发话。"
 PODask_pope.11.b: "我们需要那些教会牵绊！"
 PODask_pope.12.t: "白烟，多云"
 PODask_pope.12.desc: "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n值得庆幸的是，新教宗支持暗影裁判所，尽管他似乎特别喜欢你的修会。接受他试图授予的众多头衔和其他表扬，肯定会对你的人产生良好的影响，但对你本人来说就不是那么回事了。"
 PODask_pope.12.a: "圣下过赞了。"
 PODask_pope.12.b: "这是团队的努力。"
 PODask_pope.30.t: "教宗使节 "
 PODask_pope.30.desc.exco: "这注定发生。\n尽管你尽了最大的努力来隐藏它，但新教皇派来评估你的命令的教皇使节很快就听到了关于你明显非神圣的力量和韧性的谣言。他阻止了你试图“说服”他的尝试，并在到达后迅速逃离了你的营地。\n罗马的信很快就来了，这并不奇怪。你被逐出教会，你和你的组织被教会剥夺了任何形式的支持。虽然你可以自由地继续做你曾经做过的事情（因为罗马似乎并不打算追捕你，至少现在是这样），但你的存在突然变得更加复杂。"
 PODask_pope.30.desc.witch: "这注定发生。\n尽管你尽了最大的努力来隐藏它，但新教皇派来评估你的命令的教皇使节很快就听到了关于你明显非神圣的力量和韧性的谣言。就算往轻里说，你用来说服他的，说自己是为了基督教世界的利益而使用这些力量的谈话也是气氛紧张的。很明显，在那次事件之后，你在教会的信任大大减少了。尽管如此，你还是设法避免了更严重的威胁，比如被逐出教会，这意味着你可以像往常一样继续工作……在罗马更严格的审查之下。"
 PODask_pope.30.desc: "新任教皇派来评估您的圣职组织的教皇使者最近已经离开。从各方面考虑，这是一次愉快的访问。特使重申了圣座将尽可能多地帮助暗影裁判所的承诺。至少目前看来，教廷将全力支持你的努力。一个美好的前景。"
 PODask_pope.30.a: "我并不需要教会也能拯救基督世界。"
 inquisition_excommunicated_tt: "这个教皇禁令意味着你失去了[curia_support|E]和与大多数暗影裁判所武装人员的联系。如果你的角色在下一次教皇选举后没有被逐出教会（例如，因为你让你的继承人接管），你可以在选举后重新获得[curia_support|E]。"
 PODask_pope.30.b: "我的力量并非来自魔鬼……大概。"
 PODask_pope.40.desc: "带着新教皇的消息抵达的教皇使节对你们组织的细节并不感兴趣。根据罗马的新协议，他只是迅速检查了有没有明显的异端行为就离开了。看来在这位教皇统治期间，你几乎不会受到教廷的监督。"
 PODask_pope.50.desc: "新教皇派来“审查”你的组织的教皇使节几乎公开表示敌意，认为所有这些“暗影裁判所的胡说八道”完全是浪费时间和资源。他在批评每一件小事，给你的印象是，如果自己可以的话，他会直接切断你的组织与罗马的联系。\n无论如何，他显然是激怒你，希望你会公开犯错，让他能够向梵蒂冈提交一份更严厉的报告。"
 PODask_pope.50.a: "给他点厉害尝尝！"
 PODask_pope.50.b: "咬紧牙关。"
 PODask_pope.60.desc: "罗马派来检查你组织的教皇使节是一个狡猾的人，引起了你的怀疑。既然新教皇在宗教上仍头脑清醒，那么令人悲伤的是，一个被地狱之子控制的红衣主教很可能正在操纵这个使节，他很可能会提交一份谴责性的报告，以削减你急需的支持。\n直接对付这个人是不明智的，因为他毕竟还是梵蒂冈的使节，但你可以绕过他。你写了一封信，详细说明了你对圣下的神圣使命在宗教上的重要性，希望他能忽略毫无疑问即将摆在他桌子上的妥协报告。"
 PODask_pope.60.a: "我们为人类的灵魂而战。"
 PODask_pope.60.effect.success.desc: "你被听到了。"
 PODask_pope.60.critical.failure.effect.desc: "充耳不闻……"
 PODask_pope.70.desc: "新教皇与其他信仰的一些外联活动已经取得了成效。你惊讶地看到教皇特使带着一群东正教猎人来到你的营地。虽然你的人民对这些分裂者有一些怀疑，但你很快就谴责了他们。这些同僚是来自远方的基督战士，他们应该作为贵宾受到欢迎，而不是别的。由于你的努力，边防军迅速在离你不远的地方建立了自己的营地，并承诺他们的剑将会为你的事业而战，这令教皇使节很满意。"
 PODask_pope.70.a: "一场热烈的欢迎"
 PODask_pope.80.desc: "派来监督您组织的“重组”的教皇特使很高兴看到您至少在削减成本方面做出了一些努力。他向你保证，罗马不打算取消对你的组织的支持，但主要担心最近的一些财政问题。他顺便告诉你，如果你还有一些多余的资金，为当前的事业提供适当的捐款肯定会使教廷更加重视你的神圣使命。"
 PODask_pope.80.a: "一次“捐款”，我明白了……"
 PODask_pope.80.b: "我们的财务捉襟见肘。"
 PODask_pope.90.desc: "教皇派来的新兵和教皇特使一同抵达，他渴望看到你把这些未经训练的年轻人变成合适的裁判官。如你所知，这将需要大量时间、努力，并对你的组织造成相当大的损失，因为罗马显然误判了整个过程需要多长时间。然而，从特使的热切程度来看，如果不至少做出些努力的话，这将对你的组织产生相当不利的影响。"
 PODask_pope.90.a: "也许我应该让他们加快训练？"
 PODask_pope.90.b: "我们需要质量而非数量。"
 PODask_pope.100.desc: "新教皇派来审查您的组织的教皇特使一直友好地出现在您的营地。除了寻找明显的异端行为迹象外，他更关心的是与像你这样“活跃在第一线”的人讨论神学的细节。虽然你还远没有得到所有的答案（你对杀死地狱生物的了解比理解它们的更多），但这至少是一次愉快而无关紧要的访问。"
 PODask_pope.100.a: "他们相信圣经中的该隐是他们的祖先。"
 PODask_pope.110.desc: "新任教皇派遣的教皇特使不幸证实了梵蒂冈的新政策。由于圣座希望避免丑闻的可能性，未来几年对你组织的支持可能会减少。尽管如此，你还是有一些意外之喜，许多红衣主教希望以非官方身份帮助你。你向你的人民保证，这将是一个挫折，但远非结束。"
 PODask_pope.110.a: "我们将会忍耐。"
 PODask_pope.120.desc: "新教皇对你的组织的支持立场已经产生了回报。教皇陛下派来的教皇特使很快提议与教廷建立更紧密的关系，专门针对你的组织。虽然这有明显的优势，但这种偏袒已经给你与其他质疑你的性格以及你得做些什么来获得这些好处的检察官的关系带来了压力。拒绝他们将是对盟友的善意表示。"
 PODask_pope.120.a: "我们理应享有这种特权关系。"
 PODask_pope.120.b: "我们拥有的支持已经足够了"
 POD_curia_support_decision: "[curia_support|E]"
 POD_curia_support_decision_tooltip: "用你的政治资本，可请求梵蒂冈施予恩典或要求其采取行动。"
 POD_curia_support_decision_desc: "#X 你当前的[curia_support|E]为[ROOT.ScriptValue('curia_support')|0]#!\n\n你通过行动获得的政治资本可用于在各类事务中争取罗马教廷的支持。通过以无地身份赢得战争，你可以获得更多[curia_support|E]。"
 POD_curia_support_decision.tt: "你将使用你的[curia_support|E]来请求各种资源，或请求教廷策划对特定区域的入侵"
 POD_curia_support_decision_confirm: "呈递圣座书"
 PODask_pope.1000.desc: "你对罗马教廷的影响力可以用来获得各种好处。无论教皇对你的事业是否友好，总有至少一些红衣主教理解你的斗争的正义性，并能够提供一些支持。\n有了足够的支持，你甚至可以推动梵蒂冈赞助一支庞大的军队，对特定地区的地狱之子进行十字军东征，从长远来看有希望清除它。\n\n#X 你现有的[curia_support|E]是[ROOT.ScriptValue('curia_support')|0]。#!"
 pod_curia_renown_tooltip: "#weak $POD_curia_support_decision.tt$#!"
 pod_curia_piety_tooltip: "#weak $POD_curia_support_decision.tt$#!"
 pod_curia_gold_tooltip: "#weak $POD_curia_support_decision.tt$#!"
 pod_curia_crusade_tooltip: "#weak $POD_curia_support_decision.tt$#!"
 PODask_pope.1000.a: "我的修会需要获得认可"
 PODask_pope.1000.b: "我不会为世俗之需动用影响力"
 PODask_pope.1000.c: "我需要物资支援"
 PODask_pope.1000.d: "是时候发动一场暗影十字军了！"
 PODask_pope.1000.d.tt: "请求暗影十字军东征将花费您100[curia_support|E]。如果您有能力发动，选择此选项将显示各种潜在区域。你仍然可以改变主意，不选择区域。"
 gregory_intro_jeanne_tt: "由于你没有得到教会的正式赞助，你不会从中受益。然而，一些红衣主教仍然看好你的努力，因此情况可能会随着下一任教皇而改变。"
 PODask_pope.1001.t: "暗影十字军东征：中心"
 PODask_pope.1001.desc: "西欧一直是天主教权力的中心。这是教会最强大的地方，也最容易被说服花费资源来应对威胁。只有当这片核心基督教土地得到保障时，圣座才会考虑将更多的异常领土视为有效的目标。\n#X 每个区域只能选择一次。一旦这些区域中的每一个都成为阴影十字军的目标，就会提供新的选择。#!"
 PODask_pope.1001.a: "意大利"
 PODask_pope.1001.b: "不列颠尼亚"
 PODask_pope.1001.c: "德国"
 PODask_pope.1001.d: "法兰西"
 curia_sponsored_crusade_tt: "一个新的裁判官很快就会篡夺这个地区的一个伯爵领。他们将以一支庞大的军队和一个有侵略性的性格开始（或多或少取决于你的裁判所游戏规则选择）。"
 PODask_pope.1001.e: "伊比利亚"
 PODask_pope.1000.d.tt2: "暗影十字军东征已经没有有效的目标了。"
 PODask_pope.1002.t: "暗影十字军东征：前沿"
 PODask_pope.1002.desc: "天主教会的影响范围很广。由于十字军东征或与东正教猎人的相对友好的协约，暗影裁判所可以选定远离罗马的领土。若能清除这些超自然现象，基督教世界将真正得救。\n#X 你一次只能选择一个地区。#!"
 PODask_pope.1002.a: "斯堪的纳维亚 "
 PODask_pope.1002.b: "圣地"
 PODask_pope.1002.c: "波兰"
 PODask_pope.1002.d: "巴尔干半岛"
 PODask_pope.1002.e: "拜占庭"
 curiasuppport_needtwenty_tt: "你需要20点或更多的[curia_support|E]才能使用此选项"
 curiasuppport_needhundred_tt: "你需要100点或更多的[curia_support|E]才能使用此选项"
 POD_landless_inquisitor_war_curia_tt: "你会把征服的领土交给你选择的角色。\n#P;bold 你将会保持无地。#!\n大裁判官将为您提供各种奖励来选择。"
 POD_war.2.t: "罗马祝贺"
 POD_war.2.desc: "裁判官已听闻您最近的胜利，并致以最诚挚的问候。然而阁下深知，仅凭言辞无法战胜大敌，因此他承诺将竭尽所能支持您的修会，以延续您英勇的事业。至于是否向罗马提出请求，以及请求什么，皆由您定夺。"
 POD_war.2.a: "我们需要获得更多来自圣座的认可。"
 POD_war.2.b: "物资支援永远受欢迎。"
 POD_war.2.c: "无需他物。愿荣耀归于主！"
 PODask_pope.1003.desc: "珍妮夫人，尽管你明显热衷于为教会而战，但罗马已经拒绝了你新创建的神圣修会。虽然他们没有将你逐出教会，但你暂时不会正式成为暗影裁判所的一部分。\n然而，仍有希望，宗教裁判所的非正式协调员利奥波德·冯·穆尔瑙对你的努力印象深刻。他让你与圣赫勒拿骑士团保持联系，这是一个在十字军东征期间创建的女子骑士团，也正被教会边缘化。\n在与他们的祖母佩妮会面并说服她相信你对抗真正（超自然）敌人的任务的重要性后，她愿意加入你的新生修会。有这些具有军事天赋的女性在你身边将是一个巨大的福音，但你担心罗马在看到两个不正确的组织在没有教皇祝福的情况下联合起来可能会更愤怒。"
 PODask_pope.1003.a: "神圣使命比罗马更重要。"
 PODask_pope.1003.b: "……但我们仍需要他们的支持。"