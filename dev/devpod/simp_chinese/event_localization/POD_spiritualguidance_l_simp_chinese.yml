l_simp_chinese:
 POD_spiritual_guidance.001.t: "精神指导"
 POD_spiritual_guidance.001.desc: "[student.GetFirstName]过着罪孽深重的生活。你觉得你可以帮助[student.GetHerHim]，但[student.GetSheHe]会听吗？赎罪、赦罪的道路毕竟是一个漫长而艰辛的过程，并不适合所有人。"
 POD_spiritual_guidance.001.option.a: "我会帮助[student.GetHerHim]"
 POD_spiritual_guidance.001.option.a.tt: "你试图帮助[student.GetFirstName]"
 POD_spiritual_guidance.001.option.b: "我没感到它"
 POD_spiritual_guidance.001.option.b.tt: "你放弃了帮助[student.GetFirstName]的尝试"
 POD_spiritual_guidance.002.t: "试图帮助"
 POD_spiritual_guidance.002.desc: "[teacher.GetFirstName]走近你，提出要帮助你成为更好的神的仆人。你的回答会是什么？你可能在最终成为一个更好的人，或者只是在等待宝贵的时间，很难说。"
 POD_spiritual_guidance.002.option.a: "我欣然接受[teacher.GetHerHis]的提议"
 POD_spiritual_guidance.002.option.a.tt: "一堂课开始了"
 POD_spiritual_guidance.002.option.b: "我并不觉得这是我想要的走向"
 POD_spiritual_guidance.002.option.b.tt: "你拒绝"
 POD_spiritual_guidance.102.t: "抗拒"
 POD_spiritual_guidance.102.desc: "[student.GetFirstName]不想要你“帮助”[student.GetHerHim]。看起来对他来说，救赎之路过于漫长了。天主将是灵魂在末途的唯一审判。"
 POD_spiritual_guidance.102.option.a: "真遗憾……"
 POD_spiritual_guidance.102.option.a.tt: "[student.GetFirstName]拒绝你的提议"
 POD_spiritual_guidance.202.t: "精神指导（二）"
 POD_spiritual_guidance.202.desc: "真正忠于职守的人，不应做出罪恶的行为。[student.GetFirstName]还未准备好全心全意地侍奉天主。而你神圣的使命就是帮助[student.GetHerHim]更好地去理解。你会成为他现在所需要的良师吗？"
 POD_spiritual_guidance.202.option.a: "你的色欲不能蒙蔽你的心智"
 POD_spiritual_guidance.202.option.a.tt: "你将尝试改掉[student.GetHerHis]的色欲"
 POD_spiritual_guidance.202.option.a.desc: "信仰考验"
 POD_spiritual_guidance.202.option.a.failure.tt: "你未能帮助到[student.GetFirstName]"
 POD_spiritual_guidance.202.option.b: "愤怒控制不了你"
 POD_spiritual_guidance.202.option.b.tt: "你将尝试改掉[student.GetHerHis]的怒气"
 POD_spiritual_guidance.202.option.b.failure.tt: "你没能帮到[student.GetFirstName]"
 POD_spiritual_guidance.202.option.c: "你也不是那么的厉害"
 POD_spiritual_guidance.202.option.c.tt: "你将尝试改掉[student.GetHerHis]的傲慢"
 POD_spiritual_guidance.202.option.c.failure.tt: "你未能帮助到[student.GetFirstName]"
 POD_spiritual_guidance.202.option.d: "你休息得太多了"
 POD_spiritual_guidance.202.option.d.tt: "你将尝试改掉[student.GetHerHis]的懒惰"
 POD_spiritual_guidance.202.option.d.failure.tt: "你未能帮助到[student.GetFirstName]"
 POD_spiritual_guidance.202.option.e: "你吃太多了"
 POD_spiritual_guidance.202.option.e.tt: "你将尝试改掉[student.GetHerHis]的不良饮食习惯"
 POD_spiritual_guidance.202.option.e.failure.tt: "你未能帮助到[student.GetFirstName]"
 POD_spiritual_guidance.202.option.f: "贪婪是不好的"
 POD_spiritual_guidance.202.option.f.tt: "你将尝试改掉[student.GetHerHis]的贪婪"
 POD_spiritual_guidance.202.option.f.failure.tt: "你未能帮助到[student.GetFirstName]"
 POD_spiritual_guidance.202.option.g: "你的心长满着尖刺"
 POD_spiritual_guidance.202.option.g.tt: "你将尝试改掉[student.GetHerHis]的小心眼"
 POD_spiritual_guidance.202.option.g.failure.tt: "你未能帮助到[student.GetFirstName]"
 POD_spiritual_guidance.302.t: "精神指导（三）"
 POD_spiritual_guidance.302.desc: "你设法去除了[student.GetHerHis]的罪恶。但你还没有完成，现在是时候向[student.GetFirstName]展示高尚的生活方式了。也许通过例子？只是要注意不要让自己陷入傲慢原罪。"
 POD_spiritual_guidance.302.option.a: "心胜于物"
 POD_spiritual_guidance.302.option.a.tt: "[student.GetFirstName]变得贞洁"
 POD_spiritual_guidance.302.option.b: "你应该知道什么时候该适可而止"
 POD_spiritual_guidance.302.option.b.tt: "[student.GetFirstName]变得温和"
 POD_spiritual_guidance.302.option.c: "分享即是关怀"
 POD_spiritual_guidance.302.option.c.tt: "[student.GetFirstName]变得慷慨"
 POD_spiritual_guidance.302.option.d: "你应该容忍他人"
 POD_spiritual_guidance.302.option.d.tt: "[student.GetFirstName]变得宽宏大量"
 POD_spiritual_guidance.302.option.e: "无论在什么情况下，你都要冷静"
 POD_spiritual_guidance.302.option.e.tt: "[student.GetFirstName]变得冷静"
 POD_spiritual_guidance.302.option.f: "你不比别人好多少"
 POD_spiritual_guidance.302.option.f.tt: "[student.GetFirstName]变得谦卑"
 POD_spiritual_guidance.302.option.g: "你将休于天堂"
 POD_spiritual_guidance.302.option.g.tt: "[student.GetFirstName]变得勤奋"
 POD_spiritual_guidance.402.t: "失败的精神指导"
 POD_spiritual_guidance.402.desc: "[teacher.GetFirstName]让你失望了！在所有这些讲道之后……有些人的灵魂注定不会被拯救。"
 POD_spiritual_guidance.402.option.a: "失望至极"
 POD_spiritual_guidance.402.option.a.tt: "精神指导失败了"
 POD_spiritual_guidance.502.t: "成功的精神指导"
 POD_spiritual_guidance.502.desc: "[teacher.GetFirstName]成功地给你指明了正确的道路。你罪孽深重的日子快结束了，现在你要靠自己的力量变得更好。"
 POD_spiritual_guidance.502.option.a: "[teacher.GetSheHe]的方法真的成功了！"
 POD_spiritual_guidance.502.option.a.tt: "你现在是一个更好的人"