 quincunx_edict_tax_modifier: "暮光战争被推广"
 quincunx_edict_army_modifier: "午夜战争被推广"
 quincunx_edict_tax_modifier_desc: "暮光战争是[GetTrait('kueijin').GetName( GetNullCharacter )]之间进行暗战的一种更温和的方式，也许也是更有趣的方式。在许多方面，它更像一场决斗而非战争。交战双方按照既定的行为规则进行战斗，并由中立方仲裁争端。其目的不是摧毁对手的领地，而是以尽可能多的策略和技巧实现指定目标——例如刺杀一位重要的军阀，或迫使一位受人欢迎的政治领袖退位。"
 quincunx_edict_army_modifier_desc: "午夜战争是[GetTrait('kueijin').GetName( GetNullCharacter )]之间进行暗战的一种更残酷的方式——在这种复仇中，每一方都会使出浑身解数来消灭对方，绝不留情。午夜战争必须当着一位高级老祖的面公开宣告；而一旦宣告，除了通过某些仪式外，没有任何体面的方式可以结束它。"