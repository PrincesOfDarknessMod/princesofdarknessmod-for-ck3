 POD_inquihunt_interaction_desc:0 "Vous allez essayer d’apprendre l’emplacement exact de ce démon. Puis la chasse sera ouverte. Évidemment, cela comporte de graves risques..."
 I_CAN_ONLY_PLOT_ONE_INQUIHUNT_AT_A_TIME_TRIGGER:0 "Une seule chasse peut être planifiée à la fois"
 scheme_interaction_tt_inquihunt_approved:0 "Vous allez essayer d’apprendre l’emplacement exact de ce démon. Puis la chasse sera ouverte. Évidemment, cela comporte de graves risques..." 
 inquihunt:0 "Complot de recherche de repaire"
