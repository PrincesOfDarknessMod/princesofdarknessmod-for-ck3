 inquihunt_interaction:0 "Trouver le repaire #weak (Scheme)#!"
 inquihunt_desc:0 "Je détruirai [SCHEME.GetTarget.GetShortUINameNoTooltip] et je purgerai leur impureté de cette terre"
 inquihunt_desc_general:0 "Essayez de localiser le démon avant de lancer une attaque"
 INQUIHUNT_SUCCESS_DESC:0 "Vous lancerez l’attaque finale sur [TARGET_CHARACTER.GetShortUIName]"
 INQUIHUNT_DISCOVERY_DESC:0 "@warning_icon! Vous êtes accusé de [crime|E] de chasse aux sorcières"
