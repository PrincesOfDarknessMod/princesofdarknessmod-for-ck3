 inquihunt_my_rival:1 "Your Victim: $VALUE|=+0$"
 POD_inquihunt.667.t:0 "A perdu sa trace"
 POD_inquihunt.667.desc:0 "Votre proie a réussi à échapper à vos tentatives persistantes de la traquer. Probablement aidés par d’autres agents du diable, ils ont rampé du trou d’où ils venaient, se cachant de vous. Dieu est patient cependant, et vous aussi. Ils n’éviteront pas le pieu pour toujours."
 POD_inquihunt.667.option.a:0 "Il semble que j’étais attendu"
 POD_inquihunt.1.t:0 "En chasse"
 POD_inquihunt.1.desc:0 "Vous avez finalement traqué le démon jusqu’à son repaire. Il ne peut y avoir aucune erreur car les pauvres gens des environs ont clairement perdu l’amour de Dieu. Ils sont paranoïaques, sans âme, effrayés de sortir la nuit et même l’Église est stérile.\nVous et votre petit entourage êtes clairement le seul espoir de cet endroit. Alors que vous installez votre camp, il est temps de réfléchir à votre prochaine manoeuvre. Le Seigneur vous a certainement guidé vers ce repaire du mal, mais comment le détruire est laissé à votre appréciation..."
 POD_inquihunt.1.option.a:0 "Les petits gens ne sont pas encore perdus dans les ténèbres. Prêchons."
 POD_inquihunt.1.option.aa.effect.success.desc:0 "Un succès critique assurera une victoire rapide pour votre cause"  
 POD_inquihunt.1.option.ab.effect.success.desc:0 "Une égalité... le démon causera toujours des problèmes"      
 POD_inquihunt.1.option.ac.effect.success.desc:0 "Ne fais pas d’erreur, ou l’ennemi te tuera vite"      
 POD_inquihunt.1.option.f:0 "J’ai un mauvais pressentiment"       
 POD_inquihunt.1.option.f.custom:0 "Ce n’est pas le lieu ou l’heure, vous reviendrez une autre fois"       
 POD_inquihunt.1.option.b:0 "Soldats de Dieu ! Nous attaquons ce château aujourd’hui !"
 POD_inquihunt.1.option.c:0 "Détruisons ses biens et isolons d’abord le démon"
 POD_inquihunt.1.option.d:0 "Ils craignent la lumière de Dieu. Agissons pendant la journée"
 POD_inquihunt.1.option.e:0 "J’ai peut-être quelque chose sur ce démon dans mes livres..."
 POD_inquihunt.1.option.g:0 "Je te tuerai moi-même, démon !"
 POD_inquihunt.2.t:0 "Un feu de joie satisfaisant"
 POD_inquihunt.2.desc:0 "C’était plus facile que vous pensiez de ramener ces pauvres âmes dans la lumière de Dieu. Ils étaient impatients d’écouter et d’apprendre, après tant d’années perdues dans l’obscurité.\nUne fois que cela a été fait, il était encore plus facile de s’allier avec eux et d’utiliser tout ce qu’ils savaient sur le démon qui rôdait la nuit. C’est donc avec toute la ville que vous avez pris d’assaut son repaire, le retenant facilement par le nombre et l’aide de Dieu.\nEt avec tout cela dit et fait, vous êtes maintenant en train de regarder le démon brûler sur le bûcher avec toute la ville acclamant Dieu et votre nom."
 POD_inquihunt.2.option.a:0 "Une telle vue réchauffe mon cœur"
 POD_inquihunt.3.t:0 "Fils contre pères"
 POD_inquihunt.3.desc:0 "Le démon a ses griffes dans ce village. Votre prédication a rassemblé un grand nombre de disciples mais aussi un petit nombre de rebelles, qui s’oppose maintenant à votre procession sainte à l’entrée de la tanière du démon.\nClairement, ils ont été corrompus par le diable, mais vous n’avez pas le temps de sauver leurs âmes, comme le vampire s’échappera certainement une fois qu’il entend de l’agitation à l’extérieur. Il y a cependant une autre option, plus rapide à coup sûr, mais aussi moralement douteuse..."
 POD_inquihunt.3.option.a:0 "Tuez-les tous et laissez Dieu les trier"
 POD_inquihunt.3.option.b:0 "Aucun innocent ne sera blessé, même des innocents égarés"
 POD_inquihunt.4.t:0 "Ironie brulante"
 POD_inquihunt.4.desc:0 "Vous avez sévèrement sous-estimé l’attrait que ce démon avait sur ce village. Votre prédication a été accueillie avec scepticisme, ou même colère pure et simple. Il était trop tard quand vous avez compris la vérité : ils étaient tous sous l’emprise du vampire depuis le début.\nVotre entourage a été tué pendant leur sommeil, et vous avez été sans cérémonie emporté sur le bûcher que vous destiniez au démon. Alors que les flammes commencent à vous engloutir, vous vous souvenez que Dieu est miséricorde. Et ainsi, qu’Il ait pitié de votre échec, et des âmes de ces innocents égarés."
 POD_inquihunt.4.option.a:0 "Amen"
 POD_inquihunt.5.t:0 "Un plan parfait"
 POD_inquihunt.5.desc:0 "L’orgueil est un péché, mais vous devez l’admettre : c’était un assaut sans faille, et habilement exécuté par les braves chevaliers de Dieu sous votre commandement. Malgré les nombreuseux esclaves défendant la zone, et encore plus de pièges, vous avez réussi à prendre d’assaut l’endroit avec peu de pertes à la fin.\nVous avez attaqué en plein jour, et vous devez rendre hommage à la lumière de Dieu pour avoir gardé le démon endormi pendant la bataille. Après avoir pris le château, c’était un moment anticlimatique, mais toujours satisfaisant, quand vous avez décapité le vampire endormi. La victoire est à vous une fois de plus."
 POD_inquihunt.5.option.a:0 "J’adore quand un plan se réalise."
 POD_inquihunt.6.t:0 "Victoire à la Pyhrrus"
 POD_inquihunt.6.desc:0 "Comme la bataille fait encore rage à l’intérieur du château, vous savez que la victoire est à votre portée. Mais le coût en vaut-il la peine? Ses défenseurs ont été préparés, et de nombreux pièges ont déjà coûté la vie de bons soldats de Dieu. Est-ce qu’un seul démon mort est suffisant pour ces pauvres âmes ?\nIl n’est pas trop tard, et vous pouvez encore annuler l’attaque pour aujourd’hui, mais le vampire utilisera évidemment la couverture de la nuit pour s’échapper. Ou vous continuez, et portez toujours le fardeau des hommes de bien perdus pour une bonne cause."
 POD_inquihunt.6.option.a:0 "Dieu les accueillera dans son royaume"
 POD_inquihunt.6.option.b:0 "Cela n'en vaut pas la peine"
 POD_inquihunt.7.t:0 "L'ultime bataille"
 POD_inquihunt.7.desc:0 "Cela a terriblement mal tourné. Le château a été préparé, et on ne pouvait même pas franchir les murs. Pire, les renforts venaient d’une ville voisine, apparemment aussi sous le contrôle du Seigneur Noir du château. Le démon lui-même est si proche, mais pourtant si loin.\nIl n’y a plus d’échappatoire pour vous et vos braves chevaliers et il semble que Dieu vous rappellera à Son royaume aujourd’hui. Vous espérez être digne de sa miséricorde mais avant cela... vous abattrez autant de ces démons que vous le pouvez."
 POD_inquihunt.7.option.a:0 "C’est un bon jour pour mourir"
 POD_inquihunt.8.t:0 "Biens incendiés"
 POD_inquihunt.8.desc:0 "Votre coup était méthodique. Vous avez ciblé toutes les guildes, milices ou groupes cultes dans lesquels le démon avait ses griffes. Vous avez utilisé deux armes puissantes : l’appât de l’or pour les cupides, et la peur de l’Église pour les corrompus.\nPour en arriver là, votre campagne a isolé le vampire, séparé ses alliés et dispersé ses esclaves. Vous regardez maintenant le dernier refuge du démon brûler devant vos yeux, les cris de la créature à l’intérieur comme de la musique à vos oreilles."
 POD_inquihunt.8.option.a:0 "Vous êtes viré"
 POD_inquihunt.9.t:0 "Une vie mercenaire pour moi"
 POD_inquihunt.9.desc:0 "Cette méchante créature avait plus d’attrait que vous ne le pensiez. Vous avez été stoïque cependant, et vous êtes maintenant à peu près sûr que la plupart de ses actifs ont été détruits par vos actions.\nMais le vampire ne tombera pas facilement, semble-t-il, car une puissante bande de mercenaires marche maintenant sur votre position, apparemment employé par votre ennemi pour vous éliminer. Vous avez le choix : les mercenaires adorent l’or, et vous pourriez les retourner contre leur employeur avant qu’il ne puisse fuir. Ou vous pouvez réduire vos pertes et accepter une égalité pour cette fois."
 POD_inquihunt.9.option.a:0 "J’offre l’or et le salut aux hommes pieux comme vous"
 POD_inquihunt.9.option.b:0 "J’attraperai ce diable la prochaine fois"
 POD_inquihunt.10.t:0 "Changement de direction"
 POD_inquihunt.10.desc:0 "Vous avez mal calculé. Vos actions ont été contrecarrées à chaque étape. Ce vampire vient d’avoir plus d’or, plus d’agents et plus d’influence sur cette communauté que vous n’auriez jamais pu prévoir.\nEt maintenant, tout s’écroule, littéralement, après que votre dernière erreur ait révélé votre position au démon. Un groupe de 'mercenaires' endurcis n’a pas tardé à apparaître et avec seulement vos fidèles chevaliers pour vous protéger, il n’a pas fallu longtemps avant que vous soyez assiégés dans votre propre base. Alors que les derniers sons de la bataille meurent dehors, vous entendez maintenant les sons des torches jetées par la fenêtre. Heureusement, vous avez le temps pour un dernier Pater Noster."
 POD_inquihunt.10.option.a:0 "Pater noster qui es in caelis..."
 POD_inquihunt.11.t:0 "L'ennemi de mon ennemi..."
 POD_inquihunt.11.desc:0 "Les vampires sont hostiles les uns aux autres. Et vous êtes devenu un expert pour utiliser ce fait à votre avantage.\nEn donnant quelques indices sur ce repaire particulier à un nid de démons voisins connus, vous vous êtes assis et avez regardé votre cible ce faire agressée pendant la nuit par des voyous embauchés par son rival. Il a gagné, mais a été suffisamment affaibli pour que vos Chevaliers puissent facilement le maîtriser. Vous lui avez rapidement trouvé une nouvelle maison dans votre chambre de torture personnelle. Vous avez ensuite passé des jours très perspicaces avec lui jusqu’à ce que vous le laissiez se vider de son sang jusqu’à la mort véritable. La volonté de Dieu est faite."
 POD_inquihunt.11.option.a:0 "Les cris qu’ils font en présence d’une Sainte Relique étaient assez intéressants..."
 POD_inquihunt.12.t:0 "Croix et poignard"
 POD_inquihunt.12.desc:0 "Vous êtes impressionné par l’astuce de ce démon. La plupart de vos cibles précédentes sont tombées assez facilement une fois que vous avez tourné votre toile d’intrigue autour d’eux mais celui-ci... celui-ci a riposté. Dur.\nVotre propre réseau est attaqué, avec des rumeurs vicieuses vous ciblant en particulier. Vous savez que vous pouvez avec cette guerre de l’ombre, mais il vous en coûtera beaucoup pour réparer les dommages causés par votre ennemi. Pousser juste un peu plus vous donnerais la joie d’amener ce vampire à votre meilleure chambre de torture bien que..."
 POD_inquihunt.12.option.a:0 "La réputation n’est pas tout"
 POD_inquihunt.12.option.b:0 "Ce diable n’en vaut pas la peine"
 POD_inquihunt.13.t:0 "Trouver mieux que vous"
 POD_inquihunt.13.desc:0 "Vous n’aviez aucune chance. Chacun de vos gestes était anticipé, chaque geste que vous faisiez était facilement contré. Vous n’étiez qu’un enfant jouant aux échecs sans connaître les règles. Ce vampire a probablement inventé le jeu.\nMême lorsque vous compreniez le danger dans lequel vous étiez, il était beaucoup trop tard. Et donc, vous êtes maintenant torturé tous les soirs par celui que vous avez follement voulu détruire. Et même dans ce domaine particulier, il en sait beaucoup plus que vous..."
 POD_inquihunt.13.option.a:0 "La nuit est sombre et pleine de terreurs"
 POD_inquihunt.14.t:0 "Connais ton ennemi"
 POD_inquihunt.14.desc:0 "Vous étiez très heureux de voir que vous aviez quelques vieilles mentions du démon particulier que vous avez traqué dans vos livres. Vous étiez encore plus heureux d’apprendre son attachement particulier à une famille mortelle encore vivante. Comme si ces créatures pouvaient encore ressentir des émotions mortelles ! /nEt bien, peu importe, c’était une information assez facile à exploiter. En utilisant ces mortels comme appât, vous avez réussi à attirer le vampire dans un piège soigneusement planifié dans un sol sacré. Ce démon s’est transformé instantanément en cendres en entrant dans la zone, une observation que vous avez rapidement consignée dans votre journal."
 POD_inquihunt.14.option.a:0 "Ça pourrait être utile pour le prochain"
 POD_inquihunt.15.t:0 "Un livre trop loin"
 POD_inquihunt.15.desc:0 "Ce démon est insaisissable. Il a déjà évité deux de vos pièges soigneusement planifiés, et vous commencez à perdre du terrain, car plusieurs de vos agents ont disparu.\nUne possibilité demeure cependant, celle que vous choisissez de ne pas utiliser jusqu’à présent étant donné sa nature...'mystique'. La Sainte Église n’approuverait certainement pas un tel choix, mais peut-être que la mort de ce vampire spécifique vaut plus que votre réputation ?"
 POD_inquihunt.15.option.a:0 "Dieu pardonne après tout..."
 POD_inquihunt.15.option.b:0 "C’est une ligne que je ne franchirai pas"
 POD_inquihunt.16.t:0 "Si vous regardez dans les Abysses..."
 POD_inquihunt.16.desc:0 "Vous ne savez pas vraiment quand ça a commencé. Vous avez trouvé une référence du vampire dans un vieux livre, puis une autre... et vous avez commencé à lire. Et encore plus quand de nouveaux livres vous ont été apportés par des agents que vous ne vous souvenez pas avoir embauchés.\nVous avez été perdus pendant un certain temps dans votre travail et vous avez creusé profondément, probablement trop profondément. Du moins, c’est ce que pense l’Église, comme vous l’a rapporté un de vos chevaliers pour vos lectures 'hérétiques'. Et donc, vous voilà, à nouveau sur un bûcher brûlant, mais cette fois pas en public..."
 POD_inquihunt.16.option.a:0 "J’étais si proche de la vérité ! Si proche !"
 POD_inquihunt.17.t:0 "Sainte Fureur"
 POD_inquihunt.17.desc:0 "Ils ne s’attendaient pas à un assaut frontal. C’est ce que vous concluez après vous être frayé un chemin à travers un nombre important d'esclaves non préparés du vampire avant de trouver son lieu de repos. Bien que vous ayez attaqué de jour, le chahut de la bataille a réveillé le démon qui vous attendait.\nVous devez admettre qu’il s’est bien montré, léthargique comme ils le sont de jour, mais dans l’ensemble, vous lui coupez encore assez facilement la tête avant qu’il ne puisse vraiment prendre ses repères dans cette bataille. Un suceur de sang de moins sur la belle Terre de Dieu."
 POD_inquihunt.17.option.a:0 "Alors, où est la prochaine ?"
 POD_inquihunt.18.t:0 "Un digne adversaire"
 POD_inquihunt.18.desc:0 "Celui-ci est dur à battre. Bien qu’ayant facilement dépêché la plupart de ses gardes, et attaqué pendant la journée, ce démon est toujours un ennemi redoutable. Vous êtes confiant que vous gagnerez, grâce à la lumière de Dieu, mais c’est un processus lent et ardu.\nPour autant, cette longue bataille a donné le temps à d’autres esclaves du vampire d’intervenir. Vous pourriez probablement les battre aussi, mais vous ne sortirez pas indemne pour un tel combat..."
 POD_inquihunt.18.option.a:0 "Je gagnerai, peu importe le prix"
 POD_inquihunt.18.option.b:0 "Je dois me préserver pour de futures batailles"
 POD_inquihunt.19.t:0 "Surpassé"
 POD_inquihunt.19.desc:0 "Voilà comment ça se termine. Le démon, même s’il est attaqué pendant la journée, est beaucoup plus fort, plus rapide et plus robuste que vous. Vous êtes arrivés à cette conclusion très tôt dans votre confrontation et vous avez fait la paix avec elle.\nMaintenant, il s’agit simplement de le retenir assez longtemps pour que vos troupes se replient et vivent un autre jour, ce qui, vous en êtes presque sûr, est enfin terminé. Avec une dernière frappe, le vampire se prépare à vous tuer. Mais vous êtes plus en paix qu’il ne le fera jamais, car Dieu vous attend de l’autre côté."
 POD_inquihunt.19.option.a:0 "La lumière ne s’éteindra jamais vraiment"

