 POD_disciplines_interaction:0 "Demande de mentorat"
 POD_disciplines_interaction_desc:0 "Vous pouvez demander à un ami, un amant ou une âme sœur de vous enseigner une discipline que vous ne connaissez pas déjà."
 POD_mentoring_disciplines.0001.t:0 "Mentorat"
 POD_mentoring_disciplines.0001.desc:0 "Si votre mentor potentiel connaît une discipline que vous ne connaissez pas, vous pourriez lui demander de partager ses connaissances avec vous.\nCe n’est pas un processus libre cependant, il devra partager son sang avec vous, résultant en un lien sanguin faible. C’est aussi un peu humiliant de demander de l’aide dans la politique des vampires. En tant que tel, votre prestige en souffrira."
