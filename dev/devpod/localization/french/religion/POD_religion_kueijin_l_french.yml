 #Kuei-jin Group Faiths

 faceofthegods:0 "Visage des Dieux"
 faceofthegods_adj:0 "Divinité" 
 faceofthegods_adherent:0 "Adepte des Dieux" 
 faceofthegods_adherent_plural:0 "Adeptes des Dieux"
 faceofthegods_desc:0 "Probablement l’hérésie la plus extrême, le visage des dieux affirment que les Wan Kuei sont des dieux exilés. Ils ont mis en place leurs propres cultes avec des adorateurs et d’extraire le chi de la prière.."

 flameoftherisingphoenix:0 "Flamme du Phénix Levant"
 flameoftherisingphoenix_adj:0 "Levant"  
 flameoftherisingphoenix_adherent:0 "Phénix"
 flameoftherisingphoenix_adherent_plural:0 "Phénixs"
 flameoftherisingphoenix_desc:0 "Le dharma de la Flamme du Phénix Levant soutient que le but du Second Souffle est de réparer les crimes de sa vie. Le dharma est noté pour ses membres qui échouent (ou disparaissent occasionnellement) après une courte période de temps."

 deviltiger:0 "Hurlement du Tigre du Diable"
 deviltiger_adj:0 "Brûlant"  
 deviltiger_adherent:0 "Tigre"
 deviltiger_adherent_plural:0 "Tigres"
 deviltiger_desc:0 "Les Diable-Tigres croient qu’ils remplacent les démons incompétents des siècles passés ; ils punissent les pécheurs et cherchent l’illumination par la douleur et la violence."

 songoftheshadow:0 "Chant de l’ombre"
 songoftheshadow_adj:0 "Chantant"  
 songoftheshadow_adherent:0 "Chanteur"
 songoftheshadow_adherent_plural:0 "Chanteurs"
 songoftheshadow_desc:0 "Le chant de l’ombre, également connu sous le nom de fleurs d’os, sont des froid, logique, nécromanciers qui cherchent le raisonnement impartial et l’application de l’équilibre dharmique. Ils sont aussi étroitement liés à la société des mortels par leurs descendants et aident souvent leurs familles même des siècles plus tard."

 resplendentcrane:0 "Chemin de la Grue Resplendante"
 resplendentcrane_adj:0 "Legalisme"  
 resplendentcrane_adherent:0 "Magistra"
 resplendentcrane_adherent_plural:0 "Magistras"
 resplendentcrane_desc:0 "Le chemin de la Grue Resplendante est une collection d’écoles hautement légaliste, dédiée à renverser la roue des âges et à restaurer la vertu."

 thrashingdragon:0 "Danse du Dragon Battant"
 thrashingdragon_adj:0 "Danseur"  
 thrashingdragon_adherent:0 "Danseur"
 thrashingdragon_adherent_plural:0 "Danseurs"
 thrashingdragon_desc:0 "Le dharma du Dragon Thrashing, souvent mal compris, reconnaît qu’ils sont morts, mais cherche à atteindre l’illumination en imitant et en interagissant avec les vivants. Malgré l’incrédulité stupéfaite de certaines Grues Resplendissantes, elles sont un Dharma pleinement reconnu, même si elles semblent manger et se frayer un chemin à travers la non-vie."

 thousandwhispers:0 "Sentier des Mille Chuchotements"
 thousandwhispers_adj:0 "Murmurant"  
 thousandwhispers_adherent:0 "Murmureur"
 thousandwhispers_adherent_plural:0 "Murmureurs"
 thousandwhispers_desc:0 "Les Mille Chuchotements vivent une séquence de masques, de nouvelles identités qu’ils construisent après la mort afin de comprendre la vie mortelle et, espérons-le, la transcender."

 inwardway:0 "Les Aspirants du Chemin Intérieur"
 inwardway_adj:0 "Cherchant"  
 inwardway_adherent:0 "Chercheur"
 inwardway_adherent_plural:0 "Chercheurs"
 inwardway_desc:0 "Un dharma alternatif équilibré, les Aspirants poursuivent une voie taoïste par rapport aux tribunaux confucéens."

 wayofthetenthousandscreams:0 "Sentier des Dix Mille Cris"
 wayofthetenthousandscreams_adj:0 "Criant"  
 wayofthetenthousandscreams_adherent:0 "Crieur"
 wayofthetenthousandscreams_adherent_plural:0 "Crieurs"
 wayofthetenthousandscreams_desc:0 "Un dharma qui s’oppose à la Route Quintuple. Ses disciples prêchent l’union avec les Rois de Yama et voient leur nouvel état comme un moyen de servir l’auguste Personnage comme des destructeurs."
 
