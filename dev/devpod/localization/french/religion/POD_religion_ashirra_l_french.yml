 #Ashirra-Group Faiths
 tariqelumma:0 "Tariq el-Umma"
 tariqelumma_adj:0 "Ashirra"
 tariqelumma_adherent:0 "Ashirra"
 tariqelumma_adherent_plural:0 "Ashirra"
 tariqelumma_desc:0 "La route de l’humanité pour la parenté islamique varie peu de son homologue occidental. Les deux parties communiquent souvent et partagent leurs expériences."

 tariqelsama:0 "Tariq el-Sama"
 tariqelsama_adj:0 "Sama"
 tariqelsama_adherent:0 "el-Sama"
 tariqelsama_adherent_plural:0 "el-Sama"
 tariqelsama_desc:0 "Les caïnites qui étaient musulmans dans la vie peuvent choisir d’adhérer à ce chemin sous l’hypothèse que le plan d’Allah pour le monde inclut les vampires. Espérant que l’obéissance continue à Sa volonté pourrait les aider à contrôler la Bête."

 tariqelharb:0 "Tariq el-Harb"
 tariqelharb_adj:0 "Harb"
 tariqelharb_adherent:0 "el-Harb"
 tariqelharb_adherent_plural:0 "el-Harb"
 tariqelharb_desc:0 "La voie des Rois de la famille islamique. Comme il y a peu de Ventrue dans le monde musulman, cette route est moins répandue que la Via Regalis est en Occident. Pourtant, de nombreux sultans et émirs jouissent de l’exaltation du pouvoir qu’il procure."

 tariqelbedouin:0 "Tariq el-Bedouin"
 tariqelbedouin_adj:0 "Bedouin"
 tariqelbedouin_adherent:0 "el-Bedouin"
 tariqelbedouin_adherent_plural:0 "el-Bedouin"
 tariqelbedouin_desc:0 "La voie de la Bête de la Famille Islamique. Zayyat, fondateur de Tariq el-Bédouin et ami intime des dirigeants du califat d’Ashirra, fut la cause des liens étroits de cette route avec la civilisation. En contraste avec son homologue occidental."
 
 tariqealaam:0 "Tariq El-Alaam"
 tariqealaam_adj:0 "Shuhada"
 tariqealaam_adherent:0 "Al-shuhada"
 tariqealaam_adherent_plural:0 "Al-Shuhada"
 tariqealaam_desc:0 "Al-Shuhada des Ashirra, ces martyrs s’offrent comme des sacrifices de morts-vivants pour que d’autres n’aient pas à souffrir. Ils se sacrifieront volontairement pour mettre fin à la corruption causée par tout ce qui est considéré comme profane, en particulier les démons ou autres caïnites."
 
 
