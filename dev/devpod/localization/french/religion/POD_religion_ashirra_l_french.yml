 ashirra_religion_desc:0 "L’Ashirra (d’ashira, de l'arabe pour "clan") est la secte sous laquelle les vampires islamiques déclarent leur foi en Allah, et qui règne sur l’Arabie et l’Afrique du Nord, à partir du Moyen Âge. Les membres de l’Ashirra croient que la rédemption pour la famille était parmi les promesses faites par Muhammad s’ils choisissaient de suivre Allah."
