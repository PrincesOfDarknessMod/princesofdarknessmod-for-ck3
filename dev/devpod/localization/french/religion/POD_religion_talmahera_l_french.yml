 talmahera_religion_desc:0 "Aussi connu sous le nom de la Véritable Main Noire ou Manus Nigrum, c’est un ancien culte de la mort consacré à l'adoration d’une cabale d’êtres connus sous le nom d’Aralu. Le culte croit que ces être sont des Antédiluviens, qui dorment dans la ville fantôme d’Hénoch profondément dans les terres des morts."
