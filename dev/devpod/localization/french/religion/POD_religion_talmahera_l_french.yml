 #Black-Hand-Group Faiths
 talmahera:0 "Tal'Mahe'Ra"
 talmahera_adj:0 "Tal'Mahe'Ra"
 talmahera_adherent:0 "Croisé des Ombres"
 talmahera_adherent_plural:0 "Croisé des Ombres"
 talmahera_desc:0 "Le Tal’Mahe’Ra est une ancienne organisation formée par une alliance improbable entre les mages Chakravanti et plusieurs clans de vampires (notamment les Assamites), bien que ses membres incluent également d’autres créatures surnaturelles en plus des vampires et des mages."
 
 manusnigrum:0 "Manus Nigrum"
 manusnigrum_adj:0 "Manus Nigrum" 
 manusnigrum_adherent:0 "Main Noire"
 manusnigrum_adherent_plural:0 "Mains Noires"
 manusnigrum_desc:0 "La branche occidentale d’un ancien culte de la mort consacré à l'adoration d’une cabale d’êtres connus sous le nom d’Aralu, qu’ils croyaient être des Antédiluviens, qui dormaient dans la ville fantôme d’Hénoch profondément dans les terres des morts. Le culte s’est principalement impliqué dans la politique des vampires planifiant l’anéantissement des Baali."

 pathofselffocus:0 "Path of Self-Focus"
 pathofselffocus_adj:0 "Internaliste"
 pathofselffocus_adherent:0 "Internaliss"
 pathofselffocus_adherent_plural:0 "Internalistes"
 pathofselffocus_desc:0 "Les Internalistes croient qu’en acceptant le cours de l’univers et en le suivant sans interférer, ils pourraient cesser le conflit interne et ainsi arrêter la Bête. Parce que changer le monde est impossible, vous ne pouvez vous changer vous-même pour convenir au monde, disent-ils."
 
 pathofthescorchedheart:0 "Voie des Coeurs Écorchés"
 pathofthescorchedheart_adj:0 "Coeurs Écorchés"
 pathofthescorchedheart_adherent:0 "Impitoyable"
 pathofthescorchedheart_adherent_plural:0 "Impitoyables"
 pathofthescorchedheart_desc:0 "Basé sur le Livre du Cœur Vide de Rathmonicus qui a d’abord été diffusé parmi quelques familles dans l’Église catholique; ses écritures ont été réunies et compilées par la Vraie Main Noire. La Voie du Cœur Brûlé contrôle la Bête en éradiquant systématiquement toutes les émotions dans le cœur du vampire."
 
 holy_order_enoch_peacekeepers:0 "Gardiens de la Paix d'Hénoch"
 holy_order_spenta_aurvat_column:0 "Spenta Aurvat Column"
 

