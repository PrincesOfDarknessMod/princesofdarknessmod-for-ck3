l_french:

 POD_vampire_blood_heal.100.t:0 "#BLOODRED Soins Sanguin!#"
 POD_vampire_blood_heal.100.desc:0 "#BLOODRED Le sang peut soigner vos blessures de façon surnaturelles, mais cela risque d'attiser votre soif.#"
 POD_vampire_blood_heal.100.option.a:0 "Soigner mes blessures" 
 POD_vampire_blood_heal.100.option.a.tt.beast:0 "#BLOODRED Nous avons besoin de plus de sang.#"
 POD_vampire_blood_heal.100.option.b:0 "Soigner ma mutilation" 
 POD_vampire_blood_heal.100.option.b.tt.beast:0 "#BLOODRED Vous avez vraiment tout gâché.#"
 POD_vampire_blood_heal.100.option.c:0 "Reformer mon oeil manquant"
 POD_vampire_blood_heal.100.option.c.tt.beast:0 "#BLOODRED Les predateurs ont deux yeux!#"   
 POD_vampire_blood_heal.100.option.d:0 "Rattacher ma jambe"
 POD_vampire_blood_heal.100.option.d.tt.beast:0 "#BLOODRED Nous serons capable de les chasser.#"   
 POD_vampire_blood_heal.100.option.e:0 "Je ne risquerait pas d'attiser ma soif, pour le moment."  
 POD_vampire_blood_heal.100.option.e.tt.beast:0 "#BLOODRED Vous le ferez, et bientôt. Je vous attendrez.#"  
 POD_vampire_blood_heal.100.option.f:0 "Soigner l'un de mes yeux aveugles."  
 POD_vampire_blood_heal.100.option.f.tt.beast:0 "#BLOODRED Ou nous pourrions les chasser comme une chauve-souris.#"   
 POD_vampire_blood_heal.100.option.g:0 "Soigner mes cicatrices."  
 POD_vampire_blood_heal.100.option.g.tt.beast:0 "#BLOODRED Un gâchis de sang.#"    
 
