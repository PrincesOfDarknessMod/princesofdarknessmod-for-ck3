l_french:

 pod_masquerade.1.t:0 "La curiosité a tué le Chasseur"
 pod_masquerade.1.desc:0 "Un de ces satanés bienfaiteurs de ce groupe appelé les Chasseurs enquête sur votre domaine. Il a posé des questions sur votre emploi du temps, votre influence sur la population et d’autres sujets délicats. Si vous ne faites rien, il dira à ses supérieurs que quelque chose cloche à votre sujet. Il ne fait aucun doute dans votre esprit que cela soulèvera des soupçons concernant votre cour. Heureusement, vous connaissez une personne capable de s'occuper de cette nuisance rapidement et discrètement, mais ses services ne sont pas très bon marché..."
 pod_masquerade.1.a:0 "De l’argent pour la tranquillité ? Le choix est facile"
 pod_masquerade.1.b:0 "Je n’ai pas peur des mortels fragiles"
 pod_masquerade.2.t:0 "Des fous, Partout !"
 pod_masquerade.2.desc:0 "Vous êtes entouré d’idiots et de bouffons. Vous le saviez certainement déjà, mais quel est un autre exemple sur votre liste apparemment sans fin? Un chasseur se cache dans votre domaine, inaperçu par votre peuple depuis des mois maintenant, rassemblant des preuves de votre existence impie. Vous devez vous occuper de lui maintenant avant qu’il ne s’éclipse pour faire rapport à ses supérieurs. Et, de toute évidence, les rumeurs sur vous et l’incompétence de vos conseillé se répandront s’il devait s’échapper..."
 pod_masquerade.2.a:0 "Si vous voulez un travail bien fait..."
 pod_masquerade.2.b:0 "Laisse-le s’enfuir, je ne veut plus m'en soucier"
 pod_masquerade.3.t:0 "Problème de Famille"
 pod_masquerade.3.desc:0 "Des rapports troublants de l’un de vos agents : Une famille bien établis en ville semble avoir des soupçons quant à votre vraie nature. Vous n’êtes pas vraiment sûr de ce qui a mal tourné mais aucune Mascarade n’est parfaite après tout. Vous avez un choix à faire, soit traiter avec la famille pour de bon ou tout simplement les ignorer, risquant leur ingérence continue."
 pod_masquerade.3.a:0 "Un accident malheureux résoudrait certainement ce problème"
 pod_masquerade.3.b:0 "Ils ne sont pas une menace"
 pod_masquerade.4.t:0 "La Famille c'est la Famille" 
 pod_masquerade.4.desc:0 "Une réunion de famille est assez rare dans les cercles caïnites, principalement en raison du fait qu’elle pourrait se transformer en un massacre à tout moment. Malheureusement, vous avez été choisi comme hôte pour le prochain rassemblement, ce qui signifie beaucoup de vampires, et beaucoup de soupçons attirés vers vous. Vous pourriez annuler l’événement, certainement tout le monde comprendrait, mais la maintenir serait une démonstration palpable de confiance de votre part."
 pod_masquerade.4.a:0 "Je ne le sens pas..."
 pod_masquerade.4.b:0 "Bienvenue! S’il vous plaît, laissez vos armes derrière vous, surtout les armes secrètes."
 pod_masquerade.5.t:0 "Un choix vite effectuer" 
 pod_masquerade.5.desc:0 "Alors que vous rétractez vos crocs et essuyez un peu du sang de votre bouche, vous regardez les cadavres des Chasseurs qui ont essayé de vous attaquer et vous vous demandez... Ont-ils été mal informés au sujet de votre pouvoir? Ou simplement trop confiants? De toute façon, ils sont morts maintenant. Sauf un, qui s’enfuit assez rapidement en fait. Vous êtes un peu trop ennuyé de devoir le poursuivre, il semble agile et vous en avez assez de courir dans les rues de la ville comme un fou. Mais si vous ne le pourchassez pas, il apportera sûrement des nouvelles de cette petite escapade à ses supérieurs..."
 pod_masquerade.5.a:0 "Peut-être qu’une belle poursuite me rappellera le bon vieux temps ?"
 pod_masquerade.5.b:0 "Eh bien, retour à ma salle du trône, je suppose."
 pod_masquerade.6.t:0 "C'était trop beau pour être vrai" 
 pod_masquerade.6.desc:0 "Le patriarche d’une famille influente de votre région vient de passer. Son héritage survit à travers ses deux fils et, il se trouve que vous avez une forte emprise sur l’un d’eux... Si vous deviez aider ce jeune homme à reprendre l’entreprise familiale, vous pourriez en récolter les bénéfices, mais votre étrange patronage ferait certainement sourciller."
 pod_masquerade.6.a:0 "Rien de plus que des rats se battant pour des miettes"
 pod_masquerade.6.b:0 "Nous suivrons la carrière de ce jeune homme avec grand intérêt"
 pod_masquerade.7.t:0 "Mauvaise Romance" 
 pod_masquerade.7.desc:0 "Vous ne pensiez plus en avoir en vous et vous ne savez pas comment ni pourquoi, mais... ce simple paysan vous a captivé pendant un certain temps. Cela pourrait-il être les restes de la luxure mortelle, ou quelque chose de plus ? Vous n’êtes pas sûr, mais ce soir, vous devez faire un choix. Allez-vous présenter votre nouvel animal de compagnie à votre cour au risque de briser la mascarade? Ou allez-vous faire la... bonne chose?"
 pod_masquerade.7.a:0 "Désolé mon amour, ce n’est pas moi. C’est toi"
 pod_masquerade.7.b:0 "Bienvenue dans mon salon, lumière de mes nuits"
 pod_masquerade.8.t:0 "Etirés vos muscles" 
 pod_masquerade.8.desc:0 "Les mortels de votre région ont une de ces guerres stupides qu’ils aiment tant. Était-ce à propos d’une revendication? La religion? Eh bien, peu importe, c’est une occasion pour vous d’aller sur le champ de bataille! Écraser quelques crânes et peut-être apprendre une chose ou deux sur le chemin? De toute évidence, les survivants seront probablement un peu méfiants de vos prouesses éternelles..."
 pod_masquerade.8.a:0 "J'ai déjà donné"
 pod_masquerade.8.b:0 "Attends, qui suis-je censé tuer à nouveau ? Oh bien."
 pod_masquerade.9.t:0 "Exposé : Action hostile" 
 pod_masquerade.9.desc:0 "Vos transactions dans la région ont finalement attiré l’attention de l’Inquisition de l’Ombre. Heureusement, il semble que, jusqu’à présent, ils ne cherchent qu’à saper votre autorité en ciblant vos principaux atouts. Plusieurs de vos agents ont disparu, certaines de vos goules ont été remplacées par des membres respectables du clergé... et cela commence à entacher votre pouvoir.\nVous pourriez essayer de riposter, mais l’Inquisition aussi va certainement ettofer son jeu si vous le faites."
 pod_masquerade.9.a:0 "Vous voulez jouer? Nous allons jouer alors..."
 pod_masquerade.9.b:0 "Réduisons mes pertes et faisons profil bas pendant un moment"
 pod_masquerade.9.a.effect.success.desc:0 "Outrepasser l’Inquisition arrêtera leur opération contre vous, pour l’instant" 
 pod_masquerade.9.a.success:0 "Retour aux affaires !"
 pod_masquerade.9.a.failure.effect.desc:0 "S’ils réussissent, l’Inquisition mettra en péril votre influence"
 pod_masquerade.9.a.failure:0 "Ils ont gagné cette bataille, mais pas la guerre" 
 pod_masquerade.9.a.critical.failure.effect.desc:0 "Si vous faites des erreurs, l’Inquisition écrasera votre autorité sur la région pendant longtemps"
 pod_masquerade.9.a.critical.failure:0 "Ils ont totalement gagné..." 
 pod_masquerade.10.t:0 "Exposé : Des hommes de foi" 
 pod_masquerade.10.desc:0 "Vous gardez toujours un œil sur les mortels les plus fidèles dans votre région car ils peuvent facilement être les plus dangereux. Dernièrement, de nouveaux membres du clergé sont apparus et ils semblent... tout à fait dévoués dans leur sainte œuvre. Vous êtes presque sûr qu’ils sont une force avancée de l’Inquisition détestée, rassemblant le soutien parmi votre population pour renverser votre règne parfaitement juste.\nVous pourriez frapper maintenant pour les enlever, mais il y a un risque sérieux que cela se retourne contre vous. Ces hommes ont déjà une forte emprise spirituelle sur la population..."
 pod_masquerade.10.a:0 "Faisons taire ces faux prophètes"
 pod_masquerade.10.b:0 "Je peux me retirer des affaires mortelles pendant un moment"
 pod_masquerade.10.a.effect.success.desc:0 "Outrepasser l’Inquisition arrêtera leur opération contre vous, pour l’instant" 
 pod_masquerade.10.a.success:0 "Louez-moi !"
 pod_masquerade.10.a.failure.effect.desc:0 "S’ils réussissent, l’Inquisition mettra en péril votre influence"
 pod_masquerade.10.a.failure:0 "Ils ont gagné cette bataille, mais pas la guerre" 
 pod_masquerade.10.a.critical.failure.effect.desc:0 "Si vous faites des erreurs, l’Inquisition écrasera votre autorité sur la région pendant longtemps"
 pod_masquerade.10.a.critical.failure:0 "Ils ont totalement gagné..." 
 pod_masquerade.11.t:0 "Exposé : La bataille" 
 pod_masquerade.11.desc:0 "An hostile mortal army is approaching your realm. It isn't uncommon per se, mortals do love their petty wars after all, but this one seems different. Your agents report seeing dedicated men, and an unusual number of clergy members within their ranks. Could you be their true target?\nIt is still time to rally your troops and defend your land... or you could just disappear for a while and weather the storm."
 pod_masquerade.11.a:0 "Je ne crains aucun champ de bataille"
 pod_masquerade.11.b:0 "Il est temps de prendre des vacances rapides"
 pod_masquerade.11.a.effect.success.desc:0 "Outrepasser l’Inquisition arrêtera leur opération contre vous, pour l’instant" 
 pod_masquerade.11.a.success:0 "Vous les avez écrasés, évidemment"
 pod_masquerade.11.a.failure.effect.desc:0 "S’ils réussissent, l’Inquisition mettra en péril votre influence"
 pod_masquerade.11.a.failure:0 "Ils ont gagné cette bataille, mais pas la guerre" 
 pod_masquerade.11.a.critical.failure.effect.desc:0 "Si vous faites des erreurs, l’Inquisition écrasera votre autorité sur la région pendant longtemps"
 pod_masquerade.11.a.critical.failure:0 "Ils ont totalement gagné..." 
 pod_masquerade.12.t:0 "Exposé : Agir devant les tribunaux" 
 pod_masquerade.12.desc:0 "Règner est devenue étonnamment plus difficile ces derniers temps. Les mortels ont élaboré de nouvelles lois et effectué de nombreux changements qui ont été une épine dans votre pied. Vous n’y avez plus beaucoup pensé depuis longtemps mais un de vos agents a rapporté que le dirigeant mortel local a un nouveau conseiller, et celui-ci semble en savoir beaucoup sur vous.\nEn agissant violemment cet homme serait imprudent, car il est une figure bien connue de la politique mortelle, mais... vous pourriez le discréditer, ou le distancer dans son propre jeu d’influence. Ou vous pourriez faire profil bas un moment, les mortels sont des mortels après tout."
 pod_masquerade.12.a:0 "J’aime un bon défi"
 pod_masquerade.12.b:0 "Il ne peut pas faire grand-chose si je reste caché un moment"
 pod_masquerade.12.a.effect.success.desc:0 "Outrepasser l’Inquisition arrêtera leur opération contre vous, pour l’instant" 
 pod_masquerade.12.a.success:0 "Victoire Totale !"
 pod_masquerade.12.a.failure.effect.desc:0 "S’ils réussissent, l’Inquisition mettra en péril votre influence"
 pod_masquerade.12.a.failure:0 "Ils ont gagné cette bataille, mais pas la guerre" 
 pod_masquerade.12.a.critical.failure.effect.desc:0 "Si vous faites des erreurs, l’Inquisition écrasera votre autorité sur la région pendant longtemps"
 pod_masquerade.12.a.critical.failure:0 "Ils ont totalement gagné..." 
 pod_masquerade.13.t:0 "Exposé : Saint-Murmure" 
 pod_masquerade.13.desc:0 "Quand vous avez entendu que l’Inquisition planifiait quelque chose contre vous, vous vous attendiez au tonnerre et à la fureur. Au lieu de cela, vous avez obtenu des manteaux et des poignards. Vos agents disparaissent, les contacts de confiance deviennent des traîtres et les rumeurs sont abondantes à votre sujet.\nVous pouviez riposter pour montrer à ces mortels un véritable maître de l’intrigue. Ou vous pourriez juste laisser faire, ils se lasseront de ce jeu assez tôt, ou mieux encore, les laisser se flétrir et mourir par eux-mêmes comme les mortels le font."
 pod_masquerade.13.a:0 "C’est un défi fascinant à relever"
 pod_masquerade.13.b:0 "Eh bien, pas de complot pendant un moment"
 pod_masquerade.13.a.effect.success.desc:0 "Outrepasser l’Inquisition arrêtera leur opération contre vous, pour l’instant" 
 pod_masquerade.13.a.success:0 "Victoire Totale !"
 pod_masquerade.13.a.failure.effect.desc:0 "S’ils réussissent, l’Inquisition mettra en péril votre influence"
 pod_masquerade.13.a.failure:0 "Ils ont gagné cette bataille, mais pas la guerre" 
 pod_masquerade.13.a.critical.failure.effect.desc:0 "Si vous faites des erreurs, l’Inquisition écrasera votre autorité sur la région pendant longtemps"
 pod_masquerade.13.a.critical.failure:0 "Ils ont totalement gagné..." 
 pod_masquerade.14.t:0 "Exposé : Sainte-Furie" 
 pod_masquerade.14.desc:0 "A en juger par les cris venant de derrière la porte scellée de votre salle du trône, votre dernière ligne de défense s’effrite. Plus de complot, de dissimulation ou de jeux subtils, l’Inquisition est venue pour vous dans toute sa juste fureur.\nComme le bâtiment entier commence à s’effondrer en flammes, vous vous rassurez en vous disant, ils ont juste sautés par les fenêtres mortels qu'ils sont. Vous pouvez les prendre par vous-même sûrement... Ou vous pourriez utiliser le passage caché derrière votre trône pour vous échapper et combattre un autre jour. Plus aucun cris, et de bruit des armes peut être entendu derrière la porte. C’est maintenant ou jamais."
 pod_masquerade.14.a:0 "Enfin! Un dignes adversaires!"
 pod_masquerade.14.b:0 "Alors... ouvrons ce passage secret ici..."
 pod_masquerade.14.a.effect.success.desc:0 "Massacrer l’Inquisition arrêtera leur opération contre vous, pour l’instant" 
 pod_masquerade.14.a.success:0 "Pas si puissant dorénavant"
 pod_masquerade.14.a.failure.effect.desc:0 "Réussir à vous frayer un chemin vous sauvera d'un coût plus élevé"
 pod_masquerade.14.a.failure:0 "Ils ont gagné cette bataille, mais pas la guerre" 
 pod_masquerade.14.a.critical.failure.effect.desc:0 "Si vous faites des erreurs, l’Inquisition vous transformera en cendres"
 pod_masquerade.14.a.critical.failure:0 "...Bien débrouillé" 
  
     
    
   
   
  
 
