 POD_chargen.1.t:0 "Bienvenue dans le Générateur de Personnage"
 POD_chargen.1.desc:0 "Avec cette série d’événements, vous pourrez personnaliser votre personnage pour le Monde des Ténèbres. Le processus supprimera tous vos traits surnaturels existants. Vous pourrez choisir votre type de créature surnaturelle (initialement seulement les vampires sont disponibles), votre clan, votre maison, votre génération, potentiellement votre père, vos disciplines, votre Voie et votre chemin et votre type de prédateur.\n\nEn fonction de votre personnage de base, vous devrez peut-être supprimer certains anciens membres de votre famille."
 POD_chargen.1.option.a:0 "Je veux vraiment utiliser le Générateur de Personnage"
 POD_chargen.1.option.a.tt:0 "#R SOYEZ SÛR QUE VOUS VOULEZ LE FAIRE ! IL N’Y A PAS DE RETOUR EN ARRIERE ! CELA EFFACERA TOUS VOS TRAITS, MODIFICATEURS ET SECRETS SURNATURELS EXISTANTS !#"
 POD_chargen.1.option.b:0 "Ne pas rien modifier et quitter le Générateur de Personnage"

 POD_chargen.2.t:0 "Que se passe-t-il la nuit ?"
 POD_chargen.2.desc:0 "Quel genre de créature surnaturel êtes-vous ?"
 POD_chargen.2.option.a:0 "Vampire"
 POD_chargen.2.option.j:0 "Revenant"
 POD_chargen.2.option.b:0 "Loup-Garrou"
 POD_chargen.2.option.c:0 "Mage"
 POD_chargen.2.option.d:0 "Fée"
 POD_chargen.2.option.e:0 "Chasseur"
 POD_chargen.2.option.f:0 "Mortel"
 POD_chargen.2.option.g:0 "Démon"
 POD_chargen.2.option.h:0 "Mommie"
 POD_chargen.2.option.i:0 "Spectre" 

 POD_chargen.3.t:0 "La Première Génération" 
 POD_chargen.3.desc:0 "Qui est l’ancêtre des vampires ?"
 POD_chargen.3.option.a:0 "Comme il a été écrit dans le Livre de Nod : Caïn a été maudit par Dieu"
 POD_chargen.3.option.i:0 "Les Ashirra disent que Kayyun a été maudit par Allah" 
 POD_chargen.3.option.c:0 "Les histoires disent que les vampires descendent de Cagn"
 POD_chargen.3.option.b:0 "La Mère Noire dit que les vampires ont de nombreuses origines"  
 POD_chargen.3.option.h:0 "Set qui a pris sa revanche sur Osiris" 
 POD_chargen.3.option.g:0 "Odin, qui a marqué par les runes, le guerrier mourant canari" 
 POD_chargen.3.option.f:0 "Créé par les Pitris, Zapathasura chasse leurs serviteurs tombés"
 POD_chargen.3.option.e:0 "La malédiction des Wan Kuei, les Dix Mille Démons" 
 POD_chargen.3.option.d:0 "Je ne sais pas d’où viennent les vampires" 
 POD_chargen.3.option.j:0 "Je ne suis peut-être pas un vampire..."
 POD_chargen.3.option.j.tt:0 "Vous reconsidérez quel genre de créature surnaturel vous jouer."

 POD_chargen.4.t:0 "La Seconde Génération" 
 POD_chargen.4.desc:0 "De quel enfant de Caïn descend votre clan ?"
 POD_chargen.4.option.a:0 "Hénoch le Sage"
 POD_chargen.4.option.b:0 "Irad le Puissant"
 POD_chargen.4.option.c:0 "Zillah le Magnifique"
 POD_chargen.4.option.d:0 "Peut-être que Caïn n’était pas l’ancêtre…"
 POD_chargen.4.option.d.tt:0 "Vous reconsidérez l’origine des vampires."

