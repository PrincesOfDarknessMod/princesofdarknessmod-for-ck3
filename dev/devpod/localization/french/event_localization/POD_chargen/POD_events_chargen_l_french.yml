 POD_chargen.1030.option.c.tt:0 "Les adorateurs ne peuvent jamais réduire leur exposition de la Masquarade en dessous de suspect."   
 POD_chargen.1030.option.d:0 "Par le Consensualisme"
 POD_chargen.1030.option.d.tt:0 "Consensualistes ne peuvent jamais réduire leur exposition de la Masquarade en dessous de suspect."   
 POD_chargen.1030.option.e:0 "Je pense que j’ai une approche différente..."

