 POD_chargen.1300.t:0 "Revenants"
 POD_chargen.1300.desc:0 "Les esclaves de sang ont consommé le sang de leurs vampires domitors, ces goules ont pris une partie du pouvoir de la famille. Rarement, certains de leurs enfants sont nés avec du sang de vampire dans leurs veines. Avec une plus grande maîtrise du sang, ils sont plus puissants que leurs parents. Communément appelés "revenants", les cadavres de goules du clan Tzimisce sont appelés 'Zadruga'. De quelle lignée de revenants descendez-vous ?"
 POD_chargen.1300.option.a:0 "Zadruga, les Scions du Tzimisce"
 POD_chargen.1300.option.b:0 "Serviteurs du Tal’mahe’Ra, la Main Noire"
 POD_chargen.1300.option.c:0 "Serfs de Sang en Europe"
 POD_chargen.1300.option.d:0 "Quelque chose de plus rare..."
 POD_chargen.1300.option.e:0 "Une dynastie indépendante"
 POD_chargen.1300.option.f:0 "Peut-être que je ne suis pas un revenant"
 
 POD_chargen.1310.t:0 "Zadruga"
 POD_chargen.1310.desc:0 "L’aîné répandit son sang parmi ses serviteurs mortels. Ces esclaves élevèrent le premier Zadruga. Appartenez-vous à l’une des plus remarquables lignées de Zadruga ou quelque chose de plus obscur ?"
 POD_chargen.1310.option.a:0 "Obertus, les anciens sont des savants vénérés"
 POD_chargen.1310.option.b:0 "Grimaldi, agents manipulant la société mortelle"
