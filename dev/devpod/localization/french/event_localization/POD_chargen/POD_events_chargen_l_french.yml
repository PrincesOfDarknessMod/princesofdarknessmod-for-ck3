 POD_chargen.1100.t:0 "Les proies à Exclure"
 POD_chargen.1100.desc:0 "En raison de leur faiblesse inhérente à leur clan, les Ventrue ont des goûts exigeants et raréfiés, même quand il s’agit de sang. Quel genre de sang cherchez-vous?"
 POD_chargen.1100.option.a:0 "A/S/E"
 POD_chargen.1100.option.a.tt:0 "Vous choisissez des proies d’un certain âge et sexe."
 POD_chargen.1100.option.b:0 "Que faites-vous dans la vie ?" 
 POD_chargen.1100.option.b.tt:0 "Vous choisissez une proie d’une certaine profession ou d'une certaine éducation."
 POD_chargen.1100.option.c:0 "Qu'est ce que vous désiré" #Sin
 POD_chargen.1100.option.c.tt:0 "Vous choisissez une proie avec une certaine personnalité qui est considéré comme un péché par la plupart des mortels."
 POD_chargen.1100.option.d:0 "Etes-vous quelqu'un de bien ?" #Virtue
 POD_chargen.1100.option.d.tt:0 "Vous choisissez une proie avec une certaine personnalité qui est considérée comme une vertu par la plupart des mortels."

