 POD_chargen.620.t:0 "Puissance Sanguine"
 POD_chargen.620.desc:0 "La puissance sanguine détermine la force de vos pouvoirs vampiriques, ainsi que la quantité de sang dont vous avez besoin pour satisfaire votre soif. La puissance sanguine est à la fois définie et limitée par votre génération. La puissance sanguine augmente très lentement au fil du temps, mais peut également être augmentée par diabolisation. L’entrée en torpeur réduira lentement votre puissance sanguine."
 POD_chargen.620.option.a:0 "Ma puissance sanguine est établi"
 
 POD_chargen.650.t:0 "La Masquarade"
 POD_chargen.650.desc:0 "Le Silence du Sang cache votre nature surnaturelle aux mortels. Si les kine savent que vous êtes un monstre, ils peuvent essayer de vous détruire. Pire encore. d’autres surnaturels peuvent aussi chercher votre destruction pour assurer leur propre survie. Certains surnaturels évitent le secret et se délectent plutôt de la crainte causée par la révélation de la nature monstrueuse. Utiliser des pouvoirs surnaturels flagrants en public, créer des enfants et des goules vampiriques, se cacher en se nourrissant et laisser une traînée de cadavres ; tout risque d’augmenter l’exposition de la Masquarade d’un vampire."
 POD_chargen.650.option.a:0 "Ma nature surnaturelle est cachée." 
 
 POD_chargen.670.t:0 "La Soif"
 POD_chargen.670.desc:0 "La Bête a soif. Les vampires soutiennent leur existence immortelle par le sang. Le sang alimente également leurs pouvoirs surnaturels. L’utilisation de vos capacités surnaturelles comme les disciplines ou la guérison fantastique a une chance d’augmenter votre soif. Plus un vampire a soif, plus il devient irrationnel, désespéré, violent et stressé. Les vampires ne sont rassasiés qu’en vidant un humain à mort. Tuer des humains, cependant, érode l’humanité d’un vampire les rendant plus sensibles aux tentations de la Bête. Succomber pleinement à la Bête, c’est devenir une bête eux-même, une créature uniquement motivée par leur soif inextinguible de sang. Suivre une Voie ou une voie aidera un vampire à tenir la Bête à distance."
 POD_chargen.670.option.a:0 "Je suis assoiffé"
 
