 #POD_chargen.1360.option.d:0 "I lead an independent dynasty"
 
 POD_chargen.1370.t:0 "La Masquarade"
 POD_chargen.1370.desc:0 "Le Silence du Sang est de garder votre nature surnaturelle secrète des mortels. Si les mortels savent que vous êtes un monstre, ils peuvent essayer de vous détruire. Pire. d’autres surnaturels peuvent aussi chercher votre destruction pour assurer leur propre survie. Certains surnaturels évitent le secret et se délectent plutôt de la crainte causée par la révélation de la nature monstrueuse. Utiliser des pouvoirs surnaturels flagrants en public ou laisser une traînée de cadavres ; tous risquent d’augmenter l’exposition masquée d’un revenant."
 POD_chargen.1370.option.a:0 "Ma nature surnaturelle est cachée." 
 
 POD_chargen.1380.t:0 "La Soif"
 POD_chargen.1380.desc:0 "La Bête a soif. Les vampires soutiennent leur existence immortelle par le sang. Le sang alimente également leurs pouvoirs surnaturels. Ce sang coule toujours dans les veines ou les revenants. L’utilisation de vos capacités surnaturelles comme les disciplines ou la guérison fantastique a une chance d’augmenter votre soif de sang. Plus un revenant a envie de sang de vampire, plus il devient irrationnel, désespéré, violent et stressé. Pendant ce temps, les revenants transforment une partie de leur sang mortel en sang vampirique [...] se cannibalisent effectivement.  Les revenants peuvent aussi réduire leur faim en buvant le sang des vampires."
 POD_chargen.1380.option.a:0 "Oserais-je utiliser les pouvoirs de mon sombre don ?"
