 POD_chargen.610.t:0 "Disciplines"
 POD_chargen.610.desc:0 "Les pouvoirs des vampires sont appelés disciplines. Différents clans et lignées ont une discipline inhérente différente. Les disciplines fournissent des bonus passifs aux attributs, mais certaines ont également des pouvoirs actifs invoqués par des décisions ou des régimes. Invoquer des disciplines est susceptible d’augmenter la soif de sang. Vous allez maintenant confirmer votre clan et votre ensemble de discipline. C’est votre dernière chance de reculer dans la génération de personnage et changer votre maison ou votre clan."
