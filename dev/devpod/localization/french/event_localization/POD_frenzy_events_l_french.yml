 POD_vampire_frenzy_events.001.t:0 "Frénésie de la faim!"
 POD_vampire_frenzy_events.001.desc:0 "La bête hurle en vous, luttant pour la libération. Vous l'avez affamé pendant trop longtemps, et maintenant il vous oblige à lui donner les rênes pour qu'il puisse se remplir. La bête vise à se libérer et à trouver un vassal sur lequel se nourrir pour étancher sa soif de sang insatiable de la source la plus proche. Son contrôle sur votre corps augmente à chaque instant qui passe, et les bords de votre vue deviennent rouges. Vous pouvez essayer de combattre la bête, mais lâcher prise serait si bon ...... #R Pourquoi se battre, alors que nous savons tous les deux que je gagnerai?"
 POD_vampire_frenzy_events.001.succumb:0 "Succombez à la frénésie"
 POD_vampire_frenzy_events.001.succumb.beast:0 "#R Laissez-moi vous montrer une vraie satisfaction."
 POD_vampire_frenzy_events.001.fight:0 "Combattez la frénésie"
 POD_vampire_frenzy_events.001.fight.beast:0 "#R Ce n'est pas assez. ça ne VOUS suffit pas."
 POD_vampire_frenzy_events.001.fightwp:0 "Combattez la frénésie de toute votre volonté"
 POD_vampire_frenzy_events.001.fightwp.beast:0 "#R Si ce n'est pas aujourd'hui, alors demain ... mieux vaut abandonner maintenant chérie."
 POD_vampire_frenzy_events.001.fight.failed:0 "La bête prend le dessus"
 POD_vampire_frenzy_events.001.desc.instinct:0 "La bête hurle en vous, luttant pour la libération. Vous l'avez affamé pendant trop longtemps, et maintenant il vous oblige à lui donner les rênes pour qu'il puisse se remplir. La bête vise à se libérer et à trouver un vassal sur lequel se nourrir pour étancher sa soif de sang insatiable de la source la plus proche. Son contrôle sur votre corps augmente à chaque instant qui passe, et les bords de votre vue deviennent rouges. Vous pouvez sentir la pression derrière vos yeux et savoir qu'il est temps de surfer sur la vague et de laisser la bête jouer. mais comment le ferez-vous?"
 POD_vampire_frenzy_events.001.drain:0 "J'irai trouver un de mes serviteurs mortels et les viderai."
 POD_vampire_frenzy_events.001.drain.beast:0 "#R Simple et pertinent. Je l'aime!"
 POD_vampire_frenzy_events.001.vamp:0 "Je peux sentir la douce vitae de l'autre parenté au tribunal."
 POD_vampire_frenzy_events.001.vamp.beast:0 "#R Boire sur un autre vampire? Comme c'est exotique!"
 POD_vampire_frenzy_events.001.social:0 "Je vais me nourrir ici, maintenant. Je me fiche de ce que le tribunal va penser."
 POD_vampire_frenzy_events.001.social.beast:0 "#R Scandaleux!"
 POD_vampire_frenzy_events.001.breach:0 "Je vais courir dans les rues et me nourrir d'un mortel qui passe."
 POD_vampire_frenzy_events.001.breach.beast:0 "#R Parce que ça marche toujours, non?"
 POD_vampire_frenzy_events.201.t:0 "Frénésie de la faim: répercussions"
 POD_vampire_frenzy_events.201.desc:0 "Vous vous réveillez en extase totale, incapable de vous concentrer sur quoi que ce soit autour de vous. Quelques instants passent et vous vous rendez compte que le plaisir émane du mortel sous vos crocs. Vous vous éloignez pour découvrir [mortal.GetTitledFirstName], un de vos serviteurs humains. Il semble que la bête l'ait attaqué en utilisant votre corps.\n [mortal.GetTitledFirstName] ne bouge pas, et une vérification rapide prouve qu' [mortal.GetSheHe] n'a plus de sang. Sauf si tu fais quelque chose, [mortal.GetTitledFirstName] mourra dans tes bras. #R [mortal.GetSheHe] nous a servi plus dans la mort que dans la vie."
 POD_vampire_frenzy_events.201.kill:0 "Je ne peux rien faire. [mortal.GetTitledFirstName] va mourir."
 POD_vampire_frenzy_events.201.kill.beast:0 "#R Le mortel a rempli son but."  
 POD_vampire_frenzy_events.201.embrace:0 "Je l'embrasserai pour sauver sa vie."
 POD_vampire_frenzy_events.201.embrace.beast:0 "#R Est-ce leur vie que vous sauvez ou votre conscience? "
 POD_vampire_frenzy_events.301.t:0 "Frénésie de la faim: répercussions"
 POD_vampire_frenzy_events.301.desc:0 "La dernière chose que tu as vue avant de sombrer dans la frénésie était [bonder.GetTitledFirstName]. Maintenant tu te réveilles dans sa chambre du sang dégoulinant de tes crocs. [bonder.GetTitledFirstName] se tient devant toi avec un froncement de sourcils sur son visage cendré. Tu remarques qu' [bonder.GetSheHe] tient son bras ensanglanté. La traînée de sang vous mène et vous ressentez une douleur en pensant que vous avez mal. Les nouvelles émotions envers [bonder.GetTitledFirstName] sont déroutantes, mais plus encore le fait que votre frénésie vous pousse à boire sur un autre vampire. [bonder.GetTitledFirstName] ne semble pas non plus désireux d'expliquer ce qu'il s'est passé. "
 POD_vampire_frenzy_events.301.a:0 "J'ai peur que cela revienne me hanter."
 POD_vampire_frenzy_events.301.a.beast:0 "#R Nous devrons nous assurer que ce n'est pas le cas."
 POD_vampire_frenzy_events.401.t:0 "Frénésie de la faim: répercussions"
 POD_vampire_frenzy_events.401.desc:0 "La bête a choisi le pire moment pour lever la tête - vous étiez au milieu d'une réunion de cour suprême. Vous essayez de vous échapper, mais la bête refuse d'attendre. Vous finissez par vous lancer sur un petit serviteur mortel d'un vampire dont vous ne vous souvenez pas du nom. Le mortel a survécu et son propriétaire était trop insignifiant pour exiger une récompense, mais votre cour vous considère désormais comme faible. Vous vous sentez comme si vous aviez perdu le respect de votre royaume."
 POD_vampire_frenzy_events.401.a:0 "Je m'assurerai d'avoir un mortel sous la main à l'avenir."
 POD_vampire_frenzy_events.401.a.beast:0 "#R Cela n'aidera pas."
 POD_vampire_frenzy_events.501.t:0 "Frénésie de la faim: répercussions"
 POD_vampire_frenzy_events.501.desc:0 "La bête a choisi le pire moment pour lever la tête - vous étiez au milieu d'une réunion de cour suprême. Vous parvenez à vous échapper avant que la bête ne prenne le dessus, ce qui vous évite l'humiliation à la cour. Dehors, la bête saute sur le mortel le plus proche, vous faisant enfoncer vos crocs dans sa chair. Vous vous réveillez après qu'il est éteint. Vous essuyez le sang de vos lèvres, croyant que le problème est terminé. Ce n'est qu'alors que vous remarquez que le mortel vous regarde."
 POD_vampire_frenzy_events.501.a:0 "Je dois m'en occuper."
 POD_vampire_frenzy_events.501.a.beast:0 "#R Comme la terreur est adorable dans leurs yeux."
 POD_vampire_frenzy_events.401.opinion_malus:0 "L'opinion de vassaux sur vous diminue."
 
 POD_vampire_frenzy_events.601.t:0 "Rage de frénésie"
 POD_vampire_frenzy_events.601.desc.instinct:0 "Tous les vampires ont une bête en eux - une force animale de méchanceté, de rage et de faim. Lorsque les parents perdent le contrôle, la bête les surmonte, prenant la laisse et poursuivant ses désirs de base, qu'ils soient vengeance, sang ou sécurité. Kindred of your path Essayez de maîtriser la bête, de surfer sur la vague de frénésie pour atteindre vos objectifs. Pour l'utiliser puissance. \n \n Votre bête a été provoquée par la rage que vous ressentez maintenant et elle essaie de se libérer. Les bords de votre vision rougissent lorsque vous affûtez votre vue sur ce qui vous a traversé. Vos poings se serrent douloureusement pendant que vous essayez de vous retenir. L'heure de la frénésie est maintenant, mais vers qui allez-vous diriger votre rage?"
 POD_vampire_frenzy_events.601.desc:0 "Tous les vampires ont une bête en eux - une force animale de méchanceté, de rage et de faim. Lorsque les parents perdent le contrôle, la bête les surmonte, prenant la laisse et poursuivant ses désirs de base, qu'ils soient vengeance, sang ou sécurité. Tentez de combattre la bête, de la garder enfermée en vous. Pour lui refuser le contrôle. \n \n Votre bête a été provoquée par la rage que vous ressentez maintenant et elle essaie de se libérer. Les bords de votre vision rougissent lorsque vous affûtez votre vue sur ce qui vous a traversé. Vos poings se serrent douloureusement pendant que vous essayez de vous retenir. S'il y a un moment pour combattre la bête, c'est maintenant, mais le laisser résoudre le problème pour vous serait si facile ... "
 POD_vampire_frenzy_events.601.succumb:0 "Succombez à la frénésie"
 POD_vampire_frenzy_events.601.succumb.beast:0 "#R Laissez-moi vous montrer une vraie satisfaction."
 POD_vampire_frenzy_events.601.fight:0 "Combattez la frénésie"
 POD_vampire_frenzy_events.601.fight.beast:0 "#R Ce n'est pas assez. Cela ne VOUS suffit pas."
 POD_vampire_frenzy_events.601.fightwp:0 "Combattez la frénésie de toute votre volonté"
 POD_vampire_frenzy_events.601.fightwp.beast:0 "#R Si ce n'est pas aujourd'hui, alors demain ... mieux vaut abandonner maintenant chérie."
 POD_vampire_frenzy_events.601.troops:0 "Ces gardes là-bas semblent être un bon combat ..."
 POD_vampire_frenzy_events.601.troops.beast:0 "#R Quoi? eux ? Au moins, choisissez quelqu'un qui serait un défi."
 POD_vampire_frenzy_events.601.person:0 "Je voulais combattre cette personne depuis des années ..."
 POD_vampire_frenzy_events.601.person.beast:0 "#R Combien de temps les laisserez-vous vous marcher dessus?"
 POD_vampire_frenzy_events.601.social:0 "Je brise l'objet le plus proche de moi!"
 POD_vampire_frenzy_events.601.social.beast:0 "#R Perforer un mur ... Comme c'est original."
 POD_vampire_frenzy_events.601.breach:0 "Je montrerai ma colère aux humbles mortels!"
 POD_vampire_frenzy_events.601.breach.beast:0 "#R Oui, laissez-les se recroqueviller devant nous!"
 POD_vampire_frenzy_events.601.fight.failed:0 "La bête prend le dessus"
 POD_vampire_frenzy_events.701.desc:0 "Vous vous promeniez dans la cour quand l'un de vos courtisans a osé faire un commentaire méchant sur votre personnage. Immédiatement, vous avez frénétique et vous êtes précipité chez le courtisan. Heureusement, un régiment de gardes entraînés et équipés se tenait entre vous et le pauvre courtisan. Vous êtes assez fier de ces hommes d'élite - vous les avez formés vous-même, exactement pour faire face aux vampires. Maintenant, cependant, vous pourriez regretter de les avoir entraînés, car ils utilisent efficacement vos propres tactiques contre vous. \n \nVous êtes appréhendé avant de pouvoir causer un préjudice majeur, mais vous n'êtes pas resté sans contact ni votre réputation. "
 POD_vampire_frenzy_events.701.a:0 "Contrarié par mes propres hommes."
 POD_vampire_frenzy_events.701.t:0 "Rage de frénésie: Répercussions"
 POD_vampire_frenzy_events.801.t:0 "Rage de frénésie: Répercussions"
 POD_vampire_frenzy_events.801.desc:0 "Rage de frénésie: Répercussions"
 POD_vampire_frenzy_events.801.victorydesc:0 "Vous regardez votre vassal [target.GetTitledFirstName] couché sur le sol dans la douleur. Vous vous souvenez de ce qui s'est passé - [target.GetTitledFirstName] vous a traité avec dédain ces derniers temps, et cela commençait à affecter votre relation professionnelle. Vous êtes allé dans sa chambre l'affronter, et [target.GetSheHe] a osé rejeter vos accusations! \n\n Cette critique scandaleuse vous a fait rentrer en frénésie et le résultat est devant vous. Si ce qui s'est passé quitté la pièce, le résultat serait désastreux. Non seulement votre vassal vous en voudra, mais votre royaume tout entier ridiculisera votre manque de contrôle. \n\n And yet... You and [target.GetTitledFirstName] est seul ici. Il est toujours possible de s'assurer que ce qui s'est passé reste dans cette salle. "
 POD_vampire_frenzy_events.801.lossdesc:0 "Vous regardez votre vassal [target.GetTitledFirstName], tenant votre estomac dans la douleur. Vous vous souvenez de ce qui s'est passé - [target.GetTitledFirstName] vous a traité avec dédain ces derniers temps, et cela commençait à affecter votre relation professionnelle. Vous êtes allé dans sa chambre l'affronter, et [target.GetSheHe] a osé rejeter vos accusations! \n\n Cette critique scandaleuse vous a fait rentrer en frénésie et le résultat est devant vous. Si ce qui s'est passé quitté la pièce, le résultat serait désastreux. Non seulement votre vassal vous en voudra, mais votre royaume tout entier ridiculisera votre manque de contrôle. Et en plus, vous avez perdu! \n\n Et pourtant ... vous et [target.GetTitledFirstName] êtes seuls ici. Il est toujours possible de s'assurer que ce qui s'est passé reste dans cette salle."
 POD_vampire_frenzy_events.801.kill:0 "Personne ne sortira d'ici ..."
 POD_vampire_frenzy_events.801.bribe:0 "Si [target.GetSheHe] promet de ne rien dire, je lui donne une faveur."
 POD_vampire_frenzy_events.801.leave:0 "Je ne resterai pas ici encore un instant, quels que soient l'opinion des autres."
 POD_vampire_frenzy_events.901.t:0 "Rage de frénésie: Répercussions"
 POD_vampire_frenzy_events.901.desc:0 "La fête se passait bien jusqu'à ce que deux de vos invités ivres décident de se bagarrer au milieu de la piste de danse. Vous leur ordonnez de s'arrêter et ils vous ignorent effrontément. Vous répétez votre commande, plus fort cette fois. Ils vous défient encore. Bouillonnant de colère, vous vous dirigez vers eux et leur criez, sans effet. L'indignité! \n \n Vous essayez de les séparer physiquement et ils ont l'audace de vous pousser. Toi, leur légitime liège! Votre rage submerge votre raison lorsque vous criez et frappez un pilier assez fort pour le briser. Tout le monde vous regarde maintenant, et vous réalisez à quoi cela doit ressembler - vous avez perdu votre sang-froid et causé des dommages à votre propre château. Vous pouvez déjà voir quelques regards désapprobateurs."
 POD_vampire_frenzy_events.901.a:0 "Cela coûtera de l'or à réparer."
 POD_vampire_frenzy_events.101.t:0 "Rage de frénésie: Répercussions"
 POD_vampire_frenzy_events.101.desc:0 "Vous regardez vos mains ensanglantées, votre bouche laisse échapper des gouttes de vitae sur vos vêtements déchirés et sales. Cela a été toute une nuit ... Vous ne vous rappelez pas comment cela a commencé, mais vous vous souvenez être sorti dans les rues mortelles avec rage et avoir détruit tout ce qui était en vue. Vous vous sentiez comme un dieu - imparable, tout-puissant et terrifiant. Les mortels s'enfuient dans la peur, et les rares qui ont résisté sont tombés entre vos crocs. \n \n En laissant de côté les implications morales de vos actions horribles, vous avez fait beaucoup de bruit dans le monde des mortels. Peu de gens se sont échappés, mais ceux qui l'ont fait répandront sûrement des histoires sur votre grand pouvoir et votre monstruosité. Cela effraiera vos sujets à coup sûr, mais attirera également une attention indésirable."
 POD_vampire_frenzy_events.101.a:0 "Les choses que je peux faire si je cède le contrôle ..."
 
 POD_vampire_frenzy_events.801.toast:0 "Vous avez perdu un combat avec [target.GetTitledFirstName]"
 
 
 
 
 