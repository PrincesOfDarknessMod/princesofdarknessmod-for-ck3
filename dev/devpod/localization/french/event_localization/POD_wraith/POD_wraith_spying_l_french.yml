l_french:
 POD_wraith_spying.100.t:0 "Yeux invisibles"
 POD_wraith_spying.100.desc:0 "Vous vous sentez surveillé. Quelque chose ne va pas. Vous craignez que si vous continuez à fonctionner comme d'habitude, la présence inconnue en déduira vos secrets.\n Peut-être le moment est-il venu pour les doubles corporels, les codes et autres moyens de dérouter un observateur. Bien sûr, vous pourriez être paranoïaque ....."
 POD_wraith_spying.100.option.a:0 "Exerce ma volonté et cache mes secrets."
 POD_wraith_spying.100.option.b:0 "Cachez mes secrets."
 POD_wraith_spying.100.option.c:0 "C'est juste dans mon imagination."
 
 POD_wraith_spying.200.t:0 "Espionner[recipient.GetFirstNameNoTooltip]"
 POD_wraith_spying.200.desc:0 "Le moment est venu d'utiliser mon invisibilité sur [recipient.GetTitledFirstName] et découvrir quelques secrets, mais [recipient.GetSheHe] résiste."
 POD_wraith_spying.200.option.a:0 "Continuez quand même."
 POD_wraith_spying.200.a.tt_willpower:0 "[recipient.GetFirstNameNoTooltip] a exercé sa volonté de mieux cacher ses mouvements et conversations."
 POD_wraith_spying.200.a.tt_auspex:0 "Les pouvoirs de [recipient.GetFirstNameNoTooltip] lui permettent de voir l'invisible, vous privant de votre invisibilité."
 POD_wraith_spying.200.a.success.desc:0 "Victoire"
 POD_wraith_spying.200.a.tt_success:0 "les secrets de[recipient.GetTitledFirstName] me seront connus!"
 POD_wraith_spying.200.a.failure.desc:0 "Défaite"
 POD_wraith_spying.200.a.tt_failure:0 "[recipient.GetTitledFirstName] a résisté à ma tentative d'espionnage."
 POD_wraith_spying.200.option.b:0 "Exerce ma volonté. Je connaitrai tous ses secrets !"
 
 POD_wraith_spying.200.option.c:0 "Abandonner cette entreprise, je ne souhaite plus l'espionner."
 POD_wraith_spying.200.option.c.tt:0 "La tentative échouera."
 
 
 POD_wraith_spying.300.t:0 "[recipient.GetFirstNameNoTooltip] secrets trouvés."
 POD_wraith_spying.300.desc:0 "j'ai appris des secrets de l'observation de [recipient.GetTitledFirstName]."
 POD_wraith_spying.300.option.a:0 "Tout se passse comme il se doit."
 

 POD_wraith_spying.400.t:0 "Vos secrets ont été révélés"
 POD_wraith_spying.400.desc:0 "Ayant échoué dans la tentative de cacher vos possessions et conversations de [actor.GetTitledFirstName], vos secrets sont maintenant connus de [actor.GetHerHim]." 
 POD_wraith_spying.400.option.a:0 "Mes secrets ne sont plus cachés."
 
 POD_wraith_spying.500.t:0 "Espionnage déjoué"
 POD_wraith_spying.500.desc:0 "[recipient.GetTitledFirstName] a résisté à ma tentative d'espionner [recipient.GetHerHim]." 
 POD_wraith_spying.500.option.a:0 "Malédiction !"
 POD_wraith_spying.500.option.a.tt.beast:0 "#RIl faut connaitre les secrets de [recipient.GetTitledFirstName]!#"

 POD_wraith_spying.600.t:0 "Espionnage déjoué"
 POD_wraith_spying.600.desc:0 "[actor.GetTitledFirstName] a abandonné la tentative d'espionner [recipient.GetTitledFirstName]." 
 POD_wraith_spying.600.option.a:0 "Mes secrets sont en sécurité!"
 POD_wraith_spying.600.toasttitle:0 "Esprit déjoué!"
 POD_wraith_spying.600.toasttext:0 "Le spectre que vous avez envoyé n'a appris aucun des secrets de vos cibles."
 POD_wraith_spying.300.toasttitle:0 "Réussite du Spectre!"
 POD_wraith_spying.300.toasttext:0 "Votre Spectre a récupéré des informations précieuses pour votre usage."
 
 POD_wraith_possession_toast_title:0 "Réussite du Fantôme!"
 POD_wraith_possession_toast_text:0 "Votre spectre a réussi à posséder la cible, vous donnant un certain contrôle sur eux et leur donnant du pouvoir."
 
 turned_to_wraith:0 "La cible mourra et renaîtra sous la forme d'un spectre dans votre cour."