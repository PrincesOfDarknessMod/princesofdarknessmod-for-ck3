l_french:

 POD_summon.100.t:0 "Vous êtes convoqué"
 POD_summon.100.desc:0 "Vous sentez comme une envie de venir à côté de [schemer.GetTitledFirstName]."
 POD_summon.100.option.a:0 "Exercez ma volonté pour résister à l’invocation. "
 POD_summon.100.option.b:0 "Refusez la convocation."
 POD_summon.100.option.c:0 "Acceptez la convocation."
 
 POD_summon.200.t:0 "Convoqué [target.GetFirstNameNoTooltip]"
 POD_summon.200.desc:0 "Je sens mon énergie mystique toucher l’esprit de [target.GetTitledFirstName]. [target.GetSheHe|U] résiste à l’invocation."
 POD_summon.200.option.a:0 "Réveillez le sang pour qu'[target.GetSheHe] vienne à moi."
 POD_summon.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] est doué pour la discipline de la Force d'âme et résiste à mes pouvoirs."
 POD_summon.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] a exercé sa volonté afin de résister à mes pouvoirs."
 POD_summon.200.a.success.desc:0 "Victoire"
 POD_summon.200.a.tt_success:0 "[target.GetTitledFirstName] arrivera dans ma cour"
 POD_summon.200.a.failure.desc:0 "Échec"
 POD_summon.200.a.tt_failure:0 "[target.GetTitledFirstName] résistera à mon invocation"
 POD_summon.200.option.b:0 "Réveillez le sang et exercez ma volonté. On ne me refusera pas !"
 POD_summon.200.option.b.tt.beast:0 "#R Oui ! Amenez-les nous !"
 POD_summon.200.option.c:0 "Abandonnez, je ne veux plus de l'avoir dans ma cour"
 POD_summon.200.option.c.tt:0 "La convocation échouera."
 POD_summon.200.option.c.tt.beast:0 "#R Non ! [target.GetSheHe|U] s’en va !#"

 POD_summon.300.t:0 "[target.GetFirstNameNoTooltip] est convoqué"
 POD_summon.300.desc:0 "Grâce à l’utilisation de mon pouvoir mystique, [target.GetTitledFirstName] est arrivé à ma cour."
 POD_summon.300.option.a:0 "Bienvenue chez moi, dit l’araignée à la mouche."
 POD_summon.300.option.a.tt.beast:0 "#R C'est l'heure du dîner !#"

 POD_summon.400.t:0 "Vous êtes arrivé"
 POD_summon.400.desc:0 "Vous vous trouvez dans la cour de [schemer.GetTitledFirstName]." 
 POD_summon.400.option.a:0 "Mon nouveau chez-moi."
 
 POD_summon.500.t:0 "Résisté à l’invocation"
 POD_summon.500.desc:0 "[target.GetTitledFirstName] a résisté à mon invocation." 
 POD_summon.500.option.a:0 "Déjoué !"
 POD_summon.500.option.a.tt.beast:0 "#R Chassons-[target.GetHerHim] et mangeons-[target.GetHerHim] !#"

 POD_summon.600.t:0 "Résistance à la convocation"
 POD_summon.600.desc:0 "Vous sentez plus intensément [schemer.GetTitledFirstName] vous appeller." 
 POD_summon.600.option.a:0 "Restez en dehors de mon esprit !"


