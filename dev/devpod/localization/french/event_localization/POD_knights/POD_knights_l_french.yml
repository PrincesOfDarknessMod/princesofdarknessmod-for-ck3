l_french:

 pod_knights.1.t:0 "Le Chevalier arrogant"
 pod_knights.1.desc:0 "Vous avez été informé que l'un de vos champions a été négligent récemment. Impliqué dans un combat avec des mortels, [knight.GetSheHe] a utilisé les pouvoirs du sang pour les écraser facilement, une brèche claire de la mascarade.Pire, [knight.GetSheHe] s'en est vanté en ville!\nCe comportement attirera sûrement le regard indésirable de l'Inquisition, mais vous pourrez peut-être encore sauver la situation si vous interrompez votre partenariat avec cet ennuyeux fanfaron."
 pod_knights.1.a:0 "Sortez de ma vue, idiot!"
 pod_knights.1.b:0 "Tu es pardonné, pour cette fois..."
 pod_knights.2.t:0 "Le chevalier trompeur"
 pod_knights.2.desc:0 "L'un de vos champions a été une épine dans votre pied pendant trop longtemps. Répandant rumeurs après des rumeurs, vous avez pensé pendant un moment que [knight.GetSheHe] préparait un complot contre vous. Mais après une enquête minutieuse, vous êtes presque sûr que cela est en fait plus pour vous irriter que pour un éventuel complot.\nNéanmoins, il s'agit d'une menace claire pour votre crédibilité et vous voudrez peut-être agir le plus tôt possible."
 pod_knights.2.a:0 "Allez-vous-en !"
 pod_knights.2.b:0 "... Trop important pour simplement l'ignorer."
 pod_knights.3.t:0 "Le chevalier courroucé" 
 pod_knights.3.desc:0 "Vous ne savez pas comment cela a vraiment commencé. Mais l'un de vos champions, connu pour être assez fougueux, a sauté dans la frénésie au milieu de votre cour pour une insulte insignifiante. Vous avez deux options, vous pouvez appeler les gardes et vos autres guerriers pour maîtriser ce berserker. Cependant, une telle honte sociale signifierait probablement que [knight.GetSheHe] ne reviendra jamais à votre service.\nOu vous pouvez simplement laisser la frénésie suivre son cours, insensible aux victimes potentielles de celle-ci ..."
 pod_knights.3.a:0 "Sortez cette bête hors de ma vue"
 pod_knights.3.b:0 "C'est l'heure d'un petit massacre, je suppose"
 pod_knights.4.t:0 "Le lâche Chevalier" 
 pod_knights.4.desc:0 "Un de vos champions est un lâche connu. Toujours à la recherche d'un moyen de sortir des combats, [knight.GetSheHe] est devenue la risée de votre cour, même si personne n'ose le dire à haute voix ... pour le moment. Vous prévoyez clairement que cela changera assez tôt, et ce sera une tache sur votre prestige d'accueillir un tel individu.\nVous pouvez simplement l'endurer ou retirer le lâche de votre service avant qu'il ne devienne un problème."
 pod_knights.4.a:0 "Expulsez cet idiot hors de ma cour"
 pod_knights.4.b:0 "Laisse-les parler, je m'en fiche"
 pod_knights.5.t:0 "Le Chevalier avare" 
 pod_knights.5.desc:0 "C'est la quatrième fois ce mois-ci qu'un de vos champions demande plus d'argent. Vous ne savez même pas s'il s'agit d'armure, d'armes ou de cheval maintenant. Ou peut-être [knight.GetSheHe]ne se souciait même pas d'en cacher la pure gourmandise cette fois.\nDe toute évidence, vous avez le droit de l'arrêter maintenant, mais peut-être valorisez-vous plus les prouesses martiales que l'or?"
 pod_knights.5.a:0 "Jette ce déchet hors de ma cour"
 pod_knights.5.b:0 "Vous aurez votre foutu cheval, ou armure, peu m'importe"
 pod_knights.6.t:0 "Le Chevalier paranoiaque" 
 pod_knights.6.desc:0 "Un de vos champions accuse ... enfin presque tout le monde de comploter contre votre règne légitime. Qu'ils soient mortels, courtisans, vassaux ou passant au hasard. Vous êtes à peu près sûr qu'il s'agit d'une légère simplification excessive de la situation, mais ... peut-être [knight.GetSheHe] a raison.\nVos conseillers vous disent de chasser cette mauvaise influence de votre cour mais ... peut-être sont-ils aussi impliqués dans cette conspiration ?!"
 pod_knights.6.a:0 "Ils ont peut être raison ..."
 pod_knights.6.b:0 "Des traitres! Partout !"
 pod_knights.7.t:0 "Le cynique Chevalier" 
 pod_knights.7.desc:0 "Toujours l'avocat du diable, l'un de vos champions harcèle constamment la cour, et vous-même, à propos de l'hypocrisie des routes et de la victoire inévitable de la Bête sur tous les Caïnites à la fin. Certains de vos courtisans vous ont demandé de retirer ce personnage cynique de votre entourage avant que ses discours ne commencent à éroder la volonté de tous vos adeptes."
 pod_knights.7.a:0 "Le salut de l'âme n'a pas de prix"
 pod_knights.7.b:0 "... mais ça peut attendre un peu plus longtemps"
 pod_knights.8.t:0 "Le Chevalier vengeur" 
 pod_knights.8.desc:0 "Un champion est venu vers vous, demandant vengeance contre une légère perception [knight.GetSheHe] enduré dans une ville voisine. Vous savez que ce personnage est très passionné par ces questions et cela pourrait aller loin, très loin. Mais tu sais aussi que [knight.GetSheHe] ne prendra pas gentiment si vous dites non à cette demande ..."
 pod_knights.8.a:0 "Occupe toi de ça toi-même"
 pod_knights.8.b:0 "J'aiderai, mais nous ne brûlerons pas tout l'endroit! ... Pas tout du moins"

   
   
   
   
   
   
  
   
   
  
 
