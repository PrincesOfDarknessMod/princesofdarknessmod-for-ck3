l_french:
 
 #Hunter
 hunter_faction:0 "Répression de l'Inquisition"
 hunter_faction_desc:0 "Les seigneurs vampires avec trop d’exposition et trop peu de contrôle risquent d’attirer l’attention de l’Inquisition."
 hunter_faction_short_effect_desc:0 "Veux libérer le peuple de..., et bien de toi"
 hunter_faction_every_county:0 "Chaque comté de la faction"
 FACTION_DEMAND_HUNTER:1 "Vers le [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_HUNTER_DESC:0 "Engendrez l’Enfer, préparez-vous à affronter l’abîme qui vous a donné naissance. Votre contrôle impie sur les pauvres âmes de ce royaume prend fin maintenant !"
 FACTION_DEMAND_HUNTER_ACCEPT:0 "Je ne suis pas prêt à combattre ces chasseurs..."
 FACTION_DEMAND_HUNTER_REFUSE:0 "Jamais ! Écrasons ces mortels glorifiés au combat !"
 FACTION_HUNTER_NAME:0 "Cellule de l'Inquisition"
 FACTION_HUNTER_TITLE_NAME:0 "Cellule de l'Inquisition"
 hunter_faction_event_troops:0 "Inquisitorium Militum"
 pod_factions.1103.t:0 "Vous êtes vaincu"
 pod_factions.1103.desc:0 "Malgré votre défense concertée, les chasseurs ont submergé la plupart de votre royaume, déracinant votre réseau d’influence soigneusement construit à travers elle. Votre prestige est gravement blessé, et votre autorité est à un niveau bas. Les vautours observent... et les chasseurs pourraient revenir à tout moment. Vous pourriez ramper en arrière de cela, mais il vous coûterait cher. En tant que tel, le sommeil des âges est une perspective alléchante. Le temps n’est pas préoccupant de toute façon..."
 pod_factions.1103.a:0 "Je reviendrai"
 pod_factions.1103.b:0 "Je n’en ai pas encore fini !"
