l_french:
 predatortype_farmer_modifier:0 "Prédateur de Type : Fermier"
 predatortype_farmer_modifier_desc:0 "Ce vampire préfère se nourrir d’animaux."
 predatortype_bloodleech_modifier:0 "Prédateur de Type : Cannibale"
 predatortype_bloodleech_modifier_desc:0 "Ce vampire préfère se nourrir du sang des autres vampires !"
 predatortype_phlebotomist_modifier:0 "Prédateur de Type : Phlébologue"
 predatortype_phlebotomist_modifier_desc:0 "Ce vampire acquiert de la vitae sous le couvert d’un médecin effectuant des saignées."
 predatortype_bedlamite_modifier:0 "Prédateur de Type : Forcené"
 predatortype_bedlamite_modifier_desc:0 "Ce vampire s’attaque aux fous. Ils peuvent aussi être fous, ou apparaître comme tels à leur proie."
 predatortype_cenobite_modifier:0 "Prédateur de Type : Cénobite"
 predatortype_cenobite_modifier_desc:0 "Ce vampire a un troupeau dans une institution religieuse comme un monastère."
 predatortype_alleycat_modifier:0 "Prédateur de Type : Rôdeur"
 predatortype_alleycat_modifier_desc:0 "Ce vampire traque et attaque violemment les mortels pour obtenir le sang. C’est une approche vulgaire."
 predatortype_cauchemar_modifier:0 "Prédateur de Type : Cauchemar"
 predatortype_cauchemar_modifier_desc:0 "Ce vampire ne se nourrit que de ceux qui dorment."
 predatortype_familias_modifier:0 "Prédateur de Type : Familias"
 predatortype_familias_modifier_desc:0 "Ce vampire se nourrit presque exclusivement d’une dynastie particulière.  Ils peuvent même être liés à la famille, du moins c’est ce que la famille pense."
 predatortype_footpad_modifier:0 "Prédateur de Type : Voleur de Grand Chemin"
 predatortype_footpad_modifier_desc:0 "Ce Vampire vit avec les petites-gens, prenant le sang des pauvres. S’ils disparaissent, les autorités ne montra aucun intérêt."
 predatortype_consensualist_modifier:0 "Prédateur de Type : Consensualiste"
 predatortype_consensualist_modifier_desc:0 "Ce vampire ne se nourrit que de volontaires. Cela complique grandement la Mascarade."
 predatortype_osiris_modifier:0 "Prédateur de Type : Adorateur"
 predatortype_osiris_modifier_desc:0 "Ce vampire mène un culte du sang, comme dans les temps anciens. Les mortels l'adorent et s’offrent librement à ce dieu du sang."
 predatortype_siren_modifier:0 "Prédateur de Type : Séducteur"
 predatortype_siren_modifier_desc:0 "Ce vampire séduit des amoureux pour drainer leur sang par le baiser."
 predatortype_gentry_modifier:0 "Prédateur de Type : Nobles"
 predatortype_gentry_modifier_desc:0 "Ce vampire a un certain statut dans la société des mortels. Ils utilisent ce statut pour chasser les riches et les puissants. Personne ne croira que quelqu’un d’aussi raffiné est un monstre."
 predatortype_graverobber_modifier:0 "Prédateur de Type : Pilleur de Tombes"
 predatortype_graverobber_modifier_desc:0 "Ce vampire hante les cimetières et les cryptes, s’attaquant aux personnes en deuil et au sang froid des personnes récemment décédées." 
 predatortype_extortionist_modifier:0 "Prédateur de Type : Extortioniste"
 predatortype_extortionist_modifier_desc:0 "Ce vampire menace et exploite les mortels pour leur sang. Les extorqueurs font des 'offres' qui ne peuvent être refusées."
 
 

