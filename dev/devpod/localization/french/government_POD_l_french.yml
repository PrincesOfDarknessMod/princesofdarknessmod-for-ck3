l_french:
 traditions_government:0 "Traditions"
 traditions_government_adjective:0 "Traditionel"
 traditions_government_realm:0 "Royaume Caïnite"
 traditions_government_vassals_label:1 "Les [obligations|E] de Cainite sont basées sur le [feudal_contract|E] de chaque [vassal|E]"
 traditions_government_desc:1 "La grande majorité des royaumes de Vampires suivent les Traditions de Caïn, un code de conduite assez approximatif sur la façon de se comporter avec les mortels et d’autres parents."
 free_state_government:0 "État-Libre"
 free_state_government_adjective:0 "Libre"
 free_state_government_realm:0 "État-Libre"
 free_state_government_vassals_label:1 "Les [obligations|E] des vassaux sont basés sur l’opinion de chaque [vassal|E] du chef du royaume."
 free_state_government_desc:1 "N’acceptant pas les lois de Caïn, les États Libres sont une alliance lâche de caïnites d’esprit similaire se réunissant autour d’un dirigeant charismatique."
 inquisition_government:0 "Ordre de l'Inquisition"
 inquisition_government_adjective:0 "Inquisition"
 inquisition_government_realm:0 "Ordre de l'Inquisition"
 inquisition_government_vassals_label:1 "Les obligations des Inquisiteurs sont basées sur leur opinion."
 inquisition_government_desc:1 "Une cellule d’inquisiteurs, détruisant l’influence surnaturelle où qu’ils la trouvent."

 legacy_rights:0 "#BLOODRED La Première Traditions : Le Pacte#!"
 legacy_rights_none:0 "Religiously Non-protégé religieusement"
 legacy_rights_none_short:0 "#BLOODRED Obligatoire#!"
 legacy_rights_none_desc:2 "« Ton sang fait de toi ma couvée, taillée à mon image. Ma malédiction est à toi, et mon salut est à toi. Je me tiens devant et au-dessus de toi comme dieu-régent. Je suis le chemin, mes Traditions mon alliance. Renoncez à moi et renoncez à tout espoir. » Ainsi parlait Caïn.\n\nLe [liege|E] peut [demand_conversion|E] du [vassal|E]\nLe [liege|E] peut utiliser [convert_county|E] dans les terres des [vassals|E]."
 legacy_rights_protected:0 "Protégé religieusement"
 legacy_rights_protected_desc:2 "“Ton sang fait de toi ma couvée, taillée à mon image. Ma malédiction est à toi, et mon salut est à toi. Je me tiens devant et au-dessus de toi comme dieu-régent. Je suis le chemin, mes Traditions mon alliance. Renoncez à moi et renoncez à tout espoir. » Ainsi parlait Caïn.\n\nLe [liege|E] ne peut pas [demand_conversion|E] du [vassal|E]\nLe [liege|E] ne peut pas utiliser [convert_county|E] dans les terres des [vassals|E] \n#flavor Le [vassal|E] bénéficie d’un statut spécial protégé, le royaume reconnaissant officiellement son droit de pratiquer sa propre [faith|E].#!"
 legacy_rights_protected_short:0 "#BLOODRED Facultatif#!"

 destruction_rights:0 "#BLOODRED La Cinquième Tradition : La Destruction#!"
 destruction_rights_none:0 "Aucun droit de destruction"
 destruction_rights_none_desc:0 "« Il t’est interdit de répandre le sang d’un autre de ton espèce qui est ancien. Ce droit n’appartient qu’au plus proche de moi et à aucun autre. Il est interdit à ceux qui ont le sang le plus faible de s’élever contre leurs aînés. C’est ma dernière alliance. » C’est ce qu’a dit Caïn.\n\n#flavor Le [vassal] n’est pas autorisé à détruire un parent dans leur domaine. Seul le [liege] peut appeler une chasse au sang."
 destruction_rights_none_short:0 "#BLOODRED Aucun#!"
 destruction_rights_allowed:0 "Destruction autorisé"
 destruction_rights_allowed_desc:0 "« Il t’est interdit de répandre le sang d’un autre de ton espèce qui est ancien. Ce droit n’appartient qu’au plus proche de moi et à aucun autre. Il est interdit à ceux qui ont le sang le plus faible de s’élever contre leurs aînés. C’est ma dernière alliance. » C’est ce qu’a dit Caïn. \nLe [liege] permet au [vassal] de faire respecter les Lextalionis et d’appeler une chasse au sang dans le domaine du [vassal]. #!"
 destruction_rights_allowed_short:0 "#BLOODRED Autorisé#!"
 destruction_rights_open_war:0 "Guerre ouverte"
 destruction_rights_open_war_desc:0 "« Il t’est interdit de répandre le sang d’un autre de ton espèce qui est ancien. Ce droit n’appartient qu’au plus proche de moi et à aucun autre. Il est interdit à ceux qui ont le sang le plus faible de s’élever contre leurs aînés. C’est ma dernière alliance. » C’est ce qu’a dit Caïn.#bold [vassal|E] Privileges:#!#!\nThe [vassal|E] can declare [war|E] regardless of the [lieges|E] [crown_authority|E]\nThe [vassal|E] pays #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! less for [casus_bellis|E] within the [realm|E]\n\n#flavor The [vassal] does not have to spend a [hook] if their [lieges] [crown_authority] prevents them from waging war. This special treatment also makes it easier for the [vassal] to declare wars inside the [realm|E], reducing the cost by #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
 destruction_rights_open_war_short:0 "#BLOODRED Guerre ouverte#!"
 
 progeny_rights:0 "#BLOODRED La Troisième Tradition : La Progéniture#!"
 progeny_rights_none:0 "Aucun droit de progéniture"
 progeny_rights_none_short:0 "#BLOODRED Aucun#!"
 progeny_rights_none_desc:0 "« Tu n’en engendreras un autre qu’avec la permission et la bénédiction de ton ancien. Créer est la providence de ceux qui sont les plus proches de moi, car ils devront rendre des comptes. Brisez cela, et toi et ta progéniture serez tués. » Ainsi parlait Caïn.\n\nLe [vassal] n’a pas le droit de créer la progéniture par leur [liege]. Même la création de goules est interdite."
 progeny_rights_granted:0 "Équipement complet pour la progéniture"
 progeny_rights_granted_short:0 "#BLOODRED Any#!"
 progeny_rights_granted_desc:0 "« Tu n’en engendreras un autre qu’avec la permission et la bénédiction de ton ancien. Créer est la providence de ceux qui sont les plus proches de moi, car ils devront rendre des comptes. Brisez cela, et toi et ta progéniture serez tués. » Ainsi parlait Caïn.\n\nLe [vassal] a tous les droits pour créer la progéniture par leur [liege]. Ceci inclut les enfants vampiriques et les goules."
 progeny_rights_ghouls:0 "Droits de création Ghoul"
 progeny_rights_ghouls_short:0 "#BLOODRED Goules#!"
 progeny_rights_ghouls_desc:0 "« Tu n’en engendreras un autre qu’avec la permission et la bénédiction de ton ancien. Créer est la providence de ceux qui sont les plus proches de moi, car ils devront rendre des comptes. Brisez cela, et toi et ta progéniture serez tués. » Ainsi parlait Caïn.\n\nLe [vassal] a été accordé par leur [liege] les droits de créer des goules, mais pas un enfant vampirique."
 progeny_rights_childer:0 "Droits des parents"
 progeny_rights_childer_short:0 "#BLOODRED Parents#!"
 progeny_rights_childer_desc:0 "« Tu n’en engendreras un autre qu’avec la permission et la bénédiction de ton ancien. Créer est la providence de ceux qui sont les plus proches de moi, car ils devront rendre des comptes. Brisez cela, et toi et ta progéniture serez tués. » Ainsi parlait Caïn.\n\nLe [vassal] a été accordé par leur [liege] les droits à l’enfant vampirique, mais pas goules."

 blood_oaths:0 "#BLOODRED La Quatrième tradition : La Comptabilité#!"
 blood_oaths_none:0 "Aucun serment de sang requis"
 blood_oaths_none_short:0 "#BLOODRED Plein gré#!"
 blood_oaths_none_desc:0 "« Ceux que tu as créés sont ton propre sang jusqu’à ce que tu les libères de ta charge. Jusqu’à ce moment-là, leurs péchés, leur sang et leurs châtiments sont à toi. » Ainsi parlait Caïn.\n\nLe [vassal] n’est pas tenu de prêter un serment de sang à son [liege]."
 blood_oaths_required:0 "Serment de sang requis"
 blood_oaths_required_short:0 "#BLOODRED Serment de sang#!"
 blood_oaths_required_desc:0 "« Ceux que tu as créés sont ton propre sang jusqu’à ce que tu les libères de ta charge. Jusqu’à ce moment-là, leurs péchés, leur sang et leurs châtiments sont à toi. » Ainsi parlait Caïn.\n\nLe [vassal] doit prêter serment de sang à son [liege] et consommer un élixir du sang de son [liege]. C’est un lien de sang mineur et un hameçon faible."
 
 domain_revocation_rights:0 "#BLOODRED La Seconde Tradition : Le Domaine#!"
 domain_revocation_rights_default:0 "Domaine Révocable selon la volonté du Seigneur"
 domain_revocation_rights_default_short:0 "#BLOODRED Révocable#!"
 domain_revocation_rights_default_desc:0 "Le [liege] peut révoquer un domaine si les lois de la couronne le permettent." 
 domain_revocation_rights_protected:0 "Domaine protégé"
 domain_revocation_rights_protected_desc:0 "« Comme je suis maître de Nod, ton domaine t’appartient, tu en es le maître, et tout le monde le respectera ou subira ta colère. Tous se présenteront en entrant, et tu les protègeras à leur tour. Par droit, vous êtes autorisé à chasser dans les limites de votre domaine, son sang vous appartient. Acceptez sa responsabilité, occupez votre domaine et accordez aux autres le même respect que vous attendez. » C’est ce qu’a dit Caïn.\n\nLe [liege|E] ne peut révoquer les [titles|E] du vassal\n\n#flavor Le [vassal] est la propriété garantie de ses [titres], empêchant le [liege|E] de les révoquer – indépendamment du [liege|E] ayant un [revoke_title_reason] ou non.#!"
 domain_revocation_rights_protected_short:0 "#BLOODRED Protégé#!"
 
 masquerade_protocol:0 "#BLOODRED La Sixième Tradition : La Mascarade#!"
 masquerade_protocol_none:0 "Pas de Masquerade"
 masquerade_protocol_none_desc:0 "#flavor Le [liege] n’impose pas le Silence du Sang dans le domaine du [vassal]."
 masquerade_protocol_none_short:0 "#BLOODRED Aucun!"
 masquerade_protocol_lax:0 "Lax Masquerade"
 masquerade_protocol_lax_desc:0 "« Tu ne révéleras jamais ta vraie nature à ceux qui ne sont pas du sang, et ce faisant, tu renonceras à tes prétentions à mes alliances. » C’est ce qu’a dit Caïn. \n\n#bold Le [liege] n’applique que les violations extrêmes du Silence du Sang dans le domaine du [vassal].#!"
 masquerade_protocol_lax_short:0 "#BLOODRED Lax#!"
 masquerade_protocol_strict:0 "Strict Masquerade"
 masquerade_protocol_strict_desc:0 "« Tu ne révéleras jamais ta vraie nature à ceux qui ne sont pas du sang, et ce faisant, tu renonceras à tes prétentions à mes alliances. » C’est ce qu’a dit Caine.\n\n#bold Le [liege] applique une interprétation stricte du Silence du Sang dans le domaine du [vassal].#!"
 masquerade_protocol_strict_short:0 "#BLOODRED Stricte#!" 
 
 blood_tithe:0 "#BLOODRED La Septième Tradition : Dîme du Sang#!"
 blood_tithe_none:0 "Pas de $blood_tithe$"
 blood_tithe_none_short:0 "#BLOODRED Aucune#!"
 blood_tithe_none_desc:0 "#bold Le [vassal] ne doit pas de dîme de sang à leur [liege]. #! "
 blood_tithe_required:0 "Dîme de sang apparenté"
 blood_tithe_required_short:0 "#BLOODRED Troupeau#!" 
 blood_tithe_required_desc:0 "#bold Sur demande, le [vassal] doit fournir un des membres du troupeau à la cour de leur [liege]. Typiquement, cela signifie la mort du mortel.#!" 
 blood_tithe_vampiric:0 "Dîme de Sang de Vitae Vassal"
 blood_tithe_vampiric_short:0 "#BLOODRED Votre Vitae#!"
 blood_tithe_vampiric_desc:0 "#bold Sur demande, le [vassal] doit fournir son propre sang vampirique à son [liege], ce qui augmentera la faim du donneur.#!"
 blood_tithe_childer:0 "Dîme de sang d'enfant"
 blood_tithe_childer_short:0 "#BLOODRED Vos enfants#!"
 blood_tithe_childer_desc:0 "#bold Sur demande, le [vassal] doit fournir un de ses enfants à son [liege], ce qui conduit souvent à la destruction de l’enfant.#!"

 primogen_rights:0 "#BLOODRED Droit Primogen#!"
 primogen_rights_none:0 "Aucun siège au conseil de Primogen"
 primogen_rights_none_desc:0 "#flavor Le [vassal] n’obtient aucun privilège hors de l’ordinaire quand il s’agit du [council] Primogen."
 primogen_rights_none_short:0 "#BLOODRED Aucun#!"
 primogen_rights_guaranteed:0 "Siège du Conseil de Primogen"
 primogen_rights_guaranteed_desc:0 "L'[interaction|E] forcé au conseil peut être utilisé a votre guise.\n\n#flavor Le [vassal] bénéficie de privilèges spéciaux du [conseil] Primogen et s’attend à un siège permanent au [conseil] de Primogen. Accorder ce privilège à trop de [vassaux] finira par bouleverser les [powerful_vassals] du [royaume|E].#!"
 primogen_rights_guaranteed_short:0 "#BLOODRED Garanti#!"
 

