 exalted_common_legacy_track_name: "Legacy of Exaltation"
 exalted_common_legacy_track_desc: "The last spark of divinity in this world is with us."
 exalted_common_legacy_1_name: "Gift of Exaltation"
 EXALTED_COMMON_LEGACY_1_PERK_EFFECT: "#flavor Exaltation gave us a gift, a gift we learnt to cherish.#!"
 exalted_common_legacy_2_name: "Magic of Exaltation"
 EXALTED_COMMON_LEGACY_2_PERK_EFFECT: "#flavor Magic has many facades, Exaltation reveled to us another one.#!"
 exalted_common_legacy_3_name: "Ancient Insight"
 EXALTED_COMMON_LEGACY_3_PERK_EFFECT: "Upon the completion of #V $exalted_hunt_for_ancient_tome_name$#! [journey|E] you will also learn the exact [exalted_ancient_sorcery|E] stored inside the newly discovered [Concept('exalted_ancient_sorcery', 'Ancient Repository')|E].\n#flavor A Spark of Exaltation shall reveal all the ancient secrets beneath the surface!#!"
 exalted_common_legacy_4_name: "Masters of Charms"
 EXALTED_COMMON_LEGACY_4_PERK_EFFECT: "When using an [Concept('exalted_charms', 'Active Charm')|E] you will have #V 50%#! to regain #P 1#! $POD_energy_essence$\n#flavor Skillful employment of Charms is crucial, and something we learnt long ago.#!"
 exalted_common_legacy_4_effect: "Because [GetPlayer.GetDynasty.GetName] has [GetDynastyPerk('exalted_common_legacy_4').GetName] you have #P 50%#! chance to regain #P 1#! $POD_energy_essence$."
 exalted_common_legacy_5_name: "Bountiful Essence"
 EXALTED_COMMON_LEGACY_5_PERK_EFFECT: "#flavor Essence is sparse in this world, but not for us.#!"

 exalted_terrestrial_legacy_track_name: "Legacy of Dragons"
 exalted_terrestrial_legacy_track_desc: "For in our veins flows the blood of dragons."
 exalted_terrestrial_legacy_1_name: "Bond Between Dragons"
 EXALTED_TERRESTRIAL_LEGACY_1_PERK_EFFECT: "#flavor We are all descendants of Dragons, there is no divide between us.#!"
 exalted_terrestrial_legacy_2_name: "Blood of Dragons"
 EXALTED_TERRESTRIAL_LEGACY_2_PERK_EFFECT: "#flavor Only the purest of blood can coexist with Dragon's essence.#!"
 exalted_terrestrial_legacy_3_name: "Empowered Dragon-Touched"
 EXALTED_TERRESTRIAL_LEGACY_3_PERK_EFFECT: "Every newly born $POD_splat_dragon_touched$ will have [GetModifier('POD_dragon_touched_longevity_modifier').GetNameWithTooltip] [modifier|E].\n#flavor Even those whose Dragon blood is impure, will benefit from it.#!"
 exalted_terrestrial_legacy_4_name: "Potent Bloodline"
 EXALTED_TERRESTRIAL_LEGACY_4_PERK_EFFECT: "#flavor Because Dragon blood cannot die.#!"
 exalted_terrestrial_legacy_5_name: "Dragons Never Die"
 EXALTED_TERRESTRIAL_LEGACY_5_PERK_EFFECT: "Every newly born $POD_splat_dragon_touched$ of $glossary_exalted$ will have [GetModifier('POD_dragon_touched_dragons_never_die_modifier').GetNameWithTooltip] [modifier|E].\n#flavor And that is the truth.#!"
