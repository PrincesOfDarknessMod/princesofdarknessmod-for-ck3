 eminence_legacy_4_name: "Infernal Duke"
 eminence_legacy_4_perk: "If you are a $POD_splat_demon$, you will receive:\n$TAB$A memory event about your past as an Angel.\n$TAB$Become a [GetModifier('powerful_eminence_modifier').GetNameWithTooltip].\n$TAB$Maximum yearly [arcana_lifestyle|E] Experience received from [cultists|E]: #P 5000#!"
 eminence_legacy_5_name: "Infernal Archduke"
