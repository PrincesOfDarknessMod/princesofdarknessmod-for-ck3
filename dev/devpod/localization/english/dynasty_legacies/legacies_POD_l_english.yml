 eminence_legacy_3_perk:0 "If your character has it, the "[GetModifier('respected_eminence_modifier').GetNameWithTooltip]" modifier will be upgraded to "[GetModifier('honored_eminence_modifier').GetNameWithTooltip]".\nMaximum yearly [arcana_lifestyle|E] Experience received from [thrall|E]: #P 4000#!"
 eminence_legacy_4_name:0 "Infernal Duke"
 eminence_legacy_4_perk:0 "If your character has it, the "[GetModifier('honored_eminence_modifier').GetNameWithTooltip]" modifier will be upgraded to "[GetModifier('powerful_eminence_modifier').GetNameWithTooltip]".\nMaximum yearly [arcana_lifestyle|E] Experience received from [thrall|E]: #P 5000#!"
 eminence_legacy_5_name:0 "Infernal Archduke"
 eminence_legacy_5_perk:0 "If your character has it, the "[GetModifier('powerful_eminence_modifier').GetNameWithTooltip]" modifier will be upgraded to "[GetModifier('exalted_eminence_modifier').GetNameWithTooltip]".\nMaximum yearly [arcana_lifestyle|E] Experience received from [thrall|E]: #P Unlimited#!"

