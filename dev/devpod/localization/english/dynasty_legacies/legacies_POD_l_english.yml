 mortuary_cult_mummy_legacy_1_perk:0 "Increases and extends the fertility of your Neteru.\n\n#flavor  Luthien's flavour text goes here.#!"
 mortuary_cult_mummy_legacy_2_perk:0 "Decreases the chance of your Neteru giving birth to children with negative traits.\n\n#flavor  Luthien's flavour text goes here.#!"
 mortuary_cult_mummy_legacy_3_perk:0 "Provides your Neteru with a large health boost.\n\n#flavor  Luthien's flavour text goes here.#!"
 mortuary_cult_mummy_legacy_4_perk:0 "Keeps your Neteru from losing prowess as they age.\n\n#flavor  Luthien's flavour text goes here.#!"
 mortuary_cult_mummy_legacy_5_perk:0 "Extends the average natural lifespan of you Neteru by 15 years\n\n#flavor  Luthien's flavour text goes here.#!"
  
  
 neutral_totems_legacy_track_name:0 "Spiritual Totems"
 neutral_totems_legacy_track_desc:0 "Some Totems are neutral and don't pick a tribe or a pack to support. They could be swayed to your cause if you demonstrated sufficient respect for their specific areas of interest."

 neutral_totems_legacy_1_name:0 "The Hawk"
 neutral_totems_legacy_1_perk:0 "@warning_icon!#X To unlock this dynasty perk, you need to become a Master Hunter. Starting as one doesn't count.#!"

 neutral_totems_legacy_2_name:0 "The Black Tortoise"
 neutral_totems_legacy_2_perk:0 "@warning_icon!#X To unlock this dynasty perk, you need to encounter the Black Tortoise and pass a challenge in the Spirit Wilds part of the Umbra.#!"
    
 neutral_totems_legacy_3_name:0 "The Hyena"
 neutral_totems_legacy_3_perk:0 "@warning_icon!#X To unlock this dynasty perk, you need to acquire the [GetTrait('viking').GetName( GetPlayer )] trait. Starting with it doesn't count.#!"

 neutral_totems_legacy_4_name:0 "The Sphinx"
 neutral_totems_legacy_4_perk:0 "@warning_icon!#X To unlock this dynasty perk for purchase you need to have the [GetTrait('scholar').GetName( GetPlayer )] trait and 20 Learning or more. You still need to be able to pay the renown cost and have unlocked the Hyena legacy.#!" 
 
 neutral_totems_legacy_5_name:0 "The Fox"
 neutral_totems_legacy_5_perk:0 "@warning_icon!#X To unlock this dynasty perk for purchase you need to have finished the three Intrigue lifestyle trees. You still need to be able to pay the renown cost and have unlocked the Sphinx legacy.#!"
  
 eminence_legacy_track_name:0 "Infernal Eminence"
 eminence_legacy_track_desc:0 "Demons have lost much of their memory and experience during their unpleasant stay in the Abyssal Prison. Who were they really?"
 eminence_legacy_1_name:0 "Infernal Slave"
 eminence_legacy_1_perk:0 "If your character has it, the "[GetModifier('unknown_eminence_modifier').GetNameWithTooltip]" modifier will be upgraded to "[GetModifier('known_eminence_modifier').GetNameWithTooltip]".\nMaximum yearly [arcana_lifestyle|E] Experience received from [thrall|E]: #P 2000#!"
