l_english:
 POD_dynasty_perk_fae_tooltip_gui: "[GetScriptedGui(Concatenate('POD_dynasty_perk_tooltip_', SCOPE.GetFlagName('saved_tooltip'))).IsValidTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('perk_level', MakeScopeValue(SCOPE.GetValue('perk_level'))).End)]"
 POD_dynasty_perk_fae_tooltip: "You have to meet additional requirements to acquire this [dynasty_perk|E]:"

 improve_ravaging: "Improve [ravaging|E] by giving #P +1#! Glamour regardless of [epiphanies_quality|E]."
 improve_reverie: "Improve [reverie|E] by acting like if all [Concept('relation', 'Special Relations')|E] had #P an additional#! [epiphanies_quality|E] point."
 
 aesin_legacy_track_name: "Aesin Legacy"
 aesin_legacy_track_desc: "House of Nature."
 aesin_legacy_1_name: "Call of the Wild"
 aesin_legacy_1_perk: "#flavor Aesin have claimed the dominion over the wild, Dreaming itself will guide feral animals to do our bidding.#!"
 aesin_legacy_2_name: "Aesin's Servants"
 aesin_legacy_2_perk: "#flavor 'The Nature itself is our domain, The Dreaming has declared so!'#!"
 aesin_legacy_3_name: "Worthy Prey"
 aesin_legacy_3_perk: "Base [gold|E] Cost of [GetActivityType('activity_hunt').GetName] [activity|E]: #P -50%#!.\n#flavor We know the inner workings of the active hunt, especially in the wild nature.#!"
 aesin_legacy_4_name: "All Terrain Combat"
 aesin_legacy_4_perk: "[decision|E]: Obtain or Gain [trait_level_track_xp|E] in a [commander_trait|E] based around nature.\n#flavor Nature is our house, we know everything about it, and it does know everything about us.#!"
 aesin_legacy_5_name: "Skilled Skalds"
 aesin_legacy_5_perk: "[decision|E]: Obtain or Gain [trait_level_track_xp|E] in [GetTrait('lifestyle_poet').GetName(GetNullCharacter)] [trait|E].\n#flavor The beauty of nature has to be shared!#!"

 ailil_legacy_track_name: "Ailil Legacy"
 ailil_legacy_track_desc: "House of Ambition"
 ailil_legacy_1_name: "Seize any opportunity"
 ailil_legacy_1_perk: "[casus_belli|E] Cost: #P -30%#!\n#flavor Any opportunity must be seized, no mater the cost.#!"
 ailil_legacy_2_name: "Oaths that Bind"
 ailil_legacy_2_perk: "#flavor Oaths must be respected, only then powerful can be powerful.#!"
 ailil_legacy_3_name: "Inspiring Leaders"
 ailil_legacy_3_perk: "#flavor Our rule shall inspire everyone else, someone has to set the standard.#!"
 ailil_legacy_4_name: "Schmoozers"
 ailil_legacy_4_perk: "#flavor We know how to talk with people, for our ambition demands others to follow us.#!"
 ailil_legacy_5_name: "Unbridled Ambition"
 ailil_legacy_5_perk: "#flavor Our destination is glory and victory!#!"

 balor_legacy_track_name: "Balor Legacy"
 balor_legacy_track_desc: "House of Fear"
 balor_legacy_1_name: "Fomori Blood"
 balor_legacy_1_perk: "#flavor We are not like the other, We have the blood of Fomori in our veins. And they shall fear that.#!"
 balor_legacy_2_name: "Eliminate All Opposition"
 balor_legacy_2_perk: "[decision|E]: Obtain or Gain [trait_level_track_xp|E] in [GetTrait('reckless').GetName(GetNullCharacter)] or [GetTrait('aggressive_attacker').GetName(GetNullCharacter)] [trait|E].\n#flavor Nobody shall stand before us. They all shall be dead!#!"
 balor_legacy_3_name: "Utterly Ruthless"
 balor_legacy_3_perk: "#flavor The word 'Ruthless' should be our name, our title.#!"
 balor_legacy_4_name: "Dread King"
 balor_legacy_4_perk: "#flavor Everyone shall fear us, if not for blood in our veins, then for our past.#!"
 balor_legacy_5_name: "Unseelie Leanings"
 balor_legacy_5_perk: "$improve_ravaging$\n#flavor Unseelie is the only way Fae should live.#!"

 beaumayn_legacy_track_name: "Beaumayn Legacy"
 beaumayn_legacy_track_desc: "House of Prophets"
 beaumayn_legacy_1_name: "Occultists"
 beaumayn_legacy_1_perk: "Base [gold|E] Cost of [GetActivityType('activity_pilgrimage').GetName] [activity|E]: #P -50%#!.\n#flavor We know the occult like our own past, nothing shall be hidden.#!"
 beaumayn_legacy_2_name: "Gift of Prophecy"
 beaumayn_legacy_2_perk: "#flavor The Dreaming itself has granted us the gift of prophecy, we know what is coming.#!"
 beaumayn_legacy_3_name: "Foresight"
 beaumayn_legacy_3_perk: "#flavor Nothing that is hidden shall be unseen for us.#!"
 beaumayn_legacy_4_name: "Seelie Leanings"
 beaumayn_legacy_4_perk: "$improve_reverie$\n#flavor Seelie is the only way Fae should live.#!"
 beaumayn_legacy_5_name: "Masters of the Occult"
 beaumayn_legacy_5_perk: "#flavor The Dreaming itself shall grant us insight into the occult.#!"

 danaan_legacy_track_name: "Danaan Legacy"
 danaan_legacy_track_desc: "House of Dreaming"
 danaan_legacy_1_name: "Explorers of the Umbra"
 danaan_legacy_1_perk: "#flavor We know the Umbra like the back of our hand.#!"
 danaan_legacy_2_name: "Sense of the Umbra"
 danaan_legacy_2_perk: "#flavor Understanding where one is in Umbra is something we all know.#!"
 danaan_legacy_3_name: "Pacts with the Chimera"
 danaan_legacy_3_perk: "#flavor The Chimera in The Dreaming are out allies.#!"
 danaan_legacy_4_name: "Seelie Leanings"
 danaan_legacy_4_perk: "$improve_reverie$\n#flavor Seelie is the only way Fae should live.#!"
 danaan_legacy_5_name: "Masters of Trods"
 danaan_legacy_5_perk: "Improve [GetBuilding('trods_02').GetName] [building|E] line by doubling [POD_chimera_maa|E] maintenance [modifier|E].\n#flavor We know how to use Trods in ways vastly expanding their effectiveness.#!"

 daireann_legacy_track_name: "Daireann Legacy"
 daireann_legacy_track_desc: "House of Passion"
 daireann_legacy_1_name: "Well Trained Alchemists"
 daireann_legacy_1_perk: "#flavor The passion behind alchemy is something not foreign to us.#!"
 daireann_legacy_2_name: "Courtly Courtesy"
 daireann_legacy_2_perk: "#flavor Every Fae knows that the Court of a Daireann is magnificent.#!"
 daireann_legacy_3_name: "Bountiful Festivities"
 daireann_legacy_3_perk: "Gain [GetModifier('POD_daireann_legacy_3_modifier').GetNameWithTooltip] after a [GetActivityType('activity_feast').GetName] [activity|E].\n#flavor The passion of feasts is something we take great pleasure in organizing.#!"
 daireann_legacy_4_name: "Do No Harm"
 daireann_legacy_4_perk: "[decision|E]: Obtain or Gain [trait_level_track_xp|E] in [GetTrait('lifestyle_physician').GetName(GetNullCharacter)] [trait|E].\n#flavor To know life is to partake in the greatest passion there is.#!"
 daireann_legacy_5_name: "Except to Those Who Would Harm"
 daireann_legacy_5_perk: "$unlock_brewing_node$ [GetModifier('alchemy_antidepresants_2_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_aphrodisiac_3_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_poison_3_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_antibiotics_2_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ Add a [modifier|E] increasing a random [skill|E] by 1 ([GetModifier('alchemy_stimulant_diplomacy_modifier').GetNameWithTooltip])\n#flavor The Dreaming itself has revealed to us the mystery of alchemical arts.#!"

 dougal_legacy_track_name: "Dougal Legacy"
 dougal_legacy_track_desc: "House of Work"
 dougal_legacy_1_name: "Well Trained Craftsman"
 dougal_legacy_1_perk: "#flavor Creating something you can hold and bask in it's glory is the greatest pleasure of life.#!"
 dougal_legacy_2_name: "Frugal Craftsman"
 dougal_legacy_2_perk: "Reduce crafting [gold|E] costs by 25%.\n#flavor We know how to cut-corners without affecting the final result.#!"
 dougal_legacy_3_name: "Quality Tools"
 dougal_legacy_3_perk: "Base [durability|E] of Forge [artifacts|E]: #P +20#!.\n#flavor A good craftsman is one that has good tools under his belt.#!"
 dougal_legacy_4_name: "Seelie Leanings"
 dougal_legacy_4_perk: "$improve_reverie$\n#flavor Seelie is the only way Fae should live.#!"
 dougal_legacy_5_name: "Diligence"
 dougal_legacy_5_perk: "#flavor Members of House Dougal are widely known as Diligent Workers, and that reputation is something we take great effort to upkeep#!"

 eiluned_legacy_track_name: "Eiluned Legacy"
 eiluned_legacy_track_desc: "House of Knowledge"
 eiluned_legacy_1_name: "Pursuit of Knowledge"
 eiluned_legacy_1_perk: "#flavor We strive towards knowledge, not explanations like the mortal thinkers.#!"
 eiluned_legacy_2_name: "Cards Close to the Chest"
 eiluned_legacy_2_perk: "#flavor What we know should't be shared freely,#!"
 eiluned_legacy_3_name: "Shield of Knowledge"
 eiluned_legacy_3_perk: "[banality_with_icon|E] gained from Reason: #P -20%#!\n#flavor Our knowledge shall shield us from disbelief.#!"
 eiluned_legacy_4_name: "Magical Experts"
 eiluned_legacy_4_perk: "[bunk_with_icon|E] difficulty: #P -20%#!.\n#flavor Magical Arts are something we Eiluned know much about.#!"
 eiluned_legacy_5_name: "Sorcerous Learnings"
 eiluned_legacy_5_perk: "As [character_interaction|E], select a single path of [sorcery_lifestyle|E] to unlock.\n#flavor The mysteries of mortal magics are unknowable for us Fae, but that doesn't mean we cannot replicate some of them.#!"
 POD_can_obtain_eiluned_dynasty_perk: "You need [SCOPE.GetValue('required_arts')|V0] Art [traits|E] #weak ([THIS.Char.MakeScope.ScriptValue('POD_owned_arts_value')|0])#!"

 fiona_legacy_track_name: "Fiona Legacy"
 fiona_legacy_track_desc: "House of Love"
 fiona_legacy_1_name: "Limitless Passion"
 fiona_legacy_1_perk: "#flavor To be Fiona is to love and be loved.#!"
 fiona_legacy_2_name: "Love of the People"
 fiona_legacy_2_perk: "#flavor Even the most banal of mortals will be affectionate to us, that is what The Dreaming promised to us.#!"
 fiona_legacy_3_name: "Constant Revels"
 fiona_legacy_3_perk: "Cost of [GetActivityType('activity_feast').GetName] [activity|E] options reduced by: #P 50%#!.\n#flavor We know what it means to revel in parties, we do that all the time after all!#!"
 fiona_legacy_4_name: "Fight For Glory"
 fiona_legacy_4_perk: "[decision|E]: Obtain or Gain [trait_level_track_xp|E] in [GetTrait('reckless').GetName(GetNullCharacter)] [trait|E].\n#flavor We fight for glory, and we will die for it.#!"
 fiona_legacy_5_name: "Love of All"
 fiona_legacy_5_perk: "#flavor To know us, is to love us.#!"
 POD_can_obtain_fiona_dynasty_perk_soulmate: "You need at least #V 1#! [soulmate|E]"
 POD_can_obtain_fiona_dynasty_perk_lovers: "You need at least [SCOPE.GetValue('required_lovers')|V0] [Concept( 'lover', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_lovers'), '(CFixedPoint)1' ), 'game_concept_lover', 'game_concept_lovers' ) )|E]"

 gwydion_legacy_track_name: "Gwydion Legacy"
 gwydion_legacy_track_desc: "House of Nobles"
 gwydion_legacy_1_name: "Land Control"
 gwydion_legacy_1_perk: "#flavor Being a good ruler is hard, but that is our duty.#!"
 gwydion_legacy_2_name: "Prosperous Lands"
 gwydion_legacy_2_perk: "#flavor The land under our command shall prosper!#!"
 gwydion_legacy_3_name: "Vassal Admiration"
 gwydion_legacy_3_perk: "#flavor No one can govern empires by themselves, the knowledge how to subdivide rule is something all good rulers must know.#!"
 gwydion_legacy_4_name: "Born to Rule"
 gwydion_legacy_4_perk: "#flavor We Gwydion are destined to rule, Such is The Dreaming's decree!#!"
 gwydion_legacy_5_name: "Returns of a Fair Rule"
 gwydion_legacy_5_perk: "#flavor All good things should in the end return to us.#!"
 POD_can_obtain_gwydion_dynasty_perk_vassal: "You need at least [SCOPE.GetValue('required_vassals')|V0] [Concept( 'vassal', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_vassals'), '(CFixedPoint)1' ), 'game_concept_vassal', 'game_concept_vassals' ) )|E]"
 POD_can_obtain_gwydion_dynasty_perk: "You need at least [SCOPE.GetValue('required_ruler_friends')|V0] [Concept( 'friend', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_ruler_friends'), '(CFixedPoint)1' ), 'game_concept_friend', 'game_concept_friends' ) )|E] who [Select_CString( EqualTo_CFixedPoint( SCOPE.GetValue('required_ruler_friends'), '(CFixedPoint)1' ), 'is an', 'are' )] [Concept( 'independent_ruler', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_ruler_friends'), '(CFixedPoint)1' ), 'game_concept_independent_ruler', 'game_concept_independent_rulers' ) )|E] #weak ([SCOPE.GetValue('independent_ruler_friends')|0])#!"

 leanhaun_legacy_track_name: "Leanhaun Legacy"
 leanhaun_legacy_track_desc: "House of Cursed Artists"
 leanhaun_legacy_1_name: "Patrons of the Great"
 leanhaun_legacy_1_perk: "[gold|E] or [prestige|E] cost to recruit Great Person: #P -25%#!\n#flavor The great artists and mortals should be rewarded for their work, even if that is only to give us more Glamour.#!"
 leanhaun_legacy_2_name: "Greatest of Friends"
 leanhaun_legacy_2_perk: "Unlocks the [GetScheme('befriend').GetTypeName] [scheme|E].\nAll your [friends|E] will gain [GetModifier('POD_leanhaun_legacy_2_modifier').GetNameWithTooltip] [modifier|E].\n#flavor We know what it means to be one's friend.#!"
 leanhaun_legacy_3_name: "Mortal Know-how"
 leanhaun_legacy_3_perk: "Improve [GetDynastyPerk('leanhaun_legacy_2').GetName] by giving [GetModifier('POD_leanhaun_legacy_3_modifier').GetNameWithTooltip] instead.\n#flavor The mortal minds are no mystery to us.#!"
 leanhaun_legacy_4_name: "Cultural Influencers"
 leanhaun_legacy_4_perk: "#P +25%#! Culture Conversion Speed.\n#flavor Guiding humanity in direction you desire is hard, but something we Leanhaun mastered.#!"
 leanhaun_legacy_5_name: "Unseelie Leanings"
 leanhaun_legacy_5_perk: "$improve_ravaging$\n#flavor Unseelie is the only way Fae should live.#!"
 POD_can_obtain_leanhaun_dynasty_perk_friends: "You need at least [SCOPE.GetValue('required_friends')|V0] [Concept( 'friend', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_friends'), '(CFixedPoint)1' ), 'game_concept_friend', 'game_concept_friends' ) )|E]"
 POD_can_obtain_fiona_dynasty_perk_great_person_relation: "You need to have a positive [relation|E] with at least [SCOPE.GetValue('required_great_person_relation')|V0] #TOOLTIP:GAME_TRAIT,historical_character,[GetNullCharacter] #L [Select_CString( EqualTo_CFixedPoint( SCOPE.GetValue('required_great_person_relation'), '(CFixedPoint)1' ), 'Great Person', 'Great Persons' )]#!#! #weak ([SCOPE.GetValue('great_relations')|0])#!"

 liam_legacy_track_name: "Liam Legacy"
 liam_legacy_track_desc: "House of Mortals"
 liam_legacy_1_name: "Allies against Banality"
 liam_legacy_1_perk: "#V $glamour_quests_name$#! [journey|E] Speed: #P +50%#!\n#flavor We all are under the attack of disbelief, but we are not defenseless!#!"
 liam_legacy_2_name: "Contacts from bellow"
 liam_legacy_2_perk: "#flavor Contacts are something great, no mater if they are from where they are.#!"
 liam_legacy_3_name: "Greatest Enemies of Banality"
 liam_legacy_3_perk: "Double [banality|E] lost by Glamour Quests.\n#flavor To be Liam is to be the beacon in the fight against Banality itself.#!"
 liam_legacy_4_name: "Mortal Adoration"
 liam_legacy_4_perk: "#flavor All mortals shall love us!#!"
 liam_legacy_5_name: "Seelie Leanings"
 liam_legacy_5_perk: "$improve_reverie$\n#flavor Seelie is the only way Fae should live.#!"
 POD_can_obtain_liam_dynasty_perk_total_epiphanies_quality: "Your [relations|E] need to have a combined [epiphanies_quality|E] of at least [SCOPE.GetValue('required_total_epiphanies_quality')|V0] #weak ([GetPlayer.MakeScope.ScriptValue('total_epiphanies_quality')|0])#!"

 scathach_legacy_track_name: "Scathach Legacy"
 scathach_legacy_track_desc: "House of Battle"
 scathach_legacy_1_name: "Unyielding"
 scathach_legacy_1_perk: "#flavor We will not yield! We will not surrender!#!"
 scathach_legacy_2_name: "Masters of Stealth"
 scathach_legacy_2_perk: "#flavor The shadows in the court, we will not be seen.#!"
 scathach_legacy_3_name: "Renowned Commanders"
 scathach_legacy_3_perk: "[decision|E]: Obtain or Gain [trait_level_track_xp|E] in a single [commander_trait|E].\n#flavor We know all the kinds of war.#!"
 scathach_legacy_4_name: "Unrelenting Attackers"
 scathach_legacy_4_perk: "#flavor Onwards! Towards glory and victory!#!"
 scathach_legacy_5_name: "Versatile Duelists"
 scathach_legacy_5_perk: "#flavor The art of dueling is something we have very deep understanding of.#!"
 POD_can_obtain_scathach_dynasty_perk_knight_prowess: "Your [knights|E]' total [prowess|E] must exceed [SCOPE.GetValue('required_knight_prowess')|V0] #weak ([SCOPE.GetValue('total_knight_prowess')|0])#!"

 varich_legacy_track_name: "Varich Legacy"
 varich_legacy_track_desc: "House of Patterns"
 varich_legacy_1_name: "Predictive Gambling"
 varich_legacy_1_perk: "#flavor The Dreaming itself has given us power of predicting outcomes.#!"
 varich_legacy_2_name: "Foresight"
 varich_legacy_2_perk: "#flavor We know things most shouldn't know.#!"
 varich_legacy_3_name: "Future Prediction"
 varich_legacy_3_perk: "#flavor We can see what lays ahead.#!"
 varich_legacy_4_name: "Clear Future"
 varich_legacy_4_perk: "#flavor Our insight into the future is truly magnificent.#!"
 varich_legacy_5_name: "Unseelie Leanings"
 varich_legacy_5_perk: "$improve_ravaging$\n#flavor Unseelie is the only way Fae should live.#!"
 POD_can_obtain_varich_dynasty_perk_no_sluagh: "There can be no [GetTrait('sluagh').GetName(GetPlayer)] [vassals|E] in your [realm|E]"

 inanimae_legacy_track_name: "Inanimae Legacy"
 inanimae_legacy_track_desc: "Born from Elements"
 inanimae_legacy_1_name: "Born from Fire"
 inanimae_legacy_1_perk: "Each [nemesis|E], [best_friend|E] and [soulmate|E] improves or gives [modifier|E] giving #P +0.75#! [prestige|E] and #P +0.2#! [dynasty_prestige|E].\n#flavor We all originate from the fire of human thought...#!"
 inanimae_legacy_2_name: "Shaped by Wind"
 inanimae_legacy_2_perk: "#flavor ...Shaped by the winds of the Dreaming's unpredictability...#!"
 inanimae_legacy_3_name: "Nurtured by Water"
 inanimae_legacy_3_perk: "[decision|E]: Obtain or Gain [trait_level_track_xp|E] in [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] or [GetTrait('lifestyle_physician').GetName(GetNullCharacter)] [trait|E].\n#flavor ...Nurtured by the flowing water of mundane reality itself...#!"
 inanimae_legacy_4_name: "Hardened by Stone"
 inanimae_legacy_4_perk: "#flavor ...Hardened by it...#!"
 inanimae_legacy_5_name: "So we can Grow"
 inanimae_legacy_5_perk: "$cantrip_hard_bunk$ Resurrect a $POD_splat_wraith$ as a $POD_splat_mortal$\n$cantrip_hard_bunk$ Grant [GetModifier('cantrip_renewal_modifier').GetNameWithTooltip] to all [de_jure|E] [counties|E] of a [title|E]\n$cantrip_hard_bunk$ Fully restore an [artifact|E]'s [durability|E]\n#flavor ...But even then, we will still grow into the future.#!"

 POD_can_obtain_inanimae_dynasty_perk_friends: "You need at least [SCOPE.GetValue('required_friends')|V0] [Concept( 'friend', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_friends'), '(CFixedPoint)1' ), 'game_concept_friend', 'game_concept_friends' ) )|E] #weak ([THIS.Char.MakeScope.ScriptValue('POD_num_of_friends')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_lovers: "You need at least [SCOPE.GetValue('required_lovers')|V0] [Concept( 'lover', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_lovers'), '(CFixedPoint)1' ), 'game_concept_lover', 'game_concept_lovers' ) )|E] #weak ([THIS.Char.MakeScope.ScriptValue('POD_num_of_lovers')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_income: "Your monthly income must exceed [SCOPE.GetValue('required_income')|V0] #weak ([GetPlayer.MakeScope.ScriptValue('POD_monthly_character_income')|2])#!"
 POD_can_obtain_inanimae_dynasty_perk_poi_visited: "You need to visit at least [SCOPE.GetValue('required_visited_poi')|V0] [Concept( 'point_of_interest', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_visited_poi'), '(CFixedPoint)1' ), 'game_concept_point_of_interest', 'game_concept_points_of_interest' ) )|E] #weak ([GetPlayer.MakeScope.ScriptValue('poi_visited')])#!"
 POD_can_obtain_inanimae_dynasty_perk_secrets_known: "You need to know at least [SCOPE.GetValue('required_secrets_known')|V0] [Concept( 'secret', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_secrets_known'), '(CFixedPoint)1' ), 'game_concept_secret', 'game_concept_secrets' ) )|E] #weak ([SCOPE.GetValue('secrets_known')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_mortal_relations: "You need to have at least [SCOPE.GetValue('required_mortal_relations')|V0] $POD_splat_mortal$ [Concept( 'relation', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_mortal_relations'), '(CFixedPoint)1' ), 'game_concept_relation', 'game_concept_relations' ) )|E] #weak ([SCOPE.GetValue('mortal_relations')|0])#!"

 common_fae_legacy_track_name: "Faerie Folk"
 common_fae_legacy_track_desc: "From The Dreaming in The Autumn World"
 common_fae_legacy_1_name: "Dreaming in Autumn World"
 common_fae_legacy_1_perk: "#flavor Even in Autumn World, we still dream for better world.#!"
 common_fae_legacy_2_name: "Magicians of The Dreaming"
 common_fae_legacy_2_perk: "#flavor For what Autumn World took from us, we persist in bringing magic to this place.#!"
 common_fae_legacy_3_name: "Overcoming Autumn Limitations"
 common_fae_legacy_3_perk: "[GetPlayer.Custom('PODFaeLegacyInanimaeBanality')].\n#flavor Autumn World is harsh for us, but we still exist nevertheless.#!"
 PODFaeLegacyInanimaeBanality_inanimae: "Recover 1 Glamour when failing a [cantrip|E]"
 PODFaeLegacyInanimaeBanality_banality: "No Longer gain [banality|E] from failing a [cantrip|E]"
 common_fae_legacy_4_name: "True to Our Nature"
 common_fae_legacy_4_perk: "Improve [revelry|E] by doubling Glamour gained.\n#flavor For anything else, we are Fae.#!"
 common_fae_legacy_5_name: "Recognized by The Dreaming"
 common_fae_legacy_5_perk: "[GetPlayer.Custom('PODFaeLegacyNobleHouse')].\n#flavor Basked in glory of The Dreaming, we shall be noble ones!#!"
 PODFaeLegacyNobleHouse_noble: "Additional requirements for Fae [dynasty_perks|E]: #P -30%#!\n@grace_icon![umbra_sense|E]: #P +20%#!"
 PODFaeLegacyNobleHouse_commoner: "Unlock [Concept('decision', 'Objective')|E] to form your own Noble House."

 fae_loved_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_loved_legacy_track_desc: "House loved by The Dreaming"
 fae_loved_legacy_1_name: "Loved everywhere we go..."
 fae_loved_legacy_1_perk: "#flavor Loved by The Dreaming, loved by everyone else.#!"
 fae_loved_legacy_2_name: "...Especially by our vassals"
 fae_loved_legacy_2_perk: "#flavor For our vassals are from The Dreaming, they too love us.#!"
 fae_loved_legacy_3_name: "Masters of multi-tasking"
 fae_loved_legacy_3_perk: "#flavor What is a good friend, if not one that can multi-task their relations?#!"
 fae_loved_legacy_4_name: "Best of Friends"
 fae_loved_legacy_4_perk: "#flavor Ability to keep many relations is our pride.#!"
 fae_loved_legacy_5_name: "Most loved among loved"
 fae_loved_legacy_5_perk: "#flavor For anything else, We are loved by the very place we come from.#!"

 fae_warriors_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_warriors_legacy_track_desc: "Commanders of The Dreaming"
 fae_warriors_legacy_1_name: "Glory of the Dreaming"
 fae_warriors_legacy_1_perk: "Gain [prestige|E] from won [wars|E], with amount based on highest [title|E] rank.\n#flavor For the Glory, for The Dreaming!#!"
 fae_warriors_legacy_2_name: "But we are not alone"
 fae_warriors_legacy_2_perk: "#flavor We are not blinded by our mission, We have allies inside our kind.#!"
 fae_warriors_legacy_3_name: "For our claims are just"
 fae_warriors_legacy_3_perk: "[casus_belli|E] Cost: #P -30%#!\n#flavor For we are The Dreaming, we are just#!"
 fae_warriors_legacy_4_name: "Expanding our Domain"
 fae_warriors_legacy_4_perk: "Unlocks #V $invasion_war$#! [casus_belli|E].\nReduce cooldown for #V $invasion_war$#! from #N 100#! years to #P 50#! years.\n#flavor Expanding what The Dreaming can easily influence is our mission.#!"
 fae_warriors_legacy_5_name: "Greatest warriors of The Dreaming"
 fae_warriors_legacy_5_perk: "#flavor For we are commanders of The Dreaming, pursuing victory!#!"

 fae_respected_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_respected_legacy_track_desc: "Following King Arthur's path"
 fae_respected_legacy_1_name: "True Kings"
 fae_respected_legacy_1_perk: "#flavor We are kings, and our fame shall spread.#!"
 fae_respected_legacy_2_name: "Loyal Vassals"
 fae_respected_legacy_2_perk: "#flavor Our vassals know their place, and they help us as they should.#!"
 fae_respected_legacy_3_name: "Masters at Managing Domain"
 fae_respected_legacy_3_perk: "Improve [GetCourtPositionType('imperial_envoy_court_position').GetName()], [GetCourtPositionType('imperial_chancellor_court_position').GetName()] and [GetCourtPositionType('imperial_minister_court_position').GetName()] [aptitude|E] by #P 20#!.\n#flavor We know how to rule, and how to manage large domain.#!"
 fae_respected_legacy_4_name: "Most impressive of the Courts"
 fae_respected_legacy_4_perk: "[GetPlayer.Custom('PODFaeLegacyRoyalCourt')].\n#flavor King's court is what shows world their power, we cannot lag behind.#!"
 PODFaeLegacyRoyalCourt_court_amenities: "[court_amenities|E] Cost: #P -50%#!"
 PODFaeLegacyNobleHouse_invite_buff: "Invite to [court|E] Acceptance: #P +20#!"
 FAE_RESPECTED_LEGACY_4: "[GetDynastyPerk('fae_respected_legacy_4').GetName]: $VALUE|=+0$"
 fae_respected_legacy_5_name: "Emperors amongst kings"
 fae_respected_legacy_5_perk: "#flavor For we are the kings. Not of The Dreaming, but everything that belongs to it!#!"

 fae_feared_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_feared_legacy_track_desc: "House feared by Prodigals"
 fae_feared_legacy_1_name: "Knowledgeable Fabricators"
 fae_feared_legacy_1_perk: "[fabricate_claim|E] [councillor_task|E] Speed: #P +50%#! faster\n#flavor Fabrication is a from of creative endeavour, and we very like indulging in it.#!"
 fae_feared_legacy_2_name: "Screaming Fame"
 fae_feared_legacy_2_perk: "Gain [prestige|E] from torturing [characters|E], with amount based on rank of the victim.\n#flavor For we know that screams can carry knowledge of what we can do to enemies of The Dreaming.#!"
 fae_feared_legacy_3_name: "Glory from Fear"
 fae_feared_legacy_3_perk: "#flavor Fear can make even a small count into a major threat.#!"
 fae_feared_legacy_4_name: "Experts at Scheming"
 fae_feared_legacy_4_perk: "#flavor We know somethings about scheming, for that is our duty.#!"
 fae_feared_legacy_5_name: "Most feared among Prodigals"
 fae_feared_legacy_5_perk: "#flavor For we are the boogeyman of Prodigals.#!"

 fae_wise_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_wise_legacy_track_desc: "House of Wise"
 fae_wise_legacy_1_name: "Scholars of Names"
 fae_wise_legacy_1_perk: "Gain #P 200#! [piety|E] and #P 200#! [prestige|E] upon learning new language\n#flavor Languages carry weight, weight we have to know.#!"
 fae_wise_legacy_2_name: "Expert Magicians"
 fae_wise_legacy_2_perk: "#flavor Wise Fae knows that power cannot be ignored.#!"
 fae_wise_legacy_3_name: "Studying Dreamers' Ways"
 fae_wise_legacy_3_perk: "As a [character_interaction|E], select Vanilla [lifestyle|E] which will receive 100 xp every year.\n#flavor Dreamers know things, things we can also know.#!"
 fae_wise_legacy_4_name: "Masters at Learning"
 fae_wise_legacy_4_perk: "#flavor We Prodigals are slow to adapt, to learn. But that can be changed.#!"
 fae_wise_legacy_5_name: "Wisest among the Wise"
 fae_wise_legacy_5_perk: "#flavor For we carry the knowledge of The Dreaming.#!"

 fae_mighty_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_mighty_legacy_track_desc: "The Dreaming's Guards"
 fae_mighty_legacy_1_name: "Knightly Glory"
 fae_mighty_legacy_1_perk: "#flavor We are Knights of The Dreaming, and our knights just as important than we are.#!"
 fae_mighty_legacy_2_name: "Battle Cry"
 fae_mighty_legacy_2_perk: "At the start of [war|E] give [GetModifier('POD_dynasty_battle_cry_modifier').GetNameWithTooltip] [modifier|E] to all friendly [knights|E] for 5 years.\n#flavor 'For The Dreaming!' we cry for glory!#!"
 fae_mighty_legacy_3_name: "Sword Masters"
 fae_mighty_legacy_3_perk: "[decision|E]: Obtain or Gain [trait_level_track_xp|E] in [GetTrait('lifestyle_blademaster').GetName(GetPlayer)] [trait|E].\n#flavor We know ways of the blade, for we need it to guard the Dreaming.#!"
 fae_mighty_legacy_4_name: "Mighty Companions"
 fae_mighty_legacy_4_perk: "All [coterie|E] members will gain [GetModifier('POD_dynasty_mighty_companions_modifier').GetNameWithTooltip] [modifier|E] as long they didn't leave.\n#flavor A single Fae cannot defend entire Dreaming, but who said we are alone?#!"
 fae_mighty_legacy_5_name: "The Mightiest from Fae"
 fae_mighty_legacy_5_perk: "#flavor For we are the Guardians of The Dreaming.#!"