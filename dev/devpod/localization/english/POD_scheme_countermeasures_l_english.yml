l_english: 
 # Boilerplate copy for the standard countermeasures.
 scheme_countermeasure_type_all_seeing_eye: "All-Seeing Eye"
 scheme_countermeasure_type_all_seeing_eye_desc: "#WEAK Supernatural powers of precognition can go a long way towards protecting one self from undue attention.#!"

 scheme_countermeasure_type_all_seeing_eye_t1: "$scheme_countermeasure_type_all_seeing_eye$"
 scheme_countermeasure_type_all_seeing_eye_t1_desc: "$scheme_countermeasure_type_all_seeing_eye_desc$"
 scheme_countermeasure_type_all_seeing_eye_t2: "$scheme_countermeasure_type_all_seeing_eye$"
 scheme_countermeasure_type_all_seeing_eye_t2_desc: "$scheme_countermeasure_type_all_seeing_eye_desc$"
 scheme_countermeasure_type_all_seeing_eye_t3: "$scheme_countermeasure_type_all_seeing_eye$"
 scheme_countermeasure_type_all_seeing_eye_t3_desc: "$scheme_countermeasure_type_all_seeing_eye_desc$"

 countermeasures_unlocks_t1_all_seeing_eye: "Unlocks the #V $scheme_countermeasure_type_all_seeing_eye$#! [scheme_countermeasure_countermeasure|E] #weak (Tier 1)#!"
 countermeasures_unlocks_t2_all_seeing_eye: "Improves the #V $scheme_countermeasure_type_all_seeing_eye$#! [scheme_countermeasure_countermeasure|E] #weak (Tier 2)#!"
 countermeasures_unlocks_t3_all_seeing_eye: "Improves the #V $scheme_countermeasure_type_all_seeing_eye$#! [scheme_countermeasure_countermeasure|E] #weak (Tier 3)#!"
 countermeasures_unlocks_t4_all_seeing_eye: "Improves the #V $scheme_countermeasure_type_all_seeing_eye$#! [scheme_countermeasure_countermeasure|E] #weak (Tier 4)#!"
 countermeasures.desc.all_seeing_eye: "$EFFECT_LIST_BULLET$New [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_all_seeing_eye$\n$EFFECT_LIST_BULLET$[secrecy|E] reduced"

 scheme_countermeasure_type_mental_fortress: "Mental Fortress"
 scheme_countermeasure_type_mental_fortress_desc: "#WEAK Well defended minds, with protections of supernatural nature, make for a impenetrable fortress for would be schemers.#!"

 scheme_countermeasure_type_mental_fortress_t1: "$scheme_countermeasure_type_mental_fortress$"
 scheme_countermeasure_type_mental_fortress_t1_desc: "$scheme_countermeasure_type_mental_fortress_desc$"
 scheme_countermeasure_type_mental_fortress_t2: "$scheme_countermeasure_type_mental_fortress$"
 scheme_countermeasure_type_mental_fortress_t2_desc: "$scheme_countermeasure_type_mental_fortress_desc$"
 scheme_countermeasure_type_mental_fortress_t3: "$scheme_countermeasure_type_mental_fortress$"
 scheme_countermeasure_type_mental_fortress_t3_desc: "$scheme_countermeasure_type_mental_fortress_desc$"

 countermeasures_unlocks_t1_mental_fortress: "Unlocks the #V $scheme_countermeasure_type_mental_fortress$#! [scheme_countermeasure_countermeasure|E] #weak (Tier 1)#!"
 countermeasures_unlocks_t2_mental_fortress: "Improves the #V $scheme_countermeasure_type_mental_fortress$#! [scheme_countermeasure_countermeasure|E] #weak (Tier 2)#!"
 countermeasures_unlocks_t3_mental_fortress: "Improves the #V $scheme_countermeasure_type_mental_fortress$#! [scheme_countermeasure_countermeasure|E] #weak (Tier 3)#!"
 countermeasures_unlocks_t4_mental_fortress: "Improves the #V $scheme_countermeasure_type_mental_fortress$#! [scheme_countermeasure_countermeasure|E] #weak (Tier 4)#!"
 countermeasures.desc.mental_fortress: "$EFFECT_LIST_BULLET$New [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_mental_fortress$\nReduced [success_chance|E] for most [schemes|E]"

 countermeasures.desc.bounties_for_whispers: "$EFFECT_LIST_BULLET$New [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_bounties_for_whispers$\n$EFFECT_LIST_BULLET$[secrecy|E] reduced"
 countermeasures.desc.arbitrary_arrests: "$EFFECT_LIST_BULLET$New [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_arbitrary_arrests$\n$EFFECT_LIST_BULLET$[secrecy|E] reduced"
 countermeasures.desc.strengthen_sentries: "$EFFECT_LIST_BULLET$New [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_strengthen_sentries$\n$EFFECT_LIST_BULLET$Reduced [success_chance|E] for [GetScheme('seduce').GetTypeName] & similar [schemes|E]"
 countermeasures.desc.redouble_guards: "$EFFECT_LIST_BULLET$New [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_redouble_guards$\n$EFFECT_LIST_BULLET$Reduced [success_chance|E] for [GetScheme('murder').GetTypeName] & similar [schemes|E]"
 countermeasures.desc.withdraw_from_view: "$EFFECT_LIST_BULLET$New [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_withdraw_from_view$\nSlightly reduced [success_chance|E] for most [schemes|E]"
 countermeasures.desc.bribe_officials: "$EFFECT_LIST_BULLET$New [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_bribe_officials$\nSlightly reduced [success_chance|E] for most [political_schemes|E]"
