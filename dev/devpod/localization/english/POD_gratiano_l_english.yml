l_english:

###### Gratiano de Veronese - The Long Conspiracy ######

###### Story panel: name, desc, counters, custom string body ######

 POD_gratiano_story: "#glow_color:{0.2,0.05,0.25,0.5}The Long Conspiracy#!"
 POD_gratiano_story_desc: "You are gathering a conspiracy against the founder of your clan. Recruit allies, deal with rivals and keep the court's trust until an assault can be attempted."

 POD_gratiano_story_trust_label: "[gratiano_standing_at_court|E]"
 POD_gratiano_story_trust_min_label: "Exposed"
 POD_gratiano_story_trust_max_label: "Favored"

 POD_gratiano_story_conspiracy_label: "[gratiano_conspiracy|E]"
 POD_gratiano_story_conspiracy_min_label: "Whispers"
 POD_gratiano_story_conspiracy_max_label: "Ready"

 POD_gratiano_story_inner_circle_label: "The Inner Circle"
 POD_gratiano_story_circle_label: "Sworn to the Conspiracy"

 POD_gratiano_story_begins.toast: "The Long Conspiracy Begins"

# Keep GuiScope.SetRoot first: trust_mirror uses Story; dispatchers use the story owner.
 POD_gratiano_story_custom_string: "[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('POD_gratiano_story_phase')]\n[Story.GetOwner.Custom('POD_gratiano_story_body')]"

###### Phase headers (selected by POD_gratiano_story_phase dispatcher) ######

 POD_gratiano_story_phase_proclamation: "#bold The Upstart#!\nThe court has named you the founder's favorite and calls it an honor. You know it for what it really is: mockery. You have not yet said, even to yourself, what you intend to make of it."
 POD_gratiano_story_phase_courtier: "#bold The Courtier#!\nYou smile at the high table and study the four powers hemming you in. Each calls for a careful response."
 POD_gratiano_story_phase_liberator: "#bold The Liberator#!\nThe rivals are dealt with and the Amici Noctis have taken your oath. With the road to Sicily open, you turn at last toward the founder's seat."
 POD_gratiano_story_phase_kingslayer: "#bold The Kingslayer#!\nThe decision is made and the assault has begun. You descend beneath the castle to face its sleeping master."

###### Readiness tiers (selected by POD_gratiano_story_tier dispatcher) ######

 POD_gratiano_story_tier_whispers: "#z Readiness:#! a few rumors traded in the dark."
 POD_gratiano_story_tier_circle: "#z Readiness:#! a small circle of allies willing to keep the conspiracy among themselves."
 POD_gratiano_story_tier_pieces: "#z Readiness:#! the needed favors are owed and the blades are within reach."
 POD_gratiano_story_tier_ready: "#P Readiness: ready to strike.#! The conspiracy is strong enough to move against the castle itself."

###### Milestone checklist (8 lines, _on = @check_icon!, _off = @cross_icon!) ######

 POD_gratiano_check_giovanni_on: "@check_icon! #P The Giovanni displaced from their seat.#!"
 POD_gratiano_check_giovanni_pending: "@warning_icon! #tooltip:POD_gratiano_check_giovanni_tt #Y The move against the Giovanni is in motion.#!#!"
 POD_gratiano_check_giovanni_off: "@cross_icon! #tooltip:POD_gratiano_check_giovanni_tt The Giovanni still hold their seat.#!"

 POD_gratiano_check_moncada_on: "@check_icon! #P Ambrosio Moncada answered for.#!"
 POD_gratiano_check_moncada_pending: "@warning_icon! #tooltip:POD_gratiano_check_moncada_tt #Y The move against Moncada is in motion.#!#!"
 POD_gratiano_check_moncada_off: "@cross_icon! #tooltip:POD_gratiano_check_moncada_tt Ambrosio Moncada still stands against you.#!"

 POD_gratiano_check_nahir_on: "@check_icon! #P Nahir's grievance settled.#!"
 POD_gratiano_check_nahir_pending: "@warning_icon! #tooltip:POD_gratiano_check_nahir_tt #Y The reckoning with Nahir is in motion.#!#!"
 POD_gratiano_check_nahir_off: "@cross_icon! #tooltip:POD_gratiano_check_nahir_tt Nahir's grievance is unsettled.#!"

 POD_gratiano_check_ventrue_on: "@check_icon! #P The Ventrue interest cleared away.#!"
 POD_gratiano_check_ventrue_pending: "@warning_icon! #tooltip:POD_gratiano_check_ventrue_tt #Y The shadow war on the Ventrue is in motion.#!#!"
 POD_gratiano_check_ventrue_off: "@cross_icon! #tooltip:POD_gratiano_check_ventrue_tt The Ventrue still hold independent seats in the sphere.#!"

 POD_gratiano_check_amici_on: "@check_icon! #P The Amici Noctis have taken your oath.#!"
 POD_gratiano_check_amici_off: "@cross_icon! #tooltip:POD_gratiano_check_amici_tt The Amici Noctis have not yet judged you worthy.#!"

###### Plan I objective tooltips ######
 POD_gratiano_check_giovanni_tt: "#bold Break the Giovanni#!\nComplete when no independent Giovanni prince holds any county in Italy, Venice, or Romagna, and the Giovanni crown itself sits vacant.\n#I Vassalize them or destroy them#!"
 POD_gratiano_check_ventrue_tt: "#bold Clear the Ventrue#!\nComplete when no independent Ventrue prince holds any county in Italy, Venice, or Romagna.\n#I Vassalize them or destroy them#!"
 POD_gratiano_check_moncada_tt: "#bold Answer the Cardinal#!\nComplete when both Ambrosio Moncada, Cardinal of Aragon, and his caged childe Lucita are dead.\n#I Lucita cannot be reached while the Cardinal's cage still holds her#!"
 POD_gratiano_check_nahir_tt: "#bold Settle Nahir#!\nComplete when Nahir is either dead or bound to you as a friend.\n#I Buy back his regard until he counts you a friend, or kill him#!"
 POD_gratiano_check_amici_tt: "#bold The Amici's Judgment#!\nThe Friends of the Night take no oath from the unworthy. \n#I Deal with all four powers above and they will judge you worthy#!"

 POD_gratiano_check_pact_on: "@check_icon! #P The Assamite pact is sworn.#!"
 POD_gratiano_check_pact_off: "@cross_icon! No blade of the Assamites has been promised."

 POD_gratiano_check_elders_on: "@check_icon! #P The elders' opposition is broken.#!\n$POD_gratiano_check_elders_details$"
 POD_gratiano_check_elders_off: "@cross_icon! #bold Silence the elders.#!\n$POD_gratiano_check_elders_details$"
 POD_gratiano_check_elders_details:0 "#V [GetPlayer.MakeScope.ScriptValue('POD_gratiano_framed_count_value')|0]#! of #V 4#! currently silenced; #V 3#! required.\n[GetPlayer.Custom('POD_gratiano_check_elder_montano')]\n[GetPlayer.Custom('POD_gratiano_check_elder_alfonzo')]\n[GetPlayer.Custom('POD_gratiano_check_elder_guilelmo')]\n[GetPlayer.Custom('POD_gratiano_check_elder_boukephos')]"
 POD_gratiano_check_elder_row:0 "[gratiano_elder.GetShortUIName]: [GetPlayer.Custom2('POD_gratiano_check_elder_status', SCOPE.sC('gratiano_elder'))]"
 POD_gratiano_check_elder_silenced:0 "@check_icon! #P Silenced#!"
 POD_gratiano_check_elder_unsilenced:0 "@cross_icon! #N Unsilenced#!"
 POD_gratiano_check_elder_montano_missing:0 "Montano: $POD_gratiano_check_elder_silenced$"
 POD_gratiano_check_elder_alfonzo_missing:0 "Alfonzo: $POD_gratiano_check_elder_silenced$"
 POD_gratiano_check_elder_guilelmo_missing:0 "Guilelmo: $POD_gratiano_check_elder_silenced$"
 POD_gratiano_check_elder_boukephos_missing:0 "Boukephos: $POD_gratiano_check_elder_silenced$"

 POD_gratiano_check_sicily_on: "@check_icon! #P Siracusa held, opening the door to the castle.#!"
 POD_gratiano_check_sicily_off: "@cross_icon! Siracusa and the seat beneath it remain in another's hands."

###### Per-phase panel bodies (POD_gratiano_story_body) ######

 POD_gratiano_story_body_proclamation: "\n#I Proclaim Born to Rule to begin the long work.#!"

 POD_gratiano_story_body_courtier: "[GetPlayer.Custom('POD_gratiano_story_tier')]\n#N Standing at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_trust_value')|0]#!\n#bold The Four Accounts:#!\n[GetPlayer.Custom('POD_gratiano_check_giovanni')]\n[GetPlayer.Custom('POD_gratiano_check_moncada')]\n[GetPlayer.Custom('POD_gratiano_check_nahir')]\n[GetPlayer.Custom('POD_gratiano_check_ventrue')]\n[GetPlayer.Custom('POD_gratiano_check_amici')]"

 POD_gratiano_story_body_liberator: "[GetPlayer.Custom('POD_gratiano_story_tier')]\n#N Standing at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_trust_value')|0]#!\n#bold The Road to the Castle: the last preparations before the descent#!\n[GetPlayer.Custom('POD_gratiano_check_pact')]\n[GetPlayer.Custom('POD_gratiano_check_elders')]\n[GetPlayer.Custom('POD_gratiano_check_sicily')]"

 POD_gratiano_story_body_kingslayer: "[GetPlayer.Custom('POD_gratiano_story_tier')]\n#N Standing at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_trust_value')|0]#!\n#R The strike is launched.#! The circle is committed, and the door to the castle stands open at last.\nBeneath it the founder waits, indifferent and eternal. You descend into the dark to end him, or to be ended."

###### Event 0001 - the awakening intro ######

 POD_gratiano.0001.t: "A Dutiful Childe"
 POD_gratiano.0001.desc: "Tonight you attended court as you always have. You gave the founder's name its due, deferred where deference was owed, and left at the hour a dutiful childe would leave. Nobody watching could have marked a difference.\n\nYou spent the evening counting. Who resents the long wait on a sleeper's favor, who could be approached, who would carry one careless word straight to the elders. Lasombra still lives, and those who serve him will notice a childe who gathers friends too quickly. It will be slow work, and each ally you win has to be weighed against the trust it costs you."
 POD_gratiano.0001.a: "Let us see where matters stand."

 POD_gratiano_intro_objectives_tt: "#T The work before the castle:#!\nFour rival powers stand between you and the seat: the #bold Giovanni#!, the #bold Ventrue#!, #bold Moncada#!, and #bold Nahir#!. Above them waits the judgment of the #bold Amici Noctis#!. A decision opens each campaign; another cannot begin until the current one is finished."

###### Event 0002 - court suspicion warning (Trust <= 20) ######

 POD_gratiano.0002.t: "Questions at Court"
 POD_gratiano.0002.desc: "Your usual place at court is given to someone else tonight, with apologies. Conversations finish as you approach. An elder asks, pleasantly, how you have been filling your nights, and waits for the whole answer.\n\nNobody has accused you of anything. They have only begun to watch, and the conspiracy cannot survive much more of their attention."
 POD_gratiano.0002.a: "I must win back their trust."
 POD_gratiano.0002.b: "Rein in the conspiracy for now."

 POD_gratiano_trust_recovery_hint_tt: "Standing can be rebuilt by currying favor in the founder's court or handing over a lesser conspirator for punishment. Either course cools the suspicion."
 POD_gratiano_quiet_circle_tt: "#R -10 The Conspiracy#!\nThe circle suspends its meetings and stops carrying whispers. The court finds nothing, but the work loses ground."

###### Event 0003 - exposure (Trust = 0, pre-strike) ######

 POD_gratiano.0003.t: "The Court Knows"
 POD_gratiano.0003.desc: "The court knows. Names are being read out before the elders, yours first, and doors you walked through last week are closed to you.\n\nThose you gathered want to hear what happens next. If enough of them stand ready, you could move against the founder now, long before you meant to. Otherwise there is the court's judgment to wait for, or a road to take before it arrives. Cainites have met Final Death for less than this."
 POD_gratiano.0003.a: "We strike now, ready or not."
 POD_gratiano.0003.b: "Stay and face what comes."
 POD_gratiano.0003.c: "Go into exile before they come."

 POD_gratiano_forced_strike_tt: "#R The assault begins.#!\nThe attack on the castle starts within days, before the conspiracy is truly ready. The haste worsens the odds. The Strike the Castle decision is forfeit; there is no other way in now."
 POD_gratiano_doomed_strike_warning_tt: "#X Doomed:#! the groundwork is unfinished. Core rivals still stand, and the founder's defenses are untouched. #bold The assault is very nearly unwinnable.#!"
 POD_gratiano_face_purge_tt: "Keep the seat and answer for the conspiracy in the open. The circle is lost, the work undone, and the court's judgment may run to Final Death."
 POD_gratiano_flee_court_tt: "Vanish ahead of the purge. Survival is certain; the disgrace is deeper, and it follows you far longer."

 POD_gratiano_forced_strike_message: "Exposed, you order the assault on the castle."
 POD_gratiano_strike_already_committed_message: "The strike is already committed. The assault on the castle is underway; no second order is needed."
 POD_gratiano_purge_coming_message: "The purge is coming."

###### Event 0004 - the purge lands ######

 POD_gratiano.0004.t: "The Purge"
 POD_gratiano.0004.desc: "The court works through your conspiracy name by name. Some of your recruits are gone before anyone knocks. Others are taken and not seen again, and a few find it wiser to become your enemies. Soon nothing you built is left.\n\nAll that remains to settle is your own account."
 POD_gratiano.0004.a: "Submit to judgment, though it may mean Final Death."
 POD_gratiano.0004.b: "The exile's disgrace is mine to bear."

 POD_gratiano_purge_faced_tt: "The circle is scattered and the conspiracy reset to nothing. Your standing takes a grievous blow as you face the court's judgment, which may cost you Final Death, especially if the plot ran deep."
 POD_gratiano_purge_fled_tt: "You escape death at the price of a far heavier loss of standing. The mark of the exposed conspirator stays with you."

 POD_gratiano_purge_survived_message: "The court has passed judgment. You remain alive for now, but your standing is broken."
 POD_gratiano_purge_fled_message: "You flee before the trial. Your disgrace follows you beyond the court."

###### Crash modifier ######

 POD_gratiano_exposed_conspirator_modifier: "Exposed Conspirator"
 POD_gratiano_exposed_conspirator_modifier_desc: "The court has named this character a conspirator against the founder. The name travels ahead of them, and the clan does not forget it."

 POD_gratiano_low_standing_1_modifier: "Slipping Favor"
 POD_gratiano_low_standing_1_modifier_desc: "The court has begun to ask where this character's loyalties lie. Kin answer invitations more slowly than they did."
 POD_gratiano_low_standing_2_modifier: "Waning Confidence"
 POD_gratiano_low_standing_2_modifier_desc: "Suspicion at court is now spoken aloud. Members of the dynasty keep their distance rather than be seen in this character's company."
 POD_gratiano_low_standing_3_modifier: "The Blood Doubts You"
 POD_gratiano_low_standing_3_modifier_desc: "The court all but assumes this character's guilt and waits only for proof. Few of the dynasty will risk being counted as a friend."

###### Shared strike warnings ######

 POD_gratiano_strike_knife_edge_warning_tt: "#Y Uncertain:#! the groundwork is nearly complete, but gaps remain. The last preparations will decide whether the assault can succeed."
 POD_gratiano_exposure_warning_tt: "#X Warning:#! Your standing at court is failing. If it collapses entirely, the conspiracy is exposed and the court will dictate the reckoning."

###### Conspiracy levers, academy & coterie ######

###### Interaction: Recruit a Lasombra ######

 POD_gratiano_recruit_lasombra_interaction: "Extend the Hand of Shadow"
 POD_gratiano_recruit_lasombra_interaction_desc: "Ask a fellow Lasombra, face to face, to stand with you against the founder. One who agrees joins the conspiracy and raises Conspiracy. One who refuses may carry word to the founder's court."

 POD_gratiano_recruit_accept_tt: "#P +[recipient.MakeScope.ScriptValue('POD_gratiano_recruit_conspiracy_gain_value')|0] The Conspiracy#!\nThey join the outer circle. Old blood and high station add more to the conspiracy; even a reluctant conspirator adds something."
 POD_gratiano_recruit_gain_blood_old: "Old blood (generation 4-6)"
 POD_gratiano_recruit_gain_blood_thin: "Blood far from Caine (generation 11+)"
 POD_gratiano_recruit_gain_rank_king: "A king answers the call"
 POD_gratiano_recruit_gain_rank_duke: "A duke answers the call"
 POD_gratiano_recruit_gain_rank_count: "A count answers the call"
 POD_gratiano_recruit_gain_rank_baron: "A baron answers the call"
 POD_gratiano_recruit_decline_tt: "#Y A refusal may reach the court.#! Pious Lasombra are especially likely to report the invitation."
 POD_gratiano_recruit_joined_toast: "A New Blade in the Dark"
 POD_gratiano_recruit_refused_message: "The offer is declined. It may not remain private."
 POD_gratiano_recruit_refused_message_tt: "They will not join the conspiracy. Watch the court; a scandalized clanmate may repeat what they heard."

 POD_gratiano_recruit_accept_ambitious: "Ambition answers the hidden summons"
 POD_gratiano_recruit_accept_deceitful: "The deceitful relish a secret worth keeping"
 POD_gratiano_recruit_accept_disloyal: "The disloyal have no love for the sleeping founder"
 POD_gratiano_recruit_accept_content: "The content see no reason to reach for more"
 POD_gratiano_recruit_accept_zealous: "Zeal recoils from a merely pragmatic scheme"
 POD_gratiano_recruit_accept_eldest: "The mystique of the Eldest draws believers in"

###### Interaction: Leverage a Hook ######

 POD_gratiano_leverage_hook_interaction: "Call In the Debt"
 POD_gratiano_leverage_hook_interaction_desc: "Call in what you hold over this Cainite and press them into the conspiracy. They will serve because they must, and a recruit taken this way stays disloyal until given a better reason."

 POD_gratiano_leverage_hook_tt: "#bold The hook is spent.#!\n#P ++The Conspiracy#!: a strong hook yields more than a weak one.\nTheir resentment may eventually break the hold."

###### Interaction: Sell Out a Conspirator ######

 POD_gratiano_sell_out_interaction: "Hand Them to the Court"
 POD_gratiano_sell_out_interaction_desc: "Denounce one of your own to the founder's court. Your standing there recovers, the conspiracy is weaker for it, and the one you name will answer at a hearing."

 POD_gratiano_sell_out_tt: "#Y Betrayal buys standing.#!\nWord is sent to the court naming this one. Within days the court will act, raising your standing for the sacrifice while the conspiracy loses ground."
 POD_gratiano_sell_out_sent_message: "The letter is sent. The court will have its lesser traitor within days."
 POD_gratiano_sell_out_sent_message_tt: "The named conspirator has been offered up. Await the court's answer."

###### Decision: The Academy ######

 POD_gratiano_academy_decision: "Convene a Gathering"
 POD_gratiano_academy_decision_desc: "Open your house to invited Cainites for a night of talk. Each gathering trades Standing at court for Conspiracy. A night may draw a newcomer, and in time lets you enlarge the company or raise someone into your inner circle. The first night settles which creed the gatherings follow."
 POD_gratiano_academy_decision_effect_tt: "Conspiracy: increases\nStanding at court: decreases\nBoth change by more the larger the gathering, and by more under the Creed of the Eldest.\nIf you preside in person, a newcomer may present themselves afterward.\nOnce the gathering has been enlarged, talk of it may reach the founder's court."

###### Rival-pursuit decisions ######

 POD_gratiano_rival_focus_busy_desc: "Another rival campaign already holds your attention. Resolve it before you choose a new one."

 POD_gratiano_pursue_giovanni_decision: "Move Against the Giovanni"
 POD_gratiano_pursue_giovanni_decision_desc: "The Giovanni keep counting-houses and crypts from the Po to the Adriatic shore, and answer to no prince but their own. Turn your attention to ending that, until no kin of Augustus rules independently anywhere in Italy or along the Adriatic."
 POD_gratiano_pursue_giovanni_decision_effect_tt: "#bold Open the Giovanni campaign.#!\nThe first council convenes in Verona. This campaign #Y holds your attention#! until the Giovanni are broken, preventing any move against another rival."
 POD_gratiano_pursue_giovanni_launch_toast: "The long work against the Giovanni begins."
 POD_gratiano_pursue_giovanni_decision_tooltip: "Open the campaign to break the Giovanni's grip on the Italian sphere."
 POD_gratiano_pursue_giovanni_decision_confirm: "Begin the Campaign"

 POD_gratiano_pursue_ventrue_decision: "Move Against the Ventrue"
 POD_gratiano_pursue_ventrue_decision_desc: "Ventrue princes still rule in the Italian sphere in their own right, bound to no liege and free to take any side they please. Turn the conspiracy's attention to them, and keep it there until no Ventrue holds Italian ground except as someone's vassal."
 POD_gratiano_pursue_ventrue_decision_effect_tt: "#bold Open the Ventrue shadow war.#!\nThe campaign begins, and the Shadow War casus belli becomes available. While a Ventrue prince remains independent in the sphere, You are #Y committed to this campaign#! and cannot pursue another rival."
 POD_gratiano_pursue_ventrue_launch_toast: "The shadow war on the Ventrue begins."
 POD_gratiano_pursue_ventrue_decision_tooltip: "Begin the shadow war to clear the Ventrue interest from the Italian sphere."
 POD_gratiano_pursue_ventrue_decision_confirm: "Begin the Shadow War"

 POD_gratiano_pursue_moncada_decision: "Move Against Moncada"
 POD_gratiano_pursue_moncada_decision_desc: "Archbishop Moncada keeps Iberia's Lasombra in one hand and his childe Lucita in the other. Turn your attention to both: learn what he hides, press him where he proves weak, and settle with whichever of them still stands in your way."
 POD_gratiano_pursue_moncada_decision_effect_tt: "#bold Open the campaign against Moncada and Lucita.#!\nThe Cardinal's vigilance is roused and the reckoning begins. You are #Y committed to this campaign#! until both the Cardinal and the Prodigal Daughter are answered for; you cannot pursue another rival."
 POD_gratiano_pursue_moncada_launch_toast: "The reckoning with Cardinal Moncada begins."
 POD_gratiano_pursue_moncada_decision_tooltip: "Turn against Cardinal Moncada and the caged Lucita, and settle both accounts."
 POD_gratiano_pursue_moncada_decision_confirm: "Move Against the Cardinal"

 POD_gratiano_pursue_nahir_decision: "Move Against Nahir"
 POD_gratiano_pursue_nahir_decision_desc: "Nahir stands against you, and a Cainite of his standing is listened to when he does. Give the matter your full attention: seek him out, learn what it would cost to make him a friend, and weigh that against what it would cost to make him ash."
 POD_gratiano_pursue_nahir_decision_effect_tt: "#bold Open the campaign against Nahir.#!\nThe elder is brought within reach. You remain #Y committed to this campaign#! until Nahir is a friend or a corpse; you cannot pursue another rival."
 POD_gratiano_pursue_nahir_launch_toast: "The matter of Nahir is taken in hand."
 POD_gratiano_pursue_nahir_decision_tooltip: "Win back the elder Nahir's regard or end his grudge."
 POD_gratiano_pursue_nahir_decision_confirm: "Move Against Nahir"

 POD_gratiano.0020.t: "By Invitation"
 POD_gratiano.0020.desc: "The blood was offered for form's sake and stands untouched. Every guest in this room came because you asked, and each has spent the evening working out why the others were asked too. Now the talk has run down and they are looking at you.\n\nYou could tell them they are a fellowship of the passed over, and that whoever stands with you will rise as you rise. You could say more: that the Eldest have no right to rule the blood from their sleep, and that you are the one who will end it. Whichever you tell them is what these evenings become, and it cannot be unsaid."
 POD_gratiano.0020.a: "\"Stand with me and rise.\""
 POD_gratiano.0020.a.tt: "You adopt the Creed of Opportunity. This choice is permanent.\nCompared with the Creed of the Eldest, each gathering you preside over:\nYields 2 less Conspiracy\nCosts 2 less Standing at court"
 POD_gratiano.0020.b: "\"I will end the rule of the Eldest.\""
 POD_gratiano.0020.b.tt: "You adopt the Creed of the Eldest. This choice is permanent.\nCompared with the Creed of Opportunity, each gathering you preside over:\nYields 2 more Conspiracy\nCosts 2 more Standing at court\nEach newcomer you later accept is usually zealous (60% chance)."

 POD_gratiano.0021.t: "An Evening Under Your Roof"
 POD_gratiano.0021.desc: "The talk under your roof tonight is the talk of the passed over: the domain that went to another, the sire who will never step aside. It does not stay there. Each grievance ends at your name, and somebody is already repeating a phrase of yours as though it were their own. The places nearest your chair were taken early, by those who most want your eye.\n\nThey want to be seen at your side, and to be remembered when you have places to give. The night will be spent in your name, however much or little of it you give them."
 POD_gratiano.0021.desc.eldest: "Your guests talk at full voice under your roof tonight. They speak of the Eldest, of how long sleepers have ruled the blood and how soon that must end, and they give the ending your name. Some say it as if a prayer. The seats nearest yours have all been turned a little toward it.\n\nThey believe what they are saying, and they will say it as freely on the road home as they do here. That makes these evenings hard to keep from the founder's court."
 POD_gratiano.0021.a: "Preside in person until dawn."
 POD_gratiano.0021.a.tt: "Conspiracy: +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_conspiracy_yield_value')|0]\nStanding at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_trust_loss_value')|0]\nA newcomer may present themselves to you afterward.\nThis night counts toward enlarging the gathering."
 POD_gratiano.0021.b: "Stay away and let my name preside."
 POD_gratiano.0021.b.tt: "Conspiracy: +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_conspiracy_yield_half_value')|0]\nStanding at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_trust_loss_half_value')|0]\nNo newcomer will come of tonight.\nThis night does not count toward enlarging the gathering."
 POD_gratiano.0021.c: "Preside, and consider a larger gathering."
 POD_gratiano.0021.c.tt: "Conspiracy: +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_conspiracy_yield_value')|0]\nStanding at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_trust_loss_value')|0]\nYou then decide whether to enlarge the gathering.\nIf you decide against it, you may weigh it again at any later gathering you preside over.\nNo newcomer will come of tonight."
 POD_gratiano.0021.d: "Preside, and raise someone to the inner circle."
 POD_gratiano.0021.d.tt: "Conspiracy: +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_conspiracy_yield_value')|0]\nStanding at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_trust_loss_value')|0]\nYou then choose who joins the coterie.\nNo newcomer will come of tonight.\nThis night counts toward enlarging the gathering."

 POD_gratiano.0022.t: "An Uninvited Caller"
 POD_gratiano.0022.desc: "A few days after your last evening, a Lasombra you did not invite is waiting in your hall. [gratiano_academy_recruit.GetShortUIName] has no lands and no house to speak for [gratiano_academy_recruit.GetHerHim], and is no fledgling. [gratiano_academy_recruit.GetSheHe|U] has heard what is said of you and of the nights you keep, and asks to be admitted to them. You have promised nothing."
 POD_gratiano.0022.desc.intrigue: "Within days of your last evening, [gratiano_academy_recruit.GetShortUIName] has reached your steward, then one of your guests, and finally you, recommended by people who cannot say where they met [gratiano_academy_recruit.GetHerHim]. [gratiano_academy_recruit.GetSheHe|U] is a landless Lasombra of some years in the blood, and has never been under your roof before tonight. What is said of you made the effort worthwhile, [gratiano_academy_recruit.GetSheHe] tells you. The rest of [gratiano_academy_recruit.GetHerHis] story has changed a little with each listener."
 POD_gratiano.0022.desc.martial: "Two of your guests were in the hall when [gratiano_academy_recruit.GetShortUIName] was shown in, and both have since remembered other business. [gratiano_academy_recruit.GetSheHe|U] did nothing to them beyond answering a pleasantry with a look. [gratiano_academy_recruit.GetSheHe|U] is Lasombra, landless, some years in the blood, and no talker. To you [gratiano_academy_recruit.GetSheHe] says only that [gratiano_academy_recruit.GetSheHe] has heard what kind of company you keep, that such company needs a soldier, and that [gratiano_academy_recruit.GetSheHe] dislikes being made to ask twice."
 POD_gratiano.0022.desc.learning: "[gratiano_academy_recruit.GetShortUIName] has never attended one of your evenings and describes them to you accurately. [gratiano_academy_recruit.GetSheHe|U] has worked it out from outside, [gratiano_academy_recruit.GetSheHe] explains: which Cainites are abroad on the same nights, and whose opinions have lately begun to sound like yours. [gratiano_academy_recruit.GetSheHe|U] is a landless Lasombra, some years in the blood, and speaks without hurry, as someone who expected to wait for this audience and would have waited longer. [gratiano_academy_recruit.GetSheHe|U] does not flatter you. [gratiano_academy_recruit.GetSheHe|U] says [gratiano_academy_recruit.GetSheHe] would like to see whether the room matches the reckoning."
 POD_gratiano.0022.desc.diplomacy: "By the time you come down, [gratiano_academy_recruit.GetShortUIName] has been in your house an hour and has spent it well. Your doorkeeper, who admits no one unannounced, is laughing. One of your guests is midway through a grievance [gratiano_academy_recruit.GetSheHe] appears to find fascinating. [gratiano_academy_recruit.GetSheHe|U] is Lasombra, landless, some years in the blood and new to your roof, and [gratiano_academy_recruit.GetSheHe] greets you as though you were the one expected. [gratiano_academy_recruit.GetSheHe|U] has heard a great deal about your evenings, [gratiano_academy_recruit.GetSheHe] says, all of it from people who were not asked, and [gratiano_academy_recruit.GetSheHe] would prefer to be among those who were. [gratiano_academy_recruit.GetSheHe|U] already knows every name in the hall."
 POD_gratiano.0022.desc.stewardship: "[gratiano_academy_recruit.GetShortUIName] opens with a figure. It is what your last evening cost you in blood nobody drank and servants paid to forget, and it is close enough to the truth to be impertinent. [gratiano_academy_recruit.GetSheHe|U] is a landless Lasombra of some years, never once your guest, and has reckoned all this from the street. [gratiano_academy_recruit.GetSheHe|U] can run such evenings for less, [gratiano_academy_recruit.GetSheHe] says. [gratiano_academy_recruit.GetSheHe|U] is as exact about what a place near you should be worth to [gratiano_academy_recruit.GetHerHim]."
 POD_gratiano.0022.a: "\"There is a place for you here.\""
 POD_gratiano.0022.a.tt: "[gratiano_academy_recruit.GetShortUIName] joins your court.\n[gratiano_academy_recruit.GetSheHe|U] joins the conspiracy and can later be raised to the inner circle.\nUnder the Creed of the Eldest, [gratiano_academy_recruit.GetSheHe] will probably prove zealous (60% chance)."
 POD_gratiano.0022.b: "\"My evenings are by invitation.\""
 POD_gratiano.0022.b.tt: "[gratiano_academy_recruit.GetShortUIName] leaves, joining neither your court nor the conspiracy.\nThis costs nothing, and no word reaches the founder's court."

 POD_gratiano.0023.t: "Too Many at the Door"
 POD_gratiano.0023.desc: "Guests stood tonight who would once have sat, and your household has turned away more requests than you have troubled to count. The evenings have grown customs: an order of arrival, a certain rank that comes of having been asked back. Cainites who have never attended speak of them as something one attends.\n\nYou could make room. More of them gathered around you means more who are yours when it matters, and a company that large is one the founder's court can hardly fail to notice."
 POD_gratiano.0023.a: "Make room for them."
 POD_gratiano.0023.a.tt: "Standing at court: -3\nEach gathering you preside over now yields 1 more Conspiracy and costs 1 more Standing at court.\nNewcomers present themselves more often.\nTalk of the gatherings is more likely to reach the founder's court.\nThe gathering cannot grow again until you have presided over three more."
 POD_gratiano.0023.b: "Leave it as it is for now."


 POD_gratiano.0024.t: "Your Name in Other Mouths"
 POD_gratiano.0024.desc: "It has come back to you that someone at the founder's court has been counting your guests: how many Cainites now spend their evenings under your roof, and how they speak of you. The court has made gossip of it. They say a courtier with so many admirers of his own bears watching, and at that court to be watched is to be trusted less.\n\nThere are voices there that could quiet it, for a price."
 POD_gratiano.0024.a: "Ignore the gossip."
 POD_gratiano.0024.a.tt: "Standing at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_rumor_trust_loss_value')|0]"
 POD_gratiano.0024.b: "Pay those who can quiet it."
 POD_gratiano.0024.b.tt: "Standing at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_rumor_smothered_loss_value')|0]\nThe harm is halved, not undone."

###### Coterie induction & loyalty tests ######

 POD_gratiano_induction_toast: "A Seat at the Innermost Table"
 POD_gratiano_induction_toast_tt: "They join your coterie, the inner circle bound to your cause. These are the companions who will climb the castle beside you when the time comes."

 POD_gratiano.0025.t: "A Place Beside You"
 POD_gratiano.0025.desc: "Tonight you mean to call someone up beside you, and the room seems to have guessed it; the talk has grown careful. The inner circle is kept small: the few who will go with you against the founder when the night comes. You have weighed the conspirators who hold no lands of their own, by the sharpness of their scheming and by what they can do when scheming fails.\n\nWhoever you choose, the rest will watch you do it and draw their conclusions. You may also let the evening pass and call no one."
 POD_gratiano.0025.a: "Raise [gratiano_inductee_mind.GetFirstNameNoTooltip], the keenest schemer."
 POD_gratiano.0025.a.tt: "[gratiano_inductee_mind.GetFirstNameNoTooltip] joins the coterie, the inner circle that will go with you against the founder.\n[gratiano_inductee_mind.GetFirstNameNoTooltip] also joins your court, if not already of it."
 POD_gratiano.0025.b: "Raise [gratiano_inductee_blade.GetFirstNameNoTooltip], the deadliest hand."
 POD_gratiano.0025.b.tt: "[gratiano_inductee_blade.GetFirstNameNoTooltip] joins the coterie, the inner circle that will go with you against the founder.\n[gratiano_inductee_blade.GetFirstNameNoTooltip] also joins your court, if not already of it."
 POD_gratiano.0025.c: "Call no one tonight."

 POD_gratiano.0026.t: "The Last Place Filled"
 POD_gratiano.0026.desc: "The conspirator you chose takes the last place in your coterie. The others came to you by their own roads. When you go to the castle to face the founder, these are the Cainites who will go with you."
 POD_gratiano.0026.a: "The circle is made."

 POD_gratiano.0027.t: "One Who Wavers"
 POD_gratiano.0027.desc: "[gratiano_waverer.GetShortUIName] is yours because of what you hold over [gratiano_waverer.GetHerHim], never because your evenings won [gratiano_waverer.GetHerHim], and lately it shows. [gratiano_waverer.GetSheHe|U] watches the door while others watch you, and your people have begun to remark on it. You could face [gratiano_waverer.GetHerHim] yourself and remind [gratiano_waverer.GetHerHim] what you hold. Most likely that ends [gratiano_waverer.GetHerHis] doubts. If it fails, [gratiano_waverer.GetSheHe] will flee, and the founder's court will hear within weeks. Putting [gratiano_waverer.GetHerHim] out now is safer but still not safe."
 POD_gratiano.0027.a: "Face [gratiano_waverer.GetHerHim] down myself."
 POD_gratiano.0027.a.tt: "[GetPlayer.MakeScope.ScriptValue('POD_gratiano_overawe_success_percent_value')|0]% chance [gratiano_waverer.GetShortUINamePossessive] doubts end and [gratiano_waverer.GetSheHe] stays.\nOtherwise [gratiano_waverer.GetSheHe] leaves the conspiracy and reports to the founder's court.\nIf [gratiano_waverer.GetSheHe] sat in the coterie, [gratiano_waverer.GetSheHe] leaves as your rival."
 POD_gratiano.0027.c: "Put [gratiano_waverer.GetHerHim] out before [gratiano_waverer.GetSheHe] talks."
 POD_gratiano.0027.c.tt: "[gratiano_waverer.GetShortUIName] leaves the conspiracy.\nConspiracy: -3\n30% chance [gratiano_waverer.GetSheHe] reports to the founder's court.\nIf [gratiano_waverer.GetSheHe] sat in the coterie, [gratiano_waverer.GetSheHe] leaves as your rival."

 POD_gratiano_overawe_success_message: "The doubter submits and remains in the circle."
 POD_gratiano_waverer_bolts_message: "The doubter bolts into the night and carries the circle's secrets away."

###### Word Reaches the Court & the Unwilling Conspirator ######

 POD_gratiano.0040.t: "Someone Has Talked"
 POD_gratiano.0040.desc: "Midway through the night's audience, one of the elders repeats to the hall a remark of yours about the founder's long sleep and how patient the clan's younger blood is expected to be while it lasts. The wording is exact. You said it once, in private.\n\nThe benches laugh. The elder explains, pleasantly, that someone gave the court that whole evening in writing nights ago and that the elders have already drawn their conclusions about you."
 POD_gratiano.0040.a: "Say nothing. It will pass."
 POD_gratiano.0040.a.tt: "No further effect. The Standing already lost stays lost."
 POD_gratiano.0040.b: "Remind the court who I am."
 POD_gratiano.0040.b.tt: "You spend prestige answering the report and regain 3 Standing at court."
 POD_gratiano.0040.c: "Pay the informer a private visit."

 POD_gratiano_informant_silenced_message: "The informant is frightened into silence. No second report follows."
 POD_gratiano_informant_backfire_message: "The informant answers pressure with another, firmer report."

 POD_gratiano.0041.t: "An Unwilling Recruit"
 POD_gratiano.0041.desc: "You had only to name what you hold over [recipient.GetFirstNameNoTooltip]. [recipient.GetSheHe|U] hears the rest standing, though you offered a chair, and agrees to all of it. Then [recipient.GetSheHe] asks what you want of [recipient.GetHerHim] first."
 POD_gratiano.0041.a: "Service is all I asked for."
 POD_gratiano.0041.a.tt: "[recipient.GetSheHe|U] serves the conspiracy and remains disloyal.\nNothing is done to win [recipient.GetHerHim] over."
 POD_gratiano.0041.b: "Pay well for what was taken."
 POD_gratiano.0041.b.tt: "[recipient.GetHerHis|U] disloyalty is removed.\nOnce paid, [recipient.GetSheHe] thinks better of you."

###### Sell Out: the court beat & the escapee ######

 POD_gratiano.0042.t: "The Hearing"
 POD_gratiano.0042.desc: "The court takes the matter late, between two disputes over tolls. The conspirator you named stands between two wardens and has looked at no one but you since the doors opened.\n\nYour denunciation has already cost the conspiracy one of its own, and those who remain will count the empty place. The elders turn to you as accuser and ask what you would have done. A hard sentence would speak well of you here. No sentence the court passes is certain to hold."
 POD_gratiano.0042.a: "Ask the court for Final Death."
 POD_gratiano.0042.a.tt: "The accused leaves the conspiracy and is condemned to die.\nYou regain Standing at court.\nThe accused may escape; a coerced recruit is more likely to."
 POD_gratiano.0042.b: "Exile will be punishment enough."
 POD_gratiano.0042.b.tt: "You regain less Standing at court than an execution would bring.\nThe accused is exiled, or escapes and turns against you."

 POD_gratiano_sellout_destroyed_message: "The court executes the conspirator before they can expose the circle."
 POD_gratiano_sellout_escaped_message: "The conspirator escapes before the court can act, knowing exactly whose testimony sent the court after them."
 POD_gratiano_sellout_exiled_message: "The court strips the conspirator of place and casts them into exile."
 POD_gratiano_sellout_survivors_tt: "#Y The circle takes note.#!\nThe surviving inner circle turns colder toward a leader who trades his own away, and some among the outer circle begin to consider leaving."

 POD_gratiano.0043.t: "An Enemy at Large"
 POD_gratiano.0043.desc: "The wardens went to carry out the sentence and found no one to carry it out on. However it was managed, [gratiano_sellout_target.GetFirstNameNoTooltip] is alive and beyond the court's reach, finished with your conspiracy and your enemy from this night on.\n\n[gratiano_sellout_target.GetFirstNameNoTooltip] knows names, meeting places, and whose idea all of it was. So far, no word of it has come back to court."
 POD_gratiano.0043.a: "A traitor's word against mine."
 POD_gratiano.0043.a.tt: "The escaped conspirator leaves the conspiracy and becomes your rival.\nThey may later report the conspiracy to court."

###### Decision: Curry Favor & the throne beat ######

 POD_gratiano_curry_favor_decision: "Curry Favor in Court of the Founder"
 POD_gratiano_curry_favor_decision_desc: "Present yourself at the founder's court and be seen to wait your turn: attend the audiences, defer to your elders, praise what is praised. Some tedious nights of it will mend your Standing at court."
 POD_gratiano_pay_court_effect_tt: "#P +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_pay_court_trust_gain_value')|0] Standing at court#!"

 POD_gratiano.0044.t: "Paying Court"
 POD_gratiano.0044.desc: "You arrive early and stand where you are told. You laugh at an elder's story you have heard before, yield a precedence you could have argued, and bow at the proper depth to the empty seat kept for the founder. It is noticed, and it is counted in your favor.\n\nAs the hall thins, a chamberlain lingers at your elbow with the patience of one accustomed to gifts."
 POD_gratiano.0044.a: "I have bowed enough for one night."
 POD_gratiano.0044.b: "A gift would not go amiss."
 POD_gratiano.0044.b.tt: "Your tribute earns a further [GetPlayer.MakeScope.ScriptValue('POD_gratiano_pay_court_tribute_bonus_value')|0] Standing at court."

###### Giovanni arc (0060-0078) ######

###### Giovanni milestones (0073-0075) ######

 POD_gratiano.0073.t: "Italy Without Giovanni Princes"
 POD_gratiano.0073.desc: "The last reports agree. From the Alpine passes to the Adriatic ports, no Giovanni holds a county in their own right. Whether they knelt, left or burned matters less than the result. The family itself endures, and its ledgers are surely still open in a dozen cities. Any Giovanni who remains in these lands now does so under another's seal."
 POD_gratiano.0073.a: "Their rule here is finished."
 POD_gratiano.0073.checklist_tt: "The Giovanni territorial requirement is met.\nIt reopens if independent Giovanni rule returns before the plan is sealed."

 POD_gratiano.0074.t: "The Giovanni Return"
 POD_gratiano.0074.desc_named: "[POD_gratiano_giovanni_blocker.GetTitledFirstNameNoTooltip] now rules a county inside the lands you had cleared, and answers to no one. While that stands, your work against the Giovanni is unfinished again."
 POD_gratiano.0074.desc_crown: "Your informants bring the same news by different roads: a Giovanni is ruling independently again somewhere in Italy or along the Adriatic. The reports disagree about who and where. They agree that the family holds land in its own right, which is the one thing you had ended."
 POD_gratiano.0074.a: "The Giovanni must be cleared out again."
 POD_gratiano.0074.reopen_tt: "The Giovanni territorial requirement is no longer met."
 POD_gratiano.0075.t: "The Witness Is Dead"
 POD_gratiano.0075.desc: "Laura di Salerno has met Final Death. She gave her testimony against Augustus Giovanni and you gave her your protection, and that promise still stood on the night she ended.\n\nWhether Augustus had any part in it, no one can tell you. Those who are talking do not wait to find out. A witness you had promised to shelter is gone, your protection did not hold, and the story costs your name and your standing at the founder's court."
 POD_gratiano.0075.a: "My protection should have held."
 POD_gratiano.0075.a.tt: "Standing at court: -5"


###### The Necromancer King - intro & route hub (0060-0061) ######

 POD_gratiano.0060.t: "Against the House of Giovanni"
 POD_gratiano.0060.desc: "Augustus Giovanni holds Veneto, and his kin rule in cities across Italy as though the peninsula were a family estate. Shaming him at court would not move one of them. You mean to have every county in Italy and on the Adriatic shore out of independent Giovanni hands, beginning with his."
 POD_gratiano.0060.desc_fallen: "Augustus Giovanni no longer rules in his own right, and it would be easy to call the matter closed. The family does not work that way. A necromancer's kin are used to carrying on after a loss in the house, and wherever one of them still holds a county in Italy or along the Adriatic with no lord above, the name keeps its footing. What is left is a question of land. Find each Giovanni who still rules independently within those bounds, and see that they stop."
 POD_gratiano.0060.a: "Clear them from these lands."

 POD_gratiano.0061.t: "The Giovanni Ledger"
 POD_gratiano.0061.desc: "While any Giovanni rules in Italy, your papers on the family come back before your council. The headings do not change. Whatever has been settled since the last sitting has a line through it.\n\nThe Veneto. Augustus himself, who might take a price to leave, or be made to fear a well-kept record of his dealings. Turin. Pisa."
 POD_gratiano.0061.a: "Veneto wants a better claimant."
 POD_gratiano.0061.c: "Offer Augustus a price to leave."
 POD_gratiano.0061.d: "Start a record of Augustus's crimes."
 POD_gratiano.0061.e: "Turn to Lucretia in Turin."
 POD_gratiano.0061.f: "Pisa, and the Giovanni who holds it."
 POD_gratiano.0061.g: "Enough for now. Let it wait."
 POD_gratiano.0061.h: "Consider Ambrogino, Augustus's own vassal."

###### Break-him: the claim (0062), the ruin war (0063) ######

 POD_gratiano.0062.t: "A Claim on Veneto"
 POD_gratiano.0062.desc: "Augustus holds Veneto, and holding is most of the law. The rest is parchment, and parchment can be arranged. Old grants can be found again, a clerk can remember a boundary differently, and people of standing can be brought to swear that your right to the county is older and better than a merchant's.\n\nNone of it comes cheap, and none of it moves Augustus one step out of his halls. What it buys is a claim that others will recognize as pressed and lawful when you choose to enforce it."
 POD_gratiano.0062.a: "Pay for the parchment."
 POD_gratiano.0062.b: "Not at this price."


###### Point-him-elsewhere: the embassy (0064), the answer (0065), the departure (0066) ######

 POD_gratiano.0064.t: "An Embassy to Augustus"
 POD_gratiano.0064.desc: "Augustus was a merchant before he was anything else, and merchants understand an offer. Your envoys would carry one: a sum paid, and in return his withdrawal from the contested lands. How he hears it depends on his position when they arrive. A ruler at war or under Ossium's condemnation prices his holdings lower, and one who thinks well of you listens longer. If he has refused you before, he will remember that he survived saying so."
 POD_gratiano.0064.a: "Send them, and wait."
 POD_gratiano.0064.offer_tt: "Your embassy offers Augustus [GetPlayer.MakeScope.ScriptValue('POD_gratiano_giovanni_bargain_cost_value')|0] gold to withdraw from the contested lands.\nHis answer will come later."
 POD_gratiano.0064.sent_toast: "Embassy Sent to Augustus"
 POD_gratiano.0064.b: "Keep the envoys home."

 POD_gratiano.0065.t: "Augustus Answers"
 POD_gratiano.0065.desc_yes: "Your envoys return with a sealed letter and the look of people who were fed well. Augustus accepts. He writes as though the idea were his own, lists what he will surrender, and names the sum again in case you had hoped he forgot it.\n\nThe price is still to be paid, and one line of the agreement waits on you: the name of whoever is to receive the lands he gives up."
 POD_gratiano.0065.desc_no: "Your envoys are back sooner than a serious negotiation would have taken. Augustus received them, heard the sum, and declined it before the wine was poured. He sent no counter-offer. The lands you named are still his, every one, and the envoys report that he seemed more amused than tempted. They are careful about how they repeat his words to you."
 POD_gratiano.0065.a: "Pay him. Guilelmo takes the lands."
 POD_gratiano.0065.b: "Pay him. The lands are mine."
 POD_gratiano.0065.c: "So he prefers it the hard way."
 POD_gratiano.0065.d: "Take the lands now and owe him."
 POD_gratiano.0065.account_tt: "You pay nothing now.\nWithin six years, Augustus calls in the debt at twice the price.\nRefusing him then costs Standing at court."

 POD_gratiano.0066.t: "Augustus Withdraws"
 POD_gratiano.0066.desc: "The sum is counted twice, by his people and then by yours. Augustus gives up Veneto, and with it whatever he held at Pula, and the kingdom he had styled for himself ceases to exist under the same signatures. He is no pauper for it. What he owns beyond Italy and the Adriatic remains his, and that is where his household's sealed crates are now bound."
 POD_gratiano.0066.a: "A fair price for his absence."
 POD_gratiano.0066.desc_account: "Augustus Giovanni puts his name to the last sheet. The Veneto is given up, and whatever he held on the Istrian coast with it; the same signatures dissolve the kingdom he styled for himself. He leaves Italy for the lands he keeps beyond the Alps.\n\nNo gold goes with him. He carries your acknowledged debt instead, a Major Boon recognized by all, and he has entered it in his books. Augustus is a merchant, and he collects on what he is owed."
 POD_gratiano.0066.b: "He is gone. The account stays open."

###### Expose-him: the evidence chain (0067-0070) ######

 POD_gratiano.0067.t: "The Case Against Augustus"
 POD_gratiano.0067.desc: "It is whispered that Augustus Giovanni plots against Cappadocius, the sire who gave him the blood. Rumor alone is no use to you, but a record that could be laid before his elders would give you something to hold over him when you ask him to leave. It will not take one county from one Giovanni by itself.\n\nDrenis is said to know enough to give the charge a voice, and to be willing to speak for a price. Otherwise letters can be written in other hands, and seals can be cut."
 POD_gratiano.0067.desc_no_witness: "It is said that Augustus Giovanni plots against Cappadocius, his own sire. Rumor is no use to you. You want it set down in a form the elders of his clan could act on, and you want Augustus to know it exists on the night you ask him to leave Italy.\n\nDrenis, who might have sold you testimony, is beyond reach. Forgery is always possible: letters in borrowed hands, seals cut to order."
 POD_gratiano.0067.a: "Buy Drenis's testimony."
 POD_gratiano.0067.witness_tt: "Drenis's testimony makes the dossier more likely to pass scrutiny."
 POD_gratiano.0067.b: "Forge what is needed."
 POD_gratiano.0067.forge_tt: "The dossier is built on forged evidence, without purchased testimony."
 POD_gratiano.0067.desc_laura: "\n\nLaura di Salerno writes to you from Grosseto. \"My clan shuns me. I am of Japhet's line all the same, and Japhet is Cappadocius's own childe. What Augustus plots is against the founder of my blood. I will say what I know of him and ask no payment.\"\n\nYour people read the letter and suspect a second reason she does not give: Grosseto lies beside Pisa's country, and the Giovanni have long pressed on that border. If she speaks, Augustus will know whose word it was, and she has no clan to shelter her."
 POD_gratiano.0067.c: "Take Laura's testimony and protect her."
 POD_gratiano.0067.laura_tt: "Laura's testimony makes the dossier more likely to pass scrutiny.\nAugustus may strike at her instead of you.\nIf she dies under your protection, you lose prestige and Standing at court."

 POD_gratiano.0068.t: "The Dossier Examined"
 POD_gratiano.0068.desc: "The dossier is finished and about to leave your hands. Careful readers will go through it line by line. A living witness helps it stand, as does your own skill at intrigue and scholarship. If it falls apart under their eyes, your standing at court pays for it, and its trail can be followed back to you."
 POD_gratiano.0068.a: "Let them read it."
 POD_gratiano.0068.success_toast: "Dossier Holds; a Hearing Can Follow"
 POD_gratiano.0068.fail_toast: "Dossier Discredited; Your Standing at Court Suffers"

 POD_gratiano.0069.t: "Before the Ossium Judge"
 POD_gratiano.0069.desc: "The dossier has survived its readers, and now it needs someone with the authority to act on it. Ossium has such a judge, living and holding lands, who can hear the charge. A condemnation from that bench will follow Augustus into every hall where his credit used to be good, and the one who pronounces it will have made an enemy of him for as long as both endure."
 POD_gratiano.0069.desc_no_court: "The dossier is sound, and there is nowhere to take it. No judge of Ossium is both living and landed, and without one there is no hearing and no condemnation to be had."
 POD_gratiano.0069.a: "Have Augustus condemned."
 POD_gratiano.0069.b: "Withdraw the charge for now."
 POD_gratiano.0069.no_court_toast: "No Judge to Hear the Charge"

 POD_gratiano.0070.t: "Augustus Condemned"
 POD_gratiano.0070.desc: "Ossium's condemnation reaches Augustus, and he does what a merchant does with a loss: he looks for who profited. His people are questioning couriers and clerks, and going back over who asked what, and when. You took care that the charge would not carry your name. Whether you took enough is being decided now, in rooms you cannot see into."
 POD_gratiano.0070.a: "Let him look."
 POD_gratiano.0070.blamed_toast: "Augustus Names You His Accuser"
 POD_gratiano.0070.unseen_toast: "Your Hand Stays Hidden"
 POD_gratiano.0070.laura_toast: "Augustus Names Laura His Accuser"

###### Lucretia (0071) & Petrus (0072) support beats ######

 POD_gratiano.0071.t: "Lucretia of Turin"
 POD_gratiano.0071.desc: "Lucretia Giovanni rules Turin and answers to no one, which is the whole of your objection to her. She is a scholar by temperament, more often found among her books and her dead than at her own court, and those who deal with her say she weighs risks strangely, as if her own destruction were one more thing to be curious about. Pressure that would bend another ruler may only interest her.\n\nStill, she could be brought to hold Turin as your vassal. Something held over her might do it, though a threat she refuses would leave you an enemy where you had a neighbor. Gold might do it more quietly. Or Turin could simply lose its mistress, which is a different undertaking with its own risks."
 POD_gratiano.0071.a: "Use what I hold over her."
 POD_gratiano.0071.bent_toast: "Lucretia Swears Fealty to You"
 POD_gratiano.0071.defied_toast: "Lucretia Defies You, Now Your Rival"
 POD_gratiano.0071.b: "Offer her gold for her fealty."
 POD_gratiano.0071.gold_refused_toast: "Lucretia Refuses Your Terms"
 POD_gratiano.0071.c: "Plot her destruction."
 POD_gratiano.0071.d: "Leave her to her books."

 POD_gratiano.0072.t: "The Giovanni of Pisa"
 POD_gratiano.0072.desc: "Petrus Giovanni rules Pisa under no lord, and Pisa is a port you would rather not leave in the family's hands. Your informants can tell you little about him beyond what he holds, so there is less to work with than you would like. The ordinary tools remain: a hold over him if you have one, gold if he will take it, or a quieter end.\n\nAnd if Augustus has already withdrawn from Italy and keeps a court elsewhere, there is a tidier answer. Petrus can be sent to join him, and Pisa left behind."
 POD_gratiano.0072.a: "Take Pisa; send [POD_gratiano_pisa_lord.GetHerHim] to Augustus."
 POD_gratiano.0072.b: "Press [POD_gratiano_pisa_lord.GetHerHim] with what I hold."
 POD_gratiano.0072.bent_toast: "[POD_gratiano_pisa_lord.GetFirstNameNoTooltip] Swears Fealty"
 POD_gratiano.0072.defied_toast: "[POD_gratiano_pisa_lord.GetFirstNameNoTooltip] Defies You"
 POD_gratiano.0072.c: "Offer [POD_gratiano_pisa_lord.GetHerHim] gold for [POD_gratiano_pisa_lord.GetHerHis] fealty."
 POD_gratiano.0072.gold_refused_toast: "Gold Spent, [POD_gratiano_pisa_lord.GetFirstNameNoTooltip] Unmoved"
 POD_gratiano.0072.d: "Plot [POD_gratiano_pisa_lord.GetHerHis] destruction."
 POD_gratiano.0072.e: "Pisa can wait."
 POD_gratiano.0072.desc_martino: "Martino rules Pisa now, and under no lord. That can only mean Petrus, his sire, no longer holds the city. Martino was Embraced to be an obedient hand. He is young, quiet and shy, and Petrus never meant him to give orders, least of all in a port you would rather not leave to the family.\n\nHe is likelier than most to give way to pressure or to gold. The usual tools are to hand: a hold over him, if you have one; a purse; or a quieter end. And if Augustus has already left Italy and keeps a court elsewhere, Martino could simply be sent to join it, and Pisa kept."
 POD_gratiano.0072.desc_other: "[POD_gratiano_pisa_lord.GetFirstNameNoTooltip] rules Pisa now, a Giovanni. Whoever holds it, Pisa is a port, and you would rather not leave a port in the family's hands.\n\nThe ordinary means are open to you: a hold over [POD_gratiano_pisa_lord.GetHerHim], if you have one; a purse; or a quieter end. And if Augustus has already left Italy and keeps a court elsewhere, [POD_gratiano_pisa_lord.GetSheHe] could be sent to join it, and Pisa kept."

###### Giovanni blowback (0076/0077/0078) ######

 POD_gratiano.0076.t: "Blood for Augustus"
 POD_gratiano.0076.desc: "Augustus Giovanni is destroyed, and the family has taken the matter the way it takes any unpaid debt. One of his senior kin has assumed it personally. You hear it from people who owe you favors: questions asked about your havens and your servants, money moving toward those who do violence for hire. Someone among the Giovanni means to collect for Augustus, and has the patience and the means to try."
 POD_gratiano.0076.desc_heir: "Augustus is destroyed, and his crown did not fall with him. The Giovanni kingdom has a new holder, and the family still speaks with a sovereign's voice. The vengeance is a separate thing, and personal: one of Augustus's senior kin means to answer for his death, with or without a crown's blessing. Your informants are certain of the intent."
 POD_gratiano.0076.a: "Augustus's kin are welcome to try."

 POD_gratiano.0077.t: "Traced to Your Door"
 POD_gratiano.0077.desc: "The failed dossier has found its author. Someone followed it back through the copyists and the couriers, and your name is now attached to it in open talk. A court that shrugged at a discredited accusation is less forgiving of the one who arranged it. If Augustus still walks the night, he has heard as well, and he knows whom to thank."
 POD_gratiano.0077.a: "So they know. Weather it."

 POD_gratiano.0078.t: "Augustus Adds an Insult"
 POD_gratiano.0078.desc: "Refusing you was not enough for Augustus. Since your envoys left, he has been telling the story at his own table and letting it travel: the Lasombra who came to buy what he lacked the strength to take, and the sum, which he repeats as though it were the joke. He meant the story to reach you, and it has, through three separate mouths. His refusal stands. He has made certain that neither of you will forget how the offer ended."
 POD_gratiano.0078.a: "He will pay more dearly yet."
 POD_gratiano.0079.t: "Augustus Presents the Account"
 POD_gratiano.0079.desc: "The letter comes over the Alps from Augustus's court in a clerk's clean hand, and it reads like a bill because it is one. Some years ago he left Italy on your promise to pay later. He has held a Major Boon over you since. Now he presents the account, and the figure at the foot is twice the price first agreed.\n\nThe lands he gave up changed hands long ago. A recognized debt left unpaid is another matter: the founder's court would hold the default against you, Augustus would keep his boon, and you would have him for an open enemy."
 POD_gratiano.0079.a: "Pay him what is owed."
 POD_gratiano.0079.b: "Augustus will have nothing from me."
 POD_gratiano.0079.b.tt: "Standing at court: -15\nAugustus keeps his Major Boon over you."
 POD_gratiano.0080.t: "A Kinsman for Sale"
 POD_gratiano.0080.desc: "Ambrogino Giovanni rules Dalmatia as Augustus's vassal. He is not of Augustus's blood. A necromancer whose ambitions run far past the family's counting-houses, he has insulted nearly every elder who carries the name and has no friend among them.\n\nYour people report that he would sell what he knows of Augustus's dealings, and his own future allegiance with it, for gold. The same report has a second market. Augustus still holds the Veneto, and he would be grateful to learn which of his kinsmen is for sale.\n\nNothing is committed yet. Ambrogino has had dealings with the Ventrue prince Fabrizio as well, and a Fabrizio still on his throne would take it badly to find his man bought from under him."
 POD_gratiano.0080.a: "Pay Ambrogino what he asks."
 POD_gratiano.0080.bought_tt: "Ambrogino's word strengthens any dossier against Augustus.\nAugustus becomes more likely to accept a bargain to leave.\nIf Augustus leaves Italy, Ambrogino will offer you his fealty."
 POD_gratiano.0080.b: "Let Augustus learn who is for sale."
 POD_gratiano.0080.exposed_tt: "Augustus becomes more likely to accept a bargain to leave."
 POD_gratiano.0080.c: "This will keep until another night."
 POD_gratiano.0081.t: "Ambrogino Keeps His Bargain"
 POD_gratiano.0081.desc: "Augustus has been gone from Italy some weeks, his kingdom dissolved behind him, and Ambrogino Giovanni rules his stretch of the Adriatic shore. You paid him for this night some time ago. He has not forgotten it.\n\nHe offers to swear fealty to you and to bring his lands with the oath. A Giovanni vassal across the water would be a gain and a liability in the same person. Refused, he would go his own way over there. Either way, he is no threat to your work against the family in Italy."
 POD_gratiano.0081.a: "Take his oath, and his shore."
 POD_gratiano.0081.b: "Keep your shore, Ambrogino, and your counsel."

###### The condemned-conspirator brand (evidence-chain modifier) ######

 POD_gratiano_condemned_conspirator_modifier: "Condemned Conspirator"
 POD_gratiano_condemned_conspirator_modifier_desc: "Named before the court and condemned for a part in a conspiracy. Whatever the sentence, and whether or not it was ever carried out, the name is fouled: others keep their distance, and what renown remains drains away month by month."
 POD_gratiano_friuli_door_modifier: "Friuli Opened from Within"
 POD_gratiano_friuli_door_modifier_desc: "Khadijah Saadeh's people inside Friuli open its roads and gates ahead of your forces."

###### Ventrue arc (0090-0114) & Shadow War ######

###### Ventrue progress notification ######

 POD_gratiano_ventrue_progress_toast: "One fewer Ventrue prince stands between Verona and the seat. [GetPlayer.MakeScope.ScriptValue('POD_gratiano_ventrue_blockers_value')|0] remain."

###### Shadow War casus belli ######

 POD_GRATIANO_SHADOW_WAR_WAR_NAME: "Shadow War against [DEFENDER.GetShortUINameNotMe]"
 POD_GRATIANO_SHADOW_WAR_CB_NAME: "Shadow War against [DEFENDER.GetShortUINameNotMe]"
 msg_POD_gratiano_shadow_war_invalidated: "The [war.GetName] has ended: [defender.GetShortUIName] no longer stands as an independent Ventrue prince."
 POD_gratiano_shadow_war_victory_desc_defender: "[attacker.GetShortUIName|U] has won the Shadow War. You remain a ruler, but from tonight you rule as a vassal and answer to the victor."
 POD_gratiano_shadow_war_victory_desc: "[defender.GetShortUIName|U] yields the Shadow War and swears to [attacker.GetShortUIName] as a vassal. The oath is the prize; the loser's titles stay where they are."
 POD_gratiano_shadow_war_white_peace_desc: "[defender.GetShortUIName|U] keeps [defender.GetHerHis] independence. The Shadow War ends in a truce, and no oath is sworn by either side."
 POD_gratiano_shadow_war_defeat_desc: "[defender.GetShortUIName|U] has beaten the Shadow War back and keeps [defender.GetHerHis] independence. A truce holds both courts, and no one kneels."
 POD_gratiano_shadow_war_cooldown_block: "Verona has waged no Shadow War these past five years. The clan of kings must be given time to lower its guard between campaigns."
 POD_gratiano_shadow_war_friuli_door_cost: "Khadijah's Open Roads"

###### The Shadow War - opener (0090) & the recurring hub (0091) ######

 POD_gratiano.0090.t: "The Ventrue in Italy"
 POD_gratiano.0090.desc: "Last night you made up your mind about the Ventrue. Princes of that clan rule in Italy in their own right, and you have put up with it for as long as you intend to. A conspiracy against the founder cannot leave a clan of kings at its back, each free to choose a side on the night it counts.\n\nFabrizio holds one court and Titus another. In their domains, and in any other where a Ventrue rules without a liege, your envoys must present themselves and ask leave to pass. You were a lord of this country while you still breathed, and asking leave in it has never suited you.\n\nSo you give your household the word. The Shadow War is yours to wage from tonight. You mean to carry it to one Ventrue court after another and take each prince's oath in turn."
 POD_gratiano.0090.desc_fallen: "The tally your agents bring you is out of date before the ink dries. The Ventrue order everyone describes, with Fabrizio and Titus each presiding over a court of his own, is not the one in front of you; that arrangement has already broken, and you have had to strike through part of the page.\n\nWhat is left is harder to list and no less a problem. Wherever a Ventrue still rules in Italy without a liege, that prince is free to choose a side on the night it counts, and you cannot have that at your back."
 POD_gratiano.0090.a: "Let them learn to kneel."
 POD_gratiano.0090.board_tt: "The Shadow War can force a qualifying independent Ventrue prince to become your vassal.\nIndependent Ventrue rulers in the Italian sphere: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_ventrue_blockers_value')|0]"

 POD_gratiano.0091.t: "The Ventrue Campaign"
 POD_gratiano.0091.desc: "The Ventrue matter is back on your table. Your people report on the courts they watch, one at a time: Milan, Bologna, Rome, Ravenna, Aquileia. They bring letters copied on the road and the talk of merchants who trade in more than one of those cities.\n\n\"And there is always war,\" the last of them says, and lays the copied letters in front of you."
 POD_gratiano.0091.a: "Look to the Shadow War."
 POD_gratiano.0091.b: "Find out what Livia buried."
 POD_gratiano.0091.c: "Look into Camilla's past."
 POD_gratiano.0091.d: "It can wait."
 POD_gratiano.0091.board_tt: "The Shadow War remains available. Choosing this does not declare war.\nIndependent Ventrue rulers in the Italian sphere: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_ventrue_blockers_value')|0]"
 POD_gratiano.0091.e: "Hear what Demetrius wants in Milan."
 POD_gratiano.0091.g: "Consider calling in Berhthold's debt."
 POD_gratiano.0091.f: "Look to Fabrizio's quarrel with Camilla."

###### Shadow War skirmishes (0092 strike, 0093 retaliation) ######

 POD_gratiano.0092.t: "An Opening at Court"
 POD_gratiano.0092.desc: "A Ventrue prince who still rules in Italy on no one's sufferance has grown careless. One of your people has been inside the prince's scriptorium long enough to learn which charters would not survive a second reading, and believes that with some quiet work the title itself could be called into question in your favor.\n\nIf the prince's clerks catch yours with ink on their hands, the whole court will hear whose servants they are, and a Ventrue does not let that pass."
 POD_gratiano.0092.a: "Do it, and quietly."
 POD_gratiano.0092.claim_toast: "A Claim on the Prince's Title"
 POD_gratiano.0092.exposed_toast: "Exposed Before the Prince's Court"
 POD_gratiano.0092.b: "Mention the prince's carelessness in public."
 POD_gratiano.0092.c: "Leave the prince's papers alone."

 POD_gratiano.0093.t: "The Prince Answers"
 POD_gratiano.0093.desc: "The Ventrue prince has had a grievance drawn up against you, and a herald is carrying it through Italy. It gives the nights your servants spent in the prince's scriptorium and the charters they handled, and it names the lord who sent them. It was read first at the prince's own court, to a full hall.\n\nTonight the herald comes to you with a second, shorter letter. The readings will go on at every court that opens its doors, for as long as the prince pleases, and your name will suffer at each one. Otherwise the prince will accept amends in silver, a large sum, and call the herald home."
 POD_gratiano.0093.a: "Pay, and have done with it."
 POD_gratiano.0093.b: "Not one coin."
 POD_gratiano.0093.b.tt: "Refusing to pay further reduces your Standing at court."
 POD_gratiano.0094.t: "A Door into Friuli"
 POD_gratiano.0094.desc: "Khadijah Saadeh has sat among your guests often enough that her arrival draws no notice. Tonight she comes alone, and she is as cheerful as ever while your servants are dismissed.\n\nShe holds the county of Friuli from Titus, she reminds you, as if you might have forgotten whose vassal she is. Should you ever move against the Ventrue prince, her county would not resist you. Her people would open the roads.\n\nShe offers no reason. You leave a silence for one, and she fills it with talk of the weather in the passes. She has asked for nothing, and you have promised nothing."
 POD_gratiano.0094.a: "Accept, and keep the offer in reserve."
 POD_gratiano.0094.door_tt: "Your next Shadow War on Titus costs no prestige.\nIt ignores the five-year wait between Shadow Wars and starts no new one.\nDeclaring it grants an advantage bonus in battle for five years."
 POD_gratiano.0094.b: "Decline. She will not offer twice."

###### Shadow War aftermath (0095) ######

 POD_gratiano.0095.t: "A Prince Kneels"
 POD_gratiano.0095.desc: "The Shadow War is over, and [defender.GetTitledFirstNameNoTooltip] comes to swear. The oath is given correctly and without warmth, before enough witnesses that it cannot later be remembered differently.\n\nYour conspirators take note. A clan that prizes rule above everything now has a prince who rules by your leave, and those still weighing whether to stand with you weigh it again."
 POD_gratiano.0095.desc_ephor: "[defender.GetTitledFirstNameNoTooltip] comes to swear, and the hall is fuller than a vassal's oath usually warrants. An Ephor stands among the highest of the Ventrue, one whose judgment other princes of that blood are expected to heed. Tonight the Ephor says the words in full, to you, where everyone can hear.\n\nThe news will outrun any herald you could send, and your conspirators carry themselves differently for it."
 POD_gratiano.0095.a: "Your oath is accepted. Who is next?"
 POD_gratiano.0095.remaining_tt: "Independent Ventrue rulers still holding land in the Italian sphere: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_ventrue_blockers_value')|0]\nThe regional objective stays open while any remain."

###### Ventrue leverage - Livia the Advocate (0096) ######

 POD_gratiano.0096.t: "Livia's Inheritance"
 POD_gratiano.0096.desc: "Livia managed an estate and carried embassies before she ruled anything, and she still governs like a steward: everything recorded, everything in its place. The one matter she keeps no record of is how Aristophokles ended. He was badly wounded. Then he was gone, and she had his strength and his place.\n\nCainites use the word diablerie about her only in rooms she will never enter. Enough coin would turn the rumor into proof, which she could not ignore. Held privately, it might bring her to swear to you. Told in every court, it would cost her dearly and leave her free to hate you at her leisure. She is not known to frighten easily, and she has had a long time to decide what she would say."
 POD_gratiano.0096.a: "Pay for the truth about Aristophokles."
 POD_gratiano.0096.reveal_tt: "You alone learn Livia's diablerie secrets. They are not exposed to anyone else."
 POD_gratiano.0096.b: "Swear to me, Livia, or be named."
 POD_gratiano.0096.bent_toast: "Livia Swears to You"
 POD_gratiano.0096.defied_toast: "Livia Spurns You and Becomes Your Rival"
 POD_gratiano.0096.c: "Let every court hear what she did."
 POD_gratiano.0096.d: "Leave Livia be."

###### Ventrue leverage - Camilla the Pontifex (0097) ######

 POD_gratiano.0097.t: "Camilla's Old Sin"
 POD_gratiano.0097.desc: "Camilla receives the world from a couch with a cup in his hand, and has done so for longer than most bloodlines have existed. Guests leave his table convinced he is too comfortable to be dangerous. That belief has served him for centuries.\n\nSomewhere in those centuries, it is said, he drank a Cainite's soul. Proof would be worth having. What it is worth against him is another question: one who walks the Road of Sin does not blush, and a ruler this old does not kneel because a younger prince holds a letter. His peers may prove less indulgent than he is, if they are told."
 POD_gratiano.0097.a: "Pay to learn whom he drank."
 POD_gratiano.0097.reveal_tt: "You alone learn Camilla's diablerie secrets. They are not exposed to anyone else."
 POD_gratiano.0097.b: "Put the proof before him and demand his oath."
 POD_gratiano.0097.bent_toast: "Camilla Swears to You"
 POD_gratiano.0097.defied_toast: "Camilla Refuses and Becomes Your Rival"
 POD_gratiano.0097.c: "Tell the courts what Camilla did."
 POD_gratiano.0097.d: "Hold the threat in reserve."
 POD_gratiano.0097.threat_tt: "Camilla is difficult to coerce.\nThis choice neither secures his submission nor starts a fight."
 POD_gratiano.0097.e: "Another night, perhaps."
 POD_gratiano.0097.f: "Call in Camilla's debt and demand fealty."

###### Ventrue milestones & blowback (0099/0103/0104) ######

 POD_gratiano.0103.t: "The Last Independent Throne"
 POD_gratiano.0103.desc_bent: "The last name is struck from the list tonight, and there is no death written beside any of them. Every Ventrue prince who ruled in his own right when you began still walks. Each has since knelt to a liege, or has no Italian ground left to rule from.\n\nIt makes a dull page for so much work. Its use will show later: when the conspiracy moves against the founder, no Ventrue prince in the north of Italy will be free to look at the two sides and choose one."
 POD_gratiano.0103.desc_mixed: "From the Alps to Rome, no Ventrue prince rules without a liege any longer. Not every prince who held a throne there when you began lived to see it.\n\nOther Cainites will not ask whose doing each Final Death was. They will credit you or blame you for every one of those princes alike."
 POD_gratiano.0103.desc_dead: "There is nobody left to strike from the list. Every Ventrue prince who ruled in his own right when you began has met Final Death. Whether your hand was in each of those deaths is a question nobody has yet put to you.\n\nThe conspiracy never required this. It needed them off their thrones, and a prince sworn to a liege would have served as well as ash. That reasoning will carry no weight with their clan. The Ventrue keep their own count of the dead, and they will draw their own conclusions from it."
 POD_gratiano.0103.a: "Italy is quieter for it."
 POD_gratiano.0103.checklist_tt: "The Ventrue territorial requirement is satisfied.\nIt reopens if independent Ventrue rule returns before the plan is sealed."

 POD_gratiano.0104.t: "Ventrue Rule Returns"
 POD_gratiano.0104.desc_named: "[POD_gratiano_ventrue_blocker.GetTitledFirstNameNoTooltip] holds a county in Italy and answers to no one. Your conspirators must take up the Ventrue campaign again."
 POD_gratiano.0104.desc: "A merchant's letter mentions it in passing, between the price of alum and a complaint about tolls: a Ventrue is keeping court in Italy again and paying homage to nobody. Your own people confirm it within the fortnight.\n\nYou had reckoned Italy secure. The Ventrue seem to regard every throne they lose as merely mislaid."
 POD_gratiano.0104.a: "Then the work resumes."
 POD_gratiano.0104.reopen_tt: "The Ventrue territorial requirement is no longer satisfied."
 POD_gratiano.0105.t: "Between Bologna and Rome"
 POD_gratiano.0105.desc: "The quarrel between Bologna and Rome is older than you are, and it is warming again. Fabrizio Ulfila, who rules from Bologna and thinks like a bishop, has never let go of his claim on Rome. Camilla, who has Rome and Latium and every intention of keeping them, would be glad to see Bologna in better hands, meaning his own.\n\nBoth have let it be known, through intermediaries, that quiet help from Verona would be welcome. The winner would owe you for it. The loser would no longer be a prince worth counting.\n\nYou have encouraged neither. Your people add one caution: help given to Fabrizio would be noticed at the founder's court."
 POD_gratiano.0105.a: "Back Fabrizio's claim on Rome."
 POD_gratiano.0105.fabrizio_tt: "Standing at court: -5\nFabrizio moves within four months, and may fail.\nIf he wins, he takes Rome and swears fealty to you.\nIf he fails, Camilla becomes your rival."
 POD_gratiano.0105.b: "Help Camilla take Bologna."
 POD_gratiano.0105.camilla_tt: "Camilla moves within four months, and may fail.\nIf he wins, he takes Bologna.\nHe then swears fealty only if you already know his secret; otherwise he owes you a Major Boon.\nIf he fails, Fabrizio becomes your rival."
 POD_gratiano.0105.sent_toast: "A Side Is Chosen"
 POD_gratiano.0105.c: "Let them quarrel unaided for now."
 POD_gratiano.0106.t: "Fabrizio's Bid for Rome"
 POD_gratiano.0106.desc_success: "Fabrizio Ulfila has Rome. He took it, and with it everything in Latium that Camilla still called his own, and he has already had a Mass of thanksgiving sung by mortals who have no idea what they were thanking God for.\n\nCamilla survives. He learned well before the end which court stood behind his rival, and those who saw him last say he spoke your name pleasantly, like a man making a note.\n\nFabrizio has written in his own hand. He remembers who made this possible, and he is ready to swear to it."
 POD_gratiano.0106.desc_failure: "Rome held. Fabrizio's bid spent itself against a prince who had held the city a very long time, and the churchman still has Bologna and nothing more. Camilla has lost nothing and gained one thing: the name of the court that stood behind the attempt.\n\nHe has made no protest. Your people in Rome report only that he laughed when he was told, and asked to hear it again."
 POD_gratiano.0106.desc_fizzled: "Fabrizio never makes his bid for Rome. Before the night came, things changed for one of the two rivals, and the plan no longer had any point. The standing you lost at the founder's court by backing him is gone all the same."
 POD_gratiano.0106.a: "Rome is his, and he is mine."
 POD_gratiano.0106.b: "So Camilla knows whose hand it was."
 POD_gratiano.0106.c: "Then the matter is closed."
 POD_gratiano.0107.t: "Camilla's Move on Bologna"
 POD_gratiano.0107.desc_success: "Bologna is Camilla's. Fabrizio Ulfila survives the loss, a churchman with no seat to preach from, and the claim he pressed on Rome for so long now has nothing behind it.\n\nCamilla writes to you himself, at length and in high good humor. Between the pleasantries he states plainly that he knows whose help carried the matter and that he stands in Verona's debt. He has never, he adds, been called a poor debtor. The form his acknowledgment takes follows under his seal."
 POD_gratiano.0107.desc_failure: "Camilla's move on Bologna has come to nothing. Fabrizio Ulfila keeps his seat, Camilla keeps Rome, and all that has changed hands is a piece of knowledge: Fabrizio has learned who backed his rival.\n\nHe does not write. You hear instead that he preached to his court on the subject of false brothers, and that he named you in it."
 POD_gratiano.0107.desc_fizzled: "Bologna is never tested. Before Camilla could move, the quarrel lost one of its princes: one of the two no longer rules in his own right, and there is no rivalry left to back. You paid nothing toward the attempt, and nothing is owed to you from it."
 POD_gratiano.0107.a: "Bologna is his. Collect what he owes."
 POD_gratiano.0107.b: "Fabrizio knows. Let him preach."
 POD_gratiano.0107.c: "Nothing spent, nothing owed."
 POD_gratiano.0108.t: "The Spartan's Offer"
 POD_gratiano.0108.desc: "Lysander's messenger is a soldier, and gives the offer standing, from memory.\n\n\"The Duke of Apulia has watched what you have done to his clan's princes in the north. He calls it sound work. He holds Apulia and will go on holding it. Leave it to him, and he stands with you. He asks for an answer and no ceremony.\"\n\nYour people set two objections beside it. The founder's court would take any pact with a Ventrue badly. And Apulia was Lasombra ground before the Spartan had it: Claudius Eugenio, Montano's childe, held it, and Montano's lands lie beside it now. That court would be glad to see it taken back.\n\nThe messenger waits. You have agreed to nothing."
 POD_gratiano.0108.a: "Accept the Spartan's pact."
 POD_gratiano.0108.pact_tt: "Standing at court: -10\nWhile Lysander lives and rules independently, the assault on the founder's castle is easier.\nLysander will not be the one to avenge the Ventrue of the north."
 POD_gratiano.0108.b: "Refuse him. Apulia will be Lasombra again."
 POD_gratiano.0108.apulia_tt: "Once Lysander is dead or holds nothing in the south, the founder's court will credit you."
 POD_gratiano.0108.c: "Commit to nothing."
 POD_gratiano.0110.t: "The South Without Lysander"
 POD_gratiano.0110.desc: "Lysander's rule in the south is over. You undertook to see it ended, and the founder's court, which seldom asks how a thing came about, is content to set it to your name. A Ventrue is gone from ground the clan counts as its own. Tonight you are spoken of there as one who served."
 POD_gratiano.0110.a: "Let the court think well of me."
 POD_gratiano.0110.a.tt: "Standing at court: +10\nConspiracy: -5"
 POD_gratiano.0110.b: "Give Apulia back to Claudius Eugenio."
 POD_gratiano.0110.b.tt: "Standing at court: +15\nConspiracy: -5"

 POD_gratiano.0099.t: "The Ventrue Count Their Dead"
 POD_gratiano.0099.desc: "The letter is read aloud in your hall. In it [POD_gratiano_ventrue_avenger.GetTitledFirstNameNoTooltip] names the Ventrue princes of the north who have met Final Death since you began to concern yourself with their thrones. The letter does not ask which of them fell by your hand, or whether any did. In [POD_gratiano_ventrue_avenger.GetHerHis] reckoning they all lie at your door, and the clan's dead are owed an answer.\n\nThere are no terms and no demand for redress. The bearer declines your hospitality and goes. A ruler who writes wants his enemies known, and is almost certainly planning to send you after the dead."
 POD_gratiano.0099.a: "Let them send whom they like."
 POD_gratiano.0100.t: "Milan for Sale"
 POD_gratiano.0100.desc: "The envoy from Piacenza never says the word treason. Demetrius, you are told, ruled a city of his own for centuries before Berhthold Ackarman drew breath. Now he keeps Piacenza at the pleasure of that same Berhthold, Duke of Lombardy and Prince of Milan, a common soldier who came to the seat because fire took everyone better placed.\n\nMilan could change hands. Such things want gold, and the gold would have to come from elsewhere. A prince raised with another's coin, the envoy adds, would remember who raised him.\n\nNothing is asked outright, and you offer nothing. The envoy has not requested your silence, though the same tale would be worth something in Milan."
 POD_gratiano.0100.a: "Demetrius shall have his gold."
 POD_gratiano.0100.coup_tt: "Demetrius moves within three months, and may fail.\nIf he succeeds, he takes Lombardy and swears fealty to you.\nIf the attempt can no longer be made by then, your gold is returned."
 POD_gratiano.0100.paid_toast: "The Gold Reaches Demetrius"
 POD_gratiano.0100.b: "Warn Berhthold what his vassal intends."
 POD_gratiano.0100.c: "Give the envoy no answer yet."
 POD_gratiano.0101.t: "Word from Milan"
 POD_gratiano.0101.desc_success: "It is done, your rider says, and with less burning than Milan is used to. Berhthold Ackarman still walks, but the city is no longer his, and neither is Lombardy. The Cainites who answered to him now answer to Demetrius, and several were seen to change their allegiance quickly.\n\nThe new prince does not keep you waiting. The envoy from Piacenza is at your gate again, this time to arrange the hour of an oath."
 POD_gratiano.0101.desc_failure: "Berhthold Ackarman still rules Milan. Demetrius made his attempt and it came apart; how exactly depends on who is telling it, and the tellers agree on one point only. The soldier-prince knows whose gold armed his vassal. He has sent you no word, and has no need to. Demetrius sits in Piacenza yet, Berhthold's man in name, and what passes between those two is their own affair.\n\nYour gold is spent. Worse, the story has traveled ahead of any account you might have given, and at the founder's court they are calling it clumsy."
 POD_gratiano.0101.desc_fizzled: "The night Demetrius was paid for never comes. Milan is not as it stood when you struck the bargain, and the plan you bought no longer fits the city. The gold finds its way back to you, every coin of it, with no letter to explain what the news already has."
 POD_gratiano.0101.a: "Receive the new Prince of Milan."
 POD_gratiano.0101.b: "Bear the loss, and the talk."
 POD_gratiano.0101.b.tt: "Standing at court: -5"
 POD_gratiano.0101.c: "Take back the gold."
 POD_gratiano.0102.t: "What Berhthold Owes"
 POD_gratiano.0102.desc: "The letter to Milan is written and lacks only your seal. It reminds Berhthold Ackarman, in terms any Cainite would recognize, of the debt he owes you, and it names the payment: his oath of fealty, with his lands kept under your hand.\n\nBy every account Berhthold is a just man, the kind who pays what he owes. He is also stubborn past good sense, and a proud prince may prefer the shame of a broken debt to a bended knee. Once the letter leaves, the debt is spent, whatever he answers."
 POD_gratiano.0102.a: "Call in the debt for his fealty."
 POD_gratiano.0102.bent_toast: "Berhthold Honors His Debt"
 POD_gratiano.0102.defied_toast: "Berhthold Refuses; the Debt Is Spent"
 POD_gratiano.0102.b: "Hold the debt a while longer."

###### MONCADA & LUCITA ARC (0115-0128) ######

###### Rival modifiers ######

 POD_gratiano_cardinal_vigilance_modifier: "Cardinal's Vigilance"
 POD_gratiano_cardinal_vigilance_modifier_desc: "The Archbishop expects enemies and is warned of most of them, so hostile schemes against him fare poorly. Much of that warning depends on his sire. Should Silvester turn on him, it ends."
 POD_gratiano_iberian_reprisals_modifier: "Iberian Reprisals"
 POD_gratiano_iberian_reprisals_modifier_desc: "The de Ruiz line has not forgiven Moncada's death. Its people work against you quietly, and hostile schemes find you easier to reach."
 POD_gratiano_nahir_hunted_modifier: "Hunted by Nahir"
 POD_gratiano_nahir_hunted_modifier_desc: "Nahir's grudge leaves this character more exposed to hostile schemes and quicker to gather stress. It lasts until the quarrel between them is settled."

###### Moncada & Lucita opener + the caged fizzle (0115, 0116) ######

 POD_gratiano.0115.t: "The Archbishop's Keeping"
 POD_gratiano.0115.desc: "Ambrosio Luis Moncada says Mass for the living and the dead alike. No one in Iberia moves against him without a friend of his hearing of it, and a stranger asking questions in his diocese is noted before the second question.\n\nHis childe, Lucita de Aragon, is said to chafe under him. Said by whom, and how freely she could act on it, you do not yet know."
 POD_gratiano.0115.desc.patronage: "\n\nThen there is Silvester de Ruiz, who made Moncada and has watched the Archbishop's name outgrow his own. Among Iberia's Lasombra it is the childe whose favor is sought now. A sire may tolerate that for a long time, or may be waiting for someone to ask."
 POD_gratiano.0115.desc.vassal_sire: "\n\nThen there is Silvester de Ruiz, who made Moncada and now holds his lands at Moncada's pleasure. He bends the knee to his own childe when the court requires it, and the court requires it often. Silvester was a spy before he was an elder. Whether he resents Moncada enough to help you would be worth learning."
 POD_gratiano.0115.a: "Look into the Archbishop's affairs."
 POD_gratiano.0115.b: "Silvester may wish to talk."
 POD_gratiano.0115.c: "See whether Lucita can answer me."

 POD_gratiano.0116.t: "Her Sire's Hand"
 POD_gratiano.0116.a: "Moncada still holds her leash."
 POD_gratiano.0116.desc: "Lucita de Aragon receives you in a chapter house, with two of Moncada's clerics seated by the door and a third trimming candles, a task he never finishes. She is courteous. She asks after your journey. When you speak of Iberia's future she says the Archbishop has it in his prayers, and her eyes go once to the men by the door.\n\nOn your way out you are handed a note in a clerk's hand, thanking you on His Excellency's behalf for the visit."
 POD_gratiano_caged_rule_tt: "#X While Moncada's protection stands, Lucita cannot be touched.#!\nThe [GetModifier('caged_lucita_modifier').GetNameWithTooltip] surrounding the Prodigal Daughter turns attempts aside. Kill Moncada, or coerce him into withdrawing his protection, before Lucita can be easily reached."

###### The hook-building mini-chain on Moncada (0117, 0118) ######

 POD_gratiano.0117.t: "What the Archbishop Hides"
 POD_gratiano.0117.desc: "An archbishop leaves paper behind him: grants, dispensations, the accounts of houses that take in more silver than their lands could yield. A Cainite archbishop leaves other things, and Moncada has had a long time to bury his.\n\nYour people could go where they are not invited, buying a sacristan here and opening a strongbox there. Or you could go where you are welcome, a guest among Iberia's Lasombra, and let old resentments do the talking. His friends listen for both. If they hear you, the court will learn whose errand it was, and Moncada will answer it."
 POD_gratiano.0117.a: "Buy his servants and open his locks."
# Shared standing-risk warning for probes and coercion.
 POD_gratiano_probe_standing_risk_tt: "#Y Risk: a botched attempt is heard at the high table and costs standing.#!"
 POD_gratiano.0117.a.success: "Your agents find proof that can be used against Moncada."
 POD_gratiano.0117.a.failure: "Your agents are caught; your Standing at court suffers and Moncada strikes back."
 POD_gratiano.0117.b: "Draw his rivals into conversation."
 POD_gratiano.0117.b.success: "Careful conversation yields proof that can be used against Moncada."
 POD_gratiano.0117.b.failure: "Your questions are reported; your Standing at court suffers and Moncada strikes back."
 POD_gratiano.0117.toast.probing: "Proof Within Reach"
 POD_gratiano.0117.toast.botched: "Your Probe Is Exposed"
 POD_gratiano.0117.c: "Leave him be for now."

 POD_gratiano.0118.t: "A Hold on Moncada"
 POD_gratiano.0118.desc: "What your inquiry brings back fits in one satchel: copied letters, a deposition from a frightened deacon, the names of people who will repeat what they said if they are paid again.\n\nBehind all of it runs a single rumor, that the Archbishop once drank a Cainite's soul along with the blood. If that is true and can be shown, no pulpit will shelter him and he will do as he is told. If it is only a rumor, what remains is embarrassment: enough to make him listen, and to cost something of whoever presses it."
 POD_gratiano.0118.a: "Keep it until it is needed."
 POD_gratiano.0118.b: "Put it before him at once."

###### Route (a): coerced withdrawal + the Lucita duels (0119-0122, 0126) ######

 POD_gratiano.0119.t: "Terms for an Archbishop"
 POD_gratiano.0119.desc: "Moncada receives you in his study and waits, hands folded on the desk, for you to say why you asked to see him alone.\n\nWhat you would demand is simple: he lets Lucita go, wholly, with no confessor left at her elbow. A proven sin would leave him nothing to bargain with. A thin one he will pay for and then make expensive, telling the court in his own words what sort of Cainite threatens a churchman over gossip.\n\n\"Suppose I opened my hand,\" he says, before you have named her. \"Lucita has never thanked anyone for anything. She would not begin with you.\""
 POD_gratiano.0119.a: "Release Lucita, or this becomes known."
 POD_gratiano_weak_hook_coercion_tt: "#R [GetPlayer.MakeScope.ScriptValue('POD_gratiano_weak_hook_coercion_trust_value')|0] Standing at court#!\nThe hook is a weak one, and forcing it is ugly work. The court will hear how ugly it got, and your standing pays the price."
 POD_gratiano.0119.b: "Hold the matter back a while."
 POD_gratiano.0119.toast: "Moncada Yields; Lucita Walks Free"
 POD_gratiano_cage_broken_tt: "#Y The Cardinal's protection is withdrawn.#!\nMoncada's last letter on the matter is a single line in his own hand: 'You believe you have freed her. May God forgive you for what you have loosed.' The [GetModifier('caged_lucita_modifier').GetNameWithTooltip] is removed, and the Prodigal Daughter stands beyond her sire's protection, free to answer the vampire who used her name as leverage."

 POD_gratiano.0120.t: "Lucita's Challenge"
 POD_gratiano.0120.desc: "Lucita comes to you without escort, which is the first thing you notice, and armed, which is the second.\n\n\"He told me what you held over him and what you bought with it,\" she says. \"I was the price. I will not pass from his keeping into yours as a clause in a settlement.\" She draws off one glove and drops it between you. \"Meet me alone. Whatever I am afterward, no one will have arranged it.\"\n\nShe has not kept her errand quiet. If you decline tonight, that is the story that travels, and she makes it plain she will ask again."
 POD_gratiano.0120.a: "Very well. Name the place."
 POD_gratiano.0120.b: "Not tonight, whatever the court says."

 POD_gratiano.0121.t: "Lucita's Ground"
 POD_gratiano.0121.desc: "The place Lucita names is a threshing floor, swept clean, with a single lantern hung from a post. She is there before you, testing the footing.\n\nShe has left Moncada's people behind. His concession brought her this far, and she seems to consider that the end of his part in it. She asks only whether you want words said over you, should it come to that, and by which rite.\n\nShe means for one of you to meet Final Death on this floor, and she would like the arrangements settled before the lantern needs oil."
 POD_gratiano.0121.a: "Enough talk. Begin."
 POD_gratiano.0121.success: "Lucita Falls to You"
 POD_gratiano.0121.failure: "Lucita Destroys You"
 POD_gratiano.0121.success.desc: "Lucita fights the way she spoke, without waste, and for a while it is enough. Then it is not. She goes down on the swept floor, and what you have left of her cannot rise from it. By the time the lantern gutters there is ash, and the few things she carried."
 POD_gratiano.0121.failure.desc: "You pried her loose from an archbishop and took that for the hard part. Lucita finds the opening you did not know you had left, and after that there is very little you are able to do about anything.\n\nShe asks you again about the rite, and you cannot answer. Your Final Death comes on a swept threshing floor, at the hands of the woman you freed."

 POD_gratiano.0122.t: "Lucita Unleashed"
 POD_gratiano.0122.desc: "With Moncada destroyed there is no one left to tell Lucita de Aragon when to stop, and it shows in how she comes to the meeting: early, alone, having sent no terms.\n\nSince her Embrace she has been measured against her sire's patience. What stands in front of you has no such measure. She paces the ground once, looks you over as she might a wall she means to go through, and says she will not be inherited along with his diocese.\n\nShe intends to leave your ashes here. You will have to leave hers."
 POD_gratiano.0122.a: "Come, then, and be done."
 POD_gratiano.0122.success: "Lucita de Aragon Is Slain"
 POD_gratiano.0122.success.desc: "With no sire to check her, Lucita held nothing back, and it was still less than you brought. She is ash on the ground now, gone into Final Death after the Archbishop who made her.\n\nSire and childe both. Iberia's Lasombra are short two voices that were never going to speak for you."
 POD_gratiano.0122.failure: "You Die by Lucita's Hand"
 POD_gratiano.0122.failure.desc: "Moncada kept her leashed for a reason, and you learn it too late. Lucita breaks your guard, then the rest of you. She offers no chance to yield. Your Final Death is the first thing she has done entirely for herself, and she does it thoroughly."

 POD_gratiano.0126.t: "Lucita Unbound"
 POD_gratiano.0126.desc: "Moncada is ash, and the news reaches Lucita de Aragon before it reaches most of Iberia. Whatever he used to keep her at his side died with him.\n\nShe sends a rider with a short message, unsealed, so that anyone who handled it could read it: she will meet you alone, on a night of your choosing, and one of you will not leave. If the night does not suit, she writes, she can wait. She has learned how."
 POD_gratiano.0126.desc.first: "You have had no dealings with Lucita de Aragon. She was Moncada's childe, kept so close to the Archbishop that there was no speaking to one without the other hearing.\n\nNow he is destroyed, and she comes looking for you on her own account. She is a king's daughter who was Embraced into a churchman's household and held there, and by every report she hated it. That has not made her your friend. You are the elder who moved against her sire, and in her reckoning you may be the next hand that tries to hold her.\n\nHer message is brief. She will fight you, alone, to the Final Death. She leaves the choice of night to you."
 POD_gratiano.0126.desc.reoffer: "Lucita de Aragon has not forgotten that you put her off. The challenge comes again, carried by a rider who has been told to wait for your answer.\n\nMoncada is dead now, and she gives him a single clause, as a debt that has been collected. Nothing else in the letter is his. The terms are her own and they have not changed: alone, to the Final Death of one of you. She adds only that she has counted the nights since you declined, and that the count is known in more courts than yours."
 POD_gratiano.0126.a: "I will meet her."
 POD_gratiano.0126.b: "Another night. She will keep."

###### Route (b): the Silvester angle + the Cardinal's counterstroke (0123-0125) ######

 POD_gratiano.0123.t: "A Sire's Grievance"
 POD_gratiano.0123.desc.intro: "Silvester de Ruiz agrees to see you, which is already more than his childe would wish. He was gathering other people's secrets long before he made Moncada, and he listens to your courtesies like a man waiting for the real letter underneath.\n\nYou have come about the Archbishop. Silvester surely knows it."
 POD_gratiano.0123.desc.diarchy: "\n\nMoncada governs as diarch now, and the business of rule crosses his desk in a name that is not his own. Petitioners have learned which Lasombra can actually grant what they ask. Silvester made that Cainite and taught him how a court is read, and his thanks is to be consulted afterward, when he is consulted at all.\n\nHe mentions none of this. He straightens a paper on his table that did not need it, and asks what you imagine he could want."
 POD_gratiano.0123.desc.shame: "\n\nThere is no office to point to, only the arithmetic of reputation: Iberia speaks of the Archbishop first and of the Cainite who made him second, if it remembers to. Silvester has heard it said in his own hall. He lets you sit, and waits to hear how you will put it."
 POD_gratiano.0123.desc.vassal: "\n\nHe holds what he holds by his childe's grant. When Moncada's messengers come, Silvester stands to receive them; when the Archbishop holds court, the sire who Embraced him takes a place among the vassals and waits to be called. Every Lasombra in Iberia has seen it, and they have drawn their conclusions about which of the two is the greater.\n\nSilvester lets you look around his hall, which is smaller than it should be, and says nothing to help you begin."
 POD_gratiano.0123.a: "Speak of what Moncada owes him."
 POD_gratiano.0123.a.success: "Silvester listens, and may later turn against Moncada."
 POD_gratiano.0123.a.failure: "Silvester warns Moncada's allies; your Standing at court suffers and a counterstroke follows."
 POD_gratiano.0123.b: "Say nothing and take my leave."
 POD_gratiano.0123.toast.listening: "Silvester Hears You Out"
 POD_gratiano.0123.toast.warned: "Betrayed to Moncada's Allies"

 POD_gratiano.0124.t: "Silvester Turns"
 POD_gratiano.0124.desc: "Silvester's answer comes by a route you did not know he had: a pilgrim's token left with your steward, and inside it a strip of vellum bearing a few words. He is with you.\n\nThe effect is felt before he does anything at all. So much of Moncada's watchfulness ran through his sire, the informants and the quiet warnings, and those now answer to a Cainite who wishes him destroyed. The Archbishop can be reached like anyone else.\n\nSilvester means to do the reaching himself, when a chance opens. He does not say when, and a spy of his years will not hurry it."
 POD_gratiano.0124.desc.vassal: "Silvester de Ruiz still attends his childe's court. He still stands among the vassals and still answers when the Archbishop calls on him, and tonight he does all of it as your ally.\n\nHis word reaches you in a pilgrim's token left with your steward. The message is short. Moncada's guard depended on the sire who served him: on Silvester's informants, on warnings carried up from below. Those warnings will stop arriving, and the Archbishop is now as open to a patient enemy as any other elder.\n\nSilvester intends to be that enemy in person. He has bowed a long time to what he made, and he will choose his moment with the same care. It may not come soon."
 POD_gratiano.0124.a: "Welcome, Silvester. Moncada stands exposed."
 POD_gratiano_vigilance_broken_tt: "#Y The Cardinal's vigilance is broken.#!\nSilvester's turning strips the [GetModifier('POD_gratiano_cardinal_vigilance_modifier').GetNameWithTooltip] from Moncada, and the sire moves against the childe. Murder and diablerie schemes against the Cardinal now run at their ordinary odds."

 POD_gratiano.0125.t: "The Archbishop Answers"
 POD_gratiano.0125.desc: "Moncada's reply arrives as a season of small withdrawals.\n\nCainites who had been listening to you find reasons to be elsewhere. One returns a gift. Another writes that, on reflection, old loyalties weigh more than new promises. A third simply stops answering, and you learn that the Archbishop's confessor has called at that court twice. Nothing in it could be named an attack, and all of it is addressed to you.\n\nHe has found the edges of what you are building and pressed on each one. Your conspiracy is smaller tonight than it was, and he has left you to spend your nights counting what else he knows."
 POD_gratiano.0125.a: "Bear it, and remember each one."

###### Completion + de Ruiz blowback (0127, 0128) ######

 POD_gratiano_duel_unsettled_toast: "The matter is unsettled"
 POD_gratiano_duel_unsettled_tt: "Neither of you finishes it. You break apart with nothing decided between you, and the question remains."
 POD_gratiano_moncada_done_toast: "The Cardinal and the Prodigal Daughter are ash."

 POD_gratiano.0127.t: "The de Ruiz Reckoning"
 POD_gratiano.0127.desc: "Moncada was of Silvester de Ruiz's line, and that line has an elder still walking and a death to answer. The answering falls to Fulgencio d'Idalia, who goes about it without banners.\n\nYour couriers are robbed on roads that were safe. A ghoul of your household is found to have been taking Iberian silver. Fulgencio has let it be known, to anyone with a grudge against you, that help is to be had.\n\nIt will be years before that offer lapses."
 POD_gratiano.0127.a: "Let them come. I will be watching."


###### NAHIR ARC (0135-0149) ######

###### Nahir activation + first audience (0135, 0136) ######

 POD_gratiano.0135.t: "The Matter of Nahir"
 POD_gratiano.0135.desc: "Every reckoning of who will stand with you comes up short by the same name. Nahir, childe of Sybil, has no intention of watching you rise, and enough of the clan listens to him that his refusal carries well beyond his own haven.\n\nSomewhere beneath it lies the wager between you, on whether a noble or a humble mortal better repays the $pod_Embrace$. He argues everything else the way he argues that: at leisure, in company, and with every appearance of enjoying himself.\n\nLetters will not move him, and an intermediary would only give him someone to be witty at. If anything is to be settled, you will have to stand in front of him and hear what he wants, or see for yourself how closely he is kept."
 POD_gratiano.0135.a: "Request an audience with Nahir."

 POD_gratiano.0136.t: "Before Nahir"
 POD_gratiano.0136.desc: "Nahir receives you without rising. He lets you cross the whole length of the room before he speaks, and when he does it is to an attendant, about the lamps.\n\n\"So,\" he says at last. \"You want something from me, or you want me gone. I have had both kinds of guest.\" He spreads his hands. \"If it is peace, I take it in installments, and I keep an honest ledger: what has been paid stays paid. If it is the other thing, you would not be the first to leave here smiling and come back with a knife.\""
 POD_gratiano.0136.a: "Let us speak of amends."
 POD_gratiano.0136.b: "He will have to be removed."
 POD_gratiano.0136.c: "Take my leave, promising nothing."

###### Nahir amends (0137-0140) ######

 POD_gratiano.0137.t: "A Bow Before Witnesses"
 POD_gratiano.0137.desc: "Nahir names his first condition pleasantly. You will give him precedence, aloud and by name, before enough Cainites that the words cannot later be mislaid.\n\n\"It costs you nothing you can hold,\" he says. \"That is why I want it first.\"\n\nYou will lose prestige by it. The Cainites who hear you give way will repeat it at every court they visit, and all Nahir offers in return is to name a second condition."
 POD_gratiano.0137.a: "Give him his bow."
 POD_gratiano.0137.b: "I will not bow tonight."
 POD_gratiano.0137.toast: "First Amends Made: Public Deference"

 POD_gratiano.0138.t: "A Gift for Nahir"
 POD_gratiano.0138.desc: "\"You bowed well,\" Nahir says. \"A little stiff in the neck, but I am told that passes with practice.\"\n\nThe second condition is simpler to state. He wants a gift, and he is specific about its size: large enough that your stewards will wince and his own household will hear of it. He makes no pretense of needing it. What he wants is the sight of your coffers opening at his word.\n\n\"After that,\" he adds, \"there is one more matter, and then we may speak as friends. I would not have you think payment alone was enough.\""
 POD_gratiano.0138.a: "Send him the gift."
 POD_gratiano.0138.b: "My coffers stay shut for now."
 POD_gratiano.0138.toast: "Second Amends Made: Nahir's Gift"

 POD_gratiano.0139.t: "Nahir's Enemies"
 POD_gratiano.0139.desc: "The last condition is work. Nahir has enemies of his own, and he would like to see them inconvenienced by a hand that cannot be traced to his.\n\n\"I am told you have a talent for arranging other people's misfortunes,\" he says. \"Use it for me, once, and we are done.\"\n\nHe gives you names and little else. How it is managed is your affair, and it will go as well as your cunning allows. He is equally frank about his patience. A first stumble he will overlook, and let you try again once things have quieted. After a second, you may come back another night and ask him properly."
 POD_gratiano.0139.a: "Turn my hand against his enemies."
 POD_gratiano.0139.success: "The service succeeds, completing your third amends to Nahir."
 POD_gratiano.0139.failure: "The service against Nahir's enemies fails."
 POD_gratiano.0139.toast.done: "Third Amends Made to Nahir"
 POD_gratiano.0139.toast.failed: "The Service Miscarries; You Will Try Again"
 POD_gratiano.0139.toast.cooled: "Nahir's Patience Spent; Seek Another Audience"
 POD_gratiano.0139.b: "This service must wait."

 POD_gratiano.0140.t: "Peace with Nahir"
 POD_gratiano.0140.desc: "Nahir comes down from his seat to meet you, which he has not done before.\n\n\"Three debts, three payments,\" he says. \"I had prepared to be disappointed in you. I dislike wasted preparation, but I will bear it.\" He offers his hand, and whatever he held against you is set down with it. Should you ever need a witness before a convocation, he says, you may send for him.\n\nThen, lightly: \"My sire would find you interesting. She finds very few things interesting.\""
 POD_gratiano.0140.a: "Take his hand as a friend."
 POD_gratiano_nahir_done_toast: "The elder of Algiers is dealt with."
 POD_gratiano_sybil_lead_tt: "#Y Nahir now counts you a friend.#!\nAn elder calls you friend and will remember the choice as surely as an oath. His regard may open a road to Sybil."

###### The kill route + grudge/failure states (0141-0146) ######

 POD_gratiano.0141.t: "The Removal of Nahir"
 POD_gratiano.0141.desc: "Your courtesies to Nahir remain intact, and your mind is made up. He will not be argued out of your way.\n\nDestroying a Cainite of his standing is largely a matter of deciding whose hand is seen. He made his childer to prove a point, and childer so made do not always love their sire; where such resentment still walks the night, it can be put to use. Otherwise the work is your own, to be done soon or to be done with care, and your name will be on it either way. There is also the old remedy of calling him out and letting one of you end."
 POD_gratiano.0141.a: "Let Zamra Matoub strike for me."
 POD_gratiano.0141.b: "Let Abdullah of Wargla be my hand."
 POD_gratiano.0141.c: "See to it myself, and soon."
 POD_gratiano.0141.d: "Do it myself, and take my time."
 POD_gratiano.0141.e: "Face him myself, to the death."
 POD_gratiano.0141.f: "Let him be, for now."
 POD_gratiano.0141.toast: "The Plot Against Nahir Begins"
 POD_gratiano_nahir_duel_warning_tt: "#R A duel against an elder and a master of Obfuscate.#!\nNahir cannot be surprised and can barely be caught. The odds are long, and defeat is fatal. Only a reckless Cainite would choose this road."

 POD_gratiano.0142.t: "The Night Appointed"
 POD_gratiano.0142.desc: "The preparations are finished. The hand you chose is in place, the hour is fixed, and nothing more can be improved by waiting.\n\nIf it goes wrong in the open, Nahir will learn exactly who wished him destroyed, and see that every court within reach of his voice learns it too."
 POD_gratiano.0142.a: "Give the word."
 POD_gratiano.0142.success: "Nahir is destroyed, ending his threat to you."
 POD_gratiano.0142.fizzle: "The attempt fails, and nothing ties it to you."
 POD_gratiano.0142.exposed: "The plot is exposed: your Standing at court suffers and Nahir takes up a grudge."
 POD_gratiano.0142.toast.dead: "Nahir Is Destroyed"
 POD_gratiano.0142.toast.fizzle: "The Attempt Miscarries Unseen"
 POD_gratiano.0142.toast.exposed: "Nahir Uncovers Your Plot"

 POD_gratiano.0143.t: "Nahir's Enmity"
 POD_gratiano.0143.desc: "Nahir makes no accusation. He sends you, by an ordinary courier, a full and accurate account of the attempt on his existence, with your part in it underlined.\n\nBeneath it he has written that he has always paid his debts in kind, and that you host evenings he has been meaning to attend. He has friends enough to make good on it, and from tonight anyone who wishes you harm will find them glad to help."
 POD_gratiano.0143.a: "So he means to hunt me."

 POD_gratiano.0144.t: "Nahir's Uninvited Guests"
 POD_gratiano.0144.desc: "Nahir's people come to your house on an evening when invited Cainites are gathered under your roof. They give his name at the door and push past whoever answers it. Inside they overturn what they can reach and drive your guests out into the street.\n\nNahir claims the raid before anyone can ask. He tells it at court himself, naming the guests who ran, and the court laughs. To you he writes his thanks for the evening and a hope to be remembered when you next entertain. Several who had promised themselves to your cause now send their excuses on the nights you host."
 POD_gratiano.0144.a: "Bear it and rebuild."
 POD_gratiano.0144.b: "Demand satisfaction in blood."
 POD_gratiano.0144.c: "Sue for peace, whatever it costs."

 POD_gratiano.0145.t: "To the Final Death"
 POD_gratiano.0145.desc: "Nahir accepts the challenge as he might accept an invitation to supper, and arrives on time.\n\nNo one has been asked to intervene, and no terms have been set for yielding. He removes his cloak, folds it, and hands it to someone behind him without looking. \"I did wonder which of us would lose patience first,\" he says.\n\nHe means for only one of you to see another night, and seems content to find out which."
 POD_gratiano.0145.a: "I am done waiting, Nahir."
 POD_gratiano.0145.success: "Nahir Falls to You"
 POD_gratiano.0145.success.desc: "It ends when Nahir is half a step slow, once. You do not give him the chance to be slow again.\n\nWhat is left of Sybil's childe goes to ash on the ground between you, while the cloak he folded so carefully still hangs over someone else's arm. Nobody present speaks. His voice will not be raised against you again at any court, and those who watched will carry the reason home with them."
 POD_gratiano.0145.failure: "Nahir Destroys You"
 POD_gratiano.0145.failure.desc: "You misjudge him once, by half a step.\n\nNahir neither gloats nor hesitates. For a moment you understand precisely what has happened, and that no art you command will undo it. Then everything you intended is ash on the ground at his feet, and he is collecting his cloak on the way out."

 POD_gratiano.0146.t: "A Dearer Peace"
 POD_gratiano.0146.desc: "Nahir hears your overture and answers in his own hand. He is willing to consider peace. Consideration will require a sum well beyond anything he would once have asked, and an apology made in public, in words he will supply.\n\nHe does not promise that either will be enough. \"You tried to have me destroyed,\" the letter ends. \"Bring what I ask, and I will see how I feel.\""
 POD_gratiano.0146.a: "Pay it, and kneel if I must."
 POD_gratiano.0146.b: "These terms are an insult."
 POD_gratiano.0146.success: "Nahir accepts your amends: friendship replaces the grudge and the matter is settled."
 POD_gratiano.0146.failure: "Nahir takes your payment and your humiliation, then refuses peace; the feud continues."
 POD_gratiano.0146.toast.failed: "Nahir Spurns Your Overture"


###### AMICI NOCTIS CAPSTONE (0055-0056) ######

 POD_gratiano.0055.t: "A Friend of the Night"
 POD_gratiano.0055.desc.intro: "The letter comes by a courier who will not sit and will not drink. It is short. The Amici Noctis have considered your name and found no voice left to speak against it: the Giovanni, the Ventrue, Moncada, Nahir, each matter closed in its turn. You are a Friend of the Night, as of the date under the seal."
 POD_gratiano.0055.desc.standard: "Archbishop Moncada lives, and will hear of this soon enough. Whatever he chooses to say about you afterward, he will be saying it about one of the Friends, in front of the others. He is a man who counts such things before he speaks."
 POD_gratiano.0055.desc.moncada_dead: "Moncada's name sits in that list like the others, with no title and no word on how the Archbishop came to his end. The Friends have evidently decided that they need not ask. The courier is still waiting for your answer."
 POD_gratiano.0055.a: "I accept. Now, where do matters stand?"
 POD_gratiano.0055.b: "They were wise not to ask."
 POD_gratiano_amici_member_tt: "#Y You are elevated to the Amici Noctis.#!\nThe councils of the Friends of the Night, along with their scrutiny, are open to you now. You enter the society's inner life; in time its members will find you at their gatherings."

###### Assamite pact journey (0150-0159) ######

###### Pact journey sidebar ######

 POD_gratiano_pact_journey_name: "The Mountain of Blades"
 POD_gratiano_pact_journey_desc: "Travel to the Assamite ruler who will hear you, to bargain for the blades of the Children of Haqim against your sire, or to settle and deepen terms already begun."
 POD_gratiano_pact_journey_effects: "#bold Seal a compact with the Assamites.#!\nPay in [gold|E] for #P +1 Assamite support#! per journey up to #P 3#! or promise the #R heart's blood#! to buy their #P full support (3)#! at once.\n#P Assamite support: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_assamite_support_value')|0]/3#!. \nEvery point adds support for the final assault."
 POD_gratiano_pact_journey_tt: "Ride to Alamut and treat with the Assamites for their blades."

# Journey GUI suffixes: _monthly_num, _monthly_tt, and their _current variants.
 POD_gratiano_pact_journey_monthly_num: "#TOOLTIP:POD_gratiano_pact_journey_monthly_tt #V;L [GetPlayer.MakeScope.ScriptValue('POD_gratiano_pact_journey_progress')|1]%#!#!"
 POD_gratiano_pact_journey_monthly_tt: "$POD_journey_time_until_completion$ #V [JourneyYearsLeft('POD_gratiano_pact_journey_progress')|0] $POD_journey_years$, [JourneyMonthsLeft('POD_gratiano_pact_journey_progress')|0] $POD_journey_months$#!\n\n[GetPlayer.MakeScope.GetScriptValueDesc('POD_gratiano_pact_journey_progress')]"
 POD_gratiano_pact_journey_monthly_num_current: "#TOOLTIP:POD_gratiano_pact_journey_monthly_tt_current #V;L [GetPlayer.MakeScope.ScriptValue('POD_gratiano_pact_journey_progress')|1]%#!#!"
 POD_gratiano_pact_journey_monthly_tt_current: "$POD_journey_time_remaining$ #V [JourneyYearsLeftCurrent('POD_gratiano_pact_journey_progress')|0] $POD_journey_years$, [JourneyMonthsLeftCurrent('POD_gratiano_pact_journey_progress')|0] $POD_journey_months$#!\n\n[GetPlayer.MakeScope.GetScriptValueDesc('POD_gratiano_pact_journey_progress')]"

 POD_gratiano_pact_journey_planning_title: "The Road to Alamut"
 POD_gratiano_pact_journey_planning_desc: "Choose the escort, the gifts and the road. The Children of Haqim give audiences to guests who arrive expected and prepared, and nothing is agreed until you stand before their ruler."
 POD_gratiano_pact_journey_planning_confirm: "Set out for the Mountain."
 POD_gratiano_pact_journey_planning_decline: "Not yet. The Mountain will keep."

 POD_gratiano_pact_journey_travel_title: "The Road to Alamut"
 POD_gratiano_pact_journey_travel_desc: "You are on the road to your audience with the Assamites. The terms you mean to offer are rehearsed each night between resting places; the gold and the promises are still yours to give or keep."
 POD_gratiano_pact_journey_travel_confirm: "Set out for the Mountain."

 POD_gratiano_pact_journey_not_on_tt: "You are not already bound for the Mountain."
 POD_gratiano_pact_journey_partner_tt: "A living Assamite power must hold court to receive the embassy."


###### 0150 - the audience at Alamut ######

 POD_gratiano.0150.t: "The Price of Blades"
 POD_gratiano.0150.desc: "You are made to wait until the lamps have been trimmed twice. When [pact_partner.GetFirstNameNoTooltip] finally receives you there are no courtesies to sit through, and the reason for your visit has plainly arrived ahead of you.\n\n\"Blades against an Antediluvian, inside his own castle. That can be bought. Pay in gold, come back when it has been counted, and we will seal what it pays for. Or pledge what gold cannot buy: the heart's blood of your sire, delivered to us when he falls. For that, every knife I can send is yours from tonight.\"\n\nThe guards along the wall are watching your hands."
 POD_gratiano.0150.desc.nakurtum: "Alamut does not hurry for a Lasombra. You climb to it under escort, give up your sword at the second gate, and are led past warriors who stop talking as you approach and resume in a language chosen so that you will not follow it.\n\nNakurtum receives you seated: a childe of Haqim, and by the look of her hall not unchallenged in it. Some of those along the walls answer to her. Others, you suspect, merely attend. She lets you finish explaining what you want before she speaks.\n\n\"You want my clan's blades in your sire's castle. I can sell you that. Pay the price in gold, return when my treasurers are satisfied, and we will seal it properly. Or promise me the heart's blood of Lasombra when he lies open before you, and I will not ask for a coin. All that I command would stand with you from this night.\"\n\nNobody in the hall moves to fill the pause."
 POD_gratiano.0150.a: "You shall have your @gold_icon!. I will return."
 POD_gratiano.0150.a.tt: "You pay [gold_i][GetPlayer.MakeScope.ScriptValue('POD_gratiano_pact_price_value')|0] now.\nThe pact is not yet sealed: you must make another journey to seal it."
 POD_gratiano.0150.b: "My sire's heart's blood is yours."
 POD_gratiano.0150.b.tt: "The pact is sealed at once, with full Assamite support (3 of 3).\nYou owe the Assamites Lasombra's heart's blood.\nConsuming or sharing the founder's blood will break the oath."
 POD_gratiano.0150.c: "I will find my blades elsewhere."

 POD_gratiano_pact_gold_paid_msg: "The gold is paid to the Assamites. The compact awaits its sealing at the Mountain."
 POD_gratiano_pact_gold_paid_msg_tt: "The price is handed over. Ride to Alamut once more to seal the pact and gain Assamite support for the strike."

###### 0151 - the oath of the heart's blood ######

 POD_gratiano.0151.t: "The Heart's Blood Owed"
 POD_gratiano.0151.desc: "By the next night the bargain is already being treated as old business. [pact_partner.GetFirstNameNoTooltip] sends no document for you to sign. The Children of Haqim keep such accounts in their own way, and a messenger simply repeats the terms to you as they were spoken, word for word, and waits until you nod.\n\nWhen Lasombra falls, the blood of his heart goes to Assamite hands untouched, by you or by anyone who fights beside you. The messenger does not say what follows if it does not.\n\nFrom tonight the blades are yours, and the richest part of your victory already belongs to someone else."
 POD_gratiano.0151.a: "The heart's blood is theirs, then."
 POD_gratiano.0151.a.tt: "You owe the Assamites Lasombra's heart's blood.\nConsuming or sharing the founder's blood will break the oath."

###### 0152 - the sealing rite (gold path) ######

 POD_gratiano.0152.t: "The Counted Gold"
 POD_gratiano.0152.desc: "The gold you left here has been counted in your absence, and it shows in the welcome: a shorter wait, a seat offered. [pact_partner.GetFirstNameNoTooltip] has the terms ready.\n\n\"You paid for blades and you will have them. A first company, sworn to your assault on the castle, and nothing asked of you beyond what already lies in my coffers. Should you want more of us later, you know what we cost. Say the word, and it binds us both.\""
 POD_gratiano.0152.a: "You have my word. Seal it."

###### 0153 - deepening the compact ######

 POD_gratiano.0153.t: "Deepening the Compact"
 POD_gratiano.0153.desc: "[pact_partner.GetFirstNameNoTooltip] receives you as a client now, which among the Children of Haqim means promptly and without warmth. The compact stands. It can also grow.\n\n\"The castle of an Antediluvian eats the careless,\" you are told. \"What you have hired will open a door. More gold sends more of us through it, up to the limit of what I will risk on your war.\""
 POD_gratiano.0153.a: "My gold for more of your blades."
 POD_gratiano.0153.a.tt: "You pay [GetPlayer.MakeScope.ScriptValue('POD_gratiano_pact_deepen_price_value')|0] gold.\nAssamite support increases by 1, to a maximum of 3."
 POD_gratiano.0153.b: "What I have hired will suffice."

 POD_gratiano_support_deepened_toast: "The compact deepens. Another blade of Alamut is pledged to the strike."
 POD_gratiano_support_deepened_toast_tt: "Assamite support toward the assault on the castle rises by one."

###### 0154 - the partner has fallen ######

 POD_gratiano.0154.t: "No One to Receive You"
 POD_gratiano.0154.desc: "The road ends at a closed door. The ruler you came to treat with can no longer receive you, and those who meet you in the outer court are not inclined to say how that came about. They tell you only that there will be no audience, that no one here speaks for the bargain you had in mind, and that your escort may water its horses before it leaves."
 POD_gratiano.0154.a: "Water the horses. We turn back."
 POD_gratiano.0154.a.tt: "The journey ends.\nThe pact is neither sealed nor strengthened."

###### Pact seal & sealed messages (POD_gratiano_seal_pact_effect) ######

 POD_gratiano_seal_pact_tt: "#P The Assamite pact is sealed.#!\n#P +1 Assamite support#! toward the strike. The finest killers of the blood are sworn to your cause."
 POD_gratiano_pact_sealed_msg: "The Assamite pact is sealed. Their blades are yours on the night of the strike."
 POD_gratiano_pact_sealed_msg_tt: "The compact with the Assamites is sworn. Their support strengthens the coming assault, and can be deepened on further journeys to the Mountain."

###### Frame the elders (0180-0184) ######
# Witnesses bear altered memories; elders are the accused.

###### 0180 - the plot unlocks ######

 POD_gratiano.0180.t: "The Founder's Faithful"
 POD_gratiano.0180.desc: "Montano, Alfonzo, Guilelmo and Boukephos speak for your sire, and the clan takes their word as his. While their names are clean, the clan will follow them in his defense. Now that you have the Assamites behind you, you can begin to change that.\n\nA false memory of wrongdoing can be planted so deeply that the one who carries it will swear to it in good faith. Evidence hidden in advance will then be found and will confirm the story. An elder condemned in this way will no longer be trusted by the clan, which weakens your sire's defense long before your conspiracy is ready to strike. You have only to order the work begun."
 POD_gratiano.0180.a: "Let the clan remember them wrongly."
 POD_gratiano.0180.a.tt: "You can now frame the founder's elders: Montano, Alfonzo, Guilelmo and Boukephos."

###### 0181 - the pawn-tier choice (per completed phase) ######

 POD_gratiano.0181.t: "The Lie Needs Feeding"
 POD_gratiano.0181.desc: "The work against [frame_scheme.GetTargetCharacter.GetFirstNameNoTooltip] has stalled. The false recollection holds, but a story about an elder must be carried into the right hall by someone whose word will be weighed there. Whoever carries it will be marked by it, and those who serve [frame_scheme.GetTargetCharacter.GetFirstNameNoTooltip] have long memories.\n\nYour people wait on your instruction. The scheme will keep as it stands if you let it. It goes no further until a name is spent on it."
 POD_gratiano.0181.a: "Spend one of the recruits."
 POD_gratiano.0181.a.tt: "A random recruit is spent and lost to you.\nAdds [GetPlayer.MakeScope.ScriptValue('POD_gratiano_frame_pawn_progress_value')|0] progress to the scheme.\n75% chance the recruit dies; 25% chance the recruit escapes and may become your rival."
 POD_gratiano.0181.a.spent_toast: "A Recruit Does Not Return"
 POD_gratiano.0181.a.spent_toast_tt: "[spent_pawn.GetFirstNameNoTooltip] vanished in the scheme's service, and [spent_pawn.GetSheHe] is dead."
 POD_gratiano.0181.a.escape_toast: "A Spent Recruit Escapes"
 POD_gratiano.0181.a.escape_toast_tt: "[spent_pawn.GetFirstNameNoTooltip] survived the errand you spent [spent_pawn.GetHerHim] on and has fled your court.\n[spent_pawn.GetSheHe|U] may now count you a rival."
 POD_gratiano.0181.b: "One of my coterie will see to it."
 POD_gratiano.0181.b.tt: "A living coterie member leaves your coterie and your court to serve the scheme.\nThe scheme gains [GetPlayer.MakeScope.ScriptValue('POD_gratiano_frame_coterie_progress_value')|0] progress and outside help."
 POD_gratiano.0181.b.toast: "A Companion Leaves the Coterie"
 POD_gratiano.0181.b.toast_tt: "[spent_friend.GetFirstNameNoTooltip] gave the scheme progress and help from outside your court.\n[spent_friend.GetSheHe|U] lives, but has left your coterie and your court."
 POD_gratiano.0181.c: "My own name will carry it."
 POD_gratiano.0181.c.tt: "You lose 5 Standing at court.\nAdds [GetPlayer.MakeScope.ScriptValue('POD_gratiano_frame_self_progress_value')|0] progress to the scheme."
 POD_gratiano.0181.d: "Nothing more. Let it stand."

###### 0182 - framing success ######

 POD_gratiano.0182.t: "An Elder Disgraced"
 POD_gratiano.0182.desc: "The memory was believed, the evidence was found where it was meant to be found, and [frame_target.GetTitledFirstNameNoTooltip] could not answer both. [frame_target.GetHerHis|U] denials are heard politely and repeated with a smile. It will be twenty years before the clan looks at [frame_target.GetHerHim] without recalling it."
 POD_gratiano.0182.a: "Let my sire lean on that one now."
 POD_gratiano.0182.a.montano_tt: "Montano's disgrace will, in time, open an opportunity concerning Siracusa."

###### 0183 - framing failure / discovery ######

 POD_gratiano.0183.t: "The Forgery Unravels"
 POD_gratiano.0183.desc: "The false recollection has not taken. [frame_target.GetTitledFirstNameNoTooltip] is angry. Whether anyone could prove whose work it was hardly matters. The work against [frame_target.GetTitledFirstNameNoTooltip] is finished. At court, those who used to greet you find other places to stand."
 POD_gratiano.0183.a: "I have survived worse embarrassments."
 POD_gratiano.0183.a.tt: "You lose 10 Standing at court.\nThe scheme ends."

###### 0184 - auto-credit (elder fell without our forgeries) ######

 POD_gratiano.0184.toast: "The Elder Fell Without Your Forgeries"
 POD_gratiano.0184.toast_tt: "The elder you were framing has fallen by other means, the forgeries unfinished.\nYour conspiracy takes stock of the founder's remaining elders."

###### Framing messages ######

 POD_gratiano_elders_framed_msg: "The old blood of the See is broken. Enough of its elders are silenced that no voice will rise against the strike."
 POD_gratiano_elders_framed_msg_tt: "The elders' opposition to the assault is neutralized. This milestone of the strike gate is met."
 POD_gratiano_montano_framed_msg: "Montano wears forged crimes, and the Sea of Shadows turns against its Emperor. The road to Siracusa opens."
 POD_gratiano_montano_framed_msg_tt: "The Emperor of the Sea of Shadows is disgraced by the framing chain. His seat at Siracusa, the door to the castle, can now be taken by judgment, claim, or war."

###### Seat of Sicily (0200-0203) ######

###### 0200 - the See recoils ######

 POD_gratiano.0200.t: "The Stain on Siracusa"
 POD_gratiano.0200.desc: "The charge against Montano has held. Not long ago it was a rumor carried between havens; tonight elders who used to quote his campaigns are asking one another who vouched for him, and nobody volunteers.\n\nYou know exactly what the evidence is worth. So does he, and it has not helped him.\n\nHe still sits in Siracusa. A disgraced lord in possession of a county is a question the clan will want answered sooner or later, and so far no one has put a name forward. A clean sheet of parchment lies on your table with the pen beside it."
 POD_gratiano.0200.a: "Siracusa deserves a worthier lord."
 POD_gratiano.0200.a.tt: "You gain a pressed claim on Siracusa.\nYour petition for the county will be heard later."
 POD_gratiano.0200.b: "Let him keep his county."

 POD_gratiano.0204.t: "A County Already Lost"
 POD_gratiano.0204.desc: "The charge against Montano has held, and it comes late to be of full use. Siracusa left his hands before his good name did. Another lord keeps the county now, and no judgment against Montano can order a stranger to pay his debts.\n\nStill, disgrace travels. The elders who must explain why they trusted him would welcome a brother in blood ready to say that the county was badly kept from the start, and that a better right to it always existed. A right is only words. Whoever sits in Siracusa tonight would have to be made to listen to them."
 POD_gratiano.0204.a: "The claim stands, whoever holds it."
 POD_gratiano.0204.a.tt: "You gain a pressed claim on Siracusa.\nMontano no longer holds the county; the claim must be pursued against its current holder."
 POD_gratiano.0204.b: "Leave Siracusa to its new lord."
 POD_gratiano_montano_seatless_msg: "Montano is disgraced, though Siracusa had already slipped his grasp. The claim stands against whoever holds it now."
 POD_gratiano_montano_seatless_msg_tt: "The forged crimes ruin Montano's standing and leave you a claim on Siracusa. With the Emperor seatless, the Friends have no judgment to pass; the county must be taken by war."


###### 0201 - the petition ######

POD_gratiano.0201.t: "The Siracusa Petition"
POD_gratiano.0201.desc: "The petition took longer than the disgrace did. Every clause has passed through hands that know how the clan's elders read: which precedent flatters them, which word recalls an embarrassment they would sooner see settled quietly. It lies finished on your table, sealed at the foot, lacking only the manner of its delivery.\n\nThat is the part that wants care. Among the Lasombra a petition is weighed by who carries it. Spoken by one of their own before the Amici Noctis, these words become a matter for judgment, and the Friends of the Night can require a clansman to give up what he holds. Sent by anyone else they are a claim in good handwriting, and a claim is answered by whoever keeps the walls.\n\nThen there is Siracusa itself. Montano can only be made to surrender what is still his. The latest word from the island reached you an hour ago, and it names the lord who holds the county now."

POD_gratiano.0201.desc_dead: "The petition is finished, and the man it was written against is dead. Montano's name still stands in the first line, where the scribe set it down when there was someone to answer the charge.\n\nThe disgrace has outlived him. It is in the record, the elders remember it, and a claim built on it does not lapse with its subject. But the dead surrender nothing. Siracusa belongs tonight to whoever holds its walls, and that lord was never accused of anything.\n\nYou read the parchment through once more. The argument is sound. It will have to be put to someone else."

POD_gratiano.0201.a: "Bring it before the Amici Noctis."
POD_gratiano.0201.a.tt: "Requires membership in the Amici Noctis, and Montano alive and holding Siracusa.\nThe Amici Noctis order Montano to surrender Siracusa to you."

POD_gratiano.0201.b: "Press the claim against Montano directly."
POD_gratiano.0201.b.tt: "Your claim on Siracusa is pursued against Montano.\nThe Amici Noctis do not transfer the county to you."

POD_gratiano.0201.c: "Take the claim to its present holder."
POD_gratiano.0201.c.tt: "Montano cannot surrender a county he no longer holds.\nYour claim on Siracusa is pursued against its current holder."

###### 0202 - Montano's cold fury ######

 POD_gratiano.0202.t: "Montano's Answer"
 POD_gratiano.0202.desc: "Montano's reply comes in his own hand, four lines with no greeting. He wastes none of them on the judgment. He names what you took, and adds that he has held ground against worse than a brother with a petition.\n\nSiracusa is yours. He will not forget how."
 POD_gratiano.0202.a: "Let him rage. Siracusa is mine."
 POD_gratiano.0202.a.tt: "Montano resents the loss of Siracusa and may become your rival."

###### 0203 - seat-taken acknowledgment (any route) ######

 POD_gratiano.0203.toast: "Siracusa Is Yours"
 POD_gratiano.0203.toast_tt: "You now hold Siracusa.\nYour other territorial designs remain in motion."

###### Framing modifiers ######

 POD_gratiano_framed_elder_modifier: "Framed by False Testimony"
 POD_gratiano_framed_elder_modifier_desc: "False memories and planted evidence have discredited this elder. Vassals and dynasty alike no longer trust the elder's word, and hostile schemes find an easier way in. The stain lasts twenty years."
 POD_gratiano_montano_disgraced_modifier: "Disgraced by the Whisper"
 POD_gratiano_montano_disgraced_modifier_desc: "The charge held, and all Sicily has heard it. Montano's word buys less than it did, his deeds win him little credit, and both his vassals and his own house have begun to weigh what they owe him."

###### Sicily messages ######

 POD_gratiano_montano_disgraced_msg: "Montano is disgraced and a claim on Siracusa is pressed. The Friends of the Night will lean on the Emperor to yield."
 POD_gratiano_montano_disgraced_msg_tt: "The forged crimes ruin Montano's standing and grant you a claim on his capital county. Await the Friends' judgment, or press the claim in war."
 POD_gratiano_siracusa_yielded_msg: "Siracusa is yours. The Amici Noctis have judged against the Emperor, and the door to the castle stands open."
 POD_gratiano_siracusa_yielded_msg_tt: "The Friends of the Night strip Montano's capital county and grant it to you. This fulfills the plan's requirement to hold Siracusa."

###### Strike decision ######

 POD_gratiano_strike_the_castle: "Strike the Castle of Shadows"
 POD_gratiano_strike_the_castle_desc: "Everything the conspiracy has gathered, its allies, its secrets and the hard lessons of the Abyss, points at one place: Castel del Ombro at Siracusa, where the founder sleeps. Give the word and the plotting ends. The journey to Sicily comes first. The castle's guardians wait at the end of it, each one standing between you and your sire, and they do not take prisoners. Once you set out, you finish this or it finishes you."

 POD_gratiano_gate_giovanni_tt: "#bold The Giovanni are broken.#!\nNo independent Giovanni prince holds a county in Italy, Venice or Romagna, and the Giovanni crown itself sits vacant."
 POD_gratiano_gate_moncada_tt: "#bold The Cardinal is answered for.#!\nAmbrosio Moncada and his caged childe Lucita are both destroyed."
 POD_gratiano_gate_nahir_tt: "#bold Nahir is settled.#!\nNahir is dead, or bound to you as a friend."
 POD_gratiano_gate_ventrue_tt: "#bold The Ventrue interest is cleared.#!\nNo independent Ventrue prince holds a county in Italy, Venice or Romagna."
 POD_gratiano_gate_pact_tt: "#bold The Assamite compact is sealed.#!\nAlamut has sworn its blades to the night you move on the castle, whether you paid in [gold|E] or in heart's blood."
 POD_gratiano_gate_founder_tt: "#bold The founder still sleeps.#!\nLasombra has not already been destroyed by another hand. There would be nothing left in the castle to strike."
 POD_gratiano_gate_elders_tt: "#bold The elders of the See are silenced.#!\nEnough of the old-blood elders (Montano, Alfonzo, Guilelmo, and Boukephos) have been framed, killed, or driven into torpor that no voice will prevent the strike. #P [GetPlayer.MakeScope.ScriptValue('POD_gratiano_framed_count_value')|0] of 4#! neutralized."
 POD_gratiano_gate_conspiracy_tt: "#bold The conspiracy is ready.#!\nThe conspiracy is strong enough to move against the castle itself. #P The Conspiracy: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_conspiracy_value')|0] / 80#!."
 POD_gratiano_strike_launch_tt: "#X The strike begins.#!\nYou move against the castle and the founder beneath it. This commits you to the assault and brings the long conspiracy to its final night. #bold The order cannot be recalled.#!"
 POD_energy_restoration_disabled_castle_strike: "You can't restore your energy this way while the strike on the Castle of Shadows is underway"

###### Framing scheme display ######
 POD_gratiano_frame_scheme:0 "Frame an Elder"
 POD_gratiano_frame_scheme_action:0 "Planting False Memories"
 POD_gratiano_frame_scheme_desc_general:0 "Working in secret, you plant false memories and the evidence to match them, so that an elder who upholds Lasombra is disgraced before the clan."
 POD_gratiano_frame_scheme_success_desc:0 "[TARGET_CHARACTER.GetShortUIName|U] is disgraced before the clan. The founder's circle of supporters is weakened and your conspiracy advances."
 POD_gratiano_frame_scheme_discovery_desc:0 "Your attempt to fabricate the disgrace of [TARGET_CHARACTER.GetShortUIName] is exposed, and your Standing at court suffers."
 POD_gratiano_frame_elder_interaction:0 "Frame an Elder"
 POD_gratiano_frame_elder_interaction_desc:0 "Begin a secret scheme against [recipient.GetShortUIName]. False memories and matching evidence will be prepared to disgrace [recipient.GetHerHim] before the clan. This only sets the work in motion: the disgrace comes if the scheme succeeds, and nothing here takes the elder's life."

###### Assault (0220-0227) ######

 POD_gratiano.0220.t: "The Castle of Shadows"
 POD_gratiano.0220.departure.desc:0 "The word goes out tonight: you are leaving for Siracusa. Nothing will be asked of you on the road. The Castle of Shadows keeps its questions for those who arrive."
 POD_gratiano.0220.departure.a:0 "To Siracusa, then."
 POD_gratiano.0220.departure.launch:0 "The Journey to Siracusa Begins"
 POD_gratiano.0220.departure.tt:0 "You travel to Siracusa before the assault begins.\nAvailable members of your coterie can travel with you."
 POD_gratiano.0220.desc: "Siracusa lies behind you. The road has brought you within sight of Castel del Ombro, and the first thing you notice is that nobody has challenged you. No watch fires burn on the walls. The outer gate stands open, as it would for a guest.\n\nYour sire has never needed sentries. He keeps a handful of guardians, each holding one threshold between this gate and the place where he lies, and each to be passed in turn.\n\nYou take stock a last time. There will be no hunting inside those walls and no hour of rest between one door and the next. Whatever strength comes in with you tonight is all there is to spend until this is finished."
 POD_gratiano.0220.a: "Enough waiting. Through the gate."
 POD_gratiano.0220.launch: "The Assault on the Castle Begins"
 POD_gratiano.0220.launch.tt: "The castle's defenders and the final maze must now be faced in turn.\nBlood does not recover until the strike is over."

 POD_gratiano.0221.t: "Boukephos Bars the Way"
 POD_gratiano.0221.desc: "Boukephos is waiting in the gatehouse passage with a lamp and no weapon. The lamp is a courtesy to you; nothing that lives in this castle needs one.\n\n\"The founder's guests are examined before they are admitted,\" Boukephos says. \"I ask. One of you answers. Scripture, the stars, whatever I choose. Answer well and I will step out of this passage, and you may go on to the others.\"\n\nBoukephos sets the lamp down on the flagstones, between you.\n\n\"Answer badly and there will be no others. Who answers?\""
 POD_gratiano.0221.a: "[learning_duelist.GetFirstNameNoTooltip] will answer for us."
 POD_gratiano.0221.b: "Ask your questions. I will answer."
 POD_gratiano.0221.aside.tt: "Boukephos lets your party pass and is not killed."
 POD_gratiano.0221.effect.success.desc: "Boukephos stands aside, unharmed, and the way is open."
 POD_gratiano.0221.champion.failure.effect.desc: "[learning_duelist.GetFirstNameNoTooltip] loses the contest with Boukephos and dies. You survive and gain stress."
 POD_gratiano.0221.critical.failure.effect.desc: "You lose the contest with Boukephos and die."
 POD_gratiano.0221.success: "Boukephos Stands Aside"
 POD_gratiano.0221.champion.failure: "Boukephos Claims Your Champion"
 POD_gratiano.0221.critical.failure: "You Fall to Boukephos"

 POD_gratiano.0222.t: "The Inner Ward"
 POD_gratiano.0222.desc: "The inner ward is a square of open paving with a well at its center and dark arcades on all four sides. It looks empty. You have taken two steps into it when a voice speaks from no arcade in particular.\n\n\"Boukephos asks questions. I was never so patient.\" A pause, and the voice has moved. \"I am Khanom Mehr. Somewhere in this ward is the door you want, and somewhere in it is me. I have kept this ward a long time, young one, and nobody has yet found me first.\"\n\nNothing stirs under the arcades."
 POD_gratiano.0222.a: "[intrigue_duelist.GetFirstNameNoTooltip], find our host."
 POD_gratiano.0222.b: "I will play this game myself."
 POD_gratiano.0222.effect.success.desc: "Khanom Mehr is killed and the inner ward is yours to cross."
 POD_gratiano.0222.champion.failure.effect.desc: "[intrigue_duelist.GetFirstNameNoTooltip] is outwitted by Khanom Mehr and killed. You survive and gain stress."
 POD_gratiano.0222.critical.failure.effect.desc: "Khanom Mehr outwits you, and you die in the inner ward."
 POD_gratiano.0222.success: "Khanom Mehr Is Dead"
 POD_gratiano.0222.champion.failure: "Your Champion Dies in the Ward"
 POD_gratiano.0222.critical.failure: "You Die in the Inner Ward"

 POD_gratiano.0223.t: "The Bronze Gate"
 POD_gratiano.0223.desc: "The gate is bronze, twice your height, green at the hinges and bright where hands have worn it. Karotos stands in front of it with a naked sword held point down, the way a laborer rests on a spade. Old stains darken the flagstones at the foot of the gate.\n\nThere is no speech this time. Karotos looks over whoever has come this far, takes the count, and settles on you with something close to boredom.\n\nThen the sword comes up, and the free hand beckons once."
 POD_gratiano.0223.a: "[martial_duelist.GetFirstNameNoTooltip], cut a way through."
 POD_gratiano.0223.b: "Karotos is mine."
 POD_gratiano.0223.b.draw: "The Duel with Karotos Ends Unsettled"
 POD_gratiano.0223.b.draw.tt: "Neither you nor Karotos wins the duel.\nThe assault continues."
# Duel prowess advantage.
 POD_gratiano_castle_edge_1_modifier: "Prepared"
 POD_gratiano_castle_edge_1_modifier_desc: "Your preparations for the assault lend you a slight edge when blades are drawn inside the castle."
 POD_gratiano_castle_edge_2_modifier: "Well Prepared"
 POD_gratiano_castle_edge_2_modifier_desc: "You came to the castle well prepared, and it tells when you fight within its walls. The fighting must still be done."
 POD_gratiano_castle_edge_3_modifier: "Everything in Its Place"
 POD_gratiano_castle_edge_3_modifier_desc: "Few have entered the castle as thoroughly prepared as you. In its duels you fight at the height of your advantage, though no advantage settles a duel alone."
 POD_gratiano.0223.effect.success.desc: "Karotos is killed and the bronze gate opens."
 POD_gratiano.0223.champion.failure.effect.desc: "[martial_duelist.GetFirstNameNoTooltip] is cut down by Karotos. You survive and gain stress."
 POD_gratiano.0223.success: "Karotos Falls at the Gate"
 POD_gratiano.0223.champion.failure: "Karotos Cuts Down Your Champion"

 POD_gratiano.0224.t: "The Founder's Archive"
 POD_gratiano.0224.desc: "Shelves rise past the reach of your sight, and the only path between them runs by a reading desk. Tubalcain does not get up from it.\n\n\"He wrote all of this, or took it from those who did,\" Tubalcain says, turning a page. \"I have read it. Sit. We will see how much you understand of what you came to steal. The one who understands less stays here, with the other dead letters.\""
 POD_gratiano.0224.a: "[learning_duelist.GetFirstNameNoTooltip], take the chair."
 POD_gratiano.0224.b: "I will sit across from you."
 POD_gratiano.0224.effect.success.desc: "Tubalcain loses the contest and dies. The archive no longer bars your way."
 POD_gratiano.0224.champion.failure.effect.desc: "[learning_duelist.GetFirstNameNoTooltip] loses the contest with Tubalcain and dies. You survive and gain stress."
 POD_gratiano.0224.critical.failure.effect.desc: "You lose the contest with Tubalcain and die in the archive."
 POD_gratiano.0224.success: "Tubalcain Is Destroyed"
 POD_gratiano.0224.champion.failure: "Your Champion Dies in the Archive"
 POD_gratiano.0224.critical.failure: "The Archive Becomes Your Tomb"

 POD_gratiano.0225.t: "The Shadow Door"
 POD_gratiano.0225.desc: "This door has no wood or iron in it. It is a tall oblong of dark set into the wall, and it leans toward you when you come near.\n\n\"It does that,\" says Tepelit, who is sitting on the steps beside it. \"It opens when I ask and for no other reason. I have kept it a long time, and in that time I have heard every threat there is. Spare me those.\"\n\nTepelit regards you without much hostility.\n\n\"Give me a reason. Tell me why the clan is better served by your passing than by your death, and make me believe it. The door will take whoever fails to persuade me.\""
 POD_gratiano.0225.a: "[diplomacy_duelist.GetFirstNameNoTooltip] speaks for me here."
 POD_gratiano.0225.b: "Hear me out, Tepelit."
 POD_gratiano.0225.effect.success.desc: "Tepelit is persuaded and opens the door, unharmed."
 POD_gratiano.0225.champion.failure.effect.desc: "[diplomacy_duelist.GetFirstNameNoTooltip] fails to persuade Tepelit, and [diplomacy_duelist.GetSheHe] dies. You survive and gain stress."
 POD_gratiano.0225.critical.failure.effect.desc: "You fail to persuade Tepelit and die at the shadow door."
 POD_gratiano.0225.success: "Tepelit Opens the Door"
 POD_gratiano.0225.champion.failure: "Your Envoy Dies at the Door"
 POD_gratiano.0225.critical.failure: "The Shadow Door Takes You"

 POD_gratiano.0226.t: "The Elder Brother"
 POD_gratiano.0226.desc: "The throne is empty. Montano stands beside it with one hand on its arm, armed and unhurried.\n\n\"I told him you would come,\" your brother says. \"He did not answer. He seldom does.\" Montano steps down from the dais. \"I will not ask what he promised you or kept from you. It no longer matters. I have stood between our sire and his enemies since before Rome was ours, and tonight you have made yourself one of them.\"\n\nHe offers the contest to nobody else. His eyes have not left you since you entered."
 POD_gratiano.0226.a: "Come, brother. Let us finish it."
 POD_gratiano.0226.destroy: "Montano Is Destroyed"
 POD_gratiano.0226.escape: "Montano Escapes the Castle"
 POD_gratiano.0226.escape.tt: "Montano survives and may return to face you again."
 POD_gratiano.0226.critical.failure: "Montano Strikes You Down"

 POD_gratiano.0227.t: "The Shifting Maze"
 POD_gratiano.0227.desc: "Beyond the throne room the castle stops behaving like a building. The passage divides, and divides again, and when you look back the turning you took is a blank wall. Stairs you descended now hang above you. Somewhere in this is the vault, and the corridors rearrange themselves around it like water around a stone.\n\nThere is a pattern. There must be; your sire made this, and he never made anything idle. You catch the edge of it in the angles, in which walls move and which only seem to. Lose the thread and you will walk these halls until there is nothing left of you to walk them."
 POD_gratiano.0227.desc.sybil: "Beyond the throne room the castle stops behaving like a building. Passages divide and seal behind you; a stair you descended hangs overhead.\n\nSybil walks a pace ahead with one palm flat against the wall, as if feeling for a pulse. \"He built this the way he thinks,\" she says. \"Wait.\" A corridor folds shut where you were about to step. \"Now left. I can tell you when it moves. I cannot tell you where it leads, so count the turnings and do not lose them.\""
 POD_gratiano.0227.desc.answer: "The forbidden answer you brought back from the Abyss sits in your mind like a splinter. Hold it against these corridors and some of them stop pretending: here the dark is only stone, there it is a way through. It will not walk the path for you."
 POD_gratiano.0227.a: "There is a pattern. Find it."
 POD_gratiano.0227.effect.success.desc: "You find the path through the maze to the vault."
 POD_gratiano.0227.critical.failure.effect.desc: "You lose your way, vanish into the maze, and die."
 POD_gratiano.0227.critical.failure: "The Maze Swallows You"

###### Sybil's request (0254) ######

# 0254: the repudiated daughter's price, from quarterly sync once she wakes.
 POD_gratiano.0254.t: "The Repudiated Daughter"
 POD_gratiano.0254.desc: "Sybil does not thank you for waking her. She asks whether her sire still sleeps in his castle, and when you say he does, she looks you over the way a buyer looks over a horse.\n\n\"Nobody of his blood rouses me for my company. You want something of him, little brother, and by your face it is nothing he would give.\" She works the stiffness from her fingers one at a time. \"I know the Abyss as he taught it to me, and a good deal he never meant me to learn. You may have the use of all of it. My price is my name. When he is beaten, you restore it, aloud, where every Cainite who matters can hear you do it.\""
 POD_gratiano.0254.a: "You will have your name back, sister."
 POD_gratiano.0254.b: "I will not carry that debt."
 POD_gratiano.0254.c: "My coterie has no place for you yet."
 POD_gratiano.0254.join.tt: "Sybil joins your coterie.\nYou owe her the public restoration of her name after the victory."
 POD_gratiano.0254.refuse.tt: "This offer is closed for good.\nYou gain neither Sybil's aid nor the debt."

###### Vault resolution (0260-0279) ######

# 0260: the shrouded god (entry).
 POD_gratiano.0260.t: "The Sleeper in the Vault"
 POD_gratiano.0260.desc: "The vault holds no bier and no corpse. At its far end the dark lies heaped the way a blanket heaps over a sleeper: a shoulder, a hip, the long slope of a leg.\n\nYou speak the calling, and the dark answers it. A hand gathers itself out of the floor. Then a forearm thicker than your waist, a ribcage, a throat. The head comes last, and its eyes stay shut. Your sire fills the vault from wall to wall and does not know you are standing beside him.\n\nThere is blood in him now, under skin that did not exist a moment ago."
 POD_gratiano.0260.a: "The blood is mine alone."
 POD_gratiano.0260.b: "Come. We drink of this together."
 POD_gratiano.0260.c: "A promise was made. Let the Assamite drink."

# 0261: drink deep, preparation 0.
 POD_gratiano.0261.t: "The Sire Within"
 POD_gratiano.0261.desc: "You drink until the shape you called has nothing left to hold it together. It sags, thins, and runs back into the corners of the vault as plain shadow. Whoever asks will be told that you slew the founder of your clan, and no one will be able to call it a lie.\n\nYou rise to leave and your legs wait, as a servant waits for a nod. Then they carry you to the stair. By the top of it you have already decided whom to see first and what to tell them. The reasoning is sound. You cannot recall doing it.\n\nBehind your eyes, something old has finished looking over the vault and has begun on your memories."
 POD_gratiano.0261.a: "I have won. The voice will fade."

# 0262: mid-feed reckoning (Elioud ladder).
 POD_gratiano.0262.t: "The Blade at Your Back"
 POD_gratiano.0262.desc: "Your mouth is at the founder's throat when steel touches the back of your own. The pressure is light. It is meant to be noticed.\n\n\"Heart's blood was promised to the children of Haqim,\" the Assamite says. \"You are drinking it.\"\n\nThe shape you called out of the dark does not stir beneath you; it knows nothing of promises. You are bent over it with both hands buried in shadow, and the blade's owner has had all the time needed to choose where to stand. The blood is still running, and the edge has not moved."
 POD_gratiano.0262.a: "I settle this myself, here and now."
 POD_gratiano.0262.a.success: "The Assamite Dies in the Vault"
 POD_gratiano.0262.maimed: "Struck Down into Torpor"
 POD_gratiano.0262.maimed.tt: "You fall into torpor and wake after 8 years.\nThe founder is still recorded as slain.\nThe Assamites still seek vengeance."
 POD_gratiano.0262.b: "My champion will answer you."
 POD_gratiano.0262.b.success.desc: "[prowess_duelist.GetFirstNameNoTooltip] kills the Assamite. You keep feeding, and the Assamites will seek vengeance."
 POD_gratiano.0262.b.success: "Your Champion Kills the Assamite"
 POD_gratiano.0262.b.wounded.desc: "Your champion is beaten but survives. The Assamite withdraws, and the Assamites will seek vengeance."
 POD_gratiano.0262.b.wounded: "The Assamite Slips Away"
 POD_gratiano.0262.b.grave.desc: "[prowess_duelist.GetFirstNameNoTooltip] dies fighting the Assamite. You keep feeding, and the Assamites will seek vengeance."
 POD_gratiano.0262.b.grave: "Your Champion Falls to the Assamite"

# 0263: drink deep, preparation 1 (torpor gamble).
 POD_gratiano.0263.t: "A Stolen Portion"
 POD_gratiano.0263.desc: "The shape you called comes apart before you have finished with it. What you swallowed is enough to fill your veins with a strength you have never had, and it is still less than all of him.\n\nThe rest goes back into the dark, and the dark is full of things that watched you take it. They press close. Your knees have begun to shake, and the floor looks very far away."
 POD_gratiano.0263.desc.answer: "The answer you were never meant to be given comes back to you. For a moment your knees hold steady."
 POD_gratiano.0263.a: "Stay on your feet. Stay awake."
 POD_gratiano.0263.stand.desc: "You withstand the blood and do not fall into torpor."
 POD_gratiano.0263.stand: "You Remain Standing"
 POD_gratiano.0263.collapse.desc: "The blood overwhelms you and you collapse into torpor."
 POD_gratiano.0263.collapse: "The Blood Lays You Low"
 POD_gratiano.0263.collapse.tt: "You fall into torpor and wake after 8 years."

# 0264: drink deep, preparation 2 (prepared ascension).
 POD_gratiano.0264.t: "Third from Caine"
 POD_gratiano.0264.desc: "Sybil stands at the founder's head with both hands sunk in the dark of him. She says nothing to you. Under her hands the shape you called lies quiet, and you drink.\n\nThe Orb of Dominion over the Shadows grows cold in your grip, then heavy, and the vault's shadows lean toward it. All that leaves the founder comes to you. You have walked the Abyss yourself, and nothing in it rises to dispute the blood.\n\nWhen the last of him is gone, Sybil takes her hands back and wipes them on her sleeve. She has not tasted a drop. You are of the third generation, in name and in the blood, and every vein you own aches with the newness of it."
 POD_gratiano.0264.a: "I am what he was."

# 0265 - share the blood
 POD_gratiano.0265.t: "Blood for the Coterie"
 POD_gratiano.0265.desc: "You hold the shape you called out of the shadows still, its throat laid open. Those of your coterie who followed you down look at the wound, then at you. None of them has stood this close to blood this old, and no one can tell them what it does to a lesser vessel. Some may rise from it greater. Some may not rise."
 POD_gratiano.0265.a: "Drink, each of you, and endure."
 POD_gratiano.0265.share.tt: "Each living, awake coterie member other than you drinks separately:\n60%: empowered toward the fourth generation\n25%: falls into torpor\n15%: suffers Final Death"
 POD_gratiano.0265.msg.empowered: "The Founder's Blood Takes Hold"
 POD_gratiano.0265.msg.torpor: "The Blood Drags a Drinker into Torpor"
 POD_gratiano.0265.msg.burnout: "The Blood Destroys Its Drinker"

# 0266 - the long sleep ends (shared wake)
 POD_gratiano.0266.t: "Return from the Vault"
 POD_gratiano.0266.desc: "The vault is behind you now, and so is the long toll it took. Letters went unanswered while you were beyond reach. Allies made their own arrangements; a few made them with each other. The clan has gone on arguing about what happened under Castel del Ombro, and it has done so without your account of it.\n\nThat can be mended. The elders still expect to be gathered, and the convocation still wants someone to call it. You send for ink."
 POD_gratiano.0266.a: "Back to work. The convocation waits."

# 0267 - the Assamite drinks
 POD_gratiano.0267.t: "A Promise Kept in Blood"
 POD_gratiano.0267.desc: "You stand aside. The Assamite kneels where you would have knelt and opens the throat of the shape you called out of the shadows.\n\nYou watch every swallow. The founder dwindles to a stain on the stone and then to nothing, and what rises from the floor carries itself differently from what knelt there. The Assamite gives you one nod for the bargain kept, then turns away, finished with you. The power you came here for is leaving the vault on someone else's feet."
 POD_gratiano.0267.a: "Take what was promised."
 POD_gratiano.0267.blade.tt: "The Assamite becomes fourth generation with blood potency 10 and an assassin's added power.\nThe Assamite returns to your pact partner if able, and otherwise leaves your court.\nYou gain none of this."

###### Assault & vault modifiers ######
 POD_gratiano_dominated_mind: "Dominated Mind"
 POD_gratiano_dominated_mind_desc: "You drank the founder unready, and something of him stayed. Another will moves behind your own. Hours go missing, orders leave your mouth unremembered, and your voice is sometimes not yours. Your intrigues suffer for it, and every strain weighs heavier."
 POD_gratiano_spirit_displeasure: "The Balked Spirit"
 POD_gratiano_spirit_displeasure_desc: "The spirits of the Abyss remember what this character took from the founder only half-prepared. Every Abyss ritual now exacts additional [stress|E], scaled to the ritual's own cost."
 POD_gratiano_assamite_vengeance: "Heart's-Blood Owed"
 POD_gratiano_assamite_vengeance_desc: "You swore the founder's heart's blood to the Assamites, then took it yourself. They have sent their assassins to settle the matter, and the waiting between attempts wears on you. The hunt holds until three of those assassins have died by your hand."
 POD_gratiano_godsblood_assassin: "Founder-Blooded"
 POD_gratiano_godsblood_assassin_desc: "The founder's heart's blood, taken as promised payment, runs in this assassin. It lends greater prowess, and hostile schemes come more readily and succeed more often."
 POD_gratiano_crown_of_shadows: "Crown of Shadows"
 POD_gratiano_crown_of_shadows_desc: "You hold the place the founder left empty, and the clan knows how it came to be empty. Deference arrives sooner now, and so does fear. Whether every elder concedes your right is another matter."
 POD_gratiano_contested_crown: "Contested Crown"
 POD_gratiano_contested_crown_desc: "The title is yours, but the convocation was not persuaded, and its elders say so where it will be repeated. Every act of rule is argued twice, and the arguing wears on you."

