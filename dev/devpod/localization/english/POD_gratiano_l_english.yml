###### Convocation & endings ######

# 0280 - the convocation
 POD_gratiano.0280.t: "The Convocation's Question"
 POD_gratiano.0280.desc: "The Amici Noctis have never before convened in a clan without its founder. Tonight they do, and the business before them is you. Your seat among them is yours by right, yet the Friends of the Night discuss you among themselves in your hearing. They argue over what was done in the Castle of Shadows and whether the one who did it should now answer for the clan.\n\nAn elder on the far side of the room finally puts it plainly. \"He is gone, and by your hand. What do you mean to do with that?\""
 POD_gratiano.0280.desc.outsider: "The Amici Noctis do not seat those who are not of their number, so you stand. A steward showed you to the open floor in the center of the room and left you there, the way petitioners and the accused are left. You are neither, quite. The Friends of the Night have convened because the founder is destroyed and you destroyed him, and they have found that they cannot settle what follows without you in the room.\n\nThey talk around you for a while. Then an elder leans forward. \"You were not brought here to listen. He is gone by your hand. Tell us what you mean to do with that.\""
 POD_gratiano.0280.desc.circle: "\n\n[convocation_second.GetFirstNameNoTooltip] stands a pace behind you."
 POD_gratiano.0280.desc.alone: "\n\nNo one from your coterie stands behind you tonight."
 POD_gratiano.0280.desc.dominated: "\n\nWhen you draw breath to answer, the first words that rise are in a cadence older than your own. You swallow them. One or two of the elders noticed."
 POD_gratiano.0280.desc.witness.sybil: "\n\nThe founder repudiated Sybil long ago, she has made no secret of whose side she took against him, and no one here has found the nerve to ask her to leave. She watches the elders rather than you, as though your answer interests her less than theirs."
 POD_gratiano.0280.desc.witness.nahir: "\n\nNahir speaks before you do, and loudly enough for every bench to hear. \"I will hear what my friend has to say.\""
 POD_gratiano.0280.a: "I will not sit in his place."
 POD_gratiano.0280.b: "The crown is mine to take."

# 0281 - Reject the Crown (canon)
 POD_gratiano.0281.t: "The Crown Refused"
 POD_gratiano.0281.desc: "You tell them you did not destroy the founder just to sit in his chair, and you leave it there. The Friends wait for the condition or the price. None comes. By the time the convocation finds its voice again it is arguing over who will speak for the clan, and nobody is looking at you.\n\nThe conspiracy has done what it was made to do, and it ends here. What you owe, you still owe, and anyone who hated you before tonight has not been asked to stop. You walk out past the stewards with no crown and no one's leave."
 POD_gratiano.0281.desc.we: "\"We did not destroy him so that one of us could sit where he sat,\" you tell the convocation. The word is chosen with care. You did not drink alone, and those who shared the founder's blood with you and still walk the night have as much claim on this victory as you do. The elders hear a refusal. They also hear that there is more than one of you.\n\nThe conspiracy has done what it was made to do, and it ends here. Its debts do not, and neither does any enemy it left standing. The convocation turns to the matter of who will speak for the clan, and you leave them to it."
 POD_gratiano.0281.a: "Let someone else wear it."

# 0282 - Claim the Throne
 POD_gratiano.0282.t: "The Claim Before the Convocation"
 POD_gratiano.0282.desc: "You say it: the founder's place is vacant, and you will fill it. Nobody shouts. The Friends of the Night are too old for that. The questions come instead, from one seat after another, each politely put. By what right? And what does the clan gain from a ruler such as you?\n\nThey cannot hand the place back to the one who held it, and they know it. What is left to them is whether they bow to you or merely fail to stop you. The eldest among them raises a hand for quiet and nods to you to speak."
 POD_gratiano.0282.a: "Hear me, and then judge."
 POD_gratiano.0282.effect.success.desc: "The convocation accepts your rule: you gain the title, the epithet and the crown."
 POD_gratiano.0282.success: "The Convocation Accepts Your Rule"
 POD_gratiano.0282.contested.effect.desc: "You take the title, the epithet and the crown over their objections; your rule is contested for twenty years."
 POD_gratiano.0282.contested: "The Crown Is Yours, and Disputed"

# 0283 - Sybil's price falls due
 POD_gratiano.0283.t: "A Name Owed"
 POD_gratiano.0283.desc: "The business of the Castle of Shadows is settled, and Sybil has not let many nights pass before raising the other business.\n\n\"You gave your word when you needed me,\" she says. \"I have come to collect it.\"\n\nShe has chosen her moment. Half the elders of the clan are watching to see what you do next, and to raise up a daughter the founder cast out would cost you standing with every one of them who accepted her disgrace."
 POD_gratiano.0283.desc.torpor: "Sybil lies in torpor and cannot ask you for what she is owed. The promise stands regardless. You made it aloud, to a sister who wanted one thing from you, and it was the whole of her price.\n\nNow the business of the Castle of Shadows is settled and the debt has come due with nobody awake to collect it. Restoring her name would still cost you standing with every elder who accepted her disgrace. Letting the matter lie would cost you nothing tonight. Then again, sleepers have been known to wake. You woke this one yourself."
 POD_gratiano.0283.a: "Let them all hear her name restored."
 POD_gratiano.0283.b: "That promise has served its purpose."
 POD_gratiano.0283.honor.tt: "Sybil's name is publicly restored at a cost in [prestige|E].\nYour promise to her is discharged."
 POD_gratiano.0283.discard.tt: "Sybil leaves your coterie and becomes your rival."
 POD_gratiano.0283.discard.torpor.tt: "You repudiate your promise to restore Sybil's name."
 POD_gratiano.0283.discard: "The Promise to Sybil Repudiated"

# 0286 - the shadow that got away
 POD_gratiano.0286.t: "Montano Returns"
 POD_gratiano.0286.desc: "Montano comes alone and unannounced, and no one at your door cares to stop him. He has had years to think about the castle. He halts a sword's length from you and looks at the empty room behind your chair.\n\n\"No walls this time, brother, and no one at your back. I did not come for your ashes. I came to learn what you are worth without them.\""
 POD_gratiano.0286.a: "Then measure me, brother."
 POD_gratiano.0286.survive.desc: "The night runs short and Montano has not put you down. He steps back, looks you over as he would a soldier he has not finished judging, and leaves without a word."
 POD_gratiano.0286.survive: "You Hold Against Montano"
 POD_gratiano.0286.wounded.desc: "Montano puts you down and keeps you there until you stop rising. He could finish it and does not. \"The same as ever,\" he says, and leaves you to gather yourself off the ground."
 POD_gratiano.0286.wounded: "Beaten by Montano"

# 0287 - the burned allies
 POD_gratiano.0287.t: "A Reputation for Treachery"
 POD_gratiano.0287.desc: "Letters go unanswered. Elders who once sent envoys now send regrets, and the courts that still receive you seat their own people between you and the door. They have heard about those you used and discarded on the way to the castle, and each has decided not to be next."
 POD_gratiano.0287.a: "I knew what this would cost."
 POD_gratiano.0287.desc.shared: "Word of how you won has reached every court that matters, and the suspicion does not stop at you. Those of your coterie who came away with the founder's blood in them are watched as you are watched: welcomed late, seated apart, asked careful questions about that night. They carry the same strength and the same stain. Some of them look to you when a door closes in their faces, and you have nothing to tell them that they did not already know when they drank."

###### Assamite vengeance ######

# 0291 - the blade in the night
 POD_gratiano.0291.t: "The Assamite's Ambush"
 POD_gratiano.0291.desc: "The torch at the end of the passage has been put out. You notice that a moment before you notice the figure already moving where its light should fall.\n\nThe Assamites have no need to explain themselves: you kept the heart's blood you had sworn to them, and this is how they answer. Only one of you will walk out of this passage.\n\nThe first blow is on its way."
 POD_gratiano.0291.a: "Then come and collect."
 POD_gratiano.0291.a.success.desc: "You slip the first strike and face the assassin unhurt."
 POD_gratiano.0291.a.success: "The Assassin Lies Dead"
 POD_gratiano.0291.a.wounded.desc: "The first strike wounds you before the duel begins."
 POD_gratiano.0291.a.wounded: "Wounded in the Ambush"
 POD_gratiano.0291.a.grave.desc: "The first strike wounds you gravely before the duel begins."
 POD_gratiano.0291.a.grave: "Gravely Wounded in the Ambush"

# 0292 - the mountain relents
 POD_gratiano.0292.t: "The Hunt Called Off"
 POD_gratiano.0292.desc: "Three assassins have come for you, and three have met Final Death at your hands. No fourth follows. The clan's hunt for you is set down.\n\nNothing has been repaid. The heart's blood is as lost to the Assamites as it was the night you took it; they have simply stopped sending for it. You can walk an unlit passage again without counting the doors."
 POD_gratiano.0292.a: "So ends the hunt, if not the debt."
 POD_gratiano.0292.a.toast: "The Assamite Vendetta Ends"

###### Dominated-mind ring (0270-0272) ######
 POD_gratiano.0270.t: "The Missing Hours"
 POD_gratiano.0270.desc: "The candle on your table was new when you sat down to the letters. It is a cold stub now, and the page in front of you is still blank. Mud is drying on your boots. The shutters stand open on a sky much nearer dawn than it ought to be.\n\nYour steward says you went out after midnight and wished no escort. He does not say where. He watches to see whether you will ask."
 POD_gratiano.0270.a: "Find out where the hours went."
 POD_gratiano.0270.b: "Ask nothing. The hours are gone."
 POD_gratiano.0270.b.tt: "Letting the lapse pass strains you less than pursuing it.\nYour mind remains dominated."
 POD_gratiano.0271.t: "The Unremembered Order"
 POD_gratiano.0271.desc: "Your captain reports that it has been done as you ordered: the east gate is barred, the watch on it doubled, and no one leaves before you say so. He holds out the writ. It is in your hand and sealed with your ring, dated two nights past.\n\nYou remember two nights past. You remember nothing of this. The captain waits, and behind him wait the men who have stood a double watch on your word."
 POD_gratiano.0271.a: "I gave no such order. Undo it."
 POD_gratiano.0271.b: "The order stands as written."
 POD_gratiano.0271.b.tt: "Letting the order stand strains you less than revoking it.\nYour mind remains dominated."
 POD_gratiano.0272.t: "A Borrowed Voice"
 POD_gratiano.0272.desc: "You are halfway through the judgment when you hear how you are giving it. The words are yours. The pace is slower than you have ever spoken, each phrase set down and left to stand, and your hand has come to rest flat on the arm of the chair in a gesture you know well and have never made.\n\nThe hall has noticed. Nobody in it looks at you directly. The petitioner has gone to his knees, though you did not ask it of him, and the sentence is still unfinished in your mouth."
 POD_gratiano.0272.a: "Finish it in my own voice."
 POD_gratiano.0272.b: "Let the voice finish the sentence."
 POD_gratiano.0272.b.tt: "Yielding to the voice strains you less than fighting it.\nYour mind remains dominated."

###### Orb of Dominion over the Shadows ######
# PoD key overrides; paired with POD_gratiano_orb_override.txt.
 POD_gratiano_orb_abyss_decision: "Plumb the Abyss"
 POD_gratiano_orb_abyss_decision_desc: "You can bend shadow already; the Orb of Shadows shows you how little that is. The dark inside it moves in patterns your Obtenebration never taught you, and each of them is paid for in blood. Sit with the Orb, give it what it asks, and you will rise knowing Abyssal Mysticism."
 POD_gratiano_orb_abyss_decision_tooltip: "Draw #EMP Abyssal Sorcery#! (Abyss Mysticism) from the Orb of Dominion over the Shadows."
 POD_gratiano_orb_abyss_decision_confirm: "Descend into the Abyss"

