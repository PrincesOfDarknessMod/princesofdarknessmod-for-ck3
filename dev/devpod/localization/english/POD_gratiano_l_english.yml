###### Base-event overrides ######
# POD_anteshuntabsi.3: no assassination victim.
 POD_anteshuntabsi.3.desc.novictim: "You are preparing for the journey towards Baba Yaga's home when you find a single word written in blood on the wall of your haven: 'Nictuku'.\nThere was no one for the assassin to take, since you keep no entourage worth the name. The warning is unmistakable. During your research into Absimilliard, you learned the name belonged to his blood-bound childer, soulless killers sworn to destroy any threat to their progenitor.\nTheir knives have marked you. You must strike before they return."
# Sabbat 2000: regency election already pending.
 POD_sabbat_regent_election_in_progress_tt: "A Regent election is not already underway"

###### Commune with the Abyss: the forbidden question and its answer (0350) ######
 POD_gratiano_commune_slay_god: "\"How might one slay a god?\""
 POD_gratiano_commune_slay_god_tt: "#bold The Abyss answers once.#!\nYou learn how a god is killed and what the drinker risks. The answer guides you through the #bold shifting vault#! and steadies you against the #bold elder blood you drink#!. You may ask this only once."
 POD_gratiano.0350.t: "Taught or Baited"
 POD_gratiano.0350.desc: "The Abyss answers with a memory you never lived: a god devoured from within, its shadow drawn tight over a vast wound. Behind that wound, a will has already turned toward the drinker it expects. You wake at dusk knowing where to cut and how long the thing beneath the shadow has waited for someone to learn. The memory's owner remains unknown, as does the intent behind it. The knowledge comes too readily to feel like a gift."
 POD_gratiano.0350.a: "I will carry what it showed me."
