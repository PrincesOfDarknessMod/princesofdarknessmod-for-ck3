l_english:

###### Gratiano de Veronese - The Long Conspiracy ######

###### Story panel: name, desc, counters, custom string body ######

 POD_gratiano_story: "#glow_color:{0.2,0.05,0.25,0.5}The Long Conspiracy#!"
 POD_gratiano_story_desc: "The Antediluvian sleeps beneath his own castle while his newest favorite wears a courtier's smile above. Gratiano begins clearing a path to the founder's seat."

 POD_gratiano_story_trust_label: "Standing at Court"
 POD_gratiano_story_trust_min_label: "Exposed"
 POD_gratiano_story_trust_max_label: "Favored"

 POD_gratiano_story_conspiracy_label: "The Conspiracy"
 POD_gratiano_story_conspiracy_min_label: "Whispers"
 POD_gratiano_story_conspiracy_max_label: "Ready"

 POD_gratiano_story_inner_circle_label: "The Inner Circle"
 POD_gratiano_story_circle_label: "Sworn to the Conspiracy"

 POD_gratiano_story_begins.toast: "The Long Conspiracy Begins"

# Keep GuiScope.SetRoot first: trust_mirror uses Story; dispatchers use the story owner.
 POD_gratiano_story_custom_string: "[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('POD_gratiano_story_phase')]\n[Story.GetOwner.Custom('POD_gratiano_story_body')]"

###### Phase headers (selected by POD_gratiano_story_phase dispatcher) ######

 POD_gratiano_story_phase_proclamation: "#bold The Upstart#!\nThe court has named you the founder's favorite and calls it an honor. You know it for what it really is: mockery. You have not yet said, even to yourself, what you intend to make of it."
 POD_gratiano_story_phase_courtier: "#bold The Courtier#!\nYou smile at the high table and study the four powers hemming you in. Each calls for a careful response."
 POD_gratiano_story_phase_liberator: "#bold The Liberator#!\nThe rivals are dealt with and the Amici Noctis have taken your oath. With the road to Sicily open, you turn at last toward the founder's seat."
 POD_gratiano_story_phase_kingslayer: "#bold The Kingslayer#!\nThe decision is made and the assault has begun. You descend beneath the castle to face its sleeping master."

###### Readiness tiers (selected by POD_gratiano_story_tier dispatcher) ######

 POD_gratiano_story_tier_whispers: "#z Readiness:#! a few rumors traded in the dark."
 POD_gratiano_story_tier_circle: "#z Readiness:#! a small circle of allies willing to keep the conspiracy among themselves."
 POD_gratiano_story_tier_pieces: "#z Readiness:#! the needed favors are owed and the blades are within reach."
 POD_gratiano_story_tier_ready: "#P Readiness: ready to strike.#! The conspiracy is strong enough to move against the castle itself."

###### Milestone checklist (8 lines, _on = @check_icon!, _off = @cross_icon!) ######

 POD_gratiano_check_giovanni_on: "@check_icon! #P The Giovanni displaced from their seat.#!"
 POD_gratiano_check_giovanni_pending: "@warning_icon! #tooltip:POD_gratiano_check_giovanni_tt #Y The move against the Giovanni is in motion.#!#!"
 POD_gratiano_check_giovanni_off: "@cross_icon! #tooltip:POD_gratiano_check_giovanni_tt The Giovanni still hold their seat.#!"

 POD_gratiano_check_moncada_on: "@check_icon! #P Ambrosio Moncada answered for.#!"
 POD_gratiano_check_moncada_pending: "@warning_icon! #tooltip:POD_gratiano_check_moncada_tt #Y The move against Moncada is in motion.#!#!"
 POD_gratiano_check_moncada_off: "@cross_icon! #tooltip:POD_gratiano_check_moncada_tt Ambrosio Moncada still stands against you.#!"

 POD_gratiano_check_nahir_on: "@check_icon! #P Nahir's grievance settled.#!"
 POD_gratiano_check_nahir_pending: "@warning_icon! #tooltip:POD_gratiano_check_nahir_tt #Y The reckoning with Nahir is in motion.#!#!"
 POD_gratiano_check_nahir_off: "@cross_icon! #tooltip:POD_gratiano_check_nahir_tt Nahir's grievance is unsettled.#!"

 POD_gratiano_check_ventrue_on: "@check_icon! #P The Ventrue interest cleared away.#!"
 POD_gratiano_check_ventrue_pending: "@warning_icon! #tooltip:POD_gratiano_check_ventrue_tt #Y The shadow war on the Ventrue is in motion.#!#!"
 POD_gratiano_check_ventrue_off: "@cross_icon! #tooltip:POD_gratiano_check_ventrue_tt The Ventrue still hold independent seats in the sphere.#!"

 POD_gratiano_check_amici_on: "@check_icon! #P The Amici Noctis have taken your oath.#!"
 POD_gratiano_check_amici_off: "@cross_icon! #tooltip:POD_gratiano_check_amici_tt The Amici Noctis have not yet judged you worthy.#!"

###### Plan I objective tooltips ######
 POD_gratiano_check_giovanni_tt: "#bold Break the Giovanni#!\nComplete when no independent Giovanni prince holds any county in Italy, Venice, or Romagna, and the Giovanni crown itself sits vacant.\n#I Vassalize them or destroy them#!"
 POD_gratiano_check_ventrue_tt: "#bold Clear the Ventrue#!\nComplete when no independent Ventrue prince holds any county in Italy, Venice, or Romagna.\n#I Vassalize them or destroy them#!"
 POD_gratiano_check_moncada_tt: "#bold Answer the Cardinal#!\nComplete when both Ambrosio Moncada, Cardinal of Aragon, and his caged childe Lucita are dead.\n#I Lucita cannot be reached while the Cardinal's cage still holds her#!"
 POD_gratiano_check_nahir_tt: "#bold Settle Nahir#!\nComplete when Nahir is either dead or bound to you as a friend.\n#I Buy back his regard until he counts you a friend, or kill him#!"
 POD_gratiano_check_amici_tt: "#bold The Amici's Judgment#!\nThe Friends of the Night take no oath from the unworthy. \n#I Deal with all four powers above and they will judge you worthy#!"

 POD_gratiano_check_pact_on: "@check_icon! #P The Assamite pact is sworn.#!"
 POD_gratiano_check_pact_off: "@cross_icon! No blade of the Assamites has been promised."

 POD_gratiano_check_elders_on: "@check_icon! #P The elders' opposition is broken.#!\n$POD_gratiano_check_elders_details$"
 POD_gratiano_check_elders_off: "@cross_icon! #bold Silence the elders.#!\n$POD_gratiano_check_elders_details$"
 POD_gratiano_check_elders_details:0 "#V [GetPlayer.MakeScope.ScriptValue('POD_gratiano_framed_count_value')|0]#! of #V 4#! currently silenced; #V 3#! required.\n[GetPlayer.Custom('POD_gratiano_check_elder_montano')]\n[GetPlayer.Custom('POD_gratiano_check_elder_alfonzo')]\n[GetPlayer.Custom('POD_gratiano_check_elder_guilelmo')]\n[GetPlayer.Custom('POD_gratiano_check_elder_boukephos')]"
 POD_gratiano_check_elder_row:0 "[gratiano_elder.GetShortUIName]: [GetPlayer.Custom2('POD_gratiano_check_elder_status', SCOPE.sC('gratiano_elder'))]"
 POD_gratiano_check_elder_silenced:0 "@check_icon! #P Silenced#!"
 POD_gratiano_check_elder_unsilenced:0 "@cross_icon! #N Unsilenced#!"
 POD_gratiano_check_elder_montano_missing:0 "Montano: $POD_gratiano_check_elder_silenced$"
 POD_gratiano_check_elder_alfonzo_missing:0 "Alfonzo: $POD_gratiano_check_elder_silenced$"
 POD_gratiano_check_elder_guilelmo_missing:0 "Guilelmo: $POD_gratiano_check_elder_silenced$"
 POD_gratiano_check_elder_boukephos_missing:0 "Boukephos: $POD_gratiano_check_elder_silenced$"

 POD_gratiano_check_sicily_on: "@check_icon! #P Siracusa held, opening the door to the castle.#!"
 POD_gratiano_check_sicily_off: "@cross_icon! Siracusa and the seat beneath it remain in another's hands."

###### Per-phase panel bodies (POD_gratiano_story_body) ######

 POD_gratiano_story_body_proclamation: "\n#I Proclaim Born to Rule to begin the long work.#!"

 POD_gratiano_story_body_courtier: "[GetPlayer.Custom('POD_gratiano_story_tier')]\n#N Standing at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_trust_value')|0]#!\n#T The Four Accounts:#!\n[GetPlayer.Custom('POD_gratiano_check_giovanni')]\n[GetPlayer.Custom('POD_gratiano_check_moncada')]\n[GetPlayer.Custom('POD_gratiano_check_nahir')]\n[GetPlayer.Custom('POD_gratiano_check_ventrue')]\n[GetPlayer.Custom('POD_gratiano_check_amici')]"

 POD_gratiano_story_body_liberator: "[GetPlayer.Custom('POD_gratiano_story_tier')]\n#N Standing at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_trust_value')|0]#!\n#T The Road to the Castle: the last preparations before the descent#!\n[GetPlayer.Custom('POD_gratiano_check_pact')]\n[GetPlayer.Custom('POD_gratiano_check_elders')]\n[GetPlayer.Custom('POD_gratiano_check_sicily')]"

 POD_gratiano_story_body_kingslayer: "[GetPlayer.Custom('POD_gratiano_story_tier')]\n#N Standing at court: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_trust_value')|0]#!\n#R The strike is launched.#! The circle is committed, and the door to the castle stands open at last.\nBeneath it the founder waits, indifferent and eternal. You descend into the dark to end him, or to be ended."

###### Event 0001 - the awakening intro ######

 POD_gratiano.0001.t: "Strength Determines Station"
 POD_gratiano.0001.desc: "'Lord Gratiano.' The words have been spoken by elders in a mocking tone. You were Born to Rule and the court will know it. They will speak those words with fear and respect.\n\nIn Sicily the founder sleeps in his fortress-tomb. Four powers crowd the road toward it. The Giovanni trade in the dead as their fathers traded in salt; the Ventrue answer every claim with an older one. A Cardinal in Madrid has given offense that cannot be forgotten and the clan still remembers how Nahir won his wager and never forgave your laughter."
 POD_gratiano.0001.a: "First, the ones in my way."

 POD_gratiano_intro_objectives_tt: "#T The work before the castle:#!\nFour rival powers stand between you and the seat: the #bold Giovanni#!, the #bold Ventrue#!, #bold Moncada#!, and #bold Nahir#!. Above them waits the judgment of the #bold Amici Noctis#!. A decision opens each campaign; another cannot begin until the current one is finished."

###### Event 0002 - court suspicion warning (Trust <= 20) ######

 POD_gratiano.0002.t: "The Court Wonders"
 POD_gratiano.0002.desc: "The change begins in small courtesies. A conversation stops when you enter. A seat is left a hand's-breadth farther from your own; twice now, an invitation has arrived the night after its feast.\n\nNo charge has been laid against you, yet the court has begun to wonder at your purpose."
 POD_gratiano.0002.a: "I will remind them why they favored me."
 POD_gratiano.0002.b: "Then the circle goes quiet."

 POD_gratiano_trust_recovery_hint_tt: "Standing can be rebuilt by currying favor in the founder's court or handing over a lesser conspirator for punishment. Either course cools the suspicion."
 POD_gratiano_quiet_circle_tt: "#R -10 The Conspiracy#!\nThe circle suspends its meetings and stops carrying whispers. The court finds nothing, but the work loses ground."

###### Event 0003 - exposure (Trust = 0, pre-strike) ######

 POD_gratiano.0003.t: "The Court Knows"
 POD_gratiano.0003.desc: "A careless mouth, or an ambitious one, has betrayed the conspiracy. The words reached a table where they were believed, and by the end of the week they will reach those who decide such matters.\n\nYour favor at court is spent, and with it the whole of your protection. Your steward has twice asked whether the household should be travelling."
 POD_gratiano.0003.a: "Then it is tonight. The castle, ready or not."
 POD_gratiano.0003.b: "Stand. Let them accuse me to my face."
 POD_gratiano.0003.c: "Scatter. Be gone by morning."

 POD_gratiano_forced_strike_tt: "#R The assault begins.#!\nThe attack on the castle starts within days, before the conspiracy is truly ready. The haste worsens the odds. The Strike the Castle decision is forfeit; there is no other way in now."
 POD_gratiano_doomed_strike_warning_tt: "#X Doomed:#! the groundwork is unfinished. Core rivals still stand, and the founder's defenses are untouched. #bold The assault is very nearly unwinnable.#!"
 POD_gratiano_face_purge_tt: "Keep the seat and answer for the conspiracy in the open. The circle is lost, the work undone, and the court's judgment may run to Final Death."
 POD_gratiano_flee_court_tt: "Vanish ahead of the purge. Survival is certain; the disgrace is deeper, and it follows you far longer."

 POD_gratiano_forced_strike_message: "Exposed, you order the assault on the castle."
 POD_gratiano_strike_already_committed_message: "The strike is already committed. The assault on the castle is underway; no second order is needed."
 POD_gratiano_purge_coming_message: "The purge is coming."

###### Event 0004 - the purge lands ######

 POD_gratiano.0004.t: "The Purge"
 POD_gratiano.0004.desc: "For three nights, rooms are emptied and their occupants taken without word of where they went. Those of your people who escape know whose ambition brought this down upon them.\n\nThe purge sought the names of everyone prepared to follow you into Sicily. By the end of it, you alone remain."
 POD_gratiano.0004.a: "I will answer for it, and take what comes."
 POD_gratiano.0004.b: "I was gone before they came."

 POD_gratiano_purge_faced_tt: "The circle is scattered and the conspiracy reset to nothing. Your standing takes a grievous blow as you face the court's judgment, which may cost you Final Death, especially if the plot ran deep."
 POD_gratiano_purge_fled_tt: "You escape death at the price of a far heavier loss of standing. The mark of the exposed conspirator stays with you."

 POD_gratiano_purge_survived_message: "The court has passed judgment. You remain alive for now, but your standing is broken."
 POD_gratiano_purge_fled_message: "You flee before the trial. Your disgrace follows you beyond the court."

###### Crash modifier ######

 POD_gratiano_exposed_conspirator_modifier: "Exposed Conspirator"
 POD_gratiano_exposed_conspirator_modifier_desc: "The founder's court caught the Upstart reaching for the seat. His name is now repeated at the high table as a warning."

 POD_gratiano_low_standing_1_modifier: "Slipping Favor"
 POD_gratiano_low_standing_1_modifier_desc: "Your standing at court has begun to slip, and your own blood has noticed."
 POD_gratiano_low_standing_2_modifier: "Waning Confidence"
 POD_gratiano_low_standing_2_modifier_desc: "Your standing is visibly failing, and the dynasty's confidence with it. Kin who once deferred now weigh their loyalties in the open."
 POD_gratiano_low_standing_3_modifier: "The Blood Doubts You"
 POD_gratiano_low_standing_3_modifier_desc: "Your authority at court is gone, and your own blood has nearly written you off. Even your kin speak of you as spent."

###### Shared strike warnings ######

 POD_gratiano_strike_knife_edge_warning_tt: "#Y Uncertain:#! the groundwork is nearly complete, but gaps remain. The last preparations will decide whether the assault can succeed."
 POD_gratiano_exposure_warning_tt: "#X Warning:#! Your standing at court is failing. If it collapses entirely, the conspiracy is exposed and the court will dictate the reckoning."

###### Conspiracy levers, academy & coterie ######

###### Interaction: Recruit a Lasombra ######

 POD_gratiano_recruit_lasombra_interaction: "Extend the Hand of Shadow"
 POD_gratiano_recruit_lasombra_interaction_desc: "Sound out this cousin in the blood, and see whether they would rather serve you than the sleeping founder."

 POD_gratiano_recruit_accept_tt: "#P +[recipient.MakeScope.ScriptValue('POD_gratiano_recruit_conspiracy_gain_value')|0] The Conspiracy#!\nThey join the outer circle. Old blood and high station add more to the conspiracy; even a reluctant conspirator adds something."
 POD_gratiano_recruit_gain_blood_old: "Old blood (generation 4-6)"
 POD_gratiano_recruit_gain_blood_thin: "Blood far from Caine (generation 11+)"
 POD_gratiano_recruit_gain_rank_king: "A king answers the call"
 POD_gratiano_recruit_gain_rank_duke: "A duke answers the call"
 POD_gratiano_recruit_gain_rank_count: "A count answers the call"
 POD_gratiano_recruit_gain_rank_baron: "A baron answers the call"
 POD_gratiano_recruit_decline_tt: "#Y A refusal may reach the court.#! Pious Lasombra are especially likely to report the invitation."
 POD_gratiano_recruit_joined_toast: "A New Blade in the Dark"
 POD_gratiano_recruit_refused_message: "The offer is declined. It may not remain private."
 POD_gratiano_recruit_refused_message_tt: "They will not join the conspiracy. Watch the court; a scandalized clanmate may repeat what they heard."

 POD_gratiano_recruit_accept_ambitious: "Ambition answers the hidden summons"
 POD_gratiano_recruit_accept_deceitful: "The deceitful relish a secret worth keeping"
 POD_gratiano_recruit_accept_disloyal: "The disloyal have no love for the sleeping founder"
 POD_gratiano_recruit_accept_content: "The content see no reason to reach for more"
 POD_gratiano_recruit_accept_zealous: "Zeal recoils from a merely pragmatic scheme"
 POD_gratiano_recruit_accept_eldest: "The mystique of the Eldest draws believers in"

###### Interaction: Leverage a Hook ######

 POD_gratiano_leverage_hook_interaction: "Call In the Debt"
 POD_gratiano_leverage_hook_interaction_desc: "Remind this one exactly what you hold over them, and set them to work for the conspiracy whether they will it or no."

 POD_gratiano_leverage_hook_tt: "#bold The hook is spent.#!\n#P ++The Conspiracy#!: a strong hook yields more than a weak one.\nTheir resentment may eventually break the hold."

###### Interaction: Sell Out a Conspirator ######

 POD_gratiano_sell_out_interaction: "Hand Them to the Court"
 POD_gratiano_sell_out_interaction_desc: "Deliver one of your own conspirators to the founder's court, offering it a culprit while the wider plot stays hidden."

 POD_gratiano_sell_out_tt: "#Y Betrayal buys standing.#!\nWord is sent to the court naming this one. Within days the court will act, raising your standing for the sacrifice while the conspiracy loses ground."
 POD_gratiano_sell_out_sent_message: "The letter is sent. The court will have its lesser traitor within days."
 POD_gratiano_sell_out_sent_message_tt: "The named conspirator has been offered up. Await the court's answer."

###### Decision: The Academy ######

 POD_gratiano_academy_decision: "Convene the Shadow Academy"
 POD_gratiano_academy_decision_desc: "Gather the willing beneath one roof and teach them what loyalty to you may bring. Each gathering costs a measure of standing while advancing the conspiracy. From time to time, it may also bring another loyal Lasombra into the circle."
 POD_gratiano_academy_decision_effect_tt: "#bold Gather the academy.#!\nEach gathering #P advances the conspiracy#! and #R costs standing at court#!, scaled by the school's size and creed. A prosperous gathering may surface a new Lasombra recruit; a careless one may start rumors."

###### Rival-pursuit decisions ######

 POD_gratiano_rival_focus_busy_desc: "#X Another move is already in motion.#! You must finish the current campaign and settle its objective before you can begin another."

 POD_gratiano_pursue_giovanni_decision: "Move Against the Giovanni"
 POD_gratiano_pursue_giovanni_decision_desc: "The necromancers of Venice count coin and corpses alike, and their holdings crowd the sphere you mean to inherit. Begin the campaign to break their hold on Italy. It will occupy your nights until the Giovanni are driven from the sphere."
 POD_gratiano_pursue_giovanni_decision_effect_tt: "#bold Open the Giovanni campaign.#!\nThe first council convenes in Verona. This campaign #Y holds your attention#! until the Giovanni are broken, preventing any move against another rival."
 POD_gratiano_pursue_giovanni_launch_toast: "The long work against the Giovanni begins."
 POD_gratiano_pursue_giovanni_decision_tooltip: "Open the campaign to break the Giovanni's grip on the Italian sphere."
 POD_gratiano_pursue_giovanni_decision_confirm: "Begin the Campaign"

 POD_gratiano_pursue_ventrue_decision: "Move Against the Ventrue"
 POD_gratiano_pursue_ventrue_decision_desc: "The Clan of Kings has planted princes across northern Italy to guard its oldest claims. You now turn on their interests in Lombardy and Romagna. You may bend them through diplomacy or bring them down in war; the shadow conflict ends when every Ventrue prince in the sphere is brought to heel."
 POD_gratiano_pursue_ventrue_decision_effect_tt: "#bold Open the Ventrue shadow war.#!\nThe campaign begins, and the Shadow War casus belli becomes available. While a Ventrue prince remains independent in the sphere, You are #Y committed to this campaign#! and cannot pursue another rival."
 POD_gratiano_pursue_ventrue_launch_toast: "The shadow war on the Ventrue begins."
 POD_gratiano_pursue_ventrue_decision_tooltip: "Begin the shadow war to clear the Ventrue interest from the Italian sphere."
 POD_gratiano_pursue_ventrue_decision_confirm: "Begin the Shadow War"

 POD_gratiano_pursue_moncada_decision: "Move Against Moncada"
 POD_gratiano_pursue_moncada_decision_desc: "Ambrosio Luis Moncada, Cardinal of Aragon, keeps his childe Lucita caged and regards the founder's upstart favorite with open contempt. The same campaign must strike at Lucita as well and settle both accounts. The reckoning is personal and will demand your full attention."
 POD_gratiano_pursue_moncada_decision_effect_tt: "#bold Open the campaign against Moncada and Lucita.#!\nThe Cardinal's vigilance is roused and the reckoning begins. You are #Y committed to this campaign#! until both the Cardinal and the Prodigal Daughter are answered for; you cannot pursue another rival."
 POD_gratiano_pursue_moncada_launch_toast: "The reckoning with Cardinal Moncada begins."
 POD_gratiano_pursue_moncada_decision_tooltip: "Turn against Cardinal Moncada and the caged Lucita, and settle both accounts."
 POD_gratiano_pursue_moncada_decision_confirm: "Move Against the Cardinal"

 POD_gratiano_pursue_nahir_decision: "Move Against Nahir"
 POD_gratiano_pursue_nahir_decision_desc: "Nahir raised a prince of the Damned from the low streets of Algiers on a wager, only to be ruined by his success. He blames your fine talk for drawing him into the bet. You must either restore the elder's regard or end the grudge with a knife, a task that will demand your full attention."
 POD_gratiano_pursue_nahir_decision_effect_tt: "#bold Open the campaign against Nahir.#!\nThe elder is brought within reach. You remain #Y committed to this campaign#! until Nahir is a friend or a corpse; you cannot pursue another rival."
 POD_gratiano_pursue_nahir_launch_toast: "The matter of Nahir is taken in hand."
 POD_gratiano_pursue_nahir_decision_tooltip: "Win back the elder Nahir's regard or end his grudge."
 POD_gratiano_pursue_nahir_decision_confirm: "Move Against Nahir"

 POD_gratiano.0020.t: "The First Gathering"
 POD_gratiano.0020.desc: "They arrive singly or in pairs, each by a different street, into a hall whose shutters have not been opened in years. Wine is poured for propriety's sake, though nobody touches a cup. All have been passed over by an elder, their only common grievance.\n\nThey wait to hear why you summoned them. You can present the gathering as a discreet arrangement among ambitious Kindred, safe enough to discuss at supper. Or you can use older words and tell them whose world they inhabit while its owners sleep."
 POD_gratiano.0020.a: "A fellowship of opportunity."
 POD_gratiano.0020.a.tt: "#bold  The Creed of Opportunity.#!\nA creed for pragmatists. Every gathering yields less to the conspiracy and costs less of your standing at court. This choice is permanent."
 POD_gratiano.0020.b: "A conspiracy against the Eldest."
 POD_gratiano.0020.b.tt: "#bold  The Creed of the Eldest.#!\nA creed for zealots. Gatherings yield more to the conspiracy at a higher cost to your standing. This choice is permanent."

 POD_gratiano.0021.t: "The Lesson"
 POD_gratiano.0021.desc: "Every guest arrives on time, which tells you more than anything said in the room. You describe the great houses most will never enter: its riches, the debts between sires, the old names. The lesson concerns appetites and how one might satisfy them, allowing every listener to imagine that the empty seat is meant for them.\n\nBy the third hour they are arguing about their own elders without prompting. One has begun taking notes; you have not decided whether to permit it."
 POD_gratiano.0021.desc.eldest: "You speak of those who lay down in their tombs and still rule the world from them. The faithful lean in, eyes wide, as you name the debt owed to everyone still awake above them; blood.\n\nAfterward two remain to ask when the work will begin."
 POD_gratiano.0021.a: "Hold the full gathering."
 POD_gratiano.0021.a.tt: "#P +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_conspiracy_yield_value')|0] The Conspiracy#!\n#R [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_trust_loss_value')|0] Standing at court#!\nGive the full lesson before every attendee. A successful gathering may recruit a new face and advance the school's growth."
 POD_gratiano.0021.b: "Keep it at arm's length."
 POD_gratiano.0021.b.tt: "#bold A cautious gathering.#!\n#P +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_conspiracy_yield_half_value')|0] The Conspiracy#!\n#R [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_trust_loss_half_value')|0] Standing at court#!"
 POD_gratiano.0021.c: "This has outgrown the hall."
 POD_gratiano.0021.c.tt: "#bold Weigh raising the school to its next rank.#!\nA higher rank improves conspiracy yield and recruitment, but also increases standing loss and rumor risk.\n#P +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_conspiracy_yield_value')|0] The Conspiracy#!\n#R [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_trust_loss_value')|0] Standing at court#!\n"
 POD_gratiano.0021.d: "Raise one into the inner circle."
 POD_gratiano.0021.d.tt: "#bold Take one of the willing into your coterie.#!\n#P +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_conspiracy_yield_value')|0] The Conspiracy#!\n#R [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_trust_loss_value')|0] Standing at court#!\n"

 POD_gratiano.0022.t: "A Cousin Without Land"
 POD_gratiano.0022.desc: "Word of your little school has travelled beyond its shutters and brought someone to your gate. The landless stranger is younger than you and has no established house behind them.\n\nThey neither beg nor explain. They wait where you place them, studying who stands nearest the fire."
 POD_gratiano.0022.desc.intrigue: "Tonight's visitor guessed half your purpose before you spoke and carefully feigned surprise at the rest. They possess no land or house of note and show no embarrassment about it.\n\nThey already know which servants would take a bribe and which would report it, though no one noticed the questions. Asked what they expect in return, they allow you to name the first price."
 POD_gratiano.0022.desc.martial: "Strength determines station and tonight a stranger arrives who has never needed the reminder.\n\nThis one has ended more quarrels with steel than argument and does not flinch from the work that begins when talking fails. At rest, their hand stays near the hilt from long habit. You will learn whom they truly obey the first time you give them a target."
 POD_gratiano.0022.desc.learning: "An old scholar. They had spent decades reading dead tongues before their Embrace; now they study the shapes in the Abyss with the same patience. They appear to have chosen landlessness and to have come seeking a different reward.\n\nThey cannot leave a misquoted rite uncorrected, even when it is yours and witnesses are present. You set them a copied page of the commentary with two errors. They find the second before you take your seat."
 POD_gratiano.0022.desc.diplomacy: "You know this manner and have been charmed by it before, though you would never admit it. They pass through a crowded room with easy warmth, keeping their calculations well out of sight. Courts open to such creatures before anyone quite decides to trust them.\n\nTheir smile broadens with every discomfort and has not narrowed once since they arrived. They already know the name of every courtier who spoke to them tonight; two of those names reached you within the hour."
 POD_gratiano.0022.desc.stewardship: "Nothing about this one is ornamental. They counted the exits before choosing a place in your hall. They can move either gold or bodies through a city without drawing notice, and know where to leave the blame.\n\nThey speak plainly about wanting wealth and have already calculated what you would offer. While they wait, they keep both doors in view."
 POD_gratiano.0022.a: "Give them a place."
 POD_gratiano.0022.a.tt: "#P They join the outer circle.#!\nThey take a place in your court and stand among the rest at your gatherings. Under the Creed of the Eldest, such intakes come to the work as true believers more often than not."
 POD_gratiano.0022.b: "Not this one."
 POD_gratiano.0022.b.tt: "Send them back into the night. They drift back into the province and may yet turn up in some other hall. No benefit or cost follows."

 POD_gratiano.0023.t: "Too Many for the Room"
 POD_gratiano.0023.desc: "Your gatherings have settled into a routine. People know which nights they fall on without being told, and they defer to one another in an order you did not set and could not now rearrange without offending somebody who matters.\n\nIf the gathering grows any larger, it will stop being a private amusement and become something that will draw the court's attention. Tonight your steward asked again about opening the second room, making no effort to keep the question private."
 POD_gratiano.0023.a: "Let it grow."
 POD_gratiano.0023.a.tt: "#P The school grows into something larger.#!\nEach rank increases a gathering's conspiracy yield and recruitment chance, but also raises its standing cost and rumor risk. The first upgrade permanently grants the Shadow Academy's standing benefit; growth itself costs standing immediately."
 POD_gratiano.0023.b: "Not yet. Keep it small."

 POD_gratiano_academy_tier_1_name: "the Circle"
 POD_gratiano_academy_tier_2_name: "the School"
 POD_gratiano_academy_tier_3_name: "the Academy"

 POD_gratiano.0024.t: "Talk Over the Cups"
 POD_gratiano.0024.desc: "Too many met too often behind the same shutters, until someone talked over the cups or tried to impress a person who was never invited. The closed room itself drew attention.\n\nCourtiers have begun trading a name for the gatherings without yet understanding their purpose. They see the pattern behind your courtesies and have noticed how often you disappear. The court's interest stirs."
 POD_gratiano.0024.a: "Ignore the rumor."
 POD_gratiano.0024.a.tt: "#R [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_rumor_trust_loss_value')|0] Standing at court#!\nMake no answer and spend nothing. The whisper damages your standing, then fades without further action."
 POD_gratiano.0024.b: "Smother it in gold."
 POD_gratiano.0024.b.tt: "#R [GetPlayer.MakeScope.ScriptValue('POD_gratiano_academy_rumor_smothered_loss_value')|0] Standing at court#!\nPay courtiers who can suppress the tale. This halves the harm to your standing."

###### Coterie induction & loyalty tests ######

 POD_gratiano_induction_toast: "A Seat at the Innermost Table"
 POD_gratiano_induction_toast_tt: "They join your coterie, the inner circle bound to your cause. These are the companions who will climb the castle beside you when the time comes."

 POD_gratiano.0025.t: "Who Sits Closest"
 POD_gratiano.0025.desc: "The outer circle holds more names than you will ever need at once. The inner circle has only four chairs, reserved for those who will remain beside you when the long preparation ends.\n\nYou look first for a schemer who anticipates unspoken questions, then for a blade whose hand finds the hilt even in a quiet room. Sometimes one candidate offers both. A new chair has been placed at the table for your choice."
 POD_gratiano.0025.a: "I will have the schemer."
 POD_gratiano.0025.a.tt: "#bold Induct [gratiano_inductee_mind.GetFirstNameNoTooltip] into the coterie.#!\nThe sharpest mind in the outer circle is called to the innermost table."
 POD_gratiano.0025.b: "I will have the blade."
 POD_gratiano.0025.b.tt: "#bold Induct [gratiano_inductee_blade.GetFirstNameNoTooltip] into the coterie.#!\nThe deadliest hand in the outer circle is called to the innermost table."
 POD_gratiano.0025.c: "No one yet. The chair can wait."

 POD_gratiano.0026.t: "No Empty Chairs"
 POD_gratiano.0026.desc: "The last of them takes the fourth chair and draws it close. Four conspirators now share your innermost table, bound to your cause and accustomed to one another.\n\nTonight they speak freely to one another. No one glances toward the door. When you descend beneath the castle in Sicily, these are the Kindred who will follow."
 POD_gratiano.0026.a: "Let them see what we are."

 POD_gratiano.0027.t: "The Held Glance"
 POD_gratiano.0027.desc: "One of your people is wavering, and it shows in small courtesies. A glance lingers too long and deference is offered twice, as though the first payment went unnoticed. You have watched the same unease spread through other courts from the safe side of the room.\n\nTheir loyalty has weakened enough for others to notice. Given an hour before the right listener, [gratiano_waverer.GetSheHe] could expose the circle from memory alone."
 POD_gratiano.0027.a: "Remind them what I am."
 POD_gratiano.0027.c: "Cut them loose before they talk."
 POD_gratiano.0027.c.tt: "#R -3 The Conspiracy#!\nStrike them from the conspiracy altogether. You lose what they were worth to it. Anyone cut out of the inner circle leaves as your rival, and a freed conspirator who knows this much may still carry word to the court."

 POD_gratiano_overawe_success_message: "The doubter submits and remains in the circle."
 POD_gratiano_waverer_bolts_message: "The doubter bolts into the night and carries the circle's secrets away."

###### Word Reaches the Court & the Unwilling Conspirator ######

 POD_gratiano.0040.t: "What the Court Has Heard"
 POD_gratiano.0040.desc: "Reports reach the founder's court in the usual way, one whisper answering another. Someone has listed the names of those seen coming and going from Verona, or perhaps merely noted the traffic itself. At that court, suspicion is testimony enough.\n\nYou feel some of your old security leave with the report. At the high table, the pause before your name lasts a little longer while the courtesies remain precisely as warm."
 POD_gratiano.0040.a: "A scratch, nothing more."
 POD_gratiano.0040.a.tt: "#R Standing at court is diminished.#!\nMake no answer. The report damages your standing but draws no further response."
 POD_gratiano.0040.b: "Answer it with gifts."
 POD_gratiano.0040.b.tt: "#P +3 Standing at court#! for #Y 100 Prestige#!\nSend costly gifts to blunt the report and recover part of your lost standing."
 POD_gratiano.0040.c: "Press the one who talked."

 POD_gratiano_informant_silenced_message: "The informant is frightened into silence. No second report follows."
 POD_gratiano_informant_backfire_message: "The informant answers pressure with another, firmer report."

 POD_gratiano.0041.t: "The Unwilling Conspirator"
 POD_gratiano.0041.desc: "[recipient.GetFirstNameNoTooltip] chafes under your yoke. [recipient.GetSheHe|U] works in visible resentment and avoids your gaze, yet appears whenever summoned and misses no detail in the reports.\n\nFear is losing its hold on [recipient.GetHerHim]. If [recipient.GetSheHe] breaks free, the founder's court may soon know every name in the circle."
 POD_gratiano.0041.a: "Fear is enough."
 POD_gratiano.0041.a.tt: "Leave [recipient.GetHerHim] yoked and bitter. [recipient.GetSheHe|U] stays #R branded faithless#! and remains useful, though close to bolting."
 POD_gratiano.0041.b: "Pay them to stay."
 POD_gratiano.0041.b.tt: "#P [recipient.GetHerHis|U] loyalty is bought.#!\nPay enough to soften the resentment. The faithless mark is lifted, and [recipient.GetSheHe] comes to respect you or at least your coin."

###### Sell Out: the court beat & the escapee ######

 POD_gratiano.0042.t: "The Lesser Confession"
 POD_gratiano.0042.desc: "The court has convened over the name you gave it and now waits for you to speak. You laid before them a conspiracy of your own making. By surrendering one conspirator, you have kept their eyes from the rest. A clerk reads the charges in the flat voice reserved for tedious business while the accused stares at the floor.\n\nYou need only decide how far the punishment should run."
 POD_gratiano.0042.a: "Give them the whole of it."
 POD_gratiano.0042.a.tt: "#P Standing at court rises#! for the sacrifice, up to the limit of the court's confidence, and #R the conspiracy loses ground#!. The court sees to their end, though a desperate conspirator may still escape, knowing who betrayed them."
 POD_gratiano.0042.b: "Ask only for exile."
 POD_gratiano.0042.b.tt: "#bold A gentler verdict.#!\nA smaller rise in standing and no death; the conspirator is cast out rather than destroyed. An exile may nurse a grudge and carry it wherever they go."

 POD_gratiano_sellout_destroyed_message: "The court executes the conspirator before they can expose the circle."
 POD_gratiano_sellout_escaped_message: "The conspirator escapes before the court can act, knowing exactly whose testimony sent the court after them."
 POD_gratiano_sellout_exiled_message: "The court strips the conspirator of place and casts them into exile."
 POD_gratiano_sellout_survivors_tt: "#Y The circle takes note.#!\nThe surviving inner circle turns colder toward a leader who trades his own away, and some among the outer circle begin to consider leaving."

 POD_gratiano.0043.t: "The One Who Ran"
 POD_gratiano.0043.desc: "Weeks pass without anyone laying hands on [gratiano_sellout_target.GetFirstNameNoTooltip]. Reports arrive in pieces: a boat hired under a false name at a river town, then a household two days' ride away whose servants refuse to say who slept there.\n\nThe hold that kept them in your service failed somewhere on that road."
 POD_gratiano.0043.a: "Let them run."
 POD_gratiano.0043.a.tt: "#R A living enemy who knows too much.#!\nThe escapee becomes your rival and is lost to the conspiracy. Their testimony may still reach the court."

###### Decision: Curry Favor & the throne beat ######

 POD_gratiano_curry_favor_decision: "Curry Favor in Court of the Founder"
 POD_gratiano_curry_favor_decision_desc: "Descend to the founder's court and play the favored childe once more, offering flattery and measured deference beneath a courtier's smile. The audience costs prestige and dignity, but recovered standing can later be spent in pursuit of the seat."
 POD_gratiano_pay_court_effect_tt: "#P +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_pay_court_trust_gain_value')|0] Standing at court#!"

 POD_gratiano.0044.t: "The Long Audience"
 POD_gratiano.0044.desc: "The hall is black glass, and cold. At its center, the founder's presence weighs on the room while you play the childe without a flaw, bowing your head and measuring every word of praise.\n\nOnce during the audience, his voice enters your thoughts with terrible gentleness: #italic Patience becomes you, childe.#! You bow and keep the purpose that brought you here hidden."
 POD_gratiano.0044.a: "Words alone."
 POD_gratiano.0044.b: "A tribute besides."
 POD_gratiano.0044.b.tt: "#P +[GetPlayer.MakeScope.ScriptValue('POD_gratiano_pay_court_tribute_bonus_value')|0] Standing at court#!\nBack the praise with gold. The court warms to a generous supplicant."

###### Giovanni arc (0060-0078) ######

###### Giovanni milestones (0073-0075) ######

 POD_gratiano.0073.t: "In Nobody's Name"
 POD_gratiano.0073.desc: "The Venetian family now holds no land in its own name in Italy or along the Adriatic coast. Its business continues under other names, and tonight it matters little who drove them out.\n\nThe Giovanni remain active elsewhere. Their hold on Italy, however, is finished. A letter brings this news with no more ceremony than an account of ordinary trade."
 POD_gratiano.0073.a: "One name fewer between me and Sicily."
 POD_gratiano.0073.checklist_tt: "#P The Giovanni objective is complete.#!\nNo independent Giovanni holds a county in the Italian sphere or on the Adriatic shore."

 POD_gratiano.0074.t: "In Their Own Name Again"
 POD_gratiano.0074.desc_named: "The Giovanni do not stay dispossessed for long. [POD_gratiano_giovanni_blocker.GetTitledFirstNameNoTooltip] now holds an Italian county as an independent ruler. The household doors are open and the family's work has resumed with practiced ease. Your earlier settlement has been undone."
 POD_gratiano.0074.desc_crown: "No name comes with the word, only the fact: somewhere across the Adriatic a Giovanni once again answers to no liege. The family has returned to the waterways beyond your reach. Until you control that road, their ships will keep crossing under their own authority and the campaign remains unfinished."
 POD_gratiano.0074.a: "I settle it a second time."
 POD_gratiano.0074.reopen_tt: "#R The Giovanni objective is open once more.#!\nThe cleared mark is removed, and the road to the castle stays barred until no independent Giovanni holds a county in the Italian sphere or on the Adriatic shore."


###### The Necromancer King - intro & route hub (0060-0061) ######

 POD_gratiano.0060.t: "A Trade in Death"
 POD_gratiano.0060.desc: "Augustus Giovanni answers to no one, patriarch of a family that sells passage to the underworld and stores the bones of the mighty beside pepper and salt.\n\nHis kind call him an upstart, a word you know well. The Giovanni keep exact accounts; somewhere among them is the leverage that can break their patriarch."
 POD_gratiano.0060.desc_fallen: "Augustus Giovanni is gone, buried in the earth he sold passage through or cast down from the seat that made his name worth fearing. You spare him one evening's thought.\n\nThe Giovanni family business does not close its doors because the master's chair is empty. Giovanni houses remain across Italy and Dalmatia. Manifests still move with cargo no one questions. They stand on the ground you must clear before leaving Italy behind, so you summon every report your factors can provide."
 POD_gratiano.0060.a: "First I must find leverage."

 POD_gratiano.0061.t: "The Council in Verona"
 POD_gratiano.0061.desc: "Midnight in Verona. Wax runs down the candles as you study a map of the Veneto, with smaller marks toward Turin and Pisa.\n\nYou could fabricate a claim, bargain for the patriarch's withdrawal, or turn his own elders against him. Augustus himself can wait while you test the weaker holdings first. What you do not admit, even to the empty hall, is how long you have wanted this."
 POD_gratiano.0061.a: "Press a claim on the Veneto."
 POD_gratiano.0061.c: "Send an embassy. Buy his leaving."
 POD_gratiano.0061.d: "Draw up the accusation of parricide."
 POD_gratiano.0061.e: "Turn to Lucretia, the Countess of Turin."
 POD_gratiano.0061.f: "Petrus of Pisa hates his own sire."
 POD_gratiano.0061.g: "Not tonight. Let them think themselves safe."

###### Break-him: the claim (0062), the ruin war (0063) ######

 POD_gratiano.0062.t: "A Forged Compact"
 POD_gratiano.0062.desc: "There are forgers in Verona who can make a new document look old. For your coin, they will prepare a compact in which Augustus Giovanni grants you the Veneto in settlement of a debt. They have a sample of his seal. The parchment will be creased from years of handling, its gall-ink carefully faded.\n\nAugustus will deny the agreement. Among his rivals, you may find elders willing to recognize it, especially if they stand to profit from your rule. The forgers demand the full sum before cutting the seal and insist that you never visit the workshop again."
 POD_gratiano.0062.a: "Put his seal to it."
 POD_gratiano.0062.b: "Too dear for a lie."


###### Point-him-elsewhere: the embassy (0064), the answer (0065), the departure (0066) ######

 POD_gratiano.0064.t: "Terms for His Leaving"
 POD_gratiano.0064.desc: "Your letter to Augustus Giovanni carries the courtesy due between great houses and names a price for his withdrawal from Italy and the Istrian shore. Holdings outside of Italy remains his; those holdings are far from anything you want, and he will notice the concession.\n\nThe courier bears only the written figure. Augustus will decide according to his present needs, including any wars demanding his coin and every slight he remembers from earlier dealings."
 POD_gratiano.0064.a: "Send the embassy to the Veneto."
 POD_gratiano.0064.offer_tt: "#bold The price of the bargain:#! #Y [GetPlayer.MakeScope.ScriptValue('POD_gratiano_giovanni_bargain_cost_value')|0] gold#!, paid only if he accepts. A patriarch already branded before his own elders comes at half. One who has scorned you once comes at double."
 POD_gratiano.0064.sent_toast: "Your embassy rides for the Veneto."
 POD_gratiano.0064.b: "Not yet. Keep the gold."

 POD_gratiano.0065.t: "The Patriarch's Answer"
 POD_gratiano.0065.desc_yes: "The reply comes under three seals in a clerk's perfect hand, written on purple vellum. Augustus has weighed the Veneto against your coin and added a price for his dignity. 'Tell the Lasombra,' the letter ends in the patriarch's cramped script, 'that he buys only stone and water. Not what you lack; respect.'\n\nHe will take the gold, unmake his crown, and cross the mountains as soon as it is counted. What he surrenders passes immediately to the recipient you choose tonight."
 POD_gratiano.0065.desc_no: "The reply comes under a single seal, unsigned, on paper rather than vellum; the insult was drafted as carefully as any law. Augustus Giovanni does not sell Italy to Lasombra upstarts, and he sets that down in a single line of his own hand. 'The dead are not so easily moved. Ask them.'\n\nYou burn the letter. The embassy gained only his ire. Any later offer will be priced with full knowledge of how badly you wanted this one."
 POD_gratiano.0065.a: "Let the Prince of Venice take it up."
 POD_gratiano.0065.b: "I will take the seat."
 POD_gratiano.0065.c: "Then I will use other means."

 POD_gratiano.0066.t: "The Patriarch Goes East"
 POD_gratiano.0066.desc: "The Venetian family leaves the lagoon as its cargo does, by night and without ceremony. Long crates reach the water before the living; the household calls the retreat a passage. You paid dearly for that word.\n\nThe kingdom Augustus Giovanni made from his family name ends with his departure. His remaining lands lie inland, beyond salt water. The dead travel with him in roped crates while the lagoon returns to its ordinary trade."
 POD_gratiano.0066.a: "The Veneto is mine, and his crown is gone."

###### Expose-him: the evidence chain (0067-0070) ######

 POD_gratiano.0067.t: "A Case Against the Patriarch"
 POD_gratiano.0067.desc: "The Giovanni have enemies within their own clan. You intend to give those enemies a charge they can bring against Augustus: you have found hints that he like you plans to diablerize his own elder, Cappadocius, and place the clan under his family's rule.\n\nAn elder Cappadocian's testimony would carry more weight than your word. Drenis may agree to give an account of what she knows of the family. You would pay for the messengers and a discreet meeting, then have her words recorded under oath. Preparing the case will take time. Your scribes could instead produce letters in the Giovanni's name."
 POD_gratiano.0067.desc_no_witness: "You intend to accuse Augustus Giovanni of plotting to diablerize Cappadocius and place the clan under his family's rule. His enemies may welcome the accusation, but you still need evidence they can examine.\n\nDrenis has met Final Death, and you never obtained her testimony. Your scribes will have to supply the correspondence themselves. They must imitate the family's hands and seals closely enough to survive an elder's scrutiny."
 POD_gratiano.0067.a: "Arrange a meeting with Drenis."
 POD_gratiano.0067.witness_tt: "#bold Drenis's testimony is secured.#!\nPreparing the case takes 90 to 180 days. Her sworn account improves the chance that the evidence will withstand scrutiny."
 POD_gratiano.0067.b: "Have the letters forged."
 POD_gratiano.0067.forge_tt: "#Y Forged letters are being prepared.#!\nThe case will be ready in 30 to 60 days. Without sworn testimony, it is less likely to withstand scrutiny. Failure will damage your standing at the Lasombra court."

 POD_gratiano.0068.t: "Accusation of Parricide"
 POD_gratiano.0068.desc: "The papers are ready. You read them once more by candlelight, checking names and dates. Every claim must agree with the account offered to support it. If the elders find a contradiction, the accusation could turn against you. You press your seal into the wax."
 POD_gratiano.0068.a: "Send the papers to the Cappadocian elders."
 POD_gratiano.0068.success_toast: "The evidence withstands scrutiny. A hearing can now be sought."
 POD_gratiano.0068.fail_toast: "The case is discredited. Your own court suspects you of fabricating the charges."

 POD_gratiano.0069.t: "Before the Clan's Elders"
 POD_gratiano.0069.desc: "The elders receive you in a low room smelling of earth and cold incense. You lay the papers before them. One draws a candle closer and begins to read, stopping now and then to question you about a name or a passage.\n\nYou argue that Augustus means to diablerize his sire and rule the clan through the Giovanni. Their condemnation would make it harder for him to secure allies among the Cappadocians. You wait while the papers pass from hand to hand."
 POD_gratiano.0069.desc_no_court: "Your messengers return without securing a hearing. None of the Cappadocian rulers you hoped to approach remains in a position to receive the accusation. You put the sealed papers away. Augustus will face no judgment from them."
 POD_gratiano.0069.a: "Will you condemn him?"
 POD_gratiano.0069.b: "Keep the papers."
 POD_gratiano.0069.no_court_toast: "No suitable Cappadocian ruler is available to convene a hearing."

 POD_gratiano.0070.t: "The Patriarch Suspects"
 POD_gratiano.0070.desc: "The Cappadocian elders have condemned Augustus for plotting against his sire. Word of their judgment is reaching the courts where his family seeks favors and protection. He wants to know who brought the accusation before them.\n\nHis agents question the household servants and trace the letters that passed through their hands. You hear that he has begun questioning the dead as well."
 POD_gratiano.0070.a: "He still has to find me."
 POD_gratiano.0070.blamed_toast: "Augustus has traced the accusation to you. You have made an enemy of the patriarch."
 POD_gratiano.0070.unseen_toast: "Augustus blames the Cappadocian elders. Your involvement remains hidden."

###### Lucretia (0071) & Petrus (0072) support beats ######

 POD_gratiano.0071.t: "The Reckless Countess"
 POD_gratiano.0071.desc: "A Giovanni holds Turin, at the western edge of the ground you are counting. Lucretia was born into the Giovanni family four generations below Claudius. She began hearing voices while young, and her kin locked her in a cell. The undead of the house came for her anyway, quarrelling over which of them would claim so gifted an occultist. She later poisoned her parents in revenge.\n\nAmbrogino won that quarrel and now sends her after buried documents written in old tongues. The voices have never quieted. Between errands she governs the county and is always first through any door that might conceal an answer. The family has begun to wonder what drives her haste. Her kinship offers no protection from your designs."
 POD_gratiano.0071.a: "Press what I hold over her."
 POD_gratiano.0071.bent_toast: "Lucretia bends the knee. Turin answers to Verona."
 POD_gratiano.0071.defied_toast: "Lucretia refuses you, and sends word to her kin."
 POD_gratiano.0071.b: "Offer gold for her fealty."
 POD_gratiano.0071.gold_refused_toast: "Lucretia accepts the gold without yielding Turin."
 POD_gratiano.0071.c: "Have her killed."
 POD_gratiano.0071.d: "Leave Turin alone."

 POD_gratiano.0072.t: "The Wronged Patrician"
 POD_gratiano.0072.desc: "Pisa is held in the name of Petrus, the patriarch's own get. The house stopped calling him son about the year you first took an interest in it. He has been in the blood far longer than you and looks down at you without any effort.\n\nHe keeps Pisa and continues the traffic with the dead his father taught him but never praised. In a cellar under the harbour, he maintains the family rites. His loyalty to his sire is spent. Petrus would trade every promised inheritance for a single stone held in his own right."
 POD_gratiano.0072.a: "Send him after his sire. Pisa is mine."
 POD_gratiano.0072.b: "He knows what I hold over him."
 POD_gratiano.0072.bent_toast: "Petrus swears fealty. Pisa comes with him."
 POD_gratiano.0072.defied_toast: "Pisa will not kneel. Petrus counts you an enemy from tonight."
 POD_gratiano.0072.c: "Name his price and pay it."
 POD_gratiano.0072.gold_refused_toast: "The gold is taken. Petrus does not sell Pisa."
 POD_gratiano.0072.d: "Pisa can have a new prince."
 POD_gratiano.0072.e: "Leave Pisa untouched."

###### Giovanni blowback (0076/0077/0078) ######

 POD_gratiano.0076.t: "The Family Remembers"
 POD_gratiano.0076.desc: "Augustus Giovanni is dead and no crown remains to quarrel over. His family still considers your account open. They were a banking house long before they were a power and are used to settling private grievances on their own.\n\nRumors reach you first, describing salt, candle-smoke, and your name repeated over a bowl until something answered. A sealed blank letter follows. One relative has inherited the patriarch's grievance; you never see them again."
 POD_gratiano.0076.desc_heir: "The patriarch is ash, and the family filled the gap at once. A new master was confirmed within the house, and the barges left on the next tide without breaking schedule.\n\nYour name passed with the household property to a cousin who now treats it as a private charge. No demand accompanies it. This week, a boat docks at Verona's landing carrying no goods for sale."
 POD_gratiano.0076.a: "Let them come to Verona."

 POD_gratiano.0077.t: "Whispers of Ossium"
 POD_gratiano.0077.desc: "The case did not survive scrutiny. Word travels back along the road. The elder Cappadocians declare your articles counterfeit, and your cousins repeat the verdict with more pleasure than the Venetians ever took in it.\n\nIf the patriarch still walks, the tale leaves him vindicated and you disgraced. Courtiers now mock the incompetence of the forgery as readily as the crime itself."
 POD_gratiano.0077.a: "I trusted the wrong forger."

 POD_gratiano.0078.t: "A Small Entertainment"
 POD_gratiano.0078.desc: "Augustus circulates the exchange beyond Venice. The story of your offer travels along the family's routes with the patriarch's own gloss. Before the season is out, courts with no previous reason to name you are repeating an account of you begging at the Veneto's door and receiving a single-line refusal.\n\nThe tale gives those courts a convenient insult for you. Two of your courtiers have already heard it and chosen not to repeat it within your hearing."
 POD_gratiano.0078.a: "Let him enjoy the telling of it."

###### The condemned-conspirator brand (evidence-chain modifier) ######

 POD_gratiano_condemned_conspirator_modifier: "Condemned Conspirator"
 POD_gratiano_condemned_conspirator_modifier_desc: "Branded before the elder Cappadocians as a would-be parricide for plotting to devour Cappadocius and usurp the clan. Among the old blood, no crime inspires greater disgust. His own kind now trust him less, and Cappadocians speak his name with dread."

###### Ventrue arc (0090-0114) & Shadow War ######

###### Ventrue progress notification ######

 POD_gratiano_ventrue_progress_toast: "One fewer Ventrue prince stands between Verona and the seat. [GetPlayer.MakeScope.ScriptValue('POD_gratiano_ventrue_blockers_value')|0] remain."

###### Shadow War casus belli ######

 POD_GRATIANO_SHADOW_WAR_WAR_NAME: "Shadow War against [DEFENDER.GetShortUINameNotMe]"
 POD_GRATIANO_SHADOW_WAR_CB_NAME: "Shadow War against [DEFENDER.GetShortUINameNotMe]"
 msg_POD_gratiano_shadow_war_invalidated: "The [war.GetName] has ended: [defender.GetShortUIName] no longer stands as an independent Ventrue prince."
 POD_gratiano_shadow_war_victory_desc_defender: "[attacker.GetShortUIName|U] forces you to kneel. Your crowns and realm remain entire beneath Verona's shadow; where you once stood free, you now serve as a vassal."
 POD_gratiano_shadow_war_victory_desc: "[defender.GetShortUIName|U] bends the knee to [attacker.GetShortUIName]. The crowns and realm remain whole beneath Verona's hand; a former peer now serves as a vassal."
 POD_gratiano_shadow_war_white_peace_desc: "The shadow war ends without a victor. [defender.GetShortUIName|U] keeps [defender.GetHerHis] seat, and the contest resumes."
 POD_gratiano_shadow_war_defeat_desc: "[defender.GetShortUIName|U] throws off Verona's reach and keeps [defender.GetHerHis] realm entire. The shadow war is lost."
 POD_gratiano_shadow_war_cooldown_block: "Verona has waged no Shadow War these past five years. The clan of kings must be given time to lower its guard between campaigns."

###### The Shadow War - opener (0090) & the recurring hub (0091) ######

 POD_gratiano.0090.t: "The Clan of Kings"
 POD_gratiano.0090.desc: "The Giovanni reckon in coin and in debts owed. For the clan of kings, rule is an inherited right, supported by charters older than Charlemagne.\n\nFabrizio Ulfila holds Lombardy, and they call him the Little Wolf. He has a grudge against the Church and eternity to settle it in. Titus keeps Aquileia and the Friuli, and still signs his name in service to a Republic a thousand years dead. Their cousins hold the seats between, every one of them certain that the crown belongs to a Ventrue. They cannot be bought, and shame does not move them. A prince sworn to you, though, is a rival no longer, and tonight you open the #bold Shadow War#!, to be settled one oath at a time."
 POD_gratiano.0090.desc_fallen: "One of the northern princes is out of the reckoning, dead or sworn to somebody else, and the clan has already closed the gap. A vacant seat sends clerks to the rolls until nobody can dispute the heir; a changed liege leaves the letters going out in the same hand as before. That is the difficulty with the clan of kings. The claim passes to the next man before the ash is cold.\n\nAn oath travels with the prince. Sworn to you, he keeps every stone of his realm and creates no vacancy for an heir to fill. So let the war be quiet and long, taken one name at a time."
 POD_gratiano.0090.a: "The clan of kings will learn a new liege."
 POD_gratiano.0090.board_tt: "#bold The Shadow War is open.#!\n#Y [GetPlayer.MakeScope.ScriptValue('POD_gratiano_ventrue_blockers_value')|0] Ventrue princes#! hold independent seats in the Italian sphere. You may now declare the #bold Shadow War#! on any of them who has not made themself a king. It ends with the prince doing homage to Verona rather than meeting Final Death, and vassalization clears the objective as surely as death does."

 POD_gratiano.0091.t: "The Long Game"
 POD_gratiano.0091.desc: "The clan will not fall in a season, and haste has never been your vice. News and influence reach you slowly, usually in writing: a claim pressed again in impeccable form before a court resolved not to hear it, or a toll dispute entering its fortieth year while both parties expect to outlive the other. In the north, a prince composes careful letters to his cousins about you.\n\nWar is one instrument among several. These princes are older than your life and unlife together, and age has left papers behind in every court they touched. The useful line will be buried somewhere in those records. Where do you press tonight?"
 POD_gratiano.0091.a: "Count the crowns still standing."
 POD_gratiano.0091.b: "Livia the Advocate. Learn what Ravenna keeps."
 POD_gratiano.0091.c: "Rome. Take the measure of the Pontifex."
 POD_gratiano.0091.d: "Let it grind. I have the years."
 POD_gratiano.0091.board_tt: "#Y [GetPlayer.MakeScope.ScriptValue('POD_gratiano_ventrue_blockers_value')|0] Ventrue princes#! still hold independent seats in the Italian sphere."

###### Shadow War skirmishes (0092 strike, 0093 retaliation) ######

 POD_gratiano.0092.t: "A Loose Thread"
 POD_gratiano.0092.desc: "This war is fought in chanceries. Every claim these princes hold rests on something written down, and what is written can be copied, and quietly corrected. A steward keeps his accounts badly. Somewhere a charter forgotten in a Veronese sacristy turns out to bear on a county three hundred miles off.\n\nYour people have found a flaw in one prince's title, and it can be exploited tonight without mustering a single man. He can exploit it too, and he has more hands in that city than you do."
 POD_gratiano.0092.a: "Exploit it, and press for the claim"
 POD_gratiano.0092.claim_toast: "The claim against the prince is yours to press."
 POD_gratiano.0092.exposed_toast: "Your people are traced back to Verona. The prince knows whose hand it was."
 POD_gratiano.0092.b: "Watch a while longer. Do nothing yet."
 POD_gratiano.0092.c: "Let it pass unremarked"

 POD_gratiano.0093.t: "Traced to Verona"
 POD_gratiano.0093.desc: "The prince answers before the season is out, and answers in kind. A factor of yours is taken up on a charge nobody troubles to make plausible. Two others have sent no word in a fortnight. The house they used in the border town stands open, and nobody on the street admits to knowing who rented it.\n\nCoin would buy the survivors back before any of them is put to the question, and coin spent that way leaves no story behind it. Or you leave them where they are, and let the story travel."
 POD_gratiano.0093.a: "Buy them back, and quietly."
 POD_gratiano.0093.b: "Cut them loose. Coin is worth more."
 POD_gratiano.0093.b.tt: "#R -5 Standing at court#!\nYour people are left where they are. You spend no gold, and the court hears how Verona was caught reaching into another prince's house."

###### Shadow War aftermath (0095) ######

 POD_gratiano.0095.t: "A Prince Bends the Knee"
 POD_gratiano.0095.desc: "[defender.GetTitledFirstNameNoTooltip] kneels, sets both hands between yours, and swears in a voice pitched to reach the back of the hall, so that no witness can say afterwards that a single word of it was out of order. Nothing is surrendered that anyone could name aloud, and that is how Ventrue halls will tell it.\n\nOne fewer of the clan of kings watches the empty seat beneath the castle as though a Ventrue were owed it. The rest will resent both the oath and the example."
 POD_gratiano.0095.desc_ephor: "[defender.GetTitledFirstNameNoTooltip] swears, keeps every title and every vassal, and holds all of it from you now. That part is simple.\n\nThe complication is the Ephorate. The prince sits among the elders who settle what the clan of kings may and may not do, and nothing in their rolls covers one of their own doing homage to a Lasombra. They will find a precedent, or invent one and call it ancient. Until they do, the oath stands as sworn to you, before witnesses, in a form not one of that body can call irregular."
 POD_gratiano.0095.a: "One more crown answers to Verona"
 POD_gratiano.0095.remaining_tt: "#P +5 The Conspiracy#!\nA prince made to kneel is the best argument you have with anyone still deciding whether to say yes. #Y [GetPlayer.MakeScope.ScriptValue('POD_gratiano_ventrue_blockers_value')|0] Ventrue princes#! still hold independent seats in the Italian sphere."

###### Ventrue leverage - Livia the Advocate (0096) ######

 POD_gratiano.0096.t: "Her Word for It"
 POD_gratiano.0096.desc: "Livia da Ravenna is called Rome's Advocate, and nobody cites the old covenants more readily or follows them more strictly. What she is arguing back into existence, letter by letter, is Rome itself, with Ravenna at its head and your city among the provinces yet to be convinced.\n\nOne night she does not argue. When the Lombards took the city, Aristophokles was already dying, and she drank him to the last drop. She has always said he gave her leave. His own coterie, she adds, had put him on that floor to begin with, and she spent the next hundred years easing every one of them out of Ravenna. They have kept the grievance alive, and one of them holds a different version of that night, unsworn and so far unbought."
 POD_gratiano.0096.a: "Pay for the sworn version."
 POD_gratiano.0096.reveal_tt: "#bold The Advocate's sin is yours to hold.#!\nOne of the exiles swears to it, and Livia's diablerie is a secret you now know. Two things can be done with it: press her for an oath of fealty, or say it aloud where her own Eternal Senate keeps the law that names it a crime."
 POD_gratiano.0096.b: "Press her with it. Ravenna can swear."
 POD_gratiano.0096.bent_toast: "Rome's Advocate weighs the sworn version against everything she has spent centuries arguing for, and does homage. Ravenna keeps its crown and holds it from you now."
 POD_gratiano.0096.defied_toast: "The Advocate hears you out, then invites you to say it anywhere you please. She will answer the charge when a peer brings it, and she no longer counts you as one."
 POD_gratiano.0096.c: "Burn her. Let the Senate hear it."
 POD_gratiano.0096.d: "Not tonight. Let her argue on."

###### Ventrue leverage - Camilla the Pontifex (0097) ######

 POD_gratiano.0097.t: "The Roman Question"
 POD_gratiano.0097.desc: "Camilla is awake. The Pontifex Maximus of the Damned gave the order that ended Carthage and taught the clans to keep the herd blind, then slept through the whole Long Night. Since his waking the courts have gone back to using his titles without being asked twice.\n\nRome has whispered for a thousand years that he took his sire's throne by diablerie, usually over wine and never under oath. Proof would change the accusation, if anyone can still make him fear it."
 POD_gratiano.0097.a: "Put a price on the proof."
 POD_gratiano.0097.reveal_tt: "#bold The Pontifex's sin is yours to hold.#!\nYou know Camilla's diablerie now, though it offers little purchase against blood this old. Press him for an oath, or make the accusation public and learn whether even his name can survive it."
 POD_gratiano.0097.b: "Show him the proof. Ask Rome to swear."
 POD_gratiano.0097.bent_toast: "Against all expectation, the Pontifex reads the proof through twice and gives his oath. He keeps every title he woke to, and swears them to Verona."
 POD_gratiano.0097.defied_toast: "The Pontifex asks to be told who you are, then dismisses the charge. He remembers the name. Rome now treats Verona as an enemy."
 POD_gratiano.0097.c: "Make the accusation public."
 POD_gratiano.0097.d: "Weigh Rome before I reach for it."
 POD_gratiano.0097.threat_tt: "#X The Pontifex is no ordinary prince.#!\nCamilla is vampire from ancient Rome, awake this past year and answering to no one. Threats of disclosure rarely move one of such age. The #bold Shadow War#! offers the surer road: grind Rome down over years until its crown is held from you. Otherwise, leave him until the rest have sworn."
 POD_gratiano.0097.e: "Rome has kept a thousand years. It can keep."

###### Ventrue milestones & blowback (0099/0103/0104) ######

 POD_gratiano.0103.t: "Italy Without Kings"
 POD_gratiano.0103.desc_bent: "It is finished without a death. Not one of the great names went into the ground for it, and from Novara to Friuli and south to the Tiber every seat a Ventrue still holds is held from somebody else. The courts have spent the season working out the new order of precedence, and not one of those princes gained by it.\n\nThey will go on saying, in your hearing and out of it, that the empty seat beneath the castle belongs to their clan by right of blood. Let them say it. Every claimant now needs a liege's leave to act, which settles the practical question."
 POD_gratiano.0103.desc_mixed: "The ending will not fit a clean account. Some of the clan of kings looked plainly at the choice before them and swore. Others are spoken of in the past tense, and the clan may blame you for those deaths. Between the Alps and the Tiber there is no Ventrue left who answers for a crown of their own.\n\nThose who swore invoke precedent before whoever holds their oath, correctly and at length, as though the recitation were a kind of resistance. The dead are no longer named at table, and their seats were filled inside the year."
 POD_gratiano.0103.desc_dead: "The work ends with three princes dead. Fabrizio the Little Wolf is ash, as are Rome's Advocate in Ravenna and the Pontifex Maximus, who had outlasted every enemy Rome ever gave him until this one. The crowns they wore sit on heads that were nobody's first choice.\n\nHow much of it was your own hand is a question nobody left in Italy is in a position to put. The clan will weigh the evidence properly, in the order the precedents require, and arrive at the answer it held before it began. What is left of that clan is outside Italy, where the news is still arriving."
 POD_gratiano.0103.desc_fabrizio_note: "#z Fabrizio Ulfila is gone, and the Eternal Cardinal he meant to become goes into the ground with him. The Ecclesiasticals will put another of their own to work on the Church in Rome soon enough. Whatever shelter Ulfila's hand would have given Italy in the years coming, no one will now extend it.#!"
 POD_gratiano.0103.a: "The clan of kings is answered."
 POD_gratiano.0103.checklist_tt: "#P The Ventrue objective is complete.#!\nNo independent Ventrue holds a seat in the Italian sphere. The story checklist marks it done."

 POD_gratiano.0104.t: "They Do Not Stay Down"
 POD_gratiano.0104.desc_named: "The clan of kings leaves no Italian vacancy uncontested. The peninsula had stood clear of independent Ventrue. Now [POD_gratiano_ventrue_blocker.GetTitledFirstNameNoTooltip] holds land there, owing homage to no one and least of all to you.\n\nThe word reaches Verona in the register of a court roll, entered between a tithe dispute and a grant of pasture, as though it were the smallest business of the season. Clerks are already copying it into further rolls; in time, it will be cited as precedent."
 POD_gratiano.0104.desc: "A Ventrue is landed in the peninsula again, independent, and no one thought to ask your leave. You learn which court only slowly, the way you learn anything men would rather you did not hear: a courier's aside, a rent paid over to a new lord.\n\nThe clan of kings does not concede that the ground was ever yours to take. It resumes where it left off, on a reckoning of the years in which the interval counts for nothing and the charters run unbroken. The question you had closed is read out again in your own hall, and everyone in it watches to see what you do about it."
 POD_gratiano.0104.a: "Then I unseat them again."
 POD_gratiano.0104.reopen_tt: "#R The Ventrue objective is open once more.#!\nThe cleared mark is removed. An independent Ventrue holds land in the Italian sphere again, and your road to the castle stays barred until none does."

 POD_gratiano.0099.t: "The Line Remembers"
 POD_gratiano.0099.desc: "The clan of kings keeps its injuries the way it keeps everything else, by precedent and forever. Somewhere outside the Italian crowns a Ventrue has had the peninsula's names read out, and has counted how many of those endings lie within a week's ride of Verona. Whose hand it was does not come into it. An injury to one of the blood stands against the whole line, and the line is old enough to be patient about the remedy.\n\nNo herald comes, and no claim is entered anywhere you could answer it. Your name simply goes onto a roll you will never be shown, in a hand that has done this before, and nothing about the night looks any different."
 POD_gratiano.0099.a: "Let them come. I have unmade kings."

###### MONCADA & LUCITA ARC (0115-0128) ######

###### Rival modifiers ######

 POD_gratiano_cardinal_vigilance_modifier: "Cardinal's Vigilance"
 POD_gratiano_cardinal_vigilance_modifier_desc: "The Cardinal of Aragon is old and forewarned. Schemes against him founder on centuries of patient caution until the sire who made him is turned against him."
 POD_gratiano_iberian_reprisals_modifier: "Iberian Reprisals"
 POD_gratiano_iberian_reprisals_modifier_desc: "The de Ruiz agents blame you for the Cardinal's death and press at your every intrigue from the south."
 POD_gratiano_nahir_hunted_modifier: "Hunted by Nahir"
 POD_gratiano_nahir_hunted_modifier_desc: "An elder of the fifth generation has turned his art against you to settle a long-held grudge. While the hunt stands, schemes against you succeed more often and your stress mounts faster."

###### Moncada & Lucita opener + the caged fizzle (0115, 0116) ######

 POD_gratiano.0115.t: "The Cardinal and the Cage"
 POD_gratiano.0115.desc: "Ambrosio Luis Moncada was Archbishop of Madrid in life and never set the office down. He still keeps the canonical hours, and letters of recommendation arrive before anyone thinks to request them. He means every line. Of the powers you have set yourself against, his is the one that has never had to issue a threat, because so much of Christian Iberia is already waiting on him.\n\nSilvester de Ruiz embraced him, and Iberia has learned since to write to Madrid first. What he grants he can recall, even from his own childe. He calls the arrangement patronage; Lucita might name it otherwise. Every road into Iberia passes through Moncada."
 POD_gratiano.0115.a: "I want what the Cardinal has buried."
 POD_gratiano.0115.b: "Show Silvester what he made."
 POD_gratiano.0115.c: "The daughter first."

 POD_gratiano.0116.t: "The Blade That Finds No Throat"
 POD_gratiano.0116.a: "The Cardinal first, one way or another."
 POD_gratiano.0116.desc: "Whatever the Prodigal Daughter holds, she holds in her own name, and she owes Madrid nothing that could be written down. That ought to put her within reach.\n\nYour blade returned clean because it never found her. A man you bought in her household remembered an older promise he could not break. She appears unguarded, yet every approach is watched by someone in the Cardinal's debt. Lucita sees the whole arrangement and knows she cannot cut through it."
 POD_gratiano_caged_rule_tt: "#X While Moncada's protection stands, Lucita cannot be touched.#!\nThe [GetModifier('caged_lucita_modifier').GetNameWithTooltip] surrounding the Prodigal Daughter turns attempts aside. Kill Moncada, or coerce him into withdrawing his protection, before Lucita can be easily reached."

###### The hook-building mini-chain on Moncada (0117, 0118) ######

 POD_gratiano.0117.t: "The Blood He Climbed"
 POD_gratiano.0117.desc: "The Cardinal pays his debts and keeps his conscience in order, leaving little to use against him.\n\nHis blood is another matter. He stands at the same remove from Caine as the sire who made him, a strength Embrace could not have given him. Among the Lasombra that is no scandal by itself. The Courts of Blood have granted such petitions before and honored what came of them. What you want is the record of his leave, and whether one was ever written."
 POD_gratiano.0117.a: "Follow the rumors around that old death."
# Shared standing-risk warning for probes and coercion.
 POD_gratiano_probe_standing_risk_tt: "#Y Risk: a botched attempt is heard at the high table and costs standing.#!"
 POD_gratiano.0117.a.success: "The rumors come back consistent. Moncada emerged stronger from an elder's death, and the accounts conflict over who gave leave or whether any was given at all. A lie in that old story has begun to show."
 POD_gratiano.0117.a.failure: "Your questions travel farther than you sent them. Someone has spent a long time tending the silence around that death, and now that someone knows a question has been asked out of Verona. Within the month the trail is cold and your sources are nowhere to be found."
 POD_gratiano.0117.b: "Search the Courts of Blood for his leave."
 POD_gratiano.0117.b.success: "The Courts of Blood hold their judgments close, yet a patient reader finds the year the record will not account for. The sequence of petitions runs cleanly on either side, with no judgment covering the killing that lifted Moncada's blood. Whether removed or never made, the missing record serves you."
 POD_gratiano.0117.b.failure: "The Courts of Blood do not open their judgments to satisfy you. Your investigation finds little before a clerk begins a list of his own, in a small clean script, of everyone who has been asking."
 POD_gratiano.0117.toast.probing: "The proof against the Cardinal is being gathered."
 POD_gratiano.0117.toast.botched: "Word of the question reaches Madrid, and the high table hears it too."
 POD_gratiano.0117.c: "Let it lie."

 POD_gratiano.0118.t: "Proof He Cannot Dismiss"
 POD_gratiano.0118.desc: "The proof reaches you piecemeal. Testimony no longer matches a date Madrid has already moved, and the Courts hold no judgment authorizing the killing. The evidence carries enough weight to force an answer Moncada cannot afford, even if open court would not convict him.\n\nThe Cardinal's own belief makes the evidence valuable. A man who prizes his righteousness cannot be seen, by his clan or by his God, drinking the blood of his betters without leave. You need show him only a corner of it and choose your hour."
 POD_gratiano.0118.a: "Hold it against a better hour."
 POD_gratiano.0118.b: "Press him now, and name the price."

###### Route (a): coerced withdrawal + the Lucita duels (0119-0122, 0126) ######

 POD_gratiano.0119.t: "The Letter to Madrid"
 POD_gratiano.0119.desc: "The letter is written and sealed. It will go to Madrid unsigned. Its courtesies run a full page before the demand: Moncada must abandon Lucita.\n\nThe Cardinal is to call off his messengers and let the quiet understanding that any move against her is a quarrel with Madrid lapse, in return for what you hold over him. Of all the obligations Moncada keeps, she is the one he has never learned to hide, and he did not climb so high by dying for what he loves. The sealed letter waits for your decision."
 POD_gratiano.0119.a: "Send it. He gives her up."
 POD_gratiano_weak_hook_coercion_tt: "#R [GetPlayer.MakeScope.ScriptValue('POD_gratiano_weak_hook_coercion_trust_value')|0] Standing at court#!\nThe hook is a weak one, and forcing it is ugly work. The court will hear how ugly it got, and your standing pays the price."
 POD_gratiano.0119.b: "Hold the letter."
 POD_gratiano.0119.toast: "The Cardinal yields. He removes his protection."
 POD_gratiano_cage_broken_tt: "#Y The Cardinal's protection is withdrawn.#!\nMoncada's last letter on the matter is a single line in his own hand: 'You believe you have freed her. May God forgive you for what you have loosed.' The [GetModifier('caged_lucita_modifier').GetNameWithTooltip] is removed, and the Prodigal Daughter stands beyond her sire's protection, free to answer the vampire who used her name as leverage."

 POD_gratiano.0120.t: "The Doors Stop Opening"
 POD_gratiano.0120.desc: "Madrid keeps its bargains the way it keeps everything else, quietly. No letter tells Lucita what has changed. She reads it in doors that no longer open on her name, and in the new carelessness of men who were careful with her before. Then she learns whose demand bought the change. You did not free her. You traded her, in a bargain no one thought to discuss with her first.\n\nShe sends no thanks. The challenge is in her own hand, one line and no greeting: 'You bought my freedom because it suited you. Now learn what you bought.'"
 POD_gratiano.0120.a: "Then name the place."
 POD_gratiano.0120.b: "I will not be summoned"

 POD_gratiano.0121.t: "The Prodigal Daughter's Answer"
 POD_gratiano.0121.desc: "The hall is cleared. The household sent out. She comes alone and on time, which is its own kind of contempt, and she does not once look at the seat at the head of the room.\n\nYour blood stands three generations closer to Caine than hers. She has never once fought as though that mattered, and the men who taught her the sword are all dead, while she is not. She squares to you without ceremony. Somewhere past the doorway a candle goes out, and neither of you turns to see which of you did it."
 POD_gratiano.0121.a: "Let it be settled here."
 POD_gratiano.0121.success: "The Prodigal Daughter is destroyed"
 POD_gratiano.0121.failure: "You fall to the Prodigal Daughter."
 POD_gratiano.0121.success.desc: "It is closer than you will ever say aloud. She is faster than you and better taught, and she came to punish you where you came only to finish. What is left of the Prodigal Daughter goes out in a cask the household will not check. When the hall is empty you take the seat she would not look at, and sit in it a while."
 POD_gratiano.0121.failure.desc: "You have the reach and the older blood, and neither of them helps. Every year she spent under a hand that called itself patronage comes due in the space of a breath, and it is not her blood on the floor when it stops. She takes her answer in full. She steps over you where you lie and is gone before anyone thinks to call the household back in."

 POD_gratiano.0122.t: "The Unleashed Daughter"
 POD_gratiano.0122.desc: "Whatever the Cardinal was to her, and it was never a simple thing, he is ash now, and she is no longer anyone's piece to move. Her grief has turned outward. She has been asking after everyone who stood near her sire's fall, and your name is on that list whether or not you ever earned it.\n\nShe answers no summons and sends no word ahead. Finding her costs a fortnight of paid mouths and one letter that should never have been written, and at the end of it she is waiting in a place of her own choosing to see what you have come to say."
 POD_gratiano.0122.a: "I came a long way for this."
 POD_gratiano.0122.success: "The Unleashed Daughter is destroyed"
 POD_gratiano.0122.success.desc: "Nothing about her is easier for being free. The fight costs more than it was worth, and near the end certainty deserts you. At last she falls, the anger leaving her face as death takes her. Sire and childe are both gone, though only one died by your hand. Iberia will have the news from a dozen mouths before you have washed."
 POD_gratiano.0122.failure: "You fall to the Unleashed Daughter."
 POD_gratiano.0122.failure.desc: "She fights without restraint. Lucita's speed leaves you no chance to recover, and whatever she felt for Moncada, his death is hers to answer. She takes payment in your blood without hurry or a word, then leaves the doors standing open behind her."

 POD_gratiano.0126.t: "Nothing Holds Her Now"
 POD_gratiano.0126.desc: "Word reaches you from Madrid late and secondhand. The Cardinal is dead, and who did it is already in dispute.\n\nLucita first notices the change when doors stop opening at her name. The letters of recommendation cease, and no one asks where she means to travel because nobody is paid to know. Her cage depended on a favor renewed month by month; the hand that paid for it is ash.\n\nAs Lucita begins to move again, your war with her resumes."
 POD_gratiano.0126.desc.reoffer: "She has not stopped. Reports reach Verona in fragments: a burned haven in Navarre and a court in the Languedoc that will not name its last guest. The accounts disagree even over whether she wept or laughed along the road.\n\nTime has not cooled her rage, and she has used it to put the names behind her sire's fall in order. Yours is among them. The matter can be settled this season, or she can run another two years and you can weigh it again."
 POD_gratiano.0126.a: "Meet her now, and finish it."
 POD_gratiano.0126.b: "She can run a while yet."

###### Route (b): the Silvester angle + the Cardinal's counterstroke (0123-0125) ######

 POD_gratiano.0123.t: "The Lesser Half"
 POD_gratiano.0123.desc.intro: "The Cardinal's vulnerability lies in the man who made him. Silvester de Ruiz raised Ambrosio Moncada out of Castile and allowed his childe unusual freedom. Moncada turned that freedom into power of his own. When they share a room, attention settles on the childe first."
 POD_gratiano.0123.desc.diarchy: "\n\nThey rule Iberia as two kings in all but name, and the balance between them is shifting. Silvester has the older name, while Moncada commands the ear of every priest between Madrid and Rome. Letters once sent to Burgos for a decision now go to Madrid first. Silvester has begun to notice what it costs him to ask his own childe for anything. The right question, put in the right company, could turn that discomfort into grievance."
 POD_gratiano.0123.desc.shame: "\n\nWhatever understanding once stood between them has worn thin with the decades. Silvester remains the sire, yet Moncada's name travels farther every year. Say aloud, before the right witnesses, how much of Iberia now answers the childe first. Silvester will resent the humiliation long after the witnesses leave."
 POD_gratiano.0123.a: "Ask him whose name Castile says first."
 POD_gratiano.0123.a.success: "Silvester listens without interruption or assent. The scarred face remains still except for a brief, unmistakable calculation."
 POD_gratiano.0123.a.failure: "He hears you out to the end. That night, very quietly, he writes to Madrid."
 POD_gratiano.0123.b: "Not this way. He is still a soldier."
 POD_gratiano.0123.toast.listening: "Silvester listens. He begins to watch the Cardinal as a rival."
 POD_gratiano.0123.toast.warned: "Silvester warns his childe. The Cardinal knows who has been asking after him."

 POD_gratiano.0124.t: "The Sire's Turning"
 POD_gratiano.0124.desc: "Silvester has resisted doubt because every fault in Moncada reflects upon the maker.\n\nHe confirmed Moncada in Madrid, the see his childe had held in life, then gave him Cantabria on top of it. Silvester called that generosity. Your people have spent a season giving the arrangement an uglier name, and now he counts how much of Iberia answers the childe before it answers the sire. When Silvester finally moves, the caution that turned aside every quieter hand goes with him. His own maker clears the way to the Cardinal."
 POD_gratiano.0124.a: "Let the sire finish what he made."
 POD_gratiano_vigilance_broken_tt: "#Y The Cardinal's vigilance is broken.#!\nSilvester's turning strips the [GetModifier('POD_gratiano_cardinal_vigilance_modifier').GetNameWithTooltip] from Moncada, and the sire moves against the childe. Murder and diablerie schemes against the Cardinal now run at their ordinary odds."

 POD_gratiano.0125.t: "Answered with a Blessing"
 POD_gratiano.0125.desc: "Perhaps your man was clumsy. Ambrosio Moncada was hearing confessions in Castile while you still drew mortal breath, and he answers through favors quietly withdrawn, each rebuke wrapped in a blessing.\n\nA priest who wrote to you every month is suddenly much occupied with prayer, and two families recall their sons from Verona for reasons of health. What you did to your Italian brethren for the sake of the Emperor's court is repeated in the right ear, in Latin, with sorrow. By the week's end three of your own have asked leave to travel."
 POD_gratiano.0125.a: "Bear it, and show him nothing."

###### Completion + de Ruiz blowback (0127, 0128) ######

 POD_gratiano_duel_unsettled_toast: "The matter is unsettled"
 POD_gratiano_duel_unsettled_tt: "Neither of you finishes it. You break apart with nothing decided between you, and the question remains."
 POD_gratiano_moncada_done_toast: "The Cardinal and the Prodigal Daughter are ash."

 POD_gratiano.0127.t: "The Cardinal's Clients"
 POD_gratiano.0127.desc: "Madrid has a vacancy and no body to bury. The clients the Cardinal spent the better part of a century placing in useful offices did not go with him.\n\nPriests who hold their livings by his word and childer who owe him rather more than that cast about for a hand to blame, and settle on yours. Fulgencio d'Idalia, Moncada's own childe, gathers the remnant for a campaign of reprisal. His methods are cruder than his sire's, and no less persistent."
 POD_gratiano.0127.a: "I have answered elders before this."


###### NAHIR ARC (0135-0149) ######

###### Nahir activation + first audience (0135, 0136) ######

 POD_gratiano.0135.t: "The Elder Who Bet on Algiers"
 POD_gratiano.0135.desc: "Nahir is of the fifth generation, and watched a thousand years pass before you drew breath.\n\nAt a gathering in Algiers you praised noble blood as the only stock worth the $pod_Embrace$. You were the founder's own favorite. Nahir wagered he could raise a better prince out of the low and the discarded, chose a young widow named Zamra, and Embraced her against her will. When he ordered her to devour her own children, she struck him across the face with a torch. Fourteen years later she was Prince of Algiers.\n\nHe won the wager and spent a fortune doing it. Zamra took the throne without him, leaving Nahir no childe willing to call him sire. He has never forgotten whose speech goaded the wager out of him, and now he is asking after you."
 POD_gratiano.0135.a: "An elder with a grudge can be turned. Let us see which way."

 POD_gratiano.0136.t: "Vitae and No Forgiveness"
 POD_gratiano.0136.desc: "The audience is called after the last prayer of the night, before as many witnesses as the room will hold. Nahir, the elder the clan once made a suppliant, receives you where every one of them can see it.\n\nThe courtesies are perfect and slow. You are greeted in an order of precedence and vitae is offered twice before anyone may speak. 'The young are always in a hurry,' he says once, while the cups are poured. Then he sets his own cup down between you, untouched, and his eyes do not leave your face.\n\n'Tell me, boy. Have you come to abase yourself, or to finish what your laughter began?'"
 POD_gratiano.0136.a: "Turn the grievance into a debt he owes me."
 POD_gratiano.0136.b: "A corpse settles it."
 POD_gratiano.0136.c: "He will wait on my convenience."

###### Nahir amends (0137-0140) ######

 POD_gratiano.0137.t: "The First Amends: Deference"
 POD_gratiano.0137.desc: "The old blood still values precedence. Nahir was owed it long before Algiers cast him aside, so you pay where the Cainites of the Maghreb can watch. The hall is full, and you lower your own standing before an elder your clan has mocked for a generation.\n\nYou bow. Nahir leaves you there until the murmuring dies.\n\n'Lower.'\n\nYou bend another inch and say nothing. The bow has value because a rival offers it before witnesses. Nahir holds you there until everyone understands, then releases you."
 POD_gratiano.0137.a: "Kneel, and make sure the hall watches."
 POD_gratiano.0137.b: "His goodwill is not worth that much."
 POD_gratiano.0137.toast: "You bow lower than the hall expected. The first amends is made."

 POD_gratiano.0138.t: "The Second Amends: Tribute"
 POD_gratiano.0138.desc: "Deference earned you an audience; now you must secure your place in it.\n\nThe chest goes south weighed to the dinar and sealed, because a gift declares what one power thinks another is worth, and a gift valued too low offends more deeply than no gift at all. Nahir has it set down beside him, unopened, and studies the giver instead of the gold. 'A power's gift,' he says at last. 'It will be remembered.' He does not open it that night, or the next, and the people around him are careful to notice that he has not."
 POD_gratiano.0138.a: "Send it weighty enough to name him a power."
 POD_gratiano.0138.b: "The coffers stay shut."
 POD_gratiano.0138.toast: "The tribute reaches the elder. The second amends is made."

 POD_gratiano.0139.t: "The Third Amends: The Deed"
 POD_gratiano.0139.desc: "Deference cost you prestige, and the gift cost you gold. The third amends has to be a deed. Nahir frames no request. In the middle of an evening of no consequence, he sets down his cup and says, 'My line once held the road through Wargla,' leaving the sentence there.\n\nThat branch of his house lost the road long ago, but old obligations still run through the country. A man with no interest in the Maghreb can call them in without appearing to serve Nahir. News will reach the elder soon enough, even if he leaves the deed unacknowledged."
 POD_gratiano.0139.a: "Call in what that road still owes."
 POD_gratiano.0139.success: "The errand succeeds. Word reaches the right households in proper order, reviving a claim everyone had stopped counting on. Every step leads back to you, and Nahir notices. At your next audience, you are no longer greeted last."
 POD_gratiano.0139.failure: "The errand miscarries. Word reaches the wrong ear, or arrives too late at the right one, and nothing moves along the road. Nahir hears that you tried and knows an attempt from a deed. He says so pleasantly before two of his own people, then drops the subject."
 POD_gratiano.0139.toast.done: "The third amends is made. The grievance eases."
 POD_gratiano.0139.toast.failed: "The errand miscarries. The third amends is not made. One honest attempt remains before the chance cools."
 POD_gratiano.0139.toast.cooled: "The errand fails a second time. The chance has cooled, and the third amends must be sought another way."
 POD_gratiano.0139.b: "His enemies are his own affair."

 POD_gratiano.0140.t: "The Name He Uses"
 POD_gratiano.0140.desc: "The three amends have altered the terms between you. This audience is private, offered with the hospitality due an equal. Nahir pours with his own hand, which he has never once done, and when he speaks he uses neither Verona nor Prince nor boy.\n\n'Gratiano.'\n\nIt is the first time he has addressed you as an equal. The grievance of Algiers is spent, replaced by the wary regard of an elder who has chosen to call you friend."
 POD_gratiano.0140.a: "Through Nahir, I may yet reach Sybil."
 POD_gratiano_nahir_done_toast: "Nahir counts you a friend. The elder of Algiers is dealt with."
 POD_gratiano_sybil_lead_tt: "#Y Nahir now counts you a friend.#!\nAn elder calls you friend and will remember the choice as surely as an oath. His regard may open a road to Sybil."

###### The kill route + grudge/failure states (0141-0146) ######

 POD_gratiano.0141.t: "The Enemies He Kept"
 POD_gratiano.0141.desc: "Reaching Nahir requires patience. He chooses every room in which he can be found, and those who challenge him face to face seldom return. A direct strike is madness.\n\nHe has had ages in which to make enemies and the collection is large. The oldest causes against him were made close to home, in his own blood. Others need no cause at all, only an arrangement, and the fewer hands between you and the deed, the more likely it is traced to you. Whichever instrument it is to be, it is chosen now, before anything moves."
 POD_gratiano.0141.a: "Zamra Matoub, who answered him once with a torch."
 POD_gratiano.0141.b: "Abdullah of Wargla. His sire has never come for him."
 POD_gratiano.0141.c: "A Ventrue hand and a favor owed three courts away."
 POD_gratiano.0141.d: "Send east, and pay Alamut for his name."
 POD_gratiano.0141.e: "Face him myself, with no one between us."
 POD_gratiano.0141.f: "Not tonight, and perhaps not this way."
 POD_gratiano.0141.toast: "The instrument is chosen. It is already moving toward Nahir."
 POD_gratiano_nahir_duel_warning_tt: "#R A duel against an elder and a master of Obfuscate.#!\nNahir cannot be surprised and can barely be caught. The odds are long, and defeat is fatal. Only a reckless Cainite would choose this road."

 POD_gratiano.0142.t: "The Knife Falls"
 POD_gratiano.0142.desc: "The waiting is over. Whatever you set moving is close enough to reach him now. Nahir has guarded every obvious approach, yet one path escaped his notice: a childe who never forgot, or a stranger paid through several hands.\n\nBy morning you will know whether he is ash; the Maghreb will spend much longer deciding whose name to put to it."
 POD_gratiano.0142.a: "Let it fall where it was aimed."
 POD_gratiano.0142.success: "It is done quietly. Nahir is taken somewhere ordinary, from a quarter he never thought to watch. The grievance of Algiers dies with him, along with the memory that kept it. The Maghreb argues over the culprit, and weeks pass before any accusation reaches Verona."
 POD_gratiano.0142.fizzle: "The instrument fails to reach him. It turns back or misses its hour, leaving the night indistinguishable from any other. Nahir remains unaware. You have lost time, and can try again by another road."
 POD_gratiano.0142.exposed: "The attempt is caught half made, and whoever made it does not stay silent long. Within the fortnight Nahir has the whole shape of it, traced back through everyone who touched it until the last name in the chain is yours. Any denial would read as confession, so Nahir leaves you no accusation to answer. By the end of the month, a factor of yours in Bejaia has stopped writing."
 POD_gratiano.0142.toast.dead: "The blow lands. Nahir is ash; the elder of Algiers is answered."
 POD_gratiano.0142.toast.fizzle: "The plot comes to nothing. Nahir lives, and never knew it was near."
 POD_gratiano.0142.toast.exposed: "The plot is exposed. Nahir knows whose work it was, and will answer it."

 POD_gratiano.0143.t: "The Elder Marks the Hand"
 POD_gratiano.0143.desc: "The word reaches you inside a fortnight, first from a factor lately off a Maghrebi ship and then from a courtier repeating it at your own table. Nahir knows whose hand it was and how long it had been reaching toward him.\n\nAn elder needs no herald or declaration for a private war. Nahir simply changes what he does with his nights."
 POD_gratiano.0143.a: "So the elder wants to hunt."

 POD_gratiano.0144.t: "What the Nights Cost"
 POD_gratiano.0144.desc: "A lamp is found burning in a room you keep locked. A week later a man who has served you for years vanishes.\n\nThese losses drain your household without breaking it. Your people sit with their backs to the wall and read every letter twice; the court senses the disorder before it learns the cause. Nahir means to make himself felt throughout Verona without leaving a hand you can strike. Far away, an agent who has never seen the city is being told which of your doors is watched."
 POD_gratiano.0144.a: "I can bleed longer than he can wait."
 POD_gratiano.0144.b: "Meet him myself and end it."
 POD_gratiano.0144.c: "Ask what would content him."

 POD_gratiano.0145.t: "The Fool's Road"
 POD_gratiano.0145.desc: "Nahir consents to be found, which is the whole of it with a vampire who has carried Obfuscate to its height. He chose the hour and the ground; the courtesy with which the meeting is arranged serves as warning.\n\nEvery honest counselor has advised against this road, yet you came. Nahir is fifth generation and you are fourth, but his centuries of mastery outweigh what blood handed you. With the Abyss gathered around you, both blades rise."
 POD_gratiano.0145.a: "Blade to blade, then."
 POD_gratiano.0145.success: "Nahir is destroyed"
 POD_gratiano.0145.success.desc: "It very nearly did not work. For most of it he was the subtler of you, and twice you took something that was not where you were looking. Then he committed one instant too early, certain how the night would end.\n\nNahir comes apart without a sound, and every slight he ever kept in its proper order goes with him, yours among them. You are left standing in a room you did not choose, in silence."
 POD_gratiano.0145.failure: "You fall to the elder you came to kill."
 POD_gratiano.0145.failure.desc: "You never once touched him. You spent yourself fighting the presence Nahir allowed you to see while the fifth generation did its unhurried work from somewhere just behind your ear.\n\nUnderstanding arrives too late to help. You ignored a plain warning, and Nahir's victory leaves Verona to whoever stands nearest before dawn. All your designs pass into other hands."

 POD_gratiano.0146.t: "The Price of Pride"
 POD_gratiano.0146.desc: "Nahir has raised his price by half since the hunt began. He also demands that you bow before an audience of his choosing. The gold may satisfy his grievance; the bow will let him enjoy it.\n\nHe gives no assurance that either will settle the matter. You may pay the tribute and endure the humiliation only to see him leave the chest unopened beside his seat while he repeats his demands."
 POD_gratiano.0146.a: "Pay what he asks, and bow where they can see."
 POD_gratiano.0146.b: "Then he keeps his grudge."
 POD_gratiano.0146.success: "Nahir has it weighed, and this once he lets the grievance go.\n\nThe hunt stops between one night and the next. He does not forgive you, and it does not occur to either of you that he might."
 POD_gratiano.0146.failure: "Nahir has it weighed. The figure is correct, and it changes nothing.\n\nThe wound comes from a wager he won and a room that laughed at him anyway; no weight of coin can unsay what was spoken aloud."
 POD_gratiano.0146.toast.failed: "Nahir keeps the gold and the grudge. The hunt goes on."


###### AMICI NOCTIS CAPSTONE (0055-0056) ######

 POD_gratiano.0055.t: "The Chair Already Drawn"
 POD_gratiano.0055.desc.intro: "The inquiries reach your court before the invitation does. A guest asks your steward the wrong sort of question, while a cousin who has not written in years sends to ask, idly, how Verona finds you.\n\nThen they take you and shut you in a tomb for two nights, so you can 'commune with the darkness' without distraction. When the tomb opens, hooded elders stand over you and give no names. A chair has been drawn out and left ready, though nobody tells you to sit."
 POD_gratiano.0055.desc.standard: "\n\nCount the crowns still standing between the Alps and Rome. Not one of them is Giovanni tonight, and not one is Ventrue. The Cardinal's hand no longer reaches past Madrid, and Nahir's grievance is spent.\n\nYour descent from the founder earns no indulgence here. The elders guard that blood against the unworthy and measure what you have proved willing to spend of it. There is no congratulation. Room is simply made, and the hooded man on your left shifts a hand's-breadth aside without once looking at you."
 POD_gratiano.0055.desc.moncada_dead: "\n\nFrom the Alps down to Rome, no Giovanni and no Ventrue holds ground of their own tonight, and Nahir's grievance is settled. Ambrosio Moncada, whom rumor long seated among these elders, is ash, and so is Lucita, the childe he called his own.\n\nThe Friends answer the vacancy with calculation. Keeping you close is safer than leaving you loose. They give you the place the clan always said was his, and no one asks aloud how it came to be empty."
 POD_gratiano.0055.a: "I have paid for this seat."
 POD_gratiano.0055.b: "Take the place they say was his. Say nothing."
 POD_gratiano_amici_member_tt: "#Y You are elevated to the Amici Noctis.#!\nThe councils of the Friends of the Night, along with their scrutiny, are open to you now. You enter the society's inner life; in time its members will find you at their gatherings."

###### Assamite pact journey (0150-0159) ######

###### Pact journey sidebar ######

 POD_gratiano_pact_journey_name: "The Mountain of Blades"
 POD_gratiano_pact_journey_desc: "At Alamut, beyond the last roads Verona can name, the Assamites sell the service of sworn blades to those who meet the price. You mean to hire them for the assault on the founder's castle."
 POD_gratiano_pact_journey_effects: "#bold Seal a compact with the Assamites.#!\nPay in #Y gold#! for #P +1 Assamite support#! per journey up to #P 3#! or promise the #R heart's blood#! to buy their #P full support (3)#! at once.\n#P Assamite support: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_assamite_support_value')|0]/3#!. \nEvery point adds support for the final assault."
 POD_gratiano_pact_journey_tt: "Ride to Alamut and treat with the Assamites for their blades."

# Journey GUI suffixes: _monthly_num, _monthly_tt, and their _current variants.
 POD_gratiano_pact_journey_monthly_num: "#TOOLTIP:POD_gratiano_pact_journey_monthly_tt #V;L [GetPlayer.MakeScope.ScriptValue('POD_gratiano_pact_journey_progress')|1]%#!#!"
 POD_gratiano_pact_journey_monthly_tt: "$POD_journey_time_until_completion$ #V [JourneyYearsLeft('POD_gratiano_pact_journey_progress')|0] $POD_journey_years$, [JourneyMonthsLeft('POD_gratiano_pact_journey_progress')|0] $POD_journey_months$#!\n\n[GetPlayer.MakeScope.GetScriptValueDesc('POD_gratiano_pact_journey_progress')]"
 POD_gratiano_pact_journey_monthly_num_current: "#TOOLTIP:POD_gratiano_pact_journey_monthly_tt_current #V;L [GetPlayer.MakeScope.ScriptValue('POD_gratiano_pact_journey_progress')|1]%#!#!"
 POD_gratiano_pact_journey_monthly_tt_current: "$POD_journey_time_remaining$ #V [JourneyYearsLeftCurrent('POD_gratiano_pact_journey_progress')|0] $POD_journey_years$, [JourneyMonthsLeftCurrent('POD_gratiano_pact_journey_progress')|0] $POD_journey_months$#!\n\n[GetPlayer.MakeScope.GetScriptValueDesc('POD_gratiano_pact_journey_progress')]"

 POD_gratiano_pact_journey_planning_title: "The Road to Alamut"
 POD_gratiano_pact_journey_planning_desc: "The Mountain of Blades lies far to the east, past the border you know. The Assamites do not come to supplicants; supplicants come to them. You must make the crossing yourself and arrive with something worth the Mountain's attention."
 POD_gratiano_pact_journey_planning_confirm: "Set out for the Mountain."
 POD_gratiano_pact_journey_planning_decline: "Not yet. The Mountain will keep."

 POD_gratiano_pact_journey_travel_title: "The Road to Alamut"
 POD_gratiano_pact_journey_travel_desc: "The Mountain of Blades lies far to the east, past the border you know. The Assamites do not come to supplicants; supplicants come to them. You must make the crossing yourself and arrive with something worth the Mountain's attention."
 POD_gratiano_pact_journey_travel_confirm: "Set out for the Mountain."

 POD_gratiano_pact_journey_not_on_tt: "You are not already bound for the Mountain."
 POD_gratiano_pact_journey_partner_tt: "A living Assamite power must hold court to receive the embassy."


###### 0150 - the audience at Alamut ######

 POD_gratiano.0150.t: "The Mountain of Blades"
 POD_gratiano.0150.desc: "The air thins two days before the gates, and the last of the road is made on foot. [pact_partner.GetFirstNameNoTooltip] receives you as the Mountain receives every supplicant, with a patience close to contempt and an attention that misses nothing. The Children of Haqim owe you nothing, but any oath made here is carried out without reminders.\n\nYou have come to buy that promise for the night you move on the castle. The terms are recited flatly and once. 'Gold, enough to bleed a treasury white. Or the heart's blood. The Mountain does not haggle.'"
 POD_gratiano.0150.desc.nakurtum: "Alamut is cut into the mountainside, and its court is as cold as the stone. Nakurtum receives you without rising. Her younger warriors still mutter about a woman's fitness to hold the Mountain, never within hearing of their elders, and those elders are quietly hunting an older name to rouse and set in her place. Every stranger who comes up to her hall is one more measure of her authority. She does not bargain. She waits, and the silence makes plain who has come as supplicant.\n\nAt last she speaks. 'Say to whom you have come.'\n\nOnly when you have said her titles aloud, childe of Haqim and Eldest of the Children, before the assembled court, does she name her terms. 'Gold, enough to bleed a treasury white. Or the heart's blood. The Mountain does not haggle. Choose.'"
 POD_gratiano.0150.a: "Gold. Name the sum."
 POD_gratiano.0150.a.tt: "#Y Pay [GetPlayer.MakeScope.ScriptValue('POD_gratiano_pact_price_value')|0] gold now.#!\nThe coin changes hands tonight. The compact is #bold sealed on the return journey#!, when you ride back to the Mountain to swear it."
 POD_gratiano.0150.b: "Then take it in blood."
 POD_gratiano.0150.b.tt: "#R Promise the heart's blood.#!\nThe pact seals tonight at Alamut's #P full support, 3 of 3#!, with no gold paid now. Every blade the compact promises is committed to your strike. #Y The Mountain will name what it is owed at the vault.#!"
 POD_gratiano.0150.c: "These terms are not worth the climb."

 POD_gratiano_pact_gold_paid_msg: "The gold is paid to the Assamites. The compact awaits its sealing at the Mountain."
 POD_gratiano_pact_gold_paid_msg_tt: "The price is handed over. Ride to Alamut once more to seal the pact and gain Assamite support for the strike."

###### 0151 - the oath of the heart's blood ######

 POD_gratiano.0151.t: "The Oath of the Heart's Blood"
 POD_gratiano.0151.desc: "The rite is brief and older than anything you would care to swear by. It leaves no writing or seal, only the words and [pact_partner.GetFirstNameNoTooltip]'s eyes on yours while you say them.\n\nHeart's blood is no figure of speech on this mountain. It is the last and most precious essence of a Cainite, the part that carries the soul, if a Cainite can be said to have one. You have promised it.\n\nThe oath is sworn. Alamut will call this debt due on the night the founder's castle is opened."
 POD_gratiano.0151.a: "I will pay."
 POD_gratiano.0151.a.tt: "#Y The debt comes due at the vault.#!\nYou have promised heart's blood to the Children of Haqim. They will name what is owed when the founder's castle falls, and not before."

###### 0152 - the sealing rite (gold path) ######

 POD_gratiano.0152.t: "The Compact Sealed"
 POD_gratiano.0152.desc: "The gold has been counted already. This ride is for the oath. [pact_partner.GetFirstNameNoTooltip] receives you as a man whose price is paid; at Alamut, that earns expectation rather than affection.\n\nThe rite is short and exact, and nothing is spilled for it. When it is done the Mountain owes you warriors, and you owe it nothing further. Somewhere in the rock beneath you, men are grinding steel for a castle they will not see until they are inside it."
 POD_gratiano.0152.a: "I will send word when it is time."

###### 0153 - deepening the compact ######

 POD_gratiano.0153.t: "What Else the Gold Buys"
 POD_gratiano.0153.desc: "You have carried gold up this road before, and the court remembers exactly how much. The compact stands at the agreed measure, and [pact_partner.GetFirstNameNoTooltip] makes the limit plain without reopening the bargain. Any further purchase will be weighed separately tonight.\n\nAnother payment turns one more of Alamut's own toward the castle. The rest of the arrangement stands, and nobody here asks what you mean to do with the hand you are buying."
 POD_gratiano.0153.a: "One more hand, and I will pay for it."
 POD_gratiano.0153.a.tt: "#Y Pay [GetPlayer.MakeScope.ScriptValue('POD_gratiano_pact_deepen_price_value')|0] gold.#!\n#P +1 Assamite support#! toward the strike, up to a maximum of #bold 3#!. Each point bought is one more sworn hand in the assault."
 POD_gratiano.0153.b: "Courtesies, and nothing more."

 POD_gratiano_support_deepened_toast: "The compact deepens. Another blade of Alamut is pledged to the strike."
 POD_gratiano_support_deepened_toast_tt: "Assamite support toward the assault on the castle rises by one."

###### 0154 - the partner has fallen ######

 POD_gratiano.0154.t: "The Mountain Is Silent"
 POD_gratiano.0154.desc: "You travel the long road to Alamut and find the Mountain changed. The one you came to treat with is absent from the hall, and no one at the gate will explain why to a Latin.\n\nThe Children of Haqim have law for an absent ruler and elders enough to quarrel over what it requires. Their dispute leaves no one willing to pledge the Mountain's word behind a Latin's war on the strength of a name that is no longer here.\n\nThe gatekeepers let you back out through the same door, and nobody walks you down."
 POD_gratiano.0154.a: "No one here to treat with."
 POD_gratiano.0154.a.tt: "The journey ends with nothing sworn.\n\nRide to Alamut again once there is an independent Assamite ruler left to treat with."

###### Pact seal & sealed messages (POD_gratiano_seal_pact_effect) ######

 POD_gratiano_seal_pact_tt: "#P The Assamite pact is sealed.#!\n#P +1 Assamite support#! toward the strike. The finest killers of the blood are sworn to your cause."
 POD_gratiano_pact_sealed_msg: "The Assamite pact is sealed. Their blades are yours on the night of the strike."
 POD_gratiano_pact_sealed_msg_tt: "The compact with the Assamites is sworn. Their support strengthens the coming assault, and can be deepened on further journeys to the Mountain."

###### Frame the elders (0180-0184) ######
# Witnesses bear altered memories; elders are the accused.

###### 0180 - the plot unlocks ######

 POD_gratiano.0180.t: "Memories That Never Were"
 POD_gratiano.0180.desc: "The pact gives you access to specialists who can reshape a person's recollections. A lesser Lasombra, or someone already sworn to your conspiracy, can be made to remember an elder recruiting them to murder a clanmate and take the victim's blood. Brought before the court, the witness would yield the same account under questioning or examination of the mind.\n\nMontano and the other great names have enemies willing to listen. You can give those enemies testimony that even its bearer believes. The price will fall first on the people whose memories you offer up."
 POD_gratiano.0180.a: "Then I will give the court its witnesses."
 POD_gratiano.0180.a.tt: "#bold The false-memory plot is open.#!\nPlant false memories in lesser Lasombra or members of your conspiracy to frame the great names who could halt your strike, one at a time: #bold Montano#!, #bold Alfonzo#!, #bold Guilelmo#!, and #bold Boukephos#!. #P Silence three of the four#! and their opposition is broken. Any of the four who dies or falls into torpor counts as silenced. Right-click a target to begin the work."

###### 0181 - the pawn-tier choice (per completed phase) ######

 POD_gratiano.0181.t: "A Witness for the Court"
 POD_gratiano.0181.desc: "An accusation against [frame_scheme.GetTargetCharacter.GetFirstNameNoTooltip] needs a witness whose recollections will survive examination. Your allies can prepare someone from the outer circle, then arrange for the court to discover what that person remembers. Once exposed, the witness will answer for complicity in the very crimes you invented.\n\nA member of your inner circle would make a more convincing accomplice, at the cost of a trusted companion's place beside you. You could instead oversee the conditioning yourself, working carefully through those already drawn into the deception."
 POD_gratiano.0181.a: "Offer up one of the outer circle."
 POD_gratiano.0181.a.tt: "#bold Offer a witness from the outer circle.#!\nAdds #P [GetPlayer.MakeScope.ScriptValue('POD_gratiano_frame_pawn_progress_value')|0]#! to the working's progress and #R removes them from the outer circle#!. #Y A 75% chance they are never seen again; a 25% chance they escape and, unless the two of you are already friends, become your rival.#!"
 POD_gratiano.0181.a.spent_toast: "One Who Did Not Return"
 POD_gratiano.0181.a.spent_toast_tt: "The court's questioning ends with [spent_pawn.GetFirstNameNoTooltip] naming the elder you chose. The confession condemns its speaker as an accomplice, and [spent_pawn.GetSheHe] is taken away. No word reaches you afterward."
 POD_gratiano.0181.a.escape_toast: "One Gets Clear"
 POD_gratiano.0181.a.escape_toast_tt: "[spent_pawn.GetFirstNameNoTooltip] escapes before the court can dispose of its witness. Enough of the conditioning has unraveled for [spent_pawn.GetHerHim] to understand why you offered [spent_pawn.GetHerHim] up. [spent_pawn.GetSheHe|U] leaves your household and the outer circle behind."
 POD_gratiano.0181.b: "Offer up one of the inner circle."
 POD_gratiano.0181.b.tt: "#bold Offer a coterie member as a witness.#!\nAdds #P [GetPlayer.MakeScope.ScriptValue('POD_gratiano_frame_coterie_progress_value')|0]#! to the working's progress and lends the scheme #P a better chance of success#!. #R The one you offer up leaves your coterie.#! You will have one fewer champion for the assault on the castle."
 POD_gratiano.0181.b.toast: "A Chair Goes Empty"
 POD_gratiano.0181.b.toast_tt: "[spent_friend.GetFirstNameNoTooltip] gives the account you prepared, naming an elder as the instigator of a crime that never happened. [spent_friend.GetSheHe|U] survives the questioning, but withdraws from your company with a name now bound to the accusation. The case advances, and a place in your inner circle stands empty."
 POD_gratiano.0181.c: "I will direct the conditioning myself."
 POD_gratiano.0181.c.tt: "#P Adds [GetPlayer.MakeScope.ScriptValue('POD_gratiano_frame_self_progress_value')|0] to the working's progress#!\n#R -5 Standing at court#!\nThis is the slowest course and sacrifices no companion. The time and attention it demands weaken your standing at court."
 POD_gratiano.0181.d: "Let it grind on unaided."

###### 0182 - framing success ######

 POD_gratiano.0182.t: "The Testimony"
 POD_gratiano.0182.desc: "The testimony against [frame_target.GetTitledFirstNameNoTooltip] survives examination. Those who search the witnesses' memories find the same incriminating encounters described before the court. [frame_target.GetHerHis|U] denials cannot dispel the suspicion now spreading among vassals and kin.\n\nEvery title remains, but fewer voices are willing to support [frame_target.GetHerHim] against you."
 POD_gratiano.0182.a: "One name fewer. Let the clan believe it."
 POD_gratiano.0182.a.montano_tt: "#Y Montano is framed.#!\nThe Emperor of the Sea of Shadows wears crimes he never committed, and those who still kneel to him have begun to repeat them. What it costs him at #bold Siracusa#! will be plain within a fortnight."

###### 0183 - framing failure / discovery ######

 POD_gratiano.0183.t: "The Seam Shows"
 POD_gratiano.0183.desc: "A witness recalls a meeting that could not have taken place. Further questioning exposes the seams in the recollection, and the accusation against [frame_target.GetTitledFirstNameNoTooltip] begins to unravel. Someone has manufactured the testimony; the court is now asking who arranged for it to be heard.\n\nYour part remains unproven, but suspicion has reached the high table."
 POD_gratiano.0183.a: "Clumsy. Bury the working, and let this one be."
 POD_gratiano.0183.a.tt: "#R -10 Standing at court#!\nThe working is exposed and the scheme ends with no elder silenced. This one cannot be worked again for five years, and the court marks you for the clumsiness of it."

###### 0184 - auto-credit (elder fell without our forgeries) ######

 POD_gratiano.0184.toast: "A Voice Falls Silent"
 POD_gratiano.0184.toast_tt: "One of the four great names is dead, in torpor, or no longer a Cainite. Whose work it was makes no difference. That name will not stand in the way of the strike now, and it counts toward the three you need."

###### Framing messages ######

 POD_gratiano_elders_framed_msg: "The old blood of the See is broken. Enough of its elders are silenced that no voice will rise against the strike."
 POD_gratiano_elders_framed_msg_tt: "The elders' opposition to the assault is neutralized. This milestone of the strike gate is met."
 POD_gratiano_montano_framed_msg: "Montano wears forged crimes, and the Sea of Shadows turns against its Emperor. The road to Siracusa opens."
 POD_gratiano_montano_framed_msg_tt: "The Emperor of the Sea of Shadows is disgraced by the framing chain. His seat at Siracusa, the door to the castle, can now be taken by judgment, claim, or war."

###### Seat of Sicily (0200-0203) ######

###### 0200 - the See recoils ######

 POD_gratiano.0200.t: "The Sea Turns"
 POD_gratiano.0200.desc: "The false testimony has done its work. The Sea of Shadows moves uneasily under its Emperor. Those who still kneel to Montano now weigh their oaths against the accusations, while his once-unassailable standing thins by the week. Even one such as Montano can be exposed by rumor.\n\nYour people have drawn the writ. Depositions from the compromised witnesses now support your case against Montano. Your clerks have joined those accusations to a claim on Siracusa, the Emperor's own capital, and the document awaits your seal."
 POD_gratiano.0200.a: "Press the claim on Siracusa."
 POD_gratiano.0200.a.tt: "#P A pressed claim on Siracusa.#!\nMontano is #R disgraced#!, and you gain a claim on his capital county. If the matter reaches the Friends of the Night while he still holds the seat, their judgment can hand it to you outright. If it does not, the claim stands, and you will have to take the seat yourself."
 POD_gratiano.0200.b: "Let it lie. I will take Siracusa another way."

 POD_gratiano.0204.t: "A Disgrace Without a Throne"
 POD_gratiano.0204.desc: "The false testimony spreads exactly as planned, and the Sea of Shadows turns on its Emperor. It comes too late to cost him Siracusa. The county has already passed from his hands, beyond the Friends' power to strip from him.\n\nThe disgrace remains. Montano must now defend a name that once required no defense, while others supply the accusations. Your forgers have also altered the records of Siracusa's transfer. The version in your strongbox supports your claim, written in ink you paid for."
 POD_gratiano.0204.a: "Ruin him anyway. I want Siracusa."
 POD_gratiano.0204.a.tt: "#P A pressed claim on Siracusa.#!\nMontano is #R disgraced#! for twenty years, whether or not he holds anything worth losing. Your claim is #Y pressed against whoever holds the county now, not against the Emperor#!, so no judgment of the Friends follows. Siracusa must be taken by war."
 POD_gratiano.0204.b: "Not yet."
 POD_gratiano_montano_seatless_msg: "Montano is disgraced, though Siracusa had already slipped his grasp. The claim stands against whoever holds it now."
 POD_gratiano_montano_seatless_msg_tt: "The forged crimes ruin Montano's standing and leave you a claim on Siracusa. With the Emperor seatless, the Friends have no judgment to pass; the county must be taken by war."


###### 0201 - the petition ######

 POD_gratiano.0201.t: "Before the Friends"
 POD_gratiano.0201.desc: "The lie has had months to settle, and it has settled well. Montano's name has thinned with it: letters once answered inside the week now come late enough to mean it, and men who used to ask his leave have stopped asking.\n\nThe Friends of the Night appoint a man in every city worth keeping to receive petitions and pass them inward. Yours has been paid twice over. Behind him, the table sits hooded; one of its voices you have heard at a convocation but cannot place. Every elder there has read what your clerks wrote of Montano. Your man brings their answer back in a flat voice, repeating what he was paid not to understand. 'He has a question. Whether it still has an answer is his own affair.'"
 POD_gratiano.0201.desc_dead: "Montano is ash, and the forgery outlived him. The record did not burn with the man. His crimes remain written where the clan reads them, and no one hurries to defend a name that ended badly. You meant the disgrace to end in a verdict before the clan's elders, with Montano present as they handed you his capital. Death, the cruder instrument, arrived first.\n\nThe Friends have no judgment left to give. Siracusa answers to some lesser name tonight, and your man in the city has already sent to ask what is to be done with the petition."
 POD_gratiano.0201.a: "Let the Friends judge Siracusa."
 POD_gratiano.0201.a.tt: "#P Siracusa passes to you.#!\nThe Amici Noctis judge in your favor and take the county from Montano without a war. He keeps whatever empire he has left, minus its heart, and no claim on what was taken."
 POD_gratiano.0201.b: "Siracusa will be taken in blood."
 POD_gratiano.0201.b.tt: "#bold Take the war route.#!\nNothing changes tonight and you keep the pressed claim. Siracusa is won the old way: declare the claim war on Montano and take the county by force."
 POD_gratiano.0201.c: "He has already lost it. My claim stands."
 POD_gratiano.0201.c.tt: "#bold Siracusa is no longer Montano's.#!\nThe county changed hands by some other course, so there is nothing left for the Friends to strip. Your pressed claim stands until Siracusa is yours in full."

###### 0202 - Montano's cold fury ######

 POD_gratiano.0202.t: "The Emperor's Answer"
 POD_gratiano.0202.desc: "Montano denies the accusations once more. The court accepts the witnesses' memories over his word, and Siracusa passes to you.\n\nHe watches you receive the judgment. Whatever he can prove about the forgery, he knows whose ambition it has served."
 POD_gratiano.0202.a: "Let him hate. Hatred at a distance is cheap."
 POD_gratiano.0202.a.tt: "#Y The Emperor counts you an enemy.#!\nMontano names you in his own court. When the castle falls, that enmity hardens into something worse. An elder does not forget who came to collect."

###### 0203 - seat-taken acknowledgment (any route) ######

 POD_gratiano.0203.toast: "The Door to the Castle"
 POD_gratiano.0203.toast_tt: "Siracusa is yours, whatever road took it there. From this county the strike on the castle will be staged. #P The road to the castle is open.#!"

###### Framing modifiers ######

 POD_gratiano_framed_elder_modifier: "Framed by False Testimony"
 POD_gratiano_framed_elder_modifier_desc: "Something that never happened now lives in the witnesses' memories and the official record. Vassals draw back from an elder they no longer quite trust, while enemies find doors left unexpectedly open."
 POD_gratiano_montano_disgraced_modifier: "Disgraced by the Whisper"
 POD_gratiano_montano_disgraced_modifier_desc: "False testimony has done its work in the courts of the Sea of Shadows. Vassals who once obeyed Montano without pause now hedge and delay as the lie passes for fact and his prestige drains away."

###### Sicily messages ######

 POD_gratiano_montano_disgraced_msg: "Montano is disgraced and a claim on Siracusa is pressed. The Friends of the Night will lean on the Emperor to yield."
 POD_gratiano_montano_disgraced_msg_tt: "The forged crimes ruin Montano's standing and grant you a claim on his capital county. Await the Friends' judgment, or press the claim in war."
 POD_gratiano_siracusa_yielded_msg: "Siracusa is yours. The Amici Noctis have judged against the Emperor, and the door to the castle stands open."
 POD_gratiano_siracusa_yielded_msg_tt: "The Friends of the Night strip Montano's capital county and grant it to you. This fulfills the plan's requirement to hold Siracusa."

###### Strike decision ######

 POD_gratiano_strike_the_castle: "Strike the Castle of Shadows"
 POD_gratiano_strike_the_castle_desc: "The four rival powers that once hemmed you in are dead or broken. The Amici Noctis have accepted your oath, and the Assamites have sworn their blades. The See's elders are scattered. Siracusa now gives you the road into the castle. Below it the founder sleeps, indifferent and eternal, and no readier hour will come. Once made, this decision cannot be recalled. Speak the word, and the assault begins."

 POD_gratiano_gate_elders_tt: "#bold The elders of the See are silenced.#!\nEnough of the old-blood elders (Montano, Alfonzo, Guilelmo, and Boukephos) have been framed, killed, or driven into torpor that no voice will prevent the strike. #P [GetPlayer.MakeScope.ScriptValue('POD_gratiano_framed_count_value')|0] of 4#! neutralized."
 POD_gratiano_gate_conspiracy_tt: "#bold The conspiracy is ready.#!\nThe conspiracy is strong enough to move against the castle itself. #P The Conspiracy: [GetPlayer.MakeScope.ScriptValue('POD_gratiano_conspiracy_value')|0] / 80#!."
 POD_gratiano_strike_launch_tt: "#X The strike begins.#!\nYou move against the castle and the founder beneath it. This commits you to the assault and brings the long conspiracy to its final night. #bold The order cannot be recalled.#!"
 POD_energy_restoration_disabled_castle_strike: "You can't restore your energy this way while the strike on the Castle of Shadows is underway"

###### Framing scheme display ######
 POD_gratiano_frame_scheme:0 "Frame an Elder"
 POD_gratiano_frame_scheme_action:0 "Planting False Memories"
 POD_gratiano_frame_scheme_desc_general:0 "Use the arts secured through your Assamite pact to alter the memories of lesser Lasombra or members of your conspiracy. Their recollections will implicate an elder in crimes against the clan, supplying witnesses who believe their own accusations."
 POD_gratiano_frame_scheme_success_desc:0 "[TARGET_CHARACTER.GetShortUIName|U] will be disgraced for #V 20 years#! and permanently count as #P silenced#! toward the Frame the Elders objective. You gain #P 5 Conspiracy#!."
 POD_gratiano_frame_scheme_discovery_desc:0 "The memories offered as evidence against [TARGET_CHARACTER.GetShortUIName] may be exposed as fabrications, putting the scheme at risk."
 POD_gratiano_frame_elder_interaction:0 "Frame an Elder"
 POD_gratiano_frame_elder_interaction_desc:0 "Begin a scheme to frame [recipient.GetShortUIName] using the arts secured through your Assamite pact. Plant incriminating memories in lesser Lasombra or members of your conspiracy, then offer them up as witnesses.\n\nSuccess disgraces [recipient.GetHerHim] before the clan and counts [recipient.GetHerHim] as #P silenced#! toward the Frame the Elders objective."

###### Assault (0220-0227) ######

 POD_gratiano.0220.t: "The Stair Under Siracusa"
 POD_gratiano.0220.departure.desc:0 "Your preparations are finished. The Castle of Shadows waits in Siracusa, and you must reach it before the assault can begin. You send word to your companions to make ready for the journey."
 POD_gratiano.0220.departure.a:0 "To Siracusa."
 POD_gratiano.0220.departure.launch:0 "Bound for Siracusa"
 POD_gratiano.0220.departure.tt:0 "You travel to Siracusa with the available members of your coterie. If you cannot travel yet, departure waits until you can. The assault begins after you arrive. Your travel party remains at the castle while the strike is underway, then makes the return journey."
 POD_gratiano.0220.desc: "You come to Siracusa with everything you have left, and the Castle of Shadows gives you nothing to read on the approach. No one has ever been able to say from a distance what its walls are made of, because the shadows crawl over every surface in a slow ebb and flow. The tide of them rises out of the rock after sunset, wraps the fortress in a long spiral, and drains away again past midnight.\n\nBeneath it, the founder has lain sleeping since Rome fell, and his closest childer have kept vigil over that sleep ever since. Whoever is still keeping it stands between you and him, and you will not meet them all in one hour. You set your foot on the first step."
 POD_gratiano.0220.a: "Down, then. To the bottom of it."
 POD_gratiano.0220.launch: "The descent has begun."
 POD_gratiano.0220.launch.tt: "You move against the Castle of Shadows and the founder beneath it. His surviving get will meet you in turn over the months ahead; any who falls beforehand will be absent when their night comes. The maze and the founder's vault wait beyond them. The assault cannot be recalled."

 POD_gratiano.0221.t: "The Dutiful Sire"
 POD_gratiano.0221.desc: "He is standing in the first vaulted hall with his hands empty. Boukephos wears whatever the courts are wearing now, as he has worn every fashion since the Eternal Senate, so that only the stillness gives him away for what he is. You have never seen his face at a Court of Blood, and you have never doubted it was there.\n\n'I swore to the blood,' he says, to no one in particular. 'Not to its sleep.'\n\nHe inclines his head, a courtesy older than your house, and waits to hear what you can say for yourself."
 POD_gratiano.0221.a: "Send [learning_duelist.GetFirstNameNoTooltip] to hold him to it."
 POD_gratiano.0221.b: "I will make my own case to him."
 POD_gratiano.0221.aside.tt: "Boukephos stands aside. He could defend the argument before the Courts of Blood if called to account. He lives, and the convocation will hear what he allowed to pass here."
 POD_gratiano.0221.effect.success.desc: "Boukephos steps out of the doorway and turns his back. Among the Lasombra, the gesture needs no explanation."
 POD_gratiano.0221.champion.failure.effect.desc: "The argument goes wrong. Boukephos answers with grief and violence, and [learning_duelist.GetFirstNameNoTooltip] dies before finishing the reply."
 POD_gratiano.0221.critical.failure.effect.desc: "You give him the wrong reason. Boukephos hears you to the end, weeping as he moves, and your descent ends in the first hall."
 POD_gratiano.0221.success: "Boukephos stands aside"
 POD_gratiano.0221.champion.failure: "Your envoy falls in the first hall"
 POD_gratiano.0221.critical.failure: "The first hall claims you"

 POD_gratiano.0222.t: "The Guardian of the Ward"
 POD_gratiano.0222.desc: "The inner ward is a long room with too many pillars, and she is standing in none of the places you would look. Khanom Mehr has kept this threshold longer than you have been in the blood, and no one has ever learned what she is down here for. She keeps apart from the quarrel consuming her clan. She offers no weakness a man could buy and no fear he could exploit.\n\nKhanom Mehr is the only obstacle on this descent who wants nothing from you. Somewhere down the row of columns your own shadow moves half a beat late, and you do not look at it twice. She will be answered in her own manner, quietly and from behind."
 POD_gratiano.0222.a: "Let [intrigue_duelist.GetFirstNameNoTooltip] find her first."
 POD_gratiano.0222.b: "I can be quieter than she is."
 POD_gratiano.0222.effect.success.desc: "The knife finds her between one pillar and the next. Khanom Mehr goes down without a sound, and the quiet of the long room closes over the place where she stood."
 POD_gratiano.0222.champion.failure.effect.desc: "She was waiting on exactly this. The knife hand is caught and folded backward; [intrigue_duelist.GetFirstNameNoTooltip], so often a step ahead of everyone at your table, never sees her at all."
 POD_gratiano.0222.critical.failure.effect.desc: "You trace every angle of the ward and still miss the one that shelters her. Khanom Mehr is behind you before your certainty breaks. The small movement inside her robes is the last thing you see."
 POD_gratiano.0222.success: "Khanom Mehr is undone"
 POD_gratiano.0222.champion.failure: "Your knife is caught in the ward"
 POD_gratiano.0222.critical.failure: "The ward keeper takes you"

 POD_gratiano.0223.t: "The Warden of the Bronze Gate"
 POD_gratiano.0223.desc: "The stair ends at a bronze gate gone green with sea air, set into rock quarried long after it. Karotos waits before it with a sword the length of a man. He has broken sieges here and destroyed the armies that laid them. Your descent is only one more assault for him to turn back.\n\nHe asks neither your name nor your right to come armed. Karotos comes from an age the clan only half remembers, and the sword in his hands has answered every challenger so far. He sets his weight before the gate, unmoved by argument."
 POD_gratiano.0223.a: "Send [martial_duelist.GetFirstNameNoTooltip] against him."
 POD_gratiano.0223.b: "No envoy. I will take the gate."
 POD_gratiano.0223.b.draw: "The gate is still his"
 POD_gratiano.0223.b.draw.tt: "Neither of you kills the other. You break apart with the gate still between you and Karotos still on his feet in front of it. The stair stays contested, and the descent goes on regardless."
# Duel prowess advantage.
 POD_gratiano_castle_edge_1_modifier: "Prepared"
 POD_gratiano_castle_edge_1_modifier_desc: "Every hour of the long conspiracy that could be spent on the approach has been spent on it. You go in knowing the ground."
 POD_gratiano_castle_edge_2_modifier: "Well Prepared"
 POD_gratiano_castle_edge_2_modifier_desc: "The conspiracy has secured maps, watch schedules, and the names of those guarding the road from Verona to the vault."
 POD_gratiano_castle_edge_3_modifier: "Everything in Its Place"
 POD_gratiano_castle_edge_3_modifier_desc: "Tonight's plan reaches all the way to this stair. You fight on ground chosen long ago."
 POD_gratiano.0223.effect.success.desc: "The long sword comes down through empty air. Karotos never recovers the weight of the swing and dies where he was set to stand. Behind him, the great doors shift on their hinges."
 POD_gratiano.0223.champion.failure.effect.desc: "[martial_duelist.GetFirstNameNoTooltip] gets inside his guard once. Karotos does not permit a second time, and the body that comes to rest at the foot of the stair still has one hand locked around the hilt."
 POD_gratiano.0223.success: "The bronze gate is forced"
 POD_gratiano.0223.champion.failure: "Broken against the gate"

 POD_gratiano.0224.t: "The Keeper of the Archive"
 POD_gratiano.0224.desc: "Tubalcain keeps the founder's archive. He has read every abyssal working ever set to parchment. The volume he takes from the shelf strips certainty from whoever is still standing when he opens it.\n\n'You think you picked the lock,' he says, almost kindly. 'Ask yourself, childe of the blood, who left the door ajar.'\n\nHe draws a volume out of the case behind him with two fingers and lets it fall open."
 POD_gratiano.0224.a: "[learning_duelist.GetFirstNameNoTooltip] can match him page for page."
 POD_gratiano.0224.b: "I will match him working for working."
 POD_gratiano.0224.effect.success.desc: "For every rite he raises there is an answer waiting, and the answers come faster than he can change the question. At the last the dark turns in his own hands and takes him back, leaving his remains across the lowest shelf."
 POD_gratiano.0224.champion.failure.effect.desc: "The keeper knows one working more than [learning_duelist.GetFirstNameNoTooltip] does. The correction is already half out of that mouth when the dark comes down over it."
 POD_gratiano.0224.critical.failure.effect.desc: "You reach for the dark and find him already holding it. He takes the unmaking slowly, and does not look away from any part of it."
 POD_gratiano.0224.success: "The archive is passed"
 POD_gratiano.0224.champion.failure: "One citation too few"
 POD_gratiano.0224.critical.failure: "The keeper unmakes you"

 POD_gratiano.0225.t: "The Doorward"
 POD_gratiano.0225.desc: "The last door is a standing sheet of shadow, and Tepelit sits beside it with his back to the stone, in no hurry to rise for you. He has held this threshold with words alone for longer than most bloodlines have lasted, and he receives you with the weary courtesy of one who has turned away a thousand pilgrims. Whatever he owes the one asleep on the other side, love is not part of it, and some say he saw his own ending long ago and made his peace with it. He has one question, and the door opens on the answer.\n\n'When the founder is gone, whose shadow will this be?'\n\nHe will hear the case out, and he may even be moved. Beside him the shadow swells and settles, slowly."
 POD_gratiano.0225.a: "Let [diplomacy_duelist.GetFirstNameNoTooltip] treat with him."
 POD_gratiano.0225.b: "The answer is mine to give."
 POD_gratiano.0225.effect.success.desc: "Something in the answer satisfies him, or amuses him enough. Tepelit inclines his head, and the shadow across the threshold thins until the cold on the far side reaches your face."
 POD_gratiano.0225.champion.failure.effect.desc: "Something in the answer fails: a word, perhaps, or merely its tone. The dark across the doorway closes over [diplomacy_duelist.GetFirstNameNoTooltip], taking last the smile [diplomacy_duelist.GetSheHe] always wore when afraid. Tepelit watches it close and settles back against the stone."
 POD_gratiano.0225.critical.failure.effect.desc: "You say the one thing he will not forgive. Tepelit does not answer, and the thing standing in the opening comes away from the stone and reaches for you while he watches."
 POD_gratiano.0225.success: "The shadow-door opens"
 POD_gratiano.0225.champion.failure: "The door devours your envoy"
 POD_gratiano.0225.critical.failure: "The door devours you"

 POD_gratiano.0226.t: "The First to Survive Him"
 POD_gratiano.0226.desc: "Montano stands alone where the cut stone gives way, with none of his shades behind him. The first of the founder's get to survive the Embrace, he has ruled the Sea of Shadows longer than you have been in the blood and watched it split along religious lines. Whatever he lost above, he still holds this threshold. Through all your open enmity, he has scarcely acknowledged you; now he waits in silence.\n\nBeyond him, the stair continues toward the founder. No envoy can take your place here."
 POD_gratiano.0226.a: "Then we settle it without words."
 POD_gratiano.0226.destroy: "Montano is destroyed"
 POD_gratiano.0226.escape: "Montano escapes you"
 POD_gratiano.0226.escape.tt: "The dark takes Montano before the matter is finished. The unfinished fight makes him your #EMP nemesis#!, and he knows the way back to you."
 POD_gratiano.0226.critical.failure: "Montano ends you"

 POD_gratiano.0227.t: "The Shifting Maze"
 POD_gratiano.0227.desc: "Beyond the last door lies a lightless maze whose walls are not stone. Passages close behind you and open where none stood before; a soul could walk here until Judgment without finding the center. The founder set the dark itself over his sleep, shaping it into a labyrinth around the place where a god lies down.\n\nYou fix your will on the pull at its heart and begin to walk. Somewhere in the folded dark, a familiar word finds you, gently: #italic Patience.#!"
 POD_gratiano.0227.desc.sybil: "Beyond the last door lies a lightless maze. Sybil goes first, one hand brushing a wall that is not stone. She turns where no passage can be seen and never errs. The thing that wove this place made her, and the labyrinth still hesitates over whose daughter she is, whatever the book says. With her leading, you descend farther than either of you could alone.\n\nBetween the walls, a familiar word keeps pace with you: #italic Patience.#!"
 POD_gratiano.0227.desc.answer: "\n\nThe borrowed memory remains fixed while the walls move around you. It holds one landmark no living eye was meant to find: the seam where the wound began. You keep that landmark at your right hand all the way down, following the course once taken by the will preserved in the memory."
 POD_gratiano.0227.a: "Find the heart of it."
 POD_gratiano.0227.effect.success.desc: "The pull at the center grows and grows until, between one shifting wall and the next, the maze gives you up. The founder's resting place lies open in front of you."
 POD_gratiano.0227.critical.failure.effect.desc: "The walls fold once too often, carrying the center beyond your bearings. You walk on until the dark closes over the place where you were."
 POD_gratiano.0227.critical.failure: "The maze keeps you"

###### Sybil's request (0254) ######

# 0254: the repudiated daughter's price, from quarterly sync once she wakes.
 POD_gratiano.0254.t: "The Name Her Father Struck Out"
 POD_gratiano.0254.desc: "Sybil is awake, and she owes you nothing. She names her price plainly, as an elder names a thing she has had centuries to decide she deserves. Her father cast her out, struck her name from the blood line, and told the few who knew of her that he had made no daughter at all. The long sleep has not dulled that injury.\n\n'I ask no daughter's favor,' she says. 'He had no right to erase me.'\n\nShe will walk her father's maze for you and open what lies under it. In return, you must restore her name in your own hand before the assembled Friends."
 POD_gratiano.0254.a: "Swear it. Her name goes back into the book."
 POD_gratiano.0254.b: "No. The book stays as the founder left it."
 POD_gratiano.0254.c: "Not yet. My table has no chair for her."
 POD_gratiano.0254.join.tt: "She swears into your #EMP coterie#!, and you swear to rescind her repudiation before the convocation. While she stands with you, she goes ahead of you into her father's dark, and you will get further under the castle than you would alone."
 POD_gratiano.0254.refuse.tt: "You will not stand before the Friends and unsay the founder's old spite for her. She withdraws the offer, and whatever she knows of the maze stays with her."

###### Vault resolution (0260-0279) ######

# 0260: the shrouded god (entry).
 POD_gratiano.0260.t: "The Shrouded God"
 POD_gratiano.0260.desc: "There is no body in the vault. Only dark remains, arranged in the shape of something sleeping. You stand at the heart of the maze and prepare to speak the calling. Shadows peel from the walls in sheets, faster than falling, and assemble the founder in the wrong order: hands first, then his great weight and the long architecture of his spine. The mouth arrives last.\n\nHe is vast and unaware of you. Now you must decide whose mouth meets him and how deeply it drinks."
 POD_gratiano.0260.a: "Drink deep. The blood is mine."
 POD_gratiano.0260.b: "Pass it hand to hand, and let the circle drink with me."
 POD_gratiano.0260.c: "Let the Assamite drink, as I promised."

# 0261: drink deep, preparation 0.
 POD_gratiano.0261.t: "The Founder's Own Plan"
 POD_gratiano.0261.desc: "You drink, and the blood brings everything the whispers promised along with something they concealed. The old god comes apart into you, still speaking. #italic Patience becomes you, childe.#! His voice settles inside your skull, as gentle as it was in the prison cell all those years ago.\n\n#italic Patience carried you exactly where I required. You condemned my elders and murdered my guardians. When I left the door ajar, hunger brought my son through it.#! You will be the #italic slayer#! of a god. Behind your thoughts, a second will lies coiled and content to wait."
 POD_gratiano.0261.a: "The god is dead. Let the silence have him."

# 0262: mid-feed reckoning (Elioud ladder).
 POD_gratiano.0262.t: "The Mountain Collects"
 POD_gratiano.0262.desc: "The heart's blood was promised at Alamut, on a night that seems a long way off.\n\nThe founder lies reassembled on the vault floor and the first mouthful is going down when a hand takes your jaw from behind and steel settles under your chin. The collector does not accuse you and does not ask for anything. He waited for the one breath in which a mouth full of a god would leave you slow. You have the length of one swallow to answer him."
 POD_gratiano.0262.a: "Break off. I answer him myself."
 POD_gratiano.0262.a.success: "The Mountain's man is broken"
 POD_gratiano.0262.maimed: "The god dies, and so nearly do you"
 POD_gratiano.0262.maimed.tt: "The draught breaks off. The founder is unmade all the same, but what you came down for is lost. Your wounds carry you into #EMP torpor#!, and you will wake in your own time."
 POD_gratiano.0262.b: "Let my champion take the stroke."
 POD_gratiano.0262.b.success.desc: "[prowess_duelist.GetFirstNameNoTooltip] is already moving before you understand what has hold of you. They clash over the founder's remains, and the fight ends quickly. The collector falls on the vault stone without securing his debt. You never stop drinking."
 POD_gratiano.0262.b.success: "Your champion kills the collector"
 POD_gratiano.0262.b.wounded.desc: "The stroke that would have opened your throat is turned a finger's width wide. Your champion keeps the man off you but cannot finish him. At length, he steps back out of reach and lets the dark take him. Alamut can send him again on another night. You drink on while someone stands over you, watching the door."
 POD_gratiano.0262.b.wounded: "Your champion turns the stroke"
 POD_gratiano.0262.b.grave.desc: "[prowess_duelist.GetFirstNameNoTooltip] is half a step slow and closes anyway. The stroke meant for your throat opens your champion instead, and the Mountain's man withdraws after taking a life in place of yours. The blood goes down without marking you. Behind you, a body settles onto the stone. When you next convene your table, your champion's chair remains empty."
 POD_gratiano.0262.b.grave: "Your champion falls in your place"

# 0263: drink deep, preparation 1 (torpor gamble).
 POD_gratiano.0263.t: "The Gamble of the Blood"
 POD_gratiano.0263.desc: "A flaw remains in the preparation tonight. The working sits poorly in your hands, though nothing in the vault reveals where it failed.\n\nYou drink anyway. The draught surges unlike any other blood, carrying the gathered weight of a thing that has slept since Rome fell. The founder is unmade with the first swallow, before you can reconsider."
 POD_gratiano.0263.desc.answer: "\n\nOne thing in you holds. You asked the Abyss once how a god is killed, and what came back was a memory you never lived. It knows where the grip closes. Your hands are already moving to meet it."
 POD_gratiano.0263.a: "The blood will not overwhelm me."
 POD_gratiano.0263.stand.desc: "The surge peaks and passes. You remain on your feet, holding the founder's blood without being consumed by it. You rise stronger than any fourth-generation vampire ought to be. Yet something came up with the blood: the old god's temper now circles through the dark you command, denied its rest."
 POD_gratiano.0263.stand: "You stand, god-blooded"
 POD_gratiano.0263.collapse.desc: "The blood overwhelms you, and the victory sends you into torpor beside the founder's remains. Everything you built must endure until you wake."
 POD_gratiano.0263.collapse: "The blood overwhelms you"
 POD_gratiano.0263.collapse.tt: "You fall into #EMP torpor#! from the god's blood. Your realm is not lost. It holds under a regent while you sleep, and you will wake in your own time. You cannot wake yourself early."

# 0264: drink deep, preparation 2 (prepared ascension).
 POD_gratiano.0264.t: "The Vessel Prepared"
 POD_gratiano.0264.desc: "This time the preparation holds. You went down into the dark yourself after those sent ahead stopped returning, and you came back carrying what it gave you.\n\nSybil holds him for you. Repudiated and still unyielding, she quiets the summoned shape with the sure hands of his own get, never looking at you as she works. Her father meant the rite for no other hand, yet hers masters it.\n\nThe drinking is clean, with room in you for every drop. You entered the vault as the fourth of your line and emerge as the third, with the old god's disciplines now your own. Sybil watches you rise from her father's remains in cold silence."
 POD_gratiano.0264.a: "Third of my line, then."

# 0265 - share the blood
 POD_gratiano.0265.t: "Passed Hand to Hand"
 POD_gratiano.0265.desc: "You do not finish it alone. The founder's blood passes around the circle, and the will that sought one mind is divided among every drinker. Split among you, it can master none.\n\nThe blood belongs to the whole circle. You leave the vault without a crown, your own thoughts intact.\n\nEach companion who drinks faces the same deadly risk you escaped."
 POD_gratiano.0265.a: "We drink it together."
 POD_gratiano.0265.share.tt: "You share the founder's blood with your #EMP coterie#!. Each drinker takes their own chance with it: empowerment, torpor, or final death. You stay fourth generation, and your mind stays wholly your own."
 POD_gratiano.0265.msg.empowered: "Risen from the draught"
 POD_gratiano.0265.msg.torpor: "Sunk into Torpor"
 POD_gratiano.0265.msg.burnout: "Burned to final death"

# 0266 - the long sleep ends (shared wake)
 POD_gratiano.0266.t: "Eight Years Under"
 POD_gratiano.0266.desc: "Eight years. Whether the dark thinned on its own or something reached in and hauled you out, the lost time will not return. Hunger is the first thing that makes sense, and it is enormous.\n\nThe affairs decided in your absence stayed decided; nobody waited for your leave. Unopened letters have yellowed in their stack, the topmost bearing an urgency long since spent. Out in the passage, a servant you do not know argues with one you remember."
 POD_gratiano.0266.a: "Rise. The night is not over."

# 0267 - the Assamite drinks
 POD_gratiano.0267.t: "The Mountain Collects"
 POD_gratiano.0267.desc: "You promised heart's blood, and the Mountain has sent a man to receive it. Until this moment, every step was yours to direct. Now you stand aside.\n\nHe kneels over the reconstructed god and drains every drop, the founder's heart passing down a stranger's throat while you stand near enough to smell it. The thing that rises is changed. It wipes its mouth without acknowledging you, steps around you without a word, and climbs toward the air with your promise to Alamut fulfilled."
 POD_gratiano.0267.a: "Let him drink. I keep my word."
 POD_gratiano.0267.blade.tt: "The Assamite blade drinks the founder's blood and rises as a #EMP fourth-generation, founder-blooded master assassin#! beyond your reach. Your heart's-blood promise is honored, so no Assamite vengeance follows you."

###### Assault & vault modifiers ######
 POD_gratiano_dominated_mind: "Dominated Mind"
 POD_gratiano_dominated_mind_desc: "The founder's plan completed itself inside him. A second will lies coiled behind his thoughts. Its command, #italic sleep, child; I will keep watch#!, surfaces in quiet hours alongside the dread of what his hands did while he was absent."
 POD_gratiano_spirit_displeasure: "The Balked Spirit"
 POD_gratiano_spirit_displeasure_desc: "The god was consumed imperfectly, and the Abyss remembers the theft. Every Abyss Mysticism ritual now costs its caster extra [stress|E]."
 POD_gratiano_assamite_vengeance: "Heart's-Blood Owed"
 POD_gratiano_assamite_vengeance_desc: "The debt to Alamut was sworn and broken in blood. No warning precedes the blades sent at irregular intervals. They will continue until the Mountain judges the account settled or the debtor is reduced to ash."
 POD_gratiano_godsblood_assassin: "Founder-Blooded"
 POD_gratiano_godsblood_assassin_desc: "After draining an Antediluvian, this assassin rose to the fourth generation. A god's vitae now empowers one of Alamut's deadliest blades."
 POD_gratiano_crown_of_shadows: "Crown of Shadows"
 POD_gratiano_crown_of_shadows_desc: "The Friends of the Night acclaimed you to the seat their founder left empty. You rule the Amici Noctis now, and the dread of the Abyss travels ahead of your name into every court that hears it."
 POD_gratiano_contested_crown: "Contested Crown"
 POD_gratiano_contested_crown_desc: "He took the seat despite half the assembly refusing the acclamation. Those dissenters now wait in the dark, and each year of his reign must be defended against them."

###### Assault values tooltip ######
 POD_gratiano_sway_tt: "[ROOT.ScriptValue('POD_gratiano_convocation_sway_value')|0] Friends stand ready behind you"

###### Regent of Shadows nickname ######
 nick_POD_gratiano_regent_of_shadows: "the Regent of Shadows"
 nick_POD_gratiano_regent_of_shadows.desc: "The Abyss answers to another now"

###### Convocation & endings ######

# 0280 - the convocation
 POD_gratiano.0280.t: "The Convocation"
 POD_gratiano.0280.desc: "The founder is unmade. His long unlife ended in the black heart of his own vault, and the blood at the clan's root has gone out of the world.\n\nYou convene the Amici Noctis, whose table you sit at by right, and lay the fact before them without ornament. Those who once spoke for him are absent or silent. Someone has cleared the head of the assembly, where an empty chair waits without dispute over precedence. Every Friend turns to hear what you want."
 POD_gratiano.0280.desc.outsider: "The news reaches the chamber before you. They already know that you opened a Sicilian vault and destroyed the thing sleeping at its bottom. For the first time in living memory, no founder's blood remains at the root of the clan.\n\nYou have no place at the Friends' table, so you take one. You pass faces that have laughed openly at your name since the night you were made and set the deed before them. The act commands their attention despite your lack of rank. The seat at the head of the assembly stands empty, and every face turns from it to you."
 POD_gratiano.0280.desc.circle: "\n\nWhat remains of the circle arranges itself behind you without prompting. [convocation_second.GetFirstNameNoTooltip] takes the place nearest your shoulder, watching the room rather than the speaker and making no secret of it. Whatever the Friends settle tonight, they will have to settle it aloud, with your people standing in the room."
 POD_gratiano.0280.desc.alone: "\n\nYou walk the length of the chamber alone. Your solitary footfalls make the absence at your shoulder plain to every Friend."
 POD_gratiano.0280.desc.dominated: "\n\nAnd beneath the assembly's silence, gentler than it has ever been, the voice that is not yours: #italic Take our seat.#!"
 POD_gratiano.0280.desc.witness.sybil: "\n\nSybil stands where the founder's own get once stood, watching you with an expression no one in the room can read. Most of the table could not name her. Her father denied her even to the few who knew of her. The elders nearest Sybil have left a chair empty on either side."
 POD_gratiano.0280.desc.witness.nahir: "\n\nNahir has come a long way on his own invitation. He accepts a place far down the table, where the wine reaches last, without complaint. He offers no counsel and casts no vote. He came to see what all of this has made of you, and his gaze never leaves you."
 POD_gratiano.0280.a: "No crown. Let the clan run free."
 POD_gratiano.0280.b: "Someone must sit there, and it will be me."

# 0281 - Reject the Crown (canon)
 POD_gratiano.0281.t: "The Crown Refused"
 POD_gratiano.0281.desc: "You set no crown on your own head. You have seen what a founder's children do with a throne and refuse to repeat it.\n\nThe chair at the head of the table stays empty behind you. Word runs ahead down every road the clan keeps: no one is coming to fill the place. Ancillae once told to wait out their centuries act at last. Quarrels formerly restrained by appeal to the founder reopen before the season turns. Within a year, Lasombra's blood will divide among a hundred feuding houses, each claiming to be the true one. You wanted the clan unbound; now it is."
 POD_gratiano.0281.desc.we: "You set no crown on your own head, and the refusal belongs to those who shared the draught and rose from it. They stand at your shoulder while you speak. For the first time, you answer as a company: #italic We did not unmake a god to become one.#!\n\nThe chair stays empty. Every dispute within the clan since Murcia fell can now be fought without appeal to a higher blood. You leave with companions at your side, a sight new to everyone who has watched the Lasombra rule alone. The arguing begins before you reach the door."
 POD_gratiano.0281.a: "Let it burn. I am no one's founder."

# 0282 - Claim the Throne
 POD_gratiano.0282.t: "The Crown"
 POD_gratiano.0282.desc: "You rise into the silence, and every face at the table knows what is coming. Your case needs few words: you killed the god whose seat stands empty before you.\n\nNo one moves to stop you. Down the table, a Friend turns a ring against the wood until it becomes the only sound in the room. Some of these elders once laughed at you loudly enough to be heard across their halls. Now they weigh the ash on your hands against everything they hold, uncertain which side carries more. The vote may be a pretense, but you still have to win it."
 POD_gratiano.0282.a: "Strength determines station."
 POD_gratiano.0282.effect.success.desc: "It carries. You are in the chair before the objections have finished forming, and at the far end of the table the ring has stopped turning."
 POD_gratiano.0282.success: "The Friends of the Night acclaim you with one voice. You take the seat of the #EMP Amici Noctis#! and the style of #EMP the Regent of Shadows#!."
 POD_gratiano.0282.contested.effect.desc: "Half the assembly rises with you. The rest remain seated, refusing you without troubling to speak. You take the chair despite them and will spend years discovering which dissenters meant it."
 POD_gratiano.0282.contested: "You take the crown over a divided assembly. Your reign begins under the #EMP Contested Crown#!."

# 0283 - Sybil's price falls due
 POD_gratiano.0283.t: "The Blank Place in the Book"
 POD_gratiano.0283.desc: "The Shunned Daughter claims her promised reward. Sybil gave you her father's maze and vault in exchange for one promise: before the gathered clan, you would denounce his repudiation and restore her name in the clan's history with your own hand.\n\nThe Friends have not gone far, and a summons will still reach them. 'My name. Before them all.' She asks as one of a god's get reclaiming what he had no right to take."
 POD_gratiano.0283.desc.torpor: "Sybil cannot come. She has returned to the earth beyond the reach of any voice, and no one here can say when or how she will rise.\n\nHer absence does not alter the bargain. She gave you her father's maze and vault for your word that the clan would hear her name restored. The Friends remain within summons, and the book lies open at the place her name was cut away. No one in the room will press her claim while she sleeps. You must decide what your word is worth."
 POD_gratiano.0283.a: "Her name goes back, before them all."
 POD_gratiano.0283.b: "She has served her purpose."
 POD_gratiano.0283.honor.tt: "You spend #EMP 500 [prestige|E]#! before the assembled Friends to rescind Sybil's repudiation. The debt is paid, and she stays sworn to you."
 POD_gratiano.0283.discard.tt: "You break your word. Sybil leaves your coterie and becomes your #EMP rival#!. If she is already your rival, she becomes your #EMP nemesis#!. She takes everything you taught her and everything she knew before you."
 POD_gratiano.0283.discard.torpor.tt: "You break your word while she is beyond reach. Sybil is turned out of your coterie and no rivalry can follow her there, but it will be waiting for her when she returns."
 POD_gratiano.0283.discard: "Sybil leaves your side. The repudiated daughter is repudiated a second time, and she knows exactly whose doing it was."

# 0286 - the shadow that got away
 POD_gratiano.0286.t: "The Shadow That Got Away"
 POD_gratiano.0286.desc: "Montano escaped into the dark before your stroke was finished and remained hidden beyond your reach.\n\nMuch later he surfaces at an hour of his choosing, without announcement. Whatever remains of the Sea of Shadows, he has brought none of it. Montano studies you in silence, measuring where to strike."
 POD_gratiano.0286.a: "He should not have come back."
 POD_gratiano.0286.survive.desc: "You turn his edge and drive him bleeding into the dark. He withdraws at a measured pace without looking back, leaving the duel unfinished."
 POD_gratiano.0286.survive: "Montano breaks off and goes. The old enemy withdraws to choose his own hour."
 POD_gratiano.0286.wounded.desc: "His edge finds you first. You are still standing when he breaks off, and he goes back the way he came without a sound. The bleeding takes a long while to stop."
 POD_gratiano.0286.wounded: "Montano cuts you and withdraws. His return restores the old rivalry long before the wound closes."

# 0287 - the burned allies
 POD_gratiano.0287.t: "Scorch Marks"
 POD_gratiano.0287.desc: "The clan remembers which elders fell during your ascent and assumes none of it was chance. Their surviving childer and clients preserve every grievance, even in courts you have never visited.\n\nNo one confronts you. The resentment shows itself more quietly: two of your letters this season have gone unanswered, both by men who once replied inside the week."
 POD_gratiano.0287.a: "What I took, I keep."
 POD_gratiano.0287.desc.shared: "Some of the elders' grudges have passed to people who never shared a room with you, distant enemies with ample patience.\n\nThose companions who drank beside you and survived are a more immediate concern. Each emerged altered after watching a god come apart within arm's reach. They know such a killing can be done and roughly what it requires. You have begun considering which of them poses the greatest danger."

###### Assamite vengeance ######

# 0291 - the blade in the night
 POD_gratiano.0291.t: "Sent to Collect"
 POD_gratiano.0291.desc: "Alamut was promised your heart's blood and has not been given it. The answer comes in person.\n\nBetween one hour and the next, a child of Haqim appears within your household. He has watched the household for days without being noticed. He claims no house, and his name will matter only if you survive long enough to learn it. Alamut sent him with a single instruction and no expectation of return. His steel is already moving when you see him."
 POD_gratiano.0291.a: "He should not have come alone."
 POD_gratiano.0291.a.success.desc: "You are faster"
 POD_gratiano.0291.a.success: "You destroy the Assamite sent against you. Another of Alamut's chosen returns to the Mountain as #EMP ash#!."
 POD_gratiano.0291.a.wounded.desc: "The Assamite wounds you"
 POD_gratiano.0291.a.wounded: "The Assamite wounds you."
 POD_gratiano.0291.a.grave.desc: "The stroke goes in to the bone"
 POD_gratiano.0291.a.grave: "The Assamite wounds you gravely before escaping. Alamut has not finished counting."

# 0292 - the mountain relents
 POD_gratiano.0292.t: "Word from the Mountain"
 POD_gratiano.0292.desc: "Three of Alamut's best have been reduced to ash. Somewhere in that thin air, unseen judges weigh the debt against the cost of collecting it. The blades stop coming.\n\nWeeks pass before an unsigned line in an unfamiliar hand reaches you by no road you can trace: 'The matter is closed.' The Mountain withholds forgiveness and recalls its assassins, leaving the blood in your veins."
 POD_gratiano.0292.a: "Good. I have other enemies."
 POD_gratiano.0292.a.toast: "Alamut closes the account. #EMP Heart's-Blood Owed#! is lifted, and no more blades come from the Mountain."

###### Dominated-mind ring (0270-0272) ######
 POD_gratiano.0270.t: "The Missing Hours"
 POD_gratiano.0270.desc: "You wake with ash on your tongue and no memory of the previous day. In the hall, servants speak easily of orders you gave last night in a voice nobody thought to question. One thanks you for a kindness you do not remember.\n\nBeneath your own thoughts, another presence settles into silence. Beside your hand stands a drained cup that you do not remember lifting; whoever cleared the board left it exactly where it was."
 POD_gratiano.0270.a: "I decide what my hands do."
 POD_gratiano.0270.b: "Those hours can stay lost."
 POD_gratiano.0270.b.tt: "Something was done with your hands while you were not looking. You choose not to learn what."
 POD_gratiano.0271.t: "The Buried Command"
 POD_gratiano.0271.desc: "A courier is dead, and your own seal is on the order that sent him. You have no memory of writing it. The command served another will, yet your household obeyed without a question from the writing desk to the road.\n\nThe hand was yours. The intent came from the founder's blood in you. Trace the order far enough and you may reach the will behind it. How deep are you willing to follow?"
 POD_gratiano.0271.a: "I will know whose hand moved mine."
 POD_gratiano.0271.b: "Bury it deeper."
 POD_gratiano.0271.b.tt: "Following the order down means meeting whatever sits at the bottom of it, so you let the courier stay dead and the question stay unasked."
 POD_gratiano.0272.t: "The Borrowed Voice"
 POD_gratiano.0272.desc: "Mid-sentence in your own hall, the words continue after you stop choosing them. Their cadence is older than the tongue you speak, drawn from a language the founder knew when the world was young. Your court leans in as though a better speaker had entered the room, and no one interrupts.\n\nYou cannot tell whether you are speaking or being spoken through. When the voice passes, it leaves you hollowed out and shaking as the founder settles again behind your thoughts."
 POD_gratiano.0272.a: "These are my words. Mine."
 POD_gratiano.0272.b: "Let it say its piece."
 POD_gratiano.0272.b.tt: "You give the voice its audience. Fighting it costs you more than letting it finish, and what it says in your hall it says in your name."

###### Orb of Dominion over the Shadows ######
# PoD key overrides; paired with POD_gratiano_orb_override.txt.
 POD_gratiano_orb_abyss_decision: "Plumb the Abyss"
 POD_gratiano_orb_abyss_decision_desc: "The Orb focuses the powers of shadow and conceals a deeper use. Close study opens the abyssal rites that elder Lasombra keep for themselves, a sorcery that treats with the dark on its own terms. One already versed in Obtenebration need only listen to what the Orb has been trying to teach."
 POD_gratiano_orb_abyss_decision_tooltip: "Draw #EMP Abyssal Sorcery#! (Abyss Mysticism) from the Orb of Dominion over the Shadows."
