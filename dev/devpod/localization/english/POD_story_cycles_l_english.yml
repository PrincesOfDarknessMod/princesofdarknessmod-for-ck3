 POD_story_lunar_auspice_theurge: "Crescent Moon's Communion"
 POD_story_lunar_auspice_theurge_desc: "Cool Text"
 POD_story_lunar_auspice_theurge_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Crescent Moon's Communion#!\n\nDespite the high spiritual attunement of the $POD_splat_garou$, many of them are ignorant of the intricacies of Spirit World. A Theurge may spend most of his lifetime in the [umbra|E] but only grasp mere fragments of the power it holds. But that hasn't stopped them from trying.\n\nTheurges earn $glossary_luna$'s Favor by using the #clickable Spirit Binding#! [character_interaction|E] on their [spirit_companions|E]. This binds the Spirit into an owned Caern, which provides the province or county with additional bonuses. Spirits can be found by exploring any realm within the [UmbraGlossary('spirit_wilds')], summoning them, or at the end of #V Spirit Quest#! [journeys|E]."

 POD_story_lunar_auspice_theurge_spirit_companions: "Spirit Companions"
