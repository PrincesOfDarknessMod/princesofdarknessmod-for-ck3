l_english:
 POD_story_pact: "#glow_color:{0.5,0,0,1} Demonic Pact#!"
 POD_story_pact_desc: "You bargained for power.\nWas it worth it?"

 #POD_story_pact_demon: "@demon_icon! Demon"
 POD_story_pact_custom_string: "#font:TitleFont;size:19;glow_color:{0.5,0,0,1} Pact signed with [Story.MakeScope.Var('demon').Char.GetFirstName]#!\n#glow_color:{0.25,0,0,75} [demonic_pact_obligation|E]: [Localize(Concatenate('POD_obligation_', Story.MakeScope.GetVariable('obligation').GetFlagKey))|U]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactFrequencyAndStatus')]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactDeadline')]\nIf you #X break#! the pact:\n[GetScriptedGui('POD_sidebar_show_demonic_pacts').BuildTooltip(GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('obligation', MakeScopeFlag(Story.MakeScope.GetVariable('obligation').GetFlagKey)).AddScope('consequence', MakeScopeFlag(Story.MakeScope.GetVariable('consequence').GetFlagKey)).End)]\nThis [demonic_pact|E] is worth [Story.MakeScope.GetVariable('perk_points_gained').GetValue|0V] [investiture_lifestyle|E] [perk|E] [Select_CString( EqualTo_CFixedPoint( Story.MakeScope.GetVariable('perk_points_gained').GetValue, '(CFixedPoint)1' ), 'point', 'points' )]#!"

 POD_story_pact_deadline_normal: "#N Next tribute due in [story.MakeScope.GetVariable('years_until_obligation').GetValue|0V] [Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('years_until_obligation').GetValue, '(CFixedPoint)1' ), 'year', 'years' )]#!"
 POD_story_pact_deadline_fresh: "#N Next tribute due in [story.MakeScope.GetVariable('frequency').GetValue|0V] [Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('frequency').GetValue, '(CFixedPoint)1' ), 'year', 'years' )]#!"
 POD_story_pact_deadline_urgent: "#X The tribute falls due within the year \nhonour the [demonic_pact_obligation|E] now or pay the price!#!"
 POD_story_pact_deadline_prohibitory: "#weak This prohibition must be upheld at all times.#!"
 POD_story_pact_deadline_completed: "The demon will demand it again in [story.MakeScope.GetVariable('years_until_obligation').GetValue|0V] [Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('years_until_obligation').GetValue, '(CFixedPoint)1' ), 'year', 'years' )]."
 POD_story_pact_deadline_completed_nodate: "#P Obligation fulfilled -- not currently due.#!"

 # Toast fired by the pact story cycle one year before a tribute falls due.
 POD_story_pact_deadline_warning.toast: "#X [pact_demon.GetFirstName]'s pact comes due within the year.#!"
 POD_story_pact_deadline_warning_desc: "Honor the pact now, or pay the price."

 POD_story_pact_prohibitory: "Status: #X Prohibitory#!"
 POD_story_pact_frequency_completed: "[demonic_pact_frequency|E]: Every [story.MakeScope.GetVariable('frequency').GetValue|0V] years#!\nStatus: #P Completed#!"
 POD_story_pact_frequency_notcompleted: "[demonic_pact_frequency|E]: Every [story.MakeScope.GetVariable('frequency').GetValue|0V] years#!\nStatus: #N Pending#!"

 # Story Cycle - Asakku Depth Accumulation
 POD_asakku_depth_accumulation: "The Watcher at the Well"
 POD_asakku_depth_accumulation_desc: "An entity older than memory has noticed your blood. Whether a fever in the Beast or demons from forgotten episodes of Genesis you don't know, but you are afraid to find out as it creeps closer and closer to your very soul."

 # Visualization labels
 POD_asakku_story_custom_string: "Andeleon has the following unique content to represent the Asakku infection. \n\n#bold Asakku Corruption#! tracks the entity's hold over you as a value from 1 to 100, shown as a character modifier. It accumulates slowly over time and faster when you act in its interest. Four thresholds at #bold 25, 50, 75,#! and #bold 100#! mark irreversible changes: a new trait, new abilities, and escalating attention from those who hunt the infection.\n\n#bold Spreading the Asakku#! - Vicissitude is the entity's vector. Characters who carry the discipline are susceptible. The [soul_infection|E] scheme plants the presence in a willing or unwitting host. Once fully Asakku, [blood_inception|E] works faster but requires an imprisoned target.\n\n#bold The Shadow Crusade#! - The Tal'Mahe'Ra knows what you are. As the corruption grows, the Elioud, Kindred trained to identify and eliminate the contagion, will mobilize against you. \n\n#bold The Watcher at the Well#! - Four campaign objectives drive the Asakku's expansion: spread the infection, deepen the corruption, claim the ancient seats of power, and bring the eastern hunters to heel. Each phase demands more of the world and more of you."
 POD_asakku_story_depth_label: "Asakku Corruption"
 POD_asakku_story_depth_min_label: "Untouched"
 POD_asakku_story_depth_max_label: "Iryi Ascendant"

 ######################################################
 # Mary the Black — Journey story cycle
 ######################################################
 POD_maryb_story: "#glow_color:{0.75,0.5,0.21,0.5}The Black Dream#!"
 POD_maryb_story_desc: "Three tablets and a path that ends in a chapel beneath the Hagia Sophia. Mary the Black walks it again."

 # Narrative header shown in the story panel. The text is path-aware: the
 # custom_string_key resolves this dispatcher, which hands off to the
 # POD_maryb_story_phase customizable_localization (POD_maryb_custom_loc.txt)
 # so the prose tracks Mary's progress and, after the Deal with Michael, the
 # ending she reached. Tablet cities are clickable title links.
 POD_maryb_story_custom_string: "[Story.GetOwner.Custom('POD_maryb_story_phase')]"

 # --- Phase strings selected by POD_maryb_story_phase ---

 # Pre-resolution, still gathering the tablets (also the pre-arc fallback).
 POD_maryb_story_phase_seeking: "Pieces of yourself are scattered through the cities of the Levant; bound in clay. Two tablets written in your own blood, and one in a dead priest hand, waiting in #bold [GetTitleByKey('c_damascus').GetNameNoTier]#!, #bold [GetTitleByKey('c_mosul').GetNameNoTier]#! and #bold [GetTitleByKey('c_baghdad').GetNameNoTier]#!. Take a city, recover its tablet, and a little more of what she was returns to you.\n\n#shinygold It all leads back to me, beloved. You will see.#!"

 # Pre-resolution, all three recovered: the fourth tablet waits to be written.
 POD_maryb_story_phase_stylus: "Three tablets recovered, three buried lives remembered, and the clay of the fourth lies wet beneath her hand. There is nothing left in the Levant to find. What remains is to take up the stylus and write the ending, and to decide, with it poised above the clay, whose ending it will be.\n\n#shinygold Whenever you are ready, beloved. I have waited longer than you can know.#!"

 # Ending: The Black Dream (Mary dominant; Michael silenced forever).
 POD_maryb_story_phase_blackdream: "The tablets are read, the fourth is written, and the silence of the chapel belongs to you alone. Michael has an ending now. The Dream is yours now, and the only question left is how corrupt a Dream can grow before it turns to Nightmare."

 # Ending: The Second Dream (Michael risen in Mary's flesh). All his voice.
 # "re-embrace" links the receive_into_the_dream game concept.
 POD_maryb_story_phase_seconddream: "#shinygold Mary the Black is dead. There was only ever the Dream, and the woman who carried it home, and now I wear the flesh she kept for me. Your Baali blood may yet be of use. I shall [Concept('receive_into_the_dream', 're-embrace')|E] the world into the dream.#!"

 # Ending: Ash and Gold (the synthesis). Shared body, then an ascendancy clause
 # appended by the mary / michael variant keys below.
 POD_maryb_story_ashgold_body: "Something else stands where Mary and Michael, and it answers to both names. Neither erased; neither won. The thing they made looks out through one pair of eyes, and which of them is streeing shifts with a tide that no will commands.\n\nWe can now rebuild the Trinity. We will need a [GetCourtPositionType('pillar_of_darkness_court_position').GetName()] and a [GetCourtPositionType('pillar_of_light_court_position').GetName()]."

 POD_maryb_story_phase_ashgold_mary: "$POD_maryb_story_ashgold_body$\n\nRight now it is Mary who looks out: the eyes gone shadowed, the old hunger riding close beneath the skin."
 POD_maryb_story_phase_ashgold_michael: "$POD_maryb_story_ashgold_body$\n\n#shinygold Right now it is Michael who looks out: the regard certain, the old radiance worn to burnished gold.#!"
 POD_maryb_story_phase_ashgold_neutral: "$POD_maryb_story_ashgold_body$"

 # Balance (tug-of-war) labels. Reused post-resolution on the Ash and Gold path,
 # where the bar swings fully to whichever half is currently ascendant, so the
 # end-caps read as ascendancy rather than a permanent victory.
 POD_maryb_story_balance_label: "Mary & Michael"
 POD_maryb_story_balance_min_label: "#shinygold Michael Ascendant#!"
 POD_maryb_story_balance_max_label: "#P Mary Ascendant#!"

 # Tablets (basic counter) labels
 POD_maryb_story_tablets_label: "Tablets recovered"
 POD_maryb_story_tablets_min_label: "None"
 POD_maryb_story_tablets_max_label: "All three"