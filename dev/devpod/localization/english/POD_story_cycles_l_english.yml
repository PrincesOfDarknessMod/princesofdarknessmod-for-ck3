l_english:
 POD_story_pact: "#glow_color:{0.5,0,0,1} Demonic Pact#!"
 POD_story_pact_desc: "You bargained for power.\nWas it worth it?"

 #POD_story_pact_demon: "@demon_icon! Demon"
 POD_story_pact_custom_string: "#font:TitleFont;size:19;glow_color:{0.5,0,0,1} Pact signed with [Story.MakeScope.Var('demon').Char.GetFirstName]#!\n#glow_color:{0.25,0,0,75} [demonic_pact_obligation|E]: [Localize(Concatenate('POD_obligation_', Story.MakeScope.GetVariable('obligation').GetFlagKey))|U]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactFrequencyAndStatus')]\nIf you #X break#! the pact:\n[GetScriptedGui('POD_sidebar_show_demonic_pacts').BuildTooltip(GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('obligation', MakeScopeFlag(Story.MakeScope.GetVariable('obligation').GetFlagKey)).AddScope('consequence', MakeScopeFlag(Story.MakeScope.GetVariable('consequence').GetFlagKey)).End)]\nThis [demonic_pact|E] is worth [Story.MakeScope.GetVariable('perk_points_gained').GetValue|0V] [investiture_lifestyle|E] [perk|E] [Select_CString( EqualTo_CFixedPoint( Story.MakeScope.GetVariable('perk_points_gained').GetValue, '(CFixedPoint)1' ), 'point', 'points' )]#!"

 POD_story_pact_prohibitory: "Status: #X Prohibitory#!"
 POD_story_pact_frequency_completed: "[demonic_pact_frequency|E]: Every [story.MakeScope.GetVariable('frequency').GetValue|0V] years#!\nStatus: #P Completed#!"
 POD_story_pact_frequency_notcompleted: "[demonic_pact_frequency|E]: Every [story.MakeScope.GetVariable('frequency').GetValue|0V] years#!\nStatus: #N Pending#!"

 # Story Cycle - Asakku Depth Accumulation
 POD_asakku_depth_accumulation: "The Watcher at the Well"
 POD_asakku_depth_accumulation_desc: "An entity older than memory has noticed your blood. Each year it sinks a little deeper. There is no negotiation, only the slow tide and what waits at the end of it."

 # Visualization labels
 POD_asakku_story_custom_string: "Andeleon has the following unique content to represent the Asakku infection. \n\n#bold Asakku Corruption#! tracks the entity's hold over you as a value from 1 to 100, shown as a character modifier. It accumulates slowly over time and faster when you act in its interest. Four thresholds at #bold 25, 50, 75,#! and #bold 100#! mark irreversible changes: a new trait, new abilities, and escalating attention from those who hunt the infection.\n\n#bold Spreading the Asakku#! - Vicissitude is the entity's vector. Characters who carry the discipline are susceptible. The [soul_infection|E] scheme plants the presence in a willing or unwitting host. Once fully Asakku, [blood_inception|E] works faster but requires an imprisoned target.\n\n#bold The Shadow Crusade#! - The Tal'Mahe'Ra knows what you are. As the corruption grows, the Elioud, Kindred trained to identify and eliminate the contagion will mobilize against you. \n\n#bold The Watcher at the Well#! - Four campaign objectives drive the Asakku's expansion: spread the infection, deepen the corruption, claim the ancient seats of power, and bring the eastern hunters to heel. Each phase demands more of the world and more of you."
 POD_asakku_story_depth_label: "Asakku Corruption"
 POD_asakku_story_depth_min_label: "Untouched"
 POD_asakku_story_depth_max_label: "Iryi Ascendant"