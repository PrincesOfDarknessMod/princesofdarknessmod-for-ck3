l_english:
 POD_story_pact: "#glow_color:{0.5,0,0,1} Demonic Pact#!"
 POD_story_pact_desc: "You bargained for power.\nWas it worth it?"

 #POD_story_pact_demon: "@demon_icon! Demon"
 POD_story_pact_custom_string: "#font:TitleFont;size:19;glow_color:{0.5,0,0,1} Pact signed with [Story.MakeScope.Var('demon').Char.GetFirstName]#!\n#glow_color:{0.25,0,0,75} [demonic_pact_obligation|E]: [Localize(Concatenate('POD_obligation_', Story.MakeScope.GetVariable('obligation').GetFlagKey))|U]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactFrequencyAndStatus')]\nIf you #X break#! the pact:\n[GetScriptedGui('POD_sidebar_show_demonic_pacts').BuildTooltip(GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('obligation', MakeScopeFlag(Story.MakeScope.GetVariable('obligation').GetFlagKey)).AddScope('consequence', MakeScopeFlag(Story.MakeScope.GetVariable('consequence').GetFlagKey)).End)]\nThis [demonic_pact|E] is worth [Story.MakeScope.GetVariable('perk_points_gained').GetValue|0V] [investiture_lifestyle|E] [perk|E] [Select_CString( EqualTo_CFixedPoint( Story.MakeScope.GetVariable('perk_points_gained').GetValue, '(CFixedPoint)1' ), 'point', 'points' )]#!"

 POD_story_pact_prohibitory: "Status: #X Prohibitory#!"
 POD_story_pact_frequency_completed: "[demonic_pact_frequency|E]: Every [story.MakeScope.GetVariable('frequency').GetValue|0V] years#!\nStatus: #P Completed#!"
 POD_story_pact_frequency_notcompleted: "[demonic_pact_frequency|E]: Every [story.MakeScope.GetVariable('frequency').GetValue|0V] years#!\nStatus: #N Pending#!"

 # Story Cycle - Asakku Depth Accumulation
 POD_asakku_depth_accumulation: "The Watcher at the Well"
 POD_asakku_depth_accumulation_desc: "An entity older than memory has noticed your blood. Whether a fever in the Beast or demons from forgotten episodes of Genesis you don't know, but you are afraid to find out as it creeps closer and closer to your very soul."

 # Visualization labels
 POD_asakku_story_custom_string: "Andeleon has the following unique content to represent the Asakku infection. \n\n#bold Asakku Corruption#! tracks the entity's hold over you as a value from 1 to 100, shown as a character modifier. It accumulates slowly over time and faster when you act in its interest. Four thresholds at #bold 25, 50, 75,#! and #bold 100#! mark irreversible changes: a new trait, new abilities, and escalating attention from those who hunt the infection.\n\n#bold Spreading the Asakku#! - Vicissitude is the entity's vector. Characters who carry the discipline are susceptible. The [soul_infection|E] scheme plants the presence in a willing or unwitting host. Once fully Asakku, [blood_inception|E] works faster but requires an imprisoned target.\n\n#bold The Shadow Crusade#! - The Tal'Mahe'Ra knows what you are. As the corruption grows, the Elioud, Kindred trained to identify and eliminate the contagion, will mobilize against you. \n\n#bold The Watcher at the Well#! - Four campaign objectives drive the Asakku's expansion: spread the infection, deepen the corruption, claim the ancient seats of power, and bring the eastern hunters to heel. Each phase demands more of the world and more of you."
 POD_asakku_story_depth_label: "Asakku Corruption"
 POD_asakku_story_depth_min_label: "Untouched"
 POD_asakku_story_depth_max_label: "Iryi Ascendant"

 POD_story_spell_of_life_explanation: "Quest for the [Concept('POD_spell_of_life', 'Spell Of Life')|E]"
 POD_story_spell_of_life_explanation_desc: "The Spell of Life allows the creation of $POD_splat_mummy_plural$, granting them immortality through a cycle of death and rebirth. Few have ever learned it. If you wish to join their number, the path shall be long one."

 POD_story_spell_of_life_explanation_custom_string: "If you wish to learn the Spell of Life yourself, you will need to complete a long quest and obtain more [trait_level_track_xp|E] in [GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )]'s Spell of Life track.\n\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLInProgressQuest')]"
 POD_story_spell_of_life_explanation_inprogress: "#T Many Paths#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage1Desc')]\n\n#T Many Roads#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage2Desc')]\n\n#T The Gatekeepers#!\nImmediately after reaching 90 [trait_level_track_xp|E], several factions will attack you, seeking to steal your research and punish you for your hubris.\n\n#T The Final Gambit#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage4Desc')]\n\n#R Be prepared to sacrifice everything in the quest for true immortality, for the path is fraught with danger!#![GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage3Task')]"
 POD_story_spell_of_life_explanation_complete: "Having achieved a feat few have ever accomplished, new opportunities present themselves. [character_interaction|E]s allow you to create new $POD_splat_mummy_plural$, ask others to create $POD_splat_mummy_plural$, or teach the Spell of Life to others. Objectives may offer interesting paths or allow you to teach the Spell of Life, if that is currently restricted.\n\nWith such power, the world lays at your feet. Will you create a race of mummies to enact your terrible vengeance or reshape the world in your image? Will you uphold or disrupt the balance? Will you tear the veil between life and death?"

 POD_story_spell_of_life_explanation_stage1_brief: "The first stage offers 4 paths, consisting of several decisions. Completing an entire path may yield rewards in later stages."
 POD_story_spell_of_life_explanation_stage1_full: "The first stage offers 4 paths, each consisting of 3 decisions. A few characters have already taken the first steps down a path, and not all paths are available to everyone or in all bookmarks. Completing an entire path may yield rewards in later stages.\n#bold Horus#!\n$BULLET_WITH_TAB$Offer Lower Egypt to Horus\n$BULLET_WITH_TAB$Convince Horus to aid you\n$BULLET_WITH_TAB$Eliminate the Setite threat\n#bold Kemintiri#!\n$BULLET_WITH_TAB$Befriend Kemintiri, obtain the Isis Fragments, and retake key sites\n$BULLET_WITH_TAB$Find some of Kemintiri's old friends\n$BULLET_WITH_TAB$Wipe out House Tawaret\n#bold Cabirus#!\n$BULLET_WITH_TAB$Obtain the Secret Writings of Cabirus\n$BULLET_WITH_TAB$Learn sorcery and recruit sorcerers\n$BULLET_WITH_TAB$Weaken the Tremere threat to Cabirus\n#bold Experimentation#!\n$BULLET_WITH_TAB$Torture an imprisoned mummy and some potential sorcerers\n$BULLET_WITH_TAB$Convince your family or fellow believers to aid you\n$BULLET_WITH_TAB$Imprison a great many people, obtain a few artifacts, and conquer a highly-populated land"

 POD_story_spell_of_life_explanation_stage2_brief: "After reaching 30 [trait_level_track_xp|E], complete [journeys|E] to obtain clues and study under the few that know even a snippet of the Spell of Life."
 POD_story_spell_of_life_explanation_stage2_full: "After reaching 30 [trait_level_track_xp|E], you will no longer be able to complete the decisions from the earlier paths. Instead, complete [journeys|E] to obtain clues and to study under the few that know even a snippet of the Spell of Life. The particularly scholarly or magically may be able to passively study the Spell and further their knowledge. In addition, those close to $POD_splat_mummy_plural$ and those that hold certain [counties|E] #TOOLTIP:MUMMY_SOL_PASSIVE_county_explanation #L associated with Osiris' death#!#! will passively gather certain insights."

 POD_story_spell_of_life_explanation_stage3_notask: ""
 POD_story_spell_of_life_explanation_stage3_task: "\n\nTo progress, #T #X SURVIVE!#!#!"

 POD_story_spell_of_life_explanation_stage4_brief: "Should you survive, a [UmbraGlossary('shadow_realm')] will need to be obtained so that you may complete the Spell of Life."
 POD_story_spell_of_life_explanation_stage4_full: "A [UmbraGlossary('shadow_realm')] will need to be obtained so that you may complete the Spell of Life by tying the ritual to that realm. Unless joining a well-established and stable realm like [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], you will need to fight through hordes of #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L spectres#!#! before you may finish your quest, a risky proposition for even the strongest ruler."
