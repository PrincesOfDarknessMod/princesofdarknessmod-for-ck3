# Gratiano content: Abyss Mysticism localization

 delve_rituals_of_darkness_decision: "Delve the Rituals of Darkness"
 delve_rituals_of_darkness_decision_desc: "The Shadowed hide their rites in oaths and in the flesh of murdered apprentices. The Abyss forgets none of them. Within a sealed Oubliette, a mystic may follow the scars those workings left in the dark and recover what no living master will willingly teach. The search is slow, and what surfaces changes from one decade to the next."
 delve_rituals_of_darkness_decision_effect_tt: "#T Delve for a new [bs_ritual|E].#!\nThe Abyss raises as many as #V 3#! rites you do not know, weighted toward the lesser workings nearer the surface. Keep #V 1#!; the others sink again. The delving cannot be repeated for years, and a finer Oubliette shortens the wait."
 delve_rituals_of_darkness_decision_confirm: "Follow the scars"
 delve_rituals_of_darkness_decision_tooltip: "Draw as many as #V 3#! Abyssal Mysticism [bs_rituals|E] out of the dark and keep one. The scars will not open again for years."
 delve_rituals_cooldown_tt: "You delved too recently. The scars will not open again for years."
 delve_rituals_none_learnable_tt: "You already know every rite the Abyss can raise at your level of Abyssal Mysticism."

 POD_gratiano.0300.t: "The Last Lamp Out"
 POD_gratiano.0300.desc: "The syllables run for hours before anything answers. You put the lamps out one at a time. When the last dies, the far wall stands a pace farther away than it did at dusk, though nothing in the room has moved.\n\nAn afterimage hangs where the flame was, narrow as a wound. Something waits within it, pale and swollen like a corpse kept too long in water. Pressure builds behind your ears. Whatever lies on the far side of the quiet has paused to see whether you are fool enough to reach for it."
 POD_gratiano.0300.opt.subsume_the_darkness: "Take the rite that drinks a wound closed."
 POD_gratiano.0300.opt.abyssal_blade: "Learn what the steeping does to steel."
 POD_gratiano.0300.opt.one_with_the_dark: "Offer the dark a name, and ask what it hides."
 POD_gratiano.0300.opt.summoning_the_blatherskites: "Open the cracks beneath my enemy's house."
 POD_gratiano.0300.opt.claiming_the_dark: "Make my dead flesh a vessel."
 POD_gratiano.0300.opt.call_the_legion: "Give the dark a standard."
 POD_gratiano.0300.opt.boukephos_gateway: "Take up Boukephos' vigil."
 POD_gratiano.0300.opt.syllable_of_unbeing: "I will have the word that unnames dawn."
 POD_gratiano.0300.opt.ahrimans_beckoning: "Learn the grasp that crosses courts."
 POD_gratiano.0300.tt.subsume_the_darkness: "#T Subsume the Darkness#!\nThe rite drinks your shallow wounds closed; what fire and sun have burned into you it will not touch. For a #bold year#! afterward it keeps drinking, and each mortal you open slakes only half as much hunger as before.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.tt.abyssal_blade: "#T The Abyssal Blade#!\nSteel is drowned in living blood until the blood goes black. The blade then drinks each death a moment before the body falls, lending it a dreadful edge. The steeping permanently consumes #bold half#! the steel's endurance.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.tt.one_with_the_dark: "#T What the Dark Keeps#!\nName a soul and the Abyss reads it, then hands you what that soul hides: one secret, sometimes a second, sometimes a third. Every faith but the Road of the Abyss calls the reading sacrilege (#bold -150 piety#! unless you walk it).\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.tt.summoning_the_blatherskites: "#T Summoning the Blatherskites#!\nA headless knot of too many limbs soaks into an enemy's seat and gnaws #bold five years#! of order out of it, making mouthless noise inside the walls the whole while.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.tt.claiming_the_dark: "#T Claiming the Dark#!\nYour dead flesh becomes a vessel for borrowed #bold prowess#! scaled to your Obtenebration. The #bold Abyss-Touched#! mark deepens, while fire and sun inflict #bold double#! damage for as long as you hold the dark.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.tt.call_the_legion: "#T Call the Legion#!\nThree tireless cohorts of shades muster beneath your standard without payment in coin. They draw provisions like a living host and remain yours until destroyed.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.tt.boukephos_gateway: "#T Boukephos' Gateway#!\nKeep vigil through dawn before a mirror that returns no face. The rite opens a door behind the heart that will never shut and sets you on the #bold Road of the Abyss#!. Every rite of the deep dark then demands #bold less will#!.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.tt.syllable_of_unbeing: "#T The Syllable of Unbeing#!\nLays the #bold Syllable of Unbeing#! over you: the sun cannot find you, and you cease to fear it, for as long as the word holds. When the sun finds you at last, the Syllable fails within #bold thirty nights#!, and the Abyss may exact a delayed price.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.tt.ahrimans_beckoning: "#T Ahriman's Beckoning#!\nThe Abyss reaches into any court within your grasp and sets one living prize at your feet, quieter than before. Their people will know who took them.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_gratiano.0300.learned_toast: "A rite is raised out of the deep"
 POD_gratiano.0300.z: "Let it sink. I will not reach again for years."

 POD_gratiano.0310.t: "The Attention Stays"
 POD_gratiano.0310.desc: "The working closed a night ago, and by now the walls ought to be walls again. A cup left standing since then is warm on the side that faced the empty room. Smoke from a snuffed wick still hangs an arm's length above it, going nowhere.\n\nWhatever raised its head as the working passed through remains attentive. The corners stay empty; the presence needs no body. It regards you for a second night from the chamber you thought you had cleared."
 POD_gratiano.0310.a: "It looked up. Let it find me unafraid."

 POD_gratiano_abyssal_blade_no_weapon_tt: "#weak No unclaimed weapon was equipped when the rite closed, so nothing was steeped. The [stress|E] is spent regardless.#!"
 POD_gratiano_abyssal_blade_already_steeped_tt: "Your equipped weapon already carries the dark. A blade can be claimed only once."

 let_the_darkness_go_decision: "Let the Darkness Go"
 let_the_darkness_go_decision_desc: "Your claim on the dark remains an open bargain. Release it, and the Abyss pours out of your dead flesh, taking the borrowed strength and your heightened vulnerability to flame."
 let_the_darkness_go_decision_effect_tt: "#T Release the claimed dark.#!\nThe held claim is removed: the borrowed [prowess|E] goes, and fire and sunlight lose their doubled purchase on you."
 let_the_darkness_go_decision_confirm: "Open the hand"
 let_the_darkness_go_decision_tooltip: "Release the claimed dark. The borrowed [prowess|E] goes, and fire and sun no longer deal double damage to you."
 POD_gratiano_claiming_already_held_tt: "You already hold a claim on the dark. Release it with the $let_the_darkness_go_decision$ [decision|E] before claiming anew."

###### Tier 3 casts & botches ######

 POD_gratiano_one_with_the_dark_reveal_tt: "One [secret|E] your target keeps is revealed to you alone, with a #V 50%#! chance of a second and a #V 25%#! chance of a third."
 POD_gratiano_one_with_the_dark_fallback_tt: "Your target keeps no [secret|E] the dark can lift. Instead, the reading exposes a weakness and grants you a weak [hook|E] on them plus Intrigue [lifestyle|E] experience."
 POD_gratiano_blatherskites_no_lands_tt: "#weak Your target holds no [county|E] for the swarm to infest, so nothing is loosed. The [stress|E] is spent regardless.#!"

 POD_gratiano.0311.t: "The Narrow Way Back"
 POD_gratiano.0311.desc: "Frost blooms along the underside of your shadow when the lamps go down and lingers until an hour before dawn. No physician finds a wound, yet the shadow aches where darkness passed through it.\n\nThe working reached its destination and did what was asked. The harm came on the return. Something stretched itself thin along your shadow to cross back, leaving a tear that will close slowly."
 POD_gratiano.0311.a: "Given time, it will close."

 POD_gratiano.0312.t: "A Tune Nobody Owns"
 POD_gratiano.0312.desc: "By the second night, a groom hums the rite's last syllable over his work. He cannot have heard the sound or known its tongue, and looks startled when you ask where he learned it.\n\nThen a guest asks about 'the old practices of the house' with studied casualness. When you wait for him to explain, he says nothing more. Somewhere below, a thread of your working slipped free and carried its last syllable upward, within reach of any attentive ear."
 POD_gratiano.0312.a: "No one hums it twice where I sleep."
 POD_gratiano.0312.trust_tt: "#R -2 Standing at court#!\nRumors of your secret working now circulate at court."

 POD_gratiano.0313.t: "Something Stayed"
 POD_gratiano.0313.desc: "Something came up through the working and remained.\n\nAt the end of the west hall, it appears when the lamp passes and vanishes before the light returns. It neither moves nor speaks. Its shape comes near enough to a person that the eye keeps trying to complete it, always wrongly. On the third night, someone leaves a bowl for it. By morning the untouched bowl is gone, and no one admits to having moved it."
 POD_gratiano.0313.a: "A year of it, and no more."

 POD_gratiano.0315.t: "In Your Own Voice"
 POD_gratiano.0315.desc: "A courtier is speaking in your voice. The imitation is exact, down to the cadence, though the words come from a mouth that has no business holding them. He remains unaware while everyone else looks politely aside.\n\nThe reading opened both ways. You set the dark upon another soul and stood in the passage while it worked. Your own secrets escaped past you, spoken into unseen ears that remember what they hear."
 POD_gratiano.0315.a: "I knew the risk when I opened it."
 POD_gratiano.0315.nothing_tt: "#weak You keep nothing hidden that the dark can carry away. It passes through you and returns with nothing to reveal.#!"

 POD_gratiano.0316.t: "Too Many Fingers"
 POD_gratiano.0316.desc: "Wet handprints mark the rafters by morning, each with too many fingers. The summoning laid a scent whose trail runs back to your own threshold.\n\nPart of the swarm has followed it home, fewer and quieter than those you sent. Beyond the last light, their mouthless noises draw nearer each night. Soon they will reach whatever waits at your door."
 POD_gratiano.0316.a: "Vermin of my own making."
 POD_gratiano.0316.homeless_tt: "#weak You hold no seat for them to infest. The blatherskites follow the trail back, find only open road where a threshold should be, and return below.#!"

 POD_gratiano.0317.t: "The Gate Pulls"
 POD_gratiano.0317.desc: "The gate remains open behind your heart, beyond the reach of any closing rite. The rite's last syllable reversed the passage and drew your mind through the gap.\n\nYour thoughts drained away like water from a cistern. The blood must lie still and sleep while the will recovers. Throughout that slumber, the gate will remain open."
 POD_gratiano.0317.a: "Then I pay the toll asleep."

###### Tier 4: Call the Legion & Boukephos' Gateway ######

 POD_gratiano_minacious_legion_army: "The Minacious Legion"

 POD_gratiano_gateway_already_open_tt: "Your gateway already stands open. There is no rite for opening a door twice."

 POD_gratiano.0320.t: "The Mirror Returns"
 POD_gratiano.0320.desc.keeper: "On the seventh night, a mirror appears in a room where no one hung one. It returns no face. The rite prescribed no second vigil, yet one comes due and is kept, awake or otherwise.\n\nSomething on the far side takes your measure through the black glass. It has been waiting since before Alexander marched and shows no sign of haste. The watcher may be the rite's first maker or only the impression he pressed into the working; no answer distinguishes them. A faintly warm voice crosses the glass: 'So. Another shoulder for the door.'"
 POD_gratiano.0320.desc.framed: "On the seventh night, the rite's first maker is occupied by troubles of his own. His house has drawn back from him over a deed planted in the memories of witnesses who determine his standing, and he will not soon escape the disgrace.\n\nNone of that reaches the glass. The impression he pressed into the working attends you without distraction. The mirror offers neither face nor message and remains until the night ends."
 POD_gratiano.0320.desc.outlived: "The far side of the mirror is vacant, its black glass reflecting no face.\n\nOn the seventh night it stands in a room that was empty when you last entered. The maker may be dead or beyond reach; no answer tells you which. At length, a thought arrives without a voice: 'No keeper answers.' Silence holds until dawn."
 POD_gratiano.0320.a: "The vigil is complete. Let the gateway stand."

###### Tier 5: The Syllable of Unbeing & Ahriman's Beckoning ######

 POD_gratiano_syllable_spoken_tt: "The Syllable holds until the sun finds you. Then it fails within thirty nights, and the Abyss may exact a delayed price."
 POD_gratiano_syllable_already_spoken_tt: "The Syllable is already spoken over you. It cannot be laid again until it has failed and the Abyss has had its chance to collect."
 POD_gratiano_syllable_failing_toast: "The Sun Has Found You"
 POD_gratiano_syllable_failing_tt: "The Syllable of Unbeing absorbed the blow and began to unravel. It holds for thirty more nights; the Abyss may collect soon after."
 POD_gratiano_beckoning_slipped_tt: "#weak The dark closed on nothing it could carry: your prize is dead, already imprisoned, or yourself. The [stress|E] is spent regardless.#!"

 POD_gratiano.0331.t: "The Darkness Collects"
 POD_gratiano.0331.desc: "It comes ten nights after the Syllable failed, which is somehow worse. The sun found you, the word unravelled on its schedule, and dawn stopped overlooking you. When your flesh remembered what daylight used to cost, you mistook the renewed pain for the whole price.\n\nTonight, everything the Syllable held back arrives in one place: every morning it unspoke compressed into a single breath, with the Abyss's reckoning laid over them. For one clear moment you understand the arithmetic before the Beast takes over."
 POD_gratiano.0331.a: "Then let the Beast have what it is owed."
 POD_gratiano.0332.t: "Nothing Comes to Collect"
 POD_gratiano.0332.desc: "You spend the night waiting in vain. The Syllable failed several nights ago; the sun's old weight returned without ceremony, and the word is simply spent.\n\nSomewhere below, the Abyss has set your account aside. Perhaps it was balanced or too small to collect; no answer comes. A faint taste of iron lingers for an hour and then fades."
 POD_gratiano.0332.a: "The sun and I resume our old terms."

###### Commune & Oubliette outcomes ######

 POD_gratiano_commune_slay_god: "\"How might one slay a god?\""
 POD_gratiano_commune_slay_god_tt: "#T The Abyss answers once.#!\nYou learn how a god is killed and what will try to pull the drinker under. The answer guides you through the #bold shifting vault#! and steadies you against the #bold elder blood you drink#!. You may ask this only once."
###### Milestones (0340-0343), Commune answer (0350) & the bereaved deep ######
 POD_gratiano.0300.desc.founder_dead: "\n\nThe deep feels the founder's absence. Its rites still surface, but the force that raises them now circles the vacancy he left. As you delve, that pressure gathers around you."
 POD_gratiano.0340.t: "A Grave Still in Use"
 POD_gratiano.0340.desc: "The dark does not empty behind you. Where the rite was pried loose, the scar of its last owner stays in the room: a stain of absence at the height of a kneeling man, with the syllables worn into its edges the way steps are worn by feet. You went down where it was buried and came up with it in your hands. Nothing in that room moved while you worked, yet coming out took one step more than going in. The pressure stayed in your ears until the third stair, where you saw your shadow still holding its shape at the threshold behind you."
 POD_gratiano.0340.a: "I inherit the scars and the rites."
 POD_gratiano.0341.t: "The Second Mouth"
 POD_gratiano.0341.desc: "The rite closed with its price paid to the last syllable. No master's scar prepared you for the half-beat afterward, when your voice stops but the words continue below the edge of hearing. An unseen second mouth carries the working to its end, testing syllables dormant for a very long time. Each rite repeats some older practitioner's habit, and something still listens for the result."
 POD_gratiano.0341.a: "Then we practice together."
 POD_gratiano.0342.t: "A Shade Too Deep"
 POD_gratiano.0342.desc: "Your courtiers noticed the change in your eyes before you did. Conversation drops half a tone when you enter and never quite recovers, though no one will explain why. The bolder among them have begun watching your shadow as if it were the one attending; last night, one bowed to it. A lamp still follows you through the house, now held at arm's length by a bearer who waits anxiously for leave to go."
 POD_gratiano.0342.a: "Let them look their fill."
 POD_gratiano.0343.t: "Adept No Longer"
 POD_gratiano.0343.desc: "Your chamber has acquired a cold that gathers around you instead of radiating from your skin. The Road calls some rites deep; the Shadowed reserve other names for workings known chiefly by their price, and you have paid one of those prices.\n\nThe household noticed before you spoke. Candles now require a second lighting, and the dogs keep to the far side of the yard. After dusk, your servants leave the rest of the night unplanned."
 POD_gratiano.0343.a: "They are right to be careful."
 POD_gratiano.0343.desc.syllable: "You spoke the sun's true name backward over your flesh. Since then dawn reaches the sill without touching you, and the Abyss waits, patient as stone, for the day the sun finds you. Your people know the change began that night, though they cannot explain it."
 POD_gratiano.0343.desc.beckoning: "Whoever has the watch now keeps it from inside the hall, his back to the wall. He has neither asked to be relieved nor explained himself. When the rite was worked, darkness went out beneath your hand as far as your name carried, closing on the place where you had set another name. The house felt it pass. For the next hour, no one would look at the chair nearest the hearth. No one here means to ask aloud what returned through the dark."
 POD_gratiano.0343.desc.wight: "The working left a stillness in the house. Its wight neither tires nor needs repeated orders; it can hold one posture for most of an hour. The body obeys with a permanence no hired servant could match. Training now uses wooden staves, a precaution adopted without discussion."
 POD_gratiano.0343.desc.commune: "The answer continues for four nights after you ask the question. Beneath the sounds of horses in the yard and servants speaking your name, something replies at a pitch just below speech. Only you hear the response, which never repeats and shows no sign of ending. Twice you have replied to questions no one else asked. The household now watches you wait half a breath before speaking, as though another voice must finish first."
 POD_gratiano.0350.t: "Taught or Baited"
 POD_gratiano.0350.desc: "The Abyss answers with a memory you never lived: a god devoured from within, its shadow drawn tight over a vast wound. Behind that wound, a will has already turned toward the drinker it expects. You wake at dusk knowing where to cut and how long the thing beneath the shadow has waited for someone to learn. The memory's owner remains unknown, as does the intent behind it. The knowledge comes too readily to feel like a gift."
 POD_gratiano.0350.a: "I will carry what it showed me."
