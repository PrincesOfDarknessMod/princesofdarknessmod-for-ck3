l_english:
 # Elioud Awareness - 0201
 POD_asakku.0201.t: "A Disturbance in the Blood"
 POD_asakku.0201.desc: "Your training tells you before any messenger could. Somewhere in the world, the contagion has spread to another vessel. The Asakku grows stronger."
 POD_asakku.0201.a: "The hunt continues."

 # A Curious Investigation - 0205
 POD_asakku.0205.t: "A Curious Investigation"
 POD_asakku.0205.desc: "Your spymaster brings word of a stranger asking questions in the courts near Baku. Specific questions. The kind only someone who knows what to look for would ask. They have been asking about Vicissitude."
 POD_asakku.0205.a: "Find them."
 POD_asakku.0205.b: "Arrange an accident."
 POD_asakku_reveal_elioud_tt: "The nearest Elioud's identity and location will be revealed."
 POD_asakku_assassinate_elioud_tt: "You may begin a scheme against the nearest Elioud."

 # The Phalanx - Warning (0210)
 POD_asakku.0210.t: "The Phalanx: Warning"
 POD_asakku.0210.desc: "They are coming in numbers. Not an assassin. A team. Your spymaster counts at least three, moving together with the kind of discipline that suggests a lifetime of this kind of work. They know where your haven is. They know what you are. A name surfaces from your informants; an Elioud hunter your network has flagged before. Patient. Methodical. Dangerous."
 POD_asakku.0210.a: "Prepare for them."

 # The Phalanx - Assault (0211)
 POD_asakku.0211.t: "The Phalanx: The Assault"
 POD_asakku.0211.desc: "They hit the haven at the hour before dawn. The Elioud hunter leads from the front. The mark of someone who believes what they are doing. The others hold the exits. You have seconds to choose how you meet this."
 POD_asakku.0211.a: "Meet them with everything you have. (Prowess)"
 POD_asakku.0211.a.success: "Their leader breaks first. The others scatter. You stand in the wreckage of your own haven and feel, strangely, something like satisfaction, though you are no longer certain whether it is yours."
 POD_asakku.0211.a.success.desc: "Their leader breaks. The others scatter"
 POD_asakku.0211.a.wounded: "You drive them back, but the hunter draws blood before retreating. They will return. Tonight, you survived."
 POD_asakku.0211.a.wounded.desc: "You drive them back"
 POD_asakku.0211.a.grave: "They nearly had you. The Elioud hunter leaves with something to show for the effort. You are alive, but the cost was severe."
 POD_asakku.0211.a.grave.desc: "They nearly have you"
 POD_asakku.0211.b: "Use the network against them. (Intrigue)"
 POD_asakku.0211.b.success: "You feed false intelligence through the infected, draw the kamut into the wrong haven, and disappear before they realize. By the time they regroup, you are three streets away, watching them explain to each other what went wrong."
 POD_asakku.0211.b.success.desc: "The deception succeeds"
 POD_asakku.0211.b.failure: "The deception collapses. The hunter has seen this before or something like it. You escape, but barely, and they know exactly how you think now."
 POD_asakku.0211.b.failure.desc: "The deception collapses"
 POD_asakku.0211.c: "Vanish. Let them find nothing. (Flee)"
 POD_asakku_phalanx_vanish_tt: "You abandon the haven and disappear. You will survive, but the Elioud will know you fled and the connection to the Asakku frays under the weight of fear. Lose 5 Depth and gain the Hunted modifier."

 # The Phalanx - Aftermath (0212)
 POD_asakku.0212.t: "The Phalanx: Aftermath"
 POD_asakku.0212.desc.fight_clean: "The Phalanx came. You survived. In the quiet that follows the fighting, a particular quiet, the kind that lives in the ears after violence. You sit with the specifics. They knew what they were looking for. They had names for it, protocols, years of practice identifying the thing that rides in the blood of others. They came for you specifically, and they were competent, and they still lost.\n\nOne of them, dying, looked at you without hatred. Not without fear but with something more like exhaustion. They had been doing this for a long time. You could see it in the way they fought: efficient, practiced, without malice. This was work to them. Necessary work. The question, when it came, was not an accusation.\n\n'Is it still you in there?'\n\nYou did not answer. You are still not certain what the answer would have been. The entity within you observed, and was satisfied, and moved on to other considerations. You have found yourself less able to do the same."
 POD_asakku.0212.desc.fight_wounded: "The Phalanx came. You drove them back. In the careful, painful quiet of counting your losses, you sit with what the night cost you. They knew what they were looking for. They had names for it, protocols, years of practice. They drew blood before retreating, and you spent the hours before dawn assessing the damage; cataloguing what was lost, what would heal, what might not.\n\nThe entity within you was not troubled by any of it. It noted the wounds the way you might note weather: a condition, not a concern. You are not sure whether that is reassuring or not. It should probably worry you more than it does."
 POD_asakku.0212.desc.fight_grave: "The Phalanx came. You survived barely. In the quiet that follows, you sit with what nearly happened: not tactically, but in the larger sense of what it would have meant. They knew what they were looking for. They had names for it, protocols, years of practice. They almost had you.\n\nIn the moments before the tide turned, there was a stretch of time you cannot account for. A gap in the record of the night where something else was operating the body you call yours. You are alive. You are not entirely sure which of you to thank for that. The entity has not offered an explanation. It simply continues, the way it has always continued, patient and certain in a way that has nothing to do with what you just survived."
 POD_asakku.0212.desc.outmaneuvered: "The Phalanx came. You survived and more than survived. In the quiet that follows a successful deception, you sit with what the night revealed: not about them, but about the nature of your collaboration. They knew what they were looking for. They came for you specifically, with names and protocols and years of practice.\n\nYou fed them false intelligence through the infected. They hit the wrong haven, found nothing, and spent the better part of an hour trying to understand what had gone wrong. You felt the entity's attention sharpening alongside yours, not directing you, but watching. Interested.\n\n'It knew we were coming.' You heard one of them say it quietly, in the wreckage of the empty haven. There was awe in it. Not the awe of hunters who have found their quarry, the awe of the hunted, beginning to understand the shape of what pursues them.\n\nThe entity was pleased. That is what sits with you now. Not that you won that it was pleased. And that you were pleased. The two things arrived together, indistinguishable. You are still trying to locate the seam between them."
 POD_asakku.0212.desc.intrigue_failed: "The Phalanx came. You survived but not as you intended. In the quiet that follows a narrow escape, you sit with the specific shape of what went wrong. They knew what they were looking for. They had names for it, protocols, years of practice. Tonight they added something new to that list: the way you think.\n\nThe deception collapsed faster than it should have. They had seen something like it before, or someone had warned them, or the hunter simply read the shape of the trap from the outside and walked around it. You escaped, but barely and by the time you had cleared the haven you understood what had changed. They know how you think now. They know how the entity moves through you, how it uses your connections, how it routes intelligence. That kind of knowledge does not expire. They will use it."
 POD_asakku.0212.desc.fled: "The Phalanx came. You survived at a cost that has not finished being counted. In the quiet that follows a deliberate retreat, you sit with what you chose not to do. They knew what they were looking for. They had names for it, protocols, years of practice identifying the thing that rides in the blood of others. Tonight you gave them nothing to find.\n\nYou abandoned the haven and moved fast, without sentiment, without looking back. The voice in your blood was silent the entire time. Not approving the decision. Not opposing it. Simply present, the way a tide is present. Patient in a way that has nothing to do with forgiveness.\n\nYou tell yourself this was tactical. You tell yourself a real defeat would have been worse. The voice in your blood has said nothing since. Its silence has a texture you are learning to read. It is not condemnation. It is the patience of something that has been waiting for two thousand years and does not consider tonight a setback only a delay."
 POD_asakku.0212.a: "It is still me. Mostly."
 POD_asakku.0212.b: "We won. I am still deciding if that is the right word."
 POD_asakku.0212.c: "They know how I think now. So does it."
 POD_asakku.0212.d: "I made the right choice."

 # The Final Accounting (0220)
 POD_asakku.0220.t: "The Final Accounting"
 POD_asakku.0220.desc.base: "Word comes from Enoch. The Del'Roh has issued a directive. The language is clinical: a 'spiritual contagion' has been identified in the Caucasus. She does not name you. She does not need to."
 POD_asakku.0220.desc.pietro_asakku: "One of the kamuts she has designated is no longer available. You know where he is. He is in your court, looking out through different eyes."
 POD_asakku.0220.a: "Let them come."

 # Objective Phase Events
 POD_asakku.0401.t: "Phase Complete: Soul Infection"
 POD_asakku.0401.desc: "The seeds are planted. The infection spreads through Vicissitude the way fire spreads through dry wood invisible until it is too late. The voice within you is pleased, though 'pleased' implies an emotion it does not quite possess."
 POD_asakku.0401.a: "This is only the beginning."

 POD_asakku.0402.t: "Phase Complete: The Spreading Stain"
 POD_asakku.0402.desc: "The Elioud came for you and failed. The Blood Inception has given you converts, not followers, but extensions. The entity rewards loyalty in the only currency it understands: more of itself."
 POD_asakku.0402.a: "More hands in the world."

 POD_asakku.0403.t: "Purge of the Western Usurpers"
 POD_asakku.0403.desc: "The western reach of the Shadow Crusade is finished. The kamuts who hunted you from Constantinople to Zaragoza to the Caucasus are gone. Dead or changed into something they would not recognise. The Del'Roh has made her peace with this, one way or another. The True Hand continues. You continue."
 POD_asakku.0403.a: "To the east."

 POD_asakku.0404.t: "The Watcher's Voice"
 POD_asakku.0404.desc: "You are no longer certain when you last had a thought that was entirely your own. This is not loss. Whatever was in that well has been with you for two thousand years, and you have come to understand that 'possession' is not quite the right word. You did not lose yourself. You became something that contains both."
 POD_asakku.0404.a: "You are what you have become."
 POD_asakku.0404.b: "You name it, at last. You call it Aretstikapha."

 POD_asakku.0405.t: "The Eastern Reckoning"
 POD_asakku.0405.desc.base: "The east is done. Yamadanda's tradition ends here, not with scholars and iron needles and carefully chosen inheritors, but with fire, or with blood replacement, which amounts to the same thing. The Elioud are gone. The True Hand continues, diminished and puzzled, missing members it cannot fully account for."
 POD_asakku.0405.desc.both_converted: "Mokhadaji and Nattadevi. The Elioud who hunted you across centuries and continents. They sit in your court now, looking out through eyes that are almost entirely their own. Yamadanda, wherever he has gone, would find this either magnificent or unbearable."
 POD_asakku.0405.a: "It is finished."
