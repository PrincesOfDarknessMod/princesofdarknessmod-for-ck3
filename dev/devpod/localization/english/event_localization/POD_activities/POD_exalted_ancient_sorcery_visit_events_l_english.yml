l_english:
 POD_exalted_ancient_sorcery_visit_events.1.t: "Ready To Explore"
 POD_exalted_ancient_sorcery_visit_events.1.desc: "And here you are... In a place where your long research or just common knowledge has led you. A place where tomes containing [exalted_ancient_sorcery|E] are almost guaranteed to be located in, you just need to go there and pick it up..."
 POD_exalted_ancient_sorcery_visit_events.1.a: "A local noble family has a relic suspected to be a Tome..."
 POD_exalted_ancient_sorcery_visit_events.1.b: "Rumors say that in nearby ruin lay an Ancient Tome..."
 POD_exalted_ancient_sorcery_visit_events.1.c: "A local vampire is quite vocal about his collection"
 POD_exalted_ancient_sorcery_visit_events.1.d: "A small Pack of Garou has obtained a Tome long ago..."
 POD_exalted_ancient_sorcery_visit_events.1.e: "A chantry of Mages in here has a large collection of tomes..."
 POD_exalted_ancient_sorcery_visit_events.1.f: "A mortal library is rumored to store an Ancient Tome..."
 POD_exalted_ancient_sorcery_visit_events.1.g: "The Remains of Imperial Palace must contain Ancient Tomes..."
 POD_exalted_ancient_sorcery_visit_events.1.h: "Buried underground is a library with an Ancient Tome inside..."
 POD_exalted_ancient_sorcery_visit_events.1.i: "You know a place with a tome inside, but it probably isn't unguarded..."


 POD_exalted_ancient_sorcery_visit_events.1000.t: "Family's Relic"
 POD_exalted_ancient_sorcery_visit_events.1000.desc: "Finding this tome wasn't the hardest thing in the world, after all even if communication over large distances is quite hard; The noble families have always pursued fame and prestige, as such they of-course wouldn't keep quiet about their 'Ancient Familiar Relic' from times long gone.\n\nThat led you here, the current owners probably won't just give their beloved relic to a random passerby. You need a plan..."
 POD_exalted_ancient_sorcery_visit_events.1000.a: "Gold is the answer to everything."
 POD_exalted_ancient_sorcery_visit_events.1000.a.critical_failure: "They just won't budge"
 POD_exalted_ancient_sorcery_visit_events.1000.a.failure: "Negotiations wen't poorly, but at least you got it"
 POD_exalted_ancient_sorcery_visit_events.1000.a.success: "You aren't master in negotiations, but a compromise was reached"
 POD_exalted_ancient_sorcery_visit_events.1000.a.critical_success: "The price was set, a deal perfect for you"
 POD_exalted_ancient_sorcery_visit_events.1000.b: "Under the cover of night, I will steal it"
 POD_exalted_ancient_sorcery_visit_events.1000.b.critical_failure: "Caught in the middle of stealing"
 POD_exalted_ancient_sorcery_visit_events.1000.b.failure: "Caught, but too late"
 POD_exalted_ancient_sorcery_visit_events.1000.b.critical_success: "Like a shadow, nobody saw you"
 POD_exalted_ancient_sorcery_visit_events.1000.c: "I am $glossary_exalted$, they are just mortals"
 POD_exalted_ancient_sorcery_visit_events.1000.c.critical_failure: "The only thing you got were few bruises"
 POD_exalted_ancient_sorcery_visit_events.1000.c.failure: "Fight was intense, but you won"
 POD_exalted_ancient_sorcery_visit_events.1000.c.critical_success: "They were just mortals in the end"

 POD_exalted_ancient_sorcery_visit_events.2000.t: "Ruins"
 POD_exalted_ancient_sorcery_visit_events.2000.desc: "Legends, and history too, say that here once stood a library containing many esoteric tomes, including one with something that many considered useless... But you know better, to the eyes of the uneducated, a tome with [exalted_ancient_sorcery|E] inside can appear like a lunatic's ramblings...\n\nBut finding a singular tome amidst tons of rubbish and other trash will not be easy. At least you can sleep peacefully in the knowledge that, almost certainly, that tome is still here."
 POD_exalted_ancient_sorcery_visit_events.2000.a: "All of my time shall be spent here."
 POD_exalted_ancient_sorcery_visit_events.2000.b: "Most of my time shall be spent here."
 POD_exalted_ancient_sorcery_visit_events.2000.c: "Some of my time shall be spent here."
 POD_exalted_ancient_sorcery_visit_events.2000.d: "I do have a life outside of this, I will come here when I have time..."

 POD_exalted_ancient_sorcery_visit_events.3000.t: "Bloodsucker"
 POD_exalted_ancient_sorcery_visit_events.3000.desc: "A local vampire, named [defender.GetName], is quite vocal about his collection of ancient tomes and other books. And one of them, you discovered after long research, has many characteristics common and some even could say unique to [exalted_ancient_sorcery|E].\n\nBut here is the problem: You look just like a mortal, Exaltation isn't widely known and the bloodsucker is very likely to consider you just a pesky insect. As such, there is almost no possibility for diplomacy. You will need to fight..."
 POD_exalted_ancient_sorcery_visit_events.3000.a: "There is no other way."
 POD_exalted_ancient_sorcery_visit_events.3000.b: "I don't like my chances."

 POD_exalted_ancient_sorcery_visit_events.3001.t: "Bloodsucker"
 POD_exalted_ancient_sorcery_visit_events.3001.desc: "After a long fight, you have won. The bloodsucker lies dead on the ground, or at least more dead than before.\n\nIt is time to explore their lair, somewhere here lays the tome with [exalted_ancient_sorcery|E]."
 POD_exalted_ancient_sorcery_visit_events.3001.a: "There you are!"

 POD_exalted_ancient_sorcery_visit_events.4000.t: "Pact of Wolves"
 POD_exalted_ancient_sorcery_visit_events.4000.desc: "A long ago local pack of Garou has obtained a tome, which if your research hasn't failed, contains the secrets of [exalted_ancient_sorcery|E]. Ever since then they are quite adamant at keeping it safe, though to your knowledge they do not know about it's importance.\n\nOne thing remains, and that is actually getting the tome. Currently at the main camp of their's there are 2 Garou stationed, though you cannot be sure if more aren't just about to arrive..."
 POD_exalted_ancient_sorcery_visit_events.4000.a: "One against two?"
 POD_exalted_ancient_sorcery_visit_events.4000.b: "Surely we can talk through this?"
 POD_exalted_ancient_sorcery_visit_events.4000.c: "I don't like my chances."
 
 POD_exalted_ancient_sorcery_visit_events.4001.t: "Pact of Wolves"
 POD_exalted_ancient_sorcery_visit_events.4001.desc: "As the last garou takes their final breath in the pool of blood, you stand there victorious.\n\nYou don't have much time at basking in your glory, you do not know if more aren't coming here. Especially after the commotion you caused."
 POD_exalted_ancient_sorcery_visit_events.4001.a: "It should be here..."
 
 POD_exalted_ancient_sorcery_visit_events.6000.t: "Mortal Library"
 POD_exalted_ancient_sorcery_visit_events.6000.desc: "How exactly the tome has arrived to this library is something you don't know, nor do you know why this library still holds onto it; even if they cannot obtain any useful information from it. Either way, the fact that the tome is fully preserved is something that is of great importance to you.\n\nOf course you wouldn't just steal it; You don't know exactly why you feel that way but you do. And you don't think any amount of gold could buy it. But there is nothing preventing you from copying it word by word..."
 POD_exalted_ancient_sorcery_visit_events.6000.a: "Let's start working"
 POD_exalted_ancient_sorcery_visit_events.6000.b.critical_failure: "It will take much more time"
 POD_exalted_ancient_sorcery_visit_events.6000.b.failure: "It won't be quick"
 POD_exalted_ancient_sorcery_visit_events.6000.b.success: "That was easy"
 POD_exalted_ancient_sorcery_visit_events.6000.b: "I could pay someone else to do it..."
 POD_exalted_ancient_sorcery_visit_events.6000.c: "On the other hand... I have other things to do."

 POD_exalted_ancient_sorcery_visit_events.7000.t: "Remains of The Imperial Palace"
 POD_exalted_ancient_sorcery_visit_events.7000.desc: "Imperial Palace, a place where The Previous Age's corpse lay dormant. If there is a place with more secrets of Old Age hidden inside than The Imperial Place, then it would surely be located in the past as this is the only place in this Age that could store such information.\n\nYou know that going too deep is a one way trip. Only madness and death lay beneath the surface, and you are not suicidal. Your plan is simple, explore the very surface of Imperial Palace in hopes of finding something useful, and pray that you won't stray too far, too deep."
 POD_exalted_ancient_sorcery_visit_events.7000.a: "Surely #italic convincing#! some mortals will be safer?"
 POD_exalted_ancient_sorcery_visit_events.7000.b: "Not my first time dealing with unknown terrain!"
 POD_exalted_ancient_sorcery_visit_events.7000.c: "I think I have read about the layout of surface?"
 POD_exalted_ancient_sorcery_visit_events.7000.d: "I should be able to claw myself from the danger, right?"
 POD_exalted_ancient_sorcery_visit_events.7000.e: "I DO not like my odds..."
 POD_exalted_ancient_sorcery_visit_events.7000.critical_failure: "You have strayed too deep"
 POD_exalted_ancient_sorcery_visit_events.7000.critical_success: "You managed to avoid the madness beneath" 

 POD_exalted_ancient_sorcery_visit_events.8000.t: "Buried Repository"
 POD_exalted_ancient_sorcery_visit_events.8000.desc: "Long ago, here once stood a library containing a tome with [exalted_ancient_sorcery|E] inside. Unfortunately, sands of time have buried it deep underground; or maybe it was done on purpose? Nevertheless, what you know is that deep underground lays a library containing what you are after.\n\nBut getting there won't be easy... You need to create an entrance, or use existing to get to the meat."
 POD_exalted_ancient_sorcery_visit_events.8000.success: "You have excavated an entrance, from now on you will have much easier access to this library"
 POD_exalted_ancient_sorcery_visit_events.8000.next: "You will enter the library proper."
 POD_exalted_ancient_sorcery_visit_events.8000.a: "I know an entrance!"
 POD_exalted_ancient_sorcery_visit_events.8000.b: "Excavation shouldn't be done alone."
 POD_exalted_ancient_sorcery_visit_events.8000.b.failure: "You and your team have digged in a wrong place"
 POD_exalted_ancient_sorcery_visit_events.8000.b.success: "You struck gold"
 POD_exalted_ancient_sorcery_visit_events.8000.c: "I myself am enough."
 POD_exalted_ancient_sorcery_visit_events.7000.failure: "You either digged in a wrong place, or you got exhausted long before getting there"
 POD_exalted_ancient_sorcery_visit_events.7000.success: "You were indeed just enough"
 POD_exalted_ancient_sorcery_visit_events.8000.d: "I have better things to do."

 POD_exalted_ancient_sorcery_visit_events.8001.t: "Buried Repository"
 POD_exalted_ancient_sorcery_visit_events.8001.desc: "And here you are, in a library buried deep underground. You see dust covering everything and major damage caused by both caving and time. Fortunately, or rather miraculously 'shelves' with tomes inside remain pretty much untouched.\n\nTaking a tome from it would be as easy as stealing a candy from a child. But will you lower yourself to that level?"
 POD_exalted_ancient_sorcery_visit_events.8001.a: "Absolutely."
 POD_exalted_ancient_sorcery_visit_events.8001.b: "Couldn't I just copy it?"

 POD_exalted_ancient_sorcery_visit_events.9000.t: "Vault"
 POD_exalted_ancient_sorcery_visit_events.9000.desc: "You stand before an entrance to location you know contain a tome with an [exalted_ancient_sorcery|E] inside... What you do not know is what is inside besides the tome. You know that this area isn't the most peaceful nor safe place around, even worse; you have a suspension that something is guarding the tome...\n\nThe question before you is simple, will you go inside?"
 POD_exalted_ancient_sorcery_visit_events.9000.a: "I am not a coward."
 POD_exalted_ancient_sorcery_visit_events.9000.b: "I have a #italic really#! bad feeling..."
 POD_exalted_ancient_sorcery_visit_events.9000.b.effect: "You will abandon this [activity|E] and return home."

 POD_exalted_ancient_sorcery_visit_events.9001.t: "Vault"
 POD_exalted_ancient_sorcery_visit_events.9001.desc: "Against your better judgement, you went inside. After all, what could possibly go bad?... Many things actually, and you quickly realized after you entered. Something is watching you from the shadows, observing your every move; waiting for you to drop your guard.\n\nOr maybe not? In a split moment you sense incoming danger, you dodge and look at your attacker... THE FUCK IS THAT?!"
 POD_exalted_ancient_sorcery_visit_events.9001.a: "FIGHT FOR YOUR LIFE"
 POD_exalted_ancient_sorcery_visit_events.9001.a.critical_failure: "You stand no match, whatever is it this consumed you whole"
 POD_exalted_ancient_sorcery_visit_events.9001.a.failure: "You almost died, but almost makes a huge difference"
 POD_exalted_ancient_sorcery_visit_events.9001.a.success: "You won, but there are probably more of them"
 POD_exalted_ancient_sorcery_visit_events.9001.b: "TACTICAL RETREAT"
 POD_exalted_ancient_sorcery_visit_events.9001.b.critical_failure: "Either you were caught when retreating, or when coming back"
 POD_exalted_ancient_sorcery_visit_events.9001.b.failure: "You managed to retreat and come back later, but you were wounded in the process"
 POD_exalted_ancient_sorcery_visit_events.9001.b.success: "You quickly lost it, and then returned unnoticed"
 POD_exalted_ancient_sorcery_visit_events.9001.c: "RUN!"
 POD_exalted_ancient_sorcery_visit_events.9001.c.critical_failure: "No matter how fast you ran, it was faster"
 POD_exalted_ancient_sorcery_visit_events.9001.c.failure: "It landed few attacks on you, but you managed to escape"
 POD_exalted_ancient_sorcery_visit_events.9001.c.success: "You escaped in one piece"
 POD_exalted_ancient_sorcery_visit_events.9001.flavor: "You quickly gather yourself, and in a record time find what you are after before anything else came to pay you a visit"