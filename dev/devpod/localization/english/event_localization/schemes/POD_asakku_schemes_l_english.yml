 # Soul Infection scheme event chain
 POD_asakku.0030.t: "Something in the Blood"
 POD_asakku.0030.desc: "You sense it before you understand it; a wrongness in the way your blood moves, as if something is testing the current. Someone has been working on you. The Vicissitude in your veins feels different tonight. Heavier."
 POD_asakku.0030.a: "Fight it."
 POD_asakku.0030.b: "Let it in."
 POD_asakku.0032.t: "The Struggle"
 POD_asakku.0032.desc: "The blood resists. Not with understanding, they do not know yet what moves through them, but with the stubbornness of old Vitae that recognizes a foreign will. You feel the rejection like pressure against a closed fist. You can push through it. The question is whether the cost is worth paying tonight."
 POD_asakku.0032.a: "Push through the resistance."
 POD_asakku.0032.a.success.desc: "The infection takes hold. The target's resistance crumbles."
 POD_asakku.0032.a.failure.desc: "The target fights it off. The blood rejects the seed."
 POD_asakku.0032.b: "Withdraw from the attempt."
 POD_asakku_cancel_scheme_tt: "Cancel the Soul Infection scheme."
 POD_asakku.0034.t: "The Seed Takes Root"
 POD_asakku.0034.desc: "It is done. The infection has taken hold. You can feel it, the way you feel your own heartbeat in someone else's blood. They do not know yet what has happened to them. They will."
 POD_asakku.0034.a: "More hands in the world."
 POD_asakku.0035.t: "Resistance"
 POD_asakku.0035.desc: "The attempt fails. Something in the target's blood resists; not understanding, not faith, but a simple stubbornness of spirit that the entity cannot yet overcome."
 POD_asakku.0035.a: "They are stronger than expected."
 POD_asakku.0036.t: "Something Changed"
 POD_asakku.0036.desc: "You wake with a voice that is not yours. It does not speak in words. It speaks in hunger, and in patience, and in a certainty that has nothing to do with faith. You have been changed."
 POD_asakku.0036.a: "What have I become?"
 POD_asakku.0037.t: "You Resisted"
 POD_asakku.0037.desc: "Someone tried to plant something in your blood. You fought it off; this time. The memory of the intrusion lingers like a taste you cannot identify."
 POD_asakku.0037.a: "I will be more careful."

 # Kamut Recruitment scheme event chain
 POD_asakku.0250.t: "A Proposition"
 POD_asakku.0250.desc: "An Elioud approaches you with evidence of a spiritual contagion spreading through the ranks of the Tal'Mahe'Ra. They speak of ancient entities, of Vicissitude as a vector, and of a need for hunters willing to act."
 POD_asakku.0250.a: "Refuse. This is not my fight."
 POD_asakku.0250.b: "Accept. Show me what hunts us."
 POD_asakku.0252.t: "A New Hunter"
 POD_asakku.0252.desc: "The recruit has been brought into the fold. Another pair of eyes watching for the contagion. Another hand ready to act."
 POD_asakku.0252.a: "Welcome to the kamut."
 POD_asakku.0253.t: "Recruitment Refused"
 POD_asakku.0253.desc: "The target was unwilling or unable to accept the truth about the Asakku threat. The recruitment attempt has failed."
 POD_asakku.0253.a: "There will be others."

 # Decision events
 POD_asakku.0301.t: "Blood Inception"
 POD_asakku.0301.desc: "The entity that rises from the well does not give; it replaces. You open the vein and let the prisoner drink until they are not empty anymore. In the morning they will wake up, and something will be looking through their eyes that was not there before."
 POD_asakku.0301.a: "More hands in the world."
 POD_asakku.0302.t: "The Morning After"
 POD_asakku.0302.desc: "They wake disoriented, as you expected. What you did not expect is that they look at you the way a mirror looks with no expression that is entirely their own. More hands in the world."
 POD_asakku.0302.a: "Good."
 POD_asakku.0310.t: "Seeding the Garden"
 POD_asakku.0310.desc: "The blood sinks in faster than blood should. By morning the grass at the boundary of your holding has taken on a reddish cast. The voice in your thoughts is satisfied in a way it rarely is with people. It seems to like the idea of patience. Something slow and spreading and permanent, that does not require persuasion."
 POD_asakku.0310.a: "Let it grow."
 POD_asakku.0320.t: "Soul Whispers"
 POD_asakku.0320.desc: "You reach through the connection. It takes less effort each time. Through the blood you planted in them, you feel what they feel and you learn what they have learned."
 POD_asakku.0320.a: "Knowledge is power."

