 POD_persistentpodlore.desc.793278: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThroughout Mongol history, it was commonplace for many of their less than valued members to be sent into exile in neighboring empires. For many, this was a horrible thing, to be driven from their home. But for Batbaybar, he couldn't have been happier. From his youth Batbaybar held a great and profound appreciation of the arts. Starting in bowmaking and fletching, he would rather spend his time weaving tapestries and carving than hunting. So absorbed in his arts that when his community was attacked, one warrior had broken into his yurt to kill him, the battle lost but so immersed in his craft he hadn't even noticed. He did successfully escape, and fled to the southwest, towards the Iranian Plateau. There, he was enamored with their works, and eagerly plied his skill as an artisan. It was here he caught the eyes of the Banu Haqim, and was brought into their fold as a member of the Viziers.\nBatbaybar is the picture of the creative frenzy that grips the Viziers. But now his works have been disrupted. As the Mongols march deeper into Iran, he is terrified at the distruction some of their generals are bringing. And worse, the Anda ride in their shadow. Batbaybar hates their march, and wants to preserve those great works. So he has resolved to hold the line on behalf of the Clan, choosing to die before he lets the Anda destroy the works he has so long labored to protect."
 POD_persistentpodlore.desc.793279: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIn both life and death, Navneet and the road have been close friends. Born among Dalit exiles from India traveling west, Aglaia was among the first of her people to see the walls of Constantinople. Immediately unwelcome and eagerly clapped in chains, Navneet was planning to flee with her people further into the European interior, had there not been a woman that greeted her in the night, and asked to discuss philosophy with her. Despite having spent her time on the road, Navneet wished for a homeland. She wished for a world where she and her family could breathe easy and breathe free, unshackled and unburdened. She spoke of places she hoped for, and lamented if only she had the power to do so, she would make that a reality. \nThe woman figured she would make a perfect Brujah as Navneet spoke of her perfect world. \nSince her Embrace, Navneet has moved a lot, seeking the place that she could try to build the hope of her people, now tempered and given clarity by the utopia of Carthage her sire told her about. However, since the rise of the Mongol Empire, she has seen oppurtunity. She sees potential there, a place where she can build a paradise deep in the Steppes, a syncretism of Carthage and her dreamed sanctuary for the people who would come to be called the Romani."
 POD_persistentpodlore.desc.793280: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBorn in the Han Empire in Qingyang, Fu was a scholarly boy, but would later rise to action by seeking fame and glory within the Han's service. He would find his glory when the Loulan King Angui murdered several diplomats. Despite being a stable hand at the time, Fu was chosen for being sent out to stab the king to death, but he instead volunteered a different plan, and killed Angui by tricking him with gifts and getting him drunk, where his guards then immediately disposed of the King. Granted a title for his service, Fu was proud, and saw to his new office.\nBut something in him lingered. He missed study. He had found his glory, but something was still nagging at him. He wanted to learn more, he wanted to study, and he wanted to grow his knowledge. Much to his surprise, he found a kindred spirit, who always came at night to speak to him on the nature of death under heavy robes. In the final years of mortal life, they were deep friends. And as he began to succumb to his age, the traveler had offered him a gift, to be able to have the life he left behind, in a new state. Fu accepted, and was Embraced into the Cappadocians.\nSince then, Fu has largely contended himself with his studies. However, the recent surge in death as the Mongols grow outward has resolved him to take greater actions. The Mongols remind him much of the Loulan of his own life, and with the great disturbances they are performing to the dead, he has resolved himself to action. He always wanted to be more than a bookworm after all. And what is one a second king, when one can already be killed so easily?"
 POD_persistentpodlore.desc.793281: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBorn on the march across the Urals, Temüülen was born sickly, ill, and measly. From his birth, his life on the steppes was a constant struggle. Always sick, openly disliked by his fellows, Temüülen's life was always marked by being on the fringes and openly ridiculed by the rest of his extended family. While his family were part of the raid teams for Europe, he was often too physically weak to properly use a bow, and as such was treated as worthless on such campaigns. \nHowever, in one incursion, they made the mistake of attacking the wrong church. In the night, it exploded in darkness, swallowing everyone within whole. Temüülen fled as hard as he can, and that night was the worst, and last, of his life. Despite the impossibility, he faced it like he always had. Struggling in the face of the impossible and refusing to roll over and die. And this impressed the attacker, who then took Temüülen into the Lasombra. \nHis 'education' merely reaffirmed Temüülen's will to survive, but also his hate. More than anything, Temüülen hated the system that always saw him as weak. And now he is strong. He is as a god to mortals, and he relishes the feelings of objective superiority he now has over them. He relishes the crown of darkness set upon his head, and wants nothing more to make it eternal, to show all who had thrown him aside he is strong."
 POD_persistentpodlore.desc.793282: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the Toreador, there are many art forms they seek to protect. Tapestries, musics, sculptures, paintings, instruments, architecture, and countless other forms of art both physical and emotional are commonplace. But Otgonbayar sees a far greater beauty in a well bred animal than just a painting.\nIn mortal life, Otgonbayar was her clan's main tender to their horses and livestock. Every pairing was her choice, and she found a great sense of satisfaction in seeing the herds and stocks of her clan improve within animal generations. And so great was her own purebred horse that, while on a trading journey to a city, a figure in the night was so enthralled by her work, that they couldn't let such an artist die before she could create her masterpiece.\nOverall, her embrace didn't change Otgonbayar much, because now she has all the time in the world to perfect her sciences and arts. Her own herds are among the finest in the world, ever pairing controlled for centuries to create the perfect progeny. However, as she gazes upon her pefect herds, she wants to move to the next step. She looks back to the humans that surround her, and wonders, possibly, if in this time of strife the same can be done to man..."
 POD_persistentpodlore.desc.793283: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nOne of the more esoteric creations of the Ceoris Gargoyle Pits, Delta along with the other Gargoyles that formed her clutch to be an expedition sent east to investigate the Mongols on behalf of the Tremere. However, along the journey, their Tremere handler met final death, and Delta, alongside her clutch, led them to safety within the Urals, before flying further east.\nNow free from the Bloodbond and escaped with her sworn companions, Delta jealously guards their new freedom. The world of night in the steppes are chaos, and they are uniquely skilled at surviving in these regions both with their wings and ability to meld into the earth. But greater still, she fears the Tremere seeking out this lost clutch, no matter how much of a waste it would be to find them. So she jealously guards them their shared refuge, hunting together and never parting. And as the chaos of the Anda draws nearer, she is forced to make a choice.\nDo they continue to hide? Or do they try to build something lasting to protect themselves within?"
 POD_persistentpodlore.desc.793288: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nOne of the more esoteric of the Ceoris Gargoyle, Omega was a particularly strange creation, and for reasons beyond her understanding, paired with Delta. Sent with their pack East, the death of their Tremere handler at Mongol intervention freed her, and having nowhere else to go, she stuck close to Delta, going with her deeper into the steppes.\nOmega is the heart of their pack, but above all is the most fanatically loyal of the group to Delta. Beyond just being Omega's protector in the Gargoyle pits, Delta has let Omega stay close. She is devoted, and in the absence of the Bloodbond Omega throws herself deeper into Delta's embrace for the deeper sense of clarity and protection she offers.\nBut Omega worries for her pack. As the Anda and other Cainites of the steppes move around them, Omega begs Delta to build a place where they can hide not as animals, but rule as their masters once did. She longs to see a crown on Delta's head, and is willing to do anything for her Pack Leader to do so. She only just wishes Delta would see it the same way."





