l_english:

 # SETITE — Serpent's Embrace: Success
 pod_setite_serpent_embrace.0001.t: "The Serpent's Coils Tighten"
 pod_setite_serpent_embrace.0001.desc: "It is done.\n\nThe long courtship is finally complete. [target.GetFirstNameNoTooltip] came to you of [target.GetHerHis] own accord tonight, eyes hollow with the weight of every certainty you patiently dismantled, every comfort you slowly poisoned, every pleasure you dangled just beyond reach. [target.GetSheHe|U] knelt, not to you, but to the truth you had whispered into their soul night after night: that the world had abandoned them, that only Set's wisdom could give meaning to their suffering.\n\n[target.GetSheHe|U] speaks the words of conversion with the trembling fervor of one who has been remade. The serpent does not strike its prey; it waits, and watches, and knows that in time the prey will crawl willingly into its mouth. You feel Set's approval like cool scales across your back, another soul drawn into the long winding dark, another lamp dimmed in the world above. Word of this conversion will travel, and others who saw [target.GetFirstNameNoTooltip] as steadfast will begin to wonder how steadfast they themselves truly are.\n\nThe Path of Set claims another. The world above grows a little dimmer, and the coils of the great serpent grow a little wider."
 pod_setite_serpent_embrace.0001.a: "Set rewards His patient servants."

 pod_setite_serpent_embrace.0002.t: "The Serpent's Whisper"
 pod_setite_serpent_embrace.0002.desc: "It has been months, perhaps longer, since [scheme_owner.GetFirstNameNoTooltip] first crossed your path. At the time you thought nothing of it; a chance meeting, a gift of wine, a clever turn of conversation. Then another encounter. Then a letter. Then a quiet evening of philosophy and laughter that left you, somehow, doubting things you had never questioned before.\n\nTonight you understand. The dreams that have left you waking with Set's name on your lips. The arguments of your old faith that suddenly ring hollow when you try to recite them. The strange certainty, when you close your eyes, that the world above is a lie of light papered over a deeper, truer dark.\n\n[scheme_owner.GetFirstNameNoTooltip] is here again, and you understand at last what [scheme_owner.GetSheHe] has been doing. The serpent's coils are already around you. It is not a question of whether you will be converted, only whether you will accept it as illumination, or fight your way free of a doctrine that has already half-claimed your soul."
 pod_setite_serpent_embrace.0002.a: "Set's truth has found me. I will walk the dark road willingly."
 pod_setite_serpent_embrace.0002.b: "I will not be made into a creature of Set."