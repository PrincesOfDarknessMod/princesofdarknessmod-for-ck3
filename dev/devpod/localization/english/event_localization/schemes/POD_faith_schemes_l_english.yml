l_english:

pod_angra_mainyu_conversion.0001.t: "The Dark One's Embrace"
pod_angra_mainyu_conversion.0001.desc: "It is done. Finally, after weeks and months of whispers and playing the devil on their shoulder, suggesting actions ever so reasonably, solutions they never would ahve considered without you, they are finally ready, their minded moulded over the course of months to accept things they would have disdained as evil before and reject what they would ahve seen as pious. Now they see the truth, that they are just as much as any vampire, a creature of Angra Mainyu, here to spread his word in this world. And they could not be happier in that fact."
pod_angra_mainyu_conversion.0001.a: "Another Soul corrupted."

pod_angra_mainyu_conversion.0002.t: "The threshold of corruption."
pod_angra_mainyu_conversion.0002.desc: "It has been months, perhaps longer, since [scheme_owner.GetFirstNameNoTooltip] first crossed your path. At the time you thought nothing of it; a chance meeting, a gift of wine, a clever turn of conversation. Then another encounter. Then a letter. Then a quiet evening of philosophy and laughter that left you, somehow, doubting things you had never questioned before.\n\nTonight you understand. Your previous beliefs were nothing more than the delusion of a child that refuses to accept reality, you were blind and now you see. There is no shame in following the will of Angra Mainyu, for you are one of his creatures, this is simply the natural way of the world. Or, some long forgotten part of you whispers, is it really?"
pod_angra_mainyu_conversion.0002.a: "Yes. it is, all of us are creatures of Angra Mainyu."
pod_angra_mainyu_conversion.0002.b: "No. That's a lie. We are more than that."