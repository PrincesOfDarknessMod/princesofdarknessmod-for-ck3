l_english:
 pod1230objectives_yamaking.1.t: "Entering the Race"
 pod1230objectives_yamaking.1.desc: "There is Heaven, and there is Earth. There is Yin, and there is Yang. There are the lands of the living, and there are the lands of the dead. And then there is Yomi Wan, and nothing else is like it, anywhere.\n\nYomi, also known as the Thousand Hells, is more than just a place of torment. It is where the [Glossary('Yama Kings','podgloss.yamaking')] dwell, each awaiting his chance at the title of [Glossary('Demon Emperor','podgloss.demonemperor')]. It is where the souls of the truly wicked are punished without surcease for all eternity.\n\nOriginally, the Thousand Hells were part of the Dark Kingdom of Jade where the lost souls of Asia dwell. The instability of the turn of ages ended with the kingdom being weakened and carved by the first of what would become the [Glossary('Yama Kings','podgloss.yamaking')].\nSince then, some of these petty realms have fallen, some have been absorbed by others while a few have grown to godly proportions and now lord over a large part of the afterlife.\nMost however have stayed relatively small and inconsequential (hence the name of "Thousand Hells"), barely worth the notice of the major players. Your recent successes and the growth of your Hell have elevated you beyond this station. You are now a leading figure in the race for the last throne."
 pod1230objectives_yamaking.1.a: "Finally Important Enough to Remember"

 pod1230objectives_yamaking.2.t: "The Weak Perish"
 pod1230objectives_yamaking.2.desc: "At their essence, the [Glossary('Yama Kings','podgloss.yamaking')] are a system that has gone wildly out of control. Originally intended to tend the spirits of the dead who demanded exceptional punishment, over the centuries they have instead slipped their celestial leash and arrogated unto themselves power never intended for them.\nThey corrupt the Middle Kingdom and roost like shrikes in Yomi, wallowing in the sustenance their cruelty generates. In truth, "Yama King" is more of a title than anything else. The origins of the various beings who stalk Yomi like colossi are varied. Some were created by the Scarlet Queen and her consort, others set in their place by the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')]. Others seem to be akin to ghostly Malfeans, spirits of vast atrocity or even the ancient rivals of Yu Huang, grown terrible in their power. Still, the roots of the Yama Kings matter less and less with each passing year; they are more akin to each other than they are different, and all of them are possessors of great power and dominion within Yomi.\n\nAs the Ages have unfolded, certain of the original Yama Kings have met with annihilation. Some spiraled out of control and destroyed themselves. But they are still numerous and many of the smaller "Thousand Hells" could play a part in the race for the [Glossary('Demon Emperor','podgloss.demonemperor')].\n\nYour recent concerted effort to cull the competition will make sure it doesn't happen. The cries of agony of the many weak fools that tried to proclaim themselves Yama Kings will serve as a nice chorus to your ascension."
 pod1230objectives_yamaking.2.a: "Only the strong remain."

 pod1230objectives_yamaking.3.t: "Perfect Devil"
 pod1230objectives_yamaking.3.desc: "The demonic lords of the Yomi realm wield unfathomable power. When they are in their own domains, the [Glossary('Yama Kings','podgloss.yamaking')]' rage makes volcanoes erupt or oceans freeze; reality itself shifts to appease them. Here — and only here — do most [Glossary('Yama Kings','podgloss.yamaking')] feel safe. The majority of these devil prefer to sit like bloated spiders at the center of their webs orchestrating events through their chosen agents.\nOutside their own hells, the [Glossary('Yama Kings','podgloss.yamaking')]' power fade rapidly.\n\nIn the material world, the power of the [Glossary('Yama Kings','podgloss.yamaking')] ebbs to a fraction of what it is in Yomi. While that's still enough to annihilate all but the greatest ancestors and certain other powerful supernatural, this weakening makes the Yama Kings feel intolerably vulnerable.\n\nThis weakness will soon be a worry of the past for you. Concentrating your efforts in growing your personal power and the strength of your chosen [akuma|E], you are confident that you can withstand anything your many foes could throw at you, making you on part with the most ancients and powerful of your [Glossary('Yama Kings','podgloss.yamaking')] brethren."
 pod1230objectives_yamaking.3.a: "Perfection in Yomi"

 pod1230objectives_yamaking.4.t: "The Last Obstacle"
 pod1230objectives_yamaking.4.desc: "The [Glossary('Yama Kings','podgloss.yamaking')] see only one barrier to their ultimate control of the entire world, and that is the ancient agreement that limits their influence to the Middle Kingdom and nowhere else. They cannot watch events in the Western world unfold as they can spy on the happenings of the Middle Kingdom, nor can they directly affect any creature of the West.\nThose portions of the world which are not a part of the Middle Kingdom are completely free of their direct influence. This is not to say that they cannot gather reports from well-traveled [akuma|E] or from the demons of the Western world but the Yama Kings can't play with the fates of Westerners as they can those of the denizens of the Middle Kingdom.\n\nMost of them think that this is due to their ancient role given by the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] that clearly defined their territorial influence. Most also think that breaching this spiritual barrier will be a climatic step in the rise of the [Glossary('Demon Emperor','podgloss.demonemperor')].\n\nWith your success in removing this obstacle, the world inevitably turns toward the Sixth Age and your rightful ascension."
 pod1230objectives_yamaking.4.a: "So little stands in my way now."

 pod1230objectives_yamaking.5.t: "Emperor of the Last Age"
 pod1230objectives_yamaking.5.desc: "Most [Glossary('Yama Kings','podgloss.yamaking')] strive toward one goal: to throw the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] from the throne of Heaven once the Sixth Age arrives and then to seize the title of [Glossary('Demon Emperor','podgloss.demonemperor')]. The prophecies are regrettably clear on this matter, and the question is not if one of the [Glossary('Yama Kings','podgloss.yamaking')] will rule over Heaven and Earth, but when and which Yama King it will be.\nScheme after malevolent scheme, some of them millennia old, are coming to fruition now as the Yama Kings reap the harvest from seeds of agony planted long ago. The time is coming soon and you are in the best possible position to seize the Mandate of Heaven.\n\nClot by clot, Yomi grows. By adding new territories to your Yomi World, you increase your personal power, your ability to affect the world and the merging of your personal domain with the material world. Every new connection or weak spot between the mortal world and the world of demons gives you new channels through which to inflict your will upon the Middle Kingdom and, metastasize into new territory.\n\nYour ultimate victory wasn't felt in a blaze of glory or concerto of horrors like many feared but simply in the realization that your Hell finally completely overtook this reality. The entire human population now follow your rules, all prisoners of a domain they don't even understand.\nThe few surviving uncorrupted supernaturals hope that the Sixth Age, your Age, will end at some point.\n\nBut the wise knows that it most likely won't."
 pod1230objectives_yamaking.5.a: "From a jailer to an Emperor."
 pod1230objectives_yamaking.5.a.tt: "#X Game Over#!, you became the [Glossary('Demon Emperor','podgloss.demonemperor')], or maybe you prefer the term of #G;bold God#!?\n\nIn any case, the world has changed irremediably and outside the scope of what CK3 can showcase. Well played."
 pod1230objectives_yamaking.5.b: "My game isn't over."
 pod1230objectives_yamaking.5.b.tt: "Even though you are the [Glossary('Demon Emperor','podgloss.demonemperor')], you can still continue your game if you wish though the storyline ends here."