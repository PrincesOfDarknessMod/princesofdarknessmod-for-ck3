l_english:
 pod1230objectives_yamaking.1.t: "Great Yomi"
 pod1230objectives_yamaking.1.desc: "There are many Hells in [UmbraGlossaryLocalized('yomi_wan','Yomi Wan')], most some obscure and small with unknown [UmbraGlossaryLocalized('podgloss.yamaking','Yama King')] ruling over it.\n\nYour's Yomi was exactly the same, your name didn't mean anything and your Yomi wasn't known by greater populous of Middle Kingdom, but not longer that is the case! Your Yomi has grown, and now there isn't anybody that can ignore you!"
 pod1230objectives_yamaking.1.a: "Finally Important Enough to Remember"

 pod1230objectives_yamaking.2.t: "Dealing with Competition"
 pod1230objectives_yamaking.2.desc: "You are not the greatest [UmbraGlossaryLocalized('podgloss.yamaking','Yama King')] there is. You know that, and you also know that it isn't possible to totally exterminate all the competition in this battle for throne.\n\nBut that doesn't stop you from making life of your competition easy, right?"
 pod1230objectives_yamaking.2.a: "One of future problems gone"

 pod1230objectives_yamaking.3.t: "Perfect Devil"
 pod1230objectives_yamaking.3.desc: "To become [Glossary('Demon Emperor','podgloss.demonemperor')] you have to win war for divine throne. And you finally have everything you need to survive that war"
 pod1230objectives_yamaking.3.a: "Perfection in Yomi"

 pod1230objectives_yamaking.4.t: "Breaching the Middle Kingdom"
 pod1230objectives_yamaking.4.desc: "Ehh... KARDE"
 pod1230objectives_yamaking.4.a: "Breaching unbreakable"

 pod1230objectives_yamaking.5.t: "Claiming Rightful Throne"
 pod1230objectives_yamaking.5.desc: "War for throne is almost over, all major players either defected or worse. And you are the one standing on top. It is time for you to sit on your rightful throne."
 pod1230objectives_yamaking.5.a: "Time to start from beginning"
 pod1230objectives_yamaking.5.a.tt: "#X Game Over#!, you became [Glossary('Demon Emperor','podgloss.demonemperor')], Or maybe you prefer #G;bold God#!?"
 pod1230objectives_yamaking.5.b: "I can have some fun here"
 pod1230objectives_yamaking.5.b.tt: "Even though you are [Glossary('Demon Emperor','podgloss.demonemperor')], you didn't clam entirety of your powers"