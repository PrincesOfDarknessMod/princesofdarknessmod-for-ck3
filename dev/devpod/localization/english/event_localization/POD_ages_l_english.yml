l_english:
 # Temporary Loca from wiki, to decrease need for Karde.
 POD_age.1.t: "Age of Beauty"
 POD_age.1.desc: "The Kuei-jin and Hsien refer to it as the Second Age of the Great Cycle or the Age of Beauty, when the Middle Kingdom and Spirit Courts were still close together. The Hengeyokai speak of the Age of the Ten Thousand Things, where the San Yuan, the Triat, was brought into existence and life as it is known today was formed. The Chi'n Ta similarly speak of the creation of the Metaphysic Trinity in the form of the Three Ministers, who supervised the formation of the Five Elements which would give way to the Ten Thousand Things.\n\nThe Second Age ended with events identified with the Severing, the appearance of the Yama Kings and the formation of the Wan Xian. " #Karde Loca
 POD_age.1.a: "New time upon us!!"

 POD_age.2.t: "Age of Legends"
 POD_age.2.desc: "The Kuei-jin, Hsien and Hengeyokai speak of the Third Age as the Third Age of the Great Cycle, the Age of Legends. It was the mythical prehistory of the Middle Kingdom, when the Wan Xian walked among and ruled humanity as benevolent masters. It was also the age where those shen loyal to the August Personage battled the creatures of Yomi under shaky truces. To the Chi'n Ta, this was the age where mankind awakened to Heaven's designs and first learned to wield magic.\n\nThe Third Age ended through the machinations of the Yama Kings, who corrupted the Wan Xian to feed on chi. It also marked the end of mythic tradition and the beginning of history as humans understand it today. " #Karde Loca
 POD_age.2.a: "New time upon us!"
 POD_age.2.tt: "Effects of Age:\n$BULLET_WITH_TAB$Every [GetTrait('cultist').GetName(GetPlayer)] gains: [GetModifier('akuma_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every Yama King gains: [GetModifier('yama_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every $POD_splat_kueijin$ gains: [GetModifier('godbodies_modifier').GetNameWithTooltip]"

 POD_age.3.t: "Age of Beautiful Sadness"
 POD_age.3.desc: "The Kuei-jin and Hsien recall this age as the Fourth Age of the Great Cycle or the Age of Beautiful Sadness. It marks the beginning of Kuei-jin's curse and transformation from warriors of Heaven into demonic creatures originating in Yomi. To the Little Gods, it was the beginning of their exile from Heaven after the August Personage banned them for their involvement in the insurrection of the Wan Xian. The Hengeyokai speak of the Age of Testing, where the treacherous Wan Xian set the Fera against each other in an event remembered as the War of Shame. The Chi'n Ta remember that various different factions of willworkers sprang from this time period, and that they often clashed, as seen in conflicts like the Himalaya War or the Dragon River War. During this conflicts, Yi, the Excellent Archer and his followers appeared, who founded an order that would later exist as the Shih, dedicated to hunt rogue shen.\n\nHuman history begins during this period, and the Kuei-jin trace their vulnerability to sunlight to this time (the Chou Dynasty, specifically). According to scholars, the Fourth Age begins approximately around 900 BCE and ends around 1250-1349 CE (according to the counting of the Kuei-jin) or 1735 CE (according to the counting of the Akashic Brotherhood). " #Karde Loca
 POD_age.3.a: "New time upon us."
 POD_age.3.tt: "Effects of Age:\n$BULLET_WITH_TAB$Every $POD_splat_kueijin$ gains: [GetModifier('godbodies_modifier').GetNameWithTooltip]"

 POD_age.4.t: "Age of Darkness"
 POD_age.4.desc: "To the Kuei-jin, the current age is the Fifth Age of the Great Cycle or the Age of Darkness. The Chi'n Ta speak of the current world as dominated by the 'Stone People', who have come from far away to bring the Middle Kingdom under their control. The Hengeyokai call it the Age of Shadows. The Hsien speak of the Age of Tribulation, where the shen have to prove themselves worthy of Heaven or be destroyed once the Demon Emperor rules. Nearly all shen agree that the trigger for the Fifth Age was the intrusion of westerners into the Middle Kingdom.  " #Karde Loca
 POD_age.4.a: "New time upon us.."
 POD_age.4.tt: "Effects of Age:\n$BULLET_WITH_TAB$Every [GetTrait('cultist').GetName(GetPlayer)] gains: [GetModifier('akuma_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every Yama King gains: [GetModifier('yama_buff_modifier').GetNameWithTooltip]"

 POD_age.5.t: "Age of Sorrow"
 POD_age.5.desc: "The Kuei-jin call the coming age the Sixth Age of the Great Cycle, also referred to as the Age of Sorrow. It is the nadir of the Wheel, where the August Personage of Jade steps down from His throne and one of the Yama Kings will ascend to become the Demon Emperor. However, most Kuei-jin see the Age of Sorrow as a necessary part of existence. Likewise, the Hengeyokai believe that the coming Age of Sorrow will pose their greatest challenge. Their enemies, the Yama Kings, seek to enthrone themselves over the Wheel and keep it trapped in the Sixth Age forever, while the Great Centipede seeks to undo the wheel itself. The duty of the children of the Emerald Mother, therefore, will be to protect the Wheel from all who seek to corrupt it. The Chi'n Ta likewise believe that the Wheel will soon turn again, but are divided how it will affect them. The Hsien instead speak of the Age of Joy, where the Wall between the worlds will break and allow them to return home. Others have taken up the stories of other shen and secretly worry if this as good as it sounds.\n\nTo multiple Shen, the Red Star and the Sixth Maelstrom have been the first omens of the fast approaching turn of the wheel.\n\nThe Sixth Age is roughly analogous to the Cainites' Gehenna, the Apocalypse of the Garou, Armageddon of the mages, the Endless Winter of the Kithain, and the Doomsday feared by wraiths.  " #Karde Loca
 POD_age.5.a: "New time upon us..."
 POD_age.5.tt: "Effects of Age:\n$BULLET_WITH_TAB$Every [GetTrait('cultist').GetName(GetPlayer)] gains: [GetModifier('akuma_huge_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every Yama King gains: [GetModifier('yama_huge_buff_modifier').GetNameWithTooltip]"