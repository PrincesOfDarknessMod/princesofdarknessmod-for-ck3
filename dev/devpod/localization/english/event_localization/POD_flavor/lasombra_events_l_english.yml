l_english:

 pod_lasombraevents.1.n:0 "Seeing Faces"
 pod_lasombraevents.1.desc:0 "Faces. The last week you have been acutely aware of them. Be it mortals, vampires or a bunch of rocks arranged just right, everything has a face. Including you, of course. Except that, like all of our [Clan|E], you are cursed to never see your face or your body again. How long has it been since you last saw your own reflection? Have you ever seen it, anyway? You were a mortal so long ago... How do other people react when they see you for the first time? Are they scared, or entranced, or do they laugh behind your back?\nThese questions are having way too much effect on you and it is time to do something about it. The most straightforward way is to hire an artist and have them draw your portrait. At the very least, it may ease the pain."
 pod_lasombraevents.1.loverdesc:0 "Faces. The last few days you have been acutely aware of them. Be it mortals, vampires or a bunch of rocks arranged just right, everything has a face. Including you, of course. Except that, like all of our [Clan|E], you are cursed to never see your face or your body again. How long has it been since you last saw your own reflection? Have you ever seen it, anyway? You were a mortal so long ago... How do other people react when they see you for the first time? Are they scared, or entranced, or do they laugh behind your back?\nThese questions are having way too much effect on you and it is time to do something about it. The most straightforward way is to hire an artist and have them draw your portrait. You could also ask you lover, [helper.GetTitledFirstName], to give a nice description of you, who knows?"
 pod_lasombraevents.1.a:0 "I need a portrait..."
 pod_lasombraevents.1.b:0 "I have no need for it."
 pod_lasombraevents.1.c:0 "Pff! I don't need this!"
 pod_lasombraevents.1.d:0 "I will ask for help."
 pod_lasombraevents.1.a.t:0 "You hire an artist to make your portrait."
 pod_lasombraevents.1.b.t:0 "You have more urgent things to spend money on."
 pod_lasombraevents.1.b.beast:0 "#R You don't need anything. You have me.#!"
 pod_lasombraevents.1.c.t:0 "You always look good."
 pod_lasombraevents.1.d.t:0 "And help you receive."
 
 POD_courts_blood_interaction:0 "Petition for Sanctioned Diablerie"
 POD_courts_blood_interaction_desc:0 "Petition the Courts of Blood, presenting a case about why this character should be removed from the Lasombra's protection and hunted down for their very soul."
 courts_blood_tooltip:0 "If you win your case, this character won't cost piety to diablerize anymore. If you don't, you probably made a rival for unlife."
 
 POD_asdiqa_al_lail_interaction:0 "Petition for Sanctioned Diablerie"
 POD_asdiqa_al_lail_interaction_desc:0 "Petition the Asdiqa al-Lail, presenting a case about why this character should be removed from the Lasombra's protection and hunted down for their very soul."
  
 POD_amis_noirs_interaction:0 "Petition for Sanctioned Diablerie"

 pod_lasombraevents.2.n:0 "A New Case?"
 pod_lasombraevents.2.desc:0 "The Courts of Blood are the judiciary body of [clan|E] Lasombra. These Elders, that stay anonymous, can be petitioned to pass judgment on various issues related to the clan as a whole. These Elders' time is precious though, so the Courts of Blood most often convene only for the gravest of cases : sanctioned [diablerie|E].\nClan Lasombra values the lust for power above all else, and takes great pride into making sure that each of its scions is worthy. As such, any Lasombra can petition the Courts to plead that another Lasombra is unworthy of even being alive, and that their blood would be best served empowering another one.\nIt is no surprise that such cases are often the start of legendary rivalries, and are always hotly debated."
 pod_lasombraevents.2.a:0 "Proceed with the case."
 pod_lasombraevents.2.b:0 "On second thought..."

 pod_lasombraevents.3.n:0 "Opening Session"
 pod_lasombraevents.3.desc:0 "A session of the Courts of Blood is a strange affair. Shrouded in darkness, the judges aren't visible and their voices are masked as well, giving the whole thing a very surreal feel. Still, the stakes are much higher than the theatrics would have you think.\nYou and the defender have been summoned to the Court and it is now time for both of you to convince the Elders of your respective worth. You know that, when all is said and done, the Courts don't really care about the truth of the matter. They simply want to ensure that Lasombra's blood is only given to the worthy so the end goal of this process is to prove that you are a more ambitious, ruthless and deserving individual than your opponent."
 pod_lasombraevents.3.a:0 "Esteemed judges..."
 pod_lasombraevents.3.effect.success.desc:0 "You are convincing."
 pod_lasombraevents.3.critical.failure.effect.desc:0 "You didn't convince."
 
 pod_lasombraevents.4.n:0 "Greasing the Wheels"
 pod_lasombraevents.4.desc:0 "While the judges of the Court of Blood stay anonymous, the Amici Noctis, the organization of Elders ruling over clan Lasombra, isn't. It is relatively easy to find one of their representative in each major city, if only to start an official petition.\nThese intermediaries are rarely paragons of virtue and can easily be bribed to make sure some evidence suddenly appear before the judges (or never do in some instances). This is an open secret really, and crafty Lasombra are expected to have the means to conduct such "business". After all, wealth is one way to measure your worth."
 pod_lasombraevents.4.a:0 "A sensible donation."
 pod_lasombraevents.4.b:0 "I don't need that to win."
 won_round_court_blood_tt:0 "The Courts of Blood's case progresses in your favor."
 
 pod_lasombraevents.5.n:0 "Street Justice"
 pod_lasombraevents.5.desc:0 "All is fair in war and justice in [clan|E] Lasombra. You are trying to end the unlife of a fellow Lasombra and they are trying every trick possible to survive and sway the Court in their favor. Hiring a bunch of local thugs to rough you up between recesses of the Court is their last ditch effort.\nThis is a desperate attempt and you aren't in real danger. But the ease with which you will be able to dispatch those pests will reflect on the overall judgment. After all, Lasombra are supposed to be way above such petty concerns and easily able to show their superiority over mortals."
 pod_lasombraevents.5.a:0 "You targeted the wrong Lasombra."
 pod_lasombraevents.5.effect.success.desc:0 "Perfect!"
 pod_lasombraevents.5.critical.failure.effect.desc:0 "Pyrrhic Victory."
  
 pod_lasombraevents.6.n:0 "Show of Piety"
 pod_lasombraevents.6.desc:0 "Clan Lasombra values conviction. In many ways, they are a clan of faith, lashing on to any new mortal innovations in this field to create their own twisted take on them. At the end of the night, it doesn't matter what kind of faith you follow, as long as you make a sufficient show of doing it convincingly.\nTo sway the judges and prove that you are a worthy scion of the Lasombra, a show of piety might be a good choice."
 pod_lasombraevents.6.a:0 "I can make miracles happen."
  
 

 