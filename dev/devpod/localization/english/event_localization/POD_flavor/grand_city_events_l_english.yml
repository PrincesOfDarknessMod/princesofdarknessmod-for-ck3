podgrandcity.313.t: "The Wisdom of Jakuta"
podgrandcity.313.desc: "Your night time companion has shared the wisdom of age with you."

podgrandcity.312.t: "Amaria's Blood Dolls"
podgrandcity.312.desc: "Your deal with the Quadis lets you purchase her personal stock for a meager offering in gold and you take advantage of it ruthlessly, leaving the gold in her hands you walk to the private rooms of the Hanging Gardens where Amaria's offerings all sit, dazed out of their minds and ready and willing for you to feast, your deal lets you sample them all but only truly taste one unfortunately, so you will have to make your choice wisely..."
podgrandcity.312.a: "You will be my dinner tonight."

podgrandcity.314.t: "Blood and Silk."
podgrandcity.314.desc: "You withdraw into the private rooms of the Hanging Gardens, your doll in tow, lounging on the silk cushions you consider carefully just how hungry you are tonight."