l_english:

#Paris
 podgrandcity.01.t: "Paying your Due"
 podgrandcity.01.desc: "It is no secret to the other vampires in Paris that you have funded the expansion of the Tremere Chantry. Such acts in vampiric society are never made freely, with your subjects well aware of this fact.\nThe Tremere have come forward to you with multiple gifts. In truth, these gifts are meant as a payment to settle their debt to you. To them it is better to offer what they have, rather than wait for you to demand what they do not."
 podgrandcity.01.option.a: "Teach me your secrets"
 podgrandcity.01.option.b: "Further my studies"
 podgrandcity.01.option.c: "Show me the power of Stone"
 podgrandcity.01.tooltip: "Learn how to create your own [GetTrait('gargoyle').GetName(GetNullCharacter)] servants\n\n@warning_icon! #N You will still require [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]#!"

#Cairo
 podgrandcity.100.t: "Teachings of the Dream Court"
 podgrandcity.100.desc: "Thanks to your efforts, much of the temple has been rebuilt. Many Setites now walk these halls, whispering, scheming, and glorifying Set in their own ways.\nYet for reasons you cannot explain, many of the Setites that come here forget their original purpose and instead try to seek out pleasurable ways to entertain themselves. Perhaps this too is a form of worship, one that has started to interest you."
 podgrandcity.100.option.a: "The pleasures of the flesh will free me."
 podgrandcity.100.tooltip.a: "Your future faith will gain [GetDoctrine('tenet_carnal_exaltation').GetBaseName]."
 podgrandcity.100.option.b: "Why do these exist if not for personal satisfaction?"
 podgrandcity.100.tooltip.b: "Your future faith will gain [GetDoctrine('tenet_hedonistic').GetBaseName]."
 podgrandcity.100.option.c: "The more the merrier!"
 podgrandcity.100.tooltip.c: "Your future faith will gain [GetDoctrine('tenet_ritual_celebrations').GetBaseName]."

 podgrandcity.101.t: "Teachings of the Court of Dust and Bones"
 podgrandcity.101.desc: "This temple is aptly named, for what else remains but dust and bones when exposed to power blood magic? The many tomes here speak of Set, his achievements, and his powers. A trove of knowledge lies before you, you need only take it."
 podgrandcity.101.option.a: "Set is the King."
 podgrandcity.101.tooltip.a: "Your future faith will gain [GetDoctrine('tenet_ashen_faith').GetBaseName]."
 podgrandcity.101.option.b: "Set is the Typhon."
 podgrandcity.101.tooltip.b: "Your future faith will gain [GetDoctrine('tenet_sacred_shadows').GetBaseName]."
 podgrandcity.101.option.c: "Set is the Triumphant."
 podgrandcity.101.tooltip.c: "Your future faith will gain [GetDoctrine('tenet_pursuit_of_power').GetBaseName]."

 podgrandcity.102.t: "Teachings of the Crocodile Temple"
 podgrandcity.102.desc: "Here lies Sobek, blessed child of Set. It is said that Set turned the Mokolé into an abomination using powerful blood rituals. Being both a methuselah and an abomination means that Sobek is one of the most powerful creatures alive. Now he slumbers here, the aspect of Hunger itself. There is strength, chaos, and carnage found in this hunger. By worshipping the Crocodile God, perhaps this strength can be obtained."
 podgrandcity.102.option.a: "Hunger is an eternal struggle."
 podgrandcity.102.tooltip.a: "Your future faith will gain [GetDoctrine('tenet_struggle_submission').GetBaseName]."
 podgrandcity.102.option.b: "Ritual sacrifice shall sate the bloodlust."
 podgrandcity.102.tooltip.b: "Your future faith will gain [GetDoctrine('tenet_gruesome_festivals').GetBaseName]."
 podgrandcity.102.option.c: "Through rage my chains are broken."
 podgrandcity.102.tooltip.c: "Your future faith will gain [GetDoctrine('tenet_warmonger').GetBaseName]."

 podgrandcity.103.t: "A New Path is Revealed"
 podgrandcity.103.desc: "All three temples have been restored. The knowledge you gained from them gives you new insights on the worship of Set.\nPerhaps it is time for the world to know as well?\nOr perhaps these heretical thoughts should be abandoned?"
 podgrandcity.103.option.a: "This is the way."
 podgrandcity.103.option.b: "Interesting, but my path remains the same."


#Baghdad
 podgrandcity.201.t: "Baghdad's Pyre"
 podgrandcity.201.desc: "No city lies eternal. Such a simple truth is known to your kind but still, you were unprepared for what has come. The sack of Baghdad took place during an entire week of looting and killing as the Mongol forces of Hulegu swept through what once was the jewel of Islam. Perhaps close to a million people were killed, likely even more due to the epidemics the death toll brought with it.\nSo many books from Baghdad's libraries were thrown into the Tigris that the colour of the river changed into black from their multitude. The 500-year-old Abbasid Caliphate crumbles and with it the center of learning for the Middle-East.\n\nWhile the supernatural is known to hide well, the carnage and bloodshed still drove many into the throes of madness and more than one were cut down by the victorious Mongols.\n\nYou now rule over a city of ashes, fleas and death."
 podgrandcity.201.option.a: "What can we do in the face of such destruction?"
 podgrandcity.201.tooltip.a: "Baghdad is no longer the great city it once was, never again to rise to the status it once had. But perhaps you can still rebuild."

 podgrandcity.202.t: "Baghdad Heals"

 podgrandcity.203.t: "From the Ashes"
 podgrandcity.203.desc: "While it will always be scarred by what happened, Baghdad has endured. The city prominent role in the Middle-East has been reduced but it's still a place where people live, learn and die. Your city, your jewel, isn't as polished as it once was but it has managed to survive. Perhaps this reforging by fire under your influence will be what is needed for it to regain, or even surpass, its previous heights."
 podgrandcity.203.option.a: "A new beginning for the venerable city."
 podgrandcity.203.tooltip.a: "New stories to tell, new people to rule, same ambition."

#mogadishu
podgrandcity.3000.t: "Something Sleeps Below"
podgrandcity.3000.desc: "Your control over the city of Mogadishu is unconstested, no one dares challenge you openly, but something is going on in the shadows, the mists of the shore are just ever so slightly the wrong color, and more than one of your explorers sent into the endless catacombs has vanished. And why does it feel like those days when you were a neonate running from the gazes of elders? \n\nBah! Whatever it is you will make it kneel before you and aknowledge your power, for you are the master of Mogadishu and all that lies within it."
podgrandcity.3000.option.a: "There's something rotten in this city."
podgrandcity.3000.tooltip.a: "Sarapion's wrath has reached a new milestone, slow your exploitation of the city or face the consequences of her Wrath."

podgrandcity.3010.t: "Something Stirs."
podgrandcity.3010.desc: "Your control grows, but with it, so do your issues, mysterious dissaprearances, strange movements, and  whsipers of a cult growing under your nose. Even the earth seems determined to spite you, shaking and quaking under your properties, threatening to send everything you have built crashing down. worst of all is the mist, it grows, no longer on the shore, noww it spreads throughout the docks and lower city like a humongous beast. \n\nperhaps your boasts of making the creature causing these issues kneel was a little arrogant..."
podgrandcity.3010.option.a: "I will get to the bottom of this..."
podgrandcity.3010.tooltip.a: "Sarapion's wrath grows, if you do not do something soon she may wake completely"

podgrandcity.3020.t: "A name"
podgrandcity.3020.desc: "You finally know the name of your foe, the creature that comes into your city, kills your servants and shatters your buildings. Sarapion. You even know of her history, fragments at least, Mogadishu has been her home longer than it has been Mogadishu and she sleeps beneath the city, deep in the catacombs, controlling her city even in her dreams. Controlling YOUR city in her dreams. This cannot stand, no more. Every creature has a weakness and you will find hers, no matter how deep in the mists and depths you have to search."
podgrandcity.3020.option.a: "Only one of us will come out of this the victor"
podgrandcity.3020.tooltip.a: "Sarapion's wrath is still growing, a wise prince would not poke the bear as it leaves it's hibernation"

podgrandcity.3030.t: "Earthquakes in the mist"
podgrandcity.3030.desc: "The mist has taken over the city, every street and manse is filled with it, painted blood red as it grows deep enough to even blot out the sun. And below the earth cracks an dshakes every day as a new quake carves a new wound into the city you built. Instead of your servants and ghouls something else stalks the streets, loaked in masks that all show the same face, moving in groups that act as if they were a single creature, Sarapion's cult has colonised your city, ruling openly in defiance of you and your station. But evne you cannot leave your home. Every vampire that walks out without their blessing starts bleeding from every orifice"
podgrandcity.3030.option.a: "Perhaps I should not have angered her so..."
podgrandcity.3030.tooltip.a: "Sarapion's wrath is reaching a fever pitch if you do not turn back soon something drastic will happen"

podgrandcity.3040.t: "Footsteps in the dark"
podgrandcity.3040.desc: "She comes. You can hear her foootsteps as the echo all around you, leaving her crypt and heading straight for the one that dared challenge her control of her own city. You hear each footstep as if it were right next to your ear, she is getting closer, and there is nothing you can do"
podgrandcity.3040.option.a: "Only one way out"
podgrandcity.3040.tooltip.a: "This is your last chance to turn back and try and calm Sarapion"

podgrandcity.3050.t: "She has arrived"
podgrandcity.3050.desc: "Through the shadows, you can feel them before you see them. The ground trembling as a contemporary of Cagn shuddering before their approach. Eyes like molten pools of blood soaked iron pierce through the night outshining the moon, as a woman of primordial origin steps before you. Muscles like corded steel coat her body, as long and wild black hair comes down to her thighs. Even in the night her dark skin catches the countours of light to highlight just how powerful of a monster she is. Towering over the greatest of men, her stilled breathes rise and fall as the bleak mist that kills ancients rumbles down her breasts like the fire of a dragon. Behind her, the city is aflame, ruins and wanton destruction, the masquerade would have been shattered beyond repair, if only there were any mortals still alive. She is the most beautiful and terrifying creautre you have ever laid eyes on and she stares at you with disdain and pure hatred, she will not stop until your very bones are dust, until even the memory of you is gone from this world. and you have a fragment of a second to make a choice, one that will decide your unlife and your legacy forevermore"
podgrandcity.3050.option.a: "Run away!"
podgrandcity.3050.tooltip.a: "No matter the blow to your pride or legacy, discretion si the better part of valor"
podgrandcity.3050.option.b: "Fight!"
podgrandcity.3050.tooltip.b: "The only way out of this is through!"
podgrandcity.3050.option.c: "Fight her as an Equal!"
podgrandcity.3050.tooltip.c: "We are both ancient monsters! Surely I am not so much weaker than her?"

podgrandcity.3060.t: "Peace in your time"
podgrandcity.3060.desc: "The mist retreats back below the surface, into the catacombs and sea, the cult fades into the shadow and the earth is finally silent for once. You release a breath you had no need to hold and finally relax. Your entreaties to the old monster have been heard and accepted, Sarapion sleeps peacefully once more, content with the way your are stewarding what you both know is Her City."
podgrandcity.3060.option.a: "Thank Sarapion for her generosity."
podgrandcity.3060.tooltip.a: "You have calmed Sarapion enough, and now the mists retreat from the city, returning it to the living."

podgrandcity.307.t: "Learning from our Partners"
podgrandcity.307.desc: "With the developpement of mogadishu's bazaar, more and more people from all over the world flock to trade and talk and discuss all sort sof things there, and they come with ideas from their parts of the world. Now, with everyone talking and mingling in celebration it might be the best time to take some of those ideas and adopt them for yourself."
podgrandcity.307.option.a: "We will learn from our African neighbors"
podgrandcity.307.option.a.tt: "Opens the list of Regional Cultural traditions from Africa"
podgrandcity.307.option.b: "We will learn from the Arab and Persian worlds"
podgrandcity.307.option.b.tt: "Opens the list of Regional Cultural traditions from Persia and the Middle-East"
podgrandcity.307.option.c: "We will learn from far-off India"
podgrandcity.307.option.c.tt: "Opens the list of Regional Cultural traditions from India"
podgrandcity.307.option.d: "The expedition from the Middle-kingdom is due to arrive next week... perhaps we should learn from them?"
podgrandcity.307.option.d.tt: "Opens the list of Regional Cultural traditions from China"
podgrandcity.307.option.e: "Nevermind, we are perfect just the way we are"
podgrandcity.307.option.e.tt: "Closes the event, you will not be able to return."

