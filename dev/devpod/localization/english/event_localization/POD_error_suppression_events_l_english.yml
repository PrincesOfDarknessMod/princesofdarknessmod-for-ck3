 POD_error_suppression.0002.t:0 "Better Barbershop"
 POD_error_suppression.0002.desc:0 "We are noticing that you are using the Better Barbershop mod(formerly Full Screen Barbershop). Please make sure you are using the following load order: Prince of Darkness mod, then Better Barbershop mod, then "POD + Better Barbershop Compatibility Patch" mod (podbb).\nOtherwise, you will miss out on several Princes of Darkness features and all characters will end up muscular or overweight and the scrollable character interactions will not be available. Thanks!"
 POD_error_suppression.0002.a:0 "Understood"
 





