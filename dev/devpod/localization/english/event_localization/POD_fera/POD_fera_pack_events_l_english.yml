 fera_pack_totem_tt: "You will beseech a Totem for your [GetPlayer.Custom('PODCoterie')], your choice of totem is permanent."



 POD_fera_pack.2.t: "Spiritual Protection" 
 POD_fera_pack.2.desc: "Among the Garou and most other Fera, the totem is one of the fundamental binding aspects of the pack. A totem is a potent spirit that lends its power to a group of mystically inclined individuals in exchange for some token service or tribute. The choice of a totem is of extreme importance to a pack, for this spirit will protect them in times of need and serve as a guiding light for the Garou to follow.\nThis choice functions as a petition to the totem spirit, who then decides whether to adopt the pack members as his 'children'."
 POD_fera_pack.2.desc.bastet: "\nBastet call such spirits "Jamak" and those that choose to ally with the catfolk tend to be capricious, appearing out of nowhere to demand seemingly absurd requests. Still, they grant their protection like all other spirits totems do and are respected as powerful, if difficult to understand, protectors of the Bastet."
 
