 POD_fera_spirit_quest.1.t: "Spiritual Quest"
 POD_fera_spirit_quest.1.desc: "You have consulted the spirits and several of them have a quest to offer. Accomplishing one of them will allow you to progress on your spiritual journey to learn more powers, but also will weaken you in various ways as each quest has its own challenges.\nIf you refuse these propositions, you can ask again for (perhaps) different quests in five years."
 POD_fera_spirit_quest.1.option.a: "The spirit of war's quest"
 POD_fera_spirit_quest.1.option.b: "The spirit of leadership's quest"
 POD_fera_spirit_quest.1.option.c: "The spirit of rulers' quest"
 POD_fera_spirit_quest.1.option.d: "The crow spirit's' quest"
 POD_fera_spirit_quest.1.option.e: "The owl spirit's quest"
 POD_fera_spirit_quest.1.option.f: "This is not the right time for a quest"

