l_english:
 POD_yamaking_maintenance.1.t: "Infernal Tax"
 POD_yamaking_maintenance.1.desc: "Every year your powers grow from the defiled souls under your control."

 POD_yamaking_maintenance.2.t: "Defiling the [defiled|E]"
 POD_yamaking_maintenance.2.desc: "Most would-be [akuma|E] bargain with the [Glossary('Yama Kings','podgloss.yamaking')] out of a hunger for power. Others are tricked into servitude. Regardless of how one becomes [akuma|E], he quickly finds that he has traded away his freedom for the privilege of being a tool. While he may be a slave with some degree of power, he is still taunted with the knowledge that he has given up freedom and the pursuit of his own enlightenment for a small taste of his master's might.\n\nHis very soul and flesh is for his master, you, to remake as you see fit."
 POD_yamaking_maintenance.2.albino: "[Defiled|E] [GetTrait('albino').GetName(GetPlayer)]"
 POD_yamaking_maintenance.2.giant: "[Defiled|E] [GetTrait('giant').GetName(GetPlayer)]"
 POD_yamaking_maintenance.2.spindly: "[Defiled|E] [GetTrait('spindly').GetName(GetPlayer)]"
 POD_yamaking_maintenance.2.dwarf: "[Defiled|E] [GetTrait('dwarf').GetName(GetPlayer)]"
 POD_yamaking_maintenance.2.scaly: "[Defiled|E] [GetTrait('scaly').GetName(GetPlayer)]"
 POD_yamaking_maintenance.2.a: "I don't need it"

 POD_yamaking_maintenance.3.t: "Armies of Yomi"
 POD_yamaking_maintenance.3.desc: "Each [Glossary('Yama King','podgloss.yamaking')] carefully cultivates his own army. From the [Glossary('Shikome','podgloss.shikome')] to the Demons of Iron and Violence, these demonic armies become the signature of their master, either preferring raw destruction or more subtle means depending on the mindset of their leader.\n\nIt is not unheard of powerful [Glossary('Yama Kings','podgloss.yamaking')] to allow the use of their personal armies to their weakest counterparts. This can blossom into an alliance of convenience or a form of fealty where an up and coming Lord of Hell is now protected by his better's army.\n\nSuch pacts, as one would expect, rarely last long. There is little honor between Demon Kings."
