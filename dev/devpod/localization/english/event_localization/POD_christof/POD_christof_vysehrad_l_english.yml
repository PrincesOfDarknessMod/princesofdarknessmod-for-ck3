l_english:
 #Vysehrad events
 # Step 0: Before the search
 POD_christof_vysehrad.97.t: "A Favor to Ask"
 POD_christof_vysehrad.97.desc: "As you enter [GetScriptedCharacterByHistoryID('790602').GetFirstName]'s Haven, you can't help but recall the first time you were presented before her. You were just embraced, becoming the very thing you had sworn to destroy and fearing for your soul. Thrown into this world of intrigue and masquerade, you were completely helpless.\nYears have passed and you have now proven yourself worthy. You have come to ask for assistance in your quest.\n\n\"I know why you're here, my Childe.\"\n\nYour sire is holding the book of Nod in her lap, but her eyes are reading you as though you were an open book.\n\n\"Thou hast done well... While this is another one of those Brujah follies, alas thy soul will never be at peace until thy troubles are solved. We will help thee. What say thee, Childe?\""
 POD_christof_vysehrad.97.alt_desc: "As you enter [GetScriptedCharacterByHistoryID('790602').GetFirstName]'s Haven, you can't help but recall the first time you were presented before her. You were just embraced, becoming the very thing you had sworn to destroy and fearing for your soul. Thrown into this world of intrigue and masquerade, you were completely helpless.\n\nYears have passed and now your sire is gone. You have come to ask for assistance of your Promethean brothers.\n\n\"Greetings, Christof.\"\n\n[GetScriptedCharacterByHistoryID('790850').GetFirstName] is looking at you, reading the letter you sent him.\n\n\"I believe that after all we have gone undergone together, we owe you this one desire. It is reckless, but that is not unlike thee. We will help thee...\""
 POD_christof_vysehrad.98.t: "A Night between Friends"
 POD_christof_vysehrad.98.desc: "Your sleep lasted decades and the world changed without you. Trees have grown, children have withered into weary peasants.\nHigh and low, knights and ladies, every person you knew from your mortal days.\nNow gone or dead.\nBut the vampiric world always remains the same.\nThe same conflicts, the same grudges over the centuries. The same fear of Gehenna, the Jyhad, and much stranger things...\n\nToday, though is a day to rejoice and your [GetPlayer.Custom('PODCoterie')] decided to gather in an isolated tavern, with no mortal in sight. You hear laughs, you hear songs. But you're not really here. You can't help but wonder about your beloved Anezka, wondering how much she may have changed during all this time.\n\nOne of your companions interrupts your brooding.\"Christof, I believe you have something to say to all of us...\""
 POD_christof_vysehrad.99.t: "A Night at Camp"
 POD_christof_vysehrad.99.desc: "Most nights pass in a weary haze as you try to forget the realities of your unlife. This night, however, is different, as you wake up with a sense of greater purpose and clarity. Going through the night, you stride through the camp of your army with the hood of your long coat pulled over your shoulders. There are a few soft chants here and there, and the mood is a steady calm. This army is well fed and disciplined.\n\nThey are fully ready to die for the cause and God. So  are you. Your soul is pure, and you've passed the tests of the Holy Grail. With Jurgen dead, no one can now interfere with your hold over the Swordbrethren.\n\nYour faith  has been restored, and conviction fills your every limb. You truly believe in your cause, and the liberation of Anezka seems inevitable. It is now time to talk with your closest advisors. They ask you if the time has finally come.\n\nWhat do you tell them?"
 POD_christof_vysehrad.99.a: "Let's do it."
 POD_christof_vysehrad.99.a.tt: "#N You'll start searching for Vukodlak and Anezka. #N This is a risky endeavor and a point of no return."
 POD_christof_vysehrad.99.b: "On second thought, let's do this later."
 POD_christof_vysehrad.99.b.tt: "You'll be able to retake this decision at a later time."
 # Step 1: Start the search
 POD_christof_vysehrad.100.t: "To Search the Enemy"
 POD_christof_vysehrad.100.desc: "A few decades have passed since you lost Anezka and went into torpor.\n\nThe world has changed and you were certainly not the only one who has gathered power as time passed. Now that you are ready, it's time to find your nemesis.\n\nA few plans come into mind and while you're sitting at your desk, you wonder which one is the least risky. Anezka's life is at stake after all. That is, if she's still alive. This thought is a troubling one and you shiver... Let's not think about that. \n\nThe real question is: how do you intend to proceed?"
 POD_christof_vysehrad.100.a: "Send spies to the other courts."
 POD_christof_vysehrad.100.b: "Get the word to the other princes that you're searching for Vukodlak."
 POD_christof_vysehrad.100.c: "Use your church connections to find out if their hunters know anything."
 POD_christof_vysehrad.100.effect.success.desc: "Your agents find where Vukodlak is hidden."
 POD_christof_vysehrad.100.effect.failure.desc: "Your agents come back empty-handed."
 POD_christof_vysehrad.101.t: "No Little Birds"
 POD_christof_vysehrad.101.desc: "As you wait for the first reports to come in, you cannot hide your impatience. You walk all around your quarters, thinking about plans upon contingency plans. Vukodlak and his henchmen can't stay hidden from you for long.\n\n And yet, it has been weeks since you sent your agents. You should have reports by now. But so far, not a single sign from them. Whether they're dead or alive, you couldn't even tell.\n\nThis is a setback, but you can probably try again. Or you can try something else..."
 POD_christof_vysehrad.101.d: "If sending spies doesn't work, you just need to send more spies!"
 POD_christof_vysehrad.102.t: "Unswaying Honeyed Words"
 POD_christof_vysehrad.102.desc: "As you receive the first letters, you cannot hide your frustration. You have reached out to the other princes, made your case and even explained why dealing with Vukodlak was in everyone's best interest. Yet, your pleas seem to fall on deaf ears.\n\nDon't they realize the danger? Are they so much after their own interests that they are oblivious to the world that exists outside of their haven? As you feel anger rising in your chest, you sit down.\n\nThis is embarrassing.\n\nMaybe you could contact other princes and provide gifts for them at the same time? Some people listen better when there's a sack of coins in their hands. Or you can try something else..."
 POD_christof_vysehrad.103.t: "Same God, Opposite Camps"
 POD_christof_vysehrad.103.desc: "You thought if you had enough men of God among the mortals under you would be able to blend in with the local hunters. You thought that bringing them relics and the most inspiring religious texts would inspire the church to help you. Alas, the church is either unable or unwilling to help you.\n\nAre the hunters responsible for this, thwarting your plans? Or is the church really that oblivious to the danger and corrupted by the influence of Cainites?\n\nEither way, corruption seems sadly the way to go as faith alone isn't enough.\n\nOr you could try something else..."
 POD_christof_vysehrad.101.d: "If sending spies doesn't work, you just need to send more spies!" 
 POD_christof_vysehrad.102.e: "Words aren't enough for these ingrates? Let's use gifts AND words!"
 POD_christof_vysehrad.103.f: "Let's just ramp up the donations to the church!"
 # Step 2: Near the Castle 
 POD_christof_vysehrad.112.t: "Return to Castle Vysehrad"
 POD_christof_vysehrad.112.desc: "It is finally time. Your men have reported some disturbing news from Castle Vysehrad. Rumors of mangled bodies, desecrated temples... Could it be that your old enemy is back in his old fortress?\n\nYou deliver an inspiring speech to your men, about the danger posed by the forces of evil and about the righteousness of your cause. [GetScriptedCharacterByHistoryID('790951').GetFirstName] may not know it yet, but you're about to unleash holy fury on him. Mortals and cainites, both united under the cross.\n\nAs you grab the amulet of Saint Jude, you start smiling. It is time to put an end to this travesty and rescue your beloved [GetScriptedCharacterByHistoryID('792754').GetFirstName]. What is your plan?"
 POD_christof_vysehrad.112.a: "Bring your entire army."
 POD_christof_vysehrad.112.a.tt: "You travel to Castle Vysehrad with your entire army. This will be a martial challenge"
 POD_christof_vysehrad.112.b: "Only bring your [GetPlayer.Custom('PODCoterie')]. "
 POD_christof_vysehrad.112.b.tt: "You travel to Castle Vysehrad with your [GetPlayer.Custom('PODCoterie')]. This will be an intrigue challenge." 
 POD_christof_vysehrad.112.c: "I can do this alone."
 POD_christof_vysehrad.112.c.tt: "This is extremely risky. This will be a difficult prowess challenge"
 POD_christof_vysehrad.110.desc: "The Prometheans got wind that your ancient enemy is once again spotted near Castle Vysehrad. The recent actions of your group certainly forced the hand of the Tzimisce: they have to be desperate to try another resurrection attempt. \n\nA szlachta corpse lies in the center of the room and you recognize the emblem on its shield. Your Brujah allies managed to get the necessary information out of him. [GetScriptedCharacterByHistoryID('790951').GetFirstName] may not know it yet, but the Promethean fires will burn him to ashes.\n\nAs you witness the Prometheans gathering around you, you can't help but smile. It is time to put an end to this travesty and rescue your beloved [GetScriptedCharacterByHistoryID('792754').GetFirstName]. What is your plan ?"
 POD_christof_vysehrad.111.desc: "It is finally time. Your contacts have reported some disturbing news from Castle Vysehrad. Rumors of mangled bodies, desecrated temples... Could it be that your old enemy is back in his old fortress?\n\nYou gather your trusted friends in your tent, explaining the situation to them in detail. They all stand near you, fully aware of your determination. [GetScriptedCharacterByHistoryID('790951').GetFirstName] may not know it yet, but you're about to unleash hell on him. Decades of torpor and anger, a fist of fury fueled by your love and passion.\n\nAs you grab the amulet of Saint Jude, you start smiling. It is time to put an end to this travesty and rescue your beloved [GetScriptedCharacterByHistoryID('792754').GetFirstName]. What is your plan ?"
 # Step 3: Walls
 POD_christof_vysehrad.120.t: "Return to Castle Vysehrad II"
 POD_christof_vysehrad.120.desc: "As you approach the castle, your scouts return with troubling news. The local lord has called his levies to arms, every able-bodied man now standing upon the walls of Vysehrad Castle, convinced they are about to repel a marauding and bloodthirsty host. The gates are barred, the banners raised, and the defenders appear resolved to fight to the last man.\n\nThe Tzimisce has whispered into mortal ears, weaving fear into certainty. To them, you are a bloodthirsty horde of mercenaries led by a spawn of the devil, coming to pillage their homes and butcher their families. Every rumor has been carefully nurtured, every doubt magnified, until the castle itself has become a trap baited with innocent blood.\n\nTo them, you are the monster. There is simply no room for diplomacy."
 POD_christof_vysehrad.120.a: "I've killed men when I was a mortal. Today is no different."
 POD_christof_vysehrad.120.a.tt: "The battle starts."
 POD_christof_vysehrad.120.a.success.tt: "Your army overwhelm the castle defenders. You enter the courtyard by force."
 POD_christof_vysehrad.120.a.failure.tt: "Your army takes the walls but suffers heavy casualties."
 POD_christof_vysehrad.121.t: "Pyrrhic Victory"
 POD_christof_vysehrad.121.desc: "Any plan is bound to unravel. You knew that when you launched your men at the walls. You didn't expect the mortals to be so eager to defend this place, nor did you expect so many szlachta...\n\nWar is a muddy and bloody affair and for a moment, your memories of your past crusade came back flooding back. All these battles in which you were a simple soldier led to a certain death by their generals.\n\nWhile your heart darkened when you became a creature of the night, it is still difficult for you to stomach. You send all these men to die. Your men managed to take the wall, but you don't dare to count the casualties.\n\nMay these men forgive you.\nWhat would Anezka think of it?"
 POD_christof_vysehrad.121.a: "No time to bury our fallen. Let's take the dungeon."
 POD_christof_vysehrad.121.a.tt: "Your humanity can't stomach this senseless waste of lives."
 POD_christof_vysehrad.121.a.tt2: "You proceed to attack the dungeon."
 POD_christof_vysehrad.122.desc: "The plan is simple. Your troops are used as bait, attracting as many defenders of Vysehrad castle in the plains for the battle. While the castle defenses are greatly reduced, a very small group uses the shadows to reach the wall. Trying to remain undetected, the [GetPlayer.Custom('PODCoterie')] has spent the last nights studying the defenses of Vysehrad and the guards' patrol patterns. While some Cainites are inside the castle, most of the defenders are mortal.\n\nLooking at your trusted companions, you decide to use the cover of the night to infiltrate the castle. Should anyone notice you, they would have to be dealt with so as not to raise the alarm. This whole operation will have to be quick and decisive.\n\nOne of your companions attaches the end of a rope to a crossbow bolt. They wait for your signal and finally fire. You won't get a second chance."
 POD_christof_vysehrad.122.a: "Silent and deadly."
 POD_christof_vysehrad.122.a.success.tt: "You manage to reach the courtyard without any trouble"
 POD_christof_vysehrad.122.a.failure1.tt: "You encounter a few guards and have to fight but you still reach the courtyard"
 POD_christof_vysehrad.122.a.failure2.tt: "The guards raise the alarm and you are submerged by the guards. You heroically sacrifice yourself to allow your [GetPlayer.Custom('PODCoterie')] to escape."
 POD_christof_vysehrad.124.desc: "In an unexpected turn of events, you decide to infiltrate the castle alone, while having your [GetPlayer.Custom('PODCoterie')] and your men pretend to raid the convoys belonging to the Tzimisce. That much is true: it is unlikely that your foe would predict that you would attack alone.\n\nStuffing yourself into a barrel of grain, you get thrown into a cart belonging to a merchant regularly bringing supplies to the castle. Inside, you wait in a state of intense concentration, trying to ignore the discomfort. You are well armed, and prepared to wreak havoc whenever the time comes. A few days and nights pass before the cart goes into the castle. You can hear faint voices. After a time that seems extremely long, you feel the barrel being taken out of the cart. Someone is banging three times at your barrel. It's the signal.\n\nThe night is upon the castle and you're ready to exit and wreak desolation."
 POD_christof_vysehrad.124.a: "I can do it."
 POD_christof_vysehrad.124.a.success.tt: "Somehow, you manage to slay anyone noticing you and you are still undetected."
 POD_christof_vysehrad.124.a.failure.tt: "Your plan is a complete failure and you are killed by the sheer amounts of enemies"
 # Step 4: Courtyard 
 POD_christof_vysehrad.130.t: "Return to Castle Vysehrad III"
 POD_christof_vysehrad.130.desc: "You finally reach the courtyard. Beyond it lies the entrance to the dungeon. Your destination.\n\nBut as you step forward, a lone figure emerges, blocking your path. Sword in hand, he stands unmoving, his gaze fixed upon you. This is no mortal, nor one of the Szlachta that defended these walls.\nBefore you stands a vile Tzimisce, his face twisted by sinister magic and bound to his duty over his sinister master.\n\nWith a slow, deliberate motion, he raises his blade. His intentions could not be clearer: you will go no further.\n\nThere is no room for hesitation. Steel must answer steel. And blood is the price for blood."
 POD_christof_vysehrad.130.a: "A duel to death it is."
 POD_christof_vysehrad.130.a.tt: "You duel your enemy."
 POD_christof_vysehrad.130.b: "Signal your army."
 POD_christof_vysehrad.130.b.tt: "You attack him with your entire army."
 POD_christof_vysehrad.132.t: "To Meet Final Death"
 POD_christof_vysehrad.132.desc: "It happened so fast. Victory was within your reach, your beloved Anezka soon to be freed. But alas, you were robbed of it a second time. As you met your match, you feel as though you are being dragged like a bag of potatoes on the stone stairs of the castle.\n\nYour allies are either dead or have been pushed out of the castle. You aren't quite sure as you lose consciousness. Pain is all over your body. You have been bested. As you open your eyes, you see Anezka, the love of your life, is just in front of you, holding a long blade. Next to her is the henchman that bested you. But he doesn't look at you, he looks at an open sarcophagus.\n\nSuddenly, a voice. You recognize it. Vukodlak.\n\n\"Crusader. I've been patient enough, but this is truly the end for you. But I've been gracious enough for you to look another time at my ghoul, since you desire her so much. I wanted to offer her the satisfaction of killing you.\"\n\nWith fear, you look again into the eyes of your loved one, but you find no love in his eyes. Is she even herself? Is she a pawn of the demon?\n\nThese questions, alas, will never be answered as the blade severs your head from your body."
 POD_christof_vysehrad.132.a: "Anezka..."
 # Step 5: Vukodlak duel
 POD_christof_vysehrad.140.t: "To Face the Voivoide" 
 POD_christof_vysehrad.140.desc: "While you go up through the dungeon, you feel tremors in the rock. The Beast inside you is agitated, confused. You feel something terrible is about to happen. One room to the left, another corridor to the right. You progress through the fortress. You hear shouts, cries of anguish upstairs.\n\nAs you open more doors, you discover mutilated bodies and results of uncanny experiments lying on the cold floor of the castle. Experiments were done here and there is no doubt that many innocents were murdered for them. But you you are also sure of this: you recognize the marks and the tools being used. The same ones that you found during your first attack of Castle Vysehrad, years ago.\n\nThe preparations of Vukodlak's resurrection have indeed started and your attack forced them to rush their preparations. As you enter the higher level of the tower, you see a gigantic room with a sarcophagus wide open. At the sight of you, the servants of the Tzimisce run away in fear.\n\nBut do they fear you or the abomination in the opened casket? One hand emerges from it, then another. Your enemy is now in front of you, waking from torpor, though terribly weakened. You think of Anezka, and that thought gives you courage and strength.\n\nVukodlak is now standing in all his horribly deformed glory. He wasn't ready and yet he is still formidable. As he is about to speak, you draw your blade, ready to fight.\n\nYou won't even let him speak. It's now or never."
 POD_christof_vysehrad.140.a: "To the abyss with thee!"
 POD_christof_vysehrad.142.t: "A Flame Extinguished" 
 POD_christof_vysehrad.142.desc: "You fought hard, and bravely, but that wasn't enough. You fall to the floor, your strength abandoning you. Once more, you have been bested by the fiend. As you try to get back on your feet, you hear the sound of your bones cracking. You feel pain, a lot of it. All you can manage to say is \"Kill me already, thou fiend...\"\n\nAs you lay broken and defeated, you hear an otherworldly laugh. A cruel, spiteful laugh. The creature drags you on the ground and throws you effortlessly aside.\n\n\"Christof, Christof, Christof... Why would I even kill you?\"\n\nYou feel his claws opening, letting you go. He's now opening a door, letting someone enter. You struggle to see and you can only distinguish vague shadows.\n\n\"Today is a great day. I return to the world of the living and I want you to be my witness. And see this...\"You feel him attaching chains to your body.\n\nThe voice speaks again:\"There you are...\"\n\nYou see him grabbing a hooded figure and it hits you: it's Anezka. The fiend then plunge his fangs into your loved one's necks and with a disgusting sound, starts pumping all the blood out of her body. It seems to last an eternity and you can barely shout when you see him dropping her lifeless body on the ground.\"You no longer have a reason to live. And I no longer need this pawn. But you have a reason to return and fail, again.\"\n\nThe beast snaps his fingers and you are transported out of the castle into the deep forest. There, the Szlachta drop you into the river, like a big bag of rocks. It's almost sunrise and you have lost everything."
 POD_christof_vysehrad.142.a: "NO!"
 # Step 6: Victory
 POD_christof_vysehrad.150.t: "And Now I Claim My Prize" 
 POD_christof_vysehrad.150.desc: "Your sworn enemy now lies broken before your feet. You can hear Anezka calling your name as she enters the room. While you were fighting with Vukodlak, your men managed to breach the cell and free her.\n\nThe once so mighty Vukodlak looks miserable now, pathetic. You can hear him pleading for his unlife. You think of all the suffering he caused to you and your loved ones.\n\nYou still have a choice to make about what to do with the fiend."
 POD_christof_vysehrad.150.a: "Execute him."
 POD_christof_vysehrad.150.b: "Diablerize him." 
 POD_christof_vysehrad.150.b.tt: "You diablerize Vukodlak. It is very risky"
 POD_christof_vysehrad.150.c: "Turn him into a mortal."
 POD_christof_vysehrad.150.c.tt: "By prayers and using your connection with the divine, turn Vukodlak back into a mortal."
 POD_christof_vysehrad.150.d: "Burn him on a pyre."
 POD_christof_vysehrad.150.e: "Decapitate him."
 POD_christof_vysehrad.160.t: "A Long-Awaited Reunion" 
 POD_christof_vysehrad.160.desc: "It has been so long. Decades at least. You can't remember the last time you saw her. Your beloved Anezka jumps into your arms in glee. She is truly free from the fiend.\n\nFor the first time since years, you feel at peace. You slide the Amulet of Saint Jude into her hand, the symbol of a promise that you've kept. You're both free now.\n\nYou have so many things that you want to say to her, and all your heart desires now is to leave this cursed castle once and for all..\n\nHowever, there is still the matter of blood. With Vukodlak's demise, she needs a new source of blood, unless you lose her for good."
 POD_christof_vysehrad.160.a: "Embrace Anezka."
 POD_christof_vysehrad.160.a.tt: "You embrace Anezka, making her your childe."
 POD_christof_vysehrad.160.b: "Become Anezka's [Glossary('Domitor','game_concept_domitor_desc')]." 
 POD_christof_vysehrad.160.b.tt: "Anezka becomes your bound ghoul."