l_english:
 POD_christof_narration_events.1.t: "Christof's Return"
 POD_christof_narration_events.1.desc: "Brave Christof, you were born as a minor noble in France. You dedicated your life to fighting for the Lord, joining the Order of Swordbrethren and served as a noble warrior.\n\nDecades ago, you were wounded during a battle in Moravia. Nursed back to health by sister [GetScriptedCharacterByHistoryID('792754').GetFirstName], you fell in love with her. Helping the people of Prague, you fought against the horrors of Darkness, killing the Tzimisce Vampire, Ahzra The Unliving.\n\nThis act of bravery caught the attention of [GetScriptedCharacterByHistoryID('790602').GetFirstName] the Wise, a Brujah Promethean. $pod_Embraced$ by her, you became her childe. While you resent the loss of your soul, you served the Promethean cause. But this caused your enemies to capture your true love and true weakness, your dear Anezka. Fighting the Methuselah [GetScriptedCharacterByHistoryID('790951').GetFirstName] in Castle Vysehrad to free her, you discovered that she had become his ghoul and unwilling servant. Your fight ended with you and the fiend entering $pod_torpor$.\n\nWho knows how much time you could have stayed in this state. Decades? Centuries? This, however, didn't come to be as your sire managed to find your body and wake you up, three decades later. Awake and desperate to save your precious Anezka, you need choose your first steps carefully.\n\nYou could keep serving your sire's cause and have her as your patron while you continue searching for Anezka. You could also decide to go your own way and try to assemble your own [GetPlayer.Custom('PODCoterie')]. Or, a crazier idea, you could use your former contacts in the Swordbrethren and rally them to fight for you, though that path is ripe with danger. While it has been a few decades, you know Sir [GetScriptedCharacterByHistoryID('POD_cuthred').GetFirstName] is still alive and in the region..."
 POD_christof_narration_events.1.a: "What can I do for you, O Wise Ecaterina?"
 POD_christof_narration_events.1.a.tt: "Continue working for the Prometheans. Unlock Ecaterina's mission objectives."
 POD_christof_narration_events.1.b: "I can betray my oath, but not my heart. I'm doing things my way."
 POD_christof_narration_events.1.b.tt: "While you will be seen as an oathbreaker, no one has any hold on you anymore. Unlock the Independent's mission objectives  "
 POD_christof_narration_events.1.c: "Time to find Sir Cuthbert and the Swordbrethren."
 POD_christof_narration_events.1.c.tt: "This path will lead you to exert influence over your former military order. Unlock the Swordbrethren mission objectives."
 POD_christof_narration_events.1.c.tt2: "You will gain the capability to attack the lair of other creatures of the night, like any normal hunter."
 POD_christof_narration_events.1.c.tt3: "You will no longer be part of Prague's Prometheans and cut ties with your former allies."
 POD_christof_narration_events.2.t: "The Prodigal Childe"
 POD_christof_narration_events.2.desc1: "Beneath the University of Prague lies the haven of your sire. The very one who damned you but also the very one who rescued you from $pod_torpor$.\n\n[GetScriptedCharacterByHistoryID('790602').GetFirstName] the Wise, veiled leader of Prague's Prometheans. It feels like the last time you met was just yesterday, but a little more than thirty years have passed since your last encounter.\nReceiving a summons from one of her minions, you decide to honor her request. The work of the Prometheans never stops, after all.\n\nAs you emerge from the stair, you realized that little has changed. Your mistress is already there, looking at you. But she's not alone. Your fellow Cainite, [GetScriptedCharacterByHistoryID('790851').GetFirstName], stands by her side.\nShe's the one to break the silence. \"Puny childe. While thy actions were born of folly ,I will not deny that they allowed the Prometheans to secure Prague.\""
 POD_christof_narration_events.2.desc2: "Like a student listening to their teacher, you spend half of the night listening to her, catching up with the events that took place during your absence. The former Ventrue Prince of Prague, Rudolf Brandl, met his final death, and was replaced by the Nosferatu [GetScriptedCharacterByHistoryID('505089').GetFirstName].\n\nHowever, the Tzimisce threat is far from over, as Moravia is still in their grasp. An uneasy truce exists between the new Prince and [GetScriptedCharacterByHistoryID('790946').GetFirstName], another ally of [GetScriptedCharacterByHistoryID('790951').GetFirstName]. In the east, the Tzimisce have solidified the Voivodate. There are no signs of your nemesis. Most of the [GetPODArtifact('book_of_nod_link').GetName] has been stolen and its fragments are now scattered all over Europe. It is clear that your sire wants you to look into these things. \n\n[GetScriptedCharacterByHistoryID('790851').GetFirstName] then stepped forward. \"Dearest Christof, [GetScriptedCharacterByHistoryID('791482').GetFirstName] and myself will gladly join thy camp and help thee!\""
 POD_christof_narration_events.2.a: "Come with me, friends."
 POD_christof_narration_events.2.b: "You don't need to abandon your responsibilities for me."
 POD_christof_narration_events.2.c: "Come with me, Wilhelm."
 POD_christof_narration_events.2.d: "Come with me, Serena."
 POD_christof_narration_events.2.e: "Listen to Ecaterina." 
 POD_christof_narration_events.3.t: "Independent But Not Alone"
 POD_christof_narration_events.3.desc: "As you leave the haven of your sire, you take to the streets of Prague. All sorts of thoughts go through your brain. While you are now free of your obligations, you are also shunned. Most Cainites would certainly not take kindly to your transgression and from now on you might be seen as a rogue by your peers. Vampire society is bound by oaths and blood, but it isn't without its outcasts. Today you're one of them.\n\nAnd you have only one objective in mind: finding Anezka. However, for that, you need new allies and you need to prepare yourself. The last confrontation didn't end in your favor after all.\n\nWhile you go deeper in the dark alleys of Prague, you are interrupted by a familiar voice.\n\n\"Christof! I know why you did what you did, so I left to find you. I don't owe Ecaterina anything after all... Let me come with you.\""
 POD_christof_narration_events.3.a: "My friend!"
 POD_christof_narration_events.3.a.tt: "You create a new [GetPlayer.Custom('PODCoterie')] and [GetScriptedCharacterByHistoryID('791482').GetFirstName] will join it."
 POD_christof_narration_events.4.t: "The Old Soldier"
 POD_christof_narration_events.4.desc: "It took you a few days to retrieve your former mentor. The rumors were right, he never returned to his native England, but settled near Prague, serving as an experienced master of arms to the local knights.\nYour Swordbrethren kept fighting in the region, in the name of the Lord. But you know better: they were a puppet to fight against the Tzimisce's own pawns. You were among them before, wielding the cross and the sword.\n\nShortly after sunset, you ride through the outskirts of Prague, crossing the river bridge. The fact that you didn't age in all these years isn't lost on you. Were you to present yourself as a previously unknown child of the noble and well-mourned Christof, presumed dead and buried after all these years? Or should you tell him the unholy truth? That you became a creature of darkness?\n\nAs you prepare to knock on this door, it opens first. The man himself is in front of you, staring at you. Your arrival wasn't exactly discreet, but you didn't want to come as a thief in the middle of the night.\n\nYou recognize him instantly. The weathering of the ages took a heavy toll on your former comrade of arms, but he is still the same man. The once dashing knight is now an older man and yet you can still see the flame in his eyes.\n\nOf that you are certain: the shock on his face. He knows exactly who you are and no amount of trickery would be able to fool him. Would he still be the young and zealout crusaders of yore, he would have plunged a sword through your heart. But he is no longer that man. Not anymore. He invites you to enter.\n\nHe tells you his story. Cuthred spent the next twenty years fighting for the cause in Bohemia. His family back in England having perished in a local plague, he never returned to his homeland and instead rose through the ranks in the order, until he discovered the truth. The local master of the order was nothing more than a blood-slave, relaying orders from its shadowy masters to the knights. He was to be his successor, becoming a ghoul himself too, before the head of the order was beheaded by a szlachta attack coming from the Tzimisce of Moravia. As he was away that day, he survived the encounter, but left the order, spending the rest of his older days training younger knights. Without any $pod_vitae$ nor [Glossary('Domitor','game_concept_domitor_desc')], he reverted to being a mortal and all that it entails, like sickness. And Sir Cuthred has definitely been sick for a few years and his time is running out...\n\nYou proceed to tell your own story, your love for [GetScriptedCharacterByHistoryID('792754').GetFirstName] as well as your fall and return from torpor. You tell him your intention: to fight evil with righteousness and reform the ranks.\n\nYou see a glimmer in the eye of your former comrade: maybe could you save him from certain death? "
 POD_christof_narration_events.4.a: "I warn thee. Becoming my childe is no salvation, but damnation."
 POD_christof_narration_events.4.a.tt: "You embrace Sir Cuthred, making him your childe."
 POD_christof_narration_events.4.b: "Drink this liquid, it will keep you alive."
 POD_christof_narration_events.4.b.tt: "Sir Cuthred will become your ghoul, cured from his illness and able to lead your men during the day."
 POD_christof_narration_events.4.c: "Thou shalt remain free of corruption. I'm sorry..."
 POD_christof_narration_events.5.t: "A Night in Prague"
 POD_christof_narration_events.5.desc: "Tonight, you visit a place that you haven't been in for a long time. A silent watcher of mortal society, the Cathedral of Prague, where Archbishop Giza once stood.\nThat man of God never liked you, and was a corrupt man by many accounts, unworthy of the title. As you open the doors silently and pass through the entrance, you feel the weight of the place.\nThe area is not only holy, but sanctified. Many creatures of the night wouldn't dare to enter, fearing being struck by a power they barely understand.\n\nBut you are immune to it. Your faith and conviction led you there, and you were able to witness the miracles of true faith. You not only gathered the relics, you also passed all the trials. You may be cursed, but your soul isn't tainted. That, you are sure of it.\n\nAs you walk silently between the benches, a shadow in the night, you look at the crucifix that stands in the middle of the Cathedral.\n\nYou are worthy, and your brothers in arms know it.\nRedemption is not a faint dream. It is possible.\nYou will save [GetScriptedCharacterByHistoryID('792754').GetFirstName] and then you will save yourself.\n\nThere is a place for everyone in the designs of the Creator. Even for people like you."
 POD_christof_narration_events.5.a: "Redemption."
 POD_christof_narration_events.6.t: "Retribution"
 POD_christof_narration_events.6.desc: "The deed is done.\n\nThe long arm of Justice has struck down the fiends and you were its sword:\n- [GetScriptedCharacterByHistoryID('505084').GetFirstName], the Tremere who transformed Erik into a gargoyle in the Haus of Hexe, gone. Your Gangrel comrade, finally avenged!\n- [GetScriptedCharacterByHistoryID('790946').GetFirstName], the vicious Tzimisce who served [GetScriptedCharacterByHistoryID('790951').GetFirstName], met her final death. With her dead, your nemesis has one less protector!\n- [GetScriptedCharacterByHistoryID('505086').GetFirstName], the so-called paladin, scion of the Black Crosses, was defeated. You couldn't let him corrupt the Livonian Order of the Swordbrethren...\n\nAll the names are on a list, crossed off one after another.\n\nIt is however far from over. You will not rest until your nemesis is dead. He will, in time, be sent straight to hell!"
 POD_christof_narration_events.6.a: "Vengeance is a dish best served with cold blood."
 POD_christof_narration_events.7.t: "You and What Army?"
 POD_christof_narration_events.7.desc: "Since your return, you have done nothing but prepare for war. Your order still serves the same purpose as it used to. Few, however, know the true nature of your enemy. But that has never stopped the order before.\n\nYour rivals may be powerful and sink to the level of treachery, but no amount of deception will be able to resist your army of devoted brothers.\n\nYour knights are trained, your army is ready and your name is shouted by every single one of your men. It's a blessing that they are ignorant of your true nature.\n\nYou didn't deceive them; you intend to conduct the same mission as when you were mortal: destroying the forces of darkness."
 POD_christof_narration_events.7.a: "The wolves will fear the army of sheep, for I am their shepherd."
 POD_christof_narration_events.8.t: "To Understand our Past"
 POD_christof_narration_events.8.desc: "This was no easy task, but you did it. You finally reunited the book and brought it to the haven of Ecaterina, in her quiet library, under the university.\n\nThe knowledge of the vampiric genesis is also yours. Of course, you had no prior interest in the subject, merely fulfilling the wishes of your sire, Ecaterina. As you ventured through the world to find these fragments, you started to take an interest in them and learn more about the vampiric society and its legendary beginning, from the day when Cain was cursed to the flooding of the First city.\n\nYou have learned much and are wondering how much the scriptures of men and the tales of mortals are influenced by the actions of the creatures of the night. While you are lost in your thoughts, Ecaterina avidly read the book she had sought for so long.\n\nYou don't dare to interrupt her, as you see a smile in her eyes for the first time. She nearly forgot that you were here, fascinated by the knowledge she finally has in her hands.\n\n\"Thank you childe, thou hast made a great deed for the Prometheans. Come see me this evening. I will have you educated on more subjects. I owe you my thanks, Christof\", says Ecaterina."
 POD_christof_narration_events.8.alt_desc: "This was no easy task, but you did it. You finally reunited the book and brought it to Cosmos. As he reaches for the book, you can't help but remember her. How sad it is that your sire will never see it completed.\n\nThe knowledge of the vampiric genesis is also yours. Of course, you had no prior interest in the subject, merely fulfilling the wishes of your late sire, Ecaterina. As you ventured through the world to find these fragments, you started to take an interest in them and learn more about the vampiric society and its legendary beginning, from the day when Cain was cursed to the flooding of the First city.\n\nYou have learned much and are wondering how much the scriptures of men and the tales of mortals are influenced by the actions of the creatures of the night. While you are lost in your thoughts, you are interrupted by Cosmos.\n\n\"Thank you, Christof.  It will be helpful to our cause. It is only fair I grant you access to all of these books here. She had planned for you to read them. Consider this her last gift to you, whelp.\", says Cosmos."  
 POD_christof_narration_events.8.a: "Knowledge is power."
 POD_christof_narration_events.8.b: "Thank you, Cosmos." 
 POD_christof_narration_events.9.t: "Prometheans Unleashed"
 POD_christof_narration_events.9.desc: "The deed is done. The blood of the vile Tzimisce has been spilled and while you ponder on the consequences of such a reckless deed, you take consolation in knowing that they won't assist your sworn enemy.\n\nThe Prometheans have gathered in an unoccupied hall, celebrating their victory in the most Brujah way. While it's not truly a Panegyra, you witness some of your companions playing with swords while others try their luck at chess. Many are drinking. There is alcohol for the ghouls and blood for the cainites.\n\nWhile it's not over, the momentum is on the Brujah side in the region. You do not partake, but you can't resist smiling. People start shouting the name of Carthage. You get up from your chair and yell: "
 POD_christof_narration_events.9.a: "For Carthage !"
 POD_christof_narration_events.10.t: "Bohemian Freedom"
 POD_christof_narration_events.10.desc_start: "While most of its inhabitants may be unaware of the fact, Bohemia can now sleep safe and sound. The Tzimisce threat has been driven out of the region. The realm is now under the protection of the Prometheans."
 POD_christof_narration_events.10.desc_start_zwi: "While most of its inhabitants may be unaware of the fact, Bohemia can now sleep safe and sound. The Tzimisce threat has been driven out of the region. The realm is now under the protection of the Nosferatu [GetScriptedCharacterByHistoryID('505089').GetFirstName], a friend of the Prometheans."
 POD_christof_narration_events.10.desc_middle: "\n\nPrimogens and important characters from all over the realm have gathered in the main room. You can hear the talks and you know full well that they're talking about you: all of this wouldn't have been possible without your help." 
 POD_christof_narration_events.10.desc_middle_christof: "\n\nPrimogens and important characters from all over the realm have gathered in the main room, looking at you with puzzled expressions. You can hear the talks and you know full well that they're talking about you. Of all people, it is you, the fledgling childe of Ecaterina, who took control of Bohemia." 
 POD_christof_narration_events.10.desc_end_ecaterina: "\n\nYour sire, Ecaterina, is at your side. She may try to hide it, but you feel some pride in her voice: \"You did well, my childe\""
 POD_christof_narration_events.10.desc_end_cosmo: "\n\nCosmo is there, as well as the rest of your coterie. Their presence is your support. While Cosmo doesn't utter a word, he can't help but nod when seeing you. He seems to recognize the value of your actions."
 POD_christof_narration_events.10.a: "Prague is now safer."
 POD_christof_narration_events.10.a.tt: "You are now allied with the leader of Bohemia (or its higher-ranking liege if he's a vassal)."
 POD_christof_narration_events.11.t: "A Stronger Christof"
 POD_christof_narration_events.11.desc: "Closing your eyes and your fist,\nUntil your own blood becomes mist.\nFeeling the power of the beast awaken,\nYou are in control and your body is a weapon,\n\nYears of training have brought you here,\nNo longer a fledgling or a neonate turned fresh.\nYou're a sword made of blood and dead flesh.\nHarder, faster, stronger. Revenge draws near.\n\nThe skills you have acquired as a Swordbrethren,\nThe powers you gathered as a young vampire,\nNow meld into symbiosis between Beast and man.\n\nChristof! The murderer of Ahzra!\nChristof! The butcher of countless Premsyls!\nChristof! Ravager of the Tremere Fortress!"
 POD_christof_narration_events.11.a: "Run, you fools!"
 POD_christof_narration_events.12.t: "No Longer a Mere Shadow"
 POD_christof_narration_events.12.desc_start: "Having learned the origins of [GetPODArtifact('ainkurn_link').GetName], your favorite sword, you sought to have it improved.\n\n"
 POD_christof_narration_events.12.desc_p2_durga: "Fortunately for you, you managed to get the help of [GetScriptedCharacterByHistoryID('790274').GetFirstName] herself, who participated in the creation of the sword itself, eons ago. Her treasured knowledge sped up the process by months."
 POD_christof_narration_events.12.desc_p2_ayr: "Despite not being able to get the help of one of its creators, you enlisted the help of one of the best blacksmiths of Kindred society: [GetScriptedCharacterByHistoryID('791233').GetFirstName], renowned for forging many masterworks. You were fortunately able to provide him the necessary materials."
 POD_christof_narration_events.12.desc_p2_other: "Unfortunately for you, you couldn't secure the help of anyone with the relevant knowledge of the sword. But having become an expert blacksmith yourself, you managed to make that point moot. You didn't need their help anyway."
 POD_christof_narration_events.12.desc_p3: "\n\nAs you hold the blade and look at its tip and edges, you can feel its power reinforced: the magic inside it has been expanded. It thirsts for the blood of your enemies..."
 POD_christof_narration_events.12.blade_tooltip: "You will now be able to store blood into the blade as well as extracting it."
 POD_christof_narration_events.12.a: "Power is flowing from the blade."
 POD_christof_narration_events.13.t: "A Well-Known Name"
 POD_christof_narration_events.13.desc: "Tonight, your coterie members gather to commemorate the path you've taken. The former crusader is no longer a mere fledgling and the name of [GetScriptedCharacterByHistoryID('790802').GetFirstName] is becoming well known in the Cainite society. Having established contacts with other princes, many are now aware of your feud with [GetScriptedCharacterByHistoryID('790951').GetFirstName].\n\nSome have even promised help. But only time will reveal whether these words were truth or mere posturing. It doesn't matter. Your voice is now respected and heard in the Elysiums.\n\nTime stops as you raise a goblet and look at your allies. Promising them that they will all be part of it. And that the days of the fiend are now numbered. Many letters are now sitting at your desk, proving that your opinion is now worth courting. The pen might be a useful sword, now.\n\nAnd if the pen isn't enough, you can still rely on your [GetPlayer.Custom('PODCoterie')]."
 POD_christof_narration_events.13.a: "A web of contacts will certainly be useful."
