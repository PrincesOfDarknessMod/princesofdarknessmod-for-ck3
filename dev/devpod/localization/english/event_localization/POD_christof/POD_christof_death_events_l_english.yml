l_english:
 #Characters Death Events
 #-Common
 #--Anezka: only before the ending
 POD_christof_death_events.1.t: "To Die a Second Time"
 POD_christof_death_events.1.desc: "Your flame, your reason to live is gutted. The rage that consumed your mind may be gone, but the emptiness of your existence remains. The embers of grief are still hot and you can't find words to express how lost you are. Is this a second death, the destruction of the last thing that bound you to your mortal life, the destruction of love itself? \n\nYour quest to free her is sadly over.\n\nBut you are still here. And the world will not stop for you. The question remains: what will you do ? "
 POD_christof_death_events.1.a: "I shall endure."
 POD_christof_death_events.1.b: "Time to meet the dawn and the warm embrace of the sun."
 POD_christof_death_events.1.c: "Maybe I shall try to find this famed [golconda|E] and at least redeem my soul."
 #--Christof: Before Redemption - Ecaterina Path
 POD_christof_death_events.2.t: "Ashes of a Promethean"
 POD_christof_death_events.2.desc: "Christof Romuald is no more.\nOnce a knight bound by faith, then a Promethean.\n\nChristof, the slayer of Azhra the Unliving.\nChristof, the brazen childe of Ecaterina the Wise.\nChristof, born anew after his demise in Vysehrad Castle.\n\nBut alas, luck is no longer on his side. He died, never fulfilling his dream of reuniting with Anezka. He shall be remembered. A curious kindred, sometimes stuck in his ways, but never an uninteresting one.\n\nThe fool dreamed of change, acting like a Brujah in the end. His story might have been over, but that wasn't the case for the Prometheans...\n\nThe dream of Carthage isn't over."
 POD_christof_death_events.2.a: "Let's get to work."
 #--Christof: Before Redemption - Independant Path
 POD_christof_death_events.3.t: "The Death of Noble Christof"
 POD_christof_death_events.3.desc: "Christof Romuald is no more.\nOnce a knight bound by faith, then a Promethean.\n\nChristof, the slayer of Azhra the Unliving.\nChristof, the brazen childe of Ecaterina the Wise.\nChristof, born anew after his demise in Vysehrad Castle.\n\nBut alas, luck is no longer on his side. He died, never fulfilling his dream of reuniting with Anezka. He shall be remembered. A curious kindred, sometimes stuck in his ways, but never an uninteresting one.\n\nThe fool dreamed of change, acting like a Brujah in the end."
 POD_christof_death_events.3.a: "Love was stronger than his faith."
 #--Christof: Before Redemption - Swordbrethren Path
 POD_christof_death_events.4.t: "The Broken Cross"
 POD_christof_death_events.4.desc: "Christof Romuald is no more.\nFor most of the order, he was a shadowy figure wearing a cloak, a patron that would meet with the order during certain nights. Most never asked any questions. The ones who did were told that he was the son of a noble who wanted to support the order covertly.\n\nHowever, you knew better. He was the power leading from behind the curtain and pulling the threads. The holy purpose of your order became his. To punish the evildoers, the Tzimisce and to retrieve his lost love.\n\nHe died, never fulfilling his dream of reuniting with Anezka. And while you shall remember him, his quest is over. But not the calling of the order.\n\nSalvation exists for both kine and kindred, and they all have to serve the Lord. And burn those who defy His will."
 POD_christof_death_events.4.a.tt: "You can still use the \"Find lair\" action."
 POD_christof_death_events.4.a: "For Redemption, for Christof and for the Lord."
#Ecaterina - Ecaterina path 
 POD_christof_death_events.5.t: "A Promethean Extinguished"
 POD_christof_death_events.5.desc: "Your sire has met her Final Death. While she forced you into this world, you know deep down that she was the lesser evil. The Tzimisce had other plans for you after all, and you doubt they would have any mercy on you. After all, you killed one of their own before your embrace...\n\nBut this presents you with an opportunity : with your sire's demise, you are no longer bound by any oath.\n\nThe Prometheans could have brought a lot of help in your quest to free the love of your life, but maybe you can reconsider another path?\n\nThe choice is yours."
 POD_christof_death_events.5.a: "Can you help me, Cosmos ?"
 POD_christof_death_events.5.a.tt: "You will now report to her other childe, Cosmos."
 POD_christof_death_events.5.b: "I am now released from my oath. May you find peace, sire."
 POD_christof_death_events.5.b.tt: "You will now take a more independent path for your quest, without being considered as an oathbreaker."
#Cosmos - Ecaterina path
 POD_christof_death_events.7.t: "Promethean No More"
 POD_christof_death_events.7.desc: "With both Ecaterina and Cosmos dead, the capabilities of Prague's Prometheans are greatly reduced. Some of them might still be alive, but you cannot rely on them anymore...\n\nHowever, you are now free to do as you wish. Time to consider your options..."
 POD_christof_death_events.7.a: "I will fight on my own."
#-Swordbrethren
#--Cuthred
 POD_christof_death_events.6.t: "Death of a Mentor"
 POD_christof_death_events.6.desc: "Your former mentor and ally, Sir Cuthred is now dead. You remember how the two of you fought bravely in Bohemia for the Cross. Decades later, he still answered your call, and you fought together under the same light, seeking Redemption. \n\nHe was one of your last links to your mortal life. Your family in France? They are probably dead and buried...\n\nAs you and your brothers bury him in the middle of the night, you can't help but think..."
 POD_christof_death_events.6.a: "You didn't need Redemption, for your soul was never damned..."
 POD_christof_death_events.6.b: "I hope your soul is redeemed, but I fear I might have damned you..."