 POD_erembour_increase: "#N Increase#! the difficulty of incoming [skill|E] challenges"
 POD_erembour_decrease: "#P Decrease#! the difficulty of incoming [skill|E] challenges"
 POD_erembour_massively_increase: "#italic Massively#! #N increase#! the difficulty of incoming [skill|E] challenges"
 POD_erembour_massively_decrease: "#italic Massively#! #P decrease#! the difficulty of incoming [skill|E] challenges"

 POD_erembour_partial_failure: "Random [coterie|E] member will die in your place, if there is no [coterie|E] members left; you die instead."

 POD_erembour_cleanup: "Ritual has ended prematurely. Objective will be available once more"

 POD_exalted_event_chains_events.1000.t: "Beginning of the Ritual"
 POD_exalted_event_chains_events.1000.desc: "We waited for this moment for so long, but now under the New Moon, on a night when the stars are all that illuminate the heavens; we shall begin the ritual.\n\nA large group of Baali sorcerers slowly arrive at the location of the ritual; far away from populated areas to not disturb us.\n\nAs we all slowly begin the final preparations, I found myself doing nothing. Everything proceeds without my participation, The Baali are unnaturally motivated; probably due to the promise of awakening a Child of the Outer Dark and the great change we are about to enact."
 POD_exalted_event_chains_events.1000.a: "This cannot stand, I will personally manage the ritual."
 POD_exalted_event_chains_events.1000.b: "Observe the preparations from the side."
 POD_exalted_event_chains_events.1000.c: "Actually, let's rethink it."

 POD_exalted_event_chains_events.1010.t: "Call to the Children"
 POD_exalted_event_chains_events.1010.desc: "The preparations are done, everyone knows what they are supposed to do. There is no need to delay the ritual.\n\nA group composed mostly of Baali demonologists and blood sorcerers starts the first ritual; the one responsible for creating a #V;glow_color:{0.5,0.2,1,0.5} hole#! in reality leading to the place where the Children of the Outer Dark reside. Meanwhile I with a few helpers begin preparing the second ritual; the one responsible for directing the #V;glow_color:{0.5,0.2,1,0.5} hole#! towards Erembour.\n\nEverything goes according to plan... until my reality shatters, I #V;glow_color:{1,0.8,0.2,0.5} feel#! the sound of the #V;glow_color:{0.5,0.2,1,0.5} void#! below reality. The cacophony is overwhelming, every single sound superimposed onto itself creating a deafening #V;glow_color:{0.5,0.2,1,0.5} silence#! that nearly shatters my mind.\n\nI nearly forget my purpose, but \"nearly\" makes a huge difference. I need to #EMP direct#! the second ritual towards the correct #V;glow_color:{0.5,0.2,1,0.5} sound#!, the one emitted by Erembour... I do not have much longer, I must act now."
 POD_exalted_event_chains_events.1010.a: "Amidst the cacophony, listen for a flute."
 POD_exalted_event_chains_events.1010.b: "Amidst the cacophony, trust your calculations."
 POD_exalted_event_chains_events.1010.success: "You have chosen correctly"
 POD_exalted_event_chains_events.1010.failure: "You have chosen incorrectly"

 POD_exalted_event_chains_events.1011.t: "Call to the Children"
 POD_exalted_event_chains_events.1011.desc: "Through the howls and screams, straining, I hear the roar of a dragon, struggling amidst a mass of howls, flutes, wails, and sobs. Covertly, I direct the ritualists among the Dragon-Blooded to focus on that sound. The Dragon's call grows clearer, and for a moment, I relax.\n\nAnd then I realize I made a MASSIVE mistake. \n\nThe ritual's inertia carries on, and the vampires grow more and more ecstatic. We begin to feel an overwhelming sense of dread, as the mortals around us begin screaming in terror. They begin violently disemboweling themselves with their hands, pulling out their intestines to strangle themselves with it or violently tearing each other apart. Others wail and throw themselves to their deaths, set themselves ablaze, or seek out children giggling manically to split them apart. The feelings of cosmic omnicidal misanthropy. In a fit you grab the nearest attendant and smash their head open, before falling to the ground in terror. The ritual reaches an apex as the original Fetich soul of the Ebon Dragon emerges, the one that represented his hatred of reality and desire to subjugate it everlasting. Darkness rises, killing thousands as it pulls them into the spaces between existed to be tormented beyond the death of time. \n\nLooking up, I weep as a light breaks through the heavens, as the Morning Star rises. It has judged you all wicked and foul, so profane no afterlife is fitting for ones as wretched as you. And the last thing you see is a sunrise that wipes away the darkness."
 POD_exalted_event_chains_events.1011.a: "What have we done?"

 POD_exalted_event_chains_events.1020.t: "Erembour, That Which Calls to the Shadows"
 POD_exalted_event_chains_events.1020.desc: "As quickly as the #V;glow_color:{1,0.8,0.2,0.5} sound#! of the #V;glow_color:{0.5,0.2,1,0.5} void#! arrived, it disappeared. But we don't have much time to relax, the second ritual has directed the #V;glow_color:{0.5,0.2,1,0.5} hole#! towards a Child of Outer Dark; soon their influence will arrive.\n\nAnd I was correct.\n\nWhile the cacophony of the #V;glow_color:{0.5,0.2,1,0.5} void#! was a mind-shattering #V;glow_color:{0.5,0.2,1,0.5} silence#! made of impossible #V;glow_color:{1,0.8,0.2,0.5} sound#!, the new #V;glow_color:{1,0.8,0.2,0.5} sound#! is different; It resembles a... flute? As soon as I #V;glow_color:{1,0.8,0.2,0.5} hear#! it, the #V;glow_color:{1,0.8,0.2,0.5} need#! to sleep overwhelms me. I just need to rest... I deserve rest from the world and the neverending pain in it...\n\nNo, I cannot rest! I have to see this ritual through and experience the end. It is not time yet...\n\nWith this sense of clarity, I manage to partially stave off the flute's influence. But not all of us were so lucky, and sorcerers critical to the ritual's success are dozing off one by one. I have to do something..."
 POD_exalted_event_chains_events.1020.a: "Physically, remind them to stay awake."
 POD_exalted_event_chains_events.1020.b: "'We knew we couldn't trust you!'"
 POD_exalted_event_chains_events.1020.c: "Ignore them, the ritual is more important."
 POD_exalted_event_chains_events.1020.success: "You successfully arise casters"
 POD_exalted_event_chains_events.1020.partial_failure: "You managed to arise casters, but it wasn't without sacrifices"
 POD_exalted_event_chains_events.1020.failure: "Distracted by trying to arise casters, you fall into slumber"

 POD_exalted_event_chains_events.1030.t: "Erembour, That Which Calls to the Shadows II"
 POD_exalted_event_chains_events.1030.desc: "With each second passed, the influence of the flute increases and with it the #V;glow_color:{1,0.8,0.2,0.5} need#! to rest.\n\nNevertheless, we try to stay awake, to see the darkness on the other side. One by one we fall deeper but then climb back again into clarity, it is #R excruciating#!.\n\nSuddenly, I #V;glow_color:{1,0.8,0.2,0.5} feel#! reality tremble, becoming more ethereal with each passing moment. Erembour started to push against weaken reality, I #V;glow_color:{1,0.8,0.2,0.5} feel#! the world pushing back in an endless tug-of-war.\n\nStrike after strike, Erembour rams into the bars of her prison... There must be something we can do to help her, otherwise we aren't going to make it."
 POD_exalted_event_chains_events.1030.a: "'FOCUS! We need to help her!'"
 POD_exalted_event_chains_events.1030.b: "Start micromanaging the ritual."
 POD_exalted_event_chains_events.1030.c: "Trust the ritual and endure."
 POD_exalted_event_chains_events.1030.success: "Due to your shout, casters refocus on the ritual"
 POD_exalted_event_chains_events.1030.failure: "Distracted by shouting, you fall into slumber while ritual fails"

 POD_exalted_event_chains_events.1040.t: "Erembour, That Which Calls to the Shadows III"
 POD_exalted_event_chains_events.1040.desc: "Reality #V;glow_color:{0.5,0.2,1,0.5} breaks#!. Thoughts disappear, body disintegrates, and I #N die#!...\n...\n...\n...\nOr not? Suddenly everything returns to me, I do have a body, I do think and I was in a middle of an ritual to summon Erembour into reality...\n\nAnother second passes and I finally connect what happened, Erembour is here. The fact I am still awake is a miracle, I should be in a eternal slumber but I am not. I see everyone around me in a similar state of unreality... And then I remember, we have to let know the Ebon Dragon that his soul is here; we had a ritual for this ready, but I don't know if I will be able to do it alone..."
 POD_exalted_event_chains_events.1040.a: "'WAKE UP AND FINISH THIS!'"
 POD_exalted_event_chains_events.1040.b: "Do the job of the fallen"
 POD_exalted_event_chains_events.1040.success: "The Ebon Dragon has heard Erembour and arrived at the ritual"
 POD_exalted_event_chains_events.1040.partial_failure: "the Ebon Dragon has heard Erembour but arrived at the ritual too late"
 POD_exalted_event_chains_events.1040.failure: "The Ebon Dragon has never heard Erembour, ritual has failed as you fall into slumber"

 POD_exalted_event_chains_events.1050.t: "Witch and the Dragon"
 POD_exalted_event_chains_events.1050.desc: "Unknown amount of time passes, I fall into slumber only to miraculously return only then to once again fall. Finally amidst the pandemonium of #V;glow_color:{1,0.8,0.2,0.5} feelings#! and reality #V;glow_color:{1,0.8,0.2,0.5} breaking apart#! the Ebon Dragon arrives.\n\nThe reunion is near, and with appearance of the Ebon Dragon I regain a spark of clarity. It's only now I can #V;glow_color:{1,0.8,0.2,0.5} See#! Erembour; A humanoid figure, silken robes of silver with flawless skin of deepest black; Liquid eyes shimmer like the moon and strands of glowing white hair twinkle amid here raven tresses. She's... wrong, reality itself declared her an antithetical to it's existed. Even though nothing stands to make her so, I #V;glow_color:{1,0.8,0.2,0.5} feel#! wrong looking at her.\n\nAnd before her is the Ebon Dragon, a mass of moving shadows which I somehow can describe as a serpentine dragon. In contrast to the Erembour, he... seems as real as anything else. Realer than anything anyone has ever seen, like a truth that not even God could overwrite. His whiskers tickle reality and spread to the darkest spaces, becoming the eye of reality in this hurricane of insanity.\n\nThen I once again #V;glow_color:{1,0.8,0.2,0.5} feel#! the #V;bold;glow_color:{1,0.8,0.2,0.5} need#! to go asleep, this time it feels different. It feels final, is this the end?"
 POD_exalted_event_chains_events.1050.a: "Just... Stay... Awake..."
 POD_exalted_event_chains_events.1050.success: "You managed to stay awake"
 POD_exalted_event_chains_events.1050.failure: "Unfortunately you won't be a able to bask in the glory of your achievement"

 POD_exalted_event_chains_events.1060.t: "Promised Reunion"
 POD_exalted_event_chains_events.1060.desc: "Eyes heavy and mind delirious, through bleary eyelids I manage to stay awake. Staggering, I look to the two primordial forces of darkness meet. Erembour, mournful and in pain as reality gnaws and rips at her flesh, looks up to the dragon as liquid midnight streams down her cheeks. The Ebon Dragon, once with a look on their head that could best be described as placid and vacant, flickers with recognition. Guilt and horror cross his face, as he looks down in shame. The weight of memory, the burden of his sins, and the magnitude of his hubris crash down upon him. But before he can languish, Erembour stops playing her flute, her hands reaching out, and gently cradling his chin. Threads of darkness and whiskers of antilight spread through the air like filaments, joining them as one.\n\nBut such gentleness was not ordained in God's World, and a colossal force of the light of morning cuts through the darkness, arrows of light descending on the assembled host. But the Dragon does not flinch. As the assembled Vampires are destroyed, I and the other Dragon-Blooded are preserved. The Ebon Dragon, still letting his head cradle in Erembour's embrace, reaches a claw forward, and plucks the morning star from the heavens. The angel screams, its cries cut off as the Night Before It crushes it in his claws, until all that remains is a diamond of light, held in a band of darkness. \n\nA wedding ring.\n\nAs the Dragon and Flutist depart, he needs not speak to know what comes next. He awaits his wife. And hen things can be made right. To atone for being the fool who brought forth a World of Darkness."
 POD_exalted_event_chains_events.1060.a: "We... did it?"



 POD_scarlet_phoenix_cleanup: "Your attempt has failed. Someone else will be able to try again."

 POD_exalted_event_chains_events.2000.t: "The Jailbreak, or Suicide"
 POD_exalted_event_chains_events.2000.desc: "The time has came, there is nothing else to do.\n\nI stand at the last 'solid' piece of reality before the [UmbraGlossary('oblivion')], waiting and gathering the courage to step forward.\n\nI know there is no going back past this moment, I know the probability of my death is nearly one hundred percent. I know this is a suicide, I already said my final goodbyes to all the people I valued in my life.\n\nThis is the only way forward, there is nothing else. It is either this, or the eternal downward spiral of this age. Am I ready to probably sacrifice myself in the name of new world? Am I ready to risk it all for something we have only a good idea about?"
 POD_exalted_event_chains_events.2000.a: "Yes, Yes I am."
 POD_exalted_event_chains_events.2000.b: "No, I... am not."

 POD_exalted_event_chains_events.2010.t: "The Fall"
 POD_exalted_event_chains_events.2010.desc: "I take the step, knowing this will be my end.\n\nI start to fall into the unreality which is [UmbraGlossary('oblivion')]; with a slim hope of getting beyond it, to the place where the tomb is localized.\n\nI fall, and I think.\n\nI see my life before my eyes, I see every regret, I see every accomplishment, I remember things I have long forgotten. I remember my first words, I remember the playing when I was a child, I remember the first roadblock in my life.\n\nDread starts to seep into my mind, I am about to die in a way leaving nothing behind. My mental defenses crack under the fear of what is about to happen, I am afraid.\n\nI do not want to die..."
 POD_exalted_event_chains_events.2010.a: "..."

 POD_exalted_event_chains_events.2020.t: "The Moment of Understanding"
 POD_exalted_event_chains_events.2020.desc: "Yes, I am going to die.\n\nThat was something I knew in the moment I decided to jump into the [UmbraGlossary('oblivion')], and yet I did it anyways. Because this has a purpose, because has a goal... to reach the other side, to release the Scarlet Phoenix from her tomb. And no matter how much of us will die, we will succeed one day.\n\nThis was never a journey ending with me being alive afterwards, yet it has a meaning... a meaning worthy to be my end.\n\nI feel myself disappearing, but I do not feel pain; I feel myself being forgotten, yet I do not feel the fear; I feel...\n\n\nYou no longer fear, you no longer think, you no longer #V;glow_color:{0.5,0.2,1,0.5} exist#!. But the spark of divinity your exaltation gave you is still there. Shining brighter than ever. A new star is born in the [UmbraGlossary('oblivion')], shining brighter than the sun illuminating the nonexistence itself with a light from previous world.\n\nBut even the divinity slowly erodes under the might of [UmbraGlossary('oblivion')]. It is now a battle of attrition, will the [UmbraGlossary('oblivion')] end sooner than the spark of purest divinity fueled by will?"
 POD_exalted_event_chains_events.2020.a: "..."
 POD_exalted_event_chains_events.2020.success: "The Spark of Divinity outlasts Oblivion"
 POD_exalted_event_chains_events.2020.failure: "Oblivion outlasts The Spark of Divinity"

 POD_exalted_event_chains_events.2030.t: "The Other Side"
 POD_exalted_event_chains_events.2030.desc: "Unknown amount of time passed. But I wake up, I.. I am dead, I have no body. Only my soul remains.\n\nBut I exist, I 'survived' the [UmbraGlossary('oblivion')]. I probably am the first one to achieve this...\n\nI am #V;glow_color:{0.5,0.2,1,0.5} beneath#! the reality itself, past the [UmbraGlossary('oblivion')]. There is nothing here, the only reason I exist is probably due to my Exaltation. Still, I have a mission. To find the soul of Scarlet Phoenix and release it, that is all I can do.\n\nBut finding it won't be easy, I never really expected to get here. But I did prepare, I know what to look for."
 POD_exalted_event_chains_events.2030.a: "I will find you..."
 POD_exalted_event_chains_events.2030.success: "You found the tomb"
 POD_exalted_event_chains_events.2030.failure: "You never find what you were looking for"

 POD_exalted_event_chains_events.2040.t: "The Tomb"
 POD_exalted_event_chains_events.2040.desc: "I am here.\n\nI managed to catch a slimmer of Essence, and followed it's lead. A place where soul of the Scarlet Phoenix is located, her #V;glow_color:{0.5,0.2,1,0.5} tomb#!.\n\nA massive structure, calling it a tomb was a mistake, more resembling a small city. I do not know how I haven't seen before, but I do have few guess. An overwhelming gloom spans the entire structure, the #V;glow_color:{0.5,0.2,1,0.5} light #! of my #V;glow_color:{0.5,0.2,1,0.5} soul#! can illuminate only few 'metres' before it too disappears.\n\nOnly one things remains, to open the gates of the tomb. Rest will be left to the soul, I... I can't do anything else, I feel I should do more. But I would never be able to. I am just a human in the end.\n\nOpening the tomb is something we discussed for a long time, creating multiple plans... But I think we didn't have to, The tomb isn't guarded, it isn't even locked. It was never supposed to protect something form outside, only from inside."
 POD_exalted_event_chains_events.2040.a: "Proceed to open the tomb."

 POD_exalted_event_chains_events.2050.t: "The Prisoner"
 POD_exalted_event_chains_events.2050.desc: "In this forgotten place, I'm greeted with the sight of treasures long since faded to dust. The last icons of a lost civilization consumed by time. Piles of the fine ash line the tomb, and the only proper item in the tomb is a mass of compacted dust, formed into a throne-like chair. And sat in it, slumped and despondant, is a soul with hair like the deepest red rubies, and eyes that once were hungry enough to devour the world now dull and lifeless. She shifts at your entry, a fine filament of dust crumbling off her, as she had been waiting here for so long that the remains of the tomb had made a blanket. Her plasmic robes are so dry they appear nearly solid, as she rises. A tarnished ruby, thrown away by God.\n\nShe looks at me, and puts her head in her hands. The enormity of what she had done, now seeing a soul from a culture she could never know coming back for her. She breaks into tears, the dust compacting to mud as she falls off her throne to her knees.\n\n\"What more can I do? He already told me I was beyond saving, that I was worthless! What more does He want! Must He destroy all that remains of me too! I wanted to try and fix it! I wanted to make up for my mistakes no matter how long it took! Why!? Wh-\"\n\nI cut her off, doing the only thing that makes sense. The mother of our people, all our greatest virtues and deepest sins manifest. She who gave us breath, whose blood we all carry. And I hugged her. I told her everything she needed to know not with words, but an embrace. Only one sentence was needed.\n\n\"I forgive you.\"\n\nThe Scarlet Empress weeps, clutching into you as hard as she can. You spend what feels like centuries here, holding each other. Finally, it is time to go. And through the darkness, you will be the star that guides her home."
 POD_exalted_event_chains_events.2050.a: "Let's go"

 POD_exalted_event_chains_events.2060.t: "Redemption"
 POD_exalted_event_chains_events.2060.desc: "The path back is easier than the Journey down. On the steps of the Sijan Tomb, I flare my essence, a lighthouse in the darkness. Life in Oblivion, a paradox that confounds the Angel of Life. A red spark ignites above, as the Scarlet Phoenix arrives not long after. She soars through the broken tombs, as her soul looks at it with tears at how changed it was. The remains of deathlords and heroes wrapped over her body, her soul thrown away, as the last true shard sees the body God took from her. \n\nBut I remind her that was the past. The Body knows its Soul. And not even God can change the shape of a Soul.\n\nThe Phoenix lands, confused, but the Scarlet soul steps forward, as the Phoenix's expression shifts. Both touch for a moment, and a great red ruby forms over them, smoldering flames cracking as they are reunited. For a moment, the fire dies out completely, as a cloud of ash rises into the darkness. But the Soul, now draped in a dress of beautiful orange and red feathers, her eyes shining with warmth and motherly love once more extends her hand. The tomb opens, as a hidden treasure soars through the air into her hand. She grabs it, as she looks it over. I can see it is a beautiful jade band encompassing a ruby.\n\nA wedding band.\n\nShe takes wings once more, and carries be from the place where the deathless died back to the world of the Living. I barely notice falling feathers clinging to my skin, rebirthing me anew as I was when I descended. The Scarlet Phoenix smiles, leaving me back in the world of the living.\n\n\"Join me in Heaven. When I find my groom, we will set the world right. And I would have you at our side when we do so.\"\n\nAnd with no more words, the Phoenix flies into the clouds, finally whole."
 POD_exalted_event_chains_events.2060.a: "I... I'm back?"
 