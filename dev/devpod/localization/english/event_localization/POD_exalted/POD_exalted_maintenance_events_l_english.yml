l_english:
 POD_exalted_maintenance_events.1.t: "Exaltion"
 POD_exalted_maintenance_events.1.desc: "The nature of Terrestrial Exaltation is unchanged since the Age of Legends. The power of the elements runs in their blood, sometimes meeting the necessary concentration to ignite into the grand conflagration of Exaltation... but most often not.\n\nBut 'often' doesn't mean never, and I am a great example."
 POD_exalted_maintenance_events.1.a: "The Power of my Ancestor"

 POD_exalted_maintenance_events.2.t: "Exaltion!"
 POD_exalted_maintenance_events.2.desc: "The nature of Terrestrial Exaltation is unchanged since the Age of Legends. The power of the elements runs in their blood, sometimes meeting the necessary concentration to ignite into the grand conflagration of Exaltation... but most often not.\n\nBut 'often' doesn't mean never, and my child is a great example."
 POD_exalted_maintenance_events.2.a: "We welcome another one of our dying kind!"