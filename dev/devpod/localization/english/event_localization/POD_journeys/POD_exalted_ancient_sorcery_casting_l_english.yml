l_english:
 POD_exalted_ancient_sorcery_casting.1.t: "Miracle from The Previous Age"
 POD_exalted_ancient_sorcery_casting.1.desc: "Once there was a time of magic and miracles, but that time is no more. Whatever was left from miracles of previous age has already long withered into obscurity and irrelevance.\n\nBut not every magic from the Old Age has meet that end, some survived and even if they are just a shadow of their old glory, they are still as miraculous as ever.\n\nYou are one of few lucky able to fully cast the sorceries long forgotten, how you got here is irrelevant. What matters is what is about to happen, with a slick of hand; maybe a long ritual or a sacrifice of one of two lives. The shining light of old magic once more fills this world, the darkness surrounding it parts for just a moment.\n\nBut even the light of Glory fades away, and the world's darkness once more fills your quarter. But not without leaving a mark of it's existence, a sign that Previous age though dead is still around."
 POD_exalted_ancient_sorcery_casting.1.a: "The aftermath of Miracle."
 POD_exalted_ancient_sorcery_casting.1.message: "You do not have enough Essence!"
 POD_exalted_ancient_sorcery_casting.1.message_desc: "Try again when you have #V [GetPlayer.MakeScope.GetVariable('current_journey').Story.MakeScope.GetVariable('sorcery_essence_cost').GetValue]#! Essence!"