 POD_exalted_study_ancient_sorcery.1.t: "Ancient Truths Reveled"
 POD_exalted_study_ancient_sorcery.1.desc: "Your road here was a long one, but as everything in life it too has ended.\n\nYou have finally pieced together all the scattered information addressing the [exalted_ancient_sorcery|E] inside, and now you are the proud Sorcerer of the Old Age, one of few in this new age."
 POD_exalted_study_ancient_sorcery.1.a: "The Knowledge of Ancients"