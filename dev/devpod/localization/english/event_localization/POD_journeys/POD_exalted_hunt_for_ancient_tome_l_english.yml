l_english:
 POD_exalted_hunt_for_ancient_tome.1.t: "Ancient Repository"
 POD_exalted_hunt_for_ancient_tome.1.desc: "Your research wasn't wrong, even better. It was right. [province.GetName] does in-fact house a Tome which is likely to contain secrets of [exalted_ancient_sorcery|E]."
 POD_exalted_hunt_for_ancient_tome.1.desc.extra: "\n\nAnd thanks to [GetDynastyPerk('exalted_common_legacy_3').GetName] you know that inside that Ancient Repository lays Tome with [GetPerk(Concatenate(SCOPE.GetFlagName('sorcery'), '_perk')).GetName(GetPlayer)]"
 POD_exalted_hunt_for_ancient_tome.1.a: "Secrets of [province.GetName]"