 POD_exalted_essence_meditation.1.t: "Expanding and Stabilizing the Inner Divinity"
 POD_exalted_essence_meditation.1.desc: "It wasn't easy, but you did it.\n\nThe newly expanded spark of divinity inside your soul is stable, and nothing can shake it anymore.\n\nYou are one step closer to power of Old Age."
 POD_exalted_essence_meditation.1.a: "One step Closer to Divinity."

 POD_exalted_essence_meditation.2.t: "Expanding and Stabilizing the Inner Divinity"
 POD_exalted_essence_meditation.2.desc: "You waited with great anticipation for your pupil to exit their seclusion. Hoping your effort hasn't gone to waste.\n\nAfter few hours your pupil has finally come to you, with their inner spark now stable.\n\nThe Exalted has gained a new powerhouse. We are one step closer to $glossary_exalted_age_of_legends$."
 POD_exalted_essence_meditation.2.a: "We are one step closer to past glory."