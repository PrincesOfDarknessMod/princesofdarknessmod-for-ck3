 POD_mummy_elixir_of_eternal_life_journeys.28.t: "The Great Cycle of Generation"
 POD_mummy_elixir_of_eternal_life_journeys.28.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in a sect's hall. Hidden in an isolated area and protected by ancient magics, their ancient hall now lays abandoned. Trees and plants have grown up around it, forming a second roof over the surprisingly-untouched structure. Vines and grass almost serve as a barrier around the hall, halting just before the hall's walls. Before the sealed gate are 5 statues arranged in a circle. Their terracotta bodies are intricately molded and shockingly life-like. Their armor is lovingly crafted and painted green, gray, blue, red, and yellow. Their axes... well, their axes are not molded at all. The axes are real, made of peach wood hafts and cold iron heads. Around the bases of the statues, you see some strange scuff marks, and some brief experimentation reveals that each statue is easily rotated. Above the gate is a plaque:\n\"A forest turned into a raging inferno that changed night to day. Hot springs and magma turned to stone as the earth bucked and heaved like a living thing. Enormous rocks hammered into the earth. Marble and granite changed to iron and tin, killing the earth and poisoning the water. The vast mines exploded as ore turned to ten times its volume in water. The lakes and rivers were choked by an endless expanse of green to be burnt once more. And so it was as the world was remade. So it was as the wheel turned once more.\"\n\nHow do you rotate each statue? Towards which statue does each face?"
 POD_mummy_elixir_of_eternal_life_journeys.28.a: "Green at Yellow. Yellow at Blue. Blue at Red. Red at Gray. Gray at Green."
 POD_mummy_elixir_of_eternal_life_journeys.28.b: "Green at Red. Red at Yellow. Yellow at Gray. Gray at Blue. Blue at Green."  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.28.c: "Green at Gray. Gray at Red. Red at Blue. Blue at Yellow. Yellow at Green."
 POD_mummy_elixir_of_eternal_life_journeys.28.d: "Green at Blue. Blue at Gray. Gray at Yellow. Yellow at Red. Red at Green."
 POD_mummy_elixir_of_eternal_life_journeys.28.e: "Do I recognize this cycle?"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.success: "The statues face the gate and swing their axes down, opening the doors"
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.failure: "The statues face you and swing their axes down, casting you out"

 POD_mummy_elixir_of_eternal_life_journeys.29.t: "The Proper Order"
 POD_mummy_elixir_of_eternal_life_journeys.29.desc: "After extensive research and sending your agents far and wide, you have obtained 5 bottles, brews from an alchemist that became a Wu T'ian several centuries ago. The red bottle burns with an inner flame, gleefully dancing within its glass confines. The green bottle hums with a subtle vitality, tendrils unfurl and curl back up like a slow heartbeat. The blue bottle sloshes with innate fluidity, flowing as if part of the tides. The yellow bottle sits heavy in your hand, each minute shift feeling as if a mountain is settling. Finally, the white bottle rings like the tintinnabulation of the bells, gleaming with a mirrored sheen. Should you combine them in the proper order, it would provide substantial benefits for your cultivation. Unfortunately, only a single excerpt from his notes have survived:\n\"The white potion is not first. The red potion is before the yellow potion. The green potion is not before the white potion but is before the yellow potion. The blue potion should go second.\""
 POD_mummy_elixir_of_eternal_life_journeys.29.a: "Red, Blue, White, Green, Yellow"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.29.b: "Red, Blue, Green, White, Yellow"
 POD_mummy_elixir_of_eternal_life_journeys.29.c: "Red, Blue, Green, Yellow, White"
 POD_mummy_elixir_of_eternal_life_journeys.29.d: "Blue, Red, White, Green, Yellow"
 POD_mummy_elixir_of_eternal_life_journeys.29.e: "Hhm, perhaps that one and then that one..."  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.success: "With a flash, it becomes perfectly transparent"
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.failure: "With a flash, a plume of smoke emerges from it"

 POD_mummy_elixir_of_eternal_life_journeys.30.t: "Odd Ingredients"
 POD_mummy_elixir_of_eternal_life_journeys.30.desc: "After extensive research and sending your agents far and wide, you have obtained an ancient alchemical recipe book, though most of its antiquated pages are beyond recovery. On the first page are listed Wormwood, Knotgrass, Pearl Dust, Spider Ichor, Moondew, Shadowbloom Leaves, Pufferfish Powder, Snake Bile, Honey Water, and Frog Eyes. Moondew is a particularly odd ingredient since itself is a liquid mixture of several other ingredients and was difficult to obtain. The only surviving recipe appears to have been written poetically. However, deciphering it could yield substantial benefits and allow for the brewing of a very potent elixir.\n\n\"Five you must shun.\nTo start the brew, neither end you should pick\nSecond inside, only one will do the trick\nYou will not need any creatures of the land\nAnd only one plant will provide a helping hand\nThree you desire, all in a line\nThe last is a powder, grown in water brine\nTo make the elixir add the neighbors and stir well, clockwise\nNext, add the liquid and bubbles shall arise\nThe last ingredient you must sprinkle, then mix it around\nNow time to drink it down.\""
 POD_mummy_elixir_of_eternal_life_journeys.30.a: "Wormwood, Knotgrass, Pearl dust, Moondew, Pufferfish Powder"
 POD_mummy_elixir_of_eternal_life_journeys.30.b: "Pearl Dust, Moondew, Shadowbloom Leaves, Snake Bile, Pufferfish Powder"
 POD_mummy_elixir_of_eternal_life_journeys.30.c: "Shadowbloom Leaves, Pufferfish Powder, Honey Water, Pearl Dust, Moondew"
 POD_mummy_elixir_of_eternal_life_journeys.30.d: "Moondew, Shadowbloom Leaves, Pufferfish Powder, Honey Water, Pearl Dust"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.30.e: "A pinch of this and a dash of that..."  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.success: "With a flash, it becomes perfectly transparent"
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.failure: "With a flash, it combusts"

 POD_mummy_elixir_of_eternal_life_journeys.31.t: "Strange Brews"
 # Yes, my notes do look like this. It works... mostly
 POD_mummy_elixir_of_eternal_life_journeys.31.desc: "After extensive research and sending your agents far and wide, you have obtained a single vial. Upon uncorking it, a cocktail of scents arise from the inscrutable liquid within, clearly a potion in the making. Based on your expertise with brewing and the rumors collected by your agents, the vial is only missing a single ingredient to be complete. Alongside the vial in its hiding place was a collection of 7 ingredients: Garrison Root, Rainbow Sycamore Oil, Psion Salt, Parsley, Skeletal Violet, Golden Skullcap, Snapdragon. Each ingredient would imbue a different effect to the vial, and adding multiple ingredients risks the entire mixture exploding. Unfortunately, you specifically need a love potion to complete your current experiment. However, all of the surviving notes are written in shorthand, and the ink has faded over the long years it was left untended. Either that, or the author was untrained in the ways of proper calligraphy.\n\nGldn ht drns fyr and prmots yin. Rnbw yl trgrs cmbstn in jain from sn. Erb tsts gud fr sup, lv it. Rd Npdrg prvd brth of fyr. Grsnrt prvnt gngrne in wuwnds. Cyon s curus rsidu frm ndrgnd lks; prmots obsshon wt tgt. Prpls eet meet dislvd bye its hcid."
 POD_mummy_elixir_of_eternal_life_journeys.31.a: "Golden Skullcap"
 POD_mummy_elixir_of_eternal_life_journeys.31.b: "Parsley"
 POD_mummy_elixir_of_eternal_life_journeys.31.c: "Psion Salt"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.31.d: "Skeletal Violet"
 POD_mummy_elixir_of_eternal_life_journeys.31.e: "Try adding all of them"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.31.effect.success: "With a pop, a heart-shaped bubble appears"
 POD_mummy_elixir_of_eternal_life_journeys.31.effect.failure: "It billows out a cloud of searing smoke"

 POD_mummy_elixir_of_eternal_life_journeys.32.t: "Descending from the Peak"
 POD_mummy_elixir_of_eternal_life_journeys.32.desc: "On your most recent journey, you have sought out an ancient oral tale that is supposed to carry one of the secrets of ascension. Finding a storyteller that knew it was extremely difficult and ultimately led you to an old woman. While her body was failing, she had little difficulty recounting the story.\n\n\"Many summers and dynasties ago, there was a cultivator named Jian. Like so many others, he sought the Heavenly Gate, to ascend beyond the mortal bounds. For a hundred years, he meditated on the highest peak, never speaking with another soul. He refined his core until even the wind dared not brush against him. One winter, a spirit blizzard, fed by the land's despair, swallowed the mountain. Admidst the madness yet completely untouched, Jian achieved all that he had sought and stood before the Gate at last. However, the winds carried the cries of a starving village at the mountain's base, frozen in the blizzard's ferocity. With a single step, he could have ascended. Leave them, and ascension was his. Stay, and the storm would devour much of his hard-earned cultivation. Help them, and it would cost even more.\nWithout a thought, Jian descended the mountain. He gave them firestones to warm them, talismans to shield them, and eventually his own breath, warming their bodies as his own grew cold. The blizzard, angered by the theft of its victims, threw its full force against him, and his cultivation shattered like thin ice. At dawn, the storm evaporated in a moment, its hunger sated not by despair but overwhelmed by generosity. Still, the Gate stood on the peak, waiting, but Jian could no longer see it. As the sun's light shone upon him, his body collapsed into dust, each of his long years catching up to him in a moment. The last thing to fade was his smile.\"\n\nWhat lesson do you glean from this tale?"
 POD_mummy_elixir_of_eternal_life_journeys.32.a: "If he was wiser, he could have aided them and preserved his strength"
 POD_mummy_elixir_of_eternal_life_journeys.32.b: "By abandoning immortality, he transcended the self that sought it"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.32.c: "Visible sacrifice is the only path to transcendence"
 POD_mummy_elixir_of_eternal_life_journeys.32.d: "The world punishes virtue and generosity."
 POD_mummy_elixir_of_eternal_life_journeys.32.e: "A difficult question indeed"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.success: "Applying this lesson enhances your own cultivation"
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.failure: "This lesson doesn't seem to further your efforts"

 POD_mummy_elixir_of_eternal_life_journeys.33.t: "The Immortal and the Healer"
 POD_mummy_elixir_of_eternal_life_journeys.33.desc: "On your most recent journey, you have sought out an ancient oral tale that is supposed to carry one of the secrets of ascension. Finding a storyteller that knew it was extremely difficult and ultimately led you to an herbalist in a small town. As he ground herbs and sold pills to the villagers, he recited a tale passed on to him from his master.\n\n\"Many summers and dynasties ago, one of the Eight Immortals was walking the lands and came across a town plagued by a deadly illness. The sick filled the streets, and among them was an alchemist who was testing unproven elixirs on the dying. Some were saved while the ends of others were hastened or made far more agonous. When the Immortal beheld this, they declared 'To gamble with life is to defy Heaven's command. To pursue the bright light of a desired future without care for the risks is to set fire to the forest.' With a breath, she cured the town entirely but cast upon the alchemist every agony he had inflicted. He wandered the land as a madman, his senses consumed by the pain. The town rejoiced, praising her mercy.\nHowever, in time, another illness came, and none of the healers dared risk error. They clung to what was known, paralyzed by fear. Many who might have been saved were instead buried with prayers.\"\n\nWhat lesson do you glean from this tale?"
 POD_mummy_elixir_of_eternal_life_journeys.33.a: "Only the fool worships blindly, and even the wise make questionable choices"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.33.b: "Had the immortal remained, illness would not have returned"
 POD_mummy_elixir_of_eternal_life_journeys.33.c: "Suffering is a necessary price for progress"
 POD_mummy_elixir_of_eternal_life_journeys.33.d: "The pursuit of knowledge creates cruelty"
 POD_mummy_elixir_of_eternal_life_journeys.33.e: "A difficult question indeed"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.33.effect.success: "Applying this lesson enhances your own cultivation"
 POD_mummy_elixir_of_eternal_life_journeys.33.effect.failure: "This lesson doesn't seem to further your efforts"

 POD_mummy_elixir_of_eternal_life_journeys.34.t: "Sow and Reap"
 POD_mummy_elixir_of_eternal_life_journeys.34.desc: "On your most recent journey, you have sought out an ancient oral tale that is supposed to carry one of the secrets of ascension. Finding a storyteller that knew it was extremely difficult and ultimately led you to an old farmer. His back is hunched and his skin darkened by many years of tending his crops. With each stroke of the hoe, he passed on a story he learned from his grandfather.\n\n\"After many long years of fighting, a soldier retired from the army and wandered the land. He came across a barren valley choked by ancient growth. The valley's river raged, tearing apart all in its way. The soil was littered with boulders capable of breaking a plow, and metal poisoned the ground. Rather than cursing fate, he felled the trees one by one, though his axe broke thrice. He diverted the waters through patiently-carved channels, though floods undid his work each season. He broke the rocks with fire and hammer, though his hands bled. He leached the toxins by planting mushrooms and spreading charcoal, though each season saw only the withering of what had been planted.\nYears passed before he sowed a single seed. Many laughed for they saw only toil and no fruit, yet he never wavered. When at last the valley softened, he planted. When the rains came, they nourished rather than destroyed. As fall approached, he reaped a harvest vast enough to feed ten villages.\"\n\nWhat lesson do you glean from this tale?"
 POD_mummy_elixir_of_eternal_life_journeys.34.a: "Always destroy what exists so that something better may be built"
 POD_mummy_elixir_of_eternal_life_journeys.34.b: "Transform yourself so success becomes inevitable"
 POD_mummy_elixir_of_eternal_life_journeys.34.c: "Ignore the warnings of others for they are fools"
 POD_mummy_elixir_of_eternal_life_journeys.34.d: "Before seeking power, clear what obstructs you"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.34.e: "A difficult question indeed"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.34.effect.success: "Applying this lesson enhances your own cultivation"
