 POD_mummy_elixir_of_eternal_life_journeys.35.t: "Forgotten Wonders"
 POD_mummy_elixir_of_eternal_life_journeys.35.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in an ancient temple. The god or gods worshipped within have long been forgotten. Even its purpose as a temple is merely a guess. Around noon, you finally reach the temple, buried by countless ages of forest growth.\n\nThe doors open upon a land of eternal night, but not of darkness. The twinkling light of innumerable stars chases away shadows left by trees many times your own height. Through the branches far above your head, gentle light streams down to play upon the blooming wildflowers. Where shadowy beasts would be expected and where hidden predators normally lurk, there are only joyful shapes cast by the stars, leaping amongst the kaleidoscope of colors. Birds, frogs, crickets, and many others you cannot name join together in a harmony lost to humanity, none overpowering another but rather one great orchestra remembering the song of a day long past.\n\nOn the far side is a locked door. Upon the lintel rests writing:\nWhat is something if you claim to have it, you lack it?\nIf you miss it in yourself, you may have it."
 POD_mummy_elixir_of_eternal_life_journeys.35.a: "Confidence"
 POD_mummy_elixir_of_eternal_life_journeys.35.b: "Sanity"
 POD_mummy_elixir_of_eternal_life_journeys.35.c: "Wisdom"
 POD_mummy_elixir_of_eternal_life_journeys.35.d: "Humility"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.35.e: "Does the environment carry a clue?" # 25 learning check
 POD_mummy_elixir_of_eternal_life_journeys.35.effect.success: "The doors swing open"
 POD_mummy_elixir_of_eternal_life_journeys.35.effect.failure: "The doors fade away into the trees"
