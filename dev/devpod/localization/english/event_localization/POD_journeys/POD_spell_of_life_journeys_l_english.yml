 POD_mummy_spell_of_life_journeys.27.t: "Path of Darkness"
 POD_mummy_spell_of_life_journeys.27.desc: "You pass between the golden etchings and walk into the emptiness, allowing it to swallow you. The darkness tugs at you, unraveling your form like a loosely-bound ball of yarn. On the hand held in front of your face, your fingers stretch as if thread pulled taut. Despite lacking anything to compare yourself against within this endless void, you know that your body is becoming longer and thinner, stretching and curling, twisting and turning. On the loom of space, your thread is being pulled out and woven into a new location as your body leaves the temple.\n\nYou know that your only chance is to reestablish your body around your mind and will so that you can push further into the temple."
 POD_mummy_spell_of_life_journeys.27.a: "I gather my will..."  # 25 stewardship check
 POD_mummy_spell_of_life_journeys.27.effect.success: "You reach your prize"
 POD_mummy_spell_of_life_journeys.27.effect.failure: "The temple spits you out"

 POD_mummy_spell_of_life_journeys.28.t: "Bones Rattle"
 POD_mummy_spell_of_life_journeys.28.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient tomb. Historical records differ regarding its inhabitants. Some say that a mage or sorcerer was buried there. Perhaps the remnants of a liche were placed there by their followers. Others say that a mummy, maybe Horus himself, once stored their body in this tomb between rebirths. Regardless of the truth, clues lie among the corpses.\n\nAfter breaking apart stones that have seen more years fall away than you have seen leaves fall, you enter into a strange cavern. A strange pedestal stands at the center, and four sarcophagi stand upright, aligned with the cardinal directions. Atop the pedestal is a scroll in a sealed container, and four buttons stick out from the pedestal's sides. On their faces are an octagon, a square, two parallel lines from top-left to bottom-right, and a vertical line. Scattered throughout the room are strange phrases, inscribed on the sarcophagi, carved into the floor, printed on the walls. \"Bones rattle\" appears 4 times. \"Cursed bones\" appears 4 times. \"Trapped doom\" appears 3 times."
 POD_mummy_spell_of_life_journeys.28.a: "Press the octagon, square, & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.b: "Press the square button"
 POD_mummy_spell_of_life_journeys.28.c: "Press the parallel line button"
 POD_mummy_spell_of_life_journeys.28.d: "Press the square, parallel, & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.e: "Press the octagon, parallel, & vertical line buttons"  # correct answer
 POD_mummy_spell_of_life_journeys.28.f: "Press the parallel & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.effect.success: "The container slides away"

 POD_mummy_spell_of_life_journeys.29.t: "Statues Rise"
 POD_mummy_spell_of_life_journeys.29.desc: "As you begin entering your chosen sequence, an orange glow suffuses the pedestal. With the last press, the soft orange glow is replaced with a red flash and a screeching sound from all angles. The carved covers of the cardinal sarcophagi slide away with the pained groans of a man as old as the tomb itself. From their once-hidden depths, four animated statues step forth, bearing chiseled armor and sculpted swords. Embedded in the stone are human bones covered in ancient runes, animating these humanoid effigies. Working in perfect concert, they begin attacking you, swinging blades that weigh as much as you with ease."
 POD_mummy_spell_of_life_journeys.29.a: "No antique figurine can beat me!"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.29.effect.success: "They crumble before you"
 POD_mummy_spell_of_life_journeys.29.effect.failure: "They drive you off"

 POD_mummy_spell_of_life_journeys.30.t: "As Above, So Below"
 POD_mummy_spell_of_life_journeys.30.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. Once, it was a home to a mystery cult. Some theorize that the priests here worshipped Osiris and Isis, though their true gods have been lost to the sands of time. Supposedly, the cult emphasized the continuation of life after death. Today, all that remains is the stone edifice of their place of worship.\n\nBuried under the temple is a hidden one, in far better condition and once witness to the cult's inner mysteries. It is a perfect reflection of what was once above the surface, flipped upside such that as you descend down the stairs, you approach what would have been a tower reaching towards the sky. At the deepest depth is a perfectly circular room. A beam of light shines down from a series of mirrors hidden within the room's ceiling, illuminating an otherwise empty portion of the room. Upon a shockingly-light pedestal at the room's center is a papyrus scroll, ancient and yet intact. A seal bearing the Feather of Judgment rests upon the scroll's front. Below, the words inscribed into the pedestal read, \"Is there no good scribe and learned man who may read this letter which I have brought to Egypt before Pharaoh without spoiling its seal? Who will read the writing within without breaking the wax?\""
 POD_mummy_spell_of_life_journeys.30.a: "I cut myself and bleed on the seal"
 POD_mummy_spell_of_life_journeys.30.b: "I bundle it in papyrus to reed it"
 POD_mummy_spell_of_life_journeys.30.c: "I sleep with my head beside it"
 POD_mummy_spell_of_life_journeys.30.d: "I reposition it below the mirrors"  # correct answer
 POD_mummy_spell_of_life_journeys.30.e: "I cast a spell to read the scroll's contents"  # 65 learning check; big bonus if Sorcerer/Theurgist trait
 POD_mummy_spell_of_life_journeys.30.effect.success: "You memorize the words you see"
 POD_mummy_spell_of_life_journeys.30.effect.failure: "The scroll crumbles at your touch"

 POD_mummy_spell_of_life_journeys.31.t: "What Remains"
 # Note: wen - an overcrowded city, a boil/cyst/tumor
 POD_mummy_spell_of_life_journeys.31.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried amongst the ruins of a city, cadaverous and interred but not dead. Beyond the Pillars of Melqart and the Gates of Gades, unholy beings claimed a city and feasted. Their loathsomeness seeped into surfaces reminiscent of spheres, angles sticking into unseeable spaces. The flat became tilted, the convex became concave, and the corners became mouths. Nightmares bred, the Cyclops came, the seven moved on, and the great wen drowned. Well... so the stories say.\n\nAs you swim down, you see diseased masonry, so similar to familiar architecture and yet cancerous, so firm and yet oozing as if slime along a shoreline. Masses of flesh and tentacles silently slither over grins held by faces resting in the darkness while above them, centuries passed. Perhaps they are waiting for banged grains. You make your way towards a monolith-crowned citadel festooned with effigies beyond description and hieroglyphs beyond definition. At the peak rests a plaque whose symbols shift and squirm under your vision.\n\"Bear your mind. Speak the phrase.\n2-1-16 1-2-5 1-2-17\""
 # Book cipher decoded via paragraph - sentence - word
 POD_mummy_spell_of_life_journeys.31.a: "Cancerous Melqart feasted"  # correct answer
 POD_mummy_spell_of_life_journeys.31.b: "Dead yet dreaming"
 POD_mummy_spell_of_life_journeys.31.c: "Cadaverous Cyclopean drowned"
 POD_mummy_spell_of_life_journeys.31.d: "Beyond the wen, convex became concave, shift and squirm"
 POD_mummy_spell_of_life_journeys.31.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.31.effect.success: "Secrets reveal themselves in the squirming"
 POD_mummy_spell_of_life_journeys.31.effect.failure: "It squirms away from you"

 POD_mummy_spell_of_life_journeys.32.t: "The Dam of Dreams"
 POD_mummy_spell_of_life_journeys.32.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie in the remnants of a noble's house. The ruin lies buried under soil left by countless floods of the nearby river. Within the house should be a book locked within a box of iron. In the box of iron is a box of copper. In the box of copper is a box of juniper wood. In the box of juniper wood is a box of ivory and ebony. In the box of ivory and ebony is a box of silver. In the box of silver is a box of gold, and in it is the book.\n\nYou scrape away the layers of dirt and walk through what was once a doorway. You pass through ancient halls and descend into what once was a basement and is now little more than a hole lit by an unnatural green. And such a green it is, coming from every angle and yet clearly originating from a jagged rip in reality. The stories told you of the so-called Dam of Dreams. Passing through it leaves you at the edge of a cliff. The air hums with the green you saw before, pulsing in time with your heartbeat. Stretched out before and below you are six miles of giant serpents, crocodiles, spiders, scorpions, and every form of reptile and arachnid ever seen or imagined. They coil and uncoil, forming vast living patterns. Circles within circles, tails brushing teeth, endlessly consuming themselves. Across the Sea of Serpents rests an ouroboros, fangs sunk into its own tail and eternally encircling the box you seek.\n\nThe old stories say that these creatures await a single command. One word to still their movements, to shift their patterns, to form a bridge."
 POD_mummy_spell_of_life_journeys.32.a: "Conclusion"
 POD_mummy_spell_of_life_journeys.32.b: "Conflict"
 POD_mummy_spell_of_life_journeys.32.c: "Ceaseless"  # correct answer
 POD_mummy_spell_of_life_journeys.32.d: "Cosmic"
 POD_mummy_spell_of_life_journeys.32.e: "I shall form a waxen crew & cut my way through"  # 25 martial check
 POD_mummy_spell_of_life_journeys.32.effect.success: "You unbox your prize"
 POD_mummy_spell_of_life_journeys.32.effect.failure: "The sea of serpents is endless"

 POD_mummy_spell_of_life_journeys.33.t: "Affinity or Death!"
 POD_mummy_spell_of_life_journeys.33.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within an ancient tomb, though whether there is a body in it is a matter of great debate. The legends speak of a wise master who drove multiple students to madness and worse. He was infamous for his tests and his punishments for failing to meet his standards. To him, those unworthy of his knowledge must prove their worthiness of life. If not, he was more than happy to correct the problem.\n\nAfter opening the tomb and progressing downwards, you enter to see a 30-foot tall statue holding a carved scroll resting upon a pedestal with a plaque and 5 buttons. In order, the buttons are red, orange, yellow, green, and blue. The plaque below the statue reads, \"Decode my teachings to prove your affinity for magic and earn my knowledge. Perhaps you can describe an automorphism of an affine space. If you prove unable to read such a simple message or perform such simple math, all of my knowledge will be destroyed. Don't try to force your way forward like an ignoramus brute.\" The scroll being held by the statue reads the following:\nG2w mooi sg ix26nojyo 2t s4y8e m2 7h21o g2whmont 74hr64g e2s7oroxr. G2w m32wnj 7homm r3o 2h4xyo 9wrr2x."
 # Affine Cipher: coefficients are a=5 and b=30 (the only numbers in the event)
 # Ultimately just a monoalphabetic substitution cipher, so o always means e
 # Decodes to "You seek my knowledge of magic so prove yourself partway competent. You should press the orange button."
 POD_mummy_spell_of_life_journeys.33.a: "Press the red button"
 POD_mummy_spell_of_life_journeys.33.b: "Press the orange button"  # correct answer
 POD_mummy_spell_of_life_journeys.33.c: "Press the yellow button"
 POD_mummy_spell_of_life_journeys.33.d: "Press the green button"
 POD_mummy_spell_of_life_journeys.33.e: "Press the blue button"
 POD_mummy_spell_of_life_journeys.33.f: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.33.effect.success: "The scroll crumbles, revealing paper"
 POD_mummy_spell_of_life_journeys.33.effect.failure: "The statue bursts into fire"

 POD_mummy_spell_of_life_journeys.34.t: "The Seeker's Lair"
 POD_mummy_spell_of_life_journeys.34.desc: "In your quest for esoteric records on the Spell of Life, you have revealed an ingredient necessary for the final ritual. That ingredient is the bile of a long-extinct reptile, said to be capable of opening its mouth wide enough for a man to walk through it without ducking. Unfortunately, a past seeker of the Spell of Life exterminated all of those reptiles due to their failed efforts. Thankfully, you found a location reputed to be that seeker's vault.\n\nYou march through the forest, cutting your way through the growth and beasts. Knots in the wood seem to follow your movements, reproaching your every step. Heavy-laden branches dangle downwards, scratching against your armor and skin like claws. Finally, you reach it. Yellowed bones sticking out of the dirt, a gaping maw emerges from the landscape. The wind whistles between the teeth, sharpening them like invisible whetstones. Carefully stepping down the stairs, you allow yourself to be swallowed by the darkness. At the base is first an open pair of jaws and then a closed pair of jaws. Harsh, angular letters were carved into the teeth of both. Reading left to right from the top corner, the open pair reads, \"Show that you should be here and be granted access.\" The closed pair reads something more confusing. \"BTELDIIEBTELDIOETBRBRYHBAELVDYHBAEHPDOEEON\"."
 # Rail fence cipher decodes to "BY THE BLADE I LIVED BY THE BLADE I HOPED TO BE REBORN" with 2 rows (like teeth)
 POD_mummy_spell_of_life_journeys.34.a: "Hold up an acid vial"
 POD_mummy_spell_of_life_journeys.34.b: "Hold up a dead body"
 POD_mummy_spell_of_life_journeys.34.c: "Hold up a sword"  # correct answer
 POD_mummy_spell_of_life_journeys.34.d: "Hold up a bell"
 POD_mummy_spell_of_life_journeys.34.effect.success: "The bile is yours"

 POD_mummy_spell_of_life_journeys.35.t: "A Jumble of Jaws"
 POD_mummy_spell_of_life_journeys.35.desc: "The jaws creak open with the sound of a sword drawn from a sheath. Where you expected a staircase downwards or perhaps a partially-empty bottle of bile, there are beasts, reptiles of a kind you've never seen before. They resemble crocodiles, though their 6 legs are jointed more like an alligator and a spiked tail trails their trunk-like bodies. Pointing up and down, dozens of teeth visibly protrude from their mouths. Apparently, this past seeker decided that breeding these beasts for their bile was far easier than hunting them in the wild. Useful, though they seem to have gone wild in the intervening ages."
 POD_mummy_spell_of_life_journeys.35.a: "Nothing a sword can't fix"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.35.effect.success: "The bile is yours"
 POD_mummy_spell_of_life_journeys.35.effect.failure: "They drive you away"

 POD_mummy_spell_of_life_journeys.36.t: "Esoteric Figures"
 POD_mummy_spell_of_life_journeys.36.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within an ancient tomb, though whether there is a body in it is a matter of great debate. The legends speak of a wise master who drove multiple students to madness and worse. He was infamous for his tests and his punishments for failing to meet his standards. To him, those unworthy of his knowledge must prove their worthiness of life. If not, he was more than happy to correct the problem.\n\nAfter opening the tomb and progressing downwards, you enter to see a 30-foot tall statue holding a carved scroll resting upon a pedestal with a plaque and 4 buttons. Upon each button is a number. The plaque below the statue reads, \"Decode my teachings to prove your affinity for magic and earn my knowledge. If you prove unable to read such a simple message or perform such simple math, all of my knowledge will be destroyed. Don't try to force your way forward like an ignoramus brute.\" The scroll being held by the statue reads the following:\n\nOrange + Blue = 5 ; Blue + Red = 3 ; Orange + Red = 4 ; Purple = ?."
 POD_mummy_spell_of_life_journeys.36.a: "Press the 3" # correct answer
 POD_mummy_spell_of_life_journeys.36.b: "Press the 4"  
 POD_mummy_spell_of_life_journeys.36.c: "Press the 5"
 POD_mummy_spell_of_life_journeys.36.d: "Press the 6"
 POD_mummy_spell_of_life_journeys.36.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.36.effect.success: "The scroll crumbles, revealing paper"
 POD_mummy_spell_of_life_journeys.36.effect.failure: "The statue bursts into fire"

 # I made up a name for a half man-half scorpion creature, loosely based on a minotaur and Serket (scorpion goddess of protection, healing, magic)
 POD_mummy_spell_of_life_journeys.37.t: "The Serketaur Sentry"
 POD_mummy_spell_of_life_journeys.37.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within a pyramid. Details of its contents are scant, though you have heard of its mighty guardian. How much truth there is to the tales remains to be seen.\n\nAn unnatural fog infuses the air, thicker than any soup you have eaten and oddly similar in smell. As you wade through it, it suddenly seems to stop as if held back by an invisible barrier. Before you stretches endless waves of sand crimson with blood, highlighted by the sun. The pyramid's silver peak rises in the distance, slowly descending into black marble as you crest the dunes and get ever closer. The sealed door is flanked by two obelisks, seeming to almost absorb the sunlight and send it pulsing through the marble's veins. Before the door is what at first seems to be a giant man holding an axe though the sands quickly part way to reveal the scorpion legs and stinger below his waist. As you approach, the serketaur blocks your path and speaks.\n\n\"You may make one statement. If it's true, I'll cut your head off. If it's false, I'll cut your belly open.\""
 POD_mummy_spell_of_life_journeys.37.a: "You'll cut my head off."
 POD_mummy_spell_of_life_journeys.37.b: "You'll cut my belly open."  # correct answer
 POD_mummy_spell_of_life_journeys.37.c: "You'll kill me"
 POD_mummy_spell_of_life_journeys.37.d: "I'll kill you first!"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.37.effect.success: "The axe moves aside, letting you pass"
 POD_mummy_spell_of_life_journeys.37.effect.failure: "The axe falls where you once were"

 POD_mummy_spell_of_life_journeys.38.t: "Power of the Party"
 POD_mummy_spell_of_life_journeys.38.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within a tomb. Where most seekers of the Spell of Life worked on their own, this cabal of mages worked together to further their goals. Where others pursued the magic of the Spell of Life alone, they sought a more holistic approach where they improved body, mind, and soul. Some say they were influenced by traditions that came from lands east of  Kemet, following the trade routes. Few details remain of their work, though the word 'akasha' appears a few times and their failure is clear.\n\nAt first, it seems like nothing more than a hole in the ground, covered over by the dirt of ages long past. You expected a staircase or a ladder, but instead, a ramp descends before you, curving to the right. With each step and each turn, you move ever downwards. Step after step, turn after turn, you pass by carved images depicting many scenes of studying, chanting, meditating, crafting, growing, dancing, and more. So it continues as you pass through gate after gate until 4 gates are behind you. Finally, you stand before a closed gate. Above it, there are some words inscribed. \"Speak the truth to continue. When there are two of me, we are better than one. When there are two hundred of me, we are a loud fool. When we move as one, nothing can stand against us. When we move in opposite directions, we move nowhere. What am I?\""
 POD_mummy_spell_of_life_journeys.38.a: "Minds"  # correct answer
 POD_mummy_spell_of_life_journeys.38.b: "Oxen"
 POD_mummy_spell_of_life_journeys.38.c: "Drums"
 POD_mummy_spell_of_life_journeys.38.d: "Wheels"
 POD_mummy_spell_of_life_journeys.38.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.38.effect.success: "The gate swings open..."
 POD_mummy_spell_of_life_journeys.38.effect.failure: "The turns lead only upwards"

 POD_mummy_spell_of_life_journeys.39.t: "What Remains?"
 # Poem by W.H. Auden from 1940. Chosen for being generally close in theme, the repeated lines (what I use for the puzzle), and its structure as a villanelle
 POD_mummy_spell_of_life_journeys.39.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within a tomb. According to the legends, the tomb now plays home to a seeker who wove his magic through poetry. He sought immortality. Through his magic, he extended his life only to discover the curse inherent to it. With each passing year, another relative passed on. With each great war, more friends were lost. Yet, he remained. As seasons passed and the leaves fell only to grow new once more, he abandoned the quest for eternal rebirth. He allowed time to overtake him. And now... now, his tomb lies ready for you to search in your quest for immortality.\n\nAtop the tomb's lintle is a simple phrase \"Fear that which remains beyond its time\". The tomb's interior is simple stone, well-made but not ornate. Eventually, you reach a long hallway with pressure plates, each plate bearing a number from 1 to 19. On the far side is a coffin with 13 dull gems on it. In front of the pressure plates is a pedestal with a poem.\n\n\"Time will say nothing but I told you so,\nTime only knows the price we have to pay;\nIf I could tell you I would let you know.\n\nIf we should weep when clowns put on their show,\nIf we should stumble when musicians play,\nTime will say nothing but I told you so.\n\nThere are no fortunes to be told, although,\nBecause I love you more than I can say,\nIf I could tell you I would let you know.\n\nThe winds must come from somewhere when they blow,\nThere must be reasons why the leaves decay;\nTime will say nothing but I told you so.\n\nPerhaps the roses really want to grow,\nThe vision seriously intends to stay;\nIf I could tell you I would let you know.\n\nSuppose all the lions get up and go,\nAnd all the brooks and soldiers run away;\nWill Time say nothing but I told you so?\nIf I could tell you I would let you know.\""
 POD_mummy_spell_of_life_journeys.39.a: "Press all but Plates 3,6,9,12,15,18"
 POD_mummy_spell_of_life_journeys.39.b: "Press all but Plates 3,5,7,11,13,17"
 POD_mummy_spell_of_life_journeys.39.c: "Press all but Plates 4,6,9,12,15,19"
 POD_mummy_spell_of_life_journeys.39.d: "Press all but Plates 6,9,12,15,18,19"  # correct answer
 POD_mummy_spell_of_life_journeys.39.e: "Press all but Plates 1,6,9,12,15,19" 
 POD_mummy_spell_of_life_journeys.39.f: "Press as many combinations as possible"  # 25 intrigue check
 POD_mummy_spell_of_life_journeys.39.effect.success: "The gems glow, and the lid swings aside"
 POD_mummy_spell_of_life_journeys.39.effect.failure: "The plates drop away into lava"

 POD_mummy_spell_of_life_journeys.40.t: "Pathway to Hell"
 POD_mummy_spell_of_life_journeys.40.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that a few clues can be found in a lost pyramid. Some say that the pyramids of old collected sunlight at their peak, using it to create a river of light for the soul to follow into the afterlife. However, not all saw sunlight as the best path into the Shadowlands. A few sought to channel darker energies from deep underground, using it in their failed attempts at the Spell of Life. They constructed an upside-down, pentagonal pyramid which dove deep, ever so deep into the rock. The rumors also speak of their obsession with the role of numerology in magical rituals, including a particular series that functioned as their identifying mark.\n\nYou pass the entrance and look down an empty void with 5 staircases leading downwards. The vast expanse is filled with an empty echo, reverberating endlessly. The dark void obscures the strange channels carved into the blackened stone that forms the pyramid's walls. Thicker than a tree's trunk, stygian chains veined with silver run from the ceiling down to the floor and key points in the walls. Upon each of the 5 floors is a series of numbers.\n13\n1113\n3113\n132113\n1113122113\n\nAt the pyramid's lowest point sits a triangular altar linked to the channels along the walls. Upon the altar's sides are 3 buttons, each with a number going from 1 to 3."
 POD_mummy_spell_of_life_journeys.40.a: "Press '132'"
 POD_mummy_spell_of_life_journeys.40.b: "Press '213'"
 POD_mummy_spell_of_life_journeys.40.c: "Press '212323132132'"
 POD_mummy_spell_of_life_journeys.40.d: "Press '111311121113'"
 POD_mummy_spell_of_life_journeys.40.e: "Press '311311222113'"  # correct answer
 POD_mummy_spell_of_life_journeys.40.f: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.40.effect.success: "As the channels glow, words appear upon the altar"
 POD_mummy_spell_of_life_journeys.40.effect.failure: "As the channels glow, you find yourself elsewhere"
 
 POD_mummy_spell_of_life_journeys.41.t: "Crumbling Stones"
 POD_mummy_spell_of_life_journeys.41.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues can be found within the ritual site of a seeker who disappeared after performing their version of the Spell of Life. More so than almost any other place you have visited, little remains of this tomb. Fog swirls through the air, forming dew on your hands. The air is spiked with ozone, overwhelming your nostrils. Plants creak, and the sounds of animals gently reach your ears as if from a great distance. As you pass, ferns bend beneath your feet before slowly rising up behind you, removing all traces of your path. Nature has overtaken the once-grand temple. The capstones of pillars lay among the roots of trees possibly predating even you. Carved stone bricks crumble with each step. Eventually, you reach what was once the tomb's foundation but is now a circle of cracked stones. At the center is a translucent man of an indiscernible age, seeming to sit on an invisible chair.\n\n\"Ah, few fools make it to this place. Long has been since it was seen. Answer my riddle, and I shall give you what I sought in my foolishness. A mage is as old as the sorcerer will be when the mage is twice as old as the sorcerer was when the mage's age was half the sum of their present age. How old is each?\""
 POD_mummy_spell_of_life_journeys.41.a: "The mage is 30. The sorcerer is 20."
 POD_mummy_spell_of_life_journeys.41.b: "The mage is 60. The sorcerer is 20."
 POD_mummy_spell_of_life_journeys.41.c: "The mage is 45. The sorcerer is 30."
 POD_mummy_spell_of_life_journeys.41.d: "The mage is 60. The sorcerer is 45."  # correct answer
 POD_mummy_spell_of_life_journeys.41.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.41.effect.success: "\"The secret you seek is...\""
 POD_mummy_spell_of_life_journeys.41.effect.failure: "\"Leave me to await a fool worthy of my secrets\""

 POD_mummy_spell_of_life_journeys.42.t: "Cryptic Glyphs"
 # Symbols CK3 supports that resemble hieroglyphs 𓋴 𓊪 𓉔 𓇋 𓈖 𓐍 which spell out solution
 # Also, only SPHINX has right number of letters without repeating characters
 # Finally, it's a riddle so of course the answer is SPHINX
 POD_mummy_spell_of_life_journeys.42.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that a few clues can be found amongst the ruins of an ancient temple. You arrive to find the temple buried, the remnants of its roof crunching under your feet. All that remains visible is a single obelisk, somehow left untouched by the passing of ages. The golden peak seems to capture sunlight before redirecting it into your eyes, further accentuating how the stone glitters, little specks of crystal reflecting light in every direction. Upon the obelisk's base is a plaque.\n\n\"Speak, seeker, and choose your word with care\nFor truth is a light that answers only the worthy.\nUtter the proper word, and be illuminated by its glow\nBut speak falsely, and the darkness shall claim your chance forever more.\n∫ ο љ ₫ …  ҈\""
 POD_mummy_spell_of_life_journeys.42.a: "HORUS"
 POD_mummy_spell_of_life_journeys.42.b: "KEMET"
 POD_mummy_spell_of_life_journeys.42.c: "OSIRIS"
 POD_mummy_spell_of_life_journeys.42.d: "SPHINX"  # correct answer
 POD_mummy_spell_of_life_journeys.42.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.42.effect.success: "The obelisk's light shines upon you, revealing..."
 POD_mummy_spell_of_life_journeys.42.effect.failure: "The golden peak blackens, before crumbling away"

 POD_mummy_spell_of_life_journeys.43.t: "Lost Places"
 POD_mummy_spell_of_life_journeys.43.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues can be found within the ritual site of a seeker who disappeared after performing their version of the Spell of Life. More so than almost any other place you have visited, little remains of whatever this may once have been. Even your keen senses cannot tell what once sat upon this site. Fog swirls through the air, forming dew on your hands. The air is spiked with ozone, overwhelming your nostrils. Plants creak, and the sounds of animals gently reach your ears as if from a great distance. As you pass, ferns bend beneath your feet before slowly rising up behind you, removing all traces of your path. History has moved on, leaving this place abandoned. Magic courses through the air, pulsing like a heartbeat. Yet, it seems listless. At the field's center is a translucent man of an indiscernible age, seeming to sit on an invisible chair.\n\n\"Ah, few fools make it to this place. Long has been since it was seen. Answer my riddle, and I shall give you what I sought in my foolishness. What flies, and cannot stand still? What devours all it touches, yet eats nothing? What can never be lent, yet is always wasted? What is always spent, yet never earned?\""
 POD_mummy_spell_of_life_journeys.43.a: "Death"
 POD_mummy_spell_of_life_journeys.43.b: "Time"  # correct answer
 POD_mummy_spell_of_life_journeys.43.c: "Wind"
 POD_mummy_spell_of_life_journeys.43.d: "Wealth"  
 POD_mummy_spell_of_life_journeys.43.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.43.effect.success: "\"The secret you seek is...\""
 POD_mummy_spell_of_life_journeys.43.effect.failure: "\"Leave me to await a fool worthy of my secrets\""
 
 POD_mummy_spell_of_life_journeys.44.t: "Ancient Halls"
 POD_mummy_spell_of_life_journeys.44.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues can be found within an ancient fortress. As you approach, mighty peaks rise up before you, almost as if reaching to grasp the immortality of the gods. You walk upon what once was a road but is now a field, the few remaining stone bricks piled up in the distance as part of a fence. Your books claim that this used to be a busy trade route, leading to a mining town guarded by a citadel amongst the mountains. It's difficult to picture large caravans when all you see is grass. The town itself is left with little more than rotten wood, the rest reclaimed by those that remained in the area. Leading up into the fortress, the once-grand staircase carved from the mountain's insides is now indistinguishable from an abandoned mine. Even the stairs themselves have been eroded away, leaving what could generously be called a ramp. Each step echoes off the curved walls, bouncing around through the stillness. At the top is a gateway, no longer adorned as it once surely was but still standing strong. The designs once painstakingly carved into it have worn away, the paint has faded, the gold decorations have been stolen. Yet, the door and its sign remains.\n\n\"I never was, am always to be, no one ever saw me, nor will ever see, owned by none, controlled by thee. And yet I am the confidence of all, to live and breathe in this hallowed hall.\""
 POD_mummy_spell_of_life_journeys.44.a: "Hope"
 POD_mummy_spell_of_life_journeys.44.b: "Time"
 POD_mummy_spell_of_life_journeys.44.c: "Tomorrow"  # correct answer
 POD_mummy_spell_of_life_journeys.44.d: "Soul"  
 POD_mummy_spell_of_life_journeys.44.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.44.effect.success: "The doors creak upon..."
 POD_mummy_spell_of_life_journeys.44.effect.failure: "The doors remain closed, unyielding"

 POD_mummy_spell_of_life_journeys.45.t: "Forgotten Failures"
 # § - a whole is 1 so this represents 1
 # Ð - life and death are 2 things so 2
 # ß - 3 things so 3
 # Ǿ - 4 cardinal directions so 4
 # Ѭ - 5 fingers in a fist so 5
 # 5x5 Sudoku puzzle with unicode characters with the completed grid being:
 # 2 1 3 4 5
 # 4 2 5 3 1
 # 5 3 4 1 2
 # 1 4 2 5 3
 # 3 5 1 2 4
 POD_mummy_spell_of_life_journeys.45.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues can be found within some ruins, though no one remembers the place's purpose. The paved paths have been broken up by veins of grass. Once grand pillars lay shattered upon the ground. Little remains of where banners once proudly flew. The walls have become decrepit, collapsing throughout the structure and further obscuring what it once was. The imposing hall seems designed to guide people towards a particular point. With each step, you pass intricate murals and detailed carvings lying among the muck on the ground. A few loose tiles have symbols on them while some stones have full sentences. \"§ I am the source, the universe, the inseparable whole §\" says the first stone you encounter. The second reads \"Ð I am the dominator, master of life and death Ð.\" So it continues with \"ß I am all that is, was, and will be ß\" and \"Ǿ I am the primary direction on the planet, symbol of false freedom Ǿ.\" Further along, you see another stone \"Ѭ I am the grasp of existence, held within a fist Ѭ.\" It is curious how some symbols are recognizable while others baffle you.\n\nIn time, you reach a gateway, sealed through magic and mortal might. Crudely carved into the doors are the words \"And so the world's palace becomes a fool's prison\" followed by a grid with some missing characters. You will need to place the fallen tiles into the proper places to continue.\n\n Ð (a) ß (b) Ѭ \n(c) Ð  Ѭ  ß (d)\n Ѭ (e) Ǿ (f) Ð \n §  Ǿ  Ð  Ѭ (g)\n ß  Ѭ (h) Ð (i)"
 POD_mummy_spell_of_life_journeys.45.a: "a=§, b=Ǿ, c=Ǿ, d=§, e=ß, f=§, g=ß, h=§, i=Ǿ"  # correct answer
 POD_mummy_spell_of_life_journeys.45.b: "a=§, b=§, c=§, d=§, e=§, f=§, g=§, h=§, i=§"
 POD_mummy_spell_of_life_journeys.45.c: "a=§, b=Ð, c=Ð, d=§, e=Ǿ, f=§, g=Ǿ, h=§, i=Ð"
 POD_mummy_spell_of_life_journeys.45.d: "a=Ð, b=§, c=§, d=Ð, e=Ǿ, f=Ð, g=Ǿ, h=§, i=Ð"  
 POD_mummy_spell_of_life_journeys.45.e: "a=ß, b=ß, c=§, d=Ð, e=Ð, f=ß, g=Ð, h=ß, i=§"
 POD_mummy_spell_of_life_journeys.45.effect.success: "The gate grinds open..."
 
 POD_mummy_spell_of_life_journeys.46.t: "Forgotten Failures"
 POD_mummy_spell_of_life_journeys.46.desc: "After selecting your answer, grinding and clunking and shattering all come from the walls and the place beyond the doors. The doors may be swinging open, but you get the sense that these ancient mechanisms did not properly handle your incorrect answer.\n\nAs you enter the room, you see two red orbs faintly glowing amidst the shadows. Below them are two fangs hanging from lips twisted in a predatory smile. \"It was always a matter of time before I was freed. Those mortal fools could never accept my new, glorious form, nor could they understand that I had all eternity for them to die off. They never understood the power I now wield, that I truly am the master of life and death as I WAS ALWAYS DESTINED TO BE! NOW, now...\" says a twisted, emaciated form as it scrambles towards you. \"You shall empower me so that I may take my rightful place as this world's MASTER! All I need from you is such a cheap thing: your life. But don't worry, I'll ensure that my worshippers venerate you as a martyr.\" Those gleaming fangs leap for you..."
 POD_mummy_spell_of_life_journeys.46.a: "I will strike the fool down"  # 75 prowess check
 POD_mummy_spell_of_life_journeys.46.effect.success: "His head topples away"
 POD_mummy_spell_of_life_journeys.46.effect.failure: "You win, but at what cost"
 



 POD_mummy_elixir_of_eternal_life_journeys.10.t: "Meditations Upon Eternity"
 POD_mummy_elixir_of_eternal_life_journeys.10.desc: "Only through meditation can we come to truly understand the cycle of rebirth.\n\nThough it means neglecting my other responsibilities, by retreating into seclusion for meditation I may learn more about myself and how I may achieve eternal rebirth."
 POD_mummy_elixir_of_eternal_life_journeys.10.a: "I shall seclude myself in my [ROOT.Char.Custom('ResidenceBuilding')]"
 POD_mummy_elixir_of_eternal_life_journeys.10.b: "I shall find a place in the wilderness"
 POD_mummy_elixir_of_eternal_life_journeys.10.c: "I shall retreat to an isolated place"
 POD_mummy_elixir_of_eternal_life_journeys.10.a.tt: "Rather than starting a [journey|E], you shall meditate here, a #P safe and easy#! place"
 POD_mummy_elixir_of_eternal_life_journeys.10.b.tt: "You will start a [journey|E] to #bold $elixir_of_eternal_life_stage2_meditation_name$#!, traveling to a #Z moderately challenging#! place to meditate in"
 POD_mummy_elixir_of_eternal_life_journeys.10.c.tt: "You will start a [journey|E] to #bold $elixir_of_eternal_life_stage2_meditation_name$#!, traveling to a #N difficult and dangerous#! place to meditate in"
 POD_mummy_elixir_of_eternal_life_journeys.10.success: "Your cultivation provides some insights"
 POD_mummy_elixir_of_eternal_life_journeys.10.failure: "Your meditation fails to yield any insights"

 POD_mummy_elixir_of_eternal_life_journeys.11.t: "Meditations Upon Eternity"
 POD_mummy_elixir_of_eternal_life_journeys.11.desc: "Traveling into the wilderness, I found my mind unencumbered and free to wander. Aided by fasting and meditation, my thoughts turned inwards. I considered all that I had learned. I worked to firm up my cultivation base and further my understanding of eternal rebirth."
 POD_mummy_elixir_of_eternal_life_journeys.11.a: "The interruptions offered some difficulties..."
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success.critical: "But it slid from my awareness like water on glass"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success: "But I overcame them"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure: "And prevented me from finding inner peace"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure.critical: "And the unending cacophony stymied me"
 POD_mummy_elixir_of_eternal_life_journeys.11.b: "The journey and isolation itself presented some challenges..."
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success.critical: "But the deprivation gave me an epiphany"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success: "But I overcame them"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure: "And forced me to retreat to shelter"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure.critical: "And my lips quickly cracked from thirst"
 POD_mummy_elixir_of_eternal_life_journeys.11.internal: "Your experience with meditation and mastery of your body increases your chance of critical successes and reduces your chance of critical failures"

 POD_mummy_elixir_of_eternal_life_journeys.21.t: "[Concept('translation_minigame', 'Translating')|E] Esoteric Records"
 POD_mummy_elixir_of_eternal_life_journeys.21.desc: "Your efforts have yielded some esoteric record of an undiscernible age. Despite your familiarity with multiple languages and the linguistic capabilities of your courtiers, your combined efforts have proven insufficient to render it interpretable. Invisible ink obscures critical details. Enciphered words speckle the text. The portions written in a familiar language are barely interpretable, requiring a technical and magical mastery that you are just starting to achieve. The writer's shorthand only further complicates your translation efforts.\n\nOne particular, five-letter word seems to be the key to translating the remainder. Unfortunately, you'll only have 6 opportunities as your efforts are rather destructive."
 POD_mummy_elixir_of_eternal_life_journeys.21.b: "I give up!"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.success: "Your translation is successful"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure: "Your translation failed"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure.details: "Your failed attempts destroyed the record"

 POD_mummy_elixir_of_eternal_life_journeys.22.t: "Halls of Infinite Reflection"
 POD_mummy_elixir_of_eternal_life_journeys.22.desc: "Through your research and explorations, you discovered an ancient technique to aid in cultivation: the Halls of Infinite Reflection. By positioning yourself at the center of a ritual formation made of mirrors, the power within you will be reflected upon and unto itself many times before re-entering your body. That power will be further amplified as it courses through the geometric shapes used to construct the formation.\n\nAs you place yourself at the formation's core, there are two mirrors set almost facing one another, such that you can see yourself over your shoulder, endlessly curving away into the universe within the mirror. As you turn your eyes inward, you can feel yourself pouring into yourself, multiplying itself through the endless reflections. From an outsider's perspective, it would be almost impossible to determine where the mirrors end and you begin.\n\nAt first, everything is going well. Your cultivation is advancing by leaps and bounds. Then, you feel yourself cracking and shattering into infinite shards, each shard a fractal reflection of your form before flowing into silvered surface of the mirror before you. When you awaken, a multilayered, silvery world stretches out before you, perfectly smooth, perfectly endless. At every turn, there is a reflection of you, perfect yet insubstantial, mirroring you yet each wearing a different expression, unique even amongst all of the others. No two smiles are exactly the same, nor any two frowns. They do not move as you walk amongst and through them, only turning so that their eyes may follow you. Through the surprise and panic, an old story of the Mirror Realm comes to mind. \"Only by finding the real can one escape the prison of their own reflection.\""
 POD_mummy_elixir_of_eternal_life_journeys.22.a: "Point at yourself"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.22.b: "Try to find the imperfect copy"
 POD_mummy_elixir_of_eternal_life_journeys.22.c: "Close your eyes and run through the copies"
 POD_mummy_elixir_of_eternal_life_journeys.22.d: "Look for patterns and shapes"
 POD_mummy_elixir_of_eternal_life_journeys.22.e: "Do I remember more of that story?"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.success: "The reflections shatter, melting into you"
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.failure: "You run through many reflection before escaping"

 POD_mummy_elixir_of_eternal_life_journeys.23.t: "A Cache of Pills"
 POD_mummy_elixir_of_eternal_life_journeys.23.desc: "Your latest expedition led you to a cache of 4 medicinal pills left behind by someone that previously sought the Elixir of Eternal Life. Among the remnants of the notes, you learn that you would benefit greatly by taking exactly one of each of the 2 pill types every day. However, taking too much of any one type will negate the benefits. Unfortunately, the pills are mixed together in a single bottle, are unmarked, and look identical. How can you make sure that you take the correct pills?"
 POD_mummy_elixir_of_eternal_life_journeys.23.a: "Take 3 pills the first day & 1 the second day"
 POD_mummy_elixir_of_eternal_life_journeys.23.b: "Take 1 random pill each day to prevent the penalty"
 POD_mummy_elixir_of_eternal_life_journeys.23.c: "Eat 1 half of each pill on each day"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.23.d: "Crush 2 pills, mix them, & consume it each day"
 POD_mummy_elixir_of_eternal_life_journeys.23.e: "Take 2 random pills each day" # 50-50 roll
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.success: "The pills enhance your cultivation"
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.failure: "After much vomiting, you don't see any benefits"

 POD_mummy_elixir_of_eternal_life_journeys.24.t: "Sandy Numbers"
 POD_mummy_elixir_of_eternal_life_journeys.24.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in an ancient temple. This sect was known for its esoteric teachings regarding mathematics and divine symmetries. According to their surviving records, they believed that only through math could the Wheel of Ages be understood, tracked, or affected. However, their inner mysteries and the nature of these equations was lost when the sect declined in popularity.\n\nAfter arriving, you realized that the temple was little more than a small meeting space with seats arranged around a pit of sand. Across from the entry was a door barred with some form of magic. While most of the sand pit had been swept by the wind, you saw several stone plaques embedded into the sand before the door. After cleaning off the sand blown over them, you realized each plaque bore a number. You suspect that you need to draw the missing numbers in the sand between the plaques.\na 1 b\n3 5 7\nc 9 d"
 POD_mummy_elixir_of_eternal_life_journeys.24.a: "a=8, b=6, c=4, d=2"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.24.b: "a=6, b=8, c=2, d=4"
 POD_mummy_elixir_of_eternal_life_journeys.24.c: "a=5, b=9, c=5, d=1"
 POD_mummy_elixir_of_eternal_life_journeys.24.d: "a=-1, b=3, c=7, d=11"
 POD_mummy_elixir_of_eternal_life_journeys.24.e: "I force my way through" # 40 prowess check
 POD_mummy_elixir_of_eternal_life_journeys.24.effect.success: "The magic fades, and the way opens before you"
 POD_mummy_elixir_of_eternal_life_journeys.24.effect.failure: "The magic explodes, destroying whatever was within"

