l_english:
  POD_siochain.1.t: "Legend of Balance ~ GREY SIDE"
  POD_siochain.1.desc: "And there I stood, In place where Banality resides. I am here for final push towards true understanding of greatest enemy of Kithain, It's time for final meditation session about Banality of Autumn world"
  POD_siochain.1.a: "And I now understand..."
  POD_siochain.1.a.tooltip: "With this step complete, I can began journey to understanding other side."

  POD_siochain.2.t: "Legend of Balance ~ COLOR SIDE"
  POD_siochain.2.desc: "Dreaming, Home of kithain, Place of dreams. And Glamour creativity itself, But it is all? Maybe there is something more to this, or not. But today i am going to understand Glamour and Dreaming completly, or at least as good as possible"
  POD_siochain.2.a: "So Truth is that..."
  POD_siochain.2.a.tooltip: "With this step complete, I can began journey to connect both sides together."

  POD_siochain.3.t: "Legend of Balance ~ CONNECTION"
  POD_siochain.3.desc: "And There I stood, Between two world. With my understanding of both, I can become middle ground between these two. More than any changeling can dream"
  POD_siochain.3.a: "It is Great day."
  POD_siochain.3.a.tooltip: "This is great trial for you, And you don't know what will happen next, but you can only dream and coldly think about it"
  POD_siochain.3.a.success: "You Succeed"
  POD_siochain.3.a.failure: "You Failed"

  POD_siochain.4.t: "Legend of Balance ~ Balance"
  POD_siochain.4.desc: "Everything is over, And you are standing there, Not very sure if everything went as planned. But then you FEEL, You can completly explain what you felt, And at the same time it is always shifting. Only think that you can say is that..."
  POD_siochain.4.a: "...I did it!"
  POD_siochain.4.a.tooltip: "You achieved something thought impossible."

  POD_siochain.5.t: "Legend of Balance ~ Balance"
  POD_siochain.5.desc: "Everything is over, And you are standing there, Not very sure if everything went as planned. But then you FEEL, complete banality of world around you. It felt like whole world collapsed, You even didn't fell connection to dreaming. All colors of world has vanished, And you stand over there and thought..."
  POD_siochain.5.a: "...It's not over yet!"
  POD_siochain.5.a.tooltip: "With great challenge you overcome banality of world, And slowly regain connection to Dreaming"
  POD_siochain.5.b: "...So there was not hope from the start"
  POD_siochain.5.b.tooltip: "You fall into banality..."
  dauntain_work_in_progress: "Dauntain are not in POD yet!"

  POD_siochain.6.t: "Path of Grey"
  POD_siochain.6.desc: "Understanding Banality is hard thing to do... In your quest of understanding Banality you 'detached' your self from Glamour, And now that is going to bite you back."
  POD_siochain.6.a: "Dreamers? What are they? Can i eat it?"

  POD_siochain.7.t: "Path of Color"
  POD_siochain.7.desc: "Understanding Dreaming is hard thing to do... In your quest of understanding Dreaming And Glamour you dived into Glamour and Dreaming. And now your connection with dreaming has gone weird"
  POD_siochain.7.a: "Huh? What is that weird feeling?"