l_english:

 ###################
 ####### GUI #######
 ###################

 POD_heist_setup_suspicion_tt:0 "You will start an [infiltration|E] mission in [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]"

 POD_heist_suspicion: "[suspicion_with_icon|E]: [CurrentHeist.Var('suspicion').GetValue]"
 POD_heist_coterie:0 "Your [GetPlayer.Custom('PODCoterie')]: $POD_player_coterie$"
 POD_heist_coterie_member_absent:0 "@warning_icon!#X [Scope.Char.GetFirstNameNicknamed] is #bold not#! present at this [infiltration|E]#!"

 POD_heist_raise_suspicion_desc:0 "[suspicion_with_icon|E] will #N rise#! by $VALUE|V0$"
 POD_heist_raise_suspicion_desc_past:0 "[suspicion_with_icon|E] #N rose#! by $VALUE|V0$"
 POD_heist_trigger_suspicion_event_desc:0 "@warning_icon!#X A complication will occur at #bold $VALUE|V0$#! Suspicion#!"
 POD_heist_trigger_suspicion_event_desc_past:0 "#N Because [suspicion_with_icon|E] has reached #bold $VALUE|V0$#!, a complication has occured.#!"
 POD_heist_trigger_suspicion_event_hint:0 "#N Future [skill|E] checks during this [infiltration|E] will be more difficult.#!"
 POD_heist_maximum_suspicion_desc:0 "@warning_icon!#X You will fail this Infiltration at #bold [EmptyScope.ScriptValue('suspicion_max')|V0]#! Suspicion#!"
 POD_heist_maximum_suspicion_desc_past:0 "#N Because [suspicion_with_icon|E] has reached #bold [EmptyScope.ScriptValue('suspicion_max')|V0]#!, you have failed this [infiltration|E].#!"

 POD_heist_resource_deltas_tt:0 "Expenditures during this [infiltration|E]:"

 POD_heist_unexplored_node_tt:0 "Unexplored Location"
 POD_heist_node_location_tt:0 "This is your current location"
 POD_heist_node_effect_tt:0 "When you enter this location:"
 POD_heist_heist_paused_tt:0 "You can't move while a situation demands your attention"
 POD_heist_node_isvalid_tt:0 "You can't reach this place from your current location"

 POD_heist_option_exit:0 "Exit the mission."
 POD_heist_option_exit_tt:0 "You will leave the [infiltration|E] with whatever riches you managed to gather."
 #POD_heist_option_exit_isvalid:0 "You are not at an exit!"
 POD_heist_option_vault:0 "Gather as much gold as you can."
 POD_heist_option_vault_empty:0 "@warning_icon!#X [CurrentHeist.Var('gold_owner').Char.GetFirstNameNicknamed] has no gold anymore#!"
 POD_heist_option_money:0 "$POD_heist_option_vault$"
 POD_heist_option_fame:0 "Spread some rumors about yourself."
 POD_heist_option_gossip:0 "Stay and listen to the gossip."
 POD_heist_option_destress:0 "Relax for a while."

 POD_heist_wounded_toast:0 "You got wounded"

 POD_heist_title_node_exit:0 "You are at an Exit"
 POD_heist_desc_node_exit:0 "This is where you can enter and leave.\nOnce you have achieved the objective of this [infiltration|E], you'll still have to return to an exit so you can leave safely."

 POD_heist_title_node_empty:0 "A Hidden Passage!"
 POD_heist_desc_node_empty:0 "This corridor is completely empty.\nYou can pass through here without fear of arousing [suspicion|E]."

 POD_heist_title_node_artifact:0 "A Priceless Treasure"
 POD_heist_desc_node_artifact:0 "There it is.\nYou find the [artifact|E] you came here to steal.\nNow you just have to get out..."
 POD_heist_gain_artifact_toast:0 "You find the [artifact|E]"
 POD_heist_gain_artifact_desc:0 "[CurrentHeist.Var('target_artifact').Artifact.Custom('ColorizedArtifactName')] will be added to your loot"
 POD_heist_gain_artifact_desc_past:0 "[CurrentHeist.Var('target_artifact').Artifact.Custom('ColorizedArtifactName')] has been added to your loot"
 POD_heist_gain_artifact_hint:0 "You gain all of your loot once you exit the [infiltration|E]"

 POD_heist_title_node_vault:0 "A Massive Vault"
 POD_heist_desc_node_vault:0 "A room filled with piles of gold. This is what you came here for.\nBeware: the more time you spend collecting it, the more your [suspicion|E] will increase."

 POD_heist_title_node_event:0 "Something Unexpected Will Happen"
 POD_heist_desc_node_event:0 "Someone is beckoning you over, looking to talk with you.\nWhat do they want? Only one way to find out..."
 POD_heist_effect_node_event:0 "A random event... maybe good, maybe bad."

 POD_heist_title_node_diplomacy:0 "Smooth Talkers Needed"
 POD_heist_desc_node_diplomacy:0 "A courtier insists that they've seen you before.\nYou better convince them otherwise, or this could prove troublesome."
 POD_heist_effect_node_diplomacy_success:0 "Your charm is unparalleled"
 POD_heist_effect_node_diplomacy_fail:0 "Your charm has some parallels"
 POD_heist_effect_node_diplomacy_critfail:0 "A perfect example of what NOT to do"

 POD_heist_title_node_stewardship:0 "Bribes May Be Necessary"
 POD_heist_desc_node_stewardship:0 "Some courtiers catch you sneaking around.\nThey are willing to keep their mouths shut... for a price."
 POD_heist_effect_node_stewardship_success:0 "The bribe was successful"
 POD_heist_effect_node_stewardship_fail:0 "The courtiers are unimpressed"
 POD_heist_effect_node_stewardship_critfail:0 "You got scammed"

 POD_heist_title_node_intrigue:0 "The Subtle Approach"
 POD_heist_desc_node_intrigue:0 "The guard patrol in this area hasn't spotted you.\nYet.\nTime to put your stealth skills to the test."
 POD_heist_effect_node_intrigue_success:0 "You're like a shadow"
 POD_heist_effect_node_intrigue_fail:0 "You're like a rather noisy shadow"
 POD_heist_effect_node_intrigue_critfail:0 "You're as subtle as a Sabbat plot"

 POD_heist_title_node_learning:0 "Inconspicuous Traps"
 POD_heist_desc_node_learning:0 "This corridor is lined with traps.\nA bit of ingenuity and knowledge of construction will help in avoiding them."
 POD_heist_effect_node_learning_success:0 "Heh. Child's play"
 POD_heist_effect_node_learning_fail:0 "The traps graze you a little"
 POD_heist_effect_node_learning_critfail:0 "YOWCH"

 POD_heist_title_node_prowess:0 "Guards!"
 POD_heist_desc_node_prowess:0 "You are caught by a patrol. Too late to run.\nThe guards are no match for you, but can you defeat them quickly enough not to attract any attention?"
 POD_heist_effect_node_prowess_success:0 "Like a hot knife through butter"
 POD_heist_effect_node_prowess_fail:0 "Your scuffle makes some noise"
 POD_heist_effect_node_prowess_critfail:0 "SMASH those guards like an earthquake"

#  POD_heist_title_node_fight_elite:0 "A Dangerous Fight"
#  POD_heist_desc_node_fight_elite:0 "You see (TODO desc)"

 POD_heist_title_node_money:0 "A Vault!"
 POD_heist_desc_node_money:0 "This room is filled with piles of gold.\nYou could spend some time gathering it up, but doing so will raise your [suspicion|E]."

 POD_heist_title_node_fame:0 "An Opportunity to Impress"
 POD_heist_desc_node_fame:0 "Some courtiers are sharing stories about famous [Concept('coterie','Coteries')|E].\nYou could gain [prestige|E] by talking about your own accomplishments, but doing so will raise your [suspicion|E]."

 POD_heist_title_node_gossip:0 "The Talk of the Court"
 POD_heist_desc_node_gossip:0 "Servants are sharing juicy gossip.\nYou could spend some time listening and gain [secrets|E] or [hooks|E], but doing so will raise your [suspicion|E]."
 POD_heist_effect_node_gossip:0 "You learn a [secret|E] or gain a [hook|E] on a subject of [CurrentHeist.Var('court_owner').Char.GetFirstNameNicknamed]."

 POD_heist_title_node_destress:0 "Enjoy some Hospitality"
 POD_heist_desc_node_destress:0 "This is a lounge with amenities for guests of the court.\nYou could spend some time relaxing and losing [stress|E], but doing so will raise your [suspicion|E]."


 ######################
 ####### Events #######
 ######################

 POD_heist_arrival_title:0 "The Infiltration Begins"
 POD_heist_arrival_confirm:0 "This will be a night to remember."
 POD_heist_arrival_decline:0 "I've changed my mind. Let's turn back."

 POD_heists.1.desc.coterie:0 "We arrive.\n\nThe guards of [PlayerJourneyArtifact.GetOwner.GetShortUINamePossessive] haven wave $POD_player_coterie$ inside, and with that, we're in. Of course we were meant to be here. No reason to think otherwise.\n\nNone at all.\n\nNow all we need to do is find the [PlayerJourneyArtifact.GetName] and grab it without making a fuss."
 POD_heists.1.desc.nocoterie:0 "I arrive.\n\nThe guards of [PlayerJourneyArtifact.GetOwner.GetShortUINamePossessive] haven wave me inside, and with that, I'm in. Of course I was meant to be here. No reason to think otherwise.\n\nNone at all.\n\nNow all I need to do is find the [PlayerJourneyArtifact.GetName] and grab it without making a fuss."

 POD_heists.2.desc.coterie:0 "We arrive.\n\nThe guards of [PlayerJourneyTarget.GetShortUINamePossessive] haven wave $POD_player_coterie$ inside, and with that, we're in. Of course we were meant to be here. No reason to think otherwise.\n\nNone at all.\n\nNow all we need to do is find [PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip] vault and stuff our pockets without making a fuss."
 POD_heists.2.desc.nocoterie:0 "I arrive.\n\nThe guards of [PlayerJourneyTarget.GetShortUINamePossessive] haven wave me inside, and with that, I'm in. Of course I was meant to be here. No reason to think otherwise.\n\nNone at all.\n\nNow all I need to do is find [PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip] vault and stuff my pockets without making a fuss."

 POD_heists.100.t:0 "Successful Escape"
 POD_heists.100.desc.coterie:0 "We leave the court of [CurrentHeistTarget.GetShortUIName]. Free at last.\n\n"
 POD_heists.100.desc.nocoterie:0 "I leave the court of [CurrentHeistTarget.GetShortUIName]. Free at last.\n\n"
 POD_heists.100.desc.artifact:0 "The [displayed_artifact.GetName] is safe within my pack. No one saw me take it. A resounding success, as far as I'm concerned."
 POD_heists.100.desc.noartifact:0 "I didn't manage to get the [CurrentHeist.Var('target_artifact').Artifact.GetName]. This time. A disappointment for sure, but next time I'll be more prepared."
 POD_heists.100.desc.gold:0 "[CurrentHeistTarget.GetHerHis|U] treasury is [gold_i|E][CurrentHeist.Var('stolen_gold').GetValue|V0] lighter, thanks to my efforts. Not a bad outing."
 POD_heists.100.desc.nogold:0 "This time, I didn't manage to steal any [gold|E]. A disappointment for sure, but next time I'll be more prepared."
 POD_heists.100.a.success.coterie:0 "Another win for $POD_player_coterie$."
 POD_heists.100.a.success.nocoterie:0 "Another notch on my belt."
 POD_heists.100.a.failure:0 "I'm already plotting my next move..."

 POD_heists.101.t:0 "And So It Ends"
 POD_heists.101.desc:0 "You pushed your luck. It was bound to run out eventually.\n\nThe retinue of [heist_imprisoner.GetFirstNameNicknamed] surrounds you. Nowhere to run. There is no fanfare as you are escorted to a prison cell.\n\nSitting behind lock and key, it occurs to you that you're unlikely to get a fair trial."
 POD_heists.101.a:0 "Only a temporary setback, surely."


 ####### Suspicion Events

 # Chancellor route

 POD_heists.1001.t:0 "Complication: Too Popular"
 POD_heists.1001.desc.coterie:0 "Our [infiltration|E] has been going well so far... a little too well, in fact. No one has doubted our cover story of being on a "diplomatic mission", so we're having to answer a lot of questions on foreign relations."
 POD_heists.1001.desc.nocoterie:0 "My [infiltration|E] has been going well so far... a little too well, in fact. No one has doubted my cover story of being on a "diplomatic mission", so I'm having to answer a lot of questions on foreign relations."
 POD_heists.1001.desc.end:0 "\n\n[diplomacy_courtier.GetFirstNameNicknamed] clears [diplomacy_courtier.GetHerHis] throat. \"What do you propose should be done in response to the growing threat of [flavortext_realm.GetAdjective] expansionism?\""
 POD_heists.1001.a:0 "It's simple. Let me explain..."
 POD_heists.1001.a.success:0 "Your cover story holds up"
 POD_heists.1001.a.failure:0 "There are some inconsistencies"
 POD_heists.1001.b.coterie:0 "Excuse us for a moment."
 POD_heists.1001.b.nocoterie:0 "Excuse me for a moment."

 POD_heists.1002.t:0 "Complication: The [chancellor.GetCouncilTitle]"
 POD_heists.1002.t.target:0 "Complication: The [chancellor.Custom('WomanManGirlBoy')] [chancellor.GetHerselfHimself]"
 POD_heists.1002.desc.coterie:0 "We managed to duck away from the buzzing swarm of courtiers, but it looks like our antics caught someone's eye.\n\n"
 POD_heists.1002.desc.nocoterie:0 "I managed to duck away from the buzzing swarm of courtiers, but it looks like my antics caught someone's eye.\n\n"
 POD_heists.1002.desc:0 "It's [CurrentHeistTarget.GetFirstNamePossessive] [chancellor.GetCouncilTitle], [chancellor.GetFirstNameNicknamed].\n\n"
 POD_heists.1002.desc.target:0 "It's [chancellor.GetFirstNameNicknamed], none other than the person in charge.\n\n"
 POD_heists.1002.desc.end.coterie:0 "[chancellor.GetSheHe|U] invites us to have a more in-depth conversation on matters of political import, as would befit diplomats of our station."
 POD_heists.1002.desc.end.nocoterie:0 "[chancellor.GetSheHe|U] invites me to have a more in-depth conversation on matters of political import, as would befit a diplomat of my station."
 POD_heists.1002.desc.end:0 "\n\nDoes [chancellor.GetSheHe] suspect something? [chancellor.GetHerHis|U] face is unreadable."
 POD_heists.1002.a.coterie:0 "Of course. We shall join you."
 POD_heists.1002.a.nocoterie:0 "Of course. I shall join you."
 POD_heists.1002.a.success:0 "You have a lovely chat"
 POD_heists.1002.a.failure:0 "You manage to look shifty"
 POD_heists.1002.b.coterie:0 "We must decline."
 POD_heists.1002.b.nocoterie:0 "I must decline."

 POD_heists.1003.t:0 "Complication: Just One More Thing..."
 POD_heists.1003.desc.coterie:0 "[chancellor.GetFirstNameNicknamed] crosses our path once more, trying to make it look so utterly casual that it crosses back into parody."
 POD_heists.1003.desc.nocoterie:0 "[chancellor.GetFirstNameNicknamed] crosses my path once more, trying to make it look so utterly casual that it crosses back into parody."
 POD_heists.1003.desc.end:0 "\n\n\"Oh, listen, there's one other thing I wanted to ask you about\", [chancellor.GetSheHe] begins. \"A servant tells me they saw you spend an awful lot of time in places that are off-limits to visitors. Sounds silly, I know. At any rate, I just wanted to double-check your credentials, a small formality really...\""
 POD_heists.1003.a:0 "Oh, I can clear up this simple misunderstanding."
 POD_heists.1003.a.success:0 "Turns out you can"
 POD_heists.1003.a.failure:0 "Turns out you can't"
 POD_heists.1003.b:0 "Just get out of my way."


 # Spymaster route (Rivalries)

 POD_heists.1011.t:0 "Complication: Knives Out"
 POD_heists.1011.desc.coterie:0 "We had picked the worst possible time to infiltrate [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]. "
 POD_heists.1011.desc.nocoterie:0 "I had picked the worst possible time to infiltrate [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]. "
 POD_heists.1011.desc:0 "Some territorial dispute got this court in an uproar. There's talk of war.\n\nThe tension is so thick, you could cut it with a knife. Everyone here is just looking for an excuse to slit someone's throat. "
 POD_heists.1011.desc.end.coterie:0 "And as newcomers to this court, we're fair game.\n\n[potential_rival.GetFirstNameNicknamed] calls out to us. \"Are you with us? Or are you against us?\""
 POD_heists.1011.desc.end.nocoterie:0 "And as a newcomer to this court, I'm fair game.\n\n[potential_rival.GetFirstNameNicknamed] calls out to me. \"Are you with us? Or are you against us?\""
 POD_heists.1011.a.coterie:0 "We're with you."
 POD_heists.1011.a.nocoterie:0 "I'm with you."
 POD_heists.1011.a.success:0 "Your show of solidarity looks earnest"
 POD_heists.1011.a.failure:0 "Not very convincing"
 POD_heists.1011.b:0 "I try to change the subject."
 POD_heists.1011.b.success:0 "Your sleight of hand works"
 POD_heists.1011.b.failure:0 "Critical fumble"
 POD_heists.1011.c.coterie:0 "You dare question us?"
 POD_heists.1011.c.nocoterie:0 "You dare question me?"

#  POD_heists.1011.t:0 "Complication: Method Acting"
#  POD_heists.1011.desc:0 "The key to a successful [infiltration|E] is to look non-threatening and forgettable. A clueless, backwater [GetPlayer.Custom('PODSplat')] does not draw suspicion. So that's who I pretend to be.\n\nI realize that my \"country bumpkin\" routine might've gone a little too far when [potential_rival.GetTitledFirstNamePossessive] face darkens in response to one of my comments. \"What did you just say about me, you uncouth swine?\""
#  POD_heists.1011.a:0 "My apologies."
#  POD_heists.1011.a.success:0 "You smooth things over"
#  POD_heists.1011.a.failure:0 "Not so smooth after all"
#  POD_heists.1011.b:0 "I try to change the subject."
#  POD_heists.1011.b.success:0 "Your sleight of hand works"
#  POD_heists.1011.b.failure:0 "Critical fumble"
#  POD_heists.1011.c:0 "Yeah. You heard what I said."
 
 POD_heists.1012.t.spymaster:0 "Complication: The [spymaster.GetCouncilTitle]"
 POD_heists.1012.t.rando:0 "Complication: The Schemer"
 POD_heists.1012.desc.coterie:0 "The militant atmosphere of this court has complicated our plans. We duck into a side hallway, wanting to regroup and talk about our next steps. But we are not alone.\n\n"
 POD_heists.1012.desc.nocoterie:0 "The militant atmosphere of this court has complicated my plans. I duck into a side hallway, wanting to think about my next steps in a quiet place. But I am not alone.\n\n"
 POD_heists.1012.desc.spymaster:0 "[spymaster.GetFirstNamePossessive] smile is barely visible from the shadows. What a coincidence, to run into [CurrentHeistTarget.GetFirstNamePossessive] [spymaster.GetCouncilTitle] here.\n\n"
 POD_heists.1012.desc.rando:0 "[spymaster.GetFirstNamePossessive] smile is barely visible from the shadows. What a coincidence, to run into the most prolific schemer of this realm here.\n\n"
 POD_heists.1012.desc.end:0 "\"Don't mind me\", [spymaster.GetSheHe] says. \"Just making the rounds, keeping watch for threats to the crown.\""
 POD_heists.1012.a.coterie:0 "We have no quarrel with you."
 POD_heists.1012.a.nocoterie:0 "I have no quarrel with you."
 POD_heists.1012.a.success:0 "[spymaster.GetFirstName] is satisfied"
 POD_heists.1012.a.failure:0 "[spymaster.GetFirstName] will keep a closer eye on you"
 POD_heists.1012.b:0 "You should worry more about the rest of this court."
 POD_heists.1012.b.success:0 "You successfully divert [spymaster.GetHerHis] attention"
 POD_heists.1012.b.failure:0 "Exactly what someone guilty would say"
 POD_heists.1012.c:0 "Go skulk somewhere else."

 POD_heists.1013.t:0 "Complication: The Main Antagonist"
 POD_heists.1013.desc:0 "And now [court_owner.GetFirstNameNicknamed] has taken a personal interest as well. [court_owner.GetSheHe|U]'s watching the proceedings at court like a hawk, "
 POD_heists.1013.desc.coterie:0 "[court_owner.GetHerHis] eyes lingering on us more often than not.\n\nWe need to do something about [court_owner.GetHerHim], if this [infiltration|E] is to continue."
 POD_heists.1013.desc.nocoterie:0 "[court_owner.GetHerHis] eyes lingering on me more often than not.\n\nI need to do something about [court_owner.GetHerHim], if this [infiltration|E] is to continue."
 POD_heists.1013.a.coterie:0 "We pretend to support [court_owner.GetHerHis] rule."
 POD_heists.1013.a.nocoterie:0 "I pretend to support [court_owner.GetHerHis] rule."
 POD_heists.1013.a.success:0 "Flattery always works"
 POD_heists.1013.a.failure:0 "Flattery always works, except when it doesn't"
 POD_heists.1013.b.coterie:0 "We try to hide in the crowd."
 POD_heists.1013.b.nocoterie:0 "I try to hide in the crowd."
 POD_heists.1013.b.success:0 "You disappear"
 POD_heists.1013.b.failure:0 "You draw even more attention"
 POD_heists.1013.c:0 "[court_owner.GetSheHe|U] can think what [court_owner.GetSheHe] wants."


 # Coterie opinion route

 POD_heists.1021.t:0 "Complication: Strife"
 POD_heists.1021.desc:0 "Something about this outing is bringing out the worst in $POD_player_coterie$.\n\nWe bicker about trivial things. Then, about non-trivial things. No matter what, we can't agree on how this [infiltration|E] ought to be run. Polite disagreements are turning into venomous barbs.\n\nThis doesn't bode well for the success of our mission."
 POD_heists.1021.a:0 "We have to stay rational and focused."
 POD_heists.1021.a.success:0 "Sounds convincing"
 POD_heists.1021.a.failure:0 "Sounds insulting"
 POD_heists.1021.b:0 "Stick to the plan."
 POD_heists.1021.b.success:0 "You're a born leader"
 POD_heists.1021.b.failure:0 "No way"
 POD_heists.1021.c:0 "I guess they need to blow off some steam."

 POD_heists.1022.t:0 "Complication: The Door"
 POD_heists.1022.desc:0 "We have found our match.\n\nIt's a door.\n\nFor half an hour now, we've been arguing over how best to open its lock. Or whether to destroy it. Or circumvent it. Or unlock it after all. Half an hour! This is absurd."
 POD_heists.1022.a:0 "If we put our heads together, we can overcome this challenge."
 POD_heists.1022.a.success:0 "Wisdom prevails"
 POD_heists.1022.a.failure:0 "What wisdom?"
 POD_heists.1022.b:0 "Just follow my lead."
 POD_heists.1022.b.success:0 "Your leadership skills prevail"
 POD_heists.1022.b.failure:0 "What leadership skills?"
 POD_heists.1022.c:0 "Break the damn thing open."

 POD_heists.1023.t:0 "Complication: A Lesson Learned?"
 POD_heists.1023.desc:0 "Strife can bring people closer. When disagreements are worked through, it leads to deeper camaraderie. Tonight, we have learned the value of such team-building experiences.\n\nJust kidding. $POD_player_coterie$ is still fighting.\n\nAt this rate, one of us will let something incriminating slip."
 POD_heists.1023.a:0 "I still think this could be a learning experience."
 POD_heists.1023.a.success:0 "Your [GetPlayer.Custom('PODCoterieNoTooltip')] agrees"
 POD_heists.1023.a.failure:0 "You completely failed to read the room"
 POD_heists.1023.b:0 "Cooperation is in our best interest."
 POD_heists.1023.b.success:0 "Turns out you're good at herding cats"
 POD_heists.1023.b.failure:0 "Those cats don't enjoy being herded"
 POD_heists.1023.c:0 "SHUT UP! All of you."


 # Easy route

 POD_heists.1051.t:0 "Complication: This is Easy"
 POD_heists.1051.desc:0 "Not always does a plan come together this smoothly.\n\nTruly, the [GetPlayer.Custom('PODCoterie')] of $POD_player_coterie$ is in its element tonight. We're running circles around this oblivious court. The fools! No one's suspecting a thing.\n\n[coterie_member.GetFirstNameNicknamed] winks at me, clearly enjoying this as much as I do."
 POD_heists.1051.a:0 "We can let our guard down, this time."
 POD_heists.1051.b:0 "Let's not push our luck."

 POD_heists.1052.t:0 "Complication: A Thrill"
 POD_heists.1052.desc:0 "The pressure mounts around $POD_player_coterie$, but that just makes things more exciting. Does the court of [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] suspect that something is afoot? Does it matter? They'll never catch us anyway.\n\nPerformances like this are what'll cement $POD_player_coterie$ as a [GetPlayer.Custom('PODCoterie')] worthy of legend."
 POD_heists.1052.a:0 "They'll tell stories of our legerdemain back home."
 POD_heists.1052.b:0 "Better to stay humble and keep it on the down-low."

 POD_heists.1053.t:0 "Complication: Suffering From Success"
 POD_heists.1053.desc:0 "[court_owner.GetFirstNameNicknamed], too, arrives to pay witness to this spectacle.\n\nBut, alas! [court_owner.GetSheHe|U] doesn't even realize a spectacle is happening in the first place. The finesse of $POD_player_coterie$ is so great that it will have to remain unappreciated.\n\nBut does it have to be? An insane plan forms in my head..."
 POD_heists.1053.a:0 "\"Hey! Did you know someone has infiltrated your court?\""
 POD_heists.1053.b:0 "I'm not THAT mad."
 POD_heists.1053.b.mad:0 "I may be mad, but not THAT mad."
 


 POD_heists.7777.t:0 "Revenge on the Storyteller"
 POD_heists.7777.desc:0 "You're about to try stealing the [charon_artifact.Custom('ColorizedArtifactName')] from [GetScriptedCharacterByHistoryID('POD_wraith_01').GetFirstNameNicknamed].\n\nDoes this sound like a good idea?"
 POD_heists.7777.a:0 "Yeah, totally."
 POD_heists.7777.b:0 "Not really..."