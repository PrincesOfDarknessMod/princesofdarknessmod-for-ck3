 POD_heist_suspicion: "[suspicion_with_icon|E]: [GetPlayer.MakeScope.Var('current_heist').Var('suspicion').GetValue]"
 POD_heist_coterie:0 "Your [GetPlayer.Custom('PODCoterie')]: $POD_player_coterie$"

 POD_heist_raise_suspicion_desc:0 "[suspicion_with_icon|E] will #N rise#! by $VALUE|V0$"
 POD_heist_raise_suspicion_desc_past:0 "[suspicion_with_icon|E] #N rose#! by $VALUE|V0$"
