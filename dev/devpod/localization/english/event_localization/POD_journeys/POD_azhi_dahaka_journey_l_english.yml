 POD_azhi_dahaka_journey.1.t: "Scholarship of Azhi Dahaka"
 POD_azhi_dahaka_journey.1.desc: "This time in seclusion was worth it. You are now closer to understanding Azhi Dahaka and your confidence in your ritual is rising"
 POD_azhi_dahaka_journey.1.a: "That was good time."

 POD_azhi_dahaka_journey.2.t: "Ritual of Azhi Dahaka"
 POD_azhi_dahaka_journey.2.desc: "Ritual of Azhi Dahaka, That is how you called your masterpiece, It is intended to capacult you strait in Azhi dahaka of your dreams, Free of Beast, Hunger, And this pesky humanity."
 POD_azhi_dahaka_journey.2.a: "Begin"
 POD_azhi_dahaka_journey.2.a.success: "Your Ritual will succeed, and you will be finally free from humanity in your soul"
 POD_azhi_dahaka_journey.2.a.failure: "Though your ritual has succeed, #R but you don't have control over yourself anymore.#!"

 POD_azhi_dahaka_journey.3.t: "Azhi Dahaka"
 POD_azhi_dahaka_journey.3.desc: "Azhi Dahaka, State of being free of Beast and Humanity, Perfect clean slate for you to paint on."
 POD_azhi_dahaka_journey.3.a: "I am free."

 POD_azhi_dahaka_journey.4.t: "Azhi Dahaka?"
 POD_azhi_dahaka_journey.4.desc: "Azhi Dahaka, #R State were I am free from chains of humanity, Perfect clean slate for me to paint on.#!" 
 POD_azhi_dahaka_journey.4.a: "#R I am free.#!"