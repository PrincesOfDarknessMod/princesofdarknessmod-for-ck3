 POD_glamour_quests_journey.1.t: "Quest of Glamour"
 POD_glamour_quests_journey.1.desc: "Fae may prevent Banality from gaining footholds in their souls as described above, but to free a soul that has already felt the icy touch of Banality, greater measures must be taken. The only way to warm over a soul is to take on a quest that resonates with the Dreaming, to bind one's soul to that quest with an oath, and carry the oath through. Such oaths may be taken on an individual basis, or as a group — Fae from a motley who all swear themselves to the same end all benefit, should they be successful.\n\nAnd I, after many long years, have finally done what my oath required me of. And with that, I feel the hold of banality over my soul lessen considerably."
 POD_glamour_quests_journey.1.a: "My oath is done"