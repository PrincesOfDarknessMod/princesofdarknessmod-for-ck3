l_english:
 POD_exalted_wyld_hunt.1000.t: "Direct Assault"
 POD_exalted_wyld_hunt.1000.desc: "Stealth was never something you considered during planing stage. As such, you weren't highly secretive while searching for clues about the fiend's current location and any movements of theirs.\n\nThe day of hunt arrived and to no surprise for you, the guards were on standby. Fortunately the outer defenses were quite weak, obviously main defensive forces are near the target.\n\nDealing with squishy guards wasn't too hard, and you quickly started wyld hunt for actual target.\n\nThat leads you to this moment, before you stand your target with few personal guards nearby. There is no going back, it is either you or them."
 POD_exalted_wyld_hunt.1000.a: "I won't show mercy!"
 POD_exalted_wyld_hunt.1000.a.effect: "#bold A [pod_combat_encounter_with_icon|E] against [wyld_target.GetShortUIName] and #N 2#! of their most [Concept('prowess', 'Powerful')|E] [knights|E] begins.#!"
 
 POD_exalted_wyld_hunt.1002.t: "Direct Assault"
 POD_exalted_wyld_hunt.1002.desc: "The battle is over.\n\nBoth the target and their personal guards lay on the ground. You are not sure if they are alive or dead, but that doesn't matter. Regardless of their current state, target will not leave this place alive.\n\nBut what about guards? Do they deserve to die?"
 POD_exalted_wyld_hunt.1002.a: "Absolutely."
 POD_exalted_wyld_hunt.1002.b: "I came here for a single head."

 POD_exalted_wyld_hunt.1003.t: "Direct Assault"
 POD_exalted_wyld_hunt.1003.desc: "The battle is over.\n\nYou lay on the guard, barely alive. Regardless, your fate is sealed. You have failed your mission to clean this world from the darkness, and the outcome can only be death."
 POD_exalted_wyld_hunt.1003.a: "I failed huh?..."

 POD_exalted_wyld_hunt.2000.t: "The Hunt Is On"
 POD_exalted_wyld_hunt.2000.desc: "You have arrived at your destination, The Fiend's lair.\n\nThere is no sound, save for your's muffled footsteps. You have taken great care to stay hidden and attract no attention, because once you're in this place, it's #bold;N kill on sight#!. This is your enemies' turf.\n\nThe goal remains the same, find the lair of [PlayerJourneyTarget.GetShortUIName] and then kill them, lest we alert [PlayerJourneyTarget.GetHerHis] lackeys to our presence."
 POD_exalted_wyld_hunt.2000.a: "They won't see us coming."

 POD_exalted_wyld_hunt.2001.t: "The Hunt is Over"
 POD_exalted_wyld_hunt.2001.desc: "You pushed your luck. It was bound to run out eventually.\n\nThe retinue of [heist_imprisoner.GetFirstNameNicknamed] surrounds you. The Hunt has failed, Fiend will surely arrive at this position with even greater military presence.\n\nOnly one thing remains, and that is to break-out form the encirclement or..."
 POD_exalted_wyld_hunt.2001.a: "...Die Trying"
 POD_exalted_wyld_hunt.2001.a.success: "You have escaped the encirclement before fiend caught up"
 POD_exalted_wyld_hunt.2001.a.failure: "You were too slow, the fiend is here with reinforcements"