l_english:
 POD_mummy_elixir_of_eternal_life.001.t: "Requesting Aid"
 POD_mummy_elixir_of_eternal_life.001.desc: "\"The Way is inexplicable, the Path beyond teaching, the Road beyond speaking. To try or worse, to succeed, would be a curse upon your future. Not even the mighty tree can grow to its full height with stolen light. Only by learning do you prove yourself worthy to teach. Only through your own effort will you advance and truly approach the Third Incarnation. Nonetheless, we shall be as a whetstone to your blade. With each step you take, we will guide you so that you may take another, for the steps are your own.\""
 POD_mummy_elixir_of_eternal_life.001.a: "This one thanks you for the guidance"
 POD_mummy_elixir_of_eternal_life.001.a.tt: "Whenever you complete a [journey|E], the Eight Immortals' insights grant #color_white 5.00#! additional [trait_level_track_xp|E] in Elixir of Eternal Life #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"

 POD_mummy_elixir_of_eternal_life.002.t: "Inner Mastery"
 POD_mummy_elixir_of_eternal_life.002.desc: "It's time to change myself, to get rid of those traits that hold me back. An arduous path to be sure, but a necessary one."
 POD_mummy_elixir_of_eternal_life.002.option.desc: "Test of Self"
 POD_mummy_elixir_of_eternal_life.002.success: "You succeed the test"
 POD_mummy_elixir_of_eternal_life.002.failure: "You fail the test"
 POD_mummy_elixir_of_eternal_life.002.a: "Alcohol won't cloud my mind"
 POD_mummy_elixir_of_eternal_life.002.a.tt: "You will try to get rid of [GetTrait('drunkard').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.b: "I will not punish myself"
 POD_mummy_elixir_of_eternal_life.002.b.tt: "You will try to get rid of [GetTrait('flagellant').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.c: "Perhaps I eat too much"
 POD_mummy_elixir_of_eternal_life.002.c.tt: "You will try to get rid of [GetTrait('comfort_eater').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.d: "I won't let my anger control me"
 POD_mummy_elixir_of_eternal_life.002.d.tt: "You will try to get rid of [GetTrait('irritable').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.e: "I won't let lust guide me"
 POD_mummy_elixir_of_eternal_life.002.e.tt: "You will try to get rid of [GetTrait('rakish').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.f: "I can't hide from my issues"
 POD_mummy_elixir_of_eternal_life.002.f.tt: "You will try to get rid of [GetTrait('hashishiyah').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.g: "Greed is not good"
 POD_mummy_elixir_of_eternal_life.002.g.tt: "You will try to get rid of [GetTrait('profligate').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.h: "Do I run from what needs doing?"
 POD_mummy_elixir_of_eternal_life.002.h.tt: "You will try to get rid of [GetTrait('craven').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.i: "Do I permit anger to fuel me?"
 POD_mummy_elixir_of_eternal_life.002.i.tt: "You will try to get rid of [GetTrait('wrathful').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.j: "Do I allow lust to overwhelm me?"
 POD_mummy_elixir_of_eternal_life.002.j.tt: "You will try to get rid of [GetTrait('lustful').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.k: "Do I pursue my own power too much?"
 POD_mummy_elixir_of_eternal_life.002.k.tt: "You will try to get rid of [GetTrait('ambitious').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.l: "Do I avoid what must be done?"
 POD_mummy_elixir_of_eternal_life.002.l.tt: "You will try to get rid of [GetTrait('lazy').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.m: "Do I love money more than people?"
 POD_mummy_elixir_of_eternal_life.002.m.tt: "You will try to get rid of [GetTrait('greedy').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.n: "Do I allow food to consume me?"
 POD_mummy_elixir_of_eternal_life.002.n.tt: "You will try to get rid of [GetTrait('gluttonous').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.o: "Do I delight in cruelty?"
 POD_mummy_elixir_of_eternal_life.002.o.tt: "You will try to get rid of [GetTrait('sadistic').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.p: "Never mind"

 POD_mummy_elixir_of_eternal_life.003.t: "One Part Done, Another Begun"
 POD_mummy_elixir_of_eternal_life.003.desc: "Having achieved a basic understanding of the Elixir of Eternal Life, your original path is no longer sufficient for your continued growth. To create the Elixir, one must understand themselves and the universe within which they live. To accomplish this, You will need to journey around the world to collect ancient records, to learn from the failures of others, and to meditate upon the lessons you've collected. In addition, you will need to spend time conducting research, slowly translating records, brewing potions, and reinforcing your cultivation base.\n\n#help To reach 90 [trait_level_track_xp|E] in Elixir of Eternal Life and progress further, you will need to accumulate it passively and do [journeys|E]. See [Concept('POD_elixir_of_eternal_life', 'this tooltip')|E] and the description of the Eternal Rebirth Seeker trait under your character to learn more.#!"
 POD_mummy_elixir_of_eternal_life.003.a: "My quest is not yet over..."

 POD_mummy_elixir_of_eternal_life.100.t: "Forever-Binding Vitriol"
 POD_mummy_elixir_of_eternal_life.100.desc: "A man in a perfectly tailored suit walks into your throne room, bypassing your guards. His hair is slicked back and so smooth and perfectly molded that it looks like a helmet placed upon his head. The pieces of metallic machinery protruding through his flesh only serves to enhance the crafted image.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Mikaboshi','podgloss.mikaboshi')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [Glossary('Wicked City','podgloss.wickedcity')] and use your knowledge to create a force of Wu Kuei, mummies working towards the creation of a machine state. In exchange, he will help you transform your realm into one of mundanity and robotic work, maximizing profitability, minimizing losses, and continually innovating.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Would you really decline such a generous offer?"
 POD_mummy_elixir_of_eternal_life.100.a: "A deal worth making"
 POD_mummy_elixir_of_eternal_life.100.b: "You will never have my soul!"
 POD_mummy_elixir_of_eternal_life.100.c: "My soul is already forfeit"
 POD_mummy_elixir_of_eternal_life.100.d: "My mastery of magic renders your powers useless here"
 POD_mummy_elixir_of_eternal_life.100.d.tt: "Having brewed many potions and interacted with the [umbra|E], you can resist their infernal powers"
 POD_mummy_elixir_of_eternal_life.100.effect.success: "You resist the agent's assault"
 POD_mummy_elixir_of_eternal_life.100.effect.failure: "The assault overcomes your mind"
 POD_mummy_elixir_of_eternal_life.100.effect.pactadvantage: "Your pact with a [Glossary('Yama King','podgloss.yamaking')] will make it easier to reduce attacks by their rivals"
 POD_eoel_mikaboshi_boon_modifier: "[Glossary('Mikaboshi','podgloss.mikaboshi')]'s Boon"
 POD_eoel_mikaboshi_boon_modifier_desc: "The Lord of the [Glossary('Wicked City','podgloss.wickedcity')] knows how to squeeze as much profit from a region as possible."

 POD_mummy_elixir_of_eternal_life.101.desc: "A pock-marked woman covered in ever-oozing pustules walks into your throne room, bypassing your guards. Her hair is slick with pus, and her skin is covered with a sheen of sweat. An acidic tang fills the air, burning your nose hairs.\n\nShe introduces herself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [GetFaithByKey('thousandhells_tou_shen').GetName]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Feverish Hell and use your knowledge to create a force of Wu Kuei, mummies working towards the spread of smallpox. In exchange, he will help you transform your realm into one of disease where pestilence and fear are profitable. He's willing to offer quite a bit for the chance to overcome Rangda.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Would you really decline such a generous offer?"
 POD_eoel_tou_shen_boon_modifier: "Tou Shen's Boon"
 POD_eoel_tou_shen_boon_modifier_desc: "The Lord of the Feverish Hell knows how to transform fear into profit."

 POD_mummy_elixir_of_eternal_life.102.desc: "A man in bushi-style armor walks into your throne room, bypassing your guards. A clipboard rests in his hand, and a bundle of rope and a whip laced with glass shards hang from his belt.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Wu Hua','podgloss.wuhua')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Pit of Salt and Iron and use your knowledge to create a force of Wu Kuei, mummies working towards perfect efficiency. In exchange, he will help you transform your realm into one of good order, peak production, and endless bureaucracy.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Would you really decline such a generous offer? After all, [Glossary('Wu Hua','podgloss.wuhua')] always rewards the loyal and destroys the disobedient."
 POD_eoel_wu_hua_boon_modifier: "[Glossary('Wu Hua','podgloss.wuhua')]'s Boon"
 POD_eoel_wu_hua_boon_modifier_desc: "The Lord of the Pit of Salt and Iron well knows that obedient slaves are profitable slaves."

 POD_mummy_elixir_of_eternal_life.110.t: "Ever-Shifting Sludge"
 POD_mummy_elixir_of_eternal_life.110.desc: "A hunched man seemingly crafted from blackened iron walks into your throne room, bypassing your guards. His three multi-faceted eyes glow with the red of a desert at twilight. Sand flows out of the joints, leaving a trail behind the creature.\n\nIt introduces itself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] [Glossary('Tou Mu','podgloss.toumu')]. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossary('hell_of_being_skinned_alive')] and use your knowledge to create a force of Wu Kuei, mummies working towards her ascension to the throne of the [Glossary('Demon Emperor','podgloss.demonemperor')]. In exchange, she will help you obtain revenge against all that wronged you, surpassing them in glory and torturing them for all eternity.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? She offers grand opportunities before granting you a swift death, a kindness compared to the world she will usher into being."
 POD_mummy_elixir_of_eternal_life.110.a: "We can come to an arrangement"
 POD_mummy_elixir_of_eternal_life.110.b: "You will never have my soul!"
 POD_mummy_elixir_of_eternal_life.110.c: "My soul is already forfeit"
 POD_mummy_elixir_of_eternal_life.110.d: "I have nourished my realm. You have no power here"
 POD_mummy_elixir_of_eternal_life.110.d.tt: "Having mastered your realm and family, you can resist their infernal powers"
 POD_mummy_elixir_of_eternal_life.110.effect.success: "You resist the agent's assault"
 POD_mummy_elixir_of_eternal_life.110.effect.failure: "The assault overcomes your mind"
 POD_eoel_tou_mu_boon_modifier: "[Glossary('Tou Mu','podgloss.toumu')]'s Boon"
 POD_eoel_tou_mu_boon_modifier_desc: "The Lord of the [UmbraGlossary('hell_of_being_skinned_alive')] has mastered the art of retaining an iron grip over her domain."

 POD_mummy_elixir_of_eternal_life.111.desc: "A man engulfed with shadows that seemingly glow and yet consume light fades into your throne room, bypassing your guards. His face is that of an innocent child darkened by eyes that have seen far too much. Oddly, there is something avian about his manner.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] Bao Zhong. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Hell of Undying Sorrow and use your knowledge to create a force of Wu Kuei, mummies working towards the extermination of all other [Glossary('Yama Kings','podgloss.yamaking')]. In exchange, he will help you create a new world free from the August Personage of Jade's tyranny, one where you are Bao Zhong's glorious champion.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? He offers such grand opportunities."
 POD_eoel_bao_zhong_boon_modifier: "Bao Zhong's Boon"
 POD_eoel_bao_zhong_boon_modifier_desc: "The Lord of the Hell of Undying Sorrow remembers much as one of 4 Wan Xian to escape the August Personage of Jade's curse."

 POD_mummy_elixir_of_eternal_life.112.desc: "A man oozing with infernal influences walks into your throne room, bypassing your guards. Strange gems and baubles dangle from every piece of clothing, jingling with each step. An unusual power emanates from these items which presses down on you like an ocean's weight, a killing intent sending fear throughout you.\n\nHe introduces himself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Grandmother Witch. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Hell of Wretched Magic and use your knowledge to create a force of Wu Kuei, mummies working towards the collection of all magic, including those better left unknown. In exchange, she will grant you great knowledge and infernal power.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? She offers such grand opportunities."
 POD_eoel_grandmother_witch_boon_modifier: "Grandmother Witch's Boon"
 POD_eoel_grandmother_witch_boon_modifier_desc: "The Lord of the Hell of Wretched Magic has learned how to use her position to gather ever-more knowledge and magic."

 POD_mummy_elixir_of_eternal_life.120.t: "All-Hearing Smog"
 POD_mummy_elixir_of_eternal_life.120.desc: "A woman of unearthly beauty stalks past your guards, their eyes completely blind to anything beyond her. Like a statue carved from ice by a master, she is without flaw. Every step reveals a lethal grace, a cat preparing to pounce.\n\nShe introduces herself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Emma-O','podgloss.emmao')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to [Glossary('Kakuri','podgloss.kakuri')] and use your knowledge to create a force of Wu Kuei, mummies working towards an endless void of ice and snow. In exchange, he will grant you great power, transforming you into his knife in the dark. Little will stand against you with his aid.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Merely abandon the duties forced upon you by your uncaring master, the August Personage of Jade, and accept one that will actively aid you."
 POD_mummy_elixir_of_eternal_life.120.a: "A surprise, but a welcome one"
 POD_mummy_elixir_of_eternal_life.120.b: "You will never have my soul!"
 POD_mummy_elixir_of_eternal_life.120.c: "My soul is already forfeit"
 POD_mummy_elixir_of_eternal_life.120.d: "I have mastered myself. You have no power here"
 POD_mummy_elixir_of_eternal_life.120.d.tt: "Having mastered your body and mind, you can resist their infernal powers"
 POD_mummy_elixir_of_eternal_life.120.effect.success: "You resist the agent's assault"
 POD_mummy_elixir_of_eternal_life.120.effect.failure: "The assault overcomes your mind"
 POD_eoel_emmao_boon_modifier: "[Glossary('Emma-O','podgloss.emmao')]'s Boon"
 POD_eoel_emmao_boon_modifier_desc: "The Lord of the [Glossary('Kakuri','podgloss.kakuri')] has mastered the art of subterfuge."

 POD_mummy_elixir_of_eternal_life.121.desc: "A man bearing the imagery of a major religion walks into your throne room, bypassing your guards. Faith and zealotry shine from his eyes, barely dimmed by the red puckering covering every inch of visible flesh.\n\nHe introduces himself as the representative of the divine, voice of one known as Hen Tian. The divine has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossaryLocalized('hell_of_bitter_truth','Realm of Redemption and Truth')] and use your knowledge to create a force of Wu Kuei, mummies working towards the salvation of all and revelation of absolute truth. In exchange, he will help you spread that redemption in secret so that the enemies of truth cannot stop you.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Merely abandon the duties forced upon you by your uncaring master, the August Personage of Jade, and accept one that will actively aid you."
 POD_eoel_hen_tian_boon_modifier: "Hen Tian's Boon"
 POD_eoel_hen_tian_boon_modifier_desc: "The Lord of the [UmbraGlossaryLocalized('hell_of_bitter_truth','Realm of Redemption and Truth')] has mastered the art of suborning people for his own purposes, tricking them into accomplishing his ends."

 POD_mummy_elixir_of_eternal_life.122.desc: "A man whose skin is visibly and permanently stained with blood walks into your throne room, bypassing your guards. Resembling his master, multiple arms extend from his torso and back, each terminating in a mouth with gnashing teeth.\n\nHe introduces himself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Yargra the Many-Mouthed. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to Pueleko and use your knowledge to create a force of Wu Kuei, mummies working towards the creation of endless hells and the consumption of all things. In exchange, she will help you devour all that stand in your way.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Merely abandon the duties forced upon you by your uncaring master, the August Personage of Jade, and accept one that will actively aid you."
 POD_eoel_yargra_boon_modifier: "Yargra's Boon"
 POD_eoel_yargra_boon_modifier_desc: "The Lord of Pueleko sneaks up on her prey before devouring them."
 POD_eoel_yargra_vampiric_boon_modifier: "Yargra's Boon"
 POD_eoel_yargra_vampiric_boon_modifier_desc: "The Lord of Pueleko sneaks up on her prey before devouring them."

 POD_mummy_elixir_of_eternal_life.130.t: "All-Consuming Balefire"
 POD_mummy_elixir_of_eternal_life.130.desc: "A man wearing a Mongolian deel walks into your throne room, bypassing your guards. His body seems bloated with tainted energies, undirected hatred burning within his eyes. Rather than footsteps, his shoes produce the sounds of clinking chains and blood-curdling screams.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] and use your knowledge to create a force of Wu Kuei, mummies working towards crushing the last few holdouts preventing his ascension to [Glossary('Demon Emperor','podgloss.demonemperor')]. In exchange, he will infuse you with the power to crush your enemies and make them suffer.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Great power, well beyond the imagining of the decreipt fools in Heaven, could be yours. Is your dedication so fixed that you will decline it?"
 POD_mummy_elixir_of_eternal_life.130.a: "Unlimited power!"
 POD_mummy_elixir_of_eternal_life.130.b: "You will never have my soul!"
 POD_mummy_elixir_of_eternal_life.130.c: "My soul is already forfeit"
 POD_mummy_elixir_of_eternal_life.130.effect.success: "You resist the agent's assault"
 POD_mummy_elixir_of_eternal_life.130.effect.failure: "The assault overcomes your mind"
 POD_eoel_dokhor_khan_boon_modifier: "[Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s Boon"
 POD_eoel_dokhor_khan_boon_modifier_desc: "The Lord of the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] has attained his power by crushing all that stand before him, often quite recklessly."

 POD_mummy_elixir_of_eternal_life.131.desc: "A woman wearing very little, showcasing the rotting lesions covering her flesh, walks into your throne room, bypassing your guards. The smell of rot, the sound of squelching, the sight of seemingly-melting flesh and maggots squirming under her skin provoke an instinctual desire to retch.\n\nShe introduces herself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Rangda. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossary('hell_of_burrowing_maggots')] and use your knowledge to create a force of Wu Kuei, mummies working towards the eternal agony of all living things. In exchange, she will render your men monsters, unable to experience the pain and decay they spread with every step.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Great power, well beyond the imagining of the decreipt fools in Heaven, could be yours. Is your dedication so fixed that you will decline it?"
 POD_eoel_rangda_boon_modifier: "Rangda's Boon"
 POD_eoel_rangda_boon_modifier_desc: "The Lord of the [UmbraGlossary('hell_of_burrowing_maggots')] will bathe the world in maggots. Your soldiers are merely the first step."

 POD_mummy_elixir_of_eternal_life.132.desc: "A man with the scars of lashs and burns walks into your throne room, bypassing your guards. A nine-tailed whip embedded with glass shards drips blood from his waist. Upon his helmet rests a candle lit with a green flame burning wildly and causing wax to drip down on to him. Yet, the candle never diminishes.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] Danoru Ka. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Never-lit Cavern and use your knowledge to create a force of Wu Kuei, mummies acquiring spirits to complete his tunnel in the [UmbraGlossary('shadowlands')]. In exchange, he will turn your knights into overseers fit to handle vast hordes of slaves. \n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Great power, well beyond the imagining of the decreipt fools in Heaven, could be yours. Is your dedication so fixed that you will decline it?"
 POD_eoel_danoru_ka_boon_modifier: "Danoru Ka's Boon"
 POD_eoel_danoru_ka_boon_modifier_desc: "The Lord of the Never-lit Cavern has enslaved many beings and created many overseers to complete his tunnel. Theories abound regarding his destination..."

 POD_mummy_elixir_of_eternal_life.140.t: "One Last Step"
 POD_mummy_elixir_of_eternal_life.140.desc: "Across history, the Elixir of Eternal Life has been discovered countless times, only for that knowledge to be lost. Some have theorized that the Eight Immortals intentionally enforce the cycle of rediscovery, using the quest as a test to identify those worthy of eternal rebirth. They allow the virtuous to drink of the Elixir and grant its recipe to the most worthy. It would not be the first time they have done so; for should the Third Incarnation exist, those enlightened Wu T'ian that have achieved it have forbidden from speaking of their accomplishments. After all, men cannot carve their own paths when they seek to follow roads paved by others.\n\nRegardless, having dealt with the Yama Kings, you stand on the precipice of success. Collecting a few last things and making one last decision is all that stands between you and the final challenge of your quest."
 POD_mummy_elixir_of_eternal_life.140.a: "Time to make my case and claim my place"

 POD_mummy_elixir_of_eternal_life.201.t: "The Stilling"
 POD_mummy_elixir_of_eternal_life.201.desc: "At the hour you were once born, you settle yourself into a comfortable position. You still your body, mind, and soul. Each beat of your heart comes ever slower, each thump ever quieter. Thoughts bounce off your mind, failing to intrude into the serenity. Concerns, fears, the troubles of this world flow away from your soul, settling into less than the trickle of a mountain spring. Each moment stretches into eternity as you lose all sense of the passing of time, until your eyes close.\n\nDespite lacking any body, you feel excruciating pain as your body, mind, and soul are ripped apart from each other. With your spiritual eye, you see three spheres spiraling around each other. As the orbits hasten, essence begins to flow between them as the spheres lose their coherent shapes and is cast off into a circling cloud. Only hastening with each moment, the red wisps of energy begin to circle inwards towards the unified white core that has formed, becoming ever-brighten as they approach the center. When all of it has coalesced into a single, infinitesimally small point, your form reappears such that you are able to see through your eyes once more, revealing the Gate of Heaven standing closed. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer$"
 POD_mummy_elixir_of_eternal_life.201.a: "I seek the Elixir of Eternal Life!"
 POD_mummy_elixir_of_eternal_life.201.b: "On second thought..."

 POD_mummy_elixir_of_eternal_life.202.t: "The Final Brew"
 POD_mummy_elixir_of_eternal_life.202.desc: "The time has come to brew the final elixir needed. You ascend to the highest peak on an auspicious day and armed with a talisman. You speak with the mountain's spirit to receive the Breaths of the Nine Heavens. Nine times subjected to fire at nine regular intervals of time, cycled between solid and vapor, such is the manner of the cinnabar's preparation. You let the sun's light flow through the vessel as you add the gold flowers, jade dew, sulphur, quicksilver, pine resin, peach pits, thistles, lead, dissolved pearls, the sediment of water and fire, remnants of beasts bygone, several deadly toxins, and your own blood. The many become as one, glowing with all the colors of divine light. You wash it to be as pure as the driven snow. You grind it to be as complete as cinnabar. You dissolve it into perfumed water and vermilion grass wine. Finally, you drink the liquid that shines with the color of the heavens so that it may sublimate the earthly and purify the flesh, leaving only the untainted.\n\nGreat weights tug on your eyelids, closing them as you feel yourself separate from the mortal realm. When the weight disappears and you are able to open them once more, you see the Gate of Heaven standing closed. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer$"
 POD_mummy_elixir_of_eternal_life.202.a: "I seek the Elixir of Eternal Life!"
 POD_mummy_elixir_of_eternal_life.202.b: "On second thought..."

 POD_mummy_elixir_of_eternal_life.203.t: "The Second Birth"
 POD_mummy_elixir_of_eternal_life.203.desc: "With the aid of friends, you have conducted an intimate ritual, culminating in your suicide with a carefully-designed weapon. With your seat of life dislodged, your mind's eye flows down to your navel. A luminous galaxy spins, waiting for you to apply pressure and condense them into a new life. As you focus on it, you begin to cultivate and channel essence into it. As the essence returns to emptiness, the embryonic immortal awakens within you. With each cry, the infant grows into you. One element pushes, another pulls. So the wheel spins. So the new immortal is born. So you are born, standing before the closed Gate of Heaven. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer$"
 POD_mummy_elixir_of_eternal_life.203.a: "I seek the Elixir of Eternal Life!"
 POD_mummy_elixir_of_eternal_life.203.b: "On second thought..."

 POD_mummy_elixir_of_eternal_life.21.t: "Audience: Burden of Immortality"
 POD_mummy_elixir_of_eternal_life.21.desc: "$POD_debate_debate_strength_header$\"You are not the first nor will you be the last to pursue such a quest. However, to climb a mountain is to carry its weight upon your back. Immortality, even one bound by the cycles of rebirth like our own, is a burden that reshapes the soul. With every step of your climb, you will collect loss, and your memories will erode. You will surrender all that grants meaning to the mortal. When the mountain has no peak, is there a meaning to the climb? Is there value in the endless struggle? Not for all. Such things are like a river carving a canyon. While the separation begins small, there comes a time when nothing can bridge the divide between you and the mortal experience. You will become detached from it, unable to fully partake in it. Such pain is only worsened when you have the power to grant immortality but know that you should not use it.\n\nThis is a curse and a burden. Will you still see every individual snowflake within the blizzard, like so many before it and yet completely unique? Will you still love them, care for them, protect them? Can you bear it, or will you become a monster? Will you still use your knowledge with wisdom, only granting eternal rebirth to those who can bear it themselves?\""
 POD_mummy_elixir_of_eternal_life.21.a: "We already bear immortality’s burden."
 POD_mummy_elixir_of_eternal_life.21.b: "The purpose you provide prevents meaninglessness."
 POD_mummy_elixir_of_eternal_life.21.c: "You adapted; so can we."

 POD_mummy_elixir_of_eternal_life.22.t: "Audience: Maintaining the Balance"
 POD_mummy_elixir_of_eternal_life.22.desc: "$POD_debate_debate_strength_header$\"Just as immortality and the ability to grant it transforms the relationship between yourself and others, so too does it transform your relationship with the world. Life and death, order and chaos, birth and decay. All exist in perfect balance, and we are its caretakers. With the creation of each Undying, we already skirt the edge of imbalance, shaking the tree. A few shakes will not threaten the world. However, granting you the knowledge to brew the Elixir creates the potential to shake the tree too often, leaving a leafless tree. Expanding our circle would not be a neutral act, serving only to strain the spiritual ecosystems. Should the strain grow too great, ripples would not do justice to describing the unseen debts and karmic entanglements.\n\nWill you maintain the balance between realms? Will you abuse the knowledge to create an army of the Undying, ripping a hole in death itself?\""
 POD_mummy_elixir_of_eternal_life.22.a: "Balance evolves; it is not static."
 POD_mummy_elixir_of_eternal_life.22.b: "You will continue to regulate our numbers."
 POD_mummy_elixir_of_eternal_life.22.c: "We cause less damage than others and fix the damage from them."

 POD_mummy_elixir_of_eternal_life.23.t: "Audience: Value of Mortality"
 POD_mummy_elixir_of_eternal_life.23.desc: "$POD_debate_debate_strength_header$\"There is more harm caused than simply that inflicted upon the balance or the strain from the burden of immortality. As we said before, immortality separates us from the mortals, leaving us detached from their world and without empathy. Without sand draining from the hourglass, we lack urgency or a need for growth. To remove the pressure of death and stopper the glass is to lose one's drive to become something new or greater, to change. Should we give you the Elixir of Eternal Life's recipe, you will use it to create more Undying, thereby robbing them of the chance to experience a complete human existence. Instead, you condemn them to a life of endless days, a never-ending monotony and exhaustion with a job they can never escape. Even should they desire it or seek you out for it, no one can truly understand the loss suffered from immortality until after they have already received it. You steal all of that from them without them ever comprehending their loss. There have even been those that used immortality to punish and torture their rivals, depriving them of a normal life.\n\nAre you willing to steal such potential? Would you abuse the power, without exercising thought or consideration for the pain caused? Will you cause harm and suffering?\""
 POD_mummy_elixir_of_eternal_life.23.a: "We preserve, not erase, humanity."
 POD_mummy_elixir_of_eternal_life.23.b: "Immortality is not the end, merely the start of a new journey."
 POD_mummy_elixir_of_eternal_life.23.c: "Mortality leads to suffering, ignorance, and wasted potential."

 POD_mummy_elixir_of_eternal_life.24.t: "Audience: Your Incompleteness"
 POD_mummy_elixir_of_eternal_life.24.desc: "$POD_debate_debate_strength_header$\"Knowledge is power. The Elixir of Eternal Life has the power to control the Wheel, to control the cycle of rebirth, to allow a man to persist far beyond his natural end. For mortals, power serves to do little more than reveal the inner truth, but it is far more dangerous for the eternal. You will be surrounded by magic, by power. To know that you could change things, that you could fix things, not many good people can bear that burden. To not succumb to that temptation to construct a perfect world, to that siren song is a draining endeavor that erodes one's will with every century that passes. Power invites the corruption of even the purest-hearted, of even those with the best of intentions. Only the best can handle it for while a mountain will one day erode away, it takes far longer than a pile of dust.\n\nTo grant you such power before you are ready is cruelty to you and the height of folly, little different than gifting omnipotence to a child. To bear the knowledge behind the Elixir's creation requires one that has learned certain lessons regarding detachment, humility, and harmony.\n\nYou are not necessarily unworthy. Rather, you are as yet young and incomplete. Granting you that which you seek would be irresponsible. Why should we do so? what proof do you offer of your maturity and ability to resist the corruption?\""
 POD_mummy_elixir_of_eternal_life.24.a: "We have already proven ourselves by reaching this point."
 POD_mummy_elixir_of_eternal_life.24.b: "Perfection is impossible and growth eternal."
 POD_mummy_elixir_of_eternal_life.24.c: "Growth requires responsibility."

 POD_mummy_elixir_of_eternal_life.25.t: "Audience: Legacy of Power"
 POD_mummy_elixir_of_eternal_life.25.desc: "$POD_debate_debate_strength_header$\"Let us say we accept your worthiness and your ability to properly handle the power inherent to the Elixir of Eternal Life. This knowledge's power is a legacy as eternal as the beings it makes. Each change casts ripples through the pond of men, spreading ever further. By granting you the knowledge to brew the Elixir, we perpetuate that legacy, a legacy you will pass on to everyone that you transform or to whom you teach it. Trusting you now requires us to trust all that come after you, to trust the legacy you create. Even a small ripple may one day become a tidal wave beyond even our power to curtail. In the great poem of history, such rhyming lines are oft-repeated, and trust is rarely rewarded.\n\nWhy should we extend such trust in this moment? Why should we trust those who come later? Even if your intentions are noble, will future generations share your virtues and values? Why should we take such a risk?\""
 POD_mummy_elixir_of_eternal_life.25.a: "Stagnation is its own danger."
 POD_mummy_elixir_of_eternal_life.25.b: "All traditions risk corruption, but they should not be abandoned."
 POD_mummy_elixir_of_eternal_life.25.c: "While difficult, safeguards can be established."

 POD_mummy_elixir_of_eternal_life.26.t: "Audience: Why..."
 POD_mummy_elixir_of_eternal_life.26.desc: "$POD_debate_debate_strength_header$\"One final question stands before us: you. What led you to stand where you now do? After all, your's was not an easy or short quest, nor one without difficulties. What gave you strength when you questioned your purpose? Beneath all of the practicalities, beneath all of the philosophical arguments, what was your intent? Do you seek control or to be remembered? Do you quest out of fear or in defiance? If so, satisfying your desires will only serve to amplify those flaws. Do you have a reason that surpasses such base impulses?\""
 POD_mummy_elixir_of_eternal_life.26.a: "To protect the world."
 POD_mummy_elixir_of_eternal_life.26.b: "To transcend limitation."
 POD_mummy_elixir_of_eternal_life.26.c: "To ascend in enlightenment." 
 POD_mummy_elixir_of_eternal_life.26.d: "To bear the burden others cannot."
 POD_mummy_elixir_of_eternal_life.26.e: "To preserve knowledge and purpose."

 POD_mummy_elixir_of_eternal_life.270.t: "Audience: Success"
 POD_mummy_elixir_of_eternal_life.270.desc.internal: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Let us hope that our trust in you is well-placed.\n\nTo begin brewing the Elixir of Eternal Life, collect your tears from 11pm to 3am, your sweat from 11am to 3pm, your saliva from 7am to 11am, your mucus from 3am to 7am, and your urine from 3pm to 7pm. Then, mix them over a flame for 15 minutes...\""
 POD_mummy_elixir_of_eternal_life.270.desc.external: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Let us hope that our trust in you is well-placed.\n\nTo begin brewing the Elixir of Eternal Life, grind jade into a fine powder and pour into a small amount of molten gold...\""
 POD_mummy_elixir_of_eternal_life.270.desc.nourishing: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Let us hope that our trust in you is well-placed.\n\nTo begin brewing the Elixir of Eternal Life, perform the Five Animal Play technique with several trusted allies, each of you sending your essence, breath, and spirit towards a cauldron of boiling water. Then...\""
 POD_mummy_elixir_of_eternal_life.270.a: "This one thanks you for your guidance"
 POD_mummy_elixir_of_eternal_life.270.b: "This one thanks you for this opportunity"
 eoel_become_mummy_wutian_tt: "You will become a Mummy which will radically change your gameplay, disable your buildings and destroy your higher realm titles.\nThis is likely to cripple your campaign if you aren't ready for it."

 POD_mummy_elixir_of_eternal_life.271.t: "Audience: Partial Success"
 POD_mummy_elixir_of_eternal_life.271.desc: "\"Like so many before you, we will not grant you the knowledge necessary to perfect the Elixir of Eternal Life. However, you have shown the wisdom necessary to drink of it. And so, we offer you the opportunity to leave your current form behind and attain a new life and a new purpose, one of eternal rebirth in service to the August Personage of Jade. Do you accept?\""
 POD_mummy_elixir_of_eternal_life.271.a: "This one thanks you for your generous offer"
 POD_mummy_elixir_of_eternal_life.271.b: "This one must decline your generous offer"

 POD_mummy_elixir_of_eternal_life.272.t: "Audience: Failure"
 POD_mummy_elixir_of_eternal_life.272.desc: "\"After much consideration, we have deemed you too young. You are a peach pit just beginning to sprout. Should we grant you the knowledge necessary to brew the Elixir of Eternal Life, we would bear the responsibility for it corrupting you. You might teach it to the unworthy. You could torture your rivals or steal mortality's advantages from those unprepared for such a loss.\""
 POD_mummy_elixir_of_eternal_life.272.a: "This one shall return later"
 POD_mummy_elixir_of_eternal_life.272.b: "Decreipt fools! I shall found those who value my skill!"

 POD_mummy_elixir_of_eternal_life.30.t: "A Place Among Torments"
 POD_mummy_elixir_of_eternal_life.30.desc: "The Most-Wise Master has grand plans for you. Having descended to the Most-Puissant Master's domain and now standing before them, they present your next task. The Most-Prudent Master proclaims the need for more such as yourself. Such servants will need training and preparation under the Most-Dread Master's care. Unfortunately, the Most-Inscrutable Master's realm does not have a space dedicated to such a purpose. As such, the Most-Mighty Master instructs you to claim a fragment of their Hell to cultivate more servants. You do not want to disappoint the Most-Dread Master, but you will need to address your rivals among the Most-Dominant Master's other servants and the land's denizens.\n\n #R These hunts use a score named Military Strength. This score starts by looking at you and your champions' prowess. It will be raised or decreased during the hunt itself.\nYour starting Military Strength is [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|0]#!"
 POD_mummy_elixir_of_eternal_life.30.a: "I will prove worthy."  # starts hunt, display POD_mummy_elixir_of_eternal_life_rivals_start_hunt_tt as tooltip
 POD_mummy_elixir_of_eternal_life.30.b: "I shall gather my forces and return."
 POD_mummy_elixir_of_eternal_life.30.tt.east: "Your boon from an east-aligned [Glossary('Yama King','podgloss.yamaking')] aids your efforts."
 POD_mummy_elixir_of_eternal_life.30.tt.north: "Your boon from an north-aligned [Glossary('Yama King','podgloss.yamaking')] aids your efforts."
 POD_mummy_elixir_of_eternal_life.30.tt.west: "Your boon from an west-aligned [Glossary('Yama King','podgloss.yamaking')] aids your efforts."
 POD_mummy_elixir_of_eternal_life.30.tt.south: "Your boon from an south-aligned [Glossary('Yama King','podgloss.yamaking')] aids your efforts."

 POD_mummy_elixir_of_eternal_life_rivals_start_hunt_tt: "Your rivals' Military Strength is estimated at #V 1700#!"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_ADD: "You #P gain#! $VALUE|0V$ Military Strength"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_SUBTRACT: "You #N lose#! $VALUE|0V$ Military Strength"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_ADD: "Your rivals #N gain#! $VALUE|0V$ Military Strength"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_SUBTRACT: "Your rivals #P lose#! $VALUE|0V$ Military Strength"
 POD_mummy_elixir_of_eternal_life_military_strength: "#clickable Your current Military Strength is [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|V0]\nYour rivals' Military Strength is estimated at [GetPlayer.MakeScope.GetVariable('rivals_eoel_wk_force').GetValue|V0]#!\n\n"

 POD_mummy_elixir_of_eternal_life.31.t: "Lessons of Damnation"
 POD_mummy_elixir_of_eternal_life.31.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Having accepted the Most-Sovereign Master's command, it is time to receive the Most-Profound Master's lesson. It shall be the guiding principle upon which your space is founded and around which new Wu Kuei shall be shaped. How well will you internalize and apply these words of such wisdom?"
 POD_mummy_elixir_of_eternal_life.31.a: "Suffering is the ultimate purpose of life."  # default. 25 prowess for +25 dread/no penalty
 POD_mummy_elixir_of_eternal_life.31.b: "Exploit suffering as currency."  # mikaboshi. 30 stewardship for +250 you/+250 enemy
 POD_mummy_elixir_of_eternal_life.31.c: "Fear is the purest profit."  #tou shen. 25 stewardship for -150 enemy/-150 you
 POD_mummy_elixir_of_eternal_life.31.d: "Broken spirits are profitable."  #wu hua. 20 stewardship for +50 you/-50 you
 POD_mummy_elixir_of_eternal_life.31.e: "Control must be absolute."  #tou mu. 30 diplomacy for +250 you/+250 enemy
 POD_mummy_elixir_of_eternal_life.31.f: "Memory is power."  #bao zhong. 25 diplomacy for +150 you/-150 you
 POD_mummy_elixir_of_eternal_life.31.g: "Knowledge above all."  #grandmother witch. 20 diplomacy for +50 you/-50 you
 POD_mummy_elixir_of_eternal_life.31.h: "Subtlety wins wars."  #emma-o. 30 intrigue for -250 enemy/-250 you
 POD_mummy_elixir_of_eternal_life.31.i: "Exploit the blind."  # hen tian. 25 intrigue for -150 enemy/+150 enemy
 POD_mummy_elixir_of_eternal_life.31.j: "Strike unseen; devour all."  # yargra. 20 intrigue for -50 enemy/-50 you
 POD_mummy_elixir_of_eternal_life.31.k: "Crush all that stand before you."  #dokhor-khan. 30 martial for -250 enemy/-250 you
 POD_mummy_elixir_of_eternal_life.31.l: "Spread corruption and agony."  #rangda. 25 martial for -150 enemy/-150 you
 POD_mummy_elixir_of_eternal_life.31.m: "Expand through slavery."  #danoru ka. 20 martial for +50 you/+50 enemy
 POD_mummy_elixir_of_eternal_life.31.effect.success.desc: "The lesson embeds itself in your mind"
 POD_mummy_elixir_of_eternal_life.31.effect.failure.desc: "The lesson slides off your mind, never taking purchase"

 POD_mummy_elixir_of_eternal_life.32.t: "An Unclaimed Pit"
 POD_mummy_elixir_of_eternal_life.32.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Having heard the Most-August Master's lesson and internalized it, you set off for the land allocated to you by the Most-Generous Master. The march is long and exhausting. While the size of your forces discourages the lesser beasts from troubling you, jealous fools among the Most-Merciful Master's followers seek to usurp your privileged position. Repelling their pointless assaults is little trouble for one so blessed by the Most-Mighty Master as yourself. However, such interruptions do tire the frailer parts of your force. Such weaklings are abandoned to the Hell's wilderness. The strongest among them will survive and complete the journey on their own so little is lost.\n\nWhile none of the other major servants of the Most-Eminent Master currently lay claim to the land, the pit now laying before is still inhabited by some of the lesser creatures that wander the Most-Exalted Master's realm. Driving them out would pose little difficulty, but little would be gained from it for the purposes of your current task. Alternatively, you could risk some of your resources and delay your efforts for the chance to enslave them and direct them towards supporting your efforts."
 POD_mummy_elixir_of_eternal_life.32.a: "Drive them back into the wilderness."  # no check. Gain dread
 POD_mummy_elixir_of_eternal_life.32.b: "Enslave them and put them to work."  # 25 martial for +100 you/-100 you. boost if POD_mummy_elixir_of_eternal_life.30.tt.south
 POD_mummy_elixir_of_eternal_life.32.c: "Bind them with magic."  # 15 learning for +150 you/-150 you. Only if you/courtier are psychic/necromancy/any the_beast_arts perk
 POD_mummy_elixir_of_eternal_life.32.effect.success.desc: "The threat is handled. Permanently."
 POD_mummy_elixir_of_eternal_life.32.effect.failure.desc: "While handled, doing so wasted some resources"
 
 POD_mummy_elixir_of_eternal_life.33.t: "Rivals in the Court of Hell"
 POD_mummy_elixir_of_eternal_life.33.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$With your pit claimed and its former denizens handled, your rivals within the Most-Imperious Master's court are taking more active steps to interfere in your task. For daring to disrupt in the Most-Inexorable Master's task, you should see that they are properly punished and humiliated in the Most-Perceptive Master's eyes. While eliminating them would be more satisfying, the Most-Prudent Master disapproves of wasting resources. Perhaps the Most-Generous Master would grant their souls to you for punishment and training. Before such considerations though, you must determine the best way to address their schemes. Perhaps you shall use it to promote your own legend or arrange for them to be punished for their carelessness in allowing you to discover their efforts. Alternatively, you could ignore them in simple spite."
 POD_mummy_elixir_of_eternal_life.33.a: "Use their hatred to fuel your fame."  # no check. Gain prestige
 POD_mummy_elixir_of_eternal_life.33.b: "Outbuild and outlast them. I'll weather the storm."  # 25 stewardship for +100 you/+100 enemy. boost if east
 POD_mummy_elixir_of_eternal_life.33.c: "Expose their schemes. Such lack of care will be punished."  # 25 intrigue for +100 you/+100 enemy. boost if west
 POD_mummy_elixir_of_eternal_life.33.effect.success.desc: "Their greatest schemes are merely trifles"
 POD_mummy_elixir_of_eternal_life.33.effect.failure.desc: "How troublesome..."

 POD_mummy_elixir_of_eternal_life.34.t: "Fuel for Damnation's Fires"
 POD_mummy_elixir_of_eternal_life.34.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$To fuel the torture engines of your pit, you require immense amounts of essence. This essence can only be extracted by inflicting immense pain and suffering on collected souls, squeezing out every last drop of lifeforce. You shall refine these raw resources into something more useful for the Most-Puissant Master's plans, immense vats of it. Every drop shall be carefully processed and treated, ready to be thrown into the furnaces to create a twisted form of steam that will energize the engines of destruction. However, mundane agony is inadequate for your purposes. If you do not wish to burn through massive quantities of souls for a single drop, you will need potent magic to amplify the misery and distill the essence you require. You eagerly await the symphony of destruction!"
 POD_mummy_elixir_of_eternal_life.34.a: "Raid nearby hells."  # 25 martial for +100 you/-100 you. boost if south
 POD_mummy_elixir_of_eternal_life.34.b: "Refine existing souls."  # 15 learning for +100 you/no effect. boost if you/courtier are psychic/necromancy/any the_beast_arts perk
 POD_mummy_elixir_of_eternal_life.34.c: "Sacrifice mortals to acquire more souls."  # no check. Cost prestige for +100 you. Only if west
 POD_mummy_elixir_of_eternal_life.34.effect.success.desc: "We'll have plenty of fuel now"
 POD_mummy_elixir_of_eternal_life.34.effect.failure.desc: "Such a waste of resources"

 POD_mummy_elixir_of_eternal_life.35.t: "Forging the Damned"
 POD_mummy_elixir_of_eternal_life.35.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Throughout the world, there are countless slums, decrepit regions, and impoverished lands. In every land and every place, the homeless, the hungry, the hopeless know the truth! There is no one that cares about them! There is no one even aware of their existence! They have nothing! They will never have anything... except their anger! Their hatred! Such delicious hatred! You shall take that spark and turn into an inferno that burns down the heavens themselves!\n\nHowever, stoking the flame will require quite the poker, and before they can serve the Most-Imperial Master, they must be forged into useful tools. How will you transform these pitiful scraps into what you need? Will you simply grant them equipment to compensate for the weakness of their flesh? Will you take only the greatest and hone them? Will you mold even the most wretched into something worth using?"
 POD_mummy_elixir_of_eternal_life.35.a: "I will use brutal conditioning"  # 25 martial for +100 you/-100 you. boost if south
 POD_mummy_elixir_of_eternal_life.35.b: "I will optimize their training."  # 25 stewardship for +100 you/-100 you. boost if east
 POD_mummy_elixir_of_eternal_life.35.c: "I will recruit only the best."  # 25 diplomacy for +100 you/-100 you. boost if north
 POD_mummy_elixir_of_eternal_life.35.d: "I will equip them with the best equipments"  # no check. Cost gold for +100 you.
 POD_mummy_elixir_of_eternal_life.35.effect.success.desc: "Forged to dark perfection"
 POD_mummy_elixir_of_eternal_life.35.effect.failure.desc: "Many die before the program is perfected"

 POD_mummy_elixir_of_eternal_life.36.t: "Torment Runs Wild"
 POD_mummy_elixir_of_eternal_life.36.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$As is only proper, the Most-Dominant Master holds absolute power within their domain. However, the pit you claimed is your responsibility to manage. Unfortunately, there have been many demands on your time, including your claimed territory among the mortals. This created an opportunity that has been exploited by your minions.\n\nSome of the lesser slaves are running about wildly, setting random fires and letting loose the beasts you had captured. Minions simply plot your demise while the more far-sighted seek to supplant you in the Most-August Master's eyes.\n\nThe fools pose little risk in the long-term. If nothing else, you are far too important to the Most-Perceptive Master's plans. However, they could prove to be inconveniences and delay your initiatives. How do you will you hand their foolish insurrection?"
 POD_mummy_elixir_of_eternal_life.36.a: "Reassert control by force!"  # 50 prowess for +100 you/-100 you. boost if south
 POD_mummy_elixir_of_eternal_life.36.b: "Use the chaos to refine them."  # 50/50 random check for +250 you/-250 you
 POD_mummy_elixir_of_eternal_life.36.c: "Perhaps the Most-Mighty Master's aid is necessary"  # no check. Cost prestige for +100 you. Only if north
 POD_mummy_elixir_of_eternal_life.36.effect.success.desc: "All according to plan"
 POD_mummy_elixir_of_eternal_life.36.effect.failure.desc: "So much waste!"

 POD_mummy_elixir_of_eternal_life.37.t: "Judgment of the Master"
 POD_mummy_elixir_of_eternal_life.37.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$After much labor, the pit you carved from the Most-Inexorable Master's Hell groans with torment. Chains rattle across iron causeways suspended over seas of screaming souls. Furnaces roar like starving lions with distilled agony as the first broken spirits are dragged toward the vats of corruption, their essence ready to be forced into mortal vessels.\n\nBefore you can obtain fools to infuse the spirits into it, you are called before the Most-Perceptive Master. As the Most-August Master's gaze settles upon you, the court falls silent. Your rivals eagerly await your humiliation while countless lesser servants collapse in quivering terror. It is time for the quality of suffering and torment you generate to be evaluated. Have you merely built another screaming pit among a thousand, or have you constructed a land of despair truly worthy of the Most-Exalted Master's realm? Will your efforts further the Most-Inexorable Master's grand ambitions or waste resources better suited for other endeavors? Only a trial by combat will determine you and your efforts' fate."
 POD_mummy_elixir_of_eternal_life.37.a: "Demonstate your might, my minions!"  # 200 prowess for +0/+500 enemy
 POD_mummy_elixir_of_eternal_life.37.b: "I didn't just recruit peasants but my champions too!"  # 100 prowess for +0/+500 enemy; final death of 2 champions
 POD_mummy_elixir_of_eternal_life.37.c: "I put on quite the recruiting drive!"  # 50  prowess for +0/+500 enemy; final death of 2 champions, drained army for 5 years
 POD_mummy_elixir_of_eternal_life.37.d: "Put on a show, my minions!"  # no check for flat +500 enemy. Gain 250 renown
 POD_mummy_elixir_of_eternal_life.37.effect.success.desc: "Even the Most-Implacable Master seems slightly impressed"
 POD_mummy_elixir_of_eternal_life.37.effect.failure.desc: "Their performance only reinforces your rivals' claims"
 POD_mummy_elixir_of_eternal_life.37.final_check: "Will compare your Military Strength to that of your rivals and enemies to determine the final results"

 POD_mummy_elixir_of_eternal_life.38.t: "The Most-Sovereign Master's Hell"
 POD_mummy_elixir_of_eternal_life.38.desc: "The Most-Wise Master has seen your value. With a single nod, they acknowledge your success.\n\nReturning to your pit, now truly your pit, you look out over it. Furnaces burn, factories churn. Smokestacks smolder, shadows spread. Chains clatter, curses crawl. Souls scream, spectres stream. Wretches weep, wraiths writhe. A smile flits across your face as grand ambitions crystallize in your mind. The Most-Generous Master has granted you this opportunity, and it would be rude not to fully exploit it."
 POD_mummy_elixir_of_eternal_life.38.a: "So many souls waiting to become Wu Kuei"  # +10XP and elixir_of_eternal_life_wukuei flag

 POD_mummy_elixir_of_eternal_life.39.t: "The Ultimate Price"
 POD_mummy_elixir_of_eternal_life.39.desc: "The Most-Exalted Master does not tolerate weakness, and your efforts proved insufficient. Your rivals now feast upon your failure, tearing apart the carcass of your pit. It matters little to you for the Most-Dread Master's disappointment lingers far longer than your existence."
 POD_mummy_elixir_of_eternal_life.39.a: "No. NO. NO! NOOOO!! AAAHHHHHH!!!"
