 POD_mummy_spell_of_life.1.t: "Requesting Access"
 POD_mummy_spell_of_life.1.desc: "To pursue our research in means of eternal rebirth, we will need access to the Secret Writings of Cabirus. The current owner, [writings_cabirus_owner.GetFirstName], has been gracious enough to offer us an audience. However, [writings_cabirus_owner.GetSheHe] will want something in exchange for allowing us access to the artifact."
 POD_mummy_spell_of_life.1.a: "I have books to trade"
 POD_mummy_spell_of_life.1.b: "I shall support your war efforts"
 POD_mummy_spell_of_life.1.c: "I shall provide fuel for your experiments"
 POD_mummy_spell_of_life.1.c.fuel_experiments: "The [development|E] level of all counties in the [de_jure|E] [duchy|E] of your capital will decrease by 5 and they will gain the modifier [GetModifier('extinguish_life_modifier').GetNameWithTooltip] for 1 year"
 POD_mummy_spell_of_life.1.d: "As a member of the Inner Council, I demand access"
 POD_mummy_spell_of_life.1.e: "The cost is too high"

 POD_mummy_spell_of_life.2.t: "The Last Copy Destroyed"
 # Inspired by karde mentioning that Horus rampaged through Marseilles while looking for the Uraeus of Orisis, among other things
 POD_mummy_spell_of_life.2.desc: "Through tight control, Horus hoped to safeguard the secrets of immortality, that no one unworthy of the gift would receive it. However, secrets have a way of becoming known. According to the tales, a young mummy called Cabirus traveled to Greece in the sixth century BC and traded a book to a mortal wizard, who returned home and slowly copied it himself. From there, it was distributed to a few other mortal wizards, and several mummies have been created based on the version of Osiris' great rite preserved in what become the #italic Secret Writings of Cabirus#!. Over the centuries, Horus and his servants have hunted down and burned nearly every copy. However, they failed to obtain all of the copies. One remained safely protected within the great mountain fortress Ceoris, citadel of the Tremere clan of vampires. They failed... until now.\n\nAs the fires of the Inquisition rage across Europe, neonates, Furores, Brujah, and more have risen up against their Elders in what is now being called the Anarch Revolt. Admidst the chaos, Horus saw opportunity. Gathering his forces of vampires, Fera, and mummies, he slaughtered his way through the halls of Ceoris. While not the cursed spawn of his uncle, their dark magics, cruel experiments, and heedless thirst for knowledge rendered them little more worthy of the Great Rite. As his magics brought sunlight into the darkened halls, he marched forward, not reveling in it like some of his companions, simply accepting the need. With each swing, his blade severed their heads from their foul bodies, and he came closer to their hidden vault. Their spells and rituals sloughed off of him, and even the vault's protections could not halt him. With a snap, a ravenous flame burst up around a specific book, the last copy of that text created by a fool so long ago. As the pages burned and curled in on themselves, as ash fell to the table and smoke filled his nostrils, as the fire crackled and flames spread, a slight smile crawled its way on to his face."
 POD_mummy_spell_of_life.2.a: "So much lost, so quickly"
 POD_mummy_spell_of_life.2.a.tt: "The requirements for the \"$spell_of_life_stage1_cabirus_phase1_decision$\" decision have changed"

 POD_mummy_spell_of_life.3.t: "One Part Done, Another Begun"
 POD_mummy_spell_of_life.3.desc: "Having achieved a basic understanding of the Spell of Life, your mentor cannot teach you any more. They tell you that magic is something that must be mastered on one's own rather than taught in a classroom. Perhaps they are simply unwilling to teach you any further details, but the result is the same. You will need to journey around the world to collect ancient records, to learn from the failures of others, and to study under others that have a partial understanding of the Spell. After all, hearing the same lesson from a different mouth is often valuable when trying to master a topic. In addition, you will need to spend time conducting research, slowly translating records, and performing experiments.\n\n#help To reach 90 [trait_level_track_xp|E] in Spell of Life and progress further, you will need to accumulate it passively and do [journeys|E]. See [Concept('POD_spell_of_life', 'this tooltip')|E] and the description of the Eternal Rebirth Seeker trait under your character to learn more.#!"
 POD_mummy_spell_of_life.3.a: "My quest is not yet over..."

 POD_mummy_spell_of_life.4.t: "A Warning to Halt"
 POD_mummy_spell_of_life.4.desc: "Something is happening... changing... tearing. Rips are appearing in the Shroud that hangs between the material and shadow lands. Storms are blowing across the lands of the dead, not enough to mark a new age but still sweeping many spirits away to the dark places. Beasts rise, monsters spread, and spirits gather.\n\nAn eclipse hides the Sun's face, casting shadows that carry meaning. Men and women, children and elders, mortals of all kinds utter strange things when they encounter you, their eyes swirling with gold and their voices sagging with an age impossible for such as them. Cryptic messages appear wherever you look, burned into walls and speaking of the restless dead. What you can extract indicates that your creation of mummies and use of the magic behind eternal rebirth is damaging... #bold IT#!."
 POD_mummy_spell_of_life.4.a: "Strange tidings indeed"

 POD_mummy_spell_of_life.5.t: "The Long Day's Journey into Night"
 POD_mummy_spell_of_life.5.desc: "Perhaps this is a consequence of lacking restraint, of not leaving some things hidden. Perhaps this was your goal all along, when you sought out the magic behind the eternal rebirth. In the end, it doesn't matter. So little matters anymore.\n\nThere are many tales of time's end and many names for it too. Some saw a flood of blood, sweeping the world clean. Others predicted the rise of the avatar of ultimate evil. Few were right that it would end with the sundering of the veil between worlds.\n\nWhat once were tears are now great rents, leaving the Shroud as little more than scraps of a curtain. Rifts into the endless abyss ooze a sickly green fog, devouring the land. Nightmares roam, given shape by all our fears, fears with a new life in these darkened days. Living shadows, remnants of those that surrendered to the inner dark, stalk the fog-laden valleys and engulfed forests. A storm like no other swallows the lands of the dead, casting them into a maw that knows no satiation. Against such winds, even the seals upon the Abyss itself cracked. The winds' fury even stretches into the material world, consuming the sun's light and allowing those fearful of its rays to walk freely. Those whose bodies have long since become dust prowl the lands, looking for bodies to steal so that they become unliving immortals that feast upon blood and breath. Waters turn red with blood as the founts of the deep break open. Locusts with crowns of gold, faces of men, teeth of lions, and tails of scorpions scourge the lands, spreading in swarms so great that their wings alone are enough to deafen the dead.\n\nAmidst the horrors, mortals hear voices in their head and see messages upon the walls, imbuing them with the power to accomplish feats even the immortal would struggle to replicate. First among their targets are the Undying, those reborn eternally and whose creation led to this. With each strike, they seek to mend the tears. Rumors of two strange, glowing, winged beings continue to spread, aiding these hunters and actively trying to once more separate the dead from the living. Only time will tell whether their efforts bear fruit, but that is a tale for another day..."
 POD_mummy_spell_of_life.5.a: "And so things end, for now..."
 POD_mummy_spell_of_life.5.a.tt: "The world is coming to an end as the [umbra|E] continues to merge with the Skinlands. #X The game is over, as the world you knew ends.#!"

 POD_mummy_spell_of_life.10.t: "An Audience With Horus"
 POD_mummy_spell_of_life.10.desc: "$POD_debate_debate_strength_header$Horus alone holds the Spell of Life. He has not created a new mummy with the Spell for a very long time. He certainly won't share the Spell with you as things currently stand.\n\nHowever, your previous service has been enough for him to grant you an audience. If you could present sufficiently convincing arguments, you could obtain his aid in your quest, making it substantially easier.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.10.a: "I will journey to his court"
 POD_mummy_spell_of_life.10.b: "On second thought..."

 POD_mummy_spell_of_life.11.t: "Audience: Steward or Merchant?"
 POD_mummy_spell_of_life.11.desc: "$POD_debate_debate_strength_header$ So... you are the young pup that seeks to the learn the Spell of Life. Your service earned you an audience, but nothing more.\nRemember, I am no mere merchant. I cannot be bought. I will not #italic simply #! sell the Spell of Life. I am a steward of powerful knowledge. Giving the Spell of Life to you is like handing a crown to an unproven ruler. Some fools may even use it in a bid to make themselves a peer to Osiris or the Judges of Ma'at. So many fools seek divinity, power to make them greater. In truth, the Spell binds you to consequences you cannot escape, watched by powers you cannot evade, and judged for every breath you restore.\n\nWhat response do you offer?"
 POD_mummy_spell_of_life.11.a: "A steward's tool acts by law. Make me such a tool"
 POD_mummy_spell_of_life.11.b: "If you deny all, only the unworthy will hold it"
 POD_mummy_spell_of_life.11.c: "The Spell is the price; none can be heavier"

 POD_mummy_spell_of_life.12.t: "Audience: What of Cowardice?"
 POD_mummy_spell_of_life.12.desc: "$POD_debate_debate_strength_header$For many millennia, I have fought one war, a war against chaos and traitors. Those gifted eternal rebirth through my mother's Spell of Life are called to aid that war. And yet, there have been betrayers and cowards who abandoned our cause. Their centuries of rebirth have left them apathetic and cowardly. Some killed themselves, abandoning us. Others cared only about their own continued, short-term existence and pleasure and so left into the desert to wander.\nHow much more does that responsibility rest upon one who holds the Spell itself? What manner of creature will you be in a century, five, a hundred? Will you remain faithful? Will you seek the relief of true death? Will you flee in fear when you first see a Child of Set, whether the blood-eater or the undying?"
 POD_mummy_spell_of_life.12.a: "I fought Setites to claim Upper Egypt. I don't fear them"
 POD_mummy_spell_of_life.12.b: "I'm no neonate. I know what age does"

 POD_mummy_spell_of_life.13.t: "Audience: What of Betrayal?"
 POD_mummy_spell_of_life.13.desc: "$POD_debate_debate_strength_header$Perhaps you shall betray me more directly, hhm? Kemintiri once served among my mother's followers, but she was a spy of Set. Are you a spy? When she revealed her true impressions to me, I forgave her. However, Set captured her and tortured her for many, many moons. While she must suffer for her many other crimes, I will admit that she did not surrender the Spell to him. Can you say the same? What of the Macedonian spy who infiltrated my mother's priests in my absence? He nearly succeeded in stealing the Spell of Life, prevented only by his own arrogance. That created the abominations others call Bane Mummies. Will you fall for such a trick? Will your own followers be infiltrated, permitting the Spell of Life to be stolen. What if Set offers you a million gold coins or all the pleasures this world has to offer? He is not without his power. Will such an offer tempt you? Will you give him the Spell of Life?"
 POD_mummy_spell_of_life.13.a: "I can resist anything, torture or pleasure"
 POD_mummy_spell_of_life.13.b: "I'm cautious and can keep a secret"
 POD_mummy_spell_of_life.13.c: "Take my true name to assure my faithfulness"  # mimic Astrokhen
 POD_mummy_spell_of_life.13.c.prohibited_from_teaching: "Horus prohibits you from teaching the Spell of Life to others"

 POD_mummy_spell_of_life.14.t: "Audience: Perspective of Age?"
 POD_mummy_spell_of_life.14.desc: "$POD_debate_debate_strength_header$In my absence, my mother's priests offered eternal rebirth to many who were unworthy. Rather than preserving the best and brightest, they allowed politics and money to guide their decisions. Even when they chose those that were deserving in the moment, they ignored the long-term sustainability of the selected. The minds and bravery of many such selected have been eroded by the millennia. Will you show the degree of #italic wisdom #!? Due to your youth, might you lack perspective? Will you allow personal feelings and emotions to influence you? Will you ignore suitability to preserve connections and loved ones?"
 POD_mummy_spell_of_life.14.a: "I would never!"
 POD_mummy_spell_of_life.14.b: "The Judges would catch the unworthy"
 POD_mummy_spell_of_life.14.c: "You would guide me"

 POD_mummy_spell_of_life.15.t: "Audience: Maintaining the Ma'at?"
 POD_mummy_spell_of_life.15.desc: "$POD_debate_debate_strength_header$The Spell of Life is far more than some mere spell. Mummies exist outside the natural order of things. It is not proper to come back again and again into the same body. We cause less harm than the dead that persist on blood or life. We are the champions of Ma'at, the balance, in an [Glossary('eternal war','podgloss.warofbalance')]. We hunt and kill those that seek to disrupt it and bring chaos. And yet, by virtue of our very existence, we are obstacles to its restoration. In small numbers, the damage is insignificant and greatly offset by our war. However, the time will come that the Ma'at will demand we kill ourselves and end our cycles of rebirth. Every new mummy further disrupts the balance and brings the day of our end closer, the point when the damage we do is too great, too irreversible. By giving you the Spell of Life, I guarantee that new mummies will be made for there is no other reason to pursue it. Why should I take that risk and aid you?"
 POD_mummy_spell_of_life.15.a: "Teaching the Spell reduces the number vs. independent rediscovery"
 POD_mummy_spell_of_life.15.b: "If you teach me, you control what follows"
 POD_mummy_spell_of_life.15.c: "Refusing new champions harms Ma'at more"

 POD_mummy_spell_of_life.16.t: "Audience: Success"
 POD_mummy_spell_of_life.16.desc: "Very well... your arguments are convincing. If you prove yourself and demonstrate your commitment to the war, I shall aid you in your quest for the Spell of Life. I will not give you the Spell. Only by acquiring it yourself will you truly appreciate and understand it. However, I will provide some guidance, helping you to piece together the shards of knowledge that have been scattered to the four winds."
 POD_mummy_spell_of_life.16.a: "I am grateful for your mentorship"

 POD_mummy_spell_of_life.17.t: "Audience: Failure"
 POD_mummy_spell_of_life.17.desc: "Fool! I have guarded Ma'at for over six millennia! Do you think such pretty words will be enough to sway me? Do you consider me a politician that will follow the winds of change? Do you view me a merchant that will change his mind in accordance with the gold?\n\nPerhaps in few years or decades, you will show greater wisdom. Return then!"
 POD_mummy_spell_of_life.17.a: "Very well, I shall return later"

 

 POD_mummy_spell_of_life.20.t: "Council: Who to Call?"
 POD_mummy_spell_of_life.20.desc: "Pursuing the Spell of Life is no small endeavor and will require a great deal of our attention. If you could arrange support from our fellows, then you would have more time and more resources to devote towards your efforts. Even a promise of non-interference would be sufficient.\n\nThe question becomes who to summon. You can only invite the most powerful so you couldn't choose who specifically to invite. Instead, you must consider who would be most likely to agree to your proposal. Who would provide the greatest aid?"
 POD_mummy_spell_of_life.20.a: "Call together our Family"  # same dynasty
 POD_mummy_spell_of_life.20.c: "Call together those on our path"  # same faith
 POD_mummy_spell_of_life.20.d: "On second thought..."

 POD_mummy_spell_of_life.21.t: "Council: Time to Begin"
 POD_mummy_spell_of_life.21.desc: "$POD_debate_debate_strength_header$It has taken some time. However, you have finally convened a council of 5 representatives. Continuing your research will take a great deal of time and resources. You need to convince them to join your efforts and to devote their resources to your cause. Such a promise would speed up your efforts and help to shield you from external forces. Even a promise of non-interference would reduce the risk. After all, you don't want to deal with some idiot relatives trying to steal your research.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.21.a: "Everyone take a seat. There's much to do"
 POD_mummy_spell_of_life.21.b: "On second thought..."

 POD_mummy_spell_of_life.22.t: "Council: Where Others Failed"
 POD_mummy_spell_of_life.22.desc: "$POD_debate_debate_strength_header$The Spell of Life is a waste of time, a quest even more foolish than that for the Grail. Very, very few have ever held the Spell of Life, all of whom received it from another. Isis, one of the greatest mages in history, was gifted it by a being she called Thoth. Horus, one of only two who know it in the current age, learned it from his mother. Cabirus, the other of the two, practiced an incomplete and flawed version, modified from a copy he was gifted by an unknown Ishmaelite. The few other confirmed holders came from the Cult of Isis and were similarly taught by others. Anything else is mere rumor.\nMany, many have tried to acquire it through other means. Set spent countless centuries pursuing the Spell. Whether it was infiltrating the Cult of Isis or torturing a holder of the Spell of Life or conducting experiments of incredible scale, he, a [Glossary('Cainite','game_concept_cainite_desc')] [Glossary('antediluvian','game_concept_antediluvian_desc')], failed every time. The best he managed was the deeply flawed Bane Mummies. The Bane Mummies themselves spent centuries in the same fruitless pursuit. Several Ishmaelites have tried too. The closest they ever came was a spell that created vampires.\n\nDo you truly believe that that you can create the Spell of Life without being gifted it? Do you consider yourself so special, so different that you will succeed where so many greater failed?"
 POD_mummy_spell_of_life.22.a: "Tools, knowledge, & magic have evolved since then"
 POD_mummy_spell_of_life.22.b: "It is a spell with many layers and variants"
 POD_mummy_spell_of_life.22.c: "They worked independently. Hence you..."

 POD_mummy_spell_of_life.23.t: "Council: What's the Cost?"
 POD_mummy_spell_of_life.23.desc: "$POD_debate_debate_strength_header$You want gold? Resources? Manpower? Access to our libraries? The most precious of all, even for us, time? Perhaps you have not noticed, but our kind is constantly at war, internally and externally. The hunters are growing ever more determined, persistent, and numerous. Some of the oldest among us have disappeared, ended their lives, or been hunted down. Our rivals have been launching ever more complex political machinations. Our own schemes and research require ever more expenditure. You cannot seriously expect us to risk what little we have to spare for some esoteric pursuit that may yield nothing but failure. Even if we accept that the Spell of Life is theoretically possible, the opportunity cost is unacceptable."
 POD_mummy_spell_of_life.23.a: "It's a solution to survival, not distraction from it"
 POD_mummy_spell_of_life.23.b: "You already accept risky research as fits your traditions"
 POD_mummy_spell_of_life.23.c: "It requires less than you think"

 POD_mummy_spell_of_life.24.t: "Council: What's the Reward?"
 POD_mummy_spell_of_life.24.desc: "$POD_debate_debate_strength_header$We have our own affairs to manage, our own power bases, domains, loyal followers. We would need to sacrifice some of our resources to aid you, weakening ourselves and creating an opening. If you fail, we will have wasted valuable time, money, and effort on a fool's errand. However, let us set that aside and say we accept your arguments. If you succeed... well, that's another problem in itself. We will have weakened ourselves to make you stronger. Now, you are a competitor or less. Afterwards, you could be a rival capable of unseating us. In comparison, we would receive nothing. Why would we not demand resources? Why would we not steal the Spell from you? Put simply, what is in it for us?"
 POD_mummy_spell_of_life.24.a: "I have a great deal of gold"
 POD_mummy_spell_of_life.24.b: "I will owe you favors"
 POD_mummy_spell_of_life.24.c: "I will lend you my forces"

 POD_mummy_spell_of_life.25.t: "Council: Inviting Catastrophe?"
 POD_mummy_spell_of_life.25.desc: "$POD_debate_debate_strength_header$Many others have sought the Spell of Life, a great many others. Such beings have long lives, have potent powers, and would not abandon such a quest. Should you succeed where they failed, it could attract the attention of great powers. Their attention brings nothing less than catastrophe, to you... and to us should we aid you. Do you believe that such powers could be withstood? That you could withstand such powers? Perhaps you think that they will be too scared of you to interfere?"
 POD_mummy_spell_of_life.25.a: "They are long gone. There's no reason to fear them"  # extremely hard learning check
 POD_mummy_spell_of_life.25.b: "My knights & I shall stand firm"  # extremely hard prowess check
 POD_mummy_spell_of_life.25.c: "All of us shall resist them together"  # extremely hard stewardship check

 POD_mummy_spell_of_life.26.t: "Council: Success"
 POD_mummy_spell_of_life.26.desc: "Very well... your arguments are convincing. We shall lend you some resources to pursue your experiments, though we will not fully commit ourselves to an endeavor almost guaranteed to fail. Do not waste them."
 POD_mummy_spell_of_life.26.a: "I thank you for your aid"

 POD_mummy_spell_of_life.27.t: "Council: Failure"
 POD_mummy_spell_of_life.27.desc: "Fool! You ask too much for too little. We will not support your foolishness.\n\nPerhaps in few years or decades, you will present a compelling case. Call us together then!"
 POD_mummy_spell_of_life.27.a: "Very well, we shall talk later"



 POD_mummy_spell_of_life.30.t: "Horus' Assault"
 POD_mummy_spell_of_life.30.desc: "Horus has ever been the keeper of the Spell of Life, the only one currently alive that knows the full Spell. He lives by his code, the Wat Hor, and enforces it within the world. Tenet 6 bans the creation of mummies, inherently restricting access to the Spell of Life. He hunts the Secret Writings of Cabirus which leak only incomplete details regarding the Spell of Life. You have come very close to constructing the full Spell of Life, attracting Horus' fury upon you in measures far beyond what Cabirus' writings ever earned.\n\nNow, Horus and his mummy followers have arrived before your haven, planning to attack in the day when they are at their strongest and you are at your weakest. They are forming ranks, preparing to overwhelm your defenses. Their swords gleam in the noonday sun, eager to shed your blood. Their magicks are gathering around them, distorting the area like the haze of heat above a torch or masonry roof in the summer. On an unheard signal, they charge. You have no choice but to withstand their assault."
 POD_mummy_spell_of_life.30.a: "Hold. Hold! HOLD!"
 POD_mummy_spell_of_life.30.b: "Please! Let me live! I beg you!"
 POD_mummy_spell_of_life.30.stage3.success: "Somehow, despite it all, you stand triumphant"
 POD_mummy_spell_of_life.30.stage3.successful_groveling: "Horus accepts your pitiful pleas"
 POD_mummy_spell_of_life.30.stage3.failure: "You fall like wheat before a scythe"
 POD_mummy_spell_of_life.30.stage3.successful_sale: "You give them your research in exchange for leaving you alone"
 POD_mummy_spell_of_life.30.kemintiri_fight: "Kemintiri's support has reduced the forces arrayed against you"
 POD_mummy_spell_of_life.30.kemintiri_begging: "Kemintiri's support speaks well of your trustworthiness"
 POD_mummy_spell_of_life.30.stage3.successful_groveling.tt: "Your progress on the quest for the Spell of Life will be reset. While you will retain the support you previously earned, you will need to choose a new path of decisions to progress once more."
 POD_mummy_spell_of_life_total_prowess_check: "Your [coterie|E]'s cumulative [prowess|E] will be compared to that of your enemy, with a bonus based on the scale of their influence as reflected by the spread of their [faith|E]"
 POD_mummy_spell_of_life_total_learning_check: "Your [coterie|E]'s cumulative [learning|E] will be compared to that of your enemy, with a bonus based on the scale of their influence as reflected by the spread of their [faith|E]"
 POD_mummy_spell_of_life_total_intrigue_check: "Your [coterie|E]'s cumulative [intrigue|E] will be compared to that of your enemy, with a bonus based on the scale of their influence as reflected by the spread of their [faith|E]"
 POD_mummy_spell_of_life_total_stewardship_check: "Your [coterie|E]'s cumulative [stewardship|E] will be compared to that of your enemy, with a bonus based on the scale of their influence as reflected by the spread of their [faith|E]"

 POD_mummy_spell_of_life.31.t: "The Shemsu-Heru's Assault"
 POD_mummy_spell_of_life.31.desc: "Horus has ever been the keeper of the Spell of Life, the only one currently alive that knows the full Spell. He lives by his code, the Wat Hor, and enforces it within the world. Tenet 6 bans the creation of mummies, inherently restricting access to the Spell of Life. He hunts the Secret Writings of Cabirus which leak only incomplete details regarding the Spell of Life. While Horus may be absent, you have come very close to constructing the full Spell of Life which has attracted the fury of Horus' followers upon you in measures far beyond what Cabirus' writings ever earned.\n\nNow, the Shemsu-Heru have arrived before your haven, planning to attack in the day when they are at their strongest and you are at your weakest. They are forming ranks, preparing to overwhelm your defenses. Their swords gleam in the noonday sun, eager to shed your blood. Their magicks are gathering around them, distorting the area like the haze of heat above a torch or masonry roof in the summer. On an unheard signal, they charge,. You have no choice but to withstand their assault."
 POD_mummy_spell_of_life.31.a: "Hold. Hold! HOLD!"
 POD_mummy_spell_of_life.31.b: "Please! Let me live! I beg you!"
 POD_mummy_spell_of_life.31.stage3.successful_groveling: "Your pitiful pleas are accepted"

 POD_mummy_spell_of_life.300.t: "Horus' Letter"
 POD_mummy_spell_of_life.300.desc: "You receive a letter from Horus. This is not an unusual or surprising event since that has primarily been how you have communicated while you worked to deepen your precise understanding of the Spell of Life. However, this time, the letter does not carry a hint or confusing, yet eventually insightful document that predates most civilizations you know.\n\n\"Having tracked your progress, you should be approaching the point where you tie your Spell to a specific shadow realm. While I was initially hesitant to tolerate or support your quest, when the time comes, I recommend that you visit Amenti. I believe that you have earned the right to present your case before the Judges of Ma'at.\""
 POD_mummy_spell_of_life.300.a: "Hhm, an interesting thought..."

 POD_mummy_spell_of_life.32.t: "Celestyn's Offer"
 POD_mummy_spell_of_life.32.desc: "Once known as House Tremere among the mages of the Order of Hermes, they sought various means of immortality. Their initial research led them to vampirism. However, some among them never abandoned their search. Celestyn, the master librarian and a researcher comfortable in the field, developed a particular interest in mummies. He even acquired one of, if not the last, copy of the Secret Writings of Cabirus. You have come very close to constructing the full Spell of Life, attracting his full attention. In the hopes of attaining an immortality without the curses of vampirism, many Tremere field \"researchers\" and their gargoyle servants have arrived. Celestyn steps forward:\n\n\"We are fellow academics. To get this far and learn what you have of the Spell of Life, you are clearly one of great intelligence and intellect. Surely, you can see that we are far more powerful than you, capable of blowing your haven apart with our disciplines. However, such bloodshed is unnecessary. Give us your research, and we will leave you alone to continue your efforts.\""
 POD_mummy_spell_of_life.32.a: "You think to steal my work?!"
 POD_mummy_spell_of_life.32.b: "Here, take it and leave me alone"

 POD_mummy_spell_of_life.33.t: "Clan Tremere's Offer"
 POD_mummy_spell_of_life.33.desc: "Once known as House Tremere among the mages of the Order of Hermes, they sought various means of immortality. Their initial research led them to vampirism. However, some among them never abandoned their search. The Tremere's master librarian developed a particular interest in mummies and even acquired one of, if not the last, copy of the Secret Writings of Cabirus. While he may be absent, you have come very close to constructing the full Spell of Life, attracting the Clan's full attention. In the hopes of attaining an immortality without the curses of vampirism, many Tremere field \"researchers\" and their gargoyle servants have arrived. One steps forward:\n\n\"We are fellow academics. To get this far and learn what you have of the Spell of Life, you are clearly one of great intelligence and intellect. Surely, you can see that we are far more powerful than you, capable of blowing your haven apart with our disciplines. However, such bloodshed is unnecessary. Give us your research, and we will leave you alone to continue your efforts.\""
 POD_mummy_spell_of_life.33.a: "You think to steal my work?!"
 POD_mummy_spell_of_life.33.b: "Here, take it and leave me alone"

 POD_mummy_spell_of_life.320.t: "Cabirus' Aid"
 POD_mummy_spell_of_life.320.desc: "For millennia, Cabirus has been pressured on every side from those that sought his knowledge or those that wished to kill him for having it. Most recently, it has been the Tremere clan of vampires. Considering your ever-improving understanding of the Spell of Life, they likely would have turned their attention towards you. Thankfully, you broke their power base and prevented any concentrated efforts to acquire Cabirus' knowledge or your research. While Cabirus has always been reluctant to utilize his abilities for fearing of drawing attention, weakening the Tremere has allowed him to act more freely. The scattered forces are easily dealt with by one of his power. In addition, Cabirus has offered you the opportunity to tie your Spell of Life to Hades, using it as your shadow realm. While it would need stabilization and expansion, such efforts would be easier than carving out your own realm."
 POD_mummy_spell_of_life.320.a: "An interesting proposition..."

 POD_mummy_spell_of_life.34.t: "Kemintiri's Strike"
 POD_mummy_spell_of_life.34.desc: "While they lack the overwhelming zealotry of Horus and the Shemsu-Heru, the Children of Osiris and Cult of Isis are nonetheless devoted to protecting the secret of the Spell of Life. While they have been infiltrated by Set on many occasions and nearly lost the Spell of Life to him, they remain loyal to the mission of preventing its abuse. Kemintiri herself suffered greatly at Set's hands, refusing to give him any information regarding it.\n\nNow, they have discovered your research and are moving against you. Where others might assault your haven with an army, they have sent assassins and Kemintiri herself to terminate your research. Unfortunately for you, that means terminating you too."
 POD_mummy_spell_of_life.34.a: "Find her! Leave no stone unturned..."
 POD_mummy_spell_of_life.34.b: "Burn the research, and pray she leaves us alone!"
 POD_mummy_spell_of_life.34.stage3.successful_groveling: "You wake up still alive, apparently shown mercy"
 POD_mummy_spell_of_life.34.horus_fight: "Horus' support has reduced the number of assassins sent against you"
 POD_mummy_spell_of_life.34.horus_begging: "Horus' support speaks well of your trustworthiness"

 POD_mummy_spell_of_life.35.t: "The Children of Osiris' Strike"
 POD_mummy_spell_of_life.35.desc: "While they lack the overwhelming zealotry of Horus and the Shemsu-Heru, the Children of Osiris and Cult of Isis are nonetheless devoted to protecting the secret of the Spell of Life. While they have been infiltrated by Set on many occasions and nearly lost the Spell of Life to him, they remain loyal to the mission of preventing its abuse.\n\nNow, they have discovered your research and are moving against you. Where others might assault your haven with an army, they have sent assassins to terminate your research. Unfortunately for you, that means terminating you too."
 POD_mummy_spell_of_life.35.a: "Find them! Leave no stone unturned..."
 POD_mummy_spell_of_life.35.b: "Burn the research, and pray they leave us alone!"

 POD_mummy_spell_of_life.340.t: "Kemintiri's Support"
 POD_mummy_spell_of_life.340.desc: "As you leave your throne rooms, a tingle suddenly runs up your spine as the shadows in the hallway begin to move. They flow inwards, moving away from the sides and covering the floor. They start to coalesce into a pool before flowing upwards into a humanoid shape. It appears to be first a mannequin with crude features, then a statue with more precise cuts, before finally resolving into the flesh of someone you recognize: Kemintiri.\n\n\"I thank you for helping me restore my memory. To repay the favor, know that I have spoken on your behalf among the followers of Osiris and Isis. They will not interfere with your quest for the Spell of Life. In addition, you will receive the opportunity to speak with the Judges of Ma'at and to make Amenti your home.\""
 POD_mummy_spell_of_life.340.a: "Thank you for your support"

 POD_mummy_spell_of_life.36.t: "Qufur am-Heru's Siege"
 POD_mummy_spell_of_life.36.desc: "Set, an ancient antediluvian, spent many millennia pursuing the Spell of Life that empowered his nephew. Indescribable horrors were inflicted. Innumerable people died in his experiments. Countless schemes were constructed to steal it. The closest he ever came was tricking Niklos, a high priest of the Cult of Isis, into accepting one of Set's servants as his protege. Yet, even that only provided a partial version of the Spell of Lfie, leading to the abominations known as Bane Mummies. While Set may have retreated, his childer have not abandoned his quest. Now, Qufur am-Heru, Champion of Set, stands before your haven with a great host.\n\n\"Surrender the Spell of Life to us, and we may permit you to continue your research. Resist, and we shall extract the knowledge we need from the broken fragments of your mind. We shall have what we want; all that changes is how long it takes.\"\n\n#clickable Your [coterie|E]'s strength is [GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0].\nYour enemy [coterie|E]'s strength is [GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0].#!"
 POD_mummy_spell_of_life.36.a: "Prepare the defenses..."
 POD_mummy_spell_of_life.36.b: "Just take it..."

 POD_mummy_spell_of_life.37.t: "The Setites' Siege"
 POD_mummy_spell_of_life.37.desc: "Set, an ancient antediluvian, spent many millennia pursuing the Spell of Life that empowered his nephew. Indescribable horrors were inflicted. Innumerable people died in his experiments. Countless schemes were constructed to steal it. The closest he ever came was tricking Niklos, a high priest of the Cult of Isis, into accepting one of Set's servants as his protege. Yet, even that only provided a partial version of the Spell of Lfie, leading to the abominations known as Bane Mummies. While Set may have retreated, his childer have not abandoned his quest. Now, the Setites stand before your haven, gathered as a great host.\n\n\"Surrender the Spell of Life to us, and we may permit you to continue your research. Resist, and we shall extract the knowledge we need from the broken fragments of your mind. We shall have what we want; all that changes is how long it takes.\"\n\n#clickable Your [coterie|E]'s strength is [GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0].\nYour enemy [coterie|E]'s strength is [GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0].#!"
 POD_mummy_spell_of_life.37.a: "Prepare the defenses..."
 POD_mummy_spell_of_life.37.b: "Just take it..."

 POD_mummy_spell_of_life.360.t: "Allies' Backing"
 POD_mummy_spell_of_life.360.desc: "Your chancellor and spymaster deliver concerning reports that the Setites and Bane Mummies are mobilizing against you. Since you are the closest to acquiring the Spell of Life since Set himself, they see the potential to complete his quest. However, you reach out to your allies and supporters. Calling upon your prior agreements, you are able to directly and indirectly exert both diplomatic and martial pressure on the Setites. Even the wanderers that lack a territory to protect find themselves lacking the opportunity to strike against you."
 POD_mummy_spell_of_life.360.a: "Good. Those thieves won't benefit from my work!"



 POD_mummy_spell_of_life.40.t: "An Audience With the Judges of Ma'at"
 POD_mummy_spell_of_life.40.desc: "$POD_debate_debate_strength_header$Aided by your two Wraith friends, you have opened a door into the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]. Unfortunately, an ever-shifting, incomprehensible sea of sand and water surrounds you on all sides, with the water seeming to change places with the sand whenever you focus your attention on it. Shadows cloak most of it in darkness, hiding unknown risks and treasures from your sight. Something you can only perceive as a hurricane of memories and pure energy swirls around you, buffeting you. Plasma and unnameable materials rain down upon your head. Your steps do not make any progress as the dunes move with you, the ocean recedes and advances, the winds fight you, and strange beasts assault you. Only one clear path lies ahead of you, a river that you believe to be the [UmbraGlossary('river_of_death')]. You cannot continue without the aid of Anubis. Until he arrives to investigate your unconventional entrance, you must repel whatever monsters may lurk among the sandy seas.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.40.a: "We await Anubis"
 POD_mummy_spell_of_life.40.b: "Let's return before the door closes"
 POD_mummy_spell_of_life.40.effect.success.desc: "You hold the line until his arrival"
 POD_mummy_spell_of_life.40.critical.failure.effect.desc: "The spectres overwhelm you, forcing your retreat"

 POD_mummy_spell_of_life.41.t: "Audience: Anubis' Arrival"
 POD_mummy_spell_of_life.41.desc: "$POD_debate_debate_strength_header$After hours?... days?... there appears a great gate made from a dark, glassy stone, spanning the [UmbraGlossary('river_of_death')]. As you reach out to touch the handle, a strange being rises from the shifting sands to your left. More so even than most #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L Wraiths#!#!, its body seems to be a liquid and a solid, flowing and yet maintaining a shape. That shape is of a partially-transformed, jackal-headed #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#!#!. The color of its skin is that of tar, dark as death itself. It carries a glowing lantern suspended from a long pole. In a voice like a rockslide in a hollow well, it speaks:\n\n\"Why should I not execute you immediately for daring to trespass within [UmbraGlossary('neter_khertet')], where not even wraiths of the [UmbraGlossary('dark_kingdom_of_iron')] dare to tread? Why should I even entertain the possibility of escorting you to the Judges of Ma'at?\""  # description of Anubis inspired by Silent Striders tribebook
 POD_mummy_spell_of_life.41.a: "I'm not bound by treaties with Charon"
 POD_mummy_spell_of_life.41.b: "Weigh my heart, and make your decision"
 POD_mummy_spell_of_life.41.c: "I wish to protect Neter-Khertet. Let the Judges deem me unworthy"

 POD_mummy_spell_of_life.42.t: "Audience: Will You Remain True?"
 POD_mummy_spell_of_life.42.desc: "$POD_debate_debate_strength_header$The gates swing upon, and Anubis leads you through. As you walk through the land, you look around. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] bears echoes of the living lands, formed by the passions and desires placed upon the great cities, tombs and temples of the Kingdom. However, it is far more than mere ruins or echoes. The Kingdom's substance is easily worked by its inhabitants. Their millennia of time has given the Judges of Ma'at and the Shemsu-Heru that have returned more than enough time to create a stunning display of grandeur. Incredible peaks of gold and white limestone rise up in the distance, stretching above the dunes that surround you. Without anything discernibily changing, 42 people now stand encircling you and Anubis, garbed in ornate shendyt and holding pharaonic crooks. They speak in turn, each delivering the next sentence.\n\n\"The Spell of Life does not merely resurrect. It anchors a soul across innumerable cycles. You were not forged, trained, or broken into a vessel capable of sustaining that architecture. To grant you rebirth would invite your own corruption. If not tomorrow, then in a hundred, a thousand, ten thousand years. While we could cast you into Amemait, why should we take such a risk? You could do a great deal of harm before then. Worse, you seek rebirth not solely for balance, but for continuation of self, of will, of identity. Amenti are instruments of Ma'at, not survivors. Your desire to live leaves you vulnerable to the whispering of our enemies. One lifetime — even a righteous one — does not outweigh the long memory of the scales or prove your ability to remain steadfast.\""
 POD_mummy_spell_of_life.42.a: "I'm no neonate. I can resist the corruption of age"
 POD_mummy_spell_of_life.42.b: "I could not resist your judgment"
 POD_mummy_spell_of_life_42_b_note: "Your success chance increases if the Judges are stronger than you"
 POD_mummy_spell_of_life.42.c: "I would remain loyal, as others have before me"

 POD_mummy_spell_of_life.43.t: "Audience: Are You Worthy?"
 POD_mummy_spell_of_life.43.desc: "$POD_debate_debate_strength_header$\"When the process was properly governed and overseen, the Shemsu-heru were chosen because they were proven worthy. Their skills deserved to be preserved. Their service to Ma'at was true and would span incarnations. Amen Khal, Hetch-Abehu, and Neith were skilled soldiers and tacticians that proved themselves on the field of battle. Sahu-Ra was a scribe and craftsman beyond compare. Tjehenu proved himself a mage of great potential. Merit-neferu was a merchant of remarkable skill and faithfulness. While she was a queen of political significance, Neferukhayt was chosen for her scholarship, erudition, and thirst for knowledge.\n\nWhat of you deserves to be preserved? What have you done to earn a place among the Shemsu-heru?\""
 POD_mummy_spell_of_life.43.a: "I discovered most of the Spell of Life"
 POD_mummy_spell_of_life.43.b: "I too am a tactician of great repute"
 POD_mummy_spell_of_life.43.c: "Few craftsmen can compare to my work"

 POD_mummy_spell_of_life.44.t: "Audience: Would You Distract?"
 POD_mummy_spell_of_life.44.desc: "$POD_debate_debate_strength_header$\"You carry beliefs and memories separate from the crusade. You carry loyalties beyond the Undying to forces we are unaware of. You may tempt them into your schemes. You could involve us in foreign conflicts, distracting from the critical crusade against Set's get.\n\nOf equal concern, the balance among the Amenti is carefully maintained. Some, the so-called Ishmaelites, have broken from the proper path. However, they still spent many centuries loyal to the war before they became traitors. Your presence in this place of recovery would fracture our carefully-preserved unity of purpose. Ancient rivalries and schisms would be resurrected among the Undying, worsened by your external loyalties. They would turn their blades from the throats of Setites to each others' throats. Such factionalism and distractions would spell disaster.\""
 POD_mummy_spell_of_life.44.a: "I resolve conflicts, not cause them"
 POD_mummy_spell_of_life.44.b: "My loyalty would further stabilize that balance"

 POD_mummy_spell_of_life.45.t: "Audience: Supplicants and Schemers"
 POD_mummy_spell_of_life.45.desc: "$POD_debate_debate_strength_header$\"Let us say that we accept your arguments and allow you to use this realm. You would then tie your Spell of Life to the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]. However, such an action would allow anyone upon whom you cast your Spell of Life to enter our realm in unsustainable numbers, numbers that would strain the balance. Would you always select only the worthy to join our ranks? Seekers, supplicants, schemers will all approach you. Untold numbers of the ambitious will hunt you. Would you grant them all their wishes, whether it be immortality or the Spell itself? Would you show proper discernment when selecting those to gift eternal rebirth? Would you remain a steadfast protector of the spell's secret, or would it be stolen from you when you trust the undeserving? Every new Undying disrupts the Ma'at and must work to restore it. Will you overwhelm the Ma'at by offering eternal rebirth to too many?\""
 POD_mummy_spell_of_life.45.a: "I know how to identify the worthy"
 POD_mummy_spell_of_life.45.b: "I can protect the Spell. What else matters?"

 POD_mummy_spell_of_life.46.t: "Audience: Success"
 POD_mummy_spell_of_life.46.desc: "The Judges turn to each other and seem to have a debate amongst themselves. Despite them not leaving and the fact that you can see their lips moving, you cannot hear them or determine what they are saying based on their lip movements. At one point, Anubis joins their conversation. The ground almost seeming to rumble, though his words are obscured too. Eventually, they turn back towards you.\n\n\"Very well. We will grant you permission to utilize the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] in order to regenerate yourself until your are ready to inhabit your body once more. Anubis will grant you the insights necessary to modify your Spell of Life as necessary.\""
 POD_mummy_spell_of_life.46.a: "I thank you. I shall use it wisely"

 POD_mummy_spell_of_life.47.t: "Audience: Failure"
 POD_mummy_spell_of_life.47.desc: "The Judges turn to each other and seem to have a debate amongst themselves. Despite them not leaving and the fact that you can see their lips moving, you cannot hear them or determine what they are saying based on their lip movements. At one point, Anubis joins their conversation. The ground almost seeming to rumble, though his words are obscured too. Eventually, they turn back towards you.\n\n\"We have considered your words and found them lacking in wisdom. Allowing you to recover in the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] would ensure our eventual doom and that of Ma'at itself. As a kindness, we will permit you to leave in peace with Anubis as your escort. However, should you return, Anubis shall ensure that you do not interrupt us again with your worthless words.\" A predatory smile spreads across Anubis' jackal-like snout, exposing his sharp teeth."
 POD_mummy_spell_of_life.47.a: "Very well, I accept your judgment"
 POD_mummy_spell_of_life.47.b: "You decrepit fools will remember this day when I topple your thrones"
 
 POD_mummy_spell_of_life_stage4_umbra_battles_strengths: "#clickable Your current Military Strength is [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|V0]\nThe [umbra|E] and the #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres'#!#! Military Strength is estimated at [GetPlayer.MakeScope.GetVariable('spectre_shadow_realm_force').GetValue|V0]#!\n\n"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_ADD: "You #P gain#! $VALUE|0V$ Military Strength"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_SUBTRACT: "You #N lose#! $VALUE|0V$ Military Strength"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_ADD: "The [umbra|E] and the #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres#!#! #N gain#! $VALUE|0V$ Military Strength"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_SUBTRACT: "The [umbra|E] and the #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres#!#! #P lose#! $VALUE|0V$ Military Strength"

 POD_mummy_spell_of_life.50.t: "Defeating the Dead"
 POD_mummy_spell_of_life.50.desc: "When [GetScriptedCharacterByHistoryID('792600').GetFirstName] first created his version of Spell of Life, he faced the issue of being unable to enter [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], the Ancient Egyptian realm of the dead where Mummies take the time to reconstitute themselves between each death. As such, he secured a very small portion of the [UmbraGlossary('shadowlands')] that he named \"Hades\" as his own [UmbraGlossary('shadow_realm')] and somehow managed to convince Charon, the leader of the [UmbraGlossaryLocalized('shadowlands','Underworld')], to accept this enclave. Some legends lay the credit at their shared Mycenaean heritage, with one text saying that Cabirus has a connection to the Ferrymen, many of whom are Mycenaean too. Regardless of the truth, [UmbraGlossary('hades')] is still a pitiful copy of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and barely able to help Mummies achieve their true immortality.\n\nIf we are to use [UmbraGlossary('hades')] too, we will need to expand its territory and stabilize it. Considering the difficulty [GetScriptedCharacterByHistoryID('792600').GetFirstName] faced, this will not be an easy task. The [UmbraGlossaryLocalized('shadowlands','Underworld')]'s rulers will need to be satisfied so they do not act against us. The #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres#!#! will need to be pushed back. The new realm will require defenders. So much to do...\n\n #R This battle uses a score named Military Strength. This score starts by looking at you your champions', and your [coterie|E]'s prowess. It will be raised or decreased during the conflict itself.\nYour starting Military Strength is [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 POD_mummy_spell_of_life.50.a: "It is time to begin"
 POD_mummy_spell_of_life.50.b: "This is too risky"
 POD_mummy_spell_of_life_hades_start_battle_tt: "The [umbra|E] and the #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres'#!#! Military Strength is #italic estimated #! at #V 1200#!"

 POD_mummy_spell_of_life.51.t: "Sweet Talking"
 POD_mummy_spell_of_life.51.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Somehow, Cabirus convinced Charon to permit an enclave. No one is certain how he achieved this. Thankfully, you do not need to convince him as an enclave has already been established. You need to speak with a local ruler to allow the expansion of [UmbraGlossary('hades')]. Marshals oversee and coordinate the patrols in a region so will be the ones to encounter [UmbraGlossary('hades')]. The Inspectors and Ministers direct the administrative portions of the local bureaucracy. However, all of them lack the authority to authorize the expansion. Meeting with the local Council of Anacreons is your best chance to convince those with sufficient power to guarantee the matter.\n\nWith the aid of Cabirus and your allied wraiths, you are able to reach the nearest necropolis and begin filling out the forms to request an audience. The forms and procedures take days to complete. Then, the clerk hands you a number that will be called when it is time for your audience. The number is 10,712,461.\n\nAfter weeks of waiting, you are brought before the Council and begin to present your case."
 POD_mummy_spell_of_life.51.a: "To begin, I will explain why..."
 POD_mummy_spell_of_life.51.b: "I believe that we can come to an agreement"
 POD_mummy_spell_of_life.51.effect.success.critical.desc: "They'll aid us!"
 POD_mummy_spell_of_life.51.effect.success.desc: "Convinced!"
 POD_mummy_spell_of_life.51.critical.failure.effect.desc: "Stubborn fools..."

 POD_mummy_spell_of_life.52.t: "Acquiring Local Help"
 POD_mummy_spell_of_life.52.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$When a wraith dies, they enter the underworld covered in a plasmic cocoon called a caul. The caul keeps them docile until it is removed. While the caul is present, they remain in a placid, dreamlike state and generally unaware of their surroundings. During this period, they are extremely vulnerable to attacks, modification, enslavement, moliation, or soulforging. The caul can only be removed by another wraith, but we lack reapers of Stygia or Anubis' aid. Cabirus did find one willing wraith that has been responsible for removing cauls since then. However, this is insufficient to handle the influx of mummies you may introduce. This necessitates a large group of permanent residents in [UmbraGlossary('hades')] to remove cauls.\n\nUnfortunately, wraiths have a strange economy. They trade soulforged goods, soulfire crystals, liquid pathos, powdered angst, relics, Stygian paper, [UmbraGlossary('sunless_sea')] plasm, death ore, and similar items. None of these items could be efficiently and consistently obtained to pay any wraiths. We will need to find some way of obtaining and retaining their service."
 POD_mummy_spell_of_life.52.a: "My bound wraiths will suffice"
 POD_mummy_spell_of_life.52.b: "My research shall find the solution"
 POD_mummy_spell_of_life.52.c: "We shall come to an arrangement"
 POD_mummy_spell_of_life.52.effect.success.desc: "Convinced!"
 POD_mummy_spell_of_life.52.critical.failure.effect.desc: "Barely enough, but it'll suffice..."

 POD_mummy_spell_of_life.53.t: "Cutting Yourself Off"
 POD_mummy_spell_of_life.53.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The ancient records indicate that [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and the [UmbraGlossaryLocalized('shadowlands','Underworld')] were trapped in a war for countless decades or centuries, only ending when Anubis negotiated a treaty. Before that treaty, while [UmbraGlossary('neter_khertet')] fell quickly, the smaller and less numerous inhabitants of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] still managed to hold their ground. If you replicate some of their defenses, you should be able to withstand any assaults from spectres. Even if the Anacreons revert their decision, you could survive until the problem was resolved.\n\nOne of their greatest feats was to cut [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] off from the rest of the [UmbraGlossaryLocalized('shadowlands','Underworld')]. It was no longer a simple location within a larger realm. Rather, it became a separate realm, only accessible via carefully maintained and controlled paths. Mimicking such a system would allow you to restrict access to [UmbraGlossary('hades')], limiting the threat posed by external forces. However, this would not be easy, cheap, or even possible to accomplish. After all, it was only previously done by Osiris, a vampire of immense power that somehow ascended beyond his vampiric nature, and Anubis, a wraith that exhibited a greater understanding of the [umbra|E]'s nature than the Ferrymen."
 POD_mummy_spell_of_life.53.a: "I will do it myself"
 POD_mummy_spell_of_life.53.b: "Surely there is an affordable option"
 POD_mummy_spell_of_life.53.c: "Cost isn't a problem"
 POD_mummy_spell_of_life.53.d: "This is a fool's quest"
 POD_mummy_spell_of_life.53.effect.success.desc: "It worked!"
 POD_mummy_spell_of_life.53.critical.failure.effect.desc: "We are secure but not cut off..."

 POD_mummy_spell_of_life.54.t: "A Tireless Horde"
 POD_mummy_spell_of_life.54.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The ancient records indicate that [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and the [UmbraGlossaryLocalized('shadowlands','Underworld')] were trapped in a war for countless decades or centuries, only ending when Anubis negotiated a treaty. Before that treaty, while [UmbraGlossary('neter_khertet')] fell quickly, the smaller and less numerous inhabitants of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] still managed to hold their ground. If you replicate some of their defenses, you should be able to withstand any assaults from spectres. Even if the Anacreons revert their decision, you could survive until the problem was resolved.\n\n[UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]'s army consisted of vast legions of Ushabti. These animated statues served as a tireless workforce in peace time and a relentless force in war. Carefully chosen words of power, inscribed into their bodies, empowered these otherwise-common constructs of wood, metal, and stone. We could build constructs of our own or bind wraiths to establish a similar defensive force. If we are fortunate, you will gain enough to serve as more than simple guardians."
 POD_mummy_spell_of_life.54.a: "Call the craftsmen"
 POD_mummy_spell_of_life.54.b: "Acquire superior crafting materials"
 POD_mummy_spell_of_life.54.c: "Prepare the psychics"
 POD_mummy_spell_of_life.54.effect.success.desc: "Behold my army!"
 POD_mummy_spell_of_life.54.critical.failure.effect.desc: "Barely enough..."
 POD_mummy_spell_of_life_bound_wraith_strength_bonus: "Gain strength for each bound wraith"

 POD_mummy_spell_of_life.55.t: "Maintaining the Memories"
 POD_mummy_spell_of_life.55.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The [UmbraGlossaryLocalized('shadowlands','Underworld')] is a realm of memories. Relics and places fade as they are forgotten. As the Greek afterlife and underworld, [UmbraGlossary('hades')] is inextricably linked with the Greek religion. With the rise of Christianity and the decline of Hellenistic culture, [UmbraGlossary('hades')] has declined with it. This has greatly contributed to the [UmbraGlossary('shadow_realm')]'s general decline and instability.\n\nTo our good fortune, Christianity uses the Greek word \"Hades\" to refer to a temporary holding area for souls, both good and bad, while awaiting judgment. Of the 3 portions of the Christian Hades, one recess is sometimes referred to as Tartarus. If you could strengthen that connection, you could establish [UmbraGlossary('hades')] in the minds of mortals and thereby stabilize it so long as Christianity remains in the popular consciousness. Unfortunately, such an action would weaken our ties to our Greek heritage."
 POD_mummy_spell_of_life.55.a: "Speak with the priests"
 POD_mummy_spell_of_life.55.b: "We shall revive Hellenistic culture"

 POD_mummy_spell_of_life.56.t: "Raiding Parties"
 POD_mummy_spell_of_life.56.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The time has come. [UmbraGlossary('hades')]' current borders have been secured and stabilized as best we could. Your forces stand ready to march forth and push back the spectre hordes. Your wraiths are prepared to claim the territory and retrieve our souls when the time comes. Your soldiers are assembled to hold the territory once captured.\n\n[UmbraGlossary('hades')] has always existed in an isolated area of the [UmbraGlossaryLocalized('shadowlands','Underworld')], allowing spectres to run rampant beyond its borders. Before the assault begins, the option exists to send out raiding parties to harry them. If it worked, the raids would thin their numbers and make the upcoming conflict easier. However, such raids would carry great risks."
 POD_mummy_spell_of_life.56.a: "Approach them from the left to..."
 POD_mummy_spell_of_life.56.b: "Some of you may die..."
 POD_mummy_spell_of_life.56.c: "It isn't worth the risk"
 POD_mummy_spell_of_life.56.effect.success.desc: "Their numbers are thinned, my lord"
 POD_mummy_spell_of_life.56.critical.failure.effect.desc: "The full company was lost, my lord"

 POD_mummy_spell_of_life.57.t: "Battle is Joined"
 POD_mummy_spell_of_life.57.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$This is the last battle. If your Military Strength is lower than the forces opposing you by the end, your road will end here.#!\n\nYou lead your forces out of the protected enclave of [UmbraGlossary('hades')]. An endless horde of spectres await you, seeming to constantly push against the defenses you erected. Their pale, elongated forms immediately sense your emergence and begin swarming towards your army. The concentrated presence of Oblivion-taint is a tangible reek, polluting the air. The vast majority are skeletal figures with claws to rip flesh or icy black fires burning in their eyes. A few child-size beasts run between legs, cackling maddly. Feral, bestial monsters with multiple rows of shark teeth and torn-apart masses of tissue hanging from misshapen skeletons march among the front ranks. Their lust, hate, and passion is readily visible, almost seeming to emanate from their hulking forms. All of them are eager to taste the blood of the living, steal some shred of that vitality, and cause pain and destruction. Despite that thirst, they act in concert, as a single mass, rather than rushing ahead. A few beings with patchy, seeping lesions and tumors drive them forward in organized formations according to some hidden plan.\n\nWhile they are being commanded and focused, these common spectres are not independently intelligent or capable of strategic response to quick action. If you can get the time and space to maneuver, a well-timed push could disrupt the horde and allow your forces to overwhelm a portion of them. Alternatively, your reserves, who mainly stayed in the mortal world so far, could be called upon. While they would serve as little more than cannon fodder, this could still make a difference."
 POD_mummy_spell_of_life.57.a: "We can't stop now! FORWARD!"
 POD_mummy_spell_of_life.57.b: "Summon our reserves! Every last one of them!"
 
 POD_mummy_spell_of_life.58.t: "Saint of the Shadow-eaten"
 POD_mummy_spell_of_life.58.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The horde is beginning to weaken. Gaps are opening up in their lines, allowing you to push ever deeper into their formations. Only one obstacle stands in the way of expanding [UmbraGlossary('hades')], the spectre's leader.\n\nAfter chopping through innumerable spectres, you see a human with a mask patterned after the Greek mask of tragedy. They are dressed in ragged black robes spotted by leprous white patches and holding a shattered scythe. Tarnished and barbed spikes protrude through the robes with a viscous, black liquid slowly dripping off and splattering against the ground where it seems to sizzle. Protecting them are multiple gaping maws and wicked claws held together by a tangle of sinews and taught skin. Translucent tentacles emerge from some of their tumorous masses of flesh, whipping around and killing any spectres that get too close, reflecting their barely-contained violence. You and your allies close in for what will be a grand confrontation\n\nEvery strike from the scythe-bearer is precise, and their blows fall upon your forces as inevitably as entropy. Each soldier struck seems to disassemble into a homogeneous blob of carbon, some metals, and a slowly expanding cloud of gases though even those quickly decompose into their invisible components before those too are annihilated in full. This is in sharp contrast to the monstrosities whose ground-shattering punches rain down around you. Each blow covers the repositioning of their master, allowing for more complex strategies. While plenty of emotions are exhibited by the beasts, none of those emotions are granting you insights to read or weaknesses to exploit. You manage to knock off the mask, but that provides little help. The blackened, eyeless, mouthless face of this living shadow reveals little, beyond the inevitable embrace of all things in the arms of the Void.\n\nEven as your forces sweep around you and begin to overtake the spectre horde, there is little doubt that this will be a fight for your existence, one that will push you to your limits. Should it win, the battle will turn against your army, and there will be little hope of success."
 POD_mummy_spell_of_life.58.a: "No turning back..."  # straight check
 POD_mummy_spell_of_life.58.b: "Charge!"  # all MaA destroyed
 POD_mummy_spell_of_life.58.c: "Even if it costs my mind!"  # all MaA destroyed, lifestyle XP penalty
 POD_mummy_spell_of_life.58.d: "No matter the cost!"  # all MaA destroyed, lifestyle XP penalty, in debt
 POD_mummy_spell_of_life.58.effect.success.desc: "They all fall down..."
 POD_mummy_spell_of_life.58.effect.failure.desc: "The Void's sweet nothingness..."
 POD_mummy_spell_of_life.58.final_check: "Will compare your Military Strength to that of the spectres' to determine the final results"
 POD_mummy_spell_of_life.58.critical.failure.effect.desc: "The lone and level sands stretch far away..."  # reference to Ozymandius

 POD_mummy_spell_of_life.59.t: "Victory at Long Last"
 POD_mummy_spell_of_life.59.desc: "After hours (?) of fighting, you finally finish off the last of the beasts and force the scythe-bearer on to the back foot. Then, all within the span of barely more than a blink, its body begins to shift and fuzz and distort and pucker and fold until it simply... disappears. As you catch your breath, a calming gesture if nothing else, you take a moment to glance around. You witness as the last of the spectres are cut down. Your soldiers are already beginning to set up defenses and fortifications to hold the territory until your people can properly secure it.\n\nA few days later, you watch as the new borders of [UmbraGlossary('hades')] stabilize before you. Its borders come into focus, pushing back the ever-present soul-storms and claiming the land in full. Wraiths stand ready to collect and aid any mummies that may journey here. With this complete, it is time to return home and finish the last portion of the Spell of Life."
 POD_mummy_spell_of_life.59.a: "That rune fits in there, now I just need to..."




 POD_mummy_spell_of_life.60.t: "Defeating the Dead"
 POD_mummy_spell_of_life.60.desc: "When [GetScriptedCharacterByHistoryID('792600').GetFirstName] first created his version of Spell of Life, he faced the issue of being unable to enter [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], the Ancient Egyptian realm of the dead where Mummies take the time to reconstitute themselves between each death. As such, he secured a very small portion of the [UmbraGlossary('shadowlands')] that he named \"Hades\" as his own [UmbraGlossary('shadow_realm')] and somehow managed to convince Charon, the leader of the [UmbraGlossaryLocalized('shadowlands','Underworld')], to accept this enclave. Even still, [UmbraGlossary('hades')] is still a pitiful copy of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')].\n\nDespite its flaws, you will need to replicate Cabirus' feat of creating a new [UmbraGlossary('shadow_realm')]. Considering the difficulty Cabirus faced, this will not be an easy task. You lack such a connection with Charon to receive authorization so the Stygian government will need to be bypassed or placated to ensure they do not act against us. The #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres#!#! will need to be pushed back. Spells must be prepared to claim and hold the territory. The new realm will require defenders. Annoyingly, you have to establish yourself before the Stygian bureaucracy discovers your presence and recovers enough to attack. In addition, your mere presence will attract ever-greater hordes of spectres until the job is complete so any delays will make the final battle harder. So much to do, so little time...\n\n #R This battle uses a score named Military Strength. This score starts by looking at you your champions', and your [coterie|E]'s prowess. It will be raised or decreased during the conflict itself.\nYour starting Military Strength is [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.60.desc.b: "When [GetScriptedCharacterByHistoryID('792600').GetFirstName] first created his version of Spell of Life, he faced the issue of being unable to enter [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], the Ancient Egyptian realm of the dead where Mummies take the time to reconstitute themselves between each death. As such, he secured a very small portion of the [UmbraGlossary('shadowlands')] that he named \"Hades\" as his own [UmbraGlossary('shadow_realm')] and somehow managed to convince Charon, the leader of the [UmbraGlossaryLocalized('shadowlands','Underworld')], to accept this enclave. Even still, [UmbraGlossary('hades')] is still a pitiful copy of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')].\n\nDespite its flaws, you will need to replicate Cabirus' feat of creating a new [UmbraGlossary('shadow_realm')]. Considering the difficulty Cabirus faced, this will not be an easy task. You lack such a connection with Charon to receive authorization so the Stygian government will need to be bypassed or placated to ensure they do not act against us. The #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres#!#! will need to be pushed back. Due to the recent Great Maelstrom, they are particularly plentiful, though Stygia's distraction may aid us. Spells must be prepared to claim and hold the territory. The new realm will require defenders. Annoyingly, you have to establish yourself before the Stygian bureaucracy discovers your presence and recovers enough to attack. In addition, your mere presence will attract ever-greater hordes of spectres until the job is complete so any delays will make the final battle harder. So much to do, so little time...\n\n #R This battle uses a score named Military Strength. This score starts by looking at you your champions', and your [coterie|E]'s prowess. It will be raised or decreased during the conflict itself.\nYour starting Military Strength is [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 POD_mummy_spell_of_life.60.a: "It is time to begin"
 POD_mummy_spell_of_life.60.b: "This is too risky"
 POD_mummy_spell_of_life_independent_start_battle_tt: "The [umbra|E] and the #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres'#!#! Military Strength is #italic estimated #! at #V 1800#!"

 POD_mummy_spell_of_life.61.t: "Night Watch"
 POD_mummy_spell_of_life.61.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$You are preparing your departure into the [umbra|E]. However, you would be a fool to think that your efforts, even if successful, will be quick, and you will not be able to return for even a short time as such projects cannot be halted until they are completed. Wraiths that oppose your plan may enter the [Glossary('Skinlands','game_concept_skinlands_desc')] to threaten your realm. Far more problematic, your rivals, enemies, and disloyal vassals will surely come crashing down on your forces. Some will seek your research into the Spell of Life while others will simply seek to usurp you in your absence. Such attacks would cut off communication and supply lines, trapping you in the [UmbraGlossaryLocalized('shadowlands','Underworld')] and preventing you from acquiring aid.\n\nThis leaves you two options. You could leave and hope that you realm will endure without your direct supervision. Alternatively, you could station a portion of your forces here to guard the home front, knowing full well that they will be missed on the other side."
 POD_mummy_spell_of_life.61.a: "My realm is strong."
 POD_mummy_spell_of_life.61.b: "Our rear must be secure."
 POD_mummy_spell_of_life.61.effect.success.desc: "We stand together!"
 POD_mummy_spell_of_life.61.critical.failure.effect.desc: "Do we stand together?"

 POD_mummy_spell_of_life.62.t: "Regional Underworlds"
 POD_mummy_spell_of_life.62.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Your extensive research has presented an interesting opportunity. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] was built within [UmbraGlossary('neter_khertet')], the old Egyptian Underworld. [Glossary('Kakuri','podgloss.kakuri')] was the Ainu Underworld before [Glossary('Emma-O','podgloss.emmao')], once the guardian of the Ainu dead, transformed it into a [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] befitting a [Glossary('Yama King','podgloss.yamaking')]. These precedents indicate that regional underworlds have great potential as toeholds for larger endeavors. They are comparatively free of spectres and can draw from local belief to provide a degree of stability. In addition, their tenders, caretakers, and guardians would supplement our own efforts.\n\nWhile the predominance of Christianity has eliminated most such realms, some still remain. Stygia may lay claim to all western underworlds, but [UmbraGlossary('umi')] similarly claims the entire Pacific and has never managed to squash all of the independent spirit realms. Your mad quest to form an independent [UmbraGlossary('shadow_realm')] will fail if you do not locate a regional underworld and properly secure it. As such, the only question is how long it will take."
 POD_mummy_spell_of_life.62.a: "Search our records!"
 POD_mummy_spell_of_life.62.b: "Recruit more librarians to aid me"
 POD_mummy_spell_of_life.62.effect.success.desc: "Found it!"
 POD_mummy_spell_of_life.62.critical.failure.effect.desc: "So many delays..."

 POD_mummy_spell_of_life.620.t: "Gods of Death"
 POD_mummy_spell_of_life.620.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$When a wraith dies, they enter the underworld covered in a plasmic cocoon called a caul. The caul keeps them docile until it is removed. While the caul is present, they remain in a placid, dreamlike state and generally unaware of their surroundings. During this period, they are extremely vulnerable to attacks, modification, enslavement, moliation, or soulforging. The caul can only be removed by another wraith, but we lack reapers of Stygia or Anubis' aid.\n\nThe regional underworld that you will be using presents an interesting opportunity: our own Anubis. Such a realm would already contain many permanent residents and would have a god of death managing and guarding it. They could collect mummies that have just journeyed here and supplement your defensive efforts. However, their loyalty lies with their own people so you will need to sway them to your side. It will not be easy as they may view you as an invading force, little better than Stygia's overbearing bureaucracy. One thing that may help your case is that you do not need their entire realm, at least initially."
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.620.desc.b: "$POD_mummy_spell_of_life.620.desc$ Another aid is the chaos caused by a recent Great Maelstrom. The influx of spectres will make them more desperate for your support."
 POD_mummy_spell_of_life.620.a: "We offer protection for a small region"
 POD_mummy_spell_of_life.620.effect.success.desc: "They agree"
 POD_mummy_spell_of_life.620.critical.failure.effect.desc: "So many delays..."

 POD_mummy_spell_of_life.63.t: "Fishing for Chaos"
 POD_mummy_spell_of_life.63.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The ancient records indicate that [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and Stygia were trapped in a war for countless decades or centuries. [UmbraGlossary('neter_khertet')] fell quickly, and the war only ended when Anubis gave an incredible gift to the Ferrymen.\n\nThat was long ago, and Stygia has only become more calcified. Beyond a shadow of doubt, Stygia will not permit the creation of a new [UmbraGlossary('shadow_realm')] nor the independence of a subordinate underworld. They may send their own forces against you or further provoke the spectres against you. Either way, their interference will greatly complicate matters. However, for Stygia to act against you, they would need to detect your actions in time to interfere and have the forces to act.\n\nThis is an interesting opportunity to weaken both potential enemies. If you find a spectre 'bait', you could arrange for them to assault the nearby Necropoli. However, if your agent is caught, it could tip your hand, and they could turn against you."
 POD_mummy_spell_of_life.63.a: "Prepare the lure and find me a wraith to cast it"
 POD_mummy_spell_of_life.63.b: "We'll worsen the Great Maelstrom's chaos"
 POD_mummy_spell_of_life.63.effect.success.desc: "Your agent escapes, unsuspected"
 POD_mummy_spell_of_life.63.critical.failure.effect.desc: "Your agent is caught"

 POD_mummy_spell_of_life.630.t: "Greasing Palms"
 POD_mummy_spell_of_life.630.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$While the nearby Necropoli and Stygian bureaucrats may be distracted, they still pose a threat. Your actions are illegal and will never be permitted publicly. However, their deaths have not made these wraiths incorruptible. Marshals oversee and coordinate the patrols in a region so will be the ones to encounter you. The Inspectors and Ministers direct the administrative portions of the local bureaucracy and manage the intelligence networks. A well-placed bribe will ensure that patrols are redirected around your territory to delay official discovery. More bribes will ensure the initial attacks against us are token efforts\n\nNow, for such a service, the cost will be high. Wraiths have a strange economy. They trade soulforged goods, soulfire crystals, liquid pathos, powdered angst, Stygian paper, [UmbraGlossary('sunless_sea')] plasm, death ore, and similar items, but those items are unattainable or not worth enough. Relics, memories given shape when it crossed the Shroud, are the perfect option. They do not break, replace expendable features, are untraceable to us, and can easily be bartered for other desired items.\n\nIf you have the ability, you might be able to make some. The Tithe of the Dead makes it clear that relics can sometimes be created from items pressed into the eyes of the dead, even if they were not Greek and did not practice the Greek religion. Some magics may remove the uncertainty of that process or even remove the need for sacrifices."
 POD_mummy_spell_of_life.630.a: "Effigies can pierce the Shroud"
 POD_mummy_spell_of_life.630.b: "Give it to the prisoners... then, execute them"
 POD_mummy_spell_of_life.630.c: "Fetch the prisoners and prepare the ritual"
 POD_mummy_spell_of_life.630.d: "Where's that psychic of mine?"
 POD_mummy_spell_of_life.630.e: "Summon a psychic to my court"

 POD_mummy_spell_of_life.64.t: "Cutting Yourself Off"
 POD_mummy_spell_of_life.64.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The ancient records indicate that [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and Stygia were trapped in a war for countless decades or centuries. [UmbraGlossary('neter_khertet')] fell quickly, and the war only ended when Anubis gave an incredible gift to the Ferrymen. If you replicate some of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]'s defenses, you should be able to withstand any assaults from spectres. Even when Stygia inevitably takes notice of you, you could survive until the problem was resolved.\n\nOne of their greatest feats was to cut [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] off from the rest of the [UmbraGlossaryLocalized('shadowlands','Underworld')]. It was no longer a simple location within a larger realm. Rather, it became a separate realm, only accessible via carefully maintained and controlled paths. Mimicking such a system would allow you to restrict access to your new [UmbraGlossary('shadow_realm')], limiting the threat posed by external forces. However, this would not be easy, cheap, or even possible to accomplish. After all, it was only previously done by Osiris, a vampire of immense power that somehow ascended beyond his vampiric nature, and Anubis, a wraith that exhibited a greater understanding of the [umbra|E]'s nature than the Ferrymen."
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.64.desc.b: "$POD_mummy_spell_of_life.64.desc$Thankfully, the recent Great Maelstrom has slightly weakened the [umbra|E] and made tampering with it easier than normal."
 POD_mummy_spell_of_life.64.a: "I will do it myself"
 POD_mummy_spell_of_life.64.b: "Surely there is an affordable option"
 POD_mummy_spell_of_life.64.c: "Cost isn't a problem"
 POD_mummy_spell_of_life.64.d: "This is a fool's quest"
 POD_mummy_spell_of_life.64.effect.success.desc: "You float free in a sunless sea..."
 POD_mummy_spell_of_life.64.critical.failure.effect.desc: "Tethered to reality..."

 POD_mummy_spell_of_life.640.t: "A Tireless Horde"
 POD_mummy_spell_of_life.640.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The ancient records indicate that [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and Stygia were trapped in a war for countless decades or centuries. [UmbraGlossary('neter_khertet')] fell quickly, and the war only ended when Anubis gave an incredible gift to the Ferrymen. If you replicate some of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]'s defenses, you should be able to withstand any assaults from spectres. Even when Stygia inevitably takes notice of you, you could survive until the problem was resolved.\n\n[UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]'s army consisted of vast legions of Ushabti. These animated statues served as a tireless workforce in peace time and a relentless force in war. Carefully chosen words of power, inscribed into their bodies, empowered these otherwise-common constructs of wood, metal, and stone. We could build constructs of our own or bind wraiths to establish a similar defensive force. If we are fortunate, you will gain enough to serve as more than simple guardians."
 POD_mummy_spell_of_life.640.a: "Call the craftsmen"
 POD_mummy_spell_of_life.640.b: "Acquire superior crafting materials"
 POD_mummy_spell_of_life.640.c: "Prepare the psychics"
 POD_mummy_spell_of_life.640.effect.success.desc: "Behold my army!"
 POD_mummy_spell_of_life.640.critical.failure.effect.desc: "Barely enough..."

 POD_mummy_spell_of_life.65.t: "Gone but not Forgotten"
 POD_mummy_spell_of_life.65.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The [UmbraGlossaryLocalized('shadowlands','Underworld')] collects souls across the centuries and millennia. In particular, those with unfinished business or violent ends tend to become wraiths. It is a safe bet that some of your former champions and allies are among their numbers. If recruited, they would be loyal and powerful helpers. Their aid would be invaluable to supplement your forces in the upcoming battle and to care for your [UmbraGlossary('shadow_realm')] in the future. However, there is little doubt that their minds and corpuses would be severely weakened. It would take valuable time to locate and restore them."
 POD_mummy_spell_of_life.65.a: "Remember who you were..."
 POD_mummy_spell_of_life.65.b: "It isn't worth the time"
 POD_mummy_spell_of_life.65.effect.success.desc: "Welcome back"
 POD_mummy_spell_of_life.65.critical.failure.effect.desc: "A waste of time..."

 POD_mummy_spell_of_life.66.t: "Raiding Parties"
 POD_mummy_spell_of_life.66.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The time has come. Your forces stand ready to march forth and push back the spectre hordes. Your wraiths are prepared to claim the territory and retrieve our souls when the time comes. The native god of death has added his strength to your own magicks. Your soldiers are assembled to hold the territory once captured.\n\nSelected for its distance from any center of Stygian power, your chosen underworld has always existed in an isolated area, allowing spectres to run rampant beyond its borders. Before the assault begins, the option exists to send out raiding parties to harry them. If it worked, the raids would thin their numbers and make the upcoming conflict easier. However, such raids would carry great risks."
 POD_mummy_spell_of_life.66.a: "First, you'll need to..."
 POD_mummy_spell_of_life.66.b: "Some of you may die..."
 POD_mummy_spell_of_life.66.c: "It isn't worth the risk"
 POD_mummy_spell_of_life.66.effect.success.desc: "Their numbers are thinned, my lord"
 POD_mummy_spell_of_life.66.critical.failure.effect.desc: "The full company was lost, my lord"

 POD_mummy_spell_of_life.67.t: "Battle is Joined"
 POD_mummy_spell_of_life.67.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$This is the last battle. If your Military Strength is lower than the forces opposing you by the end, your road will end here.#!\n\nYou lead your forces out of the protected enclave of your chosen underworld. An endless horde of spectres await you, seeming to constantly push against the defenses you erected. Their pale, elongated forms immediately sense your emergence and begin swarming towards your army. The concentrated presence of Oblivion-taint is a tangible reek, polluting the air. The vast majority are skeletal figures with claws to rip flesh or icy black fires burning in their eyes. A few child-size beasts run between legs, cackling maddly. Feral, bestial monsters with multiple rows of shark teeth and torn-apart masses of tissue hanging from misshapen skeletons march among the front ranks. Their lust, hate, and passion is readily visible, almost seeming to emanate from their hulking forms. All of them are eager to taste the blood of the living, steal some shred of that vitality, and cause pain and destruction. Despite that thirst, they act in concert, as a single mass, rather than rushing ahead. A few beings with patchy, seeping lesions and tumors drive them forward in organized formations according to some hidden plan.\n\nWhile they are being commanded and focused, these common spectres are not independently intelligent or capable of strategic response to quick action. If you can get the time and space to maneuver, a well-timed push could disrupt the horde and allow your forces to overwhelm a portion of them. Alternatively, your reserves, who mainly stayed in the mortal world so far, could be called upon. While they would serve as little more than cannon fodder, this could still make a difference."
 POD_mummy_spell_of_life.67.a: "We can't stop now! FORWARD!"
 POD_mummy_spell_of_life.67.b: "Summon our reserves! Every last one of them!"
 POD_mummy_spell_of_life.67.critical.failure.effect.desc: "The lone and level sands stretch far away..."
 
 POD_mummy_spell_of_life.670.t: "Saint of the Shadow-eaten"
 POD_mummy_spell_of_life.670.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The horde is beginning to weaken. Gaps are opening up in their lines, allowing you to push ever deeper into their formations. Only one obstacle stands in the way of creating a [UmbraGlossary('shadow_realm')], the spectre's leader.\n\nAfter chopping through innumerable spectres, you see a human with a mask patterned after the Greek mask of tragedy. They are dressed in ragged black robes spotted by leprous white patches and holding a shattered scythe. Tarnished and barbed spikes protrude through the robes with a viscous, black liquid slowly dripping off and splattering against the ground where it seems to sizzle. Protecting them are multiple gaping maws and wicked claws held together by a tangle of sinews and taught skin. Translucent tentacles emerge from some of their tumorous masses of flesh, whipping around and killing any spectres that get too close, reflecting their barely-contained violence. You and your allies close in for what will be a grand confrontation\n\nEvery strike from the scythe-bearer is precise, and their blows fall upon your forces as inevitably as entropy. Each soldier struck seems to disassemble into a homogenous blob of carbon, some metals, and a slowly expanding cloud of gases though even those quickly decompose into their invisible components before those too are annihilated in full. This is in sharp contrast to the monstrosities whose ground-shattering punches rain down around you. Each blow covers the repositioning of their master, allowing for more complex strategies. While plenty of emotions are exhibited by the beasts, none of those emotions are granting you insights to read or weaknesses to exploit. You manage to knock off the mask, but it that provides little help. The blackened, eyeless, mouthless face of this living shadow reveals little, beyond the inevitable embrace of all things in the arms of the Void.\n\nEven as your forces sweep around you and begin to overtake the spectre horde, there is little doubt that this will be a fight for your existence, one that will push you to your limits."
 POD_mummy_spell_of_life.670.a: "No turning back..."  # straight check
 POD_mummy_spell_of_life.670.b: "Charge!"  # all MaA destroyed
 POD_mummy_spell_of_life.670.c: "Even if it costs my mind!"  # all MaA destroyed, lifestyle XP penalty
 POD_mummy_spell_of_life.670.d: "No matter the cost!"  # all MaA destroyed, lifestyle XP penalty, in debt
 POD_mummy_spell_of_life.670.effect.success.desc: "They all fall down..."
 POD_mummy_spell_of_life.670.effect.failure.desc: "The Void's sweet nothingness..."
 POD_mummy_spell_of_life.670.final_check: "Will compare your Military Strength to that of the spectres' to determine the final results"
 POD_mummy_spell_of_life.670.critical.failure.effect.desc: "The lone and level sands stretch far away..."  # reference to Ozymandius

 POD_mummy_spell_of_life.68.t: "Victory at Long Last"
 POD_mummy_spell_of_life.68.desc: "After hours (?) of fighting, you finally finish off the last of the beasts and force the scythe-bearer on to the back foot. Then, all within the span of barely more than a blink, its body begins to shift and fuzz and distort and pucker and fold until it simply... disappears. As you catch your breath, a calming gesture if nothing else, you take a moment to glance around. You witness as the last of the spectres are cut down. Your soldiers are already beginning to set up defenses and fortifications to hold the territory until your people can properly secure it.\n\nA few days later, you watch as the new borders of your personal [UmbraGlossary('shadow_realm')] stabilize before you. Its borders come into focus, pushing back the ever-present soul-storms and claiming the land in full. Wraiths stand ready to collect and aid any mummies that may journey here. With this complete, it is time to return home and finish the last portion of the Spell of Life."
 POD_mummy_spell_of_life.68.a: "That rune fits in there, now I just need to..."

 POD_mummy_spell_of_life.610.t: "A Living Nightmare"
 POD_mummy_spell_of_life.610.desc: "After hours (?) of fighting, you finally finish off the last of the beasts and force the scythe-bearer on to the back foot. Then, all within the span of barely more than a blink, its body begins to shift and fuzz and distort and pucker and fold until it simply... disappears. As you catch your breath, a calming gesture if nothing else, you take a moment to glance around. You witness as the last of the spectres are cut down. Your soldiers are already beginning to set up defenses and fortifications to hold the territory until your people can properly secure it.\n\nA few days later, you can feel as your new [UmbraGlossary('shadow_realm')] stabilizes around you. Its borders come into focus, pushing back the ever-present soul-storms. With this complete, it is time to return home.\n\nUnfortunately, your prolonged absence and presumed death or weakening has unleashed the factions within your own court while your rivals make plays for your territory. The entire realm is in chaos as the various forces all attempt to come out on top. Worse still, all of them have the same idea that eliminating you now, while you remain weakened, would give them the strongest claim to whatever remains after this maelstrom of violence finally ceases. In one final conflict, your battered army must find the strength or charisma to pull together whatever loyalist remnants there may be and remind these fools why that throne was yours to begin with. Only then will you have the time to finish the Spell of Life."
 POD_mummy_spell_of_life.610.a: "My people remain steadfast and loyal"
 POD_mummy_spell_of_life.610.b: "My agents know the loyal and can kill the rest"
 POD_mummy_spell_of_life.610.c: "My tactical genius ensures victory in battle"
 POD_mummy_spell_of_life.610.d: "Single combat shall prove the worthy claimant"
 POD_mummy_spell_of_life.610.e: "The people are mine. None can stand against the common tide"
 POD_mummy_spell_of_life.610.f: "You aren't the first in history to attempt this, so I prepared"
 POD_mummy_spell_of_life.610.effect.success.desc: "You reestablish some semblance of order"
 POD_mummy_spell_of_life.610.critical.failure.effect.desc: "Come back here with that! NO! Don't do that!"

 POD_mummy_spell_of_life.70.t: "Horus' Grace"
 # not horus phase 3
 POD_mummy_spell_of_life.70.desc: "You arrive to your audience with Horus. \"Greetings, my lord. I know that you have questioned my actions and motives. You believe that I have violated Tenet 6 of your code. For a long time, I have been pursuing all leads related to the Spell of Life once used to create us, the Shemsu-heru. I gathered various historical and magical records that preserved some details regarding the Spell. I spent time within the [umbra|E] to determine the proper link between a [UmbraGlossary('shadow_realm')] and the Spell of Life. With my research complete, I have obtained most of the surviving records. I intentionally sought alternative sources beyond yourself to ensure that I obtained as broad a collection as possible. Now, I turn it all over to you for destruction and ask that you erase the Spell of Life from my memories.\"\n\nFor a moment, Horus sits there, quietly considering you. \"After the initial attack on your tomb, I considered an unending wave of assaults until you fell before your more-loyal brethren and your research was burnt. I am glad that I decided against such a course as you have redeemed yourself today. I thank you for your service and will gladly destroy these records. However, your actions exhibit a great deal of wisdom. Where so many others have failed, you have demonstrated that you can utilize the Spell of Life responsibly. While I prohibit you from teaching the Spell to others, I will allow you to retain your memories of it and to use as you see fit. You have proven yourself worthy of that consideration. I will even help perfect your Spell of Life. In addition, I will issue an edict among the Shemsu-heru to protect you, safeguarding such a loyal helper in the war against Set and preventing your knowledge from being stolen. Well done, my good and faithful servant.\""
 # horus phase 3 done
 POD_mummy_spell_of_life.70.desc.b: "You arrive to your audience with Horus. \"Greetings, my lord. As you are aware, I have spent a long time pursuing all leads related to the Spell of Life once used to create the Shemsu-heru. With your aid, I sought to understand the Spell. I gathered various historical and magical records that preserved some details regarding the Spell. I spent time within the [umbra|E] to determine the proper link between a [UmbraGlossary('shadow_realm')] and the Spell of Life. With my research complete, I have obtained most of the surviving records. Now, I turn it all over to you for destruction and ask that you erase the Spell of Life from my memories.\"\n\nFor a moment, Horus sits there, quietly considering you. \"While I once questioned the wisdom of permitting your quest, I see now that my decision to aid your work was correct. I thank you for your service and will gladly destroy these records. However, your actions exhibit a great deal of wisdom. Where so many others have failed, you have demonstrated that you can utilize the Spell of Life responsibly. While I prohibit you from teaching the Spell to others, I will allow you to retain your memories of it and to use as you see fit. You have proven yourself worthy of that consideration. I will even help perfect your Spell of Life. In addition, I will issue an edict among the Shemsu-heru to protect you, safeguarding such a loyal helper in the war against Set and preventing your knowledge from being stolen. Well done, my good and faithful servant.\""
 POD_mummy_spell_of_life.70.a: "Thank you, my lord"
 POD_mummy_spell_of_life_cant_teach_spell_of_life: "Can no longer teach the Spell of Life"
 POD_mummy_spell_of_life_make_only_shemsuheru: "If it did not already, your Spell of Life will now make Shemsu-heru"
 blessing_of_horus_modifier: "Blessing of Horus"
 blessing_of_horus_modifier_desc: "As a reward for your great service and loyalty, Horus has blessed you with great power that increases alongside your fervor and loyalty."

 POD_mummy_spell_of_life.71.t: "Set's Herald"
 POD_mummy_spell_of_life.71.desc: "\"Who disturbs my slumber?\"\n\n\"My lord. I come before you to offer the Spell of Life, stolen from Horus' brood.\"\n\n\"You have succeeded where all of my other childer failed. Very well, you shall have a reward.\"\n\n\"Th-thank you, my lord.\"\n\nYou feel a mental tug, then perfect clarity and peace as something new joins you within your mind.\n\n\"While Malkav was a fool for destroying his corporeal body, a lesser form of the bond has its advantages. Your mind is now one with my own so that you may better serve me as my agent. Return to your brethren. Remind them of their purpose, and prepare the way for me. My awakening is near at hand. I shall return at the head of a great host of the Undying to reward my faithful and to damn my enemies.\""
 POD_mummy_spell_of_life.71.a: "I shall proclaim thy name"
 set_mind_control_tooltip: "Your personality shifts as Set's mind overtakes yours"
 herald_of_set_modifier: "Herald of Set"
 # chose to use only a few middle english words to make it feel old-timey but still recognizable
 herald_of_set_modifier_desc: "He that hath ears, let him hear. The coming of our Lorde Set is nigh. All ye unfaithful, tremble and despair."
 sets_herald_tooltip: "All [GetTrait('setite').GetName(GetNullCharacter)]s and worshippers of Set will have a higher chance of accepting vassalization from you."
 recreate_setite_empire_effect_tooltip: "With Set's aid, you recreate the Setite Empire [title|E]." 
 transfer_setite_empire_effect_tooltip: "At Set's command, you take control of the Setite Empire [title|E]."

 POD_mummy_spell_of_life.72.t: "A Final Feast"
 POD_mummy_spell_of_life.72.desc: "You glut yourself on the terror, misery, and agony of your prisoners. As you do, you feel a strange connection through the spirit that fused itself with you. Your knowledge of the Spell of Life flows through your mind and along the connection into your hidden master.\n\nAs the transfer completes, strange vibrations travel through the world as the balance collapses. Pure rage, madness, and malice seep into the mortals throughout the world. Gnawing hunger, greed, and lust fill them. Hopelessness consumes them, driving them to seek satisfaction before the inevitable collapse of everything. Banes merge with the souls of mortals much like you once were, transforming them with the newly-completed Spell of Life. You can sense as a storm without compare sweeps through the [UmbraGlossaryLocalized('shadowlands','Underworld')]. Endless shards of djinn and souls slip through the barrier, allowing you to glut yourself upon them. Holes are torn through the [UmbraGlossary('pod_realm_labyrinth')], allowing spectre armies of incomparable size to issue forth. Ancient children and servants of your master awaken admist the chaos. Your master rises from beneath the [UmbraGlossary('well_of_the_void')], awakening to consume the world itself."
 POD_mummy_spell_of_life.72.a: "Nothing remains but to feast! Feast! FEAST!"


 POD_mummy_spell_of_life.80.t: "A New Name"
 POD_mummy_spell_of_life.80.desc: "With your success, it is time to name your new Dynasty of #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Undying#!#!. The Shemsu-Heru were gifted immortality by Horus and follow his code. The Cabiri were created by Cabirus' Spell of Life. The Apepnu were created by Set's flawed rituals.\n\nWhat do you wish to name those to whom you gift eternal rebirth through your version of the Spell? Perhaps you will name yourselves the Inanna-ene or Baldar, for gods that died and was reborn. Perhaps you will name yourselves for groups that practiced mummification, like the bog mummies or oceanian mummies, or for cursed wanderers. There are many names you could use."
 POD_mummy_spell_of_life.80.a: "Choose this name."
 POD_mummy_spell_of_life.80.b: "Stick with the default name #italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyName')])#!."

 POD_mummy_spell_of_life.81.t: "A New Realm"
 POD_mummy_spell_of_life.81.desc: "With your success, it is time to name your new [UmbraGlossary('shadow_realm')]. Upon their death, the Shemsu-Heru return to [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] until they are reborn. The Cabiri journey to [UmbraGlossary('hades')].\n\nNow that you have carved out your own realm, what do you wish to name this realm where your followers' souls will return to rest between rebirths? Perhaps you will name it Helheim, Sheol, Yomi, Irkalla, Tuonela, the Green Isles, the Abode of Song, the Mountains of the Immortal, Netherrealm, Limbo, the Waiting Room, the Land of Return, or the Halls of Rest. There are many afterlives and names you could use."
 POD_mummy_spell_of_life.81.a: "Choose this name."
 POD_mummy_spell_of_life.81.b: "Stick with the default name #italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyShadowRealm')])#!."

 POD_mummy_spell_of_life.82.t: "A New Path"
 POD_mummy_spell_of_life.82.desc: "With your success, it is time to construct the path that will guide your followers into the future, the code that will govern their actions, the stance that will determine their place in the War for Balance, the land that they will call home. Choose wisely for your words will be inscribed in stone, unchangeable across the ages."
 POD_mummy_spell_of_life.82.a: "Proclaim our new path!"
 POD_mummy_spell_of_life.82.b: "A simpler path will do..."
 POD_mummy_spell_of_life.82.b.tt: "Your new [faith|E] is [GetFaithByKey('custom_mummy_dynasty').GetName] with its current tenets and alignment"
 POD_mummy_spell_of_life.82.b.tt2: "Establish [GetDoctrine('tenet_esotericism').GetBaseName] as the institutional and doctrinal framework"
 POD_mummy_spell_of_life.82.b.tt3: "Establish [GetDoctrine('tenet_reincarnation').GetBaseName] as the tenet governing spiritual practice and devotion"
 POD_mummy_spell_of_life.82.b.tt4: "Establish [GetDoctrine('tenet_preservation').GetBaseName] as the tenet governing holy violence or our more radical beliefs"
 POD_mummy_spell_of_life.82.b.tt5: "Establish [GetDoctrine('doctrine_pluralism_pluralistic').GetBaseName] as our stance on doctrinal flexibility"
 POD_mummy_spell_of_life.82.b.tt6: "Remain uninvolved in the [Glossary('War of Balance','podgloss.warofbalance')]"
 POD_mummy_spell_of_life.82.b.tt7: "Your new [POD_homeland|E] will be [GetGeographicalRegion('world_africa_greater_east').GetName]"
 POD_mummy_spell_of_life.82.framework: "Framework"
 POD_mummy_spell_of_life.82.practice: "Practice"
 POD_mummy_spell_of_life.82.radical: "Radical"
 POD_mummy_spell_of_life.82.flexibility: "Flexibility"
 POD_mummy_spell_of_life.82.alignment: "Alignment"
 POD_can_select_custom_religion_tenet_tt: "[current_location.GetName] is #bold not#! in the [homeland_region.GetName] region #bold AND#! [current_culture.GetName|U] [culture|E] does #bold not#! have a [heritage|E] from that region. Satisfy either requirement to select this [POD_homeland|E]"



 POD_mummy_spell_of_life_journeys.10.t: "Wepauwet's Lessons"
 POD_mummy_spell_of_life_journeys.10.desc: "Wepauwet does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Wepauwet and found him among the swirling sands of Africa. Once, he was one of the Silent Striders' greatest warriors, blood-brother of Shu Horus and diplomat to the Shemsu-heru. He helped lead his people in great battles against the Cult of Sutekh in the lands of Khem. Now, he lives among the ruins of his people in a foreign land, cut off from their ancestor spirits by Set's curse. He sought to cheat the curse through service to Horus, but the spirit Owl punished him for violating Gaia's plan. He is left with trying to preserve his people's history and knowledge with the one, albeit ageless, life he has left. As the only one able to hear the tribe's ancestors, he exists between life and death, guiding his people, communicating with the spirits in their tribal homeland, and trying to resurrect memories of their past glories from the days of Khem.\n\nAmong Wepauwet's knowledge is a few fragments regarding the Spell of Life. However, he is immensely loyal to Horus, who prohibits sharing such details. In addition, his history has left him distrustful of strangers. You will need to convince him to teach you."
 POD_mummy_spell_of_life_journeys.10.a: "As a fellow academic, please teach me"
 POD_mummy_spell_of_life_journeys.10.b: "What if I aid your people?"
 POD_mummy_spell_of_life_journeys.10.c: "Horus has granted me permission"
 POD_mummy_spell_of_life_journeys.10.effect.success.desc: "I prove convincing"
 POD_mummy_spell_of_life_journeys.10.critical.failure.effect.desc: "I fail to sway him"

 POD_mummy_spell_of_life_journeys.11.t: "Milarepa's Lessons"
 POD_mummy_spell_of_life_journeys.11.desc: "Milarepa does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Milarepa and found him among the towering peaks of the Himalayan Mountains. Once, Khetamon was a philosopher and magician in the court of Osiris, embraced to preserve his skills. One of the few of Osiris' progeny to survive the battle at Mestha's far, Khetamon led the Children of Osiris on a spiritual journey into the east, following the footsteps of Osiris' own journey. When Osiris returned, he came with the teachings of Bardo, and so, Khetamon sought the same source of enlightenment. The poet-sorcerer Milarepa, disciple of Khetamon, accompanied his master. Resting in the Himalayas, Milarepa aided the Stargazers, friends of the Silent Striders and the tribe of Milarepa's friend Justinian, to kill a beast called the Nexus Crawler and eventually achieved his own enlightenment, a state called Golconda.\n\nDue to his time working alongside the mystics of the Shemsu-heru and the Cult of Isis, he learned some fragments regarding the Spell of Life. However, his loyalty lies with the forces of Osiris, and he considers many supernatural creatures to be misguided at best. You will need to prove that you meet his ethical, intellectual, and metaphysical standards."
 POD_mummy_spell_of_life_journeys.11.a: "Allow me to meditate alongside you"
 POD_mummy_spell_of_life_journeys.11.b: "Nothing compares to a proper philosophical debate"

 POD_mummy_spell_of_life_journeys.12.t: "Astrokhen's Lessons"
 POD_mummy_spell_of_life_journeys.12.desc: "Astrokhen does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Astrokhen and found him hiding among shifting sands of Africa. Once, Astrokhen was a mage in the lands of Khem who sought immortality. In his arrogance, he ordered Horus to use the Spell of Life on him, which ended poorly. After years of searching, he happened upon the writings of another mage calling himself Hermes. Using all his resources to follow a long-dead trail, Astrokhen eventually found \"Hermes\" who turned out to be Cabirus, a mage that apparently pieced together (or stole) the Spell of Life. When Horus discovered Astrokhen's new immortality, Horus cursed him to forever protect Horus' powerful artifacts and acquire additional artifacts that needed protection. Astrokhen's own love of secrets and hidden knowledge reinforced the curse, ensuring that he spent countless centuries pursuing ancient tomes and concealed powers. Morality was never much of a consideration for him.\n\nAmong these secrets are a few fragments regarding the Spell of Life. Beyond the curse, he lacks any loyalty to Horus. If you satisfy the curse's needs and temporarily relieve his burden, he may be willing to part with a few tidbits of information."
 POD_mummy_spell_of_life_journeys.12.a: "I have quite the collection of my own"
 POD_mummy_spell_of_life_journeys.12.b: "I can fund your efforts"
 POD_mummy_spell_of_life_journeys.12.c: "I refuse to aid such a man"
 POD_mummy_spell_of_life_journeys.12.effect.success.desc: "You defeat Astrokhen and raid his vaults"
 POD_mummy_spell_of_life_journeys.12.critical.failure.effect.desc: "He repels your assault"

 POD_mummy_spell_of_life_journeys.13.t: "Inauhaten's Lessons"
 POD_mummy_spell_of_life_journeys.13.desc: "Inauhaten does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Inauhaten and found him among the many hidden caves of the Himalayan Mountains. Once a mortal architect, he was turned into a mummy by the Cult of Isis and decided to spend his newfound immortality studying death and the afterlife. In time, he determined that Horus' crusade against Set to be a distraction from greater matters: watching over a grand, sunless city admist the dead and soaring defiantly above the end of all. After being impressed by their knowledge of necromancy, Inauhaten offered a deal to a cult of mages. In exchange for their aid caring for a forgotten city, he utilized a fragmented version of the Spell of Life to transform the Idran into yamasattvas. Through them, he contacted an ancient sect of vampires that worshipped the Antediluvians. He taught them of the Underworld and its government. He led them to the city and helped them capture it. He gave them a series of volumes that distilled his millennia of experience with necromantic praxis. He aided them as they assembled one of the most complete archives of early Cainite history in the world, one whose size surpassed even the fabled Library of the Forgotten. He illuminated a path for the Tal'mahe'Ra and set them on a course they could not deviate from.\n\nWhile he only knows a corrupted form of the Spell of Life, he could teach you much. However, you may need to make a deal with him, like the Idran so long ago."
 POD_mummy_spell_of_life_journeys.13.a: "I am already bound by the Idran's deal"
 POD_mummy_spell_of_life_journeys.13.b: "I swear myself to the cause"
 POD_mummy_spell_of_life_journeys.13.c: "Do they need some resources?"
 
 POD_mummy_spell_of_life_journeys.14.t: "Mestha's Lessons"
 POD_mummy_spell_of_life_journeys.14.desc: "Mestha does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Mestha and found him living on a quiet farm within sight of the Nile River. Once, he was a simple farmer of the Lower Nile, tending the same land as his father, his father's father, going back many generations. His sons served in the mortal armies of Osiris and Horus, brave, zealous, and ultimately dead. His second son brought Isis and Horus to Mestha's farm where he sheltered them. Mestha sacrified the bull whose blood fueled Osiris' recovery. He watched the creation and preparation of the Spell of Life. When Isis proved reluctant to test the spell on her injured son, Mestha offered to undergo it, took poison to still his heart, felt as his Ba passed into the spirit world, and was reborn for the first time. He witnessed the ritual as it gave Horus eternal life. As his immortality stretched on, he served as Osiris' confidant on the rare occassions that his master left Amenti.\n\nHe has seen much over his millennia, giving him a few fragments of knowledge regarding the Spell of Life. However, his loyalty to Osiris and Horus is absolute."
 POD_mummy_spell_of_life_journeys.14.a: "He's an amiable man. Let's try talking"
 POD_mummy_spell_of_life_journeys.14.b: "He may be loyal, but he still feels pain..."



 POD_mummy_spell_of_life_journeys.20.t: "[Concept('translation_minigame', 'Translating')|E] Esoteric Records"
 POD_mummy_spell_of_life_journeys.20.desc: "Your efforts have yielded some esoteric record of an undiscernible age. Despite your familiarity with multiple languages and the linguistic capabilities of your courtiers, your combined efforts have proven insufficient to render it interpretable. Invisible ink obscures critical details. Enciphered words speckles the text. The portions written in a familiar language are barely interpretable, requiring a technical and magical mastery that you are just starting to achieve. The writer's shorthand only further complicates your translation efforts.\n\nOne particular, five-letter word seems to be the key to translating the remainder. Unfortunately, you'll only have 6 opportunities as your efforts are rather destructive."
 POD_mummy_spell_of_life_journeys.20.a: "Let's try it"
 POD_mummy_spell_of_life_journeys.20.b: "I give up!"
 POD_mummy_spell_of_life_journeys.20.effect.success: "Your translation is successful"
 POD_mummy_spell_of_life_journeys.20.effect.failure: "Your translation failed"
 POD_mummy_spell_of_life_journeys.20.effect.failure.details: "Your failed attempts destroyed the record"

 POD_mummy_spell_of_life_journeys.21.t: "Branching Paths"
 POD_mummy_spell_of_life_journeys.21.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"A lying head rests above the safe path.\"\nThe green head says, \"The red head speaks only the truth.\"\nThe blue head says, \"The red head rest above the safe path.\""  # solution is blue
 POD_mummy_spell_of_life_journeys.21.a: "I take the red gate"
 POD_mummy_spell_of_life_journeys.21.b: "I take the green gate"
 POD_mummy_spell_of_life_journeys.21.c: "I take the blue gate"
 POD_mummy_spell_of_life_journeys.21.effect.success: "The path leads to knowledge"

 POD_mummy_spell_of_life_journeys.22.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"The green head rest above the safe path.\"\nThe blue head says, \"The green head speaks only lies.\"\nThe green head does not speak."  # solution is green

