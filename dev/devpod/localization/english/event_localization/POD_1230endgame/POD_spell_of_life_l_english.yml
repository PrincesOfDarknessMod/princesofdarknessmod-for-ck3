 POD_mummy_spell_of_life_journeys.25.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"Another head rests above the safe path.\"\nThe green head says, \"Another head speaks only the truth.\"\nThe blue head says, \"Another head has said 'another head'.\""  # solution is red

 POD_mummy_spell_of_life_journeys.26.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"The safe path lies below the only head that speaks the truth.\"\nThe green head says, \"Only one head speaks the truth.\"\nThe blue head says, \"The red head rests above the safe path.\""  # solution is blue

 POD_mummy_spell_of_life_journeys.27.t: "Path of Darkness"
 POD_mummy_spell_of_life_journeys.27.desc: "You pass between the golden etchings and walk into the emptiness, allowing it to swallow you. The darkness tugs at you, unraveling your form like a loosely-bound ball of yarn. On the hand held in front of your face, your fingers stretch as if thread pulled taut. Despite lacking anything to compare yourself against within this endless void, you know that your body is becoming longer and thinner, stretching and curling, twisting and turning. On the loom of space, your thread is being pulled out and woven into a new location as your body leaves the temple.\n\nYou know that your only chance is to reestablish your body around your mind and will so that you can push further into the temple."
 POD_mummy_spell_of_life_journeys.27.a: "I gather my will..."  # 25 stewardship check
 POD_mummy_spell_of_life_journeys.27.effect.success: "You reach your prize"
 POD_mummy_spell_of_life_journeys.27.effect.failure: "The temple spits you out"

 POD_mummy_spell_of_life_journeys.28.t: "Bones Rattle"
 POD_mummy_spell_of_life_journeys.28.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient tomb. Historical records differ regarding its inhabitants. Some say that a mage or sorcerer was buried there. Perhaps the remnants of a liche were placed there by their followers. Others say that a mummy, maybe Horus himself, once stored their body in this tomb between rebirths. Regardless of the truth, clues lie among the corpses.\n\nAfter breaking apart stones that have seen more years fall away than you have seen leaves fall, you enter into a strange cavern. A strange pedestal stands at the center, and four sarcophagi stand upright, aligned with the cardinal directions. Atop the pedestal is a scroll in a sealed container, and four buttons stick out from the pedestal's sides. On their faces are an octagon, a square, two parallel lines from top-left to bottom-right, and a vertical line. Scattered throughout the room are strange phrases, inscribed on the sarcophagi, carved into the floor, printed on the walls. \"Bones rattle\" appears 4 times. \"Cursed bones\" appears 4 times. \"Trapped doom\" appears 3 times."
 POD_mummy_spell_of_life_journeys.28.a: "Press the octagon, square, & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.b: "Press the square button"
 POD_mummy_spell_of_life_journeys.28.c: "Press the parallel line button"
 POD_mummy_spell_of_life_journeys.28.d: "Press the square, parallel, & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.e: "Press the octagon, parallel, & vertical line buttons"  # correct answer
 POD_mummy_spell_of_life_journeys.28.f: "Press the parallel & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.effect.success: "The container slides away"

 POD_mummy_spell_of_life_journeys.29.t: "Statues Rise"
 POD_mummy_spell_of_life_journeys.29.desc: "As you begin entering your chosen sequence, an orange glow suffuses the pedestal. With the last press, the soft orange glow is replaced with a red flash and a screeching sound from all angles. The carved covers of the cardinal sarcophagi slide away with the pained groans of a man as old as the tomb itself. From their once-hidden depths, four animated statues step forth, bearing chiseled armor and sculpted swords. Embedded in the stone are human bones covered in ancient runes, animating these humanoid effigies. Working in perfect concert, they begin attacking you, swinging blades that weigh as much as you with ease."
 POD_mummy_spell_of_life_journeys.29.a: "No antique figurine can beat me!"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.29.effect.success: "They crumble before you"
 POD_mummy_spell_of_life_journeys.29.effect.failure: "They drive you off"

 POD_mummy_spell_of_life_journeys.30.t: "As Above, So Below"
 POD_mummy_spell_of_life_journeys.30.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. Once, it was a home to a mystery cult. Some theorize that the priests here worshipped Osiris and Isis, though their true gods have been lost to the sands of time. Supposedly, the cult emphasized the continuation of life after death. Today, all that remains is the stone ediface of their place of worship.\n\nBuried under the temple is a hidden one, in far better condition and once witness to the cult's inner mysteries. It is a perfect reflection of what was once above the surface, flipped upside such that as you descend down the stairs, you approach what would have been a tower reaching towards the sky. At the deepest depth is a perfectly circular room. A beam of light shines down from a series of mirrors hidden within the room's ceiling, illuminating an otherwise empty portion of the room. Upon a shockingly-light pedestal at the room's center is a papyrus scroll, ancient and yet intact. A seal bearing the Feather of Judgment rests upon the scroll's front. Below, the words inscribed into the pedestal read, \"Is there no good scribe and learned man who may read this letter which I have brought to Egypt before Pharaoh without spoiling its seal? Who will read the writing within without breaking the wax?\""
 POD_mummy_spell_of_life_journeys.30.a: "I cut myself and bleed on the seal"
 POD_mummy_spell_of_life_journeys.30.b: "I bundle it in papyrus to reed it"
 POD_mummy_spell_of_life_journeys.30.c: "I sleep with my head beside it"
 POD_mummy_spell_of_life_journeys.30.d: "I reposition it below the mirrors"  # correct answer
 POD_mummy_spell_of_life_journeys.30.e: "I cast a spell to read the scroll's contents"  # 65 learning check; big bonus if Sorcerer/Theurgist trait
 POD_mummy_spell_of_life_journeys.30.effect.success: "You memorize the words you see"
 POD_mummy_spell_of_life_journeys.30.effect.failure: "The scroll crumbles at your touch"

 POD_mummy_spell_of_life_journeys.31.t: "What Remains"
 # Note: wen - an overcrowded city, a boil/cyst/tumor
 POD_mummy_spell_of_life_journeys.31.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried amongst the ruins of a city, cadaverous and interred but not dead. Beyond the Pillars of Melqart and the Gates of Gades, unholy beings claimed a city and feasted. Their loathsomeness seeped into surfaces reminiscent of spheres, angles sticking into unseeable spaces. The flat became tilted, the convex became concave, and the corners became mouths. Nightmares bred, the Cyclops came, the seven moved on, and the great wen drowned. Well... so the stories say.\n\nAs you swim down, you see cyclopean masonry, so similar to familiar architecture and yet cancerous, so firm and yet oozing as if slime along a shoreline. You make your way towards a monolith-crowned citadel festooned with effigies beyond description and hieroglyphs beyond definition. At the peak rests a plaque whose symbols shift and squirm under your vision.\n\"Bear your mind. Speak the phrase.\n2-1-16 1-2-5 1-2-17\""
 # Book cipher decoded via paragraph - sentence - word
 POD_mummy_spell_of_life_journeys.31.a: "Cancerous Melqart feasted"  # correct answer
 POD_mummy_spell_of_life_journeys.31.b: "Dead yet dreaming"
 POD_mummy_spell_of_life_journeys.31.c: "Cadaverous Cyclopean drowned"
 POD_mummy_spell_of_life_journeys.31.d: "Beyond the wen, convex became concave, shift and squirm"
 POD_mummy_spell_of_life_journeys.31.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.31.effect.success: "Secrets reveal themselves in the squirming"
 POD_mummy_spell_of_life_journeys.31.effect.failure: "It squirms away from you"

 POD_mummy_spell_of_life_journeys.32.t: "The Dam of Dreams"
 POD_mummy_spell_of_life_journeys.32.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie in the remnants of a noble's house. The ruin lies buried under soil left by countless floods of the nearby river. Within the house should be a book locked within a box of iron. In the box of iron is a box of copper. In the box of copper is a box of juniper wood. In the box of juniper wood is a box of ivory and ebony. In the box of ivory and ebony is a box of silver. In the box of silver is a box of gold, and in it is the book.\n\nYou scrape away the layers of dirt and walk through what was once a doorway. You pass through ancient halls and descend into what once was a basement and is now little more than a hole lit by an unnatural green. And such a green it is, coming from every angle and yet clearly originating from a jagged rip in reality. The stories told you of the so-called Dam of Dreams. Passing through it leaves you at the edge of a cliff. The air hums with the green you saw before, pulsing in time with your heartbeat. Stretched out before and below you are six miles of giant serpents, crocodiles, spiders, scorpions, and every form of reptile and arachnid ever seen or imagined. They coil and uncoil, forming vast living patterns. Circles within circles, tails brushing teeth, endlessly consuming themselves. Across the Sea of Serpents rests an ouroboros, fangs sunk into its own tail and eternally encircling the box you seek.\n\nThe old stories say that these creatures await a single command. One word to still their movements, to shift their patterns, to form a bridge."
 POD_mummy_spell_of_life_journeys.32.a: "Conclusion"
 POD_mummy_spell_of_life_journeys.32.b: "Conflict"
 POD_mummy_spell_of_life_journeys.32.c: "Ceaseless"  # correct answer
 POD_mummy_spell_of_life_journeys.32.d: "Cosmic"
 POD_mummy_spell_of_life_journeys.32.e: "I shall form a waxen crew & cut my way through"  # 25 martial check
 POD_mummy_spell_of_life_journeys.32.effect.success: "You unbox your prize"
 POD_mummy_spell_of_life_journeys.32.effect.failure: "The sea of serpents is endless"

 POD_mummy_spell_of_life_journeys.33.t: "Affinity or Death!"
 POD_mummy_spell_of_life_journeys.33.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within an ancient tomb, though whether there is a body in it is a matter of great debate. The legends speak of a wise master who drove multiple students to madness and worse. He was infamous for his tests and his punishments for failing to meet his standards. To him, those unworthy of his knowledge must prove their worthiness of life. If not, he was more than happy to correct the problem.\n\nAfter opening the tomb and progressing downwards, you enter to see a 30-foot tall statue holding a carved scroll resting upon a pedestal with a plaque and 5 buttons. In order, the buttons are red, orange, yellow, green, and blue. The plaque below the statue reads, \"Decode my teachings to prove your affinity for magic and earn my knowledge. Perhaps you can describe an automorphism of an affine space. If you prove unable to read such a simple message or perform such simple math, all of my knowledge will be destroyed. Don't try to force your way forward like an ignoramus brute.\" The scroll being held by the statue reads the following:\nG2w mooi sg ix26nojyo 2t s4y8e m2 7h21o g2whmont 74hr64g e2s7oroxr. G2w m32wnj 7homm r3o 2h4xyo 9wrr2x."
 # Affine Cipher: coefficients are a=5 and b=30 (the only numbers in the event)
 # Ultimately just a monoalphabetic substitution cipher, so o always means e
 # Decodes to "You seek my knowledge of magic so prove yourself partway competent. You should press the orange button."
 POD_mummy_spell_of_life_journeys.33.a: "Press the red button"
 POD_mummy_spell_of_life_journeys.33.b: "Press the orange button"  # correct answer
 POD_mummy_spell_of_life_journeys.33.c: "Press the yellow button"
 POD_mummy_spell_of_life_journeys.33.d: "Press the green button"
 POD_mummy_spell_of_life_journeys.33.e: "Press the blue button"
 POD_mummy_spell_of_life_journeys.33.f: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.33.effect.success: "The scroll crumbles, revealing paper"
 POD_mummy_spell_of_life_journeys.33.effect.failure: "The statue bursts into fire"

 POD_mummy_spell_of_life_journeys.34.t: "The Seeker's Lair"
 POD_mummy_spell_of_life_journeys.34.desc: "In your quest for esoteric records on the Spell of Life, you have revealed an ingredient necessary for the final ritual. That ingredient is the bile of a long-extinct reptile, said to be capable of opening its mouth wide enough for a man to walk through it without ducking. Unfortunately, a past seeker of the Spell of Life exterminated all of those reptiles due to their failed efforts. Thankfully, you found a location reputed to be that seeker's vault.\n\nYou march through the forest, cutting your way through the growth and beasts. Knots in the wood seem to follow your movements, reproaching your every step. Heavy-laden branches dangle downwards, scratching against your armor and skin like claws. Finally, you reach it. Yellowed bones sticking out of the dirt, a gaping maw emerges from the landscape. The wind whistles between the teeth, sharpening them like invisible whetstones. Carefully stepping down the stairs, you allow yourself to be swallowed by the darkness. At the base is first an open pair of jaws and then a closed pair of jaws. Harsh, angular letters were carved into the teeth of both. Reading left to right from the top corner, the open pair reads, \"Show that you should be here and be granted access.\" The closed pair reads something more confusing. \"BTELDIIEBTELDIOETBRBRYHBAELVDYHBAEHPDOEEON\"."
 # Rail fence cipher decodes to "BY THE BLADE I LIVED BY THE BLADE I HOPED TO BE REBORN" with 2 rows (like teeth)
 POD_mummy_spell_of_life_journeys.34.a: "Hold up an acid vial"
 POD_mummy_spell_of_life_journeys.34.b: "Hold up a dead body"
 POD_mummy_spell_of_life_journeys.34.c: "Hold up a sword"  # correct answer
 POD_mummy_spell_of_life_journeys.34.d: "Hold up a bell"
 POD_mummy_spell_of_life_journeys.34.effect.success: "The bile is yours"

 POD_mummy_spell_of_life_journeys.35.t: "A Jumble of Jaws"
 POD_mummy_spell_of_life_journeys.35.desc: "The jaws creak open with the sound of a sword drawn from a sheath. Where you expected a staircase downwards or perhaps a partially-empty bottle of bile, there are beasts, reptiles of a kind you've never seen before. They resemble crocodiles, though their 6 legs are jointed more like an alligator and a spiked tail trails their trunk-like bodies. Pointing up and down, dozens of teeth visibly protrude from their mouths. Apparently, this past seeker decided that breeding these beasts for their bile was far easier than hunting them in the wild. Useful, though they seem to have gone wild in the intervening ages."
 POD_mummy_spell_of_life_journeys.35.a: "Nothing a sword can't fix"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.35.effect.success: "The bile is yours"
 POD_mummy_spell_of_life_journeys.35.effect.failure: "They drive you away"

 POD_mummy_spell_of_life_journeys.36.t: "Esoteric Figures"
 POD_mummy_spell_of_life_journeys.36.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within an ancient tomb, though whether there is a body in it is a matter of great debate. The legends speak of a wise master who drove multiple students to madness and worse. He was infamous for his tests and his punishments for failing to meet his standards. To him, those unworthy of his knowledge must prove their worthiness of life. If not, he was more than happy to correct the problem.\n\nAfter opening the tomb and progressing downwards, you enter to see a 30-foot tall statue holding a carved scroll resting upon a pedestal with a plaque and 4 buttons. Upon each button is a number. The plaque below the statue reads, \"Decode my teachings to prove your affinity for magic and earn my knowledge. If you prove unable to read such a simple message or perform such simple math, all of my knowledge will be destroyed. Don't try to force your way forward like an ignoramus brute.\" The scroll being held by the statue reads the following:\n\nOrange + Blue = 5 ; Blue + Red = 3 ; Orange + Red = 4 ; Purple = ?."
 POD_mummy_spell_of_life_journeys.36.a: "Press the 3" # correct answer
 POD_mummy_spell_of_life_journeys.36.b: "Press the 4"  
 POD_mummy_spell_of_life_journeys.36.c: "Press the 5"
 POD_mummy_spell_of_life_journeys.36.d: "Press the 6"
 POD_mummy_spell_of_life_journeys.36.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.36.effect.success: "The scroll crumbles, revealing paper"
 POD_mummy_spell_of_life_journeys.36.effect.failure: "The statue bursts into fire"

 # I made up a name for a half man-half scorpion creature, loosely based on a minotaur and Serket (scorpion goddess of protection, healing, magic)
 POD_mummy_spell_of_life_journeys.37.t: "The Serketaur Sentry"
 POD_mummy_spell_of_life_journeys.37.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within a pyramid. Details of its contents are scant, though you have heard of its mighty guardian. How much truth there is to the tales remains to be seen.\n\nAn unnatural fog infuses the air, thicker than any soup you have eaten and oddly similar in smell. As you wade through it, it suddenly seems to stop as if held back by an invisible barrier. Before you stretches endless waves of sand crimson with blood, highlighted by the sun. The pyramid's silver peak rises in the distance, slowly descending into black marble as you crest the dunes and get ever closer. The sealed door is flanked by two obelisks, seeming to almost absorb the sunlight and send it pulsing through the marble's veins. Before the door is what at first seems to be a giant man holding an axe though the sands quickly part way to reveal the scorpion legs and stinger below his waist. As you approach, the serketaur blocks your path and speaks.\n\n\"You may make one statement. If it's true, I'll cut your head off. If it's false, I'll cut your belly open.\""
 POD_mummy_spell_of_life_journeys.37.a: "You'll cut my head off."
 POD_mummy_spell_of_life_journeys.37.b: "You'll cut my belly open."  # correct answer
 POD_mummy_spell_of_life_journeys.37.c: "You'll kill me"
 POD_mummy_spell_of_life_journeys.37.d: "I'll kill you first!"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.37.effect.success: "The axe moves aside, letting you pass"
 POD_mummy_spell_of_life_journeys.37.effect.failure: "The axe falls where you once were"

 POD_mummy_spell_of_life_journeys.38.t: "Power of the Party"
 POD_mummy_spell_of_life_journeys.38.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within a tomb. Where most seekers of the Spell of Life worked on their own, this cabal of mages worked together to further their goals. Where others pursued the magic of the Spell of Life alone, they sought a more holistic approach where they improved body, mind, and soul. Some say they were influenced by traditions that came from lands east of  Kemet, following the trade routes. Few details remain of their work, though the word 'akasha' appears a few times and their failure is clear.\n\nAt first, it seems like nothing more than a hole in the ground, covered over by the dirt of ages long past. You expected a staircase or a ladder, but instead, a ramp descends before you, curving to the right. With each step and each turn, you move ever downwards. Step after step, turn after turn, you pass by carved images depicting many scenes of studying, chanting, meditating, crafting, growing, dancing, and more. So it continues as you pass through gate after gate until 4 gates are behind you. Finally, you stand before a closed gate. Above it, there are some words inscribed. \"Speak the truth to continue. When there are two of me, we are better than one. When there are two hundred of me, we are a loud fool. When we move as one, nothing can stand against us. When we move in opposite directions, we move nowhere. What am I?\""
 POD_mummy_spell_of_life_journeys.38.a: "Minds"  # correct answer
 POD_mummy_spell_of_life_journeys.38.b: "Oxen"
 POD_mummy_spell_of_life_journeys.38.c: "Drums"
 POD_mummy_spell_of_life_journeys.38.d: "Wheels"
 POD_mummy_spell_of_life_journeys.38.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.38.effect.success: "The gate swings open..."
 POD_mummy_spell_of_life_journeys.38.effect.failure: "The turns lead only upwards"

 POD_mummy_spell_of_life_journeys.39.t: "What Remains?"
 # Poem by W.H. Auden from 1940. Chosen for being generally close in theme, the repeated lines (what I use for the puzzle), and its structure as a villanelle
 POD_mummy_spell_of_life_journeys.39.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within a tomb. According to the legends, the tomb now plays home to a seeker who wove his magic through poetry. He sought immortality. Through his magic, he extended his life only to discover the curse inherent to it. With each passing year, another relative passed on. With each great war, more friends were lost. Yet, he remained. As seasons passed and the leaves fell only to grow new once more, he abandoned the quest for eternal rebirth. He allowed time to overtake him. And now... now, his tomb lies ready for you to search in your quest for immortality.\n\nAtop the tomb's lintle is a simple phrase \"Fear that which remains beyond its time\". The tomb's interior is simple stone, well-made but not ornate. Eventually, you reach a long hallway with pressure plates, each plate bearing a number from 1 to 19. On the far side is a coffin with 13 dull gems on it. In front of the pressure plates is a pedestal with a poem.\n\n\"Time will say nothing but I told you so,\nTime only knows the price we have to pay;\nIf I could tell you I would let you know.\n\nIf we should weep when clowns put on their show,\nIf we should stumble when musicians play,\nTime will say nothing but I told you so.\n\nThere are no fortunes to be told, although,\nBecause I love you more than I can say,\nIf I could tell you I would let you know.\n\nThe winds must come from somewhere when they blow,\nThere must be reasons why the leaves decay;\nTime will say nothing but I told you so.\n\nPerhaps the roses really want to grow,\nThe vision seriously intends to stay;\nIf I could tell you I would let you know.\n\nSuppose all the lions get up and go,\nAnd all the brooks and soldiers run away;\nWill Time say nothing but I told you so?\nIf I could tell you I would let you know.\""
 POD_mummy_spell_of_life_journeys.39.a: "Press all but Plates 3,6,9,12,15,18"
 POD_mummy_spell_of_life_journeys.39.b: "Press all but Plates 3,5,7,11,13,17"
 POD_mummy_spell_of_life_journeys.39.c: "Press all but Plates 4,6,9,12,15,19"
 POD_mummy_spell_of_life_journeys.39.d: "Press all but Plates 6,9,12,15,18,19"  # correct answer
 POD_mummy_spell_of_life_journeys.39.e: "Press all but Plates 1,6,9,12,15,19" 
 POD_mummy_spell_of_life_journeys.39.f: "Press as many combinations as possible"  # 25 intrigue check
 POD_mummy_spell_of_life_journeys.39.effect.success: "The gems glow, and the lid swings aside"
 POD_mummy_spell_of_life_journeys.39.effect.failure: "The plates drop away into lava"

 POD_mummy_spell_of_life_journeys.40.t: "Pathway to Hell"
 POD_mummy_spell_of_life_journeys.40.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that a few clues can be found in lost pyramid. Some say that the pyramids of old collected sunlight at their peak, using it to create a river of light for a soul to follow into the afterlife. However, not all saw sunlight as the best path into the Shadowlands. Some sought to channel darker energies from deep underground, using it in their failed attempts at the Spell of Life. They constructed an upside-down, pentagonal pyramid which dove deep, ever so deep into the rock. The rumors also speak of their obsession with the role of numerology in magical rituals, including a particular series that functioned as their identifying mark.\n\nYou pass the entrance and look down an empty void with 5 staircases leading downwards. The vast expanse is filled with an empty echo, reverberating endlessly. The dark void obscures the strange channels carved into the blackened stone that forms the pyramid's walls. Ticker than a tree's trunk, stygian chains veined with silver run from the ceiling down to the floor and key points in the walls. Upon each of the 5 floors is a series of numbers.\n13\n1113\n3113\n132113\n1113122113\n\nAt the pyramid's lowest point sits a triangular altar linked to the channels along the walls. Upon the altar's sides are 3 buttons, each with a number going from 1 to 3."
 POD_mummy_spell_of_life_journeys.40.a: "Press '132'"
 POD_mummy_spell_of_life_journeys.40.b: "Press '213'"
 POD_mummy_spell_of_life_journeys.40.c: "Press '212323132132'"
 POD_mummy_spell_of_life_journeys.40.d: "Press '111311121113'"
 POD_mummy_spell_of_life_journeys.40.e: "Press '311311222113'"  # correct answer
 POD_mummy_spell_of_life_journeys.40.f: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.40.effect.success: "As the channels glow, words appear upon the altar"
 POD_mummy_spell_of_life_journeys.40.effect.failure: "As the channels glow, you find yourself elsewhere"
 
 POD_mummy_spell_of_life_journeys.41.t: "Crumbling Stones"
 POD_mummy_spell_of_life_journeys.41.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues can be found in within the ritual site of a seeker who disappeared after performing their version of the Spell of Life. More so than almost any other place you have visited, little remains of this tomb. Fog swirls through the air, forming dew on your hands. The air is spiked with ozone, overwhelming your nostrils. Plants creak, and the sounds of animals gently reach your ears as if from a great distance. As you pass, ferns bend beneath your feet before slowly rising up behind you, removing all traces of your path. Nature has overtaken the once-grand tomb. The capstones of pillars lay among the roots of trees possibly predating even you. Carved stone bricks crumble with each step. Eventually, you reach what was once the tomb's foundation but is now a circle of cracked stones. At the center is a translucent man of an indiscernible age, seeming to sit on an invisible chair.\n\n\"Ah, few fools make it to this place. Long has been since it was seen. Answer my riddle, and I shall give you what I sought in my foolishness. A mage is as old as the sorcerer will be when the mage is twice as old as the sorcerer was when the mage's age was half the sum of their present age. How old is each?\""
 POD_mummy_spell_of_life_journeys.41.a: "The mage is 30. The sorcerer is 20."
 POD_mummy_spell_of_life_journeys.41.b: "The mage is 60. The sorcerer is 20."
 POD_mummy_spell_of_life_journeys.41.c: "The mage is 45. The sorcerer is 30."
 POD_mummy_spell_of_life_journeys.41.d: "The mage is 60. The sorcerer is 45."  # correct answer
 POD_mummy_spell_of_life_journeys.41.e: "I let my intuition guide me"  # 25 learning check
 POD_mummy_spell_of_life_journeys.41.effect.success: "\"The secret you seek is...\""
 POD_mummy_spell_of_life_journeys.41.effect.failure: "\"Leave me to await a fool worthy of my secrets\""
 



