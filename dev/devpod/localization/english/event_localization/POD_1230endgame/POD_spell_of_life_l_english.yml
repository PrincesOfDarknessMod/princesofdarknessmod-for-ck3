 world_steppe_north: "Northern Steppes"
 world_steppe_south: "Southern Steppes"
 world_asia_greater_north_east: "Greater Northeast Asia"
 world_asia_greater_japan: "Greater Japan"
 world_india_south: "Southern India"
 world_india_north: "Northern India"

 spell_of_life_starter_decision: "Quest for the [Concept('POD_spell_of_life', 'Spell Of Life')|E]"
 spell_of_life_starter_decision_desc: "Many have sought out a means of eternal rebirth, a pure form of immortality devoid of the weaknesses and curses borne by the other options. One proven method, the Spell of Life, is used by the #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Mummies#!#! of the west. While it may be a pursuit that takes a lifetime and you should be prepared to sacrifice everything, the quest for true immortality may be worthwhile.\n\n#R Your chances of success in this quest are absurdly low. Do not attempt it if you care about your character's well being.\nEven saving and reloading your game to chance the odds won't save you later on. You have been warned.#!"
 spell_of_life_starter_decision_tooltip: "The Spell of Life could grant us immortality without downsides."
 spell_of_life_starter_decision_confirm: "Let us begin"
 spell_of_life_stage1_unlock_next_phase: "Unlocks next step in the current path"
 spell_of_life_stage1_unlock_next_phase_caveat: "$spell_of_life_stage1_unlock_next_phase$ if you succeed"
 spell_of_life_stage1_do_multiple_stages: "#help \n\nWhile more difficult, you may find that completing a path offers additional rewards at a later point.#!"
 spell_of_life_stage1_warning: "\n\n#R Be prepared to sacrifice everything in the quest for true immortality, for the path is fraught with danger!#!"
 spell_of_life_stage1_hide_requirement: ""

 spell_of_life_stage1_horus_phase1_decision: "Earn an Audience"
 spell_of_life_stage1_horus_phase1_decision_desc: "Tenet 6 of the Code of Horus reads, \"Seek not to create others like us.\" Convincing him to violate it is a near impossibility. However, the benefits are untold as he is the sole holder of the full, flawless [Concept('POD_spell_of_life', 'Spell Of Life')|E]. Before we can convince him, we have to earn an audience with him. Perhaps a gift will do. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_horus_phase1_decision_tooltip: "To convince Horus, we need to earn an audience with him."
 spell_of_life_stage1_horus_phase1_decision_confirm: "We gift you... Upper Egypt!"

 spell_of_life_stage1_horus_phase2_decision: "A Grand Argument"
 spell_of_life_stage1_horus_phase2_decision_desc: "If we can befriend Horus, our gift or previous service should be enough to earn an audience with him. It won't be easy, but no one knows more of the [Concept('POD_spell_of_life', 'Spell Of Life')|E] than him."
 spell_of_life_stage1_horus_phase2_decision_tooltip: "Our gift has earned us an audience. Let's make full use of it."
 spell_of_life_stage1_horus_phase2_decision_confirm: "Set out for his court"

 spell_of_life_stage1_horus_phase3_decision: "Proving Our Worthiness"
 spell_of_life_stage1_horus_phase3_decision_desc: "Our arguments swayed Horus, deigning to grant us an opportunity to prove ourselves loyal allies to his cause. The Children of Set and the traitors must fall before our blade. Only then will Horus help us in our quest for the Spell of Life, though he will not give us the full thing. Only by acquiring it ourselves can we demonstrate our worthiness to use it."
 spell_of_life_stage1_horus_phase3_decision_tooltip: "To receive Horus' knowledge, we must prove ourselves worthy"
 spell_of_life_stage1_horus_phase3_decision_confirm: "And so the sands ran red..."
 spell_of_life_stage1_horus_phase3_decision_no_emperor_requirement: "No #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setite#!#! or follower of a [faith|E] with the [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName] or [GetFaithDoctrine('special_doctrine_set_corrupted_kindred').GetBaseName] [doctrine|E]s can hold an Empire [title|E]"
 spell_of_life_stage1_horus_phase3_bonus_xp: "Whenever you complete a [journey|E], Horus' insights grant #color_white 5.00#! additional [trait_level_track_xp|E] in Spell of Life #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"
 spell_of_life_stage1_horus_phase3_decision_effect: "In time, your relationship with him may allow you to enter the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]"

 spell_of_life_stage1_kemintiri_phase1_decision: "Restoring Lost Memories"
 spell_of_life_stage1_kemintiri_phase1_decision_desc: "Once a priestess of Isis and a holder of the [Concept('POD_spell_of_life', 'Spell Of Life')|E], Kemintiri lost much during her time in Set's #EMP gentle care#!. If we could earn her trust and recover remnants of her past life, we may be able to help restore some of those lost memories. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_kemintiri_phase1_decision_tooltip: "Kemintiri once knew the Spell of Life. Perhaps she can remember it..."
 spell_of_life_stage1_kemintiri_phase1_decision_confirm: "I speak of the beginnings of time..."
 
 spell_of_life_stage1_kemintiri_phase2_decision: "Long-Lost Friends"
 spell_of_life_stage1_kemintiri_phase2_decision_desc: "While reading an artifact she helped write helped, far too many gaps remain in Kemintiri's memories. However, she has mentioned that others have sought to help her in the past, and you know that many stories of her past survive in certain traditions. If we could contact and win the trust of these individuals, they may be able to restore what Kemintiri has lost, including knowledge of the [Concept('POD_spell_of_life', 'Spell Of Life')|E]."
 spell_of_life_stage1_kemintiri_phase2_decision_tooltip: "We aren't the first to try to help Kemintiri. Perhaps the others could be useful."
 spell_of_life_stage1_kemintiri_phase2_decision_confirm: "Much that once was is lost, but this remains..."
 spell_of_life_stage1_kemintiri_phase2_decision_osiris_requirement: "A member of [house|E] [GetDynastyHouseByID('house_osiris').GetName] is your [friend|E], [best_friend|E], [coterie|E] member, [lover|E], or [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_bubasti_requirement: "A [GetFaithByKey('bubasti').GetName] is your [friend|E], [best_friend|E], [coterie|E] member, [lover|E], or [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_sobek_requirement: "A #TOOLTIP:FAITH,children_sobek #L Child of Sobek#!#!#! is your [friend|E], [best_friend|E], [coterie|E] member, [lover|E], or [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_silent_strider_requirement: "A #TOOLTIP:RELIGION,silentstrider_religion #L Silent Strider#!#!#! is your [friend|E], [best_friend|E], [coterie|E] member, [lover|E], or [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_khetamon_requirement: "[GetScriptedCharacterByHistoryID('791151').GetFirstName], who once came close to healing Kemintiri's psyche, is active and either in your [court|E] or is your [friend|E], [best_friend|E], [coterie|E] member, [lover|E], or [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_effect: "[GetScriptedCharacterByHistoryID('790512').GetFirstName] will learn the Spell of Life"

 spell_of_life_stage1_kemintiri_phase3_decision: "Revenge Is Best Served Cold"
 spell_of_life_stage1_kemintiri_phase3_decision_desc: "While most of her memories have returned and she remembers enough of the [Concept('POD_spell_of_life', 'Spell Of Life')|E] to aid us, Kemintiri has informed us that she cannot devote any time towards teaching us until she has gotten her revenge. Ta-urt and her entire [house|E] must be annihilated. Only then will she turn her attention towards other matters."
 spell_of_life_stage1_kemintiri_phase3_decision_tooltip: "Kemintiri needs revenge before she's willing to teach us"
 spell_of_life_stage1_kemintiri_phase3_decision_confirm: "Revenge, then lessons"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed: "No vampiric member of [house|E] [GetDynastyHouseByID('house_tawaret').GetName] is a [ruler|E]."
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed_ex: "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed$ #weak ([landed_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living: "5 or fewer members of [house|E] [GetDynastyHouseByID('house_tawaret').GetName] are alive, active, and vampiric."
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living_ex: "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living$ #weak ([living_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_effect: "In time, your relationship with her may allow you to enter the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]"

 spell_of_life_stage1_cabirus_phase1_decision: "Read the Secret Writings of Cabirus"
 spell_of_life_stage1_cabirus_phase1_decision_desc: "The Secret Writings of Cabirus are a complete, but badly translated, version of Cabirus' original book. Nonetheless, they describe the inner workings of Osiris' [Concept('POD_spell_of_life', 'Spell Of Life')|E] and could provide some useful insights if we had access to them and had the knowledge to use it. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_cabirus_phase1_decision_alt_desc: "The Secret Writings of Cabirus once were a complete, but badly translated, version of Cabirus' original book. Before their destruction, they described the inner workings of Osiris' [Concept('POD_spell_of_life', 'Spell Of Life')|E] and could have provided some useful insights, hence why Horus saw to its destruction.\n\nThough the original manuscript is lost, fragments survive as decayed papyri, damaged vellum parchments, palimpsests, excerpts on potsherds, inscriptions on crumbling edifices, oral records, mage textbooks and lectionaries, commentaries, and transcribed debates. If enough are collected, proper textual criticism could allow Cabirus' writings to be reconstructed. $spell_of_life_stage1_do_multiple_stages$"
 spell_of_life_stage1_cabirus_phase1_decision_tooltip: "If we could translate Cabirus' writings, we could gain some insights."
 # Those are accurate translations for that bohairic coptic word, though I did have to transliterate it into latin characters to be displayed properly
 spell_of_life_stage1_cabirus_phase1_decision_confirm: "Does \"ebol\" mean \"going forth\" or \"death\"?"
 spell_of_life_stage1_cabirus_phase1_decision_alt_confirm: "Little knowledge is truly beyond recovery."
 spell_of_life_stage1_cabirus_phase1_decision_writing_access: "Have access to the [GetPODArtifactName('writings_cabirus_link')]"
 spell_of_life_stage1_cabirus_phase1_decision_university: "One of your [counties|E] has a university [building|E], [GetBuilding('black_college_02').GetName], [GetBuilding('library_malta_02').GetName], [GetBuilding('vienna_chantry_02').GetName], [GetBuilding('erciyes_02').GetName] or one of their improved versions"

 request_access_writings_cabirus_decision: "Request Access to the Secret Writings of Cabirus"
 request_access_writings_cabirus_decision_desc: "To pursue our research in means of eternal rebirth, we will need access to the Secret Writings of Cabirus. Thankfully, we can either convince their current owner or use our influence to demand access. However, they may demand a price for such access."
 request_access_writings_cabirus_decision_tooltip: "Perhaps we could request access rather than stealing it"
 request_access_writings_cabirus_decision_confirm: "Let's hear the price"
 request_access_writings_cabirus_decision_effect: "Gain access to the [GetPODArtifactName('writings_cabirus_link')]"

 spell_of_life_stage1_cabirus_phase2_decision: "Speak to Cabirus"
 spell_of_life_stage1_cabirus_phase2_decision_desc: "Books cannot compete with the original author. If we could convince [GetScriptedCharacterByHistoryID('792600').GetFirstName] to help us by appealing to his academic side, we could learn a great deal regarding the [Concept('POD_spell_of_life', 'Spell Of Life')|E]. That being said, we'll need to learn more about magic if we hope to understand his lessons."
 spell_of_life_stage1_cabirus_phase2_decision_tooltip: "Books can't compete with the original."
 spell_of_life_stage1_cabirus_phase2_decision_confirm: "Let's speak with him"
 
 spell_of_life_stage1_cabirus_phase3_decision: "Relieve the Pressure"
 spell_of_life_stage1_cabirus_phase3_decision_desc: "The nearby Tremere are taking up too much of Cabirus' time in their own pursuits of immortality, forcing him to constantly move. If we weakened their influence, he might have more time to aid us, though his concerns regarding Horus would prevent him from giving us the full Spell of Life."
 spell_of_life_stage1_cabirus_phase3_decision_tooltip: "Cabirus is under too much pressure from the Tremere"
 spell_of_life_stage1_cabirus_phase3_decision_confirm: "Let's get back to our lessons"
 spell_of_life_stage1_cabirus_phase3_decision_no_emperor_requirement: "No #TOOLTIP:GAME_TRAIT,tremere,[GetNullCharacter] #L Tremere#!#! or follower of a [GetReligionByKey('codeoftremere_religion').GetName] [faith|E] can hold an Empire [title|E]"
 spell_of_life_stage1_cabirus_phase3_decision_effect: "In time, your relationship with him may allow you to enter [UmbraGlossary('hades')]"

 spell_of_life_stage1_setite_phase1_decision: "Initial Experiments in Rebirth"
 spell_of_life_stage1_setite_phase1_decision_desc: "While there may be multiple ways to achieve eternal rebirth, the [Concept('POD_spell_of_life', 'Spell Of Life')|E] is a proven approach. While all others have been gifted it, such gifts are not the only way to obtain it. As Set and others have tried before you, with enough experimentation and test subjects, we might be able to reverse engineer it on our own.$spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_setite_phase1_decision_tooltip: "The experiments shall continue until my morale improves"
 spell_of_life_stage1_setite_phase1_decision_confirm: "Let the experiments begin..."
 spell_of_life_stage1_setite_phase1_decision_bean_nighe_caul: "Have the $artifact_bean_nighe_caul_name$ equipped"
 spell_of_life_stage1_setite_phase1_decision_mummy_prisoner: "Have at least #color_white 1#! [prisoner|E] that is a [GetTrait('mummy').GetName(GetNullCharacter)]."
 spell_of_life_stage1_setite_phase1_decision_sorcery_prisoner: "Have at least #color_white 5#! [prisoners|E] that #italic could#! learn #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Sorcery#!#! #weak ([GetTrait('bastet').GetName(GetNullCharacter)], [GetTrait('mortal').GetName(GetNullCharacter)], or mortal-like half-splats)#!"
 spell_of_life_stage1_setite_phase1_decision_execution_effect: "All prisoners used for our experiments will die"

 spell_of_life_stage1_setite_phase2_decision: "Convene the Council"
 spell_of_life_stage1_setite_phase2_decision_desc: "Pursuing the [Concept('POD_spell_of_life', 'Spell Of Life')|E] is no small endeavor and will require a great deal of our attention. If we could arrange support from our fellows, then we would have more time and more resources to devote towards our efforts. Even a promise of non-interference would be sufficient."
 spell_of_life_stage1_setite_phase2_decision_tooltip: "Perhaps we could acquire help, or at least prevent interference"
 spell_of_life_stage1_setite_phase2_decision_confirm: "Assemble them!"
 spell_of_life_stage1_setite_phase2_decision_house_head: "#color_white You#! are head of #color_white your#! [house|E]"
 spell_of_life_stage1_setite_phase2_decision_dynasty_members: "At least #color_white 5#! members of the your [dynasty|E] are landed"
 spell_of_life_stage1_setite_phase2_decision_faith_members: "At least #color_white 5#! followers of the your [faith|E] are landed"
 spell_of_life_stage1_setite_phase2_decision_debate: "If you have at least #color_white 5#! members of your [dynasty|E] or [faith|E], you will invite them to a council."

 spell_of_life_stage1_setite_phase3_decision: "Advanced Experiments in Rebirth"
 spell_of_life_stage1_setite_phase3_decision_desc: "We're getting close, very close to the next stage of understanding. However, something about the Spell of Life's core still eludes us. Clearly, we need more texts, more resources, and more test subjects. But, the cost is immaterial. What is a few lives when compared to all eternity, my eternity."
 spell_of_life_stage1_setite_phase3_decision_tooltip: "With sufficient trials and a surplus of expendable lives, even the impossible becomes plausible."
 spell_of_life_stage1_setite_phase3_decision_confirm: "Let the experiments continue..."
 spell_of_life_stage1_setite_phase3_decision_mummies_prisoner: "Have at least #color_white 3#! [prisoner|E] that are $POD_splat_mummy_plural$."
 spell_of_life_stage1_setite_phase3_decision_sorcerer_prisoner: "Have at least #color_white 3#! [prisoners|E] that are a [GetTrait('sorcerer').GetName(GetNullCharacter)] or [GetTrait('theurgist').GetName(GetNullCharacter)]."
 spell_of_life_stage1_setite_phase3_decision_sorcery_prisoner: "Have at least #color_white 10#! [prisoners|E] that #italic could#! learn #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Sorcery#!#! #weak ([GetTrait('bastet').GetName(GetNullCharacter)], [GetTrait('mortal').GetName(GetNullCharacter)], or mortal-like half-splats)#!"
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people: "Imprison any #color_white 1#! of [GetScriptedCharacterByHistoryID('792600').GetFirstName], [GetScriptedCharacterByHistoryID('792593').GetFirstName], [GetScriptedCharacterByHistoryID('790512').GetFirstName], [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetScriptedCharacterByHistoryID('792804').GetFirstName], [GetScriptedCharacterByHistoryID('792605').GetFirstName], a [GetTrait('ferryman').GetName(GetNullCharacter)], or another character that knows part of the Spell of Life #weak (Have more than 15 [trait_level_track_xp|E] in $trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)])#!."
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people_no_mummies: "Imprison any #color_white 1#! of [GetScriptedCharacterByHistoryID('790512').GetFirstName], [GetScriptedCharacterByHistoryID('792870').GetFirstName], a [GetTrait('ferryman').GetName(GetNullCharacter)], or another character that knows part of the Spell of Life #weak (Has at least 16 [trait_level_track_xp|E] in $trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)])#!."



 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner: "Imprison any #color_white 1#! of [GetScriptedCharacterByHistoryID('792600').GetFirstName], [GetScriptedCharacterByHistoryID('792593').GetFirstName], [GetScriptedCharacterByHistoryID('790512').GetFirstName], or another character that has known the full Spell of Life."
 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner_no_mummies: "Imprison any #color_white 1#! of [GetScriptedCharacterByHistoryID('790512').GetFirstName] or another character that has known the full Spell of Life."
 spell_of_life_stage1_setite_phase3_decision_fallback_prisoner: "Imprison any #color_white 1#! of [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetScriptedCharacterByHistoryID('792804').GetFirstName], [GetScriptedCharacterByHistoryID('792605').GetFirstName], a [GetTrait('ferryman').GetName(GetNullCharacter)], or another character that has known the full Spell of Life."
 spell_of_life_stage1_setite_phase3_decision_fallback_prisoner_no_mummies: "Imprison any #color_white 1#! of [GetScriptedCharacterByHistoryID('792870').GetFirstName] a [GetTrait('ferryman').GetName(GetNullCharacter)], or another character that has known the full Spell of Life."
 spell_of_life_stage1_setite_phase3_bonus_xp: "Your extensive experimentation grants #color_white 1.00#! additional passive [trait_level_track_xp|E] in Spell of Life #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"

 spell_of_life_stage4_warning: "\n\n#warning Your chances of success in this quest are absurdly low. Do not attempt it if you care about your character's well being.\nEven saving and reloading your game to chance the odds won't save you.\nYou have been warned.#!"
 spell_of_life_stage4_amenti_decision: "Make Amenti Your Home"
 spell_of_life_stage4_amenti_decision_desc: "The final step to creating the [Concept('POD_spell_of_life', 'Spell Of Life')|E] is tying the spell to a space within the [UmbraGlossaryLocalized('shadowlands','Underworld')] for our souls to reside until they are reborn. While others may need to carve out their own space, our good relations with the First Dynasty of the Undying and their supporters, such as Kemintiri, has presented an easier alternative. If we could journey to the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], we could meet with Osiris' agents and convince them to give us a home within [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')].\n\n#warning This final stage carries some danger, and the Judges of Ma'at will only give you one chance to make your argument.#!"
 spell_of_life_stage4_amenti_decision_tooltip: "Perhaps we can find a home within the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]"
 spell_of_life_stage4_amenti_decision_confirm: "Open the door!"
 spell_of_life_stage4_amenti_decision_wraith_friends: "Has at least 2 [GetTrait('wraith').GetName(GetNullCharacter)] [friends|E] or other positive [relations|E]"
 spell_of_life_stage4_amenti_decision_control_land: "You [hold|E] at least #Z [SCOPE.ScriptValue('POD_mummy_lands_of_faith_target_percent_value')|0]%#! of [counties|E] in the [GetGeographicalRegion('pod_lands_of_faith').GetName] [region|E] (Current: [SCOPE.ScriptValue('POD_mummy_lands_of_faith_percent_value')|0]%)\n"

 spell_of_life_stage4_hades_decision: "Expand and Stabilize Hades"
 spell_of_life_stage4_hades_decision_desc: "The final step to creating the [Concept('POD_spell_of_life', 'Spell Of Life')|E] is tying the spell to a space within the [UmbraGlossaryLocalized('shadowlands','Underworld')] for our souls to reside until they are reborn. After your efforts aiding him, Cabirus has agreed to let you use [UmbraGlossary('hades')] as our [UmbraGlossary('shadow_realm')]. This will remove the need to carve out your own space for the Spell of Life. However, [UmbraGlossary('hades')] isn't as stable as the Egyptian [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and causes massive problems when resurrecting after death. Such issues will only be worsened by the increased number of occupants once you start using it. If you hope to use [UmbraGlossary('hades')], you will need to improve the realm.$spell_of_life_stage4_warning$"
 spell_of_life_stage4_hades_decision_tooltip: "Perhaps we can find a home within [UmbraGlossary('hades')]"
 spell_of_life_stage4_hades_decision_confirm: "Sharpen your swords!"
 spell_of_life_stage4_hades_decision_pomegranate: "You must have [GetPODArtifactName('pomegranate_link')]"

 spell_of_life_stage4_custom_decision: "Carve Out a New Realm"
 spell_of_life_stage4_custom_decision_desc: "The final step to creating the [Concept('POD_spell_of_life', 'Spell Of Life')|E] is tying the spell to a space within the [UmbraGlossaryLocalized('shadowlands','Underworld')] for your souls to reside until they are reborn. Since you lack allies with their own [UmbraGlossary('shadow_realm')], you will need to carve out your own space for the Spell of Life. This will be difficult since the [umbra|E] and all its residents will oppose you.$spell_of_life_stage4_warning$"
 spell_of_life_stage4_custom_decision_tooltip: "Perhaps we can carve out a new [UmbraGlossary('shadow_realm')]"
 spell_of_life_stage4_custom_decision_confirm: "Sharpen your swords!"
 spell_of_life_stage4_custom_decision_wraith_friends: "Has at least 4 [GetTrait('wraith').GetName(GetNullCharacter)] [friends|E] or other positive [relations|E]"
 spell_of_life_stage4_custom_decision_pomegranate: "You must have [GetPODArtifactName('pomegranate_link')]"

 spell_of_life_stage4_success_sol_caveat: "You will receive the full Spell of Life if you succeed"
 spell_of_life_stage4_success_hunted_caveat: "You will receive [GetModifier('hunted_down_eternity_modifier').GetNameWithTooltip] if you succeed"
 POD_mummy_spell_of_life_shemsuheru: "Gain the ability to make Shemsu-heru Mummies"
 POD_mummy_spell_of_life_ishmaelite: "Gain the ability to make Ishmaelite Mummies"
 POD_mummy_spell_of_life_cabiri: "Gain the ability to make Cabiri Mummies"
 POD_mummy_spell_of_life_custom_mummy_dynasty: "Gain the ability to make Mummies of a new Dynasty"

 spell_of_life_abandon_vampirism_decision: "Abandon Vampirism for Eternal Rebirth"
 spell_of_life_abandon_vampirism_decision_desc: "While it might have some advantages, vampirism carries many curses. However, your knowledge offers an alternative form of immortality that bestows fewer downsides: eternal rebirth.\n\nUnfortunately, undead like vampires cannot become mummies. In addition, vampires cannot use magic like the Spell of Life. As such, you will need to find a way to circumvent such issues... and determine whether you are willing. After all, you must die as part of the ritual so you will need to find a trusted person to perform it.\n\n#warning You will become a Mummy which will radically change your gameplay, disable your buildings, and potentially destroy your higher realm titles.\nThis is likely to cripple your campaign if you aren't ready for it.#!"
 spell_of_life_abandon_vampirism_decision.second_step: "How will I achieve it?"
 spell_of_life_abandon_vampirism_decision_confirm: "Begin the ritual"
 spell_of_life_abandon_vampirism_decision_tooltip: "Vampirism has many curses, but alternative sources of immortality exist"
 spell_of_life_abandon_vampirism_decision_kemintiri: "[GetScriptedCharacterByHistoryID('790512').GetFirstName] possesses a unique understanding of mummy magicks, giving [GetScriptedCharacterByHistoryID('790512').GetHerHim] a headstart after joining their ranks"
 spell_of_life_abandon_vampirism_decision.tt.wraith_route: "Via wraithhood\n#low $spell_of_life_abandon_vampirism_decision.tt.wraith_route_desc$#!"
 spell_of_life_abandon_vampirism_decision.tt.wraith_route_desc: "Become a wraith temporarily"
 wraith_route_tooltip: "Use necromancy to temporarily become a wraith before applying the Spell of Life"
 spell_of_life_abandon_vampirism_decision.tt.faith_route: "Via my faith\n#low $spell_of_life_abandon_vampirism_decision.tt.faith_route_desc$#!"
 spell_of_life_abandon_vampirism_decision.tt.faith_route_desc: "Become mortal temporarily"
 faith_route_tooltip: "Use #TOOLTIP:GAME_TRAIT,beatific,[GetNullCharacter] #L my faith#!#! to temporarily become mortal before applying the Spell of Life"
 spell_of_life_abandon_vampirism_decision_hates_being_vampire: "Hate being a [GetTrait('vampire').GetName(GetNullCharacter)]"
 spell_of_life_abandon_vampirism_decision.tt.wraith_maker_succeeds: "You have been successfully resurrected, leaving you a wraith"
 spell_of_life_abandon_vampirism_decision.tt.wraith_maker_betrays: "You have been betrayed, leaving you a bound wraith"
 spell_of_life_abandon_vampirism_decision.tt.mummy_maker_betrays: "You have been betrayed, leaving you a wraith"
 spell_of_life_abandon_vampirism_decision_sh_mode: "Must find the mixing of splats interesting and possible"
 spell_of_life_abandon_vampirism_decision_crazy: "Must be crazy, hate yourself, or be a zealot"
 spell_of_life_abandon_vampirism_decision_religion: "Must follow a religion that prioritizes experimentation or views vampirism as a curse"
 spell_of_life_abandon_vampirism_decision_beatific_xp: "Have #color_white 100#! [GetTrait('beatific').GetName(GetNullCharacter)] [trait_level_track_xp|E]"
 spell_of_life_abandon_vampirism_decision_effects: "If you are not betrayed #weak (determined by the necromancer's and Spell caster's opinion of you) #!, you will become a mummy"
 spell_of_life_abandon_vampirism_decision_sol_learner: "At least #color_white 1#! [courtier|E] must be capable of understanding the Spell of Life."
 spell_of_life_abandon_vampirism_decision_sol_learner_ex: "$spell_of_life_abandon_vampirism_decision_sol_learner$ #weak ([mummy_maker.GetFirstName])#!"
 spell_of_life_abandon_vampirism_decision_sol_knower: "At least #color_white 1#! [courtier|E] must know the Spell of Life."
 spell_of_life_abandon_vampirism_decision_sol_knower_ex: "$spell_of_life_abandon_vampirism_decision_sol_knower$ #weak ([mummy_maker.GetFirstName])#!"
 spell_of_life_abandon_vampirism_decision_wraith_summoner: "At least #color_white 1#! [courtier|E] can summon a wraith."
 spell_of_life_abandon_vampirism_decision_wraith_summoner_ex: "$spell_of_life_abandon_vampirism_decision_wraith_summoner$ #weak ([wraith_maker.GetFirstName])#!"
 POD_newborn_mummy_modifier: "Newborn"
 POD_newborn_mummy_modifier_desc: "#help Will be lost upon death#!\nYou are new to the world of $POD_splat_mummy_plural$. You haven't yet passed through the cycle of rebirth or spent long in your new form."

 spell_of_life_give_to_horus_decision: "Surrender Spell of Life to Horus"
 spell_of_life_give_to_horus_decision_desc: "Tenet 6 of the Code of Horus prohibits usage of the Spell of Life or creation of new mummies. If you were a loyal follower of Horus, you would turn all of your research over to him and allow him to remove the knowledge from your memories. Such a gift will likely redeem you in his eyes for any banned actions you may have taken. In addition, Horus has always rewarded great deeds in accordance with the services rendered."
 spell_of_life_give_to_horus_decision_confirm: "Request an audience"
 spell_of_life_give_to_horus_decision_tooltip: "A loyal Shemsu-heru would surrender their Spell of Life"
 spell_of_life_decision_must_know_sol: "Know the full Spell of Life #weak (Have 100 [trait_level_track_xp|E] in $trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)])#!"

 spell_of_life_give_to_kemintiri_decision: "Use Spell of Life on Kemintiri"
 spell_of_life_give_to_kemintiri_decision_desc: "Once a priestess of Isis, Kemintiri was only embraced by Set to punish her for her loyalty. Since that moment, she has spent a considerable amount of time hunting Setites. Loyal to Isis' teachings, she was unwilling to give you the Spell of Life just for her own sake. However, given your friendship with her and your new-found knowledge of the Spell, it would not be difficult to convince her to let you cast the Spell of Life upon her."
 spell_of_life_give_to_kemintiri_decision_confirm: "Let's speak with Isis' last priestess"
 spell_of_life_give_to_kemintiri_decision_tooltip: "Once embraced to torture her, Kemintiri may be interested in a way to leave her vampirism behind"

 spell_of_life_give_to_set_decision: "Give Spell of Life to Set"
 spell_of_life_give_to_set_decision_desc: "Set has spent millennia searching for the Spell of Life and concocted an incredible number of plots to steal it. Where he failed, you succeeded and now have the opportunity to give it to him. Provided you are sufficiently subservient, he will be grateful and will reward you greatly rather than punishing you out of jealousy."
 spell_of_life_give_to_set_decision_confirm: "I am Set's servant"
 spell_of_life_give_to_set_decision_tooltip: "Set seeks the Spell of Life, and you have the opportunity to give it to him."

 spell_of_life_give_to_apophis_decision: "Serving the World on a Golden Platter"
 spell_of_life_give_to_apophis_decision_desc: "[UmbraGlossaryLocalized('oblivion','Apophis')] seeks the Spell of Life. Serve the Spell at a feast and watch as the world is consumed by the Spell of Life's magic. It is time for [UmbraGlossaryLocalized('oblivion','Apophis')] to feast upon the world."
 spell_of_life_give_to_apophis_decision_confirm: "The end is here"
 spell_of_life_give_to_apophis_decision_tooltip: "Apophis' feast"
 spell_of_life_give_to_apophis_decision_prisoners: "Obtain at least #color_white 25#! prisoners with at least #color_white 50#! [prowess|E] to feast upon"

 spell_of_life_find_new_home_decision: "Finding a New Home"
 spell_of_life_find_new_home_decision_desc: "After a great deal of research, you have obtained a version of the Spell of Life. However, it is designed to tether souls to a different [UmbraGlossary('shadow_realm')] than you travel to upon death. While you can't modify the Spell of Life to utilize the same [UmbraGlossary('shadow_realm')] as your own soul, you should be able to rebind your soul to another realm by recasting the Spell of Life upon yourself, with a slight modification."
 spell_of_life_find_new_home_decision_confirm: "To new beginnings!"
 spell_of_life_find_new_home_decision_tooltip: "Your Spell of Life is tied to a different Shadow Realm than your own soul."

 spell_of_life_stabilize_new_realm_decision: "Stabilize [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]"
 spell_of_life_stabilize_new_realm_decision_desc: "Unlike the more-established [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], your newly-founded [UmbraGlossary('shadow_realm')] lacks a degree of stability. Resurrection is a dangerous journey with many risks. Without judges, new Undying can be created and act without oversight. [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] must be stabilized."
 spell_of_life_stabilize_new_realm_decision_confirm: "I shall take up the gavel"
 spell_of_life_stabilize_new_realm_decision_tooltip: "Our own place to rest"
 spell_of_life_stabilize_new_realm_decision_wraith_friends: "Has at least 5 [GetTrait('wraith').GetName(GetNullCharacter)] [friends|E] or other positive [relations|E]"
 spell_of_life_stabilize_new_realm_decision_faith_followers: "There are at least 10 followers of [GetFaithByKey('custom_mummy_dynasty').GetName]"
 spell_of_life_stabilize_new_realm_decision_effect1: "All [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy_plural$ will no longer receive double Memory loss after death"
 spell_of_life_stabilize_new_realm_decision_effect2: "All [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy_plural$ will gain [GetTrait('integrity').GetName(GetNullCharacter)]"

 spell_of_life_preserving_roots_decision: "Preserving Our Roots"
 spell_of_life_preserving_roots_decision_desc: "[GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] was founded upon a certain culture within a certain land, infusing these characteristics into [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] and irreversibly binding the [UmbraGlossary('shadow_realm')] to that particular cultural memory. Yet, with every passing year, what was once a great civilization is slowly being lost to the sands of time. We cannot allow that, for our memories are what makes us human and what preserves our new home."
 spell_of_life_preserving_roots_decision_confirm: "Remaining in the minds of mortals"
 spell_of_life_preserving_roots_decision_tooltip: "Keeping our hearts alive"
 spell_of_life_preserving_roots_decision_custom1: "There must be at least #V 10#! counties with your [culture|E]"
 spell_of_life_preserving_roots_decision_custom2: "There must be at least #V 5#! $POD_splat_mummy$ rulers of your [culture|E]"
 spell_of_life_preserving_roots_decision_effect1: "[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy_plural$ will resurrect twice as fast #weak (5 years instead of 10)#!"

 spell_of_life_establish_ourselves_decision: "The Fifth Dynasty"
 spell_of_life_establish_ourselves_decision_desc: "We rediscovered the Spell of Life. We created a new [UmbraGlossary('shadow_realm')], [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]. We founded the [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] from that Spell based in that realm. However, the Shemsu-Heru, Ishmaelites, Cabiri, and Apepnu view us as little more than upstarts, interfering in a game we are too young to understand.\n\nHow little they know. We shall surpass the ancient fools. We shall prove ourselves worthy of being numbered among them!"
 spell_of_life_establish_ourselves_decision_confirm: "We are the Fifth Dynasty!"
 spell_of_life_establish_ourselves_decision_tooltip: "Today, upstarts. Tomorrow, conquerors!"
 spell_of_life_establish_ourselves_decision_custom1: "There must be at least #V 25#! counties with [GetFaithByKey('custom_mummy_dynasty').GetName] [faith|E]"
 spell_of_life_establish_ourselves_decision_custom2: "There must be at least #V 5#! [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy$ rulers"
 spell_of_life_establish_ourselves_decision_effect1: "All [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy_plural$ will gain [GetModifier('custom_mummy_dynasty_secured_future_modifier').GetNameWithTooltip]"

 spell_of_life_joining_the_league_decision: "Joining the League"
 spell_of_life_joining_the_league_decision_desc: "Despite supporting his cause, Horus will not forgive your existence. However, alternatives exist.\n\nWhen last he was absent for a time, his followers became corrupt and started to lose the war. Should that happen again, they would welcome you with open arms, and upon his return, Horus may be reluctant to expel you. Perhaps you could hurry such things along."
 spell_of_life_joining_the_league_decision_confirm: "Thank you for your welcome"
 spell_of_life_joining_the_league_decision_tooltip: "We should consider joining the Osirian League"
 spell_of_life_joining_the_league_decision_custom1: "There mustn't be any [GetTrait('shemsuheru').GetName(GetPlayer)] $POD_splat_mummy_plural$ of the [GetFaithByKey('code_of_horus').GetName] [faith|E] whose [opinion|E] of you is below #V 25#!"
 spell_of_life_joining_the_league_decision_custom1_ex: "$spell_of_life_joining_the_league_decision_custom1$ #weak ([example.GetFirstName])#!"

 spell_of_life_ending_the_hunt_decision: "Ending the Hunt"
 spell_of_life_ending_the_hunt_decision_desc: "Too many seek your head, your knowledge, or both. If you could eliminate the leaders of the most powerful factions and most of the seekers, you could end this threat to your existence. No longer would you constantly have to look over your shoulder, waiting for the next group to hunt you down. As an ancillary benefit, the deaths of such critical individuals would throw their factions into chaos, leaving room for you to secure your power."
 spell_of_life_ending_the_hunt_decision_confirm: "Peace at last..."
 spell_of_life_ending_the_hunt_decision_tooltip: "Could the hunt finally end?"
 spell_of_life_ending_the_hunt_decision_custom1: "There mustn't be any #TOOLTIP:GAME_TRAIT,eternal_rebirth_seeker,[GetNullCharacter] #L Seekers of Eternal Life#!#! that are not $POD_splat_mummy_plural$"
 spell_of_life_ending_the_hunt_decision_custom1_ex: "$spell_of_life_ending_the_hunt_decision_custom1$ #weak ([example.GetFirstName])#!"
 spell_of_life_ending_the_hunt_decision_custom2: "You must have more [prowess|E] than [GetScriptedCharacterByHistoryID('505094').GetFirstName] #weak (#V [GetPlayer.GetProwess]#! vs #V [GetScriptedCharacterByHistoryID('505094').GetProwess]#!)#!"

 spell_of_life_correcting_your_form_decision: "Correcting Your Form"
 spell_of_life_correcting_your_form_decision_desc: "You have obtained an enhanced lifespan through an incomplete form of immortality-granting magic. As your knowledge of the magic has increased, the possibility arises to correct your otherwise-flawed form and improve your current source of immortality. Unfortunately, such magics only allow you to improve your own form rather than enhancing the flawed bodies of others."
 spell_of_life_correcting_your_form_decision_confirm: "Nothing shall hold me back"
 spell_of_life_correcting_your_form_decision_tooltip: "Your immortality could use some improvements"



 elixir_of_eternal_life_starter_decision: "Quest for the [Concept('POD_elixir_of_eternal_life', 'Elixir Of Eternal Life')|E]"
 elixir_of_eternal_life_starter_decision_desc: "For many, the Elixir of Eternal Life was gifted to them by the 8 Immortals or by their servants, the Wu T'ian. However, tales tell of those that achieved such a state of enlightenment, and the accompanying immortality, without their aid. Many deem such a feat impossible. As the Master himself said, although the deaf cannot hear thunder or appreciate music, and the sun and splendor of the Emperor's robes are invisible to the blind, it does not mean these things do not exist. Some say that obtaining the Elixir yourself is a test to demonstrate that you are worthy of it. Others say that it is the Heavens giving you the choice of whether to damn yourself.\n\n#R Your chances of success in this quest are absurdly low. Do not attempt it if you care about your character's well being.\nEven saving and reloading your game to chance the odds won't save you later on. You have been warned.#!"
 elixir_of_eternal_life_starter_decision_tooltip: "The Elixir of Eternal Life could grant us immortality without downsides."
 elixir_of_eternal_life_starter_decision_confirm: "Let us begin"
 elixir_of_eternal_life_stage1_unlock_next_phase: "Unlocks next step in the current path"
 elixir_of_eternal_life_stage1_unlock_next_phase_caveat: "$spell_of_life_stage1_unlock_next_phase$ if you succeed"
 elixir_of_eternal_life_stage1_do_multiple_stages: "#help \n\nWhile more difficult, you may find that completing a path offers additional rewards at a later point.#!"
 elixir_of_eternal_life_stage1_warning: "\n\n#R Be prepared to sacrifice everything in the quest for true immortality, for the path is fraught with danger!#!"

 elixir_of_eternal_life_request_aid_decision: "Request Aid"
 elixir_of_eternal_life_request_aid_decision_desc: "You have already achieved what few even considered possible: safeguarding the Middle Kingdom against the [Glossary('Demon Emperor','podgloss.demonemperor')]'s rise. In so doing, you were elevated to join the Eight Immortals that govern the Wu T'ian. Now that you seek the the Elixir of Eternal Life, the Eight may be willing to aid you."
 elixir_of_eternal_life_request_aid_decision_confirm: "I shall seek their guidance"
 elixir_of_eternal_life_request_aid_decision_tooltip: "As the Ninth Immortal, the others may be willing to aid my latest quest"
 elixir_of_eternal_life_ninth_immortal_bonus_xp: "Whenever you complete a [journey|E], the Eight Immortals' insights grant #color_white 5.00#! additional [trait_level_track_xp|E] in Elixir of Eternal Life #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"


 elixir_of_eternal_life_remove_bad_traits_decision: "Inner Mastery"
 elixir_of_eternal_life_remove_bad_traits_decision_tooltip: "Discipline forged through hardship, clarity born of turmoil."
 elixir_of_eternal_life_remove_bad_traits_decision_desc: "The burdens I carry need not define me. Where once I faltered under strain, I now see opportunity.\n\nI will no longer indulge destructive habits. Instead, I shall master myself."
 elixir_of_eternal_life_remove_bad_traits_decision_confirm: "I am the master of myself."
 elixir_of_eternal_life_remove_bad_traits_decision_effect: "The traits will be replaced by new ones"

 elixir_of_eternal_life_stage1_internal_phase1_decision: "Refine Essence Into Breath"
 elixir_of_eternal_life_stage1_internal_phase1_decision_desc: "While pursuing the [Concept('POD_elixir_of_eternal_life', 'Elixir of Eternal Rebirth')|E], each of the three main components of the cosmos and the human being – spirit, breath, and essence – is reintegrated into the previous one. This is done to invert the sequence in which they come forth from the Tao, and thereby return to the inception of the process. Through such a return, breath is stored, and the knots of death can be untied.\n\nTo begin, the inner essence of the mind must be refined, concentrated, and coagulated to conceive an internal embryo made of breath.$elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_internal_phase1_decision_tooltip: "Reintegrate essence into breath to return to the inception of the process."
 elixir_of_eternal_life_stage1_internal_phase1_decision_confirm: "So it begins"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_stress: "You have #color_white 0#! [stress|E]"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_illness: "You do #bold not#! have any illnesses"

 elixir_of_eternal_life_stage1_internal_phase2_decision: "Refine Breath Into Spirit"
 elixir_of_eternal_life_stage1_internal_phase2_decision_desc: "With the embryo of rebirth conceived, it is time to continue refining and unifying the triple inner forces. All of the illnesses and ailments of your form come from the nodes that block circulation of breath and squeeze the 5 viscera. The proper internal circulation of one's hidden breath, uninhibited by the body, will cure such troubles. Like all other matter, your breath must flow cyclically, forming a never-ending pattern. The process integrates various physical movements including bending, expanding, contracting, and extending, along with breathing techniques."
 elixir_of_eternal_life_stage1_internal_phase2_decision_tooltip: "Reintegrate breath into spirit to return to the inception of the process."
 elixir_of_eternal_life_stage1_internal_phase2_decision_confirm: "The second becomes the first"

 elixir_of_eternal_life_stage1_internal_phase3_decision: "Refining Spirit to Return to Emptiness"
 elixir_of_eternal_life_stage1_internal_phase3_decision_desc: "As your spirit is refined, your organs will be transmuted into gold and jade, one after another. Your breath becomes as of sulfur and your blood as of cinnabar. Given time, isolation, and self-examination, your spirit purifies into nothingness until your body is left empty. Where the ignorant see the end in emptiness, you see the potential of infinite connectivity.\n\nIf all things do not have emptiness in the center, if they do not have form as substance, if yin does not have yang, how can they come into being? Know the light and hold on to the dark. This is the secret of existence, a secret known to few and now... known by you."
 elixir_of_eternal_life_stage1_internal_phase3_decision_tooltip: "Return to the inception of the process."
 elixir_of_eternal_life_stage1_internal_phase3_decision_confirm: "The first returns to the Tao"
 elixir_of_eternal_life_stage1_internal_phase3_decision_requirement_schemes: "You need to have #color_white 0#! active [schemes|E]"

 elixir_of_eternal_life_stage1_external_phase1_decision: "Collecting the the Gold Flowers & Jade Dew"
 elixir_of_eternal_life_stage1_external_phase1_decision_desc: "Your experiments and rituals to create the [Concept('POD_elixir_of_eternal_life', 'Elixir of Eternal Rebirth')|E] will require a vast number of ingredients, not all of which grow in your homeland. You will need ready access to these ingredients and their native biomes if you hope to complete your quest. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_external_phase1_decision_tooltip: "Ingredients must be harvested from many places"
 elixir_of_eternal_life_stage1_external_phase1_decision_confirm: "Transplant them to my gardens"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_desert: "Your territory contains a province of Drylands, Desert, or Desert Mountains [terrain|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cold: "Your territory contains a province of Mountains or Taiga [terrain|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cultivated: "Your territory contains a province of Farmlands or Terraced Hills [terrain|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_water: "Your territory contains a province of Floodplains or Oasis [terrain|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_forest: "Your territory contains a province of Forest or Hills [terrain|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_wet_forest: "Your territory contains a province of Jungle or Wetlands [terrain|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_plains: "Your territory contains a province of Plains or Steppe [terrain|E]"

 elixir_of_eternal_life_stage1_external_phase2_decision: "Prepare Emberglow Infusion"
 elixir_of_eternal_life_stage1_external_phase2_decision_desc: "With the herbal ingredients collected, it is time to prepare the Emberglow Infusion. To brew it, you will need to collect a variety of items that enhance different parts of your physical body. Should you be willing to explore it, alternative ingredients could be harvested from the [umbra|E]."
 elixir_of_eternal_life_stage1_external_phase2_decision_tooltip: "To continue, you must collect a variety of ingredients"
 elixir_of_eternal_life_stage1_external_phase2_decision_confirm: "First, grind wyvern claw and nine-stalked mushroom together..."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bygones: "You have at least 1 Greater or Potent [POD_bygones_maa|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_umbra_aptitude: "You have #V 200%#! [umbra_aptitude|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bound_wraith_skills: "The total sum of your bound $POD_splat_wraith_plural$' skills must exceed #V 150#!"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_can_use: "#color_white You#! can use the artifact"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_health: "Has a modifier that gives a boost to [health|E] or a boost to disease resistance"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_diplomacy: "Has a modifier that increases [diplomacy|E] or negates [diplomacy|E] penalties"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_martial: "Has a modifier that increases [martial|E] or negates [martial|E] penalties"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_stewardship: "Has a modifier that increases [stewardship|E] or negates [stewardship|E] penalties"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_intrigue: "Has a modifier that increases [intrigue|E] or negates [intrigue|E] penalties"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_learning: "Has a modifier that increases [learning|E] or negates [learning|E] penalties"

 elixir_of_eternal_life_stage1_external_phase3_decision: "Concoct Violet Gold Elixir"
 elixir_of_eternal_life_stage1_external_phase3_decision_desc: "With the infusion's completion, the next step involves concoting the Violet Gold Elixir within the heart of a dragon nest. The Heavenly Amethyst Soul Orchid is necessary and can only be obtained from the [UmbraGlossary('heavenly_flower_garden')]. For the other ingredients, you could mix together the contents of other potions and extract the properties of potent items. Alternatively, pacts with certain spirits could provide the components and magic needed."
 elixir_of_eternal_life_stage1_external_phase3_decision_tooltip: "This elixir has rather unusual ingredient requirements."
 elixir_of_eternal_life_stage1_external_phase3_decision_confirm: "Leave the petals in a bath of grass wine for..."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_health: "Has a modifier that gives a substantial boost to [health|E] or a substantially boost to disease resistance"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_diplomacy: "Has a modifier that substantially increases [diplomacy|E] or substantially negates [diplomacy|E] penalties"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_martial: "Has a modifier that substantially increases [martial|E] or substantially negates [martial|E] penalties"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_stewardship: "Has a modifier that substantially increases [stewardship|E] or substantially negates [stewardship|E] penalties"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_intrigue: "Has a modifier that substantially increases [intrigue|E] or substantially negates [intrigue|E] penalties"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_learning: "Has a modifier that substantially increases [learning|E] or substantially negates [learning|E] penalties"

 elixir_of_eternal_life_stage1_nourishing_phase1_decision: "One Vision, One Purpose"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_desc: "Before one can nourish their [Concept('POD_elixir_of_eternal_life', 'inner life')|E], they must nourish the lives of those around them. Unlike the bellow breathers, a true follower of the Tao seeks immortality alongside and to benefit their family and community. One hand struggles where many hands build, and endless life comes from a fruitful connection with all of creation. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_tooltip: "Let us stand as one"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_confirm: "Together we stand; alone we fall."
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_development: "Your realm contains at least 100 [development|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_prisoners: "You do #bold not#! have any [prisoners|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_dread: "You have less than #color_white 10#! [dread|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_vassals: "All your powerful vassals have at least #color_green 20#! opinion of you."

 elixir_of_eternal_life_stage1_nourishing_phase2_decision: "Breaths Conjoined"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_desc: "With the lives of others enhanced, it is time to turn your eyes inward, towards cultivating your inner life. You must generate an inner embryo that is unaffected by death and is the seed of your future rebirth. Where others seek to refine their inner breath, you know of an alternate path. To give birth to an embryo, you must stimulate and exchange your qi with another. Yin must meet with yang."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_tooltip: "Yin must meet with yang."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_confirm: "Two breaths must become one"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_relations: "You have at least #color_white 1#! [spouse|E], [concubine|E], or [lover|E]"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_skills: "All your [spouses|E] have an average of all skills of at least #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_opinions: "All your [spouses|E] have at least #color_green 25#! opinion of you."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_skills: "All your [concubines|E] have an average of all skills of at least #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_opinions: "All your [concubines|E] have at least #color_green 25#! opinion of you."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_skills: "All your [lovers|E] have an average of all skills of at least #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_opinions: "All your [lovers|E] have at least #color_green 25#! opinion of you."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_high_skill: "At least #color_white 1#! [spouse|E], [concubine|E], or [lover|E] has an average of all skills of at least #color_white 25#!."

 elixir_of_eternal_life_stage1_nourishing_phase3_decision: "Destination Without Journeying"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_desc: "A pursued goal is never reached. The sage does not act, yet nothing is left undone. Rooted in stillness, the myriad things flourish. Wealth and life flow and are not hoarded. Like water, the sage benefits all life without being noticed. They flow even to the lowliest places where no one chooses to be, unchanged and constant yet capable of reshaping the landscape."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_tooltip: "Without acting, nothing is left undone"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_confirm: "I could act but choose not to do so"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_child_count: "You have at least #color_white 5#! children"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_skills: "All your [friends|E] have an average of all skills of at least #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_lowborn: "At least #color_white 1#! [friend|E] is [lowborn|E] or has a [prestige_level|E] of @prestige_level_1_icon! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L] or below."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_income: "You have a [gold_i] [gold|E] [income|E] of at least #color_white 10#!."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_gold_hoard: "You have at most [gold_i] #color_white 250#! [gold|E]."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_lifestyle_perks: "Sum of [diplomacy_lifestyle|E], [martial_lifestyle|E], [stewardship_lifestyle|E], [intrigue_lifestyle|E], [learning_lifestyle|E] perk points is at least #color_white 10#!"

 elixir_of_eternal_life_stage2_meditation_decision: "Meditations Upon Eternity"
 elixir_of_eternal_life_stage2_meditation_decision_tooltip: "Meditating upon what you've learned could deepen your understanding."
 elixir_of_eternal_life_stage2_meditation_decision_desc: "While research and study are important, nothing can surpass meditating in seclusion upon the lessons you've learned. The path ahead may be slow and demanding for it is no simple matter to consider such deep matters. However, the teachings will be reinforced, the concepts refined."
 elixir_of_eternal_life_stage2_meditation_decision_confirm: "It is time to cultivate."
 elixir_of_eternal_life_stage2_meditation_decision_effect: "You will select a place to meditate and [journey|E] there"

 elixir_of_eternal_life_stage4_internal_decision: "Perfect Balance"
 elixir_of_eternal_life_stage4_internal_decision_tooltip: "I shall balance myself before ultimately stilling my heart."
 elixir_of_eternal_life_stage4_internal_decision_desc: "When the time is right, you will complete what you began so long ago. Beginning on the anniversary of your conception, you shall untie the knots of death. As time passes, your heart, spleen, lungs, liver, and kidneys shall become as jade. Upon the hour of your birth, you shall still your heart with but a thought. So shall your physical tethers be severed, for that which is fettered by the earthly can never become celestial. So shall your spirit ascend, for that which is mortal can never truly be refined. Should the Eight Immortals see fit to grant you the Elixir, you will return to a new form fitting for a servant of the August Personage of Jade.\n\n#N Should you fail, the Eight Immortals will not grant you another audience for a hundred years, ensuring your growth.#!"
 elixir_of_eternal_life_stage4_internal_decision_confirm: "I shall isolate myself."
 elixir_of_eternal_life_stage4_internal_decision_skills: "No [skill|E] is more than #color_white 10#! above the average of your [skills|E] #weak ([GetPlayer.MakeScope.ScriptValue('average_of_all_skills')])#!"

 elixir_of_eternal_life_stage4_external_decision: "Brewing the Nine-times Cycled Elixir"
 elixir_of_eternal_life_stage4_external_decision_tooltip: "I shall brew the perfect elixir so that I may speak with the Eight Immortals."
 elixir_of_eternal_life_stage4_external_decision_desc: "The time has come to brew the final elixir needed. You will need to climb the highest peak on an auspicious day and perfectly brew an elixir made from many exotic ingredients, including components of bygone creatures. No missteps may occur. No trial runs are possible. Those deemed righteous by the Eight Immortals shall return to a body made new.\n\n#N Should you fail, the Eight Immortals will not grant you another audience for a hundred years, ensuring your growth.#!"
 elixir_of_eternal_life_stage4_external_decision_confirm: "Let's begin the climb."
 elixir_of_eternal_life_stage4_external_decision_bygones: "You have at least 3 different Greater or Potent [POD_bygones_maa|E] #weak ([GetPlayer.MakeScope.ScriptValue('number_maa_regiments_greater_and_potent_bygones')])#!"

 elixir_of_eternal_life_stage4_nourishing_decision: "Birthing the Embryonic Immortal"
 elixir_of_eternal_life_stage4_nourishing_decision_tooltip: "Together, we shall begin the ritual of transcendence."
 elixir_of_eternal_life_stage4_nourishing_decision_desc: "You do not transcend alone; others midwife your rebirth. When the time comes, your trusted coterie will begin the rather intimate ritual of transcendence. After you kill yourself with a personally-crafted ceremonial weapon that dislodges your seat of life, they will continue the ritual. They will paint symbols on your corpse, dress you in a special garment, and place your corpse upon the locus of chi. Until the sun next sets or rises, they will meditate, pray, and chant to prepare the way for your return. No doubt you will return in triumph, having swayed the Eight Immortals\n\n#N Should you fail, the Eight Immortals will not grant you another audience for a hundred years, ensuring your growth.#!"
 elixir_of_eternal_life_stage4_nourishing_decision_confirm: "Prepare the ritual."
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_size: "Your [GetPlayer.Custom('PODCoterie')] has [EmptyScope.ScriptValue('coterie_max_size')] members"
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_skills: "Your [GetPlayer.Custom('PODCoterie')] must have at least 25 in all [skills|E]"

 elixir_of_eternal_life_stage4_success_sol_caveat: "You will receive the full Elixir of Eternal Life if you succeed"



 spell_of_life_coterie_diplomacy_duel: "[diplomacy_i] [GetPlayer.Custom('PODCoterie')] [diplomacy|E] Challenge:"
 spell_of_life_coterie_martial_duel: "[martial_i] [GetPlayer.Custom('PODCoterie')] [martial|E] Challenge:"
 spell_of_life_coterie_stewardship_duel: "[stewardship_i] [GetPlayer.Custom('PODCoterie')] [stewardship|E] Challenge:"
 spell_of_life_coterie_intrigue_duel: "[intrigue_i] [GetPlayer.Custom('PODCoterie')] [intrigue|E] Challenge:"
 spell_of_life_coterie_learning_duel: "[learning_i] [GetPlayer.Custom('PODCoterie')] [learning|E] Challenge:"
