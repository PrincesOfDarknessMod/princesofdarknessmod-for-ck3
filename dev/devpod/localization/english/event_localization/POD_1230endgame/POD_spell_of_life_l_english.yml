 POD_mummy_elixir_of_eternal_life.003.t: "One Part Done, Another Begun"
 POD_mummy_elixir_of_eternal_life.003.desc: "Having achieved a basic understanding of the Elixir of Eternal Life, your original path is no longer sufficient for your continued growth. To create the Elixir, one must understand themselves and the universe within which they live. To accomplish this, You will need to journey around the world to collect ancient records, to learn from the failures of others, and to meditate upon the lessons you've collected. In addition, you will need to spend time conducting research, slowly translating records, brewing potions, and reinforcing your cultivation base.\n\n#help To reach 90 [trait_level_track_xp|E] in Elixir of Eternal Life and progress further, you will need to accumulate it passively and do [journeys|E]. See [Concept('POD_elixir_of_eternal_life', 'this tooltip')|E] and the description of the Eternal Rebirth Seeker trait under your character to learn more.#!"
 POD_mummy_elixir_of_eternal_life.003.a: "My quest is not yet over..."

 POD_mummy_elixir_of_eternal_life.100.t: "Forever-Binding Vitriol"
 POD_mummy_elixir_of_eternal_life.100.desc: "A man in a perfectly tailored suit walks into your throne room, bypassing your guards. His hair is slicked back and so smooth and perfectly molded that it looks like a helmet placed upon his head. The pieces of metallic machinery protruding through his flesh only serves to enhance the crafted image.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Mikaboshi','podgloss.mikaboshi')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [Glossary('Wicked City','podgloss.wickedcity')] and use your knowledge to create a force of Wu Kuei, mummies working towards the creation of a machine state. In exchange, he will help you transform your realm into one of mundanity and robotic work, maximizing profitability, minimizing losses, and continually innovating. The agent does not advise that you decline such a generous offer."
 POD_mummy_elixir_of_eternal_life.100.a: "A deal worth making"
 POD_mummy_elixir_of_eternal_life.100.b: "You will never have my soul!"
 POD_mummy_elixir_of_eternal_life.100.c: "My soul is already forfeit"
 POD_mummy_elixir_of_eternal_life.100.d: "My mastery of magic renders your powers useless here"
 POD_mummy_elixir_of_eternal_life.100.d.tt: "Having brewed many potions and interacted with the [umbra|E], you can resist their infernal powers"
 POD_mummy_elixir_of_eternal_life.100.effect.success: "You resist the agent's assault"
 POD_mummy_elixir_of_eternal_life.100.effect.failure: "The assault overcomes your mind"
 POD_eoel_mikaboshi_boon_modifier: "[Glossary('Mikaboshi','podgloss.mikaboshi')]'s Boon"
 POD_eoel_mikaboshi_boon_modifier_desc: "The Lord of the [Glossary('Wicked City','podgloss.wickedcity')] knows how to squeeze as much profit from a region as possible."

 POD_mummy_elixir_of_eternal_life.101.desc: "A pock-marked woman covered in ever-oozing pustules walks into your throne room, bypassing your guards. Her hair is slick with pus, and her skin is covered with a sheen of sweat. An acidic tang fills the air, burning your nose hairs.\n\nShe introduces herself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [GetFaithByKey('thousandhells_tou_shen').GetName]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Feverish Hell and use your knowledge to create a force of Wu Kuei, mummies working towards the spread of smallpox. In exchange, he will help you transform your realm into one of disease where pestilence and fear are profitable. He's willing to offer quite a bit for the chance to overcome Rangda. The agent does not advise that you decline such a generous offer."
 POD_eoel_tou_shen_boon_modifier: "Tou Shen's Boon"
 POD_eoel_tou_shen_boon_modifier_desc: "The Lord of the Feverish Hell knows how to transform fear into profit."

 POD_mummy_elixir_of_eternal_life.102.desc: "A man in bushi-style armor walks into your throne room, bypassing your guards. A clipboard rests in his hand, and a bundle of rope and a whip laced with glass shards hang from his belt.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Wu Hua','podgloss.wuhua')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Pit of Salt and Iron and use your knowledge to create a force of Wu Kuei, mummies working towards perfect efficiency. In exchange, he will help you transform your realm into one of good order, peak production, and endless bureaucracy. The agent does not advise that you decline such a generous offer. After all, [Glossary('Wu Hua','podgloss.wuhua')] always rewards the loyal and destroys the disobedient."
 POD_eoel_wu_hua_boon_modifier: "[Glossary('Wu Hua','podgloss.wuhua')]'s Boon"
 POD_eoel_wu_hua_boon_modifier_desc: "The Lord of the Pit of Salt and Iron well knows that obedient slaves are profitable slaves."

 POD_mummy_elixir_of_eternal_life.110.t: "Ever-Shifting Sludge"
 POD_mummy_elixir_of_eternal_life.110.desc: "A hunched man seemingly crafted from blackened iron walks into your throne room, bypassing your guards. His three multi-faceted eyes glow with the red of a desert at twilight. Sand flows out of the joints, leaving a trail behind the creature.\n\nIt introduces itself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] [Glossary('Tou Mu','podgloss.toumu')]. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossary('hell_of_being_skinned_alive')] and use your knowledge to create a force of Wu Kuei, mummies working towards her ascension to the throne of the [Glossary('Demon Emperor','podgloss.demonemperor')]. In exchange, she will help you obtain revenge against all that wronged you, surpassing them in glory and torturing them for all eternity. Then, she will grant you a quick death, a kindness compared to the world she will usher into being. The agent does not advise that you decline such a generous offer."
 POD_mummy_elixir_of_eternal_life.110.a: "We can come to an arrangement"
 POD_mummy_elixir_of_eternal_life.110.b: "You will never have my soul!"
 POD_mummy_elixir_of_eternal_life.110.c: "My soul is already forfeit"
 POD_mummy_elixir_of_eternal_life.110.d: "I have nourished my realm. You have no power here"
 POD_mummy_elixir_of_eternal_life.110.d.tt: "Having mastered your realm and family, you can resist their infernal powers"
 POD_mummy_elixir_of_eternal_life.110.effect.success: "You resist the agent's assault"
 POD_mummy_elixir_of_eternal_life.110.effect.failure: "The assault overcomes your mind"
 POD_eoel_tou_mu_boon_modifier: "[Glossary('Tou Mu','podgloss.toumu')]'s Boon"
 POD_eoel_tou_mu_boon_modifier_desc: "The Lord of the [UmbraGlossary('hell_of_being_skinned_alive')] has mastered the art of retaining an iron grip over her domain."

 POD_mummy_elixir_of_eternal_life.111.desc: "A man engulfed with shadows that seemingly glow and yet consume light fades into your throne room, bypassing your guards. His face is that of an innocent child darkened by eyes that have seen far too much. Oddly, there is something avian about his manner.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] Bao Zhong. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Hell of Undying Sorrow and use your knowledge to create a force of Wu Kuei, mummies working towards the extermination of all other [Glossary('Yama Kings','podgloss.yamaking')]. In exchange, he will help you create a new world free from the August Personage of Jade's tyranny, one where you are Bao Zhong's glorious champion. The agent does not advise that you decline such a generous offer."
 POD_eoel_bao_zhong_boon_modifier: "Bao Zhong's Boon"
 POD_eoel_bao_zhong_boon_modifier_desc: "The Lord of the Hell of Undying Sorrow remembers much as one of 4 Wan Xian to escape the August Personage of Jade's curse."

 POD_mummy_elixir_of_eternal_life.112.desc: "A man oozing with infernal influences walks into your throne room, bypassing your guards. Strange gems and baubles dangle from every piece of clothing, jingling with each step. An unusual power emanates from these items which presses down on you like an ocean's weight, a killing intent sending fear throughout you.\n\nHe introduces himself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Grandmother Witch. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Hell of Wretched Magic and use your knowledge to create a force of Wu Kuei, mummies working towards the collection of all magic, including those better left unknown. In exchange, she will grant you great knowledge and infernal power. The agent does not advise that you decline such a generous offer."
 POD_eoel_grandmother_witch_boon_modifier: "Grandmother Witch's Boon"
 POD_eoel_grandmother_witch_boon_modifier_desc: "The Lord of the Hell of Wretched Magic has learned how to use her position to gather ever-more knowledge and magic."

 POD_mummy_elixir_of_eternal_life.120.t: "All-Hearing Smog"
 POD_mummy_elixir_of_eternal_life.120.desc: "A woman of unearthly beauty stalks past your guards, their eyes completely blind to anything beyond her. Like a statue carved from ice by a master, she is without flaw. Every step reveals a lethal grace, a cat preparing to pounce.\n\nShe introduces herself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Emma-O','podgloss.emmao')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to [Glossary('Kakuri','podgloss.kakuri')] and use your knowledge to create a force of Wu Kuei, mummies working towards an endless void of ice and snow. In exchange, he will grant you great power, transforming you into his knife in the dark. Little will stand against you with his aid. The agent does not advise that you decline such a generous offer."
 POD_mummy_elixir_of_eternal_life.120.a: "A surprise, but a welcome one"
 POD_mummy_elixir_of_eternal_life.120.b: "You will never have my soul!"
 POD_mummy_elixir_of_eternal_life.120.c: "My soul is already forfeit"
 POD_mummy_elixir_of_eternal_life.120.d: "I have mastered myself. You have no power here"
 POD_mummy_elixir_of_eternal_life.120.d.tt: "Having mastered your body and mind, you can resist their infernal powers"
 POD_mummy_elixir_of_eternal_life.120.effect.success: "You resist the agent's assault"
 POD_mummy_elixir_of_eternal_life.120.effect.failure: "The assault overcomes your mind"
 POD_eoel_emmao_boon_modifier: "[Glossary('Emma-O','podgloss.emmao')]'s Boon"
 POD_eoel_emmao_boon_modifier_desc: "The Lord of the [Glossary('Kakuri','podgloss.kakuri')] has mastered the art of subterfuge."

 POD_mummy_elixir_of_eternal_life.121.desc: "A man bearing the imagery of a major religion walks into your throne room, bypassing your guards. Faith and zealotry shine from his eyes, barely dimmed by the red puckering covering every inch of visible flesh.\n\nHe introduces himself as the representative of the divine, voice of one known as Hen Tian. The divine has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossaryLocalized('hell_of_bitter_truth','Realm of Redemption and Truth')] and use your knowledge to create a force of Wu Kuei, mummies working towards the salvation of all and revelation of absolute truth. In exchange, he will help you spread that redemption in secret so that the enemies of truth cannot stop you. The agent encourages you to embrace such a generous offer."
 POD_eoel_hen_tian_boon_modifier: "Hen Tian's Boon"
 POD_eoel_hen_tian_boon_modifier_desc: "The Lord of the [UmbraGlossaryLocalized('hell_of_bitter_truth','Realm of Redemption and Truth')] has mastered the art of suborning people for his own purposes, tricking them into accomplishing his ends."

 POD_mummy_elixir_of_eternal_life.122.desc: "A man whose skin is visibly and permanently stained with blood walks into your throne room, bypassing your guards. Resembling his master, multiple arms extend from his torso and back, each terminating in a mouth with gnashing teeth.\n\nHe introduces himself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Yargra the Many-Mouthed. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to Pueleko and use your knowledge to create a force of Wu Kuei, mummies working towards the creation of endless hells and the consumption of all things. In exchange, she will help you devour all that stand in your way. The agent does not advise that you decline such a generous offer."
 POD_eoel_yargra_boon_modifier: "Yargra's Boon"
 POD_eoel_yargra_boon_modifier_desc: "The Lord of Pueleko sneaks up on her prey before devouring them."
 POD_eoel_yargra_vampiric_boon_modifier: "Yargra's Boon"
 POD_eoel_yargra_vampiric_boon_modifier_desc: "The Lord of Pueleko sneaks up on her prey before devouring them."

 POD_mummy_elixir_of_eternal_life.130.t: "All-Consuming Balefire"
 POD_mummy_elixir_of_eternal_life.130.desc: "A man wearing a Mongolian deel walks into your throne room, bypassing your guards. His body seems bloated with tainted energies, undirected hatred burning within his eyes. Rather than footsteps, his shoes produce the sounds of clinking chains and blood-curdling screams.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] and use your knowledge to create a force of Wu Kuei, mummies working towards crushing the last few holdouts preventing his ascension to [Glossary('Demon Emperor','podgloss.demonemperor')]. In exchange, he will infuse you with the power to crush your enemies and make them suffer. The agent does not advise that you decline such a generous offer."
 POD_mummy_elixir_of_eternal_life.130.a: "Unlimited power!"
 POD_mummy_elixir_of_eternal_life.130.b: "You will never have my soul!"
 POD_mummy_elixir_of_eternal_life.130.c: "My soul is already forfeit"
 POD_mummy_elixir_of_eternal_life.130.effect.success: "You resist the agent's assault"
 POD_mummy_elixir_of_eternal_life.130.effect.failure: "The assault overcomes your mind"
 POD_eoel_dokhor_khan_boon_modifier: "[Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s Boon"
 POD_eoel_dokhor_khan_boon_modifier_desc: "The Lord of the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] has attained his power by crushing all that stand before him, often quite recklessly."

 POD_mummy_elixir_of_eternal_life.131.desc: "A woman wearing very little, showcasing the rotting lesions covering her flesh, walks into your throne room, bypassing your guards. The smell of rot, the sound of squelching, the sight of seemingly-melting flesh and maggots squirming under her skin provoke an instinctual desire to retch.\n\nShe introduces herself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Rangda. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossary('hell_of_burrowing_maggots')] and use your knowledge to create a force of Wu Kuei, mummies working towards the eternal agony of all living things. In exchange, she will render your men monsters, unable to experience the pain and decay they spread with every step. The agent does not advise that you decline such a generous offer."
 POD_eoel_rangda_boon_modifier: "Rangda's Boon"
 POD_eoel_rangda_boon_modifier_desc: "The Lord of the [UmbraGlossary('hell_of_burrowing_maggots')] will bathe the world in maggots. Your soldiers are merely the first step."

 POD_mummy_elixir_of_eternal_life.132.desc: "A man with the scars of lashs and burns walks into your throne room, bypassing your guards. A nine-tailed whip embedded with glass shards drips blood from his waist. Upon his helmet rests a candle lit with a green flame burning wildly and causing wax to drip down on to him. Yet, the candle never diminishes.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] Danoru Ka. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Never-lit Cavern and use your knowledge to create a force of Wu Kuei, mummies acquiring spirits to complete his tunnel in the [UmbraGlossary('shadowlands')]. In exchange, he will turn your knights into overseers fit to handle vast hordes of slaves. The agent does not advise that you decline such a generous offer."
 POD_eoel_danoru_ka_boon_modifier: "Danoru Ka's Boon"
 POD_eoel_danoru_ka_boon_modifier_desc: "The Lord of the Never-lit Cavern has enslaved many beings and created many overseers to complete his tunnel. Theories abound regarding his destination..."

 POD_mummy_elixir_of_eternal_life.201.t: "The Stilling"
 POD_mummy_elixir_of_eternal_life.201.desc: "$POD_debate_debate_strength_header$At the hour you were once born, you settle yourself into a comfortable position. You still your body, mind, and soul. Each beat of your heart comes ever slower, each thump ever quieter. Thoughts bounce off your mind, failing to intrude into the serenity. Concerns, fears, the troubles of this world flow away from your soul, settling into less than the trickle of a mountain spring. Each moment stretches into eternity as you lose all sense of the passing of time, until your eyes close.\n\nDespite lacking any body, you feel excruciating pain as your body, mind, and soul are ripped apart from each other. With your spiritual eye, you see three spheres spiraling around each other. As the orbits hasten, essence begins to flow between them as the spheres lose their coherent shapes and is cast off into a circling cloud. Only hastening with each moment, the red wisps of energy begin to circle inwards towards the unified white core that has formed, becoming ever-brighten as they approach the center. When all of it has coalesced into a single, infinitesimally small point, your form reappears such that you are able to see through your eyes once more, revealing the Gate of Heaven standing closed. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer$"
 POD_mummy_elixir_of_eternal_life.201.a: "I seek the Elixir of Eternal Life!"
 POD_mummy_elixir_of_eternal_life.201.b: "On second thought..."

 POD_mummy_elixir_of_eternal_life.202.t: "The Final Brew"
 POD_mummy_elixir_of_eternal_life.202.desc: "$POD_debate_debate_strength_header$The time has come to brew the final elixir needed. You ascend to the highest peak on an auspicious day and armed with a talisman. You speak with the mountain's spirit to receive the Breaths of the Nine Heavens. Nine times subjected to fire at nine regular intervals of time, cycled between solid and vapor, such is the manner of the cinnabar's preparation. You let the sun's light flow through the vessel as you add the gold flowers, jade dew, sulphur, quicksilver, pine resin, peach pits, thistles, lead, dissolved pearls, the sediment of water and fire, remnants of beasts bygone, several deadly toxins, and your own blood. The many become as one, glowing with all the colors of divine light. You wash it to be as pure as the driven snow. You grind it to be as complete as cinnabar. You dissolve it into perfumed water and vermilion grass wine. Finally, you drink the liquid that shines with the color of the heavens so that it may sublimate the earthly and purify the flesh, leaving only the untainted.\n\nGreat weights tug on your eyelids, closing them as you feel yourself separate from the mortal realm. When the weight disappears and you are able to open them once more, you see the Gate of Heaven standing closed. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer$"
 POD_mummy_elixir_of_eternal_life.202.a: "I seek the Elixir of Eternal Life!"
 POD_mummy_elixir_of_eternal_life.202.b: "On second thought..."

 POD_mummy_elixir_of_eternal_life.203.t: "The Second Birth"
 POD_mummy_elixir_of_eternal_life.203.desc: "$POD_debate_debate_strength_header$With the aid of friends, you have conducted an intimate ritual, culminating in your suicide with a carefully-designed weapon. With your seat of life dislodged, your mind's eye flows down to your navel. A luminous galaxy spins, waiting for you to apply pressure and condense them into a new life. As you focus on it, you begin to cultivate and channel essence into it. As the essence returns to emptiness, the embryonic immortal awakens within you. With each cry, the infant grows into you. One element pushes, another pulls. So the wheel spins. So the new immortal is born. So you are born, standing before the closed Gate of Heaven. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer$"
 POD_mummy_elixir_of_eternal_life.203.a: "I seek the Elixir of Eternal Life!"
 POD_mummy_elixir_of_eternal_life.203.b: "On second thought..."

 POD_mummy_elixir_of_eternal_life.21.t: "Audience: Burden of Immortality"
 POD_mummy_elixir_of_eternal_life.21.desc: "$POD_debate_debate_strength_header$\"You are not the first nor will you be the last to pursue such a quest. However, to climb a mountain is to carry its weight upon your back. Immortality, even one bound by the cycles of rebirth like our own, is a burden that reshapes the soul. With every step of your climb, you will collect loss, and your memories will erode. You will surrender all that grants meaning to the mortal. When the mountain has no peak, is there a meaning to the climb? Is there value in the endless struggle? Not for all. Such things are like a river carving a canyon. While the separation begins small, there comes a time when nothing can bridge the divide between you and the mortal experience. You will become detached from it, unable to fully partake in it. Such pain is only worsened when you have the power to grant immortality but know that you should not use it.\n\nThis is a curse and a burden. Will you still see every individual snowflake within the blizzard, like so many before it and yet completely unique? Will you still love them, care for them, protect them? Can you bear it, or will you become a monster? Will you still use your knowledge with wisdom, only granting eternal rebirth to those who can bear it themselves?\""
 POD_mummy_elixir_of_eternal_life.21.a: "We already bear immortality’s burden."  # 50 prowess, modify by age
 POD_mummy_elixir_of_eternal_life.21.b: "The purpose you provide prevents meaninglessness."  # 20 diplomacy
 POD_mummy_elixir_of_eternal_life.21.c: "You adapted; so can we."  # 25 learning

 POD_mummy_elixir_of_eternal_life.22.t: "Audience: Maintaining the Balance"
 POD_mummy_elixir_of_eternal_life.22.desc: "$POD_debate_debate_strength_header$\"Just as immortality and the ability to grant it transforms the relationship between yourself and others, so too does it transform your relationship with the world. Life and death, order and chaos, birth and decay. All exist in perfect balance, and we are its caretakers. With the creation of each Undying, we already skirt the edge of imbalance, shaking the tree. A few shakes will not threaten the world. However, granting you the knowledge to brew the Elixir creates the potential to shake the tree too often, leaving a leafless tree. Expanding our circle would not be a neutral act, serving only to strain the spiritual ecosystems. Should the strain grow too great, ripples would not do justice to describing the unseen debts and karmic entanglements.\n\nWill you maintain the balance between realms? Will you abuse the knowledge to create an army of the Undying, ripping a hole in death itself?\""
 POD_mummy_elixir_of_eternal_life.22.a: "Balance evolves; it is not static."  # 20 learning
 POD_mummy_elixir_of_eternal_life.22.b: "You will continue to regulate our numbers."  # 25 stewardship
 POD_mummy_elixir_of_eternal_life.22.c: "We cause less damage than others and fix the damage from them."  # 25 intrigue

 POD_mummy_elixir_of_eternal_life.23.t: "Audience: Value of Mortality"
 POD_mummy_elixir_of_eternal_life.23.desc: "$POD_debate_debate_strength_header$\"There is more harm caused than simply that inflicted upon the balance or the strain from the burden of immortality. As we said before, immortality separates us from the mortals, leaving us detached from their world and without empathy. Without sand draining from the hourglass, we lack urgency or a need for growth. To remove the pressure of death and stopper the glass is to lose one's drive to become something new or greater, to change. Should we give you the Elixir of Eternal Life's recipe, you will use it to create more Undying, thereby robbing them of the chance to experience a complete human existence. Instead, you condemn them to a life of endless days, a never-ending monotony and exhaustion with a job they can never escape. Even should they desire it or seek you out for it, no one can truly understand the loss suffered from immortality until after they have already received it. You steal all of that from them without them ever comprehending their loss. There have even been those that used immortality to punish and torture their rivals, depriving them of a normal life.\n\nAre you willing to steal such potential? Would you abuse the power, without exercising thought or consideration for the pain caused? Will you cause harm and suffering?\""
 POD_mummy_elixir_of_eternal_life.23.a: "We preserve, not erase, humanity."  # 25 diplomacy
 POD_mummy_elixir_of_eternal_life.23.b: "Immortality is not the end, merely the start of a new journey."  # 20 learning
 POD_mummy_elixir_of_eternal_life.23.c: "Mortality leads to suffering, ignorance, and wasted potential."  # 25 intrigue

 POD_mummy_elixir_of_eternal_life.24.t: "Audience: Your Incompleteness"
 POD_mummy_elixir_of_eternal_life.24.desc: "$POD_debate_debate_strength_header$\"Knowledge is power. The Elixir of Eternal Life has the power to control the Wheel, to control the cycle of rebirth, to allow a man to persist far beyond his natural end. For mortals, power serves to do little more than reveal the inner truth, but it is far more dangerous for the eternal. You will be surrounded by magic, by power. To know that you could change things, that you could fix things, not many good people can bear that burden. To not succumb to that temptation to construct a perfect world, to that siren song is a draining endeavor that erodes one's will with every century that passes. Power invites the corruption of even the purest-hearted, of even those with the best of intentions. Only the best can handle it for while a mountain will one day erode away, it takes far longer than a pile of dust.\n\nTo grant you such power before you are ready is cruelty to you and the height of folly, little different than gifting omnipotence to a child. To bear the knowledge behind the Elixir's creation requires one that has learned certain lessons regarding detachment, humility, and harmony.\n\nYou are not necessarily unworthy. Rather, you are as yet young and incomplete. Granting you that which you seek would be irresponsible. Why should we do so? what proof do you offer of your maturity and ability to resist the corruption?\""
 POD_mummy_elixir_of_eternal_life.24.a: "We have already proven ourselves by reaching this point."  # 25 learning
 POD_mummy_elixir_of_eternal_life.24.b: "Perfection is impossible and growth eternal."  # 20 martial
 POD_mummy_elixir_of_eternal_life.24.c: "Growth requires responsibility."  # 25 stewardship

 POD_mummy_elixir_of_eternal_life.25.t: "Audience: Legacy of Power"
 POD_mummy_elixir_of_eternal_life.25.desc: "$POD_debate_debate_strength_header$\"Let us say we accept your worthiness and your ability to properly handle the power inherent to the Elixir of Eternal Life. This knowledge's power is a legacy as eternal as the beings it makes. Each change casts ripples through the pond of men, spreading ever further. By granting you the knowledge to brew the Elixir, we perpetuate that legacy, a legacy you will pass on to everyone that you transform or to whom you teach it. Trusting you now requires us to trust all that come after you, to trust the legacy you create. Even a small ripple may one day become a tidal wave beyond even our power to curtail. In the great poem of history, such rhyming lines are oft-repeated, and trust is rarely rewarded.\n\nWhy should we extend such trust in this moment? Why should we trust those who come later? Even if your intentions are noble, will future generations share your virtues and values? Why should we take such a risk?\""
 POD_mummy_elixir_of_eternal_life.25.a: "Stagnation is its own danger."  # 25 diplomacy
 POD_mummy_elixir_of_eternal_life.25.b: "All traditions risk corruption, but they should not be abandoned."  # 20 learning
 POD_mummy_elixir_of_eternal_life.25.c: "While difficult, safeguards can be established."  # 25 stewardship

 POD_mummy_elixir_of_eternal_life.26.t: "Audience: Why..."
 POD_mummy_elixir_of_eternal_life.26.desc: "$POD_debate_debate_strength_header$\"One final question stands before us: you. What led you to stand where you now do? After all, your's was not an easy or short quest, nor one without difficulties. What gave you strength when you questioned your purpose? Beneath all of the practicalities, beneath all of the philosophical arguments, what was your intent? Do you seek control or to be remembered? Do you quest out of fear or in defiance? If so, satisfying your desires will only serve to amplify those flaws. Do you have a reason that surpasses such base impulses?\""
 POD_mummy_elixir_of_eternal_life.26.a: "To protect the world."  # 25 martial
 POD_mummy_elixir_of_eternal_life.26.b: "To transcend limitation."  # 25 intrigue
 POD_mummy_elixir_of_eternal_life.26.c: "To ascend in enlightenment."  # 25 diplomacy
 POD_mummy_elixir_of_eternal_life.26.d: "To bear the burden others cannot."  # 25 stewardship
 POD_mummy_elixir_of_eternal_life.26.e: "To preserve knowledge and purpose."  # 25 learning

 POD_mummy_elixir_of_eternal_life.270.t: "Audience: Success"
 POD_mummy_elixir_of_eternal_life.270.desc.internal: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Let us hope that our trust in you is well-placed.\n\nTo begin brewing the Elixir of Eternal Life, collect your tears from 11pm to 3am, your sweat from 11am to 3pm, your saliva from 7am to 11am, your mucus from 3am to 7am, and your urine from 3pm to 7pm. Then, mix them over a flame for 15 minutes...\""
 POD_mummy_elixir_of_eternal_life.270.desc.external: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Let us hope that our trust in you is well-placed.\n\nTo begin brewing the Elixir of Eternal Life, grind jade into a fine powder and pour into a small amount of molten gold...\""
 POD_mummy_elixir_of_eternal_life.270.desc.nourishing: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Let us hope that our trust in you is well-placed.\n\nTo begin brewing the Elixir of Eternal Life, perform the Five Animal Play technique with several trusted allies, each of you sending your essence, breath, and spirit towards a cauldron of boiling water. Then...\""
 POD_mummy_elixir_of_eternal_life.270.a: "This one thanks you for your guidance"
 POD_mummy_elixir_of_eternal_life.270.b: "This one thanks you for this opportunity"  # turns you into Wu T'ian
 eoel_become_mummy_wutian_tt: "You will become a Mummy which will radically change your gameplay, disable your buildings and destroy your higher realm titles.\nThis is likely to cripple your campaign if you aren't ready for it."

 POD_mummy_elixir_of_eternal_life.271.t: "Audience: Partial Success"
 POD_mummy_elixir_of_eternal_life.271.desc: "\"Like so many before you, we will not grant you the knowledge necessary to perfect the Elixir of Eternal Life. However, you have shown the wisdom necessary to drink of it. And so, we offer you the opportunity to leave your current form behind and attain a new life and a new purpose, one of eternal rebirth in service to the August Personage of Jade. Do you accept?\""
 POD_mummy_elixir_of_eternal_life.271.a: "This one thanks you for your generous offer"  # turns you into Wu T'ian
 POD_mummy_elixir_of_eternal_life.271.b: "This one must decline your generous offer"

 POD_mummy_elixir_of_eternal_life.272.t: "Audience: Failure"
 POD_mummy_elixir_of_eternal_life.272.desc: "\"After much consideration, we have deemed you too young. You are a peach pit just beginning to sprout. Should we grant you the knowledge necessary to brew the Elixir of Eternal Life, we would bear the responsibility for it corrupting you. You might teach it to the unworthy. You could torture your rivals or steal mortality's advantages from those unprepared for such a loss.\""
 POD_mummy_elixir_of_eternal_life.272.a: "This one shall return later"
 POD_mummy_elixir_of_eternal_life.272.b: "Decreipt fools! I shall found those who value my skill!"  # turns you into Wu Kuei

 POD_mummy_elixir_of_eternal_life_journeys.10.t: "Meditations Upon Eternity"
 POD_mummy_elixir_of_eternal_life_journeys.10.desc: "Only through meditation can we come to truly understand the cycle of rebirth.\n\nThough it means neglecting my other responsibilities, by retreating into seclusion for meditation I may learn more about myself and how I may achieve eternal rebirth."
 POD_mummy_elixir_of_eternal_life_journeys.10.a: "I shall seclude myself in my [ROOT.Char.Custom('ResidenceBuilding')]"
 POD_mummy_elixir_of_eternal_life_journeys.10.b: "I shall find a place in the wilderness"
 POD_mummy_elixir_of_eternal_life_journeys.10.c: "I shall retreat to an isolated place"
 POD_mummy_elixir_of_eternal_life_journeys.10.a.tt: "Rather than starting a [journey|E], you shall meditate here, a #P safe and easy#! place"
 POD_mummy_elixir_of_eternal_life_journeys.10.b.tt: "You will start a [journey|E] to #bold $elixir_of_eternal_life_stage2_meditation_name$#!, traveling to a #Z moderately challenging#! place to meditate in"
 POD_mummy_elixir_of_eternal_life_journeys.10.c.tt: "You will start a [journey|E] to #bold $elixir_of_eternal_life_stage2_meditation_name$#!, traveling to a #N difficult and dangerous#! place to meditate in"
 POD_mummy_elixir_of_eternal_life_journeys.10.success: "Your cultivation provides some insights"
 POD_mummy_elixir_of_eternal_life_journeys.10.failure: "Your meditation fails to yield any insights"

 POD_mummy_elixir_of_eternal_life_journeys.11.t: "Meditations Upon Eternity"
 POD_mummy_elixir_of_eternal_life_journeys.11.desc: "Traveling into the wilderness, I found my mind unencumbered and free to wander. Aided by fasting and meditation, my thoughts turned inwards. I considered all that I had learned. I worked to firm up my cultivation base and further my understanding of eternal rebirth."
 POD_mummy_elixir_of_eternal_life_journeys.11.a: "The interruptions offered some difficulties..."
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success.critical: "But it slid from my awareness like water on glass"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success: "But I overcame them"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure: "And prevented me from finding inner peace"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure.critical: "And the unending cacophony stymied me"
 POD_mummy_elixir_of_eternal_life_journeys.11.b: "The journey and isolation itself presented some challenges..."
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success.critical: "But the deprivation gave me an epiphany"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success: "But I overcame them"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure: "And forced me to retreat to shelter"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure.critical: "And my lips quickly cracked from thirst"
 POD_mummy_elixir_of_eternal_life_journeys.11.internal: "Your experience with meditation and mastery of your body increases your chance of critical successes and reduces your chance of critical failures"

 POD_mummy_elixir_of_eternal_life_journeys.21.t: "[Concept('translation_minigame', 'Translating')|E] Esoteric Records"
 POD_mummy_elixir_of_eternal_life_journeys.21.desc: "Your efforts have yielded some esoteric record of an undiscernible age. Despite your familiarity with multiple languages and the linguistic capabilities of your courtiers, your combined efforts have proven insufficient to render it interpretable. Invisible ink obscures critical details. Enciphered words speckles the text. The portions written in a familiar language are barely interpretable, requiring a technical and magical mastery that you are just starting to achieve. The writer's shorthand only further complicates your translation efforts.\n\nOne particular, five-letter word seems to be the key to translating the remainder. Unfortunately, you'll only have 6 opportunities as your efforts are rather destructive."
 POD_mummy_elixir_of_eternal_life_journeys.21.b: "I give up!"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.success: "Your translation is successful"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure: "Your translation failed"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure.details: "Your failed attempts destroyed the record"

 POD_mummy_elixir_of_eternal_life_journeys.22.t: "Halls of Infinite Reflection"
 POD_mummy_elixir_of_eternal_life_journeys.22.desc: "Through your research and explorations, you discovered an ancient technique to aid in cultivation: the Halls of Infinite Reflection. By positioning yourself at the center of a ritual formation made of mirrors, the power within you will be reflected upon and unto itself many times before re-entering your body. That power will be further amplified as it courses through the geometric shapes used to construct the formation.\n\nAs you place yourself at the formation's core, there are two mirrors set almost facing one another, such that you can see yourself over your shoulder, endlessly curving away into the universe within the mirror. As you turn your eyes inward, you can feel yourself pouring into yourself, multiplying itself through the endless reflections. From an outsider's perspective, it would be almost impossible to determine where the mirrors end and you begin.\n\nAt first, everything is going well. Your cultivation is advancing by leaps and bounds. Then, you feel yourself cracking and shattering into infinite shards, each shard a fractal reflection of your form before flowing into silvered surface of the mirror before you. When you awaken, a multilayered, silvery world stretches out before you, perfectly smooth, perfectly endless. At every turn, there is a reflection of you, perfect yet insubstantial, mirroring you yet each wearing a different expression, unique even amongst all of the others. No two smiles are exactly the same, nor any two frowns. They do not move as you walk amongst and through them, only turning so that their eyes may follow you. Through the surprise and panic, an old story of the Mirror Realm comes to mind. \"Only by finding the real can one escape the prison of their own reflection.\""
 POD_mummy_elixir_of_eternal_life_journeys.22.a: "Point at yourself"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.22.b: "Try to find the imperfect copy"
 POD_mummy_elixir_of_eternal_life_journeys.22.c: "Close your eyes and run through the copies"
 POD_mummy_elixir_of_eternal_life_journeys.22.d: "Look for patterns and shapes"
 POD_mummy_elixir_of_eternal_life_journeys.22.e: "Do I remember more of that story?"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.success: "The reflections shatter, melting into you"
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.failure: "You run through many reflection before escaping"

 POD_mummy_elixir_of_eternal_life_journeys.23.t: "A Cache of Pills"
 POD_mummy_elixir_of_eternal_life_journeys.23.desc: "Your latest expedition led you to a cache of 4 medicinal pills left behind by someone that previously sought the Elixir of Eternal Life. Among the remnants of the notes, you learn that you would benefit greatly by taking exactly one of each of the 2 pill types every day. However, taking too much of any one type will negate the benefits. Unfortunately, the pills are mixed together in a single bottle, are unmarked, and look identical. How can you make sure that you take the correct pills?"
 POD_mummy_elixir_of_eternal_life_journeys.23.a: "Take 3 pills the first day & 1 the second day"
 POD_mummy_elixir_of_eternal_life_journeys.23.b: "Take 1 random pill each day to prevent the penalty"
 POD_mummy_elixir_of_eternal_life_journeys.23.c: "Eat 1 half of each pill on each day"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.23.d: "Crush 2 pills, mix them, & consume it each day"
 POD_mummy_elixir_of_eternal_life_journeys.23.e: "Take 2 random pills each day" # 50-50 roll
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.success: "The pills enhance your cultivation"
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.failure: "After much vomiting, you don't see any benefits"



