 # Opening Event - 0001
 POD_asakku.0001.t: "What Has Always Been There"
 POD_asakku.0001.desc: "Tonight, in the quiet hours before dawn in Baku, far from Enoch and far from Yamadanda's careful eyes, something surfaces that you have spent centuries pressing down.\n\nThe presence is patient as it has always been patient. It speaks no language, only direction. It pushes you east.\n\nNone of this is decision yet. It is only the shape of what is waiting.\n\nIt calls itself nothing. You have called it many things. Tonight it asks, again, whether you mean to keep pretending."
 POD_asakku.0001.a: "You have always been there. I stop pretending otherwise."
 POD_asakku.0001.b: "Suppress it again."
 POD_asakku_soul_infection_accepted_tt: "Gain the #bold Soul Infection#! trait. Asakku Corruption is set to 1 and begins accumulating. The #bold Soul Infection scheme#! is now available against Vicissitude-carrying vampires."
 POD_asakku_suppressed_tt: "The content of this run is suppressed. The Asakku will not surface again. This is permanent for this playthrough."

 # Backstory Event - 0002
 POD_asakku.0002.t: "The Voyage Remembered"
 POD_asakku.0002.desc: "You have not thought of the well in years. You have not allowed yourself to.\n\nIt is older than your Embrace. Older than the Tzimisce Antediluvian who took you from the high Greek hills, where you served as pharmakos and learned the proper way to part flesh from bone. The Ancient saw your art and seized it. You thought you understood the bargain. You did not.\n\nThe Sighing Lion. Three voyages into the Tempest, the ship's hull creaking with tempered souls. The Labyrinth between worlds. The forest at its heart that whispered with human voices. The Court of Thirteen Thrones. The bottomless well at its centre.\n\nYou approached. You whispered into it. Afterward you told Yamadanda, the only witness who survived, that you had only spoken to yourself. You may even have believed it.\n\nWhat returned wore your shape. The chatterlings on the voyage learned vicissitude faster than any teacher could explain. After one too many indiscretion, the phalanx sent to discipline you found things shaped like the kine and Kindred you had brought home, faces almost recognisable, and red vines that smelled of offal. They howled one name as the phalanx burned them. You have not spoken it in a thousand years.\n\nYamadanda has been gone for centuries but his Elioud remain. The hunters he flayed and rebuilt. They carry your name as inheritance. They will find this place too, in time."
 POD_asakku.0002.a: "The memory is older than the body that carries it."

 # Depth 25 Threshold - 0010
 POD_asakku.0010.t: "The Voice Becomes Louder"
 POD_asakku.0010.desc: "Something changes tonight. Not in the world — in you. The voice has always been a voice. Now it is a presence, with weight, and it has stopped pretending to be a guest in your own house.\n\nYou uncover the mirror your servants leave veiled out of old courtesy, the tall one in the chamber off the audience hall, because you want to know. You see your face. You also see something behind it, looking back through your eyes the same way you are looking out through them. Two intentions, one geometry. Centuries of learning to look past it have not prepared you for the choice not to.\n\nThe possessed do not choose to be possessed. You have always told yourself that. Tonight the distinction collapses. What rides in your blood is not an intruder; it has been here longer than any faith you have worn, longer than the courtesies you offered whichever priest or wazir asked. It is the original tenant. You are the guest who mistook the house for your own.\n\nThe faith you wore, the polite syncretism, sloughs off without ceremony. You have known for some time which way you actually pray. Tonight the words form themselves. The Corrupted Way has always been waiting for your tongue to be ready. There is no conversion, only admission. The prayers come in a language you have never learned and understand perfectly.\n\nIn Baku, far from anyone who would mark the moment, you are no longer a vampire with an unusual condition. You are an Asakku. There are perhaps only a handful beings who would understand the distinction, and others are sworn to end you."
 POD_asakku.0010.a: "There is no looking past it anymore."
 POD_asakku_depth_25_tt: "You are Asakku. The entity has taken root. Your faith shifts to the Corrupted Way."

 # Depth 50 Threshold - 0011
 POD_asakku.0011.t: "The Voice Has Opinions"
 POD_asakku.0011.desc: "The voice has opinions now. About the soil. About the rivers and what they should carry. About the crops your reeves plant in the lowlands and what should be planted instead. It wants things grown. Things seeded. You have begun to understand that when it says 'the garden,' it does not mean flowers.\n\nIt is not lecturing, either. It is collaborating. The thoughts that arrive in your head about the disposition of vassals, about which rival to allow to draw close and which to cut down before they ripen, about the slow shaping of your land into something less and less like rest of the world. You cannot always tell whether those thoughts originate with you. The seam where one stops and the other begins has dissolved. What remains is decision, and the decisions are good. They come faster than your old self would have made them, and they are sharper.\n\nThe Vicissitude in your blood has clarified, too. Forms come to you that no teacher ever offered. The discipline is no longer a discipline. It is the way the entity moves you, like a tongue moves in a mouth.\n\nAnd there is something newer than the rest, harder to describe. A way of being unseen. Not the obfuscate of other clans. Something quieter. The presence within teaches you, without teaching, how to slip out of attention even from those who know exactly where to look. Yamadanda's needles, you suspect, would not find you now.\n\nThe Elioud will know nonetheless. They are patient too."
 POD_asakku.0011.a: "Show me what to plant."
 POD_asakku_depth_50_tt: "Your mastery deepens. You can now seed the land with Vicissitude Taint."

 # Depth 75 Threshold - 0012
 POD_asakku.0012.t: "Which Thoughts Are Yours"
 POD_asakku.0012.desc: "You are no longer certain which thoughts are yours. What surprises you is that the voice's thoughts are not so different from your own; older, perhaps. Colder. But recognisably kin. As if some part of you was always the part that recognised them. As if you had been collaborating since before the Embrace and only now agreed to admit it.\n\nThe chorus inside you no longer lapses. Not in solitude, not in ritual, not in what passes for sleep among the dead. There is a constant murmur of voices and impossible images running just behind the surface of your attention, not yours, not entirely, not anymore, and any mind that reaches into yours to scry or to manipulate finds not silence but the wall of noise. The Wazir's intriguers have been turned aside without ever knowing they were turned aside. The Asakku within you protects what it has made.\n\nThrough the blood you have planted, you can listen now. Anyone who carries your infection carries also a thread you can pull. A vassal in your own court. A Cainite three princedoms away. When the entity wishes you to hear what passes through their hall, you hear it. Whispers in courts you have never visited come to you in their original languages. You know things that no spy could tell you.\n\nIn Enoch, the Basalt Throne registers a tremor. The Del'Roh has felt this tremor before. Once, long ago, when the same line of corruption walked back from a black voyage. The Seraphim will be convened. A new Elioud will be named in the morning, or perhaps tonight, depending on how patient the Del'Roh decides to be.\n\nYou will hear of it through the blood, eventually. The voice is not surprised."
 POD_asakku.0012.a: "We are kin."
 POD_asakku_depth_75_tt: "Your connection to the Asakku deepens. Soul Whispers becomes available. The Del'Roh takes notice."

 # Depth 100 Capstone - 0013
 POD_asakku.0013.t: "Iryi Ascendant"
 POD_asakku.0013.desc: "There is no border anymore. No membrane between what you were and what has always been with you. The distinction was always artificial. A comfort for the centuries when you needed to believe you were still just a vampire. You are not. You are something older, wearing a shape that used to be entirely yours.\n\nThe corrupted who came back with you on the Sighing Lion howled one name as they burned. You have not spoken it in a thousand years. Tonight you say it without flinching, and the saying is also the answer. Aretstikapha. The Watcher whose discipline became Vicissitude when it was stolen out of the Qlippoth before the Flood. The voice was always the Watcher, and the Watcher was always the voice you had pretended was an unfortunate inheritance.\n\nYou think of the high pastures above the temple, of the rite that took you, of the Sire who Embraced you and the Council to whom you reported. You think of the first servant on the voyage whose face came apart screaming the name. Each memory is now both yours and the Watcher's, and the seam where they meet is not a seam at all but a simple fact of geometry. There is one of you. There always was.\n\nWhat remains is the rest of the world. The Hand still hunts your line. The Elioud still sharpen their needles. The Del'Roh still sits the Basalt Throne, deciding which of the things in the dark to permit and which to extinguish. The Watcher within you regards them, and you regard them with it, and the regard is the same regard. Iryi Ascendant. The Deluge did not finish the work. The work is not yet finished. There is time."
 POD_asakku.0013.a: "I am what I have become."
 POD_asakku.0013.b: "I speak the name at last. Aretstikapha."
 POD_asakku_depth_100_tt: "The merger is complete. You are Iryi Ascendant."
