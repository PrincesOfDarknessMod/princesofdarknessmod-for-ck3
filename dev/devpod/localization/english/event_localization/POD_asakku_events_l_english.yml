l_english:
 # Opening Event - 0001
 POD_asakku.0001.t: "What Has Always Been There"
 POD_asakku.0001.desc: "You have not thought of the well in years. You have not allowed yourself to. Tonight, as you move through your court in Baku, far from Enoch, far from Yamadanda's careful eyes, something surfaces that you have spent centuries pressing down. It is patient. It has always been patient. It calls itself nothing. You have called it many things."
 POD_asakku.0001.desc.mechanics: "\n\n---------------------------------------\n\nAndeleon has the following unique content to represent the Asakku infection. \n\n#bold Asakku Depth#! tracks the entity's hold over you as a value from 1 to 100, shown as a character modifier. It accumulates slowly over time and faster when you act in its interest. Four thresholds at #bold 25, 50, 75,#! and #bold 100#! mark irreversible changes: a new trait, new abilities, and escalating attention from those who hunt the infection.\n\n#bold Spreading the Asakku#! - Vicissitude is the entity's vector. Characters who carry the discipline are susceptible. The #bold Soul Infection scheme#! plants the presence in a willing or unwitting host. Once fully Asakku, #bold Blood Inception#! works faster but requires an imprisoned target.\n\n#bold The Elioud#! - The Tal'Mahe'Ra knows what you are. As depth grows, the Elioud, Kindred trained to identify and eliminate the contagion will mobilize against you. They share intelligence. They are patient.\n\n#bold The Watcher at the Well#! - Four campaign objectives drive the Asakku's expansion: spread the infection, deepen the corruption, claim the ancient seats of power, and bring the eastern hunters to heel. Each phase demands more of the world and more of you."
 POD_asakku.0001.a: "You have always been there. I stop pretending otherwise."
 POD_asakku.0001.b: "Suppress it again."
 POD_asakku_soul_infection_accepted_tt: "Gain the #bold Soul Infection#! trait. Asakku Corruption is set to 1 and begins accumulating. The #bold Soul Infection scheme#! is now available against Vicissitude-carrying vampires."
 POD_asakku_suppressed_tt: "The content of this run is suppressed. The Asakku will not surface again unless you reload a save before this event. This is permanent for this playthrough."

 # Depth 25 Threshold - 0010
 POD_asakku.0010.t: "The Voice Becomes Louder"
 POD_asakku.0010.desc: "Something changes tonight. Not in the world in you. The voice has always been a voice. Now it is a presence, with weight. You look in the mirror your servants keep covered out of old habit, and you see in your own face the thing you have spent centuries learning to look past."
 POD_asakku.0010.a: "There is no looking past it anymore."
 POD_asakku_depth_25_tt: "You are Asakku. The entity has taken root. Your faith shifts to the Corrupted Way."

 # Depth 50 Threshold - 0011
 POD_asakku.0011.t: "The Voice Has Opinions"
 POD_asakku.0011.desc: "The voice has opinions now; about the soil, the rivers, the crops your people plant. It wants things grown. Things seeded. You have begun to understand that when it says 'the garden,' it does not mean flowers."
 POD_asakku.0011.a: "Show me what to plant."
 POD_asakku_depth_50_tt: "Your mastery deepens. You can now seed the land with Vicissitude Taint."

 # Depth 75 Threshold - 0012
 POD_asakku.0012.t: "Which Thoughts Are Yours"
 POD_asakku.0012.desc: "You are no longer certain which thoughts are yours. What surprises you is that the voice's thoughts are not so different from your own, older, perhaps. Colder. But recognizably kin."
 POD_asakku.0012.a: "We are kin."
 POD_asakku_depth_75_tt: "Your connection to the Asakku deepens. Soul Whispers becomes available. The Del'Roh takes notice."

 # Depth 100 Capstone - 0013
 POD_asakku.0013.t: "Iryi Ascendant"
 POD_asakku.0013.desc: "There is no border anymore. No membrane between what you were and what has always been with you. The distinction was always artificial. A comfort for the centuries when you needed to believe you were still just a vampire with an unusual condition. You are not. You are something older, wearing a shape that used to be entirely yours."
 POD_asakku.0013.a: "I am what I have become."
 POD_asakku_depth_100_tt: "The merger is complete. You are Iryi Ascendant."

 # A New Eye - 0101
 POD_asakku.0101.t: "A New Eye"
 POD_asakku.0101.desc: "The voice notices them before you do. They carry Vicissitude in their blood. You can feel it from across the room, the way you feel weather before it arrives. The presence within you stirs with something you have learned to call hunger, though it is not your hunger. Not entirely."
 POD_asakku.0101.a: "Cultivate their susceptibility."
 POD_asakku.0101.b: "Take more direct measures."
 POD_asakku.0101.c: "Keep your distance."
 POD_asakku_new_eye_cultivate_tt: "You may begin a Soul Infection scheme against this character."
 POD_asakku_new_eye_blood_inception_tt: "If they are imprisoned, you may use Blood Inception."
