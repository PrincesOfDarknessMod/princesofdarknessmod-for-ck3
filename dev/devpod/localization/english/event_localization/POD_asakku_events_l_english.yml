 # Opening Event - 0001
 POD_asakku.0001.t: "What Has Always Been There"
 POD_asakku.0001.desc: "You have not thought of the well in years. You have not allowed yourself to. Tonight, in the quiet hours before dawn in Bak, far from Enoch & far from Yamadanda's careful eyes, something surfaces that you have spent centuries pressing down.\n\nIt is older than your Embrace. Older than the Tzimisce Antediluvian who took you from the high Greek hills, where you served as pharmakos and learned the proper way to part flesh from bone. The Ancient saw your art and seized it. You thought you understood the bargain. You did not.\n\nThe Sighing Lion. Three voyages into the Tempest, the ship's hull creaking with tempered souls. The Labyrinth between worlds. The forest at its heart that whispered with human voices. The Court of Thirteen Thrones. The bottomless well at its centre.\n\nYou approached. You whispered into it. Afterward you told Yamadanda, the only witness who survived, that you had only spoken to yourself.\n\nYou may even have believed it.\n\nWhat returned wore your shape. The chatterlings on the voyage learned vicissitude faster than any teacher could explain. The wazir phalanx sent to discipline you found things shaped like the kine and Kindred you had brought home, faces almost recognisable, and red vines that smelled of offal at their heels. The corrupted howled one name as they burned. You have not spoken it in a thousand years.\n\nYamadanda swore, in your blood, to destroy the chronicle. He had already enchanted himself against the oath. He has been gone for centuries but his Elioud remain. The hunters he flayed and rebuilt with iron needles. They carry your name as inheritance. They will find this place too, in time.\n\nThe presence is patient as it has always been patient. It speaks no language, only direction. It will move through your vassals' veins when you let it. It will fill the prisoners whose lips you part. It will, when you choose, push the Hand's eastern reach until nothing of the Watcher's bloodline is unaccounted for.\n\nNone of this is decision yet. It is only the shape of what is waiting.\n\nIt calls itself nothing. You have called it many things. Tonight it asks, again, whether you mean to keep pretending."
 POD_asakku.0001.a: "You have always been there. I stop pretending otherwise."
 POD_asakku.0001.b: "Suppress it again."
 POD_asakku_soul_infection_accepted_tt: "Gain the #bold Soul Infection#! trait. Asakku Corruption is set to 1 and begins accumulating. The #bold Soul Infection scheme#! is now available against Vicissitude-carrying vampires."
 POD_asakku_suppressed_tt: "The content of this run is suppressed. The Asakku will not surface again. This is permanent for this playthrough."

 # Depth 25 Threshold - 0010
 POD_asakku.0010.t: "The Voice Becomes Louder"
 POD_asakku.0010.desc: "Something changes tonight. Not in the world but in you. The voice has always been a voice. Now it is a presence, with weight. You look in the mirror your servants keep covered out of old habit, and you see in your own face the thing you have spent centuries learning to look past."
 POD_asakku.0010.a: "There is no looking past it anymore."
 POD_asakku_depth_25_tt: "You are Asakku. The entity has taken root. Your faith shifts to the Corrupted Way."

 # Depth 50 Threshold - 0011
 POD_asakku.0011.t: "The Voice Has Opinions"
 POD_asakku.0011.desc: "The voice has opinions now; about the soil, the rivers, the crops your people plant. It wants things grown. Things seeded. You have begun to understand that when it says 'the garden,' it does not mean flowers."
 POD_asakku.0011.a: "Show me what to plant."
 POD_asakku_depth_50_tt: "Your mastery deepens. You can now seed the land with Vicissitude Taint."

 # Depth 75 Threshold - 0012
 POD_asakku.0012.t: "Which Thoughts Are Yours"
 POD_asakku.0012.desc: "You are no longer certain which thoughts are yours. What surprises you is that the voice's thoughts are not so different from your own, older, perhaps. Colder. But recognizably kin."
 POD_asakku.0012.a: "We are kin."
 POD_asakku_depth_75_tt: "Your connection to the Asakku deepens. Soul Whispers becomes available. The Del'Roh takes notice."

 # Depth 100 Capstone - 0013
 POD_asakku.0013.t: "Iryi Ascendant"
 POD_asakku.0013.desc: "There is no border anymore. No membrane between what you were and what has always been with you. The distinction was always artificial. A comfort for the centuries when you needed to believe you were still just a vampire with an unusual condition. You are not. You are something older, wearing a shape that used to be entirely yours."
 POD_asakku.0013.a: "I am what I have become."
 POD_asakku_depth_100_tt: "The merger is complete. You are Iryi Ascendant."

 # A New Eye - 0101
 POD_asakku.0101.t: "A New Eye"
 POD_asakku.0101.desc: "The voice notices them before you do. They carry Vicissitude in their blood. You can feel it from across the room, the way you feel weather before it arrives. The presence within you stirs with something you have learned to call hunger, though it is not your hunger. Not entirely."
 POD_asakku.0101.a: "Cultivate their susceptibility."
 POD_asakku.0101.b: "Take more direct measures."
 POD_asakku.0101.c: "Keep your distance."
 POD_asakku_new_eye_cultivate_tt: "You may begin a Soul Infection scheme against this character."
 POD_asakku_new_eye_blood_inception_tt: "If they are imprisoned, you may use Blood Inception."
