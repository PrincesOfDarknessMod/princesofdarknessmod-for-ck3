l_english:
 pod_judges_promised_land: "Promised Land"

 e_judges_title: "Judges"
 e_judges_title_adj: "Judge"
 
 judge_reclaim_promised_land_objective_decision: "Settle the Judges"
 judge_reclaim_promised_land_objective_decision_desc: "The Judges are a decentralized organization with each of them mainly protecting their own community. We could take example on the Shadow Inquisition and unite behind a common banner to be much more efficient. We only need a rallying leader and a founding victory to achieve this."
 judge_reclaim_promised_land_objective_decision_confirm: "A new beginning."
 judge_reclaim_promised_land_objective_decision_tooltip: "Wardens of a people, uniting."

 judge_get_mystic_decision: "Study the Ways of the Wise Men"
 judge_get_mystic_decision_desc: "To properly carry out my duties, I should study the ancient and mystic ways of my ancestors. I shall benefit from their wisdom and become a true wise man."
 judge_get_mystic_decision_confirm: "Let's begin"
 judge_get_mystic_decision_tooltip: "I will study the ancient ways to become a wise man"

 judge_verify_christian_claim_objective_decision: "The Matter of the Cross"
 judge_verify_christian_claim_objective_decision_desc: "Before we can fully commit to helping the Christian Church in their hunt of the Cursed Ones, we must put to rest our theological differences with them."
 judge_verify_christian_claim_objective_decision_confirm: "Pragmatism must rule this day"
 judge_verify_christian_claim_objective_decision_tooltip: "Our estranged theological descendants."

 judge_contact_magi_objective_decision: "Contact the Magi"
 judge_contact_magi_objective_decision_desc: "Following the traditions set forth by the prophet Daniel, the Magi have long practiced a more linear form of hedge magic. In addition, they are among the few remaining Mizrahic Judges left in these dark days. Let us reestablish contact with them as we seek to coordinate the different cells."
 judge_contact_magi_objective_decision_confirm: "Let us speak to them"
 judge_contact_magi_objective_decision_tooltip: "We shall learn from the Mizrahim and the Magi"
 judge_contact_magi_objective_decision_know_sorcerer: "The Magi are a secretive group, remaining hidden with the mortal governments. Find another #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Sorcerer#!#! to be your [friend|E], [lover|E], [soulmate|E], or [GetPlayer.Custom('PODCoterie')] member so that they may aid your search"
 judge_contact_objective_decision_havanah_tt: "Create the #TOOLTIP:artifact_pod_judges_havanah_book_description #L $artifact_pod_judges_havanah_book_name$#!#! [artifact|E]"

 judge_contact_ashkenazic_objective_decision: "Contact the Ashkenazic Judges"
 judge_contact_ashkenazic_objective_decision_desc: "More so than most, the Ashkenazic Judges have explored and studied the Sefer Yetzirah. The ability of their Rabbis Baal Shem to create living constructs is well-known and has allowed them to survive amongst the Cursed Ones. In addition, they have won the protection of two Cursed Ones within the region. Let us reestablish contact with them as we seek to coordinate the different cells."
 judge_contact_ashkenazic_objective_decision_confirm: "Let us speak to them"
 judge_contact_ashkenazic_objective_decision_tooltip: "We shall learn from the Ashkenazim"
 judge_contact_ashkenazic_objective_decision_befriend_josef: "The Defender of Prague, [GetScriptedCharacterByHistoryID('505089').GetFirstName], must be your [friend|E], [lover|E], [soulmate|E], or [GetPlayer.Custom('PODCoterie')] member, if still active and alive"
 judge_contact_ashkenazic_objective_decision_befriend_yitzhak: "The Ashen Rabbi, [GetScriptedCharacterByHistoryID('790246').GetFirstName], must be your [friend|E], [lover|E], [soulmate|E], or [GetPlayer.Custom('PODCoterie')] member, if still active and alive"
 judge_contact_ashkenazic_objective_decision_know_theurgist: "It is forbidden to study the Sefer Yezirah alone. Only in groups of two or three may it be learned. Find another #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Kabbalist#!#! to be your [friend|E], [lover|E], [soulmate|E], or [GetPlayer.Custom('PODCoterie')] member so that they may study with you."
 judge_contact_ashkenazic_objective_decision_popular_in_prague: "The County of [GetTitleByKey('c_praha').GetNameNoTier] must fall within your territory and have a [county_opinion|E] of 35 or greater of its holder."

 judge_contact_esraelawi_objective_decision: "Contact the Esra'elawi Judges"
 judge_contact_esraelawi_objective_decision_desc: "To protect our brethren, all Judges are forced to be soldiers and warriors. However, the Esra'elawi Judges have specifically maintained the warrior traditions of the Tribe of Dan. Should we prove ourselves to them, they may be willing to teach us their traditions."
 judge_contact_esraelawi_objective_decision_confirm: "Let us speak to them"
 judge_contact_esraelawi_objective_decision_tooltip: "We shall learn from the Esra'elawi"

 judge_contact_kochinim_objective_decision: "Contact the Kochinic Judges"
 judge_contact_kochinim_objective_decision_desc: "At the cost of some money and becoming more of a public figure, we can contact our brethren in India. The Kochinim are known for their trade network and the intelligence network built around it. Contacting them should allow us to take advantage of both traits."
 judge_contact_kochinim_objective_decision_confirm: "Let us speak to them"
 judge_contact_kochinim_objective_decision_tooltip: "We shall learn from the Kochinim"

 judge_contact_sephardim_objective_decision: "Contact the Sephardic Judges"
 judge_contact_sephardim_objective_decision_desc: "Our Iberian and North African brethren are renowned for their understanding of the extra-Tanakh scriptures and their skill at surviving those turbulent regions. If we can contact them and solve some of the difficulties that they are facing, then they should be able to help us with our future efforts."
 judge_contact_sephardim_objective_decision_confirm: "Let us speak to them"
 judge_contact_sephardim_objective_decision_tooltip: "We shall learn from the Sephardim"

 judge_research_origins_mummies_objective_decision: "Identify the Origins of the Undying"
 judge_research_origins_mummies_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. We should seek out the origins of the #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Undying#!#!, more commonly known as Mummies. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_mummies_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_mummies_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_mummies_objective_decision_benefit: "We discover the origins of the #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Undying#!#!"
 judge_research_origins_mummies_objective_decision_befriend_cabirus: "The Independent Mummy, [GetScriptedCharacterByHistoryID('792600').GetFirstName], must be your [friend|E], [lover|E], [soulmate|E], or [GetPlayer.Custom('PODCoterie')] member, if still active and alive"
 judge_research_origins_objective_decision_havanah_tt: "Own the [GetPODArtifactName('judge_havanah_book_link')] so that you can expand it"

 judge_research_origins_demons_objective_decision: "Identify the Origins of the Fallen"
 judge_research_origins_demons_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. We should seek out the origins of the #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L Fallen#!#!, more commonly known as Demons. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_demons_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_demons_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_demons_objective_decision_benefit: "We discover the origins of the #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L Fallen#!#!"

 judge_research_origins_fae_objective_decision: "Identify the Origins of the Fae"
 judge_research_origins_fae_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. We should seek out the origins of the $POD_splat_fae$, though the lack of texts on the topic will force us to turn to alternative sources of information. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_fae_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_fae_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_fae_objective_decision_benefit: "We discover the origins of the $POD_splat_fae$"

 judge_research_origins_wraiths_objective_decision: "Identify the Origins of the Wraiths"
 judge_research_origins_wraiths_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. We should seek out the origins of the $POD_splat_wraith_plural$, possibly even contacting them ourselves through our meditations. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_wraiths_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_wraiths_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_wraiths_objective_decision_benefit: "We discover the origins of the $POD_splat_wraith_plural$"

 judge_research_origins_kueijin_objective_decision: "Identify the Origins of the Kuei-Jin"
 judge_research_origins_kueijin_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. We should seek out the origins of the $pod_kueijin$ or Wan Xian. Perhaps we will find their original means of returning, before their corruption. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_kueijin_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_kueijin_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_kueijin_objective_decision_benefit: "We discover the origins of the $POD_splat_kueijin$"

 judge_research_origins_therianthropes_objective_decision: "Identify the Origins of the Therianthropes"
 judge_research_origins_therianthropes_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. We should seek out the origins of the [Glossary('Therianthropes', 'glossary_fera_tt')]. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_therianthropes_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_therianthropes_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_therianthropes_objective_decision_benefit: "We discover the origins of the [Glossary('Therianthropes', 'glossary_fera_tt')]"

 judge_research_origins_mortal_magic_objective_decision: "Identify the Origins of the Mortal Magicks"
 judge_research_origins_mortal_magic_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. We should seek out the origins of all mortal magics, partially by learning all of them. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_mortal_magic_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_mortal_magic_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_mortal_magic_objective_decision_benefit: "You gain access to Hekau, Tan and Qiao powers."

 judge_research_origins_vampires_3rdgen_objective_decision: "Study the Origins of the Third Generation"
 judge_research_origins_vampires_3rdgen_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. Foremost of those things are the Cursed Ones. The first step is researching the activity of the [Glossary('Antediluvians','game_concept_antediluvian_desc')] shortly after the Great Flood. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_vampires_3rdgen_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_vampires_3rdgen_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_vampires_3rdgen_objective_decision_benefit: "We discover the history of the [Glossary('Antediluvians','game_concept_antediluvian_desc')]' 2nd City after the Great Flood"

 judge_research_origins_vampires_2ndgen_objective_decision: "Study the Origins of the Second Generation"
 judge_research_origins_vampires_2ndgen_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. Foremost of those things are the Cursed Ones. The next step is researching the origins of the so-called Second Generation and their home city from before the Great Flood. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_vampires_2ndgen_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_vampires_2ndgen_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_vampires_2ndgen_objective_decision_benefit: "We discover the history of the Second Generation and the 1st City before the Great Flood"

 judge_research_origins_vampires_lilith_n_disciplines_objective_decision: "Study the Origins of the Disciplines"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. Foremost of those things are the Cursed Ones. The next step is researching the origins of the Cursed One Disciplines and their interactions with our hated enemy, Lilith. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_benefit: "We discover the origins of the Cursed One Disciplines"

 judge_research_origins_vampires_caine_n_abel_objective_decision: "Study the Origins of Caine"
 judge_research_origins_vampires_caine_n_abel_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. Foremost of those things are the Cursed Ones. The next step is researching the origins of Caine himself. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_vampires_caine_n_abel_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_vampires_caine_n_abel_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_vampires_caine_n_abel_objective_decision_benefit: "We discover the origins of Caine himself"

 judge_research_origins_vampires_golconda_objective_decision: "Study the Possibilities of Redemption"
 judge_research_origins_vampires_golconda_objective_decision_desc: "We know that Adonai created all things and chose us to be His people. However, there are many things in his creation that we do not yet understand. Foremost of those things are the Cursed Ones. The final step is researching the possibilities of redemption for Cursed Ones. We shall record our findings in a single work titled the Havanah."
 judge_research_origins_vampires_golconda_objective_decision_confirm: "Let us find the truth"
 judge_research_origins_vampires_golconda_objective_decision_tooltip: "It is the glory of G-d to conceal things, but the glory of kings is to search things out."
 judge_research_origins_vampires_golconda_objective_decision_benefit: "We discover the possibilities of redemption"
 judge_research_origins_vampires_golconda_objective_decision_befriend_nahum: "The Wise Counsel, [GetScriptedCharacterByHistoryID('790237').GetFirstName], must be your [friend|E], [lover|E], [soulmate|E], or [GetPlayer.Custom('PODCoterie')] member, if still active and alive"

 judge_reclaim_promised_land_objective_decision_effect1: "You gain the Judges titles"
 judge_reclaim_promised_land_objective_decision_effect2: "You become the head of faith for the [GetFaithByKey('judge').GetName]s"
 judge_reclaim_promised_land_objective_decision_effect3: "Every county in the Promised Land will gain the [GetModifier('undone_diaspora_modifier').GetNameWithTooltip] modifier and join the Judges"
 judge_reclaim_promised_land_objective_decision_jerusalem_judge: "[GetTitleByKey('c_jerusalem').GetNameNoTier] must be converted to your faith"
 judge_reclaim_promised_land_objective_decision_promised_land_capital: "Your [capital|E] has been returned to [GetTitleByKey('c_jerusalem').GetNameNoTier]"


 pod1230objectives_judges.1.t: "The Prophet's Magi"
 pod1230objectives_judges.1.desc: "During his time serving kings of Babylon and Persia, the prophet Dani'el became chief among the Magi. With his knowledge of sorcery and the wisdom of G-d, Dani'el became Chief of the Magi and taught them the mysteries of the Tanakh to guide them in their craft. They studied the stars for signs of the future and more linear paths of the traditional theurgy taught by the secret Talmud.\n\nWith the rise of the Cursed Ones and Fallen in the region, the Magi have been widely discarded as court advisors and have been forced to retreat into the Geonic academies. Their powers may be an enigma to us but are clearly born from the teachings of the prophet Dani'el, making them allies. After having retaken the hub of their activity, we have been able to establish contact with them for the first time in centuries. With their wisdom and the help of the Mizrahim Judges, we can pass on secrets once held by just a few and reinforce our eternal fight against those hiding in the shadows."
 pod1230objectives_judges.1.a: "Together we learn."

 # Menahemite special content for Magi decision
 # Subevent so event number is a bunch of 1s
 pod1230objectives_judges.111.t: "Menahem's Teachers"
 pod1230objectives_judges.111.desc: "Having taken Baghdad from Lilith's brood, we reestablished contact with the Magi. They are masters of the Talmud, both the public and hidden versions, having been founded by the prophet Daniel during the First Exile. Often have one among their number held the title of Rosh Yeshiva or Gaon. This legacy has granted them a deep understanding of the Kabbalistic and sorcerous arts, making them invaluable allies of the Judges.\n\nSo it was that the Magi first met Menahem when he journeyed to Baghdad in his quest for knowledge. They instructed him in the proper use of the numinous gifts Adon Olam granted him. They revealed the existence of the Children of Lilith and other creatures that slink through the shadows. With their help, he became the mighty and learned man that led us after his father's death and freed us from the darkness' grasp.\n\nThe Magi have heard rumors of our actions, but formal contact could not be established. Now, they offer to resurrect the old alliance and teach us what was given to Menahem. All they ask in return is aid in their efforts to understand the creatures of their dark so that they can be more effectively combatted.\n\nWith Baghdad ours and the Magi's support, there is no doubt that Jerusalem shall be reclaimed from the darkness."
 pod1230objectives_judges.111.a: "Follow in Menahem's footsteps, then step further"
 pod1230objectives_judges.111.b: "The lampstand burns brighter"

 pod1230objectives_judges.2.t: "Makers of Golems"
 pod1230objectives_judges.2.desc: "After much effort, we have established contact with the Ashkenazic Judges and the Cursed Ones in the region. The Cursed Ones do not wish to involve themselves in our hunt, only protecting our mortal brethren. While a few more zealous Judges may take issue with this, we are grateful for their aid in defending our brethren.\nTheir Rabbis Baal Shem, the so-called \"masters of the name\", have advanced our knowledge of construct-crafting tenfold. Let us use these golems to protect all our communities and root out those preying on us from the shadows."
 pod1230objectives_judges.2.a: "Together we protect."

 pod1230objectives_judges.3.t: "Traditions of Dan"
 pod1230objectives_judges.3.desc: "While we may wish to be scholars or rabbis, all Judges are forced to be soldiers and warriors for protecting our people must come first. However, the Esra'elawi Judges in Abyssinia have maintained the ancient warrior traditions of our people, specifically the tribe of Dan. The Setites, Undying, Laibon, and Ashirra are constantly attempting to wipe out our brethren in Beta Israel, forcing the Esra'elawi Judges to master the craft of war.\nNow that we have made contact and proven ourselves as able to help them, they have passed on their oldest teachings. With this foundation, we can ensure that the traditions are maintained within our dynasty, aiding us in our quest to eliminate Caine and Lilith's brood."
 pod1230objectives_judges.3.a: "Together we fight."

 pod1230objectives_judges.4.t: "Masters of Trade"
 pod1230objectives_judges.4.desc: "Due to their isolation from most Jewish communities, it took some effort to reach the Kochinim. They have a great many origins. Some were once traders under the command of King Solomon to reach unseen shores. Others came here, fleeing one of the two Exiles. Their Judges must face just as many threats, whether it be the Indian Cursed Ones, Cursed Ones coming from the west, or the Hungry Dead coming from further east.\n\nThe Kochinim have mastered two areas, allowing them to survive, and have now gifted that mastery to us. They control a massive trade network spanning India and the nearby region to fuel the Judges, and they have built an intelligence network on top of the trade to aid the Judges in their hunts."
 pod1230objectives_judges.4.a: "Together we watch."

 pod1230objectives_judges.5.t: "Diplomats & Theologians of Iberia"
 pod1230objectives_judges.5.desc: "The Sephardic Jews have spent centuries improving their understanding of our holy texts and learning how to survive in a hostile environment where one ruler may tolerate them and the next attempts to exterminate them. These skills have transferred to their local Judges and made them among the most effective of our brethren.\n\nIt took some time and effort, but we managed to bring the Sephardim to our side and to help ease their situation. In thanks for our efforts, they have sent rabbis to aid us in our war against that which slithers in the shadows."
 pod1230objectives_judges.5.a: "Together we stand."

 pod1230objectives_judges.6.t: "Origins of the Undying"
 pod1230objectives_judges.6.desc: "Osiris was an ancient Cursed One, embraced by one of Caine's children and likely was a 3rd or 4th [Glossary('Generation','game_concept_vampgeneration_desc')] $pod_cainite$. His [Glossary('Sire','game_concept_Sire_desc')] is unknown, though Ilyes (progenitor of $pod_clan$ Brujah) is a common contender in some of our scholars' circles, partially due to the theory placing Isis, Osiris' wife, as a descendant of Lilith ...\n\nSomeone (our scholars point to Ilyes, Lilith, or a mage named Thoth) would later return to aid Isis and Nephthys in their pursuit of magical knowledge, expanding the knowledge already known by Isis herself ...\n\nWith their magicks (and perhaps by exploiting the absence of Bene Elohim to properly ferry the dead?), the Undying forever bound their souls to their own bodies such that their soul could eventually return to the physical world after regaining its strength in [UmbraGlossaryLocalized('shadowlands','Limbo')] ...\n\nWhile the Egyptian Undying locally known as mummies are frequently warring against the Cursed Ones (maybe being used by Lilith?), the other Undying have managed to avoid entangling themselves in that conflict and seem to have discovered distinct means of achieving a similar end result, even the alchemical abilities.\n\nExcerpts from a preliminary draft of the Havanah Vol. 21, Ch. 1 & 2"
 pod1230objectives_judges.6.a: "Only Lilith's brood deserves our attention."

 pod1230objectives_judges.7.t: "Origins of the Fallen"
 pod1230objectives_judges.7.desc: "... and so it was that one-third of the Bene Elohim joined Lucifer in his rebellion, driven by their greed and pride. Some believed that their plan was wiser than that of Adonai. Others sought supreme authority over humanity, Elohim's own power, or simply wished to destroy all that they saw as impure or as rivals to G-d's love (a few myths say that the more destructive ones were chthonic entities of darkness predating the Earth that were sealed into the form of Bene Elohim (utter nonsense! who even bothered to include this as a margin note!)). Still others found the new concepts of war and violence introduced by Caine fascinating. Regardless of their individual reasons, they rebelled against HIS perfect plan and to the surprise of none (no kidding), lost the war against HIS faithful.\nFor their actions, they were cast out of the 3rd Heaven, some forever bound to the Earth they so coveted and the 1st Heaven. Others were trapped in a land called the Abyss, able to escape only through the sin and hubris of mortals. On Earth and in the Abyss, they would await the Final Judgment when they would be consigned to Gehinnom ...\n\nFor his crime of inciting the rebellion, Lucifer received an additional curse. Just as the Earth had been turned over to the Fallen for a time, so too were the Fallen turned over to their depravities. Lucifer would stand, untouched by the Abyss or sin's worst twistings, so that he could witness all those he rallied under him slowly twist and give into the corruption they had spawned, wishing for nothing but his own destruction (he got off lightly) ...\n\nTwice now have Asmodeus and Abaddon sought to replace men with twisted thralls they called Nephilim and twice now has G-d intervened with their plans. In the first instance, the Great Flood wiped out all traces of those tainted bloodlines (the effect on the leeches is not fully incidental but was not the primary goal). In response to the second, a new faith arose from our own, one that would be named Christianity.\n\nExcerpts from the Havanah Vol. 11, Ch. 2 & Vol. 18, Ch. 7"
 pod1230objectives_judges.7.a: "I wonder how HE will respond next time they try."

 pod1230objectives_judges.9.t: "The Truth of Yeshua"
 pod1230objectives_judges.9.desc: "The man commonly known as Yeshua of Nazareth has been an enigma to us for a long time. Some of our scholars believe he is in truth an Undying called Melchizedek. Like many Undying, he would possess the capability of mimicking resurrection, reawakening into his own body after a certain amount of time. This view is supported by reports that his tomb was found empty other than the burial linens, a common characteristic for the Undying ...\n\nRecorded draft response: This somewhat wild speculation still lacks credible sources and our order has agreed to keep it at just that, a hypothesis, to avoid angering our fellow Christian hunters. Cooperation with them has proven fruitful many times in the past and keeping our theological differences unsaid while focusing on the true threat is a much more pragmatic, and efficient, approach.\n\nDraft from the Havanah Vol. 21, Ch. 16, never published outside of higher Judges circles."
 pod1230objectives_judges.9.a: "We can agree to disagree."

 pod1230objectives_judges.11.t: "Origins of the Fae"
 pod1230objectives_judges.11.desc: "All men are made in the image of G-d and in his likeness. As He is the Creator of all things, so too do men wish to and are able to create. As His lesser reflections, humanity can make real their dreams and nightmares (do names have an effect? what of belief, conscious or unconscious?). The Fae are created when humanity literally creates things from their dreams and nightmares, reflecting the ideals and fears of anyone in the local area ...\n\nTheir connection to belief means that reality, pessimism, a lack of wonder, and a lack of chaos are all capable of physically injuring them or restricting their powers ...\n\nCold iron, beaten into order through sheer willpower, is known to easily destroy these beings of dreams ...\n\nFae are currently evil beings, reflections of the wilderness and its beasts as they seek to destroy civilization. However, sufficient changes in general beliefs, values, and fears may result in changes to the nature of Fae and transform them into useful allies in the hunt. (later experiments seem to confirm that wide-spread changes to myths and stories does have an impact) The exception would be those calling themselves the Shedim, so-called Djinn which we think were born from the dreams of Lilith and her brood. They will forever carry her taint.\n\nExcerpts from the Havanah Vol. 51, Ch. 1 & 3 and Vol. 52, Ch. 20"
 pod1230objectives_judges.11.a: "Can our faith & dreams tweak reality to aid our hunt?"

 pod1230objectives_judges.12.t: "Origins of the Wraiths"
 pod1230objectives_judges.12.desc: "Wraiths are the most fundamental type of unnatural creature, the building block from which many of the others can be derived, particularly when they bind themselves to a body. In this essay, I will demonstrate how ...\n\nWithout the Fallen to serve as psychopomps and ferry the dead into the afterlife, they began to collect upon the Earth and even began to overwhelm the living. Worse, some Fallen actively sought to collect the souls of the dead in a land cloaked by a Veil of pain and suffering ...\n\nIn time, the faithful Bene Elohim pierced this Veil, captured the Fallen, and brought them before G-d for judgment ...\n\nUnwilling to condemn the many souls captured in this place's trap by simply destroying the realm, G-d spoke and the oceans parted and the Veil was placed between the two oceans. One side was given to the living and the other side, [UmbraGlossaryLocalized('shadowlands','Limbo')], was given over to the restless dead who were as yet unwilling to pass on ...\n\nThis taint corrupts all souls trapped in this realm, always whispering their ears to succumb to all that is Dark ...\n\nG-d empowered Eve, the first woman and a mother who still sought to make peace with her son, to select a protector for the restless dead. To fight the dark taints left in [UmbraGlossaryLocalized('shadowlands','Limbo')], she chose a therianthrope, one of the werewolves, who would become known as Anubis (at least to the Undying he later aided) ...\n\nIn the same century that Moses parted the Red Sea (though it is unknown whether there is a correlation), Eve returned to select a governor for the restless dead. The name of [UmbraGlossaryLocalized('shadowlands','Limbo')]'s Fallen creator was given to a Mycenaean, transferring some of the Fallen's power of the realm and allowing the Mycenaean to separate the living from the dead and to aid the dead in reaching the afterlife. He became known as Charon ...\n\nAnything not created by G-d Himself must eventually come to an end for a creation cannot be a perfect creator. That which is known as [UmbraGlossaryLocalized('oblivion','Oblivion')] is the essence of this. It is the inevitable end, destruction, and corruption of this strange land originally created by the Fallen. There is no will nor intelligence here, simply entropy which renders all information incoherent and all energy useless, made manifest by the evils of the Fallen and the fears of the Wraiths trapped in this strange land.\n\nExcerpts from the Havanah Vol. 23, Ch. 1, 2, 5, & 6"
 pod1230objectives_judges.12.a: "A strange group of beings that should be pitied."

 pod1230objectives_judges.13.t: "Origins of the Kuei-Jin"
 pod1230objectives_judges.13.desc: "Due to the lack of our brethren in the region until more recent millennia, exact dates are difficult to identify when discussing the Hungry Dead (such as strange name and one too old to properly analyze. might refer to their hunger shifting over time from flesh, to blood, to the fragments of G-d's power carried in breaths). However, their origins seem tied to what they call the Third Age. Based on their naming schemes, the First Age refers to the time when the Earth was without form and was void, and darkness was over the face of the deep. And the Spirit of G-d was hovering over the face of the waters. Their Second Age began when G-d separated the light from the darkness and separated the waters. It ended with the Fall which created all manner of evil beings, only some of which were the Fallen. In response to the Fall, G-d, known as the August Personage of Jade in the East, chose an angel to select 10 thousand heroes and guides for humanity ...\n\nTainted as all men are, predisposed to sin, these heroes were corrupted by their power, stealing the life of those in their care to empower themselves and making deals with the Fallen for yet more power. The Bene Elohim were barely able to replace all those that died in their internal conflicts, spurred on by their pride and desire for more glory ...\n\nTheir evils culminated in the War of Shame when they killed their own children, corrupted holy sites blessed by G-d and guarded by the dragons and therianthropes, and created the Nine False Suns ...\n\nEven the tests of selection were corrupted such that only the evil would join their number ...\n\nUnable to withhold judgment or grant them mercy any longer, G-d levied a curse upon the 10 thousand former heroes with only four spared, one of whom would go on to join that which he had once fought (let us hope no Judge follows a similar path). This curse granted them a glimpse of the torment awaiting them in the afterlife and stripped them of the powers once granted to them, forcing them to drain humans for energy if they wished to retain those powers. These once-heroes were not the only beings in the area trapped in the physical realm, and not all have remained trapped for G-d is merciful, always leaving a path to reunion for those willing to tread it ...\n\nThere is a common misconception that those now known as Kuei-Jin are restricted to the eastern regions of Asia and Oceania. In reality, these former heroes and escaped criminals can arise anywhere. However, the Cursed Ones exterminate them in regions where they are prevalent, seeing them simply as caitiff wights or unusually strong wraiths. Historically, the Therianthropes saw themselves as more faithful so developed a hatred and disgust towards the Kuei-Jin which further explains their absence in other regions (though we never found a clear cause for the lack of the so-called \"Yama Kings\" outside the East).\nWhile the reasons have been forgotten, the hatred remains so therianthropes similarly exterminate any newborn Kuei-Jin in their territory. Only the East possessed sufficiently few or open-minded Cursed Ones and therianthropes for the Kuei-Jin to take root, at which point they could ease the transition and insertion of future Kuei-Jin.\n\nExcerpts from the Havanah Vol. 46, Ch. 1, 3, & 9 and Vol. 50, Ch. 4"
 pod1230objectives_judges.13.a: "Can we replicate the powers of those G-d once empowered?"

 pod1230objectives_judges.14.t: "Origins of the Therianthropes"
 pod1230objectives_judges.14.desc: "After the Fall, G-d chose an angel to select 10 thousand heroes and protectors for humanity. This angel chose the souls of faithful mortals who had died at the hands of the Fallen and gave them a second chance at life. Reborn as the Malhim, these souls matched the brutality that they had once been shown, striking fear into the hearts of all Fallen with their eagerness to exterminate them. They could follow and hunt their prey into any corner of creation, even piercing the realm of [UmbraGlossaryLocalized('shadowlands','Limbo')]. Blessed by their patron, they could demand the aid of nature, both flora and fauna. In fact, they could even transform into different animals to aid them in their hunts and battles, with the Gurahl (werebears) being the oldest and wisest among them (though there are oddities surrounding the memories and origins of the werelizards (perhaps the Fae have played some part in it)) ...\n\nAt that time, they were divided by who they hunted or their role in supporting the Heavenly Hosts. For example, those now known as Rokea (weresharks) primarily hunted House Lammasu while the Khan Bastet (weretigers) were grouped with other therianthropes as heavy troopers ...\n\nLike so many others, these heroes succumbed to the temptations of their positions and power. They enslaved humanity, keeping them as livestock much as the Cursed Ones did. For their crimes, they were cursed with the nature of the animals they worked alongside and resembled. In time, the once mighty Malhim devolved into the beings we today know as Therianthropes ...\n\nSome scholars have posited that the War of Rage caused the ultimate collapse from Malhim into Therianthropes. There were many territorial conflicts, contests for the best herds of people, attempts to determine the strongest race, and alleged betrayals of their Patron Mother. However, everything culminated when a Fallen-corrupted Nagah (weresnakes (why did the Ben Elohim ever think she should grant someone the form of a snake! this was inevitable!)) killed an important Garou (werewolves) who was carrying an important message and laid the blame on other tribes. When the Gurahl refused to resurrect the Garou courier, the Garou attacked the Gurahl who struck back with their own allies among the Grondr (wereboars). With the war having started, the Garou took advantage of it to fulfill their every desire: their pride, their greed for the secrets of others, and their belief in their right to rule over all other tribes ...\n\nAn interesting note regarding the Therianthropes is their unique connection to certain bodies seen in the Second Heaven. Based on our research into [UmbraGlossaryLocalized('shadowlands','Limbo')], the [UmbraGlossaryLocalized('dreaming','Dreamland')], and other Umbral realms, it would seem most, if not all, heavenly bodies are manifestations of humanity's dreams and beliefs such that the bodies may not have existed before humanity decided that those stars should be distinct from the others. Please consult the next chapter and Volume 52 for further discussion regarding ...\n\nExcerpts from the Havanah Vol. 31, Ch. 1 & 2, Vol. 39, Ch. 2"
 pod1230objectives_judges.14.a: "Can we replicate the powers of those G-d once empowered?"

 pod1230objectives_judges.15.t: "Origins of Mortal Magicks"
 pod1230objectives_judges.15.desc: "Humanity has turned its back on G-d many, many times. All sons of Adam and daughters of Eve bear the mark of their sin. Caine created the Cursed Ones through his numerous crimes, from murder to rape and even his refusal to repent (the only unforgivable sin). Many humans joined the Fallen in their rebellion against G-d, a rebellion Caine ...\n\nWhile He has turned His face from us for now, He has never forgotten humanity. Discussion of the Ha-mashiach and the chosen nature of the children of Israel are beyond the scope of this work so please consult the appropriate volumes and rabbinical texts. Relevant to the current discussion, G-d left behind multiple workers to aid humanity, such as Eve and two Bene Elohim called Ziana of House Rabisu and Raziel of House Lammasu. The latter are titled the Messengers ...\n\nSoon after the Fall and even before the Great Flood, Raziel chose ten thousand heroes who fought with their beauty and their knowledge, ever guiding humanity forward. These heroes became known as the Wan Xian ...\n\nSimilarly, Ziana chose ten thousand heroes who fought with nature itself, controlling and taking on aspects of nature's flora and fauna. They could command plants to aid them and take on the form of the animal spirit that had chosen them. From the dreams of these heroes, blessed with unique magicks, came the beings known as the Fae. While modern dreams can alter the Fae, it was these first dreams which birthed the true Firstborn Fae ...\n\nWith the failure of their individual heroes, these two Messengers decided to combine their efforts and to alter the manner in which they worked. No longer would such powers be entrusted to a single person, instead being split up. Some abilities would be learned, with the Messengers encouraging people towards hidden knowledge through the Yearning. Other abilities would be granted at birth, to be explored over time. Still other powers would be granted as a reward for enduring something or as aid in enduring something, often accompanied by a message of guidance. (why do the Messengers have to be so confusing with their guidance? Why can't it just be \"go here and do this\".) These abilities allow humans the ability to hear, see, and speak the mysteries that the fleshy ear, jellied eye, and tongue of clay could not. Each Blessed may approach and use their Gift in different ways and forms from esotericism, mysticism, alchemy, rituals, spells, prayers, meditation, and mental abilities ...\n\nOf Raziel's heroes, only 8 ever found true peace and were accepted back into G-d's arms. Inspired by the new efforts of Raziel and Ziana, these Eight Immortals passed on some of their knowledge to the Wu T'ian, allowing the Wu T'ian to create the Elixir of Eternal Life without relying on the twisted magicks of Lilith's brood (and allowing them to more harshly restrict their actions and powers to prevent another disaster). The Eight Immortals actively communicate with the Wu T'ian, giving them seemingly-random and unrelated tasks ...\n\nThe goal of the Messengers and G-d's other agents is ultimately unknown, though some say that they are mitigating damage before it becomes too severe. Perhaps they are testing us? Time will tell ...\n\nExcerpts from the Havanah Vol. 22, Ch. 1 & Vol. 31, Ch. 1 & Vol. 46, Ch. 4"
 pod1230objectives_judges.15.a: "Let's learn the arts of those first heroes."

 pod1230objectives_judges.16.t: "Tales of the Second City"
 pod1230objectives_judges.16.desc: "In His wisdom, G-d saw a way to address many sins at once and so He sent the Great Flood to wash away the abominations of the Fallen, the corrupted among His former servants, and the pride of the Cursed Ones ...\n\nIn the wake of the Great Flood, Caine exiled himself. He had created so much for it to be wiped away in a single year, with only a handful of the over 200 Cursed Ones (the number 200 has recently come into question but has not yet been disproven) surviving the Great Flood. Not that it mattered. Despite all of his work, nothing ever improved, just changed in small ways ...\n\nWithout Caine to restrain them, the Third Generation were allowed to fulfill their worst vices and their worst bouts of paranoia. When combined with the limited food supply as the children of Noah spread, the Third Generation quickly decided to turn against their surviving sires, forcing them into torpor but unable to fully kill them. Some say that Irad aided their efforts before they turned on him too. Others say that Zillah was the last to fall, crying out for Caine's aid as she saw her brothers fall. He heard her pleas and took pity on her, changing her into a stone so that she would not be found and killed. In addition, Caine promised his beloved Zillah that they would walk the night together again after all was mended. Still others say that Jabal managed to escape entirely, accompanying Caine in his exile as the ever-faithful servant ...\n\nInspiring many a myth of a vengeful deity, Caine's wrath was unrestrained when he heard of what happened to his advisor, general, and wife by their own childer. Sweeping into their so-called Second City, he placed three curses upon each of the 13 members of the Third Generation, one an amplification of the target's greatest flaws or fears and two general curses levied against all. Each [Glossary('Generation','game_concept_vampgeneration_desc')] removed from Caine would be weaker than the last, and no [Glossary('Generation','game_concept_vampgeneration_desc')] would ever know peace for all would be locked in an eternal struggle to supplant their predecessors (this diminishing nourishment from mortal blood as a Cursed One ages seems to be one of the reasons so few ancients remain active for long. perhaps this was Caine's goal or blessing from G-d). In fact, the Third Generation may have had power on par with Caine's direct childer before Caine levied his curses. Finally, Caine implanted an innate distrust and fear of the Fallen, encouraging his descendants to avoid the Fallen or wipe out their followers (which potentially explains why the Baali Wars and the assault of Carthage are among the very few examples of numerous clans working together). Just as the Third Generation had tried, each [Glossary('Generation','game_concept_vampgeneration_desc')] would attempt to wipe out those before them, ever in fear of what the more powerful previous [Glossary('Generation','game_concept_vampgeneration_desc')] could do to them. These curses also served to amplify the tension between members of the same [Glossary('Generation','game_concept_vampgeneration_desc')], creating an ever-present fear of each other ...\n\nEven before Caine cursed them, the Third Generation sought to recreate the glory of Caine's city. They embraced new members of the Fourth Generation. They collected Noah's descendants to worship and feed them ...\n\n However, they could never shake Caine's curses. They wiped out anyone who attempted to Embrace their own childer. They turned every resident of their city into pawns, nothing more than a piece to be moved in an unimaginable game ...\n\nCaught up in their games, they never noticed as their city grew old and died around them. When they finally fled, it was nearly too late, and many of them died in their flight ...\n\nCaine laughed as he used his mastery of Dominate to alter all memories of this Second City, even eliminating its name. Little was left in the survivors' minds except how their city fell and the memories of their own failings.\n\nExcerpts from the Havanah Vol. 1, Ch. 14 & 17"
 pod1230objectives_judges.16.a: "As always, they destroyed and damned themselves."

 pod1230objectives_judges.17.t: "Tales of the First City"
 pod1230objectives_judges.17.desc: "In his wanderings, Caine developed two things: a lust for power and a desire for a new family. A chance to fulfill both came when a man called Enoch found him. The king and queen of Ubar (but that would make Ubar the First City?) sent out Enoch (despite Enoch never dying, this can't be Methuselah's son which implies that one of Noah's descendants decided to reuse the name), their greatest citizen, to find their city a guardian and a god. Caine was the one Enoch brought back ...\n\nFor the first time, Caine embraced three people: Enoch for bringing him to Ubar and the king and queen of Ubar (speculation from an Arabic tome!) to preserve their love and wisdom. In the latter two, Caine hoped that their love could begin to mitigate his actions. However, they walked into the sun to die after discovering they could no longer give birth to true children. Caine swore never to embrace again, an oath which lasted until Enoch's words and Caine's own loneliness changed his mind ...\n\nIrad was the greatest general alive at the time, chosen by Caine to protect the city of Ubar. While his new nature improved his skills as a leader, it also increased Irad's bloodlust ...\n\nZillah awakened Caine's desire for a wife to accompany him through eternity, but she proved resistant to his charms so he sought other means of winning her affection. In his desperation, Caine sought out his father's second wife, Levatel, who had been cast out of the garden by Adam due to his revulsion from watching her creation. Promising to teach him the secret, she bonded Caine to herself, turning Caine into her thrall and slave. Through his bond, she forced Caine to embrace her (unlikely, no Cainites sources to back this (could be a confusion between Lilith and Levatel)) and stole some of his childer from the Second and Third Generations. However, while subject to the bond, Caine learned its secrets and prepared to kill Levatel. A year and a day after he was first enslaved, the bond faded enough for Caine to stake Levatel and leave her for the sun to kill. His childer that she had claimed and her own childer failed to save her, creating an eternal hatred of the Cainites which continued through the few that survived the Great Flood and led them to join Lilith's brood. With the blood bond, Caine bound Zillah to himself, though it is uncertain whether the bond created an illusion of love or whether she truly grew to love him in time ...\n\nRather than embracing him, Caine transformed the chief of his servants into the first ghoul (perhaps he sought greater loyalty than his own childer demonstrated). With power on par with the Third Generation, Jabal was the highest-ranking mortal in the First City ...\n\nCaine ruled Ubar with an iron fist, exiling or killing any Cursed Ones who broke his rules such as by consorting with the Fallen or murdering each other. Considering how many Third Generations were embraced without his permission, it is interesting that he never cracked down on that (if the blood thickening predates the Great Flood, he may have found himself no longer able to feed on mortals). Also, he was kinder than his childer to the mortals. Some say that he didn't want to risk his food source while other say that he still sought redemption for his acts, though the latter is unlikely considering Zillah's story and his religious prohibitions. Namely, Caine prohibited anyone from worshipping G-d and banned all temples that were not for himself or the other Cursed Ones. At his own temple, he frequently proclaimed how all of his childer were doomed to forever rot, to suffer in Gehinnom should they ever die, and to be ignored by G-d when the apocalypse finally arrived ...\n\nIt is unknown how Enoch managed to convince everyone that Caine renamed Ubar after Enoch (did he or is this just speculation to reconcile Ubar and Enoch?). Perhaps he used Dominate to rewrite memories, or perhaps his childer, the most numerous of the three groups, managed to outshout everyone else ...\n\nExcerpts from a discarded draft of the Havanah Vol. 1, Ch. 5-12"
 pod1230objectives_judges.17.a: "A dark tale indeed."

 pod1230objectives_judges.18.t: "Tales of Lilith and the Disciplines"
 pod1230objectives_judges.18.desc: "Lilith was Adam's first wife and was cast out for two reasons: for her disobedience towards Adam's commands and for her infidelity with a Ben Elohim before the Fall, before the apple was eaten. After wandering the wilds of G-d's creation, she returned to the Garden of Eden and convinced her angelic lover to grant her access. Using strange magicks stolen from the Bene Elohim, she transformed herself into the Serpent who tempted the naive Eve and encouraged that first sin ...\n\nDuring his wanderings, Caine encountered Lilith in her imitation of the Garden of Eden. She was enticed by G-d's mark denoting him as a murderer and the power it represented. She invited him into her home, fed him, bound his wounds, and became his lover. In time, Caine realized Lilith had strange magicks and pleaded with her to grant them to him whether in love or so that he mitigate G-d's curse. And so, Lilith prepared a special ceremony and fed Caine some of her lifeblood. After partaking of her blood, Caine was visited by the 4 Hayyot Bene Elohim who bear the Divine Merkavah, each offering a chance to repent and each cursing him worse than the last as he refused them. When Caine declined him, Mikha'el (Who/none is like G-d) cursed Caine to fear his living fire. When Caine declined him, Rafa'el (G-d has healed) cursed Caine to fear the dawn for the sun's glory would burn like Mikha'el's living fire. When Caine declined him, Auri'el (G-d is my light) cursed Caine to cling to the shadows, to drink blood as he did in this ceremony and like his brother's blood he shed, to consume ashes left by Mikha'el's living fire, to freeze at the point of death, and to have all that they touch crumble into the dust from which all things are made. Gavri'el (G-d is my strength) offered one final chance which could not be declined and would never fade, the only remaining way to receive G-d's mercy and to lift the curse. When he awoke from these visions, Caine had received the 9 magicks that form the base of the modern Disciplines. After this, he abandoned Lilith for reasons unknown, thereby creating the hatred Lilith and her brood still hold towards the Cainites. Some have postulated that G-d enforced His curse on Lilith for her part in Adam and Eve's sin, ensuring that her monstrous brood would never work alongside the Cursed Ones ...\n\nLilith's current location is unknown as the Great Flood destroyed many traces of her activity, including her garden. Some sources state that she retreated into [UmbraGlossaryLocalized('shadowlands','Limbo')] or the [UmbraGlossaryLocalized('dreaming','Dreamland')] where she rebuilt her garden to wait for the day when she can wipe out all threats to her \"children\" and enact her terrible vengeance against Caine. Certain events in Cainite history may also be traced back to her as an attempt to weaken her enemies in preparation for ...\n\nExcerpts from the Havanah Vol. 1, Ch. 2-4"
 pod1230objectives_judges.18.a: "Caine was a fool, but G-d was wise."

 pod1230objectives_judges.19.t: "Tales of Caine"
 pod1230objectives_judges.19.desc: "After Caine became a worker of the ground and Abel became a keeper of the sheep, Caine and Abel decided to bring offerings to YHWH. He was pleased with Abel's sacrifice but not that of Caine. Caine did not provide his first produce nor the best of his produce. Worse, Caine offered sacrifices for the wrong reasons, to show  his prosperity and to earn the attention of his twin sister that he wished to marry. Caine was filled with fury at G-d ignoring his sacrifice. A soon-to-be Fallen, always having hated Abel's piety, excited Caine's anger and his jealousy, providing a dream of inspiration. Two beings resembling Caine and Abel came. Now, one reproached the other. The reproached one became angry with the other and took a beaten plowshare ...\n\nIgnoring all begging for mercy, the reproached cut the other's throat and killed him. Maintaining the ember of anger and never permitting it to be extinguished, Caine became convinced that there was neither judgment nor Almighty Judge nor reward for the righteous nor vengeance against the wicked. His envy of his brother festered and only grew as their parents arranged for Abel to marry Caine's twin sister. Caine took up his plow, beat it to create a blade (seems to indicate a greater degree of premeditation than the stone used in certain versions of the story (might explain the severity of his curse)), approached his brother out in the fields, and sliced the throat of Abel. So it was that Caine spilt the blood of his brother Abel upon the earth, and the blood of Abel streamed upon the earth and his stomach was opened before the flock ...\n\nG-d heard the cries of Abel and saw the future consequences so punished Caine. No longer would the ground yield its strength to Caine, relying on others for nourishment. Forever would he be a fugitive and a wanderer. However, G-d understood the influence of others in the situation and that as the first murderer, Caine lacked full understanding of his action's consequences. As such, Caine was simply cursed and was granted protection from anyone that might attack him.\n\nExcerpts from the Havanah Vol. 1, Ch. 1"
 pod1230objectives_judges.19.a: "But ours is a G-d of second chances. Is there more to this tale?"

 pod1230objectives_judges.20.t: "Redemption for even the Cursed"
 pod1230objectives_judges.20.desc: "At a fundamental level, the Cursed Ones, commonly known as vampires, are wraiths who possess their own corpse with both their corpse and Caine's curse serving as fetters. In His eternal mercy and despite Caine's refusal to accept the gift, G-d gave Caine and his descendants a way now called Golconda to remove their curse and to save their souls from eternal damnation. While it can be stated with some certainty that Caine had not achieved Golconda before the Great Flood, it has been millennia since then so scholars have made some very convincing arguments that Caine has likely achieved Golconda but has not yet passed into the afterlife because he must first resolve matters with his descendants. For further discussion of Caine's current status, please consult the commentaries and articles in Chapter 18 ...\n\nSaulot claimed to have achieved Golconda after stealing some of the knowledge granted to the Wan Xian's descendants by Raziel. He passed those teachings on to the Salubri clan, granting them their iconic third eye and leading many of them to Golconda. However, recent discoveries by local Judges point to the fact that Saulot himself never achieved Golconda. In addition, the Tremere have gone to great pains in their efforts to wipe out the Salubri in general and those who achieved Golconda in particular ...\n\nSaulot even stole the name from the Eastern mystics, with the term poetically referring to the great spiritual wealth held by such transcendental beings. Ironically, those mystics hate the term Golconda because it is not the most accurate term so much as the one Saulot took and popularized among the Western Cursed Ones ...\n\nTo achieve Golconda, a Cursed One must find a mentor, retain or recover their humanity, and make amends for all of their sins. After sufficient research and meditation, they may experience some special insight. With that insight, they can finally begin a suspire which is a vision quest into their dreams and soul. During the suspire, they discover the point of existence, the origins of their inner Beast, and their connection to Caine. Should they fail to achieve Golconda during the suspire, they will never have another chance, if their body and mind even survives. The same is true should they fall out of Golconda by ever committing a sin ...\n\nShould it be achieved, Golconda removes the risk of a Cursed One being consumed by their inner Beast, nearly removes their need for blood, and negates the curses Caine placed on his descendants including the clan banes and the [Glossary('Generation','game_concept_vampgeneration_desc')] limits. In comparison to Lilith's brood, the Cainites are something we hunt due to their cruelty more than anything else. As such, those that have achieved Golconda should be exempt from our hunts, allowing us to spend our resources eliminating far greater threats to our brethren.\n\nDiscarded draft from the Havanah Vol. 1, Ch. 3, marked with \"lacking serious sources\"."
 pod1230objectives_judges.20.a: "Lilith will always be our priority."

 pod1230objectives_judges.24.t: "Send Forth the Word"
 pod1230objectives_judges.24.desc: "The Judges, like the communities they protect, are scattered all over the world. While it has been an acceptable state of affairs (even a boon in some instances, like learning about supernatural monsters from far away), it is also a weakness. There is only so much a decentralized group can do.\n\nYour recent victories and discoveries have put you in a central position of unparalleled authority for the Judges. Your word carries weight and is enough to bring hunters from all over the world into your burgeoning organization.\n\nWith the Holy Land, purged of monsters, as your base of operations, hope for ultimate victory over the children of Lilith has never been so high."
 pod1230objectives_judges.24.a: "Praise be to the Lord on High!"

 pod1230objectives_judges.26.t: "Trade Fleets"
 pod1230objectives_judges.26.desc: "An interesting opportunity has crossed your desk. A merchant fleet is being assembled to ship valuable trade goods. If you wished, you could invest some money into the ships and their goods in the hopes of seeing a return. However, they sail through treacherous waters known for pirates and storms. Should the ships sink, your gold would sink with them. How much would you like to invest?"
 pod1230objectives_judges.26.a: "This should be enough."
 pod1230objectives_judges.26.b: "On second thought..."
 pod1230objectives_judges.26.tt.critical_success: "The gold flows in!"
 pod1230objectives_judges.26.tt.success: "Your investment pays off"
 pod1230objectives_judges.26.tt.middling: "Your investment is paid back"
 pod1230objectives_judges.26.tt.failure: "Your investment is lost"
