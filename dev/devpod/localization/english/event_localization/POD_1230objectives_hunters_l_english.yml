 POD_event_window_widget_gambling_tt: "Amount of [gold|E] you will invest in this mercantile opportunity and therefore the amount of gold you stand to lose should it fail."
 POD_event_window_widget_gambling_requirement_selected: "Must decide how much [gold|E] to invest"

 pod1230objectives_judges.27.t: "New Invention"
 pod1230objectives_judges.27.desc: "An interesting opportunity has crossed your desk. A craftsman has approached you, looking for funding for their latest invention. If you wished, you could invest some money into their efforts in the hopes of seeing a return. However, many inventions prove useless or simply fail to gain traction within the market. Should the venture fail, your gold would be lost. How much would you like to invest?"

 pod1230objectives_judges.28.t: "New Vein"
 pod1230objectives_judges.28.desc: "An interesting opportunity has crossed your desk. A nearby mine has discovered evidence of an untapped vein. If you wished, you could invest some money to help them acquire more manpower and equipment to tap the vein in hopes of seeing a return. However, no one can ever be certain about large a vein will be and whether it will be worth the cost. How much would you like to invest?"

 pod1230objectives_judges.29.t: "Trade Caravans"
 pod1230objectives_judges.29.desc: "An interesting opportunity has crossed your desk. A caravan is preparing to follow a risky trade route, planning to reduce the normal travel time. If you wished, you could invest some money into the caravan and its cargo in the hopes of seeing a return. However, the journey is long and fraught with danger from bandits and lack of proper roads. Should the caravan fail to reach its destination, your gold would be lost. How much would you like to invest?"

 pod1230objectives_judges.30.t: "Fishing Operation"
 pod1230objectives_judges.30.desc: "An interesting opportunity has crossed your desk. A family has approached you, looking for funding to acquire new boats and nets to expand their catch. If you wished, you could invest some money into their operations in the hopes of seeing a return. However, poor weather, empty waters, or damaged equipment could turn a profitable season into a loss. Should the catch prove disappointing, your gold would be lost. How much would you like to invest?"

 pod1230objectives_judges.31.t: "New Mill"
 pod1230objectives_judges.31.desc: "An interesting opportunity has crossed your desk. A small village has recently grown and wishes to construct a nearby mill, reducing their dependence on other villages and the cost to transport goods. If you wished, you could invest some money into the construction in the hopes of seeing a return. However, there is never a guarantee that sufficient farmers will use the mill to make it profitable. Should the mill fail to attract enough business, your gold would be lost. How much would you like to invest?"

