 qorjin_finding_allies_objective_decision_effect: "Unlock access to the $baghatur_visible$ [endowments_lifestyle|E] tree"

 POD_baghatur_objective_mechanic_military_strength: "#underline;TOOLTIP:POD_baghatur_objective_mechanic_military_strength_desc Military Strength#!"
 POD_baghatur_objective_mechanic_military_strength_desc: "Starting with '#V $ambitions_of_blood_objective_decision$#!', all [Concept('decision', 'Objectives')|E] for Qorjin's Baghaturs require #bold Military Strength#! to complete.\n\nMilitary Strength is the sum of the total [prowess|E] of your Baghaturs, meaning your [knights|E], your [vassals|E], and their [knights|E].\n\nAdditionally, Military Strength can be increased by completing certain [Concept('decision', 'Objectives')]\n\nYour current Military Strength is [GetPlayer.MakeScope.ScriptValue('POD_baghatur_objective_military_strength')|0V]"  #TODO: replace ambitions_of_blood_objective_decision with the actual objective of First Strike
 POD_baghatur_increase_military_strength: "$POD_baghatur_objective_mechanic_military_strength$ will increase by [SCOPE.GetValue('increase_value')|0P]"
 POD_baghatur_decrease_military_strength: "$POD_baghatur_objective_mechanic_military_strength$ will decrease by [SCOPE.GetValue('decrease_value')|0N]"
 POD_has_baghatur_military_strength_trigger: "$POD_baghatur_objective_mechanic_military_strength$ must exceed [SCOPE.GetValue('required_military_strength')|0V] #weak ([GetPlayer.MakeScope.ScriptValue('POD_baghatur_objective_military_strength')|0])#!"

 qorjin_sleeping_dragons_objective_decision: "Sleeping Dragons"
 qorjin_sleeping_dragons_objective_decision_desc: "Rumors say that the Sept of the Spirit Stone protects the site where one of the 7 ancient dragons was bound. Once spirits of the Wyld, they were corrupted in their summoning and used as weapons in an ancient battle. Eventually bound by the Silver Fangs and now guarded by the Uktena, the largest of their number and the embodiment of destruction rumbles in his slumber. If we strengthened the chains, we could prove our good intentions and the worth of our aid."
 qorjin_sleeping_dragons_objective_decision_confirm: "Let them lie"
 qorjin_sleeping_dragons_objective_decision_tooltip: "Strengthening the chains that keep a dragon asleep will prove our good intentions to the Uktena."
 qorjin_sleeping_dragons_objective_decision_requirement_learning: "A Siberakh hermit knows the necessary rite, but we will need to solve her riddle. It will not be easy and requires [learning_i] 25+ [learning|E]."
 qorjin_sleeping_dragons_objective_decision_requirement_prowess: "To locate the hermit, we will need the aid of a Wendigo who demands that we retrieve a fetish from one of the Wyrm's minions. Overcoming the thief will require your [GetPlayer.Custom('PODCoterie')] to have at least [prowess_i] 75 [prowess|E]."
 qorjin_sleeping_dragons_objective_decision_requirement_coterie: "Your [GetPlayer.Custom('PODCoterie')] has [EmptyScope.ScriptValue('coterie_max_size')] members"
 qorjin_sleeping_dragons_objective_decision_effect_maa: "Can recruit [GetMaA('uktena_roadrunners_maa').GetName] as [men_at_arms|E]"
 qorjin_sleeping_dragons_objective_decision_effect_decision: "Unlock $seek_aid_of_the_spirits_decision$ [decision|E]"

 qorjin_brain_teaser_objective_decision: "Brain Teaser"
 qorjin_brain_teaser_objective_decision_desc: "While none would consider them a major political force, few can ignore the influence of Stargazers for they have the ears of every Caern. Through their dreams, the Chimera led the Stargazers to the Sept of the Crystal Mind, and many followers of the Sphinx have joined them. While most Caerns restrict who may enter them, the Sept of the Crystal Mind will allow anyone that has found the Caern and proven their wisdom to enter.\n\n#help After taking this decision, you will need to successfully [Concept('translation_minigame', 'translate a simple riddle')|E].#!"
 qorjin_brain_teaser_objective_decision_confirm: "Give me that riddle"
 qorjin_brain_teaser_objective_decision_tooltip: "Should you solve a puzzle, the Stargazers will allow you to enter their caern and speak with the elders."
 qorjin_brain_teaser_objective_decision_requirement_poi: "Have visited [GetBuilding('crystal_mind_caern_01').GetName] #weak ([GetTitleByKey('c_em_dadaels').GetNameNoTier])#!"
 qorjin_brain_teaser_objective_decision_effect_maa: "Can recruit [GetMaA('ratha_maa').GetName] as [men_at_arms|E]"
 qorjin_brain_teaser_objective_decision_effect_decision: "Unlock Divine the Stars [decision|E]"

 qorjin_following_last_footsteps_objective_decision: "Following the Last Footsteps"
 qorjin_following_last_footsteps_objective_decision_desc: "The Silent Striders walk roads few can find, let alone walk themselves. They carry messages between distant septs, bargain with ghosts, and remember kingdoms that have crumbled into dust. They have little reason to trust a conqueror whose banners have burned so many lands.\n\nYet even they cannot ignore what stirs in the east. The Black Spiral Dancers seek a star stone that binds Narlthus, the Beast-of-War's thumb Talon. Should it be freed, every battlefield from the Volga to Karakorum will become its hunting ground. If we can recover the relic before the Wyrm's servants do, perhaps even the eternal wanderers will admit that our war is theirs as well."
 qorjin_following_last_footsteps_objective_decision_confirm: "I shall defeat ITS champion"
 qorjin_following_last_footsteps_objective_decision_tooltip: "The Black Spiral Dancers seek the star stone that binds Narlthus. We shall stop them."
 qorjin_following_last_footsteps_objective_decision_requirement_poi: "While following their trail, you have visited [GetTitleByKey('b_kiev').GetNameNoTier], [GetTitleByKey('b_voronezh').GetNameNoTier], [GetTitleByKey('b_kazan').GetNameNoTier], and [GetTitleByKey('b_ulan_ude').GetNameNoTier]"
 qorjin_following_last_footsteps_objective_decision_requirement_prowess: "To defeat the Wyrm's champion before he can claim the star stone, your [GetPlayer.Custom('PODCoterie')] will require at least [prowess_i] 100 [prowess|E]"
 qorjin_following_last_footsteps_objective_decision_effect_maa: "Can recruit [GetMaA('kinfolk_leeches_hunters').GetName] as [men_at_arms|E]"
 qorjin_following_last_footsteps_objective_decision_effect_decision: "Unlock $POD_moon_bridge_interaction$ [character_interaction|E] as the Silent Striders reveal the secret ways between the caerns"
 qorjin_following_last_footsteps_objective_decision_effect_duel: "Defeat the Wyrm's champion in a duel to receive the rewards"

 qorjin_secret_history_of_mongols_objective_decision: "Secret History of the Mongols"
 qorjin_secret_history_of_mongols_objective_decision_desc: "Many $POD_splat_garou$ suspect that the Mongol invasion of Russia occurred with support from the Shadow Lords. After all, The Shadow Lords ruled the battlefield like no others and admired the Mongols' ferocity, and many rose to positions of power among the Mongols. Some even call themselves the Mongol Lords. The question is whether the Shadow Lords are in control of the partnership... or the Mongols."
 qorjin_secret_history_of_mongols_objective_decision_confirm: "So long as the Khan leads"
 qorjin_secret_history_of_mongols_objective_decision_tooltip: "The so-called 'Mongol Lords' have a great interest in us and could be convinced to join our efforts more actively."
 qorjin_secret_history_of_mongols_objective_decision_requirement_hooks: "You need a [strong_hook|E] on a [GetReligionByKey('shadowlord_religion').GetName] [ruler|E]"
 qorjin_secret_history_of_mongols_objective_decision_effect_maa: "Can recruit [GetMaA('kinfolk_outriders').GetName] as [men_at_arms|E]"
 qorjin_secret_history_of_mongols_objective_decision_effect_decision: "Unlock $deceitful_progress_hostile_schemes_decision$ [decision|E]"

 qorjin_bread_before_glory_objective_decision: "Bread Before Glory"
 qorjin_bread_before_glory_objective_decision_desc: "The Rat's followers care little for our grand victories and have little love for a banner flying above bloody fields and burned houses, the trail that normally follows the Mongolian hordes. However, if our banners brought food and security, they may yet believe our promises."
 qorjin_bread_before_glory_objective_decision_confirm: "Dispatch the caravans"
 qorjin_bread_before_glory_objective_decision_tooltip: "The Bone Gnawers may work with us if we endear ourselves to the cities."
 qorjin_bread_before_glory_objective_decision_requirement_opinion: "[county_opinion|E] of all your [counties|E] must average above #V 50#! #weak ([SCOPE.GetValue('average_popular_opinion')|1])#!"
 qorjin_bread_before_glory_objective_decision_effect_maa: "Can recruit [GetMaA('kinfolk_militia').GetName] as [men_at_arms|E]"
 qorjin_bread_before_glory_objective_decision_effect_decision: "Unlock [diligent_development_focus_decision|E]"

 qorjin_khans_covenant_objective_decision: "The Khan's Covenant"
 qorjin_khans_covenant_objective_decision_desc: "In the beginning, Qorjin bound the $POD_splat_garou$ to him by hook or by crook, by threat or by promises, by opportunity or by riddle. The pacts were experiments, ones that the $POD_splat_garou$ merely tolerated. Having proven themselves to several tribes, the Baghaturs have the opportunity to form a true covenant with them and secure their aid for future wars."
 qorjin_khans_covenant_objective_decision_confirm: "Gather for this ceremony"
 qorjin_khans_covenant_objective_decision_tooltip: "Having proven ourselves to five $POD_splat_garou$ tribes, we can strengthen the old pacts."
 qorjin_khans_covenant_objective_decision_requirement_sleeping_dragons: "Have completed 'qorjin_sleeping_dragons_objective_decision' to ally with the Uktena"
 qorjin_khans_covenant_objective_decision_requirement_brain_teaser: "Have completed 'qorjin_brain_teaser_objective_decision' to ally with the Stargazers"
 qorjin_khans_covenant_objective_decision_requirement_following_last_footsteps: "Have completed 'qorjin_following_last_footsteps_objective_decision' to ally with the Silent Striders"
 qorjin_khans_covenant_objective_decision_requirement_secret_history_of_mongols: "Have completed 'qorjin_secret_history_of_mongols_objective_decision' to ally with the Shadow Lords"
 qorjin_khans_covenant_objective_decision_requirement_bread_before_glory: "Have completed 'qorjin_bread_before_glory_objective_decision' to ally with the Bone Gnawers"

 qorjin_first_strike_objective_decision: "The First Strike"
 qorjin_first_strike_objective_decision_desc: "The [Glossary('Anda','podgloss.anda')] and their dark master are a tide preparing to crash over the world and flood it. You have spent a long time, slowly preparing everything in the shadows. Only when everything is ready will you show your hand for once you do, there is no turning back. You will need to overwhelm them like Chinggis Khan before you, or fall before their wrath."
 qorjin_first_strike_objective_decision_confirm: "Begun, the Mongol Wars have"
 qorjin_first_strike_objective_decision_tooltip: "After extensive preparations, it is time to make the first strike against the [Glossary('Anda','podgloss.anda')]."
 qorjin_first_strike_objective_decision_requirement_kills: "You need to kill at least #V 5#! [GetFaithByKey('viayasaq').GetName], [GetDynastyHouseByID('house_anda').GetName], and [GetDynastyHouseByID('house_erk').GetName] [characters|E]"
 qorjin_first_strike_objective_decision_effect: "Give [GetModifier('POD_strikes_of_baghaturs_modifier').GetNameWithTooltip] to all landed [Glossary('Anda','podgloss.anda')] for 25 years"

 qorjin_baghaturs_objective_time_limit_warning: "#warning Taking this objective will start a timer, and you must complete each objective within a certain amount of time. If you fail, the Baghaturs will lose momentum and be crippled!#!"
 qorjin_baghaturs_objective_time_limit: "#N If this objective isn't achieved by [GetGlobalVariable('qorjin_baghaturs_objective_time_limit_var').GetValue|0V] at the latest, the Baghaturs will lose momentum and be crippled!#!\n\nIf achieved by then, the next objective of the chain will be unlocked."
 qorjin_baghaturs_current_date_tt: "This objective is only available before [GetGlobalVariable('qorjin_baghaturs_objective_time_limit_var').GetValue|0V]" 

 qorjin_securing_the_homeland_objective_decision: "Securing the Homeland"
 qorjin_securing_the_homeland_objective_decision_desc: "We are Mongols. Without our homeland, our recruiting efforts will always be hampered as we lack access to the Horde's heart. Worse, our homeland has become the breeding grounds of leeches. Only once our own lands are secure can we think of carrying the war to the monsters and truly purging them."
 qorjin_securing_the_homeland_objective_decision_confirm: "It begins with the Khan's capital"
 qorjin_securing_the_homeland_objective_decision_tooltip: "Our homeland, the core of the Mongolian Empire, must be purged of monsters."
 qorjin_securing_the_homeland_objective_decision_effect: "Allows for the use of the Invasion Casus Belli"

 qorjin_ride_across_the_lands_objective_decision: "Ride Across Their Lands"
 qorjin_ride_across_the_lands_objective_decision_desc: "The old stories spoke true. The monsters bleed like any other when struck hard enough. Our scouts know their roads, our allies know their weaknesses, and our riders no longer fear crossing into their lands. The Baghaturs no longer ride into the unknown."
 qorjin_ride_across_the_lands_objective_decision_confirm: "We ride as hunters"
 qorjin_ride_across_the_lands_objective_decision_tooltip: "With Mongolia secured, it is time to ride across the lands, hunting the monsters wherever they may hide."
 qorjin_ride_across_the_lands_objective_decision_effect: "Give [GetModifier('POD_heroes_of_the_people_modifier').GetNameWithTooltip] to allied [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E]."

 qorjin_rooting_out_the_anda_objective_decision: "Rooting Out the Anda"
 qorjin_rooting_out_the_anda_objective_decision_desc: "The Leech-servants of the Hell of Spiked Chains have been driven back from the core of our homeland but not yet destroyed. They retreat into their conquered territories and behind their frightened victims, hoping time will dull our edge as it has of every mortal before us. They will find no such mercy in us."
 qorjin_rooting_out_the_anda_objective_decision_confirm: "Every hidden nest will be rooted out"
 qorjin_rooting_out_the_anda_objective_decision_tooltip: "TODO"
 qorjin_rooting_out_the_anda_objective_decision_effect_speed: "#P +50%#! [planning_speed|E] on the Find Lair [journey|E]"
 qorjin_rooting_out_the_anda_objective_decision_effect_success: "Increases success chance when using [prowess|El] or [martial|El] during the Find Lair [journey|E]"
 qorjin_rooting_out_the_anda_objective_decision_reward: "You have rooted out the Anda"

 qorjin_restoring_the_empire_objective_decision: "Restore the Empire of Chinggis"
 qorjin_restoring_the_empire_objective_decision_desc: "The Anda and the risk they posed provided something that Fera and hunter could rally around. It gave us purpose and focus. With the Anda threat quelled, a unique opportunity presents itself. For a little while longer, you will maintain their support, and the legacy of that unity will remain. In that time, you could follow in Chinggis Khan's footsteps, take the land he took, and do the one thing he failed to do in his lifetime: purge it of the parasites."
 qorjin_restoring_the_empire_objective_decision_confirm: "Ride while the world still follows"
 qorjin_restoring_the_empire_objective_decision_tooltip: "TODO"
 qorjin_restoring_the_empire_objective_decision_effect_exclusive: "#X This is mutually exclusive with the '$qorjin_protector_of_the_garou_objective_decision$' [decision|E] and will lock you into a particular path.#!"
 qorjin_restoring_the_empire_objective_decision_effect_cb: "Allows for the use of the Mongolian Invasion Casus Belli"

 qorjin_protector_of_the_garou_objective_decision: "Protector of the $POD_splat_garou$"
 qorjin_protector_of_the_garou_objective_decision_desc: "The Anda and the risk they posed provided something that Fera and hunter could rally around. It gave us purpose and focus. With the Anda threat quelled, we won a victory no $POD_splat_garou$ elder thought possible. Perhaps it is time to look inwards at that alliance. The Khan will deal with the mundane, maybe we could deal with the supernatural and become a protector of the $POD_splat_garou$ within his lands."
 qorjin_protector_of_the_garou_objective_decision_confirm: "TODO"
 qorjin_protector_of_the_garou_objective_decision_tooltip: "TODO"
 qorjin_protector_of_the_garou_objective_decision_requirement_vassal: "You have a $POD_splat_garou$ [powerful_vassal|E]"
 qorjin_protector_of_the_garou_objective_decision_requirement_councilor: "You employ at least #V 3#! $POD_splat_garou$ Councilors with a [skill|E] of at least #color_white 15#! in their respective council positions"
 qorjin_protector_of_the_garou_objective_decision_effect_exclusive: "#X This is mutually exclusive with the '$qorjin_restoring_the_empire_objective_decision$' [decision|E] and will lock you into a particular path.#!"
 qorjin_protector_of_the_garou_objective_decision_effect_maa: "Can recruit [GetMaA('heavenlysuccessors_maa').GetName], [GetMaA('swarm_maa').GetName], [GetMaA('wendigo_maa').GetName], [GetMaA('bringers_light_maa').GetName], [GetMaA('daggers_nut_maa').GetName] as [men_at_arms|E]"
 qorjin_protector_of_the_garou_objective_decision_effect_court: "Can employ [GetCourtPositionType('master_rite_court_position').GetName()], [GetCourtPositionType('gatekeeper_court_position').GetName()], [GetCourtPositionType('wyrm_foe_court_position').GetName()], [GetCourtPositionType('talesinger_court_position').GetName()], [GetCourtPositionType('master_challenges_court_position').GetName()]"

 qorjin_concord_of_jade_throne_objective_decision: "Concord of the Jade Throne"
 qorjin_concord_of_jade_throne_objective_decision_desc: "Over the past decades, the Kuei-Jin watched as our banners approached their lands, as our horsemen cut down the Anda, as our soldiers hunted down the Akuma. While we forced many $POD_splat_garou$ septs to bow to the Khans, the Kuei-Jin are a far greater power, and the mortal court is already bound to the Khans. Building on their previous relationships with the Shih and Beast Courts, they are willing to receive our envoys. Let the Kuei-Jin keep their customs, their courts, and their dead so long as they send aid when the Khan calls for them."
 qorjin_concord_of_jade_throne_objective_decision_confirm: "The Jade Throne shall know our word"
 qorjin_concord_of_jade_throne_objective_decision_tooltip: "TODO"
 qorjin_concord_of_jade_throne_objective_decision_requirement_kueijin: "All [GetTrait('kueijin').GetName(GetNullCharacter)] in [GetGeographicalRegion('POD_region_middle_kingdom').GetName] are your [vassals|E]"
 qorjin_concord_of_jade_throne_objective_decision_requirement_kueijin_ex: "$qorjin_concord_of_jade_throne_objective_decision_requirement_kueijin$ #weak ([example_kueijin.GetName])#!"
 qorjin_concord_of_jade_throne_objective_decision_requirement_anda: "No [GetFaithByKey('viayasaq').GetName] holds land in the [GetGeographicalRegion('POD_region_middle_kingdom').GetName]"
 qorjin_concord_of_jade_throne_objective_decision_requirement_anda_ex: "$qorjin_concord_of_jade_throne_objective_decision_requirement_anda$ #weak ([example_anda.GetName])#!"
 qorjin_concord_of_jade_throne_objective_decision_requirement_akuma: "No [akuma|E] holds land in the [GetGeographicalRegion('POD_region_middle_kingdom').GetName]"
 qorjin_concord_of_jade_throne_objective_decision_requirement_akuma_ex: "$qorjin_concord_of_jade_throne_objective_decision_requirement_akuma$ #weak ([example_akuma.GetName])#!"

 qorjin_mandate_of_shield_objective_decision: "Mandate of the Shield"
 qorjin_mandate_of_shield_objective_decision_desc: "Already, we have formed a covenant between ourselves and the $POD_splat_garou$ as we swore to become their protectors. We are no longer hunters merely seeking to kill monsters in the name of the Khan. However, the $POD_splat_garou$ are not the only Fera within the lands of the Khans. When the Wyrm's servants come, they will find Mongol steel waiting alongside fang, claw, and scale."
 qorjin_mandate_of_shield_objective_decision_confirm: "Let them break upon our shields!"
 qorjin_mandate_of_shield_objective_decision_tooltip: "TODO"
 qorjin_mandate_of_shield_objective_decision_requirement_alliance: "Have an alliance with a #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_fera_beast_courts #L Beast Court#!#! [ruler|E]"
 qorjin_mandate_of_shield_objective_decision_requirement_court: "Must employ a #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_fera_beast_courts #L Beast Court#!#! $glossary_fera$ as a [GetCourtPositionType('master_rite_court_position').GetName()], [GetCourtPositionType('gatekeeper_court_position').GetName()], [GetCourtPositionType('wyrm_foe_court_position').GetName()], [GetCourtPositionType('talesinger_court_position').GetName()], or [GetCourtPositionType('master_challenges_court_position').GetName()] with Excellent [aptitude|E]"
 qorjin_mandate_of_shield_objective_decision_requirement_wyrm: "No #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_fera_triat_alignment_wyrm #L Wyrm-aligned#!#! $glossary_fera$ holds land in the [GetGeographicalRegion('POD_region_middle_kingdom').GetName]"
 qorjin_mandate_of_shield_objective_decision_requirement_wyrm_ex: "$qorjin_mandate_of_shield_objective_decision_requirement_wyrm$ #weak ([example_wyrm.GetName])#!"

 pod1230objectives_baghaturs.100.t: "Darkening Skies"
 pod1230objectives_baghaturs.100.desc: "Fearless Qorjin, you refused to yield before the men-who-became-wolves at the Battle of Samara Bend, creating a diversion that allowed your arban to safely withdraw. Impressed by your courage, Chinghis Khan himself gave you a new duty. In the intervening years, you have studied the unseen world, learned to use the fears and superstitions of your enemies to your greatest advantage, and brought the creatures of myth to bay before the Mongol Empire. In your time, you have brought many septs into the fold and gathered the Bey's Hand, a pack of Garou to serve as privileged friends and counselors.\n\nNow, years later, the Khan has ordered you to return to Volga Bulgaria so that you may sway the #underline;TOOLTIP:building_type_red_cedar_01_desc Sept of the Red Cedar#!, the Garou that once crushed Subatai's forces. Pei Ling warns you of the the dire consequences the upcoming eclipse will have upon the Garou psyche, and Batuani Seven-Shadows cautions you that a great darkness is looming in the Umbra, an unsettled place even in calmer times. Two hundred years ago, the Jaggling Dazbog emerged from the Umbra as 40-foot tall monstrosity, studded with the faces and fir of countless Garou that had fought each other in its name. Some yet lived, their flesh twisting and melting and healing as their gaping maws soundlessly screamed. Many dispirited Garou were dragged into the Wyrm's pit, either feeding the nearly-birth fomor or joining his ranks as Black Spiral Dancers. While it was imprisoned in the Red Cedar, those chains have weakened. With such strange portents, how many of your baghaturs will accompany you?"
 pod1230objectives_baghaturs.100.a: "A single jagun is sufficient"
 pod1230objectives_baghaturs.100.a.tt: "Should this go poorly, you could lose up to #N 100#! $POD_baghatur_objective_mechanic_military_strength$"
 pod1230objectives_baghaturs.100.b: "Several jaguns may be necessary"
 pod1230objectives_baghaturs.100.b.tt: "Should this go poorly, you could lose up to #N 250#! $POD_baghatur_objective_mechanic_military_strength$"
 pod1230objectives_baghaturs.100.c: "I shall take an entire mingat"
 pod1230objectives_baghaturs.100.c.tt: "Should this go poorly, you could lose up to #N 500#! $POD_baghatur_objective_mechanic_military_strength$"

 pod1230objectives_baghaturs.110.t: "First Contact"
 pod1230objectives_baghaturs.110.desc: "After establishing your kuriyen, the Bey's Hand and your scouts begin to explore this flat expense, thick with pine and cut through by dozens of rivers and tributaries. To the east rests a manor among a well-tended grove of firs, home to the Sept of the Red Cedar with the circular stone homes of the Bulgars stretching out along the river banks. According to the rumers, with each passing night, another farm has been left empty of people. The sept seems to have ignored all of this... until last night.\n\nWhile observing from a distance, the Bey's Hand watched as a pack from the nearby sept went into town at late evening. It was late evening, a time when people should be gathered as families, warmed by the fires in their hearths. Instead, the town was dark, no fires or candles to be seen. They passed through a poorly-made palisade that had not been there two weeks earlier. The mass of pointed timbers were toppled, now angled inwards like arrows directing attention to scuffs on the street and the discarded weapons. Yet, there is little sign of struggle or bloodshed, merely scuffs leading inwards. At the dead center of town was a mound of earth cast aside by whatever dug upwards and formed the massive hole. Admidst the hole's oppressive and suffocating darkness, the sounds of a crying child issued forth. When they tried to aid the child, the pack was ambushed by Black Spiral Dancers in Lupus form and strange wolf-like banes twisted into serpentine forms, their lower jaws only loosely connected by a web of flesh and filled with barbed teeth slowly dripping black ichor. Bey's Hand chose to rush in and aid the pack, forcing the Black Spiral Dancers to flee and to collapse the tunnels behind them.\n\nHaving made contact, Pei Ling convinced the pack to meet you. They are honored guests and potential allies, and you ensure that they are treated accordingly. Only after acclimatizing and entertaining them, you present your offer. The Sept of the Red Cedar will pledge vassalage to the Khan through you as his representative. In exchange, the forces you brought along, and the entire Mongol army if necessary, will help the Sept against the Black Spiral Dancers, and Batuani will use certain Uktena secrets to strengthen Dazbog's bindings, freeing the Caern's totem from its duty. In addition, the army will avoid the Sept's lands when they invade the area in a few years, and the Sept can join the other septs already sworn to the Khan in a truce and alliance so that they can fight the Wyrm together, for the good of all of Gaia. Of course, the pack cannot answer for their sept."
 pod1230objectives_baghaturs.110.a: "Return to your Sept with Pei and present my offer."
 pod1230objectives_baghaturs.110.effect.success.desc: "The moot pledges vassalage to the Khan"
 pod1230objectives_baghaturs.110.effect.failure.desc: "The moot votes against your offer"

 pod1230objectives_baghaturs.120.t: "The Evergreen Prison"
 pod1230objectives_baghaturs.120.desc: "Standing side by side, Garou and Baghaturs form a ring around the Red Cedar. Together, they watch as both Helios and Luna turn their faces from the world, leaving nothing more than a thin ring of light to illuminate the prepared warriors. Pei Ling walks among them, quieting the $glossary_rage$ and preventing a frenzy. Then, twenty twisted werewolves and thrice that number of strange and terrible fomori jump out of the ground at the caern's heart, the oily blackness leaking from their eyes draining what little light shines from above.\n\nThe silvered blades of our Baghaturs flash in the sun's weak light as fangs and claws strike out, beating against a wall of swords. Black ichor leaks from the enemies' wounds, melting the stone under their fallen forms. Admidst it all, Pei Ling prepares a rite. The beasts sense the accumulating power and throw themselves against your blades in ever-greater madness. As the rite reaches its culmination, a flash consumes you, pulling you and your personal guard into the Umbra with Pei and Batuani where you spring upon fifteen more horrors as they assault the Red Cedar's spiritual link to the land. Spirits, no longer observed by Luna, strike out at you, and trees reaching far into the sky seek to swallow you. A land thick with fog even at Helios' height is now an ocean ready to drown you, and still the battle rages on. Near the tree, Batuani begins her chant."
 pod1230objectives_baghaturs.120.a: "Hold the line until Batuani finishes her work!"
 pod1230objectives_baghaturs.120.effect.critical_success.desc: "Victory!"
 pod1230objectives_baghaturs.120.effect.success.desc: "Victory but at a cost"
 pod1230objectives_baghaturs.120.effect.failure.desc: "Little of the sept remains"

 pod1230objectives_baghaturs.121.t: "What Comes After"
 pod1230objectives_baghaturs.121.desc: "As the sun creeps out and the darkness lifes, you survey the battle's aftermath. The Sept of the Red Cedar was never large, with only thirty Garou present at any one time; no where near enough to hold back such an assault. Your force of highly-trained and silver-armed warriors guaranteed victory, but the battle still took its toll on the caern. Corpses litter the grove, and gaping hole leads deep into the earth, presumably connected to the Hive. As the Garou begin to carve the names of their fallen into the Red Cedar, you recognize the danger posed by the lack of defenders. Even the Umbra was not left intact. Pei Ling begs you to aid the sept in their recovery efforts, but can you afford the resources?"
 pod1230objectives_baghaturs.121.a: "I shall help them rebuild."  #100 gold, +100 MS, 
 pod1230objectives_baghaturs.121.b: "I shall launch a counterattack against the Hive."  #100 prestige, +100 MS
 pod1230objectives_baghaturs.121.c: "I have the men to do both."  #100 gold & 100 prestige, +200 MS
 pod1230objectives_baghaturs.121.d: "I lack the resources."

 pod1230objectives_baghaturs.130.t: "Unfortunate... Most Unfortunate"
 pod1230objectives_baghaturs.130.desc: "As the eclipse approached, Pei Ling delivered an impassioned speech to the sept's elders. She implored them to accept your terms of peace, not just for the good of the sept but for the good of all of Gaia. Together, the Black Spiral Dancers would lose, and the stage would be set to strike against the Wyrm. Even Voice-of-Thunder, the oldest living Garou in Europe, keeper of Bakr and Ondreiana's pact, spoke in favor of this alliance for nothing matters more than maintaining the Red Cedar. Yet, the sept's schism ran too deep, and they voted against accepting your offer.\n\nThe Bey's Hand begs you not to break camp and leave the sept to its fate. Should Dazbog escape, the effects on this region would be disastrous, and countless would die until the tribes could set their differences aside long enough to once more imprison it. Pei Ling is bound to you by her oath, Nightflit is a representative of his sept, and Running Prince is an explorer. They will not leave, but Batuani has threatened to do so. After all, she only joined you because you convinced her that it was her duty to counsel you and prevent you from causing harm. She has always wished to help local Garou rather than ignoring them or using them as tools, and in this scenario, she believes that she is the only one in the region capable of strengthening Dazbog's bindings such that they cannot be broken for many generations."
 pod1230objectives_baghaturs.130.a: "Very well. For the good of all."
 pod1230objectives_baghaturs.130.b: "We only protect the Khan's people."

 pod1230objectives_baghaturs.131.t: "Turning the Tide"
 pod1230objectives_baghaturs.131.desc: "Awaiting their inevitable deaths, the Garou form a ring around the Red Cedar. As they watch, both Helios and Luna turn their faces from the world, leaving nothing more than a thin ring of light to illuminate the waiting warriors. The frenzy takes hold in many hearts, turning them wild with $glossary_rage$ and incapable of distinguishing friend from foe. Then, twenty twisted werewolves and thrice that number of strange and terrible fomori jump out of the ground at the caern's heart, the oily blackness leaking from their eyes draining what little light shines from above. Admidst the chaos, your Baghaturs arrive with silver weapons and orders to kill anything that loops warped or twisted even for a werewolf. They carve a swath, their foes leaking black ichor that melts the stone under your horses' hooves.\n\nHaving reached the battle's center, your men arrange themselves defensively around Pei Ling as she prepares a rite. The beasts sense the accumulating power and throw themselves against your blades. Fangs crack. Claws stop. Silver flashes in the waning light. As the rite reaches its culmination, a flash consumes you, pulling you and your personal guard into the Umbra with Pei and Batuani where you spring upon fifteen more horrors as they assault the Red Cedar's spiritual link to the land. Spirits, no longer observed by Luna, strike out at you, and trees reaching far into the sky seek to swallow you. A land thick with fog even at Helios' height is now an ocean ready to drown you, and still the battle rages on. Near the tree, Batuani begins her chant."
 pod1230objectives_baghaturs.131.a: "Hold the line until Batuani finishes her work!"

 pod1230objectives_baghaturs.132.t: "From a Distance"
 pod1230objectives_baghaturs.132.desc: "While all of the Bey's Hand is furious with your decision, only Batuani choose to leave the jagun. She realizes that she will forver be ostracized from it, and you are disappointed to lose one of your best counselors. However, she will not abandon what she see as her duty.\n\nYou give the orders to break camp, and your men begin the preparations. However, the Black Spiral Dancers are not the only ones moving admidst the growing shadows as the moon moves to cover the sun. The patches of darkness provide cover for spirits who would ambush you, wanting to vent their frustrations against the Garou and all mortals while their mother godness is not looking down from above. Worse, some esoteric rites seem to have riled them up.\n\nThankfully, your well-trained and equipped force is easily able to hold off these assaults until the eclipse ends. With daylight returned, the packing finishes, and you depart so that you may make a report to the Khan. On the way back, your scouts inform you of what happened. The caern has fallen with every member of the sept dead, but a mad bane does not rampage across the land. In her last moments as fomori feasted upon her intestines, Batuani barely managed to complete her rite and seal Dazbog away. Even from a distance, the scouts could tell that corruption was spreading into the grove that once housed the caern, rotting away the life that once flourished."
 pod1230objectives_baghaturs.132.a: "We shall deal with the Hive when we return."

