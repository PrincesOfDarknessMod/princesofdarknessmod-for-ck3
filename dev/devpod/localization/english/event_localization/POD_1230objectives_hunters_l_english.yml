 POD_perfect_world_judge_interaction: "Perfect World"


 
 ikhwan_contact_turkmen_objective_decision: "Contact the Turkmen"
 ikhwan_contact_turkmen_objective_decision_desc: "Across Anatolia and the lands east of it, countless ghazis, Turkmen warriors, and mounted retainers wage an endless struggle against both mortal and supernatural foes. Though divided between many rulers, they share certain traditions of horsemanship and discipline. Contacting them could let us benefit from their experience and resources."
 ikhwan_contact_turkmen_objective_decision_confirm: "Send a messenger"
 ikhwan_contact_turkmen_objective_decision_tooltip: "The horsemen of Anatolia could teach us much."

 ikhwan_unify_tribes_objective_decision: "Unify the Tribes"
 ikhwan_unify_tribes_objective_decision_desc: "In the early days of Islam, the common folk spoke of the sayyad al-ghula. These solitary hunters were peasants, shepherds, and other simple folk, empowered by their faith to accomplish great feats. They sought to exterminate the undead monsters that had touched, and thus defiled, the world. Influenced by or perhaps always of the tribesmen, those that would become the Sayyadin congregated in tribes and families, able to complete ever-greater hunts.\n\nIt is time that all of the tribes become one family, united by tragedy and in purpose."
 ikhwan_unify_tribes_objective_decision_confirm: "It is time to work together"
 ikhwan_unify_tribes_objective_decision_tooltip: "Too long have the tribes worked alone. It is time to change that."
 ikhwan_unify_tribes_objective_decision_reward_tt: "You now get 3 people when recruiting Ikhwan al-Safa from the $contact_fellow_hunters_decision$ [decision|E]"

 ikhwan_sultans_patronage_objective_decision: "Seeking the Sultan's Patronage"
 ikhwan_sultans_patronage_objective_decision_desc: "For centuries, our families and tribes have hunted the monsters lurking within the shadows. We have achieved feats many would consider impossible. Yet, our foes are continuing to organize and are slowly becoming accustomed to our strategies. Even with our forces being strengthened, more and more of our brave hunters are dying. We could request aid from the Sultan, leader of the Muslim world. However, resources and manpower from them would come with strings that would tie us into their political struggles."
 ikhwan_sultans_patronage_objective_decision_confirm: "We bow to the Sultan"
 ikhwan_sultans_patronage_objective_decision_tooltip: "If we are willing to sacrifice some of our independence, we could turn to the Sultan for resources and manpower."
 ikhwan_sultans_patronage_objective_decision_tt_effect1: "#X This is mutually exclusive with the 'Friends in Unusual Places' [decision|E] and will lock you into a particular path.#!"
 ikhwan_sultans_patronage_objective_decision_tt_effect2: "Based on their personality, all Ikhwan al-Safa will receive 1 of 3 traits which grants access to a [endowments_lifestyle|E] tree"
 ikhwan_sultans_patronage_objective_decision_tt_effect3: "Unlock '$sultan_ask_for_gold_interaction$' [character_interaction|E]"

 sultan_ask_for_gold_interaction: "Request Budgetary Expansion"
 sultan_ask_for_gold_interaction_desc: "Having sworn ourselves to the Sultan and joined his military, we can ask him to expand our budget, though we may have to admit certain failures or address certain rivals that would otherwise receive those resources."

 ikhwan_purge_hidden_courts_objective_decision: "Purge the Hidden Courts"
 ikhwan_purge_hidden_courts_objective_decision_alt: "Shadows Within the Sultan's Guard"
 ikhwan_purge_hidden_courts_objective_decision_desc: "Anatolia has been contested by many of the great powers of the last millennia. Amongst these mortal rulers are older powers holding court. These hidden domains have quietly guided the fate of Anatolia for generations. Their influence must be broken before our work can truly bear fruit."
 ikhwan_purge_hidden_courts_objective_decision_desc_alt: "The Sipahis are one of the three progenitors of the Ikhwan al-Safa. If we wish to ensure the lasting legacy of our organization, we will need their complete support. Unfortunately, while our brothers among the Sipahis try to aid us, their efforts are often undone by the fiends lurking among the Janissaries. This must be remedied."
 ikhwan_purge_hidden_courts_objective_decision_confirm: "The problem has been dealt with."
 ikhwan_purge_hidden_courts_objective_decision_tooltip: "Anatolia is a hot-bed of conflict, all carefully directed from the shadows. This must be remedied."
 ikhwan_purge_hidden_courts_objective_decision_tt_effect: "A competent member of the Sultan's guard will join you"

 ikhwan_reawaken_brethren_objective_decision: "Awaken the Brethren"
 ikhwan_reawaken_brethren_objective_decision_desc: "The Brethren of Sincerity, sometimes known as the Nur al-Allah, are one of the three progenitors of the Ikhwan al-Safa. If we wish to ensure the lasting legacy of our organization, we will need their complete support. Unfortunately, most of their teachings have been lost since their early days in Basra and Baghdad."
 ikhwan_reawaken_brethren_objective_decision_confirm: "We have their support"
 ikhwan_reawaken_brethren_objective_decision_tooltip: "The Brethren of Sincerity contributed to the mystical knowledge of the Ikhwan al-Safa. Reestablishing them would improve our understanding of sorcery."
 ikhwan_reawaken_brethren_objective_decision_tt_effect: "A competent member of the Brethren of Sincerity will join you"

 ikhwan_gathering_sayyadin_objective_decision: "Gathering the Sayyadin"
 ikhwan_gathering_sayyadin_objective_decision_desc: "The Sayyadin are one of the three progenitors of the Ikhwan al-Safa. If we wish to ensure the lasting legacy of our organization, we will need their complete support. Unfortunately, their nomadic roots and tenacious enemies have seen them scattered to the four winds."
 ikhwan_gathering_sayyadin_objective_decision_confirm: "We have their support"
 ikhwan_gathering_sayyadin_objective_decision_tooltip: "The Sayyadin contributed to the hunting knowledge of the Ikhwan al-Safa. Reestablishing them would improve our ability to hunt vampires across many lands."
 ikhwan_gathering_sayyadin_objective_decision_tt_effect: "A competent member of the Sayyadin will join you"

 ikhwan_infernal_complications_objective_decision: "Infernal Complications"
 ikhwan_infernal_complications_objective_decision_desc: "The Sultan has a great deal of interest in Syria. Trade and pilgrims flow through the region, generating large sums of money. In addition, holding the land enhances the sultan's legitimacy. However, the supernatural landscape is far more hostile to the Sultan's efforts. Besides Christian hold-overs from the Crusades, many infernalists and demon-worshippers practice their evil crafts. Weakening their hold will go a long way towards stabilizing the local eyalets and safeguarding the Sultan's interests. Our instructions are to search them out and cleanse the land of their taint."
 ikhwan_infernal_complications_objective_decision_confirm: "The land is finally free"
 ikhwan_infernal_complications_objective_decision_tooltip: "Syria is filled with infernalists and demon-worshippers that are interfering with the Sultan's interests."
 ikhwan_infernal_complications_objective_decision_tt_effect: "Unlock '$POD_seeking_out_evil_interaction$' [character_interaction|E]"

 ikhwan_handling_blood_sorcerers_objective_decision: "Handling the Blood Sorcerers"
 ikhwan_handling_blood_sorcerers_objective_decision_desc: "In the times of Caliph Abu Tamim Ma'ad al-Mu'izz li-Din Allah, some of the most veteran members of the Ikhwan al-Safa journeyed to Cairo and established the Dar el-Adil. However, the Sultan has asked us to increase our presence within Cairo and to cleanse its streets. The pagan cults have been growing in influence and conducting abominable rituals. Our instructions are to bring the cultists back into the fold."
 ikhwan_handling_blood_sorcerers_objective_decision_confirm: "The cults will be dealt with"
 ikhwan_handling_blood_sorcerers_objective_decision_tooltip: "Pagan cults have taken over the streets of Cairo, interfering with the Sultan's interests."
 ikhwan_handling_blood_sorcerers_objective_decision_tt_effect: "You will claim the #TOOLTIP:artifact_forbidden_grimoire_description #L $artifact_forbidden_grimoire_name$#!#! [artifact|E]"

 ikhwan_aiding_tributaries_objective_decision: "Aiding the Tributaries"
 ikhwan_aiding_tributaries_objective_decision_desc: "Recently, we have been establishing a new lodge in Tunis. However, our burgeoning presence has proven insufficient as the Sultan's tributaries and Muslim nations in North Africa are running afoul of the local supernatural entities. Our endeavors have been interrupted, and tribute has been diverted. Our instructions are to resolve the problem, permanently."
 ikhwan_aiding_tributaries_objective_decision_confirm: "We have succeeded, our Sultan!"
 ikhwan_aiding_tributaries_objective_decision_tooltip: "If we could strengthen the Sultan's tributaries, additional funds could be allocated for our efforts."
 ikhwan_aiding_tributaries_objective_decision_tt_effect: "#P -25%#! cost for $great_project_type_found_hunter_cell$ great project and its contributions"

 ikhwan_friends_in_unusual_places_objective_decision: "Friends in Unusual Places"
 ikhwan_friends_in_unusual_places_objective_decision_desc: "Once, all of us hunted alone, but we quickly discovered that the greatest evils could not be defeated without aid."
 ikhwan_friends_in_unusual_places_objective_decision_confirm: "Even if that aid comes from strange sources"
 ikhwan_friends_in_unusual_places_objective_decision_tooltip: "Even if aid comes from unusual places, any aid is valuable in our hunt."
 ikhwan_friends_in_unusual_places_objective_decision_tt_effect1: "#X This is mutually exclusive with the 'Seeking the Sultan's Patronage' [decision|E] and will lock you into a particular path.#!"
 ikhwan_friends_in_unusual_places_objective_decision_tt_effect2: "Based on their personality, all Ikhwan al-Safa will receive 1 of 3 traits which grants access to a [endowments_lifestyle|E] tree"
 ikhwan_friends_in_unusual_places_objective_decision_tt_nonruler_relations: "Have at least #color_white 5#! non-ruler friends or lovers"
 ikhwan_friends_in_unusual_places_objective_decision_tt_magical_relations: "Have at least #color_white 3#! [GetTrait('sorcerer').GetName(GetNullCharacter)], or [GetTrait('theurgist').GetName(GetNullCharacter)] friends or lovers"
 ikhwan_friends_in_unusual_places_objective_decision_tt_great_relations: "Have at least #color_white 1#! friend or lover that is a [GetTrait('historical_character').GetName(GetNullCharacter)]"

 ikhwan_aid_light_bringers_objective_decision: "Aid the Light-bringers"
 ikhwan_aid_light_bringers_objective_decision_desc: "The more practical members of the Sayyadin recognize that the Mummies are more experienced and knowledgeable about the night-stalkers than even the Ikhwan al-Safa are, and so recommend that we extend our aid to them."
 ikhwan_aid_light_bringers_objective_decision_confirm: "Immortal friends?"
 ikhwan_aid_light_bringers_objective_decision_tooltip: "You will cleanse the core of the Land of Faith and benefit from the Mummies' help."
 ikhwan_aid_light_bringers_objective_decision_effect_tt: "You will have a choice between becoming a fully fledged Mummy or enjoying an extra life instead."
 ikhwan_aid_light_bringers_objective_decision_requirement_kills: "Have killed at least #color_white 10#! Setites"
 ikhwan_aid_light_bringers_objective_decision_requirement_ruler: "No Setite can hold a Kingdom [title|E]"

 ikhwan_earning_title_grand_objective_decision: "Earning the Title 'Grand'"
 ikhwan_earning_title_grand_objective_decision_desc: "The lands under the protection of the Sayyadin contain several key cities, hearts of religion and trade. With our aid, they could become truly grand cities upon which an economy can rest."
 ikhwan_earning_title_grand_objective_decision_confirm: "About time!"
 ikhwan_earning_title_grand_objective_decision_tooltip: "Our lands contain several hearts of religion and trade which could become truly grand with some aid."
 ikhwan_earning_title_grand_objective_decision_second_step: "Which should we support?"
 ikhwan_earning_title_grand_objective_decision_effect_cost: "If you don't own the city selected, it will cost you 1000 [gold|E]"
 ikhwan_earning_title_grand_objective_decision_requirement_skills: "Your [GetPlayer.Custom('PODCoterie')] must have at least 20 in [stewardship|E]"
 ikhwan_earning_title_grand_objective_decision_requirement_coterie: "At least #color_white 1#! member of your [GetPlayer.Custom('PODCoterie')] is an [GetTrait('architect').GetName(GetPlayer)] or [GetTrait('administrator').GetName(GetPlayer)]"
 ikhwan_earning_title_grand_objective_decision_cairo: "Aiding Cairo"
 ikhwan_earning_title_grand_objective_decision_cairo_desc: "[victorious_cairo|E] will act as an excellent hub for a Grand Bazaar and for the Sayyadin"
 cairo_tooltip: "$ikhwan_earning_title_grand_objective_decision_cairo_desc$"
 ikhwan_earning_title_grand_objective_decision_cairo_effect1: "Unlock '$ikhwan_sponsor_grand_bazaar_objective_decision$' [decision|E]"
 ikhwan_earning_title_grand_objective_decision_cairo_effect2: "Unlock access to the Sayyadin Traditions [endowments_lifestyle|E] tree, even if you don't have [GetTrait('sayyadin_al_ghul').GetName(GetPlayer)]"
 ikhwan_earning_title_grand_objective_decision_baghdad: "Aiding Baghdad"
 ikhwan_earning_title_grand_objective_decision_baghdad_desc: "[baghdad_antiquity|E] will allow us to contact the Brethren of Sincerity and learn some of their secrets"
 ikhwan_earning_title_grand_objective_decision_baghdad_effect1: "Unlock access to the Brethren of Sincerity Traditions [endowments_lifestyle|E] tree, even if you don't have [GetTrait('ahl_al_sirr').GetName(GetPlayer)]"
 baghdad_tooltip: "$ikhwan_earning_title_grand_objective_decision_baghdad_desc$"
 ikhwan_earning_title_grand_objective_decision_jerusalem: "Aiding Jerusalem"
 ikhwan_earning_title_grand_objective_decision_jerusalem_desc: "[holy_jerusalem|E] will require careful effort to maintain the balance of power but will serve as a home to the holy warriors among the Ghazi"
 ikhwan_earning_title_grand_objective_decision_jerusalem_effect1: "Unlock access to the Ghazi Traditions [endowments_lifestyle|E] tree, even if you don't have [GetTrait('alp_gazi').GetName(GetPlayer)]"
 jerusalem_tooltip: "$ikhwan_earning_title_grand_objective_decision_jerusalem_desc$"

 ikhwan_sponsor_grand_bazaar_objective_decision: "Sponsor a Grand Bazaar"
 ikhwan_sponsor_grand_bazaar_objective_decision_desc: "Throughout the Islamic world, the great bazaars are more than markets. They are places where merchants, scholars, pilgrims, craftsmen, and travelers exchange goods, ideas, and rumors. By financing one ourselves, we can gather exactly the sort of people our cause requires."
 ikhwan_sponsor_grand_bazaar_objective_decision_confirm: "I wonder who came?"
 ikhwan_sponsor_grand_bazaar_objective_decision_tooltip: "A Grand Bazaar calls many interesting people that may be willing to join our ranks."

 ikhwan_almisris_legacy_objective_decision: "al-Misri's Legacy"
 ikhwan_almisris_legacy_objective_decision_desc: "Though his legacy is not honored by all, Dho'l-Nun al-Misri is one of our most honored saints. One of the truest and greatest Islamic mystics, he was a master of alchemy, thaumaturgy, and medicine. It is said he understood the ancient language and even the magics of the Egyptian pharaohs."
 ikhwan_almisris_legacy_objective_decision_confirm: "So these are the secrets of the pharaohs"
 ikhwan_almisris_legacy_objective_decision_tooltip: "Dho'l-Nun al-Misri is a saint known for his mastery of alchemy and knowledge of the Egyptian magic."
 ikhwan_almisris_legacy_objective_decision_effect_tt: "Gain access to the [hekau_alchemy_lifestyle|E] lifestyle"

 ikhwan_contact_taftani_objective_decision: "Contact the Taftani"
 ikhwan_contact_taftani_objective_decision_desc: "The reclusive Persian mages known as the Taftani are a mix of pre-Muslim beliefs such as Mithraism and Zoroastrianism, viewing vampires as servants of Ahriman and the darkness. They protect mortals from the spirit world and bind djinni, ghosts, and spirits. While they have little love for Islam, they have been an occasional ally in the past. Proving your worth and forging a durable alliance with them could open new possibilities for mutual cooperation."
 ikhwan_contact_taftani_objective_decision_confirm: "Making sorcerous allies"
 ikhwan_contact_taftani_objective_decision_tooltip: "Taftani are a strange lot and do not serve Allah. However, their ability to bind the supernatural is indispensable for our hunt."
 ikhwan_contact_taftani_objective_decision_effect_tt: "You will be able to pick a tree of the [sorcery_lifestyle|E] to specialize in. New Ikhwan al-Safa will start with the first 5 perks unlocked, and Archmastery journeys for that tree will be faster."
 ikhwan_contact_taftani_objective_decision_sorcery_specialization: "Sorcerous Specialization"

 ikhwan_enemy_of_enemy_objective_decision: "Enemy of an Enemy"
 ikhwan_enemy_of_enemy_objective_decision_desc: "The Ashirra of the desert have abandoned the indolence and seductive luxuries of the cities. However, they understand the importance of certain holy places, often serving as watchmen over the roads walked by pilgrims. They protect these sites and pilgrims from the invaders, both those that walk under the sun and those that slink between the shadows. If we draw upon our shared faith and shared heritage as Bedouins, we may be able to arrange an alliance of sorts."
 ikhwan_enemy_of_enemy_objective_decision_confirm: "Prioritized hunting?"
 ikhwan_enemy_of_enemy_objective_decision_tooltip: "While all vampires run contrary to Allah's plans, a few honor Him and may be willing to work alongside us against the worst of their kind."


 
 pod1230objectives_ikhwan.1.t: "Turkmen of Anatolia"
 pod1230objectives_ikhwan.1.desc: "Across the Anatolian and eastern steppes, the horsemen ride. Whether they be heavy cavalry charging into enemy ranks or horse archers peppering hostile forces, they are known for their mastery of the martial pursuits. The Alps lead heroic charges and achieve impossible victories. The Ghazis serve as holy warriors pushing back the darkness.\n\nHaving reached out to them and proven ourselves, they have begun teaching us their knowledge of combat. Combined with our knowledge of vampires, it should make us far more effective hunters."
 pod1230objectives_ikhwan.1.a: "Together we are stronger."

 pod1230objectives_ikhwan.2.t: "Sayyadin of Arabia"
 pod1230objectives_ikhwan.2.desc: "A very long time ago, there was a small family of like-minded tribesmen that struck out against the monsters in the night. These tribesmen, peasants, shepherds, and other simple folk were driven by a consuming need for vengeance. Often choosing to pursue that vengeance alone, those early hunters were as likely to commit suicide on a vampire's fangs as they were to successfully root out the monsters. A single man never stood much of a chance against the beasts of the night so they banded together in small tribes and families, though there was never any unity amongst them and very, very few survived past their initial unification as the vampires actively sought to put them down.\n\nIt is time for that to change. The clans have finally been unified behind a single purpose and vision. With that unity, we shall kill threats that we could never have otherwise harmed."
 pod1230objectives_ikhwan.2.a: "None can stand against our united front."

 pod1230objectives_ikhwan.3.t: "Bending the Knee"
 pod1230objectives_ikhwan.3.desc: "Having inserted family members into the Sultan's army, we made contact with his court. They were aware of the threat posed by the vultures that roost within their lands, using the people in schemes far older than any of the victims. However, they were initially reluctant to accept nomads claiming to understand how to kill these monsters. In time, we convinced them to grant us an opportunity.\n\nWhile it took a great deal of time and many brethren died, we proved ourselves to the Sultan and his court. Now, you have been invited to present yourself before him.\n\nThe topic of tonight's audience is not suited for the ears of all, explaining why you only see a handful of guards, two advisors, and the Sultan himself. After you swear yourself to him, the Sultan explains his plan. He will pair elite members of his army and personal guard with members of the tribes. Each half of the pair will train the other in their field of expertise, with lessons from the Brethren of Sincerity also being passed along. The only question is which tradition you will follow."
 pod1230objectives_ikhwan.3.a: "The Sayyadin"
 pod1230objectives_ikhwan.3.b: "The Ghazi"
 pod1230objectives_ikhwan.3.c: "The Brethren of Sincerity"

 pod1230objectives_ikhwan.4.t: "The Sultan's Court"
 pod1230objectives_ikhwan.4.desc: "As a center of temporal and religious power, the Sultan's court attracted many monsters who sought to siphon that power, just as they do with blood. We dove through the courtly politics, seizing and slicing down the minions of the darkness. We excised the corruption, purging the shadows with fire.\n\nNow, the Sultan should be able to act without their interference. They should no longer be able to direct funds away from our hunts, and additional warriors will be sent to aid us. However, we have developed an unfortunate reputation as the Sultan's secret police."
 pod1230objectives_ikhwan.4.a: "Welcome to the hunt!"

 pod1230objectives_ikhwan.5.t: "The Esoterics of Mesopotamia"
 pod1230objectives_ikhwan.5.desc: "During the 10th century, a secret society known as the Brethren of Sincerity was formed. Working alongside the Taftani, these philosophers and mystics mastered several esoteric arts related to sorcery. They worked together to bind spirits of many types, Djinn being the most dangerous of their targets. Barring the Taftani and a few splinter cells in places like Cairo, the Brethren of Sincerty disappeared.\n\nTheir esoteric teachings and philosophy have been preserved in a treatise known as the Rasa'il Ikhwan al-Safa, a giant compendium of 52 epistles. Until now, that was all that had survived the society's unusual disappearance. Now, the Brethren of Sincerity have been restored, and their secret libraries have been rebuilt. However, there is a reason no one mourned the Brethren of Sincerity and a reason why they disappeared so completely."
 pod1230objectives_ikhwan.5.a: "Welcome to the hunt!"

 pod1230objectives_ikhwan.6.t: "The Tribesmen of the Desert"
 pod1230objectives_ikhwan.6.desc: "Before there were ghazi, before there were Brethren, some say before even Islam, there were nomadic tribesmen wandering the deserts of Arabia. There were victims of the leeches, sons and daughters drained in the night with nothing but husks left for their parents to find. These tribesmen sought revenge, throwing themselves against their enemies. Those few that survived their first hunt scattered across the sands, some trying to escape the reprisal and others seeking more prey.\n\nFinding them and convincing them to gather has been difficult as many see themselves on a one-person jihad, clinging to their faith as the only things to stave off their destruction. Creating a space where they could safely gather was just as difficult. However, those are in the past. They have been gathered and are now working to support all of us in the great hunt."
 pod1230objectives_ikhwan.6.a: "Welcome to the hunt!"

 pod1230objectives_ikhwan.7.t: "The Hidden Libraries"
 pod1230objectives_ikhwan.7.desc: "Dating back into antiquity, Cairo has long been the heart of many pagan cults. Even after the coming of the Prophet, remnants of the old gods of Egypt lingered. Their cults taint the minds of the people, drawing them further from Allah and giving them knowledge that endangers them and those around them. Their obscene rituals spill blood and allow powers better left alone to leak into this holy city.\n\nOr, they did. Their bases have been razed, their members arrested, their grimoires locked away. Our hunters, supported by the Sultan's soldiers, raided those secret havens and purged all traces of their abominable acts."
 pod1230objectives_ikhwan.7.a: "The way has been paved, my Sultan."

 pod1230objectives_ikhwan.8.t: "Help the Funding Flow"
 pod1230objectives_ikhwan.8.desc: "Various North African polities owe their allegiance to the Sultan, even if merely nominally. Many of them pay tribute to the Sultan in exchange for protection, which now extends to our protection. The Sultan is particularly eager to resolve this problem as supernatural interference is reducing the amount of received tribute.\n\nHaving permanently handled the monsters, the countries should be able to more effectively generate money and deliver those profits to the Sultan. As a reward, the Sultan has promised to set aside some of these additional funds for the development of new cells."
 pod1230objectives_ikhwan.8.a: "The problem is resolved, my Sultan."

 pod1230objectives_ikhwan.9.t: "Friends in Unusual Places"
 pod1230objectives_ikhwan.9.desc: "While the path of the Ikhwan al-Safa has never been an easy one, too many deaths of our comrades and brothers were unnecessary. They fought alone, seeking personal revenge rather than to cleanse the land. Worse, they ignored or even hunted some of the others that hate vampires. \n\nThe leeches have never been ones to endear themselves to others. Many powerful individuals and groups hate them as powerfully as any hunter of the Ikhwan al-Safa. Having befriended some unusual individuals, we can now draw upon their connections to contact additional groups. Among other contacts, we have reached out to Sayyadin, Ghazis, and a few remnants of the Brethren of Sincerity. If you wished, you could reach out to them and learn their traditions."
 pod1230objectives_ikhwan.9.a: "The Sayyadin"
 pod1230objectives_ikhwan.9.b: "The Ghazi"
 pod1230objectives_ikhwan.9.c: "The Brethren of Sincerity"

 pod1230objectives_ikhwan.10.t: "Aiding the Light-Bringers"
 pod1230objectives_ikhwan.10.desc: "The Mummies are a mystery to your kind. Allah is known for reviving his chosen so that they may continue to enact his will on Earth, but that does not seem to fit these creatures. These entities are clearly from Pagan stock and have little reverence for the Greatest but their contributions for the greater good of the Land of Faith can't be overstated.\nDifficult times call for pragmatic solutions, and you have chosen to ignore their mystical nonsense about the old Egyptian Gods and focus instead on more strategic matters. For all their faults, they certainly are powerful and know a lot about how to hunt the cursed bloodsuckers. This strange alliance has bore fruit and both of your organizations have benefited from it. An acceptable state of affairs, for now at least.\nThe leader of this strange group, one who names himself Horus, has come forward with a proposition to join their ranks. You are very unsure about this proposal and this would likely cripple your organization. On the other hand, true immortality isn't offered to a mere mortal every day...\nSensing your internal conflict, Horus offers an alternative, a simpler elixir, one who will grant you an extended lifespan while still keeping you as you are. The choice is ultimately yours."
 pod1230objectives_ikhwan.10.a: "The simple elixir will suffice, thank you."
 pod1230objectives_ikhwan.10.b: "True immortality? Well..."
 become_mummy_ikwan_tt: "You will become a Mummy which will radically change your gameplay, disable your buildings and destroy your higher realm titles.\nThis is likely to cripple your campaign if you aren't ready for it."

 pod1230objectives_ikhwan.11.t: "Cairo the Victorious Rises"
 pod1230objectives_ikhwan.11.desc: "The Sayyadin have always been nomadic, rarely congregating or working together. In our history, there has only been a few exceptions. Among them were the Sayyadin who journeyed to Cairo and established the oldest Ikhwan al-Safa lodge: Dar el-Adil. Great Cairo, City of Cities, Shining Star of Islam, Mother of the World, the city was founded on the paradox of change as a means of ensuring stability and amongst its continuous reinvention, the Ikhwan al-Safa made a home for themselves.\n\nWith the addition of your funds, the city has been rebuilt under the careful guidance and sight of the faithful. The Sayyadin have gathered in its streets, pushing back the darkness. Their allies have come, no longer fearing the vampires. Artisans, merchants, scholars, and pilgrims journey to it from far-off lands."
 pod1230objectives_ikhwan.11.a: "May Allah bring ever-lasting prosperity."

 pod1230objectives_ikhwan.12.t: "Baghdad, Jewel of Allah, Rises"
 pod1230objectives_ikhwan.12.desc: "Even before their founding, those that would become the Brethren of Sincerity congregated amongst the many mosques and libraries of Baghdad. In combination with lessons learned from the east, they found ways to magically heal and sustain themselves. They studied alongside the Taftani, learning how to bind and hunt spirits. When the Brethren disappeared, little of them or their secrets remained.\n\nWith the addition of your funds, the city has been rebuilt under the careful guidance and sight of the faithful. Amongst the glittering minarets and halls of learning, the dust has been cleaned away, and the scrolls have been unfurled. The fundamentals of sorcery are now taught to initiates of the Ikhwan al-Safa."
 pod1230objectives_ikhwan.12.a: "May Allah bring ever-lasting understanding."

 pod1230objectives_ikhwan.13.t: "Holy Jerusalem Rises"
 pod1230objectives_ikhwan.13.desc: "Where the Sayyadin were tribesmen and the Brethren of Sincerity were an order, Ghazi was simply a title assigned to many over the years with some treating it as little more than a job description. The first Ghazi were Bedouin raiders, mercenaries, adventurers, and dissidents that would organize themselves into small corporations. Members would move between corporations depending upon a group's prestige and success. Especially as the Mongols pushed the corporations westward, they became primarily Turkic, tied to mortal polities and yet increasingly portrayed as the sword of Allah. Rulers and generals bore the title with pride.\n\nWith the addition of your funds, the city has been rebuilt under the careful guidance and sight of the faithful. With this holy city secured, the instruments of the religion of Allah, those servants of God who purify the earth, are gathering. A few Ghazi corporations were founded by those warriors that accompanied the prophet Muhammad on his expeditions and raids, passing along those traditions which you can now learn from."
 pod1230objectives_ikhwan.13.a: "May Allah bring ever-lasting resilience."

 pod1230objectives_ikhwan.14.t: "The Grand Bazaar"
 pod1230objectives_ikhwan.14.desc: "Travelers from across the known world have come to your Grand Bazaar. Goods from unknown sources, coins bearing unknown faces, ideas from unknown scholars, all are exchanged among the many market stalls. Artisans display their wares, showcasing their skill and craft. Pilgrims pass through on their journeys, purchasing supplies for the next leg. With so many gathered in one place, you could find a worthy individual to recruit into your court."
 pod1230objectives_ikhwan.14.a: "Recruit an artisan"
 pod1230objectives_ikhwan.14.b: "Recruit a scholar"
 pod1230objectives_ikhwan.14.c: "Recruit a pilgrim"

 pod1230objectives_ikhwan.15.t: "al-Misri's Legacy"
 pod1230objectives_ikhwan.15.desc: "One of the truest Islamic mystics, Dho 'l-Nun al-Misri was born and eventually died in Egypt. He was a master of alchemy and magic, understanding the ancient language of the Egyptian pharaohs. His knowledge of sorcery and theurgy, known to him as the science behind faith and spiritual encounters, was second to none. Although imprisoned for heresy in Baghdad, he eventually earned his freedom and sainthood.\n\nWhat few outside the Ikhwan al-Safa know is that al-Misri learned the language of the pharaohs from those that once walked among the pharaohs. At their feet, he pushed his mastery of sorcery further than any other. More than any other area, he discovered a way to combine alchemy with magic fueled by faith, allowing him to create elixirs very similar to those made by his teachers."
 pod1230objectives_ikhwan.15.a: "Hhm, I wonder what can be done with that."

 pod1230objectives_ikhwan.16.t: "The Weavers' Approval"
 pod1230objectives_ikhwan.16.desc: "The Persian mages known as the Taftani are an enigma for most hunters. These \"masters of Djinn\" are very... flashy and like to flaunt their (arguably impressive) magical powers. Luckily for the Ikhwan al-Safa they are firmly on the \"good\" side of the fight, having a particular hatred for the vampires whom they consider part of a \"great lie\" of some sorts.\nYour recent efforts into understanding their mystical nature and your more mundane ones of pushing back the vampires from the Middle East have earned their attention. They have sent teachers to help you formalize your understanding of the mystical forces into something more useful.\nBenefitting from their lessons, you will be able to select an area of sorcery where your family will specialize, gaining another tool for the unending fight ahead of you."
 pod1230objectives_ikhwan.16.a: "Alchemy"
 pod1230objectives_ikhwan.16.b: "Conjuration"
 pod1230objectives_ikhwan.16.c: "Conveyance"
 pod1230objectives_ikhwan.16.d: "Divination"
 pod1230objectives_ikhwan.16.e: "Enchantment"
 pod1230objectives_ikhwan.16.f: "Ephemera"
 pod1230objectives_ikhwan.16.g: "Fascination"
 pod1230objectives_ikhwan.16.h: "Fortune"
 pod1230objectives_ikhwan.16.i: "Healing"
 pod1230objectives_ikhwan.16.j: "Hellfire"
 pod1230objectives_ikhwan.16.k: "Illusion"
 pod1230objectives_ikhwan.16.l: "Necromancy"
 pod1230objectives_ikhwan.16.m: "Oneiromancy"
 pod1230objectives_ikhwan.16.n: "Quintessence Manipulation"
 pod1230objectives_ikhwan.16.o: "Shadows"
 pod1230objectives_ikhwan.16.p: "Shapeshifting"
 pod1230objectives_ikhwan.16.q: "Weather Control"

 pod1230objectives_ikhwan.17.t: "...Is a Friend?"
 pod1230objectives_ikhwan.17.desc: "Cairo was founded on the paradox of change as a means of ensuring stability. The Ikhwan al-Safa claim that potent fields of faith and many skilled hunters keep Dar el-Adil away from the eyes of prying vampires. Some remain skeptical, however, pointing out the disparate regularity with which Western vampires in particular tend to disappear in Egypt.\n\nThese rumors are correct as the Ikhwan al-Safa have aligned themselves with certain followers of Allah among the vampires. Drawing upon their shared connection to the Bedouin people, the Ikhwan struck an alliance with the Tariq el-Bedouin.The Ikhwan prioritized hunting the invading vampires in exchange for being shielded from prying eyes. In addition, while the Hajj may corrupt oases to ghoulify animals, the Tariq el-Bedouin have learned their own ways to control the animals, animals that the Ikhwan can draw upon to aid in their hunts."
 pod1230objectives_ikhwan.17.a: "We shall see how long the alliance lasts."

 pod1230objectives_ikhwan.18.t: "Clearing Infernal Infestations"
 pod1230objectives_ikhwan.18.desc: "Sitting at the intersection of many lands and trade routes, syria is a valuable land. Trade and pilgrims flow through the region, generating large sums of money for who ever may hold it. However, infernalists and demon-worshippers riddle the land, siphoning offits vitality to fuel their dark masters like worms squirming through a man's intestines. All vampires are leeches, but these minions of Baal are despicable even to their eyes.\n\nTo clear the way for the Sultan's initiatives, we learned many hard lessons before we could take fire to their nests. But, we did. We burnt the leeches until the leeches detached. We incinerated the maggots that were devouring the corpse of the land, watching as they writhed under the flames of faith."
 pod1230objectives_ikhwan.18.a: "Now, we can resuscitate the land"

 pod1230objectives_ikhwan.19.t: "A Hunter's Intuition"
 pod1230objectives_ikhwan.19.desc: "After centuries of hunting, those few Sayyadin that survive multiple hunts have gained a peculiar form of intuition. With the additional warning, they can institute additional safeguards against attackers. Each Sayyadin chooses a different method to secure their safehouse or lodge. Some rely on bound spirits to monitor the area, shields of faith to protect their minds or obfuscate their location, hunters empowered with alchemy to stand guard, or other means.\n\nWhat will you choose?"
 pod1230objectives_ikhwan.19.a: "To see everything around me."
 pod1230objectives_ikhwan.19.b: "To protect my mind."
 pod1230objectives_ikhwan.19.c: "To stand ever-vigilant."
 pod1230objectives_ikhwan.19.d: "To hide my location."



