l_english:
 
 pod1230objectives_fae.1.t: "End of Inquisition"
 pod1230objectives_fae.1.desc: "The creation of the Inquisition was the culmination of the Sundering as the Church in their doctrinal pursuits tried to eliminate all undesirable supernatural elements, including the fae, from the world. But now it is over."
 pod1230objectives_fae.1.a: "More superstitions!"
 
 pod1230objectives_fae.2.t: "Constantinian Catechism"
 pod1230objectives_fae.2.desc: "Our Father in the heavens,\nhallowed be your names.\nYour kingdom come.\nYour Holy Spirits come upon us and cleanse us.\nYour will be done, on earth as in the heavens.\nGive us each day our bread for tomorrow,\nand forgive us our sins, for we ourselves honor our obligations.\nAnd do not bring us to the time of trial — the Shattering, or tempt us to banality.\nFor the kingdom and the power and the glory are yours forever."
 pod1230objectives_fae.2.a: "Amen."
 
 pod1230objectives_fae.3.t: "Beyond Reason"
 pod1230objectives_fae.3.desc: "The machinations of the Order of Reason have been undone. Their plots to bind the world in Reason in Science have been dashed. Their workshops of cold iron have been silenced. With the Tremere destroyed, their Massasa War with the Order of Hermes ended in defeat for the undead Usurper warlocks.  The united Hermetic houses could turn their full attention and wrath for the destruction of Mistridge upon Craftmasons and their furtive alliance with like minded scholars, penny pinching misers, prudish god botherers and other propagators of banality. Without the 'rational' philosophers, humanity is already returning to their old beliefs and their old pacts with the Fae to both make sense of the fantastical world and survive it."
 pod1230objectives_fae.3.a: "There are more things in heaven and Earth, than are dreamt of in your philosophy"
 
 pod1230objectives_fae.4.t: "The Ratkin's Scheme"
 pod1230objectives_fae.4.desc: "There was a dark plan brewed by the vile the Ratkin, they created the most deadly disease ever known as the Black Plague. You are glad that you stopped them before they fully released it upon the world."
 pod1230objectives_fae.4.a: "Nasty rats."
 
 pod1230objectives_fae.5.t: "CATastrophe"
 pod1230objectives_fae.5.desc: "Every one in the world adore cats now, the Prophecy of the Rat will not be fulfilled, but there may be another issue to deal with."
 pod1230objectives_fae.5.a: "Oh my..."
 
 pod1230objectives_fae.6.t: "Arcadian Restoration"
 pod1230objectives_fae.6.desc: "Banality problem is solved, and Autumn World is [UmbraGlossary('dreaming')] than ever before. Even [Glossary('Mythic Age','game_concept_mythic_age_desc')]'s Autumn World wasn't soo close, But this state won't last forever. Just like [Glossary('Mythic Age','game_concept_mythic_age_desc')] ended, this era will too.\n\nBut it doesn't have to, Thanks to sheer closeness to [UmbraGlossary('dreaming')], Autumn World needs a slight push to finally merge into Dreaming World where dreams and 'reality' coexist"
 pod1230objectives_fae.6.a: "Merge the Dreaming with Earth."
 pod1230objectives_fae.6.b: "Initiate process, but don't finish it."
 pod1230objectives_fae.6.a.tt: "With [UmbraGlossary('arcadia')] merging with Earth, your game will be over as the world you once knew will be forever changed."
 pod1230objectives_fae.6.b.tt: "Though incomplete, [UmbraGlossary('dreaming')] and Earth's merging still causes 'Autumn World' to become dream-like causing any $pod_bunk$ to always succeed and glamour to regenerate back to max every month. Additionally, The [Glossary('Shattering','game_concept_shattering_desc')] will be prevented"
 
 # The Latin text is probably a musical parody of an earlier 12th century song beginning "intonent hodie voces ecclesie", written in honour of Saint Nicholas, the patron saint of Russia, sailors and children – to whom he traditionally brings gifts on his feast day, 6 December. https://en.wikipedia.org/wiki/Personent_hodie
 pod1230objectives_fae.7.t: "Santa Eternal!"
 pod1230objectives_fae.7.desc: "It is done! Countless children have been delivered chimerical presents. Countless children believe in you! Their dreams fill you with an unending font of glamour! The world can be racked with bloody wars, horrific plagues, dreadful inquisitions and soul-crushing banality—but you will endure!\n\n #EMP 'On this day earth shall ring \nwith the song children sing \nto the Lord, Christ our King, \nborn on earth to save us; \nhim the Father gave us.\n\nHis the doom, ours the mirth; \nwhen he came down to earth, \nBethlehem saw his birth; \nox and ass beside him \nfrom the cold would hide him.\n\n God's bright star, o'er his head, \nWise Men three to him led; \nkneel they low by his bed, \nlay their gifts before him, \npraise him and adore him. \n\nOn this day angels sing; \nwith their song earth shall ring, \npraising Christ, heaven's King, \nborn on earth to save us; \npeace and love he gave us. \n\nIdeo, o, o, Ideo, o, o, \nideo gloria in excelsis Deo!'#!" 
 pod1230objectives_fae.7.a: "Ho ho ho!"

