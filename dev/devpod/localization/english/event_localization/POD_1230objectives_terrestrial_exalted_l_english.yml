l_english:
 pod1230objectives_terrestrial_exalted.1.t: "Transcendent Gaian Harmony"
 pod1230objectives_terrestrial_exalted.1.desc: "The Great [exalted_charm|E], Transcendent Gaian Harmony, Allowed the $POD_splat_terrestrial_exalted_plural$ to achieve hights that were thought impossible for such grounded Exalted. Many speculate that the Scarlet Empress completely mastered and incorporated all elements into her Aspect becoming what $POD_splat_terrestrial_exalted_plural$ could only dream."
 pod1230objectives_terrestrial_exalted.1.perfected.desc: "\n\nAll of that was lost, but sometime ago you managed to create a miracle, and partially recreated the [exalted_charm|E].\n\nBut you weren't satisfied with a half-product. You wanted to recreate full glory of the [exalted_charm|E] from previous age. So you began to work.\n\nYears past, and you have done it. The Miracle of old Age, recreated in the new one.\n\nNow, what will be the last element to incorporate into your aspect, what will be your final crown solidifying your ascension?"
 pod1230objectives_terrestrial_exalted.1.discovered.desc: "\n\nAll of that was lost, but sometime ago you managed to create a miracle, and partially recreated the [exalted_charm|E].\n\nYou incorporated another element into your aspect, but the [exalted_charm|E] is still faraway from being perfect, from being the same miracle that old age had.\n\nSo you decided to continue your work, and you succeeded. Another giant piece of the [exalted_charm|E] is done, and it's glory one day closer. But it still isn't there. Still, what element will you now incorporate into your aspect?"
 pod1230objectives_terrestrial_exalted.1.undiscovered.desc: "\n\nBut all of that is long gone, and the Transcendent Gaian Harmony is lost. But not everything about it, you know about it's existence, about it's goal and about it's idea.\n\nSo you decided to recreate it, to create a miracle this age hasn't seen in a while. And you succeeded, at least partially.\n\nYou have something that could be called the same name, though incomplete, and will require more work to continue working, it will suffice for a single element."

 pod1230objectives_terrestrial_exalted.2.t: "Strike Open the Earth"
 pod1230objectives_terrestrial_exalted.2.desc: "Long ago, in the $glossary_exalted_age_of_legends$, there existed Five Magical Materials: Orichalcum, Moonsilver, Starmetal, Soulsteel and Jade. Each of them carried unique characteristics, but all shared ease of enchanting and a resonance with a specific Exalted type.\n\nJade, the magical material attuned to Dragon-Blooded, was the most common and was used as currency and good material for armors and weapons of $POD_splat_terrestrial_exalted$.\n\nBut all of that is long gone, and modern jade is a pale imitation of the True Kind. But we didn't give up, we secured a promising location, we strengthen local Dragon Nest, we directed nearby Nests towards this one. We crystallized Elements into True Jade, deep beneath the ground, ready for us to mine it."
 pod1230objectives_terrestrial_exalted.2.a: "Mines of Old, In the New World."

 pod1230objectives_terrestrial_exalted.3.t: "Reaffirm Heaven's Praise"
 pod1230objectives_terrestrial_exalted.3.desc: "When Sun shined brighter than ever, when Legends were alive. Heaven has recognized our right to rule the Creation, It has recognized our Empire as a fact not to be ignored. But the $glossary_exalted_age_of_legends$ has ended, and Heaven has closed itself shut. The little gods that still remain in the world has all forgotten about their nature, and what more important. About our right to rule.\n\nThat cannot be, we had to remind them of their nature, or their promise to us. We gathered a small legion of powerful spirits that recognized us to unleash in a instant, all to spread the word of truth.\n\nAnd that made them remember, and the rule shall be returned to the rightful rulers. Heavens has reaffirmed our right."
 pod1230objectives_terrestrial_exalted.3.a: "It feels good to be back."

 pod1230objectives_terrestrial_exalted.4.t: "Restore Mother's Favor"
 pod1230objectives_terrestrial_exalted.4.desc: "Very long ago, in the $glossary_exalted_age_of_legends$, Gaia was the primordial and the indirect creator of $POD_splat_terrestrial_exalted$. She made the Five Elemental Dragons, which inturn created the $POD_splat_terrestrial_exalted$. As such, the $POD_splat_terrestrial_exalted_plural$ always carried the favor and partial love of their patron. But everything changed when the $glossary_exalted_age_of_legends$ collapsed, Gaia lost her position of a primordial, becoming a Celestial and Elemental Dragons were killed.\n\nAs such, in the new age Gaia has long forgotten about us and created new children to guard her. But we desire more, and so we visited her when required preparations where completed and we could almost guarantee successful negotiations. Regardless if Gaia remembered us, or just is seeking the allies. We have her favor now."
 pod1230objectives_terrestrial_exalted.4.a: "The feeling of long lost love."

 pod1230objectives_terrestrial_exalted.5.t: "Formulate the Great Plan"
 pod1230objectives_terrestrial_exalted.5.desc: "The ultimate goal of all [GetFaithByKey('immaculates').GetName], the reason for our existence, is something that hasn't change in millennia. To help Gaia recover her memory and position as $glossary_exalted_primordial$ of Creation, the indirect patroness of Dragon-Blooded. But how would we even start is something many great minds thought about and failed to formulate.\n\nBut their hard work over all this time wasn't wasted, we know that the best approach is probably resurrecting Gaia's children, the Five Immaculate Dragons, but besides ambitious ideas and general process everything else is unknown.\n\nBut you didn't give up just because others before you had, You gathered the greatest minds of Immaculate Doctrine in one place. You created a perfect environment for sustained experimentation and research, so one day you could discover the way to move forward.\n\nAnd you succeeded, the plan on how to help Gaia recover her memory and position is ready."
 pod1230objectives_terrestrial_exalted.5.a: "A way to move forward"

 pod1230objectives_terrestrial_exalted.6.t: "The Seed of a Dragon"
 pod1230objectives_terrestrial_exalted.6.desc: "The great ritual has started, Essence from the deepest parts of the Dragon Nest is flowing towards the centre. The centre were the host is located, and where the dream of immaculates is being realized.\n\nAfter multiple hours of constant Essence Flow, the ritual is done. At the centre lays unconscious host, imbued with the Seed of a Dragon carrying the dreams and hopes of all Immaculates.\n\nWhich dragon did you chose? What seed was imbued?"
 pod1230objectives_terrestrial_exalted.6.mela: "Seed of Mela"
 pod1230objectives_terrestrial_exalted.6.pasiap: "Seed of Pasiap"
 pod1230objectives_terrestrial_exalted.6.hesiesh: "Seed of Hesiesh"
 pod1230objectives_terrestrial_exalted.6.daana_d: "Seed of Daana'd"
 pod1230objectives_terrestrial_exalted.6.sextes_jylis: "Seed of Sextes Jylis"

 pod1230objectives_terrestrial_exalted.7.t: "The Birth of Elemental Dragon"
 pod1230objectives_terrestrial_exalted.7.desc_start: "The great day has arrived as the required personnel and preparations are in place.\n\nAs we commenced the ritual, we were shown first hand what such destruction truly entailed."
 pod1230objectives_terrestrial_exalted.7.mela: "As the ritual progresses, the wind begins to howl, picking up into a whirlwind gale around the Dragon Nest. Screams from the outlying towns nearly deafen the wind's roar, as tornadoes, hurricanes, and monsoons render the settlements into stripped fields and graveyards in moments. The Dragon Nest itself is flayed down to the bone. But updrafts shown us it worked."
 pod1230objectives_terrestrial_exalted.7.pasiap: "Once the ritual nears completion, the ground begins to shake, as cracks in the earth and ravines open up. The outlying cities around the Dragon Nest are swiftly destroyed in a cavalcade of earth, metal, and sinkholes, as they're swallowed up. But the Dragon Nest, now guttering and measly dribbled, have given us what we were aiming for."
 pod1230objectives_terrestrial_exalted.7.hesiesh: "As the ritual heats up, the air becomes warm for a moment, before the Dragon Nest violently explode. All around the ritual sites the surroundings people scream as they suddenly burst into flames, volcanoes emerge at their feet, and ash clouds blot out the sun. Spent, the Dragon Nest gurgle out some more sparks, but in the ashes, a new age is being born"
 pod1230objectives_terrestrial_exalted.7.daana_d: "The Dragon Nest crack, as they're spiritual walls come crashing down, as an ocean of water spews forth from them like a geyser, as the surrounding towns and country sides experience the worst flash floods of this age. Entire families swept away, men and women drowning looking up into the rain, and the screaming heavens vaporizing the survivors with lighting as our Ritualists push through in their warded spaces. But as the waters recede and the Dragon Nest calm fully spent, a spring emerges, with scales glistening like dragon scales."
 pod1230objectives_terrestrial_exalted.7.sextes_jylis: "For a moment there is a calm in our rituals, as we fear for a moment it failed. But we are quickly taken aback when all around the Ritualists vines emerge from the earth, clawing at their wards hungrily. They instead descend into the town, as spores fill the air. People explode into trees, buildings are reduced to rubble in creeper vines, and the growing forest is drunk on blood as it blooms out, before withering, returning life to the earth. And from our warded spaces, we can see that the seed we planted has taken root."
 pod1230objectives_terrestrial_exalted.7.desc_end: "\n\nAfter hours of careful maintenance and control, the rivers of essence have punched open a hole to what we lost, as a Dragon once lost breathes once more."
 pod1230objectives_terrestrial_exalted.7.a: "We welcome our ancestor to the new age."

 pod1230objectives_terrestrial_exalted.8.t: "Reunion with Gaia"
 pod1230objectives_terrestrial_exalted.8.desc: "As the threshold of the Summer Country is crossed, it is clear - this place has always been wrong. Insufficient for her majesty. Elder Pasiap in particular looks especially upset by the conditions, as his despair is worn clearly across his face. According to some of our myths, he was the Dragon that was most like Gaia, and the look of despair on his face as he sees his higher soul is both telling and heartbreaking. But, the time for grief has passed. It is time for renewal.\n\nGaia sits on her throne in the Summer Country, a twitching feral beast of contradiction, her true shape laid bare. But her eyes light up on seeing the Immaculate Dragons. Something comes clawing back. The Immaculate Dragons say nothing, as the assembled Terrestrial Host kneels, and you stand firm before them. Without speaking, the essence in your anima banner roars, as all you have done is laid bare. Gaia watches, rapt, as the Dragons flank her, assembled like a star around her. And as your story concludes, you kneel as all the Dragons descend upon her, as Gaia is bathed in elemental energies. Some feral beast, perhaps her current fetich soul, screams in the distance, but their experiment failed. It couldn't beat the originals. The Dragons, after parting, move with a new shared purpose. Gaia, once a slobbering, mangy, snarling and bloody fanged beast, is now radiant, overwhelming, as her $glossary_exalted_primordial$ heart thrums once more, the Celestine gone, and the Mother restored.\n\n\"Rise, my children.\" She whispers in a deafening rumble, a soft smile visible upon her deific mien, \"There is work to be done.\""
 pod1230objectives_terrestrial_exalted.8.a: "We have done it."

 pod1230objectives_terrestrial_exalted.9.t: "The Library of Ancients"
 pod1230objectives_terrestrial_exalted.9.desc: "The truth behind the Ebon Dragon and Scarlet Phoenix may be lost for good. Perhaps this was a fool's errand.\n\nUndeterred, we excavated ruins, searched through libraries, and raided supernatural vaults in pursuit of any tomes that survived from the $glossary_exalted_age_of_legends$.\n\nWe didn't find much. The information is fragmented and vague, but even this is more than we hoped for. We secured these tomes in a mobile library and distributed copies all around our territories, so that this knowledge may survive the trials to come. It's not enough to form a complete picture, but now we know where to look.\n\nAnd look we shall."
 pod1230objectives_terrestrial_exalted.9.a: "We will the Glory of Old."

 pod1230objectives_terrestrial_exalted.10.t: "The Truth of the Ebon Dragon"
 pod1230objectives_terrestrial_exalted.10.desc: "#italic When the $glossary_exalted_age_of_legends$ ended, it dragged the $glossary_exalted_primordials$ with it, including the Ebon Dragon. But where most $glossary_exalted_primordials$ were shredded by the new world, the Shadow of All Things survived. (...)\n\nUnfortunately, such a being could not remain unnoticed. The newly enthroned Creator of the new world found whatever was remaining of the Ebon Dragon, and ripped it apart. Soul by Soul was sealed, leaving behind a shell now given the name of Angel of Yin. (...)\n\nBut the souls were not destroyed, merely sealed. But no seal can truly stop the primordial darkness from seeping out from the cracks. (...) Then, denizens of the new world found the souls, incarnated as massively powerful and catastrophic beings of darkness that predate the natural order, and named them #bold the Children of the Outer Dark#!#!. - 'Theorized History of the Ebon Dragon' by [GetPlayer.GetFirstName]"
 pod1230objectives_terrestrial_exalted.10.a: "The truth revealed"

 pod1230objectives_terrestrial_exalted.11.t: "Trade Between Devils"
 pod1230objectives_terrestrial_exalted.11.desc: "No vampiric clans besides the Tremere has a standardized hierarchy nor a figure head to talk with. That doesn't mean there are no powerful figures in their society though.\n\nBy extensive shows of power and knowledge in quite specific locations and audience, we managed to attract eyes of few powerful Baali. Still, vampires didn't treat us as equals. After all in the end, we are the weaker side; we had to showcase our value to not be discarded nor ignored.\n\nNevertheless, we succeeded in that goal. Our knowledge and power offered Baali new possibility some Elders couldn't ignore. Be it greed for power, curiosity or a new plaything; we managed to create stable channels of communication. From that to closer exchanges of information didn't take much.\n\nAnd here we are, we managed to obtain few crucial pieces of information about the Children of Outer Dark. We had to pay a price for them, but it was worth it in the end."
 pod1230objectives_terrestrial_exalted.11.a: "Never underestimate the underdogs."

 pod1230objectives_terrestrial_exalted.12.t: "The Greatest Sinner"
 pod1230objectives_terrestrial_exalted.12.desc: "We did it... We found the truth, at least partially...\n\nBut it was not what we hoped to find, we tried different things, we tried to make it better. But nothing fitted better than the truth...\n\nThe Scarlet Phoenix is the Scarlet Empress, the greatest $POD_splat_terrestrial_exalted$ to exist, and the destroyer of the $glossary_exalted_age_of_legends$. We do not know what has happened to her, but whatever did; it transformed her into a monster of flames and vengeance. Flames which burned the world, and ended everything we thought dear...\n\nWhen the world burned to ashes, and new one was born; the Scarlet Phoenix was found and mangled by the new creator. Her soul sealed to never see the light of creation again, we do not know where; do we even want to know?\n\nThis discovery... It destroyed everything we thought we knew... And the worst is that we think it is the truth... It just fits too well..."
 pod1230objectives_terrestrial_exalted.12.a: "Did we really put all our hopes into a monster?..."

 pod1230objectives_terrestrial_exalted.13.t: "The Greatest Sinner"
 pod1230objectives_terrestrial_exalted.13.desc: "We found her...\n\nIn the deepest parts of the [UmbraGlossaryLocalized('shadowlands','Underworld')], we found Essence signature; in a place made of pathos and memories, Essence should not be present; yet it is. So we followed it, and that lead us to [UmbraGlossary('oblivion')]...\n\nAnd in the [UmbraGlossary('oblivion')], no; a better way to phrase it is #italic below#! it, there is a large cumulation of Essence which somehow has traveled through the [UmbraGlossary('oblivion')] to the [UmbraGlossaryLocalized('shadowlands','Underworld')] itself...\n\nAfter some further tests, we concluded that yes indeed; the soul of the Scarlet Phoenix is sealed #italic beneath#! the [UmbraGlossary('oblivion')]...\n\nLooking at this discovery... Our future is bleak...  But hey! At least we know the way forward..."
 pod1230objectives_terrestrial_exalted.13.a: "...straight into [UmbraGlossary('oblivion')]."

 pod1230objectives_terrestrial_exalted.14.t: "The Wedding"
 pod1230objectives_terrestrial_exalted.14.desc: "Getting here was a painful endeavour, but the moment we have been waiting for all this time has arrived. The Wedding between the Dragon and Phoenix.\n\nHosted in the Heaven, behind the gates forever closed to anyone attempting to enter it... At least that was until today. As we approached the gates, they opened before us with the bride and groom awaiting us on the other side.\n\nThe sight was divine, two beings so drastically opposite to eachother on the surface united in the ceremony; holding eachother's hands. That alone had made all our efforts, all our pains we put into making this happen worth it. I could even hear some of us crying at the beauty.\n\nAnd so we entered. Both the bride and the groom has been awaiting us to start, everything was ready. It was time for the ceremony, it was time for the new to begin.\n\n\n\nAt the altar, the Phoenix and the Dragon were standing before eachother; The Light and The Dark standing together intertwined into one. The ring on each other's #V;glow_color:{1,0.8,0.2,0.5} hand#! symbolizing the unity of both. The promise of the better future personified by the couple; the desire to be better, to not allow the mistakes of the past to happen again.\n\nThe moment has arrived, Both the Light and the Dark united as one; the sight impossible to explain and yet everyone present can sense the beauty of it. The world outside trembling under the sight. The Wheel of Ages bowing to the new order, and disappearing as it no longer serves a purpose. The Paradise has arrived...\n\nAnd the World of Darkness is no more."
 pod1230objectives_terrestrial_exalted.14.a: "A Wedding has ended the world, and started a new one."

 pod1230objectives_terrestrial_exalted.15.t: "The New Beginning"
 pod1230objectives_terrestrial_exalted.15.desc: "The time when $POD_splat_terrestrial_exalted_plural$ ruled the creation has ended long ago. Yet we cling to it, behaving as if the rules haven't changed. Blinded by our glorious past, we forgot the present.\n\nThis lead us to the present day, with our numbers dwindling more and more; with each year losing more and more turf we are at the edge of extinction.\n\nThat could not continue, we had to secure our present; for our future to exist the present must survive.\n\nAnd we have done it, at least partially. We secured a Dragon Nest of sufficient size, and birthed another generation. Now, we can start thinking about our next goal; Adaption to the new times.\n\nBecause only by adapting to the modern times, we can secure our long term survival."
 pod1230objectives_terrestrial_exalted.15.a: "The times have changed long ago, it is time for us to change too."

 pod1230objectives_terrestrial_exalted.16.t: "A New Way of Life"
 pod1230objectives_terrestrial_exalted.16.desc: "For millennia we $POD_splat_terrestrial_exalted_plural$ stayed unchanged, generation after generation; yet we remain similar.\n\nBut the world has changed. What once was acceptable is now forbidden, and the antiquated methods of problem solving have began to show it's age. Yet we remained stubborn in using them, and that lead to our current situation.\n\nChange was needed, we could not remain in antiquity forever.\n\nIt began slowly, but with our active effort; we began to stray from deeply rooted methods in favor of more modern ones; step by step we crawled from our casket we stayed for ages.\n\nAnd now, even though we cannot call ourselves fully integrated with current time. We are definitely better that just few decades ago."
 pod1230objectives_terrestrial_exalted.16.a: "Old must die, for new to thrive."

 pod1230objectives_terrestrial_exalted.17.t: "Magic of The Modern Age"
 pod1230objectives_terrestrial_exalted.17.desc: "We $POD_splat_terrestrial_exalted_plural$ are unable to use #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Modern Sorcery#!#!.\n\nWe knew that for long time, but it wasn't ever an issue worth looking into. After all, we had [exalted_ancient_sorcery|E] and it worked fine.\n\nBut the times have changed, and [exalted_ancient_sorcery|E] is no longer reliable enough to put our future at stake. We had to find the reason for our inability ot use #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Modern Sorcery#!#!.\n\nAnd so we gathered sorcerers, we observed them using their power; we looked for something they had which we don't. We wrote what we thought we found, we tried to use #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Modern Sorcery#!#! with the knowledge we found, we failed; we tried again.\n\nAnd so, after many cycles; we found a solution. By using our spark of divinity, by calling upon it; we can use #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Modern Sorcery#!#! after much practice and effort."
 pod1230objectives_terrestrial_exalted.17.a: "A step forward towards perfect adaptation."