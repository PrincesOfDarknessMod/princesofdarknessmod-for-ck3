 pod1230objectives_terrestrial_exalted.1.t: "Transcendent Gaian Harmony"
 pod1230objectives_terrestrial_exalted.1.desc: "The Great [exalted_charm|E], Transcendent Gaian Harmony, Allowed the $POD_splat_terrestrial_exalted_plural$ to achieve hights that were thought impossible for such grounded Exalted. Many speculate that The Scarlet Empress completely mastered and incorporated all elements into her Aspect becoming what $POD_splat_terrestrial_exalted_plural$ could only dream."
 pod1230objectives_terrestrial_exalted.1.perfected.desc: "\n\nAll of that was lost, but sometime ago you managed to create a miracle, and partially recreated the [exalted_charm|E].\n\nBut you weren't satisfied with a half-product. You wanted to recreate full glory of the [exalted_charm|E] from previous age. So you began to work.\n\nYears past, and you have done it. The Miracle of old Age, recreated in the new one.\n\nNow, what will be the last element to incorporate into your aspect, what will be your final crown solidifying your ascension?"
 pod1230objectives_terrestrial_exalted.1.discovered.desc: "\n\nAll of that was lost, but sometime ago you managed to create a miracle, and partially recreated the [exalted_charm|E].\n\nYou incorporated another element into your aspect, but the [exalted_charm|E] is still faraway from being perfect, from being the same miracle that old age had.\n\nSo you decided to continue your work, and you succeeded. Another giant piece of the [exalted_charm|E] is done, and it's glory one day closer. But it still isn't there. Still, what element will you now incorporate into your aspect?"
 pod1230objectives_terrestrial_exalted.1.undiscovered.desc: "\n\nBut all of that is long gone, and the Transcendent Gaian Harmony is lost. But not everything about it, you know about it's existence, about it's goal and about it's idea.\n\nSo you decided to recreate it, to create a miracle this age hasn't seen in a while. And you succeeded, at least partially.\n\nYou have something that could be called the same name, though incomplete, and will require more work to continue working, it will suffice for a single element."

 pod1230objectives_terrestrial_exalted.2.t: "Strike Open The Earth"
 pod1230objectives_terrestrial_exalted.2.desc: "Long ago, in The Age of Legends, there existed Five Magical Materials: Orichalcum, Moonsilver, Starmetal, Soulsteel and Jade. Each of them carried unique characteristics, but all shared ease of enchanting and a resonance with a specific Exalted type.\n\nJade, the magical material attuned to Dragon-Blooded, was the most common and was used as currency and good material for armors and weapons of $POD_splat_terrestrial_exalted$.\n\nBut all of that is long gone, and modern jade is a pale imitation of the True Kind. But we didn't give up, we secured a promising location, we strengthen local Dragon Nest, we directed nearby Nests towards this one. We crystallized Elements into True Jade, deep beneath the ground, ready for us to mine it."
 pod1230objectives_terrestrial_exalted.2.a: "Mines of Old, In the New World."

 pod1230objectives_terrestrial_exalted.3.t: "Reaffirm Heaven's Praise"
 pod1230objectives_terrestrial_exalted.3.desc: "When Sun shined brighter than ever, when Legends were alive. Heaven has recognized our right to rule the Creation, It has recognized our Empire as a fact not to be ignored. But the Age of Legends has ended, and Heaven has closed itself shut. The little gods that still remain in the world has all forgotten about their nature, and what more important. About our right to rule.\n\nThat cannot be, we had to remind them of their nature, or their promise to us. We gathered a small legion of powerful spirits that recognized us to unleash in a instant, all to spread the word of truth.\n\nAnd that made them remember, and the rule shall be returned to the rightful rulers. Heavens has reaffirmed our right."
 pod1230objectives_terrestrial_exalted.3.a: "It feels good to be back."

 pod1230objectives_terrestrial_exalted.4.t: "Restore Mother's Favor"
 pod1230objectives_terrestrial_exalted.4.desc: "Very long ago, in the Age of Legends, Gaia was the primordial and the indirect creator of $POD_splat_terrestrial_exalted$. She made the Five Elemental Dragons, which inturn created the $POD_splat_terrestrial_exalted$. As such, the $POD_splat_terrestrial_exalted_plural$ always carried the favor and partial love of their patron. But everything changed when the Age of Legends collapsed, Gaia lost her position of a primordial, becoming a Celestial and Elemental Dragons were killed.\n\nAs such, in the new age Gaia has long forgotten about us and created new children to guard her. But we desire more, and so we visited her when required preparations where completed and we could almost guarantee successful negotiations. Regardless if Gaia remembered us, or just is seeking the allies. We have her favor now."
 pod1230objectives_terrestrial_exalted.4.a: "The feeling of long lost love."