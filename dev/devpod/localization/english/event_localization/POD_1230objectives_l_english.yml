 ashen_caravan_decision: "[ashen_caravan|E]"
 ashen_caravan_decision_tooltip: "If I have to travel around, better be prepared for it."
 ashen_caravan_decision_desc: "Traveling in the World of Darkness is a perilous proposal. If you want to live on the road, you will need to prepare supplies, maps and the right people to support you."
 ashen_caravan_decision_confirm: "Let us review our situation."
 initial_ashen_caravan_decision_tt: "You will start your [ashen_caravan|E] trait track, allowing you to improve it as you complete transport contracts in the future." 
 
 ashen_cult_initial_decision: "[ashen_cult|E]"
 ashen_cult_initial_decision_tooltip: "Creating my own cult will open new opportunities, spiritual or otherwise."
 ashen_cult_initial_decision_desc: "To the uneducated, vampires are close to gods. Some are powerful or charismatic enough to fool even their own kind. Perhaps you could be one of them."
 ashen_cult_initial_decision_confirm: "Being worshiped sounds nice."
 initial_ashen_cult_decision_tt: "You will start your [ashen_cult|E] trait track, allowing you to unlock a new version of this decision to use and improve it." 
 initial_ashen_cult_prerequisites_tt: "You need 5 or more courtiers of your faith."

 POD_cult_visited_modifier: "Visited by a Cult"
 ashen_cult_later_decision: "[ashen_cult|E]"
 ashen_cult_later_decision_tooltip: "More shall know of the truth."
 ashen_cult_later_decision_desc: "With your cult currently camping in a region, you could use this time to foster it among the locals or use your presence to productive or harmful ends."
 ashen_cult_later_decision_confirm: "Gather round, gather round!"
 ashen_cult_decision_tt: "You will get opportunities concerning the county your domicile is currently located in. Said opportunities will vary depending on whether it already follows your faith or not."

 POD_county_defenses_weakened_modifier: "Weakened Defenses"
 POD_county_diligent_populace_modifier: "Inspired Populace"
 pod1230objectives.176.desc: "The presence of a cult in a region can be a very disruptive force. It is rare for the local powers to want to oppose them directly as war on their very doorstep can be more destructive than it is worth. Some hope to find accord with the cult, which is made easier if their viewpoints align.\nIn any case, the populace is often all too eager to heed the word of a cult master. Gifted with supernatural powers, often having great charisma and wisdom and followed by an entourage of zealous believers is more than enough to impress superstitious commonfolk."
 pod1230objectives.176.a: "Hear the truth!" 
 pod1230objectives.176.b: "Your lord is a hellspawn!" 
 pod1230objectives.176.c: "Do not resist what is to come!" 
 pod1230objectives.176.d: "Stay a while and listen." 
 pod1230objectives.176.e: "Pray and work hard." 
 pod1230objectives.176.f: "Donations are appreciated." 
 pod1230objectives.176.g: "On second thought, let's try somewhere else."
 
 year_black_kites_japan_decision: "Year of the Black Kites"
 year_black_kites_japan_decision_tooltip: "Time to make the split official."
 year_black_kites_japan_decision_desc: "While technically encompassing both Korea and Japan, the Azure Dragon Court has long lost power outside of the mainland. If Japan is to rise as its own political force, it will have to make this split official."
 year_black_kites_japan_decision_confirm: "You aren't needed anymore."
 year_black_kites_japan_custom_decision: "The year must be at least #V 1242#!"
 year_black_kites_japan_custom_decision2: "The [GetTitleByKey('e_goryeo').GetNameNoTier] must own no land in Japan."
 year_black_kites_japan_decision_effect: "Japan will become its own Empire and new objectives will be unlocked."
 
 pod1230objectives.177.desc: "The Azure Dragon Court was instituted as the ruling Court for Japan and Korea when the Orthodox (and Chinese aligned) [Glossary('Dharma','podgloss.dharma')] spread to the islands long ago. Since then, Japan has grown in influence, sometimes even being the center of the court themselves. This has caused friction with the mainland that still sees Japan as a somewhat unruly \"little brother\" in need of guidance.\nWith the slow decline of the mainland Courts and the consolidation of Japan's power, it was just a matter of time before the split was made official. It has been done tonight and the outraged Chinese and Korean $pod_kueijin$ can do little but curse and spout empty threats of retaliation.\nThe Azure Dragon Court is no more and the Uji Courts now stand as a new contender in the nightly political landscape of East Asia.\n\nAs the ruler who formally announced this split, you have to handle the aftermath and the many minor vampires of Chinese or Korean allegiance that remain in Japan.\nSome clans advice for a peaceful parting, letting them stay or leave as they please as long as they follow the new rules. Other, more aggressive clans argue for a harsher retribution, seizing their assets and kicking them out of the islands by force."
 pod1230objectives.177.a: "We will be magnanimous." 
 pod1230objectives.177.b: "Begone!" 
 peaceful_year_black_kites_modifier: "Peaceful Year of the Black Kite"
 aggressive_year_black_kites_modifier: "Hostile Year of the Black Kite"

 pod1230objectives.178.desc: "The Azure Dragon Court was instituted as the ruling Court for Japan and Korea when the Orthodox (and Chinese aligned) [Glossary('Dharma','podgloss.dharma')] spread to the islands long ago. Since then, Japan has grown in influence, sometimes even being the center of the court themselves. This has caused friction with the mainland that still sees Japan as a somewhat unruly \"little brother\" in need of guidance.\nWith the slow decline of the mainland Courts and the consolidation of Japan's power, it was just a matter of time before the split was made official. It has been done tonight and the outraged Chinese and Korean $pod_kueijin$ can do little but curse and spout empty threats of retaliation.\nThe Azure Dragon Court is no more and the Uji Courts now stand as a new contender in the nightly political landscape of East Asia."
 pod1230objectives.178.a: "A sign of the turning ages." 
 
 dominant_uji_decision: "Dominant Uji"
 dominant_uji_decision_tooltip: "We must lead Japan's new age."
 dominant_uji_decision_desc: "Each Japanese Uji (clan) has a different focus. Thus, to achieve dominance over the others, they must first prove themselves masters of their arts."
 dominant_uji_decision_confirm: "Leading Japan to glory!"
 dominant_uji_knight_tt: "You need five champions or more with #V 35#! or more [prowess|E]"

 rising_sun_japan_decision: "The Rising Sun"
 rising_sun_japan_decision_tooltip: "Japan's rise isn't negotiable."
 rising_sun_japan_decision_desc: "With Japan now free of the Azure Dragon Court, it is time for the competing Uji to bend to one ruler. Only then will we be taken seriously as the main Court of Asia."
 rising_sun_japan_decision_confirm: "Our ascension starts now."
 rising_sun_japan_decision_effect: "The Uji Courts will be upgraded to a Hegemon tier title. They will encompass other empires depending on your choice."
 
 pod1230objectives.179.desc: "With the Azure Dragon Court now formally abolished, most predicted that Japan would fall into civil war sooner rather than later. True to that prediction, the many Clans and outsiders of the islands were quick to sharpen their (literal or not) knives to rise at the top of the newly minted Uji Courts.\nThe surprise came from the speed of the consolidation under one banner which has worried the mainland Courts. Japan is now announcing her ambitions and doesn't want to be looked down as the \"little brother\" anymore.\n\nWill the unification of the Asian Courts come from the Land of the Rising Sun?"
 pod1230objectives.179.a: "The Tortoise needs our guidance." 
 pod1230objectives.179.b: "A Japanese Azure Dragon?" 
 pod1230objectives.180.a: "We must look to the east." 

 death_wang_hongben_decision: "Long United..."
 death_wang_hongben_decision_tooltip: "What could go wrong in the stable and prosperous Yellow Emperor Court?"
 death_wang_hongben_decision_desc: "The Yellow Emperor Court appears stable and prosperous, unconcerned by the petty threats at its border. But there is an air of anticipation that something major is coming..."
 death_wang_hongben_decision_confirm: "...must divide"
 death_wang_hongben_decision_effect: "Who knows?"
 death_wang_hongben_decision_custom_decision: "1240 is augured to be a critical year."

 pod1230objectives.182.t: "The Collapse"
 pod1230objectives.182.desc.wang: "No one really knows who struck [GetScriptedCharacterByHistoryID('795039').GetFirstName]. Some say a frustrated [Glossary('Wu','podgloss.wu')] mate, some say an [akuma|E] or an agent of a rival court. But his death revealed the utter fragility of the #ONCLICK:TITLE,[GetTitleByKey('h_china').GetID] #TOOLTIP:LANDED_TITLE,[GetTitleByKey('h_china').GetID] #L Yellow Emperor Court#!#!#!.\nHis ministers, the Golden Jade Society, pull the court apart and squabble among themselves. Without a central authority, skirmishes break out everywhere and the regional courts, already close to independence, now refuse to listen to Changan. The [Glossary('Anda','podgloss.anda')] who were waiting in the north for a good opportunity to follow their mortal Mongols' counterparts now see the door wide open.\n\nThe Chinese courts' fall from Heaven will be long and bloody."
 pod1230objectives.182.desc.notwang: "The #ONCLICK:TITLE,[GetTitleByKey('h_china').GetID] #TOOLTIP:LANDED_TITLE,[GetTitleByKey('h_china').GetID] #L Yellow Emperor Court#!#!#!, thought to be an examplar of a stable court, turned out to be nothing but a sand castle. Despite Wang Hongben's removal from power (or perhaps because of it), the situation has only gotten worse.\nWang's old ministers, the Golden Jade Society, pull the court apart and squabble among themselves. Without a respected central authority, skirmishes break out everywhere and the regional courts, already close to independence, now refuse to listen to Changan. The [Glossary('Anda','podgloss.anda')] who were waiting in the north for a good opportunity to follow their mortal Mongols' counterparts now see the door wide open.\n\nThe Chinese courts' fall from Heaven will be long and bloody." 
 pod1230objectives.182.b: "News of my death were greatly exaggerated." 
 pod1230objectives.182.a: "The cycle continues..."
 pod1230objectives.182.tt: "As you are a player, we won't kill you outright (we aren't that mean). The collapse still happens though as it is integral to the Chinese region's narrative."
 end_consolidation_china_cb_tt: "The Consolidate China CB will no longer be available."
 activate_consolidation_china_cb_tt: "The Consolidate China CB will now be available to independent rulers with their de jure capital under the Yellow Emperor Court Hegemony."
 
 pod1230objectives.183.a: "The center didn't hold." 
 pod1230objectives.183.b: "We ride!"
 pod1230objectives.183.tt: "The Yellow Emperor Court has collapsed. The [Glossary('Anda','podgloss.anda')] Horde gains momentum to strike on the weakened Chinese Courts."

 quincunx_formation_decision: "The Council of Dragons"
 quincunx_formation_decision_tooltip: "If China is to unite once more, the Courts must come together."
 quincunx_formation_decision_desc: "The fall of the Yellow Emperor Court heralded a time of troubles for China. We must first push back the invaders from our lands, then once again work towards creating a united Court."
 quincunx_formation_decision_confirm: "Unity is close."
 quincunx_formation_decision_custom_decision_ex: "$quincunx_formation_decision_custom_decision$ #weak ([example.GetName])#!"
 quincunx_formation_decision_custom_decision: "The members of House [GetDynastyHouseByID('house_anda').GetName] must own no land in [GetGeographicalRegion('world_asia_china').GetName]."
 quincunx_formation_decision_custom_decision2: "The five Chinese Empires (Blood, Flame, Bone, Flesh, Jade Courts) must be either uncreated, under your control, or held by a friendly character (50+ opinion of you)."
 quincunx_formation_decision_effect: "The troubles are behind us."
 
 quincunx_offensive_modifier: "Quincunx Offensive"
 quincunx_offensive_modifier_desc: "This modifier allows you to start tributary wars for free."
 quincunx_consolidation_modifier: "Quincunx Consolidation"
 quincunx_consolidation_modifier_desc: "This modifier offers you a flat #P +25#! acceptance to vassalization when targeting $pod_kueijin$"

 pod1230objectives.184.desc: "The fall of the Yellow Emperor Court could have seemed like a death blow to the Chinese court system's hegemony to the outside eye. To the enlightened however, it was only one other turn of the cycle. While this period will be remembered as a difficult one for nightly China, it will end as it started, with a unified Court ruling over all.\n\nThis has been made possible by an event that will be known as the Council of Dragons that has hosted the most politically powerful Courts of the region. With the [Glossary('Anda','podgloss.anda')] threat contained, the Ancestors were able to formalize the start of a new organization dubbed the Quincunx. It will have a more supervisory role than the Yellow Emperor Court but is expected to be able to lead powerful and united efforts by the Courts.\nTheir first order of business is in the hand of the first \"Quincunx Ancestor\"."
 pod1230objectives.184.a: "Korea must be brought back under the Courts."
 pod1230objectives.184.b: "We must secure our borders."
 pod1230objectives.184.c: "The Quincunx has the ambition to unite all $pod_kueijin$." 
 pod1230objectives.185.a: "Back to the start."

 year_black_kites_korea_decision: "Year of the Black Kites"
 year_black_kites_korea_decision_tooltip: "Japan must be reined in."
 year_black_kites_korea_decision_desc: "While technically encompassing both Korea and Japan, the Azure Dragon Court has long lost power outside of the mainland. There isn't a lot of time left before the split is made official."
 year_black_kites_korea_decision_confirm: "Divided no more."
 year_black_kites_korea_custom_decision: "Japan will make the split official by 1242. If the conditions are achieved by that time for this decision however, the Azure Dragon Court will stop them from doing so."
 year_black_kites_korea_custom_decision2: "The [GetTitleByKey('e_goryeo').GetNameNoTier] must own land in [GetGeographicalRegion('world_asia_japan').GetName]."
 year_black_kites_korea_decision_effect: "New objectives will be unlocked, different depending on whether Japan separated itself from the mainland or not."
 
 pod1230objectives.186.desc: "The Azure Dragon Court was instituted as the ruling Court for Japan and Korea when the Orthodox (and Chinese aligned) [Glossary('Dharma','podgloss.dharma')] spread to the islands long ago. Since then, Japan has grown in influence, sometimes even being the center of the court themselves. This has caused friction with the mainland that still sees Japan as a somewhat unruly \"little brother\" in need of guidance.\nWhile the decline of the mainlands Courts left many expecting Japan to go its separate way, the surprising resurgence of the Azure Dragon Court has put a stop to that. While the stubborn Japanese Uji are far from being humbled, they at least accept that their destiny still lays with the main Courts.\nIt remains to be seen what Korea will do with this unsuspected political momentum."
 pod1230objectives.186.a: "United, as it should be."
 azure_dragon_consolidation_modifier: "Azure Dragon Consolidation"
 azure_dragon_consolidation_modifier_desc: "This modifier offers you a flat #P +25#! acceptance to vassalization when targeting $pod_kueijin$ in Japan and Korea."
 pod1230objectives.187.a: "This dragon isn't sleeping."

 new_seat_heaven_decision: "The New Seat of Heaven"
 new_seat_heaven_decision_tooltip: "The Azure Sun rises."
 new_seat_heaven_decision_desc: "As turmoil engulfs the Courts, Korea and the Azure Dragon must prove its claim to dominance by achieving unity and prosperity in its traditional territory. Then it might be time for the center of the Asian world to shift from Yellow to Azure..."
 new_seat_heaven_decision_confirm: "The August Personage smiles on us."
 new_seat_heaven_custom_decision: "Your vassals of [duchy|E] tier and above must all have at least #P 25#! opinion of you."
 new_seat_heaven_decision_effect: "The Azure Dragon Court will encompass new de jure land and be upgraded to a Hegemon level."
 
 pod1230objectives.188.desc: "Korea has always been considered a crossroads for the August Courts, a useful neutral ground between the more politically powerful courts. The rise of Japan and its (difficult but finally accepted) formal reintegration into the Azure Dragon Court has soared the prestige of the area to new heights.\nAs the traditionally more influential Yellow Emperor and Black Tortoise shrink and buckle under internal and external pressure, many have seen the rise of the Azure Dragon as a sign of the turn of the ages.\nStrengthened by this growing political capital, it was only a matter of time before the neighboring Black Tortoise was formally absorbed under the new hegemonic organization centered in Korea. China and its Yellow Emperor are another matter however as millennia of dominance can't be washed away in an instant.\nThe Azure Dragon will have to spend some of its newfound soft power to make the jaded Chinese Ancestors accept this radical change."
 pod1230objectives.188.a: "We must look inwards for a while." 
 pod1230objectives.188.b: "The Yellow era is over." 
 pod1230objectives.189.a: "The crossroads are now the center." 
 
 green_crossroads_decision: "Green Crossroads"
 green_crossroads_decision_tooltip: "Prosperity is its own reward."
 green_crossroads_decision_desc: "The fall of the Azure Court put a dent on the political relevance of Korea. But territorial gains aren't the only way to achieve influence.\nKorea sits at an important crossroads between the other Courts and on the most important deposit of magical Jade in East Asia. These assets can be leveraged."
 green_crossroads_decision_confirm: "Jade is the color of our triumph."
 green_crossroads_decision_effect: "Several counties in Korea, including your capital, will get a [GetModifier('jade_trade_modifier').GetNameWithTooltip] modifier, giving various prosperity related bonuses."
 jade_trade_modifier: "Magical Jade Trade"
  
 pod1230objectives.190.desc: "While the Azure Dragon Court's collapse left a mark on Korea's political ambition, influence can come from many different sources. Sitting on the most important deposit of magical Jade in Asia and being at the crossroads of three major Courts, Korea was always a go-to neutral ground and trading center.\nUsing this envious position, the newly minted Green Courts are truly living up to their name. Jade is flowing to foreign courts while gold is entering Korean Ancestors' coffers.\nSome wonder if this increasing prosperity will grow the Green Court's ambitions towards more political matters once again or if gold and jade will be the only colors in the future of Korea's nightly inhabitants."
 pod1230objectives.190.a: "The jade must flow!" 
 pod1230objectives.191.a: "Buying the way to enlightenment?" 
 
 thriving_in_chaos_decision: "Thriving in Chaos"
 thriving_in_chaos_decision_tooltip: "Chaos is a ladder, time to pull it out from under the others."
 thriving_in_chaos_decision_desc: "The decline of the Scarlet Phoenix Court has left a power vacuum. The explosive nature of politics in the region means that stability will only be restored when a new power takes its place."
 thriving_in_chaos_decision_confirm: "A victory of Scarlet and Gold."
 thriving_in_chaos_decision_effect: "You will choose between a path of conquest or consolidation and unlock the next objective."
   
 scarlet_phoenix_consolidation_modifier: "Scarlet Phoenix Consolidation"
 scarlet_phoenix_consolidation_modifier_desc: "This modifier offers you a flat #P +25#! acceptance to vassalization when targeting characters in Southeast Asia."
 scarlet_consolidation_house_modifier: "Scarlet Phoenix Consolidation"
 scarlet_consolidation_house_modifier_desc: "This house has strong political clout in Southeast Asia and is specialized in strengthening this power base."
 golden_courts_birth_modifier: "Golden Courts Founders"
 golden_courts_birth_modifier_desc: "The bloody and brutal Golden Courts were founded by this house, making them mistresses of unrelenting warfare."
 golden_courts_birth_tt: "The following objective will be more focused on conquest."
 scarlet_phoenix_consolidation_tt: "The following objective will be more focused on internal matters."
 
 pod1230objectives.192.desc: "The Scarlet Phoenix Court, once a thriving center for the more Yang focused [Glossary('Dharma','podgloss.dharma')], has been on a steep decline for a while. It has gotten to the point that the Court earned a reputation as an infernalist [akuma|E]-infested hellhole, going as far as to push the Chinese Yellow Emperor Court to consider intervening, something they didn't do mostly because of their own indolence.\n\nConsolidating the area will put the prospective ruler on a crossroads. Taking back the mantle of the Scarlet Phoenix would focus on a more inward-centered path (though not necessarily peaceful, considering some of the violent [Glossary('Dharma','podgloss.dharma')] dwelling in this area). Another road would be to eschew this legacy and instead build something new, something far more likely to focus on conquering (and likely purging) the rest of the region, and perhaps even beyond later on."
 pod1230objectives.192.a: "The Phoenix rebirth."
 pod1230objectives.192.b: "Blood will pave our way of gold."
 pod1230objectives.193.a: "Rumbling from the jungles..."
 
 phoenix_rise_decision: "The Phoenix Rebirth"
 phoenix_rise_decision_tooltip: "The Golden Age of the Scarlet Phoenix Court is still in the horizon."
 phoenix_rise_decision_desc: "With the Scarlet Phoenix Court once again centered around one ruler, it is time to focus on internal growth and once again become the envy of the north."
 phoenix_rise_decision_confirm: "Blinding flight of the Phoenix."
 phoenix_rise_decision_effect: "You will get a powerful modifier, an additional building slot in all your directly owned provinces and your councilors will get better at their jobs."
 phoenix_rise_custom_decision: "All your powerful vassals have at least #P 50#! opinion of you."

 pod1230objectives.194.desc: "Under renewed leadership, the Scarlet Phoenix Court has once again become a prosperous center for the southern vampires. While the northerners might still scoff at their neighbors, even they must now realize what a formidable internal strength is hidden inside this rejuvenated Court.\nUnited in purpose and using the thriving mortal population at their disposal, the southern Phoenixes proudly get back their seat as a major Court. If not, some dare whisper, \"the\" major Court."
 pod1230objectives.194.a: "A Scarlet triumph."
 pod1230objectives.195.a: "The pearl of the jungles."
 
 bloody_gold_decision: "Bloody Gold"
 bloody_gold_decision_tooltip: "The birth of a new Court, in blood and gore."
 bloody_gold_decision_desc: "Born from the chaos of the fall of the Scarlet Phoenix Court, the Golden Courts are bloody and violent to their core. As they grow in power, the other Courts shudder in fear of this new, brutal, way to enlightenment."
 bloody_gold_decision_confirm: "Reach Heaven by violence, then."
 bloody_gold_decision_effect: "You will get two powerful artifacts as well as the ability to use the Invasion Casus Belli."
 bloody_gold_decision_tt: "You must have 10 or more knights with 35 or more prowess."
 
 POD_invasion_war_modifier: "Determined Invader"
 POD_invasion_war_modifier_desc: "This modifier allows for the use of the Invasion Casus Belli."
 
 pod1230objectives.196.desc: "Though some are relieved to see a southern Court fill the vacuum left by the fall of the Scarlet Phoenix, most are afraid of the bloody tendencies pushed by its new leader. While the Scarlet Phoenix was always unruly because of its focus on Yang energy, it was at least trying to keep some decorum. Not so much with the newly minted Golden Courts.\nPerhaps more surprisingly, this focus on aggressive expansion didn't dull as much the pursuit of enlightenment as most would believe. If anything, the Golden Courtiers seem to thrive on the raw excessive Yang energies they spill during their conquests, eschewing the more traditional need for balance.\n\nAs the Golden Courts show no sign of stopping its march to domination, many wonder if a new way to Heaven is being paved before their very eyes. A much bloodier one that doesn't leave room for half measures or neutrality."
 pod1230objectives.196.a: "Fear the bloody gold!" 
 pod1230objectives.197.a: "The jungles have awakened." 

 bring_down_courts_decision: "Vanguard of the Demon Emperor"
 bring_down_courts_decision_tooltip: "An entrance worthy of the next ruler of the Wheel."
 bring_down_courts_decision_desc: "The [Glossary('Demon Emperor','podgloss.demonemperor')] will rule the [Glossary('Sixth Age','game_concept_sixth_age_desc')]. But you could certainly make their ascension more pleasant if you were to prepare the terrain first..."
 bring_down_courts_decision_confirm: "A pleasing sight for Hell."
 bring_down_courts_decision_effect: "Many remaining $pod_kueijin$ will become [akuma|E]. You will unlock the use of all [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] Men-at-Arms. You will also unlock the Invasion Casus Belli."
 bring_down_courts_decision_tt: "There must be no non-[akuma|E] $pod_kueijin$ Emperors or Hegemons."
 
 POD_yama_vanguard_modifier: "[Glossary('Demon Emperor','podgloss.demonemperor')]'s Vanguard"
 POD_yama_vanguard_modifier_desc: "This individual has earned the favor of all the [Glossary('Yama Kings','podgloss.yamaking')]. They allow them the use of their elite troops whenever needed."

 pod1230objectives.198.desc: "While the [Glossary('Demon Emperor','podgloss.demonemperor')] is supposed to ascend only in the [Glossary('Sixth Age','game_concept_sixth_age_desc')], their agents are already hard at work paving the way for their ascension. Granted, the Courts did most of the work on their own by falling into indolence and decline but neglecting the subtle (and sometimes not so subtle) push given by the [akuma|E] would be unfair.\nWith the Courts now all in complete disarray and the $pod_kueijin$ despairing that the Heavens are closing their gates, many are looking for an alternate way to salvation.\n\nA way that the now thriving [akuma|E] are more than eager to offer."
 pod1230objectives.198.a: "...and it's a long way down." 
 pod1230objectives.199.a: "Heaven has turned away." 
 pod1230objectives.198.tt: "Many [Glossary('Kuei-Jin','game_concept_kuei_jin_desc')] will convert to your faith."


 enduring_tortoise_decision: "The Enduring Tortoise"
 enduring_tortoise_decision_tooltip: "Time to get back on our feet."
 enduring_tortoise_decision_desc: "The Black Tortoise Court is on the backfoot and many think it will be washed away by the [Glossary('Anda','podgloss.anda')] or the [akuma|E]. Perhaps this fate can still be avoided."
 enduring_tortoise_decision_confirm: "Slow and steady."
 enduring_tortoise_decision_effect: "The Black Tortoise Court will become a Hegemon title. You will get access to the Invasion Casus Belli. Your house will get the [GetModifier('enduring_tortoise_modifier').GetNameWithTooltip] modifier."
 
 enduring_tortoise_modifier: "Enduring Tortoise"
 enduring_tortoise_modifier_desc: "Having survived a near fatal era, this house brought back the Black Tortoise to its past glory."

 pod1230objectives.200.desc: "The Black Tortoise Court has always been something of an outsider among the August Courts. Considered strange, or complicit to hostile foreigners because of its ties to the steppes, it has always earned only tense respect at best or outright hostility at worst from its peers.\nWhen the [Glossary('Anda','podgloss.anda')] started pushing from the west and the [akuma|E] caused trouble internally, other Courts weren't really shedding tears, the Yellow Emperor Court going as far as to attack it at its weakest.\nWith its indolent leadership unable to react to these issues, the fall of the Black Tortoise Court seemed like a foregone conclusion. But it seems that the Heavens still have a place for the Demons of Xia. A focused effort has recently seen the once beleaguered Court triumphing over many of its neighbors and restoring its hegemony over the steppes.\n\nThe Black Tortoise Court didn't forget the past however. Old feuds never truly die, for the immortals and the Court have now begun a renewed campaign of aggression, perhaps inspired by their steppe roots, claiming even most of Northern China in the process."
 pod1230objectives.200.a: "We ride!" 
 pod1230objectives.201.a: "The steppes can never be tamed." 

 anda_steppes_decision: "Winds from the East"
 anda_steppes_decision_tooltip: "Genghis showed us the way."
 anda_steppes_decision_desc: "The Demons of Xia are a fearsome foe and China will be a tough nut to crack. The sensible course of action is to first secure our borders with them."
 anda_steppes_decision_confirm: "We are at the gates."
 anda_steppes_decision_effect: "#N If this objective isn't achieved by 1300 at the latest, the [Glossary('Anda','podgloss.anda')] will lose momentum and be crippled!#!\n\nIf achieved by then, the next objective of the chain will be unlocked. You will get the [GetTrait('conqueror').GetName(GetNullCharacter)] trait (if you don't have it already). You will get access to the Invasion Casus Belli."

 pod1230objectives.202.desc: "The Mongol conquest of China took everyone by surprise, including the immortals in their midst, the [Glossary('Anda','podgloss.anda')]. Instead of rushing to follow their mortal counterparts, the children of Dobrul took a more prudent approach, knowing full well that more threatening powers than the mortal army of China await them beyond the Great Wall.\nConsolidating the steppes under their rule, sometimes by force of arms, others by ruthless diplomacy using the strength of the Mongol Empire as their trump card, the [Glossary('Anda','podgloss.anda')] are now fully prepared to take their conquest one step further.\n\nMomentum is on their side as well, as their potentially most dangerous foe, the Yellow Emperor Court, is weakened and fracturing, seemingly blissfully unaware of the threat coming from the north.\n\nAs the [Glossary('Anda','podgloss.anda')] vanguard probes the defenses of the northern $pod_kueijin$ Courts with more and more force, they won't be unaware for long."

 pod1230objectives.204.t: "The Last Khans"
 pod1230objectives.204.desc: "The [Glossary('Anda','podgloss.anda')] Horde's momentum was mainly due to how fast and unexpected their rise was. The Mongol Empire achieved incredible heights in the blink of an eye as far as immortals are concerned and it thus took time for them to realize what was happening and consider that it might happen to them as well.\nThe [Glossary('Anda','podgloss.anda')] enjoyed solid success in exploiting this flaw in the early stages of their campaign but perhaps due to an excess of prudence, or encountering more resistance than expected, they didn't manage to storm the world as well as the Mongols did.\nWith their neighbors now finally aware of the threat they pose and mobilizing their full resources to hinder them, the [Glossary('Anda','podgloss.anda')] are returning to what they were originally, a simple bloodline of the [GetTrait('gangrel').GetName(GetNullCharacter)] with little political clout.\nThere won't be an age of Khans among the immortals it seems."
 pod1230objectives.204.a: "We took too long..." 
 pod1230objectives.205.a: "No one will be straddling the world."
 anda_lost_momemtum_tt: "#N Since the [Glossary('Anda','podgloss.anda')] didn't achieve their objective in time, any Emperor (or more) level ruler of theirs will lose the [GetTrait('conqueror').GetName(GetNullCharacter)] trait (if they had it) and get the [GetModifier('broken_authority_modifier').GetNameWithTooltip] modifier.#!"
 
 anda_china_decision: "Into China"
 anda_china_decision_tooltip: "Breaching the Wall."
 anda_china_decision_desc: "We are at their gates and we now know enough about them. Time to follow our victorious Mongol counterparts!"
 anda_china_decision_confirm: "They can't stop our ride!"
 anda_china_decision_effect: "#N If this objective isn't achieved by 1350 at the latest, the [Glossary('Anda','podgloss.anda')] will lose momentum and be crippled! #! \n\nIf achieved by then, the next objective of the chain will be unlocked. You will get the [GetTrait('conqueror').GetName(GetNullCharacter)] trait (if you don't have it already). You will get access to the Invasion Casus Belli. A sizable pile of gold taken from China's coffers will also be yours."
 
 pod1230objectives.206.desc: "After a period of reconnaissance and improving their knowledge of the $pod_kueijin$, the [Glossary('Anda','podgloss.anda')] finally broke into China proper. While their invasion was obviously less visible and traumatic than the Mongol one, it was still a catastrophic event for the Chinese immortals who didn't have to contend with determined outside threats since the Burning of the Books.\nBlind to the scale of the invasion and washed away by the [Glossary('Anda','podgloss.anda')]'s momentum, the first part of the war clearly turned to be a resounding success for the children of Dobrul.\n\nBoth sides know however that the war isn't over. China is a big place and its remaining Ancestors are now much more privy to the true threat coming from the north."
 pod1230objectives.206.a: "China will fall!" 
 
 anda_final_decision: "Pax Anda"
 anda_final_decision_tooltip: "The last ride."
 anda_final_decision_desc: "China lies battered after our northern campaign. Underestimating the Demons of Xia would be a mistake however. We must finish them while the wind is at our back!"
 anda_final_decision_confirm: "As Genghis did!"
 anda_final_decision_effect: "#N If this objective isn't achieved by 1400 at the latest, the [Glossary('Anda','podgloss.anda')] will lose momentum and be crippled! #! \n\nIf achieved by then, you will unlock a special faith tenet and a positive modifier. You will get the [GetTrait('conqueror').GetName(GetNullCharacter)] trait (if you don't have it already). You will get access to the Invasion Casus Belli. The [Glossary('Anda','podgloss.anda')] Horde will be upgraded to a Hegemon title encompassing territories from Russia to China."
 
 pod1230objectives.208.desc: "The [Glossary('Anda','podgloss.anda')] triumph is complete. Their policy of studying their foes and waiting for the right moment to strike proved successful. The jaded immortals of China underestimated them at the beginning before scrambling for defenses. But it was too little too late.\nThe [Glossary('Anda','podgloss.anda')]'s victory is perhaps even more impressive than their Mongol counterparts'. A relatively young and unknown bloodline a couple of centuries ago, they have washed away the dominance of the $pod_kueijin$ who have been enjoying their top spot in Asia for many millennia. Some say this victory is the sign of the turn of the Ages (or Gehenna depending on whom you ask) but to the more objective observer, it is mainly the bold and innovative young taking from the indolent and stubborn old.\nAnd in the immortal world, there is few things more frightening than that.\n\nWhatever the case might be, China's nights now operate under a new master. Will the [Glossary('Anda','podgloss.anda')] continue their ride or settle in their new prosperous land? Only they know, for the world is their steppe."
 pod1230objectives.208.a: "Mother Itügen is proud."
 
 great_clan_victory_objective_decision: "The Wicked City Ascendant"
 great_clan_victory_objective_decision_tooltip: "All will make sense."
 great_clan_victory_objective_decision_desc: "A banal and sterile world is our dream, where everything makes sense. Such is the world the true master wishes for. By crushing and disorienting our enemies, [Glossary('Mikaboshi','podgloss.mikaboshi')] will elevate me above all."
 great_clan_victory_objective_decision_confirm: "Welcoming the Demon Emperor."
 great_clan_victory_objective_decision_effect_tooltip: "You will get the [GetTrait('conqueror').GetName(GetNullCharacter)] trait. [Glossary('Mikaboshi','podgloss.mikaboshi')] will offer you knowledge of infernal powers. Your title will be renamed to the Conclave of Stars."

 pod1230objectives.210.desc: "It has been a long time coming. As you stand at the balcony of [Glossary('Mikaboshi','podgloss.mikaboshi')] Tower, you can feel the Wicked King behind you, forming your new crown as his right hand. Such is your right. In millennia, no disciple of any Devil King has been as successful as you. The Courts remain broken and shattered. The Blood Tribe, sworn foes of your cause, now lie broken, their leader ash on the wind. Little lies in opposition before you, save scattered and broken fools.\n\nThe crown is rested, as it unravels into essence, and fuses into you. You are special. Now, you and [Glossary('Mikaboshi','podgloss.mikaboshi')] may as well be one. His iron hands caress under your chin, and you rise, a newborn Demigod of Defilement.\nHe still wishes for a world of crushing capitalism and dull drudgery. An entire world broken to mundanity and robotic work. His path to the Throne is now inevitable.\nAnd you will be at his side, the honored one, the greatest under heaven and hell."
 pod1230objectives.210.a: "As it should. As it will be." 
 pod1230objectives.210.b: "Of course, my Emperor. Your Empress wishes for nothing less..." 

 blood_tribe_victory_objective_decision: "No Man a King, No Monster a God"
 blood_tribe_victory_objective_decision_tooltip: "The sword will set us free."
 blood_tribe_victory_objective_decision_desc: "We were warned of societies beyond dedicated to the subjugation and conquest of all those who would dare to be free, and we have been warned of their coming. We must form a society of immortals who refuse to bow, who refuse to be conquered. Our foes must be slain and scattered, and then the great work may truly begin."
 blood_tribe_victory_objective_decision_confirm: "United in purpose."
 blood_tribe_victory_objective_decision_effect_tooltip: "You will get the [GetTrait('conqueror').GetName(GetNullCharacter)] trait. Your faith will get a powerful special doctrine. Your title will be renamed to the Blood Commune."

 pod1230objectives.211.desc: "For the first time since the Storm elevated the First of the Blood Tribe, you contemplate the weightlessness on your shoulder. The Prophet of the Iron Tyrant is dead. The oppression of the Courts lies in chaos. All that remains… is the ones you called family.\nThey are not peaceful men and women, willing to accept the will of the gods. No, they are a society at war. At war with the world, with themselves and who they love most. The Blood Tribe has always fought to break shackles, to overcome the [Glossary('Beast','game_concept_beast_desc')] with revolutionary zeal and pride.\nAnd now? Now there is nothing stopping you.\n\nYou stand, and open the doors to your assembled equals. They watch you, as you unroll a collection of maps and documents detailing your path.\nYou look between them, letting them know this is the time to either walk away, or stand as one. They all meet your gaze, and smile. You draw a knife, and thrust it into the table, into the maps.\n\nYou cut open the west. Where the Traditions are said to lie."
 pod1230objectives.211.a: "Let us show them our praxis." 
 pod1230objectives.211.b: "It is time the meek shall inherit the earth." 
 pod1230objectives.211.c: "No more wasting time, asking others for what we can obtain ourselves."

 kizoku_victory_objective_decision: "The Seventh Son’s Ascent"
 kizoku_victory_objective_decision_tooltip: "From pests to honored guests."
 kizoku_victory_objective_decision_desc: "While you are tolerated by the Japanese Uji, you are far from respected. If you want to make this land your own, you will have to showcase both your strength and your prestige."
 kizoku_victory_objective_decision_confirm: "Respect is earned, not due."
 kizoku_victory_objective_decision_effect_tooltip: "You will choose an ally among the Japanese Uji, gaining a house modifier and other rewards in the process."

 pod1230objectives.212.desc: "Tsuchigumo, they called you once.\n\nWithin Japan, they had always viewed you and your kind as mere pests. While never hated like the demented spawn of the tyrant or lunatics of the storm demon, you were still seen as lesser.\n\nNo more.\n\nThere is a gap in power, one you filled expertly. You showed respect to their Emperor and their customs. You stood, heads held high and proud, while they bowed and were cut apart. Where there was disunity, you imposed order. Where there was chaos, you brought stability. All these things and more.\n\nThe Uji finally accept you as one of their own and now court your favor. Which one will be your ally for the nights to come?"
 pod1230objectives.212.a: "Uji Bishamon."
 pod1230objectives.212.b: "Uji Genji."
 pod1230objectives.212.c: "Uji Iga."
 pod1230objectives.212.d: "Uji Echizen."
 pod1230objectives.212.e: "Uji Taira."

 anh_victory_objective_decision: "Scourge of the Seas"
 anh_victory_objective_decision_tooltip: "If the land brings war, the land will get war."
 anh_victory_objective_decision_desc: "Undisturbed as masters of the seas for a long time, the Anh now face new and more aggressive threats to their islands. Make them learn their mistake."
 anh_victory_objective_decision_confirm: "They feed the fishes now."
 anh_victory_objective_decision_effect_tooltip: "Nusantara will be renamed to the Blood Seas. All counties in the #ONCLICK:GEOGRAPHICAL_REGION,world_asia_philippines #TOOLTIP:GEOGRAPHICAL_REGION,world_asia_philippines #L Philippines#!#!#! will get [GetModifier('POD_secure_seas_modifier').GetNameWithTooltip]."
 anh_custom_decision: "[GetScriptedCharacterByHistoryID('791113').GetFirstName] must be dead."
 
 POD_secure_seas_modifier: "Secure Seas"
 POD_secure_seas_modifier_desc: "Now firmly under the control of your people, the seas have become an ally to the settlements instead of a capricious foe."
 
 pod1230objectives.213.desc: "The oceans boil.\n\nLong have we stalked these seas. Long have we fought the monsters in the depths, long have we challenged the sharks for supremacy. But as of late, you and your lineage have been pulled to the shores, back to dry land, as would-be conquerors and ghost queens have sought their own ends, disturbing your aims.\nAnd now, the lands are quiet. The home islands are quiet. The flesh demons lie torn asunder. The ghost vampires have been consigned to be one with the ghosts they once ruled. The status quo you once enjoyed is gone forever. In your war the shore has become accustomed to you. But now, with all roads open, you have a choice for the fate of those you command. \n\nWe are done as slayers. Now we build. We rule. We swim. We fight."
 pod1230objectives.213.a: "We will be the Scourge of the Seas." 
 
 kuntilanak_victory_objective_decision: "What Monsters Fear"
 kuntilanak_victory_objective_decision_tooltip: "Even so far from Him, His spawn still stalk us."
 kuntilanak_victory_objective_decision_desc: "As is the true curse of the lineage of Absimilliard, the Kuntilanak are hunted down by their progenitor's monsters. To protect themselves, they must learn more and use necromancy as their shield."
 kuntilanak_victory_objective_decision_confirm: "Warded by death."
 kuntilanak_victory_objective_decision_effect_tooltip: "You will replace your house modifier with a more powerful one that will also gives you access to new Men-at-Arms."

 pod1230objectives.214.desc: "Long have the Kuntilanak hidden. Long have the horrors in forgotten places stalked you. But despite it all, now the Blood Drinking Ghosts number across the islands as many. The dead warn of the hunters’ approach, and assail them in advance while you and your kind escape. And now, at a zenith of your strength, you need no longer hide.\n\nThe well buckles as the horror rises from it. The hunter howls close, oblivious to what awaits it. The Neverborn Dead you call forth recognizes the power you wield, and licks its skeletal lips for the prey you have given it. It rises, as the well opens, as a stream of Spectres and Malfeans pour from it, seeking the hunters.\n\nWe are prey no longer. We are now the hunters."
 pod1230objectives.214.a: "And the dead are our hunting dogs." 
 house_kuntilanak_improved_modifier: "House Kuntilanak"
 
 sangun_victory_objective_decision: "The Bear Rules, It Does Not Kneel"
 sangun_victory_objective_decision_tooltip: "We are rulers, even if they think otherwise."
 sangun_victory_objective_decision_desc: "The \"Clan of Kings\" in Korea rules only over a small mountainous territory, subjected to ridicule by its more powerful neighbors. This has to change."
 sangun_victory_objective_decision_confirm: "Do they dare laugh now?"
 sangun_victory_objective_decision_effect_tooltip: "You will get a powerful house modifier that will also make it easier to vassalize characters in East Asia."
 sangun_victory_objective_decision_custom: "The Empire of Goryeo (also known as Azure Dragon Court or Green Courts) must be held by you or destroyed."

 pod1230objectives.215.desc: "Not long ago, the Sangun were seen as the little bears squatting in the mountains. The Courtiers of no renown that played as silly mountain kings, lords in name only.\n\nBut you did not forget. In your blood you are kings.\n\nThe domain you have built is like no other the Lineages have seen, of a power that makes even your former overlords step back in trepidation. Your curse is no longer a mark of ridicule, but of fear. A king need not be seen to rule if they are truly a king. The progenitor’s nobility lives on in you just as much as it does the others.\nYour role is now self-evident. None may ever again deny the birthright of the Clan of Kings. No matter how they manifest."
 pod1230objectives.215.a: "Our work has only just begun."
 
 banpaia_victory_objective_decision: "The Eastern Pyramid"
 banpaia_victory_objective_decision_tooltip: "Far from home but now creating your very own."
 banpaia_victory_objective_decision_desc: "What can a stranded Tremere expedition so far from Ceoris accomplish? Well quite a lot if you have your say about it..."
 banpaia_victory_objective_decision_confirm: "Send a message to Europe."
 banpaia_victory_objective_decision_effect_tooltip: "You will get a choice between joining back with the main [GetTrait('tremere').GetName(GetNullCharacter)] Clan or cutting ties with them."
 
 pod1230objectives.216.desc: "You muse on the potential that lies before you.\n\nWhen the Banpaia first arrived in Japan, it was not under that name. Once upon a time, the Banpaia was simply just a single Tremere Expedition, one of many sent to the East on a mix of suicide missions and exploration missions, all of which met in destruction, save the one that would become your lineage.\nTaken in by Kagaseo, you have now since grown beyond her. [Glossary('Mikaboshi','podgloss.mikaboshi')]’s enlightenment granted you a new host, a new court. The Elders back West would be shocked to hear of all of this, of your success, and of the formation of an entirely new Pyramid, with you at the top.\n\nBut the question now remains, what now? Two options lie before you. Either report back, and gain the benefits of membership in the larger clan. You would certainly become a Councillor with your accomplishments… but do you really want to be beneath anyone?\nYou could build a new pyramid, a better one. But should the Tremere ever find you again, they would spare no expense to destroy you, and you’d be on your own since your ascent.\n\nChoices, choices…"
 pod1230objectives.216.a: "The rewards of support are immense. I will become a Councillor." 
 pod1230objectives.216.b: "“Arbitrium Vincit Omnia.” Here we shall remain." 

 ashen_grandmaster_initial_kj_decision: "[ashen_grandmaster|E]"
 ashen_grandmaster_initial_kj_decision_tooltip: "There is always more to learn about warfare."
 ashen_grandmaster_initial_kj_decision_desc: "The $pod_kueijin$ have created many different forms of warfare over the ages. Your travels are a good opportunity to learn, and hopefully, master those rare strategies."
 ashen_grandmaster_initial_kj_decision_confirm: "Where to focus my efforts?"
 ashen_strategist_initial_effect_tt: "You will start your journey as a strategist, allowing you to earn experience for the [ashen_grandmaster|E] and then use it to learn new tactics." 
 
 ashen_grandmaster_kj_decision: "[ashen_grandmaster|E]"
 ashen_grandmaster_kj_decision_tooltip: "There is always more to learn about warfare."
 ashen_grandmaster_kj_decision_desc: "The $pod_kueijin$ have created many different forms of warfare over the ages. Your travels are a good opportunity to learn, and hopefully, master those rare strategies."
 ashen_grandmaster_kj_decision_confirm: "Where to focus my efforts?"
 ashen_strategist_effect_tt: "You will spend your [ashen_grandmaster|E] experience to learn a new or improve an existing $pod_kueijin$ specific style of warfare." 
 need_50_ashen_grandmaster_xp: "You need 50 or more Ashen Grandmaster experience."

 pod1230objectives.217.desc: "The Kindred of the East have a long tradition of martial dedication. Following in the footsteps of the legendary Sun Li, the one who codified the art of war for the undead, these wandering strategists roam the world to learn and improve their knowledge of this deadly art.\n\nThe first tradition to have been created was the Twilight Wars, a form of conflict designed to settle escalating arguments. Due to its nonlethal nature, it has been used to experiment and improve on more indirect ways to hamper a foe.\n\nThe Midnight Wars were the continuation, codified when the Twilight ones proved insufficient to settle a particularly fierce rivalry. Those are to the death but force an honorable conduct and severely limit the potential for casualties unrelated to the conflict.\n\nFinally, the [Glossary('Penangallan','podgloss.penangallan')] of Southeast Asia recently developed the Wayang Kulit warfare. This makes use of the rough terrain and specifically tailored powers to confuse a foe until they are disorganized enough for a direct confrontation."
 pod1230objectives.217.a: "I will master the Twilight." 
 pod1230objectives.217.b: "Midnight is my hour." 
 pod1230objectives.217.c: "Jungle warfare calls to me." 
 pod1230objectives.217.d: "On second thought..." 

 road_horizon_victory_objective_decision: "Shadow Society Ascendant"
 road_horizon_victory_objective_decision_tooltip: "Well behaving outsiders."
 road_horizon_victory_objective_decision_desc: "In our long struggle to integrate with the Courts, others like us threaten to bring it all crashing down. The Ferals of the Sea, the Brigands of the Sword, and Cultists of Flesh all threaten to make meat of us all.\nFor our survival, they must be destroyed. For our ascent, they must be swept away."
 road_horizon_victory_objective_decision_confirm: "Proving our worth to our hosts."
 road_horizon_victory_objective_decision_effect_tooltip: "You will get access to five [men_at_arms|E] that are otherwise locked to $pod_kueijin$."
 road_horizon_victory_objective_decision_custom: "There must be no independent ruler of House [GetDynastyHouseByID('house_chibo').GetName], [GetDynastyHouseByID('house_bushi').GetName] or [GetDynastyHouseByID('house_anh').GetName]."

 pod1230objectives.218.desc: "Finally, you go a night without inquiries. Long have you waged war against your so-called ‘kin’. The rites of the [Glossary('Wicked City','podgloss.wickedcity')] lie unperformed. The oceans are calm. And there is no scraping of blades in scabbards. Finally, it is peaceful.\nYou open your eyes, as the assembled Ancestors debate your existence. While you may be ‘unproven’, you have at least proven yourself useful.\nAfter much debate, they return to their places, and formally, they name you ‘Ancestor’. You smile, the weight of your great works finally manifested. Several [Glossary('Wu','podgloss.wu')] kneel before you, envoys and tributes. [GetTrait('dhampyr').GetName(GetNullCharacter)] bow, as your own court behind you visually relaxes.\n\nYou are equals now, no longer just another variant of the Little Gods. The Corpse Courtiers stand side by side to the [Glossary('Hungry Dead','game_concept_kuei_jin_desc')]. Now the real work might begin."
 pod1230objectives.218.a: "Courtiers no longer. Now we are Kings." 
 pod1230objectives.218.b: "My bearing deserved nothing less. I will reach far beyond what I was denied."
 pod1230objectives.218.c: "Thank god this is over. Now I can go back home."
 pod1230objectives.218.d: "Now we might finally be safe from the Hunters. See them try to get to us now."

 chibo_victory_objective_decision: "Whispers of the Cruel City"
 chibo_victory_objective_decision_tooltip: "Secrets revealed."
 chibo_victory_objective_decision_desc: "[bloodsorcery|E] has always been a struggle for your stranded bloodline due to a lack of resources. With the help of the Western arrivals and the patronage of [Glossary('Mikaboshi','podgloss.mikaboshi')] however, you might be able to fix this glaring weakness."
 chibo_victory_objective_decision_confirm: "Honing our own magical arts."

 pod1230objectives.219.desc: "Long had the Great Clan labored to perfect the arts of Blood Magic, and for the longest time, no matter their skill, they had remained a Lion in a cage, restricted and strangled by a lack of scope, a lack of understanding, and worst of all, a lack of the power of proper magic.\n\nBut no more. Since the recruitment of the Western Expedition, more arts have been revealed to you. Through mastery of the underlying principles, and ancient Arcanas and Rotes of [Glossary('Mikaboshi','podgloss.mikaboshi')], you have done it. This artifact is your great work, a thesis on the underlying principle of magic, a unified theory. And through it..."
 pod1230objectives.219.a: "...all magic is laid bare." 
 artifact_hand_mikaboshi_name: "Mikaboshi's Hand"
 artifact_hand_mikaboshi_description: "#bold Provides a +25% spell success chance and a +10% ritual speed bonus for blood sorcery.#!\nA plain looking tablet infused with magick, it can serve as a major arcane item if the proper activation words are spoken. The demonic taint from [Glossary('Mikaboshi','podgloss.mikaboshi')] is obvious to anyone with a whiff of knowledge about the supernatural."

 monomi_victory_objective_decision: "The Sword of Stars"
 monomi_victory_objective_decision_tooltip: "A triumph in the making."
 monomi_victory_objective_decision_desc: "Lord [Glossary('Mikaboshi','podgloss.mikaboshi')] has many enemies. As his most martially inclined servants, it falls to you to make them disappear. Rewards are sure to follow, for the [Glossary('Wicked City','podgloss.wickedcity')] provides to the strong."
 monomi_victory_objective_decision_confirm: "Time to make my mark."

 pod1230objectives.220.desc: "Sometimes, even your dull heart may race.\n\nThis has been a long time coming. You run your hands across the reward for your work, brought to you by one of [Glossary('Mikaboshi','podgloss.mikaboshi')]’s Iron Demons in recognition for your service. The hilt of a blade, magnificent and polished of a steel beyond compare, durable enough not even the forge of the gods could render it down. And rather than a sheathe, a flick of the thumb brings forth a cruel curved blade, the edge crackling with a sinister malice.\n\nA sword that can cleave open the heavens."
 pod1230objectives.220.a: "A fine gift. It will be put to good use."
 artifact_sword_stars_name: "Sword of Stars"
 artifact_sword_stars_description: "The hilt of a blade, magnificent and polished of a steel beyond compare, durable enough not even the forge of the gods could render it down. And rather than a sheathe, a flick of the thumb brings forth a cruel curved blade, the edge crackling with a sinister malice."

 bushi_victory_objective_decision: "Swallowing the Dragon"
 bushi_victory_objective_decision_tooltip: "Love and power."
 bushi_victory_objective_decision_desc: "Rumors exist that the $pod_cainites$ can learn the $pod_kueijin$ powers. The cost however might be too much for you to bear. Will this be like losing a part of yourself or becoming something greater?"
 bushi_victory_objective_decision_confirm: "It is time."
 bushi_victory_objective_decision_custom: "You need a $pod_kueijin$ soulmate."
 bushi_victory_objective_decision_custom2: "#X Your $pod_kueijin$ soulmate will die.#!\nYou will get access to the $pod_kueijin$ powers (represented as new lifestyles)."
 
 pod1230objectives.221.desc: "You’ve talked this through with them, and they have a degree of hesitance. What you are suggesting is blasphemy of the highest order. And further, if it goes wrong, they will die, and you will likely go berserk.\nSuch is the nature of this sin. But for too long the $pod_kueijin$ have called you foulspawn. For too long the other lineages have called them Devils. You’re more alike than different. If you were one, perhaps new roads could open up to you, new paths to be tread.\nOne thing is certain though, this rite will be difficult. The Beast will fight back, their darker self will also fight back. No one has ever attempted something like this. If only..."
 pod1230objectives.221.a: "I want us to become one. Truly." 
 
 golden_children_decision: "The Golden Children"
 golden_children_decision_tooltip: "The sins of our fathers are not ours."
 golden_children_decision_desc: "A long time ago, Dhampyr were known as Jin Hai, the \"Golden Children\" of the heroic $pod_kueijin$ of old. When their parents fell from grace they tried to reason with them but were rebuked at every turn. The so called \"Children's Revolt\" was crushed as Heaven itself wept for this terrible loss.\n\nIt would take a very successful dhampyr to remind their peers of their past and break the shackles put on them for all these years."
 golden_children_decision_confirm: "Our legacy reborn."
 golden_children_decision_incompatibility_tt: "#warning The Golden Children and Shade Walkers objective are mutually exclusive. You can achieve only one or the other.#!"
 golden_children_decision_effect: "You will get the Golden Children empire title and the [GetTrait('dhampyr').GetName(GetNullCharacter)] trait will now be inheritable."
 
 pod1230objectives_kj.5.desc: "Thousand of years ago, during the Age of Legends, the Ten Thousand Immortals were the guardians of the mortal peoples. From time to time, they took a mortal lover and sometimes a child was born of this union. Called Jin Hai, these half immortals were blessed and were heroes of the people as they walked among and not above them.\n\nAs their $pod_kueijin$ parents fell more and more into corruption, the Golden Children attempted to voice their concerns before it was too late. Time and time again, they were rebuked. What do children know that gods don't afterall?\n\nThe despicable behavior of the $pod_kueijin$ intensified until the Golden Children could no longer clean after them. They gathered at Mount Meru and choose to face the $pod_kueijin$ with honor and resolve. The Children's Revolt was born.\n\nAn incredible sight it was, but a pointless one in the end. As blessed by Heaven as they were, the Jin Hai's righteous fury was no match for the bloodlust of their parents. The blood of the Golden Children stained the tiles of the palace of Meru red forevermore.\nHeaven and Earth wept for the Children.\n\nTheir parents did not.\n\nSince then, the children born of $pod_kueijin$ are known as Dhampyr and are pale shadows of the Golden Children of old, forced to toil for their parents' benefit. Each and every one of them carry a soul of a Golden Child however and this soul is now awakened.\n\nThe Children's Revolt, be it by words or arms, won't be quelled a second time."
 pod1230objectives_kj.5.a: "We will see Meru again." 
  
 shade_walkers_decision: "The Shade Walkers"
 shade_walkers_decision_tooltip: "We can walk where they cannot and that makes us useful."
 shade_walkers_decision_desc: "The wise $pod_kueijin$ prizes their dhampyr servant. The so called \"shade walkers\" can act in daytime and among mortals with much more ease than their masters. For those truly skilled, impressive boons can be granted."
 shade_walkers_decision_confirm: "We thrive in twilight."
 shade_walkers_decision_tt: "You must have a soulmate or best friend that is a $pod_kueijin$ with [Glossary('Dharma','podgloss.dharma')] 8 or more."
 shade_walker_modifier: "Favored Shade Walker"
 shade_walker_modifier_desc: "#warning This modifier gives you access to the Chi Arts lifestyle powers.#!\n\nA dhampyr rewarded for their impressive service, this shade walker has been given ample boons by their $pod_kueijin$ benefactors."

 pod1230objectives_kj.6.desc: "As they are half mortal and can walk in broad daylight, Dhampyr serve a very useful purpose in $pod_kueijin$ society. Most are taught from birth that their roles will be to serve as ambassadors, administrators or spies for their parents, though more varied tasks also happen.\n\nFor each $pod_kueijin$ that is treating their dhampyr child as an expendable tool, there is another one that is spoiling them to no end, enraptured by the fact that they are still able to give life. This makes each dhampyr's existence very different from their brethren.\n\nStill, the constant is the need to be of use. Even the most patient parent won't endanger their Dharmic (or more mundane) pursuits for long because of a foolish child. For the truly gifted however, there might be hopes of attracting the attention of the more enlightened $pod_kueijin$ out there, those said to provide some powerful boons such as teaching their mysterious soul arts.\n\nSome even say that several Dhampyr achieved true immortality by finding the right $pod_kueijin$ patron, though such rumors are only whispered about, as the undead society wouldn't allow such a possibility to be widely known to their children."
 pod1230objectives_kj.6.a: "Service has its rewards." 
 1300_current_date_tt: "This objective is only available before 1300" 
 1350_current_date_tt: "This objective is only available before 1350" 
 1400_current_date_tt: "This objective is only available before 1400" 
 

 pod1230objectives.222.t: "La Grande Tragédie"
 pod1230objectives.222.desc: "Every tragedy needs a magnum opus, and ours has consumed the realm. All across Francia, the lilies have wilted from our meticulously crafted schemes to inflict despair. The so-called 'Courts of Love' of the degenerate Toreador have turned into a grand, weeping theater. Now, with our tyrannical hold secure and our masterful heirs carrying the melody of our cruelty, the shattered glass of our lineage can finally be brought back together.\n\nAs the curtains fall and we take a bow, I can feel our master smiling at us. I can feel his dark influence coiled around my mind, sharing in the sensation of his endless cruelty. Whether I am now carrying his blessing or have been simply hollowed out to be a perfect vessel does not matter. Ennamaru is reborn in our blood, and the world will soon know his name."
 pod1230objectives.222.a: "Let the curtain fall. Cue the weeping of a broken realm."
 
 pod1230objectives.223.t: "Master of Flesh and Bone"
 pod1230objectives.223.desc: "The screaming has finally stopped.\n\nNot because you suddenly decided to show mercy, but because the raw materials that your muses so generously provided finally settled into their intended configuration. The Fiends boast of their war forms, but they are nothing more than ugly beasts. As an artist, however, you know that true art requires suffering, which you have inflicted upon both yourself and your muses a great deal throughout this process.\n\nThe result of your hard work is breathtaking. To look upon your form now is to see an angel, born from bone and blood.\n\nWhat was seen as mere butchery has been elevated to the divine, all thanks to your efforts."
 pod1230objectives.223.a: "Perfection!"
 
 pod1230objectives.224.t: "France, Cleansed"
 pod1230objectives.224.desc: "It is done. The demon-worshippers who sought to corrupt this domain have been rooted out and destroyed.\n\nLooking over your lands, the change is already clear. Without the subtle corruption of the Children of Ennamaru and your own Beast firmly leashed by your mortal touchstones, the mortals are free to prosper. Trade flourishes, fields are tended with renewed vigor, and the harmony your kind has had with the kine is resumed. A golden age for France is here."
 pod1230objectives.224.a: "Let the realm flourish under our watch!"
 
 helenacult_victory_objective_decision: "The Helen Pantheon"
 helenacult_victory_objective_decision_tooltip: "Can a Goddess truly rule alone? Experience has proved this difficult."
 helenacult_victory_objective_decision_desc: "The Trojan and the Spartan's feud shows that no one is truly safe on their own, no matter how close to godhood they are. Greece had many Gods and it is time to form a new pantheon, worthy of leading the immortal Children of Caine to their destiny."
 helenacult_victory_objective_decision_confirm: "A new Olympus."
 helenacult_custom_decision: "Your coterie needs to be full, composed of 1000+ years old characters. If said characters are [GetScriptedCharacterByHistoryID('505071').GetFirstName], [GetScriptedCharacterByHistoryID('790353').GetFirstName], [GetScriptedCharacterByHistoryID('790284').GetFirstName], [GetScriptedCharacterByHistoryID('790592').GetFirstName], or [GetScriptedCharacterByHistoryID('790101').GetFirstName] they will get special rewards."
 helenacult_custom_decision2: "Your coterie members will gain 5 diplomacy and intrigue as they rise to become part of your new pantheon. If said characters are [GetScriptedCharacterByHistoryID('505071').GetFirstName], [GetScriptedCharacterByHistoryID('790353').GetFirstName], [GetScriptedCharacterByHistoryID('790284').GetFirstName], [GetScriptedCharacterByHistoryID('790592').GetFirstName], or [GetScriptedCharacterByHistoryID('790101').GetFirstName] they will get additional skill points depending on their expertise."
 helenacult_custom_decision3: "#R This decision is mutually exclusive with 'Shatter the False Idols'. #!"
 
 pod1230objectives.230.desc: "Before Menele's senseless feud against me, I had respect, worship, power and, perhaps most strangely of all, even allies. With my pivotal role in the defeat of Carthage, many of this cursed city's enemies became, if not my friends, at least my companions for a while. Some of them shielded me from Menele but time, their own concerns and my focus on survival made us drift apart.\nTonight however, things will change.\n\nThe mad Spartan is no longer hounding my every step and I can look at the world more closely than I ever did in the past centuries. Creatures that were once old and powerful back then are now myths, or ashes in the wind. It is my generation, the heirs of Greece, Rome and the Mediterranean that are the true powers of these nights.\nWith the newblood fearing the mortals and their petty Church, the cowardly concept of "Masquerade" is taking hold. But mortals are not to be feared, mortals are to be shown that their faith in a callous and uncaring god is misplaced. There are true Gods and Goddesses walking the Earth, ones that were young when Egypt was old and that are now old when the Christian God is still young.\n\nThe wheel turns and I will herald the birth of this new pantheon. A glorious dusk for the Children of Caine to take back their rightful place and a glorious dawn for the Children of Man to once again be able to worship beautiful and terrible Gods."
 pod1230objectives.230.a: "They will all see clearly now."
 pod1230objectives.230.desc.nothelena: "Helena was once a ruler in Argos and Pompeii. Though in these times, the line between ruler and god was very much blurred, especially when it comes to such a perfect being. But, as Greece itself had many Gods, there were other rulers that were worthy of Helena's attention or even friendship. The Roman vampires most notably were grateful for her part in purging the hellhole that was Carthage, a victory that could only have been achieved via cooperation.\n\nThis is an example we are following. With the Church making the situation more and more difficult for our kind, the nights when we could simply hope to help everyone embrace Helena as their benefactor are past. We need a broader approach, gathering likeminded immortals that have the experience and prestige sufficient to create a new pantheon. When said pantheon is fully established and the rule of the Children of Caine is once again solidified over mortals, our cult will be able to flourish.\n\nWith the perfect Supreme Goddess of this new pantheon surely blessing our holy mission, victory is assured."
 
 helenacult_victoryalt_objective: "Shatter the False Idols"
 helenacult_victoryalt_objective_decision_tooltip: "Only one Goddess may reign."
 helenacult_victoryalt_objective_decision: "Apotheosis"
 helenacult_victoryalt_objective_decision_desc: "The Helen's divinity will always be at risk as long as the other false Gods and Goddesses continue to live. Only by ending them can the true divine's place be secured."
 helenacult_victoryalt_objective_confirm: "Only one remains."
 helenacultalt_custom_decision2_tt: "You will unlock the final stage of Helena's story corresponding to the decision chosen."
 helenacultalt_custom_decision3_tt: "#R This decision is mutually exclusive with 'The Helen Pantheon'. #!"
 helenacultalt_custom_decision1: "The false idols [GetScriptedCharacterByHistoryID('505071').GetFirstName], [GetScriptedCharacterByHistoryID('790353').GetFirstName], [GetScriptedCharacterByHistoryID('790284').GetFirstName], [GetScriptedCharacterByHistoryID('790592').GetFirstName], and [GetScriptedCharacterByHistoryID('790101').GetFirstName] must be dead."
 
 pod1230objectives.231.desc: "Great Helena, you have finally done it. For centuries, the blood of the world had been diluted by arrogant parasites and false idols. They paraded around, confident in themselves, stealing the worship and adoration that rightfully belonged to you.\n\nMithras, with the hollow sun that burned him. Apollo, choked on his vanity. Anath, hunted down like prey. Artemis, felled in battle. And finally, Camilla, clinging to his desperate delusions of grandeur. All of them cast down, their ashes proof of their inferiority.\n\nThe Sons and Daughters of Helena praise your name with joy, and the non-believers are beginning to see the truth. That there is only one Goddess, beautiful and terrible in equal measure.\n\nBut as you bask in the midst of your immortal flock, you know that your mission is not over yet. There is one final, ancient claimant. One final idol that must be broken like the rest."
 pod1230objectives.231.desc.nothelena: "Your bloody service is done. For ages, the world was polluted by arrogant ancients who dared to demand the worship meant only for the Helen. But now, their mockery has been put to an end. You have proven yourself to be most lethal and exquisite weapon of the true Goddess. Because of your undying devotion, Helena has been elevated beyond the petty squabbles of the rest of your kind. The Sons and Daughters of Helena sing praises of her name, and whisper yours in reverence as the one who aided her ascension.\n\nThe night belongs to her, and by extension, you. However, there is one issue that mars the perfection of her grand design. The purging is not yet done. Hidden away somewhere in the dark lays one final pretender. Another would-be divine in the path of your Goddess, awaiting your blade."
 pod1230objectives.231.a: "Ascension is at hand."
 
 secrettalk_objective: "Seek out the Rose"
 secrettalk_objective_decision_desc: "There has been one prominent figure in our history that has done what we are trying to accomplish. A truly ancient Cainite who once ruled Sumer as a Goddess. If we could seek her out, get an audience, who knows what insights we may gain?"
 secrettalk_objective_decision_tooltip: "I must seek her out."
 secrettalk_objective_confirm: "Can you hear us?"
 secrettalk_objective_decision2: "Spread your cult, gather rare artifacts, help your flock develop, and you may prove you are worthy enough for an audience with the Rose."
 own_four_illustrious_artifacts_tt: "You must own at least four artifacts of illustrious rarity."
 toreador_house_court_positions_tt: "A character from each major Toreador [house|E] must hold at least one [court_position|E] in your realm. The Houses required are [GetDynastyHouseByID('house_nephilim').GetName], [GetDynastyHouseByID('house_salianna').GetName], [GetDynastyHouseByID('house_callisti').GetName], [GetDynastyHouseByID('house_andrew').GetName], [GetDynastyHouseByID('house_helena').GetName] and [GetDynastyHouseByID('house_apollo').GetName]."
 
 
 secrethunt_objective: "Wilting Rose"
 secrethunt_objective_decision_tooltip: "One last obstacle."
 secrethunt_objective_decision_desc: "A final figure stands in the path to divinity. Do you dare challenge them?"
 secrethunt_objective_confirm: "It's time to end this."
 secrethunt_objective_tt: "You will attempt to get rid of the last obstacle in your path to divinity. Be ready. \n\n#color:{0.75,0,0};glow_color:{0.75,0,0} The Rose has thorns, and you will not get a second chance#!."
 secrethunt_objective_decision: "Exaltation"
 pod1230objectives.232.desc: "Helena, the pretenders are all dust and their stolen worship belongs to you, as it should be. But whenever you close your eyes, you feel a maddening dark spot, coming from another who was worshipped as a Goddess so long ago.\n\nArikel. Ishtar. Aphrodite. The Progenitor of Clan Toreador.\n\nAs long as she remains slumbering somewhere, your godhood will always be tethered to another being. Arikel is a constant reminder that you have reached the ceiling of your damned existence. To be a true Goddess, you must not have a creator.\n\nYou will seek out where she is hiding. You will drag her out of her tomb, sink your teeth into her ancient veins, and you will take the beauty, the power and the divinity in them. Only when Arikel is dust will the Helen be absolute."
 pod1230objectives.232.desc.nothelena: "With the false idols gone, the night belongs to Helena of Troy. But in the darkest shadows of the world, an old presence still lingers. Arikel, the being that predates even your Goddess. The Mother of the Clan of the Rose.\n\nAs long as Arikel exists, Helena's claim of divinity will be constantly challenged by the very blood running through her veins. The ultimate act of devotion for Her is clear. You must track the ancient down to her hiding spot, and commit a great sin.\n\nBy committing Amaranth on Ishtar yourself, you will tear that ancient power out of her veins. Power so vast and mind-shattering will be in your own veins, threatening to tear you apart, all to forge yourself into the greatest instrument for Helena's will. You must claim the blood of the Goddess of Sumer so that your own may reign freely for eternity."
 pod1230objectives.232.a: "Her soul is the only path to ascension."
 
 pod1230objectives.233.t: "Finding A Goddess"
 pod1230objectives.233.desc: "To seek out any other Progenitor is usually a death sentence. Arikel, however, is not like any other. Rumors suggest that she might greet determined guests not with fangs, but with open arms, provided you approach with reverence and not violence.\n\nIt is a good thing you only seek her counsel.\n\nThe journey ends up being remarkably effortless. Rather than facing traps, hurdles and deadly guardians, you and your Pantheon feel a delicate pull guiding you towards the Mediterranean, and into a valley hidden deep in the wilderness of Greece. As you and your allies draw closer to a remarkably well-kept temple, the air begins to shift. You brace yourself for the crushing weight of an Antediluvian.\n\nInstead, the sensation washing over you is oddly warm. A gentle, intoxicating aura that instantly lulls the Beast within you. It is not a snare, but a loving embrace."
 pod1230objectives.233.a: "We step into her embrace."
 
 pod1230objectives.234.t: "The Inner Sanctum"
 pod1230objectives.234.desc: "You and your Pantheon step inside the ancient temple, and she is right there, awaiting you.\n\nYou cannot truly describe her. Looking upon Ishtar is like staring at the sun; a physical ache, caused by blinding, aesthetic perfection that overwhelms your senses, tears of blood welling up in your eyes at the sheer beauty. Humbled by the sheer magnitude of her existence, the rest of your Pantheon falls to their knees beside you. You cannot resist it either.\n\nArikel's greeting simply exists. She does not part her lips to speak, but you feel her intent clearly with the warmth blooming in your mind and soul as her unconditional affection reaches you all. Taking a deep breath, reflexively, you fight the urge to simply bow your head and bask in her presence until the end of time. You did not journey this far to worship her. Gathering all your strength, you raise your head and prepare to ask the Bull-Dancer the very thing that brought you here. Her wisdom."
 pod1230objectives.234.a: "We seek your guidance..."
 
 pod1230objectives.235.t: "Mirror Of Ages"
 pod1230objectives.235.desc: "The moment you finish talking, her silent presence guides your thoughts inward, into the history resting in your blood. You feel a tide of memories washing over you, and find yourself asking one question.\n\nWhat is the essence of the Rose? In the dawn of civilization, Ishtar ruled in Sumer as a Goddess, just as you have been trying to do. When Rome rose and succumbed to a pleasurable decay, the Roses were at the center of it, indulging without shame. Now, in this age of steel, they ride as paragons, shining example of knightly virtue and chivalry.\n\nAre you merely eternal chameleons, effortlessly mimicking human paradigms? Is there something real and beautiful beneath that vain outer shell?\n\nArikel's aura peels back all the layers of pride and vanity, and you finally realize that there is a deep truth to it. Then, for the first time, spoken words come out of Arikel's lips.\n\n#color:{0.75,0,0};glow_color:{0.75,0,0} "What is Clan Toreador?" #!"
 pod1230objectives.235.a: "We embody chivalrous valor and grace."
 pod1230objectives.235.b: "We are exquisite poison, masters of decadence."
 pod1230objectives.235.c: "We are divine idols, made to command the masses."
 pod1230objectives.235.d: "We are the grandest patrons of the arts."
 
 pod1230objectives.236.t: "A Masterpiece, Realized"
 pod1230objectives.236.desc: "Arikel hears your truth, and you can feel the silence stretch on as her ancient mind weighs your answer. Then, the stillness breaks, and the euphoric warmth is back. She does not smile, but you can feel the sensation of her profound approval wash over you. The vitae in your veins seem to grow hot, but it is a soothing feeling. It feels as if a masterwork has finally been realized. Arikel imparts her wisdom not with words, but by the blood itself. You and your immortal coterie feel a sudden clarity as your chosen path is made clear.\n\nThe warm aura enveloping you begins to fade, the perfection of Aphrodite dimming as her connection to you gently withdraws.\n\n#color:{0.75,0,0};glow_color:{0.75,0,0} "Make the night your masterpiece." "#!
 pod1230objectives.236.a: "The world is our canvas."
 
 pod1230objectives.237.t: "Ergenekon Wakes"
 pod1230objectives.237.desc: "The earth itself trembles below your feet as the great forges roar to life once again after centuries of silence. The cold, stale air of the mountain is gone, replaced by the familiar inferno. To any other $pod_cainite$, these flames would incite mindless terror. Yet the elders of our bloodline stand unflinching before the furnaces.\n\nYour kind has always been one with this mountain, the very existence being tempered in fire such as this. The hot air feels familiar to you, not hostile.\n\nThe younger Erk flinch and back away in fear, their Beasts whining in discomfort. They stick to the shadows for now, but they will learn to embrace it soon enough. They must.\n\nA deafening chorus of hammers striking anvils begins soon, the melody of masterwork armors and weapons being created. The Erk are no longer scared exiles, hiding in the dark. Let the Steppes hear the sound of our industry!"
 pod1230objectives.237.a: "Forged anew in fire."

 koldunic_ways_objective_decision: "Broaden the Koldunic Ways"
 koldunic_ways_objective_decision_tooltip: "There is always more power to be found."
 koldunic_ways_objective_decision_desc: "The Koldunic [krainas|E] while powerful, are bound to the earth. In order to combat this weakness, new ways of practicing Koldunism must be found before the other sorceries overtake it or it becomes lost to time. Methods that any neonate should be able to easily learn and use."
 koldunic_ways_objective_decision_confirm: "Koldunism will be eternal."
 koldunic_ways_objective_decision_requirement: "Own the [GetPODArtifactName('incunabulum_kupalam_link')]"
 koldunic_ways_objective_decision_requirement2: "Have #V 5#! [GetTrait('tremere').GetName(GetNullCharacter)] [prisoners|E]"
 koldunic_ways_objective_decision_requirement3: "Have #V 10#! [prisoners|E] with any form of [GetTrait('bloodsorcery').GetName(GetNullCharacter)]"
 koldunic_ways_objective_decision_effect: "Additional #V Koldunic Sorcery#! [perks|E] will become available to all characters."
 pod1230objectives.225.t: "The Koldunic Ways"
 pod1230objectives.225.desc: "Koldunism is one of the most ancient forms of Blood Sorcery known to $pod_cainites$. In addition to its many intricacies, the Tzimisce have greedily guarded this power from others which has led to very few living practitioners of this ancient power. With the rise of Thaumaturgy and its ease of learning, Koldunism faces a choice, it must either adapt or be lost to the ravages of time.\n\nThrough your wisdom and knowledge, you have managed to create five additional paths for Koldunism. Unlike the [krainas|E], these Ways draw power from all the elements and are not bound to the land itself. Which makes them both easier to learn, and easier to use."
 pod1230objectives.225.a: "The elements are mine to command."
 pod1230objectives.226.t: "The Koldunic Ways"
 pod1230objectives.226.desc: "Reports said that [koldunic_expander.GetFirstNameNoTooltip] has expanded Koldunic Sorcery.\n\nKoldunism is one of the most ancient forms of Blood Sorcery known to $pod_cainites$. In addition to its many intricacies, the Tzimisce have greedily guarded this power from others which has led to very few living practitioners of this ancient power. With the rise of Thaumaturgy and its ease of learning, Koldunism faces a choice, it must either adapt or be lost to the ravages of time.\n\nThrough [koldunic_expander.GetFirstNameNoTooltip]'s wisdom and knowledge, [koldunic_expander.GetSheHe] has managed to create five additional paths for Koldunism. Unlike the [krainas|E], these Ways draw power from all the elements and are not bound to the land itself. Which makes them both easier to learn, and easier to use."
 pod1230objectives.226.a: "More powers to learn?"

 tzimisce_land_for_dragons_objective_decision: "A Land for the Dragons"
 tzimisce_land_for_dragons_objective_decision_tooltip: "A new empire will be built upon the flesh of our lessers."
 tzimisce_land_for_dragons_objective_decision_desc: "Many [GetTrait('tzimisce').GetName(GetNullCharacter)] reside in the [GetTitleByKey('e_voivodate').GetNameNoTier], we however are far-removed from their lands and politics. Our $pod_clan$ has always been rooted in our domains, it is time we lay our own roots here."
 tzimisce_land_for_dragons_objective_decision_confirm: "The Dragons will rise."
 tzimisce_land_for_dragons_objective_decision_requirement: "You hold at least #V 3#! [kingdom|E] [titles|E]"
 tzimisce_land_for_dragons_objective_decision_effect: "You will gain the [GetTitleByKey('e_tzimisce_dragons').GetNameNoTier] [title|E] which will include any [kingdoms|E] and [empires|E] you hold"
 pod1230objectives.227.t: "The New Domain"
 pod1230objectives.227.desc: "Through your might, a new realm has been carved for the Tzimisce. Far from the center of your $pod_clan$, this new domain is yours to rule. Your brethren may squabble and fail in the Voivodate, but you, you will achieve what they could not.\nThe Dragons will rule the night and you will rule over them all."
 pod1230objectives.227.a: "My rule is absolute."


 pod1230objectives.228.t: "Cure the Withering Blood"
 pod1230objectives.228.desc: "The knowledge is complete. The rituals are prepared. After centuries of searching, two paths lie before us — each offering salvation of a different kind.\n\nWe can renew the ancient covenant, binding Impundulu and Bomkazi together for eternity through a ritual of life and death intertwined. Or we can perform the Ishologu Rite, severing the dependency forever and transforming into something new — the Mla Watu, free but alone."
 pod1230objectives.228.a: "Renew the Covenant. Life and Death, together forever."
 pod1230objectives.228.b: "Perform the Ishologu Rite. Break the chains."

 ### Observer event
 pod1230objectives.229.t: "The Impundulu's Choice"
 pod1230objectives.229.desc: "Word reaches us that the Impundulu bloodline has made a pivotal decision regarding their ancient covenant with the Bomkazi witches. The balance between life and death shifts."
 pod1230objectives.229.a: "Interesting..."
 
 #############################
 #Flavor Decisions for clans#
 #############################

 ventrue_landed_house_objective_decision: "The Chosen of Caine"
 ventrue_landed_house_objective_decision_tooltip: "Either all of us are kings or none of us are."
 ventrue_landed_house_objective_decision_desc: "From our esteemed founder in the Second City to Camilla's Rome, Ventrue have always ruled the night. The only thing that can threaten our rule is petty infighting, something that we must make sure to curtail."
 ventrue_landed_house_objective_decision_confirm: "Let all of us rule."
 ventrue_landed_house_objective_decision_custom_2: "Your house must have at least 50 members"
 #ventrue_landed_house_objective_decision_custom_1: "Every member of your house must be landed"
 ventrue_landed_house_objective_decision_effect: "The Ephorate court positions will be unlocked for all your landed house members.\nYour house members will have greater aptitude for the court positions of the Ephorate."
 any_house_member_count: "Any House Member"
 
 pod1230objectives.300.desc: "Our founder, Ventrue, was named by Caine himself and he was most favored by Our Father. Shortly after his $pod_Embrace$, he took Ventrue from his [Glossary('Sire','game_concept_Sire_desc')] Enosh, to dwell at his side and observe as Caine ruled over the First City and his progeny.\nIn time, Caine revealed his intentions to Ventrue, telling him that he intended his grandchilde to succeed him when Caine departed the First City to find his destiny elsewhere. That very night, Caine disappeared and the first rains of the Great Flood began to fall. The rising waters washed away the First City and the childer of Caine as well, but Ventrue remembered Caine’s words and the duty placed upon him, to rule over his siblings and their childer in the Dark Father’s name.\n\nAntonius in Constantinople, Camilla in Rome, Mithras in England, Hardestadt in Germany, Alexander in France, all are exemplars of this proud tradition, and duty, of rulership we were entrusted with a long time ago. Before turning his blade against a fellow Ventrue, each of us must consider that, by doing so, they are betraying what Caine himself wanted of us. United, we will rule for eternity, divided we will soon fall."
 pod1230objectives.300.a: "As long as we stand united beneath me of course..."
 
 
 ventrue_true_king_objective_decision: "A Court fit for a Monarch"
 ventrue_true_king_objective_decision_tooltip: "Always hidden but never unknown, the true Ventrue pulls strings other aren't even aware of."
 ventrue_true_king_objective_decision_desc: "Ventrue invented the concept of Masquerade. They were always the most skilled at knowing when to put mortals behind the veil and when to wait. A true Ventrue leader is always unknown to the mortals but also always surrounded by the greatest among them."
 ventrue_true_king_objective_decision_effect: "You will get the Scepter of Kings Regalia artifact, this artifact unlocks an unique and powerful Cover the Masquerade option."
 ventrue_true_king_custom_decision: "The following Court Positions must be held by someone of good or excellent aptitude. If some aren't available to you, they will be skipped.\nAntiquarian, Seneschal, Champion, Court Tutor, Chronicler, Court Musician, Court Poet, Court Jester, Cupbearer, High Almoner, Royal Architect, Master of Horses, Master of the Hunt, Lady in Waiting."
 ventrue_true_king_objective_decision_confirm: "They gather in my shadow."
 
 pod1230objectives.301.desc: "Camilla is considered by many to have been the most influential Ventrue. One of his pivotal innovation, pioneered by his [Glossary('Sire','game_concept_Sire_desc')], was to decline to seek direct power, whether through being worshiped as divine or through bullying mortals with supernatural powers.\nInstead, Camilla was subtle. He traded favors for favors, both with vampires and with mortals who had no idea of his nature. He gave boons to those who aided him and spent decades plotting against those who had balked him and failed to make it up in some way. The rules of dignitas were still developing, but in a real sense, Camilla invented what we refer to tonight as prestation.\n\nThis concept has only grown, even though Rome itself didn't survive. The wise Ventrue King upholds the Masquerade but makes sure to be aware of everything happening in the mortal world. By subtly pressuring or flattering the most promising mortals, he then proceeds to enrich his court with the brightest of his age, making sure that his court is always at the forefront of innovation and culture."
 pod1230objectives.301.a: "Even hidden, one step ahead."
 
 ventrue_ruling_wisely_objective_decision: "From Enoch to Rome"
 ventrue_ruling_wisely_objective_decision_tooltip: "A wise king ensures his realm is as grand as he is."
 ventrue_ruling_wisely_objective_decision_desc: "Ventrue naturally end up ruling in the shadows of the largest cities of the world. It is their drive to ensure a balance between a prosperous mortal herd and a strong Masquerade that separates them from the flawed attempts of other Clans to usurp their positions."
 ventrue_ruling_wisely_objective_decision_custom_2: "You must not have any Blood Tax, Force Conscription or Open Rule in your domain."
 ventrue_ruling_wisely_objective_decision_custom: "One of your provinces must have a duchy building upgraded to the Prince of a Large Regional City level or above and 6 fully upgraded buildings of the Ashen or Influence lines, except the Rabble and Thugs one."
 ventrue_ruling_wisely_objective_decision_confirm: "A good shepherd."
 ventrue_ruling_wisely_objective_effect_tt: "Unlocks a set of five expensive but powerful "Patronized" buildings for every clan Ventrue ruler."
 
 pod1230objectives.302.desc: "Throughout history, Ventrue have been the shadowy masters of the most prosperous cities of the world. Enoch, Rome, Paris, Cairo and many others have been fostered by the Clan's unique brand of Masquerade consolidation and the art of patronizing a slow but steady growth of civilization.\nWhile some criticize this system of governance as a calcified monolith, Ventrue rightfully point to the cities they didn't control. Carthage, with its open rule experiment, ended up as hell on Earth. Constantinople, with its rule of the trinity and blending with mortals, ended up burned and destroyed.\n\nVentrue's rule might not be perfect, but more and more are forced to admit that they bring safety and prosperity as rulers more often than the other Clans."
 pod1230objectives.302.a: "Slowly but surely, they understand."
 
 brujah_seneca_objective_decision: "Seneca's Truth"
 brujah_seneca_objective_decision_desc: "Unjust dominion cannot be eternal. Cainites often mock Seneca's words from their ashen thrones, it is time to show them just how right he was. We will tear down this eternal society. What will happen after the ashes are cold? That's the thing with freedom, unlimited possibilities..."
 brujah_seneca_objective_decision_custom: "No member of the Ventrue, Toreador, Tzimisce, Lasombra and Cappadocian Clans can have an empire or above tier title."
 brujah_seneca_objective_decision_custom_1: "You must have slain one of the fourth generation of the following High Clans: Ventrue, Toreador, Tzimisce, Lasombra and Cappadocian"
 brujah_seneca_objective_decision_effect: "#warning As Cainite society crumbles, the Masquerade falters and the Church takes notice... A reckoning will come for the Children of Caine, earlier than most expected.#! \nThe authority of the High Clans is broken, more vampires will join the Anarch cause when the revolt happens."
 brujah_seneca_objective_decision_confirm: "For once, a Roman was right about something."
 brujah_seneca_objective_decision_tooltip: "Proving a Roman right... feels so wrong."
 1420_current_date_tt: "This objective can only be done before 1420"
 
 pod1230objectives.303.desc: "They called your kind agitators, ruck, bandits, a far cry from the "enlightened" Brujah pondering their next failed attempt at an utopia from their marbled halls. Well, they can now do so from the ashes of the old world.\n\nTyrants will never relinquish their power willingly, especially immortals tyrants. If another system was to be attempted, like Carthage was, they would crush it before it could spread and threaten their thrones. That is something only your kind understood and thus, you acted.\n\nWhat will emerge from the vacuum of power you created? You don't know, perhaps you even don't care. One thing is for sure however, if younger tyrants try to take advantage of the chaos, you will be reminding them how you made the older ones fell."
 pod1230objectives.303.a: "I paved the way for heaven or hell."
 
 pod1230objectives.304.a: "Our dominion ended"
 
 brujah_rebuild_carthage_objective_decision: "The Idea of Carthage"
 brujah_rebuild_carthage_objective_decision_desc: "Carthage was more than a city, it was an idea, an experiment, an utopia made real. To truly bring it back to life it will take more than a single change. Rome was not built in a day and neither was her superior."
 brujah_rebuild_carthage_objective_decision_requirement: "You must employ a Brujah Warmaster with excellent aptitude."
 brujah_rebuild_carthage_objective_decision_requirement_02: "Ensure Artemis Orthia, the Ventrue who lead the charge against Ancient Carthage, is gone for good."
 brujah_rebuild_carthage_objective_decision_confirm: "Stairway to a better world."
 brujah_rebuild_carthage_objective_decision_tooltip: "The city is one thing, what it represents is another."
 brujah_rebuild_carthage_objective_decision_effect_tt: "You, your courtiers and your counties will convert to Carthaginian. This culture will also progress several eras forward, gain a new tradition and free innovations."
 carthaginian_opinion: "Carthaginian Opinion"
 carthage_wonders_needed_tt: "You need one of Carthage's wonders fully built. Those are the Hamilcar Palaestra  and Spring of Yzebel in Iberia and the ruins of Carthage in Tunis."
 
 pod1230objectives.305.desc: "For some, Carthage was a peaceful utopia in which humans and vampires lived as equals. We weren't predators or parasites, but rather enjoyed the blood of our human brethren consensually. We ruled our city together, sharing the power and privilege without regard to who was a vampire and who wasn't.\n\nFor others, Carthage was a benevolent vampire dictatorship. We took care of our human brothers and sisters, ruling over them benevolently and only taking the blood we needed to survive. Our immortality meant that we could exist among them openly as a privileged, trusted elite.\n\nThere are darker versions of the story as well. We're vampires after all, and the humans are a mere herd. In this vision of Carthage, the city was a utopia for us, a metropolis with a captive, controlled population which understood its place. This Carthage was a place of enlightenment and peace, as long as you were one of us.\n\nSo which of these is true? Usually what you believe depends on what kind of a world you want to build.\n\nYou choose the Carthage that works for you."
 pod1230objectives.305.a: "The idea will never die."
 join_era_global: "Joins a new Cultural Era"
 
 brujah_personal_perfection_objective_decision: "The Olympic Ideal"
 brujah_personal_perfection_objective_decision_desc: "To be a Brujah is to always strive to improve yourself, always seek perfection in both the martial and scholarly subjects, to be a warrior-monk, a philosopher king. Only the greatest of Brujah can achieve mastery in both subjects, but they are paragons the entire clan admires."
 brujah_personal_perfection_objective_decision_effect: "You will choose between gaining Blademaster or Mystic (or 25 xp in those traits if you have them already)."
 brujah_personal_perfection_objective_decision_confirm: "Seeking Perfection"
 brujah_personal_perfection_objective_decision_tooltip: "It is a wonderful thing to know tomorrow you will be better than you were yesterday."
 
 pod1230objectives.306.desc: "The personal goal of every Brujah, traditionally speaking, is the perfection of mind and body. What constitutes perfection has been an hotly debated subject since the days of Plato and Aristotle however. The Panegyra, the Nemesine hunt, the Barathron... all of these events have been scrupulously maintained since the nights of Ancient Greece and serve as a constant objective for the Brujah to improve themselves for.\n\nA perfect physique is only as much meat without a strong mind to guide it. Clan Brujah answers to the philosophy of Heracleitus of Ephesus: fire. The agent of change in the natural world should be what every Brujah mind strives to become. Someone who thinks for themselves, learns and grows everynight, challenging the belief that vampires are static creatures.\n\nFew are those that have mastered these two pillars of Brujah culture but they serve as exemplars and cultural leaders of the Learned Clan."
 pod1230objectives.306.a: "I have been thinking of developing some new moves lately..."
 pod1230objectives.306.b: "Change always brings new learning opportunities."
 
 assamite_justice_objective_decision: "The Laws of Haqim"
 assamite_justice_objective_decision_desc: "We are united behind the will of the Eldest, all following the same path, at least on the surface. There is still much work to be done to ensure Haqim's laws are followed by every member of our clan, never mind every Cainite."
 assamite_justice_objective_decision_confirm: "The Judges enter."
 assamite_justice_objective_decision_requirement: "You must have killed 15 vampires that have a sinful trait for your faith."
 assamite_justice_objective_decision_requirement_2: "You must not have any criminal vassals with a valid reason for you to execute them."
 assamite_justice_objective_decision_tooltip: "The United House looks outwards."
 assamite_justice_objective_decision_requirement_02: "Every de jure county of Alamut must share your faith."
 assamite_justice_objective_decision_requirement_03: "The Assamite Struggle must have ended"
 
 pod1230objectives.307.desc: "The showpiece of Alamut’s libraries are Haqim’s oldest teachings, ancient writings on clay tablets maintained by the vizier caste. Though Haqim never formalized them as such, the viziers assigned to teach young Assamites have a tendency to present them as scripture.\n\n 'Honor the Eldest among you, for he is to rule my House when I am absent' This is where your authority draws from but also a remainder that you are just Haqim's Regent.\n\n 'Deceive not those of the Blood, for my House is founded on Truth' A difficult law to follow in a world as cutthroat as the vampires' one. Still, this is something you have tried to make sure your tenure as Eldest improves.\n\n 'Judge those of Khayyin’s brood and punish them should they be found wanting' By far the most contentious law. How to judge other vampires has been a matter that has created schisms and factions in Alamut since the night Haqim left. In your case however, you have your own answer and with your political control over Alamut, your Clan follows."
 pod1230objectives.307.a: "Our duty starts anew."
 artifact_monthly_prestige_8_modifier: "Monthly Prestige"
 artifact_monthly_tyranny_5_modifier: "Tyranny loss multiplier"
 add_artifact_modifier: "Monthly piety gain multiplier per legitimacy level"
 
 assamite_caste_vizier_objective_decision: "The Vizier"
 assamite_caste_vizier_objective_decision_desc: "Every Caste has its own ideals and goals it strives towards. For the viziers it is promoting good rulership, unity among the clan and following the rules set by Haqim."
 assamite_caste_vizier_objective_decision_confirm: "They chose well."
 assamite_caste_vizier_objective_decision_tooltip: "Trying to keep the clan together is harder than herding cats, but it must be done."
 assamite_caste_vizier_objective_effect_tt: "If the Wandering Nobles DLC isn't active, you will receive a lump sum of gold to compensate for the less powerful modifier."
 
 pod1230objectives.308.desc: "The leader of the viziers is, well, the Vizier. The fact that the same name is used for both the caste and its leader is sometimes confusing for outsiders, but the viziers themselves are pretty good at context and always seem to know who they’re talking about. Unlike the Caliph, a democratic vote decides the position of Vizier, after a period of intense politicking and influence peddling. Once elected, the Vizier serves for a term of 63 years, unless he is removed prematurely through whatever means.\n\nViziers usually oversee the Assamite’s political or financial interests, but may also serve as researchers, diplomats, historians, or even artists.\nSuch tasks will now fall into your purview as you have been chosen among your peers for the next term as the Vizier. Your exemplary qualities will no doubt mark a golden age for your caste."
 pod1230objectives.308.a: "I love democracy."
 
 assamite_caste_sorcerer_objective_decision: "The Amr"
 assamite_caste_sorcerer_objective_decision_desc: "Since Ur-Shulgi, the Banu Haqim have known there is more to vitae than can be discovered through the disciplines, secrets it can reveal, weapons it can turn into if one only knows how to wield it. The sorcerers follow the Black Shepherd's lead in this, trying to discover everything that the blood of vampirism can be turned to."
 assamite_caste_sorcerer_objective_decision_confirm: "A prize and a weapon."
 assamite_caste_sorcerer_objective_decision_requirement: "You must have learned 3 different Blood Sorcery traditions"
 assamite_caste_sorcerer_objective_decision_tooltip: "Blood, Djinns and Spirits, at my command."
 learning_remaining_blood_sorcery_tt: "You will gain access to the remaining Blood Sorcery traditions available to your character."
 
 pod1230objectives.309.desc: "The Sorcerers, or Sorcerer Caste, are the smallest caste within the Banu Haqim, but the second most recognizable. They claim to have practiced blood sorcery since the times of the Second City, and to have been created to counter the dark magic employed by the Baali. Ur-Shulgi was their founder, he himself being the most powerful Blood Sorcerer that ever existed, probably even while counting the Antediluvians.\n\nThe Black Shepherd has been inactive for a while though and it is his childe, Al-Ashrad, that has been the leader of the caste (known as the Amr) since then. He has defined what beng a Banu Haqim Sorcerer means more thoroughly than any others and it is why the caste prides itself in his unique mix of blood sorcery, ritual crafting and lust for knowledge.\n\nYour efforts have brought the Sorcerers caste to new height of prestige and wisdom, making sure the depths of Alamut are truly the pinnacle of blood sorcery, no matter what petty usurpers might think."
 pod1230objectives.309.a: "Now back to my experiments."
 
 assamite_caste_warrior_objective_decision: "The Caliph"
 assamite_caste_warrior_objective_decision_desc: "Haqim charged us with the duty to be the sword of justice among vampires, but that sword needs a strong arm to guide it, for many do not accept the decisions of the judge."
 assamite_caste_warrior_objective_decision_confirm: "Killing as art and duty both."
 assamite_caste_warrior_objective_decision_tooltip: "The Sword of Haqim unsheathed"
 any_killed_character_count: "Any killed character"
 
 pod1230objectives.310.desc: "The warrior caste represents a majority of our Clan. To many, they are what people picture when they think of "Banu Haqim", a shadowed assassin or merciless warrior swiftly and quietly dispatching their foes.\n\nDespite their humbling setback against the Baali, the Warriors' influence has only grown within the Clan and they are dictating more and more of the policies upheld in Alamut.\n\nThe leader of the warrior caste is the Caliph, usually the oldest and most powerful of the warriors. Personal power is more important to the office of Caliph than age or respect. Any warrior can theoretically challenge a Caliph to a duel of honor for any perceived failure in the performance of his duties. There is the expectation that a Caliph who loses such a duel will submit to ritual diablerie by his opponent, assuming he wasn’t destroyed outright before such diablerie could take place.\n\nWith your place secured as the Caliph, you now have one of the most formidable fighting force of the Cainite world at your disposal."
 pod1230objectives.310.a: "Haqim will not find me wanting"
 
 assamite_caste_objective_decision: "Choosing a Caste"
 assamite_caste_objective_decision_desc: "The clan of Haqim is divided into a series of castes to make better use of our talents. For one reason or another our house has not chosen a caste yet. It might be time for this to change, provided we can agree on the direction."
 assamite_caste_objective_decision_confirm: "A new direction."
 assamite_caste_objective_decision_effect: "We will be able to choose the caste of our house."
 assamite_caste_objective_decision_tooltip: "Haqim created the Caste system. Not being part of it is a stain on our House."
 
 pod1230objectives.311.desc: "Haqim's creation of the caste system was a gradual process. The first childer he sired shared his intellectual pursuits and formed the core of what became the vizier caste.\nThe tribulations in the Second City festered and grew to such an extent that even Haqim’s siblings could finally foresee their great city torn apart by their own hands if they continued their machinations. All of them approached Haqim and requested that he serve as judge to their affairs. They agreed he was the only one capable of objectivity, for he held no stake in the matters of his siblings. Although reluctant to involve himself, Haqim eventually acceded to their wisdom and instructed a portion of his childer to arbitrate the dealings of the other Cainites with strict impartiality. Haqim’s judges — who would one night become the warrior caste — took to their business with zeal and ruthlessly culled Cainite excesses.\nThe sorcerer caste came into being during the Baali wars, when Haqim saw the need to cultivate the powers of Blood Sorcery to handle this new threat.\n\nSince then, every Banu Haqim is part of a caste. More often than not the one of their sire, but exceptions exist."
 pod1230objectives.311.a: "We follow the path of the viziers"
 pod1230objectives.311.b: "We follow the path of the sorcerers"
 pod1230objectives.311.c: "We follow the path of the warriors"
 
 assamite_crusade_objective_decision: "Ending the Crusades"
 assamite_crusade_objective_decision_desc: "The Crusades have seen many Western vampires encroach on our land and getting dangerously close to Alamut. While Eldest Nakurtum ordered to limit our intervention to the minimum, many among the Banu Haqim would like to see just retribution fall on the shoulders of the invaders."
 assamite_crusade_objective_decision_tooltip: "Alamut will be protected."
 assamite_crusade_objective_decision_confirm: "No outside interference."
 assamite_crusade_objective_decision_requirement: "The most involved vampiric crusaders must be either dead or on your side: [GetScriptedCharacterByHistoryID('790121').GetFirstName], [GetScriptedCharacterByHistoryID('505092').GetFirstName], [GetScriptedCharacterByHistoryID('505098').GetFirstName], [GetScriptedCharacterByHistoryID('605101').GetFirstName], [GetScriptedCharacterByHistoryID('790928').GetFirstName], [GetScriptedCharacterByHistoryID('790242').GetFirstName], [GetScriptedCharacterByHistoryID('791266').GetFirstName], and [GetScriptedCharacterByHistoryID('505086').GetFirstName]"
 assamite_crusade_objective_decision_requirement_2: "None of your vassals can be of a [christian_derived_faith|E]." #would be cool if we had a game concept of christian #karde wouldn't it yes 
 assamite_crusade_objective_decision_effect_tt: "Now safe from the crusaders, counties within Jerusalem and Syria get a long lived prosperity modifier."
 
 pod1230objectives.312.desc: "The Arabian entry into Christian lands as far west as Iberia saw the spread of Assamites throughout European lands, but the invasion of Christians into the Levant sparked much ill will and sent shockwaves through the clan. Much of the younger, Islamic warrior caste wanted to help defend Muslim lands. European Cainites and the Banu Haqim often fought on opposite sides throughout the Crusades, leading to the general distrust for the Children of Haqim.\nMore problematic, the presence of Christian sects among the Assamites occasionally resulted in Children of Haqim facing one another in battle. This led to a hands-off decree by the Eldest Nakurtum at the start of the Sixth Crusade. Although the Caliph Jamal did not openly defy her by lending the direct support of the warrior caste to Islamic forces, he has certainly done everything in his power to test the limits of her pronouncement.\n\nWhile direct involvement was thus made difficult, it only emboldened the Children of Haqim to find new ways to secure this important region so close to Alamut. By tracking down the Western vampires the most involved in the Crusades and storming the petty princedoms they established in the Holy Land, they made sure to keep the doorway to their Persian homeland safely in their hands.\n\nThe tales of the merciless and invincible "Saracens" protecting the Levant won't stop spreading any time soon."
 pod1230objectives.312.a: "Let them fear us."
 
 setite_ending_hawk_objective_decision: "The Serpent's Bite"
 setite_ending_hawk_objective_decision_desc: "We are beset by foes both new and old, our mission and our god under threat. Set watches us and He will not find us wanting. All of His foes must fall by our hand for us to spread His word. From the hated daughter to the damned Baali, it seems as if every corner hides another unbeliever to fight."
 setite_ending_hawk_objective_decision_confirm: "A triumph long in the making."
 setite_ending_hawk_objective_decision_tooltip: "We will rise above these threats and suffer not their continued existence."
 setite_ending_hawk_decision_requirement: "No vassal of yours can be members of the $glossary_osirian_league$."
 setite_ending_hawk_objective_decision_requirement_01: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] is dead"
 setite_ending_hawk_objective_decision_requirement_02: "[GetScriptedCharacterByHistoryID('790567').GetFirstName], [GetScriptedCharacterByHistoryID('790146').GetFirstName], [GetScriptedCharacterByHistoryID('505095').GetFirstName] and [GetScriptedCharacterByHistoryID('790194').GetFirstName] must be dead or in torpor."

 pod1230objectives.313.desc: "Set has the dubious honor of having the most numerous (and stubborn) enemies for any Antediluvian. In a way, it makes sense, as greatness attracts great foes but it didn't make the life of your clan any easier for it.\nStill, in the end, the Setites always win. Even the Osirian League, this abominable alliance between shapeshifting monsters, Mummies and traitors vampires now lie forgotten in the sands of Egypt.\nThe infamous daughter of our founder, Kemintiri, who dared rebel against despite His magnanimity and generosity is no longer hounding our every step. Her broken mind has been carefully "healed" by the most skilled priests of Set to finally understand the misguided path she took. Set is merciful however, and we are happy to welcome our wayward sister back into the fold.\nOther threats, from the encroaching Ravnos to the foolish Baali have also been dealt with. Even the one who dared raised an hand against Set, Nefer-meri-Isis, has learned the cost of this improper action.\n\nEgypt has always been the home of your Clan and this is more true than it ever was.  Is there any need of more proof of Set's divine guidance?"
 pod1230objectives.313.a: "In the end, the Snake always triumph."
 
 setite_decadance_objective_decision: "Heart of Darkness"
 setite_decadance_objective_decision_desc: "Set's teachings explain Ra's plan for the world, enslaving humanity in a web of senseless obedience. By stoking people's passions, you will awaken them to their inner divinity... and if they are grateful to you for it, all the better."
 setite_decadance_objective_decision_confirm: "Step into my parlor."
 setite_decadance_objective_decision_tooltip: "Spreading freedom of a kind."
 setite_decadance_objective_decision_requirement_06: "One of your friends holds a Kingdom or higher level title."
 setite_decadance_objective_decision_requirement_05: "One of your lovers holds a Kingdom or higher level title."
 setite_decadance_objective_decision_requirement_03: "You do not have a Soulmate to distract you from your duty."
 setite_decadance_objective_decision_requirement_02: "You have 15 lovers who share your faith."
 setite_decadance_objective_decision_requirement_01: "You have 10 friends who share your faith."
 setite_decadance_objective_decision_effect_tt: "Every one of your friends and lovers will be given increased stats. You will also get a strong hook on them."
 
 pod1230objectives.314.desc: "A core teaching of Set, the Aeons are the false gods meaning all gods other than Set. In Setite lore, the Aeons take on many other guises but ultimately serve Ra/God, their goal is to enslave humankind, reducing them to a state of senseless obedience. By stoking people's vices, and thus their passions, Followers of Set are opposing the plans of the Aeons and ensuring humankind's liberty.\n\nThis has created the image of the Setite as a purveyor of the forbidden and corrupter of the pure. Said image certainly has some merits to it but few understand the religious symbolism behind it. A Setite helping a "friend" indulge in the taboo is simply bringing one soul closer to freedom.\n\nEven the most devoted Setite however knows that freedom is a fragile thing and thus they take great care to stay close to their new converts. Only when they are finally completely dependent on the Setite for their mortal compass that their liberation from the Aeons' web can be fully acknowledged."
 pod1230objectives.314.a: "A slave to Set is a survivor from Ra."
 
 setite_beybars_objective_decision: "Proclamation of Red Tears"
 setite_beybars_objective_decision_desc: "Baybars is an impressive mortal to be sure and his reign is putting us more on the backfoot than many of our supernatural foes. Still, he is just a mortal. There will be a time to put him behind us and rebuild our hold over our homeland."
 setite_beybars_objective_decision_confirm: "He will soon be forgotten."
 setite_beybars_objective_decision_tooltip: "The mortals pass on, we stay."
 setite_beybars_objective_decision_effect_tt: "Your courtiers and your counties within Egypt will convert to Ancient Egyptian. This culture will also progress several eras forward, gain a new tradition and free innovations. Counties within Egypt will also get a positive prosperity modifier."
 setite_beybars_objective_decision_prerequisite_tt: "Baybars is imprisoned or has become a vampire"
 setite_beybars_objective_decision_prerequisite_tt2: "The Temple of Ombos in Qus and the Fire Court in Bahriya must be fully built. Your realm must also have 10 or more Founding Temples."
 
 pod1230objectives.315.desc: "Still to this night, the truth about Baybars' blazing purge eludes you. How could a simple mortal knew so much about your kind? From your weakness to your hidden temples, very few things were safe from the Mamluk. Clearly, he had outside help, most likely from the servants of Ra but for one so young to threaten your enlightened clan more than the dozens of supernatural factions that tried to destroy you for centuries... puzzling indeed.\n\nIn any case, a mortal is still just a mortal and the threat is now behind you. The Setites are now coming back from their exile and recovering their hold over Egypt. Temples are being rebuild, webs of influence recreated and the opportunist foes that crawled over the region dealt with.\n\nIn the end, the Snake always win... even if sometimes by sheer patience."
 pod1230objectives.315.a: "Egypt endures. So do we."
 
 nosferatu_dispossessed_objective_decision: "Gathering the Low Clans"
 nosferatu_dispossessed_objective_decision_desc: "The Nosferatu are hunted. Hiding can only get you so far, there are others that could help us, those that gather that from the lofty princes."
 nosferatu_dispossessed_objective_decision_confirm: "In unity, strength."
 nosferatu_dispossessed_objective_decision_tooltip: "Friends in Low Places."
 #nosferatu_dispossessed_objective_decision_effect: "If your capital doesn't have a special building already it will gain one."
 nosferatu_dispossessed_objective_decision_requirement: "Every Low Clan in your realm that can be represented must be represented by a Primogen that supports you (75+ Opinion). Those are the Banu Haqim, Salubri, Tremere, Malkavian, Nosferatu and Gangrel."
 
 pod1230objectives.316.desc: "Nosferatu might not be liked by everyone but only the fools don't answer when they call. This reputation for usefulness and honorable conduct has allowed you to gather skilled members of the Low Clans to your entourage.\nMany of them don't really know why they are here but, be it by favors or blackmail, they are willing to listen. This is all you need for, at the end of the day, you aren't here to tell them the truth.\n\nThe truth would make them flee in horror."
 pod1230objectives.316.a: "Welcome, honored guests."
 
 nosferatu_shadows_objective_decision: "A Strong Shield"
 nosferatu_shadows_objective_decision_desc: "Our Clan is hunted down. We need powerful friends and strong realms to act as a cover to us. And we need those strong friends to be indebted enough to us to actually help when the time comes."
 nosferatu_shadows_objective_decision_requirement: "You must be a friend, best friend, or soulmate of your liege or have a strong hook on them."
 nosferatu_shadows_objective_decision_confirm: "Protected for now."
 nosferatu_shadows_objective_decision_tooltip: "We need to be useful, hidden and look harmless. Only then can we hide from the Founder."
 
 pod1230objectives.332.desc: "Nosferatu, more than any other Clans, are everywhere and nowhere. While the High Clans lead the night, there is always at least one member of your Clan in their city, offering useful knowledge or their influence on the pariah parts of mortal society.\nAs power was never an end for the "Clan of the Hidden", you appear harmless or better yet, useful, to those in power. This facade isn't exactly wrong. What your Clan seeks is to be too useful to not be defended, too harmless to not be trusted. The real war doesn't happen in the courts for your kind but in the warrens and sewers where your mad Founder's progeny hunts you down.\n\nEvery powerful Prince indebted to your kind is another Nosferatu potentially saved from the horrors in the night."
 pod1230objectives.332.a: "Keep the crown, I shall take the power"
 
 nosferatu_nicktuku_objective_decision: "Challenging the Nicktuku"
 nosferatu_nicktuku_objective_decision_desc: "Your clan has long feared the shadows and the shapes they hide, your founder's vengeful wrath, the monsters that call themselves Nicktuku. Every Nosferatu knows and fears them rightfully, jumping at any shadow they think hides their hunters.\nYou will show your clan, make a stand against the Nicktuku and challenge them to strike you down if they are so powerful.\n\n#warning There is a strong risk of death if you go forth with it and the requirements are the bare minimum necessary to succeed the events that will happen. You have been warned.#!"
 nosferatu_nicktuku_objective_decision_effect: "If you succeed the Nicktuku's attacks will stop and your Clan will gain a dynasty modifier."
 nosferatu_nicktuku_objective_decision_requirement: "You must have already faced one of the Nicktuku in combat and lived. Their attacks happen randomly through events."
 nosferatu_nicktuku_objective_decision_tooltip: "Making a stand is our only hope."
 nosferatu_nicktuku_objective_decision_confirm: "Resist and bite."
 nosferatu_nicktuku_objective_decision_ante_hunt: "#warning This decision feeds into a climatic event in 1451. The better outcome can only be achieved if this objective is achieved before that date.#!"
 
 pod1230objectives.317.desc: "In the underground tunnels of the Clan of the Hidden, there are whispered legends and cautionary tales shared among the Sewer Rats. Sires warn their childer of dangers lurking in the darkest corners of night, and of monstrosities that would chill the vitae of even the most hideous of horrors.\n\nNicktuku.\n\nThat single word is enough to spread like wildfire throughout the ranks of the Nosferatu rumor mill, sending neonates and elders alike scuttling back to their warrens in paranoid dread. They are believed to be the vengeful offspring of the clan progenitor—a vindictive and cannibalistic bloodline whose thirst can only be sated by the blood of the Antediluvian's lesser childer.\n\nWhile they is no direct way to contact and challenge one, just talking openly about your will to defeat them is enough to warrant their attention. The fear they have woven in the very heart of Clan Nosferatu is their strongest weapon and you are threatening it.\n\nIt is time to fight for your beliefs, your life and more importantly your Clan."
 pod1230objectives.317.a: "Let them come. I am ready."
 
 pod1230objectives.318.t: "No Answer"
 pod1230objectives.318.desc: "The sun is starting to rise over the horizon as you return to your haven, having spent another night holding court in the open, making sure all could see you still alive, still standing. It is a tiring charade, one you must put up with until the Nicktuku respond to your challenge. And if they never do your mind wonders? Will you have to do that song and dance for eternity?\n\nAs you ask yourself this question you notice a small child, leaving their parents house early to go play with their friends. On a whim you decide to follow them for a time. They duck into alleyways and cross through fields seemingly at random as you follow them without trouble. The moment they step into the forest however their head snaps to you, looking you straight in the eyes as you stare at a spider's pupils. All around you spiders and animals start rushing towards you, leaving you only moments to react and use your mastery of Animalism to sway a few of them to your side before joining the battle."
 pod1230objectives.318.a: "To me my servants!"
 pod1230objectives.318.effect.success.desc: "You manage to push back the onslaught."
 pod1230objectives.318.effect.failure.desc: "Another triumph for the Nicktuku."
 
 pod1230objectives.319.t: "Hunter or Hunted?"
 pod1230objectives.319.desc: "By the time you manage to push back the spiders the child is gone, hidden in the forest it lured you to. There is no time to wonder how it managed to slip past your mental defenses and bring you here. If it gets the drop on you again your chances of survival are slim.\n\nYou use your mastery of obfuscate and hide in the trees just like it did, neither of you being able to spot the other but neither being able to run away either. The clock is ticking however, as the night giving way to the morning would doom both of you.\n\nSo the two of you hide and hunt, using every hint of sound and movement to try and find the other, two shadows dancing in beneath the trees.\n\nEvery dance has its end eventually and you hear the sound of a branch snapping underfoot close to where you stand. Without hesitation you hurl yourself there, using every sense to try and catch this ghost before it vanishes again."
 pod1230objectives.319.a: "I see you!"
 pod1230objectives.319.effect.success.desc: "This hunt is over!"
 pod1230objectives.319.effect.failure.desc: " 'Father sends his regards' "
 
 pod1230objectives.320.t: "The Arbiter"
 pod1230objectives.320.desc: "Even caught off guard by you seeing through its web of lies the spider adapts quickly, throwing itself in the fight against you. Fangs and claws clash against fangs and claws, ripping apart each others limbs, too lost in the throes of the Beast to care.\n\nTo the untrained eye, this duel could seem to be a close one but sadly you know better, no matter how hard you try you cannot punch past their guard, every blow glancing off while a single claw from them sends you flying away, crashing through the trees and opening up deadly holes in the forest's treeline.\n\nThe ancient foe of your Clan doesn't give you a moment of reprieve however and with only seconds to spare you put a plan into motion, dangerous beyond measure but perhaps your last hope.\n\nNo matter how strong it is, if it descends from Caine then it must fear the sun. The greatest foe of your kind might be your best ally as it starts to rise on the horizon, unbeknownst to your very focused opponent."
 pod1230objectives.320.a: "The primordial curse might save me..."
 pod1230objectives.320.effect.success.desc: "You avoid the sun deadly rays. They don't."
 pod1230objectives.320.effect.failure.desc: "They avoid the sun deadly rays. You don't."
 
 pod1230objectives.321.t: "Hunted"
 pod1230objectives.321.desc: "It has been a year since your fight in the forest with the Nicktuku, and with your victory most of your Clan has rallied behind you, remembering that these creatures are strong but not invincible.\nWhile some still cower in the shadows in fear of the boogeymen, this victory proved that all of you can fight to prove your place in this world.\n\nWhile your Clan finds a renewed sense of hope, it has been a more difficult year for you. Every night it feels like there is something there, in the shadows, watching you, feeling like a knife inches away from your back. It is maddening, the endless paranoia that constantly grows and grows with no sign of stopping.\n\nSome nights you feel like stepping into the sun if only to stop the constant whispers from the shadows you can barely hear. But it is no great mystery why you suffer so. You don't have to see the eyes or movement from the darkness, you know what is causing it.\n\nYou know who is causing it.\n\nYou might be weaker, you might be killed tonight.\n\nBut you won't beg."
 pod1230objectives.321.a: "Hello Founder"
 
 gangrel_animal_ruler_objective_decision: "Masters of Animalism"
 gangrel_animal_ruler_objective_decision_desc: "Clan Gangrel are masters of Animalism, a discipline often looked down upon but full of powerful uses for the clever Cainite. Be it the cities' rats or the forests' wolves, a Gangrel is never far from a potential source of information, battle prowess or sustenance."
 gangrel_animal_ruler_objective_decision_confirm: "Ennoia's gift."
 gangrel_animal_ruler_objective_decision_tooltip: "Utilizing our powers to their full potential."
 gangrel_animal_ruler_objective_decision_requirement_01: "You must have at least 10 Men-At-Arms regiments of animals."
 #gangrel_animal_ruler_objective_decision_requirement_02: "None of your Men-At-Arms regiments can be anything other than animals"
 
 pod1230objectives.322.desc: "Other blood-drinkers often view Gangrel as nothing more than the beasts they appear to be, and in truth the Animals do little to counter that impression. Their reputation serves them well. Beasts are fearsome and mysterious; who would be foolish enough to question their ways? Most hardly care what the soft, puling Cainites think of them in any case.\n\nWhile there is much more to the Gangrel than this crude misconception, this facade is fueled by the Clan's mastery of Animalism. Considered a base and lowly discipline by the lofty High Clans, Animalism is in truth a powerful asset. While the Gangrel aren't the only ones to master it, their wide range of experience, from the urban Greek Gangrel to the savage Road the Beast ones, allowed them to make use of it on a range of animals unsurpassed by any others.\n\nAs the Clan also cherishes their "Gather", every new use or evolution of Animalism are quickly spread throughout their numbers. The High Clans ignore everything of this tactical advantage and some of the Gangrel's most stunning victories, from Matasuntha's campaign against Rome to Arnulf's ride with the Mongols, can be attributed at least in part to this edge."
 pod1230objectives.322.a: "I have a thousand eyes and a thousand teeth."
 
 gangrel_darkages_objective_decision: "The True Dark Ages"
 gangrel_darkages_objective_decision_desc: "Most Gangrel aren't entirely opposed to civilization. After all, the wilds are the home of the ferocious Lupines and those aren't to be trifled with. Still, the unchecked growth of humanity has always been a concern.\nRome's fall was a solid first blow, but more has to be done to ensure that the Gangrel aren't swept away by the so called "urban" Cainites."
 gangrel_darkages_objective_decision_confirm: "My tribe, my herd."
 gangrel_darkages_objective_decision_tooltip: "Matasuntha and Arnulf shown us the way. It is time for another curtailing of the cities."
 gangrel_darkages_decision_requirement: "None of your vassals can be part of the Three Pillars faiths, represented by a doctrine. Those are most notably the Road of Heaven, Kings and Humanity."
 gangrel_darkages_objective_decision_effect: "You will forge a symbol to make sure the other Kindred never forget what you are capable of"
 
 pod1230objectives.323.desc: "The tale runs like this: In the year AD 400, Matasuntha the Hun called a Grand Gather and put down all challengers, thus gaining mastery of the entire clan. Then she led them on a massive revel across Europe, slaughtering and hunting, openly flaunting her monstrous nature, terrorizing the dying Empire with her tigress ferocity. Then just as suddenly as she had appeared, she disappeared. Her forces scattered to the winds.\n\nPretty short tale right? Well it had an outsized influence on how Clan Gangrel is seen from the outside and even how it sees itself. While we are much closer to the Beast than most of our "urban" cousins, we can't realistically live in the wilds as it is home to the werewolves. However, many among us understand that sprawling civilizations will be our downfall. We aren't a very political Clan, subtle machinations aren't our thing. A simple life, mortals content in their small tribal villages, the so called "High Clans" put in their place is all we need.\n\nAnd thus, like Matasuntha did before, we fight to get it."
 pod1230objectives.323.a: "We forged this age once, we can do it again."
 
 gangrel_city_objective_decision: "The Grey Hunters"
 gangrel_city_objective_decision_desc: "Charisse de Grey, the greatest hunter of the courts who has yet lived, created what we call the Path of the Grey Hunter. These "city hunters" found an attentive ear in the Gangrel living among the cities. Thus, the Grey Hunters and the Greek Gangrel work together to bring an alternative to the feral Gangrel way of life."
 gangrel_city_objective_decision_confirm: "We hunt in dark streets and alleyways"
 gangrel_city_objective_decision_tooltip: "Perhaps the most judicious path is not to rage against the coming of the light but rather simply hide in the shadow beneath the candle of civilization."
 #gangrel_city_objective_decision_effect: "You will embrace these new disciplines of the city gangrel"
 
 pod1230objectives.324.desc: "It is not always easy for a Feral to thrive in a court, but Charisse de Grey showed us how. She was a creature of studied elegance and enormous grace. The key to our survival is to realize that, while the courts offer pleasures unavailable elsewhere, they are not necessary. That is, we must never lose sight of the basic needs of the Beast: the hunt, the kill, the trust in instinct.\n\nI believe these insights give us a crucial advantage dealing with other “tamed” Cainites. They hide behind their codes of conduct, their laws of God or their beliefs in their own essential goodness or wickedness while we press our claims forward, unencumbered by such pretenses. We strive to divide our fellows in court, as Charisse did, into two categories: prey and rivals.\n\nPrey is to be mercilessly hunted until they are brought down and offer up to us whatever we want from it, be it blood or favors or something else entirely.\nRivals are to be warily circled and stalked. We take it as fundamental to our continued existence never to turn our backs on a rival and never to show mercy or respite.\n\nWe are still hunters after all."
 pod1230objectives.324.a: "The "Grey Court" assembles."
 
 ravnos_travel_objective_decision: "Home on the Road"
 ravnos_travel_objective_decision_desc: "The Rroma have many enemies that have forced them to be on the move for a long time. Durga Syn's protection has allowed them to take roots in Russia but this legacy remains. No one knows the road like a Rroma Ravnos."
 ravnos_travel_objective_decision_confirm: "To see what the world offers."
 ravnos_travel_objective_decision_tooltip: "Legacy of the road"
 ravnos_travel_objective_decision_requirement: "You must have 2 friends that share neither your faith nor your culture."
 
 pod1230objectives.325.desc: "The Rroma Ravnos have suffered because of the curse laid upon our blood. If something bad happens while we are in the area, inevitably someone blames us. Everywhere we go, we garner suspicion and mistrust.\nTo the Clan’s credit, we did not allow our mortal companions to suffer for the sins of vampires among them — we remembered the lessons we learned in ancient India, and the bloodshed we inadvertently caused. No. When we traveled with the mortal Rroma, the Ravnos generally treated the kumpaniyas with respect, giving them as much protection as possible.\nThose who failed to be a good guest, who treated the mortals as ripe, portable herds to be feasted upon and forgotten, were quickly taught painful lessons. It did not happen often, I assure you.\n\nThis coexistence made the Rroma Ravnos a rare faction of vampires capable of thriving while staying on the move. The contacts we make in the cities we visit remember us and favors can easily be exchanged. While the Nosferatu are unmatched if you want to find something or someone in your own city, we are operating on a much more global scale. Use and protect this edge, as it could very well be our Clan's lifeline in the future."
 pod1230objectives.325.a: "A friend in every town."
 
 ravnos_hazimel_objective_decision: "The Eye Opens"
 ravnos_hazimel_objective_decision_desc: "A devil or a savior, a traitor or a last resort, many things are said about Hazimel. Few are true. Finding him and restoring his psyche could be the keys to the answer Clan Ravnos seeks, whether they like those or not."
 ravnos_hazimel_objective_decision_confirm: "And so it begins."
 ravnos_hazimel_objective_decision_tooltip: "Planting the Eye"
 ravnos_hazimel_objective_decision_effect: "You will lose the Eye of Hazimel and the modifiers it gave but gain a new one in the process.\nChandaputra and Kali, if they are still alive, will become your friends and gain improve stats as Hazimel is once again serving as the pillar for the Ravnos family.\nThe Clan as a whole will gain a powerful dynasty modifier."
 ravnos_hazimel_objective_decision_requirement_01: "Hazimel must be your friend, best friend or soulmate and a member of your court."
 
 pod1230objectives.326.desc: "The Eye is nearly vibrating as I hold it, the clay and ash seal binding it beginning to crack and flake away of its own accord. I’m folding my hands around it to keep from dropping it as the servant leads me to the door of the sanctum and gestures for me to enter.\n\nThe eye opens and flares forth a burst of unearthly crimson radiance, the earth itself shaking. You are driven to your knees, and outside the cave there’s much consternation amongst those that followed you. The tremors are now dying away and the Eye’s baleful glow fading, the ancient vampire’s hand closing around my wrist, carefully avoiding scratching my skin with his long claws. He’s now helping me to my feet. I cannot tell which of those arms is real and which is not. They all grip me now. He presses his forehead to mine.\n\nA third eye appeared to open, and his mind touched mine. He could see everything of my life, and smiled. I could see everything of his, and began to scream.\n\nHazimel steps around puddles of burning oil from fallen lamps, as everyone around fall to their knees and from there to their faces in full prostration. He keeps one set of arms around me, across my shoulders, back, and waist, and with the other he offers gestures of gratitude and benediction. We walk up the entry corridor still joined at the hip, and from the contact between us I feel him trembling slightly as a breath of fresh air reaches us, cool and smelling of rain. We step out into a rising breeze, clouds racing across the sky and obliterating both moon and stars, thunder rumbling in the distance, and Hazimel turns his face to the sky, his expression a mask of ecstasy and anguish as he is fully whole for the first time in millennia."
 pod1230objectives.326.a: "I saw... everything?"
 #pod1230objectives.326.b: "I see through your lies, Devil!"
 #pod1230objectives.326.effect.success.desc: "You manage to tear his soul out of his body and into your eye"
 #pod1230objectives.326.effect.failure.desc: "He easily takes control over his eye and tears your soul out of your body"
 
 #ravnos_jati_objective_decision: "Uniting the Ravnos Jati" 
 #ravnos_jati_objective_decision_desc: "The Jati of Clan Ravnos have long been divided, scattered around the world since the exodus from India. Many different, often opposing, cultures and mindsets emerged from this isolation. To unite Clan Ravnos back into one cohesive entity would require a truly massive amount of both power and diplomacy."
 #ravnos_jati_objective_decision_confirm: "One Clan, one vision."
 #ravnos_jati_objective_decision_tooltip: "A legendary feat for a legendary reunion."
 #ravnos_jati_objective_decision_effect: "The Ravnos dynasty will be given every improved Ravnos House modifiers."
 #ravnos_jati_objective_decision_requirment_01: "if you are playing this character, the Head of House Roma must be your vassal, hold a kingdom or more and have 50 opinion of you"
 #ravnos_jati_objective_decision_requirment_08: "if you are playing this character, the Head of House Chandraputra must be your vassal, hold a kingdom or more and have 50 opinion of you"
 #ravnos_jati_objective_decision_requirment_02: "if you are playing this character, the Head of House Erk must be your vassal, hold a kingdom or more and have 50 opinion of you"
 #ravnos_jati_objective_decision_requirment_03: "if you are playing this character, the Head of House Bay't Mujrim must be your vassal, hold a kingdom or more and have 50 opinion of you"
 #ravnos_jati_objective_decision_requirment_04: "if you are playing this character, the Head of House Bashirite must be your vassal, hold a kingdom or more and have 50 opinion of you"
 #ravnos_jati_objective_decision_requirment_05: "if you are playing this character, the Head of House Phaedymite must be your vassal, hold a kingdom or more and have 50 opinion of you"
 #ravnos_jati_objective_decision_requirment_06: "if you are playing this character, the Head of House Sybarite must be your vassal, hold a kingdom or more and have 50 opinion of you"
 #ravnos_jati_objective_decision_requirment_07: "if you are playing this character, the Head of House Yoryari must be your vassal, hold a kingdom or more and have 50 opinion of you"
 #
 #pod1230objectives.327.desc: "The Ravnos have been divided since ancient history. Old feuds and the burden of an eternal war have made many leave India and, centuries later, the Jati can barely recognize one another. Some even came to conflict over matters of dogma or clashing ambitions. Uniting those disparate factions wasn't even thought a possibility before now, as the divide, both geographical and cultural, seemed too great. Still, the blood doesn't lie.\n\nWhether they like it or not, every Jati is descended from the same mythical figures of the Karavalanisha Vrana, those who battled the accursed invaders from the east. By acknowledging everyone perspective as a strength instead of a potential for further divide, Clan Ravnos can be reborn as a lineage of heroes ready to take their place in the grand stage of Cainite history."
 #pod1230objectives.327.a: "We learned much from centuries of division."
 
 lasombra_waves_objective_decision: "Blood on the Waves"
 lasombra_waves_objective_decision_desc: "Clan Lasombra has always felt at home at sea. Perhaps the sunless abyss calls to you or perhaps something deeper is at play. No matter, many of your brethren have made their fame and fortune at sea. Why couldn't you as well?"
 lasombra_waves_objective_decision_confirm: "Above the darkest depths."
 lasombra_waves_objective_decision_tooltip: "The sea has called your clan since Lasombra himself. You are no exception."
 lasombra_waves_objective_decision_requirement_01: "[GetTitleByKey('e_ashirra').GetNameNoTier] title must be destroyed"
 lasombra_waves_objective_decision_requirement_02: "[GetTitleByKey('e_sea_of_shadows').GetNameNoTier] title must be destroyed"
 lasombra_waves_objective_decision_requirement_03: "Five of your Men-At-Arms regiments must be Lasombra Corsairs with a size of five or more."
 
 pod1230objectives.328.desc: "As the feuds between Clans continue and the Cainites mark their territory, we Lasombra as always we are drawn to the sea. Trade is brisk and lucrative, and merchant ships sail constantly across the black waters. We raid these timid cargo ships as they ply the waters. Cloaking our own ships in shadow, we come at them during the night.\nFew even know what hit them before it is all over.\n\nThere are no pretenses in these sea battles, we feast and slaughter those who stand against us. Some thought we could grow indolent on the riches we steal, but the wealth is only a bonus.\nA Lasombra is not just about winning or beating (in many definitions of the word) our opponents. We seek to show them and their allies how completely we have conquered them. However, an easy victory is no true victory. We are engaged in a constant challenge to prove worthy of being Lasombra. We must always prove ourselves to those with the only opinion that matters: that of the other Lasombra, and they are not impressed easily.\nTo do that requires radical thinking. Lasombra know how to come at a problem sideways, never as our enemies suspect.\n\nWe also prize subtlety; you need not be a king to rule. Those who exercise control without the trappings of command are truly in power. Anyone with a crown can shout orders and expect obedience; obedience without such ephemera is the mark of a true master."
 pod1230objectives.328.a: "...and the Lasombra are true masters indeed."
 
 lasombra_insecure_objective_decision: "Crowns of Shadow"
 lasombra_insecure_objective_decision_desc: "Lasombra crave power. While said power can take many forms, it is always accompanied by a drive to be challenged. The true Lasombra has won many battles but is already fostering the next generation to fight against."
 lasombra_insecure_objective_decision_confirm: "Where is the next challenge?"
 lasombra_insecure_objective_decision_tooltip: "Only the worthy join the Lasombra. Only the gifted survive it."
 lasombra_insecure_objective_decision_requirment_02: "All of your non Lasombra rivals must be either dead or imprisoned."
 
 pod1230objectives.329.desc: "It’s all about power. You can dress it up any way you like, but that’s always what it comes down to. Learn from this, because if you can’t do better than your forebears can, what is the point of you?\n\nBefore we go any further, I should underline we are not a Clan. We have to use the term on occasion, but it does not suit us. A Clan is a social group, a collection of likeminded or like blooded people with no better reason to hang out together than they seem to share a common interest. Clans are pathetic. We are not “Clan Lasombra.” We are “The Lasombra,” those who have earned the name by proving we have a right to it. You are not chosen to join us; you are given an opportunity to prove you are worthy.\n\nWe take from anyone who crosses our path, but not because we feel we have a right to or because it is just. We take because we can; we need no justification. We are not thugs who take on impulse, however; we choose our targets carefully and with patience. What makes us dangerous is that we plan our strikes. Every move is made with cunning, arranging the pieces silently to suit our purpose. When the strike comes, it comes without mercy, its result a foregone conclusion.\nThat is why they fear us."
 pod1230objectives.329.a: "Only the worthy might challenge the Lasombra."
 
 lasombra_christian_objective_decision: "Tests of Faith"
 lasombra_christian_objective_decision_desc: "Your Clan, thanks to its influence over Rome and the Church of Caine, has always been deeply tied with the Christian Church. With Narses' death and Rome's fall to Camilla, this influence is in serious jeopardy. Something must be done before the Lasombra lose one of the strongest assets."
 lasombra_christian_objective_decision_confirm: "Amen."
 lasombra_christian_objective_decision_tooltip: "Our hold over Rome's clergy is faltering. A situation we must rectify at once."
 lasombra_christian_objective_decision_effect: "You will be able to recruit the Witch-hunters of your faith to fight whatever enemy you point them at."
 
 pod1230objectives.330.desc: "The Lasombra are remarkable among the clans for the sheer number of their ranks who honestly, devotedly believe in the teachings of the Church. The Magisters have a higher proportion of Cainites with True Faith than any other clan, and many of those Lasombra who serve in the Church have not let their unliving state alter their belief.\n\nIt is no surprise that they have been associated with the Christian Church almost since its founding, and many Lasombra are devout Christians of one sort or another. Of course, just as many are cynical manipulators who see the Church as little more than a tool, but the strain of religious fervor, and fanaticism, runs strong in Lasombra blood.\n\nLasombra in Italy cultivate influence within the hierarchy of the Church but do so with great care, since they have rivals within the Ventrue and other clans that also claim churchmen and clergy as allies. More importantly, only a rare few within the Church’s ranks are aware of the existence of the Damned and actively hunt them to purge the Mother Church of their influence. The Lasombra have run afoul of some of these self-proclaimed inquisitors and tread cautiously when dealing with them. Tales of miraculous powers of the faith wielded against younger and more foolish members of the clan are spreading throughout Europe.\n\nA cautious and prudent hand will be needed in the foreseeable future to direct the efforts of the Clan in these matters. There is much to gain by meddling with Rome but perhaps even much more to lose."
 pod1230objectives.330.a: "Rome's heart beats at the Lasombra's tune."
 
 lasombra_muslim_objective_decision: "Veil of Night"
 lasombra_muslim_objective_decision_desc: "Since Suleiman's revelation and his surrender to Allah, the Ashirra movement has been deeply tied to the Lasombra. While he always advocated for letting the mortals tend to their own affairs, non faithful Cainites don't always give them this courtesy. A strong Mullah must lead those who protect the flock from the nightly predators.\nOnly a Lasombra can be such a powerful leader, of course."
 lasombra_muslim_objective_decision_confirm: "Insha'allah"
 lasombra_muslim_objective_decision_tooltip: "Predators on all sides gather around the faithful. Only a Lasombra can lead and defend them."
 
 pod1230objectives.331.desc: "Would it not be better if a Cainite were to be caliph, to keep Muhammad’s memory and teachings alive and unaltered until the end of days? Khalid ibn Sahl’s words made sense to many of the first Ashirra, but Suleiman ibn Abdullah disagreed. The people had chosen Abu Bakr. Clearly it was the will of Allah, and the elder argued that it was their duty to serve the caliphate with all the devotion that they had shown to the Prophet himself.\n\nSuleiman and the vampires of Madina threw themselves wholeheartedly into the task, meeting scholars discreetly in the mosques and imparting firsthand memories of what they had heard from the Prophet. During this period Suleiman impressed upon his brethren that they, as immortals, had a sacred duty as undying receptacles of the Prophet’s teachings. He encouraged them to share their memories with one another as well, keeping the Prophet’s words alive for generations to come. And so it has been for centuries but the heartlands are now in danger.\n\nAs western Cainites hide behind the mortal Crusades to assault our holdings and enslave our flock, we are forced to act. Even if the leadership of Clan Lasombra allied itself with the Christian Reconquista, it doesn't mean that the Ashirra Lasombra must forfeit their duty. Power is nothing without challenges and the Christian are worthy challengers indeed."
 pod1230objectives.331.a: "Power, faith and challenges. A Lasombra's dream."
 
 salubri_revenge_objective_decision: "Those Who Made Us Martyrs"
 salubri_revenge_objective_decision_desc: "Saulot taught us peace but Samiel taught us to defend ourselves. It is too late to save our Clan. It is not too late to doom theirs."
 salubri_revenge_objective_decision_confirm: "Not our beginning, but their end."
 salubri_revenge_objective_decision_tooltip: "The Trembling Ones think they won. They haven't and never will."
 salubri_revenge_objective_decision_requirement: "There must be no independent Tremere rulers of the fourth or fifth generations."
 
 pod1230objectives.333.desc: "For centuries, Saulot’s healers and Samiel’s warriors fought against the evil of the world in their own ways. With the rise of the Baali, the Salubri found an enemy as powerful as themselves. The Assamites and occasionally the Brujah soon joined them in the struggle against the demon-worshipping bloodline. Their triumphs were legendary and might have saved the world. How it could have gone from these heights to tonight's pitiful state is still a mystery.\n\nWhat is accepted is that it started in 1133 with Saulot's death. This traumatic event broke Clan Salubri, if not physically at least mentally. Without Saulot, without Samiel and still reeling from the shock (and the lack of concrete help by other Clans), the Salubri were easy preys for the disciplined Tremere. Many, too many, fell during these dark decades.\n\nWhile your efforts made sure that "clan" Tremere will never be a powerful force in Cainite society, it is a bitter victory. Blood paved the way to your vengeance but the road to get back your Clan's soul will be much longer and more difficult."
 pod1230objectives.333.a: "A last act of defiance." 
 
 salubri_saulot_objective_decision: "Understanding Saulot"
 salubri_saulot_objective_decision_desc: "Antediluvians are all mysterious creatures, more myths then men, but even among them Saulot stands apart as a complicated character. To study him would have one retrace his steps, understand his spiritual journey and hopefully learn from his mistakes."
 salubri_saulot_objective_decision_confirm: "From Enoch to Mt Meru."
 salubri_saulot_objective_decision_tooltip: "A savior or a monster?"
 salubri_saulot_objective_decision_effect: "You will learn a truth about Saulot"
 salubri_saulot_objective_decision_requirement: "Four of the five remaining living witnesses to Saulot's life must be your friend, best friend, soulmate or coterie member to reveal the information they know about him. [GetScriptedCharacterByHistoryID('790382').GetFirstName], [GetScriptedCharacterByHistoryID('791149').GetFirstName], [GetScriptedCharacterByHistoryID('791148').GetFirstName], [GetScriptedCharacterByHistoryID('790405').GetFirstName] and [GetScriptedCharacterByHistoryID('793238').GetFirstName] "
 salubri_saulot_objective_decision_requirement_02: "You must know about the strange state of Golconda, so deeply tied to the founder."
 
 pod1230objectives.334.desc: "The early days of Saulot are mostly agreed upon. A seer in the city of Enoch, beloved by the people but discontent by the state of vampirism he found himself forced into. His first lineage, the Salubri Healers, likely were born from this mindset.\n\nSaulot then departed to the East where he encountered the [Glossary('Arhat','podgloss.arhat')] Xue, perhaps the most famous and respected $pod_kueijin$ of history. If their tales are to be believed, it is there that Saulot learned of Golconda, a misinterpretation of the [Glossary('Hundred Clouds','podgloss.hundredclouds')] born from Saulot's inability to understand Xue's teachings. Frustrated with this failing, he created the Wu Zao ("Salubri Watchers") bloodline who then became known as thieves of knowledge in the East.\n\nReturning to participate in the Baali Wars, Saulot saw his childe Samiel take arms against the infernalists, forming the Salubri Warriors. To this night, some also think Saulot himself created the Baali, though the truth (and the potential reasons) are forever lost to history.\nThe $pod_kueijin$ have an easy explanation to offer however, under his name of Zao-lat, Saulot could have been trying to become the [Glossary('Demon Emperor','podgloss.demonemperor')] as a dark conclusion to his failed apprenticeship under Xue.\n\nWhat of his death at Tremere's fangs? Some think it is part of a very long scheme, perhaps to bring about Gehenna or deal a blow against other Antediluvians. Most agree that he couldn't have been found and killed by Tremere if he didn't want it in one way or another.\n\nPerhaps the most intriguing explanation you found is the possibility that Saulot split into two, perhaps using $pod_kueijin$ techniques to separate himself from his Beast. One Saulot would be the kind healing soul looking for salvation that many still fondly remember, while the other would be the manipulative madman unleashing horror upon horror upon the world.\n\nIn the end, it is your choice what to believe in."
 pod1230objectives.334.a: "A savior..."
 pod1230objectives.334.b: "...or a monster."
 pod1230objectives.334.c: "Maybe neither."
 
 salubri_healer_objective_decision: "The White Lambs"
 salubri_healer_objective_decision_desc: "Remember the words of Saulot: we are the white lamb, the greatest bounty of Caine. It falls to us to safeguard the kine from our kin."
 salubri_healer_objective_decision_confirm: "We never stopped. We cannot stop."
 salubri_healer_objective_decision_tooltip: "Saulot's victory will not come with vengeance but with honoring his principles."
 salubri_healer_objective_decision_effect: "You will get piety, two exemplaries of the Rayzeel's Song artifact and Rayzeel herself will gain improved stats."
 salubri_healer_objective_decision_requirement: "Your capital province must have at least 75 disease resistance"
 salubri_healer_objective_decision_effect_requirement_01: "[GetScriptedCharacterByHistoryID('790382').GetFirstName] must be your friend, best friend, soulmate or coterie member" 
 
 pod1230objectives.335.desc: "Demon-hunters. Arbiters. Soulstealers. Since Enoch, the Healers have shepherded the race of Caine, uplifting those who stumble. Three eyes gaze from their holy faces to match the three bloodlines of the clan. Between the castes — Healer, Warrior, Watcher — the Healers seek to keep humanity hale and vital.\nThey guard the liminality of Cainite and kine, ensuring that Cainites never draw attention from the sleeping giants they prey upon, and that disease and injury may never threaten the blood-darkened throats of vampires.\n\nBeneath their hoods and wimples, Healer Caste Salubri whisper righteousness in the soft-spoken certitude of zealotry. Saulot was Caine’s best-loved grandchilde, say the Noddist tales, so adored and steadfast that he alone remained uncursed by the First. This gives the Salubri great prestige amongst those who pay heed, forming the basis for their mandate to keep outside and above Cainite society and endlessly ensuring vampires and humanity remain symbiotic.\n\nHealers tend to mortal herds and bestial Cainites, salving bodies and souls. They stand silent in the courts, scrutinizing the Roads others walk with a mere glance. Shepherds hold counsel with rabbi, bishop, and imam alike. They preserve the lore of Nod and the promise of Raphael.\n\nThe Dark Ages weren't kind to the Healers. Saulot's death and the Clan's shattering left them hunted down and with precious few allies. Still, in the end, it doesn't really matter. Healers accomplish their duties for without them what darkness would the Damned embrace?"
 pod1230objectives.335.a: "If we ignore Saulot’s desires, are we still Salubri?"
 
 #cappadocian_library_objective_decision: "Gathering Knowledge"
 #cappadocian_library_objective_decision_desc: "There is an immense amount of knowledge already written down by kindred, one that has a tendency to disapear and vanish as the marches on. But if we manage to secure it, perhpas we can find hints on where the Codex can be found, and even if we can't find such hints, the knowledge itself has value."
 #cappadocian_library_objective_decision_confirm: "All the knowledge in the world"
 #cappadocian_library_objective_decision_tooltip: "It will be enourmously difficult to shift through all that knowledge but there must be hints to the codex's location somewhere"
 #cappadocian_library_objective_decision_effect: "The hunt for the sargon codex journeys will be faster \nKnowing where artifacts are hidden will make stealing them much easier"
 #
 #pod1230objectives.336.t: "Knowledge Gathered"
 #pod1230objectives.336.desc: "It is a battlefield, men fight with paper and clay and papyrus, valliantly trying to sort and classify the mind boggling amount of knowledge you have gathered, some even losing their minds as they open books with one of their own. but you persevere you are a general commanding your army and though it might be costly, victory will be yours, you will find what you seek and order this endless pile of knowledge into something you can use. Even if it kills more than a couple courtiers from paper cuts."
 #pod1230objectives.336.a: "To arms librarians!"
 
 cappadocian_army_objective_decision: "Death among the Dead"
 cappadocian_army_objective_decision_desc: "To the outsider's eye, Cappadocians are masters of the dead. The truth is a little more complicated as the souls of the dead always eluded the clan. It was the Giovanni inclusion that allowed them to truly take hold of every facet of the afterlife, something they were quick to try mastering."
 cappadocian_army_objective_decision_tooltip: "Body and soul, dead both."
 cappadocian_army_objective_decision_confirm: "Land of the dead."
 cappadocian_army_objective_decision_requirement_02: "You must have 10 regiments of wraiths of a least 5 size."
 cappadocian_army_objective_decision_requirement: "Your Underwold Ambassador Court Position must be at least of good aptitude"
 need_giovanni_necromancy_tt: "You need access to the Giovanni Necromancy."
 
 pod1230objectives.337.desc: "Cappadocians have long been interested in the necromantic arts as a means to satisfy their thirst for knowledge. Some members of the clan profess having belonged to magical orders during their mortal lives, but claim the Embrace dulls the capacity for wielding these forces (or so it seems). As it stands, no Cappadocians, other than the most ancient, are able to manipulate more than the simplest hexes or most rudimentary forms of shambling corpses.\n\nThe Giovanni’s necromancy, of course, is the outstanding exception to this rule. The Cappadocians argue that the base of this necromantic power stems from the blood of Caine, which runs through all vampires; it is no more “magic” than Mortis or any other Discipline. The Giovanni believe differently, having practiced the Art before their Embrace, but their voice carries little weight and their recent introduction into the clan labels them as naive.\n\nStill, Cappadocius' zeal to embrace the Venetians into his Clan has left many to pause and wonder. And with now many years of (sometimes tense, sometimes fruitful) cooperation behind them, even the most jaded Cappadocian recognizes the impressive potential of the Giovanni brand of necromancy. Their mastery over the souls of the dead and ability to influence the very Underworld is unparalleled.\nWith now the knowledge of an entire death obsessed Clan behind it, it remains to be seen how far this unholy experiment can reach.\n\nThe Giovanni are certainly trying their best to be the first there in any case."
 pod1230objectives.337.a: "Could we merge the two worlds...?"
 
 #cappadocian_wraith_objective_decision: "Touching the Shadowlands"
 #cappadocian_wraith_objective_decision_desc: "The line between Cappadocian and wraith is already a thin one, made ever thinner the more you delve into necromancy and learn more about the nature of death. Both creatures so fundamentally touched and touching death. You clan has spilled much ink over the potential of cappadocians to become wraiths and even perhaps return to vampirehood. So would it truly be so mad to turn theory into practice and take a step over that line?"
 #cappadocian_wraith_objective_decision_confirm: "Wraith? Vampire? Both. Neither."
 #cappadocian_wraith_objective_decision_tooltip: "To become like the wraiths and be able to truly touch the shadowlands you must first truly understand the nature of death"
 #cappadocian_wraith_objective_decision_requirement: "You must have learned at least 4 different paths of necromancy"
 #cappadocian_wraith_objective_decision_effect: "You will try to steal the magic of the Arcanoi for yourself"
 #cappadocian_wraith_objective_decision_requirement_02: "Your [umbra_aptitude|E] must exceed [grace_i]#V 175#!"
 #
 #pod1230objectives.338.t: "Crossing the line"
 #pod1230objectives.338.desc: "It's a fine line you have crossed with your ritual, in a way nothing has truly changed you are still yourself and yet, everything has changed well and truly changed, you see the world differently, you feel energies you only theorized the existence of before, you watch as the underworld and earth both stretch out in front of your eyes. For a moment, you panic and think you failed and just turned into a wraith. Becoming a wraith as a vampire is an easy thing any half-wit necromancer can do but as you stretch your hands and feel your vitae flow in your veins you know you have not. you are still a vampire but you have taken fires from olympus and carved the arcanoi of the wraiths into your very being. The only question is which one you managed to carve in the short time you had."
 #pod1230objectives.338.a: "At last! I was right!"
 
 salubri_warrior_objective_decision: "Samiel's Heir"
 salubri_warrior_objective_decision_desc: "Samiel fought harder against the evils of this world than anyone else. He left us his code and while we are not him, we fight still to honor his sacrifice."
 salubri_warrior_objective_decision_confirm: "Fire incarnate."
 salubri_warrior_objective_decision_tooltip: "The warriors have a code, but they also need a leader."
 salubri_warrior_objective_decision_effect: "You will choose the path of the Samielites going forward."
 salubri_warrior_objective_decision_effect_requirement: "[GetScriptedCharacterByHistoryID('790236').GetFirstName] must be your friend, best friend, soulmate or coterie member"
 salubri_warrior_objective_decision_effect_requirement_02: "[GetScriptedCharacterByHistoryID('792827').GetFirstName] must be your friend, best friend, soulmate or coterie member"
 salubri_warrior_objective_decision_effect_requirement_03: "[GetScriptedCharacterByHistoryID('791014').GetFirstName] must be your friend, best friend, soulmate or coterie member"
 salubri_warrior_objective_decision_effect_requirement_04: "[GetScriptedCharacterByHistoryID('790787').GetFirstName] must be your friend, best friend, soulmate or coterie member"
 
 pod1230objectives.339.desc: "Wanderers. Kin-slayers. Souleaters. Since Enoch, the Warriors have fought the enemies of Caine, slaying those they found wanting. Three eyes gaze from their furious countenances to match the three bloodlines of the clan. Warriors deal with those who cannot be saved: demon-worshippers, degenerate vampires, and those who seek to disturb the delicate symbiosis engendered by the childer of Saulot.\nUntil the sundering of the bloodline, Healers and Warriors walked the night together, eradicating corruption so that health could flourish once more.\n\nTheir fury lies with their bloodline’s founder. Salubri myths are in agreement: a childe of Saulot and mortal twin to Rayzeel, the vampire who would become Samiel was intemperate and stubborn, drawn always to conflict. He preferred the company of Brujah and Gangrel to his Healer brethren, traveling Nod’s wastes to test himself against demons and primordial beasts. Only when the Baali emerged in the vale of Gehenna did Samiel embody his purpose, renaming himself after a warrior angel and working a change in his bloodline.\nHe founded a Code and the Ritual of Blooding, so that Warriors could awaken the steel in the blood of a placid clan. Warriors carry the banner of fury to those they deem anathema, even if they feel the clan has abandoned their bloodline and methods.\n\nSamiel left his Code behind and, no matter the hardships endured since his death, Warriors follow it to the word. They are bloodied but unbowed. The secret to reunifying their clan and defeating evil exists somewhere, and they’ll battle the world entire until they find it."
 pod1230objectives.339.a: "Righteousness lies in intent and action both, not one or the other."
 pod1230objectives.339.b: "Woe to evil for our swords are drawn."
 pod1230objectives.339.c: "We cannot be Salubri and let a wound fester."
 
 tremere_sorcery_objective_decision: "As Above So Below"
 tremere_sorcery_objective_decision_desc: "The first guiding truth of all Hermetic magic: “As above, so below;” i.e., the material world and the higher realities reflect each other, and therefore can be made to touch and affect each other by one with the proper knowledge.\nBe they vampires or mages, the Tremere mean to discover and exhaust the full spectrum of its vast potential in a fraction of the time."
 tremere_sorcery_objective_decision_confirm: "Hermes Trismegistus' vision, achieved."
 tremere_sorcery_objective_decision_tooltip: "As Hermes Trismegistus taught us."
 tremere_sorcery_objective_decision_effect: "You will choose whether to keep the secrets for yourself or share it with the rest of the clan."
 
 pod1230objectives.340.desc: "The Emerald Tablet, also known as the Smaragdine and the Tabula Smaragdina, is a major — if not the major — foundation text of Hermeticism. In thirteen short sentences, it both provides the blueprint for the Great Work of alchemy and states the first guiding truth of all Hermetic magic: “As above, so below;” i.e., the material world and the higher realities reflect each other, and therefore can be made to touch and affect each other by one with the proper knowledge.\n\n“As above, so below” explains the ‘miracle’ of Thaumaturgy and indeed of vampiric Disciplines. Just as each planet in the firmament above rules a certain aspect of worldly existence, gems, herbs, animals and other things of nature carry ‘virtues’ which correspond to and call upon higher principles. Mortal blood is plainly replete with magical virtues; indeed, magi speculate that it carries the very essence of Man, who of all living creatures is the nearest image of the Creator. Other Cainites, the pitiable creatures, have discovered some of the magics it can fuel through millennia of painful trial and error.\n\nThe Tremere, however, have mastered the full spectrum of possibilities in a fraction of the time, proving once and for all that they are uncontested blood mages."
 pod1230objectives.340.a: "Hermes Trismegistus' great work, in my hands."
 pod1230objectives.340.b: "A boon to the Clan."
 
 tremere_usurper_objective_decision: "The Usurpers"
 tremere_usurper_objective_decision_desc: "Clan Tremere's position is precarious. The Salubri had many friends and while our propaganda campaign to smear their good name is starting to bear fruit, more needs to be done still.\nWe need dirt on an angel."
 tremere_usurper_objective_decision_confirm: "Not so pristine of a man..."
 tremere_usurper_objective_decision_tooltip: "We are barely tolerated by the other Clans, we need to ramp up our efforts to integrate ourselves.
 #tremere_usurper_objective_decision_requirement: "You must be allies with at least 5 different independent rulers"
 
 pod1230objectives.341.desc: "After Saulot's death, the Salubri, never numerous, began to disappear. Those Cainites of other clans who looked to them as paragons, even a sort of errant priesthood, publicly blamed the Tremere for this. Many others, however, distrusted the Cyclops nearly as deeply as they did the Usurpers.\n\nNow Meerlinda’s intrigues began to bear fruit. Powerful princes of the Ventrue and Toreador clans, most especially those Ventrue who hungered for Tzimisce land, had grown quite attached to their court magicians and the unheard-of tricks they could perform. And so, old suspicions about the Salubri that no one had bothered to rehearse for centuries were dug up and re-circulated.\nEven those princes, voivodes and elders who sheltered fleeing Cyclops often found it politically inconvenient to make their sympathies known. Far more chose to simply stand by as the atrocity unfolded among them, mouths full of empty platitudes and excuses.\n\nThe coup de grace was achieved with the recent public showing of damning accounts of Saulot as a soul sucking monster hated as far as Cathay. Other evidence also shows the disturbing possibility of him being the progenitor of the infernalist Baali.\n\nThe Tremere are quick to tell everyone they knew of this all along but, to the expert eye, they seem as surprised as anyone else. In any case, they are now reaping the rewards of being considered as the ones who destroyed what turned out to be a demon in angel's clothing."
 pod1230objectives.341.a: "Wait, we were the good guys all along?"
 
 malkavian_prophets_objective_decision: "The Madness of Prophets"
 malkavian_prophets_objective_decision_desc: "In ancient times, Malkavians were respected as prophets and seers. Some would even argue that we were the true powers behind many climatic decisions. The medieval era wasn't kind to us, and it is time to remind the children of Caine that we are much more than fools and jesters."
 malkavian_prophets_objective_decision_tooltip: "As we foresaw."
 malkavian_prophets_objective_decision_confirm: "Heed our words!"
 malkavian_prophets_objective_decision_effect: "Every Malkavian will become a Wise Man"
 malkavian_prophets_objective_decision_requirement: "Your Court seer must be at least of Good aptitude"
 
 pod1230objectives.342.desc: "We remember Tryphosa, the Malkavian seeress, whose words of warning finally spurred decadent old Prince Camilla of Rome to strike at Carthage. The great city was sacked and burned, the earth salted, and the Brujah dream of dwelling in communion with the kine killed — as we insist it had to be, for it was always a mad dream. And the mantle of empire passed to Rome: to the Ventrue, Lasombra and Toreador.\n\nThose among us whose talents could be reliably turned to prophecy contented themselves with this role. They were no longer powerful in their own right, but the powerful still heeded them. However, many Madmen either had no insight to give or had no interest in giving it to those who didn’t have to pay the same price for it. They wandered the wastes, bereft of company, “with only the jackals to pity them and only the wights to hear their cries,” as a very old clan saying goes. And thus our place as prophets of the spawn of Caine was lost.\n\nThe medieval age made fools and jesters of us but immortals forget slowly. By choosing the right rulers to help and advise, we once again showcased our invaluable insight. Our place at the side of the rulers of the night is assured for another eternity."
 pod1230objectives.342.a: "Listen closely..."
 
 malkavian_coronati_objective_decision: "The Coronati"
 malkavian_coronati_objective_decision_desc: "Guardians angels and boogeymen, the Coronati are reputedly the three childe of Malkav that drunk of his blood after he was torn apart long ago. It was an act of love, and the first part in uniting clan Malkavian into a cohesive whole.\nThe second act will need for them to be reunited."
 malkavian_coronati_objective_decision_confirm: "As he intended?"
 malkavian_coronati_objective_decision_tooltip: "A broken founder can lead to an united whole."
 malkavian_coronati_objective_decision_effect: "You will choose one of the Coronati to lead the effort, resulting in a different outcome for clan Malkavian as a whole."
 malkavian_coronati_objective_decision_prerequisite: "[GetScriptedCharacterByHistoryID('790316').GetFirstName], [GetScriptedCharacterByHistoryID('790488').GetFirstName] and [GetScriptedCharacterByHistoryID('790320').GetFirstName] must be your friends, best friends, soulmates or coterie members"
 
 pod1230objectives.343.desc: "Elders among the Malkavians claim that the reason none of their visions have turned up Malkav’s resting place is that he has no one resting place. He was torn apart, like Osiris, by a jealous brother after the fall of the Second City. The one who dismembered him did not drink his blood for fear of contracting his curse.\nThe pieces of his flesh were spread far and wide, and the sun reduced them to ash, but his heart’s blood seeped into the earth, where it couldn’t be touched by the fire. The next night three of his childer came and partook of the red earth, not to steal his power but to save him. Then they parted forever so no one killer could slay them in a stroke and bring their father to death again. They became the Coronati.\n\nWhen the Malkavians find themselves gripped by a particularly nightmarish bout of dementia, they beg for the Plague-Bride, temple-whore of the First City, to come and comfort them; but afterward they curse her for the new seeds of madness she leaves behind in their souls.\nNissuku, the Clever Prince makes a useful ally when his deceptions are directed at one’s enemies, but to attract his curious attention to oneself is an ill fate indeed.\nAnd as for the Nameless One who devours all things lost and forgotten — treasures, legends, words — the Malkavians pray for him to only devour their fevers.\n\nThrough them, Malkav still lives and propagates. From his broken self where madness started, a greater whole can be reconstruted. United for the first time since the Second City, the Coronati stand ready to usher their brethren into the next phase of the reunion."
 pod1230objectives.343.a: "Beloved of our Father, show us the way!"
 pod1230objectives.343.b: "Spare us from the ill fate that await us, Clever Prince!"
 pod1230objectives.343.c: "..."
 coronati_obj_plague_bride_tt: "Every Malkavian will become Possessed, Lunatic and gain a massive amount of stress. The Malkavian dynasty will get a modifier improving stress loss and reducing stress gain."
 coronati_obj_nissiku_tt: "Every Malkavian will gain +3 intrigue. The Malkavian dynasty will get a modifier improving their success chances but also making them easier to scheme against."
 coronati_obj_eater_tt: "Every Malkavian will get their name Eaten. That's it."
