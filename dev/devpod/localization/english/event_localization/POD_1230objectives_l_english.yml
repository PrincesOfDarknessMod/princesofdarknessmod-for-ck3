 pod1230objectives.258.title: "On Second Thought"
 pod1230objectives.258.desc: "Are you truly satisfied with the colors of your bloodline's coat of arms, or shall you reconsider?"
 pod1230objectives.258.option.a: "Reconsider."
 pod1230objectives.258.option.b: "Keep this one."
 pod1230objectives.258.option.c: "Make it the symbol of my realm!"
 pod1230objectives.91.t: "The Fire Burns Again."
 pod1230objectives.91.desc: "Your search is finished. Whether the formula you have assembled from scraps of information by means of tireless experimentation is the authentic Greek Fire or not, the substance sure does burn well. The initial test already yielded spectacular results, the liquid is as sticky as honey and near-impossible to put out, everything it coats while ignited ceases to exist before it ceases to burn. Although the optimal delivery method remains an area of potential improvement, the craftsmen in your service already prepared effective enough designs.\nAs you watch the fire consume the test dummies, you can feel as if great burden was lifted from your shoulders, deep down you know it's the burden of guilt you suffered sending your brothers and sisters against the forces of Hell not adequately armed."
 pod1230objectives.91.a: "Let the fire burn as hot as our faith."
 pod1230objectives.92.t: "Fire on the Horizon."
 pod1230objectives.92.desc: "Lately you've been hearing strange rumours of havens consumed by flames within minutes, kindred burnt to ash in their own resting chambers, elders disappearing without trace. Today one of your spies confirmed them to be true and all stemming from some new invention by one of the hunter organizations. Allegedly they recreated the formula for Greek fire and adapted it to use on land with devastating effects."
 pod1230objectives.92.a: "Those damn mortals and their foolish toys."
 pod1230objectives.92.b: "I hope they will share this invention."
 pod1230objectives.93.t: "The Faithful Return"
 pod1230objectives.93.desc: "Many years have passed since the Gantenbein brothers, deceived by their accursed masters, were forced to flee the great city of Constantinople, yet although the city was ravaged and with it the brothers' faith in the doctrine fed to them by their manipulators, a new faith arose from the ashes. The Calomena's Forsaken saw through the folly of those who call themselves her chosen: holiness can not stem from that which is unholy. Long have the Gantenbeins struggled against all those who falsely claimed themselves pious, pushed out to the outskirts of civilized society, but true faith prevailed. The brothers' piety carried them and all those ready to join them to a triumphant return to the City where countless ears yearn to hear their gospel."
 pod1230objectives.93.a: "Stand up, Damned of the Earth!"
 pod1230objectives.94.t: "Religious Fervour Overtakes Constantinople."
 pod1230objectives.94.desc: "News from Constantinople speak of a cult arriving in the city to poison the ears of the plebs with all kinds of libelous nonsense directed at their betters. Their foul words spread across the city like a fire and the mob growing around them has already grown too numerous and agitated for anyone to silence them. What will become of a city overcome with such mindless zeal?"
 pod1230objectives.94.a: "Filthy heretics."
 pod1230objectives.95.t: "A New Seat of Power"
 pod1230objectives.95.desc: "The cold midnight wind blows in your hair, below your feet Vistula glimmers with starlight. Every creature that this river sustains is yours to command and feed on, the castle wall you're standing on protects its monarch only from being replaced by someone more useful. You are the true ruler of this land and your machinations made it a domain more prosperous and enviable than any of the barren and desolate fiefs of your self-absorbed Carpathian kin.\nSoon they will realize that their precious pedigrees mean nothing when confronted with raw competence. The cold heart of Tzimisce hegemony now lies here, on Wawel hill."
 pod1230objectives.95.a: "My might will shake the mountains!"
 pod1230objectives.96.t: "The Northern Upstart"
 pod1230objectives.96.desc: "The final piece of the briefing on recent developments in Kindred affairs piques your attention. [victorious_poltzimi.GetUIName], who you've been watching for some time is apparently no longer satisfied with [victorious_poltzimi.GetHerHim] tight grip over the kingdom of Poland. [poltzimi.GetSheHe] issued an open challenge to the elder Fiends and claims rulership over Voivodate by right of power and merit. Even a child would know that this can only mean war."
 pod1230objectives.96.a: "As if those fools didn't have enough enemies already."
 pod1230objectives.96.b: "Let [victorious_poltzimi.GetHerHim] come, we shall see what [poltzimi.GetSheHe]'s made of."
 blood_curse_objective_decision: "Ending the Curse"
 blood_curse_objective_decision_tooltip: "This Blood Curse is tearing the clan apart, we must act."
 blood_curse_objective_decision_desc: "The Tremere Blood Curse takes a great toll upon the mind of our clanmates. We must do all we can to find a solution."
 blood_curse_objective_decision_confirm: "We have done it!"
 blood_curse_objective_decision_effect_tooltip: "You will remove the blood curse on your clan, humiliating the Tremere in the process." 
 pod1230objectives.97.t: "A Curse Undone"
 pod1230objectives.97.desc: "It has taken the efforts of the most learned members of your $pod_clan$ and a perhaps unprecedented gathering of arcane knowledge but it is finally done: the so called Tremere Blood Curse has been undone, finally freeing you and yours from its terrible effects.\nBesides the obvious benefits of such a feat, it has also been a great political victory as your brethren have endured during this difficult period and come out stronger for it. $pod_clan$ Tremere itself is starting to feel the setback as well, openly being mocked as their 'perfect' curse is so publicly being broken.\nVictory has rarely tasted that sweet."
 pod1230objectives.97.a: "Who are the best blood sorcerers now?"
 tremere_blood_curse_removed_tt: "The Tremere Blood Curse is removed from your whole $pod_clan$."
 pod1230objectives.98.a: "That will teach the Tremere a lesson in humility."
 pod1230objectives.98.b: "What? How? This cannot be!"
 tremere_blood_curse_decision_custom: "Alamut, the Great Work located in the county of [GetTitleByKey('b_qazvin').GetNameNoTier], must be fully built"
 pod1230objectives.99.t: "Immortal Patronage"
 pod1230objectives.99.desc: "As a proud Toreador, you have long nurtured the artists, be they mortals or not, in your area. Your court has become a center of poetry, writing, sports and all the other pursuits you deem worthy. Better yet, you have also managed to surround yourself with a talented council of the various $pod_clans$, making sure that your renown spread even further than just your own Toreador brethren.\nThere is hardly a night passing without a new discovery, a new theory or a new masterpiece being created thanks to your subtle but ever present care. In a way, you have achieved the dream of every Toreador: never running out of new wonders to entertain the otherwise agonizingly slow grind of immortality."
 pod1230objectives.99.a: "Each night feels new at last"
 toreador_grandeur_event_tooltip: "An especially well inspired character has joined your court."
 pod1230objectives.100.a: "Fancy Toreador posturing!"
 pod1230objectives.100.b: "I must see these wonders for myself!"
 toreador_grandeur_modifier: "Immortal Patron"
 toreador_grandeur_modifier_desc: "The greatest Toreador patron, always at the forefront of mortal innovations and widely respected for it."
 
 pod1230objectives.101.t: "Library of the Dead"
 pod1230objectives.101.desc: "With the most important writings of Cainite history now in your possession, and with the appropriate accommodations to host them, there is little doubt that you have created the greatest repository of eternal knowledge in your kind's history.\nImmortality itself might not be long enough for you to read all of it, and decipher all of these secrets. But you will try and then, perhaps, you will finally understand the purpose of this damned existence. The answer has to be there somewhere. You dare not consider the alternative..." 
 pod1230objectives.101.a: "One at a time..."
 custodian_library_undead_modifier: "Custodian of the Library"
 custodian_library_undead_modifier_desc: "The greatest Cainite library is entrusted to you. And everything has an answer, if you know where to look."
 pod1230objectives.102.a: "Can I borrow some books?"
     
 pod1230objectives.103.t: "Arikel's Chosen"
 pod1230objectives.103.desc: "Long ago, the [Glossary('Antediluvian','game_concept_antediluvian_desc')] of $pod_clan$ Toreador, Arikel, reigned in Sumer as a benevolent and beloved Goddess. Then Ennoia came.\nThe furious mother of the Gangrel, together with her childer, ravaged Arikel's paradise, and stole the Tablet of Destiny after a long battle where many proud Toreador lost their lives. At long last, this crime has been avenged.\nThe Tablet is now back in Toreador's hands, Enkidu and Gilgamesh are dead and clan Gangrel can only scurry into their hovels in shame of this defeat.\nAnd, as you look around your throne room after this momentous announcement, you suddenly notice the most magnificent sculpture you ever saw appearing seemingly from nowhere. As you contemplate this masterpiece, you hear the most beautiful voice whispering 'Thank you' in your ear.\nAs you turn around to see, she is already gone."
 pod1230objectives.103.a: "Could it be...?"
 #pod1230objectives.103.a.tt: ""
 shamed_gangrel_modifier: "Shamed Gangrel"
 shamed_gangrel_modifier_desc: "The Toreador have recovered the Tablet of Destiny and killed Gilgamesh and Enkidu. This is a great shame for all the Gangrel."
 
 pod1230objectives.104.a: "The Rose are blossoming"
 pod1230objectives.104.b: "Lies and deceit!"
 
 pod1230objectives.105.t: "A New Era"
 pod1230objectives.105.desc: "The fate of $pod_clan$ Toreador has been intertwined with Constantinople and its Dream for centuries now, but the death of Michael during the 4th Crusade ushered a changing course.\nLeaving behind the ruins of the Roman Empire, the Toreador have lashed on France and its burgeoning nation and culture, full of poets, artists and other creative minds. It has took time to secure the area away from the Ventrue's hands, and it has taken even more time for the Toreador to unite themselves behind a sole leader, but it is now done.\nFor better or worse, France and $pod_clan$ Toreador are now as one, and their destinies will be shared for the foreseeable future."
 pod1230objectives.105.a: "A new home"
 #pod1230objectives.105.a.tt: ""
 french_toreador_modifier: "France is Toreador. Toreador is France."
 french_toreador_modifier_desc: "The destinies of France and Clan Toreador are now intrinsically linked together."
 breton_opinion: "Breton Opinion"

 pod1230objectives.106.a: "Ha, united artists!"
 pod1230objectives.106.b: "A new home?"  
 
 pod1230objectives.107.t: "Divided Way"
 pod1230objectives.107.desc: "Once again, the Celestial Army is restored, now all [GetTrait('shih').GetName( GetPlayer )] will follow you. Once the most powerful army of hunters this world has ever seen, the Celestial Army fell to decadence and inner corruption, leading the most virtuous of your kind into destroying it for the greater good.\nMany are worried that the same mistakes will be made again, but you are reassuring them that you know better.\nTime will tell."
 pod1230objectives.107.a: "No peace, just war."
 pod1230objectives.107.a.tt: "You will now longer have access to the 'Thoughtful Action' decision."
 pod1230objectives.107.a.tt2: "You will be able to use the [GetPlayer.GetFaith.GHWName] for [empire|E] [casus_belli|E] when the time has come."
 pod1230objectives.107.b: "Let's maintain the old way."
 
 pod1230objectives.115.t: "Stealing Wisdom"
 pod1230objectives.115.desc: "[GetTrait('kueijin').GetName( GetNullCharacter )] Ancestors tell that the barbarian Zao-lat was tutored by [GetScriptedCharacterByHistoryID('791111').GetFirstName] in the use of this power, but his own shortcomings prevented him from mastering it and his P'o corrupted it. When [GetScriptedCharacterByHistoryID('791111').GetFirstName] saw that his disciple was flawed and cast him out, the Traitor left to the west, sharing his bastardized form among his followers.\nHe has since departed from India but left you with the mission of finally mastering the most well guarded secrets of the [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]. A task you have finally accomplished, making Zao-Lat proud... and all 'Kindred of the East' even more hostile from now on."
 pod1230objectives.115.a: "Stealing as a scholarly pursuit."
 wisdom_stealer_modifier: "Wisdom Stealer"
 unlock_chiiumuh_tooltip: "Unlock $awake_hun_and_po_objective_decision$ [decision|E]"
 
 pod1230objectives.116.t: "The Tigers of Meru"
 pod1230objectives.116.desc: "The powerful 'Court of the West' has always been hindered by factionalism. Competing [Glossary('Wu','podgloss.wu')] are ruling like warlords in their own fiefs and outright division has been avoided for a long time only due to the deep respect everyone had towards Empress Fan. Then, suddenly, she disappeared.\nThe Court of the White Tiger then officially split into competing factions despite Fan's successor clumsy attempts of maintaining unity. Since then, many have tried to bring peace to the Court of the West, but they all failed.\nThis time is over however, and your arrival at the position of Emperor has once again solidified the White Court, who finally stands as an equal partner to the August Courts of the East.\nMount Meru has its protectors once again."
 pod1230objectives.116.a: "The tiger howls again."
 
 
 #pod1230objectives.123.t: "The Tortoise Endures"
 #pod1230objectives.123.desc: "The Black Tortoise Court, also called the Wandering Court, is one of the Five August Courts of the [Glossary('Fourth Age','game_concept_fourth_age_desc')]. It encompasses northern East Asia and thus represents the North Direction.\nWith the rise of the Mongols, the Black Tortoise Court followed them into China, where they came into conflict with the other August Courts. Their contact with the south also showed several [akuma|E] in their ranks. As more and more [akuma|E] were detected, the Black Tortoise Court sent the gross of their forces against them. Many of these [Glossary('Wu','podgloss.wu')] were defeated, their members tortured and eventually turned in [akuma|E] themselves.\nAll hope seemed lost, until you managed to unite the remaining pure [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] and remove the [Glossary('Anda','podgloss.anda')] and [akuma|E] infestation on the Steppes. The Tortoise stands tall once again, and the [Glossary('Wheel of Ages','podgloss.wheelofages')] has been slowed down."
 #pod1230objectives.123.a: "We won't fall again."
 
 pod1230objectives.124.t: "The Truth About Brujah"
 pod1230objectives.124.desc: "Long ago, $pod_clan$ Brujah was a beacon for scholars and philosophers. Then Troile came, her heinous act towards our founder paving the way for the fall of our once noble lineage. Since then, Troile's get has prospered and only our timely intervention saved the world from their abomination rituals in Carthage.\nWe didn't stop here however. Spreading the truth took us time and a lot of convincing of Troile's most devoted followers, but it is now done. As we stand watch over the traitor resting place in the ruins of Carthage, we proclaim this: So called "Brujah", children of Troile, it is time to join the True Clan and forsake your cursed lineage. We of the True are ready to welcome you into the fold with open arms... or drawn blades if you try to cling to your treacherous ancestors. Make your choice."
 pod1230objectives.124.a: "Open your arms..."
 pod1230objectives.124.b: "...or draw your blade?"
 pod1230objectives.125.a: "Rebels no more?"
 pod1230objectives.125.b: "This can't be true!"

 pod1230objectives.126.t: "Aid the Light-Bringers"
 pod1230objectives.126.desc: "The Mummies are a mystery to your kind. These entities are clearly from Pagan stock and have little reverence for the Greatest but their contributions for the greater good of the Land of Faith can't be overstated.\nDifficult times call for pragmatic solutions, and you have chosen to ignore their mystical nonsense about the old Egyptian Gods and focus instead on more strategical matters. For all their faults, they certainly are powerful and know a lot about how to hunt the cursed bloodsuckers. This strange alliance has bore fruit and both of your organizations have benefited from it. An acceptable state of affairs for now at least.\nThe leader of this strange group, one who names himself Horus, has come forward with a proposition to join their ranks. You are very unsure about this proposal and this would likely cripple your organization. On the other hand, true immortality isn't offered to a mere mortal every day...\nSensing your internal conflict, Horus offers an alternative, a simpler elixir, one who will grant you an extended lifespan while still keeping you as you are. The choice is ultimately yours."
 pod1230objectives.126.a: "The simple elixir will suffice, thank you."
 pod1230objectives.126.b: "True immortality? Well..."
 become_mummy_ikwan_tt: "You will become a Mummy which will radically change your gameplay, disable your buildings and destroy your higher realm titles.\nThis is likely to cripple your campaign if you aren't ready for it."

 pod1230objectives.127.t: "Free the Keening"
 pod1230objectives.127.desc: "The Keening began after the Prophet had conquered Mecca and is generally believed to be a manifestation of Allah's power, emanating from the Black Stone inside the Kaaba. Any tainted being can feel the power of True Faith that is channeled via the Black Stone. The Keening stopped only one time in its history, when Qarmatians, members of an Islamic sect, stole the Black Stone from the Kaaba in 950. This allowed Tarique, a Nosferatu, to erect sorcerous wards that can contain a part of the Keening, although they cannot completely silence it.\nWith your newfound knowledge and cleansing of the area, you were able to remove Tarique's ritual and free the full power of faith once more. Tainted supernaturals, like vampires, feel the Keening once again as a clamoring cacophony of wails and screams. They were forced to leave Arabia, hopefully for good, and your forces only had to march in the empty cities to re establish order. A tremendous victory for the faithful."
 pod1230objectives.127.a: "Allah has spoken!"

 pod1230objectives.128.t: "The Weavers' Approval"
 pod1230objectives.128.desc: "The Persian mages known as the Taftani are an enigma for most hunters. These "masters of Djinnis" are very... flashy and like to flaunt their (arguably impressive) magical powers. Luckily for the Ikhwan al-Safa they are firmly in the "good" side of the fight, having a particular hatred for the vampires whom they consider part of a "great lie" of some sorts.\nYour recent efforts into understanding their mystical nature and your more mundane ones of pushing back the vampires from the Middle East have earned their attention. They have sent teachers to help you formalize your basic understanding of the mystical forces into something more useful.\nHopefully, you will be able to pass on this newfound power to your family in the future, gaining another tool for the unending fight ahead of you."
 pod1230objectives.128.a: "A lasting friendship?"

 pod1230objectives.130.t: "Awake Hun and P'o"
 pod1230objectives.130.desc: "To decipher the secret of Hun and P'o, you have met the Kaifeng Jewish Wan-Kuei, studied the Kànbujiàn and [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')], and you have gone to mount Meru, finding the temple complex that served as the headquarter of the [Glossary('Wan Xian','game_concept_kuei_jin_desc')].\nNow you have understood the second breath, awakened your Hun and P'o and become a full-fledged [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]!\nMaybe this was what Saulot looked for all those years ago and maybe you even did better than he ever did. You are now one of a kind, a link between two very different worlds."
 pod1230objectives.130.a: "I have achieved the impossible."
 
 pod1230objectives.131.t: "United for the Hunt"
 pod1230objectives.131.desc: "While the Inquisition and the Akritai have the same goal, that is purging the world of the supernatural, frictions between the two are common. 1204 is still fresh in Akritai hunters' memories and its wounds haven't healed yet. Distrust often turns to outright hostility and the minions of the Devil laugh as the hunters hunt each other.\nNo more however as the Akritai have achieved a dominant position in the traditional seats of Christendom. With this newfound primacy, the Orthodox hunters have brought their Catholic brethren under their rule, unifying the warriors of Christendom under a more powerful force than ever before. Demons and monsters will soon shake in fear when witnessing first hand the newfound united strength of the Christian hunters."
 pod1230objectives.131.a: "The Shadow Inquisition has been brought to the fold!"
 
 pod1230objectives.132.t: "Master of the Secret Talmud"
 pod1230objectives.132.desc: "The most well kept relic of the Judges, the secret Talmud is a compilation of teachings and arguments of earlier Judges. This great deal of collected wisdom is also very complicated and has never been fully understood by the current generation. This state of affairs has changed thanks to your efforts however, allowing modern Judges to rediscover the secrets of Kabbalist hedge magic.\nWith your polished and easy to understand interpretation of this ancient wisdom, you are confident that the next generation of hunters will have no trouble being taught these secrets once thought reserved to an elite."
 pod1230objectives.132.a: "The Infinite Ein Sof."
 
 #pod1230objectives.133.t: "Theurgy"
 #pod1230objectives.133.desc: "After studying the sacred texts, you have finally found the secret of how to invoke power from God. Now you will teach this to your brothers and sisters, as you are united in your stand against the darkness."
 #pod1230objectives.133.a: "God is watching!"
 
 pod1230objectives.135.t: "Creation of Visceratika"
 pod1230objectives.135.desc: "An extension of their natural affinity for stone, earth, and things made thereof, Visceratika is for the Gargoyles a codified version of these powers that came naturally to them. Having long been enthralled by the Tremere, they had so far been unable to really understand this affinity for these powers but this has changed recently. Pioneered by one innovative individual, these strange abilities are finally spreading like wildfire among the very communal Gargoyles, under the name of Visceratika. A new discipline joins the ranks of the power of the blood."
 pod1230objectives.135.a: "Masters of Earth and Stone."
 
 pod1230objectives.136.t: "Creation of Visceratika"
 pod1230objectives.136.desc: "An extension of their natural affinity for stone, earth, and things made thereof, Visceratika is for the Gargoyles a codified version of these powers that came naturally to them. Having long been enthralled by the Tremere, they had so far been unable to really understand this affinity for these powers but this has changed recently. Pioneered by one innovative individual, these strange abilities are finally spreading like wildfire among the very communal Gargoyles, under the name of Visceratika. A new discipline joins the ranks of the power of the blood."
 pod1230objectives.136.a: "Masters of Earth and Stone."
 
 pod1230objectives.137.t: "Creation of Visceratika"
 pod1230objectives.137.desc: "Reports said that [visceratika_creator.GetFirstNameNoTooltip] created a new discipline named [GetTrait('visceratika').GetName(GetNullCharacter)].\nAn extension of their natural affinity for stone, earth, and things made thereof, Visceratika is for the Gargoyles a codified version of these powers that came naturally to them. Having long been enthralled by the Tremere, they had so far been unable to really understand this affinity for these powers but this has changed recently. Pioneered by one innovative individual, these strange abilities are finally spreading like wildfire among the very communal Gargoyles, under the name of Visceratika. A new discipline joins the ranks of the power of the blood."
 pod1230objectives.137.a: "More powers to learn?"
 pod1230objectives.137.b: "Good for our bloodline."
 
 pod1230objectives.7000.t: "Vexed No More"
 pod1230objectives.7000.desc: "Your struggles are over.\n\nAt last, the curses that have been haunting you for so long have dissipated."
 pod1230objectives.7000.a: "Finally..."
 pod1230objectives.7000.tt: "Your curses are lifted."
 
 pod1230objectives.138.t: "Secret Victory of the Mongols"
 pod1230objectives.138.desc: "Qorjin's Baghatur started as a small endeavor, a safeguard created by the Great Khan himself after witnessing first hand the terrifying power of the supernatural. Qorjin handled this task remarkably well, gathering information and even making allies among the most trustworthy of the supernaturals. Using the might of the Mongol Empire and its successors states, Qorjin's band grew into a cohesive paramilitary force dedicated to defend its people.\nVictory after victory, the hunters managed to remove the pernicious influence of the [Glossary('Anda','podgloss.anda')] and other monsters of the steppes until the heartlands of the Mongol were finally deemed secure.\nWith this triumph and the collapse of the [Glossary('Anda','podgloss.anda')], the rumors of a potential invasion from the east have died and the Baghatur's leaders are now considering the future. Should they ride west as their forefathers did but this time leading a formidable host of hunters? Or should they cement their alliance with the amicable shapeshifters of the steppes to prepare for more challenges ahead?"
 pod1230objectives.138.a: "We ride west!"
 pod1230objectives.138.b: "Our alliance makes us stronger."
 quincunx_invasion_removed_tt: "The Quincunx Vanguard invasion, scheduled for 1360, won't happen anymore. No effect if it already did."
 werewolves_friendship_variable_tt: "You will get access to the [GetMaA('werewolf_pack').GetName] and the [GetMaA('heavenlysuccessors_maa').GetName]."
 
 pod1230objectives.139.t: "Heir of the Warrior-God of the Sun"
 pod1230objectives.139.desc: "In ancient times, a great serpent of darkness fell from the skies. The hateful creature burrowed under the earth as the sun burnt its flesh. The sun bestowed a single ray of divine light on Svarog, god of smithing and celestial fire. Svarog then created Dazbog: warrior-god of the sun, and enemy of all that is unholy.\nDazbog tracked the serpent to the land of the Slavs, and their battle was terrible to behold. He bound the serpent to the land but Dazbog knew that the hordes of darkness were too numerous for him alone and he despaired. A mortal warrior approached the god as he sat weeping, and she chided Dazbog when he explained the cause of his despair. The purpose of battle wasn’t always to win, she told him, but rather to keep fighting. Dazbog’s savior and compatriot died aeons ago, but warriors still flock to their banner.\nThe warriors have an ancient feud with the servants of Kupala, including Clan Tzimisce. Terrible foes as they are, most warriors die way before having claimed even their first vampiric kill. But you kept trying, as Dazbog did, and your recent victories have emboldened your brethren to grander heights than ever before."
 pod1230objectives.139.a: "The first of many victories!"
 
 pod1230objectives.140.t: "A Legacy of Hunters"
 pod1230objectives.140.desc: "Despite your numerous victories over the evil plaguing this world, you have come to terms with the sad truth. There are just too many monsters around for just one hunter to deal with, no matter how skilled they are. As such, your recent efforts have been focused on preparing the next generation of hunters, teaching them the vast experience you accumulated over your years of monster hunting.\nHopefully, this important knowledge will be enough for them to avoid the mistakes you made in the past and even surpass you. They will be your legacy to this world and your last spiteful act against the great enemy."
 pod1230objectives.140.a: "Winning over the people is paramount."
 pod1230objectives.140.b: "Violence is the only answer."
 pod1230objectives.140.c: "They can be outsmarted."
 pod1230objectives.140.d: "Magic makes us stronger."
 pod1230objectives.140.e: "Divine powers are a blessing we must use."
 
 dynasty_hunter_administrative_modifier: "Connected Hunters"
 dynasty_hunter_administrative_modifier_desc: "With contacts all over the mortal world, these hunters can always count on finding help when needed."
 dynasty_hunter_military_modifier: "Warrior Hunters"
 dynasty_hunter_military_modifier_desc: "Outmatched as they might be, they fight all the hardest to cleanse this world."
 dynasty_hunter_intrigue_modifier: "Shadow Hunters"
 dynasty_hunter_intrigue_modifier_desc: "Monsters might dwell in shadows but these hunters are more than able to match them in this battlefield."
 dynasty_hunter_sorcery_modifier: "Sorcerous Hunters"
 dynasty_hunter_sorcery_modifier_desc: "These hunters are masters of hedge magic, using these impressive powers to battle the darkness."
 dynasty_hunter_theurgist_modifier: "Theurgist Hunters"
 dynasty_hunter_theurgist_modifier_desc: "Imbued with divine powers, these hunters bring the might of the heavens to their foes."

 
 #pod1230objectives.142.t: "Charon"
 #pod1230objectives.142.desc: ""Charonists" believe that the Charon who lead the Empire of the Dead, and demon Charon, supposed creator of the Underworld are one and the same. Despite your best efforts, you can't find enough evidence to prove it and, frankly, it might just be a case of mistaken identity. Still, your work was not in vain, you have recovered the great scythe Siklos and infused it with pure demonic power tamed from your demonology discoveries, creating a mighty weapon in the process indeed."
 #pod1230objectives.142.a: "One day I may know the truth."
 
 #pod1230objectives.144.desc: "The Demon Warrior Empire formed from those fallen [Glossary('Wan Xian','game_concept_kuei_jin_desc')] that accepted their new, demonic state and sought to embrace it, likely during the early [Glossary('Fourth Age','game_concept_fourth_age_desc')]. Warring against each other and those [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] that had not joined with them, the Demon Warrior Empire sought to encompass all former immortals into their ranks. Its members were diverse, comprising of those that simply sought power and those that sought to accept the new role Heaven had apparently laid on them.\nThe Demon Warrior Empire found opposition from the Five Emperors, who gathered those around them that believed that the original mandate of the [Glossary('Wan Xian','game_concept_kuei_jin_desc')] had not been taken from them, forerunners of the Way of the Resplendent Crane. The Emperors were powerful enough to suppress any uprisings of the Demon Warriors, but could not extinguish them completely. To try to avert conflicts, the Five Emperors created basics of the Great Principle to establish rules for all fallen [Glossary('Wan Xian','game_concept_kuei_jin_desc')] to follow.\nThe Five Emperors were aided in their endeavour by the appearence of [GetScriptedCharacterByHistoryID('791111').GetFirstName], whose teachings had synthesized the five ways that would lead back to Heaven and who further refined the Fivefold Way. The Demon Warrior Empire's sympathizers turned towards the new teachings and applied them to their own philosophy.\nAmong the Courts, the Demon Warrior Empire is a half-remembered memory of the barbaric times before [GetScriptedCharacterByHistoryID('791111').GetFirstName]'s teachings. Some Devil-Tigers, however, always sought to return to the state of the Empire, forming the Searing Wind sect that seeks to create a new Demon Warrior Empire without the strictures of the Courts."
 #pod1230objectives.144.a: "A new Celestial Devil uprising"
 
 pod1230objectives.145.t: "Battle Over A Damned Future"
 pod1230objectives.145.desc: "The third spirit world, though few like to speak of it, is also the most terrible. It is the dread Yomi World, lair of the [Glossary('Yama Kings','podgloss.yamaking')] and their demon minions. Also known as the Thousand Hells, the Yomi World is a terrible place, seemingly composed from the worst elements of the Yin and Yang Worlds. The masters of Yomi, the dread [Glossary('Yama Kings','podgloss.yamaking')], hold Hell-realms deep within the firmament of the Yomi World. There, surrounded by howling tempests and fields of carnage, they make war on each other and on supernatural of purer nature, ever yearning for the night that the Sixth Age is loosed upon the world and one of their number attains the mandate of [Glossary('Demon Emperor','podgloss.demonemperor')].\nWhile several [Glossary('Yama Kings','podgloss.yamaking')] are unbelievably old, others aren't. Humanity always find new creative ways to plague itself and these innovations sometimes end up causing a change in the demonic hierarchy. Some [Glossary('Yama Kings','podgloss.yamaking')] were former $pod_kueijin$, weaker spirits or even simple mortals. All however have one thing in common, they fought a bloody battle to ascend to the top of Yomi." 
 pod1230objectives.145.a: "Better to reign in Hell..."
 pod1230objectives.145.b: "Let's not be too hasty."
 
 #pod1230objectives.146.t: "Wheeling"
 #pod1230objectives.146.desc: "Did you truly stop the wheel? Or just played by the whims of fate to end up at the same point in the future? Only time will tell."
 #pod1230objectives.146.a: "I did it"
 
 #pod1230objectives.147.t: "Reverse the Wheel"
 #pod1230objectives.147.desc: "Did you truly stop the wheel? Or just played by the whims of fate to end up at the same point in the future? Only time will tell."
 #pod1230objectives.147.a: "I did it"
 
 pod1230objectives.148.desc: "Long ago, the $pod_kueijin$ began to fall from grace and to consume the Chi they were administered to police for themselves and began to set the shapeshifters against each other with lies, treachery and powers gained from the darkness of [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')].\nThe Shifters, allied with the $pod_kueijin$ since their creation, believed them and began a massacre amongst each other. This shameful event resulted in the loss of trust between the races and the almost complete extermination of the Eastern bear shapeshifters, the Okuma.\n\nYour efforts to claim and purify the Dragon Nests lost during this war and enter into contact with the fallen ancestor spirits of the Okuma have bore fruit. The scars of this dark past are slowly healing, giving hope to many that past wrongs can be righted after all."
 pod1230objectives.148.a: "Now we can heal."
 
 pod1230objectives.149.desc: "During the later days of the Shang dynasty, the fallen $pod_kueijin$ had taken to rule over mortals from the shadows. Posing as priests and shamans, they demanded sacrifices in form of chi and manipulated mortal rulers by the use of their powers. Likewise, peasant wizards like the Wu-Keng extorted the population for protection, while those practicing higher magic often secluded themselves from the world.\n\nThis outreach led to the other supernaturals, most notably the Hsien Fae and the Shih demon hunters to band together to stop them. The war was long and very costly (including in collateral damage for the common people) but ended with the leader of the demon hunters, Yi, triumphing and inflicting the $pod_kueijin$ with the curse of the sun.\n\nWhile Yi's punishment was certainly warranted at the time, it has since been seen as one of the catalysts of the turning wheel. The $pod_kueijin$ have been far from perfect since the war but they have learned their lesson and didn't try to rule over humanity again.\nAs such, rescinding the curse over them could bring back a more harmonious supernatural landscape for Asia, healed of the errors of the past."
 pod1230objectives.149.a: "Basking in sunny renewal."
 
 pod1230objectives.150.desc: "Once servants of the more powerful gods in the Celestial hierarchy, the Hsien were responsible for answering the prayers of mortals in accordance with the wishes of their superiors and acting as mediators between the other supernaturals. During the terrible events of the Dragon River War and the fall of the $pod_kueijin$, many of them rebelled against their position in the Celestial Bureaucracy, either to help mortals or turn against them. As a result, they were punished by the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')].\nThose who had dared to place themselves in the position of the gods were cast out and forced to live among the mortals of the Middle Kingdom.\n\nFactionalised and uncertain, some seek to answer mortal prayers without the aid of the bureaucracy of heaven, while others seek selfish dominion over humans or even to destroy the world, allying themselves with the [Glossary('Yama Kings','podgloss.yamaking')] as an act of revenge for their exile.\n\nYour concerted diplomatic efforts (including a no small amount of coercing as well) have bore fruit and a substantial number of the Hsien have returned to their ancestral roles while other supernaturals have promised to at least listen to their judgment.\nYou can be proud to have righted one long lasting wrong, bringing the world closer to heavenly order once more."
 pod1230objectives.150.a: "Orderly Heavenly Bureaucracy"
 
 pod1230objectives.151.t: "Back to the Third Age"
 pod1230objectives.151.desc: "Did you truly stop the wheel? Or just played by the whims of fate to end up at the same point in the future? Only time will tell."
 pod1230objectives.151.a: "I did it"
 
 #pod1230objectives.152.t: "Tear Down the Wall"
 #pod1230objectives.152.desc: "With the domination of humanity curtailed, the wall between worlds has been weakened. The Centipede's servants are cleansed and won't provide their lord with any evil help. Now if you just cut the spiritual leash you hold, the Centipede would be free... but it is not the time yet."
 #pod1230objectives.152.a: "Hold on"
 
 pod1230objectives.153.desc: "The [Glossary('Yama Kings','podgloss.yamaking')] are playing their games to claim the throne of the [Glossary('Demon Emperor','podgloss.demonemperor')]. They know time is on their side, as the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] will one day step down and leave Creation to the strongest among them. Still, they aren't invincible, not yet at least.\nHarassing their servants, the [akuma|E], goes a long way towards weakening them. Some even put forth the hypothesis that the [Glossary('Demon Emperor','podgloss.demonemperor')] will be at his weakest during his ascension to the celestial throne. If this is true, cutting down the servants of Hell before the "coronation" would make it possible for brave supernaturals to face the Emperor heads on at this climatic moment.\n\nAnd perhaps even win.\n\nWhatever the case, this event is still a long way away but you have recently done your part. The forces of Yomi have learned to fear your impressive prowess and determination and their previous boldness to pave the way for their master has been reduced to mere skittering around in the shadows."
 pod1230objectives.153.a: "I will be waiting, Emperor."
 
 #pod1230objectives.154.t: "Imbued"
 #pod1230objectives.154.desc: "On the remains of Meru, the most holy site in all Creation, divine power has once again come to this world. The mortals have been imbued with the spark for divinity as it was intended so long ago. It will take time for them to truly grasp their newfound powers but you have paved the road for the ascension of humankind into something much greater."
 #pod1230objectives.154.a: "The Ascension begins."
 
 #pod1230objectives.155.t: "Exalted"
 #pod1230objectives.155.desc: "It is ready. The Middle Kingdom is united, the Scarlet Queen and the Ebon Dragon have send us their divine essence with the return of the imbued mortals; truly the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] is watching us. We will destroy the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] and [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')], ending all infernal; We will break the Grand Spider's wall and web, recover the Centipede‘s sanity. We will become... Exalted!"
 #pod1230objectives.155.a: "Exalted"

 azhi_dahaka_objective_decision: "Eternal Change"
 azhi_dahaka_objective_decision_tooltip: "One with change."
 azhi_dahaka_objective_decision_desc: "Azhi Dahaka is a mythical state of being pursued by the Tzimisce. It is the harbinger of transformation, a state where physical and mental norms and structures lose their hold on the vampire's very soul. To achieve it, each aspirant must find their own way as stagnation is extinction after all."
 azhi_dahaka_objective_decision_confirm: "Let's start experimenting..."
 azhi_dahaka_objective_decision_requirement: "You have at least #V 3#! [bound_ghouls|E] with #V 30#! or more [GetTrait('fleshcrafted').GetName(GetNullCharacter)] [trait_level_track_xp|E]"
 azhi_dahaka_objective_decision_requirement2: "You have at least #V 10#! [prisoners|E] with [GetTrait('vampgeneration7').GetName(GetNullCharacter)] or lower"
 pod1230objectives.156.t: "A New Form"
 pod1230objectives.156.desc: "As a rule, with a few notable exceptions, Tzimisce do not tend towards devoted piety. Why worship some distant god when you can craft yourself into one? Not really a deity. Not really a dogma. Azhi Dahaka is the symbol, fetish, and focus of the Clan's transcendentalism.\nFrom the Dracon to Illuyankas, Dracula to the Leviathan, dragons are woven deeply into Tzimisce's mythology. What the kine fear, we aspire towards — not the literal, physical form, but what the dragon represents as harbinger of transformation. We quest for the transcendental, walking the sinuous spiral of Azhi Dahaka's coils, gazing into its many mouths and eyes. Where chaos and forever meet in motion, that is where we will find the dragon's beating heart, and we will drink deep.\nMetaphor made manifest. Riddle made flesh. Azhi Dahaka is the chiropteran cherub of our godless, alien spirituality."
 pod1230objectives.156.a: "My ascendence begins."
 pod1230objectives.156.tooltip: "#help To progress towards [GetTrait('azhi_dahaka').GetName(GetNullCharacter)] you must increase your [trait_level_track_xp|E] through a [journey|E]#!"


 pod1230objectives.157.t: "Deepest Abyss"
 pod1230objectives.157.desc: "After many preparations and sacrifices, you are finally here. At the deepest part of the Abyss where light never existed. You don't have time to think about it however as your soul is quickly deteriorating. You must act now or risk becoming just one of the many restless shades wandering this place eternally."
 pod1230objectives.157.a: "I bind the Leviathan to my will."
 pod1230objectives.157.a.t: "You will gain access to the [GetMaA('the_leviathan').GetName] [men_at_arms|E]."
 pod1230objectives.157.b: "I imbue myself with knowledge of the Abyss."
 pod1230objectives.157.b.t: "You will get access to two powerful Abyss Mysticism [bs_rituals|E]."

 pod1230objectives.158.t: "Unholy Ascension"
 pod1230objectives.158.desc: "Namtaru's lieutenants, the Decani, have apparently heard of your project to join their ranks... by killing one of them. They are taking the threat you represent seriously as ambitious infernalists like you succeeded in the past.\nOne of them is taking the lead, offering to have a peaceful conversation about various potential alternatives to your project. The location of this 'conversation' has already been decided. This could offer you a great opportunity to approach one of them more easily than you anticipated."
 pod1230objectives.158.a: "The prey coming to the predator?"
 pod1230objectives.158.a.t: "You will wait for the specified date and have a talk with the representative of the Decani."

 pod1230objectives.1581.t: "An Infernal Proposal"
 pod1230objectives.1581.desc: "As promised, the Decani is waiting for you. The infernal lieutenant of Namtaru comes with an enticing offer, forfeit your ambition of usurping their position and instead accept a non negligible part of their powers. Demonic strength is, after all, what you seek.\nThe threat on their part is implicit, if you refuse they will have to resort to more violent means of persuading you. Both of you came prepared and the Decani are powerful entities, there is no telling how a fight would end."
 pod1230objectives.1581.a: "We can come to an accord."
 pod1230objectives.1581.a.t: "You will get a part of the Decani's power."
 pod1230objectives.1581.b: "...but I want everything!"
 pod1230objectives.1581.b.t: "You will start a fight to eat their soul, and power. "
 pod1230objectives.1581.sucess: "You won, and you are ready to claim your prize"
 pod1230objectives.1581.failure: "You lost, your soul will fuel this Decani's power"

 pod1230objectives.159.t: "Hunt for the Sargon Codex"
 pod1230objectives.159.desc: "The Sargon Codex is a clay tablet written by Cappadocius during his mortal years. After his $pod_Embrace$, the loss of his Avatar caused chaos and destruction within his memories. He could not remember what he had written or where he had left it. After millennia, the Sargon Codex was destroyed and its parts scattered across the world. Were someone to restore it, immense power would await them.\n\nIt seems that you are far from the first one to attempt this quest. Your research has pointed to you that Lazarus, the estranged childe of Cappadocius, did the same journey as you once. At this point in time, the Codex was still whole... but that made it even more dangerous as ultimate knowledge often comes at the price of overwhelming one's mind. Lazarus choose to break a piece of the Codex and study it slowly over the centuries. He almost managed to finish his work before being stopped by his clansmates Constancia and Markus Musa Giovanni. The resulting battle saw the Codex explodes, fractured into multiple shards that soon were dispersed across the world.\nThis is where your own search begins."
 pod1230objectives.159.a: "Everything in the name of knowledge"

 pod1230objectives.1591.t: "Sargon Codex"
 pod1230objectives.1591.desc: "And here I am, at the doorstep of godhood. Only one single step forward and I will do something even Cappadocius never managed to do, regain the divine spark that the curse of Caine erases in all of us. I will be one of a kind, blessed and cursed at the same time... but all the more powerful for it."
 pod1230objectives.1591.a: "Apotheosis."
 pod1230objectives.1591.a.tt: "The #V level 6#! sorcery [perks|E] will not require any [journey|E]"

 pod1230objectives.1592.t: "Gehenna: The Calm"
 pod1230objectives.1592.desc: "Unlike many of his contemporaries, Cappadocius yearned for a power even beyond even what he possessed as an antediluvian. His quest for knowledge was endless, his entire lineage of childer cultivated to this end. For millennia, the Scholars have labored towards this end. Between the Codex, the Wraith of the Messiah, Necromancy, and from the depths of the Underworld no stone has been left unturned in this search.\n\nAnd at long last, it has been found. \n\nYou feel it first. A rush of energy, a vitality long lost to you. Cappadocius himself has recognized your critical role in this development, and has rewarded you for enabling him to perform the impossible. Your mind expands and races, as everything he had learned rushes into you within an instant. Your $pod_vitae$ screams, your mind roars, the Beast howls, and existence around you begins to swirl. With mere thoughts, you feel what you have learned bending the world around you to your will. In your final moments of vampiric lucidity before you become something greater, you smile, the fruit of your ambitions tasting of the sweetest nectar."
 pod1230objectives.1592.a: "His Kingdom Come."
 pod1230objectives.1592.a.tt: "Everything and nothing lies before you now. You can taste it all. Time to leave this all behind."

 pod1230objectives.1593.t: "Gehenna: The Storm"
 pod1230objectives.1593.desc: "Cappadocious had found something that even Caine couldn't ignore. Something so dreadful not even the Dark Father could hazard such a foul thing could exist. And the wrath of the first will come. Caine is here. And he has come to levy his own punishment upon his wayward children, and perhaps fury upon the whole of Adam and Eve's descendants. A punishment extracted #R in rivers of blood.#!"
 pod1230objectives.1593.a: "#R ...in rivers of blood.#! And yet we rise."
 pod1230objectives.1593.a.tt: "The end has come, but that no longer matters to you anymore. Caine is beyond your concerns. Cappadocius calls to you. Whatever Caine may do, you will be ready for whatever wrath he may unleash. Infinity awaits"

 pod1230objectives.160.t: "Aenigmatis: The Greatest Riddle"
 pod1230objectives.160.desc: "Ordo Aenigmatis seek to obliterate the Malkavian madness by confronting what is unimaginable and magnificent, whether that be God, time, the totality of the Cosmos or Caine himself. Every mystery is worth looking for a solution."
 pod1230objectives.160.a: "I will solve them all!"

 pod1230objectives.1601.t: "Aenigmatis: Moment of Clarity"
 pod1230objectives.1601.desc: "Absorbing a vast amount of knowledge has brought you closer to the goals of all Aenigmatis, understanding the world until you truly become one with it. You can feel your divine potential awakening after each mystery you solve. By surrendering yourself to reason and knowledge, you are given a glimpse of the greatest prize : lucidity."
 pod1230objectives.1601.a: "I #weak feel#! different?"
 pod1230objectives.1601.a.tt: "Something changed in you, the curse of Caine is weakening its grasp."

 pod1230objectives.1602.t: "Aenigmatis: True Divinity"
 pod1230objectives.1602.desc: "True knowledge has brought you to the stage where you are cured of your blood curse and your madness. Perhaps it is a glimpse of divinity itself, being reborn in Malkav's own image, or perhaps simply a channeling of his energy through you allowing you for the first time to truly see clearly. In the end, the night is now illuminated before you as you banish the darkness of ignorance by your very presence."
 pod1230objectives.1602.a: "Finally free?"
 pod1230objectives.1602.a.tt: "You won't meet your [Glossary('Beast','game_concept_beast_desc')] ever again."

 pod1230objectives.161.t: "Ecstasis: Pain and Pleasure"
 pod1230objectives.161.desc: "Ordo Ecstasis argues that the true madness is in the mortal form. In their viewpoint, the Beast is the true divine creation and thus must be listened to and appeased. Understanding it is the key to understanding both God and oneself."
 pod1230objectives.161.a: "The rush of raw emotions."

 pod1230objectives.1611.t: "Ecstasis: Moment of Clarity"
 pod1230objectives.1611.desc: "If the Beast is truly divine as the Ecstasis claim, then it is a reflection of the Almighty. Wise Ecstasis soon understand that this doesn't make it any less dangerous. Being consumed by its needs before truly understanding it means losing it all. Pain and pleasure are a means, not an end."
 pod1230objectives.1611.a: "I #weak feel#! different?"
 pod1230objectives.1611.a.tt: "Something changed in you, the curse of Caine is weakening its grasp."

 pod1230objectives.1612.t: "Ecstasis: Divine Compromise"
 pod1230objectives.1612.desc: "By surrendering to your Beast so often while still keeping your sense of self, you have achieved the dream of every Ecstasis. You found a balance that is strong enough that the Beast doesn't feel like an intruder as much anymore. In a way, it has become a part of yourself, no longer trying to goad you into doing its bidding but accepting that you will take it into account regardless.\nPerhaps not divinity itself but something even more important for a Malkavian : lucidity."
 pod1230objectives.1612.a: "Finally free?"
 pod1230objectives.1612.a.tt: "You won't meet your [Glossary('Beast','game_concept_beast_desc')] ever again."

 pod1230objectives.162.t: "Maleficus: Darkness Within"
 pod1230objectives.162.desc: "The most secretive (and heretical) of the Ordos, Maleficus believes in the inherent darkness of the Cainite condition. As such, there are no limits to which extremes they will fall to cure their madness. What is infernalism to the one truly damned?"
 pod1230objectives.162.a: "$greatdemon_name_asmodeus$'s Call."
 pod1230objectives.162.b: "$greatdemon_name_dagon$'s Call."
 pod1230objectives.162.c: "$greatdemon_name_azrael$'s Call."
 pod1230objectives.162.d: "$greatdemon_name_belial$'s Call."
 pod1230objectives.162.e: "$greatdemon_name_abaddon$'s Call."

 pod1230objectives.1621.t: "Maleficus: Moment of Clarity"
 pod1230objectives.1621.desc: "The curse of Caine, by its very divine nature, is almost unbreakable. It is however not unheard of for the most powerful of God's rebellious angels to be able to counteract it to some degree. Obviously dealing with such creatures isn't for the faint of heart or for the ones who want to keep their soul intact. Some however are willing to pay the price, any price, as long as the results are there.\nIf nothing else, the Hells are always willing to offer enthralling solutions."
 pod1230objectives.1621.a: "I #weak feel#! different?"
 pod1230objectives.1621.a.tt: "Something changed in you, the curse of Caine is weakening its grasp."

 pod1230objectives.1622.t: "Maleficus: Infernal Bargain"
 pod1230objectives.1622.desc: "Your infernal patron is pleased by your unholy work. Strengthened by your efforts they hold up their end of the pact, dulling the Beast and the madness that infested your mind.\nThe results are... debatable. With this newfound clarity, you now truly understand the depths of which you have gone to achieve this feat. If you still had a spark of the divine in your soul before, it has long been extinguished. You will be forever part of the infernal now but at least you have your reward : lucidity to truly contemplate what you have done."
 pod1230objectives.1622.a: "Finally free? Or just a new prison?"
 pod1230objectives.1622.a.tt: "You won't meet your [Glossary('Beast','game_concept_beast_desc')] ever again."
 ordomaleficus_objective_tt: "You need to have 100 Demonologist experience and either 100 Thrall or 100 Diabolist experience."
 
 ikhwan_al_safa_landless_objective_decision: "Strengthening the Ikhwan"
 ikhwan_al_safa_landless_objective_decision_tooltip: "We need the help of the desert hunters."
 ikhwan_al_safa_landless_objective_decision_desc: "While the Ikhwan has a strong presence in the Arabian peninsula, its influence in the Maghreb is weak at best. Securing the major city of Tunis would go a long way to make sure they can operate in the area."
 ikhwan_al_safa_landless_objective_decision_confirm: "A good starting point."

 pod1230objectives.164.desc: "With the securing of Tunis now complete, you have been approached by the Ikhwan Al-Safa. While they congratulate you for this victory against the supernatural, they also subtly remind you that they consider Tunis as being part of their sphere of influence. They ask for a show of goodwill from your order by giving them control over the city, thus strengthening the bonds with these fellow hunters.\nIf you accept, it is likely that this newfound friendship will persist at least for a while, bringing benefits to your order as a whole in the process."
 pod1230objectives.164.a: "Hunters unite!"
 pod1230objectives.164.b: "Now is not the time."
 
 judges_landless_objective_decision: "Strengthening the Judges"
 judges_landless_objective_decision_tooltip: "We need the help of our fellow hunters."
 judges_landless_objective_decision_desc: "The Judges, while perhaps the most learned of the hunter orders, lack a base of operation to launch more serious campaigns against the supernatural. Securing a center of activity would go a long way to make sure they can operate in the area."
 judges_landless_objective_decision_confirm: "A good starting point."

 pod1230objectives.165.desc: "With the securing of Jerusalem now complete, you have been approached by the Judges. While they congratulate you for this victory against the supernatural, they also subtly remind you that they consider Jerusalem as being part of their sphere of influence. They ask for a show of goodwill from your order by giving them control over the city, thus strengthening the bonds with these fellow hunters.\nIf you accept, it is likely that this newfound friendship will persist at least for a while, bringing benefits to your order as a whole in the process."

 akritai_landless_objective_decision: "Strengthening the Akritai"
 akritai_landless_objective_decision_tooltip: "We need the help of our fellow hunters."
 akritai_landless_objective_decision_desc: "The Akritai took a heavy blow with the 4th crusade and have been weary of collaborating with other hunters ever since. Securing Constantinople would go a long way to mend the burned bridges."
 akritai_landless_objective_decision_confirm: "A good starting point."

 pod1230objectives.166.desc: "With the securing of Constantinople now complete, you have been approached by the Akritai. While they congratulate you for this victory against the supernatural, they also subtly remind you that they consider Constantinople as being part of their sphere of influence. They ask for a show of goodwill from your order by giving them control over the city, thus strengthening the bonds with these fellow hunters.\nIf you accept, it is likely that this newfound friendship will persist at least for a while, bringing benefits to your order as a whole in the process."

 shadow_landless_objective_decision: "Strengthening the Shadow Inquisition"
 shadow_landless_objective_decision_tooltip: "We need the help of our fellow hunters."
 shadow_landless_objective_decision_desc: "The Shadow Inquisition is powerful but the roots of its corruption run deep in the Holy See. If we could secure Rome and then give it to them, they would certainly be more willing to listen to a potential collaboration."
 shadow_landless_objective_decision_confirm: "A good starting point."

 pod1230objectives.167.desc: "With the securing of Rome now complete, you have been approached by Shadow Inquisition. While they congratulate you for this victory against the supernatural, they also subtly remind you that they consider Rome as being part of their sphere of influence. They ask for a show of goodwill from your order by giving them control over the city, thus strengthening the bonds with these fellow hunters.\nIf you accept, it is likely that this newfound friendship will persist at least for a while, bringing benefits to your order as a whole in the process."

 qorjin_landless_objective_decision: "Strengthening Qorjin's Baghatur"
 qorjin_landless_objective_decision_tooltip: "We need the help of our fellow hunters."
 qorjin_landless_objective_decision_desc: "Far from the other orders, Qorjin's Baghatur must compete for the ears of the Khans with other supernaturals. Securing Karakorum would be a decisive edge in this competition."
 qorjin_landless_objective_decision_confirm: "A good starting point."

 pod1230objectives.168.desc: "With the securing of Karakorum now complete, you have been approached by Qorjin's Baghatur. While they congratulate you for this victory against the supernatural, they also subtly remind you that they consider Karakorum as being part of their sphere of influence. They ask for a show of goodwill from your order by giving them control over the city, thus strengthening the bonds with these fellow hunters.\nIf you accept, it is likely that this newfound friendship will persist at least for a while, bringing benefits to your order as a whole in the process."

 pod_gift_county_order_tt: "#X You will give away this county to a member of the order. #!"
 
 ashen_ambassador_decision: "[ashen_ambassador|E]"
 ashen_ambassador_decision_tooltip: "Can I find a ruler worthy of my skills?"
 ashen_ambassador_decision_desc: "Skilled ambassadors are a prized asset in any ambitious ruler of the night's arsenal. Diplomacy, intrigue, conquest... they use every tool to help spread the influence of their patron in faraway lands."
 ashen_ambassador_decision_confirm: "I can be of use to their rise."
 POD_ashen_ambassador_decision_tt: "You get access to a new character interaction on landed rulers where you can ask to become their official ambassador.\n #X If you already have an ambassadorial patron, they will see this as a betrayal. #! "
 set_relation_ashen_ambassadorial_patron: "You pledge yourself to this character as an [ashen_ambassador|E]"
 
 pod1230objectives.169.desc: "Bowing deeply before the assembled court of your new suzerain, you vow to work tirelessly to spread their influence far and wide be it by the pen, sword and every other tool at your disposal. As the seal of their rulership is respectfully presented to you, you rise proudly, ready to start your journey far and wide with this prestigious responsibility in mind.\n #X As an ambassador, you unlock a new interaction on foreign rulers to spread your patron's influence in various ways. You can also always gift them lands you conquer during a war. You can ask them for a boon with a character interaction as well.\nThe Ambassador track of your Ashen Adventurer trait will unlock new and improved ambassadorial skills as you progress."
 pod1230objectives.169.a: "I will be your greatest weapon." 
 pod1230objectives.169.b: "On second thought..."

 pod1230objectives.170.desc: "The travels of an ambassador of the night are fraught with danger. Rival rulers, failed intrigue or simply saying the wrong word at the wrong time all mean that even skilled diplomats can become dead diplomats very quickly. As such it is expected for your patron to provide what help they can afford if you ask for it.\nPolitics being politics, requesting such help is often seen as a sign of weakness however and you still will have to convince the court of the importance of your plea."
 pod1230objectives.170.a: "I need political support." 
 pod1230objectives.170.b: "Material concerns are on my mind."
 pod1230objectives.170.c: "My entourage needs strengthening."
 pod1230objectives.170.effect.success.desc: "Convinced!"
 pod1230objectives.170.failure.effect.desc: "Doubtful"
 pod1230objectives.170.critical.failure.effect.desc: "Rejected"
 pod1230objectives.170.effect.success.desc.tt: "All your damaged Men at Arms regiments will be replenished"
 pod1230objectives.170.effect.failure.desc.tt: "One of your damaged Men at Arms regiments will be replenished"
 pod1230objectives.170.d: "My military order can provide support troops."
 pod1230objectives.170.e: "Blood, blood is my master."
 
 pod1230objectives.171.desc: "The main duty of an ambassador is to represent their patron in foreign courts. Said representation can take a great many forms, from formal introduction to more underhanded intrigue. In any case you can start your work in a region by an official visit where you will outline your goals. As you represent your liege in this, failure to conduct yourself accordingly will reflect poorly on your skills."
 pod1230objectives.171.a: "I come bearing well wishes from my patron." 
 pod1230objectives.171.b: "This is a... quaint court compared to my liege's." 
 pod1230objectives.171.c: "I have letters acknowledging the borders of our domains." 
 pod1230objectives.171.d: "I could "request" funds for my benefactor while I'm here..." 
 pod1230objectives.171.e: "Let's work together to secure our realms." 
 pod1230objectives.171.f: "This realm's collapse would benefit my patron." 
 
 ashen_grandmaster_decision: "[ashen_grandmaster|E]"
 ashen_grandmaster_decision_tooltip: "Is it time to nurture my knightly entourage?"
 ashen_grandmaster_decision_desc: "Many fighting bands roam the night. Some are formalized (or powerful) enough to be considered military orders, enjoying the reputation and prestige this title brings. A shrewd [ashen_grandmaster|E] can steer their order in the direction they choose and ensure its continued prosperity."
 ashen_grandmaster_decision_confirm: "Let us review our situation."
 initial_ashen_grandmaster_decision_tt: "You will create your military order and choose its precepts." 
 later_ashen_grandmaster_decision_tt: "You will use your [ashen_grandmaster|E] trait track experience to improve your military order."
 #POD_ashen_ambassador_xp_on_success_tt: "25% chance to get 3 Ashen Ambassador Trait Experience"
 
 pod1230objectives.172.desc: "What separates a military order from an aimless warrior band is a common purpose. It can be anything from protecting a faith to fighting against demons or safeguarding endangered relics. Such a goal is the pillar that will hopefully aggregate many brave souls around you. Choose it wisely."
 pod1230objectives.172.a: "We will be holy warriors!" 
 pod1230objectives.172.b: "There is a specific cause in my mind..." 
 pod1230objectives.172.c: "We will be a mendicant order." 
 pod1230objectives.172.d: "We will fight for the highest bidder." 
 pod1230objectives.172.e: "We will find a worthy liege." 
 initial_ashen_grandmaster_zealous_tt: "#bold Holy Order#!: You can ask for conversion of your courtiers. At the second level, you get a positive war modifier when joining a war involving a ruler of your faith. At the highest level, all your knights get this modifier."
 initial_ashen_grandmaster_specific_tt: "#bold Specific Motive#!: You will unlock new internal upgrades for the Military Quarters domicile building: [GetDomicileBuilding('vampire_military_our_cause_1').GetName], [GetDomicileBuilding('vampire_military_our_cause_2').GetName], and [GetDomicileBuilding('vampire_military_our_cause_3').GetName]."
 initial_ashen_grandmaster_mendicant_tt: "#bold Mendicant Order#!: After a pilgrimage, you will replenish your damaged Men-at-Arms at the first level, gain provisions at the second and gain additional piety for the last one."
 initial_ashen_grandmaster_mercenaries_tt: "#bold Mercenary Band#!: You will get improved rewards when undertaking mercenary contracts, the higher this precept's level the higher the improvement."
 initial_ashen_grandmaster_dedicated_tt: "#bold Dedicated Order#!: Synergy with [ashen_ambassador|E] where you can create troops for your Ambassadorial Patron and gain [ashen_ambassador|E] trait experience, the higher this precept's level the more troops you will create."
 
