l_english:
 
 PoD_periphary.1.t: "Dream is my Reality"
 PoD_periphary.1.desc: "The Periphery can be a beautiful place at times. When humanity dreams and hopes, the material world's reflection on the Periphery is as beautiful as it can ever be, soothing any visitors with a warm sensation of peace and safety.\nDreams never last however, and these fleeting moments are best savored whenever you can."
 PoD_periphary.1.a: "So calm..."
 PoD_periphary.1.b: "It's not soothing. It's boring!"
 
 PoD_periphary.2.t: "Gateways to Dreams"
 PoD_periphary.2.desc: "The most Dreamlike area of the [umbra|E], the Periphery represents this strange state of not complete consciousness between sleeping and full awakening.\nAs such, it is a very strange place, similar to the material world but not quite. It is where people hope, pray or fear for tomorrow. It is bliss and pain at the same time, and it would be easy to get lost in those extreme sensations."
 PoD_periphary.2.a: "Better move on..."
 PoD_periphary.2.b: "Life is a struggle."

 PoD_periphary.3.t: "Intruding on Dreams"
 PoD_periphary.3.desc: "Almost everyone has access to the Periphery in a way, since it's where dreams are formed and given substance. For a practiced [umbra|E] traveler (such as yourself) it is not very difficult to intrude on other people's dreams. There is no way to know who exactly you are messing with though, so it's really a shot in the dark."
 PoD_periphary.3.a: "Bad sleep incoming!"
 PoD_periphary.3.b: "Let's not be mean."




 PoD_mirror_zone.1.t: "Facing the Mirror"
 PoD_mirror_zone.1.desc: "Always moving between realms, the Mirror Zone is a disturbing presence in the [umbra|E]. It causes localized hallucinations that are at once impossible and highly personal. Past lovers, dead enemies, and other personal relations all await you inside.\nMercifully, these hallucinations are just temporary and can actually be a good way to reinforce your psyche for the trials ahead. Still, right here and now, it would take quite a toll on your sanity."
 PoD_mirror_zone.1.a: "I will brave the ghosts of my past."
 PoD_mirror_zone.1.b: "Avoiding them seems safer."
  mirror_zone_modifier: "Experienced the Mirror Zone"
 mirror_zone_modifier_desc: "You have seen too many disturbing things in the Mirror Zone to still be bothered by mundane issues."

 PoD_mirror_zone.2.t: "Mirroring Possibilities"
 PoD_mirror_zone.2.desc: "The mysterious Mirror Zone is fond of showing its "guests" what could have been. The infinite tapestry of possibilities that would emerge from a simple different choice somewhere in your life. Alarmingly, it is also known to try to force those alternative realities into the visitors for some kind of astral perverse amusement.\nFacing one of the mirrors, you see yourself as a great general even during your earlier days, one that has never known defeat and will always be remembered by History."
 PoD_mirror_zone.2.a: "...it's true isn't it?"
 PoD_mirror_zone.2.b: "Wait, that's not me!"

 PoD_mirror_zone.3.t: "Mirroring Possibilities"
 PoD_mirror_zone.3.desc: "The mysterious Mirror Zone is fond of showing its "guests" what could have been. The infinite tapestry of possibilities that would emerge from a simple different choice somewhere in your life. Alarmingly, it is also known to try to force those alternative realities into the visitors for some kind of astral perverse amusement.\nFacing one of the mirrors, you see yourself as a great diplomat even during your earlier days, one that could always get their way and will always be remembered by History."
 PoD_mirror_zone.3.a: "...it's true isn't it?"
 PoD_mirror_zone.3.b: "Wait, that's not me!"



 
 PoD_null_zone.1.t: "Paths of the Wyck"
 PoD_null_zone.1.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens."
 PoD_null_zone.1.a: "At least it's not dangerous."
 
 PoD_null_zone.2.t: "Walking Alone"
 PoD_null_zone.2.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens.\nIt feels like you have been going on here for days now and there is nothing to do but still walking, and walking, and walking..."
 PoD_null_zone.2.a: "I find it quite refreshing actually."
 PoD_null_zone.2.b: "Boooring"

 PoD_null_zone.3.t: "Astral Workout"
 PoD_null_zone.3.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens.\nIt feels like you have been going on here for days now and there is nothing to do but still walking, and walking, and walking... At least, it's a good workout if nothing else."
 PoD_null_zone.3.a: "One, two, one, two..."