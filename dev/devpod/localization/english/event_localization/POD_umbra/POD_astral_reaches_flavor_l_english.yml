l_english:
 

 PoD_astral_plane.1.t: "Overload"
 PoD_astral_plane.1.desc: "The Astral Plane is the realm of ideas, thoughts and inventions. Clearly a great place to learn a lot... but perhaps too much of a great place actually. There is so much to take in here, unexplored possibilities, crazy potential... the human brain is just not made for that kind of limitless exploration. You can feel yourself drifting away, slowly losing yourself to this infinity..."
 PoD_astral_plane.1.a: "So many possibilities!"
 PoD_astral_plane.1.b: "I must focus..."
  
 mind_blown_modifier: "Mind Blown"
 mind_blown_modifier_desc: "You see everything!"
 
 PoD_astral_plane.2.t: "Rationality"
 PoD_astral_plane.2.desc: "The Astral Plane is a complete representation of the limitless potential of ideas and thoughts. Everything is possible to the learned visitor if they have the willpower to stay and listen. This ethereal and formless amalgam of ideas has little patience for silly concepts such as "sociability" however and each time you learn something, you can feel yourself more and more annoyed at the prospect of having to talk to other beings at some point again."
 PoD_astral_plane.2.a: "Who needs friends?"
 PoD_astral_plane.2.b: "I know enough."
   
 PoD_astral_plane.3.t: "Redirection"
 PoD_astral_plane.3.desc: "There are too many ideas floating in the [UmbraGlossary('astral_plane')] for you to explore but there might be another option to consider in order to exploit the potential of this place. Ideas love to find a new "home" in the material world and, with the proper willpower, you might be able to gently push one into the dreams and thoughts of a person close to you. Then, who knows what might result of this "sudden" inspiration?"
 PoD_astral_plane.3.a: "I will guide you to your new host."
 PoD_astral_plane.3.b: "I'm not a muse."

     
 PoD_vulgate.1.t: "The River of Language"
 PoD_vulgate.1.desc: "Inside the [UmbraGlossary('vulgate')] can be found the River of Language. As its name would imply, this river is a spiritual representation of mankind's many languages. You have heard from a passing spirit that the further up the river you go, the more ancient the languages found there are.\nYou could try to drink from it at those specific points to obtain some lost knowledge, but instantly learning an ancient tongue can be quite costly to the mind."
 PoD_vulgate.1.a: "Here maybe?"
 PoD_vulgate.1.b: "This place looks like the Nile."
 PoD_vulgate.1.c: "Interesting small effluent here."
 PoD_vulgate.1.d: "Nothing interesting."

 PoD_vulgate.2.t: "Dumbing Down"
 PoD_vulgate.2.desc: "The [UmbraGlossary('vulgate')] is where the most basic impressions and ideas are given form. Things like a chair, the sky being above people and other simple concepts that humanity doesn't think about too much and takes for granted. As such, this place is quite peaceful and appeasing but not very stimulating intellectually. You could easily get lost drifting away, thinking simple thoughts, if you are not careful."
 PoD_vulgate.2.a: "Fire is hot."
 PoD_vulgate.2.b: "Time to think about the politics in my realm."
 
 PoD_vulgate.3.t: "Low Philosophy"
 PoD_vulgate.3.desc: "As the place where the most basic ideas and concepts of humankind are taking form, the [UmbraGlossary('vulgate')] is home to some... peculiar spirits. These "philosophers" have had an eternity to ponder the most simple truths of the universe and then came up with some "interesting" solutions.\nYou made the mistake of being caught in one of their arguments and are completely baffled about the way they are making simple ideas sound so complex. Philosophers are the same everywhere it seems."
 PoD_vulgate.3.a: "I was wrong all along!"
 PoD_vulgate.3.b: "That doesn't make any sense!"
 PoD_vulgate.3.c: "I guess it makes some kind of sense..."
 vulgate_confused_modifier: "Confused"
 vulgate_confused_modifier_desc: "That doesn't make any sense... does it?"
 vulgate_understanding_modifier: "Strange Understanding"
 vulgate_understanding_modifier_desc: "It makes sense I guess?"


 PoD_homeland_stargazer.1.t: "Peace and Quiet"
 PoD_homeland_stargazer.1.desc: "Resembling the Himalayas they call their home, the tribal homelands of the Stargazers is a place of self reflection covered with majestic and peaceful landscapes as far as the eye can see. For a member of this tribe it is well and truly home, the place where they can find themselves and finally understand their inner truth."
 PoD_homeland_stargazer.1.a: "The truth is here."
 
 PoD_homeland_stargazer.2.t: "The Five Tests"
 PoD_homeland_stargazer.2.desc: "The Tribal Homelands of the Stargazers is a place of contemplation, but also a place designed to test the Garou both physically and mentally. As a Stargazer yourself, you are welcomed to try any of the five training courses. You know very well that you are expected to fail a lot along the way however, which might not be the most prestigious thing for your brethren to see."
 PoD_homeland_stargazer.2.a: "My knowledge is great."
 PoD_homeland_stargazer.2.b: "I can outsmart the $glossary_wyrm$."
 PoD_homeland_stargazer.2.c: "My caern is in order."
 PoD_homeland_stargazer.2.d: "When I talk, they listen."
 PoD_homeland_stargazer.2.e: "I can lead us to victory."

 PoD_homeland_stargazer.3.t: "Unwelcome Visitor"
 PoD_homeland_stargazer.3.desc: "The Tribal Homelands of the Stargazers isn't a friendly place to outsiders of the tribe like yourself. While its inhabitants aren't outright hostile, they make a point of misleading you and keeping you away from the really important places in the realm. Even simple discussions with them end up with you feeling more confused after their answers than you were before asking your questions."
 PoD_homeland_stargazer.3.a: "I shouldn't stay here for long."


 PoD_spires.1.t: "Love is a Mountain"
 PoD_spires.1.desc: "The [UmbraGlossary('spires')] act as a passageway between the [UmbraGlossary('vulgate')] and the Epiphamies. It is a chain of very high mountains each representing one of the core concepts experienced by humanity since the dawn of time. To navigate the Spires, you have to metaphorically climb one of those mountains, relying on your own vision and interpretation of the concept associated with it.\nLuck has it that you started your journey near the spiritual representation of love, which is now testing your knowledge of this difficult subject."
 PoD_spires.1.a: "I know a thing or two about love..."
 PoD_spires.1.b: "Love is a lie!"
 love_spires_tt: "As you have at least one lover or soulmate, you can stay in the [UmbraGlossary('spires')] unharmed."
 unlove_spires_tt: "As you don't have at least one lover or soulmate, you are mentally drained by your stay in the [UmbraGlossary('spires')]."

 PoD_spires.2.t: "Mountain of War"
 PoD_spires.2.desc: "The [UmbraGlossary('spires')] act as a passageway between the [UmbraGlossary('vulgate')] and the Epiphamies. It is a chain of very high mountains each representing one of the core concepts experienced by humanity since the dawn of time. To navigate the Spires, you have to metaphorically climb one of those mountains, relying on your own vision and interpretation of the concept associated with it.\nLuck has it that you started your journey near the spiritual representation of war, which is now testing your knowledge of this difficult subject."
 PoD_spires.2.a: "I know a thing or two about war..."
 PoD_spires.2.b: "I employ other people to make war."
 war_spires_tt: "As you have at least a good knowledge of martial matters, you can stay in the [UmbraGlossary('spires')] unharmed."
 unwar_spires_tt: "As you don't have at least a good knowledge of martial matters, you are mentally drained by your stay in the [UmbraGlossary('spires')]."

 PoD_spires.3.t: "Climbing your Destiny"
 PoD_spires.3.desc: "The [UmbraGlossary('spires')] act as a passageway between the [UmbraGlossary('vulgate')] and the Epiphamies. It is a chain of very high mountains each representing one of the core concepts experienced by humanity since the dawn of time. To navigate the Spires, you have to metaphorically climb one of those mountains, relying on your own vision and interpretation of the concept associated with it.\nLuck has it that you started your journey near the spiritual representation of destiny, which is now testing your knowledge of this difficult subject."
 PoD_spires.3.a: "I know a thing or two about fate..."
 PoD_spires.3.b: "Can you repeat the question?"
 destiny_spires_tt: "As you have at least a good knowledge of scholarly matters, you can stay in the [UmbraGlossary('spires')] unharmed."
 undestiny_spires_tt: "As you don't have at least a good knowledge of scholarly matters, you are mentally drained by your stay in the [UmbraGlossary('spires')]."



 PoD_grand_hall.1.t: "Celestial Bouncers"
 PoD_grand_hall.1.desc: "Once an open ground for adventurers and spiritual philosophers, the [UmbraGlossary('grand_hall')] has been taken over during the first century C.E. by a race of mysterious sentinels. Their primary purpose seems to make sure that people don't loiter around in the [UmbraGlossary('grand_hall')] like they used to. Basically, do your business here and then move on is their motto.\nTheir presence and their constant suspicious looks at you make this otherwise pleasant realm a more stressful stay than you anticipated."
 PoD_grand_hall.1.a: "I won't stay for long, promise"
 
 PoD_grand_hall.2.t: "Wandering Around"
 PoD_grand_hall.2.desc: "The [UmbraGlossary('grand_hall')] is actually quite a misnomer. It's mostly a very large maze of corridors in a Classical Mediterranean style. As with most things in the [umbra|E], it is also constantly shifting, meaning that you can wander around quite possibly forever and still discover new things. Some of the potential discoveries aren't as benign as the others though, so you never know what will be the ultimate result of such wandering in the end."
 PoD_grand_hall.2.a: "I feel lucky."
 PoD_grand_hall.2.b: "I will stay put for now, thanks."

 PoD_grand_hall.3.t: "The Fountain"
 PoD_grand_hall.3.desc: "In a large nexus chamber, a dozen hallways meet. In the center of that space, a fountain is surrounded by very lifelike figures encased in stone. One of the sentinels, the self appointed guardians of this realm, explains to you that these statues were once visitors that thought they were above the sentinels' laws for this place. Evidently, they were wrong.\nThe sentinel concludes his story by advising you to not show the same arrogance."
 PoD_grand_hall.3.a: "A quaint little story."
 PoD_grand_hall.3.b: "I would have crushed them!"



 PoD_epiphamies.1.t: "Happy Days"
 PoD_epiphamies.1.desc: "Epiphamies embody concepts of complete abstraction and often materialize as colorful clouds in the umbral sky of the [UmbraGlossary('vulgate')].\nBy a stroke of good fortune, you reached the [UmbraGlossary('epiphamy')] of Happiness. Drifting away in a pleasantly plump cloud, you are feeling more invigorated and, well, happy that you ever did in your whole life."
 PoD_epiphamies.1.a: "Not a care in the world!"
 PoD_epiphamies.1.b: "Happiness is overrated. Back to work."
 epiphamie_love_modifier: "Happy Days"
 epiphamie_love_modifier_desc: "Why should you care about anything? You are happy!"

 PoD_epiphamies.2.t: "Ex Nihilo"
 PoD_epiphamies.2.desc: "Epiphamies embody concepts of complete abstraction and often materialize as colorful clouds in the umbral sky of the [UmbraGlossary('vulgate')].\nBy a stroke of misfortune, you reached the [UmbraGlossary('epiphamy')] of Oblivion. Ending up in a storm of black and foreboding clouds, you can barely extract yourself before being pulled in to become a part of this ever hungry Epiphamy."
 PoD_epiphamies.2.a: "I lost a part of myself."
 PoD_epiphamies.2.b: "That was too close..."
 PoD_epiphamies.2.c: "Hello darkness my old friend!"

 PoD_epiphamies.3.t: "Astral Glory"
 PoD_epiphamies.3.desc: "Epiphamies embody concepts of complete abstraction and often materialize as colorful clouds in the umbral sky of the [UmbraGlossary('vulgate')].\nBy a stroke of good fortune, you reached the [UmbraGlossary('epiphamy')] of Glory. Surrounded by somehow regal looking clouds, you can find yourself standing taller than before, your powerful gaze forcing the respect of those around you."
 PoD_epiphamies.3.a: "You may address me as 'your majesty'."

   
 PoD_epiphamies.200.t: "Lucky Day"
 PoD_epiphamies.200.desc: "Epiphamies embody concepts of complete abstraction and often materialize as colorful clouds in the umbral sky of the [UmbraGlossary('vulgate')].\nA strange place, many things end up lost here. But what is lost can be found again and today, lady luck is on your side. A rare item radiating with magic literally falls from one of the clouds to your feet."
 PoD_epiphamies.200.a: "A crown! Of feathers it seems."
 PoD_epiphamies.200.b: "A crown! Of iron I think."
 PoD_epiphamies.200.c: "That's a damn big rock."




 PoD_inventium.1.t: "Technobabble"
 PoD_inventium.1.desc: "The [UmbraGlossary('inventium')] is a realm full of every invention humankind has ever dreamed of. A group of Mages, heirs to the ones who found this place, control this realm in part in the hopes of advancing human knowledge, in another part to profit from it.\nToday, you are cornered by one of their eccentric members that is rambling about their latest fancy. While not very well structured, you can almost see the brilliance behind his theories... or the sheer madness."
 PoD_inventium.1.a: "It makes perfect sense!"
 PoD_inventium.1.b: "If you please excuse me..."
 PoD_inventium.1.c: "Dear colleague, you are making some key mistakes..."

 PoD_inventium.2.t: "Tools of the Trade"
 PoD_inventium.2.desc: "The [UmbraGlossary('inventium')] is a realm full of every invention humankind has ever dreamed of. A group of Mages, heirs to the ones who found this place, control this realm in part in the hopes of advancing human knowledge, in another part to profit from it.\nToday, you found a strange set of apparently quite advanced tools. While you are not in the mood to build new things, you can still use these to put some polish on your existing inventory."
 PoD_inventium.2.a: "As good as new!"
 
 PoD_inventium.3.t: "Robber Scholars"
 PoD_inventium.3.desc: "The [UmbraGlossary('inventium')] is a realm full of every invention humankind has ever dreamed of. A group of Mages, heirs to the ones who found this place, control this realm in part in the hopes of advancing human knowledge, in another part to profit from it.\nThese so called "Scavengers" are often blinded by greed and have long forgotten their once lofty ideals. The annoying thing being that they are now quite good at robbing the Inventium's visitors without being noticed. You were sadly one of their victims today and you can't realistically go and accuse every Mage here of petty robbery without creating a difficult situation."
 PoD_inventium.3.a: "Astral pick pocketing? Seriously?"


 PoD_court_of_muses.teach: "Teach me, O Muse."
 PoD_court_of_muses.decline: "I must politely decline"

 PoD_court_of_muses.1.t: "Clio, Muse of History"
 PoD_court_of_muses.1.desc: "The Courts of the Muses has suffered a great deal with the almost complete extinction of Classical Hellenic belief. Still, while their realm gets smaller every day, the nine daughters of Zeus still practice their art, hoping that their passion will stave off Oblivion for a little longer.\nClio is the Muse of History and she is more than willing to teach you her favorite subject. Still, as spiritual entities, it's likely that such a teaching will have a profound impact on how you view the world around you."

 PoD_court_of_muses.2.t: "Melpomene, Muse of Tragedy"
 PoD_court_of_muses.2.desc: "The Courts of the Muses has suffered a great deal with the almost complete extinction of Classical Hellenic belief. Still, while their realm gets smaller every day, the nine daughters of Zeus still practice their art, hoping that their passion will stave off Oblivion for a little longer.\nMelpomene is the Muse of Tragedy and she is more than willing to teach you her favorite subject. Still, as spiritual entities, it's likely that such a teaching will have a profound impact on how you view the world around you."
 
 PoD_court_of_muses.3.t: "Thalia, Muse of Comedy"
 PoD_court_of_muses.3.desc: "The Courts of the Muses has suffered a great deal with the almost complete extinction of Classical Hellenic belief. Still, while their realm gets smaller every day, the nine daughters of Zeus still practice their art, hoping that their passion will stave off Oblivion for a little longer.\nThalia is the Muse of Comedy and she is more than willing to teach you her favorite subject. Still, as spiritual entities, it's likely that such a teaching will have a profound impact on how you view the world around you."


 PoD_court_of_muses.200.t: "Musing with the Muses"
 PoD_court_of_muses.200.desc: "The Courts of the Muses has suffered a great deal with the almost complete extinction of Classical Hellenic belief. Still, while their realm gets smaller every day, the nine daughters of Zeus still practice their art, hoping that their passion will stave off Oblivion for a little longer.\nThe Muses are friendly and often lonely. As such, they ask for you to spend a little time with them as they narrate great tales of Classical Greece to you, offering a reward if you do. Their tales are perhaps a little too much enchanting however, you find yourself drifting from yourself from time to time while listening."
 PoD_court_of_muses.200.a: "An amulet? You shouldn't have."
 PoD_court_of_muses.200.b: "This hammer belonged to great heroes?"
 PoD_court_of_muses.200.c: "This can control the weather?"
 PoD_court_of_muses.200.d: "What an interesting mask. Thank you, my ladies." 



 PoD_city_of_brass.1.t: "Unfriendly Hosts"
 PoD_city_of_brass.1.desc: "The [UmbraGlossary('city_of_brass')] is the home of the Djinn and their most powerful citadels. These spirits are notoriously unfriendly to visitors following some nasty dealings with Mages in the past. To make matters worse, they are known as compulsive liars.\nThe Djinn have sensed your approach and have cornered you, asking why they should wander their fabulous home freely. Clearly, you could spare a "token of appreciation" for your hosts..."
 PoD_city_of_brass.1.a: "Greedy spirits..."
 PoD_city_of_brass.1.effect.success.desc: "The Djinn let you continue" 
 PoD_city_of_brass.1.success: "The Djinn let you continue"
 PoD_city_of_brass.1.failure.effect.desc: "A border tax..."
 PoD_city_of_brass.1.failure: "You have to pay the price"
 
 PoD_city_of_brass.2.t: "Lying Djinn"
 PoD_city_of_brass.2.desc: "The [UmbraGlossary('city_of_brass')] is the home of the Djinn and their most powerful citadels. These spirits are notoriously unfriendly to visitors following some nasty dealings with Mages in the past. To make matters worse, they are known as compulsive liars.\nThe Djinn have taken an interest in you and have coerced you into one of their infamous riddle games. If you don't want to look bad to your not so friendly hosts, you will have to guess the answer right. Which is made harder by the fact that even the rules are lying..."
 PoD_city_of_brass.2.a: "Lying spirits..."
 PoD_city_of_brass.2.effect.success.desc: "You guessed right!" 
 PoD_city_of_brass.2.success: "You guessed right!"
 PoD_city_of_brass.2.failure.effect.desc: "You guessed wrong..."
 PoD_city_of_brass.2.failure: "You guessed wrong..."
  
 PoD_city_of_brass.3.t: "Gambling Djinn"
 PoD_city_of_brass.3.desc: "The [UmbraGlossary('city_of_brass')] is the home of the Djinn and their most powerful citadels. These spirits are notoriously unfriendly to visitors following some nasty dealings with Mages in the past. To make matters worse, they are known as compulsive liars.\nThe Djinn's Caliph, al-Dimiryat, has invited you to a game of luck with high stakes; if you win, you get a part of the fabled Djinn's treasure. There is obviously a catch though, the game is loaded against you and the Caliph actually invents the rules on the fly. But if there is a tiny possibility that you could actually win... maybe it would be worth it?"
 PoD_city_of_brass.3.a: "I'm feeling lucky"
 PoD_city_of_brass.3.b: "Lady Luck is too fickle"

 PoD_city_of_brass.200.t: "Bargaining with Djinn"
 PoD_city_of_brass.200.desc: "The [UmbraGlossary('city_of_brass')] is the home of the Djinn and their most powerful citadels. These spirits are notoriously unfriendly to visitors following some nasty dealings with Mages in the past. To make matters worse, they are known as compulsive liars.\nThe clever spirits have been hoarding artifacts for a long time now and enjoy displaying them to their guests. They are also fond of a good haggling and could be convinced to part with some of them for a price."
 PoD_city_of_brass.200.a: "Interesting book."
 PoD_city_of_brass.200.b: "A cloak? How regal."
 PoD_city_of_brass.200.c: "This lance seems well balanced."
 PoD_city_of_brass.200.d: "Let's look at this little piece." 


 PoD_elemental_courts.1.t: "Watered Down"
 PoD_elemental_courts.1.desc: "The [UmbraGlossary('elemental_courts')] are reflections of the elemental systems within the [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. The entrance to the Courts are the Five Gates, which can be found mid-way on a Spire. While there are numerous elementals and many more form with the rapid changes brought by human society, only five are stable enough to be considered Courts.\nAssociated with the liquid state of matter, emotion, the West and the Primordial Essence, the inhabitants of the realm often concern themselves with the general situation of visitors, by involving themselves with their feelings and viewpoints. It can be a very relaxing experience, or a cruel reminder that such tranquility doesn't really exist anywhere else."
 PoD_elemental_courts.1.a: "So calm..."
 PoD_elemental_courts.1.b: "I have to move on."
  
 PoD_elemental_courts.2.t: "Freshening by Air"
 PoD_elemental_courts.2.desc: "The [UmbraGlossary('elemental_courts')] are reflections of the elemental systems within the [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. The entrance to the Courts are the Five Gates, which can be found mid-way on a Spire. While there are numerous elementals and many more form with the rapid changes brought by human society, only five are stable enough to be considered Courts.\nAssociated with the gaseous state of matter, thought, the East and the Dynamic Essence, the lords of Air are among the more receptive elementals and often confront the intellect of a visitor with riddles and similar techniques."
 PoD_elemental_courts.2.a: "I'm the riddle master!"
 PoD_elemental_courts.2.b: "Riddles are dumb."
   
 PoD_elemental_courts.3.t: "Anger Leads to..."
 PoD_elemental_courts.3.desc: "The [UmbraGlossary('elemental_courts')] are reflections of the elemental systems within the [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. The entrance to the Courts are the Five Gates, which can be found mid-way on a Spire. While there are numerous elementals and many more form with the rapid changes brought by human society, only five are stable enough to be considered Courts.\nAssociated with the plasmic state of matter, intuition, the South and the Questing Essence, the inhabitants of this realm are brash and direct, expecting visitors to state their business and get on with it. Fights are commonplace here and the realm's inhabitants are happy to teach any newcomer a lesson or two about reckless brutality."
 PoD_elemental_courts.3.a: "I'm fired up enough for this!"
 PoD_elemental_courts.3.b: "Violence is not the answer."