l_english:
 
 POD_spirit_travel.1300.t: "Dream is my Reality"
 POD_spirit_travel.1300.desc: "The Periphery can be a beautiful place at times. When humanity dreams and hopes, the material world's reflection on the Periphery is as beautiful as it can ever be, soothing any visitors with a warm sensation of peace and safety.\nDreams never last however, and these fleeting moments are best savored whenever you can."
 POD_spirit_travel.1300.a: "So calm..."
 POD_spirit_travel.1300.b: "It's not soothing. It's boring!"
 
 POD_spirit_travel.1301.t: "Gateways to Dreams"
 POD_spirit_travel.1301.desc: "The most Dreamlike area of the [umbra|E], the Periphery represents this strange state of not complete consciousness between sleeping and full awakening.\nAs such, it is a very strange place, similar to the material world but not quite. It is where people hope, pray or fear for tomorrow. It is bliss and pain at the same time, and it would be easy to get lost in those extreme sensations."
 POD_spirit_travel.1301.a: "Better move on..."
 POD_spirit_travel.1301.b: "Life is a struggle."

 POD_spirit_travel.1302.t: "Intruding on Dreams"
 POD_spirit_travel.1302.desc: "Almost everyone has access to the Periphery in a way, since it's where dreams are formed and given substance. For a practiced [umbra|E] traveler (such as yourself) it is not very difficult to intrude on other people's dreams. There is no way to know who exactly you are messing with though, so it's really a shot in the dark."
 POD_spirit_travel.1302.a: "Bad sleep incoming!"
 POD_spirit_travel.1302.b: "Let's not be mean."

 POD_spirit_travel.1400.t: "You See Dead People"
 POD_spirit_travel.1400.desc: "The [UmbraGlossary('shadowlands')] are a dry and hopeless place, even for wraiths. All beings here are condemned to a slow agony until their inevitable descent into [UmbraGlossary('oblivion')]. It's hard to not feel haunted by the surrounding despair and staying for long will take its toll on even the hardiest of souls."
 POD_spirit_travel.1400.a: "I must move on."
 POD_spirit_travel.1400.b: "Hello darkness my old friend!"
 
 POD_spirit_travel.1401.t: "Cemetery of Civilizations"
 POD_spirit_travel.1401.desc: "Death waits for no one and the [UmbraGlossary('shadowlands')] are full of wraiths from foreign (or even long gone) civilizations. Some of them can be quite talkative about their past culture and welcome a conversation partner willing to learn about it. Nostalgia is a strong feeling for the lost and damned.\nAs you listen to one such wraith, your minds wanders and you can almost feel yourself living in that time and place alongside them..."
 POD_spirit_travel.1401.a: "Time for a change!"
 POD_spirit_travel.1401.b: "I'm fine with who I am."
 
 dead_insight_modifier: "Insight from the Grave"
 dead_insight_modifier_desc: "You know the wisdom of long gone scholars. But you also reek of death and instinctively repulse anyone coming close to you."
 
 POD_spirit_travel.1402.t: "Knowledge from Beyond"
 POD_spirit_travel.1402.desc: "The lost souls confined to the [UmbraGlossary('shadowlands')] come from all corners of the Earth and you can find a surprising amount of insight from them. Wraiths are notoriously cagey however and actually learning from them takes no small amount of effort. If you are willing to stay a little longer in the Kingdom of the Dead, you might convince some of them to teach you some useful knowledge."
 POD_spirit_travel.1402.a: "I have time."
 POD_spirit_travel.1402.b: "I won't overstay my welcome."
  

 

  

  


 POD_spirit_travel.1600.t: "Overload"
 POD_spirit_travel.1600.desc: "The Astral Plane is the realm of ideas, thoughts and inventions. Clearly a great place to learn a lot... but perhaps too much of a great place actually. There is so much to take in here, unexplored possibilities, crazy potential... the human brain is just not made for that kind of limitless exploration. You can feel yourself drifting away, slowly losing yourself to this infinity..."
 POD_spirit_travel.1600.a: "So many possibilities!"
 POD_spirit_travel.1600.b: "I must focus..."
  
 mind_blown_modifier: "Mind Blown"
 mind_blown_modifier_desc: "You see everything!"
 
 POD_spirit_travel.1601.t: "Rationality"
 POD_spirit_travel.1601.desc: "The Astral Plane is a complete representation of the limitless potential of ideas and thoughts. Everything is possible to the learned visitor if they have the willpower to stay and listen. This ethereal and formless amalgam of ideas has little patience for silly concepts such as "sociability" however and each time you learn something, you can feel yourself more and more annoyed at the prospect of having to talk to other beings at some point again."
 POD_spirit_travel.1601.a: "Who needs friends?"
 POD_spirit_travel.1601.b: "I know enough."
   
 POD_spirit_travel.1602.t: "Redirection"
 POD_spirit_travel.1602.desc: "There are too many ideas floating in the [UmbraGlossary('astral_plane')] for you to explore but there might be another option to consider in order to exploit the potential of this place. Ideas love to find a new "home" in the material world and, with the proper willpower, you might be able to gently push one into the dreams and thoughts of a person close to you. Then, who knows what might result of this "sudden" inspiration?"
 POD_spirit_travel.1602.a: "I will guide you to your new host."
 POD_spirit_travel.1602.b: "I'm not a muse."
     
 POD_spirit_travel.1700.t: "The River of Language"
 POD_spirit_travel.1700.desc: "Inside the [UmbraGlossary('vulgate')] can be found the River of Language. As its name would imply, this river is a spiritual representation of mankind's many languages. You have heard from a passing spirit that the further up the river you go, the more ancient the languages found there are.\nYou could try to drink from it at those specific points to obtain some lost knowledge, but instantly learning an ancient tongue can be quite costly to the mind."
 POD_spirit_travel.1700.a: "Here maybe?"
 POD_spirit_travel.1700.b: "This place looks like the Nile."
 POD_spirit_travel.1700.c: "Interesting small effluent here."
 POD_spirit_travel.1700.d: "Nothing interesting."

 POD_spirit_travel.1701.t: "Dumbing Down"
 POD_spirit_travel.1701.desc: "The [UmbraGlossary('vulgate')] is where the most basic impressions and ideas are given form. Things like a chair, the sky being above people and other simple concepts that humanity doesn't think about too much and takes for granted. As such, this place is quite peaceful and appeasing but not very stimulating intellectually. You could easily get lost drifting away, thinking simple thoughts, if you are not careful."
 POD_spirit_travel.1701.a: "Fire is hot."
 POD_spirit_travel.1701.b: "Time to think about the politics in my realm."

 vulgate_confused_modifier: "Confused"
 vulgate_confused_modifier_desc: "That doesn't make any sense... does it?"

 vulgate_understanding_modifier: "Strange Understanding"
 vulgate_understanding_modifier_desc: "It makes sense I guess?"
 
 POD_spirit_travel.1702.t: "Low Philosophy"
 POD_spirit_travel.1702.desc: "As the place where the most basic ideas and concepts of humankind are taking form, the [UmbraGlossary('vulgate')] is home to some... peculiar spirits. These "philosophers" have had an eternity to ponder the most simple truths of the universe and then came up with some "interesting" solutions.\nYou made the mistake of being caught in one of their arguments and are completely baffled about the way they are making simple ideas sound so complex. Philosophers are the same everywhere it seems."
 POD_spirit_travel.1702.a: "I was wrong all along!"
 POD_spirit_travel.1702.b: "That doesn't make any sense!"
 POD_spirit_travel.1702.c: "I guess it makes some kind of sense..."

 POD_spirit_travel.1800.t: "Peace and Quiet"
 POD_spirit_travel.1800.desc: "Resembling the Himalayas they call their home, the tribal homelands of the Stargazers is a place of self reflection covered with majestic and peaceful landscapes as far as the eye can see. For a member of this tribe it is well and truly home, the place where they can find themselves and finally understand their inner truth."
 POD_spirit_travel.1800.a: "The truth is here."
 
 POD_spirit_travel.1801.t: "The Five Tests"
 POD_spirit_travel.1801.desc: "The Tribal Homelands of the Stargazers is a place of contemplation, but also a place designed to test the Garou both physically and mentally. As a Stargazer yourself, you are welcomed to try any of the five training courses. You know very well that you are expected to fail a lot along the way however, which might not be the most prestigious thing for your brethren to see."
 POD_spirit_travel.1801.a: "My knowledge is great."
 POD_spirit_travel.1801.b: "I can outsmart the $glossary_wyrm$."
 POD_spirit_travel.1801.c: "My caern is in order."
 POD_spirit_travel.1801.d: "When I talk, they listen."
 POD_spirit_travel.1801.e: "I can lead us to victory."
 POD_spirit_travel.1801.f: "I'm not ready yet."

 POD_spirit_travel.1802.t: "Unwelcome Visitor"
 POD_spirit_travel.1802.desc: "The Tribal Homelands of the Stargazers isn't a friendly place to outsiders of the tribe like yourself. While its inhabitants aren't outright hostile, they make a point of misleading you and keeping you away from the really important places in the realm. Even simple discussions with them end up with you feeling more confused after their answers than you were before asking your questions."
 POD_spirit_travel.1802.a: "I shouldn't stay here for long."
 
 POD_spirit_travel.1900.t: "Love is a Mountain"
 POD_spirit_travel.1900.desc: "The [UmbraGlossary('spires')] act as a passageway between the [UmbraGlossary('vulgate')] and the Epiphamies. It is a chain of very high mountains each representing one of the core concepts experienced by humanity since the dawn of time. To navigate the Spires, you have to metaphorically climb one of those mountains, relying on your own vision and interpretation of the concept associated with it.\nLuck has it that you started your journey near the spiritual representation of love, which is now testing your knowledge of this difficult subject."
 POD_spirit_travel.1900.a: "I know a thing or two about love..."
 POD_spirit_travel.1900.b: "Love is a lie!"
 love_spires_tt: "As you have at least one lover or soulmate, you can stay in the [UmbraGlossary('spires')] unharmed."
 unlove_spires_tt: "As you don't have at least one lover or soulmate, you are mentally drained by your stay in the [UmbraGlossary('spires')]."

 POD_spirit_travel.1901.t: "Mountain of War"
 POD_spirit_travel.1901.desc: "The [UmbraGlossary('spires')] act as a passageway between the [UmbraGlossary('vulgate')] and the Epiphamies. It is a chain of very high mountains each representing one of the core concepts experienced by humanity since the dawn of time. To navigate the Spires, you have to metaphorically climb one of those mountains, relying on your own vision and interpretation of the concept associated with it.\nLuck has it that you started your journey near the spiritual representation of war, which is now testing your knowledge of this difficult subject."
 POD_spirit_travel.1901.a: "I know a thing or two about war..."
 POD_spirit_travel.1901.b: "I employ other people to make war."
 war_spires_tt: "As you have at least a good knowledge of martial matters, you can stay in the [UmbraGlossary('spires')] unharmed."
 unwar_spires_tt: "As you don't have at least a good knowledge of martial matters, you are mentally drained by your stay in the [UmbraGlossary('spires')]."

 POD_spirit_travel.1902.t: "Climbing your Destiny"
 POD_spirit_travel.1902.desc: "The [UmbraGlossary('spires')] act as a passageway between the [UmbraGlossary('vulgate')] and the Epiphamies. It is a chain of very high mountains each representing one of the core concepts experienced by humanity since the dawn of time. To navigate the Spires, you have to metaphorically climb one of those mountains, relying on your own vision and interpretation of the concept associated with it.\nLuck has it that you started your journey near the spiritual representation of destiny, which is now testing your knowledge of this difficult subject."
 POD_spirit_travel.1902.a: "I know a thing or two about fate..."
 POD_spirit_travel.1902.b: "Can you repeat the question?"
 destiny_spires_tt: "As you have at least a good knowledge of scholarly matters, you can stay in the [UmbraGlossary('spires')] unharmed."
 undestiny_spires_tt: "As you don't have at least a good knowledge of scholarly matters, you are mentally drained by your stay in the [UmbraGlossary('spires')]."

 POD_spirit_travel.2000.t: "Celestial Bouncers"
 POD_spirit_travel.2000.desc: "Once an open ground for adventurers and spiritual philosophers, the [UmbraGlossary('grand_hall')] has been taken over during the first century C.E. by a race of mysterious sentinels. Their primary purpose seems to make sure that people don't loiter around in the [UmbraGlossary('grand_hall')] like they used to. Basically, do your business here and then move on is their motto.\nTheir presence and their constant suspicious looks at you make this otherwise pleasant realm a more stressful stay than you anticipated."
 POD_spirit_travel.2000.a: "I won't stay for long, promise"
 
 POD_spirit_travel.2001.t: "Wandering Around"
 POD_spirit_travel.2001.desc: "The [UmbraGlossary('grand_hall')] is actually quite a misnomer. It's mostly a very large maze of corridors in a Classical Mediterranean style. As with most things in the [umbra|E], it is also constantly shifting, meaning that you can wander around quite possibly forever and still discover new things. Some of the potential discoveries aren't as benign as the others though, so you never know what will be the ultimate result of such wandering in the end."
 POD_spirit_travel.2001.a: "I feel lucky."
 POD_spirit_travel.2001.b: "I will stay put for now, thanks."

 POD_spirit_travel.2002.t: "The Fountain"
 POD_spirit_travel.2002.desc: "In a large nexus chamber, a dozen hallways meet. In the center of that space, a fountain is surrounded by very lifelike figures encased in stone. One of the sentinels, the self appointed guardians of this realm, explains to you that these statues were once visitors that thought they were above the sentinels' laws for this place. Evidently, they were wrong.\nThe sentinel concludes his story by advising you to not show the same arrogance."
 POD_spirit_travel.2002.a: "A quaint little story."
 POD_spirit_travel.2002.b: "I would have crushed them!"

 mirror_zone_modifier: "Experienced the Mirror Zone"
 mirror_zone_modifier_desc: "You have seen too many disturbing things in the Mirror Zone to still be bothered by mundane issues."

 POD_spirit_travel.2100.t: "Facing the Mirror"
 POD_spirit_travel.2100.desc: "Always moving between realms, the Mirror Zone is a disturbing presence in the [umbra|E]. It causes localized hallucinations that are at once impossible and highly personal. Past lovers, dead enemies, and other personal relations all await you inside.\nMercifully, these hallucinations are just temporary and can actually be a good way to reinforce your psyche for the trials ahead. Still, right here and now, it would take quite a toll on your sanity."
 POD_spirit_travel.2100.a: "I will brave the ghosts of my past."
 POD_spirit_travel.2100.b: "Avoiding them seems safer."

 POD_spirit_travel.2101.t: "Mirroring Possibilities"
 POD_spirit_travel.2101.desc: "The mysterious Mirror Zone is fond of showing its "guests" what could have been. The infinite tapestry of possibilities that would emerge from a simple different choice somewhere in your life. Alarmingly, it is also known to try to force those alternative realities into the visitors for some kind of astral perverse amusement.\nFacing one of the mirrors, you see yourself as a great general even during your earlier days, one that has never known defeat and will always be remembered by History."
 POD_spirit_travel.2101.a: "...it's true isn't it?"
 POD_spirit_travel.2101.b: "Wait, that's not me!"

 POD_spirit_travel.2102.desc: "The mysterious Mirror Zone is fond of showing its "guests" what could have been. The infinite tapestry of possibilities that would emerge from a simple different choice somewhere in your life. Alarmingly, it is also known to try to force those alternative realities into the visitors for some kind of astral perverse amusement.\nFacing one of the mirrors, you see yourself as a great diplomat even during your earlier days, one that could always get their way and will always be remembered by History."

 POD_spirit_travel.2200.t: "Paths of the Wyck"
 POD_spirit_travel.2200.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens."
 POD_spirit_travel.2200.a: "At least it's not dangerous."
 
 POD_spirit_travel.2201.t: "Walking Alone"
 POD_spirit_travel.2201.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens.\nIt feels like you have been going on here for days now and there is nothing to do but still walking, and walking, and walking..."
 POD_spirit_travel.2201.a: "I find it quite refreshing actually."
 POD_spirit_travel.2201.b: "Boooring"

 POD_spirit_travel.2202.t: "Astral Workout"
 POD_spirit_travel.2202.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens.\nIt feels like you have been going on here for days now and there is nothing to do but still walking, and walking, and walking... At least, it's a good workout if nothing else."
 POD_spirit_travel.2202.a: "One, two, one, two..."

 POD_spirit_travel.2300.t: "Happy Days"
 POD_spirit_travel.2300.desc: "Epiphamies embody concepts of complete abstraction and often materialize as colorful clouds in the umbral sky of the [UmbraGlossary('vulgate')].\nBy a stroke of good fortune, you reached the [UmbraGlossary('epiphamy')] of Happiness. Drifting away in a pleasantly plump cloud, you are feeling more invigorated and, well, happy that you ever did in your whole life."
 POD_spirit_travel.2300.a: "Not a care in the world!"
 POD_spirit_travel.2300.b: "Happiness is overrated. Back to work."

 epiphamie_love_modifier: "Happy Days"
 epiphamie_love_modifier_desc: "Why should you care about anything? You are happy!"

 POD_spirit_travel.2301.t: "Ex Nihilo"
 POD_spirit_travel.2301.desc: "Epiphamies embody concepts of complete abstraction and often materialize as colorful clouds in the umbral sky of the [UmbraGlossary('vulgate')].\nBy a stroke of misfortune, you reached the [UmbraGlossary('epiphamy')] of Oblivion. Ending up in a storm of black and foreboding clouds, you can barely extract yourself before being pulled in to become a part of this ever hungry Epiphamy."
 POD_spirit_travel.2301.a: "I lost a part of myself."
 POD_spirit_travel.2301.b: "That was too close..."
 POD_spirit_travel.2301.c: "Hello darkness my old friend!"

 POD_spirit_travel.2302.t: "Astral Glory"
 POD_spirit_travel.2302.desc: "Epiphamies embody concepts of complete abstraction and often materialize as colorful clouds in the umbral sky of the [UmbraGlossary('vulgate')].\nBy a stroke of good fortune, you reached the [UmbraGlossary('epiphamy')] of Glory. Surrounded by somehow regal looking clouds, you can find yourself standing taller than before, your powerful gaze forcing the respect of those around you."
 POD_spirit_travel.2302.a: "You may address me as 'your majesty'."
 
 POD_spirit_travel.2400.t: "Technobabble"
 POD_spirit_travel.2400.desc: "The [UmbraGlossary('inventium')] is a realm full of every invention humankind has ever dreamed of. A group of Mages, heirs to the ones who found this place, control this realm in part in the hopes of advancing human knowledge, in another part to profit from it.\nToday, you are cornered by one of their eccentric members that is rambling about their latest fancy. While not very well structured, you can almost see the brilliance behind his theories... or the sheer madness."
 POD_spirit_travel.2400.a: "It makes perfect sense!"
 POD_spirit_travel.2400.b: "If you please excuse me..."
 POD_spirit_travel.2400.c: "Dear colleague, you are making some key mistakes..."

 POD_spirit_travel.2401.t: "Tools of the Trade"
 POD_spirit_travel.2401.desc: "The [UmbraGlossary('inventium')] is a realm full of every invention humankind has ever dreamed of. A group of Mages, heirs to the ones who found this place, control this realm in part in the hopes of advancing human knowledge, in another part to profit from it.\nToday, you found a strange set of apparently quite advanced tools. While you are not in the mood to build new things, you can still use these to put some polish on your existing inventory."
 POD_spirit_travel.2401.a: "As good as new!"
 
 POD_spirit_travel.2402.t: "Robber Scholars"
 POD_spirit_travel.2402.desc: "The [UmbraGlossary('inventium')] is a realm full of every invention humankind has ever dreamed of. A group of Mages, heirs to the ones who found this place, control this realm in part in the hopes of advancing human knowledge, in another part to profit from it.\nThese so called "Scavengers" are often blinded by greed and have long forgotten their once lofty ideals. The annoying thing being that they are now quite good at robbing the Inventium's visitors without being noticed. You were sadly one of their victims today and you can't realistically go and accuse every Mage here of petty robbery without creating a difficult situation."
 POD_spirit_travel.2402.a: "Astral pick pocketing? Seriously?"
 
 POD_spirit_travel.2500.t: "Clio, Muse of History"
 POD_spirit_travel.2500.desc: "The Courts of the Muses has suffered a great deal with the almost complete extinction of Classical Hellenic belief. Still, while their realm gets smaller every day, the nine daughters of Zeus still practice their art, hoping that their passion will stave off Oblivion for a little longer.\nClio is the Muse of History and she is more than willing to teach you her favorite subject. Still, as spiritual entities, it's likely that such a teaching will have a profound impact on how you view the world around you."
 POD_spirit_travel.2500.a: "Teach me, O Muse."
 POD_spirit_travel.2500.b: "I must politely decline."

 POD_spirit_travel.2501.t: "Melpomene, Muse of Tragedy"
 POD_spirit_travel.2501.desc: "The Courts of the Muses has suffered a great deal with the almost complete extinction of Classical Hellenic belief. Still, while their realm gets smaller every day, the nine daughters of Zeus still practice their art, hoping that their passion will stave off Oblivion for a little longer.\nMelpomene is the Muse of Tragedy and she is more than willing to teach you her favorite subject. Still, as spiritual entities, it's likely that such a teaching will have a profound impact on how you view the world around you."
 
 POD_spirit_travel.2502.t: "Thalia, Muse of Comedy"
 POD_spirit_travel.2502.desc: "The Courts of the Muses has suffered a great deal with the almost complete extinction of Classical Hellenic belief. Still, while their realm gets smaller every day, the nine daughters of Zeus still practice their art, hoping that their passion will stave off Oblivion for a little longer.\nThalia is the Muse of Comedy and she is more than willing to teach you her favorite subject. Still, as spiritual entities, it's likely that such a teaching will have a profound impact on how you view the world around you."
 
 POD_spirit_travel.2600.t: "Unfriendly Hosts"
 POD_spirit_travel.2600.desc: "The [UmbraGlossary('city_of_brass')] is the home of the Djinns and their most powerful citadels. These spirits are notoriously unfriendly to visitors following some nasty dealings with Mages in the past. To make matters worse, they are known as compulsive liars.\nThe Djinns have sensed your approach and have cornered you, asking why they should wander their fabulous home freely. Clearly, you could spare a "token of appreciation" for your hosts..."
 POD_spirit_travel.2600.a: "Greedy spirits..."
 POD_spirit_travel.2600.effect.success.desc: "The Djinns let you continue" 
 POD_spirit_travel.2600.success: "The Djinns let you continue"
 POD_spirit_travel.2600.failure.effect.desc: "A border tax..."
 POD_spirit_travel.2600.failure: "You have to pay the price"
 
 POD_spirit_travel.2601.t: "Lying Djinns"
 POD_spirit_travel.2601.desc: "The [UmbraGlossary('city_of_brass')] is the home of the Djinns and their most powerful citadels. These spirits are notoriously unfriendly to visitors following some nasty dealings with Mages in the past. To make matters worse, they are known as compulsive liars.\nThe Djinns have taken an interest in you and have coerced you into one of their infamous riddle games. If you don't want to look bad to your not so friendly hosts, you will have to guess the answer right. Which is made harder by the fact that even the rules are lying..."
 POD_spirit_travel.2601.a: "Lying spirits..."
 POD_spirit_travel.2601.effect.success.desc: "You guessed right!" 
 POD_spirit_travel.2601.success: "You guessed right!"
 POD_spirit_travel.2601.failure.effect.desc: "You guessed wrong..."
 POD_spirit_travel.2601.failure: "You guessed wrong..."
  
 POD_spirit_travel.2602.t: "Gambling Djinnis"
 POD_spirit_travel.2602.desc: "The [UmbraGlossary('city_of_brass')] is the home of the Djinnis and their most powerful citadels. These spirits are notoriously unfriendly to visitors following some nasty dealings with Mages in the past. To make matters worse, they are known as compulsive liars.\nThe Djinn's Caliph, al-Dimiryat, has invited you to a game of luck with high stakes; if you win, you get a part of the fabled Djinn's treasure. There is obviously a catch though, the game is loaded against you and the Caliph actually invents the rules on the fly. But if there is a tiny possibility that you could actually win... maybe it would be worth it?"
 POD_spirit_travel.2602.a: "I'm feeling lucky"
 POD_spirit_travel.2602.b: "Lady Luck is too fickle"
  

  

  

  
     




   

  

 

   

    

    

         

      

  

   



 

  
 
    

  


   

  
 POD_spirit_travel.5200.t: "Prideful Prisoners"
 POD_spirit_travel.5200.desc: "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen.\nFor those trapped here, there is no escape from the constant torment except in self repentance and atonement. In this endless void, this might be the only path to keep your sanity in check for a while longer."
 POD_spirit_travel.5200.a: "I made mistakes..."
       
 POD_spirit_travel.5201.t: "Zealous Prisoners"
   
 POD_spirit_travel.5202.t: "Godly Punishment"
 POD_spirit_travel.5202.desc: "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen.\nThe demons inside are left to rot in their own regrets, despair, and impotent fury and the machinations and manipulations of the infernal rulers are nothing but insane mind games, since the Fallen can't hurt or destroy each other. Being trapped in one of those machinations is a sure way to quickly lose yourself."
 POD_spirit_travel.5202.a: "What else can I do?"
    
 POD_spirit_travel.5300.t: "Stubborn Order"
 POD_spirit_travel.5300.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nTo thrive and understand this place, you must be in the right mindset, someone who values order and precision above all else."
 POD_spirit_travel.5300.a: "Sounds like my kind of place!"
 POD_spirit_travel.5300.b: "I don't like this place..."
  
 POD_spirit_travel.5301.t: "Astral Solitude"
 POD_spirit_travel.5301.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nNo signs of life exist here, making it the perfect place for shy characters... but not exactly the same for people actually enjoying having some company."
   
 POD_spirit_travel.5302.t: "Astral Diligence"
 POD_spirit_travel.5302.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nColossal $glossary_weaver$ spirits such as ‘star spiders’ patrol and maintain the web and ensure everything remains in its ordained place. There is no place for laziness here and everything follows its intended course as diligently as possible."
     
 POD_spirit_travel.5400.t: "Fickle Nature"
 POD_spirit_travel.5400.desc: "The [UmbraGlossary('wyld_reaches')] are a place of chaos. Here, Nature rules unbridled and the entire realm is constantly shifting. Only individuals with particularly adaptive minds can thrive here."
     
 POD_spirit_travel.5401.t: "Natural Friends"
 POD_spirit_travel.5401.desc: "The [UmbraGlossary('wyld_reaches')] Reaches are populated by all manner of spiritual creatures. While some are hostile, you can find some intriguing and friendly enough conversation partners in here if you wish."
     
 POD_spirit_travel.5402.t: "Natural Rush"
 POD_spirit_travel.5402.desc: "The [UmbraGlossary('wyld_reaches')] Reaches are a place of chaos.\nNature waits for no man here. As the landscape shifts and changes around you all the time, you have to adapt your mindset to this truth if you want to survive in this realm. This might not be possible for everyone."
     
 POD_spirit_travel.5500.t: "Realm of Pain"
 POD_spirit_travel.5500.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nA place of pain and madness, only the most jaded souls can thrive here."
     
 POD_spirit_travel.5501.t: "Realm of Hatred"
 POD_spirit_travel.5501.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nThe worst emotions are free and prospering here. Hatred will feed hatred."
     
 POD_spirit_travel.5502.t: "Realm of Deceit"
 POD_spirit_travel.5502.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nThoughts of betrayal constantly cross your mind, reminding you of the many people who tried to cross you... or the ones you crossed yourself."
             
 POD_spirit_travel.5600.t: "Walking the Spiral"
 POD_spirit_travel.5600.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThis is one of the strongholds of the Wyrm where its most faithful servants, the Black Spiral Dancers, were born. For someone worshiping this entity, this is very close to a holy site in a twisted way."
 POD_spirit_travel.5600.a: "A pilgrimage of madness."
      
 POD_spirit_travel.5601.t: "Dancing the Spiral"
 POD_spirit_travel.5601.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThe Labyrinth is full of gifts for the zealous servants of the Wyrm. But dancing the spiral is a maddening prospect, one that can break even the already broken minds."
 POD_spirit_travel.5601.a: "Let's dance!"
 POD_spirit_travel.5601.b: "I don't feel like it."
     
 POD_spirit_travel.5602.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThe Labyrinth has broken the minds of entire tribes and an incalculable number of so called heroes, now zealous servants of the Wyrm. As long as you stay here, you will be subjected to the $glossary_wyrm_corruption$ at its most powerful. You should run, quickly."
 POD_spirit_travel.5602.a: "Dancing my sanity away..."
     
 POD_spirit_travel.5700.t: "Undying Glory"
 POD_spirit_travel.5700.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nWith old Egypt long gone from the mortals minds, this is maybe the last remainder of the glory that once was. Any Mummy coming here can feel the pride of their civilization, but also the sadness of its loss."
 POD_spirit_travel.5700.a: "I must stay true to Khem."
 POD_spirit_travel.5700.b: "Sorrowful pride."
 POD_spirit_travel.5700.c: "Old Egypt is dead and buried."
  
 POD_spirit_travel.5701.t: "Secrets of Khem"
 POD_spirit_travel.5701.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nMany of the deepest secrets of old Egypt can be found here, preserved by passing Mummies during their own resurrection process. For the one who takes time to read the hieroglyphs, there is much to learn."
 POD_spirit_travel.5701.a: "Secrets of the dead."
 POD_spirit_travel.5701.b: "Secrets of the soul."
 POD_spirit_travel.5701.c: "Secrets of the sky."
 POD_spirit_travel.5701.d: "I'm just passing by."
    
 POD_spirit_travel.5702.t: "The Curse of the Mummy"
 POD_spirit_travel.5702.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nThis place is meant only for the Undying of Egypt and you are not one of them. As such, ingenious traps are springing everywhere as you try to plunder the secrets of old. Each time you try to get closer to one, it retreats even farther back."
 POD_spirit_travel.5702.a: "This is a lost cause..."
   
 POD_spirit_travel.5800.t: "Secrets of the First"
 POD_spirit_travel.5800.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nAs a haven for some of the most powerful entities that ever walked upon the Earth, the First City is a repository of memories and knowledge like no other. Some truths have better left buried however, and there are things in here that could shatter the most zealous individual's faith."
 POD_spirit_travel.5800.a: "The path of giants..."
 POD_spirit_travel.5800.b: "This is too dangerous."

 POD_spirit_travel.5801.t: "War for Enoch"
 POD_spirit_travel.5801.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nEnoch is a battlefield between the forces of the wraithly Empire of Stygia and the secretive vampiric Tal'mahe'Ra. Each night, battles are fought over the contested districts of the once great city."
 POD_spirit_travel.5801.a: "A worthwhile endeavor!"
 POD_spirit_travel.5801.effect.success.desc: "You fight bravely and learn about martial matters." 
 POD_spirit_travel.5801.success: "A good battle!"
 POD_spirit_travel.5801.failure.effect.desc: "You run away battered."
 POD_spirit_travel.5801.failure: "Not worth it..."
   
 POD_spirit_travel.5802.t: "The Dread Palace Ghemal"
 POD_spirit_travel.5802.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nThe High House of Caine, known as the Dread Palace Ghemal, stands in the very center of the city. Just an echo of the real place obviously but still a very impressive sight. And a dreadful one as well as you can almost feel the presence of the Dark Father in this place so long ago..."
 POD_spirit_travel.5802.a: "He isn't there right?"

 POD_spirit_travel.5403.t: "Friendly Chaos"
 POD_spirit_travel.5403.desc: "The [UmbraGlossary('wyld_reaches')] are populated by all manner of spirits. In constant motion, they create, evolve and die at a breakneck speed. Some of those creations could be useful if you managed to force these spirits to just slow down a little. This might take a bit of groveling to convince them but the result will probably be worth it, though you can't be sure."
 POD_spirit_travel.5403.a: "A Klaive is always useful!"
 POD_spirit_travel.5403.b: "What a strange pouch."
 POD_spirit_travel.5403.c: "What does this needle do?"
 POD_spirit_travel.5403.d: "Such a strange contraption!"
 POD_spirit_travel.5403.e: "I don't need any of those baubles."
 

 

 
 POD_spirit_travel.2603.t: "Bargaining with Djinnis"
 POD_spirit_travel.2603.desc: "The [UmbraGlossary('city_of_brass')] is the home of the Djinnis and their most powerful citadels. These spirits are notoriously unfriendly to visitors following some nasty dealings with Mages in the past. To make matters worse, they are known as compulsive liars.\nThe clever spirits have been hoarding artifacts for a long time now and enjoy displaying them to their guests. They are also fond of a good haggling and could be convinced to part with some of them for a price."
 POD_spirit_travel.2603.a: "Interesting book."
 POD_spirit_travel.2603.b: "A cloak? How regal."
 POD_spirit_travel.2603.c: "This lance seems well balanced."
 POD_spirit_travel.2603.d: "Let's look at this little piece." 
  
 POD_spirit_travel.2503.t: "Musing with the Muses"
 POD_spirit_travel.2503.desc: "The Courts of the Muses has suffered a great deal with the almost complete extinction of Classical Hellenic belief. Still, while their realm gets smaller every day, the nine daughters of Zeus still practice their art, hoping that their passion will stave off Oblivion for a little longer.\nThe Muses are friendly and often lonely. As such, they ask for you to spend a little time with them as they narrate great tales of Classical Greece to you, offering a reward if you do. Their tales are perhaps a little too much enchanting however, you find yourself drifting from yourself from time to time while listening."
 POD_spirit_travel.2503.a: "An amulet? You shouldn't have."
 POD_spirit_travel.2503.b: "This hammer belonged to great heroes?"
 POD_spirit_travel.2503.c: "This can control the weather?"
 POD_spirit_travel.2503.d: "What an interesting mask. Thank you, my ladies." 
   

 

  

  
 POD_spirit_travel.2303.t: "Lucky Day"
 POD_spirit_travel.2303.desc: "Epiphamies embody concepts of complete abstraction and often materialize as colorful clouds in the umbral sky of the [UmbraGlossary('vulgate')].\nA strange place, many things end up lost here. But what is lost can be found again and today, lady luck is on your side. A rare item radiating with magic literally falls from one of the clouds to your feet."
 POD_spirit_travel.2303.a: "A crown! Of feathers it seems."
 POD_spirit_travel.2303.b: "A crown! Of iron I think."
 POD_spirit_travel.2303.c: "That's a damn big rock."








 

  

   

 

 
 POD_spirit_travel.5900.t: "Warring Dead"
 POD_spirit_travel.5900.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nThis conflict is going poorly for the Egyptian dead, as the [UmbraGlossary('dark_kingdom_of_iron')] vastly outnumbers them and continues to grow night after night. Still, the sons and daughters of Egypt fight on, using tactics that have been considered obsolete in the mortal world for a long time now, like chariot warfare."
 POD_spirit_travel.5900.a: "Chariots are an impressive sight to behold."
 POD_spirit_travel.5900.b: "They are outdated for a reason."
 
 POD_spirit_travel.5901.t: "Lord of the Sacred Land"
 POD_spirit_travel.5901.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nAnubis rules here and the jackal God has proven a crafty diplomat. His deals with the reclusive Charon of Stygia have allowed Neter-Khertet to receive some much needed reinforcements while not losing its independence. Ruling a realm engulfed in seemingly eternal warfare is certainly a talent you can appreciate."
 POD_spirit_travel.5901.a: "Much to learn from Osiris' son."
 POD_spirit_travel.5901.b: "War first, talks later."
 
 POD_spirit_travel.5902.t: "Garb of the Pharaoh"
 POD_spirit_travel.5902.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nDespite the deadly warfare going on, the souls of the Egyptian dead still try to adapt as best as they can, having forged this realm into an idealistic version of ancient Egypt. You encounter many skilled craftsmen, including some offering you their expertise if you were to part with some coins. A strangely normal thing to do in such a beleaguered realm."
 POD_spirit_travel.5902.a: "These clothes are fit for royalty!"
 POD_spirit_travel.5902.b: "I like my own style, thanks."
 
 POD_spirit_travel.6000.t: "Watered Down"
 POD_spirit_travel.6000.desc: "The [UmbraGlossary('elemental_courts')] are reflections of the elemental systems within the [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. The entrance to the Courts are the Five Gates, which can be found mid-way on a Spire. While there are numerous elementals and many more form with the rapid changes brought by human society, only five are stable enough to be considered Courts.\nAssociated with the liquid state of matter, emotion, the West and the Primordial Essence, the inhabitants of the realm often concern themselves with the general situation of visitors, by involving themselves with their feelings and viewpoints. It can be a very relaxing experience, or a cruel reminder that such tranquility doesn't really exist anywhere else."
 POD_spirit_travel.6000.a: "So calm..."
 POD_spirit_travel.6000.b: "I have to move on."
  
 POD_spirit_travel.6001.t: "Freshening by Air"
 POD_spirit_travel.6001.desc: "The [UmbraGlossary('elemental_courts')] are reflections of the elemental systems within the [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. The entrance to the Courts are the Five Gates, which can be found mid-way on a Spire. While there are numerous elementals and many more form with the rapid changes brought by human society, only five are stable enough to be considered Courts.\nAssociated with the gaseous state of matter, thought, the East and the Dynamic Essence, the lords of Air are among the more receptive elementals and often confront the intellect of a visitor with riddles and similar techniques."
 POD_spirit_travel.6001.a: "I'm the riddle master!"
 POD_spirit_travel.6001.b: "Riddles are dumb."
   
 POD_spirit_travel.6002.t: "Anger Leads To..."
 POD_spirit_travel.6002.desc: "The [UmbraGlossary('elemental_courts')] are reflections of the elemental systems within the [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. The entrance to the Courts are the Five Gates, which can be found mid-way on a Spire. While there are numerous elementals and many more form with the rapid changes brought by human society, only five are stable enough to be considered Courts.\nAssociated with the plasmic state of matter, intuition, the South and the Questing Essence, the inhabitants of this realm are brash and direct, expecting visitors to state their business and get on with it. Fights are commonplace here and the realm's inhabitants are happy to teach any newcomer a lesson or two about reckless brutality."
 POD_spirit_travel.6002.a: "I'm fired up enough for this!"
 POD_spirit_travel.6002.b: "Violence is not the answer."
   
  
