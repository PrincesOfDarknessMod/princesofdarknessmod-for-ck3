 POD_spirit_travel.1300.t: "Dream is my Reality"
 POD_spirit_travel.1300.desc: "The Periphery can be a beautiful place at times. When humanity dreams and hopes, the material world's reflection on the Periphery is as beautiful as it can ever be, soothing any visitors with a warm sensation of peace and safety.\nDreams never last however, and these fleeting moments are best savored whenever you can."
 POD_spirit_travel.1300.a: "So calm..."
 POD_spirit_travel.1300.b: "It's not soothing. It's boring!"
 
 POD_spirit_travel.1301.t: "Gateways to Dreams"
 POD_spirit_travel.1301.desc: "The most Dreamlike area of the [umbra|E], the Periphery represents this strange state of not complete consciousness between sleeping and full awakening.\nAs such, it is a very strange place, similar to the material world but not quite. It is where people hope, pray or fear for tomorrow. It is bliss and pain at the same time, and it would be easy to get lost in those extreme sensations."
 POD_spirit_travel.1301.a: "Better move on..."
 POD_spirit_travel.1301.b: "Life is a struggle."

 POD_spirit_travel.1302.t: "Intruding on Dreams"
 POD_spirit_travel.1302.desc: "Almost everyone has access to the Periphery in a way, since it's where dreams are formed and given substance. For a practiced [umbra|E] traveler (such as yourself) it is not very difficult to intrude on other people's dreams. There is no way to know who exactly you are messing with though, so it's really a shot in the dark."
 POD_spirit_travel.1302.a: "Bad sleep incoming!"
 POD_spirit_travel.1302.b: "Let's not be mean."

 POD_spirit_travel.1400.t: "You See Dead People"
 POD_spirit_travel.1400.desc: "The [UmbraGlossary('shadowlands')] are a dry and hopeless place, even for wraiths. All beings here are condemned to a slow agony until their inevitable descent into [UmbraGlossary('oblivion')]. It's hard to not feel haunted by the surrounding despair and staying for long will take its toll on even the hardiest of souls."
 POD_spirit_travel.1400.a: "I must move on."
 POD_spirit_travel.1400.b: "Hello darkness my old friend!"
 
 POD_spirit_travel.1401.t: "Cemetery of Civilizations"
 POD_spirit_travel.1401.desc: "Death waits for no one and the [UmbraGlossary('shadowlands')] are full of wraiths from foreign (or even long gone) civilizations. Some of them can be quite talkative about their past culture and welcome a conversation partner willing to learn about it. Nostalgia is a strong feeling for the lost and damned.\nAs you listen to one such wraith, your minds wanders and you can almost feel yourself living in that time and place alongside them..."
 POD_spirit_travel.1401.a: "Time for a change!"
 POD_spirit_travel.1401.b: "I'm fine with who I am."
 
 dead_insight_modifier: "Insight from the Grave"
 dead_insight_modifier_desc: "You know the wisdom of long gone scholars. But you also reek of death and instinctively repulse anyone coming close to you."
 
 POD_spirit_travel.1402.t: "Knowledge from Beyond"
 POD_spirit_travel.1402.desc: "The lost souls confined to the [UmbraGlossary('shadowlands')] come from all corners of the Earth and you can find a surprising amount of insight from them. Wraiths are notoriously cagey however and actually learning from them takes no small amount of effort. If you are willing to stay a little longer in the Kingdom of the Dead, you might convince some of them to teach you some useful knowledge."
 POD_spirit_travel.1402.a: "I have time."
 POD_spirit_travel.1402.b: "I won't overstay my welcome."
  

 

  

  



 


 




 mirror_zone_modifier: "Experienced the Mirror Zone"
 mirror_zone_modifier_desc: "You have seen too many disturbing things in the Mirror Zone to still be bothered by mundane issues."

 POD_spirit_travel.2100.t: "Facing the Mirror"
 POD_spirit_travel.2100.desc: "Always moving between realms, the Mirror Zone is a disturbing presence in the [umbra|E]. It causes localized hallucinations that are at once impossible and highly personal. Past lovers, dead enemies, and other personal relations all await you inside.\nMercifully, these hallucinations are just temporary and can actually be a good way to reinforce your psyche for the trials ahead. Still, right here and now, it would take quite a toll on your sanity."
 POD_spirit_travel.2100.a: "I will brave the ghosts of my past."
 POD_spirit_travel.2100.b: "Avoiding them seems safer."

 POD_spirit_travel.2101.t: "Mirroring Possibilities"
 POD_spirit_travel.2101.desc: "The mysterious Mirror Zone is fond of showing its "guests" what could have been. The infinite tapestry of possibilities that would emerge from a simple different choice somewhere in your life. Alarmingly, it is also known to try to force those alternative realities into the visitors for some kind of astral perverse amusement.\nFacing one of the mirrors, you see yourself as a great general even during your earlier days, one that has never known defeat and will always be remembered by History."
 POD_spirit_travel.2101.a: "...it's true isn't it?"
 POD_spirit_travel.2101.b: "Wait, that's not me!"

 POD_spirit_travel.2102.desc: "The mysterious Mirror Zone is fond of showing its "guests" what could have been. The infinite tapestry of possibilities that would emerge from a simple different choice somewhere in your life. Alarmingly, it is also known to try to force those alternative realities into the visitors for some kind of astral perverse amusement.\nFacing one of the mirrors, you see yourself as a great diplomat even during your earlier days, one that could always get their way and will always be remembered by History."

 POD_spirit_travel.2200.t: "Paths of the Wyck"
 POD_spirit_travel.2200.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens."
 POD_spirit_travel.2200.a: "At least it's not dangerous."
 
 POD_spirit_travel.2201.t: "Walking Alone"
 POD_spirit_travel.2201.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens.\nIt feels like you have been going on here for days now and there is nothing to do but still walking, and walking, and walking..."
 POD_spirit_travel.2201.a: "I find it quite refreshing actually."
 POD_spirit_travel.2201.b: "Boooring"

 POD_spirit_travel.2202.t: "Astral Workout"
 POD_spirit_travel.2202.desc: "At their core, the Paths of the Wyck are just a massive maze of small roads leading to almost every place in the [umbra|E] and beyond. It is quite difficult to orientate yourself in such a place but the Paths are also known to be outside the material concept of time meaning that you have, literally, all the time in the world to do so. The only issue you can run into here is dying of boredom as nothing of real interest ever happens.\nIt feels like you have been going on here for days now and there is nothing to do but still walking, and walking, and walking... At least, it's a good workout if nothing else."
 POD_spirit_travel.2202.a: "One, two, one, two..."


 

 

 

  

  

  

  
     




   

  

 

   

    

    

         

      

  

   



 

  
 
    

  


   

  
 POD_spirit_travel.5200.t: "Prideful Prisoners"
 POD_spirit_travel.5200.desc: "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen.\nFor those trapped here, there is no escape from the constant torment except in self repentance and atonement. In this endless void, this might be the only path to keep your sanity in check for a while longer."
 POD_spirit_travel.5200.a: "I made mistakes..."
       
 POD_spirit_travel.5201.t: "Zealous Prisoners"
   
 POD_spirit_travel.5202.t: "Godly Punishment"
 POD_spirit_travel.5202.desc: "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen.\nThe demons inside are left to rot in their own regrets, despair, and impotent fury and the machinations and manipulations of the infernal rulers are nothing but insane mind games, since the Fallen can't hurt or destroy each other. Being trapped in one of those machinations is a sure way to quickly lose yourself."
 POD_spirit_travel.5202.a: "What else can I do?"
    
 POD_spirit_travel.5300.t: "Stubborn Order"
 POD_spirit_travel.5300.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nTo thrive and understand this place, you must be in the right mindset, someone who values order and precision above all else."
 POD_spirit_travel.5300.a: "Sounds like my kind of place!"
 POD_spirit_travel.5300.b: "I don't like this place..."
  
 POD_spirit_travel.5301.t: "Astral Solitude"
 POD_spirit_travel.5301.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nNo signs of life exist here, making it the perfect place for shy characters... but not exactly the same for people actually enjoying having some company."
   
 POD_spirit_travel.5302.t: "Astral Diligence"
 POD_spirit_travel.5302.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nColossal $glossary_weaver$ spirits such as ‘star spiders’ patrol and maintain the web and ensure everything remains in its ordained place. There is no place for laziness here and everything follows its intended course as diligently as possible."
     
 POD_spirit_travel.5400.t: "Fickle Nature"
 POD_spirit_travel.5400.desc: "The [UmbraGlossary('wyld_reaches')] are a place of chaos. Here, Nature rules unbridled and the entire realm is constantly shifting. Only individuals with particularly adaptive minds can thrive here."
     
 POD_spirit_travel.5401.t: "Natural Friends"
 POD_spirit_travel.5401.desc: "The [UmbraGlossary('wyld_reaches')] Reaches are populated by all manner of spiritual creatures. While some are hostile, you can find some intriguing and friendly enough conversation partners in here if you wish."
     
 POD_spirit_travel.5402.t: "Natural Rush"
 POD_spirit_travel.5402.desc: "The [UmbraGlossary('wyld_reaches')] Reaches are a place of chaos.\nNature waits for no man here. As the landscape shifts and changes around you all the time, you have to adapt your mindset to this truth if you want to survive in this realm. This might not be possible for everyone."
     
 POD_spirit_travel.5500.t: "Realm of Pain"
 POD_spirit_travel.5500.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nA place of pain and madness, only the most jaded souls can thrive here."
     
 POD_spirit_travel.5501.t: "Realm of Hatred"
 POD_spirit_travel.5501.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nThe worst emotions are free and prospering here. Hatred will feed hatred."
     
 POD_spirit_travel.5502.t: "Realm of Deceit"
 POD_spirit_travel.5502.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nThoughts of betrayal constantly cross your mind, reminding you of the many people who tried to cross you... or the ones you crossed yourself."
             
 POD_spirit_travel.5600.t: "Walking the Spiral"
 POD_spirit_travel.5600.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThis is one of the strongholds of the Wyrm where its most faithful servants, the Black Spiral Dancers, were born. For someone worshiping this entity, this is very close to a holy site in a twisted way."
 POD_spirit_travel.5600.a: "A pilgrimage of madness."
      
 POD_spirit_travel.5601.t: "Dancing the Spiral"
 POD_spirit_travel.5601.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThe Labyrinth is full of gifts for the zealous servants of the Wyrm. But dancing the spiral is a maddening prospect, one that can break even the already broken minds."
 POD_spirit_travel.5601.a: "Let's dance!"
 POD_spirit_travel.5601.b: "I don't feel like it."
     
 POD_spirit_travel.5602.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThe Labyrinth has broken the minds of entire tribes and an incalculable number of so called heroes, now zealous servants of the Wyrm. As long as you stay here, you will be subjected to the $glossary_wyrm_corruption$ at its most powerful. You should run, quickly."
 POD_spirit_travel.5602.a: "Dancing my sanity away..."
     
 POD_spirit_travel.5700.t: "Undying Glory"
 POD_spirit_travel.5700.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nWith old Egypt long gone from the mortals minds, this is maybe the last remainder of the glory that once was. Any Mummy coming here can feel the pride of their civilization, but also the sadness of its loss."
 POD_spirit_travel.5700.a: "I must stay true to Khem."
 POD_spirit_travel.5700.b: "Sorrowful pride."
 POD_spirit_travel.5700.c: "Old Egypt is dead and buried."
  
 POD_spirit_travel.5701.t: "Secrets of Khem"
 POD_spirit_travel.5701.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nMany of the deepest secrets of old Egypt can be found here, preserved by passing Mummies during their own resurrection process. For the one who takes time to read the hieroglyphs, there is much to learn."
 POD_spirit_travel.5701.a: "Secrets of the dead."
 POD_spirit_travel.5701.b: "Secrets of the soul."
 POD_spirit_travel.5701.c: "Secrets of the sky."
 POD_spirit_travel.5701.d: "I'm just passing by."
    
 POD_spirit_travel.5702.t: "The Curse of the Mummy"
 POD_spirit_travel.5702.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nThis place is meant only for the Undying of Egypt and you are not one of them. As such, ingenious traps are springing everywhere as you try to plunder the secrets of old. Each time you try to get closer to one, it retreats even farther back."
 POD_spirit_travel.5702.a: "This is a lost cause..."
   
 POD_spirit_travel.5800.t: "Secrets of the First"
 POD_spirit_travel.5800.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nAs a haven for some of the most powerful entities that ever walked upon the Earth, the First City is a repository of memories and knowledge like no other. Some truths have better left buried however, and there are things in here that could shatter the most zealous individual's faith."
 POD_spirit_travel.5800.a: "The path of giants..."
 POD_spirit_travel.5800.b: "This is too dangerous."

 POD_spirit_travel.5801.t: "War for Enoch"
 POD_spirit_travel.5801.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nEnoch is a battlefield between the forces of the wraithly Empire of Stygia and the secretive vampiric Tal'mahe'Ra. Each night, battles are fought over the contested districts of the once great city."
 POD_spirit_travel.5801.a: "A worthwhile endeavor!"
 POD_spirit_travel.5801.effect.success.desc: "You fight bravely and learn about martial matters." 
 POD_spirit_travel.5801.success: "A good battle!"
 POD_spirit_travel.5801.failure.effect.desc: "You run away battered."
 POD_spirit_travel.5801.failure: "Not worth it..."
   
 POD_spirit_travel.5802.t: "The Dread Palace Ghemal"
 POD_spirit_travel.5802.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nThe High House of Caine, known as the Dread Palace Ghemal, stands in the very center of the city. Just an echo of the real place obviously but still a very impressive sight. And a dreadful one as well as you can almost feel the presence of the Dark Father in this place so long ago..."
 POD_spirit_travel.5802.a: "He isn't there right?"

 POD_spirit_travel.5403.t: "Friendly Chaos"
 POD_spirit_travel.5403.desc: "The [UmbraGlossary('wyld_reaches')] are populated by all manner of spirits. In constant motion, they create, evolve and die at a breakneck speed. Some of those creations could be useful if you managed to force these spirits to just slow down a little. This might take a bit of groveling to convince them but the result will probably be worth it, though you can't be sure."
 POD_spirit_travel.5403.a: "A Klaive is always useful!"
 POD_spirit_travel.5403.b: "What a strange pouch."
 POD_spirit_travel.5403.c: "What does this needle do?"
 POD_spirit_travel.5403.d: "Such a strange contraption!"
 POD_spirit_travel.5403.e: "I don't need any of those baubles."
 

 

 

  

   

 

  










 

  

   

 

 
 POD_spirit_travel.5900.t: "Warring Dead"
 POD_spirit_travel.5900.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nThis conflict is going poorly for the Egyptian dead, as the [UmbraGlossary('dark_kingdom_of_iron')] vastly outnumbers them and continues to grow night after night. Still, the sons and daughters of Egypt fight on, using tactics that have been considered obsolete in the mortal world for a long time now, like chariot warfare."
 POD_spirit_travel.5900.a: "Chariots are an impressive sight to behold."
 POD_spirit_travel.5900.b: "They are outdated for a reason."
 
 POD_spirit_travel.5901.t: "Lord of the Sacred Land"
 POD_spirit_travel.5901.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nAnubis rules here and the jackal God has proven a crafty diplomat. His deals with the reclusive Charon of Stygia have allowed Neter-Khertet to receive some much needed reinforcements while not losing its independence. Ruling a realm engulfed in seemingly eternal warfare is certainly a talent you can appreciate."
 POD_spirit_travel.5901.a: "Much to learn from Osiris' son."
 POD_spirit_travel.5901.b: "War first, talks later."
 
 POD_spirit_travel.5902.t: "Garb of the Pharaoh"
 POD_spirit_travel.5902.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nDespite the deadly warfare going on, the souls of the Egyptian dead still try to adapt as best as they can, having forged this realm into an idealistic version of ancient Egypt. You encounter many skilled craftsmen, including some offering you their expertise if you were to part with some coins. A strangely normal thing to do in such a beleaguered realm."
 POD_spirit_travel.5902.a: "These clothes are fit for royalty!"
 POD_spirit_travel.5902.b: "I like my own style, thanks."
 

   
  
