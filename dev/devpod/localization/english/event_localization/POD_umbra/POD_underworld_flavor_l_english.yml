l_english:
 

 PoD_shadowlands.1.t: "You see Dead People"
 PoD_shadowlands.1.desc: "The [UmbraGlossary('shadowlands')] are a dry and hopeless place, even for wraiths. All beings here are condemned to a slow agony until their inevitable descent into [UmbraGlossary('oblivion')]. It's hard to not feel haunted by the surrounding despair and staying for long will take its toll on even the hardiest of souls."
 PoD_shadowlands.1.a: "I must move on."
 PoD_shadowlands.1.b: "Hello darkness my old friend!"
 
 PoD_shadowlands.2.t: "Cemetery of Civilizations"
 PoD_shadowlands.2.desc: "Death waits for no one and the [UmbraGlossary('shadowlands')] are full of wraiths from foreign (or even long gone) civilizations. Some of them can be quite talkative about their past culture and welcome a conversation partner willing to learn about it. Nostalgia is a strong feeling for the lost and damned.\nAs you listen to one such wraith, your minds wanders and you can almost feel yourself living in that time and place alongside them..."
 PoD_shadowlands.2.a: "Time for a change!"
 PoD_shadowlands.2.b: "I'm fine with who I am."
 
 dead_insight_modifier: "Insight from the Grave"
 dead_insight_modifier_desc: "You know the wisdom of long gone scholars. But you also reek of death and instinctively repulse anyone coming close to you."
 
 PoD_shadowlands.3.t: "Knowledge from Beyond"
 PoD_shadowlands.3.desc: "The lost souls confined to the [UmbraGlossary('shadowlands')] come from all corners of the Earth and you can find a surprising amount of insight from them. Wraiths are notoriously cagey however and actually learning from them takes no small amount of effort. If you are willing to stay a little longer in the Kingdom of the Dead, you might convince some of them to teach you some useful knowledge."
 PoD_shadowlands.3.a: "I have time."
 PoD_shadowlands.3.b: "I won't overstay my welcome."

 PoD_kingdom_of_sand.1.t: "Undying Glory"
 PoD_kingdom_of_sand.1.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nWith old Egypt long gone from the mortals minds, this is maybe the last remainder of the glory that once was. Any Mummy coming here can feel the pride of their civilization, but also the sadness of its loss."
 PoD_kingdom_of_sand.1.a: "I must stay true to Khem."
 PoD_kingdom_of_sand.1.b: "Sorrowful pride."
 PoD_kingdom_of_sand.1.c: "Old Egypt is dead and buried."
  
 PoD_kingdom_of_sand.2.t: "Secrets of Khem"
 PoD_kingdom_of_sand.2.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nMany of the deepest secrets of old Egypt can be found here, preserved by passing Mummies during their own resurrection process. For the one who takes time to read the hieroglyphs, there is much to learn."
 PoD_kingdom_of_sand.2.a: "Secrets of the dead."
 PoD_kingdom_of_sand.2.b: "Secrets of the soul."
 PoD_kingdom_of_sand.2.c: "Secrets of the sky."
 PoD_kingdom_of_sand.2.d: "I'm just passing by."
    
 PoD_kingdom_of_sand.3.t: "The Curse of the Mummy"
 PoD_kingdom_of_sand.3.desc: "Echoes of the living lands formed by the passions and desires placed upon the great cities, tombs and temples of old Egypt can be seen here. This is where the Immortals, or Mummies, build their extensive Kingdom to protect themselves when going through the treacherous Duat, the land of the Dead.\nThis place is meant only for the Undying of Egypt and you are not one of them. As such, ingenious traps are springing everywhere as you try to plunder the secrets of old. Each time you try to get closer to one, it retreats even farther back."
 PoD_kingdom_of_sand.3.a: "This is a lost cause..."


 PoD_first_city.1.t: "Secrets of the First"
 PoD_first_city.1.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nAs a haven for some of the most powerful entities that ever walked upon the Earth, the First City is a repository of memories and knowledge like no other. Some truths have better left buried however, and there are things in here that could shatter the most zealous individual's faith."
 PoD_first_city.1.a: "The path of giants..."
 PoD_first_city.1.b: "This is too dangerous."

 PoD_first_city.2.t: "War for Enoch"
 PoD_first_city.2.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nEnoch is a battlefield between the forces of the wraithly Empire of Stygia and the secretive vampiric Tal'mahe'Ra. Each night, battles are fought over the contested districts of the once great city."
 PoD_first_city.2.a: "A worthwhile endeavor!"
 PoD_first_city.2.effect.success.desc: "You fight bravely and learn about martial matters." 
 PoD_first_city.2.success: "A good battle!"
 PoD_first_city.2.failure.effect.desc: "You run away battered."
 PoD_first_city.2.failure: "Not worth it..."
   
 PoD_first_city.3.t: "The Dread Palace Ghemal"
 PoD_first_city.3.desc: "The First City is the mythical birthplace of the Cainites vampires. Long flooded by God's wrath, it's still preserved as an echo in the [UmbraGlossaryLocalized('shadowlands','Underworld')].\nThe High House of Caine, known as the Dread Palace Ghemal, stands in the very center of the city. Just an echo of the real place obviously but still a very impressive sight. And a dreadful one as well as you can almost feel the presence of the Dark Father in this place so long ago..."
 PoD_first_city.3.a: "He isn't there right?"


 PoD_nefer_khetet.1.t: "Warring Dead"
 PoD_nefer_khetet.1.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nThis conflict is going poorly for the Egyptian dead, as the [UmbraGlossary('dark_kingdom_of_iron')] vastly outnumbers them and continues to grow night after night. Still, the sons and daughters of Egypt fight on, using tactics that have been considered obsolete in the mortal world for a long time now, like chariot warfare."
 PoD_nefer_khetet.1.a: "Chariots are an impressive sight to behold."
 PoD_nefer_khetet.1.b: "They are outdated for a reason."
 
 PoD_nefer_khetet.2.t: "Lord of the Sacred Land"
 PoD_nefer_khetet.2.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nAnubis rules here and the jackal God has proven a crafty diplomat. His deals with the reclusive Charon of Stygia have allowed Neter-Khertet to receive some much needed reinforcements while not losing its independence. Ruling a realm engulfed in seemingly eternal warfare is certainly a talent you can appreciate."
 PoD_nefer_khetet.2.a: "Much to learn from Osiris' son."
 PoD_nefer_khetet.2.b: "War first, talks later."
 
 PoD_nefer_khetet.3.t: "Garb of the Pharaoh"
 PoD_nefer_khetet.3.desc: "Before the foundation of the [UmbraGlossary('dark_kingdom_of_sand')], the Egyptian dead dwelt within Neter-Khertet, the "divine subterranean place". The first being to walk Neter-khertet was Anubis. It was here that Osiris first started to rule over the dead and gathered his most loyal subordinates around him. The [UmbraGlossary('dark_kingdom_of_iron')] started an invasion to claim Neter-Khertet as their own during the height of the Roman Empire. The war has been going on ever since.\nDespite the deadly warfare going on, the souls of the Egyptian dead still try to adapt as best as they can, having forged this realm into an idealistic version of ancient Egypt. You encounter many skilled craftsmen, including some offering you their expertise if you were to part with some coins. A strangely normal thing to do in such a beleaguered realm."
 PoD_nefer_khetet.3.a: "These clothes are fit for royalty!"
 PoD_nefer_khetet.3.b: "I like my own style, thanks."


 PoD_abyss.1.t: "Prideful Prisoners"
 PoD_abyss.1.desc: "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen.\nFor those trapped here, there is no escape from the constant torment except in self repentance and atonement. In this endless void, this might be the only path to keep your sanity in check for a while longer."
 PoD_abyss.1.a: "I made mistakes..."
       
 PoD_abyss.2.t: "Zealous Prisoners"
 PoD_abyss.2.desc: "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen.\nFor those trapped here, there is no escape from the constant torment except in self repentance and atonement. In this endless void, this might be the only path to keep your sanity in check for a while longer."
 PoD_abyss.2.a: "I made mistakes..."
   
 PoD_abyss.3.t: "Godly Punishment"
 PoD_abyss.3.desc: "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen.\nThe demons inside are left to rot in their own regrets, despair, and impotent fury and the machinations and manipulations of the infernal rulers are nothing but insane mind games, since the Fallen can't hurt or destroy each other. Being trapped in one of those machinations is a sure way to quickly lose yourself."
 PoD_abyss.3.a: "What else can I do?"
    