l_english:
 


 PoD_weaver_reaches.1.t: "Stubborn Order"
 PoD_weaver_reaches.1.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nTo thrive and understand this place, you must be in the right mindset, someone who values order and precision above all else."
 PoD_weaver_reaches.1.a: "Sounds like my kind of place!"
 PoD_weaver_reaches.1.b: "I don't like this place..."
  
 PoD_weaver_reaches.2.t: "Astral Solitude"
 PoD_weaver_reaches.2.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nNo signs of life exist here, making it the perfect place for shy characters... but not exactly the same for people actually enjoying having some company."
 PoD_weaver_reaches.2.a: "Sounds like my kind of place!"
 PoD_weaver_reaches.2.b: "I don't like this place..."

 PoD_weaver_reaches.3.t: "Astral Diligence"
 PoD_weaver_reaches.3.desc: "The [UmbraGlossary('weaver_reaches')] are strands of calcified reality, similar to an astronomer's computerized map. The web's intersecting nodes lock cold stars and frozen planets to an unnatural symmetry.\nColossal $glossary_weaver$ spirits such as 'star spiders' patrol and maintain the web and ensure everything remains in its ordained place. There is no place for laziness here and everything follows its intended course as diligently as possible."
 PoD_weaver_reaches.3.a: "Sounds like my kind of place!"
 PoD_weaver_reaches.3.b: "I don't like this place..."




 PoD_wyld_reaches.1.t: "Fickle Nature"
 PoD_wyld_reaches.1.desc: "The [UmbraGlossary('wyld_reaches')] are a place of chaos. Here, Nature rules unbridled and the entire realm is constantly shifting. Only individuals with particularly adaptive minds can thrive here."
 PoD_wyld_reaches.1.a: "Sounds like my kind of place!"
 PoD_wyld_reaches.1.b: "I don't like this place..."
     
 PoD_wyld_reaches.2.t: "Natural Friends"
 PoD_wyld_reaches.2.desc: "The [UmbraGlossary('wyld_reaches')] Reaches are populated by all manner of spiritual creatures. While some are hostile, you can find some intriguing and friendly enough conversation partners in here if you wish."
 PoD_wyld_reaches.2.a: "Sounds like my kind of place!"
 PoD_wyld_reaches.2.b: "I don't like this place..."
     
 PoD_wyld_reaches.3.t: "Natural Rush"
 PoD_wyld_reaches.3.desc: "The [UmbraGlossary('wyld_reaches')] Reaches are a place of chaos.\nNature waits for no man here. As the landscape shifts and changes around you all the time, you have to adapt your mindset to this truth if you want to survive in this realm. This might not be possible for everyone."
 PoD_wyld_reaches.3.a: "Sounds like my kind of place!"
 PoD_wyld_reaches.3.b: "I don't like this place..."

 PoD_wyld_reaches.200.t: "Friendly Chaos"
 PoD_wyld_reaches.200.desc: "The [UmbraGlossary('wyld_reaches')] are populated by all manner of spirits. In constant motion, they create, evolve and die at a breakneck speed. Some of those creations could be useful if you managed to force these spirits to just slow down a little. This might take a bit of groveling to convince them but the result will probably be worth it, though you can't be sure."
 PoD_wyld_reaches.200.a: "A Klaive is always useful!"
 PoD_wyld_reaches.200.b: "What a strange pouch."
 PoD_wyld_reaches.200.c: "What does this needle do?"
 PoD_wyld_reaches.200.d: "Such a strange contraption!"


 PoD_wyrm_reaches.1.t: "Realm of Pain"
 PoD_wyrm_reaches.1.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nA place of pain and madness, only the most jaded souls can thrive here."
 PoD_wyrm_reaches.1.a: "Sounds like my kind of place!"
 PoD_wyrm_reaches.1.b: "I don't like this place..."
     
 PoD_wyrm_reaches.2.t: "Realm of Hatred"
 PoD_wyrm_reaches.2.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nThe worst emotions are free and prospering here. Hatred will feed hatred."
 PoD_wyrm_reaches.2.a: "Sounds like my kind of place!"
 PoD_wyrm_reaches.2.b: "I don't like this place..."
     
 PoD_wyrm_reaches.3.t: "Realm of Deceit"
 PoD_wyrm_reaches.3.desc: "The stars within the [UmbraGlossary('wyrm_reaches')] have burned-out to lifeless husks or collapsed into black holes that usually lead into [UmbraGlossary('malfeas')]. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky.\nThoughts of betrayal constantly cross your mind, reminding you of the many people who tried to cross you... or the ones you crossed yourself."
 PoD_wyrm_reaches.3.a: "Sounds like my kind of place!"
 PoD_wyrm_reaches.3.b: "I don't like this place..."


 PoD_black_spiral_labyrinth.1.t: "Walking the Spiral"
 PoD_black_spiral_labyrinth.1.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThis is one of the strongholds of the Wyrm where its most faithful servants, the Black Spiral Dancers, were born. For someone worshiping this entity, this is very close to a holy site in a twisted way."
 PoD_black_spiral_labyrinth.1.a: "A pilgrimage of madness."
      
 PoD_black_spiral_labyrinth.2.t: "Dancing the Spiral"
 PoD_black_spiral_labyrinth.2.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThe Labyrinth is full of gifts for the zealous servants of the Wyrm. But dancing the spiral is a maddening prospect, one that can break even the already broken minds."
 PoD_black_spiral_labyrinth.2.a: "Let's dance!"
 PoD_black_spiral_labyrinth.2.b: "I don't feel like it."

 PoD_black_spiral_labyrinth.3.t: "Walking the Spiral"
 PoD_black_spiral_labyrinth.3.desc: "The [UmbraGlossary('black_spiral_labyrinth')], also called the [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] in the Middle Kingdom, is a spiral labyrinth within the realm of [UmbraGlossary('malfeas')] containing unimaginable horrors of the $glossary_wyrm$.\nThe Labyrinth has broken the minds of entire tribes and an incalculable number of so called heroes, now zealous servants of the Wyrm. As long as you stay here, you will be subjected to the $glossary_wyrm_corruption$ at its most powerful. You should run, quickly."
 PoD_black_spiral_labyrinth.3.a: "Dancing my sanity away..."