l_english:
 
 POD_umbra_no_baubles_option: "I have no need for those baubles"

 PoD_spiritwilds.1.t: "Back to Nature"
 PoD_spiritwilds.1.desc: "The [UmbraGlossary('spirit_wilds')] are a spiritual representation of Earth in its purest, most natural form. In many ways, it is an untamed and wild paradise but it is not completely isolated from the material world either. Corruption brought by humankind can be seen creeping in place where civilizations are especially powerful."
 PoD_spiritwilds.1.a: "Civilization? A plague!"
 PoD_spiritwilds.1.b: "Progress can't be stopped."
 back_to_nature_modifier: "Back to Nature"
 back_to_nature_modifier_desc: "Your trip into the [UmbraGlossary('spirit_wilds')] made you realize the beauty of nature and the horror brought upon it by humankind."

 PoD_spiritwilds.2.t: "The Savage World"
 PoD_spiritwilds.2.desc: "As a spiritual representation of the natural state of the world, the [UmbraGlossary('spirit_wilds')] are a wild place inhabited by all manner of creatures extinct in the material world (or that never existed in it in the first place). Most of them aren't exactly the friendly kind and a pack of those has spotted you and decided that you would make a perfectly acceptable meal. You might want to avoid that fate."
 PoD_spiritwilds.2.a: "Man versus wild!"
 PoD_spiritwilds.2.b: "Run away!"

 PoD_spiritwilds.200.t: "The Black Tortoise"
 PoD_spiritwilds.200.desc: "You chanced upon the elusive Genbu, a wizened old tortoise spirit. Genbu is a slow but powerful thinker, often mistaken for a Totem of Wisdom because of his reliance upon thought to solve problems, but he also enjoys using thought to outwit his foes. He is a cunning enemy, ordinarily underestimated, and his elaborate schemes are often bizarre and unpredictable.\nThis chance encounter might be a unique opportunity to secure his help, if you are able to show him that you are worthy of course."
 PoD_spiritwilds.200.a: "Tricking a trickster."
 PoD_spiritwilds.200.effect.success.desc: "Genbu is impressed!" 
 PoD_spiritwilds.200.success: "Genbu is impressed!"
 PoD_spiritwilds.200.failure.effect.desc: "Genbu isn't impressed..."
 PoD_spiritwilds.200.failure: "Genbu isn't impressed..."



 PoD_aetherial_realm.1.t: "Keep Out"
 PoD_aetherial_realm.1.desc: "The Aetherial Realm is accessible from the clouds of the [UmbraGlossary('spirit_wilds')]. Its lowest point is the fantastical mountains made out of clouds and inhabited by aerial spirits. They have a spongy top layer but are solid and easy to walk on. The clouds shift and flow to their own rhythms and form wondrous landscapes of plains, hills, valleys and mountains that all have the same spongy solidity.\nIt is a realm completely controlled by the Garou Nation and their allies and, as such, is very unwelcoming to any outsiders. As soon as you arrived you have been on the run, hunted down by the realm's many powerful wardens."
 PoD_aetherial_realm.1.a: "I should move out quickly"
 
 PoD_aetherial_realm.2.t: "Astral Climbing"
 PoD_aetherial_realm.2.desc: "The Aetherial Realm is accessible from the clouds of the [UmbraGlossary('spirit_wilds')]. Its lowest point is the fantastical mountains made out of clouds and inhabited by aerial spirits. They have a spongy top layer but are solid and easy to walk on. The clouds shift and flow to their own rhythms and form wondrous landscapes of plains, hills, valleys and mountains that all have the same spongy solidity.\nWhile it is possible to use the clouds as a mean of traveling around the realms, some prefer climbing the numerous mountains dotting the place. It's certainly a more stressful endeavor, but could be a good workout."
 PoD_aetherial_realm.2.a: "To the top of the world!"
 PoD_aetherial_realm.2.b: "Cloud jumping is more fun."

 PoD_aetherial_realm.3.t: "Stargazing up Close"
 PoD_aetherial_realm.3.desc: "The Aetherial Realm is accessible from the clouds of the [UmbraGlossary('spirit_wilds')]. Its lowest point is the fantastical mountains made out of clouds and inhabited by aerial spirits. They have a spongy top layer but are solid and easy to walk on. The clouds shift and flow to their own rhythms and form wondrous landscapes of plains, hills, valleys and mountains that all have the same spongy solidity.\nThe Aetheria is perhaps the place closest to the stars accessible to most [umbra|E] travelers. It is reflected in the physical world as the skies above that constantly cycle through night and day. As such, if offers a truly unique view of what lies beyond."
 PoD_aetherial_realm.3.a: "What lies up there?"



 PoD_atrocity_realm.1.t: "Eternal Suffering"
 PoD_atrocity_realm.1.desc: "Raised from human pain. Millennia of suffering from all the world's victims have created this Realm, a place where the worst cruelties and tortures have been immortalized.\nIt is not a place for the faint of heart, or even a place who one with a heart at all."
 PoD_atrocity_realm.1.a: "So much waste..."
 PoD_atrocity_realm.1.b: "Heh, not that bad."

 PoD_atrocity_realm.2.t: "Jaded Suffering"
 PoD_atrocity_realm.2.desc: "Raised from human pain. Millennia of suffering from all the world's victims have created this Realm, a place where the worst cruelties and tortures have been immortalized.\nIt is hard to not be tainted by the aura of suffering permeating the air in this realm. Whether you wish it or not, you soon appear more imposing than before, cowing those around you with the implicit threat of eternal torment."
 PoD_atrocity_realm.2.a: "Fear is for others."
 
 PoD_atrocity_realm.3.t: "Dealer of Pain"
 PoD_atrocity_realm.3.desc: "Raised from human pain. Millennia of suffering from all the world's victims have created this Realm, a place where the worst cruelties and tortures have been immortalized.\nFor the truly jaded soul, there is a lot to learn here about the intricacies of mental and physical suffering. But even said jaded soul could be overwhelmed by the sheer agony felt on this wasteland. No one is truly immune to pain after all."
 PoD_atrocity_realm.3.a: "An art form in itself."
 PoD_atrocity_realm.3.b: "I must move on."




 POD_battleground.1.t: "Armchair General"
 POD_battleground.1.desc: "The Battleground is a realm dedicated to violence and rage, and chaos rules it as armies mix up and Qin soldiers end up fighting against Roman legions and the Crusaders ally themselves with Viking barbarians against Mayan troops. As long as one does not enter one of the conflicts, a visitor walks on a "track" appropriate to the battle they witness (a boat for a naval battle, a Roman road for a conflict during the Punic wars etc.). As long as they do not step off the track, they will not be attacked directly.\nThis peculiarity makes it very easy for you to witness one of those battles and criticize the clearly incompetent generals from your comfy seat. You would obviously do so much better in their place!"
 POD_battleground.1.a: "It's so easy I could bump up the difficulty!"
 
 POD_battleground.2.t: "War Changes"
 POD_battleground.2.desc: "The Battleground is a realm dedicated to violence and rage, and chaos rules it as armies mix up and Qin soldiers end up fighting against Roman legions and the Crusaders ally themselves with Viking barbarians against Mayan troops. As long as one does not enter one of the conflicts, a visitor walks on a "track" appropriate to the battle they witness (a boat for a naval battle, a Roman road for a conflict during the Punic wars etc.). As long as they do not step off the track, they will not be attacked directly.\nWith so many eras and cultures represented, it's easy to see that war does, indeed, change. There is always a reason behind each of those changes, as inconsequential as they might seem. Studying them could be a good opportunity for learning."
 POD_battleground.2.a: "Where have the chariots gone to?"
 POD_battleground.2.b: "War is a means, not an end."
 
 POD_battleground.3.t: "A Lifetime of War"
 POD_battleground.3.desc: "The Battleground is a realm dedicated to violence and rage, and chaos rules it as armies mix up and Qin soldiers end up fighting against Roman legions and the Crusaders ally themselves with Viking barbarians against Mayan troops. As long as one does not enter one of the conflicts, a visitor walks on a "track" appropriate to the battle they witness (a boat for a naval battle, a Roman road for a conflict during the Punic wars etc.). As long as they do not step off the track, they will not be attacked directly.\nWhile you are traversing the area, one group of warriors hails you and, while you don't understand them completely, they seem to be mocking you for the fact that you are not participating in one of those battles. They clearly think you weak."
 POD_battleground.3.a: "I'm only passing through."
 POD_battleground.3.b: "I will show you if I'm weak!"



 PoD_erebus.1.t: "Classical Canine Conversation"
 PoD_erebus.1.desc: "Erebus is a place of spiritual cleansing, filled with rivers of molten silver which both burn and heal at the same time, extending the torment of the inmates for months, years, possibly even centuries.\nThe gates of Erebus are guarded by the fearsome Cerberus, a great three-headed monster hound. Cerberus may be related to the classic hound of Greek and Roman mythology, or he may have taken the name and appearance from those myths. He has never confirmed either way but finds tales from this period interesting and enjoys discussing them.\nHe is considered in his tone and an agreeable conversation partner despite his appearance. You soon are imagining yourself in one of those epic tales of heroes and monsters of old."
 PoD_erebus.1.a: "Greek culture is fascinating indeed."
 PoD_erebus.1.b: "An interesting conversation, nothing more."

 PoD_erebus.2.t: "The Lady of Salvation"
 PoD_erebus.2.desc: "Erebus is a place of spiritual cleansing, filled with rivers of molten silver which both burn and heal at the same time, extending the torment of the inmates for months, years, possibly even centuries.\nThe mistress of the realm is the enigmatic Charyss. Her fortress stands on the center of a lake and welcomes any supplicant. The imposing Lady of Erebus then looks into the petitioner's soul and, the vast majority of the time, finds it wanting. Only with Charyss' approval can one be truly considered cleansed."
 PoD_erebus.2.a: "I will seek the Lady's approval."
 PoD_erebus.2.b: "I will be fine on my own."
 charyss_umbra_modifier: "Charyss' Evaluation"
 charyss_umbra_modifier_desc: "Charyss looked into your soul and found you wanting."
  
 PoD_erebus.3.t: "Salvation through Pain"
 PoD_erebus.3.desc: "Erebus is a place of spiritual cleansing, filled with rivers of molten silver which both burn and heal at the same time, extending the torment of the inmates for months, years, possibly even centuries.\nBetrayed by your own guilt, you find yourself submerged in the molten silver waters of Erebus. You quickly find that the only way out is through the mirrors of the soul. The guardians of this realm work in pairs to step through the mirrors and into each sufferer’s mind. Here they work to seek out the sources of guilt, forcing you to confront each and acknowledge your failures. And as long as it’s not done, you will still be swimming in this very painful river..."
 PoD_erebus.3.a: "I repent! I repent!"


 PoD_flux_realm.1.t: "What do you Like?"
 PoD_flux_realm.1.desc: "As one of the anchors of the $glossary_wyld$ within the world, the Flux is a place of chaos, of constant change and endless possibility. Every being within the Flux realm begins to change in numerous ways as the very laws of reality are malleable and changeable.\nYou find staying here and keeping to your core identity difficult. With each passing moment new thoughts and ideas invade your mind, trying to make you think that they always were your own..."
 PoD_flux_realm.1.a: "Truth is relative."
 PoD_flux_realm.1.b: "I will resist!"

 PoD_flux_realm.2.t: "What do you Look Like?"
 PoD_flux_realm.2.desc: "As one of the anchors of the $glossary_wyld$ within the world, the Flux is a place of chaos, of constant change and endless possibility. Every being within the Flux realm begins to change in numerous ways as the very laws of reality are malleable and changeable.\nYou find staying here and keeping to your core identity difficult. With each passing moment your very appearance is shifting, quickly moving away from what it was to a new, unpredictable, form..."
 PoD_flux_realm.2.a: "I always looked like that."
 PoD_flux_realm.2.b: "I will resist!"
 umbra_random_dna_tt: "Your appearance will randomly change."
   
 PoD_flux_realm.3.t: "What do you Look Like?"
 PoD_flux_realm.3.desc: "As one of the anchors of the $glossary_wyld$ within the world, the Flux is a place of chaos, of constant change and endless possibility. Every being within the Flux realm begins to change in numerous ways as the very laws of reality are malleable and changeable.\nYou find staying here and keeping to your core identity difficult. With each passing moment your very physique is shifting, quickly moving away from what it was to a new, unpredictable, form..."
 PoD_flux_realm.3.a: "I always looked like that."
 PoD_flux_realm.3.b: "I will resist!"


 PoD_hy_brasil.1.t: "The Dark Fairy Princess"
 PoD_hy_brasil.1.desc: "Hy-Brasil appears as a land of endless fantasy stories. Here, the seasons never change and day stands locked eternally in twilight.\nPrincess Mariana rules the Unseelie fae court here and is locked in eternal war against prince Lysander of the Seelie. The quick-witted, dark beauty is young but uncannily talented in the greatest magicks of the fae. She has offered to share some of her secrets with you, if only you were to pledge yourself to her cause..."
 PoD_hy_brasil.1.a: "Hail to the future Queen!"
 PoD_hy_brasil.1.b: "This is no basis for a system of government!"
 devoted_mariana_modifier: "Devoted to Mariana"
 devoted_mariana_modifier_desc: "You have devoted yourself to the fairy queen Mariana. She consumes your every thought."
  
 PoD_hy_brasil.2.t: "Fairy Battlefield"
 PoD_hy_brasil.2.desc: "Hy-Brasil appears as a land of endless fantasy stories. Here, the seasons never change and day stands locked eternally in twilight.\nThis realm is a contested battlefield between two fae factions, the Seelie and the Unseelie. While most of their competition takes the form of courtly intrigue, it sometimes ends up on the battlefield as well. Woe to the outsider, like yourself, caught between the magical battle lines."
 PoD_hy_brasil.2.a: "Is that a fireball?"
 PoD_hy_brasil.2.b: "Run away!"
  
 PoD_hy_brasil.3.t: "The Brave Fairy Prince"
 PoD_hy_brasil.3.desc: "Hy-Brasil appears as a land of endless fantasy stories. Here, the seasons never change and day stands locked eternally in twilight.\nPrince Lysander rules the Seelie fae court here and is locked in eternal war against Princess Mariana of the Unseelie. The quick-witted, dark beauty is young but uncannily talented in the greatest magicks of the fae. The honorable knight is a fearsome combatant, and he is always ready to take new apprentices as long as they don't mind suffering some bruises in the process."
 PoD_hy_brasil.3.a: "A sparring match, Prince?"
 PoD_hy_brasil.3.b: "I can do without that, thanks."


 PoD_legendary_realm.1.t: "Shameful Display"
 PoD_legendary_realm.1.desc: "The Legendary Realm can recreate someone's lineage memories, allowing them to experience the lives of their legendary ancestors.\nSome legends are best left forgotten though, and you just revived a painful moment of cowardice from one of your ancestors. The memory stays vivid just long enough to make you doubt yourself as well for a moment."
 PoD_legendary_realm.1.a: "I'm better than he was, I hope."
 
 PoD_legendary_realm.2.t: "Great Deeds"
 PoD_legendary_realm.2.desc: "The Legendary Realm can recreate someone's lineage memories, allowing them to experience the lives of their legendary ancestors.\nSome legends are a powerful tale to experience first hand, and you just revived an inspiring moment of bravery from one of your ancestors. The memory stays vivid just long enough to make you feel a rush of pride."
 PoD_legendary_realm.2.a: "A long line of heroes no doubt!"
  
 PoD_legendary_realm.3.t: "Heroic Lineage?"
 PoD_legendary_realm.3.desc: "The Legendary Realm can recreate someone's lineage memories, allowing them to experience the lives of their legendary ancestors.\nThis is the perfect realm to glorify your lineage... if there is anything to glorify them with. You don't control what memories will appear and stories of cowardice are as likely to happen as tales of bravery. Perhaps the past is best left to the past."
 PoD_legendary_realm.3.a: "Clearly, we were always heroes!"
 PoD_legendary_realm.3.b: "Let's look to the future instead."



 PoD_mountains_of_heaven.1.t: "Wisdom for Dummies"
 PoD_mountains_of_heaven.1.desc: "A great chain of mountains, dwarfing even the mighty Himalayas, crests above a sea of clouds. Some wise travelers believe that pagodas and hidden cities lie in the mountain range beyond the reach of most spirits.\nInhabited by great Dragon-spirits, the Mountains are a font of wisdom for those who ask nicely. One such Dragon has taken a liking in you, and offers you some wise advice."
 PoD_mountains_of_heaven.1.a: "Thank you, mighty Dragon"
 
 PoD_mountains_of_heaven.2.t: "Inscrutable Wisdom"
 PoD_mountains_of_heaven.2.desc: "A great chain of mountains, dwarfing even the mighty Himalayas, crests above a sea of clouds. Some wise travelers believe that pagodas and hidden cities lie in the mountain range beyond the reach of most spirits.\nInhabited by great Dragon-spirits, the Mountains are a font of wisdom for those who ask nicely. One such Dragon has taken a liking in you, and offers you some wise advice. Sadly, it's barely understandable, and you end up more confused than anything else."
 PoD_mountains_of_heaven.2.a: "Thank you?"
 
 PoD_mountains_of_heaven.3.t: "Dragon Hoards"
 PoD_mountains_of_heaven.3.desc: "A great chain of mountains, dwarfing even the mighty Himalayas, crests above a sea of clouds. Some wise travelers believe that pagodas and hidden cities lie in the mountain range beyond the reach of most spirits.\nThe Mountains are inhabited by great Dragon-spirits and when Dragons are around, treasures are as well. You could try sneak past one of them to grab some of the gold they hoard here. Obviously, this course of action carries some risks..."
 PoD_mountains_of_heaven.3.a: "Don't wake up, don't wake up..."
 PoD_mountains_of_heaven.3.b: "Just passing by!"


 PoD_pangaea.1.t: "Primal Fury"
 PoD_pangaea.1.desc: "Pangaea is a reflection of primal Earth, showing the world as it was before civilization, human history, and even the Impergium. It’s a time when the continents of Earth were as one, a re-creation tempered with anachronism and long-forgotten, atavistic horrors.\nGreat, forgotten, beasts bar your path. Time to show them who the apex predator really is."
 PoD_pangaea.1.a: "Come get some!"
 PoD_pangaea.1.effect.success.desc: "You fight your way through." 
 PoD_pangaea.1.success: "You win!"
 PoD_pangaea.1.failure.effect.desc: "You run away battered."
 PoD_pangaea.1.failure: "You lose!"
    
 PoD_pangaea.2.t: "Jurassic Realm"
 PoD_pangaea.2.desc: "Pangaea is a reflection of primal Earth, showing the world as it was before civilization, human history, and even the Impergium. It’s a time when the continents of Earth were as one, a re-creation tempered with anachronism and long-forgotten, atavistic horrors.\nMighty Dinosaur Kings claim vast swathes of this territory and don't take kindly to outsiders. You have to fight for every inch you travel through in these savage lands."
 PoD_pangaea.2.a: "I didn't ask for more teeth!"
  
 PoD_pangaea.3.t: "Horrors of Creation"
 PoD_pangaea.3.desc: "Pangaea is a reflection of primal Earth, showing the world as it was before civilization, human history, and even the Impergium. It’s a time when the continents of Earth were as one, a re-creation tempered with anachronism and long-forgotten, atavistic horrors.\nOne such forgotten horror is now chasing you, unhappy of your unforeseen trespassing into their territory. It's time to fight or run, or most likely both at the same time."
 PoD_pangaea.3.a: "How many eyes does this thing have?!"

 PoD_pangaea.4.t: "A Dragon's Hoard"
 PoD_pangaea.4.desc: "Pangaea is a reflection of primal Earth, showing the world as it was before civilization, human history, and even the Impergium. It’s a time when the continents of Earth were as one, a re-creation tempered with anachronism and long-forgotten, atavistic horrors.\nFierce dragon-like creatures live in this land and, as the stories tell, they have amassed quite the hoard of primordial treasure that they jealously keep for themselves. You could try mounting a daring heist, but these creatures are obviously quite dangerous when poked."
 PoD_pangaea.4.a: "Shinies!"
 PoD_pangaea.4.b: "That sounds like a terrible idea."


 PoD_summer_country.1.t: "Primordial Heaven"
 PoD_summer_country.1.desc: "The summer country is a reflection of Gaia’s pure and boundless love for Her children. In ancient tales, accomplished heroes and errant aspirants were destined to find it at crucial times in their lives, turning points chosen by Gaia when they could receive healing, peace, wisdom, and even gifts of spiritual might or insight.\nIf a wounded mind can be healed anywhere, it’s here. Just sitting down and watching this land of endless quiet and beauty is enough for most."
 PoD_summer_country.1.a: "Peace and quiet at last."
   
 PoD_summer_country.2.t: "Primordial Teachings"
 PoD_summer_country.2.desc: "The summer country is a reflection of Gaia’s pure and boundless love for Her children. In ancient tales, accomplished heroes and errant aspirants were destined to find it at crucial times in their lives, turning points chosen by Gaia when they could receive healing, peace, wisdom, and even gifts of spiritual might or insight.\nOne such sudden insight happens to you, getting you closer to spiritual enlightenment thanks to the realm’s powerful magic."
 PoD_summer_country.2.a: "Thank you, Mother."
    
 PoD_summer_country.3.t: "Heaven's End"
 PoD_summer_country.3.desc: "The summer country is a reflection of Gaia’s pure and boundless love for Her children. In ancient tales, accomplished heroes and errant aspirants were destined to find it at crucial times in their lives, turning points chosen by Gaia when they could receive healing, peace, wisdom, and even gifts of spiritual might or insight.\nSadly, it is clear that the summer country is living its last days. The realm is slowly falling apart, replacing its beautiful landscapes with the hungry void. Soon, there will be nothing left."
 PoD_summer_country.3.a: "Such a tragedy."


 PoD_tiger_lands.1.t: "Palace of the Monkey King"
 PoD_tiger_lands.1.desc: "The Tiger Lands are a Yang Realm within the Eastern [umbra|E] that acts as a refuge for the spirits of threatened animals and spirits who have lost their homes following human clearcuttings. Each of the animal species has a palace and a spirit court in the Tiger Lands.\nThe Monkey King is a clever being fond of crafty individuals. As you stand before him, he quickly assesses your worth."
 PoD_tiger_lands.1.a: "He takes a liking in you."
 PoD_tiger_lands.1.b: "You bore the King."
    
 PoD_tiger_lands.2.t: "Palace of the Tiger King"
 PoD_tiger_lands.2.desc: "The Tiger Lands are a Yang Realm within the Eastern [umbra|E] that acts as a refuge for the spirits of threatened animals and spirits who have lost their homes following human clearcuttings. Each of the animal species has a palace and a spirit court in the Tiger Lands.\nThe Tiger King is a strong being fond of brave individuals. As you stand before him, he quickly assesses your worth."

 PoD_tiger_lands.3.t: "Palace of the Panda King"
 PoD_tiger_lands.3.desc: "The Tiger Lands are a Yang Realm within the Eastern [umbra|E] that acts as a refuge for the spirits of threatened animals and spirits who have lost their homes following human clearcuttings. Each of the animal species has a palace and a spirit court in the Tiger Lands.\nThe Panda King is a patient being fond of lazy individuals. As you stand before him, he quickly assesses your worth."


 PoD_umi.1.t: "An Audience with the Dragon King"
 PoD_umi.1.desc: "One of the mightiest Umbral realms of the Middle Kingdom, the domain of Umi claims the entire Pacific as its purview.\nFrom his palace at the bottom of the realm, the Dragon King of Umi oversees the myriad responsibilities of his domain: sending calms and tempests, guiding ships into port or sending sharks to attack shipwrecked sailors. A very powerful being, he can grant audiences to prestigious visitors, often showering them with both gifts and condescending comments at the same time."
 PoD_umi.1.a: "You are worthy of his presence."
 PoD_umi.1.b: "You are found unworthy."
        
 PoD_umi.2.t: "An Audience with the Dragon Princess"
 PoD_umi.2.desc: "One of the mightiest Umbral realms of the Middle Kingdom, the domain of Umi claims the entire Pacific as its purview.\nConsort of the Dragon King, the Dragon Princess is a curious individual always interested in the beliefs of others. Her vast knowledge of the subject often makes her guests feel inadequate however."
 PoD_umi.2.a: "An eye opening discussion."
 PoD_umi.2.b: "The Princess is unimpressed by your piety."
    
 PoD_umi.3.t: "An Audience with the Seneschal"
 PoD_umi.3.desc: "One of the mightiest Umbral realms of the Middle Kingdom, the domain of Umi claims the entire Pacific as its purview.\nGajyra, a brutal and towering dragon-spirit, is the seneschal of the Dragon King. Only respecting strength, he is unwelcoming to visitors and will often challenge them to a sparring match to assert his dominance."
 PoD_umi.3.a: "A difficult fight ahead."
 PoD_umi.3.b: "You are found too weak to be challenged."


 PoD_wolfhome.1.t: "Hunting Practice"
 PoD_wolfhome.1.desc: "A harsh and unforgiving realm where wolves can become prey as easily as they assume their roles as predators, Wolfhome is a vast expanse of pristine wilderness.\nHunting, or being hunted, is the true expectation of anyone stepping foot in this place. There is no middle ground."
 PoD_wolfhome.1.a: "I must learn the way of the hunter."
 PoD_wolfhome.1.b: "I am the hunter!"
      
 PoD_wolfhome.2.t: "The Thrill of the Hunt"
 PoD_wolfhome.2.desc: "A harsh and unforgiving realm where wolves can become prey as easily as they assume their roles as predators, Wolfhome is a vast expanse of pristine wilderness.\nHunting can be liberating, especially for born predators like your kind. The simple thrill of the fight and the ultimate kill can be freeing from the stress of ruling."
 PoD_wolfhome.2.a: "A good opportunity to learn this skill."
 PoD_wolfhome.2.b: "Find, run, kill."
      
 PoD_wolfhome.3.t: "Pushing to your Limits"
 PoD_wolfhome.3.desc: "A harsh and unforgiving realm where wolves can become prey as easily as they assume their roles as predators, Wolfhome is a vast expanse of pristine wilderness.\nAs an experienced hunter, Wolfhome itself is trying to push you to your limits, pitting you against the most cunning and dangerous foes, alternating between making you the hunter or the hunted."
 PoD_wolfhome.3.a: "Is that all?!"

 PoD_wolfhome.200.t: "Rewards of the Hunt"
 PoD_wolfhome.200.desc: "A harsh and unforgiving realm where wolves can become prey as easily as they assume their roles as predators, Wolfhome is a vast expanse of pristine wilderness.\nAs an accomplished hunter yourself, you have been participating in one of the many hunts organized throughout the realm. Each of them will be a draining endeavor, but they also offer some spiritual baubles as rewards."
 PoD_wolfhome.200.a: "Interesting earring."
 PoD_wolfhome.200.b: "A blanket? Really?"
 PoD_wolfhome.200.c: "Scary mask..."
 PoD_wolfhome.200.d: "A basin as a fetish?"


 PoD_calumn.1.t: "Fear and Madness"
 PoD_calumn.1.desc: "A Calumn is a realm developing when a particularly strong, negative emotion is expressed in a place within the physical world that it leaves a print within the [umbra|E]. It is a magnet for Banes and Spirits that live near a Calumn show signs of their respective emotion and even inanimate objects becomes tainted by the proximity.\nIt is really not a place for those not corrupted yet. You should move on quickly."
 PoD_calumn.1.a: "Where is the exit?"
  
 PoD_calumn.2.t: "Fear and Horror"
 PoD_calumn.2.desc: "A Calumn is a realm developing when a particularly strong, negative emotion is expressed in a place within the physical world that it leaves a print within the [umbra|E]. It is a magnet for Banes and Spirits that live near a Calumn show signs of their respective emotion and even inanimate objects becomes tainted by the proximity.\nIt is really not a place for those not corrupted yet. You should move on quickly."
 PoD_calumn.2.a: "Where is the exit?"
  
 PoD_calumn.3.t: "Bathing in Fear"
 PoD_calumn.3.desc: "A Calumn is a realm developing when a particularly strong, negative emotion is expressed in a place within the physical world that it leaves a print within the [umbra|E]. It is a magnet for Banes and Spirits that live near a Calumn show signs of their respective emotion and even inanimate objects becomes tainted by the proximity.\nThe $glossary_wyrm$ is strong here, and this is a perfect place to soak in the horrors that your master will bring to the world and be rejuvenated by them."
 PoD_calumn.3.a: "Sweet corruption."

 PoD_calumn.200.t: "Fight your Way"
 PoD_calumn.200.desc: "A Calumn is a realm developing when a particularly strong, negative emotion is expressed in a place within the physical world that it leaves a print within the [umbra|E]. It is a magnet for Banes and Spirits that live near a Calumn show signs of their respective emotion and even inanimate objects becomes tainted by the proximity.\nMany spiritual artifacts were lost in this place and could be recovered by an enterprising adventurer. The guardians Banes won't let them go easily though."
 PoD_calumn.200.a: "A doll in this place?"
 PoD_calumn.200.b: "A skull. Fitting."
 PoD_calumn.200.c: "This pebble emanates energy."
 PoD_calumn.200.d: "Some greaves? Nice." 
 PoD_calumn.200.e: "A powerful looking axe." 
 PoD_calumn.200.f: "This bone is magical, no doubt."


 PoD_artifact_found_success_desc: "You found the artifact!"
 PoD_artifact_found_success: "A New Treasure"
 PoD_artifact_found_failure_desc: "The quest is a failure."
 PoD_artifact_found_failure: "A Failure"

 POD_not_ready_yet: "I'm not ready yet."

 PoD_homeland_black_furies.1.t: "Perfected Greece"
 PoD_homeland_black_furies.1.desc: "The homeland of the Black Furies resembles landscapes of mythical Greece: Rocky mountains tower over numerous small islands and peninsulas that stretch into a turquoise sea. Lush forests of pines and olives, always bearing fruits, stretch over the island, along with buildings constructed in Grecian styles.\nFor any self respecting Black Fury, this is as close to paradise as one can find in the [umbra|E]."
 PoD_homeland_black_furies.1.a: "Perfection."
    
 PoD_homeland_black_furies.2.t: "Warriors and Sages"
 PoD_homeland_black_furies.2.desc: "The homeland of the Black Furies resembles landscapes of mythical Greece: Rocky mountains tower over numerous small islands and peninsulas that stretch into a turquoise sea. Lush forests of pines and olives, always bearing fruits, stretch over the island, along with buildings constructed in Grecian styles.\nMany powerful and wise Black Furies can be found here, always willing to lend their wisdom to any properly deferential cub."
 PoD_homeland_black_furies.2.a: "War..."
 PoD_homeland_black_furies.2.b: "...or wisdom?"
  
 PoD_homeland_black_furies.3.t: "Unwelcome Guest"
 PoD_homeland_black_furies.3.desc: "The homeland of the Black Furies resembles landscapes of mythical Greece: Rocky mountains tower over numerous small islands and peninsulas that stretch into a turquoise sea. Lush forests of pines and olives, always bearing fruits, stretch over the island, along with buildings constructed in Grecian styles.\nThe Black Furies are very protective of their homeland and hunt down anyone foolish enough to trespass here. You should move on quickly."
 PoD_homeland_black_furies.3.a: "Quickly and quietly..."

 PoD_homeland_black_furies.200.t: "The Lionfang"
 PoD_homeland_black_furies.200.desc: "The homeland of the Black Furies resembles landscapes of mythical Greece: Rocky mountains tower over numerous small islands and peninsulas that stretch into a turquoise sea. Lush forests of pines and olives, always bearing fruits, stretch over the island, along with buildings constructed in Grecian styles.\nA powerful artifact, said to be from a land far away from Greece, was once brought to this realm by a strange daughter of Pegasus. Both her and her weapon vanished one day and, since then, Black Furies young and old alike have been looking for it. You could try your luck at finding this fabled relic."
 PoD_homeland_black_furies.200.a: "Pegasus! Guides me!"



 PoD_homeland_bone_gnawers.1.t: "Shady Paradise"
 PoD_homeland_bone_gnawers.1.desc: "The homeland of the Bone Gnawers resembles a slum part of a city. Taverns are open 24 hours every day and all serve cheap beer by the pitcher. Joyhouse joints are on every block, but the canny Gnawer knows the best are found in back alleyways, by knocking on the right doors.\nWhat more can a Bone Gnawer ask for really?"
 PoD_homeland_bone_gnawers.1.a: "Smells like shit. And home."
    
 PoD_homeland_bone_gnawers.2.t: "Backstreet Mentors"
 PoD_homeland_bone_gnawers.2.desc: "The homeland of the Bone Gnawers resembles a slum part of a city. Taverns are open 24 hours every day and all serve cheap beer by the pitcher. Joyhouse joints are on every block, but the canny Gnawer knows the best are found in back alleyways, by knocking on the right doors.\nMany wizened and respected Bone Gnawers can be found here, ready to share their tricks with the properly deferential cub."
 PoD_homeland_bone_gnawers.2.a: "One side of the coin..."
 PoD_homeland_bone_gnawers.2.b: "...and the other"
 
 PoD_homeland_bone_gnawers.3.t: "Unwelcome Guest"
 PoD_homeland_bone_gnawers.3.desc: "The homeland of the Bone Gnawers resembles a slum part of a city. Taverns are open 24 hours every day and all serve cheap beer by the pitcher. Joyhouse joints are on every block, but the canny Gnawer knows the best are found in back alleyways, by knocking on the right doors.\nThis is the Bone Gnawers' turf, and as anyone knows, the sewer rats can be fiercely territorial on their own land. As such, you are more than unwelcome here and you should move quickly before they spot you."
 PoD_homeland_bone_gnawers.3.a: "Quickly and quietly..."

 PoD_homeland_bone_gnawers.200.t: "The Ring of the Elements"
 PoD_homeland_bone_gnawers.200.desc: "The homeland of the Bone Gnawers resembles a slum part of a city. Taverns are open 24 hours every day and all serve cheap beer by the pitcher. Joyhouse joints are on every block, but the canny Gnawer knows the best are found in back alleyways, by knocking on the right doors.\nIn one of those alleyways, you stumble across what appears to be a game of chance with high stakes. The players beckon you to join them, enticing you with the promise of the ultimate prize of this event, what seems like a powerful ring brimming with magic."
 PoD_homeland_bone_gnawers.200.a: "Let us play then."



 PoD_homeland_children_of_gaia.1.t: "Heavenly Harmony"
 PoD_homeland_children_of_gaia.1.desc: "The homeland of the Children of Gaia is a vast expanse of lush forests, rolling hills and bubbling streams meandering through the valleys. Humans free of the Delirium wander nomadically across the homeland, with central metropolises that reflect cleaner versions of the cities of ancient Sumer.\nIt represents the ultimate goal of the Children of Gaia and what they fight for. An useful reminder in times of trouble."
 PoD_homeland_children_of_gaia.1.a: "One day, it won't just be a dream anymore."
 
 PoD_homeland_children_of_gaia.2.t: "Spiritual Mentors"
 PoD_homeland_children_of_gaia.2.desc: "The homeland of the Children of Gaia is a vast expanse of lush forests, rolling hills and bubbling streams meandering through the valleys. Humans free of the Delirium wander nomadically across the homeland, with central metropolises that reflect cleaner versions of the cities of ancient Sumer.\nSome respected Children of Gaia are here, ready to teach respectful cubs their hard earned wisdom."
 PoD_homeland_children_of_gaia.2.a: "I will stay and listen."

 PoD_homeland_children_of_gaia.3.t: "Unwelcome Guest"
 PoD_homeland_children_of_gaia.3.desc: "The homeland of the Children of Gaia is a vast expanse of lush forests, rolling hills and bubbling streams meandering through the valleys. Humans free of the Delirium wander nomadically across the homeland, with central metropolises that reflect cleaner versions of the cities of ancient Sumer.\nChildren of Gaia are known to be amenable for werewolves, but they are still werewolves. This is their most sacred place and they defend it fiercely. You shouldn't stay here long, or you will get caught."
 PoD_homeland_children_of_gaia.3.a: "Quickly and quietly..."


 PoD_homeland_children_of_gaia.200.t: "The Harp of Enchantment"
 PoD_homeland_children_of_gaia.200.desc: "The homeland of the Children of Gaia is a vast expanse of lush forests, rolling hills and bubbling streams meandering through the valleys. Humans free of the Delirium wander nomadically across the homeland, with central metropolises that reflect cleaner versions of the cities of ancient Sumer.\nOne of the most prized artifacts of the tribe, the Harp of Enchantment, resides here. It can only be removed from the realm during times of need by a worthy champion. Perhaps you could try to convince your peers that it is indeed the right time and that you are worthy of it?"
 PoD_homeland_children_of_gaia.200.a: "My first point is..."


 PoD_homeland_fianna.1.t: "Rowdy Paradise"
 PoD_homeland_fianna.1.desc: "The homeland of the Fianna is a green landscape of hills, dales and vales that look like they were drawn from the traditions of historical fantasy novels. Faeries play in the woods and stag-spirits roam the land under the guidance of Stag as the "Wild Hunt", protecting the homeland against intruders.\nFor any self respecting Fianna, this is the way life should always be."
 PoD_homeland_fianna.1.a: "Home, rowdy home."
  
 PoD_homeland_fianna.2.t: "Boastful Mentors"
 PoD_homeland_fianna.2.desc: "The homeland of the Fianna is a green landscape of hills, dales and vales that look like they were drawn from the traditions of historical fantasy novels. Faeries play in the woods and stag-spirits roam the land under the guidance of Stag as the "Wild Hunt", protecting the homeland against intruders.\nMany powerful Fianna are here, ready to teach newcomers their wisdom... if they are willing to listen to long winded tales of aggrandized exploits."
 PoD_homeland_fianna.2.a: "You talked down a whole pack of Fenris?"
 PoD_homeland_fianna.2.b: "That much gold?"
 
 PoD_homeland_fianna.3.t: "Unwelcome Guest"
 PoD_homeland_fianna.3.desc: "The homeland of the Fianna is a green landscape of hills, dales and vales that look like they were drawn from the traditions of historical fantasy novels. Faeries play in the woods and stag-spirits roam the land under the guidance of Stag as the "Wild Hunt", protecting the homeland against intruders.\nAs a non Fianna, you are one of those intruders. Escaping the Wild Hunt during your stay here will be difficult, and you better get moving as fast as you can."
 PoD_homeland_fianna.3.a: "I should run. Faster."

 PoD_homeland_fianna.200.t: "The Three of Tara"
 PoD_homeland_fianna.200.desc: "The homeland of the Fianna is a green landscape of hills, dales and vales that look like they were drawn from the traditions of historical fantasy novels. Faeries play in the woods and stag-spirits roam the land under the guidance of Stag as the "Wild Hunt", protecting the homeland against intruders.\nLong ago, the Fianna lost three powerful relics during the difficult battle of the Hill of Tara. Since then, it has been a common rite of passage for worthy Fianna leaders to launch a quest to retrieve these artifacts. Such an endeavor will be costly however and with no guarantees of success."
 PoD_homeland_fianna.200.a: "We must find the horn of the white stag!"
 PoD_homeland_fianna.200.b: "The golden torc can be retrieved!"
 PoD_homeland_fianna.200.c: "The crone's tongue calls to me."


 
 PoD_homeland_get_of_fenris.1.t: "Frozen Paradise"
 PoD_homeland_get_of_fenris.1.desc: "Fjords, vast expanses of tundra and cold, dark taiga, all enshrouded by perpetual winter, make up the Fenrir's homeland. Packs of ice-age megafauna, like dire wolves and mammoths, roam the land and attack any solitary werewolf. The Fenrir congregate in lodge-villages where they drink, fight, carouse and pass on the sagas of their deeds.\nFor a Get of Fenris, it is the best life and the only one truly worth living."
 PoD_homeland_get_of_fenris.1.a: "Feasting and fighting!"
   
 PoD_homeland_get_of_fenris.2.t: "Warmasters"
 PoD_homeland_get_of_fenris.2.desc: "Fjords, vast expanses of tundra and cold, dark taiga, all enshrouded by perpetual winter, make up the Fenrir's homeland. Packs of ice-age megafauna, like dire wolves and mammoths, roam the land and attack any solitary werewolf. The Fenrir congregate in lodge-villages where they drink, fight, carouse and pass on the sagas of their deeds.\nExperienced warriors are plentiful here and ready to share their teachings to those humble enough to listen."
 PoD_homeland_get_of_fenris.2.a: "Mastering warfare."
 PoD_homeland_get_of_fenris.2.b: "Mastering fighting."
  
 PoD_homeland_get_of_fenris.3.t: "Unwelcome Guest"
 PoD_homeland_get_of_fenris.3.desc: "Fjords, vast expanses of tundra and cold, dark taiga, all enshrouded by perpetual winter, make up the Fenrir's homeland. Packs of ice-age megafauna, like dire wolves and mammoths, roam the land and attack any solitary werewolf. The Fenrir congregate in lodge-villages where they drink, fight, carouse and pass on the sagas of their deeds.\nHere, either you are a Get of Fenris or you are a foe that must be taken down. Sadly, you are in the second category so you shouldn't tarry for long."
 PoD_homeland_get_of_fenris.3.a: "I should run. Faster."

 PoD_homeland_get_of_fenris.200.t: "The Jarl's Hammers"
 PoD_homeland_get_of_fenris.200.desc: "Fjords, vast expanses of tundra and cold, dark taiga, all enshrouded by perpetual winter, make up the Fenrir's homeland. Packs of ice-age megafauna, like dire wolves and mammoths, roam the land and attack any solitary werewolf. The Fenrir congregate in lodge-villages where they drink, fight, carouse and pass on the sagas of their deeds.\nThe seven mighty Jarl's Hammers were the prized weapons of the heroes that gave their life to stop the accursed Wotan. Some were retrieved after the battle while others were lost. But all of them would be quite the prize to the ambitious Fenrir willing to quest for them."
 PoD_homeland_get_of_fenris.200.a: "Forge-Crusher?"
 PoD_homeland_get_of_fenris.200.b: "Grinding-Tooth?"
 PoD_homeland_get_of_fenris.200.c: "Spear-Chaser?"
 PoD_homeland_get_of_fenris.200.d: "Troll-Eater?"
 PoD_homeland_get_of_fenris.200.e: "Bright-Arm?"
 PoD_homeland_get_of_fenris.200.f: "Hag-Talon?"
 PoD_homeland_get_of_fenris.200.g: "Pain-Eagle?"




 
 PoD_homeland_warders_of_men.1.t: "Glassy Paradise"
 PoD_homeland_warders_of_men.1.desc: "The homeland of the [GetPlayer.Custom( 'glasswalker_custom_name' )] is a metropolis built in accordance with Gaian designs. High towers have dozens of open-air garden levels brimming with vegetation and the birds and animals that are naturally attracted to these plants. Each garden caters to a different ecology. Many humans happily spend their lives within just a few towers.\nThis perfectly structured life is quite the sight for any weary Warder of Men, reminding their soul of their greater purpose."
 PoD_homeland_warders_of_men.1.a: "Everything in order."
    
 PoD_homeland_warders_of_men.2.t: "Leaders of Men and Wolves"
 PoD_homeland_warders_of_men.2.desc: "The homeland of the [GetPlayer.Custom( 'glasswalker_custom_name' )] is a metropolis built in accordance with Gaian designs. High towers have dozens of open-air garden levels brimming with vegetation and the birds and animals that are naturally attracted to these plants. Each garden caters to a different ecology. Many humans happily spend their lives within just a few towers.\nMany respected elders of the tribe are gathered here, ready to dispense their wisdom to the deferential listener."
 PoD_homeland_warders_of_men.2.a: "Creating order from chaos."
  
 PoD_homeland_warders_of_men.3.t: "Unwelcome Guest"
 PoD_homeland_warders_of_men.3.desc: "The homeland of the [GetPlayer.Custom( 'glasswalker_custom_name' )] is a metropolis built in accordance with Gaian designs. High towers have dozens of open-air garden levels brimming with vegetation and the birds and animals that are naturally attracted to these plants. Each garden caters to a different ecology. Many humans happily spend their lives within just a few towers.\nThe Warders are vigilant against anyone who would try to disrupt their beloved order. As such, you have to move quickly before they find you."
 PoD_homeland_warders_of_men.3.a: "Quickly and quietly..."

 PoD_homeland_warders_of_men.200.t: "The Dreamcaller"
 PoD_homeland_warders_of_men.200.desc: "The homeland of the [GetPlayer.Custom( 'glasswalker_custom_name' )] is a metropolis built in accordance with Gaian designs. High towers have dozens of open-air garden levels brimming with vegetation and the birds and animals that are naturally attracted to these plants. Each garden caters to a different ecology. Many humans happily spend their lives within just a few towers.\nA prized artifact of the Warders, the Dreamcaller, resides there in the hold of one the realm's guardians. They have been known to entrust this powerful artifact to Warders that have proved their skill at leading humanity. As such, you could try convincing them that you are one of those worthies."
 PoD_homeland_warders_of_men.200.a: "Humanity loves me!"



 PoD_homeland_red_talons.1.t: "Wild Paradise"
 PoD_homeland_red_talons.1.desc: "The Red Talon homeland is a large, unspoiled wilderness. Predators hunt unrestricted and compete with each other. Foremost are large packs of wolves that have come to dominate the homeland.\nRed Talons feel at home here, finally free to let their primal instincts go wild."
 PoD_homeland_red_talons.1.a: "As it should be."

 PoD_homeland_red_talons.2.t: "Leaders of the Pack"
 PoD_homeland_red_talons.2.desc: "The Red Talon homeland is a large, unspoiled wilderness. Predators hunt unrestricted and compete with each other. Foremost are large packs of wolves that have come to dominate the homeland.\nPowerful pack leaders can be found here, ready to teach the worthy cubs their experience in the wilderness."
 PoD_homeland_red_talons.2.a: "Learning from the best."

 PoD_homeland_red_talons.3.t: "Unwelcome Guest"
 PoD_homeland_red_talons.3.desc: "The Red Talon homeland is a large, unspoiled wilderness. Predators hunt unrestricted and compete with each other. Foremost are large packs of wolves that have come to dominate the homeland.\nIf you aren't a Red Talon in this place, you are prey. And you are facing some of the best hunters there have ever been..."
 PoD_homeland_red_talons.3.a: "I should run. Faster."

 PoD_homeland_red_talons.200.t: "The Runestones"
 PoD_homeland_red_talons.200.desc: "The Red Talon homeland is a large, unspoiled wilderness. Predators hunt unrestricted and compete with each other. Foremost are large packs of wolves that have come to dominate the homeland.\nIt is said that, in this realm, one can find the Runestones left by the ancient wolves who dwelt here long ago. But only the bravest and wisest of Red Talon can hope to find one of those fabled relics."
 PoD_homeland_red_talons.200.a: "I will search for the Runestone of Gab."
 PoD_homeland_red_talons.200.b: "The Runestone of War calls to me."
 PoD_homeland_red_talons.200.c: "I need the Runestone of Control."
 PoD_homeland_red_talons.200.d: "The Runestone of Cunning is close by."
 PoD_homeland_red_talons.200.e: "The Runestone of Wisdom can teach me much."


 PoD_homeland_shadow_lords.1.t: "Shadowy Paradise"
 PoD_homeland_shadow_lords.1.desc: "The Shadow Lords live in an area dominated by a Great Mountain, the sky perpetually shrouded by dark clouds and lightning-storms. The peaks and forests below lie in eternal shadow, where the Shadow Lords gather in castles to conspire against each other to find a way to climb the mountain.\nAs strange as it might seem to the outsider, this feels like paradise to the crafty Shadow Lords."
 PoD_homeland_shadow_lords.1.a: "I want my own castle here!"
   
 PoD_homeland_shadow_lords.2.t: "Master Conspirators"
 PoD_homeland_shadow_lords.2.desc: "The Shadow Lords live in an area dominated by a Great Mountain, the sky perpetually shrouded by dark clouds and lightning-storms. The peaks and forests below lie in eternal shadow, where the Shadow Lords gather in castles to conspire against each other to find a way to climb the mountain.\nThe craftiest Shadow Lords can be found here and while they won't give their secrets easily, they can be persuaded to do so with proper deference."
 PoD_homeland_shadow_lords.2.a: "I listen, subtle one."

 PoD_homeland_shadow_lords.3.t: "Unwelcome Guest"
 PoD_homeland_shadow_lords.3.desc: "The Shadow Lords live in an area dominated by a Great Mountain, the sky perpetually shrouded by dark clouds and lightning-storms. The peaks and forests below lie in eternal shadow, where the Shadow Lords gather in castles to conspire against each other to find a way to climb the mountain.\nOutsiders like yourself are seen as entertaining distractions in this realm. Resident Shadow Lords are already devising some devious ways to capture and "play" with you..."
 PoD_homeland_shadow_lords.3.a: "I should run. Faster."

 PoD_homeland_shadow_lords.200.t: "The Grand Klaive"
 PoD_homeland_shadow_lords.200.desc: "The Shadow Lords live in an area dominated by a Great Mountain, the sky perpetually shrouded by dark clouds and lightning-storms. The peaks and forests below lie in eternal shadow, where the Shadow Lords gather in castles to conspire against each other to find a way to climb the mountain.\nYou have recently learned that one of the castle dweller here has one of the rare and powerful Grand Klaive in his possession. Maybe you could organize an expedition to relieve him of this burden?"
 PoD_homeland_shadow_lords.200.a: "Quickly and quietly."


 
 PoD_homeland_silver_fangs.1.t: "Lordly Paradise"
 PoD_homeland_silver_fangs.1.desc: "The Silver Fang's homeland is a vast expanse of territory that resembles the Russian steppes. In the center of the realm stands the Castle of Heroes, a monument to the deeds of the Silver Fangs in service to the Garou Nation.\nTruly, this is a realm where everyone can see that the Silver Fangs are indeed meant to be Kings and Queens."
 PoD_homeland_silver_fangs.1.a: "We stand tall."
    
 PoD_homeland_silver_fangs.2.t: "Kings of Wolves"
 PoD_homeland_silver_fangs.2.desc: "The Silver Fang's homeland is a vast expanse of territory that resembles the Russian steppes. In the center of the realm stands the Castle of Heroes, a monument to the deeds of the Silver Fangs in service to the Garou Nation.\nMany wise rulers dwell here, rightfully proud of their station and ready to talk about it to any inquisitive cub."
 PoD_homeland_silver_fangs.2.a: "Proud rulers of the Garou."
 PoD_homeland_silver_fangs.2.b: "Stout warleaders of the Nation."
  
 PoD_homeland_silver_fangs.3.t: "Unwelcome Guest"
 PoD_homeland_silver_fangs.3.desc: "The Silver Fang's homeland is a vast expanse of territory that resembles the Russian steppes. In the center of the realm stands the Castle of Heroes, a monument to the deeds of the Silver Fangs in service to the Garou Nation.\nThis is a land only fit for the Silver Fangs and the powerful Falcon and his children, ally of the tribe, warn them of any intruder. The hunt is on."
 PoD_homeland_silver_fangs.3.a: "I should run. Faster."

 PoD_homeland_silver_fangs.200.t: "The Iceblade"
 PoD_homeland_silver_fangs.200.desc: "The Silver Fang's homeland is a vast expanse of territory that resembles the Russian steppes. In the center of the realm stands the Castle of Heroes, a monument to the deeds of the Silver Fangs in service to the Garou Nation.\nYou are brought before Iceblade, the fabled relic of the tribe and told its story of glorious and worthy past owners. You are also told that any Silver Fang can challenge its current owner to a "live wargame" for its possession. Your host smirks and asks if you are interested."
 PoD_homeland_silver_fangs.200.a: "I'm the best armchair general!"


 PoD_homeland_white_howler.1.t: "Hellish Paradise"
 PoD_homeland_white_howler.1.desc: "The former homeland of the White Howlers has unrecognizably been twisted by the $glossary_wyrm$. The air is thick with smoke and ripples with heat. A sickly green sun beats down on the surface, unblocked by any kind of ozone layer. Night brings no relief as pollutants cool and sink to the surface, causing the moon to appear fluorescent yellow through the vapors.\nOnly Black Spiral Dancers can really appreciate such a hellscape, a reminder of the ultimate goal of their Wyrmish master."
 PoD_homeland_white_howler.1.a: "Sweet corruption!"
   
 PoD_homeland_white_howler.2.t: "Hellish Patrons"
 PoD_homeland_white_howler.2.desc: "The former homeland of the White Howlers has unrecognizably been twisted by the $glossary_wyrm$. The air is thick with smoke and ripples with heat. A sickly green sun beats down on the surface, unblocked by any kind of ozone layer. Night brings no relief as pollutants cool and sink to the surface, causing the moon to appear fluorescent yellow through the vapors.\nPowerful Bane Spirits can be found here, ready to teach their corruptive ways to eager Black Spiral Dancers."
 PoD_homeland_white_howler.2.a: "Corrupt the world!"
 PoD_homeland_white_howler.2.b: "Fight the world!"

 PoD_homeland_white_howler.3.t: "Unwelcome Guest"
 PoD_homeland_white_howler.3.desc: "The former homeland of the White Howlers has unrecognizably been twisted by the $glossary_wyrm$. The air is thick with smoke and ripples with heat. A sickly green sun beats down on the surface, unblocked by any kind of ozone layer. Night brings no relief as pollutants cool and sink to the surface, causing the moon to appear fluorescent yellow through the vapors.\nThis is one of the most tainted realm of the Wyrm and any intruder will be swiftly hunted down and (at best) quickly killed. You do not belong here."
 PoD_homeland_white_howler.3.a: "I should run. Faster."


 PoD_homeland_silent_strider.1.t: "Homely Paradise"
 PoD_homeland_silent_strider.1.desc: "The homeland of the Silent Striders is dominated by a gigantic river called the River of Life. Shrouded in ever-lasting night, it is otherwise made up of large silvery deserts and dominated by obelisks and similar monumental buildings inscribed with hieroglyphs, carefully aligned to highlight constellations commemorating Silent Strider heroes of old.\nThe Curse of Set severed the Silent Striders from their homeland for a long time and a deep sense of relief washes over any member of this tribe lucky enough to find a way back here."
 PoD_homeland_silent_strider.1.a: "Home at last."
     
 PoD_homeland_silent_strider.2.t: "Lessons of the Exiled"
 PoD_homeland_silent_strider.2.desc: "The homeland of the Silent Striders is dominated by a gigantic river called the River of Life. Shrouded in ever-lasting night, it is otherwise made up of large silvery deserts and dominated by obelisks and similar monumental buildings inscribed with hieroglyphs, carefully aligned to highlight constellations commemorating Silent Strider heroes of old.\nThere is much to be learned here, tales from before the exile in particular provides the inquisitive Strider with a unique insight into the troubled history of their tribe."
 PoD_homeland_silent_strider.2.a: "We were part of a great alliance once."
 PoD_homeland_silent_strider.2.b: "Owl works in mysterious ways."
  
 PoD_homeland_silent_strider.3.t: "Unwelcome Guest"
 PoD_homeland_silent_strider.3.desc: "The homeland of the Silent Striders is dominated by a gigantic river called the River of Life. Shrouded in ever-lasting night, it is otherwise made up of large silvery deserts and dominated by obelisks and similar monumental buildings inscribed with hieroglyphs, carefully aligned to highlight constellations commemorating Silent Strider heroes of old.\nWhile mostly empty, the realm still waits for its Silent Striders occupants. Any intruder will have the nasty surprise of being plagued by curses and falling into traps as long as they stay here."
 PoD_homeland_silent_strider.3.a: "I should run. Faster."