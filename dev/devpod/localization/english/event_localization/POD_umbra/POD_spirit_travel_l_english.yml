 # Gauntlet
 
 POD_gauntlet.101.t:0 "The Gauntlet"
 POD_gauntlet.101.desc:0 "The Gauntlet, also referred to as the Wall in the Middle Kingdom, is the barrier surrounding material reality, separating it from the Umbra.\n\nThe Gauntlet may never be lowered below 1, and if it is raised to 10, spirits in the vicinity must spend Willpower or flee the area."
 POD_gauntlet.101.a:0 "Strengthening the Gauntlet."
 POD_gauntlet.101.b:0 "Weakening the Gauntlet."
 POD_gauntlet.101.c:0 "Tear Down the Gauntlet!"
 POD_gauntlet.101.d:0 "Nevermind."
 
 POD_gauntlet.102.t:0 "The Wall"
 POD_gauntlet.102.desc:0 "The spirit realms are separated from the Middle Kingdom by a mystic barrier known as the Wall. It prevents contact between the mortal and spirit worlds. It is stronger in some areas, weaker in others, but it is never entirely absent.\n\nThe Wall may never be lowered below 1, and if it is raised to 10, no being in the area may use Chi powers of any sort. Spirits in a vicinity with a Wall rating of 10 must spend Willpower or flee the area; in any event, they will be extremely uncomfortable and unable to spend Chi."
 POD_gauntlet.102.a:0 "Strengthening the Wall."
 POD_gauntlet.102.b:0 "Weakening the Wall."
 POD_gauntlet.102.c:0 "Tear Down the Wall!"
 POD_gauntlet.102.d:0 "Nevermind."
 
 POD_shroud.101.t:0 "The Shroud"
 POD_shroud.101.desc:0 "The [underworld|E] is separated from the [skinlands|E] by a mystic barrier known as the Shroud. The Shroud makes the [shadowlands|E] imperceptible to most living creatures and obscures [skinlands|E] activity to the dead. It is stronger in some areas and weaker in others, but it is never entirely absent.\n\nThe Shroud may never be lowered below 1, and if it is raised to 10, spirits in the vicinity must spend Willpower or flee the area."
 POD_shroud.101.a:0 "Strengthening the Shroud."
 POD_shroud.101.b:0 "Weakening the Shroud."
 POD_shroud.101.c:0 "Tear Down the Shroud!"
 POD_shroud.101.d:0 "Nevermind."
 
 # KJ only event
 
 POD_umbra_kj.1001.t:0 "Inspiration"
 POD_umbra_kj.1001.desc:0 "The areas of the spirit worlds close to the Wall are called the Mirror Lands, so named because they appear as ghostly reflections of the nearby Middle Kingdom.\n\nLooking at this extraordinary view makes you feel inspired."
 POD_umbra_kj.1001.a:0 "It's amazing!"
 
 POD_umbra_kj.1002.t:0 "Teaching of the Spirits"
 POD_umbra_kj.1002.desc_opening:0 "You entered the Spirit World, as deep you can, then you received instructions from a"
 POD_umbra_kj.1002.desc_high:0 "ancient, historic Wan Kuei, a Grand Ancestor"
 POD_umbra_kj.1002.desc_yin:0 "Yama King"
 POD_umbra_kj.1002.desc_yang:0 "powerful spirit"
 POD_umbra_kj.1002.desc_low:0 "normal spirit"
 POD_umbra_kj.1002.desc_ending:0 "who shared some dharma understanding."
 POD_umbra_kj.1002.a:0 "My spirit mentor."
 
 # Action event
 
 POD_umbra_action.1001.t:0 "Battleground"
 POD_umbra_action.1001.desc:0 "The Battleground is a realm dedicated to violence and rage, and chaos rules it as armies mix up and Qin soldiers end up fighting against Roman legions and the Crusaders ally themselves with Viking barbarians against Mayan troops. As long as one does not enter one of the conflicts, a visitor walks on a "track" appropriate to the battle they witness (a boat for a naval battle, a Roman road for a conflict during the Punic wars etc.). As long as they do not step off the track, they will not be attacked directly.\nThis is a great way to learn new (or ancients) strategies that could be relevant to your era in some way."
 
 # Calm Spirit
 
 POD_umbra_local.101.t:0 "Calm Spirit"
 POD_umbra_local.101.desc:0 "You try to raise your opinion with the local spirits so that they will listen to you.\nYou could try the diplomatic approach or be more forceful. Spirits tend to be whimsical creatures and arguing with them can take a long time."
 POD_umbra_local.101.a:0 "Friends, hear me."
 POD_umbra_local.101.b:0 "From spirit to spirits..."
 POD_umbra_local.101.c:0 "Obey your superior!"
 POD_umbra_local.101.d:0 "Maybe some other time."
 
 POD_umbra_local.102.t:0 "Calm Wraith"
 POD_umbra_local.102.desc:0 "You try to raise your opinion with the local wraiths so that they will listen to you.\nYou could try the diplomatic approach or be more forceful. Wraiths tend to be self focused creatures and arguing with them can take a long time."
 POD_umbra_local.102.a:0 "Friends, hear me."
 POD_umbra_local.102.b:0 "From wraith to wraiths..."
 POD_umbra_local.102.c:0 "I command you to kneel!"
 POD_umbra_local.102.d:0 "Maybe some other time."
 
 # Usurp
 
 POD_umbra_local.201.t:0 "Colonization"
 POD_umbra_local.201.desc:0 "You will try to claim this part of the [spirit_wilds|E] that doesn't have a ruler, you will just need to deal with some unfriendly locals. Diplomacy or force could convince them to acknowledge you as the new owner of this spiritual realm."
 POD_umbra_local.201.a:0 "Get out of my place."
 POD_umbra_local.201.b:0 "Let's make a deal."
 POD_umbra_local.201.c:0 "Maybe some other time."
 
 POD_umbra_local.202.t:0 "Colonization"
 POD_umbra_local.202.desc:0 "You will try to claim this part of the [shadowlands|E] that doesn't have a ruler, you will just need to deal with some unfriendly locals. Diplomacy or force could convince them to acknowledge you as the new owner of this spiritual realm."
 POD_umbra_local.202.a:0 "Get out of my place."
 POD_umbra_local.202.b:0 "Let's make a deal."
 POD_umbra_local.202.c:0 "Maybe some other time."
 
 POD_umbra_local.301.t:0 "Conquest"
 POD_umbra_local.301.desc:0 "You will try to claim this part of the [spirit_wilds|E] from [victim.GetFirstName]. Diplomacy or force could convince them to acknowledge you as the new owner of this spiritual realm."
 POD_umbra_local.301.a:0 "Nice place, I will take it."
 POD_umbra_local.301.b:0 "Let's make a deal."
 POD_umbra_local.301.c:0 "I order you to give it me!"
 POD_umbra_local.301.d:0 "Maybe some other time."
 
 POD_umbra_local.302.t:0 "Conquest"
 POD_umbra_local.302.desc:0 "You will try to claim this part of the [shadowlands|E] from [victim.GetFirstName]."
