l_english:
 spirit_travel_header:0 "Reaching:"
 
 POD_spirit_travel.20.t:0 "#X $spirit_travel_header$ Fall into Oblivion#!"
 POD_spirit_travel.20.desc:0 "#X You fall into the Oblivion...#!"
 POD_spirit_travel.20.a:0 "#X ...#!"
 
 # Pass
 
 POD_umbra_pass.101.t:0 "$spirit_travel_header$ Open a Nihil"
 POD_umbra_pass.101.desc:0 "A membrane exists between the Shadowlands and the Tempest, you can't enter the Tempest without opening a Nihil"
 POD_umbra_pass.101.a:0 "I will make a sacrifice to open it."
 POD_umbra_pass.101.b:0 "Nevermind."

 POD_umbra_pass.102.t:0 "Pass the Temple Obscura"
 POD_umbra_pass.102.desc:0 "The Temple Obscura is a location in Malfeas at the entrance to the Black Spiral Labyrinth. It is a colossal mix of mosque and cathedral, of Eastern minarets and Western fluting."
 POD_umbra_pass.102.a:0 "I will ask to pass."
 POD_umbra_pass.102.a.tt:0 "This option is available because you are serving the Wyrm."
 POD_umbra_pass.102.b:0 "I want to sneak in"
 POD_umbra_pass.102.b.duel.desc:0 "Sneaking Challenge"
 POD_umbra_pass.102.b.duel.tt.success:0 "That was Solid."
 POD_umbra_pass.102.b.duel.tt.failure:0 "!"
 POD_umbra_pass.102.c:0 "I better not enter here."
 
 POD_umbra_pass.103.t:0 "$spirit_travel_header$ Stop Hanging Around"
 POD_umbra_pass.103.desc:0 "You are not tethered to the living world at all, and can take a one-way trip to the Underworld whenever your want. The only reason you are still around is because you want to be here, not that that you have to like most spooks. Are you sure you want to make this trip now?"
 POD_umbra_pass.103.a:0 "It's time to cross the Tempest."
 POD_umbra_pass.103.b:0 "I still have things to do."
 
 POD_umbra_pass.104.t:0 "Cross the Shroud"
 POD_umbra_pass.104.desc:0 "Are you sure about flinging yourself through the Shroud at the same speed as a projectile? This will hurt your [Corpus|E] (at the same level as local Shroud)."
 POD_umbra_pass.104.a:0 "Yes!"
 POD_umbra_pass.104.b:0 "No."
 
 # Lost
 
 POD_umbra_lost.101.t:0 "$spirit_travel_header$ Lost in the Tempest"
 POD_umbra_lost.101.desc:0 "You couldn't orientate yourself in the ever-shifting Tempest, you ended in the same place as where you started."
 POD_umbra_lost.101.a:0 "Fine."
 
 POD_umbra_lost.102.t:0 "$spirit_travel_header$ Trapped in the Labyrinth"
 POD_umbra_lost.102.desc:0 "You couldn't orientate yourself in the nonsensical Labyrinth, you ended in the same place as where you started."
 POD_umbra_lost.102.a:0 "I am lost."
 POD_umbra_lost.102.b:0 "Save me, Grand Serpent!"
 
 # Fallback
 
 POD_umbra_fallback.1100.t:0 "Diplomacy Challenge"
 POD_umbra_fallback.1100.desc:0 "You are stopped by someone who lives in this area, maybe you can convince them to show you how to pass beyond that point? Denizens of the Umbra are notoriously difficult to understand and even more difficult to convince though."
 POD_umbra_fallback.1110.t:0 "Martial Challenge"
 POD_umbra_fallback.1110.desc:0 "You are stopped by a riddle in the form of a wargame. It is time to show how good you are at that. Playing with 'live action' pieces in the form of bound spirits is quite difficult to grasp at first though, making this a disturbing and surreal experience."
 POD_umbra_fallback.1120.t:0 "Stewardship Challenge"
 POD_umbra_fallback.1120.desc:0 "You are stopped by a riddle in form of a equation, are you good in maths? You will have to first decipher the numbers used by the trickster spirits though, which makes the problem even harder to solve."
 POD_umbra_fallback.1130.t:0 "Intrigue Challenge"
 POD_umbra_fallback.1130.desc:0 "You meet a strong spirit guardian in your path, maybe you can distract them with some trick? Best make it convincing though, he really doesn't look friendly."
 POD_umbra_fallback.1140.t:0 "Learning Challenge"
 POD_umbra_fallback.1140.desc:0 "You are stopped by a puzzle, can you solve it? The Umbra being a twisted version of the 'real' world, you can find some patterns and clues that makes at least a modicum of sense to you."
 POD_umbra_fallback.1100.a:0 "I will do my best."
 POD_umbra_fallback.1100.critical_success:0 "Critical Success"
 POD_umbra_fallback.1100.success:0 "Success"
 POD_umbra_fallback.1100.fail:0 "Fail"
 POD_umbra_fallback.1100.critical_fail:0 "Critical Fail"
 
 # Gauntlet
 
 POD_gauntlet.101.t:0 "The Shroud"
 POD_gauntlet.101.desc:0 "The Underworld is separated from the Skinlands by a mystic barrier known as the Shroud. The Shroud makes the Shadowlands imperceptible to most living creatures and obscures Skinlands activity to the dead. It is stronger in some areas and weaker in others, but it is never entirely absent.\n\nThe Shroud may never be lowered below 1, and if it is raised to 10, spirits in the vicinity must spend Willpower or flee the area."
 POD_gauntlet.101.a:0 "Strengthening the Shroud."
 POD_gauntlet.101.b:0 "Weakening the Shroud."
 POD_gauntlet.101.c:0 "Tear Down the Shroud!"
 POD_gauntlet.101.d:0 "Nevermind."
 
 POD_gauntlet.102.t:0 "The Wall"
 POD_gauntlet.102.desc:0 "The spirit realms are separated from the Middle Kingdom by a mystic barrier known as the Wall. It prevents contact between the mortal and spirit worlds. It is stronger in some areas, weaker in others, but it is never entirely absent.\n\nThe Wall may never be lowered below 1, and if it is raised to 10, no being in the area may use Chi powers of any sort. Spirits in a vicinity with a Wall rating of 10 must spend Willpower or flee the area; in any event, they will be extremely uncomfortable and unable to spend Chi."
 POD_gauntlet.102.a:0 "Strengthening the Wall."
 POD_gauntlet.102.b:0 "Weakening the Wall."
 POD_gauntlet.102.d:0 "Nevermind."
 
 # KJ only event
 
 POD_spirit_travel.1001.t:0 "$spirit_travel_header$ Inspiration"
 POD_spirit_travel.1001.desc:0 "The areas of the spirit worlds close to the Wall are called the Mirror Lands, so named because they appear as ghostly reflections of the nearby Middle Kingdom.\n\nThis is your first spirit travel, looking at this extraordinary view makes you feel inspired."
 POD_spirit_travel.1001.a:0 "It's amazing!"
 
 POD_spirit_travel.1002.t:0 "$spirit_travel_header$ Teaching of Spirit"
 POD_spirit_travel.1002.desc_opening:0 "You entered the Spirit World, as deep you can, then you received instructions from a"
 POD_spirit_travel.1002.desc_high:0 "ancient, historic Wan Kuei, a Grand Ancestor"
 POD_spirit_travel.1002.desc_yin:0 "Yama King"
 POD_spirit_travel.1002.desc_yang:0 "powerful spirit"
 POD_spirit_travel.1002.desc_low:0 "normal spirit"
 POD_spirit_travel.1002.desc_ending:0 "who shared some dharma understanding."
 POD_spirit_travel.1002.a:0 "My spirit mentor."
 
 POD_spirit_travel.1003.t:0 "$spirit_travel_header$ Teaching of Spirit"
 POD_spirit_travel.1003.desc:0 "You entered the Spirit World, as deep you can, then you received instructions from [spirit_mentor.GetName] who shared some spiritual understanding."
 POD_spirit_travel.1003.a:0 "My spirit mentor."
 
 # Location specific event in wait
 
 POD_spirit_travel.1010.t:0 "$spirit_travel_header$ Forbidden Corruption"
 POD_spirit_travel.1010.desc:0 "You are now in the Well of the Void. You see no chance of escaping, perhaps you should listen to the alluring voice..."
 POD_spirit_travel.1010.a:0 "I bow to you, Grand Serpent!"
 POD_spirit_travel.1010.b:0 "Never!"
 
 POD_spirit_travel.1200.t:0 "$spirit_travel_header$ Maelstrom"
 POD_spirit_travel.1200.desc:0 "Maelstroms erupt from the Labyrinth and can touch anywhere the Tempest touches - from the Shadowlands to the [dark_kingdom|E]. Maelstroms are composed of the stuff of the underworld - relics, Specters and Tempest-matter itself, ranging from rains of plasma to storms of soulfire. The Tempest is a font of memory, and a lucky scavenger can sometimes find a useful item hidden among the dross."
 POD_spirit_travel.1200.a:0 "I could find something useful in here."
 POD_spirit_travel.1200.b:0 "I should hide."
 
 POD_spirit_travel.1211.t:0 "$spirit_travel_header$ Battleground"
 POD_spirit_travel.1211.desc:0 "Battleground contains every battle that has ever been fought, and you have learned some tactics from them."
 
 POD_spirit_travel.1221.t:0 "$spirit_travel_header$ Mysterious Device"
 POD_spirit_travel.1221.desc:0 "You have found a mysterious device in the massive piles of Inventium, what are you gonna do with that?"
 POD_spirit_travel.1221.a:0 "I will keep that."
 POD_spirit_travel.1221.b:0 "I will sell that."
 
 POD_spirit_travel.1222.t:0 "$spirit_travel_header$ Swimming in Inventions"
 POD_spirit_travel.1222.desc:0 "Do you want to search in the massive piles of Inventium to find something useful?"
 POD_spirit_travel.1222.a:0 "I will try."
 POD_spirit_travel.1222.b:0 "Nevermind."
 
 POD_spirit_possession.1001.t:0 "$spirit_travel_header$ Spirit Possession"
 POD_spirit_possession.1001.desc:0 "A bane spirit has appeared and attempts to possess you."
 POD_spirit_possession.1001.a:0 "I will accept this."
 POD_spirit_possession.1001.b:0 "I can offer you another vessel..."
 POD_spirit_possession.1001.c:0 "Never!"
 
 POD_spirit_possession.2001.t:0 "$spirit_travel_header$ Spirit Possession"
 POD_spirit_possession.2001.desc:0 "A Wyld-spirit has appeared and attempts to possess you."
 POD_spirit_possession.2001.a:0 "I will accept this."
 POD_spirit_possession.2001.b:0 "I can offer you another vessel..."
 POD_spirit_possession.2001.c:0 "Never!"
 
 POD_spirit_possession.3001.t:0 "$spirit_travel_header$ Spirit Possession"
 POD_spirit_possession.3001.desc:0 "A Weaver-spirit has appeared and attempts to possess you."
 POD_spirit_possession.3001.a:0 "I will accept this."
 POD_spirit_possession.3001.b:0 "I can offer you another vessel..."
 POD_spirit_possession.3001.c:0 "Never!"
 
 POD_spirit_possession.4001.t:0 "$spirit_travel_header$ Spirit Possession"
 POD_spirit_possession.4001.desc:0 "A Gaian spirit has appeared and attempts to possess you."
 POD_spirit_possession.4001.a:0 "I will accept this."
 POD_spirit_possession.4001.b:0 "I can offer you another vessel..."
 POD_spirit_possession.4001.c:0 "Never!"