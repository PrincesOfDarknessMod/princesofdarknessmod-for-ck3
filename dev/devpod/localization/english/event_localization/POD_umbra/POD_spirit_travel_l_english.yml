l_english:
 spirit_travel_header:0 "Reaching:"
 
 # Pass
 
 POD_umbra_pass.101.t:0 "Opening a Nihil"
 POD_umbra_pass.101.desc:0 "A membrane exists between the [shadowlands|E] and the [tempest|E], you can't enter the [tempest|E] without opening a Nihil"
 POD_umbra_pass.101.a:0 "I will make a sacrifice to open it."
 POD_umbra_pass.101.b:0 "I will use my Instant Nihil."
 POD_umbra_pass.101.c:0 "Nevermind."
 
 POD_umbra_pass.103.t:0 "Stop Hanging Around"
 POD_umbra_pass.103.desc:0 "You are not tethered to the living world at all, and can take a one-way trip to the [underworld|E] whenever your want. The only reason you are still around is because you want to be here, not that that you have to like most spooks. Are you sure you want to make this trip now?"
 POD_umbra_pass.103.a:0 "It's time to cross the [tempest|E]."
 POD_umbra_pass.103.b:0 "I still have things to do."
 
 POD_umbra_pass.104.t:0 "Cross the Shroud"
 POD_umbra_pass.104.desc:0 "Are you sure about flinging yourself through the Shroud at the same speed as a projectile? This will hurt your [Corpus|E] (at the same level as local Shroud)."
 POD_umbra_pass.104.a:0 "Yes!"
 POD_umbra_pass.104.b:0 "No."

 POD_umbra_pass.202.t:0 "Pass the Temple Obscura"
 POD_umbra_pass.202.desc:0 "The Temple Obscura is a location in [malfeas|E] at the entrance to the [black_spiral_labyrinth|E]. It is a colossal mix of mosque and cathedral, of Eastern minarets and Western fluting."
 POD_umbra_pass.202.a:0 "I will ask to pass."
 POD_umbra_pass.202.a.tt:0 "This option is available because you are serving the Wyrm."
 POD_umbra_pass.202.b:0 "I want to sneak in"
 POD_umbra_pass.202.b.duel.tt.success:0 "That was Solid."
 POD_umbra_pass.202.b.duel.tt.failure:0 "!"
 POD_umbra_pass.202.c:0 "I better not enter here."
 
 POD_umbra_pass.205.t:0 "Stop!"
 POD_umbra_pass.205.desc:0 "You are stopped by guards, they don't recognize you as part of the wraithly realm of Stygia, how will you proceed?"
 POD_umbra_pass.205.a:0 "I have come here to join the legion."
 POD_umbra_pass.205.b:0 "I want to be part of the guild."
 POD_umbra_pass.205.c:0 "I'm one of yours already!"
 POD_umbra_pass.205.d:0 "I will just turn around."
 
 POD_umbra_pass.206.t:0 "Stop!"
 POD_umbra_pass.206.desc:0 "You are stopped by guards, they don't recognize you as part of the Far Shore, how will you proceed?"
 POD_umbra_pass.206.a:0 "I have come here to praise the Shining Ones."
 POD_umbra_pass.206.b:0 "I'm one of yours already!"
 POD_umbra_pass.206.c:0 "I will just turn around."
 
 POD_umbra_pass.207.t:0 "Stop!"
 POD_umbra_pass.207.desc:0 "Dis is protected by a maze of wrecked ships, inhabited by pockets of Spectres enslaved with Nhudri’s Embrace to keep curious wraiths and hostile spectres at bay. The pathways through the maze are constantly shifting and it is nearly impossible to enter Dis without the consent of the Boatsmen's Society. How will you proceed?"
 POD_umbra_pass.207.a:0 "I want to swear an oath to you."
 POD_umbra_pass.207.b:0 "I will just turn around."
 POD_umbra_pass.207.a.duel.desc:0 "Ritual of Severance"
 
 POD_umbra_pass.208.t:0 "Walk into the Sun"
 POD_umbra_pass.208.desc:0 "The area of the Deep Umbra that houses Helios is nothing but heat and brilliant white light. Any surface within Helios’s realm is too hot to stand or remain near for too long. Only flying spirits enter this area of the Deep Umbra, and travelers without the ability to fly burn up in the fire before they have a chance to realize their mistake.\n\nAre you sure you want to touch the sun itself?"
 POD_umbra_pass.208.a:0 "Oh yes, I will touch the sun itself. A great idea!"
 POD_umbra_pass.208.b:0 "Helios will protect my soul."
 POD_umbra_pass.208.c:0 "Run!"
 
 # Lost
 
 POD_umbra_lost.100.t:0 "#X Fall into Oblivion#!"
 POD_umbra_lost.100.desc:0 "#X You fall into the Oblivion...#!"
 POD_umbra_lost.100.a:0 "#X ...#!"
 
 POD_umbra_lost.104.t:0 "Trapped in the Abyss"
 POD_umbra_lost.104.desc_demon:0 "You fall into the eternal prison created for your kind after Lucifer's rebellion once again. God, it seems, still has the last laugh."
 POD_umbra_lost.104.desc_infernalist:0 "You fall into the pit, and seems no way to come out unless you promise make a sacrifice to a demon lord..."
 POD_umbra_lost.104.a:0 "I will escape!"
 POD_umbra_lost.104.b:0 "I will sacrifice a prisoner."
 POD_umbra_lost.104.c:0 "I don't make deals with demons!"
 trapped_in_abyss_modifier:0 "Trapped in the Abyss"
 
 # Fallback
 
 POD_umbra_diplomacy.success:0 "Diplomacy Challenge: Success"
 POD_umbra_diplomacy.fail:0 "Diplomacy Challenge: Fail"
 POD_umbra_diplomacy.desc:0 "You are stopped by someone who lives in this area, maybe you can convince them to show you how to pass beyond that point? Denizens of the Umbra are notoriously difficult to understand and even more difficult to convince though."
 POD_umbra_martial.success:0 "Martial Challenge: Success"
 POD_umbra_martial.fail:0 "Martial Challenge: Fail"
 POD_umbra_martial.desc:0 "You are stopped by a riddle in the form of a wargame. It is time to show how good you are at that. Playing with 'live action' pieces in the form of bound spirits is quite difficult to grasp at first though, making this a disturbing and surreal experience."
 POD_umbra_stewardship.success:0 "Stewardship Challenge: Success"
 POD_umbra_stewardship.fail:0 "Stewardship Challenge: Fail"
 POD_umbra_stewardship.desc:0 "You are stopped by a riddle in form of a equation, are you good in maths? You will have to first decipher the numbers used by the trickster spirits though, which makes the problem even harder to solve."
 POD_umbra_intrigue.success:0 "Intrigue Challenge: Success"
 POD_umbra_intrigue.fail:0 "Intrigue Challenge: Fail"
 POD_umbra_intrigue.desc:0 "You meet a strong spirit guardian in your path, maybe you can distract them with some trick? Best make it convincing though, he really doesn't look friendly."
 POD_umbra_learning.success:0 "Learning Challenge: Success"
 POD_umbra_learning.fail:0 "Learning Challenge: Fail"
 POD_umbra_learning.desc:0 "You are stopped by a puzzle, can you solve it? The Umbra being a twisted version of the 'real' world, you can find some patterns and clues that makes at least a modicum of sense to you."
 POD_umbra_prowess.success:0 "Prowess Challenge: Success"
 POD_umbra_prowess.fail:0 "Prowess Challenge: Fail"
 POD_umbra_prowess.desc:0 "You are stopped by a spirit, maybe you can fight them and loot them."
 
