l_english:

 POD_CHANGE_CHARACTER_DEBATE_FORCE_ADD: "You #P gain#! $VALUE|0V$ Debate Strength"
 POD_CHANGE_CHARACTER_DEBATE_FORCE_SUBTRACT: "You #N lose#! $VALUE|0V$ MilDebateitary Strength"
 POD_CHANGE_OPPONENTS_DEBATE_FORCE_ADD: "The Opposition #N gains#! $VALUE|0V$ Debate Strength"
 POD_CHANGE_OPPONENTS_DEBATE_FORCE_SUBTRACT: "The Opposition #P loses#! $VALUE|0V$ Debate Strength"

 POD_debate_debate_strength_header: "#clickable Your current Debate Strength is [GetPlayer.MakeScope.GetVariable('character_debate_force').GetValue|V0]\nThe Opposition's Debate Strength is estimated at [GetPlayer.MakeScope.GetVariable('opponents_debate_force').GetValue|V0]#!\n\n"
 POD_debate_debate_explanation_footer: "$POD_debate_debate_explanation_footer_description$$POD_debate_debate_explanation_footer_initial_score$"
 POD_debate_debate_explanation_footer_description: "\n\n#R These debates use a score named Debate Strength. This score starts by looking at your and your chancellor's diplomacy, along with your traits, fame, piety, and relationship with the opposition. It will be raised or decreased during the debate itself based on the strength of your arguments.#!"
 POD_debate_debate_explanation_footer_initial_score: "\n#R Your starting Debate Strength is [GetPlayer.MakeScope.GetVariable('character_debate_force').GetValue|0].#!"
 POD_debate_argument.effect.success.desc: "Your argument is convincing"
 POD_debate_argument.critical.failure.effect.desc: "Your argument fails to sway them"

 POD_debate_select_opponent: "Selected as a debate opponent"
 POD_debate_select_opponent_from_dynasty: "Selects your debate opponents from your dynasty #weak ([GetPlayer.GetDynasty.GetBaseName])#!"
 POD_debate_select_opponent_from_faith: "Selects your debate opponents from your faith #weak ([GetPlayer.GetFaith.GetName])#!"
