 pod_ghoul_vassal_accepted_embrace.100: "Accepted Embrace!"
 pod_ghoul_vassal_rejected_embrace.100: "Rejected Embrace!"
 
 pod_embrace_offer_accepted.0001.desc: "I am grateful beyond words and would be immeasurably honoured to become your childe."
 pod_embrace_offer_accepted.0001.tooltip: "[recipient.GetTitledFirstNameNoTooltip] has accepted your offer of the [Embrace|E]"
 pod_embrace_offer_accepted.0001.a: "As [recipient.GetSheHe] should be..."
 
 pod_embrace_offer_rejected.0001.desc: "While I am flattered by your offer, at this time I have decided to keep my options open."
 pod_embrace_offer_rejected.0001.tooltip: "[recipient.GetTitledFirstNameNoTooltip] has rejected your offer of the [Embrace|E]!"
 pod_embrace_offer_rejected.0001.a: "Why you little!"
 
 pod_landed_ghoul_embrace.300.t: "Choose Your Sire"
 pod_landed_ghoul_embrace.300.desc: "This world is full of dangers, even to a [ROOT.Char.GetTitleTierName] and in order to secure my continued existence, I have discretely sought out a vampiric sire."
 pod_landed_ghoul_embrace.300.desc.a: "\n\n[domitor_rival.GetFullNameNicknamed], an ancient rival of my regnant [domitor.GetFirstNameNoTooltip], would love nothing more than to steal [domitor.GetHerHis] thrall from under [domitor.GetHerHim]."
 pod_landed_ghoul_embrace.300.desc.b: "\n \n[adjacent_ruler.GetLadyLord|U] [adjacent_ruler.GetFullNameNicknamed] is the ruler of a nearby realm and has shown interest in expanding [adjacent_ruler.GetHerHis] influence..."
 pod_landed_ghoul_embrace.300.desc.c: "\n \n[interloper.GetFullNameNicknamed] is a terrifyingly old Cainite that has noticed my rise to power..."
 pod_landed_ghoul_embrace.300.a: "But [domitor_rival.GetFirstNameNoTooltip] would enrage my "[domitor.GetLadyLord]" beyond belief..."
 pod_landed_ghoul_embrace.300.b: "[adjacent_ruler.GetFirstNameNoTooltip] would be the most advantageous choice."
 pod_landed_ghoul_embrace.300.c: "I will take my chances with [interloper.GetFirstNameNoTooltip]."
 pod_landed_ghoul_embrace.300.d: "Both of them fail to impress me."
 pod_landed_ghoul_embrace.300.d.more: "They all fail to impress me."
 pod_landed_ghoul_embrace.300.d.tt: "I have changed my mind about all this."