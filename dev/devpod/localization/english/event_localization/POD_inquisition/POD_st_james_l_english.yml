l_english:
   PODstjames.1.t: "Compostella I: A Chapter Endangered"
   PODstjames.1.desc: "In Santiago de Compostela lies one of the most sacred sites of pilgrimage of our faith: the shrine of Saint James. Many pilgrims travel far and wide to visit it. The site itself is under the custody of the Compostella Protectorate.\n\nTroubling news arrived: the local chapter recently was attacked by a werewolf. They managed to slay the monster but lost many good men in the process. However, the lupines are vengeful beasts and are preparing their retaliation: the Compostella Chapter is very likely to fall during the incoming attack.\n\nShould we take the risk to open our doors to shelter our brethren and help them live to fight another day?\nWhat if some of them were spies and this was nothing but a ploy from the bloodsuckers?"
   PODstjames.1.a: "Let's help them!"
   PODstjames.1.a.tt: "The Compostella protectorate relocate to your area."
   PODstjames.1.b: "This is certainly a trick! Close the doors!"
   PODstjames.1.b.tt: "You leave the protectorate to their fate."
   PODstjames.1.c: "What a disaster!"
   PODstjames.2.t: "Compostella II: A Chapter Divided"
   PODstjames.2.desc: "While the refugees start settling in the Nest, the fortress of your order, you are on your way to meet the leaders of the exiled protectorate. As you open the doors of your office, you see them shouting at each other, barely acknowledging you. The defense of Compostella was assured by their two rival Shadow Inquisition cells, and now they've somehow made it your problem.\n\nOn one side, the Poor Knights, led by [GetScriptedCharacterByHistoryID('791796').GetFirstName], a stern, humorless and redoutable man of God.\n\nOn the other side, [GetScriptedCharacterByHistoryID('791748').GetFirstName] of the Compostelean Eyes, a local branch from the Oculi Dei. Recently widowed, she is cautious and determined.\n\nThey finally noticed you, waiting for you to chime in."
   PODstjames.2.a: "Yes, yes... But we'll have to retake Santiago first."
   PODstjames.2.b: "Silence, fools! You owe us."
   PODstjames.2.tt: "You'll decide who'll get the custody of Compostella later."
   PODstjames.100.t: "The Compostella Settlement"
   PODstjames.100.desc: "With Santiago de Compostella now firmly back into our hands, it is time to purify the area from all traces of evil that haunted this place and to rebuild what was lost.\n\nBut one heated question remains, one that cannot stay unanswered for much longer: which order should take the custody of the Protectorate of Compostella?\n\nThe Poor Knights, the local branch of the Knights of Acre?\nThe Eyes of Compostella, obeying to the Oculus Dei?\nOr the Order of Saint James, that protected the roads across the mountain, leading to the rest of Europe?"  
   PODstjames.100.a: "The Poor Knights should be in charge."
   PODstjames.100.b: "The Eyes of Compostella should be in charge."
   PODstjames.100.c: "No! We can't trust either of them. We're in charge!"
   PODstjames.100.d: "The Sword of St. James should be in charge."