l_english:
 POD_mummy_resurrection.1.t: "Resurrecting"
 POD_mummy_resurrection.1.desc: "When they die, Mummies go into a lengthy (and unpleasant) process where their soul is thrown into a spiritual realm named the [UmbraGlossary('tempest')]. There, They slowly return to [UmbraGlossary('earth')]. Additionally, some types of $POD_splat_mummy_plural$ also will be judged."
 POD_mummy_resurrection.1.a: "Judge me"
 POD_mummy_resurrection.1.a.tt: "After death, you will be judged based on your integrity."
 POD_mummy_resurrection.1.b: "I have lost something important..."
 POD_mummy_resurrection.1.b.tt: "Due to your shaky foundation, you lost part of you in [UmbraGlossary('tempest')]"
 POD_mummy_resurrection.1.c: "Master, I have failed."
 POD_mummy_resurrection.1.c.tt: "Your master really dislike failed servants..."
 POD_mummy_resurrection.1.d: "I will be back"
 POD_mummy_resurrection.1.d.tt: "Due to your strong foundation, you managed to survive in [UmbraGlossary('tempest')] without losing anything"

 POD_mummy_resurrection.2.t: "Judgment"
 POD_mummy_resurrection.2.desc: "You have been killed, now you find yourself in the [UmbraGlossaryLocalized('shadowlands','Underworld')], and shall pass a judgment to prove you are worth resurrecting."
 POD_mummy_resurrection.2.a: "Weight my Sins."
 POD_mummy_resurrection.2.a.tt: "Punishment you will recive is based on Integrity level."
 POD_mummy_resurrection.2.b: "I don't need you."
 POD_mummy_resurrection.2.b.tt: "You will seek another master, Becoming what you swore to destroy."
 POD_mummy_resurrection.2.c: "Here is my heart, totaly my heart."
 POD_mummy_resurrection.2.c.tt: "You will cheat Judges. This won't work for next 50 years."
 
