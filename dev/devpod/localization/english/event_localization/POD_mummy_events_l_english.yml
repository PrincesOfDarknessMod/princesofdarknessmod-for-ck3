 podmummy.4101.aa:0 "Chogh, Chogh."
 podmummy.4101.ab:0 "Bentut, Bentut."
 podmummy.4101.ac:0 "Gemgem, Gemgem."
 podmummy.4101.ad:0 "Fegen, Fegen."
 podmummy.4101.ae:0 "Imdjer, Imdjer."
 podmummy.4101.af:0 "Bekhbekh, Bekhbekh."
 
 podmummy.4200.t:0 "$learning_true_names_head$ Discovering a New Ren"
 podmummy.4200.desc:0 "Learning a true name isn’t a simple matter of hearing a name once. It’s a matter of breaking down the name into component words, learning the meaning of each, learning their correct enunciation and pacing, and then putting them back together into the whole ren."
 podmummy.4200.a:0 "It takes time and dedication."
 
