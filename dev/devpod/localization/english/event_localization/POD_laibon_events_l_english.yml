l_english:
 pod_laibon.100.t: "The Mortal Petitioner"
 pod_laibon.100.desc: "A mortal from your domain seeks an audience. They bring a dispute that has no easy answer: a land boundary conflict between two families, an accusation of witchcraft against a healer, a request to intervene in a drought by appealing to the spirits. In the old way, a Laibon is more than a ruler - they are the living bridge between the community and the forces that govern its fate. The mortal does not know what you are, only that your judgment carries a weight no ordinary elder could claim. To turn them away is to let the living world slip a little further from your grasp."
 pod_laibon.100.a: "Judge the dispute personally."
 pod_laibon.100.a.success: "Your judgment is wise and fair. The mortals are impressed."
 pod_laibon.100.a.failure: "Your judgment misses the mark. The mortals are disappointed."
 pod_laibon.100.b: "Delegate to a mortal advisor."
 pod_laibon.100.c: "You have more pressing matters. Send them away."
 pod_laibon.101.t: "Voices on the Wind"
 pod_laibon.101.desc: "In the hours before dawn, you hear something, not with your ears, but deeper. A voice that might be an ancestor, a spirit of the land, or your own [Glossary('Beast','game_concept_beast_desc')] speaking in tongues you almost understand. It offers a fragment of knowledge, but demands your attention. The Laibon have always walked between the world of the living and the world of spirits - these voices are neither hallucination nor blessing, but something older than either category. Your elders warned that a Laibon who ignores the voices of Orun does so at their peril, but one who follows every whisper into the dark rarely returns whole."
 pod_laibon.101.a: "Listen and follow the voice into seclusion."
 pod_laibon.101.a.success: "The voice may reveal hidden truths about a neighboring ruler."
 pod_laibon.101.a.failure: "The voice leads you in circles. You return with nothing but unease."
 pod_laibon.101.b: "Acknowledge the voice but remain where you are."
 pod_laibon.101.c: "Shut it out. The spirit world is full of tricksters and liars."
 pod_laibon.102.t: "The Gathering Fire"
 pod_laibon.102.desc: "You host a gathering of local Laibon, not a formal Gathering of the Legacies, but an informal meeting around the fire. Stories are shared, disputes are aired, and the old rituals are observed. The goat is sacrificed, the blood shared, the ancestors invoked. These small gatherings are the lifeblood of Laibon society - a reminder that the undead are still bound by the obligations of the living community they once belonged to. Bonds forged at the fire are often stronger than those sworn at formal Gatherings, and debts remembered in the smoke of an offering rarely go unpaid."
 pod_laibon.102.a: "Lead the ritual yourself, honoring both the living and the dead."
 pod_laibon.102.b: "Focus the gathering on political matters."
 pod_laibon.102.c: "Focus the gathering on spiritual communion."
 pod_laibon.103.t: "The Mortal Descendant"
 pod_laibon.103.desc: "A mortal appears in your domain who bears a striking resemblance to someone you knew in life, a descendant of your mortal family, carrying blood that was yours centuries ago. They don't know what you are, but there's a recognition in their eyes. It is among the most disorienting sensations a Laibon can experience - to see your own gesture, your own laugh, the same tilt of the head to listen better, housed in a body that still breathes and ages. The ancestors say such convergences are never coincidence. Something unresolved has passed down through the blood, waiting for the right moment to be addressed."
 pod_laibon.103.a: "Watch over them from the shadows. Ensure they prosper."
 pod_laibon.103.b: "Embrace them. They carry your blood. They deserve the gift of eternal life."
 pod_laibon.103.a.success: "The mortal will be brought to your court to prepare for the embrace."
 pod_laibon.103.a.message: "Descendant Has Arrived"
 pod_laibon.103.c: "They do not concern you."
 pod_laibon.104.t: "The Spirit-Beast"
 pod_laibon.104.desc: "A spirit manifests near your haven, not a ghost, but something older. It takes the form of a great animal: a lion, a serpent, a spider, an eagle. It watches you with eyes that see through flesh. It wants something. Animal spirits are the oldest emissaries of Orun - they predate the ancestors, predate even the first Laibon, and they do not deal in words. A spirit that seeks you out personally is not a matter you can leave unanswered. Whatever it wants, the fact that it came to you rather than waiting to be summoned means the negotiation has already begun."
 pod_laibon.104.a: "Approach and offer it blood."
 pod_laibon.104.a.success: "The spirit accepts your offering. Its blessing settles over you like armor."
 pod_laibon.104.a.failure: "The spirit rejects your offering violently."
 pod_laibon.104.b: "Observe it from a distance. Learn from its presence."
 pod_laibon.104.c: "Drive it away. Spirits that demand blood offerings cannot be trusted near your domain."
 pod_laibon.105.t: "The Harvest"
 pod_laibon.105.desc: "The mortals in your domain have had a good season. The harvest is rich, the trade routes are flowing, the children are healthy. Your stewardship, however indirect, has kept the predators at bay. The community thrives. A Laibon understands better than any that prosperous mortals are the foundation of everything - they are the source of blood, of Aye, of the connection to the living world that separates you from the hollow dead who drift through Orun with nothing left to anchor them. Tonight the drums are out and the fires are bright. You have done your work well."
 pod_laibon.105.a: "Walk among them during the celebration. Be present."
 pod_laibon.105.b: "Take your share, a larger tithe from the surplus."
 pod_laibon.105.c: "Take what you need, the surplus means more mortals to feed from without consequence."
 pod_laibon.106.t: "The Crossroads Spirit"
 pod_laibon.106.desc: "You come upon a crossroads at midnight, a place where paths meet and the boundary between Aye and Orun thins. Something left an offering - a clay pot, a bundle of feathers, a carved figure. It is meant for you. Or something like you. Crossroads have always been liminal places - sacred to spirits, dangerous to the careless, and peculiarly attractive to those who already exist on the boundary between worlds. The offering suggests someone knows you pass this way. Whether they mean to give you a gift, propose a bargain, or draw your attention away from something they are doing nearby is another question entirely."
 pod_laibon.106.a: "Leave your own offering and meditate at the crossroads."
 pod_laibon.106.b: "Take the offering. Power is there for the taking."
 pod_laibon.106.c: "Take the offering but don't linger crossroads attract worse things than ancestor spirits."
 pod_laibon.107.t: "The Dream of Cagn"
 pod_laibon.107.desc: "You dream, something vampires rarely do. In the dream, you see a figure that might be Cagn, the First Laibon, or it might be your own [Glossary('Beast','game_concept_beast_desc')] wearing Cagn's face. He speaks in a language older than any you know, but you understand. He shows you a vision. Cagn is said to be the first to discover the balance between Aye and Orun, and to have paid an enormous price for that knowledge. Whether he is a true ancestor, a spiritual construct, or a myth the blood uses to explain its own nature is a debate the eldest Laibon have conducted across centuries without resolution. What none of them dispute is that dreaming of him means something is about to change."
 pod_laibon.107.a: "The vision shows the mortal world, your domain as it could be, thriving and protected."
 pod_laibon.107.b: "The vision shows the spirit world; vast, luminous, and calling to you."
 pod_laibon.107.c: "Question the figure. Is this truly Cagn, or something wearing his face?"
 pod_laibon.107.c.success: "The figure smiles. It is both and neither. Understanding floods through you."
 pod_laibon.107.c.failure: "The figure's smile turns cold. You have offended something you do not understand."
 pod_laibon.108.t: "The Masquerade Breach"
 pod_laibon.108.desc: "Your growing connection to the spirit world is showing. A mortal in your domain, a priest or a wise woman, has noticed something wrong. They haven't named it yet, but the whispers are starting. The Secret is at risk. The Masquerade is more complicated for the Laibon than it is for Kindred who hide entirely - a Laibon is expected to be a figure of spiritual authority, which means some supernatural quality is already assumed. But there is a line between being a revered spirit-worker and being recognized as one of the undead, and someone in your domain has just stepped too close to it."
 pod_laibon.108.a: "Deal with the mortal directly. Dominate or silence them."
 pod_laibon.108.a.success: "The mortal forgets. The whispers die."
 pod_laibon.108.a.failure: "You failed to contain the situation. The whispers have become rumors."
 pod_laibon.108.b: "Withdraw from mortal affairs temporarily. Let the rumors die."
 pod_laibon.108.c: "Lean into it. Let them think you are an ancestor spirit."
 pod_laibon.109.t: "The Ancestor's Grave"
 pod_laibon.109.desc: "You discover or remember the burial place of your mortal ancestors. The grave is old, overgrown, perhaps forgotten by the living. But the spirits there are not gone. To the Laibon, the dead do not vanish - they persist in Orun, in the land itself, in the blood of the descendants who carry them forward without knowing it. A forgotten grave is a wound in the community's memory, and the spirits of the neglected dead can grow restless in ways that make everyone's existence more difficult. You owe these people something. Whether you choose to pay that debt is another matter."
 pod_laibon.109.a: "Restore the grave and perform the old rites."
 pod_laibon.109.b: "Commune with the spirits but leave the grave as it is."
 pod_laibon.109.c: "The grave sits on valuable ground. Clear it and build something useful."
 pod_laibon.200.t: "The Weight of the Crown"
 pod_laibon.200.desc: "A dispute among your vassals threatens to spill into the mortal world, warring Laibon feeding carelessly, disrupting trade, frightening the mortals who sustain the domain. As a Guruhi, this is your responsibility. The Land is yours to protect. The Guruhi are not rulers by conquest alone - they are rulers because they accepted a compact with the land and the people who work it. When the land suffers, it is the Guruhi who answer for it: to the mortals, to the other Legacies, and to the ancestors watching from Orun. You did not ask for this crown. You wear it regardless."
 pod_laibon.200.a: "Intervene personally. Restore order among both the Laibon and the mortals."
 pod_laibon.200.b: "Address only the Laibon dispute. The mortals will sort themselves out."
 pod_laibon.201.t: "The Darkness Within"
 pod_laibon.201.desc: "The shadows in your haven move of their own accord - reaching, grasping, whispering. They are not alive, exactly, but they are not empty either. The darkness is a doorway to Orun, and it is always open for you. Other Kindred who command darkness treat it as a weapon - a tool for fear and concealment. You know it differently. The shadows are not empty space but the substance of the boundary between worlds, and what you shape with them touches something that exists on both sides of the veil. Tonight they are more active than usual. Something has pressed close to the doorway from the other side."
 pod_laibon.201.a: "Step into the darkness. Let it show you what lies beyond."
 pod_laibon.201.b: "Command the shadows but do not enter. Maintain your distance."
 pod_laibon.202.t: "The Beast's Counsel"
 pod_laibon.202.desc: "Your [Glossary('Beast','game_concept_beast_desc')] stirs, not in hunger or rage, but in conversation. It shows you something through animal senses: the migration patterns of wildebeest, the territorial markings of a leopard, the social bonds of an elephant herd. There is a lesson here, if you can read it. The Laibon do not speak of [Glossary('The Beast','game_concept_beast_desc')] the way European Kindred do - not as a demon to be caged, but as an older self, a part of you that remembers what humanity forgot when it built its first city. Whether that understanding is wisdom or a convenient lie the blood tells to make you comfortable with what you are is a question each Laibon must eventually answer for themselves."
 pod_laibon.202.a: "Listen to the Beast. Learn from the animal world."
 pod_laibon.202.b: "Use the Beast's insight for practical advantage."
 pod_laibon.203.t: "The Fury Demands"
 pod_laibon.203.desc: "Your rage surges, the familiar fire that defines your legacy. But rage is formless without direction. What drives you tonight? The warrior Legacies of the Laibon have always understood that anger and the urge to act are gifts as much as curses - but where the Brujah war for philosophy, the Laibon warrior fights for something older and more immediate: protection, justice, honor given form through action. Even so, the line between righteous fury and the [Glossary('Beast','game_concept_beast_desc')]'s simple hunger for violence is thinner tonight than it was yesterday. Be certain you know which side of it you are standing on."
 pod_laibon.203.a: "Fight for my people. The mortals under my protection are threatened."
 pod_laibon.203.b: "Fight for honor. The warrior-spirits of my ancestors demand excellence."
 pod_laibon.203.c: "Surrender to the fury completely. Hold nothing back."
 pod_laibon.204.t: "The Storm-Judge's Dilemma"
 pod_laibon.204.desc: "A case comes before you - a Laibon accused of feeding carelessly, endangering the Secret. The evidence is unclear. The accuser is powerful. The accused claims innocence. As a Shango, your judgment carries the weight of the storm. The Shango are the arbiters of the Laibon, a role that was not granted to them but earned through centuries of settling disputes that no one else could resolve without starting a war. When a Shango pronounces judgment, the words carry the authority of every ancestor who stood in your place before you. That authority means nothing if you do not wield it with care."
 pod_laibon.204.a: "Invoke the ancestors. Let the spirits guide my judgment."
 pod_laibon.204.a.success: "The ancestors speak clearly. Justice is served."
 pod_laibon.204.a.failure: "The ancestors are silent. Your judgment falters."
 pod_laibon.204.b: "Judge by evidence and testimony alone. The mortal way."
 pod_laibon.205.t: "The Vice Spreads"
 pod_laibon.205.desc: "Your vice calls. The mortal world offers its pleasures - a festival, a market, a gathering of beautiful and willing mortals. Your body aches for indulgence. This is both your connection to the living world and the thing that could sever it. The Ishtarri have always understood something that more ascetic Kindred refuse to admit: pleasure is not weakness, it is a tether. The vampire who feels nothing for mortal joys has already begun to drift toward the empty places between worlds. But there is a difference between indulging with awareness and drowning in appetite, and tonight that distinction feels very thin."
 pod_laibon.205.a: "Indulge carefully. Enjoy the mortal world's pleasures without destroying it."
 pod_laibon.205.a.success: "You walk the line between indulgence and restraint. The mortals are none the wiser."
 pod_laibon.205.a.failure: "Your appetites got the better of you. The community will remember."
 pod_laibon.205.b: "Channel the hunger into the spirit world. Seek out a supernatural pleasure instead."
 pod_laibon.206.t: "The Fixer's Crossroads"
 pod_laibon.206.desc: "You arrive at a crossroads, literal and figurative. A mortal caravan needs protection from bandits. A Laibon elder needs a spirit-ward retrieved from a sacred grove. Both are profitable. Time permits only one. The Ramanga have always occupied this space between worlds - the negotiators, the go-betweens, the ones who understand that the mortal world and the Laibon world are not as separate as others pretend. Every choice like this one is a small act of commerce between those two worlds, and your reputation in both depends on how you handle it. The trick is ensuring you get properly paid by each side."
 pod_laibon.206.a: "Protect the caravan."
 pod_laibon.206.b: "Retrieve the spirit-ward."
 pod_laibon.206.c: "Broker a deal where the caravan guards accompany you to the grove, solving both problems."
 pod_laibon.206.c.success: "Your silver tongue works wonders. Both jobs done, both clients satisfied."
 pod_laibon.206.c.failure: "The deal falls apart. You manage scraps of both, but satisfy no one fully."
 pod_laibon.207.t: "The Earth Remembers"
 pod_laibon.207.desc: "During your burial rest, the earth speaks. Not in words, in sensation. The weight of stone, the movement of roots, the slow pulse of things that were old when humanity was young. The deep Orun presses against your consciousness. The Nagloper have always held that the oldest part of the spirit world is not found in the sky or on the horizon, but beneath the feet - where the dead return to the earth and the earth absorbs everything that was ever alive. Most Laibon sleep above the ground, close to the world they know. You sleep below it, which means you hear things they do not."
 pod_laibon.207.a: "Open yourself to the deep earth."
 pod_laibon.207.b: "Resist. You are a vampire, not a root."
 pod_laibon.208.t: "The Bomkazi's Gift"
 pod_laibon.208.desc: "Your Bomkazi comes to you at dusk, as she always does. The feeding is a ritual older than either of you - life given freely to sustain death. But tonight she lingers afterward. She has something to share. The Bomkazi are unique to the Laibon - women who willingly bind their blood to a vampire, giving regularly in exchange for protection, standing, and a place at the edge of the world between the living and the dead. The relationship is not ownership, not exactly. It is a covenant between two people who have each, in their own way, chosen to live outside the ordinary boundaries of human life."
 pod_laibon.208.a: "Listen to her. Share what you know of the dead in return for what she knows of the living."
 pod_laibon.208.b: "Tend to her needs. She is aging, and her magic costs her."
 pod_laibon.208.c: "Ask her to help you contact a specific ancestor through combined ritual."
 pod_laibon.208.c.success: "The combined ritual succeeds. The ancestor speaks through the boundary of worlds."
 pod_laibon.208.c.failure: "The ritual sputters and fades. The ancestor does not answer."
 pod_laibon.209.t: "The Darkness Before"
 pod_laibon.209.desc: "The hunt is over. The forest is silent. In the stillness after the kill, something stirs in you that is not [Glossary('The Beast','game_concept_beast_desc')] - or perhaps it is [Glossary('The Beast','game_concept_beast_desc')] before it had a name. The primal darkness that made your founder shifts in your blood. It does not speak. It simply is - vast, patient, and older than the ancestors. The Bonsam do not discuss this openly, even among themselves. The Tenets of Laibon society were built on the understanding that Aye and Orun balance each other. What stirs in your blood predates that balance - a third thing that refuses to be categorized. Learning to live alongside it without being swallowed by it is the first and last lesson of your Legacy."
 pod_laibon.209.a: "Descend into the darkness. Let it show you what existed before the worlds."
 pod_laibon.209.b: "Open yourself to the darkness, but keep one hand on the world."
 pod_laibon.209.c: "Refuse it. Hunt instead. Find a mortal, a beast, something real."
 pod_laibon.210.t: "The Scholar's Dilemma"
 pod_laibon.210.desc: "A rumor reaches you - a mortal scholar in a distant city has acquired a collection of texts. Among them, possibly, is a fragment of something older: a record of the Laibon before the Tenets were written. Knowledge like this does not stay hidden for long. The dead whisper that you should go first. The Mla Watu were cast out of the old order for reasons that different Legacies explain differently, depending on who you ask - but what no one disputes is that you understand knowledge as power in ways others prefer to leave theoretical. If there is a record of who the Laibon were before the Tenets shaped them, you intend to read it before anyone else gets the chance to decide what it means."
 pod_laibon.210.a: "Send a bound wraith to steal the texts before anyone else can reach them."
 pod_laibon.210.b: "Travel to the scholar yourself. Approach as a fellow seeker of knowledge."
 pod_laibon.210.b.success: "The scholar is impressed by your erudition. A partnership is born."
 pod_laibon.210.b.failure: "The scholar sees through your facade. You leave with fragments, not the whole."
 pod_laibon.210.c: "Raise the dead in the scholar's city. Question those who wrote the texts when they were alive."
 pod_laibon.300.t: "The Walker's Revelation"
 pod_laibon.300.desc: "It happens between one heartbeat and the next, though your heart no longer beats. The two worlds align. You see them both at once: the mortal village sleeping in moonlight and the spirit village shimmering behind it, the living and the dead walking the same paths, separated by a veil thin as a breath. Every Laibon is told this is possible. Very few live long enough to stand here and know it for what it is. The elders say Cagn himself once stood at this same crossroads and saw the whole of creation spread before him - both the light and the darkness, both the living and the dead - and understood that neither was more real than the other."
 pod_laibon.300.a: "You are on both sides."
 pod_laibon.301.t: "The Emptiness"
 pod_laibon.301.desc: "The silence is complete now. No whispers from the ancestors. No warmth from the living. You stand in a place that is neither Aye nor Orun - a void between the worlds where nothing grows and nothing dies. [Glossary('The Beast','game_concept_beast_desc')] watches you from across this emptiness, patient as stone. It has been waiting for this. The Laibon call this the Hollow - not a place, but a condition, the spiritual equivalent of a wound that does not close. Other Kindred fall to [Glossary('The Beast','game_concept_beast_desc')] through hunger and rage. The Laibon can fall through absence: simply letting both connections go dark until nothing remains but the predator wearing your face, waiting for permission to take over entirely."
 pod_laibon.301.a: "Reach for Aye. Remember the living; a face, a name, a debt unpaid."
 pod_laibon.301.a.success: "A memory surfaces, warm, vivid, real. The living world pulls you back."
 pod_laibon.301.a.failure: "The memory crumbles. There is nothing left to hold onto. The Beast takes what remains."
 pod_laibon.301.b: "Reach for Orun. Call to the ancestors. Beg them to answer."
 pod_laibon.301.b.success: "A voice answers from the other side. The ancestors have not abandoned you."
 pod_laibon.301.b.failure: "Silence. The ancestors have turned away. The Beast steps forward."
 pod_laibon.301.c: "Give in. You are too tired to fight."
 pod_laibon.400.t: "The Two Worlds"
 pod_laibon.400.desc.intro: "You settle into stillness and turn your awareness inward, to the place where the blood meets the spirit. Every Laibon walks between two worlds; #bold Aye#!, the world of the living, and #bold Orun#!, the world of the spirits and ancestors. Your strength flows from the balance you keep between them.\n\n"
 pod_laibon.400.desc.aye_tier3: "#bold Aye:#! You are a #bold Child of Aye#! - deeply rooted in the living world. Mortals feel your authority in their bones.\n"
 pod_laibon.400.desc.aye_tier2: "#bold Aye:#! Your connection to the living world is #bold strong#!. The mortals around you prosper under your influence.\n"
 pod_laibon.400.desc.aye_tier1: "#bold Aye:#! You have a #bold modest#! connection to the living world. The mortals sense something, but cannot name it.\n"
 pod_laibon.400.desc.aye_none: "#bold Aye:#! You are #bold disconnected#! from the living world. The mortals do not feel your presence.\n"
 pod_laibon.400.desc.orun_tier3: "#bold Orun:#! You are a #bold Child of Orun#! - the spirit world answers when you call. The ancestors walk beside you.\n"
 pod_laibon.400.desc.orun_tier2: "#bold Orun:#! Your connection to the spirit world is #bold strong#!. The ancestors whisper guidance in the hours before dawn.\n"
 pod_laibon.400.desc.orun_tier1: "#bold Orun:#! You have a #bold modest#! connection to the spirit world. The ancestors stir when you are near.\n"
 pod_laibon.400.desc.orun_none: "#bold Orun:#! You are #bold disconnected#! from the spirit world. The ancestors are silent.\n"
 pod_laibon.400.desc.walker: "\n#bold You are a Walker Between Worlds#! - you have mastered both Aye and Orun, standing at the crossroads of existence itself."
 pod_laibon.400.desc.hollow: "\n#bold You are the Hollow#! - severed from both worlds, adrift in the void between them. [Glossary('The Beast','game_concept_beast_desc')] watches and waits."
 pod_laibon.400.a: "What is Aye - the living world?"
 pod_laibon.400.b: "What is Orun - the spirit world?"
 pod_laibon.400.c: "How does this balance work?"
 pod_laibon.400.d: "I understand."
 pod_laibon.401.t: "The Living World"
 pod_laibon.401.desc.intro: "#bold Aye#! is your connection to the mortal world; the land, the people, the living pulse of your domain. A Laibon strong in Aye rules not through fear alone, but through presence. Mortals obey because they feel the weight of your authority. The land itself recognizes you as its guardian.\n\nAs your Aye grows, you gain influence over mortal opinion, governance, and the stability of your domain. At its peak, you may Invoke the Authority of the Living; a power that commands obedience from mortals and Laibon alike.\n\n"
 pod_laibon.401.desc.tier3: "#bold Current Standing:#! You have reached the highest tier of Aye - #bold Child of Aye#!. The living world is yours to command."
 pod_laibon.401.desc.tier2: "#bold Current Standing:#! Your Aye is #bold strong#! - you are well-rooted in the living world, but have not yet reached its peak."
 pod_laibon.401.desc.tier1: "#bold Current Standing:#! Your Aye is #bold modest#! - a foundation, but there is much further to grow."
 pod_laibon.401.desc.none: "#bold Current Standing:#! You are #bold disconnected#! from Aye. Without this connection, you suffer penalties to your influence over mortals."
 pod_laibon.401.desc.factors: "\n\n#bold What strengthens Aye:#!\n- Disciplines of Presence and Dominate\n- Maintaining a herd and engaging with mortal affairs\n- Aye-favoring legacies (Guruhi, Ishtarri) and faith paths\n- Events that connect you to the mortal world\n\n#bold What weakens Aye:#!\n- Frenzy and loss of control\n- Killing or draining mortals recklessly\n- Natural decay over time - Aye must be actively maintained"
 pod_laibon.401.a: "Tell me more about the two worlds."
 pod_laibon.401.b: "I have seen enough."
 pod_laibon.402.t: "The Spirit World"
 pod_laibon.402.desc.intro: "#bold Orun#! is your connection to the world beyond the veil; the realm of ancestors, spirits, and the dead. A Laibon strong in Orun walks with the unseen. The ancestors share their secrets, the spirits lend their strength, and the boundary between life and death thins to nothing.\n\nAs your Orun grows, you gain prowess, dread, and resistance to hostile schemes. At its peak, you may Commune with the Ancestors - a ritual that tears secrets from the spirit world and wraps you in the strength of the dead.\n\n"
 pod_laibon.402.desc.tier3: "#bold Current Standing:#! You have reached the highest tier of Orun - #bold Child of Orun#!. The spirit world answers your call."
 pod_laibon.402.desc.tier2: "#bold Current Standing:#! Your Orun is #bold strong#! - the ancestors speak clearly, but the deepest mysteries remain veiled."
 pod_laibon.402.desc.tier1: "#bold Current Standing:#! Your Orun is #bold modest#! - the spirits stir, but their voices are faint."
 pod_laibon.402.desc.none: "#bold Current Standing:#! You are #bold disconnected#! from Orun. Without this connection, you are vulnerable and diminished."
 pod_laibon.402.desc.factors: "\n\n#bold What strengthens Orun:#!\n- Disciplines of Obtenebration and Necromancy\n- Feeding on vampires and blood bonding\n- Orun-favoring legacies (Ramanga, Nagloper, Bonsam, Impundulu, Mla Watu) and faith paths\n- Events that connect you to the spirit world\n\n#bold What weakens Orun:#!\n- Natural decay over time. Orun must be actively maintained\n- Neglecting the spirit world in favor of mortal concerns"
 pod_laibon.403.t: "The Balance"
 pod_laibon.403.desc.intro: "The Aye/Orun system tracks your spiritual standing across two axes. Each ranges from empty to full, with thresholds at three tiers. Your legacy, your faith, your disciplines, and your choices all shape where you stand.\n\n"
 pod_laibon.403.desc.decay: "#bold Yearly Decay:#! Both Aye and Orun erode naturally over time. The higher your tier, the faster it decays. You must actively nurture your connections or risk losing them. If both axes fall below the first threshold, you become #bold the Hollow#! - severed from both worlds, suffering severe penalties until you claw your way back.\n\n"
 pod_laibon.403.desc.affinity: "#bold Legacy & Faith:#! Your Laibon legacy (clan) and faith path each nudge your balance. Aye-favoring legacies like the Guruhi and Ishtarri naturally pull you toward the living world. Orun-favoring legacies like the Ramanga and Nagloper pull you toward the spirits. Balanced legacies like the Osebo and Akunanse leave the choice to you. Your faith path works similarly - choose one that aligns with your desired path, or one that counterbalances your legacy.\n\n"
 pod_laibon.403.desc.special: "#bold Mastery:#! If you reach the highest tier in both Aye and Orun simultaneously, you become a #bold Walker Between Worlds#! - a rare state of spiritual harmony that grants insight, calm, and the respect of your peers.\n\n#bold Tier 3 Abilities:#! Reaching the highest tier in either axis unlocks a powerful decision. Child of Aye may Invoke the Authority of the Living for a surge of mortal influence. Child of Orun may Commune with the Ancestors to tear secrets from the spirit world.\n\n#bold Disciplines:#! Presence and Dominate passively strengthen Aye. Obtenebration and Necromancy passively strengthen Orun.\n\n#bold Feeding & Frenzy:#! Maintaining a herd strengthens Aye. Feeding on vampires or blood bonding strengthens Orun. Killing or draining mortals weakens Aye. Falling to frenzy shifts you toward Orun."
