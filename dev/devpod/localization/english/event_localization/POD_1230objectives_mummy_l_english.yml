l_english:
 pod1230objectives_mummy.1.t: "Ending The Snake"
 pod1230objectives_mummy.1.desc: "Since first clash between [GetScriptedCharacterByHistoryID('792593').GetFirstName] and [GetScriptedCharacterByHistoryID('505012').GetFirstName], Setites are our enemy. They allied with Apohis, and they corrupt what once was great, We have to anihilate them."
 pod1230objectives_mummy.1.a: "Eternal Fight, finaly over"

 pod1230objectives_mummy.2.t: "Land of Faith"
 pod1230objectives_mummy.2.desc: "Under Land of Faith, lies Web of Faith, place where Sekhem focuses before spreading outwards. If we were to control this river of pure life force, we can achive impossible."
 pod1230objectives_mummy.2.a: "Achieving impossible"

 pod1230objectives_mummy.3.t: "Ending the Serpent"
 pod1230objectives_mummy.3.desc: "Our most fundamental goal, to resotre Ma'at, to restore Balance, was thought impossible due to existance of [UmbraGlossary('oblivion')] constantly corrupting and disturbing balance. With Almost infinite life force from Web of Faith we can try to finaly kill [UmbraGlossary('oblivion')].\n\n\n#weak As world around him slowly turns into unimaginable mirage, Horus tightly hugs Set's dick, reminder of better days, will tear in the eye, he says last goodbyes with it before being unmade and remade #!"
 pod1230objectives_mummy.3.a: "Ending the Serpent"

 pod1230objectives_mummy.4.t: "Keeping The Roots Safe"
 pod1230objectives_mummy.4.desc: "We originate from [GetCultureByKey('ancient_egyptian').GetName], and we cannot forget that. But with every year, what was once greatest civilization is slowly being forgoten. We cannot allow that, for our memories are what makes us human."
 pod1230objectives_mummy.4.a: "Saving the Roots"

 pod1230objectives_mummy.5.t: "Serving Eagle's Head"
 pod1230objectives_mummy.5.desc: "World is doomed, but some still try to save sinking ship. This is frutile, and only extend their pitful existance. That has to end, and what a better way that to kill and ofer head of our enemy's leader to our master?"
 pod1230objectives_mummy.5.a: "Enjoy blood of our enemy"

 pod1230objectives_mummy.6.t: "Last Meal Before Midnight"
 pod1230objectives_mummy.6.desc: "After removing leader of oposition, [UmbraGlossary('oblivion')] is almost ready for our last meal. But that isn't enough, what remains of oposition makes our task impossible. We have to kill them all, for this wretched world to come to it's end."
 pod1230objectives_mummy.6.a: "End is here"

 pod1230objectives_mummy.7.t: "Side With Horus"
 pod1230objectives_mummy.7.desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] hates my existance, that is known. And that causes massive head ache for me, being constantly hunted by his folowers is problematic. Maybe if I befriend important figures in Horus group, I can finaly life my eternal life in peace?"
 pod1230objectives_mummy.7.a: "Side With Horus"

 pod1230objectives_mummy.8.t: "Ending the Hunt"
 pod1230objectives_mummy.8.desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] hates my existance, that is known. And that causes massive head ache for me, being constantly hunted by his folowers is problematic. Maybe If I remove [GetScriptedCharacterByHistoryID('792593').GetFirstName] from equation, this will finaly by over?"
 pod1230objectives_mummy.8.a: "Ending the Hunt"

 pod1230objectives_mummy.9.t: "New Theourgia Arts"
 pod1230objectives_mummy.9.desc: "We, $POD_splat_mummy_plural$, are stuck in past. We still use magic from [GetCultureByKey('ancient_egyptian').GetName], but from then, something new and better emarged. Crafted by generations of [GetTrait('sorcerer').GetName(GetPlayer)]s, it is pinacle of magic as I know. Unfortunately I cannot use it for some reason, but with enough work I will achieve something thought impossible?"
 pod1230objectives_mummy.9.a: "New Theourgia Arts"

 pod1230objectives_mummy.10.t: "Secure Hades"
 pod1230objectives_mummy.10.desc: "When [GetScriptedCharacterByHistoryID('792600').GetFirstName] first created his version of Spell of Life, he choose Hades as our new dark kingdom. But it isn't stable, it is shaky and causes massive problems when resurrecting after death. We have to stabilized it."
 pod1230objectives_mummy.10.a: "Secure Hades"

 pod1230objectives_mummy.11.t: "Contunuing Greek Tradition"
 pod1230objectives_mummy.11.desc: "[GetScriptedCharacterByHistoryID('792600').GetFirstName] is [GetCultureByKey('mycenean').GetName], and therefore, in his blood lays conquest. And nerby is Web of Faith, instense source of Pneuma. Maybe we can conquer and control it?"
 pod1230objectives_mummy.11.a: "Contunuing Greek Tradition"

 pod1230objectives_mummy.12.t: "Protecting Knowledge"
 pod1230objectives_mummy.12.desc: "World is slowly turing towards [sixth_age|E], Even if ideal scenario would be to avert it, we have to think realisticly. And that means we have to prepare for worst, We have to protect any knowledge others after us can use in trying times."
 pod1230objectives_mummy.12.a: "Protecting Knowledge"

 pod1230objectives_mummy.13.t: "Protecting People"
 pod1230objectives_mummy.13.desc: "World is slowly turing towards [sixth_age|E], Even if ideal scenario would be to avert it, we have to think realisticly. And that means we have to prepare for worst, We have to protect any good mortals for their children are key to seventh age."
 pod1230objectives_mummy.13.a: "Protecting People"

 pod1230objectives_mummy.14.t: "Protecting Shen"
 pod1230objectives_mummy.14.desc: "World is slowly turing towards [sixth_age|E], Even if ideal scenario would be to avert it, we have to think realisticly. And that means we have to prepare for worst, We have to protect any good shen, as they will protect what will be left of world."
 pod1230objectives_mummy.14.a: "Protecting Shen"

 pod1230objectives_mummy.15.t: "Protecting Middle Kingdom"
 pod1230objectives_mummy.15.desc: "World is slowly turing towards [sixth_age|E], Even if ideal scenario would be to avert it, we have to think realisticly. And that means we have to prepare for worst, We already protect what most important, but maybe, just maybe, we can protect whole middle kingdom?"
 pod1230objectives_mummy.15.a: "I want to stay"
 pod1230objectives_mummy.15.b: "Time to ascend to my new position"

 pod1230objectives_mummy.16.t: "Achieving Ra Hekau"
 pod1230objectives_mummy.16.desc: "The old Shemsu-Heru called Ra-Hekau the supreme art of Hekau, the mastery of the world by using the True Names of everything to bend it to one's will. According to Egyptian legend, Ra-Hekau was first revealed when the Sun-God Re gave Isis his True Name so that she could heal him from a deadly poisoning. It allowed Isis to become the Goddess of Magic and allowed her to construct the Spell of Life."
 pod1230objectives_mummy.16.a: "Failure, but not total one"
