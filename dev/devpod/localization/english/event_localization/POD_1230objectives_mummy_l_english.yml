l_english:
 pod1230objectives_mummy.1.t: "Ending The Snake"
 pod1230objectives_mummy.1.desc: "Since first clash between [GetScriptedCharacterByHistoryID('792593').GetFirstName] and [GetScriptedCharacterByHistoryID('505012').GetFirstName], Setites are our enemy. They allied with Apohis, and they corrupt what once was great, We have to anihilate them."
 pod1230objectives_mummy.1.a: "Eternal Fight, finaly over"

 pod1230objectives_mummy.2.t: "Land of Faith"
 pod1230objectives_mummy.2.desc: "Under Land of Faith, lies Web of Faith, place where Sekhem focuses before spreading outwards. If we were to control this river of pure life force, we can achive impossible."
 pod1230objectives_mummy.2.a: "Achieving impossible"

 pod1230objectives_mummy.3.t: "Ending the Serpent"
 pod1230objectives_mummy.3.desc: "Our most fundamental goal, to resotre Ma'at, to restore Balance, was thought impossible due to existance of [UmbraGlossary('oblivion')] constantly corrupting and disturbing balance. With Almost infinite life force from Web of Faith we can try to finaly kill [UmbraGlossary('oblivion')].\n\n\n#weak As world around him slowly turns into unimaginable mirage, Horus tightly hugs Set's dick, reminder of better days, will tear in the eye, he says last goodbyes with it before being unmade and remade #!"
 pod1230objectives_mummy.3.a: "Ending the Serpent"

 pod1230objectives_mummy.4.t: "Keeping The Roots Safe"
 pod1230objectives_mummy.4.desc: "We originate from [GetCultureByKey('ancient_egyptian').GetName], and we cannot forget that. But with every year, what was once greatest civilization is slowly being forgoten. We cannot allow that, for our memories are what makes us human."
 pod1230objectives_mummy.4.a: "Saving the Roots"

 pod1230objectives_mummy.5.t: "Serving Eagle's Head"
 pod1230objectives_mummy.5.desc: "World is doomed, but some still try to save sinking ship. This is frutile, and only extend their pitful existance. That has to end, and what a better way that to kill and ofer head of our enemy's leader to our master?"
 pod1230objectives_mummy.5.a: "Enjoy blood of our enemy"

 pod1230objectives_mummy.6.t: "Last Meal Before Midnight"
 pod1230objectives_mummy.6.desc: "After removing leader of oposition, [UmbraGlossary('oblivion')] is almost ready for our last meal. But that isn't enough, what remains of oposition makes our task impossible. We have to kill them all, for this wretched world to come to it's end."
 pod1230objectives_mummy.6.a: "End is here"
