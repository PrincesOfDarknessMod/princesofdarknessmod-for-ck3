 sidhe_house_dominance_scathach_objective_decision:0 "Edicts of the Morphean Oracles"
 sidhe_house_dominance_scathach_objective_decision_desc:0 "Since House Scathach defeated Octriallach the White King of the Fomorians in the War of the Trees, the Morphean Oracles have been the defining force within House Scathach. While the Edicts of the Morphean Oracles do not always make sense to members of the house, the is house is unified in following them. The Oracles foresaw calamity if the Sword of Tethra entered the Heart of the Dreaming, however, and the Scathach attacked the Gwydion attempting to move it. During the ensuing bloodshed, the blade disappeared into the surrounding Dreaming. The political consequences of the battle caused the Scathach to become an exiled and shunned House by the Seelie. Stil, the members of the house follow the Edicts of the Oracles. Despite this unity, the House is divided between the Changelings task with remaining behind as most Sidhe flee to Arcadia, and Uathach and her first born Fae followers search the Sea of Silver in the Deep Dreaming for something to preserve both the Autumn World and defeat the Fomorians."
 sidhe_house_dominance_scathach_objective_decision_tooltip:0 "Lorem ipsum dolor sit amet, consectetur adipiscing"
 sidhe_house_dominance_scathach_objective_decision_confirm:0 "We are Magnificent"
 sidhe_house_dominance_scathach_objective_decision_custom:0 "[shattering|E] is prevented"
 scathach_victory_modifier:0 "Edicts of the Morphean Oracles"
 
