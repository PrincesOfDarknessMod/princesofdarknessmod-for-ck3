 prevent_black_death_anda_objective_decision_desc:0 "That Prophecy of the Ratkin is unclear, but you have a feeling that dealing with the Mongol and Anda hordes may help."
 prevent_black_death_anda_objective_decision_confirm:0 "No more raids."
 
 destroy_inquisition_objective_decision:0 "Destroy the Inquisition"
 destroy_inquisition_objective_decision_tooltip:1 "You will destroy the Shadow Inquisition."
 destroy_inquisition_objective_decision_desc:0 "The Church and its dreaded Inquisition persecutes pagans and the Fae. It converts by the sword, tortures or burns to death the followers of the Old Gods and practitioners of the Mystic arts. Its priests use of ritual baptism upon Changeling children to forever rob them of their enchanted nature to snuff out the spark of Glamour. Popes Celestine II and Innocent the III have declared violent conversion of Livionia by Crusade. A papal bull has declared that fighting the Baltic pagans was of the same rank as participating in the Crusade for Jerusalem. For the Fae to remain on Earth, it is time to stop this."
 destroy_inquisition_objective_decision_confirm:0 "Bring an end to the Burning Times."
 destroy_inquisition_objective_decision_before_last_date:0 "The date is 1430.1.1 or earlier"
 destroy_inquisition_objective_decision_custom1:0 "The Age of Inquisition event won't happen in the future"
