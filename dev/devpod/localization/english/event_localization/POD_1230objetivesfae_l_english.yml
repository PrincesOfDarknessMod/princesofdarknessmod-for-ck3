 pod1230objectives_fae.165.t:0 "Mortal Song"
 pod1230objectives_fae.165.desc:0 "It is done. The flock have accepted the fae as their shepherds and guides. The Church will no longer be the threat to the Fae that it once was, and all the fair folk have [ROOT.Char.GetFullName] to thank. Praises shall be sung to House [ROOT.Char.GetHouse.GetName] for all eternity.\n\nEvery fae on earth and in the heavens will need to consider their relationship with the Holy Church and its Sacred intercessors — the [ROOT.Char.GetHouse.GetName]. Pray they choose the righteous path to salvation, or surely hell's gaping maw awaits them forever and ever. Redemption is at hand!\n\nThe mortals shall help in every way they can creating great cathedrals, magnificent art and triumphant music all in glory to the divine and his holy messengers. Let us build a shining city upon the hill that shall be a beacon of hope and salvation for all who have ears to hear our beatific song!"
 pod1230objectives_fae.165.a:0 "Hallelujah!"
 
