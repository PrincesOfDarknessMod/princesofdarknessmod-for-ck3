 sidhe_house_dominance_liam_objective_decision:0 "Mortal Song"
 sidhe_house_dominance_liam_objective_decision_desc:0 "The imagination of mortals has become caged within the confines of the Church. House Liam leads the Fae in trying to understand the mystic hold the Church has over humanity. Either the Church's most tyrannical organization needs to be neutralized, or the Church needs the direction of the Fae away from banality. Should House Liam succeed, they can direct the growth of humanity towards creativity."
 sidhe_house_dominance_liam_objective_decision_tooltip:0 "Integrate or Neutralize the Church"
 sidhe_house_dominance_liam_objective_decision_confirm:0 "Stand right here before the Lord of song" # With nothing, nothing on my tongue but Hallelujah
 sidhe_house_dominance_liam_objective_decision_custom1:0 "You have finished $destroy_inquisition_objective_decision$ [decision|E]"
 sidhe_house_dominance_liam_objective_decision_custom2:0 "Your faith is [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] and you have finished the $constantinian_objective_decision$ [decision|E]"
 sidhe_house_dominance_liam_objective_decision_custom3:1 "There must be no [GetTrait('supehunter').GetName( GetPlayer )] [independent_ruler|E] on the map"
 sidhe_house_dominance_liam_objective_decision_custom3_ex:1 "$sidhe_house_dominance_liam_objective_decision_custom3$ #weak ([example.GetFirstName])#!" 
 liam_victory_modifier:0 "Mortal Song"
 
 pod1230objectives_fae.165.t:0 "Mortal Song"
 pod1230objectives_fae.165.desc:0 "It is done. The flock have accepted the fae as their shepherds and guides. The Church will no longer be the threat to the Fae that it once was, and all the fair folk have [ROOT.Char.GetFullName] to thank. Praises shall be sung to House [ROOT.Char.GetHouse.GetName] for all eternity.\n\nEvery fae on earth and in the heavens will need to consider their relationship with the Holy Church and its Sacred intercessors — the [ROOT.Char.GetHouse.GetName]. Pray they choose the righteous path to salvation, or surely hell's gaping maw awaits them forever and ever. Redemption is at hand!\n\nThe mortals shall help in every way they can creating great cathedrals, magnificent art and triumphant music all in glory to the divine and his holy messengers. Let us build a shining city upon the hill that shall be a beacon of hope and salvation for all who have ears to hear our beatific song!"
 pod1230objectives_fae.165.a:0 "Hallelujah!" 
 
 sidhe_house_dominance_aesin_objective_decision:0 "Stand on Midgard"
 sidhe_house_dominance_aesin_objective_decision_desc:0 "Followers of the Nailed God have spread throughout Norse lands, driving the people away from their pacts with the Aesir and Vanir. Vampire impostors called the [GetFaithByKey('viaeinherjar').GetName] are holding the old temples of [GetTitleByKey('k_midgard').GetNameNoTier] including Uppsala — perverting our ancient rites into their banal blood cult. The [GetFaithByKey('getoffenris').GetName] of the [GetTitleByKey('k_fimbul_winter').GetNameNoTier] roam the northern wastes of Sweden and must be brought to heel. The [GetTitleByKey('d_crystal_fortress').GetNameNoTier] is in the hands of [GetFaithByKey('summer_court').GetName] [GetTrait('changeling').GetName( GetPlayer )] of House [GetDynastyByID( 'POD_fae_dynasty_gwydion' ).GetBaseName] and it should rightfully be ours. We shall take up our ancient and hallowed arms and reclaim our homeland with blood."
 sidhe_house_dominance_aesin_objective_decision_tooltip:0 "Reclaim all of Midgard for the Aesin"
 sidhe_house_dominance_aesin_objective_decision_artifacts:0 "You must possess one of these norse artifacts: [GetGlobalVariable('tapestry_of_fate_link').Artifact.GetName], [GetGlobalVariable('eilaf_link').Artifact.GetName], [GetGlobalVariable('kristrbani_link').Artifact.GetName], [GetGlobalVariable('odin_stone_link').Artifact.GetName]"
 sidhe_house_dominance_aesin_objective_decision_troll_vassals:0 "Have two [powerful_vassals|E] who are of the [GetTrait('troll').GetName( GetPlayer )] kith."
 sidhe_house_dominance_aesin_objective_decision_troll_councillors:0 "Have two [councillors|E] who are of the [GetTrait('troll').GetName( GetPlayer )] kith."
 sidhe_house_dominance_aesin_objective_decision_troll_bodyguard:0 "Have a [GetTrait('troll').GetName( GetPlayer )] [GetCourtPositionType('bodyguard_court_position').GetName()]."
 sidhe_house_dominance_aesin_objective_decision_troll_knights:0 "Have two [knights|E] who are of the [GetTrait('troll').GetName( GetPlayer )] kith."
 sidhe_house_dominance_aesin_objective_decision_confirm:0 "Better to die with honor than live with shame"
 aesin_victory_modifier:0 "Stand on Midgard"
 
