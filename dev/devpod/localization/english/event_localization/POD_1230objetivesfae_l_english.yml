 sidhe_house_dominance_dougal_objective_decision:0 "Gold to Steel"
 sidhe_house_dominance_dougal_objective_decision_desc:0 "House Dougal is renowned among the Sidhe as smiths. In the machinations of politics, many believe that House Dougal is superfluous, but it is their devices that fuel the intrigues of House Eiluned. The hot-blooded Fiona squabble over their beautiful artifices. The lords of House Gwydion perform their great deeds with Dougal swords, clad in Dougal mail. While most other houses squabble, pout, and piddle, Dougal works, builds, and creates. Now that Bronze has been surpassed by Iron and Steel, House Dougal needs to create a vast repository of weapons and armor. The journeymen and workshops of the Dougal will be focused on the creation of such an armory, but it will not come cheap."
 sidhe_house_dominance_dougal_objective_decision_tooltip:0 "You will create a massive trove of weapons and armor"
 sidhe_house_dominance_dougal_objective_decision_confirm:0 "A blow of a blacksmith is equal to a hundred blows of a goldsmith."
 dougal_victory_modifier:0 "Gold to Steel"
 
 pod1230objectives_fae.161.t:0 "Gold to Steel"
 pod1230objectives_fae.161.desc:0 "Lorem ipsum dolor sit amet, consectetur adipiscing"
 pod1230objectives_fae.161.a:0 "Gold to Steel"
 
 sidhe_house_dominance_eiluned_objective_decision:0 "Fortified Freeholds"
 sidhe_house_dominance_eiluned_objective_decision_desc:0 "The House of Secrets has conspired with many dark and mysterious beings and powers to gather magical knowledge. With many gifted seers, the Eiluned are forewarned and thus seek to be forearmed. With visions and prophecies of the future, Eiluned architects propose elaborate fortifications that anticipate any kind of siege filled with secret passages, labyrinths, bolt holes, murder holes, and magical cantrips traps. The building of such elaborate fortifications will not come cheap."
 sidhe_house_dominance_eiluned_objective_decision_tooltip:0 "With the foresight build elaborate fortfications"
 sidhe_house_dominance_eiluned_objective_decision_confirm:0 "Forewarned and Forearmed"
 eiluned_victory_modifier:0 "Fortified Freeholds"
 
