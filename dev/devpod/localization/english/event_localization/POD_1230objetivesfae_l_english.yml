 sidhe_house_dominance_ailil_objective_decision:0 "Ending the War of Seasons"
 sidhe_house_dominance_ailil_objective_decision_desc:0 "House Ailil thrives on power and has honed its skills with diplomacy and intrigue. The Seelie fae betrayed the regular seasonal turning of the throne, and through it have denied the Ailil their rightful turn at rulership. To restore the balance, the War of Seasons must end. If the Ailil can end the War of Seasons, their eminence among all Sidhe Houses will be unchallengeable."
 sidhe_house_dominance_ailil_objective_decision_tooltip:0 "End the War of Seasons or claim all of Ireland and achieve your recognition"
 sidhe_house_dominance_ailil_objective_decision_confirm:0 "To every thing there is a season, and a time to every purpose"
 sidhe_house_dominance_ailil_objective_decision_custom:0 "The War of Seasons Struggle is ended"
 ailil_victory_modifier:0 "Ending of the War of Seasons"
 
