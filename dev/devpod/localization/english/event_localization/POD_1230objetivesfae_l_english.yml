 pod1230objectives_fae.100.t:0 "A Soothsay about Rats"
 pod1230objectives_fae.100.desc:0 "Your Soothsayer has meet you, saying them have seem a dark future worse than Sundering, a Soothsay about rats. You should you should focus in one thing in next century to make it won't happen."
 pod1230objectives_fae.100.a:0 "The Ratkins and their friends!"
 pod1230objectives_fae.100.b:0 "To stop rat, we need cat!"
 unlock_convert_to_catlover_scheme:0 "Unlock [GetScheme('convert_to_catlover').GetTypeName] [scheme|E]."
 pod1230objectives_fae.100.c:0 "I think the problem is the horde!"
 
 pod1230objectives_fae.101.t:0 "Ratkin's Scheme"
 pod1230objectives_fae.101.desc:0 "There was a dark plan behind the ratkins, they have created the worse disease ever, you glad you have stopped them before they fully release it."
 pod1230objectives_fae.101.a:0 "Few."
 
 pod1230objectives_fae.102.t:0 "CATastrophe"
 pod1230objectives_fae.102.desc:0 "Every one in the world adore cat now, the rat Soothsay is not a problem anymore... but we may have another problem now."
 pod1230objectives_fae.102.a:0 "Oh my..."
 
 pod1230objectives_fae.103.t:0 "Scourge"
 pod1230objectives_fae.103.desc:0 "The mongols horde is slow down thank to you, and you Soothsayer confirm you have stopped a future of mongols throwing death rat in siege that could spread a pandemic."
 pod1230objectives_fae.103.a:0 "I was right."
 
 pod1230objectives_fae.120.t:0 "End of Inquisition"
 pod1230objectives_fae.120.desc:0 "The creating of the Inquisition was the culmination of the Sundering as the Church in their doctrinal pursuits tried to eliminate all undesirable supernatural elements, including the fae, from the world. But now it is over."
 pod1230objectives_fae.120.a:0 "More superstitions!"
 
 pod1230objectives_fae.121.t:0 "Return of Prodigals"
 pod1230objectives_fae.121.desc:0 "All other supernatural denizens of the World of Darkness are all races of fae who have forgotten their origins in the Dreaming. Now they have return."
 pod1230objectives_fae.121.a:0 "Welcome."
 
 POD_fae_maintenance.21.t:0 "The Shattering"
 POD_fae_maintenance.21.desc:0 "You couldn't the soothay happen.\nEventually the threads that were pulled so thin between the mortal realm and the Dreaming began to snap. This severing is the Shattering. Not only did it shatter the ties between Arcadia the Earth but the hopes that it could be reversed.\nYou must adopt a way to deal with this."
 POD_fae_maintenance.21.a:0 "Changeling Way."
 POD_fae_maintenance.21.b:0 "Flee to Arcadia."
 POD_fae_maintenance.21.c:0 "Become a Lost One."
 
