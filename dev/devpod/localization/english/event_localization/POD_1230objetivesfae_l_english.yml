 pod1230objectives_fae.171.a:0 "Seasonal Ending" 
 
 sidhe_house_dominance_balor_objective_decision:0 "Heritage of the Fomorians"
 sidhe_house_dominance_balor_objective_decision_desc:0 "House Balor trace their ancestry back to a line of sidhe who mixed their blood with that of the Fomorians. They believe that the Endless Winter is almost here, and that a strong hand needs to guide the helm to steer the fae through it. Through their connection to the Wyrm, they seek alliances between the Unseelie with Black Spiral Dancers and the Fomori. Given the ancestral tie between House Balor and the Fomorians, it may be possible with a potent ritual to merge a Fae with a powerful bane spirit to create a Fae-Fomori hybrid — a Fomarch."
 sidhe_house_dominance_balor_objective_decision_tooltip:0 "Merge with a Bane spirit to become a Fae-Fomori Hybrid"
 sidhe_house_dominance_balor_objective_decision_confirm:0 "Summon the Nexus Crawler"
 balor_victory_modifier:0 "Fomorian"
 sidhe_house_dominance_balor_objective_decision_artifacts:0 "You must possess one of these Balor artifacts: [GetGlobalVariable('steaming_spear_of_vengeance_link').Artifact.GetName], [GetGlobalVariable('cauldron_of_fear_link').Artifact.GetName] or Blood Dross"
 #[Select_CString( GetGlobalVariable( 'blood_dross_link' ).IsSet, GetGlobalVariable('blood_dross_link').Artifact.GetName, Localize('artifact_blood_dross_name') )]"

 pod1230objectives_fae.172.t:0 "Fomorian Forever"
 pod1230objectives_fae.172.desc.start:0 "House Balor has traced your ancestry back to a line of sidhe who mixed their blood with that of the Fomorians. The Endless Winter is almost here, and you need to guide fae through it, whether they consent to your rule or not. You have prepared the ritual to merge your Fae self with a powerful bane spirit to create a Fae-Fomori hybrid — a Fomarch. Balor's Crystal Eye glows a dull red and radiates a great heat. "
 pod1230objectives_fae.172.desc.steaming_spear_of_vengeance:0 "Hefting the [GetGlobalVariable('steaming_spear_of_vengeance_link').Artifact.GetName], you lick hot blood from its blade feeling your self filled with rage."
 pod1230objectives_fae.172.desc.cauldron_of_fear:0 "Having prepared the foul, mystical concoction — you drink deeply from the [GetGlobalVariable('cauldron_of_fear_link').Artifact.GetName]."
 pod1230objectives_fae.172.desc.blood_dross:0 "Crushing the crystallized sugar tiny vial, you drink the vampiric blood contained within the Blood Dross and are filled with dark glamour."
 pod1230objectives_fae.172.desc.end:0 "You open a trod to the Umbra to call forth the Nexus Crawler.\nA black shimmer appears in the air along with a warbling vibrato moan. You have a feeling on your skin like fingernails scraped across a blackboard. The air stinks of a miasmic scent reminiscent of a cancerous illness. The Wyrm spirit manifests into a loathsome and horrifying avatar. Its claws and fangs rip open your flesh and it violently thrusts itself into your chest cavity. You are filled with excruciating pain. And then...\nWe are united. Forever."
 
 pod1230objectives_fae.172.a:0 "We are the Fomarch!"

 sidhe_house_dominance_daireann_objective_decision:0 "Healer-Warrior"
 sidhe_house_dominance_daireann_objective_decision_desc:0 "The House gained their noble station by Daireann healing a Gwydion lord, but they gained their true respect by the valor of their warrior Conchobhair. The Daireann know very well that the hand that can heal can also harm. A cup can hold both poison or an antidote. A blade can be used to heal, and it can be used to sever the thread of a life."
 sidhe_house_dominance_daireann_objective_decision_martial:0 "You have a [martial|E] [education|E]"
 sidhe_house_dominance_daireann_objective_decision_martial_prowess:0 "You have a Martial [prowess|E] [education|E]"
 
 sidhe_house_dominance_daireann_objective_decision_tooltip:0 "Develop both your ability with warfare and healthcare"
 sidhe_house_dominance_daireann_objective_decision_confirm:0 "To Everything There Is a Season"
 daireann_victory_modifier:0 "Healer-Warrior"
 
