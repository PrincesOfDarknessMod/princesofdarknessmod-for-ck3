 pod1230objectives_fae.100.t:0 "The Prophecy of the Rat"
 pod1230objectives_fae.100.desc:0 "In the early years of the thirteenth century, the winters grew long and cold and the rains fell with monsoon-like duration. Crops drowned. Roads were reduced to muddy morasses. Famine and cold did their part to fill the graveyards. There are prophetic dreams about a cataclysmic event in the future that kills millions of dreamers. Details are vague but it seems to involve hordes of rats coming from sunrise, piles of burning corpses, dancing skeletons, blackened fingers and toes. Some fae are convinced that the Ratkin and their diseased Wyrmish allies must be destroyed.\nYour Seer has spoken, saying that they have seen a dark future worse than the Sundering, the Prophecy of the Rat. You should focus your focus in the next century to make sure it doesn't happen."
 pod1230objectives_fae.100.a:0 "The Ratkins and their accessories!"
 pod1230objectives_fae.100.b:0 "To stop rats, we need cats!"
 unlock_convert_to_catlover_scheme:0 "Unlock [GetScheme('convert_to_catlover').GetTypeName] [scheme|E]."
 pod1230objectives_fae.100.c:0 "The Mongol horde is to blame!"
 
 pod1230objectives_fae.101.t:0 "The Ratkin's Scheme"
 pod1230objectives_fae.101.desc:0 "There was a dark plan brewed by the vile the Ratkin, they created the most deadly disease ever known as the Black Plague. You are glad that you stopped them before they fully released it upon the world."
 pod1230objectives_fae.101.a:0 "Nasty rats."
 
 pod1230objectives_fae.102.t:0 "CATastrophe"
 pod1230objectives_fae.102.desc:0 "Every one in the world adore cats now, the Prophecy of the Rat will not be fulfilled, but there may be another issue to deal with."
 pod1230objectives_fae.102.a:0 "Oh my..."
 
 pod1230objectives_fae.103.t:0 "Scourge"
 pod1230objectives_fae.103.desc:0 "The Mongol Horde is slowing down thanks to you, and your Seer confirms that you have stopped a future of Mongols catapulting dead rats during sieges that could have spread a pandemic."
 pod1230objectives_fae.103.a:0 "I was right."
 
 pod1230objectives_fae.120.t:0 "End of Inquisition"
 pod1230objectives_fae.120.desc:0 "The creation of the Inquisition was the culmination of the Sundering as the Church in their doctrinal pursuits tried to eliminate all undesirable supernatural elements, including the fae, from the world. But now it is over."
 pod1230objectives_fae.120.a:0 "More superstitions!"
 
 pod1230objectives_fae.121.t:0 "Return of the Prodigals"
 pod1230objectives_fae.121.desc:0 "All other supernatural denizens of the World of Darkness are factions of the fae who have forgotten their origins in the Dreaming. Now they have returned to their senses."
 pod1230objectives_fae.121.a:0 "Welcome back."
 
 POD_fae_maintenance.21.t:0 "The Shattering"
 POD_fae_maintenance.21.desc:0 "You couldn't stop the Prophecy.\nEventually the threads that were pulled so thin between the mortal realm and the Dreaming began to snap. This severing has brought the [shattering|E]. Not only did it shatter the ties between Arcadia the Earth but the hopes that it could be reversed.\nYou must choose a way to deal with this."
 POD_fae_maintenance.21.a:0 "Adopt the Changeling Way."
 POD_fae_maintenance.21.b:0 "Flee to Arcadia."
 POD_fae_maintenance.21.c:0 "Sequester into a Freehold" #Become a Lost One.
 
 POD_fae_maintenance.22.t:0 "The Shattering"
 POD_fae_maintenance.22.desc:0 "Eventually the threads that were pulled so thin between the mortal realm and the Dreaming began to snap. This severing is the [shattering|E]. Not only did it shatter the ties between Arcadia the Earth but the hopes that it could be reversed."
 POD_fae_maintenance.22.a:0 "Yay?"
 
 constantinian_objective_decision:0 "Integrate with the Church"
 constantinian_objective_decision_tooltip:1 "The Church will come to see the Fae as holy servants of the divine: angels, prophets, miracle workers and the truly blessed."
 constantinian_objective_decision_desc:0 "Rather than seeing the Church as an enemy to be opposed and halted, Constantinians view it as a mystery to be revealed, studied and guided. Once the power of mortals' beliefs are understood, perhaps even the Mists will return to their more benevolent balance and the Fae can reap the glamour of the faithful's creativity."
 constantinian_objective_decision_confirm:0 "Establish the Constantinian Catechism"
 constantinian_objective_decision_custom_artifact:0 "You must have one of the holy relic [artifacts|E] of Christianity: the Holy Grail, a Fragment of the True Cross, the Lamp of Constantine, the Flagrum of the Passion, the Spear of Destiny, the Valencia Chalice or the Gabriel's Trumpet."
 constantinian_objective_decision_custom_byzantion:0 "The holder of [GetTitleByKey('c_byzantion').GetNameNoTier] must be an [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] or a [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]"
 constantinian_objective_decision_custom_roma:0 "The holder of [GetTitleByKey('c_roma').GetNameNoTier] must be an [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] or a [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]"
 constantinian_objective_decision_custom_jerusalem:0 "The holder of [GetTitleByKey('c_jerusalem').GetNameNoTier] must be an [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] or a [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]" 
 constantinian_objective_decision_custom1:0 "$POD_splat_hunter_plural$ will stop seeing the Fae as an incompatible enemy. Instead, the Fae will be seen as angels, prophets, miracle workers or as especially blessed"
 constantinian_objective_decision_custom2:0 "Can recruit [GetMaA('witchhunters').GetName] as [men_at_arms|E]"
 
 pod1230objectives_fae.122.t:0 "Constantinian Catechism"
 pod1230objectives_fae.122.desc:0 "Our Father in the heavens,\nhallowed be your names.\nYour kingdom come.\nYour Holy Spirits come upon us and cleanse us.\nYour will be done, on earth as in the heavens.\nGive us each day our bread for tomorrow,\nand forgive us our sins, for we ourselves honor our obligations.\nAnd do not bring us to the time of trial — the Shattering, or tempt us to banality.\nFor the kingdom and the power and the glory are yours forever."
 pod1230objectives_fae.122.a:0 "Amen."
 
 destroy_order_of_reason_objective_decision:0 "Beyond Reason"
 destroy_order_of_reason_objective_decision_tooltip:1 "You will prevent the Order of Reason from bringing more banality to world."
 destroy_order_of_reason_objective_decision_desc:0 "Men of learning seek to bind the world in Reason and Science. Their mundane efforts to catalog, define and limit the world is threatening to bring an end to belief in the mysterious and uncontrollable. The Craftmasons, the successors of ancient Rome's Collegium Praecepti in their new alliance with the Brotherhood of Rule seek to bind reality in restrictive regulations like some sort of banal solicitors of cold ironclad laws of the Ars Praeclarus. They are tracing the ley lines to find fonts of glamour, which they call nodes, that they then drain and destroy. In 1210 AD, the Craftmasons destroyed the Covenant of Mistridge with long wrought iron tubes firing cold iron balls in a process they call 'cannon fire'. It is said that the traitorous prodigal House Tremere, once Hermetic mages — now vampires, have contributed to this victory of the Craftmasons. These 'reasonable men' slaughtered every Witch and Fae they could find in the ruins of Mistridge and its enviorns. They must be stopped at all costs!"
 destroy_order_of_reason_objective_decision_confirm:0 "No more stasis"
 destroy_order_of_reason_objective_decision_before_last_date:0 "The date is 1851.1.1 or earlier"
 destroy_order_of_reason_objective_decision_custom:0 "The Order of Reason [title|E] must be destroyed.\nYou must control the wrought iron arsenal workshops of Innsbruck in the Duchy of Tyrol."
