 sidhe_house_dominance_fiona_objective_decision:0 "Great Lover"
 sidhe_house_dominance_fiona_objective_decision_desc:0 "For the Fionna, it is far better to be loved than fear. Practically all Fiona are Romanticists; they gleefully indulge in courtly love and build elaborate games and rituals around all affairs of the heart. Fiona courts are places of beauty and passion, often filled with playful intrigues, secret trysts, and forbidden loves. Fionna can gather fame by having great skill in lovemaking, increasing their already supernatural attractiveness, and also having varied and powerful paramours that are useful in their future schemes."
 sidhe_house_dominance_fiona_objective_decision_tooltip:0 "You will have six interesting lovers."
 sidhe_house_dominance_fiona_objective_decision_confirm:0 "We loved with a love that was more than love"
 sidhe_house_dominance_fiona_objective_decision_custom:0 "Have #V 3#! great persons as [lovers|E]"
 sidhe_house_dominance_fiona_objective_decision_werewolf:0 "Have a [GetTrait('werewolf').GetName( GetPlayer )] as a [lover|E]"
 sidhe_house_dominance_fiona_objective_decision_sidhe:0 "Have a [landed|E] [GetTrait('sidhe').GetName( GetPlayer )] as a [lover|E]"
 sidhe_house_dominance_fiona_objective_decision_satyr:0 "Have a [GetTrait('satyr').GetName( GetPlayer )] as a [lover|E]"
