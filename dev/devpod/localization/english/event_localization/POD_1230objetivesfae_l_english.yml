 prevent_black_death_rat_objective_decision:0 "Schemes of the Ratkin"
 prevent_black_death_rat_objective_decision_desc:0 "May Fae seers are having prophetic dreams about a cataclysmic event in the future that kills millions of dreamers. Details are vague but it seems to involve hordes of rats coming from sunrise, piles of burning corpses, dancing skeletons, blackened fingers and toes. Some fae are convinced that the Ratkin and their diseased Wyrmish accessories must be destroyed."
 prevent_black_death_rat_objective_decision_tooltip:1 "You will attempt to prevent the fulfillment of the Prophecy of the Rat."
 prevent_black_death_rat_objective_decision_confirm:0 "Speak!"
 prevent_black_death_rat_objective_decision_custom:0 "There must be no [independent_ruler|E] following [GetReligionFamily('rf_wyrm').GetName] [religion|E] on the map"
 prevent_black_death_rat_objective_decision_custom_ex:0 "$prevent_black_death_rat_objective_decision_custom$ #weak ([example.GetFirstName])#!"        

 prevent_black_death_cat_objective_decision:0 "Kitties!"
 prevent_black_death_cat_objective_decision_tooltip:1 "You will prevent the Prophecy of the Rat by making everyone adore cats."
 prevent_black_death_cat_objective_decision_desc:0 "Clearly, to prevent the Prophecy of the Rat, you should make everyone love cats!"
 prevent_black_death_cat_objective_decision_confirm:0 "Mew!"
 prevent_black_death_cat_objective_decision_custom1:0 "Every king and emperor must have [GetModifier('cat_story_modifier').GetNameWithTooltip] modifier"
 prevent_black_death_cat_objective_decision_custom1_ex:0 "$prevent_black_death_cat_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 prevent_black_death_cat_objective_decision_custom2:0 "Can recruit [GetMaA('cats').GetName] as [men_at_arms|E]"

 prevent_black_death_anda_objective_decision:0 "Stopping the Horde"
 prevent_black_death_anda_objective_decision_tooltip:1 "You will prevent the Prophecy of the Rat by stopping the Mongols, targeting their Anda bodyguards to weaken them."
 prevent_black_death_anda_objective_decision_desc:0 "That Prophecy of the Ratkin is unclear, but you have a feeling that dealing with the Mongol and Anda hordes may help."
 prevent_black_death_anda_objective_decision_confirm:0 "No more raids."
 
 destroy_inquisition_objective_decision:0 "Destroy the Inquisition"
 destroy_inquisition_objective_decision_tooltip:1 "You will destroy the Shadow Inquisition."
 destroy_inquisition_objective_decision_desc:0 "The Church and its dreaded Inquisition persecutes pagans and the Fae. It converts by the sword, tortures or burns to death the followers of the Old Gods and practitioners of the Mystic arts. Its priests use of ritual baptism upon Changeling children to forever rob them of their enchanted nature to snuff out the spark of Glamour. Popes Celestine II and Innocent the III have declared violent conversion of Livionia by Crusade. A papal bull has declared that fighting the Baltic pagans was of the same rank as participating in the Crusade for Jerusalem. For the Fae to remain on Earth, it is time to stop this."
 destroy_inquisition_objective_decision_confirm:0 "Bring an end to the Burning Times."
 destroy_inquisition_objective_decision_before_last_date:0 "The date is 1430.1.1 or earlier"
 destroy_inquisition_objective_decision_custom1:0 "The Age of Inquisition event won't happen in the future"
 destroy_inquisition_objective_decision_custom2:0 "Unlock $prodigal_objective_decision$ decision"
 destroy_inquisition_objective_decision_james:0 "The [GetTitleByKey('k_sword_of_st_james').GetNameNoTier] [title|E] must be destroyed."
