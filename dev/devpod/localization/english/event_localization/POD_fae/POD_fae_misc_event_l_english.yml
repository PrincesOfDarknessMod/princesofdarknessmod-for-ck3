 POD_fae_misc.2.t: "$POD_lilin_objective_decision$"
 POD_fae_misc.2.desc: "The actors are in place, and I have all the required knowledge to reenact the legend of Lilith with me as her. The grand spectacle is about to begin, and another Lilith is soon to be born.\n\nSo the play has started, the recreation of the Legend in the Far Dreaming. The actors play their role and I am at the centre. The creation of First Man and Woman, The Dissolution of Lilith and her Creator, The Rebellion, The Fleeing. All the major acts are played in sequence, we forget ourselves in the name of the play. Everything is perfectly recreated, nothing is wrong.\n\nAnd the Act has ended, the actors return to their normal life. And The Dreaming itself has accepted our version as another face of the same event. And I am reborn anew. I may no be Lilith, but I am not just a lilin."
 POD_fae_misc.2.a: "Dark Apotheosis"

 POD_fae_misc.3.t: "Humanity's Guide"
 POD_fae_misc.3.desc: "Humanity is blind to the wonderful world of The Dreaming, only being able to grasp a fragment when they sleep. As such, it was no wander why they strayed from the right path towards disbelief.\n\nBut a fortunately you were there, before humanity could commit a major mistake. You guided the mislead towards a right path, and with your control over major knowledge sources you can ensure that this will not happen again."
 POD_fae_misc.3.a: "A wonderful future awaits."
 POD_fae_misc.3_custom1: "Significantly improved spread culture and access to the develop county decision if not unseelie."


 POD_fae_misc.4.t: "Wish Granted"
 POD_fae_misc.4.a: "Your wish is my command."
 POD_fae_misc.4.desc_brains_wish: "So... you wish to be the brains of the family?\n\nYour brains will be closer to family than you'd like."
 POD_fae_misc.4.desc_enemies_wish: "So... you wish to see your enemies before they strike?\n\nAnd strike they shall... in your mind."
 POD_fae_misc.4.desc_feared_wish: "So... you wish to be feared?\n\nAnd so they shall fear you and every aspect of you."
 POD_fae_misc.4.desc_marriage_wish: "So... you wish to spice up your married life?\n\nSpiced up it shall be but perhaps not for the better."
 POD_fae_misc.4.desc_speaking_wish: "So... you wish everyone to hang on your every word?\n\nAnd those words will hang... if you can get them out that is."
 POD_fae_misc.4.desc_dwarf_wish: "So... you wish to dwarf over your foes?\n\nAnd a dwarf you shall be."
 POD_fae_misc.4.desc_appearance_wish: "So... you wish to turn heads wherever you go?\n\nAnd turn they certainly shall, just perhaps not the way you want them to."
 POD_fae_misc.4.desc_spouse_wish: "So... you wish for your spouse to have eyes only for you?\n\nAnd see only you they shall."
 POD_fae_misc.4.desc_wealth_wish: "So... you wish for wealth beyond compare?\n\nWith what shall you compare it with?"
 POD_fae_misc.4.desc_knowledge_wish: "So... you wish for knowledge beyond your understanding?\n\nKnowledge you shall have beyond your understanding it shall be."
 POD_fae_misc.4.desc_conscience_wish: "So... you wish to be rid of your worries and guilts?\n\nRid of them you shall be when all is laid bare for all to hear."

 POD_fae_misc.400.t: "Wishes Granted"
 POD_fae_misc.400.desc: "With your infamy for granting wishes, but not quite in the way people expect them have affected various powerful supernaturals.\neven mortals tell tale of the infamous djinn and their wiley ways, it is without a doubt this will have significant effect in djinns ability to withstand the ravages of banality."
 POD_fae_misc.400.a: "It just felt natural to me."