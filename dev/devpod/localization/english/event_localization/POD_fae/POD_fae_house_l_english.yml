l_english:
 POD_fae_house_event.1.t: "Iron Schism"
 POD_fae_house_event.1.desc: "The debate on Duke [GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName]'s final fatal prophecy is settled by the destruction of the other side of the argument. Through blood the unity of the house has been restored, and your leadership of the Beaumayn is unquestioned."
 POD_fae_house_event.1.a: "The followers of [GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName] are victorious and will enforce the Eschet!"
 POD_fae_house_event.1.b: "Harbingers of Exodus shall led us all along the Iron Road"

 POD_fae_house_event.2.t: "Gold to Steel"
 POD_fae_house_event.2.desc: "While it came at great expense, your leadership of the master craftsmen of House Dougal have built an armory of truly legendary might and scope. With weapons like these, the Fae can conquer the whole world. Thousands that stand in Arms, and longing wait the Signal to ascend!"
 POD_fae_house_event.2.a: "To Arms! To Arms!"
 
 POD_fae_house_event.3.t: "Fortified Freeholds"
 POD_fae_house_event.3.desc: "To be forewarned is to be forearmed. With your supernatural insight into future possibilities, the architects of House Eiluned have constructed elaborate defensive fortifications that can withstand any kind of siege. Your defenses are filled with secret passages, labyrinths, bolt holes, murder holes, and magical cantrip traps. At last, you feel secure."
 POD_fae_house_event.3.a: "Let my enemies come — they will be dashed against the stones!"
 
 POD_fae_house_event.4.t: "Greatest of Lovers"
 POD_fae_house_event.4.desc: "The bards will sing of your romantic exploits with great desire in their hearts forever. You have learned the art of love making from mythological personification of lust — the Satyrs. You personify the beauty of the fairest of Sidhe. You have tamed the ferocious heart of a raging werewolf, and leashed them to your desires. Great persons would drop their grandest designs all for an evening in your bed. All shall love you and despair!"
 POD_fae_house_event.4.a: "Love me, love me, say that you love me" 
 
 POD_fae_house_event.5.t.king: "The True King Crowned"
 POD_fae_house_event.5.t.queen: "The True Queen Crowned"
 POD_fae_house_event.5.desc.king: "Through heroic efforts, House Gwydion with your leadership has proven itself to be the most noble of all the Sidhe. Who else could quest to find and wield the thunderbolt — the Sword of Light — the peace-maker's blade — [GetPODArtifact('caliburn_link').GetName], but you, the True King! All fae must bow before your majesty and acknowledge you ultimate sovereignty."
 POD_fae_house_event.5.desc.queen: "Through heroic efforts, House Gwydion with your leadership has proven itself to be the most noble of all the Sidhe. Who else could quest to find and wield the thunderbolt — the Sword of Light — the peace-maker's blade — [GetPODArtifact('caliburn_link').GetName], but you, the True King! All fae must bow before your majesty and acknowledge you ultimate sovereignty." 
 POD_fae_house_event.5.a: "All may now pay obeisance"
 
 POD_fae_house_event.6.t: "Mortal Song"
 POD_fae_house_event.6.desc: "It is done. The flock have accepted the fae as their shepherds and guides. The Church will no longer be the threat to the Fae that it once was, and all the fair folk have [ROOT.Char.GetFullName] to thank. Praises shall be sung to House [ROOT.Char.GetHouse.GetName] for all eternity.\n\nEvery fae on earth and in the heavens will need to consider their relationship with the Holy Church and its Sacred intercessors — the [ROOT.Char.GetHouse.GetName]. Pray they choose the righteous path to salvation, or surely hell's gaping maw awaits them forever and ever. Redemption is at hand!\n\nThe mortals shall help in every way they can creating great cathedrals, magnificent art and triumphant music all in glory to the divine and his holy messengers. Let us build a shining city upon the hill that shall be a beacon of hope and salvation for all who have ears to hear our beatific song!"
 POD_fae_house_event.6.a: "Hallelujah!" 
 
 POD_fae_house_event.7.t: "Midgard Preserved"
 POD_fae_house_event.7.desc: "With all supernatural creatures of Midgard having fallen under your realm, the Christianization of Scandinavia has begun to be reversed. The Norse people will honor the old ways and shall revere the Aesin as gods on Earth.\n\n'Heed my words, all classes of men, you greater and lesser children of Heimdall. You summoned us, Aesin, to tell what we recall of the oldest deeds of gods and men.'"
 POD_fae_house_event.7.a: "My ravens, fly every day the whole world over." 
 
 POD_fae_house_event.8.t: "Ailil for all Seasons"
 POD_fae_house_event.8.desc: "With your skills of intrigue and diplomacy, you achieved managed to end the terrible conflict that has divided the Fae for so long. With your leadership, House Ailil has risen above all the petty squabbles of the other Sidhe Houses. Now with the preeminence of your house, the efforts of the Fae can be focused on renewing the ancient pacts with humanity. They will believe again and forever."
 POD_fae_house_event.8.a: "A time of war, And a time of peace." 
 
 POD_fae_house_event.9.t: "Fomorian Forever"
 POD_fae_house_event.9.desc.start: "House Balor has traced your ancestry back to a line of sidhe who mixed their blood with that of the Fomorians. The Endless Winter is almost here, and you need to guide fae through it, whether they consent to your rule or not. You have prepared the ritual to merge your Fae self with a powerful bane spirit to create a Fae-Fomori hybrid — a Fomarch. Balor's Crystal Eye glows a dull red and radiates a great heat."
 POD_fae_house_event.9.desc.steaming_spear_of_vengeance: "Hefting the [GetPODArtifact('steaming_spear_of_vengeance_link').GetName], you lick hot blood from its blade feeling your self filled with rage."
 POD_fae_house_event.9.desc.cauldron_of_fear: "Having prepared the foul, mystical concoction — you drink deeply from the [GetPODArtifact('cauldron_of_fear_link').GetName]."
 POD_fae_house_event.9.desc.blood_dross: "Crushing the crystallized sugar tiny vial, you drink the vampiric blood contained within the Blood Dross and are filled with dark glamour."
 POD_fae_house_event.9.desc.end: "You open a trod to the [umbra|E] to call forth the Nexus Crawler.\nA black shimmer appears in the air along with a warbling vibrato moan. You have a feeling on your skin like fingernails scraped across a blackboard. The air stinks of a miasmic scent reminiscent of a cancerous illness. The $glossary_wyrm$ spirit manifests into a loathsome and horrifying avatar. Its claws and fangs rip open your flesh and it violently thrusts itself into your chest cavity. You are filled with excruciating pain. And then...\nWe are united. Forever."
 POD_fae_house_event.9.a: "We are the Fomarch!"
 
 POD_fae_house_event.10.t: "Healer-Warrior"
 POD_fae_house_event.10.desc: "As leader of House Daireann, you have endeavored to exemplify the dual nature of healer and warrior. Your hand can heal and your hand can harm. You are like a cup that can hold both poison or an antidote, like a blade can be used to heal or to sever the thread of a life."
 POD_fae_house_event.10.a: "Healer-Warrior" 
 
 POD_fae_house_event.14.t: "Leanhaun's Curse"
 POD_fae_house_event.14.desc: "As leader of the House Leanhaun, you have discovered a way to lessen the curse of your entire dynasty. Rather than just moving from one rhapsodized mortal at a time when in desperate need, you cultivate a large stable mortals for harvest, including some great prizes who overflowed with glamour. By repeatedly draining such a large pool of glamour, you have been able to mitigate the curse."
 POD_fae_house_event.14.a: "Leanhaun's Curse" 
 
 POD_fae_house_event.11.t: "Spirits of the Rus"
 POD_fae_house_event.11.desc: "As leader of House Varich, you have cultivated a strong relationship with the nature spirits of the land of the Rus. These spirits were part of everything for the fae: the earth, the rivers, their freeholds, and the endless taiga surrounding them. You understand how to please these spirits as well as how to use them. Spirits of the hearth and home are as powerful and helpful as the size and magnificence of their Anchors, as well as the amount of respect you have paid to them. The obligations of nobility and servant flows two ways, and the Inaimae are ready to act upon your will."
 POD_fae_house_event.11.a: "They are the spirits of a good land." 
 
 POD_fae_house_event.12.t: "Edicts of the Morphean Oracles"
 POD_fae_house_event.12.desc.fae: "While the Edicts of the Morphean Oracles do not always make sense to members of the house, the is house is unified in following them. As the first born fae leader of House Scathach, you have quested to the [UmbraGlossary('deep_dreaming')] and the [UmbraGlossary('sea_of_silver')] to find what was prophesied to be found. Will it be enough?"
 POD_fae_house_event.12.desc.changeling: "While the Edicts of the Morphean Oracles do not always make sense to members of the House Scathach, the is house is unified in following them. As the changeling leader of the House, you have strictly followed the commandant of Scathach to remain behind in the Autumn World even the face of rising banality. Will it be enough?"
 POD_fae_house_event.12.a: "As always, we honor the Morphean Oracles" 
 
 POD_fae_house_event.13.t: "Dreaming Guard"
 POD_fae_house_event.13.desc: "As the leader of House Danaan, you have roamed the many paths through the [UmbraGlossary('dreaming')]. You now guard its trods and blaze new trails. You have acted as a guide to many dreamers. By your Oath to the Dragon you have gained the favor of many Chimera. You have raised an impressive horde of Chimera who await your commands, willing to even invade the Autumn world at your call."
 POD_fae_house_event.13.a: "For Defense of the Trods to Arcadia!"  

 POD_fae_house_event.15.t: "Inert Cold Iron"
 POD_fae_house_event.15.desc: "The 'natural philosophers' are wrong that the universe is bound by rigid, discoverable laws. With great effort, time, expense and sheer force of will you have demonstrated what all alchemists who sought the Philosopher's Stone have suspected. By conducting thousands of experiments, you persevered and eventually achieved the results you sought. Reality bends to those with the minds and confidence to actualize their desires. If something so base as the legendary quest of alchemists transmuting lead into gold is possible, then why not the transmutation of cold iron to render its qualities to destroy the immortal souls of the Fae also be nullified. Eureka! You have done it!"
 POD_fae_house_event.15.a: "Reality is what I say it is!"

 POD_fae_house_event.16.t: "Gazed by The Dreaming"
 POD_fae_house_event.16.desc: "We, no. I did it.\n\nI did something so great, that The Dreaming itself recognized my efforts and bestowed me the tile of a Noble."
 POD_fae_house_event.16.a: "Once commoner, now a noble."