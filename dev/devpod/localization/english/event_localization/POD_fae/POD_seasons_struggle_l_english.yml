 pod_seasons_struggle.120.t: "The Court of All Seasons"
 pod_seasons_struggle.120.desc: "The wars of the past will remain there, and the other Fae courts will see the benefits of co-existence."
 pod_seasons_struggle.120.a: "The Seasonal Courts have been united."
 
 pod_seasons_struggle.1001.t: "Seasons Greetings"
 pod_seasons_struggle.1001.desc: "As leader of a Fae court, you should join the War of Seasons."
 pod_seasons_struggle.1001.a: "Set capital in the Ireland"
 pod_seasons_struggle.1001.b: "Take land from a vassal"
 pod_seasons_struggle.1001.c: "War a prodigal to get land"
 pod_seasons_struggle.1001.d: "I am not ready to do this"
 run_away_from_season_war_tooltip: "This is not the first time you have spurned the War of Seasons."

