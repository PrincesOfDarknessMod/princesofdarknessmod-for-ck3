l_english:
 POD_claimleadership_events.1.t: "Claiming Title of $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.1.desc: "Plan is simple, Show how really is worth of $PODWarOfSeasonsLeader_autumn$ title. That can be done by various means, and we will use every besides strait murder. After-all, we are not savages..."
 POD_claimleadership_events.1.a: "Let's do it!"
 POD_claimleadership_events.1.b: "Let's not be hasty."

 POD_claimleadership_events.2.t: "Claiming Title of $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.2.desc: "Everything went according to plan, and [target.GetNamePossessive] whole reparation is burned to the ground, and then burned a bit more. And Everyone knows that I [GetPlayer.GetName] am true $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.2.a: "[target.GetSheHe] will have a nice surprise tomorrow!"
 POD_claimleadership_events.2.b: "So what that they know? I won regardless!"

 POD_claimleadership_events.3.t: "Claiming Title of $PODWarOfSeasonsLeader_autumn$: Failure"
 POD_claimleadership_events.3.desc: "NO NO NO, These idiots! They failed! [target.GetNamePossessive] reputation remains untainted by my various attempts to taint it! And they worst part? I look pathetic!"
 POD_claimleadership_events.3.a: "Oh no..."