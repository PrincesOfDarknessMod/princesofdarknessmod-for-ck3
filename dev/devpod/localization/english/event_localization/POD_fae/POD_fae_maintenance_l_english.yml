l_english:

 POD_fae_maintenance.1.t: "Chrysalis"
 POD_fae_maintenance.1.desc: "The Chrysalis is the process by which a changeling becomes aware of their fae nature."
 POD_fae_maintenance.1.option.a: "I am awake."

 POD_fae_maintenance.21.t: "The Shattering"
 POD_fae_maintenance.21.desc: "You could not prevent the Prophecy.\nEventually the threads were pulled so thin between the mortal realm and the [UmbraGlossary('dreaming')] began to snap. This severing has brought the [Glossary('Shattering','game_concept_shattering_desc')]. Not only did it shatter the ties between [UmbraGlossary('arcadia')] the Earth but it also dashed the hopes that it could be reversed.\nYou must choose a way to deal with this."
 POD_fae_maintenance.21.a: "So what?"
 POD_fae_maintenance.21.b: "Adopt the Changeling Way and give up your immortality."
 POD_fae_maintenance.21.c: "Flee to Arcadia."
 POD_fae_maintenance.21.d: "Sequester into a Freehold" #Become a Lost One.
 POD_fae_maintenance.22.t: "The Shattering"
 POD_fae_maintenance.22.desc: "Eventually the threads that were pulled so thin between the mortal realm and the [UmbraGlossary('dreaming')] began to snap. This severing is the [Glossary('Shattering','game_concept_shattering_desc')]. Not only did it shatter the ties between [UmbraGlossary('arcadia')] the Earth but it also dashed the hopes that it could be reversed."
 POD_fae_maintenance.22.a: "Yay?"
 
 POD_fae_maintenance.31.t: "The Interregnum"
 POD_fae_maintenance.31.desc: "The period of almost no sidhe nor True Fae on Earth, with the remaining 'watered down' changelings having to fend for themselves after the final death-throes of the [Glossary('Shattering','game_concept_shattering_desc')] around 1400 AD is the Interregnum, as changelings had to try to work out how to survive on their own."
 POD_fae_maintenance.31.a: "Our time has gone."
 POD_fae_maintenance.31.b: "Our time has come."

 POD_fae_maintenance.40.t: "Fables"
 POD_fae_maintenance.40.desc: "Fables"
 POD_fae_maintenance.40.a: "Fable of The Herald"
 POD_fae_maintenance.40.a.tt: "To improve this fable, you will have to complete many [diplomacy|E] contracts as well increase your [prestige_level|E]. In return you will slowly unlock [GetDomicileBuilding('fae_travelers_lodgings_fable_of_herald_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Fable's advance."
 POD_fae_maintenance.40.b: "Fable of The Marshal"
 POD_fae_maintenance.40.b.tt: "To improve this fable, you will have to complete many [martial|E] contracts as well win many battles as [commander|E]. In return you will slowly unlock [GetDomicileBuilding('fae_knights_quarter_fable_of_marshal_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Fable's advance."
 POD_fae_maintenance.40.c: "Fable of The Stewardship"
 POD_fae_maintenance.40.c.tt: "To improve this fable, you will have to complete many [stewardship|E] contracts as well amass large amount of [gold|E]. In return you will slowly unlock [GetDomicileBuilding('fae_alley_of_gold_fable_of_steward_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Fable's advance."
 POD_fae_maintenance.40.d: "Fable of The Shadow"
 POD_fae_maintenance.40.d.tt: "To improve this fable, you will have to complete many [intrigue|E] contracts as well success in many [hostile_schemes|E]. In return you will slowly unlock [GetDomicileBuilding('fae_shadow_district_fable_of_shadow_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Fable's advance."
 POD_fae_maintenance.40.e: "Fable of The Sage"
 POD_fae_maintenance.40.e.tt: "To improve this fable, you will have to complete many [learning|E] contracts as well teach many [perk|E] points to other [characters|E]. In return you will slowly unlock [GetDomicileBuilding('fae_enchanted_shrine_fable_of_sage_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Fable's advance."