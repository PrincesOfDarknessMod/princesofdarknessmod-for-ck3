l_english:
 POD_infernalism_events.1.t: "Details of the [demonic_pact|E]"
 POD_infernalism_events.1.desc: "Ironing out details of a [demonic_pact|E] isn't easy...\nDemons take their pacts very seriously. While they are bound to respect their end of the bargain, they will jump at any loopholes or unclear clauses that can be to their advantage. Many foolish infernalists learned way too late to read the fine print with more dedication than the big letters written in blood."

 POD_infernalism_events.1.frequency: "[demonic_pact_frequency|E]"
 POD_infernalism_events.1.obligation: "[demonic_pact_obligation|E]"
 POD_infernalism_events.1.consequence: "[demonic_pact_consequence|E]"

 POD_infernalism_events.1.confirm: "My soul for power."
 POD_infernalism_events.1.a: "This isn't to my advantage."