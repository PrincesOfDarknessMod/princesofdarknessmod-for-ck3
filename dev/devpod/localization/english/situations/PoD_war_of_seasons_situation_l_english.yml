 PODWarOfSeasonsLeader_summer: "Summer Sovereign"
 PODWarOfSeasonsLeader_autumn: "Autumn Autocrat"
 PODWarOfSeasonsLeader_winter: "Winter Warlord"
 PODWarOfSeasonsLeader_solstice: "Solstice Leader"

 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_WAR: "This bar shows progress towards [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war').GetName]. It currently is at [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war')).GetTakeoverPoints]$WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL$"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_PEACE: "This bar shows progress towards [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace').GetName]. It currently is at [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace')).GetTakeoverPoints]$WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL$"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_STATUS_QUO: "This bar shows progress towards [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo').GetName]. It currently is at [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo')).GetTakeoverPoints]"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL: "\n\nWhen any of bars will fully fill, [GetSituationType('PoD_war_of_seasons').GetName] will progress towards corresponding [situation_phase|E]. It is not important how much other bar has progressed, only which one did fully fill first."
 WINDOW_POD_WAR_OF_SEASONS_FUTURE_EFFECTS: "Effects from Future Phase"

 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SPRING: "[GetReligionByKey('spring_court_religion').GetName] Leaders are elected by popular vote of all [independent_rulers|E].\n\nElections happen every #V 10 years#! but can be forced by usage of [prestige|E]."
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SPRING_BUTTON: "Start Election!"

 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SUMMER: "[GetReligionByKey('summer_court_religion').GetName] Leaders are chosen based on their [vassals|E]. $POD_splat_fae$ with highest amount of [vassals|E] is chosen.\n\n\n"

WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN: "[GetReligionByKey('autumn_court_religion').GetName] Leaders are not chosen, but replaced. Every Autumn $POD_splat_fae$ can start [scheme|E] against current leader to replace them.[AddTextIf(Not(ObjectsEqual(GetPlayer.Self,Situation.MakeScope.GetVariable('autumn_leader').Char)), Localize('WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON_TEXT'))]"
WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON_TEXT: "\n\nClicking button will open [character_interaction|E] to start [scheme|E]"
WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON: "Time for [scheming|E]"
autumn_button_script: "This will open [character_interaction|E] #V $PODClaimLeadership_scheme_interaction$#! against [GetSituation('PoD_war_of_seasons').MakeScope.GetVariable('autumn_leader').Char.GetName]"

WINDOW_POD_WAR_OF_SEASONS_LEADERS_WINTER: "[GetReligionByKey('winter_court_religion').GetName] Leaders are chosen based on their [dread|E]. $POD_splat_fae$ with highest [dread|E] among [independent_rulers|E] will be chosen as $PODWarOfSeasonsLeader_winter$\n\nThis is checked every #V year#!"

WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE: "[GetReligionByKey('solstice_court_religion').GetName] Don't have a leader. They are too small, too marginalized for other [Concept('religion', 'Court')|E] to think about them as an equal.\n\nBut you can change that. With enough [realm|E] size and number of [vassals|E] you could force yourself into position of power."
WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE_BUTTON: "We need to be heard!"
solstice_button_script_vassal: "You need #V 25#! [vassals|E]! #weak (#V [SCOPE.GetValue('vassal_num')]#!)#!"
WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE_LEADER: "[GetReligionByKey('solstice_court_religion').GetName] Leaders are heritable from First Solstice Leader up to their children.\n\nIf main line of Solstice Leaders would die out, random Solstice ruler would step up onto potion of power."