 PoD_war_of_seasons_usurp_title_court: "Usurping [title]|E"
 PoD_war_of_seasons_usurp_title_court_desc: "Usurp/Gain Claim on [title|E] of $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"

 PoD_war_of_seasons_gift_court: "Gifting"
 PoD_war_of_seasons_gift_court_desc: "Gift [gold|E] or [artifact|E] to $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_befriend_court: "Befriending"
 PoD_war_of_seasons_befriend_court_desc: "Befriend $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_seduce_court: "Seducing"
 PoD_war_of_seasons_seduce_court_desc: "Seduce $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_sign_truce_outside_war__court: "True outside [war|E]"
 PoD_war_of_seasons_sign_truce_outside_war_court_desc: "Sign [truce|E] outside [war|E] with $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_pay_random_court: "Paying Ransom"
 PoD_war_of_seasons_pay_random_court_desc: "Pay ransom to release $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"

 WINDOW_POD_WAR_OF_SEASONS_LEADERS: "[Concept('religion', 'Court')|E] Leader"
