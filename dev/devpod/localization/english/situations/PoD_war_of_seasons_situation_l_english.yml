l_english:
 PoD_war_of_seasons: "The War of Seasons"
 PoD_war_of_seasons_desc: "The War of Seasons is a long standing conflict between the four Seasonal Courts fighting over the dominance of the Autumn World. Even though an Oath-Truce was signed, it already expired and fighting can once more continue. But will it?"
 situation_type_PoD_war_of_seasons: "$PoD_war_of_seasons$"
 situation_type_PoD_war_of_seasons_desc: "$PoD_war_of_seasons_desc$"
 situation_PoD_war_of_seasons: "$PoD_war_of_seasons$"
 situation_PoD_war_of_seasons_desc: "$PoD_war_of_seasons_desc$"

 PoD_war_of_seasons_sub_region_core: "$PoD_war_of_seasons$"
 PoD_war_of_seasons_sub_region_core_desc: "$PoD_war_of_seasons_desc$"

 PoD_war_of_seasons_situation_status_quo: "Status Quo"
 PoD_war_of_seasons_situation_status_quo_icon: "@fae_icon! $PoD_war_of_seasons_situation_status_quo$"
 PoD_war_of_seasons_situation_status_quo_desc_short: "Status Quo"
 PoD_war_of_seasons_situation_status_quo_desc: "Oath Truce should have ended in 1230. But we are not fully convinced into returning into War, nor to fully abandon our rightful hatred.\n\n...But such state cannot last forever, sooner or later hatred will flourish in war, or maybe it will completely die out?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_status_quo_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 PoD_war_of_seasons_situation_war: "War for Seasons"
 PoD_war_of_seasons_situation_war_icon: "@fae_icon! $PoD_war_of_seasons_situation_war$"
 PoD_war_of_seasons_situation_war_desc_short: "War"
 PoD_war_of_seasons_situation_war_desc: "Oath Truce has ended. War is upon us, Fighting between [Concept('religion','Courts')|E] flare in glorious fire. And there can be only one winner! Pick the swords, cast [cantrips|E] and kill them all!\n\n... But maybe, just maybe. We can reconcile again? Bring Oath Truce into life again?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_war_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 PoD_war_of_seasons_situation_peace: "Harmony"
 PoD_war_of_seasons_situation_peace_icon: "@fae_icon! $PoD_war_of_seasons_situation_peace$"
 PoD_war_of_seasons_situation_peace_desc_short: "Status Quo"
 PoD_war_of_seasons_situation_peace_desc: "Oath Truce was a great success, hatred between [Concept('religion','Courts')|E] has slowly died out. And what once was considered impossible, a friendship between members of different [Concept('religion','Courts')|E] has sprout, and we can all finally unite? Like at the old times, right? Friends?\n\n... But hatred hasn't died fully, there are small fires of conflict. What would happen if they fully sprout? Would war return?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_peace_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 PoD_war_of_seasons_participant_group_spring_fae: "$spring_court_religion$ Fae"
 PoD_war_of_seasons_participant_group_spring_fae_desc: "$spring_court_religion_desc$"

 PoD_war_of_seasons_participant_group_summer_fae: "$summer_court_religion$ Fae"
 PoD_war_of_seasons_participant_group_summer_fae_desc: "$summer_court_religion_desc$"

 PoD_war_of_seasons_participant_group_autumn_fae: "$autumn_court_religion$ Fae"
 PoD_war_of_seasons_participant_group_autumn_fae_desc: "$autumn_court_religion_desc$"

 PoD_war_of_seasons_participant_group_winter_fae: "$winter_court_religion$ Fae"
 PoD_war_of_seasons_participant_group_winter_fae_desc: "$winter_court_religion_desc$"

 PoD_war_of_seasons_participant_group_solstice_fae: "$solstice_court_religion$ Fae"
 PoD_war_of_seasons_participant_group_solstice_fae_desc: "$solstice_court_religion_desc$"

 PoD_war_of_seasons_character_effects: "#bold Character#!"
 PoD_war_of_seasons_character_effects_concept: "[GetSituationType('PoD_war_of_seasons').GetName]"
 PoD_war_of_seasons_court_effects: "#bold Courts#!"
 PoD_war_of_seasons_court_effects_concept: "[GetSituationType('PoD_war_of_seasons').GetName]"

 situation_parameter_war_of_seasons_situation_war_active: "All Kithain [faiths|E] will gain [GetDoctrine('special_doctrine_war_of_seasons_hostility_war').GetBaseName] for duration of [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war').GetName]"
 situation_parameter_war_of_seasons_situation_peace_active_active: "All Kithain [faiths|E] will gain [GetDoctrine('special_doctrine_war_of_seasons_hostility_peace').GetBaseName] for duration of [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace').GetName]"
 
 situation_parameter_war_of_seasons_convert_to_militant_fraction: "Unlock [character_interaction|E] for [court_leader|E], to convert $POD_splat_fae$ of the same [Concept('religion','Court')|E] to become [GetFaithDoctrine('doctrine_fae_agenda_militant').GetBaseName]"
 situation_parameter_war_of_seasons_convert_to_truce_bearer_fraction: "Unlock [character_interaction|E] for [court_leader|E], to convert $POD_splat_fae$ of the same [Concept('religion','Court')|E] to become [GetFaithDoctrine('doctrine_fae_agenda_trucebearer').GetBaseName]"

 situation_parameter_war_of_seasons_unlock_peace_objective: "Unlock objective for an [court_leader|E] to end [GetSituationType('PoD_war_of_seasons').GetName] once and for all."
 situation_parameter_war_of_seasons_unlock_war_objective: "Unlock objective for an [court_leader|E] to declare your Season as victorious in [GetSituationType('PoD_war_of_seasons').GetName]."

 PoD_war_of_seasons_return_to_base_desc: "Slow return to #bold 0#! points"

 PoD_war_of_seasons_kill_court: "Murdering"
 PoD_war_of_seasons_kill_court_desc: "Kill $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_start_war_court: "Starting [war|E]"
 PoD_war_of_seasons_start_war_court_desc: "Start [war|E] against $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_win_war_court: "Winning [war|E]"
 PoD_war_of_seasons_win_war_court_desc: "Win [war|E] against $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_gain_rival_court: "Gaining [rival|E]"
