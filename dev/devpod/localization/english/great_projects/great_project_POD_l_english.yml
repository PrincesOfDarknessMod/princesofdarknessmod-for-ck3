 building_type_POD_dazbog_great_project_cathedral_under_construction_01: "Cathedral"
 building_POD_dazbog_great_project_cathedral_under_construction_01: "Cathedral Under Construction"
 building_POD_dazbog_great_project_cathedral_under_construction_01_desc: "Rising up within treadwheel cranes and countless scaffolds, this incomplete edifice of rough stone prepares to one day host a holy seat."
 building_type_POD_dazbog_great_project_cathedral_01: "$building_POD_dazbog_great_project_cathedral_01$"
 building_POD_dazbog_great_project_cathedral_01: "Romanesque Grand Cathedral"
 building_POD_dazbog_great_project_cathedral_01_desc: "An early standing cathedral, seat of a bishop and a beacon for Christian pilgrims. Beneath heavy rounded arches and stately vaults, sacred relics and altars await the faithful."
 building_type_POD_dazbog_great_project_cathedral_02: "$building_POD_dazbog_great_project_cathedral_02$"
 building_POD_dazbog_great_project_cathedral_02: "Gothic Grand Cathedral"
 building_POD_dazbog_great_project_cathedral_02_desc: "Built on the legacy of the already imposing [GetBuilding('POD_dazbog_great_project_cathedral_01').GetName], soaring vaults and traceried windows lift the eye to the highs of heaven. Stone lacework and pointed arches crown a roof reborn in the sensibilities of a new age."
 building_type_POD_dazbog_great_project_cathedral_03: "$building_POD_dazbog_great_project_cathedral_03$"
 building_POD_dazbog_great_project_cathedral_03: "Flamboyant Grand Cathedral"
 building_POD_dazbog_great_project_cathedral_03_desc: "Built upon the already resplendent [GetBuilding('POD_dazbog_great_project_cathedral_02').GetName], flame-like tracery and curling stone crown this cathedral as a great church of Christendom."




 great_project_type_POD_dazbog_mass_conversion: "Mass Conversion"
 great_project_type_POD_dazbog_mass_conversion_desc: "With sufficient resources, we can bring the light of the Lord not simply to individual heathens but to entire pagan [realms|E]. Through our tutelage, they will learn the most righteous faith, and in turn grow [christendom|E]."
 great_project_type_POD_dazbog_mass_conversion_effect_desc: "[counties|E] within the target [duchy|E] of that are not [GetPlayer.GetFaith.GetAdjective] will change to [GetFaithByKey('warriors_dazbog').GetName]"
