 great_project_type_POD_dazbog_construct_cathedral: "Sponsor the Raising of a Grand Cathedral"
 great_project_type_POD_dazbog_construct_cathedral_desc: "Set the gleaming cross atop firm stone walls, stately domes, and high towers! Let each stand as a reminder of the Ultimate Gift: His suffering for our salvation! Bring the wondrous light of Heaven to Earth!\n\nAfter years of noble toil, a great beacon will shine out to worshipers near and far, all through your sponsorship. While it may be some time before we can draw benefits from them, it is our heavenly duty to construct such a beacon of light."
 POD_valid_dazbog_cathedral_spot_in_sub_realm_tt: "A [barony|E] in your [realm|E] does not have a [GetBuilding('POD_dazbog_great_project_cathedral_01').GetName|V] already"
 POD_no_under_construction_or_same_level_great_project_dazbog_cathedral_building_tt: "There is no [GetBuilding('POD_dazbog_great_project_cathedral_under_construction_01').GetName|V] or [GetBuilding('POD_dazbog_great_project_cathedral_01').GetName|V] [building|E] already constructed in the selected [barony|E]"
 POD_dazbog_construct_cathedral_no_special_building_tt: "There is no [special_building|E] already present in the selected [barony|E]"
 POD_dazbog_cathedral_under_construction_building_tt: "An [GetBuilding('POD_dazbog_great_project_cathedral_under_construction_01').GetName|V] [building|E] is constructed in the selected [barony|E]"
 POD_dazbog_cathedral_or_upgraded_special_building_tt: "A [GetBuilding('POD_dazbog_great_project_cathedral_01').GetName|V] [building|E] is constructed in the selected [barony|E]"
 cathedral_frescoes_title_tt: "Cathedral Frescoes Evoke Wonder"
 cathedral_stained_glass_title_tt: "Cathedral Stained Glass Windows Enthrall"
