l_english: 
 great_project_type_found_hunter_cell: "Found a Cell"
 great_project_type_found_hunter_cell_desc: "Both hunters and hunted, those few mortals that stand against the supernaturals are at constant risk. Even when they have joined one of the larger organizations or brotherhoods, most choose to operate on their own. However, with proper funding and protection, locals could be recruited and given enough time to establish a proper cell within the region. Such a cell would aid your efforts to prevent encroachment by supernatural monsters and act as a thorn in the foot of those monsters should you lose control of the region.\n\n#help After establishing a cell, you will be unable to expand it in the future.#!"
 great_project_type_found_hunter_cell_possessive: "Found a Cell'"
 found_hunter_cell_effect_desc: "Improves the [counties|E] within the target [duchy|E] with [GetModifier('found_hunter_cell_positive_tier_1').GetNameWithTooltip] or better, depending on the number of contributions"
 found_hunter_cell_requirement_capital_description: "Is capital of the target [duchy|E]"
 found_hunter_cell_requirement_cell_description: "Does not have a Hunter Cell county modifier"
 great_project_type_found_hunter_cell_contribution_safehouse: "Establish a Safehouse"
 great_project_type_found_hunter_cell_contribution_sanctify: "Sanctify the Site"
 great_project_type_found_hunter_cell_contribution_informants: "Cultivate Informants"
 great_project_type_found_hunter_cell_contribution_armory: "Stock the Armory"
 great_project_type_found_hunter_cell_contribution_allies: "Secure Local Allies"
 great_project_type_found_hunter_cell_contribution_frontier: "Fortify the Frontier"
 found_hunter_cell_positive_tier_1: "Tiny Hunter Cell"
 found_hunter_cell_positive_tier_1_desc: "A tiny cell of hunters has been established in this county, helping to keep out the supernaturals seeking to prey upon the locals.\n\n#help Should you lose this [county|E], this modifier will be replaced by a temporary negative modifier.#!"
 found_hunter_cell_negative_tier_1: "Tiny Hunter Cell"
 found_hunter_cell_negative_tier_1_desc: "A tiny cell of hunters has been established in this county, interfering with your efforts."
