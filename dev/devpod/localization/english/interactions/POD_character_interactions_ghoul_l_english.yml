l_english:

 POD_ghoul: "Manipulate [ghoul|E]"
 POD_manipulate_bound_ghouls: "Manipulate [ghoul|E]"
 recipient_secondary_POD_manipulate_bound_ghouls: "[ghoul|E] Thrall"
 POD_manipulate_bound_ghouls_desc: "Choose what to do with your [ghoul|E] thralls."
 POD_manipulate_bound_ghouls_heal_option: "Heal Thrall"
 POD_manipulate_bound_ghouls_goldreward_option: "Reward Thrall"
 POD_manipulate_bound_ghouls_demandgold_option: "Demand Gold"
 POD_manipulate_bound_ghouls_giveblood_option: "Give Blood"
 POD_manipulate_bound_ghouls_traindiscipline_option: "Train $pod_discipline$"
 POD_manipulate_bound_ghouls_transmogrify_option: "Transmogrify"
 POD_manipulate_bound_ghouls_transmogrify_option.tt: "Using vicissitude to transmogrify a [ghoul|E] may rouse hunger, strain your will and risk masquerade exposure."
 POD_manipulate_bound_ghouls_divorce_option: "Demand Divorce"
 POD_manipulate_bound_ghouls_release_option: "Release Thrall"
 
 POD_ghoulify_mortal_interaction_limit: "[ghoul|E] thrall amount is capped! (3 plus any bonuses from other sources)"
 POD_ghoulify_mortal_interaction_bp_one: "Vampires must have a blood potency of at least one to create a [ghoul|E]."
 POD_ghoulify_mortal_interaction: "Ghoulify #weak (Scheme)#!"
 POD_ghoulify_mortal_interaction_desc: "Plot to transform this mortal into a [ghoul|E] thrall, a loyal retainer.\nTake notice that ghouls have drastically reduced resonance and make for poor [POD_herd|E] members."
 POD_ghoul_ghoulify_interaction: "Bestow the Gift of Vitae #weak (Scheme)#!"
 POD_ghoul_ghoulify_interaction_desc: "Offer this person vitae drained from a prisoner of [recipient.GetHerHis] choosing."
 I_have_no_bloodbag: "No vampire in the dungeon to drain of blood."
 recipient_secondary_POD_ghoul_ghoulify_interaction: "\n \n \n Use this prisoner as a source of vitae."

 POD_ghoul_ghoulify_prisoner_interaction: "Bestow the Gift of Vitae to Prisoner"
 POD_ghoul_ghoulify_prisoner_interaction_desc: "Forcibly make [recipient.GetFirstName] a ghoul."
 POD_ghoul_ghoulify_prisoner_interaction.tt: "[recipient.GetFirstName] becomes a ghoul."
 recipient_secondary_POD_ghoul_ghoulify_prisoner_interaction: "Prisoner"
 
 POD_beg_for_vitae_interaction: "Beg for power of Vitae"
 POD_beg_for_vitae_interaction_desc: "Beg [recipient.GetName] to make you into their [ghoul|E]. Requirements for this interaction to succeed is based on Vampire's generation"
 POD_beg_for_vitae_interaction_needed_total_skills: "Sum of your all [skills|E] excluding [prowess|E] must exceed [SCOPE.GetValue('needed_total_skills')|0V]"

 POD_consume_vitae_of_prisoner_interaction: "Consume Vitae of Prisoner"
 POD_consume_vitae_of_prisoner_interaction_desc: "Drink from [recipient.GetName] to gain Vitae. Remember that drinking from vampire always produces a blood bond!"

 POD_runaway_from_blood_bond_interaction: "Runaway from the Blood Bond"
 POD_runaway_from_blood_bond_interaction_desc: "Clarity has returned, and you can see the state your 'master' has brought you to. You have to run."

 POD_ghoul_mission_cover_masquerade_interaction: "$POD_cover_masquerade_interaction$"
 POD_ghoul_mission_cover_masquerade_interaction_desc: "Veil any mistakes or proof of [recipient.GetNamePossessive] vampiric nature by utilizing your [Glossary('Disciplines','game_concept_discipline_desc')], resources or skills."
 POD_ghoul_mission_cover_masquerade_interaction_cap: "You can't reduce [recipient.GetNamePossessive] [masquerade_exposure_with_icon|E] any further"

 POD_ghoul_mission_bribe_officials_interaction: "Bribe Officials"
 POD_ghoul_mission_bribe_officials_interaction_desc: "Spend some [gold|E] to decrease [tyranny|E] and increase [legitimacy|E] of [recipient.GetName]."

 POD_ghoul_mission_indoctrinate_plant_interaction: "Indoctrinate a Contact"
 POD_ghoul_mission_indoctrinate_plant_interaction_desc: "Indoctrinate [recipient.GetName] and send them to your master's lair."

 POD_ghoul_mission_send_desirable_mortal_interaction: "Send Desirable Mortal"
 POD_ghoul_mission_send_desirable_mortal_interaction_desc: "Send [recipient.GetName] to your master's lair."

 POD_ghoul_mission_damage_rivals_image_interaction: "Damage Rival's Image"
 POD_ghoul_mission_damage_rivals_image_interaction_desc: "Sacrifice your image to bring [recipient.GetName] even lower."

 POD_ghoul_mission_slander_rival_interaction: "Slander Rival"
 POD_ghoul_mission_slander_rival_interaction_desc: "Sacrifice your piety to bring [recipient.GetName] even lower."

 POD_ghoul_mission_give_relative_away_interaction: "Give away Relative"
 POD_ghoul_mission_give_relative_away_interaction_desc: "Send [recipient.GetName] to your master, knowing you will never see them again."

 POD_help_bound_ghoul_interaction: "Help Bound Ghoul"
 POD_help_bound_ghoul_interaction_desc: "Help a fellow [ghoul|E] in becoming free from their domitor, no matter if they want it or not"

 POD_request_mission_from_domitor_interaction: "Request a Mission"
 POD_request_mission_from_domitor_interaction_desc: "I completed the [bound_ghoul_mission|E] issued by my master, and I am growing restless from not having a new one."
 POD_request_mission_from_domitor_interaction_current_mission: "You already have a [bound_ghoul_mission|E]! #weak ([GetPlayer.Custom('PODCurrentGhoulMission')])#!"
 POD_request_mission_from_domitor_interaction_effect: "You will gain a random [bound_ghoul_mission|E], doing it will remove the 'free' period!"