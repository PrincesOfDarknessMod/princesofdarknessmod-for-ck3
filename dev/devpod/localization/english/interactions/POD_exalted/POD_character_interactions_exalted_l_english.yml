l_english:
 POD_manipulate_passive_charms_interaction: "Manipulate Passive Charms"
 POD_manipulate_passive_charms_interaction_desc: "Open a menu to manipulate [exalted_passive_charms|E]."

 POD_discard_dragon_touched_interaction: "Send Dragon-Touched to a Nest"
 POD_discard_dragon_touched_interaction_desc: "Send your [child|E] to Dragon Nest under your control for them to help manage it."
 POD_discard_dragon_touched_interaction_req: "You must own a Dragon Nest"
 POD_discard_dragon_touched_interaction_stimulate_dragon_nest: "Stimulate Dragon Nest"
 POD_discard_dragon_touched_interaction_expand_dragon_nest: "Expand Dragon Nest"
 POD_discard_dragon_touched_interaction_stabilize_dragon_nest: "Stabilize Dragon Nest"
 POD_discard_dragon_touched_interaction_tt: "[recipient.GetFirstName] will be sent off to [target.GetName] to help manage it in direction you chosen. #weak this does remove them from your dynasty, and kills them.#!"
 MODIFIER_DEFINITION_DISCARDED_DRAGON_TOUCHED: "Per [GetTrait('dragon_touched').GetName(GetNullCharacter)] sent"

 POD_request_dragon_nest_access_interaction: "Request Dragon Nest Access"
 POD_request_dragon_nest_access_interaction_desc: "You are landless, as such you do not have a stable dragon nest in which your children can stay nor a place to easily recover your Essence. But you always could ask your patron for access to theirs"
 POD_request_dragon_nest_access_interaction_same_location: "You must be in the same location as the Dragon Nest you selected! ([target.GetName])"
 POD_request_dragon_nest_access_interaction_effect: "You will gain benefits as if you owned [target.GetName] Dragon Nest."
 POD_request_dragon_nest_access_interaction_already_have: "You already have a Dragon Nest Access! ([GetPlayer.MakeScope.GetVariable('POD_landless_dragon_nest').Province.GetName])"
 POD_request_dragon_nest_access_interaction_warning: "#X @warning_icon!As soon you move out of the province with Dragon Nest, or it's owner has changed. #bold These benefits will disappear.#!#!"

 POD_exalted_essence_training_interaction: "Essence Training"
 POD_exalted_essence_training_interaction_desc: "Start long [journey|E] to help [recipient.GetName] expand and stabilize their inner spark of divinity."
 POD_exalted_essence_training_interaction_rating: "You must have higher [essence_rating|E] than [recipient.GetName] #weak ([GetPlayer.MakeScope.ScriptValue('POD_exalted_rating')] vs [recipient.MakeScope.ScriptValue('POD_exalted_rating')])#!"
 POD_exalted_essence_training_interaction_close: "[recipient.GetName] must be either your [courtier|E], [vassal|E] or [child|E]."
 POD_exalted_essence_training_interaction_effect: "You will start a [journey|E] to increase [recipient.GetNamePossessive] [essence_rating|E]"

 POD_demesne_activation_interaction: "Demesne Activation"
 POD_demesne_activation_interaction_desc: "Activate or Deactivate your Demesne."