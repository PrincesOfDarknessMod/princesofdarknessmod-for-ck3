 POD_fae_interactions.610.t: "Forge Personality"
 POD_fae_interactions.610.desc: "Recently become a fae, your new sucessor missed a lot of waking world life experience. As parent, you should teach your sucessor how to truly look into the world, and you recently found a opportunity to do just that."
 POD_fae_interactions.610.skip: "Maybe next time"
 POD_fae_interactions.611.a: "Be bold, even in trouble."
 POD_fae_interactions.611.b: "Be careful if trouble arises."
 POD_fae_interactions.612.a: "You have time."
 POD_fae_interactions.612.b: "Show your wrath."
 POD_fae_interactions.613.a: "Loyal to your consort."
 POD_fae_interactions.613.b: "Love is for all."
 POD_fae_interactions.614.a: "You are ok."
 POD_fae_interactions.614.b: "Go for more."
 POD_fae_interactions.615.a: "You have a cause."
 POD_fae_interactions.615.b: "Time is on our side."
 POD_fae_interactions.616.a: "There always is another way."
 POD_fae_interactions.616.b: "Stay as your are."
 POD_fae_interactions.617.a: "Revenge is eternal."
 POD_fae_interactions.617.b: "Hatred is not the point."
 POD_fae_interactions.618.a: "Gold is not the concern."
 POD_fae_interactions.618.b: "Nothing is possible without money."
 POD_fae_interactions.619.a: "You can trust people."
 POD_fae_interactions.619.b: "You can't trust no one."
 POD_fae_interactions.620.a: "Be honest."
 POD_fae_interactions.620.b: "A little lie doesn't hurt."
 POD_fae_interactions.621.a: "You are just one among many."
 POD_fae_interactions.621.b: "You are excellent."
 POD_fae_interactions.622.a: "Law above all."
 POD_fae_interactions.622.b: "You above all."
 POD_fae_interactions.623.a: "Give it time."
 POD_fae_interactions.623.b: "Time doesn't wait."
 POD_fae_interactions.624.a: "Pleasures are a distraction."
 POD_fae_interactions.624.b: "Enjoy your life."
 POD_fae_interactions.625.a: "Trust is the key."
 POD_fae_interactions.625.b: "Betray the world before it betrays you."
 POD_fae_interactions.626.a: "Loyal to your path."
 POD_fae_interactions.626.b: "Your path is not so important."
 POD_fae_interactions.627.a: "Be nice."
 POD_fae_interactions.627.b: "Think of yourself first."
 POD_fae_interactions.627.c: "Share your pain to the world."
 
