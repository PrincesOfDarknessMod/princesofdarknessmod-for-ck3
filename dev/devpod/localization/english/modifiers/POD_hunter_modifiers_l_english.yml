 POD_heroes_of_the_people_modifier: "Heroes of the People"
 POD_heroes_of_the_people_modifier_desc: "Each and every warrior in your jagun bears the title of baghatur; even the least of them is a hero among his people.\n\n#V Gain an increased chance to wound enemy [knights|E] during a [combat_phase|E] as a [knight|E]#!"
