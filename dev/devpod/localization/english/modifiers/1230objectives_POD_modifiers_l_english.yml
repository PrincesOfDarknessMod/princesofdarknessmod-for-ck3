 #Flavor Decisions for clans#
 #############################
 
 ventrue_landed_house_modifier: "Ephorate Influence"
 ventrue_landed_house_modifier_desc: "#P Members of this House are more skilled at the Strategoi, Tribunes and Lictor Court Positions.\nSaid Court Positions are available to any landed Ventrue of this House.#!\n\n An united house of rulers, influential enough to call upon the Ephorate only by the merits of their lineage name."
 
 brujah_seneca_modifier: "Seneca's Truth"
 brujah_seneca_modifier_desc: "Unjust Dominion cannot be eternal, but beware lest you become the very thing you swore to fight."
 
 brujah_rebuilder_modifier: "The Idea of Carthage"
 brujah_rebuilder_modifier_desc: "An ideal that will never truly die, ready to adapt to the changing times, as turbulent as they are."
 
 brujah_perfect_modifier: "An Olympic Ideal"
 brujah_perfect_modifier_desc: "#P As the end of a Panegyra you hosted, you will gain 200 xp in a random lifestyle.#!\n\nEternally improving every night, the very feeling of growth a joy."
 
 assamite_vizier_paragon_modifier: "The Vizier"
 assamite_vizier_paragon_modifier_desc: "#P If you have the Wandering Nobles DLC, you get access to the Local Arbitration decision regardless of perks. Its cost is also divided by two. #! \n\nYou Every disagreement can be settled without violence. But you have the power of an entire clan to back up your threats if need be."
 
 assamite_sorcerer_paragon_modifier: "The Amr"
 assamite_sorcerer_paragon_modifier_desc: "#P Increase [bloodsorcery|E] [bs_ritual|E] speed by 10%.#!.\n\nEvery spell, every ritual that vitae can be turned to is yours... or will be."
 
 assamite_warrior_paragon_modifier: "The Caliph"
 assamite_warrior_paragon_modifier_desc: "#P You will get improved rewards for successfully completing Web of Knives events.#! \n\nHaqim sword will not flinch or hesitate in the pursuit of justice."
 
 vizier_house: "House of Viziers"
 vizier_house_desc: "This house has chosen the path of the vizier."
 
 warrior_house: "House of Warriors"
 warrior_house_desc: "This house has chosen the path of the warrior."
 
 sorcerer_house: "House of Sorcerers"
 sorcerer_house_desc: "This house has chosen the path of the sorcerer."
 
 assamite_crusade_modifier: "Last Crusade"
 assamite_crusade_modifier_desc: "With the vampiric backers of the Crusades now dealt with, we have proven that daring to encroach on our homeland is akin to a swift death."

 nosferatu_shadows_modifier: "A Strong Shield"
 nosferatu_shadows_modifier_desc: "Harmless, useful and out of the way. Everyone wants the Nosferatu to survive."
 
 nosferatu_resist_modifier: "Endless Resistance"
 nosferatu_resist_modifier_desc: "One brave Nosferatu proved that it is within all of us to resist against those that seek to exterminate us."
 
 nosferatu_abismillard_wrath_modifier: "Absimilliard's Wrath"
 nosferatu_abismillard_wrath_modifier_desc: "You have caught the eye of the Founder. The hunt is on."
 
 nosferatu_true_head: "Absimilliard's Bane"
 nosferatu_true_head_desc: "Twice you challenged, twice you won, you have devoured your founder and stand as the greatest Nosferatu, the one who saved the Clan."
 
 gangrel_animal_ruler_modifier: "Master of Animalism"
 gangrel_animal_ruler_modifier_desc: "You have never far from a source of sustenance, knowledge or an ally for battle."
 
 city_hunter_modifier: "City Hunters"
 city_hunter_modifier_desc: "We Have found a new place to hunt, filled to the brim with delicious vitae"
 
 ravnos_travel_modifier: "A Contact in Every Town"
 ravnos_travel_modifier_desc: "#red Increase the planning speed of the Seek Knowledge Journey.#! \n\nSuch a traveled individual knows where to find what they need. Or at least someone who knows where to start the trail."
 
 rakasha_wisdom: "Rakshasa of Rakshasa's Return"
 rakasha_wisdom_desc: "The Rakshasa of Rakshasa has returned to Clan Ravnos in its time of need."
 
 fragments_of_hazimel: "Fragments of Hazimel"
 fragments_of_hazimel_desc: "In this brief moment, you saw everything. While it was too much to bear, some of it still lingers."
 
 #ravnos_devoured_devil: "Devoured Devil"
 #ravnos_devoured_devil_desc: "You devoured the Devil of Clan Ravnos, and feasted well on his power"
 
 lasombra_waves_modifier: "Blood on the Water"
 lasombra_waves_modifier_desc: "#red Allows [raiding|E] over seas. #!\n\nThe sea called and you answered. You will bring many unfortunate souls to a deeper communion with the sunless depths below."
 
 lasombra_faith_modifier: "Rome's Shadow"
 lasombra_faith_modifier_desc: "#red Unlocks the witch hunter men-at-arms. #!\n\nComplete control over Rome is out of a Cainite's grasp. Efficient control isn't out of yours however."
 
 lasombra_muslim_modifier: "Mecca's Shadow"
 lasombra_muslim_modifier_desc: "Every Hadith twisted to your benefit, every Imam denouncing your enemies \nunlocks the witch hunter men-at-arms"
 
 lasombra_insecure_modifer: "Worthy Shadow Monarch"
 lasombra_insecure_modifer_desc: "You were given a chance to prove you are worthy. You succeeded."
 
 vengeful_angels_modifier: "Bloody Angels"
 vengeful_angels_modifier_desc: "Soaked in blood, the Salubri won the war but lost their souls."
 
 saulot_devil_modifier: "Devil's Heirs"
 saulot_devil_modifier_desc: "The salubri are the children of the demon emperor and they have embraced this legacy wholeheartedly"
 
 saulot_hero_modifier: "Saviour's Followers"
 saulot_hero_modifier_desc: "Saulot sacrificed everything so vampires could reach golconda and be saved from our torment, he was a true hero"
 
 #cappadocian_librarian_modifier: "Master of the forbidden knowledge"
 #cappadocian_librarian_modifier_desc: "Every fragment of knowledge the kindred have ever found is yours, now you only need to find what you need \nIncrease sargon journey speed by 1\nIncrease artifact heist journey speed by 0.5"
 
 cappadocian_army_modifier: "Wraith Army Commander"
 cappadocian_army_modifier_desc: "The dead amrch under your command, untiring, unstoppable"
 
 tremere_sorcery_selfish_modifier: "Master of Blood sorcery"
 tremere_sorcery_selfish_modifier_desc: "You are the sole, uncontested master of blood sorcery among vampirekind"
 
 tremere_sorcery_selfless_modifier: "Masters of blood sorcery"
 tremere_sorcery_selfless_modifier_desc: "All hail Clan Tremere the true masters of blood sorcery"
 
 tremere_usurpers_modifier: "Usurpers"
 tremere_usurpers_modifier_desc: "unworthy sorcerers who dare to claim themselves Cainites, no true vamprei will ever respect a tremere"
 
 tremere_usurpers2_modifier: "Usurpers No Longer"
 tremere_usurpers2_modifier_desc: "Now respected bny all Clan tremere has carved out a place in the night for themselves"
 
 malkavian_prophets_modifier: "Prophets again"
 malkavian_prophets_modifier_desc: "are/willbe/havebeen/areagain what a beautiful light if only it wasn't a fool to destroy the shadow"

 custom_mummy_dynasty_secured_future_modifier: "Established Fifth Dynasty"

 coronati_plague_bride_modifier: "Blessing of the Bride"
 coronati_plague_bride_modifier_desc: "She comforts us in our time of need, as she did for the Founder himself long ago."
 coronati_nissiku_modifier: "Plots of the Clever Prince"
 coronati_nissiku_modifier_desc: "The fool-eater helps those that help themselves. And challenge them to survive in the process."
 
 # Hunter Alliance Legacies Refactor
 dynasty_hunter_alliances_inquisition_modifier: "Support from the Shadow Inquisition"
 dynasty_hunter_alliances_inquisition_modifier_desc: "#flavor The most powerful hunter order is without a doubt the Shadow Inquisition. You want them on your side... or at least not interfering. #!\nYou can now invite a member of this organization with the '$contact_fellow_hunters_decision$' [decision|E].\n$countermeasures_unlocks_t1_all_seeing_eye$"
 dynasty_hunter_alliances_ikhwan_modifier: "Support from the Ikhwan Al-Safa"
 dynasty_hunter_alliances_ikhwan_modifier_desc: "#flavor While lacking a formal organization, the Ikhwan are without compare when it comes to hunting monsters in their turf. An expertise you can learn from. #!\nYou can now invite a member of this organization with the '$contact_fellow_hunters_decision$' [decision|E]. \nYou can now ask for special mentoring in Sorcery with the '$contact_fellow_hunters_decision$' [decision|E]."
 dynasty_hunter_alliances_judges_modifier: "Support from the Judges"
 dynasty_hunter_alliances_judges_modifier_desc: "#flavor The knowledgeable Judges would bring a wealth of experience and mystical lore to your fight if they were to become your allies #!\nYou can now invite a member of this organization with the '$contact_fellow_hunters_decision$' [decision|E]. \nYou can now ask for special mentoring in Theurgy with the '$contact_fellow_hunters_decision$' [decision|E]."
 dynasty_hunter_alliances_akritai_modifier: "Support from the Akritai"
 dynasty_hunter_alliances_akritai_modifier_desc: "#flavor The defenders of Eastern Christianity are inheritors of the complex Byzantine legal and bureaucratic system. A useful skill to have for a burgeoning hunter order. #!\nYou can now invite a member of this organization with the '$contact_fellow_hunters_decision$' [decision|E]. "
 dynasty_hunter_alliances_qorjin_modifier: "Support from Qorjin's Baghatur"
 dynasty_hunter_alliances_qorjin_modifier_desc: "#flavor The Mongol hunters have strange allies... but their brute strength makes it easy to turn a blind eye. #!\nYou can now invite a member of this organization with the '$contact_fellow_hunters_decision$' [decision|E]. \nCan recruit [GetMaA('battlescarred_fera').GetName] as [men_at_arms|E]."
