 exquisite_poison_modifier: "The Exquisite Poison"
 exquisite_poison_modifier_desc: "The decadent rot at the core of empires can be so enticing."
 
 muses_modifier: "The Muses"
 muses_modifier_desc: "Our very presence inspires art and worship."
 
 grand_patrons_modifier: "The Grand Patrons"
