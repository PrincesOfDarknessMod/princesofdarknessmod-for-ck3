 dark_petal: "The Dark Petal"
 dark_petal_desc: "Her essence carries the suffocating scent of dead flowers."

 ######################################################
 # Mary the Black — Character Modifiers
 ######################################################

 # Fragmented Self — base modifier and four tablet-tier variants. CK3
 # modifiers can't be runtime-scaled, so each tier is a separate modifier
 # swapped on tablet recovery.
 mary_fragmented_self_modifier: "Fragmented Self"
 mary_fragmented_self_modifier_desc: "She was not reborn whole. Her mind was scattered with the tablets of Ebla, and what returned did so in pieces."
 mary_fragmented_self_modifier_t1: "Fragmented Self — One Tablet Recovered"
 mary_fragmented_self_modifier_t1_desc: "A single piece of the puzzle recovered. The foggy memories are getting clearer."
 mary_fragmented_self_modifier_t2: "Fragmented Self — Two Tablets Recovered"
 mary_fragmented_self_modifier_t2_desc: "Two pieces of herself are finally where they belong but the final shard, the Summoning, remains beyond her reach."

 mary_most_hated_modifier: "One of the Most Hated Kindred in Europe"
 mary_most_hated_modifier_desc: "Your name is reviled from Acre to London for your part in the destruction of the Dream. This will not go unavenged."

 mary_tanith_protection_modifier: "Tanith's Protection"
 mary_tanith_protection_modifier_desc: "Tanith recognizes your talents. Make sure to not let her down."

 mary_tanith_legacy_modifier: "Tanith's Legacy"
 mary_tanith_legacy_modifier_desc: "Tanith's protection now extends farther than just her court. The House of Moloch recognizes you."

 mary_tanith_protection_lapsed_landless.toast: "Tanith cannot, or will not, protect you any longer. Her name will do you no good on the road, after all. The hunters are waiting."

 mary_tanith_commission_diyarbakr_modifier: "Tanith's Commission: A Rival in the Dark"
 mary_tanith_commission_diyarbakr_modifier_desc: "Tanith has given you orders concerning the Order of Azaneal. A county in [GetTitleByKey('d_diyarbakr').GetNameNoTier] or [GetTitleByKey('d_diyarrabia').GetNameNoTier] must be taken. Prove to her you're worth keeping around."

 mary_tanith_commission_cyprus_modifier: "Tanith's Commission: The Pious Threat"
 mary_tanith_commission_cyprus_modifier_desc: "Tanith has set you against the Knights of Acre in Cyprus. The Duchy of [GetTitleByKey('d_cyprus').GetNameNoTier] must fall before the hunters can grow in power."

 # Vampire-only-start variant of the Cyprus commission. Active when Cyprus
 # is held by Nehemiah (Brujah) and Shutatara has fled to his court.
 mary_tanith_commission_cyprus_brujah_modifier: "Tanith's Commission: The Daughter's Refuge"
 mary_tanith_commission_cyprus_brujah_modifier_desc: "Shutatara, Tanith's traitor childe, has fled to the court of the Brujah Nehemiah, Prince of Cyprus. The Duchy of [GetTitleByKey('d_cyprus').GetNameNoTier] must change hands before the daughter begins to like it there."

 mary_tanith_commission_olives_modifier: "Tanith's Commission: A Diet of Olives"
 mary_tanith_commission_olives_modifier_desc: "Tanith has set you against the Diet of Olives. A county in [GetTitleByKey('d_antioch').GetNameNoTier] or [GetTitleByKey('d_lebanon').GetNameNoTier] must be taken before they grow too strong."

 # Anoster pact summary shown in podintroductions.380's event description
 POD_maryb_starting_pacts.tt: "Two pacts to the demon Anoster fall due every eight years: one of blood and one of pain."

 mary_black_dream_modifier: "The Black Dream"
 mary_black_dream_modifier_desc: "Mary has claimed the Dream for herself. What was once meant to be utopia has become a place of hellish suffering."

 mary_second_dream_modifier: "The Second Dream"
 mary_second_dream_modifier_desc: "#shinygold Michael rises again, reborn from the ashes. The Dream lives on, albeit stranger than before.#!"

 mary_ash_and_gold_modifier: "Ash and Gold"
 mary_ash_and_gold_modifier_desc: "Neither Mary nor Michael are fully dominant. Something odd has come into existence due to their passionate, mixed feelings. Control changes between the pair constantly with no real rhyme or reason."

 # Oscillating ascendancy modifiers. Exactly one is present at any time; the
 # yearly pulse re-rolls every few years (POD_maryb_ash_gold_reroll_effect).
 mary_ash_and_gold_michael_modifier: "Ash and Gold: Michael Surfaces"
 mary_ash_and_gold_michael_modifier_desc: "#shinygold For now, beloved, my hand is the one that guides. Let them bask in my warmth for a while.#! The radiant half is in control. For now."
 mary_ash_and_gold_mary_modifier: "Ash and Gold: Mary Surfaces"
 mary_ash_and_gold_mary_modifier_desc: "She has resurfaced this time, proving once more why everyone was right to fear her. The predatory half is in control. For now."

 # Toasts fired by POD_maryb_ash_gold_reroll_effect when the ascendant half flips.
 mary_ash_gold_michael_surfaces.toast: "#shinygold Michael rises nearer the surface. The luminous half of the Dream is in control now.#!"
 mary_ash_gold_mary_surfaces.toast: "Mary rises nearer the surface. The dark half of the Dream is in control now."

 # The Fall — applied to whoever is seated as the Pillar of Gold. The
 # corruption tell beneath an untouched faith.
 maryb_trinity_the_fall_modifier: "The Fall"
 maryb_trinity_the_fall_modifier_desc: "#shinygold The hopeless come to me with so many desires and requests. I won't let them leave as they arrived.#! Something is wrong beneath the surface, though neither can tell why."

