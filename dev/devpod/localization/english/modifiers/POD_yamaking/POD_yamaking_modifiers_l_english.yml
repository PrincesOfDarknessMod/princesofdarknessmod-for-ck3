l_english:
 POD_yamaking_outside_middle_kingdom_modifier: "Beyond the Barrier"
 POD_yamaking_outside_middle_kingdom_modifier_desc: "[Glossary('Yama Kings','podgloss.yamaking')] cannot interact with beings beyond the Middle Kingdom, causing major problems with holding any control in these territories."

 contested_yomi_highly_modifier: "Highly Contested Yomi"
 contested_yomi_highly_modifier_desc: "The Emperor of the Yellow Springs [GetScriptedCharacterByHistoryID('POD_wraith_03').GetFirstName] is a dogged for of all [Glossary('Yama Kings','podgloss.yamaking')] as their realms are technically encrochaing on his domain.\nOnly the mightiest Yama Kings are free of his constant interference."
 contested_yomi_modifier: "Contested Yomi"
 contested_yomi_modifier_desc: "You are slowly consolidating your position in Yomi, even though rivals [Glossary('Yama Kings','podgloss.yamaking')] and the Yellow Emperor are still trying to oust you."
 contested_yomi_slightly_modifier: "Slightly Contested Yomi"
 contested_yomi_slightly_modifier_desc: "Besides small skirmishes with the forces of the Yellow Emperor [GetScriptedCharacterByHistoryID('POD_wraith_03').GetFirstName], your territory is now accepted as a solidified part of the Thousand Hells."
 contested_yomi_safe_modifier: "Safe Yomi"
 contested_yomi_safe_modifier_desc: "You are now on par with the mightiest [Glossary('Yama Kings','podgloss.yamaking')]. While many would love to breach your domain, none would dare try."

