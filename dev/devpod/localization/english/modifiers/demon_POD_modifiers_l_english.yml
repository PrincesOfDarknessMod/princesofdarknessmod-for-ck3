 arsenal_of_the_beast_claws_modifier:0 "Claws"
 arsenal_of_the_beast_claws_modifier_desc:0 "The character’s fingernails extend like the curved talons of a raptor or the retractable claws of a cat."
 arsenal_of_the_beast_fangs_modifier:0 "Fangs"
 arsenal_of_the_beast_fangs_modifier_desc:0 "The character’s teeth grow sharp like those of a wolf or other large predator, or perhaps they sports a raptor’s beak."
 arsenal_of_the_beast_gaping_maw_modifier:0 "Gaping Maw"
 arsenal_of_the_beast_gaping_maw_modifier_desc:0 "The character’s jaw unhinges or simply distends impossibly wide, presenting row upon row of glistening fangs."
 arsenal_of_the_beast_horns_modifier:0 "Horns"
 arsenal_of_the_beast_horns_modifier_desc:0 "The character sprouts archetypal goat horns, antlers like a stag, unnatural bone spurs protruding from the skull or some other growth that enables goring attacks."
 arsenal_of_the_beast_lashing_tail_modifier:0 "Lashing Tail"
 arsenal_of_the_beast_lashing_tail_modifier_desc:0 "The character sports a powerful muscular tail."
 arsenal_of_the_beast_poison_modifier:0 "Poison"
 arsenal_of_the_beast_poison_modifier_desc:0 "The character’s body produces a deadly venom."
 arsenal_of_the_beast_venom_spit_modifier:0 "Venom Spit"
 arsenal_of_the_beast_venom_spit_modifier_desc:0 "The character has a venom gland in his throat that allows them to spray poison."
 arsenal_of_the_beast_spines_modifier:0 "Spines"
 arsenal_of_the_beast_spines_modifier_desc:0 "Spikes of bone or quills protrude from the character’s skin."
 arsenal_of_the_beast_tentacles_modifier:0 "Tentacles"
 arsenal_of_the_beast_tentacles_modifier_desc:0 "The character has a long tentacle or prehensile tail."
 arsenal_of_the_beast_wings_modifier:0 "Wings"
 arsenal_of_the_beast_wings_modifier_desc:0 "The character grows large wings from her back, stretching a third again as long as the character is tall at full extension."
 
 possessing_a_dead_body_modifier:0 "Possessing a dead body"
 possessing_a_dead_body_modifier_desc:0 "The dead body possession's maintenance inflicts wounds instead of life-force loss modifier, but you will maintain the possession until your vessel reaches max wound level."
 
