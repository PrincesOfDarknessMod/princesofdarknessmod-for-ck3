l_english:
 # Asakku Depth Display
 POD_asakku_depth_1_modifier: "Asakku Depth: Whisper (1-9)"
 POD_asakku_depth_1_modifier_desc: "Something stirs in the blood. Faint. Patient. It has not yet found its voice."
 POD_asakku_depth_10_modifier: "Asakku Depth: Murmur (10-24)"
 POD_asakku_depth_10_modifier_desc: "The presence has a rhythm now. Not words, not yet, but a pulse that is not entirely yours."
 POD_asakku_depth_25_modifier: "Asakku Depth: Voice (25-39)"
 POD_asakku_depth_25_modifier_desc: "It speaks. Not in language, but in hunger and direction. You have stopped pretending you cannot hear it."
 POD_asakku_depth_40_modifier: "Asakku Depth: Presence (40-49)"
 POD_asakku_depth_40_modifier_desc: "The entity has weight. It has opinions. When you look in the mirror, you see two sets of intentions behind one face."
 POD_asakku_depth_50_modifier: "Asakku Depth: Communion (50-59)"
 POD_asakku_depth_50_modifier_desc: "The border between you and it grows thin. Its thoughts arrive before yours. You have begun to think of this as collaboration."
 POD_asakku_depth_60_modifier: "Asakku Depth: Entwinement (60-74)"
 POD_asakku_depth_60_modifier_desc: "You are no longer certain which thoughts originate with you. The entity's hunger feels like your own. Its patience has become yours."
 POD_asakku_depth_75_modifier: "Asakku Depth: Merger (75-89)"
 POD_asakku_depth_75_modifier_desc: "The distinction between host and passenger is academic. You are something that contains both, and the seam is disappearing."
 POD_asakku_depth_90_modifier: "Asakku Depth: Threshold (90-99)"
 POD_asakku_depth_90_modifier_desc: "Almost complete. The last membrane trembles. What emerges will not be what went in."
 POD_asakku_depth_100_modifier: "Asakku Depth: Ascended (100)"
 POD_asakku_depth_100_modifier_desc: "There is no border anymore. You are Iryi Ascendant, something older, wearing a shape that used to be entirely yours."

 # Phase Completion Rewards
 POD_asakku_phase1_reward: "The Foundation"
 POD_asakku_phase1_reward_desc: "The first seeds have taken root. Others carry the infection now, and you can feel each of them, faint pulses at the edge of awareness. The entity is pleased in a way that has nothing to do with satisfaction. It simply recognises progress."
 POD_asakku_phase3_reward: "Purge of the Western Usurpers"
 POD_asakku_phase3_reward_desc: "The western reach of the Shadow Crusade is finished. The kamuts who hunted you are gone; dead or changed. The voice in your thoughts is not satisfied. Satisfied implies an ending."
 POD_asakku_phase4_reward: "The Eastern Reckoning"
 POD_asakku_phase4_reward_desc: "The east is done. The Elioud are gone. The True Hand continues, diminished and puzzled. The Watcher has what it came for. You gave it to them. You are not certain whether you were the agent or the method."

 POD_asakku_sinister_mastery_1: "Sinister Mastery"
 POD_asakku_sinister_mastery_1_desc: "The entity's influence sharpens your instincts for Vicissitude. The choleric arts come more naturally now."
 POD_asakku_sinister_mastery_2: "Sinister Mastery (Ascended)"
 POD_asakku_sinister_mastery_2_desc: "The entity's mastery of flesh runs deeper than any discipline. Your understanding of Vicissitude transcends what any teacher could offer."
 POD_asakku_andeleon_brood: "Andeleon's Brood"
 POD_asakku_andeleon_brood_desc: "Those you have corrupted move through the world as extensions of your will. More hands, more eyes, more of you."
 POD_asakku_occultation: "Occultation"
 POD_asakku_occultation_desc: "The entity within teaches you to hide in ways that have nothing to do with shadows. You become difficult to perceive, even to those who know exactly where to look."
 POD_asakku_inner_babble: "Inner Babble"
 POD_asakku_inner_babble_desc: "The constant murmur of the entity's thoughts creates a wall of noise that hostile schemes cannot penetrate. Those who reach into your mind find not silence, but a chorus."
 POD_asakku_vicissitude_taint: "Vicissitude Taint"
 POD_asakku_vicissitude_taint_desc: "The blood has sunk into the earth itself. The land grows strange; defensive, hostile to outsiders, alive in ways that have nothing to do with nature. The entity approves of patience."
 POD_asakku_hunted: "Hunted by the Elioud"
 POD_asakku_hunted_desc: "The Elioud have marked this vampire for elimination. Their kamuts share intelligence, and future operations against this target carry additional weight."
 POD_asakku_shadow_crusade_repelled: "Shadow Crusade Repelled"
 POD_asakku_shadow_crusade_repelled_desc: "You have survived the Elioud's war. The experience has hardened your defenses against their methods."
 POD_asakku_asakku_confirmed: "Asakku Confirmed"
 POD_asakku_asakku_confirmed_desc: "Victory over a confirmed Asakku carrier has proven the threat is real. The Elioud network rallies to your cause."
 POD_asakku_defied_the_hand: "Defied the Hand"
 POD_asakku_defied_the_hand_desc: "The Tal'Mahe'Ra sent their hunters, and you turned them back. The Asakku see you as a champion. The faithful see you as something worse."
 POD_asakku_soul_infection_resistant: "Resistant to Soul Infection"
 POD_asakku_soul_infection_resistant_desc: "This vampire has resisted an attempt at Asakku infection. The experience has left them temporarily wary and difficult to re-target."
