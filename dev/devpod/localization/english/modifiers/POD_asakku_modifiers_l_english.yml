l_english:
 # Phase Completion Rewards
 POD_asakku_phase1_reward: "The Foundation"
 POD_asakku_phase1_reward_desc: "The first seeds have taken root. Others carry the infection now, and you can feel each of them, faint pulses at the edge of awareness. The entity is pleased in a way that has nothing to do with satisfaction. It simply recognizes progress."
 POD_asakku_phase3_reward: "Purge of the Western Usurpers"
 POD_asakku_phase3_reward_desc: "The western reach of the Shadow Crusade is finished. The kamuts who hunted you are gone, dead or changed. The voice in your thoughts is not satisfied. That would imply an ending."
 POD_asakku_phase4_reward: "The Eastern Reckoning"
 POD_asakku_phase4_reward_desc: "The east is done. The Elioud are gone. The True Hand continues, diminished and puzzled. The Watcher has what it came for. Victory for you or them? It might not matter at this point."

 POD_asakku_spread_wider: "Spread Wider"
 POD_asakku_spread_wider_desc: "The infection reaches further, faster. The entity's patience has given way to purpose, and the seeds you plant take root before the soil has time to object."
 POD_asakku_consolidated_network: "Consolidated Network"
 POD_asakku_consolidated_network_desc: "The brood closes ranks. Each member watches the others' approaches, and hostile operations find every avenue of attack anticipated by eyes that were not supposed to be watching."
 POD_asakku_press_advantage: "Press the Advantage"
 POD_asakku_press_advantage_desc: "The Elioud are reeling and you do not intend to let them recover. The entity drives your schemes with a sharpened urgency."

 POD_asakku_sinister_mastery_1: "Sinister Mastery"
 POD_asakku_sinister_mastery_1_desc: "The entity's influence sharpens your instincts for Vicissitude. The choleric arts come more naturally now."
 POD_asakku_sinister_mastery_2: "Sinister Mastery (Ascended)"
 POD_asakku_sinister_mastery_2_desc: "The entity's mastery of flesh runs deeper than any discipline. Your understanding of Vicissitude transcends what any teacher could offer."
 POD_asakku_andeleon_brood: "Andeleon's Brood"
 POD_asakku_andeleon_brood_desc: "Those you have corrupted move through the world as extensions of your will. More hands, more eyes, more of you."
 POD_asakku_occultation: "Occultation"
 POD_asakku_occultation_desc: "The entity within teaches you to hide in ways that have nothing to do with shadows. You become difficult to perceive, even to those who know exactly where to look."
 POD_asakku_inner_babble: "Inner Babble"
 POD_asakku_inner_babble_desc: "The constant murmur of the entity's thoughts creates a wall of noise that hostile schemes cannot penetrate. Those who reach into your mind find not silence, but a chorus. \nGrants #P Strong Mental Defenses#!."
 POD_asakku_vicissitude_taint: "Vicissitude Taint"
 POD_asakku_vicissitude_taint_desc: "The blood has sunk into the earth itself. The land grows strange, defensive, hostile to outsiders, alive in ways that have nothing to do with nature."
 POD_asakku_hunted: "Hunted by the Elioud"
 POD_asakku_hunted_desc: "The Elioud have marked this vampire for elimination. Their kamuts share intelligence, and future operations against this target carry additional weight."
