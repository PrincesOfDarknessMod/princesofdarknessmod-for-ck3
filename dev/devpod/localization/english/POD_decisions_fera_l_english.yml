l_english:
 changing_moon_decision:0 "Rite of the Changing Moon"
 changing_moon_decision_tooltip:1 "You will pass to your next auspice."
 changing_moon_decision_desc:0 "These rites mark a Gurahl's passage from one auspice to another. The subject of the rite first undergoes a ritual cleansing, including a day-long fast and a ceremonial bath. At the end of her purification, she burns an item symbolic of her old auspice (i.e., a child's toy for Arcas, or a wooden spear for Uzmati). Next she adorns herself in clothing and face paint suitable to her new auspice. Finally, she presents herself before the other participants in the rite and formally states her name and (new) auspice. The other Gurahl greet her in return, again using her name and new auspice title. A celebration usually follows the formal portion of the rite."
 changing_moon_decision_confirm:0 "Changing Moon"
 
 hengeyokai_advance_rank_decision:0 "Advance Your Beast Court Rank"
 hengeyokai_advance_rank_decision_desc:0 "Regardless of Auspice, all of the members of the Beast Courts earn three types of Renown — Glory, Virtue and Wisdom. Every member of the hengeyokai understands that all three types of Renown are facets of a greater whole.\n\nYou can gain rank experience by winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), succeeding schemes against them, doing spirit quest, or killing them (only shapeshifter count). Building caerns also work."
 hengeyokai_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 hengeyokai_advance_rank_decision_confirm:0 "My fame grows!"
 
 ajaba_advance_rank_decision:0 "Advance Your Ajaba Rank"
 ajaba_advance_rank_decision_desc:0 "Like their Bastet cousins, the Ajaba value Ferocity and Cunning; unlike the cats, the social werehyenas also hold Obligation sacred. To advance in Ferocity, an Ajaba must be both fearless and vicious; to advance in Obligation, the werehyena must put the good of his people before his own; and to advance in Cunning, he must be clever and resourceful. Advancement in rank is handled by social challenges and rites similar to those of the Garou.\n\nYou can gain rank experience by wining no practice duel, siege a capital province or grant title to follow ajaba. Building Den-Realm also work."
 ajaba_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ajaba_advance_rank_decision_confirm:0 "My fame grows!"
 
 bastet_advance_rank_decision:0 "Advance Your Bastet Rank"
 bastet_advance_rank_decision_desc:0 "Werecat Renown is based on individual respect first and foremost; the werecats are more concerned with their personal views of another Bastet than they are with what the Breed as a whole thinks of him. Bastet use Renown in the categories of Cunning, Ferocity, and Honor.\n\nYou can gain rank experience by wining no practice duel, siege a capital province, winning wars against servants of the Wyrm (or of Gaia if you are following the Wyrm) as a defender. Building caerns also work."
 bastet_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 bastet_advance_rank_decision_confirm:0 "My fame grows!"
 
 corax_advance_rank_decision:0 "Advance Your Corax Rank"
 corax_advance_rank_decision_desc:0 "Corax follow Glory, Honor and Wisdom as do the Garou, though they value Wisdom most of all.\n\nYou can gain rank experience by winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), succeeding schemes against them, or killing them (only shapeshifter count). Doing spirit quest or Building caerns also work."
 corax_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 corax_advance_rank_decision_confirm:0 "My fame grows!"
 
 gurahl_advance_rank_decision:0 "Advance Your Gurahl Rank"
 gurahl_advance_rank_decision_desc:0 "Werebears value Honor, Succor, and Wisdom.\n\nYou can gain rank experience by succeeding hostile schemes on servants of the Wyrm (or of Gaia if you are following the Wyrm), winning wars against them as a defender, doing spirit quest, acts of healing, or building caerns."
 gurahl_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 gurahl_advance_rank_decision_confirm:0 "My fame grows!"
 
 kitsune_advance_rank_decision:0 "Grow a new Tail"
 kitsune_advance_rank_decision_desc:0 "The three categories of werefox Renown are Chie, Toru, and Kagayaki, roughly corresponding to Cunning, Honor, and Glory. The Kitsune put little stock in Renown; it mostly seems useful when dealing with the other Breeds — although, the Kitsune reason, if the other Changers have been keeping track of the stuff for millennia, there must be something to it.\n\nYou can gain rank experience by siege a capital province, winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), or killing them (only shapeshifter count). Building caerns also work."
 kitsune_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 kitsune_advance_rank_decision_confirm:0 "My fame grows!"
 
 mokole_advance_rank_decision:0 "Advance Your Mokolé Rank"
 mokole_advance_rank_decision_desc:0 "Mokolé gain Renown and advance in rank in largely the same manner and categories as Garou.\n\nYou can gain rank experience by winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), succeeding schemes against them, or killing them (only shapeshifter count). Doing spirit quest or Building caerns also work."
 mokole_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 mokole_advance_rank_decision_confirm:0 "My fame grows!"
 
 nuwisha_advance_rank_decision:0 "Advance Your Nuwisha Rank"
 nuwisha_advance_rank_decision_desc:0 "Nuwisha value Humor, Glory, and Cunning. They’re not very status-conscious, as Changing Breeds go, but do appreciate having a system in place for measuring bragging rights.\n\nYou can gain rank experience by siege a capital province, winning a board game, winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm) as attacker, or killing them (only shapeshifter count)."
 nuwisha_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 nuwisha_advance_rank_decision_confirm:0 "My fame grows!"
 
 ratkin_advance_rank_decision:0 "Advance Your Ratkin Rank"
 ratkin_advance_rank_decision_desc:0 "Ratkin put stock in Infamy, Obligation, and Cunning.\n\nYou can gain rank experience by siege a capital province, purchase a truce, rank up in the landed tiers or grant title to follow ratkin."
 ratkin_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ratkin_advance_rank_decision_confirm:0 "My fame grows!"
 
 rokea_advance_rank_decision:0 "Advance Your Rokea Rank"
 rokea_advance_rank_decision_desc:0 "Rokea acknowledge Valor, Harmony, and Innovation.\n\nYou can gain rank experience by complete a hunt, learning gift, teach gift, or gain coastal county from a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm)."
 rokea_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 rokea_advance_rank_decision_confirm:0 "My fame grows!"
 
 ananasi_advance_rank_decision:0 "Advance Your Ananasi Rank"
 ananasi_advance_rank_decision_desc:0 "Ananasi are judged by Queen Ananasa, not each other. They advance in rank as they adhere to the ways of the Triat: Cunning for the Wyrm, Obedience for the Weaver, and Wisdom for the Wyld.\n\nYou can gain rank experience by succeeding schemes against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), execute a known [criminal|E],siege a capital province, or doing spirit quest."
 ananasi_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ananasi_advance_rank_decision_confirm:0 "My fame grows!"