l_english:
 changing_moon_decision:0 "Rite of the Changing Moon"
 changing_moon_decision_tooltip:1 "You will pass to your next auspice."
 changing_moon_decision_desc:0 "These rites mark a Gurahl's passage from one auspice to another. The subject of the rite first undergoes a ritual cleansing, including a day-long fast and a ceremonial bath. At the end of her purification, she burns an item symbolic of her old auspice (i.e., a child's toy for Arcas, or a wooden spear for Uzmati). Next she adorns herself in clothing and face paint suitable to her new auspice. Finally, she presents herself before the other participants in the rite and formally states her name and (new) auspice. The other Gurahl greet her in return, again using her name and new auspice title. A celebration usually follows the formal portion of the rite."
 changing_moon_decision_confirm:0 "Changing Moon"
 
 hengeyokai_advance_rank_decision:0 "Advance Your Beast Court Rank"
 hengeyokai_advance_rank_decision_desc:0 "Regardless of Auspice, all of the members of the Beast Courts earn three types of Renown — Glory, Virtue and Wisdom. Every member of the hengeyokai understands that all three types of Renown are facets of a greater whole.\n\nYou can gain rank experience by winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), succeeding schemes against them, or killing them (only shapeshifter count). Building caerns also work."
 hengeyokai_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 hengeyokai_advance_rank_decision_confirm:0 "My fame grows!"
 
 ajaba_advance_rank_decision:0 "Advance Your Ajaba Rank"
 ajaba_advance_rank_decision_desc:0 "Like their Bastet cousins, the Ajaba value Ferocity and Cunning; unlike the cats, the social werehyenas also hold Obligation sacred. To advance in Ferocity, an Ajaba must be both fearless and vicious; to advance in Obligation, the werehyena must put the good of his people before his own; and to advance in Cunning, he must be clever and resourceful. Advancement in rank is handled by social challenges and rites similar to those of the Garou.\n\nYou can gain rank experience by wining no practice duel, siege a capital province or grant title to follow ajaba. Building Den-Realm also work."
 ajaba_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ajaba_advance_rank_decision_confirm:0 "My fame grows!"
 
 bastet_advance_rank_decision:0 "Advance Your Bastet Rank"
 bastet_advance_rank_decision_desc:0 "Werecat Renown is based on individual respect first and foremost; the werecats are more concerned with their personal views of another Bastet than they are with what the Breed as a whole thinks of him. Bastet use Renown in the categories of Cunning, Ferocity, and Honor.\n\nYou can gain rank experience by wining no practice duel, siege a capital province, winning wars against ervants of the Wyrm (or of Gaia if you are following the Wyrm) as a defender. Building caerns also work."
 bastet_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 bastet_advance_rank_decision_confirm:0 "My fame grows!"