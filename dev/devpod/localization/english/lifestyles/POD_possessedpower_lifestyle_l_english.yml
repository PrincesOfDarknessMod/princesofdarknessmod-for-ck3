 ##########################
 #######   EVENTS   #######
 ##########################
 POD_possessed.1.desc: "One restless night, you went out to stalk the taverns of your domain, driven by an unexplainable #wyrm hunger#!. When an alluring [victim_gender.Custom('bar_servant')] caught your eye, you understood what the #wyrm hunger#! was for.\n\nIt was so easy to make [victim_gender.GetHerHim] fall for you. You took [victim_gender.GetHerHim] aside and made [victim_gender.GetHerHim] whimper and scream your name. For one night, you were [victim_gender.GetHerHis] whole world.\n\nAnd yet you felt nothing.\n\nExcept, after you used [victim_gender.GetHerHim] until [victim_gender.GetSheHe] was spent, you realized [victim_gender.GetSheHe] didn't mind being used by you. If you had asked [victim_gender.GetHerHim] to kill [victim_gender.GetHerselfHimself], [victim_gender.GetSheHe] would've done it right there without question, perishing for you with a smile on [victim_gender.GetHerHis] face. [victim_gender.GetSheHe|U] would've given you everything of [victim_gender.GetHerselfHimself].\n\nOnly at that realization does the #wyrm hunger#! fade."
 POD_possessed.1.a: "The next night, it returns, stronger than before."

 POD_possessed.2.desc: "You've been so #wyrm hungry#! lately. Your meals had to double in size. Then triple. When that wasn't enough, you started raiding the kitchens for fresh leftovers. Then rotting leftovers. You don't mind. Food is food.\n\nThe #wyrm hunger#! never ended. You were raiding butcher shops for offal until that, too, wasn't enough anymore.\n\nThe first time you ate someone's cat, you felt pure #wyrm bliss#!. It squirmed in your grasp as you ripped chunks of flesh with your bare teeth. You could swear it kept squirming in your stomach. Or maybe something else is squirming in there now. You don't mind. Food is food.\n\nYou can eat an entire cow in one sitting now. The first time you did, you felt your stomach lining rupture and painfully regenerate itself around the added mass. No matter. That pain is easier to bear than the pain of unfulfilled #wyrm hunger#!."
 POD_possessed.2.a: "Speaking of, I could really go for seconds."

 POD_possessed.3.desc: "Things don't bother you like they used to. You have entered a state of enlightened detachment.\n\nThat isn't to say you've become lazy. If anything, you're more methodical now. Each of your goals becomes an entry in a well-organized list, and does it ever feel good to cross off entries on a list. It's not quite pleasure, since that would be an unnecessary passion. But it does fill you with #wyrm purpose#!.\n\nYou never realized until now how much #italic other people#! stand in the way of your goals. That won't do. Nothing matters but your #wyrm purpose#!. If there is an obstacle, remove it. For maximum efficiency, remove it permanently.\n\nRemoving human obstacles is something you're quite good at, it turns out. Stick to the shadows, strike surgically, and don't leave a corpse. It's like you were meant to do this. Nothing else fills you with as much #wyrm purpose#!."
 POD_possessed.3.a: "Now, what's next on the list?"

 POD_possessed.4.desc: "It began because you needed to avoid people. You started taking long walks at night to calm yourself. Cities can be beautiful in the dark. You learned about all the shortcuts and hidden alleyways that polite society doesn't know about.\n\nDespite your best efforts, you still run into other people at night. The homeless, the poor, the criminals. Those on the fringes of society. Those who wouldn't be missed, you realize.\n\nYour first enlightenment came from a lone prostitute by the side of the road. You grabbed her by the throat with both hands and started pushing. She struggled. It was amusing. There came a #wyrm delectable#! moment where she realized she couldn't fight back anymore, when the pleading in her eyes stopped and turned into resignation, and it made you feel like a god. When the light went out in her eyes, it was all too soon.\n\nYou need #wyrm more#!."
 POD_possessed.4.a: "And next time, it'll be more drawn-out."

 POD_possessed.5.desc: "To be honest, you didn't really change at all. You simply started asking for the #wyrm respect#! you were owed all along. Why does no one #wyrm respect#! your wishes? They should prostrate themselves at your feet without you needing to ask for it.\n\nYou've seen your courtiers talk among themselves. They're talking about you, obviously. What else is there to talk about? You know them better than they know themselves. You know what's best for them. You're such a benevolent leader.\n\nA servant boy got snippy with you. You hung him from the ceiling, suspended by his own entrails. Then you tracked down his parents and hung them too. The courtiers look differently at you now. It must be awe. Finally. When you enter a room, all eyes turn to look at you, as they should.\n\nYour only source of grief are the many people out there who've yet to receive the pleasure of being #wyrm ruled#! by you."
 POD_possessed.5.a: "It's tough being the best."


