##### Basic Powers
 possessed_blending_perk_name: "Blending"
 possessed_blending_perk_effect: "[scheme|E] [agent|E] Contribution: #P +[EmptyScope.ScriptValue('scheme_agent_general_bonuses_contribution_score_bonus_medium_value')|0]#!\n#flavor The character is able to shift its coloration for purposes of stealth; although it cannot duplicate specific patterns or textures, it can generate general patterns sufficient to break up its outline.#!"
 possessed_spirit_kinship_perk_name: "Spirit Kinship"
 possessed_spirit_kinship_perk_effect: "Can summon $POD_splat_spirit_plural$\nCan equip [fetishes|E]\n#flavor The character has powerful ties to the spirits of his kind, and may even call on them in times of danger.#!"
 possessed_step_sideways_perk_name: "Step Sideways"
 possessed_step_sideways_perk_effect: "#flavor The character gains the ability to step into the Umbra, much as Garou do. Possessed characters with this power may not lead others into the Umbra, however.#!"
 possessed_unnatural_strength_perk_name: "Unnatural Strength"
 possessed_unnatural_strength_perk_effect: "#flavor The character's muscles ripple with unnatural development, making the character seem almost the product of heavy steroid use.#!"

 possessed_armored_hide_perk_name: "Armored Hide"
 possessed_armored_hide_perk_effect: "#flavor The host's skin is obviously changed, granting added resilience against attacks. It may be obviously scaly or heavy, rhino-like hide, or perhaps even glistening with slime that causes attacks to slide away without making heavy contact.#!"
 possessed_regeneration_perk_name: "Regeneration"
 possessed_regeneration_perk_effect: "$TRAIT_FLAG_DESC_regeneration$\n[character_interaction|E]: Take [EmptyScope.ScriptValue('possessed_regeneration_superficial_cost')|N0] [stress_i][static_stress|E] to heal yourself for [EmptyScope.ScriptValue('POD_base_heal_value')|V0] [POD_superficial_damage_with_box|E], or [EmptyScope.ScriptValue('possessed_regeneration_aggravated_cost')|N0] [stress_i][static_stress|E] to heal [EmptyScope.ScriptValue('POD_base_heal_value')|V0] [POD_aggravated_damage_with_box|E].\n[PODUnlocksCombatMove('POD_combat_move_possessed_regeneration')]\n#flavor The character regenerates damage almost immediately, in the same manner as a werewolf.#!"
 possessed_shadowplay_perk_name: "Shadowplay"
 possessed_shadowplay_perk_effect: "[character_interaction|E]: Take [EmptyScope.ScriptValue('possessed_shadowplay_cost')|N0] [stress_i][static_stress|E] to end all schemes targeting you.\n[PODUnlocksCombatMove('POD_combat_move_possessed_shadowplay')]\n#flavor The character can manipulate local shadows, drawing them together into an area of darkness. The character can always see in his own shadows.#!"
 possessed_thick_skinned_perk_name: "Thick-Skinned"
 possessed_thick_skinned_perk_effect: "[POD_health_track|E] boxes: #P +1#!\n[PODUnlocksCombatMove('POD_combat_move_possessed_thick_skinned')]\n#flavor The character has an additional outer layer of covering that provides supernatural protection against injury. The style of protection varies with the individual possessed; Drones simply experience an imperceptible hardening of the skin, while gorgons often manifest this Power in a number of different ways, ranging from highly dense flesh to a layer of scales.#!"

 possessed_enhanced_attribute_perk_name: "Enhanced Attribute #low ([ROOT.Char.MakeScope.ScriptValue('POD_possessed_enhanced_attribute_stacks')])#!"
 possessed_enhanced_attribute_perk_effect: "#clickable This perk can be taken multiple times#!\nChoose from one of the following:\n$BULLET_WITH_TAB$[GetModifier('POD_possessed_enhanced_diplomacy').GetNameWithTooltip]\n$BULLET_WITH_TAB$[GetModifier('POD_possessed_enhanced_martial').GetNameWithTooltip]\n$BULLET_WITH_TAB$[GetModifier('POD_possessed_enhanced_stewardship').GetNameWithTooltip]\n$BULLET_WITH_TAB$[GetModifier('POD_possessed_enhanced_intrigue').GetNameWithTooltip]\n$BULLET_WITH_TAB$[GetModifier('POD_possessed_enhanced_learning').GetNameWithTooltip]\n#flavor The host's natural capabilities are magnified to superhuman levels. This power isn't restricted to Physical Attributes — a Wyld-possessed being might boast Enhanced Wits, while a fomor might well develop unearthly Appearance, the better to lure victims.#!"
 possessed_longevity_perk_name: "Longevity #low ([ROOT.Char.MakeScope.ScriptValue('POD_possessed_longevity_stacks')])#!"
 possessed_longevity_perk_effect: "#clickable This perk can be taken multiple times#!\nYou gain [GetModifier('POD_possessed_longevity').GetNameWithTooltip]\n#flavor The host's lifespan is extended. The character may purchase this power more than once, and each additional purchase adds an extra extension.#!"

 possessed_dispersion_perk_name: "Dispersion"
 possessed_dispersion_perk_effect: "[character_interaction|E]: Split yourself into a number of clones equal to your number of [POD_health_track|E] boxes. Each clone has a single health box. If you die, you cheat death by sacrificing one of the clones instead.\n[character_interaction|E]: Merge your clones back together. You take [POD_aggravated_damage_with_box|E] for each missing clone.\n#flavor This power, one of the most overt changes a spirit can make, allows its host to break up his body into a number of smaller wholes, each one fully alive and possessed of its \"owner's\" sentience.#!"
# deprecated
# alternatives
# - gain +40 opinion with a character for 5 years. when the opinion runs out, the character gets -40 (decaying) opinion and moves closer to rivalry
#  possessed_enchanting_voice_perk_name: "Enchanting Voice"
#  possessed_enchanting_voice_perk_effect: "[character_interaction|E]: Take [EmptyScope.ScriptValue('possessed_enchanting_voice_peace_cost')|N0] [stress_i][static_stress|E] to end a war in [white_peace|E]. The opponent gets a one-sided [truce|E] with you for [EmptyScope.ScriptValue('possessed_enchanting_voice_truce_duration')|N0] years.\nEnemies need #N -50%#! less war score to press demands against you.\n#flavor The character may enthrall listeners with its song (or in the case of Drones, with its wonderfully soothing speech).#!"
 possessed_hazardous_breath_perk_name: "Hazardous Breath"
 possessed_hazardous_breath_perk_effect: "[PODUnlocksCombatMove('POD_combat_move_possessed_poison_breath')].\nIf you have [EmptyScope.ScriptValue('possessed_hazardous_breath_threshold_1')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you unlock [PODCombatMove('POD_combat_move_possessed_fire_breath')].\nIf you have [EmptyScope.ScriptValue('possessed_hazardous_breath_threshold_2')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you unlock [PODCombatMove('POD_combat_move_possessed_balefire_breath')].\n#flavor The character can vent some sort of dangerous substance on command — fire, poison breath, acidic spittle or the like. The attack need not actually be a breath weapon; any sort of long-range attack will do.#!"
 possessed_horror_perk_name: "Horror"
 possessed_horror_perk_effect: "Inflict #TOOLTIP:STATIC_MODIFIER,POD_reduced_delirium_modifier #N;L Reduced Delirium#!#! on enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E]. This only affects $POD_splat_mortal_plural$ and similar [splats|E].\nIf you have [EmptyScope.ScriptValue('possessed_horror_threshold_1')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you inflict #TOOLTIP:STATIC_MODIFIER,POD_delirium_modifier #N;L Delirium#!#! instead.\nIf you have [EmptyScope.ScriptValue('possessed_horror_threshold_2')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you can affect any [splat|E].\n#flavor The character's presence is so disturbing that it evokes the same supernatural panic in mortals as witnessing a Garou in Crinos form. More powerful characters can even inflict terror and disbelief on the supernatural. This power almost always manifests in characters with truly bestial, animalistic or outright monstrous forms.#!"

 possessed_curse_of_gaia_perk_name: "Curse of Gaia"
 possessed_curse_of_gaia_perk_effect: "#flavor The Kami may levy the curse of Gaia Herself against an offender, punishing those who disrupt Her will or the balance of the natural world. Minor curses may manifest as runs of bad luck, bouts of depression or embarrassing physical conditions (such as hair loss or extreme stench); major curses might turn an offender to stone, inflict him with a wasting disease or even compel the earth to swallow him up.#!"
 possessed_malleate_perk_name: "Malleate"
 possessed_malleate_perk_effect: "#flavor The character is capable of injecting a strange venom that makes the victim's body malleable, making bones and muscle groups as yielding as clay. This power may affect even unliving flesh and plant tissue.#!"
 possessed_voice_of_reason_perk_name: "Voice of Reason"
 possessed_voice_of_reason_perk_effect: "[character_interaction|E]: Take [EmptyScope.ScriptValue('possessed_voice_of_reason_peace_cost')|N0] [stress_i][static_stress|E] to end a war in [white_peace|E]. The opponent gets a one-sided [truce|E] with you for [EmptyScope.ScriptValue('possessed_voice_of_reason_truce_duration')|N0] years.\nEnemies need #N -50%#! less war score to press demands against you.\n#flavor The character's voice becomes a strange, seductive monotone, lulling listeners into a state of hypnotic calm.#!"
 possessed_mind_rape_perk_name: "Mind Rape"
 possessed_mind_rape_perk_effect: "[character_interaction|E]: Learn a [secret|E] of another character.\nIf you have [EmptyScope.ScriptValue('possessed_mind_rape_threshold')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you can instead fabricate a fake secret and implant it.\n#flavor The fomor may invade a target's mind and forcibly wrench information from it. While this does no actual damage, the victim tends to feel naked and violated for several days afterwards (and often has a splitting headache to boot).#!"

##### Taints
 possessed_bane_attractor_perk_name: "Bane Attractor"
 possessed_bane_attractor_perk_effect: "Every [stress_critical_i][mental_break|E], a [GetTrait('fomori').GetName(GetNullCharacter)] appears and [Concept('single_combat_duel','duels')|E] you. It is more powerful the more [possessedpower_lifestyle|E] [perks|E] you have.\nIf you have [EmptyScope.ScriptValue('POD_possessed_stronger_taint_threshold')|V0] [possessedpower_lifestyle|E] [perks|E] or more, the [single_combat_duel|E] is #N lethal#!.\n#flavor The character always draws the attention of local Banes, and they are always offended by his presence. Unless occupied with something considerably more important, the Banes abandon their tasks to come harass the character. They cannot possess the character, but may interfere or even attack in whatever other way possible. Garou may also be drawn to characters with this Taint, coming to see what the fuss is about.#!"
 POD_combat_title_bane_attractor: "BANE ATTRACTOR"
 POD_enemy_team_bane_attractor: "a lost and hungry beast"
 possessed_dissociative_identity_perk_name: "Dissociative Identity"
 possessed_dissociative_identity_perk_effect: "Every [stress_critical_i][mental_break|E], your [personality_traits|E] get randomized.\nIf you have [EmptyScope.ScriptValue('POD_possessed_stronger_taint_threshold')|V0] [possessedpower_lifestyle|E] [perks|E] or more, this also happens automatically every #V 2 years#!.\n#flavor Although only one spirit can possess a body at once, you have several voices inside of you. Perhaps the possessed part of you is separate from the original part, maybe your personality has just fragmented into pieces.#!"
 possessed_fading_perk_name: "Fading"
 possessed_fading_perk_effect: "Every [stress_critical_i][mental_break|E], you lose #N 33%#! of your [prestige_i][prestige|E]. If you're at negative [prestige|E], you lose a [prestige_level|E] instead.\nIf you have [EmptyScope.ScriptValue('POD_possessed_stronger_taint_threshold')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you lose #N 66%#! of your [prestige_i][prestige|E].\n#flavor The character grows more out of touch with physical reality with each passing day. She is tied to some greater spiritual entity and will someday merge with it. Most possessed beings instinctively know this. Kami find it reassuring that they will someday join the ranks of their spiritual patron. Fomori are often terrified at the prospect.#!"
 possessed_harsh_tenant_perk_name: "Harsh Tenant"
 possessed_harsh_tenant_perk_effect: "Every [stress_critical_i][mental_break|E], you take [EmptyScope.ScriptValue('POD_base_wound_damage')|V0] [POD_superficial_damage_with_box|E].\nIf you have [EmptyScope.ScriptValue('POD_possessed_stronger_taint_threshold')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you take [POD_aggravated_damage_with_box|E] instead.\n#flavor Your tenant doesn't like to lose — ever. Whenever you fail spectacularly, it makes its displeasure known by afflicting you with wracking pain and terrible wounds.#!"
# deprecated
 #possessed_infested_perk_name: "Infested"
 #possessed_infested_perk_effect: "You lose [Multiply_CFixedPoint( '(CFixedPoint)2', CHARACTER.MakeScope.ScriptValue('splat_energy_multiplier') )|N0] [CHARACTER.Custom('PODEnergySplat')] #V every year#!. If you can't pay this cost, you take [POD_superficial_damage|E] instead.\nIf you have [EmptyScope.ScriptValue('POD_possessed_stronger_taint_threshold')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you lose [Multiply_CFixedPoint( '(CFixedPoint)4', CHARACTER.MakeScope.ScriptValue('splat_energy_multiplier') )|N0] [CHARACTER.Custom('PODEnergySplat')] instead.\n#flavor The character is infested with insects or worms. The character might view herself as their protector or mother, or might be repulsed be the living things crawling through her body, but the end result is the same. The creatures must eat, and if they aren't fed, they will feed on the character's body. In some cases, there isn't a way to feed them, and so they must be purged daily.#!"
# deprecated
 #possessed_teledementia_perk_name: "Teledementia"
 #possessed_teledementia_perk_effect: "You gain #N 10#! [stress_i][static_stress|E] every year.\nIf you have [EmptyScope.ScriptValue('POD_possessed_stronger_taint_threshold')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you gain #N 20#! [stress_i][static_stress|E] instead.\n#flavor The character receives telepathic input from everyone within several miles. This includes animals, children, ghosts — basically anything within any degree of sentience. However, Teledementia confers no useful information. The character is simply bombarded by a never-ending barrage of negative emotion — pain, fear, doubt, anger, etc. Such fomori tend to believe that the world is a twisted, horrible place and have no compunctions about putting people \"out of their misery.\"#!"
 possessed_urges_perk_name: "Urges"
 possessed_urges_perk_effect: "When you take this perk, choose an [possessed_urge|E]. Every [EmptyScope.ScriptValue('possessed_urges_interval')|V0] years, you need to either indulge in the [possessed_urge|E] or gain [EmptyScope.ScriptValue('possessed_urges_static_stress_1')|N0] [stress_i][static_stress|E].\nIf you have [EmptyScope.ScriptValue('POD_possessed_stronger_taint_threshold')|V0] [possessedpower_lifestyle|E] [perks|E] or more, you gain [EmptyScope.ScriptValue('possessed_urges_static_stress_2')|N0] [stress_i][static_stress|E] instead.\n#flavor The character suffers from one or more uncontrollable desires which fall outside the realm of normal wants and needs. These are not Derangements #italic per se#!, nor are they proper addictions, as most are simply the manifestations of an accompanying spirit's personal ambitions. A completely sane character may still suffer from urges, and therein lies the difference.#!"

