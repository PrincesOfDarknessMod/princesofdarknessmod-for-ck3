 POD_urge_energy_tt: "Every [EmptyScope.ScriptValue('possessed_urges_interval')|V0] years, you get the urge to feed your spirit [Multiply_CFixedPoint( EmptyScope.ScriptValue('possessed_urges_energy_value'), THIS.Char.MakeScope.ScriptValue('splat_energy_multiplier') )|N0] [THIS.Char.Custom('PODEnergySplat')]."
 POD_urge_fight_tt: "Every [EmptyScope.ScriptValue('possessed_urges_interval')|V0] years, you get the urge to fight a random [vassal|E] or [courtier|E]. The loser takes [POD_superficial_damage_with_box|E]. Regardless of the outcome, the other character will dislike you."
 POD_urge_gold_tt: "Every [EmptyScope.ScriptValue('possessed_urges_interval')|V0] years, you get the urge to spend between [THIS.Char.MakeScope.ScriptValue('possessed_urges_gold_min')|N0] and [THIS.Char.MakeScope.ScriptValue('possessed_urges_gold_max')|N0] [gold_i][gold|E] #italic (based on your income)#!"
 POD_urge_prestige_tt: "Every [EmptyScope.ScriptValue('possessed_urges_interval')|V0] years, you get the urge to humiliate yourself, costing you between [EmptyScope.ScriptValue('possessed_urges_prestige_min')|N0] and [EmptyScope.ScriptValue('possessed_urges_prestige_max')|N0] [prestige_i][prestige|E]. A nearby ruler gains that amount of prestige and gains opinion of you."
 POD_urge_skills_tt: "Every [EmptyScope.ScriptValue('possessed_urges_interval')|V0] years, you get the urge to indulge in your most hedonistic impulses, reducing a random [skill|E] by #N [EmptyScope.ScriptValue('possessed_urges_skills_min')|0]%#! to #N [EmptyScope.ScriptValue('possessed_urges_skills_max')|0]%#! for the next [EmptyScope.ScriptValue('possessed_urges_skills_duration')|0] years."

 POD_urge_basic_tt: "You can also choose to resist by taking [THIS.Char.MakeScope.ScriptValue('possessed_urges_static_stress')|N0] [stress_i][static_stress|E] instead."

 POD_possessed_urges_reason_tt: "This has happened because of your [GetPerk('possessed_urges_perk').GetName(GetPlayer)] #italic ([THIS.Var('possessed_urge').GetFlagName])#!"

 POD_possessed.1021.t: "It Hungers"
 POD_possessed.1021.desc: "It is happening again.\n\nThe spirit inside you demands your energy. The absurdity isn't lost on you. Like a tenant demanding rent from the landlord.\n\nBut its hunger is your hunger, and the yawning pit in your stomach feels like it's going to consume your entire being.\n\nYou have to feed it.\n\nIt's the only way to make it stop."
 POD_possessed_1021.a: "Just give in."
 POD_possessed_1021.b: "NO! I'm better than this."

 POD_possessed.1022.t: "Fight Me!"
 POD_possessed.1022.desc: "It is happening again.\n\nYou cannot help it. Everything irritates you lately. Especially that [target.Custom('InsultAdjective')] [target.Custom('InsultNoun')] [target.GetFirstName]. You would feel so much better if you let off some steam. Hit [target.GetHerHim] where it hurts.\n\nEvery time a new annoyance comes up, you are fantasizing about the moment you finally get to let loose. Every time, the fantasies become more vivid. Every time, you wonder.\n\nWhy not make it a reality?"
 POD_possessed.1022.success: "You won. Was it worth it?"
 POD_possessed.1022.failure: "You got what you deserved"

 POD_possessed.1023.t: "Consume or be Consumed"
 POD_possessed.1023.desc: "It is happening again.\n\nIt's like there's something missing, something just out of reach. You need something that you cannot name, and it's driving you insane. Like an itch you cannot scratch.\n\nThe markets must have it. That's the solution. Go out and spend all your money, and maybe you'll find something that will make you whole again."

 POD_possessed.1024.t: "Submit"
 POD_possessed.1024.desc: "It is happening again.\n\nYou feel like an impostor. The things you've accomplished amount to nothing, and you're sure everyone can see it. Useless. That's what you are. Completely useless.\n\nWhat if you prostrated yourself before someone better? It doesn't even matter who. It might as well be [target.GetFirstName]. Just fall to your knees before [target.GetHerHim] and let [target.GetHerHim] do whatever [target.GetSheHe] wants. Then you'd finally be worth something."

 POD_possessed.1025.t: "Forget Yourself"
 POD_possessed.1025.desc: "It is happening again.\n\nYou are tense. Every day is a battle for self-control, and for what? Where has that led you? What's even the point.\n\nNothing is fun anymore. You remember feeling joy once, and that feels like a lifetime ago.\n\nYou should try and have some #italic real#! fun for once. Leave your responsibilities behind and go on a month-long bender in town. That's what you need. The world is full of satisfaction, and you must glut yourself on it. Glut until you can't take anymore, and then glut some more."
 POD_possessed.1025.a.tt: "The [skill|E] will be reduced by #N [SCOPE.GetValue('modifier_scale')|0]%#!"

 POD_possessed.1100.t: "Tainted Love"
 POD_possessed.1100.desc: "To begin your descent, select a Taint [perk|E].\n\nTaints give you passive [possessedpower_lifestyle|E] [experience|E], but will make your life harder in some way.\n\n#weak You are not limited to this first choice. You can buy more Taints later, if you are willing to suffer their consequences.#!"
 # lowercase because it tends to look better with this font
 POD_perk_event_selection_perkname: "[GetPerk(GetPlayer.MakeScope.Var('event_perk_selection').GetFlagKey).GetNameNoTooltip(GetPlayer)|l]"
 POD_gained_taint_toast: "Tainted"
 POD_possessed.1100.a: "Proceed with the selected Taint."

 POD_possessed.1101.t.fomori: "Falling, Falling"
 POD_possessed.1101.desc.fomori: "Something changed.\n\nIt can't be you who's changed. There's nothing wrong with who you are. Yet you feel a profound #wyrm dissatisfaction#! with the way your [ROOT.Char.Custom('PODLifeUnlife')] is going.\n\nYou are being suffocated. Routines, rules, regulations, everywhere you turn, there's something constraining you, constraining your #wyrm fun#!. Have you ever known #italic real#! #wyrm fun#!?\n\nAnd at the edge of your awareness, an epiphany unfolds. No one is starving you of #wyrm fun#!. You have been starving yourself. How many #wyrm pleasures#! have you denied yourself because you were too scared of their consequences?\n\nThis hunger... #wyrm doesn't it deserve to be fed?#!"
 POD_possessed.1101.a.fomori: "Give me the fun."
 POD_possessed.1101.a.tt: "Your [stress|E] is set to [stress_critical_i][SCOPE.GetValue('new_stress')|V0]."
 POD_possessed.1101.a.tt2: "As a [GetTrait('fomori').GetName(GetNullCharacter)], you gain [possessedpower_lifestyle|E] [experience|E] on every [mental_break|E]. This first one is enough to give you a full [perk|E]."
 POD_possessed.1101.b: "Whatever is happening here, I have to resist it."

 POD_possessed.1200.t: "Who Goes in the Toybox?"
 POD_possessed.1200.desc: "#TOOLTIP:GAME_TRAIT,fomori,[GetPlayer] #L Twisted Slashers#!#! can only gain [true_relief_with_icon|E] when they succeed at [possessed_stalking_with_icon|E] specific victims.\n\nPick a trait. Characters with that trait become your [preferred_victims_with_icon|E]. They are treated as hostile [splats|E], meaning you can #N no longer#! perform friendly actions with them. Instead, you get to stalk, torture and kill them."
 POD_possessed.1200.desc.hint: "#weak You can optionally pick 2 more traits with the [GetDecision('POD_possessed_slasher_additional_victims_decision').GetName] [decision|E] later, which includes personality, congenital, or crime traits.#!"
 POD_preferred_victim_trait_event_selection_traitname: "[Trait.GetNameNoTooltip(GetNullCharacter)|l]"
 POD_possessed.1200.a: "Proceed with the current selection."

 POD_possessed.1201.desc: "What kind of [preferred_victim_with_icon|E] is most deserving of your cruelty?"
 POD_possessed.1201.a: "Splats."
 POD_possessed.1201.b: "Personality traits."
 POD_possessed.1201.c: "Congenital traits."
 POD_possessed.1201.d: "Crimes."
 POD_possessed.1201.e: "I'll think about this some other time."
 POD_possessed.1201.f: "I have enough playthings already."
 POD_possessed.1201.f.tt: "You #N disable#! this decision and will no longer be able to pick additional traits"
 
 # Stalk event
 POD_stalk_option_inline_link: "#TOOLTIP:[SCOPE.GetFlagName('flag')]_tt #L;V [Localize(SCOPE.GetFlagName('flag'))]#!#!"
 POD_stalk_option_tooltip_header: "#size:17  #!\n#V;bold;outline;size:20;FONT:PODGrotesque [Localize(SCOPE.GetFlagName('flag'))]#!\n#clickable Cost: #bold [EmptyScope.ScriptValue(Concatenate(SCOPE.GetFlagName('flag'),'_cost'))|V0]#! [possessed_stalk_with_icon|E] [Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue(Concatenate(SCOPE.GetFlagName('flag'),'_cost')), '(CFixedPoint)1' ), 'action', 'actions' )]#!"
 #POD_stalk_option_button_text: "[Localize(Scope.GetFlagKey)] #low ([EmptyScope.ScriptValue(Concatenate(Scope.GetFlagKey,'_cost'))])#!"
 POD_stalk_option_button_text: "[Localize(Scope.GetFlagKey)]"
 #POD_stalk_actions_left: "[Select_CString( EqualTo_CFixedPoint( GetPlayer.MakeScope.ScriptValue('stalk_actions'), '(CFixedPoint)1' ), 'ACTION', 'ACTIONS' )] LEFT"
 POD_stalk_actions_left: "ACTIONS LEFT"
 POD_stalk_option_only_once: "You can only use this option once"
 
 POD_stalk_true_relief: "@stress_loss_icon!Revel in Cruelty"
 POD_stalk_true_relief_tt: "[PODStalkOptionHeader('POD_stalk_true_relief')]\nGain [true_relief_with_icon|E].\nThis is the only form of [stress|E] relief available to #TOOLTIP:GAME_TRAIT,fomori,[GetPlayer] #L Twisted Slashers#!#!.\n"
 # TODO PMVP (add to gameconcept)
 POD_stalk_possessed_xp: "@spirit_icon!Indulge the Monster"
 POD_stalk_possessed_xp_tt: "[PODStalkOptionHeader('POD_stalk_possessed_xp')]\nGain [possessedpower_lifestyle|E] experience.\n"
 POD_stalk_heal_superficial: "@health_track_damage_icon! Nourish Yourself"
 POD_stalk_heal_superficial_tt: "[PODStalkOptionHeader('POD_stalk_heal_superficial')]\nHeal [EmptyScope.ScriptValue('POD_base_heal_value')|V0] [POD_superficial_damage_with_box|E].\n"
 POD_stalk_heal_aggravated: "@health_track_aggravated_damage_icon! Drink Deep"
 POD_stalk_heal_aggravated_tt: "[PODStalkOptionHeader('POD_stalk_heal_aggravated')]\nHeal [EmptyScope.ScriptValue('POD_base_aggravated_heal_value')|V0] [POD_aggravated_damage_with_box|E].\n"
 POD_stalk_blademaster: "@blademaster_icon!Play With Knives"
 POD_stalk_blademaster_tt: "[PODStalkOptionHeader('POD_stalk_blademaster')]\nGain or level up the #TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L Blademaster#!#! trait.\n"
 POD_stalk_prowess: "@skill_prowess_icon!Study Weaknesses"
 POD_stalk_prowess_tt: "[PODStalkOptionHeader('POD_stalk_prowess')]\nPermanently increase your [prowess_i][prowess|E] by #V 2#! (up to a maximum of #V 10#!).\n"
 POD_stalk_physique: "@physique_good_3_icon!Sap Strength"
 POD_stalk_physique_tt: "[PODStalkOptionHeader('POD_stalk_physique')]\nLevel up your physique trait (up to @physique_good_3_icon![GetTrait('physique_good_3').GetName(GetNullCharacter)]).\n"
 POD_stalk_torturer: "@torturer_icon!Hone Your Craft"
 POD_stalk_torturer_tt: "[PODStalkOptionHeader('POD_stalk_torturer')]\nGain a [perk|E] in the @torturer_icon![GetTrait('torturer').GetName(GetNullCharacter)] [lifestyle|E].\n"
 POD_stalk_dollmaker: "@prison_icon!Dollmaker"
 POD_stalk_dollmaker_tt: "[PODStalkOptionHeader('POD_stalk_dollmaker')]\nYou [imprison|E] your victim.\nYour victim gains [GetModifier('POD_dollmaker_modifier').GetNameWithTooltip] for #V [EmptyScope.ScriptValue('POD_stalk_dollmaker_duration_years')|V0] years#!.\n"
 
 POD_possessed.1210.t: "Savor the Pain"
 POD_possessed.1210.desc: "As the chase concludes, it is time for your reward.\n\nHow will you torture [recipient.GetFirstName] now that [recipient.GetSheHe]'s in your clutches?"
 POD_possessed.1210.a: "Conclude this session."
 
 POD_possessed.1211.t: "Playing With Your Food"
 POD_possessed.1211.desc: "The anticipation of catching your prey is sending tingles down your spine. A percussive noise hammers in your head, urging you forward. You are exactly where you're meant to be."
 POD_stalk_intro_header: "You will start a [pod_combat_encounter_with_icon|E]"
 POD_stalk_intro_actions: "#V ACTIONS:#! [GetPlayer.MakeScope.ScriptValue('stalk_actions_from_handicaps')|0]"
 POD_stalk_intro_actions_desc: "If you win, you can spend [possessed_stalk_with_icon|E] actions on torture methods."
 POD_stalk_intro_prowess: "#V PROWESS:#! [GetPlayer.MakeScope.ScriptValue('prowess_loss_from_stalk_handicaps')|0]"
 POD_stalk_intro_prowess_desc: "You can get additional actions by drawing out the process and handicapping yourself:"
 POD_stalk_intro_actor_prowess: "#V You:#! [prowess_i][GetPlayer.MakeScope.ScriptValue('stalk_actor_prowess')|0]"
 POD_stalk_intro_recipient_prowess: "#V [EventWindowWidget.GetScope.sC('recipient').GetFirstName]:#! [prowess_i][EventWindowWidget.GetScope.sC('recipient').GetProwess]"
 POD_possessed.1211.a: "Begin the slaughter."
 POD_possessed.1211.b: "Actually, this isn't the right time."
 
 POD_combat_title_slasher: "THE BUTCHER HAS ARRIVED"
 
 POD_possessed.1213.t: "In a Ditch"
 POD_possessed.1213.desc: "You wouldn't have shown your victim any mercy, had you won the battle. For once, the roles are reversed, and [sc_victor.GetFirstName] unhesitatingly cuts you down like a dog. [sc_victor.GetHerHis|U] decisiveness earned your begrudging respect.\n\nYou perish alone, with no one to mourn you.\n\nWhen death claims you, you greet him like an old friend."
 POD_possessed.1213.a: "As it was meant to be."
