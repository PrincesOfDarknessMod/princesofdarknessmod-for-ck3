 ##########################
 #######   TRAITS   #######
 ##########################
 trait_truepossessed: "[possessed|E]"
 trait_fomori: "Fomor"
 trait_fomori_desc: "This character has been possessed by a spirit of the $glossary_wyrm$.\n\nPossessed individuals are still themselves to an extent, but with an inner voice driving them to indulge in their base urges and relinquish their autonomy. Fomori tend to be depraved and self-destructive, and many of them don't survive for long."
 trait_bakemono: "Bakemono"
 trait_bakemono_desc: "A character who has been implanted with a simple $glossary_wyrm$-spirit. [Glossary('Yama Kings','podgloss.yamaking')] like to use them as cannon fodder."
 trait_fir_bolg: "Fir Bolg"
 trait_fir_bolg_desc: "A violent and brutal Fomori race composed almost entirely of warriors and hunters. Fir Bolgs appear as swarthy, dark-skinned humans that stand no less than two heads taller than a werewolf in their war form, graceful in battle despite their massive size and musculature. After being banished from their ancestral homeland of Eire in ages past, only scattered remnants remain in the forests of England and Scotland."
 trait_fomarch: "Fomarch"
 trait_fomarch_desc: "An atrocity-in-flesh representing the pinnacle of Fomori evolution. While their brethren aren't much better than mass-produced cannon fodder, this one is truly one of a kind.\n\nFomarchs can conceal their powers to appear outwardly human, but why should they? They're the $glossary_wyrm$'s favorite, and once the whole world has burned down, they will rule over the ashes."
# names for the other fomori breeds are taken from perk names, to reuse the loc keys
 trait_enticer_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of desire and became an instrument of the $glossary_wyrm_corruption$, knowingly or not.\n\nEnticers emit supernaturally potent, psychoactive pheromones that cause those around them to perceive the Enticer as their ideal sexual partner, the literal man, or woman of their dreams. Moreover, these pheromones are addictive; those who've been around the Enticer for even a short while soon can't conceive of living without them. Essentially, an Enticer can seduce almost anything."
 trait_flesh_pack_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of consumption and became an instrument of the $glossary_wyrm_consumption$, knowingly or not.\n\nTODO POSSESSED"
 trait_shadowfiend_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of cruelty and became an instrument of the $glossary_wyrm$, knowingly or not.\n\nTODO POSSESSED"
 trait_slasher_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of violence and became an instrument of the $glossary_wyrm_calamity$, knowingly or not.\n\nTODO POSSESSED"
 trait_ferectoi_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of power and claimed [ROOT.Char.GetHerHis] birthright as an instrument of the $glossary_wyrm$.\n\nTODO POSSESSED"
 # yeah... all that is necessary for displaying scaling modifiers
 TRAIT_FLAG_DESC_imperiled_autonomy_fomori: "Gains #TOOLTIP:SCALED_STATIC_MODIFIER,POD_autonomy_imperiled_fomori,1,blank_line,POD_automony_imperiled_scaling_desc #N;L [Localize('POD_autonomy_imperiled_fomori')]#!#! on a [stress_critical_i][mental_break|E]"
 TRAIT_FLAG_DESC_become_spirit_on_death: "On death, the $POD_splat_spirit$ leaves the body"
 TRAIT_FLAG_DESC_die_on_stress_break_3: "@death_icon!#X Dies at [stress_critical_i]Stress Level 3#!"

