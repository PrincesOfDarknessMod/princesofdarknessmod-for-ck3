 #trait_kami_desc: "This character has been touched by Gaia herself.\n\nUnlike other Possessed, Kami retain most of their autonomy and individuality. Nevertheless, the immensity of the $glossary_wyrm$'s threat and the knowledge of Gaia's slow demise make their existence a stressful one."


 #################################
 #######   GAME CONCEPTS   #######
 #################################
 game_concept_possession: "Possession"
 game_concept_possess: "Possess"
 game_concept_possessed: "Possessed"
 # TODO POSSESSED
 game_concept_possession_desc: "The Possessed are mortals or supernaturals that have been permanently possessed by a powerful [GetTrait('spirit').GetName(GetNullCharacter)] of Gaia or the $glossary_triat$.\n\nPossessed individuals gain access to [Concept('possessedpower_lifestyle','Possessed Powers')|E], a new [lifestyle|E] with a unique progression system.\n\nBecoming a [GetTrait('fomori').GetName(GetNullCharacter)] is done by requesting a Bane [spirit_companion|E] to possess you."

 game_concept_possessedpower_lifestyle: "Possessed"
 game_concept_possessed_breed: "Breed"
 game_concept_possessedpower_lifestyle_desc: "[possessed|EU] have access to three [perk|E] trees:\n\n$BULLET_WITH_TAB$#bold Powers#! are basic abilities that any type of Possessed has access to.\n$BULLET_WITH_TAB$#bold Taints#! grant a large amount of passive experience, but with some kind of downside.\n$BULLET_WITH_TAB$#bold Breeds#! are specialized transformations that vastly change your playstyle.\n\nYou can only get [lifestyle|E] [experience|E] from:\n$BULLET_WITH_TAB$[stress_critical_i][mental_breaks|E]\n$BULLET_WITH_TAB$Turning other characters into Possessed\n$BULLET_WITH_TAB$Taint [perks|E]\n\nAll these sources of experience have #N diminishing returns#! and will become less effective the more [possessedpower_lifestyle|E] [perks|E] you have.\n\nTaints do not count for effects that scale with your number of [possessedpower_lifestyle|E] [perks|E]."

 game_concept_true_relief: "True Relief"
 game_concept_true_relief_with_icon: "@stress_loss_icon!True Relief"
 game_concept_true_relief_desc: "#bold True Relief#! is the only form of [stress|E] relief available to a [possessedpower_lifestyle|E] [possessed_breed|E].\n\nLike [possessedpower_lifestyle|E] experience, True Relief is subject to #N diminishing returns#! and will become less effective the more [possessedpower_lifestyle|E] [perks|E] you have."

 game_concept_possessed_urge: "Urge"
 game_concept_possessed_urge_desc: "If you have the #V $possessed_urges_perk_name$#! [perk|E], you get an event every [EmptyScope.ScriptValue('possessed_urges_interval')|V0] years where you need to either indulge in the urge or take [stress_i][static_stress|E]. If the urge has random consequences, you get a preview of the outcome.\n\nYou can choose from these urges when you take the perk:\n\n#bold;clickable;outline $POD_urge_energy$:#! Lose a full bar's worth of energy (e.g. $POD_energy_blood$ or $POD_energy_gnosis$).\n#bold;clickable;outline $POD_urge_fight$:#! Fight a random [vassal|E] or [courtier|E] in a [prowess|E] challenge. The loser takes [POD_superficial_damage_with_box|E]. Regardless of the outcome, the other character will dislike you.\n#bold;clickable;outline $POD_urge_gold$:#! Lose a random amount of [gold_i][gold|E]. #italic (based on your income)#!\n#bold;clickable;outline $POD_urge_prestige$:#! Lose a random amount of [prestige_i][prestige|E] #italic (between [EmptyScope.ScriptValue('possessed_urges_prestige_min')|N0] and [EmptyScope.ScriptValue('possessed_urges_prestige_max')|N0])#!. A nearby ruler gains that amount of prestige and gains opinion of you.\n#bold;clickable;outline $POD_urge_skills$:#! A random [skill|E] is reduced by #N [EmptyScope.ScriptValue('possessed_urges_skills_min')|0]%#! to #N [EmptyScope.ScriptValue('possessed_urges_skills_max')|0]%#! for the next [EmptyScope.ScriptValue('possessed_urges_skills_duration')|0] years."


