 POD_story_possessed: "Possessed"
 POD_story_possessed_desc: "Alien urges worm their way into your mind.\nThey will not stop until you give in."
 POD_POSSESSED_STORY_CUSTOM: "You can only get [possessedpower_lifestyle|E] [experience|E] from:\n$BULLET_WITH_TAB$[stress_critical_i][mental_breaks|E]\n$BULLET_WITH_TAB$Turning other characters into Possessed\n$BULLET_WITH_TAB$Taint [perks|E]\n\nThe more [possessedpower_lifestyle|E] [perks|E] #italic (other than Taints)#! you have, the #N less effective#! these methods get.\n\nYou have [Story.GetOwner.MakeScope.ScriptValue('POD_total_possessed_perks')|V0] [possessedpower_lifestyle|E] [Concept( 'perk', SelectLocalization( EqualTo_CFixedPoint( Story.GetOwner.MakeScope.ScriptValue('POD_total_possessed_perks'), '(CFixedPoint)1' ), 'game_concept_perk', 'game_concept_perks' ) )|E] #weak ([Story.GetOwner.MakeScope.ScriptValue('POD_possessed_experience_mult_percentage')|1]% experience gain)#!\n\nYou've had [Story.GetOwner.MakeScope.ScriptValue('POD_total_possessed_mental_breaks')|V0] [stress_critical_i][Concept( 'mental_break', SelectLocalization( EqualTo_CFixedPoint( Story.GetOwner.MakeScope.ScriptValue('POD_total_possessed_mental_breaks'), '(CFixedPoint)1' ), 'game_concept_mental_break', 'game_concept_mental_breaks' ) )|E] since becoming possessed." # TODO POSSESSED: flavorize for other possessed types


