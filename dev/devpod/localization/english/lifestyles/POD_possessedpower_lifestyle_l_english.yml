 ##########################
 #######   TRAITS   #######
 ##########################
 trait_truepossessed: "[possessed|E]"
 trait_fomori: "Fomor"
 trait_fomori_desc: "This character has been possessed by a spirit of the $glossary_wyrm$.\n\nPossessed individuals are still themselves to an extent, but with an inner voice driving them to indulge in their base urges and relinquish their autonomy. Fomori tend to be depraved and self-destructive, and many of them don't survive for long."
 trait_bakemono: "Bakemono"
 trait_bakemono_desc: "A character who has been implanted with a simple $glossary_wyrm$-spirit. [Glossary('Yama Kings','podgloss.yamaking')] like to use them as cannon fodder."
 trait_fir_bolg: "Fir Bolg"
 trait_fir_bolg_desc: "A violent and brutal Fomori race composed almost entirely of warriors and hunters. Fir Bolgs appear as swarthy, dark-skinned humans that stand no less than two heads taller than a werewolf in their war form, graceful in battle despite their massive size and musculature. After being banished from their ancestral homeland of Eire in ages past, only scattered remnants remain in the forests of England and Scotland."
 trait_fomarch: "Fomarch"
 trait_fomarch_desc: "An atrocity-in-flesh representing the pinnacle of Fomori evolution. While their brethren aren't much better than mass-produced cannon fodder, this one is truly one of a kind.\n\nFomarchs can conceal their powers to appear outwardly human, but why should they? They're the $glossary_wyrm$'s favorite, and once the whole world has burned down, they will rule over the ashes."
# names for the fomori breeds are taken from perk names, to reuse the loc keys
 trait_enticer_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of desire and became an instrument of the $glossary_wyrm_corruption$, knowingly or not.\n\nEnticers emit supernaturally potent, psychoactive pheromones that cause those around them to perceive the Enticer as their ideal sexual partner, the literal man, or woman of their dreams. Moreover, these pheromones are addictive; those who've been around the Enticer for even a short while soon can't conceive of living without them. Essentially, an Enticer can seduce almost anything."
 trait_flesh_pack_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of consumption and became an instrument of the $glossary_wyrm_consumption$, knowingly or not.\n\nOnce possessed, a Flesh Pack fomor suffers rapid, severe decline of their mental faculties, at the same time the possessing Bane pumps them full of aggression and a growing hunger for raw meat — any kind will do. Most Flesh Pack \"alphas\" begin by raiding the nearest butcher's shop, but quickly proceed to devouring neighborhood pets and then neighbors. A growing Flesh Pack is easily capable of depopulating a small town or village."
 trait_shadowfiend_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of despair and became an instrument of the $glossary_wyrm$, knowingly or not.\n\nTODO POSSESSED"
 trait_slasher_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of cruelty and became an instrument of the $glossary_wyrm_consumption$, knowingly or not.\n\nThe Twisted Slasher is a self-fulfilling prophecy of horror, having played host to a Bane for so long that they can no longer remember their life without the spirit viciously whispering in their ear that they've been right all along. They're so far gone into their own cruelty that they set people on edge just by being in the vicinity, with a hand permanently contorted around their favorite knife as a nigh-claw and a stride that reflects their relentlessness."
 trait_ferectoi_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] has succumbed to [ROOT.Char.GetHerHis] urge of power and claimed [ROOT.Char.GetHerHis] birthright as an instrument of the $glossary_wyrm$.\n\nTODO POSSESSED"
 # yeah... all that is necessary for displaying scaling modifiers
 TRAIT_FLAG_DESC_imperiled_autonomy_fomori: "Gains #TOOLTIP:SCALED_STATIC_MODIFIER,POD_autonomy_imperiled_fomori,1,blank_line,POD_automony_imperiled_scaling_desc #N;L [Localize('POD_autonomy_imperiled_fomori')]#!#! on a [stress_critical_i][mental_break|E]"
 TRAIT_FLAG_DESC_become_spirit_on_death: "On death, the $POD_splat_spirit$ leaves the body"
 TRAIT_FLAG_DESC_die_on_stress_break_3: "@death_icon!#X Dies at [stress_critical_i]Stress Level 3#!"

 trait_drone: "Drone"
 trait_drone_desc: "This character has been possessed by a $glossary_weaver$-spirit."
 #trait_drone_desc: "This character underwent the process of Clarification and became a tool of the $glossary_weaver$.\n\nDrones tend to self-select from people who have a strong sense of order and structure. Their form is flawless, but static."

 trait_gorgon: "Gorgon"
 trait_gorgon_desc: "This character has been possessed by a $glossary_wyld$-spirit."

 POD_trait_kami: "Kami"
 POD_trait_kami_desc: "This character has been touched by Gaia herself."
 #POD_trait_kami_desc: "This character has been touched by Gaia herself.\n\nUnlike other Possessed, Kami retain most of their autonomy and individuality. Nevertheless, the immensity of the $glossary_wyrm$'s threat and the knowledge of Gaia's slow demise make their existence a stressful one."


 #################################
 #######   GAME CONCEPTS   #######
 #################################
 game_concept_possession: "Possession"
 game_concept_possess: "Possess"
 game_concept_possessed: "Possessed"
 # TODO POSSESSED
 game_concept_possession_desc: "The Possessed are mortals or supernaturals that have been permanently possessed by a powerful [GetTrait('spirit').GetName(GetNullCharacter)] of Gaia or the $glossary_triat$.\n\nPossessed individuals gain access to [Concept('possessedpower_lifestyle','Possessed Powers')|E], a new [lifestyle|E] with a unique progression system.\n\nBecoming a [GetTrait('fomori').GetName(GetNullCharacter)] is done by requesting a Bane [spirit_companion|E] to possess you."

 game_concept_possessedpower_lifestyle: "Possessed"
 game_concept_possessed_breed: "Breed"
 game_concept_possessedpower_lifestyle_desc: "[possessed|EU] have access to three [perk|E] trees:\n\n$BULLET_WITH_TAB$#bold Powers#! are basic abilities that any type of Possessed has access to.\n$BULLET_WITH_TAB$#bold Taints#! grant a large amount of passive experience, but with some kind of downside.\n$BULLET_WITH_TAB$#bold Breeds#! are specialized transformations that vastly change your playstyle.\n\nYou can only get [lifestyle|E] [experience|E] from:\n$BULLET_WITH_TAB$[stress_critical_i][mental_breaks|E]\n$BULLET_WITH_TAB$Turning other characters into Possessed\n$BULLET_WITH_TAB$Taint [perks|E]\n\nAll these sources of experience have #N diminishing returns#! and will become less effective the more [possessedpower_lifestyle|E] [perks|E] you have.\n\nTaints do not count for effects that scale with your number of [possessedpower_lifestyle|E] [perks|E]."

 game_concept_true_relief: "True Relief"
 game_concept_true_relief_with_icon: "@stress_loss_icon!True Relief"
 game_concept_true_relief_desc: "#bold True Relief#! is the only form of [stress|E] relief available to a [possessedpower_lifestyle|E] [possessed_breed|E].\n\nLike [possessedpower_lifestyle|E] experience, True Relief is subject to #N diminishing returns#! and will become less effective the more [possessedpower_lifestyle|E] [perks|E] you have."

 game_concept_possessed_urge: "Urge"
 game_concept_possessed_urge_desc: "If you have the #V $possessed_urges_perk_name$#! [perk|E], you get an event every [EmptyScope.ScriptValue('possessed_urges_interval')|V0] years where you need to either indulge in the urge or take [stress_i][static_stress|E]. If the urge has random consequences, you get a preview of the outcome.\n\nYou can choose from these urges when you take the perk:\n\n#bold;clickable;outline $POD_urge_energy$:#! Lose a full bar's worth of energy (e.g. $POD_energy_blood$ or $POD_energy_gnosis$).\n#bold;clickable;outline $POD_urge_fight$:#! Fight a random [vassal|E] or [courtier|E] in a [prowess|E] challenge. The loser takes [POD_superficial_damage_with_box|E]. Regardless of the outcome, the other character will dislike you.\n#bold;clickable;outline $POD_urge_gold$:#! Lose a random amount of [gold_i][gold|E]. #italic (based on your income)#!\n#bold;clickable;outline $POD_urge_prestige$:#! Lose a random amount of [prestige_i][prestige|E] #italic (between [EmptyScope.ScriptValue('possessed_urges_prestige_min')|N0] and [EmptyScope.ScriptValue('possessed_urges_prestige_max')|N0])#!. A nearby ruler gains that amount of prestige and gains opinion of you.\n#bold;clickable;outline $POD_urge_skills$:#! A random [skill|E] is reduced by #N [EmptyScope.ScriptValue('possessed_urges_skills_min')|0]%#! to #N [EmptyScope.ScriptValue('possessed_urges_skills_max')|0]%#! for the next [EmptyScope.ScriptValue('possessed_urges_skills_duration')|0] years."

 game_concept_possessed_stalk: "Stalk"
 game_concept_possessed_stalking: "Stalk"
 game_concept_possessed_stalk_with_icon: "@fomori_icon!Stalk"
 game_concept_possessed_stalking_with_icon: "@fomori_icon!Stalking"
 # TODO PMVP: update for new mechanics (and add missing torture methods)
 #game_concept_possessed_stalk_desc: "#bold Stalk#! is a [journey|E] available to #TOOLTIP:GAME_TRAIT,fomori,[GetNullCharacter] #L Twisted Slashers#!#!. It can only be used on their [preferred_victims_with_icon|E].\n\nAfter pursuing their victim, the Slasher starts a lethal [pod_combat_encounter_with_icon|E]. If the Slasher wins, they get to perform elaborate torture on the victim.\n\nYou can perform various torture methods and use them repeatedly, but each successive attempt increases the chance the victim dies on the next attempt. #N You only get rewards if you stop the torture before the victim dies.#! Victims with a longer [POD_health_track|E] or higher [soak_damage|E] may last longer.\n\nThe following torture methods are available by default:\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_true_relief')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_heal_superficial')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_heal_aggravated')]\n\nFurther methods are unlocked with [perks|E]:\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_blademaster')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_prowess')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_physique')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_torturer')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_dollmaker')]"
 game_concept_possessed_stalk_desc: "#bold Stalk#! is a [journey|E] available to #TOOLTIP:GAME_TRAIT,fomori,[GetNullCharacter] #L Twisted Slashers#!#!. It can only be used on their [preferred_victims_with_icon|E].\n\nAfter pursuing their victim, the Slasher starts a lethal [pod_combat_encounter_with_icon|E]. If the Slasher wins, they get to perform elaborate torture on the victim.\n\nWIP\n\nThe following torture methods are available by default:\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_true_relief')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_heal_superficial')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_heal_aggravated')]\n\nFurther methods are unlocked with [perks|E]:\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_blademaster')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_prowess')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_physique')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_torturer')]\n$BULLET_WITH_TAB$[PODStalkOption('POD_stalk_dollmaker')]"
 
 game_concept_preferred_victim: "Preferred Victim"
 game_concept_preferred_victims: "Preferred Victims"
 game_concept_preferred_victim_with_icon: "@feud_icon!Preferred Victim"
 game_concept_preferred_victims_with_icon: "@feud_icon!Preferred Victims"
 game_concept_preferred_victim_desc: "#TOOLTIP:GAME_TRAIT,fomori,[GetNullCharacter] #L Twisted Slashers#!#! can only gain [true_relief_with_icon|E] after successfully [possessed_stalking_with_icon|E] their #bold $game_concept_preferred_victims_with_icon$#!.\n\nWhen you first gain the [GetPerk('possessed_slasher_perk').GetName(GetNullCharacter)] [perk|E], you choose one [splat|E] trait or $POD_splat_vampire$ $pod_clan$ to be your preferred victim. You can #italic optionally#! pick two more traits with the #V $POD_possessed_slasher_additional_victims_decision$#! [decision|E], which includes personality, congenital, or crime traits.\n\nPreferred victims are treated as hostile [splats|E], meaning you can #N no longer perform friendly actions with them#! (unless they're your [coterie|E] members)."


