 ravages_of_the_beast_perk_name: "Ravages of the Beast"
 weight_of_the_sun_perk_name: "Weight of the Sun"
 abated_tooth_perk_name: "Abated Tooth"
 treacherous_bonds_perk_name: "Treacherous Bonds"
 the_withering_of_ages_perk_name: "The Withering of Ages"
 
 RAVAGES_OF_THE_BEAST_PERK_EFFECT: "[bs_spell|E]: Force a target $POD_splat_vampire$ to Frenzy.\n#flavor From the moment a Kindred is Embraced, he suffers the rage and instincts of a primal Beast; it is the fi rst bane to accompany the Change. If provoked, the Beast Within sends a vampire into a mindless, berserk frenzy. Some Kindred struggle to keep their Beasts in check, while others enjoy riding the waves of this violent rage. A thaumaturge invoking this power coaxes the Beast to surface within his target, unleashing a rampant killer.#!"
 WEIGHT_OF_THE_SUN_PERK_EFFECT: "[bs_spell|E]: Give target $POD_splat_vampire$ [GetModifier('weight_of_the_sun_modifier').GetNameWithTooltip].\n#flavor A concomitant curse of the Embrace is an inability to remain awake during the daytime. Forced to maintain a surreptitious existence at night, a Kindred loses the opportunity to ever again see the sun. As that fiery-white globe rises in the east, Kindred feel its pressing weight as it drives them down into slumber. This power allows a thaumaturge to invoke the same type of lethargy that the sun imposes during the long hours of the day.#!"
 ABATED_TOOTH_PERK_EFFECT: "[bs_spell|E]: Give target $POD_splat_vampire$ [GetModifier('abated_tooth_modifier').GetNameWithTooltip].\n#flavor All vampires require blood to survive; they depend on mortal vessels for sustenance and the Kiss to maintain their unlives. When Kindred do feed, they usually extend their fangs, to more easily pierce their victim's flesh. By invoking this power, a thaumaturge mystically dulls a subject's fangs, robbing him of the ability to use them effectively. His fangs become so severely blunted that it becomes nearly impossible to effectively pierce flesh,causing affected Kindred to search for alternate methods of feeding.#!"
 TREACHEROUS_BONDS_PERK_EFFECT: "[bs_spell|E]: A random $POD_splat_ghoul$ or Childe of target will lose #N 20#! [opinion|E] of them.\n#flavor The thaumaturge invoking this power incites an instantaneous, hate-induced emotional state within a regnant's thrall;where once there was love, now only loathing drives his emotions. This power creates a backlash in the target's blood, temporarily twisting any bonds he is under, from the newest to ones built over years' time.#!"
 THE_WITHERING_OF_AGES_PERK_EFFECT: "At the start of battle, give [GetModifier('the_withering_of_ages_modifier').GetNameWithTooltip] to 3 random $POD_splat_vampire$ [knights|E] when acting as a [commander|E] during the [combat_phase|E].\n#flavor This devastating power warps the blood within vampires, temporarily suspending the properties sustaining their immortality. A thaumaturge making physical contact with a victim may strip her of her agelessness and render her briefly decrepit. Within moments, the body of the target will reveal the truth of her true age, shriveling and shrinking to reflect the weight of her years.#!"

