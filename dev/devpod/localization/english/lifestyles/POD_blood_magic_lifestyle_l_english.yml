 COMMUTA_PERK_EFFECT: "#flavor With a flick of the hand and ritualistic vitae-letting, caster can use his vitae to 'freeze' liquids into solid or let solids flow like liquid.#!"
 CONFORMA_PERK_EFFECT: "Improve #V $basic_node_general_improvment_loca$#! [crafting_forging|E] [crafting_node|E] by increasing chance for [modifier|E] by #P +50%#! but also giving [PlayerBlood('(CFixedPoint)1')] cost#!\n#flavor The thaumaturge may by rousing his vitae slowly shape objects form in small but important ways like sharpening a blade or adding decorative engravings.#!"
 SCINDE_PERK_EFFECT: "[reforge|E] and [repair|E] [artifact|E] Cost: #P -50%#!.\n#flavor This power allows caster to completely reshape an inanimate object to his will, the process is very slow but allows for great changes in form like morphing a sword into shield.#!"
 MUTATE_PERK_EFFECT: "#flavor By power of mutate, thaumaturge may subtly change the very elemental structure of an inanimate natural object. From iron to steel, or vice-versa. It is impossible to affect manmade objects like coins or silverware.#!"
 TRANSMUTATE_PERK_EFFECT: "[bs_spell|E]: Gain [gold_i|E]25 [gold|E] at cost of [PlayerBloodValue('bs_transmutate_cost')], [piety_i]20 [piety|E] and [prestige_i]20 [prestige|E]\n#flavor The pinnacle of alchemy, transmute allows caster to change elemental structure of an inanimate object, as well as changing it shape in a singular motion. From a lump of lead into several golden coins. Unfortunately, the process  of complete transmutation is highly taxing on the object itself causing irreparable damage leading to it crumbling  into useless dust after few weeks.#!"

 summon_the_simplest_form_perk_name: "Summon The Simplest Form"
 bs_permanency_perk_name: "Permanency"
 magic_of_the_smith_perk_name: "Magic of The Smith"
 reverse_conjuration_perk_name: "Reverse Conjuration"
 power_over_life_perk_name: "Power Over Life"

 SUMMON_THE_SIMPLEST_FORM_PERK_EFFECT: "[bs_spell|E]: Gain a $POD_rarity_common$ [artifact|E] with #V 5#! max [durability|E] at cost of [PlayerBloodValue('bs_summon_the_simplest_form_cost')].\n#flavor At this level of mastery, the conjurer may create simple, inanimate objects. The object cannot have any moving parts and may not be made of multiple materials.#!"
 BS_PERMANENCY_PERK_EFFECT: "Improve [GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)] [bs_spell|E] by increasing max [durability|E] to #V 25#!.\n#flavor At this level, the conjurer no longer needs to pay Willpower costs to keep an object in existence. The object is permanent, though simple objects are still all that may be created.#!"
 MAGIC_OF_THE_SMITH_PERK_EFFECT: "Improve [GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)] [bs_spell|E] by gaining $POD_rarity_masterwork$ [artifact|E] instead.\n#flavor The Kindred may now conjure complex objects of multiple components and with moving parts as well with more exotic materials which 'undergone' more complex tempering.#!"
 REVERSE_CONJURATION_PERK_EFFECT: "Upon destruction of an [artifact|E] gained via [GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)] [bs_spell|E], recover half the $POD_energy_blood_icon$ used to create it in first place.\n#flavor This power allows the conjurer to “banish” into non-existence any object previously called forth via this path.#!"
 POWER_OVER_LIFE_PERK_EFFECT: "[bs_spell|E]: Spawn an [army|E] of #V 150#! [GetMaA('animal_simulacra').GetName] for duration of [war|E] at cost of [PlayerBloodValue('bs_power_over_life_cost')].\n#flavor This power cannot create true life, though it can summon forth impressive simulacra. Creatures summoned with this power lack the free will to act on their own, mindlessly following the simple instructions of their conjurer instead.#!"
 
 contradict_perk_name: "Contradict"
 subvert_perk_name: "Subvert"
 dissociate_perk_name: "Dissociate"
 addiction_perk_name: "Addiction"
 dependence_perk_name: "Dependence"

 CONTRADICT_PERK_EFFECT: "[bs_spell|E]: Give [GetModifier('contradict_modifier').GetNameWithTooltip] at cost of [PlayerBloodValue('bs_contradict_cost')].\n#flavor The vampire can interrupt a subject's thought processes, forcing the victim to reverse his current course of action. The results of Contradict are never precisely known to the thaumaturge in advance, but they always take the form of a more negative action than the subject had originally intended to perform.#!"
 SUBVERT_PERK_EFFECT: "[bs_spell|E]: Cause target to lose [prestige_i]100 [prestige|E] and [piety_i]100 [piety|E] at cost of [PlayerBloodValue('bs_subvert_cost')].\n#flavor This power follows the same principle as does Contradict, the release of a subject's dark, self-destructive side. However, Subvert's effects are longer-lasting than the momentary flare of Contradiction. Under the influence of this power, victims act on their own suppressed temptations, pursuing agendas that their morals or self-control would forbid them to follow under normal circumstances.#!"
 DISSOCIATE_PERK_EFFECT: "[bs_spell|E]: Downgrade a random [relation|E] of target as long neither side has strong mental defenses at cost of [PlayerBloodValue('bs_dissociate_cost')].\n#flavor “Divide and conquer” is a maxim that is well-understood by the Tremere, and Dissociate is a powerful tool with which to divide the Clan's enemies. This power is used to break the social ties of interpersonal relationships. Even the most passionate affair or the oldest friendship can be cooled through use of Dissociate, and weaker personal ties can be destroyed altogether.#!"
 ADDICTION_PERK_EFFECT: "[bs_spell|E]: Give target random fitting negative coping [trait|E] at cost of [PlayerBloodValue('bs_addiction_cost')].\n#flavor This power is a much stronger and more potentially damaging form of Subvert. Addiction creates just that in the victim. By simply exposing the target to a particular sensation, substance, or action, the caster creates a powerful psychological dependence.#!"
 DEPENDENCE_PERK_EFFECT: "[courtiers|E] with strong mental defenses will automatically rejoin your [court|E] upon leaving.\n#flavor Many former pawns of Clan Tremere claim to have felt a strange sensation similar to depression when not in the presence of their masters. This is usually attributed to the blood bond, but is sometimes the result of the vampire's mastery of Dependence. The final power of the Path of Corruption enables the vampire to tie her victim's soul to her own, engendering feelings of lethargy and helplessness when the victim is not in her presence or acting to further her desires.#!"

 readiness_perk_name: "Readiness"
 centering_perk_name: "Centering"
 one_tracked_mind_perk_name: "One-Tracked Mind"
 dual_thought_perk_name: "Dual Thought"
 perfect_clarity_perk_name: "Perfect Clarity"

 READINESS_PERK_EFFECT: "[bs_spell|E]: Gain [GetModifier('readiness_modifier').GetNameWithTooltip] at cost of [PlayerBloodValue('bs_contradict_cost')].\n#flavor Using Readiness makes the caster able to gain a quicker understanding on a predicament. Enhanced lucidity enlightens the caster, allowing better reactions to changing situations and increased cleverness.#!"
 CENTERING_PERK_EFFECT: "[bs_spell|E]: Make target lose #P @stress_loss_icon!20#! [static_stress|E], #V 10#! if self-targeted.\n#flavor By invoking this power, the thaumaturge causes a sudden, intense calmness in the subject by whispering soothing words to her. While under this serenity, the target is able to better focus on tasks at hand, ignoring distractions and annoyances, including grave bodily harm.#!"
 ONE_TRACKED_MIND_PERK_EFFECT: "Reduce the difficulty of [skill|E] checks in [infiltration_missions|E] by #P 5#!.\n#flavor By extending his powers to other individuals, the thaumaturge is able to fixate the subject on one action. This single-mindedness of the target is such that they ignore everything else that occurs around them. Guards are easily distracted with this power, as their attention becomes fixated elsewhere, and research becomes a dedicated, focused task.#!"
 DUAL_THOUGHT_PERK_EFFECT: "Improve [GetPerk('readiness_perk').GetName(GetNullCharacter)] [bs_spell|E] by instead giving [GetModifier('dual_thought_modifier').GetNameWithTooltip].\n#flavor With the rigors of concentration required to learn Thaumaturgy, many Tremere are able to take quick and complete control of a situation. With this power, the thaumaturge is able to divide his attention to two completely separate tasks without problems.#!"
 PERFECT_CLARITY_PERK_EFFECT: "Improve [GetPerk('readiness_perk').GetName(GetNullCharacter)] [bs_spell|E] by instead giving [GetModifier('perfect_clarity_modifier').GetNameWithTooltip].\n#flavor Perfect Clarity brings about a Zen-like moment of unimpeded insight for the thaumaturge. Pure focus is achieved, thought and action become one, and complete serenity of mind descends upon the Kindred magus. This lucidity protects the thaumaturge from influences both internal and external; even the Beast within is unable to rage forth.#!"

 warcry_perk_name: "Warcry"
 strike_true_perk_name: "Strike True"
 wind_dance_perk_name: "Wind Dance"
 fearless_heart_perk_name: "Fearless Heart"
 comrades_at_arms_perk_name: "Comrades at Arms"

 WARCRY_PERK_EFFECT: "#flavor A vampire on the attack can focus his will, making him less susceptible to battle fear or the powers of the undead. The vampire shouts a primal scream to start the effect, though some thaumaturges have been known to paint their faces or cut themselves open instead.#!"
 STRIKE_TRUE_PERK_EFFECT: "#flavor The vampire makes a single attack, guided by the unholy power of her Blood. This attack strikes its foe infallibly.#!"
 WIND_DANCE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_blood_surge')].\n#flavor The thaumaturge invokes the power of the winds, moving in a blur. She gains a preternatural edge in avoiding her enemies' blows, moving out of their way before the enemy has a chance to throw them.#!"
 FEARLESS_HEART_PERK_EFFECT: "#flavor The vampire temporarily augments his abilities as a warrior. Through the mystical powers of blood magic, the character becomes a potent fighting force.#!"
 COMRADES_AT_ARMS_PERK_EFFECT: "All [coterie|E] members will gain the same benefits of this path as you. This does not stack.\n#flavor This ability extends the power of the previous abilities in the path. It allows any of the earlier effects to be applied to a group such as a pack or War Party.#!"

 hermetic_sight_perk_name: "Hermetic Sight"
 astral_chant_perk_name: "Astral Chant"
 voice_of_command_perk_name: "Voice of Command"
 entrap_ephemera_perk_name: "Entrap Ephemera"
 duality_perk_name: "Duality"

 HERMETIC_SIGHT_PERK_EFFECT: "Can interact with being in [umbra|E] while on earth.\n#flavor The vampire can perceive the spirit world, either by gazing deeply into it or by seeing the presence of nearby spirits as a hazy overlay on the material world.#!"
 ASTRAL_CHANT_PERK_EFFECT: "Allows forming a [spirit_pact|E] without knowing the language at cost of #N -30#! acceptance.\n#flavor The languages of the spirit world are infinitely varied and mainly incomprehensible to mortal (and immortal) minds. Astral Cant does not teach the thaumaturge the tongues of the spirits, but it does allow him to understand them as they speak to him and to reply in their own languages.#!"
 VOICE_OF_COMMAND_PERK_EFFECT: "#flavor This is perhaps the most dangerous power in the Spirit Manipulation arsenal, for the consequences of failure can be particularly unpleasant. Voice of Command allows the thaumaturge to issue orders to a spirit, compelling it to heed her bidding whether or not it desires to do so.#!"
 ENTRAP_EPHEMERA_PERK_EFFECT: "Can use [fetish|E] [artifacts|E].\n#flavor This power allows a thaumaturge to bind a spirit into a physical object. This can be done to imprison the target, but is more often performed to create a fetish — an artifact that grants mystical benefits powered by the spirit. Fetishes created by this power are often unreliable and fail at inopportune moments, as the spirits within are understandably displeased with their situation and will take any opportunity to escape or thwart their captors.#!"
 DUALITY_PERK_EFFECT: "Remove the cost of entering the [umbra|E].\n#flavor The thaumaturge can now fully interact with the spirit world — a strange place that only sometimes resembles the real world. While using this power, she exists on both planes of existence at once. She is able to pick up objects in the physical world and place them in the spirit world and vice versa. Beings and landscape features in both realms are solid to her, and she can engage in any manner of interaction. She can even use Thaumaturgy and other Disciplines in either world.#!"

 vertigo_perk_name: "Vertigo"
 contortion_perk_name: "Contortion"
 seizure_perk_name: "Seizure"
 body_failure_perk_name: "Body Failure"
 blood_marionette_perk_name: "Marionette"

 VERTIGO_PERK_EFFECT: "Upon successfully wounding victim, give them [GetModifier('vertigo_modifier').GetNameWithTooltip] for 1 year.\n#flavor The thaumaturge induces minor disorientation and dizziness through subtle manipulations in the subject's body. The physical discomfort is temporary and minor, but a clever thaumaturge can use it on rivals at the most inopportune times, causing them to lose their aplomb.#!"
 CONTORTION_PERK_EFFECT: "Improve [GetPerk('vertigo_perk').GetName(GetNullCharacter)] by instead giving [GetModifier('contortion_modifier').GetNameWithTooltip].\n.#flavor With a touch, the thaumaturge causes a group of her opponent's muscles to contract involuntarily, reducing it to twitching fits. This effect is extremely disconcerting to the subject, rendering the limb or muscle group unusable.#!"
 SEIZURE_PERK_EFFECT: "Improve [GetPerk('vertigo_perk').GetName(GetNullCharacter)] by instead giving [GetModifier('seizure_modifier').GetNameWithTooltip].\n#flavor Seizure causes the body to erupt into a fit of convulsions. All the muscles throughout the body tighten uncontrollably, while the victim foams at the mouth and spasms rack him with agony. A mortal may even choke to death as her tongue cuts off her air supply.#!"
 BODY_FAILURE_PERK_EFFECT: "You gain an increased chance to wound enemy [knights|E] during a [combat_phase|E] as a [knight|E].\n#flavor Thaumaturges wielding this frightful power gain devastating insights into the workings of the body, allowing a complete shutdown of its systems. This sudden biological overload often proves fatal to mortals and damaging to other supernatural beings.#!"
 BLOOD_MARIONETTE_PERK_EFFECT: "At the start of battle, remove a random enemy [knight|E] from the battle.\n#flavor The thaumaturge invoking Marionette gains such mastery over the body of others that she can magically seize control of another being and force her victim to act according to her own whims. This control is not as fine as the direct and personal command of the Dominate power of Possession, but the thaumaturge's true body is not as vulnerable during the manipulation.#!"

 control_fog_perk_name: "Control Fog"
 manipulate_rain_perk_name: "Control Rain"
 command_wind_perk_name: "Control Wind"
 summon_storm_perk_name: "Control Storm"
 dominate_lightning_perk_name: "Control Lightning"

 CONTROL_FOG_PERK_EFFECT: "Give [GetModifier('control_fog_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E].\n[PODUnlocksCombatMove('POD_combat_move_weather_control')].\n#flavor The thaumaturge may convert his vitae into a thin fog which quickly grows in size utilizing everything nearby as 'fuel'#!"
 MANIPULATE_RAIN_PERK_EFFECT: "Improve [GetPerk('control_fog_perk').GetName(GetNullCharacter)] battle [modifier|E] by instead giving [GetModifier('manipulate_rain_modifier').GetNameWithTooltip].\n#flavor By utilizing the unnatural power of blood, kindred may manipulate clouds in the heavens to start raining, or vice-versa.#!"
 COMMAND_WIND_PERK_EFFECT: "Improve [GetPerk('control_fog_perk').GetName(GetNullCharacter)] battle [modifier|E] by instead giving [GetModifier('command_wind_modifier').GetNameWithTooltip].\n[PODImprovesCombatMove('POD_combat_move_weather_control')].\n#flavor The vampire may, after quite tedious ritual, issue a single command to nearby winds, increasing their potency up to 50 kilometers per hour. Each further command requires an additional exposure of vitae and willpower.#!"
 SUMMON_STORM_PERK_EFFECT: "Improve [GetPerk('control_fog_perk').GetName(GetNullCharacter)] battle [modifier|E] by instead giving [GetModifier('summon_storm_modifier').GetNameWithTooltip].\n#flavor By calling upon the innate power of blood, caster may summon a potent storm from the clear sky. After storm is summoned it escapes any attempts at further control or mitigation until it end by itself.#!"
 DOMINATE_LIGHTNING_PERK_EFFECT: "Improve [GetPerk('control_fog_perk').GetName(GetNullCharacter)] battle [modifier|E] by instead giving [GetModifier('dominate_lightning_modifier').GetNameWithTooltip].\n[PODImprovesCombatMove('POD_combat_move_weather_control')].\n#flavor With this power a highly skilled thaumaturge may call upon a lightning to strike his enemies; regardless of the weather,or any outside conditions.#!"

 elemental_strength_perk_name: "Elemental Strength"
 wooden_tongues_perk_name: "Wooden Tongues"
 animate_the_unmoving_perk_name: "Animate The Unmoving"
 elemental_form_perk_name: "Elemental Form"
 summon_elemental_perk_name: "Summon Elemental"

 ELEMENTAL_STRENGTH_PERK_EFFECT: "#flavor The vampire can draw upon the strength and resilience of the earth, or of the objects around him, to increase his physical prowess without the need for large amounts of blood.#!"
 WOODEN_TONGUES_PERK_EFFECT: "#flavor A vampire may speak, albeit in limited fashion, with the spirit of any inanimate object. The conversation may not be incredibly interesting, as most rocks and chairs have limited concern for what occurs around them, but the vampire can get at least a general impression of what the subject has 'experienced'.#!"
 ANIMATE_THE_UNMOVING_PERK_EFFECT: "Unlock [GetMaA('golems').GetName] as [men_at_arms|E].\n#flavor Objects affected by this power move as the vampire using it dictates. An object cannot take an action that would be completely inconceivable for something with its form — for instance, a door could not leap from its hinges and carry someone across a street#!"
 ELEMENTAL_FORM_PERK_EFFECT: "#flavor The vampire can take the shape of any inanimate object of a mass roughly equal to her own. A desk, a statue, or a carriage would be feasible, but a house or a pen would be beyond this power's capacity.#!"
 SUMMON_ELEMENTAL_PERK_EFFECT: "Unlock [GetMaA('fire_elemental').GetName], [GetMaA('air_elemental').GetName], [GetMaA('earth_elemental').GetName] and [GetMaA('water_elemental').GetName] as [men_at_arms|E].\n#flavor A vampire may summon one of the traditional spirits of the elements: a salamander (fire), a sylph (air), a gnome (earth), or an undine (water). The caster may choose what type of elemental he wishes to summon and command.#!"

 bs_a_taste_for_blood_perk_name: "A Taste For Blood"
 blood_rage_perk_name: "Blood Rage"
 bs_blood_of_potency_perk_name: "Blood of Potency"
 bs_theft_of_vitae_perk_name: "Theft of Vitae"
 bs_cauldron_of_blood_perk_name: "Cauldron of Blood"

 BS_A_TASTE_FOR_BLOOD_PERK_EFFECT: "[bs_spell|E]: Discover [Glossary('Diablerist','game_concept_diablerie_desc')] [secret|E] of target, if they have it, at cost of [PlayerBloodValue('bs_a_taste_for_blood_cost')].\n#flavor This power was developed as a means of testing a foe's might — an extremely important ability in the tumultuous early nights of Clan Tremere. By merely touching the blood of his subject, the caster may determine how much vitae remains in the subject and, if the subject is a vampire, how recently he has fed and his approximate Generation.#!"
 BLOOD_RAGE_PERK_EFFECT: "[bs_spell|E]: Gain or Lose [GetModifier('blood_rage_modifier').GetNameWithTooltip] at cost of [PlayerBloodValue('bs_blood_rage_cost')].\n#flavor This power allows a vampire to force another Kindred to expend blood against his will. The caster must touch her subject for this power to work, though only the lightest contact is necessary. A vampire affected by this power might feel a physical rush as the thaumaturge heightens his Physical Attributes, might find himself suddenly looking more human, or may even find himself on the brink of frenzy as his stores of vitae are mystically depleted.#!"
 BS_BLOOD_OF_POTENCY_PERK_EFFECT: "[bs_spell|E]: Increase your bloods potency by #V 1#! for 10 years at cost of [PlayerBloodValue('bs_blood_of_potency_cost')].\n#flavor The thaumaturge gains such control over his own blood that he may effectively 'concentrate' it, making it more powerful for a short time. In effect, he may temporarily increase his own Blood Potency with this power.#!"
 BS_THEFT_OF_VITAE_PERK_EFFECT: "#P -1#! blood needed to slake [hunger_with_icon|E].\n#flavor A thaumaturge using this power siphons vitae from her subject. She need never come in contact with the subject — blood literally streams out in a physical torrent from the subject to the Kindred (though it is often mystically absorbed and need not enter through the mouth).#!"
 BS_CAULDRON_OF_BLOOD_PERK_EFFECT: "Inflict #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0]#! [POD_aggravated_damage|E] to #V 3#! random enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E].\n#flavor A thaumaturge using this power boils her subject's blood in his veins like water on a stove. The Kindred must touch her subject, and it is this contact that simmers the subject's blood. This power is always fatal to mortals, and causes great damage to even the mightiest vampires.#!"

 eyes_of_the_sea_perk_name: "Eyes of The Sea"
 prison_of_water_perk_name: "Prison of Water"
 blood_to_water_perk_name: "Blood to Water"
 flowing_wall_perk_name: "Flowing Wall"
 dehydrate_perk_name: "Dehydrate"

 EYES_OF_THE_SEA_PERK_EFFECT: "#flavor The thaumaturge may peer into a body of water and view events that have transpired on, in, or around it from the water's perspective. Some older practitioners of this art claim that the vampire communes with the spirits of the waters when using this power; younger Kindred scoff at such claims.#!"
 PRISON_OF_WATER_PERK_EFFECT: "[bs_spell|E]: Start an [pod_combat_encounters_with_icon|E] against target, if you win you will [imprison|E] at cost of [PlayerBloodValue('bs_a_taste_for_blood_cost')] and [prestige_i|E]#N 2000#! [prestige|E].\n#flavor The thaumaturge can command a sufficiently large quantity of water to animate itself and imprison a subject. This power requires a significant amount of fluid to be fully effective.#!"
 BLOOD_TO_WATER_PERK_EFFECT: "[bs_spell|E]: Cause $POD_splat_vampire$ to gain #N 3$POD_energy_blood_icon$#!(Cause Blood loss for other [splats|E]) at cost of [PlayerBloodValue('bs_blood_to_water_cost')].\n#flavor The thaumaturge has now attained enough power over water that she can transmute other liquids to this basic element. The most commonly seen use of this power is as an assault; with but a touch, the victim's blood transforms to water, weakening vampires and killing mortals in moments.#!"
 FLOWING_WALL_PERK_EFFECT: "#flavor Tales of vampires' inability to cross running water may have derived in part from garbled accounts of this power in action. The thaumaturge can animate water to an even greater degree than is possible with the use of Prison of Water, commanding it to rise up to form a barrier impassable to almost any being.#!"
 DEHYDRATE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_dehydrate')].\n#flavor At this level of mastery, the thaumaturge can directly attack living and unliving targets by removing the water from their bodies. Victims killed by this power leave behind hideous mummified corpses.#!"

 simple_nectar_perk_name: "Simple Nectar"
 nectar_perk_name: "Nectar"
 complex_nectar_perk_name: "Complex Nectar"
 high_nectar_perk_name: "High Nectar"
 ungodly_nectar_perk_name: "Ungodly Nectar"

 SIMPLE_NECTAR_PERK_EFFECT: "As a [bs_spell|E], force the target to learn your $pod_discipline$ perks up to 1 dot.\n#weak By brewing a potion out of his own $pod_vitae$, the rakta-sadhu can imbue the drinker with one level of a discipline or path#!"
 NECTAR_PERK_EFFECT: "Increases the effect of the [GetPerk('simple_nectar_perk').GetName(GetPlayer)] [bs_spell|E] to 2 dots.\n#weak By brewing a potion out of his own $pod_vitae$, the rakta-sadhu can imbue the drinker with two levels of a discipline or path#!"
 COMPLEX_NECTAR_PERK_EFFECT: "Increases the effect of the [GetPerk('nectar_perk').GetName(GetPlayer)] [bs_spell|E] to 3 dots.\n#weak By brewing a potion out of his own $pod_vitae$, the rakta-sadhu can imbue the drinker with three levels of a discipline or path#!"
 HIGH_NECTAR_PERK_EFFECT: "Increases the effect of the [GetPerk('complex_nectar_perk').GetName(GetPlayer)] [bs_spell|E] to 4 dots.\n#weak By brewing a potion out of his own $pod_vitae$, the rakta-sadhu can imbue the drinker with four levels of a discipline or path#!"
 UNGODLY_NECTAR_PERK_EFFECT: "Increases the effect of the [GetPerk('high_nectar_perk').GetName(GetPlayer)] [bs_spell|E] to 5 dots.\n#weak By brewing a potion out of his own $pod_vitae$, the rakta-sadhu can imbue the drinker with five levels of a discipline or path#!"

 a_sending_of_serpents_perk_name: "A Sending of Serpents"
 darkness_of_duat_perk_name: "Darkness of Duat"
 suffocation_of_the_tomb_perk_name: "Suffocation of The Tomb"
 the_narrow_house_perk_name: "The Narrow House"
 consignment_to_duat_perk_name: "Consignment to Duat"

 A_SENDING_OF_SERPENTS_PERK_EFFECT: "Give [GetModifier('a_sending_of_serpents_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#weak Cause a target to hallucinate being attacked by snakes.#!"
 DARKNESS_OF_DUAT_PERK_EFFECT: "As a [bs_spell|E], give the target [GetTrait('blind').GetName(GetPlayer)] for 5 years.\n#weak Blind a subject.#!"
 SUFFOCATION_OF_THE_TOMB_PERK_EFFECT: "As a [bs_spell|E], give the target [GetModifier('suffocation_of_the_tomb_modifier').GetNameWithTooltip] for 1 year.\n#weak Render victim unable to speak or breathe.#!"
 THE_NARROW_HOUSE_PERK_EFFECT: "Give [GetModifier('the_narrow_house_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E]\n#weak Paralyze a target.#!"
 CONSIGNMENT_TO_DUAT_PERK_EFFECT: "As a [bs_spell|E], kill a non-immortal character, or force an immortal character into [GetTrait('torpor').GetName(GetPlayer)].\n#weak Slay a mortal or put a vampire into torpor.#!"

 whispers_of_the_sands_perk_name: "Whispers of The Sand"
 tongue_of_the_tempter_perk_name: "Tongue of The Tempter"
 voice_of_the_prophet_perk_name: "Voice of The Prophet"
 lord_of_storms_perk_name: "Lord of Storms"
 dark_invocation_perk_name: "Dark Invocation"

 WHISPERS_OF_THE_SANDS_PERK_EFFECT: "#weak Communicate remotely with one's childer or ghouls.#!"
 TONGUE_OF_THE_TEMPTER_PERK_EFFECT: "As a [bs_spell|E], learn a [secret|E] of the target.\n#weak Cause a subject to reveal a secret fear or desire.#!"
 VOICE_OF_THE_PROPHET_PERK_EFFECT: "As a [bs_spell|E], cause the target to gain opinion of you and lose [piety|E] and [prestige|E].\n#weak Deliver a cryptic message that speaks to a listener's deepest desires.#!"
 LORD_OF_STORMS_PERK_EFFECT: "Give [GetModifier('lord_of_storms_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E]\n#weak Summon a sandstorm or thunderstorm.#!"
 DARK_INVOCATION_PERK_EFFECT: "#weak Place a protective curse on an object or place.#!"

 beauty_fades_perk_name: "Beauty Fades"
 trust_withers_perk_name: "Trust Withers"
 love_dies_perk_name: "Love Dies"
 hope_dissolves_perk_name: "Hope Dissolves"
 thrones_crumble_perk_name: "Thrones Crumble"

 BEAUTY_FADES_PERK_EFFECT: "As a [bs_spell|E], give the target 50 [stress|E].\n#weak Cause a work of art to cause revulsion in those who view it.#!"
 TRUST_WITHERS_PERK_EFFECT: "As a [bs_spell|E], the target loses a random [friend|E] relation, or downgrades a [best_friend|E] into a [friend|E].\n#weak Target begins to believe a friend or ally is planning to betray him.#!"
 LOVE_DIES_PERK_EFFECT: "As a [bs_spell|E], the target loses a random [lover|E] relation, or downgrades a [soulmate|E] into a potential lover.\n#weak Destroy a subject's feelings of love for another.#!"
 HOPE_DISSOLVES_PERK_EFFECT: "Increases the [stress|E] gain from the [GetPerk('beauty_fades_perk').GetName(GetPlayer)] [bs_spell|E] to 100.\n#weak Cause a subject to become depressed, believing their goals cannot be obtained.#!"
 THRONES_CRUMBLE_PERK_EFFECT: "As a [bs_spell|E], give the target [GetModifier('thrones_crumble_modifier').GetNameWithTooltip].\n#weak Create mistrust and hostility in a subject towards a figure of authority.#!"

 first_taste_perk_name: "First Taste"
 cross_addiction_perk_name: "Cross-Addiction"
 the_jones_perk_name: "The Jones"
 fatal_compulsion_perk_name: "Fatal Compulsion"
 temperance_perk_name: "Temperance"

 FIRST_TASTE_PERK_EFFECT: "As a [bs_spell|E], give the target [GetModifier('first_taste_modifier').GetNameWithTooltip] for 20 years.\n#weak Create a pleasurable association with a minor, repetitive action.#!"
 CROSS_ADDICTION_PERK_EFFECT: "Increases the success chance of the [GetPerk('first_taste_perk').GetName(GetPlayer)] [bs_spell|E].\n#weak Temporarily change what an addict is fixated on.#!"
 THE_JONES_PERK_EFFECT: "As a [bs_spell|E], cause a target affected by [GetModifier('first_taste_modifier').GetNameWithTooltip] to lose [piety|E] and [prestige|E].\n#weak Remove a subject's inhibitions from indulging their addiction.#!"
 FATAL_COMPULSION_PERK_EFFECT: "As a [bs_spell|E], cause a target affected by [GetModifier('first_taste_modifier').GetNameWithTooltip] to gain [GetModifier('fatal_compulsion_modifier').GetNameWithTooltip] for 5 years instead.\n#weak Cause a target to suffer harm from not indulging their addiction.#!"
 TEMPERANCE_PERK_EFFECT: "As a [bs_spell|E], cause a target affected by [GetModifier('first_taste_modifier').GetNameWithTooltip] to become [GetTrait('depressed_1').GetName(GetPlayer)].\n#weak Render subject unable to draw pleasure from their addiction.#!"


##Koldunic
#Transylvanian Kraina
 burebistas_throne_perk_name: "Burebista's Throne"
 BUREBISTAS_THRONE_PERK_EFFECT: "#flavor King Burebista, who terrorized the Greeks for centuries built a great throne atop a mountain peek from which he could survey all his lands and enemies. Burebista no longer needed his throne and passed it on to his Koldun childer.#!"
 pietrosus_hospitality_perk_name: "Pietrosu's Hospitality"
 PIETROSUS_HOSPITALITY_PERK_EFFECT: "#flavor Mount Pietrosu's biting winds and frigid temperatures will kill an unprotected man in mere moments. The Koldun summons these powerful and frigid winds to surround him, harming everyone nearby. This also makes him immune to cold and the force of winds.#!"
 the_banks_of_the_basca_perk_name: "The Banks of The Basca"
 THE_BANKS_OF_THE_BASCA_PERK_EFFECT: "Greatly increases chance to [imprison|E] [characters|E] after a successful [siege|E] or [raid|E] in coastal provinces.\n\n#flavor When the rains come, the Basca leaps its banks and whole villages are swept away, along with any person unwise enough to seek higher ground. The Koldun wielding this power carries with her the surging might of the Basca wherever she goes.#!"
 kupalas_exhalation_perk_name: "Kupala's Exhalation"
 KUPALAS_EXHALATION_PERK_EFFECT: "[bs_spell|E]: Give your location [GetModifier('kupalas_exhalation_modifier').GetNameWithTooltip] for 5 years.\n[kraina|E]: Give it [GetModifier('kupalas_exhalation_modifier2').GetNameWithTooltip] instead.\n\n#flavor The Koldun summons deadly cold gasses from the ground. Any flame can ignite these gases into a terrible explosion. These gases are believed to be the breath of Kupala.#!"
 restless_medias_perk_name: "Restless Medias"
 RESTLESS_MEDIAS_PERK_EFFECT: "[bs_spell|E]: Give your location [GetModifier('weather_magic_earthquake_modifier').GetNameWithTooltip] for 10 years.\n[kraina|E]: Give it to all surrounding counties as well.\n\n#flavor From time to time, the ground beneath the village of Medias will shake and roil, tearing buildings from their moorings. The locals blame the gods, but the Koldun know it is Kupala, restlessly stirring within his earthen tomb. Kolduns with the greatest skill know how to rouse his agitations.#!"

#Black Sea Kraina
 danubian_voices_perk_name: "Danubian Voices"
 DANUBIAN_VOICES_PERK_EFFECT: "#flavor The Koldun know the true value of the Danube. The spirits of the river speak to them, passing on what they know or delivering messages for the Koldun.#!"
 grave_of_the_marea_neagra_perk_name: "Grave of the Marea Neagra"
 GRAVE_OF_THE_MAREA_NEAGRA_PERK_EFFECT: "#flavor The Koldun may always descend safely into the lowest depths of the Black Sea, where she may rest comfortably, protected from the sun and the outside world.#!"
 pontos_euxeinos_perk_name: "Pontos Euxeinos"
 PONTOS_EUXEINOS_PERK_EFFECT: "[bs_spell|E]: Heal [POD_aggravated_damage|E] and non-permanent wounds.\n[kraina|E]: Additionally gain [GetModifier('pontos_euxeinos_modifier').GetNameWithTooltip] for 10 years.\n\n#flavor The Greeks once called the Black Sea Pontos Euxeinos, the Hospitable Sea. For the Koldun of the Black Sea, it truly can be, holding them in its embrace and healing them of even their worst injuries.#!"
 minions_of_deep_marmora_perk_name: "Minions of Deep Marmora"
 MINIONS_OF_DEEP_MARMORA_PERK_EFFECT: "[bs_spell|E]: Summon a regiment of [GetMaA('water_spirits').GetName] to assist you in a war.\n[kraina|E]: Summon an additional regiment.\n\n#flavor Legend says that the Koldun Cyzicus discovered that if he spilled his blood into the Sea of Marmora, strange beasts from the depths would emerge to do his bidding. Other Koldun have found that any body of water serves the same.#!"
 pontos_axeinos_perk_name: "Pontos Axeinos"
 PONTOS_AXEINOS_PERK_EFFECT: "[bs_spell|E]: Reduce a hostile disembarked army's [supplies|E] by #V 20%#!.\n[kraina|E]: Inflict casualties on the army as well.\n\n#flavor Before the Greeks settled its southern shoreline, they called the Black Sea Pontus Axeinos, the Inhospitable Sea. For the enemies of the Koldun, it can be very inhospitable indeed.#!"


#Bialowieza Kraina
 domain_breach_perk_name: "Domain Breach"
 DOMAIN_BREACH_PERK_EFFECT: "#flavor The Koldun is so in tune with his domain that he is able to detect when an intruder makes her way within its borders.#!"
 fingers_of_bialowieza_perk_name: "Fingers of Białowieża"
 FINGERS_OF_BIALOWIEZA_PERK_EFFECT: "[imprison|E] chance: #P +10%#!\nCan recruit [GetMaA('animated_tree').GetName] as [men_at_arms|E].\n\n#flavor The Koldun with this power commands nearby plants and trees to ensnare and potentially immobilize their victims.#!"
 grondrskas_impasse_perk_name: "Grondrska's Impasse"
 GRONDRSKAS_IMPASSE_PERK_EFFECT: "#flavor The tale tells of a poacher who trespassed into Tzimisce lands. It wasn't long before he was fleeing in a dread panic. He thought he knew the forest, but the trees were moving around him, cutting off his exit, herding him directly to the waiting Koldun.#!"
 mouth_of_djabalek_perk_name: "Mouth of Djabalek"
 MOUTH_OF_DJABALEK_PERK_EFFECT: "At the start of battle, remove the lowest [prowess|E] enemy [knight|E] from the battle and feed on them.\n\n#flavor Djabelek is a terrifying Tzimisce buried somewhere within the Białowieza Forest. It is said that somehow he continues to feed despite his torpid state, opening his mouth while dreaming, consuming whatever falls in. The Koldun opens the earth under his victim, sending them down to feed Djabelek.#!"
 the_white_tower_perk_name: "The White Tower"
 THE_WHITE_TOWER_PERK_EFFECT: "#flavor The White Tower is the gift provided by the demons of the earth with whom Djabelek once made his pact. The bones of all the victims of the Białowieza kraina force their way from the earth and cocoon the Koldun in a tower of earth and bone.#!"

#Kraina of the Well
 call_the_children_perk_name: "Call the Children"
 CALL_THE_CHILDREN_PERK_EFFECT: "Can recruit [GetMaA('demonhound').GetName] as [men_at_arms|E].\n\n#flavor In order to command a thing, one should venture to know it. Demons, much like dogs, always endeavor to come when called by their masters.#!"
 heed_the_hell_bound_heart_perk_name: "Heed the Hell-bound Heart"
 HEED_THE_HELL_BOUND_HEART_PERK_EFFECT: "[bs_spell|E]: Give a [GetTrait('demon').GetName(GetPlayer)] or [GetTrait('witch').GetName(GetPlayer)] [GetModifier('heed_the_hell_bound_heart_modifier').GetNameWithTooltip] for 5 years.\n[kraina|E]: Give them [GetModifier('heed_the_hell_bound_heart_modifier2').GetNameWithTooltip] instead.\n\n#flavor Whether by blessing or familiarity, a Koldun who drinks from her Well gains a supernatural sense that alerts her when demonic influence is near.#!"
 aegis_alighieri_perk_name: "Aegis Alighieri"
 AEGIS_ALIGHIERI_PERK_EFFECT: "Gain strong mental defenses against [GetTrait('demon').GetName(GetPlayer)]s and [GetTrait('witch').GetName(GetPlayer)]s.\nGive [GetModifier('aegis_alighieri_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E] if they are a [GetTrait('demon').GetName(GetPlayer)] or [GetTrait('witch').GetName(GetPlayer)].\n\n#flavor Aegis Alighieri shields the Koldun from violating onslaughts, predations, and defilement by demonic forces.#!"
 heave_the_host_of_hell_perk_name: "Heave the Host of Hell"
 HEAVE_THE_HOST_OF_HELL_PERK_EFFECT: "[bs_spell|E]: Inflict #V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0] Fire#! damage to a [GetTrait('demon').GetName(GetPlayer)] or [GetTrait('witch').GetName(GetPlayer)]\n[kraina|E]: Inflict #V [EmptyScope.ScriptValue('POD_double_fire_damage')|V0] Fire#! damage instead.\n\n#flavor After learning to call, to sense, and then to defend against infernal marring, the Koldun may erase its scars entirely.#!"
 reap_the_well_perk_name: "Reap the Well"
 REAP_THE_WELL_PERK_EFFECT: "Can recruit [GetMaA('aughisky').GetName] as [men_at_arms|E].\n\n#flavor The Koldun summons bloodied hooked chains from their hands to bind a demon into his service.#!"


#Kraina of Enoch
 shroud_of_oblivion_perk_name: "Shroud of Oblivion"
 SHROUD_OF_OBLIVION_PERK_EFFECT: "Can interact with characters on the other side of the Shroud.\n\n#flavor The Koldun tears out a piece of the [UmbraGlossary('underworld')]'s fabric to saturate the area around him with its attributes.#!"
 spectral_cloak_perk_name: "Spectral Cloak"
 SPECTRAL_CLOAK_PERK_EFFECT: "#flavor By harnessing the sight of the dead, the Koldun aggrieves those in the vicinity with a glimpse of the world of the dead. The cloak conceals the Koldun and drives away observers in terror#!"
 pond_of_malevolent_dread_perk_name: "Pond of Malevolent Dread"
 POND_OF_MALEVOLENT_DREAD_PERK_EFFECT: "[bs_spell|E]: Summon two regiments of [GetMaA('spectres').GetName] to assist you in a war.\n[kraina|E]: Summon four regiments instead.\n\n#flavor Nestled just above the abyss in the Underworld, no place is more frigid, devoid of light, tenebrous, or bleak than the Sea of Shadows, an ocean of souls on the precipice of total annihilation. The Koldun forms a shaft to sup from the doom of this sea and release its flow.#!"
 wrath_of_the_tempest_perk_name: "Wrath of the Tempest"
 WRATH_OF_THE_TEMPEST_PERK_EFFECT: "[bs_spell|E]: Give a character [stress|E] scaling with how many characters you've killed.\n[kraina|E]: Additionally inflict #V [EmptyScope.ScriptValue('POD_base_lightning_damage')|V0] Lightning#! damage to them.\n\n#flavor The Koldun summons the death rattles of all whom she has vanquished, pricking a hole in the barrier between worlds to let bleed the metaphysical storm.#!"
 hunger_of_the_void_perk_name: "Hunger of the Void"
 HUNGER_OF_THE_VOID_PERK_EFFECT: "[bs_spell|E]: Give your location [GetModifier('hunger_of_the_void_modifier').GetNameWithTooltip] for 10 years.\n[kraina|E]: Additionally drain all [GetTrait('mortal').GetName(GetPlayer)]s in the province.\n\n#flavor The Koldun embodies the distortions of the Tempest, torturing his own soul to cleave a pit of perfect destruction into reality.#!"

#Genius Loci
 genius_loci_1_perk_name: "Minor Genius Loci"
 GENIUS_LOCI_1_PERK_EFFECT: "Increase the success chance of all [krainas|E] by #P +10%#!\n\n#flavor The Koldun extends his awareness through the land upon which he treads.#!\n@warning_icon!#warning Perks from this tree are automatically gained when finishing other [kraina|E] paths.#!"
 genius_loci_2_perk_name: "Standard Genius Loci"
 GENIUS_LOCI_2_PERK_EFFECT: "Increase the success chance of all [krainas|E] by #P +10%#!\nCan use [fetish|E] [artifacts|E].\n\n#flavor The Koldun further extends his awareness, improving his Koldunic powers.#!"
 genius_loci_3_perk_name: "Sustained Genius Loci"
 GENIUS_LOCI_3_PERK_EFFECT: "[krainas|E] and their [bs_rituals|E] cost 1 less @blood_icon! when cast from their empowered location.\n\n#flavor The Koldun's Loci becomes able to sustain itself.#!"
 genius_loci_4_perk_name: "High Genius Loci"
 GENIUS_LOCI_4_PERK_EFFECT: "Increase the success chance of all [krainas|E] by #P +15%#!\n$countermeasures_unlocks_t3_all_seeing_eye$\n\n#flavor The Koldun's Loci sees all.#!"
 genius_loci_5_perk_name: "Genius Loci of Legend"
 GENIUS_LOCI_5_PERK_EFFECT: "[krainas|E] and their [bs_rituals|E] gain an additional effect when cast from their empowered location.\n\n#flavor The Koldun and the land are one.#!"

#Way of Earth
 grasping_soil_perk_name: "Grasping Soil"
 GRASPING_SOIL_PERK_EFFECT: "Give enemy [rulers|E] [GetModifier('grasping_soil_modifier').GetNameWithTooltip] at the start of a [war|E].\n\n#flavor The Koldun commands the earth to rise in a spray of dirt and crawl up a victim's legs, rendering them immobile.#!"
 endurance_of_stone_perk_name: "Endurance of Stone"
 ENDURANCE_OF_STONE_PERK_EFFECT: "#flavor Drawing the essence of earth into himself, the Koldun may gain a measure of its preternatural resilience#!"
 hungry_earth_perk_name: "Hungry Earth"
 HUNGRY_EARTH_PERK_EFFECT: "#flavor The Koldun drags their victim into the earth and crushes them with its pitiless grip.#!"
 root_of_vitality_perk_name: "Root of Vitality"
 ROOT_OF_VITALITY_PERK_EFFECT: "#flavor A much less hostile usage of Hungry Earth, instead of crushing agony the target's body is enriched by the fertile essence of the earth.#!"
 kupalas_fury_perk_name: "Kupala's Fury"
 KUPALAS_FURY_PERK_EFFECT: "[bs_spell|E]: Remove a [holding|E] at your location.\n\n#flavor The Koldun rouses the taint of Kupala with his blood so that the eldritch force may gnaw at the roots of mountains and thrash beneath the land like the great dragon of Tzimisce heraldry.#!"

#Way of Wind
 breath_of_whispers_perk_name: "Breath of Whispers"
 BREATH_OF_WHISPERS_PERK_EFFECT: "#flavor Even in their absence, Koldun instill deep fear in their boyars. This power carries the vampire's words on a light breeze and returns with the target's reply.#!"
 biting_gale_perk_name: "Biting Gale"
 BITING_GALE_PERK_EFFECT: "Inflict #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0]#! [POD_superficial_damage|E] to enemy [knights|E] and [commanders|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n\n#flavor Vengeful Koldun invoke a cutting wind that slices an area of their choosing.#!"
 breeze_of_lethargy_perk_name: "Breeze of Lethargy"
 BREEZE_OF_LETHARGY_PERK_EFFECT: "Give [GetModifier('breeze_of_lethargy_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n\n#flavor Although they cannot induce immediate sleep, the winds evoked by this power bring growing exhaustion and numbing weariness through every muscle.#!"
 ride_the_tempest_perk_name: "Ride the Tempest"
 RIDE_THE_TEMPEST_PERK_EFFECT: "#flavor A Koldun employing this power moves at incredible speeds riding along the winds. Instilling fear as they suddenly appear in the different villages of their domain.#!"
 fury_of_the_night_sky_perk_name: "Fury of the Night Sky"
 FURY_OF_THE_NIGHT_SKY_PERK_EFFECT: "[bs_spell|E]: Summon a [GetModifier('weather_magic_storm_modifier').GetNameWithTooltip] at a location.\n\n#flavor Applying fury magnified by blood and will, a Koldun may project the full measure of his anger into the night sky. Churning gray clouds blot out stars and moon, unleashing spiraling gusts and a driving downpour of freezing rain and lightning.#!"

#Way of Water
 pool_of_lies_perk_name: "Pool of Lies"
 POOL_OF_LIES_PERK_EFFECT: "#flavor This versatile power creates three-dimensional illusions along the surface of a water source. How it is used depends on the creativity of the Koldun.#!"
 watery_haven_perk_name: "Watery Haven"
 WATERY_HAVEN_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n\n#flavor The Koldun submerges his target into a deep pool of water to protect them from danger.#!"
 fog_over_sea_perk_name: "Fog over Sea"
 FOG_OVER_SEA_PERK_EFFECT: "#flavor Moving with the unnatural grace of a ghost, the Koldun strides across water as readily as land, leaving nary a ripple to mark his passing.#!"
 minions_of_the_deep_perk_name: "Minions of the Deep"
 MINIONS_OF_THE_DEEP_PERK_EFFECT: "Can recruit [GetMaA('water_elemental').GetName] as [men_at_arms|E].\n\n#flavor By dripping his blood into a body of water, a Koldun may summon or rouse embodied water elementals to serve him.#!"
 doom_tide_perk_name: "Doom Tide"
 DOOM_TIDE_PERK_EFFECT: "[bs_spell|E]: Give your target [GetModifier('doom_tide_modifier').GetNameWithTooltip].\n\n#flavor Many ships lie at the bottom of the seas, shattered by the whirlpools of the Koldun.#!"

#Way of Fire
 fiery_courage_perk_name: "Fiery Courage"
 FIERY_COURAGE_PERK_EFFECT: "#flavor No vampire can master an element he fears, so this power dims that fear to a mere ember.#!"
 combust_perk_name: "Combust"
 COMBUST_PERK_EFFECT: "#flavor The Koldun's eyes flash vivid orange with sorcerous power as superheated air coils around the target.#!"
 wall_of_magma_perk_name: "Wall of Magma"
 WALL_OF_MAGMA_PERK_EFFECT: "#flavor The Koldun raises his hand and the earth splits, spraying a wall of glowing magma that quickly hardens into any desired shape.#!"
