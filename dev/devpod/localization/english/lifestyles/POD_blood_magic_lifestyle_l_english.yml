 BS_CANDLE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fire_control')].\n#flavor Kindred may form a temporary alliance with her greatest foe, and summon a small candle-like fire on thier finger tip. The fire does not burn the caster nor anyone else, but will cause standard psychological reactions from other vampires.#!"
 BS_PALM_OF_FIRE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fire_control')].\n#flavor Vampire may ignite their own palm, the fire does not damage the caster but will damage anyone else who touches it.#!"
 BS_CAMPFIRE_PERK_EFFECT: "#flavor The thaumaturge may, with just a touch, cause a flammable object to burst into flames. The fire created this way will damage everything including the caster.#!"
 BS_BONFIRE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fire_control')].\n#flavor At this level, the thaumaturge may ignite the air itself creating various forms from now ignited air.#!"
 BS_INFERNO_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_inferno')].\n#flavor In moments of great trouble, the caster may ignite their own vitae and release it upon the world in a majestic inferno, the fire created in this way will cause great damage to everything, including the caster.#!"

