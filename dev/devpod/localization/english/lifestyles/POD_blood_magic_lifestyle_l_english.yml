 control_perk_name: "Control"
 
 FORCE_BOLT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_force_bolt')].\n#flavor With just a smiple gesture sorcerer may summon up to 2 bolts of pure force and shot them at speeds sufficient to disturb foe's walking pattern knocking them down.#!"
 MANIPULATE_PERK_EFFECT: "#flavor Vampire's control over their power increases to such point where they can manipulate objects from distance. The movement from distance is quite slow and it isn't possible yet to throw objects with any force sufficient to do any damage.#!"
 BS_FLIGHT_PERK_EFFECT: "#flavor The thaumaturge can use this power to levitate himself or another and fly into the skies undisturbed by earth. The speed of flight is determinated by vampire's basic speed but can be pushed beyond with expenditure of willpower.#!"
 REPULSE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_force_bolt')].\n#flavor A vampire with this power can thrust an object or a being with a massive force in direction desired by caster. The acceleration may be as slow, or as fast as caster wills it but the top speed cannot exceed 30 kilometers per hour.#!"
 CONTROL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_force_bolt')].\n#flavor The pinnacle of this path, Control allows kindred to manipulate an objec from a distance up to 5 kilometers and with the precision comparable to directly holding the object in the hand.#!"

