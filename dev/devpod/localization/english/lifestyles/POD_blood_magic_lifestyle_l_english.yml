 BS_HEAT_WAVE_PERK_EFFECT: "Inflict #V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0] fire#! damage to enemy [knights|E] and [commanders|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n\n#flavor Acting as a conduit for steam geysers, the Koldun channels a blast of desiccating air at a victim within line of sight.#!"
