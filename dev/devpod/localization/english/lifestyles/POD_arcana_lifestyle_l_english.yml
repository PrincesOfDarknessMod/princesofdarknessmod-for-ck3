 arcana_apocalyptic_form_perk_name: "Apocalyptic Form"
 arcana_devour_soul_perk_name: "Devour Soul"
 arcana_divine_potential_perk_name: "Divine Potential"
 arcana_enthrall_perk_name: "Enthrall"
 arcana_hardened_flesh_perk_name: "Hardened Flesh"
 arcana_inviolate_soul_perk_name: "Inviolate Soul"
 arcana_invocation_of_name_perk_name: "Invocation of Name"
 arcana_pattern_sense_perk_name: "Pattern Sense"
 arcana_ravage_perk_name: "Ravage"
 arcana_regeneration_perk_name: "Regeneration"
 arcana_revelation_perk_name: "Revelation"

 ARCANA_APOCALYPTIC_FORM_PERK_EFFECT: "As [character_interaction|E], shapeshift into either [GetModifier('POD_shapeshift_form_apocalyptic_angelic_modifier').GetNameWithTooltip] or [GetModifier('POD_shapeshift_form_apocalyptic_damned_modifier').GetNameWithTooltip]\n#flavor All demons, as a remnant of their divinity, have state of existence they can change to in battle, their awesome Apocalyptic form. Depending on the Demon's torment, they may appear angelic, as if they had never fallen, or truly wicked and violent, showing the true scape of their inner torment. In all cases, this terrible and powerful form is a demon's go to asset for war.#!"
 ARCANA_DEVOUR_SOUL_PERK_EFFECT: "As execution option, devour soul of fellow demon to gain #V 10#! [arcana_lifestyle|E] perk points.\n#flavor When outside the confines of Hell, a demon may savage another, destroying its soul and draining it of its very soul.#!"
 ARCANA_DIVINE_POTENTIAL_PERK_EFFECT: "As [character_interaction|E], exchange 10 [arcana_lifestyle|E] perk points into 1 [skill|E] point.\n#flavor Under such understanding of Arcana and the Mortal form, a demon can transcend formerly mortal limits.#!"
 ARCANA_ENTHRALL_PERK_EFFECT: "As [character_interaction|E], Enthrall target giving them [investiture_lifestyle|E], and making them better cultist\n#flavor With a mere touch, a mortal supplicant to the demon may be 'gifted' by their new demonic master.#!"
 ARCANA_HARDENED_FLESH_PERK_EFFECT: "#flavor The demon's host body, at this state, becomes truly durable, able to shrug off normally lethal blows at peak condition. The raw power flowing into the body keeps it forever young, until the demon decides it is done with its current body.#!"
 ARCANA_INVIOLATE_SOUL_PERK_EFFECT: "Become immune to mental powers\n#flavor As creatures of possession, none may wrest control of a demon's body from them.#!"
 ARCANA_INVOCATION_OF_NAME_PERK_EFFECT: "Unlock [journey|E], to learn true name of target.\n#flavor Whenever spoken, the true name of a demon rings in their ears, allowing them to potentially find the person that dared speak it.#!"
 ARCANA_PATTERN_SENSE_PERK_EFFECT: "#flavor Demons once had an instinctual sensitivity to the patterns of the natural order, having established those patterns at the beginning of time. With this arcana, a demon has relearned that, and how to exploit it.#!"
 ARCANA_RAVAGE_PERK_EFFECT: "As [character_interaction|E], devour thrall to restore resolve.\n#flavor In times of desperation, a demon may devour the souls of their thralls for power, giving their lives for their fallen masters.#!"
 ARCANA_REGENERATION_PERK_EFFECT: "Every 1 year, heal from all negative physical [traits|E] (excluding scars).\n#flavor With an understanding of their inner power, a demon may mend the wounds on its form, to keep their current vessel in peak shape.#!"
 ARCANA_REVELATION_PERK_EFFECT: "As [character_interaction|E], reveal yourself to mortals gaining resolve while losing either [piety|E] or [prestige|E].\n#flavor When lacking a reliable source of resolve, a demon may sap a mortal of their faith through an extreme religious crisis.#!"

 arcana_sharpen_senses_perk_name: "Sharpen Senses"
 arcana_perfect_lie_perk_name: "Perfect Lie"
 arcana_twist_of_fate_perk_name: "Twist of Fate"
 arcana_read_the_heart_perk_name: "Read the Heart"

 ARCANA_SHARPEN_SENSES_PERK_EFFECT: "#flavor Having once been Yahweh's hand in creation, a demon may continue to guide the universe as they choose.#!"
 ARCANA_PERFECT_LIE_PERK_EFFECT: "#flavor No matter how absurd, demons with this power may lie as easily as they breathe.#!"
 ARCANA_TWIST_OF_FATE_PERK_EFFECT: "As [character_interaction|E], exchange [arcana_lifestyle|E] [perk|E] point into either [gold|E], [prestige|E] or [piety|E].\n#flavor Fate seems to favor the demon, as they gain unusual mortal boons, seemingly at random.#!"
 ARCANA_READ_THE_HEART_PERK_EFFECT: "Unlock [journey|E], to give target sinful [trait|E] bringing them closer to damnation or convert to your faith if they already have correct sin.\n #flavor So acute has a demon's spiritual sense become, they can find the sin and virtues of all, no matter how deeply buried.#!"

 arcana_gift_of_faith_perk_name: "Gift of Faith"
 arcana_increased_health_perk_name: "Increased Health"
 arcana_contagion_mastery_perk_name: "Contagion Mastery"
 arcana_spirit_sight_perk_name: "Spirit Sight"
 arcana_read_the_sin_perk_name: "Read the Sin"
 arcana_shield_of_spite_perk_name: "Shield of Spite"

 ARCANA_GIFT_OF_FAITH_PERK_EFFECT: "Impvore [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] by increasing resolve gain.\n#flavor When overflowing with divine energy, a Demon may gift their power to a thrall, to ease the weight of stress on their soul.#!"
 ARCANA_SHIELD_OF_SPITE_PERK_EFFECT: "#flavor So tormented is a demon's mind, merely attempting to pry into it's mind causes the foolish attacker to suffer horrible pain from the despair and evil within.#!"
 ARCANA_CONTAGION_MASTERY_PERK_EFFECT: "As [character_interaction|E], infect target with selected disease.\n#flavor The demon, with this power, gains understanding of even the smallest of god's lifeforms, able to purge disease from a host, or worse, afflict them with one.#!"
 ARCANA_SPIRIT_SIGHT_PERK_EFFECT: "Max Bound $POD_splat_wraith_plural$: #P +2#!\nCan mark soul for return.\n#flavor As spiritual beings, not even the restless dead elude the eyes of a watchful demon.#!"
 ARCANA_READ_THE_SIN_PERK_EFFECT: "Improve [GetPerk('arcana_read_the_heart_perk').GetName(GetPlayer)] by increasing speed and success chance.\n#flavor As creatures of sin, a demon may gaze onto a mortal, and find the sin that rules their heart.#!"
 ARCANA_INCREASED_HEALTH_PERK_EFFECT: "Improve [GetPerk('arcana_regeneration_perk').GetName(GetPlayer)] from #N 1#! year cooldown to #P 6#! months.\n#flavor With an understanding of their physique, a demon can push their vessel past mere mortal limits.#!"

 arcana_incorporeal_form_perk_name: "Incorporeal Form"
 arcana_compel_sin_perk_name: "Compel Sin"
 arcana_ultimate_horror_perk_name: "Ultimate Horror"
 arcana_resilience_perk_name: "Resilience"
 arcana_spirit_strike_perk_name: "Spirit Strike"
 arcana_healing_touch_perk_name: "Healing Touch"
 arcana_sin_eating_perk_name: "Sin Eating"
 arcana_preternatural_reflexes_perk_name: "Preternatural Reflexes"
 arcana_scry_perk_name: "Scry"
 arcana_relentless_soul_perk_name: "Relentless Soul"

 ARCANA_INCORPOREAL_FORM_PERK_EFFECT: "As [character_interaction|E], shapeshift into [GetModifier('POD_shapeshift_form_incorporeal_modifier').GetNameWithTooltip].\nCannot be imprisoned during [siege|E] or [raid|E].\n#flavor Using their physical form as an anchor, a demon has found a way to trick the prisons of hell, allowing them to project from a vessel and become a spiritual being once again.#!"
 ARCANA_SIN_EATING_PERK_EFFECT: "Impvore [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] by decreasing cost.\n#flavor The demon's knowledge of sin becomes such, mortals in the throes of despair give sustenance to their infernal tormentor.#!"
 ARCANA_ULTIMATE_HORROR_PERK_EFFECT: "Give enemy side war participant [GetModifier('POD_ultimate_horror_modifier').GetNameWithTooltip] [modifier|E] when in [war|E] as the leading attacker or defender.\n#flavor So terrible has this demon's apocalyptic form become, madness and woe follow wherever it walks for war.#!"
 ARCANA_RESILIENCE_PERK_EFFECT: "#flavor Having mastered the damage they can resist, a demon with this arcana is far more difficult to injure, their body supernaturally resistant to harm.#!"
 ARCANA_SPIRIT_STRIKE_PERK_EFFECT: "Can hurt spirits.\n#flavor With this power, the demon may invoke its spiritual form to maim even spirits, nothing free from the demon's wrath.#!"
 ARCANA_HEALING_TOUCH_PERK_EFFECT: "As [character_interaction|E], heal target.\n#flavor With the powers of mortal faith, the demon may heal the living, mending their savaged wounds.#!"
 ARCANA_COMPEL_SIN_PERK_EFFECT: "Improve [GetPerk('arcana_read_the_heart_perk').GetName(GetPlayer)] by increasing speed and success chance.\n#flavor With this power, a demon may fuel their sin into a victim, bringing out the sin from within their very soul.#!"
 ARCANA_PRETERNATURAL_REFLEXES_PERK_EFFECT: "#flavor At this state of power, a demon gains a supernatural awareness of their surroundings, always ready to spring into combat, and always ready.#!"
 ARCANA_SCRY_PERK_EFFECT: "#flavor With concentration and a name, a demon may divine information about this place of focus.#!"
 ARCANA_RELENTLESS_SOUL_PERK_EFFECT: "Will not die from wounds.\n#flavor When a demon would take a killing blow, their innate power can hold back the gates of death for their shell, 'merely' knocking them unconscious instead.#!"

 arcana_arsenal_of_the_beast_perk_name: "Arsenal of the Beast"
 arcana_inhuman_strength_perk_name: "Inhuman Strength"
 arcana_damage_immunity_perk_name: "Damage Immunity"
 arcana_trait_aptitude_perk_name: "Trait Aptitude"
 arcana_speed_of_thought_perk_name: "Speed of Thought"
 arcana_premonition_perk_name: "Premonition"
 arcana_invinsibility_perk_name: "Invinsibility"
 arcana_read_the_mind_perk_name: "Read the Mind"
 arcana_command_the_dead_perk_name: "Command the Dead"
 arcana_fortunate_guess_perk_name: "Fortunate Guess"
 arcana_shrouded_soul_perk_name: "Shrouded Soul"

 ARCANA_ARSENAL_OF_THE_BEAST_PERK_EFFECT: "As [character_interaction|E], can shapeshift into custom made shapeshift or buy new upgrades for it.\n#flavor The demon, in this state, can manifest a weapon in their Apocalyptic Form, in the shape of sublime blades, or wicked talons not even the cruelest beasts would use.#!"
 ARCANA_INHUMAN_STRENGTH_PERK_EFFECT: "#flavor With this power, a demon's might becomes made manifest in raw power, as cordons of rippling muscle, or as a hidden reserve of terrifying power.#!"
 ARCANA_DAMAGE_IMMUNITY_PERK_EFFECT: "Will not take damange from stacking, fire nor will become [GetTrait('inappetetic').GetName(GetPlayer)].\n#flavor With this power, a demon becomes totally immune to a form of physical destruction, and their form becomes truly, apocalyptically, durable.#!"
 ARCANA_TRAIT_APTITUDE_PERK_EFFECT: "#flavor So thorough has a demon's understanding of a field become, they are unmatched in it, as all they perform with this skill has become a magnum opus.#!"
 ARCANA_SPEED_OF_THOUGHT_PERK_EFFECT: "#flavor So blinding is this demon's speed, a demon could fire an arrow, and then catch it, with their truly fearsome power.#!"
 ARCANA_PREMONITION_PERK_EFFECT: "You will receive a notification if someone intent to murder your friends or family.\n#flavor Like a spider in its web, the character senses vibrations in the strands of fate when danger approaches, making them ready for all outcomes.#!"
 ARCANA_INVINSIBILITY_PERK_EFFECT: "As [character_interaction|E], shapeshift into [GetModifier('POD_shapeshift_form_invisible_modifier').GetNameWithTooltip].\n#flavor As their form becomes more and more malleable to the demon's will, they gain the ability to remove themselves from the visions of the beings of creation.#!"
 ARCANA_COMMAND_THE_DEAD_PERK_EFFECT: "Can bind and command $POD_splat_wraith_plural$.\nMax Bound $POD_splat_wraith$: #P +3#!.\nUnlock Wraith and Dead MaA.\n#flavor Not even the dead may escape this power, as a demon may compel them to serve.#!"
 ARCANA_READ_THE_MIND_PERK_EFFECT: "As [character_interaction|E], learn all target's secrets and schemes, if targeted against youself, discover all schemes targeting you.\n#flavor The book of the mind laid bare, a demon may this power may pick the mind of thoughts, as if it were an opened book.#!"
 ARCANA_FORTUNATE_GUESS_PERK_EFFECT: "#flavor So attuned to mortal connections the demon has become, a demon may sometimes understand and know if anyone shows ill will to their favored cultists.#!"
 ARCANA_SHROUDED_SOUL_PERK_EFFECT: "#flavor With this power, a demon may blur the cognition of those around them, becoming faceless in a crowd, no matter how much the demon stands out.#!"

 arcana_conquering_will_perk_name: "Conquering Will"
 arcana_inured_to_agony_perk_name: "Inured to Agony"
 arcana_visage_of_glory_perk_name: "Visage of Glory"
 arcana_reshape_flesh_perk_name: "Reshape Flesh"
 arcana_excise_soul_perk_name: "Excise Soul"
 arcana_foretell_perk_name: "Foretell"
 arcana_shortened_path_perk_name: "Shortened Path"
 arcana_reapers_hunger_perk_name: "Reaper's Hunger"
 arcana_touch_from_afar_perk_name: "Touch from Afar"

 ARCANA_CONQUERING_WILL_PERK_EFFECT: "#flavor Invoking the name of Yahweh himself, a demon may empower their warriors, with the word of the god that cast them down.#!"
 ARCANA_INURED_TO_AGONY_PERK_EFFECT: "#flavor A demon with this power triumphs over such mortal concerns as 'pain' or 'age' and rather, no matter how maimed they are, so long as the demon stands, it will fight as if it was untouched by war or ailment.#!"
 ARCANA_VISAGE_OF_GLORY_PERK_EFFECT: "#flavor Channeling the memories of their lost status as Elohim, for a short time, a demon may become truly angelic.#!"
 ARCANA_RESHAPE_FLESH_PERK_EFFECT: "Can change physical [traits|E] of willing target.\n#flavor The demon with this power may command living animal matter to shift and even flow like wax under his touch, capable of being shaped to their damned will.#!"
 ARCANA_EXCISE_SOUL_PERK_EFFECT: "Unlock exection option, to convert character to wraith.\nCan bypass immorality and destroy soul directly.\n#flavor With this terrible power, a demon invokes a ritual, tearing out a victim's soul and forcing it to serve the demon's desires.#!"
 ARCANA_FORETELL_PERK_EFFECT: "#flavor Such is a demon's understanding of creation, a demon may be able to predict that which has yet to occur.#!"
 ARCANA_SHORTENED_PATH_PERK_EFFECT: "#flavor With an understanding of the old pathways of creation, a demon may cut the time of traversal down to fractions of what it once was.#!"
 ARCANA_REAPERS_HUNGER_PERK_EFFECT: "Every kill gives [GetModifier('POD_reapers_hunger_modifier').GetNameWithTooltip] for 5 years.\n#flavor Whenever a demon with this power ends the life of a mortal, they may reap the dying soul of precious power.#!"
 ARCANA_TOUCH_FROM_AFAR_PERK_EFFECT: "#flavor As the demon's understanding of spatial reality grows, as does the scope of their arcanas.#!"

 arcana_unyielding_perk_name: "Unyielding"
 arcana_theft_of_faith_perk_name: "Theft of Faith"
 arcana_behold_the_metatron_perk_name: "Behold the Metatron"
 arcana_command_the_eternal_soul_perk_name: "Command the Eternal Soul"
 arcana_implacable_vengeance_perk_name: "Implacable Vengeance"
 arcana_trait_enhancement_perk_name: "Trait Enhancement"
 arcana_certainties_of_chance_perk_name: "Certainties of Chance"
 arcana_celestial_radience_perk_name: "Celestial Radience"
 arcana_shadow_mastery_perk_name: "Shadow Mastery"
 arcana_step_between_perk_name: "Step Between"

 ARCANA_UNYIELDING_PERK_EFFECT: "Convert incoming wounds into [stress|E].\n#flavor So strong is a demon's force of will, so long as they have the strength of conviction, blows can be turned with will alone.#!"
 ARCANA_THEFT_OF_FAITH_PERK_EFFECT: "Impvore [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] by increasing resolve gain.\n#flavor So complete has a demon's understanding of souls has become, no soul may escape the possibility of being devoured by their infernal overlord.#!"
 ARCANA_BEHOLD_THE_METATRON_PERK_EFFECT: "#flavor Becoming a true architect of creation, the demon unveils their truest form, their most primal state, either one of sublime perfection or horrendous evil.#!"
 ARCANA_COMMAND_THE_ETERNAL_SOUL_PERK_EFFECT: "As [character_interaction|E] on imprisoned demon, have 50% chance to make them loyal puppet or send to abyss.\n#flavor With this power, a demon may invoke another demon's true name, compelling them into submission.#!"
 ARCANA_IMPLACABLE_VENGEANCE_PERK_EFFECT: "#flavor Demon chaneel their full sin into world.#!"
 ARCANA_TRAIT_ENHANCEMENT_PERK_EFFECT: "#flavor At this level of mastery, a demon has truly surpassed the limits of mortalkind.#!"
 ARCANA_CERTAINTIES_OF_CHANCE_PERK_EFFECT: "#flavor From merely observing the flow of chance and destiny, a demon may twist it to their ends.#!"
 ARCANA_CELESTIAL_RADIENCE_PERK_EFFECT: "#flavor The demon channels its power as blinding light, becoming a burning beacon of light.#!"
 ARCANA_SHADOW_MASTERY_PERK_EFFECT: "As [character_interaction|E], shapeshift into [GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip].\n#flavor So powerful has the demon's will over its own soul become, a demon may wear their soul, becoming a towering column of darkness.#!"
 ARCANA_STEP_BETWEEN_PERK_EFFECT: "Gain access to all [umbra|E].\n#flavor With this power, a demon may gently warp space, vanishing and reappearing in a blur of light or wavering shadow.#!"

 arcana_ravage_sinner_perk_name: "Ravage Sinner"
 arcana_greater_invocation_perk_name: "Greater Invocation"
 arcana_lash_of_anguish_perk_name: "Lash of Anguish"
 arcana_raise_the_dead_perk_name: "Raise the Dead"
 arcana_portal_mastery_perk_name: "Portal Mastery"

 ARCANA_RAVAGE_SINNER_PERK_EFFECT: "Impvore [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] by decreasing cost.\n#flavor With this power, the demon's presence makes the worst desires of mortals come into first view.#!"
 ARCANA_GREATER_INVOCATION_PERK_EFFECT: "Impvore [GetPerk('arcana_command_the_eternal_soul_perk').GetName(GetPlayer)] by allowing non-demons.\n#flavor With this power, a demon begins to have powers over names themselves, able to compel others to submit to their summons.#!"
 ARCANA_PORTAL_MASTERY_PERK_EFFECT: "As [character_interaction|E], teleport either army or personal travel to destination.\nBypass capture immunity.\n#flavor Just as existence once lay at their beck and call, a demon may pass or bar barriers at their will.#!"
 ARCANA_RAISE_THE_DEAD_PERK_EFFECT: "As [character_interaction|E], convert bound $POD_splat_wraith$ into [GetTrait('risen').GetName(GetPlayer)].\n#flavor Even the dead may not escape servitude to the demon, as with this power, the demon may raise legions of the dead, to serve their infernal desires.#!"
 ARCANA_LASH_OF_ANGUISH_PERK_EFFECT: "#flavor So attuned a demon has become to its own pain, a demon may project its anguish and inner pain as a barrage of telepathic energy.#!"

 arcana_open_gate_perk_name: "Open Gate"
 arcana_alter_fate_perk_name: "Alter Fate"

 ARCANA_OPEN_GATE_PERK_EFFECT: "Impvore [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] by removing limitations.\n#flavor Demon dominion over space grows to such extended where space itself bends under Demon's will.#!"
 ARCANA_ALTER_FATE_PERK_EFFECT: "#flavor Having once divined creation itself, with this power, a demon may invoke a victim's name to manipulate and twist their very destiny.#!"

 arcana_beyond_now_perk_name: "Beyond Now"

 ARCANA_BEYOND_NOW_PERK_EFFECT: "As [character_interaction|E], get [GetModifier('POD_beyond_now_modifier').GetNameWithTooltip] for 1 week at cost of 300 [static_stress|E].\n#flavor With this power, a demon may step outside of time itself, the tapestry of the cosmos temporarily at their command.#!"
