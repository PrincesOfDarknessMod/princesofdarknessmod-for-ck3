 game_concept_arcana_lifestyle: "Arcana"
 game_concept_arcana_lifestyle_desc: "An Arcana is a feat of “spiritual magic” that draw upon the faith and belief of a demon's mortal followers."
 
 arcana_lifestyle_name: "Arcana"
 arcana_lifestyle_desc: "Focus on the powers that come from faith of mortals turned into miracles of your own sinful designs."
