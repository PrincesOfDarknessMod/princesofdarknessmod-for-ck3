 REALM_ACTOR_1_PERK_EFFECT:0 "You can now cast a cantrip to a [friend|E], [lover|E], [courtier|E], [direct_vassal|E], house member, character who you have strong [title_claim|E] or [strong_hook|E], or a character who you know their criminal [secret|E].\nAlso the character shouldn't have any bad relation, [war|E], [truce|E] with you or be imprisoned by you."
 REALM_ACTOR_2_PERK_EFFECT:0 "You can now cast a cantrip to a [friend|E], [lover|E], [courtier|E], [guest|E], [vassal|E], [liege|E], dynasty member, character who you have [title_claim|E] or [hook|E], or a character who you known their [secret|E].\nAlso the character shouldn't have any bad relation, [war|E], [truce|E] with you or be imprisoned be you."
 REALM_ACTOR_3_PERK_EFFECT:0 "You can now cast a cantrip to a character with any good relation, [courtier|E], [guest|E], [vassal|E], [liege|E], dynasty member, [ally|E], a character who you have claim or [hook|E], or a character who you know their [secret|E].\nAlso the character shouldn't have any bad relation or [war|E] with you."
 REALM_ACTOR_4_PERK_EFFECT:0 "You can now cast a cantrip to any character as long as they are not a [rival|E] or at [war|E]."
 REALM_ACTOR_5_PERK_EFFECT:0 "You can now cast a cantrip to any character, even a [rival|E] or during a [war|E]."
 REALM_FAE_1_PERK_EFFECT:0 "You can now cast a cantrip to lesser supernaturals or mortals with lesser powers."
 REALM_FAE_2_PERK_EFFECT:0 "You can now cast a cantrip to Changeling."
 REALM_FAE_3_PERK_EFFECT:0 "You can now cast a cantrip to Fae."
 REALM_FAE_4_PERK_EFFECT:0 "You can now cast a cantrip to most supernaturals or mortals with powerful powers."
 REALM_FAE_5_PERK_EFFECT:0 "You can now cast a cantrip to even the rarest supernatural."
 REALM_PROP_1_PERK_EFFECT:0 "You can now cast a cantrip to common/masterwork miscellaneous/court artifact."
 REALM_PROP_2_PERK_EFFECT:0 "You can now cast a cantrip to common/masterwork artifact."
 REALM_PROP_3_PERK_EFFECT:0 "You can now cast a cantrip to not unique famed/illustrious artifact."
 REALM_PROP_4_PERK_EFFECT:0 "You can now cast a cantrip to unique famed artifact."
 REALM_PROP_5_PERK_EFFECT:0 "You can now cast a cantrip to unique illustrious artifact."
 REALM_NATURE_1_PERK_EFFECT:0 "Can cast cantrip with unliving, organic materials."
 REALM_NATURE_2_PERK_EFFECT:0 "Can cast cantrip with living, organic plant material."
 REALM_NATURE_3_PERK_EFFECT:0 "Can cast cantrip with living, nonsentient animals."
 REALM_NATURE_4_PERK_EFFECT:0 "Can cast cantrip with natural phenomena."
 REALM_NATURE_5_PERK_EFFECT:0 "Can cast cantrip with natural elements in pure form."
 REALM_SCENE_1_PERK_EFFECT:0 "You can now cast a cantrip to a character of roughly a small realm away (example : Wales top to bottom).\nCan cast area cantrip at county scale."
 REALM_SCENE_2_PERK_EFFECT:0 "You can now cast a cantrip to a character of roughly a medium realm away (example : Ireland top to bottom).\nCan cast area cantrip at duchy scale."
 REALM_SCENE_3_PERK_EFFECT:0 "You can now cast a cantrip to a character of roughly a big realm away (example : France top to bottom).\nCan cast area cantrip at kingdom scale."
 REALM_SCENE_4_PERK_EFFECT:0 "You can now cast a cantrip to a character of roughly a massive realm away (example : Holy Roman Empire left to right).\nCan cast area cantrip at empire scale."
 REALM_SCENE_5_PERK_EFFECT:0 "You can now cast a cantrip to any character on the map.\nCan cast area cantrip at worldly scale."
 REALM_TIME_1_PERK_EFFECT:0 "Cantrip modifier now last #V 1#! year instead of #V 4#! months.\nReduce cantrip cooldown to 3/4."
 REALM_TIME_2_PERK_EFFECT:0 "Cantrip modifier now last #V 2#! years instead of #V 1#! year.\nReduce cantrip cooldown to half."
 REALM_TIME_3_PERK_EFFECT:0 "Cantrip modifier now last #V 5#! years instead of #V 2#! year.\nReduce cantrip cooldown to 1/4."
 REALM_TIME_4_PERK_EFFECT:0 "Cantrip modifier now last #V 10#! years instead of #V 5#! year.\nReduce cantrip cooldown to one unit."
 REALM_TIME_5_PERK_EFFECT:0 "Cantrip modifier now last forever.\nNo more cantrip cooldown."

