l_english:
 game_concept_realm_lifestyle:0 "Realm"
 game_concept_realm_lifestyle_desc:0 "The five aspects of the world with which kithain have affinity, apply directly to who or what you can effect. Without knowing the proper realms a kithain is unable to affect anything. Realms are a necessary part of casting a Cantrip."
 
 realm_lifestyle_name:0 "Realm"
 realm_lifestyle_desc:0 "Focus on aspects of the world with which kithain have affinity."
 realm_lifestyle_highlight_desc:0 "Because your [GetTrait('fae').GetName( GetPlayer )] [trait|E], you gain #P 50%#! more [experience|E] in this Lifestyle."
 monthly_realm_lifestyle_xp_gain_mult:0 "Monthly Realm [lifestyle|E] [experience|E]"
 
 realm_actor_focus:0 "Actor Focus"
 realm_actor_focus_modifier:1 "[GetFocus('realm_actor_focus').GetName]"
 realm_actor_focus_desc:0 "Actor is the realm connected to all worldly beings, with a direct correlation to how well you know them."
 realm_actor_focus_effect_desc:0 "Focusing on Actor grants:"
 
 realm_fae_focus:0 "Fae Focus"
 realm_fae_focus_modifier:1 "[GetFocus('realm_fae_focus').GetName]"
 realm_fae_focus_desc:0 "Fae deals with other beings of the Dreaming. To affect other Changelings, the Noble Sidhe, Adhene, Chimera, or even controlling Changeling magic itself all fall under the realm of Fae."
 realm_fae_focus_effect_desc:0 "Focusing on Fae grants:"
 
 realm_scene_focus:0 "Scene Focus"
 realm_scene_focus_modifier:1 "[GetFocus('realm_scene_focus').GetName]"
 realm_scene_focus_desc:0 "Scene is the control of space. The more you master the realm of Scene the larger area or the more targets (in conjunction with other realms) you can affect."
 realm_scene_focus_effect_desc:0 "Focusing on Scene grants:"
 
 realm_time_focus:0 "Time Focus"
 realm_time_focus_modifier:1 "[GetFocus('realm_time_focus').GetName]"
 realm_time_focus_desc:0 "Time is the control of when your cantrips will happen or how long they will last. Mastery of Time dictates the length your spells may last or how long you can set a "trigger" upon them."
 realm_time_focus_effect_desc:0 "Focusing on Time grants:"
 
