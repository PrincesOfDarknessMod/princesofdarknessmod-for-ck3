 TIEH_TAN_1_PERK_EFFECT:0 "#F $BULLET_WITH_TAB$Commune With Metal - Like other elemental objects, those of metal have limited senses and limited ways to communicate.\n$BULLET_WITH_TAB$Read Metal Soul - The Metal Soul contains a person's sense of justice, honesty, and fair play.\n$BULLET_WITH_TAB$Speak With Jimu-Tenno - The Alchemist can speak with Metal Spirits, provided they can be encountered.#!"
 TIEH_TAN_2_PERK_EFFECT:0 "#F $BULLET_WITH_TAB$Summon/Dispel Tieh Shen - A Metal Alchemist may summon or dispel a spirit of metal.\n$BULLET_WITH_TAB$Nurture/Diminish Metal Soul - A Chu-ih-yu or Tanuki may command the spirit while others must bargain or sacrifice to get the spirit to do a task.\n$BULLET_WITH_TAB$Increase/Decrease Metal Attributes / Blessing of Shaohao/Curse of Luban - The Alchemist may affect the Perception or Dexterity of the target.\n$BULLET_WITH_TAB$Summon the Dragon Boat - Calling a Dragon Boat associated with Metal is useful when the Dragon Line it follows has been covered with a railroad or if the Dragon Nest travelled to or from is associated with Metal or Justice.#!"
 TIEH_TAN_3_PERK_EFFECT:0 "#F $BULLET_WITH_TAB$The Enfolded Object - Metal is perhaps the second most easily enfolded object and practical as well.\n$BULLET_WITH_TAB$Paths of Iron - Copper wire, metal duct work, or steel girders of buildings... the Paths of Metal are many, at least in the cities.\n$BULLET_WITH_TAB$Metal Form/Metal Fist - This is a common I Chih for both the Chu-ih-yu and the Tanuki who tend to be martial and the defense of a metal hide or the shattering power of a metal fist is useful. #!"
 TIEH_TAN_4_PERK_EFFECT:0 "#F $BULLET_WITH_TAB$Awaken True Jade - The Alchemist may awaken White Jade.\n$BULLET_WITH_TAB$Move Metal - A handy trick for the warrior whose weapon has been cast from his hand.\n$BULLET_WITH_TAB$Shape/Sunder Metal / Chisel of Pan Ku - The great workers of Metal Alchemy are noted craftsmen and make beautiful swords and other weapons.\n$BULLET_WITH_TAB$Summon Metal - When you need a weapon and don't care what you get, this ability can be helpful.#!"
 TIEH_TAN_5_PERK_EFFECT:0 "#F $BULLET_WITH_TAB$Exchange Properties - At this level of power a Master can make steel as soft as gold or gold as tough as steel.\n$BULLET_WITH_TAB$Transmute Metal - With this ability metal can be turned into another metal entirely.#!"
 LIN_TAN_1_PERK_EFFECT:0 "#F $BULLET_WITH_TAB$Commune with Wood - Like most elements, wood and its correspondences can only give limited information.\n$BULLET_WITH_TAB$Read Wood Soul - The Wood Soul is responsible for a person's morality. It controls lust and empathy.\n$BULLET_WITH_TAB$Speak With Jimu-Tenno - The Alchemist is able to speak with Lin Shen, provided they are manifest or the hsien as the ability to pierce the Wall.#!"
