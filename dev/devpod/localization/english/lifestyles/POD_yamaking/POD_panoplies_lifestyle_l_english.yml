l_english:
 game_concept_panoplies_lifestyle: "$panoplies_lifestyle_name$"
 game_concept_panoplies_lifestyle_desc: "$panoplies_lifestyle_desc$"

 panoplies_lifestyle_name: "Panoplies"
 panoplies_lifestyle_desc: "The majestic and profane regalia and splendors of the Devil Kings, the Panoplies are the infernal charms of the Lords of the Thousand Hells."
 monthly_panoplies_lifestyle_xp_gain_mult: "Monthly Panoplies [lifestyle|E] [experience|E]"
 monthly_panoplies_lifestyle_xp_gain_add: "Monthly Panoplies [lifestyle|E] [experience|E]"

 panoplies_focus: "Panoplies Focus"
 panoplies_focus_modifier: "[GetFocus('panoplies_focus').GetName]"
 panoplies_focus_desc: "Barging for power"
 panoplies_focus_effect_desc: "Focusing on Panoplies grants:"

 PANOPLIES_PERK_REQUIREMENT: "#i To unlock this [perk|E] you have to first have all [perks|E] form previous row.#!"

 panoplies_of_sludge_visible: "Panoplies of Sludge"
 
 panoplies_profane_water_perk_name: "Profane Water"
 panoplies_dominating_the_seas_perk_name: "Dominating the Seas"
 panoplies_water_bending_perk_name: "Water Bending"
 PANOPLIES_PROFANE_WATER_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, give every enemy [knight|E] [GetModifier('POD_panoplies_profane_water_modifier').GetNameWithTooltip] [modifier|E] for 1 year.\n#flavor A [Glossary('Yama King','podgloss.yamaking')]'s control over water often starts small, corrupting it to make it that much harder for their enemies to traverse.#!"
 PANOPLIES_DOMINATING_THE_SEAS_PERK_EFFECT: "As a [character_interaction|E], gain or lose [GetModifier('POD_panoplies_dominating_the_seas_modifier').GetNameWithTooltip] [modifier|E].\n#flavor At this level of control, the [Glossary('Yama King','podgloss.yamaking')] can remove water from his path, transforming it into blackened bile in the process.#!"
 PANOPLIES_WATER_BENDING_PERK_EFFECT: "#flavor Water become a weapon for the [Glossary('Yama King','podgloss.yamaking')], though their control over it is still limited as the element itself chafes under their corruptive influence.#!"

 panoplies_stopping_the_flow_of_life_perk_name: "Stopping the Flow of Life"
 panoplies_breaching_the_watery_wall_perk_name: "Breaching the Watery Wall"
 panoplies_tainting_water_perk_name: "Tainting Water"
 panoplies_from_water_to_sludge_perk_name: "From Water to Sludge"
 panoplies_watery_mirror_perk_name: "Watery Mirror"
 PANOPLIES_STOPPING_THE_FLOW_OF_LIFE_PERK_EFFECT: "As a [character_interaction|E], remove a random positive target's copping mechanism [trait|E] or give them 25 [stress|E].\n#flavor By threatening the very elements of life, the [Glossary('Yama King','podgloss.yamaking')] unbalances their target's psyche.#!"
 PANOPLIES_BREACHING_THE_WATERY_WALL_PERK_EFFECT: "#flavor Attuning themselves to the heart of the water element, the [Glossary('Yama King','podgloss.yamaking')] centers themselves at the expense of everyone else.#!"
 PANOPLIES_TAINTING_WATER_PERK_EFFECT: "Unlock medium levels(3-4) of #V Defilements of Taint#!\n#flavor The [Glossary('Yama King','podgloss.yamaking')]'s mastery over water grows, turning the once pristine element of life into a destructive force of taint.#!"
 PANOPLIES_FROM_WATER_TO_SLUDGE_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_panoplies_from_water_to_sludge_modifier').GetNameWithTooltip] [modifier|E] for 5 years.\n#flavor The water once used by the [Glossary('Yama King','podgloss.yamaking')] as a weapon is now barely recognizable, more akin to mud than anything else.#!"
 PANOPLIES_WATERY_MIRROR_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_panoplies_watery_mirror_modifier').GetNameWithTooltip] [modifier|E] for 5 years.\n#flavor Shifting their form to please their target, the [Glossary('Yama King','podgloss.yamaking')] takes the soothing countenance of water, while inwardly looking like sludge.#!"

 panoplies_breaking_the_flow_of_life_perk_name: "Breaking the Flow of Life"
 panoplies_tuning_in_primordial_water_perk_name: "Tuning in Primordial Water"
 panoplies_tainting_primordial_water_perk_name: "Tainting Primordial Water"
 panoplies_flowing_flaws_perk_name: "Flowing Flaws"
 PANOPLIES_BREAKING_THE_FLOW_OF_LIFE_PERK_EFFECT: "As a [character_interaction|E], give a random negative copping mechanism [trait|E] to the target and give them [GetModifier('POD_panoplies_breaking_the_flow_of_life_modifier').GetNameWithTooltip] [modifier|E] for 5 years.\n#flavor With their more complete control over life energy, the [Glossary('Yama King','podgloss.yamaking')] can impair the mental wellbeing of their target to create weaknesses that will be exploited in the future.#!"
 PANOPLIES_TUNING_IN_PRIMORDIAL_WATER_PERK_EFFECT: "Increase speed of #V $task_conversion$#! by #P +50%#!.\n#flavor Now having access to the primordial essence of water itself, the [Glossary('Yama King','podgloss.yamaking')] can start spreading his corruption at a much deeper level.#!"
 PANOPLIES_TUNING_IN_PRIMORDIAL_WATER_PERK_MODIFIER_EFFECT: "[GetPerk('panoplies_tuning_in_primordial_water_perk').GetName(GetPlayer)]"
 PANOPLIES_TAINTING_PRIMORDIAL_WATER_PERK_EFFECT: "Unlock high levels(5-6) of #V Defilements of Taint#!\n#flavor Few things born of water can resist the [Glossary('Yama King','podgloss.yamaking')]'s taint now. In fact, most are spreading it unwillingly.#!"
 PANOPLIES_FLOWING_FLAWS_PERK_EFFECT: "As a [character_interaction|E], downgrade a random [relation|E] of the target.\n#flavor The [Glossary('Yama King','podgloss.yamaking')]'s control over the energy flow in people's psyche grows to being able to put once longtime friends at odds with each other.#!"

 panoplies_torrential_sludge_perk_name: "Torrential Sludge"
 panoplies_mud_sculptor_perk_name: "Mud Sculptor"
 PANOPLIES_TORRENTIAL_SLUDGE_PERK_EFFECT: "As a [character_interaction|E], force the target to declare war on a random neighbor.\n#flavor Once pristine water now stays still in the mud, carrying wrath towards an unrelated party.#!"
 PANOPLIES_MUD_SCULPTOR_PERK_EFFECT: "As a [character_interaction|E], change personality [traits|E] of your [defiled|E].\n#flavor Once we are all rolling in the mud, we can all be reborn in the [Glossary('Yama King','podgloss.yamaking')]'s image.#!"

 panoplies_sludge_master_perk_name: "Sludge Master"
 panoplies_sludge_falls_perk_name: "Sludge Falls"
 panoplies_sludge_sculptor_perk_name: "Sludge Sculptor"
 PANOPLIES_SLUDGE_MASTER_PERK_EFFECT: "#flavor Water can be barely seen, replaced by the taint of the [Glossary('Yama King','podgloss.yamaking')].#!"
 PANOPLIES_SLUDGE_FALLS_PERK_EFFECT: "As a [character_interaction|E], sever all [relations|E] of the target.\n#flavor Nothing can be seen over the horizon but more corruption falling over them.#!"
 PANOPLIES_SLUDGE_SCULPTOR_PERK_EFFECT: "Improve [GetPerk('panoplies_mud_sculptor_perk').GetName(GetPlayer)] by changing requirements to [akuma|E] without strong mental defenses that isn't [defiled|E] of another [Glossary('Yama King','podgloss.yamaking')].\n#flavor Reborn in fifth, stillness and terror.#!"

 panoplies_conceptual_mud_perk_name: "Conceptual Mud"
 panoplies_sludge_artist_perk_name: "Sludge Artist"
 PANOPLIES_CONCEPTUAL_MUD_PERK_EFFECT: "As a [character_interaction|E], force a target to change their [faith|E] to a random in the same [religion|E].\n#flavor By tainting the very essence of an individual, the [Glossary('Yama King','podgloss.yamaking')] can make lose their way and err without reason.#!"
 PANOPLIES_SLUDGE_ARTIST_PERK_EFFECT: "Improve [GetPerk('panoplies_mud_sculptor_perk').GetName(GetPlayer)] by changing requirements to just a character without strong mental defenses.\n#flavor Few can resist the touch of the true artist, the one who broke the very elements to his cause.#!"

 panoplies_ever_still_perk_name: "Ever Still"
 PANOPLIES_EVER_STILL_PERK_EFFECT: "As a [character_interaction|E], gain 1 [diplomacy|E] [skill|E] at the cost of 100 [dread|E] and with a cooldown of 2 years.\n#flavor The water doesn't flow anymore, it stays still and gets more and more putrid.#!"


 panoplies_of_balefire_visible: "Panoplies of Balefire"

 panoplies_fiery_debuts_perk_name: "Fiery Debuts"
 panoplies_armament_of_fire_perk_name: "Armament of Fire"
 PANOPLIES_FIERY_DEBUTS_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, deal 1 [POD_superficial_damage|E] to all enemy knights.\nAs a [character_interaction|E], give to one of target's [county|E] [GetModifier('POD_panoplies_fiery_debuts_modifier').GetNameWithTooltip] [modifier|E].\n#flavor Taming the element of fire is a difficult task, even for a [Glossary('Yama King','podgloss.yamaking')]. Just unleashing it on their foes isn't as hard however.#!"
 PANOPLIES_ARMAMENT_OF_FIRE_PERK_EFFECT: "#flavor Fire has been a weapon of choice for [Glossary('Yama Kings','podgloss.yamaking')] since their very beginnings. Its effectiveness can't be denied.#!"

 panoplies_fires_of_war_perk_name: "Fires of War"
 panoplies_master_of_fire_perk_name: "Master of Fire"
 panoplies_fiery_self_perk_name: "Fiery Self"
 panoplies_apprentice_of_balefire_perk_name: "Apprentice of Balefire"
 panoplies_fiery_battleground_perk_name: "Fiery Battleground"
 PANOPLIES_FIRES_OF_WAR_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_panoplies_fires_of_war_modifier').GetNameWithTooltip] [modifier|E] for 5 years.\n#flavor Fire is an effective control for controlling a battlefield. As long as one can control it as well obviously.#!"
 PANOPLIES_MASTER_OF_FIRE_PERK_EFFECT: "#flavor Once knowledgeable enough in the element itself, an ambitious [Glossary('Yama King','podgloss.yamaking')] can start the difficult process of tainting it for his own personal use.#!"
 PANOPLIES_FIERY_SELF_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_panoplies_fiery_self_modifier').GetNameWithTooltip] [modifier|E] for 5 years.\n#flavor Fire might be fought with fire. But it is still a hard fight.#!"
 PANOPLIES_APPRENTICE_OF_BALEFIRE_PERK_EFFECT: "Unlock medium levels(3-4) of #V Defilements of War#!\n#flavor The green, sickly, hue of the fire dominated by a [Glossary('Yama King','podgloss.yamaking')] betrays its dark origin.#!"
 PANOPLIES_FIERY_BATTLEGROUND_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, give an enemy ruler [GetModifier('POD_panoplies_fiery_battleground_modifier').GetNameWithTooltip] [modifier|E] for 2 years.\n#flavor Now properly master, fire can be an invaluable tool in controlling a battlefield.#!"
 
 panoplies_balefire_form_perk_name: "Balefire Form"
 panoplies_balefires_of_war_perk_name: "Balefires of War"
 panoplies_burning_the_past_perk_name: "Burning the Past"
 panoplies_master_of_balefire_perk_name: "Master of Balefire"
 panoplies_burning_defenses_perk_name: "Burning Defenses"
 PANOPLIES_BALEFIRE_FORM_PERK_EFFECT: "As a [character_interaction|E], shapeshift into [GetModifier('POD_shapeshift_form_balefire_modifier').GetNameWithTooltip] [modifier|E].\n#flavor The green fires of Hell are conjured by the [Glossary('Yama King','podgloss.yamaking')], making for a dreadful spectacle.#!"
 PANOPLIES_BALEFIRES_OF_WAR_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, give the enemy ruler [GetModifier('POD_panoplies_balefires_of_war_modifier').GetNameWithTooltip] [modifier|E] for 2 years.\n#flavor Now confident enough to use Balefire in war, the [Glossary('Yama King','podgloss.yamaking')] leaves only destruction in his wake.#!"
 PANOPLIES_BURNING_THE_PAST_PERK_EFFECT: "As a [character_interaction|E], damage a selected [artifact|E] of a target by #N 25#!.\n#flavor The relics of the enemy are nothing but ashes in the wake of a [Glossary('Yama King','podgloss.yamaking')]'s attack.#!"
 PANOPLIES_MASTER_OF_BALEFIRE_PERK_EFFECT: "Unlock high levels(5-6) of #V Defilements of War#!\n#flavor Balefire is a tricky element to truly control but great rewards come to those making the effort to do so.#!"
 PANOPLIES_BURNING_DEFENSES_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, give the enemy ruler [GetModifier('POD_panoplies_burning_defenses_modifier').GetNameWithTooltip] [modifier|E] for 2 years.\n#flavor Armors are a poor defense against fire. In fact, they can even be detrimental as many unfortunate souls have learned while facing a [Glossary('Yama King','podgloss.yamaking')].#!"

 panoplies_balefiery_self_perk_name: "Balefiery Self"
 panoplies_introduction_in_flames_perk_name: "Introduction in Flames"
 panoplies_no_retreat_in_hell_perk_name: "No Retreat in Hell"
 PANOPLIES_BALEFIERY_SELF_PERK_EFFECT: "Improve [GetPerk('panoplies_fiery_self_perk').GetName(GetPlayer)] by replacing the [modifier|E] to [GetModifier('POD_panoplies_balefiery_self_modifier').GetNameWithTooltip] [modifier|E].\n#flavor One has truly be a hero, or a fool, to defy a [Glossary('Yama King','podgloss.yamaking')] protected by Balefire.#!"
 PANOPLIES_INTRODUCTION_IN_FLAMES_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, deal 3 [POD_superficial_damage|E] to all enemy knights.\n#flavor Starting any battle with a conflagration of baleflames is often also signaling the end of said battle.#!"
 PANOPLIES_NO_RETREAT_IN_HELL_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, give an enemy ruler [GetModifier('POD_panoplies_no_retreat_in_hell_modifier').GetNameWithTooltip] [modifier|E] for 2 years.\n#flavor A well placed wall of Balefire can stop any thought of retreat. Unless one is wise enough to choose death instead of capture by a [Glossary('Yama King','podgloss.yamaking')].#!"

 panoplies_ending_in_flames_perk_name: "Ending in Flames"
 panoplies_hellish_cauterize_perk_name: "Hellish Cauterize"
 PANOPLIES_ENDING_IN_FLAMES_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, deal 2 [POD_aggravated_damage|E](fire) to all enemy knights.\n#flavor A pyroclasm of Baleflames awaits the heroic (and stupid) army trying to stop the [Glossary('Yama King','podgloss.yamaking')] that has tainted the very essence of fire.#!"
 PANOPLIES_HELLISH_CAUTERIZE_PERK_EFFECT: "As a [character_interaction|E], give a target an injury they won't be able to heal for #V 25#! years.\n#flavor Fire can help stabilize injuries, but it can also cause some deadly ones.#!"

 panoplies_scorched_earth_perk_name: "Scorched Earth"
 panoplies_broken_mirror_of_flames_perk_name: "Broken Mirror of Flames"
 PANOPLIES_SCORCHED_EARTH_PERK_EFFECT: "At the start of a [war|E] where one of the war leaders is your [defiled|E] or yourself, give an enemy ruler [GetModifier('POD_panoplies_scorched_earth_modifier').GetNameWithTooltip] [modifier|E] for 2 years.\n#flavor The scorched earth tactic has merits. But scorching the earth of your enemies has more.#!"
 PANOPLIES_BROKEN_MIRROR_OF_FLAMES_PERK_EFFECT: "As a [character_interaction|E], destroy all [buildings|E] in the target's current location.\n#flavor Bringing a part of Yomi in the mortal world will have disastrous consequences, a fiery cataclysm being one of them.#!"

 panoplies_ever_burning_perk_name: "Ever Burning"
 PANOPLIES_EVER_BURNING_PERK_EFFECT: "As a [character_interaction|E], gain 1 [martial|E] [skill|E] at the cost of 100 [dread|E] and with a cooldown of 2 years.\n#flavor Mastery of Balefire over millennia will make one an almost unstoppable force on the battlefield.#!"


 panoplies_of_vitriol_visible: "Panoplies of Vitriol"

 panoplies_metal_apprentice_perk_name: "Metal Apprentice"
 panoplies_kingly_aspiration_perk_name: "Kingly Aspiration"
 panoplies_metal_shaper_perk_name: "Metal Shaper"
 panoplies_acid_weaponry_perk_name: "Acid Weaponry"
 PANOPLIES_METAL_APPRENTICE_PERK_EFFECT: "#flavor A [Glossary('Yama King','podgloss.yamaking')] is a master of a Yomi Hell. Shaping the very reality is something they all aspire to.#!"
 PANOPLIES_KINGLY_ASPIRATION_PERK_EFFECT: "#flavor As a King, some decorum is expected. Each Lord of Yomi presents their wealth to claim the throne of the [Glossary('Demon Emperor','podgloss.demonemperor')].#!"
 PANOPLIES_METAL_SHAPER_PERK_EFFECT: "As a [character_interaction|E], repair 20 points of damage for the selected [artifact|E].\n#flavor The regalia of a King needs maintenance. The dutiful master do it himself.#!"
 PANOPLIES_ACID_WEAPONRY_PERK_EFFECT: "#flavor The master of Vitriol imbues his weapons with magical acid, making them that much more deadly.#!"

 panoplies_kingly_domain_perk_name: "Kingly Domain"
 panoplies_apprentice_of_vitriol_perk_name: "Apprentice of Vitriol"
 panoplies_kingly_court_perk_name: "Kingly Court"
 PANOPLIES_KINGLY_DOMAIN_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_panoplies_kingly_domain_modifier').GetNameWithTooltip] [modifier|E] for 5 years.\n#flavor One of them will rule Creation at some point. They all get ready for this pivotal moment.#!"
 PANOPLIES_APPRENTICE_OF_VITRIOL_PERK_EFFECT: "Unlock medium levels(3-4) of #V Defilements of Greed#!\n#flavor Yomi is a test of leadership. Using their powers of creation, the [Glossary('Yama Kings','podgloss.yamaking')] show their merits.#!"
 PANOPLIES_KINGLY_COURT_PERK_EFFECT: "Invite to [court|E] Acceptance: #P +20#!\n#flavor No King, or Emperor, rules alone. The true [Glossary('Yama King','podgloss.yamaking')] is well advised. Or die alone.#!"
 
 panoplies_acid_rain_perk_name: "Acid Rain"
 panoplies_kingly_prerogative_perk_name: "Kingly Prerogative"
 panoplies_master_of_vitriol_perk_name: "Master of Vitriol"
 panoplies_metal_master_perk_name: "Metal Master"
 PANOPLIES_ACID_RAIN_PERK_EFFECT: "As a [character_interaction|E], give to one of the target's [county|E] [GetModifier('POD_panoplies_acid_rain_modifier').GetNameWithTooltip] [modifier|E] for 5 years.\n#flavor Mountains tremble, buildings crumble under the [Glossary('Yama King','podgloss.yamaking')]'s rumble.#!"
 PANOPLIES_KINGLY_PREROGATIVE_PERK_EFFECT: "As a [character_interaction|E], get [weak_hook|E] on a target that is both [cowed|E] of you, and doesn't have strong mental defenses.\n#flavor [Glossary('Yama Kings','podgloss.yamaking')] are true rulers. With this power, they imbue their commands with the authority they will have as the [Glossary('Demon Emperor','podgloss.demonemperor')].#!"
 PANOPLIES_MASTER_OF_VITRIOL_PERK_EFFECT: "Unlock high levels(5-6) of #V Defilements of Greed#!\n#flavor Construction turns to destruction, rain turns to acid and rulers fall to their knees in the presence of the [Glossary('Yama King','podgloss.yamaking')].#!"
 PANOPLIES_METAL_MASTER_PERK_EFFECT: "$unlock_forging_node$ Increase max [durability|E] by #V 25#! for a cost of 20 [dread|E].\n#flavor The relics of power of the [Glossary('Yama King','podgloss.yamaking')] are imbued with his power, making them truly able to stand the test of time.#!"

 panoplies_acid_storm_perk_name: "Acid Storm"
 panoplies_imperial_prerogative_perk_name: "Imperial Prerogative"
 panoplies_metal_artist_perk_name: "Metal Artist"
 PANOPLIES_ACID_STORM_PERK_EFFECT: "Improve [GetPerk('panoplies_acid_rain_perk').GetName(GetPlayer)], by also reducing [county_control|E] by #N 20#!.\n#flavor Acid falls on the fools arrogant enough to oppose the [Glossary('Yama King','podgloss.yamaking')]'s will.#!"
 PANOPLIES_IMPERIAL_PREROGATIVE_PERK_EFFECT: "Improve [GetPerk('panoplies_kingly_prerogative_perk').GetName(GetPlayer)], by giving [strong_hook|E] instead of [weak_hook|E].\n#flavor There is little one can do but comply when ordered by the future [Glossary('Demon Emperor','podgloss.demonemperor')].#!"
 PANOPLIES_METAL_ARTIST_PERK_EFFECT: "$unlock_forging_node$ Add a [modifier|E] based on the [artifact|E]'s type for a cost of 20 [dread|E].\n#flavor From the Iron Panoply of [Glossary('Tou Mu','podgloss.toumu')] to [Glossary('Emma-o','podgloss.emmao')] Blade of Pure Yin, [Glossary('Yama Kings','podgloss.yamaking')] have time and again proven their mastery over magical metal.#!"

 panoplies_kingly_visit_perk_name: "Kingly Visit"
 panoplies_hell_decree_perk_name: "Hell Decree"
 panoplies_metal_king_perk_name: "Metal King"
 PANOPLIES_KINGLY_VISIT_PERK_EFFECT: "As a [character_interaction|E], try to convert one of the target's [county|E] to your [faith|E].\n#flavor Mortals fall to their knees and even supernaturals cower in fear when a [Glossary('Yama King','podgloss.yamaking')] in full Metal regalia comes to visit "his" future realm.#!"
 PANOPLIES_HELL_DECREE_PERK_EFFECT: "Improve [GetPerk('panoplies_kingly_prerogative_perk').GetName(GetPlayer)], by lifting the [cowed|E] requirement.\n#flavor The [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] decried it. The [Glossary('Yama Kings','podgloss.yamaking')] will one day rule. No one can deny their authority.#!"
 PANOPLIES_METAL_KING_PERK_EFFECT: "Improve [GetPerk('panoplies_metal_artist_perk').GetName(GetPlayer)], by giving #P;bold 2#! [modifiers|E] instead of #N;bold 1#!.\n#flavor The regalia of the masters of Vitriol are a sight to behold. Truly fit for the [Glossary('Demon Emperor','podgloss.demonemperor')].#!"

 panoplies_imperial_domain_perk_name: "Imperial Domain"
 panoplies_secrets_of_metal_perk_name: "Secrets of Metal"
 PANOPLIES_IMPERIAL_DOMAIN_PERK_EFFECT: "As a [character_interaction|E], steal the [county|E] of a target as long it has 0 [county_control|E] and is of your [faith|E].\n#flavor The wise will bow to the [Glossary('Yama King','podgloss.yamaking')] before the rise of the [Glossary('Demon Emperor','podgloss.demonemperor')]. Perhaps then will they be spared.#!"
 PANOPLIES_SECRETS_OF_METAL_PERK_EFFECT: "Improve [GetPerk('panoplies_metal_artist_perk').GetName(GetPlayer)], by giving #P;bold 3#! [modifiers|E] instead of #N;bold 2#!.\n#flavor And the Emperor stands upon the throne of Creation, adorned in the finest treasures of this Age and the ones before.#!"

 panoplies_ever_prestigious_perk_name: "Ever Prestigious"
 PANOPLIES_EVER_PRESTIGIOUS_PERK_EFFECT: "As a [character_interaction|E], gain 1 [stewardship|E] [skill|E] at the cost of 100 [dread|E] and with a cooldown of 2 years.\n#flavor The true contender for the [Glossary('Demon Emperor','podgloss.demonemperor')]'s throne looks the part with his rulership abilities tested by millennia as a mere [Glossary('Yama King','podgloss.yamaking')].#!"


 panoplies_of_smog_visible: "Panoplies of Smog"

 panoplies_smog_1_perk_name: "Smog 1"
 panoplies_smog_2_perk_name: "Smog 2"
 panoplies_smog_3_perk_name: "Smog 3"
 PANOPLIES_SMOG_1_PERK_EFFECT: "#flavor #!"
 PANOPLIES_SMOG_2_PERK_EFFECT: "#flavor #!"
