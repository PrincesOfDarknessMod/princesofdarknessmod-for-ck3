 defilements_focus_effect_desc: "Your [main_defilement|E] is [GetPlayer.Custom('PODMainDefilement')]\nYou have [GetPlayer.MakeScope.ScriptValue('defiled_concession_value')|0V] [defilements_concession|E]"
 PODMainDefilement_none: "to be selected"

 defilements_of_taint_visible: "Defilements of Taint"
 PODMainDefilement_taint: "#TOOLTIP:defilements_of_taint_concession_gain_tt;underline;V Defilements of Taint#!"
 defilements_of_taint_concession_gain: "By getting this [perk|E] you will choose $PODMainDefilement_taint$ as your [main_defilement|E]"
 defilements_of_taint_concession_gain_tt: "You gain [defilements_concession|E] by:\n$BULLET_WITH_TAB$Tainting shen into servitude by usage of [GetPerk('defilements_share_taint_perk').GetName(GetPlayer)]: #P +1#!\n$BULLET_WITH_TAB$Succeeding [personal_schemes|E]: #P +1#!.\n\nDevils of Taint lose [defilements_concession|E] by:\n$BULLET_WITH_TAB$Killing: #N -1#!\n$BULLET_WITH_TAB$Starting [hostile_schemes|E]: #N -1#!."

 defilements_share_taint_perk_name: "Share Taint"
 defilements_perfect_employee_perk_name: "Perfect Employee"
 defilements_friendly_akuma_perk_name: "Friendly Akuma"
 defilements_infernal_tongue_perk_name: "Infernal Tongue"
 DEFILEMENTS_SHARE_TAINT_PERK_EFFECT: "As a [character_interaction|E], convince target to become [akuma|E] as long they have #V +50#! [opinion|E] of you.\n#flavor Defiled can share taint they carry to other shen as long they are willing to accept it.#!"
 DEFILEMENTS_PERFECT_EMPLOYEE_PERK_EFFECT: "#flavor Defiled have an almost supernatural predisposition to completing orders.#!"
 DEFILEMENTS_FRIENDLY_AKUMA_PERK_EFFECT: "#flavor Defiled can appear almost friendly despise the obvious taint on them.#!"
 DEFILEMENTS_INFERNAL_TONGUE_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_infernal_tongue_modifier').GetNameWithTooltip] for #V 10#! years at cost of [defilements_concession|E].As a [character_interaction|E], gain [GetModifier('POD_infernal_tongue_modifier').GetNameWithTooltip] for #V 10#! years at cost of [defilements_concession|E].\n#flavor Defiled can request their master to infuse their tongue with demonic chi, making them much more talented in social scenarios.#!"

 defilements_hide_taint_perk_name: "Hide Taint"
 defilements_puppys_eyes_perk_name: "Puppy's Eyes"
 DEFILEMENTS_HIDE_TAINT_PERK_EFFECT: "Improve [GetPerk('defilements_share_taint_perk').GetName(GetPlayer)] [character_interaction|E] by lowering [opinion|E] requirement to #V 40#!.\n#flavor Defiled can hide most of their obvious taint for a short time.#!"
 DEFILEMENTS_HIDE_TAINT_PERK_REASON: "You have [GetPerk('defilements_hide_taint_perk').GetName(GetPlayer)]: $VALUE|+=0$"
 DEFILEMENTS_PUPPYS_EYES_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_puppys_eyes_modifier').GetNameWithTooltip] for #V 10#! years at cost of [defilements_concession|E].\n#flavor Defiled can appear as innocent as reasonable to target.#!"
 
 defilements_impose_taint_perk_name: "Impose Taint"
 defilements_yomi_beauty_perk_name: "Yomi Beauty"
 DEFILEMENTS_IMPOSE_TAINT_PERK_EFFECT: "Improve [GetPerk('defilements_share_taint_perk').GetName(GetPlayer)] [character_interaction|E] by guaranteeing success on [imprisoned|E] characters.\n#flavor Defiled can forcefully impose their taint onto target, mind that this procedure is long and require direct contact.#!"
 DEFILEMENTS_YOMI_BEAUTY_PERK_EFFECT: "As a [character_interaction|E], improve [GetTrait('beauty_good_1').GetName(GetPlayer)] [traits|E] or lift [GetTrait('nosferatu').GetName(GetPlayer)] $glossary_clan_curse$ at cost of [defilements_concession|E].\n#flavor Defiled can beg their master to enhance their beauty.#!"
 
 defilements_harmless_taint_perk_name: "Harmless Taint"
 defilements_yomi_authority_perk_name: "Yomi Authority"
 DEFILEMENTS_HARMLESS_TAINT_PERK_EFFECT: "Improve [GetPerk('defilements_share_taint_perk').GetName(GetPlayer)] [character_interaction|E] by lowering [opinion|E] requirement to #V 25#!.\n#flavor Defiled can make their taint appear as harmless, even if recipient knows better.#!"
 DEFILEMENTS_HARMLESS_TAINT_PERK_REASON: "You have [GetPerk('defilements_harmless_taint_perk').GetName(GetPlayer)]: $VALUE|+=0$"
 DEFILEMENTS_YOMI_AUTHORITY_PERK_EFFECT: "As a [character_interaction|E], gain [strong_hook|E] on [akuma|E] without [GetTrait('defiled').GetName(GetPlayer)] [trait|E] at cost of [defilements_concession|E].\n#flavor Defiled can ask their master to infuse them with authority of Yomi, making lesser akuma more obedient.#!"
 
 defilements_your_fellow_akuma_perk_name: "Your Fellow Akuma"
 defilements_the_mask_of_yomi_perk_name: "The Mask of Yomi"
 defilements_black_whispers_perk_name: "Black Whispers"
 DEFILEMENTS_YOUR_FELLOW_AKUMA_PERK_EFFECT: "Improve [GetPerk('defilements_share_taint_perk').GetName(GetPlayer)] [character_interaction|E] by lowering [opinion|E] requirement to #V 10#!.\n#flavor Defiled can deceive their target into believing they already are akuma.#!"
 DEFILEMENTS_YOUR_FELLOW_AKUMA_PERK_REASON: "You have [GetPerk('defilements_your_fellow_akuma_perk').GetName(GetPlayer)]: $VALUE|+=0$"
 DEFILEMENTS_THE_MASK_OF_YOMI_PERK_EFFECT: "As a [character_interaction|E], make target like you(#V +50 [opinion]#!) at cost of [defilements_concession|E].\n#flavor Defiled can hide all of their taint, appearing as normal as possible.#!"
 DEFILEMENTS_BLACK_WHISPERS_PERK_EFFECT: "Improve [GetPerk('defilements_infernal_tongue_perk').GetName(GetPlayer)] [character_interaction|E] by replacing [GetModifier('POD_infernal_tongue_modifier').GetNameWithTooltip] with [GetModifier('POD_black_whispers_modifier').GetNameWithTooltip]\n#flavor Defiled can request direct support in social scenarios from their master.#!"

 defilements_devil_of_taint_perk_name: "Devil of Taint"
 DEFILEMENTS_DEVIL_OF_TAINT_PERK_EFFECT: "#flavor Defiled's master reshapes defiled into devil of taint, spreading Yama King's influence everywhere they go.#!"


 defilements_of_war_visible: "Defilements of War"
 PODMainDefilement_war: "#TOOLTIP:defilements_of_war_concession_gain_tt;underline;V Defilements of War#!"
 defilements_of_war_concession_gain: "By getting this [perk|E] you will choose $PODMainDefilement_war$ as your [main_defilement|E]"
 defilements_of_war_concession_gain_tt: "You gain [defilements_concession|E] by:\n$BULLET_WITH_TAB$Wining a [war|E]: #P +1#!\n$BULLET_WITH_TAB$Declaring a [war|E]: #P +1#!.\n\nDevils of War lose [defilements_concession|E] by:\n$BULLET_WITH_TAB$Losing a [war|E]: #N -1#!\n$BULLET_WITH_TAB$Being at peace for longer than 10 years: #N -1#! per year."

 defilements_forces_of_yomi_perk_name: "Forces of Yomi"
 defilements_infernal_strategy_perk_name: "Infernal Strategy"
 defilements_perfect_commander_perk_name: "Perfect Commander"
 DEFILEMENTS_FORCES_OF_YOMI_PERK_EFFECT: "Unlocks several demonic [men_at_arms|E].\n#flavor Defiled's master grants their slave a portion of their weakest demons for combat purposes.#!"
 DEFILEMENTS_PERFECT_COMMANDER_PERK_EFFECT: "#flavor Defiled can learn combat strategies directly from Yomi.#!"
 DEFILEMENTS_INFERNAL_STRATEGY_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_infernal_strategy_modifier').GetNameWithTooltip] for #V 10#! years at cost of [defilements_concession|E].\n#flavor Defiled can ask their master to infuse them with portion of Yomi's combat wisdom.#!"

 defilements_yomis_gratitude_perk_name: "Yomi's Gratitude"
 defilements_detect_weakness_perk_name: "Detect Weakness"
 defilements_infernal_aura_perk_name: "Infernal Aura"
 defilements_lord_of_water_perk_name: "Lord of Water"
 DEFILEMENTS_YOMIS_GRATITUDE_PERK_EFFECT: "#flavor Defiled's contribution to expanding their master's ideas, grants them better demons for future combat.#!"
 DEFILEMENTS_DETECT_WEAKNESS_PERK_EFFECT: "#flavor Defiled can almost instinctively detect weakness in their opponents tactics.#!"
 DEFILEMENTS_INFERNAL_AURA_PERK_EFFECT: "[peace|E] Acceptance: #P +10#!\n#flavor Defiled can borrow a small portion of Yomi's aura to increase submission of target.#!"
 DEFILEMENTS_LORD_OF_WATER_PERK_EFFECT: "#flavor Defiled can change water's state of being, by using part of Yomi their master left in them.#!"

 defilements_night_parade_of_one_hundred_demons_perk_name: "Night Parade of One Hundred Demons"
 defilements_yomis_proposal_perk_name: "Yomi's Proposal"
 DEFILEMENTS_NIGHT_PARADE_OF_ONE_HUNDRED_DEMONS_PERK_EFFECT: "#flavor Defiled due to their exceptional work gets access to even better demons from Yomi.#!"
 DEFILEMENTS_YOMIS_PROPOSAL_PERK_EFFECT: "[peace|E] Acceptance: #P +10#!\n#flavor Defiled can borrow part of Yomi's greatness to make their target more submissive and accepting of demands.#!"

 defilements_demons_of_yomi_perk_name: "Demons of Yomi"
 defilements_yomi_portal_perk_name: "Yomi Portal"
 DEFILEMENTS_DEMONS_OF_YOMI_PERK_EFFECT: "#flavor Defiled gets access to exceptional demons from Yomi, thanks to contribution they did in Yomi's war effort.#!"
 DEFILEMENTS_YOMI_PORTAL_PERK_EFFECT: "Increase chance of [imprisoning|E] enemy knights by #V 25%#!.\n#flavor Defiled can open direct portal to Yomi, the best use case of this power is opening portal directly under enemy.#!"

 defilements_hell_bound_perk_name: "Hell Bound"
 defilements_the_iron_hands_perk_name: "The Iron Hands"
 defilements_luck_of_yomi_perk_name: "Luck of Yomi"
 DEFILEMENTS_HELL_BOUND_PERK_EFFECT: "#flavor Defiled's master seeing their slave's exceptional work grants them one of the best demons they have to increase defiled effectiveness in war.#!"
 DEFILEMENTS_THE_IRON_HANDS_PERK_EFFECT: "Deal [GetPlayer.MakeScope.ScriptValue('POD_defilements_the_iron_hands_value')|0V] [POD_superficial_damage|E] enemy [knights|E] and [commanders|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor Defiled can beg their master to personally wound their opponents.#!"
 DEFILEMENTS_LUCK_OF_YOMI_PERK_EFFECT: "Improve [GetPerk('defilements_infernal_tongue_perk').GetName(GetPlayer)] [character_interaction|E] by replacing [GetModifier('POD_infernal_strategy_modifier').GetNameWithTooltip] with [GetModifier('POD_luck_of_yomi_modifier').GetNameWithTooltip].\n#flavor Defiled can request direct support in war planning from their master.#!"

 defilements_devil_of_war_perk_name: "Devil of War"
 DEFILEMENTS_DEVIL_OF_WAR_PERK_EFFECT: "Remove [kingdom|E] level holy war cooldown.\n#flavor Defiled's master reshapes their defiled into devil of war, brining war and cataclysm everywhere they go.#!"