 defilements_devils_anger_perk_name: "Devil's Anger"
 defilements_devils_wings_perk_name: "Devil's Wings"
 DEFILEMENTS_DEVILS_ROAR_PERK_EFFECT: "Give [GetModifier('POD_devils_roar_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor Defiled's master grants their slave the ability to roar, temporary stunning enemies that hear it.#!"
 DEFILEMENTS_DEVILS_ANGER_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_devils_anger_modifier').GetNameWithTooltip] for #V 10#! years at cost of $pod_defilements_concession$.\n#flavor Defiled can beg their master to infuse them with the anger of a devil.#!"
 DEFILEMENTS_DEVILS_WINGS_PERK_EFFECT: "Choosing this [perk|E] will change your appearance by adding #R Demonic wings#!.\n#flavor Defiled's master grants their slave wings to increase their usefulness.#!"

 defilements_devils_command_perk_name: "Devil's Command"
 defilements_devils_mind_perk_name: "Devil's Mind"
 DEFILEMENTS_DEVILS_COMMAND_PERK_EFFECT: "You are able to [imprison|E] [characters|E] that would have been impossible to capture in [siege|E] or [raid|E] otherwise.\n#flavor Defiled's master grants their slave the ability to issue near-unstoppable command to their enemies after they were sufficiently weakened.#!"
 DEFILEMENTS_DEVILS_MIND_PERK_EFFECT: "Gain strong mental defenses, making you immune to some mental powers.\n#flavor Defiled's master grants their slave the mind of a devil, immune to most mental powers.#!"

 defilements_devils_presence_perk_name: "Devil's Presence"
 defilements_devils_strength_perk_name: "Devil's Strength"
 defilements_devils_rage_perk_name: "Devil's Rage"
 DEFILEMENTS_DEVILS_PRESENCE_PERK_EFFECT: "Give [GetModifier('POD_devils_presence_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor Defiled's master grants their slave the presence of a devil, inducing horror in everything that sees them.#!"
 DEFILEMENTS_DEVILS_STRENGTH_PERK_EFFECT: "#flavor Defiled's master grants their slave the strength of a devil, capable of crushing stones by strength alone.#!"
 DEFILEMENTS_DEVILS_RAGE_PERK_EFFECT: "Improve [GetPerk('defilements_devils_anger_perk').GetName(GetPlayer)] [character_interaction|E] by replacing [GetModifier('POD_devils_anger_modifier').GetNameWithTooltip] with [GetModifier('POD_devils_rage_modifier').GetNameWithTooltip].\n#flavor Defiled can use the pure rage their master gives them in more optimal ways.#!"

 defilements_devil_of_rage_perk_name: "Devil of Rage"
 DEFILEMENTS_DEVIL_OF_RAGE_PERK_EFFECT: "[POD_health_track|E] boxes: #P +1#!.\n#flavor Defiled's master completes their defiled transformation into a devil of rage. A being that exists only for slaughter.#!"