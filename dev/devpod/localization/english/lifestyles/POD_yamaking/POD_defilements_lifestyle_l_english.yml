 defilements_taint_share_taint_perk_name: "Share Taint"
 defilements_taint_perfect_employee_perk_name: "Perfect Employee"
 defilements_taint_friendly_akuma_perk_name: "Friendly Akuma"
 defilements_taint_infernal_tongue_perk_name: "Infernal Tongue"

 DEFILEMENTS_TAINT_SHARE_TAINT_PERK_EFFECT: "As a [character_interaction|E], convince target to become [akuma|E] as long they have #V +50#! [opinion|E] of you.\n#flavor Defiled can share taint they carry to other shen as long they are willing to accept it.#!"
 DEFILEMENTS_TAINT_PERFECT_EMPLOYEE_PERK_EFFECT: "#flavor Defiled have an almost supernatural predisposition to completing orders.#!"
 DEFILEMENTS_TAINT_FRIENDLY_AKUMA_PERK_EFFECT: "#flavor Defiled can appear almost friendly despise the obvious taint on them.#!"
 DEFILEMENTS_TAINT_INFERNAL_TONGUE_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_infernal_tongue_modifier').GetNameWithTooltip] for #V 10#! years at cost of [defilements_concession|E].\n#flavor Defiled can request their master to infuse their tongue with demonic chi, making them much more talented in social scenarios.#!"

 defilements_taint_hide_taint_perk_name: "Hide Taint"
 defilements_taint_puppys_eyes_perk_name: "Puppy's Eyes"

 DEFILEMENTS_TAINT_HIDE_TAINT_PERK_EFFECT: "Improve [GetPerk('defilements_taint_share_taint_perk').GetName(GetPlayer)] [character_interaction|E] by lowering [opinion|E] requirement to #V 40#!.\n#flavor Defiled can hide most of their obvious taint for a short time.#!"
 DEFILEMENTS_TAINT_HIDE_TAINT_PERK_REASON: "You have [GetPerk('defilements_taint_hide_taint_perk').GetName(GetPlayer)]: $VALUE|+=0$"
 DEFILEMENTS_TAINT_PUPPYS_EYES_PERK_EFFECT: "As a [character_interaction|E], gain [GetModifier('POD_puppys_eyes_modifier').GetNameWithTooltip] for #V 10#! years at cost of [defilements_concession|E].\n#flavor Defiled can appear as innocent as reasonable to target.#!"
 
 defilements_taint_impose_taint_perk_name: "Impose Taint"
 defilements_taint_yomi_beauty_perk_name: "Yomi Beauty"

 DEFILEMENTS_TAINT_IMPOSE_TAINT_PERK_EFFECT: "Improve [GetPerk('defilements_taint_share_taint_perk').GetName(GetPlayer)] [character_interaction|E] by guaranteeing success on [imprisoned|E] characters.\n#flavor Defiled can forcefully impose their taint onto target, mind that this procedure is long and require direct contact.#!"
 DEFILEMENTS_TAINT_YOMI_BEAUTY_PERK_EFFECT: "As a [character_interaction|E], improve [GetTrait('beauty_good_1').GetName(GetPlayer)] [traits|E] or lift [GetTrait('nosferatu').GetName(GetPlayer)] $glossary_clan_curse$ at cost of [defilements_concession|E].\n#flavor Defiled can beg their master to enhance their beauty.#!"
 
 defilements_taint_harmless_taint_perk_name: "Harmless Taint"
 defilements_taint_yomi_authority_perk_name: "Yomi Authority"

 DEFILEMENTS_TAINT_HARMLESS_TAINT_PERK_EFFECT: "Improve [GetPerk('defilements_taint_share_taint_perk').GetName(GetPlayer)] [character_interaction|E] by lowering [opinion|E] requirement to #V 25#!.\n#flavor Defiled can make their taint appear as harmless, even if recipient knows better.#!"
 DEFILEMENTS_TAINT_HARMLESS_TAINT_PERK_REASON: "You have [GetPerk('defilements_taint_harmless_taint_perk').GetName(GetPlayer)]: $VALUE|+=0$"
 DEFILEMENTS_TAINT_YOMI_AUTHORITY_PERK_EFFECT: "As a [character_interaction|E], gain [strong_hook|E] on [akuma|E] without [GetTrait('defiled').GetName(GetPlayer)] [trait|E] at cost of [defilements_concession|E].\n#flavor Defiled can ask their master to infuse them with authority of Yomi, making lesser akuma more obedient.#!"
 
 defilements_taint_your_fellow_akuma_perk_name: "Your Fellow Akuma"
 defilements_taint_the_mask_of_yomi_perk_name: "The Mask of Yomi"
 defilements_taint_black_whispers_perk_name: "Black Whispers"

 DEFILEMENTS_TAINT_YOUR_FELLOW_AKUMA_PERK_EFFECT: "Improve [GetPerk('defilements_taint_share_taint_perk').GetName(GetPlayer)] [character_interaction|E] by lowering [opinion|E] requirement to #V 10#!.\n#flavor Defiled can deceive their target into believing they already are akuma.#!"
 DEFILEMENTS_TAINT_YOUR_FELLOW_AKUMA_PERK_REASON: "You have [GetPerk('defilements_taint_your_fellow_akuma_perk').GetName(GetPlayer)]: $VALUE|+=0$"
 DEFILEMENTS_TAINT_THE_MASK_OF_YOMI_PERK_EFFECT: "As a [character_interaction|E], make target like you(#V +50 [opinion]#!) at cost of [defilements_concession|E].\n#flavor Defiled can hide all of their taint, appearing as normal as possible.#!"
 DEFILEMENTS_TAINT_BLACK_WHISPERS_PERK_EFFECT: "Improve [GetPerk('defilements_taint_infernal_tongue_perk').GetName(GetPlayer)] [character_interaction|E] by replacing [GetModifier('POD_infernal_tongue_modifier').GetNameWithTooltip] with [GetModifier('POD_black_whispers_modifier').GetNameWithTooltip]\n#flavor Defiled can request direct support in social scenarios from their master.#!"

 defilements_taint_devil_of_taint_perk_name: "Devil of Taint"

 DEFILEMENTS_TAINT_DEVIL_OF_TAINT_PERK_EFFECT: "#flavor Defiled's master reshapes defiled into devil of taint, spreading Yama King's influence everywhere they go.#!"