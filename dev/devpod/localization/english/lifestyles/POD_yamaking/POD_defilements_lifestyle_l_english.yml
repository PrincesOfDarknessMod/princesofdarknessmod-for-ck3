l_english:
 defilements_lifestyle_name: "Defilements"
 defilements_lifestyle_desc: "The sinister and blasphemous investments of power in the infernalists of the Devil Kings, Defilements are the wicked weapons of befouled."
 monthly_defilements_lifestyle_xp_gain_mult: "Monthly Defilements [lifestyle|E] [experience|E]"
 monthly_defilements_lifestyle_xp_gain_add: "Monthly Defilements [lifestyle|E] [experience|E]"
 
 POD_CONCESSION_CHECK_TOOLTIP: "You need to spend $VALUE|0V$ [defilements_concession|E] to gain this [perk|E]"
 defilements_focus: "Defilements Focus"
