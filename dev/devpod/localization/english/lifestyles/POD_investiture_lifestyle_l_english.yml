 EBON_FOUNTAIN_PERK_EFFECT: "You lose 10 [stress|E] each month\n#F The character's P'o is connected to a wellspring of demonic power.#!"
 LUCK_OF_YOMI_PERK_EFFECT: "As a [decision|E], allows you to spend investiture points to gain gold and prestige. If already unlocked the decision, it will reward more gold.\n#F The Yama-kings alter the character's joss, and fortunes miles upon the [akuma|E] as a result.#!"
