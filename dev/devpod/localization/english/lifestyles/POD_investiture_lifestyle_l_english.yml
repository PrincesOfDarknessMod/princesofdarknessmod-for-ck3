 UNION_OF_OPPOSITIONS_PERK_EFFECT: "#F The [Glossary('Yama Kings','podgloss.yamaking')] lay their hands upon the character and he is remade.#!"
 IRON_HANDS_PERK_EFFECT: "#F The character now moves with the might of the [Glossary('Yama Kings','podgloss.yamaking')] behind her.#!"
 BREATH_OF_KNOWLEDGE_PERK_EFFECT: "#F The [Glossary('Yama Kings','podgloss.yamaking')] whisper their knowledge into the character'sears, and it burns in his brainlike white-hot iron.#!"
 TOUCH_OF_YAMA_KINGS_PERK_EFFECT: "#F The touch of [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] is upon the character.#!"
