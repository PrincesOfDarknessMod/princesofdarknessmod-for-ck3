l_english:
 demon_arts_lifestyle_name: "Demon Arts"
 demon_arts_lifestyle_desc: "The Demon Arts are innate, almost instinctual expressions of the [kuei_jin|E] inner beast, the P'o. They are easy to learn, cost no effort or Chi, and they are limitless in terms of potential mastery, though their power is not without consequence."
 monthly_demon_arts_lifestyle_xp_gain_mult: "Monthly Demon Arts [lifestyle|E] [experience|E]"
 monthly_demon_arts_lifestyle_xp_gain_add: "Monthly Demon Arts [lifestyle|E] [experience|E]"

 demon_arts_focus: "Demon Arts Focus"
 demon_arts_focus_modifier: "[GetFocus('demon_arts_focus').GetName]"
 demon_arts_focus_desc: "Unleashing your P'o"
 demon_arts_focus_effect_desc: "Focusing on Demon Arts grants:"

 devil_fist_visible: "Devil Fist"
 black_wind_visible: "Black Wind"
 iron_mountain_visible: "Iron Mountain"
 demon_regalia_visible: "Demon Regalia"

 DEMON_ARTS_STACKING_EFFECT: "#i This [perk|E] can be bought as many times as written in the [perk|E]'s name.!#!"

 demon_arts_infernal_might_perk_name: "Infernal Might ([ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')])"
 demon_arts_devil_fist_perk_name: "Devil Fist ([ROOT.Char.MakeScope.ScriptValue('demon_arts_devil_fist_modifier_stacks')]/9)"

 DEMON_ARTS_INFERNAL_MIGHT_PERK_EFFECT: "As a [character_interaction|E], give to yourself [GetModifier('demon_arts_infernal_might_modifier').GetNameWithTooltip] for 10 years at the cost of 10 [Glossary('Dharma','podgloss.dharma')] xp.\n#flavor Culmination of Devil Fist, your body becomes a weapon fueled by your pain and suffering.#!"
 DEMON_ARTS_INFERNAL_MIGHT_PERK_COST_EFFECT: "#i This [perk|E] costs [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')] [perk|E] points! Each [GetPerk('demon_arts_devil_fist_perk').GetName(CHARACTER.Self)] will decrease this cost by 1!#!" 
 DEMON_ARTS_INFERNAL_MIGHT_PERK_COST_WARNING_EFFECT: "#X @warning_icon! You do not have [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')] [perk|E] points!#!" 
 DEMON_ARTS_DEVIL_FIST_PERK_EFFECT: "#flavor Your muscles bulge; your knuckles become like stones. You will beat your enemies into red mist, breaking the weak against your knee like a dry branch.#!"

 demon_arts_infernal_speed_perk_name: "Infernal Speed ([ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')])"
 demon_arts_black_wind_perk_name: "Black Wind ([ROOT.Char.MakeScope.ScriptValue('demon_arts_black_wind_modifier_stacks')]/9)"

 DEMON_ARTS_INFERNAL_SPEED_PERK_EFFECT: "As a [character_interaction|E], give to yourself [GetModifier('demon_arts_infernal_speed_modifier').GetNameWithTooltip] for 10 years at the cost of 10 [Glossary('Dharma','podgloss.dharma')] xp.\n#flavor Culmination of Black Wind, your speed exceeds the speed of sound.#!"
 DEMON_ARTS_INFERNAL_SPEED_PERK_COST_EFFECT: "#i This [perk|E] costs [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')] [perk|E] points! Each [GetPerk('demon_arts_black_wind_perk').GetName(CHARACTER.Self)] will decrease this cost by 1!#!" 
 DEMON_ARTS_INFERNAL_SPEED_PERK_COST_WARNING_EFFECT: "#X @warning_icon! You do not have [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')] [perk|E] points!#!" 
 DEMON_ARTS_BLACK_WIND_PERK_EFFECT: "#flavor A blur, then a geyser of blood, you move like a snapped wire, a killing viper. In your dance of violence, not a single movement is wasted.#!"

 demon_arts_infernal_fortitude_perk_name: "Infernal Fortitude ([ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')])"
 demon_arts_iron_mountain_perk_name: "Iron Mountain ([ROOT.Char.MakeScope.ScriptValue('demon_arts_iron_mountain_modifier_stacks')]/9)"

 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_EFFECT: "As a [character_interaction|E], give to yourself [GetModifier('demon_arts_infernal_fortitude_modifier').GetNameWithTooltip] for 5 years at the cost of 10 [Glossary('Dharma','podgloss.dharma')] xp.\n#flavor Culmination of Iron Mountain, your flesh becomes iron, nothing can go through it.#!"
 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_COST_EFFECT: "#i This [perk|E] costs [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')] [perk|E] points! Each [GetPerk('demon_arts_iron_mountain_perk').GetName(CHARACTER.Self)] will decrease this cost by 1!#!" 
 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_COST_WARNING_EFFECT: "#X @warning_icon! You do not have [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')] [perk|E] points!#!" 
 DEMON_ARTS_IRON_MOUNTAIN_PERK_EFFECT: "#flavor You endure the flame, the fist, the sword, with skin as unyielding as steel. When the rain of attacks finally sputters and ends, you smile; now it's your turn.#!"

 demon_arts_infernal_glory_perk_name: "Infernal Glory ([ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')])"
 demon_arts_demon_regalia_perk_name: "Demon Regalia ([ROOT.Char.MakeScope.ScriptValue('demon_arts_demon_regalia_modifier_stacks')]/9)"

 DEMON_ARTS_INFERNAL_GLORY_PERK_EFFECT: "As a [character_interaction|E], give to yourself [GetModifier('demon_arts_infernal_glory_modifier').GetNameWithTooltip] for 5 years at the cost of 10 [Glossary('Dharma','podgloss.dharma')] xp.\n\n#flavor Culmination of Demon Regalia, you become the true descendant of the Ten Thousand Warriors.#!"
 DEMON_ARTS_INFERNAL_GLORY_PERK_COST_EFFECT: "#i This [perk|E] costs [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')] [perk|E] points! Each [GetPerk('demon_arts_demon_regalia_perk').GetName(CHARACTER.Self)] will decrease this cost by 1!#!" 
 DEMON_ARTS_INFERNAL_GLORY_PERK_COST_WARNING_EFFECT: "#X @warning_icon! You do not have [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')] [perk|E] points!#!" 
 DEMON_ARTS_DEMON_REGALIA_PERK_EFFECT: "As a [character_interaction|E], shapeshift into any demon regalia you collected.\nTrigger an event to choose a new demon regalia.\n#flavor Hideous yet beautiful; deadly yet glorious. Wicked one, wear your crown and sword with pride.#!"
 