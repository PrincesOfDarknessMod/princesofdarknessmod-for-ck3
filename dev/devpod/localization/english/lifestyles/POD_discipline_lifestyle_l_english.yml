 ##Grail Knight
 GKBOONS_REQUIREMENT_TIER1: "@alert_icon!#alert_trial Requires 25 #TOOLTIP:trait_track_POD_grail_knight_desc #L $trait_track_POD_grail_knight$#!#! to remain active#!"
 GKBOONS_REQUIREMENT_TIER2: "@alert_icon!#alert_trial Requires 50 #TOOLTIP:trait_track_POD_grail_knight_desc #L $trait_track_POD_grail_knight$#!#! to remain active#!"
 GKBOONS_REQUIREMENT_TIER3: "@alert_icon!#alert_trial Requires 75 #TOOLTIP:trait_track_POD_grail_knight_desc #L $trait_track_POD_grail_knight$#!#! to remain active#!"
 GKBOONS_REQUIREMENT_LESSER_VERSION: "$EFFECT_LIST_BULLET$Unlocks a lesser version of this perk that you can grant to others through [GetPerk('gkboons_continuity_of_blood_perk').GetName(GetNullCharacter)]"

 gkboons_none_perk_name: "No Boons"
 POD_grail_knight_trait_tt_header: "#bold;clickable;outline [Localize(SCOPE.GetFlagName('saved_tooltip'))]:#!"
 POD_grail_knight_trait_tt_no_perks: "#weak [character.GetFirstNameNoTooltip] does not have any Grail Boons#!"
 gkboons_full_vampire: "Vampiric Boons of the Grail"
 gkboons_inherited_vampire: "Vampiric Boons of the Blessed"
 gkboons_full_hunter: "Mortal Boons of the Grail"
 
 gkboons_inner_light_perk_name: "@ghoul_icon!Inner Light"
 GKBOONS_INNER_LIGHT_PERK_EFFECT: ""
 POD_gkboons_inner_light_perk_modifier: "Inner Light"
 POD_gkboons_inner_light_perk_modifier_desc: "This character's skin is so pale that is seems translucent, glowing faintly from within. The light shines on certain hidden angles in their face until even features that would have seemed hideous under any other circumstances transformed themselves into things of power."  # GC2 pg 151, 241
 gkboons_compassion_of_michael_perk_name: "@ghoul_icon!Compassion of Michael"
 GKBOONS_COMPASSION_OF_MICHAEL_PERK_EFFECT: "$EFFECT_LIST_BULLET$#P -50%#! damage received from [sun_damage_short_with_icon|E]"
 gkboons_quick_flows_the_blood_perk_name: "@ghoul_icon!Quick Flows the Blood"
 GKBOONS_QUICK_FLOWS_THE_BLOOD_PERK_EFFECT: "$EFFECT_LIST_BULLET$Reduces the cooldown of $POD_blood_heal_interaction$"
 gkboons_stolen_blood_stolen_health_perk_name: "@ghoul_icon!Stolen Blood, Stolen Health"
 GKBOONS_STOLEN_BLOOD_STOLEN_HEALTH_PERK_EFFECT: "$EFFECT_LIST_BULLET$[PODUnlocksCombatMove('POD_combat_move_stolen_blood_stolen_health')]"

 gkboons_sworn_to_another_perk_name: "@ghoul_icon!Sworn to Another"
 GKBOONS_SWORN_TO_ANOTHER_PERK_EFFECT: "$EFFECT_LIST_BULLET$Cannot be blood bonded"
 gkboons_squires_retinue_perk_name: "@ghoul_icon!A Squire's Retinue"
 GKBOONS_SQUIRES_RETINUE_PERK_EFFECT: "$EFFECT_LIST_BULLET$Your $POD_splat_ghoul_plural$' effective [ghoul_greatest_vitae_ingested|E] will be #V 1#! [Glossary('Generation','game_concept_vampgeneration_desc')] lower, to a minimum of [GetTrait('vampgeneration4').GetName(GetNullCharacter)]"
 gkboons_compassion_of_raphael_perk_name: "@ghoul_icon!Compassion of Raphael"
 GKBOONS_COMPASSION_OF_RAPHAEL_PERK_EFFECT: "$EFFECT_LIST_BULLET$#P -50%#! damage received from [fire_damage_short_with_icon|E]"
 gkboons_hedge_of_thorns_perk_name: "@ghoul_icon!Hedge of Thorns"
 GKBOONS_HEDGE_OF_THORNS_PERK_EFFECT: "$EFFECT_LIST_BULLET$You are less likely to [Glossary('Frenzy','game_concept_beast_desc')]"
 gkboons_lesser_blight_of_the_fisher_king_perk_name: "@ghoul_icon!Lesser Blight of the Fisher King"
 GKBOONS_LESSER_BLIGHT_OF_THE_FISHER_KING_PERK_EFFECT: "$EFFECT_LIST_BULLET$As a [character_interaction|E], prevent a vampire from naturally healing"
 POD_gkboons_blight_of_the_fisher_king_interaction: "Blight of the Fisher King"
 POD_gkboons_blight_of_the_fisher_king_interaction_desc: "Cursed by a festering wound in his side, the Fisher King could not be healed until a worthy Grail-seeker asked the proper question and attained the Grail. Those blessed by the Grail can impose a similar curse upon others."
 POD_gkboons_blight_of_the_fisher_king_perk_modifier: "Blight of the Fisher King"
 POD_gkboons_blight_of_the_fisher_king_perk_modifier_desc: "Much like the Fisher King, only a great deal of effort will heal your wounds.\n#N Cannot naturally heal#!"
 gkboons_faith_in_something_greater_perk_name: "@ghoul_icon!Faith in Something Greater"
 GKBOONS_FAITH_IN_SOMETHING_GREATER_PERK_EFFECT: "$EFFECT_LIST_BULLET$Lowers cost of all [Glossary('True Faith','game_concept_true_faith_desc')] [character_interactions|E]"

 gkboons_free_from_the_dark_father_perk_name: "@ghoul_icon!Free From the Dark Father"
 GKBOONS_FREE_FROM_THE_DARK_FATHER_PERK_EFFECT: "$EFFECT_LIST_BULLET$No longer affected by your $glossary_clan_curse$"
 gkboons_compassion_of_uriel_perk_name: "@ghoul_icon!Compassion of Uriel"
 GKBOONS_COMPASSION_OF_URIEL_PERK_EFFECT: "$EFFECT_LIST_BULLET$As a [decision|E], refill your Blood, though you no longer gain [resonance|E] from feeding and cannot have a [POD_herd|E]"
 gkboons_on_redemptions_road_perk_name: "@ghoul_icon!On Redemption's Road"
 GKBOONS_ON_REDEMPTIONS_ROAD_PERK_EFFECT: "$EFFECT_LIST_BULLET$Hostile [Glossary('True Faith','game_concept_true_faith_desc')] [character_interactions|E] #italic may#! not work when targeting you"
 
 gkboons_forgiveness_of_michael_perk_name: "@vampire_icon!Forgiveness of Michael"
 GKBOONS_FORGIVENESS_OF_MICHAEL_PERK_EFFECT: "$EFFECT_LIST_BULLET$[sun_damage_short_with_icon|E] now deals [POD_superficial_damage_with_box|E]\n$EFFECT_LIST_BULLET$Become immune to sun-based murder methods\n#flavor Just as Jesus' blood washed away the stain of Adam's sin, so to has it washed away the stain of Caine's sin and Michael's curse upon him with it.#!"
 gkboons_pure_as_snow_perk_name: "@vampire_icon!Pure as Snow"
 GKBOONS_PURE_AS_SNOW_PERK_EFFECT: "#flavor Your skin takes on a snow-like pallor and glows with something like reflected moonlight.#!"
 POD_gkboons_pure_as_snow_perk_modifier: "Pure as Snow"
 POD_gkboons_pure_as_snow_perk_modifier_desc: "While bright enough to prevent stealth, your visible purity convinces most of your trustworthiness."
 gkboons_swift_flows_the_blood_perk_name: "@vampire_icon!Swift Flows the Blood"
 GKBOONS_SWIFTS_FLOWS_THE_BLOOD_PERK_EFFECT: "$EFFECT_LIST_BULLET$Reduces the cooldown of $POD_blood_heal_interaction$\n$EFFECT_LIST_BULLET$Increases damage healed by $POD_blood_heal_interaction$\n#flavor The Grail possesses miraculous powers of healing, and its blessing allows you to better harness the power of Vitae to regenerate your undead flesh.#!"
 gkboons_stolen_blood_stolen_life_perk_name: "@vampire_icon!Stolen Blood, Stolen Life"
 GKBOONS_STOLEN_BLOOD_STOLEN_LIFE_PERK_EFFECT: "$EFFECT_LIST_BULLET$[PODUnlocksCombatMove('POD_combat_move_stolen_blood_stolen_health')]\n$EFFECT_LIST_BULLET$[PODUnlocksCombatMove('POD_combat_move_stolen_blood_stolen_life')]\n#flavor To restore one, another must suffer for no debt may go unpaid.#!"

 gkboons_forgiveness_of_raphael_perk_name: "@vampire_icon!Forgiveness of Raphael"
 GKBOONS_FORGIVENESS_OF_RAPHAEL_PERK_EFFECT: "$EFFECT_LIST_BULLET$Become immune to fire\n#flavor Just as Jesus' blood washed away the stain of Adam's sin, so to has it washed away the stain of Caine's sin and Raphael's curse upon him with it.#!"
 gkboons_crown_of_thorns_perk_name: "@vampire_icon!Crown of Thorns"
 GKBOONS_CROWN_OF_THORNS_PERK_EFFECT: "$EFFECT_LIST_BULLET$Will never [Glossary('Frenzy','game_concept_beast_desc')]\n#flavor At the center of your soul is now a crown of thorns, the sanctified blood that guards the last shred of humanity and repels the Beast.#!"
 gkboons_full_sworn_to_another_perk_name: "@vampire_icon!Sworn to Another"
 GKBOONS_FULL_SWORN_TO_ANOTHER_PERK_EFFECT: "$EFFECT_LIST_BULLET$Cannot be blood bonded\n#flavor No man can serve two masters, and your Master is greater than all others.#!"
 gkboons_knights_retinue_perk_name: "@vampire_icon!A Knight's Retinue"
 GKBOONS_KNIGHTS_RETINUE_PERK_EFFECT: "$EFFECT_LIST_BULLET$Your [ghouls|E]' effective [ghoul_greatest_vitae_ingested|E] will be #V 4#! [Glossary('Generations','game_concept_vampgeneration_desc')] lower, to a minimum of [GetTrait('vampgeneration4').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$Your [ghouls|E] are [GetTrait('physique_good_1').GetName(GetNullCharacter)] and gain more [prowess|E]\n#flavor A Knight of the Grail must have a proper retinue, capable of aiding them in bringing light to the world.#!"
 gkboons_faith_of_the_redeemed_perk_name: "@vampire_icon!Faith of the Blessed"
 GKBOONS_FAITH_OF_THE_REDEEMED_PERK_EFFECT: "$EFFECT_LIST_BULLET$Increases [modifier|E] duration of $POD_ha_bless_interaction$ and $POD_ha_penance_interaction$\n$EFFECT_LIST_BULLET$Lowers cost of all [Glossary('True Faith','game_concept_true_faith_desc')] [character_interactions|E]\n#flavor Your faith in God is absolute for you have felt His redemptive power.#!"
 gkboons_blight_of_the_fisher_king_perk_name: "@vampire_icon!Blight of the Fisher King"
 GKBOONS_BLIGHT_OF_THE_FISHER_KING_PERK_EFFECT: "$EFFECT_LIST_BULLET$As a [character_interaction|E], prevent a vampire from naturally healing\n#flavor Cursed by a festering wound in his side, the Fisher King could not be healed until a worthy Grail-seeker asked the proper question and attained the Grail. Those blessed by the Grail can impose a similar curse upon others.#!"

 gkboons_forgiveness_of_uriel_perk_name: "@vampire_icon!Forgiveness of Uriel"
 GKBOONS_FORGIVENESS_OF_URIEL_PERK_EFFECT: "$EFFECT_LIST_BULLET$Infinite [Concept('hunger','@blood_icon!Blood')|E] reserves, though you no longer gain [resonance|E] from feeding and cannot have a [POD_herd|E]\n#flavor Just as Jesus' blood washed away the stain of Adam's sin, so to has it washed away the stain of Caine's sin and Uriel's curse upon him with it.#!"
 gkboons_redeemed_by_the_blood_perk_name: "@vampire_icon!Redeemed by the Blood"
 GKBOONS_REDEEMED_BY_THE_BLOOD_PERK_EFFECT: "$EFFECT_LIST_BULLET$All faith-related [POD_aggravated_damage_with_box|E] will be limited to 1 [POD_damage|E]\n$EFFECT_LIST_BULLET$Hostile [Glossary('True Faith','game_concept_true_faith_desc')] [character_interactions|E] #italic may#! not work when targeting you\n#flavor You have been redeemed by the blood of the Grail and flooded with God's holy power.#!"
 gkboons_full_free_from_the_dark_father_perk_name: "@vampire_icon!Free From the Dark Father"
 GKBOONS_FULL_FREE_FROM_THE_DARK_FATHER_PERK_EFFECT: "$EFFECT_LIST_BULLET$No longer affected by your $glossary_clan_curse$\n#flavor Just as Jesus' blood washed away the stain of Adam's sin, so to has it washed away the stain of your $pod_clan$'s progenitor's sin and Caine curse upon them with it.#!"
 gkboons_continuity_of_blood_perk_name: "@vampire_icon!Overflowing Blessings"
 GKBOONS_CONTINUITY_OF_BLOOD_PERK_EFFECT: "$EFFECT_LIST_BULLET$Those that drink your willingly-given blood #bold may#! receive a lesser form of your Grail-given boons\n#flavor God's blessings overflow your cup, spilling over to those around you.#!"
