 exalted_window_in_the_door_technique_perk_name: "Window-in-the-Door Technique"
 exalted_wave_breaking_palm_perk_name: "Wave-Breaking Palm"

 EXALTED_EXCELLENCE_OF_THE_CRASHING_WAVE_PERK_EFFECT: "[GetPassiveCharm('excellence_of_the_crashing_wave')].\n#flavor By feeding raw Essence into her actions, the Water Aspect may perform feats far beyond mortal expectations.#!"
 EXALTED_NAKED_THIEF_STYLE_PERK_EFFECT: "[GetPassiveCharm('naked_thief_style')].\n#flavor he rise and fall of tumblers within a lock is not, in its way, so unlike the motions of ocean waves. The Dragon-Blooded may pick locks and otherwise defeat security measures without any specialized or even improvised tools.#!"
 EXALTED_PERFECT_GAMBLING_PRANA_PERK_EFFECT: "[GetPassiveCharm('perfect_gambling_prana')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_perfect_gambling_prana')].\n#flavor With a tilt of her hand and a small burst of Essence, the Dragon-Blooded may alter the flow of probability so that it takes the course she desires.#!"
 EXALTED_WINDOW_IN_THE_DOOR_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('window_in_the_door_technique')].\n#flavor The Dragon-Blooded passes her hand over a wall, and a small portion of it briefly becomes as transparent to her as a calm stream.#!"
 EXALTED_WAVE_BREAKING_PALM_PERK_EFFECT: "[GetPassiveCharm('wave_breaking_palm')].\n#flavor Imbuing her bare hands with the surging power of the tides, the Exalt becomes adept at blocking strikes.#!"

 exalted_confluence_of_savant_thought_perk_name: "Confluence of Savant Thought"
 exalted_drowning_embrace_perk_name: "Drowning Embrace"
 exalted_homeward_trail_discovery_method_perk_name: "Homeward Trail Discovery Method"
 exalted_observer_awareness_method_perk_name: "Observer Awareness Method"

 EXALTED_CONFLUENCE_OF_SAVANT_THOUGHT_PERK_EFFECT: "[GetPassiveCharm('confluence_of_savant_thought')].\n#flavor When the Dragon-Blooded stands amidst the complex workings of a formal organization, knowledge of its structural workings trickle down to inform her smooth interactions with it.#!"
 EXALTED_DROWNING_EMBRACE_PERK_EFFECT: "[GetPassiveCharm('drowning_embrace')].\n#flavor The Dragon-Blooded impregnates an attack with the invasive Essence of water, allowing her to drown her enemies on dry land.#!"
 EXALTED_HOMEWARD_TRAIL_DISCOVERY_METHOD_PERK_EFFECT: "[GetPassiveCharm('homeward_trail_discovery_method')].\n#flavor Everyone is carried downstream from their home, and the Dragon-Blooded may follow that stream back to its source.#!"
 EXALTED_OBSERVER_AWARENESS_METHOD_PERK_EFFECT: "[GetPassiveCharm('observer_awareness_method')].\n#flavor No one can gaze upon water without the water capturing their likeness in turn. The Dragon-Blooded becomes keenly aware when she is being watched.#!"

 exalted_riptide_method_perk_name: "Riptide Method"
 exalted_sun_on_water_deceit_perk_name: "Sun on Water Deceit"
 exalted_thrashing_carp_serenade_perk_name: "Thrashing Carp Serenade"
 exalted_tides_of_daana_d_perk_name: "Tides of Daana'D"

 EXALTED_RIPTIDE_METHOD_PERK_EFFECT: "[GetPassiveCharm('riptide_method')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_riptide_method')].\n#flavor The Dragon-Blooded's muscles surge with the inevitable fury of the undertow, drawing an enemy into an embrace from which there is no escape.#!"
 EXALTED_SUN_ON_WATER_DECEIT_PERK_EFFECT: "[GetPassiveCharm('sun_on_water_deceit')].\n#flavor The Dragon-Blooded projects into the world only those impressions she wishes to, hiding the truth within the depths of her heart.#!"
 EXALTED_THRASHING_CARP_SERENADE_PERK_EFFECT: "[character_interaction|E]: Give [GetModifier('POD_thrashing_carp_serenade_modifier').GetNameWithTooltip] to target.\n#flavor The Dragon-Blooded casts turbulent Essence into the workings of a bureau, organization, or project, damming up its efficient function.#!"
 EXALTED_TIDES_OF_DAANA_D_PERK_EFFECT: "[character_interaction|E]: Gain [GetModifier('POD_tides_of_daana_d_modifier').GetNameWithTooltip].\n#flavor The Dragon-Blooded may fill herself with the mercurial adaptability of water and the power of the pounding tidal wave while immersed in or surrounded by water.#!"

 exalted_stone_and_river_revelation_perk_name: "Stone and River Revelation"
 exalted_flow_past_defenses_perk_name: "Flow Past Defenses"
 exalted_geese_flying_south_administration_perk_name: "Geese Flying South Administration"

 EXALTED_STONE_AND_RIVER_REVELATION_PERK_EFFECT: "[character_interaction|E]: End all exposed [schemes|E] targeting the target.\n#flavor The Dragon-Blooded, faced with a piece of evidence at the scene of a mystery, can follow her instincts until she reunifies it with the culprit responsible for its creation.#!"
 EXALTED_FLOW_PAST_DEFENSES_PERK_EFFECT: "[GetPassiveCharm('flow_past_defenses')].\n#flavor Water finds a way through anything, given time enough. So it is with the Exalt's attacks.#!"
 EXALTED_GEESE_FLYING_SOUTH_ADMINISTRATION_PERK_EFFECT: "[character_interaction|E]: Share 50% of your [skills|E] with target.\n#flavor Sometimes a diligent leader cannot be present for even the most crucial of tasks, and must entrust her power and authority to others. The Dragon-Blooded has learned to do so, and can pour her elemental miracles into one of the Dragon-Touched, as one fills a cup with water.#!"

 exalted_returning_wave_counterstrike_perk_name: "Returning Wave Counterstrike"
 exalted_bottomless_depths_defense_perk_name: "Bottomless Depths Defense"
 exalted_falsehood_unearthing_attitude_perk_name: "Falsehood Unearthing Attitude"

 EXALTED_RETURNING_WAVE_COUNTERSTRIKE_PERK_EFFECT: "[GetPassiveCharm('returning_wave_counterstrike')].\n#flavor Accepting the forces turned against her, the Exalt may send them back against her attacker.#!"
 EXALTED_BOTTOMLESS_DEPTHS_DEFENSE_PERK_EFFECT: "[character_interaction|E]: Trade [EmptyScope.ScriptValue('POD_self_mutilation_base_damage')] [POD_aggravated_damage_with_box|E] to gain [GetModifier('POD_bottomless_depths_defense_modifier').GetNameWithTooltip] until you [soak_damage|E] a wound.\n#flavor Faced with the inevitability of harm, the Dragon-Blooded learns to trade calamity for lesser suffering, sending her enemy's attack spiraling away into the depths of the element of water itself. That ancient abyss has absorbed so much pain over the years that some measure of it overflows back into the Exalt, making some degree of injury unavoidable.#!"
 EXALTED_FALSEHOOD_UNEARTHING_ATTITUDE_PERK_EFFECT: "[character_interaction|E]: Expose all [schemes|E] of target and reveal all their [secrets|E] to you.\n#flavor The Dragon-Blooded becomes keenly aware of the disturbances and ripples in a person's Essence that indicate deceit.#!"

