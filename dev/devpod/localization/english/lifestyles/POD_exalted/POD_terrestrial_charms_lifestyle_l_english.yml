l_english:
 air_charms_visible: "Air Charms"

 exalted_excellence_of_the_raging_storm_perk_name: "Excellence of the Raging Storm"
 exalted_grasping_talon_of_the_wind_dragon_perk_name: "Grasping Talon of the Wind Dragon"
 exalted_language_learning_ritual_perk_name: "Language-Learning Ritual"
 exalted_soundless_action_prana_perk_name: "Soundless Action Prana"
 exalted_wind_carried_words_technique_perk_name: "Wind-Carried Words Technique"

 EXALTED_EXCELLENCE_OF_THE_RAGING_STORM_PERK_EFFECT: "[GetPassiveCharm('excellence_of_the_raging_storm')].\n#flavor By feeding raw Essence into her actions, an Aspect of Air may perform feats far beyond the human norm.#!"
 EXALTED_GRASPING_TALON_OF_THE_WIND_DRAGON_PERK_EFFECT: "[GetPassiveCharm('grasping_talon_of_the_wind_dragon')].\n#flavor The Dragon-Blooded creates a powerful wind-vortex in her hand, drawing a nearby object into her grasp.#!"
 EXALTED_LANGUAGE_LEARNING_RITUAL_PERK_EFFECT: "[GetPassiveCharm('language_learning_ritual')].\n#flavor By spending at least an hour listening to a language, the Dragon-Blooded may gain temporary fluency in it.#!"
 EXALTED_SOUNDLESS_ACTION_PRANA_PERK_EFFECT: "[GetPassiveCharm('soundless_action_prana')].\n#flavor The Dragon-Blooded stirs the air to smother all noises she makes.#!"
 EXALTED_WIND_CARRIED_WORDS_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('wind_carried_words_technique')].\n#flavor The Dragon-Blooded may entrust her words to the wind, letting it carry whatever she says to a desired recipient.#!"

 exalted_distracting_breeze_meditation_perk_name: "Distracting Breeze Meditation"
 exalted_elemental_bolt_attack_perk_name: "Elemental Bolt Attack"
 exalted_gale_force_research_technique_perk_name: "Gale-Force Research Technique"
 exalted_spirit_detecting_mirror_technique_perk_name: "Spirit-Detecting Mirror Technique"
 exalted_wind_weapons_perk_name: "Wind Weapons"

 EXALTED_DISTRACTING_BREEZE_MEDITATION_PERK_EFFECT: "[GetPassiveCharm('distracting_breeze_meditation')].\n#flavor The Dragon-Blooded may stir the wind to knock over small objects, slam doors, rustle curtains, and otherwise cause small distractions.#!"
 EXALTED_ELEMENTAL_BOLT_ATTACK_PERK_EFFECT: "[GetPassiveCharm('elemental_bolt_attack')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_elemental_bolt_attack')].\n#flavor The Dragon-Blooded concentrates her Essence into a weapon, hurling a deadly elemental manifestation at her enemies. This manifestation varies based on her Aspect: Air Aspects hurl a lightning bolt; Earth Aspects, a jagged stone spike; Fire Aspects, a bolt of flame; Water Aspects, a lance of gleaming ice; and Wood Aspects, a wooden javelin.#!"
 EXALTED_GALE_FORCE_RESEARCH_TECHNIQUE_PERK_EFFECT: "[character_interaction|E]: Use book or journal [artifact|E] to gain [GetModifier('POD_gale_force_research_technique_modifier').GetNameWithTooltip] for 5 years scaling with the rarity.\n#flavor While standing within a library or similar archive, the Dragon-Blooded fixes a question in her mind and unleashes her Essence. Violent winds disrupt the room, toppling books from shelves and scattering loose papers in all directions. If the information she seeks is present, then when she opens her eyes, she will find it sitting before her; the relevant papers have been blown into her hands, or the relevant book has tumbled open in front of her, opened to the passage she needs.#!"
 EXALTED_SPIRIT_DETECTING_MIRROR_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('spirit_detecting_mirror_technique')].\n#flavor The Exalt may attune her senses to reality's otherworldly emanations, glimpsing them in reflective surfaces such as mirrors or still water.#!"
 EXALTED_WIND_WEAPONS_PERK_EFFECT: "[GetPassiveCharm('wind_weapons')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_wind_weapon')].\n#flavor With but a moment's concentration, the Exalt may solidify melee or throwing weapons out of the very air itself.#!"

 exalted_elemental_succor_method_perk_name: "Elemental Succor Method"
 exalted_grace_of_mela_perk_name: "Grace of Mela"
 exalted_wind_between_world_passage_perk_name: "Wind-Between-World Passage"

 EXALTED_ELEMENTAL_SUCCOR_METHOD_PERK_EFFECT: "[GetPassiveCharm('elemental_succor_method')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_elemental_succor_method')].\n#flavor By seeking refuge in her element, the Dragon-Blood may rapidly restore herself to health.#!"
 EXALTED_GRACE_OF_MELA_PERK_EFFECT: "[character_interaction|E]: gain [GetModifier('POD_grace_of_mela_modifier').GetNameWithTooltip] for 5 years.\n#flavor The Dragon-Blooded may fill herself with the ferocity of the cyclone, the speed of the gale, or the grandeur of the raging storm simply by exposure to such forces of nature.#!"
 EXALTED_WIND_BETWEEN_WORLD_PASSAGE_PERK_EFFECT: "[GetPassiveCharm('wind_between_world_passage')].\n#flavor The Dragon-Blooded attunes herself to the wind that blows between layers of reality, and follows it into one of the other-worlds.#!"

 exalted_elemental_concentration_trance_perk_name: "Elemental Concentration Trance"
 exalted_elemental_empowerment_meditation_perk_name: "Elemental Empowerment Meditation"
 exalted_vengeful_gust_strike_perk_name: "Vengeful Gust Strike"

 EXALTED_ELEMENTAL_CONCENTRATION_TRANCE_PERK_EFFECT: "[GetPassiveCharm('elemental_concentration_trance')].\n#flavor By intently focusing her Essence, the Dragon-Blooded may compress many days of study into an hour.#!"
 EXALTED_ELEMENTAL_EMPOWERMENT_MEDITATION_PERK_EFFECT: "#flavor In extreme circumstances, the character may cannibalize her Aspect element for power, ripping the Essence out of the world and leaving it injured and barren.#!"
 EXALTED_VENGEFUL_GUST_STRIKE_PERK_EFFECT: "[GetPassiveCharm('vengeful_gust_strike')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_vengeful_gust_strike')].\n#flavor The Dragon-Blooded learns to harness the gale as her weapon, sending foes flying.#!"

 exalted_dragon_shroud_technique_perk_name: "Dragon Shroud Technique"
 exalted_spirit_joining_invitation_perk_name: "Spirit-Joining Invitation"
 exalted_whirlwind_shield_form_perk_name: "Whirlwind Shield Form"

 EXALTED_DRAGON_SHROUD_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('dragon_shroud_technique')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_dragon_shroud_technique')].\n#flavor The Dragon-Blooded can wrap herself in a shroud of concealing air, becoming little more than a faint shimmer.#!"
 EXALTED_SPIRIT_JOINING_INVITATION_PERK_EFFECT: "[GetPassiveCharm('spirit_joining_invitation')].\n#flavor The Exalt can use her Essence to bind together a consenting spirit and a physical vessel for it that she has crafted for that purpose.#!"
 EXALTED_WHIRLWIND_SHIELD_FORM_PERK_EFFECT: "[GetPassiveCharm('whirlwind_shield_form')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_whirlwind_shield_form')].\n#flavor The Dragon-Blooded bends ferocious air currents around herself, creating a defensive barrier against ranged attacks.#!"

 charm_excellence_of_the_raging_storm_perk_name: "$exalted_excellence_of_the_raging_storm_perk_name$"
 charm_grasping_talon_of_the_wind_dragon_perk_name: "$exalted_grasping_talon_of_the_wind_dragon_perk_name$"
 CHARM_GRASPING_TALON_OF_THE_WIND_DRAGON_PERK_EFFECT: "De-equip weapon [artifact|E] of a enemy [knight|E] with highest [prowess|E] at start of a battle."
 charm_language_learning_ritual_perk_name: "$exalted_language_learning_ritual_perk_name$"
 charm_soundless_action_prana_perk_name: "$exalted_soundless_action_prana_perk_name$"
 charm_wind_carried_words_technique_perk_name: "$exalted_wind_carried_words_technique_perk_name$"
 
 charm_distracting_breeze_meditation_perk_name: "$exalted_distracting_breeze_meditation_perk_name$"
 charm_elemental_bolt_attack_perk_name: "$exalted_elemental_bolt_attack_perk_name$"
 charm_spirit_detecting_mirror_technique_perk_name: "$exalted_spirit_detecting_mirror_technique_perk_name$"
 CHARM_SPIRIT_DETECTING_MIRROR_TECHNIQUE_PERK_EFFECT: "Can interact with beings in [umbra|E] while on [UmbraGlossary('earth')]."
 charm_wind_weapons_perk_name: "$exalted_wind_weapons_perk_name$"

 charm_elemental_succor_method_perk_name: "$exalted_elemental_succor_method_perk_name$"
 charm_wind_between_world_passage_perk_name: "$exalted_wind_between_world_passage_perk_name$"
 CHARM_WIND_BETWEEN_WORLD_PASSAGE_PERK_EFFECT: "Can interact with beings on [UmbraGlossary('earth')] while staying in the [umbra|E]."

 charm_elemental_concentration_trance_perk_name: "$exalted_elemental_concentration_trance_perk_name$"
 charm_vengeful_gust_strike_perk_name: "$exalted_vengeful_gust_strike_perk_name$"
 CHARM_VENGEFUL_GUST_STRIKE_PERK_EFFECT: "You gain an increased chance to severely wound enemy [knights|E] in [combat_phase|E] as a [knight|E]."

 charm_dragon_shroud_technique_perk_name: "$exalted_dragon_shroud_technique_perk_name$"
 charm_spirit_joining_invitation_perk_name: "$exalted_spirit_joining_invitation_perk_name$"
 CHARM_SPIRIT_JOINING_INVITATION_PERK_EFFECT: "Can use fetish [artifacts|E]."
 charm_whirlwind_shield_form_perk_name: "$exalted_whirlwind_shield_form_perk_name$"

 # Additional Rewards
 
 charm_excellence_of_the_raging_storm_extra_perk_name: "$charm_excellence_of_the_raging_storm_perk_name$ x2"

