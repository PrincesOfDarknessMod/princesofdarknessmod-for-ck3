 exalted_hidden_petal_aria_method_perk_name: "Hidden Petal Aria Method"
 exalted_talented_improvisation_perk_name: "Talented Improvisation"

 EXALTED_EXCELLENCE_OF_THE_VERDANT_FOREST_PERK_EFFECT: "[GetPassiveCharm('excellence_of_the_verdant_forest')].\n#flavor By feeding raw Essence into her actions, the Wood Aspect may perform feats far beyond mortal expectations.#!"
 EXALTED_HARVEST_OF_THE_HUNTER_PERK_EFFECT: "[GetPassiveCharm('harvest_of_the_hunter')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_harvest_of_the_hunter')].\n#flavor Nature itself abhors the thought of the Dragon-Blooded ever being caught helpless and unarmed by her enemies. At any time she can reach into a nearby plant or wooden object and draw forth both weapon and ammunition with which to fight.#!"
 EXALTED_HIDDEN_PETAL_ARIA_METHOD_PERK_EFFECT: "[GetPassiveCharm('hidden_petal_aria_method')].\n#flavor As beautiful flowers may conceal deadly poison, so the Dragon-Blooded's performance contains concealed messages for select members of her audience.#!"
 EXALTED_TALENTED_IMPROVISATION_PERK_EFFECT: "[character_interaction|E]: Gain [GetModifier('POD_talented_improvisation_modifier').GetNameWithTooltip].\n#flavor So bright is the Exalt's smile, so ringing her laughter, so disarming her mannerisms that she can smoothly recover from any misstep or mistake.#!"

 exalted_disease_banishing_technique_perk_name: "Disease-Banishing Technique"
 exalted_enchanting_performance_perk_name: "Enchanting Performance"
 exalted_trail_concealing_measure_perk_name: "Trail-Concealing Measure"
 exalted_wild_wandering_forester_style_perk_name: "Wild-Wandering Forester Style"

 EXALTED_DISEASE_BANISHING_TECHNIQUE_PERK_EFFECT: "[character_interaction|E]: Heal any non-supernatural disease.\n#flavor By infusing a patient with the Essence of the good and growing Earth throughout the course of a treatment, the Dragon-Blooded empowers them to throw off any disease.#!"
 EXALTED_ENCHANTING_PERFORMANCE_PERK_EFFECT: "[character_interaction|E]: Gain a [weak_hook|E] on target with at least #V 50#! [opinion|E] of you, this can be done once more to improve it to [strong_hook|E].\n#flavor Over the course of an intimate, one-on-one artistic performance, the Dragon-Blooded lulls her target into a suggestive state, and may plant commands deep into their psyche.#!"
 EXALTED_TRAIL_CONCEALING_MEASURE_PERK_EFFECT: "[GetPassiveCharm('trail_concealing_measure')].\n#flavor The world tidies itself in the Dragon-Blooded's wake, making it nearly impossible to tell where she has passed.#!"
 EXALTED_WILD_WANDERING_FORESTER_STYLE_PERK_EFFECT: "[GetPassiveCharm('wild_wandering_forester_style')].\n#flavor Nature welcomes the return of the Dragon-Blooded. Predators avoid her, and the wilderness offers up shelter and bounty for the taking.#!"

 exalted_bounty_of_sextes_jylis_perk_name: "Bounty of Sextes Jylis"
 exalted_quarry_revelation_technique_perk_name: "Quarry Revelation Technique"
 exalted_wilds_stalking_ways_perk_name: "Wilds-Stalking Ways"
 exalted_wound_closing_touch_perk_name: "Wound-Closing Touch"

 EXALTED_BOUNTY_OF_SEXTES_JYLIS_PERK_EFFECT: "[character_interaction|E]: Gain [GetModifier('POD_bounty_of_sextes_jylis_modifier').GetNameWithTooltip].\n#flavor The Dragon-Blooded may fill herself with the boundless energy of life itself when surrounded by nature and growing things.#!"
 EXALTED_QUARRY_REVELATION_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('quarry_revelation_technique')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_quarry_revelation_technique')].\n#flavor The Dragon-Blooded can read the shape her quarry leaves in the world; it is as though the land, the plants, the air itself conspire to lead her to her prey.#!"
 EXALTED_WILDS_STALKING_WAYS_PERK_EFFECT: "[GetPassiveCharm('wilds_stalking_ways')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_wilds_stalking_ways')].\n#flavor The Exalt attunes her Essence to the natural world, becoming an instinctive stalker and killer.#!"
 EXALTED_WOUND_CLOSING_TOUCH_PERK_EFFECT: "[character_interaction|E]: Heal [EmptyScope.ScriptValue('POD_wound_closing_touch_heal')] [POD_superficial_damage_with_box|E], [EmptyScope.ScriptValue('POD_wound_closing_touch_aggravated_heal')] [POD_aggravated_damage_with_box|E] or some injury [traits|E] like [GetTrait('maimed').GetName(GetNullCharacter)] or [GetTrait('one_eyed').GetName(GetNullCharacter)].\n[PODUnlocksCombatMove('POD_combat_move_exalted_wound_closing_touch')].\n#flavor The Dragon-Blooded's ministrations fortify the burgeoning life within her patient, urging his flesh to recover in record time.#!"

 exalted_life_swelling_sap_strike_perk_name: "Life-Swelling Sap Strike"
 exalted_blossom_hides_thorns_perk_name: "Blossom Hides Thorns"
 exalted_elemental_halos_mercy_perk_name: "Elemental Halo's Mercy"
 exalted_swallows_defend_the_nest_perk_name: "Swallows Defend the Nest"

 EXALTED_LIFE_SWELLING_SAP_STRIKE_PERK_EFFECT: "[GetPassiveCharm('life_swelling_sap_strike')].\n#flavor In the hands of the Dragon-Blooded, wood is not merely a hard substance suitable for cracking skulls or shaping into arrows, it is a vector for life itself, and thus inimical to the undead.#!"
 EXALTED_BLOSSOM_HIDES_THORNS_PERK_EFFECT: "[GetPassiveCharm('blossom_hides_thorns')].\n#flavor Nature is a constant dance of life and death, but most observers see only the tranquility of the glade. So it is with the struggles of the Dragon-Blooded, who may conceal a raging firefight with a pack of werewolves as nothing more than peasants performing a play, or a particularly energetic flash mob.#!"
 EXALTED_ELEMENTAL_HALOS_MERCY_PERK_EFFECT: "[GetPassiveCharm('elemental_halos_mercy')].\n#flavor The Dragon-Blooded, through careful practice and refinement, learns to modulate her anima flux so that it discriminates between friend and foe.#!"
 EXALTED_SWALLOWS_DEFEND_THE_NEST_PERK_EFFECT: "[GetPassiveCharm('swallows_defend_the_nest')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_swallows_defend_the_nest')].\n#flavor Guided by an unerring instinct to protect life, the Dragon-Blooded may send forth deadly projectiles to protect herself or another, parrying attacks with knives or arrows.#!"

 exalted_spring_follows_winter_perk_name: "Spring Follows Winter"
 exalted_blossoms_of_the_hanging_tree_perk_name: "Blossoms of the Hanging-Tree"
 exalted_most_beneficent_seed_of_five_dragons_perk_name: "Most Beneficent Seed of Five Dragons"
 exalted_ravenous_thorn_technique_perk_name: "Ravenous Thorn Technique"

 EXALTED_SPRING_FOLLOWS_WINTER_PERK_EFFECT: "[character_interaction|E]: Gain [GetModifier('POD_spring_follows_winter_modifier').GetNameWithTooltip] for 2 years.\n#flavor The Exalt's attacks express the same certainty as the turning of the seasons.#!"
 EXALTED_BLOSSOMS_OF_THE_HANGING_TREE_PERK_EFFECT: "[GetPassiveCharm('blossoms_of_the_hanging_tree')].\n#flavor A wind blows between worlds, stirring otherworldly petals from within the Exalt's anima. While her enemies touch these petals or smell their fragrance, they are afflicted by a weakening poison.#!"
 EXALTED_MOST_BENEFICENT_SEED_OF_FIVE_DRAGONS_PERK_EFFECT: "[character_interaction|E]: Change your or your children's Aspect.\n#flavor Through the most careful cultivation of her Essence, the Dragon-Blooded awakens the seed of the other four elements within her soul.#!"
 EXALTED_RAVENOUS_THORN_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('ravenous_thorn_technique')].\n#flavor Imbuing a wooden weapon with the febrile Essence of unchecked growth, the Dragon-Blooded fills her target's flesh with rapidly-expanding roots and thorns that relentlessly seek the heart.#!"

