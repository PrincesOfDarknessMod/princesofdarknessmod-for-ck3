 exalted_safety_among_enemies_perk_name: "Safety Among Enemies"

 EXALTED_COMET_DEFLECTING_DEFENSE_PERK_EFFECT: "[GetPassiveCharm('comet_deflecting_defense')].\n#flavor The Dragon-Blooded moves into a perfected moment, flaring the inner spark of her Essence into a momentary, invincible conflagration. In its wake, she is briefly left as little more than exhausted ashes, but at least she still endures.#!"
 EXALTED_SAFETY_AMONG_ENEMIES_PERK_EFFECT: "[GetPassiveCharm('safety_among_enemies')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_safety_among_enemies')].\n#flavor The Dragon-Blooded dodges through the midst of her enemies, confusing them with the bright gleam of her eyes and contrails of smoke that trail in her wake. Before they know what has happened, they lay dead, cut down by their own crossfire.#!"

