 earth_charms_visible: "Earth Charms"

 exalted_excellence_of_the_eternal_mountain_perk_name: "Excellence of the Eternal Mountain"
 exalted_all_encompassing_earth_sense_perk_name: "All-Encompassing Earth Sense"
 exalted_earth_dragons_stony_glare_perk_name: "Earth Dragon's Stony Glare"
 exalted_stone_carving_fingers_form_perk_name: "Stone-Carving Fingers Form"

 EXALTED_EXCELLENCE_OF_THE_ETERNAL_MOUNTAIN_PERK_EFFECT: "[GetPassiveCharm('excellence_of_the_eternal_mountain')].\n#flavor By feeding raw Essence into her actions, the Earth Aspect may perform feats far beyond mortal expectations.#!"
 EXALTED_ALL_ENCOMPASSING_EARTH_SENSE_PERK_EFFECT: "[GetPassiveCharm('all_encompassing_earth_sense')].\n#flavor By concentrating for a moment, the Dragon-Blooded extends her senses down into the earth itself, 'seeing' the weight and tremors of movement upon the ground.#!"
 EXALTED_EARTH_DRAGONS_STONY_GLARE_PERK_EFFECT: "[GetPassiveCharm('earth_dragons_stony_glare')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_earth_dragons_stony_glare')].\n#flavor The character makes her eyes hard and unforgiving as flint, even as her features subtly sharpen.#!"
 EXALTED_STONE_CARVING_FINGERS_FORM_PERK_EFFECT: "[GetPassiveCharm('stone_carving_fingers_form')].\n#flavor Taking a moment to concentrate her Essence into her fingertips, the Exalt gains the ability to work stone with her bare hands as though it were soft clay.#!"

 exalted_entombed_mind_technique_perk_name: "Entombed Mind Technique"
 exalted_impervious_skin_of_stone_meditation_perk_name: "Impervious Skin of Stone Meditation"
 exalted_sense_riding_method_perk_name: "Sense-Riding Method"
 exalted_scales_of_the_dragon_perk_name: "Scales of the Dragon"

 EXALTED_ENTOMBED_MIND_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('entombed_mind_technique')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_entombed_mind_technique')].\n#flavor The Dragon-Blooded may carefully infuse the somnolent Essence of Earth into someone, placing them into a deep slumber.#!"
 EXALTED_IMPERVIOUS_SKIN_OF_STONE_MEDITATION_PERK_EFFECT: "[GetPassiveCharm('impervious_skin_of_stone_meditation')].\n#flavor The Dragon-Blooded draws the solidity of stone up into her flesh. She must be in contact with stone or soil to use this Charm. Traditionally this is accomplished by standing upon the bare Earth or a stone floor, but many Dragon-Blooded carry a small rock in their pocket, or wear a precious stone on a ring in order to use this Charm at any time.#!"
 EXALTED_SENSE_RIDING_METHOD_PERK_EFFECT: "[character_interaction|E]: Discover a random [secret|E] of target.\n#flavor Through total concentration, the Dragon-Blooded may insinuate her senses into the mind of another, 'riding' their perceptions to see and hear whatever they do.#!"
 EXALTED_SCALES_OF_THE_DRAGON_PERK_EFFECT: "[character_interaction|E]: Use armor [artifact|E] to gain [GetModifier('POD_scales_of_the_dragon_modifier').GetNameWithTooltip] for 5 years scaling with the rarity.\n#flavor The Dragon-Blooded learns to extend the solidity of her Essence into her armor, making it as one with her.#!"

 exalted_rightful_lion_defense_perk_name: "Rightful Lion Defense"
 exalted_pasiap_still_stands_perk_name: "Pasiap Still Stands"
 exalted_strength_of_stone_technique_perk_name: "Strength of Stone Technique"
 exalted_unflagging_vengeance_meditation_perk_name: "Unflagging Vengeance Meditation"

 EXALTED_RIGHTFUL_LION_DEFENSE_PERK_EFFECT: "[GetPassiveCharm('rightful_lion_defense')].\n#flavor The Dragon-Blooded fortifies her beliefs with the solidity of the Earth itself, encasing her convictions in the heart of an unassailable mountain.#!"
 EXALTED_PASIAP_STILL_STANDS_PERK_EFFECT: "[character_interaction|E]: gain [GetModifier('POD_pasiap_still_stands_modifier').GetNameWithTooltip] for 5 years.\n#flavor The Dragon-Blooded may fill herself with the unyielding solidity of the Earth itself simply by being enfolded in its mass.#!"
 EXALTED_STRENGTH_OF_STONE_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('strength_of_stone_technique')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_strength_of_stone_technique')].\n#flavor The Dragon-Blooded draws power from the Earth itself into her body. She must be in contact with stone or soil to use this Charm. Traditionally this is accomplished by standing upon the bare Earth or a stone floor, but many Dragon-Blooded carry a small rock in their pocket, or wear a precious stone on a ring in order to use this Charm at any time.#!"
 EXALTED_UNFLAGGING_VENGEANCE_MEDITATION_PERK_EFFECT: "[GetPassiveCharm('unflagging_vengeance_meditation')].\n#flavor Taking a moment to bury her pain and weaknesses deep within, the Dragon-Blooded becomes temporarily unstoppable.#!"

 exalted_unfeeling_earth_meditation_perk_name: "Unfeeling Earth Meditation"
 exalted_touch_of_unmaking_perk_name: "Touch of Unmaking"
 exalted_ox_body_technique_perk_name: "Ox-Body Technique"

 EXALTED_UNFEELING_EARTH_MEDITATION_PERK_EFFECT: "[GetPassiveCharm('unfeeling_earth_meditation')].\n#flavor With a moment's intense concentration, the Dragon-Blooded may become as enduring as the Earth itself.#!"
 EXALTED_TOUCH_OF_UNMAKING_PERK_EFFECT: "[GetPassiveCharm('touch_of_unmaking')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_touch_of_unmaking')].\n#flavor Everything that has ever been made has its origin in the Earth's bounty. The Dragon-Blood may return those creations to their mother's bosom.#!"
 EXALTED_OX_BODY_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('ox_body_technique')].\n#flavor The Terrestrial's body is fortified with the solidity of the earth, enabling her to survive grievous injuries.#!"

 exalted_chaos_warding_prana_perk_name: "Chaos-Warding Prana"
 exalted_five_dragons_fight_as_one_perk_name: "Five Dragons Fight as One"
 exalted_ramparts_of_obedient_earth_perk_name: "Ramparts of Obedient Earth"

 EXALTED_CHAOS_WARDING_PRANA_PERK_EFFECT: "[GetPassiveCharm('chaos_warding_prana')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_chaos_warding_prana')].\n#flavor The Dragon-Blooded solidifies her Essence to resist hostile magic and the powers of chaos.#!"
 EXALTED_FIVE_DRAGONS_FIGHT_AS_ONE_PERK_EFFECT: "[GetPassiveCharm('five_dragons_fight_as_one')].\n#flavor Drawing upon the greatness of her spirit, the Dragon-Blooded lends out her power and surety to her allies in a time of crisis.#!"
 EXALTED_RAMPARTS_OF_OBEDIENT_EARTH_PERK_EFFECT: "[character_interaction|E]: Give [GetModifier('POD_ramparts_of_obedient_earth_modifier').GetNameWithTooltip] to selected target's [county|E] for 5 years.\n#flavor With but a gesture and a surge of Essence, the Dragon-Blooded may cause trenches to appear in the Earth, walls of stone to burst from the ground, or even to force open gaps in stone surfaces.#!"

 charm_excellence_of_the_eternal_mountain_perk_name: "$exalted_excellence_of_the_eternal_mountain_perk_name$"
 charm_all_encompassing_earth_sense_perk_name: "$exalted_all_encompassing_earth_sense_perk_name$"
 charm_earth_dragons_stony_glare_perk_name: "$exalted_earth_dragons_stony_glare_perk_name$"
 charm_stone_carving_fingers_form_perk_name: "$exalted_stone_carving_fingers_form_perk_name$"

 charm_entombed_mind_technique_perk_name: "$exalted_entombed_mind_technique_perk_name$"
 CHARM_ENTOMBED_MIND_TECHNIQUE_PERK_EFFECT: "At the start of battle, remove the highest [prowess|E] enemy [knight|E] from the battle."
 charm_impervious_skin_of_stone_meditation_perk_name: "$exalted_impervious_skin_of_stone_meditation_perk_name$"

 charm_rightful_lion_defense_perk_name: "$exalted_rightful_lion_defense_perk_name$"
 CHARM_RIGHTFUL_LION_DEFENSE_PERK_EFFECT: "Gain strong mental defenses, making you immune to some mental powers."
 charm_strength_of_stone_technique_perk_name: "$exalted_strength_of_stone_technique_perk_name$"
 charm_unflagging_vengeance_meditation_perk_name: "$exalted_unflagging_vengeance_meditation_perk_name$"

 charm_unfeeling_earth_meditation_perk_name: "$exalted_unfeeling_earth_meditation_perk_name$"
 charm_touch_of_unmaking_perk_name: "$exalted_touch_of_unmaking_perk_name$"
 CHARM_TOUCH_OF_UNMAKING_PERK_EFFECT: "At the start of a battle, damage random equipped [artifacts|E] of your enemy's [knights|E] by #V 50#! points when acting as a [commander|E] during the [combat_phase|E]."
 charm_ox_body_technique_perk_name: "$exalted_ox_body_technique_perk_name$"
 CHARM_OX_BODY_TECHNIQUE_PERK_EFFECT: "[POD_health_track|E] boxes: #P +1#!"

 charm_chaos_warding_prana_perk_name: "$exalted_chaos_warding_prana_perk_name$"
 CHARM_CHAOS_WARDING_PRANA_PERK_EFFECT: "Gain major defenses against [GetTrait('bloodsorcery').GetName(GetNullCharacter)] and #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Sorcery#!#!."
 charm_five_dragons_fight_as_one_perk_name: "$exalted_five_dragons_fight_as_one_perk_name$"
 CHARM_FIVE_DRAGONS_FIGHT_AS_ONE_PERK_EFFECT: "Give [GetModifier('POD_five_dragons_fight_as_one_modifier').GetNameWithTooltip] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E]."
 
 # Additional Rewards
 
 charm_excellence_of_the_eternal_mountain_extra_perk_name: "$charm_excellence_of_the_eternal_mountain_perk_name$ x2"

