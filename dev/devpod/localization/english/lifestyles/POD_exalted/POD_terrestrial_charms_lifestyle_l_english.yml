 fire_charms_visible: "Fire Charms"

 exalted_excellence_of_roaring_flame_perk_name: "Excellence of Roaring Flame"
 exalted_bellows_pumping_stride_perk_name: "Bellows-Pumping Stride"
 exalted_blinding_spark_distraction_perk_name: "Blinding Spark Distraction"
 exalted_dragon_graced_assault_perk_name: "Dragon-Graced Assault"

 EXALTED_EXCELLENCE_OF_ROARING_FLAME_PERK_EFFECT: "[GetPassiveCharm('excellence_of_roaring_flame')].\n#flavor By feeding raw Essence into her actions, the Fire Aspect may perform feats far beyond mortal expectations.#!"
 EXALTED_BELLOWS_PUMPING_STRIDE_PERK_EFFECT: "[GetPassiveCharm('bellows_pumping_stride')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_bellows_pumping_stride')].\n#flavor The Dragon-Blooded runs, and her footfalls strike flames from the earth, leaving a trail of fire in her wake.#!"
 EXALTED_BLINDING_SPARK_DISTRACTION_PERK_EFFECT: "[GetPassiveCharm('blinding_spark_distraction')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_blinding_spark_distraction')].\n#flavor When errant blades or bullets strike against the world, they do so in a great welter of stinging sparks.#!"
 EXALTED_DRAGON_GRACED_ASSAULT_PERK_EFFECT: "[GetPassiveCharm('dragon_graced_assault')].\n#flavor The Dragon-Blooded imbues an attack with the surging power of elemental Essence. This is the source of fists wreathed in flame, bullets trailing lightning bolts, and baseball bats studded with granite spikes.#!"

 exalted_loquacious_courtier_technique_perk_name: "Loquacious Courtier Technique"
 exalted_moth_to_the_candle_perk_name: "Moth to the Candle"
 exalted_smoldering_embers_renewal_perk_name: "Smoldering Embers Renewal"

 EXALTED_LOQUACIOUS_COURTIER_TECHNIQUE_PERK_EFFECT: "[GetPassiveCharm('loquacious_courtier_technique')].\n#flavor The Exalt's passion becomes contagious, spilling out of her words to fill the hearts of those around her.#!"
 EXALTED_MOTH_TO_THE_CANDLE_PERK_EFFECT: "[GetPassiveCharm('moth_to_the_candle')].\n#flavor The Dragon-Blooded stokes her Essence into an irresistible flame which blinds an enemy to all other threats.#!"
 EXALTED_SMOLDERING_EMBERS_RENEWAL_PERK_EFFECT: "[GetPassiveCharm('smoldering_embers_renewal')].\n#flavor Just when it seems she has reached the limit of her efforts, the Exalt flares up and offers one last rally.#!"

 exalted_thoughts_of_ashes_defense_perk_name: "Thoughts of Ashes Defense"
 exalted_ghost_fire_arsenal_perk_name: "Ghost-Fire Arsenal"
 exalted_hesieshs_tempered_heart_perk_name: "Hesiesh's Tempered Heart"
 exalted_hopping_firecracker_evasion_perk_name: "Hopping Firecracker Evasion"

 EXALTED_THOUGHTS_OF_ASHES_DEFENSE_PERK_EFFECT: "[character_interaction|E]: burn away [Glossary('Blood Bonds','game_concept_bloodbond_desc')] or (most) mind-control [hooks|E].\n#flavor The Dragon-Blooded stokes the fire of her true passions, and burns away any externally-imposed thoughts or feelings.#!"
 EXALTED_GHOST_FIRE_ARSENAL_PERK_EFFECT: "[character_interaction|E]: Create a weapon [artifact|E] with [prowess_i]12 [prowess|E].\n#flavor The Dragon-Blooded sculpts weaponry from elemental flames.#!"
 EXALTED_HESIESHS_TEMPERED_HEART_PERK_EFFECT: "[character_interaction|E]: Gain [GetModifier('POD_hesieshs_tempered_heart_modifier').GetNameWithTooltip].\n#flavor The Dragon-Blooded may fill herself with the simmering heat of banked coals and the power of the raging inferno when she is surrounded by heat and flames.#!"
 EXALTED_HOPPING_FIRECRACKER_EVASION_PERK_EFFECT: "[GetPassiveCharm('hopping_firecracker_evasion')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_hopping_firecracker_evasion')].\n#flavor The Dragon-Blooded twists the Essence of her enemy's killing intent into explosive flames, hurling herself across the battlefield to avoid rapid sequences of attacks.#!"

 exalted_passion_transmuting_nuance_perk_name: "Passion-Transmuting Nuance"
 exalted_fivefold_dragon_shout_perk_name: "Fivefold Dragon Shout"
 exalted_ringing_anvil_onslaught_perk_name: "Ringing Anvil Onslaught"

 EXALTED_PASSION_TRANSMUTING_NUANCE_PERK_EFFECT: "[character_interaction|E]: Convert [dread_i]25 [dread|E] into 25 [opinion|E] for target.\n#flavor Blowing on the heart of another, the Dragon-Blooded fills their soul with smoke and flame, confusing their passions and manipulating them into whatever form she desires.#!"
 EXALTED_FIVEFOLD_DRAGON_SHOUT_PERK_EFFECT: "[GetPassiveCharm('fivefold_dragon_shout')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_fivefold_dragon_shout')].\n#flavor The Dragon-Blooded dredges up all the power of her Essence, and releases it as a mighty roar which bathes the battlefield in a wild and uncontrolled manifestation of elemental fury.#!"
 EXALTED_RINGING_ANVIL_ONSLAUGHT_PERK_EFFECT: "[GetPassiveCharm('ringing_anvil_onslaught')].\n[PODUnlocksCombatMove('POD_combat_move_exalted_ringing_anvil_onslaught')].\n#flavor The Dragon-Blooded's attacks strike, one after another, like a smith's hammer shaping white-hot steel.#!"

