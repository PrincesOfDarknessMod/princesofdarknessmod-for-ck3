l_english:
 ancient_sorcery_lifestyle_name: "Ancient Sorcery"
 ancient_sorcery_lifestyle_desc: "The Age of Legends was a time of gods and demons, heroes and miracles... and of magic, great and wondrous magic which turned mighty rivers in their courses, called down storms which destroyed cities, and bent the very courts of the stars in the sky."
 monthly_ancient_sorcery_lifestyle_xp_gain_mult: "Monthly Ancient Sorcery [lifestyle|E] [experience|E]"
 monthly_ancient_sorcery_lifestyle_xp_gain_add: "Monthly Ancient Sorcery [lifestyle|E] [experience|E]"

 ancient_sorcery_visible: "Ancient Sorcery"

 ancient_sorcery_awakened_eye_of_the_dragon_perk_name: "Awaken Eye of The Dragon"
 ANCIENT_SORCERY_AWAKENED_EYE_OF_THE_DRAGON_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Upgrade Dragon Nest [duchy_building|E] level by #V 1#!.\n#flavor An hour-long ritual awakening the spiritual Essence of a Dragon Nest#!"
 ancient_sorcery_bone_lion_perk_name: "Bone Lion"
 ANCIENT_SORCERY_BONE_LION_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Over the period of #V 10#! years deal in total #V 5#! [POD_aggravated_damage_with_box|E] to the target.\n#flavor The sorcerer must ritually blind and eviscerate a human being while making the necessary incantations and ritual movements. The body shudders and splits apart as a terrible lion made of jagged, spiky bones claws its way out of the cadaver, and then mercilessly hunts a target that the sorcerer names for 101 days.#!"
 ancient_sorcery_burning_eyes_of_the_offender_perk_name: "Burning Eyes of The Offender"
 ANCIENT_SORCERY_burning_eyes_of_the_OFFENDER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_ancient_sorcery_burning_eyes_of_the_offender')].\n#flavor The sorcerer speaks the 17 secret names of divinity, causing her anima to sear the eyes of all those who dare to look upon her. Anyone attempting to stare directly at the sorcerer weeps uncontrollably.#!"
 ancient_sorcery_cirrus_skiff_perk_name: "Cirrus Skiff"
 ANCIENT_SORCERY_CIRRUS_SKIFF_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Give [GetModifier('POD_cirrus_skiff_modifier').GetNameWithTooltip] to yourself.\n#flavor The sorcerer calls down a small cloud from the heavens to ride upon. The cloud travels at 200 miles per hour once it ascends high enough that obstacles like trees and office buildings are no longer a concern, and its enchantment prevents those riding upon it from being troubled by wind, cold, or thin air.#!"
 ancient_sorcery_corrupted_words_perk_name: "Corrupted Words"
 ANCIENT_SORCERY_CORRUPTED_WORDS_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Give [GetModifier('POD_corrupted_words_modifier').GetNameWithTooltip] to yourself.\n#flavor The sorcerer threads her Essence into a forbidding curse and casts it upon another while looking him in the eye. Whenever the target attempts to speak of a certain topic forbidden by the sorcerer, he doubles over and uncontrollably vomits a torrent of worms and maggots#!"
 ancient_sorcery_death_of_obsidian_butterflies_perk_name: "Death of Obsidian Butterflies"
 ANCIENT_SORCERY_DEATH_OF_OBSIDIAN_BUTTERFLIES_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_ancient_sorcery_death_of_obsidian_butterflies')].\n#flavor The sorcerer releases her Essence and shapes it into a cascade of streaming butterflies sculpted from razor-edged obsidian. Flashing past her shoulders in a glassy torrent, they shred everything within a path roughly 30 yards wide, 10 yards high, and 100 yards long. After this spell ends, the entire area of its effect is littered with the sharp, broken remnants of the summoned insects.#!"
 ancient_sorcery_emerald_spirit_binding_perk_name: "Emerald Spirit Binding"
 ANCIENT_SORCERY_EMERALD_SPIRIT_BINDING_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Force $POD_splat_spirit$ into a [spirit_pact|E] for #V 10#! years.\n#flavor This powerful spell allows the sorcerer to bind a spirit into her service. It doesn't protect her from the spirit's attempts to visit violence upon her during the course of the binding, and so is best performed after defeating or bargaining with a spirit, or in the company of allies who can protect her while she casts the spell.#!"
 ancient_sorcery_flight_of_separation_perk_name: "Flight of Separation"
 ANCIENT_SORCERY_FLIGHT_OF_SEPARATION_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Escape [prison|E].\n#flavor The sorcerer erupts into a wheeling flock of flying creatures - usually birds, but bats or even flying insects are also possible - and scatters in all directions, seeking freedom by any means necessary. She reforms several minutes later and several miles away, at a place of her choosing, so long as that point is under the open sky.#!"
 ancient_sorcery_invulnerable_skin_of_bronze_perk_name: "Invulnerable Skin of Bronze"
 ANCIENT_SORCERY_INVULNERABLE_SKIN_OF_BRONZE_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Give [GetModifier('POD_invulnerable_skin_of_bronze_modifier').GetNameWithTooltip] to yourself.\n#flavor The sorcerer transforms her very flesh into hardened bronze, capable of turning aside blades and arrows. The sorcerer is truly (and visibly) made of metal, but still needs to breathe, and thus should be wary of open water.#!"
 ancient_sorcery_iron_shade_binding_perk_name: "Iron Shade Binding"
 ANCIENT_SORCERY_IRON_SHADE_BINDING_PERK_EFFECT: "$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor Standing within a circle of blood and bone-dust, the sorcerer performs an hour-long incantation to summon a ghost and bind it into her service. This ritual may only be performed at night or in the Underworld, and requires either the utterance of the ghost's living name, possession of a piece of the shade's body or of one of their Fetters.#!"
 ancient_sorcery_magma_kraken_perk_name: "Magma Kraken"
 ANCIENT_SORCERY_MAGMA_KRAKEN_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_ancient_sorcery_magma_kraken')].\n#flavor The sorcerer rends space and dimensions, drawing forth malevolence from the depths of the Spirit World and wedding it to impossible heat drawn from the Earth's core. As she releases her spell, tentacles of molten lava erupt from the ground and lash at her foes.#!"
 ancient_sorcery_mists_of_eventide_perk_name: "Mists of Eventide"
 ANCIENT_SORCERY_MISTS_OF_EVENTIDE_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Give [GetModifier('POD_mists_of_eventide_modifier').GetNameWithTooltip] to yourself.\n#flavor The sorcerer summons up an opalescent mist that spreads out from her location to insinuate its way through up to three floors of a large building, or similar amount of open ground. All those caught within the mist not given express protection by the sorcerer fall into a deep slumber#!"
 ancient_sorcery_rain_of_spiders_perk_name: "Rain of Spiders"
 ANCIENT_SORCERY_RAIN_OF_SPIDERS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_ancient_sorcery_rain_of_spiders')].\n#flavor The sorcerer raises her hands to the sky and bids clouds to gather. A clicking, rustling noise falls over the steadily dimming day as she gathers her Essence and transmits it into the heavens. Finally, the sky opens and thousands upon thousands of spiders of a multitude of different species drift to earth in living waves, carried upon the wind and tiny nets of silk.#!"
 ancient_sorcery_raise_the_skeletal_horde_perk_name: "Raise the Skeletal Horde"
 ANCIENT_SORCERY_RAISE_THE_SKELETAL_HORDE_PERK_EFFECT: "Unlocks [GetMaA('hidden').GetName], [GetMaA('walker').GetName], [GetMaA('shambler').GetName] and [GetMaA('skeletons').GetName] as [men_at_arms|E].\n#flavor The sorcerer conjures a ball of crackling Essence which forks out black lightning to strike one or more nearby corpses. These enchanted cadavers climb to their feet and become the sorcerer's loyal if limited servants.#!"
 ancient_sorcery_risen_and_screaming_perk_name: "Risen and Screaming"
 ANCIENT_SORCERY_RISEN_AND_SCREAMING_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Give [GetModifier('POD_risen_and_screaming_modifier').GetNameWithTooltip] to yourself.\n#flavor The sorcerer spends an hour speaking the curses of dead gods, dredged from the darkness at the end of all things. These curses sink into the Earth and bind their hatred into the hearts of every dead thing present, changing the enchanted corpses into a kind of security system. When anyone without the sorcerer's blessing trespasses, the dead erupt from the soil while emitting a terrifying, drawn-out scream. If the intruder doesn't flee immediately, they advance and feast#!"
 ancient_sorcery_wood_dragons_claws_perk_name: "Wood Dragon's Claws"
 ANCIENT_SORCERY_WOOD_DRAGONS_CLAWS_PERK_EFFECT: "[exalted_ancient_sorcery_ceremony|E]: Give [GetModifier('POD_wood_dragons_claws_modifier').GetNameWithTooltip] to yourself.\n#flavor The sorcerer transforms her hands into enormous claws of jagged wood, capable of catching spirits on their Essence-infused tips. This transformation endures for precisely 9,999 breaths (about ten hours), or until the sorcerer completely submerges her claws in the Earth.#!"