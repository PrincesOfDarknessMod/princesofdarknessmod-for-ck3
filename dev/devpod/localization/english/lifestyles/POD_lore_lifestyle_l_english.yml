 REALITY_TREMORS_PERK_EFFECT:0 "Allow release [GetModifier('reality_tremors_modifier').GetNameWithTooltip] on target realm.\n#F The Earthbound creates a disturbing but largely cosmetic effect in an area.#!"
 SPHERE_OF_CHAOS_PERK_EFFECT:0 "Allow release [GetModifier('sphere_of_chaos_modifier').GetNameWithTooltip] on target realm.\n#F The Earthbound temporarily suspends the laws of cause and effect in an area.#!"
 WAVE_OF_MUTILATION_PERK_EFFECT:0 "Allow release [GetModifier('wave_of_mutilation_modifier').GetNameWithTooltip] on target realm.\n#F The Earthbound infuses all living flesh in the vicinity with chaotic energies, firing neurons at random and triggering random emotions through unbalanced brain chemistry.#!"
 SUMMON_OUTSIDER_PERK_EFFECT:0 "Allow destroy the barony of target county.\nCan recruit [GetMaA('the_unnamable').GetName] as [men_at_arms|E].\n#F The Earthbound summons something from outside Creation.#!"
 HELL_ON_EARTH_PERK_EFFECT:0 "Allow release [GetModifier('hell_on_earth_modifier').GetNameWithTooltip] on target realm.\n#F This evocation summons a miniature apocalypse.#!"

 create_proxy_perk_name:0 "Create Proxy"
 lash_of_corruption_perk_name:0 "Lash of Corruption"
 taint_the_land_perk_name:0 "Taint the Land"
 corrupt_relic_perk_name:0 "Corrupt Relic"
 unspeakable_servitor_perk_name:0 "Unspeakable Servitor"
 
 CREATE_PROXY_PERK_EFFECT:0 "As a [character_interaction|E], allows you to give the target a wound with its severity depending on the rarity of the claimed recipient's artifact.\n#F The Earthbound turns an object into a node that they can then use their perception and powers through.#!"
 LASH_OF_CORRUPTION_PERK_EFFECT:0 "Bonus chance to kill an enemy knight in war as a knight.\n#F The Earthbound instills their energies into a creature, harming and possibly killing it.#!"
 TAINT_THE_LAND_PERK_EFFECT:0 "Give target county [GetModifier('earthbound_negative_modifier').GetNameWithTooltip] if its holder is at war with you when you move your army on it as a commander.\n#F The Earthbound instills their essence into an area, making it come to life and attack intruders.#!"
 CORRUPT_RELIC_PERK_EFFECT:0 "As a [character_interaction|E], allow you to create a custom artifact.\n#F This evocation allows the Earthbound to create magical artifacts.#!"
 UNSPEAKABLE_SERVITOR_PERK_EFFECT:0 "As a [character_interaction|E], allows you to create a [GetTrait('statue').GetName( GetPlayer )] of yourself to fight in wars, and allow you become a commander even bound to the earth.\n#F The Earthbound has their minions create a statue that they can use as a temporary host body instead of a living body.#!"

 nightmare_sending_perk_name:0 "Nightmare Sending"
 mind_rape_perk_name:0 "Mind Rape"
 visions_of_terror_perk_name:0 "Visions of Terror"
 enslave_perk_name:0 "Enslave"
 devour_the_soul_perk_name:0 "Devour the Soul"
 
 NIGHTMARE_SENDING_PERK_EFFECT:0 "#F This evocation allows the Earthbound to send messages into the dreams of sleeping mortals.#!"
 MIND_RAPE_PERK_EFFECT:0 "As a [character_interaction|E], allows you to know every secret and scheme of the target.\n#F This evocation allows the Earthbound to probe the mind of a mortal that they can see, scanning their thoughts and memories for information.#!"
 VISIONS_OF_TERROR_PERK_EFFECT:0 "#F This evocation projects terrifying visions into the mind of one or more mortals.#!"
 ENSLAVE_PERK_EFFECT:0 "As a [character_interaction|E], allows you gain hook from target.\n#F With this evocation, an Earthbound can completely control the mind and body of a mortal, making them do and say whatever the Earthbound wishes.#!"
 DEVOUR_THE_SOUL_PERK_EFFECT:0 "Bonus to $EXECUTION_DEVOUR_SOUL$ [executions|E] option, allows you to devour the target's mind to increase your education or an attribute.\n#F With this evocation, an Earthbound can tear the soul from a living mortal and devour it, draining it of energy, memories and even precious Faith.#!"
