 noble_arts_backwards_glance_perk_name: "Backwards Glance"
 noble_arts_effect_and_cause_perk_name: "Effect and Cause"
 noble_arts_set_in_stone_perk_name: "Set in Stone"
 noble_arts_deja_vu_perk_name: "Deja-Vu"
 noble_arts_time_dilatation_perk_name: "Time Dilatation"

 NOBLE_ARTS_BACKWARDS_GLANCE_PERK_EFFECT: "If any of your relatives or friends are murdered in mysterious circumstances, you will know their murderers.\n#flavor To start, the student of time magic learns to look backward in time. Although considered a rudimentary use of Chronos, the cantrip's utility makes even novices sought after in freeholds and motleys. A sidhe investigating the disappearance of her vassal looks through the past of where she was last seen. Suspicious of his lover, a troll peers into her day and sees a rendezvous with her paramour.#!"
 NOBLE_ARTS_EFFECT_AND_CAUSE_PERK_EFFECT: "As a [passive_cantrip|E] of $fae_fae_realm$, at start of combat as [commander|E] give all enemy [knights|E] [GetModifier('cantrip_effect_and_cause_modifier').GetNameWithTooltip] for duration of combat.\n#flavor The first cantrip dealing with time distortion, Effect and Cause scatters the normal progression of time for the target of the cantrip. The sound of shattering glass might precede the tumbler falling to the ground, or a body would hit the floor prior to the gunshot ringing out.#!"
 NOBLE_ARTS_SET_IN_STONE_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, make target [artifact|E] unbreakable while giving [GetModifier('cantrip_set_in_stone_modifier').GetNameWithTooltip].\nYour Pets can no longer die from old age.\n#flavor Minor manipulations to the flow of time precede the Kithain learning to dam the river and temporarily stop time itself. Casting Set in Stone on a target prevents the normal effects of aging and exposure to the outside world, but does not prevent the target from normal interactions or intentional destruction. Time no longer has the same effect for the target, preventing growth, aging, deterioration, and sometimes progress. Weather patterns could remain constant for weeks, while food would stay ripe and edible indefinitely. The cantrip does not prevent intentional harm or damage, meaning the Kithain's car may never need maintenance, but would still sustain damage in a crash.#!"
 NOBLE_ARTS_DEJA_VU_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, give target [GetModifier('cantrip_deja_vu_modifier').GetNameWithTooltip].\n#flavor Beyond the manipulation of temporal perception, past halting the flow of time around the target, the changeling next learns to relive a recent moment and re-experience the present armed with future knowledge. As time moves forward, the branching possibilities make any long-term application of the cantrip useless, but for up to a few minutes, the adept of Chronos becomes a time traveler. With such undeniable power, the changeling also accepts the risk of becoming overwhelmed with possible futures. Repeated use of Déjà Vu during the same scene becomes increasingly more difficult as the threads of fate become tangled.#!"
 NOBLE_ARTS_TIME_DILATATION_PERK_EFFECT: "As a [cantrip|E] with $pod_hard_bunk$, make target older by #bold 25#! years.\nAs a [passive_cantrip|E] of $fae_fae_realm$, at start of combat as [commander|E] give all enemy [knights|E] [GetModifier('cantrip_time_dilatation_modifier').GetNameWithTooltip] for duration of combat.\n#flavor The source of the Rip Van Winkle legends, dilating time pushes the target forward through time and sends her out of sync with the rest of the world. The target will age and suffer the normal effects of time passing, but the world around her barely changes.#!"

 noble_arts_burning_chew_perk_name: "Burning Chew"
 noble_arts_confounding_coils_perk_name: "Confounding Coils"
 noble_arts_dragonscales_perk_name: "Dragonscales"
 noble_arts_holy_strike_perk_name: "Holy-Strike"
 noble_arts_tripping_the_ire_perk_name: "Tripping the Ire"

 NOBLE_ARTS_BURNING_CHEW_PERK_EFFECT: "$unlock_forging_node$ Add [GetModifier('artifact_prowess_2_modifier').GetNameWithTooltip].\nAs a [cantrip|E] with $pod_standard_bunk$, give target [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip].\nAs a [passive_cantrip|E] of $fae_fae_realm$, at start of combat as [commander|E] give all ally [knights|E] [GetModifier('cantrip_burning_chew_knight_modifier').GetNameWithTooltip] for duration of combat.\n#flavor This cantrip infuses its target with the burning might of legend, granting them tremendous strength and destructive power. To those with Changeling eyes, the subject seems faintly limned in a golden aura, which rises and flickers like flames.#!"
 NOBLE_ARTS_CONFOUNDING_COILS_PERK_EFFECT: "$unlock_forging_node$ Add [GetModifier('artifact_soak_2_modifier').GetNameWithTooltip].\nAs a [cantrip|E] with $pod_standard_bunk$, give target [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip].\nAs a [passive_cantrip|E] of $fae_fae_realm$, at start of combat as [commander|E] give all ally [knights|E] [GetModifier('cantrip_confounding_coils_knight_modifier').GetNameWithTooltip] for duration of combat.\n#flavor A sidhe dances across the battlefield, felling her foes while remaining untouched even by the blood she lets. The subject of this cantrip is granted the grace of a coiling serpent. Her motions become sinuous, almost hypnotic, and she may easily avoid harm. Even an inanimate object blessed by this cantrip seems to subtly writhe and shift, throwing off attempts to strike it#!"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT: "Improve [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)] [crafting_node|E], by instead adding [GetModifier('artifact_soak_4_modifier').GetNameWithTooltip],\nImprove [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)] [cantrip|E] by giving [GetModifier('cantrip_dragonscales_prowess_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip].\nImprove [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)] [passive_cantrip|E] by giving [GetModifier('cantrip_dragonscales_prowess_knight_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_burning_chew_knight_modifier').GetNameWithTooltip].\nImprove [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)] [passive_cantrip|E] by giving [GetModifier('cantrip_dragonscales_soak_knight_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_confounding_coils_knight_modifier').GetNameWithTooltip].\n#flavor The changeling infuses her subject with the mystical toughness of dragon hide. To those capable of seeing past the Mists, the subject seems to shimmer with a heat haze, and its skin or surface gleams in direct light#!"
 NOBLE_ARTS_HOLY_STRIKE_PERK_EFFECT: "As a [cantrip|E] with $pod_hard_bunk$, deal [GetPlayer.MakeScope.ScriptValue('noble_arts_holy_strike_interaction_damage')] $pod_aggravated_damage_with_box$ to target.\nAs a [passive_cantrip|E] of $fae_fae_realm$, deal [GetPlayer.MakeScope.ScriptValue('noble_arts_holy_strike_perk_damage')] $pod_superficial_damage_with_box$ to all enemy knights.\n#flavor Named after the legendary warrior's plant, this is a cantrip of pure destruction which suits its outward manifestation to the nature of the changeling who wields it. It always takes the form of a blast of eldritch power, but this could be anything from a cold wave of withering darkness, to an emerald flash that cracks a target to pieces, to a roaring wave of dragon-flame#!"
 NOBLE_ARTS_TRIPPING_THE_IRE_PERK_EFFECT: "Improve [GetPerk('noble_arts_dragonscales_perk').GetName(GetPlayer)] [cantrip|E] by giving [GetModifier('cantrip_tripping_the_ire_prowess_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_dragonscales_prowess_modifier').GetNameWithTooltip].\nImprove [GetPerk('noble_arts_dragonscales_perk').GetName(GetPlayer)] [passive_cantrip|E] by giving [GetModifier('cantrip_tripping_the_ire_prowess_knight_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_dragonscales_prowess_knight_modifier').GetNameWithTooltip].\n#flavor The changeling calls down the martial wisdom of countless warriors of Arcadian legend to dwell within his subject, enabling a terrifying battle dance against which no enemy can hope to prevail.#!"

 noble_arts_between_the_lines_perk_name: "Between the Lines"
 noble_arts_nicknames_perk_name: "Nicknames"
 noble_arts_saining_perk_name: "Saining"
 noble_arts_runic_imprint_perk_name: "Runic Imprint"
 noble_arts_reweaving_perk_name: "Reweaving"

 NOBLE_ARTS_BETWEEN_THE_LINES_PERK_EFFECT: "#flavor Discernment is the first lesson of Naming magics. Until the changeling can understand the real message in anything said or written, she cannot understand the intimate knowledge hidden within True Names. Deceptively powerful, Between the Lines empowers the Kithain to understand any language or learn the intended meaning behind anything she can see or hear.#!"
 NOBLE_ARTS_NICKNAMES_PERK_EFFECT: "As a [cantrip|E] with $pod_easy_bunk$, make target lose 500 [prestige|E] and get 25 [stress|E].\n#flavor Before a changeling develops the talent and discernment needed for uncovering True Names, she learns to apply a more cursory label to something or someone. The effect fades over time, but the target's identity warps and bends to the nickname provided by the changeling. While the cantrip stays in place, everyone around the focus of the cantrip sees them through the lens of the Nickname.#!"
 NOBLE_ARTS_SAINING_PERK_EFFECT: "Can use the 'Learn True Name' [journey|E].\nCan learn True Names of [traits|E].\n#flavor The ability to discern True Names is the heart of Naming magic. Once the changeling can label the inherent nature of the subject, she gains profound insight into who or what they are, as well as power to wield any magic against them with little resistance. The power the Naming mystic gains over someone may first seem beneficial, but loyalties shift, friends become enemies, and nothing remains secret forever.#!"
 NOBLE_ARTS_RUNIC_IMPRINT_PERK_EFFECT: "$unlock_forging_node$ Add a 2 [modifiers|E] based on the [artifact|E]'s type.\nAs a [cantrip|E] with $pod_standard_bunk$, give one of 3 [modifiers|E] to target#weak ([GetModifier('cantrip_runic_imprint_survival_modifier').GetNameWithTooltip], [GetModifier('cantrip_runic_imprint_scholar_modifier').GetNameWithTooltip] or [GetModifier('cantrip_runic_imprint_ruler_modifier').GetNameWithTooltip])#!.\n#flavor Having learned to see the true nature of anything around her, the changeling now becomes versed in the ancient language of runes and how to apply them to strengthen her allies or weaken her foes. The Runic Imprint cantrip always involves writing or physical movement to form the rune on or near the target. Afterward, the changeling can mold the basic attributes of the cantrip's focus as she sees fit.#!"
 NOBLE_ARTS_REWEAVING_PERK_EFFECT: "As a [cantrip|E] with $pod_hard_bunk$, freely change personality, health, stress and physical [traits|E] of target you know True Name of.\n#flavor After learning the True Name of the subject, a master of Naming can rewrite that name, fundamentally changing the target. Seelie could become Unseelie, Legacies could be changed, etc. Even places can be changed and their purpose or structure redefined.#!"