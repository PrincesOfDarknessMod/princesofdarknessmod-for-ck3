 NOBLE_ARTS_MANNIKIN_INABILITY: "@warning_icon!#X [GetTrait('mannikin').GetName(GetPlayer)] are unable to learn Arts beyond level 3!#!"

 noble_arts_backwards_glance_perk_name: "Backwards Glance"
 noble_arts_effect_and_cause_perk_name: "Effect and Cause"
 noble_arts_set_in_stone_perk_name: "Set in Stone"
 noble_arts_deja_vu_perk_name: "Deja-Vu"
 noble_arts_time_dilation_perk_name: "Time Dilation"

 NOBLE_ARTS_BACKWARDS_GLANCE_PERK_EFFECT: "If any of your relatives or friends are murdered in mysterious circumstances, you will know their murderers.\n#flavor To start, the student of time magic learns to look backward in time. Although considered a rudimentary use of Chronos, the cantrip's utility makes even novices sought after in freeholds and motleys. A sidhe investigating the disappearance of her vassal looks through the past of where she was last seen. Suspicious of his lover, a troll peers into her day and sees a rendezvous with her paramour.#!"
 NOBLE_ARTS_EFFECT_AND_CAUSE_PERK_EFFECT: "$passive_cantrip_fae$ Give [GetModifier('cantrip_effect_and_cause_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_chronos_effect_and_cause')].\n#flavor The first cantrip dealing with time distortion, Effect and Cause scatters the normal progression of time for the target of the cantrip. The sound of shattering glass might precede the tumbler falling to the ground, or a wound would appear before the sword landed.#!"
 NOBLE_ARTS_SET_IN_STONE_PERK_EFFECT: "$cantrip_standard_bunk$ Make an [artifact|E] unbreakable and add [GetModifier('cantrip_set_in_stone_modifier').GetNameWithTooltip].\nYour Pets can no longer die from old age.\n#flavor Minor manipulations to the flow of time precede the Kithain learning to dam the river and temporarily stop time itself. Casting Set in Stone on a target prevents the normal effects of aging and exposure to the outside world, but does not prevent the target from normal interactions or intentional destruction. Time no longer has the same effect for the target, preventing growth, aging, deterioration, and sometimes progress. Weather patterns could remain constant for weeks, while food would stay ripe and edible indefinitely. The cantrip does not prevent intentional harm or damage, meaning the Kithain's sword may never need maintenance, but would still sustain damage when hammered down.#!"
 NOBLE_ARTS_DEJA_VU_PERK_EFFECT: "$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_deja_vu_modifier').GetNameWithTooltip].\n#flavor Beyond the manipulation of temporal perception, past halting the flow of time around the target, the Fae next learns to relive a recent moment and re-experience the present armed with future knowledge. As time moves forward, the branching possibilities make any long-term application of the cantrip useless, but for up to a few minutes, the adept of Chronos becomes a time traveler. With such undeniable power, the Fae also accepts the risk of becoming overwhelmed with possible futures. Repeated use of Déjà Vu during the same scene becomes increasingly more difficult as the threads of fate become tangled.#!"
 NOBLE_ARTS_TIME_DILATION_PERK_EFFECT: "$cantrip_hard_bunk$ Age the target by #V 25#! years.\n$passive_cantrip_fae$ Give [GetModifier('cantrip_time_dilation_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_chronos_time_dilation')].\n#flavor The source of the Rip Van Winkle legends, dilating time pushes the target forward through time and sends her out of sync with the rest of the world. The target will age and suffer the normal effects of time passing, but the world around her barely changes.#!"

 noble_arts_burning_chew_perk_name: "Burning Chew"
 noble_arts_confounding_coils_perk_name: "Confounding Coils"
 noble_arts_dragonscales_perk_name: "Dragonscales"
 noble_arts_holy_strike_perk_name: "Holly-Strike"
 noble_arts_tripping_the_ire_perk_name: "Tripping the Ire"

 NOBLE_ARTS_BURNING_CHEW_PERK_EFFECT: "$unlock_forging_node$ Add [GetModifier('artifact_prowess_2_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Give [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to yourself during [single_combat_duel_plural|E].\n$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor This cantrip infuses its target with the burning might of legend, granting them tremendous strength and destructive power. To those with Fae eyes, the subject seems faintly limned in a golden aura, which rises and flickers like flames.#!"
 NOBLE_ARTS_CONFOUNDING_COILS_PERK_EFFECT: "$unlock_forging_node$ Add [GetModifier('artifact_soak_2_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Give [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to yourself during [single_combat_duel_plural|E].\n$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor A sidhe dances across the battlefield, felling her foes while remaining untouched even by the blood she lets. The subject of this cantrip is granted the grace of a coiling serpent. Her motions become sinuous, almost hypnotic, and she may easily avoid harm. Even an inanimate object blessed by this cantrip seems to subtly writhe and shift, throwing off attempts to strike it.#!"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT: "This replaces both [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)] and [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)]'s [cantrip|E]"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT2: "This replaces both [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)] and [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)]'s [passive_cantrip|E]"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT: "$cantrip_standard_bunk$ #underline;TOOLTIP:NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT @warning_icon!#! Give the target [GetModifier('cantrip_dragonscales_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ #underline;TOOLTIP:NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT2 @warning_icon!#! Give [GetModifier('cantrip_dragonscales_modifier').GetNameWithTooltip] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to yourself during [single_combat_duel_plural|E].\n$countermeasures_unlocks_t3_supernatural_high_alert$\n[PODUnlocksCombatMove('POD_combat_move_fae_dragons_ire_dragonscales')].\n#flavor The Fae infuses her subject with the mystical toughness of dragon hide. To those capable of seeing past the Mists, the subject seems to shimmer with a heat haze, and its skin or surface gleams in direct light.#!"
 NOBLE_ARTS_HOLY_STRIKE_PERK_EFFECT: "$cantrip_hard_bunk$ Deal [EmptyScope.ScriptValue('noble_arts_holy_strike_interaction_damage')] [POD_aggravated_damage_with_box|E] to the target.\n$passive_cantrip_fae$ Deal [EmptyScope.ScriptValue('noble_arts_holy_strike_perk_damage')] [POD_superficial_damage_with_box|E] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_dragons_ire_holy_strike')].\n#flavor Named after the legendary warrior's plant, this is a cantrip of pure destruction which suits its outward manifestation to the nature of the Fae who wields it. It always takes the form of a blast of eldritch power, but this could be anything from a cold wave of withering darkness, to an emerald flash that cracks a target to pieces, to a roaring wave of dragon-flame.#!"
 NOBLE_ARTS_TRIPPING_THE_IRE_PERK_EFFECT: "$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_tripping_the_ire_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Give [GetModifier('cantrip_tripping_the_ire_modifier').GetNameWithTooltip] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to yourself during [single_combat_duel_plural|E].\n$countermeasures_unlocks_t4_supernatural_high_alert$\n#flavor The Fae calls down the martial wisdom of countless warriors of Arcadian legend to dwell within his subject, enabling a terrifying battle dance against which no enemy can hope to prevail.#!"

 noble_arts_between_the_lines_perk_name: "Between the Lines"
 noble_arts_nicknames_perk_name: "Nicknames"
 noble_arts_saining_perk_name: "Saining"
 noble_arts_runic_imprint_perk_name: "Runic Imprint"
 noble_arts_reweaving_perk_name: "Reweaving"

 NOBLE_ARTS_BETWEEN_THE_LINES_PERK_EFFECT: "#flavor Discernment is the first lesson of Naming magics. Until the Fae can understand the real message in anything said or written, she cannot understand the intimate knowledge hidden within True Names. Deceptively powerful, Between the Lines empowers the Kithain to understand any language or learn the intended meaning behind anything she can see or hear.#!"
 NOBLE_ARTS_NICKNAMES_PERK_EFFECT: "$cantrip_easy_bunk$ Make target lose 500 [prestige|E] and get 25 [stress|E].\n#flavor Before a Fae develops the talent and discernment needed for uncovering True Names, she learns to apply a more cursory label to something or someone. The effect fades over time, but the target's identity warps and bends to the nickname provided by the Fae. While the cantrip stays in place, everyone around the focus of the cantrip sees them through the lens of the Nickname.#!"
 NOBLE_ARTS_SAINING_PERK_EFFECT: "Can use the 'Learn True Name' [journey|E].\nCan learn [Glossary('True Names','podgloss.truename')] of [traits|E].\n#flavor The ability to discern True Names is the heart of Naming magic. Once the Fae can label the inherent nature of the subject, she gains profound insight into who or what they are, as well as power to wield any magic against them with little resistance. The power the Naming mystic gains over someone may first seem beneficial, but loyalties shift, friends become enemies, and nothing remains secret forever.#!"
 NOBLE_ARTS_RUNIC_IMPRINT_PERK_EFFECT: "$unlock_forging_node$ Add 2 [modifiers|E] based on the [artifact|E]'s type.\n$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_runic_imprint_survival_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_runic_imprint_scholar_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_runic_imprint_ruler_modifier').GetNameWithTooltip]).\n[PODUnlocksCombatMove('POD_combat_move_fae_naming_runic_imprint')].\n#flavor Having learned to see the true nature of anything around her, the Fae now becomes versed in the ancient language of runes and how to apply them to strengthen her allies or weaken her foes. The Runic Imprint cantrip always involves writing or physical movement to form the rune on or near the target. Afterward, the Fae can mold the basic attributes of the cantrip's focus as she sees fit.#!"
 NOBLE_ARTS_REWEAVING_PERK_EFFECT: "$cantrip_hard_bunk$ Freely change the personality, health, stress and physical [traits|E] of a target you know the [Glossary('True Name','podgloss.truename')] of.\n#flavor After learning the True Name of the subject, a master of Naming can rewrite that name, fundamentally changing the target. Seelie could become Unseelie, Legacies could be changed, etc. Even places can be changed and their purpose or structure redefined.#!"

 noble_arts_protocol_perk_name: "Protocol"
 noble_arts_grandeur_perk_name: "Grandeur"
 noble_arts_guest_list_perk_name: "Guest List"
 noble_arts_dictum_perk_name: "Dictum"
 noble_arts_geas_perk_name: "Geas"

 NOBLE_ARTS_PROTOCOL_PERK_EFFECT: "$cantrip_standard_bunk$ Gain a [weak_hook|E] on the target.\n#flavor Kithain rules for courtly dealings are often arcane and sometimes inscrutable. The first cantrip taught to Kithain learning Sovereign applies that etiquette to nearly any situation. Anyone under the effects of Protocol becomes bound by the rules of Kithain decorum and suffers the consequences of violating those rules, even unintentionally.#!"
 NOBLE_ARTS_GRANDEUR_PERK_EFFECT: "$passive_cantrip_fae$ Increase [peace|E] acceptance #P +10#!.\n$passive_cantrip_fae$ Increase acceptance for [court|E] invitations by #P +20#!.\n[PODUnlocksCombatMove('POD_combat_move_fae_sovereign_grandeur')].\n#flavor With a simple cantrip, the Fae embodies the Grandeur inherent in all children of Arcadia, making those around her clamor for attention and avoid conflict. Everyone under the influence of the cantrip looks upon the Fae as a leader, savior, or royalty. She may not actually possess the poise and grace attributed to the kings and queens of old, but Grandeur provides a handy substitute for the real thing.#!"
 noble_arts_grandeur_perk_modifier: "You have [GetPerk('noble_arts_grandeur_perk').GetName(GetPlayer)]: $VALUE|0P=$"
 NOBLE_ARTS_GUEST_LIST_PERK_EFFECT: "#flavor Use of this cantrip prevents anyone or anything from entering, using, or interacting with the target of the cantrip without the caster's permission. The Fae may institute a password consisting of a phrase or action which adds the subject to the “list” and permits him access to the focus of the cantrip.#!"
 NOBLE_ARTS_DICTUM_PERK_EFFECT: "Improves the [GetPerk('noble_arts_protocol_perk').GetName(GetPlayer)] [cantrip|E] by giving a [perpetual_hook|E] instead of a [weak_hook|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_sovereign_dictum')].\n#flavor Title and status are often enough to compel those around a Fae to do her bidding. When the trappings of nobility are not enough, Dictum provides an unmistakable reminder of who is in charge. The Fae casts the cantrip and then issues a simple command to the target, with which they must comply. A target of Dictum may be able to resist the order, but most do not have the will and become at least a temporary servant to the Fae.#!"
 NOBLE_ARTS_GEAS_PERK_EFFECT: "Improves the [GetPerk('noble_arts_dictum_perk').GetName(GetPlayer)] [cantrip|E] by giving a [strong_hook|E] instead of a [perpetual_hook|E].\n#flavor Tales of quests bestowed to heroes and villains banished in exile populate folklore, and the former denizens of the Dreaming make those stories reality with a mastery of Sovereign. A Geas molds Glamour into a directive, similar to an oath or contract but without the reciprocity normally required. The Fae yokes the target to a directive or ban along with an accompanying curse should she fail to fulfil the edict.#!"

 noble_arts_done_deal_perk_name: "Done Deal"
 noble_arts_liars_bell_perk_name: "Liar's Bell"
 noble_arts_castigate_perk_name: "Castigate"
 noble_arts_casual_contract_perk_name: "Casual Contract"
 noble_arts_sanctified_words_perk_name: "Sanctified Words"

 NOBLE_ARTS_DONE_DEAL_PERK_EFFECT: "$cantrip_standard_bunk$ Give the target a [strong_hook|E] on you to force them to do a specific task (declare war, give gold, start murder scheme or summon to court). The target must have at least #V 50#! opinion of you.\n#flavor This powerful cantrip allows the Fae to enter into binding oaths with others, or to sanctify oaths she formally witnesses. Those who break agreements and contracts sealed with Glamour are punished by the very forces of the Dreaming itself.#!"
 NOBLE_ARTS_LIARS_BELL_PERK_EFFECT: "$passive_cantrip_actor$ [characters|E] you have a [hook|E] on cannot join [schemes|E] nor [factions|E] against you.\n$passive_cantrip_actor$ Your [councillors|E] cannot join [schemes|E] nor [factions|E] against you.\n#flavor As the Fae's mastery over Contracts grows, she becomes highly attuned to breaches in the binding Glamour she laid down. She becomes instantly aware whenever someone has broken a contract she sanctified — she doesn't necessarily know where or why, but she does know who and when. Moreover, it becomes easy for her to use the Arts of Glamour to seek the oathbreaker.#!"
 faction_noble_arts_liars_bell_perk_hook_modifier: "It is not possible to start or join a [faction|E] against someone with [GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)] who also has a [hook|E] on you"
 faction_noble_arts_liars_bell_perk_councillor_modifier: "It is not possible to start or join a [faction|E] against someone with [GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)] if you're also on their [council|E]"
 noble_arts_liars_bell_perk_hook_modifier: "The target has [GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)] and a [hook|E] on me: $VALUE|0N=$"
 noble_arts_liars_bell_perk_councillor_modifier: "The target has [GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)] and I'm their [councillor|E]: $VALUE|0N=$"
 NOBLE_ARTS_CASTIGATE_PERK_EFFECT: "Improves the [GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)] [cantrip|E] by giving the target a [weak_hook|E] on you instead of a [strong_hook|E].\n#flavor The Fae not only knows when someone has broken an oath she sanctified, she may reach out to inflict her own punishment upon the oathbreaker, in addition to the normal penalties of violating a Contract.#!"
 NOBLE_ARTS_CASUAL_CONTRACT_PERK_EFFECT: "Improves the [GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)] [cantrip|E] by also allowing usage of it against any target in the same location.\n#flavor This fearful enchantment grants the Fae power over even the most casual of agreements, allowing her to sanctify careless commitments (“sure, I'll be there”), idle boasts (“if that redcap sets foot in this bar, I'll whip him and his whole motley all at once”), and even sarcastic rejoinders (“oh, of course I'll support Duke Dray, loving nobles so much as I do”).#!"
 NOBLE_ARTS_SANCTIFIED_WORDS_PERK_EFFECT: "$passive_cantrip_actor$ Give [GetModifier('cantrip_sanctified_words_modifier').GetNameWithTooltip] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to yourself during [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_contract_sanctified_words')].\n#flavor This awesome cantrip allows the Fae to weave additional Glamour into a contract, granting potent blessings to those bound by it. The power of Sanctified Words can only be used to assist in carrying out the contract, but some oaths can be very broad indeed (“I swear to protect the Duke with my life”).#!"

 noble_arts_creeping_shadows_perk_name: "Creeping Shadows"
 noble_arts_autumn_eyes_perk_name: "Autumn Eyes"
 noble_arts_the_poisoned_apple_perk_name: "The Poisoned Apple"
 noble_arts_the_withering_perk_name: "The Withering"
 noble_arts_shivers_perk_name: "Shivers"

 NOBLE_ARTS_CREEPING_SHADOWS_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$.\n#flavor The Fae commands nearby shadows to bend to her whim. A satyr summons the shadow of a reluctant partner to dance with her. A sluagh curdles the nighttime shadows of a bully's bedroom into a theater of menace. This Art may be used subtly, twisting or slightly manipulating shadows to grant a sinister aspect to the scene, or it may be used to commandeer shadows to become great leering things, utterly disconnected from the actions of those that cast them, or even to swallow the Fae (or another) up and hide the subject from sight.#!"
 NOBLE_ARTS_AUTUMN_EYES_PERK_EFFECT: "$cantrip_standard_bunk$ Discover a random [scheme|E] against the target character.\n#flavor Infusing the Glamour of Autumn into her eyes, the Fae attunes her senses to decay and doom. She can see the illness and infirmity in those around her, recognize the weaknesses and stress points of objects, or even recognize those marked by some great or impending doom.#!"
 NOBLE_ARTS_THE_POISONED_APPLE_PERK_EFFECT: "$cantrip_standard_bunk$ Give the target a random disease [trait|E].\n$cantrip_standard_bunk$ Reduce an artifact's [durability|E] by #V 20#!.\n$passive_cantrip_fae$ Give [GetModifier('cantrip_the_poisoned_apple_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_autumn_poisoned_apple')].\n#flavor This terrible cantrip has given generations of mortals ample reason to fear both the gifts and wrath of the fair folk. Condensing her ire into a deadly infusion of Glamour directed at something within arm's reach, the Fae poisons her subject.#!"
 NOBLE_ARTS_THE_WITHERING_PERK_EFFECT: "Improves the [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] [character|E] [cantrip|E] by also giving [GetModifier('cantrip_the_withering_modifier').GetNameWithTooltip].\nImproves the [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] [artifact|E] [cantrip|E] by reducing [durability|E] by #V 40#! instead.\nImprove [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] [passive_cantrip|E] by giving [GetModifier('cantrip_the_withering_knight_modifier').GetNameWithTooltip] instead.\n[PODUnlocksCombatMove('POD_combat_move_fae_autumn_withering')].\n#flavor With a vicious gesture, the Fae steals away a target's vitality, leaving only the seeming of age and decay.#!"
 NOBLE_ARTS_SHIVERS_PERK_EFFECT: "$cantrip_standard_bunk$ Give the target #V 100#! [stress|E] (50 if [GetTrait('brave').GetName(GetPlayer)] and 150 if [GetTrait('craven').GetName(GetPlayer)]).\n$cantrip_standard_bunk$ Give an artifact a [modifier|E] reducing a chosen [skill|E] by 1. Each [skill|E] [modifier|E] can only be applied once per artifact.\n#flavor The Fae draws out her own dreams of death and darkness, and bequeaths them to a target. The person or thing so cursed becomes a beacon for ghosts, and suffers the attentions of the restless dead for a time thereafter.#!"

 noble_arts_awaken_perk_name: "Awaken"
 noble_arts_verdant_reclamation_perk_name: "Verdant Reclamation"
 noble_arts_well_of_life_perk_name: "Well of Life"
 noble_arts_faerie_ring_perk_name: "Faerie Ring"
 noble_arts_renewal_perk_name: "Renewal"

 NOBLE_ARTS_AWAKEN_PERK_EFFECT: "$cantrip_standard_bunk$ Give all [counties|E] in the target's [title|E] [GetModifier('cantrip_awaken_title_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_awaken_modifier').GetNameWithTooltip].\n#flavor New life, a sprouting seed — at the heart of Spring is the promise of beginnings and awakening from dormancy or slumber. The Fae begins her journey into the Art of Spring by learning to call an end to hibernation and encourage growth. The Fae plants a seed of Glamour and then watches as it takes root and rouses the focus of the cantrip.#!"
 NOBLE_ARTS_VERDANT_RECLAMATION_PERK_EFFECT: "Improves the [GetPerk('noble_arts_awaken_perk').GetName(GetPlayer)] [title|E] [cantrip|E] by giving [GetModifier('cantrip_verdant_reclamation_title_modifier').GetNameWithTooltip] instead.\nImproves the [GetPerk('noble_arts_awaken_perk').GetName(GetPlayer)] [character|E] [cantrip|E] by giving [GetModifier('cantrip_verdant_reclamation_modifier').GetNameWithTooltip] instead.\n#flavor All things from the earth, and to the earth all things shall return. Given enough time, nature reclaims everything, and with a little Glamour, the Fae casting a Verdant Reclamation cantrip can speed up the process. Useful as a display of power and to cause distraction, the plants and foliage that cover the target continue to grow and overwhelm for the entire scene.#!"
 NOBLE_ARTS_WELL_OF_LIFE_PERK_EFFECT: "$passive_cantrip_actor$ Heal [EmptyScope.ScriptValue('POD_base_heal_value')] [POD_superficial_damage_with_box|E] of allied [knights|E] when acting as a [commander|E] during the [combat_phase|E], or yourself during [single_combat_duel_plural|E].\n$cantrip_standard_bunk$ Heal [EmptyScope.ScriptValue('POD_spring_interaction_superficial_heal_value')] [POD_superficial_damage_with_box|E] of the target.\n[PODUnlocksCombatMove('POD_combat_move_fae_spring_well_of_life')].\n#flavor Legends of the water of life, a mystic well or elixir that heals wounds or grants eternal life, appear in most cultures throughout the ages. This Spring cantrip does not reverse aging or grant immortality, but does infuse the target with Glamour that heals anyone nearby or in contact with the cantrip. The clurichaun watching two friends duel stands between them and heals both of their injuries. Despairing for the lives lost on both sides, a troll knight makes the rain restore life to the wounded on the battlefield. Hoping to provide comfort to a weary doctor, a pooka makes him a vessel for healing as he starts his rounds. After being ambushed, a redcap offers the flesh and blood of their bested enemy to heal his motley.#!"
 NOBLE_ARTS_FAERIE_RING_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_spring_faerie_ring')].\n#flavor Human legends tell of circles of mushrooms, wildflowers, or stones known as faerie rings — dangerous places for mortals because the fae who live and dance in the rings can kidnap or curse any interlopers. The folklore holds a seed of truth. The Faerie Ring is a Spring cantrip that allows a Fae to create a circle that offers protection and concealment from any outsiders, with serious consequences for anyone who intrudes.#!"
 NOBLE_ARTS_RENEWAL_PERK_EFFECT: "$cantrip_hard_bunk$ Resurrect a $POD_splat_wraith$ as a $POD_splat_mortal$.\n$cantrip_hard_bunk$ Give all [counties|E] in the target's [title|E] [GetModifier('cantrip_renewal_modifier').GetNameWithTooltip].\n$cantrip_hard_bunk$ Fully restore an [artifact|E]'s [durability|E].\n#flavor Every year, Spring performs the ultimate miracle by thawing soil and resurrecting life in a landscape made temporarily barren by the winter. Masters of Spring magic tap into the cycle of death and rebirth to temporarily grant life to anything inert or dead. The circle closes soon after however, as Glamour only sustains the resurrection for a few precious moments.#!"

 noble_arts_flicker_files_perk_name: "Flicker-Flies"
 noble_arts_enkindle_perk_name: "Enkindle"
 noble_arts_aphrodisia_perk_name: "Aphrodisia"
 noble_arts_vestas_blessing_perk_name: "Vesta's Blessing"
 noble_arts_the_beltane_blade_perk_name: "The Beltane Blade"

 NOBLE_ARTS_FLICKER_FILES_PERK_EFFECT: "$cantrip_standard_bunk$ Summon the target to your [court|E].\n#flavor This cantrip summons bright, dancing motes of colored light from the substance of the Dreaming. Flicker-flies not only illuminate the area around them, but their softly pulsing colors evoke a subtle resonance of an emotion of the Fae's choice in those who view them. Both the flicker-flies and the light they cast are invisible to mundane beings, yet mortals touched by their light still react to their emotional resonance.#!"
 NOBLE_ARTS_ENKINDLE_PERK_EFFECT: "$passive_cantrip_fae$ Give [GetModifier('cantrip_enkindle_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_summer_enkindle')].\n#flavor A bully trembles in the dark, and a sluagh winds that tension into screaming terror. A pooka's joke elicits little more than chuckles—until she forces a bit of magic into her audience's response, filling the room with helpless laughter. Expelling a breath of Glamour, the Fae fans the flames of passion to a roaring and manic height. Any emotion an individual is feeling when enchanted with Enkindle intensifies dramatically — irritation becomes seething resentment, anger becomes full-blown rage, sadness deepens into crippling sorrow, happiness unfolds into leaping joy, and love becomes an all-consuming passion. If directed at an object, then any emotions that object inspires in those who interact with it become similarly inflamed.#!"
 NOBLE_ARTS_APHRODISIA_PERK_EFFECT: "$cantrip_standard_bunk$ Give the target [GetModifier('cantrip_aphrodisia_modifier').GetNameWithTooltip].\nImproves the [GetPerk('noble_arts_flicker_files_perk').GetName(GetPlayer)] [cantrip|E] by decreasing the Glamour cost by 1.\n#flavor Much-favored by the merfolk, satyrs, clurichaun, and certain other fae, this cantrip is the Art of creating all-encompassing awe, fascination, and even desire. The subject of this Charm gains a magnetic attraction. If a person is enchanted, their every word and action becomes entrancing and captivating. If Aphrodisia is cast upon an object, everyone who beholds that object immediately covets it.#!"
 NOBLE_ARTS_VESTAS_BLESSING_PERK_EFFECT: "$passive_cantrip_actor$ Give [GetModifier('cantrip_vestas_blessing_modifier').GetNameWithTooltip] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to yourself during [single_combat_duel_plural|E].\n#flavor The hearth in a home represents safety and hospitality. By employing Vesta's Blessing, a Fae creates the comfort of home anywhere she can create shelter or fire. Useful for travelers and anyone being hunted, the Fae's Glamour acts as a sentry and provides an instinctual warning for any intrusion. Additionally, anyone invited into the sanctified space feels restored and rejuvenated.#!"
 NOBLE_ARTS_THE_BELTANE_BLADE_PERK_EFFECT: "#V $glamour_quests_name$#! [journey|E] Speed: #P +100%#!\n[PODUnlocksCombatMove('POD_combat_move_fae_summer_beltane_blade')].\n#flavor The Fae gestures, and the taint of Banality within her target erupts into brilliantly destructive red-gold flames. Once upon a time, this cantrip was the great and shining sword of Summer, used to drive mortals and the taint of the mundane away from the secret freeholds and hidden countries of the fae. Now that Banality has drowned the Autumn World, this cantrip remains a potent weapon, but one whose fierce heat seems woefully inadequate to keep the coming Winter at bay.#!"

 noble_arts_chill_perk_name: "Chill"
 noble_arts_hardened_heart_perk_name: "Hardened Heart"
 noble_arts_terror_of_the_long_night_perk_name: "Terror of the Long Night"
 noble_arts_sculpt_perk_name: "Sculpt"
 noble_arts_stasis_perk_name: "Stasis"

 NOBLE_ARTS_CHILL_PERK_EFFECT: "$passive_cantrip_fae$ Give [GetModifier('cantrip_chill_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_chill')].\n#flavor The first and most benign application of Winter magics allows the Fae to lower the temperature of the target significantly over a short period of time. Chill does not cause injury or damage when cast on a living creature, but plants and objects may wither or break, respectively. Provided the Kithain can see the focus of the cantrip, she can usher in a deep and unpleasant cold.#!"
 NOBLE_ARTS_HARDENED_HEART_PERK_EFFECT: "Become immune to hostile mental [character_interaction|E].\n$countermeasures_unlocks_t3_mental_fortress$\n#flavor Winter does not grieve for the lost traveler, freezing in the snow. Winter does not protect the prey tracked by wolves or caught in the hunter’s trap. Tapping into the heart of the cold, adepts of Winter mute emotion and insulate the focus of their cantrip from manipulation and influence. The target becomes unable to muster her own passion and will, a significant price for resistance to even the most powerful manipulations.#!"
 NOBLE_ARTS_TERROR_OF_THE_LONG_NIGHT_PERK_EFFECT: "$passive_cantrip_fae$ Force all [GetTrait('craven').GetName(GetNullCharacter)] enemy [knights|E] out of the battle when acting as a [commander|E] during the [combat_phase|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_terror_long_night')].\n#flavor True winter dims light and swallows heat. Alone and cold, even the bravest feel a deep, existential fear when faced with an unending, frigid darkness. The sluagh knight causes his enemy to back down in front of the whole court. A pooka’s cantrip makes her mortal accomplices flee, leaving the fruits of their larceny solely for her. Slinking through backyards to escape a Dauntain, a nocker sends the resident German Shepherds cowering into their doghouses.#!"
 NOBLE_ARTS_SCULPT_PERK_EFFECT: "$passive_cantrip_fae$ Deal [EmptyScope.ScriptValue('noble_arts_sculpt_perk_damage')] [POD_superficial_damage_with_box|E] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_ice_shackles')].\n#flavor Moving past basic invocations of cold, the Fae conjures ice with her Glamour and sculpts it for whatever her purpose. The creation cannot be mistaken for anything other than ice, and feels bitterly cold to anyone else’s touch, but the sculpture does not melt unless exposed to magical heat or flame.#!"
 NOBLE_ARTS_STASIS_PERK_EFFECT: "$passive_cantrip_fae$ Force the two enemy [knights|E] with the highest [prowess|E] out of the battle when acting as a [commander|E] during the [combat_phase|E] (if they're not protected from mental powers).\n$cantrip_exceptional_bunk$ Force the target into [GetTrait('torpor').GetName(GetPlayer)].\n#flavor The final cantrip taught to masters of Winter allows a Fae to trap a target in magical frost for extended periods of time, keeping it exactly as it is but immobile and (if applicable) unconscious. Anything or anyone placed into stasis does not age, decay, break, or change. For the duration of the cantrip the target remains suspended in time. Breaking through the frost requires powerful magic, such as from a master of Pyretics or Spring.#!"