 common_arts_wayfare_focus_desc: "Art of travel, of clever movement, of the fae talent for moving quick dream."
 common_arts_wayfare_focus_effect_desc: "Focusing on Wayfare grants:"

 common_arts_oneiromancy_focus: "Oneiromancy Focus"
 common_arts_oneiromancy_focus_desc: "Art of blurring fantasy and reality, sleeping and waking, Dreaming and the normal world."
 common_arts_oneiromancy_focus_effect_desc: "Focusing on Oneiromancy grants:"

