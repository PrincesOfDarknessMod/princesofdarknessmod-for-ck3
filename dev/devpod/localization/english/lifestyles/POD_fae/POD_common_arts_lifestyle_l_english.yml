 common_arts_omen_perk_name: "Omen"
 common_arts_seers_wisp_perk_name: "Seer's Wisp"
 common_arts_tattletale_perk_name: "Tattletale"
 common_arts_augury_perk_name: "Augury"
 common_arts_face_fate_perk_name: "Face Fate"

 COMMON_ARTS_OMEN_PERK_EFFECT: "As a [cantrip|E] with $pod_easy_bunk$, discover random [secret|E] of target.\n#flavor This rudimentary cantrip provides the briefest of glimpses at the thread of a person, place, or thing's destiny. The Omen revealed is always vague, and rarely concerned with immediate events — at this level, the seer can at best glimpse the broad nature of a thing's destiny.#!"
 COMMON_ARTS_SEERS_WISP_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, discover/summon [artifact|E] with [rarity|E] based on your $fae_prop_realm$ $pod_fae_realm$.\nAs a [cantrip|E] with $pod_easy_bunk$, gain [gold|E] with amount based on your $fae_prop_realm$ $pod_fae_realm$.\n#flavor The seer gains the ability to conjure a bright fragment from the heart of the Dreaming, to lead her where she needs to journey. She may whisper into the Wisp the name or a description of the thing or person or place she seeks, and it will lead her there unerringly along the paths of Dán.#!"
 COMMON_ARTS_TATTLETALE_PERK_EFFECT: "Improve [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] and [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] [cantrip|E] by decreasing their [bunk|E]'s difficulty by 1 [skill|E].\n#flavor This useful cantrip allows the seer to scry distant scenes through an object or individual she has ensorcelled for this purpose. Traditionally, anything in the immediate vicinity of the Tattletale focus is displayed in a nearby reflective surface or surface of the changeling's choosing, though some nocker seers have been known to display the results of Tattletale on old television screens or computer monitors. The changeling can use any perception-based cantrip through the focus once a connection has been established.#!"
 COMMON_ARTS_AUGURY_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, summon to your [court|E] $POD_splat_mortal$ with [skills|E] you choose.\nImprove [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] and [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] [cantrip|E] by decreasing their [bunk|E]'s difficulty by 1 [skill|E].\n#flavor The seer reaches deep into the weave and weft of Dán, coaxing the forces of fate and the Dreaming to reveal a path toward his heart's desire. Augury is a notoriously treacherous and uncertain Art, for the path it reveals is always fragmentary and clouded — but followed diligently, it will lead to the future the changeling seeks. Rather than providing a list of instructions to achieve the goal queried, Augury instead provides tantalizing hints, clues, portents, and interpretive visions. But Augury merely promises a fated road — not a short, easy, or cheap one. The more precious the future sought with this cantrip, the more demanding the road it lays out tends to be.#!"
 COMMON_ARTS_FACE_FATE_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, give target [GetModifier('cantrip_face_fate_positive_modifier').GetNameWithTooltip].\nAs a [cantrip|E] with $pod_standard_bunk$, give target [GetModifier('cantrip_face_fate_negative_modifier').GetNameWithTooltip].\nImprove [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] and [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] [cantrip|E] by decreasing their [bunk|E]'s difficulty by 2 [skill|E].\n#flavor In this, the greatest feat of Soothsay, the seer lays her hands directly upon the threads that make up the great tapestry of Dán and bends them to her will, blessing a subject with good fortune or cursing them with dire portents. The precise expression of this manipulation of destiny is always difficult to predict, but the signs cannot be mistaken.#!"

 common_arts_trick_of_the_light_perk_name: "Trick of The Light"
 common_arts_veiled_eyes_perk_name: "Veiled Eyes"
 common_arts_dream_logic_perk_name: "Dream Logic"
 common_arts_veiled_mind_perk_name: "Veiled Mind"
 common_arts_lost_in_the_mists_perk_name: "Lost in the Mists"

 COMMON_ARTS_TRICK_OF_THE_LIGHT_PERK_EFFECT: "As a [passive_cantrip|E] of $fae_fae_realm$, at start of combat as [commander|E] give all enemy [knights|E] [GetModifier('cantrip_trick_of_the_light_modifier').GetNameWithTooltip] for duration of combat.\n#flavor A subtle manipulation of Glamour to muddle perceptions, Trick of the Light creates misunderstandings and mistakes. A pooka running a kidnapping con sounds just like the mark's mother over the phone. An eshu hounded by a deranged hunter walks into a market and blends into the crowd. Down on her luck, a sidhe passes off a single gold coin as a 100 so she can eat tonight.#!"
 COMMON_ARTS_VEILED_EYES_PERK_EFFECT: "As a [cantrip|E] with $pod_hard_bunk$, destroy [artifact|E] with [rarity|E] limit based on your $fae_prop_realm$ $pod_fae_realm$.\n#flavor Where Trick of the Light makes the viewer mistake one thing for another, Veiled Eyes uses the Mists to make the target of the cantrip instantly forgettable. A Kithain dressed in courtly robes can walk through a crowd of mortals unnoticed, a troll's ornate broadsword hangs freely on her hip but goes ignored as she enters a bank, and the changeling's enemies remain oblivious to the storm clouds rolling across the sky toward their home. The target does not become physically invisible, just not worth noticing. Changelings can create malicious applications of Veiled Eyes, making speeding cars or incoming enemies go unnoticed until it's too late.#!"
 COMMON_ARTS_DREAM_LOGIC_PERK_EFFECT: "As a [cantrip|E] with $pod_easy_bunk$, give target [GetModifier('cantrip_veiled_eyes_modifier').GetNameWithTooltip].\n#flavor Disjointed and illogical connections thrive in the chaos of the Dreaming, and changelings adept in Chicanery capitalize on the weirdness of dream logic to confuse and manipulate. As the target's mind becomes shrouded by Glamour and the ensuing Mists, she becomes disoriented and does not question statements or commands that would normally make little sense to her. Covert eshu pass messages and packages with confused mortal couriers. The troll zookeeper tames new animals that no one else can safely approach#!"
 COMMON_ARTS_VEILED_MIND_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, destroy random [relation|E] of target.\nImprove [GetPerk('common_arts_trick_of_the_light_perk').GetName(GetPlayer)] [passive_cantrip|E], by giving [GetModifier('cantrip_veiled_mind_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_trick_of_the_light_modifier').GetNameWithTooltip].\n#flavor Legends and mythology paint fantastic, and well deserved, scenes of faeries stealing mortals' memories. Moving beyond mere sight or sound, the changeling shrouds the focus of the cantrip with Glamour and the accompanying Mists to temporarily wipe the focus of the cantrip from everyone's mind. The lover who scorned a Kithain may find her family staring at her with blank faces as she comes home for a holiday, or the changeling's opponent forgets to draw her sword during the duel#!"
 COMMON_ARTS_LOST_IN_THE_MISTS_PERK_EFFECT: "As a [cantrip|E] with $pod_hard_bunk$, change personality [traits|E] of target.\n#flavor What is worse than being unable to trust your senses, being invisible, or even being forgotten? Masters of Chicanery employ the ultimate manipulation of the Mists to wrest away their target's identity. The focus of this cantrip not only forgets who he is, but the changeling can employ her knowledge of other Realms to make him believe he is something else entirely. The nocker's rival begins acting like a dog when presenting a new invention. The vampire terrorizing a local motley wakes up with no memory of her undead state and panics when she steps outside and the sunlight burns her skin. A clurichaun makes a mortal believe he is a rain cloud to create instant performance art.#!"

 common_arts_ensnare_perk_name: "Ensnare"
 common_arts_mooch_perk_name: "Mooch"
 common_arts_effigy_perk_name: "Effigy"
 common_arts_gimmix_perk_name: "Gimmix"
 common_arts_smoke_and_mirrors_perk_name: "Smoke and Mirrors"

 COMMON_ARTS_ENSNARE_PERK_EFFECT: "As a [passive_cantrip|E] of $fae_fae_realm$, at start of war give all enemy [knights|E] [GetModifier('cantrip_ensnare_movement_modifier').GetNameWithTooltip].\nAs a [passive_cantrip|E] of $fae_fae_realm$, at start of war give all enemy [knights|E] [GetModifier('cantrip_ensnare_prowess_modifier').GetNameWithTooltip].\n#flavor Useful for running from a mark or catching up to someone who owes the character money, ensnare causes the target to become slowed down or immobile. Furniture seems to jump into the target's way, pot holes flatten tires and crack axles, or the ground raises to divert rushing water. Even with no nearby plausible reason for a hindrance, the tendrils of Glamour created by this cantrip still trip, slow, and weigh down the target#!"
 COMMON_ARTS_MOOCH_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, steal selected [artifact|E].\n#flavor Mooch provides changelings a quick and easy method of paying for a meal, or collecting an impressive set of keys, mobile phones, or any other objects that catch their eye. If successful, Mooch instantly transfers one inanimate object from the possession of the target to the changeling. The item can appear in the character's hand, pocket, or sock — anywhere on her person she desires.#!"
 COMMON_ARTS_EFFIGY_PERK_EFFECT: "Unlock various [POD_construct_maa|E] [men_at_arms|E].\nAs a [cantrip|E] with $pod_standard_bunk$, copy [artifact|E] you possess.\n#flavor Manipulation of Glamour complex enough to copy some- thing takes time and patience to perfect, but once mastered, can create replicas good enough to fool an observer, at least for a while. A pooka thief can make a good facsimile of the painting she agreed to steal and sell, but now wants to keep for her collection. The redcap door-to-door salesman might sculpt a replica of the pug he just ate to keep the family from noticing that their dog is missing until he leaves.#!"
 COMMON_ARTS_GIMMIX_PERK_EFFECT: "Improve [GetPerk('common_arts_mooch_perk').GetName(GetPlayer)] and [GetPerk('common_arts_effigy_perk').GetName(GetPlayer)] [cantrip|E] by decreasing their [bunk|E]'s difficulty by 2 [skill|E].\n#flavor Mortal magicians spend countless hours staging elaborate tricks to convince others they can move and control objects with the power of their mind. By casting Gimmix, a changeling need only expend Glamour to move and manipulate anything she can see with considerable precision and force. A sidhe knight stops an arrow inches from his liege's chest. The sluagh parking attendant sends a car driven by a vampire hurtling off the side of the parking deck. A redcap surgeon keeps his “patient” still long enough to apply the restraints. The nocker picks the lock of his cell door with no tools.#!"
 COMMON_ARTS_SMOKE_AND_MIRRORS_PERK_EFFECT: "Improve [GetPerk('common_arts_mooch_perk').GetName(GetPlayer)] and [GetPerk('common_arts_effigy_perk').GetName(GetPlayer)] [cantrip|E] by decreasing their [bunk|E]'s difficulty by 2 [skill|E].\nImprove [GetPerk('common_arts_mooch_perk').GetName(GetPlayer)] [passive_cantrip|E], by giving [GetModifier('cantrip_smoke_and_mirrors_movement_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_ensnare_movement_modifier').GetNameWithTooltip].\nImprove [GetPerk('common_arts_mooch_perk').GetName(GetPlayer)] [passive_cantrip|E], by giving [GetModifier('cantrip_smoke_and_mirrors_prowess_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_ensnare_prowess_modifier').GetNameWithTooltip].\n#flavor Masters of Legerdemain move beyond paltry copies or temporary manipulations and can conjure long lasting, convincing illusions with their Glamour. A dilapidated, broken bridge could appear sturdy enough for a car to travel over it, or the troll enforcer may back down after seeing the satyr with a whole crowd of angry (and illusory) friends behind him. The character could even create an entire party with food, guests, and music.#!"

 common_arts_willow_whispers_perk_name: "Willow Whispers"
 common_arts_elderich_prime_perk_name: "Elderich Prime"
 common_arts_oakenshield_perk_name: "Oakenshileld"
 common_arts_elder_form_perk_name: "Elder-Form"
 common_arts_dance_of_the_five_kings_perk_name: "Dane of The Five Kings"

 COMMON_ARTS_WILLOW_WHISPERS_PERK_EFFECT: "#flavor This useful bit of magic allows the changeling to speak to the world, and hear its replies. She may use Willow Whisper to speak to any plant, animal, object, or natural feature — any stone, any jeweled ring, any shining blade, any beast normally incapable of speech.#!"
 COMMON_ARTS_ELDERICH_PRIME_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, Manipulate weather over area based on $fae_scene_realm$ and $fae_nature_realm$.\nUnlock various elemental [men_at_arms|E].\n#flavor This cantrip allows the changeling to conjure up manifestations of the elements of earth, water, wood, fire, or air. This appears in the most natural form possible — water pours down from the sky as rain, or bubbles up from the earth as a small spring, for example. Rocks thrust up from the ground with a rumble. Plants grow up from the ground with unnatural speed. These manifestations can occur in decidedly unnatural locations, however, such as rain happening inside of a building, or flowering branches growing from an angry math teacher's head like beautiful antlers.#!"
 COMMON_ARTS_OAKENSHIELD_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, give target [GetModifier('cantrip_oakenshield_modifier').GetNameWithTooltip].\n#flavor This useful cantrip fortifies its target with a protective elemental sheath. Despite the name, this need not necessarily be a coat of armor-like bark; it could also make a person's skin hard as marble, allow the apparently solid surface of a door to splash and reform like water when struck, or surround a getaway car with an ablative shield of powerful wind.#!"
 COMMON_ARTS_ELDER_FORM_PERK_EFFECT: "Unlock various elemental shapeshifts.\n#flavor This powerful cantrip allows the changeling to imbue someone or something with the very essence of one of the elements, transforming them into a living manifestation of elemental power.#!"
 COMMON_ARTS_DANCE_OF_THE_FIVE_KINGS_PERK_EFFECT: "$unlock_forging_node$ Add a [modifier|E] based on the [artifact|E]'s type and increase maximal [durability|E] by #P 20#!. Amount of [modifiers|E] is based on your $fae_prop_realm$.\nAs a [passive_cantrip|E] of $fae_fae_realm$, at start of combat as [commander|E] deal [GetPlayer.MakeScope.ScriptValue('common_arts_dance_of_the_five_kings_perk_damage')] $pod_superficial_damage_with_box$.\n#flavor This potent cantrip makes the changeling the master of the five elements. She commands, and flames and earth and water leap to obey. She may guide any elemental manifestations that are already present to attack, restrain, entrap, clear a path, or simply reshape themselves to her liking.#!"