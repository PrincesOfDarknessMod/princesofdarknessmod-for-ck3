 common_arts_skycraft_focus_effect_desc: "Focusing on Skycraft grants:"

 common_arts_omen_perk_name: "Omen"
 common_arts_seers_wisp_perk_name: "Seer's Wisp"
 common_arts_tattletale_perk_name: "Tattletale"
 common_arts_augury_perk_name: "Augury"
 common_arts_face_fate_perk_name: "Face Fate"

 COMMON_ARTS_OMEN_PERK_EFFECT: "$cantrip_easy_bunk$ Discover random [secret|E] of target.\n$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor This rudimentary cantrip provides the briefest of glimpses at the thread of a person, place, or thing's destiny. The Omen revealed is always vague, and rarely concerned with immediate events — at this level, the seer can at best glimpse the broad nature of a thing's destiny.#!"
 COMMON_ARTS_SEERS_WISP_PERK_EFFECT: "$cantrip_standard_bunk$ Discover(Summon) [artifact|E] with [rarity|E] based on your $fae_prop_realm$ [fae_realm|E].\n$cantrip_easy_bunk$ Gain [gold|E] with amount based on your $fae_prop_realm$ [fae_realm|E].\n#flavor The seer gains the ability to conjure a bright fragment from the heart of the Dreaming, to lead her where she needs to journey. She may whisper into the Wisp the name or a description of the thing or person or place she seeks, and it will lead her there unerringly along the paths of Dán.#!"
 COMMON_ARTS_TATTLETALE_PERK_EFFECT: "Improve [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] and [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] [cantrip|E] by $cantrip_difficulty_reduce$.\n$countermeasures_unlocks_t3_all_seeing_eye$\n#flavor This useful cantrip allows the seer to scry distant scenes through an object or individual she has ensorcelled for this purpose. Traditionally, anything in the immediate vicinity of the Tattletale focus is displayed in a nearby reflective surface or surface of the changeling's choosing. The changeling can use any perception-based cantrip through the focus once a connection has been established.#!"
 COMMON_ARTS_AUGURY_PERK_EFFECT: "$cantrip_standard_bunk$ Summon to your [court|E] $POD_splat_mortal$ with [skills|E] you choose.\n$countermeasures_unlocks_t4_all_seeing_eye$\n#flavor The seer reaches deep into the weave and weft of Dán, coaxing the forces of fate and the Dreaming to reveal a path toward his heart's desire. Augury is a notoriously treacherous and uncertain Art, for the path it reveals is always fragmentary and clouded — but followed diligently, it will lead to the future the changeling seeks. Rather than providing a list of instructions to achieve the goal queried, Augury instead provides tantalizing hints, clues, portents, and interpretive visions. But Augury merely promises a fated road — not a short, easy, or cheap one. The more precious the future sought with this cantrip, the more demanding the road it lays out tends to be.#!"
 COMMON_ARTS_FACE_FATE_PERK_EFFECT: "$cantrip_standard_bunk$ Give target [GetModifier('cantrip_face_fate_positive_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Give target [GetModifier('cantrip_face_fate_negative_modifier').GetNameWithTooltip].\n#flavor In this, the greatest feat of Soothsay, the seer lays her hands directly upon the threads that make up the great tapestry of Dán and bends them to her will, blessing a subject with good fortune or cursing them with dire portents. The precise expression of this manipulation of destiny is always difficult to predict, but the signs cannot be mistaken.#!"

 common_arts_trick_of_the_light_perk_name: "Trick of The Light"
 common_arts_veiled_eyes_perk_name: "Veiled Eyes"
 common_arts_dream_logic_perk_name: "Dream Logic"
 common_arts_veiled_mind_perk_name: "Veiled Mind"
 common_arts_lost_in_the_mists_perk_name: "Lost in the Mists"

 COMMON_ARTS_TRICK_OF_THE_LIGHT_PERK_EFFECT: "$passive_cantrip_fae$ Give [GetModifier('cantrip_trick_of_the_light_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor A subtle manipulation of Glamour to muddle perceptions, Trick of the Light creates misunderstandings and mistakes. A pooka running a kidnapping con sounds just like the mark's mother over the phone. An eshu hounded by a deranged hunter walks into a market and blends into the crowd. Down on her luck, a sidhe passes off a single gold coin 100 so she can eat tonight.#!"
 COMMON_ARTS_VEILED_EYES_PERK_EFFECT: "$cantrip_hard_bunk$ Destroy an [artifact|E] with [rarity|E] limit based on your $fae_prop_realm$ [fae_realm|E].\n#flavor Where Trick of the Light makes the viewer mistake one thing for another, Veiled Eyes uses the Mists to make the target of the cantrip instantly forgettable. A Kithain dressed in courtly robes can walk through a crowd of mortals unnoticed, a troll's ornate broadsword hangs freely on her hip but goes ignored as she enters a bank, and the changeling's enemies remain oblivious to the storm clouds rolling across the sky toward their home. The target does not become physically invisible, just not worth noticing. Changelings can create malicious applications of Veiled Eyes, making speeding wagons or incoming enemies go unnoticed until it's too late.#!"
 COMMON_ARTS_DREAM_LOGIC_PERK_EFFECT: "$cantrip_easy_bunk$ Give target [GetModifier('cantrip_dream_logic_modifier').GetNameWithTooltip].\n#flavor Disjointed and illogical connections thrive in the chaos of the Dreaming, and changelings adept in Chicanery capitalize on the weirdness of dream logic to confuse and manipulate. As the target's mind becomes shrouded by Glamour and the ensuing Mists, she becomes disoriented and does not question statements or commands that would normally make little sense to her. Covert eshu pass messages and packages with confused mortal couriers. The troll zookeeper tames new animals that no one else can safely approach#!"
 COMMON_ARTS_VEILED_MIND_PERK_EFFECT: "$cantrip_standard_bunk$ Destroy random [relation|E] of target.\nImprove [GetPerk('common_arts_trick_of_the_light_perk').GetName(GetPlayer)] [passive_cantrip|E], by giving [GetModifier('cantrip_veiled_mind_modifier').GetNameWithTooltip] instead.\n#flavor Legends and mythology paint fantastic, and well deserved, scenes of faeries stealing mortals' memories. Moving beyond mere sight or sound, the changeling shrouds the focus of the cantrip with Glamour and the accompanying Mists to temporarily wipe the focus of the cantrip from everyone's mind. The lover who scorned a Kithain may find her family staring at her with blank faces as she comes home for a holiday, or the changeling's opponent forgets to draw her sword during the duel#!"
 COMMON_ARTS_LOST_IN_THE_MISTS_PERK_EFFECT: "$cantrip_hard_bunk$ Change [personality_traits|E] of target.\n#flavor What is worse than being unable to trust your senses, being invisible, or even being forgotten? Masters of Chicanery employ the ultimate manipulation of the Mists to wrest away their target's identity. The focus of this cantrip not only forgets who he is, but the changeling can employ her knowledge of other Realms to make him believe he is something else entirely. The nocker's rival begins acting like a dog when presenting a new invention. The vampire terrorizing a local motley wakes up with no memory of her undead state and panics when she steps outside and the sunlight burns her skin. A clurichaun makes a mortal believe he is a rain cloud to create instant performance art.#!"

 common_arts_ensnare_perk_name: "Ensnare"
 common_arts_mooch_perk_name: "Mooch"
 common_arts_effigy_perk_name: "Effigy"
 common_arts_gimmix_perk_name: "Gimmix"
 common_arts_smoke_and_mirrors_perk_name: "Smoke and Mirrors"

 COMMON_ARTS_ENSNARE_PERK_EFFECT: "$passive_cantrip_fae$ Give [GetModifier('cantrip_ensnare_modifier').GetNameWithTooltip] to enemy [knights|E] at start of the war.\n#flavor Useful for running from a mark or catching up to someone who owes the character money, ensnare causes the target to become slowed down or immobile. Furniture seems to jump into the target's way, pot holes flatten tires and crack axles, or the ground raises to divert rushing water. Even with no nearby plausible reason for a hindrance, the tendrils of Glamour created by this cantrip still trip, slow, and weigh down the target#!"
 COMMON_ARTS_MOOCH_PERK_EFFECT: "$cantrip_standard_bunk$ Steal an [artifact|E].\n#flavor Mooch provides changelings a quick and easy method of paying for a meal. If successful, Mooch instantly transfers one inanimate object from the possession of the target to the changeling. The item can appear in the character's hand, pocket, or sock — anywhere on her person she desires.#!"
 COMMON_ARTS_EFFIGY_PERK_EFFECT: "Unlock various $POD_construct_maa$ [men_at_arms|E].\n$cantrip_standard_bunk$ Copy an [artifact|E] you possess.\n#flavor Manipulation of Glamour complex enough to copy some- thing takes time and patience to perfect, but once mastered, can create replicas good enough to fool an observer, at least for a while. A pooka thief can make a good facsimile of the painting she agreed to steal and sell, but now wants to keep for her collection. The redcap door-to-door salesman might sculpt a replica of the pug he just ate to keep the family from noticing that their dog is missing until he leaves.#!"
 COMMON_ARTS_GIMMIX_PERK_EFFECT: "#flavor Mortal magicians spend countless hours staging elaborate tricks to convince others they can move and control objects with the power of their mind. By casting Gimmix, a changeling need only expend Glamour to move and manipulate anything she can see with considerable precision and force. A sidhe knight stops an arrow inches from his liege's chest. The sluagh parking attendant sends a wagon driven by a vampire hurtling off the side of the parking deck. A redcap surgeon keeps his “patient” still long enough to apply the restraints. The nocker picks the lock of his cell door with no tools.#!"
 COMMON_ARTS_SMOKE_AND_MIRRORS_PERK_EFFECT: "Improve [GetPerk('common_arts_ensnare_perk').GetName(GetPlayer)] [passive_cantrip|E], by giving [GetModifier('cantrip_smoke_and_mirrors_modifier').GetNameWithTooltip] instead.\n#flavor Masters of Legerdemain move beyond paltry copies or temporary manipulations and can conjure long lasting, convincing illusions with their Glamour. A dilapidated, broken bridge could appear sturdy enough for a wagon to travel over it, or the troll enforcer may back down after seeing the satyr with a whole crowd of angry (and illusory) friends behind him. The character could even create an entire party with food, guests, and music.#!"

 common_arts_willow_whispers_perk_name: "Willow Whispers"
 common_arts_eldritch_prime_perk_name: "Eldritch Prime"
 common_arts_oakenshield_perk_name: "Oakenshield"
 common_arts_elder_form_perk_name: "Elder-Form"
 common_arts_dance_of_the_five_kings_perk_name: "Dane of The Five Kings"

 COMMON_ARTS_WILLOW_WHISPERS_PERK_EFFECT: "#flavor This useful bit of magic allows the changeling to speak to the world, and hear its replies. She may use Willow Whisper to speak to any plant, animal, object, or natural feature — any stone, any jeweled ring, any shining blade, any beast normally incapable of speech.#!"
 COMMON_ARTS_ELDRITCH_PRIME_PERK_EFFECT: "$cantrip_standard_bunk$ Manipulate weather over area based on $fae_scene_realm$ and $fae_nature_realm$.\nUnlock various elemental [men_at_arms|E].\n#flavor This cantrip allows the changeling to conjure up manifestations of the elements of earth, water, wood, fire, or air. This appears in the most natural form possible — water pours down from the sky as rain, or bubbles up from the earth small spring, for example. Rocks thrust up from the ground with a rumble. Plants grow up from the ground with unnatural speed. These manifestations can occur in decidedly unnatural locations, however, such as rain happening inside of a building, or flowering branches growing from an angry math teacher's head like beautiful antlers.#!"
 COMMON_ARTS_OAKENSHIELD_PERK_EFFECT: "$cantrip_standard_bunk$ Give target [GetModifier('cantrip_oakenshield_modifier').GetNameWithTooltip].\n#flavor This useful cantrip fortifies its target with a protective elemental sheath. Despite the name, this need not necessarily be a coat of armor-like bark; it could also make a person's skin hard as marble, allow the apparently solid surface of a door to splash and reform like water when struck.#!"
 COMMON_ARTS_ELDER_FORM_PERK_EFFECT: "[shapeshift|EU] Option: become am elemental.\n#flavor This powerful cantrip allows the changeling to imbue someone or something with the very essence of one of the elements, transforming them into a living manifestation of elemental power.#!"
 COMMON_ARTS_DANCE_OF_THE_FIVE_KINGS_PERK_EFFECT: "$unlock_forging_node$ Add a [modifier|E] based on the [artifact|E]'s type with amount based on your $fae_prop_realm$.\n#flavor This potent cantrip makes the changeling the master of the five elements. She commands, and flames and earth and water leap to obey. She may guide any elemental manifestations that are already present to attack, restrain, entrap, clear a path, or simply reshape themselves to her liking.#!"

 common_arts_hopscotch_perk_name: "Hopscotch"
 common_arts_quicksilver_perk_name: "Quicksilver"
 common_arts_portal_passage_perk_name: "Portal Passage"
 common_arts_wind_runner_perk_name: "Wind Runner"
 common_arts_flicker_flash_perk_name: "Flicker Flash"

 COMMON_ARTS_HOPSCOTCH_PERK_EFFECT: "#flavor This is the Art of prodigious leaps, potentially allowing the subject to clear tall buildings in a single bound. Hopscotch moves its subject forward or upward as the caster desires, and the Glamour infused into the leap ensures that the landing is always undamaging, no matter how far the target drops before impact. Some pooka insist that Hopscotch was once their very own special magic, stolen by an eshu trickster in the time of legends and spread to the rest of the Fae — but who believes a pooka?#!"
 COMMON_ARTS_QUICKSILVER_PERK_EFFECT: "#flavor Quick grin, the subject of this cantrip moves literal blur, trailing traceries of expended Glamour behind as speed lines, crackling lightning, or some other manner of visual discharge. A motley of piskies runs down a speeding wagon carrying a stolen treasure, burning the road in their wake. A sidhe knight explodes into a blur of flashing steel and sizzling magic.#!"
 COMMON_ARTS_PORTAL_PASSAGE_PERK_EFFECT: "$cantrip_standard_bunk$ Teleport your army.\n#flavor This is the Art of gaining entry or egress whenever and wherever the changeling desires. Portal Passage creates a door large enough for the changeling to pass through, which pierces any barrier up to 10 feet thick — whether it's a brick wall, a hedgerow, or the side of a moving van makes no difference to the cantrip. Doors created with Portal Passage are unique to the changeling casting them, and may be recognized and identified by those familiar with her.#!"
 COMMON_ARTS_WIND_RUNNER_PERK_EFFECT: "#flavor Wind Runner is the glorious Art of flight. Most believe this particular magic was bartered for or stolen from the inanimae or some similar spirit of the winds, though the Nunnehi mutter that it was originally theirs, learned at great cost from the terrible beast known as the wendigo.#!"
 COMMON_ARTS_FLICKER_FLASH_PERK_EFFECT: "#flavor This fearsome cantrip allows its master to go anywhere she pleases, and none can bar her passage. It is the wondrous trick of vanishing sorcerers and gloating thieves, allowing the subject to disappear and reappear anywhere she desires.#!"

 common_arts_dream_walk_perk_name: "Dream Walk"
 common_arts_dream_craft_perk_name: "Dream Craft"
 common_arts_dream_portal_perk_name: "Dream Portal"
 common_arts_manifest_perk_name: "Manifest"
 common_arts_dream_puppet_perk_name: "Dream Puppet"

 COMMON_ARTS_DREAM_WALK_PERK_EFFECT: "$cantrip_easy_bunk$ Give target 20 [static_stress|E].\n#flavor After learning the first cantrip of Oneiromancy, a changeling can forge a bridge between the Dreaming and her target's mind, allowing her to fully enter a dream. She must target someone or something asleep she either knows well or can see. The character then wholly enters the target's dreams and disappears from the mundane world. The subject may or may not realize the changeling is something more than a part of her dream, but she will remember the dream upon waking.#!"
 COMMON_ARTS_DREAM_CRAFT_PERK_EFFECT: "$cantrip_standard_bunk$ Reduce target's [stress|E] by 30.\nImprove [GetPerk('common_arts_dream_walk_perk').GetName(GetPlayer)] [cantrip|E], by giving 40 [static_stress|E] instead.\n#flavor Some dreams stay with dreamers even after waking, coloring the mood and tone of their day. No longer limited to entering the target's dream and having minimal interactions, the Oneiromancer can exert control over the dreamscape to create peaceful tableaus in the sleeper's mind or inflict dreadful terrors that will haunt her the following day.#!"
 COMMON_ARTS_DREAM_PORTAL_PERK_EFFECT: "$cantrip_easy_bunk$ Teleport to your next [travel|E] destination.\n#flavor By exploiting the thin divide between the dreaming mind and the Dreaming itself, an Oneiromancer can overlap the two to create a portal. The subject's dream becomes a waystation within the Dreaming that connects the caster's location with the sleeper's.#!"
 COMMON_ARTS_MANIFEST_PERK_EFFECT: "Unlock various $POD_chimera_maa$ [men_at_arms|E] if you are $POD_splat_changeling$.\n#flavor Under the Oneiromancer's command, elements of a dream may spring to life in the waking world chimera. She maintains limited control over sentient chimera for a time after the dreamer wakes, but without the caster's Glamour, the chimera will fade as the dream is forgotten. By pouring her will into the manifestation, the Oneiromancer can even pull the chimera into the mundane world, though it will fade even faster.#!"
 COMMON_ARTS_DREAM_PUPPET_PERK_EFFECT: "$cantrip_hard_bunk$ [imprison|E] target.\n#flavor Some students of Oneiromancy abandon the path when the culmination of their training becomes clear. No longer limited to the manipulation of dreams or their intersection with the Dreaming, a master Oneiromancer can invade a target's mind and assume control of their form while they sleep.#!"

 common_arts_sparrows_and_nightingales_perk_name: "Sparrows and Nightingales"
 common_arts_worms_and_giants_perk_name: "Worms and Giants"
 common_arts_thousandskins_perk_name: "Thousandskins"
 common_arts_beastskin_perk_name: "Beastskin"
 common_arts_chimeric_exultation_perk_name: "Chimeric Exultation"

 COMMON_ARTS_SPARROWS_AND_NIGHTINGALES_PERK_EFFECT: "[shapeshift|EU] Option: Change your visual age and face features.\n#flavor This cantrip allows the changeling to set her target apart from himself, changing one fundamental feature into some plausible alternative. She could change a man into a woman, a redhead into a brunette, make a short woman tall, or a black man white.#!"
 COMMON_ARTS_WORMS_AND_GIANTS_PERK_EFFECT: "[shapeshift|EU] Option: manipulate your size into [GetTrait('dwarf').GetName(GetPlayer)] or [GetTrait('giant').GetName(GetPlayer)].\nCan ride small animals like pet cats as mounts.\n#flavor This legendary cantrip may be used to shrink or enlarge its subject, producing riding mice for pooka hedge knights, shrinking boggans down to do truly fine detail work on shoes, making table knives into impromptu swords, or punishing uncouth mortals with a true worm's-eye view of the Autumn World.#!"
 COMMON_ARTS_THOUSANDSKINS_PERK_EFFECT: "[shapeshift|EU] Option: become an animal.\n#flavor This mighty cantrip allows the changeling to transform a person or object into an animal. Individuals so transformed retain their own mind and instincts, but gain the physical traits, sensory abilities and limitations, and special capabilities of whatever animal they've been turned into. Objects transformed into animals gain the mind of a “typical” member of whatever species they have become for the duration of the transformation, so that a rabbit will be skittish, a lion will hunt, and so forth. Transformed humans and fae retain the power of speech, but only to those capable of perceiving chimerical reality.#!"
 COMMON_ARTS_BEASTSKIN_PERK_EFFECT: "$cantrip_easy_bunk$ Give target [modifier|E] increasing single [skill|E] by #P 5#!.\n#flavor This handy blessing or curse refines Metamorphosis to permit partial transformations. A churlish mortal might be granted a pig's face, while a noble steed could gain the wings of a swan, and a cornered commoner might grant herself fierce claws or poisoned fangs with which to fight.#!"
 COMMON_ARTS_CHIMERIC_EXULTATION_PERK_EFFECT: "[shapeshift|EU] Option: become a mythical beast.\n#flavor This fantastic cantrip allows the changeling to transform her target into a creature of legend, or even a fantastic beast of her own imagining, by mixing together the traits and natures of different creatures. Dragons, manticores, gryphons, the kraken of legend — any can be called forth by Chimeric Exultation.#!"

 common_arts_kindle_perk_name: "Kindle"
 common_arts_illuminate_perk_name: "Illuminate"
 common_arts_purity_perk_name: "Purity"
 common_arts_engulf_perk_name: "Engulf"
 common_arts_phoenix_song_perk_name: "Phoenix Song"

 COMMON_ARTS_KINDLE_PERK_EFFECT: "$passive_cantrip_fae$ Give [GetModifier('cantrip_kindle_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor A basic but eminently useful cantrip, Kindle heats the focus of the Glamour enough to cause discomfort but not injure. Kindle can cook food, help start a fire or make someone sweat and appear feverish.#!"
 COMMON_ARTS_ILLUMINATE_PERK_EFFECT: "$passive_cantrip_fae$ Give [GetModifier('cantrip_illuminate_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor Countless creation myths from the mortals begin with a divine light piercing the darkness. Changelings adept in Pyretics wield the power at the heart of such stories. By channeling Glamour into this cantrip, the Kithain can create a light which dispels darkness, illusion, and petty subterfuge.#!"
 COMMON_ARTS_PURITY_PERK_EFFECT: "$cantrip_standard_bunk$ Heal any disease.\n$cantrip_standard_bunk$ heal [EmptyScope.ScriptValue('POD_pyretics_interaction_superficial_heal_value')] [POD_superficial_damage_with_box|E].\n$cantrip_standard_bunk$ heal [EmptyScope.ScriptValue('POD_pyretics_interaction_aggravated_heal_value')] [POD_aggravated_damage_with_box|E].\n#flavor No impurity withstands sufficient heat, but the student of Pyretics can burn away contaminants with chimerical fire that does not damage or consume the target. Purify makes water and food safe to consume, can destroy infection or poison, and even temporarily cure disease. By coupling the cantrip with the Fae Realm, the caster can even burn away curses and effects from other cantrips.#!"
 COMMON_ARTS_ENGULF_PERK_EFFECT: "$passive_cantrip_fae$ Deal [EmptyScope.ScriptValue('common_arts_engulf_perk_damage')] [POD_aggravated_damage_with_box|E] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor Sometimes a changeling just needs to set something on fire. A simple and powerful cantrip, Engulf makes the target combust. The changeling can choose whether the focus of the magic burns from the flame or remains protected from the wreath of magical fire#!"
 COMMON_ARTS_PHOENIX_SONG_PERK_EFFECT: "$cantrip_hard_bunk$ Give target [GetModifier('extra_life_1_modifier').GetNameWithTooltip].\n#flavor The phoenix burns to ash, and from the destruction of the flames rises again as new. Mastery of Pyretics grants the changeling the power of new life in the face of destruction. After the changeling invokes the Phoenix Song, if the recipient of this blessing dies or is otherwise destroyed, she or it will burn to ash and rise as new a short time later.#!"

 common_arts_howling_gale_perk_name: "Howling Gale"
 common_arts_electric_gremlins_perk_name: "Electric Gremlins"
 common_arts_hurricane_speed_perk_name: "Hurricane Speed"
 common_arts_storm_shroud_perk_name: "Storm Shroud"
 common_arts_lord_of_levin_perk_name: "Lord of Levin"

 COMMON_ARTS_HOWLING_GALE_PERK_EFFECT: "$cantrip_standard_bunk$ Give target [GetModifier('cantrip_howling_gale_modifier').GetNameWithTooltip].\n#flavor The changeling may call forth a powerful wind, using it to speed the movement of herself or her allies, to confound her enemies, or simply to blow as she desires.#!"
 COMMON_ARTS_ELECTRIC_GREMLINS_PERK_EFFECT: "$cantrip_hard_bunk$ Give target [artifact|E] [GetModifier('cantrip_electric_gremlins_modifier').GetNameWithTooltip].\n#flavor This cantrip summons a host of gremlins — minor chime- rae that play havoc with complex items. Gremlins are tiny greenish-yellow creatures blessed with the ability to hide behind anything, no matter how small, when directly observed, whose presence disrupts complex items.#!"
 COMMON_ARTS_HURRICANE_SPEED_PERK_EFFECT: "Improve [GetPerk('common_arts_howling_gale_perk').GetName(GetPlayer)] [cantrip|E] by giving [GetModifier('cantrip_hurricane_speed_modifier').GetNameWithTooltip] instead.\n#flavor The changeling calls down the very essence of the wind itself and infuses it into a person or thing. Those infused with Hurricane Speed not only gain the swiftness of the wind, but also its expansive perspective, quickening their reflexes and reactions. Objects become as one with the wind, carrying themselves tremendous distances once impelled to movement.#!"
 COMMON_ARTS_STORM_SHROUD_PERK_EFFECT: "$passive_cantrip_fae$ Deal [EmptyScope.ScriptValue('common_arts_storm_shroud_perk_damage')] [POD_superficial_damage_with_box|E] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor The changeling calls down the essence of lightning into the target of this cantrip, surrounding it with a flickering nimbus of electrical destruction.#!"
 COMMON_ARTS_LORD_OF_LEVIN_PERK_EFFECT: "$cantrip_hard_bunk$ Deal [EmptyScope.ScriptValue('common_arts_lord_of_levin_perk_interaction_damage')] [POD_aggravated_damage_with_box|E] to target.\nImprove [GetPerk('common_arts_howling_gale_perk').GetName(GetPlayer)] [passive_cantrip|E] by dealing [EmptyScope.ScriptValue('common_arts_lord_of_levin_perk_damage')] [POD_superficial_damage_with_box|E] instead\n#flavor A master of Skycraft commands the very fires of heaven, and may send the lightning to strike down her enemies. This cantrip normally only works under an open sky, but a changeling who has enchanted herself with Storm Shroud may use Lord of Levin to throw lightning bolts from her fingertips so long as Storm Shroud persists.#!"