 soothsay_visible: "Soothsay"

 common_arts_soothsay_focus: "Soothsay Focus"
 common_arts_soothsay_focus_desc: "Art of divination, prediction, and interaction with Dán, the fae belief in fate."
 common_arts_soothsay_focus_effect_desc: "Focusing on Soothsay grants:"

 common_arts_omen_perk_name: "Omen"
 common_arts_seers_wisp_perk_name: "Seer's Wisp"
 common_arts_tattletale_perk_name: "Tattletale"
 common_arts_augury_perk_name: "Augury"
 common_arts_face_fate_perk_name: "Face Fate"

 COMMON_ARTS_OMEN_PERK_EFFECT: "As a [cantrip|E] with $pod_easy_bunk$, discover random [secret|E] of target.\n#flavor This rudimentary cantrip provides the briefest of glimpses at the thread of a person, place, or thing's destiny. The Omen revealed is always vague, and rarely concerned with immediate events — at this level, the seer can at best glimpse the broad nature of a thing's destiny.#!"
 COMMON_ARTS_SEERS_WISP_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, discover/summon [artifact|E] with [rarity|E] based on your #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L;bold Prop#!#! $pod_fae_realm$.\nAs a [cantrip|E] with $pod_easy_bunk$, gain [gold|E] with amount based on your #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L;bold Prop#!#! $pod_fae_realm$.\n#flavor The seer gains the ability to conjure a bright fragment from the heart of the Dreaming, to lead her where she needs to journey. She may whisper into the Wisp the name or a description of the thing or person or place she seeks, and it will lead her there unerringly along the paths of Dán.#!"
 COMMON_ARTS_TATTLETALE_PERK_EFFECT: "Improve [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] and [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] [cantrip|E] by decreasing their [bunk|E]'s difficulty by 1 [skill|E].\n#flavor This useful cantrip allows the seer to scry distant scenes through an object or individual she has ensorcelled for this purpose. Traditionally, anything in the immediate vicinity of the Tattletale focus is displayed in a nearby reflective surface or surface of the changeling's choosing, though some nocker seers have been known to display the results of Tattletale on old television screens or computer monitors. The changeling can use any perception-based cantrip through the focus once a connection has been established.#!"
 COMMON_ARTS_AUGURY_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, summon to your [court|E] $POD_splat_mortal$ with [skills|E] you choose.\nImprove [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] and [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] [cantrip|E] by decreasing their [bunk|E]'s difficulty by 1 [skill|E].\n#flavor The seer reaches deep into the weave and weft of Dán, coaxing the forces of fate and the Dreaming to reveal a path toward his heart's desire. Augury is a notoriously treacherous and uncertain Art, for the path it reveals is always fragmentary and clouded — but followed diligently, it will lead to the future the changeling seeks. Rather than providing a list of instructions to achieve the goal queried, Augury instead provides tantalizing hints, clues, portents, and interpretive visions. But Augury merely promises a fated road — not a short, easy, or cheap one. The more precious the future sought with this cantrip, the more demanding the road it lays out tends to be.#!"
 COMMON_ARTS_FACE_FATE_PERK_EFFECT: "As a [cantrip|E] with $pod_standard_bunk$, give target [GetModifier('face_fate_positive_modifier').GetNameWithTooltip].\nAs a [cantrip|E] with $pod_standard_bunk$, give target [GetModifier('face_fate_negative_modifier').GetNameWithTooltip].\nImprove [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] and [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] [cantrip|E] by decreasing their [bunk|E]'s difficulty by 2 [skill|E].\n#flavor In this, the greatest feat of Soothsay, the seer lays her hands directly upon the threads that make up the great tapestry of Dán and bends them to her will, blessing a subject with good fortune or cursing them with dire portents. The precise expression of this manipulation of destiny is always difficult to predict, but the signs cannot be mistaken.#!"