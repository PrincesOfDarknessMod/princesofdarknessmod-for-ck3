 common_arts_chicanery_focus_effect_desc: "Focusing on Chicanery grants:"

 common_arts_legerdemain_focus: "Legerdemain Focus"
 common_arts_legerdemain_focus_desc: "Art of manipulation autumn world as one see fit."
 common_arts_legerdemain_focus_effect_desc: "Focusing on Legerdemain grants:"

 common_arts_primal_focus: "Primal Focus"
 common_arts_primal_focus_desc: "Art of manipulation autumn world as one see fit."
 common_arts_primal_focus_effect_desc: "Focusing on Primal grants:"

