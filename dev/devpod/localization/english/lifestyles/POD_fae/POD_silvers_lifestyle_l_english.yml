 slivers_verdage_unstable_perk_name: "$sliver_2_name$ Verdage"
 slivers_verdage_semi_stable_perk_name: "$sliver_3_name$ Verdage"
 slivers_verdage_stable_perk_name: "$sliver_4_name$ Verdage"
 slivers_verdage_perfect_perk_name: "$sliver_5_name$ Verdage"

 sliver_verdage_flavor: "Verdage involves control of the living nature, ranging from plants to animals, and even objects made out of natural materials (without chemical treatments, etc.). Through this Sliver, users create and cure natural poisons, locate tracks of their target’s movement, clear overgrown terrain, and soothsay by looking at the threads of fate as the roots of life itself. Verdage summons wildlife and chimera born in the image of such, and makes it possible to communicate with them, instilling a sense of familiarity between user and target. Furthermore, it creates plants, makes soil fertile or infertile, moves budding growth, and causes it to bloom. Nonetheless, despite its ability to animate plants, it cannot create intelligence. The Sliver also makes it possible for casters to create objects out of nature’s resources through envisioning them in their mind, as well as transmute organic substances from one to another."

