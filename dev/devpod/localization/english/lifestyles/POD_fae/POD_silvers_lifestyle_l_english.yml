 LIVING_ROCK_PERK_EFFECT: "#F Shapes earth, changing its shape or composition.#!"
 STONESKIN_PERK_EFFECT: "#F Coats an object in protective stone, helping them to protect themselves against damage.#!"
 IRONARM_PERK_EFFECT: "Give [GetModifier('ironarm_perk_modifier').GetNameWithTooltip] [modifier|E] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E] or yourself during [single_combat_duel_plural|E].\n#F Grants additional strength to a subject, granting them the ability to move heavy stones.#!"
 ART_STASIS_PERK_EFFECT: "Give [GetModifier('stasis_perk_modifier').GetNameWithTooltip] [modifier|E] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#F Slows down a target, causing them to barely move at all.#!"
 QUAKE_PERK_EFFECT: "Inflict every ruler on the opposing side with [GetModifier('quake_perk_modifier').GetNameWithTooltip] when joining a [war|E].\n#F Splits apart the earth, damaging people and things in the area.#!"
 AURA_PERCEPTION_PERK_EFFECT: "#F Learn various qualities of a person, such as emotional state and honesty, from their aura.#!"
 HOLD_PERK_EFFECT: "#F Halts the motion of an object in flight before it reaches the caster.#!"
 ART_TEMPUS_FUGIT_PERK_EFFECT: "#F Allows an object to move at an incredibly fast speed.#!"
 FRICTION_PERK_EFFECT: "Give [GetModifier('friction_perk_knight_positive_modifier').GetNameWithTooltip] [modifier|E] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E] or yourself during [single_combat_duel_plural|E].\nGive [GetModifier('friction_perk_knight_negative_modifier').GetNameWithTooltip] [modifier|E] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#F Heat or chill the water within an object, to the point of boiling it or freezing it into ice.#!"
 HEALING_WATERS_PERK_EFFECT: "As a [character_interaction|E], allows you to heal a target, or fix target artifact.\n#F Fixes an object or heals a person by pouring water over the wound.#!"
 FLAME_PERK_EFFECT: "#F Produces a flame varying in size from a tiny candle to a great bonfire.#!"
 TORTURED_HEART_PERK_EFFECT: "#F Pulls at the heart to edit the intensity of an existing emotion.#!"
 ARES_FIST_PERK_EFFECT: "Give [GetModifier('ares_fist_perk_modifier').GetNameWithTooltip] [modifier|E] to ally [knights|E] when acting as a [commander|E] during the [combat_phase|E] or yourself during [single_combat_duel_plural|E].\n#F Channels divine strength to improve prowess in hand-to-hand combat.#!"
 STRINGS_OF_THE_SOUL_PERK_EFFECT: "Unlocks [GetScheme('PODsoul_bridge').GetTypeName] [scheme|E].\n#F Creates an emotion from nothing, and implants it into the target.#!"
 INFERNO_PERK_EFFECT: "As a [character_interaction|E], allows you give [GetModifier('firebombs_modifier').GetNameWithTooltip] or [GetModifier('firespewer_modifier').GetNameWithTooltip] to the target.\n#F Allows full control of a fire, shaping and bending it to the user's will.#!"
 MARATHON_PERK_EFFECT: "#F Reduces travel time, yet paradoxically the user does not appear to go faster.#!"
 CONCEAL_CONFUSE_PERK_EFFECT: "Give [GetModifier('conceal_confuse_perk_knight_modifier').GetNameWithTooltip] [modifier|E] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\nGive enemy [commanders|E] [GetModifier('conceal_confuse_perk_commander_modifier').GetNameWithTooltip] [modifier|E] when acting as a [commander|E] during the [combat_phase|E].\nInflict every ruler on the opposing side with [GetModifier('conceal_confuse_perk_ruler_modifier').GetNameWithTooltip] when joining a [war|E].\n#F Produces a simple, static illusion fooling one or two senses.#!"
 FLIGHT_PERK_EFFECT: "#F Allows a target to fly, taking to the sky as if they had wings.#!"
 ILLUSION_PERK_EFFECT: "As a [character_interaction|E], allows you to make victim gain [GetTrait('blind').GetName( GetPlayer )], [GetModifier('sensory_deprivation_deaf_modifier').GetNameWithTooltip]...\n#F Produces a more complex illusion capable of fooling many distinct senses.#!"
 ART_PHANTASM_PERK_EFFECT: "#F Produces powerful, living illusions that act as Chimerae in their own right.#!"
 SOLARIUM_PERK_EFFECT: "As a [character_interaction|E], allows you to give a plant modifier to the target county.\n#F Produces a change in the size, health, or shape of a living plant.#!"
 BABEL_PERK_EFFECT: "[buy_claim_interaction|E] and [buy_artifact_claim_interaction|E] Cost: #P -50%#!\n#F Allows the user to speak with any object as if it possesses human intelligence.#!"
 COALESCE_PERK_EFFECT: "As a [character_interaction|E], allows you to gain gold from glamour.\n#F Transforms plant matter into any object desired.#!"
 WEB_OF_LIFE_PERK_EFFECT: "#F By examining one aspect of an interconnected ecosystem, aspects of its future can be determined.#!"
 MOLD_PERK_EFFECT: "$unlock_forging_node$ Sacrifice a [prisoner|E] to improve the [artifact|E] based on the sacrifice's [traits|E]\n#F Transforms one type of living matter to another, without killing it in the process.#!"