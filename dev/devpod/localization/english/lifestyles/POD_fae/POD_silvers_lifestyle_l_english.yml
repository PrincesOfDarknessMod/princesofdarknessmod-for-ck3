 sliver_petros_flavor: "Petros bring the stamina, steadfastness, durability, and strength that exists in rocks and the earth itself. Through the use of hands alone, the caster is able to sculpt rocks into life-size statues in a few hours, change the very essence of what type of soil or rock something is, and even transmute minerals (but never into iron). It creates armor out of minerals, and changes the mass and shape of earth, causing it to rise from the ground as walls. Petros connects its user to ancient times, making it possible to access long-lost lore and information to aid in current predicaments. Glomes often use the Sliver to enforce oaths and contracts, binding them with the durability of stone itself, and causing them to be enforced by the Dreaming. Though it cannot create other emotions, Petros is able to instill devotion in others, making it an excellent magic for leaders of all sorts."

