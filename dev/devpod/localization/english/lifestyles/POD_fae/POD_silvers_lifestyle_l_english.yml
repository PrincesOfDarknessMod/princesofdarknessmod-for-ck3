 slivers_stratus_unstable_perk_name: "$sliver_2_name$ Stratus"
 slivers_stratus_semi_stable_perk_name: "$sliver_3_name$ Stratus"
 slivers_stratus_stable_perk_name: "$sliver_4_name$ Stratus"
 slivers_stratus_perfect_perk_name: "$sliver_5_name$ Stratus"

 sliver_stratus_flavor: "Stratus is the essence of air. Tranquil breezes or raging storms, dark clouds or clear skies, soft rain or thunderstorms, all fall into this magic’s domain. At the same time, wind also carries messages for delivery, or to overhear. Whispers meant for an individual gain strength as if transmitted over speakers, and screams are swiftly muffled when the air refuses to transmit their sonic waves.Moving can be a slow, or extremely swift, experience depending on how the phylum Unleashing this Sliver applies its effect while her allies attack their enemies. It also creates temporary illusions, coaxing shadows to cloak movement and misdirection to successfully remain hidden, when required. Although it may create Wild Portals if things go wrong, Stratus also allows teleportation over brief distances (such as within a city or skyscraper)."

