 slivers_pyros_uncontrolled_perk_name: "$sliver_1_name$ Pyros"
 slivers_pyros_unstable_perk_name: "$sliver_2_name$ Pyros"
 slivers_pyros_semi_stable_perk_name: "$sliver_3_name$ Pyros"
 slivers_pyros_stable_perk_name: "$sliver_4_name$ Pyros"
 slivers_pyros_perfect_perk_name: "$sliver_5_name$ Pyros"

 sliver_pyros_flavor: "Fire burns. This is its nature, and when it does so uncontrollably, it provides extreme intensity, light, and heat. Pyros reveals lies for the misdirection and subterfuge they are, shining light on the shadows in life. It creates fire, controlling and redirecting it, but never suffocating flames, because fire must burn. It engulfs fists, casing bare knuckles to inflict lethal damage, and enhances the Glamour within Treasures, changing their damage to aggravated. Flames rise to defend their wielder and blind opponents, making it hard for them to hit their targets, or making it easier to escape after being detected. Fire’s intensity burns in the heart of all living (and even some undead Prodigals), and Pyros enhances hatred and love to such heights that it eventually consumes the target, instilling paranoia or fear of rejection. It never deals with emotional gray zones, and always take the effects to the extreme, or causes complete numbness as if the flame inside the soul flickered and died."
 
