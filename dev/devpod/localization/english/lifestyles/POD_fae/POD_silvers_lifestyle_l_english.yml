 sliver_aquis_flavor: "Water is life. It's required to sustain mortals, animals, and plants. It divides and unifies, and its shape is never consistent, always changing to suit what (and if) something contains it. Through Aquis, inanimae can instill hope as doubt washes away, or evoke the grief pertaining to losing someone to the sea. They can heal with tears created by this spell, and wound by drowning their victims. It allows them to shatter illusions and mirages, laying the truth bare for all to see. Through the reflections in water, they see the past and distant events occurring as they watch. Aquis control the waters, raising, dividing, freezing, smelting, and even evaporating them. It rises in defense to push enemies back and press them to the ground, and hides movement through mists. It heals aggravated wounds when in the Deep Dreaming, and soothes emotions intensified by Pyros."

 SLIVERS_AQUIS_UNCONTROLLED_PERK_EFFECT: "Improve [GetTrait('art_aquis').GetName(GetPlayer)] [cantrip|E] by decreasing both their [bunk|E]'s difficulty, and glamour cost(with limit of 1 glamour) by #P 1#!.\nImprove [GetTrait('art_aquis').GetName(GetPlayer)] [passive_cantrip|E] by giving [GetModifier('cantrip_uncontrolled_aquis_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_basic_aquis_modifier').GetNameWithTooltip].\n#flavor $sliver_aquis_flavor$#!"
 SLIVERS_AQUIS_UNSTABLE_PERK_EFFECT: "Improve [GetTrait('art_aquis').GetName(GetPlayer)] [cantrip|E] by decreasing both their [bunk|E]'s difficulty, and glamour cost(with limit of 1 glamour) by #P 1#!.\nImprove [GetTrait('art_aquis').GetName(GetPlayer)] [passive_cantrip|E] by giving [GetModifier('cantrip_unstable_aquis_modifier').GetNameWithTooltip] instead of [GetModifier('cantrip_uncontrolled_aquis_modifier').GetNameWithTooltip].\n#flavor $sliver_aquis_flavor$#!"
