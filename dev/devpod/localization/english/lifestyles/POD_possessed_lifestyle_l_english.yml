 ABSORB_FETISH_PERK_EFFECT:0 "As a [character_interaction|E], allows you to destroy a possessed [artifact|E] to gain a random attribute.\n#F This Charm allows a spirit to absorb a fetish into its own mass, increasing its bulk and power.#!"
 ACCESS_CAERN_PERK_EFFECT:0 "Can hold caern [building|E].\n#F This Charm allows the spirit to access the fundamental nature of the caern to facilitate other Charms.#!"
 ACQUISITION_PERK_EFFECT:0 "As a [character_interaction|E], allows you to speed up the [GetScheme('steal_back_artifact').GetTypeName] [scheme|E].\n#F This Charm allows a spirit to 'borrow' a small object from the physical world.#!"
 AGONY_PERK_EFFECT:0 "Give [GetModifier('agony_perk_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\n#F The spirit can attempt to incapacitate a creature by magnifying its pain.#!"
 AIRT_SENSE_PERK_EFFECT:0 "Chance of Being Trapped in the Umbra: #P -5%#!\nMonthly Umbra Exploration Progress: [grace_i]#P +50%#!\n#F Most spirits have a natural sense of the airts (directions) of the spirit world, and they are able to travel about without much difficulty.#!"
 APPEAR_PERK_EFFECT:0 "Allow interacting with the [earth|E] while staying in the [umbra|E].\n#F A spirit with this Charm may manifest in front of an observer without assuming material form.#!"
 ARMOR_PERK_EFFECT:0 "#F This Charm grants a spirit a measure of protection.#!"
 ASSESS_CHARACTER_PERK_EFFECT:0 "#F This Charm allows the spirit to evaluate the general strength of a character in an individual.#!"