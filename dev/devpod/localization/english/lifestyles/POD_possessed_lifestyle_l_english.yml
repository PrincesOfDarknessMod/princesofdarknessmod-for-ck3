 ANIMAL_CONTROL_PERK_EFFECT:0 "As a [character_interaction|E], allows you to directly gain a pet.\nAs a [character_interaction|E], allows you to call your pet to war.\nCan recruit several kind of animals as [men_at_arms|E].\n#F Animal Control gives the user the ability to summon and control animals who are within range at the time the Power is used.#!"
 AURA_OF_TRANQUILITY_PERK_EFFECT:0 "Give [GetModifier('aura_of_tranquility_perk_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\n#F The character radiates an aura of either peacefulness (in the case of Kami) or harmony (in the case of Drones) that calms anyone within the area. #!"
 BERSEKER_PERK_EFFECT:0 "Can now do the berserker attack in wars as a [knight|E].\nRage recovery chance: #P +100%#!\n#F The host is infused with Rage just like a werewolf's, with all the attendant advantages and disadvantages.#!"
 BESTIAL_MUTATION_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_bestial_mutation_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The host body is no longer recognizable as human or animal; it has distended and warped into a rough parody of its former shape, wholly unable to pass as anything other than a supernatural monster.#!"
 BULKY_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_giant_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character's host body is unusually large and solid, offering an extra measure of durability.#!"
 BODY_EXPANSION_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_body_expansion_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character is capable of increasing her size up to three times her normal height for a short period of time.#!"
 BRAIN_EATING_PERK_EFFECT:0 "As a [character_interaction|E], allows you to absorb a prisoner's intelligent trait to gain lifestyle xp.\n#F The fomor can absorb a target's mental faculties with a touch, and use them to learn.#!"
 CHAOS_ENGINE_PERK_EFFECT:0 "Give enemy commanders [GetModifier('chaos_engine_perk_modifier').GetNameWithTooltip] modifier when in war as a commander.\n#F A gorgon with this ability is a walking mouthpiece for chaos, pure and simple. His very presence brings disorder and change to the objects and events at work around him.#!"
 STASIS_ENGINE_PERK_EFFECT:0 "Give enemy commanders [GetModifier('stasis_engine_perk_modifier').GetNameWithTooltip] modifier when in war as a commander.\n#F Axes re-align, objects secure in place, and things that seem out of synch are brought into harmony with their environs.#!"
 COMMAND_THE_EARTH_PERK_EFFECT:0 "As a [character_interaction|E], allows you to unleash hostile weather effects over enemy realms.\n#F The character is able to compel the very earth to obey it, sculpting new formations, sucking down enemies into morasses of quicksand, and so on.#!"
 CURSE_OF_GAIA_PERK_EFFECT:0 "As a [character_interaction|E], allows you to give enemy [GetModifier( 'mild_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'moderate_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L] or  [GetModifier( 'very_severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L].\n#F The Kami may levy the curse of Gaia Herself against an offender, punishing those who disrupt Her will or the balance of the natural world. Minor curses may manifest as runs of bad luck, bouts of depression or embarrassing physical conditions (such as hair loss or extreme stench); major curses might turn an offender to stone, inflict him with a wasting disease or even compel the earth to swallow him up.#!"
 CYBERSENSES_PERK_EFFECT:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F [Select_CString( GetScriptedGui('cyberrealm_location').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'Allows the user to replace his own senses with that of a machine — radar, infrared scanning, or the like.', '')]#!"
 CYBERSENSES_PERK_BONUS_VALUE:1 "[GetPerk('drone_cybersenses_perk').GetName(GetPlayer)]"
 DEVOUR_PERK_EFFECT:0 "Bonus to cause a brutal maul to enemy [knights|E] in war as a [knight|E].\n#F The character is able to distend its mouth and swallow objects as large as a medium-sized dog or a small person. Anyone so devoured is digested as food, with only truly indigestible materials being eliminated (such as bones, shoes or glasses).#!"
 DISPERSION_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_swarm_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F This power, one of the most overt changes a spirit can make, allows its host to break up his body into a number of smaller wholes, each one fully alive and possessed of its "owner's" sentience. Most resemble small animals such as rodents or snakes, though some particularly unusual gorgons have been known to suddenly disperse into a number of different entities at once.#!"
 ELECTRICAL_FIELD_PERK_EFFECT:0 "Bonus to a cause brutal maul to enemy [knights|E] in war as a [knight|E].\n#F The character may generate a powerful electrical field that shocks anyone in contact with his body. The current can be AC or DC in nature, with appropriate effects (blowing the target away from the character, or locking their muscles in place).#!"
 ENCHANTING_VOICE_PERK_EFFECT:0 "Give enemy commanders [GetModifier('enchanting_voice_perk_modifier').GetNameWithTooltip] modifier when in war as a commander.\n#F The character may enthrall listeners with its song (or in the case of Drones, with its wonder-fully soothing speech).#!"
 ENTROPIC_TOUCH_PERK_EFFECT:0 "#F With a touch, the character can temporarily weaken the physical structure of an object, or even of a living being.#!"
 EXTENSIBLE_LIMB_PERK_EFFECT:0 "#F One or more of the character's limbs — arms, legs, tails, even tongues — can stretch out to manipulate objects or strike an opponent at range. This power commonly manifests in fomori as a powerful froglike tongue, giving its owner strangely slurred speech (and sometimes a taste for insects).#!"
 EXTRA_LIMB_PERK_EFFECT:0 "#F The character permanently sprouts a number of extra limbs, be they extra arms, tentacles or even extended, prehensile tongues or intestines. The limbs maybe attached in weird places, or even concealed in fleshy pockets until needed.#!"
 EYES_OF_THE_WYRM_PERK_EFFECT:0 "#F The fomor's eyes are somehow unusual. They may be compound eyes like an insect's, or possess strangely shifting pupils and irises, or even swim with ripples of iridescent, unclean color. Those who meet the fomor's gaze see a more dreadful pattern hidden within — glimpses of the maddening damnation of the Wyrm.#!"
 FLIGHT_PERK_STATS_EFFECT:0 "#F The character is able to fly, either through wings (of any description) or some other form of propulsion (such as wind-riding for a storm-aspected Kami). She may hover, glide, soar or dive, as the player chooses.#!"
 FOOT_PADS_PERK_EFFECT:0 "#F The character's feet are padded like an animal's, granting him an extra measure of stealth.#!"
 FUNGAL_TOUCH_PERK_EFFECT:0 "Give [GetModifier('fungal_touch_perk_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\n#F The character has been partly subsumed by a strange fungoid substance, which it can pass on with a virulent touch.#!"
 GASEOUS_FORM_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_mist_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character can dissolve her body into a gaseous state, be it mist, smoke or a foul miasma.#!"
 HAZARDOUS_BREATH_PERK_EFFECT:0 "Bonus to cause a brutal maul to enemy [knights|E] in war as a [knight|E].\n#F The character can vent some sort of dangerous substance on command — fire, poison breath, acidic spittle or the like. The attack need not actually be a breath weapon; any sort of long-range attack will do.#!"
 HEART_SENSE_PERK_EFFECT:0 "#F The Kami can see into the very heart of an individual, determining her general spiritual allegiance (Wyrm, Wyld, Weaver, Gaia or other), her innocence or guilt, her true form (if she is wearing another shape), even her most secret dreams and desires or her connections to the past.#!"
 HOMOGENEITY_PERK_EFFECT:0 "As a [character_interaction|E], allows you to remove a target's [battle_modifier|E].\n#F The character can counteract all supernatural powers within five yards of her, or focus on one opponent and prevent him from using such powers for considerably longer. Homogeneity does not work on "innate" powers; therefore, while it will counteract a Garou's Gifts, it will not stop them from shapeshifting.#!"
 HORROR_PERK_EFFECT:0 "Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\nYou can bypass delirium immunity.\n#F The character's presence is so disturbing that it evokes the same supernatural panic in mortals as witnessing a Garou in Crinos form. More powerful characters can even inflict terror and disbelief on the supernatural. This power almost always manifests in characters with truly bestial, animalistic or outright monstrous forms.#!"
 IMMUNITY_TO_THE_DELIRIUM_PERK_EFFECT:0 "You won't gain [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier when fighting with shapeshifters in war or [single_combat_duel|E] anymore.\n#F The character is not subject to any of the Delirium's effects.#!"
 INFECTIOUS_BITE_TOUCH_PERK_EFFECT:0 "As a [character_interaction|E], allows you to give diseases.\n#F The character is able to spread a vicious infection by bite or touch. If the host manages to infect at arget, the target becomes feverish and sickly, and will be mildly contagious until the infection heals.#!"
 INVISIBILITY_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character disappears from sight. She leaves no footprints, but still makes noise and still gives off scent, and will still register to Gifts such as Sense Wyrm (if applicable).#!"
 INVULNERABILITY_PERK_STATS_EFFECT:0 "Allow you to spend willpower instead of taking wounds.\nAllows you to not die by wounds.\n#F The character's body is supernaturally strengthened with no obvious outward effect.#!"
 LIQUID_FORM_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_blood_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character can liquefy its body, dissolving into a thick liquid (mud, blood or the like) that can move about as it likes. The liquid-form character can flow through small openings without difficulty, although it has difficulty moving uphill.#!"
 LONGEVITY_PERK_EFFECT:0 "#F The Kami's lifespan is extended by a factor often; a human-host Kami would live for around 700 years with the assistance of this power. If the Kami purchases this power five times, he is effectively ageless.#!"
 LORD_OF_THE_LAND_PERK_EFFECT:0 "#F The character is incredibly attuned to her territory, remaining constantly aware of anything that happens within the boundaries she's claimed as her own.#!"
 MAGNETOKINESIS_PERK_EFFECT:0 "#F The Drone may generate and control localized magnetic fields, allowing him to move or manipulate ferrous objects.#!"
 MALLEATE_PERK_EFFECT:0 "Bonus chance to maim an enemy [knights|E] in a war as a [knight|E].\n#F The character is capable of injecting a strange venom that makes the victim's body malleable, making bones and muscle groups as yielding as clay. This power may affect even unliving flesh and plant tissue.#!"
 MASK_PRESENCE_PERK_EFFECT:0 "As a [character_interaction|E], allows you to stop all schemes targeting you.\n#F The character is able to obscure his presence from any observers.#!"
 MATTER_WEAVE_PERK_EFFECT:0 "#F The character is capable of reshaping matter into new forms and functions. Drones commonly use this power to repair damage to structures or patch up imperfections; gorgons use it almost at their whim, remolding objects into bizarre new configurations to weaken the Weaver's hold on an area.#!"
 MEMORY_CARESS_PERK_EFFECT:0 "#F The character's spirit half interferes with the minds of ordinary people in order to keep the character's activities secret. On lookers react to the character in whatever way they normally would, but their memories of the character fade once the character has left. This power certainly has its drawbacks — it's hard to hold down a day job if your boss forgets you exist whenever you leave the room — but for many possessed, anonymity is the ultimate defense.#!"
 MIND_BLAST_PERK_EFFECT:0 "You are able to [imprison|E] [characters|E] that would have been impossible to capture in [siege|E] otherwise.\nWay more likely to [imprison|E] [characters|E] after a successful [siege|E] or [raid|E].\n#F The character can immobilize a target with a bolt of psychic energy. The victim collapses to the ground, writhing in pain, at the mercy of his assailant.#!"
 FOMORI_MIND_RAPE_PERK_EFFECT:0 "As a [character_interaction|E], allows you to know every secret and scheme of the target.\n#F The fomor may invade a target's mind and forcibly wrench information from it. While this does no actual damage, the victim tends to feel naked and violated for several days afterwards (and often has a splitting headache to boot).#!"
 NATURAL_WEAPONRY_PERK_EFFECT:0 "Unlock Natural Weaponry Shapeshift option.\n#F The character manifests natural weaponry in the form of claws, fangs, horns, or just sharp bony protrusions.#!"
 NIGHTMARE_COMMAND_PERK_EFFECT:0 "Unlocks [GetScheme('PODsoul_bridge').GetTypeName] [scheme|E].\n#F The fomor may cause a target to suffer from horrifying nightmares, depriving the victim of restful sleep. The fomor may choose to influence the content of the dreams, or simply let the victim's subconscious do the dirty work.#!"
 PEACEFUL_FIGHTING_PERK_EFFECT:0 "More likely to [imprison|E] [characters|E] after a successful [siege|E] or [raid|E].\n#F The character is able to fight with her full strength without permanently damaging her opponents. Kami use this power out of mercy; Drones out of a desire to avoid any major disruptions.#!"
 PIERCING_GAZE_PERK_EFFECT:0 "#F The Kami is able to make anyone it looks at feel uncomfort-able and ill at ease, as if the Kami is staring directly into her soul. This power is usually used to drive away trespassers, although it can serve as an excellent aid to interrogation.#!"
 PLANT_ANIMATION_PERK_EFFECT:0 "Can recruit [GetMaA('animated_tree').GetName] as [men_at_arms|E]\n#F The character is able to animate plants, causing trees, vines, shrubs and the like to move in ways normally denied them. A tree can strike or even constrict opponents with its branches, vines can entangle and even grasses can catch at a foe's feet.#!" 
 PLANT_KINSHIP_PERK_EFFECT:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F This power allows the Kami to communicate with plant life, albeit very little information can be gleaned from the average plant.#!"
 PLANT_KINSHIP_PERK_BONUS_VALUE:1 "[GetPerk('kami_plant_kinship_perk').GetName(GetPlayer)]"
 PLIANT_BONES_PERK_EFFECT:0 "Increase the chance of success for the Escape from Prison [decision|E].\n#F The character's bones can become soft and malleable, allowing her to squeeze through small openings like a rat. The character can also wriggle free of bonds and restraints, given time.#!"
 POISON_PERK_EFFECT:0 "Bonus chance to cause severe injuries to enemy [knights|E] in war as a [knight|E].\n#F The character is capable of injecting poison into a foe, whether through venom glands or poisonous body fluids such as saliva.#!"
 POISON_TUMORS_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_poison_tumors_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The fomor's body is covered with odd tumors filled with caustic pus, usually of some repugnant color and smell.#!"
 REASSURING_PRESENCE_PERK_EFFECT:0 "#F The character may change his appearance to match whatever person the greatest number of onlookers at any given time would respect and listen to. Although this power may seem weak, a clever fomor or Drone can use it to go almost anywhere and obtain limited cooperation from almost anyone.#!"
 REGENERATION_PERK_STATS_EFFECT:0 "Remove all wounds and maims every three months.\n#F The character regenerates damage almost immediately, in the same manner as a werewolf.#!"
 SANITY_RENDING_PERK_EFFECT:0 "As a [character_interaction|E], allows you give the target a stress trait.\n#F The character is capable of bending the minds of those that meet its gaze — bending them to the breaking point.#!"
 SEASONS_BLESSINGS_PERK_EFFECT:0 "#F The Kami can bring the effects of a particular season to an area: leaves may fall from trees if Autumn's Blessings are invoked, while a Kami attuned to winter may call a snowfall.#!"
 SELF_IMMOLATION_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character can immolate herself, becoming a walking bonfire. The flames do not harm the character, but damage everything the character touches, with all the attendant risks.#!"
 SENSE_GAIA_PERK_EFFECT:0 "#F The character can sense manifestations of Gaia in the nearby area — Gaian shapeshifters, spirits and the like.#!"
 SHADOWPLAY_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character can manipulate local shadows, drawing them together into an area of darkness. The character can always see in his own shadows.#!"
 SILENT_SPEECH_PERK_EFFECT:0 "#F The character is able to communicate without speech, speaking to individuals mind-to-mind. This power bypasses all language barriers, although the character cannot communicate in this fashion with creatures without language unless using another power to do so.#!"
 SIZE_PERK_EFFECT:0 "As a [character_interaction|E], allows you to become [GetTrait('giant').GetName( GetPlayer )] or [GetTrait('dwarf').GetName( GetPlayer )].\n#F While the Bulky power represents a particularly massive specimen of the host body type, this represents dramatic and permanent shifts in a character's size.#!"
 SKINCHANGER_KINSHIP_PERK_EFFECT:0 "#F This power represents a great spiritual connection to and friendship with one of the Changing Breeds. The most common version of this power is Garou Kinship (since the other Breeds have fallen into decline), but a Kami may possess Kinship to any shapechanger race, even Ratkin or Ananasi.#!"
 SKINSHIFT_PERK_EFFECT:0 "Bonus to Shapeshift [character_interaction|E] to change appearance.\n#F The possessed character may alter the appearance of his flesh, quickly and fluidly taking on the features and body shape of an entirely different creature within moments.#!"
 SPIRIT_AWAKENING_PERK_EFFECT:0 "#F The Kami is able to awaken the spirits of animals, plants or inanimate objects by singing or playing music for them.#!"
 SPIRIT_GIFT_PERK_EFFECT:0 "Unlock [charms_lifestyle|E].\n#F The character car learn any appropriate Gift and develop it as his own power.#!"
 SPIRIT_KINSHIP_PERK_EFFECT:0 "Can recruit [GetMaA('materialized_spirits').GetName] as [men_at_arms|E].\n#F The character has powerful ties to the spirits of his kind, and may even call on them in times of danger. Fomori are tied to Banes, Drones call on Weaver-spirits, gorgons may invoke Wyldlings and Kami usually summon elementals.#!"
 SPIRIT_RENDING_PERK_EFFECT:0 "You can imprison, torture, execute or physically hurt a spirit in [single_combat_duel|E].\n#F Fomori with this power can use their Rage to strikeout against spirits across the Gauntlet and feed on their energies. Of course, a fomor who misjudges her quarry might be in for a fatal surprise.#!"
 SPIRIT_SENSE_PERK_EFFECT:0 "Unlock $seek_aid_of_the_spirits_decision$ [decision|E].\n#F The character is able to see across the Gauntlet, watching the occurrences in the local Penumbra.#!"
 SPIRIT_STATIC_PERK_EFFECT:0 "Unlock Manipulate the Gauntlet option in the umbra panel.\n#F The Drone may temporarily increase the Gauntlet in his immediate vicinity, limiting the powers of the Weaver's enemies.#!"
 SPIRIT_TIES_PERK_EFFECT:0 "Can use fetish [artifact|E].\nGnosis recovery chance: #P +100%#!\nGain access to the [spirit_wilds|E].\nChance of Being Trapped in the Umbra: #P -5%#!\nMonthly Umbra Exploration Progress: [grace_i]#P +25%#!\n#F The character has an innate connection to the spirit world and may use fetishes and talens.#!"
 STASIS_COCOON_PERK_EFFECT:0 "Unlock Enter Cocoon [decision|E], allowing to enter [GetTrait('torpor').GetName( GetNullCharacter )] which will depose you.\n#F The character cocoons herself in a hardened shell while her metabolism slows to a state of suspended animation. Cocooned characters do not age and can remain alive without food, water, or even air almost indefinitely.#!"
 STASIS_TOUCH_PERK_EFFECT:0 "As a [character_interaction|E], allows you to remove target's shapeshift.\n#F With a single touch, the character can rob his opponents of the ability to shift their form.#!"
 STEP_SIDEWAYS_PERK_EFFECT:0 "Gain access to the [spirit_wilds|E].\nChance of Being Trapped in the Umbra: #P -5%#!\nMonthly Umbra Exploration Progress: [grace_i]#P +25%#!\n#F The character gains the ability to step into the Umbra, much as Garou do.#!"
 SUCCUBUS_VEIL_PERK_EFFECT:0 "Unlock [GetScheme('PODenthrall').GetTypeName] [scheme|E].\n#F The character can appear as a target's ideal mate, and with a gesture, beckon him to her side. Successful use of this power indicates that the target is so completely enthralled by the character that he will do anything reasonable to please her. Alternately, the character may activate this power to entrance anyone who lays eyes on her, although this “blanket entrancement” is much less potent.#!"
 TAINT_SUPPRESSION_PERK_EFFECT:0 "#F The fomor can briefly negate the effects of any of his Taints. Suppressed physical deformities heal back to unmarred flesh in seconds; derangements vanish in a burst of perfect clarity, etc.#!"
 TAR_BABY_PERK_EFFECT:0 "Bonus chance to maim an enemy [knights|E] in a war as a [knight|E].\n#F The character's skin or "flesh" is made of a thick, sticky substance like molasses or tar. Anything that comes into forceful contact with the skin sticks to it like a fly on flypaper; slow, deliberate contact such as donning clothes doesn't activate the adhesive qualities.#!"
 THICK_SKINNED_PERK_EFFECT:0 "Bonus chance to maim an enemy [knights|E] in a war as a [knight|E].\n#F The character has an additional outer layer or layers of covering that provides supernatural protection against injury. The style of protection varies with the individual possessed;Drones simply experience an imperceptible hardening of the skin, while gorgons often manifest this Power in a number of different ways, ranging from highly dense flesh to a layer of scales.#!"
 TRANSFORMATION_PERK_EFFECT:0 "Allow shapeshift to several animal forms.\n#F The Kami is capable of limited but flawless shapeshifting.#!"
 TRIATIC_SCENT_PERK_EFFECT:0 "#F #!"
 TRIATIC_SENSE_PERK_EFFECT:0 "#F #!"
 UNIVERSAL_TONGUE_PERK_EFFECT:0 "#F #!"
 UNNATURAL_STRENGTH_PERK_EFFECT:0 "#F #!"
 VEIL_BREACH_PERK_EFFECT:0 "#F #!"
 VOICE_OF_REASON_PERK_EFFECT:0 "#F #!"
 VOICE_OF_THE_WYRMCH_PERK_EFFECT:0 "#F #!"
 WALL_WALKING_PERK_EFFECT:0 "#F #!"
 WEBBING_PERK_EFFECT:0 "#F #!"
 ANIMATE_SELF_PERK_EFFECT:0 "#F Gorgons and Kami bound into inanimate objects such as trees or statues may take this power, which allows them to animate their host body. Without this power, a character with a plant or mineral host is immobile.#!"
 ARMORED_HIDE_PERK_EFFECT:0 "#F The host's skin is obviously changed, granting added resilience against attacks. It may be obviously scaly or heavy, rhino-like hide, or perhaps even glistening with slime that causes attacks to slide away without making heavy contact.#!"
 BALEFIRE_FLUX_PERK_EFFECT:0 "#F Whenever the fomor is exposed to Balefire, the radioactive excretions of the Wyrm, he may undergo a transformation, gaining a new Power.#!"
 BLENDING_PERK_EFFECT:0 "#F The character is able to shift its coloration for purposes of stealth; although it cannot duplicate specific patterns or textures, it can create general patterns sufficient to break up its outline.#!"
 COMPUTER_LINK_PERK_EFFECT:0 "#F [Select_CString( GetScriptedGui('cyberrealm_location').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'The Drone becomes capable of controlling computers by touch alone.', '')]#!"
 CORRUPTED_VISIONS_PERK_EFFECT:0 "#F "I had to do it! God told me to!" By utilizing this gift of corruption, a fomor induces hallucinations in some helpless victim. Voices from God, fleeting glimpses of something just out of sight, scoldings, mockery and other paranoiac favorites are only a few of the possibilities. Although this Power works best when the fomor looks normal enough to pass for human, an especially deformed one can use it while hiding. Knowing your victim helps when using Corrupted Visions; a rational person would be suspicious if Jesus suddenly told her to go on a killing spree, while someone who was already disturbed might think it was a perfectly good idea. Of course, a seemingly-rational person could be driven crazy by subtle, well-chosen visions. After that, anything goes...#!"
 DARKSIGHT_PERK_STATS_EFFECT:0 "#F The character is capable of seeing in the dark just as well as he might in daylight.#!"
 DECEPTION_PERK_EFFECT:0 "[GetTrait('diablerist').GetName( GetPlayer )] trait will be auto-hided upon exposure\nAllow friendly interactions with gaian werewolf.\n#F The fomor can hide the spiritual evidence of his Wyrm taint from others. The Gift: Sense Wyrm will nor detect the fomor as Wyrm-tainted. The fomor can also use this Power on others, to cover their stain. For instance, the fomor can hide the evidence of a vampire's diablerie or even change a normal Garou's aura so that she appears to be Wyrm-tainted when in fact she is not. Fomori under the influence of this Power are also immune to mummies' Hekau (True Name) spells.#!"
 ECTOPLASMIC_EXTRUSION_PERK_EFFECT:0 "#F The character is able to generate up to four semi-solid tentacles or arms that can stretch out up to five yards, manipulating objects or even striking blows. The limbs may be true ectoplasm, quasi-solid shadow, preternaturally thick mist, or whatever seems suit-able for the character type in question.#!"
 ELEMENTAL_RESISTANCE_PERK_EFFECT:0 "#F The host's resistance to a certain type of energy form is augmented to supernatural degrees. The chosen source can be mundane, such as fire or lightning, or may even come from more mystical sources such as balefire.#!"
 ENHANCED_ATTRIBUTE_PERK_EFFECT:0 "#F The host's natural capabilities are magnified to superhuman levels. This power isn't restricted to Physical Attributes — a Wyld-possessed being might boast Enhanced Wits, while a fomor might well develop unearthly Appearance, the better to lure victims.#!"
 ENHANCEMENT_PERK_EFFECT:0 "#F The fomor can become any living creature's ideal mate, by scanning their target's mind.#!"
 EXOSKELETON_PERK_EFFECT:0 "#F The fomor has a hard cara-pace-like growth all over her body. It is usually very bonelike, with many gnarls, veinlike tubes and odd shapes upon it. Its coloration ranges from a rusty red and dark brown to oily black.#!"
 EXTRA_SPEED_PERK_EFFECT:0 "#F The fomor can outmaneuver a normal human.#!"
 HAND_FROM_BEYOND_PERK_EFFECT:0 "Chance of Being Trapped in the Umbra: #P -5%#!\nMonthly Umbra Exploration Progress: [grace_i]#P +25%#!\n#F The fomor can enter the Umbra and then reach back into the material world to pull others into the spirit world with him. He can pull more than one person as long as all the targets are holding hands.#!"
 IMMUNITY_PERK_EFFECT:0 "#F The fomor can ignore the effects of some kinds of potentially dangerous things.#!"
 NIMBLENESS_PERK_EFFECT:0 "#F The fomor is especially nimble and can easily keep her balance while performing feats which would cause another person to tumble.#!"
 NOXIOUS_BREATH_PERK_EFFECT:0 "Give [GetModifier('noxious_breath_perk_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\n#F The fomor can release poisonous fumes into the air which make those within twenty yards crave cigarettes. The fumes look and smelllike cigarette smoke. In addition, the gas weakens the lung tissue of those who breath it. Repeated exposure to the noxious breath over several weeks or months leads to the development of lung cancer in victims.#!"
 NUMBING_PERK_EFFECT:0 "#F The fomor's body can become completely numb. She feels no pain. However, she is numb to all sensation. She cannot talk properly (her tongue feels permanently anesthetized) and she may cut herself and feel nothing, which may result in infected or gangrenous wounds the fomor is unaware of.#!"
 PROCREATION_PERK_EFFECT:0 "#F The fomor can transmit a Bane through blood and semen-any encounter involving bodily fluids can spread the Bane. The Bane will then attempt to possess the recipient of the fluids. The fomor may only pass on a Bane similar to that which possessed him.#!"
 PROLONGED_LIFE_PERK_EFFECT:0 "#F The fomor's natural lifespan is greatly prolonged. This is not true immortality, since the fomor will die of natural causes eventually (natural death amongst fomori is practically unknown).#!"
 ROAR_OF_THE_WYRM_PERK_EFFECT:0 "#F The fomor is able to strike terror into the hearts of all near her by issuing this guttural scream.#!"
 SAVAGE_GENITALIA_PERK_EFFECT:0 "#F John Bobbit's nightmare; the fomor (regardless of gender) has genitals with some menacing feature Male variations include excessive length (14''+) or hardness, thorns, sandpaper texture or curved barbs; female versions are infamous for teeth, ripping suction and internal meat grinders. This is obviously no good in combat, but devastating in bed.#!"
 SENSE_THE_UNNATURAL_PERK_EFFECT:0 "#F Similar to the Garou Gift of the same name, this Power allows the fomor to smell any supernatural being present, such as vampires, werewolves, mages, wraiths and other spirits.#!"
 SKITTERSIGHT_PERK_EFFECT:0 "#F This weird Power allows the fomor to pull out her eyes, twist the optic nerves into feet, and send the eyes scurrying down hallways and around corners in order to see things normally obscured. She'll have to be careful --if the eyes get squashed, she'll be forever blinded.#!"
 SLITHER_SKIN_PERK_EFFECT:0 "#F The skin of the fomor is a weapon and a useful helper. The fomor can shed her skin, giving it certain simple instructions (no more than fivewords). The skin detaches at the rectum and peels off over the fomor's head. It can walk, grab things or attack.#!"
 SLOBBER_SNOT_PERK_EFFECT:0 "#F The fomor's skin is covered with small warts which excrete an extremely slick and runny slime. This slime renders the fomor's body virtually frictionless, making it almost impossible for opponents to grasp the fomor. The slimy gel also helps the fomor to squeeze through tight spaces. Slobber Snot dissolves almost instantly in direct sun light.#!"
 STOMACH_PUMPER_PERK_EFFECT:0 "#F The fomor is able to vomit forth all he has recently eaten covered in acidic slimy stomach juices.#!"
 TOXIC_SECRETIONS_PERK_EFFECT:0 "#F This Power turns the fomor's bodily fluids into toxic waste.#!"
 
