 ANIMAL_CONTROL_PERK_EFFECT:0 "As a [character_interaction|E], allows you to directly gain a pet.\nAs a [character_interaction|E], allows you to call your pet to war.\nCan recruit several kind of animals as [men_at_arms|E].\n#F Animal Control gives the user the ability to summon and control animals who are within range at the time the Power is used.#!"
 AURA_OF_TRANQUILITY_PERK_EFFECT:0 "Give [GetModifier('aura_of_tranquility_perk_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\n#F The character radiates an aura of either peacefulness (in the case of Kami) or harmony (in the case of Drones) that calms anyone within the area. #!"
 BERSEKER_PERK_EFFECT:0 "Can now do the berserker attack in wars as a [knight|E].\nRage recovery chance: #P +100%#!\n#F The host is infused with Rage just like a werewolf's, with all the attendant advantages and disadvantages.#!"
 BESTIAL_MUTATION_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_bestial_mutation_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The host body is no longer recognizable as human or animal; it has distended and warped into a rough parody of its former shape, wholly unable to pass as anything other than a supernatural monster.#!"
 BULKY_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_giant_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character's host body is unusually large and solid, offering an extra measure of durability.#!"
 BODY_EXPANSION_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_body_expansion_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The character is capable of increasing her size up to three times her normal height for a short period of time.#!"
 BRAIN_EATING_PERK_EFFECT:0 "As a [character_interaction|E], allows you to absorb a prisoner's intelligent trait to gain lifestyle xp.\n#F The fomor can absorb a target's mental faculties with a touch, and use them to learn.#!"
 CHAOS_ENGINE_PERK_EFFECT:0 "Give enemy commanders [GetModifier('chaos_engine_perk_modifier').GetNameWithTooltip] modifier when in war as a commander.\n#F A gorgon with this ability is a walking mouthpiece for chaos, pure and simple. His very presence brings disorder and change to the objects and events at work around him.#!"
 STASIS_ENGINE_PERK_EFFECT:0 "Give enemy commanders [GetModifier('stasis_engine_perk_modifier').GetNameWithTooltip] modifier when in war as a commander.\n#F Axes re-align, objects secure in place, and things that seem out of synch are brought into harmony with their environs.#!"
 COMMAND_THE_EARTH_PERK_EFFECT:0 "As a [character_interaction|E], allows you to unleash hostile weather effects over enemy realms.\n#F The character is able to compel the very earth to obey it, sculpting new formations, sucking down enemies into morasses of quicksand, and so on.#!"
 CURSE_OF_GAIA_PERK_EFFECT:0 "As a [character_interaction|E], allows you to give enemy [GetModifier( 'mild_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'moderate_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L] or  [GetModifier( 'very_severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L].\n#F The Kami may levy the curse of Gaia Herself against an offender, punishing those who disrupt Her will or the balance of the natural world. Minor curses may manifest as runs of bad luck, bouts of depression or embarrassing physical conditions (such as hair loss or extreme stench); major curses might turn an offender to stone, inflict him with a wasting disease or even compel the earth to swallow him up.#!"
 CYBERSENSES_PERK_EFFECT:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F [Select_CString( GetScriptedGui('cyberrealm_location').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'Allows the user to replace his own senses with that of a machine — radar, infrared scanning, or the like.', '')]#!"
 CYBERSENSES_PERK_BONUS_VALUE:1 "[GetPerk('drone_cybersenses_perk').GetName(GetPlayer)]"
 DEVOUR_PERK_EFFECT:0 "Bonus to cause a brutal maul to enemy [knights|E] in war as a [knight|E]."
 DISPERSION_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_swarm_modifier' ).GetNameWithTooltip|L] shapeshift option."
 ELECTRICAL_FIELD_PERK_EFFECT:0 "Bonus to a cause brutal maul to enemy [knights|E] in war as a [knight|E]."
 ENCHANTING_VOICE_PERK_EFFECT:0 "Give enemy commanders [GetModifier('enchanting_voice_perk_modifier').GetNameWithTooltip] modifier when in war as a commander."
