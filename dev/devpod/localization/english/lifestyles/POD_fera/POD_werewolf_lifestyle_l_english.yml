l_english:




####Breed Gifts####

#Homid
 persuasion_perk_name: "Persuasion"
 PERSUASION_PERK_EFFECT: "#flavor This Gift allows a homid to become more persuasive when dealing with others; his statements and arguments are imbued with meaning or credibility.#!"
 apecrafts_blessing_perk_name: "Apecraft's Blessing"
 APECRAFTS_BLESSING_PERK_EFFECT: "#flavor Though many of Gaia's children use tools, none have mastered them so thoroughly as humanity. The homid focuses this mastery into the tools she uses, causing their spirits to awaken and lend her aid.#!"
 divide_perk_name: "Divide"
 DIVIDE_PERK_EFFECT: "[character_interaction|E]: Give a negative vassal opinion modifier.\n#flavor This Gift raises up hatred and suspicion among the Garou's enemies.#!"
 staredown_perk_name: "Staredown"
 STAREDOWN_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_staredown')]\n#flavor $glossary_rage$ burns in a werewolf's eyes, striking fear into the hears of mortals and animals, causing them to flee for their lives.#!"
 reshape_object_perk_name: "Reshape Object"
 RESHAPE_OBJECT_PERK_EFFECT: "$unlock_forging_node$ Add a modifier depending on Artifact type and [GetModifier('artifact_minor_monthly_prestige_mult_2_modifier').GetNameWithTooltip]\n#flavor The Garou can shape once-living material into a variety of objects. Trees may become shelter, buck antlers become spears, animal hides become armor and flowers become perfumes.#!"
 weave_of_steel_perk_name: "Weave of Steel"
 WEAVE_OF_STEEL_PERK_EFFECT: "#flavor The homid can mystically reinforce any manmade structure or material, giving planks the strength of steel and steel the toughness of diamond.#!"
 body_shift_perk_name: "Body Shift"
 BODY_SHIFT_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_fang_rush')]\n#flavor Garou raised in the shifting maze of human society are well-prepared for the endless adaptations Gaia demands of her protectors.#!"
 false_comfort_perk_name: "False Comfort"
 FALSE_COMFORT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_false_comfort')]\nInflict enemy [rulers|E] with [GetModifier('false_comfort_modifier').GetNameWithTooltip] when starting a [war|E] as the primary attacker or defender.\n#flavor Humanity has done much to surround itself with comfort and safety. A Garou using this Gift does not shred armor or smash through doors, he simply ignores them entirely. Safety is an illusion.#!"
 false_comfort_modifier: "False Comfort"


#Lupus
 cousins_coat_perk_name: "Cousin's Coat"
 COUSINS_COAT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_cousins_coat')]\n#flavor Garou with this Gift can blend in with their natural surroundings easier than others of their kind.#!"
 hares_leap_perk_name: "Hare's Leap"
 HARES_LEAP_PERK_EFFECT: "#flavor The werewolf can leap truly incredible distances by invoking this Gift.#!"
 sense_the_unnatural_perk_name: "Sense the Unnatural"
 SENSE_THE_UNNATURAL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_bloodhound')]\n$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor The werewolf can pick out any unnatural presence, gauging its approximate strength and type.#!"
 devils_child_perk_name: "Devil's Child"
 DEVILS_CHILD_PERK_EFFECT: "#flavor Wolves are often seen as the offspring of the Devil himself, and while they don't fully understand that implication, the lupus are happy to capitalize on the fear it inspires. The Garou lets out a fierce snarl that terrifies opponents and cows them into submission. #!"
 gift_of_the_porcupine_perk_name: "Gift of the Porcupine"
 GIFT_OF_THE_PORCUPINE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_gift_of_the_porcupine')]\n#flavor This Gift allows a Garou's fur to become bristly and sharp like the quills of a porcupine, and you never mess with porcupine.#!"
 lord_of_the_wilds_perk_name: "Lord of the Wilds"
 LORD_OF_THE_WILDS_PERK_EFFECT: "#flavor The Garou may not only communicate with animals, but attract and command them.#!"
 umbral_body_perk_name: "Umbral Body"
 UMBRAL_BODY_PERK_EFFECT: "Can shapeshift and maintain shapeshifted forms while staying in the [umbra|E].\n#flavor With this Gift, the user can partially reach into the Umbra, sending certain body parts into it while maintaining others in the physical world.#!"
 elemental_gift_perk_name: "Elemental Gift"
 ELEMENTAL_GIFT_PERK_EFFECT: "Unlock Elemental [men_at_arms|E].\n#flavor The werewolf calls upon the primal force of Gaia Herself, thereby commanding the spirits of the elements to rise up, undulate forward and even engulf foes.#!"




####Lunar Auspice####
 lunar_auspicegifts_lifestyle_name: "Lunar Gifts"
 lunar_auspicegifts_lifestyle_desc: "Focus on the gifts that come with your Lunar Auspice."
 lunar_auspicegifts_lifestyle_highlight_desc: "Because of your $POD_energy_gnosis$, you gain #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#! more [experience|E] in this Lifestyle."
 monthly_lunar_auspicegifts_lifestyle_xp_gain_mult: "Monthly Lunar Auspice Gifts [lifestyle|E] [experience|E]"
 lunar_auspicegifts_focus: "Lunar Auspice Gifts Focus"
 lunar_auspicegifts_focus_modifier: "[GetFocus('lunar_auspicegifts_focus').GetName]"
 lunar_auspicegifts_focus_desc: "The five moon phases Gifts."
 lunar_auspicegifts_focus_effect_desc: "Focusing on Lunar Auspice Gifts grants:"
 lunar_auspicegifts_ahroun_visible: "Ahroun"
 lunar_auspicegifts_galliard_visible: "Galliard"
 lunar_auspicegifts_ragabash_visible: "Ragabash"
 lunar_auspicegifts_philodox_visible: "Philodox"
 lunar_auspicegifts_theurge_visible: "Theurge"
 NEEDS_AHROUN_TEXT: "@warning_icon!#X Requires the [GetTrait('ahroun').GetName( GetPlayer )] [traits|E] to buy perks in this tree.#!"
 NEEDS_GALLIARD_TEXT: "@warning_icon!#X Requires the [GetTrait('galliard').GetName( GetPlayer )] [traits|E] to buy perks in this tree.#!"
 NEEDS_PHILODOX_TEXT: "@warning_icon!#X Requires the [GetTrait('philodox').GetName( GetPlayer )] [traits|E] to buy perks in this tree.#!"
 NEEDS_RAGABASH_TEXT: "@warning_icon!#X Requires the [GetTrait('ragabash').GetName( GetPlayer )] [traits|E] to buy perks in this tree.#!"
 NEEDS_THEURGE_TEXT: "@warning_icon!#X Requires the [GetTrait('theurge').GetName( GetPlayer )] [traits|E] to buy perks in this tree.#!"
 AUSPICE_ENDPERK_REQUIREMENT: "@warning_icon#!#X This perk can only be obtained by finishing your Auspice's [story_cycle|E]."


#Ahroun
 rhythm_of_war_perk_name: "Rhythm of War"
 RHYTHM_OF_WAR_PERK_EFFECT: "#clickable [character_interaction|E]: Challenge another character to a [pod_combat_encounter_with_icon|E].#!\n#flavor So long as the Ahroun keeps fighting to the rhythm of his inner war drum, he can't be stopped. Blows that would fell a lesser combatant are as mere wasp stings to the Garou's mightiest warriors.#!"
 steadfast_perk_name: "Steadfast"
 STEADFAST_PERK_EFFECT: "#flavor No matter the task, the Ahroun does not tire. This Gift allows the Garou to work, run, or fight far beyond her normal limits.#!"
 iron_claws_perk_name: "Iron Claws"
 IRON_CLAWS_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fera_beast_strike')]\n#flavor The Garou's claws become sharp iron. Allowing him to easily rend both flesh and armour alike.#!"
 true_fear_perk_name: "True Fear"
 TRUE_FEAR_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_true_fear')]\n#flavor The Ahroun can overwhelm a particular foe with the magnitude of his power, scaring the foe into inaction.#!"
 snarl_of_challenge_perk_name: "Snarl of Challenge"
 SNARL_OF_CHALLENGE_PERK_EFFECT: "#flavor With a fearsome snarl, the Ahroun can compel an enemy to fight him until the ground runs red with blood.#!"
 primal_anger_perk_name: "Primal Anger"
 PRIMAL_ANGER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_primal_anger')]\nRemove all costs of shapeshifting into [GetModifier('POD_werewolf_form_crinos_modifier').GetNameWithTooltip]\n#flavor The Ahroun allows his Rage to consume his own lifeforce to fuel further destruction.#!"
 strength_of_will_perk_name: "Strength of Will"
 STRENGTH_OF_WILL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_face_the_apocalypse')]\n#flavor A Garou with this Gift is a pillar of indomitable will. He can share this terrifying single-mindedness with others, as well, leading them even to certain doom without a moment of fear.#!"
 shake_the_earth_perk_name: "Shake the Earth"
 SHAKE_THE_EARTH_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_shake_the_earth')]\n#flavor The force of the Ahroun's Rage splits the ground before him, causing great damage to his surroundings.#!"
 lunas_armor_perk_name: "$glossary_luna$'s Armor"
 LUNAS_ARMOR_PERK_EFFECT: "Gain immunity to [fire_damage_short_with_icon|E].\n#flavor The Ahroun is bathed in Luna's pure moonlight, shielding him from the flames of his foes.#!"
 full_moons_light_perk_name: "Full Moon's Light"
 FULL_MOONS_LIGHT_PERK_EFFECT: "#flavor The full moon is $glossary_luna$'s warrior phase, when she assumes the visage of Diana the Huntress, and searches out her enemies. The Ahroun can call upon her determination in finding her foes, illuminating any who oppose her.#!"
 unstoppable_warrior_perk_name: "Unstoppable Warrior"
 UNSTOPPABLE_WARRIOR_PERK_EFFECT: "[POD_health_track|E] boxes: #P +1#!\nHeal #V 2#![POD_aggravated_box|E] after winning a [pod_combat_encounter|E]\n#flavor The werewolf has become the prime representation of his Auspice. No wounds may stop him, only death.#!"
 UNSTOPPABLE_WARRIOR_REQUIREMENT: "@warning_icon!#X You need to finish a quest from the Warrior Incarna (station an explorer in any realm of umbra to find a clue about the location and start an [umbra_expedition|E] to reach them and then receive a quest) to unlock this perk.#!"




#Galliard
 primal_song_perk_name: "Primal Song"
 PRIMAL_SONG_PERK_EFFECT: "[character_interaction|E]: Weave #clickable Song Verses#! together to create various effects.\n#clickable Song Verse: [GetModifier('galliard_song_development_decline_modifier').GetNameWithTooltip]#!\n#clickable Song Verse: Summon a random Spirit#!\n#flavor The Galliard weaves together powerful songs with his Gnosis. A seamingly normal song can have the most unpredictable effects.#!"
 galliard_song_development_decline_modifier: "Primal Return"
 song_of_valor_perk_name: "Song of Valor"
 SONG_OF_VALOR_PERK_EFFECT: "#clickable Song Verse: Heal 2 [POD_aggravated_box|E]#!\n#clickable Song Verse: [GetModifier('galliard_song_prowess_modifier').GetNameWithTooltip]#!\n[PODUnlocksCombatMove('POD_combat_move_werewolf_song_of_valor')]\n#flavor Sing of the heroic deeds of ancient Garou to bolster the listeners. The desire for heroism drives them ever onward.#!"
 galliard_song_prowess_modifier: "Valorous Strength"
 canine_call_perk_name: "Canine Call"
 CANINE_CALL_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_canine_call')]\n[character_interaction|E]: Gain a [GetModifier('dog_story_modifier').GetNameWithTooltip]\n#flavor Ever since the Impergium and the War of Rage, everything else on the planet has lived in awe and terror of the sound of wolves howling. Pitching her voice just so, the Galliard produces a call that only canines can hear.#!"
 song_of_rage_perk_name: "Song of Rage"
 SONG_OF_RAGE_PERK_EFFECT: "#clickable Song Verse: [GetModifier('galliard_song_irrational_modifier').GetNameWithTooltip]#!\n#clickable Song Verse: [GetModifier('galliard_song_countermeasure_modifier').GetNameWithTooltip]#!\n#flavor The werewolf's cry lets out the animal in the target's heart, whipping him into a frenzy.#!"
 galliard_song_irrational_modifier: "Raging Warlord"
 galliard_song_irrational_modifier_desc: "This character is so angry, they have lost the ability to act rationally."
 galliard_song_irrational_storyteller_modifier: "Storied Raging Warlord"
 galliard_song_irrational_storyteller_modifier_desc: "$galliard_song_irrational_modifier_desc$"
 galliard_song_countermeasure_modifier: "Blinding Rage"
 galliard_song_countermeasure_modifier_desc: "So much rage blinds them from hidden dangers. [scheme_countermeasures|E] are no longer effective."
 galliard_song_countermeasure_storyteller_modifier: "Storied Blinding Rage"
 galliard_song_countermeasure_storyteller_modifier_desc: "$galliard_song_countermeasure_modifier_desc$"
 words_like_wind_perk_name: "Words like Wind"
 WORDS_LIKE_WIND_PERK_EFFECT: "#clickable Songs ignore diplomatic_range#!\n#flavor Music, poetry and catchphrases are contagious, sweeping across cultures and communities like a breeze through trees. The Galliard knows how to take advantage of this habit of social creatures, sending her messages across the world one ear at a time.#!"
 song_of_the_siren_perk_name: "Song of the Siren"
 SONG_OF_THE_SIREN_PERK_EFFECT: "#clickable Song Verse: Increase [opinion|E] towards the Galliard#!\n#clickable Song Verse: Gain a [hook|E]#!\n#flavor The sound of the Garou's voice can entrance anyone who hears it. Typically, the Garou sings or howls while using this Gift, although some have taken to poetry recital.#!"
 galliard_song_of_the_siren_opinion: "Siren's Temptation"
 song_of_the_siren_weak_hook: "Siren's Hold"
 song_of_the_siren_strong_hook: "Siren's Control"
 howl_of_assembly_perk_name: "Howl of Assembly"
 HOWL_OF_ASSEMBLY_PERK_EFFECT: "Invite to [court|E] Acceptance for $POD_splat_werewolf_plural$: #P +10#!\n#flavor The Galliard's howl can be heard over great distances, calling the Garou to battle.#!"
 HOWL_OF_ASSEMBLY_INVITE: "[GetPerk('howl_of_assembly_perk').GetName(GetPlayer)]: $VALUE|=+0$"
 song_of_mockery_perk_name: "Song of Mockery"
 SONG_OF_MOCKERY_PERK_EFFECT: "#clickable Song Verse: [GetModifier('galliard_song_vassal_opinion_modifier').GetNameWithTooltip]#!\n#clickable Song Verse: Transfer [prestige|E] to the Galliard#!\n[PODUnlocksCombatMove('POD_combat_move_werewolf_song_of_mockery')]\n#flavor These songs are intended to mock the Galliard's enemies. Regretfully, most of them are too uncultured to realize this.#!"
 galliard_song_vassal_opinion_modifier: "Mocking Ode"
 song_of_serenity_perk_name: "Song of Serenity"
 SONG_OF_SERENITY_PERK_EFFECT: "#clickable Song Verse: Reduce [stress|E]#!\n#clickable Song Verse: [GetModifier('galliard_song_no_war_modifier').GetNameWithTooltip] and stop active offensive wars#!\n#flavor The most soothing of sounds can calm the even the most violent hearts.#!"
 galliard_song_no_war_modifier: "Total Serenity"
 galliard_song_no_war_modifier_desc: "Their mind is so calm, they cannot even consider starting any [wars|E]"
 galliard_song_no_war_storyteller_modifier: "Storied Total Serenity"
 galliard_song_no_war_storyteller_modifier_desc: "$galliard_song_no_war_modifier_desc$"
 song_of_the_storm_perk_name: "Song of the Storm"
 SONG_OF_THE_STORM_PERK_EFFECT: "#clickable Song Verse: Inflict [lightning_damage_short_with_icon|E]#!\n#clickable Song Verse: [GetModifier('galliard_song_speed_modifier').GetNameWithTooltip]#!\n#flavor The Galliard can tap the very fabric of the Storm Umbra with her song, drawing forth a chaotic flurry of Wyld-energies to work a change on the environment or those caught within it.#!"
 galliard_song_speed_modifier: "Stormwalk"
 storyteller_perk_name: "Storyteller"
 STORYTELLER_PERK_EFFECT: "#clickable Song Verses now trigger twice or gain additional effects#!\n#flavor Rather than simply telling and retelling the stories of old, or even waiting until the events of the day become the new stories, the Galliard can change the events of the ongoing drama unfolding around her. She may add new "characters," alter chains of events, and even change the motivations of the major participants.#!"



#Philodox
 command_the_gathering_perk_name: "Command the Gathering"
 COMMAND_THE_GATHERING_PERK_EFFECT: "#flavor The Philodox draws all eyes to herself with a great exclamation, a clap of her hands, the striking of klaive to shield, or some other such gesture. Until she has had her say, none may depart or interrupt her. #!"
 aura_of_the_just_perk_name: "Aura of the Just"
 AURA_OF_THE_JUST_PERK_EFFECT: "#flavor When the Gift user commits a just act, everyone around him knows it merely by gazing at him. The Aura of the Just proclaims to one and all that this Garou is in the right. Where circumstances or perceptions might cloud the judgment of witnesses, the Gift clears all doubts.#!"
 building_a_legend_perk_name: "Building a Legend"
 BUILDING_A_LEGEND_PERK_EFFECT: "#clickable Pack Training:#! All $POD_splat_garou$ gain [trait_level_track_xp|E] in their Auspices.\n#flavor The Philodox are the natural leaders of the Garou in times of peace, bolstered by the faith and trust given to them by their charges.#!"
 truth_of_gaia_perk_name: "Truth of Gaia"
 TRUTH_OF_GAIA_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$\n[espionage|E] Progress Speed: #P +25%#!\n#flavor As judges of the $glossary_werewolf_litany$, Philodox have the ability to sense whether others have spoken truth or falsehood.#!"
 TRUTH_OF_GAIA_REASON: "$truth_of_gaia_perk_name$: $VALUE|+=0$"
 bonds_that_tie_us_perk_name: "Bonds that Tie Us"
 BONDS_THAT_TIE_US_PERK_EFFECT: "#clickable Pack Training:#! Every member gains a [modifier|E] for every unique Lunar Auspice in the Pack.\nPack members can no longer [rival|E] eachother.\n#flavor The Philodox is mediator and judge, but is also a leader. This Gift assists a Philodox with such matters by revealing any emotions and opinions that exist between others.#!"
 philodox_pack_auspice_ahroun_modifier: "Ahroun's Might"
 philodox_pack_auspice_galliard_modifier: "Galliard's Song"
 philodox_pack_auspice_philodox_modifier: "Philodox's Will"
 philodox_pack_auspice_ragabash_modifier: "Ragabash's Shadow"
 philodox_pack_auspice_theurge_modifier: "Theurge's Wisdom"
 curse_the_betrayer_perk_name: "Curse the Betrayer"
 CURSE_THE_BETRAYER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_curse_the_betrayer')]\n[character_interaction|E]: Give [GetModifier('curse_the_betrayer_modifier').GetNameWithTooltip] to a $glossary_fera$ of another [religious_family|E].\n[imprison|E] Chance: #P +10%#!\n#flavor Anyone who betrays the Philodox pays for his dishonesty. Judgement cannot be escaped.#!"
 CURSE_THE_BETRAYER_REASON: "$curse_the_betrayer_perk_name$: $VALUE|+=0$"
 curse_the_betrayer_modifier: "Curse the Betrayer"
 rally_to_the_cause_perk_name: "Rally to the Cause"
 RALLY_TO_THE_CAUSE_PERK_EFFECT: "#clickable Pack Training:#! All members lose [stress|E].\nGive [GetModifier('rally_to_the_cause_modifier').GetNameWithTooltip] to friendly $glossary_fera$ [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to yourself during [single_combat_duel_plural|E].\n#flavor At times a Philodox needs to rally Garou to achieve a goal. This Gift helps a Philodox inspire other Garou to follow his cause, despite tribal or personal differences.#!"
 rally_to_the_cause_modifier: "Philodox's Command"
 balance_man_and_beast_perk_name: "Balance Man and Beast"
 BALANCE_MAN_AND_BEAST_PERK_EFFECT: "Remove all costs of shapeshifting into [GetModifier('POD_werewolf_form_hispo_modifier').GetNameWithTooltip]\n#flavor A Philodox needs to keep a tight grip on his bestial side for fear of losing control and, perhaps worse still, allowing his passions to control his judgment. However, a Garou cannot deny his animal nature; rationality cannot reign alone.#!"
 honour_bound_perk_name: "Honour Bound"
 HONOUR_BOUND_PERK_EFFECT: "An available member of your [GetPlayer.Custom('PODCoterie')] will join you in [pod_combat_encounters_with_icon|E]\n#clickable Pack Training:#! All $glossary_fera$ gain [prestige|E] and [legitimacy|E] scaling with their Rank.\n#flavor Many Garou packs share strong bonds with one another. This Gift amplifies that sense of honor and respect.#!"
 wisdom_of_the_ancient_ways_perk_name: "Wisdom of the Ancient Ways"
 WISDOM_OF_THE_ANCIENT_WAYS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_wisdom_of_the_ancient_ways')]\n#clickable Pack Training:#! All members gain [GetModifier('philodox_ancient_ways_modifier').GetNameWithTooltip] and regain 2$POD_energy_gnosis$ if you have a [pack_totem|E].\n#flavor All Garou have an innate connection to their totem spirits, a form of racial unconsciousness which can be accessed through intense meditation. The Garou can tap deeply into these deep memories and remember ancient facts and lore which might be of use today.#!"
 philodox_ancient_ways_modifier: "Ancient Ways"
 break_the_bonds_perk_name: "Break the Bonds"
 BREAK_THE_BONDS_PERK_EFFECT: "[character_interaction|E]: Free an [imprisoned|E] character.\nGain Strong Mental Defenses.\nCannot be [blackmailed|E].\n#flavor This Gift shatters all bonds, whether physical or mental, from sturdy iron chains to the slavery of a vampire's bewitched blood.#!"


#Ragabash
 fools_gold_perk_name: "Fool's Gold"
 FOOLS_GOLD_PERK_EFFECT: "#clickable Marks of Luna can now appear#!\n#flavor What is worthless to one, is priceless for others. Luna's favor is for those who seek it.#!"
 open_seal_perk_name: "Open Seal"
 OPEN_SEAL_PERK_EFFECT: "#flavor With this Gift the Garou can open nearly any sort of closed or locked device.#!"
 reynards_lie_perk_name: "Reynard's Lie"
 REYNARDS_LIE_PERK_EFFECT: "#flavor The Ragabash with this Gift can calmly explain that the sky is green or gleefully regale others with the exploits of a lone, heroic Ragabash and have no fear of being called out on the lie.#!"
 taking_the_forgotten_perk_name: "Taking the Forgotten"
 TAKING_THE_FORGOTTEN_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_taking_the_forgotten')]\nRemoves all [artifact_claims|E] from any [artifacts|E] obtained\n#flavor Not only is the Ragabash an accomplished thief, but those from whom she steals often never realize they have been robbed.#!"
 turn_the_moon_perk_name: "Turn the Moon"
 TURN_THE_MOON_PERK_EFFECT: "#clickable Moonlit Marks of Luna can now appear#!\n[schemes|E] using [secrecy_grace|E] begin with an extra 12 months of it\nUnlocks the [buy_artifact_claim_interaction|E]\n#flavor A Garou's power waxes and wanes alongside the moon. But a Ragabash turns the hourglass once more.#!"
 terrain_shift_perk_name: "Terrain Shift"
 TERRAIN_SHIFT_PERK_EFFECT: "#flavor Nature accepts the Ragabash as an ally, and views his pursuers as enemies. Earth and stone move aside to create tunnels or footholds to climb, foliage gathers behind him impassably, and rivers create dry spots for him to cross.#!"
 chimerical_form_perk_name: "Chimerical Form"
 CHIMERICAL_FORM_PERK_EFFECT: "Unlock various animal shapeshift forms.\n#flavor The great tricksters of legends are all masters of changing shape, and the Ragabash who has mastered this Gift is no exception. Using it, he can change his form into that of any animal between the sizes of a tiny finch and a massive walrus. #!"
 mark_of_shame_perk_name: "Mark of Shame"
 MARK_OF_SHAME_PERK_EFFECT: "Whenever you obtain an [artifact|E], its previous owner receives [GetModifier('mark_of_shame_modifier').GetNameWithTooltip]\n#flavor The Ragabash may invoke a terrible curse upon an opponent's body, causing it to weaken or wither, often in retribution for some act. A terrible and frustrating reminder of embarrassment inflicted upon the target.#!"
 mark_of_shame_modifier: "Mark of Shame"
 umbral_dodge_perk_name: "Umbral Dodge"
 UMBRAL_DODGE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_umbral_dodge')]\n#flavor The Ragabash finds that the best way to deal with an enemy is to send him far away, perhaps to a place where he'll learn the folly of his ways. She may tear open a hole in the Gauntlet while dodging an enemy's attack, sending them to the land of spirits.#!"
 madness_season_perk_name: "Madness Season"
 MADNESS_SEASON_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_bloodhound')]\nUnlocks [GetTravelOption('werewolf_ragabash_option').GetName]\n#flavor A fine line often exits between madcap humor and the precipice of insanity. The New Moon's understanding of this boundary enables her to send enemies teetering off the brink into lunacy.#!"
 madness_season_modifier: "Madness Season"
 madness_season_modifier_desc: "This character has been driven to utter madness, making them join [factions|E] without reason."
 MADNESS_SEASON_FACTION_REASON: "[GetModifier('madness_season_modifier').GetNameWithTooltip]: $VALUE|0+=$"
 firebringer_perk_name: "Firebringer"
 FIREBRINGER_PERK_EFFECT: "#clickable Gain a [perk|E] Points matching the owner's [education|E] when obtaining Marks with 75 or more [artifact_power|E]#!\nTargets of your #V Train Gift#! [character_interaction|E] gain an extra [perk|E].\n#flavor The Ragabash performs the ultimate trick, stealing a power and turning it into his own. Moreover, the power can be taught to others, as if the New Moon was a spirit teacher.#!"


#Theurge
 airt_perception_perk_name: "Airt Perception"
 AIRT_PERCEPTION_PERK_EFFECT: "#clickable[character_interaction|E]: Bind a [spirit_companion|E] into a province with a Caern#!\n#flavor A Theurge can roughly identify a spirit by its airt, the trail left in the wake of a spirit's passing. This works essentially like tracking in the corporeal world, and is no more informative.#!"
 sense_chiminage_perk_name: "Sense Chiminage"
 SENSE_CHIMINAGE_PERK_EFFECT: "#flavor Theurges with this Gift can learn where the balance of chiminage lies with any spiritually aware being with a glance.#!"
 eyes_of_the_lynx_perk_name: "Eyes of the Lynx"
 EYES_OF_THE_LYNX_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor Lynx-spirits, embodying the Umbral ideal of their earthly counterparts' powerful eyesight, can see even beyond physical obstacles. Theurges who learn this Gift can peer through walls or beneath the earth.#!"
 spirit_skin_perk_name: "Spirit Skin"
 SPIRIT_SKIN_PERK_EFFECT: "Can shapeshift and maintain shapeshifted forms while staying in the [umbra|E]\n#flavor Theurge disguises herself as a wolf spirit within the Umbra. She still physically looks exactly like her Lupus form, she simply gives the impression of a spirit rather than Garou.#!"
 SPIRIT_SKIN_REASON: "$spirit_skin_perk_name$: $VALUE|+=0$"
 name_the_spirit_perk_name: "Name the Spirit"
 NAME_THE_SPIRIT_PERK_EFFECT: "Can recruit [GetMaA('jagglings').GetName] as [men_at_arms|E].\n#flavor The Garou is able to detect the type and approximate levels of ability of a Spirit. With which he can then call the Spirit to his location.#!"
 placation_perk_name: "Placation"
 PLACATION_PERK_EFFECT: "All your [spirit_companions|E] receive [trait_level_track_xp|E] at the end of #V Spirit Quest#! [journeys|E].\nCan learn #V 2#! additional [language|E] without any penalties.\n#flavor A Theurge with this Gift always knows exactly what kind of sacrifice is necessary to make atonement for an offence against the spirit world or to simply give tribute.#!"
 prophecy_perk_name: "Prophecy"
 PROPHECY_PERK_EFFECT: "Unlocks the Divine the Stars [decision|E].\n#flavor This Gift offers the Theurge true insight into the future. Such visions are sporadic and sometimes enigmatic, but unless a specific effort is made to change what is ahead, they are always accurate.#!"
 healing_the_soul_perk_name: "Healing the Soul"
 HEALING_THE_SOUL_PERK_EFFECT: "#clickable Spirit Binding: Cure all [diseases|E] and reduce [stress|E] of all [courtiers|E]#!\n#clickable Spirit Binding: Binding a Spirit with max Rank will remove your negative [stress|E] [traits|E]#!\n#flavor Through a week-long ordeal of fasting, trance states and spirit communion, the Theurge is able to set the elements of the Trait into perfect balance within souls.#!"
 mold_the_spirit_perk_name: "Mold the Spirit"
 MOLD_THE_SPIRIT_PERK_EFFECT: "#flavor The Garou can change a Spirit's form or purpose. Strangely enough, the Spirit does not mind.#!"
 spirit_vessel_perk_name: "Spirit Vessel"
 SPIRIT_VESSEL_PERK_EFFECT: "#clickable Spirit Binding: Gain [GetModifier('theurge_spirit_vessel_modifier').GetNameWithTooltip] scaling with the Spirit's Rank#!\nUnlock Elemental shapeshift forms.\n#flavor One of the best kept secrets of the Theurge elders is the ability to channel spirit. For a short time, Garou and spirit become one creature with the abilities of both.#!"
 theurge_spirit_vessel_modifier: "Unbound Power"
 SPIRIT_VESSEL_SCALE: "Bound Spirit's Rank"
 invoked_presence_perk_name: "Invoked Presence"
 INVOKED_PRESENCE_PERK_EFFECT: "[character_interaction|E]: Sacrifice a [spirit_companion|E] at max Rank to gain [GetTrait('truefaith').GetName(GetPlayer)]\n#flavor The Theurge can call upon an Incarna or Celestine directly, bringing their focus to ear on the area around him. This does not summon an Avatar; rather, the presence is a mystical permeation of the principle the invoked spirit represents. Such great power however comes with great cost.#!"
