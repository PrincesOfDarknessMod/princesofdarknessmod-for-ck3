 PERMEATE_PERK_EFFECT: "As [character_interaction|E], mimick blood surge of cainites.\n#flavor Move or consentrate blood in body part.#!"
 BLOOD_ATEMI_PERK_EFFECT: "#flavor Move blood in victim's body.#!"
 FLOW_LIKE_BLOOD_PERK_EFFECT: "Can Shapeshift into [GetModifier('POD_shapeshift_form_blood_modifier').GetNameWithTooltip]\n#flavor Become as fluid as blood.#!"
 BLOODLASH_PERK_EFFECT: "#flavor Create a lethal tendril of blood.#!"
 BLOOD_AWAKENING_PERK_EFFECT: "Unlock [GetMaA('POD_awaken_blood').GetName]\n#flavor Awake or freeze Yang Spirit or Wraiths.#!"
 BLOOD_BLADE_PERK_EFFECT: "Unlock Enhance [crafting_node|E], giving 2 [prowess|E] at cost of 30 [static_stress|E]\n#flavor Create a weapon made of blood that causes aggravated damage.#!"
 BLOOD_OF_THE_SCORPION_PERK_EFFECT: "#flavor Poison target with Yin blood toxin.#!"
 CORRUPTION_OF_THE_BLOOD_PERK_EFFECT: "As [character_interaction|E], give target [GetModifier('thin_blood_perk_modifier').GetNameWithTooltip] for 20 years.\n#flavor Causes victim's blood to become toxic.#!"
 BLOOD_LEECHING_PERK_EFFECT: "Improve [GetPerk('corruption_of_the_blood_perk').GetName(GetPlayer)] by also giving target [GetModifier('blood_leeching_modifier').GetNameWithTooltip] for 10 years.\n#flavor Victim's blood burst from pores into the user.#!"
 
 #Shintai: Ghost-Flame
 goblin_face_perk_name: "Goblin Face"
 goblin_spark_perk_name: "Goblin Spark"
 goblin_shapes_perk_name: "Goblin Shapes"
 goblin_scorch_perk_name: "Goblin Scorch"
 goblin_lantern_perk_name: "Goblin Lantern"
 goblin_sword_perk_name: "Goblin Sword"
 goblin_portal_perk_name: "Goblin Portal"
 goblin_call_perk_name: "Goblin Call"
 mantle_of_the_flame_emperor_perk_name: "Mantle of the Flame Emperor"

 GOBLIN_FACE_PERK_EFFECT: "#flavor The orifices in the face of the Kuei-jin begin to blaze with heat, allowing him to see in pitch darkness and inflicting greater damage with his bite.#!"
 GOBLIN_SPARK_PERK_EFFECT: "#flavor The Kuei-jin summons a tiny ball of spirit fire that cannot actually harm anything , but emits a soft light and can be twisted into various shapes according to its creator's wishes.#!"
 GOBLIN_SHAPES_PERK_EFFECT: "#flavor The Kuei-jin can twist flames into various forms according to his desires.#!"
 GOBLIN_SCORCH_PERK_EFFECT: "#flavor The Kuei-jin exhales a gout of spirit flames.#!"
 GOBLIN_LANTERN_PERK_EFFECT: "#flavor The Kuei-jin temporarily ignites his form, even allowing him to turn into a glowing orb of fire.#!"
 GOBLIN_SWORD_PERK_EFFECT: "Can hurt spirits.\n#flavor The Kuei-jin manifests a fiery sword within his hand that can harm both physical as well as spiritual objects.#!"
 GOBLIN_PORTAL_PERK_EFFECT: "#flavor The Kuei-jin can use fire as a gateway to teleport to any other flame within a certain radius.#!"
 GOBLIN_CALL_PERK_EFFECT: "As [character_interaction|E], Summon $POD_splat_wraith$ or $POD_splat_spirit$ to [court|E]\n#flavor The Kuei-jin calls spirits of fire from either the Yin or the Yang Worlds to do his biding.#!"
 MANTLE_OF_THE_FLAME_EMPEROR_PERK_EFFECT: "As [character_interaction|E], wound, maim or even kill material target.\n#flavor With a brief command, the Kuei-jin can cause another person to burn from the inside out by consuming his internal chi.#!"
 
 #Shintai: Jade
 stand_upon_the_dragons_back_perk_name: "Stand Upon the Dragon's Back"
 tread_the_thrashing_dragons_tail_perk_name: "Tread the Thrashing Dragon's Tail"
 placate_the_earth_dragon_perk_name: "Placate the Earth Dragon"
 harnessing_the_dragons_breath_perk_name: "Harnessing the Dragon's Breath"
 jade_servant_of_the_august_personage_perk_name: "Jade Servant of the August Personage"
 stone_fish_perk_name: "Stone Fish"
 blade_of_stone_perk_name: "Blade of Stone"
 taste_of_jade_perk_name: "Taste of Jade"
 augment_perk_name: "Augment"

 STAND_UPON_THE_DRAGONS_BACK_PERK_EFFECT: "#flavor The Kuei-jin first learns to channel Chi from the Earth's natural flows into his body, and vice versa, rooting himself to the Earth.#!"
 TREAD_THE_THRASHING_DRAGONS_TAIL_PERK_EFFECT: "#flavor By polarizing her Chi in line with that of her surroundings, the Kuei-jin makes herself preternaturally deft and light. She may walk safely and steadily along the narrowest of ledges, the most unstable ground, and even the surface of lakes or oceans. She may also jump long distances.#!"
 PLACATE_THE_EARTH_DRAGON_PERK_EFFECT: "#flavor By gently singing to the spirits of earth, stone, and wood, the Kuei-jin may cast himself into their embrace. He may sink into the protective earth, or he may walk through a wall or other impediment.#!"
 HARNESSING_THE_DRAGONS_BREATH_PERK_EFFECT: "#flavor The Kuei-jin, by attuning his body to local streams of Chi, may actually fly along “updrafts” of energy. While in flight, the Kuei-jin may hold objects or even wield weapons, but performing complicated maneuvers is difficult.#!"
 JADE_SERVANT_OF_THE_AUGUST_PERSONAGE_PERK_EFFECT: "Unlock 5 Elemental Shapeshift Options.\n#flavor The ultimate attuning of Chi to surroundings, this power draws upon the Five Element theory as well as great mastery of Chi. The Kuei-jin may channel spiritual energies of the classic Five Elements — Water, Metal, Earth, Wood, and Fire — through his form, thus gaining the properties of the element in the process. In so doing, the Kuei-jin's skin transforms, becoming hard and slick, as if the vampire were covered in liquid jade. The Kuei-jin who attain this level or Jade Shintai often decorate their havens with artworks formed from the Five Elements in question, so that they might have access to them in times of trouble.#!"
 STONE_FISH_PERK_EFFECT: "#flavor At this level of power, a Jade Shintai practitioner learns to become one with the earth — literally. He can sink into it as effortlessly as a man walks into a pool of water. What's more, he can actually “swim” through the soil itself, which provides an easy way to escape from — or ambush — attackers.#!"
 BLADE_OF_STONE_PERK_EFFECT: "Unlock Forge [crafting_node|E], giving 2 [prowess|E] and increasing max durability by 25, at cost of 25 [static_stress|E]\n#flavor This power is used to create weapons of stone — not just blades, but any sort of melee weapon.#!"
 TASTE_OF_JADE_PERK_EFFECT: "Improve [GetPerk('blade_of_stone_perk').GetName(GetPlayer)] by increasing [prowess|E] gain to 3 and durability to 50.\n#flavor A wangyu with this power may attempt to attune a piece of ordinary jade to Chi energies, turning it into a piece of true jade for a time.#!"
 AUGMENT_PERK_EFFECT: "Each month lose 10 [stress|E]\n#flavor The ultimate power of the wangyu is not only being able to attune himself to the ambient Chi in an area, but actually to improve it and increase its power.#!"
 
 #Chi arts: Yin prana
 shrouded_moon_perk_name: "Shrouded Moon"
 yin_mantle_perk_name: "Yin Mantle"
 bone_dance_perk_name: "Bone Dance"
 eightfold_yin_mantle_perk_name: "Eightfold Yin Mantle"
 semblance_of_the_ebon_dragon_perk_name: "Semblance of the Ebon Dragon"
 yin_shield_perk_name: "Yin Shield"
 yin_nihilus_perk_name: "Yin Nihilus"
 touch_of_rust_perk_name: "Touch of Rust"
 iron_corpse_perk_name: "Iron Corpse"

 SHROUDED_MOON_PERK_EFFECT: "#flavor The Kuei-jin can turn invisible by cladding himself in shadows.#!"
 YIN_MANTLE_PERK_EFFECT: "#flavor The Kuei-jin channels his internal Yin energy into an animus that shrouds him. This animus, or mantle, is invisible to mortals, but it feels to them like a cold breeze in the air. With the Yin Mantle active, the Kuei-jin can channel Yin energy through metal, more easily interact with wraiths, and use the Ghostsight ability more effectively.#!"
 BONE_DANCE_PERK_EFFECT: "#flavor By performing a series of complicated and painful postures, the Kuei-jin can channel Yin energy in an area, turning everyone within lethargic.#!"
 EIGHTFOLD_YIN_MANTLE_PERK_EFFECT: "#flavor Like the initial Yin Mantle, only that the Yin energy manifests as a crackling black aura of Yin energy that can be shaped according to the user's wishes.#!"
 SEMBLANCE_OF_THE_EBON_DRAGON_PERK_EFFECT: "Can psychicaly enter [umbra|E]\nNo longer pay to enter [UmbraGlossaryLocalized('shadowlands','Yin World')]\n[umbra_aptitude|E]: $pod_grace_i$#P +50%#!\n#flavor The Kuei-jin becomes insubstantial as his body mass shifts into the Yin World.#!"
 YIN_SHIELD_PERK_EFFECT: "#flavor The Kuei-jin forms his Yin animus into a protective carapace around his body.#!"
 YIN_NIHILUS_PERK_EFFECT: "#flavor The Kuei-jin creates a deadly halo of Yin energy that sears everyone near to the user.#!"
 TOUCH_OF_RUST_PERK_EFFECT: "Give [GetModifier('touch_of_rust_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor The Kuei-jin can cause metal of any kind to quickly crumble down.#!"
 IRON_CORPSE_PERK_EFFECT: "#flavor The Kuei-jin transforms his very flesh into metal (the exact metal varies from Kuei-jin to Kuei-jin). In this form, his combat abilities rise as his fingers turn into razor claws, but on the downside, the Kuei-jin becomes unable to swim and social interaction almost always fails.#!"
 
 #Chi arts: Yang prana
 principle_of_motion_perk_name: "Principle of Motion"
 yang_mantle_perk_name: "Yang Mantle"
 dragon_dance_perk_name: "Dragon Dance"
 eightfold_yang_mantle_perk_name: "Eightfold Yang Mantle"
 semblance_of_the_scalet_queen_perk_name: "Semblance of the Scarlet Queen"
 yang_shield_perk_name: "Yang Shield"
 yang_phoenix_perk_name: "Yang Phoenix"
 touch_of_corruption_perk_name: "Touch of Corruption"
 oaken_corpse_perk_name: "Oaken Corpse"

 PRINCIPLE_OF_MOTION_PERK_EFFECT: "#flavor The Kuei-jin amplifies his movements with Yang chi.#!"
 YANG_MANTLE_PERK_EFFECT: "#flavor The Kuei-jin channels his internal Yang energy into an animus that shrouds him. This animus, or mantle, is invisible to mortals, but it feels to them like electricity in the air. With the Yang Mantle active, the Kuei-jin can channel Yang energy through wood, more easily interact with spirits and attune his internal chi to the aura of a living person, making him appear much friendlier and more attractive.#!"
 DRAGON_DANCE_PERK_EFFECT: "#flavor Through a series of wild leaps, acrobatic katas, and yogic posturings, the vampire enters a battle trance. He's capable of impressive combat feats while in this state.#!"
 EIGHTFOLD_YANG_MANTLE_PERK_EFFECT: "#flavor Like the initial Yang Mantle, only that the Yang energy manifests as a roiling crimson aura of Yang energy that can be shaped according to the user's wishes.#!"
 SEMBLANCE_OF_THE_SCALET_QUEEN_PERK_EFFECT: "Can psychicaly enter [umbra|E]\nNo longer pay to enter [yang_world|E]\n[umbra_aptitude|E]: $pod_grace_i$#P +50%#!\n#flavor The Kuei-jin becomes insubstantial, as his body mass shifts into the Yang World.#!"
 YANG_SHIELD_PERK_EFFECT: "#flavor The Kuei-jin forms his Yang animus into a glowing aura around his body that protects him.#!"
 YANG_PHOENIX_PERK_EFFECT: "#flavor The Kuei-jin creates scarlet flames of raw Yang energy that sear everyone near to the user.#!"
 TOUCH_OF_CORRUPTION_PERK_EFFECT: "Give [GetModifier('touch_of_corruption_modifier').GetNameWithTooltip] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n#flavor The Kuei-jin can cause wood or any other organic material to quickly decay, refilling his own chi reservoirs.#!"
 OAKEN_CORPSE_PERK_EFFECT: "#flavor The Kuei-jin transforms his very flesh into wood. In this form, his combat abilities rise as his finger turn into deadly stakes and will float in water, but on the downside, social interaction almost always fails and the user becomes susceptible to the Touch of Corruption, as well as fire.#!"
 
 #Chi arts: Equilibrium
 master_flow_perk_name: "Master Flow"
 adjust_balance_perk_name: "Adjust Balance"
 shift_the_balance_perk_name: "Shift the Balance"
 chi_interrupt_perk_name: "Chi Interrupt"
 chi_mastery_perk_name: "Chi Mastery"
 soothing_the_soul_perk_name: "Soothing the Soul"
 accentuate_chi_perk_name: "Accentuate Chi"
 opening_the_gates_perk_name: "Opening the Gates"
 adjust_the_true_balance_perk_name: "Adjust the True Balance"

 MASTER_FLOW_PERK_EFFECT: "#flavor The Kuei-jin can control the flow of chi within his body more efficiently#!"
 ADJUST_BALANCE_PERK_EFFECT: "#flavor The Kuei-jin can create minor variants to a target's internal balance of chi, possibly allowing him to create imbalances or cure them#!"
 SHIFT_THE_BALANCE_PERK_EFFECT: "#flavor The Kuei-jin can temporarily alter his internal chi balance, becoming either Yin or Yang imbalanced#!"
 CHI_INTERRUPT_PERK_EFFECT: "#flavor The Kuei-jin can stop the internal flow of chi within a target, causing painful spasms#!"
 CHI_MASTERY_PERK_EFFECT: "#flavor The Kuei-jin can drain chi from his target or willingly corrupt chi within the body#!"
 SOOTHING_THE_SOUL_PERK_EFFECT: "#flavor By caressing out inconsistencies and eddies in the Chi flow of a subject, the Kuei-jin can make his target lethargic in inner peace, similar to the effects of the Kiss.#!"
 ACCENTUATE_CHI_PERK_EFFECT: "As [character_interaction|E], Can Relocate base [skill|E] points.\n#flavor The Kuei-jin can causes the target to experience extreme swings in mood and energy. Yin-energies cause the victim to become languid, dull-minded, and slow, while Yang energies make the subject restless and agitated.#!"
 OPENING_THE_GATES_PERK_EFFECT: "Bonus chance to maul enemy [knights|E] when in [combat_phase|E] as a [knight|E].\n#flavor The Kuei-jin can cause chi to burn his target from the inside out#!"
 ADJUST_THE_TRUE_BALANCE_PERK_EFFECT: "#flavor The Kuei-jin can create a permanent chi imbalance within his target. Alternatively, it can dispel lasting imbalances, and even cure illnesses like cancer within a mortal target. Kuei-jin suffer a Moment of Blindness when this power is used against them#!"
 
 #Chi arts: Tapestry
 spirit_call_perk_name: "Spirit Call"
 chi_ward_perk_name: "Chi Ward"
 chi_shaping_perk_name: "Chi-Shaping"
 ride_the_dragon_perk_name: "Ride the Dragon"
 chi_rift_perk_name: "Chi Rift"
 celestial_needle_perk_name: "Celestial Needle"
 dragon_chariot_perk_name: "Dragon Chariot"
 chi_castle_perk_name: "Chi Castle"
 the_dragons_rapine_perk_name: "The Dragon's Rapine"

 SPIRIT_CALL_PERK_EFFECT: "As [character_interaction|E], mark character to return after death as $POD_splat_spirit$ or $POD_splat_wraith$\n#flavor The Kuei-jin can lure nearby spirits or wraiths towards him#!"
 CHI_WARD_PERK_EFFECT: "Can Manipulate Wall Rating.\n#flavor The Kuei-jin can affect the local Wall rating#!"
 CHI_SHAPING_PERK_EFFECT: "Can upgrade [GetBuilding('dragon_nest_01').GetName] building up to [GetBuilding('dragon_nest_03').GetName].\n#flavor The Kuei-jin can manipulate the currents of chi beneath the earth for a variety of effects, like invoking joss, weakening chi based attacks, or trapping local spirits#!"
 RIDE_THE_DRAGON_PERK_EFFECT: "#flavor The Kuei-jin can travel along a Dragon Line, teleporting himself across it.#!"
 CHI_RIFT_PERK_EFFECT: "As [character_interaction|E], give current location [GetModifier('chi_rift_modifier').GetNameWithTooltip] for 10 years.\n#flavor The Kuei-jin can create a portal between the Middle Kingdom and the spiritual realms, unleashing a tempest of elemental chi that wreaks havoc in an area.#!"
 CELESTIAL_NEEDLE_PERK_EFFECT: "Improve [GetPerk('chi_rift_perk').GetName(GetPlayer)] by replacing [GetModifier('chi_rift_modifier').GetNameWithTooltip] to [GetModifier('celestial_needle_modifier').GetNameWithTooltip]\nBecome Immune to [GetPerk('chi_rift_perk').GetName(GetPlayer)] and other similar arts.\n#flavor The Kuei-jin can mend opened Chi Rifts and other gaps between the worlds#!"
 DRAGON_CHARIOT_PERK_EFFECT: "#flavor The Kuei-jin can travel with several companions alongside a Dragon Line#!"
 CHI_CASTLE_PERK_EFFECT: "#flavor The Kuei-jin can form a temporary Dragon Nest, thereby upsetting the spiritual balance and invoking the ire of spirits and other shen.#!"
 THE_DRAGONS_RAPINE_PERK_EFFECT: "#flavor This power allows a Kuei-jin to throw an opponent along a dragon line, able to expulse him from the flow anywhere, even in solid objects.#!"
 
 #Chi arts: Feng Shui
 wind_water_eye_perk_name: "Wind Water Eye"
