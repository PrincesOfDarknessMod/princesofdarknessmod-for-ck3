 fengshui_chi_ward_perk_name: "Chi Ward"
 beneficent_celestial_mirror_perk_name: "Beneficent Celestial Mirror"
 dancing_spirits_perk_name: "Dancing Spirits"
 veil_of_defilement_perk_name: "Veil of Defilement"
 transcendend_portal_perk_name: "Transcendend Portal"

 WIND_WATER_EYE_PERK_EFFECT: "#flavor The Kuei-jin can discern the type of ambient chi around him.#!"
 BROOM_OF_HEAVEN_PERK_EFFECT: "#flavor The Kuei-jin can dispel minor disruptions in the chi flow.#!"
 HAND_OF_DARKNESS_PERK_EFFECT: "As [character_interaction|E], give current location [GetModifier('chi_cursed_modifier').GetNameWithTooltip] for 10 years.\n#flavor The Kuei-jin curses a target by manipulating the chi flow around it.#!"
 INHARMONIOUS_ALIGMENT_PERK_EFFECT: "Improve [GetPerk('hand_of_darkness_perk').GetName(GetPlayer)] by replacing [GetModifier('chi_cursed_modifier').GetNameWithTooltip] to [GetModifier('chi_cursed_inharmonious_aligment_modifier').GetNameWithTooltip]\n#flavor The Kuei-jin can alter the chi around him in a way that it cannot be drawn by Mandarins or Bodhisattvas via Osmosis.#!"
 FENGSHUI_CHI_WARD_PERK_EFFECT: "#flavor The Kuei-jin constructs a barrier of chi that prevents shen from crossing it.#!"
 BENEFICENT_CELESTIAL_MIRROR_PERK_EFFECT: "[umbra_aptitude|E]: $pod_grace_i$#P +50%#!\n#flavor The Kuei-jin can shape the chi of the Mirror Lands to create a safe haven for himself within them that can be used as a beachhead for further umbral exploration.#!"
