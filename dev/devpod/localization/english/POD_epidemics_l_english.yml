l_english:
 epidemic_crimson_fever: "Crimson Fever"
 
 POD_epidemic.1001.t:1 "$epidemic_crimson_fever$: Crimson Fever"
 POD_epidemic.1001.desc:0 "I have heard stories about vampiric disease manifesting in Cathayans whose Yang aspects have become imbalanced. But me, a [ROOT.Char.GetTitleTierName]? This aching, feverish nightmare is not a fate meant for me.\n\nAs yet another meal forces its way up my throat, I pray for redemption, my nostrils stinging with the sharp stench of bile."
 POD_epidemic.1001.court_physician.desc:0 "\n\n"Do not worry, my [ROOT.Char.GetLadyLord]! Crimson Fever is treatable, I assure you.""
 POD_epidemic.1001.a:0 "I beg, let it end!"

 POD_epidemic.1101.t:1 "$epidemic_crimson_fever$: A Battle Won"
 POD_epidemic.1101.desc:0 "Unlike many before me, I was strong enough to survive the ravages of the dreaded crimson fever. It was a brutal challenge, I will not deny it, but I persevered!"
 POD_epidemic.1101.a:0 "I live to fight another day!"
 
 epidemic_chulorviosis: "Chulorviosis"

 POD_epidemic.1002.t:1 "[SCOPE.Custom('EventTitleDisease')]: Little By Little"
 POD_epidemic.1002.desc:0 "A crimson stain, so stark against the pale cloth. I stare at it in disbelief, suppressing another cough. Did it...? Did I...?\n\nI wipe my fingers against my lips, my hand trembling as I pull it back. I can feel the warm wetness, but I dread to look."
 POD_epidemic.1002.court_physician.desc:0 "\n\n"I am afraid you have contracted Chulorviosis, my [ROOT.Char.GetLadyLord]. I will treat you immediately.""
 POD_epidemic.1002.a:0 "Is this my fate? To slowly waste away?"