 disease_flaying_plague: "flaying plague."
 health.2101.flaying_plague_outbreak.desc:2 "[ROOT.Char.GetFaith.DeathDeityName|U] has raised [ROOT.Char.GetFaith.DeathDeityHerHis] scythe over my realm — a case of the dreaded flaying plague has been discovered!"
 health.2101.flaying_plague_spreads.desc:0 "Yet another soul stands at Death's door, the dreaded buboes marring [sick_character.GetHerHis] skin."

