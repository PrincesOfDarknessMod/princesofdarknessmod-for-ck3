 epidemic_scourge: "Scourge"
 disease_scourge: "scourge."
 health.2101.scourge_outbreak.desc:2 "[ROOT.Char.GetFaith.DeathDeityName|U] has raised [ROOT.Char.GetFaith.DeathDeityHerHis] scythe over my realm — a case of the dreaded scourge has been discovered!"
 health.2101.scourge_spreads.desc:0 "Yet another soul stands at Death's door, the dreaded buboes marring [sick_character.GetHerHis] skin."

 POD_epidemic.1501.t:1 "[SCOPE.Custom('EventTitleDisease')]: Infected!"
 POD_epidemic.1501.desc:0 "The Scourge spares no one... at least not you. It's a strange feeling really, sickness has been a faint memory of your breathing days for a long time at this point and now it's back to haunt you.\nYou feel weak, your blood has trouble conjuring the power it once had and you can see in the eyes of your entourage the fear of being exposed to you... and the greedy glint of opportunities being pondered while you are thus weakened.\nTroubled times ahead."
 POD_epidemic.1501.a:1 "I just need to lay down a little..."

 POD_epidemic.1502.t:1 "[SCOPE.Custom('EventTitleDisease')]: Against All Odds"
 POD_epidemic.1502.desc:0 "It seems as if [ROOT.Char.GetFaith.DeathDeityName] passed through my door, lingered by my bedside, but in the end decided to let me live. I will never forget the torments of [ROOT.Char.GetFaith.DeathDeityHerHis|U] touch, yet [ROOT.Char.GetFaith.DeathDeitySheHe|U] has opened my eyes to the miracle of life.\n\n The scourge has claimed many souls, but I will not be one of them."
 POD_epidemic.1502.a:1 "Praise [ROOT.Char.GetFaith.HealthGodName] for this miracle!"
