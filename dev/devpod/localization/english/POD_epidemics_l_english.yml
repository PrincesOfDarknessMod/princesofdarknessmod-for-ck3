l_english:
 epidemic_crimson_fever: "Crimson Fever"
 disease_crimson_fever: "crimson fever."
 health.2101.crimson_fever_outbreak.desc: "A dangerous case of crimson fever has crept in to court. Rashes, coughing and fever beset the afflicted."
 health.2101.crimson_fever_spreads.desc: "Another case of crimson fever has reared its head."
 
 POD_epidemic.1001.t:1 "[SCOPE.Custom('EventTitleDisease')]: Crimson Fever"
 POD_epidemic.1001.desc:0 "I have heard stories about vampiric disease manifesting in Cathayans whose Yang aspects have become imbalanced. But me, a [ROOT.Char.GetTitleTierName]? This aching, feverish nightmare is not a fate meant for me.\n\nAs yet another meal forces its way up my throat, I pray for redemption, my nostrils stinging with the sharp stench of bile."
 POD_epidemic.1001.court_physician.desc:0 "\n\n"Do not worry, my [ROOT.Char.GetLadyLord]! Crimson Fever is treatable, I assure you.""
 POD_epidemic.1001.a:0 "I beg, let it end!"

 POD_epidemic.1002.t:1 "[SCOPE.Custom('EventTitleDisease')]: A Battle Won"
 POD_epidemic.1002.desc:0 "Unlike many before me, I was strong enough to survive the ravages of the dreaded crimson fever. It was a brutal challenge, I will not deny it, but I persevered!"
 POD_epidemic.1002.a:0 "I live to fight another day!"
 
 epidemic_chulorviosis: "Chulorviosis"
 disease_chulorviosis: "chulorviosis."
 health.2101.chulorviosis_outbreak.desc: "Hacking coughs ring around the court. Chulorviosis stalks through the corridors, claiming its first victim."
 health.2101.chulorviosis_spreads.desc: "More unfortunate souls find themselves in the grip of chulorviosis."

 POD_epidemic.1101.t:1 "[SCOPE.Custom('EventTitleDisease')]: Little By Little"
 POD_epidemic.1101.desc:0 "A crimson stain, so stark against the pale cloth. I stare at it in disbelief, suppressing another cough. Did it...? Did I...?\n\nI wipe my fingers against my lips, my hand trembling as I pull it back. I can feel the warm wetness, but I dread to look."
 POD_epidemic.1101.court_physician.desc:0 "\n\n"I am afraid you have contracted Chulorviosis, my [ROOT.Char.GetLadyLord]. I will treat you immediately.""
 POD_epidemic.1101.a:0 "Is this my fate? To slowly waste away?"
 
 epidemic_demonic_plague: "Demonic Plague"
 disease_demonic_plague: "demonic plague."
 health.2101.demonic_plague_outbreak.desc:2 "[ROOT.Char.GetFaith.DeathDeityName|U] has raised [ROOT.Char.GetFaith.DeathDeityHerHis] scythe over my realm — a case of the dreaded demonic plague has been discovered!"
 health.2101.demonic_plague_spreads.desc:0 "Yet another soul stands at Death's door, the dreaded buboes marring [sick_character.GetHerHis] skin."

 POD_epidemic.1201.t:1 "[SCOPE.Custom('EventTitleDisease')]: The Reaper's Touch"
 POD_epidemic.1201.desc:0 "Fear of the plague has been a constant companion throughout my life. My childhood nurse told me haunting bedtime stories of swelling buboes and blackening limbs.\n\nBut the plague is no longer just a scary story. Gingerly, I push my fingers against the lump in my armpit. A dark and deadly force is tainting my flesh, consuming me as I still breathe."
 POD_epidemic.1201.court_physician.desc:0 "\n\n"My [ROOT.Char.GetLadyLord], I will do everything in my power, but it might be wise to prepare for the worst...""
 POD_epidemic.1201.a:1 "Oh, [ROOT.Char.GetFaith.HealthGodName]! Save me from this nightmare!"

 POD_epidemic.1202.t:1 "[SCOPE.Custom('EventTitleDisease')]: Against All Odds"
 POD_epidemic.1202.desc:0 "It seems as if [ROOT.Char.GetFaith.DeathDeityName] passed through my door, lingered by my bedside, but in the end decided to let me live. I will never forget the torments of [ROOT.Char.GetFaith.DeathDeityHerHis|U] touch, yet [ROOT.Char.GetFaith.DeathDeitySheHe|U] has opened my eyes to the miracle of life.\n\n The plague has claimed many souls, but I will not be one of them."
 POD_epidemic.1202.a:1 "Praise [ROOT.Char.GetFaith.HealthGodName] for this miracle!"
 POD_epidemic.1202.a.tt:0 "I am now immune to [GetTrait('demonic_plague').GetName( GetNullCharacter )]"
 
 epidemic_gift_of_melancholia: "Virulent Wasting Illness"
 disease_gift_of_melancholia: "virulent wasting illness."
 health.2101.gift_of_melancholia_outbreak.desc:0 "The curse of death has fallen upon my court — a case of virulent wasting illness has been discovered!"
 health.2101.gift_of_melancholia_spreads.desc:0 "Yet another soul has been cursed with virulent wasting illness."
 
 POD_epidemic.1301.t:1 "[SCOPE.Custom('EventTitleDisease')]: The Red Plague"
 POD_epidemic.1301.desc:0 "With the first wave of fever and vomiting, I desperately hoped it was nothing worse than sweating sickness. And I did get a little better, arose from my bed, returned to my duties. For a week, all was well — until I noticed the first red spots in my mouth."
 POD_epidemic.1301.end.desc:0 "\n\nThat was two days ago, and now the telltale lesions are spreading across my skin..."
 POD_epidemic.1301.court_physician.desc:0 "\n\n"Indeed, these lesions are a sure sign of virulent wasting illness. Very dangerous if left untreated.""
 POD_epidemic.1301.a:1 "[ROOT.Char.GetFaith.HealthGodName], I beg you, not yet! I'm not ready!"

 POD_epidemic.1302.t:1 "[SCOPE.Custom('EventTitleDisease')]: Escaping [ROOT.Char.GetFaith.DeathDeityName]"
 POD_epidemic.1302.desc:0 "While scars might remain, both on my skin and in my mind, it seems like the affliction has left my body. I will survive. There is still time."
 POD_epidemic.1302.a:1 "Glory to [ROOT.Char.GetFaith.HealthGodName]! I am well!"
 POD_epidemic.1302.a.tt:0 "I am now immune to [GetTrait('gift_of_melancholia').GetName( GetNullCharacter )]"
 
