 immaculates_adj: "Immaculates"
 immaculates_adherent: "Immaculate"
 immaculates_adherent_plural: "Immaculates"
 immaculates_desc: "What is left from the original faith of Dragon-Blooded from Age of Legends, diluted and adapted into new paradigm of World of Darkness. They see Gaia; the Celestine, as the same being as Gaia; the Primordial, and want to help her regain memories of the past. So one day Gaia will remember her grandchildren of old and everything will be like in the past."

