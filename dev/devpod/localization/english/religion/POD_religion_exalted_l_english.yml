 preservationists_adherent: "Preservationist"
 preservationists_adherent_plural: "Preservationists"
 preservationists_desc: "Exalted are mostly extinct, with exception being Dragon-Blooded and even they are nearly gone. Preservationists realize that this is no moment of thinking about anything besides survival. The Black Vault is something that cannot be opened otherwise only doom awaits everything that is still remaining. They dream of a day where their sustained existence is no longer endangered"

