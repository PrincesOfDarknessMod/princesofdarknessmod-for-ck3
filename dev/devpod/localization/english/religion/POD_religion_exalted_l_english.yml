 the_dragon_cult_adj: "The Dragon Cult"
 the_dragon_cult_adherent: "Cultist"
 the_dragon_cult_adherent_plural: "Cultists"
 the_dragon_cult_desc: "The Gods of Old are gone, together with Age of Legends. at least most of them are, there are two exceptions. Ebon Dragon and Scarlet Phoenix, and that is something that unites The Dragon Cult. They see the existence of the two as something of great importance and desire to protect the only remaining beings from the Past, and together with them the cycle of life and death. So one day Both are freed from their current state, and together they restore the glory of old Heaven."

