 #Laibon-Group Faiths
 laibon: "Way of Heaven and Earth"
 laibon_adj: "Heaven-and-Earth"
 laibon_adherent: "Walker of Heaven and Earth"
 laibon_adherent_plural: "Walkers of Heaven and Earth"
 laibon_desc: "The Way of Heaven and Earth is the central spiritual practice of the Laibon, balancing the twin forces of Orun and Aye — the divine sky and the material world. Its adherents seek harmony between the spiritual hunger of the Beast and the obligations of the living world, walking a narrow path between transcendence and damnation. To lose this balance is to fall into the grip of one pole or the other: dissolution into detached divinity, or descent into ravenous monstrousness."
 laibon_nyayo: "Nyayo"
 laibon_nyayo_adj: "Nyayo"
 laibon_nyayo_adherent: "Nyayo"
 laibon_nyayo_adherent_plural: "Nyayo"
 laibon_nyayo_desc: "The Nyayo, those who follow in the footsteps of the ancestors, are Laibon who insist that the Ebony Kingdom's domains must be governed on their own terms. Cooperation is possible. Submission is not."
 laibon_luo: "Luo"
 laibon_luo_adj: "Luo"
 laibon_luo_adherent: "Luo"
 laibon_luo_adherent_plural: "Luo"
 laibon_luo_desc: "Where the Nyayo counsel vigilance, the Luo demand war. Every Cainite foothold in Africa is an act of colonization. Theirs is a faith of reclamation through violence."
 laibon_daughters_of_arawelo: "Daughters of Arawelo"
 laibon_daughters_of_arawelo_adj: "Arawelan"
 laibon_daughters_of_arawelo_adherent: "Daughter of Arawelo"
 laibon_daughters_of_arawelo_adherent_plural: "Daughters of Arawelo"
 laibon_daughters_of_arawelo_desc: "Arawelo was a queen who crushed every man who stood against her. The Daughters venerate her as proof that identity is forged, not given - strength, cunning, and ruthless ambition are the only birthrights that matter."
 laibon_birds_of_huur: "Birds of Huur"
 laibon_birds_of_huur_adj: "Huurian"
 laibon_birds_of_huur_adherent: "Kinyonyi"
 laibon_birds_of_huur_adherent_plural: "Kinyonyi"
 laibon_birds_of_huur_desc: "Huur is the messenger of Death, and his birdmen walk a philosophy of paradox filtered through African cosmology. To the Kinyonyi, wandering is worship, and the journey itself is the only honest destination."
 laibon_appeasers_of_eebo: "Appeasers of Eebo"
 laibon_appeasers_of_eebo_adj: "Eeboite"
 laibon_appeasers_of_eebo_adherent: "Appeaser of Eebo"
 laibon_appeasers_of_eebo_adherent_plural: "Appeasers of Eebo"
 laibon_appeasers_of_eebo_desc: "Eebo is the god of the sky who wields the sun as his burning eye. Strongly attuned to Orun, the Appeasers strive to transcend their monstrous nature entirely."
 laibon_nidars_punishers: "Nidar's Punishers"
 laibon_nidars_punishers_adj: "Nidaran"
 laibon_nidars_punishers_adherent: "Punisher of Nidar"
 laibon_nidars_punishers_adherent_plural: "Punishers of Nidar"
 laibon_nidars_punishers_desc: "This order of undertakers and killers has dedicated itself to the destruction of Magaji who abuse their power. Deeply attuned to Aye, they believe that justice belongs to the material world."
 laibon_children_of_sarapion: "Children of Sarapion"
 laibon_children_of_sarapion_adj: "Sarapionic"
 laibon_children_of_sarapion_adherent: "Child of Sarapion"
 laibon_children_of_sarapion_adherent_plural: "Children of Sarapion"
 laibon_children_of_sarapion_desc: "Sarapion is ancient beyond measure. The Children recognize no false gods, and they topple any creature that grows too powerful, for none may rival Sarapion in its glory."
 laibon_asiman: "Asiman"
 laibon_asiman_adj: "Asiman"
 laibon_asiman_adherent: "Asiman"
 laibon_asiman_adherent_plural: "Asiman"
 laibon_asiman_desc: "The Asiman are the Proper Ones. Laibon who reject the authority of elders and Magaji alike, holding that no vampire has the right to rule another by virtue of age or blood alone."
 laibon_tariq_alsama_walard: "Tariq alsama' Wal'ard"
 laibon_tariq_alsama_walard_adj: "Tariq alsama'"
 laibon_tariq_alsama_walard_adherent: "Follower of the Tariq"
 laibon_tariq_alsama_walard_adherent_plural: "Followers of the Tariq"
 laibon_tariq_alsama_walard_desc: "Tariq alsama' Wal'ard represents a syncretism between Ashirra Islam and the Laibon spiritual tradition. African identity and Islamic devotion are not competing loyalties but a single, unified truth."
 laibon_path_of_terror: "Path of Terror"
 laibon_path_of_terror_adj: "Terrorborn"
 laibon_path_of_terror_adherent: "Terrormonger"
 laibon_path_of_terror_adherent_plural: "Terrormongers"
 laibon_path_of_terror_desc: "The Path of Terror roots itself in primal fear. To become something greater, one must first become something terrible."
 laibon_flowers_of_indulgence: "Flowers of Indulgence"
 laibon_flowers_of_indulgence_adj: "Indulgent"
 laibon_flowers_of_indulgence_adherent: "Flower of Indulgence"
 laibon_flowers_of_indulgence_adherent_plural: "Flowers of Indulgence"
 laibon_flowers_of_indulgence_desc: "The hedonism is the mask, not the face. Beneath the indulgence lies a web of Machiavellian scheming. The wine is always sweet. The price is always paid later."


