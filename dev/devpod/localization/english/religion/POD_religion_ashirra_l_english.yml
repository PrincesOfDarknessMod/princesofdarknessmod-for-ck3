l_english: 

 ashirra_religion: "Ashirra"
 ashirra_religion_adj: "Ashirra"
 ashirra_religion_adherent: "Ashirra"
 ashirra_religion_adherent_plural: "Ashirra"
 ashirra_religion_desc: "The [ashirra|E] (from ashira, Arabic for 'clan') is the sect under which Islamic vampires declare their faith in Allah, and which rules over Arabia and North Africa, beginning in the Dark Ages. Members of the [ashirra|E] believe that redemption for the Kindred was among the promises Muhammad made if they chose to follow Allah."

 ashirra_religious_head_title: "Mullah"
 ashirra_religious_head_title_name: "Sultanate"




 #Ashirra-Group Faiths
 tariqelsama: "Tariq el-Sama"
 tariqelsama_adj: "Sama"
 tariqelsama_adherent: "el-Sama"
 tariqelsama_adherent_plural: "el-Sama"
 tariqelsama_desc: "$pod_cainites$ who were Muslim in life may choose to adhere to this Path under the assumption that Allah's plan for the world includes vampires. Hoping that continued obedience to His will might help them control the Beast."

 tariqelumma: "Tariq el-Umma"
 tariqelumma_adj: "Umma"
 tariqelumma_adherent: "el-Umma" ###
 tariqelumma_adherent_plural: "el-Umma"
 tariqelumma_desc: "The Road of Humanity for Islamic Kindred varies little from its Western counterpart. Both sides communicate often and share experiences with one another."


 tariqelharb: "Tariq el-Harb"
 tariqelharb_adj: "Harb"
 tariqelharb_adherent: "el-Harb"
 tariqelharb_adherent_plural: "el-Harb"
 tariqelharb_desc: "The Islamic Kindred's Road of Kings. As there are few Ventrue in the Muslim world, this road is less prevalent than Via Regalis is in the West. Still, many sultans and emirs enjoy the exaltation of power it procures."

 tariqelbedouin: "Tariq el-Bedouin"
 tariqelbedouin_adj: "Bedouin"
 tariqelbedouin_adherent: "el-Bedouin"
 tariqelbedouin_adherent_plural: "el-Bedouin"
 tariqelbedouin_desc: "The Islamic Kindred's Road of the Beast. Zayyat, Tariq el-Bedouin's founder and close friend to the leaders of the Bay't el-Awal, was cause for this road's close ties to civilization. Contrasting it from its Western counterpart."
 
 tariqelalaam: "Tariq el-Alaam"
 tariqelalaam_adj: "Shuhada"
 tariqelalaam_adherent: "Al-shuhada"
 tariqelalaam_adherent_plural: "Al-Shuhada"
 tariqelalaam_desc: "Al-Shuhada of the [ashirra|E], these martyrs offer themselves as undead sacrifices so others do not have to suffer. They will willingly sacrifice themselves to stop corruption caused by anything considered unholy, especially demons or other $pod_cainites$."
 
 sheperdsofislam: "Shepherds of Islam"
 sheperdsofislam_adj: "Shepherds"
 sheperdsofislam_adherent: "Witness"
 sheperdsofislam_adherent_plural: "Witnesses"
 sheperdsofislam_desc: "The Shepherds believe that Allah himself, in His wisdom and compassion, chose them to be the deathless caretakers of the words of the last and greatest Prophet (peace be upon him). Islam would live on — could only live on — in those who had personally witnessed the words of the Prophet and would always be around to relate it to others."


 tariqelatham: "Tariq el-A'Tham"
 tariqelatham_adj: "A'Tham"
 tariqelatham_adherent: "Scholar"
 tariqelatham_adherent_plural: "Scholars"
 tariqelatham_desc: "Mainly an offshoot of the main Via Ossium in the Muslim world, the Tariq el-A'Tham benefit from older knowledge kept alive in this part of the world. Their sometimes callous practices can put them at odds with the zealous [ashirra|E] or the vigilant Children of Haqim, though."