# Abyss Mysticism content: localization

 delve_rituals_of_darkness_decision: "Delve the Rituals of Darkness"
 delve_rituals_of_darkness_decision_desc: "The rites you know are a fraction of what the Abyss will answer to. Give your nights to the fragments, the half-burned treatises and your own notes from the dark, and you may trace as many as three rites within your present reach, then master one of them. Nothing is cast in the studying. The work cannot be repeated for ten years, though the right chambers in your domicile shorten the wait to nine, seven or five."
 delve_rituals_of_darkness_decision_effect_tt: "#bold Delve for a new [bs_ritual|E].#!\nThe Abyss offers up to #V 3#! rites you do not know, weighted toward the lower tiers. Keep #V 1#!; the rest are lost. The delving cannot be repeated for #V 10#! years, and a higher level Oubliette shortens the wait."
 delve_rituals_of_darkness_decision_confirm: "Delve"
 delve_rituals_of_darkness_decision_tooltip: "Draw up to #V 3#! Abyssal Mysticism [bs_rituals|E] out of the dark and keep one. The delving cannot be repeated for years."
 delve_rituals_cooldown_tt: "You delved too recently. The delving cannot be repeated for years."
 delve_rituals_none_learnable_tt: "You already know every rite the Abyss can raise at your level of Abyssal Mysticism."

 POD_abyss_mysticism.0300.t: "What the Dark Offers"
 POD_abyss_mysticism.0300.desc: "The work has cost you more nights than you meant to give it. Wax has pooled and hardened across the table, and the copied pages are sorted at last into what is legible and what merely looks it. What remains is workable: the outline of a rite you have never performed, perhaps more than one, each complete enough to master if you give it everything you have left.\n\nYou will not have the strength for more than one. Whatever you set aside tonight goes back into the dark with the rest, and it will be years before you can go looking again."
 POD_abyss_mysticism.0300.opt.subsume_the_darkness: "Study how to Subsume the Darkness"
 POD_abyss_mysticism.0300.opt.abyssal_blade: "Learn the rite of the Abyssal Blade"
 POD_abyss_mysticism.0300.opt.one_with_the_dark: "Master becoming One with the Dark"
 POD_abyss_mysticism.0300.opt.summoning_the_blatherskites: "Learn to summon the Blatherskites"
 POD_abyss_mysticism.0300.opt.claiming_the_dark: "Work through Claiming the Dark"
 POD_abyss_mysticism.0300.opt.call_the_legion: "Learn how to Call the Legion"
 POD_abyss_mysticism.0300.opt.boukephos_gateway: "Study the opening of Boukephos' Gateway"
 POD_abyss_mysticism.0300.opt.syllable_of_unbeing: "Commit the Syllable of Unbeing to memory"
 POD_abyss_mysticism.0300.opt.ahrimans_beckoning: "Ahriman's Beckoning, whatever it asks"
 POD_abyss_mysticism.0300.tt.subsume_the_darkness: "You learn Subsume the Darkness, a tier 2 ritual.\nWhen cast: heals up to 5 points of superficial damage.\nFor one year afterward, mortal blood gives half its normal nourishment. Other blood is unaffected."
 POD_abyss_mysticism.0300.tt.abyssal_blade: "You learn Abyssal Blade, a tier 2 ritual.\nWhen cast: your equipped primary weapon gains +5 prowess and +0.1 monthly dread.\nThe weapon's maximum durability is halved."
 POD_abyss_mysticism.0300.tt.one_with_the_dark: "You learn One with the Dark, a tier 3 ritual.\nWhen cast: reveals one unknown secret of the chosen target.\n50% chance of a second secret and 25% overall chance of a third, when available.\nIf the target hides no secrets: a manipulation hook if possible, and 100 intrigue experience.\nCasters who do not follow the Road of the Abyss lose 150 piety.\nA botch exposes your own secrets."
 POD_abyss_mysticism.0300.tt.summoning_the_blatherskites: "You learn Summoning the Blatherskites, a tier 3 ritual.\nWhen cast: infests the chosen target's capital county for five years.\nInfested county: -30 control baseline, -0.2 prosperity growth, -15 popular opinion, -25% levy reinforcement.\nIf the target no longer has a capital, no county is affected.\nA botch infests your own capital for one year."
 POD_abyss_mysticism.0300.tt.claiming_the_dark: "You learn Claiming the Dark, a tier 4 ritual. Learning it grants none of the following.\nWhen cast: one permanent augmentation tier, +2 prowess, +4 with advanced Obtenebration, +6 with Ahriman's Demesne.\nWhile augmented, fire and sunlight damage are doubled.\nWith level 5 Abyssal Mysticism, the casting gives 29 Abyss-touched experience in total.\nBelow level 5: 25 experience if you start under 75, then 4 more if the total is under 95.\nThe release decision removes the augmentation but not the attunement."
 POD_abyss_mysticism.0300.tt.call_the_legion: "You learn Call the Legion, a tier 4 ritual.\nWhen cast: summons three stacks of Minacious Legion men-at-arms at the capital of the chosen playable target."
 POD_abyss_mysticism.0300.tt.boukephos_gateway: "You learn Boukephos' Gateway, a tier 4 ritual.\nWhen cast: the recipient personally converts to the Road of the Abyss if needed, gaining medium piety.\nVassals are not converted.\nThe recipient permanently gains +0.1 monthly dread and 10% lower [stress|E] costs for Abyss rituals.\nA reflective event follows seven days later.\nA botch causes ordinary torpor."
 POD_abyss_mysticism.0300.tt.syllable_of_unbeing: "You learn Syllable of Unbeing, a tier 5 ritual.\nWhen cast: you gain immunity to sunlight damage.\nThe first sunlight damage is absorbed and starts a 30-day expiry on the ward.\n40 days after that first hit comes a reckoning: 25% chance of frenzy unless a fresh ward is active."
 POD_abyss_mysticism.0300.tt.ahrimans_beckoning: "You learn Ahriman's Beckoning, a tier 5 ritual.\nWhen cast: abducts a living, free target other than yourself.\nThe victim becomes Abyss-taken: -3 to all attributes, +25% stress gain, -15 general opinion.\nAn invalid target escapes the effect."
 POD_abyss_mysticism.0300.learned_toast: "A New Abyss Ritual Learned"
 POD_abyss_mysticism.0300.z: "Close the books; none of these will do"

 POD_abyss_mysticism.0310.t: "An Echo of the Rite"
 POD_abyss_mysticism.0310.desc: "The rite ended last night. You spoke the last of it, the work held, and you put the matter out of mind.\n\nTonight, crossing the hall, you hear the closing words again, in your own voice, from behind a door you have just shut. The room beyond is empty when you look. The floor there is colder than stone has any reason to be, and a taper you remember snuffing is warm to the touch.\n\nYou stand in the doorway longer than you would want anyone to see."
 POD_abyss_mysticism.0310.a: "The work is done. Let it lie."

 POD_abyss_mysticism_abyssal_blade_no_weapon_tt: "#weak No unclaimed weapon was equipped when the rite closed, so nothing was steeped. The [stress|E] is spent regardless.#!"
 POD_abyss_mysticism_abyssal_blade_already_steeped_tt: "Your equipped weapon already carries the dark. A blade can be claimed only once."

 let_the_darkness_go_decision: "Let the Darkness Go"
 let_the_darkness_go_decision_desc: "Release the darkness you took into your body. You give up the strength it lent; fire and sunlight burn you no worse than before. The rituals you learned and the Abyss's mark on you remain."
 let_the_darkness_go_decision_effect_tt: "#bold Release the claimed dark.#!\nThe held claim is removed: the borrowed [prowess|E] goes, and fire and sunlight lose their doubled purchase on you."
 let_the_darkness_go_decision_confirm: "Release it"
 let_the_darkness_go_decision_tooltip: "Release the claimed dark. The borrowed [prowess|E] goes, and fire and sun no longer deal double damage to you."
 POD_abyss_mysticism_claiming_already_held_tt: "You already hold a claim on the dark. Release it with the $let_the_darkness_go_decision$ [decision|E] before claiming anew."

###### Tier 3 casts & botches ######

 POD_abyss_mysticism_one_with_the_dark_reveal_tt: "One [secret|E] your target keeps is revealed to you alone, with a #V 50%#! chance of a second and a #V 25%#! chance of a third."
 POD_abyss_mysticism_one_with_the_dark_fallback_tt: "Your target keeps no [secret|E] the dark can lift. Instead, the reading exposes a weakness and grants you a weak [hook|E] on them plus Intrigue [lifestyle|E] experience."
 POD_abyss_mysticism_blatherskites_no_lands_tt: "#weak Your target holds no [county|E] for the swarm to infest, so nothing is loosed. The [stress|E] is spent regardless.#!"

 POD_abyss_mysticism.0311.t: "The Dark Clings"
 POD_abyss_mysticism.0311.desc: "Something of the dark came back with you. Your hands are black to the wrist when you look at them, and for a long moment they do not feel like yours. Then the color drains off like water, and the skin beneath is whole and unmarked, exactly as it was.\n\nYou check twice more before dawn. The skin is clean both times, and still you scrub your hands until the water in the basin has gone cold."
 POD_abyss_mysticism.0311.a: "It left no mark. Good."

 POD_abyss_mysticism.0312.t: "A Clumsy Working"
 POD_abyss_mysticism.0312.desc: "The working slips from you at the worst point. Flames gutter all at once, and the dark pools afterward in places where others can find it. By the next night the story has traveled, improved in each telling, and those whose opinion you need have heard it.\n\nWhen you next walk into company, one of them slides the candle to the far end of the table, and somebody laughs."
 POD_abyss_mysticism.0312.a: "I will remember who laughed."
 POD_abyss_mysticism.0312.trust_tt: "Standing at court falls by 2."

 POD_abyss_mysticism.0313.t: "A Wayward Shadow"
 POD_abyss_mysticism.0313.desc: "The miscast leaves you unharmed, and for a few nights you believe that is the end of it. Then, in the middle of a courteous lie, your shadow turns its head to look at the one you are lying to.\n\nIt has done as it likes since. It lags behind you at doorways, leans toward conversations you are pretending to ignore, and once sat down before you did. People notice."
 POD_abyss_mysticism.0313.a: "Behave. People are watching."

 POD_abyss_mysticism.0315.t: "The Dark Tells Tales"
 POD_abyss_mysticism.0315.desc: "The dark does not let go of what it touched in you. It carries that outward, and in rooms you have never entered, shadows murmur in something close to your voice."
 POD_abyss_mysticism.0315.a: "What did it have to tell?"
 POD_abyss_mysticism.0315.nothing_tt: "You have no secrets to expose. Nothing further happens."

 POD_abyss_mysticism.0316.t: "A Summons Turned Back"
 POD_abyss_mysticism.0316.desc: "The Blatherskite answers the summons and declines the errand. You feel it slip the direction you gave it and turn back along the way it came, toward you and whatever lies nearest you. If there are lands you call your own, it has found them by now, and it will not be quick to leave."
 POD_abyss_mysticism.0316.a: "It was meant for someone else."
 POD_abyss_mysticism.0316.homeless_tt: "You hold no capital county, so nothing is infested."

 POD_abyss_mysticism.0317.t: "Felled by the Gateway"
 POD_abyss_mysticism.0317.desc: "The Gateway opens wrong. You know it in the first instant, the way you would know a stair missing underfoot, and then the dark on the far side has hold of you and is drawing the strength out of every part of you at once.\n\nYou manage to close it. That is the last thing you manage. Your limbs stop answering and your thoughts slow. You recognize the torpor settling over you. Your lands will still be yours when you wake."
 POD_abyss_mysticism.0317.a: "Sleep, then. And wake."

###### Tier 4: Call the Legion & Boukephos' Gateway ######

 POD_abyss_mysticism_minacious_legion_army: "The Minacious Legion"

 POD_abyss_mysticism_gateway_already_open_tt: "Your gateway already stands open. There is no rite for opening a door twice."

 POD_abyss_mysticism.0320.t: "After the Gateway"
 POD_abyss_mysticism.0320.desc.keeper: "A week since you worked Boukephos' Gateway, and it has not loosened. You test it, and it holds.\n\nThe rite carries his name because he made it, and he is still out there, awake, going about an elder's business. If he knows you have put his work to use, he has not said so. You wonder what he would make of your hand in it. Few of the old rites have a maker who could still be asked; this one does."
 POD_abyss_mysticism.0320.desc.framed: "Boukephos' Gateway holds as well tonight as it did a week ago. His name is worth less than that just now. The talk has him disgraced, and Cainites who once quoted him have stopped doing so where they can be overheard.\n\nThe rite takes no interest. It answers to the words and the will behind them, and asks nothing about the reputation of the one who first set them down. You have a sound working under a soiled name, and you are in no hurry to say whose it is."
 POD_abyss_mysticism.0320.desc.outlived: "Seven nights on, Boukephos' Gateway holds. You did not have him beside you for the working and you will not have him now; wherever he is, he is beyond asking.\n\nThe rite never needed him. It needed the words in their order and a will to carry them, and you supplied both. Whatever has become of its maker, the Gateway answers the one who knows how."
 POD_abyss_mysticism.0320.a: "The rite is mine now."

###### Tier 5: The Syllable of Unbeing & Ahriman's Beckoning ######

 POD_abyss_mysticism_syllable_spoken_tt: "The Syllable holds until the sun strikes you. Then it fails within thirty nights, and afterward the Abyss may drive you into frenzy."
 POD_abyss_mysticism_syllable_already_spoken_tt: "The Syllable is already spoken over you. It cannot be laid again until it has failed and the Abyss has had its chance to collect."
 POD_abyss_mysticism_syllable_failing_toast: "The Sun Has Found You"
 POD_abyss_mysticism_syllable_failing_tt: "The Syllable of Unbeing absorbed the blow and began to unravel. It holds for thirty more nights; after that, the Abyss may drive you into frenzy."
 POD_abyss_mysticism_beckoning_slipped_tt: "#weak The dark closed on nothing it could carry: your prize is dead, already imprisoned, or yourself. The [stress|E] is spent regardless.#!"

 POD_abyss_mysticism.0331.t: "The Ward Comes Due"
 POD_abyss_mysticism.0331.desc: "The ward has been gone some nights now. Tonight everything it kept from you arrives together. The sun that struck you and did not burn is in your skin now as memory, all of it, and the Beast has been keeping count.\n\nIt takes you before you can brace. When you come back to yourself the room is not as you left it, and the dread you have carried since the ward went up is gone, spent along with everything else."
 POD_abyss_mysticism.0331.a: "Spent. And lighter for it."
 POD_abyss_mysticism.0332.t: "Spared the Reckoning"
 POD_abyss_mysticism.0332.desc: "The ward is some nights gone. You have been braced ever since, for the Beast to claim what the sun was denied, and tonight the waiting comes to a head and you stand very still.\n\nNothing rises. The hunger is the ordinary hunger; the temper is your own. Whatever the dark might have asked for its service, it does not ask tonight. You are a Cainite again, with a Cainite's reasons to mind the dawn."
 POD_abyss_mysticism.0332.a: "No price, this time."

###### Milestones (0340-0343) & the bereaved deep ######
 POD_abyss_mysticism.0300.desc.founder_dead: "Lasombra is dead. The dark you study has not grown quieter for losing its oldest student, and there is one less master to tell you what is forbidden."
 POD_abyss_mysticism.0340.t: "The First Rite Chosen"
 POD_abyss_mysticism.0340.desc: "The notes are still spread where you left them last night, and by lamplight they read like someone else's work. Diagrams copied in a careful hand. A list of things to gather. One rite, picked from all the others and underlined twice.\n\nThe texts treat the Abyss as a place with customs of its own, older than any court you have had to learn. As of yesterday you are its student. You go on looking at the words you underlined."
 POD_abyss_mysticism.0340.a: "Then I had better study well."
 POD_abyss_mysticism.0341.t: "Out of the Books"
 POD_abyss_mysticism.0341.desc: "The second time on, your hands still remember the order of it: what was said first, and where you stood when it took. For a long while the practice lived in notes and in other people's warnings. Now there is one rite you can say you have performed and seen through to its end."
 POD_abyss_mysticism.0341.a: "It can be done, then."
 POD_abyss_mysticism.0342.t: "The Dark Remains"
 POD_abyss_mysticism.0342.desc: "Something cold sits beneath your ribs where the rite let it in. It moves when you move. It answers when you reach for it, sooner than your own blood does, and it flinches from things that never troubled you before.\n\nYou press a thumb against your breastbone as though you might find the edge of it."
 POD_abyss_mysticism.0342.a: "I chose this. I will carry it."
 POD_abyss_mysticism.0343.t: "Past the Shallows"
 POD_abyss_mysticism.0343.desc: "Four nights ago you finished a rite that your earlier notes mention only to warn against. You have gone back over those warnings since. They were written by someone standing where you used to stand, and they read differently from this side.\n\nThe lesser workings feel smaller in your hands now."
 POD_abyss_mysticism.0343.a: "There is deeper still to go."
 POD_abyss_mysticism.0343.desc.syllable: "Four nights ago you spoke the Syllable of Unbeing, and the ward it set on you is still in place. How far it can be trusted you could not swear. No sane Cainite goes looking for the dawn. Still, you have started noting which shutters face east, and for once the thought comes without the old tightening in your gut."
 POD_abyss_mysticism.0343.desc.beckoning: "Four nights ago you reached into the Abyss for a person and pulled. The memory will not settle. Someone with a name was to leave the place where they stood and arrive in yours, by a road nobody is meant to walk, through a dark that does not care what it carries.\n\nYou wrote the rite out again tonight to check your work. Your hand was steady. You are less sure about the rest of you."
 POD_abyss_mysticism.0343.desc.wight: "You notice it with a weapon in your hand. The blade arrives before you have finished deciding to swing, and the blow carries more behind it than your arm should own. Four nights since Ahriman's Wight, and what the rite put into your limbs has not drained away. You doubt it will."
 POD_abyss_mysticism.0343.desc.commune: "Four nights ago your practice reached the depth where the Abyss can be asked a question. You opened your mind to the shadow and let it join with yours, and through that joining you asked one. You had braced for a riddle. The reply came whole and plain, in terms you understood at once, and it was true.\n\nOnce you had it, the shadow drew back out of your thoughts and left the answer with you."
