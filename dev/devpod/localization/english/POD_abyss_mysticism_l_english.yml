# Abyss Mysticism content: localization

 delve_rituals_of_darkness_decision: "Delve the Rituals of Darkness"
 delve_rituals_of_darkness_decision_desc: "The Shadowed hide their rites in oaths and in the flesh of murdered apprentices. The Abyss forgets none of them. Within a sealed Oubliette, a mystic may search the dark for the traces those workings left and recover what no living master will willingly teach. The search is slow, and what surfaces changes from one decade to the next."
 delve_rituals_of_darkness_decision_effect_tt: "#bold Delve for a new [bs_ritual|E].#!\nThe Abyss offers up to #V 3#! rites you do not know, weighted toward the lower tiers. Keep #V 1#!; the rest are lost. The delving cannot be repeated for #V 10#! years, and a higher level Oubliette shortens the wait."
 delve_rituals_of_darkness_decision_confirm: "Delve"
 delve_rituals_of_darkness_decision_tooltip: "Draw up to #V 3#! Abyssal Mysticism [bs_rituals|E] out of the dark and keep one. The delving cannot be repeated for years."
 delve_rituals_cooldown_tt: "You delved too recently. The delving cannot be repeated for years."
 delve_rituals_none_learnable_tt: "You already know every rite the Abyss can raise at your level of Abyssal Mysticism."

 POD_abyss_mysticism.0300.t: "The Last Lamp Out"
 POD_abyss_mysticism.0300.desc: "The syllables run for hours before anything answers. You put the lamps out one at a time. When the last dies, the far wall stands a pace farther away than it did at dusk, though nothing in the room has moved.\n\nA narrow afterimage hangs where the flame was. Something waits within it, pale and swollen. Pressure builds behind your ears. Whatever lies on the far side of the quiet has paused to see whether you are fool enough to reach for it."
 POD_abyss_mysticism.0300.opt.subsume_the_darkness: "Take the rite that closes wounds."
 POD_abyss_mysticism.0300.opt.abyssal_blade: "Learn what the steeping does to steel."
 POD_abyss_mysticism.0300.opt.one_with_the_dark: "Offer the dark a name, and ask what it hides."
 POD_abyss_mysticism.0300.opt.summoning_the_blatherskites: "Loose the swarm beneath my enemy's house."
 POD_abyss_mysticism.0300.opt.claiming_the_dark: "Make my dead flesh a vessel."
 POD_abyss_mysticism.0300.opt.call_the_legion: "Raise a legion of shades."
 POD_abyss_mysticism.0300.opt.boukephos_gateway: "Take up Boukephos' vigil."
 POD_abyss_mysticism.0300.opt.syllable_of_unbeing: "I will have the word that shields me from the sun."
 POD_abyss_mysticism.0300.opt.ahrimans_beckoning: "Learn to seize a prisoner from any court."
 POD_abyss_mysticism.0300.tt.subsume_the_darkness: "#bold Subsume the Darkness#!\nThe rite heals your superficial wounds; burns from fire and sun are not touched. For a #bold year#! afterward, feeding on mortals restores only half as much blood.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.tt.abyssal_blade: "#bold The Abyssal Blade#!\nYour equipped weapon is steeped in blood until it turns black. It gains #bold +5 prowess#! and a little #bold dread#!, and the steeping permanently removes #bold half#! its durability. A blade can be claimed only once.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.tt.one_with_the_dark: "#bold What the Dark Keeps#!\nName a soul and the Abyss reads it, then hands you what that soul hides: one secret, sometimes a second, sometimes a third. Every faith but the Road of the Abyss calls the reading sacrilege (#bold -150 piety#! unless you walk it).\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.tt.summoning_the_blatherskites: "#bold Summoning the Blatherskites#!\nA swarm of blatherskites infests the target's capital county for #bold five years#!, cutting its control growth, development growth, popular opinion, and levy reinforcement.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.tt.claiming_the_dark: "#bold Claiming the Dark#!\nYour dead flesh becomes a vessel for borrowed #bold prowess#! scaled to your Obtenebration. The #bold Abyss-Touched#! mark deepens, while fire and sun inflict #bold double#! damage for as long as you hold the dark.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.tt.call_the_legion: "#bold Call the Legion#!\nThree regiments of shades muster at your capital at no cost in gold.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.tt.boukephos_gateway: "#bold Boukephos' Gateway#!\nKeep vigil through dawn before a mirror that returns no face. The rite converts you to the #bold Road of the Abyss#! and permanently lowers the [stress|E] cost of every Abyss Mysticism rite by a tenth.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.tt.syllable_of_unbeing: "#bold The Syllable of Unbeing#!\nGrants immunity to the sun, and you no longer fear it, for as long as the Syllable holds. The first sun blow it absorbs starts its failure: it lasts #bold thirty more nights#!, and afterward the Abyss may drive you into frenzy.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.tt.ahrimans_beckoning: "#bold Ahriman's Beckoning#!\nThe Abyss seizes one living target from any court within your reach and delivers them to your dungeon, marked #bold Abyss-Taken#!. Their people will know who took them.\n#weak Once learned, the rite may be cast again, with the usual risk of a miscast.#!"
 POD_abyss_mysticism.0300.learned_toast: "A rite is raised out of the deep"
 POD_abyss_mysticism.0300.z: "Take none of them."

 POD_abyss_mysticism.0310.t: "The Attention Stays"
 POD_abyss_mysticism.0310.desc: "The working closed a night ago, and by now the room ought to be an ordinary room again. A cup left standing since then is warm on the side that faced the empty room. Smoke from a snuffed wick still hangs an arm's length above it, going nowhere.\n\nWhatever raised its head as the working passed through remains attentive. The corners stay empty; the presence needs no body. It regards you for a second night from the chamber you thought you had cleared."
 POD_abyss_mysticism.0310.a: "It looked up. Let it find me unafraid."

 POD_abyss_mysticism_abyssal_blade_no_weapon_tt: "#weak No unclaimed weapon was equipped when the rite closed, so nothing was steeped. The [stress|E] is spent regardless.#!"
 POD_abyss_mysticism_abyssal_blade_already_steeped_tt: "Your equipped weapon already carries the dark. A blade can be claimed only once."

 let_the_darkness_go_decision: "Let the Darkness Go"
 let_the_darkness_go_decision_desc: "Your claim on the dark remains an open bargain. Release it, and the Abyss pours out of your dead flesh, taking the borrowed strength and your heightened vulnerability to flame."
 let_the_darkness_go_decision_effect_tt: "#bold Release the claimed dark.#!\nThe held claim is removed: the borrowed [prowess|E] goes, and fire and sunlight lose their doubled purchase on you."
 let_the_darkness_go_decision_confirm: "Release it"
 let_the_darkness_go_decision_tooltip: "Release the claimed dark. The borrowed [prowess|E] goes, and fire and sun no longer deal double damage to you."
 POD_abyss_mysticism_claiming_already_held_tt: "You already hold a claim on the dark. Release it with the $let_the_darkness_go_decision$ [decision|E] before claiming anew."

###### Tier 3 casts & botches ######

 POD_abyss_mysticism_one_with_the_dark_reveal_tt: "One [secret|E] your target keeps is revealed to you alone, with a #V 50%#! chance of a second and a #V 25%#! chance of a third."
 POD_abyss_mysticism_one_with_the_dark_fallback_tt: "Your target keeps no [secret|E] the dark can lift. Instead, the reading exposes a weakness and grants you a weak [hook|E] on them plus Intrigue [lifestyle|E] experience."
 POD_abyss_mysticism_blatherskites_no_lands_tt: "#weak Your target holds no [county|E] for the swarm to infest, so nothing is loosed. The [stress|E] is spent regardless.#!"

 POD_abyss_mysticism.0311.t: "The Narrow Way Back"
 POD_abyss_mysticism.0311.desc: "Frost blooms along the underside of your shadow when the lamps go down and lingers until an hour before dawn. Where it gathers, the shadow no longer quite follows you: a hand moves a moment late, a shoulder bends after yours has gone still..\n\nThe working reached its destination and did what was asked. Something followed the path back. It did not cross cleanly, and for a while your shadow will bear the damage."
 POD_abyss_mysticism.0311.a: "Given time, it will close."

 POD_abyss_mysticism.0312.t: "A Tune Nobody Owns"
 POD_abyss_mysticism.0312.desc: "By the second night, a groom hums the rite's last syllable over his work. He cannot have heard the sound or known its tongue, and looks startled when you ask where he learned it.\n\nSomehow the final syllable escaped the rite. Someone heard it below, or dreamed it, or repeated it without knowing why. Now it has begun to travel..."
 POD_abyss_mysticism.0312.a: "No one hums it twice where I sleep."
 POD_abyss_mysticism.0312.trust_tt: "#R -2 Standing at court#!\nRumors of your secret working now circulate at court."

 POD_abyss_mysticism.0313.t: "Something Stayed"
 POD_abyss_mysticism.0313.desc: "Something came up through the working and remained.\n\nAt the end of the west hall, it appears when the lamp passes and vanishes before the light returns. It neither moves nor speaks. Its shape comes near enough to a person that the eye keeps trying to complete it, always wrongly. On the third night, someone leaves a bowl for it. By morning the untouched bowl is gone, and no one admits to having moved it."
 POD_abyss_mysticism.0313.a: "A year of it, and no more."

 POD_abyss_mysticism.0315.t: "In Your Own Voice"
 POD_abyss_mysticism.0315.desc: "A courtier is speaking in your voice. The imitation is exact, down to the cadence, though the words come from a mouth that has no business holding them. He remains unaware while everyone else looks politely aside.\n\nThe reading opened both ways. You sent the dark into another soul, and something came back carrying pieces of you. Now your words are turning up in mouths that never heard you speak them."
 POD_abyss_mysticism.0315.a: "I knew the risk when I opened it."
 POD_abyss_mysticism.0315.nothing_tt: "#weak You keep nothing hidden that the dark can carry away. It passes through you and returns with nothing to reveal.#!"

 POD_abyss_mysticism.0316.t: "Too Many Fingers"
 POD_abyss_mysticism.0316.desc: "Wet handprints mark the rafters by morning, each with too many fingers.\n\nWhatever scent the summoning left behind, Part of the swarm has followed it home, fewer and quieter than those you sent. Beyond the last light, their mouthless noises draw nearer each night. Soon they will reach whatever waits at your door."
 POD_abyss_mysticism.0316.a: "Vermin of my own making."
 POD_abyss_mysticism.0316.homeless_tt: "#weak You hold no seat for them to infest. The blatherskites follow the trail back, find only open road where a threshold should be, and return below.#!"

 POD_abyss_mysticism.0317.t: "The Gate Pulls"
 POD_abyss_mysticism.0317.desc: "The gate remains open behind your heart, beyond the reach of any closing rite. You finish the final syllable and discover that your body has become very far away.\n\nSight goes first. Then sound. By the time you understand that the rite has pulled more through the gate than you intended, there is no strength left to call yourself back. Your body falls into torpor while whatever remains of your will slowly finds its way home."
 POD_abyss_mysticism.0317.a: "Then I pay the toll asleep."

###### Tier 4: Call the Legion & Boukephos' Gateway ######

 POD_abyss_mysticism_minacious_legion_army: "The Minacious Legion"

 POD_abyss_mysticism_gateway_already_open_tt: "Your gateway already stands open. There is no rite for opening a door twice."

 POD_abyss_mysticism.0320.t: "The Mirror Returns"
 POD_abyss_mysticism.0320.desc.keeper: "On the seventh night, a mirror appears in a room where no one hung one. It returns no face. The rite prescribed no second vigil, yet one comes due and is kept, awake or otherwise.\n\nSomething on the far side takes your measure through the black glass. It has been waiting since before Alexander marched and shows no sign of haste. Something watches through the black glass. It knows the rite. It knows where you stood when you performed it. Whether it is the first hand to work the gateway or only something that remembers being him, the mirror offers no way to tell."
 POD_abyss_mysticism.0320.desc.framed: "On the seventh night, the rite's first maker is occupied by troubles of his own. His house has drawn back from him over a deed planted in the memories of witnesses who determine his standing, and he will not soon escape the disgrace.\n\nNone of that reaches the glass. The impression he pressed into the working attends you without distraction. The mirror offers neither face nor message and remains until the night ends."
 POD_abyss_mysticism.0320.desc.outlived: "The far side of the mirror is vacant, its black glass reflecting no face.\n\nOn the seventh night it stands in a room that was empty when you last entered. The maker may be dead or beyond reach; no answer tells you which. At length, a thought arrives without a voice: 'No keeper answers.' Silence holds until dawn."
 POD_abyss_mysticism.0320.a: "The vigil is complete. Let the gateway stand."

###### Tier 5: The Syllable of Unbeing & Ahriman's Beckoning ######

 POD_abyss_mysticism_syllable_spoken_tt: "The Syllable holds until the sun strikes you. Then it fails within thirty nights, and afterward the Abyss may drive you into frenzy."
 POD_abyss_mysticism_syllable_already_spoken_tt: "The Syllable is already spoken over you. It cannot be laid again until it has failed and the Abyss has had its chance to collect."
 POD_abyss_mysticism_syllable_failing_toast: "The Sun Has Found You"
 POD_abyss_mysticism_syllable_failing_tt: "The Syllable of Unbeing absorbed the blow and began to unravel. It holds for thirty more nights; after that, the Abyss may drive you into frenzy."
 POD_abyss_mysticism_beckoning_slipped_tt: "#weak The dark closed on nothing it could carry: your prize is dead, already imprisoned, or yourself. The [stress|E] is spent regardless.#!"

 POD_abyss_mysticism.0331.t: "The Darkness Collects"
 POD_abyss_mysticism.0331.desc: "It comes ten nights after the Syllable failed. The sun found you, the word unravelled on schedule, and dawn stopped passing you over. When your flesh remembered what daylight costs, you took the renewed pain for the whole price.\n\nTonight the Abyss collects the rest. Every dawn the Syllable turned aside is charged to you at once, and for one clear moment you understand the sum before the Beast takes over."
 POD_abyss_mysticism.0331.a: "Then let the Beast have what it is owed."
 POD_abyss_mysticism.0332.t: "Nothing Comes to Collect"
 POD_abyss_mysticism.0332.desc: "You spend the night waiting in vain. The Syllable failed several nights ago; the sun's old weight returned without ceremony, and the word is simply spent.\n\nSomewhere below, the Abyss has set your account aside. Perhaps it was balanced or too small to collect; no answer comes. A faint taste of iron lingers for an hour and then fades."
 POD_abyss_mysticism.0332.a: "The sun and I resume our old terms."

###### Milestones (0340-0343) & the bereaved deep ######
 POD_abyss_mysticism.0300.desc.founder_dead: "\n\nThe deep feels the founder's absence. Its rites still surface, but the force that raises them now circles the vacancy he left. As you delve, that pressure gathers around you."
 POD_abyss_mysticism.0340.t: "A Grave Still in Use"
 POD_abyss_mysticism.0340.desc: "The chamber where the rite was buried does not look empty after you open it. A dark mark remains against the wall at the height of a kneeling man, though nothing you carry will scrape or wash it away.\n\nYou climb the stairs with the rite committed to memory. Halfway up, you realize the return journey has taken one step more than the descent.\n\nAt the third stair you look back.\n\nYour shadow is still standing in the doorway below."
 POD_abyss_mysticism.0340.a: "I inherit the scars and the rites."
 POD_abyss_mysticism.0341.t: "The Second Mouth"
 POD_abyss_mysticism.0341.desc: "The rite closes with its price paid to the last syllable. Then your voice stops and the words continue.\n\nThey come from somewhere just beneath hearing, half a beat behind you, completing the cadence exactly as you were taught it. The next time you perform a rite, the second voice returns. On the third, it anticipates the final word."
 POD_abyss_mysticism.0341.a: "Then we practice together."
 POD_abyss_mysticism.0342.t: "A Shade Too Deep"
 POD_abyss_mysticism.0342.desc: "Your courtiers noticed the change in your eyes before you did. Conversation drops half a tone when you enter and never quite recovers, though no one will explain why. The bolder among them have begun watching your shadow as if it were the one attending; last night, one bowed to it. A lamp still follows you through the house, now held at arm's length by a bearer who waits anxiously for leave to go."
 POD_abyss_mysticism.0342.a: "Let them look their fill."
 POD_abyss_mysticism.0343.t: "Adept No Longer"
 POD_abyss_mysticism.0343.desc: "Your chamber has acquired a cold that gathers around you instead of radiating from your skin. The Road calls some rites deep. You have cast one, and paid its price.\n\nThe household noticed before you spoke. Candles now require a second lighting, and the dogs keep to the far side of the yard. After dusk, your servants leave the rest of the night unplanned."
 POD_abyss_mysticism.0343.a: "They are right to be careful."
 POD_abyss_mysticism.0343.desc.syllable: "You spoke the sun's true name backward over your flesh. Since then dawn reaches the sill without touching you, and the Abyss waits for the day the sun finds you. Your people know the change began that night, though they cannot explain it."
 POD_abyss_mysticism.0343.desc.beckoning: "Whoever keeps the watch now does so from inside the hall, his back against the wall. No one ordered the change.\n\nOn the night of the working, every lamp in the house dimmed at once. For several breaths the darkness beneath them all leaned in the same direction, toward the chair nearest the hearth.\n\nNo one has sat there since."
 POD_abyss_mysticism.0343.desc.wight: "The working left a stillness in the house. Its wight neither tires nor needs repeated orders; it can hold one posture for most of an hour. The body obeys with a permanence no hired servant could match. Training now uses wooden staves, a precaution adopted without discussion."
 POD_abyss_mysticism.0343.desc.commune: "The answer continues for four nights after you ask the question. Beneath the sounds of horses in the yard and servants speaking your name, something replies at a pitch just below speech. Only you hear the response, which never repeats and shows no sign of ending. Twice you have replied to questions no one else asked. The household now watches you wait half a breath before speaking, as though another voice must finish first."
