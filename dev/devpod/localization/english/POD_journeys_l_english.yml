 spell_of_life_stage2_random_journey_name: "Pursue Esoteric Knowledge"
 spell_of_life_stage2_random_journey_tt: "Nothing remains hidden forever."
 spell_of_life_stage2_random_journey_desc: "Secrets are hidden among the dead and in their tongues. Given enough time, I am certain that I can refine my knowledge of the [Concept('POD_spell_of_life', 'Spell Of Life')|E], simply by obtaining rare documents and translating them. However, there are faster, albeit less certain, options. Many cabals and cults have previously sought the [Concept('POD_spell_of_life', 'Spell Of Life')|E] and failed. I could scour the ruins of ancient temples and tombs for their lost secrets, at risk of my life. In addition, I could hasten the translation process with alchemy and magic, at risk of destroying the document. All of it risks time that could be spent pursuing other projects, though it might be worth it."
 spell_of_life_stage2_random_journey_effects: "You will start gathering information about possible locations of these records."
 spell_of_life_stage2_random_journey_isvalid: ""
 spell_of_life_stage2_random_journey_planning_title: "A Clue was Discovered"
 spell_of_life_stage2_random_journey_planning_desc: "My scouts have finally returned to me with good news: evidence of clues left in a place long-forgotten.\n\nNow that I know where to go, I can acquire it. Hopefully, the trials are not too difficult."
 spell_of_life_stage2_random_journey_planning_confirm: "$POD_journey_planning_confirm_default$"
 spell_of_life_stage2_random_journey_planning_decline: "$POD_journey_planning_decline_default$"
 spell_of_life_stage2_random_journey_travel_title: "On the Hunt for Knowledge"
 spell_of_life_stage2_random_journey_travel_desc: "Many have sought the Spell of Life, and all have failed. Only one besides Isis herself has ever succeeded, and even he created a flawed version. However, among the remains of the failed and the scholarly are clues that could enhance my understanding of the Spell of Life and refine my current efforts."
 spell_of_life_stage2_random_journey_travel_confirm: "Soon two will have mastered it"



 elixir_of_eternal_life_stage2_meditation_name: "Meditate Upon Eternity"
 elixir_of_eternal_life_stage2_meditation_tt: "I shall meditate upon [Concept('POD_elixir_of_eternal_life', 'eternal rebirth')|E]"
 elixir_of_eternal_life_stage2_meditation_desc: ""
 elixir_of_eternal_life_stage2_meditation_effects: ""
 elixir_of_eternal_life_stage2_meditation_isvalid: ""
 elixir_of_eternal_life_stage2_meditation_planning_title: "Preparations Complete"
 elixir_of_eternal_life_stage2_meditation_planning_desc: "With your preparations complete, everything is ready to begin. You have even found a place rich in energy and deeply tied to the world around it, a valuable opportunity to further your efforts. There may be those that take advantage of your absence, but the insights could be worth it."
 elixir_of_eternal_life_stage2_meditation_planning_confirm: "$POD_journey_planning_confirm_default$"
 elixir_of_eternal_life_stage2_meditation_planning_decline: "$POD_journey_planning_decline_default$"
 elixir_of_eternal_life_stage2_meditation_travel_title: "The Time Has Come"
 elixir_of_eternal_life_stage2_meditation_travel_desc: "Your foundations must be firmed up, and your knowledge of the [Concept('POD_elixir_of_eternal_life', 'Elixir of Eternal Rebirth')|E] must be refined. Everything has been prepared for you to seclude yourself."
 elixir_of_eternal_life_stage2_meditation_travel_confirm: "$POD_journey_planning_confirm_default$"

 elixir_of_eternal_life_stage2_random_journey_name: "Pursue Esoteric Knowledge"
 elixir_of_eternal_life_stage2_random_journey_tt: "A thousand paths lead to the same destination."
 elixir_of_eternal_life_stage2_random_journey_desc: "Given enough time, I am certain that I can refine my knowledge of the [Concept('POD_elixir_of_eternal_life', 'Elixir of Eternal Rebirth')|E], simply by obtaining rare documents and translating them. Many secrets are hidden among the dead and in their tongues. Various mages, sorcerers, alchemists, gurus, and masters have previously sought the [Concept('POD_elixir_of_eternal_life', 'Elixir of Eternal Rebirth')|E] and failed. I could scour the ruins of ancient temples and tombs for their lost secrets, at risk of my life. In addition, I could hasten the translation process with alchemy and magic, at risk of destroying the document. Meditation or brewing could offer insights too. All of it risks time that could be spent pursuing other projects, though it might be worth it."
 elixir_of_eternal_life_stage2_random_journey_effects: "You will start gathering information about possible locations of these records."
 elixir_of_eternal_life_stage2_random_journey_isvalid: ""
 elixir_of_eternal_life_stage2_random_journey_planning_title: "A Clue was Discovered"
 elixir_of_eternal_life_stage2_random_journey_planning_desc: "My scouts have finally returned to me with good news: evidence of clues left in a place long-forgotten.\n\nNow that I know where to go, I can acquire it. Hopefully, the trials to reach and understand it are not too difficult."
 elixir_of_eternal_life_stage2_random_journey_planning_confirm: "$POD_journey_planning_confirm_default$"
 elixir_of_eternal_life_stage2_random_journey_planning_decline: "$POD_journey_planning_decline_default$"
 elixir_of_eternal_life_stage2_random_journey_travel_title: "On the Hunt for Knowledge"
 elixir_of_eternal_life_stage2_random_journey_travel_desc: "The Elixir of Eternal Life is something that must be sought rather than given. With a clue discovered, it is time to take another step along the path."
 elixir_of_eternal_life_stage2_random_journey_travel_confirm: "It is time to begin..."


 
 find_artifact_name: "Search for an Artifact"
 find_artifact_desc: "Select an [artifact|E] to search for."
 find_artifact_tt: "This treasure should belong to me."
 
 assemble_artifact_name: "Assemble an Artifact"
 assemble_artifact_desc: "Select an [artifact|E] to search for."
 assemble_artifact_tt: "Knowledge has its price."
 assemble_artifact_planning_title: "Another Piece of the Puzzle"
 assemble_artifact_planning_desc: "At last, my scouts have returned to me with good news. They found out where another chapter of the Book of Nod can be found. Retrieving it would bring me one step closer to completing the volume.\n\nI can only hope that whoever currently holds it can be... persuaded to part with it."
 assemble_artifact_planning_confirm: "$POD_journey_planning_confirm_default$"
 assemble_artifact_planning_decline: "$POD_journey_planning_decline_default$"
 assemble_artifact_travel_title: ""
 assemble_artifact_travel_desc: ""
 assemble_artifact_travel_confirm: ""
 
 golconda_1_name: "Learn to Master your Beast"
 golconda_1_desc: "There are rumors of $POD_splat_vampire_plural$ who managed to transcend [Glossary('The Beast','game_concept_beast_desc')] for good, reaching a state where they no longer need to drink blood. It sounds too good to be true, but if there are answers out there, they are worth finding."
 golconda_1_effects: "You will learn the location of a teacher who can set you on the right path."
 golconda_1_tt: "Can inner peace be possible?"
 golconda_1_planning_title: "Understanding the Enemy Within"
 golconda_1_planning_desc: "#beast Hunger#! is something every $pod_cainite$ learns to endure... or indulge. It becomes background noise. An unchangeable fact of our existence.\n\nBut does it have to be?\n\nMy scouts have told me about a place where I can find more answers."
 golconda_1_planning_confirm: "$POD_journey_planning_confirm_default$"
 golconda_1_planning_decline: "$POD_journey_planning_decline_default$"
 golconda_1_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 golconda_1_travel_desc: "There must be something uncanny about the answers I seek. Does not every $pod_cainite$ seek reprieve from [Glossary('The Beast','game_concept_beast_desc')]? Then why aren't the solutions to this problem more commonly known? I suppose I'll soon find out why."
 golconda_1_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 golconda_2_name: "Make Peace with your Beast"
 golconda_2_desc: "Now that I know about the path of [golconda|E], I'm faced with the difficult task of gaining a deep understanding of my [Glossary('Beast','game_concept_beast_desc')]. Many who came before me have spent centuries on such an endeavor, with naught to show for it but frustration. Could I succeed where they failed?"
 golconda_2_effects: "You will gain [trait_level_track_xp|E] as a [GetTrait('golconda_seeker').GetName(GetPlayer)]. You will also gain the [trait|E] if you don't already have it.\n\nThe more [trait_level_track_xp|E] you have, the higher your chances of making an important breakthrough.\n\n#X All progress on this [journey|E] is lost when entering frenzy, or upon committing murder or theft.#!"
 golconda_2_isvalid: "$EFFECT_LIST_BULLET$You have no [men_at_arms|E] that were created via heinous acts #weak ([GetMaA('szlachta').GetName] or [GetMaA('vozhd').GetName])#!"
 golconda_2_trigger: "You need to disband any [men_at_arms|E] that were created via heinous acts #weak ([GetMaA('szlachta').GetName] or [GetMaA('vozhd').GetName])#!"
 golconda_2_tt: "A journey of a thousand steps."
 golconda_2_planning_title: "Contemplating the Inner Predator"
 golconda_2_planning_desc: "[Glossary('The Beast','game_concept_beast_desc')] has been gnawing at the back of my mind as usual, and I've spent a good while observing it and trying to gain a deeper understanding of its behavior.\n\nI need some quiet time to think more deeply on what I've learned.\n\nThis will likely cause some [stress|E]."
 golconda_2_planning_confirm: "I'm ready."
 golconda_2_planning_decline: "I should contemplate this at a less stressful time."
# golconda_2_travel_title: ""
# golconda_2_travel_desc: ""
# golconda_2_travel_confirm: ""
 golconda_widget_desc: "Continue making peace with your [Glossary('Beast','game_concept_beast_desc')]?"
 golconda_widget_tt: "You will immediately start another [journey|E] to gain insight into [golconda|E].\nCost: [piety_i|E] #V 1000#!"
 
 golconda_3_name: "The Suspire"
 golconda_3_desc: "All of my preparations have led to this. I will face down [Glossary('The Beast','game_concept_beast_desc')], once and for all."
 golconda_3_effects: "You will enter the deepest recesses of your soul for the final confrontation.\n\n#X Based on your [trait_level_track_xp|E] as a [GetTrait('golconda_seeker').GetName(GetPlayer)], you have a #V [GetPlayer.MakeScope.ScriptValue('suspire_success_chance')]%#! chance of making it out with your mind intact.#!"
 golconda_3_tt: "All or nothing."
 golconda_3_planning_title: "Final Destination"
 golconda_3_planning_desc: "I know what I have to do. I will let the $pod_vitae$ bolster my senses, not unlike using [GetTrait('auspex').GetName(GetNullCharacter)]. Then I will send my awareness within, to the place where [Glossary('The Beast','game_concept_beast_desc')] resides.\n\nWhat I don't know is what will await me.\n\nOnly one way to find out."
 golconda_3_planning_confirm: "Time for a leap of faith."
 golconda_3_planning_decline: "It's not quite time to leap yet."
