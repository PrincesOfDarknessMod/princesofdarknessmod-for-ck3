 spell_of_life_stage2_targeted_journey_astrokhen_name: "Learn From [GetScriptedCharacterByHistoryID('792858').GetFirstName]"
 spell_of_life_stage2_targeted_journey_astrokhen_desc: "Once an ambitious mage in ancient Egypt, [GetScriptedCharacterByHistoryID('792858').GetFirstName] sought the immortality of mummies. While [GetScriptedCharacterByHistoryID('792593').GetFirstName] denied him, he eventually proved persuasive and obtained immortality from [GetScriptedCharacterByHistoryID('792600').GetFirstName]. [GetScriptedCharacterByHistoryID('792858').GetFirstName] was forced by [GetScriptedCharacterByHistoryID('792593').GetFirstName] to serve as a guardian for many powerful and ancient artifacts. This time allowed [GetScriptedCharacterByHistoryID('792593').GetHerHim] to further his own research into the Spell of Life."
 spell_of_life_stage2_targeted_journey_astrokhen_effects: "You will journey to meet with [GetScriptedCharacterByHistoryID('792858').GetFirstName]. After traveling there, you can convince [GetScriptedCharacterByHistoryID('792858').GetHerHim] to study under [GetScriptedCharacterByHistoryID('792858').GetHerHim]."
