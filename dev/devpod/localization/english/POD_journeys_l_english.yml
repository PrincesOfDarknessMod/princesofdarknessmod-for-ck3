 seek_knowledge_animalism_name: "Learn Discipline ([GetTrait('animalism').GetName(GetNullCharacter)])"
 seek_knowledge_animalism_desc: "[GetTrait('animalism').GetName(GetNullCharacter)] is the $pod_discipline$ of control over animals. It unlocks several animal-related abilities, like [GetPerk('bond_famulus_perk').GetName(GetPlayer)] or [GetPerk('call_of_the_wild_perk').GetName(GetPlayer)]."
