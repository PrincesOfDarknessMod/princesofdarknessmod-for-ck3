 azhi_dahaka_1_name: "Path of the Dragon"
 azhi_dahaka_1_desc: "Azhi Dahaka is Persian for the three-headed dragon of the demon Ahriman. To the [GetTrait('tzimisce').GetName(GetNullCharacter)], it is the Metamorphosist's Holy Grail, an enlightened and ultimate state of being, brought on by extensive use of [GetTrait('vicissitude').GetName(GetPlayer)].\n\nYour studies have confirmed your first impression, there isn't one way to Azhi Dahaka but many. You will have to forge your path through rigorous study and extensive experimentation."
 azhi_dahaka_1_effects: "You will gain [trait_level_track_xp|E] in [GetTrait('azhi_dahaka_scholar').GetName(GetPlayer)] at the end of the [journey|E]. The amount of [trait_level_track_xp|E] gained scales with your [learning|E] and [Glossary('Generation','game_concept_vampgeneration_desc')]."
 azhi_dahaka_1_tt: "Eternal Change."
 azhi_dahaka_1_planning_title: "Path of the Dragon"
 azhi_dahaka_1_planning_desc: "I can only devote so much time to the pursuit of Azhi Dahaka, stagnation will never be the way forward. I need to assess my current progress from another perspective."
 azhi_dahaka_1_planning_confirm: "$POD_journey_planning_confirm_default$"
 azhi_dahaka_1_planning_decline: "$POD_journey_planning_decline_default$"
 azhi_dahaka_1_travel_title: "Path of the Dragon"
 azhi_dahaka_1_travel_desc: "Years spent chasing a single thread, but does it lead to the Dragon?"
 azhi_dahaka_1_travel_confirm: "Change is the constant."
 azhi_dahaka_widget_tt: "You will immediately start another [journey|E] to gain insight into Azhi Dahaka\nCost: [piety_i|E] #V 1000#!"
 azhi_dahaka_widget_desc: "Continue seeking perfection?"
 azhi_dahaka_not_enough_piety: "You do not have enough [piety_i|E] to start another [journey|E]"


 azhi_dahaka_2_name: "Ritual of Ascension"
 azhi_dahaka_2_desc: "Azhi Dahaka is not some Nirvana where the Metamorphosist achieves oneness with the universe, but rather the opposite — to undergo Metamorphosis is to completely separate oneself from Creation, to be a self-sufficient will in a universe that holds no more power over the ego.\nSome believe so, anyway. Metamorphosis is a lonely pursuit. Will you truly achieve it? Or will you just lose yourself in a maelstrom of eternal change?\nTo become the Dragon of Eternal Change, one must reinvent themselves in body and mind. You have prepared the grandest of rituals to achieve this."
 azhi_dahaka_2_effects: "You will become the #TOOLTIP:GAME_TRAIT,azhi_dahaka,[GetNullCharacter] #L Dragon of Eternal Change#!#!."
 azhi_dahaka_2_tt: "The primordial dragon roars."
 azhi_dahaka_2_planning_title: "Ritual of Ascension"
 azhi_dahaka_2_planning_desc: "The ritual is ready. It is time to step forward and find the dragon's beating heart from where chaos and forever meet... and then drink from it."
 azhi_dahaka_2_planning_confirm: "$POD_journey_planning_confirm_default$"
 azhi_dahaka_2_planning_decline: "$POD_journey_planning_decline_default$"
 azhi_dahaka_2_travel_title: "Ritual of Ascension"
 azhi_dahaka_2_travel_desc: "I am at the epicenter of this maelstrom."
 azhi_dahaka_2_travel_confirm: "The dragon waits for me."

 hunt_for_sargon_codex_shard_name: "Hunt for Shards of the Sargon Codex"
 hunt_for_sargon_codex_shard_desc: "The Sargon Codex is a clay tablet written by Cappadocius during his mortal years. After his $pod_Embrace$, the loss of his Avatar caused chaos and destruction within his memories. He could not remember what he had written or where he had left it. After millennia, the Sargon Codex was destroyed and its parts scattered across the world. Were someone to restore it, immense power would await them."
 hunt_for_sargon_codex_shard_effects: "You will start gathering information about possible locations of the Sargon Codex's shards."
 hunt_for_sargon_codex_shard_tt: "The magnum opus of a peerless scholar."
 hunt_for_sargon_codex_shard_isvalid: "$EFFECT_LIST_BULLET$There are still shards left to discover."
 hunt_for_sargon_codex_shard_planning_title: "A Shard was Discovered"
 hunt_for_sargon_codex_shard_planning_desc: "My scouts have finally returned to me with good news: the general location of one of the pieces of the Sargon Codex.\n\nNow that I know where to go, I can liberate it.\n\nWith force, if necessary."
 hunt_for_sargon_codex_shard_planning_confirm: "$POD_journey_planning_confirm_default$"
 hunt_for_sargon_codex_shard_planning_decline: "$POD_journey_planning_decline_default$"
 hunt_for_sargon_codex_shard_travel_title: "On the Hunt for Knowledge"
 hunt_for_sargon_codex_shard_travel_desc: "The Sargon Codex was scattered to the four winds, long ago. Assembling all the pieces will be an immense task. Yet for a seeker of knowledge, the prize at the end makes all the efforts worth it."
 hunt_for_sargon_codex_shard_travel_confirm: "Cappadocius will surely bless this endeavor."


