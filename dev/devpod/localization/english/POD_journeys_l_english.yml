 hunt_in_capital_name: "Hunt in your Capital"
 hunt_in_capital_desc: "Every $pod_cainite$ is driven by a thirst for blood, and I am no different. The domain of [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] shall be my hunting ground in the coming nights.\n\n#help (You can also hunt a specific character by right-clicking them and selecting the Hunt [journey|E] via [character_interaction|E].)#!"
 #hunt_in_capital_effects: ""
 hunt_in_capital_tt: "Time to slake my thirst."
 hunt_in_capital_planning_title: "On the Hunt"
 hunt_in_capital_planning_desc: "Once more it's time for me to slake my hunger on the mortals of [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier].\n\nI should make time for a hunt once I'm less occupied."
 hunt_in_capital_planning_desc_gui: "Wandering the streets of [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], I find a number of mortals nearby that would be vulnerable to my machinations.\n\nI only have time to pursue one of them."
 hunt_in_capital_planning_confirm: "Unfortunately, I can't hunt right now."
 hunt_in_capital_planning_confirm_gui: "Hunt the selected character and drink their blood."
 hunt_in_capital_planning_confirm_gui_tt_nextevent: "You can decide what to do with [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstName] once [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetSheHe] is in your clutches."
 hunt_in_capital_planning_confirm_gui_tt_court: "[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstName] will stay at your court afterwards."
 hunt_in_capital_planning_confirm_gui_tt_others: "You will not see the other mortals again."
 hunt_in_capital_planning_restart: "None of these choices suit me. I'll try another hunt."
 hunt_in_capital_planning_decline: "$POD_journey_planning_decline_default$"
 hunt_in_capital_planning_decline_gui: "I changed my mind. Abandon the hunt."
 hunt_in_capital_planning_decline_tt: "Your [journey|E] to $POD_current_journey$ will end."
 hunt_in_capital_planning_decline_tt_2: "You will not see these mortals again."
 hunt_in_capital_widget_desc: "Continue hunting for #bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagKey ))]#!?"
 hunt_in_capital_widget_tt: "You will immediately start another [journey|E] to hunt for #bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagKey ))]#! in your capital.\n[GetPlayer.Custom('PODShowJourneyCostHunt')]"
 cthonic_womb_widget_desc: "Turn [EventWindowWidget.GetScope.sC('victim').GetShortUINameNoTooltip] into a [GetTrait('wraith').GetName(GetNullCharacter)] after killing [EventWindowWidget.GetScope.sC('victim').GetHerHim]?"
 cthonic_womb_widget_tt: "#help This only works if you drain your victim completely.#!"
 
 fera_training_name: "Train with your [GetPlayer.Custom('PODCoterieNoTooltip')]"
 fera_training_desc: "Much more than simple friends, the members of your [GetPlayer.Custom('PODCoterieNoTooltip')] are the ones that will always have your back in the most dire of situations. You must be prepared for everything as a team."
 fera_training_effects: "You will review your [GetPlayer.Custom('PODCoterie')] and decide which form of training to focus on.\nA [pack_totem|E] can be chosen if your [GetPlayer.Custom('PODCoterieNoTooltip')] has five members in it."
 fera_training_isvalid: "$EFFECT_LIST_BULLET$You need to have a [GetPlayer.Custom('PODCoterie')] with at least #V 1#! other member."
 fera_training_tt: "[GetPlayer.GetFaith.HighGodName] has need of powerful soldiers."
 fera_training_planning_title: "Honing Claw and Fang"
 fera_training_planning_desc: "The members of $POD_player_coterie$ have found the time to get together for another training session.\n\nThis will help us work better as a team, and do the work that [GetPlayer.GetFaith.HighGodName] needs us to do."
 fera_training_planning_confirm: "We'll start the training session right away!"
 fera_training_planning_decline: "$POD_journey_planning_decline_default$"
 fera_training_widget_desc: "Continue training with your [GetPlayer.Custom('PODCoterie')]?"
 fera_training_widget_tt: "You will immediately start another [journey|E] to train with your [GetPlayer.Custom('PODCoterie')]."

 fera_spirit_quest_name: "Embark on a Spirit Quest"
 fera_spirit_quest_desc: "Spirits are the teachers of the $glossary_fera$ world, but learning their gifts comes at a price. A Spirit Quest will take you on a journey filled with diverse encounters."
 fera_spirit_quest_effects: "You will be able to pick from a list of rewards at the end of your quest:\n$EFFECT_LIST_BULLET$$glossary_fera$ [lifestyle_experience|E]\n$EFFECT_LIST_BULLET$Fetish [artifacts|El]\n$EFFECT_LIST_BULLET$Lifestyle or Fame [traits|E]\n$EFFECT_LIST_BULLET$A friendly [GetTrait('spirit').GetName(GetNullCharacter)]\n\nWhat rewards are available as well as their quality or quality depend on your chosen quest's difficulty, your [learning|E], and [piety_level|E]."
 fera_spirit_quest_tt: "Heed their pleas, and learn their powers."
 fera_spirit_quest_planning_title: "Quest Complete"
 fera_spirit_quest_planning_desc: "Your Spirit Quest is at an end. It is time to commune with the Spirits and claim your rewards."
 fera_spirit_quest_planning_confirm: "My task is complete."
 fera_spirit_quest_planning_decline: "$POD_journey_planning_decline_default$"


 mokole_mnesis_quest_name: "Journey through Mnesis"
 mokole_mnesis_quest_desc: "The powers of the ancient [GetTrait('mokole').GetName(GetNullCharacter)] have been lost to the ages. With the power of Mnesis, a Mokolé may swim the river of time through their ancestors' memories in search of these forgotten powers."
 mokole_mnesis_quest_effects: "You will gain [mnesis_lifestyle|E] [lifestyle_experience|E] at the end of the [journey|E]. The length and difficulty of the [journey|E] is determined by how far back you are trying to remember.\nThe amount of [lifestyle_experience|E] you gain is determined by the following:\n$EFFECT_LIST_BULLET$[learning|E]\n$EFFECT_LIST_BULLET$[prestige_level|E]\n$EFFECT_LIST_BULLET$[piety_level|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level|E]\n$EFFECT_LIST_BULLET$[GetTrait('mokole').GetName(GetNullCharacter)] [trait_level_track_xp|E]\n\nA negative modifier will be applied during the journey as you enter a deep sleep. You may also be attacked by Dream Hunters, opportunistic $POD_splat_spirit_plural$ that seek to harm you."
 mokole_mnesis_quest_tt: "The River of Mnesis is deep."
 mokole_mnesis_quest_planning_title: "Memories Regained"
 mokole_mnesis_quest_planning_desc: "Your journey through the rivers of Mnesis is complete.\nMany visions and memories still cling to your mind, but what did you learn?"
 mokole_mnesis_quest_planning_confirm: "I remember now."
 mokole_mnesis_quest_planning_decline: "$POD_journey_planning_decline_default$"

 
