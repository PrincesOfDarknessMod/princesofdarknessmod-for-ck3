 seek_knowledge_thaumaturgy_name: "Learn [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Thaumaturgy)"
 seek_knowledge_thaumaturgy_desc: "[GetTrait('bloodsorcery').GetName(GetNullCharacter)] is a mysterious $pod_discipline$ most commonly associated with the [GetTrait('tremere').GetName(GetNullCharacter)], but practiced by various different $pod_clans$. It lets the practicioner use their blood for a diverse array of magical rituals: focusing one's mind, improving one's armies, cursing one's enemies... and many more.\nThaumaturges often have a frightening reputation that they use to their advantage. It is difficult for their enemies to properly estimate what to expect from a direct conflict. The uninitiated have little idea of the scope and magnitude of power that a thaumaturge might possess, and sometimes their imagination gets the best of them."
 seek_knowledge_thaumaturgy_effects: "You will learn the location of a teacher who knows [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. After traveling there, you can acquire the $pod_discipline$ [trait|E]. It not only lets you unlock [perks|E] in the [GetTrait('bloodsorcery').GetName(GetNullCharacter)] [lifestyle|E], but also unlocks the [bloodsorcery|E] [character_interaction|E], which lets you cast various beneficial and harmful spells.\n\n#warning Learning Thaumaturgy means you can never learn Sihr.#!"
 seek_knowledge_thaumaturgy_tt: "I shall unlock the deepest secrets of vitae." 
 seek_knowledge_thaumaturgy_planning_title: "The Quest for Thaumaturgy"
 seek_knowledge_thaumaturgy_planning_desc: "I have roused my blood and prepared myself to the best of my ability, but the finer points of [GetTrait('bloodsorcery').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this $pod_discipline$ all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_thaumaturgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_thaumaturgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_thaumaturgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_thaumaturgy_travel_desc: "I'm excited to get a chance to learn [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Its secrets are guarded jealously for a reason. Once I unlock them, there's no telling what I'll be capable of.\nIt is said that the true strength of a thaumaturge is the discipline to prepare for dangerous possibilities and use rituals that might not at first glance seem powerful. A good thaumaturge comes ready for all sorts of situations, and can unleash the forces she's gathered together in the event of an emergency. Martial-minded thaumaturges compare their preparations to making sure they have extra ammunition just in case the battle goes south." 
 seek_knowledge_thaumaturgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_thaumaturgy_isvalid: "$disciplines_learning_thaumaturgy_tt$"

 seek_knowledge_sielanic_thaumaturgy_name: "Learn [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Sielanic Thaumaturgy)"
 seek_knowledge_sielanic_thaumaturgy_desc: "Sielanic Thaumaturgy is a form of Thaumaturgy inspired by the pagan god Telyavel and practiced by the Telyavelic [GetTrait('tremere').GetName(GetNullCharacter)], a bloodline of the Tremere native to Lithuania.\n\nThe Telvays learned to utilize the power of siela, the animistic spirit latent in the earth, stone, plants, and animals of their adopted homeland. Based on shamanic practices, these Paths combine aspects of both nature and spirit-based magic.\n\nSome Tremere outside the bloodline believe that Sielanic Thaumaturgy is an offshoot of Koldunic Sorcery and look upon those who practice it with suspicion and distrust. Their suspicions are not entirely unfounded, as practitioners of Sielanic Thaumaturgy have access to some [bs_paths|E] of Koldunism."
 seek_knowledge_sielanic_thaumaturgy_effects: "You will learn the location of a teacher who knows [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. After traveling there, you can acquire the $pod_discipline$ [trait|E]. It not only lets you unlock [perks|E] in the [GetTrait('bloodsorcery').GetName(GetNullCharacter)] [lifestyle|E], but also unlocks the [bloodsorcery|E] [character_interaction|E], which lets you cast various beneficial and harmful spells.\n\n#warning Learning Thaumaturgy means you can never learn Sihr.#!"
 seek_knowledge_sielanic_thaumaturgy_tt: "I shall unlock the deepest secrets of vitae." 
 seek_knowledge_sielanic_thaumaturgy_planning_title: "The Quest for Sielanic Thaumaturgy"
 seek_knowledge_sielanic_thaumaturgy_planning_desc: "I have roused my blood and prepared myself to the best of my ability, but the finer points of [GetTrait('bloodsorcery').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this $pod_discipline$ all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_sielanic_thaumaturgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sielanic_thaumaturgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sielanic_thaumaturgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sielanic_thaumaturgy_travel_desc: "Through Sielanic Thaumaturgy a vampire is able to become part of the natural world, partaking of the abilities inherent in the earth, trees, rocks and life of any ground they are attuned to. As well as reach across the border between life and death, using their own unliving body as a conduit for contact with the dead. The Sielanic arts utilize both traditional [GetTrait('tremere').GetName(GetNullCharacter)] Thaumaturgy and [GetTrait('tzimisce').GetName(GetNullCharacter)] Koldunic Sorcery to achieve power beyond the reach of a single [bs_tradition|E]." 
 seek_knowledge_sielanic_thaumaturgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sielanic_thaumaturgy_isvalid: "$disciplines_learning_sielanic_tt$"

 seek_knowledge_dur_an_ki_name: "Learn [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Dur-An-Ki)"
 seek_knowledge_dur_an_ki_desc: "Assamite Sorcery began in the Second City when mortal magicians were Embraced into the Clan with the promise of power and eternal life. These undead Sorcerers acted as interrogators and demon hunters during the wars against the Baali. After the fall of the Second City, the Sorcerers were used to facilitate magical communication across great distances, keeping the Clan unified and organized. Furthermore, they used their arts to protect the herd the Clan cultivated. They nurtured the crops that sustained the herd and continued to strike at the forces that threatened the Clan. \nThese Sorcerers have subsequently turned their talents to the arts of Dur-An-Ki (Sumerian meaning “Master of Heaven and Earth”) to aid them in their cause. A form of magic that originated in ancient Mesopotamia, it has grown over the millennia to incorporate the trappings of numerous myths and religions from across the greater Middle East. Fundamentally, Dur-An-Ki permits covenants to be struck between spirits and sorcerers (known as ashipu)."
 seek_knowledge_dur_an_ki_effects: "You will learn the location of a teacher who knows [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. After traveling there, you can acquire the $pod_discipline$ [trait|E]. It not only lets you unlock [perks|E] in the [GetTrait('bloodsorcery').GetName(GetNullCharacter)] [lifestyle|E], but also unlocks the [bloodsorcery|E] [character_interaction|E], which lets you cast various beneficial and harmful spells."
 seek_knowledge_dur_an_ki_tt: "I shall unlock the deepest secrets of vitae." 
 seek_knowledge_dur_an_ki_planning_title: "The Quest for Dur-An-Ki"
 seek_knowledge_dur_an_ki_planning_desc: "I have roused my blood and prepared myself to the best of my ability, but the finer points of [GetTrait('bloodsorcery').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this $pod_discipline$ all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_dur_an_ki_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_dur_an_ki_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_dur_an_ki_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_dur_an_ki_travel_desc:  "Whereas the hallmarks of Thaumaturgy are its order and scientific precision, Assamite Sorcery is much less rigid. It draws its inspiration and form from numerous cultural sources and experiments conducted over many centuries: Hinduism, heroic epics, feng shui, Islamic alchemy and astronomy, the high and low magics of Mesopotamia, and the Persian rites of Mithra, to name but a few.\n In the case of each rite a Sorcerer casts, the route they take to its completion is comprised of a number of milestones. However, the order and manner in which these are fulfilled is different from one caster to the next, depending upon what cultural source they draw upon to characterize their practices."
 seek_knowledge_dur_an_ki_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_dur_an_ki_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$You are a [GetTrait('assamite').GetName(GetPlayer)]\n$BULLET_WITH_TAB$You have [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)] and [GetTrait('quietusadvanced').GetName(GetPlayer)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"
 
 seek_knowledge_akhu_name: "Learn [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Akhu)"
 seek_knowledge_akhu_desc: "Setite Sorcery is a curious magical phenomenon. It has elements from across the magical spectrum, though its implementation has a largely ritualistic, religious format. That said, \"Setite Sorcery\" is a bit of a misnomer. The term implies a singular practice, but Setite Sorceries would be more apt, as it is actually a collection of different practices from Followers of Set around the world. In Egypt's heyday, before its conversion to Christianity at the hands of the Roman Empire, magic was commonplace, practiced by mortal and vampire alike. Egyptians had several words for magic; the Setites used Heka (literally \"magic\") to refer to mortal magic, and Ahku (\"spells\") for their blood magic. This is still the most well known variant of \"Setite Sorcery\" to date."
 seek_knowledge_akhu_effects: "You will learn the location of a teacher who knows [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. After traveling there, you can acquire the $pod_discipline$ [trait|E]. It not only lets you unlock [perks|E] in the [GetTrait('bloodsorcery').GetName(GetNullCharacter)] [lifestyle|E], but also unlocks the [bloodsorcery|E] [character_interaction|E], which lets you cast various beneficial and harmful spells."
 seek_knowledge_akhu_tt: "I shall unlock the deepest secrets of vitae." 
 seek_knowledge_akhu_planning_title: "The Quest for Akhu"
 seek_knowledge_akhu_planning_desc: "I have roused my blood and prepared myself to the best of my ability, but the finer points of [GetTrait('bloodsorcery').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this $pod_discipline$ all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_akhu_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_akhu_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_akhu_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_akhu_travel_desc:  "Akhu, the most widely practiced school of Setite Sorcery, resembles ancient Egyptian religion. The god Set to the ancient Egyptians was, among other things, the God of Storms. A practitioner of Akhu therefore erects a symbolic lightning rod through which she can attract a bolt of Set’s lightning to power her subsequent rites. However, in order to attract Set’s favor, she must make an offering to the Dark God that will please him greatly. The accepted way to achieve this among practitioners of Akhu (known as Lector Priests) is by following the instructions laid down by Set himself in The Book of Going Forth by Night."
 seek_knowledge_akhu_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_akhu_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$Your [faith|E] has the [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName] [doctrine|E]\n$BULLET_WITH_TAB$You have [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)] and [GetTrait('serpentisadvanced').GetName(GetPlayer)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"

 seek_knowledge_sadhana_name: "Learn [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Sadhana)"
 seek_knowledge_sadhana_desc: "Upon reaching India, the Followers of Set found elements of the Hindu religion that they could exploit to convert Kindred to their cause. Practitioners of Sadhana are predominantly drawn from the ranks of the Setite bloodline known as the Daitya. These Setites follow Shiva, who was derived from the god Rudra, a storm deity, and thus identified as being a mask of Set. Believing themselves to be demons in flesh, the Indian Setites see it as their mission to overthrow the gods and take their power for themselves."
 seek_knowledge_sadhana_effects: "You will learn the location of a teacher who knows [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. After traveling there, you can acquire the $pod_discipline$ [trait|E]. It not only lets you unlock [perks|E] in the [GetTrait('bloodsorcery').GetName(GetNullCharacter)] [lifestyle|E], but also unlocks the [bloodsorcery|E] [character_interaction|E], which lets you cast various beneficial and harmful spells."
 seek_knowledge_sadhana_tt: "I shall unlock the deepest secrets of vitae." 
 seek_knowledge_sadhana_planning_title: "The Quest for Sadhana"
 seek_knowledge_sadhana_planning_desc: "I have roused my blood and prepared myself to the best of my ability, but the finer points of [GetTrait('bloodsorcery').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this $pod_discipline$ all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_sadhana_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sadhana_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sadhana_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sadhana_travel_desc: "Sadhana is the exertion of mind over matter. While it could be argued that their power comes from within as opposed to being channeled from the Dark God, it is their faith and devotion to Shiva that grants them the focus that allows them to direct this power. Without this, it is argued, they would simply lose themselves in meditation. Without Shiva, they would have no power, and thus it is all attributable to the Dark God in the end."
 seek_knowledge_sadhana_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
