 hunt_target_travel_desc:0 "I don't usually travel outside [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] to hunt, but I've decided it's worth it this time. [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstNameNicknamed] won't be able to escape me for much longer."
 hunt_target_travel_confirm:0 "What will [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l] blood taste like?"
 
 
 wake_from_torpor_name:0 "Awaken"
 #wake_from_torpor_desc:0 ""
 #wake_from_torpor_effects:0 ""
 wake_from_torpor_tt:0 "I shall awaken the sleeper."
 wake_from_torpor_planning_title:0 "Waking the Sleeper"
 wake_from_torpor_planning_desc:0 "I've learned as much as I could about the whereabouts of [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstNameNicknamedPossessive] body, currently in a state of [GetTrait('torpor').GetName(GetPlayer.MakeScope.Var('current_journey').Var('target').Char)].\n\nI now know [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l] general location, but I'll have to comb the province more thoroughly if I want to find [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l] actual hiding place."
 wake_from_torpor_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 wake_from_torpor_planning_decline:0 "$POD_journey_planning_decline_default$"
 wake_from_torpor_travel_title:0 "Journey for a Sleeper"
 wake_from_torpor_travel_desc:0 "Once we find [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstNameNicknamed], [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetSheHe|l] will be completely at my mercy, yet still aware of [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l] surroundings. A terrifying thing to contemplate. I wonder what [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetSheHe|l] would do, were our positions reversed."
 wake_from_torpor_travel_confirm:0 "We just have to find [GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l] lair first."
 