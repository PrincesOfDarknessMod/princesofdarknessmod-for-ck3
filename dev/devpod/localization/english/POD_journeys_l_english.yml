 realm_mastery_time_name: "Achieve [GetTrait('realm_time').GetName(GetNullCharacter)]"
 realm_mastery_time_desc: "The #TOOLTIP:GAME_TRAIT,realm_time,[GetNullCharacter] #L Time Realm#!#! is the [fae_realm|E] of temporal understanding. A $POD_splat_fae$ with poor knowledge of this [fae_realm|E] will find their [cantrips|E] fizzle out in a matter of months. Mastery is required if one wants to cast [cantrips|E] that last forever."
 realm_mastery_time_effects: "You will travel to a freehold and petition the [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] to grant you knowledge of the #TOOLTIP:GAME_TRAIT,realm_time,[GetNullCharacter] #L Time#!#! [fae_realm|E]. If you are successful, you will gain the [GetTrait('realm_time').GetName(GetNullCharacter)] [trait|E], which will let you unlock the final perk in the #TOOLTIP:GAME_TRAIT,realm_time,[GetNullCharacter] #L Time#!#! [lifestyle|E]."
 realm_mastery_time_isvalid: "$EFFECT_LIST_BULLET$You have the [GetPerk('realm_time_4_perk').GetName(GetPlayer)] [perk|E]\n$realm_mastery_generic_isvalid$"
 realm_mastery_time_tt: "Never-ending Glamour."
 realm_mastery_time_planning_title: "The Quest for Realm Time Mastery"
 realm_mastery_time_planning_desc: "Though I have endeavored to free my imagination, it is still limited in some aspects.\n\nIf I want to gain a full understanding of the #TOOLTIP:GAME_TRAIT,realm_time,[GetNullCharacter] #L Time Realm#!#!, I will need to seek help from the [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] who have mastered it.\n\nI'm ready to make my case in one of the freeholds."
 realm_mastery_time_planning_confirm: "$POD_journey_planning_confirm_default$"
 realm_mastery_time_planning_decline: "$POD_journey_planning_decline_default$"
 realm_mastery_time_travel_title: "$POD_journey_travel_title_realm_mastery$"
 realm_mastery_time_travel_desc: "$realm_mastery_generic_travel_desc$"
 realm_mastery_time_travel_confirm: "$POD_journey_travel_confirm_realm_mastery$"


 POD_journey_travel_title_spell_of_life_stage2: "A Quest For Knowledge"
 POD_journey_travel_confirm_spell_of_life_stage2: "I will refine my understanding of the [Concept('POD_spell_of_life', 'Spell Of Life')|E]."

 spell_of_life_stage2_targeted_journey_name: "Find a Spell of Life Teacher"
 spell_of_life_stage2_targeted_journey_desc: "Select someone to study from."
 spell_of_life_stage2_targeted_journey_tt: "To further my understanding of the [Concept('POD_spell_of_life', 'Spell Of Life')|E], I will speak with those that know some details regarding it."
 spell_of_life_stage2_targeted_werewolf_generic_isvalid: "$EFFECT_LIST_BULLET$You must be in a world where $POD_splat_werewolf_plural$ are one of the available [splats|E]."
 spell_of_life_stage2_targeted_mummy_generic_isvalid: "$EFFECT_LIST_BULLET$You must be in a world where $POD_splat_mummy_plural$ are one of the available [splats|E]."

 spell_of_life_stage2_targeted_journey_wepauwet_name: "Learn From [GetScriptedCharacterByHistoryID('792579').GetFirstName]"
 spell_of_life_stage2_targeted_journey_wepauwet_desc: "Once, [GetScriptedCharacterByHistoryID('792579').GetSheHe] led [GetScriptedCharacterByHistoryID('792579').GetHerHis] people in a war against the Cult of Set, but they were cursed and forced from their home. They say [GetScriptedCharacterByHistoryID('792579').GetSheHe] was blessed with immortality by [GetScriptedCharacterByHistoryID('792593').GetFirstName], a blessing that allowed [GetScriptedCharacterByHistoryID('792579').GetHerHim] to use necromancy as if [GetScriptedCharacterByHistoryID('792579').GetSheHe] was a #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Mummy#!#!. This blessing has allowed [GetScriptedCharacterByHistoryID('792579').GetFirstName] to become a living library of [GetScriptedCharacterByHistoryID('792579').GetHerHis] people's history."
 spell_of_life_stage2_targeted_journey_wepauwet_effects: "You will journey to meet with [GetScriptedCharacterByHistoryID('792579').GetFirstName]. After traveling there, you can convince [GetScriptedCharacterByHistoryID('792579').GetHerHim] to study under [GetScriptedCharacterByHistoryID('792579').GetHerHim]."
 spell_of_life_stage2_targeted_journey_wepauwet_isvalid: "$EFFECT_LIST_BULLET$[GetScriptedCharacterByHistoryID('792579').GetFirstName] must be alive, active, and not be #color_white you#!.\n$spell_of_life_stage2_targeted_werewolf_generic_isvalid$"
 spell_of_life_stage2_targeted_journey_wepauwet_tt: "[GetScriptedCharacterByHistoryID('792579').GetFirstName] will teach me much."
 spell_of_life_stage2_targeted_journey_wepauwet_planning_title: "The Quest for Knowledge"
 spell_of_life_stage2_targeted_journey_wepauwet_planning_desc: "I have studied the Spell of Life and prepared myself to the best of my ability, but its finer points still elude me.\n\nIf I want to master it all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 spell_of_life_stage2_targeted_journey_wepauwet_planning_confirm: "$POD_journey_planning_confirm_default$"
 spell_of_life_stage2_targeted_journey_wepauwet_planning_decline: "$POD_journey_planning_decline_default$"
 spell_of_life_stage2_targeted_journey_wepauwet_travel_title: "$POD_journey_travel_title_spell_of_life_stage2$"
 spell_of_life_stage2_targeted_journey_wepauwet_travel_desc: "I'm excited to get a chance to learn from [GetScriptedCharacterByHistoryID('792579').GetFirstName]. $spell_of_life_stage2_targeted_journey_wepauwet_desc$"
 spell_of_life_stage2_targeted_journey_wepauwet_travel_confirm: "$POD_journey_travel_confirm_spell_of_life_stage2$"

 spell_of_life_stage2_targeted_journey_milarepa_name: "Learn From [GetScriptedCharacterByHistoryID('791152').GetFirstName]"
 spell_of_life_stage2_targeted_journey_milarepa_desc: "Once, there was a vampire called [GetScriptedCharacterByHistoryID('791151').GetFirstName] who sought freedom from the parasitic nature of vampirism and received Osiris' blessing. He taught Osiris' strict religious discipline and deep philosophical teachings to other vampires and eventually passed leadership of the so-called Children of Osiris to [GetScriptedCharacterByHistoryID('791152').GetFirstName]. Among those lessons, [GetScriptedCharacterByHistoryID('791152').GetFirstName] was given a few insights into the Spell of Life."
 spell_of_life_stage2_targeted_journey_milarepa_effects: "You will journey to meet with [GetScriptedCharacterByHistoryID('791152').GetFirstName]. After traveling there, you can convince [GetScriptedCharacterByHistoryID('791152').GetHerHim] to study under [GetScriptedCharacterByHistoryID('791152').GetHerHim]."
