 seek_knowledge_sihr_name: "Learn [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Sihr)"
 seek_knowledge_sihr_desc: "This form of blood magic practiced by the few [Glossary('Ashirra','game_concept_ashirra_desc')] sorcerors originates with the Mutasharid([GetTrait('nosferatu').GetName(GetNullCharacter)]) Tarique al-Hajji in the ninth Century. Tarique built contacts with the [GetTrait('assamite').GetName(GetNullCharacter)], including Khalid al-Munir, a prominent member of that clan's sorceror caste. Together they developed the paths of Sihr, its strength originating as much with the caster's faith as with the power of their blood.\n\nWhile Thaumaturgy and other forms of blood magic are considered to be blasphemy in Islam (as they seek a power other than God's to aid someone), many of the practitioners of Sihr believe that Sihr's power comes through God only. Casting spells usually relies on prayers that are used as incantations."
 seek_knowledge_sihr_effects: "You will learn the location of a teacher who knows [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. After traveling there, you can acquire the $pod_discipline$ [trait|E]. It not only lets you unlock [perks|E] in the [GetTrait('bloodsorcery').GetName(GetNullCharacter)] [lifestyle|E], but also unlocks the [bloodsorcery|E] [character_interaction|E], which lets you cast various beneficial and harmful spells.\n\n#warning Learning Sihr means you can never learn Thaumaturgy.#!"
 seek_knowledge_sihr_tt: "I shall unlock the deepest secrets of vitae." 
 seek_knowledge_sihr_planning_title: "The Quest for Sihr"
 seek_knowledge_sihr_planning_desc: "I have roused my blood and prepared myself to the best of my ability, but the finer points of [GetTrait('bloodsorcery').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this $pod_discipline$ all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_sihr_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sihr_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sihr_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sihr_travel_desc:  "Unlike other paths of blood magic, Sihr is mainly casted through prayer instead of arcane incantations and symbols. Many spells and rituals require intense prayer and focus from its practitioners and thus only the truly devoted may succeed at using them."
 seek_knowledge_sihr_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sihr_isvalid: "$EFFECT_LIST_BULLET$Only vampires following an [GetReligionByKey('ashirra_religion').GetName] [faith|El] or the [GetFaithByKey('tariqelhaqim').GetName] can learn Sihr"


 seek_knowledge_abyssal_mysticism_name: "Learn [GetTrait('obtenebration').GetName(GetNullCharacter)] (Abyssal Mysticism)"
 seek_knowledge_abyssal_mysticism_desc:  "Immersed in undying study of a force transcending and ultimately opposing all light and life, Abyss Mystics have little use for humanity or mortal precepts of right and wrong.\nThe mystics of Clan Lasombra pry into the dark places in search of secrets, answers, and perhaps more questions. For these driven souls, conventional Obtenebration is only the beginning. By applying thaumaturgic principles to Obtenebration, Lasombra mystics of the Dark Ages developed rituals to unlock the hidden powers of shadow and summon the unnamed primordial horrors of the Abyss, thereby effectively extending Obtenebration into a form of blood sorcery."
 seek_knowledge_abyssal_mysticism_effects: "You will learn the location of a teacher who knows Abyssal Mysticism. After traveling there, you can acquire the $pod_discipline$ [trait|E]. It not only lets you unlock [perks|E] in the [GetTrait('bloodsorcery').GetName(GetNullCharacter)] [lifestyle|E], but also unlocks the [bloodsorcery|E] [character_interaction|E], which lets you cast various beneficial and harmful spells."
 seek_knowledge_abyssal_mysticism_tt: "I shall unlock the deepest secrets of vitae." 
 seek_knowledge_abyssal_mysticism_planning_title: "The Quest for Abyssal Mysticism"
 seek_knowledge_abyssal_mysticism_planning_desc: "I have roused my blood and prepared myself to the best of my ability, but the finer points of Abyssal Mysticism still elude me.\n\nIf I want to master this $pod_discipline$ all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_abyssal_mysticism_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_abyssal_mysticism_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_abyssal_mysticism_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_abyssal_mysticism_travel_desc: "Abyssal magic summons spirits from another dimension, one which resembles a form of dark purgatory. Such practitioners are enslaving and controlling spirits, but those spirits are unlike anything else in creation, and seem to have no memory of or association with true demonic entities."
 seek_knowledge_abyssal_mysticism_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
