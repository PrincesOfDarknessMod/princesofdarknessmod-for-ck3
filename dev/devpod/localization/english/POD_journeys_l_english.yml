 seek_knowledge_animalism_tt: "The beasts of the night shall obey me."
 seek_knowledge_animalism_planning_title: "The Quest for Animalism"
 seek_knowledge_animalism_planning_desc: "I have roused my blood and prepared myself to the best of my ability, but the finer points of [GetTrait('animalism').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this $pod_discipline$ all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
