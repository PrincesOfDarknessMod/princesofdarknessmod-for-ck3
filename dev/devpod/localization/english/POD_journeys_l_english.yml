 breaking_the_blond_bond_name: "Breaking the Blood Bond"
 breaking_the_blond_bond_desc: "You are [Glossary('Blood Bound','game_concept_bloodbond_desc')] which means the very idea of #italic rebellion#! is hard to conceive, overpowered by the fabricated love coursing through the blood.\n\nBut even that love cannot stop your inner self from seeing what is happening and entertaining the long lost idea of freedom."
 breaking_the_blond_bond_effects: "You will start a long [journey|E] to slowly lessen your [Glossary('Blood Bond','game_concept_bloodbond_desc')] to a level where running away or acting againt your [Glossary('Domitor','game_concept_domitor_desc')] is possible. Mind that this process requires your entire willpower and any [mental_break|E] will instantly forfeit this endeavor. Additionally, completing any [bound_ghoul_mission_with_icon|E] will regress your progress by #N 10%#!."
 breaking_the_blond_bond_tt: "Even Bonds are not eternal."
 breaking_the_blond_bond_planning_title: "Close, but not close enough"
 breaking_the_blond_bond_planning_desc: "You are close, you can feel your love devolve into a simple infatuation. You still need one more push to be truly free however."
 breaking_the_blond_bond_planning_confirm: "Was that love... fake?"
 breaking_the_blond_bond_planning_decline: "$POD_journey_planning_decline_default$"
 breaking_the_blond_bond_isvalid: "To start this [journey|E], you need be on the 0th [stress|E] level."
 
