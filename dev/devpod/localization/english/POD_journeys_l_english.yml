 spell_of_life_stage2_targeted_journey_inauhaten_desc: "[GetScriptedCharacterByHistoryID('792605').GetFirstName] and a group of mages used a corrupted form of the Spell of Life to transform the sect into yamasattvas, beings theorized to be liches or vampires that eventually became the [GetTrait('nagaraja').GetName(GetNullCharacter)] through another misconceived ritual. Regardless, [GetScriptedCharacterByHistoryID('792605').GetSheHe] possesses some knowledge regarding the Spell of Life."
