 study_true_name_journey_name: "Study True Names"
 study_true_name_journey_desc: "[Glossary('True Names','podgloss.truename')] are, at least to some, the foundation of reality, and knowing the true name of something is having full control over it. True names are always changing however making learning them a long and arduous process."
 study_true_name_journey_effects: "You will learn the [Glossary('True Name','podgloss.truename')] of a random material, animal or plant."
