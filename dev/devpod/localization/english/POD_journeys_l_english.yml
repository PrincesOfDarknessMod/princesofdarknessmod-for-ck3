 spell_of_life_stage2_targeted_journey_mestha_name: "Learn From [GetScriptedCharacterByHistoryID('792804').GetFirstName]"
 spell_of_life_stage2_targeted_journey_mestha_desc: "[GetScriptedCharacterByHistoryID('792804').GetFirstName] was the first mummy to ever be created and was present for the creation of [GetScriptedCharacterByHistoryID('792593').GetFirstName]. Some say that [GetScriptedCharacterByHistoryID('792804').GetSheHe] even serves as Osiris' confidant when Osiris leaves [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] or when [GetScriptedCharacterByHistoryID('792804').GetFirstName] returns to it. While [GetScriptedCharacterByHistoryID('792804').GetSheHe] does not know the Spell of Life, [GetScriptedCharacterByHistoryID('792804').GetSheHe] can offer some insights."
 spell_of_life_stage2_targeted_journey_mestha_effects: "You will journey to meet with [GetScriptedCharacterByHistoryID('792804').GetFirstName]. After traveling there, you can convince [GetScriptedCharacterByHistoryID('792804').GetHerHim] to study under [GetScriptedCharacterByHistoryID('792804').GetHerHim]."
