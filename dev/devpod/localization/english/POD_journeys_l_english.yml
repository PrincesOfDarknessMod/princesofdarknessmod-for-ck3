 seek_knowledge_tzu_wei_name: "Learn Chi Art ([GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)])"
 seek_knowledge_tzu_wei_desc: "Tzu Wei is the chi art of reading and manipulating horoscopes. When $pod_kueijin$ practice Tzu Wei, they can shape destiny itself and bend the forces of luck to their will."
 seek_knowledge_tzu_wei_effects: "You will learn the location of a teacher who knows [GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)]. After traveling there, you can acquire the [GetTrait('chi_art_tzu_wei').GetName(GetPlayer)] [trait|E], which lets you unlock [perks|E] in the [GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)] [lifestyle|E]."
 seek_knowledge_tzu_wei_tt: "No luck, just skill... resulting in luck."
 seek_knowledge_tzu_wei_planning_title: "The Quest for Tzu Wei"
 seek_knowledge_tzu_wei_planning_desc: "I have circulated my Chi and prepared myself to the best of my ability, but the finer points of [GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this Art all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_tzu_wei_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_tzu_wei_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_tzu_wei_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_tzu_wei_travel_desc: "I'm excited to get a chance to learn [GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)]. Fate must be like an open book to one who knows how to read it in the stars."
