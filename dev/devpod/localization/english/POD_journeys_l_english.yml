 pilgrimage_to_enoch_name: "Pilgrimage to Enoch"
 #pilgrimage_to_enoch_desc: ""
 #pilgrimage_to_enoch_effects: ""
 pilgrimage_to_enoch_tt: "The dead city calls to those who would listen."

 # Planning phase completion
 pilgrimage_to_enoch_planning_title: "The Shroud Beckons"
 pilgrimage_to_enoch_planning_desc: "Your preparations are complete. The rituals have been performed, the offerings made, and the path through the Shroud has been mapped as well as any living being can manage.\n\nThe ghost-city of Enoch awaits in the depths of the Underworld."
 pilgrimage_to_enoch_planning_confirm: "Into the Shadowlands."
 pilgrimage_to_enoch_planning_decline: "$POD_journey_planning_decline_default$"

 # Travel phase
 pilgrimage_to_enoch_travel_title: "Descent into the Underworld"
 pilgrimage_to_enoch_travel_desc: "The Shroud parts before you. The Underworld awaits, and with it, the ancient ghost-city of Enoch."
 pilgrimage_to_enoch_travel_confirm: "There is no turning back now."


 glamour_quests_name: "Quests of Glamour"
 glamour_quests_desc: "Select what quest you would like to do."
 glamour_quests_tt: "Cleansing myself of Banality."
 glamour_quests_generic_travel_desc: "$glamour_quests_tt$"

 glamour_quests_ineffective: "\n\n@warning_icon!#X This [journey|E] is predicted to be ineffective in clearing your [banality|E], only managing to slow down its growth!#!"

 glamour_quests_deed_name: "Quest of Deed"
 glamour_quests_deed_desc: "The first kind of quest undertaken is the Quest of Deed, in which the Kithain descends into the wilds of the Far Dreaming in search of a great relic of the Fae. This may be an artifact of some kind, a being of great import, or even a Freehold far from the known trods. Whatever the object of the quest, it must be seized and returned, or if it is a place, a trod cleared and well-secured."
 glamour_quests_deed_effects: "You will lose [GetPlayer.MakeScope.ScriptValue('POD_glamour_quest_banality')|0P] [banality|E] at the end of the [journey|E].\nFor the duration of this [journey|E], you will gain [GetModifier('POD_quest_of_deed_modifier').GetNameWithTooltip].[AddTextIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('POD_effective_banality_deed'), '(CFixedPoint)0'), Localize('glamour_quests_ineffective'))]"
 glamour_quests_deed_tt: "May the treasures of the Dreaming reignite my spark."
 glamour_quests_deed_planning_title: "Banality Fought through Battle"
 glamour_quests_deed_planning_desc: "Your quest is near its end. It is time to finish it."
 glamour_quests_deed_planning_confirm: "$POD_journey_planning_confirm_default$"
 glamour_quests_deed_planning_decline: "$POD_journey_planning_decline_default$"
 glamour_quests_deed_travel_title: "$glamour_quests_deed_name$"
 glamour_quests_deed_travel_desc: "Your quest is near its end. It is time to finish it."
 glamour_quests_deed_travel_confirm: "Unfortunately, I'm away from home right now."
 glamour_quests_deed_isvalid: ""

 glamour_quests_inspiration_name: "Quest of Inspiration"
 glamour_quests_inspiration_desc: "The second kind of quest undertaken is the Quest of Inspiration, in which a single mortal is chosen as the object. Through whatever means are necessary, the changeling must drive that mortal to the very heights of her creativity, suffusing her with such Glamour that she shines like a beacon in the night. This is not Rhapsody, though — far from it! The changeling must carefully shepherd her charge, ensuring that the maddened drive she has infused the mortal with does not destroy her mind, or the quest will fail."
 glamour_quests_inspiration_effects: "You will lose [GetPlayer.MakeScope.ScriptValue('POD_glamour_quest_banality')|0P] [banality|E] at the end of the [journey|E].\nFor the duration of this [journey|E], you will gain [GetModifier('POD_quest_of_inspiration_modifier').GetNameWithTooltip].[AddTextIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('POD_effective_banality_inspiration'), '(CFixedPoint)0'), Localize('glamour_quests_ineffective'))]"
 glamour_quests_inspiration_tt: "May the passion of a true artist reinvigorate me."
 glamour_quests_inspiration_planning_title: "Banality Fought through Words"
 glamour_quests_inspiration_planning_desc: "Your quest is near its end. It is time to finish it."
 glamour_quests_inspiration_planning_confirm: "$POD_journey_planning_confirm_default$"
 glamour_quests_inspiration_planning_decline: "$POD_journey_planning_decline_default$"
 glamour_quests_inspiration_travel_title: "$glamour_quests_inspiration_name$"
 glamour_quests_inspiration_travel_desc: "Your quest is near its end. It is time to finish it."
 glamour_quests_inspiration_travel_confirm: "Unfortunately, I'm away from home right now."
 glamour_quests_inspiration_isvalid: ""

 glamour_quests_dreaming_name: "Quest of Dreaming"
 glamour_quests_dreaming_desc: "The third kind of quest undertaken is the Quest of Dreaming, in which a mortal thoroughly taken by Banality is pulled back from its icy depths and shown the beauty and joy of the Dreaming once more. This is not literal, of course, or at least it doesn't have to be - personal inspiration and joy sufficient to cause significant changes in the subject's life are perfectly acceptable end goals for this quest. Care must be taken, however, for with Banality's fingers slipped so deep into the heart of this unfortunate soul, it would not be hard for it to twist the changeling's hopes into a driven hatred of all things Fae."
 glamour_quests_dreaming_effects: "You will lose [GetPlayer.MakeScope.ScriptValue('POD_glamour_quest_banality')|0P] [banality|E] at the end of the [journey|E].\nFor the duration of this [journey|E], you will gain [GetModifier('POD_quest_of_dreaming_modifier').GetNameWithTooltip].[AddTextIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('POD_effective_banality_dreaming'), '(CFixedPoint)0'), Localize('glamour_quests_ineffective'))]"
 glamour_quests_dreaming_tt: "May this lost soul prove there's still hope for me."
