 brujah_panegyra_option_prizes:0 "Prizes"
 brujah_panegyra_prizes_bad:1 "Simple Prizes"
 brujah_panegyra_prizes_bad_desc:1 "$EFFECT_LIST_BULLET$ Determine the amount of gold offered to the winners.\n\n#weak We're here for the love of sport, the baubles on offer are just an excuse.#!"
 brujah_panegyra_prizes_normal:2 "Decent Prizes"
 brujah_panegyra_prizes_normal_desc:1 "$EFFECT_LIST_BULLET$ Determine the amount of gold offered to the winners.\n\n#weak While we're not here for the prizes, being able to fund the journey home is a very practical goal.#!"
 brujah_panegyra_prizes_good:2 "Fine Prizes"
 brujah_panegyra_prizes_good_desc:1 "$EFFECT_LIST_BULLET$ Determine the amount of gold offered to the winners.\n\n#weak Without stakes, what's the point in a competition?#!"
 brujah_panegyra_prizes_very_good:0 "Good Prizes"
 brujah_panegyra_prizes_very_good_desc:0 "$EFFECT_LIST_BULLET$ Determine the amount of gold offered to the winners.\n\n#weak A prize isn't just a bauble handed out to the victor, it is a beacon for attracting the brave and bold to attend.#!"
 brujah_panegyra_prizes_splendid:0 "Splendid Prizes"
 brujah_panegyra_prizes_splendid_desc:0 "$EFFECT_LIST_BULLET$ Determine the amount of gold offered to the winners.\n\n#weak The best prizes are the ones so glamorous that they eclipse their winners.#!"

 brujah_panegyra_phase_archery:0 "Archery"
 brujah_panegyra_phase_archery_desc:0 "A bow competition in which each contestant shoots at a target with a set number of arrows, aiming to score as many points as possible.\nIt is a somewhat new addition to the Panegyra, mostly requested by younger members of clan Brujah looking for something a little more "modern" to compete in."
 brujah_panegyra_phase_kerykes:0 "Kerykes"
 brujah_panegyra_phase_kerykes_desc:0 "A contest of oratory skills, it is by far the favorite of the most learned part of the Brujah.. and the most dreaded by outsiders for its sheer length."
 brujah_panegyra_phase_wrestling:0 "Wrestling"
 brujah_panegyra_phase_wrestling_desc:0 "A classic part of the Greek Olympics, wrestling is a contest of strength and cunning, in which contestants attempt to knock down or throw their foes from the ring to be the last standing."
 brujah_panegyra_phase_boxing:0 "Boxing"
 brujah_panegyra_phase_boxing_desc:0 "The most likely competition to cause frenzy among its participants, boxing pit two combatants in a duel with an elaborate (and often changing between each Panegyra) set of rules."
 brujah_panegyra_phase_board_game:0 "Board Game"
 brujah_panegyra_phase_board_game_desc:0 "A contest of wits in which contestants play a series of board game matches, with the ultimate winner being the last remaining player.\nChess is by far the most played one but Panegyra held in lands where it isn't as prevalent have often swapped it for a more local alternative."
 brujah_panegyra_phase_horse_race:0 "Horse Race"
 brujah_panegyra_phase_horse_race_desc:0 "A spectator sport in which lords and ladies enter horses to race against each other, with the winner being the first to cross the finishing line.\nSome Panegyra use chariots for this contest, while others separate the horse races in various smaller contests."
 
 panegyra_rewards_tt:0 "Rewards are given to the victor."
 
 brujah_panegyra_events.1000.t:0 "Archery"
 brujah_panegyra_events.1000.desc:0 "Archery was never a part of the original Olympic games and, as such, wasn't considered suitable by the Brujah for their Panegyra. It is only after a long and grueling campaign by younger members of the clan that it was finally added as a competition. Proponents of archery tend to explain that it is the perfect embodiment of the Brujah as it requires both physical aptitude and a sharp mind.\nMost winners tend to be those younger neonates that grew up with a bow in their hands and that is by far the contest they look forward to the most. Elders tend to see it as necessary evil, an introduction to much more traditional and respected parts of the Panegyra that come after."
 brujah_panegyra_events.1000.a:0 "Time to give it my all!"
 brujah_panegyra_events.1000.b:0 "Not my forte, let us take it easy."
 brujah_panegyra_events.1000.c:0 "I am ready."
 panegyra_overdrive_tt:0 "This will increase your chances of success in this contest."
 panegyra_underdrive_tt:0 "This will decrease your chances of success in this contest."
 
 brujah_panegyra_events.1010.t:0 "Kerykes"
 brujah_panegyra_events.1010.desc:0 "The kerykes (heralds) were associated with the salpinktai (trumpeters) in ancient Olympics to form the Herald and Trumpet contest. The trumpet part of it was never really popular among the Brujah but the oratory competition definitely is. Winners are chosen by the clarity of the enunciation and the audibility of their voice as much as what they actually are saying. Some use poetry while others prefer old Greek political works such as Plato or Aristotle.\nBeloved by the Brujah elders, this is a contest dreaded by the other clans as it can go on for literal nights before drawing to a close. Polite requests to institute a time limit for each contestant have so far been firmly refused."
 brujah_panegyra_events.1010.b:0 "Let's try to not fall asleep..."
 brujah_panegyra_events.1010.c:0 "My voice is a sharpened weapon!"



 