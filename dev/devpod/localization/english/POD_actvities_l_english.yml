l_english:

 activity_brujah_panegyra:0 "Brujah Panegyra"
 activity_brujah_panegyra_desc:0 "A tradition created by the Hellenic Brujah, the Panegyra is a vampiric version of the Olympic games tailored for the children of Caine unique strengths and weaknesses."
 activity_brujah_panegyra_host_desc:0 "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i][stress|E] Loss\n$BULLET_WITH_TAB$[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]"
 activity_brujah_panegyra_selection_tooltip:0 "Invite your $knight_culture_player_plural$, subjects, and neighbors to a grand spectacle of contests\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] Loss"
 activity_brujah_panegyra_destination_selection:0 ""
 brujah_panegyra_conclusion_general:0 "The Panegyra has at last drawn to a close.\n" 
 activity_brujah_panegyra_guest_desc:0 ""
 activity_brujah_panegyra_conclusion_desc:0 ""
 
 brujah_panegyra_option_accommodations:0 "Accommodations"
 brujah_panegyra_accommodations_bad:0 "Ramshackle Tents"
 brujah_panegyra_accommodations_bad_desc:0 "$EFFECT_LIST_BULLET$ Certain negative events are more likely to fire\n\n#weak What matters more, the skills on display or the place you display them?#!"
 brujah_panegyra_accommodations_normal:0 "Simple Pavilions"
 brujah_panegyra_accommodations_normal_desc:0 "$EFFECT_LIST_BULLET$ Event weightings are unaffected\n\n#weak The key to a decent performance is getting a good day's rest.#!"
 brujah_panegyra_accommodations_good:0 "Luxurious Encampments"
