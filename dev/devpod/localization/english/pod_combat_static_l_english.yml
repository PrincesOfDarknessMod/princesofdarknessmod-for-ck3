 ###### HELP / OVERVIEW EVENT
 ##############################

 pod_combat.0001.t:0 "Combat System Overview"
 pod_combat.0001.desc:0 "#bold FLOW#!\nCombat runs in rounds. Each round, combatants act in descending #bold initiative#! order. On your turn you spend #bold Action Points (AP)#! to use skills. Each round starts with #bold 6 AP#! (modifiable by buffs, debuffs, AP drain, or skills that refund AP). Pass #bold End Turn#! to forfeit unspent AP.\n\n#bold HEALTH TRACK#!\nEach combatant has a PoD health track with #bold superficial#! and #bold aggravated#! damage boxes. Fill the track and the combatant is KO'd. Aggravated damage only soaks at #bold half effectiveness#! (-50% soak chance) and persists longer after combat.\n\n#bold HIT & SOAK#!\n#bold Hit chance#! = 60 + (own prowess − target prowess) / 2, clamped 20–95. The full damage pipeline is #bold Hit roll → Guard check → Soak roll → Damage#! — each stage can stop the attack before it lands.\n\n#bold Damage sources#! decide which stages apply:\n• #bold Physical#!: full pipeline. Can miss, be guarded, or be soaked.\n• #bold Supernatural#!: auto-hit, skips guard, still soakable. Mystical force that can't be blocked with blade or will, only resisted by fortitude.\n• #bold Mental#!: auto-hit, no guard, #bold no soak#!. Psychic strikes land unconditionally — rare and expensive.\n• #bold Fire / Sunlight#!: physical pipeline, but #bold aggravated vs vampires#! (half-soak against them).\n• #bold Silver#!: physical pipeline, aggravated vs #bold werewolves and bastet#!.\n• #bold Gold#!: physical pipeline, aggravated vs #bold mokole#!.\n• #bold Holy#!: physical pipeline, aggravated vs #bold vampires, demons, kuei-jin, and wraiths#!.\n\n#bold Damage types#! (Superficial vs Aggravated) stack on top of the source. A skill marked Aggravated applies half-soak against ALL targets, not just the source's vulnerable creatures. Promoted sources (Fire, Silver, Gold, Holy) auto-upgrade to Aggravated only when hitting a vulnerable creature type.\n\n#bold Bypass flags#! on specific skills skip individual stages: #bold Bypasses Guard#! ignores guard stance, #bold Undodgeable#! ignores dodge, #bold Breaks Stealth#! strips stealth and reverses its +30 hit bonus.\n\n#bold SKILL COSTS#!\nEach skill costs AP and may require additional resources: #bold Blood#! (vampires), #bold Gnosis#! (fera), #bold Stress#!, #bold Gold#!, #bold Prestige#!, or #bold Piety#!. Unaffordable skills are hidden from your bar.\n\n#bold BUFFS & DEBUFFS#!\nBuffs and debuffs come in three tiers (#bold small#! +10, #bold medium#! +20, #bold large#! +30) and two durations (#bold round#! or #bold combat#!). A character holds one buff AND one debuff per stat + duration pair. A higher tier #bold overwrites#! a lower one; reapplying the same or lower tier is blocked. Round tiers expire at round end; combat tiers last the whole fight. One-shot flags (#bold AP gain#!, #bold AP drain#!, #bold initiative debuff#!) fire once and are not tiered.\n\n#bold STATUS MOVES#!\nAll stances below persist until #bold consumed by an incoming attack#! or the combat ends — you can set up defenses in advance and they stay until something tests them.\n• #bold Guard#!: Block the next physical attack (can be bypassed).\n• #bold Dodge#!: Negate the next attack entirely (can be bypassed).\n• #bold Stealth#!: +30 Hit Chance while hidden. Consumed when you attack OR when an attack hits you. Can be forcibly broken by skills with #bold Breaks Stealth#!.\n• #bold Counter-stance#!: Retaliate when hit.\n• #bold Miss-counter#!: Retaliate when missed.\n• #bold Feint#!: Force your target's guard/dodge to trigger without dealing damage (the feint marker itself clears at round end).\n\n#bold TARGETING#!\nClick any ally or enemy card to set them as your current target. Offensive skills fire on enemies, support skills on allies. Self-only skills ignore targeting. Switching to a new enemy recomputes your hit chance against their prowess.\n\n#bold OTHER CONTROLS#!\n• #bold Auto-Resolve#!: Skip combat; winner determined by prowess.\n• #bold Forfeit#! (X button): Concede immediately — opponent wins.\n• #bold End Combat#!: Dismiss the window after a fight is resolved."
 pod_combat.0001.a:0 "Close"

