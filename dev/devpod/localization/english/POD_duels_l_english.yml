##### Duel move auto-generated tooltips

# these are the custom_tooltips called from the POD_duel_move_desc SGUI.
# they have access to all the variables on the story_cycle, so we can insert
# dynamic text and read variables this way.

# one thing that's annoying is that custom_tooltip always adds a bullet point.
# custom_description_no_bullet has no access to the current scope, and you also
# can't pass story_cycle scopes to it, so we can't use that one.
# the janky way around this is make the text invisible.
# as in, the entire SGUI that calls these custom_tooltips is wrapped in invisible formatting.
# this is why these loc entries are formatted with #medium.
# (because it negates the invisibility.)
# also, that's why there's another $EFFECT_LIST_BULLET$ at the end.
# it's a second bullet point, also invisible, so the text is centered properly.

 POD_duel_move_damage: "#medium;outline #bold;N Attack#! [story.MakeScope.Var('target').GetFlagName] for [story.MakeScope.Var('damage_value').GetValue|V0] [story.MakeScope.Var('damage_type').GetFlagName]#! $EFFECT_LIST_BULLET$"
 POD_duel_move_healing: "#medium;outline #bold;P Heal#! [story.MakeScope.Var('target').GetFlagName] for [story.MakeScope.Var('healing_value').GetValue|V0] [story.MakeScope.Var('healing_type').GetFlagName]#! $EFFECT_LIST_BULLET$"
# this one takes a splat-agnostic energy value and flavorizes it for the player's splat
 POD_duel_move_energy_cost: "#medium;outline Cost: [Multiply_CFixedPoint( story.MakeScope.Var('energy_cost').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0] #V [GetPlayer.Custom('PODEnergySplat')]#!#! $EFFECT_LIST_BULLET$ "
 POD_duel_move_piety_cost: "#medium;outline Cost: [piety_i][story.MakeScope.Var('piety_cost').GetValue|V0] [piety|E]#! $EFFECT_LIST_BULLET$"
 POD_duel_move_undodgeable: "#medium;outline #P Guaranteed#! to hit#! $EFFECT_LIST_BULLET$"



