##### Loadout Editor GUI

 POD_duel_loadout_title: "#FONT:PODSubtitles;bold;clickable;outline;size:24 Duel Move Loadout#!"

 POD_duel_move_title: "#bold;V [Scope.Var('decision').DecisionType.GetTitleForPlayer]#! (#V;bold [Scope.Var('ap_cost').GetValue|0]#! AP)"
 POD_duel_move_title_unformatted: "[Scope.Var('decision').DecisionType.GetTitleForPlayer] ([Scope.Var('ap_cost').GetValue|0] AP)"
# the datafunction to generate the duel move descriptions is kind of a mouthful.
# so i made a macro to shorten it (PODDuelMoveEffect).
# note the |h formatting tag. it makes the duel move's description text invisible.
# well, not really.
# the text in the custom_tooltips itself is formatted with #medium, which overwrites this.
# the invisible text is PURELY so the bullet points from custom_tooltip get hidden.
 POD_duel_move_tooltip: "[PODDuelMoveEffect(Scope.Story.MakeScope)|h]\n#weak;outline [Scope.Var('decision').DecisionType.GetShortDescForPlayer]#![AddLine( Scope.Var('decision').DecisionType.GetCommandDescForPlayer )]"

 POD_duel_loadout_show_all: "Show all duel moves?"
 POD_duel_loadout_compact_view: "Compact view"
 POD_duel_loadout_equipped_title: "Equipped moves: [GetPlayer.MakeScope.ScriptValue('POD_duel_moves_in_loadout')|0]/[EmptyScope.ScriptValue('POD_max_duel_moves_in_loadout')]"

 POD_duel_loadout_example_perk_title: "Example loc for inline tooltips:"
 POD_duel_loadout_example_perk_desc: "Unlocks the [PODDuelMove('POD_duel_move_zornhau')] Duel Move"



##### Duel move loc for perks and other tooltips

# these are very convoluted admittedly but as a result, all you have to do to to link a duel move is
# call the macro: e.g. [PODDuelMove('POD_duel_move_blood_heal')]. as long as the part that other scripters
# interface with is simple, it's good enough.

 POD_duel_move_link: "#TOOLTIP:[SCOPE.GetFlagName('flag')]_desc #L;V [Localize(SCOPE.GetFlagName('flag'))]#!#!"
 POD_duel_move_inline_tooltip: "#h $EFFECT_LIST_BULLET$#!#V;outline;size:16 #bold [story.MakeScope.Var('decision').DecisionType.GetTitleForPlayer]#! (#bold [story.MakeScope.Var('ap_cost').GetValue|0]#! AP)#!\n[PODDuelMoveEffect(story.MakeScope)|h]\n#h $EFFECT_LIST_BULLET$#!#weak;outline [story.MakeScope.Var('decision').DecisionType.GetShortDescForPlayer]#!"



##### Decision

 pod_combat_configure_skills: "Configure Combat Skills"
 pod_combat_configure_skills_desc: "Choose which combat moves to bring to your next fight."
 pod_combat_configure_skills_tooltip: "Choose which combat moves to equip for battle."
 pod_combat_configure_skills_confirm: "Open"



##### Duel move auto-generated tooltips

# these are the custom_tooltips called from the POD_duel_move_desc SGUI.
# they have access to all the variables on the story_cycle, so we can insert
# dynamic text and read variables this way.

# one thing that's annoying is that custom_tooltip always adds a bullet point.
# custom_description_no_bullet has no access to the current scope, and you also
# can't pass story_cycle scopes to it, so we can't use that one.
# the janky way around this is make the text invisible.
# as in, the entire SGUI that calls these custom_tooltips is wrapped in invisible formatting.
# this is why these loc entries are formatted with #medium.
# (because it negates the invisibility.)
# also, that's why there's another $EFFECT_LIST_BULLET$ at the end.
# it's a second bullet point, also invisible, so the text is centered properly.

 POD_duel_move_damage: "#medium;outline #bold;N Attack#! [story.MakeScope.Var('target').GetFlagName] for [story.MakeScope.Var('damage_value').GetValue|V0] [story.MakeScope.Var('damage_type').GetFlagName]#! $EFFECT_LIST_BULLET$"
 POD_duel_move_healing: "#medium;outline #bold;P Heal#! [story.MakeScope.Var('target').GetFlagName] for [story.MakeScope.Var('healing_value').GetValue|V0] [story.MakeScope.Var('healing_type').GetFlagName]#! $EFFECT_LIST_BULLET$"
# this one takes a splat-agnostic energy value and flavorizes it for the player's splat
 POD_duel_move_energy_cost: "#medium;outline Cost: [Multiply_CFixedPoint( story.MakeScope.Var('energy_cost').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0] #V [GetPlayer.Custom('PODEnergySplat')]#!#! $EFFECT_LIST_BULLET$ "
 POD_duel_move_piety_cost: "#medium;outline Cost: [piety_i][story.MakeScope.Var('piety_cost').GetValue|V0] [piety|E]#! $EFFECT_LIST_BULLET$"
 POD_duel_move_undodgeable: "#medium;outline #P Guaranteed#! to hit#! $EFFECT_LIST_BULLET$"



