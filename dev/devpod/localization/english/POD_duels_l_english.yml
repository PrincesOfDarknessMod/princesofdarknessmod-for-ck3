##### Duel moves

# i added a texticon to duel moves since that makes them more readable at a glance
 POD_duel_move_strike: "@skill_prowess_icon!Strike"
# the datafunction to generate the duel move descriptions is kind of a mouthful.
# so i made a macro to shorten it.
# note the |h formatting tag. it makes the duel move's description text invisible.
# well, not really.
# the text in the custom_tooltips itself is formatted with #medium, which overwrites this.
# the invisible text is PURELY so the bullet points from custom_tooltip get hidden.
 POD_duel_move_strike_tooltip: "[PODDuelMoveDesc('POD_duel_move_strike')|h]\n#weak;outline Standard melee attack#!"
 POD_duel_move_heavy_blow: "@skill_prowess_icon!Heavy Blow"
 POD_duel_move_heavy_blow_tooltip: "[PODDuelMoveDesc('POD_duel_move_heavy_blow')|h]\n#weak;outline Powerful overhead swing#!"
 POD_duel_move_quick_jab: "@skill_prowess_icon!Quick Jab"
 POD_duel_move_quick_jab_tooltip: "[PODDuelMoveDesc('POD_duel_move_quick_jab')|h]\n#weak;outline Fast low-cost strike#!"
 POD_duel_move_zornhau: "@personality_icon! Zornhau"
 POD_duel_move_zornhau_tooltip: "[PODDuelMoveDesc('POD_duel_move_zornhau')|h]\n#weak;outline Skillful diagonal hew#!"
 POD_duel_move_torch_sweep: "@supehunter_icon! Torch Sweep"
 POD_duel_move_torch_sweep_tooltip: "[PODDuelMoveDesc('POD_duel_move_torch_sweep')|h]\n#weak;outline Sweep a burning torch across the entire front#!"
 POD_duel_move_blood_heal: "@vampire_icon! Blood Heal"
 POD_duel_move_blood_heal_tooltip: "[PODDuelMoveDesc('POD_duel_move_blood_heal')|h]\n#weak;outline Spend vitae to mend wounds#!"