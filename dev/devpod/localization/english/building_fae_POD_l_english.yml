l_english:
 GLADE_FREEHOLD_BUILDING_ENABLED:0 "Province is of Jungle [terrain|E], Forest [terrain|E], or Taiga [terrain|E]"
 EYRIE_FREEHOLD_BUILDING_ENABLED:0 "Province is of Mountains [terrain|E] or Desert Mountains [terrain|E]"
 HOMESTEAD_FREEHOLD_BUILDING_ENABLED:0 "Holder has visited [dreaming|E]"
 GROTTO_FREEHOLD_BUILDING_ENABLED:0 "Province has Glade [building|E] or any mines [special_building|E]"
 
 building_type_glade_freehold_01:0 "Glade"
 building_type_glade_freehold_01_desc:0 "#F Glades are sylvan glens, typically located deep in a forest. Changeling's favor glades for many of their festivals. Unlike most freeholds, Glades are naturally occurring founts of Glamour.#!"
 building_glade_freehold_01:0 "Small Glade"
 building_glade_freehold_01_desc:0 "Glades are sylvan glens, typically located deep in a forest. Changeling's favor glades for many of their festivals."
 building_glade_freehold_02:0 "Medium Glade"
 building_glade_freehold_02_desc:0 "Glades are sylvan glens, typically located deep in a forest. Changeling's favor glades for many of their festivals."
 building_glade_freehold_03:0 "Large Glade"
 building_glade_freehold_03_desc:0 "Glades are sylvan glens, typically located deep in a forest. Changeling's favor glades for many of their festivals."
 
 building_type_hearth_freehold_01:0 "Hearth"
 building_type_hearth_freehold_01_desc:0 "#F A Hearth freehold is a faerie tavern, bar, or coffee house, usually with a back-alley entrance. All changelings are welcome as long as they have something to trade.#!"
 building_hearth_freehold_01:0 "Small Hearth"
 building_hearth_freehold_01_desc:0 "A Hearth freehold is a faerie tavern, bar, or coffee house, usually with a back-alley entrance."
 building_hearth_freehold_02:0 "Medium Hearth"
 building_hearth_freehold_02_desc:0 "A Hearth freehold is a faerie tavern, bar, or coffee house, usually with a back-alley entrance."
 building_hearth_freehold_03:0 "Large Hearth"
 building_hearth_freehold_03_desc:0 "A Hearth freehold is a faerie tavern, bar, or coffee house, usually with a back-alley entrance."
 
 building_type_lodge_freehold_01:0 "Lodge"
 building_type_lodge_freehold_01_desc:0 "#F Cottages, houses, and mansions, collectively considered lodges, can be freeholds. Lodges are typically the strongholds of nobles, who spend much of their time in residence.#!"
 building_lodge_freehold_01:0 "Small Lodge"
 building_lodge_freehold_01_desc:0 "Cottages, houses, and mansions, collectively considered lodges, can be freeholds."
 building_lodge_freehold_02:0 "Medium Lodge"
 building_lodge_freehold_02_desc:0 "Cottages, houses, and mansions, collectively considered lodges, can be freeholds."
 building_lodge_freehold_03:0 "Large Lodge"
 building_lodge_freehold_03_desc:0 "Cottages, houses, and mansions, collectively considered lodges, can be freeholds."
 
 building_type_manor_freehold_01:0 "Manor"
 building_type_manor_freehold_01_desc:0 "#F A manor is a small faerie glen surrounding a cabin or other building, and is usually located in the wilderness.#!"
 building_manor_freehold_01:0 "Small Manor"
 building_manor_freehold_01_desc:0 "A manor is a small faerie glen surrounding a cabin or other building, and is usually located in the wilderness."
 building_manor_freehold_02:0 "Medium Manor"
 building_manor_freehold_02_desc:0 "A manor is a small faerie glen surrounding a cabin or other building, and is usually located in the wilderness."
 building_manor_freehold_03:0 "Large Manor"
 building_manor_freehold_03_desc:0 "A manor is a small faerie glen surrounding a cabin or other building, and is usually located in the wilderness."
 
 building_type_eyrie_freehold_01:0 "Eyries"
 building_type_eyrie_freehold_01_desc:0 "#F Eyries are high mountain freeholds and are typically the refuges of outcasts.#!"
 building_eyrie_freehold_01:0 "Small Eyries"
 building_eyrie_freehold_01_desc:0 "Eyries are high mountain freeholds and are typically the refuges of outcasts."
 building_eyrie_freehold_02:0 "Medium Eyries"
 building_eyrie_freehold_02_desc:0 "Eyries are high mountain freeholds and are typically the refuges of outcasts."
 building_eyrie_freehold_03:0 "Large Eyries"
 building_eyrie_freehold_03_desc:0 "Eyries are high mountain freeholds and are typically the refuges of outcasts."
 
 building_type_grotto_freehold_01:0 "Grotto"
 building_type_grotto_freehold_01_desc:0 "#F Grottos are often overgrown sylvan glades or abandoned mines. Sluagh and nockers often gather in such out-of-the-way freeholds, though others use then as well.#!"
 building_grotto_freehold_01:0 "Small Grotto"
 building_grotto_freehold_01_desc:0 "Grottos are often overgrown sylvan glades or abandoned mines."
 building_grotto_freehold_02:0 "Medium Grotto"
 building_grotto_freehold_02_desc:0 "Grottos are often overgrown sylvan glades or abandoned mines."
 building_grotto_freehold_03:0 "Large Grotto"
 building_grotto_freehold_03_desc:0 "Grottos are often overgrown sylvan glades or abandoned mines."
 
 building_type_faerie_ring_freehold_01:0 "Faerie Ring"
 building_type_faerie_ring_freehold_01_desc:0 "#F A Faerie Ring is a very small glen found deep in the forest. These naturally occurring freeholds grow increasingly rare as the wild places of the world dwindle.#!"
 building_faerie_ring_freehold_01:0 "Small Faerie Ring"
 building_faerie_ring_freehold_01_desc:0 "A Faerie Ring is a very small glen found deep in the forest."
 building_faerie_ring_freehold_02:0 "Medium Faerie Ring"
 building_faerie_ring_freehold_02_desc:0 "A Faerie Ring is a very small glen found deep in the forest."
 building_faerie_ring_freehold_03:0 "Large Faerie Ring"
 building_faerie_ring_freehold_03_desc:0 "A Faerie Ring is a very small glen found deep in the forest."
 
 building_type_isle_freehold_01:0 "Isle"
 building_type_isle_freehold_01_desc:0 "#F These enchanted islands are rarely on maps or sullied by mortal feet. Isles are private refuges, and are among the most prized freeholds.#!"
 building_isle_freehold_01:0 "Small Isle"
 building_isle_freehold_01_desc:0 "These enchanted islands are rarely on maps or sullied by mortal feet."
 building_isle_freehold_02:0 "Medium Isle"
 building_isle_freehold_02_desc:0 "These enchanted islands are rarely on maps or sullied by mortal feet."
 building_isle_freehold_03:0 "Large Isle"
 building_isle_freehold_03_desc:0 "These enchanted islands are rarely on maps or sullied by mortal feet."
 
 building_type_thorpe_freehold_01:0 "Thorpe"
 building_type_thorpe_freehold_01_desc:0 "#F A thorpe is a faerie town.#!"
 building_thorpe_freehold_01:0 "Small Thorpe"
 building_thorpe_freehold_01_desc:0 "A thorpe is a faerie town."
 building_thorpe_freehold_02:0 "Medium Thorpe"
 building_thorpe_freehold_02_desc:0 "A thorpe is a faerie town."
 building_thorpe_freehold_03:0 "Large Thorpe"
 building_thorpe_freehold_03_desc:0 "A thorpe is a faerie town."
 
 building_type_urban_freehold_01:0 "Urban"
 building_type_urban_freehold_01_desc:0 "#F Only the hardiest Kithain dare to live in the World of Darkness' choking urban sprawls. Banality is at its highest here, and untainted Glamour is scarce. These freeholds are on the edge of the coming Winter.#!"
 building_urban_freehold_01:0 "Small Urban"
 building_urban_freehold_01_desc:0 "Only the hardiest Kithain dare to live in the World of Darkness' choking urban sprawls."
 building_urban_freehold_02:0 "Medium Urban"
 building_urban_freehold_02_desc:0 "Only the hardiest Kithain dare to live in the World of Darkness' choking urban sprawls."
 building_urban_freehold_03:0 "Large Urban"
 building_urban_freehold_03_desc:0 "Only the hardiest Kithain dare to live in the World of Darkness' choking urban sprawls."
 
 building_type_market_freehold_01:0 "Market"
 building_type_market_freehold_01_desc:0 "#F Faerie Markets are places, often freeholds, where changelings come to buy, sell, and trade strange treasures from a thousand realms. These places often share space with human markets covertly, though they may exist wholly in the [dreaming|E], such as the Goblin Market. A human may purchase a piece of faerie craft "Accidentally" on occasion. Such transactions may be lucky or disastrous for the unwary human.#!"
 building_market_freehold_01:0 "Small Market"
 building_market_freehold_01_desc:0 "Faerie Markets are places, often freeholds, where changelings come to buy, sell, and trade strange treasures from a thousand realms."
 building_market_freehold_02:0 "Medium Market"
 building_market_freehold_02_desc:0 "Faerie Markets are places, often freeholds, where changelings come to buy, sell, and trade strange treasures from a thousand realms."
 building_market_freehold_03:0 "Large Market"
 building_market_freehold_03_desc:0 "Faerie Markets are places, often freeholds, where changelings come to buy, sell, and trade strange treasures from a thousand realms."
 
 building_type_homestead_freehold_01:0 "Homestead"
 building_type_homestead_freehold_01_desc:0 "#F Homesteads are freeholds that are wholly in the [dreaming|E], yet without access to a Rath. They do not have the dual nature of most freeholds; their prime virtue is stability. The Kithain build homesteads to withstand the rigors of the [dreaming|E]. Homesteaders are few but fiercely independent. Some changelings from every kith set up homesteads (even small villages) in the Near [dreaming|E].#!"
 building_homestead_freehold_01:0 "Small Homestead"
 building_homestead_freehold_01_desc:0 "Homesteads are freeholds that are wholly in the [dreaming|E], yet without access to a Rath."
 building_homestead_freehold_02:0 "Medium Homestead"
 building_homestead_freehold_02_desc:0 "Homesteads are freeholds that are wholly in the [dreaming|E], yet without access to a Rath."
 building_homestead_freehold_03:0 "Large Homestead"
 building_homestead_freehold_03_desc:0 "Homesteads are freeholds that are wholly in the [dreaming|E], yet without access to a Rath."
 
 building_type_land_trod_01:0 "Land Trod"
 building_type_land_trod_01_desc:0 "#F Land trods may be anything from a wide superhighway to a narrow path along a precipice. They may pass through idyllic faerie towns, by literally burning deserts, or through forests of mists and moaning trees. A changeling may walk, ride, or drive along these trods; mode of travel is limited only by terrain.#!"
 building_land_trod_01:0 "Small Land Trod"
 building_land_trod_01_desc:0 "Land trods may be anything from a wide superhighway to a narrow path along a precipice."
 building_land_trod_02:0 "Medium Land Trod"
 building_land_trod_02_desc:0 "Land trods may be anything from a wide superhighway to a narrow path along a precipice."
 building_land_trod_03:0 "Large Land Trod"
 building_land_trod_03_desc:0 "Land trods may be anything from a wide superhighway to a narrow path along a precipice."
 
 building_type_water_trod_01:0 "Water Trod"
 building_type_water_trod_01_desc:0 "#F These trods may be as small as a mountain stream or as vast as a thousand oceans. Due to the lack of recognizable landmarks, travelers on this type of trod must rely on charts and other navigational treasures to travel these watery paths safely.#!"
 building_water_trod_01:0 "Small Water Trod"
 building_water_trod_01_desc:0 "These trods may be as small as a mountain stream or as vast as a thousand oceans."
 building_water_trod_02:0 "Medium Water Trod"
 building_water_trod_02_desc:0 "These trods may be as small as a mountain stream or as vast as a thousand oceans."
 building_water_trod_03:0 "Large Water Trod"
 building_water_trod_03_desc:0 "These trods may be as small as a mountain stream or as vast as a thousand oceans."
 
 building_type_sun_trod_01:0 "Sun Trod"
 building_type_sun_trod_01_desc:0 "#F Sun trods are sky trods that are open only during the day. Only those changelings who can fly (even in a balloon) may travel these ethereal highways. Sun trods may appear as shafts of focused sunlight or as paths along sunlit clouds. A changeling traveling a sun trod must find a moon trod to continue their journey after dark.#!"
 building_sun_trod_01:0 "Small Sun Trod"
 building_sun_trod_01_desc:0 "Sun trods are sky trods that are open only during the day."
 building_sun_trod_02:0 "Medium Sun Trod"
 building_sun_trod_02_desc:0 "Sun trods are sky trods that are open only during the day."
 building_sun_trod_03:0 "Large Sun Trod"
 building_sun_trod_03_desc:0 "Sun trods are sky trods that are open only during the day."
 
 building_type_moon_trod_01:0 "Moon Trod"
 building_type_moon_trod_01_desc:0 "#F Moon trods are sky trods that are open only at night. Only those changelings who can fly may travel these lunar phantom trails. Moon trods may appear as dust motes dancing in shafts of pale moonlight or as paths along night-sky clouds.#!"
 building_moon_trod_01:0 "Small Moon Trod"
 building_moon_trod_01_desc:0 "Moon trods are sky trods that are open only at night."
 building_moon_trod_02:0 "Medium Moon Trod"
 building_moon_trod_02_desc:0 "Moon trods are sky trods that are open only at night."
 building_moon_trod_03:0 "Large Moon Trod"
 building_moon_trod_03_desc:0 "Moon trods are sky trods that are open only at night."
 
 building_type_chimerical_trod_01:0 "Chimerical Trod"
 building_type_chimerical_trod_01_desc:0 "#F Chimerical trods are far too ethereal for material creatures such as the fae to travel, but chimera have little trouble using these Glamour-rich roads. Some arcane Arts may allow changelings entry to these alien trods. Such paths are extraordinarily dangerous, even to the most potent Kithain. The Silver Path does not extend into these trods.#!"
 building_chimerical_trod_01:0 "Small Chimerical Trod"
 building_chimerical_trod_01_desc:0 "Chimerical trods are far too ethereal for material creatures such as the fae to travel, but chimera have little trouble using these Glamour-rich roads."
 building_chimerical_trod_02:0 "Medium Chimerical Trod"
 building_chimerical_trod_02_desc:0 "Chimerical trods are far too ethereal for material creatures such as the fae to travel, but chimera have little trouble using these Glamour-rich roads."
 building_chimerical_trod_03:0 "Large Chimerical Trod"
 building_chimerical_trod_03_desc:0 "Chimerical trods are far too ethereal for material creatures such as the fae to travel, but chimera have little trouble using these Glamour-rich roads."
 
 building_type_nightmare_trod_01:0 "Nightmare Trod"
 building_type_nightmare_trod_01_desc:0 "#F The Nightmare Realms fester in the Deep [dreaming|E] like an insatiable cancer. Dark and twisted trods spiral from them, touching almost every other part of the [dreaming|E]. Malignant chimera and even darker creatures travel these fearsome roads. Some Unseelie changelings use these trods on secret errands, but these paths are dangerous even to them. The Silver Path exists along some of these trods. Most believe the Tuatha de Danaan built the path there during their wars with the Fomorians.#!"
 building_nightmare_trod_01:0 "Small Nightmare Trod"
 building_nightmare_trod_01_desc:0 "The Nightmare Realms fester in the Deep [dreaming|E] like an insatiable cancer."
 building_nightmare_trod_02:0 "Medium Nightmare Trod"
 building_nightmare_trod_02_desc:0 "The Nightmare Realms fester in the Deep [dreaming|E] like an insatiable cancer."
 building_nightmare_trod_03:0 "Large Nightmare Trod"
 building_nightmare_trod_03_desc:0 "The Nightmare Realms fester in the Deep [dreaming|E] like an insatiable cancer."