 building_market_05: "Gargantuan $building_type_market_01$"
 building_market_05_desc: "$building_type_market_01_desc$"

 building_type_homestead_01: "Homestead"
 building_type_homestead_01_desc: "#flavor Homesteads are freeholds dedicated to the cultivation and production of various chimerical crops and animals. Due to their nature, homesteads have barely any presence in the mundane world and are, instead, located almost completely in the Near Dreaming. Homesteads are generally run by commoners, but are almost always beholden to another freehold for trade and defense. Homesteads may be specific, focusing on only a single resource, or generalized, producing a wider variety of goods.#!"
 building_homestead_01: "Small $building_type_homestead_01$"
 building_homestead_01_desc: "$building_type_homestead_01_desc$"
 building_homestead_02: "Standard $building_type_homestead_01$"
 building_homestead_02_desc: "$building_type_homestead_01_desc$"
