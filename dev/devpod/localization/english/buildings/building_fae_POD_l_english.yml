l_english:
 building_type_trods_01: "Trods"
 building_type_trods_01_desc: "#flavor A web of magical paths crosses both the mundane world and all points in the Dreaming. These pathways have existed for centuries, and though they have degraded and some branches have become lost over time, the system of trods that branch throughout known (and unknown) space are an important transportation system for changelings everywhere.#!"
 building_trods_01: "Very Small Trods"
 building_trods_01_desc: "Trods in this area are quite small and hard to access"
 building_trods_02: "Small Trods"
 building_trods_02_desc: "Trods in this area are small and a bit hard to access"
 building_trods_03: "Standard Trods"
 building_trods_03_desc: "Trods in this area are in usable condition"
 building_trods_04: "Big Trods"
 building_trods_04_desc: "Trods in this area are of quite good quality, with easy access and not small size"
 building_trods_05: "Huge Trods"
 building_trods_05_desc: "Trods in this area are of good quality, with very easy access and big size"
 building_trods_06: "Gargantuan Trods"
 building_trods_06_desc: "Trods in this area are of very good quality, they can be entered without much effort and their size is gargantuan"

 building_type_hearth_01: "Hearth"
 building_type_hearth_01_desc: "#flavor A hearth freehold typically takes the form of a wayhouse, or taproom tucked away from the prying eyes of mortals. No matter how powerful they may be, all hearths are considered sacrosanct, more so than any other freehold, and most fae will defend them to the death.#!"
 building_hearth_01: "Small $building_type_hearth_01$"
 building_hearth_01_desc: "$building_type_hearth_01_desc$"
 building_hearth_02: "Standard $building_type_hearth_01$"
