 building_thorpe_05_desc: "$building_type_thorpe_01_desc$"

 building_type_manor_01: "Manor"
 building_type_manor_01_desc: "#flavor Somewhat broader in scope than strongholds, but not as all-encompassing as thorpes, manor freeholds are tiny communities surrounding a central building that houses the balefire. Next to hearths, manor freeholds are the most common and are almost universally in the hands of sidhe and ennobled kiths.#!"
 building_manor_01: "Small $building_type_manor_01$"
 building_manor_01_desc: "$building_type_manor_01_desc$"
 building_manor_02: "Standard $building_type_manor_01$"
 building_manor_02_desc: "$building_type_manor_01_desc$"
