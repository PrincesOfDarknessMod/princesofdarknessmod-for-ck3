 building_type_thorpe_01: "Thorpe"
 building_type_thorpe_01_desc: "#flavor Thorpes are freeholds that encompass urban neighborhoods or rural towns of mostly-fae residents.#!"
 building_thorpe_01: "Small $building_type_thorpe_01$"
 building_thorpe_01_desc: "$building_type_thorpe_01_desc$"
