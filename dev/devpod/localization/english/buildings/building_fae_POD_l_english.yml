 building_hearth_03_desc: "$building_type_hearth_01_desc$"
 building_hearth_04: "Huge $building_type_hearth_01$"
 building_hearth_04_desc: "$building_type_hearth_01_desc$"
 building_hearth_05: "Gargantuan $building_type_hearth_01$"
 building_hearth_05_desc: "$building_type_hearth_01_desc$"

 building_type_stronghold_01: "Stronghold"
 building_type_stronghold_01_desc: "#flavor Stronghold freeholds are seats of power for faerie lords and other nobles, heavily fortified and able to withstand siege.#!"
 building_stronghold_01: "Small $building_type_stronghold_01$"
 building_stronghold_01_desc: "$building_type_stronghold_01_desc$"
