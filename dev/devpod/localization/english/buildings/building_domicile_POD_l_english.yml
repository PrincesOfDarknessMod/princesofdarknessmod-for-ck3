 oculi_dei_01_domicile_building: "Oculi Dei Quarters"
 oculi_dei_01_domicile_building_desc: "The Oculi Dei are the laymen of the Shadow Inquisition. Less impressive (and feared) than their clergy counterparts, they can keep their ears to the ground and their finger on the pulse of the common people."
 oculi_dei_02_domicile_building: "$oculi_dei_01_domicile_building$"
 oculi_dei_02_domicile_building_desc: "$oculi_dei_01_domicile_building_desc$"
