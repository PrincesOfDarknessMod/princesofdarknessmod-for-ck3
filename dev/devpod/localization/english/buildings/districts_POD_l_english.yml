 # Jerusalem
 
 POD_christian_jerusalem_district: "Christian Jerusalem"
 POD_christian_jerusalem_district_desc: "The center of a Christian ruler's hidden influence over the [grand_city|E] of [holy_jerusalem|E]."
 POD_christian_jerusalem_district_desc_flavor: "Jerusalem once saw the death and resurrection of Jesus Christ and was home to the early Church. While the Muslims have ruled this city for some time, the Crusades shifted the balance. They may be over, but the shifting has not yet ended."
 pb_christian_jerusalem: "$POD_christian_jerusalem_district$"
 pb_christian_jerusalem_desc: "$grand_city_district_desc_flavor$"
 
 POD_muslim_jerusalem_district: "Muslim Al-Quds"
 POD_muslim_jerusalem_district_desc: "The center of a Muslim ruler's hidden influence over the [grand_city|E] of [holy_jerusalem|E]."
 POD_muslim_jerusalem_district_desc_flavor: "Al-Quds is home to the prophet Muhammad's first Qibla and has hosted the Dome of the Rock since it was conquered by the Rashidun Caliphate. While the balance of power has shifted, any change can be reversed."
 pb_muslim_jerusalem: "$POD_muslim_jerusalem_district$"
 pb_muslim_jerusalem_desc: "$grand_city_district_desc_flavor$"
 
