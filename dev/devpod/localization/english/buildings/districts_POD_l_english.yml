 POD_jewish_jerusalem_district_desc_flavor: "Yerushalaim was once home of G-d's temple, the Beit HaMikdash. Little remains of those days, including our people. Yet, this has always been a tumultuous land, and change is always possible."
 pb_jewish_jerusalem: "$POD_jewish_jerusalem_district$"
 pb_jewish_jerusalem_desc: "$grand_city_district_desc_flavor$"
 
 POD_divided_jerusalem_district: "Divided Jerusalem"
 POD_divided_jerusalem_district_desc: "The center of a supernatural ruler's hidden influence over the [grand_city|E] of [holy_jerusalem|E]."
 POD_divided_jerusalem_district_desc_flavor: "Jerusalem balances on a knife's edge, teetering between the three main religious factions. The 3 Abrahamic factions are constantly fighting for control, and their supernatural counterparts frequently involve themselves."
 pb_divided_jerusalem: "$POD_divided_jerusalem_district$"
 pb_divided_jerusalem_desc: "$grand_city_district_desc_flavor$"
 
