l_english:
 ###################################
 #######   SPLAT DISTRICTS   #######
 ###################################
 
 # Fallback
 POD_wod_district: "Hidden Influence"
 POD_wod_district_desc_flavor: "You are not a builder of infrastructure. Let the mortals worry about food supplies and zoning laws. Let them build, and toil, and take the blame when something goes wrong. And all the while, you hold power where it #italic really#! matters."
 
 # Primary Buildings
 pb_wod_01: "$POD_wod_district$"
 pb_wod_02: "$POD_wod_district$"
 pb_wod_03: "$POD_wod_district$"
 pb_wod_04: "$POD_wod_district$"
 pb_wod_05: "$POD_wod_district$"
 pb_wod_01_desc: "$POD_wod_district_desc_flavor$"
 pb_wod_02_desc: "$POD_wod_district_desc_flavor$"
 pb_wod_03_desc: "$POD_wod_district_desc_flavor$"
 pb_wod_04_desc: "$POD_wod_district_desc_flavor$"
 pb_wod_05_desc: "$POD_wod_district_desc_flavor$"
 
 POD_cainite_district: "Cainite Influence"
 POD_cainite_district_desc_flavor: "The true rulers of the night exert a clandestine influence over mortal institutions. Lawmakers, merchants, and criminal elements all become tools of their puppetmaster, though they might need a little convincing at first."
 
 POD_kueijin_district: "Hungry Dead Influence"
 POD_kueijin_district_desc_flavor: "$POD_cainite_district_desc_flavor$"
 
 POD_revenant_district: "Revenant Enclave"
 POD_revenant_district_desc_flavor: "The libertine excesses that transpire behind these closed doors would make Elagabalus blush and make Caligula look well-adjusted. But no matter what, it's family. You don't turn your back on family."
 
 POD_inquisitor_district: "Inquisition Influence"
 POD_inquisitor_district_desc_flavor: "Every city has souls in need of saving. Who will be the shepherd to guide this wayward flock to safety? Who will protect them from the godless beasts who prowl at night? You, of course."
 
 POD_hunter_district: "Hunter Influence"
 POD_hunter_district_desc_flavor: "It's just you, your sword, and the sorry bastards who joined your foolhardy line of work because they had nothing else to lose.\nGood luck."
 
 POD_ghoulbro_district: "Calomena's Forsaken Influence"
 POD_ghoulbro_district_desc_flavor: "Here, the oppressed learn how to fight back against their oppressors. A tyrant's iron fist can be pried open with enough pressure: if not softly, then by force."
 
 POD_mummy_district: "Mummy Cult Influence"
 POD_mummy_district_desc_flavor: "The followers of a venerable immortal meet in secret to bring back a little slice of the ancient past."
 
 POD_demon_district: "Infernal Cult Influence"
 POD_demon_district_desc_flavor: "Come near, come far! Hear the good word of your benevolent master, who bestows upon loyal minions a wealth of rewards! A long, prosperous life and the power to bring down all who wronged you! Come near, come far."
 
 # TODO MAGE
 #POD_mage_district: "Mage Influence"
 #POD_mage_district_desc_flavor: "In the places where the spirit of the city beats and people gather, hidden masters dreaming of changing the world and illuminating the masses to the possibility of tomorrow draft plans and ambitions to reshape the world, no matter how hard it pushes back."
 
 POD_wraith_district: "Wraith Influence"
 POD_wraith_district_desc_flavor: "TODO GDP"
 
 POD_fae_district: "Fae Influence"
 POD_fae_district_desc_flavor: "Despite the growing influence of Science and Reason, one can still find pockets of real awe and wonderment among the humans, if one knows where to look."
 
 POD_werewolf_district: "Garou Community"
 POD_werewolf_district_desc_flavor: "In the woodlands, game trails, and slums, the first soldiers sharpen their claws for an unending war. Their touch is unseen as the souls of the city itself pay homage to the wild masters in the places most men dare not to tread, lest they be reminded man is not the deadliest predator."
 
 POD_bastet_district: "Bastet Community"
 POD_bastet_district_desc_flavor: "$POD_werewolf_district_desc_flavor$"
 
 POD_mokole_district: "Mokolé Community"
 POD_mokole_district_desc_flavor: "$POD_werewolf_district_desc_flavor$"
 
 
 ###########################################
 #######   DUCHY CAPITAL DISTRICTS   #######
 ###########################################
 
 POD_wod_duchy_district: "Regional Influence"
 POD_wod_duchy_district_desc: "[duchy_districts|E] can be built without owning the [duchy|E] title."
 POD_wod_duchy_district_desc_flavor: "Perhaps you feed on the prosperity of mortal society like a bloated tick, or perhaps you see yourself as more of a benevolent guardian. The fact remains that parasites can't outgrow their hosts, and if you want to thrive, you need to attach yourself to a larger population center. Like this one."
 
 pb_wod_duchy_01: "$POD_wod_duchy_district$"
 pb_wod_duchy_01_desc: "$POD_wod_duchy_district_desc_flavor$"
 
 
