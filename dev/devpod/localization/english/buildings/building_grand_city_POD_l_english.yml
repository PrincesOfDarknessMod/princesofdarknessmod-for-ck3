 building_type_constantinople_reform_the_hippodrome_01: "The Hippodrome"
 building_type_constantinople_reform_the_hippodrome_01_desc: "The Hippodrome of Constantinople was a circus that was the sporting and social center of Constantinople, famous for hosting horse racing and chariot racing.\nThe chariot races are a long gone fade at this point but the stones it uses are still good and could help rebuild the city quicker than expected."
