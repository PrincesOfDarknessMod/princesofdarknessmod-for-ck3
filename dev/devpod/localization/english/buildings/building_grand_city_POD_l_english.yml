 building_type_constantinople_rebuild_the_hippodrome_01: "The Hippodrome"
 building_type_constantinople_rebuild_the_hippodrome_01_desc: "The Hippodrome of Constantinople was a circus that was the sporting and social center of Constantinople, famous for hosting horse racing and chariot racing.\nRestoring the place and restarting the games would please the populace (despite the likely return of the supporters riots as well)."
