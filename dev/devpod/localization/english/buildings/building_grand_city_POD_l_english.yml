 building_type_constantinople_rebuild_seraglio_lighthouse_01: "Seraglio Lighthouse"
 building_type_constantinople_rebuild_seraglio_lighthouse_01_desc: "The Sea of Marmara turns into the Golden Horn around the Seraglio lighthouse, a light in the dark for the ships trying to come or leave the city.\nWith the Latins ousted from the city, the lighthouse once again serves as a beacon for merchant vessels and not plundering ones."
