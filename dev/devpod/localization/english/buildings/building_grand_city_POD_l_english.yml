building_mogadishu_abandoned_cainite_ceel_waaq_04_desc: "Mist prowls the empty streets in the place of men wind howls through abandoned buildings and deep in the depths the sleeping body of a monster smiles, satisfied. "

building_type_mogadishu_abandoned_cainite_catacombs_01: "Abandoned Catacombs"
building_type_mogadishu_abandoned_cainite_catacombs_01_desc: "The creature in the catacombs thinks of the city as hers and frowns on any exploitation that isn't hers, giving up an whole neighborhoods of the city might burn your pride but it is necessary to calm the anger of the monster"
