 #############################
 ####### Sinful baghdad ######
 #############################

 building_type_baghdad_sinful_baghdad_01: "Babylon, Hell on Earth"
 building_type_baghdad_sinful_baghdad_01_desc: "Mesopotamian sorcerers sought opulence and power through favor from the Underworld. Before hell existed in the human imagination, Babylon vied to become hell on earth."
 building_baghdad_sinful_baghdad_01: "Babylon, Memories of Sin"
 building_baghdad_sinful_baghdad_01_desc: "In the fifth century B.C., Herodotus traveled the Mediterranean world. Of Babylon, he wrote a damning and frightening account. It was wildly inaccurate, of course.\n\nThe truth he missed was way worse."
 building_baghdad_sinful_baghdad_02: "Babylon, City of Sin"
 building_baghdad_sinful_baghdad_02_desc: "In came the servants of Entropy, those beings who serve the primordial spirit of destruction; Infernal demons, apparently the servants of a hell that exists either deep in the [umbra|E] or in some fracture in space; and the Things-That-Should-Not-Be, the denizens of the outer darkness, the Void, those unexplainable, gibbering creatures who long to enter this universe.\n\nAll three shared Babylon."
 building_baghdad_sinful_baghdad_03: "Babylon, Hell on Earth"
 building_baghdad_sinful_baghdad_03_desc: "It was a glorious time to lose one’s soul. Things from the Void, and soon Malfeans and other demons as well, had free rein over the city. They troubled the sleep of children and whispered in the ears of kings."

 building_type_baghdad_sinful_palace_of_etemenanki_01: "Palace of Etemenanki"
 building_type_baghdad_sinful_palace_of_etemenanki_01_desc: "Near the Western wall of the old Babylon stood a seven-tiered ziggurat named “Etemenanki”, which means \"the foundation of heaven and earth\"."
 building_baghdad_sinful_palace_of_etemenanki_01: "The Anunnaku"
 building_baghdad_sinful_palace_of_etemenanki_01_desc: "Before Creation, there were the Anunnaku. The Pure Ones experimented with the Quintessence that would one day become the Tellurian. But some of the old gods trapped themselves in the knots in the threads of the Tapestry. These trapped gods became the Void, and the stars were their prisons."
 building_baghdad_sinful_palace_of_etemenanki_02: "Power from the Void"
 building_baghdad_sinful_palace_of_etemenanki_02_desc: "But even from the first times, humanity knew the names of the unnamed gods. Men whispered to the heavens at night as they looked up at the stars and begged for power. Their prayers were answered."
 building_baghdad_sinful_palace_of_etemenanki_03: "The Society of Etemenanki Ascends"
 building_baghdad_sinful_palace_of_etemenanki_03_desc: "By the time of Nebuchadnezzar, almost half of the officials and priests in Babylon joined the dark society. Influential followers of the Void ensured that the En of Marduk, when he wasn’t a part of the conspiracy himself, turned a blind eye to the nightly rituals that took place in Marduk’s temple atop Etemenanki."
 building_baghdad_sinful_palace_of_etemenanki_04: "The Unholy Priests"
 building_baghdad_sinful_palace_of_etemenanki_04_desc: "The conspirators chose a priest from among their ranks, called the Bel in mockery of Marduk. The selection process changed through the centuries, but in the time of Nebuchadnezzar it was a contest to summon the most powerful demon."
 building_baghdad_sinful_palace_of_etemenanki_05: "Etemenanki: The First Labyrinth"
 building_baghdad_sinful_palace_of_etemenanki_05_desc: "Etemenanki, guided by one Bel or another, became the first “Labyrinth” even before the word was used. From the high perch overlooking the city, astrologers studied the signs and fulfilled their masters’ wishes."

 building_type_baghdad_sinful_hanging_gardens_01: "The Hanging Gardens"
 building_type_baghdad_sinful_hanging_gardens_01_desc: "The most famous piece of ancient Babylon, waiting to be uncovered and claimed by a worthy conqueror that will appreciate its unearthly beauty."
 building_baghdad_sinful_hanging_gardens_01: "Regular Gardens"
 building_baghdad_sinful_hanging_gardens_01_desc: "The Marvel of Mankind is still in a pitiful state. Recovery and work have started however, perhaps one day to return it to its previous glory."
 building_baghdad_sinful_hanging_gardens_02: "Grand Gardens"
 building_baghdad_sinful_hanging_gardens_02_desc: "$building_baghdad_sinful_hanging_gardens_01_desc$"
 building_baghdad_sinful_hanging_gardens_03: "Hanging the Gardens"
 building_baghdad_sinful_hanging_gardens_03_desc: "These grand gardens are not yet the ones of ancient Babylon but the sheer variety and opulence makes anyone think twice before calling you a liar."
 building_baghdad_sinful_hanging_gardens_04: "The Hanging Gardens"
 building_baghdad_sinful_hanging_gardens_04_desc: "Finally! Even the demons alive during the glorious days of old would recognize your prestige and power for rebuilding Nebuchadnezzar II's wonder!"
 building_baghdad_sinful_hanging_gardens_05: "Flying Gardens"
 building_baghdad_sinful_hanging_gardens_05_desc: "Hanging Gardens? How pedestrian, your gardens fly! Let any who come to your city visit them and be in awe of your power. This is the first step towards worship after all."

 building_type_baghdad_sinful_gate_of_ishtar_01: "Gate of Ishtar"
 building_type_baghdad_sinful_gate_of_ishtar_01_desc: "The name “Babylon” means “the gate of God” but what walked through the gates was anything but holy."
 building_baghdad_sinful_gate_of_ishtar_01: "Crossroads of the Infernal"
 building_baghdad_sinful_gate_of_ishtar_01_desc: "While the mysterious East and the haunted forests of pagan Europe had known demons since prehistory, the city of Babylon was a crossroads for Infernal entities."
 building_baghdad_sinful_gate_of_ishtar_02: "Gate to Entropy"
 building_baghdad_sinful_gate_of_ishtar_02_desc: "Servants of Entropy, star-bound creatures from the outer Void and denizens of the Pit nested within the walls of the first great city."
 building_baghdad_sinful_gate_of_ishtar_03: "Birthplace of Summoning"
 building_baghdad_sinful_gate_of_ishtar_03_desc: "While truck with demons and the binding of foul spirits is now standard practice for Nephandi and other sell-souls, Babylon was the birthplace of the summoning arts."
 building_baghdad_sinful_gate_of_ishtar_04: "A City of Malice and Profanity"
 building_baghdad_sinful_gate_of_ishtar_04_desc: "Babylon swarmed with demons. From the time of Hammurabi until the city’s decline under Seleucia, the conspiracy of Etemenanki invited malice and profanity inside its walls."
 building_baghdad_sinful_gate_of_ishtar_05: "Demonic Gate of Ishtar"
 building_baghdad_sinful_gate_of_ishtar_05_desc: "In the end, a city is defined by its demons."

 building_type_baghdad_sinful_tower_of_babel_01: "Tower of Babel"
 building_type_baghdad_sinful_tower_of_babel_01_desc: "Go to, let us build us a city and a tower, whose top may reach unto heaven; and let us make us a name, lest we be scattered abroad upon the face of the whole earth."
 building_baghdad_sinful_tower_of_babel_01: "Uncovering the Tower"
 building_baghdad_sinful_tower_of_babel_01_desc: "And the whole earth was of one language, and of one speech. And it came to pass, as they journeyed from the east, that they found a plain in the land of Shinar; and they dwelt there." # Genesis 11:1-2 KJV
 building_baghdad_sinful_tower_of_babel_02: "Ruins of the Tower"
 building_baghdad_sinful_tower_of_babel_02_desc: "And they said to one another, Go to, let us make brick, and burn them thoroughly. And they had brick for stone, and slime had they for mortar." # Genesis 11:3 KJV
 building_baghdad_sinful_tower_of_babel_03: "Repairing the Tower"
 building_baghdad_sinful_tower_of_babel_03_desc: "And they said, Go to, let us build us a city and a tower, whose top may reach unto heaven; and let us make us a name, lest we be scattered abroad upon the face of the whole earth." # Genesis 11:4 KJV
 building_baghdad_sinful_tower_of_babel_04: "Rebuilt Tower"
 building_baghdad_sinful_tower_of_babel_04_desc: "And the LORD came down to see the city and the tower, which the children of men built. And the LORD said, Behold, the people is one, and they have all one language; and this they begin to do; and now nothing will be restrained from them, which they have imagined to do." # Genesis 11:5-6 KJV
 building_baghdad_sinful_tower_of_babel_05: "Tower of Babel: Affront to God"
 building_baghdad_sinful_tower_of_babel_05_desc: "Therefore is the name of it called Babel; because the LORD did there confound the language of all the earth: and from thence did the LORD scatter them abroad upon the face of all the earth." # Genesis 11:9 KJV

 building_type_baghdad_sinful_tomb_of_nergal_01: "Cursed Tomb"
 building_type_baghdad_sinful_tomb_of_nergal_01_desc: "A temple recently excavated has become the home of strange occurrences. Some say it is a tomb, cursed by a forgotten deity. Few dare approach unless forced to do so."
 building_baghdad_sinful_tomb_of_nergal_01: "Opening up the Tomb"
 building_baghdad_sinful_tomb_of_nergal_01_desc: "Reality flickers and frays as you walk deeper into the tomb, only something of truly immense power could have done this. And a being of such power is never as dead as they seem..."
 building_baghdad_sinful_tomb_of_nergal_02: "Cleaning out the Rubble"
 building_baghdad_sinful_tomb_of_nergal_02_desc: "$building_baghdad_sinful_tomb_of_nergal_01_desc$"
 building_baghdad_sinful_tomb_of_nergal_03: "Identifying the Creature"
 building_baghdad_sinful_tomb_of_nergal_03_desc: "You have found the sarcophagus and the inscriptions written on it, there can be no doubt of what you have found... of who you have found."
 building_baghdad_sinful_tomb_of_nergal_04: "Opening the Sarcophagus"
 building_baghdad_sinful_tomb_of_nergal_04_desc: "$building_baghdad_sinful_tomb_of_nergal_03_desc$"
 building_baghdad_sinful_tomb_of_nergal_05: "Open Tomb"
 building_baghdad_sinful_tomb_of_nergal_05_desc: "The sarcophagus is empty, its owner having long since left its confines, but no one needs to know that as their fear is a powerful weapon that can coerce their obedience."

 building_type_baghdad_sinful_temples_of_the_gods_01: "Temples of the Devil-Kings"
 building_type_baghdad_sinful_temples_of_the_gods_01_desc: "Babylon first fell when Marduk triumphed over the infernal city. But the collapse of the Greek and Roman civilizations ushered a new era: the Devil-King Age."
 building_baghdad_sinful_temples_of_the_gods_01: "Forgotten Temples"
 building_baghdad_sinful_temples_of_the_gods_01_desc: "Once again, the temples rose. Once again, black stones were hoisted into place by demonic hands and legions of victims screamed beneath the skinning-knife."
 building_baghdad_sinful_temples_of_the_gods_02: "Restarting the Ceremonies"
 building_baghdad_sinful_temples_of_the_gods_02_desc: "$building_baghdad_sinful_temples_of_the_gods_01_desc$"
 building_baghdad_sinful_temples_of_the_gods_03: "Rebuilt Temples"
 building_baghdad_sinful_temples_of_the_gods_03_desc: "A succession of powerful witch-priests restored the glory of Babylon and Ur, and built small but decadent cities."
 building_baghdad_sinful_temples_of_the_gods_04: "Reasserting Dominance"
 building_baghdad_sinful_temples_of_the_gods_04_desc: "For nearly 600 years, the Gatekeepers and their allies enjoyed the fruits of mystick domination."
 building_baghdad_sinful_temples_of_the_gods_05: "Relics of the Devil-Kings"
 building_baghdad_sinful_temples_of_the_gods_05_desc: "By the time Islam’s armies finally put an end to their return, the Devil-Kings had carved elaborate temples, libraries and catacombs beneath their cities. Not even the victorious armies could uncover them all."

 building_type_baghdad_sinful_desecrated_second_temple_01: "Remnants of Bhat"
 building_type_baghdad_sinful_desecrated_second_temple_01_desc: "The demon haunted city cast a terrible shadow over ancient Babylon. Its ultimate defeat brought many infernal relics that could be of use today."
 building_baghdad_sinful_desecrated_second_temple_01: "Remnants of the Living City"
 building_baghdad_sinful_desecrated_second_temple_01_desc: "The few surviving accounts of the city say that the demon servants of Nergal and Ereskigal raised it in a single night. Behind a huge wall of black marble, spiky plants and twisted wood were shaped into a bizarre living city."
 building_baghdad_sinful_desecrated_second_temple_02: "Remnants of Blood"
 building_baghdad_sinful_desecrated_second_temple_02_desc: "By day, the inhabitants slept or harvested sweet-smelling fruits from the trees, which were watered by human blood; by night, the citizens held ferocious orgies or staged raids on nearby city-states."
 building_baghdad_sinful_desecrated_second_temple_03: "Remnants of Babylon's Defeat"
 building_baghdad_sinful_desecrated_second_temple_03_desc: "Aided by demonic servitors and frightening war-machines (made of the same wood that formed the city itself), the Bhâtorites broke down the walls of Babylon itself on several occasions and carried off prisoners for sacrifice."
 building_baghdad_sinful_desecrated_second_temple_04: "Remnants of King Samsi-Adad's Victory"
 building_baghdad_sinful_desecrated_second_temple_04_desc: "Finally, the neighbors fought back; after a costly campaign, King Samsi-Adad of Assur led a massive confederated force against the Bhâtorites. As was the custom in that era, every man, woman and child in Bhât was slaughtered."
 building_baghdad_sinful_desecrated_second_temple_05: "Remnants of the Spoils of War"
 building_baghdad_sinful_desecrated_second_temple_05_desc: "Many grimoires from the Babylonian era are said to have been written on scrolls of Bhâtorite skin; supposedly, sorcerers from all over the realm paid fortunes to obtain the trophies, which are thought to hold mystic properties over 3000 years after the city fell."

 building_type_baghdad_sinful_prideful_statue: "Jezebel of Babylon"
 building_type_baghdad_sinful_prideful_statue_desc: "This statue honors this daughter of Eve (or worse yet, Lilith) who forgot Christian chastity for more earthly passions. Like the Whore of Babylon, she dresses in rich garments and often sees to it that innocent folk are tormented and slain."
 building_baghdad_sinful_prideful_statue: "Jezebel of Babylon"
 building_baghdad_sinful_prideful_statue_desc: "$building_type_baghdad_sinful_prideful_statue_desc$"

 building_type_baghdad_sinful_enforced_rest_times: "A City Built on Tears"
 building_type_baghdad_sinful_enforced_rest_times_desc: "While the slaves die and are replaced by new ones, demons feed on the callousness and indolence of the ruling class they themselves fostered."
 building_baghdad_sinful_enforced_rest_times: "A City Built on Tears"
 building_baghdad_sinful_enforced_rest_times_desc: "$building_type_baghdad_sinful_enforced_rest_times_desc$"

 building_type_baghdad_sinful_pleasure_houses: "Sacred Marriages"
 building_type_baghdad_sinful_pleasure_houses_desc: "The priests of the infernal conspiracy used a ritual called the “Sacred Marriage” to activate their Gate. They weakened the Gauntlet to corrupt Marduk’s temple from its holy purpose. The statues, usually gawking in awe of the gods, shut their eyes. An altar with legs carved like those of an animal revealed itself in the center of the cella."
 building_baghdad_sinful_pleasure_houses: "Sacred Marriages"
 building_baghdad_sinful_pleasure_houses_desc: "Conspirators brought their wives, daughters and female slaves up the stairs of the ziggurat. The “Inanna” awaited the Bel’s attentions. The intensity of hours of chants and intercourse — Bel standing, Inanna on the altar — gave the Void the strength to manifest in Babylon."

 building_type_baghdad_sinful_feast_halls: "Mershakushtu Qurdu"
 building_type_baghdad_sinful_feast_halls_desc: "The \"Victorious Marduk\" ritual took place at the beginning of each year, the temple priests declared a period of renewal, complete with feasting song, companionship and other festivities..."
 building_baghdad_sinful_feast_halls: "Mershakushtu Qurdu"
 building_baghdad_sinful_feast_halls_desc: "$building_type_baghdad_sinful_feast_halls_desc$"

 building_type_baghdad_sinful_spy_passages: "Weeping for Tammuz"
 building_type_baghdad_sinful_spy_passages_desc: "Every year at the beginning of the planting season, Sumerian cities held re-enactments of the return of Tammuz to the Underworld. Each city took its most beloved young man and buried him alive. The entire population dressed in black for eight days, and the priests and priestesses of Istar dressed in black for a month, mourning the symbolic death of the god."
 building_baghdad_sinful_spy_passages: "Weeping for Tammuz"
 building_baghdad_sinful_spy_passages_desc: "$building_type_baghdad_sinful_spy_passages_desc$"

 building_type_baghdad_sinful_gold_hoard: "Gold and Sulfur"
 building_type_baghdad_sinful_gold_hoard_desc: "Babylon was a damned city. But a rich damned city nonetheless. From the bargaining with demons came many lost souls but a few powerful winners as well."
 building_baghdad_sinful_gold_hoard: "Gold and Sulfur"
 building_baghdad_sinful_gold_hoard_desc: "$building_type_baghdad_sinful_gold_hoard_desc$"

 building_type_baghdad_sinful_fighting_pits: "Anzu Pits"
 building_type_baghdad_sinful_fighting_pits_desc: "A huge lion-headed bird, the Anzu appears in one of the tales of Gilgamesh. Nesting in the huluppa tree, the Anzu apparently lived with both a great serpent and Lilith herself."
 building_baghdad_sinful_fighting_pits: "Anzu Pits"
 building_baghdad_sinful_fighting_pits_desc: "$building_type_baghdad_sinful_fighting_pits_desc$"

 #############################
 ####### Muslim baghdad ######
 #############################

 building_type_baghdad_jewel_of_allah_baghdad_01: "Baghdad: City of a Thousand Mosques"
 building_type_baghdad_jewel_of_allah_baghdad_01_desc: "The jewel of the Islamic Golden Age has faded but its reputation remains. Much can be rebuilt and restored."
 building_baghdad_jewel_of_allah_baghdad_01: "Baghdad: City of a Single Mosque"
 building_baghdad_jewel_of_allah_baghdad_01_desc: "This is not the jewel of Islam it was in the time of the Abbasid, but, perhaps, with will and effort it could become so again."
 building_baghdad_jewel_of_allah_baghdad_02: "Baghdad: City of a Dozen Mosques"
 building_baghdad_jewel_of_allah_baghdad_02_desc: "The road to recovery is long but much of it has already been walked, only a couple steps left before a triumphant return to prominence."
 building_baghdad_jewel_of_allah_baghdad_03: "Baghdad: City of a Thousand Mosques"
 building_baghdad_jewel_of_allah_baghdad_03_desc: "The jewel of Islam, equal in importance with even Mecca and Medina, never to be tarnished!"

 building_type_baghdad_jewel_of_allah_palace_of_the_abbasids_01: "Palace of the Abbasid"
 building_type_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc: "The palace of the Abbasid, from here they ruled from Cordoba to China, their memory a prideful one to be leveraged for the glory of Baghdad."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_01: "Taking over the Palace"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc: "A succession of incompetent rulers and uncaring conquerors has left the palace in disarray. Time to put this situation in order."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_02: "Removing any Pretenders"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_02_desc: "$building_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc$"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_03: "Controlling the Guards"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_03_desc: "You have made your presence known. Your influence will follow."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_04: "Controlling the Nobles"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_04_desc: "Powerful people need sound advice. You are the only one who can provide it."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_05: "Influencing the Caliph"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_05_desc: "Spiritual and temporal matters are intertwined there. While the faith on display can be a deterrent, your influence grows nonetheless."

 building_type_baghdad_jewel_of_allah_house_of_wisdom_01: "The House of Wisdom"
 building_type_baghdad_jewel_of_allah_house_of_wisdom_01_desc: "The House of Wisdom, also known as the Grand Library of Baghdad, is a major Abbasid-era public academy and intellectual center in Baghdad. It acts as one of the world's largest public libraries during the Islamic Golden Age."
 building_baghdad_jewel_of_allah_house_of_wisdom_01: "Ignorant Masses"
 building_baghdad_jewel_of_allah_house_of_wisdom_01_desc: "Your power means little to these scholars, too interested in their books to pay attention to the rest of the world. You will have to teach them to listen to you."
 building_baghdad_jewel_of_allah_house_of_wisdom_02: "Ignorant Teachers"
 building_baghdad_jewel_of_allah_house_of_wisdom_02_desc: "$building_baghdad_jewel_of_allah_house_of_wisdom_01_desc$"
 building_baghdad_jewel_of_allah_house_of_wisdom_03: "Controlled Research"
 building_baghdad_jewel_of_allah_house_of_wisdom_03_desc: "Grants and advice whispered in the right ears have seen you become the most important player in the inner politics of the House of Wisdom, but not the only one."
 building_baghdad_jewel_of_allah_house_of_wisdom_04: "Controlled Wisdom"
 building_baghdad_jewel_of_allah_house_of_wisdom_04_desc: "$building_baghdad_jewel_of_allah_house_of_wisdom_03_desc$"
 building_baghdad_jewel_of_allah_house_of_wisdom_05: "Your House of Wisdom"
 building_baghdad_jewel_of_allah_house_of_wisdom_05_desc: "Fascinating things can be learned there and many are those that hope that the shadowy master of the House will give them access."

 building_type_baghdad_jewel_of_allah_abou_hanifaa_mosque_01: "Allah Abou Hanifaa Mosque"
 building_type_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc: "The greatest mosque in the city is a center of learning, piety and more importantly, influence."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01: "Willful Imam"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc: "The greatest mosque in the city will not bend because you asked nicely. Faith is an obstacle, but one that can be overcome."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_02: "Deaf Flock"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_02_desc: "$building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc$"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03: "Attentive Hadith"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03_desc: "They follow your words, listen to your voice, obey your commands, they just don't know it yet."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_04: "Controlled Scholars"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_04_desc: "$building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03_desc$"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_05: "Influencing the Visitors"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_05_desc: "Everyone passing through here ends up being part of your plans. Whether they know it or not."

 building_type_baghdad_jewel_of_allah_al_mustansiriyah_university_01: "Al Mustansiriyah University"
 building_type_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc: "The first university in Islam, established by the Abbasid Caliph Al-Mustansir."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_01: "Applying for Entry"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc: "Turns out they don't let everyone in. You will have to increase your influence here... or pass a test."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_02: "Second Try"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_02_desc: "$building_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc$"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_03: "Finally Inside"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_03_desc: "They could not stop you three times, and now all the knowledge of this university is yours to command! As soon as you get around to reading it."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_04: "Learning to Learn"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_04_desc: "No grand secrets to be found here but the collective wisdom of the greatest city in Islam is still a treasure to be cherished."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_05: "A Never-ending Path"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_05_desc: "It's not about knowing, it's about learning, and enjoying the process. This is not a place for built towers but for those who enjoy adding bricks to theirs, who recognize there will always be more to learn and who take joy in that fact."

 building_type_baghdad_jewel_of_allah_madrasa_mirjaniyya_01: "Madrasa Mirjaniyya and Khan Mirjan Complex"
 building_type_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc: "A center of learning and an inn combined cleverly so neither can take the other over."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01: "Controlling the Scholars"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc: "Taking over will be difficult, you will need to move on both sides at the same time so neither can intervene."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_02: "Controlling the Merchants"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_02_desc: "$building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc$"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03: "Gouging the Travelers"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03_desc: "You don't have total control. Yet. But you have enough to raise the prices and ensure students don't stumble into things they are better off not knowing."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_04: "Lying to the Students"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_04_desc: "$building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03_desc$"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_05: "Extorting Wealth and Knowledge Equally"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_05_desc: "One side could not take over the other, but that simply made them weak to outside intervention, and now you have both wealth and knowledge in your hands."

 building_type_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01: "Zumurrud Kathun Mausoleum"
 building_type_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc: "A mausoleum dedicated to the wife of Caliph al-Mustadi, the surest sign of love echoing through the ages."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01: "Regular Mausoleum"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc: "A mausoleum among many in this city, special only by its grandeur, a testament to the fact everything dies. But your senses tell you it might be a little more complicated..."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_02: "Renowned Mausoleum"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_02_desc: "$building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc$"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03: "Intriguing Mausoleum"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03_desc: "The spirits of the departed flock around this mausoleum, all weeping and the air here is thin, the line between worlds easily broken."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_04: "Contacting the Wraiths"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_04_desc: "$building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03_desc$"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_05: "Passage to the Underworld"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_05_desc: "You have done what Orpheus did and walked into the underworld with the power of true love. The fact it wasn't your own is irrelevant."

 building_type_baghdad_jewel_of_allah_al_adudi_bimaristan_01: "Al-'Adudi Hospital"
 building_type_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc: "The hospital came to be when King of the Buyid Dynasty, 'Adud al-Dawla, decided to construct the hospital a few years before he died. Al-'Adudi is considered one of the most innovative and modern hospitals of the Islamic world."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_01: "Corrupting the Doctors"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc: "You have knowledge, remedies they desire, and you will give it to them, for a price."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_02: "Learning their Methods"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_02_desc: "$building_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc$"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_03: "Bringing Strange Patients"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_03_desc: "With the doctors on your side you can start to examine the more... esoteric creatures on this earth."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_04: "Fascinating Discoveries"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_04_desc: "$building_baghdad_jewel_of_allah_al_adudi_bimaristan_03_desc$"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_05: "A Shadowed Hospital"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_05_desc: "You heal those you want to live and learn from those you don't, a perfect system."

 building_type_baghdad_jewel_of_allah_taj_palace_01: "Taj Palace"
 building_type_baghdad_jewel_of_allah_taj_palace_01_desc: "Lying on the banks of the Tigris River in southern East Baghdad, just south of the older Hasani Palace, it was thus the southernmost portion of a sprawling palace complex, the \"Abode of the Caliphate\"."
 building_baghdad_jewel_of_allah_taj_palace_01: "Infiltrating the Palace"
 building_baghdad_jewel_of_allah_taj_palace_01_desc: "The palace is still home to many guards and nobles that have grown fat in the absence of any urgency. A perfect opportunity."
 building_baghdad_jewel_of_allah_taj_palace_02: "Controlling the Guards"
 building_baghdad_jewel_of_allah_taj_palace_02_desc: "$building_baghdad_jewel_of_allah_taj_palace_01_desc$"
 building_baghdad_jewel_of_allah_taj_palace_03: "Adding New Garrisons"
 building_baghdad_jewel_of_allah_taj_palace_03_desc: "With the people under control now is the time to ensure nothing moves in your city without your knowledge."
 building_baghdad_jewel_of_allah_taj_palace_04: "More Patrols"
 building_baghdad_jewel_of_allah_taj_palace_04_desc: "$building_baghdad_jewel_of_allah_taj_palace_03_desc$"
 building_baghdad_jewel_of_allah_taj_palace_05: "Overseeing the City"
 building_baghdad_jewel_of_allah_taj_palace_05_desc: "You see it all from here, every crime, every whisper, every attempted coup, there is not a thing in this city that happens without your say so and everyone knows it."

 #############################
 ####### Looted Baghdad ######
 #############################

 building_type_baghdad_looted_baghdad_01: "Baghdad Sacked"
 building_type_baghdad_looted_baghdad_01_desc: "Hulegu Khan put this city to the sword and it is still dying a slow and painful death."
 building_baghdad_looted_baghdad_01: "Baghdad in Ruins"
 building_baghdad_looted_baghdad_01_desc: "I will bring you crashing down from the summit of the sky,\nLike a lion I will throw you down to the lowest depths.\nI will not leave a single person alive in your country,\nI will turn your city, lands and empire into flames. If you have the heart to save your head and your ancient family,\nListen carefully to my advice.\nIf you refuse to accept it, I will show you the meaning of the will of God."
 building_baghdad_looted_baghdad_02: "Baghdad Rebuilt"
 building_baghdad_looted_baghdad_02_desc: "Baghdad may have been burned but it will not be destroyed. Through great effort the scars can be mended and it can reclaim its status in the world."
 POD_baghdad_rebuild_tooltip: "Baghdad will be #P rebuilt#! and new [buildings|E] will become available" 

 building_type_baghdad_starving_population_01: "Starving Population"
 building_type_baghdad_starving_population_01_desc: "With no food and no stores still standing there's nothing to eat. You will have to spend from your own coffers to ensure the people don't all starve to death or leave."
 building_baghdad_starving_population_01: "Widespread Famine"
 building_baghdad_starving_population_01_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_baghdad_starving_population_02: "Enduring Famine"
 building_baghdad_starving_population_02_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_baghdad_starving_population_03: "Dwindling Famine"
 building_baghdad_starving_population_03_desc: "$building_type_baghdad_starving_population_01_desc$"

 building_type_baghdad_destroyed_infrastructure_01: "Burning City"
 building_type_baghdad_destroyed_infrastructure_01_desc: "It is unknown how many inhabitants were killed: Muslim writers estimate between 800,000 and two million deaths, while Hulegu himself, in a letter to Louis IX of France, noted that his army had killed 200,000."
 building_baghdad_destroyed_infrastructure_01: "Unending Nightmare"
 building_baghdad_destroyed_infrastructure_01_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_baghdad_destroyed_infrastructure_02: "Widespread Chaos"
 building_baghdad_destroyed_infrastructure_02_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_baghdad_destroyed_infrastructure_03: "Light at the End"
 building_baghdad_destroyed_infrastructure_03_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"

 building_type_baghdad_rivers_of_ink_01: "Rivers of Ink"
 building_type_baghdad_rivers_of_ink_01_desc: "So many books from Baghdad's libraries were thrown into the Tigris that \"the colour of the river changed into black from their multitude\"."
 building_baghdad_rivers_of_ink_01: "Blackened Rivers"
 building_baghdad_rivers_of_ink_01_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_baghdad_rivers_of_ink_02: "Flooding Rivers of Ink"
 building_baghdad_rivers_of_ink_02_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_baghdad_rivers_of_ink_03: "Stained Rivers"
 building_baghdad_rivers_of_ink_03_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"

 building_type_baghdad_desecrated_mosques_01: "City of a Thousand Burning Mosques"
 building_type_baghdad_desecrated_mosques_01_desc: "No longer are the voices heard signaling the time for prayers, they now only showcase the pain and horror engulfing Baghdad."
 building_baghdad_desecrated_mosques_01: "City of a Thousand Burning Mosques"
 building_baghdad_desecrated_mosques_01_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_baghdad_desecrated_mosques_02: "City of a Thousand Collapsing Mosques"
 building_baghdad_desecrated_mosques_02_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_baghdad_desecrated_mosques_03: "City of a Thousand Scarred Mosques"
 building_baghdad_desecrated_mosques_03_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"

 building_type_baghdad_ruined_palaces_01: "Ruined Palaces"
 building_type_baghdad_ruined_palaces_01_desc: "Hulegu locked the Caliph in a cell surrounded by his treasures, whereupon he starved to death in four days. Everything else was hauled back to the Mongol conquerors, likely never to be seen in Baghdad again."
 building_baghdad_ruined_palaces_01: "Ruined Palaces"
 building_baghdad_ruined_palaces_01_desc:  "$building_type_baghdad_ruined_palaces_01_desc$"
 building_baghdad_ruined_palaces_02: "Looted Palaces"
 building_baghdad_ruined_palaces_02_desc: "$building_type_baghdad_ruined_palaces_01_desc$"
 building_baghdad_ruined_palaces_03: "Deserted Palaces"
 building_baghdad_ruined_palaces_03_desc:  "$building_type_baghdad_ruined_palaces_01_desc$"

 #############################
 #### Ctesiphon Pheonix ######
 #############################

 building_type_ctesiphon_the_shadowed_pheonix_ctesiphon_01: "Ctesiphon: Persian Phoenix"
 building_type_ctesiphon_the_shadowed_pheonix_ctesiphon_01_desc: "Ctesiphon served as a royal capital of the Iranian empires for over eight hundred years, in the Parthian and Sasanian periods. A jewel of the world, it could be so once more."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_01: "Ctesiphon: The Embers"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_01_desc: "Emerging from a small military encampment turned village, Ctesiphon's beginnings were humble."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_02: "Ctesiphon: The Flames"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_02_desc: "As the capital of the Sasanian Empire, Ctesiphon became a rich commercial metropolis, merging with the surrounding cities along both shores of the river."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_03: "Ctesiphon: The Phoenix"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_03_desc: "In the late 6th and early 7th century, some said it became the largest city in the world, creating a legacy that survives to this day."

 building_type_ctesiphon_the_shadowed_pheonix_white_palace_01: "The White Palace"
 building_type_ctesiphon_the_shadowed_pheonix_white_palace_01_desc: "The White Palace was the main residence of the Sasanian King of Kings in the capital of Ctesiphon, most likely founded by the second Sasanian monarch Shapur I."
 building_ctesiphon_the_shadowed_pheonix_white_palace_01: "A Palace of Dust"
 building_ctesiphon_the_shadowed_pheonix_white_palace_01_desc: "This has not been in use for centuries, and for good reason. It will take a lot of work to renovate this place."
 building_ctesiphon_the_shadowed_pheonix_white_palace_02: "Broken Walls"
 building_ctesiphon_the_shadowed_pheonix_white_palace_02_desc: "$building_ctesiphon_the_shadowed_pheonix_white_palace_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_white_palace_03: "Hiring Guards"
 building_ctesiphon_the_shadowed_pheonix_white_palace_03_desc: "Once again habitable, the renewed White Palace is now in need of skilled personnel."
 building_ctesiphon_the_shadowed_pheonix_white_palace_04: "Holding Court"
 building_ctesiphon_the_shadowed_pheonix_white_palace_04_desc: "$building_ctesiphon_the_shadowed_pheonix_white_palace_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_white_palace_05: "Palace of the Shāhanshāh"
 building_ctesiphon_the_shadowed_pheonix_white_palace_05_desc: "It is as if time had not taken its toll on the White Palace. It is once again the court of a vibrant Persian dynasty, if a more shadowy one."

 building_type_ctesiphon_the_shadowed_pheonix_taq_kasra_01: "Taq Kasra"
 building_type_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc: "Sometimes called the Arch of Ctesiphon, this was the facade of the main palace in the city, and is the only visible remaining structure of the ancient capital city."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_01: "Ruin of the Imperial Complex"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc: "The arch was part of the imperial palace complex. The throne room — presumably under or behind the arch — has long since been lost to the vagaries of time."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_02: "Remnant of the Imperial Complex"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_02_desc: "$building_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_03: "Ruined Audience Hall"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_03_desc: "The structure left today was the main portico of the audience hall of the Sasanians, who maintained the same site chosen by the Parthians."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_04: "Restored Audience Hall"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_04_desc: "$building_ctesiphon_the_shadowed_pheonix_taq_kasra_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_05: "Taq Kasra"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_05_desc: "From a single surviving pillar you restored the glorious main palace of Ctesiphon. A symbol of your power and resilience for all to see."

 building_type_ctesiphon_the_shadowed_pheonix_veh_ardashir_01: "Veh Aradshir"
 building_type_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc: "Originally known as Seleucia, this city formed the richest suburb of Ctesiphon."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01: "Remnants of the Flood"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc: "During the mid-5th century, a flooding occurred in Veh-Ardashir, which divided the city in two and led to its decline. Your first task will be to heal the damage done."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_02: "Bridging the Divide"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_02_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03: "Seat of the Patriarch"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03_desc: "The Church of the East had its quarters here once. The memories of this time could be a useful tool to bring back people to your renewed Ctesiphon."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_04: "A New Pilgrimage Site"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_04_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_05: "Veh Aradshir"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_05_desc: "With this suburb revitalized, Ctesiphon is one step closer to a full recovery."

 building_type_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01: "Bagh i Hinduvan"
 building_type_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc: "The \"garden of the Indians\" built during the reign of king Khosrow II. A place of beauty and respite that will be needed in your ambitious project for Ctesiphon."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01: "Dust and Sand"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc: "Not much more than dust and sand today, nothing is left of this wonder of the classical world besides memories."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_02: "Sprouting Greens"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_02_desc: "$building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03: "Shy Blossom"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03_desc: "A burgeoning garden in a burgeoning city, both created to satisfy the nostalgia of their shadowy ruler."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_04: "Shadowy Canopy"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_04_desc: "$building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_05: "Bagh i Hinduvan"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_05_desc: "Probably not the exact same as the classical one, this garden is still a magnificent sight in your restored Ctesiphon."

 building_type_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01: "Wēh Antīōk Khosrow"
 building_type_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc: "Wēh Antīōk Khosrow, literally \"better than Antioch, Khosrow built this\" was a city founded by shah Khosrow I on the east bank of the Tigris in the vicinity of Ctesiphon that was populated by deported Roman prisoners-of-war."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01: "Not Quite Better than Antioch"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc: "The title promises a lot to any who hear it, and it will be your task to make sure that promise is fulfilled."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_02: "Almost as Good as Antioch"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_02_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03: "Better than Antioch"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03_desc: "Well, there are no official competitions between cities to see if you won but you made a good show of it if you can say so yourself."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_04: "Built by You"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_04_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_05: "Wēh Antīōk"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_05_desc: "Removing the Khosrow part of the name feels petty but let's be honest, the name itself was petty to begin with."

 building_type_ctesiphon_the_shadowed_pheonix_dastagerd_01: "Dastagird"
 building_type_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc: "The royal residence of the Sasanians, with its own court and fortress, was a critical part of Ctesiphon's political power."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_01: "Scars from Byzantium"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc: "In 628, Dastagird was sacked by the Byzantine emperor Heraclius. The city was never heard from afterwards. It is time to rebuild what the Romans have destroyed."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_02: "Outlasting Heraclius"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_02_desc: "$building_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_03: "Old Artemita"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_03_desc: "An older city once stood here, it was a crossroads between the Greek and the Parthian world. It could become such a center once more."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_04: "Two Old Cities Renewed"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_04_desc: "$building_ctesiphon_the_shadowed_pheonix_dastagerd_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_05: "Dastagird"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_05_desc: "Enjoying the sight of the Tigris from your window, Dastagird once more sits as a political and diplomatic centerpiece for your restored Ctesiphon."

 building_type_ctesiphon_the_shadowed_pheonix_valashabad_01: "Valashabad"
 building_type_ctesiphon_the_shadowed_pheonix_valashabad_01_desc: "A suburb of Ctesiphon, this city saw a pivotal battle in the fall of the Sasanians. Its restoration would send a powerful message."
 building_ctesiphon_the_shadowed_pheonix_valashabad_01: "Legacy of Parthia"
 building_ctesiphon_the_shadowed_pheonix_valashabad_01_desc: "Valashabad was founded by the Parthian king Vologases I before its capture by the Sasanians. This long tradition of Persian culture will continue to be upheld under your watch."
 building_ctesiphon_the_shadowed_pheonix_valashabad_02: "Parthian and Sasanian"
 building_ctesiphon_the_shadowed_pheonix_valashabad_02_desc: "$building_ctesiphon_the_shadowed_pheonix_valashabad_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_valashabad_03: "Dead of Sabat"
 building_ctesiphon_the_shadowed_pheonix_valashabad_03_desc: "A climactic battle between the Arabs and the Persians took place here. The veil is thin, as you suspect long dead soldiers are still battling in the afterlife."
 building_ctesiphon_the_shadowed_pheonix_valashabad_04: "Underworld of Sabat"
 building_ctesiphon_the_shadowed_pheonix_valashabad_04_desc: "$building_ctesiphon_the_shadowed_pheonix_valashabad_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_valashabad_05: "Valashabad"
 building_ctesiphon_the_shadowed_pheonix_valashabad_05_desc: "This restored city still feels blasphemous to the uninitiated. Those who understand the dead however know that the [UmbraGlossary('shadowlands')] has never been closer than here."

 building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine: "Typhonic Ctesiphon"
 building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc: "While Egypt never owned this region, its expansion during the New Kingdom brought some bold Setites with it. It is as if the city was always destined for Set's glory."
 building_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine: "Typhonic Ctesiphon"
 building_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc: "$building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult: "Before Enoch"
 building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc: "The Tal'mahe'Ra is old, older than this city itself. But it remembers its origins in the region and contemplates its future."
 building_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult: "Before Enoch"
 building_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc: "$building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid: "A Pyramidal Taste of Home"
 building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc: "Never did ancient Egypt reach this far even in its prime, until now. You need to ensure no one will ever forget it."
 building_ctesiphon_the_shadowed_pheonix_newest_pyramid: "A Pyramidal Taste of Home"
 building_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc: "$building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth: "Birthplace of the Sun"
 building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc: "Here the sun himself was born, now once more this place is in the hands of the faithful. Treachery from Egyptian seductresses and conquest from Roman vultures won't bring us down this time."
 building_ctesiphon_the_shadowed_pheonix_the_suns_birth: "Birthplace of the Sun"
 building_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc: "$building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_sacred_flame: "The Sacred Flame"
 building_type_ctesiphon_the_shadowed_pheonix_sacred_flame_desc: "The sacred flame of Ahura Mazda once more shines down upon his city. Perhaps soon to shine upon all the world as well."
 building_ctesiphon_the_shadowed_pheonix_sacred_flame: "The Sacred Flame"
 building_ctesiphon_the_shadowed_pheonix_sacred_flame_desc: "$building_type_ctesiphon_the_shadowed_pheonix_sacred_flame_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris: "Osiris Temple"
 building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc: "The [UmbraGlossary('shadowlands')] are close here. If Osiris watches upon us from Amenti, this will be the perfect place to create a new nexus of power for his use."
 building_ctesiphon_the_shadowed_pheonix_temple_of_osiris: "Osiris Temple"
 building_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc: "$building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc$"

 #building_type_ctesiphon_the_shadowed_pheonix_second_alamut: "Alamut's Outpost"
 #building_type_ctesiphon_the_shadowed_pheonix_second_alamut_desc: "Not as storied as the clan's true headquarters, but the perfect place for an outpost to protect Persia and launch attacks outside of the Children of Haqim's domain."
 #building_ctesiphon_the_shadowed_pheonix_second_alamut: "Alamut's Outpost"
 #building_ctesiphon_the_shadowed_pheonix_second_alamut_desc: "$building_type_ctesiphon_the_shadowed_pheonix_second_alamut_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter: "Olympus Temple"
 building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc: "A temple to the old gods from before the Cross and the Crescent, when you used to rule openly and divided the world with your fellow immortals."
 building_ctesiphon_the_shadowed_pheonix_temple_to_jupiter: "Olympus Temple"
 building_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc: "$building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc$"

 #############################
 ###### Rebuilt baghdad ######
 #############################

 building_type_baghdad_rebuilt_baghdad_01: "Baghdad Rebuilt"
 building_type_baghdad_rebuilt_baghdad_01_desc: "$building_baghdad_rebuilt_baghdad_01_desc$"
 building_baghdad_rebuilt_baghdad_01: "Baghdad: The Village"
 building_baghdad_rebuilt_baghdad_01_desc: "Wind sways the branches. Gone the mists, now we pray for clear skies."
 building_baghdad_rebuilt_baghdad_02: "Baghdad: The City"
 building_baghdad_rebuilt_baghdad_02_desc: "In this place, stands eternity. No storms nor man can end it."
 building_baghdad_rebuilt_baghdad_03: "Baghdad: The Metropolis"
 building_baghdad_rebuilt_baghdad_03_desc: "Upon Baghdad, didst the sky fall. Now mended, it yearns to live."

 building_type_baghdad_city_of_a_thousand_mosques_01: "City of a Thousand Mosques"
 building_type_baghdad_city_of_a_thousand_mosques_01_desc: "$building_baghdad_city_of_a_thousand_mosques_01_desc$"
 building_baghdad_city_of_a_thousand_mosques_01: "City of a Single Mosque"
 building_baghdad_city_of_a_thousand_mosques_01_desc: "Fallen once, risen twice. Heaven beckons. Can we be deserving?"
 building_baghdad_city_of_a_thousand_mosques_02: "City of a Dozen Mosques"
 building_baghdad_city_of_a_thousand_mosques_02_desc: "This is the Eye of The World. Prayer goes ever upwards. Out there, there is nothing."
 building_baghdad_city_of_a_thousand_mosques_03: "City of a Thousand Mosques"
 building_baghdad_city_of_a_thousand_mosques_03_desc: "Calamity came. We overcame. May we just rise high enough."

 building_type_baghdad_center_of_the_world_learning_01: "Center of the World's Learning"
 building_type_baghdad_center_of_the_world_learning_01_desc: "$building_baghdad_center_of_the_world_learning_01_desc$"
 building_baghdad_center_of_the_world_learning_01: "Baghdad Illiterate"
 building_baghdad_center_of_the_world_learning_01_desc: "Black and red tarnished together. Once more, we try our craft. Let us remember."
 building_baghdad_center_of_the_world_learning_02: "Wise Baghdad"
 building_baghdad_center_of_the_world_learning_02_desc: "Memory. Only in records can we preserve life. So it will always be."
 building_baghdad_center_of_the_world_learning_03: "Center of the World's Learning"
 building_baghdad_center_of_the_world_learning_03_desc: "Can we forget horror? May we not. For in our plight, words flew anew."

 building_type_baghdad_oldest_city_01: "The Oldest City"
 building_type_baghdad_oldest_city_01_desc: "$building_baghdad_oldest_city_01_desc$"
 building_baghdad_oldest_city_01: "Forgotten Ruins"
 building_baghdad_oldest_city_01_desc: "Yet the haunted grounds of Babel watch. From its stones, we build once more."
 building_baghdad_oldest_city_02: "Remembered City"
 building_baghdad_oldest_city_02_desc: "Upon the shores of Euphrates, didst rest Babylon. In arrogance, it found doom. One that emboldens Baghdad."
 building_baghdad_oldest_city_03: "Eternal Legacy"
 building_baghdad_oldest_city_03_desc: "What pride had wrought, we could not mend. In service, atonement marks our steps."

 building_type_baghdad_heart_of_trade_01: "Heart of Trade"
 building_type_baghdad_heart_of_trade_01_desc: "$building_baghdad_heart_of_trade_01_desc$"
 building_baghdad_heart_of_trade_01: "Bustling Markets"
 building_baghdad_heart_of_trade_01_desc: "Under the weight of the sun, the river of gold beats anew."
 building_baghdad_heart_of_trade_02: "Center of Trade"
 building_baghdad_heart_of_trade_02_desc: "Look upon, marvel! All paths meet here, upon the crossroads of the universe."
 building_baghdad_heart_of_trade_03: "Heart of Trade"
 building_baghdad_heart_of_trade_03_desc: "Frenzied veins, an everlasting heart. Baghdad is that heart."
 
 POD_baghdad_sacked_rebuilt_modifier: "Reborn from the Ashes"
 POD_baghdad_complacency_modifier: "Magnificent Complacency"
 POD_baghdad_complacency_modifier_desc: "Baghdad, the center of the world, is already perfect. Nothing more needs to be done.\n\n#R Some doomsayers however predict a radical change happening in 1258...#!\n\n"
 POD_baghdad_looted_1_modifier: "Burnt to Ashes"
 POD_baghdad_looted_1_modifier_desc: "The mortals have been decimated, it will take many years for their city to recover.\n#help All wounds eventually heal...#!"
 POD_baghdad_looted_2_modifier: "Lingering Death"
 POD_baghdad_looted_2_modifier_desc: "Most of the rubble has been cleared away, yet the stench of death still permeates the air."
 POD_baghdad_looted_3_modifier: "Mending Scars"
 POD_baghdad_looted_3_modifier_desc: "Crops have been resown. Homes rebuilt. The people of Baghdad toil away at healing the final wounds of their once great city."
 
 #############################
 ##### Hollr Bjarkarey #######
 #############################

 building_type_bjarkarey_hollr_01: "Hollr Bjarkarey"
 building_type_bjarkarey_hollr_01_desc: "#F The snow runs red with tribute to the Aesir. The All-Father's shadow still lingers here, defiant against the Cross.#!"
 building_bjarkarey_hollr_01: "Ótryggr Bjarkarey"
 building_bjarkarey_hollr_01_desc: "Hard is it in the world, great whoredom, an axe age, a sword age, shields shall be cloven, a wind age, a wolf age, ere the world sinks."
 building_bjarkarey_hollr_02: "Tryggr Bjarkarey"
 building_bjarkarey_hollr_02_desc: "Cattle die, and kinsmen die, and so one dies one's self; One thing now that never dies, the fame of a dead man's deeds."
 building_bjarkarey_hollr_03: "Kappsamr Bjarkarey"
 building_bjarkarey_hollr_03_desc: "The sun turns black, the earth sinks into the sea, the bright stars fall out of the sky. Flames scorch the leaves of Yggdrasil, a great bonfire reaches to the highest clouds."

 building_type_bjarkarey_leynikirkja_01: "Leynikirkja"
 building_type_bjarkarey_leynikirkja_01_desc: "#F Some Cainites still scorn the Aesir and hold to their heretical beliefs, praising not the All-Father, but the First Murderer.#!"
 building_bjarkarey_leynikirkja_01: "Dulinn Leynikirkja"
 building_bjarkarey_leynikirkja_01_desc: "The Heretics gather in the dark, hiding their faces from the wrath of the Aesir."
 building_bjarkarey_leynikirkja_02: "Undirokaðr Leynikirkja"
 building_bjarkarey_leynikirkja_02_desc: "Their havens burned and names cursed by the skalds, the non-believers still stubbornly cling to their faith."
 building_bjarkarey_leynikirkja_03: "Mulinn Leynikirkja"
 building_bjarkarey_leynikirkja_03_desc: "The blood of the Heretics are spilled on the snow as their hidden halls lay broken. Only a broken few remain, crying out for a god that does not answer."
 building_bjarkarey_leynikirkja_04: "Umskipaðr Leynikirkja"
 building_bjarkarey_leynikirkja_04_desc: "The false priests have all been given to the blood eagle. Their hidden altars now lay open for the true gods of the cold north."
 POD_bjarkarey_leynikirkja_bonus: "Three powerful [GetTrait('gangrel').GetName(GetPlayer)] will join your [court|E]"

 building_type_bjarkarey_throndarnes_01: "Thróndarnes"
 building_type_bjarkarey_throndarnes_01_desc: "#F The heart of Christendom on Bjarkarey, the church is always full of mortals praying to their southern god.#!"
 building_bjarkarey_throndarnes_01: "Minnkaðr Thróndarnes"
 building_bjarkarey_throndarnes_01_desc: "The bells still toll for the White Christ, but the flock is lessening."
 building_bjarkarey_throndarnes_02: "Skuggvaðr Thróndarnes"
 building_bjarkarey_throndarnes_02_desc: "The priest's voice trembles as prayers to the All-Father begin to be heard."
 building_bjarkarey_throndarnes_03: "Holr Thróndarnes"
 building_bjarkarey_throndarnes_03_desc: "The church lies desecrated as the cross hangs inverted and the ravens feast on the flesh of the sacrificed priests."
 building_bjarkarey_throndarnes_04: "Umbreytt Thróndarnes"
 building_bjarkarey_throndarnes_04_desc: "Christ now lays forgotten and buried in the snow alongside his temple. An open field for ritual blóts stain the once holy place."
 POD_bjarkarey_throndarnes_bonus: "Gain the [GetTrait('reaver').GetName(GetPlayer)] [trait|E]\nCan recruit [GetMaA('blood_thralls_maa').GetName] as [men_at_arms|E]"
 
 building_type_bjarkarey_drekafloti_01: "Drekafloti"
 building_type_bjarkarey_drekafloti_01_desc: "#F On the shores, beside the frail fishing boats, lies a fleet of black ships with red sails. From this shore the Einherjar set out into the world, hungry for blood and gold.#!"
 building_bjarkarey_drekafloti_01: "Svefndi Drekafloti"
 building_bjarkarey_drekafloti_01_desc: "The ships rest on the shore beside working fishermen, the mortals dreading the nights when they unfurl their crimson sails."
 building_bjarkarey_drekafloti_02: "Bryggjur Herja"
 building_bjarkarey_drekafloti_02_desc: "More and more longships are prepared as the humble fishermen are brushed aside. The crew sit restlessly, awaiting the night they finally leave the quiet shore."
 building_bjarkarey_drekafloti_03: "Úlfræskr Berserkir"
 building_bjarkarey_drekafloti_03_desc: "The berserkers sit ready on the mighty ships as the crimson sails are unfurled, covering the night sky. The armada stands ready to sweep across southern coasts and plunder everything in their way."
 building_bjarkarey_drekafloti_04: "Ragnafloti"
 building_bjarkarey_drekafloti_04_desc: "The sea has turned black beneath the dark hulls of the bloody fleet. When these undisputed masters of the sea approach a foreign shore, and their crimson sails become visible on the horizon, the natives pray for mercy."

 building_type_bjarkarey_blodga_langhus_01: "Blóðga Langhús"
 building_type_bjarkarey_blodga_langhus_01_desc: "#F A quaint church used to stand on the hill where this high hall once stood. Now, the immortal ruler of Bjarkarey casts a long shadow over it.#!"
 building_bjarkarey_blodga_langhus_01: "Aska-Salir"
 building_bjarkarey_blodga_langhus_01_desc: "The chapel's stones were torn down to create a grim, cruel hall upon the hill."
 building_bjarkarey_blodga_langhus_02: "Stálsalir"
 building_bjarkarey_blodga_langhus_02_desc: "The swords and shields of the fallen foes of the Einherjar line the walls. The uneasy Kine avert their gazes lest they draw the ire of one of their dark masters."
 building_bjarkarey_blodga_langhus_03: "Herhöfðingja Sæti"
 building_bjarkarey_blodga_langhus_03_desc: "The dark wooden walls always seem to be stained in fresh crimson. The formidable warriors sit inside in comfort, laughing, boasting and fighting to their heart's content."
 building_bjarkarey_blodga_langhus_04: "Eilífar Hallar"
 building_bjarkarey_blodga_langhus_04_desc: "The blood-soaked longhouse is an unbreakable fortress upon the hill. The Hirðmen drink deep as the Blood-Thralls serve. The All-Father's reign is absolute within these walls."

 building_type_bjarkarey_frjalsir_menn_01: "Frjálsir Menn"
 building_type_bjarkarey_frjalsir_menn_01_desc: "#F The locals toil away in the farms and the shores, hoping to keep their overlords happy so that they do not draw their ire.#!"
 building_bjarkarey_frjalsir_menn_01: "Sjalfráðr Menn"
 building_bjarkarey_frjalsir_menn_01_desc: "The natives of the land work for themselves, neglecting their offerings to you and the Aesir."
 building_bjarkarey_frjalsir_menn_02: "Skyldumaðr Menn"
 building_bjarkarey_frjalsir_menn_02_desc: "The people have dedicated themselves to working diligently for their dark overlords."
 building_bjarkarey_frjalsir_menn_03: "Traustr Menn"
 building_bjarkarey_frjalsir_menn_03_desc: "Bjarkarey grows, and the people's dedication to you, the All-Father, and their home grows alongside it."
 building_bjarkarey_frjalsir_menn_04: "Kappsamr Menn"
 building_bjarkarey_frjalsir_menn_04_desc: "The citizens of Bjarkarey are wholly devoted to their masters now. Nothing will get in the way of their duty."
 bjarkarey_frjalsir_menn_bonus: "You will unlock the [GetCourtPositionType('kertilsveinr_court_position').GetName()] and [GetCourtPositionType('skutilsveinr_court_position').GetName()] [court_positions|E]."

 building_type_bjarkarey_blothaugr_01: "Blothaugr"
 building_type_bjarkarey_blothaugr_01_desc: "#F On a secluded hill rests a bloody site of sacrifice, runes and stone covering the area. Frequent blóts are held here in worship of the Aesir.#!"
 building_bjarkarey_blothaugr_01: "Lítill Blothaugr"
 building_bjarkarey_blothaugr_01_desc: "The site of sacrifice is only a small circle, covered in runes and stone."
 building_bjarkarey_blothaugr_02: "Vaxa Blothaugr"
 building_bjarkarey_blothaugr_02_desc: "The sacrificial mound has grown, and the faithful participating in the blóts grow every night."
 building_bjarkarey_blothaugr_03: "Stórr Blothaugr"
 building_bjarkarey_blothaugr_03_desc: "The site of sacrifice encompasses a vast area of land now. The hills run red with the blood given to Odin."
 building_bjarkarey_blothaugr_04: "Óendanligr Blothaugr"
 building_bjarkarey_blothaugr_04_desc: "All of Bjarkarey now participates in the grand blóts. Countless faithful, both mortal and immortal, come to these hills to appease the Aesir."

 building_type_bjarkarey_solarhvelfing_01: "Sólarhvelfing"
 building_type_bjarkarey_solarhvelfing_01_desc: "#F Beneath the longhouse upon the hill rests a vast area for the Hirðmen to rest, safe from the scorching rays of the sun.#!"
 building_bjarkarey_solarhvelfing_01: "Berr Sólarhvelfing"
 building_bjarkarey_solarhvelfing_01_desc: "The Solar-Vaults remain a spartan area below the longhouse, fit only for seclusion and not much else."
 building_bjarkarey_solarhvelfing_02: "Prýddr Sólarhvelfing"
 building_bjarkarey_solarhvelfing_02_desc: "The Vaults now carry dozens of trophies along the walls, a testament to the strength of the faithful that reside within it."
 building_bjarkarey_solarhvelfing_03: "Brynklæddr Sólarhvelfing"
 building_bjarkarey_solarhvelfing_03_desc: "The Solar-Vaults, already a formidable place, have been further enhanced to protect the warriors inside. Nothing will break them down now."
 building_bjarkarey_solarhvelfing_04: "Stórr Sólarhvelfing"
 building_bjarkarey_solarhvelfing_04_desc: "More than just a mere underground shelter, the Solar-Vaults now stand as a grand monument to the strength and perseverance of all the Einherjar."

 building_type_bjarkarey_myrkvidir_01: "Myrkviðir"
 building_type_bjarkarey_myrkvidir_01_desc: "#F The dangerous, overgrown woods surrounding Bjarkarey act as a natural line of defense for the town. Countless men have disappeared in the depths of it, never to be seen again.#!"
 building_bjarkarey_myrkvidir_01: "Yfirvaxinn Myrkviðir"
 building_bjarkarey_myrkvidir_01_desc: "The woods remain a dangerous and terrifying place, even to the locals. None enter it willingly. Few who do ever return."
 building_bjarkarey_myrkvidir_02: "Villtr Myrkviðir"
 building_bjarkarey_myrkvidir_02_desc: "A semblance of order has been brought to the wild woods, thanks to many hard workers and hunters dedicated to keeping the outskirts of Bjarkarey safe."
 building_bjarkarey_myrkvidir_03: "Ráðr Myrkviðir"
 building_bjarkarey_myrkvidir_03_desc: "The trees of the woods make the trade in Bjarkarey flow while the wildlife and hunters keep it under control."
 building_bjarkarey_myrkvidir_04: "Bundinn Myrkviðir"
 building_bjarkarey_myrkvidir_04_desc: "The wild animals now protect Bjarkarey's woods from any outside threats, and the vast forests supply the people with rich material."

 building_type_bjarkarey_gullveigr_lundi_01: "Gullveigr Lundi"
 building_type_bjarkarey_gullveigr_lundi_01_desc: "#F A sacred grove, rumored to be the place where Gullveig was speared by the Aesir, burnt three times, and was thrice reborn.#!"
 building_bjarkarey_gullveigr_lundi_01: "Askr Lundi"
 building_bjarkarey_gullveigr_lundi_01_desc: "To most, this grove is simply an unnerving stretch of the woods. To the practitioners of the old ways, however, it is a holy site with soil that still holds power."
 building_bjarkarey_gullveigr_lundi_02: "Eldsglóðr Lundi"
 building_bjarkarey_gullveigr_lundi_02_desc: "The overwhelming smell of ash fills the air as the tree saps bleed the color of pure gold. Witches and sorcerers flock to this grove to tap into the ancient power."
 building_bjarkarey_gullveigr_lundi_03: "Brennandi Lundi"
 building_bjarkarey_gullveigr_lundi_03_desc: "The memory of Gullveig's burning and rebirth is etched into the very roots of the earth now. Even mortals feel the power of it."
 building_bjarkarey_gullveigr_lundi_04: "Logandi Lundi"
 building_bjarkarey_gullveigr_lundi_04_desc: "The grove has been transformed into a beautiful and dreadful place that spits in the face of the White Christ. Unnatural ash fills the air as the grove runs red with fresh vitae."
 POD_bjarkarey_gullveigr_lundi_rune_wise: "Gain the [GetTrait('rune_wise').GetName(GetNullCharacter)] [trait|E], unlocking the Norse rune-paths of #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Sorcery#!#!."

 building_type_bjarkarey_ulfahus_01: "Úlfahús"
 building_type_bjarkarey_ulfahus_01_desc: "#F The savage wolves and hounds of Bjarkarey are kept in their cages, waiting to be unleashed upon anyone foolish enough to attack them.#!"
 building_bjarkarey_ulfahus_01: "Villr Úlfahús"
 building_bjarkarey_ulfahus_01_desc: "A rough lodge deep in the woods houses the abnormally strong and cruel beasts of Bjarkarey. Mortals tend to avoid them, but the animals act as fearsome guarding for the town when required."
 building_bjarkarey_ulfahus_02: "Gráðigr Úlfahús"
 building_bjarkarey_ulfahus_02_desc: "The lodge has been expanded to house more animals and the hall is now adorned with the massive pelts of dire beasts. Their howling, able to be heard from miles away, serves as an effective warning to any outsiders."
 building_bjarkarey_ulfahus_03: "Blóðugr Úlfahús"
 building_bjarkarey_ulfahus_03_desc: "What used to be a mere shack with cages has been expanded to be a terrifying stronghold for the apex predators of the night. The floorboards seem to be permanently soaked with blood now."
 building_bjarkarey_ulfahus_04: "Fenrir Úlfahús"
 building_bjarkarey_ulfahus_04_desc: "This sprawling den of beasts now rivals the great mead halls of old. The people of Bjarkarey claim that Fenrir himself watches over the creatures in it."

 ###################################
 ##### Hvítakristr Bjarkarey #######
 ###################################


 building_type_bjarkarey_hvitakristr_01: "Hvítakristr Bjarkarey"
 building_type_bjarkarey_hvitakristr_01_desc: "#F The snow runs red with tribute to God. The Cross has crushed the final, stubborn remnants of the old ways.#!"
 building_bjarkarey_hvitakristr_01: "Subjugated Bjarkarey"
 building_bjarkarey_hvitakristr_01_desc: "Think not that I am come to send peace on earth: I came not to send peace, but a sword. - Matthew 10:34"
 building_bjarkarey_hvitakristr_02: "Scourged Bjarkarey"
 building_bjarkarey_hvitakristr_02_desc: "And ye shall overthrow their altars, and break their pillars, and burn their groves with fire; and ye shall hew down the graven images of their gods... - Deuteronomy 12:3"
 building_bjarkarey_hvitakristr_03: "Sanctified Bjarkarey"
 building_bjarkarey_hvitakristr_03_desc: "Their slain also shall be cast out, and their stink shall come up out of their carcases, and the mountains shall be melted with their blood. - Isaiah 34:3"
 
 building_type_bjarkarey_cathedral_god_01: "Cathedral of God"
 building_type_bjarkarey_cathedral_god_01_desc: "#F Thróndarnes stands as a bastion of Christendom on this cold and foreign land.#!"
 building_bjarkarey_cathedral_god_01: "Chapel of Christ"
 building_bjarkarey_cathedral_god_01_desc: "Here in this humble church, the faithful gather to ward off the biting cold and the monsters in the dark, praying to the Lord for protection.\nAnd the light shineth in darkness; and the darkness comprehended it not. - John 1:5"
 building_bjarkarey_cathedral_god_02: "Sanctuary of the Faithful"
 building_bjarkarey_cathedral_god_02_desc: "As the flock's faith strengthens, so too does the church. The wood has given way to sturdy stone, and the people breathe easier inside these walls.\nAnd I say also unto thee, That thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it. - Matthew 16:18"
 building_bjarkarey_cathedral_god_03: "Growing Cathedral"
 building_bjarkarey_cathedral_god_03_desc: "The bells toll and the spires reach towards heaven as the heathen faiths scatter. Thróndarnes stands strong as proof that God's radiant light reaches even these cold lands.\nI have surely built thee an house to dwell in, a settled place for thee to abide in for ever. - 1 Kings 8:13"
 building_bjarkarey_cathedral_god_04: "Light of God"
 building_bjarkarey_cathedral_god_04_desc: "Thróndarnes has become a beacon of faith at the edge of the world. The White Christ has driven the darkness from these lands, and the people rejoice.\n"And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them..." - Revelation 21:3"
 POD_bjarkarey_cathedral_pilgrimage_bonus_desc: "[GetActivityType('activity_pilgrimage').GetName] [activity|E] Cost: #P -50%#!"
 POD_bjarkarey_cathedral_pilgrimage_bonus_activity: "[hollr_bjarkarey|E]"
 
 building_type_bjarkarey_cathedral_caine_01: "Cathedral of Caine"
 building_type_bjarkarey_cathedral_caine_01_desc: "#F Once a sanctuary for Christians, Thróndarnes now serves to worship a darker God.#!"
 building_bjarkarey_cathedral_caine_01: "Chapel of the Dark Father"
 building_bjarkarey_cathedral_caine_01_desc: "This humble church acts as a lone beacon of hope for the worshippers of the Dark Father.\nAnd the LORD set a mark upon Cain, lest any finding him should kill him. - Genesis 4:15"
 building_bjarkarey_cathedral_caine_02: "Dark Sanctuary"
 building_bjarkarey_cathedral_caine_02_desc: "The church is reinforced as the influence of the Heresy grows. The light of God is shunned in this holy place as all worship goes to Caine instead.\nWhoso eateth my flesh, and drinketh my blood, hath eternal life; and I will raise him up at the last day. — John 6:54"
 building_bjarkarey_cathedral_caine_03: "Rooted Cathedral"
 building_bjarkarey_cathedral_caine_03_desc: "In an act of mockery against God, dark, twisted spires reach towards the sky as foreboding bells toll each night, letting the people know that their immortal shepherds are awake and hungry.\nAnd almost all things are by the law purged with blood; and without shedding of blood is no remission. - Hebrews 9:22"
 building_bjarkarey_cathedral_caine_04: "Fury of the First Murderer"
 building_bjarkarey_cathedral_caine_04_desc: "The Cainite Heresy now has a new stronghold in this church of blackened glass and stone. Its great shadow covers all of Bjarkarey, announcing a great victory for the Heretics.\n"For the life of the flesh is in the blood: and I have given it to you upon the altar to make an atonement for your souls..." - Leviticus 17:11"
 POD_bjarkarey_cathedral_caine_bonus: "The cost for the Pilgrimage activity will be reduced."
 
 building_type_bjarkarey_knight_fortress_01: "Knight's Fortress"
 building_type_bjarkarey_knight_fortress_01_desc: "#F What used to be a blood-soaked, crude longhouse has now been converted into an armory for the faithful knights of God.#!"
 building_bjarkarey_knight_fortress_01: "Sanctified Longhouse"
 building_bjarkarey_knight_fortress_01_desc: "The old timber walls that were soaked with the blood of Christians have been cleansed with holy water. It now serves as a modest outpost and armory for the first Christian warriors brave enough to hold this frozen land.\nAnd what agreement hath the temple of God with idols? for ye are the temple of the living God... - 2 Corinthians 6:16"
 building_bjarkarey_knight_fortress_02: "Zealous Garrison"
 building_bjarkarey_knight_fortress_02_desc: "Heavy stone walls have been erected around the old longhouse, guarded by disciplined knights clad in blessed swords and shields. The barbaric trophies of the interior have all been replaced by crosses.\nPut on the whole armour of God, that ye may be able to stand against the wiles of the devil. - Ephesians 6:11"
 building_bjarkarey_knight_fortress_03: "Home of the Northern Crusaders"
 building_bjarkarey_knight_fortress_03_desc: "The longhouse stands completely converted as a formidable fortress of faith and military might. Monks, blacksmiths and warriors roam the halls, all working in unison to create a force strong enough to tame these lands.\nBlessed be the LORD my strength, which teacheth my hands to war, and my fingers to fight. - Psalm 144:1"
 building_bjarkarey_knight_fortress_04: "Armory of God"
 building_bjarkarey_knight_fortress_04_desc: "The fortress now stands as a shining, impregnable armory for the champions of the White Christ, where holy knights gather their strength to wage eternal war upon heathens.\n"Thou art my battle axe and weapons of war: for with thee will I break in pieces the nations, and with thee will I destroy kingdoms." - Jeremiah 51:20"
 POD_bjarkarey_knight_fortress_bonus: "Three skilled martial Ventrue will join your court upon completion of this building."
 
 building_type_bjarkarey_hammer_god_01: "Hammer of God"
 building_type_bjarkarey_hammer_god_01_desc: "#F Once a mighty fleet for the Pagan Norse, the Dragon Fleets now serve to destroy God's enemies instead.#!"
 building_bjarkarey_hammer_god_01: "Converted Ships"
 building_bjarkarey_hammer_god_01_desc: "The Dragon Fleets that once struck fear into Christian shores have been sawed away and replaced with the holy cross.\nThey that go down to the sea in ships, that do business in great waters; These see the works of the LORD, and his wonders in the deep. - Psalm 107:23-24"
 building_bjarkarey_hammer_god_02: "Blessed Sails"
 building_bjarkarey_hammer_god_02_desc: "Manned by faithful sailors and priests, the might ships cut through the northern waves to deliver divine justice.\nThus saith the LORD, which maketh a way in the sea, and a path in the mighty waters. - Isaiah 43:16"
 building_bjarkarey_hammer_god_03: "Armada of the Cross"
 building_bjarkarey_hammer_god_03_desc: "A formidable navy has been crafted in Bjarkarey, made from blessed oak and iron.\nThou rulest the raging of the sea: when the waves thereof arise, thou stillest them. - Psalm 89:9"
 building_bjarkarey_hammer_god_04: "God's Thunder"
 building_bjarkarey_hammer_god_04_desc: "A vast, thundering armada of God now controls the northern seas. The fearsome Dragon Fleets have been reborn as the Hammer of God, ready to crush any heretic and nonbeliever.\n"Thy right hand, O LORD, is become glorious in power: thy right hand, O LORD, hath dashed in pieces the enemy." - Exodus 15:6"
 POD_bjarkarey_hammer_god_bonus: "You will unlock the ability to raid upon completion of this building."
 
 building_type_bjarkarey_hammer_caine_01: "Hammer of Caine"
 building_type_bjarkarey_hammer_caine_01_desc: "#F The mightiest armada of the Einherjar now serve the spread the word and terror of the Dark Father.#!"
 building_bjarkarey_hammer_caine_01: "Blood-Christened Sails"
 building_bjarkarey_hammer_caine_01_desc: "The conquered Viking ships have been baptized in the vitae of the unfaithful. These dark vessels now serve the Heresy.\nAnd the second angel poured out his vial upon the sea; and it became as the blood of a dead man: and every living soul died in the sea. - Revelation 16:3"
 building_bjarkarey_hammer_caine_02: "Shadowed Fleets"
 building_bjarkarey_hammer_caine_02_desc: "Manned by loyal ghouls and guided by blood-bound captains, the ships are a terrifyingly effective way of spreading the Heretics' cause.\nRaging waves of the sea, foaming out their own shame; wandering stars, to whom is reserved the blackness of darkness for ever. - Jude 1:13"
 building_bjarkarey_hammer_caine_03: "Armada of the Dark Father"
 building_bjarkarey_hammer_caine_03_desc: "These raiding ships are now infamous among northern shores for the terror they represent. Dark banners snap in the bitter winds while the undead warriors slumbering inside the fleet wait patiently to unleash the Father's wrath.\nAnd the second angel sounded, and as it were a great mountain burning with fire was cast into the sea: and the third part of the sea became blood... - Revelation 8:8"
 building_bjarkarey_hammer_caine_04: "Caine's Fury"
 building_bjarkarey_hammer_caine_04_desc: "The armada has evolved into an apocalyptic one that claims dominion over the seas. The dragon fleets are no more. Only the Hammer of Caine, and their desire to drown the world in blood remains.\n"I will set his hand also in the sea, and his right hand in the rivers." - Psalm 89:25"
 POD_bjarkarey_hammer_caine_bonus: "You will unlock the ability to raid upon completion of this building."
 
 building_type_bjarkarey_godfearing_subjects_01: "God-Fearing Subjects"
 building_type_bjarkarey_godfearing_subjects_01_desc: "#F Once the pagan thralls of cruel masters, the people of Bjarkarey remain doubtful about their new overlords.#!"
 building_bjarkarey_godfearing_subjects_01: "Penitent Flock"
 building_bjarkarey_godfearing_subjects_01_desc: "The descendants of pagan thralls understand who their new masters are. Though their understanding is simple, these newly baptized villagers look to the Cross with faith already.\nTherefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new. - 2 Corinthians 5:17"
 building_bjarkarey_godfearing_subjects_02: "Pious Laborers"
 building_bjarkarey_godfearing_subjects_02_desc: "The old heathen superstitions have been firmly rooted out, replaced by a rigid and unwavering devotion.\nThe fear of the LORD is the beginning of wisdom: a good understanding have all they that do his commandments... - Psalm 111:10"
 building_bjarkarey_godfearing_subjects_03: "True Believers"
 building_bjarkarey_godfearing_subjects_03_desc: "Faith has become the bedrock of this community. Unified in their righteous fervor, the people of Bjarkarey stand ready to toil hard and defend their masters.\nIn the fear of the LORD is strong confidence: and his children shall have a place of refuge. - Proverbs 14:26"
 building_bjarkarey_godfearing_subjects_04: "Zealous Hands of Christ"
 building_bjarkarey_godfearing_subjects_04_desc: "Bjarkarey's populace has been converted into a fiercely loyal and pious population.\nLet us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this is the whole duty of man. - Ecclesiastes 12:13"
 
 building_type_bjarkarey_terror_christ_01: "Terror of Christ"
 building_type_bjarkarey_terror_christ_01_desc: "#F The once-calm town square has been transformed into a brutal, bloody stage for divine retribution.#!"
 building_bjarkarey_terror_christ_01: "Sinner's Post"
 building_bjarkarey_terror_christ_01_desc: "A simple wooden post has been erected in the town square, where thieves and minor sinners are bound and whipped to serve as a warning to others.\n"Judgments are prepared for scorners, and stripes for the back of fools." - Proverbs 19:29"
 building_bjarkarey_terror_christ_02: "Smiting the Sinners"
 building_bjarkarey_terror_christ_02_desc: "The square has been expanded to host gallows and sturdy whipping posts. The screams of the sinners and the unfaithful echo all across Bjarkarey, ensuring that the righteous flock remains fearful, obedient, and untempted by the old heathen ways.\n"Then will I visit their transgression with the rod, and their iniquity with stripes." - Psalm 89:32"
 building_bjarkarey_terror_christ_03: "Cages of Repentance"
 building_bjarkarey_terror_christ_03_desc: "The plaza now lays permanently soaked in blood, dedicated to punishment. Pyres and brutal executions provide a horrifying, mandatory spectacle that purifies the community through sheer terror.\n"And now also the axe is laid unto the root of the trees: therefore every tree which bringeth not forth good fruit is hewn down, and cast into the fire." - Matthew 3:10"
 building_bjarkarey_terror_christ_04: "Righteous Wrath of God"
 building_bjarkarey_terror_christ_04_desc: "The town square stands as a monument to terrifying divine retribution. Corpses hang from small iron cages suspended in air, with a few living among them crying out for the release of death. The people of Bjarkarey now know that the Lord's authority is absolute, and no sin will go unanswered.\n"It is a fearful thing to fall into the hands of the living God." - Hebrews 10:31"
 POD_terror_christ_bonus: "Unlock a new [execution|E] option"
 
 building_type_bjarkarey_hall_judgment_01: "Hall of Judgment"
 building_type_bjarkarey_hall_judgment_01_desc: "#F What was once the town hall of the local mortals has been converted into an imposing seat of holy law.#!"
 building_bjarkarey_hall_judgment_01: "Chamber of Light"
 building_bjarkarey_hall_judgment_01_desc: "A modest, timbered room within the town center where disputes are settled and the King's law is read. The locals find comfort in the fact that the law remains, even now.\n"The LORD is known by the judgment which he executeth: the wicked is snared in the work of his own hands." - Psalm 9:16"
 building_bjarkarey_hall_judgment_02: "Tribunal of Faith"
 building_bjarkarey_hall_judgment_02_desc: "Strict judges appointed by the Church's authority weight the deeds and crimes of men, bringing harsh but necessary order.\n"It is joy to the just to do judgment: but destruction shall be to the workers of iniquity." - Proverbs 21:15"
 building_bjarkarey_hall_judgment_03: "Judgment of God"
 building_bjarkarey_hall_judgment_03_desc: "The small town hall has been expanded into a grand court of law. Heavy banners bearing the sword and the cross hang above the judge's seat as every ruling is delivered according to the laws of both man and God.\n"These are the things that ye shall do; Speak ye every man the truth to his neighbour; execute the judgment of truth and peace in your gates." - Zechariah 8:16"
 building_bjarkarey_hall_judgment_04: "Seat of Righteousness"
 building_bjarkarey_hall_judgment_04_desc: "Beneath the watchful, unblinking eyes of carved angels, the judges determine the fates of every man and woman in Bjarkarey.\n"For God shall bring every work into judgment, with every secret thing, whether it be good, or whether it be evil." - Ecclesiastes 12:14"
 POD_bjarkarey_hall_judgment_bonus: "Gain the [GetTrait('truefaith').GetName(GetPlayer)] [trait|E]"
 
 building_type_bjarkarey_dark_libraries_01: "Dark Libraries"
 building_type_bjarkarey_dark_libraries_01_desc: "#F Deep in the secret vaults, forbidden knowledge, heretical scriptures, and occult lore remains, hidden from the orthodox Church.#!"
 building_bjarkarey_dark_libraries_01: "Hidden Archives"
 building_bjarkarey_dark_libraries_01_desc: "A concealed collection of forbidden scrolls and heretical texts lay hidden by the scholars of Bjarkarey, away from the eyes of the zealous orthodoxy.\n"And I will give thee the treasures of darkness, and hidden riches of secret places..." - Isaiah 45:3"
 building_bjarkarey_dark_libraries_02: "Secretive Scriptorium"
 building_bjarkarey_dark_libraries_02_desc: "Christian scribes tirelessly copy forbidden manuscripts in their efforts to use the occult lore to fight back against the Pagans.\n"And further, by these, my son, be admonished: of making many books there is no end; and much study is a weariness of the flesh." - Ecclesiastes 12:12"
 building_bjarkarey_dark_libraries_03: "Damned Archives"
 building_bjarkarey_dark_libraries_03_desc: "The small vaults have been expanded into a great archive. The shelves groan beneath the weight of blasphemous texts.\n"This wisdom descendeth not from above, but is earthly, sensual, devilish." - James 3:15"
 building_bjarkarey_dark_libraries_04: "Labyrinth of Sin"
 building_bjarkarey_dark_libraries_04_desc: "The archives resemble a labyrinth now, with unending, forbidden knowledge. Anyone bold enough to seek wisdom here may find more than they've bargained for.\n"But unto you I say... as many as have not this doctrine, and which have not known the depths of Satan, as they speak; I will put upon you none other burden." - Revelation 2:24"
 
 ###################################
 ######## Taema Bjarkarey ##########
 ###################################
 
 building_type_bjarkarey_taema_01: "Temja Bjarkarey"
 building_type_bjarkarey_taema_01_desc: "#F Hidden upon a mist-shrouded island accessible only to the rune-wise, Ulf's Hall is a house of great wealth left over from the days of the Viking. The village itself may be a small, insignificant one still following the old ways, but the Hall itself still holds great riches and power.#!"
 building_bjarkarey_taema_01: "Njord's Bjarkarey"
 building_bjarkarey_taema_01_desc: "I ween that I hung on the windy tree,\nHung there for nights full nine;\nWith the spear I was wounded, and offered I was\nTo Othin, myself to myself,\nOn the tree that none may ever know\nWhat root beneath it runs."
 building_bjarkarey_taema_02: "Raven's Bjarkarey"
 building_bjarkarey_taema_02_desc: "None made me happy with loaf or horn,\nAnd there below I looked;\nI took up the runes, shrieking I took them,\nAnd forthwith back I fell."
 building_bjarkarey_taema_03: "Ulf's Bjarkarey"
 building_bjarkarey_taema_03_desc: "Runes shalt thou find, and fateful signs,\nThat the king of singers colored,\nAnd the mighty gods have made;\nFull strong the signs, full mighty the signs\nThat the ruler of gods doth write."
 
 building_type_bjarkarey_ulf_hall_01: "Ulf's Hall"
 building_type_bjarkarey_ulf_hall_01_desc: "#F On the northern edges of Bjarkarey lays a hall on a misty island, where commoners and wizards both practice the old ways in safety from the cross. Those who lack the gift of Odin's sight never find these halls, but the wisest may witness the hall's splendors.#!"
 building_bjarkarey_ulf_hall_01: "Veiled Longhouse"
 building_bjarkarey_ulf_hall_01_desc: "The halls are made of sturdy timber, concealed by the harsh northern elements. It serves as a refuge for those who shun the encroaching mortal Church."
 building_bjarkarey_ulf_hall_02: "Warded Safehouse"
 building_bjarkarey_ulf_hall_02_desc: "Wooden pillars of the halls are covered in mystical runes, protecting the wise against the prying eyes of outsiders."
 building_bjarkarey_ulf_hall_03: "Ashen Halls"
 building_bjarkarey_ulf_hall_03_desc: "Ulf's Hall remains a grand stronghold of pagan power. Here, the true masters of the old ways practice their craft in peace."
 building_bjarkarey_ulf_hall_04: "House of Ulf"
 building_bjarkarey_ulf_hall_04_desc: "The legendary sanctuary of Ulf Grimsson lays preserved in Bjarkarey in all it's glory. The very roots of this hall are bound to the land of Scandinavia, and nothing can ever break that bond."
 
 building_type_bjarkarey_ashen_throne_01: "Ashen Throne of Ulf"
 building_type_bjarkarey_ashen_throne_01_desc: "#F The throne of the legendary Ulf Grimsson, it holds significant power in these lands, even though many years have passed since he last sat upon it.#!"
 building_bjarkarey_ashen_throne_01: "Carved High Seat"
 building_bjarkarey_ashen_throne_01_desc: "A heavy chair made of dark timber lays reserved for Ulf, always left empty. Detailed carvings of great krakens and snarling beasts decorate the wood all along the throne."
 building_bjarkarey_ashen_throne_02: "Blood-Stained Throne"
 building_bjarkarey_ashen_throne_02_desc: "Long dried blood can still be spotted along the throne, filling any would-be pretenders to the high seat with dread."
 building_bjarkarey_ashen_throne_03: "Seat of Pagans"
 building_bjarkarey_ashen_throne_03_desc: "While no one knows what exactly the throne is made from, many claim that Ulf himself carved it from a sacred ash tree he felled himself."
 building_bjarkarey_ashen_throne_04: "Ulf's Seat of Power"
 building_bjarkarey_ashen_throne_04_desc: "The seat itself is a grand symbol for Pagans all over Scandinavia. As long this hall and throne remains, they will never be defeated. The old ways will live on."
 POD_bjarkarey_ashen_throne_bonus: "You will gain a powerful artifact upon the completion of this building."
 
 building_type_bjarkarey_grimsson_armory_01: "Grimsson's Armory"
 building_type_bjarkarey_grimsson_armory_01_desc: "#F Ulf Grimsson kept many treasures in his hall. The weapons he left behind are the best in the land.#!"
 building_bjarkarey_grimsson_armory_01: "Raider's Cache"
 building_bjarkarey_grimsson_armory_01_desc: "The entrance to the armory greets the warriors with a modest collection of rusted iron, scarred shields, and blood-stained axes gathered from forgotten skirmishes."
 building_bjarkarey_grimsson_armory_02: "Warlord's Arsenal"
 building_bjarkarey_grimsson_armory_02_desc: "High-quality steel weapons and heavy chainmail armor reveal themselves deeper in the armory, showing off the trophies taken from Ulf's raids overseas."
 building_bjarkarey_grimsson_armory_03: "Vaults of the Slain"
 building_bjarkarey_grimsson_armory_03_desc: "Masterwork blades, the shattered armor of fallen foreign knights, and the plunder of a hundred burned villages are kept sharp and ready."
 building_bjarkarey_grimsson_armory_04: "Armory of the Aesir"
 building_bjarkarey_grimsson_armory_04_desc: "The weapons in this legendary hall could fend off Ragnarök itself."
 POD_bjarkarey_grimsson_armory_bonus: "You will gain a powerful artifact upon the completion of this building."
 
 building_type_bjarkarey_prized_jewels_01: "Prized Jewels"
 building_type_bjarkarey_prized_jewels_01_desc: "#F Ulf had amassed a mighty hoard of treasure from his many adventures over his life. Housing trinkets of all kinds, it is a testament to how far he sailed across the world.#!"
 building_bjarkarey_prized_jewels_01: "Plundered Silver"
 building_bjarkarey_prized_jewels_01_desc: "Tarnished silver, copper and gold are stored in the vaults, taken from foreign men in their foreign lands."
 building_bjarkarey_prized_jewels_02: "Dragon's Hoard"
 building_bjarkarey_prized_jewels_02_desc: "The heavy, iron chests, filled to the brim with gleaming plunder are proof to prowess of Ulf and his raiders."
 building_bjarkarey_prized_jewels_03: "Deep Vaults"
 building_bjarkarey_prized_jewels_03_desc: "The deepest vaults store an awe-inspiring hoard of treasures claimed from rival immortals and legendary heroes who dared challenge Ulf Grimsson."
 building_bjarkarey_prized_jewels_04: "Jewels of Grimsson"
 building_bjarkarey_prized_jewels_04_desc: "Ulf's legendary hoard houses flawless rubies, masterwork weapons, and other such priceless trinkets that radiate an intoxicating aura of power and wealth."
 POD_bjarkarey_prized_jewels_bonus: "You will gain a powerful artifact upon the completion of this building."
 
 building_type_bjarkarey_bones_njord_01: "Bones of Njörðr"
 building_type_bjarkarey_bones_njord_01_desc: "#F The shores of Bjarkarey house the skeleton of a great sea beast that the mortals use as a place of worship.#!"
 building_bjarkarey_bones_njord_01: "Bleached Ribs of the Deep"
 building_bjarkarey_bones_njord_01_desc: "A scattering of massive, pale white bones rest half-buried on the shores of Bjarkarey. The mortal fisherfolk that still worship the Aesir often come here to leave offerings, praying for good hauls or winds."
 building_bjarkarey_bones_njord_02: "Shrine of the Sea-Beast"
 building_bjarkarey_bones_njord_02_desc: "The towering ribs have been hauled to point upright and lashed together to create an imposing archway. Beneath these bones, the descendants of thralls gather to wprship and beseech Njörðr to grant them favorable winds on the sea."
 building_bjarkarey_bones_njord_03: "Temple of the Tide"
 building_bjarkarey_bones_njord_03_desc: "The sands beneath the bones seem to carry a permanent red stain on them as the chants and prayers of the faithful mix with the crashing waves of the sea."
 building_bjarkarey_bones_njord_04: "Great Cathedral of Njörðr"
 building_bjarkarey_bones_njord_04_desc: "A breathtaking, imposing sanctuary for the followers of the old ways have been created beneath the bones of this dead sea-beast."
 
 building_type_bjarkarey_loyal_thralls_01: "Loyal Thralls"
 building_type_bjarkarey_loyal_thralls_01_desc: "#F The mortals of Bjarkarey toil away on the shores and fields, their hard work benefiting only their new overlords.#!"
 building_bjarkarey_loyal_thralls_01: "Subjugated Fisherfolk"
 building_bjarkarey_loyal_thralls_01_desc: "The villagers toil endlessly on the freezing shores, willingly trading away their freedom for the promise of protection. They prefer the dark over the cold."
 building_bjarkarey_loyal_thralls_02: "Bound Servants"
 building_bjarkarey_loyal_thralls_02_desc: "Fear has become the driving force for the locals. They work the icy seas with empty eyes and watch as their efforts go into the pockets of their masters."
 building_bjarkarey_loyal_thralls_03: "Sworn Serfs"
 building_bjarkarey_loyal_thralls_03_desc: "Generations of terror and manipulation have broken the mortals. The villagers now offer up their labor, their children, and their own veins without question."
 building_bjarkarey_loyal_thralls_04: "Devoted Vassals"
 building_bjarkarey_loyal_thralls_04_desc: "The people of Bjarkarey have been reduced to an entirely broken and fiercely devoted populace. Stripped of all autonomy and hope, they find a twisted pride in making their masters happy."
 
 building_type_bjarkarey_divided_throndarnes_01: "Divided Thróndarnes"
 building_type_bjarkarey_divided_throndarnes_01_desc: "#F The sole Christian church of Bjarkarey remains divided from the rest of the pagan populace.#!"
 building_bjarkarey_divided_throndarnes_01: "Compromised Parish"
 building_bjarkarey_divided_throndarnes_01_desc: "The priests of the White Christ preach, but their words have become strangely tolerant. Whispers in the dark have convinced them it is the best way to keep the peace."
 building_bjarkarey_divided_throndarnes_02: "Syncretic Congregation"
 building_bjarkarey_divided_throndarnes_02_desc: "The line between the Aesir and the Cross are deliberately blurred. Christian and Pagan alike now attend the tolerant sermons of Thróndarnes."
 building_bjarkarey_divided_throndarnes_03: "Shepherded Flock"
 building_bjarkarey_divided_throndarnes_03_desc: "The church has been brought under control, and the clergy enforce the will of their secret masters, preaching unity and hard labor to ensure the blended populace toils tirelessly for the prosperity of the domain."
 building_bjarkarey_divided_throndarnes_04: "United Thróndarnes"
 building_bjarkarey_divided_throndarnes_04_desc: "Thróndarnes now stands as a monument to the power of undead manipulation. The Christians and Pagans of Bjarkarey have been united into a single, efficient populace."
 
 building_type_bjarkarey_shadow_fleets_01: "Shadow Fleets"
 building_type_bjarkarey_shadow_fleets_01_desc: "#F The dragon fleets of the Viking age, stripped of their Pagan glory and repurposed into an efficient, dark armada.#!"
 building_bjarkarey_shadow_fleets_01: "Night Stalkers"
 building_bjarkarey_shadow_fleets_01_desc: "The dragon prows of old have been painted black as pitch, same as the sails. These swift ships no longer seek to terrorize, but slip silently through dark waters to raid and plunder."
 building_bjarkarey_shadow_fleets_02: "Silent Flotilla"
 building_bjarkarey_shadow_fleets_02_desc: "Manned by utterly silent, blood-bound thralls, this growing fleet strikes silently at night, plundering towns for blood and gold."
 building_bjarkarey_shadow_fleets_03: "Ghost Ships"
 building_bjarkarey_shadow_fleets_03_desc: "The people of Scandinavia whisper of a fleet of ghost ships, out for their blood."
 building_bjarkarey_shadow_fleets_04: "Armada of the Night"
 building_bjarkarey_shadow_fleets_04_desc: "This apocalyptic armada claims dominion over the northern seas. The Dragon Fleets are buried, replaced by the Shadow Fleets, an unstoppable armada that ensures the immortal masters of the north can strike and raid shores all over the world."
 POD_bjarkarey_shadow_fleets_bonus: "You will unlock the ability to raid upon completion of this building."


