 building_constantinople_rebuild_great_palace_01_desc: "The Great Palace of Constantinople, also known as the Sacred Palace, was the largest imperial Byzantine palace complex located in the southeastern end of the peninsula. It served as the main imperial residence of the Eastern Roman emperors until 1081 and was the center of imperial administration since then.\nRuined by the Latin Crusaders, its reconstruction would bring back the imperial legitimacy much needed in these dark times."
