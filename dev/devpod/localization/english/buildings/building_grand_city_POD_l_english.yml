building_type_mogadishu_abandoned_temple_of_set_01_desc: "The creature in the catacombs thinks of the city as hers and frowns on any exploitation that isn't hers, giving up an whole neighborhoods of the city might burn your pride but it is necessary to calm the anger of the monster"
