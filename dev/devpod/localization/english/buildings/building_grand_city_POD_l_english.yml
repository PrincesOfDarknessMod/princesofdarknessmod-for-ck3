building_type_mogadishu_jakuta_street_01: "Jakuta Street"
building_type_mogadishu_jakuta_street_01_desc: "Named such by kindred who prowl the city Jakuta Street bears it's title because of the maddened elder that prowls up and down the street. Jakuta."
building_mogadishu_jakuta_street_01: "Terryfing Elder"
building_mogadishu_jakuta_street_01_desc: "Jakuta is a diablerist and he does not hide that fact, nor does he hide the fact he keeps hunting and killing as he wishes, whatever the desires of the ruler of the city. "
building_mogadishu_jakuta_street_02: "Insane ramblings"
building_mogadishu_jakuta_street_02_desc: "Some neonates who encounter Jakuta and live to tell the tale speak of the insane ramblings the diablerist goes on as he feasts. "
building_mogadishu_jakuta_street_03: "Fragments of wisdom"
building_mogadishu_jakuta_street_03_desc: "Piecing together the tales and words of multiple coteries of neonates that have encountered Jakuta on friendly terms you being to realise that his ramblings are not insane at all, rather it seems he holds the wisdom of the ancients. "
building_mogadishu_jakuta_street_04: "Precious knowledge"
building_mogadishu_jakuta_street_04_desc: "Speaking with him as an equal to equal lets you realise he has advice aplenty to offer you and you would be a fool to refuse it, and so every so often you take a stroll down to Jakuta street.  "

building_type_mogadishu_abandoned_fakr_addin_01: "Abandoned Fakr Ad-Din"
building_type_mogadishu_abandoned_fakr_addin_01_desc: "The creature in the catacombs thinks of the city as hers and frowns on any exploitation that isn't hers, giving up an whole neighborhoods of the city might burn your pride but it is necessary to calm the anger of the monster"
building_mogadishu_abandoned_fakr_addin_01: "Withdrawing from the Area"
building_mogadishu_abandoned_fakr_addin_01_desc: "The First step to leaving a part of the city to the creature int he catacombs is making sure none of your ressources, financial, human or kindred are left behind there. "
building_mogadishu_abandoned_fakr_addin_02: "Closing Entreways"
building_mogadishu_abandoned_fakr_addin_02_desc: "Withdrawing your servants isn't enough, you need to ensure no one else steps into the neighborhood and angers teh creature. "
building_mogadishu_abandoned_fakr_addin_03: "Barring Access"
building_mogadishu_abandoned_fakr_addin_03_desc: "With everyone gone the only thing left to do is ensure no one comes back, putting guards up at the entrances to prevent anyone from even wandering in. "
building_mogadishu_abandoned_fakr_addin_04: "Quaranteening the Masjid"
building_mogadishu_abandoned_fakr_addin_04_desc: "Mist prowls the empty streets in the place of men wind howls through abandoned buildings and deep in the depths the sleeping body of a monster smiles, satisfied. "

