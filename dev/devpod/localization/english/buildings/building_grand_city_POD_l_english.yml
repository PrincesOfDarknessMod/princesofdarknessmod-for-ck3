 building_type_constantinople_plundered_the_hippodrome_01: "The Hippodrome"
 building_type_constantinople_plundered_the_hippodrome_01_desc: "The Hippodrome of Constantinople was a circus that was the sporting and social center of Constantinople, famous for hosting horse racing and chariot racing.\nIt has become eerily silent since the Latins took over with the Venetians themselves now using the stolen Four Horses monument as a symbol for their city."
 building_constantinople_plundered_the_hippodrome_01: "Conquered Hippodrome"
 building_constantinople_plundered_the_hippodrome_01_desc: "The Hippodrome of Constantinople was a circus that was the sporting and social center of Constantinople, famous for hosting horse racing and chariot racing.\nIt has become eerily silent since the Latins took over with the Venetians themselves now using the stolen Four Horses monument as a symbol for their city."
