#### Mogadishu Laibon ####
###########################

building_type_mogadishu_sarapion_pearl_01: "Sarapion's Pearl"
building_type_mogadishu_sarapion_pearl_01_desc: "Sarapion is still awake. Still active. The creature acknowledges no lineage or Generation. The mention of Cagn Who Wrestles the Sun only elicits bitter laughter from it. The Laibon is ancient and immeasurable"
building_mogadishu_sarapion_pearl_01: "Clouded Pearl"
building_mogadishu_sarapion_pearl_01_desc: "The long control of the Cainites has damaged the jewel of Africa, recovery will be slow"
building_mogadishu_sarapion_pearl_02: "Brilliant Pearl"
building_mogadishu_sarapion_pearl_02_desc: "The White pearl shines in the night under her steward, and beneath the earth Sarapion smiles in Satisfaction"
building_mogadishu_sarapion_pearl_03: "Sarapion's Pearl"
building_mogadishu_sarapion_pearl_03_desc: "Everyone knows the real owner of the city, but so long as it's steward continues to do such a stellar job, she will remain asleep. Hopefully."

building_type_mogadishu_arba_rukun_01: "Arba'a Rukun"
building_type_mogadishu_arba_rukun_01_desc: "One of the twin Masjid of Mogadishu, this one built by the Laibon to empower the sorcery of the Ramanga"
building_mogadishu_arba_rukun_01: "Racing to completion"
building_mogadishu_arba_rukun_01_desc: "Two Masjid in construction at the same time is one too many, whoever finishes first will have not only glory but also magical power behind them "
building_mogadishu_arba_rukun_02: "Setting the foundation"
building_mogadishu_arba_rukun_02_desc: "With the mists confusing everyone on which Masjid started first, the only way to claim victory is to finish first, no matter the cost. "
building_mogadishu_arba_rukun_03: "Building the walls"
building_mogadishu_arba_rukun_03_desc: "The Marble walls gleam in the moonlight as it looks down upon them, their sheer size serving to hide the liquid darkness that sits at the center of the construction"
building_mogadishu_arba_rukun_04: "Foiling the Saboteurs"
building_mogadishu_arba_rukun_04_desc: "The rapid construction was bound to attract fools who wanted to see the other Masjid built instead, fortunately the guards in the area managed to defeat them with ease "
building_mogadishu_arba_rukun_05: "Final completion"
building_mogadishu_arba_rukun_05_desc: "As the final stone is placed every Laibon in the city feels a rush of power in their long dead veins. Victory is yours and everyone knows it. "

building_type_mogadishu_the_hidden_shrine_01: "Hidden Shrine"
building_type_mogadishu_the_hidden_shrine_01_desc: "Deep in the catacombs there lies a perfectly circular room, carved from the stone, and in the middle, the most beautiful creature you have ever seen"
building_mogadishu_the_hidden_shrine_01: "Discovery"
building_mogadishu_the_hidden_shrine_01_desc: "The reports of the chamber have reached your ears and piqued your interest, perhaps some more excavation is in order, and maybe even a trip. "
building_mogadishu_the_hidden_shrine_02: "First Visit"
building_mogadishu_the_hidden_shrine_02_desc: "As you walk down into the depths you realize the descriptions of your courtiers did not do it justice, you almost fell to you knees at the sight of it, the beauty writ in stone, you have made preperation to expand the shrine and ensure everyone can see it  "
building_mogadishu_the_hidden_shrine_03: "Watching you"
building_mogadishu_the_hidden_shrine_03_desc: "There is no warning the first time you see one, as you turned the corner on a street, that same face from the shrine, exactly, carved into a mask. After the first you could not stop seeing others, in alleys, on rooftops, in crowds, everywhere you look the masked faces stare back at you."
building_mogadishu_the_hidden_shrine_04: "Meeting"
building_mogadishu_the_hidden_shrine_04_desc: "The cultists have made contact with you, they know you ahve visited the shrine and they know of your interest. They are more than ready to induct you into their ranks and reveal their secrets "
building_mogadishu_the_hidden_shrine_05: "Ritual"
building_mogadishu_the_hidden_shrine_05_desc: "The cultists, whisper of a ritual, a secret thing you must do to prove the truth of your worship. It would cost almost nothing, just a single life..."

building_type_mogadishu_house_of_the_manser_01: "Manse of House Adeer"
building_type_mogadishu_house_of_the_manser_01_desc: "A family of muslims most devout, with a particular proclivity for True Faith, House Adeer makes for a choice target for manipulation. "
building_mogadishu_house_of_the_manser_01: "Tutoring their children"
building_mogadishu_house_of_the_manser_01_desc: "Corrupting these devoit mortals will be a challenge, but one well worth the cost no matter how long it takes, and so you being slowly, offering your services to tutor their children so they will trust you when they become adults. "
building_mogadishu_house_of_the_manser_02: "Arranging a marriage"
building_mogadishu_house_of_the_manser_02_desc: "A word slipped in between lessons, a chance meeting that was never truly chance and the now patriarch and matriarch of house Adeer owe you their marriage and swear eternal friendship to you"
building_mogadishu_house_of_the_manser_03: "Lifting them to prominence"
building_mogadishu_house_of_the_manser_03_desc: "Unfortunately the truly devout are often abused and taken advantage of by the cynical and ambitious, how fortunate for House Adeer then, that those same Cynics find themselves running afoul of little... accidents"
building_mogadishu_house_of_the_manser_04: "Blessing them with Vitae"
building_mogadishu_house_of_the_manser_04_desc: "It takes several mortal generations, before you feel comfortable making your move, coming to the family that owes you everything and revealing the truth of the world to them, before offering them your blood to drink, and drink they do  "
building_mogadishu_house_of_the_manser_05: "Your perfect Tools"
building_mogadishu_house_of_the_manser_05_desc: "Weilding True Faith, well respected, deeply intergrated into the government of not just Mogadishu but all Ajuran and, more loyal than the moon, House Adeer was a project long in development, but one well worth the cost  "

building_type_mogadishu_fields_of_huur_01: "Fields of Huur"
building_type_mogadishu_fields_of_huur_01_desc: "The countryside around the city is filled with the “kinyonyi” or Birdmen that follow the messenger of death, their fights with the traveling Cainites are things of whispered story all over Mogadishu "
building_mogadishu_fields_of_huur_01: "Disagreement"
building_mogadishu_fields_of_huur_01_desc: "Territory is ever the cause for conflicts both mortal and not and the countryside around mogadishu is a territory with more than enough claimants to cause conflict, The children of Huur, death's messenger flock in the area, but so do certain groups of Cainites "
building_mogadishu_fields_of_huur_02: "Skirmish"
building_mogadishu_fields_of_huur_02_desc: "No one knows who started, cainite or Laibon, perhaps you did to cause exactly this, But the conflict around the fields outside has escalated, Children of Huur and Gangrel limp into the city all night long, brutally mauled by each other, before heading back the following evening as soon as they are able."
building_mogadishu_fields_of_huur_03: "Battles"
building_mogadishu_fields_of_huur_03_desc: "The first Final Death caused another escalation, both sides are claiming the other caused it, now it is while coteries of wounded that come limping back to the safety of your city paying in favors for your aegis from the war"
building_mogadishu_fields_of_huur_04: "War"
building_mogadishu_fields_of_huur_04_desc: "The conflict escalated once more, it feels like every child of Huur on the continent has come to mogadishu, the entire flck, to defend their territory from the invading Cainites and somehow just as many Gangrel and Ravnos face them down. "
building_mogadishu_fields_of_huur_05: "Victory"
building_mogadishu_fields_of_huur_05_desc: "The Children of Huur claim victory, finally and while a part of you is happy to see Laibon kicking out the invading Cainites, you are more focused on making sure they remember who they ower favors to from having protected them when they were wounded and given them enough vitae to heal. They claim the territory, but you have claimed them.  "

building_type_mogadishu_old_hamar_01: "Old Hamar"
building_type_mogadishu_old_hamar_01_desc: "The Old City, home to most of the Laibon of the city, is a place of grandeur and memories for all Kindred that step through it. But it is still old, and breaking down. "
building_mogadishu_old_hamar_01: "Old Ruins"
building_mogadishu_old_hamar_01_desc: "The seat of your power, the very center of Laibon control over mogadishu, is filled with ruins and abandoned buildings, things built centuries ago when mogadishu was nothing more than a hamlet. This will not stand! "
building_mogadishu_old_hamar_02: "Old Buildings"
building_mogadishu_old_hamar_02_desc: "With the ruins cleared you move on to the buildings, the old, things that threaten to break and collapse at any moment, casting a shadow on your city."
building_mogadishu_old_hamar_03: "Recovery"
building_mogadishu_old_hamar_03_desc: "With the old cleared out it's more than time to bring in the new and rebuild old hamar in your image."
building_mogadishu_old_hamar_04: "New Buildings"
building_mogadishu_old_hamar_04_desc: "The construction continues apace as more and more mortals and Laibon flock to the new, restored center of the city, pledging fealty to you where your power is strongest. "
building_mogadishu_old_hamar_05: "New Hamar"
building_mogadishu_old_hamar_05_desc: "No one remembers the old Hamar and the disgrace that is was to your city, now all anyone can talk about is the changes you have made, the mark you have left, indelible on the city. "

building_type_mogadishu_red_sky_01: "Red Sky"
building_type_mogadishu_red_sky_01_desc: "Red Sky is the oldest dãr al-salãm, and a second home to the rich and powerful."
building_mogadishu_red_sky_01: "Faithful Dãr al-salãm"
building_mogadishu_red_sky_01_desc: "The homes of peace are sacrosanct in Mogadishu, steeped in Muslim faith, where Cainites and Laibon alike come to hash out their differences, and if necessary call upon the judges that oversee the buildings. "
building_mogadishu_red_sky_02: "Pure Quadis"
building_mogadishu_red_sky_02_desc: "Saruuro of Clan Ramanga rules the Red Sky in Hamar. Saruuro judges supplicants on their personal worth, age, and power, and does not seem to care much about Clan. "
building_mogadishu_red_sky_03: "Corrupted Dãr al-salãm"
building_mogadishu_red_sky_03_desc: "The Dãr al-salãm are granted near total autonomy in how they comport themselves, but that does not mean you have no way to influence their conduct, or ask for favors..."
building_mogadishu_red_sky_04: "Tainted Quadis"
building_mogadishu_red_sky_04_desc: "Saruuro is a crafty creature, but even she needs the aid of others sometimes, especially as it seems, tragically, the Red Sky has suffered setback after setback and even her authority has been challenged, if only there was someone she could beg to for help... "
building_mogadishu_red_sky_05: "Your Sky"
building_mogadishu_red_sky_05_desc: "With your aid hanging over her head Saruuro has no choice but to give you access to the Red Sky, and it's supply of Blood dolls meant to be reserved to the most powerful guests of mogadishu.  "

building_type_mogadishu_laibon_ceel_waaq_01: "Ceel Waq"
building_type_mogadishu_laibon_ceel_waaq_01_desc: "Down the Southern coast lies the town of Ceel Waaq, which means the “well of God.” It’s a small trade port, nowhere near as important as Mogadishu, and mostly a place for cattle traders."
building_mogadishu_laibon_ceel_waaq_01: "Putrid well"
building_mogadishu_laibon_ceel_waaq_01_desc: "A long-abandoned well in the countryside, however, has attracted the attention of both Impundulu and Cappadocians. The well’s waters are putrid, smelling of sulfur and rot. "
building_mogadishu_laibon_ceel_waaq_02: "Network of Tunnels"
building_mogadishu_laibon_ceel_waaq_02_desc: "Below the water lies a vast network of tunnels, some rising up to dry caverns. Shrines hide in this darkness, marked with the ancient names of Loz and bearing arcane symbols. "
building_mogadishu_laibon_ceel_waaq_03: "Cooperation"
building_mogadishu_laibon_ceel_waaq_03_desc: "The sunken stelas hold knowledge of life, death. The Graverobbers, unable to fully translate them, turn to the Impundulu for help as they’re more versed in the languages of Africa. The Laibon accept this request and seem happy, even eager, to aid."
building_mogadishu_laibon_ceel_waaq_04: "Trading knowledge"
building_mogadishu_laibon_ceel_waaq_04_desc: "With the trustworthiness of each other assured from their cooperation, both Clans of death, hungry for knowledge trade their methods of necromancy with each other. "
building_mogadishu_laibon_ceel_waaq_05: "Well Of god"
building_mogadishu_laibon_ceel_waaq_05_desc: "With the Stellas translated and an alliance forged betweent the clans Ceel Waq once more returns to the cattle trading backwater is was always meant to be, but all those who leave leave with a fair amount more knowledge than before. "

building_type_mogadishu_laibon_catacombs_01: "Catacombs"
building_type_mogadishu_laibon_catacombs_01_desc: "Mogadishu is rife with tunnels, like a good cheese, and no one claims them. Perhaps it is time someone did"
building_mogadishu_laibon_catacombs_01: "Labyrinth of Tunnels"
building_mogadishu_laibon_catacombs_01_desc: "Exploring the tunnels underneath the city is a long process, as they stretch out for miles far further than the city limits despite being older than Mogadishu by more than a couple centuries. "
building_mogadishu_laibon_catacombs_02: "Underground cities"
building_mogadishu_laibon_catacombs_02_desc: "The Tunnels widen at their end spreading out into giant caverns so tall even those skilled in Auspex struggle to see the roof that contain the ruins of enourmous cities, each one millenia old, always with the long dead corpses of their inhabitants and the hint of mist. "
building_mogadishu_laibon_catacombs_03: "Red mist"
building_mogadishu_laibon_catacombs_03_desc: "The mist grows as you epxlore deeper into the tunnels beneath the city, from a hint to an everpresent companion, blood red floating in the stale air, as if it were watching you."
building_mogadishu_laibon_catacombs_04: "Tracking the mist"
building_mogadishu_laibon_catacombs_04_desc: "Tracking the origins of the mist is almost impossible, but almost is still almost and you find tunnels where it is ever so slightly thicker and follow those to what you are certain is their origin of both the catacombs and the mist. "
building_mogadishu_laibon_catacombs_05: "Sarapion's Tomb"
building_mogadishu_laibon_catacombs_05_desc: "You have found it, though you dare not enter, the resting place of Sarapion, one of the most powerful Kindred in history, sleeping beneath your city. Hopefully she will not wake for a long long time. "

building_type_mogadishu_liberty_fleet_01: "Liberty Fleet"
building_type_mogadishu_liberty_fleet_01_desc: "Realizing that nowhere on land is safe from the elders’ tyranny, a group of neonates and ancillae now take to sea. "
building_mogadishu_liberty_fleet_01: "Searching for Freedom"
building_mogadishu_liberty_fleet_01_desc: "Sheer distance from European Princes and an air of benign neglect from Alamut make Mogadishu a haven for disenfranchised ancillae and neonates. Or at least — it once did. "
building_mogadishu_liberty_fleet_02: "The Reach of Tyranny"
building_mogadishu_liberty_fleet_02_desc: "Fear of Gehenna leads elders to seek far horizons, as if global annihilation will pass Africa by. With these elders come the same institutions Mogadishu’s Cainites do so eagerly without. "
building_mogadishu_liberty_fleet_03: "Start of a fleet"
building_mogadishu_liberty_fleet_03_desc: "They band together in a small fleet of ships (and wrecks) off the Somali coast. Their location is ever-mobile and they might have escaped scrutiny if not for one overwhelming need: blood. "
building_mogadishu_liberty_fleet_04: "Pirates"
building_mogadishu_liberty_fleet_04_desc: "The fleet turns to piracy of both seaward ships and coastal towns to feed, and rapidly attracts the enmity ofCainite traders."
building_mogadishu_liberty_fleet_05: "Useful Tools"
building_mogadishu_liberty_fleet_05_desc: "Their saving grace is the secret aid of the Ramanga, who are more than happy to fan the flames of inter-Cainite conflict."


###########################
#### Mogadishu Cainite ####
###########################

building_type_mogadishu_caines_pearl_01: "Caine's Pearl"
building_type_mogadishu_caines_pearl_01_desc: "Cainites have conquered even the pearl of Africa, proving their superiority over the inferior Laibon"
building_mogadishu_caines_pearl_01: "Rebellious Pearl"
building_mogadishu_caines_pearl_01_desc: "The Laibon struggle against their new overlords, fighting back as hard as they can, but it is futile. Cainites will reign supreme eventually."
building_mogadishu_caines_pearl_02: "Cowed Pearl"
building_mogadishu_caines_pearl_02_desc: "Open Rebellion has been quashed and no one dares speak out against your rule, but even with a boot on their nexks, many try to resist still as foolish as that notion is"
building_mogadishu_caines_pearl_03: "Your Pearl"
building_mogadishu_caines_pearl_03_desc: "Your rule is unconstested, your power unquestioned, none dare even think about resisting you. The city and all ti's riches are yours."

building_type_mogadishu_fakr_addin_01: "Fakr ad-din"
building_type_mogadishu_fakr_addin_01_desc: "One of the twin Masjid of Mogadishu, this one built in the style of Holy Alamut to empower the Banu Haqim Sorcery."
building_mogadishu_fakr_addin_01: "Racing to completion"
building_mogadishu_fakr_addin_01_desc: "Two Masjid in construction at the same time is one too many, whoever finishes first will have not only glory but also magical power behind them."
building_mogadishu_fakr_addin_02: "Setting the foundation"
building_mogadishu_fakr_addin_02_desc: "The Marble walls gleam in the moonlight as it looks down upon them, built int he very same holy Geometry than Alamut, walking down these halls feels the same as if you were walking in the citadel of the Banu Haqim.  "
building_mogadishu_fakr_addin_03: "Foiling the Saboteurs"
building_mogadishu_fakr_addin_03_desc: "The rapid construction was bound to attract fools who wanted to see the other Masjid built instead, fortunately the guards in the area managed to defeat them with ease  "
building_mogadishu_fakr_addin_04: "Final completion"
building_mogadishu_fakr_addin_04_desc: "As the final stone is placed every Banu Haqim in the city feels a rush of power in their long dead veins. Victory is yours and everyone knows it."

building_type_mogadishu_temple_of_set_01: "Temple of Set"
building_type_mogadishu_temple_of_set_01_desc: "The Temple of Set hides in a warehouse near the beach of Shangani. The building is unassuming — not fancy, not run down, just perfectly normal and average"
building_mogadishu_temple_of_set_01: "Inside the Temple"
building_mogadishu_temple_of_set_01_desc: "Wards repel anyone who would enter, perpetuating an air of utter disinterest. Inside though, lies an opulence of riches. The sanctum itself consists of three parts: the first for mortal faithful, Cainite initiates, and rare visitors, the second for Cainite acolytes, and the third is intended for Set himself. "
building_mogadishu_temple_of_set_02: "First Sanctum"
building_mogadishu_temple_of_set_02_desc: "Sweet incense fills the air of the first sanctum, and murals depict the glories of Set as he battles the oppressor Ra. Set’s brother Osiris makes a rare appearance on one of the tapestries, depicting a scene of closeness between the two siblings.  "
building_mogadishu_temple_of_set_03: "Second Sanctum"
building_mogadishu_temple_of_set_03_desc: "The second sanctum is smaller and dominated by an eight-foot-tall statue of Set, hewn in red stone. Only Set’s childer could say if the likeness is true, but the statue’s powerful build is certainly fit for a god. On dark nights, when the moon hides her face, the statue oozes thick, putrid blood from its stone skin. "
building_mogadishu_temple_of_set_04: "Third Sanctum"
building_mogadishu_temple_of_set_04_desc: "The Third Sanctum is reservd for Set himself and only the high priest of the temple has laid eyes upon and he will not share what lies inside even under pain of death. "

building_type_mogadishu_new_shananagi_01: "New Shangani"
building_type_mogadishu_new_shananagi_01_desc: "The Center of cainite power in mogadishu, the persian mercantile quarter is the place where most of the goods and gold of Mogadishu travel through."
building_mogadishu_new_shananagi_01: "Corrupting the artisans"
building_mogadishu_new_shananagi_01_desc: "Those the craft and carve the spirit into ebony and ivory are the easiest to make fall to you, so desperate they are for an eternity to continue improving on their work. "
building_mogadishu_new_shananagi_02: "Corrupting the merchants"
building_mogadishu_new_shananagi_02_desc: "The merchants fall afterwards, too greedy by half to keep any principles in the face of your wealth. "
building_mogadishu_new_shananagi_03: "controlling the Guards"
building_mogadishu_new_shananagi_03_desc: "The Guards dispatched to keep an eye on the mercantile center are only as loyal as the gold in their pocket, and your generosity knows no bounds. "
building_mogadishu_new_shananagi_04: "Taking over the Markets"
building_mogadishu_new_shananagi_04_desc: "With no one left to challenge you are free to manipulate and control Shangani as you wish, ensuring all the gold that flows through it finds it's way into your pockets. "

building_type_mogadishu_jade_horse_inn_01: "Jade Horse Inn"
building_type_mogadishu_jade_horse_inn_01_desc: "Neither horses nor jade see much use in Mogadishu, and it isn’t lost on the Laibon that a foreigner named this inn. As a result, they rarely set foot in the place."
building_mogadishu_jade_horse_inn_01: "Offering Asylum"
building_mogadishu_jade_horse_inn_01_desc: "the Inn offers aid to all Cainites making their first forays into Mogadishu. it demands only a modest fee and a favor in return. "
building_mogadishu_jade_horse_inn_02: "Promising Glory"
building_mogadishu_jade_horse_inn_02_desc: "But that is merely a smokescreen for the true purpose of Jade Horse Inn, to whisper in the minds of the new arrivals of all the glories and power that could be theirs, if only they took it from the Laibon "
building_mogadishu_jade_horse_inn_03: "sowing Distrust"
building_mogadishu_jade_horse_inn_03_desc: "With their minds filled with Such whispers neonates fly off half cocked at the nearest Laibon Havens, inflaming tensions and bringing everyone closer and closer to all out war. "
building_mogadishu_jade_horse_inn_04: "Reaping Profits"
building_mogadishu_jade_horse_inn_04_desc: "A war that would only benefit those that stand behind Jade Horse Inn as the arrogant neonates take out the angry Laibon leaving the city all yours to control. "

building_type_mogadishu_hanging_gardens_01: "Hanging Gardens"
building_type_mogadishu_hanging_gardens_01_desc: "Mogadishu holds two official vampire gatherings called dãr al-salãm, meaning “home of peace.” Amaria of Clan Ravnos runs the Hanging Gardens in Shangani, and everyone is welcome here."
building_mogadishu_hanging_gardens_01: "Welcoming dãr al-salãm"
building_mogadishu_hanging_gardens_01_desc: "There are no limits to who can come into the Hanging Gardens, but getting your way typically recquires much more than simply showing up, giving up either gold or favors to the Quadis. "
building_mogadishu_hanging_gardens_02: "Demanding Quadis"
building_mogadishu_hanging_gardens_02_desc: "Visitors here must scrape and bow to Amaria when they present their issues if they wish to step out of the Hanging Gardens as more than dust. "
building_mogadishu_hanging_gardens_03: "Making Contact"
building_mogadishu_hanging_gardens_03_desc: "You status however allows you quite a lot more leeway compared to the desperate neonates that often prowl the Hanging Garden, including a private meeting with the owner. "
building_mogadishu_hanging_gardens_04: "Striking a Deal"
building_mogadishu_hanging_gardens_04_desc: "Amaria is a cruel negotiator, but you have an offer she cannot refuse, ownership of the second home of peace in exchange for access to her special stash of blood dolls. "

building_type_mogadishu_cainite_ceel_waaq_01: "Ceel Waq"
building_type_mogadishu_cainite_ceel_waaq_01_desc: "Down the Southern coast lies the town of Ceel Waaq, which means the “well of God.” It’s a small trade port, nowhere near as important as Mogadishu, and mostly a place for cattle traders."
building_mogadishu_cainite_ceel_waaq_01: "Putrid well"
building_mogadishu_cainite_ceel_waaq_01_desc: "A long-abandoned well in the countryside, however, has attracted the attention of both Impundulu and Cappadocians. The well’s waters are putrid, smelling of sulfur and rot. "
