 building_type_paris_umbral_01: "Umbral Paris"
 building_type_paris_umbral_01_desc: "#F Shadows loom over proud Paris.#!"
 building_paris_umbral_01: "Defiant Paris"
 building_paris_umbral_01_desc: "The city resists the creatures of the night."
 building_paris_umbral_02: "Fallen Paris"
 building_paris_umbral_02_desc: "An eerie darkness spreads throughout the city."
 building_paris_umbral_03: "Umbral Paris"
 building_paris_umbral_03_desc: "Engulfed in shadow, the city now serves its dark master."

 building_type_paris_dark_nobility_01: "Dark Nobility"
 building_type_paris_dark_nobility_01_desc: "#F A part of Paris just waiting for you to rule.#!"
 building_paris_dark_nobility_01: "Influenced Nobility"
 building_paris_dark_nobility_01_desc: "A coin here, a word there, the smallest actions have the biggest impact."
 building_paris_dark_nobility_02: "Controlled Nobility"
 building_paris_dark_nobility_02_desc: "You dark influence is spreading. Soon they will be unable to resist."
 building_paris_dark_nobility_03: "Mesmerized Nobility"
 building_paris_dark_nobility_03_desc: "Your control is solidified. Now reap the rewards."
 building_paris_dark_nobility_04: "Dark Nobility"
 building_paris_dark_nobility_04_desc: "A vital part of Paris, now overthrown."

