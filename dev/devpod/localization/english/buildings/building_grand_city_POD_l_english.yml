 building_type_constantinople_plundered_harbor_of_sophia_01: "Harbor of Sophia"
 building_type_constantinople_plundered_harbor_of_sophia_01_desc: "A basin flanked by an arsenal surrounded by walls, this harbor has been known by many names throughout history. It was the base for the Byzantine navy before the Fourth Crusade.\nIt now serves as the prime place from where stolen goods from the fallen city are being shipped to their new Western owners."
