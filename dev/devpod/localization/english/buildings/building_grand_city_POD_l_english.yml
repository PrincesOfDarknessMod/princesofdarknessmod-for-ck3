 building_type_constantinople_rebuild_harbor_of_sophia_01: "Harbor of Sophia"
 building_type_constantinople_rebuild_harbor_of_sophia_01_desc: "A basin flanked by an arsenal surrounded by walls, this harbor has been known by many names throughout history. It was the base for the Byzantine navy before the Fourth Crusade.\nRebuilding it is a given as Constantinople will need a strong navy to avoid the disaster of 1204 befalling it again in the future."
