 building_type_constantinople_plundered_hagia_sophia_01: "Hagia Sophia"
 building_type_constantinople_plundered_hagia_sophia_01_desc: "The religious and spiritual center of the Eastern Orthodox Church for nearly one thousand years, the church was dedicated to the Holy Wisdom. It is the world's largest interior space and among the first to employ a fully pendentive dome. It is considered the epitome of Byzantine architecture.\nConverted into a Catholic church after the Fourth Crusade, the Hagia Sophia has been stripped of most of its decorum by the first wave of crusader invaders."
