 building_type_constantinople_reform_hagia_sophia_01: "Hagia Sophia"
 building_type_constantinople_reform_hagia_sophia_01_desc: "The religious and spiritual center of the Eastern Orthodox Church for nearly one thousand years, the church was dedicated to the Holy Wisdom. It is the world's largest interior space and among the first to employ a fully pendentive dome. It is considered the epitome of Byzantine architecture.\nRebuilt by Constantinople's new masters, the Hagia Sophia is now very different but still a beloved and prestigious place of worship."
