 building_type_constantinople_reform_harbor_of_sophia_01: "Harbor of Sophia"
 building_type_constantinople_reform_harbor_of_sophia_01_desc: "A basin flanked by an arsenal surrounded by walls, this harbor has been known by many names throughout history. It was the base for the Byzantine navy before the Fourth Crusade.\nIt is still of strategic importance to the new rulers of Constantinople, meaning fortifying it would be a solid defensive measure."
