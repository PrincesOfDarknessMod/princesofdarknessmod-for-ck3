 building_type_constantinople_plundered_the_great_bazar_01: "The Great Bazaar"
 building_type_constantinople_plundered_the_great_bazar_01_desc: "For all the wrack and ruin festering behind Constantinople’s walls, nothing has yet been able to snuff the spark of the Grand Bazaar, the commercial hub where Latin and Hellene, east and west, mortal and Cainite, all commingle in a glorious urban cacophony. Thanks to centuries of vampiric influence, the Bazaar never sleeps.\nWith the Latins now in control of the city, trade continues but is sometimes more akin to extortion."
