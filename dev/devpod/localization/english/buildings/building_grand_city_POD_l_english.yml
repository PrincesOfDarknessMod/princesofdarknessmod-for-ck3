 building_type_constantinople_plundered_aqueduct_of_valens_01: "Aqueduct of Valens"
 building_type_constantinople_plundered_aqueduct_of_valens_01_desc: "The Aqueduct of Valens is a Roman aqueduct system built in the late 4th century AD, to supply Constantinople. Construction of the aqueduct began during the reign of the Roman emperor Constantius II and was completed in 373 by the Emperor Valens. The aqueduct remains in use to this day, having been extended and maintained by the Byzantines.\nLacking in material wealth, the Latins have been mostly ignoring it. Its building blocks have however started to be used to \"embellish\" the palaces of the Latin officials."
