#### Mogadishu Default ####
###########################

building_type_mogadishu_zanj_01: "Mogadishu of the Zanj"
building_type_mogadishu_zanj_01_desc: "Unburdened by the leeches, the city grows free from the influence of Sarapion"
building_mogadishu_zanj_01: "Mogadishu of the Mutagaddimin"
building_mogadishu_zanj_01_desc: "A trading port and entrepot on the indian ocean. They have no king but their affairs are regulated by mutagaddimin, elders according to their customs."
building_mogadishu_zanj_02: "Mogadishu of the Shaikh"
building_mogadishu_zanj_02_desc: "The Sultan of Mogadishu is called Shaikh by his subjectsand is assisted by a constitutional council of wazirs, amirs, and court officials."
building_mogadishu_zanj_03: "Sultanate of the Zanj"
building_mogadishu_zanj_03_desc: "In this place are manufactured the woven fabrics called after it, which are unequalled and exported from it to Egypt and elsewhere."

building_type_mogadishu_bazaar_01: "Mogadishu's Bazaar"
building_type_mogadishu_bazaar_01_desc: "The bazzar is a crowded place where every inch must be fought over with shoulders and elbows, but in that crowd is a thousand different voices speaking a hundred different tongues and sharing ten thousand different ideas."
building_mogadishu_bazaar_01: "Voices from the Horn"
building_mogadishu_bazaar_01_desc: "Languages from all over the horn of Africa can be heard shouting and chatting to each other from miles away, trading, sharing, and laughing together."
building_mogadishu_bazaar_02: "Voices from India"
building_mogadishu_bazaar_02_desc: "Languages from all over the indian ocean, and the middle-east spread and shout in Mogadishu, Urdu, persian, arabic, all sharing a place and trading ideas."
building_mogadishu_bazaar_03: "Voices from China"
building_mogadishu_bazaar_03_desc: "Every so often even the grand trading exepeditions from the middle kingdom stop and resupply in Mogadishu, trading with the locals and sharing new ideas."

building_type_mogadishu_market_01: "Mogadishu's Market"
building_type_mogadishu_market_01_desc: "From here is exported sandalwood, ebony, ambergris, ivory and more"
building_mogadishu_market_01: "Entrepot and Resupply"
building_mogadishu_market_01_desc: "A small market where sailors can reuplly after long trecks on the indian ocean and get ready for even longer trecks, slated meat, fruit, and cassava is sold to be eaten on the road to Baghdad, Zimbabwe or Dehli"
building_mogadishu_market_02: "Trading hub"
building_mogadishu_market_02_desc: "With the growth of trade so does the city's market, no longer simply a resupply hub, now ebony and sandalwood and loaded on ships as gold flows into the city"
building_mogadishu_market_03: "Market Center"
building_mogadishu_market_03_desc: "From halfway across the world, they come, resupplying as many times as necessary to finally reach the great market of Mogadishu where ivory and ambergris flow like water, if you have the coin"

building_type_mogadishu_three_mosques_01: "Three Mosques"
building_type_mogadishu_three_mosques_01_desc: "Mogadishu is home to three great mosques from which Qadis, lawyers, Sharifs, holy men, shaikhs and Hajjis all learn before going out into the world, spreading the teaching of Mogadishu with them"
building_mogadishu_three_mosques_01: "Jami' Friday mosque"
building_mogadishu_three_mosques_01_desc: "The first and oldest of the Mosques, almost falling into ruins but the minaret stands tall, defiant."
building_mogadishu_three_mosques_02: "Arba' Rukn"
building_mogadishu_three_mosques_02_desc: "The second of the mosques of Mogadishu, grander than it's eldest sister it was here that Sa‘īd was taught, before he left to spread the word of Allah all the way to the middle kingdom"
building_mogadishu_three_mosques_03: "Fakhr al-Din"
building_mogadishu_three_mosques_03_desc: "The third and final of the three great mosques of mogadishu, every bit the equal of it's sisters, from everywhere in the city one can hear the arguements of the Qadis and Sharifs as they debate the Quoran"

building_type_mogadishu_dock_01: "Mogadishu's Docks"
building_type_mogadishu_dock_01_desc: "Every ship needs to rest and they swarm any dock that has open space to finally let their sailors feel solid ground beneath their feet, there are always more ships in need of docks than docks available in the horn of Africa"
building_mogadishu_dock_01: "Single Dock"
building_mogadishu_dock_01_desc: "A single solitary dock stretches out into the ocean, ready to take no more than a handful of ships."
building_mogadishu_dock_02: "Fleet of Ships"
building_mogadishu_dock_02_desc: "A fleet of such size any navy would weep rests safely in mogadishu armed not with iron but gold and ivory, ready to load it back onto their ships and sell it hundred of miles away"
building_mogadishu_dock_03: "City at Sea"
building_mogadishu_dock_03_desc: "Almost half of the city rests on the waves now as Mogadishu spreads out in every direction, a safe harbor for all ships to come, with always an open place to anyone who needs it."