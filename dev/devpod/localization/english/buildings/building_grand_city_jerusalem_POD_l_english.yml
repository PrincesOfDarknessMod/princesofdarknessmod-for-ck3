 building_type_jerusalem_jewish_third_temple_01: "Third Temple"
 building_type_jerusalem_jewish_third_temple_01_desc: "#F The Temple is the center of all Jewish worship. While rabbinical teachings offer alternatives, all Hebrews look forward to the day when they can once more use the Temple as the true center of their worship.#!"
 building_jerusalem_jewish_third_temple_01: "Wailing Wall"
 building_jerusalem_jewish_third_temple_01_desc: "This retaining wall is all that remains of the Second Temple after its leveling during the War of Destruction. Perhaps we can build upon these ruins to rebuild the Temple..."
 building_jerusalem_jewish_third_temple_02: "The Outer Courtyards & Ulam"
 building_jerusalem_jewish_third_temple_02_desc: "Before we can rebuild the Temple, we must rebuild the outer courtyards, altars, washbasins, and the Porch's two bronze pillars: Jachin and Boaz. This area is as far as most Gentiles and Hebrews will ever go and will be the focal point of the revived sacrifices. And so, we must create an area appropriate for the purpose and that properly reflects the Shechina."
 building_jerusalem_jewish_third_temple_03: "The Vestibule & Heikal"
 building_jerusalem_jewish_third_temple_03_desc: "The Main Sanctuary, is the workplace of the priests and the home of many important symbols. We shall recover or recreate these symbols so that they may, once more, grace the Temple's hall."
 building_jerusalem_jewish_third_temple_04: "Completed Third Temple"
 building_jerusalem_jewish_third_temple_04_desc: "With the completion of the Holy of Holies and the recovery of the Ark of the Covenant, the Third Temple is once more complete. The Levitical priesthood once more conducts sacrifices and guides the People of G-d as they journey to the Holy City for the festivals. Let it stand 7 times 7 times 7 as long as Solomon's! Let it be a symbol to all the nations of G-d's faithfulness to His chosen people!"
 JERUSALEM_JEWISH_THIRD_TEMPLE: "[GetBuilding('jerusalem_jewish_third_temple_04').GetName]"
 POD_jerusalem_jewish_third_temple_bonus: "$EFFECT_LIST_BULLET$Gain access to the [GetCourtPositionType('jerusalem_socher_court_position').GetName()]\n"

 building_type_jerusalem_jewish_library_01: "$building_jerusalem_jewish_library_02$"
 building_type_jerusalem_jewish_library_01_desc: "#F $building_jerusalem_jewish_library_02_desc$#!"
 building_jerusalem_jewish_library_01: "Genizah of Jerusalem"
 building_jerusalem_jewish_library_01_desc: "As People of the Book, the Hebrews have always understood the value of the written word. For now, we merely have a storage space for worn-out or damaged texts, administrative records, letters, and receipts. Perhaps in the future we will need and be able to acquire a larger space."
 building_jerusalem_jewish_library_02: "Archives of Jerusalem"
 building_jerusalem_jewish_library_02_desc: "As People of the Book, the Hebrews have always understood the value of the written word. Now, it is time to gather our knowledge into an archive to rival the greatest libraries in history."
 building_jerusalem_jewish_library_03: "Library of Jerusalem"
 building_jerusalem_jewish_library_03_desc: "While our work is not yet complete, we have made good progress at forming a centralized collection of our knowledge of the natural and supernatural worlds."
 building_jerusalem_jewish_library_04: "Great Library of Jerusalem"
 building_jerusalem_jewish_library_04_desc: "Once, Greek translations of the Tanakh sat on shelves in the Great Library of Alexandria. Now, Hebrew translations of Plato's #italic The Republic#! and #italic The Aeneid#! by Virgil sit on the shelves of the Great Library of Jerusalem alongside our complete collection of works regarding the origins, nature, and weakness of all created things, whether living, dead, or undead."
 JERUSALEM_JEWISH_LIBRARY: "[GetBuilding('jerusalem_jewish_library_04').GetName]"

 building_type_jerusalem_jewish_castle_01: "Tower of David"
 building_type_jerusalem_jewish_castle_01_desc: "#F $building_jerusalem_jewish_castle_01_desc$#!"
 building_jerusalem_jewish_castle_01: "Tower of David"
 building_jerusalem_jewish_castle_01_desc: "Built upon the ruins of Hasmonean and Herodian-era fortifications, the current Tower of David was built in the 5th century AD. It has been used as a military fortress since the Muslim conquest of Jerusalem and the removal of the monks living within the tower."
 building_jerusalem_jewish_castle_02: "Keep of David"
 building_jerusalem_jewish_castle_02_desc: "While mistakenly attributed as part of David's palace by the Byzantines, the Tower is an important part of Jerusalem's defenses and history. In acknowledgement of that, we have expanded the Tower into a keep appropriate for its history and value."
 building_jerusalem_jewish_castle_03: "Fortress of David"
 building_jerusalem_jewish_castle_03_desc: "Where once a tower stood, now a mighty fortress rises in its place. The newly-built fortress shall protect our people and serve as a secure point from which our armies can operate."
 building_jerusalem_jewish_castle_04: "Citadel of David"
 building_jerusalem_jewish_castle_04_desc: "The city of Jerusalem has fallen to enemy forces far too many times throughout history. With the completion of the Citadel of David, the many threats to a Hebrew Jerusalem will face a far greater challenge, should they foolishly seek to take the city once more."
 JERUSALEM_JEWISH_CASTLE: "[GetBuilding('jerusalem_jewish_castle_04').GetName]"
 POD_jerusalem_jewish_castle_bonus: "$EFFECT_LIST_BULLET$#help If you already have [GetMaA('shomer').GetName]:#!\nUpgrades the [GetMaA('shomer').GetName] to [GetMaA('blessed_shomer').GetName]\n$EFFECT_LIST_BULLET$#help If you do not:#!\nGain access to [GetMaA('shomer').GetName]"

 building_type_jerusalem_jewish_palace_01: "$building_jerusalem_jewish_palace_01$"
 building_type_jerusalem_jewish_palace_01_desc: "#F $building_jerusalem_jewish_palace_01_desc$#!"
 building_jerusalem_jewish_palace_01: "Annas' Ruined Mansion"
 building_jerusalem_jewish_palace_01_desc: "Once residence to High Priest Annas under King Herod, the structure was destroyed with the rest of Jerusalem in A.D. 70. Little remains beyond ruins."
 building_jerusalem_jewish_palace_02: "Annas' Rebuilt Mansion"
 building_jerusalem_jewish_palace_02_desc: "Having been rebuilt from the burnt husk it once was, this grand structure recalls a time when Jerusalem was home to a High Priest."
 building_jerusalem_jewish_palace_03: "Annas' Palatial Mansion"
 building_jerusalem_jewish_palace_03_desc: "Having been fully reconstructed and even expanded, this truly is a home fit for a king."
 building_jerusalem_jewish_palace_04: "The Royal Palace"
 building_jerusalem_jewish_palace_04_desc: "Built upon a mansion in the Jewish Quarter that was once residence to High Priest Annas during the time of King Herod, this structure is a powerful symbol of the Jews' return to Jerusalem. It is truly a palace and seat of government fit for a king ruling from the holy city of Jerusalem."
 JERUSALEM_JEWISH_PALACE: "[GetBuilding('jerusalem_jewish_palace_04').GetName]"

 building_type_jerusalem_jewish_pools_01: "Jerusalem's Reservoir System"
 building_type_jerusalem_jewish_pools_01_desc: "#F Like many large desert cities, Jerusalem has a complex, albeit rundown, system of providing water. Rebuilding this ancient system will allow Jerusalem's population to expand once more and for commerce to flow like the waters.#!"
 #also one of the few locations mentioned in Fountains of Bright Crimson & Jerusalem By Night
 building_jerusalem_jewish_pools_01: "Hezekiah's Pool"
 building_jerusalem_jewish_pools_01_desc: "This ancient reservoir was built by King Hezekiah to provide 11 million liters of water to the city. The pool was once surrounded by great towers and pillars, leading kings to use it as a place where they met foreign diplomats."
 building_jerusalem_jewish_pools_02: "Hezekiah's Aqueduct"
 building_jerusalem_jewish_pools_02_desc: "This ancient tunnel directs water from the Gihon Spring far outside the city across 583 yards into the Pool of Siloam within the walls. The Gihon Spring is Jerusalem's primary but intermittent source of water, making the aqueduct and the Pool of Siloam necessary for when the spring is not flowing."
 building_jerusalem_jewish_pools_03: "David's Tsinnor"
 building_jerusalem_jewish_pools_03_desc: "In the second millennium B.C., a waterwork and some fortifications were constructed near the Gihon Spring. Deepened and lengthened in later centuries, they served to deny access to besiegers while protecting the city's water flow. Some say it was through these tunnels that David struck. Either way, its excavation has provided a more reliable source of water."
 building_jerusalem_jewish_pools_04: "Solomon's Pools"
 building_jerusalem_jewish_pools_04_desc: "When first built, these 3 reservoirs stored almost 285 million liters of water. Via 5 dedicated aqueducts, they provided water to Bethlehem, the Temple Mount, Herod's Palace, and more. With all of our repairs in place, water once more flows into Jerusalem and satisfies all of our needs."
 JERUSALEM_JEWISH_POOLS: "[GetBuilding('jerusalem_jewish_pools_04').GetName]"
 POD_jerusalem_jewish_pools_bonus: "#P The owner of this building can use the [diligent_development_focus_decision|E] if Jerusalem is their capital.#!"

 building_type_jerusalem_jewish_synagogue_01: "$building_jerusalem_jewish_synagogue_02$"
 building_type_jerusalem_jewish_synagogue_01_desc: "#F When Rabbi Moshe ben Nachman, more commonly known as Nachmanides or Ramban, came to Jerusalem, he was greatly saddened by the lack of Jews in Jerusalem and the power wielded by the undead within the Holy City. Even before his coming, his disciples were moving within the city, and he greatly aided their efforts.#!"
 building_jerusalem_jewish_synagogue_01: "Ramban Shul"
 building_jerusalem_jewish_synagogue_01_desc: "Before it can be a synagogue where the faithful assemble, it must first be a school to guide and teach them."
 building_jerusalem_jewish_synagogue_02: "Ramban Synagogue"
 building_jerusalem_jewish_synagogue_02_desc: "As the number of Hebrews has grown, the Ramban Shul has grown into a proper synagogue where the faithful may assemble."
 building_jerusalem_jewish_synagogue_03: "Ramban Bet Knesset"
 building_jerusalem_jewish_synagogue_03_desc: "What was once a small meeting place and school has now grown into a great house of assembly for the faithful. There are rumors of Judges traveling from across the world to this place, disguising themselves as pilgrims and exchanging information."
 building_jerusalem_jewish_synagogue_04: "Nachmanides Bet Knesset"
 building_jerusalem_jewish_synagogue_04_desc: "With their coming to Jerusalem, Nachmanides and his followers now lead the synagogue named after him. With their guidance, great gains have been seen, aiding the Judges in their great mission."
 JERUSALEM_JEWISH_SYNAGOGUE: "[GetBuilding('jerusalem_jewish_synagogue_04').GetName]"
 POD_jerusalem_jewish_synagogue_bonus: "$EFFECT_LIST_BULLET$#help If you can already use $literalist_debate_interaction$ [interaction|E]:#!\nGain +100% piety on victory and -50% on loss\n$EFFECT_LIST_BULLET$#help If you do not:#!\nMay debate other lords of the realm at the cost of [opinion|E], to gain or lose [piety|E]"

 building_type_jerusalem_jewish_demonology_01: "$building_jerusalem_jewish_demonology_01$"
 building_type_jerusalem_jewish_demonology_01_desc: "#F It is the glory of God to conceal things, but the glory of kings is to search things out. That has become this synagogue's purpose.#!"
 #also one of the few locations mentioned in Fountains of Bright Crimson & Jerusalem By Night
 building_jerusalem_jewish_demonology_01: "Tif'eret Yisra'el Synagogue"
 building_jerusalem_jewish_demonology_01_desc: "Built upon ruins dating back to the Kingdom of Judah, the Tif'eret Yisra'el Shul is now a place to teach certain mystical arts pioneered by King Solomon and discover creation's hidden mysteries. Within its shadows walks a strange man that has been here as long as anyone can remember."
 building_jerusalem_jewish_demonology_02: "Renovated Tif'eret Yisra'el Synagogue"
 building_jerusalem_jewish_demonology_02_desc: "With its recent renovations, the synagogue is now a place where students go to learn the deeper secrets of magic. A few are even selected to study under an old rabbi known for his stringy white hair, aiding him in his research."
 building_jerusalem_jewish_demonology_03: "Decorated Tif'eret Yisra'el Synagogue"
 building_jerusalem_jewish_demonology_03_desc: "Drawing from the arts of infernalism, King Solomon the Wise found a way to cleanse its rituals and spells, removing the danger of being tainted. Such knowledge forms the foundation of our current magics and allows us unique abilities others might find unnatural. Our efforts are only furthered by the resident rabbi's insights, revealing truths hidden in many texts."
 building_jerusalem_jewish_demonology_04: "Consecrated Tif'eret Yisra'el Synagogue"
 building_jerusalem_jewish_demonology_04_desc: "It is said that the Holy Book is beyond mortal comprehension until the Messiah's coming when he shall interpret every passage, every word, every space between the letters. The Torah itself is creation's blueprint with Deuteronomy 32 alone carrying all of Israel's history. Within its pages lay every secret within creation, mysteries we study under Rabbi Abraham's guidance. Whether it be gematria, notarikon, temurah, numerics, acrostics, clustering, macrocodes, equidistant letter spacings, name analysis, steganographic analysis, heptadic structural analysis, or something else, every approach must be used to process the hidden information granted to us."
 JERUSALEM_JEWISH_DEMONOLOGY: "[GetBuilding('jerusalem_jewish_demonology_04').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_1: "[GetBuilding('jerusalem_jewish_demonology_01').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_2: "[GetBuilding('jerusalem_jewish_demonology_02').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_3: "[GetBuilding('jerusalem_jewish_demonology_03').GetName]"
 POD_jerusalem_jewish_demonology_bonus: "$EFFECT_LIST_BULLET$#help If you can use [Glossary('Disciplines','game_concept_discipline_desc')]:#!\n+10% ritual speed bonus for blood sorcery\n$EFFECT_LIST_BULLET$#help If you do not:#!\nYou gain access to all Dur-An-Ki Rituals"



 building_type_jerusalem_christian_holy_sepulcher_01: "Church of the Holy Sepulchre"
 building_type_jerusalem_christian_holy_sepulcher_01_desc: "#F Considered the holiest site in Christianity, the Church of the Holy Sepulchre is built upon the site of Jesus' death and His empty tomb. In addition, the Church contains the last 4 Stations of the Cross of the Via Dolorosa.#!"
 building_jerusalem_christian_holy_sepulcher_01: "Chapel of the Holy Sepulchre"
 building_jerusalem_christian_holy_sepulcher_01_desc: "While the Byzantines and the Crusaders made some efforts to rebuild the Church, much of it is still left in ruins from its destruction by al-Hakim."
 building_jerusalem_christian_holy_sepulcher_02: "Church of the Holy Sepulchre"
 building_jerusalem_christian_holy_sepulcher_02_desc: "The Church of the Holy Sepulchre has finally been restored to its ancient glory as commissioned and consecrated under Constantine the Great."
 building_jerusalem_christian_holy_sepulcher_03: "Cathedral of the Holy Sepulchre"
 building_jerusalem_christian_holy_sepulcher_03_desc: "The Church has been expanded into a proper seat for both the Orthodox Patriarch and Latin Patriarch of Jerusalem."
 building_jerusalem_christian_holy_sepulcher_04: "Grand Cathedral of the Holy Sepulchre"
 building_jerusalem_christian_holy_sepulcher_04_desc: "Finally, this holy site is graced by the cathedral it warrants, one that properly reflects the glory and majesty of God. All Christendom shall wonder at the sight."
 JERUSALEM_CHRISTIAN_HOLY_SEPULCHER: "[GetBuilding('jerusalem_christian_holy_sepulcher_04').GetName]"
 POD_jerusalem_christian_holy_sepulcher_bonus: "$EFFECT_LIST_BULLET$[holy_wars|E] against Kingdoms can be declared every 25 years instead of 50\n"
 POD_jerusalem_christian_holy_sepulcher_bonus2: "$EFFECT_LIST_BULLET$Gain access to the [GetCourtPositionType('jerusalem_puppeteer_grand_masters_court_position').GetName()]\n"

 building_type_jerusalem_christian_lazarus_01: "Order of St Lazarus"
 building_type_jerusalem_christian_lazarus_01_desc: "#F More commonly known as the Leper Knights, the Order of St. Lazarus provides healers to many hospitals and guards those hospitals from potential dangers. In addition, they offer those with a fatal form of leprosy a chance to die with glory and honor in service to God.#!"
 building_jerusalem_christian_lazarus_01: "St Lazarus Chapter House"
 building_jerusalem_christian_lazarus_01_desc: "This Chapter House provides housing for a small number of Leper Knights and serves as a quarantine station."
 building_jerusalem_christian_lazarus_02: "Knight-Brother Enclave of St Lazarus"
 building_jerusalem_christian_lazarus_02_desc: "This Enclave provides housing for a decent number of Leper Knights and serves as a field hospital."
 building_jerusalem_christian_lazarus_03: "St Lazarus's Commandery of the Cross"
 building_jerusalem_christian_lazarus_03_desc: "This Commandery houses a large contingent of Leper Knights and acts as a regional center for administering various hospitals and aiding injured knight-brothers."
 building_jerusalem_christian_lazarus_04: "St Lazarus's Bastion of the Cross"
 building_jerusalem_christian_lazarus_04_desc: "This Bastion provides housing for a massive number of Leper Knights dedicated to furthering the mission of the Cross through martial might and by providing wide-spread medical services."
 JERUSALEM_CHRISTIAN_LAZARUS: "[GetBuilding('jerusalem_christian_lazarus_04').GetName]"

 building_type_jerusalem_christian_john_01: "Order of St John"
 building_type_jerusalem_christian_john_01_desc: "#F More commonly known as the Knights Hospitaller, the Order of St. John cares for and protects the sick, injured, and poor pilgrims who come to the Holy Land. In addition, they are known for managing critical fortresses such as Krak des Chevaliers and occassionally helping to arrange certain treaties between Christian rulers.#!"
 building_jerusalem_christian_john_01: "St John Chapter House"
 building_jerusalem_christian_john_01_desc: "This Chapter House provides housing for a small number of Knights Hospitaller and serves as a small fort for pilgrims seeking protection."
 building_jerusalem_christian_john_02: "Knight-Brother Enclave of St John"
 building_jerusalem_christian_john_02_desc: "This Enclave provides housing for a decent number of Knights Hospitaller and serves as a mid-sized fort for pilgrims seeking protection."
 building_jerusalem_christian_john_03: "St John's Commandery of the Cross"
 building_jerusalem_christian_john_03_desc: "This Commandery houses a large contingent of Knights Hospitaller and acts as a regional center for administering various charities and safeguarding pilgrims along the roads of the Holy Land."
 building_jerusalem_christian_john_04: "St John's Bastion of the Cross"
 building_jerusalem_christian_john_04_desc: "This Bastion provides housing for a massive number of Knights Hospitaller dedicated to furthering the mission of the Cross through martial might and by protecting all pilgrims."
 JERUSALEM_CHRISTIAN_JOHN: "[GetBuilding('jerusalem_christian_john_04').GetName]"
 POD_crusader_siege_tactics_modifier: "Crusader Siege Tactics"
 POD_crusader_siege_tactics_modifier_desc: "Centuries of experience with unending holy wars has granted unique insights into undermining, sapping, and other siege tactics. Most enemies discover this too late."
 POD_jerusalem_christian_john_bonus: "Inflict enemy [rulers|E] with [GetModifier('POD_crusader_siege_tactics_modifier').GetNameWithTooltip] when starting a [war|E] as the primary attacker or defender."

 building_type_jerusalem_christian_sepulchre_01: "Order of the Holy Sepulchre"
 building_type_jerusalem_christian_sepulchre_01_desc: "#F More commonly known as the Milites Sancti Sepulcri, the Order of the Holy Sepulchre protects and manages key holy sites within Jerusalem. In addition, they confer knighthood to their greatest warriors, making them more attractive to the common man.#!"
 building_jerusalem_christian_sepulchre_01: "Holy Sepulchre Chapter House"
 building_jerusalem_christian_sepulchre_01_desc: "This Chapter House provides housing for a small number of Milites Sancti Sepulcri and serves as a minor recruitment hub."
 building_jerusalem_christian_sepulchre_02: "Knight-Brother Enclave of the Holy Sepulchre"
 building_jerusalem_christian_sepulchre_02_desc: "This Enclave provides housing for a decent number of Milites Sancti Sepulcri and serves as a mid-sized recruitment hub."
 building_jerusalem_christian_sepulchre_03: "Holy Sepulchre's Commandery of the Cross"
 building_jerusalem_christian_sepulchre_03_desc: "This Commandery houses a large contingent of Milites Sancti Sepulcri and acts as a regional center for recruiting knight-brothers to defend key locations within the Holy Land."
 building_jerusalem_christian_sepulchre_04: "Holy Sepulchre's Bastion of the Cross"
 building_jerusalem_christian_sepulchre_04_desc: "This Bastion provides housing for a massive number of Milites Sancti Sepulcri dedicated to furthering the mission of the Cross through martial might and by recruiting the common man to the cause."
 JERUSALEM_CHRISTIAN_SEPULCHRE: "[GetBuilding('jerusalem_christian_sepulchre_04').GetName]"

 building_type_jerusalem_christian_supreme_templar_01: "Order of the Temple of Solomon"
 building_type_jerusalem_christian_supreme_templar_01_desc: "#F More commonly known as the Templar Knights, the Order of the Temple of Solomon is one of the most martial-oriented of the 5 major crusading orders within Jerusalem. They are particularly known for their heavy cavalry and infantry.#!"
 building_jerusalem_christian_supreme_templar_01: "Supreme Order Chapter House"
 building_jerusalem_christian_supreme_templar_01_desc: "This Chapter House provides housing for a small number of Templar Knights and serves as a training camp."
 building_jerusalem_christian_supreme_templar_02: "Knight-Brother Enclave of the Supreme Order"
 building_jerusalem_christian_supreme_templar_02_desc: "This Enclave provides housing for a decent number of Templar Knights and serves as a mid-sized training camp."
 building_jerusalem_christian_supreme_templar_03: "St John's Commandery of the Cross"
 building_jerusalem_christian_supreme_templar_03_desc: "This Commandery houses a large contingent of Templar Knights and acts as a regional center for training knight-brothers capable of withstanding any assault."
 building_jerusalem_christian_supreme_templar_04: "Supreme Order's Bastion of the Cross"
 building_jerusalem_christian_supreme_templar_04_desc: "This Bastion provides housing for a massive number of Templar Knights dedicated to furthering the mission of the Cross through overwhelming martial might."
 JERUSALEM_CHRISTIAN_SUPREME_TEMPLAR: "[GetBuilding('jerusalem_christian_supreme_templar_04').GetName]"

 building_type_jerusalem_christian_german_mary_01: "Order of St Mary"
 building_type_jerusalem_christian_german_mary_01_desc: "#F More commonly known as the Teutonic Knights, the Order of St. Mary helps maintain order and control within their territory. While they have a long way before reaching their eventual heights in Livonia, they are still helpful at regulating the other factions within Jerusalem.#!"
 building_jerusalem_christian_german_mary_01: "St Mary Chapter House"
 building_jerusalem_christian_german_mary_01_desc: "This Chapter House provides housing for a small number of Teutonic Knights and serves as a temporary holding cell."
 building_jerusalem_christian_german_mary_02: "Knight-Brother Enclave of St Mary"
 building_jerusalem_christian_german_mary_02_desc: "This Enclave provides housing for a decent number of Teutonic Knights and serves as a secondary courthouse."
 building_jerusalem_christian_german_mary_03: "St Mary's Commandery of the Cross"
 building_jerusalem_christian_german_mary_03_desc: "This Commandery houses a large contingent of Teutonic Knights and acts as a regional center for enforcing and adjudicating the laws of Christendom."
 building_jerusalem_christian_german_mary_04: "St Mary's Bastion of the Cross"
 building_jerusalem_christian_german_mary_04_desc: "This Bastion provides housing for a massive number of Teutonic Knights dedicated to furthering the mission of the Cross through martial might and judicial efforts."
 JERUSALEM_CHRISTIAN_GERMAN_MARY: "[GetBuilding('jerusalem_christian_german_mary_04').GetName]"
 POD_jerusalem_christian_german_mary_bonus: "[convert_county|E] will progress #color_green +25%#! faster"



 #mentioned by Fountains of Bright Crimson and Jerusalem By Night
 building_type_jerusalem_divided_temple_mount_catacombs_01: "Temple Mount Catacombs"
 building_type_jerusalem_divided_temple_mount_catacombs_01_desc: "#F Unlike the Church of the Holy Sepulchre, the tunnels beneath the Temple Mount are almost discomfort free as mortal faith is directed upwards. Weaving in three dimensions across many layers beneath the surface and with oddly-shifting halls, these catacombs are not a place to be explored lightly. One could truly wander here for eternity, feeding on rats and the blood of blind fish, and never again see the world. However, they still provide an excellent hiding place from other Kindred and the sun.#!"
 building_jerusalem_divided_temple_mount_catacombs_01: "Decrepit Labrinthine Sprawl"
 building_jerusalem_divided_temple_mount_catacombs_01_desc: "The caverns beneath the Temple Mount and Jerusalem are damp and slippery, marred by numerous cave-ins and twisting passages. Even a small impact could cause a huge section of the corridor to collapse."
 building_jerusalem_divided_temple_mount_catacombs_02: "Concealed Catacombs"
 building_jerusalem_divided_temple_mount_catacombs_02_desc: "With some reinforcements, you have improved that which lies below the Temple Mount. The array of chambers, pitfalls, and passages are no less confusing or likely to change behind you but are much less prone to collapse."
 building_jerusalem_divided_temple_mount_catacombs_03: "Haunted Halls"
 building_jerusalem_divided_temple_mount_catacombs_03_desc: "An ancient darkness seems to sleep within the tunnels, and many of the deep tunnels seem to have been carved upwards. However, it is the other Kindred living within the catacombs that present an obstacle to your plans. Or rather, they used to..."
 building_jerusalem_divided_temple_mount_catacombs_04: "Shadow Palace"
 building_jerusalem_divided_temple_mount_catacombs_04_desc: "The tunnels know no end, leading to hidden secrets, lost relics, and cities older than all but a few methuselahs. Your explorations and efforts have yielded incredible results, results that have allowed the construction of a massive palace within the catacombs. You rule this holy city with an iron fist from this hidden palace and should any upset you, there is always the unending maze which leads eternally downwards through madly shifting corridors that trap any who enter. The only price is the mad cackles and screams emanating from those halls, a small price indeed."
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier1: "#color_green -1%#! influence needed to achieve each #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic modifier threshold#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier2: "#color_green -2%#! influence needed to achieve each #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic modifier threshold#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier3: "#color_green -3%#! influence needed to achieve each #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic modifier threshold#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier4: "$EFFECT_LIST_BULLET$#color_green -5%#! influence needed to achieve each #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic modifier threshold#!#!\n"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_equilibrium: "$EFFECT_LIST_BULLET$The influence equilibrium values become #color_white 34#! $POD_muslim_influence$, #color_white 33#! $POD_christian_influence$, and #color_white 33#! $POD_jewish_influence$\n"
 JERUSALEM_DIVIDED_TEMPLE_MOUNT_CATACOMBS: "[GetBuilding('building_jerusalem_divided_temple_mount_catacombs_04').GetName]"



 building_type_jerusalem_muslim_dome_rock_01: "Dome of the Rock"
 building_type_jerusalem_muslim_dome_rock_01_desc: "#F The Dome of the Rock was built in the 690s AD upon the site where Adam was created, where Abraham almost sacrificed his son, and where Muhammad began his Night Journey. While the structure is still in good shape after so many centuries, crusades and earthquakes have inflicted a toll.#!"
 building_jerusalem_muslim_dome_rock_01: "Dome of the Rock"
 building_jerusalem_muslim_dome_rock_01_desc: "The Dome of the Rock was built in the 690s AD upon the site where Adam was created, where Abraham almost sacrificed his son, and where Muhammad began his Night Journey. While the structure is still in good shape after so many centuries, crusades and earthquakes have inflicted a toll."
 building_jerusalem_muslim_dome_rock_02: "Renovated Dome of the Rock"
 building_jerusalem_muslim_dome_rock_02_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_03: "Decorated Dome of the Rock"
 building_jerusalem_muslim_dome_rock_03_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_04: "Consecrated Dome of the Rock"
 building_jerusalem_muslim_dome_rock_04_desc: "The Dome of the Rock was built in the 690s AD upon the site where Adam was created, where Abraham almost sacrificed his son, and where Muhammad began his Night Journey. With the damage repaired, the third most holy site in Islam is finally ready to properly honor Allah's great achievements in this location"
 JERUSALEM_MUSLIM_DOME_ROCK: "[GetBuilding('building_jerusalem_muslim_dome_rock_04').GetName]"
 POD_jerusalem_muslim_dome_rock_bonus: "$EFFECT_LIST_BULLET$Gain access to the [GetCourtPositionType('jerusalem_ashen_muhtasib_court_position').GetName()]\n"
 POD_jerusalem_muslim_dome_rock_bonus2: "$EFFECT_LIST_BULLET$#help If you already have [GetTrait('truefaith').GetName(GetNullCharacter)]:#!\nGain [piety_i|E] #V 2500#! [piety|E] and #V 1#! [piety_level|E] upon completing the Hajj\n$EFFECT_LIST_BULLET$#help If you do not:#!\nGain [GetTrait('truefaith').GetName(GetNullCharacter)] upon completing the Hajj"

 #from Jerusalem by Night
 building_type_jerusalem_muslim_damascus_market_01: "$building_jerusalem_muslim_damascus_market_02$"
 building_type_jerusalem_muslim_damascus_market_01_desc: "#F $building_jerusalem_muslim_damascus_market_02_desc$#!"
 building_jerusalem_muslim_damascus_market_01: "Damascus Market"
 building_jerusalem_muslim_damascus_market_01_desc: "Amongst the labyrinthine network of alleyways, everything from imported wares to livestock is bought and sold."
 building_jerusalem_muslim_damascus_market_02: "Damascus Marketplace"
 building_jerusalem_muslim_damascus_market_02_desc: "Mostly-organized stalls overflow with colorful spices, sweets, wood carvings, ceramics, fresh produce, textiles, and far more. Little cannot be found among them."
 building_jerusalem_muslim_damascus_market_03: "Damascus Bazaar"
 building_jerusalem_muslim_damascus_market_03_desc: "The Damascus Bazaar deals in everything from imported wares to livestock and is the financial heart of Jerusalem. Whatever may be purchased legally can be found here."
 building_jerusalem_muslim_damascus_market_04: "Grand Damascus Bazaar"
 building_jerusalem_muslim_damascus_market_04_desc: "The Grand Damascus Bazaar deals in everything from imported wares to livestock and is the financial heart of Jerusalem. Jerusalem is the focal point around which the world's trade swings, and the Great Damascus Bazaar is the center of that focal point."
 JERUSALEM_MUSLIM_DAMASCUS_MARKET: "[GetBuilding('building_jerusalem_muslim_damascus_market_04').GetName]"

 building_type_jerusalem_muslim_zawiya_01: "$building_jerusalem_muslim_zawiya_01$"
 building_type_jerusalem_muslim_zawiya_01_desc: "#F $building_jerusalem_muslim_zawiya_02_desc$#!"
 building_jerusalem_muslim_zawiya_01: "Zawiya Ahmad"
 building_jerusalem_muslim_zawiya_01_desc: "Named for an important but mostly forgotten religious leader, it serves as a place of worship, a school, a monastery, and a home to a local brotherhood."
 building_jerusalem_muslim_zawiya_02: "Renovated Zawiya Ahmad"
 building_jerusalem_muslim_zawiya_02_desc: "With the recent renovations, the Zawiya Ahmad is once more reminding people of an ancient traditionalist and warrior of the jihad. He once inspired many a soldier and a hunter; perhaps he will again."
 building_jerusalem_muslim_zawiya_03: "Expanded Zawiya Ahmad"
 building_jerusalem_muslim_zawiya_03_desc: "The brotherhood has taken advantage of their home's recent expansions to recruit new brothers and to begin training them for war."
 building_jerusalem_muslim_zawiya_04: "Consecrated Zawiya Ahmad"
 building_jerusalem_muslim_zawiya_04_desc: "After its recent reconsecration and other improvements, this zawiya truly honors its namesake: Ahmad ibn Harb \"the Son of War\". From its halls march forth an organzied and devout force, ready to defend and expand these lands."
 JERUSALEM_MUSLIM_ZAWIYA: "[GetBuilding('building_jerusalem_muslim_zawiya_04').GetName]"

 building_type_jerusalem_muslim_madrasa_01: "Madrasa Dho 'l-Nun"
 building_type_jerusalem_muslim_madrasa_01_desc: "#F $building_jerusalem_muslim_madrasa_02_desc$#!"
 building_jerusalem_muslim_madrasa_01: "Madrasa Dho 'l-Nun"
 building_jerusalem_muslim_madrasa_01_desc: "Named for an important but mostly forgotten religious leader, it serves as an educational institution for both secular and religious matters."
 building_jerusalem_muslim_madrasa_02: "Renovated Madrasa Dho 'l-Nun"
 building_jerusalem_muslim_madrasa_02_desc: "With the recent renovations, the Madrasa Dho 'l-Nun is once more reminding people of an ancient mystic and saint. He once inspired many a scholar and a hunter; perhaps he will again."
 building_jerusalem_muslim_madrasa_03: "Expanded Madrasa Dho 'l-Nun"
 building_jerusalem_muslim_madrasa_03_desc: "The scholars have taken advantage of their home's recent expansions to teach some new classes on certain mystical arts."
 building_jerusalem_muslim_madrasa_04: "Consecrated Madrasa Dho 'l-Nun"
 building_jerusalem_muslim_madrasa_04_desc: "After its recent reconsecration and other improvements, this madrasa truly honors its namesake: Dho 'l-Nun al-Misri. From its halls issue forth many students prepared to use their understanding of secular, religious, and mystical topics."
 JERUSALEM_MUSLIM_MADRASA: "[GetBuilding('building_jerusalem_muslim_madrasa_04').GetName]"
 POD_jerusalem_muslim_madrasa_bonus: "$EFFECT_LIST_BULLET$Passive [crafting_brewing|E] #weak ([GetTrait('pod_crafter').GetName( GetNullCharacter )])#! [trait_level_track_xp|E]: #P +0.25#!\n$EFFECT_LIST_BULLET$"  # written like this to move university stuff on to new line with bullet

 building_type_jerusalem_muslim_al_yaqubi_01: "al-Ya'qubi Mosque"
 building_type_jerusalem_muslim_al_yaqubi_01_desc: "#F $building_jerusalem_muslim_al_yaqubi_02_desc$#!"
 building_jerusalem_muslim_al_yaqubi_01: "al-Ya'qubi Mosque"
 building_jerusalem_muslim_al_yaqubi_01_desc: "Named for an important but mostly forgotten leader, it serves as a conventional mosque, though one encouraging exploration and the study of history."
 building_jerusalem_muslim_al_yaqubi_02: "Renovated al-Ya'qubi Mosque"
 building_jerusalem_muslim_al_yaqubi_02_desc: "With the recent renovations, the al-Ya'qubi Mosque is once more reminding people of an ancient historian and geographer. He once inspired many an explorer and a hunter; perhaps he will again."
 building_jerusalem_muslim_al_yaqubi_03: "Expanded al-Ya'qubi Mosque"
 building_jerusalem_muslim_al_yaqubi_03_desc: "The explorers, merchants, and historians have taken advantage of the mosque's recent expansions to encourage exploration, the collection of oral tales, and spreading the name of the mosque's sponsor."
 building_jerusalem_muslim_al_yaqubi_04: "Consecrated al-Ya'qubi Mosque"
 building_jerusalem_muslim_al_yaqubi_04_desc: "After its recent reconsecration and other improvements, this mosque truly honors its namesake: Abu l-Abbas Ahmad bin Abi Ya'qub bin Ja'far bin Wahb bin Wadih al-Ya'qubi. From its halls issue forth many explorers and historians who remember how he recorded many Jahiliyyah-era fables and detailed information regarding cities from the Byzantine Empire to China"
 JERUSALEM_MUSLIM_AL_YAQUBI: "[GetBuilding('building_jerusalem_muslim_al_yaqubi_04').GetName]"

 building_type_jerusalem_muslim_al_khanqah_salahiyya_01: "al-Khanqah as-Salahiyya Mosque"
 building_type_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "#F $building_jerusalem_muslim_al_khanqah_salahiyya_02_desc$#!"
 building_jerusalem_muslim_al_khanqah_salahiyya_01: "al-Khanqah as-Salahiyya Mosque"
 building_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "Named for an Salah ad-Din Yusuf ibn Ayyub, it serves as a conventional mosque and remembers his time here. A few remnants of the mosque's time as a khanqah linger in the corners."
 building_jerusalem_muslim_al_khanqah_salahiyya_02: "Renovated al-Khanqah as-Salahiyya Mosque"
 building_jerusalem_muslim_al_khanqah_salahiyya_02_desc: "With the recent renovations, the al-Khanqah as-Salahiyya Mosque is once more reminding people of the great general and sultan while sustaining the khanqah's traditions. He has inspired many a ruler and a hunter; perhaps this place will play a part in keeping his legacy alive"
 building_jerusalem_muslim_al_khanqah_salahiyya_03: "Expanded al-Khanqah as-Salahiyya Mosque"
 building_jerusalem_muslim_al_khanqah_salahiyya_03_desc: "The local leaders have taken advantage of the mosque's recent expansions to further their own legends and prestige."
 building_jerusalem_muslim_al_khanqah_salahiyya_04: "Consecrated al-Khanqah as-Salahiyya Mosque"
 building_jerusalem_muslim_al_khanqah_salahiyya_04_desc: "After its recent reconsecration and other improvements, this mosque truly honors its namesake: Salah ad-Din Yusuf ibn Ayyub. In his time, the mosque provided housing to his officers and served as his personal spiritual retreat. His legacy guides future sultans and rulers as they plan for the future."
 JERUSALEM_MUSLIM_AL_KHANQAH_SALAHIYYA: "[GetBuilding('building_jerusalem_muslim_al_khanqah_salahiyya_04').GetName]"



 building_type_pit_of_malkav_01: "Pit of Ketef Hinnom"
 building_type_pit_of_malkav_01_desc: "#F An open gap lies below Jerusalem. Even coming close is painful. Your head feels like it is about to explode.#!"
 building_pit_of_malkav_01: "Open Pit of Ketef Hinnom"
 building_pit_of_malkav_01_desc: "So many voices saying so many contradicting things... even though you can still glimpse a faint edge of wisdom in some of those."
 building_pit_of_malkav_02: "Concealed Pit of Ketef Hinnom"
 building_pit_of_malkav_02_desc: "You have thrown rocks into the pit and the voices are less frantic now. You are better able to understand them."
 building_pit_of_malkav_03: "Closed Pit of Ketef Hinnom"
 building_pit_of_malkav_03_desc: "The voices are quiet now, unless you are very close to the pit itself. Being close to it allows you to separate the mad from the insightful with ease now."
 building_pit_of_malkav_04: "Sanctified Pit of Ketef Hinnom"
 building_pit_of_malkav_04_desc: "Where once there were mad voices, now there are hymns whispering on the winds. Where once madness spilled forth upon this holy land, now blessings and wisdom go forth. Where once an evil beast ravaged the minds of all those nearby, now prayers rise up from the land. Where once a ravenous maw consumed the unwary and the sinful, now the faithful make prilgrimages to the grand temple built upon the once-profane."
 POD_requirements_purified_pit_malkav: "The [holder|E] must be a [GetTrait('supehunter').GetName( GetPlayer )] and have purified the Pit via [decision|E]."
