 building_type_thunderstrike_caern_01: "Thunderstrike Caern"
 building_type_thunderstrike_caern_01_desc: "#F $building_thunderstrike_caern_01_desc$#!"
 building_thunderstrike_caern_01: "Crumbling Thunderstrike Caern"
 building_thunderstrike_caern_01_desc: "This Shadow Lord caern is known for its martial prowess, being dedicated at least in part to the Typhon aspect of Grandfather Thunder. It is also known for its animosity towards Silver Fangs." 
 building_thunderstrike_caern_02: "Rebuilt Thunderstrike Caern"
 building_thunderstrike_caern_02_desc: "This Shadow Lord caern is known for its martial prowess, being dedicated at least in part to the Typhon aspect of Grandfather Thunder. It is also known for its animosity towards Silver Fangs." 
  building_thunderstrike_caern_03: "Thunderstrike Caern"
 building_thunderstrike_caern_03_desc: "This Shadow Lord caern is known for its martial prowess, being dedicated at least in part to the Typhon aspect of Grandfather Thunder. It is also known for its animosity towards Silver Fangs." 


 building_type_songkran_maiden_caern_01: "Caern of the Songkran Maiden"
 building_type_songkran_maiden_caern_01_desc: "#F $building_songkran_maiden_caern_01_desc$#!"
 building_songkran_maiden_caern_01: "Burgeoning Caern of the Songkran Maiden"
 building_songkran_maiden_caern_01_desc: "TODO: Silverfang"
 building_songkran_maiden_caern_02: "Growing Caern of the Songkran Maiden"
 building_songkran_maiden_caern_02_desc: "TODO: Silverfang"
 building_songkran_maiden_caern_03: "Imposing Caern of the Songkran Maiden"
 building_songkran_maiden_caern_03_desc: "TODO: Silverfang" 








 building_type_draycott_castle_01: "Ruins of Draycott Castle"
 building_type_draycott_castle_01_desc: "#F $building_draycott_castle_01_desc$#!"
 building_draycott_castle_01: "Ruins of Draycott Castle"
 building_draycott_castle_01_desc: "Baron Draycott, a cruel man, punished the peasantry harshly at the merest suggestion of an infraction. An old man who wandered too close to the castle was whipped and then hung from the battlements as an example to others.\nThat night, every Get for miles gathered to avenge their Kinfolk. Storming the castle, they killed the baron — slowly — and then proceeded to take the castle apart, stone by stone and timber by timber. The foundations and many of the stones are there today, a testament to the will of the Garou."
  
 building_type_fir_chreig_01: "Fir Chreig"
 building_type_fir_chreig_01_desc: "#F $building_fir_chreig_01_desc$#!"
 building_fir_chreig_01: "Fir Chreig"
 building_fir_chreig_01_desc: "A chambered cairn and a low mound lie inside a stone circle. Ancient priests performed ceremonies here, and the Garou continue the practice. In times of the most dire need, the Theurges perform a ritual which transforms a stone from the northern avenue into a rock giant. The giant will fight, carry or perform other simple requests until the next sunrise or sunset; at that time, the stone shatters."
 
 building_type_loch_ness_01: "Loch Ness"
 building_type_loch_ness_01_desc: "#F $building_loch_ness_01_desc$#!"
 building_loch_ness_01: "Loch Ness"
 building_loch_ness_01_desc: "In Glen Mor lies Loch Ness — twenty-four miles long, a mile wide, bottomless (according to many) and bitterly cold.\nFianna from around the Highlands meet at the Loch every summer to feast, revel and hold contests of every kind. Besides the typical Fianna pursuits of music and storytelling competitions, visitors will find mountain climbing contests, foot races, spear throwing and wrestling. The most famous contest is the swim across the Loch, a near impossibility for normal humans and only slightly easier for Garou."
 
 building_type_yr_wyddfa_fawr_01: "Yr Wyddfa Fawr"
 building_type_yr_wyddfa_fawr_01_desc: "#F $building_yr_wyddfa_fawr_01_desc$#!"
 building_yr_wyddfa_fawr_01: "Yr Wyddfa Fawr"
 building_yr_wyddfa_fawr_01_desc: "The second highest peak in the British Isles, Yr Wyddfa Fawr rises above its neighbors in the range, overlooking green valleys and stony blasted plains of northern Gwynedd. Its Welsh name means “the great tomb,” and there are several legends behind the name. Some say a giant sleeps beneath the mountain; others suggest that some of King Arthur’s knights — or even King Arthur himself — rests there. Everyone knows it is a place of power."
     
 building_type_silver_tara_01: "Silver Tara"
 building_type_silver_tara_01_desc: "#F $building_silver_tara_01_desc$#!"
 building_silver_tara_01: "Silver Tara"
 building_silver_tara_01_desc: "Silver Tara, properly called Air-geteamhair, is the palace of the Ard Righ of the Fianna. No place, not even Bru na Boinne, is more sacred to the tribe.\nA powerful caern of Honor, Tara is the place where disputes are settled and honors are given. It’s thought that the original Tara was built several hundred years before the birth of Christ; some claim it was built with the aid of the Tuatha de Danaan.\nThe complex sits atop a hill rising to 200 feet above the surrounding plain, surrounded by seven great earth-and-stone ramparts. Each of the seven gates is faced with silver and hung with the heads of vanquished foes."
     
 building_type_wounded_unicorn_01: "Caern of the Wounded Unicorn"
 building_type_wounded_unicorn_01_desc: "#F $building_wounded_unicorn_01_desc$#!"
 building_wounded_unicorn_01: "Wounded Unicorn"
 building_wounded_unicorn_01_desc: "Perhaps the most renowned Caern of Healing in the land, the Wounded Unicorn's Children of Gaia caretakers welcome one and all to be soothed both mentally and physically.\nThis doesn't make them weak fools however, as a reckless group of Shadow Lords learned when trying to conquer the area."
     
 building_type_caern_vigilance_01: "Caern of Vigilance"
 building_type_caern_vigilance_01_desc: "#F $building_caern_vigilance_01_desc$#!"
 building_caern_vigilance_01: "Caern of Vigilance"
 building_caern_vigilance_01_desc: "Founded by the Silent Striders after the Beziers massacre during the Albigensian Crusade, this Caern soon swelled in power with the help of the bitter wraiths killed during the siege who blame vampires and mortals alike for the event."
  
 building_type_blood_fist_01: "Caern of the Blood Fist"
 building_type_blood_fist_01_desc: "#F $building_blood_fist_01_desc$#!"
 building_blood_fist_01: "Caern of the Blood Fist"
 building_blood_fist_01_desc: "Founded by the Fenrir after their victory against the Romans long ago, this caern is the center of their power in the Black Forest.\nAll those who enter to bask upon the engraved names of the Fenrir heroes of old must first win a challenge by combat."
  
 building_type_caern_sybil_01: "Caern of the Sybil"
 building_type_caern_sybil_01_desc: "#F $building_caern_sybil_01_desc$#!"
 building_caern_sybil_01: "Caern of the Sybil"
 building_caern_sybil_01_desc: "Once a respected Black Fury caern said to have influence over the Kings of Rome, this was taken from them by the Shadow Lords.\nIts new owners still continue the tradition of having a Theurge Sybil answers questions from visitors, at the cost of a favor owed to the Shadow Lords of course."
 
 building_type_iron_wood_01: "Caern of the Iron Wood"
 building_type_iron_wood_01_desc: "#F $building_iron_wood_01_desc$#!"
 building_iron_wood_01: "Caern of the Iron Wood"
 building_iron_wood_01_desc: "This caern stands where a group a Christian knights tried to disrupt a Pagan ceremony and were slaughtered by the spirits standing guard.\nFenrir now use it as a base to plan counterattacks against the encroachment of the Church on the Baltic."

 building_type_white_nights_01: "Caern of the White Nights"
 building_type_white_nights_01_desc: "#F $building_white_nights_01_desc$#!"
 building_white_nights_01: "Caern of the White Nights"
 building_white_nights_01_desc: "Far beyond most humans settlements, this Red Talon caern has gained prominence for being the site where the prophecies of shadows were revealed.\nIt is also known to be a prized place for the spirit of $glossary_helios$ and visitors often spend long hours basking in his rejuvenating light."
  
 building_type_bygone_visions_01: "Caern of the Bygone Visions"
 building_type_bygone_visions_01_desc: "#F $building_bygone_visions_01_desc$#!"
 building_bygone_visions_01: "Caern of the Bygone Visions"
 building_bygone_visions_01_desc: "The most powerful (and well defended) caern of the Black Furies is one of the few places where the Wyld is running free.\nOpening new glens of this type has always been a dream of the warrior-women of the island, in the hopes of returning the world to its primal state."
 

 
 building_type_caern_grey_rock_01: "Caern of the Grey Rock"
 building_type_caern_grey_rock_01_desc: "#F $building_caern_grey_rock_01_desc$#!"
 building_caern_grey_rock_01: "Caern of the Grey Rock"
 building_caern_grey_rock_01_desc: "Nestled deep into the mountains, this Silent Strider caern managed to avoid becoming a collateral to the ferocious war mages are waging in this area.\nSince this first alert, its defenders are more prepared than ever."

 building_type_caern_enchanted_enclosure_01: "Caern of the Enchanted Enclosure"
 building_type_caern_enchanted_enclosure_01_desc: "#F $building_caern_enchanted_enclosure_01_desc$#!"
 building_caern_enchanted_enclosure_01: "Caern of the Enchanted Enclosure"
 building_caern_enchanted_enclosure_01_desc: "Considered as the most powerful Caern in France, this seemingly unassuming locale bristles with power, mostly coming from its association with Faeries and the Arthurian legends.\nIt was once more powerful when still tied to its twin caern but this was lost when said caern was destroyed by the Lhiannan vampire Magda's lineage."

 building_type_caern_black_tumulus_01: "Caern of the Black Tumulus"
 building_type_caern_black_tumulus_01_desc: "#F $building_caern_black_tumulus_01_desc$#!"
 building_caern_black_tumulus_01: "Caern of the Black Tumulus"
 building_caern_black_tumulus_01_desc: "The last stronghold of the Get of Fenris in France is still strong, but a pale shadow of their former glory nonetheless.\nThose who underestimate their determination to regain their past prestige will still meet a quick and bloody end."
           
 building_type_caern_azure_basin_01: "Caern of the Azure Basin"
 building_type_caern_azure_basin_01_desc: "#F $building_caern_azure_basin_01_desc$#!"
 building_caern_azure_basin_01: "Caern of the Azure Basin"
 building_caern_azure_basin_01_desc: "This isolated caern found in a small cave is hard to access, even from the sea. Beautiful and powerful in equal measure however, it has long been treasured by the Black Furies who discovered it while following the Greeks colonists a long time ago."
            
 building_type_caern_amber_mount_01: "Caern of the Amber Mount"
 building_type_caern_amber_mount_01_desc: "#F $building_caern_amber_mount_01_desc$#!"
 building_caern_amber_mount_01: "Caern of the Amber Mount"
 building_caern_amber_mount_01_desc: "Named after the rich copper veins running through it, this caern is seen by its Black Furies holders as sacred for Aphrodite, a goddess often associated with this mineral."
            
 building_type_underground_forum_caern_01: "Caern of the Underground Forum"
 building_type_underground_forum_caern_01_desc: "#F Hidden below ancient (and forgotten) Lugdunum, this caern lies at the connecting point between multiple ley lines of considerable power.#!"
 building_underground_forum_caern_01: "Caern of the Underground Forum"
 building_underground_forum_caern_01_desc: "$building_type_underground_forum_caern_01_desc$"


 building_type_spirit_stone_01: "Spirit Stone Caern"
 building_type_spirit_stone_01_desc: "#F The first Uktena caern outside of their homelands, located in a remote village of the Siberian taiga. While still very isolationist, its occupants have started accepting Stargazer visitors.#!"
 building_spirit_stone_01: "Spirit Stone Caern"
 building_spirit_stone_01_desc: "$building_type_spirit_stone_01_desc$" 
 

 
 building_type_brooding_sky_01: "Brooding Sky Caern"
 building_type_brooding_sky_01_desc: "#F This Shadow Lord caern, while respected for its strength and wisdom, is also known to emphasize the worst aspects of this tribe. They are secretive, reluctant to cooperate and always seemingly hiding something for their own gain.#!"
 building_brooding_sky_01: "Brooding Sky Caern"
 building_brooding_sky_01_desc: "$building_type_brooding_sky_01_desc$" 
 
 building_type_falling_water_01: "Falling Water Caern"
 building_type_falling_water_01_desc: "#F This Red Talon caern, located in a glade deep in the forests, is less prestigious than its counterparts. However, being consecrated as a caern of visions gives it a respected place in the current prophetical mood of the tribe.#!"
 building_falling_water_01: "Falling Water Caern"
 building_falling_water_01_desc: "$building_type_falling_water_01_desc$" 
 
 building_type_crystal_mind_caern_01: "Crystal Mind Caern"
 building_type_crystal_mind_caern_01_desc: "#F One of the most powerful Stargazer caerns, the Crystal Mind is unique in its consecration as both wisdom and enigmas. Open to visitors from other tribes, its renown is known far and wide despite its remote location.#!"
 building_crystal_mind_caern_01: "Crystal Mind Caern"
 building_crystal_mind_caern_01_desc: "$building_type_crystal_mind_caern_01_desc$" 
 
 building_type_siberian_wilds_caern_01: "Siberian Wilds Caern"
 building_type_siberian_wilds_caern_01_desc: "#F Located deep within the arctic northeast, this place of power is home to a tribe of werewolves coming from far away, a place not yet known (or forgotten) by the rest of the Garou Nation.#!"
 building_siberian_wilds_caern_01: "Siberian Wilds Caern"
 building_siberian_wilds_caern_01_desc: "$building_type_siberian_wilds_caern_01_desc$" 
 
 building_type_mother_peach_trees_01: "Mother of Peach Trees Caern"
 building_type_mother_peach_trees_01_desc: "#F One of the most respected caerns of mainland Asia, the Mother of Peach Trees is home to a court known for its shrewd behavior and willful disposition. Their detractors often point out their isolationist tendencies as a critical flaw nonetheless.#!"
 building_mother_peach_trees_01: "Mother of Peach Trees Caern"
 building_mother_peach_trees_01_desc: "$building_type_mother_peach_trees_01_desc$" 
  
 building_type_suzhou_creek_caern_01: "Suzhou Creek Caern"
 building_type_suzhou_creek_caern_01_desc: "#F The home of the Boli Zouhisze is a powerful caern in its own right. Isolated and shunned by the Beast Courts as they are though, they don't see many visitors outside of their tribe.#!"
 building_suzhou_creek_caern_01: "Suzhou Creek Caern"
 building_suzhou_creek_caern_01_desc: "$building_type_suzhou_creek_caern_01_desc$" 
  
 building_type_rock_three_kingdoms_01: "Rock of the Three Kingdoms"
 building_type_rock_three_kingdoms_01_desc: "#F This caern is a rocky formation in the Sierra del Marabón. It has long served as a place for Garou to meet and overcome their differences and remember that we all serve Gaia first and foremost. Tribes have ratified many treaties at this site.#!"
 building_rock_three_kingdoms_01: "Rock of the Three Kingdoms"
 building_rock_three_kingdoms_01_desc: "$building_type_rock_three_kingdoms_01_desc$" 
  
 building_type_arkwasiye_caern_01: "Arkwasiye Caern"
 building_type_arkwasiye_caern_01_desc: "#F This caern lies in a cleft of rock just below the ridge of Arkwasiye Pass. Spirits of War and Cold are common here, but perhaps most notable are the strange Englings known as Arkwasiye Thundereggs that inhabit the area.#!"
 building_arkwasiye_caern_01: "Arkwasiye Caern"
 building_arkwasiye_caern_01_desc: "$building_type_arkwasiye_caern_01_desc$" 
  
 building_type_tullu_demtu_01: "Tullu Demtu Caern"
 building_type_tullu_demtu_01_desc: "#F Bird and War Spirits are common sights at this caern. The Silent Striders who guard it know a special rite unique to this caern called the Rite of $glossary_luna$'' Eye. With it, one looking out from the rocky outcroppings of this mountain caern can see impossible distances.#!"
 building_tullu_demtu_01: "Tullu Demtu Caern"
 building_tullu_demtu_01_desc: "$building_type_tullu_demtu_01_desc$" 
        
 building_type_gish_abbai_caern_01: "Gish Abbai Caern"
 building_type_gish_abbai_caern_01_desc: "#F Even humans have long felt the intense power of this place, and legends claim the spring marks the spot where the first humans were driven out of Eden in the book of Genesis. The waters of Gish Abai have miraculous healing properties that have made this caern an irreplaceable treasure for the Garou. The caern is positively thick with spirits of Healing and Water elementals.#!"
 building_gish_abbai_caern_01: "Gish Abbai Caern"
 building_gish_abbai_caern_01_desc: "$building_type_gish_abbai_caern_01_desc$" 
         
 building_type_baba_yaga_stone_01: "Baba Yaga Stone Caern"
 building_type_baba_yaga_stone_01_desc: "#F This rock formation resembles a huge human head, complete with a crone’s hooked nose. A path to Erebus appears in the Penumbra near the caern during on the first night of each new moon. The Shadow Lords and Red Talons maintain an uneasy truce, taking turns guarding and making use of the caern for a month at a time. Despite the wisdom aspect of this caern, it attracts a number of trickster spirits and faeries.#!"
 building_baba_yaga_stone_01: "Baba Yaga Stone Caern"
 building_baba_yaga_stone_01_desc: "$building_type_baba_yaga_stone_01_desc$" 


 building_type_masculine_dignity_01: "Masculine Dignity"
 building_type_masculine_dignity_01_desc: "#F This rock formation looks like a male organ standing upright on a cliff. Local humans have long come here for fertility rituals of all kinds. Although it is not a caern, Kinfolk who successfully breed in the stone's shadow are much more likely to give birth to a $glossary_fera$.#!"
 building_masculine_dignity_01: "Masculine Dignity"
 building_masculine_dignity_01_desc: "$building_type_masculine_dignity_01_desc$" 
 increased_fera_fertility_desc: "[GetTrait('kinfolk').GetName(GetNullCharacter)] children will always become a $glossary_fera$ on adulthood."

 building_type_lake_moutniy_caern_01: "Lake Moutniy Caern"
 building_type_lake_moutniy_caern_01_desc: "#F This small mountain lake is populated by Spirits of Peace, Calm, and Water elementals. Nomadic ancestor spirits often pass through the caern on their way to other destinations.#!"
 building_lake_moutniy_caern_01: "Lake Moutniy Caern"
 building_lake_moutniy_caern_01_desc: "$building_type_lake_moutniy_caern_01_desc$" 
 
 building_type_chimtarga_peak_caern_01: "Chimtarga Peak Caern"
 building_type_chimtarga_peak_caern_01_desc: "#F War and Ancestor Spirits guard this caern and discourage anyone — human, Garou, or otherwise — from climbing to its peak. These spirits reward those who overcome its challenges for the first time by replenishing all their Willpower.#!"
 building_chimtarga_peak_caern_01: "Chimtarga Peak Caern"
 building_chimtarga_peak_caern_01_desc: "$building_type_chimtarga_peak_caern_01_desc$" 
  
 building_type_three_gorges_caern_01: "Three Gorges Caern"
 building_type_three_gorges_caern_01_desc: "#F This Stargazer caern is known for its hospitably to outsiders. This has made it the de facto place for handling issues for the tribe all over China, as outside help can often be sought here.#!"
 building_three_gorges_caern_01: "Three Gorges Caern"
 building_three_gorges_caern_01_desc: "$building_type_three_gorges_caern_01_desc$" 
  








 #####Duchy Buildings
 building_type_caern_rage_01: "Caern of $glossary_rage$"
 building_type_caern_rage_01_desc: "#F A Caern dedicated to the pursuit of war, where werewolves and kinfolk are constantly on the lookout for new worthy battles to be fought.#!"
 building_caern_rage_01: "Burgeoning Caern of $glossary_rage$"
 building_caern_rage_01_desc: "A growing Caern with skilled, if few, fighters."
 building_caern_rage_02: "Small Caern of $glossary_rage$"
 building_caern_rage_02_desc: "A small Caern of Rage, where the sound of training can be heard day after day.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_rage_03: "Medium Caern of $glossary_rage$"
 building_caern_rage_03_desc: "Spirits of war and pain have nested in this Caern, lending their considerable expertise to the werewolves here.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_rage_04: "Large Caern of $glossary_rage$"
 building_caern_rage_04_desc: "Under the guidance of their elders, a new generation of warriors will be born here.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_rage_05: "Massive Caern of $glossary_rage$"
 building_caern_rage_05_desc: "One of the most impressive Caerns in the area, where war is an art and battle a commodity to be sought.$POD_fera_requirements_development_below_t5_ducal$"

 building_type_caern_leadership_01: "Caern of Leadership"
 building_type_caern_leadership_01_desc: "#F A Caern dedicated to the unity of the tribe, drawing many packs from different backgrounds to it.#!"
 building_caern_leadership_01: "Burgeoning Caern of Leadership"
 building_caern_leadership_01_desc: "A strong leader might be born here, but it is yet too small of a place for such ambitions."
 building_caern_leadership_02: "Small Caern of Leadership"
 building_caern_leadership_02_desc: "Reminding your lessers of their duties is a task that must never be put aside.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_leadership_03: "Medium Caern of Leadership"
 building_caern_leadership_03_desc: "A pack is only as strong as its alpha. A Caern is only as strong as its king.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_leadership_04: "Large Caern of Leadership"
 building_caern_leadership_04_desc: "If leadership talents can be acquired, this is the place to seek.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_leadership_05: "Massive Caern of Leadership"
 building_caern_leadership_05_desc: "When everyone knows their duty, the tribe prospers under wise and strong leadership.$POD_fera_requirements_development_below_t5_ducal$"

 building_type_caern_will_01: "Caern of Will"
 building_type_caern_will_01_desc: "#F A Caern dedicated to the betterment of the tribe, by means mundane and otherwise.#!"
 building_caern_will_01: "Burgeoning Caern of Will"
 building_caern_will_01_desc: "A place where werewolves try to understand their role in the current world."
 building_caern_will_02: "Small Caern of Will"
 building_caern_will_02_desc: "Tentative trade with neighboring communities is alleviating the precarious isolation of the Caern.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_will_03: "Medium Caern of Will"
 building_caern_will_03_desc: "An Ancestor spirit has blessed this Caern, bringing valuable lessons about the past and the future.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_will_04: "Large Caern of Will"
 building_caern_will_04_desc: "An earth elemental protects this Caern, pleased with the stoic resolve of its inhabitants.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_will_05: "Massive Caern of Will"
 building_caern_will_05_desc: "Subtly integrated into its surroundings, this Caern commands the respect, and tribute, of the whole region.$POD_fera_requirements_development_below_t5_ducal$"

 building_type_caern_enigmas_01: "Caern of Enigmas"
 building_type_caern_enigmas_01_desc: "#F A Caern dedicated to the most subtle arts of the Garou, often favored by the cunning Shadow Lords.#!"
 building_caern_enigmas_01: "Burgeoning Caern of Enigmas"
 building_caern_enigmas_01_desc: "Tricks and illusions are found aplenty here, making the young cubs learn by example the value of a more subtle approach."
 building_caern_enigmas_02: "Small Caern of Enigmas"
 building_caern_enigmas_02_desc: "The Elders of this Caern know some enigmas that can leave you pondering the answer for weeks. If there is even an answer at all.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_enigmas_03: "Medium Caern of Enigmas"
 building_caern_enigmas_03_desc: "A Chimerling spirit has blessed this Caern, pleased to see the cunning at work here.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_enigmas_04: "Large Caern of Enigmas"
 building_caern_enigmas_04_desc: "Shadows obfuscate this Caern, the result of friendly spirits congregating to defend and observe its cunning inhabitants.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_enigmas_05: "Massive Caern of Enigmas"
 building_caern_enigmas_05_desc: "Plots that could even leave a vampire puzzled are hatched here, challenging the reputation of the werewolves as mindless brutes.$POD_fera_requirements_development_below_t5_ducal$"

 building_type_caern_wisdom_01: "Caern of Wisdom"
 building_type_caern_wisdom_01_desc: "#F A peaceful Caern in a world ravaged by war, a very useful oasis for the spiritually weakened werewolves.#!"
 building_caern_wisdom_01: "Burgeoning Caern of Wisdom"
 building_caern_wisdom_01_desc: "Rest for the soul and the body is provided here. A rare act of compassion in an unforgiving world."
 building_caern_wisdom_02: "Small Caern of Wisdom"
 building_caern_wisdom_02_desc: "The teachings of this Caern are renowned as wise and worthy of consideration in the whole region.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_wisdom_03: "Medium Caern of Wisdom"
 building_caern_wisdom_03_desc: "A sagacious Owl spirit has made this Caern its home, enigmatically watching its inhabitants from above.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_wisdom_04: "Large Caern of Wisdom"
 building_caern_wisdom_04_desc: "Teachings, debates, healing... all manners of spiritual help can be found here.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_wisdom_05: "Massive Caern of Wisdom"
 building_caern_wisdom_05_desc: "With such a prosperous Caern of Wisdom, errors like the War of Rage might hopefully be avoided in the future.$POD_fera_requirements_development_below_t5_ducal$"



 building_type_mokole_wallow_01: "Wallow"
 building_type_mokole_wallow_01_desc: "Wallow is a term used by the Mokolé to describe a home for themselves and other crocodilians or reptiles."
 building_mokole_wallow_01: "Burgeoning Wallow"
 building_mokole_wallow_01_desc: "Mokolé live much humbler lives than they did millennia ago. But home is still home."
 building_mokole_wallow_02: "Small Wallow"
 building_mokole_wallow_02_desc: "A place where lizards and kinfolk live in harmony, away from the prying eyes of the rest of the world.$POD_fera_requirements_development_below_t2_ducal$"
 building_mokole_wallow_03: "Medium Wallow"
 building_mokole_wallow_03_desc: "Ruined temples to forgotten gods in India and along the Nile, riverside fishing communities in China, isolated swamps and marshes; any of those has the potential for becoming a mighty Wallow for a Mokolé community.$POD_fera_requirements_development_below_t3_ducal$"
 building_mokole_wallow_04: "Large Wallow"
 building_mokole_wallow_04_desc: "A true temple to the Lizard Kings, hidden from the sight of the so called civilizations of mortals.$POD_fera_requirements_development_below_t4_ducal$"
 building_mokole_wallow_05: "Massive Wallow"
 building_mokole_wallow_05_desc: "Mokolé's Dreams speak to them of past eons of saurian supremacy where their ancestors dwelled in herpetological luxury. This Wallow is thus a dream come true.$POD_fera_requirements_development_below_t5_ducal$"


 ####Werewolves
 building_type_werewolf_hunting_party_01: "Werewolf Hunting Party"
 building_type_werewolf_hunting_party_01_desc: "#F There are always some humans trying to encroach on your land. And there are always eager cubs ready to claim easy glory.#!"
 building_werewolf_hunting_party_01: "Small Werewolf Hunting Party"
 building_werewolf_hunting_party_01_desc: "A simple patrol, removing the most egregious of humans' encroachment in your land."
 building_werewolf_hunting_party_02: "Medium Werewolf Hunting Party"
 building_werewolf_hunting_party_02_desc: "The eager cubs of the tribe hone their skills on the unwise humans roaming close to your Sept.$POD_fera_requirements_development_below_t2$"
 building_werewolf_hunting_party_03: "Large Werewolf Hunting Party"
 building_werewolf_hunting_party_03_desc: "Humans fear the wolves for good reason. You won't let their so called 'civilization' run rampant here.$POD_fera_requirements_development_below_t3$"

 building_type_werewolf_scouting_party_01: "Werewolf Scouting Party"
 building_type_werewolf_scouting_party_01_desc: "#F Cubs go through their First Change all the time, and they need to be found. That's the task of these skilled trackers.#!"
 building_werewolf_scouting_party_01: "Small Werewolf Scouting Party"
 building_werewolf_scouting_party_01_desc: "One or two skilled trackers, barely enough to cover the surrounding villages."
 building_werewolf_scouting_party_02: "Medium Werewolf Scouting Party"
 building_werewolf_scouting_party_02_desc: "This pack of skilled trackers cover a wide area, looking for any cubs to help through their First Change.$POD_fera_requirements_development_below_t2$"
 building_werewolf_scouting_party_03: "Large Werewolf Scouting Party"
 building_werewolf_scouting_party_03_desc: "Thanks to your numerous scouting parties, very few cubs escape your gaze in this area. Their rescue grows the tribe steadily.$POD_fera_requirements_development_below_t3$"

 building_type_werewolf_training_grounds_01: "Werewolf Training Grounds"
 building_type_werewolf_training_grounds_01_desc: "#F Kinfolk must be trained if they are to be useful for the Sept.#!"
 building_werewolf_training_grounds_01: "Small Werewolf Training Grounds"
 building_werewolf_training_grounds_01_desc: "Kinfolk learn the basics of battle here. Enough to know where the pointy end is."
 building_werewolf_training_grounds_02: "Medium Werewolf Training Grounds"
 building_werewolf_training_grounds_02_desc: "They will never be as fearsome as a Werewolf. But they try their hardest.$POD_fera_requirements_development_below_t2$"
 building_werewolf_training_grounds_03: "Large Werewolf Training Grounds"
 building_werewolf_training_grounds_03_desc: "Not many truly understand warfare. But thanks to your peerless instructors, your [GetTrait('kinfolk').GetName(GetNullCharacter)] soon will.$POD_fera_requirements_development_below_t3$"

 building_type_werewolf_warden_01: "Werewolf Keeper"
 building_type_werewolf_warden_01_desc: "#F [GetTrait('kinfolk').GetName(GetNullCharacter)] are crucial for the future of the tribe. Their safety is more important than their liberties.#!"
 building_werewolf_warden_01: "Lax Werewolf Keeper"
 building_werewolf_warden_01_desc: "A friendly and gregarious keeper doesn't make for the best protector, but it's a start."
 building_werewolf_warden_02: "Stern Werewolf Keeper"
 building_werewolf_warden_02_desc: "A rough and sometimes coarse elder, making sure to keep the foolish [GetTrait('kinfolk').GetName(GetNullCharacter)] in line.$POD_fera_requirements_development_below_t2$"
 building_werewolf_warden_03: "Harsh Werewolf Keeper"
 building_werewolf_warden_03_desc: "They can't move a finger without him knowing about it. And disapproving of it.$POD_fera_requirements_development_below_t3$"

 building_type_werewolf_raiding_party_01: "Werewolf Raiding Party"
 building_type_werewolf_raiding_party_01_desc: "#F Werewolves are feared for a reason. That reason being their unpredictable and deadly attacks against any perceived foe.#!"
 building_werewolf_raiding_party_01: "Small Werewolf Raiding Party"
 building_werewolf_raiding_party_01_desc: "A small group of skilled fighters, enough to keep the surrounding area fearing the lurking wolves."
 building_werewolf_raiding_party_02: "Medium Werewolf Raiding Party"
 building_werewolf_raiding_party_02_desc: "Several packs are roaming the countryside, attacking any threatening group before it can organize itself.$POD_fera_requirements_development_below_t2$"
 building_werewolf_raiding_party_03: "Large Werewolf Raiding Party"
 building_werewolf_raiding_party_03_desc: "Fear the wolves howling in the night. Pray they don't come for you, then realize how futile of an act it was.$POD_fera_requirements_development_below_t3$"

 building_type_amazon_camp_01: "Amazon Camp"
 building_type_amazon_camp_01_desc: "#F The youngest daughters of the tribe want to prove themselves with blood and fury.#!"
 building_amazon_camp_01: "Small Amazon Camp"
 building_amazon_camp_01_desc: "The warrior women of Gaia are a terrible sight to behold, clearly the wrath of the Mother herself."
 building_amazon_camp_02: "Amazon Camp"
 building_amazon_camp_02_desc: "$building_amazon_camp_01_desc$$POD_fera_requirements_development_below_t2$"
 building_amazon_camp_03: "Large Amazon Camp"
 building_amazon_camp_03_desc: "$building_amazon_camp_01_desc$$POD_fera_requirements_development_below_t3$"

 building_type_scavengers_01: "Scavengers"
 building_type_scavengers_01_desc: "#F The resourceful Bone Gnawers let no good thing go to waste, especially coming from their fallen foes.#!"
 building_scavengers_01: "Few Scavengers"
 building_scavengers_01_desc: "The resourceful Bone Gnawers let no good thing go to waste, especially coming from their fallen foes."
 building_scavengers_02: "Scavengers"
 building_scavengers_02_desc: "$building_scavengers_01_desc$$POD_fera_requirements_development_below_t2$"
 building_scavengers_03: "Many Scavengers"
 building_scavengers_03_desc: "$building_scavengers_01_desc$$POD_fera_requirements_development_below_t3$"

 building_type_black_spiral_01: "Black Spiral"
 building_type_black_spiral_01_desc: "#F Dance down the spiral. Dance and be free. Dance away your sanity and be reborn anew.#!"
 building_black_spiral_01: "Minor Black Spiral"
 building_black_spiral_01_desc: "Dance down the spiral. Dance and be free. Dance away your sanity and be reborn anew."
 building_black_spiral_02: "Black Spiral"
 building_black_spiral_02_desc: "$building_black_spiral_01_desc$$POD_fera_requirements_development_below_t2$"
 building_black_spiral_03: "Major Black Spiral"
 building_black_spiral_03_desc: "$building_black_spiral_01_desc$$POD_fera_requirements_development_below_t3$"

 building_type_gaia_refuge_01: "Gaia's Refuge"
 building_type_gaia_refuge_01_desc: "#F The Children provide Gaia's mercy to the downtrodden, be they from other tribes or from human outcasts.#!"
 building_gaia_refuge_01: "Small Gaia's Refuge"
 building_gaia_refuge_01_desc: "The Children provide Gaia's mercy to the downtrodden, be they from other tribes or from human outcasts."
 building_gaia_refuge_02: "Gaia's Refuge"
 building_gaia_refuge_02_desc: "$building_gaia_refuge_01_desc$$POD_fera_requirements_development_below_t2$"
 building_gaia_refuge_03: "Large Gaia's Refuge"
 building_gaia_refuge_03_desc: "$building_gaia_refuge_01_desc$$POD_fera_requirements_development_below_t3$"


 building_type_bard_gathering_01: "Bards' Gathering"
 building_type_bard_gathering_01_desc: "#F Where tall tales are shared in good company, cementing the unity of the tribe in unbridled reveling.#!"
 building_bard_gathering_01: "Small Bards' Gathering"
 building_bard_gathering_01_desc: "Where tall tales are shared in good company, cementing the unity of the tribe in unbridled reveling."
 building_bard_gathering_02: "Bards' Gathering"
 building_bard_gathering_02_desc: "$building_bard_gathering_01_desc$$POD_fera_requirements_development_below_t2$"
 building_bard_gathering_03: "Large Bards' Gathering"
 building_bard_gathering_03_desc: "$building_bard_gathering_01_desc$$POD_fera_requirements_development_below_t3$"

 building_type_boderia_ritual_stones_01: "Boderia Ritual Stones"
 building_type_boderia_ritual_stones_01_desc: "#F The Boderia are charged with honoring the dead and ensuring they bring no harm to the living.#!"
 building_boderia_ritual_stones_01: "Small Boderia Ritual Stones"
 building_boderia_ritual_stones_01_desc: "The Boderia are charged with honoring the dead and ensuring they bring no harm to the living."
 building_boderia_ritual_stones_02: "Boderia Ritual Stones"
 building_boderia_ritual_stones_02_desc: "$building_boderia_ritual_stones_01_desc$$POD_fera_requirements_development_below_t2$"
 building_boderia_ritual_stones_03: "Large Boderia Ritual Stones"
 building_boderia_ritual_stones_03_desc: "$building_boderia_ritual_stones_01_desc$$POD_fera_requirements_development_below_t3$"


 building_type_heroes_summit_01: "Heroes Summit"
 building_type_heroes_summit_01_desc: "#F The Sagas are not only in the past. As long as Ragnarok looms, the heroes of Fenris will rise to the challenge.#!"
 building_heroes_summit_01: "Insignificant Heroes Summit"
 building_heroes_summit_01_desc: "The Sagas are not only in the past. As long as Ragnarok looms, the heroes of Fenris will rise to the challenge."
 building_heroes_summit_02: "Heroes Summit"
 building_heroes_summit_02_desc: "$building_heroes_summit_01_desc$$POD_fera_requirements_development_below_t2$"
 building_heroes_summit_03: "Great Heroes Summit"
 building_heroes_summit_03_desc: "$building_heroes_summit_01_desc$$POD_fera_requirements_development_below_t3$"

 building_type_city_wolves_01: "City Wolves"
 building_type_city_wolves_01_desc: "#F The Warders of Men work with humanity, trying to steer it on the path to shared prosperity.#!"
 building_city_wolves_01: "Insignificant City Wolves"
 building_city_wolves_01_desc: "The Warders of Men work with humanity, trying to steer it on the path to shared prosperity."
 building_city_wolves_02: "City Wolves"
 building_city_wolves_02_desc: "$building_city_wolves_01_desc$"
 building_city_wolves_03: "Influential City Wolves"
 building_city_wolves_03_desc: "$building_city_wolves_01_desc$"

 building_type_uktena_hunter_lodge_01: "Hunter's Lodge"
 building_type_uktena_hunter_lodge_01_desc: "#F Many distrust the secretive ways of the Uktena. But even their staunchest enemy wouldn't contest their unparalleled experience as hunters of the Wyrm and its servants.#!"
