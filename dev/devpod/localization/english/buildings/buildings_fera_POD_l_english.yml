l_english:

 building_type_hanshii_arena_01:0 "Hanshii Arena"
 building_type_hanshii_arena_01_desc:0 "#F A staple of Bastet culture, Hanshii are ritual combats used for entertainment or deciding territorial rights. These contests may be riddle games, formal duels or fangs and claws warfare.#!"
 building_hanshii_arena_01:0 "Small Hanshii Arena"
 building_hanshii_arena_01_desc:0 "A small site reserved for Hanshii challenges."
 building_hanshii_arena_02:0 "Respectable Hanshii Arena"
 building_hanshii_arena_02_desc:0 "Challenges of all types happen here in this well protected area."
 building_hanshii_arena_03:0 "Large Hanshii Arena"
 building_hanshii_arena_03_desc:0 "Bastet congregate here to eagerly watch contestants from all over the world stake their claim in the offered challenges."
 POD_needs_hanshii_arbiter:0 "#X You need to employ a [GetCourtPositionType('hanshii_arbiter_court_position').GetName()].#!"
 POD_needs_hanshii_arbiter_2:0 "#X You need to employ a [GetCourtPositionType('hanshii_arbiter_court_position').GetName()] with Good Aptitude or above.#!"
 POD_needs_hanshii_arbiter_3:0 "#X You need to employ a [GetCourtPositionType('hanshii_arbiter_court_position').GetName()] with Excellent Aptitude or above.#!"
 
 building_type_altar_seline_01:0 "Altar of Seline"
 building_type_altar_seline_01_desc:0 "#F Gaia's sympathetic sister, the Moon, obviously favors the werecats and considers them her finest creations. She birthed the Changing Breeds as a gift to the Earth and her body is said to be the final sanctuary for all Bastet.#!"
 building_altar_seline_01:0 "Small Altar of Seline"
 building_altar_seline_01_desc:0 "The mother of catkind watches fondly over her proud children even in the smallest of abode."
 building_altar_seline_02:0 "Respectable Altar of Seline"
 building_altar_seline_02_desc:0 "Few truly understand the capricious Moon Goddess but the Bastet still feel her warmth reaching them when standing in this sacred place."
 building_altar_seline_03:0 "Large Altar of Seline"
 building_altar_seline_03_desc:0 "All praise to the Lady of the Moon, the true patron of cats everywhere. Many of her children gather to pay her hommage here."
 POD_needs_seline_oracle:0 "#X You need to employ a [GetCourtPositionType('seline_oracle_court_position').GetName()].#!"
 POD_needs_seline_oracle_2:0 "#X You need to employ a [GetCourtPositionType('seline_oracle_court_position').GetName()] with Good Aptitude or above.#!"
 POD_needs_seline_oracle_3:0 "#X You need to employ a [GetCourtPositionType('seline_oracle_court_position').GetName()] with Excellent Aptitude or above.#!"
 
 building_type_taghairm_gathering_01:0 "Taghairm Gathering"
 building_type_taghairm_gathering_01_desc:0 "#F The Taghairm is a cat gathering often called to exchange information or pleasantries. Usually performed during the height of the full moon.#!"
 building_taghairm_gathering_01:0 "Small Taghairm Gathering"
 building_taghairm_gathering_01_desc:0 "A small area where Bastet gather to informally talk and play."
 building_taghairm_gathering_02:0 "Respectable Taghairm Gathering"
 building_taghairm_gathering_02_desc:0 "Specifically reserved for the Taghairm, these grounds host many a gathering of catkind."
 building_taghairm_gathering_03:0 "Large Taghairm Gathering"
 building_taghairm_gathering_03_desc:0 "A grand and well furnished area where Bastet from distant regions come to exchange information and knowledge with their local brethren."
 POD_needs_master_taghairm:0 "#X You need to employ a [GetCourtPositionType('master_taghairm_court_position').GetName()].#!"
 POD_needs_master_taghairm_2:0 "#X You need to employ a [GetCourtPositionType('master_taghairm_court_position').GetName()] with Good Aptitude or above.#!"
 POD_needs_master_taghairm_3:0 "#X You need to employ a [GetCourtPositionType('master_taghairm_court_position').GetName()] with Excellent Aptitude or above.#!"
 
 building_type_taklah_training_01:0 "Taklah Training Grounds"
 building_type_taklah_training_01_desc:0 "#F A Taklah is an all-werecat elite retinue gathered together for a common purpose.#!"
 building_taklah_training_01:0 "Small Taklah Training Grounds"
 building_taklah_training_01_desc:0 "The warriors of the Bastet are less renowned than their Garou cousins but only a fool would underestimate them still."
 building_taklah_training_02:0 "Respectable Taklah Training Grounds"
 building_taklah_training_02_desc:0 "Bastet are solitary creatures but, when a common purpose unites them, they work surprinsigly well together."
 building_taklah_training_03:0 "Large Taklah Training Grounds"
 building_taklah_training_03_desc:0 "The great felines inspire awe and respect in the minds of mortals. This Bastet Taklah will do the same to its enemies."
 POD_needs_warleader_taklah:0 "#X You need to employ a [GetCourtPositionType('warleader_taklah_court_position').GetName()].#!"
 POD_needs_warleader_taklah_2:0 "#X You need to employ a [GetCourtPositionType('warleader_taklah_court_position').GetName()] with Good Aptitude or above.#!"
 POD_needs_warleader_taklah_3:0 "#X You need to employ a [GetCourtPositionType('warleader_taklah_court_position').GetName()] with Excellent Aptitude or above.#!"
     
 
 
 
 
 
 
 
 