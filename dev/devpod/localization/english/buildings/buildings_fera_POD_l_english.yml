l_english:


 ####Kinfolk
 building_type_kinfolk_meeting_grounds_01: "Kinfolk Meeting Grounds"
 building_type_kinfolk_meeting_grounds_01_desc: "#F Where the ever important [GetTrait('kinfolk').GetName(GetNullCharacter)] of the nearby tribes gather, mingle with the local populace and, hopefully, plan the next generations of warriors.#!"
 building_kinfolk_meeting_grounds_01: "Small Kinfolk Meeting Grounds"
 building_kinfolk_meeting_grounds_01_desc: "A small area dedicated to the nearby [GetTrait('kinfolk').GetName(GetNullCharacter)]. Not much to look at, but it's home for them nonetheless."
 building_kinfolk_meeting_grounds_02: "Medium Kinfolk Meeting Grounds"
 building_kinfolk_meeting_grounds_02_desc: "Where [GetTrait('kinfolk').GetName(GetNullCharacter)] interact with each other and their surroundings, living their lives when not answering the tribe's call."
 building_kinfolk_meeting_grounds_03: "Large Kinfolk Meeting Grounds"
 building_kinfolk_meeting_grounds_03_desc: "The [GetTrait('kinfolk').GetName(GetNullCharacter)] are plentiful here, and well accommodated. There is even room for the next generation."

 building_type_kinfolk_healers_01: "Kinfolk Healers"
 building_type_kinfolk_healers_01_desc: "#F Herbal medicine and older secret skills, passed down from one generation of [GetTrait('kinfolk').GetName(GetNullCharacter)] to the other.#!"
 building_kinfolk_healers_01: "Kinfolk Healer Apprentices"
 building_kinfolk_healers_01_desc: "Having just started their journey, these healers are still valued by the tribe."
 building_kinfolk_healers_02: "Kinfolk Healers"
 building_kinfolk_healers_02_desc: "The tribe knows where to look when a remedy must be found for the most unlikely of diseases."
 building_kinfolk_healers_03: "Skilled Kinfolk Healers"
 building_kinfolk_healers_03_desc: "The warriors of the tribe plunge into the fray with no concern, knowing full well that they will be saved from death by these blessed individuals."

 building_type_kinfolk_militia_01: "Kinfolk Militia"
 building_type_kinfolk_militia_01_desc: "#F In time of need, every man, woman and child must be ready to protect their homes.#!"
 building_kinfolk_militia_01: "Small Kinfolk Militia"
 building_kinfolk_militia_01_desc: "Not really enough members to really scare a determined opponent, but better than nothing."
 building_kinfolk_militia_02: "Medium Kinfolk Militia"
 building_kinfolk_militia_02_desc: "A good enough number of warriors, ready to march to defend their home."
 building_kinfolk_militia_03: "Large Kinfolk Militia"
 building_kinfolk_militia_03_desc: "The tribe couldn't ask for a stronger group of determined warriors to have their backs in times of need."

 building_type_kinfolk_markets_01: "Kinfolk Markets"
 building_type_kinfolk_markets_01_desc: "#F Where the members of your extended tribe gather to barter and haggle over what is needed for the tribe.#!"
 building_kinfolk_markets_01: "Small Kinfolk Markets"
 building_kinfolk_markets_01_desc: "An informal place where [GetTrait('kinfolk').GetName(GetNullCharacter)] gather to barter among themselves."
 building_kinfolk_markets_02: "Medium Kinfolk Markets"
 building_kinfolk_markets_02_desc: "Some of the local populace has been allowed to come here, to trade with the tribe's [GetTrait('kinfolk').GetName(GetNullCharacter)]."
 building_kinfolk_markets_03: "Large Kinfolk Markets"
 building_kinfolk_markets_03_desc: "To the annoyance of some of the more traditionalist members of the tribe, your [GetTrait('kinfolk').GetName(GetNullCharacter)] are now an integral part of the local trade."

 building_type_kinfolk_bonfire_01: "Kinfolk Bonfire"
 building_type_kinfolk_bonfire_01_desc: "#F Where stories of the great deeds of your ancestors are shared with the next generation.#!"
 building_kinfolk_bonfire_01: "Small Kinfolk Bonfire"
 building_kinfolk_bonfire_01_desc: "Storytelling is an art, and gifted artists are rare in your tribe so far."
 building_kinfolk_bonfire_02: "Medium Kinfolk Bonfire"
 building_kinfolk_bonfire_02_desc: "Legends of old are told here, hopefully inspiring the legends of tomorrow."
 building_kinfolk_bonfire_03: "Large Kinfolk Bonfire"
 building_kinfolk_bonfire_03_desc: "The young gather to listen, the old gather to remember. The tribe unites."



 #####General Fera

 building_type_spiritual_sanctuary_01: "Spiritual Sanctuary"
 building_type_spiritual_sanctuary_01_desc: "#F Balance is slowly leaving this world due to the frenzy of the $glossary_triat$. Still, some areas endure, often protected by those spiritually gifted. #!"
 building_spiritual_sanctuary_01: "Small Spiritual Sanctuary"
 building_spiritual_sanctuary_01_desc: "A small but symbolic declaration of defiance from the dying Balance of this world."
 building_spiritual_sanctuary_02: "Spiritual Sanctuary"
 building_spiritual_sanctuary_02_desc: "Growth and decay, life and death, the cycle is following its natural course here."
 building_spiritual_sanctuary_03: "Major Spiritual Sanctuary"
 building_spiritual_sanctuary_03_desc: "Perfectly balanced, as all things should be."


 building_type_wyld_overgrowth_01: "$glossary_wyld$ Overgrowth"
 building_type_wyld_overgrowth_01_desc: "#F Stifled by the $glossary_weaver$ and attacked by the $glossary_wyrm$, Mother Nature takes her revenge in this place.#!"
 building_wyld_overgrowth_01: "Small $glossary_wyld$ Overgrowth"
 building_wyld_overgrowth_01_desc: "A small outcropping of untamed nature, pulsing and itching to prosper.$POD_fera_requirements_development_below_t1$"
 building_wyld_overgrowth_02: "$glossary_wyld$ Overgrowth"
 building_wyld_overgrowth_02_desc: "A beacon of unbridled and savage life, thriving and growing at a strong pace.$POD_fera_requirements_development_below_t2$"
 building_wyld_overgrowth_03: "Major $glossary_wyld$ Overgrowth"
 building_wyld_overgrowth_03_desc: "In this man versus wyld, the wyld always wins here.$POD_fera_requirements_development_below_t3$"


 building_type_weaver_domain_01: "$glossary_weaver$ Domain"
 building_type_weaver_domain_01_desc: "#F Towers rise, humanity multiplies, cities grow... the march of time will be the Weaver's march to triumph. #!"
 building_weaver_domain_01: "Small $glossary_weaver$ Domain"
 building_weaver_domain_01_desc: "An idea, a flash of inspiration or a strength of will; those little things can start the triumph of the Weaver.\n\n$POD_requirements_development_10$"
 building_weaver_domain_02: "$glossary_weaver$ Domain"
 building_weaver_domain_02_desc: "Tinkers, tools and trade, the sound of the future can be heard here.\n\n$POD_requirements_development_25$"
 building_weaver_domain_03: "Major $glossary_weaver$ Domain"
 building_weaver_domain_03_desc: "This is where nature is tamed and progress is made without any petty concerns to keep it down.\n\n$POD_requirements_development_50$"


 building_type_wyrm_taint_01: "$glossary_wyrm$-taint"
 building_type_wyrm_taint_01_desc: "#F Entropy and decay are a natural part of the cycle. But in the end, they aspire to devour all.#!"
 building_wyrm_taint_01: "Minor Taint"
 building_wyrm_taint_01_desc: "Damaged, cursed or barren land, the start of the $glossary_wyrm$'s victory and the defeat of Creation."
 building_wyrm_taint_02: "Serious Contamination"
 building_wyrm_taint_02_desc: "Death lurks in the shadows of life. Here, it actually hides completely."
 building_wyrm_taint_03: "$glossary_wyrm$-Blight"
 building_wyrm_taint_03_desc: "This is where hope goes to die, eaten by the unending hunger of primordial entropy."


 #####Caern Special Buildings


#TODO Silverfang: add better descriptions for multi lvl ones

 building_type_silbury_hill_01: "Silbury Hill"
 building_type_silbury_hill_01_desc: "#F $building_silbury_hill_01_desc$#!"
 building_silbury_hill_01: "Silbury Hill"
 building_silbury_hill_01_desc: "Silbury Hill is an enigma. The chalk mound, which stands over 130 feet high and covers nearly 6 acres, was built long before the Romans came. Fianna legends say a faerie king or worshipful tribesmen built the mound, but no one really knows for sure, as centuries of contemplation by mage and Garou have formed a caern of Enigmas.\nDuring the unrest of Stephen's reign, the Garou lost the caern; a powerful group of book-learned mages forced the local sept out with great magicks."
  

 building_type_protector_caern_01: "The Protector Caern"
 building_type_protector_caern_01_desc: "#F $building_protector_caern_01_desc$#!"
 building_protector_caern_01: "Crumbling Protector Caern"
 building_protector_caern_01_desc: "The House of Austere Howl claimed this caern two hundred years ago from a moribund Fianna sept. The caern lies in a small copse, far from any human settlement, and half a day's walk from Stonehenge.\nWhile divided by infighting and politics, it remains the strongest Silver Fang caern on the isles since the fall of the Great River one in London."
 building_protector_caern_02: "Rebuilt Protector Caern"
 building_protector_caern_02_desc: "The House of Austere Howl claimed this caern two hundred years ago from a moribund Fianna sept. The caern lies in a small copse, far from any human settlement, and half a day's walk from Stonehenge.\nWhile divided by infighting and politics, it remains the strongest Silver Fang caern on the isles since the fall of the Great River one in London."
 building_protector_caern_03: "The Protector Caern"
 building_protector_caern_03_desc: "The House of Austere Howl claimed this caern two hundred years ago from a moribund Fianna sept. The caern lies in a small copse, far from any human settlement, and half a day's walk from Stonehenge.\nWhile divided by infighting and politics, it remains the strongest Silver Fang caern on the isles since the fall of the Great River one in London."


 building_type_unshriven_zealot_01: "Caern of the Unshriven Zealot"
 building_type_unshriven_zealot_01_desc: "#F $building_unshriven_zealot_01_desc$#!"
 building_unshriven_zealot_01: "Caern of the Unshriven Zealot"
 building_unshriven_zealot_01_desc: "What is now known as Fearn Abbey was the first caern conquered by the Black Spiral Dancers soon after their return from the Wyrm's embrace. It has remained a place that the sane of mind avoid at all costs while the corrupted werewolves use it as their most powerful hive in Scotland.\nNo amount of purification, exorcism or other rituals can save this dreaded land."




 building_type_blood_sea_caern_01: "Blood of the Sea Caern"
 building_type_blood_sea_caern_01_desc: "#F $building_blood_sea_caern_01_desc$#!"
 building_blood_sea_caern_01: "Blood of the Sea Caern"
 building_blood_sea_caern_01_desc: "Perhaps the first Black Fury caern in the steppes, its location in an unpopulated region is fiercely guarded by its inhabitants. Other tribes are only allowed in through strict supervision."
 
 building_type_arctic_axe_caern_01: "Arctic Axe Caern"
 building_type_arctic_axe_caern_01_desc: "#F $building_arctic_axe_caern_01_desc$#!"
 building_arctic_axe_caern_01: "Forgotten Arctic Axe Caern"
 building_arctic_axe_caern_01_desc: "This caern of stamina dedicated to Boar is under control of the Get of Fenris. In a typical fashion for their tribe, they are known to be looking for a fight quickly enough, though their neighbors concede that they reserve their most powerful attacks for the Wyrm and its agents."
 building_arctic_axe_caern_02: "Restored Arctic Axe Caern"
 building_arctic_axe_caern_02_desc: "This caern of stamina dedicated to Boar is under control of the Get of Fenris. In a typical fashion for their tribe, they are known to be looking for a fight quickly enough, though their neighbors concede that they reserve their most powerful attacks for the Wyrm and its agents."
 building_arctic_axe_caern_03: "Arctic Axe Caern"
 building_arctic_axe_caern_03_desc: "This caern of stamina dedicated to Boar is under control of the Get of Fenris. In a typical fashion for their tribe, they are known to be looking for a fight quickly enough, though their neighbors concede that they reserve their most powerful attacks for the Wyrm and its agents." 

 building_type_red_cedar_01: "Red Cedar Caern"
 building_type_red_cedar_01_desc: "#F $building_red_cedar_01_desc$#!"
 building_red_cedar_01: "Red Cedar Caern"
 building_red_cedar_01_desc: "Built upon the climactic battle site against the Jaggling Dazbog, this caern is centered around a trunk tree where the name of each fallen Garou was inscribed. This legacy makes it one of the few multi-tribal caerns as every faction is present here to honor their fallen heroes." 


 building_type_ivory_dead_caern_01: "Caern of the Ivory Dead"
 building_type_ivory_dead_caern_01_desc: "#F $building_ivory_dead_caern_01_desc$#!"
 building_ivory_dead_caern_01: "Burgeoning Caern of the Ivory Dead"
 building_ivory_dead_caern_01_desc: "TODO: Silverfang"
 building_ivory_dead_caern_02: "Growing Caern of the Ivory Dead"
