l_english:
 building_type_true_jade_mines_01: "True Jade Mines"
 building_type_true_jade_mines_01_desc: "#flavor In The Age of Legends, when The Realm was still alive. (True) Jade was the most common of the Five Magical Materials found in the Creation. Heavily attuned to the Dragon-Touched, (White) Jade was used as the currency of the Realm. Now, in the World of Darkness, True Jade is rare, nearly absent. But this place contains deposits of the True Jade thanks to hard work of many $POD_splat_terrestrial_exalted_plural$.#!"
 building_true_jade_mines_01: "Small True Jade Mines"
 building_true_jade_mines_01_desc: "The deposit is large, but majority of it is inaccessible to your miners."
 true_jade_mines_01_effect_desc: "Every $POD_splat_terrestrial_exalted$ [ruler|E] in the same top [realm|E] will have access to [crafting_forging|E] [crafting_node|E] '$node_true_jade_loca$' adding a [modifier|E] based on the [artifact|E]'s type."
 building_true_jade_mines_02: "Medium True Jade Mines"
 building_true_jade_mines_02_desc: "We managed to struck one of bigger veins of True Jade here. But there is still much outside our range."
 true_jade_mines_02_effect_desc: "Every $POD_splat_terrestrial_exalted$ [ruler|E] in the same top [realm|E] will have access to [crafting_forging|E] [crafting_node|E] '$node_true_jade_loca$' adding 2 [modifiers|E] based on the [artifact|E]'s type."
 building_true_jade_mines_03: "Large True Jade Mines"
 building_true_jade_mines_03_desc: "Almost all True Jade hidden beneath surface is under our control and in our range, but there are some deposits outside it."
 true_jade_mines_03_effect_desc: "Every $POD_splat_terrestrial_exalted$ [ruler|E] in the same top [realm|E] will have access to [crafting_forging|E] [crafting_node|E] '$node_true_jade_loca$' adding 3 [modifiers|E] based on the [artifact|E]'s type."
 building_true_jade_mines_04: "True Jade Mines"
 building_true_jade_mines_04_desc: "A mine of legendary size, similar to ones found in the Age of Legends, all deposits of True Jade are accessible."
 true_jade_mines_04_effect_desc: "Every $POD_splat_terrestrial_exalted$ [ruler|E] in the same top [realm|E] will have access to [crafting_forging|E] [crafting_node|E] '$node_true_jade_loca$' adding 4 [modifiers|E] based on the [artifact|E]'s type and $POD_energy_essence$ storage."

 building_type_exalted_connections_to_merchants_01: "Connections to Merchants"
 building_type_exalted_connections_to_merchants_01_desc: "#flavor Even the most powerful man alive will bow to a merchant.#!"
 building_exalted_connections_to_merchants_01: "Minimal Connections to Merchants"
 building_exalted_connections_to_merchants_01_desc: "Rudimentary connections to local merchants have benn established, but out words take awfully long to travel."
 building_exalted_connections_to_merchants_02: "Minor Connections to Merchants"
 building_exalted_connections_to_merchants_02_desc: "Our conenctions to local merchants have grown to almost official levels."
 building_exalted_connections_to_merchants_03: "Moderate Connections to Merchants"
 building_exalted_connections_to_merchants_03_desc: "We have people designated to be a intermediary between us and local merchants."
 building_exalted_connections_to_merchants_04: "Significant Connections to Merchants"
 building_exalted_connections_to_merchants_04_desc: "We have whole ambasadors to local merchants, our words travel almost instantaneously."
 building_exalted_connections_to_merchants_05: "Extensive Connections to Merchants"
 building_exalted_connections_to_merchants_05_desc: "We have merged with local merchants, our communications cannot be disturbed anymore."

 building_type_exalted_connections_to_nobility_01: "Connections to Nobility"
 building_type_exalted_connections_to_nobility_01_desc: "#flavor To know people in power, is to be in power.#!"
 building_exalted_connections_to_nobility_01: "Minimal Connections to Nobility"
 building_exalted_connections_to_nobility_01_desc: "At least local nobility knows about our existence, somewhat."
 building_exalted_connections_to_nobility_02: "Minor Connections to Nobility"
 building_exalted_connections_to_nobility_02_desc: "Local nobility has growned somewhat interested in us, rudimentary message routes have been established"
 building_exalted_connections_to_nobility_03: "Moderate Connections to Nobility"
 building_exalted_connections_to_nobility_03_desc: "We became a full-blown partner to some of local nobles."
 building_exalted_connections_to_nobility_04: "Significant Connections to Nobility"
 building_exalted_connections_to_nobility_04_desc: "Our prestige and glory is known to all local nobles."
 building_exalted_connections_to_nobility_05: "Extensive Connections to Nobility"
 building_exalted_connections_to_nobility_05_desc: "Local People in power all know about us, and we know about them."

 building_type_exalted_connections_to_peasants_01: "Connections to Peasants"
 building_type_exalted_connections_to_peasants_01_desc: "#flavor Power often lies in the most numerous group.#!"
 building_exalted_connections_to_peasants_01: "Minimal Connections to Peasants"
 building_exalted_connections_to_peasants_01_desc: "Some of local peasants have became aware of our existence, and what we can provide."
 building_exalted_connections_to_peasants_02: "Minor Connections to Peasants"
 building_exalted_connections_to_peasants_02_desc: "More and More peasants have gathered around our people."
 building_exalted_connections_to_peasants_03: "Moderate Connections to Peasants"
 building_exalted_connections_to_peasants_03_desc: "We have became a important player in eyes of all local peasants."
 building_exalted_connections_to_peasants_04: "Significant Connections to Peasants"
 building_exalted_connections_to_peasants_04_desc: "You won't find a peasant that does not know something about us."
 building_exalted_connections_to_peasants_05: "Extensive Connections to Peasants"
 building_exalted_connections_to_peasants_05_desc: "These people will fight for us, even though they still don't understand our true magnificence."

 building_type_exalted_connections_to_clergy_01: "Connections to Clergy"
 building_type_exalted_connections_to_clergy_01_desc: "#flavor Belief is a strong tool in right hands.#!"
 building_exalted_connections_to_clergy_01: "Minimal Connections to Clergy"
 building_exalted_connections_to_clergy_01_desc: "We are Exalted, the choosen of Gods and even if we won't show them our true nature, that still opens some doors for us."
 building_exalted_connections_to_clergy_02: "Minor Connections to Clergy"
 building_exalted_connections_to_clergy_02_desc: "Some local Clergy have began to view us as messangers of God."
 building_exalted_connections_to_clergy_03: "Moderate Connections to Clergy"
 building_exalted_connections_to_clergy_03_desc: "Our little 'cult' among Clergy has grown to include vast number of them."
 building_exalted_connections_to_clergy_04: "Significant Connections to Clergy"
 building_exalted_connections_to_clergy_04_desc: "Almost all local Clergy view us as divine in nature, rightfully so."
 building_exalted_connections_to_clergy_05: "Extensive Connections to Clergy"
 building_exalted_connections_to_clergy_05_desc: "Our word is word of god."

 building_type_exalted_connections_to_militia_01: "Connections to Militia"
 building_type_exalted_connections_to_militia_01_desc: "#flavor People with swords are quite important to know about.#!"
 building_exalted_connections_to_militia_01: "Minimal Connections to Militia"
 building_exalted_connections_to_militia_01_desc: "Some rudimentary connections to local militia were established, though we still cannot move easily."
 building_exalted_connections_to_militia_02: "Minor Connections to Militia"
 building_exalted_connections_to_militia_02_desc: "We have people inside Militia, opening gates when needed is something we can do."
 building_exalted_connections_to_militia_03: "Moderate Connections to Militia"
 building_exalted_connections_to_militia_03_desc: "Many local guards have become used to our presence, though we still have to hide."
 building_exalted_connections_to_militia_04: "Significant Connections to Militia"
 building_exalted_connections_to_militia_04_desc: "Majority of local militia have grown to like us, we don't have much obstacles here anymore"
 building_exalted_connections_to_militia_05: "Extensive Connections to Militia"
 building_exalted_connections_to_militia_05_desc: "We can do whatever we want, and we don't attrack any special attention."

