l_english:
 building_type_true_jade_mines_01: "True Jade Mines"
 building_type_true_jade_mines_01_desc: "#flavor In The Age of Legends, when The Realm was still alive. (True) Jade was the most common of the Five Magical Materials found in the Creation. Heavily attuned to the Dragon-Touched, (White) Jade was used as the currency of the Realm. Now, in the World of Darkness, True Jade is rare, nearly absent. But this place contains deposits of the True Jade thanks to hard work of many $POD_splat_terrestrial_exalted_plural$.#!"
 building_true_jade_mines_01: "Small True Jade Mines"
 building_true_jade_mines_01_desc: "The deposit is large, but majority of it is inaccessible to your miners."
 true_jade_mines_01_effect_desc: "Every $POD_splat_terrestrial_exalted$ [ruler|E] in the same top [realm|E] will have access to [crafting_forging|E] [crafting_node|E] '$node_true_jade_loca$' adding a [modifier|E] based on the [artifact|E]'s type."
 building_true_jade_mines_02: "Medium True Jade Mines"
 building_true_jade_mines_02_desc: "We managed to struck one of bigger veins of True Jade here. But there is still much outside our range."
 true_jade_mines_02_effect_desc: "Every $POD_splat_terrestrial_exalted$ [ruler|E] in the same top [realm|E] will have access to [crafting_forging|E] [crafting_node|E] '$node_true_jade_loca$' adding 2 [modifiers|E] based on the [artifact|E]'s type."
 building_true_jade_mines_03: "Large True Jade Mines"
 building_true_jade_mines_03_desc: "Almost all True Jade hidden beneath surface is under our control and in our range, but there are some deposits outside it."
 true_jade_mines_03_effect_desc: "Every $POD_splat_terrestrial_exalted$ [ruler|E] in the same top [realm|E] will have access to [crafting_forging|E] [crafting_node|E] '$node_true_jade_loca$' adding 3 [modifiers|E] based on the [artifact|E]'s type."
 building_true_jade_mines_04: "True Jade Mines"
 building_true_jade_mines_04_desc: "A mine of legendary size, similar to ones found in the Age of Legends, all deposits of True Jade are accessible."
 true_jade_mines_04_effect_desc: "Every $POD_splat_terrestrial_exalted$ [ruler|E] in the same top [realm|E] will have access to [crafting_forging|E] [crafting_node|E] '$node_true_jade_loca$' adding 4 [modifiers|E] based on the [artifact|E]'s type and $POD_energy_essence$ storage."

 building_type_exalted_connections_to_merchants_01: "Connections to Merchants"
 building_type_exalted_connections_to_merchants_01_desc: "#flavor Even the most powerful man alive will bow to a merchant.#!"
 building_exalted_connections_to_merchants_01: "Minimal Connections to Merchants"
 building_exalted_connections_to_merchants_01_desc: "Rudimentary connections to local merchants have benn established, but out words take awfully long to travel."
 building_exalted_connections_to_merchants_02: "Minor Connections to Merchants"
 building_exalted_connections_to_merchants_02_desc: "Our conenctions to local merchants have grown to almost official levels."
 building_exalted_connections_to_merchants_03: "Moderate Connections to Merchants"
 building_exalted_connections_to_merchants_03_desc: "We have people designated to be a intermediary between us and local merchants."
 building_exalted_connections_to_merchants_04: "Significant Connections to Merchants"
 building_exalted_connections_to_merchants_04_desc: "We have whole ambasadors to local merchants, our words travel almost instantaneously."
 building_exalted_connections_to_merchants_05: "Extensive Connections to Merchants"
 building_exalted_connections_to_merchants_05_desc: "We have merged with local merchants, our communications cannot be disturbed anymore."

 building_type_exalted_connections_to_nobility_01: "Connections to Nobility"
 building_type_exalted_connections_to_nobility_01_desc: "#flavor To know people in power, is to be in power.#!"
 building_exalted_connections_to_nobility_01: "Minimal Connections to Nobility"
 building_exalted_connections_to_nobility_01_desc: "At least local nobility knows about our existence, somewhat."
 building_exalted_connections_to_nobility_02: "Minor Connections to Nobility"
 building_exalted_connections_to_nobility_02_desc: "Local nobility has growned somewhat interested in us, rudimentary message routes have been established"
 building_exalted_connections_to_nobility_03: "Moderate Connections to Nobility"
 building_exalted_connections_to_nobility_03_desc: "We became a full-blown partner to some of local nobles."
 building_exalted_connections_to_nobility_04: "Significant Connections to Nobility"
 building_exalted_connections_to_nobility_04_desc: "Our prestige and glory is known to all local nobles."
 building_exalted_connections_to_nobility_05: "Extensive Connections to Nobility"
 building_exalted_connections_to_nobility_05_desc: "Local People in power all know about us, and we know about them."

 building_type_exalted_connections_to_peasants_01: "Connections to Peasants"
 building_type_exalted_connections_to_peasants_01_desc: "#flavor Power often lies in the most numerous group.#!"
 building_exalted_connections_to_peasants_01: "Minimal Connections to Peasants"
 building_exalted_connections_to_peasants_01_desc: "Some of local peasants have became aware of our existence, and what we can provide."
 building_exalted_connections_to_peasants_02: "Minor Connections to Peasants"
 building_exalted_connections_to_peasants_02_desc: "More and More peasants have gathered around our people."
 building_exalted_connections_to_peasants_03: "Moderate Connections to Peasants"
 building_exalted_connections_to_peasants_03_desc: "We have became a important player in eyes of all local peasants."
 building_exalted_connections_to_peasants_04: "Significant Connections to Peasants"
 building_exalted_connections_to_peasants_04_desc: "You won't find a peasant that does not know something about us."
 building_exalted_connections_to_peasants_05: "Extensive Connections to Peasants"
 building_exalted_connections_to_peasants_05_desc: "These people will fight for us, even though they still don't understand our true magnificence."

 building_type_exalted_connections_to_clergy_01: "Connections to Clergy"
 building_type_exalted_connections_to_clergy_01_desc: "#flavor Belief is a strong tool in right hands.#!"
 building_exalted_connections_to_clergy_01: "Minimal Connections to Clergy"
 building_exalted_connections_to_clergy_01_desc: "We are Exalted, the choosen of Gods and even if we won't show them our true nature, that still opens some doors for us."
 building_exalted_connections_to_clergy_02: "Minor Connections to Clergy"
 building_exalted_connections_to_clergy_02_desc: "Some local Clergy have began to view us as messangers of God."
 building_exalted_connections_to_clergy_03: "Moderate Connections to Clergy"
 building_exalted_connections_to_clergy_03_desc: "Our little 'cult' among Clergy has grown to include vast number of them."
 building_exalted_connections_to_clergy_04: "Significant Connections to Clergy"
 building_exalted_connections_to_clergy_04_desc: "Almost all local Clergy view us as divine in nature, rightfully so."
 building_exalted_connections_to_clergy_05: "Extensive Connections to Clergy"
 building_exalted_connections_to_clergy_05_desc: "Our word is word of god."

 building_type_exalted_connections_to_militia_01: "Connections to Militia"
 building_type_exalted_connections_to_militia_01_desc: "#flavor People with swords are quite important to know about.#!"
 building_exalted_connections_to_militia_01: "Minimal Connections to Militia"
 building_exalted_connections_to_militia_01_desc: "Some rudimentary connections to local militia were established, though we still cannot move easily."
 building_exalted_connections_to_militia_02: "Minor Connections to Militia"
 building_exalted_connections_to_militia_02_desc: "We have people inside Militia, opening gates when needed is something we can do."
 building_exalted_connections_to_militia_03: "Moderate Connections to Militia"
 building_exalted_connections_to_militia_03_desc: "Many local guards have become used to our presence, though we still have to hide."
 building_exalted_connections_to_militia_04: "Significant Connections to Militia"
 building_exalted_connections_to_militia_04_desc: "Majority of local militia have grown to like us, we don't have much obstacles here anymore"
 building_exalted_connections_to_militia_05: "Extensive Connections to Militia"
 building_exalted_connections_to_militia_05_desc: "We can do whatever we want, and we don't attrack any special attention."

 building_type_exalted_node_of_essence_01: "Node of Essence"
 building_type_exalted_node_of_essence_01_desc: "#flavor Extension of a Dragon Nest for purposes of collecting and storing Essence.#!"
 building_exalted_node_of_essence_01: "Minor Node of Essence"
 building_exalted_node_of_essence_01_desc: "Minor extension of Dragon Nest helping us collect Essence."
 building_exalted_node_of_essence_02: "Small Node of Essence"
 building_exalted_node_of_essence_02_desc: "Small extension of Dragon Nest helping us collect Essence."
 building_exalted_node_of_essence_03: "Medium Node of Essence"
 building_exalted_node_of_essence_03_desc: "Medium extension of Dragon Nest helping us collect Essence."
 building_exalted_node_of_essence_04: "Big Node of Essence"
 building_exalted_node_of_essence_04_desc: "Big extension of Dragon Nest helping us collect Essence."
 building_exalted_node_of_essence_05: "Large Node of Essence"
 building_exalted_node_of_essence_05_desc: "Large extension of Dragon Nest helping us collect Essence."
 building_exalted_node_of_essence_06: "Colossal Node of Essence"
 building_exalted_node_of_essence_06_desc: "Colossal extension of Dragon Nest helping us collect Essence."
 building_exalted_node_of_essence_07: "Exalted Node of Essence"
 building_exalted_node_of_essence_07_desc: "This Dragon Nest was expanded to nearly divine levels in direction of Essence collection and storage."

 building_type_exalted_dragon_army_01: "Dragon Army"
 building_type_exalted_dragon_army_01_desc: "#flavor The backbone of most Houses' militaries, these 'rivers' of Essence originating from Dragon Nest create excellent places to train commanders.#!"
 building_exalted_dragon_army_01: "Minor Dragon Army"
 building_exalted_dragon_army_01_desc: "A very small stream of Essence from Dragon Nest guided to desired location, creating place where world itself helps us train commanders."
 building_exalted_dragon_army_02: "Small Dragon Army"
 building_exalted_dragon_army_02_desc: "Small stream of Essence from Dragon Nest guided to small area, making it a place where world itself guides our training methods towards perfection."
 building_exalted_dragon_army_03: "Medium Dragon Army"
 building_exalted_dragon_army_03_desc: "A small river of Essence from Dragon Nest guided to our training camps, vastly improving their effectiveness in training and recruiting skilled commanders."
 building_exalted_dragon_army_04: "Big Dragon Army"
 building_exalted_dragon_army_04_desc: "A river of Essence from Dragon Nest guided to training grounds, create place where world itself guides you towards perfection in commanding."
 building_exalted_dragon_army_05: "Large Dragon Army"
 building_exalted_dragon_army_05_desc: "Large river of Essence from Dragon Nest guided to training grounds, creating place full of Essence greatly increasing both training speed and quality."
 building_exalted_dragon_army_06: "Colossal Dragon Army"
 building_exalted_dragon_army_06_desc: "Colossal river of Essence from Dragon Nest guided to training grounds, making world itself perfect our minds and techniques in commanding."
 building_exalted_dragon_army_07: "Exalted Dragon Army"
 building_exalted_dragon_army_07_desc: "A river of Essence from Dragon Nest, in size compared to smaller Dragon Nests, guided towards our training grounds. Here, world itself approaches perfection, and we benefit from that as well."

 building_type_exalted_dragon_fortress_01: "Dragon Fortress"
 building_type_exalted_dragon_fortress_01_desc: "#flavor A vast networks of Essence running underground ready to empower and help recruit defenders when in need.#!"
 building_exalted_dragon_fortress_01: "Minor Dragon Fortress"
 building_exalted_dragon_fortress_01_desc: "The defensive network is small, and it's output limited. Still it grands slight supernatural aid in need."
 building_exalted_dragon_fortress_02: "Small Dragon Fortress"
 building_exalted_dragon_fortress_02_desc: "Small network of Essence underground, though with limited output, it still provides useful aid in need."
 building_exalted_dragon_fortress_03: "Medium Dragon Fortress"
 building_exalted_dragon_fortress_03_desc: "A network of Essence running underground, ready to provide aid in need."
 building_exalted_dragon_fortress_04: "Big Dragon Fortress"
 building_exalted_dragon_fortress_04_desc: "Complex network of Essence, interlinking itself in many places, ready to grand supernatural aid when under attack."
 building_exalted_dragon_fortress_05: "Large Dragon Fortress"
 building_exalted_dragon_fortress_05_desc: "Vast network of Essence spanning entire city, no matter where fighting would begin. It is there to give us aid when in need."
 building_exalted_dragon_fortress_06: "Colossal Dragon Fortress"
 building_exalted_dragon_fortress_06_desc: "Truly Colossal network of Essence underground, if one were to dig down they would see rivers of Essence flowing, ready to provide aid."
 building_exalted_dragon_fortress_07: "Exalted Dragon Fortress"
 building_exalted_dragon_fortress_07_desc: "Whole city is covered in Essence, be it underground or in air. Wherever, whenever, ready to provide aid comparable to Age of Legends itself."

 building_type_exalted_immaculate_libraries_01: "Immaculate Libraries"
 building_type_exalted_immaculate_libraries_01_desc: "#flavor Various Libraries filled with Essence, guiding any to-be scholars in their study.#!"
 building_exalted_immaculate_libraries_01: "Minor Immaculate Libraries"
 building_exalted_immaculate_libraries_01_desc: "A miniscule  amount of Essence fills air of designated library, vaguely helping local scholar in their studies."
 building_exalted_immaculate_libraries_02: "Small Immaculate Libraries"
 building_exalted_immaculate_libraries_02_desc: "A very slight presence of Essence fills air of designated library, anyone studying here will benefit from this atmosphere."
 building_exalted_immaculate_libraries_03: "Medium Immaculate Libraries"
 building_exalted_immaculate_libraries_03_desc: "Amount of Essence in the air starts to be noticeable for Exalted, and it's effects of studying are becoming much more noticeable even for ignorant."
 building_exalted_immaculate_libraries_04: "Big Immaculate Libraries"
 building_exalted_immaculate_libraries_04_desc: "Air itself starts to feel much more comfortable, Essence in it become almost visible for supernatural beings, and studying here comes much easier."
 building_exalted_immaculate_libraries_05: "Large Immaculate Libraries"
 building_exalted_immaculate_libraries_05_desc: "Even the most ignorant of supernatural beings will notice the Essence in the air, formulating and remembering complex patterns is much easier here than outside."
 building_exalted_immaculate_libraries_06: "Colossal Immaculate Libraries"
 building_exalted_immaculate_libraries_06_desc: "Even mortals can see the flow of Essence in the air, all sentient beings nearby instinctively know that this is a place of study."
 building_exalted_immaculate_libraries_07: "Exalted Immaculate Libraries"
 building_exalted_immaculate_libraries_07_desc: "Essence filling the Air is clearly visible to everyone, but none dares to disrespect the place of study, for this is a holy ground for scholars."

 building_type_exalted_dragon_arena_01: "Dragon Arena"
 building_type_exalted_dragon_arena_01_desc: "#flavor System of Arenas connected by flows of Essence, guaranteeing better performances.#!"
 building_exalted_dragon_arena_01: "Minor Dragon Arena"
 building_exalted_dragon_arena_01_desc: "A small arena with a system of various small streams of Essence, improving effectiveness of training nearby."
 building_exalted_dragon_arena_02: "Small Dragon Arena"
 building_exalted_dragon_arena_02_desc: "A small arena built in a way allowing the diverted stream of Essence to slowly pass through participants, improving their training."
 building_exalted_dragon_arena_03: "Medium Dragon Arena"
 building_exalted_dragon_arena_03_desc: "Arena covered in streams of Essence, ready to help local mortals when fight each-other, healing small bruises during training."
 building_exalted_dragon_arena_04: "Big Dragon Arena"
 building_exalted_dragon_arena_04_desc: "Essence flowing through local arena fills mortals fighting in it with strength and stamina beyond their normal limits, allowing for longer fighting."
 building_exalted_dragon_arena_05: "Large Dragon Arena"
 building_exalted_dragon_arena_05_desc: "A complex streams of Essence run through nearby arena(s) filling mortals inside with supernatural stamina, greatly lengthening their fighting."
 building_exalted_dragon_arena_06: "Colossal Dragon Arena"
 building_exalted_dragon_arena_06_desc: "A place where one can fight days, wounds slowly healing to allow for even longer fighting. Essence is truly miraculous."
 building_exalted_dragon_arena_07: "Exalted Dragon Arena"
 building_exalted_dragon_arena_07_desc: "No need to sleep, no need to eat, no need to think, just fight, just train, all so one day you can show your strength to the world outside."

 building_type_exalted_dragon_den_01: "Dragon Den"
 building_type_exalted_dragon_den_01_desc: "#flavor A place where even dragons can lay in peace.#!"
 building_exalted_dragon_den_01: "Minor Dragon Den"
 building_exalted_dragon_den_01_desc: "A small stream of Essence runs through nearby resting spot, making local atmosphere much more gentle."
 building_exalted_dragon_den_02: "Small Dragon Den"
 building_exalted_dragon_den_02_desc: "A resting spot, flowing with small amount of Essence, fills you with determination."
 building_exalted_dragon_den_03: "Medium Dragon Den"
 building_exalted_dragon_den_03_desc: "A stream of Essence flows through nearby resting spot, making anyone inside much more relaxed."
 building_exalted_dragon_den_04: "Big Dragon Den"
 building_exalted_dragon_den_04_desc: "A slow and steady but powerful flow of Essence flows through a resting spot, relaxing in here comes naturally to even more stress-out beings."
 building_exalted_dragon_den_05: "Large Dragon Den"
 building_exalted_dragon_den_05_desc: "A place of comfort, filled with Essence, it's ability to calm minds is unparalleled."
 building_exalted_dragon_den_06: "Colossal Dragon Den"
 building_exalted_dragon_den_06_desc: "Essence in the air, makes even the most paranoid finally calm down and rest in peace."
 building_exalted_dragon_den_07: "Exalted Dragon Den"
 building_exalted_dragon_den_07_desc: "A place, where everyone is the same, where outside conflict doesn't not matter. Essence guarantees peace here."

