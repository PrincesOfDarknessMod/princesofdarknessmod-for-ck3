 action_reactive_advice_gain_sekhem:0 "Advice: Gain Sekhem"
 action_reactive_advice_gain_sekhem_desc:1 "You have several ways to recover Sekhem. Open this to learn more about what that means for you."
 action_reactive_advice_gain_sekhem_click:0 "$click_to_open_lesson$"
 lesson_gain_sekhem_basic:0 "Gain Sekhem"
 lesson_gain_sekhem_basic_desc:1 "You use Sekhem to fuel your Hekau techniques, and each type of Mummy recovers it differently: [GetTrait('shemsuheru').GetName( GetPlayer )] by time (1 point/1 months) but if your aren't in the [GetGeographicalRegion('pod_lands_of_faith').GetName], it will result in [stress|E] gain). [GetTrait('cabiri').GetName( GetPlayer )] restore it by activating the 'Pneuma Restoration' personal [character_interaction|E]. [GetTrait('banemummy').GetName( GetPlayer )] regain it by executing [prisoners|E] using $EXECUTION_DEVOUR$ option."
 lesson_gain_sekhem_advanced:0 "Gain Sekhem"
 lesson_gain_sekhem_advanced_desc:0 "In later gameplay, you can use the Draw Sekhem [character_interaction|E] (Unlocked by [GetPerk( 'name_of_sekhem_perk' ).GetName( GetPlayer )]) or travel to Amenti in the Umbra Panel to recover Sekhem as well."

 action_reactive_advice_gain_resolve:0 "Advice: Gain Resolve"
 action_reactive_advice_gain_resolve_desc:1 "You have several way to recover Resolve. Open this to learn more about what that means for you."
 action_reactive_advice_gain_resolve_click:0 "$click_to_open_lesson$"
 lesson_gain_resolve:0 "Gain Resolve"
 lesson_gain_resolve_desc:1 "Resolve is fuel to your demonic power, you can gain them by: Revelation [character_interaction|E], Sin Eating [character_interaction|E] (Unlocked by [GetPerk( 'arcana_sin_eating_perk' ).GetName( GetPlayer )]) or $EXECUTION_DEVOUR_SOUL$ Execution."
 
 action_reactive_advice_gain_pathos:0 "Advice: Gain Pathos"
 action_reactive_advice_gain_pathos_desc:1 "You have several way to recover Pathos. Open this to learn more about what that means for you."
 action_reactive_advice_gain_pathos_click:0 "$click_to_open_lesson$"
 lesson_gain_pathos:0 "Gain Pathos"
 lesson_gain_pathos_desc:1 "Pathos is fuel to your arcanoi power, you can gain them by: finishing Passion [decision|E], Drain Energy [character_interaction|E] (Unlocked by [GetPerk( 'incubus_perk' ).GetName( GetPlayer )]) or Transfer Pathos In [character_interaction|E] (Unlocked by [GetPerk( 'pathos_conduit_perk' ).GetName( GetPlayer )])."
 