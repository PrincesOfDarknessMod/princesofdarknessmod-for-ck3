 reactive_advice_banality: "Banality: The Bane of Faerie"
 action_reactive_advice_banality: "Advice: Banality"
 action_reactive_advice_banality_desc: "[banality|E] is a major mechanic for Faerie. Open this to learn more about what that means for you."
 action_reactive_advice_banality_click: "$click_to_open_lesson$"
 lesson_about_banality: "$reactive_advice_banality$"
 lesson_about_banality_desc: "The force of human disbelief, Banality, is a major threat to Fae-kind, as it is the antithesis of their existence, of magic itself.\n\nBut for Fae, to exist in the Autumn world means to slowly accumulate the disbelief of the mortals around them. Something that can lead to #R death#!."
 lesson_gaining_banality: "Gaining Banality: The road to death"
 lesson_gaining_banality_desc: "Every year all Faerie gain some amount of [banality|E], seen in their #V Banality#! [trait|E]. If it ever reaches #V 100#!, the character #R dies#!.\n\nIn total, there are 5 ways to gain [banality|E]: $game_concept_banality_realm_disbelief$, $game_concept_banality_local_disbelief$, $game_concept_banality_reason$, $game_concept_banality_fae_hunting$ and $game_concept_banality_despair$.\n\nAdditionally, failing to cast a [cantrip|E] will result in #N +1#! [banality|E]."
 lesson_losing_banality: "Losing Banality: Quests of Glamour"
 lesson_losing_banality_desc: "Losing [banality|E] requires an #V active#! effort on your part.\n\nThere is only one real way to lose [banality|E], and that is completing a #V Quests of Glamour#! [journey|E].\n\nThere are 3 types of quests you can start. Each has the same results, but requires different [skills|E] and has different drawbacks."
 lesson_banality_objectives: "Fighting Banality"
 lesson_banality_objectives_desc: "An important aspect of [banality|E] are objectives linked to it.\n\nFew ways to gain [banality|E] also have a objective which disables it. Or at least makes it less damaging to you.\n\nFor example, $game_concept_banality_reason$ can be disabled by completing #V $destroy_order_of_reason_objective_decision$#!."
 lesson_banality_ending_notes: "Banality: The Overview"
 lesson_banality_ending_notes_desc: "In a nutshell:\n$BULLET_WITH_TAB$Minimize your yearly [banality|E] gain, and don't use [cantrips|E] with a low chance of success\n$BULLET_WITH_TAB$When your [banality|E] reaches about #V 30#!, start your [journey|E]. Either choose one which is best suited to your [skills|E], or one whose drawback is least noticeable for you.\n$BULLET_WITH_TAB$Certain major [decisions|E] can disable sources of [banality|E].\n$BULLET_WITH_TAB$And most importantly, #bold don't let it each 100!#!"
