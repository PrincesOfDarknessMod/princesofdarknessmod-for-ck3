 reactive_advice_fetters_and_passions: "Fetters, Passions and [oblivion_pull|E]"
 action_reactive_advice_fetters_and_passions: "Advice: Fetters, Passions and [oblivion_pull|E]"
 action_reactive_advice_fetters_and_passions_desc: "Quick introduction to the main [GetTrait('wraith').GetName(GetNullCharacter)] mechanics"
 action_reactive_advice_fetters_and_passions_click: "$click_to_open_lesson$"
 fetters_and_passions: "Fetters, Passions and [oblivion_pull|E]"
 lesson_fetters_and_passions: "Fetters, Passions and [oblivion_pull|E]"
 lesson_fetters_and_passions_desc: "First thing to know is the existence of [oblivion_pull|E] that you need to closely monitor to not fall into [GetTrait('shadow').GetName(GetNullCharacter)]. To decrease it you need [Fetters|E], each non assigned [Fetter|E] point means one additional [stress|E] every month."
 
 fetters_and_passions2: "Losing Stress"
 lesson_fetters_and_passions2: "Losing Stress"
 lesson_fetters_and_passions2_desc: "$POD_splat_wraith_plural$ cannot lose [stress|E] except when triggering a passion. To trigger a passion you need to perform specific actions detailed in the description of the [Fetter|E] modifier. Each type of [Fetter|E] has different triggers, like 'HATRED' triggers after committing a murder and 'LOVE' triggers every year a chosen character stays alive.\n\nThe level of a [Fetter|E] is an important measure for passions, as it is a factor for how much stress you will be able to lose using it and how much Pathos you will gain."
 
 fetters_and_passions3: "Mental Breakdowns"
 lesson_fetters_and_passions3: "Mental Breakdowns"
 lesson_fetters_and_passions3_desc: "For a [GetTrait('wraith').GetName(GetNullCharacter)], suffering a mental breakdown is very dangerous as each breakdown empowers the [GetTrait('shadow').GetName(GetNullCharacter)] by giving you random [thorn_lifestyle|E] [lifestyle|E] [perk|E] that will make the game harder.\nAt #N mental breakdown level 2#!, the [GetTrait('shadow').GetName(GetNullCharacter)] will try to overthrow you as the main personality. If successful in this endeavor you will become a [GetTrait('shadow').GetName(GetNullCharacter)] with all that it entails.\nAt #N level 3 mental breakdown#! your [GetTrait('shadow').GetName(GetNullCharacter)] will try to erase you from existence, if successful you will become a [GetTrait('spectre').GetName(GetNullCharacter)] and your game will be over."
 
 fetters_and_passions4: "Arcanoi"
 lesson_fetters_and_passions4: "Arcanoi"
 lesson_fetters_and_passions4_desc: "Despite not being at ease in the world of the living, a [GetTrait('wraith').GetName(GetNullCharacter)] is not defenseless as they have access to [arcanoi_lifestyle|E], the powers of the dead.\n\nTo use them you will need to learn them, there are two ways to do that: First is to learn it from a [friend|E] or other positive relationship. Second is, while exploring the [umbra|E], encounter another [GetTrait('wraith').GetName(GetNullCharacter)] willing to teach you one of them.\n\nEach arcanoi require Pathos to use, and pathos is gained via passions as explained before.\n\nEach arcanoi also unlocks [domicile_building|E] giving more bonuses."

