 reactive_advice_umbra: "Umbra"
 action_reactive_advice_umbra: "Advice: Umbra"
 action_reactive_advice_umbra_desc: "Open this to learn more about what that means for you."
 action_reactive_advice_umbra_click: "$click_to_open_lesson$"
 lesson_umbra_1: "Exploration"
 lesson_umbra_1_desc: "The option in the bottom of the panel represents umbral realms that you can visit. The option in the left side of the panel is the subrealm/realm location.\nAn umbral realm can be of one of six different types depending on the color of the option's background: [astral_reaches|E], [dreaming|E], [spirit_wilds|E], [underworld|E], [deep_umbra|E] and areas that don't belong in those five. The first five need the corresponding trait or perk to access. As such, an umbral realm is hidden if you don't meet the requirement, like being in a coast/sea region, having the right trait/faith or be past a certain date. Also, you need at least 1 knowledge level of the current umbra realm to be able to explore the next one."
 lesson_umbra_2: "Action"
 lesson_umbra_2_desc: "The right side of the panel lists actions that can be used in the umbral realm, including a map that allows you to fast travel to the starting point.\nSome umbral realms have rulers which allows you to exchange grace (representing favor with these rulers) for benefits.\nWhen you find an discovery, you can use an action to start an umbra expedition, which opens a map that contains challenges, random events and duels. The more stressed you are, the more duels will be generated on the path."
 lesson_umbra_3: "Discovery"
 lesson_umbra_3_desc: "You can station an umbra explorer in the bottom right of the panel if the umbral realm permits it. The explorer needs to have the ability to travel the umbra.\nExplorers will report discovering events they find in the umbra, and raise knowledge level about the umbral realm they are exploring. This gives benefits that you can see if you mouse over the corresponding knowledge level icon.\nPoint of discovery reports happen when raising your knowledge level, or every month when an explorer is stationed on a full knowledge level realm with a chance equal to umbra exploration progress/10 (umbra exploration progress/5 if the stationed explorer is a player)."
 lesson_umbra_4: "Danger"
 lesson_umbra_4_desc: "If the name of the umbral realm is colored in red, this means that this umbral realm is a dangerous location. Entering it will cause you to be unable to use interactions on other characters or even be trapped in this place. You also usually won't gain beneficial umbra discoveries with a stationed explorer in it.\nWhen a great maelstrom happens, all [underworld|E] realms will turn into a dangerous location.\nOblivion has a skull icon for a reason. Don't enter Oblivion."

