 brujah_primogen_court_position: "Brujah Primogen"
 brujah_primogen_court_position_desc: "The $brujah_primogen_court_position$ is traditionally responsible for strategical warfare in a domain, though they might also dabble in scholarship at times, staying true to their moniker of the Warrior-Scholars.\n\n#help For [aptitude|E] requirements, see [brujah_primogen|E].#!"
 cappadocian_primogen_court_position: "Cappadocian Primogen"
 cappadocian_primogen_court_position_desc: "Few know as much as the Cappadocian about the Undead condition. A lot can be learned from them, if they are willing to talk.\n\n#help For [aptitude|E] requirements, see [cappadocian_primogen|E].#!"
 lasombra_primogen_court_position: "Lasombra Primogen"
 lasombra_primogen_court_position_desc: "The Masters of Shadows are an useful ally to have on your side, but a much deadlier enemy if crossed.\n\n#help For [aptitude|E] requirements, see [lasombra_primogen|E].#!"
 toreador_primogen_court_position: "Toreador Primogen"
 toreador_primogen_court_position_desc: "Every self respecting court has a talented Toreador to handle its gatherings. The definition of 'talented' might be controversial at times though.\n\n#help For [aptitude|E] requirements, see [toreador_primogen|E].#!"
 tzimisce_primogen_court_position: "Tzimisce Primogen"
 tzimisce_primogen_court_position_desc: "When a guest isn't welcome any longer but you still need them to answer a few questions... you know who to call.\n\n#help For [aptitude|E] requirements, see [tzimisce_primogen|E].#!"
 ventrue_primogen_court_position: "Ventrue Primogen"
 ventrue_primogen_court_position_desc: "The so called rulers of the night expect a great deal of power and responsibilities bestowed upon them, even when they aren't deserving of it.\n\n#help For [aptitude|E] requirements, see [ventrue_primogen|E].#!"
 assamite_primogen_court_position: "Banu Haqim Primogen"
 assamite_primogen_court_position_desc: "The Children of Haqim are dutiful, and an example of discipline towards a common cause. Most of the time.\n\n#help For [aptitude|E] requirements, see [assamite_primogen|E].#!"
 gangrel_primogen_court_position: "Gangrel Primogen"
 gangrel_primogen_court_position_desc: "A Gangrel is never far away from their pack, ready to help or hinder on their behalf.\n\n#help For [aptitude|E] requirements, see [gangrel_primogen|E].#!"
 malkavian_primogen_court_position: "Malkavian Primogen"
 malkavian_primogen_court_position_desc: "The seers don't control the omens, but perhaps it is best to have them on your side still.\n\n#help For [aptitude|E] requirements, see [malkavian_primogen|E].#!"
 nosferatu_primogen_court_position: "Nosferatu Primogen"
 nosferatu_primogen_court_position_desc: "Having the Nosferatu favors you is always a good idea. The difficulty lies in truly making sure that they are on your side...\n\n#help For [aptitude|E] requirements, see [nosferatu_primogen|E].#!"
 ravnos_primogen_court_position: "Ravnos Primogen"
 ravnos_primogen_court_position_desc: "A divided and feuding family is still a family all the same.\n\n#help For [aptitude|E] requirements, see [ravnos_primogen|E].#!"
 setite_primogen_court_position: "Setite Primogen"
 setite_primogen_court_position_desc: "The Clan of Faith can spiritually guide you, but perhaps not to the ending you wished for.\n\n#help For [aptitude|E] requirements, see [setite_primogen|E].#!"
 tremere_primogen_court_position: "Tremere Primogen"
 tremere_primogen_court_position_desc: "The Usurpers bring gifts aplenty, and curses even more.\n\n#help For [aptitude|E] requirements, see [tremere_primogen|E].#!"
 salubri_primogen_court_position: "Salubri Primogen"
 salubri_primogen_court_position_desc: "The Shepherds of humanity are dying, but their duty remains.\n\n#help For [aptitude|E] requirements, see [salubri_primogen|E].#!"
 gargoyle_primogen_court_position: "Gargoyle Primogen"
 gargoyle_primogen_court_position_desc: "When you need a sudden violent assault carried out, Gargoyles are who you need.\n\n#help For [aptitude|E] requirements, see [gargoyle_primogen|E].#!"
 
 #POD_primogens.0001.t: "Primogen Mechanics"
 #POD_primogens.0001.desc: "As you are of a Kingdom (or above) level as a ruler, you now have access to the [primogen|E] minor court positions.\nThese positions represent the expectation of each $pod_clan$ in your area to have a representative close to you. Each $pod_clan$ values a different [Concept('primogen_aptitude','set of skills')|E] as you can see in their aptitude scores but all of them expect to be represented.\nIf you choose to not appoint someone (because you can't afford their salary, or because they are needed elsewhere, or simply because you don't have anyone suitable yet), you can expect this specific $pod_clan$ to protest in the coming years, giving you a notable opinion malus with each member of that $pod_clan$ in your realm."
 #POD_primogens.0001.a: "Understood"
 #primogen_explanation_tt: "You have a three years grace period until your realm expect those positions to be filled."
 #
 #lack_primogen_opinion: "Feels Marginalized"
 #
 #POD_primogens.0003.t: "Mood of the Clans"
 #POD_primogens.0003.desc: "As a powerful ruler of the night, you are constantly judged by the various $pod_clans$ of the undead society. Those that you haven't favored with a [primogen|E] seat are considered marginalized in your court, perhaps because of their political insignificance in your realm, or simply because of your current fancy.\nIn any case, you can now feel the mood of the Clans towards your rule shifting again."
 #POD_primogens.0003.a: "What do they truly think?"
 #lack_brujah_primogen_tt: "The Brujah feel marginalized."
 #lack_cappadocian_primogen_tt: "The Cappadocian feel marginalized."
 #lack_lasombra_primogen_tt: "The Lasombra feel marginalized."
 #lack_toreador_primogen_tt: "The Toreador feel marginalized."
 #lack_tzimisce_primogen_tt: "The Tzimisce feel marginalized."
 #lack_ventrue_primogen_tt: "The Ventrue feel marginalized."
 #lack_assamite_primogen_tt: "The Banu Haqim feel marginalized."
 #lack_malkavian_primogen_tt: "The Malkavian feel marginalized."
 #lack_nosferatu_primogen_tt: "The Nosferatu feel marginalized."
 #lack_ravnos_primogen_tt: "The Ravnos feel marginalized."
 #lack_setite_primogen_tt: "The Setite feel marginalized."
 #lack_salubri_primogen_tt: "The Salubri feel marginalized."
 #lack_tremere_primogen_tt: "The Tremere feel marginalized."
 #lack_gangrel_primogen_tt: "The Gangrel feel marginalized."
 #lack_gargoyle_primogen_tt: "The Gargoyle feel marginalized."
                                                               
 aphrodisiac_celebrant_court_position: "Aphrodisiac Celebrant"
 aphrodisiac_celebrant_court_position_desc: "A position hotly contested with social politicking, the Aphrodisiac Celebrant has the honor of presiding the Aphrodisiac, where Sinners celebrate the coming the Spring with a very vibrant, and decadent, festival."

 lord_of_misrule_court_position: "Lord of Misrule"
 lord_of_misrule_court_position_desc: "Elected during the Saturnalia, the Lord of Misrule has complete immunity and uses it to mock and belittle all the established Cainite authorities in the area."
 
 kertilsveinr_court_position: "Kertilsveinr"
 kertilsveinr_court_position_desc: "Chosen from mortal warriors who have not partaken of a Cainite's blood, a Kertilsveinr is responsible for handling ceremonial and religious duties."
 
 skutilsveinr_court_position: "Skutilsveinr"
 skutilsveinr_court_position_desc: "A Skutilsveinr acts as the Cainite commander for the mortal forces of their lord, outranking most other warriors."
 
 hidden_minister_of_jade_court_position: "Hidden Minister of Jade"
 hidden_minister_of_jade_court_position_desc: "The Hidden Minister of Jade collects and dispenses funds for the court, whether as traditional mortal currency or as jade."
 hidden_minister_of_rites_court_position: "Hidden Minister of Rites"
 hidden_minister_of_rites_court_position_desc: "The Hidden Minister of Rites oversees a broad range of activities, including ensuring the just and fair execution of local shadow wars. The position also safeguards the region’s feng shui and overall vitality of Dragon Nests and lines."
 hidden_minister_of_shen_court_position: "Hidden Minister of Shen"
 hidden_minister_of_shen_court_position_desc: "The Hidden Minister of Shen is a diplomatic post with a dual purpose. This position’s public mandate is maintaining relations with regional shen. This position’s private mandate, however, is advising the August Ancestor of exploitable weaknesses in rival shen."
 hidden_minister_of_war_court_position: "Hidden Minister of War"
 hidden_minister_of_war_court_position_desc: "When all else fails and open conflict is inevitable, the Hidden Minister of War is often the general directing regional Wan-Kuei forces against the enemy."
 hidden_minister_of_the_garden_court_position: "Hidden Minister of the Garden"
 hidden_minister_of_the_garden_court_position_desc: "The Hidden Minister of the Garden tends to regional mortal affairs, safeguarding “the proper and virtuous well-being of the populace.”"
 hidden_minister_of_hushed_lanterns_court_position: "Hidden Minister of Hushed Lanterns"
 hidden_minister_of_hushed_lanterns_court_position_desc: "The Hidden Minister of Hushed Lanterns is a troubleshooter of sorts, handling “unpleasant problems” and embarrassing situations the August Ancestor or Ministers don’t want to handle directly."
 minister_of_jade_court_position: "Minister of Jade"
 minister_of_jade_court_position_desc: "The Minister of Jade deals with the local treasury, and is responsible for collecting regional taxes and tributes to the Hidden Minister above her."
 minister_of_rites_court_position: "Minister of Rites"
 minister_of_rites_court_position_desc: "The Minister of Rites supervises local shadow wars and helps determine the conflict’s victor if there is no city ancestor to handle the duties."
 minister_of_shen_court_position: "Minister of Shen"
 minister_of_shen_court_position_desc: "The Minister of Shen is every bit the ambassador the Hidden Minister is when dealing with shen, even though the August Court officially treats him as an aide to the region’s Hidden Minister."
 minister_of_war_court_position: "Minister of War"
 minister_of_war_court_position_desc: "If the Hidden Minister of War is a general, then the Minister of War serves as his adjunct. This Minister has little to do with the actual fighting, and is instead the eyes, ears and mouthpiece through which the Hidden Minister’s orders issue forth, and through whom the Hidden Minister receives his information."
 minister_of_the_garden_court_position: "Minister of the Garden"
 minister_of_the_garden_court_position_desc: "The Minister of the Garden oversees regional mortal concerns on behalf of the local Hidden Minister, until the Hidden Minister deems the situation severe enough to warrant his personal attention."
 yin_ambassador_court_position: "Yin Ambassador"
 yin_ambassador_court_position_desc: "The Yin Ambassador serves the local ancestor as her bridge with the local [UmbraGlossaryLocalized('shadowlands','Yin World')] and its frightening realms."
 yang_ambassador_court_position: "Yang Ambassador"
 yang_ambassador_court_position_desc: "The Yang Ambassador is the analogue to the Yin emissary, providing a bridge to the dynamic and vibrant [Glossary('Yang World','game_concept_yang_world_desc')]."
 first_oni_court_position: "First Oni"
 first_oni_court_position_desc: "First Oni is akin to a warlord, overseeing regional security, protecting it against [akuma|E] and [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] influences and usually heading sanctioned campaigns against enemies."
 infant_devil_civilizer_court_position: "Infant Devil Civilizer"
 infant_devil_civilizer_court_position_desc: "There is a when and where for a parent’s gentle persuasion, but during the taming of wild $pod_kueijin$ freshly returned from the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] is not such a time. Into this role steps the Infant Devil Civilizer, the supervisor of various local Infant Devil Civilizing Societies’ efforts to reclaim, subdue and escort these returned souls to the nearest Court."

 master_rite_court_position: "Master of the Rite"
 master_rite_court_position_desc: "The $master_rite_court_position$ is responsible for the spiritual well-being of the Caern. All rituals that take place must first earn their approval."
 gatekeeper_court_position: "Gatekeeper"
 gatekeeper_court_position_desc: "The $gatekeeper_court_position$ is likely to be the first person encountered by newcomers. Collecting tribute and information from visitors, the Gatekeeper is often quite busy as the maintenance of the spiritual Moon Bridges is also under their responsibility."
 wyrm_foe_court_position: "$glossary_wyrm$ Foe"
 wyrm_foe_court_position_desc: "The $wyrm_foe_court_position$ is the sept fiercest warrior, not necessarily the most skilled but certainly the most eager. They serve as the sept leader second in command during offensive actions against the Wyrm's minions."
 talesinger_court_position: "Talesinger"
 talesinger_court_position_desc: "The $talesinger_court_position$ is charged with maintaining the reputation of the Caern by creating and performing tales or songs of the great deeds done by the sept's heroes. They also pass the history of the Garou to the young."
 master_challenges_court_position: "Master of Challenges"
 master_challenges_court_position_desc: "The $master_challenges_court_position$ serves as a judge for challenges taking place in the Caern. An intimidating figure, they are also expected to keep the warriors in line during times of peace."

 court_seer_court_position: "[SelectLocalization(GetPlayer.IsValid, 'court_seer_court_position_from_player', 'custom_court_seer')]"
 court_seer_court_position_from_player: "[GetPlayer.Custom('CourtSeer')]"
 custom_court_seer: "Court Seer"
 custom_court_seer_oracle: "Court Oracle"
 custom_court_seer_augur: "Court Augur"
 court_seer_court_position_desc: "The $court_seer_court_position$ foretells the future and determines auspicious or inauspicious days for holding official ceremonies."

 minister_eagles_court_position: "Minister of Eagles"
 minister_eagles_court_position_desc: "The Minister of Eagles specializes in information of any kind, be it mundane information about the mortal infrastructure and political landscape, lost lore from the ages before their imprisonment or supernatural activity that could threaten the Court."
 minister_aurochs_court_position: "Minister of Aurochs"
 minister_aurochs_court_position_desc: "The Minister of Aurochs, also called the Warder, has the task of defending the Court and enforce its laws. They also defend high-ranking Fallen against assassination attempts from rival demons."
 minister_dragons_court_position: "Minister of Dragons"
 minister_dragons_court_position_desc: "The Minister of Dragons has the task of questioning and challenging authority. They must always watch signs of corruption and betrayal. Demons are encouraged to be circumspect in their dealings and the Censor make sure that the rebellious spark in every demon that drove them against God is channeled to constructive means."
 minister_dust_court_position: "Minister of Dust"
 minister_dust_court_position_desc: "The Minister of Dust is charged with the safekeeping of the mortal flock as well as the advancement of the Court. They manage mortal institutions, keeping them away from Court infrastructure as well as increasing the general amount of Faith within the population, either by supporting religious institutions or running the city down so that people cling even more tightly to their beliefs." 
 minister_swords_court_position: "Minister of Lions"
 minister_swords_court_position_desc: "Charged with fighting against threats to the Court, the Minister of Lions manage the elite soldiers of the Court. Since the open use of violence and shows of force is restricted compared to the Age of Wrath, the so called 'Swords' have to operate carefully to fulfill their duties." 
    
 brujah_warmaster_court_position: "Brujah Warmaster"
 brujah_warmaster_court_position_desc: "The $brujah_warmaster_court_position$ was traditionally the teacher in battle for newly created Brujah in ancient times. The clan has fallen far and this tradition has been mostly forgotten, but some still cling to it, forcing neonates to a thorough, almost Spartan, training regiment after their introduction to the court."
 
 underworld_ambassador_court_position: "Underworld Ambassador"
 underworld_ambassador_court_position_desc: "The [UmbraGlossaryLocalized('shadowlands','Underworld')] Ambassador serves the local ruler as her bridge with the local [UmbraGlossaryLocalized('shadowlands','Underworld')] realms."
 umbra_ambassador_court_position: "[umbra|E] Ambassador"
 umbra_ambassador_court_position_desc: "The [umbra|E] Ambassador serves the local ruler as her bridge with the local [umbra|E] realms."
 trod_wayfarer_court_position: "Trod Wayfarer"
 trod_wayfarer_court_position_desc: "Trods are the fae's nearest connection to the [UmbraGlossary('dreaming')] and [UmbraGlossary('arcadia')] beyond. They are also power. Those who control the trods wield great control over fae society."
 
 touchstones_court_position: "Touchstone"
 touchstones_court_position_desc: "Touchstones are a vampire's connection to the mortal world, representing a mindset in which they value themselves. A Touchstone must be a single living human being. The touchstone might be a surviving partner or family member, related to someone who the vampire killed in their early unlife or even just something they run into regularly.\nSome Kindred, due to their disconnect from the mortal world may even pick a Touchstone who doesn't know they exist, instead choosing to stalk and watch over the human to retain their connections to humanity."

 alastor_court_position: "Alastor"
 alastor_court_position_desc: "An Alastor is a Kindred agent of the Camarilla who has been charged with hunting down the Anathema: dangerous vampires who have been added to the Camarilla's Red List and targeted for destruction by the entire sect."
 alastor_court_employer_custom_effect_description: "Allow sending an Alastor to hunt Anathema for a bounty."
 praetor_court_position: "Praetor"
 praetor_court_position_desc: "Praetor, or project leader, are terms used to describe notable archons who have been given authority over their peers. The position normally only lasts as long as a given assignment, but some continue to use the title with pride."
 dogcatcher_court_position: "Dogcatcher"
 dogcatcher_court_position_desc: "Dogcatcher is an informal title for archons that have made a habit of taking on werewolves and who possess a far greater knowledge of werewolf abilities, habits, and societies than other vampires."
 doppelganger_court_position: "Doppelganger"
 doppelganger_court_position_desc: "Doppelganger is an informal designation to archons who adopt a deep undercover identity to do a specific job."
 josian_court_position: "Josian"
 josian_court_position_desc: "Josians are infernalist-hunting Archons. They are also dedicated to uprooting Gehenna cults while also secretly investigating discovered Noddist lore for any evidence that Gehenna may be a real danger."
 quaesitor_court_position: "Quaesitor"
 quaesitor_court_position_desc: "Quaesitors are a branch of archons who are almost entirely Tremere vampires. They tend to all the Camarilla's sorcerous needs, whether it's combating Sabbat's koldun, mages, or hunting rogue Tremere."
 
 oathsworn_mount_court_position: "Oathsworn Mount"
 oathsworn_mount_court_position_desc: "A [GetTrait('pooka').GetName( GetPlayer )] (with affinity as a large animal) or a [GetTraitGroup('fera').GetName()] [courtier|E] who has sworn an oath to a Fae liege may serve as an intelligent mount for that liege."
 oathsworn_mount_employer_custom_effect_description: "Increased travel and army movement speed depending upon [aptitude|e]."
 
 strategoi_court_position: "Strategoi"
 strategoi_court_position_desc: "The strategoi effectively run the operations of the Ephorate’s quotidian concerns. Each is responsible for a different part of the Ephorate’s dominion. From night to night, the strategos oversees Ventrue business and political affairs in his region in addition to tending to his own needs and dignitas."
 lictor_court_position: "Lictor"
 lictor_court_position_desc: "Lictors are the troubleshooters of the Ephorate, these Ventrue sent to deal with problems threatening the clan. This broad assignment also leads to them needing a broad range of skills but most Lictors end up being frontline combatants. They are in just the right range of being skilled but not important enough to care if they perish in their line of duty."
 tribunes_court_position: "Tribunes"
 tribunes_court_position_desc: "The Ephorate maintains a loose network of contacts and “field operatives” around the world. These Kindred are referred to as both tribunes and agents at large, and they serve as the ephors’ eyes and ears all around the world."
 
 POD_spread_legitimacy: "Spread Legitimacy"
 POD_spread_legitimacy_desc: "This character is tasked with representing their [liege|E] for a specific area, addressing a specific concern or being the spokesperson for a part of the realm."
 POD_tribute_collecting: "Collecting Tribute"
 POD_tribute_collecting_desc: "This character is tasked with making sure that everyone in the realm pay proper respect and tribute to the ruler, be it by charm, force or simply good administrative sense."
 POD_war_preparations: "War Preparations"
 POD_war_preparations_desc: "This character is tasked with making sure that everyone in the realm is ready for war at a moment's notice, be it by charm, force or simply good administrative sense."
 POD_vassal_handler: "Delegating Power"
 POD_vassal_handler_desc: "This character is tasked with representing their [liege|E] in faraway domains, making sure that even the frontier regions still feel connected to the center."
 POD_home_seneschal: "Consolidate Domain"
 POD_home_seneschal_desc: "This character is tasked with making sure that everything runs smoothly in the center of the realm while their liege might be focused on more global matters."
 POD_home_builder: "Improve Domain"
 POD_home_builder_desc: "This character is tasked with making sure that the influence of their liege is felt appropriately even while they are away."
 POD_home_defender: "Defend Domain"
 POD_home_defender_desc: "This character is tasked with defending their liege's domain no matter the cost."
 POD_stress_relief: "Master of Entertainment"
 POD_stress_relief_desc: "This character is tasked with making sure that the activities provided to the court and its ruler are always well prepared."
 POD_spread_prestige: "Spread Epic Tales"
 POD_spread_prestige_desc: "This character is tasked with spreading impressive stories about their liege. Some are even true."
 POD_spread_piety: "Spread Pious Tales"
 POD_spread_piety_desc: "This character is tasked with spreading impressive pious feats done by their liege. Some are even true."
 POD_help_schemes: "Help Shady Dealings"
 POD_help_schemes_desc: "This character offers some unofficial help to your more unsavory dealings."
 POD_organize_champions: "Organize Champions"
 POD_organize_champions_desc: "This character helps recruit and manage their liege's honor guard."
 POD_organize_retinue: "Organize Retinue"
 POD_organize_retinue_desc: "This character helps recruit and manage their liege's elite troops."
 POD_organize_plasmic: "Organize Plasmics"
 POD_organize_plasmic_desc: "This character helps organize and train their liege's plasmics."
 POD_organize_wraith: "Organize Wraiths"
 POD_organize_wraith_desc: "This character helps organize and train their liege's wraiths."
 POD_organize_demonic: "Organize Demons"
 POD_organize_demonic_desc: "This character helps organize and train their liege's demons."
 POD_organize_spirit: "Organize Spirits"
 POD_organize_spirit_desc: "This character helps organize and train their liege's spirits."
 POD_organize_bygone: "Organize Bygones"
 POD_organize_bygone_desc: "This character helps organize and train their liege's bygones."
 POD_organize_chimera: "Organize Chimeras"
 POD_organize_chimera_desc: "This character helps organize and train their liege's chimeras."
 POD_organize_faerie: "Organize Faeries"
 POD_organize_faerie_desc: "This character helps organize and train their liege's faeries."
 POD_manage_estate: "Manage Estate"
 POD_manage_estate_desc: "This character focuses on managing their liege's personal [domicile|E]."
 POD_kertilsveinr_piety_task: "Organize Blóts"
 POD_kertilsveinr_piety_task_desc: "This character focuses on organizing religious rituals for their master."
 POD_kertilsveinr_lifestyle_task: "Educate the Hirð"
 POD_kertilsveinr_lifestyle_task_desc: "This character focuses on educating the people of the realm."
 POD_skutilsveinr_raiding_task: "Prepare Raids"
 POD_skutilsveinr_raiding_task_desc: "This character focuses on organizing raids on foreign shores."
 POD_skutilsveinr_combat_task: "Prepare for Battle"
 POD_skutilsveinr_combat_task_desc: "This character focuses on organizing the hirðmen for battle."
 

 imperial_envoy_court_position: "Imperial Envoy"
 imperial_envoy_court_position_desc: "The $imperial_envoy_court_position$ is representing their liege in the far flung frontiers of their realm reminding them that they have to pay tribute even if they are far away."
 imperial_chancellor_court_position: "Imperial Chancellor"
 imperial_chancellor_court_position_desc: "The $imperial_chancellor_court_position$ is making sure their liege's voice is correctly heard. Even angry scoldings can be given a veneer of legitimacy if need be."
 imperial_minister_court_position: "Imperial Minister"
 imperial_minister_court_position_desc: "The $imperial_minister_court_position$ is helping running the day to day (or night to night) dealings in the realm. As the influence of their liege grows, their task becomes more and more critical."

 hanshii_arbiter_court_position: "Hanshii Arbiter"
 hanshii_arbiter_court_position_desc: "A staple of Bastet culture, Hanshii are ritual combats used for entertainment or deciding territorial rights. These contests may be riddle games, formal duels or fangs and claws warfare."
 seline_oracle_court_position: "Oracle of $glossary_luna_seline$"
 seline_oracle_court_position_desc: "Gaia's sympathetic sister, the Moon, obviously favors the werecats and considers them her finest creations. She birthed the Changing Breeds as a gift to the Earth and her body is said to be the final sanctuary for all Bastet."
 master_taghairm_court_position: "Master of the Taghairm"
 master_taghairm_court_position_desc: "The Taghairm is a cat gathering often called to exchange information or pleasantries. Usually performed during the height of the full moon."
 warleader_taklah_court_position: "Taklah Warleader"
 warleader_taklah_court_position_desc: "A Taklah is an all-werecat elite retinue gathered together for a common purpose."
 guardian_yava_court_position: "Guardian of the Yava"
 guardian_yava_court_position_desc: "A Yava is a tribal secret, hidden from all outsiders, that supposedly grants another being power over you if learned. The most tightly guarded of all Bastet lore, these are exposed only under the most extreme of circumstances, if even then."


 ratcatcher_court_position: "Rat Catcher"
 ratcatcher_court_position_desc: "A $ratcatcher_court_position$'s duty is to herd rats, see to it they're edible and corral them as a source of $pod_vitae$ for the less fortunate vampires of court."
 #ratcatcher_employer_custom_effect_description: "$BULLET$Enhances Drain Animal [character_interaction|E]"

 scarlet_screen_family_court_position: "Family Scarlet Screen"
 scarlet_screen_family_court_position_desc: "The most important Scarlet Screen. [Glossary('Dharma','podgloss.dharma')] like the Bone Flowers even have the imperative to safeguard the family. In addition, a $POD_splat_kueijin$'s mortal family is often among their most loyal supporters.\n\n#help [aptitude|E] of this [court_position|E] is based on family ties."

 scarlet_screen_inugumi_court_position: "Inugumi Scarlet Screen"
 scarlet_screen_inugumi_court_position_desc: "Soldiers are the most visible Scarlet Screen, often employed in the form of criminal gangs or people who supply the $POD_splat_kueijin$ with weapons and similar goods.\nThey are classified according to three types, with \"Dog gangs\" (inugumi) being more loyal and sometimes even having contact with the supernatural.\n\n#help [aptitude|E] of this [court_position|E] is based on [martial|E] [education|E] level."

 scarlet_screen_ryugumi_court_position: "Ryugumi Scarlet Screen"
 scarlet_screen_ryugumi_court_position_desc: "Soldiers are the most visible Scarlet Screen, often employed in the form of criminal gangs or people who supply the $POD_splat_kueijin$ with weapons and similar goods.\nThey are classified according to three types, with \"Dragon troops\" (ryugumi), being trained exactly for the purpose of combating high threats to their $POD_splat_kueijin$ master.\n\n#help [aptitude|E] of this [court_position|E] is based on [prowess|E] [education|E] level."

 scarlet_screen_artisans_court_position: "Artisan Scarlet Screen"
 scarlet_screen_artisans_court_position_desc: "Artisans work to increase their master's influence in the city through civil means (contrasting the deeds of the soldiers), as well as inspiring other screens by their knowledge.\n\n#help [aptitude|E] of this [court_position|E] is based on [learning|E] [education|E] level."

 scarlet_screen_peasants_court_position: "Peasant Scarlet Screen"
 scarlet_screen_peasants_court_position_desc: "Peasants responsible for keeping the $POD_splat_kueijin$ safe. In the [Glossary('Fifth Age','game_concept_fifth_age_desc')], local political groups have become classified as \"peasants\" as well.\n\n#help [aptitude|E] of this [court_position|E] is based on [diplomacy|E] [education|E] level."

 scarlet_screen_spies_court_position: "Spy Scarlet Screen"
 scarlet_screen_spies_court_position_desc: "Spies are divided into two groups.\nThe regular spies are used for intelligence gathering.\n\n#help [aptitude|E] of this [court_position|E] is based on [intrigue|E] [education|E] level."

 scarlet_screen_merchants_court_position: "Merchant Scarlet Screen"
 scarlet_screen_merchants_court_position_desc: "Spies are divided into two groups.\nThe merchants take care of the $POD_splat_kueijin$'s financial needs.\n\n#help [aptitude|E] of this [court_position|E] is based on [stewardship|E] [education|E] level."

 cult_leader_court_position: "Cult Leader"
 cult_leader_court_position_desc: "Leader and guru of a $POD_splat_demon$'s personal cult gathering faith. These cultists have a special position in their master's cult and handle the day to day tasks, leaving the Demon to focus on more important matters.\n#help The [aptitude|E] of this [court_position|E] is based on [stewardship|E], [intrigue|E] and [learning|E] as well as the [GetTrait('schemer').GetName(GetNullCharacter)] and [GetTrait('diligent').GetName(GetNullCharacter)] [traits|E]."
 
 fell_knight_court_position: "Fell Knight"
 fell_knight_court_position_desc: "Empowered to lead by rites dating back to the Creation, Fell Knights are the armored fists of their Fallen Angel master."
 
 
 majordomo_court_position: "Majordomo"
 majordomo_court_position_desc: "A Majordomo is a special role designed for a [GetTrait('ghoul').GetName(GetNullCharacter)] who typically serves his [Glossary('Domitor','game_concept_domitor_desc')] as the chief steward of her estates and affairs. The Majordomo will do his master's bidding by doling out assignments and orders ranging from hiring outside services to keeping other ghouls in line."


 POD_call_to_arms: "Call to Arms"
 POD_call_to_arms_desc: "This character is tasked with calling forth and organizing the realm's forces, including any mortal institutions that have been infiltrated."


 jerusalem_crown_speaker_court_position: "Crown Speaker"
 jerusalem_crown_speaker_court_position_desc: "In a land as tumultuous as Jerusalem, every Prince needs someone to represent and further their interests, regardless of whether they are present."
 POD_crown_speaker_passive_influence_christian: "Increase [Localize('POD_christian_influence')]"
 POD_crown_speaker_passive_influence_christian_desc: "Your $jerusalem_crown_speaker_court_position$ will expend their political capital to gradually increase [Localize('POD_christian_influence')]."
 POD_crown_speaker_passive_influence_muslim: "Increase [Localize('POD_muslim_influence')]"
 POD_crown_speaker_passive_influence_muslim_desc: "Your $jerusalem_crown_speaker_court_position$ will expend their political capital to gradually increase [Localize('POD_muslim_influence')]."
 POD_crown_speaker_passive_influence_jewish: "Increase [Localize('POD_jewish_influence')]"
 POD_crown_speaker_passive_influence_jewish_desc: "Your $jerusalem_crown_speaker_court_position$ will expend their political capital to gradually increase [Localize('POD_jewish_influence')]."

 jerusalem_puppeteer_grand_masters_court_position: "Puppeteer of Grand Masters"
 jerusalem_puppeteer_grand_masters_court_position_desc: "Some predating the Crusades, the Christian knightly orders carry a great deal of power. As a result, they have been overwhelmed with competing supernatural influences. To carve out a space for yourself, you will need a dedicated representative responsible for controlling and manipulating them."

 jerusalem_ashen_muhtasib_court_position: "Ashen Muhtasib"
 jerusalem_ashen_muhtasib_court_position_desc: "Collector of tolls from a different crowd, manager of shadowy logistics, supervisor of the hidden bazaars, investigator of counterfeits of all kinds, inspector of the places open to a different kind of public. The Ashen Muhtasib is responsible for a great many tasks, from inspecting weights to maintaining public baths. As lord of Jerusalem, you have the authority to appoint one, allowing another means to influence the city’s commerce."

 jerusalem_socher_court_position: "Socher"
 jerusalem_socher_court_position_desc: "Bridging East and West, Christian and Muslim, Jewish merchants and their trade routes cover much of the known world, connecting communities from Spain to China. Whether they are a Murashu or a Radhanite or an Awkal, they serve as postmasters, spymasters, envoys, merchants, and moneylenders. Their caravans carry spices, glassware, notes of credit, personal correspondence, religious documents, and far more. Through your agent’s influence, those trade routes could carry your orders and goods."



 # Mary the Black content — Triumvir court positions. Unlocked by the
 # Codex of Legacies tenet "Legacy of Trinity" (tenet_legacyoftrinity).
 # Single position type with max_available_positions = 2 — both seats
 # share these strings.
 triumvir_court_position: "Triumvir"
 triumvir_court_position_desc: "One of two co-rulers who share the throne with the holder. The Triumvir carries the founders' authority into council, court, and field. A seat that pulls its weight only when filled by someone whose own skill earns the room.\n\n#help For [aptitude|E] requirements, see [triumvir|E].#!"

 # Aptitude concept linked from the desc above (mirrors the primogen concepts).
 game_concept_triumvir: "$triumvir_court_position$"
 game_concept_triumvir_desc: "A $triumvir_court_position$ [court_position|E] draws on every facet of rule, wanting good [diplomacy|E], [martial|E], [stewardship|E], [intrigue|E], and [learning|E] alike — a true polymath fills the seat best.\n\nBeing an [GetTrait('administrator').GetName(GetNullCharacter)], [GetTrait('erudite').GetName(GetNullCharacter)], a [GetTrait('schemer').GetName(GetNullCharacter)], [GetTrait('diligent').GetName(GetNullCharacter)], [GetTrait('patient').GetName(GetNullCharacter)], and/or [GetTrait('ambitious').GetName(GetNullCharacter)] helps.\n\nBeing [GetTrait('lazy').GetName(GetNullCharacter)], [GetTrait('content').GetName(GetNullCharacter)], [GetTrait('arrogant').GetName(GetNullCharacter)], [GetTrait('craven').GetName(GetNullCharacter)], and/or [GetTrait('trusting').GetName(GetNullCharacter)] worsens performance."

 ######################################################
 # Mary the Black — Inverted Trinity pillars (Synthesis path)
 ######################################################
 pillar_of_darkness_court_position: "Pillar of Darkness"
 pillar_of_darkness_court_position_desc: "The darkness of the Trinity given a face: an ancient, overtly damned thing seated at court.\n\n#help For [aptitude|E] requirements, see [pillar_of_darkness|E].#!"
 pillar_of_light_court_position: "Pillar of Light"
 pillar_of_light_court_position_desc: "#shinygold The light of the Trinity given a face: the radiant, the faithful, the grieving, drawn close, and pulled down. They believe they are ascending. That belief is the point.#!\n\n#help For [aptitude|E] requirements, see [pillar_of_light|E].#!"

 # Aptitude concepts linked from the pillar descs above (mirror the primogen concepts).
 game_concept_pillar_of_darkness: "$pillar_of_darkness_court_position$"
 game_concept_pillar_of_darkness_desc: "A $pillar_of_darkness_court_position$ rewards what the candidate already is the older, the more damned, the more destructive, the better.\n\nIt is strongest in the overtly damned: those who keep the Via Diabolis, the [GetTrait('baali').GetName(GetNullCharacter)], and those already bound by infernal pacts.\n\nAncient cruelty helps; elder blood of the fourth through sixth generation, masters of Daimonion, and the [GetTrait('sadistic').GetName(GetNullCharacter)]. A destructive temperament lends a little more: high [martial|E], the [GetTrait('callous').GetName(GetNullCharacter)], and warrior clans such as the [GetTrait('assamite').GetName(GetNullCharacter)] and [GetTrait('brujah').GetName(GetNullCharacter)]."
 game_concept_pillar_of_light: "$pillar_of_light_court_position$"
 game_concept_pillar_of_light_desc: "A $pillar_of_light_court_position$ rewards the seduced convert; radiant, faithful, or grieving.\n\nIt is strongest in the devout (those who keep the Codex of Legacies, the Via Caeli, or the Via Divinitatis, and the [GetTrait('zealous').GetName(GetNullCharacter)]) and in those bound to you by love.\n\nRadiance helps the [GetTrait('toreador').GetName(GetNullCharacter)] and those graced with Presence. So does soft charisma: good [diplomacy|E] or [learning|E], the [GetTrait('gregarious').GetName(GetNullCharacter)], the beautiful, and a soul nursing a grievance."

