l_english:
 game_concept_exalted_vs_world_of_darkness_desc: "#italic $TAB$Before the Great Flood…\n$TAB$$TAB$ Before the Impergium…\n$TAB$$TAB$$TAB$Before the Mythic Ages…\n$TAB$$TAB$Before the Sundering…\nBefore there was a World of Darkness…\n$TAB$There was something else.\n$TAB$$TAB$$TAB$$TAB$#bold It's Back.#!\n\nExalted Vs World of Darkness is a non-canonical fan-work written by ex-writer for $pod_wod$ #V Holden Shearer#!.\n\nIn the early days, a lot of advertising and promotional material heavily played up the idea that Exalted was the secret forgotten prehistory of the World of Darkness. Over time, as Exalted developed into a juggernaut in its own right, those ties were downplayed, described as 'something that can be true in your game if you like', and eventually dropped altogether once it became clear the game was more than strong enough to stand on its own.\n\nBut even if officially both universes were separated, the idea was put forth for someone in the future to expand on. Something which in the end created ExWod, and by proxy [exalted_vs_princes_of_darkness|E]."

 game_concept_exalted_vs_princes_of_darkness: "Exalted vs Princes of Darkness"
 game_concept_expod: "ExPoD"
 game_concept_exalted_vs_princes_of_darkness_desc: "Exalted vs Princes of Darkness is a optional rule-set in [princes_of_darkness|E] that integrates ideas of $pod_exwod$ into the framework on the mod.\n\nTo enable $pod_exwod$ content, The #V '$rule_POD_expod_madness$'#! Game Rule must be set to either $setting_POD_expod_madness_sealed$ or $setting_POD_expod_madness_unleashed$.\n\nImportant thing to mention is that ExPoD is #bold optional#! and setting the Game Rule to $setting_POD_expod_madness_forgotten$(ie, leaving it in the default position) #emp fully#! disables the non-canonical content."

 game_concept_essence_rating: "Essence Rating"
 game_concept_essence_rating_desc: "#flavor Exaltation carries with it a tiny sliver of divine power. When one of the Chosen is newly-Exalted, this is little more than a dim spark plucked from the heart of the cosmos, but it may grow over time and experience into a raging inferno of ancient power unleashed once more upon the Earth. The intensity of this personal divinity is measured by a character's Essence rating.#!\n\nIn [exalted_vs_princes_of_darkness|E] Essence Rating is a [trait_level_track_xp|E] of $glossary_exalted$ [trait|E] itself with levels ranging from 1 to 5. Essence Rating determinates maximum amount of Essence she can store at once.\n\nTo increase your Essence Rating you must use [journey|E] #V $exalted_essence_meditation_name$#! which will decrease your [essence_fluctuation|E] by #N [EmptyScope.ScriptValue('POD_essence_fluctuation_meditation_journey')]%#! for duration of it."

 game_concept_essence_fluctuation: "Essence Fluctuation"
 game_concept_essence_fluctuation_i: "@exalted_icon!"
 game_concept_essence_fluctuation_desc: "A unique mechanic for $glossary_exalted$. Essence Fluctuation is a percentage chance to gain or lose Essence every year.\n\nWhen Essence Fluctuation is #N negative#!, $glossary_exalted$ has chance equal to Essence Fluctuation to #N lose Essence#!, otherwise $glossary_exalted$ has chance equal to Essence Fluctuation to #P gain Essence#!.\n\nAdditionally, if Essence Fluctuation exceeds #V 100%#!; besides the normal percent chance to lose or gain Essence, $glossary_exalted$ will also have guaranteed Essence change equal to first number in Essence Fluctuation. #weak (254% = 2 Essence, 54% for another one)#!\n\nEssence Fluctuation starts at #V [EmptyScope.ScriptValue('POD_essence_fluctuation_base')]%#! and can be increased in few ways ranging from owning a specific [buildings|E], meeting requirements of your [essence_fluctuation_caste_condition|E] or being in [umbra|E].\n\nBut Essence Fluctuation can be also lowered; the main way being active [exalted_passive_charms|E]."
 game_concept_essence_fluctuation_chance: "[GetPlayer.MakeScope.GetScriptValueDesc('POD_essence_fluctuation_preview')]"

 game_concept_essence_fluctuation_caste_condition: "Caste Condition"
 game_concept_essence_fluctuation_caste_condition_desc: "Each $glossary_exalted_caste$ has their own unique conditions for [essence_fluctuation|E], if $glossary_exalted$ meets the condition of her Caste she will be rewarded #V +[EmptyScope.ScriptValue('POD_essence_fluctuation_caste_condition')]%#! for [essence_fluctuation|E]."

 game_concept_exalted_charms: "Charms"
 game_concept_exalted_charm: "Charm"
 game_concept_exalted_charms_desc: "#bold Charms#! are supernatural powers of $glossary_exalted$ originating from their Exaltation.\n\nIn [exalted_vs_princes_of_darkness|E] Charms are divided into two categories:\n$BULLET_WITH_TAB$Active Charms - Various [character_interaction|E] $glossary_exalted$ gain access through their [lifestyle|E]\n$BULLET_WITH_TAB$[exalted_passive_charms|E] - A unique power-system also obtained by buying [perks|E] in the [lifestyles|E] highly interconnected with [essence_fluctuation|E]."

 game_concept_exalted_passive_charms: "Passive Charms"
 game_concept_exalted_passive_charm: "Passive Charm"
 game_concept_exalted_passive_charms_desc: "$glossary_exalted$ live and they die by their Essence, without it they are just Mortals. To show that in [exalted_vs_princes_of_darkness|E] $glossary_exalted$ have almost no pure passive abilities, nor can they obtain pure [modifiers|E] from their [perks|E]. Instead $glossary_exalted$ must use #V Passive Charms#! to obtain these normally instant [modifiers|E] from their [perks|E].\n\nEach Passive Charm costs some amount of [essence_fluctuation|E], and are de-facto the main reason for it to exist.\n\nTo enable desired Passive Charm click on yourself and find #V $POD_manipulate_passive_charms_interaction$#!, doing that will open a menu in which you can select desires charms to enable. After you are done, click #V $CONFIRM$#! to finalize your choice. This will create a cooldown of #N 1 year#! during which you cannot change your Passive Charms."

 game_concept_terrestrial_exaltation: "Terrestrial Exaltation"
 game_concept_terrestrial_exaltation_desc: "Every [child|E] born from a parent which is either a [GetTrait('terrestrial_exalted').GetName(GetNullCharacter)] or [GetTrait('dragon_touched').GetName(GetNullCharacter)] has a chance to be born a [GetTrait('dragon_touched').GetName(GetNullCharacter)].\n\nThen every [GetTrait('dragon_touched').GetName(GetNullCharacter)] has a small chance to become a [GetTrait('terrestrial_exalted').GetName(GetNullCharacter)] upon their 16th birthday in process called #bold Terrestrial Exaltation#!.\n\nThe chance for Terrestrial Exaltation is by default only #V [EmptyScope.ScriptValue('POD_dragon_touched_exaltation_chance_base')]%#! meaning that any successfully Exaltation is very rare.\n\nIt is possible to increase Exaltation chance, and that is by having [capital|E] on a Dragon Nest. Each level increases the Exaltation chance by a small number, culminating at #V [EmptyScope.ScriptValue('POD_dragon_touched_exaltation_chance_dragon_nest_max')]%#!."
 
 game_concept_environmental_essence: "Environmental Essence"
 game_concept_environmental_essence_desc: "Unique resource for $glossary_exalted$ affecting their [domicile|E] and [essence_fluctuation|E].\n\nEvery [domicile_building|E] of $glossary_exalted$ besides standard [gold|E] and [prestige|E] also uses the Environmental Essence to be built.\n\nBy default [domicile|E] starts with #V 2#! Environmental Essence free to spend on [domicile_buildings|E]. To further increase it you must build and upgrade [Concept('domicile_building_upgrade', 'Internal Building')|E] inside the Main Hideout [domicile_building|E].\n\nAll unused Environmental Essence gets converted into [essence_fluctuation|E], with every #V 1 Environmental Essence#! becoming #V +5% [essence_fluctuation|E]#!"

 game_concept_exalted_ancient_sorcery: "Ancient Sorcery"
 game_concept_exalted_ancient_sorcery_ceremony: "Ceremony"
 game_concept_exalted_ancient_sorcery_desc: "#flavor The Age of Legends was a time of gods and demons, heroes and miracles... and of magic, great and wondrous magic which turned mighty rivers in their courses, called down storms which destroyed cities, and bent the very courts of the stars in the sky. But like most things from The Old Age, it too has been lost to time... But not entirely, some tomes still contain traces of forgotten magics. The secrets of Ancient Sorcery.#!\n\nAncient Sorcery, like [exalted_charms|E], are powers unique to $glossary_exalted$. But unlike Charms, Characters cannot focus on a [lifestyle|E] to slowly obtain [perks|E] inside it. Instead each [perk|E] has to be gained from a Ancient Tome(journal [artifacts|E]).\n\nObtaining an Ancient Tome isn't highly complex, there are in total #V 2#! ways with one appendix:\n$BULLET_WITH_TAB$Stealing it - Ancient Tomes are in the end, just [artifacts|E] which can be stolen. Additionally, some $glossary_exalted$ start the game with few Ancient Tomes already in possession.\n$BULLET_WITH_TAB$Visiting a Repository - Some [provinces|E], in many cases a libraries, contain Ancient Tome(s) inside them; As long you own that [province|E] or as landless have it's owner a patron. You can use [character_interaction|E] to visit it with hopes of obtaining a tome.\n\n$BULLET_WITH_TAB$Appendix - If you are too far away from a library or other [province|E] of interest. You always can start a #V Searching for Ancient Tome#! [journey|E] which after it's completion will grant a nearby [province|E] a random tome.\n\nTo study an Ancient Tome, you need to use #V $POD_study_ancient_tome_interaction$#! [character_interaction|E] which will start a [journey|E]. After it's completion, you will gain the [perk|E] mentioned in the [artifact|E]. The Tome itself will not be destroyed, and can be later given to other character.\n\nTo cast Ancient Sorcery, one must first use corresponding [character_interaction|E] and then wait out for duration of a [journey|E] before the effects of Sorcery are truly applied."