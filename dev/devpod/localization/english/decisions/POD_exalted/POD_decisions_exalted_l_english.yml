 transcendent_gaian_harmony_objective_decision: "Transcendent Gaian Harmony"
 transcendent_gaian_harmony_objective_decision_desc: "In the $glossary_exalted_age_of_legends$, there existed a [exalted_charm|E] that could allow $POD_splat_terrestrial_exalted$ to incorporate another element into their aspect. Rumors say that when $POD_splat_terrestrial_exalted$ incorporated every single element they could evolve into a brand new form more similar to Celestial Exalted."
 transcendent_gaian_harmony_objective_decision_discovered_desc: "\n\nLike most things from Old Age, Transcendent Gaian Harmony was also lost. But you managed to recreate it, at least partially in the new age. Though not perfect, you managed to incorporate another element into yourself.\n\nNow you only have to repeat your miracle."
 transcendent_gaian_harmony_objective_decision_undiscovered_desc: "\n\nBut like most things from Old Age, Transcendent Gaian Harmony is lost to time. But knowledge of it isn't completely lost, you know the basics of it. The idea behind it.\n\nMaybe you could recreate it in the new age?"
 transcendent_gaian_harmony_objective_decision_tooltip: "Transcending the Limits"
 transcendent_gaian_harmony_objective_decision_confirm: "Approaching the Elemental Dragons"
 transcendent_gaian_harmony_objective_decision_effect1: "You will be able to select an additional Aspect. This Aspect will be immune to $POD_most_beneficent_seed_of_five_dragons_interaction$ [character_interaction|E] and will be permanent."
 transcendent_gaian_harmony_objective_decision_effect2: "This [Concept('decision', 'Objective')|E] can be repeated #V 4#! times each time its requirements becoming harder. Upon completing this [Concept('decision', 'Objective')|E] 4th time you will become [GetTrait('immortal').GetName(GetNullCharacter)]."

 strike_open_the_earth_objective_decision: "Strike Open The Earth"
 strike_open_the_earth_objective_decision_desc: "The Five Magical Materials of $glossary_exalted_age_of_legends$ were unique, they were powerful, they were better than anything this age can offer. And like most things from old Age, they are gone.\n\nBut that doesn't have to be the case, with enough work we could maybe crystalize local elements into their corresponding True Jade."
 strike_open_the_earth_objective_decision_tooltip: "Magical Material of Legends"
 strike_open_the_earth_objective_decision_confirm: "Restoring the Old"

 reaffirm_heavens_praise_objective_decision: "Reaffirm Heaven's Praise"
 reaffirm_heavens_praise_objective_decision_desc: "Long ago, We $POD_splat_terrestrial_exalted$ had the god given right to rule the Creation. But ever since The $glossary_exalted_age_of_legends$ has ended, Heavens have forgotten their promise, or even their true nature. Now what remains of Heavens think of themselves as $POD_splat_spirit_plural$, blissfully ignorant about their nature as gods.\n\nThat cannot be, they have to remember, they have to be reminded of their promise to us."
 reaffirm_heavens_praise_objective_decision_tooltip: "Reaffirming the God Given Right"
 reaffirm_heavens_praise_objective_decision_confirm: "Right to rule the Creation."
 reaffirm_heavens_praise_objective_decision_custom1: "Total [skills|E] of your [spirit_companions|E] must exceed #V 200#! #weak ([SCOPE.GetValue('total_spirit_companion_skill')])#!"
 reaffirm_heavens_praise_objective_decision_custom2: "Total Spirit Rank of your [spirit_companions|E] must exceed #V 10#! #weak ([SCOPE.GetValue('total_spirit_companion_rank')])#!"
 reaffirm_heavens_praise_objective_decision_custom3: "You must have at least #V 5#! $POD_splat_spirit_plural$ as your [spirit_companions|E]"
 reaffirm_heavens_praise_objective_decision_custom4: "You must have at least #V 3#! $POD_splat_spirit$ [friends|E]."
 reaffirm_heavens_praise_objective_decision_custom5: "You must have a [best_friend|E] $POD_splat_spirit_plural$"
 reaffirm_heavens_praise_objective_decision_effect1: "A Rank 5 $POD_splat_spirit$ with high [skills|E] will be summoned to your [court|E]."

 restore_mothers_favor_objective_decision: "Restore Mother's Favor"
 restore_mothers_favor_objective_decision_desc: "Gaia, The Celestine of Earth, once was the great primordial which indirectly created the $POD_splat_terrestrial_exalted$. But all of that is a thing of the past, and Gaia has long forgotten about her children, and about the creations of theirs.\n\nBut we long for what we lost, for the favor and love of Gaia. Even if she is no longer the primordial, she still is our mother. And we will remind her of that, or at least try to."
 restore_mothers_favor_objective_decision_tooltip: "Restoring long lost Favor"
 restore_mothers_favor_objective_decision_confirm: "Restoring the unchanging."
 restore_mothers_favor_objective_decision_custom1: "There are less than #V 15#! $glossary_fera$ [independent_rulers|E] on the map that are not $glossary_wyrm$ servants #weak (#high [SCOPE.GetValue('gaian_fera_rulers_count')]#!)#!" 
 restore_mothers_favor_objective_decision_custom2: "You have #V 2#! or more positive [relation|E] with $glossary_fera$ that are not $glossary_wyrm$ servants"
 restore_mothers_favor_objective_decision_custom3: "There are less than #V 10#! $glossary_fera$ [independent_rulers|E] on the map that are not $glossary_wyrm$ servants #weak (#high [SCOPE.GetValue('gaian_fera_rulers_count')]#!)#!" 
 restore_mothers_favor_objective_decision_custom4: "Sum of all your [skills|E] must exceed #V 60#! #weak (#high [GetPlayer.MakeScope.ScriptValue('sum_of_all_skills_value')]#!)#!"
 restore_mothers_favor_objective_decision_custom5: "There are less than #V 5#! $glossary_fera$ [independent_rulers|E] on the map that are not $glossary_wyrm$ servants #weak (#high [SCOPE.GetValue('gaian_fera_rulers_count')]#!)#!" 
 restore_mothers_favor_objective_decision_custom6: "Average [development|E] of your [realm|E] must not exceed #V 15#! #weak (#high [SCOPE.GetValue('average_development')]#!)#!"
 restore_mothers_favor_objective_decision_custom7: "There are no $glossary_fera$ [independent_rulers|E] on the map that are not $glossary_wyrm$ servants #weak (#high [SCOPE.GetValue('gaian_fera_rulers_count')]#!)#!" 
 restore_mothers_favor_objective_decision_custom8: "You haven't killed or declared [war|E] a/against $glossary_fera$ that wasn't $glossary_wyrm$ servant past #V 100#! years"

 #################################################
 ################   IMMACULATES   ################
 #################################################

 formulate_the_great_plan_objective_decision: "Formulate the Great Plan"
 formulate_the_great_plan_objective_decision_desc: "Once Gaia was the Primordial, and the indirect patroness of all $POD_splat_terrestrial_exalted_plural$. But she had forgotten all of that, she had lost her position as the Primordial of Creation. She convinced herself to be a mere Celestine.\n\nWe, the [GetFaithByKey('immaculates').GetName], cannot live with that. Gaia is and always will be our Mother, our Primordial. So we sought a way to make her remember, but we always failed. Our current best solution is to resurrect Gaia's children, The Five Immaculate Dragons, but even that is still shrouded in mystery\n\nBut if you were to create environment suitable for extended brain-storming and gather enough great minds maybe you could formulate exact step-by-step plan to reach our reason for existence?"
 formulate_the_great_plan_objective_decision_tooltip: "Path destined to Succeed"
 formulate_the_great_plan_objective_decision_confirm: "The Greatest Plan"
 formulate_the_great_plan_objective_decision_custom1: "Your or Your [coterie|E]'s [learning|E] is @skill_learning_icon!#V 25#! or above"
 formulate_the_great_plan_objective_decision_custom2: "Total [learning|E] of your [coterie|E] must exceed @skill_learning_icon!#V 60#! #weak ([SCOPE.GetValue('total_coterie_learning')])#!"
 formulate_the_great_plan_objective_decision_custom3: "You must directly own a [province|E] with [GetBuilding('exalted_immaculate_libraries_05').GetName] or its upgrades."
 formulate_the_great_plan_objective_decision_effect: "Unlock next objective for all [GetFaithByKey('immaculates').GetName]"

 the_seed_of_a_dragon_objective_decision: "The Seed of a Dragon"
 the_seed_of_a_dragon_objective_decision_desc: "Resurrecting a Immaculate Dragon is undoubtedly hard, but it is something we had thought about for a long time. Unfortunately, we never had any actual plans for doing it.\n\nBut that has changed with formulation of The Great Plan, now we have a plan which could work. It only requires amounts of Essence comparable to $glossary_exalted_age_of_legends$, a suitable sacrifice willing to incubate and store a 'Seed'/Embryo of a Dragon inside their body; something that will kill them when times come for resurrection; and complex ritual which will exhaust Essence of even the strongest Terrestrial on the planet. All of that only to create and safely store an 'Seed' suitable for next step.\n\nThis does sounds crazy, but it is something we have to do so one day we may once again bask in the glory of Gaia."
 the_seed_of_a_dragon_objective_decision_tooltip: "Imbuing human with Essence of a Dragon"
 the_seed_of_a_dragon_objective_decision_confirm: "Begin the ritual"
 the_seed_of_a_dragon_objective_decision_custom0: "Is #V your#! Child, Grandchild, Great Grandchild, [friend|E] or [best_friend|E]"
 the_seed_of_a_dragon_objective_decision_custom1: "Your [capital|E] must have a [GetBuilding('dragon_nest_06').GetName|V] or its upgrades."
 the_seed_of_a_dragon_objective_decision_custom2: "Your [capital|E] must above #V 100#! [county_control|E]."
 the_seed_of_a_dragon_objective_decision_custom3: "You must directly own at least #V 2#! [GetBuilding('dragon_nest_04').GetName] or higher besides one in your [capital|E]."
 the_seed_of_a_dragon_objective_decision_custom4: "Has the Trait: [GetTrait('terrestrial_aspect_air').GetName(GetNullCharacter)] and [diplomacy|E] is #V @skill_diplomacy_icon!15#! or above"
 the_seed_of_a_dragon_objective_decision_custom5: "Has the Trait: [GetTrait('terrestrial_aspect_earth').GetName(GetNullCharacter)] and [stewardship|E] is #V @skill_stewardship_icon!15#! or above"
 the_seed_of_a_dragon_objective_decision_custom6: "Has the Trait: [GetTrait('terrestrial_aspect_fire').GetName(GetNullCharacter)] and [martial|E] is #V @skill_martial_icon!15#! or above"
 the_seed_of_a_dragon_objective_decision_custom7: "Has the Trait: [GetTrait('terrestrial_aspect_water').GetName(GetNullCharacter)] and [intrigue|E] is #V @skill_intrigue_icon!15#! or above"
 the_seed_of_a_dragon_objective_decision_custom8: "Has the Trait: [GetTrait('terrestrial_aspect_wood').GetName(GetNullCharacter)] and [learning|E] is #V @skill_learning_icon!15#! or above"
 the_seed_of_a_dragon_objective_decision_effect1: "You will sacrifice one [courtier|E] that meets all the requirements, imbuing them with Seed of a Dragon and forcing them into seclusion(death)."
 the_seed_of_a_dragon_objective_decision_effect2: "Based on Aspect of sacrificed [courtier|E], your [capital|E] will gain corresponding [modifier|E] ([GetModifier('slumbering_seed_of_mela').GetNameWithTooltip] for [GetTrait('terrestrial_aspect_air').GetName(GetNullCharacter)] etc.)"
 the_seed_of_a_dragon_objective_decision_effect3: "Two dragon nests, besides one in your [capital|E], that are at least Level #V 4([GetBuilding('dragon_nest_04').GetName])#! will be #N destroyed#! together with all $POD_splat_terrestrial_exalted$ unique [buildings|E]"

 the_birth_of_elemental_dragon_objective_decision: "The Birth of Elemental Dragon"
 the_birth_of_elemental_dragon_objective_decision_desc: "We have a Seed of A Dragon, meaning we can continue our plan; the rebirth of one of our Immaculate ancestors. But forcedly making the seed sprout into a glorious dragon isn't something easy, one could even say that this is harder than every previous step combined. Still, it is something we need to do for Gaia to remember us.\n\nBut saying so is much easier than doing it, we will need even more Essence than the previous step, so much that anything around the hatching zone and the sources will be obliterated due to sheer amount of energy released. Additionally, we need a group of powerful Dragon-Blooded to both subsidize the Elements into the Seed and control the ungodly amounts of Essence that are required.\n\nIf everything goes as planned, at cost of only few thousands mortal lives and few Dragon Nests we will resurrect a Immaculate Dragon."
 the_birth_of_elemental_dragon_objective_decision_tooltip: "Welcome back, The Child of Gaia."
 the_birth_of_elemental_dragon_objective_decision_confirm: "It is time."
 the_birth_of_elemental_dragon_objective_decision_custom0: "Is not in the [county|E] in which the seed is located."
 the_birth_of_elemental_dragon_objective_decision_custom1: "[county|E] in which the Seed is located must have [GetBuilding('dragon_nest_07').GetName|V] and at least #V 100#! [county_control|E]"
 the_birth_of_elemental_dragon_objective_decision_custom2: "Your [coterie|E] must have in total #V 3#! members that are $POD_splat_terrestrial_exalted$ with [essence_rating|E] of #V 5#!"
 the_birth_of_elemental_dragon_objective_decision_custom3: "Total [skill|E] points of your [coterie|E] must exceed #V 300#! #weak ([SCOPE.GetValue('total_coterie_skill')])#!"
 the_birth_of_elemental_dragon_objective_decision_effect1: "Your [capital|E] and the Three Dragon Nests used as energy sources will be completely #N devastated#! destroying all [buildings|E] and removing all [development|E]."
 the_birth_of_elemental_dragon_objective_decision_effect2: "All $POD_splat_hunter$ [faiths|E] will now consider Exaltation Evil."
 the_birth_of_elemental_dragon_objective_decision_effect3: "All $POD_splat_vampire$ [faiths|E] that value masquerade will now consider Exaltation Criminal."
 the_birth_of_elemental_dragon_objective_decision_effect4: "Newly resurrected Mela will join your [court|E] as $POD_splat_terrestrial_exalted$, they will have high [skills|E] especially [diplomacy|E] and be Truly [GetTrait('immortal').GetName(GetNullCharacter)]."
 the_birth_of_elemental_dragon_objective_decision_effect5: "Newly resurrected Pasiap will join your [court|E] as $POD_splat_terrestrial_exalted$, they will have high [skills|E] especially [stewardship|E] and be Truly [GetTrait('immortal').GetName(GetNullCharacter)]."
 the_birth_of_elemental_dragon_objective_decision_effect6: "Newly resurrected Hesiesh will join your [court|E] as $POD_splat_terrestrial_exalted$, they will have high [skills|E] especially [martial|E] and be Truly [GetTrait('immortal').GetName(GetNullCharacter)]."
 the_birth_of_elemental_dragon_objective_decision_effect7: "Newly resurrected Daana'd will join your [court|E] as $POD_splat_terrestrial_exalted$, they will have high [skills|E] especially [intrigue|E] and be Truly [GetTrait('immortal').GetName(GetNullCharacter)]."
 the_birth_of_elemental_dragon_objective_decision_effect8: "Newly resurrected Sextes Jylis will join your [court|E] as $POD_splat_terrestrial_exalted$, they will have high [skills|E] especially [learning|E] and be Truly [GetTrait('immortal').GetName(GetNullCharacter)]."

 reunion_with_gaia_objective_decision: "Reunion with Gaia"
 reunion_with_gaia_objective_decision_desc: "We have done something that even in the $glossary_exalted_age_of_legends$ would turn heads, we resurrected Five Immaculate Dragons from their tombs in the age that should not allow their existence. The Great Plan is almost completed, there is just a small last step between us and Gaia.\n\nThat is actually arranging the meeting between us, the Five Dragons and Gaia herself. That should be much easier than previous steps, and as for if Gaia will remember? If she will return to her rightful position of a Primordial? She will, she doesn't have a say in this."
 reunion_with_gaia_objective_decision_tooltip: "A moment of peace"
 reunion_with_gaia_objective_decision_confirm: "We came to talk."
 reunion_with_gaia_objective_decision_custom1: "All Five [GetModifier('POD_immaculate_dragon_modifier').GetNameWithTooltip]s must be your [courtier|E]"
 reunion_with_gaia_objective_decision_custom1_ex: "$reunion_with_gaia_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 reunion_with_gaia_objective_decision_custom2: "All Five [GetModifier('POD_immaculate_dragon_modifier').GetNameWithTooltip]s must have #V 100#! [opinion|E] of you"
 reunion_with_gaia_objective_decision_custom2_ex: "$reunion_with_gaia_objective_decision_custom2$ #weak ([example.GetFirstName])#!"
 reunion_with_gaia_objective_decision_custom3: "You have #V 3#! or more positive [relation|E] with $glossary_fera$ that are not $glossary_wyrm$ servants #weak ([SCOPE.GetValue('positive_fera_relation_count')])#!"
 reunion_with_gaia_objective_decision_custom4: "You have #V 2#! or more positive [relation|E] with $POD_splat_spirit$ that are not $glossary_wyrm$ servants #weak ([SCOPE.GetValue('positive_spirit_relation_count')])#!"
