 transcendent_gaian_harmony_objective_decision: "Transcendent Gaian Harmony"
 transcendent_gaian_harmony_objective_decision_desc: "In the Age of Legends, there existed a [exalted_charm|E] that could allow $POD_splat_terrestrial_exalted$ to incorporate another element into their aspect. Rumors say that when $POD_splat_terrestrial_exalted$ incorporated every single element they could evolve into a brand new form more similar to Celestial Exalted."
 transcendent_gaian_harmony_objective_decision_discovered_desc: "\n\nLike most things from Old Age, Transcendent Gaian Harmony was also lost. But you managed to recreate it, at least partially in the new age. Though not perfect, you managed to incorporate another element into yourself.\n\nNow you only have to repeat your miracle."
 transcendent_gaian_harmony_objective_decision_undiscovered_desc: "\n\nBut like most things from Old Age, Transcendent Gaian Harmony is lost to time. But knowledge of it isn't completely lost, you know the basics of it. The idea behind it.\n\nMaybe you could recreate it in the new age?"
 transcendent_gaian_harmony_objective_decision_tooltip: "Transcending the Limits"
 transcendent_gaian_harmony_objective_decision_confirm: "Approaching the Elemental Dragons"
 transcendent_gaian_harmony_objective_decision_effect1: "You will be able to select an additional Aspect. This Aspect will be immune to $POD_most_beneficent_seed_of_five_dragons_interaction$ [character_interaction|E] and will be permanent."
 transcendent_gaian_harmony_objective_decision_effect2: "This [Concept('decision', 'Objective')|E] can be repeated #V 4#! times each time it's requirements becoming harder. Upon completing this [Concept('decision', 'Objective')|E] 4th time you will become [GetTrait('immortal').GetName(GetNullCharacter)]."

 strike_open_the_earth_objective_decision: "Strike Open The Earth"
 strike_open_the_earth_objective_decision_desc: "The Five Magical Materials of Age of Legends were unique, they were powerful, they were better than anything this age can offer. And like most things from old Age, they are gone.\n\nBut that doesn't have to be the case, with enough work we could maybe crystalize local elements into their corresponding True Jade."
 strike_open_the_earth_objective_decision_tooltip: "Magical Material of Legends"
 strike_open_the_earth_objective_decision_confirm: "Restoring the Old"

 reaffirm_heavens_praise_objective_decision: "Reaffirm Heaven's Praise"
 reaffirm_heavens_praise_objective_decision_desc: "Long ago, We $POD_splat_terrestrial_exalted$ had the god given right to rule the Creation. But ever since The Age of Legends has ended, Heavens have forgotten their promise, or even their true nature. Now what remains of Heavens think of themselves as $POD_splat_spirit_plural$, blissfully ignorant about their nature as gods.\n\nThat cannot be, they have to remember, they have to be reminded of their promise to us."
 reaffirm_heavens_praise_objective_decision_tooltip: "Reaffirming the God Given Right"
 reaffirm_heavens_praise_objective_decision_confirm: "Right to rule the Creation."
 reaffirm_heavens_praise_objective_decision_custom1: "Total [skills|E] of your [spirit_companions|E] must exceed #V 200#! #weak ([SCOPE.GetValue('total_spirit_companion_skill')])#!"
 reaffirm_heavens_praise_objective_decision_custom2: "Total Spirit Rank of your [spirit_companions|E] must exceed #V 10#! #weak ([SCOPE.GetValue('total_spirit_companion_rank')])#!"
 reaffirm_heavens_praise_objective_decision_custom3: "You must have at least #V 5#! $POD_splat_spirit_plural$ as your [spirit_companions|E]"
 reaffirm_heavens_praise_objective_decision_custom4: "You must have at least #V 3#! $POD_splat_spirit$ [friends|E]."
 reaffirm_heavens_praise_objective_decision_custom5: "You must have a [best_friend|E] $POD_splat_spirit_plural$"
 reaffirm_heavens_praise_objective_decision_effect1: "A Rank 5 $POD_splat_spirit$ with high [skills|E] will be summoned to your [court|E]."

 restore_mothers_favor_objective_decision: "Restore Mother's Favor"
 restore_mothers_favor_objective_decision_desc: "Gaia, The Celestine of Earth, once was the great primordial which indirectly created the $POD_splat_terrestrial_exalted$. But all of that is a thing of the past, and Gaia has long forgotten about her children, and about the creations of theirs.\n\nBut we long for what we lost, for the favor and love of Gaia. Even if she is no longer the primordial, she still is our mother. And we will remind her of that, or at least try to."
 restore_mothers_favor_objective_decision_tooltip: "Restoring long lost Favor"
 restore_mothers_favor_objective_decision_confirm: "Restoring the unchanging."
 restore_mothers_favor_objective_decision_custom1: "There are less than #V 15#! $glossary_fera$ [independent_rulers|E] on the map that are not $glossary_wyrm$ servants #weak (#high [SCOPE.GetValue('gaian_fera_rulers_count')]#!)#!" 
 restore_mothers_favor_objective_decision_custom2: "You have #V 2#! or more positive [relation|E] with $glossary_fera$ that are not $glossary_wyrm$ servants"
 restore_mothers_favor_objective_decision_custom3: "There are less than #V 10#! $glossary_fera$ [independent_rulers|E] on the map that are not $glossary_wyrm$ servants #weak (#high [SCOPE.GetValue('gaian_fera_rulers_count')]#!)#!" 
 restore_mothers_favor_objective_decision_custom4: "Sum of all your [skills|E] must exceed #V 60#! #weak (#high [GetPlayer.MakeScope.ScriptValue('sum_of_all_skills_value')]#!)#!"
 restore_mothers_favor_objective_decision_custom5: "There are less than #V 5#! $glossary_fera$ [independent_rulers|E] on the map that are not $glossary_wyrm$ servants #weak (#high [SCOPE.GetValue('gaian_fera_rulers_count')]#!)#!" 
 restore_mothers_favor_objective_decision_custom6: "Average [development|E] of your [realm|E] must not exceed #V 15#! #weak (#high [SCOPE.GetValue('average_development')]#!)#!"
 restore_mothers_favor_objective_decision_custom7: "There are no $glossary_fera$ [independent_rulers|E] on the map that are not $glossary_wyrm$ servants #weak (#high [SCOPE.GetValue('gaian_fera_rulers_count')]#!)#!" 
 restore_mothers_favor_objective_decision_custom8: "You haven't killed or declared [war|E] a/against $glossary_fera$ that wasn't $glossary_wyrm$ servant past #V 100#! years"