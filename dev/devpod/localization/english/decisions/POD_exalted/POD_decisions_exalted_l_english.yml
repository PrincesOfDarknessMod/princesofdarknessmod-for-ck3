 the_decision_of_the_scarlet_phoenix_objective_decision: "The Decision of the Scarlet Phoenix"
 the_decision_of_the_scarlet_phoenix_objective_decision_desc: "The truth of the Scarlet Phoenix destroyed out belief...\n\nBut we cannot stop. No matter how great of a monster she became, she was our empress long ago. And what is most important, she did not end the creation; even if she could... We will bring her back, we will forgive the monster what it did.\n\nStill, the location of her sealed soul is unknown to us. The only clue we could find are weird Essence signature in the [UmbraGlossaryLocalized('shadowlands','Underworld')], maybe that will lead us somewhere?"
 the_decision_of_the_scarlet_phoenix_objective_decision_tooltip: "The decision to help"
 the_decision_of_the_scarlet_phoenix_objective_decision_confirm: "Forgiving the Monster"
 the_decision_of_the_scarlet_phoenix_objective_decision_custom1: "You must have a [GetTrait('lasombra').GetName(GetNullCharacter)] as a [friend|E], [best_friend|E], [lover|E], [soulmate|E] or [coterie|E] member"
 the_decision_of_the_scarlet_phoenix_objective_decision_custom2: "You must have a [GetTrait('wraith').GetName(GetNullCharacter)] as a [friend|E], [best_friend|E], [lover|E], [soulmate|E] or [coterie|E] member"
 the_decision_of_the_scarlet_phoenix_objective_decision_custom3: "Your current location, or any of your [realm|E] [counties|E] must have Shroud equal or below #V 2#!"
 the_decision_of_the_scarlet_phoenix_objective_decision_effect1: "Replace [GetFaithDoctrine('special_uncertain_future_doctrine').GetBaseName] with [GetFaithDoctrine('special_certain_future_doctrine').GetBaseName]"
 the_decision_of_the_scarlet_phoenix_objective_decision_effect2: "Unlock #V $the_commitment_of_the_scarlet_phoenix_objective_decision$#! objective"

 the_commitment_of_the_scarlet_phoenix_objective_decision: "The Commitment of the Scarlet Phoenix"
 the_commitment_of_the_scarlet_phoenix_objective_decision_desc: "Everything we do for the Scarlet Phoenix always resulted in a greater despair...\n\nFirst we found that she was the one to burn our world to ashes... Then we found that her soul is located #italic beneath#! the [UmbraGlossary('oblivion')]...\n\nYet... We cannot stop; for on the other side is the paradise. This will always be a one way trip... No matter the preparations, anyone attempting the final commitment to save her will die...\n\nSomeone will have to die, and that will be me."
 the_commitment_of_the_scarlet_phoenix_objective_decision_tooltip: "The commitment to help"
 the_commitment_of_the_scarlet_phoenix_objective_decision_confirm: "Throwing yourself to hell to see the paradise"
 the_commitment_of_the_scarlet_phoenix_objective_decision_custom1: "Your [stress|E] must equal #V 0#!"
 the_commitment_of_the_scarlet_phoenix_objective_decision_effect1: "You will embark on a insanely difficult journey towards the [UmbraGlossary('oblivion')] and past it. To find the soul of the Scarlet Phoenix and release her."
 the_commitment_of_the_scarlet_phoenix_objective_decision_effect2: "#X @warning_icon! This objective will end #bold badly#! if you are unprepared. Do not attempt with a weak character, you will die. You have been warned.#!\n"
 the_commitment_of_the_scarlet_phoenix_objective_decision_effect3: "If you succeed in releasing the soul from her tomb: #g"
 the_commitment_of_the_scarlet_phoenix_objective_decision_effect4: "Replace [GetFaithDoctrine('special_certain_future_doctrine').GetBaseName] with [GetFaithDoctrine('special_heroes_of_the_scarlet_phoenix_doctrine').GetBaseName]"
 the_commitment_of_the_scarlet_phoenix_objective_decision_effect5: "The Scarlet Phoenix awakens once more, the Gates of heaven now only require the Ebon Dragon to be opened.#g"

 the_grand_ceremony_objective_decision: "The Grand Ceremony"
 the_grand_ceremony_objective_decision_desc: "The time has come.\n\nThe Ebon Dragon gained a new Fetich soul, one suited to the $glossary_exalted_primordial$. The Scarlet Phoenix has been reunited with her souls and forgiven for her sins.\n\nBoth now reside in the heaven, on the other side of the gates... And we have been invited for their wedding. Only one thing remain, and that is to find good clothes for the grand ceremony... As well as prepare myself to the new age."
 the_grand_ceremony_objective_decision_tooltip: "The wedding at the Heavens"
 the_grand_ceremony_objective_decision_confirm: "Open what was closed long ago"
 the_grand_ceremony_objective_decision_effect1: "The Gates of Heaven are opened, The Wheel of Ages spins. Fifth Age, Fourth Age, Third Age... The First Age. And the world is made anew.#N @warning_icon!The game will end, the paradise begins.#!"

 the_new_beginning_objective_decision: "The New Beginning"
 the_new_beginning_objective_decision_desc: "Our time has ended long ago; yet we still are clinging to $glossary_exalted_age_of_legends$ like it would magically return.\n\nAnd look where it took us? To the very edge of our grave.\n\nThat cannot be allowed to continue, we are at the edge of extinction; this is not the time for grand ideals. This is the time to wake up, we need to secure a position in the new world, as the old one will not return; nor do we want it to."
 the_new_beginning_objective_decision_tooltip: "A beginning of brighter future"
 the_new_beginning_objective_decision_confirm: "A Shining Example"
 the_new_beginning_objective_decision_custom1: "You must directly own a [province|E] with [GetBuilding('dragon_nest_04').GetName] or better"
 the_new_beginning_objective_decision_custom2: "At least #V 1#! [child|E] of yours are [GetTrait('terrestrial_exalted').GetName(GetNullCharacter)]"
 the_new_beginning_objective_decision_effect1: "Unlock #V $a_new_way_of_life_objective_decision$#! objective"
 the_new_beginning_objective_decision_effect2: "Unlock #V The New Order#! objective"
 the_new_beginning_objective_decision_effect3: "Unlock #V The Issue of Population#! objective"

 a_new_way_of_life_objective_decision: "A New Way of Life"
 a_new_way_of_life_objective_decision_desc: "Though it is painful to realize, we are fossils from the time long gone; still clinging to our old methods and ways to deal with problems both ancient and new.\n\nBut to survive, we cannot stand on the high moral ground. We must adapt to the new ways, to the new methods of living. We must change ourselves to fit the new paradigm and maybe, just maybe; The new ways are better than what we do currently?"
 a_new_way_of_life_objective_decision_tooltip: "Because stagnation is a sin."
 a_new_way_of_life_objective_decision_confirm: "Learning the ways of modern times"
 a_new_way_of_life_objective_decision_custom1: "Your highest [skill|E] must exceed #V 20#! excluding [prowess|E]"
 a_new_way_of_life_objective_decision_custom2: "You or your [coterie|E] member has a [education_trait|E] of level #V 4#! or higher"
 a_new_way_of_life_objective_decision_custom3: "You or your [coterie|E] member has at least #V 1#! [lifestyle_trait|E] given upon completion of [lifestyle|E] tree"
 a_new_way_of_life_objective_decision_effect1: "Unlock #V $magic_of_the_modern_age_objective_decision$#! objective"

 magic_of_the_modern_age_objective_decision: "Magic of The Modern Age"
 magic_of_the_modern_age_objective_decision_desc: "[exalted_ancient_sorcery|E] is dying, with each year more and more secrets are forever lost to time.\n\nBut maybe, this isn't as bad as we think it is. Because it forces us to find a way out, and we found one. The Modern Age has created a perfect replacement, with even greater utility and accessibility than our current ways!\n\nThat would be, if we could use it. But we cannot, for one reason or another we are fully unable to put the knowledge of modern sorcery to practice. We are missing something crucial, and we have to find it before the [exalted_ancient_sorcery|E] is fully lost."
 magic_of_the_modern_age_objective_decision_tooltip: "Magic is the same, regardless of age."
 magic_of_the_modern_age_objective_decision_confirm: "New Magic, Old Sorcery"
 magic_of_the_modern_age_objective_decision_custom1: "At least #V 3#! [courtiers|E] of yours are #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Sorcerers#!#!"
