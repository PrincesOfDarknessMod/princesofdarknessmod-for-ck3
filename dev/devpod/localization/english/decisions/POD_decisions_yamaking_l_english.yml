l_english:
 new_yama_king_objective_decision: "Birth of a New [Glossary('Yama King','podgloss.yamaking')]"
 new_yama_king_objective_decision_desc: "[Glossary('Yama Kings','podgloss.yamaking')] are the supreme wardens of Yomi Wan, and largely fallen servants of the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] who, discovering that chi could be extracted from human souls through torture, adopted such techniques to extract that energy. Their original task of punishing the sinners was thus corrupted into accumulating power for themselves in a bid to become the [Glossary('Demon Emperor','podgloss.demonemperor')].\n\nThe hierarchy of these beings change given time as old ones are defeated by newer ones whose rise is often tied to some major upheaval in the mortal world. It is rumored that any creature can become a [Glossary('Yama King','podgloss.yamaking')] as for example [Glossary('Mikaboshi','podgloss.mikaboshi')] was first a mage while Ravana is speculated to have been first a vampire."
 new_yama_king_objective_decision_tooltip: "Why serve when you can control?"
 new_yama_king_objective_decision_confirm: "It's good to be (Yama) King."
 new_yama_king_objective_decision_custom1: "Total sum of your bound wraith skills must exceed 200."
 new_yama_king_objective_decision_custom2: "Your [umbra_aptitude|E] must exceed $pod_grace_i$#V 75#!"
 new_yama_king_objective_decision_custom3: "You have to be a [defiled|E] of exiting [GetTrait('yamaking').GetName(GetNullCharacter)] on map."
 new_yama_king_objective_decision_custom4: "Because you are #N NOT#! an [akuma|E], you need to achieve these requirements:
 new_yama_king_objective_decision_effect: "You will start a great battle against an existing [Glossary('Yama King','podgloss.yamaking')] over their domain. Be warned, they won't go down without a serious fight."

 POD_yamaking_objective_decision_effect1: "Increase the combined [defiled_quality|E] requirement for other objectives by #V 50#!"
 POD_yamaking_objective_decision_effect2: "One of the four keys to ascending as the [Glossary('Demon Emperor','podgloss.demonemperor')] is collected."

 POD_yamaking_great_yomi_objective_decision: "A Prison fit for an Emperor"
 POD_yamaking_great_yomi_objective_decision_tooltip: "My reach over Yomi must grow."
 POD_yamaking_great_yomi_objective_decision_desc: "There are many Hells in [UmbraGlossaryLocalized('yomi_wan','Yomi Wan')], most are obscure and small with unknown [Glossary('Yama King','podgloss.yamaking')] ruling over it.\n\nYour Yomi was exactly the same, your name didn't mean anything and your Yomi wasn't known by the greater population of the Middle Kingdom, but no longer.\nYour Yomi has grown, and is now fit for the future throne of the [Glossary('Demon Emperor','podgloss.demonemperor')]."
 POD_yamaking_great_yomi_objective_decision_confirm: "My ascension continues."
 POD_yamaking_great_yomi_objective_decision_custom1: "Your [domicile|E] needs to have at least #V 3#! #bold level 6#! [domicile_buildings|E]"
 POD_great_yomi_modifier: "Ruler of Great Yomi"

 POD_yamaking_dealing_with_competition_objective_decision: "Dealing with the Competition"
 POD_yamaking_dealing_with_competition_objective_decision_tooltip: "There are too many in this battle for the throne"
 POD_yamaking_dealing_with_competition_objective_decision_desc: "You are not the greatest [Glossary('Yama King','podgloss.yamaking')] there is. You know that, and you also know that it isn't possible to totally exterminate all the competition in this battle for the unholy throne.\n\nBut reducing the number of rivals is absolutely possible, and you aren't the first [Glossary('Yama King','podgloss.yamaking')] that thought about it, but you will be the first to eliminate all the small players in this race for the [Glossary('Demon Emperor','podgloss.demonemperor')]."
 POD_yamaking_dealing_with_competition_objective_decision_confirm: "Only the strong remains."
 POD_yamaking_dealing_with_competition_objective_decision_custom1_ex: "$POD_yamaking_dealing_with_competition_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 POD_yamaking_dealing_with_competition_objective_decision_custom1: "There cannot be any [landed|E] #weak or with above #bold 40#! combined [defiled_quality|E]#! [GetTrait('yamaking').GetName(GetNullCharacter)]"
 POD_dealing_with_competition_modifier: "Ahead of the Pack"

 POD_yamaking_perfect_devil_objective_decision: "Perfected Devil"
 POD_yamaking_perfect_devil_objective_decision_tooltip: "Infernal Perfection"
 POD_yamaking_perfect_devil_objective_decision_desc: "Your goal is simple, becoming the [Glossary('Demon Emperor','podgloss.demonemperor')]. But achieving that goal is anything but simple and you will need to scheme, murder and expand everything that is yours.\nThat includes your personal strength, and all the panoplies you gathered from the Middle Kingdom as your tools of corruption.\n\nThe final battle for the throne will be a test like no other but you intent to be prepared."
 POD_yamaking_perfect_devil_objective_decision_confirm: "Perfection in Yomi"
 POD_perfect_devil_modifier: "Perfect Devil"
 POD_perfect_devil_modifier_desc: "Reduce Panoply [character_interaction|E] [dread|E] cost by #P 30%#!"

 POD_yamaking_breaching_the_middle_kingdom_objective_decision: "Breaching the Middle Kingdom"
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_tooltip: "The August Wall isn't indestructible."
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_desc: "The [Glossary('Yama Kings','podgloss.yamaking')] have always been stopped from interfering outside of Asia by a seemingly indestructible spiritual barrier.\nWhile speculation abound about the origin of this protection, the true goal is to find a way to breach it. Who better for that task than the denizens of the land beyond the Middle Kingdom?"
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_confirm: "A new world in front of us."
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_custom1: "You need to have at least #V 10#! $POD_splat_vampire_plural$ [prisoners|E] with at least [GetTrait('vampgeneration7').GetName(GetNullCharacter)] or lower."
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_custom2: "You need to have #V 2#! [defiled|E] $POD_splat_vampire_plural$ with at least #bold 25#! [defiled_quality|E]"
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_effect1: "You will be able to interact with characters outside of the Middle Kingdom, you also won't get [GetModifier('POD_yamaking_outside_middle_kingdom_modifier').GetNameWithTooltip] in [counties|E] outside of the Middle Kingdom."

 POD_yamaking_claiming_rightful_throne_objective_decision: "Claiming Your Rightful Throne"
 POD_yamaking_claiming_rightful_throne_objective_decision_tooltip: "Apotheosis"
 POD_yamaking_claiming_rightful_throne_objective_decision_desc: "The throne of the [Glossary('Demon Emperor','podgloss.demonemperor')] is in reach. Your power has grown enough to put you in the lead but you know that the race isn't over yet.\n\nThe [Glossary('Kuei-Jin','game_concept_kuei_jin_desc')] and their August Courts will not stand idle as their worst nightmare is close to fruition.\n\nWorse perhaps, the other [Glossary('Yama Kings','podgloss.yamaking')] still active will likely take notice and might even bend together to stop you..."
 POD_yamaking_claiming_rightful_throne_objective_decision_confirm: "The final step."
 POD_yamaking_claiming_rightful_throne_objective_decision_custom1: "Your total [skills|E] must exceed #V 80#! #weak ([GetPlayer.MakeScope.ScriptValue('sum_of_all_skills_value')|0])#!"
 POD_yamaking_claiming_rightful_throne_objective_decision_custom2: "The Quincunx [title|E] must not exist"
 POD_yamaking_claiming_rightful_throne_objective_decision_custom3: "The Scarlet Phoenix, Azure Dragon, Yellow Emperor, Black Tortoise and White Tiger Courts [titles|E] must be destroyed"
 POD_yamaking_claiming_rightful_throne_objective_decision.a: "Emperor of the Final Age"
 POD_yamaking_claiming_rightful_throne_objective_decision.b: "God of the Sixth Age"
 POD_claiming_rightful_throne_modifier: "Demon [Glossary('Emperor','podgloss.demonemperor')]"
 POD_claiming_rightful_throne_modifier_desc: "Reduce Panoply [character_interaction|E] [dread|E] cost by #P 100%#!"