l_english:
 new_yama_king_objective_decision: "Birth of a New [Glossary('Yama King','podgloss.yamaking')]"
 new_yama_king_objective_decision_desc: "[Glossary('Yama Kings','podgloss.yamaking')] are the supreme wardens of Yomi Wan, and largely fallen servants of the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] who, discovering that chi could be extracted from human souls through torture, adopted such techniques to extract that energy. They are known as banes in the West, while those of Yin are called Malfeans by western wraiths.\nThe hierarchy of these beings change given time as old ones are defeated by newer ones whose rise is often tied to some major upheaval in the mortal world."
 new_yama_king_objective_decision_tooltip: "Why serve when you can control?"
 new_yama_king_objective_decision_confirm: "It's good to be (Yama) King."
 new_yama_king_objective_decision_custom1: "Total sum of your bound wraith skills must exceed 200."
 new_yama_king_objective_decision_custom2: "Your [umbra_aptitude|E] must exceed $pod_grace_i$#V 75#!"
 new_yama_king_objective_decision_custom3: "You have to be [defiled|E] of exiting [GetTrait('yamaking').GetName(GetNullCharacter)] on map."
 new_yama_king_objective_decision_custom4: "Because you are #N NOT#! an [akuma|E], you need to achieve these requirements:
 new_yama_king_objective_decision_effect: "You will start a great battle against an existing [Glossary('Yama King','podgloss.yamaking')] over their domain. Be warned, they won't go down without a serious fight."

 POD_yamaking_objective_decision_effect1: "Increase Combined [defiled_quality|E] requirement for other objectives by #V 50#!"
 POD_yamaking_objective_decision_effect2: "One of Four keys to becoming [Glossary('Demon Emperor','podgloss.demonemperor')] is collected"

 POD_yamaking_great_yomi_objective_decision: "Great Yomi"
 POD_yamaking_great_yomi_objective_decision_tooltip: "One of The Greatest"
 POD_yamaking_great_yomi_objective_decision_desc: "There are many Hells in [UmbraGlossaryLocalized('yomi_wan','Yomi Wan')], most some obscure and small with unknown [Glossary('Yama King','podgloss.yamaking')] ruling over it.\n\nYour Yomi was exactly the same, your name didn't mean anything and your Yomi wasn't known by greater populous of Middle Kingdom, but not longer that is the case! Your Yomi has grown, and now there isn't anybody that can ignore you now."
 POD_yamaking_great_yomi_objective_decision_confirm: "Finally important enough to remember"
 POD_yamaking_great_yomi_objective_decision_custom1: "Your [domicile|E] needs to have at least #V 3#! #bold level 6#! [domicile_buildings|E]"
 POD_great_yomi_modifier: "Ruler of Great Yomi"

 POD_yamaking_dealing_with_competition_objective_decision: "Dealing with Competition"
 POD_yamaking_dealing_with_competition_objective_decision_tooltip: "There are too many in this battle for throne"
 POD_yamaking_dealing_with_competition_objective_decision_desc: "You are not the greatest [Glossary('Yama King','podgloss.yamaking')] there is. You know that, and you also know that it isn't possible to totally exterminate all the competition in this battle for divine throne.\n\nBut reducing size of competition is absuluely possible, and you aren't first [Glossary('Yama King','podgloss.yamaking')] that thought about it, but you will be first to eliminate all small players in this game for divine throne."
 POD_yamaking_dealing_with_competition_objective_decision_confirm: "One of future problems gone"
 POD_yamaking_dealing_with_competition_objective_decision_custom1_ex: "$POD_yamaking_dealing_with_competition_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 POD_yamaking_dealing_with_competition_objective_decision_custom1: "There cannot be any [landed|E] #weak or with above #bold 40#! combined [defiled_quality|E]#! [GetTrait('yamaking').GetName(GetNullCharacter)]"
 POD_dealing_with_competition_modifier: "Dealt with competition"

 POD_yamaking_perfect_devil_objective_decision: "Perfect Devil"
 POD_yamaking_perfect_devil_objective_decision_tooltip: "Infernal Perfection"
 POD_yamaking_perfect_devil_objective_decision_desc: "Your goal is simple, becoming [Glossary('Demon Emperor','podgloss.demonemperor')]. But achieving that goal is anything but simple and to achieve that you need to scheme, murder and expand everything that is your. And that includes your personal strength, your panoplies you gathered from all the middle kingdom as your personal toys of corruption.\n\nAnd you finally gathered all you need to survive what is coming in final days of battle for divine throne."
 POD_yamaking_perfect_devil_objective_decision_confirm: "Perfection in Yomi"
 POD_perfect_devil_modifier: "Perfect Devil"
 POD_perfect_devil_modifier_desc: "Reduce Panoply [character_interaction|E] [dread|E] cost by #P 30%#!"

 POD_yamaking_breaching_the_middle_kingdom_objective_decision: "Breaching the Middle Kingdom"
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_tooltip: "Breaking unbreakable"
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_desc: "Surrounding Middle Kingdom is a barrier. Barrier #bold;italic made#! to keep your kind at bay, to keep us from interacting with world beyond Middle Kingdom, to keep us from spreading our goals beyond Middle Kingdom.\n\nBut you also know that breaching this barrier is possible, with enough #italic help#! from outside of Middle Kingdom you can finally destroy what is keeping you from your goal."
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_confirm: "Breaching unbreakable"
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_custom1: "You need to have at least #V 10#! $POD_splat_vampire_plural$ with at least [GetTrait('vampgeneration7').GetName(GetNullCharacter)] or lower [prisoners|E]."
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_custom2: "You need to have #V 2#! [defiled|E] $POD_splat_vampire_plural$ with at least #bold 25#! [defiled_quality|E]"
 POD_yamaking_breaching_the_middle_kingdom_objective_decision_effect1: "You will be able to interact with characters outside Middle Kingdom, as well you won't get [GetModifier('POD_yamaking_outside_middle_kingdom_modifier').GetNameWithTooltip] in [counties|E] outside Middle Kingdom"

 POD_yamaking_claiming_rightful_throne_objective_decision: "Claiming Rightful Throne"
 POD_yamaking_claiming_rightful_throne_objective_decision_tooltip: "Apotheosis"
 POD_yamaking_claiming_rightful_throne_objective_decision_desc: "You are almost there, all keys needed to become [Glossary('Demon Emperor','podgloss.demonemperor')] are in your hands and divine throne is in arm's reach\n\nBut Middle Kingdom isn't ready yet, they still fight against what is coming, and other major [Glossary('Yama Kings','podgloss.yamaking')] are still there, waiting. You need to both destroy rest of Middle Kingdom's resistance and prepare last preparation to final battle against your fellow kin.\n\nSo your apotheosis can finally happen."
 POD_yamaking_claiming_rightful_throne_objective_decision_confirm: "Claiming what's mine"
 POD_yamaking_claiming_rightful_throne_objective_decision_custom1: "Your total [skills|E] must exceed #V 80#!"
 POD_yamaking_claiming_rightful_throne_objective_decision_custom2: "Quincunx [title|E] must be destroyed"
 POD_yamaking_claiming_rightful_throne_objective_decision_custom3: "Scarlet Phoenix, Azure Dragon, Yellow Emperor, Black Tortoise and White Tiger [titles|E] must be destroyed"
 POD_yamaking_claiming_rightful_throne_objective_decision.a: "Apotheosis"
 POD_yamaking_claiming_rightful_throne_objective_decision.b: "God on Earth"
 POD_claiming_rightful_throne_modifier: "Demon [Glossary('Emperor','podgloss.demonemperor')]"
 POD_claiming_rightful_throne_modifier_desc: "Reduce Panoply [character_interaction|E] [dread|E] cost by #P 100%#!"