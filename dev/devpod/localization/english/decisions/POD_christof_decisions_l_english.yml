l_english:
  # All decisions 
  POD_christof_All_Objective4_danger_effect_tooltip: "@warning_icon!#N #bold  Be sure to be prepared before making this decision, as it is a dangerous path."
  #Ecaterina Path decisions
  POD_christof_EcaterinaPath_Objective1_decision: "Prometheans: Dealing with the Tzimisce"
  POD_christof_EcaterinaPath_Objective1_decision_desc: "[GetScriptedCharacterByHistoryID('790602').GetFirstName] was very clear on this matter. The main Tzimisce lords of the region need to be taken out of the picture: Shaagra as well as Vladimir Rustovich. And don't forget to deal with the former's ghoul, Libussa."
  POD_christof_EcaterinaPath_Objective1_decision_tooltip: "You will tell your [GetPlayer.Custom('PODCoterie')] about this new Promethean success."
  POD_christof_EcaterinaPath_Objective1_decision_confirm: "To the abyss with thee!"
  POD_christof_EcaterinaPath_Objective1_decision_shaagra_tooltip: "[GetScriptedCharacterByHistoryID('790946').GetFirstName] must be dead or in torpor"
  POD_christof_EcaterinaPath_Objective1_decision_libussa_tooltip: "[GetScriptedCharacterByHistoryID('792091').GetFirstName] must be dead or in torpor"
  POD_christof_EcaterinaPath_Objective1_decision_rustovich_tooltip: "[GetScriptedCharacterByHistoryID('505053').GetFirstName] must be dead or in torpor"
  POD_christof_EcaterinaPath_Objective2_decision: "Prometheans: Secure Promethean influence"
  POD_christof_EcaterinaPath_Objective2_decision_desc: "By the pen or the sword, advance the cause of the Prometheans. Bohemia must be secured and new connections forged."
  POD_christof_EcaterinaPath_Objective2_decision_tooltip: "You will witness the triumph of your allies."
  POD_christof_EcaterinaPath_Objective2_decision_promethean_tooltip: "Either [GetScriptedCharacterByHistoryID('790802').GetFirstName], [GetScriptedCharacterByHistoryID('790602').GetFirstName], [GetScriptedCharacterByHistoryID('790851').GetFirstName], [GetScriptedCharacterByHistoryID('790850').GetFirstName] or [GetScriptedCharacterByHistoryID('505089').GetFirstName] completely Control the [GetTitleByKey('k_bohemia').GetName]."
  POD_christof_EcaterinaPath_Objective2_decision_confirm: "Finally safe..."
  POD_christof_EcaterinaPath_Objective3_decision: "Prometheans: The words of Nod"
  POD_christof_EcaterinaPath_Objective3_decision_desc: "As they say, knowledge is power. Ecaterina has been working hard on retrieving all the fragments of the [GetPODArtifact('book_of_nod_link').GetName]. Time to bind them all and discover their secrets."
  POD_christof_EcaterinaPath_Objective3_decision_tooltip: "Your Sire, Ecaterina, will reward you for retrieving the various fragments of the [GetPODArtifact('book_of_nod_link').GetName]."
  POD_christof_EcaterinaPath_Objective3_fallback_decision_tooltip: "Cosmos will reward you for finishing the work of his late sire."
  POD_christof_EcaterinaPath_Objective3_decision_confirm: "Time to read"
  POD_christof_EcaterinaPath_Objective3_decision_book_of_nod: "You must own and assemble all the fragments of the [GetPODArtifact('book_of_nod_link').GetName]"
  POD_christof_EcaterinaPath_Objective4_decision: "Prometheans: Hunt Vukodlak and search for Anezka"
  POD_christof_EcaterinaPath_Objective4_effect_tooltip: "You will ask the Prometheans for their support to find Anezka and kill Vukodlak."
  POD_christof_EcaterinaPath_Objective4_decision_desc: "Now that you are back into the good graces of your fellow Prometheans, you can now ask them a favor and have them help you track Vukodlak."
  POD_christof_EcaterinaPath_Objective4_decision_confirm: "I'm coming for thee!" 
  POD_christof_EcaterinaPath_Objective4_decision_tooltip: "You will start the search of your nemesis and Anezka."
  POD_christof_ecaterina_path_objective1_done_flag_tt: "You have hunted the enemies of the Prometheans."
  POD_christof_ecaterina_path_objective2_done_flag_tt: "You have secured Bohemia for the Prometheans or their allies."
  POD_christof_ecaterina_path_objective3_done_flag_tt: "You have completed the [GetPODArtifact('book_of_nod_link').GetName] and shared it with the Prometheans."


  #SwordBrethren Decisions
  POD_christof_SBPath_Objective1_decision: "Swordbrethren: Gather the relics"
  POD_christof_SBPath_Objective1_decision_tooltip: "To prove your faith to your men, you have to gather the holiest relics."
  POD_christof_SBPath_Objective1_decision_desc: "While the mortals gathered around your cause don't know about your true nature, you still hear whispers about how you're not always there. Time to prove to them that you are no creature of Evil and show them that your faith is genuine."
  POD_christof_SBPath_Objective1_decision_confirm: "My faith is true!"
  POD_christof_SBPath_Objective1_custom_decision_holy_grail: "You must recover the [GetPODArtifact('holy_grail').GetName]."
  POD_christof_SBPath_Objective1_custom_decision_spear_destiny: "Like the first crusaders, you will need the [GetPODArtifact('spear_destiny').GetName] to lead the army of the faithful."
  POD_christof_SBPath_Objective1_custom_decision_valencia_chalice: "There is no blood holier than the blood of Christ himself. Get the [GetPODArtifact('valencia_chalice').GetName] to sanctify your mission."
  POD_christof_SBPath_Objective1_custom_decision_holy_trial: "You must also undergo its trial by drinking from it (\"Grail of Bitter Ashes\" decision), which will prove your good intentions to your brethren" 
  POD_christof_SBPath_Objective2_decision: "Swordbrethren: Retribution"
  POD_christof_SBPath_Objective2_decision_tooltip: "Let's take the fight to the servants of darkness and clear their ranks."
  POD_christof_SBPath_Objective2_decision_desc: "Time to draw the sword on our enemies and make them pay for their past transgressions:\n- Jurgen, who is trying to wrestle control from the Livonian Order\n- Shaagra, the protector of Vukodlak\n- Etrius, for having transformed your former companion Erik into a gargoyle."
  POD_christof_SBPath_Objective2_decision_confirm: "They all must pay for their crimes."
  POD_christof_SBPath_Objective2_custom_decision_killvampires_tt: "You have killed at least #V 30#! $POD_splat_vampire_plural$ #weak that are not Via Christi ([SCOPE.GetValue('killed_vampires_tzi')])#!"
  POD_christof_SBPath_Objective3_decision: "Swordbrethren: Reinforce the order"
  POD_christof_SBPath_Objective3_decision_tooltip: "Turn the remnants of your Swordbrethren into a powerful army."
  POD_christof_SBPath_Objective3_decision_desc: "Your enemy is powerful and has many tricks. But what can he do if you unleash an entire army on his lair? Time to grow your order into a powerful army!"
  POD_christof_SBPath_Objective3_decision_confirm: "My name is Legion, for we are many" 
  POD_christof_SBPath_Objectives_Stage1_decision_tooltip: "You will be one step closer to rescue your beloved Anezka."
  POD_christof_SBPath_Objective1_tooltip: "You will travel alone to Prague."
  POD_christof_SBPath_Objective4_decision: "Swordbrethren: Hunt Vukodlak and search for Anezka"
  POD_christof_SBPath_Objective4_decision_tooltip: "Time to turn your army on your mortal enemy."
  POD_christof_SBPath_Objective4_decision_desc: "While the Tzimisce have underestimated your determination, it won't be long before they react. Time to strike Vukodlak while you still have the momentum. Let's free Anezka from her bondage!"
  POD_christof_SBPath_Objective4_decision_confirm: "I'm coming for thee!" 
  POD_christof_SBPath_Objective4_effect_tooltip: "You will attack Vukodlak's lair with the full might of the Swordbrethren and the Lord by your side!"
  POD_christof_SBPath_Objective1_done_flag_tt: "You have gathered the relics"
  POD_christof_SBPath_Objective2_done_flag_tt: "You have hunted down your vampiric foes"
  POD_christof_SBPath_Objective3_done_flag_tt: "You have reinforced the order"

  #Independent Path
  POD_christof_IndPath_Objective1_decision: "Independent: A Lone Knight"
  POD_christof_IndPath_Objective1_decision_desc: "Fighting older and stronger vampires is by no means an easy task. Christof must become stronger and master new disciplines if he wants to stand any chance against his nemesis."
  POD_christof_IndPath_Objective1_decision_confirm: "Time to get stronger."
  POD_christof_IndPath_Objective1_decision_tooltip: "You will train to defeat your enemy."
  POD_christof_IndPath_Objective2_decision: "Independent: His Sword"
  POD_christof_IndPath_Objective2_decision_desc: "Found by Christof in Vienna, [GetPODArtifact('ainkurn_link').GetName] is not a simple sword owned by the Teutonic Knights. It was forged using powerful knowledge and the assistance of [GetScriptedCharacterByHistoryID('790274').GetFirstName]. While its power is great, the blade could be more powerful. Maybe her help could be sought once more..." 
  POD_christof_IndPath_Objective2_decision_tt_ainkurn: "You own [GetPODArtifact('ainkurn_link').GetName]."
  POD_christof_IndPath_Objective2_decision_tt_reward: "[GetPODArtifact('ainkurn_link').GetName] will be improved."
  POD_christof_IndPath_Objective2_decision_confirm: "Time to restore it to its former glory."
  POD_christof_IndPath_Objective2_decision_tooltip: "You will have your sword improved."
  POD_christof_IndPath_Objective3_decision: "Independent: And His Coterie"
  POD_christof_IndPath_Objective3_decision_desc: "The night is full of dangers and challenges to overcome. Noble Christof can do many things, but he needs allies to succeed. He also needs to improve his reputation..."
  POD_christof_IndPath_Objective3_decision_coterie_count_tt: "Have at least #V 2#! [GetPlayer.Custom('PODCoterie')] members (not counting you) with at least 12 prowess."
  POD_christof_IndPath_Objective3_decision_confirm: "Time to gather my allies."
  POD_christof_IndPath_Objective3_decision_tooltip: "You will be recognized by your peers."
  POD_christof_IndPath_Objective4_decision: "Independent: Hunt Vukodlak and search for Anezka"
  POD_christof_indpath_objective1_done_tt: "You have trained enough to bring down your foe."
  POD_christof_indpath_objective2_done_tt: "You have improved Aikurn."
  POD_christof_indpath_objective3_done_tt: "You have made a name for yourself."
  POD_christof_Indath_Objective4_effect_tooltip: "You will search for Vukodlak and Anezka."
  POD_christof_IndPath_Objective4_decision_desc: "While the Tzimisce have underestimated your determination, it won't be long before they react. Time to strike Vukodlak while you still have the momentum. Let's free Anezka from her bondage!"
  POD_christof_IndPath_Objective4_decision_confirm: "I'm coming for thee!"
  POD_christof_IndPath_Objective4_decision_tooltip: "You will start the search of your nemesis and Anezka."
  #Other Decisions
  POD_christof_invite_prospect_sb_decision: "Invite Prospect from the Swordbrethren"
  POD_christof_invite_prospect_sb_decision.tt: "Bring a talented member of our order to me."
  POD_christof_invite_prospect_sb_decision_confirm: "Find me someone worthy!"
  POD_christof_invite_prospect_sb_decision_tooltip: "Time to bring one of our mortal brothers into our inner circle."
  invite_prospect1_decision_swordbrethren_desc: "The mortal part of our order is teeming with the sort of talent we could use; we just need to find the ones that won't ask too many questions."
 