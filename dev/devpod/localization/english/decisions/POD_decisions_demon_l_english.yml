l_english:
 POD_demon_demand_kill_pure_decision:0 "Demand: Destroy the Pure"
 POD_demon_demand_kill_pure_decision_tooltip:1 "Your master demands. You must answer."
 POD_demon_demand_kill_pure_decision_desc:0 "Purity is anathema to the demons. Your master demands that you show your devotion by ridding the world of a lightbearer."
 POD_demon_demand_kill_pure_decision_confirm:0 "Your will is done, master."
 POD_demon_demand_kill_pure_decision_condition:0 "Kill an hunter, vampire with the Golconda trait, or a Kuei-Jin with high dharma."
 
 POD_demon_demand_prepare_reliquarie_decision:0 "Demand: Prepare a Reliquary"
 POD_demon_demand_prepare_reliquarie_decision_tooltip:1 "Your master demands. You must answer."
 POD_demon_demand_prepare_reliquarie_decision_desc:0 "Demons can't manifest easily on this place of existence without a powerful artifact to inhabit. Prepare a reliquary for your master's use."
 POD_demon_demand_prepare_reliquarie_decision_confirm:0 "Your will is done, master."
 POD_demon_demand_prepare_reliquarie_decision_condition:0 "Destroy a famed or illustrious artifact."
 
 POD_demon_demand_banish_rival_decision:0 "Demand: Banish Rival"
 POD_demon_demand_banish_rival_decision_tooltip:1 "Your master demands. You must answer."
 POD_demon_demand_banish_rival_decision_desc:0 "Demons' worst enemies are their own kind. Your master demands that a rival fallen angel be banished from this world."
 POD_demon_demand_banish_rival_decision_confirm:0 "Your will is done, master."
 POD_demon_demand_banish_rival_decision_condition:0 "Banish a demon to the [abyss|E]."
 
 POD_demon_demand_prepare_bodies_decision:0 "Demand: Prepare Bodies"
 POD_demon_demand_prepare_bodies_decision_tooltip:1 "Your master demands. You must answer."
 POD_demon_demand_prepare_bodies_decision_desc:0 "The Ritual of the Sundered Soul allows a demon to manifest briefly in this place by stealing the body of a willing (or unwilling) host. Your master wants some "volunteers" found."
 POD_demon_demand_prepare_bodies_decision_confirm:0 "Your will is done, master."
 POD_demon_demand_prepare_bodies_decision_condition:0 "Imprison #V 10#! characters."
 
 POD_demon_demand_bring_infernalist_decision:0 "Demand: Bring Infernalist"
 POD_demon_demand_bring_infernalist_decision_tooltip:1 "Your master demands. You must answer."
 POD_demon_demand_bring_infernalist_decision_desc:0 "[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetFirstName] has been singled out by your master as a promising infernalist. Bring them to your cult or deal with them before they become a rival."
 POD_demon_demand_bring_infernalist_decision_confirm:0 "Your will is done, master."
 POD_demon_demand_bring_infernalist_decision_condition:0 "[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetFirstName] must a have positive opinion of you or be dead."
 
 POD_demon_demand_corrupt_place_decision:0 "Demand: Corrupt Holy Place"
 POD_demon_demand_corrupt_place_decision_tooltip:1 "Your master demands. You must answer."
 POD_demon_demand_corrupt_place_decision_desc:0 "Holy Sites are taboo to demons. For them to have free reins, you must taint these sites before your master can freely interact with them."
 POD_demon_demand_corrupt_place_decision_confirm:0 "Your will is done, master."