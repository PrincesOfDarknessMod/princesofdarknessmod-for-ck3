l_english:


 
 auspice_renunciation_decision: "Auspice Renunciation"
 auspice_renunciation_decision_tooltip: "You will change your auspice."
 auspice_renunciation_decision_desc: "In this rare rite, a werewolf rejects the auspice under which he was born and chooses a new one. The Garou must perform this rite during the phase of the moon he wishes to adopt. Most commonly, water from a silver basin exposed to $glossary_luna$'s radiance is poured over the naked supplicant, washing him clean of all he once was, including all rank. He is now free to start anew as a member of his adopted auspice."
 auspice_renunciation_decision_confirm: "Shifting Moon"
 
 force_duel_criminals_interaction.death.tt: "This duel is to the death."

