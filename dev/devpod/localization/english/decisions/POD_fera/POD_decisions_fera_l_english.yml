 fera_advance_rank_decision: "Advance your Rank"
 fera_advance_rank_decision_desc: "Renown and Rank are a measure of a Fera's place in their society. The more Renown they have, the more weight their words carry. The different Fera types use a different set of three renown types.\n\nYour Renown types are:\n"
 fera_advance_rank_decision_tooltip: "Progressing the Fera ranks takes time and commitment."
 fera_advance_rank_decision_confirm: "My fame grows!"
 fera_advance_rank_renown_glory: "$POD_fera_renown_glory$:\n$BULLET_WITH_TAB$Winning wars against Wyrm aligned rulers if you are a Gaian faith.\n$BULLET_WITH_TAB$Winning wars against Gaia aligned rulers if you are a Wyrm faith.\n$BULLET_WITH_TAB$Killing Wyrm aligned characters if you are a Gaian faith.\n$BULLET_WITH_TAB$Killing Gaia aligned characters if you are a Wyrm faith.\n$BULLET_WITH_TAB$Completing certain objectives."
 fera_advance_rank_renown_honor: "$POD_fera_renown_honor$:\n$BULLET_WITH_TAB$Abandoning a [grudge|E], ending a [rivalry|E], and losing a [nemesis|E]\n$BULLET_WITH_TAB$Granting [duchies|E] or higher titles to another $glossary_fera$.\n$BULLET_WITH_TAB$Upgrading a Caern to its maximum level.\n$BULLET_WITH_TAB$Increasing your [piety_level|E]."
 fera_advance_rank_renown_wisdom: "$POD_fera_renown_wisdom$:\n$BULLET_WITH_TAB$Finishing Umbra Expeditions.\n$BULLET_WITH_TAB$Obtaining the last [perk|E] of a $glossary_fera$ lifestyle tree.\n$BULLET_WITH_TAB$Finishing a Spirit Quest."
 #fera_advance_rank_renown_power: "$POD_fera_renown_power$:\n" win wars of any kind, crush rebellions, win duels,
 #fera_advance_rank_renown_cunning: "$POD_fera_renown_cunning$:\n" blackmail people, finish heists, 
 #fera_advance_rank_renown_ferocity: "$POD_fera_renown_ferocity$:\n" raid X loot, succeed in hunts, 
 #fera_advance_rank_renown_infamy: "$POD_fera_renown_infamy$:\n"  Execute innocent vassals, break truces
 fera_advance_rank_renown_bonuses: "Your [GetPlayer.Custom('PODFeraAuspiceType')] gives a bonus to [GetPlayer.Custom('PODFeraAuspiceRenownBoost')]"


 fera_advance_rank_decision_requirement: "You must be 1 [trait_level_track_xp|E] away from the next [trait_level_track|E] checkpoint."
 fera_advance_rank_decision_requirement2: "You have 3 or more [tributaries|E] of at least Kingdom [rank|E]"


























 #Bastet
 restore_per_bast_objective_decision: "Restore Per-Bast"
 restore_per_bast_objective_decision_desc: "The "City of Bastet" was once the center of worship for the grateful Egyptians to their shadowcat benefactors. Could it be so again?"
 restore_per_bast_objective_decision_tooltip: "Our ancient capital awaits."
 restore_per_bast_objective_decision_confirm: "Praise the Cat."
 
 the_fleeing_scarab_objective_decision: "The Fleeing Scarab"
 the_fleeing_scarab_objective_decision_desc: "The most prized secret of the Bubasti, the Fleeing Scarab is a dark ritual allowing a Bastet to buy their immortality with the souls of other living beings."
 the_fleeing_scarab_objective_decision_tooltip: "Eternal life, so close at hand."
 the_fleeing_scarab_objective_decision_confirm: "No price is too high for this power."
 fleeing_scarab_decision_custom: "A Mummy must be either your Best Friend or Soulmate."
 fleeing_scarab_decision_custom2: "You must have 15 or more prisoners with the Mortal trait."
 
 royal_privilege_objective_decision: "Royal Privilege"
 royal_privilege_objective_decision_desc: "A rare and prized secret of the Simba, Royal Privilege allows them to learn the powers of the other Bastet tribes. Only the most successful (and some say callous) of the Simba are deemed worthy to learn it by the Unmaker spirit."
 royal_privilege_objective_decision_tooltip: "Being a King has its perks."
 royal_privilege_objective_decision_confirm: "True King of Cats, at last."