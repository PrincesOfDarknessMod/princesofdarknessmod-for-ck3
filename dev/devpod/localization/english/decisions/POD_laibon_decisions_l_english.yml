l_english:
 pod_laibon_explain_aye_orun_decision: "Meditate on the Two Worlds"
 pod_laibon_explain_aye_orun_decision_desc: "Turn your thoughts inward and reflect on the twin pillars of Laibon existence: Aye, the world of the living, and Orun, the world of the spirits. Where do you stand between them?"
 pod_laibon_explain_aye_orun_decision_tooltip: "Reflect on your connection to the two worlds and learn how the Aye/Orun system shapes your power."
 pod_laibon_explain_aye_orun_decision_confirm: "Turn your thoughts inward."
 pod_laibon_invoke_authority_decision: "Invoke the Authority of the Living"
 pod_laibon_invoke_authority_decision_desc: "You speak with the voice of the living world - mortals obey because the land itself commands them, and other Laibon recognize your Aye-authority."
 pod_laibon_invoke_authority_decision_confirm: "Invoke the authority of Aye."
 pod_laibon_invoke_authority_decision_tooltip: "Grants +10 popular opinion and +10% control growth for 5 years. All Laibon vassals gain +5 opinion for 5 years."
 pod_laibon_commune_ancestors_decision: "Commune with the Ancestors"
 pod_laibon_commune_ancestors_decision_desc: "You open the gate to Orun and the ancestors answer - showing you what is hidden in your domain and lending you their strength."
 pod_laibon_commune_ancestors_decision_confirm: "Open the gate to Orun."
 pod_laibon_commune_ancestors_decision_tooltip: "Reveals a secret held by a character in your realm. Grants +5 prowess and +25% hostile scheme resistance for 5 years."
 pod_laibon_commune_reveal_secret_tt: "The ancestors may reveal a hidden truth about someone in your realm."
 pod_laibon_remember_the_living_decision: "Remember the Living"
 pod_laibon_remember_the_living_decision_desc: "Walk among the mortals, not to feed or rule, but to remember what warmth feels like. Sit by a cooking fire and listen to a family argue about nothing. Watch children play a game you once knew the rules to. Reconnecting with Aye after neglecting it always hurts. But the living world will be real again, if only for tonight."
 pod_laibon_remember_the_living_decision_tooltip: "Gain Aye XP at the cost of piety and stress. Only available when your connection to the living world has faded."
 pod_laibon_remember_the_living_decision_confirm: "Walk among the living."
 pod_laibon_call_to_ancestors_decision: "Call to the Ancestors"
 pod_laibon_call_to_ancestors_decision_desc: "Go to a quiet place, a grave, a crossroads, the roots of an old tree, and call out to the ancestors for the first time in decades. The silence stretches. Then, faintly, an answer. Not words, a pressure, a presence, a reminder that the spirit world had not abandoned you even though you abandoned it. The reconnection is painful, like blood returning to a numb limb. But you can hear them again."
 pod_laibon_call_to_ancestors_decision_tooltip: "Gain Orun XP at the cost of piety and stress. Only available when your connection to the spirit world has faded."
 pod_laibon_call_to_ancestors_decision_confirm: "Call out to the ancestors."
 pod_laibon_walker_between_worlds_tt: "You have achieved the Laibon ideal, balance between Aye and Orun. You are a Walker Between Worlds."
