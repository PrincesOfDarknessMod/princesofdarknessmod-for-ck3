 POD_qareen_objective_decision: "Humanities Advisor"
 POD_qareen_objective_decision_desc: "You are an immortal with immense knowledge of the world, you are gifted or perhaps cursed to never forget anything. With your control over major sources of knowledge you are in a prime position to guide humanity towards a future that befits a fae of your beingness."
 POD_qareen_objective_decision_tooltip: "Ask Jinn"
 POD_qareen_objective_decision_confirm: "Become humanities guiding light"
 POD_qareen_objective_decision_mutually_exclusive: "#X Mutually exclusive with $destroy_order_of_reason_objective_decision$#!."
 POD_qareen_objective_decision_effect1: "Significantly increase spread of culture councillor task and gain access to the develop county decision if not unseelie."
 POD_fae_qareen_goal_achieved_modifier_culture: "You are a guide of humanity"

 POD_shaytan_objective_decision: "Wishing legacy of the Djinn"
 POD_shaytan_objective_decision_desc: "Being a shaytan you are no stranger to mischief. By tricking those in power to take you up on your offer to grant wishes, you will ensure djinn will endure and outlast the ravages of banality as the story of the djinn and their granting of wishes will last for an eternity.\n#X You must have\n[GetTrait('art_naming_advanced').GetName(GetPlayer)]\n[GetTrait('realm_fae').GetName(GetPlayer)]\n[GetTrait('realm_scene').GetName(GetPlayer)]\n[GetTrait('realm_time').GetName(GetPlayer)]\nIn order to use the [character_interaction] to grant wishes#!"
 POD_shaytan_objective_decision_tooltip: "Your wish is my command"
 POD_shaytan_objective_decision_confirm: "Many tales will be told of this"
 POD_shaytan_objective_decision_custom1: "You must successfully use the POD_shaytan_trick_wish_interaction 30 times."

