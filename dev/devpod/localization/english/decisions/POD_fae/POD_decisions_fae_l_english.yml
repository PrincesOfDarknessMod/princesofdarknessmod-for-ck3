l_english:
 POD_region_seasons_struggle: "Seasonal Battlefield"
 
 the_red_and_white_apple_of_avalon_decision: "The Red and White Apple of Avalon"
 the_red_and_white_apple_of_avalon_decision_desc: "Upon the pinnacle of Glastonbury Tor are two springs, the White and the Red, representing the forces of life and death. Near the two springs is a small apple tree that bears apples year round, whether it is winter, summer or spring. Half of the apples are red, but the other half have skins as white as snow."
 the_red_and_white_apple_of_avalon_decision_confirm: "Pick an Apple"
 the_red_and_white_apple_of_avalon_decision_tooltip: "Gain an apple artifact."
 
 albion_pools_decision: "Albion Pools"
 albion_pools_decision_desc: "The three mystical Albion Pools, hidden in Cymru, Alba and Breizh respectively, are among the most desirable treasures sought after by mages because it is said that whoever has power overall three pools will rule all of England. One was reputed to grant youth everlasting, one healed all wounds and the third allegedly granted control over the hearts of mortals."
 albion_pools_decision_confirm: "Albion should be mine"
 albion_pools_decision_tooltip: "Claim Albion."
 albion_pools_decision_custom: "Your [realm_capital|E] is located in the [GetGeographicalRegion('ghw_region_britannia').GetName] [region|E]"
 
 foster_sprite_decision: "Look For a Successor"
 foster_sprite_decision_tooltip: "Your servants will suggest a number of suitable candidates"
 foster_sprite_decision_desc: "True fae aren't fertile, but can foster a sprite to create a true fae. As such, if you don't want your hard work going to waste in case of an unfortunate accident, you must be prepared. You will ask your servants to bring forth a number of suitable candidates."
 foster_sprite_decision_effect_tooltip: "You will be presented with a group of candidates and may accept one as your own child for a prestige fee"
 foster_sprite_decision_confirm: "Start the search"

 POD_fable_decision: "Tales"
 POD_fable_decision_desc: "Fae are highly connected to the myths of Dreamers, one could even say made and unmade by them.\n\nAs such, many Fae who either failed or aren't interested in the political intrigue of the Courts have decided to establish a myth of their own.\n\nThis is a significant choice. Perhaps I shall be a Great Shadow, infamous for manipulating entire kingdoms, or a Great Herald whose legendary diplomacy united the worst of enemies. Which Tale will I pursue?"
 POD_fable_decision_tooltip: "A new Legend."
 POD_fable_decision_confirm: "A Tale of My Own"
 POD_fable_decision_advance: "You will advance your Tale to the next level, improving the [domicile_building_upgrade|E] Tale unlocks but also increasing the requirements for the next advancement."
 POD_fable_decision_chose_fable: "You will choose one Tale to strive towards. #X This action cannot be reverted or changed later.#!"

# TODO FAE
 POD_eccentric_pooka_decision: "Search for a Pooka"
 POD_eccentric_pooka_decision_desc: "Pooka are so much fun! there are so many different kinds, I must have one! (It may take some time to find them)"
 POD_eccentric_pooka_decision_tooltip: "I want this one!"
 POD_eccentric_pooka_decision_confirm: "A furry companion!"

 POD_lilin_objective_decision: "One with Lilith"
 POD_lilin_objective_decision_desc: "Similarly to the prodigals who call themselves vampires, we Lilin are descended from Lilith, a demon who rebelled against her creator and refused to submit to the man she'd been forced to marry. But many things differentiate us from her, we lack her powers, we lack her status and most importantly lack her essence.\n\nBut we are Fae, the impossible is possible! If I were to gather artifacts related to the Dark Mother and enslave her brother and sisters, I may be able to reenact Lilith's life."
 POD_lilin_objective_decision_tooltip: "Dark Mother's Blessing"
 POD_lilin_objective_decision_confirm: "Reenacting the legend"
 POD_lilin_objective_decision_custom1: "You need to know the [Glossary('True Names','podgloss.truename')] of #V 3#! $POD_splat_demon_plural$"
 POD_lilin_objective_decision_effect: "You unlock the [journeys|E] to learn new [GetTrait('bloodsorcery').GetName(GetPlayer)] [bs_traditions|E]"

 POD_qareen_objective_decision: "Humanity's Advisor"
 POD_qareen_objective_decision_desc: "You are an immortal with immense knowledge of the world, you are gifted or perhaps cursed to never forget a thing and there are many mortals devoid of any guidance, stumbling around blindly, hoping to find a way forward.\n\nIt is of no surprise then when mortals find a way which is bad for everything fae. But with your control over major sources of knowledge you are in a prime position to guide humanity towards a future that benefits a Fae of your kind."
 POD_qareen_objective_decision_tooltip: "Ask a Jinn"
 POD_qareen_objective_decision_confirm: "Become humanity's guiding light"
 POD_qareen_objective_decision_mutually_exclusive: "#X Mutually exclusive with $destroy_order_of_reason_objective_decision$#!."
 POD_qareen_objective_decision_effect1: "Significantly improve the @task_promote_culture! #V $task_promote_culture$#! councillor task and gain access to the [diligent_development_focus_decision|E] decision if not [GetDoctrine('doctrine_fae_morality_unseelie').GetBaseName]."
 POD_fae_qareen_goal_achieved_modifier_culture: "You are a guide of humanity"

 POD_shaytan_objective_decision: "Wishing Legacy of the Djinn"
 POD_shaytan_objective_decision_desc: "Being a shaytan, you are no stranger to mischief. By tricking those in power to take you up on your offer to grant wishes, you will ensure djinn will endure and outlast the ravages of banality as the story of the djinn and their granting of wishes will last for an eternity."
 POD_shaytan_objective_decision_tooltip: "Your wish is my command"
 POD_shaytan_objective_decision_confirm: "Many tales will be told of this"
 POD_shaytan_objective_decision_custom1: "You must have successfully used the #V $POD_shaytan_trick_wish_interaction$#! [character_interaction|E] at least 30 times."
 POD_shaytan_objective_decision_info: "#I The #V $POD_shaytan_trick_wish_interaction$#! [character_interaction|E] is unlocked by having [GetTrait('art_naming_advanced').GetName(GetPlayer)], [GetTrait('realm_fae').GetName(GetPlayer)], [GetTrait('realm_scene').GetName(GetPlayer)] and [GetTrait('realm_time').GetName(GetPlayer)]#!"

 POD_aesin_legacy_4_decision: "House Commander Training"
 POD_aesin_legacy_4_decision_desc: "House Aesin has expertise in commanding over various weather conditions and terrains. Do you wish to seek out training?"
 POD_aesin_legacy_4_decision_tooltip: "I want to be the very best"
 POD_aesin_legacy_4_decision_confirm: "Let the training begin"
 POD_aesin_legacy_4_decision_effect1: "You can only get up to #V 4#! [commander_traits|E]!"

 POD_aesin_legacy_5_decision: "House Poet Training"
 POD_aesin_legacy_5_decision_desc: "House Aesin is comprised of many great poets, masters of song and word. Do you wish to seek out training?"
 POD_aesin_legacy_5_decision_tooltip: "I want to be the very best"
 POD_aesin_legacy_5_decision_confirm: "Let the training begin"

 POD_balor_legacy_2_decision: "House Commander Training"
 POD_balor_legacy_2_decision_desc: "House Balor has expertise in commanding armies to eliminate their enemies to the last, no matter the cost. Do you wish to seek out training?"
 POD_balor_legacy_2_decision_tooltip: "I want to be the very best"
 POD_balor_legacy_2_decision_confirm: "Let the training begin"

 POD_daireann_legacy_4_decision: "House Physician Training"
 POD_daireann_legacy_4_decision_desc: "House Daireann is comprised of many great physicians and potion masters. Do you wish to seek out training?"
 POD_daireann_legacy_4_decision_tooltip: "I want to be the very best"
 POD_daireann_legacy_4_decision_confirm: "Let the training begin"

 POD_fiona_legacy_4_decision: "House Commander Training"
 POD_fiona_legacy_4_decision_desc: "House Fiona has many a brave and daring commander. Do you wish to seek out training?"
 POD_fiona_legacy_4_decision_tooltip: "I want to be the very best"
 POD_fiona_legacy_4_decision_confirm: "Let the training begin"

 POD_scathach_legacy_3_decision: "House Commander Training"
 POD_scathach_legacy_3_decision_desc: "House Scathach has a wide variety of expert commanders. Do you wish to seek out training?"
 POD_scathach_legacy_3_decision_tooltip: "I want to be the very best"
 POD_scathach_legacy_3_decision_confirm: "Let the training begin"

 POD_inanimae_legacy_3_decision: "Natural Healer Training"
 POD_inanimae_legacy_3_decision_desc: "There are plenty of Inanimae attuned to Aquis that are also skilled healers that could impart upon you their knowledge of natural remedies or mending techniques. Do you wish to seek out training?"
 POD_inanimae_legacy_3_decision_tooltip: "I want to be the very best"
 POD_inanimae_legacy_3_decision_confirm: "Let the training begin"

 POD_fae_mighty_legacy_3_decision: "Blademaster Training"
 POD_fae_mighty_legacy_3_decision_desc: "House [GetPlayer.GetDynasty.GetNameNoTooltip] has a tradition of studying the ways of the blade. Do you wish to continue this tradition?"
 POD_fae_mighty_legacy_3_decision_tooltip: "I want to be the very best"
 POD_fae_mighty_legacy_3_decision_confirm: "Let the training begin"

 POD_santa_presents_decision: "Deliver Presents"
 POD_santa_presents_decision_desc: "Giving away presents is merry and of good cheer!\nIt is hard not to want to believe in someone that spreads joy and merriment to all."
 POD_santa_presents_decision_tooltip: "Jingle Bells"
 POD_santa_presents_decision_confirm: "Spread Joy to the World"

 POD_grigori_faith_channel_decision: "Divine Prayers"
 POD_grigori_faith_channel_decision_desc: "You are the Prophet, a divine figure for these mortals. Their belief shields you from any disbelief the world may impose upon you, but that is not all...\n\nTheir prayers carry glamour; Glamour which is rightfully yours, you only need to lend an ear and listen to their deepest needs."
 POD_grigori_faith_channel_decision_tooltip: "Listen carefully"
 POD_grigori_faith_channel_decision_confirm: "You may not know, but I am listening"


