 catalyst_gain_claim_on_title_fae_desc: "Acquire a [claim|E] on a [title|E] under the [de_jure|E] of $k_norway$, $k_brittany$, $k_wales$, $k_scotland$, or $k_ireland$"
 catalyst_usurp_title_fae: "$catalyst_usurp_title_fp2$"
 catalyst_usurp_title_fae_desc: "Usurp a [title|E] which is part of the [de_jure|E] of $k_norway$, $k_brittany$, $k_wales$, $k_scotland$, or $k_ireland$"
 
 struggle_seasons_ending_hostility_decision: "Neutrality Wins"
 struggle_seasons_ending_hostility_decision_desc: "No Fae expected the Solstice Court to be able to win this War of Seasons, but you did, now they will listen to you as you decide which Season should rule."
 struggle_seasons_ending_hostility_decision_tooltip: "End the War of Seasons [struggle|E]"
 struggle_seasons_ending_hostility_decision_confirm: "End the War of Seasons Struggle"
 struggle_seasons_ending_winter_victory_decision: "Eternal Winter"
 struggle_seasons_ending_winter_victory_decision_desc: "It is time for a strong leader to finally drag the Fae courts from the mire and division of the War of Seasons. Winter has come, and it will never end."
 struggle_seasons_ending_winter_victory_decision_confirm: "Eternal Winter"
 struggle_seasons_ending_spring_victory_decision: "Hope Springs Eternal"
 struggle_seasons_ending_spring_victory_decision_desc: "It is time for a strong leader to finally drag the Fae courts from the mire and division of the War of Seasons. Spring has been reborn."
 struggle_seasons_ending_spring_victory_decision_confirm: "Hope Springs Eternal"
 struggle_seasons_ending_summer_victory_decision: "Summer Endured"
 struggle_seasons_ending_summer_victory_decision_desc: "It is time for a strong leader to finally drag the Fae courts from the mire and division of the War of Seasons. This Summer will last forever."
 struggle_seasons_ending_summer_victory_decision_confirm: "Summer Endured"
 struggle_seasons_ending_autumn_victory_decision: "Inevitable Autumn"
 struggle_seasons_ending_autumn_victory_decision_desc: "It is time for a strong leader to finally drag the Fae courts from the mire and division of the War of Seasons. Autumn was inevitable."
 struggle_seasons_ending_autumn_victory_decision_confirm: "Inevitable Autumn"
 struggle_seasons_ending_compromise_decision: "Status Quo"
 struggle_seasons_ending_compromise_decision_desc: "These endless conflicts over the seasons only weaken us all. It is time to accept that the Fae courts were never meant to be united."
 struggle_seasons_ending_compromise_decision_tooltip: "End the Season [struggle|E]"
 struggle_seasons_ending_compromise_decision_confirm: "End the Season Struggle"
 struggle_seasons_ending_conciliation_decision: "Seasons United"
 struggle_seasons_ending_conciliation_decision_desc: "The wounds of the past centuries will not be easily healed, but we must try if the Fae courts are to find a lasting peace. Truly, the Seasons are meant to cycle."
 struggle_seasons_ending_conciliation_decision_tooltip: "End the War of Seasons [struggle|E]"
 struggle_seasons_ending_conciliation_decision_confirm: "End the War of Seasons Struggle"
 struggle_seasons_ending_conciliation_decision_custom: "Kithain will always accept your offer of vassalization"
 struggle_seasons_ending_outsider_decision: "End the War of Seasons"
 struggle_seasons_ending_outsider_decision_desc: "Time to expunge those annoying bugs."
 struggle_seasons_ending_outsider_decision_friendly_desc: "Friends, stop fighting."
 struggle_seasons_ending_outsider_decision_tooltip: "End the Season [struggle|E]"
 struggle_seasons_ending_outsider_decision_confirm: "End the Season Struggle"
 
 the_red_and_white_apple_of_avalon_decision: "The Red and White Apple of Avalon"
 the_red_and_white_apple_of_avalon_decision_desc: "Upon the pinnacle of Glastonbury Tor are two springs, the White and the Red, representing the forces of life and death. Near the two springs is a small apple tree that bears apples year round, whether it is winter, summer or spring. Half of the apples are red, but the other half have skins as white as snow."
 the_red_and_white_apple_of_avalon_decision_confirm: "Pick an Apple"
 the_red_and_white_apple_of_avalon_decision_tooltip: "Gain an apple artifact."
 
 albion_pools_decision: "Albion Pools"
 albion_pools_decision_desc: "The three mystical Albion Pools, hidden in Cymru, Alba and Breizh respectively, are among the most desirable treasures sought after by mages because it is said that whoever has power overall three pools will rule all of England. One was reputed to grant youth everlasting, one healed all wounds and the third allegedly granted control over the hearts of mortals."
 albion_pools_decision_confirm: "Albion should be mine"
 albion_pools_decision_tooltip: "Claim Albion."
 albion_pools_decision_custom: "Your [realm_capital|E] is located in the [GetGeographicalRegion('ghw_region_britannia').GetName] [region|E]"
 
 POD_agenda_preference_decision: "Agenda Preference"
 POD_agenda_preference_decision_desc: "As head of court, you may want to choose other agenda to support."
 POD_agenda_preference_decision_tooltip: "You will change your faith."
 POD_agenda_preference_decision_confirm: "I changed my mind"
 
 foster_sprite_decision: "Look For a Successor"
 foster_sprite_decision_tooltip: "Your servants will suggest a number of suitable candidates"
 foster_sprite_decision_desc: "True fae aren't fertile, but can foster a sprite to create a true fae. As such, if you don't want your hard work going to waste in case of an unfortunate accident, you must be prepared. You will ask your servants to bring forth a number of suitable candidates."
 foster_sprite_decision_effect_tooltip: "You will be presented with a group of candidates and may accept one as your own child for a prestige fee"
 foster_sprite_decision_confirm: "Start the search"
 
 secure_seasons_foothold_decision_title: "Island Foothold"
 secure_seasons_foothold_decision_desc: "The seasons divisions in the Island are opening opportunities. They won't be prepared for an outside threat."
 secure_seasons_foothold_decision_tooltip: "Integrate part of Island"
 secure_seasons_foothold_decision_confirm: "To the strongest"
