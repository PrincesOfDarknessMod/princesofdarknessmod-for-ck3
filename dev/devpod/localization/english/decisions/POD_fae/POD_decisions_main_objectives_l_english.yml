 destroy_inquisition_objective_decision: "Destroy the Shadow Inquisition"
 destroy_inquisition_objective_decision_tooltip: "You will destroy the Shadow Inquisition."
 destroy_inquisition_objective_decision_desc: "The Church and its dreaded Inquisition persecutes pagans and the Fae. It converts by the sword, tortures or burns to death the followers of the Old Gods and practitioners of the Mystic arts. Its priests use ritual baptism upon Changeling children to forever rob them of their enchanted nature to snuff out the spark of Glamour. Popes Celestine II and Innocent the III have declared violent conversion of Livionia by Crusade. A papal bull has declared that fighting the Baltic pagans was of the same rank as participating in the Crusade for Jerusalem. For the Fae to remain on Earth, it is time to stop this."
 destroy_inquisition_objective_decision_confirm: "Bring an end to the Burning Times"
 destroy_inquisition_objective_decision_custom: "There must be no [independent_ruler|E] following [GetFaithByKey('shadowinquisition').GetName] [faith|E] on the map"
 destroy_inquisition_objective_decision_custom_ex: "$destroy_inquisition_objective_decision_custom$ #weak ([example.GetFirstName])#!"  
 destroy_inquisition_objective_decision_custom1: "[GetTitleByKey('c_roma').GetNameNoTier] must be held by a $POD_splat_fae$ or $POD_splat_changeling$ that doesn't follow faith with [GetFaithDoctrine('special_doctrine_fae_constantinians_hostility').GetBaseName] or [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName]"
 destroy_inquisition_objective_decision_custom2: "This objective needs to be completed before the year [GetPlayer.MakeScope.ScriptValue('inquisition_spawn_year')|V0]"
 destroy_inquisition_objective_decision_custom3: "[GetTitleByKey('c_roma').GetNameNoTier] must have [GetBuilding('grand_city_04').GetName]"
 destroy_inquisition_objective_decision_effect1: "The Age of Inquisition event won't happen in the future"

 constantinian_objective_decision: "Integrate with the Church"
 constantinian_objective_decision_tooltip: "The Church will come to see the Fae as holy servants of the divine: angels, prophets, miracle workers and the truly blessed."
 constantinian_objective_decision_desc: "Rather than seeing the Church as an enemy to be opposed and halted, Constantinians view it as a mystery to be revealed, studied and guided. Once the power of mortals' beliefs are understood, perhaps even the Mists will return to their more benevolent balance and the Fae can reap the glamour of the faithful's creativity."
 constantinian_objective_decision_confirm: "Establish the Constantinian Catechism"
 constantinian_objective_decision_custom_artifact: "You must have one of the holy relic [artifacts|E] of Christianity: the Holy Grail, a Fragment of the True Cross, the Lamp of Constantine, the Flagrum of the Passion, the Spear of Destiny, the Valencia Chalice or the Gabriel's Trumpet."
 constantinian_objective_decision_custom1: "[GetTitleByKey('c_byzantion').GetNameNoTier] must be held by [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] $POD_splat_fae$/$POD_splat_changeling$, or [GetFaithByKey('shadowinquisition').GetName] $POD_splat_hunter$"
 constantinian_objective_decision_custom2: "[GetTitleByKey('c_roma').GetNameNoTier] must be held by [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] $POD_splat_fae$/$POD_splat_changeling$, or [GetFaithByKey('shadowinquisition').GetName] $POD_splat_hunter$"
 constantinian_objective_decision_custom3: "[GetTitleByKey('c_jerusalem').GetNameNoTier] must be held by [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] $POD_splat_fae$/$POD_splat_changeling$, or [GetFaithByKey('shadowinquisition').GetName] $POD_splat_hunter$" 
 constantinian_objective_decision_effect1: "All western $POD_splat_hunter$ [faiths|E]#weak ([GetFaithByKey('shadowinquisition').GetName], [GetFaithByKey('akritai').GetName], [GetFaithByKey('independenthunters').GetName] etc.)#! will gain [GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName] and accept $POD_splat_fae$ as angels from GOD"
