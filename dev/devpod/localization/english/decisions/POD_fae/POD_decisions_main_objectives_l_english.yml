 the_krofted_way_objective_decision: "The Krofted Way"
 the_krofted_way_objective_decision_desc: "Old ways are dying. Nature will be slowly abandoned in humanities pursuit of power and influence. To survive and thrive, we should integrate into humanity to become new element of humanity!\n\nThat is only way towards salvation!"
