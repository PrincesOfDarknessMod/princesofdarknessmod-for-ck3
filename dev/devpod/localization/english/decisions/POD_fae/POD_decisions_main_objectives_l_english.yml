 the_peace_of_making_objective_decision: "The Peace of Making"
 the_peace_of_making_objective_decision_desc: "Krofted are wrong. To push Long Winter back we shouldn't abandon nature and flee to humanity, But push humanity back and force them to embrace nature! And first step is cleaning krofted from [GetTrait('fae').GetName(GetPlayer)] and finally uniting under a single Elemental banner!"
