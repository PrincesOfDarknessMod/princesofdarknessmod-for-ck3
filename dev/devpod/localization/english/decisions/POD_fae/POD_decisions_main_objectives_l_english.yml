 the_middle_way_objective_decision: "The Middle Way"
 the_middle_way_objective_decision_desc: "We all are Inanimae at core. We all choose to link ourselves to nature or mankind, and we all for some reason act like we are superior from others. To survive and thrive we cannot just blindly follow future nor completely abandon tradition. Humanity is here to stay, and nature to be ground for them to nourish, One cannot survive without other so why we pretend otherwise? We should unite as Inanimae, keep tradition in our hearts while going forward. We shall thrive with both of sides!"
