l_english:
 groom_successor_decision:0 "Look For a Successor"
 groom_successor_decision_tooltip:1 "Your servants will suggest a number of suitable candidates"
 groom_successor_decision_desc:0 "Wan Kuei aren't able to [Embrace|E] or, most of the time, have children naturally. As such, if you don't want your hard work going to waste in case of an unfortunate accident, you must be prepared. You will ask your servants to bring forth a number of suitable candidates."
 groom_successor_decision_effect_tooltip:1 "You will be presented with a group of candidates and may accept one as your own child for a prestige fee"
 groom_successor_decision_confirm:0 "Start the search"
 
 advance_dharma_decision:0 "Advance Dharma"
 advance_dharma_decision_tooltip:1 "Advance your Dharma as you achieve enlightenment."
 advance_dharma_decision_desc:0 "Wan Kuei advance in their Dharma by achieving moments of enlightenment, called dah. These moments arrive rarely, and can be triggered by great insight into one's dharma, or occasionally by great diversion from it. Each step of the way is progressively harder, with the time between moments of enlightenment taking years, then centuries, the millennia at the highest levels. The most enlightened Wan Kuei spend much of their time in contemplation, chasing those moments of clarity.\n\nYou gain dharma trait experience by:"
 advance_dharma_decision_desc.boneflowers:0 "Binding wraiths, or passively while having bound wraiths and/or staying in the [yin_world|E]"
 advance_dharma_decision_desc.deviltigers:0 "Committing murder"
 advance_dharma_decision_desc.resplendentcranes:0 "Gaining titles, converting the culture of a county with your Steward, or passively while your capital has your culture"
 advance_dharma_decision_desc.thousandwhispers:0 "Gaining or losing relationships (lover, soulmate, friend, best friend, rival, nemesis)"
 advance_dharma_decision_desc.thrashingdragons:0 "Completing Sway/Seduce/Romance schemes, having sex, or passively while staying in the [yang_world|E]"
 advance_dharma_decision_desc.flameoftherisingphoenix:0 "Constructing a Kuei-Jin building"
 advance_dharma_decision_desc.faceofthegods:0 "Converting the faith of a county with your Court Chaplain, via True Faith mass conversion, or passively while your capital has your faith"
 advance_dharma_decision_desc.inwardway:0 "Meditating, moving to next Umbra location, or when gaining perks in one of the Kuei-Jin lifestyle trees"
 advance_dharma_decision_desc.wayofthetenthousandscreams:0 "Constructing a corrupted Dragon Nest, torturing prisoners, sacrificing prisoners/holdings/regions to demonic patrons, or passively while being a thrall or diabolist"
 advance_dharma_decision_confirm:0 "My journey continues"
 become_enlightened_decision:0 "Achieve Enlightenment"
 become_enlightened_decision_tooltip:1 "The final step of the Dharmic journey."
 become_enlightened_decision_desc:0 "You finally become Enlightened; this process often takes millennia, but when that moment of clarity happens, the cares of the Mortal World fall away and you can enter the Hundred Clouds. Your kharmic debt is paid, and you are finally free from the Great Cycle."
 become_enlightened_decision_confirm:0 "I am free"
 become_enlightened_decision_thrashingdragon_tt:0 "Has Modifier: [GetModifier( 'knowledge_of_thousand_cranes_mother_modifier' ).GetNameWithTooltip|L]"
 become_enlightened_decision_songoftheshadow_tt:0 "Has Modifier: [GetModifier( 'wisdom_of_black_pearl_mistress_modifier' ).GetNameWithTooltip|L]"
 become_enlightened_decision_resplendentcrane_tt:0 "Every [de_jure|E] [county|E] of your [capital|E] [empire|E] ([THIS.Char.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]) must be [THIS.Char.GetFaith.GetAdjective]"
 deviltiger_become_enlightened_decision_trigger:0 "You have killed #V 500#! person #weak ([SCOPE.ScriptValue('POD_killed_character_count')|0])#!"
 thousandwhispers_become_enlightened_decision_trigger:0 "You have given birth #V 23#! [GetTrait('dhampyr').GetName( GetPlayer )] child, raised them until adulthood, and killed them #weak ([SCOPE.ScriptValue('POD_killed_dhampyrchildren_count')|0])#!"
 become_enlightened_decision_resplendentcrane_tt2:0 "You have #V August Court#! government"
 
 hundreds_years_birthday_decision:0 "Celebrate the Hundred Years Second Breathday"
 hundreds_years_birthday_decision_desc:1 "It's your hundred year 'second breathday', time for a celebration."
 hundreds_years_birthday_decision_tooltip:1 "You will celebrate your hundred years second breathday"
 hundreds_years_birthday_decision_confirm:1 "Send the invitations"
 dragon_boat_festival_decision:0 "Hold Dragon Boat Festival"
 dragon_boat_festival_decision_desc:1 "A Wu might gather to honor the spirits during the Dragon Boat Festival."
 dragon_boat_festival_decision_tooltip:1 "You will celebrate the dragon boat festival"
 dragon_boat_festival_decision_confirm:1 "Send the invitations"
 practicing_arts_decision:0 "Practice your Arts"
 practicing_arts_decision_desc:1 "Enlightenment does not come without discipline. As all Eastern philosophies teach, you must refine yourself in body, mind and spirit before the mists can part for you. Intense training burns away mortal delusions; in this elevated state, den (hopefully) appears."
 practicing_arts_decision_tooltip:1 "You will concentrate your time on the practice of arts."
 practicing_arts_decision_confirm:1 "I want to practice my arts"
 practicing_arts_decision_custom:0 "Does #bold not#! have the correspond art [focus|E]"
 treking_wilds_decision:0 "Trekking the Wilds"
 treking_wilds_decision_desc:1 "Many wu practice rituals handed down since the earliest nights of the [fourth_age|E]. A wu might trek into the hengeyokai haunted wilds to meditate on the Blood Sutras."
 treking_wilds_decision_tooltip:1 "You concentrate your time to find adventure."
 treking_wilds_decision_confirm:1 "I want to trek into the wild"
 mortal_living_decision:0 "Living between Mortals"
 mortal_living_decision_desc:1 "Many wu practice rituals handed down since the earliest nights of the [fourth_age|E]. A wu might live as mortals for a month out of every year."
 mortal_living_decision_tooltip:1 "You will visit the mortal world."
 mortal_living_decision_confirm:1 "I want to live with mortals"
 
 broken_mask_decision:0 "Broken Mask"
 broken_mask_decision_desc:1 "To offset their destructive natures, Whispers cultivate the Broken Mask technique -- a multiple-personality path to enlightenment. While most people cling to their identities, the Rootless Trees take on different personas, then kill them off when all lessons appear to have been learned. Since most lives tend to be full-time affairs, many vampires take on one or two personas at once, then stage tragic deaths and enter new roles. Immortal as they are, the Whispers can experience the full range of human perspective and thus rise above any single view."
 broken_mask_decision_tooltip:1 "You will try kill all your friend and lover and start a new life."
 broken_mask_decision_confirm:1 "Die for Me"
 
 POD_nushi_duty_punish_impious_decision:0 "Duty: Punish Impious"
 POD_nushi_duty_punish_impious_decision_tooltip:1 "Finish the demand of your nushi"
 POD_nushi_duty_punish_impious_decision_desc:0 "Punish the impious student who carved lewd graffiti on your nushi sacred image."
 POD_nushi_duty_punish_impious_decision_confirm:0 "Done"
 POD_nushi_duty_punish_impious_decision_condition:0 "You have tortured, revoked title from, gained duel or board game, or killed [GetPlayer.MakeScope.GetVariable('impious').GetCharacter.GetFirstName]"
 
 POD_nushi_duty_prevent_vampire_decision:0 "Duty: Prevent Kin-Jin"
 POD_nushi_duty_prevent_vampire_decision_tooltip:1 "Finish the demand of your nushi"
 POD_nushi_duty_prevent_vampire_decision_desc:0 "Prevent the Western blood-drinkers from defiling the sacred shrine."
 POD_nushi_duty_prevent_vampire_decision_confirm:0 "Done"
 POD_nushi_duty_prevent_vampire_decision_condition:0 "You must win a war against any vampire."
 
 POD_nushi_duty_steal_necklace_decision:0 "Duty: Steal Necklace"
 POD_nushi_duty_steal_necklace_decision_tooltip:1 "Finish the demand of your nushi"
 POD_nushi_duty_steal_necklace_decision_desc:0 "Go to the Yomi Hell of Being Skinned Alive and bring to your nushi the necklace of the Yama Queen Tou Mu."
 POD_nushi_duty_steal_necklace_decision_confirm:0 "Done"
 POD_nushi_duty_steal_necklace_decision_condition:0 "You own the necklace of the Tou Mu artifact."
 
 POD_nushi_duty_steal_necklace_pre_decision:0 "Steal Necklace"
 POD_nushi_duty_steal_necklace_pre_decision_tooltip:1 "Finish the demand of your nushi"
 POD_nushi_duty_steal_necklace_pre_decision_desc:0 "Go to the Yomi Hell of Being Skinned Alive. As the name implies, this travel can be very deadly."
 POD_nushi_duty_steal_necklace_pre_decision_confirm:0 "Done"
 POD_nushi_duty_steal_necklace_pre_decision_effect_tooltip:0 "You will descend to Yomi and either succeed or die."