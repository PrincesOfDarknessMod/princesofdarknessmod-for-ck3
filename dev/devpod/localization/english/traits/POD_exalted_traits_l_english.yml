l_english:
 trait_exalted: "Exalted"
 trait_track_exalted: "Essence Rating"
 trait_track_exalted_desc: "$game_concept_essence_rating_desc$"

 trait_exalted_terrestrial_dragon_touched: "#medium Your [children|E] that are born [GetTrait('dragon_touched').GetName(GetNullCharacter)] will have #V [ROOT.Char.MakeScope.ScriptValue('POD_dragon_touched_exaltion_chance')]%#! chance to undergo [terrestrial_exaltion|E].\n#weak [ROOT.Char.MakeScope.GetScriptValueDesc('POD_dragon_touched_exaltion_chance')]#!#!"
 
 trait_exalted_terrestrial: "Terrestrial Exalted"
 trait_exalted_terrestrial_desc: "Alone among the Exalted, the Dragon-Blooded are the only natives of the World of Darkness. They've hidden on the periphery of the supernatural world since prehistory. They know the dark prophecies and dire portents of what's coming."
 trait_exalted_terrestrial_character_desc: "$trait_exalted_terrestrial_dragon_touched$\n\n$trait_exalted_terrestrial_desc$"
 
 trait_track_exalted_terrestrial: "$trait_track_exalted$"
 trait_track_exalted_terrestrial_desc: "$trait_track_exalted_desc$"

 trait_terrestrial_aspect: "Aspect"
 TRAIT_FLAG_DESC_terrestrial_aspect_shared_condition: "Have BUILDING in your [domicile|E] or"
 
 trait_terrestrial_aspect_air: "Aspect of Air"
 trait_terrestrial_aspect_air_desc: "Erudite scholars and fierce fighters, Aspects of Air are equally adept at subtle action and explosive violence."
 TRAIT_FLAG_DESC_essence_condition_terrestrial_aspect_air: "[essence_fluctuation_caste_condition|E]: $TRAIT_FLAG_DESC_terrestrial_aspect_shared_condition$ be located in the same [duchy|E] as a [GetTerrain('mountains').GetName] or [GetTerrain('desert_mountains').GetName] [province|E]"
 
 trait_terrestrial_aspect_earth: "Aspect of Earth"
 trait_terrestrial_aspect_earth_desc: "Stolid, certain, resolute, and implacable, Aspects of Earth resonate with the hidden depths of things and the ways of crafting the world into permanent forms."
 TRAIT_FLAG_DESC_essence_condition_terrestrial_aspect_earth: "[essence_fluctuation_caste_condition|E]: $TRAIT_FLAG_DESC_terrestrial_aspect_shared_condition$ be located in the same [duchy|E] as a [GetTerrain('farmlands').GetName] or [GetTerrain('plains').GetName] [province|E]"

 trait_terrestrial_aspect_fire: "Aspect of Fire"
 trait_terrestrial_aspect_fire_desc: "Passionate, impulsive, lusty, and violent, Aspects of Fire are equally at ease in the midst of a wild fight or wild party."
 TRAIT_FLAG_DESC_essence_condition_terrestrial_aspect_fire: "[essence_fluctuation_caste_condition|E]: $TRAIT_FLAG_DESC_terrestrial_aspect_shared_condition$ be located in the same [duchy|E] as a [GetTerrain('desert').GetName] or [GetTerrain('desert_mountains').GetName] [province|E]"

 trait_terrestrial_aspect_water: "Aspect of Water"
 trait_terrestrial_aspect_water_desc: "Smooth, adaptable, and sometimes sinister, Aspects of Water can go with the flow and exploit any situation to their best advantage."
 TRAIT_FLAG_DESC_essence_condition_terrestrial_aspect_water: "[essence_fluctuation_caste_condition|E]: $TRAIT_FLAG_DESC_terrestrial_aspect_shared_condition$ be located in the same [duchy|E] as a coastal or riverside [province|E]"

 trait_terrestrial_aspect_wood: "Aspect of Wood"
 trait_terrestrial_aspect_wood_desc: "At times nurturing, at times venomous, Aspects of Wood understand the connections between living things and living systems."
 TRAIT_FLAG_DESC_essence_condition_terrestrial_aspect_wood: "[essence_fluctuation_caste_condition|E]: $TRAIT_FLAG_DESC_terrestrial_aspect_shared_condition$ be located in the same [duchy|E] as a [GetTerrain('jungle').GetName], [GetTerrain('forest').GetName] or [GetTerrain('taiga').GetName] [province|E]"


 trait_dragon_touched: "Dragon-Touched"
 trait_dragon_touched_desc: "Those who carry the blood of the Dragons, but not their blessing of power, are known as the Dragon-Touched: the sons and daughters, and grandsons and granddaughters, of the Dragon-Blooded."
 trait_dragon_touched_character_desc: "$trait_exalted_terrestrial_dragon_touched$\n\n$trait_dragon_touched_desc$"