 trait_track_dharma_desc_in_game: "#Bold You #weak (player)#! get [GetPlayer.MakeScope.ScriptValue('POD_kueijin_dharma_xp_passive')|1V] Dharma [trait_level_track_xp|E] every #V 2#! years (#underline #TOOLTIP:trait_track_dharma_desc_in_game_tt Breakdown#!#!)#!\nInsight is a measure of how close you are to advancing your Dharma. When the [trait_level_track_xp|E] reaches the first level, your dharma level increases with the exception of dharma 10.\n\nInsight can be gained by doing certain actions based on your [faith|E] or [religion|E] #X #underline;TOOLTIP:trait_track_dharma_desc_insight_active Visible Here#! #! #bold or#! every #V 2#! years based on passive dharma insight gain #X #underline;TOOLTIP:trait_track_dharma_desc_insight_passive Visible Here#! #! ."
