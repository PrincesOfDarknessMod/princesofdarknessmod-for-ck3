 trait_faerie_eternity:0 "Faerie Eternity"
 trait_faerie_eternity_desc:0 "After you went through your Chrysalis, you had a birthday, and then another, and then another. Something was strange, however — you didn't seem to be growing or getting older. You are touched with a vestige of the immortality that used to be the birthright of all fae."
 
 trait_prodigal:0 "Prodigal"
 trait_enchanted_dreamers:0 "Enchanted Dreamers"
 trait_dark_chimera:0 "Dark Chimera"