l_english:
 trait_fae:0 "True Fae"
 trait_fae_desc:0 "True Fae is a term given to any spirits who are native to the [dreaming|E], are not chimera, and have not undergone the Changeling Way. While there is no comprehensive list of the entities, it would include Firstborn, Dark-kin, and arguably Inanimae."
 trait_firstbornfae:0 "Firstborn Fae"
 trait_firstbornfae_desc:0 "The Firstborn Fae are creatures of the primordial Mists that sprang fully formed into being. The firstborn claim that they ruled and even created the entire world and that they alone had the right to dictate the laws and decrees of the magical realms. Though skeptical, many Fae agreed to this and referred to them as the 'True Fae'. The rise of humanity has strongly diminished the power of the Firstborn and many feared their fate if something is not done. Some have already left the earth to take refuge in Arcadia."
 trait_denizen:0 "Adhene"
 trait_denizen_desc:0 "Kithain arbitrarily call these creatures "Dark-kin" because of their vile reputation as servitors of the Fomorians. Despite their abrupt departure from human lands, the Adhene maintained a direct, albeit subtle, connection to the human psyche. Personifying various aspects of human dreams or fears, the number of adhene species is vast and varied."
 trait_inanimae:0 "Inanimae"
 trait_inanimae_desc:0 "The Inanimae are cousins to the True Fae. While they are not true elemental spirits, they have a close kinship to them. Each Inanimae fashions itself after a specific element."
 trait_changeling:0 "Changeling"
 trait_changeling_desc:0 "Changelings are the Fae born to humans. The old Courts believed that the First Woman who came to lay with the First Man had been one of the Firstborn. From the union between the two, the first changeling was born, although the pair had more children and the First Woman had other partners. Other explanations, especially by the more anti-humanist fae, were that Changelings were the remnants of deformed and unwanted fae that were exchanged with mortal children and raised among them."
 trait_kinain:0 "Kinain"
 trait_kinain_desc:0 "A Kinain is a mortal that possesses faerie blood, but is not a full Changeling."
 
 trait_kithain:0 "Kithain"
 trait_jinn:0 "Jinn"
 trait_african_kiths:0 "African Kiths"
 trait_hsien:0 "Hsien"
 trait_phyla:0 "Phyla"
 
 trait_sidhe:0 "Sidhe"
 trait_sidhe_desc:0 "The noble and beautiful rulers of faeriekind, the sidhe are the otherworldly beautiful leaders of the classic faerie lords."
 trait_boggan:0 "Boggan"
 trait_boggan_desc:0 "Practical and hardworking, boggans are the keepers of households and industrious homemakers."
 trait_clurichaun:0 "Clurichaun"
 trait_clurichaun_desc:0 "Fun-loving and charismatic, these Kithain are the origin of the stories of leprechauns."
 trait_eshu:0 "Eshu"
 trait_eshu_desc:0 "The ultimate wanderers, eshu are consummate storytellers and explorers."
 trait_ghilledhu:0 "Ghille dhu"
 trait_ghilledhu_desc:0 "Spirits of the green and nature, the ghille dhu were once thriving creatures that shifted their natures based on the season."
 trait_oba:0 "Oba"
 trait_oba_desc:0 "The Nobles of the Elegbara, land-bound cousins to the Eshu."
 trait_nocker:0 "Nocker"
 trait_nocker_desc:0 "These foul-mouthed curmudgeons might be small and strange to look at, but their need to craft and build makes them the ingenious inventors of Kithain society."
 trait_piskey:0 "Piskey"
 trait_piskey_desc:0 "Piskies are an innocent, wide-eyed kith, made up of natural wanderers that seek the beautiful and awe-inspiring beauty of the world."
 trait_pooka:0 "Pooka"
 trait_pooka_desc:0 "Pranksters at best and terrors at worst, these Kithain each share an affinity with a particular animal and adore practical jokes."
 trait_troll:0 "Troll"
 trait_troll_desc:0 "These powerful giants embody the loyalty, honor, and strength of the fae."
 trait_redcap:0 "Redcap"
 trait_redcap_desc:0 "These hideous Kithain are monstrous eating machines, terrifying to behold and full of bad attitudes and violence."
 trait_riverhag:0 "River Hag"
 trait_riverhag_desc:0 "These water-logged fae live in fast-moving bodies of water and drag in unsuspecting prey to drown."
 trait_satyr:0 "Satyr"
 trait_satyr_desc:0 "Satyrs are the spirit of pleasure and passion given form."
 trait_sluagh:0 "Sluagh"
 trait_sluagh_desc:0 "These dark and secretive fae are the best at collecting information and guarding secrets."
 trait_swanmaiden:0 "Swan Maiden"
 trait_swanmaiden_desc:0 "Swan Maidens are a recently-emerged kith born from dreams of romance and true love."
 trait_wichtel:0 "Wichtel"
 trait_wichtel_desc:0 "Miners and other workers are the bedrock of a community because they do tasks that must be completed no matter how unpleasant, venture into darkness and danger in search of the resources society depends upon, and perform perilous, backbreaking work without expectation of fame or fortune. The job gets done because it must. The Wichtel embody this ethos."
 trait_ifrit:0 "Ifrit"
 trait_ifrit_desc:0 "Forged in flame and battle hardened, an Ifrit has little patience for weakness."
 trait_lilin:0 "Lilin"
 trait_lilin_desc:0 "Headstrong and alluring, a Lilin knows what she wants and how to get it."
 trait_qareen:0 "Qareen"
 trait_qareen_desc:0 "Qurana’ have the gift and curse of eidetic memory, and other Jinn refer to them as “walking libraries.”"
 trait_shaytan:0 "Shaytan"
 trait_shaytan_desc:0 "Dealmaker, trickster, temptress, charlatan – these are the labels fixed to a Shaytan."
 trait_biloko:0 "Biloko"
 trait_biloko_desc:0 "This kith emphasizes the value of tradition and heritage, being tightly bound to their culture and community and being wary of outsiders."
 trait_djedi:0 "Djedi"
 trait_djedi_desc:0 "Lovers of society, partying and merriment, the Djedi are instant celebrities who are as gifted with sorcery as they are cursed with blatancy."
 trait_kuino:0 "Kuino"
 trait_kuino_desc:0 "Hopeful, ambitious, and industrious - this kith is made up of the drive to achieve success and better living, though they must beware greed and the loss of their sacred objects on that quest."
 trait_obambo:0 "Obambo"
 trait_obambo_desc:0 "This kith is made up of gifted explorers and adventurers who know all the tricks of exploring the Land of Ancient Dreams and getting away with it and the spoils, as affable as they seem though they are dangerous when their beloved are threatened." 
 trait_okubili:0 "Okubili"
 trait_okubili_desc:0 "Level-headed and attuned to their past lives and focused on maintaining balance in all their current lives, this kith loves to teach but sometimes become wrapped up in the concerns of past lives." 
 trait_chuihyu:0 "Chu-ih-yu"
 trait_chuihyu_desc:0 "A Kwannon-jin of the Eastern Hsien, the Chu-ih-yu are elemental nobles; Kamuii Shinma of the element of Metal." 
 trait_chujung:0 "Chu Jung"
 trait_chujung_desc:0 "A Kwannon-jin of the Eastern Hsien, the Chu Jung are elemental nobles; Kamuii Shinma of the element of Fire." 
 trait_fuhsi:0 "Fu Hsi"
 trait_fuhsi_desc:0 "A Kwannon-jin of the Eastern Hsien, the Fu Hsi are commoners; Hirayanu Shinma attuned to the element of Wood with the ability to turn into snakes. " 
 trait_hanumen:0 "Hanumen"
 trait_hanumen_desc:0 "A Kwannon-jin of the Eastern Hsien, the Hanumen are commoners; Hirayanu Shinma attuned to the element of Earth with the ability to turn into monkeys." 
 trait_hengpo:0 "Heng Po"
 trait_hengpo_desc:0 "A Kwannon-jin of the Eastern Hsien, the Heng Po are commoners; Hirayanu Shinma attuned to the element of Water with the ability to turn into fish." 
 trait_houchi:0 "Hou-chi"
 trait_houchi_desc:0 "A Kwannon-jin of the Eastern Hsien, the Hou-chi are elemental nobles; Kamuii Shinma of the element of Wood." 
 trait_komuko:0 "Komuko"
 trait_komuko_desc:0 "A Kwannon-jin of the Eastern Hsien, the Komuko are elemental nobles; Kamuii Shinma of the element of Earth." 
 trait_nyan:0 "Nyan"
 trait_nyan_desc:0 "A Kwannon-jin of the Eastern Hsien, the Nyan are commoners; Hirayanu Shinma attuned to the element of Fire with the ability to turn into cats." 
 trait_suijen:0 "Suijen"
 trait_suijen_desc:0 "A Kwannon-jin of the Eastern Hsien, the Suijen are elemental nobles; Kamuii Shinma of the element of Water." 
 trait_tanuki:0 "Tanuki"
 trait_tanuki_desc:0 "A Kwannon-jin of the Eastern Hsien, the Tanuki are commoners; Hirayanu Shinma attuned to the element of Metal with the ability to turn into tanuki or raccoon-dogs (often mis-translated as "badgers")." 
 trait_glome:0 "Glome"
 trait_glome_desc:0 "Inanimae of Earth and members of the Empire of Stones." 
 trait_kubera:0 "Kubera"
 trait_kubera_desc:0 "Inanimae of Wood and members of the Empire of Seeds." 
 trait_ondine:0 "Ondine"
 trait_ondine_desc:0 "Inanimae of Water and members of the Empire of Tears." 
 trait_paroseme:0 "Paroseme"
 trait_paroseme_desc:0 "Inanimae of Air and members of the Empire of Skies." 
 trait_solimond:0 "Solimond"
 trait_solimond_desc:0 "Inanimae of Fire and former members of the Empire of Flames." 
 trait_mannikin:0 "Mannikin"
 trait_mannikin_desc:0 "Inanimae of human-shaped elements and members of the Empire of Dolls." 
 
 trait_realm_actor:0 "Realm Actor Mastery"
 trait_realm_actor_desc:0 "Actor is the realm connected to all worldly beings, with a direct correlation to how well you know them. The less acquainted you are with a particular being, be it a werewolf, mortal, wraith, vampire, etc., the greater mastery of Actor is required. To affect someone you are opposed to, regardless of knowledge, requires complete mastery." 
 trait_realm_fae:0 "Realm Fae Mastery"
 trait_realm_fae_desc:0 "Fae deals with other beings of the [dreaming|E]. To affect other Changelings, the Noble Sidhe, Adhene, Chimera, or even controlling Changeling magic itself all fall under the realm of Fae." 
 trait_realm_nature:0 "Realm Nature Mastery"
 trait_realm_nature_desc:0 "Nature is the control of plants, land, and beasts. Anything untouched by creation lends itself to be controlled by the Nature realm." 
 trait_realm_prop:0 "Realm Prop Mastery"
 trait_realm_prop_desc:0 "Prop is the control and manipulation of all created objects. Clothing, weapons, buildings, and anything else "created" falls under Prop. The more complicated the device the more mastery of the Prop realm is required." 
 trait_realm_scene:0 "Realm Scene Mastery"
 trait_realm_scene_desc:0 "Scene is the control of space. The more you master the realm of Scene the larger area or the more targets (in conjunction with other realms) you can affect." 
 trait_realm_time:0 "Realm Time Mastery"
 trait_realm_time_desc:0 "Time is the control of when your cantrips will happen or how long they will last. Mastery of Time dictates the length your spells may last or how long you can set a "trigger" upon them."  
 trait_realm_air:0 "Realm Air Mastery"
 trait_realm_air_desc:0 "Air is the element that surrounds the globe. It effects non-living environment and a cantrip that effects weather, air, temperature, or anything else within the area of the caster or target."
 trait_realm_earth:0 "Realm Earth Mastery"
 trait_realm_earth_desc:0 "Earth affects non-living, non-supernatural objects, natural and crafted."
 trait_realm_fire:0 "Realm Fire Mastery"
 trait_realm_fire_desc:0 "Fire is used to effect non-supernatural living creatures. It effects only the physical aspect of such creatures. This realm would also be used to affect mortal humans physically."
 trait_realm_water:0 "Realm Water Mastery"
 trait_realm_water_desc:0 "Water only effects the mental environment of non-supernatural living creatures. Confusing others needs this realm."
 trait_realm_spirit:0 "Realm Spirit Mastery"
 trait_realm_spirit_desc:0 "Spirit is used to effect any aspect of a supernatural being or thing, including other Fae. It effects environment as well as the physical and mental realms. It also effects enchanted mortals."
 
 trait_chicanery:0 "Chicanery"
 trait_legerdemain:0 "Legerdemain"
 trait_primal:0 "Primal"
 trait_soothsay:0 "Soothsay"
 trait_wayfare:0 "Wayfare"
 trait_chronos:0 "Chronos"
 trait_dream_craft:0 "Dream-Craft"
 trait_naming:0 "Naming"
 trait_sovereign:0 "Sovereign"
 trait_infusion:0 "Infusion"
 trait_tale_craft:0 "Tale Craft"
 
 trait_art_chicanery:0 "Chicanery Art"
 trait_art_chicanery_desc:0 "Chicanery is the deceptive magical power of illusion and emotional manipulation. Those who practice it extensively are often considered somewhat untrustworthy by nobles." 
 trait_art_legerdemain:0 "Legerdemain Art"
 trait_art_legerdemain_desc:0 "Legerdemain allows a changeling to control his environment through telekinetic means, from remotely picking pockets to grabbing and hurling large objects around. This Art also allows for the creation of solid illusionary objects and creatures." 
 trait_art_primal:0 "Primal Art"
 trait_art_primal_desc:0 "Primal allows a changeling to manipulate the forces of nature, from summoning the elements to communing with inanimate objects. It also gives power over the body, allowing a fae to harden his skin like tree bark, heal injuries, rip flesh apart and even shapeshift." 
 trait_art_soothsay:0 "Soothsay Art"
 trait_art_soothsay_desc:0 "Soothsay represents the changeling's ability to see into the future. Depending on the realms used in conjunction, the changeling may be able to learn information about a person, place, or item." 
 trait_art_wayfare:0 "Wayfare Art"
 trait_art_wayfare_desc:0 "The Art of Wayfare deals with a changeling's ability to move through space. This involves bouncing and covering far distances, speeding forward on feet that move impossibly fast, and even teleporting from one place to another." 
 trait_art_chronos:0 "Chronos Art"
 trait_art_chronos_desc:0 "Chronos is the Art of temporal manipulation. Unlike the methods of altering time known to other supernaturals, Chronos is fairly indirect, and almost never goes in linear order - instead, it is an Art of being disjunct from the proper order of time, causing its practitioners to be difficult to affect with Time magic, and lose sight of how time should operate." 
 trait_art_dream_craft:0 "Dream-Craft Art"
 trait_art_dream_craft_desc:0 "Dream-Craft is the Art of manipulating the raw stuff that the [dreaming|E] is made of. This art allows Sidhe to change the physical forms within the Dreaming, which can affect the way that freeholds and other sanctuaries of the Dreaming look. It can also affect voile, the chimerical clothing that changelings wear while in the Dreaming." 
 trait_art_naming:0 "Naming Art"
 trait_art_naming_desc:0 "Naming is the Art of True Names and the power of words. It is one of the most insidious Arts known to the Kithain, as while its low levels are deceptively non-threatening, a master of Naming can easily cause irreparable damage. Overly frivolous uses of Naming are not taken lightly by the nobility, who swiftly bring justice to those who subvert its effects." 
 trait_art_sovereign:0 "Sovereign Art"
 trait_art_sovereign_desc:0 "Sovereign is the Art of controlling commoners and noble majesty. It is one of the most political Arts commonly practiced by the Kithain, and exists largely to ensure the maintenance of their political structures." 
 trait_art_infusion:0 "Infusion Art"
 trait_art_infusion_desc:0 "Infusion is the Art that assists Nockers in creating all of their wonderful clockwork and chimerical items. It involves the connection of "FUBARS" and other chimerical entities into physical or chimerical forms." 
 trait_art_tale_craft:0 "Tale Craft Art"
 trait_art_tale_craft_desc:0 "Tale Craft is the Eshu Art of telling wondrous stories, by means of providing special effects, reading the crowd, and manipulating their emotions. The Bunk for a Tale Craft cantrip is, with few exceptions, a story, whether spoken or sung." 
 
 trait_art_chicanery_advanced:0 "Chicanery Art Mastery"
 trait_art_chicanery_advanced_desc:0 "Chicanery is the deceptive magical power of illusion and emotional manipulation. Those who practice it extensively are often considered somewhat untrustworthy by nobles." 
