l_english:

 ##############################################################################
 ###### POD COMBAT - DEBUG TUNING WINDOW
 ##############################################################################
 # Labels and tooltips for pod_combat_tuning_window.gui, the runtime balancing
 # panel opened by pod_combat_debug_tuning_interaction (debug builds only).
 #
 # TRANSLATORS: this file is OPTIONAL. Nothing here is reachable in normal
 # play - it is a developer tool for tuning combat numbers, and the text is
 # dense jargon about internal mechanics. The player-facing combat  UI 
 # is in POD_combat_static_l_english.yml.
 #
 # Each knob is a pair: _label for the row, _tt for its hover text. Checkbox
 # rows add a _cb_tt for the box itself, and the two clearable knobs add a
 # _clear_tt for their X button.
 ##############################################################################

 ###### Window chrome
 pod_combat_tune_window_title: "#high;bold Combat Tuning (debug)#!"
 pod_combat_tune_reset_all:    "Reset All"
 pod_combat_tune_reset_all_tt: "Remove every tuned override - back to shipped defaults"
 pod_combat_tune_footer:       "#weak * = tuned override (persists in the save). AP / initiative / hit / tier knobs apply from the next turn or roll; starting morale from the next fight; loadout caps at the editor.#!"

 ###### AP economy
 pod_combat_tune_base_ap_label:             "Max AP cap"
 pod_combat_tune_base_ap_tt:                "Max AP per turn (the full bar). Applies from the next turn. The pip strip displays at most 6."
 pod_combat_tune_ap_regen_label:            "AP regen / round"
 pod_combat_tune_ap_regen_tt:               "AP regained each turn; unspent AP carries over on the slot, capped at the AP cap. Unset = full-bar refill. A combatant's first turn always starts full."
 pod_combat_tune_ap_regen_clear_tt:         "Clear: back to full-bar refill each turn"
 pod_combat_tune_ap_cap_start_label:        "AP cap start (rnd 1)"
 pod_combat_tune_ap_cap_start_tt:           "Escalating cap: the AP cap in round 1. Only matters while AP cap +/round is set."
 pod_combat_tune_ap_cap_increment_label:    "AP cap +/round"
 pod_combat_tune_ap_cap_increment_tt:       "Escalating cap: the AP cap grows by this each round (start + N per round) until it reaches Max AP cap. Clear = off."
 pod_combat_tune_ap_cap_increment_clear_tt: "Clear: no escalating cap"

 ###### Morale
 pod_combat_tune_starting_morale_label:    "Starting morale"
 pod_combat_tune_starting_morale_tt:       "Morale every combatant enters the fight with (per-character hooks add on top; floored at 1). Takes effect next fight."
 pod_combat_tune_max_morale_label:         "Morale cap (6-box)"
 pod_combat_tune_max_morale_tt:            "Morale ceiling for a 6-box combatant (vampire, kuei-jin, risen). Every wound box above or below 6 shifts that combatant's own ceiling by 5, so this moves the whole ladder rather than setting one flat cap. Drives heals and the end-of-fight strain deficit. Live."
 pod_combat_tune_morale_stress_mult_label: "Morale->stress mult"
 pod_combat_tune_morale_stress_mult_tt:    "Stress inflicted per point of end-of-fight morale deficit (Mental Strain, applied once at combat end)."

 ###### Loadout caps
 pod_combat_tune_max_per_category_label: "Loadout / category"
 pod_combat_tune_max_per_category_tt:    "Equip cap per category (ATK / DEF / CTL / PWR). Enforced in the loadout editor; the pip strips still draw 4. The combat window widens to fit 5+ moves per row - past 5 it can outgrow a 1920-wide screen."
 pod_combat_tune_max_equipped_label:     "Loadout total"
 pod_combat_tune_max_equipped_tt:        "Total equip cap across all categories. Enforced in the loadout editor."

 ###### Initiative
 pod_combat_tune_init_reroll_label:           "Initiative: reroll each round"
 pod_combat_tune_init_reroll_tt:              "Re-roll every combatant's initiative at the start of each round, instead of keeping the roll they entered the fight with. Off by default. Initiative debuffs are a one-round shift either way."
 pod_combat_tune_init_reroll_cb_tt:           "Re-roll initiative every round instead of keeping the roll each combatant entered with"
 pod_combat_tune_init_decouple_prowess_label: "Init: decouple prowess"
 pod_combat_tune_init_decouple_prowess_tt:    "Use a flat baseline instead of prowess as each combatant's initiative starting line. The baseline is the Init baseline knob below (default 20). Bases are rolled once per combatant, so this applies to the next fight (or a combatant joining one) unless reroll each round is on."
 pod_combat_tune_init_decouple_prowess_cb_tt: "Use the flat Init baseline instead of prowess as the initiative starting line"
 pod_combat_tune_init_base_label:             "Init baseline"
 pod_combat_tune_init_base_tt:                "Flat initiative starting line used INSTEAD of prowess while decouple prowess is on (ignored otherwise). Bases are rolled once per combatant, so this applies to the next fight (or a combatant joining one) unless reroll each round is on."
 pod_combat_tune_init_roll_max_label:         "Initiative roll max"
 pod_combat_tune_init_roll_max_tt:            "Random part of initiative: a roll of 1 to N added to the base (prowess, or the flat baseline if decoupled). 1 = near-deterministic (the base decides). Bases are rolled once per combatant, so this applies to the next fight (or a combatant joining one) unless reroll each round is on."
 pod_combat_tune_init_celerity_bonus_label:   "Init / speed perk"
 pod_combat_tune_init_celerity_bonus_tt:      "Initiative per perk owned in the Celerity (Vampire) or Black Wind (Kuei-jin) speed tree (0 = off). Folded into the base, which is rolled once per combatant, so this applies to the next fight (or a combatant joining one) unless reroll each round is on."

 ###### Hit chance
 pod_combat_tune_hit_base_label: "Hit chance base"
 pod_combat_tune_hit_base_tt:    "Base hit chance before the prowess difference. Applies from the next hit-chance recalc."
 pod_combat_tune_hit_min_label:  "Hit chance min"
 pod_combat_tune_hit_min_tt:     "Lower clamp on live hit chance."
 pod_combat_tune_hit_max_label:  "Hit chance max"
 pod_combat_tune_hit_max_tt:     "Upper clamp on live hit chance (also caps the conditional bonus hit)."

 ###### Buff / debuff tiers
 pod_combat_tune_tier_small_label:    "Tier small mag"
 pod_combat_tune_tier_small_tt:       "Magnitude of tier-1 buffs and debuffs (soak and hit alike). Live via the recalcs."
 pod_combat_tune_tier_medium_label:   "Tier medium mag"
 pod_combat_tune_tier_medium_tt:      "Magnitude of tier-2 buffs and debuffs."
 pod_combat_tune_tier_large_label:    "Tier large mag"
 pod_combat_tune_tier_large_tt:       "Magnitude of tier-3 buffs and debuffs."
 pod_combat_tune_stealth_bonus_label: "Stealth hit bonus"
 pod_combat_tune_stealth_bonus_tt:    "Hit-chance bonus while stealthed (consumed on the next attack). Help texts keep saying +30 until the value is promoted."

 ###### AI behaviour
 pod_combat_tune_ai_trace_label:         "AI decision trace"
 pod_combat_tune_ai_trace_tt:            "Log one line per AI move pick and per AI turn to debug.log (search 'pod_combat_trace'). Records what the AI chose and the state it chose from, plus why each turn ended. Debug only: it roughly doubles the per-action selection work while on."
 pod_combat_tune_ai_trace_cb_tt:         "Emit the AI decision trace to debug.log (costs performance while on)"
 pod_combat_tune_ai_hp_finish_label:     "AI finish threshold"
 pod_combat_tune_ai_hp_finish_tt:        "Empty wound boxes at or below which the AI treats an enemy as finishable - drives its emergency-heal restraint. Applies immediately. Default 1."
 pod_combat_tune_ai_band_width_label:    "AI top-band width"
 pod_combat_tune_ai_band_width_tt:       "How far below the BEST-scoring move a move may score and still be considered. Lower = sharper and more predictable; 0 means the AI always takes its top-scored move (plus ties). Raise it past ~100 and the band stops doing anything. Inside the band the AI still picks proportionally by score."
 pod_combat_tune_ai_kill_priority_label: "AI kill-priority boxes"
 pod_combat_tune_ai_kill_priority_tt:    "Empty wound boxes at or below which the AI target selector triples a target's weight (focus the nearly-dead). Applies immediately. Default 2."
 pod_combat_tune_ai_mor_finish_label:    "AI morale-finish threshold"
 pod_combat_tune_ai_mor_finish_tt:       "Enemy morale at or below which the AI counts that enemy as finishable by morale damage. Feeds the finishable flag, and through it the intent lottery's kill bonuses and a dying actor's restraint about healing instead of finishing. Target SELECTION is the morale kill-priority row below, not this one. Applies immediately. Default 2."
 pod_combat_tune_ai_mor_kill_label:      "AI morale kill-priority"
 pod_combat_tune_ai_mor_kill_tt:         "Enemy morale at or below which the AI target selector triples that target's weight, for an actor that can actually deal morale damage. The morale twin of kill-priority boxes. Keep it at or above the morale-finish threshold, or the AI converges on enemies it cannot finish. Applies immediately. Default 3."
