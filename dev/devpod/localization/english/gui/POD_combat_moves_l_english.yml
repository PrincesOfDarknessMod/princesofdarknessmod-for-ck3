 POD_combat_move_demon_preternatural_reflexes_desc: "[PODCombatMoveDesc('POD_combat_move_demon_preternatural_reflexes')]"
 POD_combat_move_demon_preternatural_reflexes_tooltip: "#weak;italic What attack can they muster that you haven't already seen in your infinite existence?#!" 
 POD_combat_move_demon_invisibility: "@demon_icon!Invisibility"
 POD_combat_move_demon_invisibility_desc: "[PODCombatMoveDesc('POD_combat_move_demon_invisibility')]"
 POD_combat_move_demon_invisibility_tooltip: "#weak;italic Their eyes were never attuned to the presence of such a divine being.#!" 
 POD_combat_move_demon_damage_immunity: "@demon_icon!Damage Immunity"
 POD_combat_move_demon_damage_immunity_desc: "[PODCombatMoveDesc('POD_combat_move_demon_damage_immunity')]"
 POD_combat_move_demon_damage_immunity_tooltip: "#weak;italic They had hope of being able to strike you down. Make sure they understand the truth.#!" 
 POD_combat_move_demon_speed_of_thought: "@demon_icon!Speed of Thought"
 POD_combat_move_demon_speed_of_thought_desc: "[PODCombatMoveDesc('POD_combat_move_demon_speed_of_thought')]"
 POD_combat_move_demon_speed_of_thought_tooltip: "#weak;italic Time is but a construct. A construct your kind created.#!" 
 POD_combat_move_demon_inhuman_strength: "@demon_icon!Inhuman Strength"
 POD_combat_move_demon_inhuman_strength_desc: "[PODCombatMoveDesc('POD_combat_move_demon_inhuman_strength')]"
 POD_combat_move_demon_inhuman_strength_tooltip: "#weak;italic You were created to be the strongest being of Creation. Even a fraction of this power will be enough to finish this battle.#!" 
 POD_combat_move_demon_celestial_radiance: "@demon_icon!Celestial Radiance"
 POD_combat_move_demon_celestial_radiance_desc: "[PODCombatMoveDesc('POD_combat_move_demon_celestial_radiance')]"
 POD_combat_move_demon_celestial_radiance_tooltip: "#weak;italic A one-winged angel descends upon the battlefield. Marvel and despair.#!" 
 POD_combat_move_demon_lash_of_anguish: "@demon_icon!Lash of Anguish"
 POD_combat_move_demon_lash_of_anguish_desc: "[PODCombatMoveDesc('POD_combat_move_demon_lash_of_anguish')]"
 POD_combat_move_demon_lash_of_anguish_tooltip: "#weak;italic A single, small, taste of what you suffered in Hell. But enough to drive them mad.#!" 

 ######### Lore of the World
 POD_combat_move_demon_manipulate_inertia: "@demon_icon!Manipulate Inertia"
 POD_combat_move_demon_manipulate_inertia_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_inertia')]"
 POD_combat_move_demon_manipulate_inertia_tooltip: "#weak;italic The very fabric of the world was yours to command once. What can a petty law of physics do to stand in your way?#!" 
 POD_combat_move_demon_manipulate_cohesion: "@demon_icon!Manipulate Cohesion"
 POD_combat_move_demon_manipulate_cohesion_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_cohesion')]"
 POD_combat_move_demon_manipulate_cohesion_tooltip: "#weak;italic You made Creation once. You can unmake it.#!" 

 ######### Lore of Corruption
 POD_combat_move_demon_reality_tremors: "@demon_icon!Reality Tremors"
 POD_combat_move_demon_reality_tremors_desc: "[PODCombatMoveDesc('POD_combat_move_demon_reality_tremors')]"
 POD_combat_move_demon_reality_tremors_tooltip: "#weak;italic Logic and reason have no place in a battlefield you walk. They are mere constructs of feeble minds trying to understand Creation.#!" 
 POD_combat_move_demon_wave_of_mutilation: "@demon_icon!Wave of Mutilation"
 POD_combat_move_demon_wave_of_mutilation_desc: "[PODCombatMoveDesc('POD_combat_move_demon_wave_of_mutilation')]"
 POD_combat_move_demon_wave_of_mutilation_tooltip: "#weak;italic They think they know pain and torment. They are wrong.#!" 

 ######### Lore of the Herald
 POD_combat_move_demon_command_the_flame: "@demon_icon!Command the Flame"
 POD_combat_move_demon_command_the_flame_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_flame')]"
 POD_combat_move_demon_command_the_flame_tooltip: "#weak;italic Fire was the tool used for Creation itself. It is as natural to you as breathing is to those weak mortals.#!" 
 POD_combat_move_demon_hand_of_faith: "@demon_icon!Hand of Faith"
 POD_combat_move_demon_hand_of_faith_desc: "[PODCombatMoveDesc('POD_combat_move_demon_hand_of_faith')]"
 POD_combat_move_demon_hand_of_faith_tooltip: "#weak;italic You refuse to be hit by such an inferior being. And thus you aren't.#!" 

 ######### Lore of the Life-Bringer
 POD_combat_move_demon_cleanse: "@demon_icon!Cleanse"
 POD_combat_move_demon_cleanse_desc: "[PODCombatMoveDesc('POD_combat_move_demon_cleanse')]"
 POD_combat_move_demon_cleanse_tooltip: "#weak;italic Their weak bodies are but clay to you. Your mercy is their salvation.#!" 
 POD_combat_move_demon_wall_of_air: "@demon_icon!Wall of Air"
 POD_combat_move_demon_wall_of_air_desc: "[PODCombatMoveDesc('POD_combat_move_demon_wall_of_air')]"
 POD_combat_move_demon_wall_of_air_tooltip: "#weak;italic Carried through wings of light, far from harm.#!" 

 ######### Lore of Creation
 POD_combat_move_demon_earth_meld: "@demon_icon!Earth Meld"
 POD_combat_move_demon_earth_meld_desc: "[PODCombatMoveDesc('POD_combat_move_demon_earth_meld')]"
 POD_combat_move_demon_earth_meld_tooltip: "#weak;italic The very earth is yours to command. It remembers its creator after all.#!" 
 POD_combat_move_demon_alter_path: "@demon_icon!Alter Path"
 POD_combat_move_demon_alter_path_desc: "[PODCombatMoveDesc('POD_combat_move_demon_alter_path')]"
 POD_combat_move_demon_alter_path_tooltip: "#weak;italic The labyrinth of reality is too complicated for their narrow minds to handle.#!" 

 ######### Lore of the Seer
 POD_combat_move_demon_foresee: "@demon_icon!Foresee"
