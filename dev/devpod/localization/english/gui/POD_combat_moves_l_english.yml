 POD_combat_move_demon_command_the_storm_tooltip: "#weak;italic Mortals were right to fear the skies. Divine wrath always came from above.#!" 

 ######### Lore of the Living
 POD_combat_move_demon_manipulate_flesh: "@demon_icon!Manipulate Flesh"
 POD_combat_move_demon_manipulate_flesh_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_flesh')]"
 POD_combat_move_demon_manipulate_flesh_tooltip: "#weak;italic So weak, so fragile and yet, you still need it.#!" 
 POD_combat_move_demon_command_the_wild: "@demon_icon!Command the Wild"
 POD_combat_move_demon_command_the_wild_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_wild')]"
 POD_combat_move_demon_command_the_wild_tooltip: "#weak;italic The Garden of Eden wasn't without its thorns.#!" 

 ######### Lore of the Ethereal
