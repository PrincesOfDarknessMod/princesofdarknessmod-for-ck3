 POD_combat_move_demon_foresee_tooltip: "#weak;italic You have seen it all. Even God's pettiness can't hide the future from you.#!" 
 POD_combat_move_demon_illusion: "@demon_icon!Illusion"
 POD_combat_move_demon_illusion_desc: "[PODCombatMoveDesc('POD_combat_move_demon_illusion')]"
 POD_combat_move_demon_illusion_tooltip: "#weak;italic Is it truly an illusion or are their minds too small to understand?#!" 

 ######### Lore of Beauty
 POD_combat_move_demon_inspire: "@demon_icon!Inspire"
