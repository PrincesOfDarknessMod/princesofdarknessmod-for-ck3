 POD_combat_move_demon_shield_of_spite_tooltip: "#weak;italic Striking you is an affront to divinity itself. They will learn. Painfully.#!" 
 POD_combat_move_demon_spirit_strike: "@demon_icon!Spirit Strike"
 POD_combat_move_demon_spirit_strike_desc: "[PODCombatMoveDesc('POD_combat_move_demon_spirit_strike')]"
 POD_combat_move_demon_spirit_strike_tooltip: "#weak;italic No creatures, no dimensions are far enough removed from God's creation for you to handle.#!" 
 POD_combat_move_demon_healing_touch: "@demon_icon!Healing Touch"
 POD_combat_move_demon_healing_touch_desc: "[PODCombatMoveDesc('POD_combat_move_demon_healing_touch')]"
 POD_combat_move_demon_healing_touch_tooltip: "#weak;italic You were primodial destruction but you also were primordial creation. Life itself answers your call.#!" 
