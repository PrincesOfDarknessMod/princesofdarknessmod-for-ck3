l_english:

 ##############################################################################
 ###### POD COMBAT — PER-MOVE LOCALIZATION
 ##############################################################################
 # Three keys per move:
 #   (name)    — bare display name. AP cost is appended at render
 #               time by the static POD_combat_move_title loc key,
 #               so designer rebalances of AP cost stay in sync
 #               with the displayed text.
 #   _desc     — PODCombatMoveDesc call. Decision auto-loc resolves
 #               <id>_desc, so DecisionType.GetShortDescForPlayer
 #               lands here and renders the full stat card.
 #   _tooltip  — short flavor sentence. Doubles as a stub for the
 #               engine's auto <id>_tooltip lookup on decision load.     
 ##############################################################################

 ######### Base Physical
 POD_combat_move_strike: "@skill_prowess_icon!Strike"
 POD_combat_move_strike_desc: "[PODCombatMoveDesc('POD_combat_move_strike')]"
 POD_combat_move_strike_tooltip: "#weak;italic Standard melee attack#!"
