 # Umbra panel
 skinlands_title:0 "Skinlands"
 skinlands_desc:0 "Wraiths refer to the world of the living as the Skinlands; this contrasts with the Shadowlands, the lands of the dead and the wraiths' home.\nThis is basically your starting point, from here you have a variety of options below depending on your powers from where to go from here.\nTake notice that traveling from one plane to another will take time.\nBe careful, you might get some boons during your travels, but you might also get lost."
