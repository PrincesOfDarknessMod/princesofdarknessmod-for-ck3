 paying_for_spirit_travel_toast:0 "You paid gold to purchase a true jade"
 paying_for_spirit_travel_notification_yin:0 "Without [GetPerk('semblance_of_the_ebon_dragon_perk').GetName( GetPlayer )] [perk|E], you must use a true jade to perform a ritual to enter the Yin World"
