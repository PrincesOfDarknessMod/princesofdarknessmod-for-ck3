 game_concept_middlemarch:0 "Middlemarch"
 game_concept_middlemarch_desc:0 "The Middlemarch is a Realm of the [near_dreaming|E].\n\nFoothills of the great Splintered Mountains, the arid stonelands of the Middlemarch constitute some of the harshest realms in the [near_dreaming|E]."
