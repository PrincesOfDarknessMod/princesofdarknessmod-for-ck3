 game_concept_splintered_mountains:0 "Splintered Mountains"
 game_concept_splintered_mountains_desc:0 "The Splintered Mountains are one of the relatively [stable_points|E] of the [far_dreaming|E].\n\nThe Splintered Mountains range across a thousand leagues and cut a bold path through the Dark Lands of the [far_dreaming|E]. Here, the giants of legend and the monsters of yore make their homes and seek as sustenance any foolish enough to enter their domain. Harpies ride the frigid winds of the stone canyons, eager for changelings to torture, and basilisks lurk in the shadows of the broken towers. A great many Kithain have met their deaths in the Splintered Mountains, where once Tuatha de Danaan rules in the time before the Shattering. There are treasures hidden away in the caves of the mountains, and some believe the way to Arcadia can only be found by seeking those treasures that the Tuatha de Danaan abandoned when they left their now-ruined palaces. This may be a lie or may be the truth, but all of the sidhe remember passing through the range of treacherous, thrusting stone towers on their way back to the Waking World."
