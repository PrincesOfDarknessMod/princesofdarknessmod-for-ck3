 game_concept_wastelands:0 "Wastelands"
 game_concept_wastelands_desc:0 "The Wastelands are a [nightmare_realm|E] in the [deep_dreaming|E] and home of the Pool of Counted Sorrows.\n\nThe Wastelands is a dark, miserable place where nightmares hold eternal sway. In this endless Nightmare Realm, the more twisted passions and fears of mortals fester and grow. Forests of toadstools and valleys filled with moist, poisonous lichen cover lands which once held palaces to rival Arcadia. In this place, the darkness is complete and the Thallain hold undeniable reign over the land. No sane changeling wold dare visit this place, save for one simple fact: the Pool of Counted Sorrows rests in the center of the Wastelands. The Pool is said to reveal all of the past to anyone who can stand to gaze into its depths. Many changelings in the Deep Realms claim to have visions of the Pool. It may only be a lie created by the rulers of the Nightmare Realms, or it may be something more. Some claim it is a possible way toward for all Kithain."
