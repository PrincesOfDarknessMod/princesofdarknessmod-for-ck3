 game_concept_distant_cities:0 "Distant Cities"
 game_concept_distant_cities_desc:0 "Distant Cities are a phenomenon of the [near_dreaming|E].\n\nOne common phenomenon in the [near_dreaming|E] is called Distant Cities. These strange places are inevitably beautiful and almost always unreachable. They are places seen on the horizon, places of wonder and glory that shine bright as the sun on the first true day of spring. Sometimes, they appear to be only a few miles away, and other times they seem a hundred leagues away. But always, they are mesmerizing, filled with crystalline towers and bridges of gold, colorful banners and music that haunts the region of whispers. Even miles away, people see the inhabitants of the Distant Cities and long to meet them, for surely anyone that beautiful must know the way to Arcadia."
