 # Umbra Place
 game_concept_glen:0 "Glen"
 game_concept_glen_desc:0 "A Glen is an area of the [penumbra|E] saturated with the energies of the Wyld. Glens are usually tied to areas of unspoiled wilderness in the material world (making them increasingly rare and inaccessible)."
 
 game_concept_veinous_stair:0 "Veinous Stair"
 game_concept_veinous_stair_desc:0 "The Veinous Stair is a passage from Stygia directly into the [labyrinth|E]. The most stable place in the [shadowlands|E], the Stair is composed of black stone of an unknown type."
 
 # Umbra Location
 game_concept_earth:0 "Earth"
 game_concept_earth_desc:0 "The material world. Among the worlds of “solid” reality within the Tellurian, Earth is often referred to as “the Realm” implying its primacy. The planet's celestine is, of course, Gaia, and Earth's shadow is called [penumbra|E].\n\n$POD_splat_werewolf_plural$ and other shapechangers refer as the "[gaia_realm|E]", in honor of Gaia, the spirit of the Earth.\n\n$POD_splat_wraith_plural$ call this realm [skinlands|E], in contrast with the [shadowlands|E] (the Dark Penumbra) that connects to the [underworld|E] (the Dark Umbra).\n\nIn the Common Parlance of the #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L Kithain#!#!, the Waking World is Earth... the part of Earth that is not in the Umbras or the [dreaming|E]. Also called the Autumn World, the Land of Unfulfilled Dreams, and the World of Flesh."
 earth_confirm:0 "Return to the Material World"
 earth_0_tt:0 "This is basically your starting point, from here you have a variety of options below depending on your powers from where to go from here.\nBe careful, you might get some boons during your travels, but you might also get lost.\nUnbound [GetTrait('wraith').GetName( GetPlayer )] that are not [GetTrait('risen').GetName( GetPlayer )] gains medium [stress|E] every years to maintain in [earth|E]."
