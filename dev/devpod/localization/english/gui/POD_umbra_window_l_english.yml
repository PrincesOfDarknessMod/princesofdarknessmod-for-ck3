 SPIRIT_TRAVELING_TOOLTIP:0 "Traveling..."
 spirit_travel_arrived_title:0 "Destination Reached"
 spirit_travel_arrived_desc:0 "You have reached the selected location in the umbra."
 
 shadow_realm_to_skinlands_option_tooltip:0 "This option is available because I have the [GetPerk('empower_ba_perk').GetName( GetPlayer )] [perk|E]."
 shadowlands_fetter_maintenance_tooltip:0 "You pay the cost of staying in the shadowlands without [Fetters|E]."
 
 skinlands_title:0 "$spirit_travel_header$ Skinlands"
 skinlands_desc:0 "Wraiths refer to the world of the living as the Skinlands; this contrasts with the Shadowlands, the lands of the dead and the wraiths' home.\nThis is basically your starting point, from here you have a variety of options below depending on your powers from where to go from here.\nTake notice that traveling from one plane to another will take time.\nBe careful, you might get some boons during your travels, but you might also get lost.\n\n #R Be warned, you will lose access to most of the common character interactions and decisions while traveling! #!"
 skinlands_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unbound [GetTrait('wraith').GetName( GetPlayer )] that are not [GetTrait('risen').GetName( GetPlayer )] gains medium [stress|E] every years to maintain in Skinlands.\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to manipulate the gauntlet."
 skinlands_option:0 "Return to the Material World"
 
 periphery_title:0 "$spirit_travel_header$ Periphery"
 periphery_desc:0 "The Periphery, sometimes also called the "Soft Umbra", is a place - or a state of mind, as many Fera would point out - between the [penumbra|E] and the Material World."
 periphery_effect_desc:0 ""
 periphery_option:0 "If I change my mind..."
 
 glen_title:0 "$spirit_travel_header$ Glen"
 glen_desc:0 "A Glen is an area of the [penumbra|E] saturated with the energies of the Wyld. Glens are usually tied to areas of unspoiled wilderness in the material world (making them increasingly rare and inaccessible)."
 glen_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$[GetTrait('werewolf').GetName( GetPlayer )] character loses a little [stress|E] every #V 3#! month while staying in a Glen."
 glen_option:0 "Rest in a Glen"
 
 near_dreaming_title:0 "$spirit_travel_header$ Near Dreaming"
 near_dreaming_desc:0 "The Near Dreaming is the part of the [dreaming|E] closest to the Mundane World."
 near_dreaming_effect_desc:0 ""
 near_dreaming_option:0 "Wander the Near Dreaming"
 
 far_dreaming_title:0 "$spirit_travel_header$ Far Dreaming"
 far_dreaming_desc:0 "The Far Dreaming is the part of the [dreaming|E] corresponding to the collective dreams of humanity."
 far_dreaming_effect_desc:0 ""
 far_dreaming_option:0 "Wander the Far Dreaming"
 
 deep_dreaming_title:0 "$spirit_travel_header$ Deep Dreaming"
 deep_dreaming_desc:0 "The Deep Dreaming is the part of the [dreaming|E] furthest from the Waking World."
 deep_dreaming_effect_desc:0 ""
 deep_dreaming_option:0 "Wander the Deep Dreaming"
 
 astral_plane_title:0 "$spirit_travel_header$ Astral plane"
 astral_plane_desc:0 "The astral plane is actually the lowest level of the Vulgate, one of the known [penumbra|E] linked to the [astral_reaches|E]."
 astral_plane_effect_desc:0 ""
 astral_plane_option:0 "Ascend to Astral plane"

 vulgate_title:0 "$spirit_travel_header$ Vulgate"
 vulgate_desc:0 "A Vulgate- also known as Mundus Imaginalis- is the lowest part of the [astral_reaches|E]. It incorporates the most common concepts that the collective philosophy and mindsets of humanity (and, possibly, some other species) have thought of."
 vulgate_effect_desc:0 ""
 vulgate_option:0 "Ascend to the Vulgate"

 spiers_title:0 "$spirit_travel_header$ Spires"
 spiers_desc:0 "Cosmologists believe that the Spires are the result of many minds concentrating on the same idea, causing it to be elevated from the Vulgate into a higher realm."
 spiers_effect_desc:0 ""
 spiers_option:0 "Ascend to the Spires"

 inventium_title:0 "$spirit_travel_header$ Inventium"
 inventium_desc:0 "The Inventium is a Realm of the [astral_reaches|E] full of every invention humankind has ever dreamed of. These inventions manifest with an audible popping sound and drop gently into massive piles that fill the Realm in all directions."
 inventium_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Chance of gaining a mysterious device or a random innovation depending on your [stewardship_skill|E]."
 inventium_option:0 "Ascend to the Inventium"

 epiphamy_title:0 "$spirit_travel_header$ Epiphamy"
 epiphamy_desc:0 "Epiphamies - or Mundus Intelligibilis, as the Order of Hermes and the Celestial Chorus classifies them, or Pandimensional Metaverse, as the scientifically minded mages calls them - are among the most difficult areas to attain within the [astral_reaches|E]."
 epiphamy_effect_desc:0 ""
 epiphamy_option:0 "Ascend to the Epiphamy"

 courts_title:0 "$spirit_travel_header$ Courts"
 courts_desc:0 "Along the Spires, the traveler can reach the Courts, which represent astral embodiment of similar ideas, like the Court of Muses or the Elemental Court."
 courts_effect_desc:0 ""
 courts_option:0 "Ascend to the Courts"
 
 shadowlands_title:0 "$spirit_travel_header$ Shadowlands"
 shadowlands_desc:0 "The Shadowlands are a mirror 'skin' of reality, with every location in the breathing realm having a corresponding location in the Shadowlands which, for the most part, obey conventional rules of distance."
 shadowlands_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$[GetTrait('wraith').GetName( GetPlayer )] without [Fetters|E] gains medium [stress|E] every years to maintain in Shadowlands. (10% of chance per every unassigned or lost [Fetter|E])\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to manipulate the gauntlet."
 shadowlands_option:0 "Fall into the Shadowlands"
 
 river_of_death_title:0 "$spirit_travel_header$ River of Death"
 river_of_death_desc:0 "The River of Death is a waterway in the Tempest that serves as the primary Byway from Stygia to the Shadowlands and other Dark Kingdoms."
 river_of_death_effect_desc:0 ""
 river_of_death_option:0 "Dive into the River of Death"
 
 sunless_sea_title:0 "$spirit_travel_header$ Sunless Sea"
 sunless_sea_desc:0 "Named because the sky above it is always dark, light in the Sunless Sea from sources such as ships and beacons can be seen for miles because it scatters off the surface of the water."
 sunless_sea_effect_desc:0 ""
 sunless_sea_option:0 "Dive into the Sunless Sea"
 
 far_shore_title:0 "$spirit_travel_header$ Far Shore"
 far_shore_desc:0 "The Far Shores are a mysterious territory in the Underworld controlled by pythian entities called Shining Ones. To modern Stygians, the Far Shores are territories controlled by Heretics, and not to be trusted."
 far_shore_effect_desc:0 ""
 far_shore_option:0 "Travel to the Far Shore"
 
 weeping_bay_title:0 "$spirit_travel_header$ Weeping Bay"
 weeping_bay_desc:0 "The Weeping Bay lies halfway between the Sea of Souls and the Sunless Sea and serves as Stygia's main port and connection to various other Necropoli. The bay has a characteristic shape in the form of a half-moon and is constantly filled with the sobs and moans of the various soulforged wraiths that make up the bay."
 weeping_bay_effect_desc:0 ""
 weeping_bay_option:0 "Travel to the Weeping Bay"
 
 sea_of_souls_title:0 "$spirit_travel_header$ Sea of Souls"
 sea_of_souls_desc:0 "The protective sea-wall built around Stygia and the Isle of Sorrows. Its name comes from the unfortunate wraiths who have been forged or chained into the wall's structure."
 sea_of_souls_effect_desc:0 ""
 sea_of_souls_option:0 "Dive into the Sea of Souls"
 
 isle_of_sorrows_title:0 "$spirit_travel_header$ Isle of Sorrows"
 isle_of_sorrows_desc:0 "The Isle of Sorrows is a rocky island located at the delta of the River of Death, deep in the Tempest."
 isle_of_sorrows_effect_desc:0 ""
 isle_of_sorrows_option:0 "Travel to the Isle of Sorrows"
 
 veinous_stair_title:0 "$spirit_travel_header$ Veinous Stair"
 veinous_stair_desc:0 "The Veinous Stair is a passage from Stygia directly into the Labyrinth. The most stable place in the Shadowlands, the Stair is composed of black stone of an unknown type."
 veinous_stair_effect_desc:0 ""
 veinous_stair_option:0 "Sneak into the Veinous Stair"
 
 dark_kingdom_of_iron_title:0 "$spirit_travel_header$ Dark Kingdom of Iron"
 dark_kingdom_of_iron_desc:0 "Stygia is the capital of the western dead, an incomprehensibly huge city located on the Isle of Sorrows deep in the Tempest. It is the location of the major headquarters of the various organizations of western wraiths."
 dark_kingdom_of_iron_effect_desc:0 ""
 dark_kingdom_of_iron_option:0 "Travel to Stygia"
 
 dark_kingdom_of_clay_title:0 "$spirit_travel_header$ Dark Kingdom of Clay"
 dark_kingdom_of_clay_desc:0 "Karta, known to outsiders as the [dark_kingdom|E] of Clay, is the realm in the Tempest that belongs to the aboriginal people of Australia."
 dark_kingdom_of_clay_effect_desc:0 ""
 dark_kingdom_of_clay_option:0 "Travel to Karta"
 
 dark_kingdom_of_ivory_title:0 "$spirit_travel_header$ Dark Kingdom of Ivory"
 dark_kingdom_of_ivory_desc:0 "The Bush of Ghosts, which also goes by the [dark_kingdom|E] of Ivory, is the Shadowlands for the abambo, or the wraiths of Africa."
 dark_kingdom_of_ivory_effect_desc:0 ""
 dark_kingdom_of_ivory_option:0 "Travel to the Bush of Ghosts"
 
 dark_kingdom_of_jade_title:0 "$spirit_travel_header$ Dark Kingdom of Jade"
 dark_kingdom_of_jade_desc:0 "The Yellow Springs, also called the [dark_kingdom|E] of Jade, is a part of the Underworld dedicated to and controlled by the dead of Asia."
 dark_kingdom_of_jade_effect_desc:0 ""
 dark_kingdom_of_jade_option:0 "Travel to the Yellow Springs"
 
 dark_kingdom_of_obsidian_title:0 "$spirit_travel_header$ Dark Kingdom of Obsidian"
 dark_kingdom_of_obsidian_desc:0 "The Flayed Lands is the name for the kingdom of the dead that held dominion over Central America, part of the mighty [dark_kingdom|E] of Obsidian."
 dark_kingdom_of_obsidian_effect_desc:0 ""
 dark_kingdom_of_obsidian_option:0 "Travel to the Flayed Lands"
 
 dark_kingdom_of_sand_title:0 "$spirit_travel_header$ Dark Kingdom of Sand"
 dark_kingdom_of_sand_desc:0 "Amenti, the [dark_kingdom|E] of Sand, is the Dark Kingdom of the Undying in the Underworld. It's not populated by wraiths, but by Immortals, who died and found themselves back in the Shadowlands."
 dark_kingdom_of_sand_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Amenti [GetTrait('mummy').GetName( GetPlayer )] gains all Sekhem every #V 3#! month while staying in this [dark_kingdom|E]."
 dark_kingdom_of_sand_option:0 "Travel to Amenti"
 
 swar_title:0 "$spirit_travel_header$ Swar"
 swar_desc:0 "Swar (or Svarga), the City of Delights, is the city of the dead of India, Swar serves as the head city of Bhuvar, the Indian Shadowlands."
 swar_effect_desc:0 ""
 swar_option:0 "Travel to Swar"
 
 night_markets_title:0 "$spirit_travel_header$ Night Markets"
 night_markets_desc:0 "The Night Markets, nominally a part of Swar, where the Southeast Asian Dead dwell."
 night_markets_effect_desc:0 ""
 night_markets_option:0 "Travel to Night Markets"
 
 mantaqat_khayal_title:0 "$spirit_travel_header$ Mantaqat Khayal"
 mantaqat_khayal_desc:0 "Mantaqat Khayal, the Shadowlands of the Middle East. Little is known of this land, except that the Keening had engulfed it in a perpetual sandstorm since at least the dawn of Islam. Only Necropoli provide shelter from this sandstorm, and it is traversed only by merchants, pilgrims, and nomads."
 mantaqat_khayal_effect_desc:0 ""
 mantaqat_khayal_option:0 "Travel to Mantaqat Khayal"

 shadow_realm_title:0 "$spirit_travel_header$ Shadow Realm"
 shadow_realm_desc:0 "Shadow Realms are places in the Underworld that Mummies visit in order to regenerate themselves until they are ready to inhabit their bodies again and that grant them protection against the predations of Spectres or Maelstroms."
 shadow_realm_effect_desc:0 ""

 hades_title:0 "$spirit_travel_header$ Hades"
 hades_desc:0 "The central [shadow_realm|E] of the Cabiri Mummies is called Hades, after the mythical Greek underworld."
 hades_effect_desc:0 ""

 gates_of_heaven_title:0 "$spirit_travel_header$ Gates of Heaven"
 gates_of_heaven_desc:0 "Responsibility weighs heavily on all of the Reborn. The Eight Immortals give the Wu T’ian missions. They receive instruction, and they must carry out the will of heaven. When they fail, they spend time in contemplation at the Gates of Heaven, preparing themselves so that they will not fail again."
 gates_of_heaven_effect_desc:0 ""

 yomi_wan_title:0 "$spirit_travel_header$ Yomi Wan"
 yomi_wan_desc:0 "Yomi Wan, literally meaning Thousand Hells, is an artificial spiritual dimension created by the Yama Kings from a combination of the spirit worlds of the Yang World and the Yin World, to serve as their headquarters. The Yomi Wan are often called the Yomi Worlds, and are often referred to in the collective form as Yomi."
 yomi_wan_effect_desc:0 ""
 
 tempest_title:0 "$spirit_travel_header$ [GetPlayer.Custom( 'tempest_custom_name' )]"
 tempest_desc:0 "[GetPlayer.Custom( 'tempest_custom_desc' )]"
 tempest_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$#N 50%#! of chance being lost in the [GetPlayer.Custom( 'tempest_custom_name' )].\n$BULLET_WITH_TAB$Allow collect artifact pieces from Maelstrom."
 tempest_option:0 "#X Fall into the [GetPlayer.Custom( 'tempest_custom_name' )]#!"
 custom_name_seaofshadow:0 "Sea of Shadows"
 custom_name_tempest:0 "Tempest"
 custom_name_stormwall:0 "Stormwall"
 custom_desc_seaofshadow:0 "Sea of Shadows is a term used by Wraiths to describe the "bottom" layer of the Tempest which flows around and into the Labyrinth and Oblivion."
 custom_desc_tempest:0 "The Tempest is a perpetually swirling maelstrom of energy, memories and [GetTrait('spectre').GetName( GetPlayer )]s issuing from the Labyrinth and continuously raining plasma and materials on both the Shadowlands and Dark Kingdoms."
 custom_desc_stormwall:0 "The Stormwall is a metaphysical barrier between the worlds of the living and the dead."
 
 labyrinth_title:0 "$spirit_travel_header$ Labyrinth"
 labyrinth_desc:0 "The Labyrinth has relatively little structure, and no map could make sense of it; what landmarks do exist are prone to movement."
 labyrinth_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$#N 90%#! chance of returning here when trying to escape.\n$BULLET_WITH_TAB$Gains a little [stress|E] every #V 3#! month.\n$BULLET_WITH_TAB$Ignore above effect if you are serving Apophis (Wyrm)."
 labyrinth_option:0 "#X Fall into the Labyrinth#!"
 
 well_of_the_void_title:0 "$spirit_travel_header$ Well of the Void"
 well_of_the_void_desc:0 "The Well of the Void is the physical manifestation of Oblivion, located at the center and bottom of the Labyrinth."
 well_of_the_void_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$#N 90%#! chance of returning here when trying to escape.\n$BULLET_WITH_TAB$#N 9%#! risk of being erased from existence when trying to escape.\n$BULLET_WITH_TAB$Gains certain [stress|E] every #V 3#! month.\n$BULLET_WITH_TAB$Ignore above effects if you accept the corruption of Apophis (Wyrm) or already have done so."
 well_of_the_void_option:0 "#X Fall into the Well#!"
 
 oblivion_title:0 "#X $spirit_travel_header$ Oblivion#!"
 oblivion_desc:0 "#X Oblivion is entropy itself, a constantly churning force of destruction and madness from which there is no return.#!"
 oblivion_effect_desc:0 "#X Effect:\n$BULLET_WITH_TAB$Any being who enter here will have their existence erased.#!"
 oblivion_option:0 "#X End in Oblivion#!"
 
 abyss_title:0 "$spirit_travel_header$ Abyss"
 abyss_desc:0 "The Abyss, also known as Hell or the Pit, is the murky dimension of darkness created by God as an eternal prison for the Fallen."
 abyss_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Gains a lot of [stress|E] every #V 3#! month."
 abyss_option:0 "#X Fall into the Abyss#!"

 spirit_wilds_title:0 "$spirit_travel_header$ Spirit Wilds"
 spirit_wilds_desc:0 "The Spirit Wilds are another name for the Middle Umbra, particularly the space between the Near Realms. This part of the Umbra reflects the natural environment, both in its pristine state and the toxic."
 spirit_wilds_effect_desc:0 ""
 spirit_wilds_option:0 "Step into the Spirit Wilds"

 atrocity_realm_title:0 "$spirit_travel_header$ Atrocity Realm"
 atrocity_realm_desc:0 "The Atrocity Realm, known to mages as the Wasteland, is one of the Near Realms. Banes breed here."
 atrocity_realm_effect_desc:0 ""
 atrocity_realm_option:0 "Step into the Atrocity"

 battleground_title:0 "$spirit_travel_header$ Battleground"
 battleground_desc:0 "The Battleground, known in the East as the Realm of Fighting Spirits, is a Near Realm within the Umbra containing every battle that has ever been fought, from the earliest conflicts between neolithic tribes against bears and wolves, the Impergium and the Wars of Rage up to the current conflicts within the Middle East and gang wars."
 battleground_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Chance of gaining a new Commander trait depending on your [martial_skill|E]."
 battleground_option:0 "Step into the Battleground"

 cyberrealm_title:0 "$spirit_travel_header$ CyberRealm"
 cyberrealm_desc:0 "The CyberRealm is one of the thirteen Near Realms in the Umbra. This realm represents perhaps the pinnacle of the Weaver's influence in the Umbra. It is called Dystopia by mages."
 cyberrealm_effect_desc:0 ""
 cyberrealm_option:0 "Step into the CyberRealm"

 erebus_title:0 "$spirit_travel_header$ Erebus"
 erebus_desc:0 "Often compared to Garou 'hell', Erebus is actually a place of spiritual cleansing."
 erebus_effect_desc:0 ""
 erebus_option:0 "Step into the Erebus"

 flux_realm_title:0 "$spirit_travel_header$ Flux Realm"
 flux_realm_desc:0 "The Flux, Flux Realm, or Radiance is a Realm within the Near Umbra. It is a powerful reservoir of pure, undiluted Wyld energy, untainted by the chartering of the Weaver."
 flux_realm_effect_desc:0 ""
 flux_realm_option:0 "Step into the Flux"

 hy_brasil_title:0 "$spirit_travel_header$ Hy-Brasil"
 hy_brasil_desc:0 "A domain of the faeries sundered forever from lost Arcadia. "
 hy_brasil_effect_desc:0 ""
 hy_brasil_option:0 "Step into the Hy-Brasil"

 legendary_realm_title:0 "$spirit_travel_header$ Legendary Realm"
 legendary_realm_desc:0 "The Legendary Realm is one of the Near Realms located in the Near Umbra. Garou traveling through this realm can experience the lives of their legendary ancestors. "
 legendary_realm_effect_desc:0 ""
 legendary_realm_option:0 "Step into the Legendary Realm"

 mountains_of_heaven_title:0 "$spirit_travel_header$ Mountains of Heaven"
 mountains_of_heaven_desc:0 "The Mountains of Heaven are an Umbral Realm within the Yang World. The Realm manifests as a great chain of mountains, dwarfing even the mighty Himalayas, crests above a sea of clouds. "
 mountains_of_heaven_effect_desc:0 ""
 mountains_of_heaven_option:0 "Climb the Mountains of Heaven"

 pangaea_title:0 "$spirit_travel_header$ Pangaea"
 pangaea_desc:0 "Pangaea is a reflection of primal Earth, showing the world as it was before civilization, human history, and even the Impergium."
 pangaea_effect_desc:0 ""
 pangaea_option:0 "Step into the Pangaea"

 scar_title:0 "$spirit_travel_header$ Scar"
 scar_desc:0 "Scar is one of the Near Realms of the Umbra. It is a manifestation of the industrial revolution corrupted into a soul grinding oppression under a rusted prosperity ideal."
 scar_effect_desc:0 ""
 scar_option:0 "Step into the Scar"

 summer_country_title:0 "$spirit_travel_header$ Summer Country"
 summer_country_desc:0 "The Summer Country is one of the Near Realms located in Earth's Near Umbra. It is now little more than a myth, as it’s been fading away for decades. Legends say the realm is a reflection of Gaia’s pure and boundless love for Her children. "
 summer_country_effect_desc:0 ""
 summer_country_option:0 "Step into the Summer Country"

 tiger_lands_title:0 "$spirit_travel_header$ Tiger Lands"
 tiger_lands_desc:0 "The Tiger Lands are a Yang Realm within the Eastern Umbra that acts as a refugee for the spirits of threatened animals and spirits who have lost their homes following human clearcuttings."
 tiger_lands_effect_desc:0 ""
 tiger_lands_option:0 "Step into the Tiger Lands"

 umi_title:0 "$spirit_travel_header$ Umi"
 umi_desc:0 "One of the mightiest Umbral realms of the Middle Kingdom, the domain of Umi claims the entire Pacific as its purview, though certain Polynesian and Indonesian spirit realms beg to differ. "
 umi_effect_desc:0 ""
 umi_option:0 "Dive into the Umi"

 wolfhome_title:0 "$spirit_travel_header$ Wolfhome"
 wolfhome_desc:0 "Wolfhome is one of the Near Realms, located in Earth's Near Umbra. It is frequented by Garou. This realm is a vast expanse of pristine wilderness. Answers to primal mysteries are hidden here."
 wolfhome_effect_desc:0 ""
 wolfhome_option:0 "Step into the Wolfhome"
 
 aetherial_realm_title:0 "$spirit_travel_header$ Aetherial Realm"
 aetherial_realm_desc:0 "The Aetherial Realm, also known as Aetheria, is the farthest expanse of the Near Realm within the Umbra that spans over the Spirit Wilds up to the Membrane. It is reflected in the physical world as the skies above that constantly cycle through night and day."
 aetherial_realm_effect_desc:0 ""
 aetherial_realm_option:0 "Fly into the Aetheria"

 court_of_eshtarra_title:0 "$spirit_travel_header$ Court of Eshtarra"
 court_of_eshtarra_desc:0 "Eshtarra, the Songteller, is the Planetary Incarna of Earth according to Garou Astrology."
 court_of_eshtarra_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_eshtarra_option:0 "Visit the Incarna of Earth"

 court_of_sokhta_title:0 "$spirit_travel_header$ Court of Sokhta"
 court_of_sokhta_desc:0 "Sokhta is an aspect of Luna, the Celestine who is the patron of the Garou and many other Changing Breeds, and her court is home to many Lunes and other spirits sympathetic to the Garou Nation."
 court_of_sokhta_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_sokhta_option:0 "Visit the Incarna of Luna"

 court_of_katanka_sonnak_title:0 "$spirit_travel_header$ Court of Katanka-Sonnak"
 court_of_katanka_sonnak_desc:0 "Katanka-Sonnak, the Wind Rider, is the Planetary Incarna of the Sun in Garou Astrology."
 court_of_katanka_sonnak_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_katanka_sonnak_option:0 "Visit the Incarna of Sun"

 court_of_mitanu_title:0 "$spirit_travel_header$ Court of Mitanu"
 court_of_mitanu_desc:0 "Mitanu, the Clever Rogue, is known in Garou astrology as the Planetary Incarna of Mercury. He is both a trickster and a lover of comedy."
 court_of_mitanu_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_mitanu_option:0 "Visit the Incarna of Mercury"

 court_of_hakahe_title:0 "$spirit_travel_header$ Court of Hakahe"
 court_of_hakahe_desc:0 "Hakahe is the Incarna of Vulcan, the planet closer to the sun than Mercury, and is credited with forging the souls of newborn Garou."
 court_of_hakahe_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_hakahe_option:0 "Visit the Incarna of Vulcan"

 court_of_tambiyah_title:0 "$spirit_travel_header$ Court of Tambiyah"
 court_of_tambiyah_desc:0 "Tambiyah, the Veiled Mother, is the Planetary Incarna of the Venus in Garou Astrology."
 court_of_tambiyah_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_tambiyah_option:0 "Visit the Incarna of Venus"

 court_of_nerigal_title:0 "$spirit_travel_header$ Court of Nerigal"
 court_of_nerigal_desc:0 "Nerigal, the Ice Warrior, is the Planetary Incarna of Mars according to Garou Astrology."
 court_of_nerigal_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_nerigal_option:0 "Visit the Incarna of Mars"

 court_of_rorg_title:0 "$spirit_travel_header$ Court of Rorg"
 court_of_rorg_desc:0 "Rorg, the Many-Taloned Hunter, is the Incarna of Turog, a destroyed planet that forms the Asteroid Belt, according to Garou astrology."
 court_of_rorg_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_rorg_option:0 "Visit the Incarna of Turog"

 court_of_zarok_title:0 "$spirit_travel_header$ Court of Zarok"
 court_of_zarok_desc:0 "Zarok, the Crowned Ruler, is the Planetary Incarna of the Jupiter in Garou Astrology."
 court_of_zarok_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_zarok_option:0 "Visit the Incarna of Jupiter"

 court_of_lu_bat_title:0 "$spirit_travel_header$ Court of Lu-Bat"
 court_of_lu_bat_desc:0 "Lu-Bat, the Peaceful Counselor, is the Planetary Incarna of the Saturn in Garou Astrology."
 court_of_lu_bat_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_lu_bat_option:0 "Visit the Incarna of Saturn"

 court_of_ruatma_title:0 "$spirit_travel_header$ Court of Ruatma"
 court_of_ruatma_desc:0 "Ruatma, the Shadowed One, is the Incarna of Uranus."
 court_of_ruatma_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_ruatma_option:0 "Visit the Incarna of Uranus"

 court_of_shantar_title:0 "$spirit_travel_header$ Court of Shantar"
 court_of_shantar_desc:0 "Shantar, the Loom Maker, is the Incarna of Neptune."
 court_of_shantar_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_shantar_option:0 "Visit the Incarna of Neptune"

 court_of_meros_title:0 "$spirit_travel_header$ Court of Meros"
 court_of_meros_desc:0 "Meros, the Wanderer, is the Incarna of Pluto."
 court_of_meros_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Unlock a button in the lower right of this window, allowing you to commune with the Incarna.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 court_of_meros_option:0 "Visit the Incarna of Pluto"

 weaver_reaches_title:0 "$spirit_travel_header$ Weaver Reaches"
 weaver_reaches_desc:0 "The Weaver Reaches are strands of calcified reality, similar to an astronomer’s computerized map. The web’s intersecting nodes lock cold stars and frozen planets to an unnatural symmetry. No signs of life exist. Colossal Weaver spirits such as ‘star spiders’ patrol and maintain the web and ensure everything remains in its ordained place."
 weaver_reaches_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Chance of gaining [GetTrait('drone').GetName( GetPlayer )] trait."
 weaver_reaches_option:0 "Enter the Weaver Reaches"

 wyld_reaches_title:0 "$spirit_travel_header$ Wyld Reaches"
 wyld_reaches_desc:0 "The Wyld Reaches are a place of chaos. Planets and comets dance around each other with colliding according to ever-shifting laws. Burning cold suns that freeze everything around them and others that push everything away with antigravity waves circle among them."
 wyld_reaches_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Chance of gaining [GetTrait('gorgon').GetName( GetPlayer )] trait."
 wyld_reaches_option:0 "Enter the Wyld Reaches"

 wyrm_reaches_title:0 "$spirit_travel_header$ Wyrm Reaches"
 wyrm_reaches_desc:0 "The stars within the Wyrm Reaches have burned-out to lifeless husks or collapsed into black holes that usually lead into Malfeas. Nebulas of pollution and balefire swirl around them, obscuring their constellations from anyone who looks at them, making them dark blotches within the Umbral sky."
 wyrm_reaches_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Chance of gaining [GetTrait('fomori').GetName( GetPlayer )] trait."
 wyrm_reaches_option:0 "Enter the Wyrm Reaches"

 shard_realm_of_prime_title:0 "$spirit_travel_header$ Shard Realm of Prime"
 shard_realm_of_prime_desc:0 "[shard_realm|E] connected to the Earth and Luna."
 shard_realm_of_prime_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Chance of gaining [GetTrait('kami').GetName( GetPlayer )] trait."
 shard_realm_of_prime_option:0 "Enter the Shard of Prime"

 shard_realm_of_infinity_title:0 "$spirit_travel_header$ Shard Realm of Infinity"
 shard_realm_of_infinity_desc:0 "[shard_realm|E] connected to Sol."
 shard_realm_of_infinity_effect_desc:0 ""
 shard_realm_of_infinity_option:0 "Enter the Shard of Infinity"

 shard_realm_of_correspondence_title:0 "$spirit_travel_header$ Shard Realm of Correspondence"
 shard_realm_of_correspondence_desc:0 "[shard_realm|E] connected to Mercury."
 shard_realm_of_correspondence_effect_desc:0 ""
 shard_realm_of_correspondence_option:0 "Enter the Shard of Correspondence"

 shard_realm_of_life_title:0 "$spirit_travel_header$ Shard Realm of Life"
 shard_realm_of_life_desc:0 "[shard_realm|E] connected to Venus."
 shard_realm_of_life_effect_desc:0 ""
 shard_realm_of_life_option:0 "Enter the Shard of Life"

 shard_realm_of_forces_title:0 "$spirit_travel_header$ Shard Realm of Forces"
 shard_realm_of_forces_desc:0 "[shard_realm|E] connected to Mars."
 shard_realm_of_forces_effect_desc:0 ""
 shard_realm_of_forces_option:0 "Enter the Shard of Forces"

 shard_realm_of_matter_title:0 "$spirit_travel_header$ Shard Realm of Matter"
 shard_realm_of_matter_desc:0 "[shard_realm|E] connected to Jupiter."
 shard_realm_of_matter_effect_desc:0 ""
 shard_realm_of_matter_option:0 "Enter the Shard of Matter"

 shard_realm_of_time_title:0 "$spirit_travel_header$ Shard Realm of Time"
 shard_realm_of_time_desc:0 "[shard_realm|E] connected to Saturn."
 shard_realm_of_time_effect_desc:0 ""
 shard_realm_of_time_option:0 "Enter the Shard of Time"

 shard_realm_of_spirit_title:0 "$spirit_travel_header$ Shard Realm of Spirit"
 shard_realm_of_spirit_desc:0 "[shard_realm|E] connected to Uranus."
 shard_realm_of_spirit_effect_desc:0 ""
 shard_realm_of_spirit_option:0 "Enter the Shard of Spirit"

 shard_realm_of_mind_title:0 "$spirit_travel_header$ Shard Realm of Mind"
 shard_realm_of_mind_desc:0 "[shard_realm|E] connected to Neptune."
 shard_realm_of_mind_effect_desc:0 ""
 shard_realm_of_mind_option:0 "Enter the Shard of Mind"

 shard_realm_of_entropy_title:0 "$spirit_travel_header$ Shard Realm of Entropy"
 shard_realm_of_entropy_desc:0 "[shard_realm|E] connected to Pluto."
 shard_realm_of_entropy_effect_desc:0 ""
 shard_realm_of_entropy_option:0 "Enter the Shard of Entropy"

 shade_realm_of_correspondence_title:0 "$spirit_travel_header$ Shade Realm of Correspondence"
 shade_realm_of_correspondence_desc:0 "[shade_realm|E] connected to Mercury. This Shade Realm cannot be directly reached from Earth, and those who do manage to get there find themselves moving though omnidimensional space according to unfathomable geometries."
 shade_realm_of_correspondence_effect_desc:0 ""
 shade_realm_of_correspondence_option:0 "Enter the Shade of Correspondence"

 shade_realm_of_life_title:0 "$spirit_travel_header$ Shade Realm of Life"
 shade_realm_of_life_desc:0 "[shade_realm|E] connected to Venus. This Realm is a lush, ever-changing jungle. Its relative accessibility from Earth has made it a frequent battleground in the Ascension War."
 shade_realm_of_life_effect_desc:0 ""
 shade_realm_of_life_option:0 "Enter the Shade of Life"

 shade_realm_of_forces_title:0 "$spirit_travel_header$ Shade Realm of Forces"
 shade_realm_of_forces_desc:0 "[shade_realm|E] connected to Mars. The Shade Realm of Forces is a never-ending tempest with only rare, isolated spots of relative calm. Doissetep occupied one of those calm spots, at least until its destruction. Like the Shade Realm of Life, its is a frequent (if dangerous) host to mage battles."
 shade_realm_of_forces_effect_desc:0 ""
 shade_realm_of_forces_option:0 "Enter the Shade of Forces"

 shade_realm_of_matter_title:0 "$spirit_travel_header$ Shade Realm of Matter"
 shade_realm_of_matter_desc:0 "[shade_realm|E] connected to Jupiter. This Realm may be connected to Hollow Earth, or may be similar but on a far vaster scale--an empire of dinosaurs, lost civilizations and other things that no longer exist."
 shade_realm_of_matter_effect_desc:0 ""
 shade_realm_of_matter_option:0 "Enter the Shade of Matter"

 shade_realm_of_time_title:0 "$spirit_travel_header$ Shade Realm of Time"
 shade_realm_of_time_desc:0 "[shade_realm|E] connected to Saturn. Any visitors to the Shade Realm of Time are taking a serious risk, as even the slightest movement results in temporal distortions and uncontrolled time travel."
 shade_realm_of_time_effect_desc:0 ""
 shade_realm_of_time_option:0 "Enter the Shade of Time"

 shade_realm_of_spirit_title:0 "$spirit_travel_header$ Shade Realm of Spirit"
 shade_realm_of_spirit_desc:0 "[shade_realm|E] connected to Uranus. There is no Gauntlet in the Shade Realm of Spirit: spirits and mortals can interact directly. It is also possible for a mage's Avatar to manifest corporeally here and converse with them."
 shade_realm_of_spirit_effect_desc:0 ""
 shade_realm_of_spirit_option:0 "Enter the Shade of Spirit"

 shade_realm_of_mind_title:0 "$spirit_travel_header$ Shade Realm of Mind"
 shade_realm_of_mind_desc:0 "[shade_realm|E] connected to Neptune. The nature of the Shade Realm of Mind is, as one might expect, defined by what one expects to find there. It reflects back the visitor's own thoughts and feelings, much like a mirror."
 shade_realm_of_mind_effect_desc:0 ""
 shade_realm_of_mind_option:0 "Enter the Shade of Mind"

 shade_realm_of_entropy_title:0 "$spirit_travel_header$ Shade Realm of Entropy"
 shade_realm_of_entropy_desc:0 "[shade_realm|E] connected to Pluto. Supposedly here the Great Karmic Wheel of the Universe is laid bare, and it may even have a direct connection to the Shadowlands."
 shade_realm_of_entropy_effect_desc:0 ""
 shade_realm_of_entropy_option:0 "Enter the Shade of Entropy"

 first_horizon_title:0 "$spirit_travel_header$ First Horizon"
 first_horizon_desc:0 " The First Horizon lies at the edge of Earth's atmosphere and is studded with Horizon Realms, including the [shade_realm|E]s. "
 first_horizon_effect_desc:0 ""
 first_horizon_option:0 "Fly into the First Horizon"

 true_horizon_title:0 "$spirit_travel_header$ True Horizon"
 true_horizon_desc:0 "The True Horizon is a vast expanse of the Umbra located between the Near Umbra and Far Umbra. To Sleepers, it manifests as the space between the Sun and the asteroid belt. "
 true_horizon_effect_desc:0 ""
 true_horizon_option:0 "Fly into the True Horizon"

 far_horizon_title:0 "$spirit_travel_header$ Far Horizon"
 far_horizon_desc:0 "The Far Horizon corresponds roughly to the location of the asteroid belt."
 far_horizon_effect_desc:0 ""
 far_horizon_option:0 "Fly into the Far Horizon"

 deep_umbra_title:0 "$spirit_travel_header$ Deep Umbra"
 deep_umbra_desc:0 "Deep Umbra, also called the Deep Universe, is a vast realm outside Earth's Umbral space. It is largely an immense void. From the human perspective, the Deep Umbra is deep space, outer space, or the whole of the universe."
 deep_umbra_effect_desc:0 ""
 deep_umbra_option:0 "Fly into the Deep Umbra"

 malfeas_title:0 "$spirit_travel_header$ Malfeas"
 malfeas_desc:0 "Malfeas is the mad Shenti realm of the Wyrm located in the Deep Umbra. This is a hellish nightmare world full of every horrible thing imaginable, and a few things so horrible that simply trying to imagine them would drive people insane."
 malfeas_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Gains medium [stress|E] every #V 3#! month.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 malfeas_option:0 "#X Fall into the Malfeas#!"

 black_spiral_labyrinth_title:0 "$spirit_travel_header$ Black Spiral Labyrinth"
 black_spiral_labyrinth_desc:0 "Black Spiral Labyrinth, also called the Ebon Maze in the Middle Kingdom, is a spiral labyrinth within the realm of Malfeas containing unimaginable horrors of the Wyrm."
 black_spiral_labyrinth_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$#N 90%#! chance returning here when trying to escape.\n$BULLET_WITH_TAB$Gains a lot of [stress|E] every #V 3#! month.\n$BULLET_WITH_TAB$Ignore above effect if you are serving the Wyrm."
 black_spiral_labyrinth_option:0 "#X Walk the Black Spiral#!"
 
 first_city_title:0 "$spirit_travel_header$ First City"
 first_city_desc:0 "The First City, also known as The City of Enoch among other names, is recognized by Noddist scholars to be the first city of Cainite mythology as documented by the Book of Nod."
 first_city_effect_desc:0 "Effect:\n$BULLET_WITH_TAB$Gains minor [prestige|E] every #V 3#! month."
 first_city_option:0 "#X Teleport to the First City#!"
 