 custom_desc_den_realm:0 "A Den-Realm is a patch from the Umbra that is tied to a Shapeshifter and serves as her personal retreat. Most Den-Realms are tied to areas in the physical reality and provide a tunnel into the Near Umbra, so that stepping sideways or using similar ways to get into the Umbra are easier. Den-Realms are well protected and it's difficult to breach their defenses."
