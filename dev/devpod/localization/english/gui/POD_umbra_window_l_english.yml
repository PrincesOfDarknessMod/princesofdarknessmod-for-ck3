 game_concept_goblin_market:0 "Goblin Market"
 game_concept_goblin_market_desc:0 "The Goblin Market is a Faerie Market in the [deep_dreaming|E].\n\nAlong the Mistweir in the [deep_dreaming|E], and a hundred leagues away from the thorpe of Fin Bheara, stands a collection of tents and pavilions called the Goblin Market. Treasures of incredible power and rarity are for sale in the Market, as are delights and secrets beyond mortal understanding. The Goblin Market is ruled over by a dozen goblins and their redcap enforcers. All are welcome to enter the Market, so long as they have money or wares to trade."
