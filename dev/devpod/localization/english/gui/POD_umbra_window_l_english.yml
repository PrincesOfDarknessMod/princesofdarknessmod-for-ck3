 game_concept_rivers_of_phantasia:0 "Rivers of Phantasia"
 game_concept_rivers_of_phantasia_desc:0 "The Rivers of Phantasia are [stable_points|E] in the [near_dreaming|E].\n\nThe Rivers of Phantasia cover the North American continent in the [near_dreaming|E], just as the Colorado, Mississippi, and Rio Grande cover the United States of America. Although only a few Kingdoms are blessed by these waters, their influence is always felt when changelings manage to find them. The waters of these rivers are as pure and sweet as the finest dreams. Drinking from them is enough to soothe any hunger and can even cure wounds, both real and chimerical. At certain points, the Rivers of Phantasia are allegedly capable of erasing the years from a changeling. Grumps who drink from the waters can grow younger, even to the point of becoming mere childlings once more. While no memories are lost as a result of these changes in age, outlooks are reversed: it's not only the body that grows younger but the soul as well."
