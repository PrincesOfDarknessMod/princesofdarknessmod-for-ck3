 game_concept_great_dream_forest:0 "Great Dream Forest"
 game_concept_great_dream_forest_desc:0 "The Great Dream Forest , also called the Forest of [dan|E] or the Milderwood, is the forest that is all forests in the [far_dreaming|E].n\nThere is only one Forest in the [far_dreaming|E]. Ancient, majestic, and often filled with danger, the Great Forest spans areas larger than any continent of the waking world. Every imaginable type of tree, both "real" and otherwise, exists here. The Great Forest even runs beneath the Slumbering Oceans and into other lands far beyond the sight of most Kithain."
