 game_concept_bullydale_wastes:0 "Bullydale Wastes"
 game_concept_bullydale_wastes_desc:0 "The Bullydale Wastes is a [nightmare_realm|E] in the [dreaming|E].\n\nPast the Fields Behind, the trods grow treacherous, becoming less like roads and more like goat-paths or hunting trails. The faerie villages grow smaller and less common, thinning out until the traveler is alone but for a rude cottage here and there. The cottagers themselves grow increasingly strange, and this is a region of cannibals, inverts, bandits, and witches."
