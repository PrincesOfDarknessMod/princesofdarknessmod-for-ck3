 game_concept_maharaurava:0 "Mahâraurava"
 game_concept_maharaurava_desc:0 "Mahâraurava is the home Realm of the Naraka in the [near_dreaming|E].\n\nGreatest victim of Ravana's death, the naraka home realm's former beauty has forever disappeared. Situated in the [near_dreaming|E] realm which corresponds to Northwestern India, Mahâraurava was at ground zero when the Hidden Ones deployed their spirit-bomb. Few other creatures have ever visited this realm with the possible exception of the acheri. Changeling legends claim the region was once the most beautiful and cruel of realms, consisting of great jeweled mountains where even the smallest stone was worth a duke's ransom. The naraka, part of a faerie race called the Asuras, lived in civilized, if cruel, splendor, residing in vast palaces carved into the gleaming mountains, lolling in their fruited gardens perfecting the arts of music, love-making, and pain. It was their job, so say the legends, to punish wicked human souls, boiling them in the region's rivers of molten copper."
