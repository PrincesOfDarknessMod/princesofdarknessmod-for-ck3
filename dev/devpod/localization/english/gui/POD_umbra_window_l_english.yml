 game_concept_chakravada:0 "Chakravada"
 game_concept_chakravada_desc:0 "Chakravada is the greatest of all mountains in the [dreaming|E].\n\nFound in the Splintered Mountains, Mount Chakravada, greatest of all mountains, is also the center of all worlds, and, at least within dreams, it is alive."
