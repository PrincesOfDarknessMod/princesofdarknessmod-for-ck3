 game_concept_fin_bheara:0 "Fin Bheara"
 game_concept_fin_bheara_desc:0 "Fin Bheara is a True Fae Boggan and the Faerie Thorpe name after him in the [deep_dreaming|E].\n\nAlong the great barrier, hamlets and towns of all sizes have cropped up over the centuries, peopled by commoner fae who claim they left Arcadia for places away from the sidhe. The greatest of these towns is called Fin Bheara, after the boggan who settled the land. Fin Bheara comprises all sorts of Kithain, even many sidhe who claim Arcadia was barred to them at the time of the Shattering."
