 game_concept_sun:0 "Sun"
 game_concept_sun_desc:0 "The area of the Deep Umbra that houses Helios is nothing but heat and brilliant white light. Bridges made up of reddish light similar to solar flares lead across deep chasms filled with superheated atomized elements. Fire elemental Incarnae dwell here, bright and cheerful, yet charged to defend the realm against intruders. They will attack any werewolves who enter the realm, though they welcome the Corax and others who worship Helios. Any surface within Helios’s realm is too hot to stand or remain near for too long. Only flying spirits enter this area of the Deep Umbra, and travelers without the ability to fly burn up in the fire before they have a chance to realize their mistake."
