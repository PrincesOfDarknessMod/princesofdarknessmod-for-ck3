 the_homeland_of_the_children_of_gaia_desc:0 "The homeland of the Children of Gaia is a vast expanse of lush forests, rolling hills and bubbling streams meandering through the valleys. Humans free of the Delirium wander nomadic across the homeland, with central metropolises that reflect cleaner versions of the cities of ancient Sumer. Herds of unicorn-spirits graze the hills and every visitor gains a unicorn-anamae who guides the visitor through the realm."
