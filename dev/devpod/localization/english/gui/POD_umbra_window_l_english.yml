 the_homeland_of_the_black_furies_title:0 "The Homeland of the Black Furies"
 the_homeland_of_the_black_furies_desc:0 "The homeland of the Black Furies resembles landscapes of mythical Greece: Rocky mountains tower over numerous small islands and peninsulas that stretch into a turquoise sea. Lush forests of pines and olives, always bearing fruits, stretch over the island, along with buildings constructed in Grecian styles, although recently, buildings from all parts of the world have appeared. Numerous emanations of predators, prey and humans dwell in the homeland. All creatures live as part of nature’s cycle of predator and prey with neither side being over-hunted or dying of starvation."
