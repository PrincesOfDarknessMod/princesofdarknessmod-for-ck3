l_english:
 ERA_EFFECT_HEAD:0 "$line_break$#S Effect:#!$line_break$"

 custom_era_name:0 "[GetPlayer.Custom( 'custom_era_name' )]"
 custom_era_desc:0 "[GetPlayer.Custom( 'custom_era_desc' )]"
 
 kj_era_name:0 "[GetPlayer.Custom( 'kj_era_name' )]"
 kj_era_desc:0 "[GetPlayer.Custom( 'kj_era_desc' )]"
 era_name_fourth_age:0 "Fourth Age"
 era_desc_fourth_age:0 "The [GetTrait('kueijin').GetName( GetPlayer )] and [GetTraitGroup('hsien').GetName()] recall this age as the Fourth Age of the Great Cycle or the Age of Beautiful Sadness. It marks the beginning of Kuei-jin's curse and transformation from warriors of Heaven into demonic creatures originating in Yomi.$era_effect_fourth_age$"
 era_effect_fourth_age:0 "$ERA_EFFECT_HEAD$Gain access to the [godbodies_lifestyle|E]."
 era_name_fifth_age:0 "Fifth Age"
 era_desc_fifth_age:0 "To the [GetTrait('kueijin').GetName( GetPlayer )], the current age is the Fifth Age of the Great Cycle or the Age of Darkness. The Chi'n Ta speak of the current world as dominated by the "Stone People", who have come from far away to bring the Middle Kingdom under their control.$era_effect_fifth_age$"
 era_effect_fifth_age:0 "$ERA_EFFECT_HEAD$Gain access to the [shintai_lifestyle|E].$line_break$$godbody_valid$"
 godbody_valid:0 "[GetPlayer.Custom( 'godbody_valid' )]"
 godbody_valid_dharma10:0 "Because you have [GetTrait('dharma10').GetName( GetPlayer )], you won't lose access to [godbodies_lifestyle|E]."
 godbody_valid_dharma9:0 "Because you have [GetTrait('dharma9').GetName( GetPlayer )], you won't lose access to [godbodies_lifestyle|E] until the Sixth Age."
 godbody_valid_dharma8:0 "Because you have [GetTrait('dharma8').GetName( GetPlayer )], you won't lose access to [godbodies_lifestyle|E] until 1650.1.1."
 godbody_valid_dharma7:0 "Because you have [GetTrait('dharma7').GetName( GetPlayer )], you won't lose access to [godbodies_lifestyle|E] until 1600.1.1."
 godbody_valid_dharma6:0 "Because you have [GetTrait('dharma6').GetName( GetPlayer )], you won't lose access to [godbodies_lifestyle|E] until 1550.1.1."
 godbody_valid_dharma5:0 "Because you have [GetTrait('dharma5').GetName( GetPlayer )], you won't lose access to [godbodies_lifestyle|E] until 1450.1.1."
 godbody_valid_dharma4:0 "Because you have [GetTrait('dharma4').GetName( GetPlayer )], you won't lose access to [godbodies_lifestyle|E] until 1350.1.1."
 godbody_invalid:0 "The [godbodies_lifestyle|E] is now invisible to you, you conserve your current perks, but you can not progress in it anymore."
 era_name_sixth_age:0 "Sixth Age"
 era_desc_sixth_age:0 "The [GetTrait('kueijin').GetName( GetPlayer )] call the coming age the Sixth Age of the Great Cycle, also referred to as the Age of Sorrow. It is the nadir of the Wheel, where the August Personage of Jade steps down from His throne and one of the Yama Kings will ascend to become the Demon Emperor."
 
