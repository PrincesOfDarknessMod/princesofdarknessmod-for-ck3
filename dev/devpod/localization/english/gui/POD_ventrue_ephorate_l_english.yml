l_english:
 tab_ventrue_ephorate:0 "#T Ventrue Ephorate#!"
 
 ventrue_ephorate_tab_tt:0 "Ventrue Ephorate"
 ventrue_ephorate_intro:0 "The Ephorate consists of the 12 most powerful and influential Ventrue elders. The Ephors establish precedent in matters of "clan policy". It is the highest rank among the Ventrue internal hierarchy.\nEach Ephor supports a specific faction and, depending on their overall power, each faction gives benefits and hindrances to the whole clan, represented as dynasty modifiers."
 support_knights_loc:0 "Supports the Ashen Knights"
 support_patricians_loc:0 "Supports the Patricians"
 support_merchants_loc:0 "Supports the Merchant Princes"
 support_eternal_loc:0 "Supports Sinner Rome"
 support_senate_loc:0 "Supports the Eternal Senate"
 euphorate_senate_tooltip:0 "The Eternal Senate, also known as the Antasians, is an idealized recreation of the organization of the same name existing during Roman times. They strive for equality and a democratic vision for the Cainite future, where all vampires have a representation in the governing body."    
 euphorate_eternal_tooltip:0 "Imperial Rome, also known informally as Sinner Rome or Camilla's Rome, represents those Ventrue longing for the time of Camilla's rulership over the clan. Shadowing the greatest empire known to Europe, Camilla managed, despite his very decadent ways, to ensure clan Ventrue's dominance over all other clans for several centuries."    
 euphorate_merchants_tooltip:0 "The Merchant Princes advocate that true influence is shifting from the nobility to the emerging middle class. If money is to become power, those Ventrue want to be at the forefront of this change."    
 euphorate_knights_tooltip:0 "The Ashen Knights are the Ventrue less interested in accumulating power. They instead strictly adhere to their own code of chivalry and hope for clan Ventrue to set an example of bravery, restraint and discipline to other clans instead of directly trying to rule them."    
 euphorate_patricians_tooltip:0 "The Patricians clamor for their Enoch inherited right to rule over all Cainites. They are mostly composed of Princes mirroring the mortal nobility. While they respect Camilla and Rome's achievements, they see hedonism and decadence as the reason behind its fall and are much more stern and disciplined than their Roman leaning counterparts."    

 substantial_senate_influence_modifier:0 "Substantial Eternal Senate Influence"
 substantial_senate_influence_modifier_desc:0 "The Eternal Senate wields a noteworthy influence in the Ephorate politics, influencing Clan Ventrue's ideology somewhat."
 important_senate_influence_modifier:0 "Important Eternal Senate Influence"
 important_senate_influence_modifier_desc:0 "The Eternal Senate wields an important influence in the Ephorate politics, influencing Clan Ventrue's ideology in a noteworthy fashion."
 overwhelming_senate_influence_modifier:0 "Overwhelming Eternal Senate Influence"
 overwhelming_senate_influence_modifier_desc:0 "The Eternal Senate wields an all-powerful influence in the Ephorate politics, influencing Clan Ventrue's ideology to its core."

