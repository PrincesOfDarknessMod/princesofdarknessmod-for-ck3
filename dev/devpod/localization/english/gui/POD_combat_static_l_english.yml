 ##############################
 ###### DYNAMIC MOVE TOOLTIP (pod_combat_move_desc SGUI)
 ##############################
 # Each line is appended to a move's tooltip iff the matching variable
 # is present on the story_cycle. Interpolation reads from the 'story'
 # scope added by the PODCombatMoveDesc macro.
 #
 # FORMATTING TRICK:
 #   The macro wraps the whole SGUI output in |h - setting default color
 #   to transparent. This hides the bullet points that custom_tooltip
 #   always prepends. To make the ACTUAL text visible, each loc entry
 #   must start with #medium;outline (or any explicit color format) which
 #   overrides the transparent default. Each entry ends with
 #   $EFFECT_LIST_BULLET$ - a second invisible bullet that keeps the
 #   text centered in the tooltip box.
 #
 # If you drop the #medium;outline prefix, only the interpolated values
 # render (labels and punctuation become transparent).

 # Capability callouts - short flag-style lines describing how the
 # move's contact resolution differs from the default Physical pipeline.
 # Each one fires when the corresponding capability flag is ABSENT on
 # the move story (the runtime contact resolver in pod_combat_effects.txt
 # reads has_variable on the same flags). Surfaces concrete behavioral
# descriptions - "No Hit roll", "Bypasses Guard", "Hits spirits" - 
 # rather than a coarse Physical / Supernatural / Mental category tag,
 # because those three behaviors are what the move actually does at
 # runtime.
 #
 # Concept-linked terms (Guard, Dodge, Stealth) hover-pop the matching
# concept card. "No Hit roll" and "Hits spirits" are bare phrases - 
 # there's no single concept card that captures "the move skipped its\n # hit roll" or "the move ignores incorporeality".
 pod_combat_desc_always_hits:   "#medium;outline [Concept('pod_combat_hit_chance','No Hit roll')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_undodgeable:   "#medium;outline Undodgeable — bypasses [pod_combat_dodge_with_icon|E] and [pod_combat_stealth_with_icon|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hits_spirits:  "#medium;outline Affects incorporeal spirits#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_uses_weapon:   "#medium;outline Uses your weapon [artifact|E] #weak (if it has bonuses to [pod_combat_skills|E])#!#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_uses_weapon_armed: "#medium;outline Uses your weapon [artifact|E] ([pod_weapon.GetNameNoTooltip])#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_weapon_empowered: "#medium;outline Uses #bold [pod_weapon.GetNameNoTooltip]#!:$pod_weapon_ovr_line$#! $EFFECT_LIST_BULLET$"
 # Combined cost line: pod_combat_desc_costs dispatches once when any
 # cost var is set, concatenating five PODCombatXxxCostInline fragments
 # (00_POD_combat_custom_loc.txt). Fragments are bare leading-space
 # "[icon] VALUE word" snippets; energy is splat-aware. 
 pod_combat_costline_energy:       " [GetPlayer.Custom('PODEnergySplatIcon')]#bold [Multiply_CFixedPoint( ROOT.Var('energy_cost').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! #V [GetPlayer.Custom('PODEnergySplatWord')]#!"
 pod_combat_costline_gold:         " @gold_icon!#bold [ROOT.Var('gold_cost').GetValue|V0]#! gold"
 pod_combat_costline_piety:        " @piety_icon!#bold [ROOT.Var('piety_cost').GetValue|V0]#! piety"
 pod_combat_costline_prestige:     " @prestige_icon!#bold [ROOT.Var('prestige_cost').GetValue|V0]#! prestige"
 pod_combat_costline_stress:       " @stress_icon!#bold [ROOT.Var('stress_cost').GetValue|V0]#! stress"
 pod_combat_desc_costs:            "#medium;outline Costs:[story.Custom('PODCombatEnergyCostInline')][story.Custom('PODCombatGoldCostInline')][story.Custom('PODCombatPietyCostInline')][story.Custom('PODCombatPrestigeCostInline')][story.Custom('PODCombatStressCostInline')]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_steal_gold:        "#medium;outline Steal #bold [story.MakeScope.Var('steal_gold').GetValue|V0]#! gold from the enemy#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_gain_dread:        "#medium;outline Gain #bold [story.MakeScope.Var('gain_dread').GetValue|V0]#! dread#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_once_per_round:     "#medium;outline Usable once per round#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_once_per_combat:    "#medium;outline Usable once per combat#! $EFFECT_LIST_BULLET$"

 # HP damage line - one loc entry per elemental damage class plus a `_basic`
 # fallback. The SGUI dispatches every elemental move to its per-element key,
 # so _basic's GetFlagName only ever sees superficial/aggravated (bare element
 # keys like `fire` would collide with vanilla flag loc). Always-aggravated
 # elements (fire/balefire) show the aggravated box; conditional
 # elements show no box - the colored concept word carries the per-splat
 # behavior (PoD core decides aggravated-ness per target). `|E` omitted on the
 # Concept call so the #color frame wins over concept-blue. Pipeline
 # shape is NOT branched - runtime sees capability flags, not attack_type.
 pod_combat_desc_hp_damage_basic:        "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_elemental:    "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [Localize( Concatenate( 'pod_combat_damage_type_', story.MakeScope.Var('damage_type').GetFlagKey ) )] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 # Morale damage - same shape as the hp damage line minus the
 # wound-box classification icon (morale damage doesn't book on the
 # health track). "Morale" is concept-linked via |E so it picks up
 # the standard light-blue concept-link styling that the AP-cost
 # pipeline labels use, matching the result-column treatment in
 # pod_combat_log_result_text_morale_damage / pod_combat_log_morale_damage_rider.
 pod_combat_desc_morale_damage:     "#medium;outline #N Deal#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! [pod_combat_morale|E] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_hp_damage: "#medium;outline #N Deal#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! [pod_combat_morale|E] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], but only if the attack deals HP Damage after Soak#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_contact:   "#medium;outline #N Deal#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! [pod_combat_morale|E] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], but only if the attack makes contact (including a blocked or fully Soaked hit)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_miss:      "#medium;outline #N Deal#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! [pod_combat_morale|E] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], but only if the attack misses or is evaded#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage:       "#medium;outline Take #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! self-damage#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_hp_damage: "#medium;outline Take #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! self-damage, but only if the attack deals HP Damage after Soak#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_contact:   "#medium;outline Take #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! self-damage, but only if the attack makes contact (including a blocked or fully Soaked hit)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_miss:      "#medium;outline Take #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! self-damage, but only if the attack misses or is evaded#! $EFFECT_LIST_BULLET$"
 # Heal line - uses the same wound-box icon vocabulary as the
 # damage line. heal_type (flag:superficial / flag:aggravated) is
 # always set by POD_combat_move_set_hp_heal, so GetFlagName
 # reliably returns the box-icon loc value defined under DAMAGE
 # TYPE LABELS below. Mirrors how the result column shows healing:
 # `+N [box]` is identical visual grammar.
 pod_combat_desc_hp_heal:           "#medium;outline #P Restore#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 # Drain variant - replaces the standard heal line for moves with the
 # `drain` flag (Bite, Brutal Feed, Soul Drain, etc.). Communicates two
 # things that the plain heal line doesn't: (a) the heal is thematically
 # drained from the target, not self-regen, and (b) the heal only fires
 # when the attack deals actual post-Soak HP damage.
 pod_combat_desc_drain:             "#medium;outline #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName]#! from target, but only if the attack deals HP Damage after Soak#! $EFFECT_LIST_BULLET$"
 # Combined damage+drain variants - used when a move has both hp_damage
 # and the drain flag (vampiric bites, soul-feasts, etc.). Inlines the
 # drain readout onto the same tooltip line as the damage so the player
 # sees a single "Deal X type Damage, Drain Y after post-Soak HP Damage" line instead of
 # two separate bullets. The standalone pod_combat_desc_drain key above
 # only fires when drain is set WITHOUT hp_damage (a defensive orphan
 # path that doesn't currently apply to any move).
 pod_combat_desc_hp_damage_basic_drain:        "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] if the attack deals HP Damage after Soak#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_elemental_drain:    "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [Localize( Concatenate( 'pod_combat_damage_type_', story.MakeScope.Var('damage_type').GetFlagKey ) )] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] if the attack deals HP Damage after Soak#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_heal:       "#medium;outline #P Restore#! #bold [story.MakeScope.Var('morale_heal').GetValue|V0]#! [pod_combat_morale|E] to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"

 # Soak buffs/debuffs and hit-chance buffs/debuffs link to the matching
 # concept card so hovering the term opens the same explanation the
 # combat window's stat labels use. `soak_damage` is PoD's vanilla
 # concept; `pod_combat_hit_chance` is defined locally above.
 pod_combat_desc_soak_buff_round:    "#medium;outline #P +[soak_damage|E]#! (tier [story.MakeScope.Var('soak_buff_round_tier').GetValue|V0]) until your next turn starts#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_soak_buff_combat:   "#medium;outline #P +[soak_damage|E]#! (tier [story.MakeScope.Var('soak_buff_combat_tier').GetValue|V0]) for the rest of combat#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_soak_debuff_round:  "#medium;outline #N −[soak_damage|E]#! (tier [story.MakeScope.Var('soak_debuff_round_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] through the target's next turn#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_soak_debuff_combat: "#medium;outline #N −[soak_damage|E]#! (tier [story.MakeScope.Var('soak_debuff_combat_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] for the rest of combat#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_buff_round:     "#medium;outline #P +[pod_combat_hit_chance|E]#! (tier [story.MakeScope.Var('hit_buff_round_tier').GetValue|V0]) until your next turn starts#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_buff_combat:    "#medium;outline #P +[pod_combat_hit_chance|E]#! (tier [story.MakeScope.Var('hit_buff_combat_tier').GetValue|V0]) for the rest of combat#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_debuff_round:   "#medium;outline #N −[pod_combat_hit_chance|E]#! (tier [story.MakeScope.Var('hit_debuff_round_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] through the target's next turn#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_debuff_combat:  "#medium;outline #N −[pod_combat_hit_chance|E]#! (tier [story.MakeScope.Var('hit_debuff_combat_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] for the rest of combat#! $EFFECT_LIST_BULLET$"
 # Ally-facing variants. The dispatcher picks these when the move's targeting
 # diverts the buff off the actor (pod_combat_move_targets_ally_trigger); the
 # keys above stay the self wording, including for a self-buff riding an
 # enemy-targeted attack.
 pod_combat_desc_soak_buff_round_other:  "#medium;outline #P +[soak_damage|E]#! (tier [story.MakeScope.Var('soak_buff_round_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] until the recipient's next turn starts#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_soak_buff_combat_other: "#medium;outline #P +[soak_damage|E]#! (tier [story.MakeScope.Var('soak_buff_combat_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] for the rest of combat#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_buff_round_other:   "#medium;outline #P +[pod_combat_hit_chance|E]#! (tier [story.MakeScope.Var('hit_buff_round_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] until the recipient's next turn starts#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_buff_combat_other:  "#medium;outline #P +[pod_combat_hit_chance|E]#! (tier [story.MakeScope.Var('hit_buff_combat_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] for the rest of combat#! $EFFECT_LIST_BULLET$"

 # Stance-related lines link Guard / Dodge / Stealth to their concept
 # cards (defined in the GAME CONCEPTS - combat stances block below).
 # Hover gives the full mechanic; matches the visual vocabulary the
 # combat log already uses for the matching result rows.
 pod_combat_desc_set_guard:         "#medium;outline Enter [pod_combat_guard_with_icon|E] stance#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_dodge:             "#medium;outline Enter [pod_combat_dodge_with_icon|E] stance#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_stealth:           "#medium;outline Enter [pod_combat_stealth_with_icon|E]#! $EFFECT_LIST_BULLET$"
 # Grant framing for the ally-targeted routing - see the tier-buff _other keys.
 # Stealth has no ally-targeted move today, but §12b broadcasts it to every
 # ally slot, so the variant exists rather than silently regressing later.
 pod_combat_desc_set_guard_other:   "#medium;outline Grant [pod_combat_guard_with_icon|E] stance to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_dodge_other:       "#medium;outline Grant [pod_combat_dodge_with_icon|E] stance to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_stealth_other:     "#medium;outline Grant [pod_combat_stealth_with_icon|E] to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_bypass_guard:      "#medium;outline Ignores [pod_combat_guard_with_icon|E] on [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 # "Removes" matches the runtime semantic: the contact prelude deletes the
 # target's stance variable (pod_combat_move_effects.txt §5) so the stance is
 # consumed for any follow-up attack, not just this one. Kept distinct from
 # the capability-driven "Undodgeable" callout above (which fires on
 # NOT has_variable = checks_stance), where the stance stays in place but
 # the move bypasses its evasion.
 pod_combat_desc_bypass_dodge:      "#medium;outline Removes [pod_combat_dodge_with_icon|E] from [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_bypass_stealth:    "#medium;outline Removes [pod_combat_stealth_with_icon|E] from [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
