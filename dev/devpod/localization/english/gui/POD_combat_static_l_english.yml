 pod_combat.0100.t: "Turns & Targeting"
 pod_combat.0100.desc: "#bold YOUR TURN#!\nEach round you start with #bold 6 Action Points#! (more or less if something buffed, drained, or refunded AP). Spend AP on the skills on your bar; skills you can't afford are greyed out. Click #bold End Turn#! when you're done - unspent AP is forfeited.\n\nMany skills also cost #bold supernatural energy#! - Blood for vampires, Gnosis for shifters, Pathos or Angst for wraiths, Glamour for changelings, and so on. It is paid from your splat's regular pool, so leaning on expensive disciplines drains you over a fight and leaves you depleted afterward. A few skills also cost Gold, Piety, Prestige, or [Concept('static_stress','Mental Strain')|E].\n\nTo choose what's on your bar, open #bold Configure Combat Skills#! before combat. You're capped at four skills per category (ATK / DEF / CTL / PWR). Enable #bold Show all moves#! there to browse skills you haven't unlocked - each locked skill lists exactly which traits, powers, or perks you're missing.\n\n#bold PICKING YOUR TARGET#!\nClick an ally or enemy's #bold card#! (or their portrait in the turn-order strip) to mark them as your current target; their card shows a @check_icon! #bold Targeted#! badge, and your target plus your [Concept('pod_combat_hit_chance','Hit Chance')|E] against them appear at the top of the window. Offensive skills fire on your enemy target, support skills (heals, buffs) on your ally target, and self-only skills ignore targeting. Some skills are #bold area-of-effect#! - they hit every enemy or every ally at once, whatever you have selected. Switching targets recalculates your Hit Chance against their [Concept('prowess','Prowess')|E] and defenses.\n\n#bold WHO THE AI IS AFTER#!\nEach AI combatant's card carries an #bold Attacking#! line naming who they last went after - both enemies and your own AI allies show it (your target is the readout up top). It is the foe they have been #italic focusing#! on: a strong tendency, since combatants tend to keep hammering the same victim, but not a promise - an AI will break off to finish a nearly-downed target. The line is blank before a combatant has taken its first turn, and while a combatant is #bold dominated#! (its focus clears for that turn). Read it to spot who is about to get ganged up on, and to pull a fragile ally out of the line of fire.\n\n#bold TURN ORDER#!\nIn fights of three or more, a #bold turn-order strip#! of portraits runs across the top - this round's acting order, left to right. The current actor is highlighted in gold; portraits dim once they've acted or fallen, and the strip scrolls sideways when the brawl gets crowded. Combatants can join a fight already underway - a necromancer raising a wraith ally, reinforcements arriving - and they fold into the order from the next round."
 pod_combat.0101.t: "Reading the Fight"
 pod_combat.0101.desc: "#bold THE COMBATANT CARDS#!\nEach combatant's card shows:\n• [Concept('POD_health_track','Health Track')|E] - wound boxes; fills as they take hits.\n• [Concept('pod_combat_morale','Morale')|E] - mental composure, separate from HP; mental attacks target it.\n• [Concept('prowess','Prowess')|E] / [Concept('pod_combat_hit_chance','Hit')|E] / [Concept('soak_damage','Soak')|E] - offensive and defensive numbers.\n• [Concept('pod_combat_initiative','Init')|E] / [Concept('pod_combat_turn_order','Turn')|E] - when they act this round.\nStatus icons along the card's bottom edge flag active stances and afflictions (Guard, Dodge, Stealth, Retaliate, burning, daze, domination); hover any of them for the specifics.\n\n#bold THE COMBAT LOG#!\nThe scrolling panel below the skill bar captures every meaningful event in order, newest at the top. Each row shows who acted, the skill, the target, and everything the move did - damage, healing, drains, afflictions, recoil, and counters surface inline, as do the misses, blocks, and soaks that stopped them. Allies are tinted gold, enemies red, so a quick scroll back tells you the rhythm of the fight at a glance.\n\nA few row patterns to recognise:\n• #bold Area-of-effect#! attacks push #bold one row per target#! so you can see exactly who took what (e.g. \"Mithras → All enemies (Steve)\").\n• When a stance like Retaliate fires, the row that triggered it shows a #bold + Counter#! rider next to the main outcome.\n• Bookend markers frame the fight - \"— Combat begins —\" at the bottom, \"— Round 2 begins —\" at each round break, and \"— Combat ends · Victory —\" or \"— Combat ends · Defeat —\" at the top when it's over."
 pod_combat.0102.t: "Offense, Defense & Effects"
 pod_combat.0102.desc: "#bold LANDING A HIT#!\nWhen you attack, the blow has to get past your target's defenses: their [Concept('pod_combat_stealth','Stealth')|E] and [Concept('pod_combat_dodge','Dodge')|E] can make you miss outright, your Hit roll can whiff, their [Concept('pod_combat_guard','Guard')|E] can block a landing blow, and their [Concept('soak_damage','Soak')|E] can absorb damage that gets through - rolled separately for each point of damage, so a heavy blow is usually shaved down rather than stopped outright. Skills tagged #bold Ignores Guard#!, #bold Ignores Dodge#!, or #bold Breaks Stealth#! skip specific stages - good for cutting through a turtling opponent.\n\n#bold DAMAGE TYPES#!\n• [Concept('POD_superficial_damage','Superficial')|E]: soakable point by point, heals between combats.\n• [Concept('POD_aggravated_damage','Aggravated')|E]: unsoakable by default, heals slowly. Elemental blows - fire, cold, lightning, sun, silver, gold, holy, balefire, poison and cold iron - land aggravated only against the splats vulnerable to them, and some splats are outright #bold immune#!: a werewolf dreads silver, a vampire fears sun and true faith, the fae recoil from cold iron, and the undead simply shrug off poison. Each damage type's concept card lists exactly who it wounds.\nA handful of skills are #bold draining attacks#! - bites, soul-feasts and the like that heal you, but only if the blow actually lands. A few #bold wound you back#! when used: reckless all-out attacks that trade some of your own HP for a heavier hit.\n\n#bold DEFENSIVE PLAY#!\nYou can stack defenses in advance - they stay up until something tests them. A good turn often sets up a defense instead of attacking:\n• [Concept('pod_combat_guard','Guard')|E] - block the next landing attack.\n• [Concept('pod_combat_dodge','Dodge')|E] - negate the next attack entirely.\n• [Concept('pod_combat_stealth','Stealth')|E] - +30% Hit on your next attack; incoming attacks miss while you're hidden.\n• #bold Retaliate on Hit / on Miss#! - counter whoever tests you. The skill tooltip lists the exact counter and whether it lands superficial or aggravated.\n\n#bold BUFFS & DEBUFFS#!\nMany skills apply temporary stat modifiers in three tiers (#bold small +10 / medium +20 / large +30#!) lasting either the #bold round#! or the whole #bold combat#!. A higher tier overwrites a lower; reapplying the same tier does nothing. Save combat-duration buffs for drawn-out fights; use round-duration buffs for burst turns.\n\n#bold AFFLICTIONS & CONTROL#!\nSome skills leave more than a wound:\n• #bold Damage over time#! - burning, freezing and their kin bite again at each round's end for a few rounds, each tick marked with its damage-type icon. Mental afflictions fray [Concept('pod_combat_morale','Morale')|E] instead; untyped ones simply wound. A status icon on the victim's card marks it - hover for the damage and rounds left.\n• #bold Daze & stun#! - some blows drain the target's Action Points for their next turn. Drained dry, they are #bold stunned#! and lose that turn entirely.\n• #bold Domination#! - a few mental powers steal a combatant's next turn and turn it against their own side. Strong mental defenses shrug it off unless the caster can pierce them, and #bold your#! character can never be puppeted."
 pod_combat.0103.t: "Outcomes & Controls"
 pod_combat.0103.desc: "#bold GETTING KNOCKED OUT#!\nA combatant is out of the fight when any of these happens:\n• Their [Concept('POD_health_track','Health Track')|E] fills completely.\n• Their [Concept('pod_combat_morale','Morale')|E] hits zero.\n• They enter an #N incapacitating state#! - severe wound, vampire torpor, wight withering, kuei-jin pre-dharma, wraith Shadow, or zombification.\nEvery fall shakes the survivors: when a combatant goes down, each remaining member of their team loses #bold 2#! [Concept('pod_combat_morale','Morale')|E] from the shock. The shock can rattle but never breaks anyone by itself - only further punishment finishes a demoralized combatant. #bold Win#! when every enemy is knocked out; you #bold lose#! when you and all your allies are.\n\n#bold AFTER THE FIGHT#!\nWounds and [Concept('static_stress','Mental Strain')|E] from Morale damage both carry over to your normal character - a bad beating leaves you wounded and stressed for days. Energy spent on supernatural skills also persists, so a drained Blood or Gnosis pool stays drained until your usual recovery refills it. Your equipped skill loadout persists between combats.\n\n#bold DUEL MODES#!\nThe event that triggered the fight decides the fatality rules:\n• #bold Lethal#!: standard - wounds stick, and fatal wounds can kill or send vampires/wraiths into torpor normally.\n• #bold Non-fatal#!: wounds accrue but nobody actually dies - everyone's wound track is capped back to at least one empty box at combat end.\n• #bold Practice#!: sparring - HP damage and heals no-op entirely; only Morale (and its Mental Strain spillover) actually changes.\n\n#bold WINDOW BUTTONS#!\n• #bold End Turn#!: commit your turn and pass to the next combatant in initiative order. Unspent AP is lost.\n• #bold Auto-Resolve#!: skip the rest of combat; a quick Prowess compare decides it. Fast, but you give up control of the result.\n• #bold End Combat#!: dismiss the window once the fight is resolved (replaces End Turn / Auto-Resolve after victory or defeat).\n• #bold Auto-advance#! checkbox: when on, all the AI turns in a round resolve in one click instead of one at a time.\n• #bold Help#!: re-open this guide at any time.\n\nA fight that began as a duel ends on its own card instead: once the matter is decided, a #bold Conclude the duel#! prompt appears, and taking it carries the result back to whoever called for the fight. There is no walking away from a duel part-way through - see it out, or let Auto-Resolve settle it."

