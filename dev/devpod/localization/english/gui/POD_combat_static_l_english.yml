 ##############################
 ###### HELP / OVERVIEW EVENT
 ##############################

 pod_combat.0001.t: "Combat System Overview"
 pod_combat.0001.desc: "Combat is turn-based. You and the enemy take turns spending Action Points on combat skills you've equipped beforehand, with a fight ending when one side is entirely knocked out. Every blue label in the combat window has a hover tooltip — use them any time you need a refresher on what something does.\n\n#bold YOUR TURN#!\nEach round you start with #bold 6 Action Points#! (more or less if something buffed, drained, or refunded AP). Spend AP on the skills on your skill bar — skills you can't afford are greyed out. Click #bold End Turn#! when you're done; unspent AP is forfeited.\n\nMany skills also cost #bold supernatural energy#! — Blood for vampires, Gnosis for shifters, Pathos for wraiths, Glamour for changelings, and so on. The cost is paid from your splat's regular pool, so spamming expensive disciplines drains you over the course of a fight and leaves you depleted afterward. A few skills also cost Gold, Piety, Prestige, or [Concept('static_stress','Mental Strain')|E].\n\nTo choose what's on your skill bar, open #bold Configure Combat Skills#! before combat. You're capped at four skills per category (ATK / DEF / CTL / PWR) for balance.\n\n#bold PICKING A TARGET#!\nClick any #bold ally or enemy portrait#! to mark them as your current target. Offensive skills fire on your enemy target; support skills (heals, buffs) fire on your ally target. Self-only skills ignore targeting. Some skills are area-of-effect — they hit every enemy or every ally in one swing, regardless of which one you currently have selected.\n\nSwitching targets recalculates your [Concept('pod_combat_hit_chance','Hit Chance')|E] against their [Concept('prowess','Prowess')|E] and defenses.\n\n#bold READING THE COMBAT PANEL#!\nEach combatant's card shows:\n• [Concept('POD_health_track','Health Track')|E] — wound boxes. Fills up as they take hits.\n• [Concept('pod_combat_morale','Morale')|E] — mental composure. Runs separate from HP; mental attacks target it.\n• [Concept('prowess','Prowess')|E] / [Concept('pod_combat_hit_chance','Hit')|E] / [Concept('soak_damage','Soak')|E] — offensive/defensive numbers.\n• [Concept('pod_combat_initiative','Init')|E] / [Concept('pod_combat_turn_order','Turn')|E] — when they act this round.\n\n#bold OFFENSE & DEFENSE#!\nWhen you attack, the hit has to get past your target's defenses: their [Concept('pod_combat_stealth','Stealth')|E] and [Concept('pod_combat_dodge','Dodge')|E] can make you miss outright, your Hit roll can whiff, their [Concept('pod_combat_guard','Guard')|E] can block a landing blow, and their [Concept('soak_damage','Soak')|E] can absorb damage that gets through. Skills with #bold Ignores Guard#!, #bold Ignores Dodge#!, or #bold Breaks Stealth#! skip specific stages — great for cutting through a turtling opponent.\n\nDamage comes in two flavors:\n• [Concept('POD_superficial_damage','Superficial')|E]: soakable, heals between combats.\n• [Concept('POD_aggravated_damage','Aggravated')|E]: unsoakable by default, heals slowly. Fire, sun, silver, gold, holy, and balefire damage types force aggravated wounds against vulnerable splats — a werewolf should avoid silver, a vampire should fear sun, etc.\n\nA handful of skills are #bold draining attacks#! — vampiric bites, soul-feasts, and similar themed strikes that heal you, but only if the attack actually lands. A miss, dodge, or stealth-evade means no heal that turn. A few skills also #bold wound you back#! when you use them — reckless all-out attacks that trade some of your own HP for a heavier blow.\n\n#bold DEFENSIVE PLAY#!\nYou can stack defenses in advance — they stay on until something tests them. A good turn often sets up a defense instead of attacking:\n• [Concept('pod_combat_guard','Guard')|E] — block the next landing attack.\n• [Concept('pod_combat_dodge','Dodge')|E] — negate the next attack entirely.\n• [Concept('pod_combat_stealth','Stealth')|E] — +30% Hit on your next attack, incoming attacks miss while hidden.\n• #bold Retaliate on Hit / Retaliate on Miss#! — counter-attack whoever tests you.\n\n#bold BUFFS & DEBUFFS#!\nMany skills apply temporary stat modifiers in three tiers (#bold small +10 / medium +20 / large +30#!) that last either the #bold round#! or the whole #bold combat#!. A higher tier overwrites a lower; reapplying the same tier does nothing. Save combat-duration buffs for drawn-out fights; use round-duration buffs for burst turns.\n\n#bold GETTING KNOCKED OUT#!\nA combatant is out of the fight when any of these happens:\n• Their [Concept('POD_health_track','Health Track')|E] fills completely\n• Their [Concept('pod_combat_morale','Morale')|E] hits zero\n• They enter an #N incapacitating state#! — severe wound, vampire torpor, wight withering, kuei-jin pre-dharma, wraith Shadow, or zombification\n\nWin when every enemy is knocked out. Lose when you and all your allies are knocked out.\n\n#bold AFTER THE FIGHT#!\nWounds and [Concept('static_stress','Mental Strain')|E] from Morale damage both carry over to your normal character — a bad beating leaves you wounded and stressed for days to come. Energy spent on supernatural skills also persists, so a drained Blood or Gnosis pool stays drained until your usual recovery refills it. Your equipped skill loadout persists between combats.\n\n#bold DUEL MODES#!\nThe event that triggered this fight decides the fatality rules:\n• #bold Lethal#!: standard — wounds stick, and fatal wounds can kill or send vampires/wraiths into torpor normally.\n• #bold Non-fatal#!: wounds accrue but nobody actually dies in the fight — everyone's wound track is capped back to at least one empty box at combat end.\n• #bold Practice#!: sparring — HP damage and heals no-op entirely. Only Morale (and its Mental Strain spillover) actually changes.\n\n#bold WINDOW BUTTONS#!\n• #bold Auto-Resolve#!: Skip tactical play; a quick Prowess compare decides the outcome. Fast, but you give up control.\n• #bold Forfeit#! (X button, top-right): Concede immediately — your opponent wins.\n• #bold End Combat#!: Dismiss the window once the fight is resolved."
