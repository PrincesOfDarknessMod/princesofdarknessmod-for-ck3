 ###### WEAPON ARTIFACT OVERRIDES ######
 # Generated from the artifact's override vars by the pod_weapon_ovr_line
 # composition (one Custom call per PODWeaponOvr* segment), so
 # the move card and the artifact surfaces always agree. Each segment is
 # emit-or-blank and carries its own leading line break, so several overrides
 # stack one per line the way move effects do. The artifact block is
 # appended at WIDGET level (the [Artifact.GetDesc] surfaces render
 # pod_artifact_desc_and_weapon_override) - it cannot live inside a
 # description key, which localizes without the Artifact data context.
