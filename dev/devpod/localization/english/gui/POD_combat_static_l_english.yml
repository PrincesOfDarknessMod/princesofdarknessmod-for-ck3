 # already active on the eligible target(s) at equal or higher strength
 pod_combat_move_redundant_tt: "Every effect of this move is already active at equal or higher strength"
 # Per-slot morale tooltip - Scope is the slot story (set by the
 # combat-window slot-row datamodel), so Scope.Var('slot_morale') reads
