 # Stance-related lines link Guard / Dodge / Stealth to their concept
 # cards (defined in the GAME CONCEPTS — combat stances block below).
 # Hover gives the full mechanic; matches the visual vocabulary the
 # combat log already uses for the matching result rows.
 pod_combat_desc_set_guard:         "#medium;outline Enter [Concept('pod_combat_guard','Guard')|E] stance (blocks next physical attack)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_dodge:             "#medium;outline Enter [Concept('pod_combat_dodge','Dodge')|E] stance (negates next attack)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_stealth:           "#medium;outline Enter [Concept('pod_combat_stealth','Stealth')|E] (+30 hit, consumed on attack/hit)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_bypass_guard:      "#medium;outline Ignores target's [Concept('pod_combat_guard','Guard')|E]#! $EFFECT_LIST_BULLET$"
 # bypass_dodge / bypass_stealth wording matches the runtime semantic —
 # the contact prelude actively REMOVES the target's stance variable
 # (pod_combat_move_effects.txt §5: remove_variable = pod_combat_target_is_dodging
 # / _is_stealthed) before the damage resolver runs. "Removes" is the
 # accurate verb here; the older "Ignores" / "Breaks" wording undersold
 # how persistent the effect is — the stance is consumed for any
 # follow-up attack, not just this one. Kept distinct from the
 # capability-driven "Undodgeable" callout above (which fires on
 # NOT has_variable = checks_stance), where the stance is left in
 # place but the move bypasses its evasion.
 pod_combat_desc_bypass_dodge:      "#medium;outline Removes target's [Concept('pod_combat_dodge','Dodge')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_bypass_stealth:    "#medium;outline Removes target's [Concept('pod_combat_stealth','Stealth')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_remove_guard:      "#medium;outline Strips target's [Concept('pod_combat_guard','Guard')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_retaliate_if_hit:  "#medium;outline Retaliate when hit#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_retaliate_if_missed: "#medium;outline Retaliate when missed#! $EFFECT_LIST_BULLET$"

 pod_combat_desc_ap_gain:           "#medium;outline Gain #bold [story.MakeScope.Var('ap_gain').GetValue|V0]#! AP#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_ap_drain:          "#medium;outline Drain #bold [story.MakeScope.Var('ap_drain').GetValue|V0]#! AP from target next turn#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_initiative_debuff: "#medium;outline −[story.MakeScope.Var('initiative_debuff').GetValue|V0] target initiative next round#! $EFFECT_LIST_BULLET$"

 # Bare-flag locs for var:targeting on combat move stories. Damage,
 # heal, and morale lines above fold the target description inline via
 # `[story.MakeScope.Var('targeting').GetFlagName]`, which CK3
 # localizes by looking up the flag's KEY against these entries. Same
 # pattern DUEL-Refactor uses for its own self / single_enemy /
 # single_ally / aoe_enemy / aoe_ally flag values.
 #
 # Naming differs from DUEL-Refactor on the team-target flags:
 # the combat minigame uses team_enemy / team_ally where DUEL-Refactor
 # uses aoe_enemy / aoe_ally. Both flag-value namespaces coexist
 # cleanly when the two mods are loaded together.
 #
 # The bare flag-name keys below resolve a target var-flag (single_enemy
 # / team_ally / etc.) into a phrase fragment for inline use in the
 # damage/heal/morale headline (e.g. "Deal 5 superficial fire to one
 # enemy"). The dedicated standalone "Target: X" loc dispatch was
 # retired in favor of this inline-phrase approach.
 single_enemy: "one enemy"
 single_ally:  "one ally"
 single_pc:    "the player character"
 self:         "yourself"
 team_enemy:   "all enemies"
 team_ally:    "all allies"


 ##############################
 ###### MOVE BUTTON DATAMODEL LOC
 ##############################
 # Generic loc keys used by the two combat GUI windows. They render
 # per-move via Scope.Var(...) against the datamodel item (a
 # story_cycle of type POD_combat_move).
 #
 # POD_combat_move_title   — the decision's display name with AP cost
 #                           appended dynamically from the story var.
 #                           Per-move loc holds just the name (e.g.,
 #                           "Strike"); the " (N)" suffix is rendered
 #                           here. Single source of truth = the
 #                           AP_COST value in the move's
 #                           POD_init_combat_move block. The "AP"
 #                           word is omitted because the prominent
 #                           AP pip header above the move grid makes
 #                           the unit obvious — every button reading
 #                           "AP" would be visual noise.
 # POD_combat_move_tooltip — calls the dynamic-stat SGUI directly via
 #                           PODCombatMoveEffect. Combat-window buttons
 #                           and combat-log rows consume this loc to
 #                           build their hover/inline tooltips. Does
 #                           NOT compose GetShortDescForPlayer or
 #                           GetCommandDescForPlayer — both used to
 #                           append, both were dropped because the
 #                           auto-resolve loops back into
 #                           PODCombatMoveDesc and renders empty in
 #                           datamodel context.

 # Title format: bold value-color name + bold AP count, matching the
 # DUEL-Refactor styling (`#bold;V Name#! (#bold;V N#!)`). The
 # value-color (#V) tints the text gold so the move name pops against
 # the surrounding stat lines and the AP cost reads as a distinct
 # numeric badge.
 #
 # Two variants. The bare button face uses `POD_combat_move_title`
 # (the short form, just `(N)`) since the prominent AP pip header
 # above the move grid makes the unit obvious — repeating "AP" on
 # every button is visual noise. The hover tooltip uses
 # `POD_combat_move_title_tooltip` (`(N AP)`) because tooltips appear
 # in detached visual contexts without the header nearby, and the
 # explicit unit keeps the cost unambiguous.
 POD_combat_move_title:         "#bold;V [Scope.Var('decision').DecisionType.GetTitleForPlayer]#! (#bold;V [Scope.Var('ap_cost').GetValue|0]#!)"
 POD_combat_move_title_tooltip: "#bold;V [Scope.Var('decision').DecisionType.GetTitleForPlayer]#! (#bold;V [Scope.Var('ap_cost').GetValue|0]#! AP)"
 # Name-only variant — no AP suffix. Used by the compact-card
 # row where the AP cost appears in its own dedicated column on
 # the right, so embedding it in the name would be redundant.
 POD_combat_move_name:          "#bold;V [Scope.Var('decision').DecisionType.GetTitleForPlayer]#!"
 # Tooltip = dynamic stat block + (move_tooltip)
 # a flavor line. Both pieces are macro-driven:
 #   PODCombatMoveEffect — invokes the pod_combat_move_desc SGUI's
 #                         BuildTooltip to render the dynamic stat
 #                         block (resource costs, damage, healing,
 #                         buffs, etc.). AP cost is NOT in this
 #                         block — it's baked into POD_combat_move_title
 #                         and POD_combat_move_inline_tooltip above.
 #   PODCombatMoveFlavor — Localize + Concatenate3 + GetFlagKey,
 #                         building POD_combat_move_<skill_key>_tooltip
 #                         on the fly from the move story's var:skill_key
 #                         flag. The per-move loc keys are emitted by
 #                         the generator with styling baked in (italic
 #                         + weak); empty notes → empty loc value →
 #                         AddLine renders nothing. See
 #                         data_binding/pod_combat_macros.txt.
 #
 # We can't use Decision.GetCommandDescForPlayer (the auto-loc
 # resolver for <id>_tooltip) because it returns empty for hidden
 # decisions — the auto-loc system only fires when the decision is
 # in the player's panel context, not when reached via Var('decision')
 # on a story_cycle. The dynamic Localize lookup bypasses the auto-loc
 # by computing the loc key directly from the move's skill_key flag.
 POD_combat_move_tooltip:    "[PODCombatMoveEffect(Scope.Story.MakeScope)|h][AddLine( PODCombatMoveFlavor(Scope.Story.MakeScope) )]"

 # Combat-log variants of the title / tooltip loc keys. Same content
 # as the originals above, but they read the move story off the LOG
 # ENTRY's `move` variable rather than treating Scope.Story as the
 # move directly. Used by the action column's tooltipwidget in
 # pod_combat_window.gui via blockoverrides on
 # pod_fancy_combat_move_tooltip — the loc keys pulled in by those
 # blockoverrides need to know that in the log datamodel Scope IS the
 # entry, not the move.
 # Same bold + value-color treatment as POD_combat_move_title above —
 # makes the move name pop in the log's Action column against the
 # surrounding result text. Reads through the log entry's `move` var
 # rather than treating Scope.Story as the move directly.
 # Log-row tooltip title — used as the `text_title` blockoverride
 # when hovering a combat-log entry's action widget. Same "show
 # AP in detached tooltips" logic as POD_combat_move_title_tooltip
 # above. The bare action-name text in the log row itself doesn't
 # go through this key; it's rendered inline as raw_text in the
 # log GUI.
 POD_combat_log_move_title:   "#bold;V [Scope.Var('move').Story.MakeScope.Var('decision').DecisionType.GetTitleForPlayer]#! (#bold;V [Scope.Var('move').Story.MakeScope.Var('ap_cost').GetValue|0]#! AP)"
 # Combat-log variant: same shape as POD_combat_move_tooltip but
 # reads the move via the log entry's `move` variable (Scope is the
 # log entry, not the move directly).
 POD_combat_log_move_tooltip: "[PODCombatMoveEffect(Scope.Var('move').Story.MakeScope)|h][AddLine( PODCombatMoveFlavor(Scope.Var('move').Story.MakeScope) )]"

 ##############################
 ###### MOVE INLINE TOOLTIP (customizable_localization body)
 ##############################

 # POD_combat_move_inline_tooltip — the three-section hover card
 # rendered by PODCombatMoveDesc(key). Sections:
 #   1. Title + AP cost in bold outlined text
 #   2. Dynamic stat block via PODCombatMoveEffect (the pod_combat_move_desc
 #      SGUI). Wrapped in |h so its default bullet hides, per the
 #      same formatting dance documented in the DYNAMIC MOVE TOOLTIP
 #      section above.
 #   3. Flavor line from the decision's auto-lookup _tooltip loc
 #      (set per move; empty by default).
 # The $EFFECT_LIST_BULLET$ bookends keep the block centered when
 # consumed by tooltip containers that add their own leading bullet.

 POD_combat_move_inline_tooltip: "#h $EFFECT_LIST_BULLET$#!#V;outline;size:16 #bold [story.MakeScope.Var('decision').DecisionType.GetTitleForPlayer]#! (#bold [story.MakeScope.Var('ap_cost').GetValue|0]#! AP)#!\n[PODCombatMoveEffect(story.MakeScope)|h]\n#h $EFFECT_LIST_BULLET$#!#weak;outline [story.MakeScope.Var('decision').DecisionType.GetShortDescForPlayer]#!"

 ##############################
 ###### DAMAGE TYPE LABELS
 ##############################
 # Labels for the damage_type flag, displayed via GetFlagName.
 # `superficial` and `aggravated` don't collide with any vanilla
 # loc keys. Damage-source labels are inlined in the per-source
 # desc loc to avoid collisions with vanilla flag keys (e.g. fire,
 # silver are used by adventurer_name_sections).
 #
 # Each renders the matching wound-box icon (concept-linked) instead
 # of a word — same visual vocabulary the combat log uses in its
 # result column (see pod_combat_log_result_text_*_aggravated). The
 # move-tooltip damage line is the only consumer of GetFlagName for
 # damage_type, so changes here only affect that path.
 #
 # Concept link goes to PoD's POD_superficial_damage / POD_aggravated_damage
 # cards so hovering the icon explains the wound-track mechanic.

 superficial:  "[Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 aggravated:   "[Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"

 ##############################
 ###### CHARACTER MODIFIERS
 ##############################
 # Loc for pod_combat_duel_active — the state-marker character
 # modifier applied to every combatant during the tactical combat
 # minigame. Visible in the character UI so players (and modders)
 # can see the state; consumed by any system that wants to skip
 # firing events mid-duel via has_character_modifier checks.

 pod_combat_duel_active:      "In Combat"
 pod_combat_duel_active_desc: "This character is currently engaged in tactical combat."

 ##############################
 ###### GAME CONCEPTS — combat minigame stats
 ##############################
 # Hoverable concept cards for combat-specific stats that don't have
 # a matching vanilla CK3 or PoD concept. Wired up via the Morale /
 # Hit / Init / Turn labels in pod_combat_window.gui using
 # [Concept('key','LabelText')] inline markup.

 game_concept_pod_combat_morale:      "Morale"
 game_concept_pod_combat_morale_desc: "A combatant's #bold mental resilience#! during tactical combat — their composure under pressure. Morale starts full at the beginning of each combat and drops as they absorb mental attacks, intimidation, and stress-inducing tactics.\n\nA combatant is #N Knocked Out#! — out of the fight for the remainder of combat — when any of the following happens:\n$TAB$- Morale reaches #N zero#!\n$TAB$- They lose all their [Concept('POD_health_track','Health Track')|E] boxes\n$TAB$- They enter an #N incapacitating state#! — vanilla incapable (severe wound), torpor, wight withering, wraith Shadow dominance, kuei-jin pre-dharma, or zombification\n\nEach point of morale damage also applies [Concept('static_stress','Mental Strain')|E] in real time, so psychological pressure leaves a persistent mark on the mind that carries over past combat's end."

 game_concept_pod_combat_hit_chance:      "Hit Chance"
 game_concept_pod_combat_hit_chance_desc: "Your percentage chance to land an attack on the target. Derived from your [Concept('prowess','Prowess')|E] and modified by:\n\n$TAB$- The target's stance: [Concept('pod_combat_guard','@pod_combat_guard_icon!')] [Concept('pod_combat_dodge','@pod_combat_dodge_icon!')] [Concept('pod_combat_stealth','@pod_combat_stealth_icon!')]\n$TAB$- Tier buffs or debuffs on either combatant\n$TAB$- Skill-specific hit modifiers (some moves bypass dodge, some bypass cover)\n\nHit Chance is clamped between 20% and 95%, so no attack is guaranteed and no attack is hopeless."

 ##############################
 ###### GAME CONCEPTS — combat stances
 ##############################
 # Guard / Dodge / Stealth — the three defensive postures a combatant
 # can adopt via moves. Exposed as concept cards linked from the Hit
 # Chance tooltip via their matching texticons (pod_combat_guard_icon
 # etc., defined in devpod/gui/pod_texticons_combat.gui).

 game_concept_pod_combat_guard:      "Guard"
 game_concept_pod_combat_guard_desc: "A #bold defensive stance#!. A guarding combatant shrugs off light blows — the next attack against them that would normally land is converted into a blocked hit, dealing no [Concept('POD_health_track','Health Track')|E] damage. The guard stance is consumed on the first attack that lands.\n\n#weak Some moves can bypass guard (they hit past the block).#!"

 game_concept_pod_combat_dodge:      "Dodge"
 game_concept_pod_combat_dodge_desc: "An #bold evasive stance#!. A dodging combatant weaves out of the way — the next attack against them auto-misses, regardless of the attacker's [Concept('pod_combat_hit_chance','Hit Chance')|E]. The dodge stance is consumed on the first attack attempt.\n\n#weak Some moves bypass dodge (they ignore the evasion).#!"

 game_concept_pod_combat_stealth:      "Stealth"
 game_concept_pod_combat_stealth_desc: "A #bold hidden stance#!. A stealthed combatant is hard to see and hard to react to:\n$TAB$- Their next attack gets a +30% [Concept('pod_combat_hit_chance','Hit Chance')|E] bonus\n$TAB$- Incoming attacks miss until stealth is broken\n\nStealth breaks the moment the stealthed combatant attacks or is successfully targeted by a move that pierces concealment.\n\n#weak Some moves bypass stealth (they find the target regardless).#!"


 game_concept_pod_combat_initiative:      "Initiative"
 game_concept_pod_combat_initiative_desc: "A roll made at the start of each combat round that determines [Concept('pod_combat_turn_order','Turn Order')|E]. Higher initiative acts earlier.\n\nThe base roll draws from [Concept('prowess','Prowess')|E] and the combatant's splat; perks, traits, and move-applied initiative buffs or debuffs adjust the result. Faster combatants (supernatural speed disciplines, swift traits) can open with their attack before slower foes even react."

 game_concept_pod_combat_turn_order:      "Turn Order"
 game_concept_pod_combat_turn_order_desc: "The resolved order in which combatants act this round, numbered 1 (first) through N (last). Determined by each combatant's [Concept('pod_combat_initiative','Initiative')|E] roll at round start.\n\nTurn order resets and re-rolls every round, so a slow combatant may open one round first if their initiative roll is lucky — or if the fast combatant ate an initiative debuff last turn."


 ##############################
 ###### GAME CONCEPTS — damage types
 ##############################
 # Two distinct things wear the "damage" suffix:
 #
 #   1. Attack pipelines — Physical / Supernatural / Mental. These
 #      describe HOW an attack lands: which defenses it has to clear,
 #      whether it can miss, whether guard blocks it. Titled
 #      "X Attack" rather than "X Damage" because they're the
 #      delivery method, not the wound flavor.
 #   2. Damage flavors — Fire / Cold / Lightning / Sun / Silver /
 #      Gold / Holy / Balefire. These describe WHAT the wound is.
 #
 # Player-facing tone: outcomes the player will see in combat (auto-
 # hit, guard block, aggravated wound, double damage), not the names
 # of internal variables, triggers, or death-reasons. Splat names
 # (bushi, setite, mokole, etc.) are kept because the player meets
 # them as traits in PoD; "fera" and similar broad labels stand in
 # for the underlying trait checks.

 # ── Elemental damage flavors ──

 game_concept_pod_combat_damage_fire:      "Fire Damage"
 game_concept_pod_combat_damage_fire_desc: "Real, sustained #bold fire#! — torches, incendiary tools, fire-aspected disciplines and gifts, infernalist call-of-flame.\n\n$TAB$- #bold Always lands aggravated.#! Fire wounds don't heal back overnight, regardless of the target.\n$TAB$- #bold Bushi#! (kuei-jin warriors) take #bold double damage#! from fire.\n\n#weak Most supernaturals fear fire by lore; in this combat system the fear translates to the certainty that any wound it lands won't heal cleanly — and bushi feel the bite hardest.#!"

 game_concept_pod_combat_damage_cold:      "Cold Damage"
 game_concept_pod_combat_damage_cold_desc: "Supernatural #bold cold or frost#! — chill winds, frost magic, ice-form disciplines.\n\n$TAB$- Lands superficial unless the move says otherwise.\n$TAB$- No splat takes extra damage from cold; everyone gets the same wound.\n\n#weak Cold attacks tend to ride with supernatural attacks (auto-hit, ignore guard) and pair with hit-debuff or guard-stripping riders — the freezing reach is the angle, not the wound flavor itself.#!"

 game_concept_pod_combat_damage_lightning:      "Lightning Damage"
 game_concept_pod_combat_damage_lightning_desc: "#bold Electrical force#! — storm magic, lightning-aspected gifts and disciplines, weather workings.\n\n$TAB$- #bold Always lands aggravated.#! Like fire, lightning wounds don't heal back fast.\n$TAB$- No splat takes extra damage from it; the auto-aggravation is the entire bite.\n\n#weak lightning typically rides with supernatural attacks (auto-hit, ignore guard); soak still blunts it, but anything that gets through stays.#!"

 game_concept_pod_combat_damage_sun:      "Sunlight Damage"
 game_concept_pod_combat_damage_sun_desc: "#bold Direct sunlight or solar-aspected magic#! — Day Eyes rituals, sun-blessed weapons, dawn exposure.\n\n$TAB$- #bold Lands aggravated against virtually everyone.#! A handful of kuei-jin dharmas and sun-resistant traits can shrug it off as superficial.\n$TAB$- #bold Setites and bushi#! take #bold double damage#! from sunlight.\n\n#weak One of the most punishing damage sources in the system: aggravated by default, doubled on the worst-case targets, and most supernaturals can't avoid the daylight forever.#!"

 game_concept_pod_combat_damage_silver:      "Silver Damage"
 game_concept_pod_combat_damage_silver_desc: "#bold Silver weapons or silver-laced magic#! — silver bullets, silver-edged blades, blessed silver.\n\n$TAB$- #bold Lands aggravated only against silver-weak fera#! — werewolves and most shifter breeds (ananasi, corax, and nuwisha aren't silver-weak; a wyrmflesh artifact also suppresses the weakness). Other splats (vampires, fae, mortals, etc.) take silver as ordinary superficial damage.\n$TAB$- No bonus damage multiplier — the aggravated-only-vs-fera rule is what gives silver its bite.\n\n#weak A silver round that grazes a vampire can cripple a Garou — the difference is purely whether the wound heals back.#!"

 game_concept_pod_combat_damage_gold:      "Gold Damage"
 game_concept_pod_combat_damage_gold_desc: "#bold Gold weapons or gold-laced magic#! — gold-edged blades, gold-coined ammunition.\n\n$TAB$- #bold Lands aggravated only against mokole and corax#!; a wyrmflesh artifact suppresses even that. Other splats — including most fera, the fae, vampires, and mortals — take gold as ordinary superficial damage.\n$TAB$- No bonus damage multiplier.\n\n#weak Gold's bite is narrow: a niche weapon useful against a specific pair of shifter breeds, ordinary otherwise.#!"

 game_concept_pod_combat_damage_holy:      "Holy Damage"
 game_concept_pod_combat_damage_holy_desc: "#bold True Faith, blessed instruments, divine intervention, sanctified magic#! — a priest with True Faith, a paladin's blessed blade, holy water on the cursed.\n\n$TAB$- #bold Lands aggravated against vampires, demons, kuei-jin, and wraiths#! — the supernatural recoil from the divine. Other splats (mages, fera, mortals) take holy damage as ordinary superficial.\n$TAB$- No bonus damage multiplier — the aggravated-vs-the-damned rule is what gives holy its bite.\n\n#weak A combatant fielding holy damage in earnest is either a saint, a fanatic, or carrying a blessed artifact — all three deserve respectful caution, especially against the splats whose flesh remembers the wound.#!"

