 # diverts the buff off the actor (pod_combat_move_targets_ally_trigger); the
 # keys above stay the self wording, including for a self-buff riding an
 # enemy-targeted attack. Rationale in docs/COMBAT_LOG_LANGUAGE_GUIDE.md.
 pod_combat_desc_soak_buff_round_other:  "#medium;outline #P +[Concept('soak_damage','Soak')|E]#! (tier [story.MakeScope.Var('soak_buff_round_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] this round#! $EFFECT_LIST_BULLET$"
