 game_concept_sun_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] against #bold @vampire_icon!$POD_splat_vampire_plural$#!, @abomination_icon!#TOOLTIP:GAME_TRAIT,abomination,[GetNullCharacter] #L;bold Abominations#!#!, and #bold @kueijin_icon!$POD_splat_kueijin_plural$#! - the sun-cursed. A few $POD_splat_kueijin_plural$ [Glossary('Dharmas','podgloss.dharma')] shrug it off as superficial.\n$BULLET_WITH_TAB$Other [splats|E] are #bold immune#!, since sunlight simply doesn't wound the living or the non-cursed.\n$BULLET_WITH_TAB$#bold #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setites#!#! and [GetTrait('bushi').GetName(GetNullCharacter)]#! take #bold double damage#! due to their $glossary_clan_curse$.\n\n#weak The sun spreads God's warmth across His creation. How fitting, then, that those He cursed can no longer receive it.#!"

 game_concept_silver_damage: "Silver Damage"
