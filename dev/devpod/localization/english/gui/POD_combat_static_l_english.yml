 pod_combat.0001.t: "Combat System Overview"
 pod_combat.0001.desc: "Combat is turn-based: you and the enemy spend Action Points on the skills you equipped beforehand, and a fight ends when one side is entirely knocked out. Every blue label in the combat window has a hover tooltip - use them any time you need a refresher.\n\nPick a topic below for the details. You can re-open this menu from the #bold Help#! button at any time."
 pod_combat.0001.a: "» Turns & Targeting"
 pod_combat.0001.b: "» Reading the Fight"
 pod_combat.0001.c: "» Offense, Defense & Effects"
 pod_combat.0001.d: "» Outcomes & Controls"
 pod_combat_help_back: "« Back to topics"
