 ##############################
 ###### DYNAMIC MOVE TOOLTIP (pod_combat_move_desc SGUI)
 ##############################
 # Each line is appended to a move's tooltip iff the matching variable
 # is present on the story_cycle. Interpolation reads from the 'story'
 # scope added by the PODCombatMoveDesc macro.
 #
 # FORMATTING TRICK (copied from DUEL-Refactor):
 #   The macro wraps the whole SGUI output in |h — setting default color
 #   to transparent. This hides the bullet points that custom_tooltip
 #   always prepends. To make the ACTUAL text visible, each loc entry
 #   must start with #medium;outline (or any explicit color format) which
 #   overrides the transparent default. Each entry ends with
 #   $EFFECT_LIST_BULLET$ — a second invisible bullet that keeps the
 #   text centered in the tooltip box.
 #
 # If you drop the #medium;outline prefix, only the interpolated values
 # render (labels and punctuation become transparent).

 # Capability callouts — short flag-style lines describing how the
 # move's contact resolution differs from the default Physical pipeline.
 # Each one fires when the corresponding capability flag is ABSENT on
 # the move story (the runtime contact resolver in pod_combat_effects.txt
 # reads has_variable on the same flags). Surfaces concrete behavioral
 # descriptions — "Always hits", "Bypasses Guard", "Hits spirits" —
 # rather than a coarse Physical / Supernatural / Mental category tag,
 # because those three behaviors are what the move actually does at
 # runtime.
 #
 # Concept-linked terms (Guard, Dodge, Stealth) hover-pop the matching
 # concept card. "Always hits" and "Hits spirits" are bare phrases —
 # there's no single concept card that captures "the move skipped its
 # hit roll" or "the move ignores incorporeality".
 pod_combat_desc_always_hits:   "#medium;outline [Concept('pod_combat_hit_chance','Always hits')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_undodgeable:   "#medium;outline Undodgeable — bypasses [Concept('pod_combat_dodge','Dodge')|E] and [Concept('pod_combat_stealth','Stealth')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hits_spirits:  "#medium;outline Affects incorporeal spirits#! $EFFECT_LIST_BULLET$"
 # Combined cost line — one bullet listing every resource the move
 # spends or adds. The SGUI dispatches `pod_combat_desc_costs` once
 # whenever ANY cost variable is set; the dispatcher concatenates
 # five PODCombatXxxCostInline customizable_localization calls
 # (defined in 00_POD_combat_custom_loc.txt). Each customizable
 # returns either its component (a leading-space-prefixed
 # "[icon] VALUE word" fragment) or vanilla `blank_line` ("").
 #
 # Why customizable_localization rather than inline SelectLocalization:
 # the data-binding parser treats `#` as a comment marker and
 # rejects nested `[X]` substitutions when they appear inside a
 # SelectLocalization function-argument string, so any branch
 # that needed `#bold` or a value-substitution failed at parse
 # time. Routing each branch through a customizable that resolves
 # a separate loc-file key sidesteps the limit because
 # `#bold`/`[Var]` live in a normal loc string, not as a function
 # argument.
 #
 # Component loc strings expect to be embedded inside the
 # dispatcher's `#medium;outline ... #!` wrapper, so they DON'T
 # open their own outer color and DON'T trail $EFFECT_LIST_BULLET$.
 # Format opens within each component (`#bold`, `#V`) are paired
 # with `#!` closes so the format stack stays balanced when
 # components compose.
 #
 # Each component starts with a single space so the prefix
 # "Costs:" has no trailing space and the first set component
 # supplies the separating space; subsequent components stack
 # their own leading space, producing "Costs: 2 vitae 5 gold 3 piety"
 # without comma-orphan artifacts when only some costs are set.
 #
 # Energy is splat-aware. PoD stores nominal costs on a 0–10 "mana
 # bar" scale and each splat has a splat_energy_multiplier that
 # maps that to its own cap (vampires 0–5 multiplier 0.5 → nominal
 # 2 shows as "1 blood"; willpower 0–100 multiplier 10 → nominal 2
 # shows as "20 willpower"). PODEnergySplatIcon /
 # PODEnergySplatWord resolve to the actor's resource icon and
 # label. Execution routes willpower costs through
 # POD_static_stress_gain so display and mechanic match exactly.
 #
 # Stress is a SIDE-EFFECT cost (the actor gains static stress on
 # use). The @stress_icon! token disambiguates it from spent
 # currencies visually, so the line reads "[icon] N stress" the
 # same as gold/piety/prestige rather than needing a "+" prefix.
 #
 # Currency icons follow CK3's `@<resource>_icon!` inline syntax —
 # @gold_icon! / @piety_icon! / @prestige_icon! / @stress_icon!.
 # Energy stays splat-driven via PODEnergySplatIcon (resolves to
 # @hunger_icon! / @gnosis_icon! / @stress_loss_icon! / etc.).
 pod_combat_costline_energy:       " [GetPlayer.Custom('PODEnergySplatIcon')]#bold [Multiply_CFixedPoint( ROOT.Var('energy_cost').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! #V [GetPlayer.Custom('PODEnergySplatWord')]#!"
 pod_combat_costline_gold:         " @gold_icon!#bold [ROOT.Var('gold_cost').GetValue|V0]#! gold"
 pod_combat_costline_piety:        " @piety_icon!#bold [ROOT.Var('piety_cost').GetValue|V0]#! piety"
 pod_combat_costline_prestige:     " @prestige_icon!#bold [ROOT.Var('prestige_cost').GetValue|V0]#! prestige"
 pod_combat_costline_stress:       " @stress_icon!#bold [ROOT.Var('stress_cost').GetValue|V0]#! stress"
 pod_combat_desc_costs:            "#medium;outline Costs:[story.Custom('PODCombatEnergyCostInline')][story.Custom('PODCombatGoldCostInline')][story.Custom('PODCombatPietyCostInline')][story.Custom('PODCombatPrestigeCostInline')][story.Custom('PODCombatStressCostInline')]#! $EFFECT_LIST_BULLET$"

 # HP damage line — one loc entry per damage_source plus a single
 # `_basic` fallback. The SGUI picks the elemental variant when
 # damage_source is set on the move; `_basic` renders when there's
 # no damage_source.
 #
 # Format: "Deal #VAL [classification-icon] [Elemental] Damage"
 #   classification-icon — `[damage_type.GetFlagName]` resolves to
 #     a wound-box icon (superficial = @health_track_damage_icon,
 #     aggravated = @health_track_aggravated_damage_icon) wrapped in
 #     a concept link. See the loc keys further down. Always set on
 #     hp_damage moves: POD_combat_move_set_hp_damage defaults to
 #     flag:superficial, POD_combat_move_set_damage_type_aggravated
 #     overrides. Same visual vocabulary as the combat-log result
 #     column.
 #   Elemental — capitalised flavor word (Fire / Cold / Lightning /
 #     Sunlight / Silver / Gold / Holy / Balefire) coloured to evoke
 #     the element and wrapped in a [Concept('key','Word')] call so
 #     it remains a real concept link (tooltip + encyclopedia jump).
 #     `|E` is intentionally omitted on the Concept call so the
 #     surrounding `#color:{...}` frame's tint wins instead of the
 #     default concept-blue link styling — pattern lifted from PoD's
 #     own `#POD_gamerule` loc. No underline is applied; the colour
 #     itself differentiates these from plain prose. Absent for the
 #     `_basic` fallback variant.
 #
 # No leading texticon: the colored elemental word (and the wound-box
 # classification icon) carry the at-a-glance scan. The `_basic`
 # fallback has no flavor word at all — the wound-box icon is
 # sufficient to mark it as HP damage.
 # Combat-log result column still uses the per-element icons via
 # PODCombatDamageSourceMarker; that path is independent of these
 # tooltip strings.
 #
 # Elemental colour palette (kept here so future tuning is local):
 #   Fire      {1.00, 0.55, 0.20}  bright orange
 #   Cold      {0.55, 0.85, 1.00}  sky blue
 #   Lightning {1.00, 0.95, 0.35}  vivid yellow
 #   Sunlight  {1.00, 0.92, 0.50}  pale warm gold
 #   Silver    {0.85, 0.85, 0.95}  pale silver
 #   Gold      {1.00, 0.75, 0.20}  rich gold
 #   Holy      {1.00, 0.95, 0.65}  cream-white
 #   Balefire  {0.55, 0.95, 0.40}  toxic green
 # Basic damage line — used by every move that doesn't carry a
 # damage_source flag. Pipeline shape (physical / supernatural / mental)
 # affects the runtime resolution but is intentionally NOT shown in the
 # tooltip — the move's name and category already convey the flavor.
 # Players see "Deal X type Damage" regardless of pipeline. The
 # elemental variants below add a colored source word ("Fire", "Cold",
 # etc.) before "Damage" because those carry a real splat-weakness
