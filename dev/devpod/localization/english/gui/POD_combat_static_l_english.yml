 ##############################
 ###### GAME CONCEPTS — combat minigame stats
 ##############################
 # Hoverable concept cards for combat-specific stats that don't have
 # a matching vanilla CK3 or PoD concept. Wired up via the Morale /
 # Hit / Init / Turn labels in pod_combat_window.gui using
 # [Concept('key','LabelText')] inline markup.

 game_concept_pod_combat_morale:      "Morale"
 game_concept_pod_combat_morale_desc: "A combatant's #bold mental resilience#! during tactical combat. Morale starts full at the beginning of each combat and drops as they absorb mental attacks, intimidation, and stress-inducing tactics.\n\nA combatant is #N Knocked Out#! (out of the fight for the remainder of combat) when any of the following happens:\n$TAB$- Morale reaches #N zero#!\n$TAB$- They lose all their [Concept('POD_health_track','Health Track')|E] boxes\n$TAB$- They enter an #N incapacitating state#! — vanilla incapable (severe wound), torpor, wight withering, wraith Shadow dominance, kuei-jin pre-dharma, or zombification\n\nWhen a combatant falls, every surviving member of their team loses #N 2#! morale from the shock. It can leave a team rattled, but the shock alone never breaks anyone outright.\n\nEach point of morale damage also applies [Concept('static_stress','Mental Strain')|E] in real time, so psychological pressure leaves a persistent mark on the mind that carries over past combat's end."

 game_concept_pod_combat_hit_chance:      "Hit Chance"
 game_concept_pod_combat_hit_chance_desc: "Your percentage chance to land an attack on the target. Derived from your [Concept('prowess','Prowess')|E] and modified by:\n\n$TAB$- The target's stance: [Concept('pod_combat_guard','@pod_combat_guard_icon!')] [Concept('pod_combat_dodge','@pod_combat_dodge_icon!')] [Concept('pod_combat_stealth','@pod_combat_stealth_icon!')]\n$TAB$- Tier buffs or debuffs on either combatant\n$TAB$- Skill-specific hit modifiers (some moves bypass dodge, some bypass cover)\n\nHit Chance is clamped between 20% and 95%, so no attack is guaranteed and no attack is hopeless."

 ##############################
 ###### GAME CONCEPTS — combat stances
 ##############################
 # Guard / Dodge / Stealth — the three defensive postures a combatant
 # can adopt via moves. Exposed as concept cards linked from the Hit
 # Chance tooltip via their matching texticons.

 game_concept_pod_combat_guard:      "Guard"
 game_concept_pod_combat_guard_desc: "A #bold defensive stance#!. A guarding combatant shrugs off light blows — the next attack against them that would normally land is converted into a blocked hit, dealing no [Concept('POD_health_track','Health Track')|E] damage. The guard stance is consumed on the first attack that lands.\n\n#weak Some moves can bypass guard (they hit past the block).#!"

 game_concept_pod_combat_dodge:      "Dodge"
 game_concept_pod_combat_dodge_desc: "An #bold evasive stance#!. A dodging combatant weaves out of the way — the next attack against them auto-misses, regardless of the attacker's [Concept('pod_combat_hit_chance','Hit Chance')|E]. The dodge stance is consumed on the first attack attempt.\n\n#weak Some moves bypass dodge (they ignore the evasion).#!"

 game_concept_pod_combat_stealth:      "Stealth"
 game_concept_pod_combat_stealth_desc: "A #bold hidden stance#!. A stealthed combatant is hard to see and hard to react to:\n$TAB$- Their next attack gets a +30% [Concept('pod_combat_hit_chance','Hit Chance')|E] bonus\n$TAB$- Incoming attacks miss until stealth is broken\n\nStealth breaks the moment the stealthed combatant attacks or is successfully targeted by a move that pierces concealment.\n\n#weak Some moves bypass stealth (they find the target regardless).#!"


 game_concept_pod_combat_initiative:      "Initiative"
 game_concept_pod_combat_initiative_desc: "A roll made at the start of each combat round that determines [Concept('pod_combat_turn_order','Turn Order')|E]. Higher initiative acts earlier.\n\nThe base roll draws from [Concept('prowess','Prowess')|E] and the combatant's splat; perks, traits, and move-applied initiative buffs or debuffs adjust the result. Faster combatants (supernatural speed disciplines, swift traits) can open with their attack before slower foes even react."

 game_concept_pod_combat_turn_order:      "Turn Order"
 game_concept_pod_combat_turn_order_desc: "The resolved order in which combatants act this round, numbered 1 (first) through N (last). Determined by each combatant's [Concept('pod_combat_initiative','Initiative')|E] roll at round start.\n\nTurn order resets and re-rolls every round, so a slow combatant may open one round first if their initiative roll is lucky — or if the fast combatant ate an initiative debuff last turn.\n\nIn fights of three or more, the round's order is laid out as a strip of portraits across the top of the combat window — the current actor is highlighted, and portraits dim once they have acted or fallen. Combatants who join mid-fight enter the order at the next round."


 ##############################
 ###### GAME CONCEPTS — damage types
 ##############################
 # Two distinct things wear the "damage" suffix:
 #
 #   1. Attack pipelines — Physical / Supernatural / Mental. These
 #      describe HOW an attack lands: which defenses it has to clear,
 #      whether it can miss, whether guard blocks it. Titled
 #      "X Attack" rather than "X Damage" because they're the
 #      delivery method, not the wound flavor.
 #   2. Damage flavors — Fire / Cold / Lightning / Sun / Silver /
 #      Gold / Holy / Balefire. These describe WHAT the wound is.
 #
 # Player-facing tone: outcomes the player will see in combat (auto-
 # hit, guard block, aggravated wound, double damage), not the names
 # of internal variables, triggers, or death-reasons. Splat names
 # (bushi, setite, mokole, etc.) are kept because the player meets
 # them as traits in PoD; "fera" and similar broad labels stand in
 # for the underlying trait checks.

 # ── Elemental damage flavors ──

 game_concept_pod_combat_damage_fire:      "Fire Damage"
 game_concept_pod_combat_damage_fire_desc: "Real, sustained #bold fire#! — torches, incendiary tools, fire-aspected disciplines and gifts, infernalist call-of-flame.\n\n$TAB$- #bold Always lands aggravated.#! Fire wounds don't heal back overnight, regardless of the target.\n$TAB$- #bold Bushi#! (kuei-jin warriors) take #bold double damage#! from fire.\n\n#weak Most supernaturals fear fire by lore; in this combat system the fear translates to the certainty that any wound it lands won't heal cleanly — and bushi feel the bite hardest.#!"

 game_concept_pod_combat_damage_cold:      "Cold Damage"
 game_concept_pod_combat_damage_cold_desc: "Supernatural #bold cold or frost#! — chill winds, frost magic, ice-form disciplines.\n\n$TAB$- Lands superficial unless the move says otherwise.\n$TAB$- No splat takes extra damage from cold; everyone gets the same wound.\n\n#weak Cold attacks tend to ride with supernatural attacks (auto-hit, ignore guard) and pair with hit-debuff or guard-stripping riders — the freezing reach is the angle, not the wound flavor itself.#!"

 game_concept_pod_combat_damage_lightning:      "Lightning Damage"
 game_concept_pod_combat_damage_lightning_desc: "#bold Electrical force#! — storm magic, lightning-aspected gifts and disciplines, weather workings.\n\n$TAB$- #bold Always lands aggravated.#! Like fire, lightning wounds don't heal back fast.\n$TAB$- No splat takes extra damage from it; the auto-aggravation is the entire bite.\n\n#weak lightning typically rides with supernatural attacks (auto-hit, ignore guard); soak still blunts it, but anything that gets through stays.#!"

 game_concept_pod_combat_damage_sun:      "Sunlight Damage"
 game_concept_pod_combat_damage_sun_desc: "#bold Direct sunlight or solar-aspected magic#! — Day Eyes rituals, sun-blessed weapons, dawn exposure.\n\n$TAB$- #bold Lands aggravated against virtually everyone.#! A handful of kuei-jin dharmas and sun-resistant traits can shrug it off as superficial.\n$TAB$- #bold Setites and bushi#! take #bold double damage#! from sunlight.\n\n#weak One of the most punishing damage sources in the system: aggravated by default, doubled on the worst-case targets, and most supernaturals can't avoid the daylight forever.#!"

 game_concept_pod_combat_damage_silver:      "Silver Damage"
 game_concept_pod_combat_damage_silver_desc: "#bold Silver weapons or silver-laced magic#! — silver bullets, silver-edged blades, blessed silver.\n\n$TAB$- #bold Lands aggravated only against silver-weak fera#! — werewolves and most shifter breeds (ananasi, corax, and nuwisha aren't silver-weak; a wyrmflesh artifact also suppresses the weakness). Other splats (vampires, fae, mortals, etc.) take silver as ordinary superficial damage.\n$TAB$- No bonus damage multiplier — the aggravated-only-vs-fera rule is what gives silver its bite.\n\n#weak A silver round that grazes a vampire can cripple a Garou — the difference is purely whether the wound heals back.#!"

 game_concept_pod_combat_damage_gold:      "Gold Damage"
 game_concept_pod_combat_damage_gold_desc: "#bold Gold weapons or gold-laced magic#! — gold-edged blades, gold-coined ammunition.\n\n$TAB$- #bold Lands aggravated only against mokole and corax#!; a wyrmflesh artifact suppresses even that. Other splats — including most fera, the fae, vampires, and mortals — take gold as ordinary superficial damage.\n$TAB$- No bonus damage multiplier.\n\n#weak Gold's bite is narrow: a niche weapon useful against a specific pair of shifter breeds, ordinary otherwise.#!"

 game_concept_pod_combat_damage_holy:      "Holy Damage"
 game_concept_pod_combat_damage_holy_desc: "#bold True Faith, blessed instruments, divine intervention, sanctified magic#! — a priest with True Faith, a paladin's blessed blade, holy water on the cursed.\n\n$TAB$- #bold Lands aggravated against vampires, demons, kuei-jin, and wraiths#! — the supernatural recoil from the divine. Other splats (mages, fera, mortals) take holy damage as ordinary superficial.\n$TAB$- No bonus damage multiplier — the aggravated-vs-the-damned rule is what gives holy its bite.\n\n#weak A combatant fielding holy damage in earnest is either a saint, a fanatic, or carrying a blessed artifact — all three deserve respectful caution, especially against the splats whose flesh remembers the wound.#!"

 # ── Concept aliases ──
 # Each alias declared in `alias = { ... }` on a concept in
 # pod_combat_concepts.txt needs its own `game_concept_<alias>` loc
 # title. CK3 doesn't auto-resolve aliases to the parent's title key;
 # if the alias loc is missing, the engine logs
 #   "Key is missing localization: game_concept_<alias>"
 # at startup. Each alias title here mirrors the parent so the
 # rendered concept-link reads identically whichever name is used in
 # script. The descriptions still come from the parent concept (CK3
 # uses the alias's parent for the hover card body).

 game_concept_pod_combat_composure:          "Morale"
 game_concept_pod_combat_hit:                "Hit Chance"
 game_concept_pod_combat_accuracy:           "Hit Chance"
 game_concept_pod_combat_init:               "Initiative"
 game_concept_pod_combat_turn:               "Turn Order"
 game_concept_pod_combat_guarding:           "Guard"
 game_concept_pod_combat_guarded:            "Guard"
 game_concept_pod_combat_dodging:            "Dodge"
 game_concept_pod_combat_dodged:             "Dodge"
 game_concept_pod_combat_stealthed:          "Stealth"
 game_concept_pod_combat_hidden:             "Stealth"
 game_concept_pod_combat_aggravated:         "Aggravated Damage"
 game_concept_pod_combat_superficial:        "Superficial Damage"
 game_concept_pod_combat_fire_damage:        "Fire Damage"
 game_concept_pod_combat_cold_damage:        "Cold Damage"
 game_concept_pod_combat_lightning_damage:   "Lightning Damage"
 game_concept_pod_combat_sunlight:           "Sunlight Damage"
 game_concept_pod_combat_sunlight_damage:    "Sunlight Damage"
 game_concept_pod_combat_sun_damage:         "Sunlight Damage"
 game_concept_pod_combat_silver_damage:      "Silver Damage"
 game_concept_pod_combat_gold_damage:        "Gold Damage"
 game_concept_pod_combat_holy_damage:        "Holy Damage"


 ##############################
 ###### COMBAT LOG — COLUMN HEADERS + EMPTY STATE
 ##############################
 # Empty-state placeholder shown when no entries have been logged yet.
 # The redesigned combat log encodes structure visually (gold/red side
 # bar + actor-name tint + right-anchored result) rather than via
 # column headers, so the pod_combat_log_header_* keys are gone — the
 # row layout itself communicates what each segment is.
 pod_combat_log_empty:         "#italic Awaiting your command.#!"


 ##############################
 ###### COMBAT LOG — RESULT TEXT
 ##############################
 # Three-axis result dispatch via PODCombatLogResultText on the entry's
 # outcome / attack_result vars (COMBAT_REFERENCE.info §4). Amount fields
 # (damage / heal_amount / morale_*_amount / retal_damage) are captured
 # by push_log from parallel pod_combat_last_*_amount workspace vars.
 # Riders are separate text_singles in pod_combat_window.gui (CK3 can't
 # propagate scopes through nested Custom() calls).
 pod_combat_log_result_text_hp_damage:               "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_result_text_hp_damage_aggravated:    "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_result_text_guard_blocked:           "#bold Blocked#!"
 pod_combat_log_result_text_soaked:                  "#bold Soaked#!"
 pod_combat_log_result_text_missed:                  "#bold Missed#!"
 pod_combat_log_result_text_dodged:                  "#bold Dodged#!"
 pod_combat_log_result_text_stealthed:               "#bold Stealthed#!"
 # Retaliation rider — emitted by PODCombatLogRetalRider as a separate
 # result-column text_single (not a primary outcome) when the row's
 # entry.var:retal_fired was set during push_log. Clean overlay on the
 # three-axis model: magnitude-first, wound-box resource label, italic
 # "counter" tag; soaked variant drops the magnitude.
 pod_combat_log_retal_rider:            " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic counter#!"
 pod_combat_log_retal_rider_aggravated: " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic counter#!"
 pod_combat_log_retal_rider_soaked:     " #weak;italic counter#! #bold Soaked#!"
 pod_combat_log_retal_rider_morale:     " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [Concept('pod_combat_morale','@stress_icon!')|E] #weak;italic counter#!"
 pod_combat_log_retal_rider_source:     " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [entry.MakeScope.Var('retal_source').GetFlagName] [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic counter#!"
 # Per-source counter riders (colored element concept). Selected by the rider's
 # scope:entry={ var:retal_source = flag:<source> } branches; _source above is the
 # GetFlagName fallback for any source without a damage concept (e.g. balefire).
 pod_combat_log_retal_rider_fire:       " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! $elemmark_fire$ #weak;italic counter#!"
 pod_combat_log_retal_rider_cold:       " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! $elemmark_cold$ #weak;italic counter#!"
 pod_combat_log_retal_rider_lightning:  " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! $elemmark_lightning$ #weak;italic counter#!"
 pod_combat_log_retal_rider_sun:        " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! $elemmark_sun$ #weak;italic counter#!"
 pod_combat_log_retal_rider_silver:     " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! $elemmark_silver$ #weak;italic counter#!"
 pod_combat_log_retal_rider_gold:       " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! $elemmark_gold$ #weak;italic counter#!"
 pod_combat_log_retal_rider_holy:       " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! $elemmark_holy$ #weak;italic counter#!"
 # utility primary renders empty — the buff/stance/tier/AP/retaliate/
 # init riders downstream of this widget already carry the full
 # content of what the move did, so a "Effect applied" lead-in would
 # just repeat boilerplate before the rider ("Effect applied, entered
 # Guard" → "entered Guard"). An audit confirmed every implemented
 # utility move triggers at least one rider — there is no truly no-op
 # move that would render an empty result column without a lead-in.
 # Note the buff dispatcher's riders below switched from a leading ", "
 # to a leading " " specifically to avoid an orphan comma in this case.
 pod_combat_log_result_text_utility:             ""
 pod_combat_log_result_text_morale_damage:       "#bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_result_text_hp_healed:           "#bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_result_text_hp_healed_aggravated: "#bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_result_text_morale_healed:       "#bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_result_text_unknown:       "#weak —#!"

 # System-message rows — pushed by pod_combat_push_system_log_effect
 # at combat-lifecycle bookend points (start / victory / defeat).
 # Em-dash flanking reads as a clear "this isn't an actor action" so the
 # eye doesn't try to parse them as a regular log row. (Square brackets
 # can't appear as literal text — CK3's loc parser treats `[...]` as a
 # data-binding expression and rejects free-form text inside.)
 # Combat-start keeps neutral weight; combat-end uses the polarity-color
 # convention (P green for player victory, N red for defeat) to telegraph
 # the outcome at a glance from the log row alone.
 pod_combat_log_system_combat_started:        "#italic — Combat begins —#!"
 pod_combat_log_system_combat_ended_victory:  "#bold;P — Combat ends · Victory —#!"
 pod_combat_log_system_combat_ended_defeat:   "#bold;N — Combat ends · Defeat —#!"
 # Round transition. Round number pulled off entry.var:round which
 # push_system_log_effect captures from the host's pod_combat_round
 # at push time, so the message persists the correct round even as
 # later actions push more rows. Bold weight makes the transition
 # marker easy to find when scrolling back through a long combat.
 pod_combat_log_system_round_begins:          "#italic — Round #bold [entry.MakeScope.Var('round').GetValue|0]#! begins —#!"
 pod_combat_log_system_unknown:               "#weak —#!"

 # ──────────────────────────────────────────────────────────────────
 # Result-line riders.
 #
 # Each `pod_combat_log_<…>_rider` / `_buff_<…>` key is the loc value
 # consumed by the matching customizable_loc dispatcher. Riders that
 # don't apply resolve to `pod_combat_log_blank` (empty string) so
 # the surrounding text stays clean.
 #
 # Stat reads inside rider strings go through the saved `move` scope:
 # `move.MakeScope.Var('hp_heal').GetValue` etc. (no `scope:` prefix
 # in loc-value reads — that's trigger-only syntax.)
 pod_combat_log_blank:                  ""

 # Numeric riders read the actual rolled amount from the entry's
 # parallel _amount fields (so a capped heal reports what was actually
 # restored). Bodies are BARE — magnitude + resource label only; the
 # " · " separator is GUI-owned (pod_combat_window.gui). Heal rider has
 # an _aggravated variant picked when move.heal_type = aggravated. 
 pod_combat_log_heal_rider:             " #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_heal_rider_aggravated:  " #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_morale_damage_rider:    " #bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_morale_heal_rider:      " #bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"

 # Buff / debuff / status riders. Stance changes use arrow notation
 # (→ Guard / → Dodge / → Stealth / → Retaliate); remove_guard reads
 # "Guard broken" (state EXIT on the target). Polarity sign sits
 # OUTSIDE the concept link so it colors independently. Bodies are
 # BARE; separator GUI-owned.
 pod_combat_log_buff_set_guard:          "→ [Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E]"
 pod_combat_log_buff_dodge:              "→ [Concept('pod_combat_dodge','@pod_combat_dodge_icon!Dodge')|E]"
 pod_combat_log_buff_stealth:            "→ [Concept('pod_combat_stealth','@pod_combat_stealth_icon!Stealth')|E]"
 pod_combat_log_buff_remove_guard:       "[Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E] #weak;italic broken#!"
 # Tier-buff/debuff riders: magnitude-first ("+20% Soak"). Percentage
 # comes from pod_combat_move_<stat>_<dir>_mag_value (pod_combat_values.txt)
 # resolving the move's tier var to the @combat_tier_*_mag constant
 # (10/20/30). Stat-name concept-linked as the resource label.
 pod_combat_log_buff_soak_buff:          " #bold;P +[move.MakeScope.ScriptValue('pod_combat_move_soak_buff_mag_value')|0]%#! [Concept('soak_damage','Soak')|E]"
 pod_combat_log_buff_soak_debuff:        " #bold;N -[move.MakeScope.ScriptValue('pod_combat_move_soak_debuff_mag_value')|0]%#! [Concept('soak_damage','Soak')|E]"
 pod_combat_log_buff_hit_buff:           " #bold;P +[move.MakeScope.ScriptValue('pod_combat_move_hit_buff_mag_value')|0]%#! [Concept('pod_combat_hit_chance','Hit')|E]"
 pod_combat_log_buff_hit_debuff:         " #bold;N -[move.MakeScope.ScriptValue('pod_combat_move_hit_debuff_mag_value')|0]%#! [Concept('pod_combat_hit_chance','Hit')|E]"
 # AP gain/drain read the integer var off the move story (magnitude-first,
 # AP resource label). Retaliate uses arrow notation. initiative_debuff is
 # a bare "-" marker with NO magnitude — the next-round init penalty is a
 # fixed flag, not a tracked amount. ap_drain and initiative_debuff carry
 # "next turn" / "next round" tags.
 pod_combat_log_buff_ap_gain:            " #bold;P +[move.MakeScope.Var('ap_gain').GetValue|0] AP#!"
 pod_combat_log_buff_ap_drain:           " #bold;N -[move.MakeScope.Var('ap_drain').GetValue|0] AP#! #weak;italic next turn#!"
 pod_combat_log_buff_retaliate:          " → #weak;italic Retaliate#!"
 pod_combat_log_seg_retal_armed_morale:  " → #weak;italic Retaliate#!$pod_combat_damage_source_morale$"
 pod_combat_log_seg_retal_armed_agg:     " → #weak;italic Retaliate#! $aggravated$"
 pod_combat_log_seg_retal_armed_fire:    " → #weak;italic Retaliate#! $elemmark_fire$"
 pod_combat_log_seg_retal_armed_cold:    " → #weak;italic Retaliate#! $elemmark_cold$"
 pod_combat_log_seg_retal_armed_lightning: " → #weak;italic Retaliate#! $elemmark_lightning$"
 pod_combat_log_seg_retal_armed_sun:     " → #weak;italic Retaliate#! $elemmark_sun$"
 pod_combat_log_seg_retal_armed_silver:  " → #weak;italic Retaliate#! $elemmark_silver$"
 pod_combat_log_seg_retal_armed_gold:    " → #weak;italic Retaliate#! $elemmark_gold$"
 pod_combat_log_seg_retal_armed_holy:    " → #weak;italic Retaliate#! $elemmark_holy$"
 pod_combat_log_seg_stun:                " #bold;N Stuns#! #weak;italic next turn#!"
 pod_combat_log_seg_recoil:              " #bold;N -[entry.MakeScope.Var('self_damage').GetValue|0]#! $superficial$ #weak;italic recoil#!"
 pod_combat_log_buff_initiative_debuff:  " #bold;N -#![Concept('pod_combat_initiative','Init')|E] #weak;italic next round#!"

 # ──────────────────────────────────────────────────────────────────
 # Damage-source markers (PODCombatDamageSourceMarker) — one Concept-
 # wrapped elemental icon per var:damage_source, leading-space-prefixed
 # so it detaches from the wound-box glyph. Moves with no damage_source
 # route to `_blank` (collapses to nothing). 
 pod_combat_damage_source_fire:         " [Concept('pod_combat_damage_fire','@pod_combat_fire_icon!')]"
 pod_combat_damage_source_cold:         " [Concept('pod_combat_damage_cold','@pod_combat_cold_icon!')]"
 pod_combat_damage_source_lightning:    " [Concept('pod_combat_damage_lightning','@pod_combat_lightning_icon!')]"
 pod_combat_damage_source_sun:          " [Concept('pod_combat_damage_sun','@pod_combat_sun_icon!')]"
 pod_combat_damage_source_silver:       " [Concept('pod_combat_damage_silver','@pod_combat_silver_icon!')]"
 pod_combat_damage_source_gold:         " [Concept('pod_combat_damage_gold','@pod_combat_gold_icon!')]"
 pod_combat_damage_source_holy:         " [Concept('pod_combat_damage_holy','@pod_combat_holy_icon!')]"
 pod_combat_damage_source_balefire:     " [Concept('balefire','@pod_combat_balefire_icon!')]"
 # Morale-typed reaction (retaliate_morale) — not a damage_source, but shares this
 # marker slot so "starting the stance" log rows show the type icon like sources do.
 pod_combat_damage_source_morale:       " [Concept('pod_combat_morale','@stress_icon!')]"
 pod_combat_damage_source_blank:        ""

 # ──────────────────────────────────────────────────────────────────
 # Target column dispatch (PODCombatLogTargetText). Single-target
 # moves render the target's first name; AoE moves render an "AoE
 # Enemies / Allies" label so the column reads at a glance whether
 # the row hit one combatant or a whole side. `_self` covers
 # self-targeted moves where the actor and target columns would
 # otherwise duplicate the same name.
 # ── Combat-log "actor → target" segment ─────────────────────
 # PODCombatLogTargetText resolves to one of these per row,
 # rendering the inline "→ <target>" handoff between the actor
 # name and the action name. Self / no-target / move-less cases
 # collapse to empty (the new log layout drops the "Self" word
 # entirely — an action with no arrow IS self-targeted by
 # implication, freeing visual real estate). Single-target +
 # AoE branches all lead with the same "  →  " separator
 # (two spaces flanking the arrow keeps it visually anchored
 # between the actor and target words).
 # Arrow style: `#F` (flavor = low/dark-gray, NOT italic) instead of
 # `#weak` (low + italic) so the arrow reads as a clean connector
 # glyph rather than an italic word — matches the mockup's neutral
 # `.arrow { color: #6f7280 }` styling. Two spaces around the arrow
 # give it breathing room between actor and target.
 pod_combat_log_target_aoe_enemies: "  #F →#! #bold All enemies#!"
 pod_combat_log_target_aoe_allies:  "  #F →#! #bold All allies#!"
 # Per-target AoE rows: "All enemies (Steve)" / "All allies (Jane)".
 # The AoE marker is in bold so the burst context still stands out; the
 # per-target name sits in dim italic parens beside it so the eye picks
 # up "AoE row + this specific target" in one glance without the name
 # competing with the marker for visual weight.
 pod_combat_log_target_aoe_enemies_per_target: "  #F →#! #bold All enemies#! #weak;italic ([entry.MakeScope.Var('target').GetCharacter.GetFirstNameNoTooltip])#!"
 pod_combat_log_target_aoe_allies_per_target:  "  #F →#! #bold All allies#! #weak;italic ([entry.MakeScope.Var('target').GetCharacter.GetFirstNameNoTooltip])#!"
 pod_combat_log_target_self:        ""
 pod_combat_log_target_single:      "  #F →#! #bold [entry.MakeScope.Var('target').GetCharacter.GetFirstNameNoTooltip]#!"
 pod_combat_log_target_none:        ""

 # ── Compact-card basic-effect lines ──────────────────────────
 # One-line glanceable summary of a move's primary action, used
 # by the skills window's compact pool list (the middle column
 # of each row, between the name and the AP / equipped checkbox).
 # PODCombatMoveBasicEffectInline dispatches on the move's
 # primary effect var; each branch resolves to one of the keys
 # below. Bypass / always-hit / retaliation extras are
 # intentionally absent — the hover tooltip carries the full
 # detail, this is the glanceable summary.
 #
 # Saved-scope reference is bare `story` (not `scope:story`) since
 # loc-file Var reads use the bareword form — the `scope:` prefix
 # is script-side syntax that the loc parser rejects.
 pod_combat_basic_effect_hp_damage:     "#weak Deal#! #bold;N [story.MakeScope.Var('hp_damage').GetValue|0]#! #weak damage#!"
 pod_combat_basic_effect_hp_heal:       "#weak Heal#! #bold;P +[story.MakeScope.Var('hp_heal').GetValue|0]#!"
 pod_combat_basic_effect_morale_damage: "#bold;N -[story.MakeScope.Var('morale_damage').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
