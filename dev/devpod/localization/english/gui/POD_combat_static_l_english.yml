 ##############################
 ###### DYNAMIC MOVE TOOLTIP (pod_combat_move_desc SGUI)
 ##############################
 # Each line is appended to a move's tooltip iff the matching variable
 # is present on the story_cycle. Interpolation reads from the 'story'
 # scope added by the PODCombatMoveDesc macro.
 #
 # FORMATTING TRICK:
 #   The macro wraps the whole SGUI output in |h - setting default color
 #   to transparent. This hides the bullet points that custom_tooltip
 #   always prepends. To make the ACTUAL text visible, each loc entry
 #   must start with #medium;outline (or any explicit color format) which
 #   overrides the transparent default. Each entry ends with
 #   $EFFECT_LIST_BULLET$ - a second invisible bullet that keeps the
 #   text centered in the tooltip box.
 #
 # If you drop the #medium;outline prefix, only the interpolated values
 # render (labels and punctuation become transparent).

 # Capability callouts - short flag-style lines describing how the
 # move's contact resolution differs from the default Physical pipeline.
 # Each one fires when the corresponding capability flag is ABSENT on
 # the move story (the runtime contact resolver in pod_combat_effects.txt
 # reads has_variable on the same flags). Surfaces concrete behavioral
 # descriptions - "Always hits", "Bypasses Guard", "Hits spirits" - 
 # rather than a coarse Physical / Supernatural / Mental category tag,
 # because those three behaviors are what the move actually does at
 # runtime.
 #
 # Concept-linked terms (Guard, Dodge, Stealth) hover-pop the matching
 # concept card. "Always hits" and "Hits spirits" are bare phrases - 
 # there's no single concept card that captures "the move skipped its\n # hit roll" or "the move ignores incorporeality".
 pod_combat_desc_always_hits:   "#medium;outline [Concept('pod_combat_hit_chance','Always hits')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_undodgeable:   "#medium;outline Undodgeable — bypasses [Concept('pod_combat_dodge','Dodge')|E] and [Concept('pod_combat_stealth','Stealth')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hits_spirits:  "#medium;outline Affects incorporeal spirits#! $EFFECT_LIST_BULLET$"
 # Combined cost line: pod_combat_desc_costs dispatches once when any
 # cost var is set, concatenating five PODCombatXxxCostInline fragments
 # (00_POD_combat_custom_loc.txt). Fragments are bare leading-space
 # "[icon] VALUE word" snippets; energy is splat-aware. 
 pod_combat_costline_energy:       " [GetPlayer.Custom('PODEnergySplatIcon')]#bold [Multiply_CFixedPoint( ROOT.Var('energy_cost').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! #V [GetPlayer.Custom('PODEnergySplatWord')]#!"
 pod_combat_costline_gold:         " @gold_icon!#bold [ROOT.Var('gold_cost').GetValue|V0]#! gold"
 pod_combat_costline_piety:        " @piety_icon!#bold [ROOT.Var('piety_cost').GetValue|V0]#! piety"
 pod_combat_costline_prestige:     " @prestige_icon!#bold [ROOT.Var('prestige_cost').GetValue|V0]#! prestige"
 pod_combat_costline_stress:       " @stress_icon!#bold [ROOT.Var('stress_cost').GetValue|V0]#! stress"
 pod_combat_desc_costs:            "#medium;outline Costs:[story.Custom('PODCombatEnergyCostInline')][story.Custom('PODCombatGoldCostInline')][story.Custom('PODCombatPietyCostInline')][story.Custom('PODCombatPrestigeCostInline')][story.Custom('PODCombatStressCostInline')]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_steal_gold:        "#medium;outline Steal #bold [story.MakeScope.Var('steal_gold').GetValue|V0]#! gold from the enemy#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_gain_dread:        "#medium;outline Gain #bold [story.MakeScope.Var('gain_dread').GetValue|V0]#! dread#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_once_per_round:     "#medium;outline Usable once per round#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_once_per_combat:    "#medium;outline Usable once per combat#! $EFFECT_LIST_BULLET$"

 # HP damage line - one loc entry per elemental damage class plus a `_basic`
 # fallback. The SGUI dispatches every elemental move to its per-element key,
 # so _basic's GetFlagName only ever sees superficial/aggravated (bare element
 # keys like `fire` would collide with vanilla flag loc). Always-aggravated
 # elements (fire/balefire) show the aggravated box; conditional
 # elements show no box - the colored concept word carries the per-splat
 # behavior (PoD core decides aggravated-ness per target). `|E` omitted on the
 # Concept call so the #color frame wins over concept-blue. Pipeline
 # shape is NOT branched - runtime sees capability flags, not attack_type.
 pod_combat_desc_hp_damage_basic:        "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_fire:         "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{1.00,0.55,0.20} [Concept('pod_combat_damage_fire','Fire')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_cold:         "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{0.55,0.85,1.00} [Concept('pod_combat_damage_cold','Cold')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_lightning:    "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{1.00,0.95,0.35} [Concept('pod_combat_damage_lightning','Lightning')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_sun:          "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{1.00,0.92,0.50} [Concept('pod_combat_damage_sun','Sunlight')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_silver:       "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{0.85,0.85,0.95} [Concept('pod_combat_damage_silver','Silver')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_gold:         "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{1.00,0.75,0.20} [Concept('pod_combat_damage_gold','Gold')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_holy:         "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{1.00,0.95,0.65} [Concept('pod_combat_damage_holy','Holy')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_balefire:     "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{0.55,0.95,0.40} [Concept('balefire','Balefire')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_poison:    "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{0.55,0.80,0.30} [Concept('pod_combat_damage_poison','Poison')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_cold_iron:    "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{0.65,0.70,0.78} [Concept('pod_combat_damage_cold_iron','Cold Iron')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 # Morale damage - same shape as the hp damage line minus the
 # wound-box classification icon (morale damage doesn't book on the
 # health track). "Morale" is concept-linked via |E so it picks up
 # the standard light-blue concept-link styling that the AP-cost
 # pipeline labels use, matching the result-column treatment in
 # pod_combat_log_result_text_morale_damage / pod_combat_log_morale_damage_rider.
 pod_combat_desc_morale_damage:     "#medium;outline #N Deal#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! [Concept('pod_combat_morale','Morale')|E] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage:       "#medium;outline Take #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! self-damage#! $EFFECT_LIST_BULLET$"
 # Heal line - uses the same wound-box icon vocabulary as the
 # damage line. heal_type (flag:superficial / flag:aggravated) is
 # always set by POD_combat_move_set_hp_heal, so GetFlagName
 # reliably returns the box-icon loc value defined under DAMAGE
 # TYPE LABELS below. Mirrors how the result column shows healing:
 # `+N [box]` is identical visual grammar.
 pod_combat_desc_hp_heal:           "#medium;outline #P Restore#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] to [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 # Drain variant - replaces the standard heal line for moves with the
 # `drain` flag (Bite, Brutal Feed, Soul Drain, etc.). Communicates two
 # things that the plain heal line doesn't: (a) the heal is thematically
 # drained from the target, not self-regen, and (b) the heal only fires
 # when the attack actually inflicts damage.
 pod_combat_desc_drain:             "#medium;outline #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName]#! from target on hit#! $EFFECT_LIST_BULLET$"
 # Combined damage+drain variants - used when a move has both hp_damage
 # and the drain flag (vampiric bites, soul-feasts, etc.). Inlines the
 # drain readout onto the same tooltip line as the damage so the player
 # sees a single "Deal X type Damage, Drain Y on hit" line instead of
 # two separate bullets. The standalone pod_combat_desc_drain key above
 # only fires when drain is set WITHOUT hp_damage (a defensive orphan
 # path that doesn't currently apply to any move).
 pod_combat_desc_hp_damage_basic_drain:        "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] on hit#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_fire_drain:         "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{1.00,0.55,0.20} [Concept('pod_combat_damage_fire','Fire')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] on hit#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_cold_drain:         "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{0.55,0.85,1.00} [Concept('pod_combat_damage_cold','Cold')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] on hit#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_lightning_drain:    "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{1.00,0.95,0.35} [Concept('pod_combat_damage_lightning','Lightning')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] on hit#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_sun_drain:          "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{1.00,0.92,0.50} [Concept('pod_combat_damage_sun','Sunlight')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] on hit#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_silver_drain:       "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! #color:{0.85,0.85,0.95} [Concept('pod_combat_damage_silver','Silver')]#! #N Damage#! to [story.MakeScope.Var('targeting').GetFlagName], #P Drain#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] on hit#! $EFFECT_LIST_BULLET$"
