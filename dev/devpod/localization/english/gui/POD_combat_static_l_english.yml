 ##############################
 ###### COMBAT LOG — RESULT TEXT
 ##############################
 # 13 result variants (rcodes 0-12) + AoE intercept, dispatched by the
 # PODCombatLogResultText customizable_localization on the entry's
 # result_code. Amount interpolation pulls from a per-rcode field on
 # the entry:
 #   damage              → rcodes 0 / 6 / 7 (HP damage rolled amount)
 #   heal_amount         → rcode 10 (HP heal restored amount)
 #   morale_damage_amount → rcode 9
 #   morale_heal_amount  → rcode 11
 # All four fields are captured by pod_combat_push_log_effect from
 # parallel `pod_combat_last_*_amount` workspace vars set by the
 # damage / heal pipelines.
 #
 # Riders (damage-source icon, heal rider, morale-damage rider,
 # morale-heal rider, buff rider) are NOT embedded in these loc
 # values — saved scopes doesn't seem propagate through nested
 # [GetPlayer.Custom('SubName')], so the riders are invoked
 # as separate text_singles in the result-column hbox in
 # pod_combat_window.gui, each with its own AddScope chain. Each
 # rider's customizable_loc dispatches on scope:move / scope:entry /
 # scope:rcode and emits either a styled snippet or empty. The
 # standalone aggravated-damage marker was retired — the wound-box
 # icon at the end of the rcode-0/6/7/10 lines below now serves both
 # roles (track classification + aggravated-vs-superficial).
 #
 # rcode 12 is the stealth-triggered auto-miss, distinct from rcode 5
 # (dodged) so the loc line links to the Stealth concept instead of
 # Dodge — same mechanic, different cause, different concept card.

 # Aesthetic conventions (lifted from DUEL-Refactor + PoD's vanilla
 # damage strings):
 #   * Damage amounts:   #N (red) bold + explicit `-` prefix
 #   * Heal amounts:     #P (green) bold + explicit `+` prefix
 #   * HP track:         wound-box icon (neutral or red based on
 #                       superficial vs aggravated) wrapped in a
 #                       concept link so hover pops PoD's
 #                       Superficial / Aggravated Damage card
 #   * Morale:           "Morale" word concept-linked
 #   * Fail outcomes:    stance/concept icon + label where one fits
 #                       (Blocked → Guard icon, Dodged → Dodge icon,
 #                       Stealthed → Stealth icon), dimmed italic
 #                       when no icon fits (Missed, Countered)
 #   * Retaliation:      primary line shows our attack's damage; the
 #                       retaliation/soak fact rides as a dimmed
 #                       italic suffix
 # Net result: the column scans red-for-damage / green-for-heal /
 # blue-for-stat-label at a glance, and only the salient amount is
 # bolded — the unit label and metadata stay quiet.

 # HP-track outcomes (rcodes 0/6/7/10) end in a wound-box icon
 # rather than the "HP" word — the box itself signals which track
 # the hit booked onto. Superficial = neutral box, aggravated = red
 # box. The dispatcher splits on damage_type / heal_type to pick the
 # right variant; bare-key is the superficial default, _aggravated is
 # the aggravated branch. Each box is concept-link-wrapped so hover
 # pops PoD's Superficial / Aggravated Damage card.
 pod_combat_log_result_text_0:             "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_result_text_0_aggravated:  "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_result_text_1:             "[Concept('pod_combat_guard','@pod_combat_guard_icon!Blocked')|E]"
 pod_combat_log_result_text_2:             "[Concept('soak_damage','Soaked')|E]"
 pod_combat_log_result_text_3:             "#weak;italic Missed#!"
 pod_combat_log_result_text_4:             "#weak;italic Countered#!"
 pod_combat_log_result_text_5:             "[Concept('pod_combat_dodge','@pod_combat_dodge_icon!Dodged')|E]"
 pod_combat_log_result_text_12:            "[Concept('pod_combat_stealth','@pod_combat_stealth_icon!Stealthed')|E]"
 pod_combat_log_result_text_6:             "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic retaliated#!"
 pod_combat_log_result_text_6_aggravated:  "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic retaliated#!"
 pod_combat_log_result_text_7:             "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic counter soaked#!"
 pod_combat_log_result_text_7_aggravated:  "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic counter soaked#!"
 pod_combat_log_result_text_8:             "#weak;italic Applied#!"
 pod_combat_log_result_text_9:             "#bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_result_text_10:            "#bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_result_text_10_aggravated: "#bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_result_text_11:            "#bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_result_text_unknown:       "#weak —#!"
 # AoE damage rows. Read move.var:hp_damage rather than
 # entry.var:damage because per-target damage gets overwritten in
 # the AoE iteration loop — entry.var:damage is just the LAST
 # target's resolved value, often 0. The static hp_damage on the
 # move story is the design intent of the strike, so the row
 # consistently surfaces "this AoE was meant to deal X" regardless
 # of how the per-target rolls shook out. Suffix "AoE" marker is
 # italicised + dimmer to read as flavour rather than another stat.
 #
 # Saved-scope names appear bare inside loc strings (`move`, not
 # `scope:move`); the `scope:` prefix is script-side syntax and
 # the loc data binder rejects it as an unknown type.
 pod_combat_log_result_text_aoe:           "#bold;N -[move.MakeScope.Var('hp_damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic AoE#!"
 pod_combat_log_result_text_aoe_aggravated: "#bold;N -[move.MakeScope.Var('hp_damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic AoE#!"
 # Fallback for AoE moves with no hp_damage (pure morale / utility
 # team-target moves). Should be rare since most team-target moves
 # carry hp_damage.
 pod_combat_log_result_text_aoe_zero:      "#weak;italic AoE applied#!"

 # ──────────────────────────────────────────────────────────────────
 # Result-line riders.
 #
 # Each `pod_combat_log_<…>_rider` / `_buff_<…>` key is the loc value
 # consumed by the matching customizable_loc dispatcher. Riders that
 # don't apply resolve to `pod_combat_log_blank` (empty string) so
 # the surrounding text stays clean.
 #
 # Stat reads inside rider strings go through the saved `move` scope:
 # `move.MakeScope.Var('hp_heal').GetValue` etc. (no `scope:` prefix
 # in loc-value reads — that's trigger-only syntax.)
 pod_combat_log_blank:                  ""

 # Riders read the actual rolled amount from the entry's parallel
 # _amount fields (set by push_log from pod_combat_last_heal_amount,
 # pod_combat_last_morale_damage_amount, pod_combat_last_morale_heal_amount)
 # rather than the move's static design value. So a heal that was
 # capped (target near full HP) reports the actual restored amount,
 # not the theoretical max.
 # Numeric riders — same red/green polarity convention as the result
 # text above. HP riders use the wound-box icon (matches the primary
 # result line); morale riders keep the "Morale" word since morale
 # lives off the HP track.
 # Heal rider has a parallel _aggravated variant the dispatcher picks
 # when move.heal_type = aggravated.
 pod_combat_log_heal_rider:             ", #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_heal_rider_aggravated:  ", #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_morale_damage_rider:    ", #bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_morale_heal_rider:      ", #bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"

 # Buff / debuff / status riders.
 # Stance changes embed the matching texticon and concept-link the
 # whole label so hovering pops the Guard / Dodge / Stealth card.
 # The polarity sign sits OUTSIDE the concept link so it can be
 # red/green-colored independently — concept links render in blue
 # and override color formatting inside their wrap.
 # Soak / Hit / Init concept-link their stat label (PoD's
 # `soak_damage` and our combat-specific `pod_combat_hit_chance` /
 # `pod_combat_initiative`) so hovering pops the matching card. AP
 # and the Retaliate-ready marker stay plain bold — no concept card
 # to point at.
 pod_combat_log_buff_set_guard:          " #bold;P +#![Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E]"
 pod_combat_log_buff_dodge:              " #bold;P +#![Concept('pod_combat_dodge','@pod_combat_dodge_icon!Dodge')|E]"
 pod_combat_log_buff_stealth:            " #bold;P +#![Concept('pod_combat_stealth','@pod_combat_stealth_icon!Stealth')|E]"
 pod_combat_log_buff_remove_guard:       " #bold;N -#![Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E]"
 pod_combat_log_buff_soak_buff:          " #bold;P +#![Concept('soak_damage','Soak')|E]"
 pod_combat_log_buff_soak_debuff:        " #bold;N -#![Concept('soak_damage','Soak')|E]"
 pod_combat_log_buff_hit_buff:           " #bold;P +#![Concept('pod_combat_hit_chance','Hit')|E]"
 pod_combat_log_buff_hit_debuff:         " #bold;N -#![Concept('pod_combat_hit_chance','Hit')|E]"
 pod_combat_log_buff_ap_gain:            " #bold;P +AP#!"
 pod_combat_log_buff_ap_drain:           " #bold;N -AP#!"
 pod_combat_log_buff_retaliate:          " #bold;V Retaliate ready#!"
 pod_combat_log_buff_initiative_debuff:  " #bold;N -#![Concept('pod_combat_initiative','Init')|E]"

 # ──────────────────────────────────────────────────────────────────
 # Damage-source markers (consumed by PODCombatDamageSourceMarker
 # customizable_loc). Each variant wraps its texticon in a Concept
 # link so the icon in the combat-log result column pops the matching
 # damage-type tooltip on hover. Concept descriptions live in the
 # game_concept_pod_combat_damage_<X>_desc keys further below;
 # concept definitions in devpod/common/game_concepts/pod_combat_concepts.txt.
 #
 # Balefire is the only remaining flavor still using a stand-in PoD
 # asset (wyrm faith icon) AND linking to PoD's pre-existing
 # `balefire` concept rather than a combat-specific one — keeps it
 # aligned with the broader Wyrm/spirit lore in the rest of PoD.
 #
 # Physical and supernatural attack-type icons are intentionally NOT
 # rendered in the combat log: a generic "this is an attack" glyph on
 # every damage row added noise without telling the player anything
 # the move name + tooltip didn't already convey. The dispatcher
 # falls those branches through to `_blank`. Mental keeps its icon —
 # psychic attacks are distinctive enough that the marker actually
 # adds info. The pod_combat_damage_<physical/supernatural> concepts
 # and matching texticons still exist for the move-tooltip damage
 # lines (pod_combat_desc_hp_damage_<physical/supernatural>) where
 # they're more useful as part of a full sentence.
 # `_blank` is the empty-string fallback for moves with no
 # distinctive damage flavor.
 #
 # Each non-blank value starts with a leading space so the elemental
 # icon stays detached from the wound-box glyph that ends the result
 # text — the column reads "-5 [box] [fire]" with breathing room
 # between the damage number and its elemental tag. Blank stays bare
 # so it collapses to nothing when the dispatcher routes there.
 pod_combat_damage_source_fire:         " [Concept('pod_combat_damage_fire','@pod_combat_fire_icon!')]"
 pod_combat_damage_source_cold:         " [Concept('pod_combat_damage_cold','@pod_combat_cold_icon!')]"
 pod_combat_damage_source_lightning:    " [Concept('pod_combat_damage_lightning','@pod_combat_lightning_icon!')]"
 pod_combat_damage_source_sun:          " [Concept('pod_combat_damage_sun','@pod_combat_sun_icon!')]"
 pod_combat_damage_source_silver:       " [Concept('pod_combat_damage_silver','@pod_combat_silver_icon!')]"
 pod_combat_damage_source_gold:         " [Concept('pod_combat_damage_gold','@pod_combat_gold_icon!')]"
 pod_combat_damage_source_holy:         " [Concept('pod_combat_damage_holy','@pod_combat_holy_icon!')]"
 pod_combat_damage_source_balefire:     " [Concept('balefire','@pod_combat_balefire_icon!')]"
 pod_combat_damage_source_mental:       " [Concept('pod_combat_damage_mental','@pod_combat_mental_icon!')]"
 pod_combat_damage_source_blank:        ""

 # ──────────────────────────────────────────────────────────────────
 # Target column dispatch (PODCombatLogTargetText). Single-target
 # moves render the target's first name; AoE moves render an "AoE
 # Enemies / Allies" label so the column reads at a glance whether
 # the row hit one combatant or a whole side. `_self` covers
 # self-targeted moves where the actor and target columns would
 # otherwise duplicate the same name.
 pod_combat_log_target_aoe_enemies: "#weak;italic AoE Enemies#!"
 pod_combat_log_target_aoe_allies:  "#weak;italic AoE Allies#!"
 pod_combat_log_target_self:        "#weak;italic Self#!"
 pod_combat_log_target_single:      "[entry.MakeScope.Var('target').GetCharacter.GetFirstNameNoTooltip]"
 pod_combat_log_target_none:        "#weak —#!"
