 ###### AI DECISION TRACE (debug-gated; emitted via debug_log, not shown in UI)
 # One line per AI pick / per AI turn, written to debug.log when the tuning
 # window's 'AI decision trace' toggle is on. Format is deliberately
 # key=value with a stable field order so a script can parse it; the
 # 'pod_combat_trace' prefix is the grep anchor.
 #
 # READ RULES for anything added here:
 #  - Reach host state through GetPlayer.MakeScope, never ROOT: root is not
 #    reliably the PC at combat call sites, the combat host always is.
 #  - Numbers use .GetValue|0, which is SAFE on an unset var (it falls back).
 #  - Flags use .GetFlagKey (raw name, parseable). .GetFlagName would emit the
 #    LOCALIZED name and is not parseable. Neither is safe on an unset var, so
 #    only read a flag that is provably always set at the emit point.
 #
 # Three record kinds: 'pick' per executed action, 'turn' per AI turn, and
 # 'target' per run of the target selector - including the runs that pick nothing,
 # which leave no pick record at all and are what the retry ladder is made of.
 # Slot identities on the target record ride numerically (1 = player, 2 = enemy)
 # because a selector roll can happen with the flag vars unset.
 # The pick record's th_* fields echo the live tuning thresholds, so two logs can
 # be compared only after confirming the knobs matched.
 pod_combat_trace_pick:0 "pod_combat_trace pick round=[GetPlayer.MakeScope.ScriptValue('pod_combat_round_value')|0] action=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_actions').GetValue|0] actor_team=[GetPlayer.MakeScope.Var('pod_combat_current_actor_team').GetFlagKey] actor_pos=[GetPlayer.MakeScope.Var('pod_combat_current_actor_position').GetValue|0] ap=[GetPlayer.MakeScope.Var('pod_combat_current_ap').GetValue|0] eligible=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_eligible').GetValue|0] intent=[GetPlayer.MakeScope.Var('pod_combat_ai_intent').GetFlagKey] intent_n=[GetPlayer.MakeScope.Var('pod_combat_ai_intent_n').GetValue|0] emg=[GetPlayer.MakeScope.Var('pod_combat_ai_intent_emg').GetValue|0] locked=[GetPlayer.MakeScope.Var('pod_combat_ai_intent_locked').GetValue|0] b_atk=[GetPlayer.MakeScope.Var('pod_combat_actor_char').Var('pod_combat_pers_bias_atk').GetValue|0] b_def=[GetPlayer.MakeScope.Var('pod_combat_actor_char').Var('pod_combat_pers_bias_def').GetValue|0] n_pre=[GetPlayer.MakeScope.Var('pod_combat_ai_usable_pressure_n').GetValue|0] n_brk=[GetPlayer.MakeScope.Var('pod_combat_ai_usable_break_n').GetValue|0] n_set=[GetPlayer.MakeScope.Var('pod_combat_ai_usable_setup_n').GetValue|0] n_stab=[GetPlayer.MakeScope.Var('pod_combat_ai_usable_stabilize_n').GetValue|0] hp=[GetPlayer.MakeScope.ScriptValue('pod_combat_actor_hp_value')|0] score=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_move').Var('pod_combat_ai_score').GetValue|0] smax=[GetPlayer.MakeScope.Var('pod_combat_ai_score_max').GetValue|0] bfloor=[GetPlayer.MakeScope.Var('pod_combat_ai_band_floor').GetValue|0] adm=[GetPlayer.MakeScope.Var('pod_combat_ai_admitted_n').GetValue|0] min_cost=[GetPlayer.MakeScope.Var('pod_combat_ai_min_ap_cost').GetValue|0] floor=[GetPlayer.MakeScope.Var('pod_combat_ai_ap_strand_floor').GetValue|0] max_dmg=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_max_dmg').GetValue|0] move=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_move').Var('skill_key').GetFlagKey] ap_cost=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_move').Var('ap_cost').GetValue|0] targeting=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_move').Var('targeting').GetFlagKey] tgt_team=[GetPlayer.MakeScope.Var('pod_combat_selected_target_team').GetFlagKey] tgt_pos=[GetPlayer.MakeScope.Var('pod_combat_selected_target_position').GetValue|0] tgt_soak=[GetPlayer.MakeScope.Var('pod_combat_target_soak').GetValue|0] tgt_morale=[GetPlayer.MakeScope.Var('pod_combat_target_morale').GetValue|0] tgt_hit=[GetPlayer.MakeScope.Var('pod_combat_target_hit_chance').GetValue|0] finishable=[GetPlayer.MakeScope.Var('pod_combat_ai_enemy_finishable').GetValue|0] pend_drain=[GetPlayer.MakeScope.Var('pod_combat_ai_tgt_ap_drain').GetValue|0] pend_ctrl=[GetPlayer.MakeScope.Var('pod_combat_ai_tgt_controlled').GetValue|0] pend_dot=[GetPlayer.MakeScope.Var('pod_combat_ai_tgt_dot_amount').GetValue|0] pend_dot_r=[GetPlayer.MakeScope.Var('pod_combat_ai_tgt_dot_rounds').GetValue|0] pend_dot_mor=[GetPlayer.MakeScope.Var('pod_combat_ai_tgt_dot_morale').GetValue|0] pend_init=[GetPlayer.MakeScope.Var('pod_combat_ai_tgt_init_bonus').GetValue|0] tgt_hp=[GetPlayer.MakeScope.Var('pod_combat_ai_tgt_hp').GetValue|0] fin_hp=[GetPlayer.MakeScope.Var('pod_combat_ai_enemy_finishable_hp').GetValue|0] fin_mor=[GetPlayer.MakeScope.Var('pod_combat_ai_enemy_finishable_mor').GetValue|0] ctf=[GetPlayer.MakeScope.Var('pod_combat_ai_cur_target_finishable').GetValue|0] fin_n=[GetPlayer.MakeScope.Var('pod_combat_ai_fin_n').GetValue|0] fin_team_n=[GetPlayer.MakeScope.Var('pod_combat_ai_fin_team_n').GetValue|0] fin_pos=[GetPlayer.MakeScope.Var('pod_combat_ai_fin_pos').GetValue|0] kg_hp=[GetPlayer.MakeScope.Var('pod_combat_ai_can_dmg_hp').GetValue|0] kg_mor=[GetPlayer.MakeScope.Var('pod_combat_ai_can_dmg_mor').GetValue|0] th_hp=[GetPlayer.MakeScope.ScriptValue('pod_combat_ai_hp_finish_threshold')|0] th_mor=[GetPlayer.MakeScope.ScriptValue('pod_combat_ai_morale_finish_threshold')|0] th_kill=[GetPlayer.MakeScope.ScriptValue('pod_combat_ai_kill_priority_boxes')|0] th_mor_kill=[GetPlayer.MakeScope.ScriptValue('pod_combat_ai_morale_kill_priority')|0] snap=[GetPlayer.MakeScope.Var('pod_combat_ai_snap_done').GetValue|0]"
 pod_combat_trace_target:0 "pod_combat_trace target round=[GetPlayer.MakeScope.ScriptValue('pod_combat_round_value')|0] actor_t=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_actor_t').GetValue|0] actor_pos=[GetPlayer.MakeScope.Var('pod_combat_current_actor_position').GetValue|0] ctx=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_ctx').GetValue|0] cand=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_cand').GetValue|0] kb_hp=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_kb_hp').GetValue|0] kb_mor=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_kb_mor').GetValue|0] picked=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_picked').GetValue|0] sel_team=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_team').GetValue|0] sel_pos=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_pos').GetValue|0] sel_hp=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_hp').GetValue|0] sel_mor=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_sel_mor').GetValue|0] kg_hp=[GetPlayer.MakeScope.Var('pod_combat_ai_can_dmg_hp').GetValue|0] kg_mor=[GetPlayer.MakeScope.Var('pod_combat_ai_can_dmg_mor').GetValue|0]"
 pod_combat_trace_turn:0 "pod_combat_trace turn round=[GetPlayer.MakeScope.ScriptValue('pod_combat_round_value')|0] actor_team=[GetPlayer.MakeScope.Var('pod_combat_current_actor_team').GetFlagKey] actor_pos=[GetPlayer.MakeScope.Var('pod_combat_current_actor_position').GetValue|0] actions=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_actions').GetValue|0] ap_left=[GetPlayer.MakeScope.Var('pod_combat_current_ap').GetValue|0] last_eligible=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_eligible').GetValue|0] stop=[GetPlayer.MakeScope.Var('pod_combat_ai_trace_stop').GetValue|0]"
