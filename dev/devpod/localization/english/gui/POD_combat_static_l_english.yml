 # Soak buffs/debuffs and hit-chance buffs/debuffs link to the matching
 # concept card so hovering the term opens the same explanation the
 # combat window's stat labels use. `soak_damage` is PoD's vanilla
 # concept; `pod_combat_hit_chance` is defined locally above.
 pod_combat_desc_soak_buff_round:    "#medium;outline #P +[Concept('soak_damage','Soak')|E]#! (tier [story.MakeScope.Var('soak_buff_round_tier').GetValue|V0]) this round#! $EFFECT_LIST_BULLET$"
