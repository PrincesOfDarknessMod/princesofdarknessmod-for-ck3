 game_concept_pod_combat_composure:          "Morale"
 game_concept_pod_combat_hit:                "Hit Chance"
 game_concept_pod_combat_accuracy:           "Hit Chance"
 game_concept_pod_combat_init:               "Initiative"
 game_concept_pod_combat_turn:               "Turn Order"
 game_concept_pod_combat_guarding:           "Guard"
 game_concept_pod_combat_guarded:            "Guard"
 game_concept_pod_combat_dodging:            "Dodge"
 game_concept_pod_combat_dodged:             "Dodge"
 game_concept_pod_combat_stealthed:          "Stealth"
 game_concept_pod_combat_hidden:             "Stealth"
 game_concept_pod_combat_physical_damage:    "Physical Attack"
 game_concept_pod_combat_supernatural_damage: "Supernatural Attack"
 game_concept_pod_combat_mental_damage:      "Mental Attack"
 game_concept_pod_combat_fire_damage:        "Fire Damage"
 game_concept_pod_combat_cold_damage:        "Cold Damage"
 game_concept_pod_combat_lightning_damage:   "Lightning Damage"
 game_concept_pod_combat_sunlight:           "Sunlight Damage"
 game_concept_pod_combat_sunlight_damage:    "Sunlight Damage"
 game_concept_pod_combat_sun_damage:         "Sunlight Damage"
 game_concept_pod_combat_silver_damage:      "Silver Damage"
 game_concept_pod_combat_gold_damage:        "Gold Damage"
 game_concept_pod_combat_holy_damage:        "Holy Damage"
