 ##############################
 ###### COMBAT LOG - COLUMN HEADERS + EMPTY STATE
 ##############################
 # Empty-state placeholder shown when no entries have been logged yet.
 # The combat log encodes structure visually (gold/red side bar +
 # actor-name tint + right-anchored result); no column headers.
 pod_combat_log_empty:         "#italic Awaiting your command.#!"


 ##############################
 ###### COMBAT LOG - RESULT TEXT
 ##############################
 # Three-axis result dispatch via PODCombatLogResultText on the entry's
 # outcome / attack_result vars (COMBAT_REFERENCE.info §4). Amount fields
 # (damage / heal_amount / morale_*_amount / retal_damage) are captured
 # by push_log from parallel pod_combat_last_*_amount workspace vars.
 # Riders are separate text_singles in pod_combat_window.gui (CK3 can't
 # propagate scopes through nested Custom() calls).
 pod_combat_log_result_text_hp_damage:               "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [POD_superficial_box]"
 pod_combat_log_result_text_hp_damage_aggravated:    "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [POD_aggravated_box]"
 # Partial-soak variants: soak rolls per point, so some of the packet landed and
 # the rest was absorbed. The weak-italic note sits next to the number it explains.
 # A fully soaked hit renders the bold Soaked outcome above instead.
 pod_combat_log_result_text_hp_damage_partial_soak:            "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [POD_superficial_box] #weak;italic [entry.MakeScope.Var('soaked_count').GetValue|0] soaked#!"
 pod_combat_log_result_text_hp_damage_aggravated_partial_soak: "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [POD_aggravated_box] #weak;italic [entry.MakeScope.Var('soaked_count').GetValue|0] soaked#!"
 pod_combat_log_result_text_guard_blocked:           "#bold Blocked#!"
 pod_combat_log_result_text_soaked:                  "#bold Soaked#!"
 pod_combat_log_result_text_immune:                  "#bold Immune#!"
 pod_combat_log_result_text_missed:                  "#bold Missed#!"
 pod_combat_log_result_text_dodged:                  "#bold Dodged#!"
 pod_combat_log_result_text_stealthed:               "#bold Stealthed#!"
 # Retaliation rider - emitted by PODCombatLogRetalRider as a separate
 # result-column text_single (not a primary outcome) when the row's
 # entry.var:retal_fired was set during push_log. Clean overlay on the
 # three-axis model: magnitude-first, wound-box resource label, italic
 # "counter" tag; soaked variant drops the magnitude. The aggravated
 # variant keys on entry.var:retal_agg - stamped from PoD's ACTUAL
 # per-victim classification of the counter, not the armed kind.
 pod_combat_log_retal_rider:            " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [POD_superficial_box] #weak;italic counter#!"
 pod_combat_log_retal_rider_aggravated: " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [POD_aggravated_box] #weak;italic counter#!"
 pod_combat_log_retal_rider_soaked:     " #weak;italic counter#! #bold Soaked#!"
 pod_combat_log_retal_rider_morale:     " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [pod_combat_morale_icon|E] #weak;italic counter#!"
 # utility primary renders empty - the buff/stance/tier/AP/retaliate/
 # init riders downstream of this widget already carry the full
 # content of what the move did, so a "Effect applied" lead-in would
 # just repeat boilerplate before the rider ("Effect applied, entered\n # Guard" -> "entered Guard"). An audit confirmed every implemented
 # utility move triggers at least one rider - there is no truly no-op
 # move that would render an empty result column without a lead-in.
 # Note the buff dispatcher's riders below switched from a leading ", "
 # to a leading " " specifically to avoid an orphan comma in this case.
 pod_combat_log_result_text_utility:             ""
 pod_combat_log_result_text_morale_damage:       "#bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [pod_combat_morale|E]"
 pod_combat_log_result_text_hp_healed:           "#bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [POD_superficial_box]"
 pod_combat_log_result_text_hp_healed_aggravated: "#bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [POD_aggravated_box]"
 pod_combat_log_result_text_morale_healed:       "#bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [pod_combat_morale|E]"
 pod_combat_log_result_text_unknown:       "#weak —#!"

 # System-message rows - pushed by pod_combat_push_system_log_effect
 # at combat-lifecycle bookend points (start / victory / defeat).
 # Em-dash flanking reads as a clear "this isn't an actor action" so the
 # eye doesn't try to parse them as a regular log row. (Square brackets
 # can't appear as literal text - CK3's loc parser treats `[...]` as a
 # data-binding expression and rejects free-form text inside.)
 # Combat-start keeps neutral weight; combat-end uses the polarity-color
 # convention (P green for player victory, N red for defeat) to telegraph
 # the outcome at a glance from the log row alone.
 pod_combat_log_system_combat_started:        "#italic — Combat begins —#!"
 pod_combat_log_system_combat_ended_victory:  "#bold;P — Combat ends · Victory —#!"
 pod_combat_log_system_combat_ended_defeat:   "#bold;N — Combat ends · Defeat —#!"
 # Round transition. Round number pulled off entry.var:round which
 # push_system_log_effect captures from the host's pod_combat_round
 # at push time, so the message persists the correct round even as
 # later actions push more rows. Bold weight makes the transition
 # marker easy to find when scrolling back through a long combat.
 pod_combat_log_system_round_begins:          "#italic — Round #bold [entry.MakeScope.Var('round').GetValue|0]#! begins —#!"
 pod_combat_log_system_unknown:               "#weak —#!"

 # ──────────────────────────────────────────────────────────────────
 # Result-line riders.
 #
 # Each `pod_combat_log_<x>_rider` / `_buff_<x>` key is the loc value
 # consumed by the matching customizable_loc dispatcher. Riders that
 # don't apply resolve to `pod_combat_log_blank` (empty string) so
 # the surrounding text stays clean.
 #
 # Stat reads inside rider strings go through the saved `move` scope:
 # `move.MakeScope.Var('hp_heal').GetValue` etc. (no `scope:` prefix
 # in loc-value reads - that's trigger-only syntax.)
 pod_combat_log_blank:                  ""

 # Numeric riders read the actual rolled amount from the entry's
 # parallel _amount fields (so a capped heal reports what was actually
 # restored). Bodies are BARE - magnitude + resource label only; the
 # The middot separator is GUI-owned (pod_combat_window.gui). Heal rider has
 # an _aggravated variant picked when move.heal_type = aggravated. 
 pod_combat_log_heal_rider:             " #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [POD_superficial_box]"
 pod_combat_log_heal_rider_aggravated:  " #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [POD_aggravated_box]"
 pod_combat_log_morale_damage_rider:    " #bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [pod_combat_morale|E]"
 pod_combat_log_morale_heal_rider:      " #bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [pod_combat_morale|E]"

 # Buff / debuff / status riders. Stance changes use arrow notation
 # (-> Guard / -> Dodge / -> Stealth / -> Retaliate); remove_guard reads
 # "Guard broken" (state EXIT on the target). Polarity sign sits
 # OUTSIDE the concept link so it colors independently. Bodies are
 # BARE; separator GUI-owned.
 pod_combat_log_buff_set_guard:          "→ [pod_combat_guard_with_icon|E]"
 pod_combat_log_buff_dodge:              "→ [pod_combat_dodge_with_icon|E]"
 pod_combat_log_buff_stealth:            "→ [pod_combat_stealth_with_icon|E]"
 pod_combat_log_buff_remove_guard:       "[pod_combat_guard_with_icon|E] #weak;italic broken#!"
 # Tier-buff/debuff riders: magnitude-first ("+20% Soak"). Percentage
 # comes from pod_combat_move_<stat>_<dir>_mag_value (pod_combat_values.txt)
 # resolving the move's tier var to the pod_combat_tier_*_mag script value
 # (10/20/30). Stat-name concept-linked as the resource label.
 pod_combat_log_buff_soak_buff:          " #bold;P +[move.MakeScope.ScriptValue('pod_combat_move_soak_buff_mag_value')|0]%#! [soak_damage|E]"
 pod_combat_log_buff_soak_debuff:        " #bold;N -[move.MakeScope.ScriptValue('pod_combat_move_soak_debuff_mag_value')|0]%#! [soak_damage|E]"
 pod_combat_log_buff_hit_buff:           " #bold;P +[move.MakeScope.ScriptValue('pod_combat_move_hit_buff_mag_value')|0]%#! [pod_combat_hit|E]"
 pod_combat_log_buff_hit_debuff:         " #bold;N -[move.MakeScope.ScriptValue('pod_combat_move_hit_debuff_mag_value')|0]%#! [pod_combat_hit|E]"
 # AP gain reads the integer var off the move story; ap_drain reads the log
 # ENTRY, whose value is the effective total (base + fired bonus). Both are
 # magnitude-first with an AP resource label. Retaliate uses arrow notation.
 # initiative_debuff is a bare "-" marker with NO magnitude - the next-round
 # init penalty is a fixed flag, not a tracked amount. ap_drain and
 # initiative_debuff carry "next turn" / "next round" tags.
 pod_combat_log_buff_ap_gain:            " #bold;P +[move.MakeScope.Var('ap_gain').GetValue|0] AP#!"
 pod_combat_log_seg_ap_drain:            " #bold;N -[entry.MakeScope.Var('ap_drain').GetValue|0] AP#! #weak;italic next turn#!"
 pod_combat_log_buff_retaliate:          " → #weak;italic Retaliate#!"
 pod_combat_log_seg_retal_armed_morale:  " → #weak;italic Retaliate#!$pod_combat_damage_source_morale$"
 pod_combat_log_seg_retal_armed_agg:     " → #weak;italic Retaliate#! $aggravated$"
 pod_combat_log_seg_retal_armed_elemental: " → #weak;italic Retaliate#! [Localize( Concatenate( 'pod_combat_elemmark_', move.MakeScope.Var('damage_type').GetFlagKey ) )]"
 pod_combat_log_seg_stun:                " #bold;N 0 AP#! #weak;italic target next turn#!"
 pod_combat_log_seg_recoil:              " #bold;N -[entry.MakeScope.Var('self_damage').GetValue|0]#! $superficial$ #weak;italic recoil#!"
 pod_combat_log_buff_initiative_debuff:  " #bold;N -#![pod_combat_init|E] #weak;italic next round#!"
 # Energy bonus segments: amounts come off the log ENTRY (stamped only when
 # the bonus actually applied), already converted to the affected character's
 # own resource by pod_combat_scale_energy_to_splat_effect - so these print
 # the number as-is and name the resource. Gain reads the entry's ACTOR, drain
 # its TARGET: in an NvN fight the acting AI's splat is not the reader's.
 pod_combat_log_seg_energy_gain:         " #bold;P +[entry.MakeScope.Var('energy_gain').GetValue|0]#! [entry.MakeScope.Var('actor').GetCharacter.Custom('PODEnergySplatIcon')]#V [entry.MakeScope.Var('actor').GetCharacter.Custom('PODEnergySplatWord')]#!"
 pod_combat_log_seg_energy_drain:        " #bold;N -[entry.MakeScope.Var('energy_drain').GetValue|0]#! [entry.MakeScope.Var('target').GetCharacter.Custom('PODEnergySplatIcon')]#N [entry.MakeScope.Var('target').GetCharacter.Custom('PODEnergySplatWord')]#! #weak;italic drained#!"
 pod_combat_log_seg_ap_refund:           " #bold;P +[entry.MakeScope.Var('ap_refund').GetValue|0] AP#! #weak;italic refunded#!"
 # Key-agnostic: re-roots the name dispatcher onto the `move` scope PODSegText
 # added, so every marker key renders through this one line. Re-rooting a nested
 # customizable_loc on a saved scope is the standard engine idiom; what a nested
 # call cannot do is read the OUTER saved scopes from inside its own triggers.
 pod_combat_log_seg_marker:              " #bold;P [move.Custom('PODCombatAppliedMarkerName')]#! #weak;italic applied#!"

 # ──────────────────────────────────────────────────────────────────
 # Elemental class icons - one icon per element,
 # leading-space-prefixed so each detaches from the wound-box glyph.
 # Consumed by the compact-card class mark (PODCombatCLSource); the
 # `_blank` fallback collapses to nothing.
 pod_combat_damage_source_fire:         " [fire_damage_icon]"
 pod_combat_damage_source_cold:         " [cold_damage_icon]"
 pod_combat_damage_source_lightning:    " [lightning_damage_icon]"
 pod_combat_damage_source_sun:          " [sun_damage_icon]"
 pod_combat_damage_source_silver:       " [silver_damage_icon]"
 pod_combat_damage_source_gold:         " [gold_damage_icon]"
 pod_combat_damage_source_holy:         " [holy_damage_icon]"
 pod_combat_damage_source_balefire:     " [balefire_damage_icon]"
 pod_combat_damage_source_poison:       " [poison_damage_icon]"
 pod_combat_damage_source_cold_iron:    " [cold_iron_damage_icon]"
 # Morale-typed reaction (retaliate_morale) - not a damage class, but shares this
 # icon set so the retal-armed log segment shows the type mark like elements get.
 pod_combat_damage_source_morale:       " [pod_combat_morale_icon]"

 # ── Combat-log "actor -> target" segment ─────────────────────
 # PODCombatLogTargetText resolves to one of these per row,
 # rendering the inline "-> <target>" handoff between the actor
 # name and the action name. Self / no-target / move-less cases
 # collapse to empty (the new log layout drops the "Self" word
 # entirely - an action with no arrow IS self-targeted by
 # implication, freeing visual real estate). Single-target +
 # AoE branches all lead with the same "  ->  " separator
 # (two spaces flanking the arrow keeps it visually anchored
 # between the actor and target words).
 # Arrow style: `#F` (flavor = low/dark-gray, NOT italic) instead of
 # `#weak` (low + italic) so the arrow reads as a clean connector
 # glyph rather than an italic word - matches the mockup's neutral
 # `.arrow { color: #6f7280 }` styling. Two spaces around the arrow
 # give it breathing room between actor and target.
 pod_combat_log_target_aoe_enemies: "  #F →#! #bold All enemies#!"
 pod_combat_log_target_aoe_allies:  "  #F →#! #bold All allies#!"
 pod_combat_log_target_aoe_all:     "  #F →#! #bold Everyone#!"
 # Per-target AoE rows: "All enemies (Steve)" / "All allies (Jane)".
 # The AoE marker is in bold so the burst context still stands out; the
 # per-target name sits in dim italic parens beside it so the eye picks
