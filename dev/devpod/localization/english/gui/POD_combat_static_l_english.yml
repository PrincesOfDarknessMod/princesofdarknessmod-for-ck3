 game_concept_fire_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] against #bold any [splat|E] with a body.#! Fire wounds don't heal back overnight.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] against #bold @wraith_icon!$POD_splat_wraith_plural$#! and #bold @spirit_icon!$POD_splat_spirit_plural$#!, who are incorporeal.\n$BULLET_WITH_TAB$#bold [GetTrait('bushi').GetName(GetNullCharacter)]#! take #bold double damage#! due to their $glossary_clan_curse$.\n$BULLET_WITH_TAB$Some rare perks can confer #bold immunity#! to fire damage.\n\n#weak Mankind's oldest tool will ward off the darkness, literally and metaphorically. Even a peasant can wave a torch around to defend himself against monsters.#!"

