 pod_weapon_ovr_retype_sun: "\nWeapon strikes deal $pod_combat_elemmark_sun$ Sun damage"
 pod_weapon_ovr_retype_silver: "\nWeapon strikes deal $pod_combat_elemmark_silver$ Silver damage"
 pod_weapon_ovr_retype_gold: "\nWeapon strikes deal $pod_combat_elemmark_gold$ Gold damage"
 pod_weapon_ovr_retype_holy: "\nWeapon strikes deal $pod_combat_elemmark_holy$ Holy damage"
 pod_weapon_ovr_retype_balefire: "\nWeapon strikes deal $pod_combat_elemmark_balefire$ Balefire damage"
 pod_weapon_ovr_retype_poison: "\nWeapon strikes deal $pod_combat_elemmark_poison$ Poison damage"
 pod_weapon_ovr_retype_cold_iron: "\nWeapon strikes deal $pod_combat_elemmark_cold_iron$ Cold Iron damage"
 pod_weapon_ovr_bonus:   "\nWeapon strikes deal #P +[ROOT.Var('artifact_weapon_bonus_damage').GetValue|V0]#! damage"
 pod_weapon_ovr_undodge: "\nWeapon strikes cannot be dodged"
 pod_weapon_ovr_agg:     "\nWeapon strikes deal [POD_aggravated_damage|E]"
 pod_weapon_ovr_blade_kings: "\nWeapon strikes deal [POD_aggravated_damage|E] against foes whose [prowess|E] is at or below this blade's [artifact_power_with_icon|E] of #P [ROOT.Var('artifact_power').GetValue|V0]#!"
 pod_weapon_ovr_aggvs_vampire: "\nWeapon strikes deal [POD_aggravated_damage|E] against $POD_splat_vampire_plural$ and $POD_splat_abomination_plural$"
 pod_weapon_ovr_aggvs_werewolf: "\nWeapon strikes deal [POD_aggravated_damage|E] against $POD_splat_werewolf_plural$"
 pod_weapon_ovr_aggvs_demon: "\nWeapon strikes deal [POD_aggravated_damage|E] against $POD_splat_demon_plural$"
 pod_weapon_ovr_aggvs_fera: "\nWeapon strikes deal [POD_aggravated_damage|E] against $glossary_fera$"
 pod_weapon_ovr_aggvs_wyrm_tainted: "\nWeapon strikes deal [POD_aggravated_damage|E] against servants of the Wyrm"
 pod_weapon_ovr_aggvs_except_werewolf: "\nWeapon strikes deal [POD_aggravated_damage|E] against everything but $POD_splat_werewolf_plural$"
 pod_weapon_ovr_lifesteal: "\nWeapon strikes restore #P +[ROOT.Var('artifact_weapon_heal_on_damage').GetValue|V0]#! health when it draws blood"
 pod_weapon_ovr_energy:  "\nWeapon strikes restore #P +[Multiply_CFixedPoint( ROOT.Var('artifact_weapon_energy_on_damage').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! [GetPlayer.Custom('PODEnergySplatIcon')]#V [GetPlayer.Custom('PODEnergySplatWord')]#! when it draws blood"
 pod_weapon_ovr_soakpen: "\nWeapon strikes shred #P [ROOT.Var('artifact_weapon_soak_penalty').GetValue|V0]#! points of soak"
 pod_weapon_ovr_line:    "[pod_weapon.Custom('PODWeaponOvrRetype')][pod_weapon.Custom('PODWeaponOvrBonus')][pod_weapon.Custom('PODWeaponOvrUndodge')][pod_weapon.Custom('PODWeaponOvrAgg')][pod_weapon.Custom('PODWeaponOvrBladeKings')][pod_weapon.Custom('PODWeaponOvrAggVsVampire')][pod_weapon.Custom('PODWeaponOvrAggVsWerewolf')][pod_weapon.Custom('PODWeaponOvrAggVsDemon')][pod_weapon.Custom('PODWeaponOvrAggVsFera')][pod_weapon.Custom('PODWeaponOvrAggVsWyrmTainted')][pod_weapon.Custom('PODWeaponOvrAggExceptWerewolf')][pod_weapon.Custom('PODWeaponOvrLifesteal')][pod_weapon.Custom('PODWeaponOvrEnergy')][pod_weapon.Custom('PODWeaponOvrSoakPen')]"
 pod_weapon_ovr_header: "#bold When wielded:#!"
 # The break BELOW the block, since the block now leads the tooltip. Gated on
 # the same trigger as the heading, so a plain artifact renders neither.
 pod_weapon_ovr_footer: "\n\n"
 pod_weapon_ovr_artifact_block: "[pod_weapon.Custom('PODWeaponOvrHeader')]$pod_weapon_ovr_line$[pod_weapon.Custom('PODWeaponOvrFooter')]"
 pod_artifact_desc_and_weapon_override: "[PODWeaponOverrideSelfText][Artifact.GetDesc]"
