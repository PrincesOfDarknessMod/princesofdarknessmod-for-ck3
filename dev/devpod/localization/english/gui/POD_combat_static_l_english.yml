 ##############################
 ###### DYNAMIC MOVE TOOLTIP (pod_combat_move_desc SGUI)
 ##############################
 # Each line is appended to a move's tooltip iff the matching variable
 # is present on the story_cycle. Interpolation reads from the 'story'
 # scope added by the PODCombatMoveDesc macro.
 #
 # FORMATTING TRICK (copied from DUEL-Refactor):
 #   The macro wraps the whole SGUI output in |h — setting default color
 #   to transparent. This hides the bullet points that custom_tooltip
 #   always prepends. To make the ACTUAL text visible, each loc entry
 #   must start with #medium;outline (or any explicit color format) which
 #   overrides the transparent default. Each entry ends with
 #   $EFFECT_LIST_BULLET$ — a second invisible bullet that keeps the
 #   text centered in the tooltip box.
 #
 # If you drop the #medium;outline prefix, only the interpolated values
 # render (labels and punctuation become transparent).

 # AP cost line — one of four variants, dispatched by the SGUI
 # (pod_combat_move_desc) on the move's combat_category and
 # attack_type. Offensive-flavoured categories (ATK / CTL / PWR)
 # carry the pipeline label; defensive moves (DEF — guards, heals,
 # soak buffs) fall through to the unlabeled default.
 #   pod_combat_desc_ap_cost              — DEF moves and any other
 #                                          move with no offensive
 #                                          pipeline. No label.
 #   pod_combat_desc_ap_cost_physical     — ATK/CTL/PWR moves with no
 #                                          attack_type set (the implicit
 #                                          "physical" baseline pipeline).
 #   pod_combat_desc_ap_cost_supernatural — ATK/CTL/PWR moves whose
 #                                          attack_type = supernatural
 #                                          (auto-hit, skips guard).
 #   pod_combat_desc_ap_cost_mental       — ATK/CTL/PWR moves whose
 #                                          attack_type = mental.
 # Pipeline labels use `|E` so they render in the standard concept-link
 # light blue (CK3's `color_light_blue` = {0.51,0.61,0.65}) — same
 # styling as any vanilla concept link in a tooltip. Differs from the
 # custom-coloured elementals on the damage line below, where each
 # element has its own evocative tint instead of the default link blue.
 pod_combat_desc_ap_cost:              "#medium;outline #bold [story.MakeScope.Var('ap_cost').GetValue|V0]#! AP#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_ap_cost_physical:     "#medium;outline #bold [story.MakeScope.Var('ap_cost').GetValue|V0]#! AP [Concept('pod_combat_damage_physical','Physical')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_ap_cost_supernatural: "#medium;outline #bold [story.MakeScope.Var('ap_cost').GetValue|V0]#! AP [Concept('pod_combat_damage_supernatural','Supernatural')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_ap_cost_mental:       "#medium;outline #bold [story.MakeScope.Var('ap_cost').GetValue|V0]#! AP [Concept('pod_combat_damage_mental','Mental')|E]#! $EFFECT_LIST_BULLET$"
 # Energy cost tooltip: splat-aware label + scaled value.
 # PoD stores nominal energy costs on a 0–10 "mana bar" scale. Each
 # splat has a splat_energy_multiplier that maps that to its own cap
 # (e.g. vampires go 0–5, so the multiplier is 0.5 and a nominal 2
 # energy shows as "1 blood"). Format is "[icon] VALUE word":
 #   PODEnergySplatIcon → resource icon (hunger, gnosis,
 #     stress_loss, etc.)
 #   VALUE → splat_energy_multiplier-scaled number (2 nominal →
 #     1 for 5-cap splats, 20 for willpower)
 #   PODEnergySplatWord → plain resource word, concept-linked
 #     to the Mental Strain tooltip on the willpower fallback.
 # Execution routes willpower costs through POD_static_stress_gain,
 # so display and mechanic match exactly. Inspired by the DUEL-Refactor
 # tooltip pattern in POD_duels_l_english.yml + PoD's own
 # POD_splat_energy_cost compact style.
 pod_combat_desc_energy_cost:       "#medium;outline Costs [GetPlayer.Custom('PODEnergySplatIcon')]#bold [Multiply_CFixedPoint( story.MakeScope.Var('energy_cost').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! #V [GetPlayer.Custom('PODEnergySplatWord')]#!#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_gold_cost:         "#medium;outline Costs #bold [story.MakeScope.Var('gold_cost').GetValue|V0]#! gold#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_piety_cost:        "#medium;outline Costs #bold [story.MakeScope.Var('piety_cost').GetValue|V0]#! piety#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_prestige_cost:     "#medium;outline Costs #bold [story.MakeScope.Var('prestige_cost').GetValue|V0]#! prestige#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_stress_cost:       "#medium;outline Adds #bold [story.MakeScope.Var('stress_cost').GetValue|V0]#! stress#! $EFFECT_LIST_BULLET$"

 # HP damage line — one loc entry per (attack_type × damage_source)
 # pair the SGUI can pick. Attack_type fallback (physical /
 # supernatural / mental — the attack pipeline) renders when the
 # move has no damage_source set. Elemental sources always win over
 # the attack_type fallback. One loc key per source rather than
 # GetFlagName to avoid collisions with vanilla flag loc keys.
 #
 # Format: "Deal #VAL [classification-icon] [Elemental] Damage"
 #   classification-icon — `[damage_type.GetFlagName]` resolves to
 #     a wound-box icon (superficial = @health_track_damage_icon,
 #     aggravated = @health_track_aggravated_damage_icon) wrapped in
 #     a concept link. See the loc keys further down. Always set on
 #     hp_damage moves: POD_combat_move_set_hp_damage defaults to
 #     flag:superficial, POD_combat_move_set_damage_type_aggravated
 #     overrides. Same visual vocabulary as the combat-log result
 #     column.
 #   Elemental — capitalised flavor word (Fire / Cold / Lightning /
 #     Sunlight / Silver / Gold / Holy / Balefire) coloured to evoke
 #     the element and wrapped in a [Concept('key','Word')] call so
 #     it remains a real concept link (tooltip + encyclopedia jump).
 #     `|E` is intentionally omitted on the Concept call so the
 #     surrounding `#color:{...}` frame's tint wins instead of the
 #     default concept-blue link styling — pattern lifted from PoD's
 #     own `#POD_gamerule` loc. No underline is applied; the colour
 #     itself differentiates these from plain prose. Absent for the
 #     attack-type fallback variants.
 # The attack-pipeline label (Mental/Physical/Supernatural) is now
 # carried by the AP-cost line via pod_combat_desc_ap_cost_<type>;
 # see above. The damage line itself only carries the elemental
 # flavor and damage classification.
 #
 # No leading texticon: the colored elemental word (and the wound-box
 # classification icon) carry the at-a-glance scan. Plain physical /
 # supernatural / mental damage lines have no flavor word at all —
 # the AP-line pipeline label and the wound-box icon are sufficient.
 # Combat-log result column still uses the per-element icons via
 # PODCombatDamageSourceMarker; that path is independent of these
 # tooltip strings.
 #
 # Elemental colour palette (kept here so future tuning is local):
 #   Fire      {1.00, 0.55, 0.20}  bright orange
 #   Cold      {0.55, 0.85, 1.00}  sky blue
 #   Lightning {1.00, 0.95, 0.35}  vivid yellow
 #   Sunlight  {1.00, 0.92, 0.50}  pale warm gold
 #   Silver    {0.85, 0.85, 0.95}  pale silver
 #   Gold      {1.00, 0.75, 0.20}  rich gold
 #   Holy      {1.00, 0.95, 0.65}  cream-white
 #   Balefire  {0.55, 0.95, 0.40}  toxic green
 # Basic damage line — used by every move that doesn't carry a
 # damage_source flag. Pipeline shape (physical / supernatural / mental)
 # affects the runtime resolution but is intentionally NOT shown in the
 # tooltip — the leading pipeline texticons that previously distinguished
 # the three were dropped to keep the line clean. Players see "Deal X
 # type Damage" regardless of pipeline; the move's name and category
 # already convey the flavor. The elemental variants below add a colored
 # source word ("Fire", "Cold", etc.) before "Damage" because those
 # carry a real splat-weakness story the player benefits from seeing.
 pod_combat_desc_hp_damage_basic:        "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N Damage#!#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_fire:         "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #color:{1.00,0.55,0.20} [Concept('pod_combat_damage_fire','Fire')]#! #N Damage#!#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_cold:         "#medium;outline #N Deal#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #color:{0.55,0.85,1.00} [Concept('pod_combat_damage_cold','Cold')]#! #N Damage#!#! $EFFECT_LIST_BULLET$"
