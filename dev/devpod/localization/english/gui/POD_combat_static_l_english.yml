 pod_combat_desc_hit_buff_round_other:   "#medium;outline #P +[Concept('pod_combat_hit_chance','Hit chance')|E]#! (tier [story.MakeScope.Var('hit_buff_round_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] this round#! $EFFECT_LIST_BULLET$"
