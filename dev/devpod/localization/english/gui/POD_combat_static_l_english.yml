 ##############################
 ###### GAME CONCEPTS - general
 ##############################

 game_concept_pod_combat_encounter: "Combat Encounter"
 game_concept_pod_combat_encounter_with_icon: "@pod_combat_encounter_icon!Combat Encounter"
 game_concept_pod_combat_encounters: "Combat Encounters"
 game_concept_pod_combat_encounters_with_icon: "@pod_combat_encounter_icon!Combat Encounters"
 game_concept_pod_combat_encounter_desc: "A turn-based tactical combat minigame where two or more characters settle their differences with violence.\n\nCombatants take turns spending [pod_combat_action_points|E] on [pod_combat_skills|E] until the enemy is [pod_combat_knocked_out|E].\n\nA large variety of [pod_combat_skills|E] can be unlocked from [splat|E] traits, perks, and other sources. They can deal damage to the [POD_health_track|E] or [pod_combat_morale|E], apply buffs and debuffs, apply stances like [pod_combat_guard_with_icon|E], [pod_combat_dodge_with_icon|E] or [pod_combat_stealth_with_icon|E], and more.\n\n[prowess_i][prowess|E] is an important factor during combat since it determines [pod_combat_hit_chance|E] and [pod_combat_initiative|E].\n\n#I For a more in-depth explanation of combat mechanics, click the #bold Help#! button in the combat interface.#!"

 game_concept_pod_combat_skill: "Combat Skill"
 game_concept_pod_combat_skills: "Combat Skills"
 game_concept_pod_combat_skill_desc: "#I Use the #bold [SelectLocalization(IsInGame,'pod_combat_configure_skills_link_ingame','pod_combat_configure_skills')]#! [decision|E] to select a loadout of skills before battle.#!\n\nThe skills used during [pod_combat_encounters_with_icon|E]. Combat Skills come in four categories:\n\n#color_red;bold ATK (Attack):#! Deal damage to the [POD_health_track|E]. Some skills have [POD_damage_types|E], like [fire_damage_short_with_icon] or [silver_damage_short_with_icon].\n\n#color_light_blue;bold DEF (Defense):#! Heal, improve [soak_damage|E] or [pod_combat_hit_chance|E], or apply stances like [pod_combat_guard_with_icon|E], [pod_combat_dodge_with_icon|E] or [pod_combat_stealth_with_icon|E].\n\n#color_porple;bold CTL (Control):#! Deal damage to [pod_combat_morale|E], debuff the enemy's [soak_damage|E] or [pod_combat_hit_chance|E], or drain their [pod_combat_ap|E].\n\n#color_pwr_orange;bold PWR (Power):#! Powerful finishing moves that often come with limitations.\n\nYou can have #V;bold 4#! skills of each category equipped, for a total of #V;bold 16#!.\n\nCombat Skills use [pod_combat_action_points|E] #V (AP)#! and may have additional costs like [hunger_with_icon|E] or [gold_i][gold|E]."
 
 pod_combat_configure_skills_link_ingame: "[GetDecision('pod_combat_configure_skills').GetName]"
 
 game_concept_pod_combat_action_points: "Action Points"
 game_concept_pod_combat_ap: "AP"
 game_concept_pod_combat_action_points_desc: "#bold Action Points (AP)#! are the primary resource used during [pod_combat_encounters_with_icon|E].\n\nYou start with #V 6#! Action Points each round by default. Some [pod_combat_skills|E] can buff, drain, or refund AP.\n\nUnspent AP are lost at the end of your turn."
 
 game_concept_pod_combat_knocked_out: "Knocked Out"
 game_concept_pod_combat_knocked_out_desc: "A combatant is #bold Knocked Out#! and removed from a [pod_combat_encounter_with_icon|E] when any of the following happens:\n$BULLET_WITH_TAB$Their [POD_health_track|E] fills completely\n$BULLET_WITH_TAB$Their [pod_combat_morale|E] reaches #N zero#!\n$BULLET_WITH_TAB$They die, become #N Incapable#!, enter $pod_torpor$, or are trapped in the Shadow Realm or the Abyss\n\nYou win once every enemy is knocked out. You lose if you are knocked out, even if there are allies still standing."

 ##############################
 ###### GAME CONCEPTS - combat minigame stats
 ##############################
 # Hoverable concept cards for combat-specific stats that don't have
 # a matching vanilla CK3 or PoD concept.

 game_concept_pod_combat_morale: "Morale"
 game_concept_pod_combat_morale_icon: "@stress_icon!"
 game_concept_pod_combat_morale_desc: "A combatant's #bold mental resilience#! during [pod_combat_encounters_with_icon|E]. Morale normally begins full and falls under direct mental attacks, intimidation, and other pressure. Every wound box a hit actually deals after [soak_damage|E] also removes #N 2#! Morale.\n\nWhen a combatant is [pod_combat_knocked_out|E], every surviving teammate loses #N 2#! Morale from the shock. This loss stops at 1 Morale, so the shock cannot knock anyone out by itself.\n\nOutside Practice, every living combatant receives #N 5#! [static_stress|E] at the end of combat for each point of Morale still missing. Restoring Morale before the fight ends reduces this lasting strain. Practice combat applies no lasting Mental Strain."

 game_concept_pod_combat_hit_chance: "Hit Chance"
 game_concept_pod_combat_hit: "Hit"
 game_concept_pod_combat_accuracy: "Accuracy"
 game_concept_pod_combat_hit_chance_desc: "For [pod_combat_skills|E] that require a #bold Hit roll#!, Hit Chance is the percentage chance to succeed that roll. Its base starts at 60% and shifts by half the difference between your [prowess|E] and the selected target's Prowess, then applies your active Hit buffs and debuffs and [pod_combat_stealth_with_icon|E]'s +30% bonus.\n\n[pod_combat_dodge_with_icon|E] and [pod_combat_stealth_with_icon|E] resolve before the Hit roll, while [pod_combat_guard_with_icon|E] can block an attack that would otherwise land. [soak_damage|E] and the ability to affect incorporeal spirits are separate stages as well. None of these defenses changes the displayed percentage.\n\nA rolled Hit Chance is clamped between 20% and 95%. Moves marked #bold No Hit roll#! skip only that roll; any separate defense they do not ignore can still stop them."

 ##############################
 ###### GAME CONCEPTS - combat stances
 ##############################
 # Guard / Dodge / Stealth - the three defensive postures a combatant
 # can adopt via moves. Exposed as concept cards linked from the Hit
 # Chance tooltip via their matching texticons.

 game_concept_pod_combat_guard: "Guard"
 game_concept_pod_combat_guard_with_icon: "@pod_combat_guard_icon!Guard"
 game_concept_pod_combat_guarding: "Guarding"
 game_concept_pod_combat_guarding_with_icon: "@pod_combat_guard_icon!Guarding"
 game_concept_pod_combat_guarded: "Guarded"
 game_concept_pod_combat_guarded_with_icon: "@pod_combat_guard_icon!Guarded"
 game_concept_pod_combat_guard_desc: "A #bold defensive stance#!. When an attack that checks Guard would otherwise land, it is converted into a blocked hit and deals no [POD_health_track|E] damage. Guard is consumed when it blocks that attack.\n\n#weak A move that ignores Guard can land without consuming it.#!"

 game_concept_pod_combat_dodge: "Dodge"
 game_concept_pod_combat_dodge_with_icon: "@pod_combat_dodge_icon!Dodge"
 game_concept_pod_combat_dodging: "Dodging"
 game_concept_pod_combat_dodging_with_icon: "@pod_combat_dodge_icon!Dodging"
 game_concept_pod_combat_dodged: "Dodged"
 game_concept_pod_combat_dodged_with_icon: "@pod_combat_dodge_icon!Dodged"
 game_concept_pod_combat_dodge_desc: "An #bold evasive stance#!. When an attack checks Dodge, it automatically misses regardless of the attacker's [pod_combat_hit_chance|E], and Dodge is consumed.\n\n#weak An Undodgeable move bypasses Dodge without consuming it; a move that Removes Dodge strips the stance before resolving.#!"

 game_concept_pod_combat_stealth: "Stealth"
 game_concept_pod_combat_stealth_with_icon: "@pod_combat_stealth_icon!Stealth"
 game_concept_pod_combat_stealthed: "Stealthed"
 game_concept_pod_combat_stealthed_with_icon: "@pod_combat_stealth_icon!Stealthed"
 game_concept_pod_combat_stealth_desc: "A #bold hidden stance#! that adds +30% [pod_combat_hit_chance|E] while active. Stealth ends at whichever happens first:\n$TAB$- The holder makes an HP attack or hostile contact move\n$TAB$- An incoming attack checks Stealth and automatically misses\n\nPure Morale attacks do not consume the attacker's Stealth.\n\n#weak An Undodgeable move bypasses Stealth without consuming it, while a move that Removes Stealth strips the stance before resolving its other effects.#!"


 game_concept_pod_combat_initiative: "Initiative"
 game_concept_pod_combat_init: "Init"
 game_concept_pod_combat_initiative_desc: "A roll made at the start of each combat round that determines [pod_combat_turn_order|E]. Higher initiative acts earlier.\n\nThe base roll draws from [prowess|E] and the combatant's splat; perks, traits, and move-applied initiative buffs or debuffs adjust the result. Faster combatants (supernatural speed disciplines, swift traits) can open with their attack before slower foes even react."

 game_concept_pod_combat_turn_order: "Turn Order"
 game_concept_pod_combat_turn: "Turn"
 game_concept_pod_combat_turn_order_desc: "The resolved order in which combatants act this round, numbered 1 (first) through N (last). Determined by each combatant's [pod_combat_initiative|E] roll at round start.\n\nTurn order resets and re-rolls every round, so a slow combatant may open one round first if their initiative roll is lucky — or if the fast combatant ate an initiative debuff last turn.\n\nIn fights of three or more, the round's order is laid out as a strip of portraits across the top of the combat window — the current actor is highlighted, and portraits dim once they have acted or fallen. Combatants who join mid-fight enter the order at the next round."


 ##############################
 ###### GAME CONCEPTS - damage types
 ##############################
 # Two distinct things wear the "damage" suffix:
 #
 #   1. Attack pipelines - Physical / Supernatural / Mental. These
 #      describe HOW an attack lands: which defenses it has to clear,
 #      whether it can miss, whether guard blocks it. Titled
 #      "X Attack" rather than "X Damage" because they're the
 #      delivery method, not the wound flavor.
 #   2. Damage flavors - Fire / Cold / Lightning / Sun / Silver /
 #      Gold / Holy / Balefire. These describe WHAT the wound is.
 #
 # Player-facing tone: outcomes the player will see in combat (auto-
 # hit, guard block, aggravated wound, double damage), not the names
 # of internal variables, triggers, or death-reasons. Splat names
 # (bushi, setite, mokole, etc.) are kept because the player meets
 # them as traits in PoD; "fera" and similar broad labels stand in
 # for the underlying trait checks.

 # ── Elemental damage flavors ──

 game_concept_fire_damage: "Fire Damage"
