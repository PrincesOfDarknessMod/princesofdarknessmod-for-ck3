 pod_combat_desc_hit_debuff_round:   "#medium;outline #N −[Concept('pod_combat_hit_chance','Hit chance')|E]#! (tier [story.MakeScope.Var('hit_debuff_round_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] this round#! $EFFECT_LIST_BULLET$"
