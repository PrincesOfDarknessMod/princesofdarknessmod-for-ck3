 pod_combat_desc_soak_debuff_round:  "#medium;outline #N −[Concept('soak_damage','Soak')|E]#! (tier [story.MakeScope.Var('soak_debuff_round_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] this round#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_soak_debuff_combat: "#medium;outline #N −[Concept('soak_damage','Soak')|E]#! (tier [story.MakeScope.Var('soak_debuff_combat_tier').GetValue|V0]) to [story.MakeScope.Var('targeting').GetFlagName] for the rest of combat#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_buff_round:     "#medium;outline #P +[Concept('pod_combat_hit_chance','Hit chance')|E]#! (tier [story.MakeScope.Var('hit_buff_round_tier').GetValue|V0]) this round#! $EFFECT_LIST_BULLET$"
