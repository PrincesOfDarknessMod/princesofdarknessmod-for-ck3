 ##############################
 ###### COMBAT LOG — COLUMN HEADERS + EMPTY STATE
 ##############################
 # Empty-state placeholder shown when no entries have been logged yet.
 # The redesigned combat log encodes structure visually (gold/red side
 # bar + actor-name tint + right-anchored result) rather than via
 # column headers, so the pod_combat_log_header_* keys are gone — the
 # row layout itself communicates what each segment is.
 pod_combat_log_empty:         "#italic Awaiting your command.#!"


 ##############################
 ###### COMBAT LOG — RESULT TEXT
 ##############################
 # 12 result variants + AoE intercept, dispatched by the
 # PODCombatLogResultText customizable_localization on the entry's
 # result flag. Amount interpolation pulls from a per-outcome field on
 # the entry:
 #   damage               → flag:hp_damage / hp_damage_retal / soaked_retal (HP damage rolled amount)
 #   heal_amount          → flag:hp_healed (HP heal restored amount)
 #   morale_damage_amount → flag:morale_damage
 #   morale_heal_amount   → flag:morale_healed
 # All four fields are captured by pod_combat_push_log_effect from
 # parallel `pod_combat_last_*_amount` workspace vars set by the
 # damage / heal pipelines.
 #
 # Riders (damage-source icon, heal rider, morale-damage rider,
 # morale-heal rider, buff rider) are NOT embedded in these loc
 # values — CK3 doesn't propagate saved scopes through nested
 # [GetPlayer.Custom('SubName')] calls, so the riders are invoked
 # as separate text_singles in the result-column hbox in
 # pod_combat_window.gui, each with its own AddScope chain. Each
 # rider's customizable_loc dispatches on scope:move / scope:entry /
 # scope:rcode (now a flag value, not an integer) and emits either
 # a styled snippet or empty. The wound-box icon at the end of the
 # hp_damage / hp_damage_retal / soaked_retal / hp_healed lines below
 # serves both roles (track classification + aggravated-vs-superficial)
 # so no separate aggravated marker is needed.
 #
 # flag:stealthed is the stealth-triggered auto-miss, distinct from
 # flag:dodged so the loc line links to the Stealth concept instead
 # of Dodge — same mechanic, different cause, different concept card.

 # Aesthetic conventions (lifted from DUEL-Refactor + PoD's vanilla
 # damage strings):
 #   * Damage amounts:   #N (red) bold + explicit `-` prefix
 #   * Heal amounts:     #P (green) bold + explicit `+` prefix
 #   * HP track:         wound-box icon wrapped in a
 #                       concept link so hover pops PoD's
 #                       Superficial / Aggravated Damage card
 #   * Morale:           "Morale" word concept-linked
 #   * Fail outcomes:    stance/concept icon + label where one fits
 #                       (Blocked → Guard icon, Dodged → Dodge icon,
 #                       Stealthed → Stealth icon), dimmed italic
 #                       when no icon fits (Missed)
 #   * Retaliation:      primary line shows our attack's damage; the
 #                       retaliation/soak fact rides as a dimmed
 #                       italic suffix
 # Net result: the column scans red-for-damage / green-for-heal /
 # blue-for-stat-label at a glance, and only the salient amount is
 # bolded — the unit label and metadata stay quiet.

 # HP-track outcomes (flag:hp_damage / hp_damage_retal / soaked_retal /
 # hp_healed) end in a wound-box icon rather than the "HP" word —
 # the icon itself signals which track the hit booked onto. The
 # dispatcher splits on damage_type / heal_type to pick the right
 # variant: bare-key is the superficial default, _aggravated is the
 # aggravated branch. Each box is concept-link-wrapped so hover pops
 # PoD's Superficial / Aggravated Damage card.
 #
 # Numeric outcomes lead with an italic verb prefix ("Dealt", "Took",
 # "Healed", "Restored") so the row reads as a sentence fragment rather
 # than just a bare number — the verb is dim italic so the eye still
 # lands on the bold colored magnitude. The magnitude carries its own
 # direction colour (#bold;N for negative / #bold;P for positive) which
 # is independent of the row-level ally/enemy POV signal (carried by
 # the side bar + actor-name tint upstream). Binary outcomes (Blocked /
 # Soaked / Missed / Dodged / Stealthed) use a short subject-verb phrase
 # ("Attack blocked …", "Attack missed …") for the same scan-as-a-tag
 # reason — they're not amount-bearing so they keep the verb styling
 # without an inner magnitude.
 pod_combat_log_result_text_hp_damage:               "#weak;italic Dealt#! #bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_result_text_hp_damage_aggravated:    "#weak;italic Dealt#! #bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_result_text_guard_blocked:           "#weak;italic Attack blocked with#! [Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E]"
 pod_combat_log_result_text_soaked:                  "#weak;italic Attack#! [Concept('soak_damage','soaked')|E]"
 pod_combat_log_result_text_missed:                  "#weak;italic Attack missed#!"
 pod_combat_log_result_text_dodged:                  "#weak;italic Attack dodged#! [Concept('pod_combat_dodge','@pod_combat_dodge_icon!')|E]"
 pod_combat_log_result_text_stealthed:               "#weak;italic Attack missed due to#! [Concept('pod_combat_stealth','@pod_combat_stealth_icon!Stealth')|E]"
 # hp_damage_retal — actor's hit landed AND the target retaliated. The
 # damage number is the actor's outgoing hit (entry.var:damage); the
 # trailing parenthetical "(target retaliated)" flags that a retaliation
 # event also fired this turn. Earlier wordings ("retaliated" alone,
 # "as retaliation") were misread as if the -X itself was the
 # retaliation hit on the actor — the explicit "target retaliated"
 # disambiguates direction (target is the only side that could
 # retaliate during the actor's offensive turn). Italic + parenthetical
 # styles the tag as an aside rather than a modifier on the damage.
 # Verb prefix "Dealt" matches the hp_damage baseline.
 pod_combat_log_result_text_hp_damage_retal:             "#weak;italic Dealt#! #bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic (target retaliated)#!"
 pod_combat_log_result_text_hp_damage_retal_aggravated:  "#weak;italic Dealt#! #bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic (target retaliated)#!"
 # Defensive fallback — fires when the original attack's damage is 0
 # but retaliation landed (rare; would mean flag:hp_damage_retal was
 # set without an actual hit registering through entry.var:damage).
 # Reads entry.var:retal_damage and labels the row as an incoming
 # retaliation hit against the actor. Verb prefix "Took" reflects the
 # inbound direction (actor took retaliation damage), distinguishing
 # it from the outbound "Dealt" used by the mainline above.
 pod_combat_log_result_text_hp_damage_retal_counter_only: "#weak;italic Took#! #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic from retaliation#!"
 # soaked_retal mainline branches. Symmetric to the hp_damage_retal
 # pair above: fires when the actor landed real damage AND a retaliation
 # was armed AND the retaliation's wound roll fully soaked. The
 # promote effect (pod_combat_promote_result_code_retaliation_effect)
 # reads pod_combat_last_result AFTER the retal damage call has
 # overwritten it, so "soaked" here refers to the RETALIATION being
 # soaked, not the original attack. entry.var:damage holds the
 # original's restored damage. Renders "Dealt -X HP, retaliation
 # soaked" with the appropriate wound-box icon by damage_type.
 pod_combat_log_result_text_soaked_retal:             "#weak;italic Dealt#! #bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic , retaliation soaked#!"
 pod_combat_log_result_text_soaked_retal_aggravated:  "#weak;italic Dealt#! #bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic , retaliation soaked#!"
 # Counter-only fallback for soaked_retal — fires when the original
 # attack didn't land damage (guard_blocked / soaked, so entry.damage = 0)
 # AND the retaliation was also soaked. Surfaces both events explicitly
 # instead of dropping the original-attack outcome.
 pod_combat_log_result_text_soaked_retal_counter_only: "#weak;italic Attack and retaliation both soaked#!"
 # utility primary renders empty — the buff/stance/tier/AP/retaliate/
 # init riders downstream of this widget already carry the full
 # content of what the move did, so a "Effect applied" lead-in would
 # just repeat boilerplate before the rider ("Effect applied, entered
 # Guard" → "entered Guard"). An audit confirmed every implemented
 # utility move triggers at least one rider — there is no truly no-op
 # move that would render an empty result column without a lead-in.
 # Note the buff dispatcher's riders below switched from a leading ", "
 # to a leading " " specifically to avoid an orphan comma in this case.
 pod_combat_log_result_text_utility:             ""
 pod_combat_log_result_text_morale_damage:       "#weak;italic Dealt#! #bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_result_text_hp_healed:           "#weak;italic Healed#! #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_result_text_hp_healed_aggravated: "#weak;italic Healed#! #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_result_text_morale_healed:       "#weak;italic Restored#! #bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_result_text_unknown:       "#weak —#!"
 # AoE damage rows. Read move.var:hp_damage rather than
 # entry.var:damage because per-target damage gets overwritten in
 # the AoE iteration loop — entry.var:damage is just the LAST
 # target's resolved value, often 0. The static hp_damage on the
 # move story is the design intent of the strike, so the row
 # consistently surfaces "this AoE was meant to deal X" regardless
 # of how the per-target rolls shook out. Suffix "AoE" marker is
 # italicised + dimmer to read as flavour rather than another stat.
 #
 # Saved-scope names appear bare inside loc strings (`move`, not
 # `scope:move`); the `scope:` prefix is script-side syntax and
 # the loc data binder rejects it as an unknown type.
 pod_combat_log_result_text_aoe:           "#weak;italic Dealt#! #bold;N -[move.MakeScope.Var('hp_damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic to area#!"
 pod_combat_log_result_text_aoe_aggravated: "#weak;italic Dealt#! #bold;N -[move.MakeScope.Var('hp_damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic to area#!"
 # Fallback for AoE moves with no hp_damage (pure morale / utility
 # team-target moves). Should be rare since most team-target moves
 # carry hp_damage.
 pod_combat_log_result_text_aoe_zero:      "#weak;italic Area effect applied#!"

 # ──────────────────────────────────────────────────────────────────
 # Result-line riders.
 #
 # Each `pod_combat_log_<…>_rider` / `_buff_<…>` key is the loc value
 # consumed by the matching customizable_loc dispatcher. Riders that
 # don't apply resolve to `pod_combat_log_blank` (empty string) so
 # the surrounding text stays clean.
 #
 # Stat reads inside rider strings go through the saved `move` scope:
 # `move.MakeScope.Var('hp_heal').GetValue` etc. (no `scope:` prefix
 # in loc-value reads — that's trigger-only syntax.)
 pod_combat_log_blank:                  ""

 # Riders read the actual rolled amount from the entry's parallel
 # _amount fields (set by push_log from pod_combat_last_heal_amount,
 # pod_combat_last_morale_damage_amount, pod_combat_last_morale_heal_amount)
 # rather than the move's static design value. So a heal that was
 # capped (target near full HP) reports the actual restored amount,
 # not the theoretical max.
 # Numeric riders — same red/green polarity convention as the result
 # text above. HP riders use the wound-box icon (matches the primary
 # result line); morale riders keep the "Morale" word since morale
 # lives off the HP track. Italic verb prefix ("healed" / "restored")
 # matches the result-text voice — the row reads as a continuation of
 # the primary fragment ("Dealt -7 [icon], healed +2 [icon]") instead
 # of an isolated comma-tag. morale_damage_rider stays verb-less to
 # avoid stuttering when the primary already starts with "Dealt"
 # (flag:hp_damage / hp_damage_retal); the leading minus sign and
 # red color carry the damage semantic on their own.
 # Heal rider has a parallel _aggravated variant the dispatcher picks
 # when move.heal_type = aggravated.
 pod_combat_log_heal_rider:             ", #weak;italic healed#! #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_heal_rider_aggravated:  ", #weak;italic healed#! #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_morale_damage_rider:    ", #bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_morale_heal_rider:      ", #weak;italic restored#! #bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"

 # Buff / debuff / status riders.
 # Stance changes embed the matching texticon and concept-link the
 # whole label so hovering pops the Guard / Dodge / Stealth card.
 # The polarity sign sits OUTSIDE the concept link so it can be
 # red/green-colored independently — concept links render in blue
 # and override color formatting inside their wrap.
 # Soak / Hit / Init concept-link their stat label (PoD's
 # `soak_damage` and our combat-specific `pod_combat_hit_chance` /
 # `pod_combat_initiative`) so hovering pops the matching card. AP
 # and the Retaliate-ready marker stay plain bold — no concept card
 # to point at.
 # Buff dispatcher riders — fire on utility moves (flag:utility,
 # primary text now empty) and on damage+buff hybrids (flag:hp_damage /
 # hp_damage_retal, primary text "Dealt -X [icon]"). They use a
 # leading " " (single space) for visual separation from the previous
 # widget instead of the leading ", " the numeric riders use.
 #
 # Why the asymmetry: numeric riders (heal/morale_damage/morale_heal)
 # ONLY fire alongside damage primaries — there's always a primary text
 # before them, and the comma flows the reader through the comma-list
 # ("Dealt -7 [icon], healed +2 [icon]"). The buff dispatcher's riders
 # frequently fire on flag:utility (where the primary is now empty),
 # so a leading "," would orphan-comma the row (", entered Guard"). Damage
 # +buff hybrids lose the comma separator ("Dealt -7 [icon] +20% Soak"
 # instead of "Dealt -7 [icon], +20% Soak"), but the wound-box icon and
 # color shift between primary and rider already provide a clear visual
 # break — and utility-only moves outnumber damage+buff hybrids by a
 # wide margin, so the trade favors the cleaner utility row.
 #
 # Stance riders use italic verb prefix ("entered" / "stripped target's")
 # matching the result-text voice and the numeric riders' "healed" /
 # "restored" prefixes. remove_guard drops the explicit `-` it used to
 # carry — the verb "stripped" already says "the target lost their stance".
 pod_combat_log_buff_set_guard:          " #weak;italic entered#! [Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E]"
 pod_combat_log_buff_dodge:              " #weak;italic entered#! [Concept('pod_combat_dodge','@pod_combat_dodge_icon!Dodge')|E]"
 pod_combat_log_buff_stealth:            " #weak;italic entered#! [Concept('pod_combat_stealth','@pod_combat_stealth_icon!Stealth')|E]"
 pod_combat_log_buff_remove_guard:       " #weak;italic stripped target's#! [Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E]"
 # Tier-buff/debuff riders read as natural sentence fragments —
 # "raised Soak by +30%" / "lowered target's Hit by -20%" — with the
 # stat-name concept link in the middle of the phrase and the
 # magnitude as a quantitative tail. Word order puts the action
 # (verb + stat) first so the player skimming the log sees what
 # changed before the by-how-much, then the magnitude bold-colored
 # at the end provides the precise number.
 #
 # The percentage comes from a script value
 # (pod_combat_move_<stat>_<dir>_mag_value in pod_combat_values.txt)
 # that resolves the move story's tier var (round or combat) to the
 # matching @combat_tier_*_mag constant (10/20/30). |0 keeps the
 # formatting integer-only and lets the surrounding #bold;P / #bold;N
 # coloring apply uniformly.
 #
 # Italic verb prefix (raised / lowered) matches the voice the other
 # riders set — "healed" / "restored" / "entered" / "stripped". The
 # verb is technically redundant with the +/- sign and the green/red
 # polarity coloring, but the redundancy reinforces direction (a
 # player skimming the log doesn't have to parse the sign to know
 # which way the stat shifted) and gives the row a uniform
 # sentence-fragment voice across all rider types.
 #
 # Buffs are silent on the recipient (the actor self-buffed — the
 # implicit "self" works fine); debuffs splice an italic "target's"
 # qualifier between the verb and the stat link so the player can
 # see at a glance that the minus didn't apply to the actor. Same
 # pattern remove_guard uses above.
 pod_combat_log_buff_soak_buff:          " #weak;italic raised#! [Concept('soak_damage','Soak')|E] #weak;italic by#! #bold;P +[move.MakeScope.ScriptValue('pod_combat_move_soak_buff_mag_value')|0]%#!"
 pod_combat_log_buff_soak_debuff:        " #weak;italic lowered target's#! [Concept('soak_damage','Soak')|E] #weak;italic by#! #bold;N -[move.MakeScope.ScriptValue('pod_combat_move_soak_debuff_mag_value')|0]%#!"
 pod_combat_log_buff_hit_buff:           " #weak;italic raised#! [Concept('pod_combat_hit_chance','Hit')|E] #weak;italic by#! #bold;P +[move.MakeScope.ScriptValue('pod_combat_move_hit_buff_mag_value')|0]%#!"
 pod_combat_log_buff_hit_debuff:         " #weak;italic lowered target's#! [Concept('pod_combat_hit_chance','Hit')|E] #weak;italic by#! #bold;N -[move.MakeScope.ScriptValue('pod_combat_move_hit_debuff_mag_value')|0]%#!"
 pod_combat_log_buff_ap_gain:            " #bold;P +AP#!"
 pod_combat_log_buff_ap_drain:           " #bold;N -AP#! #weak;italic next turn#!"
 pod_combat_log_buff_retaliate:          " #weak;italic retaliation armed#!"
 pod_combat_log_buff_initiative_debuff:  " #bold;N -#![Concept('pod_combat_initiative','Init')|E] #weak;italic next round#!"

 # ──────────────────────────────────────────────────────────────────
 # Damage-source markers (consumed by PODCombatDamageSourceMarker
 # customizable_loc). Each variant wraps its texticon in a Concept
 # link so the icon in the combat-log result column pops the matching
 # damage-type tooltip on hover. Concept descriptions live in the
 # game_concept_pod_combat_damage_<X>_desc keys further below;
 # concept definitions in devpod/common/game_concepts/pod_combat_concepts.txt.
 #
 # Balefire is the only remaining flavor still using a stand-in PoD
 # asset (wyrm faith icon) AND linking to PoD's pre-existing
 # `balefire` concept rather than a combat-specific one — keeps it
 # aligned with the broader Wyrm/spirit lore in the rest of PoD.
 #
 # The dispatcher branches off `var:damage_source` (fire / cold /
 # lightning / sun / silver / gold / holy / balefire) — one elemental
 # icon per source. Moves without a damage_source fall through to
 # `_blank` (empty string) rather than emitting a generic
 # "this is an attack" glyph: that placeholder added noise without
 # telling the player anything the move name + tooltip didn't already
 # convey. The pipeline shape (Physical / Supernatural / Mental) is
 # NOT used as a marker key — the runtime sees emitted capability
 # flags, not a generic attack-type, so there's nothing to dispatch on.
 #
 # Each non-blank value starts with a leading space so the elemental
 # icon stays detached from the wound-box glyph that ends the result
 # text — the column reads "-5 [box] [fire]" with breathing room
 # between the damage number and its elemental tag. Blank stays bare
 # so it collapses to nothing when the dispatcher routes there.
 pod_combat_damage_source_fire:         " [Concept('pod_combat_damage_fire','@pod_combat_fire_icon!')]"
 pod_combat_damage_source_cold:         " [Concept('pod_combat_damage_cold','@pod_combat_cold_icon!')]"
 pod_combat_damage_source_lightning:    " [Concept('pod_combat_damage_lightning','@pod_combat_lightning_icon!')]"
 pod_combat_damage_source_sun:          " [Concept('pod_combat_damage_sun','@pod_combat_sun_icon!')]"
 pod_combat_damage_source_silver:       " [Concept('pod_combat_damage_silver','@pod_combat_silver_icon!')]"
 pod_combat_damage_source_gold:         " [Concept('pod_combat_damage_gold','@pod_combat_gold_icon!')]"
 pod_combat_damage_source_holy:         " [Concept('pod_combat_damage_holy','@pod_combat_holy_icon!')]"
 pod_combat_damage_source_balefire:     " [Concept('balefire','@pod_combat_balefire_icon!')]"
 pod_combat_damage_source_blank:        ""

 # ──────────────────────────────────────────────────────────────────
 # Target column dispatch (PODCombatLogTargetText). Single-target
 # moves render the target's first name; AoE moves render an "AoE
 # Enemies / Allies" label so the column reads at a glance whether
 # the row hit one combatant or a whole side. `_self` covers
 # self-targeted moves where the actor and target columns would
 # otherwise duplicate the same name.
 # ── Combat-log "actor → target" segment ─────────────────────
 # PODCombatLogTargetText resolves to one of these per row,
 # rendering the inline "→ <target>" handoff between the actor
 # name and the action name. Self / no-target / move-less cases
 # collapse to empty (the new log layout drops the "Self" word
 # entirely — an action with no arrow IS self-targeted by
 # implication, freeing visual real estate). Single-target +
 # AoE branches all lead with the same "  →  " separator
 # (two spaces flanking the arrow keeps it visually anchored
 # between the actor and target words).
 # Arrow style: `#F` (flavor = low/dark-gray, NOT italic) instead of
 # `#weak` (low + italic) so the arrow reads as a clean connector
 # glyph rather than an italic word — matches the mockup's neutral
 # `.arrow { color: #6f7280 }` styling. Two spaces around the arrow
 # give it breathing room between actor and target.
 pod_combat_log_target_aoe_enemies: "  #F →#! #bold All enemies#!"
 pod_combat_log_target_aoe_allies:  "  #F →#! #bold All allies#!"
 pod_combat_log_target_self:        ""
 pod_combat_log_target_single:      "  #F →#! #bold [entry.MakeScope.Var('target').GetCharacter.GetFirstNameNoTooltip]#!"
 pod_combat_log_target_none:        ""

 # ── Compact-card basic-effect lines ──────────────────────────
 # One-line glanceable summary of a move's primary action, used
 # by the skills window's compact pool list (the middle column
 # of each row, between the name and the AP / equipped checkbox).
 # PODCombatMoveBasicEffectInline dispatches on the move's
 # primary effect var; each branch resolves to one of the keys
 # below. Bypass / always-hit / retaliation extras are
 # intentionally absent — the hover tooltip carries the full
 # detail, this is the glanceable summary.
 #
 # Saved-scope reference is bare `story` (not `scope:story`) since
 # loc-file Var reads use the bareword form — the `scope:` prefix
 # is script-side syntax that the loc parser rejects.
 pod_combat_basic_effect_hp_damage:     "#weak Deal#! #bold;N [story.MakeScope.Var('hp_damage').GetValue|0]#! #weak damage#!"
 pod_combat_basic_effect_hp_heal:       "#weak Heal#! #bold;P +[story.MakeScope.Var('hp_heal').GetValue|0]#!"
 pod_combat_basic_effect_morale_damage: "#bold;N -[story.MakeScope.Var('morale_damage').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_basic_effect_morale_heal:   "#weak Restore#! #bold;P +[story.MakeScope.Var('morale_heal').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_basic_effect_set_guard:     "#weak Enter#! [Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E]"
 pod_combat_basic_effect_dodge:         "#weak Enter#! [Concept('pod_combat_dodge','@pod_combat_dodge_icon!Dodge')|E]"
 pod_combat_basic_effect_stealth:       "#weak Enter#! [Concept('pod_combat_stealth','@pod_combat_stealth_icon!Stealth')|E]"
 pod_combat_basic_effect_remove_guard:  "#weak Strip target's#! [Concept('pod_combat_guard','Guard')|E]"
 pod_combat_basic_effect_ap_gain:       "#bold;P +AP#!"
 pod_combat_basic_effect_ap_drain:      "#bold;N -AP#! #weak next turn#!"
 pod_combat_basic_effect_hit_buff:      "#weak Raise#! [Concept('pod_combat_hit_chance','Hit')|E]"
 pod_combat_basic_effect_hit_debuff:    "#weak Lower target's#! [Concept('pod_combat_hit_chance','Hit')|E]"
 pod_combat_basic_effect_soak_buff:     "#weak Raise#! [Concept('soak_damage','Soak')|E]"
 pod_combat_basic_effect_soak_debuff:   "#weak Lower target's#! [Concept('soak_damage','Soak')|E]"
 pod_combat_basic_effect_init_debuff:   "#weak -#![Concept('pod_combat_initiative','Init')|E] #weak next round#!"
 pod_combat_basic_effect_blank:         ""

