 # Retaliation stance tooltips. Runtime fallback chain for the
 # counter-damage amount: explicit retaliate_damage var -> reuse the
 # move's hp_damage var -> default 1 (defensive). Kind variants match
 # the arming precedence in pod_combat_arm_retaliation_effect
 # (morale > retaliate_agg > the move's elemental class > superficial);
 # the bare "Retaliate when hit/missed" keys at the bottom are the
 # fallback when the move sets neither retaliate_damage nor hp_damage
 # (rare - author error path).
 #
 # An elemental damage class DOES type the counter-strike: the counter
 # reuses the move's class and rides its death_reason through PoD's
 # weakness pipeline. Element labels are inlined per key (colored
 # concept word, no box - PoD decides aggravated-ness per victim) to
 # avoid vanilla flag-loc collisions.
 pod_combat_desc_retaliate_if_hit_explicit_sup:    "#medium;outline #N Counter for#! #bold [story.MakeScope.Var('retaliate_damage').GetValue|V0]#! $superficial$ #N Damage#! when hit#!"
 pod_combat_desc_retaliate_if_hit_explicit_agg:    "#medium;outline #N Counter for#! #bold [story.MakeScope.Var('retaliate_damage').GetValue|V0]#! $aggravated$ #N Damage#! when hit#!"
 pod_combat_desc_retaliate_if_hit_explicit_morale: "#medium;outline #N Counter for#! #bold [story.MakeScope.Var('retaliate_damage').GetValue|V0]#! [pod_combat_morale|E] #N when hit#!"
 pod_combat_desc_retaliate_if_hit_explicit_elemental: "#medium;outline #N Counter for#! #bold [story.MakeScope.Var('retaliate_damage').GetValue|V0]#! [Localize( Concatenate( 'pod_combat_damage_type_', story.MakeScope.Var('damage_type').GetFlagKey ) )] #N Damage#! when hit#!"

 pod_combat_desc_retaliate_if_hit_reuse_sup:       "#medium;outline #N Counter for#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! $superficial$ #N Damage#! when hit#!"
 pod_combat_desc_retaliate_if_hit_reuse_agg:       "#medium;outline #N Counter for#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! $aggravated$ #N Damage#! when hit#!"

