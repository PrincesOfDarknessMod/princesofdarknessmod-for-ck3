 pod_combat_mod_scope_combat: "(combat)"
 pod_combat_stats_tt_title:               "Combat Stats"
 pod_combat_stats_tt_hit:                 "[pod_combat_hit_chance|E]: #bold [GuiScope.SetRoot(Scope.Story.MakeScope).Custom('PODCombatSlotHitDisplay')]#!"
 pod_combat_stats_tt_hit_buff_round:      "#P +[Scope.ScriptValue('pod_combat_slot_hit_buff_round_mag_sv')|0]% $pod_combat_mod_scope_round$#!"
