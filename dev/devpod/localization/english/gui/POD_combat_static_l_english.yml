 ##############################
 ###### COMBAT LOG - COLUMN HEADERS + EMPTY STATE
 ##############################
 # Empty-state placeholder shown when no entries have been logged yet.
 # The combat log encodes structure visually (gold/red side bar +
 # actor-name tint + right-anchored result); no column headers.
 pod_combat_log_empty:         "#italic Awaiting your command.#!"


 ##############################
 ###### COMBAT LOG - RESULT TEXT
 ##############################
 # Three-axis result dispatch via PODCombatLogResultText on the entry's
 # outcome / attack_result vars (COMBAT_REFERENCE.info §4). Amount fields
 # (damage / heal_amount / morale_*_amount / retal_damage) are captured
 # by push_log from parallel pod_combat_last_*_amount workspace vars.
 # Riders are separate text_singles in pod_combat_window.gui (CK3 can't
 # propagate scopes through nested Custom() calls).
 pod_combat_log_result_text_hp_damage:               "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_result_text_hp_damage_aggravated:    "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 # Partial-soak variants: soak rolls per point, so some of the packet landed and
 # the rest was absorbed. The weak-italic note sits next to the number it explains.
 # A fully soaked hit renders the bold Soaked outcome above instead.
 pod_combat_log_result_text_hp_damage_partial_soak:            "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic [entry.MakeScope.Var('soaked_count').GetValue|0] soaked#!"
 pod_combat_log_result_text_hp_damage_aggravated_partial_soak: "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic [entry.MakeScope.Var('soaked_count').GetValue|0] soaked#!"
 pod_combat_log_result_text_guard_blocked:           "#bold Blocked#!"
 pod_combat_log_result_text_soaked:                  "#bold Soaked#!"
 pod_combat_log_result_text_immune:                  "#bold Immune#!"
 pod_combat_log_result_text_missed:                  "#bold Missed#!"
 pod_combat_log_result_text_dodged:                  "#bold Dodged#!"
 pod_combat_log_result_text_stealthed:               "#bold Stealthed#!"
 # Retaliation rider - emitted by PODCombatLogRetalRider as a separate
 # result-column text_single (not a primary outcome) when the row's
 # entry.var:retal_fired was set during push_log. Clean overlay on the
 # three-axis model: magnitude-first, wound-box resource label, italic
 # "counter" tag; soaked variant drops the magnitude. The aggravated
 # variant keys on entry.var:retal_agg - stamped from PoD's ACTUAL
 # per-victim classification of the counter, not the armed kind.
 pod_combat_log_retal_rider:            " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')] #weak;italic counter#!"
 pod_combat_log_retal_rider_aggravated: " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')] #weak;italic counter#!"
 pod_combat_log_retal_rider_soaked:     " #weak;italic counter#! #bold Soaked#!"
 pod_combat_log_retal_rider_morale:     " #bold;N -[entry.MakeScope.Var('retal_damage').GetValue|0]#! [Concept('pod_combat_morale','@stress_icon!')|E] #weak;italic counter#!"
 # utility primary renders empty - the buff/stance/tier/AP/retaliate/
 # init riders downstream of this widget already carry the full
 # content of what the move did, so a "Effect applied" lead-in would
 # just repeat boilerplate before the rider ("Effect applied, entered\n # Guard" -> "entered Guard"). An audit confirmed every implemented
 # utility move triggers at least one rider - there is no truly no-op
 # move that would render an empty result column without a lead-in.
 # Note the buff dispatcher's riders below switched from a leading ", "
 # to a leading " " specifically to avoid an orphan comma in this case.
 pod_combat_log_result_text_utility:             ""
 pod_combat_log_result_text_morale_damage:       "#bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_result_text_hp_healed:           "#bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_result_text_hp_healed_aggravated: "#bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_result_text_morale_healed:       "#bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_result_text_unknown:       "#weak —#!"

 # System-message rows - pushed by pod_combat_push_system_log_effect
 # at combat-lifecycle bookend points (start / victory / defeat).
 # Em-dash flanking reads as a clear "this isn't an actor action" so the
 # eye doesn't try to parse them as a regular log row. (Square brackets
 # can't appear as literal text - CK3's loc parser treats `[...]` as a
 # data-binding expression and rejects free-form text inside.)
 # Combat-start keeps neutral weight; combat-end uses the polarity-color
 # convention (P green for player victory, N red for defeat) to telegraph
 # the outcome at a glance from the log row alone.
 pod_combat_log_system_combat_started:        "#italic — Combat begins —#!"
 pod_combat_log_system_combat_ended_victory:  "#bold;P — Combat ends · Victory —#!"
 pod_combat_log_system_combat_ended_defeat:   "#bold;N — Combat ends · Defeat —#!"
 # Round transition. Round number pulled off entry.var:round which
 # push_system_log_effect captures from the host's pod_combat_round
 # at push time, so the message persists the correct round even as
 # later actions push more rows. Bold weight makes the transition
 # marker easy to find when scrolling back through a long combat.
 pod_combat_log_system_round_begins:          "#italic — Round #bold [entry.MakeScope.Var('round').GetValue|0]#! begins —#!"
 pod_combat_log_system_unknown:               "#weak —#!"

 # ──────────────────────────────────────────────────────────────────
 # Result-line riders.
 #
 # Each `pod_combat_log_<x>_rider` / `_buff_<x>` key is the loc value
 # consumed by the matching customizable_loc dispatcher. Riders that
 # don't apply resolve to `pod_combat_log_blank` (empty string) so
 # the surrounding text stays clean.
 #
 # Stat reads inside rider strings go through the saved `move` scope:
 # `move.MakeScope.Var('hp_heal').GetValue` etc. (no `scope:` prefix
 # in loc-value reads - that's trigger-only syntax.)
 pod_combat_log_blank:                  ""

 # Numeric riders read the actual rolled amount from the entry's
 # parallel _amount fields (so a capped heal reports what was actually
 # restored). Bodies are BARE - magnitude + resource label only; the
 # The middot separator is GUI-owned (pod_combat_window.gui). Heal rider has
 # an _aggravated variant picked when move.heal_type = aggravated. 
 pod_combat_log_heal_rider:             " #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_superficial_damage','@health_track_damage_icon!')]"
 pod_combat_log_heal_rider_aggravated:  " #bold;P +[entry.MakeScope.Var('heal_amount').GetValue|0]#! [Concept('POD_aggravated_damage','@health_track_aggravated_damage_icon!')]"
 pod_combat_log_morale_damage_rider:    " #bold;N -[entry.MakeScope.Var('morale_damage_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"
 pod_combat_log_morale_heal_rider:      " #bold;P +[entry.MakeScope.Var('morale_heal_amount').GetValue|0]#! [Concept('pod_combat_morale','Morale')|E]"

 # Buff / debuff / status riders. Stance changes use arrow notation
 # (-> Guard / -> Dodge / -> Stealth / -> Retaliate); remove_guard reads
 # "Guard broken" (state EXIT on the target). Polarity sign sits
 # OUTSIDE the concept link so it colors independently. Bodies are
 # BARE; separator GUI-owned.
 pod_combat_log_buff_set_guard:          "→ [Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E]"
 pod_combat_log_buff_dodge:              "→ [Concept('pod_combat_dodge','@pod_combat_dodge_icon!Dodge')|E]"
 pod_combat_log_buff_stealth:            "→ [Concept('pod_combat_stealth','@pod_combat_stealth_icon!Stealth')|E]"
 pod_combat_log_buff_remove_guard:       "[Concept('pod_combat_guard','@pod_combat_guard_icon!Guard')|E] #weak;italic broken#!"
 # Tier-buff/debuff riders: magnitude-first ("+20% Soak"). Percentage
 # comes from pod_combat_move_<stat>_<dir>_mag_value (pod_combat_values.txt)
 # resolving the move's tier var to the pod_combat_tier_*_mag script value
 # (10/20/30). Stat-name concept-linked as the resource label.
 pod_combat_log_buff_soak_buff:          " #bold;P +[move.MakeScope.ScriptValue('pod_combat_move_soak_buff_mag_value')|0]%#! [Concept('soak_damage','Soak')|E]"
 pod_combat_log_buff_soak_debuff:        " #bold;N -[move.MakeScope.ScriptValue('pod_combat_move_soak_debuff_mag_value')|0]%#! [Concept('soak_damage','Soak')|E]"
 pod_combat_log_buff_hit_buff:           " #bold;P +[move.MakeScope.ScriptValue('pod_combat_move_hit_buff_mag_value')|0]%#! [Concept('pod_combat_hit_chance','Hit')|E]"
 pod_combat_log_buff_hit_debuff:         " #bold;N -[move.MakeScope.ScriptValue('pod_combat_move_hit_debuff_mag_value')|0]%#! [Concept('pod_combat_hit_chance','Hit')|E]"
 # AP gain/drain read the integer var off the move story (magnitude-first,
 # AP resource label). Retaliate uses arrow notation. initiative_debuff is
 # a bare "-" marker with NO magnitude - the next-round init penalty is a
 # fixed flag, not a tracked amount. ap_drain and initiative_debuff carry
 # "next turn" / "next round" tags.
 pod_combat_log_buff_ap_gain:            " #bold;P +[move.MakeScope.Var('ap_gain').GetValue|0] AP#!"
 pod_combat_log_buff_ap_drain:           " #bold;N -[move.MakeScope.Var('ap_drain').GetValue|0] AP#! #weak;italic next turn#!"
 pod_combat_log_buff_retaliate:          " → #weak;italic Retaliate#!"
 pod_combat_log_seg_retal_armed_morale:  " → #weak;italic Retaliate#!$pod_combat_damage_source_morale$"
 pod_combat_log_seg_retal_armed_agg:     " → #weak;italic Retaliate#! $aggravated$"
 pod_combat_log_seg_retal_armed_fire:    " → #weak;italic Retaliate#! $pod_combat_elemmark_fire$"
 pod_combat_log_seg_retal_armed_cold:    " → #weak;italic Retaliate#! $pod_combat_elemmark_cold$"
 pod_combat_log_seg_retal_armed_lightning: " → #weak;italic Retaliate#! $pod_combat_elemmark_lightning$"
 pod_combat_log_seg_retal_armed_sun:     " → #weak;italic Retaliate#! $pod_combat_elemmark_sun$"
 pod_combat_log_seg_retal_armed_silver:  " → #weak;italic Retaliate#! $pod_combat_elemmark_silver$"
 pod_combat_log_seg_retal_armed_gold:    " → #weak;italic Retaliate#! $pod_combat_elemmark_gold$"
 pod_combat_log_seg_retal_armed_holy:    " → #weak;italic Retaliate#! $pod_combat_elemmark_holy$"
 pod_combat_log_seg_stun:                " #bold;N Stuns#! #weak;italic next turn#!"
 pod_combat_log_seg_recoil:              " #bold;N -[entry.MakeScope.Var('self_damage').GetValue|0]#! $superficial$ #weak;italic recoil#!"
 pod_combat_log_buff_initiative_debuff:  " #bold;N -#![Concept('pod_combat_initiative','Init')|E] #weak;italic next round#!"
 # Energy bonus segments: amounts come off the log ENTRY (stamped only when
 # the bonus actually applied), splat-agnostic units, plain "energy" word
 # matching the stat card's bonus lines.
 pod_combat_log_seg_energy_gain:         " #bold;P +[entry.MakeScope.Var('energy_gain').GetValue|0] energy#!"
 pod_combat_log_seg_energy_drain:        " #bold;N -[entry.MakeScope.Var('energy_drain').GetValue|0] energy#! #weak;italic drained#!"

