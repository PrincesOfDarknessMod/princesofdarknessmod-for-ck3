 # Stance-related lines link Guard / Dodge / Stealth to their concept
 # cards (defined in the GAME CONCEPTS - combat stances block below).
 # Hover gives the full mechanic; matches the visual vocabulary the
 # combat log already uses for the matching result rows.
 pod_combat_desc_set_guard:         "#medium;outline Enter [Concept('pod_combat_guard','Guard')|E] stance (blocks next physical attack)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_dodge:             "#medium;outline Enter [Concept('pod_combat_dodge','Dodge')|E] stance (negates next attack)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_stealth:           "#medium;outline Enter [Concept('pod_combat_stealth','Stealth')|E] (+30 hit, consumed on attack/hit)#! $EFFECT_LIST_BULLET$"
 # Grant framing for the ally-targeted routing - see the tier-buff _other keys.
 # Stealth has no ally-targeted move today, but §12b broadcasts it to every
 # ally slot, so the variant exists rather than silently regressing later.
 pod_combat_desc_set_guard_other:   "#medium;outline Grant [Concept('pod_combat_guard','Guard')|E] stance to [story.MakeScope.Var('targeting').GetFlagName] (blocks next physical attack)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_dodge_other:       "#medium;outline Grant [Concept('pod_combat_dodge','Dodge')|E] stance to [story.MakeScope.Var('targeting').GetFlagName] (negates next attack)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_stealth_other:     "#medium;outline Grant [Concept('pod_combat_stealth','Stealth')|E] to [story.MakeScope.Var('targeting').GetFlagName] (+30 hit, consumed on attack/hit)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_bypass_guard:      "#medium;outline Ignores [Concept('pod_combat_guard','Guard')|E] on [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 # "Removes" matches the runtime semantic: the contact prelude deletes the
 # target's stance variable (pod_combat_move_effects.txt §5) so the stance is
 # consumed for any follow-up attack, not just this one. Kept distinct from
 # the capability-driven "Undodgeable" callout above (which fires on
 # NOT has_variable = checks_stance), where the stance stays in place but
 # the move bypasses its evasion.
 pod_combat_desc_bypass_dodge:      "#medium;outline Removes [Concept('pod_combat_dodge','Dodge')|E] from [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_bypass_stealth:    "#medium;outline Removes [Concept('pod_combat_stealth','Stealth')|E] from [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
