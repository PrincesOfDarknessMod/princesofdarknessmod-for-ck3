 # no damage concept, so it falls back to the GetFlagName word.
 pod_combat_elemmark_fire:      "[Concept('pod_combat_damage_fire','@pod_combat_fire_icon!')]"
 pod_combat_elemmark_cold:      "[Concept('pod_combat_damage_cold','@pod_combat_cold_icon!')]"
 pod_combat_elemmark_lightning: "[Concept('pod_combat_damage_lightning','@pod_combat_lightning_icon!')]"
 pod_combat_elemmark_sun:       "[Concept('pod_combat_damage_sun','@pod_combat_sun_icon!')]"
 pod_combat_elemmark_silver:    "[Concept('pod_combat_damage_silver','@pod_combat_silver_icon!')]"
 pod_combat_elemmark_gold:      "[Concept('pod_combat_damage_gold','@pod_combat_gold_icon!')]"
 pod_combat_elemmark_holy:      "[Concept('pod_combat_damage_holy','@pod_combat_holy_icon!')]"

 # DoT move-desc line (skill-bar tooltip); PODCombatMoveDesc appends it for any move carrying dot_rounds.
 pod_combat_desc_dot:                   "#medium;outline #N Damage over time -#! #bold [story.MakeScope.Var('dot_amount').GetValue|V0]#! @pod_combat_dot_icon! #N per round for#! #bold [story.MakeScope.Var('dot_rounds').GetValue|V0]#! #N rounds#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_mind_control:         "#medium;outline #N Mind control -#! steals the target's next turn #weak;italic (resisted by strong mental defenses unless the caster bypasses them; players are immune)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_summon:               "#medium;outline #P Summon -#! calls a new combatant to fight on your side#! $EFFECT_LIST_BULLET$"

