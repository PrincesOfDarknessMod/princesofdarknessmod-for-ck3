l_simp_chinese:
 judge_land_decision:0 "地方判官"
 judge_land_decision_tooltip:1 "你对人民有责任。"
 judge_land_decision_desc:0 "作为半月狼，你代表着古老的法律。因此，你是狼人和凡人之间的传统和尊重的堡垒。"
 judge_land_decision_confirm:0 "兼听则明"
 judge_land_modifier:0 "地方判官"
 judge_land_modifier_desc:0 "半月狼最近处理了这地区的法律问题，确保对无辜者的公平审判和对罪犯的迅速处决。"
 prospering_populace_modifier:0 "繁荣的民众"
 prospering_populace_modifier_desc:0 "半月狼正在在这地区确保每个人都得到他应得的东西，并共同合作。"
 force_duel_criminals_interaction.death.tt:0 "生死决斗"
 POD_werewolves_pack.1.t:0 "你的战群"
 POD_werewolves_pack.1.opening:0 "目前，你的[coterie_werewolf|E]成员为：\n"
 POD_werewolves_pack.1.packmember_1:0 "[packmember_1.GetName]\n"
 POD_werewolves_pack.1.packmember_2:0 "[packmember_2.GetName]\n"
 POD_werewolves_pack.1.packmember_3:0 "[packmember_3.GetName]\n"
 POD_werewolves_pack.1.packmember_4:0 "[packmember_4.GetName]\n"
 POD_werewolves_pack.1.ending:0 "作为战群首领，你有权选择在未来几年如何训练，或专注于哪个活动。\n请注意，一旦你的战群满了，你将被允许选择一样图腾来祝福你的团伙。"
 POD_werewolves_pack.1.option.a:0 "是时候拼搏了！"
 werewolf_pack_prowess_tt:0 "对你有职位好感且在外交范围内的[coterie_werewolf|E]成员们也将获得这一奖励。"
 POD_werewolves_pack.1.option.z:0 "目前什么也不做"
 POD_werewolves_pack.1.option.b:0 "让我们一起进行诸灵的任务。"
 POD_werewolves_pack.1.option.c:0 "我们必须遏制人类的发展"
 ww_pack_rampage_modifier:0 "暴走战群"
 ww_pack_rampage_modifier_desc:0 "狼人战群在他们阿尔法的首都周围狂暴，给当地的凡人带来恐惧。"
 werewolf_pack_rampage_tt:0 "你的[coterie_werewolf|E]将获得同个修正。"
 POD_werewolves_pack.1.option.d:0 "我们必须为战争做好准备！"
 ww_pack_war_modifier:0 "待战战群"
 ww_pack_war_modifier_desc:0 "狼人战群已准备好作战。"
 werewolf_pack_totem_tt:0 "你将为你的[coterie_werewolf|E]祈求一个图腾，这对该角色来说是一生一次的选择。"
 POD_werewolves_pack.1.option.e:0 "我们必须向诸灵祈求它们的祝福。"
 POD_werewolves_pack.2.t:0 "灵之庇护"
 POD_werewolves_pack.2.desc:0 "在狼族和大多数其他化形者中，图腾是族群的基本约束力之一。图腾是一种强大的灵，它将自己的力量借给一群有神秘亲和的个体，以换取一些象征性的服务或贡品。图腾的选择对狼群来说极为重要，因为这种精神将在需要的时候保护他们，并作为狼族的指路明灯。\n此选择允许向图腾灵请愿，然后由图腾灵决定是否收养战群成员作为其“孩子”。"
 werewolf_pack_totem_choice_tt:0 "你的[coterie_werewolf|E]成员若如果还没有图腾，则将也从该修正中受益。"
 POD_werewolves_pack.2.option.a:0 "坚强而高贵的猎鹰"
 falcon_totem_modifier:0 "战群图腾：猎鹰"
 falcon_totem_modifier_desc:0 "猎鹰憎恨懦夫，如果有必要，他会亲自攻击他们。"
 POD_werewolves_pack.2.option.b:0 "狡猾和睚眦必报的雷公"
 grandfatherthunder_totem_modifier:0 "战群图腾：雷公"
 grandfatherthunder_totem_modifier_desc:0 "雷公教导人们要有耐心和谨慎的进行计谋，但他对软弱的统治者毫不留情。"
 POD_werewolves_pack.2.option.c:0 "大自然的爱与怒，牡鹿"
 stag_totem_modifier:0 "战群图腾：牡鹿"
 stag_totem_modifier_desc:0 "牡鹿是大自然的完美化身，对朋友充满爱意和关怀，但对敌人却可怕而无情。"
 POD_werewolves_pack.2.option.d:0 "嗜血的大芬里斯"
 fenris_totem_modifier:0 "战群图腾：大芬里斯"
 fenris_totem_modifier_desc:0 "大芬里斯总是浑身浴血，并期望他的孩子们也是如此。"
 POD_werewolves_pack.2.option.e:0 "奇原的守护者，天马"
 pegasus_totem_modifier:0 "战群图腾：天马"
 pegasus_totem_modifier_desc:0 "天马和她的女儿们保护神圣的仪式不受人类的伤害。"
 POD_werewolves_pack.2.option.f:0 "幸存者，蟑螂"
 cockroach_totem_modifier:0 "战群图腾：蟑螂"
 cockroach_totem_modifier_desc:0 "时间在蟑螂一边。最终，他的孩子们将是最后还存活着的人。"
 POD_werewolves_pack.2.option.g:0 "沉默而神秘的猫头鹰"
 owl_totem_modifier:0 "战群图腾：猫头鹰"
 owl_totem_modifier_desc:0 "猫头鹰的孩子们预见到了许多，但他们只向那些真正倾听的人透露他们的秘密。"
 POD_werewolves_pack.2.option.h:0 "好奇的渡鸦"
 raven_totem_modifier:0 "战群图腾：渡鸦"
 raven_totem_modifier_desc:0 "渡鸦用对食物、知识和财富的无止境的渴望带着他的孩子们前进。"
 POD_werewolves_pack.2.option.i:0 "无数的老鼠"
 rat_totem_modifier:0 "战群图腾：老鼠"
 rat_totem_modifier_desc:0 "老鼠有一支军队供他支配。很少有，如果有的话，能与他无数的步兵相比。"
 POD_werewolves_pack.1.option.f:0 "妖蛆肯定注意到了我们！"
 POD_werewolves_pack.3.option.a:0 "睿智的黑暗真菌"
 darkfungus_totem_modifier:0 "战群图腾：黑暗真菌"
 darkfungus_totem_modifier_desc:0 "唯一足够强大到在黑螺旋中生存的植物，为它的孩子们赐予了幻象。然而，并不是所有都受到欢迎。"
 POD_werewolves_pack.3.option.b:0 "格鲁奥格，腐化之舞"
 glouogh_totem_modifier:0 "战群图腾：格鲁奥格"
 glouogh_totem_modifier_desc:0 "格鲁奥格是一个不断变化的恐怖球体，只要它出现，就会产生一些最可怕的妖蛆生物。"
 POD_werewolves_pack.3.option.c:0 "堕落者，绿龙"
 greendragon_totem_modifier:0 "战群图腾：绿龙"
 greendragon_totem_modifier_desc:0 "绿龙曾经是白嚎的保护者，它和他们一样误入歧途，至今仍在继续保佑它的堕落的孩子们。"
 POD_werewolves_pack.3.option.d:0 "哈卡肯，恐惧之心"
 hakaken_totem_modifier:0 "战群图腾：哈卡肯"
 hakaken_totem_modifier_desc:0 "偏执和骄傲是哈卡肯追随者的两大属性。他们通过这些工具传播他们堕落灵君的话语。"
 POD_werewolves_pack.3.t:0 "灵之庇护"
 POD_werewolves_pack.3.desc:0 "在狼族和大多数其他化形者中，图腾是战群的基本约束力之一。图腾是一种强大的灵，它将自己的力量借给一群对神秘有亲和力者，以换取一些象征性的服务或贡品。图腾的选择对战群来说极为重要，因为该灵将在需要的时候保护他们，并成为狼族的指路明灯。\n这选择的作用是向图腾灵请愿，然后由图腾灵决定是否收养战群成员作为其“孩子”。"
 werewolf_pack_tribesgifts_tt:0 "你的战群越强大（勇武方面），你将获得更多的部族生活经验。"
 POD_werewolves_pack.1.option.g:0 "也许是共同的诸灵任务？"
 griffin_totem_modifier:0 "战群图腾：狮鹫"
 unicorn_totem_modifier:0 "战群图腾：独角兽"
 chimaera_totem_modifier:0 "战群图腾：奇美拉"
 POD_werewolves_pack.1.option.h:0 "获取一件普通灵具的任务"
 auspice_renunciation_decision:0 "舍弃月兆"
 auspice_renunciation_decision_tooltip:1 "你将重选你的月兆。"
 auspice_renunciation_decision_desc:0 "在这罕见的仪式中，狼人拒绝他出生自带的月兆并选择了一个新的月兆。狼族必须在他希望采用的月相中举行这一仪式。最常见的是，将暴露在月光下的银盆中的水倒在赤身裸体的祈求者身上，把他曾经的一切都洗干净。他现在可以自由地作为他所采用的月兆狼的成员重新开始。"
 auspice_renunciation_decision_confirm:0 "变换月相"
 POD_werewolves_pack.10.t:0 "兽妖兆相"
 POD_werewolves_pack.10.desc:0 "在兽庭中，兆相指的是变化妖怪在其战队中的五大定位之一。\n每样定位都能解锁一项月兆生活方式技能树。\n如果你的相应属性优于其他成员，就可以选择灯以外的其他定位。\n该选择是永久的。"
 POD_werewolves_pack.10.option.a:0 "我想担任灯！"
 POD_werewolves_pack.10.option.b:0 "我想担任拳！"
 POD_werewolves_pack.10.option.c:0 "我想担任镜！"
 POD_werewolves_pack.10.option.d:0 "我想担任叶！"
 POD_werewolves_pack.10.option.e:0 "我想担任柱！"
 POD_werewolves_pack.10.option.f:0 "我已经有定位了。"
 sentai_role_lantern_modifier:0 "灯"
 sentai_role_lantern_modifier_desc:0 "灯是战队的心脏。她指挥着战队的行动，并将战队成员凝聚成一个高效运作的整体。在特定情况下，灯可能会让其他成员发挥领导作用，但她始终是战队的主要决策者。\n#weak 解锁半月灵赋。#!"
 sentai_role_fist_modifier:0 "拳"
 sentai_role_fist_modifier_desc:0 "拳是战队的主要战斗领导者。他制定计划并调整战队的战斗策略。拳不能只善于攻击敌人，还必须善于保护其他队员。\n#weak 解锁满月灵赋。#!"
 sentai_role_mirror_modifier:0 "镜"
 sentai_role_mirror_modifier_desc:0 "镜是战队的发言者和代言人。他负责与盟友和敌人谈判，巩固联盟关系，化解紧张局势。他还是战队与诸灵的主要联系人，负责召唤诸灵并与之讨价还价。\n#weak 解锁眉月灵赋。#!"
 sentai_role_leaf_modifier:0 "叶"
 sentai_role_leaf_modifier_desc:0 "叶是战队的主要间谍和斥候。叶混合使用渗透、勒索和偶尔的暗杀等手段，秘密行动，以推进战队的目标。\n#weak 解锁新月灵赋。#!"
 sentai_role_pillar_modifier:0 "柱"
 sentai_role_pillar_modifier_desc:0 "柱是综合型人员，负责支持战队并为其他成员提供后援。她提供从灵感到体力的所有帮助。如果其他成员被俘或丧失能力，一名优秀的柱还应该能够临时充当其他兆相。\n#weak 解锁凸月灵赋。#!"
 ahroun_advance_rank_decision:0 "Advance Your Shapeshifter Tribal Rank"
 ahroun_advance_rank_decision_desc:0 "Ahroun favor Honor and Glory Renown. You can gain rank experience by winning wars against servants of the Wyrm (or of Gaia if you are following the Wyrm), killing werewolves following the Wyrm (or of Gaia if you are a servant of the Wyrm), or building caerns."
 ahroun_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ahroun_advance_rank_decision_confirm:0 "My fame grows!"
 galliard_advance_rank_decision:0 "Advance Your Shapeshifter Tribal Rank"
 galliard_advance_rank_decision_desc:0 "Galliard favor Wisdom and Glory Renown. You can gain rank experience by succeeding hostile schemes on servants of the Wyrm (or of Gaia if you are following the Wyrm), winning wars against them as an attacker, or killing them (only shapeshifters count). Doing a spirit quest also works."
 galliard_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 galliard_advance_rank_decision_confirm:0 "My fame grows!"
 philodox_advance_rank_decision:0 "Advance Your Shapeshifter Tribal Rank"
 philodox_advance_rank_decision_desc:0 "Philodox favor Wisdom and Honor Renown. You can gain rank experience by succeeding hostile schemes on servants of the Wyrm (or of Gaia if you are following the Wyrm), winning wars against them as a defender, doing a spirit quest, or building caerns."
 philodox_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 philodox_advance_rank_decision_confirm:0 "My fame grows!"
 theurge_advance_rank_decision:0 "Advance Your Shapeshifter Tribal Rank"
 theurge_advance_rank_decision_desc:0 "Theurge favor Wisdom Renown. You can gain rank experience by succeeding hostile schemes on servants of the Wyrm (or of Gaia if you are following the Wyrm) or doing a spirit quest."
 theurge_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 theurge_advance_rank_decision_confirm:0 "My fame grows!"
 ragabash_advance_rank_decision:0 "Advance Your Shapeshifter Tribal Rank"
 ragabash_advance_rank_decision_desc:0 "Ragabashes may pursue any type of Renown, but generally need more overall than other Garou auspices before they can advance. You can gain rank experience by winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), succeeding schemes against them, or killing them (only shapeshifters count). Doing a spirit quest or building caerns also work."
 ragabash_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ragabash_advance_rank_decision_confirm:0 "My fame grows!"
 rank_challenge:0 "Rank Challenge"