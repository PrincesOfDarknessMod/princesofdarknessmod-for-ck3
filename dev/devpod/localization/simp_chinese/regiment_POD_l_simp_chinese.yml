 VOZHD_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('vozhd').GetName]作为[men_at_arms|E]"
 GARGOYLES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('gargoyles').GetName]、[GetMaA('gargoyle_sentinels').GetName]、[GetMaA('gargoyle_scouts').GetName]和[GetMaA('gargoyle_razorbats').GetName]作为[men_at_arms|E]"
