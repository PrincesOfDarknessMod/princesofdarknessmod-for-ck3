l_simp_chinese:
 ghouls:0 "血仆"
 ghouls_flavor:0 "#F 吸血鬼的血债血奴。#!"
 szlachta:0 "什拉赫塔"
 szlachta_flavor:0 "#F 血仆是被易变术重塑血肉而成的，以增加他们的战斗勇武。在增加他们的力量的同时，他们也变得可怕的畸形。#!"
 vozhd:0 "战王"
 vozhd_flavor:0 "#F 通过库都术法融合十几个血仆而成的15英尺高的生物兵器。一堆生物混杂物融混为一个大象大小的多肢体怪物。#!"
 massvampires:0 "刚被初拥的吸血鬼群"
 massvampires_flavor:0 "#F 一群由大规模[Embrace|E]造成的吸血鬼雏儿。血液使他们比凡人更强壮，但是他们才刚刚得到他们的力量。#!"
 kinfolk:0 "兽嫡"
 kinfolk_flavor:0 "#F 狼血部落散兵。#!"
 werewolfpack:0 "狼人战群"
 witchhunters:0 "猎巫人"
 witchhunters_flavor:0 "#F 专精于追杀怪物的凡人。#!"
 cultists:0 "密教徒"
 cultists_flavor:0 "#F 信奉超自然魔物和邪神，被[cainites|E]所掌控的凡人。#!"
 shades:0 "渊影"
 shades_flavor:0 "#F 最强大的怨灵之一，渊影是被扔进[tempest|E]中的死灵，其被卷入死涡或大死涡中，或在畏途中失去自我。#!"
 wolves:0 "狼群"
 wolves_flavor:0 "#F 自然界中很少有声音比狼的嚎叫更令人心寒。不知何故，它包含了人类对荒野的一切恐惧，也包含了我们所渴望的一切。#!"
 bats:0 "蝙蝠"
 bats_flavor:0 "#F 蝙蝠是一种神秘而令人生畏的动物，它们白天倒睡在树上和洞穴里，晚上飞来飞去，寻找昆虫、水果，有时还有人血等食物。#!"
 rats:0 "老鼠"
 rats_flavor:0 "#F #!"
 scorpions:0 "蝎子"
 scorpions_flavor:0 "#F 这些蛛形纲动物的大小不一，小的如拇指，大的如手掌，它们只需闪电般快速射出弯曲的尾巴，就能注入可怕的毒液。#!"
 snakes:0 "蛇"
 snakes_flavor:0 "#F 诱惑者，欺骗者，开门者，玷污无知心灵的毒害者，它在人类的想象中盘旋、滑行和咬噬。#!"
 insects:0 "昆虫"
 insects_flavor:0 "#F #!"
 maniacs:0 "疯子"
 maniacs_flavor:0 "#F #!"
 demonic_thralls:0 "魔奴"
 demonic_thralls_flavor:0 "#F 侍奉着可怕的巴力主子的魔奴#!"
 elite_swordsmen:0 "精英剑士"
 elite_swordsmen_flavor:0 "#F 来自当地贵族的最熟练的剑士，被驯会了如何与[cainites|E]并肩作战#!"
 ghouled_cavalry:0 "血仆化骑兵"
 ghouled_cavalry_flavor:0 "#F 血仆化骑士随时准备与他们的主人要杀的人战斗#!"
 guards_guards:0 "受控卫兵"
 guards_guards_flavor:0 "#F 由[cainites|E]控制的当地守卫，被驯会了如何与其并肩作战#!"
 brigands:0 "匪徒"
 brigands_flavor:0 "#F 擅于埋伏的凡人，懂得如何与[cainites|E]并肩作战#!"
 werewolf_pack_flavor:0 "#F 狼人，狼类，纯粹的恐怖！#!"
 werewolf_pack:0 "狼人战群"
 serpentis_monsters:0 "提丰魔兽"
 serpentis_monsters_flavor:0 "#F 用古蛇术[discipline|E]制造的可怕的魔兽，随时准备开始撕咬。#!"
 crowds:0 "受控群众"
 crowds_flavor:0 "#F 一群凡人，自以为的信任你的功业并尽全力帮助你。#!"
 musketmen:0 "火枪兵"
 musketmen_flavor:0 "#F 可怕的火药开始得到广泛使用，使凡人在面对超自然时的劣势越来越小。#!"
 ZMEI_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('zmei').GetName]作为[men_at_arms|E]"
 DEMONS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('demons').GetName]作为[men_at_arms|E]"
