 GHOULED_CAVALRY_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('ghouled_cavalry').GetName]作为[men_at_arms|E]"
 GUARDS_GUARDS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('guards_guards').GetName]作为[men_at_arms|E]"
 BRIGANDS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('brigands').GetName]作为[men_at_arms|E]"
 CULTISTS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('cultists').GetName]作为[men_at_arms|E]"
 the_reavers_of_ur:0 "乌尔的掠夺者"
 the_reavers_of_ur_flavor:0 "#F 一群可怕的起伏不定的灰色形体，将残酷地分尸敌人。#!"
 yin_corpses:0 "活尸"
 yin_corpses_flavor:0 "#F 被注入阴气的尸体，使用作不死族和无意识的仆人。#!"
 amazons:0 "亚马逊"
 amazons_flavor:0 "#F 这些从父权制枷锁中解放出来的女人，将像古代的传说一样为她们的黑怒恩人而战。#!"
 defenders:0 "防护者"
 defenders_flavor:0 "#F 人类需要被保卫，而这些强壮且准备充分的兽嫡已经准备好尽他们的职责。#!"
 herne:0 "赫恩兄弟"
 herne_flavor:0 "#F 一支几乎完全由满月狼组成的快速打击部队，随时准备保卫任何处于危险中的芬尼安圣地。#!"
 mjolnir:0 "妙尔尼尔之子"
 mjolnir_flavor:0 "#F 这些野蛮人战士甚至被其他芬里尔仔兽认为是嗜血狂人，只能远望不可近观。#!"
 stormcrows:0 "风暴鸦"
 stormcrows_flavor:0 "#F 受到雷公的宠爱，风暴鸦主要充当影爵的间谍，但当数量足够多时，它们可以成为一支强大的部队。#!"
 whitewolves:0 "白狼"
 whitewolves_flavor:0 "#F 据传闻，白狼是银牙的祖先，是最纯粹的银牙，在需要的时候出现，帮助部族。#!"
 materialized_spirits:0 "形体化灵类"
 materialized_spirits_flavor:0 "#F 被说服，或被胁迫，在需要的时候向弦月狼给予帮助的灵。它们是难以预测的对手。#!"
 the_lost_ancients:0 "失落古孽"
 the_lost_ancients_flavor:0 "#F 被宇宙遗忘的无形影子，被木乃伊召唤而来协助其。#!"
 wraiths:0 "死灵"
 wraiths_flavor:0 "#F 从冥界召唤出来的形体化死灵。#!"
 POD_animals_maa:0 "[POD_animals_maa|E]"
 POD_controlled_animals:0 "受控动物"
 POD_controlled_animals_flavor:0 "#F 天哪，这么多松鼠……#!"
 zmei:0 "戈里尼奇"
 zmei_flavor:0 "#F 具有宏大力量的可怕生物，曾经的妖蛆侍从，现在束缚于小祖母芭芭雅嘎。#!"
 spectres:0 "怨灵"
 spectres_flavor:0 "#F 从迷宫域召唤而来的形体化怨灵。#!"
 POD_legendary_maa:0 "[POD_legendary_maa|E]"
 POD_demonic_maa:0 "[POD_demonic_maa|E]"
 POD_spirit_maa:0 "[POD_spirit_maa|E]"
 POD_shapeshifter_maa:0 "[POD_shapeshifter_maa|E]"
 POD_gargoyle_maa:0 "[POD_gargoyle_maa|E]"
 POD_ghoul_maa:0 "[POD_ghoul_maa|E]"
 animated_tree:0 "活化树木"
 animated_tree_flavor:0 "#F 盖亚之子周围的树木被活化，以可以抑制或抵御敌人。#!"
 war_avatar_of_great_fenris:0 "大芬里斯的战争化身"
 war_avatar_of_great_fenris_flavor:0 "#F 鲜有灵类——除却化身本体外——能够有大芬里斯的战争化身那般可怕与危险。魔狼芬里斯的化身是一头巨大的狼，肩高超过10英尺，双眼燃烧着熊熊怒火，无数仇敌的鲜血自它的下颌滴落。它的皮毛是深灰色的，但在光线穿过它时，似乎会从黑色变成红色，甚至变成白色。芬里斯的战争化身并不如灵君本体那般强大，但依然违背了灵类的通常限制，它的特质甚至超越了节点爬行者。#!"
 materialized_banes:0 "形体化忌灵"
 materialized_banes_flavor:0 "#F 被说服，或被胁迫，在需要的时候向黑螺旋舞者给予帮助的忌灵。它们是难以预测的对手。#!"
 wyrm_elemental:0 "妖蛆元素"
 wyrm_elemental_flavor:0 "#F 源自妖蛆本身的元素灵。#!"
 POD_plasmic_maa:0 "[POD_plasmic_maa|E]"
 phantasies:0 "幻念"
 phantasies_flavor:0 "#F 类似于活物的灵质体存在。#!"
 deliriums:0 "谵念"
 deliriums_flavor:0 "#F 看起来是经过改造的动物灵质体，如有翅膀的马或有触角的猫。#!"
 legendaries:0 "传奇"
 legendaries_flavor:0 "#F 模仿某种神兽（如凤凰）的灵质体。#!"
 wyrds:0 "诡异"
 wyrds_flavor:0 "#F 与活物或传说生物没有任何类似的灵质体。#!"
 dopplegangers:0 "二重身"
 dopplegangers_flavor:0 "#F 二重身是被黯影吞噬的死灵，但他们保留了自己的个性、自由意志和对冥法的了解。#!"
 heavenlysuccessors_maa:0 "圣传人"
 heavenlysuccessors_maa_flavor:0 "#F 钟馗的继承者，圣传人已经发誓要消灭吸血鬼和其他窃取盖亚灵魂的生物。#!"
 animate_chimera:0 "活化奇魅"
 animate_chimera_flavor:0 "#F 活化奇魅只是具有生命或生命的外观的奇魅。#!"
 enochian_guards:0 "以诺血殿卫士"
 enochian_guards_flavor:0 "#F 远古的战士们再次聚集在一起，保护他们永生的主人。#!"
 maryannu:0 "战车射手"
 maryannu_flavor:0 "#F 骑乘战车勇敢贵族可能已经被凡人遗忘，但这种自豪的传统仍然存在于那些在曾经知道它的人身上。#!"
 romani_scouts:0 "罗姆斥候"
 romani_scouts_flavor:0 "#F 迅速而坚韧的骑兵，善于寻找最佳的战斗方式。#!"
 jagglings:0 "侍灵"
 jagglings_flavor:0 "#F 侍灵是常见的影界“公民”。他们通常有自我意识，并且拥有个人身份。侍灵通常为灵君服务。#!"
 cockatrices:0 "鸡蛇"
 cockatrices_flavor:0 "#F 一条蛰伏于大漠流沙之中的邪恶毒蛇，并利用它恶毒的凝视和吐息杀死了无数勇士。#!"
 drake:0 "龙兽"
 drake_flavor:0 "#F 龙兽有着厚重的装甲，使其几乎免受弓与剑的任何攻击。#!"
 orm:0 "龙蛇"
 orm_flavor:0 "#F 龙蛇在寒冷的气候中筑巢，其与巨蛇或鳗鱼非常相似。#!"
 wyverns:0 "飞龙"
 wyverns_flavor:0 "#F 双足飞龙是一种蜷曲的有翼蛇类，其猎场从欧洲最北部一直延伸到希腊和埃塞俄比亚。#!"
 lindworm:0 "鳞龙"
 lindworm_flavor:0 "#F 诡秘难寻的鳞龙，废瘠荒原的潜行者。#!"
 amphiptere:0 "翼蛇"
 amphiptere_flavor:0 "#F 翼蛇是一种有翼但无足的蛇类，只能依靠飞行移动。#!"
 sphinx:0 "斯芬克斯"
 sphinx_flavor:0 "#F 斯芬克斯或者说“龙猫”在长相上如同兼具膜翅、巨大獠牙以及蛇目并不时吐息的老虎或豹子。#!"
 fu_guardian:0 "石狮"
 fu_guardian_flavor:0 "#F 作为秩序与文明的监督者，这种小型龙类生物类似于狮子、龙以及狗三者的杂交产物。#!"
 feng_huang:0 "凤凰"
 feng_huang_flavor:0 "#F 新的火焰可以把旧的火焰扑灭，大的苦痛可以使小的苦痛减轻。#!"
 ghul:0 "食尸鬼"
 ghul_flavor:0 "#F 易卜劣斯之子，黑暗亲王，爱好混入人类以魅惑和进食。#!"
 gryphon:0 "狮鹫"
 gryphon_flavor:0 "#F 早于埃及辉煌时期的文物描绘了狮鹫，这种形态上半狮半猛禽的动物施展曙光之翼翱翔天际。#!"
 harpy:0 "鹰身女妖"
 harpy_flavor:0 "#F 在希腊传说的早期记载中，鹰身女妖是死亡的预兆和高傲的惩罚者。#!"
 hippocampi:0 "马头鱼尾兽"
 hippocampi_flavor:0 "#F 沿着湖泊和海洋奔跑的马，会与波浪和水的守护灵相伴。有时，他们的玩耍会结束于做爱。#!"
 hippogryph:0 "骏鹰"
 hippogryph_flavor:0 "#F 就像关于其起源的黑暗传说一样，被称为骏鹰的鹰马结合体拥有忧郁的气息和凶恶的性情。#!"
 homunculus:0 "人造人"
 homunculus_flavor:0 "#F 每个人造人都是其创造者的标志性作品，拥有对其创造者的目标和愿望以及产生它的魔法理论的真正认知。#!"
 manticore:0 "蝎尾狮"
 manticore_flavor:0 "#F 每种动物在食物链和生命循环中都有自己的位置，而蝎尾狮是这秩序的异端。#!"
 pegasus:0 "天马"
 pegasus_flavor:0 "#F 就像其翅膀上的宝石——蓝宝石、红宝石、祖母绿和紫水晶——一样野性和自然，天马是一种稀有和宝贵的生物。#!"
 peryton:0 "鹿鹰兽"
 peryton_flavor:0 "#F 鹿鹰兽奇怪又恰当地适用于危险动物这一词。它的鹿头有柔软的黑色、棕色或灰色毛皮。#!"
 phoboros:0 "福波斯"
 phoboros_flavor:0 "#F 福波斯看上去像是一只白色的小公牛。这生物的许多方面都把它象征性地与月亮联系起来，从而与世界的水联系起来。#!"
 roc:0 "大鹏"
 roc_flavor:0 "#F 大鹏是巨大的鸟类，斯看上去像是亮白色的有金色斑点的鹰。#!"
 seabishop:0 "主教鱼"
 seabishop_flavor:0 "#F 难以捉摸的“主教鱼”是一个谜团。一个人被搁浅发现了他们，这些实体隐藏在海浪之下，避开人类，避免与地表世界接触。#!"
 sea_serpent:0 "大海蛇"
 sea_serpent_flavor:0 "#F 大海蛇在大洋和大海和海湾的最深处出没，是远行船只的天灾。#!"
 shadhavar:0 "独角羚"
 shadhavar_flavor:0 "#F 独角羚是一种羚羊类动物，在风吹草低的平原上游荡。#!"
 simurgh:0 "西摩格"
 simurgh_flavor:0 "#F 德尔菲的神谕、山中老人和山洞里的三位命运之神都是全知隐士的典范，他们将自己与人类隔离开来。#!"
 umkovu:0 "姆科夫"
 umkovu_flavor:0 "#F 可怕的沙漠形成了它的形状，傲慢而紧缩的豺狼。为了寻找你，我摸索着穿过起伏最缓慢的夜晚。#!"
 unicorn:0 "独角兽"
 unicorn_flavor:0 "#F 在月光下排成一队，在萦魂空气中响亮嘶鸣。独角兽步入了海中。#!"
 vodayany:0 "伏地诺"
 vodayany_flavor:0 "#F 远古的生物从静止的湖泊阴暗的表面爬出来，在岸上留下让后来凡人沉思的痕迹。#!"
 wilde_beast:0 "蛮兽"
 wilde_beast_flavor:0 "#F 蛮兽结合了狮子最好地捕食技能和猎鹬犬温顺、忠诚的个性特征。#!"
 thinbloods:0 "淡血种"
 thinbloods_flavor:0 "#F 大量初拥的第十四代或更后的吸血鬼。#!"
 SNAKES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('snakes').GetName]作为[men_at_arms|E]"
 THINBLOODS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('thinbloods').GetName]作为[men_at_arms|E]"
 gargoyle_warriors:0 "石像鬼战士"
 gargoyle_warriors_flavor:0 "#F #!"
 gargoyle_sentinels:0 "石像鬼哨兵"
 gargoyle_sentinels_flavor:0 "#F #!"
 gargoyle_scouts:0 "石像鬼斥候"
 gargoyle_scouts_flavor:0 "#F #!"
 gargoyle_razorbats:0 "刮刀蝙蝠"
 gargoyle_razorbats_flavor:0 "#F #!"
 NEED_MASSREGNANT_TO_UNLOCK_MAA_TEXT:0 "#Weak 你需要先使用解锁[men_at_arms|E][character_interaction|E]解锁血仆型[men_at_arms|E]。#!"
 NEED_MASSSIRE_TO_UNLOCK_MAA_TEXT:0 "#Weak 你需要先使用解锁[men_at_arms|E][character_interaction|E]解锁吸血鬼型[men_at_arms|E]。#!"
 demonhound:0 "恶魔猎犬"
 demonhound_flavor:0 "#F 被深渊的灵体所控制，这些猎犬精瘦又阴险，一双炯炯有神的眼睛长在骷髅般的头上，燃火的下巴滴着沸腾的唾液。#!"
 imps:0 "小恶魔"
 imps_flavor:0 "#F 小恶魔是深渊中的下阶恶魔，是足智多谋的诡术师。虽然不喜欢直接战斗，但当他们被逼到墙角时，会出人意料地强韧。#!"
 lucifergia:0 "路西法兽"
 lucifergia_flavor:0 "#F 寻魂猎犬是魔鬼的执行者。当契约没有得到履行时，如果有必要，这些恶魔能追到天堂。#!"
 malebranche:0 "马拉布兰卡"
 malebranche_flavor:0 "#F 地狱的磨难者们有着永恒的时间来完善他们的技艺。人类身体和灵魂中没有什么弱点是他们不知道的。#!"
 war_servitors:0 "战争从者"
 war_servitors_flavor:0 "#F 作为深渊的战斗种姓，这些可怕的实体只向大恶魔低头（通常是勉强地）。他们是力量的化身，是爪子、地狱之火和地狱武器的汹涌旋风。#!"
 the_unnamable:0 "不可名状"
 the_unnamable_flavor:0 "#F 深缚者可以在宇宙与混沌之间撕开一个小裂隙，并把一些东西拉来——一只过于怪异和危险而难以在此现实存在的生物。这召唤所召唤的生物总是危险的怪兽，具有可怕的杀伤力和对毁灭的渴望。#!"