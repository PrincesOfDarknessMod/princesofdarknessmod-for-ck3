 INSECTS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('insects').GetName]作为[men_at_arms|E]"
 SZLACHTA_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('szlachta').GetName]作为[men_at_arms|E]"
 VOZHD_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('vozhd').GetName]作为[men_at_arms|E]"
 GARGOYLES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('gargoyle_warriors').GetName]、[GetMaA('gargoyle_sentinels').GetName]、[GetMaA('gargoyle_scouts').GetName]和[GetMaA('gargoyle_razorbats').GetName]作为[men_at_arms|E]"
 SHADES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('shades').GetName]作为[men_at_arms|E]"
 RATS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('rats').GetName]作为[men_at_arms|E]"
 ELITE_SWORDSMEN_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('elite_swordsmen').GetName]作为[men_at_arms|E]"
 GHOULED_CAVALRY_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('ghouled_cavalry').GetName]作为[men_at_arms|E]"
 GUARDS_GUARDS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('guards_guards').GetName]作为[men_at_arms|E]"
 BRIGANDS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('brigands').GetName]作为[men_at_arms|E]"
 CULTISTS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('cultists').GetName]作为[men_at_arms|E]"
 the_reavers_of_ur:0 "乌尔的掠夺者"
 the_reavers_of_ur_flavor:0 "#F 一群可怕的起伏不定的灰色形体，将残酷地分尸敌人。#!"
 amazons:0 "亚马逊"
 amazons_flavor:0 "#F 这些从父权制枷锁中解放出来的女人，将像古代的传说一样为她们的黑怒恩人而战。#!"
 defenders:0 "防护者"
 defenders_flavor:0 "#F 人类需要被保卫，而这些强壮且准备充分的兽嫡已经准备好尽他们的职责。#!"
 herne:0 "赫恩兄弟"
 herne_flavor:0 "#F 一支几乎完全由满月狼组成的快速打击部队，随时准备保卫任何处于危险中的芬尼安圣地。#!"
 mjolnir:0 "妙尔尼尔之子"
 mjolnir_flavor:0 "#F 这些野蛮人战士甚至被其他芬里尔仔兽认为是嗜血狂人，只能远望不可近观。#!"
 stormcrows:0 "风暴鸦"
 stormcrows_flavor:0 "#F 受到雷公的宠爱，风暴鸦主要充当影爵的间谍，但当数量足够多时，它们可以成为一支强大的部队。#!"
 whitewolves:0 "白狼"
 whitewolves_flavor:0 "#F 据传闻，白狼是银牙的祖先，是最纯粹的银牙，在需要的时候出现，帮助部族。#!"
 materialized_spirits:0 "形体化灵类"
 materialized_spirits_flavor:0 "#F 被说服，或被胁迫，在需要的时候向眉月狼给予帮助的灵。它们是难以预测的对手。#!"
 the_lost_ancients:0 "失落古孽"
 the_lost_ancients_flavor:0 "#F 被宇宙遗忘的无形影子，被木乃伊召唤而来协助其。#!"
 wraiths:0 "死灵"
 wraiths_flavor:0 "#F 从[underworld|E]召唤出来的形体化死灵。#!"
 POD_animals_maa:0 "[POD_animals_maa|E]"
 POD_controlled_animals:0 "受控动物"
 POD_controlled_animals_flavor:0 "#F 天哪，这么多松鼠……#!"
 zmei:0 "戈里尼奇"
 zmei_flavor:0 "#F 具有宏大力量的可怕生物，曾经的妖蛆侍从，现在束缚于小祖母芭芭雅嘎。#!"
 spectres:0 "怨灵"
 spectres_flavor:0 "#F 从[labyrinth|E]召唤而来的形体化怨灵。#!"
 POD_legendary_maa:0 "[POD_legendary_maa|E]"
 POD_demonic_maa:0 "[POD_demonic_maa|E]"
 POD_spirit_maa:0 "[POD_spirit_maa|E]"
 POD_shapeshifter_maa:0 "[POD_shapeshifter_maa|E]"
 POD_gargoyle_maa:0 "[POD_gargoyle_maa|E]"
 POD_ghoul_maa:0 "[POD_ghoul_maa|E]"
 animated_tree:0 "活化树木"
 animated_tree_flavor:0 "#F 盖亚之子周围的树木被活化，以可以抑制或抵御敌人。#!"
 war_avatar_of_great_fenris:0 "大芬里斯的战争化身"
 war_avatar_of_great_fenris_flavor:0 "#F 鲜有灵类——除却灵君本体外——能够有大芬里斯的战争化身那般可怕与危险。魔狼芬里斯的化身是一头巨大的狼，肩高超过10英尺，双眼燃烧着熊熊怒火，无数仇敌的鲜血自它的下颌滴落。它的皮毛是深灰色的，但在光线穿过它时，似乎会从黑色变成红色，甚至变成白色。芬里斯的战争化身并不如灵君本体那般强大，但依然违背了灵类的通常限制，它的特质甚至超越了节点爬行者。#!"
 materialized_banes:0 "形体化忌灵"
 materialized_banes_flavor:0 "#F 被说服，或被胁迫，在需要的时候向黑螺旋舞者给予帮助的忌灵。它们是难以预测的对手。#!"
 POD_plasmic_maa:0 "[POD_plasmic_maa|E]"
 phantasies:0 "幻念"
 phantasies_flavor:0 "#F 类似于活物的灵质体存在，类似与鲸鱼或鸟类等。幻念可能有足够的智慧，可以与人交流，有时还会在[tempest|E]中帮助死灵。就像[skinlands|E]的动物一样，有些动物对人类充满敌意，有些则很友好，有些则最好不要靠近。#!"
 deliriums:0 "谵念"
 deliriums_flavor:0 "#F 看起来是经过改造的动物灵质体，如有翅膀的马或有触角的猫。谵念往往比幻念更聪明、更强大。#!"
 legendaries:0 "传奇"
 legendaries_flavor:0 "#F 模仿某种神兽（如凤凰）的灵质体。传奇往往聪慧、强大、稀有。#!"
 wyrds:0 "诡异"
 wyrds_flavor:0 "#F 与活物或传说生物没有任何类似的灵质体。诡异一般都是异类；即使他们有足够的智慧与死灵交流（而大多数的智慧都高得吓人），他们的要求或请求一般都过于玄妙，没有任何意义。#!"
 heavenlysuccessors_maa:0 "圣传人"
 heavenlysuccessors_maa_flavor:0 "#F 钟馗的继承者，圣传人已经发誓要消灭吸血鬼和其他窃取盖亚灵魂的生物。#!"
 enochian_guards:0 "以诺血殿卫士"
 enochian_guards_flavor:0 "#F 远古的战士们再次聚集在一起，保护他们永生的主人。#!"
 maryannu:0 "战车射手"
 maryannu_flavor:0 "#F 骑乘战车勇敢贵族可能已经被凡人遗忘，但这种自豪的传统仍然存在于那些在曾经知道它的人身上。#!"
 romani_scouts:0 "罗姆斥候"
 romani_scouts_flavor:0 "#F 迅速而坚韧的骑兵，善于寻找最佳的战斗方式。#!"
 jagglings:0 "侍灵"
 jagglings_flavor:0 "#F 侍灵是常见的影界“公民”。他们通常有自我意识，并且拥有个人身份。侍灵通常为灵君服务。#!"
 cockatrices:0 "鸡蛇"
 cockatrices_flavor:0 "#F 一条蛰伏于大漠流沙之中的邪恶毒蛇，并利用它恶毒的凝视和吐息杀死了无数勇士。#!"
 drake:0 "龙兽"
 drake_flavor:0 "#F 龙兽有着厚重的装甲，使其几乎免受弓与剑的任何攻击。#!"
 orm:0 "龙蛇"
 orm_flavor:0 "#F 龙蛇在寒冷的气候中筑巢，其与巨蛇或鳗鱼非常相似。#!"
 wyverns:0 "飞龙"
 wyverns_flavor:0 "#F 双足飞龙是一种蜷曲的有翼蛇类，其猎场从欧洲最北部一直延伸到希腊和埃塞俄比亚。#!"
 lindworm:0 "鳞龙"
 lindworm_flavor:0 "#F 诡秘难寻的鳞龙，废瘠荒原的潜行者。#!"
 amphiptere:0 "翼蛇"
 amphiptere_flavor:0 "#F 翼蛇是一种有翼但无足的蛇类，只能依靠飞行移动。#!"
 sphinx:0 "斯芬克斯"
 sphinx_flavor:0 "#F 斯芬克斯或者说“龙猫”在长相上如同兼具膜翅、巨大獠牙以及蛇目并不时吐息的老虎或豹子。#!"
 fu_guardian:0 "石狮"
 fu_guardian_flavor:0 "#F 作为秩序与文明的监督者，这种小型龙类生物类似于狮子、龙以及狗三者的杂交产物。#!"
 feng_huang:0 "凤凰"
 feng_huang_flavor:0 "#F 新的火焰可以把旧的火焰扑灭，大的苦痛可以使小的苦痛减轻。#!"
 ghul:0 "食尸鬼"
 ghul_flavor:0 "#F 易卜劣斯之子，黑暗亲王，爱好混入人类以魅惑和进食。#!"
 gryphon:0 "狮鹫"
 gryphon_flavor:0 "#F 早于埃及辉煌时期的文物描绘了狮鹫，这种形态上半狮半猛禽的动物施展曙光之翼翱翔天际。#!"
 harpy:0 "鹰身女妖"
 harpy_flavor:0 "#F 在希腊传说的早期记载中，鹰身女妖是死亡的预兆和高傲的惩罚者。#!"
 hippocampi:0 "马头鱼尾兽"
 hippocampi_flavor:0 "#F 沿着湖泊和海洋奔跑的马，会与波浪和水的守护灵相伴。有时，他们的玩耍会结束于做爱。#!"
 hippogryph:0 "骏鹰"
 hippogryph_flavor:0 "#F 就像关于其起源的黑暗传说一样，被称为骏鹰的鹰马结合体拥有忧郁的气息和凶恶的性情。#!"
 homunculus:0 "人造人"
 homunculus_flavor:0 "#F 每个人造人都是其创造者的标志性作品，拥有对其创造者的目标和愿望以及产生它的魔法理论的真正认知。#!"
 manticore:0 "蝎尾狮"
 manticore_flavor:0 "#F 每种动物在食物链和生命循环中都有自己的位置，而蝎尾狮是这秩序的异端。#!"
 pegasus:0 "天马"
 pegasus_flavor:0 "#F 就像其翅膀上的宝石——蓝宝石、红宝石、祖母绿和紫水晶——一样野性和自然，天马是一种稀有和宝贵的生物。#!"
 peryton:0 "鹿鹰兽"
 peryton_flavor:0 "#F 鹿鹰兽奇怪又恰当地适用于危险动物这一词。它的鹿头有柔软的黑色、棕色或灰色毛皮。#!"
 phoboros:0 "福波斯"
 phoboros_flavor:0 "#F 福波斯看上去像是一只白色的小公牛。这生物的许多方面都把它象征性地与月亮联系起来，从而与世界的水联系起来。#!"
 roc:0 "大鹏"
 roc_flavor:0 "#F 大鹏是巨大的鸟类，斯看上去像是亮白色的有金色斑点的鹰。#!"
 seabishop:0 "主教鱼"
 seabishop_flavor:0 "#F 难以捉摸的“主教鱼”是一个谜团。一个人被搁浅发现了他们，这些实体隐藏在海浪之下，避开人类，避免与地表世界接触。#!"
 sea_serpent:0 "大海蛇"
 sea_serpent_flavor:0 "#F 大海蛇在大洋和大海和海湾的最深处出没，是远行船只的天灾。#!"
 shadhavar:0 "独角羚"
 shadhavar_flavor:0 "#F 独角羚是一种羚羊类动物，在风吹草低的平原上游荡。#!"
 simurgh:0 "西摩格"
 simurgh_flavor:0 "#F 德尔菲的神谕、山中老人和山洞里的三位命运之神都是全知隐士的典范，他们将自己与人类隔离开来。#!"
 umkovu:0 "姆科夫"
 umkovu_flavor:0 "#F 可怕的沙漠形成了它的形状，傲慢而紧缩的豺狼。为了寻找你，我摸索着穿过起伏最缓慢的夜晚。#!"
 unicorn:0 "独角兽"
 unicorn_flavor:0 "#F 在月光下排成一队，在萦魂空气中响亮嘶鸣。独角兽步入了海中。#!"
 vodayany:0 "伏地诺"
 vodayany_flavor:0 "#F 远古的生物从静止的湖泊阴暗的表面爬出来，在岸上留下让后来凡人沉思的痕迹。#!"
 wilde_beast:0 "蛮兽"
 wilde_beast_flavor:0 "#F 蛮兽结合了狮子最好地捕食技能和猎鹬犬温顺、忠诚的个性特征。#!"
 thinbloods:0 "淡血种"
 thinbloods_flavor:0 "#F 大量初拥的第十四代或更后的吸血鬼。#!"
 SNAKES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('snakes').GetName]作为[men_at_arms|E]"
 THINBLOODS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('thinbloods').GetName]作为[men_at_arms|E]"
 gargoyle_warriors:0 "石像鬼战士"
 gargoyle_warriors_flavor:0 "#F #!"
 gargoyle_sentinels:0 "石像鬼哨兵"
 gargoyle_sentinels_flavor:0 "#F #!"
 gargoyle_scouts:0 "石像鬼斥候"
 gargoyle_scouts_flavor:0 "#F #!"
 gargoyle_razorbats:0 "刮刀蝙蝠"
 gargoyle_razorbats_flavor:0 "#F #!"
 NEED_MASSREGNANT_TO_UNLOCK_MAA_TEXT:0 "#Weak 你需要先使用解锁[men_at_arms|E][character_interaction|E]解锁[POD_ghoul_maa|E]型[men_at_arms|E]。#!"
 NEED_MASSSIRE_TO_UNLOCK_MAA_TEXT:0 "#Weak 你需要先使用解锁[men_at_arms|E][character_interaction|E]解锁吸血鬼型[men_at_arms|E]。#!"
 demonhound:0 "恶魔猎犬"
 demonhound_flavor:0 "#F 被深渊的灵体所控制，这些猎犬精瘦又阴险，一双炯炯有神的眼睛长在骷髅般的头上，燃火的下巴滴着沸腾的唾液。#!"
 imps:0 "小恶魔"
 imps_flavor:0 "#F 小恶魔是深渊中的下阶恶魔，是足智多谋的诡术师。虽然不喜欢直接战斗，但当他们被逼到墙角时，会出人意料地强韧。#!"
 lucifergia:0 "路西法兽"
 lucifergia_flavor:0 "#F 寻魂猎犬是魔鬼的执行者。当契约没有得到履行时，如果有必要，这些恶魔能追到天堂。#!"
 malebranche:0 "马拉布兰卡"
 malebranche_flavor:0 "#F 地狱的磨难者们有着永恒的时间来完善他们的技艺。人类身体和灵魂中没有什么弱点是他们不知道的。#!"
 war_servitors:0 "战争从者"
 war_servitors_flavor:0 "#F 作为深渊的战斗种姓，这些可怕的实体只向大恶魔俯首（通常是勉强地）。他们是力量的化身，是爪子、地狱火和魔邪武器的汹涌旋风。#!"
 the_unnamable:0 "不可名状"
 the_unnamable_flavor:0 "#F 地缚者可以在宇宙与混沌之间撕开一个小裂隙，并把一些东西拉来——一只过于怪异和危险而难以在此现实存在的生物。这召唤所召唤的生物总是危险的怪兽，具有可怕的杀伤力和对毁灭的渴望。#!"
 POD_faerie_maa:0 "[POD_faerie_maa|E]"
 POD_chimera_maa:0 "[POD_chimera_maa|E]"
 nervosa:0 "孽伏煞"
 nervosa_flavor:0 "#F 从疯狂中诞生，可以看起来像人、动物或奇异生物，甚至根本没有身体。#!"
 monster_under_the_bed:0 "床底下的怪物"
 monster_under_the_bed_flavor:0 "#F 有像巨大紫蛇般的东西，等待你的手或脚伸出床的边缘，这样它们就可以抓住你，还有一些只是坐在那里的小东西，在手电筒的光束之外（用一双巨大的黄色眼睛）回望着你。#!"
 nocnitsa:0 "梦魇妖"
 nocnitsa_flavor:0 "#F 这些从换生灵的噩梦中诞生的怪物是一些最令人恐惧的奇魅，通常直接或象征性地从它们的制造者最大和最怕的恐惧中获取它们的形态。#!"
 sprites:0 "小精灵"
 sprites_flavor:0 "#F 小精灵生于幻想和喜悦。它们通常很顽皮，最坏能是捣蛋鬼。#!"
 monsters:0 "怪物"
 monsters_flavor:0 "#F 怪物是给不符合妖精所知的奇魅生物类别的的活化奇魅的名字。#!"
 feral_chimera:0 "野奇魅"
 feral_chimera_flavor:0 "#F 大多数野奇魅是[dreaming|E]中的世俗野生动物的对应物：兔、猫、狼、马等等。#!"
 urban_legends:0 "都市传说"
 urban_legends_flavor:0 "#F 都市传说几乎和梦魇妖一样多样化，像孽伏煞一样不可预测。它们可能表现为下水道中的鳄鱼，屋内作祟的骚灵，或介于两者之间的任何东西。#!"
 sidhe_wild_hunt:0 "仙族狂猎"
 sidhe_wild_hunt_flavor:0 "#F 狂猎是永契堡领主的选民，是换生灵中最好的骑手，是伟大狩猎中的杰出骑士。他们是妖精可以释放给注定会失败的敌人的最优秀的战士之一，甚至连旧神都害怕他们的马匹踩踏。#!"
 chitterers:0 "尖鸣兽"
 chitterers_flavor:0 "#F 由两只狼的后躯组成，粉红色的无毛身体上布满了几十张怪叫的鸟嘴；尖鸣兽是有史以来完成的最令人不安的睿魔尔作品。#!"
 reapers:0 "收割者"
 reapers_flavor:0 "#F 收割者，因其两只被设计用于完美地斩首的大而有力的前肢而得名，是一种人形大小的甲虫，本该是脸的位置上有一串争斗的、嘶叫的老鼠头。#!"
 skin_eaters:0 "食皮者"
 skin_eaters_flavor:0 "#F 有着贪婪胃口的像跳蚤一样微小的昆虫，食皮者被设计成能听从简单的命令，并渴望吞噬皮肤而不是血。#!"
 troll_berserkers:0 "巨魔狂战士"
 troll_berserkers_flavor:0 "#F 巨魔比最高的人类还要高两个头，初看，他们与人类只有身材上的不同。他们的脸就像不太文明的民族的人们那样粗犷而棱角分明。他们的头发很长，每只耳朵上都挂着辫子，直到生长到背的中部，头发永远不会被消剪。#!"
 nuckelavee:0 "海人马"
 nuckelavee_flavor:0 "#F 海人马是一种海洋生物，其上半身是人形，下半身则像马一样。虽然海洋版的半人马可能会让某些人觉得滑稽，但这个生物却不是这样的。海人马有一种令所有懦弱的人都害怕的能力：没有皮肤，取而代之的是一团搏动的器官和跳动的血液。因此，当人们不幸目睹这样的生物从海浪中升起时，自然会感到恐惧。#!"
 duergar:0 "灰矮人"
 duergar_flavor:0 "#F 灰矮人是生活在山丘上的居民。他们大约只有一到两英尺高，但除此之外，他们看起来像是有长胡子和锐利眼神的人类男性。尽管个头小，但灰矮人拥有最强壮的男人的力量和同样具有火爆脾气。灰矮人极度爱护自己的领土，会对任何侵犯他们领地的人会采取攻击行动。唯一能抵御他们怒火的方法就是乞求他们的款待，并提供礼物作为交换。#!"
 skoggra:0 "木妻"
 skoggra_flavor:0 "#F 木妻对人类可以相当友好。虽然外表看起来充满野性，但是她们都是漂亮的女性。她们的下身包裹着树皮，树叶和春花，却有着美丽的脸庞，像苔藓一样绿的眼睛，和缠绕在肩膀上的棕色头发。#!"
 ovinniks:0 "黯火精"
 ovinniks_flavor:0 "#F 黯火精乍看之下，似乎与棕精灵非常相似。他们住在谷仓或马厩里，特别喜欢动物。事实上，他们被认为有能力用自己的语言与动物交谈。然而，相似性到此为止。棕精灵一般都很乐于助人，只有在他们觉得自己不受重视时才会生气，而黯火精则是彻头彻尾的恶毒生物。虽然他们不会做任何伤害动物的事情，但对人类就无所谓。#!"
 brownies:0 "棕精灵"
 brownies_flavor:0 "#F 这些乐于助人的生物生活在欧洲各地的家庭里和周围。它们只会在晚上出来，在家里做一些必要的家务，从清洁和擦洗到抛光和缝补。就在他们被发现的那一刻，他们便会消失得无影无踪，这让大多数人想知道某只破烂的靴子到底是怎么修好的，或者是谁给木箱填的料。#!"
 night_elves:0 "暗夜精灵"
 night_elves_flavor:0 "#F 巴伐利亚的暗精灵长期以来成为当地村庄的骇人传说。他们的习性和栖息地在很大程度上不为人知。有关暗精灵存的讲述，只来自于那些发现过他们所居住的树顶村的人。介于很少有人能在这种经历中完好无损地存活下来，这间接损害了这些故事的可信度。#!"
 goblins:0 "哥布林"
 goblins_flavor:0 "#F 这些魔物般的野兽生活在欧洲大部分地区的黑暗森林中。它们看起来就像畸形的儿童玩偶，在泥炭中放置数月后复活，充满了人肉的兴趣。#!"
 malicious_faerie:0 "恶毒妖精"
 malicious_faerie_flavor:0 "#F 这些可憎的生物是人类的灾祸。他们除了制造恶作剧之外啥也不想，从无害的恶作剧到摧毁村庄，还更喜欢让迷路的旅行者走向错误的道路，变出毒药来“净化”井水，甚至带领着一队哥布林袭击商人的营地。#!"
 crocodiles:0 "鳄鱼"
 crocodiles_flavor:0 "#F 短吻鳄、凯门鳄和鳄鱼有长长的身体和粗糙的、像树皮一样的皮，很容易被误认为是腐烂的木头，这是一个致命的错误。#!"
 bears:0 "熊"
 bears_flavor:0 "#F 熊用它粗壮的腿像人一样直立，它居住在寒冷、孤独的地方——邻水（和鱼）的茂密森林里。#!"
 lions:0 "狮子"
 lions_flavor:0 "#F 拥有金色外皮和长而饱满的鬃毛，狮子是一种宏伟的生物。#!"
 tigers:0 "老虎"
 tigers_flavor:0 "#F 这些美丽的动物巨大、圆滑、轻巧，在丛林的阴影中迅速移动，用它们的条纹进行潜伏。#!"
 bulls:0 "牛"
 bulls_flavor:0 "#F 牛在人类文明的历史中发挥了至关重要的作用，在人类的神话中也是如此。#!"
 horses:0 "马"
 horses_flavor:0 "#F 这些野兽高大，肌肉发达，有长长的拱形脖子，聪明的眼睛，以及流动的鬃毛和尾巴，看起来具有着一切生命的基本要素。#!"
 stags:0 "鹿"
 stags_flavor:0 "#F 鹿的四肢纤细，蹄子小得不象话，眼睛大而有神，很容易看出鹿是如何得到它们像精灵那般的声誉。#!"
 goats:0 "山羊"
 goats_flavor:0 "#F 山羊比野羊更瘦甚至更蓬松，但却有令人难以置信的敏捷性。#!"
 monkeys:0 "猴"
 monkeys_flavor:0 "#F 从非洲和南美洲的丛林到亚洲的山区，人猿投下的阴影与人类惊人地相似。#!"
 cats:0 "猫"
 cats_flavor:0 "#F 猫科动物是行走的谜，是接受了人类壁炉的一点野性。#!"
 foxes:0 "狐狸"
 foxes_flavor:0 "#F 狐狸是一种狡猾的动物。它们不是通过威胁或蛮力来达到目的，而是通过狡猾和敏捷的思维。#!"
 raptors:0 "猛禽"
 raptors_flavor:0 "#F 猛禽——鹰、隼、雕——对鸟类就像狮子和老虎对野兽一样。#!"
 gooses:0 "鹅"
 gooses_flavor:0 "#F 在空中或在水上滑行，天鹅是美丽和优雅的缩影。#!"
 owls:0 "猫头鹰"
 owls_flavor:0 "#F 猫头鹰拥有柔软的羽毛，可以无声无息地飞行，巨大而敏感的眼睛让它们在几乎完全黑暗的环境中也能看到东西，它们是夜空的主人。#!"
 ravens:0 "鸦"
 ravens_flavor:0 "#F 大型鸟类，渡鸦，张开翅膀时像一件优雅而不祥的斗篷。#!"
 toads:0 "蛙"
 toads_flavor:0 "#F 青蛙和蟾蜍曾被认为是自发地从泥土中生长出来的。#!"
 golems:0 "魔像"
 golems_flavor:0 "#F 在欧洲，关于用棍子、石头、粘土、泥土甚至是小麦制成的怪物的故事充斥着当地的传说。#!"
 guardians:0 "守卫者"
 guardians_flavor:0 "#F 强大教团的祭司、实力强大的秘密巫师，甚至少量的民间女巫，都知道把力量注入通常没有生命的物体上，以守护他们的密所。#!"
 skeletons:0 "骷髅"
 skeletons_flavor:0 "#F 那些没有新鲜材料可供利用的人仍然可以把一些骨头串起来，重新活化。活化的骷髅战士是一道令人不寒而栗的风景。#!"
 dragons_teeth:0 "龙牙兵"
 dragons_teeth_flavor:0 "#F 由于无法完全依靠人类走狗，许多术士都能随身携带他的守卫，把他们藏在袋子里，直到需要为止。一个简单的袋子加上一把犬齿，就能装下一支由这些不洁战士组成的军队——每颗牙齿一旦被扔到地上，就会长出一个完整的骷髅战士，准备按照主人的吩咐进行撕咬、残害和杀戮。#!"
 boars:0 "猪"
 boars_flavor:0 "#F 野猪比家猪大（肩高三至四英尺），更粗，而且比家猪卑鄙得多，是脾气不好的肉球。#!"
 yulan_jin:0 "盂兰人"
 yulan_jin_flavor:0 "#F 盂兰人是那些灵魂被[yomi_wan|E]折磨得支离破碎的鬼人，因此无法居在自己的身体里。#!"
 ban_ren_guei:0 "半人鬼"
 ban_ren_guei_flavor:0 "#F 半人鬼，或称半魔人，是睡诱忌灵和凡人的后代。#!"
 rat_headed_dragonfly_demon:0 "鼠头蜻蜓妖"
 rat_headed_dragonfly_demon_flavor:0 "#F 蜻蜓妖从一英尺到一英尺半长，翼展可达两英尺，其甲壳具有与苍蝇胸部或水油一样的绚丽的彩虹色。#!"
 sleeper_seducing_bane:0 "睡诱忌灵"
 sleeper_seducing_bane_flavor:0 "#F 这些类似于魅魔的恶魔一点也不迷人。事实上，睡诱忌灵的外观是湿漉漉的、肉乎乎的红色块状物，有几英尺宽，上面镶有各种大小的触角。#!"
 face_robe_demon:0 "人脸礼袍妖"
 face_robe_demon_flavor:0 "#F 人脸礼袍妖的存在即使按照恶灵的标准来看，也是令人不快的。居住在暴行和绝望中的面袍恶魔之所以被命名为人脸礼袍妖，是因为他们有一个令人不快的习惯，就是穿着用受害者的脸制成的雅致长袍。#!"
 unwholesome_nightmare_inducing_ghost:0 "不正梦魇鬼"
 unwholesome_nightmare_inducing_ghost_flavor:0 "#F 这些生命是一种怨灵，是幽灵堕给心魔时剩下的强大的鬼。#!"
 unrighteous_cult_leading_ghost:0 "不义教邪鬼"
 unrighteous_cult_leading_ghost_flavor:0 "#F 在西方被称为幻影的一种鬼魂，这些阴魂乐于在活人中取得崇拜信仰。#!"
 shikome_assassin:0 "泉津刺客"
 shikome_assassin_flavor:0 "#F 泉津是阎魔的冰山美人般的刺客和间谍。#!"
 kumo_huntress:0 "蜘蛛精猎手"
 kumo_huntress_flavor:0 "#F 瘦弱而苍白，[kakuri|E]幽冥的蜘蛛精居民即使在人形形态下也像蜘蛛。#!"
 raksha_of_ravana:0 "罗波那罗刹"
 raksha_of_ravana_flavor:0 "#F 罗刹经常到中原进食和做生意，并偷偷摸摸地在幽冥寻找供品给兰卡。#!"
 the_children_of_tou_mou:0 "斗姆之子"
 the_children_of_tou_mou_flavor:0 "#F 块状的、驼背的、黑铁的、红眼的，一半是人形的自动装置，一半是昆虫，斗姆的子嗣们被设计用来在阎魔女王的界域的恶劣条件下生存。#!"
 mikaboshis_demons_of_iron_and_violence:0 "瓮星的钢铁与暴力之魔"
 mikaboshis_demons_of_iron_and_violence_flavor:0 "#F 寻找目标。终结目标。在终结的过程中尽可能多地造成不必要残害。#!"
 shinjuku_undercity_scavengers:0 "新宿城下清道夫"
 shinjuku_undercity_scavengers_flavor:0 "#F 这些野性的、枯萎的货物崇拜者生命，仍然依附于他们曾经用爪子挖出一个空位的结构装饰。#!"
 fat_striders_of_the_hell_of_boiling_oil:0 "滚油地狱的肥胖飞兽"
 fat_striders_of_the_hell_of_boiling_oil_flavor:0 "#F 从头到尾几乎有两米长，肥胖飞兽的腿伸长后几乎是这个尺寸的两倍。#!"
 wu_huas_corpse_tiger_demons:0 "乌邝的尸虎魔"
 wu_huas_corpse_tiger_demons_flavor:0 "#F 尸虎魔似乎是巨大的（三米高）肌肉发达的男女，有着虎头虎尾，又长又黑的可伸缩的虎爪，而不是手。#!"
 kani_no_jingoku:0 "地狱蟹"
 kani_no_jingoku_flavor:0 "#F 地狱蟹是七大火海的居民，是神秘的阎魔女王——珍珠女帝的仆人。#!"
 generic_servitor:0 "通常从者"
 generic_servitor_flavor:0 "#F 在幽冥，不是每个人都能成为引人注目和独一无二的邪恶仆从。必须有人担任中层怪人的身份，担任蹒跚怖物，担任组成幽冥军团的普通折磨者。#!"
 carnosaurs:0 "肉食性恐龙"
 carnosaurs_flavor:0 "#F 作为史前时代的终极“杀人机器”，食肉龙从鼻子到尾巴有10英尺长到50英尺以上。#!"
 herbosaurs:0 "植食性恐龙"
 herbosaurs_flavor:0 "#F 与这些巨大的食草动物有关的主要危险是被它们践踏，或呆在它们和能在追猎它们的东西之间。#!"
 pterosaurs:0 "翼龙"
 pterosaurs_flavor:0 "#F 翼龙是与恐龙同时代的有翅膀的爬行动物。#!"
 plesiosaurs:0 "蛇颈龙"
 plesiosaurs_flavor:0 "#F 蛇颈龙是海洋哺乳动物，常常被误认为是恐龙。它们有长长的脖子，紧凑宽大的身体，像鳍状的桨臂和短尾巴，它们也有锋利的牙齿和大嘴。#!"
 camels:0 "骆驼"
 camels_flavor:0 "#F 骆驼是阿拉伯的劳动马，一种坏脾气的野兽，除了最强烈的权威之声外，它通常不理会其他声音。#!"
 rams:0 "羊"
 rams_flavor:0 "#F 绵羊是脸色平淡、毛发卷曲的动物，只要在能吃草的地方就能生活。#!"
 hidden:0 "隐尸"
 hidden_flavor:0 "#F 隐尸是一种高度独立和自发行动的活尸，通常可以冒充人类——与其他活尸不同。#!"
 walker:0 "行尸"
 walker_flavor:0 "#F 在微妙的隐尸和实在卑劣的跛行尸之间的中间点，行尸缓慢地腐烂，尽管大多数有足够的意识用香水、衣服和类似的东西来掩盖他们的缺陷。#!"
 shambler:0 "跛行尸"
 shambler_flavor:0 "#F 他们是蹒跚的、液涌的、腐烂的尸体，不应该活着却活着。它们之所以被命名，是因为它们在移动时摇晃和抽搐，因为它们腐烂的肌腱和腐烂的韧带无法正常移动它们的身体。#!"
 soldiers_of_the_emperor:0 "皇帝禁兵"
 soldiers_of_the_emperor_flavor:0 "#F 士兵们在玉之帝国享有巨大的威望，因为他们保卫帝国，对抗恶魔、怨灵和其他入侵者。#!"
 bureaucrats_of_jade_palace:0 "玉宫官僚"
 bureaucrats_of_jade_palace_flavor:0 "#F 居住在帝皇暴风笼罩的皇宫大厅和庭院里的大臣们是独特的，是整个帝国最强的密谋者和官僚。#!"
 demon_jailer:0 "化魔狱卒"
 demon_jailer_flavor:0 "#F 地狱中的狱卒、拷问者和监工都曾利用打磨力量将自己塑造成传说中的恶魔。#!"
 mist_dragons:0 "雾龙"
 mist_dragons_flavor:0 "#F 在这些魔法雾气的深处，有比猫大不了多少的小龙。#!"
 giants:0 "巨人"
 giants_flavor:0 "#F 他们有巨大的身体，通常超过20英尺高，外表类似于肌肉发达的人类，有着粗糙的石肤，促使人们认为他们可能是岩石元素妖的远亲。#!"
 tarrkel:0 "塔克尔"
 tarrkel_flavor:0 "#F 桥底的深渊孕育着人类无法理解的扭曲、噩梦般的生物，这些生物以痛苦为生，以活人的血肉为生。#!"
 fire_salamanders:0 "火蝾螈"
 fire_salamanders_flavor:0 "#F 这些生物虽然类似于它们的凡俗表亲，但却是魔法生物，主要生活在自然界之外的妖精界域。#!"
 firebirds:0 "火鸟"
 firebirds_flavor:0 "#F 火鸟是一种来自东欧斯拉夫地区的色彩艳丽的生物。#!"
 aughisky:0 "水马"
 aughisky_flavor:0 "#F 黑暗的恶魔之马在十字路口出没，或在咸水池塘和溪流附近徘徊。#!"
 lazarites:0 "拉扎列人"
 lazarites_flavor:0 "#F 麻风患者是忌灵的极佳宿主。被繁殖忌灵附身后，拉扎列人被创造出来只有一个目的：生育。#!"
 skull_pigs:0 "骸猪"
 skull_pigs_flavor:0 "#F 骸猪是曾经被称为格隆迪尔的化形族裔——盖亚的清洁和处理管家——的疯狂残余，他们曾经保持整个盖亚没有腐烂和衰败。#!"
 fir_bolgs:0 "费尔博格"
 fir_bolgs_flavor:0 "#F 一个几乎完全由战士和猎手组成的暴力又野蛮的种族。#!"
 glutton_worms:0 "饕餮之虫"
 glutton_worms_flavor:0 "#F 它们看起来大致上就像巨大的蛴螬和臃肿的无皮蛇之间的杂交体；它们没有眼睛，只有一卷淡粉灰色的肉围绕着长长的、类似梭鱼的下巴。#!"
 liderci:0 "吕德西"
 liderci_flavor:0 "#F 这些狡猾的灵体是纯粹欲望的表现，是灵类诱惑者和恶魔爱好者。#!"
 sirens:0 "塞壬"
 sirens_flavor:0 "#F 海上的长发诱惑者，塞壬引诱水手在看不见的暗礁上或在危险的海峡里走向水的坟墓。#!"
 night_hound:0 "十字路口的黑犬"
 night_hound_flavor:0 "#F 在英国，围绕这条可怕的狗的一个传言说，它的到来预示着死亡。人们被告知在晚上要避开这十字路口，因为他们可能会遇到该黑犬。#!"
 incubus:0 "淫魔"
 incubus_flavor:0 "#F 淫魔是诱惑和欲望的恶魔的男性形式，几乎所有的文化都有（尽管名称不同）。#!"
 succubus:0 "魅魔"
 succubus_flavor:0 "#F 魅魔是诱惑和欲望的恶魔的女性形式，几乎所有的文化都有（尽管名称不同）。#!"
 pelesit:0 "巫蛊"
 pelesit_flavor:0 "#F 用自己血肉建造的微小生物，用于探测或其他多种用途。#!"
 balefire_elemental:0 "恶火元素"
 balefire_elemental_flavor:0 "#F 恶火元素也被称为大辐之灵，是为相应的元素妖蛆服务的妖蛆元素，通常被归类为另一种类型的忌灵。#!"
 sludge_elemental:0 "污泥元素"
 sludge_elemental_flavor:0 "#F 污泥元素也被称为大沼之灵，是为相应的元素妖蛆服务的妖蛆元素，通常被归类为另一种类型的忌灵。#!"
 toxin_elemental:0 "毒元素"
 toxin_elemental_flavor:0 "#F 毒元素也被称为大毒之灵，是为相应的元素妖蛆服务的妖蛆元素，通常被归类为另一种类型的忌灵。#!"
 smog_elemental:0 "雾霾元素"
 smog_elemental_flavor:0 "#F 雾霾元素也被称为大霾之灵，是为相应的元素妖蛆服务的妖蛆元素，通常被归类为另一种类型的忌灵。#!"
 fire_elemental:0 "火元素"
 fire_elemental_flavor:0 "#F 火元素，他们将自己视为盖亚的激情，曾经教导人类如何使用火。它们在险棘后面自发地涌现，一旦养分耗尽就会消失。#!"
 air_elemental:0 "风元素"
 air_elemental_flavor:0 "#F 气元素，他们通常居住在[aetherial_realm|E]的外围，或追随影界之风。#!"
 water_elemental:0 "水元素"
 water_elemental_flavor:0 "#F 水元素，居住在影界景观内的水体中#!"
 earth_elemental:0 "土元素"
 earth_elemental_flavor:0 "#F 土元素，据传与盖亚最亲近，通常居住在[penumbra|E]内未受污染的土壤中。#!"
 electricity_elemental:0 "电元素"
 electricity_elemental_flavor:0 "#F 年长的狼族认为，元素是盖亚的第一个造物，较新的元素是一种扭曲，是怒嚎末日的信号。其他人则认为，这些元素一直存在，但缺乏物质来表现自己。虽然有关于高影界地区的元素法庭的故事，但大多数狼族不相信它的存在。元素们说，外人认为的阶级制度只是其自己的假设的投影，而元素随其投影是为了更好地与血肉生物沟通。#!"
 metal_elemental:0 "金元素"
 metal_elemental_flavor:0 "#F 金属元素将自己视为同类的未来统治者，与土元素关系紧张。他们以自己所代表的金属制成的人形出现，通常脾气暴躁、傲慢无礼。#!"
 wood_elemental:0 "木元素"
 wood_elemental_flavor:0 "#F 木神仅比金元素稍微古老一些，但也与人类有着密切的关系。有些木神觉得自己被人类遗弃，而大多数木元素则觉得自己是受害者。#!"
 element_dragon:0 "元素龙"
 element_dragon_flavor:0 "#F 该生物呈龙形，完全由其所源自的元素形成。#!"
 scuttlers:0 "沉船者"
 scuttlers_flavor:0 "#F 凯的灵类仆从。#!"
 chih_mei:0 "魑魅"
 chih_mei_flavor:0 "#F 恶鬼将阎魔赐予的魄融入一具尸体，随之制造出一只原始但又强大的魑魅作为奴隶。#!"
 vampires_hunters:0 "吸血鬼猎人"
 vampires_hunters_flavor:0 "#F 弩是猎杀吸血怪物的首选武器。还有什么更好的方法能让木桩直击要害呢？#!"
 demons_hunters:0 "恶魔猎人"
 demons_hunters_flavor:0 "#F 他们接受过抵抗腐败和驱散幻觉的训练，能无情地打击大敌的爪牙。#!"
 monsters_hunters:0 "怪物猎人"
 monsters_hunters_flavor:0 "#F 对于普通人来说，怪物般的化形者太可怕了。幸运的是，他们不是普通人。#!"
 dazbog_hunters:0 "达兹博格战士"
 dazbog_hunters_flavor:0 "#F 这些英雄是伟大的太阳战神的继承者，他们所到何地都能杀死强大的怪物。#!"
 dragons:0 "龙"
 dragons_flavor:0 "#F 哦，龙\n上天力量的象征。#!"
 minion_of_the_divine:0 "蒙福战士"
 minion_of_the_divine_flavor:0 "#F 在你神圣灵光的激励下，这些骄傲的战士像天使一样战斗。#!"
 angelics:0 "类天使"
 angelics_flavor:0 "#F 正如他们的名字所示的那样，类天使以犹太教–基督教传统中美丽的天使形象出现：长袍、光环和翅膀是常见的装饰，但有些类天使可能会采取更加雌雄同体或闪烁的形态。他们通常在[tempest|E]中飘荡，帮助死灵完成旅程。#!"
 demonics:0 "类恶魔"
 demonics_flavor:0 "#F 顾名思义，类恶魔是一种样貌丑陋、色欲或两者兼而有之的生物。类恶魔的唯一目的似乎就是折磨、奴役或毁灭它们遇到的任何死灵。有些类恶魔可以暂时化身为类天使，在显露真身并施以惩罚之前引导死灵。#!"
 archangelics:0 "类大天使"
 archangelics_flavor:0 "#F 类大天使最初可能与类天使相似，但在某些时候会变成炽热的形态，令人望而生畏。他们通常手持宝剑或审判卷轴，并会使用特殊的呵斥引出死灵的黯影，以摧毁它。然后，死灵的真灵会被类大天使带走，用途不明，但人们怀疑真灵在锻造类大天使的火焰之剑时发挥了作用。#!"
 archdemonics:0 "类大恶魔"
 archdemonics_flavor:0 "#F 类大恶魔与类大天使相反，他们会试图强化而非净化死灵的黯影。起初，他们会向死灵传授新的冥法，但只会传授能让死灵获得惧念的技能。最终，类大恶魔会消磨受害者的意志，让黯影获得控制权，使他们成为[oblivion|E]的仆人。#!"
 djinn:0 "类巨灵"
 djinn_flavor:0 "#F 一些类天使和类恶魔化身为灯神或火巨灵，似乎拥有这些生物所拥有的力量。他们可以为死灵提供巨额财富——当然是冥河城硬币——以及其他物质财富，如宫殿和飞毯遗器。这些财富会让死灵付出沉重的代价。#!"
 ailerons:0 "空翼"
 ailerons_flavor:0 "#F 空翼的身体并不强壮；一张充满钩子的吸盘大嘴、一条长长的鞭状尾巴和一双用来在[tempest|E]气流中滑翔的大翅膀就是它们的全部。它们瘦小的身体和绚丽的色彩让它们在风暴卷起的碎片中几乎无所遁形。#!"
 cerements:0 "墓泥"
 cerements_flavor:0 "#F 墓泥表现为一大团灵质，整体表现出脉动。墓泥是虚诡中比较善良的一种，很少会去惹麻烦。然而，如果死灵遇到了这东西，他们的日子就不好过了；不幸被墓泥缠住的死灵每被困一天，就会失去一年的记忆。墓泥甚至能将受害者的[Fetters|E]和炽情分解出来，并将它们当作自己的记忆使用。最终，被俘虏的死灵自己也会变成墓泥。#!"
 kraken:0 "克拉肯"
 kraken_flavor:0 "#F 克拉肯之所以可怕，是因为它的体型庞大；事实上，它的体型是如此之大，以至于从未有任何死灵报告说见过它的全貌。人们知道它有触手和巨大的眼睛，但对它的外形和身体结构却一无所知。克拉肯也是相当古老的生物；据冥河城大图书馆的报告，在卡戎完成在泣绝岛建立他的伟大王国之前，克拉肯就已经存在了。#!"
 mourners:0 "送葬者"
 mourners_flavor:0 "#F 送葬者乍一看很像摆渡人披着斗篷的身影。不过，送葬者没有提着灯笼和镰刀，而是戴着大量沉重的锁链。他们的脸被笼罩在斗篷的黑暗中，看不见。他们总是成群结队地旅行，一个特定群体中的所有送葬者都被锁在其中最强大的人身上。与许多[tempest|E]生物不同，送葬者出现时似乎总是有一个特定的目标，从[tempest|E]向[shadowlands|E]进军。#!"
 shroudrippers:0 "尸幕撕裂者"
 shroudrippers_flavor:0 "#F 尸幕撕裂者是虚诡中最难以捉摸的一种，很难发现，也几乎不可能捕捉和检查。虽然还没有对它们进行详细的研究，但人们普遍认为尸幕撕裂者拥有小而紧凑的身体，十根“手指”之间有薄薄的蹼，使它们能够飞行。蹼上还有小喷嘴，可以喷出酸液，手指的末端各有一个非常锋利的爪子。不过，尸幕撕裂者裹非常脆弱；被摧毁的尸幕撕裂者的[Corpus|E]中会在几秒钟内融化成一堆不成形的灵质粒子。#!"
 tindelhound:0 "廷德罗斯猎犬"
 tindelhound_flavor:0 "#F 顾名思义，廷德罗斯猎犬表面上很像狗。然而，由于[oblivion|E]的污染，这些狗的脑袋、嘴巴和眼睛都比普通犬类多得多；最多的是十张嘴巴和十五只眼睛。它们的体型也比一般的狗大得多，肩高约15英尺。除了大嘴和体型之外，它们还长着倒钩而非皮毛，从嘴里喷出绿色火焰，并在身后留下烟灰痕迹。如果这还不够的话，廷德罗斯猎犬还相当聪明，能够很快适应异常情况。幸运的是，它们中的大多数都避开了[shadowlands|E]，生活在[tempest|E]的深处。#!"
 hoplites:0 "希腊重装步兵"
 hoplites_flavor:0 "#F 带著你的盾牌回来，或是在盾牌上被抬回来。#!"
 companion_cavalry:0 "伙友骑兵"
 companion_cavalry_flavor:0 "#F “如果你到达世界的尽头还会做什么？”\n“我会反过来去征服另一半。”#!"
 envy_dragon:0 "嫉妒"
 envy_dragon_flavor:0 "#F 嫉妒的本体是一条巨大的海蛇，比任何船只都要长。青面獠牙的龙头位于庞大的蛇身顶端，蛇身有两对爪鳍。嫉妒的身体光滑而柔软，它喜欢多次缠绕船只，让船上的船员和货物无路可逃，最后全部送入深海。#!"
 gluttony_dragon:0 "暴食"
 gluttony_dragon_flavor:0 "#F 这条又大又胖的蛇盘绕在离它出生的地方不远的黑森林北部。这只煤黑色的蜥蜴不需要走很远就能找到一个适合它需要的家。不像他的一些亲族，他没有翅膀，因此不能飞。然而，他在毒蛇形态下的速度足以弥补他的缺陷。他能在短短几分钟内快速穿过大片的土地，在身后留下大片的灰尘和碎片。#!"
 greed_dragon:0 "贪婪"
 greed_dragon_flavor:0 "#F 贪婪之蛇逃入意大利山区，寻找新的家园。很少有人看到这只黑色巨兽划破黑夜。没有人看到他化身为乞丐来到这里，向人们索要礼物，他那银色的舌头总能让最拮据的人松开钱袋。很快，他就积累了足够的财富，开始做生意。这一次，他再次用他的甜言蜜语说服了那些不知情的人，为他的企业吸引了合作伙伴。他们的财富被他收走的同时也在增长。没过多久，他就成为了商业界的一股势力。#!"
 lust_dragon:0 "色欲"
 lust_dragon_flavor:0 "#F 这只红色巨兽在出生后就飞上了天空，越过海水来到了不列颠群岛。色欲之蛇是一只纤细柔韧的龙兽，体型不像某些同类那么大，但仍然十分威猛。它的翅膀有一半体长长。它闪闪发光的鳞片像红宝石一样红，如果不是长着像人一样大的獠牙和长矛一样长的爪子，它就是一只很有吸引力的生物。#!"
 pride_dragon:0 "傲慢"
 pride_dragon_flavor:0 "#F 傲慢之蛇的巢穴位于罗马地下墓穴的深处，他的仆人们早已将隧道封死。一扇厚重、上锁的门是唯一可用的出入口；门外的走廊通向他现在人类形态的宫殿式住所。他在这里与上流社会的人打交道，总是小心翼翼地表现得比别人更英俊一点，衣着更得体一点，令人惊讶的是，举止也更得体一点。他把大部分模拟凡人的事务都交给了值得信赖的人类仆人——通常是被骗的人类仆人。#!"
 sloth_dragon:0 "怠惰"
 sloth_dragon_flavor:0 "#F 怠惰是一只巨大的、脏兮兮的棕色龙蛇，完全不在乎自己的外表。与他的亲戚不同，他没有翅膀或四肢。它是一条长着龙头的巨大肥蛇。正如它的名字一样，它的身体像是一圈坚实的爬行动物绳子，光滑的表面只有偶尔被还在消化的食物块突出。#!"
 wrath_dragon:0 "暴怒"
 wrath_dragon_flavor:0 "#F 当暴怒之蛇来到这个世界时，她的敌意震撼了大地。她的侵略和复仇之念四处蔓延，直到为她的愤怒找到一个心甘情愿的宿主。匈奴人横扫欧洲，满足了这头凶兽的脾气。她沉睡在俄罗斯西部的冰霜之下。当她下次醒来时，一定会有屠杀的气息。#!"