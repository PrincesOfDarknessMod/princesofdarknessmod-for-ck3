l_simp_chinese:
 ghouls:0 "血仆"
 ghouls_flavor:0 "#F 吸血鬼的血债血奴#!"
 szlachta:0 "什拉赫塔"
 szlachta_flavor:0 "#F 血仆是被变幻术重塑血肉而成的，以增加他们的战斗勇武。在增加他们的力量的同时，他们也变得可怕的畸形。#!"
 vozhd:0 "战王"
 vozhd_flavor:0 "#F 十几个血仆通过库都术法融合而成的15英尺高的生物兵器。一堆生物混杂物融混为一个大象大小的多肢体怪物。#!"
 massvampires:0 "刚被初拥的吸血鬼群"
 massvampires_flavor:0 "#F 一群由大规模[Embrace|E]造成的吸血鬼雏儿。血液使他们比凡人更强壮，但是他们才刚刚得到他们的力量。#!"
 kinfolk:0 "狼嫡"
 kinfolk_flavor:0 "#F 狼血部落散兵#!"
 werewolfpack:0 "狼人兽群"
 witchhunters:0 "猎巫人"
 witchhunters_flavor:0 "#F 专精于追杀怪物的凡人#!"
 cultists:0 "密教徒"
 cultists_flavor:0 "#F 信奉超自然魔物和邪神，被[cainites|E]所掌控的凡人#!"
 zombu:0 "还魂尸"
 zombu_flavor:0 "#F 作为仆人而活化尸体。他们不知道恐惧，不会疲劳，而且彻底听话。通常被用作劳工或士兵。#!"
 shades:0 "渊影"
 shades_flavor:0 "#F 最强大的怨灵之一，渊影是被扔进大风暴中的死灵，其被卷入恶湍或大恶湍中，或在畏途中失去自我。#!"
 gargoyles:0 "石像鬼"
 gargoyles_flavor:0 "#F #!"
 wolves:0 "狼群"
 wolves_flavor:0 "#F 自然界中很少有声音比狼的嚎叫更令人心寒。不知何故，它包含了人类对荒野的一切恐惧，也包含了我们所渴望的一切。#!"
 bats:0 "蝙蝠"
 bats_flavor:0 "#F 蝙蝠是一种神秘而令人生畏的动物，它们白天倒睡在树上和洞穴里，晚上飞来飞去，寻找昆虫、水果，有时还有人血等食物。#!"
 rats:0 "老鼠"
 rats_flavor:0 "#F #!"
 scorpions:0 "蝎子"
 scorpions_flavor:0 "#F #!"
 snakes:0 "蛇"
 snakes_flavor:0 "#F 诱惑者，欺骗者，开门者，玷污无知心灵的毒害者，它在人类的想象中盘旋、滑行和咬噬。#!"
 insects:0 "昆虫"
 insects_flavor:0 "#F #!"
 maniacs:0 "疯子"
 maniacs_flavor:0 "#F #!"
 demonic_thralls:0 "魔奴"
 demonic_thralls_flavor:0 "#F 侍奉着可怕的巴力主子的魔奴#!"
 elite_swordsmen:0 "精英剑士"
 elite_swordsmen_flavor:0 "#F 来自当地贵族的最熟练的剑士，被驯会了如何与[cainites|E]并肩作战#!"
 ghouled_cavalry:0 "血仆化骑兵"
 ghouled_cavalry_flavor:0 "#F 血仆化骑士随时准备与他们的主人要杀的人战斗#!"
 guards_guards:0 "受控卫兵"
 guards_guards_flavor:0 "#F 由[cainites|E]控制的当地守卫，被驯会了如何与其并肩作战#!"
 brigands:0 "匪徒"
 brigands_flavor:0 "#F 擅于埋伏的凡人，懂得如何与[cainites|E]并肩作战#!"
 werewolf_pack_flavor:0 "#F 狼人，狼类，纯粹的恐怖！#!"
 werewolf_pack:0 "狼人兽群"
 serpentis_monsters:0 "提丰魔兽"
 serpentis_monsters_flavor:0 "#F 用古蛇术[discipline|E]制造的可怕的魔兽，随时准备开始撕咬。#!"
 crowds:0 "受控群众"
 crowds_flavor:0 "#F 一群凡人，自以为的信任你的功业并尽全力帮助你。#!"
 musketmen:0 "火枪兵"
 musketmen_flavor:0 "#F 可怕的火药开始得到广泛使用，使凡人在面对超自然时的劣势越来越小。#!"
 ZMEI_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('zmei').GetName]作为[men_at_arms|E]"
 DEMONS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('demons').GetName]作为[men_at_arms|E]"
 DEMONIC_THRALLS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('demonic_thralls').GetName]作为[men_at_arms|E]"
 WOLVES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('wolves').GetName]作为[men_at_arms|E]"
 INSECTS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('insects').GetName]作为[men_at_arms|E]"
 SZLACHTA_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('szlachta').GetName]作为[men_at_arms|E]"
 VOZHD_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('vozhd').GetName]作为[men_at_arms|E]"
 GARGOYLES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('gargoyles').GetName]]作为[men_at_arms|E]"
 SHADES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('shades').GetName]作为[men_at_arms|E]"
 RATS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('rats').GetName]作为[men_at_arms|E]"
 ELITE_SWORDSMEN_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('elite_swordsmen').GetName]作为[men_at_arms|E]"
 GHOULED_CAVALRY_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('ghouled_cavalry').GetName]作为[men_at_arms|E]"
 GUARDS_GUARDS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('guards_guards').GetName]作为[men_at_arms|E]"
 BRIGANDS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('brigands').GetName]作为[men_at_arms|E]"
 CULTISTS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('cultists').GetName]作为[men_at_arms|E]"
 the_reavers_of_ur:0 "乌尔的掠夺者"
 the_reavers_of_ur_flavor:0 "#F 一群可怕的起伏不定的灰色形体，将残酷地分尸敌人。#!"
 yin_corpses:0 "活尸"
 yin_corpses_flavor:0 "#F 被注入阴气的尸体，使用作不死族和无意识的仆人。#!"
 amazons:0 "亚马逊"
 amazons_flavor:0 "#F 这些从父权制枷锁中解放出来的女人，将像古代的传说一样为她们的黑怒恩人而战。#!"
 defenders:0 "防护者"
 defenders_flavor:0 "#F 人类需要被保卫，而这些强壮且准备充分的狼嫡已经准备好尽他们的职责。#!"
 herne:0 "赫恩兄弟"
 herne_flavor:0 "#F 一支几乎完全由满月狼组成的快速打击部队，随时准备保卫任何处于危险中的芬尼安圣地。#!"
 mjolnir:0 "妙尔尼尔之子"
 mjolnir_flavor:0 "#F 这些野蛮人战士甚至被其他芬里尔仔兽认为是嗜血狂人，只能远望不可近观。#!"
 stormcrows:0 "风暴鸦"
 stormcrows_flavor:0 "#F 受到雷公的宠爱，风暴鸦主要充当影爵的间谍，但当数量足够多时，它们可以成为一支强大的部队。#!"
 whitewolves:0 "白狼"
 whitewolves_flavor:0 "#F 据传闻，白狼是银牙的祖先，是最纯粹的银牙，在需要的时候出现，帮助部族。#!"
 materialized_spirits:0 "实体化灵类"
 materialized_spirits_flavor:0 "#F 被说服，或被胁迫，在需要的时候向弦月狼给予帮助的灵。它们是难以预测的对手。#!"
 the_lost_ancients:0 "失落古孽"
 the_lost_ancients_flavor:0 "#F 被宇宙遗忘的无形影子，被木乃伊召唤而来协助其。#!"
 wraiths:0 "死灵"
 wraiths_flavor:0 "#F 从冥界召唤出来的实体化死灵。#!"
 POD_animals_maa:0 "[POD_animals_maa|E]"
 POD_controlled_animals:0 "受控动物"
 POD_controlled_animals_flavor:0 "#F 天哪，这么多松鼠……#!"
 zmei:0 "戈里尼奇"
 zmei_flavor:0 "#F 具有宏大力量的可怕生物，曾经的妖蛆侍从，现在束缚于小祖母芭芭雅嘎。#!"
 spectres:0 "怨灵"
 spectres_flavor:0 "#F 从迷宫域召唤而来的实体化怨灵。#!"
 POD_legendary_maa:0 "[POD_legendary_maa|E]"
 POD_demonic_maa:0 "[POD_demonic_maa|E]"
 POD_spirit_maa:0 "[POD_spirit_maa|E]"
 POD_shapeshifter_maa:0 "[POD_shapeshifter_maa|E]"
 POD_gargoyle_maa:0 "[POD_gargoyle_maa|E]"
 POD_ghoul_maa:0 "[POD_ghoul_maa|E]"
 animated_tree:0 "活化树木"
 animated_tree_flavor:0 "#F 盖亚之子周围的树木被活化，以可以抑制或抵御敌人。#!"
 war_avatar_of_great_fenris:0 "大芬里斯的战争化身"
 war_avatar_of_great_fenris_flavor:0 "#F 作为部族和图腾之间契约的最终体现，最伟大的芬里尔仔兽英雄会在他们需要的时候召唤他们部族图腾的战争化身来帮助他们。#!"
 materialized_banes:0 "实体化忌灵"
 materialized_banes_flavor:0 "#F 被说服，或被胁迫，在需要的时候向黑螺旋舞者给予帮助的忌灵。它们是难以预测的对手。#!"
 wyrm_elemental:0 "妖蛆元素"
 wyrm_elemental_flavor:0 "#F 源自妖蛆本身的元素灵。#!"
 POD_plasmic_maa:0 "[POD_plasmic_maa|E]"
 phantasies:0 "幻念"
 phantasies_flavor:0 "#F 类似于活物的灵质体存在。#!"
 deliriums:0 "谵念"
 deliriums_flavor:0 "#F 看起来是经过改造的动物灵质体，如有翅膀的马或有触角的猫。#!"
 legendaries:0 "传奇"
 legendaries_flavor:0 "#F 模仿某种神兽（如凤凰）的灵质体。#!"
 wyrds:0 "诡异"
 wyrds_flavor:0 "#F 与活物或传说生物没有任何类似的灵质体。#!"
 dopplegangers:0 "二重身"
 dopplegangers_flavor:0 "#F 二重身是被黯影吞噬的死灵，但他们保留了自己的个性、自由意志和对冥法的了解。#!"
 heavenlysuccessors_maa:0 "圣传人"
 heavenlysuccessors_maa_flavor:0 "#F 钟馗的继承者，圣传人已经发誓要消灭吸血鬼和其他窃取盖亚灵魂的生物。#!"
 animate_chimera:0 "活化奇魅"
 animate_chimera_flavor:0 "#F 活化奇魅只是具有生命或生命的外观的奇魅。#!"
 enochian_guards:0 "以诺血殿卫士"
 enochian_guards_flavor:0 "#F 远古的战士们再次聚集在一起，保护他们永生的主人。#!"
 maryannu:0 "战车射手"
 maryannu_flavor:0 "#F 骑乘战车勇敢贵族可能已经被凡人遗忘，但这种自豪的传统仍然存在于那些在曾经知道它的人身上。#!"
 romani_scouts:0 "罗姆斥候"
 romani_scouts_flavor:0 "#F 迅速而坚韧的骑兵，善于寻找最佳的战斗方式。#!"
 jagglings:0 "侍灵"
 jagglings_flavor:0 "#F 侍灵是常见的影界“公民”。他们通常有自我意识，并且拥有个人身份。侍灵通常为灵君服务。#!"
 cockatrices:0 "鸡蛇"
 cockatrices_flavor:0 "#F Amidst the desert's shifting sands, there lived a serpent most foul, whose breath and gaze killed many a warrior.#!"
 drake:0 "龙兽"
 drake_flavor:0 "#F The drake has a heavily armored, serpentine body that is all but impervious to the efforts of bow and sword.#!"
 orm:0 "龙蛇"
 orm_flavor:0 "#F The wyrm (alternately orm) lairs in cold climes and closely resembles a giant serpent or eel.#!"
 wyverns:0 "飞龙"
 wyverns_flavor:0 "#F The wyvern is a coiling, winged serpent whose hunting grounds extend from the very northern reaches of Europe all the way to Greece and Ethiopia.#!"
 lindworm:0 "鳞龙"
 lindworm_flavor:0 "#F The elusive lindworm, stalker of the barren wastes.#!"
 amphiptere:0 "翼蛇"
 amphiptere_flavor:0 "#F The amphiptere is a winged, but legless, serpent that travels exclusively by flying.#!"
 sphinx:0 "斯芬克斯"
 sphinx_flavor:0 "#F A sphinx or dragon-cat resembles nothing so much as a tiger or panther with membranous wings, huge fangs, serpent's eyes and smoky breath.#!"
 fu_guardian:0 "石狮"
 fu_guardian_flavor:0 "#F A watchdog of order and civility, this minor dragon resembles a cross between a lion, a dragon and a dog.#!"
 feng_huang:0 "凤凰"
 feng_huang_flavor:0 "#F One fire burns out another's burning, One pain is lessen'd by another's anguish.#!"
 ghul:0 "食尸鬼"
 ghul_flavor:0 "#F These children of Iblis, Prince of Darkness, went out among men to tempt and feed.#!"
 gryphon:0 "狮鹫"
 gryphon_flavor:0 "#F Artifacts pre-dating the glories of Egypt depict the gryphon, the half-lion, half-raptor that soars on the wings of dawn.#!"
 harpy:0 "鹰身女妖"
 harpy_flavor:0 "#F Originally documented in Greek lore, harpies were the harbingers of death and the punishers of pride.#!"
 hippocampi:0 "马头鱼尾兽"
 hippocampi_flavor:0 "#F Horses, running along lakes and oceans, would join with the protean spirits of the waves and water. On occasion, their games would culminate in love-play.#!"
 hippogryph:0 "骏鹰"
 hippogryph_flavor:0 "#F Like the dark legends of their origin, the eagle-horses known as hippogryphs possess a melancholic air and a vicious temperament.#!"
 homunculus:0 "人造人"
 homunculus_flavor:0 "#F Each homunculus  is a signature work of its creator, possessing a real awareness of its creator's goals and wishes, and the magickal theories that have produced it.#!"
 manticore:0 "蝎尾狮"
 manticore_flavor:0 "#F As each animal has its place in the food chain and the cycle of life, the manticore is a living parody of that order.#!"
 pegasus:0 "天马"
 pegasus_flavor:0 "#F As wild and natural as the gems from which its wings draw their coloration — sapphire, ruby, emerald and amethyst — a pegasus is a rare and valuable creature.#!"
 peryton:0 "鹿鹰兽"
 peryton_flavor:0 "#F The peryton is strangely compelling for such a lethal animal. Its deer's head has soft black, brown or gray fur.#!"
 phoboros:0 "福波斯"
 phoboros_flavor:0 "#F A phoboros resembles a small white bull. Many aspects of this creature link it symbolically to the moon, and thus to the waters of the world.#!"
 roc:0 "大鹏"
 roc_flavor:0 "#F Rocs are gigantic birds resembling brilliant white or speckled golden hawks.#!"
 seabishop:0 "主教鱼"
 seabishop_flavor:0 "#F The elusive \"sea bishop\" is an enigma. Discovered when one was beached, these entities hide from humanity beneath the waves, shunning contact with the surface world.#!"
 sea_serpent:0 "大海蛇"
 sea_serpent_flavor:0 "#F Haunting the deepest parts of the ocean and large seas and bays, sea serpents are the bane of far-traveling ships.#!"
 shadhavar:0 "独角羚"
 shadhavar_flavor:0 "#F An antelopelike creature, the shadhavar roams the plains where the wind blows freely.#!"
 simurgh:0 "西摩格"
 simurgh_flavor:0 "#F The oracle at Delphi, the old man on the mountain and the three Fates in a cave all exemplify the omniscient hermit who secludes him or herself from humankind.#!"
 umkovu:0 "姆科夫"
 umkovu_flavor:0 "#F The wretched desert takes its form, the jackal proud and tight. In search of you, I feel my way through the slowest heaving night.#!"
 unicorn:0 "独角兽"
 unicorn_flavor:0 "#F One by one in the moonlight there, Neighing far off on the haunted air. The unicorns come down to the sea.#!"
 vodayany:0 "伏地诺"
 vodayany_flavor:0 "#F Creatures throughout the ages have crawled out from the gloomy surface of still lakes and left their marks on shore for mortals to ponder.#!"
 wilde_beast:0 "蛮兽"
 wilde_beast_flavor:0 "#F A wilde beast combines the best predatory skills of the lion with the docile, loyal personality traits of a spaniel.#!"
 thinbloods:0 "淡血种"
 thinbloods_flavor:0 "#F 大量初拥的第十四代或更后的吸血鬼。#!"
 SNAKES_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('snakes').GetName]作为[men_at_arms|E]"
 THINBLOODS_LEGACY_PERK_UNLOCK_DESC:0 "能够招募[GetMaA('thinbloods').GetName]作为[men_at_arms|E]"