 pod_reconquista_struggle.0501.t: "暗影再征服"
 pod_reconquista_struggle.0501.desc: "自罗马帝国灭亡以来，勒森魃一直是伊比利亚地区的最高统治者。但这时代即将迎来一个血腥的结局，因为半岛上的凡人宗教纷争终于漫入了黑夜世界。\n勒森魃内战于1172年随着穆尔西亚的陷落而正式爆发，从那时起，双方的煽动者，如安布罗西奥·路易斯·蒙卡达和巴德尔，为了各自的利益而献上了战争之火。\n伊比利亚现在处于混乱之中，随着雇佣兵、外来者和机会主义者涌向某一方，谁（如果有的话）将从这个熔炉中获得胜利，还有待观察。\n\n"
 pod_reconquista_struggle.0501.desc.involved: "伊比利亚曾被冈格罗统治，然后是迦太基的布鲁赫和罗马的梵卓，现在……现在是我对这片土地提出宣称的时候了。\n\n"
 pod_reconquista_struggle.0501.desc.interloper: "伊比利亚曾被冈格罗统治，然后是迦太基的布鲁赫和罗马的梵卓，现在……现在是我对这片土地提出宣称的时候了。\n\n"
 pod_reconquista_struggle.0501.a: "把握命运！"
 secure_reconquista_foothold_decision_title: "伊比利亚立足点"
 secure_reconquista_foothold_decision_desc: "伊比利亚的勒森魃内战是一场机遇。他们不会对外部的威胁有任何准备。"
 secure_reconquista_foothold_decision_tooltip: "整合伊比利亚的一部分"
 secure_reconquista_foothold_decision_confirm: "成为最强"
 reconquista_struggle_phase_hostility_or_opportunity_tt: "再征服斗争必须处于暗影战争或混乱阶段。"
 struggle_secure_reconquista_foothold_ends_the_struggle_tt: "斗争结束。"
 pod_reconquista_struggle.100.t: "伊比利亚的黎明"
 pod_reconquista_struggle.100.desc: "分裂的勒森魃氏族给了半岛上的外来者一个巨大的机会。由于他们的兵刃相向，他们对外界的威胁视而不见，直到为时已晚。\n在新的领导层的带领下，伊比利亚正在慢慢忘记暗影再征服、午夜新月和他们所有的争吵。这是一个新的时代，在经历了伊比利亚冈格罗、迦太基布鲁赫、罗马梵卓和勒森魃之后，伊比利亚将不得不再次适应新的主人。"
 pod_reconquista_struggle.100.a: "伊比利亚需要着新血。"
 pod_reconquista_struggle.101.desc: "分裂的勒森魃氏族给了半岛上的外来者一个巨大的机会。由于他们的兵刃相向，他们对外界的威胁视而不见，直到为时已晚。\n在新的领导层的带领下，伊比利亚正在慢慢忘记暗影再征服、午夜新月和他们所有的争吵。这是一个新的时代，在经历了伊比利亚冈格罗、迦太基布鲁赫、罗马梵卓和勒森魃之后，伊比利亚将不得不再次适应新的主人。"
 pod_reconquista_struggle.101.a: "该死的闯入者。"
 shadow_reconquista_tt: "该结局只对非[Glossary('阿什拉派','game_concept_ashirra_desc')]勒森魃可用"
 ashirra_reconquista_tt: "该结局只对[Glossary('阿什拉派','game_concept_ashirra_desc')]和塔里克·哈基姆可用"
 noconquista_objective_decision: "第三条路"
 noconquista_objective_decision_tooltip: "现在是驱散伊比利亚上空的阴影的时候了。"
 noconquista_objective_decision_desc: "基督教的勒森魃和[Glossary('阿什拉派','game_concept_ashirra_desc')]在信仰问题上的争吵，使伊比利亚无法实现其真正的潜力。这种情况不能再继续下去。"
 noconquista_objective_decision_confirm: "伊比利亚觉醒！"
 noconquista_objective_decision_effect_tooltip: "勒森魃国度将被削弱。你将获得一个强大的修正。如果你还没有，你将获得入侵[casus_belli|E]，你还可以获得对其花费的折扣"
 thirdway_reconquista_tt: "该结局只对非[Glossary('阿什拉派','game_concept_ashirra_desc')]色可用"
 thirdway_effect_tt: "勒森魃国度将被破碎权威修正削弱。如果你还没有，你将获得入侵[casus_belli|E]，你还可以获得对其花费的折扣"
 heir_yzebel_modifier: "耶洗别的继承者"
 heir_yzebel_modifier_desc: "第一位统一了伊比利亚的吸血鬼——迦太基的耶洗别，在该角色上找到了她的传承。"
 pod1230objectives.113.t: "第三条路"
 pod1230objectives.113.desc: "伊比利亚有一个很长的历史。起初，伊比利亚是由一群游荡的冈格罗战将占据的，然后由迦太基的布鲁赫耶洗别统一，直到她被罗马的梵卓击败。然后，利用双方在战争后的脆弱，勒森魃进入半岛并迅速巩固了他们对该地区的控制。\n然而，他们的内战极大地削弱了他们的地位，以至于一个新的势力在伊比利亚崛起。许多人认为勒森魃会一直存在下去，但现在他们被证明是错误的。这片土地有了一个新的主人，而暗影之氏族只能为在他们的主场遭到如此彻底的失败而感到羞愧。"
 pod1230objectives.113.a: "我将比他们所有人都更持久！"
 pod1230objectives.114.a: "历史翻开了下一页。"
 struggle_parameter_unlocks_secure_reconquista_foothold_decision: "为伊比利亚或附近的未参与的角色解锁保障伊比利亚立足点决议。"
 pod_reconquista_struggle.1000.t: "紧张与机遇"
 pod_reconquista_struggle.1000.desc: "伊比利亚正处于崖边。每个吸血鬼都在试图利用他们对凡人民众的影响力来获得优势。这种持续的拉扯和推动使该地区的凡人几乎变得疯狂，对一切事物和人进行暴动和抗议。\n这种不自然的紧张局势为领主们提供了一些机会，而你的内阁正推动你去煽风点火，确保它不会很快停止。毕竟紧张的凡人就是容易被操纵的凡人。"
 pod_reconquista_struggle.1000.a: "让我们谨慎地将局势激化。"
 pod_reconquista_struggle.1000.b: "你提出了这个解决方案，你自己来做。"
 pod_reconquista_struggle.1000.c: "不，凡人太宝贵了，不能挥霍。"
 pod_reconquista_struggle.1000.d: "我为什么要在乎凡人呢？"
 pod_reconquista_struggle.1001.t: "午夜浴场"
 pod_reconquista_struggle.1001.desc: "豪华浴场是罗马时代的遗物，遍布伊比利亚，是有影响力的凡人喜欢的消遣方式。长期以来，这项业务一直由当地的该隐之子经营，他们以保密为荣，只在非常不定期的情况下与黑夜的亲王和苏丹打交道。\n但最近，一位穆斯林学者证明了洗澡对凡人的健康有好处，使这些秘密的“澡堂老板”走出隐蔽的地方，要求提供资金以扩大他们的业务。他们认为，健康的凡人是有用的凡人，因此你们都可以从这种扩张中受益。"
 pod_reconquista_struggle.1001.a: "你将获得我的支持。"
 pod_reconquista_struggle.1001.b: "把他们的浴场拆了，留下值钱的东西拿来给我！"
 pod_reconquista_struggle.1001.c: "我现在不做投资。"
 pod_reconquista_struggle.1020.t: "狮与刀"
 pod_reconquista_struggle.1020.desc: "在吞噬伊比利亚的冲突中，双方都有狂热者。罗德里戈之狮为基督教的勒森魃而战，即使是他们，有时也会因为战斗中的野蛮行为而感到困扰。对于[Glossary('阿什拉派','game_concept_ashirra_desc')]来说，“刀锋之网”的名声已经无需证明，可怕的谋杀夜夜都在上演。\n最近有一队人马出现在你的首都，声称要追捕一名“非信者间谍”，然后留下了一堆尸体和破坏。\n像往常一样，你被留在这里处理后果。"
 pod_reconquista_struggle.1020.a: "尽快恢复秩序。"
 pod_reconquista_struggle.1020.b: "非信者间谍？！为了安全起见，抢劫和烧毁剩下的东西！"
 pod_reconquista_struggle.1020.c: "责备他人，然后继续前进。"
 pod_reconquista_struggle.3011.t: "守夜"
 pod_reconquista_struggle.3011.desc: "熙德对基督教的勒森魃产生了深远的影响。他的坟墓已成为有潜力的骑士的崇拜场所，其广泛传播的仪式被称为“守夜”。由于熙德也受到[Glossary('阿什拉派','game_concept_ashirra_desc')]的尊重，当虔诚的朝圣者在伊比利亚各地活动履行职责时，双方达成了非正式的休战。\n但有时，而且比双方都承认的更多的是，这种休战没有得到尊重，旅行者成为暗影再征服的另一个牺牲品。这样一群基督徒勒森魃正在你的土地上移动，请求熙德之和，以便自由移动。你会怎么做？"
 pod_reconquista_struggle.3011.a: "一个值得尊重的习俗。"
 pod_reconquista_struggle.3011.b: "对通过我的土地征收微薄的税款似乎是合理的。"
 pod_reconquista_struggle.3011.c: "虔诚的教友们，请接受护卫和我的祝福。"
 pod_reconquista_struggle.3011.d: "等着受赎吧，天真的傻瓜们！"
 struggle_reconquista_phase_shadows_desc: "暗影再征服从之名从未如现在般恰当。亲王和苏丹们正在策划他们的下一步行动，虽然存在着公开的战争，但比起暗地里的刀光剑影，它不那么流行。"
 struggle_reconquista_phase_hostility_desc: "紧张和怨恨终于为对邻居和同胞们的公开袭击开了口。随着伊比利亚在夜间的燃烧，潜藏比以往任何时候都更加稀薄。"
 struggle_reconquista_phase_reprieve_desc: "即使是吸血鬼也需要时不时地恢复。权力的巩固现在正在发生，因为亲王和苏丹要确保他们的影响力和势力为下一阶段做好准备。"
 reconquista_struggle_desc: "自罗马帝国灭亡以来，勒森魃一直是伊比利亚地区的最高统治者。但这时代即将迎来一个血腥的结局，因为半岛上的凡人宗教纷争终于漫入了黑夜世界。\n勒森魃内战于1172年随着穆尔西亚的陷落而正式爆发，从那时起，双方的煽动者，如安布罗西奥·路易斯·蒙卡达和巴德尔，为了各自的利益而献上了战争之火。\n伊比利亚现在处于混乱之中，随着雇佣兵、外来者和机会主义者涌向某一方，谁（如果有的话）将从这个熔炉中获得胜利，还有待观察。"
 assamite_struggle: "分裂的家族"
 assamite_struggle_desc: "自从哈基姆圣裔家族的传奇创始人哈基姆建立鹰巢以来，他们一直统治着波斯。在外人看来，从那时起，他们之间就只有完美的团结，但事实却非常不同。\n派系主义有可能从内部瓦解哈基姆的子嗣引以为豪的纪律。新最长者的登位，即有争议的纳穆尔图姆，可能是导火索。虽然一场内战似乎还没有发生，但每个团体现在都在磨刀霍霍，以确保他们，也只有他们，能够塑造哈基姆圣裔的未来。"
 pod_assamite_struggle.0501.t: "分裂的家族"
 pod_assamite_struggle.0501.desc: "自从哈基姆圣裔家族的传奇创始人哈基姆建立鹰巢以来，他们一直统治着波斯。在外人看来，从那时起，他们之间就只有完美的团结，但事实却非常不同。\n派系主义有可能从内部瓦解哈基姆的子嗣引以为豪的纪律。新最长者的登位，即有争议的纳穆尔图姆，可能是导火索。虽然一场内战似乎还没有发生，但每个团体现在都在磨刀霍霍，以确保他们，也只有他们，能够塑造哈基姆圣裔的未来。\n这其中的主要竞争者是刀锋之网，一个由嗜杀的狂热者组成的秘密密教；[Glossary('阿什拉派','game_concept_ashirra_desc')]，赞成让该氏族更接近伊斯兰教；卷轴议会，代表温和派和调和派；道统，由祆教老卫士组成的精英团体；最后是失落部族，一个神秘的异端密教。\n#italic 分裂的家族的胜利是由影响力决定。你可以用一个次要决议来检查每个派别的进展。#!"
 pod_assamite_struggle.0501.a: "哈基姆在看着。"
 struggle_parameter_unlocks_no_wars: "无法对[struggle_involved|E][rulers|E]宣战"
 NO_WARS_STRUGGLE_PARAMETER_CD: "你正处于一个不能攻击该角色的斗争阶段。"
 secure_assamite_foothold_decision_title: "波斯立足点"
 secure_assamite_foothold_decision_desc: "波斯的哈基姆圣裔分裂是一场机遇。他们不会对外部的威胁有任何准备。"
 secure_assamite_foothold_decision_tooltip: "整合波斯的一部分"
 secure_assamite_foothold_decision_confirm: "成为最强"
 pod_assamite_struggle.100.t: "波斯的黎明"
 pod_assamite_struggle.100.desc: "分裂的哈基姆圣裔氏族给了波斯的外来者一个巨大的机会。由于他们的兵刃相向，他们对外界的威胁视而不见，直到为时已晚。\n在新的领导层的带领下，波斯正在慢慢忘记刀锋之网、鹰巢和他们所有的争吵。这是一个新的时代，时间将证明这个新的征服者是否能够使波斯屈服于他们的想法，或者像许多人一样被其顽固的居民所击溃。"
 pod_assamite_struggle.100.a: "波斯需要着新血。"
 pod_assamite_struggle.101.desc: "分裂的哈基姆圣裔氏族给了波斯的外来者一个巨大的机会。由于他们的兵刃相向，他们对外界的威胁视而不见，直到为时已晚。\n在新的领导层的带领下，波斯正在慢慢忘记刀锋之网、鹰巢和他们所有的争吵。这是一个新的时代，时间将证明这个新的征服者是否能够使波斯屈服于他们的想法，或者像许多人一样被其顽固的居民所击溃。"
 pod_assamite_struggle.101.a: "该死的闯入者。"
 struggle_assamite_phase_shadows: "家族紊乱"
 struggle_assamite_phase_shadows_desc: "哈基姆圣裔勉强维持着他们的表面团结。空气中弥漫着怨恨，到处都是出鞘的刀子。"
 struggle_assamite_phase_hostility: "家族破碎"
 struggle_assamite_phase_hostility_desc: "当看到他的子嗣们互相争斗，哈基姆一定会流泪。鹰巢正在从内部崩溃。"
 struggle_assamite_phase_reprieve: "家族愈合"
 struggle_assamite_phase_reprieve_desc: "与大多数吸血鬼相比，哈基姆圣裔正表现出更多的理智，他们现在公开谈论他们的分歧，希望能够合理地解决当前的问题。"
 urshulgi_victory_objective_decision_tt: "刀锋之网的影响达到顶流。"
 urshulgi_victory_objective_decision_tt2: "卷轴议会的影响已不存在。"
 assamite_struggle_victory_effect_tooltip: "如果你还没有鹰巢[title|E]，你会得到它。此外，所有在外交范围内的阿刹迈角色现在都将毫无疑问地接受被附庸"
 assamite_struggle_needed_tt: "你需要成为分裂的家族斗争的一部分，这就要求你的首都必须在分裂的家族的斗争地区（波斯王国、河中、弥兰、迦布罗、答儿密、呼罗珊/刀锋之网）"
 assamite_victory_objective_decision_tt: "刀锋之网的影响已不存在。"
 assamite_victory_objective_decision_tt2: "卷轴议会的影响，或阿什拉派的影响，达到顶流。"
 losttribe_victory_objective_decision_tt: "失落部族的影响达到顶流。"
 losttribe_victory_objective_decision_tt2: "道统的影响已不存在。"
 losttribe_victory_objective_decision_tt3: "阿什拉派的影响已不存在。"
 losttribe_victory_objective_decision_effect_tooltip: "大量哈基姆圣裔将皈依洗拉密教，洗拉本人也会祝福你，改善你的角色。"
 losttribe_victory_objective_decision_desc: "洗拉密教早已被逐出鹰巢的政治舞台。但是，次代的忠实仆人们除了顽强毫无所有。现在依旧是让哈基姆圣裔看到他们父亲的罪孽的时候。"
 losttribe_victory_objective_decision_tooltip: "哈基姆是一个必须被揭露的骗子！"
 losttribe_victory_objective_decision_confirm: "洗拉的荣耀得到了确保"
 pod_assamite_struggle.102.t: "洗拉的子嗣"
 pod_assamite_struggle.102.desc: "失落部族在鹰巢的政治中缓慢地、精心地回归，对阿刹迈产生了深刻的影响。他们曾经忠于他们的创始人哈基姆，现在却在诅咒三代对次代，特别是对洗拉的罪行。\n泣石，显然是洗拉本人的安息之地，已经成为一个朝圣的场所，许多人前往那里，喝下从石头上流下的血泪，体验洗拉很久以前感受到的折磨。\n具有讽刺意味的是，从外面看，阿刹迈仍然是一个奇怪的密教，致力于一个奇怪的目的。但从内部来看，事情将永远不会相同。"
 pod_assamite_struggle.102.a: "我们将为我族最古老的罪行复仇。"
 pod_assamite_struggle.103.a: "是时候遵从真相了。"
 pod_assamite_struggle.103.b: "绝不！赞美哈基姆！"
 pod_assamite_struggle.104.a: "奇怪氏族的奇怪事件。"
 pod_assamite_struggle.102.custom: "大量哈基姆圣裔将皈依洗拉密教。"
 silsila_victory_objective_decision_tt: "道统的影响达到顶流。"
 silsila_victory_objective_decision_tt2: "失落部族的影响已不存在。"
 silsila_victory_objective_decision_effect_tooltip: "你将获得以用更低花费购买宝物宣称的可能性。"
 silsila_victory_objective_decision_desc: "道统是哈基姆圣裔的精神精英，深受琐罗亚斯德教诲的影响。自伊斯兰教兴起后，他们的地位被削弱了，但他们仍然拥有足够的影响力，对未来充满希望。"
 silsila_victory_objective_decision_tooltip: "我们是哈基姆的真正精英。"
 silsila_victory_objective_decision_confirm: "理所应当"
 pod_assamite_struggle.105.t: "中央支柱"
 pod_assamite_struggle.105.desc: "哈基姆圣裔的精英祭司战士——道统，在鹰巢的政治中已经逐渐失去了影响力，这是因为他们受制于衰落的祆教。纳穆尔图姆在1214年作为最长者的残酷回归并没有起到任何作用，因为她领导氏族的无情方法进一步团结了其他派别来反对守旧。\n然而，随着道统慢慢地设法扭转局面，利用对手的分裂，并证明他们致力于消灭异端以维护自己的地位，这种情况已经改变。对这个小种姓来说，一切都不太妙，但就目前而言，哈基姆圣裔的其他成员都承认他们的统治权，并团结在哈基姆和琐罗亚斯德的继承人的背后。"
 pod_assamite_struggle.105.a: "我们是唯一够格的统治者。"
 pod_assamite_struggle.106.a: "传统再次胜利。"
 assamite_factions_decision: "波斯斗争现状"
