 pod_assamite_struggle.108.t: "刀锋之网"
 pod_assamite_struggle.108.desc: "刀锋之网是哈基姆圣裔的一个非官方派别，是一个秘密的刺客教派，致力于崇拜一位名叫乌尔·舒尔吉的神秘玛土撒拉。他们是狂热分子，愿意摧毁任何拒绝为其主人服务的吸血鬼。他们也被称为嗜血的杀手，对整个[Glossary('阿什拉派','game_concept_ashirra_desc')]在外人眼中的恶名负有责任。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 pod_assamite_struggle.108.a: "帮助这派别"
 pod_assamite_struggle.108.b: "掌控这派别"
 pod_assamite_struggle.108.c: "目前啥也不做"
 faction_gain_influence_tt: "该派别的影响将提升"
 faction_lose_influence_tt: "该派别的影响将降低"
 pod_assamite_struggle.109.t: "阿什拉派"
 pod_assamite_struggle.109.desc: "哈基姆圣裔的这一强大派别主张与[Glossary('阿什拉派','game_concept_ashirra_desc')]运动进行更紧密的合作。它主要由年轻的吸血鬼组成，他们生前是伊斯兰教的追随者，但也有几个强大的长者皈依了这一事业。随着伊斯兰教在该地区越来越占主导地位，阿什拉派派别已成大势。他们倾向于与卷轴议会结盟，希望能成为所有其他人都能接受的妥协选择。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 pod_assamite_struggle.110.t: "卷轴议会"
 pod_assamite_struggle.110.desc: "卷轴议会最初是为了追求和保护鹰巢的知识而成立的，现在已经演变成术士和维齐尔的一个政治派别，他们赞成对当前的危机采取妥协的解决方案。尽管有这样的立场，他们还是激烈地反对刀锋之网，主要源自他们的创始人阿什拉夫的影响。议会目前正在与[Glossary('阿什拉派','game_concept_ashirra_desc')]派别合作，认为他们是未来保持哈基姆圣裔稳定的一个好选择。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 pod_assamite_struggle.111.t: "道统"
 pod_assamite_struggle.111.desc: "在祆教统治时期，鹰巢的精英战士祭司是鹰巢的真正领袖。因此，他们与这种宗教密切相关，并与他们的信仰一起衰落。1214年，纳穆尔图姆作为最长者的回归有助于保护他们仅存的一点影响力，但这可能太晚了，尤其是在绝大多数新的哈基姆圣裔都来自穆斯林凡人的情况下。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 pod_assamite_struggle.112.t: "失落部族"
 pod_assamite_struggle.112.desc: "失落部族是一个（大部分）由哈基姆圣裔组成的异端密教，他们崇拜死去的洗拉，并试图通过摧毁杀害她的凶手——三代，以及那些追随他们的人为她复仇。这使他们与崇尚哈基姆的其他$pod_clan$直接冲突，因此，他们一次又一次地被清除出鹰巢的政治。然而，他们的影响是阴险的，他们往往在人们最不期待的时候再次出现。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 clashing_heretics_modifier: "异端冲突"
 clashing_heretics_modifier_desc: "该伯爵领是两个相互冲突的派别之间的暗影战争的中心。"
 pod_assamite_struggle.1000.t: "异端冲突"
 pod_assamite_struggle.1000.desc: "虽然都是哈基姆圣裔内部的异端密教，但失落部族和刀锋之网对彼此都没有好感。他们把自己的同行视为对$pod_clan$最紧迫的威胁，他们的暗影战争可能是所有派别中最致命的。\n你的一个伯爵领最近出现了这种激进的活动，这两个密教都在扰乱凡人的生活，处理起来越来越复杂。你不太可能和他们讲道理，但站在一个派别一边可能会确保，至少，这种干扰不会持续太长时间。"
 pod_assamite_struggle.1000.a: "帮助刀锋之网"
 pod_assamite_struggle.1000.b: "帮助失落部族"
 pod_assamite_struggle.1000.c: "操纵每个派别来解决这个问题。"
 pod_assamite_struggle.1000.a.success: "处理了。"
 pod_assamite_struggle.1000.a.failure: "更糟了……"
 pod_assamite_struggle.1000.d: "我才是统治者，不是他们！"
 wok_gain_influence_tt: "刀锋之网获得影响"
 wok_lose_influence_tt: "刀锋之网失去影响。"
 losttribe_gain_influence_tt: "失落部族获得影响。"
 losttribe_lose_influence_tt: "失落部族失去影响"
 pod_assamite_struggle.1001.t: "信徒的职责"
 pod_assamite_struggle.1001.desc: "[Glossary('阿什拉派','game_concept_ashirra_desc')]社区在波斯非常强大。这个运动的信条之一是让凡人随心所欲地生活，尽可能少地受到吸血鬼的干扰。显然，这对一个黑夜的统治者来说并不总是很实际。\n一个这样的阿什拉派代表最近来到你的领地，抱怨你的代理人对该地区的凡人事务采取了过于严厉的做法。"
 pod_assamite_struggle.1001.a: "谈判达成妥协。"
 pod_assamite_struggle.1001.a.success: "不错的交易。"
 pod_assamite_struggle.1001.a.failure: "喊叫和争吵。"
 pod_assamite_struggle.1001.b: "好吧，我们不会介入到其中。"
 ashirra_gain_influence_tt: "阿什拉派获得影响"
 ashirra_lose_influence_tt: "阿什拉派失去影响。"
 pod_assamite_struggle.1001.c: "我们自有国情在此！"
 pod_assamite_struggle.1002.t: "关于哈基姆的真相"
 pod_assamite_struggle.1002.desc: "哈基姆在他的子嗣中是一位受人尊敬的人物，但对他们中的大多数人来说仍然是一个谜。在他活跃的时候，他是一个少言寡语的人，他的失踪只是加深了围绕他的传言。随着族人目前的分裂，哈基姆的真实本性这一话题自然而然地出现在人们面前。\n作为一个有影响力的黑夜统治者，你的意见比大多数人都重要。"
 pod_assamite_struggle.1002.a: "哈基姆虽然伟大，但只是最伟大者的仆人。"
 silsila_gain_influence_tt: "道统获得影响。"
 pod_assamite_struggle.1002.b: "哈基姆是对人类存在的最终审判。"
 council_gain_influence_tt: "卷轴议会获得影响"
 pod_assamite_struggle.1002.c: "一个伟大的人，尽管不那么完美。"
 pod_assamite_struggle.1002.d: "我不认为哈基姆有那么重要……"
 pod_assamite_struggle.1003.t: "失落的卷轴"
 pod_assamite_struggle.1003.desc: "你的派员最近抓住了一个被鹰巢研究了一段时间的小偷。经过仔细检查，这个人似乎并不是一个真正的小偷，而是一个学者，显然，他有一本源自琐罗亚斯德时代的重要文书。\n道统的领导层是历史的守护者，而且大多是祆教教徒，他们要求你把这文书交给他们，且会对你的帮助进行补偿。但你还有其他选择……"
 pod_assamite_struggle.1003.a: "这是我的荣幸。"
 silsila_lose_influence_tt: "道统失去影响。"
 pod_assamite_struggle.1003.b: "烧了卷轴。和“窃贼”。"
 pod_assamite_struggle.1003.c: "我有其他可能会感兴趣的朋友……"
 pod_assamite_struggle.1003.d: "我会留着它。"
 pod_assamite_struggle.1004.t: "拔刀"
 pod_assamite_struggle.1004.desc: "你领地的一个外围村庄最近被刀锋之网的狂热者“拜访”了，如果幸存者说的是真的，他们在寻找一个非信者间谍。像往常一样，刀锋之网的做事方式很残忍，对你的凡人臣民来说尤其具有创伤性。\n清理这个烂摊子应该不难，但你可能想对这种对你权威的暗中攻击作出反应。"
 pod_assamite_struggle.1004.a: "有间谍？把村子夷为平地！"
 pod_assamite_struggle.1004.b: "公开谴责刀锋之网。"
 wok_lose_lot_influence_tt: "刀锋之网失去大量影响。"
 pod_assamite_struggle.1004.c: "追踪并处理侵略者。"
 pod_assamite_struggle.1004.d: "没有必要为了这么点小事而激怒刀锋之网。"
 pod_assamite_struggle.1005.t: "间谍之地"
 pod_assamite_struggle.1005.desc: "波斯是个大地方，这使得一个可靠的信使来回系统对鹰巢而言非常重要。虽然血仆信使很不错，但你很肯定他们的大部分旅行都被当前斗争中比较审慎的派别所监控。你怀疑实际上很有可能你的报告和其他信件都被你的敌人例行截获。\n卷轴议会最近提出了一个新的系统，由著名的阿什拉夫创造，一个由巨灵的力量赋能的魔法球，允许更远的通信。然而，可以听到一些反对的声音，因为他们认为这只是意味着改变谁在监视谁……"
 pod_assamite_struggle.1005.a: "出色的倡议，我要一个。"
 pod_assamite_struggle.1005.b: "我将想出我自己的体系。"
 council_lose_influence_tt: "卷轴议会失去影响。"
 pod_assamite_struggle.1005.c: "议会在操纵我们！"
 pod_assamite_struggle.1006.t: "哈基姆的女儿们"
 pod_assamite_struggle.1006.desc: "在哈基姆圣裔文化中，初拥女性从来都不是一个特别大的问题，尤其是哈基姆本人也这样做，但[Glossary('阿什拉派','game_concept_ashirra_desc')]运动的兴起改变了这一状态。在战士种姓中，初拥女性的做法在8世纪就不受欢迎了，因为人们开始认为给予女性亡生诅咒是不道德的。\n这种分裂至今仍然存在，尽管几十年来战士们已经开始放松这一政策。因此，虽然这个问题不像以前那样紧迫，但它仍然是哈基姆的儿子和女儿之间争论的问题。"
 pod_assamite_struggle.1006.a: "我仍然觉得不对劲。"
 pod_assamite_struggle.1006.b: "哈基姆知道他在做什么。"
 pod_assamite_struggle.1006.c: "老实说，这该采取另一条道。"
 pod_assamite_struggle.1007.t: "三大种姓"
 pod_assamite_struggle.1007.desc: "没有人真正知道种姓制度是什么时候在哈基姆圣裔社会中真正形成的，但它现在已经成为波斯亡生中不可或缺的一部分。传统上，维齐尔是三者中的领导者和最活跃的政治人物，但近来权力慢慢转移到了战士手中。术士的话，则长期以来一直是一个隐蔽的群体，他们人数少，是种姓中最弱的。\n种姓制度与哈基姆圣裔社会中的政治派别一起运作，虽然你可以在任何派别中找到任何种姓，但根据你的政治议程，有些种姓比其他种姓更受青睐。"
 pod_assamite_struggle.1007.a: "战士带领我们前进。"
 pod_assamite_struggle.1007.b: "术士知道真理。"
 pod_assamite_struggle.1007.c: "维齐尔是我们的天生领袖。"
 pod_assamite_struggle.1007.d: "我们必须团结一致。"
 losttribe_victory_objective_decision: "洗拉的子嗣"
 silsila_victory_objective_decision: "中央支柱"
 council_gain_lot_influence_tt: "卷轴议会获得大量影响"
 pod_assamite_struggle.1008.t: "阿什拉夫的奥秘"
 pod_assamite_struggle.1008.desc: "术士种姓的首领，阿姆尔，一直都是神秘的阿什拉夫，他是更神秘的乌尔·舒尔吉的一个古老而广受尊敬（和恐惧）的子嗣。阿姆尔以独来独往而闻名，他对哈基姆的子嗣的一些最奇妙的创造以及他们对血魔法的娴熟运用负有责任。\n他慢条斯理的举止暴露了一个真正的古人的心智，即提前为未来几个世纪做打算。不过，最近，阿什拉夫在鹰巢异常活跃，温和地推动卷轴议会的议程，这个派别是他和哈基姆圣裔的其他温和派的发言人一起创建的。"
 pod_assamite_struggle.1008.a: "全心全意地辅助他的工作。"
 pod_assamite_struggle.1008.b: "处处妨碍他的工作。"
 pod_assamite_struggle.1008.c: "他在计划什么？"
 targetted_web_modifier: "被刀锋之网悬赏"
 targetted_web_modifier_desc: "刀锋之网对你产生了兴趣。一个极度危险的兴趣。"
 wok_gain_lot_influence_tt: "刀锋之网获得大量影响"
 pod_assamite_struggle.1009.t: "忒弥斯之网"
 pod_assamite_struggle.1009.desc: "作为哈基姆的子嗣中的一位褒贬不一的人物，强大的忒弥斯被称为是一个高超的影子操纵者和鹰巢最致命的刺客之一。他对刀锋之网的效忠在鹰巢的大厅里被悄悄传开，但忒弥斯的真正最终目标仍然只有他自己知道。\n在他的命令下，刀锋之网最近在波斯周围展开了一场小心翼翼的恐吓活动，确保亲王和苏丹们对密教诉求更加……更加”殷勤“。你在这次活动中的位置肯定会被无情的埃及人仔细监视。"
 pod_assamite_struggle.1009.a: "全心全意地辅助他的工作。"
 pod_assamite_struggle.1009.b: "处处妨碍他的工作。"
 pod_assamite_struggle.1009.c: "他在计划什么？"
 silsila_gain_lot_influence_tt: "道统获得大量影响。"
 pod_assamite_struggle.1010.t: "纳穆尔图姆的命令"
 pod_assamite_struggle.1010.desc: "纳穆尔图姆是哈基姆本人最年长的子嗣之一，在1214年的一次草率的武力示威中控制了鹰巢。她对一个衰落宗教的信奉，以及她对其他派别的傲慢举止，使她几乎没有朋友，她对鹰巢本身毫无掌控。\n不过，她是最长者，这个头衔在哈基姆圣裔的社会中值得尊敬。因此，当她发布命令时，她希望得到服从。违背她的意愿很容易，因为她没有办法强制执行她的权力，但在某种程度上，这仍然是一种违反礼仪的行为。因此，当这些命令之一来到你身边时，你必须决定你的行动方案。"
 pod_assamite_struggle.1010.a: "服从最长者的意愿。"
 pod_assamite_struggle.1010.b: "忽略她的胡言乱语。"
 pod_assamite_struggle.1010.c: "做最低限度的事。"
 jamal_levies_modifier: "贾迈勒的专长"
 jamal_levies_modifier_desc: "贾迈勒已经对你的勇士们进行了个人演练。那些还能下床走路的人已经有了很大的进步。"
 ashirra_gain_lot_influence_tt: "阿什拉派获得大量影响"
 pod_assamite_struggle.1011.t: "贾迈勒的勇武"
 pod_assamite_struggle.1011.desc: "哈基姆圣裔最致命的战士被公认为是哈基姆的子嗣之一——贾迈勒。这位可怕的战士也是众所周知的坚定的[Glossary('阿什拉派','game_concept_ashirra_desc')]事业的信徒，几个世纪以来一直是他们的非正式领袖。\n不过，贾迈勒也被认为是一个温和的发言人，他经常被看到帮助其他哈基姆圣裔，即使是那些不赞同他的事业的人。多年来，这种友善的举止为他和阿什拉派赢得了很多尊重。\n今晚，你是这位伟大战士关注的对象。他注意到你的勇士们在战斗技巧上的一些缺陷，他提出要帮助他们进行一次小小的训练。"
 pod_assamite_struggle.1011.a: "我很荣幸，谢谢。"
 pod_assamite_struggle.1011.b: "没有这个必要。"
 pod_assamite_struggle.1011.c: "请对他们宽容一点。"
 losttribe_gain_lot_influence_tt: "失落部族获得大量影响。"
 pod_assamite_struggle.1012.t: "阿诺什的真言"
 pod_assamite_struggle.1012.desc: "达斯图尔·阿诺什的神秘（以及高度异端）的洗拉密教自从他的教主死于鹰巢的刺客之手后，就躲了起来。不过，他在波斯政治中的影响力并没有完全消失。今晚，你收到了一张纸条，说有一个包含了一些……关于三代的有趣信息的古老卷轴在你的地区流传。这种小但有潜在影响的计划是阿诺什的标志，你必须决定如何处理它。"
 pod_assamite_struggle.1012.a: "我需要自己读一读。"
 pod_assamite_struggle.1012.b: "找到并毁掉它！"
 pod_assamite_struggle.1012.c: "顺其自然吧。"
 catalyst_massive_influence_wok_desc: "刀锋之网的影响达到顶流。"
 catalyst_massive_influence_ashirra_desc: "阿什拉派的影响达到顶流。"
 catalyst_massive_influence_council_desc: "卷轴议会的影响达到顶流。"
 catalyst_massive_influence_silsila_desc: "道统的影响达到顶流。"
 catalyst_massive_influence_losttribe_desc: "失落部族的影响达到顶流。"
 catalyst_no_influence_wok_desc: "刀锋之网的影响已不存在。"
 catalyst_no_influence_ashirra_desc: "阿什拉派的影响已不存在。"
 catalyst_no_influence_council_desc: "卷轴议会的影响已不存在。"
 catalyst_no_influence_silsila_desc: "道统的影响已不存在。"
 catalyst_no_influence_losttribe_desc: "失落部族的影响已不存在。"
 secure_persia_outsider_tt: "你需要在分裂的家族斗争的法理地区拥有更多的伯爵领（波斯王国、河中、弥兰、迦布罗、答儿密、呼罗珊/刀锋之网）"
 secure_persia_kingdom_tt: "你需要完全控制裂的家族斗争的法理王国之一（波斯王国、河中、弥兰、迦布罗、答儿密、呼罗珊/刀锋之网）"
 struggle_parameter_unlocks_secure_assamite_foothold_decision: "为波斯或附近的未参与的角色解锁保障波斯立足点决议。"
 assamite_struggle_uninvolved_or_external_tt: "你的首都必须在鹰巢（波斯）之外"
 assamite_struggle_secure_assamite_foothold_empire_tt: "你需要控制着一个非鹰巢（波斯）帝国"
 NOT_NO_WARS_STRUGGLE_PARAMETER_CD: "你正处于一个不能攻击该角色的斗争阶段。"
 fp2_struggle_secure_assamite_foothold_empire_dejure_effect_tt: "若你的帝国与阿拉伯帝国在法理上接壤，你所拥有的波斯诸王国将并入你的帝国法理。"
 french_struggle: "破碎的法兰西"
 french_struggle_desc: "吸血鬼的法兰西曾经由最有影响力的梵卓之一——亚历山大统治。他得到了妥芮朵的爱之庭的支持，一群强大的女王在法兰西的主要城市进行统治并给他建议和支持。但是，老梵卓的冷酷和孤立终于在1222年成为他的败笔，他被最有权势的爱之女王萨莉安娜和他自己的子嗣若弗鲁瓦煽动的政变所推翻。\n萨莉安娜随后掌权，持续600多年的政局被突然改变，这样急速变化使吸血鬼陷入混乱。正在进行的阿尔比派十字军、奥克人和法兰西人之间的分歧以及英格兰和德意志对国度的侵蚀，使这场混乱更加恶化。吸血鬼的法兰西能否在未来的混乱时期生存下来？"
 struggle_french_phase_chaos: "风暴"
 struggle_french_phase_chaos_desc: "随着裁判所的猖獗，吸血鬼国度在法兰西的影子中开战，希望通过武器的力量获得他们无法通过蜜语获得的东西。"
 struggle_french_phase_reprieve: "宁静"
 struggle_french_phase_reprieve_desc: "即使是吸血鬼也需要时不时地恢复。权力的巩固现在正在发生，国王和女王要确保他们的影响力和势力为下一阶段做好准备。"
 pod_french_struggle.0501.t: "破碎的法兰西"
 pod_french_struggle.0501.desc: "吸血鬼的法兰西曾经由最有影响力的梵卓之一——亚历山大统治。他得到了妥芮朵的爱之庭的支持，一群强大的女王在法兰西的主要城市进行统治并给他建议和支持。但是，老梵卓的冷酷和孤立终于在1222年成为他的败笔，他被最有权势的爱之女王萨莉安娜和他自己的子嗣若弗鲁瓦煽动的政变所推翻。\n萨莉安娜随后掌权，持续600多年的政局被突然改变，这样急速变化使吸血鬼陷入混乱。正在进行的阿尔比派十字军、奥克人和法兰西人之间的分歧以及英格兰和德意志对国度的侵蚀，使这场混乱更加恶化。吸血鬼的法兰西能否在未来的混乱时期生存下来？"
 pod_french_struggle.0501.a: "混乱带来机遇。"
 blois_french_struggle_tt: "[TARGET_TITLE.GetNameNoTier]必须掌控在你或支持你的人（好感度大于75）的手中"
 french_struggle_german_less_control_tt: "[GetTitleByKey('e_fiefs_of_the_black_cross').GetNameNoTier]必须只掌控20%以下的法兰西。"
 french_struggle_english_less_control_tt: "[GetTitleByKey('e_avalon').GetNameNoTier]必须只掌控20%以下的法兰西。"
 french_struggle_english_more_control_tt: "[GetTitleByKey('e_avalon').GetNameNoTier]必须掌控30%以上的法兰西。"
 french_struggle_german_more_control_tt: "[GetTitleByKey('e_fiefs_of_the_black_cross').GetNameNoTier]必须掌控30%以上的法兰西。"
 french_victory_objective_decision: "重建法兰西"
 french_victory_objective_decision_tooltip: "如果法兰西要在入侵者的侵袭下生存下来，它必须再次团结起来。"
 french_victory_objective_decision_desc: "法兰西的衰弱让德意志人和英格兰人贪婪地看着那些属于我们的土地。现在是时候搁置我们的分歧，再次作为最强大的势力之一在黑夜发声。"
 french_victory_objective_decision_confirm: "永恒的法兰西"
 french_victory_objective_decision_effect_tooltip: "斗争将结束。[GetTitleByKey('b_rethel').GetNameNoTier]、[GetTitleByKey('b_lyon').GetNameNoTier]、[GetTitleByKey('b_bordeaux').GetNameNoTier]、[GetTitleByKey('b_blois').GetNameNoTier]和[GetTitleByKey('b_poitiers').GetNameNoTier]将获得新特殊建筑。你将篡夺[GetTitleByKey('e_love').GetNameNoTier]帝国，如果你还没有拥有它的话。"
 pod_french_struggle.102.t: "重建的法兰西"
 pod_french_struggle.102.desc: "被亚历山大的被迫流放所打破，曾经一统的法兰西被侵占的德意志和英格兰的该隐之子所争夺，但也被其在政变中分裂和争吵的亲王们所争夺。这场动乱也让裁判所发酵和发展，威胁着要拆毁吸血鬼政治结构的仅存。\n然而，现在没了，因为法兰西该的隐之子已经找到了新的目标和团结。皇庭再次摆脱了他们的入侵者，并有足够的组织来抵御裁判所，在西欧的吸血鬼政治舞台上以一种重要的方式重新出现。"
 pod_french_struggle.102.a: "法兰西的故事才刚刚开始。"
 e_love_brujah: "哲学皇庭"
 e_love_lasombra: "暗影皇庭"
 e_love_gangrel: "高卢皇庭"
 english_victory_objective_decision: "英格兰纽带"
 english_victory_objective_decision_tooltip: "法兰西已经被削弱，足以为新的主人开辟道路。"
 english_victory_objective_decision_desc: "英格兰的凡人有着很对的想法。英法必须统一，当然是在适当的英格兰统治下。"
 english_victory_objective_decision_confirm: "永恒的结合诞生了！"
 english_victory_objective_decision_effect_tooltip: "斗争将结束。[GetTitleByKey('b_rethel').GetNameNoTier]、[GetTitleByKey('b_lyon').GetNameNoTier]、[GetTitleByKey('b_bordeaux').GetNameNoTier]、[GetTitleByKey('b_blois').GetNameNoTier]和[GetTitleByKey('b_poitiers').GetNameNoTier]将获得新特殊建筑。你将篡夺[GetTitleByKey('e_love').GetNameNoTier]帝国，如果你还没有拥有它的话。法兰西的众多角色会皈依你的宗教。"
 pod_french_struggle.105.t: "英格兰纽带"
 pod_french_struggle.105.desc: "自1066年以来，法兰西和英格兰的命运一直交织在一起。对于吸血鬼来说，那是一个由三个诺曼该隐之子组成的小团体篡夺了英格兰密特拉教的统治的时期。但他们的胜利是短暂的，因为密特拉一从沉睡中醒来，就迅速恢复了对其领地的控制。\n从那时起，英格兰就把他的影响力扩展到了法兰西，利用亚历山大流亡所造成的混乱，首先获得了一些领土，更重要的是，对当地人产生了一些影响。缓慢但肯定的是，来自群岛的该隐之子在该地区获得了越来越多的权力，并且以他们的凡人为榜样，现在声称对一个真正的安茹帝国拥有统治权。"
 pod_french_struggle.105.a: "从约克到马赛。"
 pod_french_struggle.105.custom: "非狂热的参与领主将皈依你的信仰。"
 e_love_mithras: "阿瓦隆皇庭"
 e_love_english: "安茹帝国"
 german_victory_objective_decision: "日耳曼纽带"
 german_victory_objective_decision_desc: "德法有着悠久的历史，从凡人可以追溯到查理曼大帝，而从吸血鬼可以追溯到埃里克·艾格曼。我们必须利用这段历史来团结这地区。"
 german_victory_objective_decision_confirm: "加洛林的胜利！"
 pod_french_struggle.106.t: "日耳曼纽带"
 pod_french_struggle.106.desc: "在凡人世界，德意志和法兰西在查理大帝的统治下曾经是一体的。许多该隐之子都试图重现这一辉煌，从萨克森的埃里克·艾格曼到查理大帝本人的不死族守护者亚历山大。尽管这两个国家有着密切的联系，但没有人完全成功。\n然而，亚历山大的被迫流亡为德意志该隐之子打开了新的机遇，当时他们在哈德施塔特或茱莉亚·安塔西娅等有名望的梵卓手下已经是一支强大而团结的力量。从那时起，德意志在法兰西吸血鬼政治中的影响力只增不减，以至于许多人预测，这两个国家的未来已经注定。法兰克和撒克逊的继承人将再次为一个共同的目标而合作。"
 pod_french_struggle.106.a: "从马格德堡到布雷斯特。"
 e_love_eternal: "高卢"
 e_love_fiefs: "玫瑰封邑"
 pod_french_struggle.1000.t: "与裁判所的斗争"
 pod_french_struggle.1000.desc: "令人畏惧的裁判所基本上是在阿尔比派十字军的影子下诞生于法兰西。他们的代理人在夜晚的街道上游荡，利用他们的神圣才能使吸血鬼的生活更加艰难。可悲的是，最近他们多次出现在你控制的一个地区，让你没有什么选择，只能经历风暴，或者以某种方式对付他们。"
 pod_french_struggle.1000.a: "让我们拭目以待。"
 pod_french_struggle.1000.b: "雇佣一些派员来误导他们。"
 pod_french_struggle.1000.c: "引导他们到你的对手那边去！"
 pod_french_struggle.1000.d: "我已经厌倦了，杀光他们！"
 pod_french_struggle.1001.t: "从君士坦丁堡到里昂"
 pod_french_struggle.1001.desc: "随着裁判所的到来，曾经有权有势的里昂亲王弗朗索瓦·德阿伦库的财富也随之减少。然而，他在法兰西仍然是一个非常受人尊敬的权力人物，他的荣誉行为是无与伦比的。\n今晚，他带着一个提议来到你的宫廷。一支来自摇摇欲坠的拜占庭帝国的难民大队已经来到了它的领地，寻找一个新的栖身之地。虽然德阿伦库帮助了他能帮助的人，但由于裁判所在该地区的猖獗，里昂已经变得太危险了。因此，他向你提出正式请求，希望在你的领地内为这些难民找到一个住处，同时尽可能地保护他们并接待他们。毕竟，荣誉决定了帮助有需要的人是最重要的。"
 pod_french_struggle.1001.a: "一个正当的功业。还有一个有趣的人情。"
 pod_french_struggle.1001.b: "我不会被这些政治把戏所迷惑！"
 pod_french_struggle.1002.t: "致命游戏"
 pod_french_struggle.1002.desc: "伊思妲·德·布莱斯是最具影响力的爱之女王之一，当然也是最令人畏惧的一个。在她优雅和美丽的外表下，有一颗完全不正常的心，在她的宫廷里设计出最扭曲的社交游戏。\n你最近收到了参加这样一个聚会的邀请。如果你拒绝，伊思妲肯定会采取个人行动，但你是否愿意忍受“狼玫瑰”能给你带来的最坏结果？"
 pod_french_struggle.1002.a: "最坏又能怎么样呢？"
 pod_french_struggle.1002.b: "我在这夜有一个重要的聚会！"
 pod_french_struggle.1002.c: "新的酷刑方法？太好了！"
 pod_french_struggle.1003.t: "昂贵的分心"
 pod_french_struggle.1003.desc: "海伦娜是最年轻的爱之女王，统治着非常富裕的香槟。从外表上看，她是一个有点空虚和兴奋的少女，但海伦娜经常证明她的好客主要是装出来的。\n香槟不久将举办法兰西大集市，也许是西欧最重要的商业活动。许多吸血鬼现在都想分一杯羹，而且，可能不是巧合，海伦娜已经邀请他们中的许多人（包括你）在同一时期参加一个奢华的聚会，很可能是为了确保你不干扰她的活动计划。"
 pod_french_struggle.1003.a: "尊重比金钱更有价值。"
 pod_french_struggle.1003.b: "转念一想……"
 pod_french_struggle.1003.c: "派对？我有很多想法可以尝试！"
 pod_french_struggle.1004.t: "爱之王"
 pod_french_struggle.1004.desc: "诸庭中唯一公认的爱之王是普瓦图地区的亲王艾蒂安。他是一个神秘的人，一直被低估为一个软弱的统治者，直到最近，他对埃丝克拉蒙德的大胆举动以及他与密特拉和英格兰的和睦关系，突然显示出比最初预期的更致命的政治头脑。\n你已经收到了一个请求，要求与他会面，目的不详。如果你接受的话，这可能是一个相当大的政治行动，因为艾蒂安肯定有一些计划来对付另一个竞争者。"
 pod_french_struggle.1004.a: "谁是目标？"
 pod_french_struggle.1004.b: "他太危险了，不可信任。"
 pod_french_struggle.1004.c: "我可以改进他的计划……"
 pod_french_struggle.1005.t: "准备不足的国王"
 pod_french_struggle.1005.desc: "若弗鲁瓦·杜·坦普尔是（他[Glossary('尊长','game_concept_Sire_desc')]）亚历山大流放背后的主要策划者之一。可悲的是，从那时起，他越来越被比他更擅长政治游戏的人所排挤，比如萨莉安娜本人。\n感觉到自己的弱点，若弗鲁瓦正在寻找任何愿意帮助他的盟友。与他结盟的代价很高，但他仍然是巴黎亲王，这是一个令人尊敬的职位，在统一法兰西的过程中总有一天会起到作用。"
 pod_french_struggle.1005.a: "给他一些帮助。"
 pod_french_struggle.1005.b: "借给他一些象征性的、无用的帮助。"
 pod_french_struggle.1005.c: "借给他一些尽力和周到的帮助。"
 pod_french_struggle.1006.t: "阿基坦的财富"
 pod_french_struggle.1006.desc: "波尔多是法兰西最繁华的城市之一。具有讽刺意味的是，这主要是由于它是英格兰凡人（往往也是吸血鬼）长期以来所持有的最重要的法兰西城市。这使得它成为任何有价值的英格兰商人的贸易中心。\n波尔多的亲王是赫拉德，他是密特拉的忠实臣子，也是一个有能力的管理者。然而，他被城市中的利益竞争和裁判所在该地区越来越多的活动彻底压垮了，同时几乎没有得到英格兰的帮助。这样的混乱可以成为“解放”波尔多的一些财富供自己使用的机会……"
 pod_french_struggle.1006.a: "我将尊重赫拉德的亲王领"
 pod_french_struggle.1006.b: "在免费金钱中游泳。"
 pod_french_struggle.1006.c: "更多钱！"
 pod_french_struggle.1007.t: "奥克西塔尼亚的女王"
 pod_french_struggle.1007.desc: "自阿尔比派十字军开始以来，强大的埃丝克拉蒙德已经成为奥克人的集结点。她对裁判所和北方法兰西人的顽强抵抗，使她的宫廷事实上独立于巴黎人的控制之外。\n“黑女王”是一位神秘的人物，据说许多人只看了一眼就对她表示了不朽的忠诚。这就是为什么你对这个突然出现在你门前的来自图卢兹的意外邀请感到担心……"
 pod_french_struggle.1007.a: "当然，我可以抵抗她的咒语！"
 pod_french_struggle.1007.b: "最好不要冒险。"
 pod_french_struggle.1007.c: "我也知道一两件关于魅惑的事……"
 pod_french_struggle.1008.t: "太阳神带来的礼物"
 pod_french_struggle.1008.desc: "密特拉，阿瓦隆诸郡的强大统治者，在亚历山大的统治时期对法兰西没有表现出什么兴趣。但现在，这个国家因他的流放而变得不稳定，而且法兰西的凡人也在向它进军，看来太阳神有新的计划。\n密特拉在法兰西开始了一次奢华的大旅行，他在许多城市停留，用他纯粹的力量和影响力给这些城市的该隐之子居民留下深刻印象。如果你愿意的话，你可以在密特拉巡游期间到你的城市走走。这肯定会给你带来好处，而且他是个慷慨的客人。但要考虑到落入他魔咒的风险……"
 pod_french_struggle.1008.a: "您的到来让我感到很荣幸！"
 pod_french_struggle.1008.b: "最好不要冒险。"
 pod_french_struggle.1008.c: "米特拉已经是我的神了！他当然会帮助我吧？"
 pod_french_struggle.1009.t: "暴君的提议"
 pod_french_struggle.1009.desc: "德意志强大的哈德施塔特是该隐之子世界中的一个异数。他出身于一个神秘的家族，尽管年纪轻轻，却能成为欧洲最重要的梵卓。他以狡猾和无情的政治家著称，却不善言辞。\n他突然造访你的宫廷让你感到震惊，但他的提议更让人吃惊。哈德施塔特直言不讳地告诉你，他对法兰西有计划，而你可以成为这一努力中的一个资产。如果你同意加入黑十字，他将为你提供金钱、一支私人军队以及在他的宫廷中对你价值的认可。"
 pod_french_struggle.1009.a: "一个诱人的提议……"
 pod_french_struggle.1009.b: "我不相信他。"
 pod_french_struggle.1010.t: "古典对话"
 pod_french_struggle.1010.desc: "西欧最有影响力的梵卓之一，茱莉亚·安塔西娅，来到了法兰西的一些宫廷。她在该地区有许多忠实的追随者，都称赞她的冷静和对该隐之子的民主社会的乌托邦式看法。\n她已经在你的宫廷上停留数夜了，你必须承认她的名声并没有被夸大。她冷静、沉着，她说的每一句话都是对你们族类潜在的伟大未来的生动描述。你可以感觉到自己越来越被同行之间这种看似良性的对话所动摇。"
 pod_french_struggle.1010.a: "一场有趣的对话，仅此而已。"
 pod_french_struggle.1010.b: "她有一些不错的观点……"
 pod_french_struggle.1010.c: "我的女士，不要再说了，让我来为你效忠吧！"
 pod_french_struggle.1011.t: "有毒赠礼"
 pod_french_struggle.1011.desc: "作为爱之庭的母主，萨莉安娜至少在名义上是亚历山大流亡后法兰西最重要的该隐之子。然而，她的统治是有争议的，从那时起，她正试图尽可能地确保它。\n作为法兰西有影响力的黑夜统治者之一，你要受制于她争取承认的一些伎俩。在最近的庭会中，她试图为你提供一个选择凡人的机会，让你按照你认为合适的方式使用。在政治上，接受这份礼物意味着给她作为领主对封臣的赏赐的体现，以你为代价加强她的地位。另一方面，这凡人似乎确实是个有趣的人……"
 pod_french_struggle.1011.a: "我为此感到荣耀，母主。"
 pod_french_struggle.1011.b: "你可以留着你的礼物。"
 pod_french_struggle.1012.t: "南方来客"
 pod_french_struggle.1012.desc: "伊比利亚的勒森魃是许多试图在亚历山大流亡后在法兰西攫取他们所能获得的影响力的外来者之一。他们自己在半岛的麻烦与正在进行的内战很快就结束了他们的努力。尽管如此，一些年轻的勒森魃还是在法兰西的局势中看到了机遇，也许可以在归乡之前发一笔横财。\n最近有一个这样的雇佣兵团体来向你提供服务。你显然可以拒绝他们的提议，但毫无疑问，他们会找到另一个雇主，甚至可能是你的竞争对手之一。"
 pod_french_struggle.1012.a: "你被雇佣了。"
 pod_french_struggle.1012.b: "你走吧。"
 struggle_parameter_struggle_parameter_less_factions_by_involved: "在这个斗争阶段，参与的角色不太容易加入派别。"
 struggle_parameter_struggle_parameter_no_revoke_by_involved: "在这个斗争阶段，参与的角色不能剥夺头衔。"
 french_struggle_house_modifier: "法兰西之主"
 french_struggle_house_modifier_desc: "该家族的成员已经获得了吸血鬼的法兰西，确保他们对西欧这一重要地区的巨大影响力。"
 french_struggle_taunt_tooltip: "不，你不能。"
 involved_knives_out_tt: "参与斗争的正义之道统治者将对你失去50好感。"
 involved_knives_out_lots_tt: "参与斗争的正义之道统治者将对你失去100好感。"