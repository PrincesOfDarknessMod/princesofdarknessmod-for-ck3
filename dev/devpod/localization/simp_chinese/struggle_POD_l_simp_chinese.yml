 pod_assamite_struggle.107.a:0 "刀锋之网的影响"
 pod_assamite_struggle.107.b:0 "阿什拉派的影响"
 pod_assamite_struggle.107.c:0 "卷轴议会的影响"
 pod_assamite_struggle.107.d:0 "道统的影响"
 pod_assamite_struggle.107.e:0 "失落部族的影响"
 pod_assamite_struggle.107.f:0 "目前没需要"
 pod_assamite_struggle.108.t:0 "刀锋之网"
 pod_assamite_struggle.108.desc:0 "刀锋之网是哈基姆圣裔的一个非官方派别，是一个秘密的刺客教派，致力于崇拜一位名叫乌尔·舒尔吉的神秘玛土撒拉。他们是狂热分子，愿意摧毁任何拒绝为其主人服务的吸血鬼。他们也被称为嗜血的杀手，对整个[Clan|E]在外人眼中的恶名负有责任。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 pod_assamite_struggle.108.a:0 "帮助这派别"
 pod_assamite_struggle.108.b:0 "掌控这派别"
 pod_assamite_struggle.108.c:0 "目前啥也不做"
 faction_gain_influence_tt:0 "该派别的影响将提升"
 faction_lose_influence_tt:0 "该派别的影响将降低"
 pod_assamite_struggle.109.t:0 "阿什拉派"
 pod_assamite_struggle.109.desc:0 "哈基姆圣裔的这一强大派别主张与[ashirra|E]运动进行更紧密的合作。它主要由年轻的吸血鬼组成，他们生前是伊斯兰教的追随者，但也有几个强大的长者皈依了这一事业。随着伊斯兰教在该地区越来越占主导地位，阿什拉派派别已成大势。他们倾向于与卷轴议会结盟，希望能成为所有其他人都能接受的妥协选择。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 pod_assamite_struggle.110.t:0 "卷轴议会"
 pod_assamite_struggle.110.desc:0 "卷轴议会最初是为了追求和保护鹰巢的知识而成立的，现在已经演变成术士和维齐尔的一个政治派别，他们赞成对当前的危机采取妥协的解决方案。尽管有这样的立场，他们还是激烈地反对刀锋之网，主要源自他们的创始人阿什拉夫的影响。议会目前正在与[ashirra|E]派别合作，认为他们是未来保持哈基姆圣裔稳定的一个好选择。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 pod_assamite_struggle.111.t:0 "道统"
 pod_assamite_struggle.111.desc:0 "在祆教统治时期，鹰巢的精英战士祭司是鹰巢的真正领袖。因此，他们与这种宗教密切相关，并与他们的信仰一起衰落。1214年，纳穆尔图姆作为最长者的回归有助于保护他们仅存的一点影响力，但这可能太晚了，尤其是在绝大多数新的哈基姆圣裔都来自穆斯林凡人的情况下。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 pod_assamite_struggle.112.t:0 "失落部族"
 pod_assamite_struggle.112.desc:0 "失落部族是一个（大部分）由哈基姆圣裔组成的异端密教，他们崇拜死去的洗拉，并试图通过摧毁杀害她的凶手——三代，以及那些追随他们的人为她复仇。这使他们与崇尚哈基姆的其他[clan|E]直接冲突，因此，他们一次又一次地被清除出鹰巢的政治。然而，他们的影响是阴险的，他们往往在人们最不期待的时候再次出现。\n只要付出巨大的努力和资源，你就可以在整个哈基姆圣裔的政治舞台上展开一场帮助或诋毁这一派别的运动。"
 clashing_heretics_modifier:0 "异端冲突"
 clashing_heretics_modifier_desc:0 "该伯爵领是两个相互冲突的派别之间的暗影战争的中心。"
 pod_assamite_struggle.1000.t:0 "异端冲突"
 pod_assamite_struggle.1000.desc:0 "虽然都是哈基姆圣裔内部的异端密教，但失落部族和刀锋之网对彼此都没有好感。他们把自己的同行视为对[clan|E]最紧迫的威胁，他们的暗影战争可能是所有派别中最致命的。\n你的一个伯爵领最近出现了这种激进的活动，这两个密教都在扰乱凡人的生活，处理起来越来越复杂。你不太可能和他们讲道理，但站在一个派别一边可能会确保，至少，这种干扰不会持续太长时间。"
 pod_assamite_struggle.1000.a:0 "帮助刀锋之网"
 pod_assamite_struggle.1000.b:0 "帮助失落部族"
 pod_assamite_struggle.1000.c:0 "操纵每个派别来解决这个问题。"
 pod_assamite_struggle.1000.a.success:0 "处理了。"
 pod_assamite_struggle.1000.a.failure:0 "更糟了……"
 pod_assamite_struggle.1000.d:0 "我才是统治者，不是他们！"
 wok_gain_influence_tt:0 "刀锋之网获得影响"
 wok_lose_influence_tt:0 "刀锋之网失去影响。"
 losttribe_gain_influence_tt:0 "失落部族获得影响。"
 losttribe_lose_influence_tt:0 "失落部族失去影响"
 pod_assamite_struggle.1001.t:0 "信徒的职责"
 pod_assamite_struggle.1001.desc:0 "[ashirra|E]社区在波斯非常强大。这个运动的信条之一是让凡人随心所欲地生活，尽可能少地受到吸血鬼的干扰。显然，这对一个黑夜的统治者来说并不总是很实际。\n一个这样的阿什拉派代表最近来到你的领地，抱怨你的代理人对该地区的凡人事务采取了过于严厉的做法。"
 pod_assamite_struggle.1001.a:0 "谈判达成妥协。"
 pod_assamite_struggle.1001.a.success:0 "不错的交易。"
 pod_assamite_struggle.1001.a.failure:0 "喊叫和争吵。"
 pod_assamite_struggle.1001.b:0 "好吧，我们不会介入到其中。"
 ashirra_gain_influence_tt:0 "阿什拉派获得影响"
 ashirra_lose_influence_tt:0 "阿什拉派失去影响。"
 pod_assamite_struggle.1001.c:0 "我们自有国情在此！"
 pod_assamite_struggle.1002.t:0 "关于哈基姆的真相"
 pod_assamite_struggle.1002.desc:0 "哈基姆在他的子嗣中是一位受人尊敬的人物，但对他们中的大多数人来说仍然是一个谜。在他活跃的时候，他是一个少言寡语的人，他的失踪只是加深了围绕他的传言。随着族人目前的分裂，哈基姆的真实本性这一话题自然而然地出现在人们面前。\n作为一个有影响力的黑夜统治者，你的意见比大多数人都重要。"
 pod_assamite_struggle.1002.a:0 "哈基姆虽然伟大，但只是最伟大者的仆人。"
 silsila_gain_influence_tt:0 "道统获得影响。"
 pod_assamite_struggle.1002.b:0 "哈基姆是对人类存在的最终审判。"
 council_gain_influence_tt:0 "卷轴议会获得影响"
 pod_assamite_struggle.1002.c:0 "一个伟大的人，尽管不那么完美。"
 pod_assamite_struggle.1002.d:0 "我不认为哈基姆有那么重要……"
 pod_assamite_struggle.1003.t:0 "失落的卷轴"
 pod_assamite_struggle.1003.desc:0 "你的派员最近抓住了一个被鹰巢研究了一段时间的小偷。经过仔细检查，这个人似乎并不是一个真正的小偷，而是一个学者，显然，他有一本源自琐罗亚斯德时代的重要文书。\n道统的领导层是历史的守护者，而且大多是祆教教徒，他们要求你把这文书交给他们，且会对你的帮助进行补偿。但你还有其他选择……"
 pod_assamite_struggle.1003.a:0 "这是我的荣幸。"
 silsila_lose_influence_tt:0 "道统失去影响。"
 pod_assamite_struggle.1003.b:0 "烧了卷轴。和“窃贼”。"
 pod_assamite_struggle.1003.c:0 "我有其他可能会感兴趣的朋友……"
 pod_assamite_struggle.1003.d:0 "我会留着它。"
 pod_assamite_struggle.1004.t:0 "拔刀"
 pod_assamite_struggle.1004.desc:0 "你领地的一个外围村庄最近被刀锋之网的狂热者“拜访”了，如果幸存者说的是真的，他们在寻找一个非信者间谍。像往常一样，刀锋之网的做事方式很残忍，对你的凡人臣民来说尤其具有创伤性。\n清理这个烂摊子应该不难，但你可能想对这种对你权威的暗中攻击作出反应。"
 pod_assamite_struggle.1004.a:0 "有间谍？把村子夷为平地！"
 pod_assamite_struggle.1004.b:0 "公开谴责刀锋之网。"
 wok_lose_lot_influence_tt:0 "刀锋之网失去大量影响。"
 pod_assamite_struggle.1004.c:0 "追踪并处理侵略者。"
 pod_assamite_struggle.1004.d:0 "没有必要为了这么点小事而激怒刀锋之网。"
 pod_assamite_struggle.1005.t:0 "间谍之地"
 pod_assamite_struggle.1005.desc:0 "波斯是个大地方，这使得一个可靠的信使来回系统对鹰巢而言非常重要。虽然血仆信使很不错，但你很肯定他们的大部分旅行都被当前斗争中比较审慎的派别所监控。你怀疑实际上很有可能你的报告和其他信件都被你的敌人例行截获。\n卷轴议会最近提出了一个新的系统，由著名的阿什拉夫创造，一个由巨灵的力量赋能的魔法球，允许更远的通信。然而，可以听到一些反对的声音，因为他们认为这只是意味着改变谁在监视谁……"
 pod_assamite_struggle.1005.a:0 "出色的倡议，我要一个。"
 pod_assamite_struggle.1005.b:0 "我将想出我自己的体系。"
 council_lose_influence_tt:0 "卷轴议会失去影响。"
 pod_assamite_struggle.1005.c:0 "议会在操纵我们！"
 pod_assamite_struggle.1006.t:0 "哈基姆的女儿们"
 pod_assamite_struggle.1006.desc:0 "在哈基姆圣裔文化中，初拥女性从来都不是一个特别大的问题，尤其是哈基姆本人也这样做，但[ashirra|E]运动的兴起改变了这一状态。在战士种姓中，初拥女性的做法在8世纪就不受欢迎了，因为人们开始认为给予女性亡生诅咒是不道德的。\n这种分裂至今仍然存在，尽管几十年来战士们已经开始放松这一政策。因此，虽然这个问题不像以前那样紧迫，但它仍然是哈基姆的儿子和女儿之间争论的问题。"
 pod_assamite_struggle.1006.a:0 "我仍然觉得不对劲。"
 pod_assamite_struggle.1006.b:0 "哈基姆知道他在做什么。"
 pod_assamite_struggle.1006.c:0 "老实说，这该采取另一条道。"
 pod_assamite_struggle.1007.t:0 "三大种姓"
 pod_assamite_struggle.1007.desc:0 "没有人真正知道种姓制度是什么时候在哈基姆圣裔社会中真正形成的，但它现在已经成为波斯亡生中不可或缺的一部分。传统上，维齐尔是三者中的领导者和最活跃的政治人物，但近来权力慢慢转移到了战士手中。术士的话，则长期以来一直是一个隐蔽的群体，他们人数少，是种姓中最弱的。\n种姓制度与哈基姆圣裔社会中的政治派别一起运作，虽然你可以在任何派别中找到任何种姓，但根据你的政治议程，有些种姓比其他种姓更受青睐。"
 pod_assamite_struggle.1007.a:0 "战士带领我们前进。"
 pod_assamite_struggle.1007.b:0 "术士知道真理。"
 pod_assamite_struggle.1007.c:0 "维齐尔是我们的天生领袖。"
 pod_assamite_struggle.1007.d:0 "我们必须团结一致。"
 losttribe_victory_objective_decision:0 "洗拉的子嗣"
 silsila_victory_objective_decision:0 "中央支柱"
 council_gain_lot_influence_tt:0 "卷轴议会获得大量影响"
 pod_assamite_struggle.1008.t:0 "阿什拉夫的奥秘"
 pod_assamite_struggle.1008.desc:0 "术士种姓的首领，阿姆尔，一直都是神秘的阿什拉夫，他是更神秘的乌尔·舒尔吉的一个古老而广受尊敬（和恐惧）的子嗣。阿姆尔以独来独往而闻名，他对哈基姆的子嗣的一些最奇妙的创造以及他们对血魔法的娴熟运用负有责任。\n他慢条斯理的举止暴露了一个真正的古人的心智，即提前为未来几个世纪做打算。不过，最近，阿什拉夫在鹰巢异常活跃，温和地推动卷轴议会的议程，这个派别是他和哈基姆圣裔的其他温和派的发言人一起创建的。"
 pod_assamite_struggle.1008.a:0 "全心全意地辅助他的工作。"
 pod_assamite_struggle.1008.b:0 "处处妨碍他的工作。"
 pod_assamite_struggle.1008.c:0 "他在计划什么？"
 targetted_web_modifier:0 "被刀锋之网悬赏"
 targetted_web_modifier_desc:0 "刀锋之网对你产生了兴趣。一个极度危险的兴趣。"
 wok_gain_lot_influence_tt:0 "刀锋之网获得大量影响"
 pod_assamite_struggle.1009.t:0 "忒弥斯之网"
 pod_assamite_struggle.1009.desc:0 "作为哈基姆的子嗣中的一位褒贬不一的人物，强大的忒弥斯被称为是一个高超的影子操纵者和鹰巢最致命的刺客之一。他对刀锋之网的效忠在鹰巢的大厅里被悄悄传开，但忒弥斯的真正最终目标仍然只有他自己知道。\n在他的命令下，刀锋之网最近在波斯周围展开了一场小心翼翼的恐吓活动，确保亲王和苏丹们对密教诉求更加……更加”殷勤“。你在这次活动中的位置肯定会被无情的埃及人仔细监视。"
 pod_assamite_struggle.1009.a:0 "全心全意地辅助他的工作。"
 pod_assamite_struggle.1009.b:0 "处处妨碍他的工作。"
 pod_assamite_struggle.1009.c:0 "他在计划什么？"
 silsila_gain_lot_influence_tt:0 "道统获得大量影响。"
 pod_assamite_struggle.1010.t:0 "纳穆尔图姆的命令"
 pod_assamite_struggle.1010.desc:0 "纳穆尔图姆是哈基姆本人最年长的子嗣之一，在1214年的一次草率的武力示威中控制了鹰巢。她对一个衰落宗教的信奉，以及她对其他派别的傲慢举止，使她几乎没有朋友，她对鹰巢本身毫无掌控。\n不过，她是最长者，这个头衔在哈基姆圣裔的社会中值得尊敬。因此，当她发布命令时，她希望得到服从。违背她的意愿很容易，因为她没有办法强制执行她的权力，但在某种程度上，这仍然是一种违反礼仪的行为。因此，当这些命令之一来到你身边时，你必须决定你的行动方案。"
 pod_assamite_struggle.1010.a:0 "服从最长者的意愿。"
 pod_assamite_struggle.1010.b:0 "忽略她的胡言乱语。"
 pod_assamite_struggle.1010.c:0 "做最低限度的事。"
 jamal_levies_modifier:0 "贾迈勒的专长"
 jamal_levies_modifier_desc:0 "贾迈勒已经对你的勇士们进行了个人演练。那些还能下床走路的人已经有了很大的进步。"
 ashirra_gain_lot_influence_tt:0 "阿什拉派获得大量影响"
 pod_assamite_struggle.1011.t:0 "贾迈勒的勇武"
 pod_assamite_struggle.1011.desc:0 "哈基姆圣裔最致命的战士被公认为是哈基姆的子嗣之一——贾迈勒。这位可怕的战士也是众所周知的坚定的[ashirra|E]事业的信徒，几个世纪以来一直是他们的非正式领袖。\n不过，贾迈勒也被认为是一个温和的发言人，他经常被看到帮助其他哈基姆圣裔，即使是那些不赞同他的事业的人。多年来，这种友善的举止为他和阿什拉派赢得了很多尊重。\n今晚，你是这位伟大战士关注的对象。他注意到你的勇士们在战斗技巧上的一些缺陷，他提出要帮助他们进行一次小小的训练。"
 pod_assamite_struggle.1011.a:0 "我很荣幸，谢谢。"
 pod_assamite_struggle.1011.b:0 "没有这个必要。"
 pod_assamite_struggle.1011.c:0 "请对他们宽容一点。"
 losttribe_gain_lot_influence_tt:0 "失落部族获得大量影响。"
 pod_assamite_struggle.1012.t:0 "阿诺什的真言"
 pod_assamite_struggle.1012.desc:0 "达斯图尔·阿诺什的神秘（以及高度异端）的洗拉密教自从他的教主死于鹰巢的刺客之手后，就躲了起来。不过，他在波斯政治中的影响力并没有完全消失。今晚，你收到了一张纸条，说有一个包含了一些……关于三代的有趣信息的古老卷轴在你的地区流传。这种小但有潜在影响的计划是阿诺什的标志，你必须决定如何处理它。"
 pod_assamite_struggle.1012.a:0 "我需要自己读一读。"
 pod_assamite_struggle.1012.b:0 "找到并毁掉它！"
 pod_assamite_struggle.1012.c:0 "顺其自然吧。"
