 POD_infernalist_study_demonology_1_decision_tooltip:0 "获得恶魔学特质。"
 POD_infernalist_study_demonology_1_decision_desc:0 "如果说邪恶的诱惑是诱人的，那么它所能给予的力量就更加诱人。你可以研究禁忌的学识……"
