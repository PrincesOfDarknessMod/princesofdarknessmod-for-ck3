 avenge_arikels_shame_custom_decision_malks:0 "[TARGET_CHARACTER.GetFirstName]，亚力科在苏美尔之后庇护她的朋友，必须在你的宫廷里，或者你必须有一个具有极佳资质等级的末卡维参议。"
 toreador_unity_objective_decision:0 "新的时代"
 toreador_unity_objective_decision_tooltip:0 "是时候让妥芮朵不在挂念君士坦丁堡了。"
 toreador_unity_objective_decision_desc:0 "数个世纪以来，妥芮朵[Clan|E]在很大程度上受到君士坦丁堡强大的米迦勒的影响。随着他的消亡，现在该重新开始了。法兰西将成为妥芮朵的新家，如果它能最终统一的话……"
 toreador_unity_objective_decision_effect_tooltip:0 "你将在你的领导下统一妥芮朵氏族，获得与法兰西地区文化相关的氏族称号和奖励。"
 toreador_unity_objective_decision_confirm:0 "完美的国家，完美的氏族"
 toreador_unity_objective_decision_alexander:0 "法兰西的前统治者，梵卓氏族的[TARGET_CHARACTER.GetFirstName]，必须死"
