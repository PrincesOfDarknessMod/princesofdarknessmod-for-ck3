 learning_kaja_decision_confirm:1 "如此复杂！"
 avenge_arikels_shame_objective_decision:0 "为亚力科之耻而复仇"
 avenge_arikels_shame_objective_decision_tooltip:0 "你的先祖很久以前被羞辱了，而过往的怨恨永远不会真正消失。"
 avenge_arikels_shame_objective_decision_desc:0 "妥芮朵[Clan|E]的创始人亚力科曾经作为苏美尔的女神统治过。她的死对头，冈格罗的伊娜依娅逼走了她，造成了两人之间的恩怨，一直持续到今天。"
 avenge_arikels_shame_objective_decision_effect_tooltip:0 "你作为亚力科最重要的捍卫者的名声将得到保证，而冈格罗氏族将受到羞辱。"
 avenge_arikels_shame_objective_decision_confirm:0 "纠正错误"
 avenge_arikels_shame_custom_decision_tablet:0 "你必须得有[ARTIFACT.GetName]在库存中"
