 ikhwan_al_safa_egypt_objective_decision:0 "援助兴光者"
 ikhwan_al_safa_egypt_objective_decision_desc:0 "更加实际的古兰赛义德成员认识到，木乃伊们比精诚兄弟社更有经验，更了解夜行者，因此向他们提供了援助。"
 ikhwan_al_safa_egypt_objective_decision_tooltip:0 "你将清洗信仰之地的核心，并从这援助受益。"
 ikhwan_al_safa_egypt_objective_decision_confirm:0 "不朽朋友？"
 ikhwan_al_safa_arabia_objective_decision:0 "解放恸鸣"
 ikhwan_al_safa_arabia_objective_decision_desc:0 "恸鸣来自于卡巴天房内的黑石，其始于先知穆罕默德征服麦加之后，人们普遍认为它是真主力量的显现。被污染的超自然，如吸血鬼，会觉得恸鸣是一种喧嚣的哀号和尖啸。在其历史上，恸鸣只停止过一次，那是在950年，当伊斯兰教派卡尔马特派的成员偷走了黑石。这使得吸血鬼塔利克能够建立起术法封印，限制住一部分恸鸣，尽管他们不能完全压制它。"
 ikhwan_al_safa_arabia_objective_decision_tooltip:0 "你将把恸鸣从塔利克的邪恶术法中释放出来。"
 ikhwan_al_safa_arabia_objective_decision_confirm:0 "真主将怒斥。"
 ikhwan_al_safa_arabia_objective_decision_effect_tooltip:0 "恸鸣会释放出它所蕴含的力量，使所有吸血鬼远离阿拉伯。"
 ikhwan_al_safa_persia_objective_decision:0 "苏菲"
 ikhwan_al_safa_persia_objective_decision_desc:0 "你将在智慧之家研习苏菲主义，希望能找到如何从真主那里调用力量的秘密。"
 ikhwan_al_safa_persia_objective_decision_tooltip:0 "你找到了蕴涵在伊斯兰神秘主义里的力量。"
 ikhwan_al_safa_persia_objective_decision_confirm:0 "我将开道。"
 ikhwan_al_safa_persia_objective_decision_effect_tooltip:0 "精诚兄弟社将在圣职授任时获得[GetTrait('theurgist').GetName( GetPlayer )][trait|E]。"
 demon_redemption_objective_decision:0 "神之宽恕"
 demon_redemption_objective_decision_tooltip:0 "也许，在遥远的某个地方，希望仍然存在。"
 demon_redemption_objective_decision_desc:0 "对你作为天使的过去的回忆使你想起了你在逆神中失去的一切。如果上帝真的宽宏大量，也许在祂的亮银之城还有你的位置？"
 demon_redemption_objective_decision_confirm:0 "终于，有了光"
 demon_redemption_objective_custom:0 "这将结束你的旅程于——希望是——救赎。"
 demon_redemption_tt1:0 "放弃你所有的世俗财产。"
