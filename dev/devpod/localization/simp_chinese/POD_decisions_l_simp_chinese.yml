 POD_nephilim_decision:0 "拿非利人"
 POD_nephilim_decision_desc:0 "恶魔与凡人女性的后代，亚巴顿和阿斯莫德的实验的成果。他们被路西法和他的恶魔追随者追捕并杀害。\n\n不知是否有拿非利人幸存下来，除非你能找到现在位于北方的亚巴顿，或现在位于东方的阿斯莫德。或者更好，通过聚集足够多的灵媒来举办仪式，询问在[underworld|E]的那些死去的拿非利[GetTrait('ferryman').GetName( GetPlayer )]们，那么也许你可以成为一支新拿非利人血种的先祖……"
 POD_nephilim_decision_tooltip:0 "你将找到创造新拿非利人所需的线索。"
