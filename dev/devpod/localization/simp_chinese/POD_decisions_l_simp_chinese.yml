 life_bring_life_objective_decision:0 "生生不息"
 life_bring_life_objective_decision_desc:0 "当鬼神逐鹿争玉之时，阎魔们在各方的心中下毒，使让极端化与中间派对立起来，这下去只有阎魔才是赢家。\n巫凤的大使们不仅仅是阻止了几场战争，他们还招募其他高尚的鬼神加入他们的事业，从凶猛的变化妖怪到隐秘的妖仙。生命是宝贵的，过于宝贵，不能浪费在无意义的内斗中。和平带来希望，希望带来治愈，治愈带来生命。万事皆成，阎魔必败。"
 life_bring_life_objective_decision_tooltip:0 "你将尽可能地联合你能联合的鬼神。"
