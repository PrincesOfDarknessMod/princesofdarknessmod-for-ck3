 POD_infernalist_longevity_decision_tooltip:0 "向恶魔索求寿命。"
 POD_infernalist_longevity_decision_desc:0 "有了这契约，祈求者可以增加5年寿命。许多崇魔者每5年举行一次仪式，献祭几十个无辜者来争取更多的寿命。"
 POD_infernalist_longevity_decision_confirm:0 "重获青春！"
