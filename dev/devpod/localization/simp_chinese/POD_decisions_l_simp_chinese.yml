 commit_suicide_decision_desc_mummy:0 "木乃伊有能力结束自己的不朽存在。奥西里斯不会强迫任何人永生。一位自杀的木乃伊被认为是没有生存意志的，不管其的意志力如何。木乃伊必须自愿打算真正和永久地死去。木乃伊因其他原因而实施的自杀行为不会结束木乃伊的存在。"
