 true_brujah_victory_objective_decision:0 "关于布鲁赫的真相"
 true_brujah_victory_objective_decision_tooltip:0 "所谓的“布鲁赫”是被满嘴谎言的特洛伊尔制造出来的受骗子嗣。真相必须被揭开。"
 true_brujah_victory_objective_decision_desc:0 "为了证明布鲁赫氏族的真相，你需要迫使迦太基的子嗣们支持你的主张……或者没有资格再与你争论。"
 true_brujah_victory_objective_decision_confirm:0 "让他们听见真相！"
 trujah_victory_objective_decision_effect_tooltip:0 "在对待伪布鲁赫的问题上，你将有一个选择。要么表示宽恕，要么要求他们的绝灭。"
 trujah_objective_tt:0 "必须通过劝说或武力将特洛伊尔的子嗣拉到你的队伍。"
 trujah_victory_objective_decision_custom:0 "[TARGET_CHARACTER.GetFirstName]必须是你的朋友或灵魂伴侣。或者已死。"
