 ghoulbro_objective_decision:0 "进军都会"
 ghoulbro_objective_decision_desc:0 "君士坦丁堡是巴西尔和巴耶齐德初次开始布道的地方。那时候他们还在宣扬他们主人的谎言，但随着他们和城市的沦陷，兄弟俩睁开了眼，见到了新的真相。真理需要被塑造成最具传染性的福音书，并由忠实的传道者传播给尽可能多的灵魂。没有哪个地方的灵魂比这一切开始的地方——伟大的君士坦丁堡——更多。"
