 POD_demon_unearthbound_decision:0 "清除恶魔污染"
 POD_demon_unearthbound_decision_tooltip:0 "处理被腐化的土地。"
 POD_demon_unearthbound_decision_desc:0 "你的部分地产已经被恶魔污染所玷污。虽然很昂贵，但它可以被修复。"
 POD_demon_unearthbound_decision_confirm:0 "来位驱魔师！"
 POD_demon_maintenance.30.t:0 "清除恶魔污染"
 POD_demon_maintenance.30.desc:0 "恶魔的腐化在大多数时候都是不见天日的。但在有些情况下，地狱居民并不那么迂回，他们试图腐化土地本身，希望把自己束缚在上面。\n你不太清楚“为什么”和“怎么做”，但最终的结果是一副可怕的景象，自然被这个地狱般的存在所玷污。幸运的是，如果你用心（和资源）去做，消除这痕迹是可行的。你已经聚集了最伟大的猎魔人，愿意在这方面与你一起合作，时刻可以触发。"
 POD_demon_maintenance.30.option.a:0 "吾驱逐汝！"
