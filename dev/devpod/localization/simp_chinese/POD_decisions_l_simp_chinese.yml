 POD_infernalist_study_demonology_3_decision_tooltip:0 "完毕增强恶魔学特质。"
 POD_infernalist_study_demonology_3_decision_desc:0 "要付出可怕的代价来获取恶魔们最梦寐以求的秘密。但它们能释放出什么样的可怕力量？"
 POD_infernalist_study_demonology_3_decision_confirm:0 "精通崇魔"
 POD_infernalist_sacrifice_to_great_demon_decision:0 "向地狱大公献祭"
 POD_infernalist_sacrifice_to_great_demon_decision_tooltip:0 "选择哪位大恶魔来献上祭品。"
 POD_infernalist_sacrifice_to_great_demon_decision_desc:0 "凭借你对恶魔学的掌握，你可以举行一个献给地狱大公之一的献祭大仪式。"
 POD_infernalist_sacrifice_to_great_demon_decision_confirm:0 "保佑我！"
 POD_infernalist_sacrifice_to_great_demon_decision_custom:0 "在选择献给哪个大恶魔后，你可以对自己使用[character_interaction|E]来选择进行哪种献祭。"
 POD_demon_maintenance.40.t:0 "地狱抉择"
 POD_demon_maintenance.40.desc:0 "凭借你对恶魔学的掌握，你可以举行一个献给地狱大公之一的献祭大仪式。\n长期以来，路西法的五位副手一直是地狱阶级的顶峰，他们相互竞争，以腐化宇宙并向上帝复仇。他们一直在寻找更多的追随者，并且对那些尊敬他们的人可是慷慨的……但最终总是要付出代价。"
