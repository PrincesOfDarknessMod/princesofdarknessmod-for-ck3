 end_the_diaspora_objective_decision:0 "终结流散"
 end_the_diaspora_objective_decision_desc:1 "自从公元前332年埃及被亚历山大的军队攻陷后，贤荷鲁失去了自己的首都，伊斯兰教兴起后，他们几乎放弃了自己出生的土地。是时候夺回你的故土了。"
 end_the_diaspora_objective_decision_tooltip:1 "你将光复故土。"
 end_the_diaspora_objective_decision_confirm:1 "我们的家乡"
 in_name_of_horus_objective_decision:0 "荷鲁斯的圣战"
 in_name_of_horus_objective_decision_desc:1 "荷鲁斯，奥西里斯的儿子，也是最伟大的不朽者，他带领大多数木乃伊进行着一场圣战，以清除他那凶残的叔父赛特——也是阿波菲斯的仆从。你将完成这次讨伐，并在荷鲁斯的城堡里见他，以展示你的荣耀和对该事业的承诺。"
 in_name_of_horus_objective_decision_tooltip:1 "你将抹除赛特之子氏族吸血鬼。"
 in_name_of_horus_objective_decision_confirm:1 "为奥西里斯复仇！"
 in_name_of_horus_objective_decision_custom:1 "在地图上不能有[GetTrait('setite').GetName( GetPlayer )][independent_ruler|E]。（你可以通过氏族地图模式进行确认）"
 lightning_the_land_of_faith_objective_decision:0 "光照信仰之地"
 lightning_the_land_of_faith_objective_decision_desc:1 "流经世界的塞赫被集中在信仰之网中，这是一种强大的，即使是无形的，与该地力量的联系。而信仰之地是由信仰之网边界内的所有区域组成的。现在是时候从黑暗的仆人手中重新完全征服这个强大的力量源泉了。"
 lightning_the_land_of_faith_objective_decision_tooltip:1 "你将铲除邪恶的根源。"
 lightning_the_land_of_faith_objective_decision_confirm:1 "暗不胜光"
 wandering_good_man_objective_decision:0 "流浪善人"
 wandering_good_man_objective_decision_desc:1 "以实玛利派尽管与荷鲁斯的追随者有政治上的争执，但他们仍然是是贤荷鲁，他们之间唯一的区别是他们的忠诚。以实玛利派认为荷鲁斯是一位短视的暴君，他的小心思使他对世界上更大的邪恶视而不见。你将证明荷鲁斯所选择的方式是无效的，并以你自己的方式领导对阿波菲斯的胜利。"
 wandering_good_man_objective_decision_tooltip:1 "你的善名将被历史铭记。"
 wandering_good_man_objective_decision_confirm:1 "善有善报。"
 wandering_good_man_objective_decision_custom:1 "你阻止了#V 7#!场自然灾害#weak （[CHARACTER.MakeScope.GetVariable('stopped_natural_hazard_count').GetValue|0]）#!"
