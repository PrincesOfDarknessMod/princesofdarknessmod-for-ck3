 restore_livonia:0 "重建利沃尼亚"
 restore_livonia_tooltip:1 "十字永远无法毁灭我们。"
 restore_livonia_desc:0 "几个世纪以来，兽性之道的信徒受到了十字的[cainites|E]骑士的压迫，在冈格罗喀喇的旗帜下团结了一段时间。这种抵抗精神仍然可以成为我们功业的强大资产。"
 restore_livonia_confirm:0 "寸步不让。"
 restore_livonia_effect_tooltip:1 "你将创建利沃尼亚野者王国头衔。"
 restore_reconquista:0 "重建勒森魃西班牙"
 restore_reconquista_tooltip:1 "伴随着信仰和暗影，我们将回归。"
 restore_reconquista_desc:0 "西班牙的勒森魃内战主要是一场政治事件，但它给[Clan|E]的年轻成员带来了很多机会。通过利用它的遗产，我们将有望获得同样的回报。"
 restore_reconquista_confirm:0 "滚回你家去。"
 restore_reconquista_effect_tooltip:1 "你将创建暗影再征服王国头衔。"
