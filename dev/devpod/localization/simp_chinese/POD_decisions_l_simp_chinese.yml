 unlock_war_avatar_of_great_fenris_decision:0 "向大芬里斯献祭"
 unlock_war_avatar_of_great_fenris_decision_tooltip:0 "解锁[GetMaA('war_avatar_of_great_fenris').GetName][men_at_arms|E]。"
 unlock_war_avatar_of_great_fenris_decision_desc:0 "作为部族和图腾之间契约的最终体现，最伟大的芬里尔仔兽英雄会在他们需要的时候召唤他们部族图腾的战争化身来帮助他们。化身加入战斗，杀死所有不属于芬里斯仔兽或受其保护的人。然而，大芬里斯会要求为他的干预做出献祭——通常是召唤者的左手。"
