 POD_demon_longevity_decision_tooltip:0 "使用奥秘的力量来增长寿命。"
 POD_demon_longevity_decision_desc:0 "每使用一次该奥秘，魔奴就会在五年内停止衰老。这是向最伟大的奖赏迈出的一小步。"
 POD_demon_longevity_decision_confirm:0 "重获青春！"
