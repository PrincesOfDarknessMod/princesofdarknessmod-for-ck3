 toreador_grandeur_custom_decision2:0 "如果你具有朝廷，你将需要你的宫廷显赫等级达到10级。否则，你将需要拥有超过15000的声望。"
 library_victory_objective_decision:0 "永恒的知识"
 library_victory_objective_decision_tooltip:1 "知识就是力量，如众人所说。"
 library_victory_objective_decision_desc:0 "你是博学的氏族成员之一，知道隐藏在书面文字背后的价值和力量。你必须确保拥有这个时代最伟大的图书馆供你使用。"
 library_victory_objective_decision_effect_tooltip:1 "你将能够更快地学习新的生活方式，而你的文化革新也将受益。"
 library_victory_objective_decision_confirm:0 "旧亚历山大图书馆的对手"
 library_victory_objective_decision_custom:0 "你必须拥有挪得之书。"
 library_victory_objective_decision_custom2:0 "你必须拥有伟大的不死族图书馆之一。巴塞罗那、马耳他、维也纳或埃尔吉耶斯（卡帕多西亚）。"
 learning_kaja_decision:0 "学习鬼书"
 learning_kaja_decision_desc:1 "古老的、异常复杂的万仙的表意文字。学习它将使你能够更加理解所有其他鬼书使用者。"
