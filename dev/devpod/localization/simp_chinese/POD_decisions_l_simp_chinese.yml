 pure_evil_objective_decision_desc:1 "祸患木乃伊在本能级的反对玛阿特，并保持着一种扭曲的心智，即世界已经破碎，修补它的唯一方法就是让阿波菲斯吞噬其他一切。蛇的仆人充满了它的精髓，被束缚着去实现它的意志。"
 pure_evil_objective_decision_tooltip:1 "你向所有人证明了你是纯粹的邪恶。"
 pure_evil_objective_decision_confirm:1 "无恶不为。"
