l_simp_chinese:
 game_concept_princes_of_darkness: "黑暗亲王"
 game_concept_princesofdarkness: "$game_concept_princes_of_darkness$"
 game_concept_princes_of_darkness_desc: "十字军之王3的Mod，设定取自P社旗下白狼公司的《[world_of_darkness|E]》跑团规则。正是你现在所玩的！[prince|E]是具有领地的[GetTrait('vampire').GetName( GetNullCharacter )]的主要头衔，相等于十字军之王3的[duchy|E]。何处黑暗？取决于你。"
 game_concept_POD: "黑暗亲王"
 game_concept_prince: "亲王"
 game_concept_the_prince: "亲王"
 game_concept_the_princes: "亲王"
 game_concept_princes: "亲王"
 game_concept_prince_desc: "亲王是具有领地的[GetTrait('vampire').GetName( GetNullCharacter )]的主要头衔，相等于十字军之王3的[duchy|E]。"
 game_concept_bloodpotency: "血能"
 game_concept_bloodpotency_desc: "$game_concept_bloodpotency$代表[GetTrait('vampire').GetName( GetNullCharacter )]血中的固有能力，它随着时间的推移而缓慢增长，并受到[GetTrait('vampire').GetName( GetNullCharacter )]的[vampgeneration|E]的限制。$game_concept_bloodpotency$在[torpor|E]中会缓慢减弱。它会通过来[diablerize|E]高血能的$POD_splat_vampire_plural$来迅速增长。$game_concept_bloodpotency$会影响[discipline|E]使用后饥渴的增长速度，和[GetTrait('vampire').GetName( GetNullCharacter )]的能力，如[disciplines|E]的有效性。"
 game_concept_blood_potency: "$game_concept_bloodpotency$"
 game_concept_vampgeneration: "世代"
 game_concept_generation: "世代"
 game_concept_vampgeneration_desc: "依据[cainites|E]，这是[GetTrait('vampire').GetName( GetNullCharacter )]的血脉与所有$POD_splat_vampire_plural$之父——该隐的距离。该隐属于[GetTrait('vampgeneration1').GetName( GetNullCharacter )]。[GetTrait('vampgeneration14').GetName( GetNullCharacter )]或更后的吸血鬼都是“淡血种”，更近似人类而非吸血鬼。不信该隐的吸血鬼都将他们的[vampgeneration|E]追溯至一些源自其他神话的始祖。吸血鬼可以减少他们的[vampgeneration|E]，也可以通过对有比他们有更前[vampgeneration|E]的吸血鬼实施[diablerie|E]，来增加他们的潜在能力。"
 game_concept_bloodbond: "血缚"
 game_concept_bloodbond_desc: "喝下[GetTrait('vampire').GetName( GetNullCharacter )]的血一般会使其对[GetTrait('vampire').GetName( GetNullCharacter )]建立一种强烈的忠心和遵从感。也称血誓，这就像一个牵制，强度越高，消耗越多的血液。有些吸血鬼无法用自己的血建立联系。另一些吸血鬼则完全不可被束缚。"
 game_concept_blood_oath: "$game_concept_bloodoath$"
 game_concept_bloodoath: "血誓"
 game_concept_blood_bond: "$game_concept_bloodbond$"
 game_concept_beast: "心兽"
 game_concept_the_beast: "$game_concept_thebeast$"
 game_concept_thebeast: "心兽"
 game_concept_beast_desc: "#bold 心兽#!是被$POD_splat_vampire_plural$用来描述那个试图控制[cainites|E]的内在掠食者的术语。那是一只伴随着每个[GetTrait('vampire').GetName( GetNullCharacter )][Embrace|E]而觉醒的与生俱来的恶魔般的掠食者。它与吸血鬼的人性（在某些情况下是教化心路）直接对立，是许多[cainites|E]每晚都会感到的堕落冲动的罪魁祸首。\n\n在压力极高的情况下，心兽可以压垮一位[GetTrait('vampire').GetName( GetNullCharacter )]，并强迫其陷入回归兽性的狂暴（血狂）或逃亡（赤骇）。\n\n在[princes_of_darkness|E]，心兽有时会#beast 如此#!说话。如果一位[GetTrait('vampire').GetName( GetNullCharacter )]有负[piety|E]，其会有风险陷入永久的血狂并变成一只[GetTrait('wight').GetName( GetNullCharacter )]。这将使其退位给其的[heir|E]。"
 game_concept_the_masquerade: "潜藏"
 game_concept_masquerade: "潜藏"
 game_concept_masquerade_desc: "潜藏是$POD_splat_vampire_plural$使用的术语，指的是保持他们存在对凡人隐秘的戒条。违反潜藏会招惹麻烦，例如被猎人袭击。在部分领地，这可能会被视作吸血鬼间的[crime|E]。\n大多数信仰可以通过[character_interaction|E]来掩盖潜藏的破漏。拥有太高的潜藏曝露度会导致派别叛乱和你的角色会被袭击的事件。"
 game_concept_humor: "体液"
 game_concept_humors: "体液"
 game_concept_humour: "体液"
 game_concept_humours: "体液"
 game_concept_humorism: "体液"
 game_concept_humourism: "体液"
 game_concept_resonance: "共鸣"
 game_concept_resonances: "共鸣"
 game_concept_resonance_desc: "血液根据其容器的个性和情感而有着既定的特性。吸血会根据$game_concept_resonance$来赋予$POD_splat_vampire_plural$能力。你会因吸特定共鸣的血液或使用特定的[discipline|E]得到更多[discipline|E]经验。这些共鸣是：\n$BULLET_WITH_TAB$[choleric_lifestyle|E]\n$BULLET_WITH_TAB$[melancholy_lifestyle|E]\n$BULLET_WITH_TAB$[phlegmatic_lifestyle|E]\n$BULLET_WITH_TAB$[sanguine_lifestyle|E]\n$BULLET_WITH_TAB$[animal_lifestyle|E]"
 game_concept_torpor: "蛰眠"
 game_concept_torpor_desc: "蛰眠是[GetTrait('vampire').GetName( GetNullCharacter )]停止活动的情形。他在不能动时，还可以感觉到他周围所发生的事情。它可以由刺穿心脏的尖桩、足够的身体损伤、巨大的饥渴感或倦怠感引起。\n一个具有蛰眠特质的角色会被严重削弱，不能进行大多数行动，也不能统治。他们可以被“寻找藏身处”[character_interaction|E]所唤醒。"
 game_concept_torpid: "蛰眠"
 game_concept_hunger: "饥渴"
 game_concept_hunger_desc: "$game_concept_hunger$是一个[GetTrait('vampire').GetName( GetNullCharacter )]想要进食血液的欲望。这是由于[the_beast|E]而产生。随着一个[GetTrait('vampire').GetName( GetNullCharacter )]的$game_concept_bloodpotency$越高，降低他们的$game_concept_hunger$就需要越多的血液。增加$game_concept_hunger$对一个[GetTrait('vampire').GetName( GetNullCharacter )]同时有着正面和极大负面影响。唯一全面满足[GetTrait('vampire').GetName( GetNullCharacter )]的$game_concept_hunger$的方法是杀戮并吸光受害者所有的血液。即使这样$game_concept_hunger$的满足也只是暂时的。"
 game_concept_the_hunger: "饥渴"
 game_concept_blood_hunger: "饥渴度"
 game_concept_the_thirst: "饥渴"
 game_concept_thirst: "饥渴"
 game_concept_blood_thirst: "嗜血"
 game_concept_discipline: "血律"
 game_concept_disciplines: "血律"
 game_concept_discipline_desc: "被称为“血律”的吸血鬼力量的起源是未知的，但许多人认为它们是该隐或莉莉丝的赠礼，通常认为一些[antediluvians|E]发明了独创的血律，并通过他们的世系传承下来。还有人认为它们是不死族之身与生俱来的力量。\n在游戏中，血律被处理成生活方式树，你可以通过其解锁能力。要开启其中一棵树，你必须有相应的血律特质。这些树的XP通过猎食凡人时获得的血液共鸣增加。"
 game_concept_choleric_lifestyle: "胆汁质共鸣"
 game_concept_yellow_bile: "$game_concept_yellowbile$"
 game_concept_yellowbile: "黄胆汁"
 game_concept_choleric_lifestyle_desc: "$game_concept_choleric_lifestyle$适用于某些通过吸食带有愤怒或嫉妒的情感的血液来改善[disciplines|E]的$POD_splat_vampire_plural$。其寻找带有类似[GetTrait('wrathful').GetName( GetNullCharacter )]和[GetTrait('sadistic').GetName( GetNullCharacter )]性格[traits|E]的猎物。\n\n常见[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('celerity').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('potence').GetName( GetNullCharacter )]\n\n稀有[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('valeren').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('vicissitude').GetName( GetNullCharacter )]"
 game_concept_sanguine_lifestyle: "多血质共鸣"
 game_concept_sanguine: "多血质"
 game_concept_sanguine_lifestyle_desc: "$game_concept_sanguine_lifestyle$适用于某些通过吸食带有幸福和热情的情感的血液来改善[disciplines|E]的$POD_splat_vampire_plural$。其寻找带有类似[GetTrait('gregarious').GetName( GetNullCharacter )]和[GetTrait('lustful').GetName( GetNullCharacter )]性格[traits|E]的猎物。\n\n常见[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('presence').GetName( GetNullCharacter )]\n\n稀有[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('bloodsorcery').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('daimonion').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('quietus').GetName( GetNullCharacter )]"
 game_concept_phlegmatic_lifestyle: "黏液质共鸣"
 game_concept_phlegm: "黏液"
 game_concept_phlegmatic: "黏液质"
 game_concept_phlegmatic_lifestyle_desc: "黏液质共鸣适用于通过吸食带有多愁善感和控制的情感的血液来改善[disciplines|E]的$POD_splat_vampire_plural$。其寻找带有类似[GetTrait('lazy').GetName( GetNullCharacter )]和[GetTrait('content').GetName( GetNullCharacter )]性格[traits|E]的猎物。\n\n常见[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('auspex').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('dominate').GetName( GetNullCharacter )]\n\n稀有[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('dementation').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('melpominee').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('mytherceria').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('temporis').GetName( GetNullCharacter )]"
 game_concept_melancholy_lifestyle: "抑郁质共鸣"
 game_concept_black_bile: "$game_concept_blackbile$"
 game_concept_blackbile: "黑胆汁"
 game_concept_melancholic: "抑郁质"
 game_concept_melancholy_lifestyle_desc: "$game_concept_melancholy_lifestyle$适用于某些通过吸食带有悲伤和理智的情感的血液来改善[disciplines|E]的$POD_splat_vampire_plural$。其寻找带有类似[GetTrait('shy').GetName( GetNullCharacter )]和[GetTrait('craven').GetName( GetNullCharacter )]性格[traits|E]的猎物。\n\n常见[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('fortitude').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obfuscate').GetName( GetNullCharacter )]\n\n稀有[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('bardo').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('chimerstry').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('necromancy').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obtenebration').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('visceratika').GetName( GetNullCharacter )]"
 game_concept_animal_lifestyle: "兽性共鸣"
 game_concept_animal_lifestyle_desc: "$game_concept_animal_lifestyle$适用于某些通过从动物来吸食改善[disciplines|E]的$POD_splat_vampire_plural$。其寻找动物作为猎物。\n\n常见[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('animalism').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('protean').GetName( GetNullCharacter )]\n\n稀有[disciplines|E]包括：\n$BULLET_WITH_TAB$[GetTrait('abombwe').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('serpentis').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('spiritus').GetName( GetNullCharacter )]"
 game_concept_diablerize: "吸榨"
 game_concept_amaranth: "不凋花"
 game_concept_discipline_power: "血律力量"
 game_concept_discipline_power_desc: "[discipline|E]力量是对[disciplines|E]的应用，允许$POD_splat_vampire_plural$达成超自然之事或获得奇异能力。"
 game_concept_bind_famulus: "契约动物伙伴"
 game_concept_bind_famulus_desc: "契约动物伙伴是一种[character_interaction|E]，它允许你通过血缚将一只动物转化为你的动物伙伴，与其形成一精神链接，并辅助你运用其他兽性术能力。"
 game_concept_animal_succelence: "鲜美野味"
 game_concept_animal_succelence_desc: "吸血鬼可以通过吸食动物时回复额外的[hunger|E]。此外，吸血鬼也可以吸食它的动物伙伴，其取得的营养远远超过类似体型的动物，并吸收走它的基本特质的一小部分。"
 game_concept_blood_draught: "血剂"
 game_concept_blood_draught_desc: "吸血鬼的血能够通过[discipline|E]被萃取，给予任何饮下它的人各种增强。与血剂相关的动作是通过[character_interaction|E]进行的。"
 game_concept_shapeshift: "变形"
 game_concept_shapeshift_desc: "一种允许使用者以某种方式变化形态的[character_interaction|E]，通常包含在变形术或易变术中。"
 game_concept_feral_weapons: "天然武器"
 game_concept_feral_weapons_desc: "吸血鬼能将其等的天然武器伸展成怪物般的大小，这通常为将指甲化为锋利的爪子，但也有其他形式如将利齿化为锋利的匕首，如同巨蛇之牙。[shapeshift|E]的子技能。"
 game_concept_tenebrous_avatar: "阴暗化身"
 game_concept_tenebrous_avatar_desc: "吸血鬼对于黑暗的掌握已经到了出神入化的地步，以至于能够化身为它。在激活此能力后，吸血鬼能够变成一片漆黑又混沌莫测的影子。处于此形态的吸血鬼基本上是无敌的，并能够穿过墙缝和地缝。此外，该吸血鬼还获得了能够在自然黑暗中视物的能力。[shapeshift|E]的子技能。"
 game_concept_faith_lifestyle: "真信"
 game_concept_faith_lifestyle_desc: "极度狂热角色的奇异天赋，真信特质启用同名生活方式，在其中可以通过对应的生活方式经验获得各种能力。"
 game_concept_bloodsorcery: "血术法"
 game_concept_blood_sorcery: "$game_concept_bloodsorcery$"
 game_concept_blood_magic: "血魔法"
 game_concept_thaumaturgy: "奇术"
 game_concept_durnaki: "杜–安–奇"
 game_concept_bloodsorcery_desc: "血术法，也被称为奇术、赫考、杜–安–奇等，是一种利用吸血鬼的精血来唤起强大魔法效果的艺法。血术法是一种强大但危险且昂贵的工具，它由少数[Clans|E]所拥有，并被小心守护。每个派系都有自己召唤血之力的方式——睿魔尔使用赫耳墨斯魔法和符号，哈基姆圣裔的术士与灵和神签订契约，而勒森魃则坠入深渊以召唤奥秘。据说血术法有能做近乎任何事情——虽然这些声明通常来自于希望创造一个可怕的景象的实践者或诅咒和火球的受害者，但的确，血术法可以提供无数的法术和能力，有些可以被认作……非自然。"
 game_concept_necromancy: "亡灵术"
 game_concept_mortis: "死灵术"
 game_concept_possession: "附身"
 game_concept_possess: "附身"
 game_concept_possession_desc: "死灵获得身体所有权的过程。附身成功与否取决于死灵和受害者之间的决斗。附身分为三个阶段，所以可以对同一个人多次使用（当然，如果你使用的是相同的死灵）。如果受缚于你的幽灵附身于一个受害者，目标也会受缚于你。附身阶段：\n1. 第一阶段，受害者获得一些死灵的勇武在他们自己之上，并且亡灵术师和死灵获得对受害者的影响力。\n2. 第二阶段，给予受害者一些死灵的能力，给予他们一部分幽灵特性。亡灵术师对受害者拥有更多的控制。此外，死灵和受害者的个性开始融合在一起。\n3. 第三阶段，完全附身，死灵的人格覆盖了目标。受害者被死灵奴役，并获得更多的属性能力，因为幽灵通过其行动。亡灵术师的控制进一步增强。"
 game_concept_necromancy_desc: "亡灵术是一种[bloodsorcery|E]，专门针对死者，[underworld|E]和死灵。\n通过使用湮灭和深渊的力量，亡灵术师可以缚灵死灵用于他们的意愿，并命令他们执行各种各样的任务——从间谍到[possession|E]。"
 game_concept_endowments_lifestyle: "信念生活方式"
 game_concept_endowments_lifestyle_desc: "信念代表着裁判官在掌握修会的消灭地狱仆从的方法的道途上所取得的进步。"
 game_concept_obtenebration: "幽暗术"
 game_concept_obtenebration_desc: "幽暗术，控制和操纵影子的力量，是给予了暗影之[Clan|E]其前缀的[discipline|E]。该术入门者可以利用它来移动和操纵影子，使之成为自己的优势，而大师们则可以赋予影子以形态、物质和生命的模样。这种力量的来源的性质在勒森魃中引起了无尽的争论。该[Clan|E]最古老的长者声称，黑暗本身就是一个原始的实体，与创造世界的力量相等且相反。受祆教的影响，最年长的人通常称这种黑暗力量为阿里曼。其他的勒森魃认为幽暗术的力量来自于某个暗影界域，而不是个实体。信仰亚伯拉罕诸教的勒森魃可能会称该国度为地狱，而信奉古希腊或罗马神的人可能会称它为塔尔塔罗斯。不管起源是什么，幽暗术对于那些看到它被使用的人来说是完全令人不安的。看到[discipline|E]的使用的动物或凡人会感到恐惧。即使是[cainites|E]，若要解释，也倾向于将幽暗术视为对自然法则的侮辱。"
 game_concept_abyss_eyes: "深渊之眼"
 game_concept_abyss_eyes_desc: "深渊之眼是一种[discipline_power|E]、[shapeshift|E]的子技能。吸血鬼的眼睛变成黑色。他们无视所有的黑暗减益，即使是超自然黑暗带来的减益，并能看到幽灵。"
 game_concept_nocturne: "化夜"
 game_concept_nocturne_desc: "化夜是一种[discipline_power|E]，可以作为个人[character_interaction|E]使用，在战斗中通过造成血液流失（因此有概率杀死对方）来对敌方[knights|E]或[single_combat_duel|E]对手造成减益，每有个被减益的敌人都要消耗一定虔诚。通过集中精力召唤出黑暗，拥有此能力的勒森魃可以召唤出一团蠕动的超自然黑暗，吞噬一个区域并遮蔽所有的光源。黑暗是深渊的一种显现，它能掩盖声音和视线，并扼杀弱者的生命。"
 game_concept_drain_the_life: "众生衰竭"
 game_concept_drain_the_life_desc: "一种[discipline_power|E]，通过[character_interaction|E]给予[GetModifier('drain_the_life_power_modifier').GetNameWithTooltip]来削弱敌方国度。\n\n吸血鬼手腕一动，就会使深渊降临到世上，在空中形成一个可怕的球形空洞。无论敌友都会受伤，也许会被毁灭，直到其关闭。那些被杀（或几乎被杀）的人会化为虚无。所有关于他们存在的痕迹都消失了。"
 game_concept_shadow_twin: "暗影分身"
 game_concept_shadow_twin_desc: "暗影分身是一种[discipline_power|E]，可以作为个人[character_interaction|E]使用，创造出一个具有你的能力和力量的角色，在任何时候都只能存在一个，如果其死亡，你会获得巨大的压力。吸血鬼对黑暗的控制已经发展到如此程度，以至于他可以赋予黑暗一定程度的知觉。通过使他自己的影子活化，[cainite|E]实际上可以“解放”由光投下的影子。当这种能力处于激活状态时，受术者不会投下任何影子，因为它已经离开，去遵从吸血鬼的命令。"
 game_concept_elder_perk: "长者技能"
 game_concept_elder_perk_desc: "长者技能是只有[vampgeneration|E]最够前到足以唤醒其血液的真正潜力的$POD_splat_vampire_plural$才能获得的[perks|E]。"
 game_concept_shadow_twin_master: "暗影主宰"
 game_concept_shadow_twin_master_desc: "$game_concept_shadow_twin_master$是一种表示这该角色制造了一位暗影分身的$game_concept_relation$，而[shadow_twin_servant|E]侍奉与该角色。"
 game_concept_shadow_twin_servant: "暗影分身"
 game_concept_shadow_twin_servant_desc: "$game_concept_shadow_twin_servant$是一种$game_concept_relation$，意味着该角色是位暗影分身，通过影子制造出的克隆体，侍奉于它的[shadow_twin_master|E]"
 game_concept_daimonion: "崇魔术"
 game_concept_daimonion_desc: "巴力之血中流淌并歌唱着呓语，自深缚于大地之低语中剥离，从首位呼唤深渊的术士的喉间扯下。崇魔术是跨越天地的呼喊——从我们的世界延伸至被遗忘的某处，而力量则从那一所在回响于我们的世界。某天，巴力血系将会尖啸，然后响声击碎世界。现在，他们用崇魔术轻柔地催人入睡，然后让他们梦遇火焰与黑暗。"
 game_concept_Sire: "尊长"
 game_concept_Sire_desc: "成功[Embrace|E]凡人的吸血鬼被称为该凡人的“尊长”。这种关系接近于凡人世界中的父母/孩子。和该关系一样，它可以采取多种表达，从工作同伙到直接仇恨。\n在本MoD中，这取代了$POD_splat_vampire_plural$的“父母/孩子”关系，因为他们不能自然生子。"
 game_concept_Embrace: "初拥"
 game_concept_Embrace_desc: "吸血鬼如果在吸干了凡人所有的血之后才给凡人喝下自己的血，就会把他们变成吸血鬼。这个过程被称为“初拥”，它将在新的[Sire|E]和他的新子嗣之间建立起牢固的联系。\n在MOD中，你可以右键点击你所在地区的任何一个凡人，启动一个初拥计谋。一旦完成，你将把这个凡人变成你自己的吸血鬼子嗣，游戏将其表现为一种父母/孩子关系。"
 game_concept_cainites: "该隐之子"
 game_concept_cainite: "该隐之子"
 game_concept_cainite_desc: "大多数$POD_splat_vampire_plural$同意“该隐即起源的故事”。圣经中的第一个杀人犯，在杀死自己的兄弟亚伯后，被天主和他的天使以各种方式诅咒，最终导致了今天已知的吸血鬼状况。\n因此，该隐之子已经成为吸血鬼描述自己的一个非常常用的术语。"
 game_concept_diablerist: "吸榨者"
 game_concept_diablerie: "吸榨"
 game_concept_diablerie_desc: "吸血鬼能犯下的最令人发指的罪行，当一位吸血鬼的所有血液被另一位吸血鬼吸食，导致受害者的灵魂也被吞噬时，就发生了吸榨。这个过程虽然被大多数人所不齿，但却能使犯罪者获得更大的力量，因为他们可以学习受害者的一些能力或减少他们的世代，使他们更接近该隐。\n在游戏中，吸榨是一个可以用来对付其他$POD_splat_vampire_plural$的计谋。如果你设法成功，你可以得到新的能力，增加血能，减少世代，但代价是大量的虔诚（取决于你的宗教）和一个从当下开始携带的难言秘密。"
 game_concept_Clan_desc: "氏族是一个用来描述$POD_splat_vampire_plural$的主要群体的术语，他们拥有由血液传递的共同特征。一名吸血鬼的氏族是他的世系，是他被[Embrace|E]在的吸血鬼“家族”。吸血鬼社会通常承认今夜有十三氏族，尽管有些可能已经消失在历史中，有些可能存在于隐秘之中，有些可能从未被人所知。\n像所有的血系一样，每个氏族都更专精于三项[disciplines|E]，一个氏族的弱点是其成员基本都特有的，以及由于倾向于[Embrace|E]具有某些特征的个人而都归有刻板印象。"
 game_concept_ashirra: "阿什拉派"
 game_concept_ashirra_desc: "阿什拉派（来自阿拉伯语的“氏族”一词）是信仰真主的伊斯兰$POD_splat_vampire_plural$教派，在凡人的穆斯林土地上有很强的影响力。阿什拉派的成员相信，如果他们选择追随真主，就会得到救赎，这是穆罕默德的承诺之一。虽然有些吸血鬼是真正的伊斯兰教信徒，但绝大多数参与阿什拉派的人都只是为了方便才拜伊斯兰教，或者只是为了更容易在中东地区活动。\n在某些情况下，阿什拉派可以用来指代任何遵循伊斯兰教的吸血鬼。"
 game_concept_antediluvian: "上古耆宿"
 game_concept_antediluvian_desc: "也被译作真祖，原文意为“大洪水之前”，该词可以适用于任何大洪水之前的[cainite|E]，如该隐或次代，但它几乎总是被用来特指三代，十三[Clans|E]是他们的后代。他们是具有不可估量的力量的生物。\n据推测，上古耆宿的年龄和血能使他们拥有近乎神的力量，事实上他们中的一些人就是神明。很少有关于其力量的使用的记录，但传说中通常将他们描绘成不可战胜的。有些人甚至认为，这种生物被杀死的唯一方法是他们希望被杀死，或者是在另一位上古耆宿的手中。"
 game_concept_antediluvians: "上古耆宿"
 game_concept_typhonic_avatar: "提丰下凡"
 game_concept_typhonic_avatar_desc: "提丰下凡是一种[discipline_power|E]，[shapeshift|E]子选项。吸血鬼能变身成提丰魔兽，传说生物。一只高大的胡狼耸立于大地之上，生有一条坚硬，分叉，多棘刺的尾，和平整的尖耳与长吻。提丰魔兽是赤红，玄黑或者二者之间的组合色。还有别的选择，它可以采取一种人蛇混合的形态，带着一条缠绕着的长尾代替双腿。除了宗教用途，还使用其作为“战争形态”。"
 game_concept_serpentis: "古蛇术"
 game_concept_serpentis_desc: "古蛇术是赛特恐怖的传承。这门[discipline|E]为赛特信徒深藏于胸的秘密；局外人很少有能看穿它来靠谱地理解它的功效，只有那些其认为有用的人才被教授这种才艺。大多数吸血鬼之所以害怕赛特之子，就是因为古蛇术的力量以及它与蛇和爬行动物的联系。"
 game_concept_serpent_eyes: "古蛇之眼"
 game_concept_serpent_eyes_desc: "古蛇之眼是一种[discipline_power|E]，[shapeshift|E]子选项。赋予吸血鬼传说中古蛇的催眠目光。吸血鬼的眼睛会变成金色，并带有巨大的黑色虹膜，角色周围的凡人会发现自己被其奇怪地吸引。一位凡人如果遇到吸血鬼催眠的目光，就会无法动弹。直到该角色把其的眼睛从受害者身上移开，该人会一直被冻结在原地。"
 game_concept_serpents_flesh: "蛇之肌肤"
 game_concept_serpents_flesh_desc: "蛇之肌肤是一种[discipline_power|E]，[shapeshift|E]子技能。以此能力，吸血鬼的皮肤变得坚韧粗糙，鳞片层生，滑滑腻腻，除此之外还有怪物般的特征。它的身体变得灵巧而易变，而它则更难被伤害。"
 game_concept_godhead: "神性"
 game_concept_godhead_desc: "神性是一种[discipline_power|E]，[shapeshift|E]子选项。这一恐怖的能力给予吸血鬼神之外观。大多数赛特之子通过采取和埃及神明相似的兽首来显现这项力量，而不同赛特之子的神性都有所区别。一些选择增高一米，一些选择黄金之肤。无论怎么显现，它总是显著而令人敬畏。"
 game_concept_heart_of_darkness: "黑暗之心"
 game_concept_heart_of_darkness_desc: "黑暗之心是一种[discipline_power|E]，可以以[character_interaction|E]方式使用。吸血鬼进行一种仪式，在这种仪式中，其去掉了自己的心，变得不那么情绪化，对吸榨和尖桩免疫。"
 game_concept_ghoul: "血仆"
 game_concept_domitor: "侍主"
 game_concept_domitor_desc: "侍主是一个用自己的精血喂养另一个存在的吸血鬼，并对其持有血缚，而后者反过来又成为其的血奴或[ghouls|E]。"
 game_concept_Clan: "氏族"
 game_concept_diablerists: "吸榨者"
 game_concept_diablerizing: "吸榨"
 game_concept_diablerized: "吸榨"
 game_concept_Embraced: "初拥"
 game_concept_Clans: "氏族"
 game_concept_shintai_lifestyle: "神体"
 game_concept_shintai_lifestyle_desc: "$game_concept_shintai_lifestyle$于[fifth_age|E]（1250年后）被研发，适用于$POD_splat_kueijin_plural$。大多数吸血鬼认为掌握了神体就表明对气的原理有了相应的理解，从而在掌握自我方面迈出了重要一步。"
 game_concept_chi_arts_lifestyle: "气功"
 game_concept_chi_arts_lifestyle_desc: "$game_concept_chi_arts_lifestyle$适用于$POD_splat_kueijin_plural$。这些[disciplines|E]允许[GetTrait('kueijin').GetName( GetNullCharacter )]通过运转自己的气（或在某些情况下，运转他人的气或环境中的气）来施展神秘的效果。"
 game_concept_soul_arts_lifestyle: "灵功"
 game_concept_soul_arts_lifestyle_desc: "$game_concept_soul_arts_lifestyle$适用于$POD_splat_kueijin_plural$。掌握灵魂[disciplines|E]的人是真正可怕的生物，能够完成极其困难的意志壮举或直接支配其他生物的灵魂。"
 game_concept_demon_arts_lifestyle: "魔功"
 game_concept_demon_arts_lifestyle_desc: "$game_concept_demon_arts_lifestyle$适用于$POD_splat_kueijin_plural$。这些[disciplines|E]起源于心魔，并由心魔提供能量。"
 game_concept_qiao_lifestyle: "窍"
 game_concept_qiao_lifestyle_desc: "$game_concept_qiao_lifestyle$适用于[GetTrait('shih').GetName( GetNullCharacter )]。窍或桥是古老的功法，通过它，狩魔人集中他们的气来完成超人的壮举。"
 game_concept_phobia: "恐惧症"
 game_concept_phobia_desc: "恐惧症是一种[discipline_power|E]，在[combat_phase|E]中当你是[commander|E]时给予[GetModifier('phobia_5_modifier').GetNameWithTooltip]。且你当前的[dread|E]增强。它使人对某些东西产生非理性的恐惧。"
 game_concept_mask_of_empathy: "移情面具"
 game_concept_mask_of_empathy_desc: "同情面具是一种[discipline_power|E]，可以用来结束目标人际关系的[character_interaction|E]。切断人与人之间的情感联系。"
 game_concept_perfect_world: "完美世界"
 game_concept_perfect_world_desc: "完美世界是一种[discipline_power|E]，可以作为个人[character_interaction|E]使用，给你的首都一个增益。它使一个城市的每个人都为你的理想城市而努力。"
 game_concept_hekau_alchemy_lifestyle: "炼金赫考"
 game_concept_hekau_alchemy_lifestyle_desc: "$game_concept_hekau_alchemy_lifestyle$适用于$POD_splat_mummy_plural$。炼金术需要准备工作和奉献精神。炼金术不是简单地从袖子里掏出一个咒语，而是要去制造一个体现他所寻求的效果的产品，或者一个能诱发所需结果的产品。"
 game_concept_tan_lifestyle: "丹"
 game_concept_tan_lifestyle_desc: "$game_concept_tan_lifestyle$适用于[GetTrait('wutian').GetName( GetNullCharacter )]。由龙凤丹术所产生的力量。"
 game_concept_hekau_amulets_lifestyle: "护符赫考"
 game_concept_hekau_amulets_lifestyle_desc: "$game_concept_hekau_amulets_lifestyle$适用于$POD_splat_mummy_plural$。护符，在埃及语中也被称为麦凯特，是集中魔法力量的符咒，最常见的是用于保护人们免受邪恶、疾病或术法的侵害。"
 game_concept_hekau_celestial_lifestyle: "天文赫考"
 game_concept_hekau_celestial_lifestyle_desc: "$game_concept_hekau_celestial_lifestyle$适用于$POD_splat_mummy_plural$。天文赫考是古埃及专注于命运、天气和占星术的魔法技艺。"
 game_concept_hekau_effigy_lifestyle: "俑像赫考"
 game_concept_hekau_effigy_lifestyle_desc: "$game_concept_hekau_effigy_lifestyle$适用于$POD_splat_mummy_plural$。俑像是关于性相联系的赫考技艺，通常用被称为巫沙布提俑的人偶来施展。"
 game_concept_hekau_necromancy_lifestyle: "通灵赫考"
 game_concept_hekau_necromancy_lifestyle_desc: "$game_concept_hekau_necromancy_lifestyle$适用于$POD_splat_mummy_plural$。通灵术是塑造冥界和指挥居住在[underworld|E]的灵魂的赫考技艺。"
 game_concept_hekau_nomenclature_lifestyle: "术言赫考"
 game_concept_hekau_nomenclature_lifestyle_desc: "$game_concept_hekau_nomenclature_lifestyle$适用于$POD_splat_mummy_plural$。术言是利用真名的赫考技艺，在埃及被称为“列涅”，被用做奥秘之事。"
 game_concept_neteru: "奈特鲁"
 game_concept_neteru_desc: "$game_concept_neteru$是聚集在一位重生者身边崇拜它的密教徒。你此世的家族成员会自动成为你的奈特鲁，其他则需要你使用[character_interaction|E]来获得。奈特鲁作为凡人被赐予头衔，也可以持有木乃伊建筑，但只有你是他们的领主时才会建造这些建筑。"
 game_concept_abombwe: "阿本威"
 game_concept_abombwe_desc: "阿本威是种由莱本的阿库南斯传承和黑暗时代神秘的邦萨姆血系掌握的[discipline|E]。阿本威利用吸血鬼与自己的（以及其他人的）心兽的紧密联系并加以控制，将心兽的力量用于各种目的。"
 game_concept_penumbra: "半影界"
 game_concept_penumbra_desc: "半影界，也被称为地球之影，是直接围绕物质世界的[spirit_world|E]。许多，但非所有地形特征在那里都有镜像。"
 game_concept_astral_reaches: "星光界"
 game_concept_astral_reaches_desc: "星光界，也被称为星影界、高影界、或上影界，是思想、观念、概念的界域。"
 game_concept_dark_kingdom: "冥府"
 game_concept_dark_kingdom_desc: "冥府是[underworld|E][tempest|E]中的小块稳定现实区域。诸冥府中的每一个都声称对某一特定地理区域的死灵拥有统治权。"
 game_concept_shard_realm: "碎域"
 game_concept_shard_realm_desc: "在秘学九宗的魔法宇宙学中，太阳系中的行星与诸神、能量、地球现象和魔法领域有关。当然，科学试图剥离这些联系，取而代之的是对冰冷、死寂太空的测量。然而，即便如此，行星之力的壮观景象也无法完全消除人们的好奇心。\n每片碎域都与太阳系中的一颗行星相连，并形成它自己的专属影界。每片碎域都与特定的魔法领域相通，其具有主宰地位。每片碎域也都与对应的[shade_realm|E]相连，据传通向由某一魔法领域主导的平行宇宙。每片碎域都居住着一位强大的天神，并受其统治。"
 game_concept_dreaming: "梦界"
 game_concept_dreaming_desc: "就像度假明信片，当人类开始更相信冷酷的事实（和寒铁），而不是心血来潮和幻想时，世界的神话部分就分出了一个重叠的现实相位，被称为梦界。"
 game_concept_breedgifts_lifestyle: "血种灵赋"
 game_concept_breedgifts_lifestyle_desc: "由自然血种形态产生的力量。"
 game_concept_auspicegifts_lifestyle: "月兆灵赋"
 game_concept_auspicegifts_lifestyle_desc: "由月兆产生的力量。"
 game_concept_einherjar: "英灵战士"
 game_concept_einherjar_desc: "英灵战士是用于称呼北欧$POD_splat_vampire_plural$的术语，在崇高之主吸血鬼奥丁统治时期（大多数英灵战士认为他是只是大祭司，不是奥丁本人，而是奥丁的狂热儿子或学徒），他们坚持正在被基督教和封建主义取代的旧道。\n将这一点与普通维京战士的宿命论混合在一起，就会产生一种受困的心态。英灵战士认为自己是奥丁在米德加尔德的最后一批战士，准备在即将到来的诸神黄昏中战斗。他们所能做的就是为接下来的战斗做好准备，并以英雄的方式死去。\n北欧吸血鬼并不是简单的有氏族的维京人。北欧遗产的特殊性使英灵战士对世界的看法与他们南方的许多表亲相差甚远。宗教、社会和生活方式的差异不仅仅表现在凡人身上，他们的习惯和特征也会延续到永恒。"
 game_concept_Einherjar: "英灵战士"
 game_concept_ghouls: "血仆"
 game_concept_revenant: "遗传血仆"
 game_concept_revenants: "遗传血仆"
 game_concept_Fetter: "羁绊"
 game_concept_Fetters: "羁绊"
 game_concept_Fetter_desc: "羁绊是指将死灵与[shadowlands|E]联系在一起，使保持滞留的人、地或物。除了让死灵维持存在并防止他们陷入[oblivion|E]之外，羁绊也是死灵可以安息并重新再生[Corpus|E]的地方。\n如果羁绊被毁，死灵就失去了与[shadowlands|E]的主要关联，因此他们的存在变得更加不稳定。没有羁绊的死灵能待在[shadowlands|E]的时间并不长，因为他们没有地方充能，也没有任何东西可以将他们与自身的亡生联系起来。"
 game_concept_Corpus: "尸躯"
 game_concept_Corpus_desc: "死灵在[underworld|E]的身体被称为尸躯。它没有复杂的生物系统，而是由一种叫做灵质的材料制成，它大体上是来世的组成原料。"
 game_concept_POD_animals_maa: "动物"
 game_concept_POD_animals_maa_desc: "动物是可以通过各种方式招募的[men_at_arms|E]。\n\n它们受[archers|E]克制。"
 game_concept_POD_legendary_maa: "传奇"
 game_concept_POD_legendary_maa_desc: "传奇[men_at_arms|E]无从定义，每一种都是独一无二的。\n\n它们的独特性质意味着没有任何东西可以可靠地对抗它们，而且它们的属性通常足够强大，以至于对其他[men_at_arms|E]的克制是不必要的。\n\n由于它们的独特性质，没有任何一种地形能让它们普遍变强或变弱。"
 game_concept_POD_demonic_maa: "魔族"
 game_concept_POD_demonic_maa_desc: "魔族[men_at_arms|E]代表着魔邪之力。\n\n因此，它们的种类太多，无法普遍克制任何东西，但它们自己会被那些专门对抗魔邪之力者所克制。\n\n同样，我们也不可能说任何一种地形类型对这些军团都是有利的。"
 game_concept_POD_spirit_maa: "灵类"
 game_concept_POD_spirit_maa_desc: "灵类[men_at_arms|E]是一种无肉体的虚体，起源于并通常居住在影界中——由于这个原因，一些法师称它们为“影族”。\n\n它们的虚体性意味着如果没有特殊手段，它们是不可能被克制的。\n\n它们的虚体状态也意味着灵类通常不会受到地形的不利影响，在冰冻的荒地和在炙热的沙漠中一样自如。"
 game_concept_POD_shapeshifter_maa: "化形者"
 game_concept_POD_shapeshifter_maa_desc: "狼族是由盖亚创造的，作为她的獠牙和爪子，以保护她的安全，但他们并不是她唯一的孩子。她创造了许多其他品种的化形者，并分别赋予他们使命。有些人随着时间的流逝而迷失了方向；有些人则是被狼族逼迫离开他们的职务。有些人转而只为三相的一面服务，而不是为整个盖亚服务。\n\n化形者的种类跟他们的化形对象一样多，所以唯一可靠的对策是了解你所面对的那种超自然的弱点。\n\n与他们克制和被克制的地方相同，化形者的地形适应也有很大差异。"
 game_concept_POD_gargoyle_maa: "石像鬼"
 game_concept_POD_gargoyle_maa_desc: "石像鬼是由血系创造的吸血鬼血系，是他们的仆人。虽然在实际上不是睿魔尔血系，但该血系在很大程度上受他们的控制。\n\n石像鬼的飞行能力给常规部队带来了独特的麻烦，因为打击飞行敌人的训练并不是大多数操练的一部分。\n\n石像鬼能够飞行意味着他们可以避开许多由地形带来的问题，同时还能利用其的优势。"
 game_concept_POD_ghoul_maa: "血仆"
 game_concept_POD_ghoul_maa_desc: "血仆是用来描述当吸血鬼在没有先吸干时凡人时给出一点吸血鬼精血而产生的爪牙，否则将会导致初拥。\n\n血仆不仅包括被赋予吸血鬼精血的普通人类，还包括棘秘魑使用的所谓战争血仆，因此对付某些血仆就像对付普通人类一样容易，其他的，如怪物般的什拉赫塔，则更难。\n\n地形对血仆的影响取决于它们的躯体形态。"
 game_concept_thrall: "魔奴"
 game_concept_thrall_desc: "$game_concept_thralls$是恶魔的凡人仆人。恶魔从野心家、复仇者、残废者和被遗弃者中获取魔奴；那些感到被世界欺骗、被剥夺了应有生活的男人和女人。你对魔奴有花费奥秘技能点的特殊互动。"
 game_concept_shade_realm: "影域"
 game_concept_shade_realm_desc: "影域，也被称作幻域，是一个由单一魔法领域主导的影界界域。每个影域都与阳系中的一颗行星的[shard_realm|E]相连，但在地球的穹界显现——就像一片云彩投射在地面上的阴影。"
 game_concept_abomination: "恶煞"
 game_concept_abomination_desc: "恶煞是一个用来描述被转为吸血鬼的化形者的术语。不用说，这些生物是非常罕见的，因为几乎所有的化兽族裔都对吸血鬼精血剧烈过敏。恶煞同时受到狼族和吸血鬼的忌讳，而且精神上也总是非常不稳定。\n在游戏中，恶煞被视为不能[Embrace|E]的$POD_splat_vampire_plural$，但保留了血种灵赋和月兆灵赋，以及化形能力。"
 game_concept_POD_plasmic_maa: "灵质体"
 game_concept_POD_plasmic_maa_desc: "灵质体或灵质实体是[underworld|E]的“生命体”；具体而言，任何由灵质组成但非死灵或怨灵的独立生物。"
 game_concept_godbodies_lifestyle: "圣体"
 game_concept_godbodies_lifestyle_desc: "$game_concept_shintai_lifestyle$在[fifth_age|E]（1250年后）被[shintai_lifestyle|E]替代，适用于$POD_splat_kueijin_plural$。圣体是现代的神体的前身，是[fourth_age|E]时期[GetTrait('kueijin').GetName( GetNullCharacter )]社会的重要异能。与他们的现代形态相比，圣体与[GetTrait('kueijin').GetName( GetNullCharacter )]之间的元素联系更为明显，更像是原本[wan_xian|E]所挥舞的力量。"
 game_concept_grace: "恩惠"
 game_concept_grace_i: "@grace_icon!"
 game_concept_grace_desc: "该影界实体对你的青睐程度。"
 game_concept_world_of_darkness: "黑暗世界"
 game_concept_WoD: "黑暗世界"
 game_concept_world_of_darkness_desc: "《黑暗世界》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在现实世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。"
 game_concept_Ghoul: "血仆"
 game_concept_Ghoul_desc: "当吸血鬼将自己的血喂给另一个生物后，该生物就将成为血仆，并获得一些好处：停止衰老，有时甚至会稍微变得年轻；有限地获得[disciplines|E]和更快的愈合。然而，血仆依赖于血，因为他们在停止服用时将恢复到他们的真实年龄，这有时会是致命的。通过血缚的控制是侍主管理血仆的主要方式——或者更传统的技巧，如支配术。当然，作为血仆最恶心的部分是，人类成了非人怪物的奴隶，其把人类当作棋子或怡情的小点心。"
 game_concept_Revenant: "遗传血仆"
 game_concept_Revenant_desc: "$POD_splat_revenant$是一种混杂生物，既像又不像$POD_splat_mortal_plural$，[ghouls|E]和$POD_splat_vampire_plural$。有人会说遗传血仆介于凡人和吸血鬼之间；也有人会说它是受该隐诅咒腐化的上帝造物，两者混合在一起，直到它们变得不可分割。尽管如此，遗传血仆具有吸血鬼和凡人的许多特质，也具有普通血仆的许多特征。遗传血仆与血仆不同，能但不需要喝吸血鬼的血，因为他们可以自己产生精血，这也可以延缓他们的衰老。\n与他们的主人不同，遗传血仆是活着的生物。像凡人一样，他们需要进食、睡觉和呼吸。他们能够进行有性繁殖。与凡人不同的是，他们更加坚韧，并能从该隐的印记中获得超自然的力量。"
 game_concept_bind_wraith_interaction: "缚灵互动"
 game_concept_bind_wraith_interaction_desc: "一个允许角色缚灵[GetTrait('wraith').GetName( GetNullCharacter )]以便之后命令其的互动。"
 game_concept_pattern_spheres_lifestyle: "式样领域"
 game_concept_pattern_spheres_lifestyle_desc: "$game_concept_pattern_spheres_lifestyle$适用于$POD_splat_mage_plural$。构成物理世界的领域——力场、生命和物质。"
 game_concept_foundational_spheres_lifestyle: "根基领域"
 game_concept_foundational_spheres_lifestyle_desc: "$game_concept_foundational_spheres_lifestyle$适用于$POD_splat_mage_plural$。构成存在本身的基础的领域——空间、时间和原质。"
 game_concept_spiritual_spheres_lifestyle: "灵性领域"
 game_concept_spiritual_spheres_lifestyle_desc: "$game_concept_spiritual_spheres_lifestyle$适用于$POD_splat_mage_plural$。构成命运、思想和灵魂的国度的领域——精魂、熵和心智。"
 game_concept_reliquarie: "宿匣"
 game_concept_reliquarie_desc: "若该宝物被摧毁，附身于此的[GetTrait('demon').GetName( GetNullCharacter )]将失去[GetTrait('earthbound').GetName( GetNullCharacter )][trait|E]。"
 game_concept_underworld: "冥界"
 game_concept_yin_world: "阴界"
 game_concept_underworld_desc: "冥界，也被称为暗影界或狱界，是亡者与回忆的领域。"
 game_concept_POD_faerie_maa: "妖精"
 game_concept_POD_faerie_maa_desc: "非换生灵经常交替使用仙灵、妖精和精类等术语来指称换生灵和真妖精。"
 game_concept_POD_chimera_maa: "活化奇魅"
 game_concept_POD_chimera_maa_desc: "活化奇魅就是具有生命或生命外观的奇魅。"
 game_concept_dreamer: "梦种"
 game_concept_dreamer_desc: "在戚族中，梦种可以是任何凡人的统称，但更多的是指那些表现出创意火花的凡人，或者没有被板讷磨灭到情感迟钝的程度的人。梦种是戚族的主要梦华来源，因此是一种受保护的资源。"
 game_concept_alternate_techniques_lifestyle: "旁门技艺"
 game_concept_alternate_techniques_lifestyle_desc: "$game_concept_alternate_techniques_lifestyle$适用于$POD_splat_kueijin_plural$。[disciplines|E]的另类技艺。"
 game_concept_command_wraith_interaction: "役使死灵"
 game_concept_command_wraith_interaction_desc: "通过[character_interaction|E]，你可以命令受缚[GetTrait('wraith').GetName(GetNullCharacter)]骚扰其他角色。"
 game_concept_mythic_age: "神话纪元"
 game_concept_mythic_age_desc: "神话纪元从史前时代一直持续到公元前1000年左右，直到铁器时代开始，人类意识到可以通过努力和冷酷的变革来塑造世界。"
 game_concept_sundering: "大散断"
 game_concept_sundering_desc: "大散断大约为公元前1000年到公元1200–1400年，人们开始不再相信妖精，板讷的威压开始增大。"
 game_concept_shattering: "大碎溃"
 game_concept_shattering_desc: "在西班牙宗教裁判所和黑死病肆虐（同时姓氏开始流行）的时期，大散断累积的压力最终爆发，引发了大碎溃（促使大量的[GetTrait('fae').GetName( GetNullCharacter )]逃避回[arcadia|E]或是采取[GetTrait('changeling').GetName( GetNullCharacter )]之道，亦或是隐藏起来。）"
 game_concept_interregnum: "大空位"
 game_concept_interregnum_desc: "公元1400年左右，地球上既没有仙族，也没有真妖精，剩余“掺水”的换生灵在[shattering|E]的最后嘶鸣之后不得不自力更生，这一时期被称为大空位，因为换生灵不得不尝试如何独自生存下来。"
 game_concept_resurgence: "大复还"
 game_concept_resurgence_desc: "在妖精经历了四百多年的黑暗时代后，1969年的登月要么带来了大复还，要么是凡人世界和神话世界之间重新开辟道路的产物。"
 game_concept_primogen: "参议"
 game_concept_primogen_desc: "参议是$POD_splat_vampire_plural$的正式头衔，他们是各自[Clans|E]的代表。他们通常是城市中最年长的氏族成员。一般来说，作为统治者的[princes|E]都很重视参议和他们的意见。参议会被召来咨询决策，就连他们的建议也具有很大的分量。\n\n在游戏中，参议是[kingdom|E][rank|E]及以上的吸血鬼才能担任的[court_positions|E]。没有参议代表的[Clan|E]会感到被边缘化，从而导致对应成员的负面[opinion|E]。\n\n有关如何才算训练有素的参议的提示，请参阅[primogen_aptitude|E]。"
 game_concept_primogen_aptitude: "参议称职度"
 game_concept_primogen_aptitude_desc: "每种[primogen|E][court_position|E]都需求不同的才能：\n\n$EFFECT_LIST_BULLET$[assamite_primogen|E]\n$EFFECT_LIST_BULLET$[brujah_primogen|E]\n$EFFECT_LIST_BULLET$[cappadocian_primogen|E]\n$EFFECT_LIST_BULLET$[gangrel_primogen|E]\n$EFFECT_LIST_BULLET$[gargoyle_primogen|E]\n$EFFECT_LIST_BULLET$[lasombra_primogen|E]\n$EFFECT_LIST_BULLET$[malkavian_primogen|E]\n$EFFECT_LIST_BULLET$[nosferatu_primogen|E]\n$EFFECT_LIST_BULLET$[ravnos_primogen|E]\n$EFFECT_LIST_BULLET$[salubri_primogen|E]\n$EFFECT_LIST_BULLET$[setite_primogen|E]\n$EFFECT_LIST_BULLET$[toreador_primogen|E]\n$EFFECT_LIST_BULLET$[tremere_primogen|E]\n$EFFECT_LIST_BULLET$[tzimisce_primogen|E]\n$EFFECT_LIST_BULLET$[ventrue_primogen|E]"
 game_concept_brujah_primogen: "$brujah_primogen_court_position$"
 game_concept_brujah_primogen_desc: "[GetTrait('brujah').GetName(GetNullCharacter)][primogen|E]需要良好的[martial|E]、[learning|E]，[prowess|E]能力。\n\n是[GetTrait('scholar').GetName(GetNullCharacter)]、[GetTrait('strategist').GetName(GetNullCharacter)]会增强工作表现。\n\n是[GetTrait('wrathful').GetName(GetNullCharacter)]不利工作表现。"
 game_concept_cappadocian_primogen: "$cappadocian_primogen_court_position$"
 game_concept_cappadocian_primogen_desc: "[GetTrait('cappadocian').GetName(GetNullCharacter)][primogen|E]需要良好的[learning|E]、[stewardship|E]能力。\n\n是[GetTrait('patient').GetName(GetNullCharacter)]、[GetTrait('scholar').GetName(GetNullCharacter)]、#TOOLTIP:GAME_TRAIT,lifestyle_physician,[GetNullCharacter] #L 医师#!#!、[GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L 神秘主义者#!#!稍微增强工作表现。"
 game_concept_lasombra_primogen: "$lasombra_primogen_court_position$"
 game_concept_lasombra_primogen_desc: "[GetTrait('lasombra').GetName(GetNullCharacter)][primogen|E]需要良好的[intrigue|E]、[stewardship|E]，[diplomacy|E]能力。\n\n是[GetTrait('arrogant').GetName(GetNullCharacter)]、[GetTrait('ambitious').GetName(GetNullCharacter)]、[GetTrait('zealous').GetName(GetNullCharacter)]、[GetTrait('schemer').GetName(GetNullCharacter)]会增強工作表现。"
 game_concept_toreador_primogen: "$toreador_primogen_court_position$"
 game_concept_toreador_primogen_desc: "[GetTrait('toreador').GetName(GetNullCharacter)][primogen|E]需要良好的[diplomacy|E]、[intrigue|E]能力。\n\n是[GetTrait('gregarious').GetName(GetNullCharacter)]、[GetTrait('poet').GetName(GetNullCharacter)]会增強工作表现。\n\n如果角色[culture|E]拥有增强[GetTrait('poet').GetName(GetNullCharacter)][trait|E]的[tradition|E]，像是[GetCultureTradition('tradition_chanson_de_geste').GetName]、或是增强#TOOLTIP:COURT_POSITION_TYPE,court_poet_court_position #L 宫廷诗人#!#!，像是[GetCultureTradition('tradition_poetry').GetName]也会增强工作表现。"
 game_concept_tzimisce_primogen: "$tzimisce_primogen_court_position$"
 game_concept_tzimisce_primogen_desc: "[GetTrait('tzimisce').GetName(GetNullCharacter)][primogen|E]需要良好的[learning|E]、[stewardship|E]，[intrigue|E]能力。\n\n是[GetTrait('sadistic').GetName(GetNullCharacter)]、[GetTrait('diligent').GetName(GetNullCharacter)]，[GetTrait('torturer').GetName(GetNullCharacter)]会增強工作表现。\n\n#help 如果你是[GetTrait('tremere').GetName(GetNullCharacter)]，就不能雇用此宫廷职位。#!"
 game_concept_ventrue_primogen: "$ventrue_primogen_court_position$"
 game_concept_ventrue_primogen_desc: "[GetTrait('ventrue').GetName(GetNullCharacter)][primogen|E]需要良好的[stewardship|E]、[diplomacy|E]，[martial|E]能力。\n\n是[GetTrait('ambitious').GetName(GetNullCharacter)]会增強工作表现。\n\n统治[kingdom|E]的梵卓参议[aptitude|E]会得到极大的增强。"
 game_concept_assamite_primogen: "$assamite_primogen_court_position$"
 game_concept_assamite_primogen_desc: "[GetTrait('assamite').GetName(GetNullCharacter)][primogen|E]需要良好的[diplomacy|E]、[martial|E]、[learning|E]，[prowess|E]能力。\n\n是[GetTrait('diligent').GetName(GetNullCharacter)]会增强工作表现。\n\n#help 只有身为信仰阿什拉派的[GetTrait('assamite').GetName(GetNullCharacter)]，或是首都处于[GetGeographicalRegion('world_middle_east').GetName]，才能雇用此宫廷职位。#!"
 game_concept_gangrel_primogen: "$gangrel_primogen_court_position$"
 game_concept_gangrel_primogen_desc: "[GetTrait('gangrel').GetName(GetNullCharacter)][primogen|E]需要良好的[prowess|E]能力。\n\n是[GetTrait('brave').GetName(GetNullCharacter)]、[GetTrait('wrathful').GetName(GetNullCharacter)]，[GetTrait('shieldmaiden').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L 剑术大师#!#!稍微增强工作表现。"
 game_concept_malkavian_primogen: "$malkavian_primogen_court_position$"
 game_concept_malkavian_primogen_desc: "[GetTrait('malkavian').GetName(GetNullCharacter)][primogen|E]需要良好的[diplomacy|E]、[learning|E]能力。\n\n有[GetTrait('auspexadvanced').GetName(GetNullCharacter)]，或是[GetTrait('gregarious').GetName(GetNullCharacter)]、[GetTrait('honest').GetName(GetNullCharacter)]，[GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L 神秘主义者#!#!会根据等级增强工作表现。"
 game_concept_nosferatu_primogen: "$nosferatu_primogen_court_position$"
 game_concept_nosferatu_primogen_desc: "[GetTrait('nosferatu').GetName(GetNullCharacter)][primogen|E]需要良好的[intrigue|E]、[diplomacy|E]，[stewardship|E]能力。\n\n有[GetTrait('obfuscateadvanced').GetName(GetNullCharacter)]，或是[GetTrait('schemer').GetName(GetNullCharacter)]、[GetTrait('deceitful').GetName(GetNullCharacter)]，[GetTrait('patient').GetName(GetNullCharacter)]会增強工作表现。\n\n是[GetTrait('honest').GetName(GetNullCharacter)]不利工作表现。"
 game_concept_ravnos_primogen: "$ravnos_primogen_court_position$"
 game_concept_ravnos_primogen_desc: "[GetTrait('ravnos').GetName(GetNullCharacter)][primogen|E]需要良好的[intrigue|E]、[martial|E]、[stewardship|E]，[learning|E]能力。\n\n是[GetTrait('gregarious').GetName(GetNullCharacter)]、[GetTrait('zealous').GetName(GetNullCharacter)]会增強工作表现。\n\n#help 身为[GetTrait('ravnos').GetName(GetNullCharacter)]，或是首都处于[GetGeographicalRegion('world_india').GetName]，才能雇用此宫廷职位。#!"
 game_concept_setite_primogen: "$setite_primogen_court_position$"
 game_concept_setite_primogen_desc: "[GetTrait('setite').GetName(GetNullCharacter)][primogen|E]需要良好的[intrigue|E]、[diplomacy|E]，[learning|E]能力。\n\n是[GetTrait('deceitful').GetName(GetNullCharacter)]、[GetTrait('gregarious').GetName(GetNullCharacter)]，[GetTrait('zealous').GetName(GetNullCharacter)]会增強工作表现。\n\n#help 身为[GetTrait('setite').GetName(GetNullCharacter)]，或具有[GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName]或[GetFaithDoctrine('special_doctrine_set_corrupted_kindred').GetBaseName][doctrine|E]的[faith|E]才能雇用此宫廷职位。#!"
 game_concept_tremere_primogen: "$tremere_primogen_court_position$"
 game_concept_tremere_primogen_desc: "[GetTrait('tremere').GetName(GetNullCharacter)][primogen|E]需要良好的[intrigue|E]、[learning|E]能力。\n\n是[GetTrait('patient').GetName(GetNullCharacter)]、[GetTrait('scholar').GetName(GetNullCharacter)]，[GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L 神秘主义者#!#!稍微增强工作表现。\n\n#help 如果你是[GetTrait('tzimisce').GetName(GetNullCharacter)]、[GetTrait('salubri').GetName(GetNullCharacter)]、信仰阿什拉派的[GetTrait('assamite').GetName(GetNullCharacter)]，或是首都处于[GetGeographicalRegion('world_middle_east').GetName]，就不能雇用此宫廷职位。#!"
 game_concept_salubri_primogen: "$salubri_primogen_court_position$"
 game_concept_salubri_primogen_desc: "[GetTrait('salubri').GetName(GetNullCharacter)][primogen|E]需要良好的[prowess|E]、[learning|E]能力。\n\n是[GetTrait('vengeful').GetName(GetNullCharacter)]、[GetTrait('scholar').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L 刀剑大师#!#!会增强工作表现。\n\n#help 身为[GetTrait('salubri').GetName(GetNullCharacter)]才能雇用此宫廷职位。#!"
 game_concept_grand_city: "大城邦"
 game_concept_grand_cities: "大城邦"
 game_concept_grand_city_desc: "大城邦是大型人口中心，对凡俗和超自然世界都有强大影响力。\n\n每个大城邦都有一套独特的机制。在你升级[buildings|E]前你会需要完成特定的要求。\n\n目前，唯二的大城邦是：\n$BULLET_WITH_TAB$[eternal_rome|E]\n$BULLET_WITH_TAB$[grand_city_of_constantinople|E]\n\n#X 你只能拥有#V;bold 1#!座大城邦地产，除非你修改游戏规则。#!"
 game_concept_eternal_rome: "永恒罗马"
 game_concept_st_peters_city: "圣伯多禄之城"
 game_concept_roma_aeterna: "罗马永恒"
 game_concept_eternal_rome_desc: "罗马[grand_city|E]有着悠远著名的历史。该城有三种版本：\n\n当[GetTrait('vampire').GetName(GetNullCharacter)]控制时，该城名唤#bold 罗马永恒#!。它的十三个历史区域被[Clans|E]分治。你会需要雇用能力高超的[primogen|E]来升级区域。在等级三时，每个区域都将为你的角色解锁#P 新能力#!。\n\n当暗影裁判所的[GetTrait('supehunter').GetName(GetNullCharacter)]控制时，该城名唤#bold 圣伯多禄之城#!。猎人能定居在圣弥额尔的修道院，将其作为裁判所总部。帮助其他裁判所修会能为该建筑解锁强大的升级路线。\n\n当其他势力控制时，该城名唤#bold 永恒罗马#!。具有特定[traits|E]的角色或是技艺精湛的廷臣任职[court_positions|E]可以复原该城的历史地标。\n\n#help $POD_splat_werewolf_plural$无法利用该城。一旦征服罗马，就会自动转变成部落地产。#!"
 game_concept_propaganda: "宣传"
 game_concept_propaganda_interaction: "宣传互动"
 game_concept_propaganda_desc: "一项[character_interaction|E]，可通过以下方式解锁：\n\n$BULLET_WITH_TAB$是拥有第三级的[roma_aeterna|E]的#TOOLTIP:BUILDING,rome_setite_03 #L 赛特之子区#!#!的#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!\n$BULLET_WITH_TAB$是拥有第二级的[eternal_rome|E]的#TOOLTIP:BUILDING,rome_pasquino_02 #L 帕斯魁诺#!#!的角色\n\n它允许你耗费[prestige|E]来移除你的罪恶特质。\n\n#I 对自己角色右键点击以使用。#!"
 game_concept_assassination: "暗杀"
 game_concept_assassination_interaction: "暗杀互动"
 game_concept_assassination_desc: "拥有[roma_aeterna|E]的第三级的#TOOLTIP:BUILDING,rome_assamite_03 #L 哈基姆圣裔区#!#!的[GetTrait('assamite').GetName(GetNullCharacter)]可使用的[character_interaction|E]。\n\n它允许你花费[prestige|E]和[stress|E]来瞬间完成你的[GetScheme('murder').GetTypeName()][schemes|E]。\n\n#I 对自己角色右键点击以使用。#!"
 game_concept_unburden: "解除负担"
 game_concept_unburden_interaction: "解除负担互动"
 game_concept_unburden_desc: "拥有[roma_aeterna|E]的第三级的#TOOLTIP:BUILDING,rome_salubri_03 #L 萨洛比区#!#!的[GetTrait('salubri').GetName(GetNullCharacter)]可使用的[character_interaction|E]。\n\n它允许你花费[piety|E]来改变你的压力应对特质。\n\n#I 对自己角色右键点击以使用。#!"
 game_concept_splat: "种族"
 game_concept_splat_desc: "种族用来指你是哪种类型的超自然生物。在[princes_of_darkness|E]中，你的种族用[trait|E]表示。\n\n在#bold 黑暗时代：吸血鬼#!剧本中，只有以下种族：\n$EFFECT_LIST_BULLET$$POD_splat_vampire$\n$EFFECT_LIST_BULLET$$POD_splat_ghoul$\n$EFFECT_LIST_BULLET$$POD_splat_revenant$\n$EFFECT_LIST_BULLET$$POD_splat_kueijin$\n#X 注意，第一个剧本中不存在其他种族！这意味着无法与它们互动（例如，崇魔者无法与恶魔互动，因为地图上没有恶魔）#!\n\n在#bold 猎人与猎物#!剧本中，有以下种族：\n$EFFECT_LIST_BULLET$#italic 所有之前提到的种族，外加：#!\n$EFFECT_LIST_BULLET$$POD_splat_hunter$\n$EFFECT_LIST_BULLET$$POD_splat_mummy$\n$EFFECT_LIST_BULLET$$POD_splat_werewolf$\n$EFFECT_LIST_BULLET$$POD_splat_demon$\n\n在#bold 黑暗时代：妖精#!剧本中，有以下种族：\n$EFFECT_LIST_BULLET$#italic 所有之前提到的种族，外加：#!\n$EFFECT_LIST_BULLET$$POD_splat_fae$\n$EFFECT_LIST_BULLET$$POD_splat_changeling$"
 game_concept_battle_modifier: "战斗修正"
 game_concept_battle_modifier_desc: "战斗修正只在与施术者的战斗结束后自动消除。"
 game_concept_first_age: "第一纪元"
 game_concept_first_age_desc: "中原的各种超自然文化对这一时代有着不同的称呼。对于[GetTrait('kueijin').GetName( GetNullCharacter )]来说，它是万物轮回的第一纪元或极乐纪元。对于变化妖怪来说，这是破晓纪元。在#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!看来，它是时间之前的状态，通过盘古或梵等人类神话来解释。妖仙称之完美纪元。第一纪元一般被认为是创世之前的时期。它标志着阴阳尚未分离的时代，万物与玉皇大帝（或盖亚）合而为一。它被认为是一个终极和谐的时期，是万物相互联系的一。"
 game_concept_second_age: "第二纪元"
 game_concept_second_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]和妖仙将其称为万物轮回的第二个时代或华美纪元，当时中原和灵廷还很接近。变化妖怪则称其为万物纪元，在这一时代，三元、三相得以诞生，并形成了今天所熟知的生命。同样，#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!也提到了形而上学三位一体的创世，即三尊监督五行的形成，而五行的形成又为万物让路。"
 game_concept_third_age: "第三纪元"
 game_concept_third_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]、妖仙和变化妖怪将第三纪元称为万物轮回的第三纪，即传奇纪元。这是神话传说中的中原史前时代，[wan_xian|E]作为仁慈的主人行走在人类中间并统治着人类。也是在这个时代，那些忠于玉皇大帝的鬼神在摇摇欲坠的休战协议下与[yomi|E]生物作战。对于#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!来说，这是人类觉醒于上天的安排并第一次学会使用魔法的时代。\n第三纪元因阎魔的阴谋而终结，阎魔腐化[wan_xian|E]，使其以气为食。这也标志着神话传统的终结和人类今天所理解的历史的开始。"
 game_concept_fourth_age: "第四纪元"
 game_concept_fourth_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]和妖仙将这个纪元称为万物轮回的第四纪元或凄美纪元。它标志着[GetTrait('kueijin').GetName( GetNullCharacter )]承受诅咒，从天兵转变为源自[yomi|E]魔物的开端。对于小神来说，这是他们因参与[wan_xian|E]叛乱而被玉皇大帝治罪流放出天庭的开始。变化妖怪称之试炼纪元，在那纪元，阴险的[wan_xian|E]让化兽族裔自相残杀，这场战争被称为耻辱之战。据#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!所记，在这一时期出现了各种不同派别的行愿者，他们经常发生冲突，如喜马拉雅之战或龙河之战。在这些冲突中，出现了神射手羿和他的追随者，他们建立了一个后来称为[GetTrait('shih').GetName( GetNullCharacter )]的组织，专门狩猎妖邪鬼神。"
 game_concept_fifth_age: "第五纪元"
 game_concept_fifth_age_desc: "对[GetTrait('kueijin').GetName( GetNullCharacter )]来说，当前的时代是万物轮回的第五纪元或黑暗纪元。#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!说目前的世界是由“石人 ”主宰的，他们从遥远的地方来到这里，将中原置于他们的控制之下。变化妖怪称之为暗影纪元。妖仙则称其为灾难纪元，在这一纪元，鬼神必须证明自己配得上天庭，否则就会在魔皇掌权之后被毁灭。几乎所有的鬼神都认为，第五纪元的导火索是西方人入侵中原。"
 game_concept_sixth_age: "第六纪元"
 game_concept_sixth_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]称即将到来的纪元为万物轮回的第六纪元，也被称为哀伤纪元。它是轮回的低谷，玉皇大帝从他的宝座上走下来，阎魔中的一位将飞升为魔帝。然而，大多数[GetTrait('kueijin').GetName( GetNullCharacter )]认为哀伤纪元是存在的必要组成部分。同样，变化妖怪会认为即将到来的哀伤纪元将是他们最大的挑战。他们的敌人——阎魔试图用自己定住轮回，让它永远被困在第六纪元，而大百足则试图消灭轮回。因此，玉母的孩子们的职责就是保护轮回，不让它受到任何企图破坏它的人的伤害。同样，#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!也相信轮回很快就会再次转动，但他们对轮回将如何影响他们却意见不一。妖仙则提出是欢乐纪元，届时世界之间的绝壁将被打破，他们将重返家园。还有一些人听信了其他鬼神的故事，暗自担心这是否真的像听起来那么美好。"
 game_concept_splats: "种族"
 game_concept_journey: "旅程"
 game_concept_journeys: "旅程"
 game_concept_journey_desc: "#bold 旅程#!是角色可以独自或与[coterie|E]一起进行的长期任务。\n\n大多数旅程都有[planning_phase|E]和[travel_phase|E]。\n\n同一时间只能有一个旅程处于活动状态。与[schemes|E]不同，旅程可以暂停，并在以后重新开始。\n\n#help 要开始新的旅程，请点击屏幕右侧的 #bold $POD_journeys_hud$#!按钮，或右键单击其他角色，通过[character_interaction|E]开始旅程。#!"
 game_concept_planning_phase: "规划阶段"
 game_concept_planning_phase_desc: "[journey|E]的#bold 规划阶段#!象征着你的角色正在收集信息、派出斥候，并为未来的旅程做好准备。\n\n规划阶段的持续时间取决于[planning_speed|E]。根据[journey|E]的不同，可能会有方法让它变得更快。有些旅程有#V 立即#![planning_speed|E]，在该情况下，规划阶段会被跳过。\n\n规划阶段结束后，[journey|E]将进入[travel_phase|E]。"
 game_concept_planning_speed: "规划速度"
 game_concept_planning_speed_desc: "与[schemes|E]不同，[journey|E]的[planning_phase|E]的每月进度是固定的，不涉及概率。\n\n#help 规划速度数值的弹框提示会给出如何进一步提高该数值的帮助！#!"
 game_concept_travel_phase: "旅行阶段"
 game_concept_travel_phase_desc: "在[journey|E]的[planning_phase|E]完成后，你的角色会得知世界上有一个[location|E]可以进行历险。你可以立即[travel|E]到那里，或者暂停[journey|E]，稍后再过去。\n\n您可以邀请你的[coterie|E]成员与你一起旅行。\n\n#help 在旅行阶段，你不能开始新的[journeys|E]，也不能邀请新成员加入你的[coterie|E]。#!"
 game_concept_coterie: "圈子"
 game_concept_coterie_sabbat: "战群"
 game_concept_coterie_tmr: "支柱"
 game_concept_coterie_werewolf: "战群"
 game_concept_coterie_hunter: "猎群"
 game_concept_coterie_demon: "共谋"
 game_concept_coterie_mage: "结社"
 game_concept_coterie_fae: "誓团"
 game_concept_coterie_wraith: "环会"
 game_concept_coterie_kueijin: "屋室"
 game_concept_coterie_mummy: "盟社"
 game_concept_coterie_generic: "团队"
 game_concept_coterie_harem: "后宫"
 game_concept_coterie_desc: "#bold 圈子#!是指一群一起进行[journeys|E]的个体。“圈子”是$POD_splat_vampire_plural$使用的术语——其他[splat|E]可能有不同的名称。\n\n当你在进行[journey|E]时，[skills|E]会在圈子成员之间共享。例如，如果在[journey|E]中遇到需要[diplomacy|E]的情况，它只会考虑你的外交能力最强的圈子成员的[diplomacy_skill|E]。\n\n#help 要查看你的圈子，请点击屏幕右侧的#bold $POD_journeys_hud$#!按钮，然后选择第二个选项卡。#!"
 game_concept_inner_circle: "内环"
 game_concept_inner_circle_desc: "内环是秘盟的组织议会。人们对内环几乎一无所知，内环成员的身份也极力保密。内环的公众形象是巡行裁决官和他们的辅政官助手。内环成员选举巡行裁决官，并制定秘盟法律的原则。"
 game_concept_justicar: "巡行裁决官"
 game_concept_justicar_desc: "巡行裁决官是秘盟政府中最强大地可见组成部分，他们负责大规模裁决诫律，并充当内环的耳目和助手。秘盟的每个氏族都有一位巡行裁决官，每个都有几位精挑细选的辅政官作为他们在世界各地的间谍、打手和代表。"
 game_concept_archon: "辅政官"
 game_concept_archon_desc: "辅政官是秘盟任一巡行裁决官的公认代理人。如果说巡行裁决官是内环的双手，那么辅政官就是手指。"
 game_concept_ventrue_clan_curse: "梵卓氏族诅咒"
 game_concept_feeding_restrictions: "吸食限制"
 game_concept_ventrue_clan_curse_desc: "[GetTrait('ventrue').GetName(GetNullCharacter)][Clan|E]的所有后裔都有吸食限制，使他们除了特定范畴的凡人之外，无法进食#bold 任何#!人。\n\n在[princes_of_darkness|E]中，[GetTrait('ventrue').GetName(GetNullCharacter)]可以在游戏开始时选择自己喜欢的猎物。以任何其他类型的凡人为食都不会满足你的[hunger|E]，也不会从他们的[resonance|E]中获得[lifestyle_experience|E]。\n\n以其他$POD_splat_vampire_plural$为食则不受这限制。"
 game_concept_blood_hunt: "血猎"
 game_concept_anathema: "咒逐"
 game_concept_blood_hunt_desc: "当[GetTrait('vampire').GetName(GetNullCharacter)]对[masquerade|E]的保障做出严重冒犯时，秘盟可能会宣布其为[GetTrait('anathema').GetName(GetNullCharacter)]，并对其发起血猎。\n\n在[princes_of_darkness|E]中，[GetTrait('anathema').GetName(GetNullCharacter)]由[trait|E]表示。秘盟成员可以针对[GetTrait('anathema').GetName(GetNullCharacter)]使用血猎[casus_belli|E]，囚禁目标领地中的所有[rulers|E]。"
 game_concept_patron_council: "守护者议会"
 game_concept_patron_council_desc: "守护者议会（更常被称为“守护者们”）是一个由传统派妖精组成的松散联盟。在这里，“传统派”指的是四季之战之前的历史时期，当时每个王廷都在规定的时间内统治着世界。当领导王廷的任期结束时，他们会将权力交接给下一个王廷。"
 game_concept_Sires: "尊长"
 game_concept_Revenants: "遗传血仆"
 game_concept_thralls: "魔奴"
 game_concept_abominations: "恶煞"
 game_concept_elder_perks: "长者技能"
 game_concept_golconda: "浩恩永生"
 game_concept_enlightenment: "启蒙"
 game_concept_enlightened: "开明"
 game_concept_golconda_desc: "#bold 浩恩永生#!是一种神秘地开悟状态，在这种状态下，$POD_splat_vampire$不再受制于[the_beast|E]。\n\n在[princes_of_darkness|E]中，[GetTrait('golconda').GetName(GetNullCharacter)]是一种[trait|E]。极少数人一开始就拥有这种特性，其他人只有经过漫长的[journey|E]才能获得这特质。\n\n#X 由于浩恩永生与你的人性息息相关，如果你犯下谋杀或盗窃，又或者陷入血狂，你将失去该旅程的所有进展。#!"
 game_concept_hungerless: "不受饥渴"
 game_concept_hungerless_desc: "不受饥渴的$POD_splat_vampire$已经完全超越了对血的需求。可以免费使用[disciplines|E]和其他需要消耗血液的能力。\n\n不过，这也意味着他们无法再从掠食中获得[resonance|E]经验。"
 game_concept_commongifts_lifestyle: "通常灵赋"
 game_concept_commongifts_lifestyle_desc: "由化形种族产生的力量。"
 game_concept_bastettribegifts_lifestyle: "部族灵赋"
 game_concept_bastettribegifts_lifestyle_desc: "部族灵赋乃是来自部族守护灵的赠礼。"
 game_concept_hengeyokaigifts_lifestyle: "兽妖灵赋"
 game_concept_hengeyokaigifts_lifestyle_desc: "兽妖灵赋乃是由兽庭所教导的灵赋。"
 game_concept_gurahlauspicegifts_lifestyle: "月兆灵赋"
 game_concept_gurahlauspicegifts_lifestyle_desc: "由月兆产生的力量。"
 game_concept_mokoleauspicegifts_lifestyle: "日兆灵赋"
 game_concept_mokoleauspicegifts_lifestyle_desc: "由日兆产生的力量。"
 game_concept_rokeaauspicegifts_lifestyle: "海兆灵赋"
 game_concept_rokeaauspicegifts_lifestyle_desc: "由海兆产生的力量。"
 game_concept_pathgifts_lifestyle: "道途灵赋"
 game_concept_pathgifts_lifestyle_desc: "由道途产生的力量。"
 game_concept_coterie_beastcourts: "战队"
 game_concept_coterie_redcap: "匪帮"
 game_concept_coterie_nagah: "蛇巢"
 game_concept_coterie_kitsune: "战队"
 game_concept_coterie_ratkin: "鼠群"
 game_concept_nagahauspicegifts_lifestyle: "季兆灵赋"
 game_concept_nagahauspicegifts_lifestyle_desc: "由季兆产生的力量。"
 game_concept_aspectgifts_lifestyle: "倾向灵赋"
 game_concept_aspectgifts_lifestyle_desc: "由倾向产生的力量。"
 game_concept_golconda_planning_speed: "浩恩永生规划速度"
 game_concept_golconda_planning_speed_desc: "提高[golconda|E][journey|E][planning_speed|E]的最好方法就是凡人[GetCourtPositionType('touchstones_court_position').GetName()]。他们是由#TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_enlightenment_virtues_conscience_and_selfcontrol #L 良知#!#![faiths|E]解锁的[court_position|E]，你可以通过与他们建立良好的[relation|E]（比如[friend|E]或[lover|E]）来提高他们的[aptitude|E]。\n\n其他提高速度的方法：\n$EFFECT_LIST_BULLET$在你的[coterie|E]中拥有其他具有[GetTrait('golconda').GetName(GetNullCharacter)]或[GetTrait('golconda_seeker').GetName(GetNullCharacter)][traits|E]的角色。\n$EFFECT_LIST_BULLET$成为[GetTrait('confider').GetName(GetNullCharacter)]、[GetTrait('journaller').GetName(GetNullCharacter)]或[GetTrait('reclusive').GetName(GetNullCharacter)]。\n$EFFECT_LIST_BULLET$拥有记录浩恩永生知识的[artifact|E]。"
 game_concept_coterie_anarch: "团伙"
 game_concept_coterie_baali: "会众"
 game_concept_coterie_baali_hyron: "巢众"
 game_concept_umbra: "影界"
 game_concept_umbra_desc: "影界，又称灵界，是物质世界的灵性镜像。它分为许多子界，每个子界都有自己的奇妙和危险。\n只有少数实体可以穿越这个空间，有些界域只对特定类型的个人（或拥有适当能力的人）开放。\n在游戏中，影界 是有能力者可以探索的右侧面板。"
 game_concept_masquerade_exposure: "曝露度"
 game_concept_masquerade_i: "@masquerade_icon!"
 game_concept_masquerade_exposure_with_icon: "@masquerade_icon!曝露度"
 game_concept_hunger_i: "@blood_icon!"
 game_concept_hunger_with_icon: "@blood_icon!饥渴"
 game_concept_tao_te_hsien: "道德仙道"
 game_concept_tao_te_hsien_desc: "它不是老子的道，尽管受到其启发。它的重点是让神魔明白自从绝壁的出现以来他或她在宇宙中的位置。与人类的哲学不同，它有一个目标……给予妖仙突破绝壁、进入[spirit_worlds|E]的力量。\n它与道家的许多特点相似。求道者倾向于远离世俗的纷扰，在自然中寻求宁静的生活。他们热爱学习本身，但对政治关心甚少。有些是科学家，有些是神职人员，有些是乞丐，有些是战士。日本的妖仙将其改编为一种更像禅宗的哲学，称为“妖仙道”。与一些凡人的宗教不同，道德仙道欢迎变化和个人主义，只要不变成自我膨胀。它是宁静、神秘而深邃的。\n它有五个阶段，大致对应着道家的创世传说，但顺序相反。对于道家来说，首先有无我。从无我中产生了无极。这孕育了混沌。在混沌中心，有一个静止的点，起初只是一个微粒，后来变成了太极，从这里产生了太易，分为两个阶段：太初，太始。所有这些最终导致了[first_age|E]的创世：太素。\n为什么阶段相反呢？因为这些阶段代表了回归无极的挣扎；打破限制神魔前往[spirit_worlds|E]的束缚。回到无极有许多途径，但最可靠的是道德仙道。有传言说亵神有他们自己的内丹之道，叫做魔道；这是在[third_age|E]由一位阎魔所建立的道。"
 game_concept_cantrip: "魔咒"
 game_concept_cantrips: "魔咒"
 game_concept_fae_realm: "术域"
 game_concept_cantrip_desc: "魔咒是$POD_splat_fae$的法术。它们由两个组成部分构成：#bold 术艺#!和#bold 术域#!。\n\n术艺确定了魔咒的效果。角色可以通过进行一次#italic 学习新能力#!的[journey|E]来学习新的术艺，然后在相对的术艺[lifestyles|E]中解锁[perks|E]。\n\n术域确定了可以被魔咒影响的对象。一位不受训的$POD_splat_fae$只能用他们的魔法影响非常特定的角色，而精通了术域的人可以给世界上的任何人施加魔咒。\n\n有六大术域：\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L;bold 角色术域#!#!可以让你对陌生的目标施放魔咒。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_fae,[GetNullCharacter] #L;bold 妖精术域#!#!可以让你对更强大的[splats|E]施放魔咒。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L;bold 道具术域#!#!可以让你对更稀有的[artifacts|E]施放魔咒。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L;bold 自然术域#!#!可以让你影响自然现象。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_scene,[GetNullCharacter] #L;bold 场景术域#!#!决定了魔咒的距离和范围。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_time,[GetNullCharacter] #L;bold 时间术域#!#!决定了魔咒的持续时间和冷却时间。\n\n所有带有仙灵血统的角色都可以在[realm_lifestyle|E][lifestyle|E]中解锁[perks|E]，但要完全掌握一个术域需要进行一次[journey|E]。"
 game_concept_oneiric_realm: "梦呓界域"
 game_concept_oneiric_realms: "梦呓界域"
 game_concept_oneiric_realm_desc: "在那洪流般的回音中，即[deep_dreaming|E]中，十一个水晶般的俄尼里伊界域旋转着，回荡着梦境的元素。其中一个界域曾被称为[arcadia|E]；如今，它对外封闭，任何离开的人都无法再返回。至于其他的梦呓界域，如摩罗斯和赫墨拉，埃忒耳和卡尔，修普诺斯和[Concept('kingdom_of_dan','Dán')|E]，卡里斯和摩墨斯，狄刻和普罗透斯，人们对它们知之甚少。很少有人进入过它们，也没有人以与来时相同的方式离开。\n\n在这些所谓的“较小”梦呓界域之外（无人能说它们是否真的比阿卡迪亚更辉煌），只有黑夜和寂静，总数达到13。旅行者们报告了一个奇特的现象：在寂静之外，即[dreaming|E]的最深处，世界展现出自身，黑暗转化为奇迹。"
 game_concept_hearts_realm: "心之界域"
 game_concept_hearts_realms: "心之界域"
 game_concept_hearts_realm_desc: "在[dreaming|E]的深处，悬浮在[far_dreaming|E]和最深国度之间，存在着一些领域，它们讲述着以人类心灵为模样的故事。比[dreaming|E]中其他普通界域更强大、更亲密的这些“心之界域”，吸引了许多阿卡迪亚之梦的逃亡碎片，并且现在常常被满怀希望的旅行者误认为是阿卡迪亚本身。然而，这样的结论过于乐观，实际并非如此。"
 game_concept_home_realm: "梦乡"
 game_concept_home_realms: "梦乡"
 game_concept_home_realm_desc: "整体界域，在当时比现在要小一些，是每个人对完美世界的理念的交织。边界地区的土地就像是一个巨人拙劣的拼图初试。地貌交错地相互咬合和突出，呈现出锯齿状的块状和区域。嵌入其中的奇魅动物和建筑物都显得模糊而颤动，原始的梦幻物质在空气中电流般噼啪作响。就在他们观察的同时，一些奇魅渐渐消失得无影无踪。他们必须做出决定：是继续留下来打造这个领域，看看是否能从当前位置到达[arcadia|E]，还是返回凡俗世界，有可能再次尝试？所有人都认为他们离阿卡迪亚太远，甚至无法尝试去接近。一些人认为这个新界域是浪费时间，而大部分人则留下来试图使其更加稳定。少数人在[dreaming|E]中徘徊，并再也没有音讯。"
 game_concept_nightmare_realm: "噩梦界域"
 game_concept_nightmare_realms: "噩梦界域"
 game_concept_nightmare_realm_desc: "噩梦界域是[dreaming|E]中噩梦栖息的地方。在梦变的推动下，这些地方会侵占[dream_realms|E]。这里的威胁比[dreaming|E]的许多其他地方更为严重。"
 game_concept_dream_realm: "美梦界域"
 game_concept_dream_realms: "美梦界域"
 game_concept_dream_realm_desc: "美梦界域是[dreaming|E]的一部分，在这里，危险与奇妙并存。与[nightmare_realm|E]相对。"
 game_concept_stable_point: "稳定点"
 game_concept_stable_points: "稳定点"
 game_concept_stable_point_desc: "稳定点是[dreaming|E]中基本不受梦变影响的地方。"
 game_concept_dan: "大梦"
 game_concept_dan_desc: "在戚族的古语中，大梦即命运；一个人的宿命和因果报应。大梦不喜欢别人对它的纽线进行干涉，那些经常通过真言等术艺手段过度操控它的人往往发现自己越来越无法摆脱它编织的蛛网。"
 game_concept_skinlands: "皮囊之地"
 game_concept_skinlands_desc: "死灵把活人的世界称为皮囊之地；与[shadowlands|E]相对比，后者是死者的土地和死灵的家园。皮囊之地和[shadowlands|E]被尸幕隔开，尸幕遮蔽了活人的世界。死灵可以通过与生俱来的能力“生命视觉”更好地了解“生者”中发生的事情。怨灵无法看穿尸幕，因此也无法进入皮囊之地，除非他们拥有黑暗冥法：撕裂尸幕。"
 game_concept_gaia_realm: "盖亚界域"
 game_concept_gaia_realm_desc: "盖亚界域，狼族通常简称为“世界”，包括盖亚的物质、灵性和影界领域：即地球及其包含的所有灵性界域。该术语有时被广泛使用，以至于包括了与盖亚界域重叠或与盖亚界域相连的[penumbra|E]。"
 game_concept_unconquered_soul: "不从之魂"
 game_concept_unconquered_soul_desc: "不从之魂是你遭受被你吸榨的受害者夺舍的事件，并将覆盖你的外貌，特质和信仰。"
 game_concept_gargoyle_primogen: "$gargoyle_primogen_court_position$"
 game_concept_gargoyle_primogen_desc: "[GetTrait('gargoyle').GetName(GetNullCharacter)][primogen|E]需要良好的[prowess|E]能力。\n\n是[GetTrait('wrathful').GetName(GetNullCharacter)]、[GetTrait('callous').GetName(GetNullCharacter)]、[GetTrait('brave').GetName(GetNullCharacter)]会增強工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_hunter,[GetNullCharacter] #L 猎人#!#!稍微增强工作表现。\n\n#help 身为[GetTrait('gargoyle').GetName(GetNullCharacter)]，或在[GetTrait('visceratika').GetName( GetNullCharacter )]发明后身为[emperor|E]才能雇用此宫廷职位。#!"
 game_concept_umbra_expedition: "灵界探险"
 game_concept_umbra_expedition_desc: "访问你探员有所发现的灵界地点，需要克服一系列挑战，包括与灵体决斗、技能鉴定或有机会获得宝藏。"
 game_concept_bunk: "本格"
 game_concept_bunk_desc: "曾几何时，梦华可以凭空而来；曾几何时，妖精已经被灌注了梦华，不需要如此温柔的哄骗。那是[mythic_age|E]，但那个时代已经一去不复返了。现在，为了唤出编织魔咒所需的梦华，换生灵必须举行奇特的仪式和行动，这些仪式和行动被称为本格。"
 game_concept_roguelike_mode: "类Rogue模式"
 game_concept_roguelike_mode_desc: "#N 困难难度#!的[princes_of_darkness|E]。\n\n游戏开始时，你将随机切换到一位单伯爵领统治者。该统治者将受到诅咒。你可以选择以下诅咒之一：\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_wealth').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_love').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_rest').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_belongings').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_curiosity').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_guile').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_demands').GetNameWithTooltip]\n\n或者，你也可以让随机获得一项诅咒，或者一次性获得所有诅咒。\n\n你只有一次机会。如果你的初始统治者在有诅咒时死亡，游戏就结束了。\n\n完成一项主线决议就能消除诅咒。\n\n祝您好运。"
 game_concept_true_faith: "真信"
 game_concept_true_faith_desc: "一些个体对神灵有不可动摇的信仰，其信念足以保护自身。这被称为#bold 真信#!，并给予信徒超自然力量。\n\n$POD_splat_vampire_plural$被斥逐。$POD_splat_werewolf_plural$在其影响下被剥夺魂怒。对$POD_splat_demon_plural$和$POD_splat_wraith_plural$更是特别有用。不过真信在许多[splats|E]中都可以找到，就连一些吸血鬼都有。\n\n在[princes_of_darkness|E]，[GetTrait('truefaith').GetName(GetNullCharacter)]是可以解锁新[lifestyle|E]的[trait|E]。一个角色有着特别强大的信念则是[GetTrait('beatific').GetName(GetNullCharacter)]。\n\n恶魔崇拜的[GetTrait('infernalist').GetName(GetNullCharacter)]与真信相互排斥。$POD_splat_hunter_plural$有可能因为拥有罪恶特质而失去真信。"
 game_concept_yang_world: "阳界"
 game_concept_yang_world_desc: "阳界似乎包括[spirit_wilds|E]、[dreaming|E]和[astral_reaches|E]。这是一个充斥着阳之力量，喧闹而“高尚”的灵魂世界，通常居住着自然之灵和神。"
 game_concept_dark_kingdoms: "冥府"
 game_concept_infiltration: "渗透"
 game_concept_infiltration_desc: "#bold 渗透#!是一种[journey|E]，可以让你潜入别人的[court|E]，以实现一些秘密目标，比如偷取一件[artifact|E]。\n\n渗透发生在一张地图上，你可以在地图上自由移动。点击节点即可在它们之间穿梭。请记住，这样做会提高你的[suspicion_with_icon|E]。\n\n为了完成渗透，你必须在[suspicion_with_icon|E]不达到[EmptyScope.ScriptValue('suspicion_max')|V0]的情况下返回出口节点。\n\n成功达成#V 3#!次渗透将给予[GetModifier('infiltration_experience_modifier').GetNameWithTooltip]。"
 game_concept_suspicion: "嫌疑"
 game_concept_suspicion_desc: "#bold 嫌疑#!描述你在[infiltration|E]过程中吸引了多少注意力。\n\n嫌疑度从[EmptyScope.ScriptValue('suspicion_min')|V0]到[EmptyScope.ScriptValue('suspicion_max')|V0]。如果达到[EmptyScope.ScriptValue('suspicion_max')|V0]，你就会被发现，[infiltration|E]失败。\n\n在[EmptyScope.ScriptValue('suspicion_threshold_1')|V0]、[EmptyScope.ScriptValue('suspicion_threshold_2')|V0]和[EmptyScope.ScriptValue('suspicion_threshold_3')|V0]嫌疑度时，会出现一些周折，使以后的[skill|E]鉴定变得更加困难。"
 game_concept_mesmerize_defenses: "对抗催眠的防护"
 game_concept_mesmerize_defenses_desc: "具有更强势性格的角色更难被催眠。如果对方有以下特质或技能，成功概率将被降低：\n吸血鬼\n$BULLET_WITH_TAB$[GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$血术法的木星之曲\n$BULLET_WITH_TAB$[GetTrait('dominateadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('presenceadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('auspexadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('fortitudeadvanced').GetName(GetNullCharacter)]\n鬼人\n$BULLET_WITH_TAB$[GetPerk('steel_soul_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('shield_of_the_soul_perk').GetName(GetNullCharacter)]\n木乃伊\n$BULLET_WITH_TAB$[GetPerk('wisdom_of_isis_perk').GetName(GetNullCharacter)]\n猎人\n$BULLET_WITH_TAB$[GetPerk('mountain_meditation_perk').GetName(GetNullCharacter)]\n真信\n$BULLET_WITH_TAB$[GetPerk('holy_bulwark_perk').GetName(GetNullCharacter)]\n灵能\n$BULLET_WITH_TAB$[GetPerk('anti_psi_1_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_2_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_3_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_4_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_5_perk').GetName(GetNullCharacter)]\n恶魔\n$BULLET_WITH_TAB$[GetPerk('inviolate_soul_perk').GetName(GetNullCharacter)]\n狼人\n$BULLET_WITH_TAB$[GetPerk('shell_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('release_from_bondage_perk').GetName(GetNullCharacter)]\n妖精\n$BULLET_WITH_TAB$[GetPerk('fair_is_foul_foul_is_fair_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('captive_heart_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('geas_ban_perk').GetName(GetNullCharacter)]\n宝物\n$BULLET_WITH_TAB$先祖护身符"
 game_concept_suspicion_i: "@masquerade_icon:color_goldy_yellow!"
 game_concept_suspicion_with_icon: "@masquerade_icon:color_goldy_yellow!嫌疑"
 game_concept_infiltration_mission: "渗透任务"
 game_concept_infiltration_missions: "渗透任务"
 game_concept_coterie_spectre: "幽群"
 game_concept_samuel_haight_mode: "萨缪尔·海特模式"
 game_concept_samuel_haight_mode_desc: "在这种模式下，对混合[splats|E]的各种限制被取消：\n\n$EFFECT_LIST_BULLET$生成器创建的角色的专属决议和互动被默认解锁，例如请求[Embrace|E]、通过吸干$POD_splat_vampire$囚犯的血成为$POD_splat_ghoul$等等。\n$EFFECT_LIST_BULLET$任意[splat|E]都能学习[numina|E]\n$EFFECT_LIST_BULLET$[GetTrait('truefaith').GetName(GetNullCharacter)]和#TOOLTIP:GAME_TRAIT,infernalist,[GetNullCharacter] #L 崇魔#!#!不再互相冲突\n$EFFECT_LIST_BULLET$$POD_splat_hunter_plural$不再在成为#TOOLTIP:GAME_TRAIT,infernalist,[GetNullCharacter] #L 崇魔者#!#!后失去能力\n$EFFECT_LIST_BULLET$所有角色都能掌控剥皮瘟疫，且所有化形者都能成为[GetTrait('abomination').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$妖精血角色能够在被[Embrace|E]后继续使用[cantrips|E]\n$EFFECT_LIST_BULLET$超自然角色能在出生时获得[GetTrait('lament').GetName(GetNullCharacter)]或[GetTrait('psychic').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$[GetTrait('dhampyr').GetName(GetNullCharacter)]不会再在出生时移除其他超自然[splat|E]特质\n$EFFECT_LIST_BULLET$次种族（[GetTrait('ghoul').GetName(GetNullCharacter)]等）特质不再会在破蛹、原始觉醒、或通过炼金术成为化形者时被移除\n$EFFECT_LIST_BULLET$化形者能被血仆化\n$EFFECT_LIST_BULLET$$POD_splat_ghoul_plural$不会失去[GetTrait('kinfolk').GetName(GetNullCharacter)]或[GetTrait('kinain').GetName(GetNullCharacter)]特质\n$EFFECT_LIST_BULLET$任意$POD_splat_vampire$都能够觉醒[GetTrait('hun_and_po').GetName(GetNullCharacter)]，只要是[GetTrait('salubri_watcher').GetName(GetNullCharacter)]的朋友\n\n额外修改：\n\n$EFFECT_LIST_BULLET$所有[splats|E]都能自由与其他族友善互动。\n$EFFECT_LIST_BULLET$学习新能力的[journeys|E]不会叠加增长花费\n$EFFECT_LIST_BULLET$[GetPerk('alchemy_6_perk').GetName(GetNullCharacter)]还将解锁[GetModifier('kinfolk_elixir_modifier').GetNameWithTooltip]和[GetModifier('kinain_elixir_modifier').GetNameWithTooltip]\n\n模式的名字源自[samuel_haight|E]。"
 game_concept_storyteller_mode: "说书人模式"
 game_concept_storyteller_mode_desc: "这游戏模式有各种限制，使玩家更难快速积累力量：\n\n$EFFECT_LIST_BULLET$[loyalty_with_icon|E]的[opinion|E]需求被上升为#V 50#!\n$EFFECT_LIST_BULLET$角色拥有的[discipline|E]技能越多，喝血获得的[resonance|E]经验就会越低\n$EFFECT_LIST_BULLET$宣战或初拥会导致堕出[golconda|E]"
 game_concept_loyalty: "忠诚"
 game_concept_loyalty_with_icon: "@knight_icon!忠诚"
 game_concept_loyalty_desc: "如果对玩家的[opinion|E]下降到 #V 0#!，无地[knights|E]将会想要离开玩家的宫廷。你有1年的宽限期来再次提升他们的好感。\n\n若有以下，忠诚将不会造成影响：\n$EFFECT_LIST_BULLET$你对其有[strong_hook|E]\n$EFFECT_LIST_BULLET$其在你的[council|E]\n$EFFECT_LIST_BULLET$其是你的[hostage|E]、牧群、梦种、魔奴、宿体、或受缚死灵\n$EFFECT_LIST_BULLET$其对你有守护之誓\n$EFFECT_LIST_BULLET$其是你的[spouse|E]、[friend|E]、[soulmate|E]、或[coterie|E]成员\n\n忠诚在[storyteller_mode_with_icon|E]有更高限制。"
 game_concept_samuel_haight_mode_with_icon: "@haight_icon!萨缪尔·海特模式"
 game_concept_storyteller_mode_with_icon: "@wod_icon!说书人模式"
 game_concept_samuel_haight: "萨缪尔·海特"
 game_concept_samuel_haight_desc: "来自[world_of_darkness|E]的臭名昭著的反派人物，曾出现在不同[splats|E]的联动剧本中。也被称为“究极屌人”。\n\n萨缪尔是一位[GetTrait('kinfolk').GetName(GetNullCharacter)]，他对自己没有化形能力感到不满。他用各种方法积累力量：喝 $POD_splat_vampire$的血、学习[bloodsorcery|E]、使用禁忌仪式成为$POD_splat_werewolf$、使用一件宝物从其他狼人那里偷取灵赋、使用同一件宝物从一个$POD_splat_mage$那里偷取有关领域的知识，以及使用另一件宝物获得魔峰。\n\n当一位古老的[GetTrait('baali').GetName(GetNullCharacter)]在阿兹特克金字塔顶上杀死他时，他的暴行也随之结束。在以[GetTrait('wraith').GetName(GetNullCharacter)]的身份进入[shadowlands|E]时，海特被魂铸，成了一个烟灰缸。\n\n虽然萨缪尔·海特一开始可能是个严肃的反派，但他逐渐变成了编剧的一个元玩笑，用来取笑那些过于强大的跨线角色。"
 game_concept_cultist: "教徒"
 game_concept_cultists: "教徒"
 game_concept_cultist_desc: "$game_concept_cultists$是恶魔的信徒。他们的信仰给予恶魔奥秘[experience|E]。你能通过对封臣和廷臣使用$POD_set_cultist_interaction$[character_interaction|E]使他们成为教徒。"
 game_concept_coterie_entomos: "虫群"
 game_concept_coterie_bastet: "狮群"
 game_concept_summon_wraith_on_death_interaction: "死后还魂"
 game_concept_summon_wraith_on_death_interaction_desc: "使其他角色在死后化为[GetTrait('wraith').GetName( GetNullCharacter )]时被召唤到角色宫廷的互动。"
 game_concept_POD_vampire_maa: "吸血鬼"
 game_concept_POD_vampire_maa_desc: "当夜幕降临战场时，受诅的该隐之子将成为可怕的战斗者。他们天生比凡人更强壮，速度更快，其中大多数还拥有可以扭转战局的强大精神和物理异能。"
 game_concept_umbra_aptitude: "灵界资质"
 game_concept_umbra_aptitude_desc: "该角色探索灵界的速度。"
 game_concept_umbra_sense: "灵界感知"
 game_concept_umbra_sense_desc: "该角色有多大概率免于困于灵界，且有多大概率达成委任的[umbra_expedition|E]。"
 game_concept_beasts: "心兽"
 game_concept_POD_construct_maa: "构造体"
 game_concept_POD_construct_maa_desc: "构装体是由一系列魔法或科技生物所代表的[men_at_arms|E]，它们的形状、形态和力量有很大的不同，取决于制造它们的方式和原因。"
 game_concept_POD_bygones_maa: "逝兽"
 game_concept_POD_bygones_maa_desc: "逝兽是神话传说中的生物，由于与共识场不相容，无法在地球上长期公开存在。虽然强大，但这种不稳定性使它们在战斗中很难发挥作用。"
 game_concept_POD_wraith_maa: "死灵"
 game_concept_POD_wraith_maa_desc: "死灵是幽灵，有未毕之事而死去的人的鬼魂，现已在[shadowlands|E]作祟。"
 game_concept_pod_i: "@pod_icon!"
 game_concept_static_stress: "固定压力"
 game_concept_static_stress_desc: "固定压力是数值不受任何压力修正影响的[stress|E]。"
 game_concept_dreamers: "梦种"
 game_concept_kuei_jin: "鬼人"
 game_concept_kuei_jin_desc: "也被称为万鬼、阿修罗提伽耶（在印度），或简称为饿殍。\n传说鬼人是古代万仙——玉皇大帝选中引导和保护宇宙的“万千仙神”——的堕落转世。万仙最初通过针对才能和勇气的试炼被选上，并以宇宙的气为食。然而，他们却误入歧途，学会了吸取生命之气，亵渎了这一证道试炼。"
 game_concept_wan_xian: "万仙"
 game_concept_wan_kuei: "万鬼"
 game_concept_gui_ren: "鬼人"
 game_concept_hungry_dead: "饿殍"
 game_concept_asuratizayya: "阿修罗提伽耶"
 game_concept_dark_umbra: "暗影界"
 game_concept_spirit_world: "灵界"
 game_concept_spirit_worlds: "灵界"
 game_concept_high_umbra: "上影界"
 game_concept_astral_umbra: "星影界"
 game_concept_grand_city_of_constantinople: "君士坦丁堡，褪色幻梦"
 game_concept_grand_city_of_constantinople_desc: "君士坦丁堡的三条不同路线根据其持有者的文化而异。\n\n掠夺路线（适用于拉丁人、伊比利亚人、法兰西人、英格兰人和德意志人）有着较长的建筑建设时间，但最终能带来丰厚的收益，体现了掠夺城市财富的漫长过程。\n重建路线（适用于拜占庭人、罗马人、罗斯人和古希腊人）提供了成本高昂、盈利周期较长的建筑，但最终会使完全建成的君士坦丁堡变成三条路线中最为强大的。\n改革路线（适用于其他所有文化）则介于两者之间，提供多样化的建筑，具有良好的收益和适中的成本。"
 game_concept_plunder_route: "掠夺路线"
 game_concept_rebuild_route: "重建路线"
 game_concept_reform_route: "改革路线"
 game_concept_torment: "磨难"
 game_concept_torment_desc: "磨难由以下行动提升：\n$EFFECT_LIST_BULLET$谋杀\n$EFFECT_LIST_BULLET$折磨\n$EFFECT_LIST_BULLET$获得[rival|E]或[nemesis|E]\n$EFFECT_LIST_BULLET$向大恶魔献祭囚犯或地产\n\n磨难由以下行动降低：\n$EFFECT_LIST_BULLET$赠送金钱、宝物、或头衔\n$EFFECT_LIST_BULLET$使用治疗能力\n$EFFECT_LIST_BULLET$获得[friend|E]、[lover|E]、或[soulmate|E]\n$EFFECT_LIST_BULLET$附身于人类宿体时自动降低（只对[GetTrait('earthbound').GetName(GetNullCharacter)]）"
 game_concept_bloodmagic_spell: "血魔法法术"
 game_concept_bs_spell: "法术"
 game_concept_bs_spells: "法术"
 game_concept_bloodmagic_spell_desc: "#bold 法术#!让一位[Concept('bloodsorcery','Blood Sorcerer')]能够施展按照吸血鬼的标准都会认为反常理的行为。每个法术都与一个[bs_path|E]相关联。\n\n法术可能除了[hunger_with_icon|E]之外还有额外的代价，比如[static_stress|E]或[piety|E]。\n\n在[princes_of_darkness|E]中，法术通过#V $blood_sorcery_interaction$#![character_interaction|E]施放。成功率取决于与目标的距离、[learning|E]之间的差异，以及如果双方都是$POD_splat_vampire_plural$，则还取决于他们的[vampgeneration|E]差异。"
 game_concept_bloodmagic_tradition: "血魔法宗派"
 game_concept_bs_tradition: "宗派"
 game_concept_bs_traditions: "宗派"
 game_concept_bloodmagic_tradition_desc: "每个实践[bloodsorcery|E]的[Clan|E]都围绕其实践创造了自己独特的信仰体系和传说。\n\n在[princes_of_darkness|E]中，可以通过[journey|E]学习以下传统：\n$EFFECT_LIST_BULLET$#bold 奇术#!：属于[GetTrait('tremere').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold 杜–安–奇#!：属于[GetTrait('assamite').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold 咒术#!：属于#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#! \n$EFFECT_LIST_BULLET$#bold 库都术法#!：属于[GetTrait('tzimisce').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold 深渊秘术#!：属于[GetTrait('lasombra').GetName(GetNullCharacter)]\n\n学习一种血术法将解锁其相关的[bs_paths|E]。一些道途也在不同的血术法之间共享。"
 game_concept_bloodmagic_path: "血魔法道途"
 game_concept_bs_path: "道途"
 game_concept_bs_paths: "道途"
 game_concept_bloodmagic_path_desc: "一个 #bold 道途#! 是一系列程序，用于实现某种效果，如控制天气、操控疾病或召唤恶魔，这些效果都属于[bloodsorcery|E]的范畴。\n\n在[princes_of_darkness|E]中，道途是血魔法[lifestyle|E]中的一系列[perks|E]。这些特性可能会解锁新的或提升现有的[bs_spells|E]。\n\n学习一个[bs_tradition|E]将获得其相关的道途。有些道途在不同的流派之间也是共享的。"
 game_concept_bloodmagic_ritual: "血魔法仪式"
 game_concept_bs_ritual: "仪式"
 game_concept_bs_rituals: "仪式"
 game_concept_bloodmagic_ritual_desc: "#bold 仪式#!是强大的[bs_spells|E]。它们的失败几率通常较低，但需要更多时间和额外资源，比如[gold|E]或[piety|E]。\n\n仪式与[bs_traditions|E]相关联。通过在该传统的任何[bs_path|E]中获得[perks|E]，可以解锁更强大的仪式。\n\n在[princes_of_darkness|E]中，仪式被视为[journeys|E]。在计划仪式期间，你无法[travel|E]或参与[activities|E]。"