l_simp_chinese:
 game_concept_princes_of_darkness:0 "黑暗亲王"
 game_concept_princesofdarkness:0 "$game_concept_princes_of_darkness$"
 game_concept_princes_of_darkness_desc:0 "十字军之王3的Mod，设定取自P社旗下白狼公司的《[world_of_darkness|E]》跑团规则。正是你现在所玩的！[prince|E]是具有领地的[GetTrait('vampire').GetName( GetNullCharacter )]的主要头衔，相等于十字军之王3的[duchy|E]。何处黑暗？取决于你。"
 game_concept_POD:0 "黑暗亲王"
 game_concept_prince:0 "亲王"
 game_concept_the_prince:0 "亲王"
 game_concept_the_princes:0 "亲王"
 game_concept_princes:0 "亲王"
 game_concept_prince_desc:0 "$prince$是具有领地的[GetTrait('vampire').GetName( GetNullCharacter )]的主要头衔，相等于十字军之王三的[duchy|E]。"
 game_concept_bloodpotency:0 "血权"
 game_concept_bloodpotency_desc:0 "$game_concept_bloodpotency$代表[GetTrait('vampire').GetName( GetNullCharacter )]血中的固有能力，它随着时间的推移而缓慢增长，并受到[GetTrait('vampire').GetName( GetNullCharacter )]的[vampgeneration|E]的限制。$game_concept_bloodpotency$在[torpor|E]中会缓慢减弱。它会通过来[diablerize|E]高血权的吸血鬼来迅速增长。$game_concept_bloodpotency$会影响[discipline|E]使用后饥渴的增长速度，和[GetTrait('vampire').GetName( GetNullCharacter )]的能力，如[disciplines|E]的有效性。"
 game_concept_blood_potency:0 "$game_concept_bloodpotency$"
 game_concept_vampgeneration:0 "世代"
 game_concept_generation:0 "世代"
 game_concept_vampgeneration_desc:0 "依据[cainites|E]，这是一个[GetTrait('vampire').GetName( GetNullCharacter )]的血脉与所有[GetTrait('vampire').GetName( GetNullCharacter )]之父——该隐的距离。该隐属于[GetTrait('vampgeneration1').GetName( GetNullCharacter )] 。[GetTrait('vampgeneration14').GetName( GetNullCharacter )]或更后的吸血鬼都是“淡血种”，更近似人类而非吸血鬼。不信该隐的吸血鬼都将他们的[vampgeneration|E]追溯至一些源自其他神话的始祖。吸血鬼可以减少他们的[vampgeneration|E]，也可以通过对有比他们有更前[vampgeneration|E]的吸血鬼实施[diablerie|E]，来增加他们的潜在能力。"
 game_concept_bloodbond:0 "血缚"
 game_concept_bloodbond_desc:0 "喝下[GetTrait('vampire').GetName( GetNullCharacter )]的血一般会使其对[GetTrait('vampire').GetName( GetNullCharacter )]建立一种强烈的忠心和遵从感。也称血誓，这就像一个牵制，强度越高，消耗越多的血液。有些吸血鬼无法用自己的血建立联系。另一些吸血鬼则完全不可被束缚。"
 game_concept_blood_oath:0 "$game_concept_bloodoath$"
 game_concept_bloodoath:0 "血誓"
 game_concept_blood_bond:0 "$game_concept_bloodbond$"
 game_concept_beast:0 "心兽"
 game_concept_the_beast:0 "$game_concept_thebeast$"
 game_concept_thebeast:0 "心兽"
 game_concept_beast_desc:0 "[the_beast|E]是个被[GetTrait('vampire').GetName( GetNullCharacter )]用来描述那个试图控制[cainite|E]的内在掠食者的术语。那是一只伴随着每个[GetTrait('vampire').GetName( GetNullCharacter )][Embrace|E]而觉醒的与生俱来的恶魔般的掠食者。它与吸血鬼的人性（在某些情况下是教化心路）直接对立，是许多[cainites|E]每晚都会感到的堕落冲动的罪魁祸首。在极度悲痛的情况下心兽可以压垮一位[GetTrait('vampire').GetName( GetNullCharacter )]，并强迫他们陷入纯粹兽性的战斗或逃离，也称血狂或赤骇。如果一个[GetTrait('vampire').GetName( GetNullCharacter )]有了负的[piety|E]，他们会有风险陷入永久的血狂并变成一只[GetTrait('wight').GetName( GetNullCharacter )]。这使其在实质上的退位给他们的[heir|E]。"
 game_concept_the_masquerade:0 "潜藏"
 game_concept_masquerade:0 "潜藏"
 game_concept_masquerade_desc:0 "潜藏是吸血鬼使用的术语，指的是保持他们存在对凡人隐秘的戒条。违反潜藏会招惹麻烦，例如被猎人袭击。在部分领地，这可能会被视作吸血鬼间的[crime|E]。\n大多数信仰可以通过[character_interaction|E]来掩盖潜藏的破漏。拥有太高的潜藏曝露度会导致派别叛乱和你的角色会被袭击的事件。"
 game_concept_humor:0 "体液"
 game_concept_humors:0 "体液"
 game_concept_humour:0 "体液"
 game_concept_humours:0 "体液"
 game_concept_humorism:0 "体液"
 game_concept_humourism:0 "体液"
 game_concept_resonance:0 "共鸣"
 game_concept_resonances:0 "共鸣"
 game_concept_resonance_desc:0 "血液根据其容器的个性和情感而有着既定的特性。吸血会根据$game_concept_resonance$来赋予[GetTrait('vampire').GetName( GetNullCharacter )]技能。你会因吸特定共鸣的血液或使用特定的[discipline|E]得到更多[discipline|E]经验。这些共鸣是：\n$BULLET_WITH_TAB$[choleric_lifestyle|E]\n$BULLET_WITH_TAB$[melancholy_lifestyle|E]\n$BULLET_WITH_TAB$[phlegmatic_lifestyle|E]\n$BULLET_WITH_TAB$[sanguine_lifestyle|E]\n$BULLET_WITH_TAB$[animal_lifestyle|E]"
 game_concept_torpor:0 "蛰眠"
 game_concept_torpor_desc:0 "蛰眠是[GetTrait('vampire').GetName( GetNullCharacter )]停止活动的情形。他在不能动时，还可以感觉到他周围所发生的事情。它可以由刺穿心脏的尖桩、足够的身体损伤、巨大的饥渴感或倦怠感引起。\n一个具有蛰眠特质的角色会被严重削弱，不能进行大多数行动，也不能统治。他们可以被特殊的“寻找藏身处”的[character_interaction|E]所唤醒。"
 game_concept_torpid:0 "蛰眠"
 game_concept_hunger:0 "饥渴"
 game_concept_hunger_desc:0 "$game_concept_hunger$是一个[GetTrait('vampire').GetName( GetNullCharacter )]想要进食血液的欲望。这是由于[the_beast|E]而产生。随着一个[GetTrait('vampire').GetName( GetNullCharacter )]的$game_concept_bloodpotency$越高，降低他们的$game_concept_hunger$就需要越多的血液。增加$game_concept_hunger$对一个[GetTrait('vampire').GetName( GetNullCharacter )]同时有着正面和极大负面影响。唯一全面满足[GetTrait('vampire').GetName( GetNullCharacter )]的$game_concept_hunger$的方法是杀戮并吸光受害者所有的血液。即使这样$game_concept_hunger$的满足也只是暂时的。"
 game_concept_the_hunger:0 "饥渴"
 game_concept_blood_hunger:0 "饥渴度"
 game_concept_the_thirst:0 "饥渴"
 game_concept_thirst:0 "饥渴"
 game_concept_blood_thirst:0 "嗜血"
 game_concept_discipline:0 "律能"
 game_concept_disciplines:0 "律能"
 game_concept_discipline_desc:0 "被称为“律能”的吸血鬼力量的起源是未知的，但许多人认为它们是该隐或莉莉丝的赠礼，通常认为一些[antediluvians|E]发明了独创的律能，并通过他们的世系传承下来。还有人认为它们是不死族之身与生俱来的力量。\n在游戏中，律能被处理成生活方式树，你可以通过其解锁能力。要开启其中一棵树，你必须有相应的律能特质。这些树的XP通过猎食凡人时获得的血液共鸣增加。"
 game_concept_choleric_lifestyle:0 "胆汁质共鸣"
 game_concept_yellow_bile:0 "$game_concept_yellowbile$"
 game_concept_yellowbile:0 "黄胆汁"
 game_concept_choleric_lifestyle_desc:0 "$game_concept_choleric_lifestyle$适用于某些[GetTrait('vampire').GetName( GetNullCharacter )]通过吸食带有愤怒或嫉妒的情感的血液来改善[discipline|E]。寻找带有类似[GetTrait('wrathful').GetName( GetNullCharacter )]和[GetTrait('sadistic').GetName( GetNullCharacter )]性格[traits|E]的猎物。$game_concept_choleric_lifestyle$[discipline|E]有：\n\n$BULLET_WITH_TAB$[GetTrait('celerity').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('potence').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('vicissitude').GetName( GetNullCharacter )]"
 game_concept_sanguine_lifestyle:0 "多血质共鸣"
 game_concept_sanguine:0 "多血质"
 game_concept_sanguine_lifestyle_desc:0 "$game_concept_sanguine_lifestyle$适用于某些[GetTrait('vampire').GetName( GetNullCharacter )]通过吸食带有幸福和热情的情感的血液来改善[discipline|E]。寻找带有类似[GetTrait('gregarious').GetName( GetNullCharacter )]和[GetTrait('lustful').GetName( GetNullCharacter )]性格[traits|E]的猎物。$game_concept_sanguine_lifestyle$[discipline|E]有：\n\n$BULLET_WITH_TAB$[GetTrait('bloodsorcery').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('presence').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('thinbloodalchemy').GetName( GetNullCharacter )]"
 game_concept_phlegmatic_lifestyle:0 "黏液质共鸣"
 game_concept_phlegm:0 "黏液"
 game_concept_phlegmatic:0 "黏液质"
 game_concept_phlegmatic_lifestyle_desc:0 "黏液质共鸣适用于某些[GetTrait('vampire').GetName( GetNullCharacter )]通过吸食带有多愁善感和控制的情感的血液来改善[discipline|E]。寻找带有类似[GetTrait('lazy').GetName( GetNullCharacter )]和[GetTrait('content').GetName( GetNullCharacter )]性格[traits|E]的猎物。$game_concept_phlegmatic_lifestyle$[discipline|E]有：\n\n$BULLET_WITH_TAB$[GetTrait('auspex').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('dominate').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('oblivion').GetName( GetNullCharacter )]"
 game_concept_melancholy_lifestyle:0 "抑郁质共鸣"
 game_concept_black_bile:0 "$game_concept_blackbile$"
 game_concept_blackbile:0 "黑胆汁"
 game_concept_melancholic:0 "抑郁质"
 game_concept_melancholy_lifestyle_desc:0 "$game_concept_melancholy_lifestyle$适用于某些[GetTrait('vampire').GetName( GetNullCharacter )]通过吸食带有悲伤和理智的情感的血液来改善[discipline|E]。寻找带有类似[GetTrait('shy').GetName( GetNullCharacter )]和[GetTrait('craven').GetName( GetNullCharacter )]性格[traits|E]的猎物。$game_concept_melancholy_lifestyle$[discipline|E]有：\n\n$BULLET_WITH_TAB$[GetTrait('fortitude').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obfuscate').GetName( GetNullCharacter )]"
 game_concept_animal_lifestyle:0 "兽性共鸣"
 game_concept_animal_lifestyle_desc:0 "$game_concept_animal_lifestyle$适用于某些[GetTrait('vampire').GetName( GetNullCharacter )]通过从动物来吸食改善[discipline|E]。寻找动物作为猎物。$game_concept_animal_lifestyle$[discipline|E]有：\n\n$BULLET_WITH_TAB$[GetTrait('animalism').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('protean').GetName( GetNullCharacter )]"
 game_concept_diablerize:0 "吸榨"
 game_concept_amaranth:0 "不凋花"
 game_concept_discipline_power:0 "律能力量"
 game_concept_discipline_power_desc:0 "[discipline|E]力量是对[discipline|E]的应用，允许吸血鬼达成超自然之事或获得奇律能力。"
 game_concept_bind_famulus:0 "契约动物伙伴"
 game_concept_bind_famulus_desc:0 "契约动物伙伴是一种[character_interaction|E]，它允许你通过血缚将一只动物转化为你的动物伙伴，与其形成一精神链接，并辅助你运用其他兽性术能力。"
 game_concept_animal_succelence:0 "鲜美野味"
 game_concept_animal_succelence_desc: "吸血鬼可以通过吃动物来缓解额外的[hunger|E]。此外，吸血鬼也可以吸食它的动物伙伴，其取得的营养远远超过类似体型的动物，并吸收走它的基本特质的一小部分。"
 game_concept_animal_dominion:0 "动物支配"
 game_concept_animal_dominion_desc:0 "动物支配是一种[character_interaction|E]，表示着吸血鬼掌控兽类的力量已经大到能够如同催动肢体一般控制兽群。只须一个手势，一队，甚至一群动物们便将其生命献于它们的主宰。"
 game_concept_blood_draught:0 "血剂"
 game_concept_blood_draught_desc:0 "吸血鬼的血权够通过[discipline|E]被萃取，给予任何饮下它的人各种增强。与血剂相关的动作是通过[character_interaction|E]进行的。"
 game_concept_shapeshift:0 "变形"
 game_concept_shapeshift_desc:0 "一种允许使用者以某种方式变化形态的[character_interaction|E]，通常包含在变形术或变幻术中。"
 game_concept_feral_weapons:0 "天然武器"
 game_concept_feral_weapons_desc:0 "吸血鬼能将其等的天然武器伸展成怪物般的大小，这通常为将指甲化为锋利的爪子，但也有其他形式如将利齿化为锋利的匕首，如同巨蛇之牙。[shapeshift|E]的子技能。"
 game_concept_shapechange:0 "变身动物"
 game_concept_shapechange_desc:0 "吸血鬼能够变成动物形态，并具有与原本质量差不多的体型。该动物通常为其种类的异类，不过对于凡人来说是看不出任何超自然之处的。[shapeshift|E]的子技能。"
 game_concept_mist_form:0 "迷雾形态"
 game_concept_mist_form_desc:0 "吸血鬼获得能够变成云雾的传奇能力，能够被看到但无法被碰触到，除了火、阳光以及超自然攻击。其能够穿过管道、墙缝和地缝。除了强风之外，没有任何自然力量能够驱散此云。[shapeshift|E]的子技能。"
 game_concept_tenebrous_avatar:0 "阴暗化身"
 game_concept_tenebrous_avatar_desc:0 "吸血鬼对于黑暗的掌握已经到了出神入化的地步，以至于能够化身为它。在激活此能力后，吸血鬼能够变成一片漆黑又混沌莫测的影子。处于此形态的吸血鬼基本上是无敌的，并能够穿过墙缝和地缝。此外，该吸血鬼还获得了能够在自然黑暗中视物的能力。[shapeshift|E]的子技能。"
 game_concept_incorporeal_form:0 "虚体形态"
 game_concept_incorporeal_form_desc:0 "吸血鬼能够变成虚体，但与幽灵并不相同，并能够自由穿过物体并免疫物理攻击。除了看和说话，不能与物质界进行任何物理互动。[shapeshift|E]的子技能。"
 game_concept_faith_lifestyle:0 "真信"
 game_concept_faith_lifestyle_desc:0 "极度狂热角色的奇异天赋，真信特质启用同名生活方式，在其中可以通过对应的生活方式经验获得各种能力。"
 game_concept_bloodsorcery:0 "血术法"
 game_concept_blood_sorcery:0 "$game_concept_bloodsorcery$"
 game_concept_blood_magic:0 "血魔法"
 game_concept_thaumaturgy:0 "奇术"
 game_concept_durnaki:0 "杜–安–奇"
 game_concept_bloodsorcery_desc:0 "血术法，也被称为奇术、赫考、杜–安–奇等，是一种利用吸血鬼的精血来唤起强大魔法效果的艺法。血术法是一种强大但危险且昂贵的工具，它由少数[Clans|E]所拥有，并被小心守护。每个派系都有自己召唤血之力的方式——睿魔尔使用赫耳墨斯魔法和符号，哈基姆圣裔的术士与灵和神签订契约，而勒森魃则坠入深渊以召唤奥秘。据说血术法有能做近乎任何事情——虽然这些声明通常来自于希望创造一个可怕的景象的实践者或诅咒和火球的受害者，但的确，血术法可以提供无数的法术和能力，有些可以被认作……非自然。\n任何拥有血术法[discipline|E]的人都可以通过[character_interaction|E]来打开血术法菜单。在内，魔法师可以购得法术，如果他们有足够的[bloodsorcery_exp|E]来施放法术和诅咒。"
 game_concept_bloodsorcery_exp:0 "血术法经验值"
 game_concept_bloodsorcery_exp_short:0 "经验值"
 game_concept_bloodsorcery_exp_desc:0 "衡量你的角色学习了多少[bloodsorcery|E]技艺。血术法经验值用于学习新的力量和在道途提升，并有两种方式获得：\n1. 一个角色将根据其的学识每年获得经验。\n2. 每次术士成功施放一个法术，其将得到一些经验值。"
 game_concept_necromancy:0 "亡灵术"
 game_concept_mortis:0 "死灵术"
 game_concept_possession:0 "附身"
 game_concept_possess:0 "附身"
 game_concept_possession_desc:0 "死灵获得身体所有权的过程。附身成功与否取决于死灵和受害者之间的决斗。附身分为三个阶段，所以可以对同一个人多次使用（当然，如果你使用的是相同的死灵）。如果受缚于你的幽灵附身于一个受害者，目标也会受缚于你。附身阶段：\n1. 第一阶段，受害者获得一些死灵的勇武在他们自己之上，并且亡灵术师和死灵获得对受害者的影响力。\n2. 第二阶段，给予受害者一些死灵的能力，给予他们一部分幽灵特性。亡灵术师对受害者拥有更多的控制。此外，死灵和受害者的个性开始融合在一起。\n3. 第三阶段，完全附身，死灵的人格覆盖了目标。受害者被死灵奴役，并获得更多的属性能力，因为幽灵通过其行动。亡灵术师的控制进一步增强。"
 game_concept_necromancy_desc:0 "亡灵术是一种[bloodsorcery|E]，专门针对死者，[underworld|E]和死灵。\n通过使用湮灭和深渊的力量，亡灵术师可以缚灵死灵用于他们的意愿，并命令他们执行各种各样的任务——从间谍到[possession|E]。"
 game_concept_endowments_lifestyle:0 "信念生活方式"
 game_concept_endowments_lifestyle_desc:0 "信念代表着裁判官在掌握他们的修会克服地狱侍从的方法的道途上的进步。"
 game_concept_obtenebration:0 "幽暗术"
 game_concept_obtenebration_desc:0 "幽暗术，控制和操纵影子的力量，是给予了暗影之[Clan|E]其前缀的[discipline|E]。该术入门者可以利用它来移动和操纵影子，使之成为自己的优势，而大师们则可以赋予影子以形态、物质和生命的模样。这种力量的来源的性质在勒森魃中引起了无尽的争论。该[Clan|E]最古老的长者声称，黑暗本身就是一个原始的实体，与创造世界的力量相等且相反。受祆教的影响，最年长的人通常称这种黑暗力量为阿里曼。其他的勒森魃认为幽暗术的力量来自于某个暗影界域，而不是个实体。信仰亚伯拉罕诸教的勒森魃可能会称该国度为地狱，而信奉古希腊或罗马神的人可能会称它为塔尔塔罗斯。不管起源是什么，幽暗术对于那些看到它被使用的人来说是完全令人不安的。看到[discipline|E]的使用的动物或凡人会感到恐惧。即使是[cainites|E]，若要解释，也倾向于将幽暗术视为对自然法则的侮辱。"
 game_concept_abyss_eyes:0 "深渊之眼"
 game_concept_abyss_eyes_desc:0 "深渊之眼是一种[discipline_power|E]、[shapeshift|E]的子技能。吸血鬼的眼睛变成黑色。他们无视所有的黑暗减益，即使是超自然黑暗带来的减益，并能看到幽灵。"
 game_concept_nocturne:0 "化夜"
 game_concept_nocturne_desc:0 "化夜是一种[discipline_power|E]，可以作为个人[character_interaction|E]使用，在战斗中对敌方骑士造成减益，每有个被减益的敌人都要消耗一定虔诚。通过集中精力召唤出黑暗，拥有此能力的勒森魃可以召唤出一团蠕动的超自然黑暗，吞噬一个区域并遮蔽所有的光源。黑暗是深渊的一种显现，它能掩盖声音和视线，并扼杀弱者的生命。"
 game_concept_drain_the_life:0 "众生衰竭"
 game_concept_drain_the_life_desc:0 "众生衰竭是一种[discipline_power|E]，是用于削弱敌方国度的[character_interaction|E]。吸血鬼手腕一动，就会使深渊降临到世上，在空中形成一个可怕的球形空洞。无论敌友都会受伤，也许会被毁灭，直到其关闭。那些被杀（或几乎被杀）的人会化为虚无。所有关于他们存在的痕迹都消失了。"
 game_concept_shadow_twin:0 "暗影分身"
 game_concept_shadow_twin_desc:0 "暗影分身是一种[discipline_power|E]，可以作为个人[character_interaction|E]使用，创造出一个具有你的能力和力量的角色，在任何时候都只能存在一个，如果其死亡，你会获得巨大的压力。吸血鬼对黑暗的控制已经发展到如此程度，以至于他可以赋予黑暗一定程度的知觉。通过使他自己的影子活化，[cainite|E]实际上可以“解放”由光投下的影子。当这种能力处于激活状态时，受术者不会投下任何影子，因为它已经离开，去遵从吸血鬼的命令。"
 game_concept_elder_perk:0 "长者技能"
 game_concept_elder_perk_desc:0 "长者技能是只有世代最够前到足以唤醒其血液的真正潜力的吸血鬼才能获得的[perks|E]。"
 game_concept_shadow_twin_master:0 "暗影主宰"
 game_concept_shadow_twin_master_desc:3 "$game_concept_shadow_twin_master$是一种表示这该角色制造了一位暗影分身的$game_concept_relation$，而[shadow_twin_servant|E]侍奉与该角色。"
 game_concept_shadow_twin_servant:0 "暗影分身"
 game_concept_shadow_twin_servant_desc:0 "$game_concept_shadow_twin_servant$是一种$game_concept_relation$，意味着该角色是位暗影分身，通过影子制造出的克隆体，侍奉于它的[shadow_twin_master|E]"
 game_concept_daimoinon:0 "崇魔术"
 game_concept_daimoinon_desc:0 "巴力之血中流淌并歌唱着呓语，自深缚于大地之低语中剥离，从首位呼唤深渊的术士的喉间扯下。崇魔术是跨越天地的呼喊——从我们的世界延伸至被遗忘的某处，而力量则从那一所在回响于我们的世界。某天，巴力血系将会尖啸，然后响声击碎世界。现在，他们用崇魔术轻柔地催人入睡，然后让他们梦遇火焰与黑暗。"
 game_concept_Sire:0 "尊长"
 game_concept_Sire_desc:0 "成功[Embrace|E]凡人的吸血鬼被称为该凡人的“尊长”。这种关系接近于凡人世界中的父母/孩子。和该关系一样，它可以采取多种表达，从工作同伙到直接仇恨。\n在本MoD中，这取代了吸血鬼的“父母/孩子”关系，因为他们不能自然生子。"
 game_concept_Embrace:0 "初拥"
 game_concept_Embrace_desc:0 "吸血鬼如果在吸干了凡人所有的血之后才给凡人喝下自己的血，就会把他们变成吸血鬼。这个过程被称为“初拥”，它将在新的[Sire|E]和他的新子嗣之间建立起牢固的联系。\n在MoD中，你可以右键点击你所在地区的任何一个凡人，启动一个初拥计谋。一旦完成，你将把这个凡人变成你自己的吸血鬼子嗣，游戏将其表现为一种父母/孩子关系。"
 game_concept_cainites:0 "该隐之子"
 game_concept_cainite:0 "该隐之子"
 game_concept_cainite_desc:0 "大多数吸血鬼同意“该隐即起源的故事”。圣经中的第一个杀人犯，在杀死自己的兄弟亚伯后，被天主和他的天使以各种方式诅咒，最终导致了今天已知的吸血鬼状况。\n因此，该隐之子已经成为吸血鬼描述自己的一个非常常用的术语。"
 game_concept_diablerist:0 "吸榨者"
 game_concept_diablerie:0 "吸榨"
 game_concept_diablerie_desc:0 "吸血鬼能犯下的最令人发指的罪行，当一位吸血鬼的所有血液被另一位吸血鬼吸食，导致受害者的灵魂也被吞噬时，就发生了吸榨。这个过程虽然被大多数人所不齿，但却能使犯罪者获得更大的力量，因为他们可以学习受害者的一些能力或减少他们的世代，使他们更接近该隐。\n在游戏中，吸榨是一个可以用来对付其他吸血鬼的计谋。如果你设法成功，你可以得到新的能力，增加血权，减少世代，但代价是大量的虔诚（取决于你的宗教）和一个从当下开始携带的难言秘密。"
 game_concept_Clan_desc:0 "氏族是一个用来描述吸血鬼的主要群体的术语，他们拥有由血液传递的共同特征。一名吸血鬼的氏族是他的世系，是他被[Embrace|E]在的吸血鬼“家族”。吸血鬼社会通常承认今夜有十三氏族，尽管有些可能已经消失在历史中，有些可能存在于隐秘之中，有些可能从未被人所知。\n像所有的血系一样，每个氏族都更专精于三项[disciplines|E]，一个氏族的弱点是其成员基本都特有的，以及由于倾向于[Embrace|E]具有某些特征的个人而都归有刻板印象。"
 game_concept_ashirra:0 "阿什拉派"
 game_concept_ashirra_desc:0 "阿什拉派（来自阿拉伯语的“氏族”一词）是信仰真主的伊斯兰吸血鬼教派，在凡人的穆斯林土地上有很强的影响力。阿什拉派的成员相信，如果他们选择追随真主，就会得到救赎，这是穆罕默德的承诺之一。虽然有些吸血鬼是真正的伊斯兰教信徒，但绝大多数参与阿什拉派的人都只是为了方便才拜伊斯兰教，或者只是为了更容易在中东地区活动。\n在某些情况下，阿什拉派可以用来指代任何遵循伊斯兰教的吸血鬼。"
 game_concept_antediluvian:0 "上古耆宿"
 game_concept_antediluvian_desc:0 "也被译作真祖，原文意为“大洪水之前”，该词可以适用于任何大洪水之前的[cainite|E]，如该隐或次代，但它几乎总是被用来特指三代，十三[Clan|E]是他们的后代。他们是具有不可估量的力量的生物。\n据推测，上古耆宿的年龄和血权使他们拥有近乎神的力量，事实上他们中的一些人就是神明。很少有关于其力量的使用的记录，但传说中通常将他们描绘成不可战胜的。有些人甚至认为，这种生物被杀死的唯一方法是他们希望被杀死，或者是在另一位上古耆宿的手中。"
 game_concept_antediluvians:0 "上古耆宿"
 game_concept_typhonic_avatar:0 "提丰下凡"
 game_concept_typhonic_avatar_desc:0 "提丰下凡是一种[discipline_power|E]，[shapeshift|E]子选项。吸血鬼能变身成提丰魔兽，传说生物。一只高大的胡狼耸立于大地之上，生有一条坚硬，分叉，多棘刺的尾，和平整的尖耳与长吻。提丰魔兽是赤红，玄黑或者二者之间的组合色。还有别的选择，它可以采取一种人蛇混合的形态，带着一条缠绕着的长尾代替双腿。除了宗教用途，还使用其作为“战争形态”。"
 game_concept_serpentis:0 "古蛇术"
 game_concept_serpentis_desc:0 "古蛇术是赛特恐怖的传承。这门[discipline|E]为赛特信徒深藏于胸的秘密；局外人很少有能看穿它来靠谱地理解它的功效，只有那些其认为有用的人才被教授这种才艺。大多数吸血鬼之所以害怕赛特之子，就是因为古蛇术的力量以及它与蛇和爬行动物的联系。"
 game_concept_serpent_eyes:0 "古蛇之眼"
 game_concept_serpent_eyes_desc:0 "古蛇之眼是一种[discipline_power|E]，[shapeshift|E]子选项。赋予吸血鬼传说中古蛇的催眠目光。吸血鬼的眼睛会变成金色，并带有巨大的黑色虹膜，角色周围的凡人会发现自己被其奇怪地吸引。一位凡人如果遇到吸血鬼催眠的目光，就会无法动弹。直到该角色把其的眼睛从受害者身上移开，该人会一直被冻结在原地。"
 game_concept_serpents_flesh:0 "蛇之肌肤"
 game_concept_serpents_flesh_desc:0 "蛇之肌肤是一种[discipline_power|E]，[shapeshift|E]子技能。以此能力，吸血鬼的皮肤变得坚韧粗糙，鳞片层生，滑滑腻腻，除此之外还有怪物般的特征。它的身体变得灵巧而易变，而它则更难被伤害。"
 game_concept_godhead:0 "神性"
 game_concept_godhead_desc:0 "神性是一种[discipline_power|E]，[shapeshift|E]子选项。这一恐怖的能力给予吸血鬼神之外观。大多数赛特之子通过采取和埃及神明相似的兽首来显现这项力量，而不同赛特之子的神性都有所区别。一些选择增高一米，一些选择黄金之肤。无论怎么显现，它总是显著而令人敬畏。"
 game_concept_heart_of_darkness:0 "黑暗之心"
 game_concept_heart_of_darkness_desc:0 "黑暗之心是一种[discipline_power|E]，可以以[character_interaction|E]方式使用。吸血鬼进行一种仪式，在这种仪式中，其去掉了自己的心，变得不那么情绪化，对吸榨和尖桩免疫。"
 game_concept_ghoul:0 "血仆"
 game_concept_domitor:0 "侍主"
 game_concept_domitor_desc:0 "侍主是一个用自己的精血喂养另一个存在的吸血鬼，并对其持有血缚，而后者反过来又成为其的血奴或[ghouls|E]。"
 game_concept_Clan:0 "氏族"
 game_concept_diablerists:0 "吸榨者"
 game_concept_diablerizing:0 "吸榨"
 game_concept_diablerized:0 "吸榨"
 game_concept_Embraced:0 "初拥"
 game_concept_Clans:0 "氏族"
 game_concept_shintai_lifestyle:0 "神体"
 game_concept_shintai_lifestyle_desc:0 "$game_concept_shintai_lifestyle$适用于[GetTrait('kueijin').GetName( GetNullCharacter )]。大多数吸血鬼认为掌握了神体就表明对气的原理有了相应的理解，从而在掌握自我方面迈出了重要一步。"
 game_concept_chi_arts_lifestyle:0 "气功"
 game_concept_chi_arts_lifestyle_desc:0 "$game_concept_chi_arts_lifestyle$适用于[GetTrait('kueijin').GetName( GetNullCharacter )]。这些[disciplines|E]允许鬼人通过运转自己的气（或在某些情况下，运转他人的气或环境中的气）来施展神秘的效果。"
 game_concept_soul_arts_lifestyle:0 "灵功"
 game_concept_soul_arts_lifestyle_desc:0 "$game_concept_soul_arts_lifestyle$适用于[GetTrait('kueijin').GetName( GetNullCharacter )]。掌握灵魂[disciplines|E]]的人是真正可怕的生物，能够完成极其困难的意志壮举或直接支配其他生物的灵魂。"
 game_concept_demon_arts_lifestyle:0 "魔功"
 game_concept_demon_arts_lifestyle_desc:0 "$game_concept_demon_arts_lifestyle$适用于[GetTrait('kueijin').GetName( GetNullCharacter )]。这些[disciplines|E]起源于心魔，并由心魔提供能量。"
 game_concept_qiao_lifestyle:0 "窍"
 game_concept_qiao_lifestyle_desc:0 "$game_concept_qiao_lifestyle$适用于[GetTrait('shih').GetName( GetNullCharacter )]。窍或桥是古老的功法，通过它，狩魔人集中他们的气来完成超人的壮举。"
 game_concept_Diablerist:0 "吸榨者"
 game_concept_phobia:0 "恐惧症"
 game_concept_phobia_desc:0 "恐惧症是一种[discipline_power|E]，在战争中被动地发挥作用，在你是指挥官时给你带来优势，主要取决于你当前的恐惧值。它使人对某些东西产生非理性的恐惧。"
 game_concept_mask_of_empathy:0 "移情面具"
 game_concept_mask_of_empathy_desc:0 "同情面具是一种[discipline_power|E]，可以用来结束目标人际关系的[character_interaction|E]。切断人与人之间的情感联系。"
 game_concept_perfect_world:0 "完美世界"
 game_concept_perfect_world_desc:0 "完美世界是一种[discipline_power|E]，可以作为个人[character_interaction|E]使用，给你的首都一个增益。它使一个城市的每个人都为你的理想城市而努力。"
 game_concept_hekau_alchemy_lifestyle:0 "炼金"
 game_concept_hekau_alchemy_lifestyle_desc:0 "$game_concept_hekau_alchemy_lifestyle$适用于[GetTrait('mummy').GetName( GetNullCharacter )]。炼金术需要准备工作和奉献精神。炼金术不是简单地从袖子里掏出一个咒语，而是要去制造一个体现他所寻求的效果的产品，或者一个能诱发所需结果的产品。"
 game_concept_tan_lifestyle:0 "丹"
 game_concept_tan_lifestyle_desc:0 "$game_concept_tan_lifestyle$适用于[GetTrait('wutian').GetName( GetNullCharacter )]。由龙凤丹术所产生的力量。"
 game_concept_hekau_amulets_lifestyle:0 "护符"
 game_concept_hekau_amulets_lifestyle_desc:0 "$game_concept_hekau_amulets_lifestyle$适用于[GetTrait('mummy').GetName( GetNullCharacter )]。护符，在埃及语中也被称为麦凯特，是集中魔法力量的符咒，最常见的是用于保护人们免受邪恶、疾病或术法的侵害。"
 game_concept_hekau_celestial_lifestyle:0 "天文"
 game_concept_hekau_celestial_lifestyle_desc:0 "$game_concept_hekau_celestial_lifestyle$适用于[GetTrait('mummy').GetName( GetNullCharacter )]。天文赫考是古埃及专注于命运、天气和占星术的魔法技艺。"
 game_concept_hekau_effigy_lifestyle:0 "俑像"
 game_concept_hekau_effigy_lifestyle_desc:0 "$game_concept_hekau_effigy_lifestyle$适用于[GetTrait('mummy').GetName( GetNullCharacter )]。俑像是关于性相联系的赫考技艺，通常用被称为巫沙布提俑的人偶来施展。"
 game_concept_hekau_necromancy_lifestyle:0 "通灵"
 game_concept_hekau_necromancy_lifestyle_desc:0 "$game_concept_hekau_necromancy_lifestyle$适用于[GetTrait('mummy').GetName( GetNullCharacter )]。通灵术是塑造冥界和指挥居住在[underworld|E]的灵魂的赫考技艺。"
 game_concept_hekau_nomenclature_lifestyle:0 "术言"
 game_concept_hekau_nomenclature_lifestyle_desc:0 "$game_concept_hekau_nomenclature_lifestyle$适用于[GetTrait('mummy').GetName( GetNullCharacter )]。术言是利用真名的赫考技艺，在埃及被称为“列涅”，被用做奥秘之事。"
 game_concept_neteru:0 "奈特鲁"
 game_concept_neteru_desc:0 "$game_concept_neteru$是聚集在一位重生者身边崇拜它的密教徒。你此世的家族成员会自动成为你的奈特鲁，其他则需要你使用[character_interaction|E]来获得。奈特鲁作为凡人被赐予头衔，也可以持有木乃伊建筑，但只有你是他们的领主时才会建造这些建筑。"
 game_concept_abombwe:0 "阿本威"
 game_concept_abombwe_desc:0 "阿本威是种由莱本的阿库南斯传承和黑暗时代神秘的邦萨姆血系掌握的[discipline|E]。阿本威利用吸血鬼与自己的（以及其他人的）心兽的紧密联系并加以控制，将心兽的力量用于各种目的。"
 game_concept_penumbra:0 "半影界"
 game_concept_penumbra_desc:0 "半影界，也被称为地球之影，是直接围绕物质世界的灵性世界。许多，但非所有地形特征在那里都有镜像。"
 game_concept_astral_reaches:0 "星光界"
 game_concept_astral_reaches_desc:0 "星光界，也被称为星影界、高影界、或上影界，是思想、观念、概念的界域。"
 game_concept_dark_kingdom:0 "冥府"
 game_concept_dark_kingdom_desc:0 "冥府是[underworld|E]大风暴中的小块稳定现实区域。诸冥府中的每一个都声称对某一特定地理区域的死灵拥有统治权。"
 game_concept_shadow_realm:0 "影子国度"
 game_concept_shadow_realm_desc:0 "影子国度是木乃伊在[underworld|E]的根据地，在他们准备好再次回到在自己的身体里之前，他们会去那里进行自我再生，且在此处其等可避免怨灵或恶湍的侵袭。"
 game_concept_shard_realm:0 "碎域"
 game_concept_shard_realm_desc:0 "在天国颂歌看来，每片碎域都是太一的一部分。每片碎域都与太阳系中的一颗行星相连，并形成它自己的专属影界。每片碎域都与特定的魔法领域相通，其具有主宰地位。每片碎域也都与对应的影域相连，据传通向由某一魔法领域主导的平行宇宙。每片碎域都居住着一位强大的天神，并受其统治。"
 game_concept_dreaming:0 "梦界"
 game_concept_dreaming_desc:0 "就像度假明信片，当人类开始更相信冷酷的事实（和寒铁），而不是心血来潮和幻想时，世界的神话部分就分出了一个重叠的现实相位，被称为梦界。"
 game_concept_breedgifts_lifestyle:0 "血种"
 game_concept_breedgifts_lifestyle_desc:0 "由自然血种形态产生的力量。"
 game_concept_auspicegifts_lifestyle:0 "月兆"
 game_concept_auspicegifts_lifestyle_desc:0 "由月兆产生的力量。"
 game_concept_einherjar:0 "英灵战士"
 game_concept_einherjar_desc:0 "英灵战士是用于称呼北欧吸血鬼的术语，在崇高之主吸血鬼奥丁统治时期（大多数英灵战士认为他是只是大祭司，不是奥丁本人，而是奥丁的狂热儿子或学徒），他们坚持正在被基督教和封建主义取代的旧道。\n将这一点与普通维京战士的宿命论混合在一起，就会产生一种受困的心态。英灵战士认为自己是奥丁在米德加尔德的最后一批战士，准备在即将到来的诸神黄昏中战斗。他们所能做的就是为接下来的战斗做好准备，并以英雄的方式死去。\n北欧吸血鬼并不是简单的有氏族的维京人。北欧遗产的特殊性使英灵战士对世界的看法与他们南方的许多表亲相差甚远。宗教、社会和生活方式的差异不仅仅表现在凡人身上，他们的习惯和特征也会延续到永恒。"
 game_concept_Einherjar:0 "英灵战士"
 game_concept_ghouls:0 "血仆"
 game_concept_revenant:0 "祖传血仆"
 game_concept_revenants:0 "祖传血仆"
 game_concept_Fetter:0 "羁绊"
 game_concept_Fetters:0 "羁绊"
 game_concept_Fetter_desc:0 "羁绊是指将死灵与幽土联系在一起，使保持滞留的人、地或物。除了让死灵维持存在并防止他们陷入湮灭之外，羁绊也是死灵可以安息并重新再生[Corpus|E]的地方。\n如果羁绊被毁，死灵就失去了与幽土的主要关联，因此他们的存在变得更加不稳定。没有羁绊的死灵能待在幽土的时间并不长，因为他们没有地方充能，也没有任何东西可以将他们与自身的亡生联系起来。"
 game_concept_Corpus:0 "尸躯"
 game_concept_Corpus_desc:0 "死灵在[underworld|E]的身体被称为尸躯。它没有复杂的生物系统，而是由一种叫做灵质的材料制成，它大体上是来世的组成原料。"
 game_concept_POD_animals_maa:0 "动物"
 game_concept_POD_animals_maa_desc:0 "动物是可以通过各种方式招募的[men_at_arms|E]。\n\n它们受[archers|E]克制。"
 game_concept_POD_legendary_maa:0 "传奇"
 game_concept_POD_legendary_maa_desc:0 "传奇[men_at_arms|E]无从定义，每一种都是独一无二的。\n\n它们的独特性质意味着没有任何东西可以可靠地对抗它们，而且它们的属性通常足够强大，以至于对其他[men_at_arms|E]的克制是不必要的。\n\n由于它们的独特性质，没有任何一种地形能让它们普遍变强或变弱。"
 game_concept_POD_demonic_maa:0 "魔族"
 game_concept_POD_demonic_maa_desc:0 "魔族[men_at_arms|E]代表着地狱之力。\n\n因此，它们的种类太多，无法普遍克制任何东西，但它们自己会被那些专门对抗地狱之力者所克制。\n\n同样，我们也不可能说任何一种地形类型对这些军团都是有利的。"
 game_concept_POD_spirit_maa:0 "灵类"
 game_concept_POD_spirit_maa_desc:0 "灵类[men_at_arms|E]是一种无肉体的虚体，起源于并通常居住在影界中——由于这个原因，一些法师称它们为“影族”。\n\n它们的虚体性意味着如果没有特殊手段，它们是不可能被克制的。\n\n它们的虚体状态也意味着灵类通常不会受到地形的不利影响，在冰冻的荒地和在炙热的沙漠中一样自如。"
 game_concept_POD_shapeshifter_maa:0 "化形者"
 game_concept_POD_shapeshifter_maa_desc:0 "狼族是由盖亚创造的，作为她的獠牙和爪子，以保护她的安全，但他们并不是她唯一的孩子。她创造了许多其他品种的化形者，并分别赋予他们使命。有些人随着时间的流逝而迷失了方向；有些人则是被狼族逼迫离开他们的职务。有些人转而只为三相的一面服务，而不是为整个盖亚服务。\n\n化形者的种类跟他们的化形对象一样多，所以唯一可靠的对策是了解你所面对的那种超自然的弱点。\n\n与他们克制和被克制的地方相同，化形者的地形适应也有很大差异。"
 game_concept_POD_gargoyle_maa:0 "石像鬼"
 game_concept_POD_gargoyle_maa_desc:0 "石像鬼是由血系创造的吸血鬼血系，是他们的仆人。虽然在实际上不是睿魔尔血系，但该血系在很大程度上受他们的控制。\n\n石像鬼的飞行能力给常规部队带来了独特的麻烦，因为打击飞行敌人的训练并不是大多数操练的一部分。\n\n石像鬼能够飞行意味着他们可以避开许多由地形带来的问题，同时还能利用其的优势。"
 game_concept_POD_ghoul_maa:0 "血仆"
 game_concept_POD_ghoul_maa_desc:0 "血仆是用来描述当吸血鬼在没有先吸干时凡人时给出一点吸血鬼精血而产生的爪牙，否则将会导致初拥。\n\n血仆不仅包括被赋予吸血鬼精血的普通人类，还包括棘秘魑使用的所谓战争血仆，因此对付某些血仆就像对付普通人类一样容易，其他的，如怪物般的什拉赫塔，则更难。\n\n地形对血仆的影响取决于它们的躯体形态。"
 game_concept_packmember:0 "战群成员"
 game_concept_packmember_desc:0 "战群是狼族社会的基本社会单位。它是一个由狼人组成的小团体，通过友谊和使命的纽带而不是文化的纽带相互结合。\n在游戏中，你最多可以挑选四位战群成员（只要他们足够欣赏你），与你终身绑定。之后你便能你使用专属次要决议来与他们互动。"
 game_concept_thrall:0 "魔奴"
 game_concept_thrall_desc:0 "$game_concept_thrall$是恶魔的凡人仆人。恶魔从野心家、复仇者、残废者和被遗弃者中获取魔奴；那些感到被世界欺骗、被剥夺了应有生活的男人和女人。"
 game_concept_shade_realm:0 "影域"
 game_concept_shade_realm_desc:0 "影域，也被称作幻域，是一个由单一魔法领域主导的影界界域。每个影域都与阳系中的一颗行星的[shard_realm|E]相连，但在地球的穹界显现——就像一片云彩投射在地面上的阴影。"
 game_concept_abomination:0 "恶煞"
 game_concept_abomination_desc:0 "恶煞是一个用来描述被转为吸血鬼的化形者的术语。不用说，这些生物是非常罕见的，因为几乎所有的化兽族裔都对吸血鬼精血剧烈过敏。恶煞同时受到狼族和吸血鬼的忌讳，而且精神上也总是非常不稳定。\n在游戏中，恶煞被视为不能[Embrace|E]的吸血鬼，但保留了血种灵赋和月兆灵赋，以及化形能力。"
 game_concept_POD_plasmic_maa:0 "灵质体"
 game_concept_POD_plasmic_maa_desc:0 "[underworld|E]的“生命体”；具体而言，任何由灵质组成的独立生物。"
 game_concept_godbodies_lifestyle:0 "圣体"
 game_concept_godbodies_lifestyle_desc:0 "$game_concept_shintai_lifestyle$适用于[GetTrait('kueijin').GetName( GetNullCharacter )]。圣体是现代的神体的前身，是第四纪元时期鬼人社会的重要异能。与他们的现代形态相比，圣体与鬼人之间的元素联系更为明显，更像是原本万仙所挥舞的力量。"
 game_concept_Clan's:0 "氏族的"
 game_concept_grace:0 "恩惠"
 game_concept_grace_i:0 "@grace_icon!"
 game_concept_grace_desc:0 "该影界实体对你的青睐程度。"
 game_concept_world_of_darkness:0 "黑暗世界"
 game_concept_WoD:0 "黑暗世界"
 game_concept_world_of_darkness_desc:0 "《黑暗世界》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在现实世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。"
 game_concept_Ghoul:0 "血仆"
 game_concept_Ghoul_desc:0 "当吸血鬼将自己的血喂给另一个生物后，该生物就将成为血仆，并获得一些好处：停止衰老，有时甚至会稍微变得年轻；有限地获得[disciplines|E]和更快的愈合。然而，血仆依赖于血，因为他们在停止服用时将恢复到他们的真实年龄，这有时会是致命的。通过血缚的控制是侍主管理血仆的主要方式——或者更传统的技巧，如支配术。当然，作为血仆最恶心的部分是，人类成了非人怪物的奴隶，其把人类当作棋子或怡情的小点心。"
 game_concept_Revenant:0 "祖传血仆"
 game_concept_Revenant_desc:0 "祖传血仆是一种混杂生物，既像又不像凡人，[ghouls|E]和吸血鬼。有人会说祖传血仆介于凡人和吸血鬼之间；也有人会说它是受该隐诅咒腐化的上帝造物，两者混合在一起，直到它们变得不可分割。尽管如此，祖传血仆具有吸血鬼和凡人的许多特质，也具有普通血仆的许多特征。祖传血仆与血仆不同，能但不需要喝吸血鬼的血，因为他们可以自己产生精血，这也可以延缓他们的衰老。\n与他们的主人不同，祖传血仆是活着的生物。像凡人一样，他们需要进食、睡觉和呼吸。他们能够进行有性繁殖。与凡人不同的是，他们更加坚韧，并能从该隐的印记中获得超自然的力量。"
 game_concept_bind_wraith_interaction:0 "缚灵互动"
 game_concept_bind_wraith_interaction_desc:0 "一个允许角色缚灵[GetTrait('wraith').GetName( GetNullCharacter )]以便之后命令其的互动。"
 game_concept_marked_for_return_interaction:0 "还魂标记互动"
 game_concept_marked_for_return_interaction_desc:0 "一个允许让另一个角色在其死后变为[GetTrait('wraith').GetName( GetNullCharacter )]的互动。"
 game_concept_send_to_shadowland_interaction:0 "送还幽土互动"
 game_concept_send_to_shadowland_interaction_desc:0 "一个允许让受缚[GetTrait('wraith').GetName( GetNullCharacter )]被送往幽土以便让其不会要求压力来维持的互动。"
 game_concept_pattern_spheres_lifestyle:0 "式样领域"
 game_concept_pattern_spheres_lifestyle_desc:0 "$game_concept_pattern_spheres_lifestyle$适用于[GetTrait('mage').GetName( GetNullCharacter )]。构成物理世界的领域——力场、生命和物质。"
 game_concept_foundational_spheres_lifestyle:0 "根基领域"
 game_concept_foundational_spheres_lifestyle_desc:0 "$game_concept_foundational_spheres_lifestyle$适用于[GetTrait('mage').GetName( GetNullCharacter )]。构成存在本身的基础的领域——空间、时间和原质。"
 game_concept_spiritual_spheres_lifestyle:0 "灵性领域"
 game_concept_spiritual_spheres_lifestyle_desc:0 "$game_concept_spiritual_spheres_lifestyle$适用于[GetTrait('mage').GetName( GetNullCharacter )]。构成命运、思想和灵魂的国度的领域——精魂、熵和心智。"
 game_concept_reliquarie:0 "宿匣"
 game_concept_reliquarie_desc:0 "若该宝物被摧毁，附身于此的[GetTrait('demon').GetName( GetNullCharacter )]将失去[GetTrait('earthbound').GetName( GetNullCharacter )][trait|E]。"
 game_concept_underworld:0 "冥界"
 game_concept_yin_world:0 "阴界"
 game_concept_underworld_desc:0 "冥界，也被称为暗影界或狱界，是亡者与回忆的领域。"
 game_concept_POD_faerie_maa:0 "妖精"
 game_concept_POD_faerie_maa_desc:0 "非换生灵经常交替使用仙灵、妖精和精类等术语来指称换生灵和真妖精。"
 game_concept_POD_chimera_maa:0 "活化奇魅"
 game_concept_POD_chimera_maa_desc:0 "活化奇魅就是具有生命或生命外观的奇魅。"
 game_concept_dreamer:0 "梦员"
 game_concept_dreamer_desc:0 "在戚族中，梦员可以是任何凡人的统称，但更多的是指那些表现出创意火花的凡人，或者没有被板讷磨灭到情感迟钝的程度的人。梦员是戚族的主要梦华来源，因此是一种受保护的资源。"