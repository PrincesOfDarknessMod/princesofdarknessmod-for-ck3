l_simp_chinese:
 game_concept_princes_of_darkness: "黑暗亲王"
 game_concept_princes_of_darkness_desc: "十字军之王3的Mod，设定取自P社旗下白狼公司的《[Glossary('黑暗世界','game_concept_world_of_darkness_desc')]》跑团规则。正是你现在所玩的！[Glossary('Prince','game_concept_prince_desc')]是具有领地的[GetTrait('vampire').GetName( GetNullCharacter )]的主要头衔，相等于十字军之王3的[duchy|E]。何处黑暗？取决于你。"
 game_concept_prince: "亲王"
 game_concept_princes: "亲王"
 game_concept_prince_desc: "亲王是具有领地的[GetTrait('vampire').GetName( GetNullCharacter )]的主要头衔，相等于十字军之王3的[duchy|E]。"
 game_concept_blood_potency: "血能"
 game_concept_vampgeneration: "世代"
 game_concept_vampgeneration_desc: "依据[Glossary('该隐之子','game_concept_cainite_desc')]，这是[GetTrait('vampire').GetName( GetNullCharacter )]的血脉与所有$POD_splat_vampire_plural$之父——该隐的距离。该隐属于[GetTrait('vampgeneration1').GetName( GetNullCharacter )]。[GetTrait('vampgeneration14').GetName( GetNullCharacter )]或更后的吸血鬼都是“淡血种”，更近似人类而非吸血鬼。不信该隐的吸血鬼都将他们的[Glossary('世代','game_concept_vampgeneration_desc')]追溯至一些源自其他神话的始祖。吸血鬼可以减少他们的[Glossary('世代','game_concept_vampgeneration_desc')]，也可以通过对有比他们有更前[Glossary('世代','game_concept_vampgeneration_desc')]的吸血鬼实施[Glossary('血律','game_concept_diablerie_desc')]，来增加他们的潜在能力。"
 game_concept_bloodbond: "血缚"
 game_concept_bloodbond_desc: "喝下[GetTrait('vampire').GetName( GetNullCharacter )]的血一般会使其对[GetTrait('vampire').GetName( GetNullCharacter )]建立一种强烈的忠心和遵从感。也称血誓，这就像一个牵制，强度越高，消耗越多的血液。有些吸血鬼无法用自己的血建立联系。另一些吸血鬼则完全不可被束缚。"
 game_concept_beast: "心兽"
 game_concept_the_beast: "心兽"
 game_concept_beast_desc: "#bold 心兽#!是被$POD_splat_vampire_plural$用来描述那个试图控制$pod_cainites$的内在掠食者的术语。那是一只伴随着每个[GetTrait('vampire').GetName( GetNullCharacter )][Embrace|E]而觉醒的与生俱来的恶魔般的掠食者。它与吸血鬼的人性（在某些情况下是教化心路）直接对立，是许多[Glossary('该隐之子','game_concept_cainite_desc')]每晚都会感到的堕落冲动的罪魁祸首。\n\n在压力极高的情况下，心兽可以压垮一位[GetTrait('vampire').GetName( GetNullCharacter )]，并强迫其陷入回归兽性的狂暴（血狂）或逃亡（赤骇）。\n\n在[princes_of_darkness|E]，心兽有时会#beast 如此#!说话。如果一位[GetTrait('vampire').GetName( GetNullCharacter )]有负[piety|E]，其会有风险陷入永久的血狂并变成一只[GetTrait('wight').GetName( GetNullCharacter )]。这将使其退位给其的[heir|E]。"
 game_concept_the_masquerade: "潜藏"
 game_concept_resonance: "共鸣"
 game_concept_resonance_desc: "血液根据其容器的个性和情感而有着既定的特性。吸血会根据共鸣来赋予$POD_splat_vampire_plural$能力。你会因吸特定共鸣的血液或使用特定的[discipline|E]得到更多[discipline|E]经验。这些共鸣是：\n$BULLET_WITH_TAB$$choleric_lifestyle$\n$BULLET_WITH_TAB$$melancholy_lifestyle$\n$BULLET_WITH_TAB$$phlegmatic_lifestyle$\n$BULLET_WITH_TAB$$sanguine_lifestyle$\n$BULLET_WITH_TAB$$animal_lifestyle$"
 game_concept_torpor: "蛰眠"
 game_concept_torpor_desc: "蛰眠是[GetTrait('vampire').GetName( GetNullCharacter )]停止活动的情形。他在不能动时，还可以感觉到他周围所发生的事情。它可以由刺穿心脏的尖桩、足够的身体损伤、巨大的饥渴感或倦怠感引起。\n一个具有蛰眠特质的角色会被严重削弱，不能进行大多数行动，也不能统治。他们可以被“寻找藏身处”[character_interaction|E]所唤醒。"
 game_concept_torpid: "蛰眠"
 game_concept_hunger: "饥渴"
 game_concept_hunger_desc: "$game_concept_hunger$是一个[GetTrait('vampire').GetName( GetNullCharacter )]想要进食血液的欲望。这是由于[Glossary('心兽','game_concept_beast_desc')]而产生。随着一个[GetTrait('vampire').GetName( GetNullCharacter )]的$game_concept_bloodpotency$越高，降低他们的$game_concept_hunger$就需要越多的血液。增加$game_concept_hunger$对一个[GetTrait('vampire').GetName( GetNullCharacter )]同时有着正面和极大负面影响。唯一全面满足[GetTrait('vampire').GetName( GetNullCharacter )]的$game_concept_hunger$的方法是杀戮并吸光受害者所有的血液。即使这样$game_concept_hunger$的满足也只是暂时的。。"
 game_concept_discipline: "血律"
 game_concept_disciplines: "血律"
 game_concept_discipline_desc: "被称为“血律”的吸血鬼力量的起源是未知的，但许多人认为它们是该隐或莉莉丝的赠礼，通常认为一些[Glossary('上古耆宿','game_concept_antediluvian_desc')]发明了独创的血律，并通过他们的世系传承下来。还有人认为它们是不死族之身与生俱来的力量。\n在游戏中，血律被处理成生活方式树，你可以通过其解锁能力。要开启其中一棵树，你必须有相应的血律特质。这些树的XP通过猎食凡人时获得的血液共鸣增加。"
 game_concept_choleric_lifestyle: "胆汁质共鸣"
 game_concept_choleric_lifestyle_desc: "胆汁质生活方式适用于某些通过吸食带有愤怒或嫉妒的情感的血液来改善[Glossary('血律','game_concept_discipline_desc')]的$POD_splat_vampire_plural$。其寻找带有类似[GetTrait('wrathful').GetName( GetNullCharacter )]和[GetTrait('sadistic').GetName( GetNullCharacter )]性格[traits|E]的猎物。\n\n常见[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('celerity').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('potence').GetName( GetNullCharacter )]\n\n稀有[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('valeren').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('vicissitude').GetName( GetNullCharacter )]"
 game_concept_sanguine_lifestyle: "多血质共鸣"
 game_concept_sanguine_lifestyle_desc: "多血质生活方式适用于某些通过吸食带有幸福和热情的情感的血液来改善[Glossary('血律','game_concept_discipline_desc')]的$POD_splat_vampire_plural$。其寻找带有类似[GetTrait('gregarious').GetName( GetNullCharacter )]和[GetTrait('lustful').GetName( GetNullCharacter )]性格[traits|E]的猎物。\n\n常见[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('presence').GetName( GetNullCharacter )]\n\n稀有[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('bloodsorcery').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('daimonion').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('kai').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('quietus').GetName( GetNullCharacter )]"
 game_concept_phlegmatic_lifestyle: "黏液质共鸣"
 game_concept_phlegmatic_lifestyle_desc: "黏液质生活方式适用于通过吸食带有多愁善感和控制的情感的血液来改善[Glossary('血律','game_concept_discipline_desc')]的$POD_splat_vampire_plural$。其寻找带有类似[GetTrait('lazy').GetName( GetNullCharacter )]和[GetTrait('content').GetName( GetNullCharacter )]性格[traits|E]的猎物。\n\n常见[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('auspex').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('dominate').GetName( GetNullCharacter )]\n\n稀有[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('dementation').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('melpominee').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('mytherceria').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('temporis').GetName( GetNullCharacter )]"
 game_concept_melancholy_lifestyle: "抑郁质共鸣"
 game_concept_melancholy_lifestyle_desc: "抑郁质生活方式适用于某些通过吸食带有悲伤和理智的情感的血液来改善[Glossary('血律','game_concept_discipline_desc')]的$POD_splat_vampire_plural$。其寻找带有类似[GetTrait('shy').GetName( GetNullCharacter )]和[GetTrait('craven').GetName( GetNullCharacter )]性格[traits|E]的猎物。\n\n常见[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('fortitude').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obfuscate').GetName( GetNullCharacter )]\n\n稀有[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('bardo').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('chimerstry').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('necromancy').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obtenebration').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('rift').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('visceratika').GetName( GetNullCharacter )]"
 game_concept_animal_lifestyle: "兽性共鸣"
 game_concept_animal_lifestyle_desc: "兽性生活方式适用于某些通过从动物来吸食改善[Glossary('血律','game_concept_discipline_desc')]的$POD_splat_vampire_plural$。其寻找动物作为猎物。\n\n常见[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('animalism').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('protean').GetName( GetNullCharacter )]\n\n稀有[Glossary('血律','game_concept_discipline_desc')]包括：\n$BULLET_WITH_TAB$[GetTrait('abombwe').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('serpentis').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('spiritus').GetName( GetNullCharacter )]\n\n[GetTrait('flight').GetName( GetNullCharacter )][Glossary('血律','game_concept_discipline_desc')]是某些#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!的专属能力。"
 game_concept_diablerize: "吸榨"
 game_concept_blood_draught: "血剂"
 game_concept_blood_draught_desc: "吸血鬼的血能够通过[Glossary('血律','game_concept_discipline_desc')]被萃取，给予任何饮下它的人各种增强。与血剂相关的动作是通过[character_interaction|E]进行的。"
 game_concept_shapeshift: "变形"
 game_concept_shapeshift_desc: "一种允许使用者以某种方式变化形态的[character_interaction|E]，通常包含在[GetTrait('protean').GetName( GetNullCharacter )]或[GetTrait('vicissitude').GetName( GetNullCharacter )]中。"
 game_concept_faith_lifestyle: "真信"
 game_concept_faith_lifestyle_desc: "极度狂热角色的奇异天赋，真信特质启用同名生活方式，在其中可以通过对应的生活方式经验获得各种能力。"
 game_concept_bloodsorcery: "血术法"
 game_concept_thaumaturgy: "奇术"
 game_concept_durnaki: "杜–安–奇"
 game_concept_bloodsorcery_desc: "血术法，也被称为奇术、赫考、杜–安–奇等，是一种利用吸血鬼的精血来唤起强大魔法效果的艺法。血术法是一种强大但危险且昂贵的工具，它由少数$pod_Clans$所拥有，并被小心守护。每个派系都有自己召唤血之力的方式——睿魔尔使用赫耳墨斯魔法和符号，哈基姆圣裔的术士与灵和神签订契约，而勒森魃则坠入深渊以召唤奥秘。据说血术法有能做近乎任何事情——虽然这些声明通常来自于希望创造一个可怕的景象的实践者或诅咒和火球的受害者，但的确，血术法可以提供无数的法术和能力，有些可以被认作……非自然。"
 game_concept_necromancy: "亡灵术"
 game_concept_possession: "附身"
 game_concept_possess: "附身"
 game_concept_possession_desc: "死灵获得身体所有权的过程。附身成功与否取决于死灵和受害者之间的决斗。附身分为三个阶段，所以可以对同一个人多次使用（当然，如果你使用的是相同的死灵）。如果受缚于你的幽灵附身于一个受害者，目标也会受缚于你。附身阶段：\n1. 第一阶段，受害者获得一些死灵的勇武在他们自己之上，并且亡灵术师和死灵获得对受害者的影响力。\n2. 第二阶段，给予受害者一些死灵的能力，给予他们一部分幽灵特性。亡灵术师对受害者拥有更多的控制。此外，死灵和受害者的个性开始融合在一起。\n3. 第三阶段，完全附身，死灵的人格覆盖了目标。受害者被死灵奴役，并获得更多的属性能力，因为幽灵通过其行动。亡灵术师的控制进一步增强。"
 game_concept_necromancy_desc: "亡灵术是一种$pod_bloodsorcery$，专门针对死者，[UmbraGlossaryLocalized('shadowlands','冥界')]和死灵。\n通过使用湮灭和深渊的力量，亡灵术师可以缚灵死灵用于他们的意愿，并命令他们执行各种各样的任务——从间谍到$pod_possession$。"
 game_concept_endowments_lifestyle: "信念生活方式"
 game_concept_endowments_lifestyle_desc: "信念代表着裁判官在掌握修会的消灭地狱仆从的方法的道途上所取得的进步。"
 game_concept_obtenebration: "幽暗术"
 game_concept_obtenebration_desc: "幽暗术，控制和操纵影子的力量，是给予了暗影之[Glossary('氏族','game_concept_Clan_desc')]其前缀的[Glossary('血律','game_concept_discipline_desc')]。该术入门者可以利用它来移动和操纵影子，使之成为自己的优势，而大师们则可以赋予影子以形态、物质和生命的模样。这种力量的来源的性质在勒森魃中引起了无尽的争论。该[Glossary('氏族','game_concept_Clan_desc')]最古老的长者声称，黑暗本身就是一个原始的实体，与创造世界的力量相等且相反。受祆教的影响，最年长的人通常称这种黑暗力量为阿里曼。其他的勒森魃认为幽暗术的力量来自于某个暗影界域，而不是个实体。信仰亚伯拉罕诸教的勒森魃可能会称该国度为地狱，而信奉古希腊或罗马神的人可能会称它为塔尔塔罗斯。不管起源是什么，幽暗术对于那些看到它被使用的人来说是完全令人不安的。看到[Glossary('血律','game_concept_discipline_desc')]的使用的动物或凡人会感到恐惧。即使是[Glossary('该隐之子','game_concept_cainite_desc')]，若要解释，也倾向于将幽暗术视为对自然法则的侮辱。"
 game_concept_elder_perk: "长者技能"
 game_concept_elder_perk_desc: "长者技能是只有[Glossary('Generation','game_concept_vampgeneration_desc')]最够前到足以唤醒其血液的真正潜力的$POD_splat_vampire_plural$才能获得的[perks|E]。"
 game_concept_daimonion: "崇魔术"
 game_concept_daimonion_desc: "巴力之血中流淌并歌唱着呓语，自深缚于大地之低语中剥离，从首位呼唤深渊的术士的喉间扯下。崇魔术是跨越天地的呼喊——从我们的世界延伸至被遗忘的某处，而力量则从那一所在回响于我们的世界。某天，巴力血系将会尖啸，然后响声击碎世界。现在，他们用崇魔术轻柔地催人入睡，然后让他们梦遇火焰与黑暗。"
 game_concept_Sire: "尊长"
 game_concept_Sire_desc: "成功[Glossary('初拥','game_concept_Embrace_desc')]凡人的吸血鬼被称为该凡人的“尊长”。这种关系接近于凡人世界中的父母/孩子。和该关系一样，它可以采取多种表达，从工作同伙到直接仇恨。\n在本MoD中，这取代了$POD_splat_vampire_plural$的“父母/孩子”关系，因为他们不能自然生子。"
 game_concept_Embrace: "初拥"
 game_concept_Embrace_desc: "吸血鬼如果在吸干了凡人所有的血之后才给凡人喝下自己的血，就会把他们变成吸血鬼。这个过程被称为“初拥”，它将在新的[Glossary('尊长','game_concept_Sire_desc')]和他的新子嗣之间建立起牢固的联系。\n在MOD中，你可以右键点击你所在地区的任何一个凡人，启动一个初拥计谋。一旦完成，你将把这个凡人变成你自己的吸血鬼子嗣，游戏将其表现为一种父母/孩子关系。"
 game_concept_cainites: "该隐之子"
 game_concept_cainite: "该隐之子"
 game_concept_cainite_desc: "大多数$POD_splat_vampire_plural$同意“该隐即起源的故事”。圣经中的第一个杀人犯，在杀死自己的兄弟亚伯后，被天主和他的天使以各种方式诅咒，最终导致了今天已知的吸血鬼状况。\n因此，该隐之子已经成为吸血鬼描述自己的一个非常常用的术语。"
 game_concept_diablerist: "吸榨者"
 game_concept_diablerie: "吸榨"
 game_concept_diablerie_desc: "吸血鬼能犯下的最令人发指的罪行，当一位吸血鬼的所有血液被另一位吸血鬼吸食，导致受害者的灵魂也被吞噬时，就发生了吸榨。这个过程虽然被大多数人所不齿，但却能使犯罪者获得更大的力量，因为他们可以学习受害者的一些能力或减少他们的世代，使他们更接近该隐。\n在游戏中，吸榨是一个可以用来对付其他$POD_splat_vampire_plural$的计谋。如果你设法成功，你可以得到新的能力，增加血能，减少世代，但代价是大量的虔诚（取决于你的宗教）和一个从当下开始携带的难言秘密。"
 game_concept_Clan_desc: "氏族是一个用来描述$POD_splat_vampire_plural$和$glossary_clan_curse$的主要群体的术语，他们拥有由血液传递的共同特征。一名吸血鬼的氏族是他的世系，是他被[Glossary('初拥','game_concept_Embrace_desc')]在的吸血鬼“家族”。吸血鬼社会通常承认今夜有十三氏族，尽管有些可能已经消失在历史中，有些可能存在于隐秘之中，有些可能从未被人所知。\n像所有的血系一样，每个氏族都更专精于三项[Glossary('血律','game_concept_discipline_desc')]，一个氏族的弱点是其成员基本都特有的，以及由于倾向于[Glossary('初拥','game_concept_Embrace_desc')]具有某些特征的个人而都归有刻板印象。"
 game_concept_ashirra: "阿什拉派"
 game_concept_ashirra_desc: "阿什拉派（来自阿拉伯语的“氏族”一词）是信仰真主的伊斯兰$POD_splat_vampire_plural$教派，在凡人的穆斯林土地上有很强的影响力。阿什拉派的成员相信，如果他们选择追随真主，就会得到救赎，这是穆罕默德的承诺之一。虽然有些吸血鬼是真正的伊斯兰教信徒，但绝大多数参与阿什拉派的人都只是为了方便才拜伊斯兰教，或者只是为了更容易在中东地区活动。\n在某些情况下，阿什拉派可以用来指代任何遵循伊斯兰教的吸血鬼。"
 game_concept_antediluvian: "上古耆宿"
 game_concept_antediluvian_desc: "也被译作真祖，原文意为“大洪水之前”，该词可以适用于任何大洪水之前的[Glossary('该隐之子','game_concept_cainite_desc')]，如该隐或次代，但它几乎总是被用来特指三代，十三[Glossary('氏族','game_concept_Clan_desc')]是他们的后代。他们是具有不可估量的力量的生物。\n据推测，上古耆宿的年龄和血能使他们拥有近乎神的力量，事实上他们中的一些人就是神明。很少有关于其力量的使用的记录，但传说中通常将他们描绘成不可战胜的。有些人甚至认为，这种生物被杀死的唯一方法是他们希望被杀死，或者是在另一位上古耆宿的手中。"
 game_concept_antediluvians: "上古耆宿"
 game_concept_serpentis: "古蛇术"
 game_concept_serpentis_desc: "古蛇术是赛特恐怖的传承。这门[Glossary('血律','game_concept_discipline_desc')]为赛特信徒深藏于胸的秘密；局外人很少有能看穿它来靠谱地理解它的功效，只有那些其认为有用的人才被教授这种才艺。大多数吸血鬼之所以害怕赛特之子，就是因为古蛇术的力量以及它与蛇和爬行动物的联系。"
 game_concept_ghoul: "血仆"
 game_concept_domitor: "侍主"
 game_concept_domitor_desc: "侍主是一个用自己的精血喂养另一个存在的吸血鬼，并对其持有血缚，而后者反过来又成为其的血奴或$pod_ghouls$。"
 game_concept_Clan: "氏族"
 game_concept_diablerizing: "吸榨"
 game_concept_diablerized: "吸榨"
 game_concept_Embraced: "初拥"
 game_concept_Clans: "氏族"
 game_concept_shintai_lifestyle: "神体"
 game_concept_shintai_lifestyle_desc: "神体于[Glossary('Fifth Age','game_concept_fifth_age_desc')]（1250年后）被研发，适用于$POD_splat_kueijin_plural$。大多数吸血鬼认为掌握了神体就表明对气的原理有了相应的理解，从而在掌握自我方面迈出了重要一步。"
 game_concept_chi_arts_lifestyle: "气功"
 game_concept_chi_arts_lifestyle_desc: "气功适用于$POD_splat_kueijin_plural$。这些$pod_disciplines$允许[GetTrait('kueijin').GetName( GetNullCharacter )]通过运转自己的气（或在某些情况下，运转他人的气或环境中的气）来施展神秘的效果。"
 game_concept_soul_arts_lifestyle: "灵功"
 game_concept_soul_arts_lifestyle_desc: "灵功适用于$POD_splat_kueijin_plural$。掌握灵魂$pod_disciplines$的人是真正可怕的生物，能够完成极其困难的意志壮举或直接支配其他生物的灵魂。"
 game_concept_demon_arts_lifestyle: "魔功"
 game_concept_demon_arts_lifestyle_desc: "魔功适用于$POD_splat_kueijin_plural$。这些$pod_disciplines$起源于心魔，并由心魔提供能量。"
 game_concept_qiao_lifestyle: "窍"
 game_concept_qiao_lifestyle_desc: "窍功适用于[GetTrait('shih').GetName( GetNullCharacter )]。窍或桥是古老的功法，通过它，狩魔人集中他们的气来完成超人的壮举。"
 game_concept_hekau_alchemy_lifestyle: "炼金赫考"
 game_concept_hekau_alchemy_lifestyle_desc: "炼金赫考适用于$POD_splat_mummy_plural$。炼金术需要准备工作和奉献精神。炼金术不是简单地从袖子里掏出一个咒语，而是要去制造一个体现他所寻求的效果的产品，或者一个能诱发所需结果的产品。"
 game_concept_tan_lifestyle: "丹"
 game_concept_tan_lifestyle_desc: "丹术适用于[GetTrait('wutian').GetName( GetNullCharacter )]。由龙凤丹术所产生的力量。"
 game_concept_hekau_amulets_lifestyle: "护符赫考"
 game_concept_hekau_amulets_lifestyle_desc: "护符赫考适用于$POD_splat_mummy_plural$。护符，在埃及语中也被称为麦凯特，是集中魔法力量的符咒，最常见的是用于保护人们免受邪恶、疾病或术法的侵害。"
 game_concept_hekau_celestial_lifestyle: "天文赫考"
 game_concept_hekau_celestial_lifestyle_desc: "天文赫考适用于$POD_splat_mummy_plural$。天文赫考是古埃及专注于命运、天气和占星术的魔法技艺。"
 game_concept_hekau_effigy_lifestyle: "俑像赫考"
 game_concept_hekau_effigy_lifestyle_desc: "俑像赫考适用于$POD_splat_mummy_plural$。俑像是关于性相联系的赫考技艺，通常用被称为巫沙布提俑的人偶来施展。"
 game_concept_hekau_necromancy_lifestyle: "通灵赫考"
 game_concept_hekau_necromancy_lifestyle_desc: "通灵赫考适用于$POD_splat_mummy_plural$。通灵术是塑造冥界和指挥居住在[UmbraGlossaryLocalized('shadowlands','冥界')]的灵魂的赫考技艺。"
 game_concept_hekau_nomenclature_lifestyle: "术言赫考"
 game_concept_hekau_nomenclature_lifestyle_desc: "术言赫考适用于$POD_splat_mummy_plural$。术言是利用真名的赫考技艺，在埃及被称为“列涅”，被用做奥秘之事。"
 game_concept_neteru: "奈特鲁"
 game_concept_neteru_desc: "#bold 奈特鲁#!是聚集在一位重生者身边崇拜它的密教徒。你此世的家族成员会自动成为你的奈特鲁，其他则需要你使用[character_interaction|E]来获得。奈特鲁作为凡人被赐予头衔，也可以持有木乃伊建筑，但只有你是他们的领主时才会建造这些建筑。"
 game_concept_abombwe: "阿本威"
 game_concept_abombwe_desc: "阿本威是种由莱本的阿库南斯传承和黑暗时代神秘的邦萨姆血系掌握的[discipline|E]。阿本威利用吸血鬼与自己的（以及其他人的）心兽的紧密联系并加以控制，将心兽的力量用于各种目的。"
 game_concept_dark_kingdom: "冥府"
 game_concept_dark_kingdom_desc: "冥府是[UmbraGlossaryLocalized('shadowlands','冥界')][UmbraGlossary('pod_realm_tempest')]中的小块稳定现实区域。诸冥府中的每一个都声称对某一特定地理区域的死灵拥有统治权。"
 game_concept_shard_realm: "碎域"
 game_concept_shard_realm_desc: "在秘学九宗的魔法宇宙学中，太阳系中的行星与诸神、能量、地球现象和魔法领域有关。当然，科学试图剥离这些联系，取而代之的是对冰冷、死寂太空的测量。然而，即便如此，行星之力的壮观景象也无法完全消除人们的好奇心。\n每片碎域都与太阳系中的一颗行星相连，并形成它自己的专属影界。每片碎域都与特定的魔法领域相通，其具有主宰地位。每片碎域也都与对应的[Glossary('影域','game_concept_shade_realm_desc')]相连，据传通向由某一魔法领域主导的平行宇宙。每片碎域都居住着一位强大的天神，并受其统治。"
 game_concept_breedgifts_lifestyle: "血种灵赋"
 game_concept_breedgifts_lifestyle_desc: "由自然血种形态产生的力量。"
 game_concept_einherjar: "英灵战士"
 game_concept_einherjar_desc: "英灵战士是用于称呼北欧$POD_splat_vampire_plural$的术语，在崇高之主吸血鬼奥丁统治时期（大多数英灵战士认为他是只是大祭司，不是奥丁本人，而是奥丁的狂热儿子或学徒），他们坚持正在被基督教和封建主义取代的旧道。\n将这一点与普通维京战士的宿命论混合在一起，就会产生一种受困的心态。英灵战士认为自己是奥丁在米德加尔德的最后一批战士，准备在即将到来的诸神黄昏中战斗。他们所能做的就是为接下来的战斗做好准备，并以英雄的方式死去。\n北欧吸血鬼并不是简单的有氏族的维京人。北欧遗产的特殊性使英灵战士对世界的看法与他们南方的许多表亲相差甚远。宗教、社会和生活方式的差异不仅仅表现在凡人身上，他们的习惯和特征也会延续到永恒。"
 game_concept_ghouls: "血仆"
 game_concept_revenant: "遗传血仆"
 game_concept_revenants: "遗传血仆"
 game_concept_Fetter: "羁绊"
 game_concept_Fetters: "羁绊"
 game_concept_Fetter_desc: "羁绊是指将死灵与[UmbraGlossary('shadowlands')]联系在一起，使保持滞留的人、地或物。除了让死灵维持存在并防止他们陷入[UmbraGlossary('oblivion')]之外，羁绊也是死灵可以安息并重新再生[Corpus|E]的地方。\n如果羁绊被毁，死灵就失去了与[UmbraGlossary('shadowlands')]的主要关联，因此他们的存在变得更加不稳定。没有羁绊的死灵能待在[UmbraGlossary('shadowlands')]的时间并不长，因为他们没有地方充能，也没有任何东西可以将他们与自身的亡生联系起来。"
 game_concept_Corpus: "尸躯"
 game_concept_Corpus_desc: "死灵在[UmbraGlossaryLocalized('shadowlands','冥界')]的身体被称为尸躯。它没有复杂的生物系统，而是由一种叫做灵质的材料制成，它大体上是来世的组成原料。"
 game_concept_POD_animals_maa: "动物"
 game_concept_POD_animals_maa_desc: "动物是可以通过各种方式招募的[men_at_arms|E]。\n\n它们受[archers|E]克制。"
 game_concept_POD_legendary_maa: "传奇"
 game_concept_POD_legendary_maa_desc: "传奇[men_at_arms|E]无从定义，每一种都是独一无二的。\n\n它们的独特性质意味着没有任何东西可以可靠地对抗它们，而且它们的属性通常足够强大，以至于对其他[men_at_arms|E]的克制是不必要的。\n\n由于它们的独特性质，没有任何一种地形能让它们普遍变强或变弱。"
 game_concept_POD_demonic_maa: "魔族"
 game_concept_POD_demonic_maa_desc: "魔族[men_at_arms|E]代表着魔邪之力。\n\n因此，它们的种类太多，无法普遍克制任何东西，但它们自己会被那些专门对抗魔邪之力者所克制。\n\n同样，我们也不可能说任何一种地形类型对这些军团都是有利的。"
 game_concept_POD_spirit_maa: "灵类"
 game_concept_POD_spirit_maa_desc: "灵类[men_at_arms|E]是一种无肉体的虚体，起源于并通常居住在影界中——由于这个原因，一些法师称它们为“影族”。\n\n它们的虚体性意味着如果没有特殊手段，它们是不可能被克制的。\n\n它们的虚体状态也意味着灵类通常不会受到地形的不利影响，在冰冻的荒地和在炙热的沙漠中一样自如。"
 game_concept_POD_gargoyle_maa: "石像鬼"
 game_concept_POD_gargoyle_maa_desc: "石像鬼是由血系创造的吸血鬼血系，是他们的仆人。虽然在实际上不是睿魔尔血系，但该血系在很大程度上受他们的控制。\n\n石像鬼的飞行能力给常规部队带来了独特的麻烦，因为打击飞行敌人的训练并不是大多数操练的一部分。\n\n石像鬼能够飞行意味着他们可以避开许多由地形带来的问题，同时还能利用其的优势。"
 game_concept_POD_ghoul_maa: "血仆"
 game_concept_POD_ghoul_maa_desc: "血仆是用来描述当吸血鬼在没有先吸干时凡人时给出一点吸血鬼精血而产生的爪牙，否则将会导致初拥。\n\n血仆不仅包括被赋予吸血鬼精血的普通人类，还包括棘秘魑使用的所谓战争血仆，因此对付某些血仆就像对付普通人类一样容易，其他的，如怪物般的什拉赫塔，则更难。\n\n地形对血仆的影响取决于它们的躯体形态。"
 game_concept_thrall: "魔奴"
 game_concept_thrall_desc: "#bold 魔奴#!是$POD_splat_demon_plural$的凡人仆从。恶魔从有野心家、复仇者、残废者和被遗弃者中选择仆从；这些人是感觉被世界欺骗，被剥夺了他们应得的生活的男人和女人。\n\n如果他们信仰你的宗教，你可以使角色成为魔奴。为了转化他们，你可以在拥有与你的罪恶相关的[trait|E]的角色身上使用诱惑犯罪$pod_journey$。\n\n魔奴拥有你可以使用的特殊互动，它们花费奥秘技能点。你还可以要求他们的附庸加入你的宗教。"
 game_concept_shade_realm: "影域"
 game_concept_shade_realm_desc: "影域，也被称作幻域，是一个由单一魔法领域主导的影界界域。每个影域都与阳系中的一颗行星的[Glossary('影域','game_concept_shard_realm_desc')]相连，但在地球的穹界显现——就像一片云彩投射在地面上的阴影。"
 game_concept_abomination: "恶煞"
 game_concept_abomination_desc: "恶煞是一个用来描述被转为吸血鬼的$glossary_fera$的术语。不用说，这些生物是非常罕见的，因为几乎所有的化兽族裔都对吸血鬼精血剧烈过敏。#TOOLTIP:GAME_TRAIT,abomination,[GetNullCharacter] #L 恶煞#!#!同时受到狼族和吸血鬼的忌讳，而且精神上也总是非常不稳定。\n在游戏中，恶煞被视为不能[Glossary('初拥','game_concept_Embrace_desc')]的$POD_splat_vampire_plural$，但保留了血种灵赋和月兆灵赋，以及化形能力。"
 game_concept_POD_plasmic_maa: "灵质体"
 game_concept_POD_plasmic_maa_desc: "灵质体或灵质实体是[UmbraGlossaryLocalized('shadowlands','冥界')]的“生命体”；具体而言，任何由灵质组成但非死灵或怨灵的独立生物。"
 game_concept_grace: "恩惠"
 game_concept_grace_i: "@grace_icon!"
 game_concept_grace_desc: "该影界实体对你的青睐程度。"
 game_concept_world_of_darkness: "黑暗世界"
 game_concept_WoD: "黑暗世界"
 game_concept_world_of_darkness_desc: "《黑暗世界》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在现实世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。"
 game_concept_bind_wraith_interaction: "缚灵互动"
 game_concept_bind_wraith_interaction_desc: "一个允许角色缚灵[GetTrait('wraith').GetName( GetNullCharacter )]以便之后命令其的互动。"
 game_concept_POD_faerie_maa: "妖精"
 game_concept_POD_faerie_maa_desc: "非换生灵经常交替使用仙灵、妖精和精类等术语来指称换生灵和真妖精。"
 game_concept_POD_chimera_maa: "活化奇魅"
 game_concept_POD_chimera_maa_desc: "活化奇魅就是具有生命或生命外观的奇魅。"
 game_concept_dreamer: "梦种"
 game_concept_dreamer_desc: "在戚族中，梦种可以是任何凡人的统称，但更多的是指那些表现出创意火花的凡人，或者没有被板讷磨灭到情感迟钝的程度的人。梦种是戚族的主要梦华来源，因此是一种受保护的资源。"
 game_concept_command_wraith_interaction: "役使死灵互动"
 game_concept_command_wraith_interaction_desc: "通过[character_interaction|E]，你可以命令受缚[GetTrait('wraith').GetName(GetNullCharacter)]骚扰其他角色。"
 game_concept_mythic_age: "神话纪元"
 game_concept_mythic_age_desc: "神话纪元从史前时代一直持续到公元前1000年左右，直到铁器时代开始，人类意识到可以通过努力和冷酷的变革来塑造世界。"
 game_concept_sundering: "大散断"
 game_concept_sundering_desc: "大散断大约为公元前1000年到公元1200–1400年，人们开始不再相信妖精，板讷的威压开始增大。"
 game_concept_shattering: "大碎溃"
 game_concept_shattering_desc: "在西班牙宗教裁判所和黑死病肆虐（同时姓氏开始流行）的时期，大散断累积的压力最终爆发，引发了大碎溃（促使大量的[GetTrait('fae').GetName( GetNullCharacter )]逃避回[UmbraGlossary('arcadia')]或是采取[GetTrait('changeling').GetName( GetNullCharacter )]之道，亦或是隐藏起来。）"
 game_concept_interregnum: "大空位"
 game_concept_interregnum_desc: "公元1400年左右，地球上既没有仙族，也没有真妖精，剩余“掺水”的换生灵在[Glossary('大碎溃','game_concept_shattering_desc')]的最后嘶鸣之后不得不自力更生，这一时期被称为大空位，因为换生灵不得不尝试如何独自生存下来。"
 game_concept_resurgence: "大复还"
 game_concept_resurgence_desc: "在妖精经历了四百多年的黑暗时代后，1969年的登月要么带来了大复还，要么是凡人世界和神话世界之间重新开辟道路的产物。"
 game_concept_primogen: "参议"
 game_concept_primogen_desc: "参议是$POD_splat_vampire_plural$的正式头衔，他们是各自[Glossary('氏族','game_concept_Clan_desc')]的代表。他们通常是城市中最年长的氏族成员。一般来说，作为统治者的$pod_princes$都很重视参议和他们的意见。参议会被召来咨询决策，就连他们的建议也具有很大的分量。\n\n在游戏中，参议是[kingdom|E][rank|E]及以上的吸血鬼才能担任的[court_positions|E]。没有参议代表的[Clan|E]会感到被边缘化，从而导致对应成员的负面[opinion|E]。\n\n有关如何才算训练有素的参议的提示，请参阅[primogen_aptitude|E]。"
 game_concept_primogen_aptitude: "参议称职度"
 game_concept_primogen_aptitude_desc: "每种$pod_primogen$[court_position|E]都需求不同的才能：\n\n$EFFECT_LIST_BULLET$$pod_assamite_primogen$\n$EFFECT_LIST_BULLET$$pod_brujah_primogen$\n$EFFECT_LIST_BULLET$$pod_cappadocian_primogen$\n$EFFECT_LIST_BULLET$$pod_gangrel_primogen$\n$EFFECT_LIST_BULLET$$pod_gargoyle_primogen$\n$EFFECT_LIST_BULLET$$pod_lasombra_primogen$\n$EFFECT_LIST_BULLET$$pod_malkavian_primogen$\n$EFFECT_LIST_BULLET$$pod_nosferatu_primogen$\n$EFFECT_LIST_BULLET$$pod_ravnos_primogen$\n$EFFECT_LIST_BULLET$$pod_salubri_primogen$\n$EFFECT_LIST_BULLET$$pod_setite_primogen$\n$EFFECT_LIST_BULLET$$pod_toreador_primogen$\n$EFFECT_LIST_BULLET$$pod_tremere_primogen$\n$EFFECT_LIST_BULLET$$pod_tzimisce_primogen$\n$EFFECT_LIST_BULLET$$pod_ventrue_primogen$"
 game_concept_brujah_primogen: "$brujah_primogen_court_position$"
 game_concept_brujah_primogen_desc: "[GetTrait('brujah').GetName(GetNullCharacter)]$pod_primogen$需要良好的[martial|E]、[learning|E]，[prowess|E]能力。\n\n是[GetTrait('scholar').GetName(GetNullCharacter)]、[GetTrait('strategist').GetName(GetNullCharacter)]会增强工作表现。\n\n是[GetTrait('wrathful').GetName(GetNullCharacter)]不利工作表现。"
 game_concept_cappadocian_primogen: "$cappadocian_primogen_court_position$"
 game_concept_cappadocian_primogen_desc: "[GetTrait('cappadocian').GetName(GetNullCharacter)]$pod_primogen$需要良好的[learning|E]、[stewardship|E]能力。\n\n是[GetTrait('patient').GetName(GetNullCharacter)]、[GetTrait('scholar').GetName(GetNullCharacter)]、#TOOLTIP:GAME_TRAIT,lifestyle_physician,[GetNullCharacter] #L 医师#!#!、[GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L 神秘主义者#!#!稍微增强工作表现。"
 game_concept_lasombra_primogen: "$lasombra_primogen_court_position$"
 game_concept_lasombra_primogen_desc: "[GetTrait('lasombra').GetName(GetNullCharacter)]$pod_primogen$需要良好的[intrigue|E]、[stewardship|E]，[diplomacy|E]能力。\n\n是[GetTrait('arrogant').GetName(GetNullCharacter)]、[GetTrait('ambitious').GetName(GetNullCharacter)]、[GetTrait('zealous').GetName(GetNullCharacter)]、[GetTrait('schemer').GetName(GetNullCharacter)]会增強工作表现。"
 game_concept_toreador_primogen: "$toreador_primogen_court_position$"
 game_concept_toreador_primogen_desc: "[GetTrait('toreador').GetName(GetNullCharacter)]$pod_primogen$需要良好的[diplomacy|E]、[intrigue|E]能力。\n\n是[GetTrait('gregarious').GetName(GetNullCharacter)]、[GetTrait('poet').GetName(GetNullCharacter)]会增強工作表现。\n\n如果角色[culture|E]拥有增强[GetTrait('poet').GetName(GetNullCharacter)][trait|E]的[tradition|E]，像是[GetCultureTradition('tradition_chanson_de_geste').GetName]、或是增强#TOOLTIP:COURT_POSITION_TYPE,court_poet_court_position #L 宫廷诗人#!#!，像是[GetCultureTradition('tradition_poetry').GetName]也会增强工作表现。"
 game_concept_tzimisce_primogen: "$tzimisce_primogen_court_position$"
 game_concept_tzimisce_primogen_desc: "[GetTrait('tzimisce').GetName(GetNullCharacter)]$pod_primogen$需要良好的[learning|E]、[stewardship|E]，[intrigue|E]能力。\n\n是[GetTrait('sadistic').GetName(GetNullCharacter)]、[GetTrait('diligent').GetName(GetNullCharacter)]，[GetTrait('torturer').GetName(GetNullCharacter)]会增強工作表现。\n\n#help 如果你是[GetTrait('tremere').GetName(GetNullCharacter)]，就不能雇用此宫廷职位。#!"
 game_concept_ventrue_primogen: "$ventrue_primogen_court_position$"
 game_concept_ventrue_primogen_desc: "[GetTrait('ventrue').GetName(GetNullCharacter)]$pod_primogen$需要良好的[stewardship|E]、[diplomacy|E]，[martial|E]能力。\n\n是[GetTrait('ambitious').GetName(GetNullCharacter)]会增強工作表现。\n\n统治[kingdom|E]的梵卓参议[aptitude|E]会得到极大的增强。"
 game_concept_assamite_primogen: "$assamite_primogen_court_position$"
 game_concept_assamite_primogen_desc: "[GetTrait('assamite').GetName(GetNullCharacter)]$pod_primogen$需要良好的[diplomacy|E]、[martial|E]、[learning|E]，[prowess|E]能力。\n\n是[GetTrait('diligent').GetName(GetNullCharacter)]会增强工作表现。\n\n#help 只有身为信仰阿什拉派的[GetTrait('assamite').GetName(GetNullCharacter)]，或是首都处于[GetGeographicalRegion('world_middle_east').GetName]，才能雇用此宫廷职位。#!"
 game_concept_gangrel_primogen: "$gangrel_primogen_court_position$"
 game_concept_gangrel_primogen_desc: "[GetTrait('gangrel').GetName(GetNullCharacter)]$pod_primogen$需要良好的[prowess|E]能力。\n\n是[GetTrait('brave').GetName(GetNullCharacter)]、[GetTrait('wrathful').GetName(GetNullCharacter)]，[GetTrait('shieldmaiden').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L 剑术大师#!#!稍微增强工作表现。"
 game_concept_malkavian_primogen: "$malkavian_primogen_court_position$"
 game_concept_malkavian_primogen_desc: "[GetTrait('malkavian').GetName(GetNullCharacter)]$pod_primogen$需要良好的[diplomacy|E]、[learning|E]能力。\n\n有[GetTrait('auspexadvanced').GetName(GetNullCharacter)]，或是[GetTrait('gregarious').GetName(GetNullCharacter)]、[GetTrait('honest').GetName(GetNullCharacter)]，[GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L 神秘主义者#!#!会根据等级增强工作表现。"
 game_concept_nosferatu_primogen: "$nosferatu_primogen_court_position$"
 game_concept_nosferatu_primogen_desc: "[GetTrait('nosferatu').GetName(GetNullCharacter)]$pod_primogen$需要良好的[intrigue|E]、[diplomacy|E]，[stewardship|E]能力。\n\n有[GetTrait('obfuscateadvanced').GetName(GetNullCharacter)]，或是[GetTrait('schemer').GetName(GetNullCharacter)]、[GetTrait('deceitful').GetName(GetNullCharacter)]，[GetTrait('patient').GetName(GetNullCharacter)]会增強工作表现。\n\n是[GetTrait('honest').GetName(GetNullCharacter)]不利工作表现。"
 game_concept_ravnos_primogen: "$ravnos_primogen_court_position$"
 game_concept_ravnos_primogen_desc: "[GetTrait('ravnos').GetName(GetNullCharacter)]$pod_primogen$需要良好的[intrigue|E]、[martial|E]、[stewardship|E]，[learning|E]能力。\n\n是[GetTrait('gregarious').GetName(GetNullCharacter)]、[GetTrait('zealous').GetName(GetNullCharacter)]会增強工作表现。\n\n#help 身为[GetTrait('ravnos').GetName(GetNullCharacter)]，或是首都处于[GetGeographicalRegion('world_india').GetName]，才能雇用此宫廷职位。#!"
 game_concept_setite_primogen: "$setite_primogen_court_position$"
 game_concept_setite_primogen_desc: "[GetTrait('setite').GetName(GetNullCharacter)]$pod_primogen$需要良好的[intrigue|E]、[diplomacy|E]，[learning|E]能力。\n\n是[GetTrait('deceitful').GetName(GetNullCharacter)]、[GetTrait('gregarious').GetName(GetNullCharacter)]，[GetTrait('zealous').GetName(GetNullCharacter)]会增強工作表现。\n\n#help 身为[GetTrait('setite').GetName(GetNullCharacter)]，或具有[GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName]或[GetFaithDoctrine('special_doctrine_set_corrupted_kindred').GetBaseName][doctrine|E]的[faith|E]才能雇用此宫廷职位。#!"
 game_concept_tremere_primogen: "$tremere_primogen_court_position$"
 game_concept_tremere_primogen_desc: "[GetTrait('tremere').GetName(GetNullCharacter)]$pod_primogen$需要良好的[intrigue|E]、[learning|E]能力。\n\n是[GetTrait('patient').GetName(GetNullCharacter)]、[GetTrait('scholar').GetName(GetNullCharacter)]，[GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L 神秘主义者#!#!稍微增强工作表现。\n\n#help 如果你是[GetTrait('tzimisce').GetName(GetNullCharacter)]、[GetTrait('salubri').GetName(GetNullCharacter)]、信仰阿什拉派的[GetTrait('assamite').GetName(GetNullCharacter)]，或是首都处于[GetGeographicalRegion('world_middle_east').GetName]，就不能雇用此宫廷职位。#!"
 game_concept_salubri_primogen: "$salubri_primogen_court_position$"
 game_concept_salubri_primogen_desc: "[GetTrait('salubri').GetName(GetNullCharacter)]$pod_primogen$需要良好的[prowess|E]、[learning|E]能力。\n\n是[GetTrait('vengeful').GetName(GetNullCharacter)]、[GetTrait('scholar').GetName(GetNullCharacter)]会增强工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L 刀剑大师#!#!会增强工作表现。\n\n#help 身为[GetTrait('salubri').GetName(GetNullCharacter)]才能雇用此宫廷职位。#!"
 game_concept_grand_city: "大城邦"
 game_concept_grand_cities: "大城邦"
 game_concept_grand_city_desc: "大城邦是大型人口中心，对凡俗和超自然世界都有强大影响力。\n\n每个大城邦都有一套独特的机制。在你升级[buildings|E]前你会需要完成特定的要求。\n\n目前，唯五的大城邦是：\n$BULLET_WITH_TAB$$pod_eternal_rome$\n$BULLET_WITH_TAB$$pod_grand_city_of_constantinople$\n$BULLET_WITH_TAB$$pod_grand_paris$\n$BULLET_WITH_TAB$$pod_holy_cairo$\n$BULLET_WITH_TAB$$pod_holy_jerusalem$\n\n#X 你只能拥有#V;bold 1#!座大城邦地产，除非你修改游戏规则。#!"
 game_concept_eternal_rome: "永恒罗马"
 game_concept_st_peters_city: "圣伯多禄之城"
 game_concept_roma_aeterna: "罗马永恒"
 game_concept_eternal_rome_desc: "罗马$pod_grand_city$有着悠远著名的历史。该城有三种版本：\n\n当[GetTrait('vampire').GetName(GetNullCharacter)]控制时，该城名唤#bold 罗马永恒#!。它的十三个历史区域被氏族分治。你会需要雇用能力高超的$pod_primogen$来升级区域。在等级三时，每个区域都将为你的角色解锁#P 新能力#!。\n\n当暗影裁判所的[GetTrait('supehunter').GetName(GetNullCharacter)]控制时，该城名唤#bold 圣伯多禄之城#!。猎人能定居在圣弥额尔的修道院，将其作为裁判所总部。帮助其他裁判所修会能为该建筑解锁强大的升级路线。\n\n当其他势力控制时，该城名唤#bold 永恒罗马#!。具有特定[traits|E]的角色或是技艺精湛的廷臣任职[court_positions|E].$grand_city_incompatible_tooltip$"
 game_concept_splat: "种族"
 game_concept_splat_desc: "种族用来指你是哪种类型的超自然生物。在[princes_of_darkness|E]中，你的种族用[trait|E]表示。\n\n在#bold 黑暗时代：吸血鬼#!剧本中，只有以下种族：\n$EFFECT_LIST_BULLET$$POD_splat_vampire$\n$EFFECT_LIST_BULLET$$POD_splat_ghoul$\n$EFFECT_LIST_BULLET$$POD_splat_revenant$\n$EFFECT_LIST_BULLET$$POD_splat_kueijin$\n#X 注意，第一个剧本中不存在其他种族！这意味着无法与它们互动（例如，崇魔者无法与恶魔互动，因为地图上没有恶魔）#!\n\n在#bold 猎人与猎物#!剧本中，有以下种族：\n$EFFECT_LIST_BULLET$#italic 所有之前提到的种族，外加：#!\n$EFFECT_LIST_BULLET$$POD_splat_hunter$\n$EFFECT_LIST_BULLET$$POD_splat_mummy$\n$EFFECT_LIST_BULLET$$POD_splat_werewolf$\n$EFFECT_LIST_BULLET$$POD_splat_bastet$\n$EFFECT_LIST_BULLET$$POD_splat_demon$\n\n在#bold 黑暗时代：妖精#!剧本中，有以下种族：\n$EFFECT_LIST_BULLET$#italic 所有之前提到的种族，外加：#!\n$EFFECT_LIST_BULLET$$POD_splat_fae$\n$EFFECT_LIST_BULLET$$POD_splat_changeling$"
 game_concept_battle_modifier: "战斗修正"
 game_concept_battle_modifier_desc: "战斗修正只在与施术者的战斗结束后自动消除。"
 game_concept_first_age: "第一纪元"
 game_concept_first_age_desc: "中原的各种超自然文化对这一时代有着不同的称呼。对于[GetTrait('kueijin').GetName( GetNullCharacter )]来说，它是万物轮回的第一纪元或极乐纪元。对于变化妖怪来说，这是破晓纪元。在#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!看来，它是时间之前的状态，通过盘古或梵等人类神话来解释。妖仙称之完美纪元。第一纪元一般被认为是创世之前的时期。它标志着阴阳尚未分离的时代，万物与[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]（或盖亚）合而为一。它被认为是一个终极和谐的时期，是万物相互联系的一。"
 game_concept_second_age: "第二纪元"
 game_concept_second_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]和妖仙将其称为万物轮回的第二个时代或华美纪元，当时中原和灵廷还很接近。变化妖怪则称其为万物纪元，在这一时代，三元、三相得以诞生，并形成了今天所熟知的生命。同样，#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!也提到了形而上学三位一体的创世，即三尊监督五行的形成，而五行的形成又为万物让路。"
 game_concept_third_age: "第三纪元"
 game_concept_third_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]， 妖仙和变化妖怪称第三纪元为万物轮回的传奇纪元，这是神话传说中的中原史前时代，彼时[Glossary('万鬼','game_concept_kuei_jin_desc')]行走人间，以仁主之姿统御众生。也是在这个年代，那些忠于玉皇大帝的鬼神，在摇摇欲坠的休战协议下与[UmbraGlossaryLocalized('yomi_wan','幽冥')]生物作战。对#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!而言，这是人类觉醒于上天的安排并第一次学会使用魔法的时代。\n第三纪元因阎魔的阴谋而终结，[Glossary('阎魔','podgloss.yamaking')]腐化[Glossary('万鬼','game_concept_kuei_jin_desc')]使其以气为食。这也标志着神话传统的终结和人类今天所理解的历史的开始。"
 game_concept_fourth_age: "第四纪元"
 game_concept_fourth_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]和妖仙将这个纪元称为万物轮回的第四纪元或凄美纪元。它标志着[GetTrait('kueijin').GetName( GetNullCharacter )]承受诅咒，从天兵转变为源自[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]魔物的开端。对于小神来说，这是他们因参与[Glossary('万鬼','game_concept_kuei_jin_desc')]叛乱而被玉皇大帝治罪流放出天庭的开始。变化妖怪称之试炼纪元，在那纪元，阴险的[Glossary('万鬼','game_concept_kuei_jin_desc')]让化兽族裔自相残杀，这场战争被称为耻辱之战。据#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!所记，在这一时期出现了各种不同派别的行愿者，他们经常发生冲突，如喜马拉雅之战或龙河之战。在这些冲突中，出现了神射手羿和他的追随者，他们建立了一个后来称为[GetTrait('shih').GetName( GetNullCharacter )]的组织，专门狩猎妖邪鬼神。"
 game_concept_fifth_age: "第五纪元"
 game_concept_fifth_age_desc: "对[GetTrait('kueijin').GetName( GetNullCharacter )]来说，万物轮回的第五纪元被称为黑暗纪元。#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!说目前的世界是由“石人 ”主宰的，他们从遥远的地方来到这里，将中原置于他们的控制之下。变化妖怪称之为暗影纪元。妖仙则称其为灾难纪元，在这一纪元，鬼神必须证明自己配得上天庭，否则就会在[Glossary('魔皇','podgloss.demonemperor')]掌权之后被毁灭。几乎所有的鬼神都认为，第五纪元的导火索是西方人入侵中原。"
 game_concept_sixth_age: "第六纪元"
 game_concept_sixth_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]称即将到来的纪元为万物轮回的第六纪元，也被称为哀伤纪元。它是轮回的低谷，[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]从他的宝座上走下来，[Glossary('阎魔','podgloss.yamaking')]中的一位将飞升为[Glossary('魔皇','podgloss.demonemperor')]。然而，大多数[GetTrait('kueijin').GetName( GetNullCharacter )]认为哀伤纪元是存在的必要组成部分。同样，变化妖怪会认为即将到来的哀伤纪元将是他们最大的挑战。他们的敌人——[Glossary('阎魔','podgloss.yamaking')]试图用自己定住轮回，让它永远被困在第六纪元，而大百足则试图消灭轮回。因此，玉母的孩子们的职责就是保护轮回，不让它受到任何企图破坏它的人的伤害。同样，#TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L 雷民#!#!也相信轮回很快就会再次转动，但他们对轮回将如何影响他们却意见不一。妖仙则提出是欢乐纪元，届时世界之间的绝壁将被打破，他们将重返家园。还有一些人听信了其他鬼神的故事，暗自担心这是否真的像听起来那么美好。"
 game_concept_splats: "种族"
 game_concept_journey: "旅程"
 game_concept_journeys: "旅程"
 game_concept_journey_desc: "#bold 旅程#!是角色可以独自或与$pod_coterie$一起进行的长期任务。\n\n大多数旅程都有$pod_planning_phase$和$pod_travel_phase$。\n\n同一时间只能有一个旅程处于活动状态。与[schemes|E]不同，旅程可以暂停，并在以后重新开始。\n\n#help 要开始新的旅程，请点击屏幕右侧的 #bold $POD_journeys_hud$#!按钮，或右键单击其他角色，通过[character_interaction|E]开始旅程。#!"
 game_concept_planning_phase: "规划阶段"
 game_concept_planning_phase_desc: "$pod_journey$的#bold 规划阶段#!象征着你的角色正在收集信息、派出斥候，并为未来的旅程做好准备。\n\n规划阶段的持续时间取决于$pod_planning_speed$。根据$pod_journey$的不同，可能会有方法让它变得更快。有些旅程有#V 立即#!$pod_planning_speed$，在该情况下，规划阶段会被跳过。\n\n规划阶段结束后，$pod_journey$将进入$pod_travel_phase$。"
 game_concept_planning_speed: "规划速度"
 game_concept_planning_speed_desc: "与[schemes|E]不同，$pod_journey$的$pod_planning_phase$的每月进度是固定的，不涉及概率。\n\n#help 规划速度数值的弹框提示会给出如何进一步提高该数值的帮助！#!"
 game_concept_travel_phase: "旅行阶段"
 game_concept_travel_phase_desc: "在$pod_journey$的$pod_planning_phase$完成后，你的角色会得知世界上有一个[location|E]可以进行历险。你可以立即[travel|E]到那里，或者暂停$pod_journey$，稍后再过去。\n\n您可以邀请你的$pod_coterie$成员与你一起旅行。\n\n#help 在旅行阶段，你不能开始新的$pod_journeys$，也不能邀请新成员加入你的$pod_coterie$。#!"
 game_concept_coterie: "圈子"
 game_concept_coterie_desc: "#bold 圈子#!是指一群一起进行$pod_journeys$的个体。“圈子”是$POD_splat_vampire_plural$使用的术语——其他$pod_splats$可能有不同的名称。\n\n当你在进行$pod_journey$时，[skills|E]会在圈子成员之间共享。例如，如果在$pod_journey$中遇到需要[diplomacy|E]的情况，它只会考虑你的外交能力最强的圈子成员的[diplomacy_skill|E]。\n\n#help 要查看你的圈子，请点击屏幕右侧的#bold $POD_journeys_hud$#!按钮，然后选择第二个选项卡。#!"
 game_concept_inner_circle: "内环"
 game_concept_inner_circle_desc: "内环是秘盟的组织议会。人们对内环几乎一无所知，内环成员的身份也极力保密。内环的公众形象是巡行裁决官和他们的辅政官助手。内环成员选举巡行裁决官，并制定秘盟法律的原则。"
 game_concept_justicar: "巡行裁决官"
 game_concept_justicar_desc: "巡行裁决官是秘盟政府中最强大地可见组成部分，他们负责大规模裁决诫律，并充当内环的耳目和助手。秘盟的每个氏族都有一位巡行裁决官，每个都有几位精挑细选的辅政官作为他们在世界各地的间谍、打手和代表。"
 game_concept_archon: "辅政官"
 game_concept_archon_desc: "辅政官是秘盟任一巡行裁决官的公认代理人。如果说巡行裁决官是内环的双手，那么辅政官就是手指。"
 game_concept_ventrue_clan_curse: "梵卓氏族诅咒"
 game_concept_feeding_restrictions: "吸食限制"
 game_concept_ventrue_clan_curse_desc: "[GetTrait('ventrue').GetName(GetNullCharacter)][Glossary('氏族','game_concept_Clan_desc')]的所有后裔都有吸食限制，使他们除了特定范畴的凡人之外，无法进食#bold 任何#!人。\n\n在[princes_of_darkness|E]中，[GetTrait('ventrue').GetName(GetNullCharacter)]可以在游戏开始时选择自己喜欢的猎物。以任何其他类型的凡人为食都不会满足你的[hunger|E]，也不会从他们的[resonance|E]中获得[lifestyle_experience|E]。\n\n以其他$POD_splat_vampire_plural$为食则不受这限制。"
 game_concept_blood_hunt: "血猎"
 game_concept_anathema: "咒逐"
 game_concept_blood_hunt_desc: "当[GetTrait('vampire').GetName(GetNullCharacter)]对$pod_the_masquerade$的保障做出严重冒犯时，秘盟可能会宣布其为[GetTrait('anathema').GetName(GetNullCharacter)]，并对其发起血猎。\n\n在[princes_of_darkness|E]中，[GetTrait('anathema').GetName(GetNullCharacter)]由[trait|E]表示。秘盟成员可以针对[GetTrait('anathema').GetName(GetNullCharacter)]使用血猎[casus_belli|E]，囚禁目标领地中的所有[rulers|E]。"
 game_concept_patron_council: "守护者议会"
 game_concept_patron_council_desc: "守护者议会（更常被称为“守护者们”）是一个由传统派妖精组成的松散联盟。在这里，“传统派”指的是四季之战之前的历史时期，当时每个王廷都在规定的时间内统治着世界。当领导王廷的任期结束时，他们会将权力交接给下一个王廷。"
 game_concept_Sires: "尊长"
 game_concept_thralls: "魔奴"
 game_concept_elder_perks: "长者技能"
 game_concept_golconda: "浩恩永生"
 game_concept_enlightenment: "启蒙"
 game_concept_golconda_desc: "#bold 浩恩永生#!是一种神秘地开悟状态，在这种状态下，$POD_splat_vampire$不再受制于[Glossary('心兽','game_concept_beast_desc')]。\n\n在[princes_of_darkness|E]中，[GetTrait('golconda').GetName(GetNullCharacter)]是一种[trait|E]。极少数人一开始就拥有这种特性，其他人只有经过漫长的$pod_journey$才能获得这特质。\n\n#X 由于浩恩永生与你的人性息息相关，如果你犯下谋杀或盗窃，又或者陷入血狂，你将失去该旅程的所有进展。#!"
 game_concept_hungerless: "不受饥渴"
 game_concept_hungerless_desc: "不受饥渴的$POD_splat_vampire$已经完全超越了对血的需求。可以免费使用[Glossary('血律','game_concept_discipline_desc')]和其他需要消耗血液的能力。\n\n不过，这也意味着他们无法再从掠食中获得$pod_resonance$经验。"
 game_concept_commongifts_lifestyle: "通常灵赋"
 game_concept_commongifts_lifestyle_desc: "由化形种族产生的力量。"
 game_concept_hengeyokaigifts_lifestyle: "兽妖灵赋"
 game_concept_hengeyokaigifts_lifestyle_desc: "兽妖灵赋乃是由兽庭所教导的灵赋。"
 game_concept_golconda_planning_speed: "浩恩永生规划速度"
 game_concept_golconda_planning_speed_desc: "提高[golconda|E][journey|E][planning_speed|E]的最好方法就是凡人[GetCourtPositionType('touchstones_court_position').GetName()]。他们是由#TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_enlightenment_virtues_conscience_and_selfcontrol #L 良知#!#![faiths|E]解锁的[court_position|E]，你可以通过与他们建立良好的[relation|E]（比如[friend|E]或[lover|E]）来提高他们的[aptitude|E]。\n\n其他提高速度的方法：\n$EFFECT_LIST_BULLET$在你的$pod_coterie$中拥有其他具有[GetTrait('golconda').GetName(GetNullCharacter)]或[GetTrait('golconda_seeker').GetName(GetNullCharacter)][traits|E]的角色。\n$EFFECT_LIST_BULLET$成为[GetTrait('confider').GetName(GetNullCharacter)]、[GetTrait('journaller').GetName(GetNullCharacter)]或[GetTrait('reclusive').GetName(GetNullCharacter)]。\n$EFFECT_LIST_BULLET$拥有记录浩恩永生知识的[artifact|E]。"
 game_concept_umbra: "影界"
 game_concept_umbra_desc: "影界，又称灵界，是物质世界的灵性镜像。它分为许多子界，每个子界都有自己的奇妙和危险。\n只有少数实体可以穿越这个空间，有些界域只对特定类型的个人（或拥有适当能力的人）开放。\n在游戏中，影界 是有能力者可以探索的右侧面板。"
 game_concept_masquerade_exposure: "曝露度"
 game_concept_masquerade_exposure_with_icon: "@masquerade_icon!曝露度"
 game_concept_hunger_i: "@blood_icon!"
 game_concept_hunger_with_icon: "@blood_icon!饥渴"
 game_concept_tao_te_hsien: "道德仙道"
 game_concept_tao_te_hsien_desc: "它不是老子的道，尽管受到其启发。它的重点是让神魔明白自从绝壁的出现以来他或她在宇宙中的位置。与人类的哲学不同，它有一个目标……给予妖仙突破绝壁、进入$pod_spirit_worlds$的力量。\n它与道家的许多特点相似。求道者倾向于远离世俗的纷扰，在自然中寻求宁静的生活。他们热爱学习本身，但对政治关心甚少。有些是科学家，有些是神职人员，有些是乞丐，有些是战士。日本的妖仙将其改编为一种更像禅宗的哲学，称为“妖仙道”。与一些凡人的宗教不同，道德仙道欢迎变化和个人主义，只要不变成自我膨胀。它是宁静、神秘而深邃的。\n它有五个阶段，大致对应着道家的创世传说，但顺序相反。对于道家来说，首先有无我。从无我中产生了无极。这孕育了混沌。在混沌中心，有一个静止的点，起初只是一个微粒，后来变成了太极，从这里产生了太易，分为两个阶段：太初，太始。所有这些最终导致了[Glossary('第一纪元','game_concept_first_age_desc')]的创世：太素。\n为什么阶段相反呢？因为这些阶段代表了回归无极的挣扎；打破限制神魔前往[spirit_worlds|E]的束缚。回到无极有许多途径，但最可靠的是道德仙道。有传言说亵神有他们自己的内丹之道，叫做魔道；这是在[Glossary('第三纪元','game_concept_third_age_desc')]由一位[Glossary('阎魔','podgloss.yamaking')]所建立的道。"
 game_concept_cantrip: "魔咒"
 game_concept_cantrips: "魔咒"
 game_concept_fae_realm: "术域"
 game_concept_cantrip_desc: "魔咒是$POD_splat_fae$的法术。它们由两个组成部分构成：#bold 术艺#!和#bold 术域#!。\n\n术艺确定了魔咒的效果。角色可以通过进行一次#italic 学习新能力#!的$pod_journey$来学习新的术艺，然后在相对的术艺[lifestyles|E]中解锁[perks|E]。\n\n术域确定了可以被魔咒影响的对象。一位不受训的$POD_splat_fae$只能用他们的魔法影响非常特定的角色，而精通了术域的人可以给世界上的任何人施加魔咒。\n\n有六大术域：\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L;bold 角色术域#!#!可以让你对陌生的目标施放魔咒。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_fae,[GetNullCharacter] #L;bold 妖精术域#!#!可以让你对更强大的$pod_splats$施放魔咒。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L;bold 道具术域#!#!可以让你对更稀有的[artifacts|E]施放魔咒。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L;bold 自然术域#!#!可以让你影响自然现象。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_scene,[GetNullCharacter] #L;bold 场景术域#!#!决定了魔咒的距离和范围。\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_time,[GetNullCharacter] #L;bold 时间术域#!#!决定了魔咒的持续时间和冷却时间。\n\n所有带有仙灵血统的角色都可以在$realm_lifestyle$[lifestyle|E]中解锁[perks|E]，但要完全掌握一个术域需要进行一次$pod_journey$。"
 game_concept_oneiric_realm: "梦呓界域"
 game_concept_oneiric_realms: "梦呓界域"
 game_concept_oneiric_realm_desc: "在那洪流般的回音中，即[UmbraGlossary('deep_dreaming')]中，十一个水晶般的俄尼里伊界域旋转着，回荡着梦境的元素。其中一个界域曾被称为[UmbraGlossary('arcadia')]；如今，它对外封闭，任何离开的人都无法再返回。至于其他的梦呓界域，如摩罗斯和赫墨拉，埃忒耳和卡尔，修普诺斯和[UmbraGlossaryLocalized('kingdom_of_dan','大梦')]，卡里斯和摩墨斯，狄刻和普罗透斯，人们对它们知之甚少。很少有人进入过它们，也没有人以与来时相同的方式离开。\n\n在这些所谓的“较小”梦呓界域之外（无人能说它们是否真的比阿卡迪亚更辉煌），只有黑夜和寂静，总数达到13。旅行者们报告了一个奇特的现象：在寂静之外，即[UmbraGlossary('dreaming')]的最深处，世界展现出自身，黑暗转化为奇迹。"
 game_concept_hearts_realm: "心之界域"
 game_concept_hearts_realms: "心之界域"
 game_concept_hearts_realm_desc: "在[UmbraGlossary('dreaming')]的深处，悬浮在[UmbraGlossary('far_dreaming')]和最深国度之间，存在着一些领域，它们讲述着以人类心灵为模样的故事。比[UmbraGlossary('dreaming')]中其他普通界域更强大、更亲密的这些“心之界域”，吸引了许多阿卡迪亚之梦的逃亡碎片，并且现在常常被满怀希望的旅行者误认为是阿卡迪亚本身。然而，这样的结论过于乐观，实际并非如此。"
 game_concept_home_realm: "梦乡"
 game_concept_home_realms: "梦乡"
 game_concept_home_realm_desc: "整体界域，在当时比现在要小一些，是每个人对完美世界的理念的交织。边界地区的土地就像是一个巨人拙劣的拼图初试。地貌交错地相互咬合和突出，呈现出锯齿状的块状和区域。嵌入其中的奇魅动物和建筑物都显得模糊而颤动，原始的梦幻物质在空气中电流般噼啪作响。就在他们观察的同时，一些奇魅渐渐消失得无影无踪。他们必须做出决定：是继续留下来打造这个领域，看看是否能从当前位置到达[UmbraGlossary('arcadia')，还是返回凡俗世界，有可能再次尝试？所有人都认为他们离阿卡迪亚太远，甚至无法尝试去接近。一些人认为这个新界域是浪费时间，而大部分人则留下来试图使其更加稳定。少数人在[UmbraGlossary('dreaming')]中徘徊，并再也没有音讯。"
 game_concept_nightmare_realm: "噩梦界域"
 game_concept_nightmare_realms: "噩梦界域"
 game_concept_nightmare_realm_desc: "噩梦界域是[UmbraGlossary('dreaming')]中噩梦栖息的地方。在梦变的推动下，这些地方会侵占[Glossary('美梦界域','game_concept_dream_realm_desc')]。这里的威胁比[UmbraGlossary('dreaming')]的许多其他地方更为严重。"
 game_concept_dream_realm: "美梦界域"
 game_concept_dream_realms: "美梦界域"
 game_concept_dream_realm_desc: "美梦界域是[UmbraGlossary('dreaming')]的一部分，在这里，危险与奇妙并存。与[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]相对。"
 game_concept_stable_point: "稳定点"
 game_concept_stable_points: "稳定点"
 game_concept_stable_point_desc: "稳定点是[UmbraGlossary('dreaming')]中基本不受梦变影响的地方。"
 game_concept_dan: "大梦"
 game_concept_dan_desc: "在戚族的古语中，大梦即命运；一个人的宿命和因果报应。大梦不喜欢别人对它的纽线进行干涉，那些经常通过真言等术艺手段过度操控它的人往往发现自己越来越无法摆脱它编织的蛛网。"
 game_concept_skinlands: "皮囊之地"
 game_concept_skinlands_desc: "死灵把活人的世界称为皮囊之地；与[UmbraGlossary('shadowlands')]相对比，后者是死者的土地和死灵的家园。皮囊之地和[UmbraGlossary('shadowlands')]被尸幕隔开，尸幕遮蔽了活人的世界。死灵可以通过与生俱来的能力“生命视觉”更好地了解“生者”中发生的事情。怨灵无法看穿尸幕，因此也无法进入皮囊之地，除非他们拥有黑暗冥法：撕裂尸幕。"
 game_concept_gaia_realm: "盖亚界域"
 game_concept_gaia_realm_desc: "盖亚界域，狼族通常简称为“世界”，包括盖亚的物质、灵性和影界领域：即地球及其包含的所有灵性界域。该术语有时被广泛使用，以至于包括了与盖亚界域重叠或与盖亚界域相连的[UmbraGlossary('penumbra')]。"
 game_concept_unconquered_soul: "不从之魂"
 game_concept_unconquered_soul_desc: "不从之魂是你遭受被你吸榨的受害者夺舍的事件，并将覆盖你的外貌，特质和信仰。"
 game_concept_gargoyle_primogen: "$gargoyle_primogen_court_position$"
 game_concept_gargoyle_primogen_desc: "[GetTrait('gargoyle').GetName(GetNullCharacter)]$pod_primogen$需要良好的[prowess|E]能力。\n\n是[GetTrait('wrathful').GetName(GetNullCharacter)]、[GetTrait('callous').GetName(GetNullCharacter)]、[GetTrait('brave').GetName(GetNullCharacter)]会增強工作表现。\n\n是#TOOLTIP:GAME_TRAIT,lifestyle_hunter,[GetNullCharacter] #L 猎人#!#!稍微增强工作表现。\n\n#help 身为[GetTrait('gargoyle').GetName(GetNullCharacter)]，或在[GetTrait('visceratika').GetName( GetNullCharacter )]发明后身为[emperor|E]才能雇用此宫廷职位。#!"
 game_concept_umbra_expedition: "灵界探险"
 game_concept_umbra_expedition_desc: "访问你探员有所发现的灵界地点，需要克服一系列挑战，包括与灵体决斗、技能鉴定或有机会获得宝藏。"
 game_concept_bunk: "本格"
 game_concept_bunk_desc: "曾几何时，梦华可以凭空而来；曾几何时，妖精已经被灌注了梦华，不需要如此温柔的哄骗。那是神话纪元，但那个时代已经一去不复返了。现在，为了唤出编织魔咒所需的梦华，换生灵必须举行奇特的仪式和行动，这些仪式和行动被称为本格。"
 game_concept_roguelike_mode: "类Rogue模式"
 game_concept_roguelike_mode_desc: "#N 困难难度#!的[princes_of_darkness|E]。\n\n游戏开始时，你将随机切换到一位单伯爵领统治者。该统治者将受到诅咒。你可以选择以下诅咒之一：\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_wealth').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_love').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_rest').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_belongings').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_curiosity').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_guile').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_demands').GetNameWithTooltip]\n\n或者，你也可以让随机获得一项诅咒，或者一次性获得所有诅咒。\n\n你只有一次机会。如果你的初始统治者在有诅咒时死亡，游戏就结束了。\n\n完成一项主线决议就能消除诅咒。\n\n祝您好运。"
 game_concept_true_faith: "真信"
 game_concept_true_faith_desc: "一些个体对神灵有不可动摇的信仰，其信念足以保护自身。这被称为#bold 真信#!，并给予信徒超自然力量。\n\n$POD_splat_vampire_plural$被斥逐。$POD_splat_werewolf_plural$在其影响下被剥夺魂怒。对$POD_splat_demon_plural$和$POD_splat_wraith_plural$更是特别有用。不过真信在许多$pod_splats$中都可以找到，就连一些吸血鬼都有。\n\n在[princes_of_darkness|E]，[GetTrait('truefaith').GetName(GetNullCharacter)]是可以解锁新[lifestyle|E]的[trait|E]。一个角色有着特别强大的信念则是[GetTrait('beatific').GetName(GetNullCharacter)]。\n\n恶魔崇拜的[GetTrait('infernalist').GetName(GetNullCharacter)]与真信相互排斥。$POD_splat_hunter_plural$有可能因为拥有罪恶特质而失去真信。"
 game_concept_yang_world: "阳界"
 game_concept_yang_world_desc: "阳界似乎包括[UmbraGlossary('spirit_wilds')]、[UmbraGlossary('dreaming')]和[UmbraGlossary('astral_reaches')]。这是一个充斥着阳之力量，喧闹而“高尚”的灵魂世界，通常居住着自然之灵和神。"
 game_concept_dark_kingdoms: "冥府"
 game_concept_infiltration: "渗透"
 game_concept_infiltration_desc: "#bold 渗透#!是一种$pod_journey$，可以让你潜入别人的[court|E]，以实现一些秘密目标，比如偷取一件[artifact|E]。\n\n渗透发生在一张地图上，你可以在地图上自由移动。点击节点即可在它们之间穿梭。请记住，这样做会提高你的$pod_suspicion_with_icon$。\n\n为了完成渗透，你必须在$pod_suspicion_with_icon$不达到[EmptyScope.ScriptValue('suspicion_max')|V0]的情况下返回出口节点。\n\n成功达成#V 3#!次渗透将给予[GetModifier('infiltration_experience_modifier').GetNameWithTooltip]。"
 game_concept_suspicion: "嫌疑"
 game_concept_suspicion_desc: "#bold 嫌疑#!描述你在$pod_infiltration$过程中吸引了多少注意力。\n\n嫌疑度从[EmptyScope.ScriptValue('suspicion_min')|V0]到[EmptyScope.ScriptValue('suspicion_max')|V0]。如果达到[EmptyScope.ScriptValue('suspicion_max')|V0]，你就会被发现，$pod_infiltration$失败。\n\n在[EmptyScope.ScriptValue('suspicion_threshold_1')|V0]、[EmptyScope.ScriptValue('suspicion_threshold_2')|V0]和[EmptyScope.ScriptValue('suspicion_threshold_3')|V0]嫌疑度时，会出现一些周折，使以后的[skill|E]鉴定变得更加困难。"
 game_concept_mesmerize_defenses: "对抗催眠的防护"
 game_concept_mesmerize_defenses_desc: "具有更强势性格的角色更难被催眠。如果对方有以下特质或技能，成功概率将被降低：\n吸血鬼\n$BULLET_WITH_TAB$[GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$血术法的木星之曲\n$BULLET_WITH_TAB$[GetTrait('dominateadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('presenceadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('auspexadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('fortitudeadvanced').GetName(GetNullCharacter)]\n木乃伊\n$BULLET_WITH_TAB$[GetPerk('wisdom_of_isis_perk').GetName(GetNullCharacter)]\n猎人\n$BULLET_WITH_TAB$[GetPerk('mountain_meditation_perk').GetName(GetNullCharacter)]\n真信\n$BULLET_WITH_TAB$[GetPerk('holy_bulwark_perk').GetName(GetNullCharacter)]\n灵能\n$BULLET_WITH_TAB$[GetPerk('anti_psi_1_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_2_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_3_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_4_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_5_perk').GetName(GetNullCharacter)]\n狼人\n$BULLET_WITH_TAB$[GetPerk('release_from_bondage_perk').GetName(GetNullCharacter)] \n妖精\n$BULLET_WITH_TAB$[GetPerk('fair_is_foul_foul_is_fair_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('captive_heart_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('geas_ban_perk').GetName(GetNullCharacter)]\n宝物\n$BULLET_WITH_TAB$先祖护身符"
 game_concept_suspicion_with_icon: "@masquerade_icon:color_goldy_yellow!嫌疑"
 game_concept_infiltration_mission: "渗透任务"
 game_concept_infiltration_missions: "渗透任务"
 game_concept_samuel_haight_mode: "萨缪尔·海特模式"
 game_concept_samuel_haight_mode_desc: "在这种模式下，对混合$pod_splats$的各种限制被取消：\n\n$EFFECT_LIST_BULLET$生成器创建的角色的专属决议和互动被默认解锁，例如请求[Glossary('初拥','game_concept_Embrace_desc')]、通过吸干$POD_splat_vampire$囚犯的血成为$POD_splat_ghoul$等等。\n$EFFECT_LIST_BULLET$任意[splat|E]都能学习[Glossary('灵迹','game_concept_numina_desc')]\n$EFFECT_LIST_BULLET$[GetTrait('truefaith').GetName(GetNullCharacter)]和#TOOLTIP:GAME_TRAIT,infernalist,[GetNullCharacter] #L 崇魔#!#!不再互相冲突\n$EFFECT_LIST_BULLET$$POD_splat_hunter_plural$不再在成为#TOOLTIP:GAME_TRAIT,infernalist,[GetNullCharacter] #L 崇魔者#!#!后失去能力\n$EFFECT_LIST_BULLET$所有角色都能掌控剥皮瘟疫，且所有化兽族裔都能成为[GetTrait('abomination').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$妖精血角色能够在被[Glossary('初拥','game_concept_Embrace_desc')]后继续使用$pod_cantrips$\n$EFFECT_LIST_BULLET$超自然角色能在出生时获得[GetTrait('psychic').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$[GetTrait('dhampyr').GetName(GetNullCharacter)]不会再在出生时移除其他超自然[splat|E]特质\n$EFFECT_LIST_BULLET$次种族（[GetTrait('ghoul').GetName(GetNullCharacter)]等）特质不再会在破蛹、原始觉醒、或通过炼金术成为化兽族裔时被移除\n$EFFECT_LIST_BULLET$化兽族裔能被血仆化\n$EFFECT_LIST_BULLET$$POD_splat_ghoul_plural$不会失去[GetTrait('kinfolk').GetName(GetNullCharacter)]或[GetTrait('kinain').GetName(GetNullCharacter)]特质\n$EFFECT_LIST_BULLET$任意$POD_splat_vampire$都能够觉醒[GetTrait('hun_and_po').GetName(GetNullCharacter)]，只要是[GetTrait('salubri_watcher').GetName(GetNullCharacter)]的朋友\n\n额外修改：\n\n$EFFECT_LIST_BULLET$所有$pod_splats$都能自由与其他族友善互动。\n$EFFECT_LIST_BULLET$学习新能力的$pod_journeys$不会叠加增长花费\n\n模式的名字源自$pod_samuel_haight$。"
 game_concept_storyteller_mode: "说书人模式"
 game_concept_storyteller_mode_desc: "这游戏模式有各种限制，使玩家更难快速积累力量：\n\n$EFFECT_LIST_BULLET$$pod_loyalty_with_icon$的[opinion|E]需求被上升为#V 50#!\n$EFFECT_LIST_BULLET$角色拥有的[Glossary('血律','game_concept_discipline_desc')]技能越多，喝血获得的$pod_resonance$经验就会越低\n$EFFECT_LIST_BULLET$宣战或初拥会导致堕出$pod_golconda$"
 game_concept_loyalty: "忠诚"
 game_concept_loyalty_with_icon: "@knight_icon!忠诚"
 game_concept_loyalty_desc: "如果对玩家的[opinion|E]下降到 #V 0#!，无地[knights|E]将会想要离开玩家的宫廷。你有1年的宽限期来再次提升他们的好感。\n\n若有以下，忠诚将不会造成影响：\n$EFFECT_LIST_BULLET$你对其有[strong_hook|E]\n$EFFECT_LIST_BULLET$其在你的[council|E]\n$EFFECT_LIST_BULLET$与你有从属关系的角色（如牧群、梦种、魔奴、宿体、或受缚死灵）\n$EFFECT_LIST_BULLET$其是你的[spouse|E]、[friend|E]、[soulmate|E]、或$pod_coterie$成员\n$EFFECT_LIST_BULLET$其是你的[hostage|E]\n$EFFECT_LIST_BULLET$其对你有守护之誓\n\n忠诚在$pod_storyteller_mode_with_icon$有更高限制。"
 game_concept_samuel_haight_mode_with_icon: "@haight_icon!萨缪尔·海特模式"
 game_concept_storyteller_mode_with_icon: "@wod_icon!说书人模式"
 game_concept_samuel_haight: "萨缪尔·海特"
 game_concept_samuel_haight_desc: "来自$pod_wod$的臭名昭著的反派人物，曾出现在不同$pod_splats$的联动剧本中。也被称为“究极屌人”。\n\n萨缪尔是一位[GetTrait('kinfolk').GetName(GetNullCharacter)]，他对自己没有化形能力感到不满。他用各种方法积累力量：喝 $POD_splat_vampire$的血、学习$pod_bloodsorcery$、使用禁忌仪式成为$POD_splat_werewolf$、使用一件宝物从其他狼人那里偷取灵赋、使用同一件宝物从一个$POD_splat_mage$那里偷取有关领域的知识，以及使用另一件宝物获得魔峰。\n\n当一位古老的[GetTrait('baali').GetName(GetNullCharacter)]在阿兹特克金字塔顶上杀死他时，他的暴行也随之结束。在以[GetTrait('wraith').GetName(GetNullCharacter)]的身份进入[UmbraGlossary('shadowlands')]时，海特被魂铸，成了一个烟灰缸。\n\n虽然萨缪尔·海特一开始可能是个严肃的反派，但他逐渐变成了编剧的一个元玩笑，用来取笑那些过于强大的跨线角色。"
 game_concept_cultist: "教徒"
 game_concept_cultist_desc: "#bold 教徒#! 是$POD_splat_demon$恶魔的崇拜者。通过他们的崇拜，他们每年为恶魔提供被动的[arcana_lifestyle|E][experience|E]。\n\n封臣、廷臣，以及你的$pod_thralls$的封臣，都有资格通过$POD_set_cultist_interaction$[character_interaction|E]成为教徒。角色在获得一个$POD_splat_demon$作为领主时也会自动成为教徒，无论是通过宣誓效忠还是通过征服。"
 game_concept_summon_wraith_on_death_interaction: "死后还魂"
 game_concept_summon_wraith_on_death_interaction_desc: "使其他角色在死后化为[GetTrait('wraith').GetName( GetNullCharacter )]时被召唤到角色宫廷的互动。"
 game_concept_POD_vampire_maa: "吸血鬼"
 game_concept_POD_vampire_maa_desc: "当夜幕降临战场时，受诅的该隐之子将成为可怕的战斗者。他们天生比凡人更强壮，速度更快，其中大多数还拥有可以扭转战局的强大精神和物理异能。"
 game_concept_umbra_aptitude: "灵界资质"
 game_concept_umbra_aptitude_desc: "该角色探索灵界的速度。"
 game_concept_umbra_sense: "灵界感知"
 game_concept_umbra_sense_desc: "该角色有多大概率免于困于灵界，且有多大概率达成委任的$pod_umbra_expedition$。"
 game_concept_beasts: "心兽"
 game_concept_POD_construct_maa: "构造体"
 game_concept_POD_construct_maa_desc: "构装体是由一系列魔法或科技生物所代表的[men_at_arms|E]，它们的形状、形态和力量有很大的不同，取决于制造它们的方式和原因。"
 game_concept_POD_bygones_maa: "逝兽"
 game_concept_POD_bygones_maa_desc: "逝兽是神话传说中的生物，由于与共识场不相容，无法在地球上长期公开存在。虽然强大，但这种不稳定性使它们在战斗中很难发挥作用。"
 game_concept_POD_wraith_maa: "死灵"
 game_concept_POD_wraith_maa_desc: "死灵是幽灵，有未毕之事而死去的人的鬼魂，现已在[UmbraGlossary('shadowlands')]作祟。"
 game_concept_static_stress: "固定压力"
 game_concept_static_stress_desc: "固定压力是数值不受任何压力修正影响的[stress|E]。"
 game_concept_kuei_jin: "鬼人"
 game_concept_kuei_jin_desc: "也被称为万鬼、阿修罗提伽耶（在印度），或简称为饿殍。\n传说鬼人是古代万仙——[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]选中引导和保护宇宙的“万千仙神”——的堕落转世。万仙最初通过针对才能和勇气的试炼被选上，并以宇宙的气为食。然而，他们却误入歧途，学会了吸取生命之气，亵渎了这一证道试炼。\n\n一位鬼人的诞生，始于其灵魂死后从[UmbraGlossaryLocalized('yomi_wan','幽冥')]逃脱。他们围绕政治性的皇朝组织起来，并遵循[Glossary('心法','podgloss.dharma')]以寻求重返天庭之路。"
 game_concept_wan_xian: "万仙"
 game_concept_wan_kuei: "万鬼"
 game_concept_hungry_dead: "饿殍"
 game_concept_asuratizayya: "阿修罗提伽耶"
 game_concept_spirit_world: "灵界"
 game_concept_spirit_worlds: "灵界"
 game_concept_grand_city_of_constantinople: "君士坦丁堡，褪色幻梦"
 game_concept_grand_city_of_constantinople_desc: "君士坦丁堡的三条不同路线根据其持有者的文化而异。\n\n掠夺路线（适用于拉丁人、伊比利亚人、法兰西人、英格兰人和德意志人）有着较长的建筑建设时间，但最终能带来丰厚的收益，体现了掠夺城市财富的漫长过程。\n重建路线（适用于拜占庭人、罗马人、罗斯人和古希腊人）提供了成本高昂、盈利周期较长的建筑，但最终会使完全建成的君士坦丁堡变成三条路线中最为强大的。\n改革路线（适用于其他所有文化）则介于两者之间，提供多样化的建筑，具有良好的收益和适中的成本。$grand_city_incompatible_tooltip$"
 game_concept_plunder_route: "掠夺路线"
 game_concept_rebuild_route: "重建路线"
 game_concept_reform_route: "改革路线"
 game_concept_bloodmagic_spell: "血魔法法术"
 game_concept_bs_spell: "法术"
 game_concept_bs_spells: "法术"
 game_concept_bloodmagic_spell_desc: "#bold 法术#!让一位$pod_bloodsorcerer$能够施展按照吸血鬼的标准都会认为反常理的行为。每个法术都与一个$pod_bs_path$相关联。\n\n法术可能除了$pod_hunger_with_icon$之外还有额外的代价，比如$pod_static_stress$或[piety|E]。\n\n在[princes_of_darkness|E]中，法术通过#V $$blood_sorcery_interaction$#![character_interaction|E]施放。成功率取决于[learning|E]之间的差异，以及如果双方都是$POD_splat_vampire_plural$，则还取决于他们的[Glossary('Generation','game_concept_vampgeneration_desc')]差异。"
 game_concept_bloodmagic_tradition: "血魔法宗派"
 game_concept_bs_tradition: "宗派"
 game_concept_bs_traditions: "宗派"
 game_concept_bloodmagic_tradition_desc: "每个实践[bloodsorcery|E]的[Glossary('氏族','game_concept_Clan_desc')]都围绕其实践创造了自己独特的信仰体系和传说。\n\n在[princes_of_darkness|E]中，可以通过[journey|E]学习以下传统：\n$EFFECT_LIST_BULLET$#bold 奇术#!：属于[GetTrait('tremere').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold 杜–安–奇#!：属于[GetTrait('assamite').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold 咒术#!：属于#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#! \n$EFFECT_LIST_BULLET$#bold 修持#!：属于[GetTrait('ravnos').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold 库都术法#!：属于[GetTrait('tzimisce').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold 深渊秘术#!：属于[GetTrait('lasombra').GetName(GetNullCharacter)]\n\n学习一种血术法将解锁其相关的$pod_bs_paths$。一些道途也在不同的血术法之间共享。"
 game_concept_bloodmagic_path: "血魔法道途"
 game_concept_bs_path: "道途"
 game_concept_bs_paths: "道途"
 game_concept_bloodmagic_path_desc: "一个 #bold 道途#! 是一系列程序，用于实现某种效果，如控制天气、操控疾病或召唤恶魔，这些效果都属于$pod_bloodsorcery$的范畴。\n\n在[princes_of_darkness|E]中，道途是血魔法[lifestyle|E]中的一系列[perks|E]。这些特性可能会解锁新的或提升现有的$pod_bs_spells$。\n\n学习一个$pod_bs_tradition$将获得其相关的道途。有些道途在不同的流派之间也是共享的。"
 game_concept_bloodmagic_ritual: "血魔法仪式"
 game_concept_bs_ritual: "仪式"
 game_concept_bs_rituals: "仪式"
 game_concept_bloodmagic_ritual_desc: "#bold 仪式#!是强大的$pod_bs_spells$。它们的失败几率通常较低，但需要更多时间和额外资源，比如[gold|E]或[piety|E]。\n\n仪式与$pod_bs_traditions$相关联。通过在该传统的任何$pod_bs_path$中获得[perks|E]，可以解锁更强大的仪式。\n\n在[princes_of_darkness|E]中，仪式被视为$pod_journeys$。在计划仪式期间，你无法[travel|E]或参与[activities|E]。"
 game_concept_blood_potency_desc: "#bold 血能#!代表[GetTrait('vampire').GetName( GetNullCharacter )]血中的固有能力，它随着时间的推移而缓慢增长\n\n更高的血能会提升个体的[skills|E]并带来各种增益，但也会使其更难通过凡人满足$pod_hunger_with_icon$的饥渴。最终，必须依靠吸食其他吸血鬼的血液维生。\n\n血能会随着世纪流逝缓慢提升，上限取决于吸血鬼的[Glossary('世代','game_concept_vampgeneration_desc')]。[Glossary('血律','game_concept_diablerie_desc')]可以进一步提升，而在[Glossary('蛰眠','game_concept_torpor_desc')]期间则会缓慢下降。"
 game_concept_the_masquerade_desc: "潜藏是$POD_splat_vampire_plural$使用的术语，指的是保持他们存在对凡人隐秘的戒条。违反潜藏会招惹麻烦，例如被猎人袭击。在部分领地，这可能会被视作吸血鬼间的[crime|E]。\n大多数信仰可以通过[character_interaction|E]来掩盖潜藏的破漏。拥有太高的潜藏曝露度会导致派别叛乱和你的角色会被袭击的事件。"
 game_concept_ghoul_desc: "#X 你可以通过你在[Concept('domicile','藏身处')|E]中的建筑，将你的最大血仆规模提升到3以上。#!\n当吸血鬼将自己的血喂给另一个生物后，该生物就将成为血仆，并获得一些好处：停止衰老，有时甚至会稍微变得年轻；有限地获得[Glossary('血律','game_concept_discipline_desc')]和更快的愈合。然而，血仆依赖于血，因为他们在停止服用时将恢复到他们的真实年龄，这有时会是致命的。通过血缚的控制是侍主管理血仆的主要方式——或者更传统的技巧，如支配术。当然，作为血仆最恶心的部分是，人类成了非人怪物的奴隶，其把人类当作棋子或怡情的小点心。"
 game_concept_revenant_desc: "$POD_splat_revenant$是一种混杂生物，既像又不像$POD_splat_mortal_plural$，$pod_ghouls$和$POD_splat_vampire_plural$。有人会说遗传血仆介于凡人和吸血鬼之间；也有人会说它是受该隐诅咒腐化的上帝造物，两者混合在一起，直到它们变得不可分割。尽管如此，遗传血仆具有吸血鬼和凡人的许多特质，也具有普通血仆的许多特征。遗传血仆与血仆不同，能但不需要喝吸血鬼的血，因为他们可以自己产生精血，这也可以延缓他们的衰老。\n与他们的主人不同，遗传血仆是活着的生物。像凡人一样，他们需要进食、睡觉和呼吸。他们能够进行有性繁殖。与凡人不同的是，他们更加坚韧，并能从该隐的印记中获得超自然的力量。"
 game_concept_oblivion_pull: "湮灭牵引"
 game_concept_oblivion_pull_desc: "#bold 湮灭牵引#! 是衡量[UmbraGlossary('oblivion')]对$POD_splat_wraith$的吸引强度及其存在稳定性的指标。\n\n每月，#italic 玩家#!控制的$POD_splat_wraith$会根据其[UmbraGlossary('oblivion')]牵引值获得[stress|E]，范围从#N +10#!到#P -10#!。\n\n影响$pod_oblivion_pull$的因素包括：\n$TAB$$POD_splat_wraith$：#N +10#!\n$TAB$每点已分配的$pod_Fetter$：#P -1#!\n$TAB$每点已解决的$pod_Fetter$：#P -2#!\n$pod_oblivion_pull$的具体数值会显示在$POD_splat_wraith$的角色界面中。"
 game_concept_curia_support: "教廷支援"
 game_concept_curia_support_desc: "作为无领地的裁判官，你拥有名为“教廷支持度”的数值（可通过同名决议查看），代表教会对你行动的重视程度。\n\n你可通过完成特定契约或赢得对抗超自然势力的战争来提升教廷支持度。消耗支持度可请求各类恩赐（通过决议），加速实现终极目标：让欧洲与圣地摆脱地狱爪牙的污染。\n\n请注意，每次枢机团选出新教皇后，都将派遣宗座特使视察你的阵营。若发现你使用未经批准的#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L 术法#!#!或#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!等禁忌知识，特使将表示不满。若你更进一步成为[GetTrait('infernalist').GetName(GetNullCharacter)]或通过任何手段获得永生，将立即被处以绝罚。"
 game_concept_crafting_node: "制作节点"
 game_concept_crafting_node_desc: "制作节点是创建或升级宝物的主要方式。所有角色初始都拥有一些#bold 基础#!节点，这些节点无法被禁用。\n\n额外的特殊节点可通过技能、特殊建筑或其他特殊方式解锁。每个节点都有一些使用前必须满足的要求。$pod_crafting_brewing$类节点也可以自行执行效果。\n\n已解锁的#bold 特殊#!节点可以在开始制作前，通过在制作界面中点击它们来自由开启或关闭。"
 game_concept_crafting_complexity: "制作复杂度"
 game_concept_crafting_complexity_desc: "制作复杂度代表你在制作和升级一件宝物时可用的行动次数。\n\n这个数字主要由[GetTrait('pod_crafter').GetName(GetNullCharacter)][trait|El]提升，它会随着你使用$pod_crafting$机制而增强。"
 game_concept_crafting_potential: "制作潜力"
 game_concept_crafting_potential_desc: "制作潜力是宝物制作机制中的关键概念，决定了玩家在小游戏中的操作空间和机会。图幅越大，可操作的机会越多，有助于制作出更强大或更独特的宝物。制作潜力基于[GetTrait('pod_crafter').GetName(GetNullCharacter)][trait_level_track_xp|E]。"
 game_concept_crafting_rerolls: "制作重掷次数"
 game_concept_crafting_rerolls_desc: "制作重掷次数，顾名思义，允许你重新生成小游戏图幅，以潜在地获取更优质的$pod_crafting_nodes$。该次数基于你的[learning|E]，且是唯一直接关联某项[skill|E]的工艺属性。”"
 game_concept_ashen_ambassador: "灰烬大使"
 game_concept_ashen_ambassador_desc: "“大使”是无地角色，他们（主要）为有地角色，即“大使赞助人”的利益服务。\n他们的主要手段是名为“大使访问”的角色互动，通过不同的行动来影响当地统治者并获得经验。他们还可以通过“赞助人支持”互动向他们的恩主请求各种资源。\n一名大使一次只能有一位赞助人，如果他们获得了封地，就会失去他们的功能。不过，他们会保留迄今为止获得的经验和解锁的建筑。"
 game_concept_ashen_grandmaster: "灰烬宗师"
 game_concept_ashen_grandmaster_desc: "宗师是无地角色，他们领导着一个（正式或非正式的）军事组织。\n他们可以通过花费“灰烬宗师”特质经验（通过完成军事和战争无地契约获得）来自定义和改进他们的组织（通过一项决议）。\n无地$pod_kueijin$转而利用这些经验来学习和提升与战争相关的策略。"
 game_concept_ashen_caravan: "灰烬商队首领"
 game_concept_ashen_caravan_desc: "灰烬商队首领是少数真正通晓如何在黑暗世界的致命道路上穿行的角色，他们将为有需要之人提供自己的专业服务。通过完成运输契约可为此特质路线积累经验值。该特质可解锁新的无地宫廷职位，并降低各类旅行选项的使用成本。"
 game_concept_ashen_cult: "灰烬教主"
 game_concept_ashen_cult_desc: "先知、异端领袖、奇迹创造者……黑暗世界里，凡人也好，超自然生物也罢，到处都是追寻真理、愿意相信魅力超凡之人的家伙，只要那人能给出他们认可的“真理”。\n你可以通过名为“灰烬教主”的决议来提升这个特质的等级。这个决议会触发事件，让你用各种方式与你所在地的伯爵领互动。"
 game_concept_crafting_enhance_limit: "潜能激发"
 game_concept_crafting_enhance_limit_desc: "每件[artifact|E]的强化上限由其潜力决定。\n\n潜力主要基于[rarity|E]：\n$BULLET_WITH_TAB$#COMMONBROWN 普通级#! — #N 0#!\n$BULLET_WITH_TAB$#color_dark_green 大师级#! — 1\n$BULLET_WITH_TAB$#FAMEDBLUE #! 名作级— 2\n$BULLET_WITH_TAB$#ILLUSTRIOUSPURPLE #! 卓越级— 3"
 game_concept_akuma: "恶鬼"
 game_concept_akuma_desc: "恶鬼（或称“魔食者”）是背弃德行、效忠于[Glossary('阎魔','podgloss.yamaking')]的存在，其中既有懵懂无知的小卒，亦有掌控地狱之力的可怖存在。\n\n就[princes_of_darkness|E]的目标机制而言，恶鬼包含：\n$BULLET_WITH_TAB$拥有[GetTrait('cultist').GetName(GetPlayer)][trait|E]的角色\n$BULLET_WITH_TAB$拥有[GetTrait('wukuei').GetName(GetPlayer)][trait|E]的角色\n$BULLET_WITH_TAB$拥有[GetFaithDoctrine('special_doctrine_allied_to_yomi_wan_hostility').GetBaseName][faith|E]的[doctrine|E]角色\n$BULLET_WITH_TAB$拥有[GetModifier('yama_king_modifier').GetNameWithTooltip][modifier|E]的角色"
 grand_city_incompatible_tooltip: "\n\n#help $fera_tribe_government$[governments|El]无法使用这座城市。征服这座城市后，它将自动转变为一个部落。#!"
 grand_city_semi_incompatible_tooltip: "\n\n#help $fera_tribe_government$ [governments|El] 上文未特别提及的律令制政体不能使用这座城市。征服这座城市后，它将自动转化为一个部落。#!"
 game_concept_courts_of_love: "爱之皇庭"
 game_concept_courts_of_love_desc: "爱之皇庭是一个[GetTrait('vampire').GetName(GetNullCharacter)]领地和封建机构，由法兰西[GetTrait('toreador').GetName(GetNullCharacter)]组成。它由许多爱之皇庭组成 ，每个都是强大的妥芮朵的领地。\n\n其中最著名和最具影响力的皇庭及其历史上的拥有者是：\n$BULLET_WITH_TAB$瓦卢瓦由女族长萨莉安娜持有 \n$BULLET_WITH_TAB$香槟由公正者海伦妮持有 \n$BULLET_WITH_TAB$普瓦捷由艾蒂安·德·普瓦捷国王持有\n$BULLET_WITH_TAB$安茹伊由思妲·德·布莱斯女王持有\n$BULLET_WITH_TAB$图卢兹由埃丝克拉蒙德持有"
 game_concept_grand_paris: "辉煌巴黎"
 game_concept_grand_paris_desc: "巴黎$pod_grand_city$是许多人渴望的。这座城市有三个版本：\n\n$BULLET_WITH_TAB$骑士巴黎：对[GetTrait('toreador').GetName(GetNullCharacter)]妥芮朵、[GetTrait('ventrue').GetName(GetNullCharacter)]梵卓，或遵循骑士之道的$POD_splat_vampire$可用。仿照亚历山大的大王庭与$pod_courts_of_love$之间动荡的联盟及其蕴含的所有潜力。\n此版本包含一个为妥芮朵（和骑士之道）准备的独特建筑，以及另一个为梵卓准备的建筑（亚历山大本人会获得一个不同的版本）。\n\n$BULLET_WITH_TAB$幽影巴黎：对其他 $POD_splat_vampire_plural$, $POD_splat_kueijin_plural$, $POD_splat_demon_plural$, $POD_splat_wraith_plural$, #TOOLTIP:GAME_TRAIT,banemummy,[GetNullCharacter] #L 忌灵木乃伊#!#!，或拥有哀怒廷教义的信仰可用。代表着一个处于黑暗超自然生物控制下的巴黎。\n\n$BULLET_WITH_TAB$自由巴黎：对其他所有人可用。一个摆脱了黑暗势力寄生影响的巴黎。暗影裁判所在城市中获得一些独特建筑。$grand_city_incompatible_tooltip$"
 game_concept_holy_cairo: "开罗，胜利之城"
 game_concept_holy_cairo_desc: "开罗有时被称为 Umm el-Dunya（“世界的母亲”）。最初是福斯塔特镇，该地区由波斯人、罗马人、拜占庭人，最后由阿拉伯人在此基础上建造，并将其命名为阿尔卡希拉（“胜利者”）。这座城市有三个版本：\n\n$BULLET_WITH_TAB$古开罗：对所有[Glossary('奥西里斯联盟','game_concept_osirian_league_desc')]成员和以实玛利派#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L 木乃伊#!开放。当你召集奥西里斯信徒聚集于神圣的开罗时，将获得独特能力。你需要所有成员担任熟练的[councillors|E]，以解锁这座城市的全部潜力。\n#warning 强烈建议在第三个开局时间点游玩此版本。该版本在第一个开局中完全禁用。#!\n\n$BULLET_WITH_TAB$血族开罗：仅限#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter]  #L 吸血鬼#!使用。建造并扩展[khittas|E]，以发展开罗并提升[councillors|E]和[court_positions|E]的效率。拥有[Glossary('阿什拉派','game_concept_ashirra_desc')]支柱[doctrine|el]的信仰，在建造阿什拉派所属基塔特时能获得额外加成。赛特信徒可重建他们的创始神庙，创立自己的赛特之道[faith|El]。\n\n$BULLET_WITH_TAB$伊斯兰开罗：对所有其他角色开放，但只有精诚兄弟社能解锁这座城市的真正潜力。$grand_city_semi_incompatible_tooltip$"
 game_concept_osirian_league: "奥西里斯联盟"
 game_concept_osirian_league_desc: "奥西里斯联盟是一个致力于对抗[Glossary('赛特','game_concept_antediluvian_desc')]的组织。\n\n其成员包括：\n$BULLET_WITH_TAB$索贝克领导下的[GetTrait('mokole').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L 狼族#!的寂静漫游者部族。\n$BULLET_WITH_TAB$布巴斯提#TOOLTIP:GAME_TRAIT,bastet,[GetNullCharacter] #L 猫人#!。\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L 吸血鬼#!奥西里斯之子与阿努比斯。\n$BULLET_WITH_TAB$伊西斯密教的凡人巫师祭司。\n$BULLET_WITH_TAB$流浪的[GetTrait('eshu').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('shemsuheru').GetName(GetNullCharacter)]自己。"
 game_concept_khittas: "区域"
 game_concept_khittas_desc: "开罗存在着多个派系，这些派系被组织进不同的区域——即松散定义的区域，每个区域属于某个特定氏族或血系。这些区域通常实行自治，但最终都需向苏丹或亲王效忠。尽管开罗以穆斯林为主，但只有少数基塔特与[Glossary('阿什拉派','game_concept_ashirra_desc')]结盟。\n\n阿什拉派区域：\n$BULLET_WITH_TAB$巴努·拉玛区：勒森魃氏族的区域。\n$BULLET_WITH_TAB$巴努·亚什库尔：阿刹迈氏族的区域。\n$BULLET_WITH_TAB$巴努·哈吉教区：诺斯费拉图氏族的区域。\n$BULLET_WITH_TAB$巴努·芬区：妥芮朵氏族的区域。该区域的正史名称为巴努·杜瓦尔，1798年拿破仑进入开罗时，一名妥芮朵成员随行并建立了此区域。\n\n其他区域：\n$BULLET_WITH_TAB$巴努·艾尔拉亚区：真布鲁赫氏族的区域。\n$BULLET_WITH_TAB$巴努·萨伊迪区：赛特信徒氏族的区域。\n$BULLET_WITH_TAB$巴努·扎马雷克区：自由区域，供各类其他血族栖身。\n$BULLET_WITH_TAB$巴努·阿兹拉克区：由安东尼乌斯及其后裔领导的梵卓氏族区域。\n$BULLET_WITH_TAB$巴努·吉萨区：位于开罗城外的阿努比斯门徒区域。\n"
 game_concept_POD_herd: "牧群"
 game_concept_POD_herd_desc: "#X 你可以通过你在[Concept('domicile','藏身处')|E]中的建筑，将你的最大牧群规模提升到3以上。#!\n牧群是一群凡人，其成员允许某个吸血鬼吸食他们，提供了便捷的食物来源，并解放了他的夜晚，用于处理更紧急的事项。"
 game_concept_crafting: "制作"
 game_concept_crafting_desc: "制作是一种用于创造[artifacts|E]的机制。\n有三种不同的制作方法：\n$BULLET_WITH_TAB$$pod_crafting_forging$\n$BULLET_WITH_TAB$$pod_crafting_brewing$\n$BULLET_WITH_TAB$$pod_crafting_enhancing$\n\n制作通过利用可以通过特质和其他方法解锁的$pod_crafting_nodes$来完成。$pod_crafting_nodes$被放置在制作小游戏中，你可以在其中点击并将它们相互连接以产生你想要的结果。\n小游戏地图的大小由你的$pod_crafting_potential$决定，并且地图可以使用$pod_crafting_rerolls$重新生成。\n在单个会话中可以利用的节点数量受你的$pod_crafting_complexity$限制。"
 game_concept_crafting_forging: "锻造"
 game_concept_crafting_forging_desc: "锻造是指创造全新的[artifacts|E]的过程。这些宝物通常装备到你的角色身上，尽管有些可能有其他用途。锻造有时可能需要额外资源，例如宝物碎片或特定囚犯。\n\n创建的物品的[rarity|E]取决于锻造过程结束时的最大耐久度。"
 game_concept_crafting_brewing: "酿造"
 game_concept_crafting_brewing_desc: "酿造是指通过各种方法（例如炼金术）来创造可消耗的混合物和其他物质的过程。这些可消耗品可以通过使用[character_interaction|E]作用于你自己或其他角色。"
 game_concept_crafting_enhancing: "强化"
 game_concept_crafting_enhancing_desc: "强化或附魔是指改进现有的[artifacts|E]的过程。每个宝物可以被强化，其上限为$pod_crafting_enhance_limit$，并且某些宝物可能完全无法被强化。"
 game_concept_crafting_nodes: "制作节点"
 game_concept_POD_homeland: "故土"
 game_concept_POD_homeland_desc: "#bold 故土#!是某些$POD_splat_mummy_plural$的起源[region|E]，能让他们追忆往昔。\n每年，$POD_splat_mummy_plural$身处故土，可获得#P +1#!回忆[trait_level_track_xp|E]。\n故土列表：$BULLET_WITH_TAB$[GetTrait('shemsuheru').GetName(GetPlayer)]-[GetGeographicalRegion('pod_lands_of_faith').GetName]\n$BULLET_WITH_TAB$[GetTrait('cabiri').GetName(GetPlayer)]-[GetGeographicalRegion('POD_region_greece').GetName]\n$BULLET_WITH_TAB$[GetTrait('wutian').GetName(GetPlayer)]-[GetGeographicalRegion('world_tibet').GetName]\n其他木乃伊没有故土，因此无法从中获得任何益处。"
 game_concept_POD_tomb_raid: "陵墓劫掠"
 game_concept_POD_tomb_raid_desc: "#bold 墓穴劫掠#!是贪婪冒险者偶尔袭击你[domicile|E]的事件。\n\n你可通过[skill|E]检定或消耗[gold|E]、[prestige|E]与[piety|E]尝试保全墓穴。若失败，墓中随机建筑将降级，并损失回忆[trait_level_track_xp|E]，同时增加[stress|E]。"
 game_concept_blood_magic_lifestyle: "血术法"
 game_concept_blood_magic_lifestyle_desc: "通过学习血术法，该隐之子能够召唤火焰、操纵天气，以及施展诸多连血族标准都视为反常的异能。行使血术法即是将自身精血扭曲驯服的过程。这类能力无时无刻不在提醒着吸血鬼——他们与凡人的鸿沟，因为血肉之躯绝无可能以此等方式驾驭魔法。"
 game_concept_lunar_auspicegifts_lifestyle: "月兆灵赋"
 game_concept_lunar_auspicegifts_lifestyle_desc: "与月兆相生相伴的灵赋。"
 game_concept_POD_fera_maa: "化兽族裔"
 game_concept_POD_fera_maa_desc: "狼族是由盖亚创造的，作为她的獠牙和爪子，以保护她的安全，但他们并不是她唯一的孩子。她创造了许多其他品种的$glossary_fera$，并分别赋予他们使命。有些人随着时间的流逝而迷失了方向；有些人则是被狼族逼迫离开他们的职务。有些人转而只为三相的一面服务，而不是为整个盖亚服务。\n\n化形者的种类跟他们的化形对象一样多，所以唯一可靠的对策是了解你所面对的那种超自然的弱点。\n\n与他们克制和被克制的地方相同，化形者的地形适应也有很大差异。"
 game_concept_POD_health_track: "健康等级"
 game_concept_POD_health_track_desc: "#bold 健康等级#! 概念直接源自桌面规则书，其中你的[health|E]以若干方格显示。每次受伤时，你需标记其中一个方格。\n\n生命值方格会显示在伤势[traits|E]（如[GetTrait('wounded_1').GetName(GetNullCharacter)]）的悬浮提示中，标记方式如下：\n\n$TAB$$POD_damage_box$$pod_superficial_damage$\n$TAB$$POD_aggravated_damage_box$$pod_aggravated_damage$\n$TAB$$POD_undamaged_box$无伤\n\n你的健康等级总长度取决于你的$pod_splat$。\n\n随着受到的伤害增加，你将进入#bold 受伤#!状态，导致你的[skills|E]受到越来越严重的惩罚。受伤程度取决于已填满的格子数量（与伤害类型无关）。\n\n如果所有生命值格子都被填满，且其中一半或更多为$pod_aggravated_damage$，你将#N 死亡#!。不朽角色则进入[Glossary('蛰眠','game_concept_torpor_desc')]状态。"
 game_concept_POD_superficial_damage: "表面伤害"
 game_concept_POD_superficial_damage_desc: "标记在$pod_health_track$上的伤害类型之一，它显示为@health_track_damage_icon!图标。\n\n大多数$pod_splats$每#V 2年#!会自然恢复#V 1点#!表面伤害。某些特质和技能可以增加恢复量或缩短冷却时间。$POD_splat_vampire_plural$需使用#V 血愈#![character_interaction|E]。\n\n如果$pod_health_track$已满且承受更多表面伤害，超出的部分将转化为$pod_aggravated_damage$。\n\n表面伤害也可通过特定能力[Concept('soak_damage','减伤')|E]，获得一定概率完全规避伤害。"
 game_concept_POD_aggravated_damage: "恶性伤害"
 game_concept_POD_aggravated_damage_desc: "标记在$pod_health_track$上的伤害类型之一，它显示为@health_track_aggravated_damage_icon!图标。\n\n恶性伤害比$pod_superficial_damage$更难恢复。大多数种族每#V 4年#!会将1格恶性伤害降级为$pod_superficial_damage$。\n\n若所有生命格被填满且半数以上为$pod_aggravated_damage$，角色将#N 死亡#!。不朽者则会进入[Glossary('蛰眠','game_concept_torpor_desc')]。"
 game_concept_soak_damage: "伤害减免"
 game_concept_soak_damage_desc: "部分能力和[perks|E]可以提供$pod_superficial_damage$减免概率，使伤害无效化。\n\n穿戴护甲类[artifact|E]是最简单的减免方式，每级[rarity|E]提升#V 10%#!减免概率。"
 game_concept_POD_landless_mechanics: "无地机制"
 game_concept_POD_landless_mechanics_desc: "以下$pod_splats$作为[adventurers|E]拥有独特机制：\n\n$BULLET_WITH_TAB$#bold $POD_splat_vampire_plural$、$POD_splat_ghoul_plural$与$POD_splat_revenant_plural$#!可通过提升#TOOLTIP:GAME_TRAIT,ashen_adventurer,[GetNullCharacter] #L 灰烬冒险者#!#!等级，为其[domicile|E]解锁新互动与建筑生产线。\n$BULLET_WITH_TAB$ #bold $POD_splat_kueijin_plural$#!同样可成为#TOOLTIP:GAME_TRAIT,ashen_adventurer,[GetNullCharacter] #L 灰烬冒险者#!#!但机制略有不同。\n$BULLET_WITH_TAB$#bold 暗影裁判所的$POD_splat_hunter_plural$#!通过成功猎杀夜间生物获得[curia_support|E]。\n$BULLET_WITH_TAB$#bold 独立$POD_splat_hunter_plural$#!可通过一系列决议获取其他$POD_splat_hunter$组织的支援。\n$BULLET_WITH_TAB$ #bold $POD_splat_mummy_plural$#!拥有陵墓系统，会遭遇贪婪冒险者发起的[Concept('POD_tomb_raid','陵墓劫掠')|E]。\n\n其他$pod_splats$目前#N 暂不可作为[adventurers|E]进行游玩#!。"
 game_concept_fetish: "灵具"
 game_concept_fetish_desc: "灵具是一种注入了被束缚灵类的[artifact|E]。所有$glossary_fera$天生就能使用它们，其他$pod_splats$则需要特殊特质或修正才能使用。\n\n与常规宝物不同，灵具需要维护才能保持激活：\n$BULLET_WITH_TAB$$glossary_fera$：每件灵具消耗5%的$POD_terrain_gnosis_regen_supply_limit_mult$。\n$BULLET_WITH_TAB$：每件灵具消耗一个$pod_spirit_companion$。\n如果无法满足维护条件，所有灵具宝物都将失效。\n\n能够装备灵具会自动解锁灵具$pod_fetish_smithing$$pod_crafting_forging$节点。"
 game_concept_fetish_smithing: "灵具锻造"
 game_concept_fetish_smithing_desc: "将[GetTrait('spirit').GetName(GetNullCharacter)]束缚于[artifact|E]的行为。此节点会将一个$pod_spirit_companion$或被囚禁的灵类束缚于一件宝物中，并将其转化为$pod_fetish$。\n\n该节点的效果取决于所绑定的灵类：↵\n$BULLET_WITH_TAB$$pod_spirit_language$\n$BULLET_WITH_TAB$[education_trait|E]\n$BULLET_WITH_TAB$[physical_traits|E]\n$BULLET_WITH_TAB$[trait_level_track_xp|E]\n$BULLET_WITH_TAB$制造者的相关技能或修正"
 game_concept_spirit_companion: "灵类同伴"
 game_concept_spirit_companion_desc: "灵类同伴是一种可通过[character_interaction|E]与自愿的[GetTrait('spirit').GetName(GetNullCharacter)]建立的独特关系。该灵类将加入你的宫廷并提供多种增益：\n$BULLET_WITH_TAB$根据其类型授予一个独特的契约修正\n$BULLET_WITH_TAB$提升$POD_terrain_gnosis_regen_supply_limit_mult$\n$BULLET_WITH_TAB$提升灵类任务$pod_journey$的速度\n$BULLET_WITH_TAB$可用于$pod_fetish_smithing$\n\n灵类同伴仅能通过以它们为目标的[Concept('character_interaction','角色互动')|E]来获得[trait_level_track_xp|E]。"
 game_concept_spirit_language: "灵语"
 game_concept_spirit_language_desc: "在你能够与一位 [GetTrait('spirit').GetName(GetNullCharacter)] 互动之前，你必须先学会它的语言，而这只能通过 [character_interaction|E] 来完成。\n\n然而，$pod_ancestor_spirits$ 的语言（例如 原初语）是 $glossary_fera$ 与生俱来的天赋，其他存在无法以常规手段习得。"
 game_concept_ancestor_spirit: "先祖灵"
 game_concept_ancestor_spirit_desc: "$glossary_fera$在死亡时有几率成为先祖之灵[GetTrait('spirit').GetName(GetNullCharacter)]。这些灵类只能用其所属的$glossary_fera$血种的$pod_ancestral_tongue$进行交流。\n\n转变为灵类的几率主要取决于该$glossary_fera$的位阶（[trait_level_track_xp|E]）与[piety_level|E]。"
 game_concept_holy_jerusalem: "圣城耶路撒冷"
 game_concept_holy_jerusalem_desc: "耶路撒冷这座$pod_grand_city$对三大亚伯拉罕宗教都具有极其重要的地位。自以撒捆绑献祭的时代起，耶路撒冷就是犹太教历史上的崇拜中心，并且是某些节期唯一允许的庆祝地点——倘若有人无视拉比教导的话。基督教将耶路撒冷视为弥赛亚耶稣被处决并复活的地点，并且与橄榄山近在咫尺。伊斯兰教则认为耶路撒冷是穆罕默德夜行登霄的目的地，也是第一个朝向。\n\n该城市的变体基于三大宗教之间政治影响力的平衡，这种平衡在城市被征服后依然存在。请记住，作为基督教统治者，在从穆斯林统治者手中夺取该城后，你可能会发现提升基督教影响力代价高昂。该城市有4个版本：\n$BULLET_WITH_TAB$基督教耶路撒冷：对$pod_christian_derived_faiths$信徒可用。扩展5个十字军修会的势力，这些修会都能提升或被你的骑士所提升。\n$BULLET_WITH_TAB$穆斯林耶路撒冷：对$pod_muslim_derived_faiths$信徒可用。翻修并祝圣重要遗址，以增加你的收入并增强抵御入侵十字军的能力。\n$BULLET_WITH_TAB$犹太教耶路撒冷：对$pod_jewish_derived_faiths$信徒可用。重建耶路撒冷的古老纪念建筑，以获得一套全面的增益建筑。\n$BULLET_WITH_TAB$分裂的耶路撒冷：对其他所有信仰可用。发展各个城区，以解锁一个更专业化的耶路撒冷可能拥有的部分好处，同时维持权力平衡；可以使用\"权力平衡\"[decision|E]决议中的图表来监控。\n\n除了不同的建筑外，耶路撒冷还提供一些涉及附近深坑的[Concept('jerusalem_unique_decisions','独特决议')|E]。"
 game_concept_christian_derived_faiths: "基督教衍生信仰"
 game_concept_christian_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_christian_derived_faiths_desc_ingame', 'game_concept_christian_derived_faiths_desc_outofgame' )]"
 game_concept_christian_derived_faiths_desc_ingame: "在[Glossary('黑暗世界','game_concept_world_of_darkness_desc')]中，很少有[characters|E]信奉形式可辨的基督教，而是信奉源自更常见版本的[faiths|E]。在[princes_of_darkness|E]中，这些[faiths|E]包括：\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('viachristi').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('viavindicta').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('viapenaculum').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('viaredemptio').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('pathoftheheavenlyabode').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('vianoctis').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('viadolorosa').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('viacain').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('viapura').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('redtemptation').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('apostlesthirdcaine').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('blackmagdalene').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('eschatologists').GetName]\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('sanctamater').GetName]\n$BULLET_WITH_TAB$@supehunter_icon![GetFaithByKey('shadowinquisition').GetName]\n$BULLET_WITH_TAB$@supehunter_icon![GetFaithByKey('akritai').GetName]\n$BULLET_WITH_TAB$[GetReligionByKey('calomenasforsaken_religion').GetName]信仰\n$BULLET_WITH_TAB$@werewolf_icon![GetFaithByKey('crestofthehorn').GetName]\n$BULLET_WITH_TAB$@werewolf_icon![GetFaithByKey('orderofourmercifulmother').GetName]\n$BULLET_WITH_TAB$[GetReligionByKey('fishers_religion').GetName]信仰\n$BULLET_WITH_TAB$任何带有@changeling_icon![GetFaithDoctrine('special_doctrine_fae_constantinians_hostility').GetBaseName]的信仰"
 game_concept_christian_derived_faiths_desc_outofgame: "在[Glossary('黑暗世界','game_concept_world_of_darkness_desc')]中，很少有[characters|E]信奉形式可辨的基督教，而是信奉源自更常见版本的[faiths|E]。在[princes_of_darkness|E]中，这些[faiths|E]包括：\n$BULLET_WITH_TAB$@vampire_icon!$viachristi$\n$BULLET_WITH_TAB$@vampire_icon!$viavindicta$\n$BULLET_WITH_TAB$@vampire_icon!$viapenaculum$\n$BULLET_WITH_TAB$@vampire_icon!$viaredemptio$\n$BULLET_WITH_TAB$@vampire_icon!$pathoftheheavenlyabode$\n$BULLET_WITH_TAB$@vampire_icon!$vianoctis$\n$BULLET_WITH_TAB$@vampire_icon!$viadolorosa$\n$BULLET_WITH_TAB$@vampire_icon!$viacain$\n$BULLET_WITH_TAB$@vampire_icon!$viapura$\n$BULLET_WITH_TAB$@vampire_icon!$redtemptation$\n$BULLET_WITH_TAB$@vampire_icon!$apostlesthirdcaine$\n$BULLET_WITH_TAB$@vampire_icon!$blackmagdalene$\n$BULLET_WITH_TAB$@vampire_icon!$eschatologists$\n$BULLET_WITH_TAB$@vampire_icon!$sanctamater$\n$BULLET_WITH_TAB$@supehunter_icon!$shadowinquisition$\n$BULLET_WITH_TAB$@supehunter_icon!$akritai$\n$BULLET_WITH_TAB$$calomenasforsaken_religion$[faiths|E]\n$BULLET_WITH_TAB$@werewolf_icon!$crestofthehorn$\n$BULLET_WITH_TAB$@werewolf_icon!$orderofourmercifulmother$\n$BULLET_WITH_TAB$$fishers_religion$[faiths|E]\n$BULLET_WITH_TAB$任何[faith|E]带有@changeling_icon!$special_doctrine_fae_constantinians_hostility_name$"
 game_concept_muslim_derived_faiths: "伊斯兰衍生信仰"
 game_concept_muslim_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_muslim_derived_faiths_desc_ingame', 'game_concept_muslim_derived_faiths_desc_outofgame' )]"
 game_concept_muslim_derived_faiths_desc_ingame: "在[Glossary('黑暗世界','game_concept_world_of_darkness_desc')]中，很少有[characters|E]信奉形式可辨的伊斯兰教，而是信奉源自更常见版本的[faiths|E]。在[princes_of_darkness|E]中，这些[faiths|E]包括：\n$BULLET_WITH_TAB$@vampire_icon![ashirra|E]\n$BULLET_WITH_TAB$任何带有@vampire_icon![GetFaithDoctrine('special_doctrine_ashirra_pillars_kindred').GetBaseName][faith|E]\n$BULLET_WITH_TAB$[GetReligionByKey('roadofblood_religion').GetName][faiths|E]\n$BULLET_WITH_TAB$@supehunter_icon![GetFaithByKey('ikhwan_al_safa').GetName]"
 game_concept_muslim_derived_faiths_desc_outofgame: "在[Glossary('黑暗世界','game_concept_world_of_darkness_desc')]中，很少有[characters|E]信奉形式可辨的伊斯兰教，而是信奉源自更常见版本的[faiths|E]。在[princes_of_darkness|E]中，这些[faiths|E]包括：\n$BULLET_WITH_TAB$@vampire_icon![Glossary('阿什拉派','game_concept_ashirra_desc')]\n$BULLET_WITH_TAB$任何带有@vampire_icon!$special_doctrine_ashirra_pillars_kindred_name$的[faith|E]\n$BULLET_WITH_TAB$$roadofblood_religion$[faiths|E]\n$BULLET_WITH_TAB$@supehunter_icon!$ikhwan_al_safa$"
 game_concept_jewish_derived_faiths: "犹太教衍生信仰"
 game_concept_jewish_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_jewish_derived_faiths_desc_ingame', 'game_concept_jewish_derived_faiths_desc_outofgame' )]"
 game_concept_jewish_derived_faiths_desc_ingame: "在[Glossary('黑暗世界','game_concept_world_of_darkness_desc')]中，很少有[characters|E]信奉形式可辨的犹太教，而是信奉源自更常见版本的[faiths|E]。在[princes_of_darkness|E]中，这些[faiths|E]包括：\n$BULLET_WITH_TAB$@vampire_icon![GetFaithByKey('derechchaim').GetName]\n$BULLET_WITH_TAB$@supehunter_icon![GetFaithByKey('judge').GetName]"
 game_concept_jewish_derived_faiths_desc_outofgame: "在[Glossary('黑暗世界','game_concept_world_of_darkness_desc')]中，很少有[characters|E]信奉形式可辨的犹太教，而是信奉源自更常见版本的[faiths|E]。在[princes_of_darkness|E]中，这些[faiths|E]包括：\n$BULLET_WITH_TAB$@vampire_icon!$derechchaim$\n$BULLET_WITH_TAB$@supehunter_icon!$judge$"
 game_concept_jerusalem_unique_decisions: "耶路撒冷决议"
 game_concept_jerusalem_unique_decisions_desc: "[SelectLocalization( IsInGame, 'game_concept_jerusalem_unique_decisions_desc_ingame', 'game_concept_jerusalem_unique_decisions_desc_outofgame' )]"
 game_concept_jerusalem_unique_decisions_desc_ingame: "在欣嫩谷有一处坑穴的入口，其中沉眠着一头拥有强大力量的可怖存在。无数相互矛盾的呓语自坑中传出，或许能带来某些启示。这些声音触及凡人与超自然，驱使该地区的许多生灵陷入宗教狂热与癔症。以下是可供选择的决议摘要：\n\n$BULLET_WITH_TAB$#V $supehunter_purify_jerusalem_pit_decision$#!：适用于[GetTrait('supehunter').GetName(GetNullCharacter)]属于[GetReligionByKey('hunters_religion').GetAdjective][religion|E]的角色使用。\n$BULLET_WITH_TAB$#V $malkavian_search_for_sister_decision$#!：适用于[GetTrait('malkavian').GetName(GetNullCharacter)]寻找对其重要之人……\n$BULLET_WITH_TAB$#V $malakaite_mistress_boon_decision$#!：适用于[GetTrait('vampire').GetName(GetNullCharacter)]、[GetTrait('revenant').GetName(GetNullCharacter)]或[GetTrait('ghoul').GetName(GetNullCharacter)]属于[GetFaithByKey('eyesofmalakai').GetName][faith|E]的情况，可以向你的女主人请求援助以完成任务。\n$BULLET_WITH_TAB$#V $molochite_maintain_the_sleep_decision$#!：适用于属于[GetDynastyHouseByID('house_moloch').GetName][house|E]，可以在加深沉眠者睡眠的同时汲取知识。\n$BULLET_WITH_TAB$#V $nergalite_wake_the_sleeper_decision$#!：适用于[GetTrait('infernalist').GetName(GetNullCharacter)] 或[GetTrait('cultist').GetName(GetNullCharacter)][GetTrait('vampire').GetName(GetNullCharacter)]，或属于[GetDynastyHouseByID('house_nergal').GetName]或[GetDynastyHouseByID('house_angellisater').GetName]的[GetTrait('vampire').GetName(GetNullCharacter)][house|E]。援助此类存在将获得回报。\n$BULLET_WITH_TAB$#V $vamp_lower_gen_jerusalem_decision$#!：适用于没有专属决议的 [GetTrait('vampire').GetName(GetNullCharacter)]来降低你的[Glossary('世代','game_concept_vampgeneration_desc')]，但需警惕代价。\n$BULLET_WITH_TAB$#V $mummies_tap_web_faith_decision$#!：适用于[GetTrait('shemsuheru').GetName(GetNullCharacter)]、[GetTrait('cabiri').GetName(GetNullCharacter)]或[GetTrait('banemummy').GetName(GetNullCharacter)][GetTrait('mummy').GetName(GetNullCharacter)]，当他们接入信仰之网以获取额外的赫考经验。\n$BULLET_WITH_TAB$#V $constantinian_channel_religious_fervor_decision$#!：适用于拥有精怪血脉、属于[GetFaithDoctrine('special_doctrine_fae_constantinians_hostility').GetBaseName]的角色，在完成君士坦丁派探题[decision|E]后，可以利用当地的狂热来寻求力量。"
 game_concept_jerusalem_unique_decisions_desc_outofgame: "在欣嫩谷有一处坑穴的入口，其中沉眠着一头拥有强大力量的可怖存在。无数相互矛盾的呓语自坑中传出，或许能带来某些启示。这些声音触及凡人与超自然，驱使该地区的许多生灵陷入宗教狂热与癔症。以下是可供选择的决议摘要：\n$BULLET_WITH_TAB$#V $supehunter_purify_jerusalem_pit_decision$#!：适用于[GetTrait('supehunter').GetName(GetNullCharacter)]属于$hunters_religion_adj$[religion|E]的角色使用。\n$BULLET_WITH_TAB$#V $malkavian_search_for_sister_decision$#!：适用于[GetTrait('malkavian').GetName(GetNullCharacter)]寻找对其重要之人……\n$BULLET_WITH_TAB$#V $malakaite_mistress_boon_decision$#!：适用于[GetTrait('vampire').GetName(GetNullCharacter)]、[GetTrait('revenant').GetName(GetNullCharacter)]或[GetTrait('ghoul').GetName(GetNullCharacter)]属于$eyesofmalakai$[faith|E]的情况，可以向你的女主人请求援助以完成任务。\n$BULLET_WITH_TAB$#V $molochite_maintain_the_sleep_decision$#!：适用于[GetTrait('vampire').GetName(GetNullCharacter)]属于[house|E]$dynn_moloch$的情况，可以在加深沉眠者睡眠的同时汲取知识。\n$BULLET_WITH_TAB$#V $nergalite_wake_the_sleeper_decision$#!：适用于[GetTrait('infernalist').GetName(GetNullCharacter)]或[GetTrait('cultist').GetName(GetNullCharacter)][GetTrait('vampire').GetName(GetNullCharacter)]，或属于[house|E]$dynn_nergal$或$dynn_angellisater$的[GetTrait('vampire').GetName(GetNullCharacter)]。援助此类存在将获得回报。\n$BULLET_WITH_TAB$#V $vamp_lower_gen_jerusalem_decision$#!：适用于没有专属决议的 [GetTrait('vampire').GetName(GetNullCharacter)]来降低你的[Glossary('Generation','game_concept_vampgeneration_desc')]，但需警惕代价。\n$BULLET_WITH_TAB$#V $mummies_tap_web_faith_decision$#!：适用于[GetTrait('shemsuheru').GetName(GetNullCharacter)]、[GetTrait('cabiri').GetName(GetNullCharacter)]或[GetTrait('banemummy').GetName(GetNullCharacter)][GetTrait('mummy').GetName(GetNullCharacter)]，当他们接入信仰之网以获取额外的赫考经验。\n$BULLET_WITH_TAB$#V $constantinian_channel_religious_fervor_decision$#!：适用于拥有妖精血脉、属于$special_doctrine_fae_constantinians_hostility_name$的角色，在完成君士坦丁派探题[decision|E]后，可以利用当地的狂热来寻求力量。"