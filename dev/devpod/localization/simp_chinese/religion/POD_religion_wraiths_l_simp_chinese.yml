 malfean_desc: "巨孽是黑暗与毁灭的巨硕之力，他们的影响所及之处都会带来痛苦、邪恶和恐怖。然而，在大多数情况下，他们是一种看不见的力量，只有通过他们的爪牙和仆人才能感受到。人类应该心存感激。"
