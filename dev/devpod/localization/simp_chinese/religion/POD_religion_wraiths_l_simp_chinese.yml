 grand_maw: "巨颌"
 grand_maw_adj: "大祖母"
 grand_maw_desc: "大祖母是……某种东西的名字。有人认为“她”是上帝的邪恶孪生子，有人认为“她”是一个已死宇宙的残余，还有人认为“她”就是[UmbraGlossary('oblivion')]本身。“她”究竟是什么永远不得而知，但可以确定的是，她是一位古老的实体，想要吞噬地球上的一切生灵。她的俗名源于“巨颌”，听起来与“祖母”很接近。因此，她被称为大祖母。"
