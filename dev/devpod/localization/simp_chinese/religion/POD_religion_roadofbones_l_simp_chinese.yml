 viaossium:0 "骸骨之道"
 viaossium_adj:0 "骸骨之道"
 viaossium_adherent:0 "学者"
 viaossium_adherent_plural:0 "学者"
 viaossium_desc:0 "骸骨之路的追随者把知识看得高于一切。通过对未知事物的深入研究，学者们能够困住他们的心兽。他们几乎会竭尽全力去学习新东西，但不会为了某个原因而毫无必要地牺牲自己。毕竟，他们自己收集的知识太重要了，不能让别人处理。同时，学者不惧怕死亡；反而深深沉迷于它。"
 tariqelatham:0 "塔里克·阿萨姆"
 tariqelatham_adj:0 "阿萨姆之道"
 tariqelatham_adherent:0 "学者"
 tariqelatham_adherent_plural:0 "学者"
 tariqelatham_desc:0 "穆斯林世界的主骸骨之路的一条分叉，塔里克·阿萨姆受益于在这一地区保存下来的古老知识。不过，他们有时冷酷无情的行为会让他们与狂热的[ashirra|E]或警惕的哈基姆圣裔发生冲突。"
 followersoflazarus:0 "拉撒路信徒"
 followersoflazarus_adj:0 "拉撒路信徒"
 followersoflazarus_adherent:0 "背弃者"
 followersoflazarus_adherent_plural:0 "背弃者"
 followersoflazarus_desc:0 "拉撒路的追随者，也被称为背弃者，是因没有响应号召而导致愚蠢盛宴的卡帕多西亚，从而避免被[Clan|E]淘汰。他们不确定是否有被赦免，并感觉到被他们的始祖背叛，他们有效地脱离了卡帕多西亚[Clan|E]主体。拉撒路被非正式地认为是背弃者的首领。"
 pathofthewheel:0 "循环之道"
 pathofthewheel_adj:0 "循环之道"
 pathofthewheel_adherent:0 "科学家"
 pathofthewheel_adherent_plural:0 "科学家"
 pathofthewheel_desc:0 "此道的成员相信，吸血鬼被困在了循环之外，并该继续前进。他们在寻找任何科学方法来将所有[cainites|E]重新推回到生命的循环中。"
 roadoftheabyss:0 "深渊之路"
 roadoftheabyss_adj:0 "深渊之路"
 roadoftheabyss_adherent:0 "秘术师"
 roadoftheabyss_adherent_plural:0 "秘术师"
 roadoftheabyss_desc:0 "秘术师沉浸在对一种超越并究极相反与所有光和生命的力量的永恒研究中。对于那些研究外之黑暗的奥秘的人来说，人性和诸如对错之类的概念没什么用。"
