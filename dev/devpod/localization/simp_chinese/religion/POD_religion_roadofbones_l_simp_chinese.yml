 viaprimordia_adherent:0 "始源派"
 viaprimordia_adherent_plural:0 "始源派"
 viaprimordia_desc:0 "始源派相信“三相”，即创造、毁灭和维持的强大灵类。他们等待着一个大事件，其中三大灵将合并成一位化身。奇怪的是，这似乎和一些狼人的信仰很接近。"
