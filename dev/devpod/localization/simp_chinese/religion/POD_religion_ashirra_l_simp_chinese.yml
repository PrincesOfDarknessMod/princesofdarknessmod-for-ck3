l_simp_chinese:
 ashirra_religion: "@vampire_icon!阿什拉派"
 ashirra_religion_adj: "阿什拉派"
 ashirra_religion_adherent: "阿什拉派"
 ashirra_religion_adherent_plural: "阿什拉派"
 ashirra_religion_desc: "[Glossary('阿什拉派','game_concept_ashirra_desc')]（来自阿拉伯语的“氏族”一词）是信仰真主的伊斯兰吸血鬼教派，从黑暗时代开始就统治着阿拉伯和北非。[Glossary('阿什拉派','game_concept_ashirra_desc')]的成员相信，如果他们选择追随真主，就会得到救赎，这是穆罕默德的承诺之一。"
 ashirra_religious_head_title: "穆拉"
 tariqelumma: "塔里克·乌玛"
 tariqelumma_adj: "乌玛"
 tariqelumma_adherent: "萨迪克"
 tariqelumma_adherent_plural: "莱尔"
 tariqelumma_desc: "信奉塔里克·乌玛之道的信徒通过善行与慈悲来重申他们的本性。他们常常暗中保护并帮助凡俗邻居，并在可能时介入以匡扶正义或惩罚罪人。许多信徒通过在整个伊斯兰世界传播知识与治愈之术来平衡自身的兽性。"
 tariqelsama: "塔里克·萨玛"
 tariqelsama_adj: "萨玛之道"
 tariqelsama_adherent: "萨玛"
 tariqelsama_adherent_plural: "萨玛"
 tariqelsama_desc: "追随塔里克·萨玛之道的信徒坚守先知的启示，以夜夜祷告与不可动摇的信仰来对抗心兽的狂暴。他们不会压制心兽的躁动，而是允许其适度释放，仅在欲望即将失控时加以约束。其挑战在于保持平衡，避免过度，因为邪恶正源于放纵。"
 tariqelharb: "塔里克·哈尔卜"
 tariqelharb_adj: "哈尔卜之道"
 tariqelharb_adherent: "战士"
 tariqelharb_adherent_plural: "战士们"
 tariqelharb_desc: "阿什拉派战士的职责是保护信徒免受敌人或干扰信仰实践者的侵害，同时捍卫妇女与儿童的荣誉。在战场上，他必须如受神感召般无畏战斗，不顾自身安危。战士的生命不属于自己，而是安拉的恩赐。"
 tariqelbedouin: "塔里克·贝都因"
 tariqelbedouin_adj: "贝都因之道"
 tariqelbedouin_adherent: "部落民"
 tariqelbedouin_adherent_plural: "部落民"
 tariqelbedouin_desc: "穆斯林吸血鬼选择此道，是因他们相信宫殿与城市的奢靡会削弱个体的自律与道德勇气。与其沉溺于纷繁娱乐的夜间生活，他们追求一种更艰苦、更纯粹的存在，让心灵脱离杂念，直面荒野中的瞬息挑战。"
 sheperdsofislam: "伊斯兰牧人"
 sheperdsofislam_adj: "伊斯兰牧人"
 sheperdsofislam_adherent: "见证人"
 sheperdsofislam_adherent_plural: "见证人"
 sheperdsofislam_desc: "牧人们相信，全能的安拉以其智慧与慈悲，选择他们作为不朽的守护者，传承最后一位伟大先知（愿主福安之）的圣训。伊斯兰的延续——唯有通过那些亲历先知教诲的不死者向世人传述才能实现。"
 ashirra_religious_head_title_name: "苏丹国"
 holy_order_the_mahgrib: "马格里布"
 holy_order_the_shuhada: "舒哈达"
 holy_order_defenders_ashirra: "阿什拉捍卫者"
 holy_order_companions_of_the_prophet: "先知之伴"
 tariqelalaam: "塔里克·阿拉姆"
 tariqelalaam_adj: "阿拉姆"
 tariqelalaam_adherent: "沙希德"
 tariqelalaam_adherent_plural: "舒哈达之道"
 tariqelalaam_desc: "舒哈达是甘愿为他人牺牲的不死殉道者。他们会主动以战斗或其他方式阻止不洁之物的腐蚀，希望安拉视其如凡人殉道者般崇高。"
 tariqelatham: "塔里克·阿萨姆"
 tariqelatham_adj: "阿萨姆之道"
 tariqelatham_adherent: "学者"
 tariqelatham_adherent_plural: "学者"
 tariqelatham_desc: "此道主要由卡比拉特·马特践行，融合了骸骨之路与阿什拉信仰，形成了更温和的求知方式，如穆斯林世界的占星研究。尽管未被多数阿什拉派系完全接纳，塔里克·阿萨姆仍受宽容，其信徒可自由追求知识，只要不伤害凡人"