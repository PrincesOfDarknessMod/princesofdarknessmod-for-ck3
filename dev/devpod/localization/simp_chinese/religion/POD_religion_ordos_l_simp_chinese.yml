 ordoaenigmatis_adj: "解密会"
 ordoaenigmatis_adherent: "秘教徒"
 ordoaenigmatis_adherent_plural: "秘教徒"
 ordoaenigmatis_desc: "此学会专注于谜语和符号，解开隐藏的含义，破译神话和传说，以获得对世界、他们自己和心兽的真实认识。"
 ordosecstasis: "狂喜会"
 ordosecstasis_adj: "狂喜会"
 ordosecstasis_adherent: "秘教徒"
 ordosecstasis_adherent_plural: "秘教徒"
 ordosecstasis_desc: "此学会关注自己的恍惚和血狂，寻求与他们的心兽交流，最终通过极端的快乐和痛苦来表达它。"
 ordomaleficus: "为恶会"
 ordomaleficus_adj: "为恶会"
 ordomaleficus_adherent: "秘教徒"
 ordomaleficus_adherent_plural: "秘教徒"
 ordomaleficus_desc: "关于此学会几乎没有什么记录，除了他们是崇魔者，借助界外力量追求更大的神秘。"
 jocastian: "伊俄卡斯忒派"
 jocastian_adj: "伊俄卡斯忒派"
 jocastian_adherent: "伊俄卡斯忒派"
 jocastian_adherent_plural: "伊俄卡斯忒派"
 jocastian_desc: "一个小而不知名的教派（可能是末卡维血系），本是一个起源于魔宴的挪得学家密教，但后来独立了。虽然大多数的伊俄卡斯忒派是末卡维，也有一些布鲁赫和其他求知血族在他们的行列。他们致力于揭示$pod_cainites$的真实历史，他们是谟涅摩绪涅的对手。虽然有些学者认为他们是独立血系，因为其有惯例：导师会为了传承其知识而资源受弟子啖魂。但他们与他们的母系$pod_clan$并无本质区别。"
 mnemosyne: "谟涅摩绪涅"
 mnemosyne_adj: "谟涅摩绪涅"
 mnemosyne_adherent: "秘教徒"
 mnemosyne_adherent_plural: "秘教徒"
 mnemosyne_desc: "谟涅摩绪涅，或记忆修众，是一群由末卡维学者组成的挪得学家密教；有些人认为谟涅摩绪涅实际上是末卡维的血系。他们最杰出的成员是亚里士多德·德·洛朗。密教成员寻求关于血族历史的知识，他们中的大多数遵循该隐之道。该密教与伊俄卡斯达提安，以及直到最近，梵卓长者宾杜萨拉都有冲突。它的成员实施某种$pod_diablerie$；当一个长者认为他的时间已到时，他允许年轻的血族吸榨他，以便他的知识可以传递下去。这就是为什么该密教有时被称为血系的原因。该密教是以希腊的缪斯女神命名的。"
 holy_order_habringers: "末卡维预告者"
 holy_order_lamia: "拉米亚秘仪"
 holy_order_order_of_argaeus: "阿吉乌斯骑士团"
 holy_order_cult_of_hecate: "赫卡忒密教"
