 ordovaticinii_desc: "赞助者设定的非原作官设宗教。\n此学会沉迷于火焚末日的启示。"
 holy_order_sworn_to_cecil: "誓于塞西尔"
 daughtersofthesun: "太阳之女"
 daughtersofthesun_adj: "太阳之女"
 daughtersofthesun_adherent: "女儿"
 daughtersofthesun_adherent_plural: "女儿"
 daughtersofthesun_desc: "伊斯兰教前的末卡维神秘密教，崇拜三位$pod_cainites$“女神”。他们被麦加流放，大多被胜利的穆斯林[Glossary('阿什拉派','game_concept_ashirra_desc')]逼迫躲藏。"
 eyesofmalakai: "玛拉基之眼"
 eyesofmalakai_adj: "玛拉基之眼"
 eyesofmalakai_adherent: "眼"
 eyesofmalakai_adherent_plural: "眼"
 eyesofmalakai_desc: "表面崇拜着神话中的末卡维双胞姐妹，这个疯狂的密教组织经常不知从哪里冒出来，走过的道路只留下疯狂和毁灭。"
