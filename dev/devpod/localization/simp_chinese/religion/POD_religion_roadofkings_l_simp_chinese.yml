 pathofleviathan_adherent_plural: "躯士"
 pathofleviathan_desc: "赞助者设定的非原作官设宗教。\n\n源自古中国统一主义的利维坦之道致力于构建出一个利维坦一般的集体，通过柔性的教化和硬性的律令催生躯士的集体观念，最终创造出统一的集体意志，像单细胞生物变成多细胞生物一样实现精神层面的进化。"
