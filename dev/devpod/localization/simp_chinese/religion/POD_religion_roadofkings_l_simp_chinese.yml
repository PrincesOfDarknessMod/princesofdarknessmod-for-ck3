 cleopatrans: "伊玛的克利奥帕特拉派"
 cleopatrans_adj: "克利奥帕特拉派"
 cleopatrans_adherent: "克利奥帕特拉派"
 cleopatrans_adherent_plural: "克利奥帕特拉派"
 cleopatrans_desc: "这个密教是伊玛，神话中没有受到其$pod_clan$诅咒影响的诺斯费拉图，和埃及美丽的法老克利奥帕特拉两者故事的融合。这种迷恋让$pod_clan$变得强大，很多亲王都是克利奥帕特拉派，直到罗马帝国灭亡。从此以后，这个密教就像死了一般。"
 path_of_carnal_desire: "肉欲之道"
 path_of_carnal_desire_adj: "肉欲之道"
 path_of_carnal_desire_adherent: "施欲者"
 path_of_carnal_desire_adherent_plural: "施欲者"
 path_of_carnal_desire_desc: "赞助者设定的非原作官设宗教。\n\n也被称作欲望之道，此道不是关于屈服于快感，而是关于利用欲望作为控制工具。虽然它和纵欲之道一样色情，但它关于本性的部分更少，更多是通过性欲进行掌控。它是在岩石上唱歌的塞壬，而不是追求她们的找死水手。与原罪之路的追随者不同，欲者更符合王者之路的规范和传统，因此他们在上位氏族的宫廷上找到了庇护所。\n\n众所周知，施欲者与纵欲者有着宗教上的竞争，这种竞争在意大利各地的卧室和妓院里上演。"
 holy_order_order_of_whores: "巴比伦大淫妇骑士团"
 holy_order_order_of_dominatrices: "欢愉骑士团"
 holy_order_studs_of_desire: "色诱骑士团"
 viaofficii: "职务之道"
 viaofficii_adj: "职务之道"
 viaofficii_adherent: "誓者"
 viaofficii_adherent_plural: "誓者"
 viaofficii_desc: "赞助者设定的非原作官设宗教。\n\n也被称作职责之路，该心路由塞嫩·福斯沃恩——白色守望者——研发，以严厉强制血之缄默。其等采取极端手段来保持潜藏。"
 tenet_carnal_desire_name: "火辣肉欲"
 tenet_carnal_desire_desc: "赞助设定的非原作信条。"
 shatteredspear: "破碎长矛"
 shatteredspear_adj: "破碎长矛"
 shatteredspear_adherent: "斯巴达"
 shatteredspear_adherent_plural: "斯巴达"
 shatteredspear_desc: "这些人继承了阿尔忒弥斯·欧西雅的遗产，她是梵卓的第一位也是最受爱戴的子嗣，也是古代斯巴达的女神，她带领先锋队对抗迦太基的布鲁赫，并在与夺取那个城市的黑暗卑劣势力的斗争中失败。\n长矛秘密行动，每个战士都坚定地对抗火焚末日的浪潮和潜伏在该隐之子文明社会之外的邪恶力量。"
