 viaregalis: "征服之道"
 viaregalis_adj: "征服之道"
 viaregalis_adherent: "杰出者"
 viaregalis_adherent_plural: "杰出者"
 viaregalis_desc: "征服之道的拥护者通过统治其他人来控制心兽。凡人是下等的，承诺会被实现，权利是一切。"
 viaequitum: "骑士之道"
 viaequitum_adj: "骑士之道"
 viaequitum_adherent: "血殿骑士"
 viaequitum_adherent_plural: "血殿骑士"
 viaequitum_desc: "那些遵循骑士之道的家伙相信，作为更高等的生物，他们有义务保护那些低等于他们的人，包括$pod_cainite$和人类。这些后裔最强烈地相信责任和荣誉的概念。"
 viamercator: "商贾之道"
 viamercator_adj: "商贾之道"
 viamercator_adherent: "商贾"
 viamercator_adherent_plural: "商贾"
 viamercator_desc: "对这些追随商贾之道的贵胄来说，权力和金钱是密不可分的;因此，他们花了大量的时间来获取财富，并在幕后潜移默化地影响事物。然而，他们也很珍惜自己的声誉，并会不遗余力地确保它是正面的。"
 viatyrannus: "暴政之道"
 viatyrannus_adj: "暴政之道"
 viatyrannus_adherent: "暴君"
 viatyrannus_adherent_plural: "暴君"
 viatyrannus_desc: "尽管都有着凶猛、控制欲强和权力欲强的名声，但“暴政之道”的后裔也属于受尊敬的征服之道。如果其中一位对你有从属关系，不管代价如何，它都会被保留。然而，他们最倾向于通过恐惧而不是上诉来进行统治。"
 viaconsuasor: "辅臣之道"
 viaconsuasor_adj: "辅臣之道"
 viaconsuasor_adherent: "维齐尔"
 viaconsuasor_adherent_plural: "维齐尔"
 viaconsuasor_desc: "维齐尔之道的后裔们满足于建议而不是直接统治，但这并不会使他们在行使权力方面比王者之路上的其他人逊色。事实上，这些后裔是最善于巧妙操纵的人之一，他们会注意到可能威胁到掌权者影响力的细节。"
 viamithras: "密特拉之道"
 viamithras_adj: "密特拉之道"
 viamithras_adherent: "密特拉教徒"
 viamithras_adherent_plural: "密特拉教徒们"
 viamithras_desc: "密特拉教徒跨立于征服之道和一个实际的密教之间。虽然权力和荣誉仍然被高度重视，但对于密特拉，一个真正的神，奉献是最重要的。他们仍然忠于一个可以追溯到古罗马密教辉煌时期的组织。"
 viaentelechia: "完全实现之道"
 viaentelechia_adj: "完全实现之道"
 viaentelechia_adherent: "奉行者"
 viaentelechia_adherent_plural: "奉行者"
 viaentelechia_desc: "奉行者由完全实现（隐得来希）的三个基础定义：勇气，既男子气概；自律，既内在力量；以及明智，既内在掌控。人类的限制，如怜悯或同情（或关怀），都在其之下。当一位奉行者遇到一群他的同族人时，他就会成为他们的领袖，并指出他的对立面的明显的劣势，他不会害怕杀死那些不服从他们命令的吸血鬼。"
 codexoflegacies: "传承法典"
 codexoflegacies_adj: "传承法典"
 codexoflegacies_adherent: "幻梦者"
 codexoflegacies_adherent_plural: "幻梦者"
 codexoflegacies_desc: "君士坦丁堡的$pod_cainites$不遵守该隐的六条戒律。相反，布鲁赫的特里波尼厄斯创造了传承法典，这是一套戒律的集合，旨在巩固三位一体和三大掌权氏族（妥芮朵、棘秘魑、梵卓）的统治。由三大检察官组成的议员——三大氏族各一名——负责监督法典，并对违反法典原则的人进行审判。"
