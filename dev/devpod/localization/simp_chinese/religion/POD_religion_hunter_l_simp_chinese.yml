l_simp_chinese:
 hunters_religion: "@supehunter_icon!猎巫人"
 hunters_religion_adj: "猎巫人"
 hunters_religion_adherent: "猎巫人"
 hunters_religion_adherent_plural: "猎巫人"
 hunters_religion_desc: "人类还没有放弃他们的世界。这些勇敢的英雄与声称会奴役他们的可憎之物战斗。"
 shadowinquisition: "暗影裁判所"
 shadowinquisition_adj: "裁判所"
 shadowinquisition_adherent: "裁判官"
 shadowinquisition_adherent_plural: "裁判官"
 shadowinquisition_desc: "暗影裁判所是天主教廷在黑暗中世纪时期策划的一场秘密运动。与教宗的以异教徒为目标的宗教裁判所不同，暗影裁判所的目标是吸血鬼、狼人、法师和其他“撒旦的仆从”，目的是毁灭或拯救他们。它的存在是短暂的，但它的成功将永远改变$pod_cainite$世界。"
 independenthunters: "独立猎人"
 independenthunters_adj: "独立猎人"
 independenthunters_adherent: "猎人"
 independenthunters_adherent_plural: "猎人"
 independenthunters_desc: "这些猎人独立于教会行政团体，以他们自己的方式与黑暗世界里的超自然恐怖进行着另类的战争。虽然他们缺少大机构里的资源，但他们也不用受到繁杂的种族或官僚规矩的制约。这些猎人中的大多数都靠他们自己发现超自然威胁，但也有一部分是厌烦了暗影裁判所的规矩，而不再听命于高层，如今按自己的方式行事。"
 shadowinquisition_religious_head_title: "大裁判官"
 shadowinquisition_religious_head_title_name: "大裁判官职务"
 shih_faith: "士之信念"
 shih_faith_adj: "士之信念"
 shih_faith_adherent: "士"
 shih_faith_adherent_plural: "士"
 shih_faith_desc: "几个世纪以来，[GetTrait('shih').GetName( GetPlayer )]变得多种多样并在中央王国各地散布开来，他们改变了自己的哲学以使其契合他们所居住的地区。\n但这些宗教信仰并不是他们信仰的根本。所有[GetTrait('shih').GetName( GetPlayer )]都明白，他们在个人层面上的一些实践与他们作为狩魔人所遵循的真理几乎没什么关系。"
 shih_faith_religious_head_title: "天师"
 shih_faith_religious_head_title_name: "天师殿"
 demon_hunters_religion: "@supehunter_icon!狩魔人"
 demon_hunters_religion_adj: "狩魔人"
 demon_hunters_religion_adherent: "狩魔人"
 demon_hunters_religion_adherent_plural: "狩魔人"
 demon_hunters_religion_desc: "似乎没有什么可以制约东方的夜行者。他们不受潜藏的影响，也不尊重迷障。他们的过线行为在很大程度上被认为是报应或气运。然而，一群人站了出来遏制这些不守规矩的鬼神，成为他们的劫难。"
 ikhwan_al_safa: "精诚兄弟社"
 ikhwan_al_safa_adj: "精诚兄弟社"
 ikhwan_al_safa_adherent: "古兰赛义德"
 ikhwan_al_safa_adherent_plural: "古兰赛义德"
 ikhwan_al_safa_desc: "创建于12世纪的精诚兄弟社保持着对信徒的警卫，并与黑夜中的不死族恐怖作斗争。与裁判所不同的是，古兰赛义德非常小心地避开公众，并尽量减少他们的猎杀对无辜者的伤害。"
 akritai_adj: "边防军"
 akritai_adherent: "猎人"
 akritai_adherent_plural: "猎人"
 akritai_desc: "边防军是多个团体的集合，主要由东正教的猎巫人组成。它被认为既是裁判所的强大盟友，又是其竞争对手。"
 judge: "民长"
 judge_adj: "民长"
 judge_adherent: "猎人"
 judge_adherent_plural: "猎人"
 judge_desc: "他们的名字和传统来自《圣经》中的《民长记》，他们与他们认为的莉莉丝的子嗣作斗争。他们以《妥拉》和特殊版本的《塔木德》为资源，与非自然作斗争。由于大多数国家的犹太人比例较低，民长以小团体的形式活动，没有中央协调。"
 strike_force_zero: "第零机动队"
 strike_force_zero_adj: "第零机动队"
 strike_force_zero_adherent: "特工"
 strike_force_zero_adherent_plural: "特工"
 strike_force_zero_desc: "第零机动队（也被称为SF0）是日本政府的精英部队、最高机密的猎魔机构。与师不同，第零机动队不相信鬼神在自然秩序中有任何地位：它们是一种威胁，必须在它们有机会毁灭人类之前被消灭。"
 sanbenito: "圣宾尼陀"
 sanbenito_adj: "圣宾尼陀"
 sanbenito_adherent: "猎人"
 sanbenito_adherent_plural: "猎人"
 sanbenito_desc: "圣宾尼陀曾是裁判官，他们已经成为拉斐尔·伦齐的信徒，他是“佛罗伦萨异端”的创始人。他们认为利奥波德协会在狂热中犯了错误，他们的使命应该是怜悯，而不是仇恨。因此，佛罗伦萨异端试图帮助超自然存在保留他们的人性，而不是试图摧毁他们。"
 qorjin_baghatur: "科尔沁把阿秃儿"
 qorjin_baghatur_adj: "科尔沁把阿秃儿"
 qorjin_baghatur_adherent: "把阿秃儿"
 qorjin_baghatur_adherent_plural: "把阿秃儿"
 qorjin_baghatur_desc: "在萨马拉弯的灾难性战役中，科尔沁是唯一没有在袭击部落的化形怪兽面前逃跑的蒙古将军。\n回到喀喇昆仑后，他被成吉思汗召见，成吉思汗给他留下了新的神圣职责。在这些年里，他研究了人所不见的世界，学会了利用敌人的恐惧和迷信来获得最大的优势，并将神话中的生物逼至蒙古帝国的边缘。"
 warriors_dazbog: "达兹博格战士"
 warriors_dazbog_adj: "达兹博格战士"
 warriors_dazbog_adherent: "斗士"
 warriors_dazbog_adherent_plural: "斗士"
 warriors_dazbog_desc: "在远古时代，当该隐还在挪得之地上独自游荡时，一条咆哮着的黑暗巨蛇从天而降。太阳灼烧着它的血肉，这条可憎的怪物钻进了地底，但它并没有轻易逃脱。太阳将一缕神光赐予了锻造之神和天火之神史瓦罗格。史瓦罗格随后创造了达兹博格：太阳战神，一切邪恶的敌人。\n他与邪恶之战的传承至今仍在延续，激励着年轻的斯拉夫战士保护自己的家园，抵御黑夜的侵袭。"
 corrupted_hunters_faith: "堕落猎人"
 corrupted_hunters_faith_adj: "堕落猎人"
 corrupted_hunters_faith_adherent: "堕落猎人"
 corrupted_hunters_faith_adherent_plural: "堕落猎人"
 corrupted_hunters_faith_desc: "赞助者设定的非原作官设宗教。\n尽管[GetTrait('shih').GetName( GetPlayer )]在其所居住的地区适应了当地环境，但其中一些已经走得太远。虽然这些[GetTrait('shih').GetName( GetPlayer )]仍然以某种方式进行狩猎，但他们追求更多的是世俗的享乐——甚至是扭曲的多人淫乱。\n\n在他们眼中，[GetTrait('mortal').GetName( GetPlayer )]、[GetTrait('ghoul').GetName( GetPlayer )]、[GetTrait('werewolf').GetName( GetPlayer )]、甚至[GetTrait('vampire').GetName( GetPlayer )]或[GetTrait('kueijin').GetName( GetPlayer )]，不过是发泄欲望的对象。由于知识的匮乏与生存的艰难，新一代的伦理已被扭曲，[GetTrait('shih').GetName( GetPlayer )]的礼仪与正义也因此被腐化。"
 corrupted_hunters_faith_religious_head_title: "堕落大师"
 corrupted_hunters_faith_religious_head_title_name: "堕落大社"