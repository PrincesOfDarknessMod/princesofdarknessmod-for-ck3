 kueijin_knowledge_god_name: "$kueijin_high_god_name$"
 kueijin_knowledge_god_name_possessive: "$kueijin_high_god_name_possessive$"
 kueijin_war_god_name: "$kueijin_night_god_name$"
 kueijin_war_god_name_possessive: "$kueijin_night_god_name_possessive$"
 kueijin_trickster_god_name: "气运"
 kueijin_trickster_god_name_possessive: "气运"
 kueijin_night_god_name: "玄龙"
 kueijin_night_god_name_possessive: "玄龙"
 kueijin_water_god_name: "$kueijin_night_god_name$"
 kueijin_water_god_name_possessive: "$kueijin_night_god_name_possessive$"
 faceofthegods: "天族"
 faceofthegods_adj: "众佛相"
 faceofthegods_adherent: "佛徒"
 faceofthegods_adherent_plural: "佛徒"
 faceofthegods_desc: "天族可能是最极端的异端邪说，他们声称[Glossary('万鬼','game_concept_kuei_jin_desc')]是被流放的神灵，是印度神话中受冤的悉多的后裔。他们建立自己的邪教并拥有信徒，通过祈祷提取气。"
 flameoftherisingphoenix: "涅凤焱"
 flameoftherisingphoenix_adj: "涅凤焱"
 flameoftherisingphoenix_adherent: "凤凰"
 flameoftherisingphoenix_adherent_plural: "凤凰"
 flameoftherisingphoenix_desc: "涅凤焱涅凤焱[Glossary('心法','podgloss.dharma')]认为，转生的目的是为了弥补一生的罪过。他们通常生活在凡人家人中，尽可能地保护和帮助他们兴旺。认为，转生的目的是为了弥补一生的罪过。他们通常生活在凡人家人中，尽可能地保护和帮助他们兴旺。"
 inwardway: "内引众"
 inwardway_adj: "内引众"
 inwardway_adherent: "修者"
 inwardway_adherent_plural: "修众"
 inwardway_desc: "这个教派被主要皇庭视为异端，内引众相信世界是幻觉，并使用道家哲学原理来扩展他们对“真实”现实的理解。"
 wayofthetenthousandscreams: "万嚎道"
 wayofthetenthousandscreams_adj: "万嚎道"
 wayofthetenthousandscreams_adherent: "嚎徒"
 wayofthetenthousandscreams_adherent_plural: "嚎徒"
 wayofthetenthousandscreams_desc: "与五大正道相对立的[Glossary('心法','podgloss.dharma')]。它的追随者鼓吹与诸[Glossary('阎魔王','podgloss.yamaking')]的联合，并视他们的新情形为一种担任毁灭者来辅助玉皇大帝的方式。"
 holy_order_fallen_heroes: "堕仙"
 holy_order_jinhai_remembrance: "金童还仇军"
 holy_order_cursed_golden_children: "受诅金嗣军"
 holy_order_followers_of_arhat: "[Glossary('罗汉','podgloss.arhat')]武僧"
 holy_order_second_breath: "转生者"
 holy_order_masters_high_war: "全战天兵"
 kueijin_bishop_male: "僧侣"
 kueijin_bishop_male_plural: "僧侣"
 kueijin_religious_head_title_name: "僧侣"
 kueijin_death_deity_name_possessive: "[Glossary('阎魔王','podgloss.yamaking')]"
 boneflowers_religion: "@kueijin_icon!幽影颂"
 boneflowers_religion_adj: "幽影颂"
 boneflowers_religion_adherent: "颂伶"
 boneflowers_religion_adherent_plural: "颂伶"
 boneflowers_religion_desc: "崇阴的幽影颂，也被称为骨花，是冷酷的逻辑性的亡灵术师，他们寻求冷静的理性和强制的心法平衡。他们也通过他们的后代与凡人社会紧密联系在一起，甚至在几个世纪之后，他们也常常帮助他们的家人。"
 deviltigers_religion: "@kueijin_icon!魔虎啸"
 deviltigers_religion_adj: "魔虎"
 deviltigers_religion_adherent: "天罚之魔"
 deviltigers_religion_adherent_plural: "天罚群魔"
 deviltigers_religion_desc: "魔虎啸相信他们是过去无能邪魔的替代者；他们惩罚罪人，通过痛苦和暴力寻求启迪。"
 resplendentcranes_religion: "@kueijin_icon!华鹤道"
 resplendentcranes_religion_adj: "华鹤道"
 resplendentcranes_religion_adherent: "推事"
 resplendentcranes_religion_adherent_plural: "推事"
 resplendentcranes_religion_desc: "华鹤道是一个高度墨守成规的法家学派集合，致力于逆转[Glossary('纪元之轮','podgloss.wheelofages')]，恢复美德。"
 thousandwhispers_religion: "@kueijin_icon!千呤道"
 thousandwhispers_religion_adj: "千呤道"
 thousandwhispers_religion_adherent: "呤者"
 thousandwhispers_religion_adherent_plural: "呤者"
 thousandwhispers_religion_desc: "呤者们生活在一系列的面具中，他们在死后建立新的身份，以便理解凡人的生活并希望超越它。"
 thrashingdragons_religion: "@kueijin_icon!腾龙舞"
 thrashingdragons_religion_adj: "腾龙舞"
 thrashingdragons_religion_adherent: "舞优"
 thrashingdragons_religion_adherent_plural: "舞优"
 thrashingdragons_religion_desc: "经常被误解的腾龙舞[Glossary('心法','podgloss.dharma')]自认是死者，但寻求通过模仿和与生者互动来达到大彻大悟。尽管有一些华鹤道的深刻质疑，但它们是完全公认的[Glossary('心法','podgloss.dharma')]，即使他们在亡生以自己的方式进食和发生关系。"
 empty_hands: "白手"
 empty_hands_adj: "白手"
 empty_hands_adherent: "$boneflowers_religion_adherent$"
 empty_hands_adherent_plural: "$boneflowers_religion_adherent_plural$"
 empty_hands_desc: "白手认为必须保持自身纯净，但无权干涉他人求知之路，即使面对[akuma|E]时亦然。"
 fishhooks: "钓钩"
 fishhooks_adj: "钓钩"
 fishhooks_adherent: "$boneflowers_religion_adherent$"
 fishhooks_adherent_plural: "$boneflowers_religion_adherent_plural$"
 fishhooks_desc: "钓钩们研究、审讯、欺骗和折磨[akuma|E]。他们试图通过该过程了解[Glossary('阎魔王','podgloss.yamaking')]和诅咒，而不拿自己的灵魂冒险。为了从[akuma|E]那里获得信息，他们会做任何事或说任何话。"
 august_body_of_sagacious_devils: "尊贵贤魔团"
 august_body_of_sagacious_devils_adj: "通明尊者"
 august_body_of_sagacious_devils_adherent: "玉祸"
 august_body_of_sagacious_devils_adherent_plural: "玉魔"
 august_body_of_sagacious_devils_desc: "通过极具竞争性的阶级制度，贤魔团将心魔的愤怒能量转化为生产资料，为[GetTrait('kueijin').GetName( GetNullCharacter )]谋取更大利益。"
 thousand_embers_righteousness_societies: "千烬结社"
 thousand_embers_righteousness_societies_adj: "正气"
 thousand_embers_righteousness_societies_adherent: "$deviltigers_religion_adherent$"
 thousand_embers_righteousness_societies_adherent_plural: "$deviltigers_religion_adherent_plural$"
 thousand_embers_righteousness_societies_desc: "作为魔虎啸的社会核心，这些小型团体共同修行、训练与启迪。但从长远来看，每个团体的终极使命都是作为干扰[Glossary('魔皇','podgloss.demonemperor')]的游击单位，通过点燃凡俗社会的动乱来阻止[Glossary('阎魔王','podgloss.yamaking')]壮大。"
 eight_lotus_blooming: "八莲开"
 eight_lotus_blooming_adj: "八莲开"
 eight_lotus_blooming_adherent: "$resplendentcranes_religion_adherent$"
 eight_lotus_blooming_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 eight_lotus_blooming_desc: "这支华鹤道更注重通过内省追寻法度，特别强调冥想与精神求索。"
 empty_throne: "空御座"
 empty_throne_adj: "空御座"
 empty_throne_adherent: "$resplendentcranes_religion_adherent$"
 empty_throne_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 empty_throne_desc: "这个温和派系崇尚正义之举胜过刻板教条，坚信即使最邪恶之徒也能在美德感召下弃暗投明。"
 two_li_road: "双理道"
 two_li_road_adj: "双理道"
 two_li_road_adherent: "$resplendentcranes_religion_adherent$"
 two_li_road_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 two_li_road_desc: "该派系认为现代文明是邪恶根源，主张回归简朴传统的生活方式。"
 yellow_moon: "黄月"
 yellow_moon_adj: "黄月"
 yellow_moon_adherent: "$resplendentcranes_religion_adherent$"
 yellow_moon_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 yellow_moon_desc: "由三位信奉凡俗哲学可启人智慧的士大夫创立，虽曾失势但仍被勉强承认为合法派系。"
 fellowship_of_the_travelers_of_the_great_earth: "大地旅者团伙"
 fellowship_of_the_travelers_of_the_great_earth_adj: "大地旅者团伙"
 fellowship_of_the_travelers_of_the_great_earth_adherent: "$resplendentcranes_religion_adherent$"
 fellowship_of_the_travelers_of_the_great_earth_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 fellowship_of_the_travelers_of_the_great_earth_desc: "非法教派，致力于拥立新帝一统中原，为此频繁干涉凡俗事务，远超主流教义允许范围。"
 liberators_of_the_wheel: "轮回解放者"
 liberators_of_the_wheel_adj: "轮回解放者"
 liberators_of_the_wheel_adherent: "$resplendentcranes_religion_adherent$"
 liberators_of_the_wheel_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 liberators_of_the_wheel_desc: "非法教派，相信[Glossary('纪元之轮','podgloss.wheelofages')]转动是因中原彼方诸国罪孽深重无可救赎，遂以恐怖袭击破坏境外稳定。"
 wise_centipedes: "智百足"
 wise_centipedes_adj: "智百足"
 wise_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 wise_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 wise_centipedes_desc: "中庸平衡的吟者简单地称呼自己为智百足，他们关注的是在一个地方或一个人身上实现了平衡后的维护。"
 bunraku: "文乐偶"
 bunraku_adj: "文乐偶"
 bunraku_adherent: "$thousandwhispers_religion_adherent$"
 bunraku_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 bunraku_desc: "倾于北，文乐偶在暗处运作，在中原执行平衡。"
 dancing_peacocks: "起舞雉"
 dancing_peacocks_adj: "起舞雉"
 dancing_peacocks_adherent: "$thousandwhispers_religion_adherent$"
 dancing_peacocks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 dancing_peacocks_desc: "倾于东，孔雀们生活在凡人之中，是最多参与凡人事务的。"
 scarlet_centipedes: "赤蜈蚣"
 scarlet_centipedes_adj: "赤蜈蚣"
 scarlet_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 scarlet_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 scarlet_centipedes_desc: "倾于南，赤蜈蚣是试图颠覆现状的麻烦制造者和勇士。"
 exalted_jade_masks: "玉假面"
 exalted_jade_masks_adj: "玉假面"
 exalted_jade_masks_adherent: "$thousandwhispers_religion_adherent$"
 exalted_jade_masks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 exalted_jade_masks_desc: "倾于西，玉假面猎杀鬼魂，试图通过允许他们过世或在他们拒绝时杀死他们来纠正他们的不平衡。"
 laughing_rainbows: "笑彩虹"
 laughing_rainbows_adherent: "$thrashingdragons_religion_adherent$"
 laughing_rainbows_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 laughing_rainbows_desc: "腾龙舞的温和分支，主张在新奇体验与往昔沉思间寻求平衡，是该[Glossary('心法','podgloss.dharma')]的正统观点。"
 the_thousand_faced_thunders: "千面雷"
 the_thousand_faced_thunders_adj: "千面雷"
 the_thousand_faced_thunders_adherent: "$thrashingdragons_religion_adherent$"
 the_thousand_faced_thunders_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_thousand_faced_thunders_desc: "致力于[Glossary('阳界','game_concept_yang_world_desc')]的派系，尤其擅长应对栖居诸灵。他们密切关注凡俗创新，预判新灵诞生。"
 the_ten_seasons_sect: "十季宗"
 the_ten_seasons_sect_adj: "十季宗"
 the_ten_seasons_sect_adherent: "$thrashingdragons_religion_adherent$"
 the_ten_seasons_sect_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_ten_seasons_sect_desc: "这是一个崇尚自然轮回、专注精心培育“花园”的教派，无论这些“花园”是真实的园圃，还是家族、组织，乃至国家。"
 the_passion_bloodflowers: "炽血花"
 the_passion_bloodflowers_adj: "炽血花"
 the_passion_bloodflowers_adherent: "$thrashingdragons_religion_adherent$"
 the_passion_bloodflowers_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_passion_bloodflowers_desc: "血花在享受生活方面采取了比笑彩虹更极端的立场，有时甚至接近于兽性。"
 laughing_rainbows_adj: "笑彩虹"
 kueijin_divine_realm: "天国"
 kueijin_witchgodname_the_horned_god_possessive: "[Glossary('魔皇','podgloss.demonemperor')]"
 searing_wind: "灼风"
 searing_wind_adj: "灼焚"
 searing_wind_adherent: "地狱步卒"
 searing_wind_adherent_plural: "地狱步卒团"
 searing_wind_desc: "追随[Glossary('大阿罗汉','podgloss.arhat')]韩理的魔虎啸拒绝法庭体制，全力备战对抗[Glossary('魔皇','podgloss.demonemperor')]的终局之战，必要时不惜焚世求胜。"
 societies_brigands_devils: "倾朝会"
 societies_brigands_devils_adj: "倾覆"
 societies_brigands_devils_adherent: "魔寇"
 societies_brigands_devils_adherent_plural: "魔寇众"
 societies_brigands_devils_desc: "倾朝会实为长者操纵底层弟子的暴力工具，其大规模现身必预示乱世将至。"
 black_iron_talons: "黑铁之爪"
 black_iron_talons_adj: "铁"
 black_iron_talons_adherent: "爪"
 black_iron_talons_adherent_plural: "爪群"
 black_iron_talons_desc: "黑铁之爪是魔虎啸的准军事组织，实行军队式管理。他们更是顶尖的侦查者，确保每次出击必诛确凿之恶。"
 brillant_coals: "炽烬派"
 brillant_coals_adj: "赤血"
 brillant_coals_adherent: "赤血虎"
 brillant_coals_adherent_plural: "赤血虎群"
 brillant_coals_desc: "炽烬派是魔虎传统心法在朱雀皇朝的变体，因此更倾向母系传承与肉体冲动而非纯粹暴力。"
 electric_money: "赤虎商盟"
 electric_money_adj: "赤血"
 electric_money_adherent: "赤血虎"
 electric_money_adherent_plural: "赤血虎群"
 electric_money_desc: "魔虎啸的投资银行，专司在经济战场对抗[Glossary('阎魔王','podgloss.yamaking')]。他们不惜摧毁整个经济体也要让幽冥恶魔损失重要资产。"
 righteous_smiting_fist: "天诛拳"
 righteous_smiting_fist_adj: "拳"
 righteous_smiting_fist_adherent: "解放者"
 righteous_smiting_fist_adherent_plural: "解放者"
 righteous_smiting_fist_desc: "此结社拒绝朝廷与死灵共处之策，誓要推翻玉之冥府及其腐化统治者，解放囚禁其中的万千亡魂。"
 sinner_punishing_society: "惩罪会"
 sinner_punishing_society_adj: "惩戒"
 sinner_punishing_society_adherent: "惩戒者"
 sinner_punishing_society_adherent_plural: "惩戒团"
 sinner_punishing_society_desc: "显赫惩罪会手段极端到令其他魔虎啸都却步。其公开虐杀行为反成整个魔虎大业的负累。"
 shan_bo_heresy: "善波异端"
 shan_bo_heresy_adj: "善波"
 shan_bo_heresy_adherent: "飞升者"
 shan_bo_heresy_adherent_plural: "飞升者"
 shan_bo_heresy_desc: "魔虎哲人山伯提出激进观点：[Glossary('玉帝','podgloss.augustpersonageofjade')]放逐$pod_kueijin$或属谬判，因羞愧而避世。虽屡遭朝廷谴责，其小型但忠诚的追随团体存续至今。"
 shining_ice_guardians: "耀冰卫"
 shining_ice_guardians_adj: "耀光"
 shining_ice_guardians_adherent: "$resplendentcranes_religion_adherent$"
 shining_ice_guardians_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 shining_ice_guardians_desc: "作为华鹤道[Glossary('心法','podgloss.dharma')]主流，护法众以严守八莲正道为荣。"
 inwardfocus: "内观之道"
 inwardfocus_adj: "狂涛派"
 inwardfocus_adherent: "卡巴列鲁"
 inwardfocus_adherent_plural: "卡巴列鲁"
 inwardfocus_desc: "内观狂涛是被主流宫廷视为异端的教派，他们认定世界是幻象，主张通过极端暴力与恐怖手段将其粉碎。"
 spiritlivingearth: "活壤宗"
 spiritlivingearth_adj: "绀青派"
 spiritlivingearth_adherent: "神主"
 spiritlivingearth_adherent_plural: "神主"
 spiritlivingearth_desc: "借鉴了多种神道教和泛灵论传统，这一[Glossary('心法','podgloss.dharma')]注重内省，主要关注与灵界的互动。由于他们将恶魔和恶灵视为合适的导师，这一做法被主流朝廷视为异端。"
 faceofthegoddess: "佛母相"
 faceofthegoddess_adj: "众佛相"
 faceofthegoddess_adherent: "性力派"
 faceofthegoddess_adherent_plural: "性力派瑜伽士"
 faceofthegoddess_desc: "此[Glossary('心法','podgloss.dharma')]乃是天族的一个变体，自述其源为凡人，后蒙女神夏克提拣选，得以转生为一种介于昔日旧凡躯与未来真法性之间的过渡形态。"
 thegreatclans: "宗家大族"
 thegreatclans_adj: "宗家"
 thegreatclans_adherent: "族裔"
 thegreatclans_adherent_plural: "族裔"
 thegreatclans_desc: "宗家大族是日本列岛上的本土制度，本质上是一种延续血脉的家族网络，族中的饿殍们守护着子孙后代的利益与命运。在某些宗家的附庸家系中，凡人后裔甚至能知晓祖先的布局，亦深度参与其计划。\n最古老的宗家大族可追溯至绳文时代，但它们最深远的蜕变则是在公元六世纪，印度与中华[Glossary('心法','podgloss.dharma')]传入之后才悄然发生的。"
 kinofizanami: "伊邪那美亲族"
 kinofizanami_adj: "亲族"
 kinofizanami_adherent: "亲族"
 kinofizanami_adherent_plural: "亲族"
 kinofizanami_desc: "这些亲族自认是司掌死与污秽的太初尊神——伊邪那美命的破碎化身。他们同样深信，在界域之间仍散落着其他与他们一样的碎片：或为凡人，或为野灵，或为异类——其皆是伊邪那美的遗痕，只待以酷刑、献祭与秽气唤醒其沉眠的本源。\n\n也正因如此，伊邪那美亲族极善匿形于那些迷障同族中；一旦显露，他们便会遭到无情追猎。"
 return_to_power: "荣归仙位"
 return_to_power_adj: "归位"
 return_to_power_adherent: "$thrashingdragons_religion_adherent$"
 return_to_power_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 return_to_power_desc: "此道统由“腾龙”康初律所创，主张万鬼应再度夺取凡界之权，如昔日堕落前那般以仁神之姿统御人间。唯有如此，他们方能获得[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]的宽宥。"
 thousandhells_religion: "@kueijin_icon!无量地狱"
 thousandhells_religion_adj: "无量地狱"
 thousandhells_religion_adherent: "恶鬼"
 thousandhells_religion_adherent_plural: "恶鬼"
 thousandhells_religion_desc: "与五大正道相对立的[Glossary('心法','podgloss.dharma')]。它的追随者鼓吹与诸[Glossary('阎魔王','podgloss.yamaking')]的联合，并视他们的新情形为一种担任毁灭者来辅助玉皇大帝的方式。"
 thousandhells_emma_o: "艾玛·欧"
 thousandhells_emma_o_adj: "艾玛·欧"
 thousandhells_emma_o_adherent: "泉津"
 thousandhells_emma_o_adherent_plural: "泉津"
 thousandhells_emma_o_desc: "艾玛·欧，[Glossary('断绝','podgloss.kakuri')]的黑暗主宰，乃当今[Glossary('阎魔王','podgloss.yamaking')]之间争夺[Glossary('魔皇','podgloss.demonemperor')]之位的最有力竞逐者。\n作为阴之相的化身，阎魔王精于算计，冷酷无情。他常显形为一位身形高大、长须披面、体毛浓密的男子，皮肤如黑曜石般，身披绘有战争、瘟疫与死亡纹饰的阿伊努织袍。他身边常伴随着美丽的[Glossary('泉津','podgloss.shikome')]仆从。\n\n阎魔王是当前唯一一位成功击败并吞噬了同僚的[Glossary('阎魔王','podgloss.yamaking')]，其兼并了曾经的平衡判官阎罗的疆域与力量。"
 thousandhells_mikaboshi: "瓮星"
 thousandhells_mikaboshi_adj: "瓮星"
 thousandhells_mikaboshi_adherent: "妖邪执行官"
 thousandhells_mikaboshi_adherent_plural: "妖邪执行官"
 thousandhells_mikaboshi_desc: "天津瓮星，[Glossary('妖邪之城','podgloss.wickedcity')]的领主，是一位曾为日本学者与建筑师的[Glossary('阎魔王','podgloss.yamaking')]。虽在同类中资历尚浅，但他执着于无情革新，妄图缔造一个将人类化为无魂空壳的“机械国度”。随着凡世文明日益扩张，他也如新星般崛起。"
 thousandhells_ravana: "罗波那"
 thousandhells_ravana_adj: "罗波那"
 thousandhells_ravana_adherent: "罗波那曾"
 thousandhells_ravana_adherent_plural: "罗波那曾"
 thousandhells_ravana_desc: "罗波那曾是所有[Glossary('阎魔王','podgloss.yamaking')]中最傲慢自私的一位。他深信在力量、智慧与残忍上无人能出其右。这份傲慢令他极度危险，却也使他行事可测，最终招致败亡。\n如今蛰伏于楞伽城的废墟中，这位恶魔之王的[Glossary('魔皇','podgloss.demonemperor')]契机似乎已然消逝。"
 thousandhells_rangda: "让达"
 thousandhells_rangda_adj: "让达"
 thousandhells_rangda_adherent: "瘟疫使者"
 thousandhells_rangda_adherent_plural: "瘟疫使者"
 thousandhells_rangda_desc: "让达是[Glossary('阎魔王','podgloss.yamaking')]中最不傲慢的一位。她既不骄矜，也不贪婪，认为疾病与缓慢的死亡应当平等地降临于众生——无论贫富，无论城乡。\n为此，她成为了阎魔中最崇尚平等的一员。她唯一的愿望，便是让所有生灵都臣服于她的统治，并在承受尽可能多的痛苦后死去。"
 thousandhells_tou_mu: "斗姆"
 thousandhells_tou_mu_adj: "斗姆"
 thousandhells_tou_mu_adherent: "蜘蛛"
 thousandhells_tou_mu_adherent_plural: "蜘蛛"
 thousandhells_tou_mu_desc: "$pod_kueijin$在[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]中有一个比其他任何敌人都更可怕的强大对手，她的名字是斗姆。\n斗姆是最恶毒的[Glossary(''阎魔','podgloss.yamaking')]之一，正是这种恶毒让她如此接近[Glossary('魔皇','podgloss.demonemperor')]的王座。这位铁血女皇是迄今为止最广为人知的阎魔女王，以其对东方血族的刻骨仇恨而闻名。\n其他[Glossary('阎魔王','podgloss.yamaking')]可能会试图腐蚀和诱捕他们，而为钢铁女皇效力充其量只是缓刑。"
 thousandhells_dokhor_khan: "多科尔汗"
 thousandhells_dokhor_khan_adj: "多科尔汗"
 thousandhells_dokhor_khan_adherent: "受眷者"
 thousandhells_dokhor_khan_adherent_plural: "受眷者"
 thousandhells_dokhor_khan_desc: "多科尔汗是[Glossary('刺链地狱','podgloss.hellspikedchains')]的[Glossary('阎魔王','podgloss.yamaking')]。\n截至1230年，他是当时最强大的[Glossary('阎魔王','podgloss.yamaking')]之一，对草原的掌控几乎无人能敌。他以痛苦与仇恨为食，并因其大胆，有时甚至以鲁莽的计谋而闻名，这些计谋旨在压制他的对手。"
 thousandhells_wu_hua: "乌邝"
 thousandhells_wu_hua_adj: "乌邝"
 thousandhells_wu_hua_adherent: "囚犯"
 thousandhells_wu_hua_adherent_plural: "俘虏"
 thousandhells_wu_hua_desc: "乌邝，盐铁深渊之主，是一位[Glossary('阎魔王','podgloss.yamaking')]实力不如某些对手，但其邪恶程度却毫不逊色。\n他将囚犯压榨至骨枯髓干，只提供铁青楼作为可能的逃脱途径——许多选择此路者最终都追悔莫及。\n乌邝的组织结构模仿了先秦的官僚制度。顺从的仆从会得到赏赐和晋升。违逆的下属则会受到惩罚，直至最终被毁灭。任何在这扭曲等级中爬上来的生物，无疑都是狡黠奸邪之物，需谨慎对待。"
 thousandhells_the_wandering_overlord: "漫游霸主"
 thousandhells_the_wandering_overlord_adj: "漫游者"
 thousandhells_the_wandering_overlord_adherent: "漫游者"
 thousandhells_the_wandering_overlord_adherent_plural: "漫游者"
 thousandhells_the_wandering_overlord_desc: "在幽冥的诸多谜团中，游荡[Glossary('阎魔王','podgloss.yamaking')]即便在其同类眼中也是最为神秘莫测的存在之一。他无疆无域，无仆无侍，在幽冥与中原两地皆如归故里。\n游荡阎魔的目的无人知晓。时而他会毫无缘由地援助危难之人；时而又会操纵事态致使生灵涂炭。他对自己的行径从不解释，而其他阎魔，或许是惧于他的回应，也从不追问。"
 thousandhells_haha_no_fukami: "深見之母"
 thousandhells_haha_no_fukami_adj: "深見之母"
 thousandhells_haha_no_fukami_adherent: "珍珠仆从"
 thousandhells_haha_no_fukami_adherent_plural: "珍珠仆从"
 thousandhells_haha_no_fukami_desc: "深見之母并非最初的[Glossary('阎魔王','podgloss.yamaking')]之一，甚至有观点认为她至今仍未堕落至足以位列其中。唯因她统御着千层地狱之一，才被归为此类。\n\n深見之母曾是极乐纪元末期的原初海洋之母，直至[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]敕令她执掌惩戒亵渎海洋、滥用火水之罪时，其天庭神位才得以确立。"
 thousandhells_honoyeta: "霍诺耶塔"
 thousandhells_honoyeta_adj: "霍诺耶塔"
 thousandhells_honoyeta_adherent: "毒蛇"
 thousandhells_honoyeta_adherent_plural: "毒蛇"
 thousandhells_honoyeta_desc: "这位波利尼西亚的蛇神在巴厘岛也被称为巴苏基，在印度则被称为 迦梨耶或那伽·帕霍达。霍诺耶塔是一位代表死亡与疾病的腐化阳气的精魂。霍诺耶塔深知自己永远无法登上[Glossary('魔皇','podgloss.demonemperor')]的宝座，但他与阿里阿拉建立的友好,有些人说是谄媚\n霍诺耶塔偏爱使用毒蛇作为其力量的媒介和仆役。"
 thousandhells_hine_nui_te_po: "希内·努伊·特·波"
 thousandhells_hine_nui_te_po_adj: "希内·努伊·特·波"
 thousandhells_hine_nui_te_po_adherent: "绝望散布者"
 thousandhells_hine_nui_te_po_adherent_plural: "绝望散布者"
 thousandhells_hine_nui_te_po_desc: "这位[Glossary('阎魔女王','podgloss.yamaking')]是统治幽冥的诸王中最弱小的一位。她以黑暗云雾的形态显现，以自我憎恨的情绪为食。\n在太平洋群岛上因绝望而自杀的灵魂会坠入她那冰封海域的领域。她那些罕见且狂热的[akuma|E]主要潜伏在朱雀皇朝的边缘地带。"
 thousandhells_malaveyovo: "马拉维约沃"
 thousandhells_malaveyovo_adj: "马拉维约沃"
 thousandhells_malaveyovo_adherent: "食人者"
 thousandhells_malaveyovo_adherent_plural: "食人者"
 thousandhells_malaveyovo_desc: "这位阎魔最初被天庭指派看管饿殍之魂，却因贪恋权势而迅速渎职。\n作为争夺朱雀皇朝统治权的[Glossary('阎魔王','podgloss.yamaking')]之一，马拉维约沃掌管着幽冥中的一小片疆域。他令追随者饱受无尽饥渴折磨，诱使其堕入同类相食的惨剧，再以狂喜与极乐之感作为奖赏。"
 thousandhells_grandmother_witch: "巫婆祖母"
 thousandhells_grandmother_witch_adj: "祖母"
 thousandhells_grandmother_witch_adherent: "子孙"
 thousandhells_grandmother_witch_adherent_plural: "子孙们"
 thousandhells_grandmother_witch_desc: "巫婆祖母是魔皇王座的有力竞争者——甚至可能是极具威胁的竞争者，尽管目前还鲜有人知晓她的存在。巫婆祖母对哀伤纪元有着独到的见解：这将是一个魔法力量空前强大的时代，尽管现存的世界可能无法承受这种形式的魔法。为此，她派遣手下走遍世界各地，收集被诅咒的圣物，招募才华横溢的崇魔者与术士，并尽可能多地搜罗禁忌术法来巩固自己对王位的宣称。"
 thousandhells_tou_shen: "窦深"
 thousandhells_tou_shen_adj: "窦深"
 thousandhells_tou_shen_adherent: "疱疹怪"
 thousandhells_tou_shen_adherent_plural: "疱疹怪"
 thousandhells_tou_shen_desc: "热症地狱是一座小型幽冥领域，居住着那些曾引发天花传播或从中渔利之人。随着让达逐渐巩固其作为疾病[Glossary('阎魔女王','podgloss.yamaking')]的地位，该地狱中的许多灵魂已被她掠走。"
 thousandhells_hluh: "赫鲁"
 thousandhells_hluh_adj: "赫鲁"
 thousandhells_hluh_adherent: "锅炉工"
 thousandhells_hluh_adherent_plural: "锅炉工"
 thousandhells_hluh_desc: "滚油地狱之名实为误称，该领域充斥的并非沸腾热油，而是提炼出的人体脂肪。焦黑燃烧的脂肪油块漂浮在周围粘稠冒泡的油脂海洋之上。各处表面浮着深灰色、熬煮过度的残渣浮沫。\n\n栖身此境的阎魔，或许是所有阎魔中最不具人形者。其名号赫鲁，据信乃是一凝胶状生物，形似岛屿般庞大、亮红色甲壳的水母，每根触须末端皆有利齿吸盘嘴。\n鉴于其择居之地的性质，此生物的存在形式恐非凡人思维所能轻易（或舒适地）理解。"
 thousandhells_ku_of_the_thousand_tears: "千泪哭"
 thousandhells_ku_of_the_thousand_tears_adj: "千泪哭"
 thousandhells_ku_of_the_thousand_tears_adherent: "守门人"
 thousandhells_ku_of_the_thousand_tears_adherent_plural: "守门人"
 thousandhells_ku_of_the_thousand_tears_desc: "酆都乃仿照佛教神话中地狱入口所建的幽冥地狱。此处虽主要由玉皇大帝统辖，但阎魔千泪哭亦在此盘踞，主宰那些死于政见不合的亡魂。"