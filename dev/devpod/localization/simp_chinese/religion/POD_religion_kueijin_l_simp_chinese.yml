 kueijin_religion_desc: "有一些万鬼并不遵循[GetScriptedCharacterByHistoryID('791111').GetFirstName]的五大心法之一。他们遵循其他道途，而五大至尊皇朝的老祖将这些道途称为异端邪说。"
