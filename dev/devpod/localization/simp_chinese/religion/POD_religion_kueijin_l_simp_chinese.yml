 faceofthegods: "众佛相"
 faceofthegods_adj: "众佛相"
 faceofthegods_adherent: "佛徒"
 faceofthegods_adherent_plural: "佛徒"
 faceofthegods_desc: "可能是最极端的异端邪说，众佛相声称[wan_kuei|E]都是被流放的仙佛。他们和信徒建立了自己的宗教，并从祷告中提取气。"
 flameoftherisingphoenix: "涅凤焱"
 flameoftherisingphoenix_adj: "涅凤焱"
 flameoftherisingphoenix_adherent: "凤凰"
 flameoftherisingphoenix_adherent_plural: "凤凰"
 flameoftherisingphoenix_desc: "涅凤焱心法认为转生的意义是为了弥补一个人人生中的罪行。该心法以其成员在短时间内迅速堕落（偶尔则是失踪）而闻名。"
 inwardway: "内引众"
 inwardway_adj: "内引众"
 inwardway_adherent: "修者"
 inwardway_adherent_plural: "修众"
 inwardway_desc: "作为中庸心法的变体，内引者追求着道家心路，而非追随儒家朝廷。"
 wayofthetenthousandscreams: "万嚎道"
 wayofthetenthousandscreams_adj: "万嚎道"
 wayofthetenthousandscreams_adherent: "嚎徒"
 wayofthetenthousandscreams_adherent_plural: "嚎徒"
 wayofthetenthousandscreams_desc: "与五大正道相对立的心法。它的追随者鼓吹与诸阎魔的联合，并视他们的新情形为一种担任毁灭者来辅助玉皇大帝的方式。"
 holy_order_fallen_heroes: "堕仙"
 holy_order_jinhai_remembrance: "金童还仇军"
 holy_order_cursed_golden_children: "受诅金嗣军"
 holy_order_followers_of_arhat: "阿罗汉武僧"
 holy_order_second_breath: "转生者"
 holy_order_masters_high_war: "全战天兵"
 kueijin_bishop_male: "僧侣"
 kueijin_bishop_male_plural: "僧侣"
 kueijin_religious_head_title_name: "僧侣"
 kueijin_death_deity_name_possessive: "阎魔"
 boneflowers_religion: "幽影颂"
 boneflowers_religion_adj: "幽影颂"
 boneflowers_religion_adherent: "颂伶"
 boneflowers_religion_adherent_plural: "颂伶"
 boneflowers_religion_desc: "崇阴的幽影颂，也被称为骨花，是冷酷的逻辑性的亡灵术师，他们寻求冷静的理性和强制的心法平衡。他们也通过他们的后代与凡人社会紧密联系在一起，甚至在几个世纪之后，他们也常常帮助他们的家人。"
 deviltigers_religion: "魔虎啸"
 deviltigers_religion_adj: "魔虎啸"
 deviltigers_religion_adherent: "魔虎"
 deviltigers_religion_adherent_plural: "魔虎"
 deviltigers_religion_desc: "魔虎啸相信他们是过去无能邪魔的替代者；他们惩罚罪人，通过痛苦和暴力寻求启迪。"
 resplendentcranes_religion: "华鹤道"
 resplendentcranes_religion_adj: "华鹤道"
 resplendentcranes_religion_adherent: "推事"
 resplendentcranes_religion_adherent_plural: "推事"
 resplendentcranes_religion_desc: "华鹤道是一个高度墨守成规的法家学派集合，致力于逆转纪元之轮，恢复美德。"
 thousandwhispers_religion: "千呤道"
 thousandwhispers_religion_adj: "千呤道"
 thousandwhispers_religion_adherent: "呤者"
 thousandwhispers_religion_adherent_plural: "呤者"
 thousandwhispers_religion_desc: "呤者们生活在一系列的面具中，他们在死后建立新的身份，以便理解凡人的生活并希望超越它。"
 thrashingdragons_religion: "腾龙舞"
 thrashingdragons_religion_adj: "腾龙舞"
 thrashingdragons_religion_adherent: "舞优"
 thrashingdragons_religion_adherent_plural: "舞优"
 thrashingdragons_religion_desc: "经常被误解的腾龙舞心法自认是死者，但寻求通过模仿和与生者互动来达到大彻大悟。尽管有一些华鹤道的深刻质疑，但它们是完全公认的心法，即使他们在亡生以自己的方式进食和发生关系。"
 empty_hands: "白手"
 empty_hands_adj: "白手"
 empty_hands_adherent: "$boneflowers_religion_adherent$"
 empty_hands_adherent_plural: "$boneflowers_religion_adherent_plural$"
 empty_hands_desc: "其成员认为他们必须保持自己不受污染，但无权干涉他人对知识的追求，无论这追求的代价如何。"
 fishhooks: "钓钩"
 fishhooks_adj: "钓钩"
 fishhooks_adherent: "$boneflowers_religion_adherent$"
 fishhooks_adherent_plural: "$boneflowers_religion_adherent_plural$"
 fishhooks_desc: "钓钩们研究、审讯、欺骗和折磨恶鬼。他们试图通过该过程了解阎魔和诅咒，而不拿自己的灵魂冒险。为了从恶鬼那里获得信息，他们会做任何事或说任何话。"
 august_body_of_sagacious_devils: "尊贵贤魔团"
 august_body_of_sagacious_devils_adj: "尊贵贤魔团"
 august_body_of_sagacious_devils_adherent: "$deviltigers_religion_adherent$"
 august_body_of_sagacious_devils_adherent_plural: "$deviltigers_religion_adherent_plural$"
 august_body_of_sagacious_devils_desc: "通过极具竞争性的阶级制度，贤魔团将心魔的愤怒能量转化为生产资料，为[GetTrait('kueijin').GetName( GetNullCharacter )]谋取更大利益。"
 thousand_embers_righteousness_societies: "千烬正气会"
 thousand_embers_righteousness_societies_adj: "千烬正气会"
 thousand_embers_righteousness_societies_adherent: "$deviltigers_religion_adherent$"
 thousand_embers_righteousness_societies_adherent_plural: "$deviltigers_religion_adherent_plural$"
 thousand_embers_righteousness_societies_desc: "正气会会员跨越家庭界限相互支持，并且通常会一起学习心法典籍。然而，从长远来看，其目的是为了分散魔帝的注意力，作为游击队，将凡人社会烧毁，以阻止阎魔的繁荣。"
 eight_lotus_blooming: "八莲开"
 eight_lotus_blooming_adj: "八莲开"
 eight_lotus_blooming_adherent: "$resplendentcranes_religion_adherent$"
 eight_lotus_blooming_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 eight_lotus_blooming_desc: "对经义的温和注解，它更注重八莲道的教义，而对其他心法教义则不屑一顾。"
 empty_throne: "空御座"
 empty_throne_adj: "空御座"
 empty_throne_adherent: "$resplendentcranes_religion_adherent$"
 empty_throne_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 empty_throne_desc: "对经义的温和注解，它鼓励正义的行动胜过具体的方法和规定，即使是最邪恶的人也能被鼓励在美德前回头是岸。"
 two_li_road: "双理道"
 two_li_road_adj: "双理道"
 two_li_road_adherent: "$resplendentcranes_religion_adherent$"
 two_li_road_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 two_li_road_desc: "对经义的温和注解，它认为现代文明是邪恶的真正原因，并寻求回到更简单和更古老的生活方式。"
 yellow_moon: "黄月"
 yellow_moon_adj: "黄月"
 yellow_moon_adherent: "$resplendentcranes_religion_adherent$"
 yellow_moon_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 yellow_moon_desc: "对经义的温和注解，它将孔子等有德行的凡人的教诲纳入华鹤道教义。"
 fellowship_of_the_travelers_of_the_great_earth: "大地旅者团伙"
 fellowship_of_the_travelers_of_the_great_earth_adj: "大地旅者团伙"
 fellowship_of_the_travelers_of_the_great_earth_adherent: "$resplendentcranes_religion_adherent$"
 fellowship_of_the_travelers_of_the_great_earth_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 fellowship_of_the_travelers_of_the_great_earth_desc: "对经义的极端注解，它寻求一个新皇帝来将中原统一。为此，他们向西看，并参与到西方文化中。"
 liberators_of_the_wheel: "轮回解放者"
 liberators_of_the_wheel_adj: "轮回解放者"
 liberators_of_the_wheel_adherent: "$resplendentcranes_religion_adherent$"
 liberators_of_the_wheel_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 liberators_of_the_wheel_desc: "对经义的极端注解，它认为纪元之轮之所以转动，是因为中原地区以外的地方太过深陷于罪恶而无法得到救赎。为此，他们对西方机构进行恐怖袭击，以颠覆中原之外的地方，好恢复秩序。"
 wise_centipedes: "智百足"
 wise_centipedes_adj: "智百足"
 wise_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 wise_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 wise_centipedes_desc: "中庸平衡的吟者简单地称呼自己为智百足，他们关注的是在一个地方或一个人身上实现了平衡后的维护。"
 bunraku: "文乐偶"
 bunraku_adj: "文乐偶"
 bunraku_adherent: "$thousandwhispers_religion_adherent$"
 bunraku_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 bunraku_desc: "倾于北，文乐偶在暗处运作，在中原执行平衡。"
 dancing_peacocks: "起舞雉"
 dancing_peacocks_adj: "起舞雉"
 dancing_peacocks_adherent: "$thousandwhispers_religion_adherent$"
 dancing_peacocks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 dancing_peacocks_desc: "倾于东，孔雀们生活在凡人之中，是最多参与凡人事务的。"
 scarlet_centipedes: "赤蜈蚣"
 scarlet_centipedes_adj: "赤蜈蚣"
 scarlet_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 scarlet_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 scarlet_centipedes_desc: "倾于南，赤蜈蚣是试图颠覆现状的麻烦制造者和勇士。"
 exalted_jade_masks: "玉假面"
 exalted_jade_masks_adj: "玉假面"
 exalted_jade_masks_adherent: "$thousandwhispers_religion_adherent$"
 exalted_jade_masks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 exalted_jade_masks_desc: "倾于西，玉假面猎杀鬼魂，试图通过允许他们过世或在他们拒绝时杀死他们来纠正他们的不平衡。"
 laughing_rainbows: "笑彩虹"
 laughing_rainbows_adherent: "$thrashingdragons_religion_adherent$"
 laughing_rainbows_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 laughing_rainbows_desc: "该教派的成员寻求学会爱一个人的真实，而不仅仅是爱某些表象。这导致了一种非常不加掩饰的，可能会对他人造成负担的生活方式。"
 the_thousand_faced_thunders: "千面雷"
 the_thousand_faced_thunders_adj: "千面雷"
 the_thousand_faced_thunders_adherent: "$thrashingdragons_religion_adherent$"
 the_thousand_faced_thunders_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_thousand_faced_thunders_desc: "致力于[yang_world|E]的教派，特别是居住在大城市的新城市之灵。"
 the_ten_seasons_sect: "十季宗"
 the_ten_seasons_sect_adj: "十季宗"
 the_ten_seasons_sect_adherent: "$thrashingdragons_religion_adherent$"
 the_ten_seasons_sect_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_ten_seasons_sect_desc: "致力于崇尚自然循环和精心修炼自己的教派。"
 the_passion_bloodflowers: "炽血花"
 the_passion_bloodflowers_adj: "炽血花"
 the_passion_bloodflowers_adherent: "$thrashingdragons_religion_adherent$"
 the_passion_bloodflowers_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_passion_bloodflowers_desc: "血花在享受生活方面采取了比笑彩虹更极端的立场，有时甚至接近于兽性。"
 laughing_rainbows_adj: "笑彩虹"
 kueijin_divine_realm: "天国"
 kueijin_witchgodname_the_horned_god_possessive: "魔皇的"
 searing_wind: "灼风"
 searing_wind_adj: "灼风"
 searing_wind_adherent: "$deviltigers_religion_adherent$"
 searing_wind_adherent_plural: "$deviltigers_religion_adherent_plural$"
 searing_wind_desc: "一些魔虎试图回到先于心法的[wan_kuei|E]社会的状态，创建一个没有皇朝束缚的新魔武帝国。"