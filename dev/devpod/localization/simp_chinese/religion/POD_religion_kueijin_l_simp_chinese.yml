l_simp_chinese:
 kueijin_religion: "@kueijin_icon!旁门心法"
 kueijin_religion_adj: "旁门心法"
 kueijin_religion_adherent: "旁门门徒"
 kueijin_religion_adherent_plural: "旁门门徒"
 kueijin_religion_desc: "有一些万鬼并不遵循[GetScriptedCharacterByHistoryID('791111').GetFirstName]的五大[Glossary('心法','podgloss.dharma')]之一。他们遵循其他道途，而五大至尊皇朝的老祖将这些道途称为异端邪说。"
 kueijin_high_god_name: "玉皇大帝"
 kueijin_high_god_name_possessive: "[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]"
