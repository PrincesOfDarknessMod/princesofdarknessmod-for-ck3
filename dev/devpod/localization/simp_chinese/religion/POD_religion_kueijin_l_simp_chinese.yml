 kueijin_water_god_name: "$kueijin_night_god_name$"
 kueijin_water_god_name_possessive: "$kueijin_night_god_name_possessive$"
 faceofthegods: "众佛相"
 faceofthegods_adj: "众佛相"
 faceofthegods_adherent: "佛徒"
 faceofthegods_adherent_plural: "佛徒"
 faceofthegods_desc: "可能是最极端的异端邪说，众佛相声称$pod_wan_kuei$都是被流放的仙佛。他们和信徒建立了自己的宗教，并从祷告中提取气。"
 flameoftherisingphoenix: "涅凤焱"
 flameoftherisingphoenix_adj: "涅凤焱"
 flameoftherisingphoenix_adherent: "凤凰"
 flameoftherisingphoenix_adherent_plural: "凤凰"
 flameoftherisingphoenix_desc: "涅凤焱心法认为转生的意义是为了弥补一个人人生中的罪行。该心法以其成员在短时间内迅速堕落（偶尔则是失踪）而闻名。"
 inwardway: "内引众"
 inwardway_adj: "内引众"
 inwardway_adherent: "修者"
 inwardway_adherent_plural: "修众"
 inwardway_desc: "作为中庸心法的变体，内引者追求着道家心路，而非追随儒家朝廷。"
 wayofthetenthousandscreams: "万嚎道"
 wayofthetenthousandscreams_adj: "万嚎道"
 wayofthetenthousandscreams_adherent: "嚎徒"
 wayofthetenthousandscreams_adherent_plural: "嚎徒"
 wayofthetenthousandscreams_desc: "与五大正道相对立的心法。它的追随者鼓吹与诸阎魔的联合，并视他们的新情形为一种担任毁灭者来辅助玉皇大帝的方式。"
 holy_order_fallen_heroes: "堕仙"
 holy_order_jinhai_remembrance: "金童还仇军"
 holy_order_cursed_golden_children: "受诅金嗣军"
 holy_order_followers_of_arhat: "阿罗汉武僧"
 holy_order_second_breath: "转生者"
 holy_order_masters_high_war: "全战天兵"
 kueijin_bishop_male: "僧侣"
 kueijin_bishop_male_plural: "僧侣"
 kueijin_religious_head_title_name: "僧侣"
 kueijin_death_deity_name_possessive: "阎魔"
 boneflowers_religion: "幽影颂"
 boneflowers_religion_adj: "幽影颂"
 boneflowers_religion_adherent: "颂伶"
 boneflowers_religion_adherent_plural: "颂伶"
 boneflowers_religion_desc: "崇阴的幽影颂，也被称为骨花，是冷酷的逻辑性的亡灵术师，他们寻求冷静的理性和强制的心法平衡。他们也通过他们的后代与凡人社会紧密联系在一起，甚至在几个世纪之后，他们也常常帮助他们的家人。"
 deviltigers_religion: "魔虎啸"
 deviltigers_religion_adj: "魔虎啸"
 deviltigers_religion_adherent: "天罚之魔"
 deviltigers_religion_adherent_plural: "天罚群魔"
 deviltigers_religion_desc: "魔虎啸相信他们是过去无能邪魔的替代者；他们惩罚罪人，通过痛苦和暴力寻求启迪。"
 resplendentcranes_religion: "华鹤道"
 resplendentcranes_religion_adj: "华鹤道"
 resplendentcranes_religion_adherent: "推事"
 resplendentcranes_religion_adherent_plural: "推事"
 resplendentcranes_religion_desc: "华鹤道是一个高度墨守成规的法家学派集合，致力于逆转纪元之轮，恢复美德。"
 thousandwhispers_religion: "千呤道"
 thousandwhispers_religion_adj: "千呤道"
 thousandwhispers_religion_adherent: "呤者"
 thousandwhispers_religion_adherent_plural: "呤者"
 thousandwhispers_religion_desc: "呤者们生活在一系列的面具中，他们在死后建立新的身份，以便理解凡人的生活并希望超越它。"
 thrashingdragons_religion: "腾龙舞"
 thrashingdragons_religion_adj: "腾龙舞"
 thrashingdragons_religion_adherent: "舞优"
 thrashingdragons_religion_adherent_plural: "舞优"
 thrashingdragons_religion_desc: "经常被误解的腾龙舞心法自认是死者，但寻求通过模仿和与生者互动来达到大彻大悟。尽管有一些华鹤道的深刻质疑，但它们是完全公认的心法，即使他们在亡生以自己的方式进食和发生关系。"
 empty_hands: "白手"
 empty_hands_adj: "白手"
 empty_hands_adherent: "$boneflowers_religion_adherent$"
 empty_hands_adherent_plural: "$boneflowers_religion_adherent_plural$"
 empty_hands_desc: "The Empty Hands school of thought believes they must keep themselves free of taint but have no right to interfere with another's quest for knowledge, even when dealing with akuma."
 fishhooks: "钓钩"
 fishhooks_adj: "钓钩"
 fishhooks_adherent: "$boneflowers_religion_adherent$"
 fishhooks_adherent_plural: "$boneflowers_religion_adherent_plural$"
 fishhooks_desc: "钓钩们研究、审讯、欺骗和折磨恶鬼。他们试图通过该过程了解阎魔和诅咒，而不拿自己的灵魂冒险。为了从恶鬼那里获得信息，他们会做任何事或说任何话。"
 august_body_of_sagacious_devils: "尊贵贤魔团"
 august_body_of_sagacious_devils_adj: "通明尊者"
 august_body_of_sagacious_devils_adherent: "玉祸"
 august_body_of_sagacious_devils_adherent_plural: "玉魔"
 august_body_of_sagacious_devils_desc: "The official leaders of the Devil Tigers, the August Body uses an extreme competitive system of ranks to channel the wrathful energy of the P'o into productive work for the greater good of the [GetTrait('kueijin').GetName( GetNullCharacter )]."
 thousand_embers_righteousness_societies: "千烬结社"
 thousand_embers_righteousness_societies_adj: "正气"
 thousand_embers_righteousness_societies_adherent: "$deviltigers_religion_adherent$"
 thousand_embers_righteousness_societies_adherent_plural: "$deviltigers_religion_adherent_plural$"
 thousand_embers_righteousness_societies_desc: "The social core of the Devil Tigers, the societies are small scale groups that work, train and enlighten themselves together. The purpose of each society in the long run, however, is to act as a distraction to the Demon Emperor, as a guerrilla cell that will set mortal society ablaze to stop the Yama Kings from prospering."
 eight_lotus_blooming: "八莲开"
 eight_lotus_blooming_adj: "八莲开"
 eight_lotus_blooming_adherent: "$resplendentcranes_religion_adherent$"
 eight_lotus_blooming_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 eight_lotus_blooming_desc: "This sect of the Resplendent Cranes focus more on an internal journey towards law and order, putting great emphasis on meditation and spiritual quests."
 empty_throne: "空御座"
 empty_throne_adj: "空御座"
 empty_throne_adherent: "$resplendentcranes_religion_adherent$"
 empty_throne_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 empty_throne_desc: "A moderate sect that encourages righteous action over specific methods and regulations. They believe that even the most wicked can be encouraged to rejects their ways in the face of virtue."
 two_li_road: "双理道"
 two_li_road_adj: "双理道"
 two_li_road_adherent: "$resplendentcranes_religion_adherent$"
 two_li_road_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 two_li_road_desc: "This sect believes that modern civilization is the true cause of wickedness and seek to return to the more simple and traditional ways of living."
 yellow_moon: "黄月"
 yellow_moon_adj: "黄月"
 yellow_moon_adherent: "$resplendentcranes_religion_adherent$"
 yellow_moon_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 yellow_moon_desc: "Founded by three mandarins who believed in the enlightenment that can be found in mortals' philosophies, this sect has survived their fall from grace and been begrudgingly accepted as legitimate."
 fellowship_of_the_travelers_of_the_great_earth: "大地旅者团伙"
 fellowship_of_the_travelers_of_the_great_earth_adj: "大地旅者团伙"
 fellowship_of_the_travelers_of_the_great_earth_adherent: "$resplendentcranes_religion_adherent$"
 fellowship_of_the_travelers_of_the_great_earth_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 fellowship_of_the_travelers_of_the_great_earth_desc: "An illegal sect that seeks a new Emperor to unite the Middle Kingdom into one state. To this end, they interfere in mortal affairs much more than what is accepted by the mainstream doctrine."
 liberators_of_the_wheel: "轮回解放者"
 liberators_of_the_wheel_adj: "轮回解放者"
 liberators_of_the_wheel_adherent: "$resplendentcranes_religion_adherent$"
 liberators_of_the_wheel_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 liberators_of_the_wheel_desc: "An illegal sect that believes that the Wheel of Ages turns because of places beyond the Middle Kingdom who are too stepped in sin to be redeemed. Following this, they employ terrorist attacks to destabilize the world beyond the Middle Kingdom."
 wise_centipedes: "智百足"
 wise_centipedes_adj: "智百足"
 wise_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 wise_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 wise_centipedes_desc: "中庸平衡的吟者简单地称呼自己为智百足，他们关注的是在一个地方或一个人身上实现了平衡后的维护。"
 bunraku: "文乐偶"
 bunraku_adj: "文乐偶"
 bunraku_adherent: "$thousandwhispers_religion_adherent$"
 bunraku_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 bunraku_desc: "倾于北，文乐偶在暗处运作，在中原执行平衡。"
 dancing_peacocks: "起舞雉"
 dancing_peacocks_adj: "起舞雉"
 dancing_peacocks_adherent: "$thousandwhispers_religion_adherent$"
 dancing_peacocks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 dancing_peacocks_desc: "East-orientated, the Peacocks live among mortals and involve themselves the most in mortal affairs."
 scarlet_centipedes: "赤蜈蚣"
 scarlet_centipedes_adj: "赤蜈蚣"
 scarlet_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 scarlet_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 scarlet_centipedes_desc: "倾于南，赤蜈蚣是试图颠覆现状的麻烦制造者和勇士。"
 exalted_jade_masks: "玉假面"
 exalted_jade_masks_adj: "玉假面"
 exalted_jade_masks_adherent: "$thousandwhispers_religion_adherent$"
 exalted_jade_masks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 exalted_jade_masks_desc: "West-orientated, the Jade Masks hunt ghosts, seeking to correct their imbalance by allowing them to pass on or slaying them if they refuse."
 laughing_rainbows: "笑彩虹"
 laughing_rainbows_adherent: "$thrashingdragons_religion_adherent$"
 laughing_rainbows_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 laughing_rainbows_desc: "The moderate of the Thrashing Dragons, this is the orthodox view of this Dharma that seeks a compromise between seeking new experiences and contemplation of past ones."
 the_thousand_faced_thunders: "千面雷"
 the_thousand_faced_thunders_adj: "千面雷"
 the_thousand_faced_thunders_adherent: "$thrashingdragons_religion_adherent$"
 the_thousand_faced_thunders_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_thousand_faced_thunders_desc: "A sect dedicated to the [yang_world|E], particularly adept at dealing with the spirits dwelling there. They tend to follow mortals' innovations with close attention to anticipate the birth of new spirits."
 the_ten_seasons_sect: "十季宗"
 the_ten_seasons_sect_adj: "十季宗"
 the_ten_seasons_sect_adherent: "$thrashingdragons_religion_adherent$"
 the_ten_seasons_sect_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_ten_seasons_sect_desc: "A sect dedicated to the veneration of the natural cycles and careful cultivation of \"gardens\", be they literal ones or families, organizations or even nations."
 the_passion_bloodflowers: "炽血花"
 the_passion_bloodflowers_adj: "炽血花"
 the_passion_bloodflowers_adherent: "$thrashingdragons_religion_adherent$"
 the_passion_bloodflowers_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_passion_bloodflowers_desc: "血花在享受生活方面采取了比笑彩虹更极端的立场，有时甚至接近于兽性。"
 laughing_rainbows_adj: "笑彩虹"
 kueijin_divine_realm: "天国"
 kueijin_witchgodname_the_horned_god_possessive: "魔皇的"
 searing_wind: "灼风"
 searing_wind_adj: "灼焚"
 searing_wind_adherent: "地狱步卒"
 searing_wind_adherent_plural: "地狱步卒团"
 searing_wind_desc: "Following their Grand Arhat Hon Li, these Devil Tigers refuse the structure of the Courts. They instead prepare for the final battle against the Demon Emperor and are willing to burn the world to achieve victory if needs be."
 societies_brigands_devils: "倾朝会"
 societies_brigands_devils_adj: "倾覆"
 societies_brigands_devils_adherent: "魔寇"
 societies_brigands_devils_adherent_plural: "魔寇众"
 societies_brigands_devils_desc: "The Society of Brigands and Decadent Dynasty Toppling Devils is mainly a mob of socially disadvantaged disciples used by their elders when they feel that the mortal world needs a bloody shakeup. Their appearance en masse always heralds troubled times."
 black_iron_talons: "黑铁之爪"
 black_iron_talons_adj: "铁"
 black_iron_talons_adherent: "爪"
 black_iron_talons_adherent_plural: "爪群"
 black_iron_talons_desc: "The Black Iron Talons are the paramilitary of the Devil Tigers, organizing themselves under a military chain of command. They are also known as peerless investigators and a Talon always makes sure that their target is indeed evil before striking."
 brillant_coals: "炽燃炭"
 brillant_coals_adj: "赤血"
 brillant_coals_adherent: "赤血虎"
 brillant_coals_adherent_plural: "赤血虎群"
 brillant_coals_desc: "The Brilliant Coals is the traditional philosophy of the Devil Tigers adapted to the Scarlet Phoenix Court. As such it is matriarchal and more on carnal impulse than raw violence."
 electric_money: "Crimson Tiger Mercantile Cartel"
 electric_money_adj: "赤血"
 electric_money_adherent: "赤血虎"
 electric_money_adherent_plural: "赤血虎群"
 electric_money_desc: "The \"investment bank\" of the Devil Tigers is a society dedicated to fight the Yama Kings in the economic battlefield. They are more than willing to crash entire economies if the demons of Yomi lose important assets in the process."
 righteous_smiting_fist: "天诛拳"
 righteous_smiting_fist_adj: "拳"
 righteous_smiting_fist_adherent: "解放者"
 righteous_smiting_fist_adherent_plural: "解放者"
 righteous_smiting_fist_desc: "The Righteous Earth-Prison Smiting Fist is a society that refuses the Courts' policy of coexistence with wraiths. They instead want to topple the Dark Kingdom of Jade and its corrupt ruler to free the souls imprisoned in it."
 sinner_punishing_society: "Sinner Punishing Society"
 sinner_punishing_society_adj: "惩戒"
 sinner_punishing_society_adherent: "惩戒者"
 sinner_punishing_society_adherent_plural: "惩戒团"
 sinner_punishing_society_desc: "The Distinguished Sinner-Punishing Society goes to such extreme to punish evildoers that even other Devil Tigers balk. Their public and ultra violent executions have them being considered a liability to the Devil Tigers' cause as a whole."
 shan_bo_heresy: "善波异端"
 shan_bo_heresy_adj: "善波"
 shan_bo_heresy_adherent: "飞升者"
 shan_bo_heresy_adherent_plural: "飞升者"
 shan_bo_heresy_desc: "A Devil Tiger philosopher, Shan-bo, pushed the radical idea that the August Personage of Jade might have made a mistake with the banishment of the [kuei_jin|E] and has shamefully retreated from the world after realizing it. Shan-bo never relented on his vision despite multiple censures from the Courts coming his way and his small but dedicated following survives to this day."
 shining_ice_guardians: "耀冰守卫"
 shining_ice_guardians_adj: "耀光"
 shining_ice_guardians_adherent: "$resplendentcranes_religion_adherent$"
 shining_ice_guardians_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 shining_ice_guardians_desc: "As the main branch of the Resplendent Cranes Dharma, the guardians pride themselves in their strict adherence to the Eight Lotus Path."