 viacaeli: "天国之道"
 viacaeli_adj: "天国之道"
 viacaeli_adherent: "挪得学家"
 viacaeli_adherent_plural: "挪得学家"
 viacaeli_desc: "根据$pod_cainite$的圣书《拉俄狄刻福音》，一些天国之道心路的原则源自该隐本人。虽然该隐被天主诅咒，但他也比任何其他存在过的血族更接近天主。天国之道的追随者试图通过宗教虔诚来控制他们的心兽。"
 viadivinitatis: "神性之道"
 viadivinitatis_adj: "神性之道"
 viadivinitatis_adherent: "神人"
 viadivinitatis_adherent_plural: "神人"
 viadivinitatis_desc: "挪得学家间的狂热者和魔宴的先行者，这条心路的追随者认为自己被天主青睐而非诅咒，神性追随者寻求控制凡人，并呼吁尽可能多的$pod_cainites$加入天国之道。这条心路被许多人认为是四条心路中最离经叛道的。"
 viapenaculum: "悔罪之道"
 viapenaculum_adj: "悔罪之道"
 viapenaculum_adherent: "忏悔者"
 viapenaculum_adherent_plural: "忏悔者"
 viapenaculum_desc: "那些追随悔罪之道的信徒认为自己不配于天主，他们是天主眼中最卑微的人。没有哪条道会把悔悟之行当回事，而这是我们这些$pod_cainites$教徒在神的眼中获得开悟和蒙恩的唯一途径。"
 viavindicta: "天罚之道"
 viavindicta_adj: "天罚之道"
 viavindicta_adherent: "十字军战士"
 viavindicta_adherent_plural: "十字军战士"
 viavindicta_desc: "这些血族认为自己为愤怒的天主之手，毁灭那得罪他的人。任何被认为是邪恶的或对天主不忠的人都必须被毁灭。他们倾向于追杀他们认为是腐化了的$pod_cainites$。"
 viadolorosa: "受难之道"
 viadolorosa_adj: "受难之道"
 viadolorosa_adherent: "殉道者"
 viadolorosa_adherent_plural: "殉道者"
 viadolorosa_desc: "受难之道的殉道者，这些挪得学家把自己作为不会死的牺牲品，这样其他人就不必再受苦了。他们会心甘情愿地牺牲自己来阻止被认为是不神圣的东西造成的腐化，尤其是恶魔或其他$pod_cainites$。"
 viachristi: "基督之道"
 viachristi_adj: "基督之道"
 viachristi_adherent: "基督徒"
 viachristi_adherent_plural: "基督徒"
 viachristi_desc: "活着时曾是基督教徒的$pod_cainites$可以选择追随这条基督之道。其假设天主对这个世界的计划包括了吸血鬼，那么对祂的意志保持顺从将帮助他们控制心兽。"
 derechchaim: "生活之道"
 derechchaim_adj: "生活之道"
 derechchaim_adherent: "艾斯提瑞"
 derechchaim_adherent_plural: "艾斯提瑞"
 derechchaim_desc: "活着时曾是犹太人的$pod_cainites$可以选择追随这条生活之道。他们相信是“那个名字”和世界上的其他人一起创造了吸血鬼，因此《妥拉》的训诲仍然适用于他们，并提供了控制心兽的手段。"
 codeofsamiel: "萨麦尔圣书"
 codeofsamiel_adj: "萨麦尔圣书"
 codeofsamiel_adherent: "萨麦尔派"
 codeofsamiel_adherent_plural: "萨麦尔派"
 codeofsamiel_desc: "通常认为扫罗武者一系的最强者，殉道者萨麦尔亲手铸造了这条心路。据传说，在扫罗不在的时候，“神圣上主”的指挥官米迦勒拜访了萨麦尔，让其接取了荣誉和愤怒作为该心路的核心信条。"
 viaarchangeli: "天使长之道"
 viaarchangeli_adj: "天使长之道"
 viaarchangeli_adherent: "拿非利人"
 viaarchangeli_adherent_plural: "拿非利人"
 viaarchangeli_desc: "追随米迦勒的脚步意味着成为所有人的缪斯和牧羊人，必要时也可以成为殉道者。作为天国之路的追随者，天使长忠实地认为米迦勒是受诅者的在世基督，相信吸血鬼必须扮演天使的角色来对待他们的凡人牧群。"
