 holy_order_the_faithful: "虔信者"
 holy_order_order_of_divinity: "神性骑士团"
 holy_order_holy_order_of_vengeance: "复仇至圣骑士团"
 holy_order_order_of_penitence: "忏悔骑士团"
 holy_order_martyrs_of_tears: "泪之殉道者"
 holy_order_order_of_terafim: "神像骑士团"
 holy_order_order_of_estries: "艾斯提瑞骑士团"
 consumptionism: "食用主义"
 consumptionism_adj: "食用主义"
 consumptionism_adherent: "食用主义者"
 consumptionism_adherent_plural: "食用主义者"
 consumptionism_desc: "天主已死，被该隐啖魂。随后该隐再造了下一世代，天主在他体内的火花也被分裂了。因此，食用主义者认为，不该杀死血族的生命……除非先$pod_diablerie$了天主在他体内的火花。"
 divisionism: "除外主义"
 divisionism_adj: "除外主义"
 divisionism_adherent: "除外主义者"
 divisionism_adherent_plural: "除外主义者"
 divisionism_desc: "天主将祂的精髓分享给所有的血族，但只有足够圣洁的虔信者才配得上它。因此，除外主义者试图使皈依或[Glossary('吸榨','game_concept_diablerie_desc')]其他吸血鬼。"
 viaaesigard: "阿斯加德之道"
 viaaesigard_adj: "阿斯加德之道"
 viaaesigard_adherent: "阿斯加德人"
 viaaesigard_adherent_plural: "阿斯加德人"
 viaaesigard_desc: "古老的北欧方式和传统必须得到维护，吸血鬼不是神，甚至不是被神选中的。他们和每个北欧人一样，都被命运所束缚。\n聪明的阿斯加德人寻求传播萨迦，以便让人们知道真相，即使结局已经写好。"
 roadofheaven_religious_head_title_name: "信仰典范"
 roadofheaven_death_deity_name_possessive: "毁灭"
 vianoctis: "暗夜之路"
 vianoctis_adj: "暗夜之路"
 vianoctis_adherent: "教世者"
 vianoctis_adherent_plural: "教世者"
 vianoctis_desc: "教世者能感到该隐的诅咒和他们自己的诅咒的重量，甚至比那些遵守天国之道的人更重。同样像挪得学家，教世者寻求救赎和宽恕，而赢得它需要痛苦和净化。然而，相比于教世者相当温和的方式，教世者积极地行走在人类世界，惩罚和杀害凡人罪人。"
 pathoftheheavenlyabode: "天居之道"
 pathoftheheavenlyabode_adj: "天居之道"
 pathoftheheavenlyabode_adherent: "复仇者"
 pathoftheheavenlyabode_adherent_plural: "复仇者"
 pathoftheheavenlyabode_desc: "这条心路的追随者相信，为了真正拯救灵魂，凡俗肉体必须在灵魂找到救赎后立即被毁灭，以防止进一步的腐化。"
 viaredemptio: "救赎之道"
 viaredemptio_adj: "救赎之道"
 viaredemptio_adherent: "救赎者"
 viaredemptio_adherent_plural: "救赎者"
 viaredemptio_desc: "救赎之道是对悔罪之道的一条偏向主动行动的分叉。他们接受自己因罪而受到上帝的诅咒，必须赎罪，但会毫不犹豫地对恶魔和罪人采取积极的行动，以救赎他们的灵魂。"
 roadofheaven_divine_realm: "天国"
 roadofheaven_witchgodname_the_horned_god_possessive: "魔鬼"