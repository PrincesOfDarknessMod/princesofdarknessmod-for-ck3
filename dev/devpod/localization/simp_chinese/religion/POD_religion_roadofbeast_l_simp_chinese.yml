 viabestiae: "兽性之道"
 viabestiae_adj: "兽性之道"
 viabestiae_adherent: "野兽"
 viabestiae_adherent_plural: "野兽"
 viabestiae_desc: "心兽之路的信徒通过生存、力量和个性的原始概念来控制他们的心兽。许多心兽之路的成员选择了一种简单的、兽性的生活方式来最好地服务于兽性之道的信仰，而其他追随者则类似于野蛮人一般过着一种简单的生活。"
 viapraedator: "猎手之道"
 viapraedator_adj: "猎手之道"
 viapraedator_adherent: "猎手"
 viapraedator_adherent_plural: "猎手"
 viapraedator_desc: "循着猎手之道的野者是为了掠食那些他们认为比自己低等的猎物而存在的。否则就是亵渎神灵。他们也用他们的心兽作为工具来辅助他们的狩猎。"
 viaerronis: "浪游之道"
 viaerronis_adj: "浪子之道"
 viaerronis_adherent: "浪子"
 viaerronis_adherent_plural: "浪子"
 viaerronis_desc: "对于这些走在浪游之道上的野者来说，文明和任何与之相关的东西都是令人厌恶的。他们轻装旅行，而且一直在旅行。它也被称为旅行之道。"
 viaferitas: "野蛮之道"
 viaferitas_adj: "野蛮之道"
 viaferitas_adherent: "野蛮人"
 viaferitas_adherent_plural: "野蛮人"
 viaferitas_desc: "在野蛮之道上的野者最容易在暴怒时释放心兽。他们的愤怒指向任何他们认为软弱的东西，特别是文明。它们经常侵袭，而且很猛烈。"
 viavenatorumbra: "灰猎手之道"
 viavenatorumbra_adj: "灰猎手之道"
 viavenatorumbra_adherent: "灰猎手"
 viavenatorumbra_adherent_plural: "灰猎手"
 viavenatorumbra_desc: "如果有任何不厌恶文明概念的野者，那就是这些遵循灰猎手之道的。相反，他们认为城镇和城市是另一种形式的狩猎场。他们是最文明的野者，但不要想错，他们的狩猎能力的并不比其他的差。"
 vialiberatio: "解放之道"
 vialiberatio_adj: "解放之道"
 vialiberatio_adherent: "解放者"
 vialiberatio_adherent_plural: "解放者"
 vialiberatio_desc: "解放之道的野者常常被与狂徒相混淆，他们把城市视为陷阱和灵魂的死亡。他们认为自己的职责是把被困的人们解放出来，让他们过上更纯粹、更原始的生活。"
 viaeinherjar: "英灵之道"
 viaeinherjar_adj: "英灵之道"
 viaeinherjar_adherent: "英灵战士"
 viaeinherjar_adherent_plural: "英灵战士"
 viaeinherjar_desc: "这条心路在北欧的吸血鬼中流传，视为对全父给予他们的上古伦理的提醒。这条心路教导责任、面对逆境的勇气和个人的主动性。许多人通过钢铁般的纪律和勇气，比如直视太阳升起来驱赶心兽。大多数心路的追随者都是没大没小的，自私的，并会生理虐待那些他们不尊重的。通常情况下，即使是他们尊重的人也只受到稍微好一点的对待。"
 viayasaq: "札撒之路"
 viayasaq_adj: "札撒之路"
 viayasaq_adherent: "安答"
 viayasaq_adherent_plural: "安答"
 viayasaq_desc: "草原吸血鬼的心路，特别适用于[Glossary('安答','podgloss.anda')]。它让人想起了许多蒙古人的札撒（战士–兄弟）传统。札撒之路的追随者被西方人称为蛮族。"
 pathofnoiad: "诺亚德之道"
 pathofnoiad_adj: "诺亚德之道"
 pathofnoiad_adherent: "诺亚德"
 pathofnoiad_adherent_plural: "诺亚德"
 pathofnoiad_desc: "诺亚德的起源已经被$pod_cainite$和凡人都遗忘了。在诺亚德的心目中，他们总是居住在北方，指导和保护斯堪的纳维亚北部的萨米部落。诺伊德相信自己是神性存在，神明派他们来引导和保护他们的选民免受超自然和世俗的威胁，并解读极光神迹。诺亚德和他们的部落之间的关系是某种共生关系：诺亚德会保护部落不受敌人的伤害，并充当他们的向导、萨满和老师，而部落则愿意献出他们的血，在没有黑夜的漫长极昼里保护诺亚德。在饥荒时期，诺亚德会将人[ghoul|E]化来确保部落成员的生存。诺亚德公然居住在萨米人中间，并完全接纳了萨米人。那些被选择$pod_Embrace$的人往往是那些有占卜天赋，例如拥有对梦和星的解读能力的人。诺亚德还会观察后代里至少有一位吸血鬼的家庭，寻找他们喜欢的特质。"
