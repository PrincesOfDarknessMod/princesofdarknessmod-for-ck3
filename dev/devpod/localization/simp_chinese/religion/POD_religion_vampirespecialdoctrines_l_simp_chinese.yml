l_simp_chinese:
 burning_faith_name: "灼热信仰"
 burning_faith_doctrine_name: "灼热信仰"
 burning_faith_doctrine_desc: "我们追随正义的事业，只要怀有坚定的信念与勇气，几乎没有什么是我们做不到的。"
 undead_aesir_name: "不死阿萨"
 undead_aesir_doctrine_name: "重生的英灵战士"
 undead_aesir_doctrine_desc: "卡纳尔的斗士们渴望荣耀和战斗，他们理所当然地被弱小的$pod_cainites$所惧怕。"
 restored_republic_name: "重建共和国"
 restored_republic_doctrine_name: "元老院重开"
 restored_republic_doctrine_desc: "对于一个$pod_cainite$机构来说，元老院的思想出人意料地开放。但压力和血腥丝毫不亚于其他人。"
 senatorial_clans_name: "共和国之友"
 senatorial_clans_doctrine_name: "元老之氏族"
 senatorial_clans_doctrine_desc: "元老院还没有忘记君士坦丁堡的米迦勒或迦太基的背叛。他们腐朽的“氏族”在神圣的元老院大厅里不受欢迎。"
 vengeful_carthage_name: "记仇的迦太基"
 vengeful_carthage_doctrine_name: "无情的乌托邦"
 vengeful_carthage_doctrine_desc: "迦太基有数代人的错误需要纠正。最好是用罗马叛徒的血。"
 broken_hope_name: "破碎希望"
 broken_hope_doctrine_name: "失落的乌托邦"
 broken_hope_doctrine_desc: "新迦太基只是一个没有灵魂的政治工具。真正的普罗米修斯派精神已经被这场新的失败压垮了。"
 secure_anda_name: "保护[Glossary('安答','podgloss.anda')]"
 secure_anda_doctrine_name: "治理帝国"
 secure_anda_doctrine_desc: "从熟练的好战者开始，[Glossary('安答','podgloss.anda')]也成为熟练的政治家，利用他们蒙古亲属的宗教宽容作为基础。"
 crimsom_curia_name: "绯红教廷"
 crimsom_curia_doctrine_name: "重建挪得教区"
 crimsom_curia_doctrine_desc: "第三该隐教会的恢复教会理事会正在处理日常事务……同时也呼吁在救主到来之前扩大教会的统治权。"
 militarized_experiments_name: "恐怖之坊"
 militarized_experiments_doctrine_name: "军事化实验"
 militarized_experiments_doctrine_desc: "扭曲的恐怖和令人憎恶的事物现在更经常被棘秘魑$pod_clan$用作突击部队。"
 warden_network_name: "看守网络"
 warden_network_doctrine_name: "遍布眼线"
 warden_network_doctrine_desc: "摩洛教团比以往任何时候都更加统一，确保任何看守都能在任何地方找到帮助。"
 knights_acre_name: "亚柯骑士"
 knights_acre_doctrine_name: "天主的待拔之剑"
 knights_acre_doctrine_desc: "勇敢的骑士们现在完全致力于裁判所的目的，准备对地狱衍体释放神圣之怒。"
 oculi_dei_name: "神目"
 oculi_dei_doctrine_name: "监察之眼"
 oculi_dei_doctrine_desc: "神目已经控制了其多疑的成员，使其成为对抗邪恶的强大资产。"
 sisters_stjohn_name: "圣约翰修女会"
 sisters_stjohn_doctrine_name: "天主关照"
 sisters_stjohn_doctrine_desc: "修女会是裁判所的核心，是支撑它穿过蠕动的黑暗的磐石。"
 red_order_name: "红修会"
 red_order_doctrine_name: "小心的守护者"
 red_order_doctrine_desc: "红修会是裁判所的守秘人。他们只有在极其谨慎的情况下才会公开自己的知识。"
 von_murnau_name: "冯·穆尔瑙家族"
 von_murnau_doctrine_name: "天主的猎犬"
 von_murnau_doctrine_desc: "该德意志家庭全身心地投入到裁判所的功业中，并带来了相当多的资源。"
 great_awakening_name: "大觉醒"
 great_awakening_doctrine_name: "大觉醒"
 great_awakening_doctrine_desc: "长久以来，卡洛梅娜的弃民一直在挣扎着大众揭示真相，但他们不再挣扎了。无论他们在哪里传教，人们都听从的并追随他们。"
 champions_gaia_name: "盖亚选民"
 champions_gaia_doctrine_name: "盖亚选民"
 champions_gaia_doctrine_desc: "盖亚理所当然地为她最勇敢的捍卫者感到骄傲。狼族在其的旗帜下团结一致，终于将世界从怒嚎末日中拯救出来。"
 under_wufeng_cause_name: "以巫凤之名"
 under_wufeng_cause_doctrine_name: "以巫凤之名"
 under_wufeng_cause_doctrine_desc: "和平带来希望，希望带来治愈，治愈带来生命。万事皆成，阎魔必败。"
 special_doctrine_is_wufeng_faith_name: "巫凤"
 special_doctrine_is_wufeng_faith_desc: "和平带来希望，希望带来治愈，治愈带来生命。万事皆成，阎魔必败。"
 doctrine_parameter_hostility_override_special_doctrine_is_wufeng_faith: "有[GetFaithDoctrine('under_wufeng_cause_doctrine').GetBaseName][doctrine|E]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 hostility_override_under_wufeng_cause_doctrine: "遵从巫凤的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 hunter_schism_mended_name: "大分裂已弥合"
 special_doctrine_hunter_schism_mended_name: "大分裂已弥合"
 special_doctrine_hunter_schism_mended_desc: "暗影裁判所已在我们的掌控之下。"
 doctrine_parameter_access_to_holy_arts: "允许点选神术技能"
 theurgist_ordination_name: "神通术师授任"
 special_doctrine_theurgist_ordination_name: "神通术师授任"
 special_doctrine_theurgist_ordination_desc: "神通术现已成为我们对学徒教授的核心内容。"
 doctrine_parameter_theurgist_ordination: "门徒将在圣职授任时获得[GetTrait('theurgist').GetName( GetPlayer )][trait|E]。"
 sorcerer_ordination_name: "术士授任"
 special_doctrine_sorcerer_ordination_name: "术士授任"
 special_doctrine_sorcerer_ordination_desc: "术法现已成为我们对学徒教授的核心内容。"
 doctrine_parameter_sorcerer_ordination: "门徒将在圣职授任时获得[GetTrait('sorcerer').GetName( GetPlayer )][trait|E]。"
 revelations_piyau_name: "披耶·帕永的教义"
 revelations_piyau_hunger_doctrine_name: "饥渴的教义"
 revelations_piyau_hunger_doctrine_desc: "#italic “当你饥饿时，就吃。如果没有食物，就从比你弱小的人那里夺取食物，或者从强大却愚蠢的人那里偷窃。如果你不能吃，那就挨饿。”#!"
 revelations_piyau_sex_doctrine_name: "性爱的教义"
 revelations_piyau_sex_doctrine_desc: "#italic “当你性欲旺盛时，就去性交。如果找不到情愿的伴侣，就夺取你想要的，或者使用夺取行为的更好包装的姐妹——诱惑。\n繁衍后代，因为孩子是父母的力量，即使父母不复存在，他们也会延续父母的血脉和使命。如果你不能成功繁衍后代，那就孤独地死去，不为人所铭记。”#!"
 revelations_piyau_glory_doctrine_name: "荣耀的教义"
 revelations_piyau_glory_doctrine_desc: "#italic 荣耀自己，享受你所能享受的一切，因为苦难、冲突和麻烦将是你永生的常伴。即使在我们这样漫长的存在中，你也不会找到很多享受自己的机会。”#!"
 psychic_shunned_name: "Psychics Shunned"
 special_doctrine_psychic_shunned_name: "Psychics Shunned"
 special_doctrine_psychic_shunned_desc: "People born with psychic abilities are distrusted by this faction. It might be a gift from God... but also a mark from the Devil."