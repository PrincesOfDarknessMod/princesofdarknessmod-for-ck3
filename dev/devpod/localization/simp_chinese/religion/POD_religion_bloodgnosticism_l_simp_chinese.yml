 viapura: "纯净之道"
 viapura_adj: "纯洁派"
 viapura_adherent: "纯洁派"
 viapura_adherent_plural: "纯洁派"
 viapura_desc: "在一个抵抗神官权威的时代，他们选择诺斯替二元论作为达成他们目标的最佳武器。狂热者从新柏拉图主义、伪经和其他模糊的来源中取材，几乎用愤世嫉俗的算计来建立宗教。他们称自己为纯洁派，并以精神导师的身份，而不是赞助人的身份来支持凡人的“清洁派”（同一词，只不过一个译自拉丁语一个译自法语）。"
 holy_order_the_pure: "纯洁者"
 calomenaschosen: "卡洛梅娜的选民"
 calomenaschosen_adj: "卡洛梅娜的选民"
 calomenaschosen_adherent: "选民"
 calomenaschosen_adherent_plural: "选民"
 calomenaschosen_desc: "由劣族斯坦尼斯拉夫创立。建立在西巴尔干，似乎松散地从鲍格米勒异端中衍生而出。选民相信该隐是魔鬼的子嗣，他的子嗣是大地上最邪恶的显现。卡洛梅娜，该隐的孪生姐妹，被认为将会归来摧毁邪恶的$pod_cainites$，为天主的荣耀圣灵净化世界。无氏族者是被她选择的工具。他们组织由吸血鬼领导，成员包括血仆和凡人的圈子。1204年，斯坦尼斯拉夫在米迦勒的幻梦和苦难十字军结束时殉道，但他的密教徒却蹒跚着向火焚末日进发。"
