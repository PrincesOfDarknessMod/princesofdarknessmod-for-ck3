 redtemptation: "赤红诱惑"
 redtemptation_adj: "赤红诱惑"
 redtemptation_adherent: "赤红该隐之子"
 redtemptation_adherent_plural: "赤红该隐之子"
 redtemptation_desc: "该信仰宣扬基督为第二该隐，其现世已经标志着一场反对物质世界的魔鬼造物主伊达波思的大起义的开始。所有的书面规则都将被废除，追随者们要尽可能地初拥，并尽可能地在许可范围内放纵自己。"
 thirdcaine: "第三该隐普世教区"
 thirdcaine_adj: "第三该隐普世教区"
 thirdcaine_adherent: "第三该隐之子"
 thirdcaine_adherent_plural: "第三该隐之子"
 thirdcaine_desc: "赞助者设定的非原作官设宗教。\n由牧首维·伊梅亚·西诺德的亚力山大建立的这一血诺斯替教派有着许多凡人的东方东正教的特征。"
 thirdcaine_religious_head_title: "牧首"
 thirdcaine_religious_head_title_name: "牧首"
 apostlesthirdcaine: "第三该隐的使徒"
 apostlesthirdcaine_adj: "第三该隐的使徒"
 apostlesthirdcaine_adherent: "使徒"
 apostlesthirdcaine_adherent_plural: "使徒"
 apostlesthirdcaine_desc: "使徒是公元1000年左右从挪得教区中脱离出来的该隐异端的一个分支。\n他们是一支信仰内的改革运动，相信他们简单而朴素的方式将揭示第三该隐，他们相信第三该隐是一位等待被初拥的凡人。"
 bloodgnosticism_religious_head_title_name: "信仰典范"
 sanctamater: "天主圣母"
 sanctamater_adj: "天主圣母"
 sanctamater_adherent: "天主圣母"
 sanctamater_adherent_plural: "天主圣母"
 sanctamater_desc: "天主圣母与诺斯替主义同根同源，强调玛利亚的神性，认为她是索菲亚（智慧）的持有者。\n通过崇拜天主之母，人们可以希望从这个虚假的世界和它腐朽的看守者——罗马教会中升华。"
