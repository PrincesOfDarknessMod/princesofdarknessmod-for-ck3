 eschatologists_adj: "末世论"
 eschatologists_adherent: "末世论者"
 eschatologists_adherent_plural: "末世论者"
 eschatologists_desc: "掘墓人$pod_clan$的一个虔诚相信该隐异端的派别，尽管它比主教派更强调基督论。末世论学者相信他们是该隐和基督的后代，将他们的$pod_vitae$献给凡人本身就是一种圣礼。末世论者在欧洲的乡间小路旅行，举行大规模的“复活”活动，该活动以血与$pod_discipline$造成的惊人神迹为特色。最大的集会发生在12月17日，圣拉撒路日。"
