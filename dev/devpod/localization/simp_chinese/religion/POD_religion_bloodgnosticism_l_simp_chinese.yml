 blackmagdalene: "黑抹大拉教会"
 blackmagdalene_adj: "黑抹大拉"
 blackmagdalene_adherent: "黑抹大拉"
 blackmagdalene_adherent_plural: "黑抹大拉"
 blackmagdalene_desc: "他们从马赛的基地除非穿越欧洲去引诱和腐化虔信者。他们使用跟该隐异端同样的教义，包括血圣餐。他们把抹大拉的圣玛利亚与伊西斯和诺斯替的索菲娅等同起来。抹大拉修道院经常是“圣妓”之地，让人想起古代的黎凡特人的生育崇拜——它们隐藏着痛苦的、浸染鲜血的阉割仪式，以及从最黑暗的神秘中产生的食人行为。任何一个好色的牧师都知道他最可怕的想法可以在哪里得到满足。由于密教的放纵，普通民众已经开始将抹大拉的圣玛利亚与不知名的“淫妇”联系起来。在7月22日的抹大拉节上，极度色情的“激情戏”在抹大拉教徒身上上演，遭到了法兰西各地牧师的强烈抵制。赛特信徒故意派他们最鲁莽和最不狡猾的成员从抹大拉教派开始入门。"
