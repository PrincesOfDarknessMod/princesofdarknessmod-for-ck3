 viacain: "该隐异端"
 viacain_adj: "该隐异端"
 viacain_adherent: "该隐派"
 viacain_adherent_plural: "该隐派"
 viacain_desc: "该隐异端是一种异端信仰，主要由该隐之子的基督教信徒组成，几乎全部不完全都是勒森魃吸血鬼。它深受诺斯替主义的影响，并雇佣有一群人类牧师和圣职人员。从历史上看，该异端起源于各种各样的血祭，在这些血祭中，吸血鬼被当作神来崇拜。吸血鬼，由于他们不腐的身体，相对于物质世界独立性和他们的[Glossary('血律','game_concept_discipline_desc')]给予的力量，被一些诺斯替派认为是有更高灵性的生物，并寻求其教导以换取$pod_vitae$。"
