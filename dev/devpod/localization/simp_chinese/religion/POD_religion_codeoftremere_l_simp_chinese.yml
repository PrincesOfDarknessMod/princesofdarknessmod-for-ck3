 tremerecode_adj: "睿魔尔法典"
 tremerecode_adherent: "巫士"
 tremerecode_adherent_plural: "巫士"
 tremerecode_desc: "睿魔尔法典标志着该$pod_clan$在$pod_cainites$中是独一无二的；没有其他团体遵循一套统一的规则来描述可接受的行为。除非某位严厉的统治者主动决定强制执行，否则任何令人信服的魔法都无法让人坚守誓言；相反，该法典实际上列出了对庄严的睿魔尔族而言，什么行为可以被视为可接受的行为。法典详细说明了对睿魔尔的期望，以及哪些行为会受到厌恶。"
