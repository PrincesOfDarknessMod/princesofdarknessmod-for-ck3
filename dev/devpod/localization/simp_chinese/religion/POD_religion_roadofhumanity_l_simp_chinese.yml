 viahumanitatis: "人性之道"
 viahumanitatis_adj: "人性之道"
 viahumanitatis_adherent: "浪子"
 viahumanitatis_adherent_plural: "浪子"
 viahumanitatis_desc: "人性之道的信徒以坚持人性来对抗他们的心兽，他们不曾忘记自己在被该隐的诅咒玷污之前曾是人类的事实。他们强调自由，善良等人类的美德，认为理性与智慧是区分人与兽的方式。"
 viaanima: "生息之道"
 viaanima_adj: "生息之道"
 viaanima_adherent: "受启示者"
 viaanima_adherent_plural: "受启示者"
 viaanima_desc: "生息之道通常被称为呼吸之道。受启示者试图在凡人中寻找意义和目的，共享他们的负担和日常生活。通过这样做，他们希望不再是自己心中的怪物，从而拦住心兽。许多走这条心路的纯粹是出于本能，从来没有多想过这个问题。"
 viacommunitas: "社群之道"
 viacommunitas_adj: "社群之道"
 viacommunitas_adherent: "文明者"
 viacommunitas_adherent_plural: "文明者"
 viacommunitas_desc: "通常称为社群之道。文明者更关注整个社会，而不是个人。他们很少努力提升自己，即使他们这么做了，通常也是为了整个社会的利益。"
 vialuminis: "光辉之道"
 vialuminis_adj: "光辉之道"
 vialuminis_adherent: "受光辉者"
 vialuminis_adherent_plural: "受光辉者"
 vialuminis_desc: "通常称为光辉之道。那些追随光辉之道是在寻求通往[golconda|E]的苦涩之路，从而将物质世界抛在身后。光辉之道的追随者是一群孤独的人，这并不一定是出于选择，而是因为社会排斥他们。对萨洛比（以及对[golconda|E]本身）的诋毁也让虔诚的吸血鬼对这条心路产生了怀疑。"
 viavireo: "活力之道"
 viavireo_adj: "活力之道"
 viavireo_adherent: "浪客"
 viavireo_adherent_plural: "浪客"
 viavireo_desc: "通常被称为活力之道。那些走活力之道不仅献身于人性的理想，而且献身于人性的本质。浪客被人类的创新、视野的拓展和继续前进的趋势所吸引。活力之路是一条强有力的、充满活力的道路，它强调运动和行动先于沉思和静止。"
 eternalsenate: "永恒元老院"
 eternalsenate_adj: "永恒元老院"
 eternalsenate_adherent: "元老"
 eternalsenate_adherent_plural: "元老"
 eternalsenate_desc: "“永恒元老院”是仿照罗马元老院（尽管规模小得多）由$pod_cainites$组成的议会，负责管理、立法和管理血族。罗马的梵卓像人类一样组织自己成为一个共和国：梵卓永恒元老院。在元老院，无论年龄、性别，每个议员都有言论和投票权。"
 holy_order_order_of_prodigals: "浪子骑士团"
 holy_order_order_of_anima: "生息骑士团"
 holy_order_order_of_commumnitas: "社群战团"
 holy_order_order_of_illuminated: "光辉骑士团"
 holy_order_order_of_rovers: "战争浪客"
 holy_order_legio_mortuum: "亡者军团"
 holy_order_phalanx_of_entelechia: "智慧方阵"
 holy_order_phalanx_of_heracleitus: "纹章方阵"
 holy_order_phalanx_of_praedicanda: "史诗方阵"
 inconnu: "遁世会"
 inconnu_adj: "遁世会"
 inconnu_adherent: "遁世会"
 inconnu_adherent_plural: "遁世会"
 inconnu_desc: "遁世会是一个极其神秘的吸血鬼教派。几乎没有什么关于它们的了解是确切的，但是一些最流行的理论声称该组织是一个玛土撒拉的联盟，由从在千年圣战期间所遗忘的追求[golconda|E]的古人组成，用于在幕后操纵秘盟和魔宴，又或是一个用于信奉[Glossary('上古耆宿','game_concept_antediluvian_desc')]的密教。甚至该教派的年龄也存在争议，有些人认为它可以追溯到罗马时代。"
 amaranthans: "不凋花派"
 amaranthans_adj: "不凋花派"
 amaranthans_adherent: "不凋花派"
 amaranthans_adherent_plural: "不凋花派"
 amaranthans_desc: "一小群专门追捕[Glossary('吸榨者','game_concept_diablerie_desc')]的$pod_cainites$。他们使用第一位[Glossary('吸榨','game_concept_diablerie_desc')]的受害者的名字，作为对自己任务的承诺。"
 roadofhumanity_religious_head_title_name: "信仰典范"
 childofosiris: "奥西里斯之子"
 childofosiris_adj: "奥西里斯之子"
 childofosiris_adherent: "奥西里斯之子"
 childofosiris_adherent_plural: "奥西里斯之子"
 childofosiris_desc: "奥西里斯之子相信埃及的民间传说，认为他们的职务是神圣的，以奥西里斯的“光”对抗赛特之子的“暗”。\n在早期对抗赛特的战争中，他们已近被摧毁，现只知道生活在隐居和躲藏之中，希望奥西里斯能回归再次领导他们。"
