 saurian_religion: "@mokole_icon!蜥蜴人"
 saurian_religion_adj: "蜥蜴人"
 saurian_religion_adherent: "蜥蜴人"
 saurian_religion_adherent_plural: "蜥蜴族裔"
 saurian_religion_desc: "魔克拉是蜥蜴人、鳄鱼人、蜥蜴族裔以及龙人。他们是史前蜥蜴王的后裔，是$glossary_fera$的长子，亦是赫利俄斯的眷族。他们的职责是作为盖亚的记忆承载者，这一使命通过他们特有的龙梦之力完成。凭借龙梦回溯，一名魔克拉可以追溯数千乃至数百万年前的过往，并深入探寻其祖先的记忆。"
 children_sobek: "索贝克之子"
 children_sobek_adj: "索贝克"
 children_sobek_adherent: "教世者"
 children_sobek_adherent_plural: "教世者"
 children_sobek_desc: "在众神行于古埃及时期，尼罗河魔克拉的酋长索贝克曾与奥西里斯联盟并肩对抗赛特及其邪恶的蛇裔。然而，尽管双方合力，奥西里斯联盟仍遭败绩。赛特以其污秽的血祭仪式腐化了索贝克，将他转变为史上首个亦是唯一的魔克拉恶煞。\n被腐化的索贝克自此长眠于古鳄鱼城地下的隐秘神庙中，其神性之怒受困未发。他的追随者未曾遗忘他，并致力于将他从赛特信徒的腐蚀中解救出来。倘若鳄鱼之神能得拯救，重归玛特，其敌必将遭殃；若不能，则万物皆危。"
 warriors_entoban: "恩托班战士"
 warriors_entoban_adj: "恩托班"
 warriors_entoban_adherent: "战士"
 warriors_entoban_adherent_plural: "战士"
 warriors_entoban_desc: "恩托班，非洲的方舟大陆，人类的摇篮，也是是魔克拉最古老血脉的故乡。他们被称为龙人中的战士，在魂怒之战中饱受无休止的侵袭；他们对狼族的极度憎恨，不过是狼族自身暴行的倒影。如今他们已肩负起守护恩托班、保护此地残存$glossary_fera$的使命。狼族的罪行必将得到清算，而魔克拉永不遗忘。"
 cosmic_order: "宇宙秩序"
 cosmic_order_adj: "宇宙秩序"
 cosmic_order_adherent: "探寻者"
 cosmic_order_adherent_plural: "探寻者"
 cosmic_order_desc: "印度的魔克拉视太阳为其开悟之源，阿耆尼为其力量之本。他们信奉宇宙秩序，认为其先于地母存在，并将在地母消逝后长存。在地母之下，他们尊崇由创造者、维护者与毁灭者构成的三相神。这些独特的信仰受印度凡人宗教的影响，并已为魔克拉所融汇。\n万物皆有其旨归，他们在此探寻自身的宿命。"
