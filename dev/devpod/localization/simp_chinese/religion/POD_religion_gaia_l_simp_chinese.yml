 velvet_brood: "丝绒之裔"
 velvet_brood_adj: "丝绒"
 velvet_brood_adherent: "灵类"
 velvet_brood_adherent_plural: "诸灵"
 velvet_brood_desc: "精魂，至少那些有灵智的，是群居生灵。它们彼此互动、组织协作、筹谋计划。它们拥有友伴，或至少有所偏袒。它们结下仇怨、心怀芥蒂。每个精魂都是独特的个体，即便其本质与某些特定概念紧密相连。在影界，没有谁活在真空之中。"
 fera_outcasts_religion: "@werewolf_icon!流浪者"
 fera_outcasts_religion_adj: "放逐者"
 fera_outcasts_religion_adherent: "放逐者"
 fera_outcasts_religion_adherent_plural: "流浪者"
 fera_outcasts_religion_desc: "浪人由于这样或那样的原因，被狼国流放的狼人。\n大多数浪人经常违反律令的某一信条，与长者或他们的战群对立，有些人甚至选择这种生活，以逃避狼族严酷的等级社会，或者因为他们被哀号压倒。人狼不是孤独的生物。人、狼和狼人的每一种天性都要求与其他物种成员结成伙伴。因此，被放逐是一个狼族可能面临的最可怕的判决之一。"
 feline_religion: "@bastet_icon!猫子"
 feline_religion_adj: "猫子"
 feline_religion_adherent: "猫子"
 feline_religion_adherent_plural: "猫形族裔"
 feline_religion_desc: "芭丝特族裔是痴迷于秘识的化形猫人，终其一生追寻并囤积知识。它们中不乏强大的萨满或战士，但鲜少结群行动，常独来独往。芭丝特由露娜（它们称之为塞勒涅）创造。不同于被赋予明确使命的其他族裔，每个芭丝特部族都试图填补其他族裔未曾触及的空白领域。"
 ursine_religion: "@gurahl_icon!熊子"
 ursine_religion_adj: "熊子"
 ursine_religion_adherent: "熊子"
 ursine_religion_adherent_plural: "熊形族裔"
 ursine_religion_desc: "根据他们自己的编年史，古拉赫勒是盖亚最初的保护者，他们的诞生是为了抵御式样破坏者的破坏力。当此等力量超出他们的掌控时，他们向盖亚祈求援助，于是盖亚便创造了狼族。"
