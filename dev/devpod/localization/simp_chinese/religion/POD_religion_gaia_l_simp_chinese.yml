l_simp_chinese:
 gaia_religion: "@spirit_icon!盖亚"
 gaia_religion_adj: "盖亚"
 gaia_religion_adherent: "盖亚派"
 gaia_religion_adherent_plural: "盖亚派"
 gaia_religion_desc: "盖亚比天神更上一层，是已知得极强灵类之一——也许还是第一个和最强的。她被认为创造了狼族和大多数$glossary_fera$，作为她在物界和[spirit_worlds|E]的战士和使徒。"
 gaia_high_god_name: "盖亚"
 gaia_high_god_name_possessive: "盖亚"
 gaia_high_god_name_alternate: "$glossary_wyld$"
 gaia_high_god_name_alternate_possessive: "$glossary_wyld$的"
 gaia_devil_name: "$glossary_wyrm$"
 gaia_devil_name_possessive: "$glossary_wyrm$的"
 gaia_death_deity_name: "$glossary_wyrm$"
 gaia_house_of_worship: "圣地"
 gaia_house_of_worship_plural: "圣地"
 gaia_religious_symbol: "圣书字"
 gaia_religious_text: "传说"
 gaia_religious_head_title: "传承者"
 gaia_religious_head_title_name: "传承者"
 gaia_devotee_male: "传承者"
 gaia_devotee_male_plural: "传承者"
 gaia_devotee_female: "传承者"
 gaia_devotee_female_plural: "传承者"
