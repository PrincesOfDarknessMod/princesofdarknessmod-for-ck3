 dreaming_sands: "梦沙"
 dreaming_sands_adj: "梦界"
 dreaming_sands_adherent: "梦者"
 dreaming_sands_adherent_plural: "梦者"
 dreaming_sands_desc: "水与沙的双生之海，虽是对立的两极，却同为智慧的源泉。每一粒沙，每一滴水，都承载着先民的记忆。正是在梦境之中，这些记忆才变得清晰。\n大多数梦者一生大部分时光都在深漠中度过，但也定期前往世界各地的海洋朝圣。跟随歌径，可以让旅程变得轻松许多。"
 dragons_zhong_guo: "中华龙人"
 dragons_zhong_guo_adj: "中华"
 dragons_zhong_guo_adherent: "龙"
 dragons_zhong_guo_adherent_plural: "龙"
 dragons_zhong_guo_desc: "中龙，即东方之龙，乃化兽诸庭最古老的长者，是诸兽庭的智者、学者与武士。他们与玉母（盖亚）及太阳一同崇敬着他们的龙人老祖。\n\n如同摩迦罗一般，他们信奉平衡——统御整个宇宙的无上法则。[Glossary('奇原', 'glossary_wyld_tt')]、[Glossary('织者', 'glossary_weaver_tt')]、[Glossary('妖蛆', 'glossary_wyrm_tt')]三者之间的平衡，远比[Glossary('三相', 'glossary_triat_tt')]本身的正邪更为重要。"
 emerald_memory: "翡翠之忆"
 emerald_memory_adj: "翡翠"
 emerald_memory_adherent: "守护者"
 emerald_memory_adherent_plural: "守护者"
 emerald_memory_desc: "诸兽庭中除中龙外亦有许多其他种类的魔克拉。龙人在廷内地位尊崇；而摩羯罗与古马干则回归其血脉本旨，作为盖亚的记忆而存世。翡翠回忆保存并记录着诸兽庭与$glossary_fera$的历史，随纪元之轮不息转动。他们亦在庭内担任顾问，以期过往的失误不再重演——至少他们如此希冀。"
 eternal_breath: "永息"
 eternal_breath_adj: "永恒"
 eternal_breath_adherent: "永恒"
 eternal_breath_adherent_plural: "永恒者"
 eternal_breath_desc: "永息 的信徒们坚信，唯有魔克拉能存活到世界终结之时。非是#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L;bold 血魔#!#!，也非其他$glossary_fera$，尤其不会是那些 #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L;bold 狂妄的猿猴#!#!。诸兽庭终将失败，其他化兽族裔已证明他们永不会吸取往昔教训。唯有通过对自身形体与灵魂的精熟掌控，魔克拉才能超越所有人。他们已从一次怒嚎末日中幸存，也必将再次幸存。"
 dyn_a_drowyd_yn_flaidd: "Dyn a drowyd yn flaidd"
 dyn_a_drowyd_yn_flaidd_adj: "flaidd"
 dyn_a_drowyd_yn_flaidd_adherent: "Dyn"
 dyn_a_drowyd_yn_flaidd_adherent_plural: "Dyn"
 dyn_a_drowyd_yn_flaidd_desc: "These Welsh Fianna are very insular, secluding themselves in the hills and valleys of their territories and paying little attention to what transpires outside their boundaries. Other Fianna say the Dyn a drowyd yn flaidd mingle their blood with the faeries, giving them powers uncanny even among the Garou, but also leaving them touched with madness.\n\nLike their fierce Kinfolk, the Fianna of the mountainous north are tougher warriors than those of the lowlands, having proven their worth against both the Get of Fenris and the Normans."