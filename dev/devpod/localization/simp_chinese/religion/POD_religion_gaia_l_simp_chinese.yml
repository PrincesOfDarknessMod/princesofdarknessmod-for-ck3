 gaia_devotee_neuter_plural: "传承者"
 gaia_priest_male: "传承者"
 gaia_priest_male_plural: "传承者"
 gaia_priest_alternate_plural: "传承者"
 gaia_bishop: "传承者"
 gaia_bishop_plural: "传承者"
 gaia_positive_afterlife: "荒野"
 gaia_negative_afterlife: "螺旋"
 gaia_witchgodname_the_horned_god: "$glossary_wyrm_corruption$"
 gaia_creator_god_name: "$gaia_high_god_name$"
 gaia_creator_god_name_possessive: "$gaia_high_god_name_possessive$"
 gaia_health_god_name: "灵类"
 gaia_health_god_name_possessive: "灵类"
 gaia_fertility_god_name: "$gaia_high_god_name$"
 gaia_fertility_god_name_possessive: "$gaia_high_god_name_possessive$"
 gaia_wealth_god_name: "$gaia_high_god_name$"
 gaia_wealth_god_name_possessive: "$gaia_high_god_name_possessive$"
 gaia_household_god_name: "$gaia_health_god_name$"
 gaia_household_god_name_possessive: "$gaia_health_god_name_possessive$"
 gaia_fate_god_name: "$gaia_high_god_name$"
 gaia_fate_god_name_possessive: "$gaia_high_god_name_possessive$"
 gaia_knowledge_god_name: "$gaia_high_god_name$"
 gaia_knowledge_god_name_possessive: "$gaia_high_god_name_possessive$"
 gaia_war_god_name: "$gaia_high_god_name$"
 gaia_war_god_name_possessive: "$gaia_high_god_name_possessive$"
 gaia_trickster_god_name: "灵君"
 gaia_trickster_god_name_possessive: "灵君"
 gaia_night_god_name: "$gaia_high_god_name$"
 gaia_night_god_name_possessive: "$gaia_high_god_name_possessive$"
 gaia_water_god_name: "$gaia_health_god_name$"
 gaia_water_god_name_possessive: "$gaia_health_god_name_possessive$"
 blackfury: "黑怒"
 blackfury_adj: "黑怒"
 blackfury_adherent: "黑怒"
 blackfury_adherent_plural: "黑怒"
 blackfury_desc: "狼族的母权部族比其他大多数部族更接近$glossary_wyld$，并以其荣誉、智慧、骄傲和凶猛的战斗技巧而闻名。\n黑怒崇尚奇原，认为它是代表着本能的女性力量，区别于$glossary_weaver$的理智抽象（并被部族视为男性力量）。奇原是保持盖亚和露娜循环的力量，并对它们进行补全。"
 bonegnawer: "啮骨者"
 bonegnawer_adj: "啮骨者"
 bonegnawer_adherent: "啮骨者"
 bonegnawer_adherent_plural: "啮骨者"
 bonegnawer_desc: "啮骨者是狼族的清道夫和求生者，在其他部族看来，他们不过是在人类的废物中筛选出来的杂种。啮骨者视自己为弱者，等待着战胜过于自大的强敌。"
 childofgaia: "盖亚之子"
 childofgaia_adj: "盖亚之子"
 childofgaia_adherent: "盖亚之子"
 childofgaia_adherent_plural: "盖亚之子"
 childofgaia_desc: "盖亚之子是狼族的和平卫士，他们努力争取各部族之间的理解，并希望最终将所有部族组成一个统一战线来对抗$glossary_wyrm$。"
 fianna: "芬尼安"
 fianna_adj: "芬尼安"
 fianna_adherent: "芬尼安"
 fianna_adherent_plural: "芬尼安"
 fianna_desc: "强烈基于凯尔特和欧洲传统上，芬尼安在狼族中以其对生活乐趣的热情、战斗的技巧和勇猛而闻名，并也是狼族的音乐、故事和传说的传承者。"
 getoffenris: "芬里尔仔兽"
 getoffenris_adj: "芬里尔仔兽"
 getoffenris_adherent: "芬里尔仔兽"
 getoffenris_adherent_plural: "芬里尔仔兽"
 getoffenris_desc: "芬里尔仔兽是凶猛的战士，几乎不剩任何怜悯和同情，他们认为自己是伟大的英雄，但他们的粗暴也曾让其他狼族感到震惊。"
 warderofmen: "人类监护者"
 warderofmen_adj: "人类监护者"
 warderofmen_adherent: "人类监护者"
 warderofmen_adherent_plural: "人类监护者"
 warderofmen_desc: "沉浸在人类的宗教和城市的起伏中，人类监护者以进步之信条为生，也为进步之信条而死。虽然他们像其他狼人一样害怕怒嚎末日，但他们相信每一天的过去都会使他们变得更加强大，每一个新的发明都可能被用于他们的事业，每一个新的哲学都可能加强他们的决心。在这方面，他们是典型的城狼，不像大多数狼族那样对人类有强烈的厌恶。"
 redtalon: "赤爪"
 redtalon_adj: "赤爪"
 redtalon_adherent: "赤爪"
 redtalon_adherent_plural: "赤爪"
 redtalon_desc: "赤爪是狼族中唯一一个完全都是天生狼子的部族，他们完全回避人类，认为人类是地球上的污秽。赤爪称他们的部族是直接来自盖亚的，他们依是最纯粹的狼族，与他们的原始形态保持着联系，没有被受污染的人类所腐化。"
 shadowlord: "影爵"
 shadowlord_adj: "影爵"
 shadowlord_adherent: "影爵"
 shadowlord_adherent_plural: "影爵"
 shadowlord_desc: "影爵是狼族的政治家和操纵者，他们通过严格的等级制度和隐秘手段，尽可能多地夺取权力。"
 silentstrider: "寂静漫游者"
 silentstrider_adj: "寂静漫游者"
 silentstrider_adherent: "寂静漫游者"
 silentstrider_adherent_plural: "寂静漫游者"
 silentstrider_desc: "寂静漫游者起源于埃及，被强大的吸血鬼赛特诅咒流放，从此他们一直在逃亡。游牧、内省和高度灵性化，寂静漫游者已经深入到[umbra|E]的深处，也许比任何其他的狼族部族都更深入。"
 silverfang: "银牙"
 silverfang_adj: "银牙"
 silverfang_adherent: "银牙"
 silverfang_adherent_plural: "银牙"
 silverfang_desc: "银牙是狼国的“阿尔法部族”，是自古以来的统治者和战争领袖。这些高贵的狼族以其身体的美貌、勇气和荣誉而闻名。可悲的是，该部族的许多年轻成员患有奇怪的怪癖——心不在焉、轻微的幻觉、梦游症——没有明显的精神病，但还是很引人注目。"
 stargazer: "星占"
 stargazer_adj: "星占"
 stargazer_adherent: "星占"
 stargazer_adherent_plural: "星占"
 stargazer_desc: "天性孤独的星占是狼族中最平静和最内向的，也是其余部族中最小的。他们一直是狼国的外来者，他们声称自己是来自东方的圣人该塔勒·摘星的追随者的后代，其宣扬温和与和谐。"
 rf_gaia: "盖亚"
 rf_gaia_desc: "盖亚既是地球及其相关的界域，包括物质与灵类层面，也是一切生灵的母神。"
 blackfury_religion: "@werewolf_icon!黑怒"
 blackfury_religion_adj: "黑怒"
 blackfury_religion_adherent: "黑怒"
 blackfury_religion_adherent_plural: "黑怒"
 blackfury_religion_desc: "狼族的母权部族比其他大多数部族更接近$glossary_wyld$，并以其荣誉、智慧、骄傲和凶猛的战斗技巧而闻名。\n黑怒崇尚奇原，认为它是代表着本能的女性力量，区别于$glossary_weaver$的理智抽象（并被部族视为男性力量）。奇原是保持盖亚和露娜循环的力量，并对它们进行补全。"
 amazonsofdiana: "狄安娜的亚马逊"
 amazonsofdiana_adj: "狄安娜的亚马逊"
 amazonsofdiana_adherent: "亚马逊"
 amazonsofdiana_adherent_plural: "亚马逊"
 amazonsofdiana_desc: "一群更关心的是成为粗鲁且势不可挡的女战士而不是神圣复仇者的黑怒。该阵营很少被看作是正式的团体，它更多地是为那些更致力于正确地证明自己在与$glossary_wyrm$的战斗中与任何男人都平等的人而设的。阵营中的一些人认为有必要将黑怒带入新未来，摆脱她们无意义的、陈旧的追杀罪犯的做法，但那些仅仅憎恨所有男性的狼族也倾向于倾向于亚马逊。"
 avengingmother: "复仇之母"
 avengingmother_adj: "复仇之母"
 avengingmother_adherent: "复仇者"
 avengingmother_adherent_plural: "复仇者"
 avengingmother_desc: "黑怒的小分支利用着银牙的信任，监视银牙部族内部的弱点，希望能够推翻以父权制为主的部族对狼国权力基础的束缚。"
 bacchantes: "巴克斯的司祭"
 bacchantes_adj: "巴克斯的司祭"
 bacchantes_adherent: "巴克斯的司祭"
 bacchantes_adherent_plural: "巴克斯的司祭"
 bacchantes_desc: "一个保守的派别，追求黑怒最初的神圣目的——以狂热的热情和无情的暴力来消除对妇女和儿童的冤枉。她们认为，这样做是为了对抗$glossary_wyrm$对人类的控制，并为盖亚本人复仇。"
 freebooters: "暴客"
 freebooters_adj: "暴客"
 freebooters_adherent: "暴客"
 freebooters_adherent_plural: "暴客"
 freebooters_desc: "暴客的任务是寻找新的$glossary_wyld$之所，这些地方可以奉献给盖亚并转化为圣地。该社圈正在缩小，因为世界上的奇原之所越来越少了。一小部分暴客认为他们需要在[umbra|E]的其他地方为盖亚找到一个新的躯体，在那些$glossary_wyrm$尚未发现的地方。其余的成员仍然致力于在曾经建造圣地的地方或往昔的神圣之地中寻找隐藏的奇原之所，将它们重新奉献给母神。"
 moondaughter: "皎月之女"
 moondaughters_adj: "皎月之女"
 moondaughter_adherent: "皎月之女"
 moondaughter_adherent_plural: "皎月之女"
 moondaughter_desc: "寻求通过原始教传播盖亚信仰的密教组织。尽管坚持传统，但她们也促使通过改变自己来保持盖亚精神的活力，尽可能地体现$glossary_wyld$的力量。她们的仪式方法大多涉及古老的魔法，从一代传到另一代并加以修改。"
 orderofourmercifulmother: "慈母会"
 orderofourmercifulmother_adj: "慈母会"
 orderofourmercifulmother_adherent: "修女"
 orderofourmercifulmother_adherent_plural: "修女"
 orderofourmercifulmother_desc: "属于黑怒内部最被嘲笑的社圈。慈母会巧妙地使他人的教条更接近于尊重盖亚和妇女的版本，她们通过利用自己的工具来改革人类社会和基督教。她们为圣母玛利亚的普及立下了汗马功劳。"
 sisterhood: "姐妹会"
 sisterhood_adj: "姐妹会"
 sisterhood_adherent: "姐妹"
 sisterhood_adherent_plural: "姐妹"
 sisterhood_desc: "一个保护兽嫡、女性和狼族不受裁判所伤害，并将他们带到安全的地方的关系网。她们还管理着黑怒的各种兽嫡关系网，为他们提供帮助，并在兽嫡受到男人的伤害时通知其他部族成员。她们也善于收集资源供部族使用。"
 templeofartemis: "阿尔忒弥斯神殿"
 templeofartemis_adj: "阿尔忒弥斯神殿"
 templeofartemis_adherent: "阿尔忒弥斯的女祭司"
 templeofartemis_adherent_plural: "阿尔忒弥斯的女祭司"
 templeofartemis_desc: "最古老、也是最保守的社圈之一。他们建议退出狼国，并将黑怒重新赋予其作为妇女复仇者的最初目的。他们还充当对违反黑怒习俗者的判官。"
 bonegnawer_religion: "@werewolf_icon!啮骨者"
 bonegnawer_religion_adj: "啮骨者"
 bonegnawer_religion_adherent: "啮骨者"
 bonegnawer_religion_adherent_plural: "啮骨者"
 bonegnawer_religion_desc: "啮骨者是狼族的清道夫和求生者，在其他部族看来，他们不过是在人类的废物中筛选出来的杂种。啮骨者视自己为弱者，等待着战胜过于自大的强敌。"
 thehood: "绿林好汉"
 thehood_adj: "绿林好汉"
 thehood_adherent: "绿林好汉"
 thehood_adherent_plural: "绿林好汉"
 thehood_desc: "该阵营致力于将富人的财富分配给穷人，只要他们分发的钱被用于实在的东西。绿林好汉在这个时代开始形成（并存在于舍伍德森林的范围之外）。许多理想主义的年轻啮骨者正在加入绿林好汉的行列，对有组织的财富再分配的概念感到好奇。作为侠盗和怪盗的王，他们找到了一种新的方式，从那些拥有财富的人手中夺取食物，并将其放入饥饿的人的口中。"
 ratfinks: "城狐社鼠"
 ratfinks_adj: "城狐社鼠"
 ratfinks_adherent: "城狐社鼠"
 ratfinks_adherent_plural: "城狐社鼠"
 ratfinks_desc: "社鼠们交易信息。他们直接或通过他们的兽嫡收集秘密，他们经常担任从事低端工作，但这恰好能让他们获得高端信息。其他超自然生物有时也会与阵营互动：诺斯费拉图吸血鬼、鼠人间谍，甚至鸦人信使。"
 childrenoffamine: "饥荒之子"
 childrenoffamine_adj: "饥荒之子"
 childrenoffamine_adherent: "饥荒之子"
 childrenoffamine_adherent_plural: "饥荒之子"
 childrenoffamine_desc: "饥饿很可能是中世纪穷人的生活琐事之——但饥荒之子竭尽全力缓解这一问题。众所周知，他们在歉收的时候会从皇室的土地或从修道院的粮仓里偷取粮食。盖亚从来没有想过让她的孩子们挨饿——而饥荒的发生，一定是由于$glossary_wyrm$。如果土地上出现了干旱或瘟疫，饥荒之子常会去找人负责。"
 childofgaia_religion: "@werewolf_icon!盖亚之子"
 childofgaia_religion_adj: "盖亚之子"
 childofgaia_religion_adherent: "盖亚之子"
 childofgaia_religion_adherent_plural: "盖亚之子"
 childofgaia_religion_desc: "盖亚之子是狼族的和平卫士，他们努力争取各部族之间的理解，并希望最终将所有部族组成一个统一战线来对抗$glossary_wyrm$。"
 servantsoftheunicorn: "独角兽之侍"
 servantsoftheunicorn_adj: "独角兽之侍"
 servantsoftheunicorn_adherent: "独角兽之侍"
 servantsoftheunicorn_adherent_plural: "独角兽之侍"
 servantsoftheunicorn_desc: "盖亚之子最庞大、最强大的阵营，实际上根本不是个阵营。独角兽之侍代表着部族的理想，大多数盖亚之子都认为自己是仆人。积极寻找争端进行调解的最敬业的仆人们。此外，仆人们还传播部族团结的思想，宣传所有狼族都是盖亚之子的概念。"
 crestofthehorn: "号角之冠"
 crestofthehorn_adj: "号角之冠"
 crestofthehorn_adherent: "号角之冠"
 crestofthehorn_adherent_plural: "号角之冠"
 crestofthehorn_desc: "作为独角兽之侍的一个小分支，号角之冠主要关注基督教会的争端，其最激进的成员往往是反对教会影响的人。"
 anointedones: "受膏者"
 anointedones_adj: "受膏者"
 anointedones_adherent: "受膏者"
 anointedones_adherent_plural: "受膏者"
 anointedones_desc: "盖亚之子是狼族的和平卫士，他们努力争取各部族之间的理解，并希望最终将所有部族组成一个统一的阵线来对抗$glossary_wyrm$。该阵营已经放弃了所有形式的暴力。他们不会举手攻击其他生物，并不断寻找新的方法使自己摆脱魂怒，以保持这种自控。受膏者在这个时代挣扎求生，但他们依旧存在。"
 onetree: "独木"
 onetree_adj: "独木"
 onetree_adherent: "树子"
 onetree_adherent_plural: "树子"
 onetree_desc: "他们是杀手——既是前线战士，也是隐秘刺客。也就是说，他们不会出于愤怒、激情、仇恨、恶意或骄傲而杀人，并且他们不接受出于这些动机而寻求加入阵营的成员。他们杀人是因为这是盖亚让他们做的事情；他们就是盖亚攻击敌人的渠道。"
 angelsofgaia: "盖亚天使"
 angelsofgaia_adj: "盖亚天使"
 angelsofgaia_adherent: "天使"
 angelsofgaia_adherent_plural: "天使"
 angelsofgaia_desc: "该盖亚之子阵营保护、捍卫和拯救人类儿童，使其免受$glossary_wyrm_corruption$的伤害。他们特别照顾那些家庭因战争或疾病而死亡的儿童，以及那些被父母遗弃的儿童。"
 aetherainamorata: "唯美恋人"
 aetherainamorata_adj: "唯美恋人"
 aetherainamorata_adherent: "恋人"
 aetherainamorata_adherent_plural: "恋人"
 aetherainamorata_desc: "一个时有争议的阵营，致力于通过性和肉体的爱来治愈狼人，他们相信狼族和狼族交配不会违反律令（并且实际上是实现团结的宝贵方式），只要他们不生孩子。他们监测兽嫡的怀孕情况，以帮助家庭为可能生下的狼族幼崽做好准备，并促进不同部族兽嫡之间的通婚，以建立团结和部族间的信任。"
 fianna_religion: "@werewolf_icon!芬尼安"
 fianna_religion_adj: "芬尼安"
 fianna_religion_adherent: "芬尼安"
 fianna_religion_adherent_plural: "芬尼安"
 fianna_religion_desc: "强烈基于凯尔特和欧洲传统上，芬尼安在狼族中以其对生活乐趣的热情、战斗的技巧和勇猛而闻名，并也是狼族的音乐、故事和传说的传承者。"
 brotherhoodofherne: "赫恩兄弟会"
 brotherhoodofherne_adj: "赫恩兄弟会"
 brotherhoodofherne_adherent: "赫恩兄弟"
 brotherhoodofherne_adherent_plural: "赫恩兄弟"
 brotherhoodofherne_desc: "这是一个主要由满月狼组成的阵营，其中夹杂着一些其他的月兆。他们最初是在与新成立的黑螺旋舞者的战斗最激烈时分享资源的一种手段。每个族群的数个满月狼会通过月桥进入陷入困境的圣地并进行救援，可以说是。赫恩兄弟会很好地适应了人类的纹章学和骑士精神的概念。然而，他们被他们的芬尼安族人看得很轻。"
 childrenofdire: "恐兽之子"
 childrenofdire_adj: "恐兽之子"
 childrenofdire_adherent: "恐狼"
 childrenofdire_adherent_plural: "恐狼"
 childrenofdire_desc: "该阵营主要由狼子组成，通过对$glossary_wyrm$的影响来观察$glossary_wyld$力量的发散。通过注意捕食者和猎物的流动变化以及奇原地区植物的生长或减少，他们可以在妖蛆的影响变得强大之前发现它。阵营本身经常被外人怀疑，因为他们很少在单个圣地里呆很长时间。"
 grancdhildrenoffionn: "芬恩子孙"
 grancdhildrenoffionn_adj: "芬恩子孙"
 grancdhildrenoffionn_adherent: "子孙"
 grancdhildrenoffionn_adherent_plural: "子孙"
 grancdhildrenoffionn_desc: "许多年轻的芬尼安将芬恩子孙——致力于他们祖先芬恩·麦克库尔的战斗理想——视为向部族和狼国的其他成员证明自己的绝佳机会。他们认为自己是牡鹿选择的英雄，并以其勇敢而闻名，旅行到最好的战斗所在的任何地方。"
 mothersfundamentalists: "地母的原教旨主义者"
 mothersfundamentalists_adj: "地母的原教旨主义者"
 mothersfundamentalists_adherent: "原教旨主义者"
 mothersfundamentalists_adherent_plural: "原教旨主义者"
 mothersfundamentalists_desc: "该阵营的芬尼安希望恢复刀耕之治——史前时期狼族对人类的捕杀。他们指责人类的无节制蔓延是$glossary_weaver$和$glossary_wyrm$的疯狂以及盖亚的缓慢死亡。"
 songkeepers: "颂者"
 songkeepers_adj: "颂者"
 songkeepers_adherent: "颂者"
 songkeepers_adherent_plural: "颂者"
 songkeepers_desc: "颂者有权宣称自己是最古老的遗珍，只有芬恩子孙才有可能质疑这一说法。当人们谈到芬尼安的时候，这些人是每个人最先想到的；他们是叙事大师，说书人，以及致力于保持口述历史的人。该阵营不仅仅只有凸月狼。眉月狼寻求并学习仪式，确保在怒嚎末日临近时不会失传，而半月狼则保存着过去审判的古老智慧。重要的是学习能力并与所有狼族分享这些知识，而不仅仅是是位芬尼安，这就是为什么该阵营在其他部族如此有名的原因。"
 tuathadefionn: "芬恩神族"
 tuathadefionn_adj: "芬恩神族"
 tuathadefionn_adherent: "神族"
 tuathadefionn_adherent_plural: "神族"
 tuathadefionn_desc: "虽然外人可能将所有芬尼安与妖精联系起来，但芬恩神族是最有可能与他们打交道的阵营。新的芬恩神族是由现有成员招募的，他们在他们身上找到了一些东西——妖精血统或疯狂——他们相信这将使新招募的人能够以平等的方式与妖精打交道。经过长时间的指导，他们被带去见妖精，希望能成为芬恩神族的正式成员。芬恩神族不仅代表狼国与妖精交涉，而且从他们那里了解到许多共同的敌人——虽然不一定是妖蛆衍体——可能会干扰狼国。"
 whisperingrovers: "耳语浪客"
 whisperingrovers_adj: "耳语浪客"
 whisperingrovers_adherent: "浪客"
 whisperingrovers_adherent_plural: "浪客"
 whisperingrovers_desc: "这些芬尼安没有自己的土地，并与他们的亲属一起环游世界，在很大程度上相互依赖以求生存。与大多数热爱壁炉和家园的芬尼安不同，这些狼人永远在旅行，从不长时间呆在一个地方。他们充当部族的眼睛和耳朵，每个团伙的头狼都会向部族的头狼报告他们在旅行中发现的任何可能会给芬尼安或整个狼国带来麻烦的事情。由于他们的游牧性质，当其他芬尼安甚至其他部族需要某个地方的信息时，就会去寻找浪客。"
 getoffenris_religion: "@werewolf_icon!芬里尔仔兽"
 getoffenris_religion_adj: "芬里尔仔兽"
 getoffenris_religion_adherent: "芬里尔仔兽"
 getoffenris_religion_adherent_plural: "芬里尔仔兽"
 getoffenris_religion_desc: "芬里尔仔兽是凶猛的战士，几乎不剩任何怜悯和同情，他们认为自己是伟大的英雄，但他们的粗暴也曾让其他狼族感到震惊。"
 valkyriaoffreya: "芙蕾雅的女武神"
 valkyriaoffreya_adj: "芙蕾雅的女武神"
 valkyriaoffreya_adherent: "女武神"
 valkyriaoffreya_adherent_plural: "女武神"
 valkyriaoffreya_desc: "芙蕾雅的女武神为女性在部族中的平等地位而战。虽然大多数芬里尔仔兽蔑视这个阵营，认为它让女性成长为只会无休止地抱怨而不是夺取属于她们的权利的软弱者，但芙蕾雅的女武神自己认为，她们对于打破人类对女性在社会中的身份的许多成见非常重要。她们经常与黑怒的人发生冲突（有时是暴力冲突）。"
 handoftyr: "提尔之手"
 handoftyr_adj: "提尔之手"
 handoftyr_adherent: "手"
 handoftyr_adherent_plural: "手"
 handoftyr_desc: "提尔之手是芬里尔仔兽的一部分，将其主要目光转向对抗$glossary_wyrm$$对人类腐化的可怕结果：强奸犯、恋童癖、恐怖分子和暴力罪犯。"
 fangsofgarm: "加姆之牙"
 fangsofgarm_adj: "加姆之牙"
 fangsofgarm_adherent: "牙"
 fangsofgarm_adherent_plural: "牙"
 fangsofgarm_desc: "加姆之牙试图让芬里尔仔兽更好地融入狼国，并寻求修补与其他部族之间的桥梁，以便在怒嚎末日之时，他们能够站在一起。"
 mjlolnirsthunder: "妙尔尼尔之雷"
 mjlolnirsthunder_adj: "妙尔尼尔之雷"
 mjlolnirsthunder_adherent: "奉行者"
 mjlolnirsthunder_adherent_plural: "奉行者"
 mjlolnirsthunder_desc: "这个古老的阵营由那些已经失去（或切断）与周围世界所有联系并专门致力于摧毁$glossary_wyrm$的狼人组成。他们不关心其他任何事情：不关心人类或狼、诸灵、迷障，甚至整个狼族社会。他们是其他部族有时将所有芬里斯想象成的怪物，用他们所有的同情共感和常识来交换他们对妖蛆灭亡的一心一意的、反社会的奉献精神。"
 gloriousfistofwotan: "沃坦的光辉之拳"
 gloriousfistofwotan_adj: "沃坦的光辉之拳"
 gloriousfistofwotan_adherent: "拳"
 gloriousfistofwotan_adherent_plural: "拳"
 gloriousfistofwotan_desc: "沃坦的光辉之拳认为，只有铲除人类才能拯救盖亚。人类已经成为$glossary_wyrm$的最大污染载体，所以为了遏制祂，必须杀死他们。"
 lokissmile: "洛基之讽"
 lokissmile_adj: "洛基之讽"
 lokissmile_adherent: "讽者"
 lokissmile_adherent_plural: "讽者"
 lokissmile_desc: "据说洛基之讽在影中控制着部族，其成员通过风暴之灵进行交流，并对部族的其他成员进行隐藏。"
 warderofmen_religion: "@werewolf_icon!人类监护者"
 warderofmen_religion_adj: "人类监护者"
 warderofmen_religion_adherent: "人类监护者"
 warderofmen_religion_adherent_plural: "人类监护者"
 warderofmen_religion_desc: "沉浸在人类的宗教和城市的起伏中，人类监护者以进步之信条为生，也为进步之信条而死。虽然他们像其他狼人一样害怕怒嚎末日，但他们相信每一天的过去都会使他们变得更加强大，每一个新的发明都可能被用于他们的事业，每一个新的哲学都可能加强他们的决心。在这方面，他们是典型的城狼，不像大多数狼族那样对人类有强烈的厌恶。"
 bellowsandcrucible: "风箱与坩埚"
 bellowsandcrucible_adj: "风箱与坩埚"
 bellowsandcrucible_adherent: "防火者"
 bellowsandcrucible_adherent_plural: "防火者"
 bellowsandcrucible_desc: "防火者主要由眉月狼和半月狼组成，他们都精通元素知识。他们尽力引导人类炼金术士走向觉醒，希望能让他们的受监护人睁开眼睛，看到外面的灵界的光辉。"
 brethrenofthebook: "书之教友"
 brethrenofthebook_adj: "书之教友"
 brethrenofthebook_adherent: "教友"
 brethrenofthebook_adherent_plural: "教友"
 brethrenofthebook_desc: "这些人类监护者拥护他们认为的人类最伟大的成就——文字。这阵营的成员囤积稀有的卷轴和插图，并在战争或灾难蹂躏它们之前溜进修道院和城堡偷取书籍。书之教友在学者、牧师和其他有文采的人中繁衍生息，并经常努力以尽可能多的语言进行扫盲。"
 goldenwheel: "黄金轮"
 goldenwheel_adj: "黄金轮"
 goldenwheel_adherent: "商贾"
 goldenwheel_adherent_plural: "商贾"
 goldenwheel_desc: "贸易和合作推动了人类的进展——或者，至少，这是黄金轮所坚持的。该阵营尽最大的努力来促进城市和乡村之间的贸易关系，理由是在货物交换的地方，思想也会被交换。一些狼族指责黄金轮的行为更多的是出于贪婪而非善意，但在该阵营中，几乎没有发现任何关于巨大腐蚀的足够证据。"
 redtalon_religion: "@werewolf_icon!赤爪"
 redtalon_religion_adj: "赤爪"
 redtalon_religion_adherent: "赤爪"
 redtalon_religion_adherent_plural: "赤爪"
 redtalon_religion_desc: "赤爪是狼族中唯一一个完全都是天生狼子的部族，他们完全回避人类，认为人类是地球上的污秽。赤爪称他们的部族是直接来自盖亚的，他们依是最纯粹的狼族，与他们的原始形态保持着联系，没有被受污染的人类所腐化。"
 predatorkings: "掠食王者之厅"
 predatorkings_adj: "掠食王者之厅"
 predatorkings_adherent: "掠食者"
 predatorkings_adherent_plural: "掠食者"
 predatorkings_desc: "掠食王者希望看到地球上的每个人类都死去——没有妥协。全都杀光。"
 wardersoftheland: "大地守护者"
 wardersoftheland_adj: "大地守护者"
 wardersoftheland_adherent: "守护者"
 wardersoftheland_adherent_plural: "守护者"
 wardersoftheland_desc: "守护者会杀死任何闯入他们领地的人类，但不会追杀到外面去。守护者会在必要时毫不犹豫地杀死一个人，但他们不相信大规模屠杀有效。有些狼人认为，如果地球上没有这么多人，人类将会是一个可以容忍的麻烦，而不是他们现在构成的公开威胁。其他狼人希望看到人类消失，但认为狼人没有实现它的工具和能力，因此他们转而寻求其他选择。"
 nightfear: "暗夜之怖"
 nightfear_adj: "暗夜之怖"
 nightfear_adherent: "恐怖"
 nightfear_adherent_plural: "恐怖"
 nightfear_desc: "该阵营主要由新月狼和凸月狼组成，他们对人类相传的故事最感兴趣。他们希望人类能够通过恐惧学会尊重地母，并通过恐惧来互相教导，提高警惕。众所周知，暗夜之怖会袭击他们认为明显违规的人类，但他们从不杀人——他们只打伤和恐吓，希望人类能够传播某些地方和行为是禁忌的信息。"
 settingmoon: "落月"
 settingmoon_adj: "落月"
 settingmoon_adherent: "爪"
 settingmoon_adherent_plural: "爪"
 settingmoon_desc: "赤爪的预言家和智者有时会从这个小阵营中出现。他们是预景的追逐者和预言的守护者，正是他们可怕的预言强化了部族的信念，即人类有一天会成为盖亚的死因。落月有时会派使者到其他族群，并经常向多部族的战群提供成员，希望在为时已晚之前警告到其他部族。"
 shadowlord_religion: "@werewolf_icon!影爵"
 shadowlord_religion_adj: "影爵"
 shadowlord_religion_adherent: "影爵"
 shadowlord_religion_adherent_plural: "影爵"
 shadowlord_religion_desc: "影爵是狼族的政治家和操纵者，他们通过严格的等级制度和隐秘手段，尽可能多地夺取权力。"
 lordsofthesummit: "峰会尊主"
 lordsofthesummit_adj: "峰会尊主"
 lordsofthesummit_adherent: "尊主"
 lordsofthesummit_adherent_plural: "尊主"
 lordsofthesummit_desc: "一位峰会尊主为了获得权力不惜一切代价，一旦获得了权力，就不会以任何理由放弃它。有权威的尊主们援引大律法说，由于怒嚎末日在即，不再有任何和平的幻觉，他们的统治权可能会受到光荣的挑战。这些尊主在部族（和狼国）中担任许多领导职务，在那里他们持续的“军事管制”状态促进并维持了他们的暴政。"
 bringersoflight: "光之使者"
 bringersoflight_adj: "光之使者"
 bringersoflight_adherent: "使者"
 bringersoflight_adherent_plural: "使者"
 bringersoflight_desc: "光之使者通过不断地测试自己对抗周围的污染来寻求内在的力量。他们一次又一次地寻找$glossary_wyrm$的诱惑，与吸血鬼、黑螺旋舞者、堕妖和其他妖蛆生物互动。尽管许多人在试图接受这个阵营的信条时已经倒下，但使者们相信最强大（并且真正有价值）的人不会屈服于黑暗；他们将战胜它。当然，很多人都倒下了；他们选择的道路相当危险，他们有可能死于周围人的手中，也有可能被妖蛆之触所腐蚀。"
 childrenofcrow: "群鸦之子"
 childrenofcrow_adj: "群鸦之子"
 childrenofcrow_adherent: "孩子"
 childrenofcrow_adherent_plural: "孩子"
 childrenofcrow_desc: "以乌鸦为图腾，这些狼族充当狼国领导人的顾问和“掮客”，支持强者和智者，同时策划配不上的人的倒台。他们伫立在阴影中，对个人权力或领导力不感兴趣。相反，他们在幕后工作，学习秘密并注意别人会忽略的细节，他们利用这些细节来打倒狼族的敌人，并一点一点地解放盖亚。他们是尽心尽力的、忠诚的贝塔。"
 judgesofdoom: "末日判官"
 judgesofdoom_adj: "末日判官"
 judgesofdoom_adherent: "判官"
 judgesofdoom_adherent_plural: "判官"
 judgesofdoom_desc: "末日判官通过寻找和摧毁公然违反律令的狼族将恐惧深深打入狼国的心脏。他们以无情的热切追求他们的工作。他们无血无泪，在追捕和摧毁狼族时毫不留情——甚至是整个族群——那些毁坏了一处圣地或犯下其他一些严重违反大律法的罪行的人。任何打破律令的人都不能在他们的审查和正义制裁中幸免。"
 silentstrider_religion: "@werewolf_icon!寂静漫游者"
 silentstrider_religion_adj: "寂静漫游者"
 silentstrider_religion_adherent: "寂静漫游者"
 silentstrider_religion_adherent_plural: "寂静漫游者"
 silentstrider_religion_desc: "寂静漫游者起源于埃及，被强大的吸血鬼赛特诅咒流放，从此他们一直在逃亡。游牧、内省和高度灵性化，寂静漫游者已经深入到[umbra|E]的深处，也许比任何其他的狼族部族都更深入。"
 harbingers_adj: "先驱者"
 harbingers_adherent: "先驱者"
 harbingers_adherent_plural: "先驱者"
 harbingers_desc: "这些人是第一批认真对待凤凰预言的狼族，至少是有些人这么说。他们分散开来踏遍世界，寻觅$glossary_wyrm$征象，并把消息带回部族。他们仍然没有完成告诉狼族他们发现的所有妖蛆迹象。最重要的是，他们带来了希望。他们是狼族中最聪明的人，所以当他们叫你跳时你最好就跳。"
 seekers_adj: "探寻者"
 seekers_adherent: "探寻者"
 seekers_adherent_plural: "探寻者"
 seekers_desc: "探寻者从一个地方游荡到另一个地方，寻找他们还没有学到的信息。探寻者往往很聪明，足智多谋，好奇心强，而且顽固得很。如果你想知道什么，就问探寻者。如果他们不知道答案，他们会给你指出正确的方向。探寻者往往知道已经发生的事情和现在正在发生的事情。探寻者比任何其他寂静漫游者阵营知道更多的神秘仪式。他们也很可能有在黑暗角落和偏僻地方藏有装满灵具和宝物的袋子。他们经常充当年轻寂静漫游者的导师，许多人与他们年轻时的导师保持着联系。"
 dispossessed: "被放逐者"
 dispossessed_adj: "被放逐者"
 dispossessed_adherent: "被放逐者"
 dispossessed_adherent_plural: "被放逐者"
 dispossessed_desc: "人们不禁为被放逐者揪心。他们最想做的事就是在某个地方定居下来。总有东西阻止他们定居下来。难怪他们如此痛苦。\n他们研究怒嚎末日，是其中最病态的。他们观察即将到来的怒嚎末日的预兆，并向那些愿意听的人讲述他们的警告。甚至有传言说他们试图帮助实现怒嚎末日。他们相信，在怒嚎末日之后他们会有一个家。"
 wayfarers: "旅人"
 wayfarers_adj: "旅人"
 wayfarers_adherent: "旅人"
 wayfarers_adherent_plural: "旅人"
 wayfarers_desc: "寂静漫游者将他们的服务卖给出价最高的人。如果其中一人说他会让你的信息通过，它就会通过。这个由机会主义者组成的松散联盟的少数成员通常以交换和恩惠的方式进行交易。很多时候，他们认为，如果他们不为那些负责人提供帮助，他们甚至在大多数族群内都不会受到欢迎——所以为什么不得到一顿好饭和一些信息作为回报，以增加交易的甜头呢？"
 daggersofnut: "努特之匕"
 daggersofnut_adj: "努特之匕"
 daggersofnut_adherent: "匕首"
 daggersofnut_adherent_plural: "匕首"
 daggersofnut_desc: "他们的名字来自古埃及教中的夜神，这些寂静漫游者对吸血鬼的出现感到非常愤怒。他们对不死族的憎恨甚至超过了最狂野的芬尼安或最纯粹的银牙——因为他们要为失去的家园和失去的亲属复仇。努特之匕在任何地方都扮演着刺客的角色，默默地选择一到三只蚂蟥进行灭绝，即使这必须破坏当地人之间现有的休战协议。努特之匕所到之处，狼人和吸血鬼之间的战争就被点燃了新的怒火。"
 bitterhex: "仇恨魔女"
 bitterhex_adj: "仇恨魔女"
 bitterhex_adherent: "魔女"
 bitterhex_adherent_plural: "魔女"
 bitterhex_desc: "仇恨魔女的成员使用部族已知的最具争议和最危险的工具之一：诅咒。虽然成员们对他们与派系的联系保密，但整个阵营对其存在毫不掩饰。他们想让世界其他地方知道他们的部族已经受够了，诅咒有足够的魔力来报复对寂静行者和亲属们的任何不公，无论多么轻微。"
 silverfang_religion: "@werewolf_icon!银牙"
 silverfang_religion_adj: "银牙"
 silverfang_religion_adherent: "银牙"
 silverfang_religion_adherent_plural: "银牙"
 silverfang_religion_desc: "银牙是狼国的“阿尔法部族”，是自古以来的统治者和战争领袖。这些高贵的狼族以其身体的美貌、勇气和荣誉而闻名。可悲的是，该部族的许多年轻成员患有奇怪的怪癖——心不在焉、轻微的幻觉、梦游症——没有明显的精神病，但还是很引人注目。"
 sunlodge: "日轮之社"
 sunlodge_adj: "日轮之社"
 sunlodge_adherent: "沐日者"
 sunlodge_adherent_plural: "沐日者"
 sunlodge_desc: "赫利俄斯给尊敬他的狼人带来了理性和策略。他教狼族用思考和逻辑来控制他们的本能和愤怒。因此，那些追随他的人往往成为熟练的外交家和谈判者。实现休战、条约或联盟的最大问题往往是让对方听从说客提出的论点。赫利俄斯重视真理和正义。"
 moonlodge: "月轮之社"
 moonlodge_adj: "月轮之社"
 moonlodge_adherent: "沐月者"
 moonlodge_adherent_plural: "沐月者"
 moonlodge_desc: "月轮之社专门提升族群和战群的士气，同时保持与灵的良好关系，以重新获得露娜的青睐。"
 ivorypriesthood: "象牙圣职"
 ivorypriesthood_adj: "象牙圣职"
 ivorypriesthood_adherent: "圣职"
 ivorypriesthood_adherent_plural: "圣职"
 ivorypriesthood_desc: "象牙圣职与其说是一个派别，不如说是部族里自封的奥秘研究者，他们研究死亡和生命的秘密。当第一只狼为了拯救盖亚而死时，它得知了“死亡的奥秘”。象牙圣职是一个由银牙通神者组成的秘密社团，他们在经历了一系列的精神考验和核查后，开始学习同样的秘密，了解死亡的尸幕之外的事物。"
 greyraptors: "灰色猛禽"
 greyraptors_adj: "灰色猛禽"
 greyraptors_adherent: "猛禽"
 greyraptors_adherent_plural: "猛禽"
 greyraptors_desc: "一个由银牙组成的社团，他们努力惩罚那些侮辱或忽视他们部族古老的统治权的人，灰色猛禽对他们的真实身份保密，但他们的行动是公开的。恐怖和折磨是他们的生计，他们试图执行远古的忠诚誓言，而银牙之外很少有狼族记得或承认这些誓言。"
 mastersoftheseal: "封印掌控者"
 mastersoftheseal_adj: "封印掌控者"
 mastersoftheseal_adherent: "掌控者"
 mastersoftheseal_adherent_plural: "掌控者"
 mastersoftheseal_desc: "没有一个猎鹰之子会承认自己是这个阵营的成员，并指责其中的一个是会导致要求光荣挑战。原因很简单：封印掌控者是盗贼，他们从诸灵和其他部族窃取秘密。虽然他们对自己的身份保密，但他们会向部族中的其他人透露他们所学到的知识，他们可以利用这些信息来最好地促进银牙的共同利益。"
 stargazer_religion: "@werewolf_icon!星占"
 stargazer_religion_adj: "星占"
 stargazer_religion_adherent: "星占"
 stargazer_religion_adherent_plural: "星占"
 stargazer_religion_desc: "天性孤独的星占是狼族中最平静和最内向的，也是其余部族中最小的。他们一直是狼国的外来者，他们声称自己是来自东方的圣人该塔勒·摘星的追随者的后代，其宣扬温和与和谐。"
 heavenlysuccessors: "魔喰圣传人"
 heavenlysuccessors_adj: "魔喰圣传人"
 heavenlysuccessors_adherent: "圣传人"
 heavenlysuccessors_adherent_plural: "圣传人"
 heavenlysuccessors_desc: "许多人认为这是某种末日密教，传人们致力于击败和摧毁像饥饿的肿瘤一样吸食盖亚灵魂的妖魔——即吸血鬼和其他不死生物。虽然在他们不与妖魔战斗时，该阵营的成员往往与其他星占没什么两样。但在面对敌人时，他们会身着绿色长袍，向他们的祖师：钟馗致敬，一心一意狂热地攻击。"
 innerpath: "内在之路"
 innerpath_adj: "内在之路"
 innerpath_adherent: "探路者"
 innerpath_adherent_plural: "探路者"
 innerpath_desc: "内在之路是一个秘密的星占阵营，致力于通过精神控制和从内部修改政策来接管银牙。他们认为，为了盖亚和整狼国的利益，必须有人控制疯狂的狼族领袖。内在之路没有公开挑战银牙，而是与狼国内的其他不满者合作以实现他们的目标。"
 klaitalpuk: "该塔勒洞天"
 klaitalpuk_adj: "该塔勒洞天"
 klaitalpuk_adherent: "洞众"
 klaitalpuk_adherent_plural: "洞众"
 klaitalpuk_desc: "该塔勒洞天是最传统的星占阵营，也许是拥有最多追随者的阵营。在第一位观星者该塔勒·摘星的转世带领下，洞众遵循他们导师的指引来培养悟性。他们认为，来自原始智慧的理解要比来自被现代世界污染的头脑的智慧更有价值。"
 sacredthread: "神圣之线"
 sacredthread_adj: "神圣之线"
 sacredthread_adherent: "线"
 sacredthread_adherent_plural: "线"
 sacredthread_desc: "这个阵营的成员认为，狼国以狼人为中心的观念将会导致他们的毁灭，只有在人类的心中和思想中与$glossary_wyrm$战斗，战争才能真正获胜。神圣之线进入人类最黑暗的心灵，并作为指导者、顾问和导师，他们找到那里的人，提供各种各样的教育，以帮助加强人类精神。"
 trancerunners: "神行太保"
 trancerunners_adj: "神行太保"
 trancerunners_adherent: "神行太保"
 trancerunners_adherent_plural: "神行太保"
 trancerunners_desc: "有时会被误认为是寂静漫游者部族的成员，这个阵营属于一个古老的传统。龙喇嘛的风之冥想赋予他们履行职责的体力：将信息、物品和秘密从圣地传递到圣地、王庭传递到王庭。通过冥想和其他神秘学的修行，他们能够达到近乎失重的状态，这让他们能够在水中奔跑，跨越障碍，并表演其他灵巧、速度和耐力的绝技。"
 worldtree: "世界之树"
 worldtree_adj: "世界之树"
 worldtree_adherent: "树派"
 worldtree_adherent_plural: "树派"
 worldtree_desc: "世界之树不仅寻求在狼族中传播启蒙，而且还向人类、法师和其他化形种族传播启蒙。他们也比大多数人在灵界走得更远，学会了将他们的思想送入[UmbraGlossaryLocalized('astral_reaches','星影界')]寻找知识，而他们的身体仍然扎根于大地。"
 zephyr: "和风"
 zephyr_adj: "和风"
 zephyr_adherent: "和风"
 zephyr_adherent_plural: "和风"
 zephyr_desc: "和风的成员在其他狼族中间旅行，加入战群，通过榜样来传播他们的智慧。他们的目标是获得经验，因为在其曲折的命运中，他们希望获得其他方式无法实现的愿景。一些人说，和风最初是在一个训练林开道的道场周围形成的。但就像他们与之交流的风之灵一样，他们不能长期呆在一个地方，而是与风暴一同游荡。"
 anagamin: "阿那含"
 anagamin_adj: "阿那含"
 anagamin_adherent: "阿那含"
 anagamin_adherent_plural: "阿那含"
 anagamin_desc: "被称为“不还者”，一些人认为阿那含只不过是一个传说。根据讲述的故事，他们要么接受要么绑架他们认为值得陪伴他们穿越[umbra|E]之旅的部族成员。他们试图摆脱现实的束缚，并相信很快所有星占都会前往[umbra|E]，摆脱他们的凡人枷锁，永远不会回到地球。"
 ronin: "浪人"
 ronin_adj: "浪人"
 ronin_adherent: "浪人"
 ronin_adherent_plural: "浪人"
 ronin_desc: "浪人由于这样或那样的原因，被狼国流放的狼人。\n大多数浪人经常违反律令的某一信条，与长者或他们的战群对立，有些人甚至选择这种生活，以逃避狼族严酷的等级社会，或者因为他们被哀号压倒。人狼不是孤独的生物。人、狼和狼人的每一种天性都要求与其他物种成员结成伙伴。因此，被放逐是一个狼族可能面临的最可怕的判决之一。"
 kucha_ekundu: "库查·埃昆杜"
 kucha_ekundu_adj: "库查·埃昆杜"
 kucha_ekundu_adherent: "库查·埃昆杜"
 kucha_ekundu_adherent_plural: "库查·埃昆杜"
 kucha_ekundu_desc: "库查·埃昆杜是红塔伦人的血系之一，他们居住在非洲，与非洲野犬（又称“杂色狼”）而不是真正的狼繁殖。一些传言称，他们是从龙人那里学到这的。许多库查·埃昆杜对人类的看法与他们的表亲相同。库查·埃昆杜仍然崇尚狮鹫作为他们的图腾。"
 hakken: "八犬"
 hakken_adj: "八犬"
 hakken_adherent: "八犬"
 hakken_adherent_plural: "八犬"
 hakken_desc: "起源于影爵的兽妖部族，但不像其西方表亲，八犬与其世界观超越了影爵的刻板印象。八犬遵循武士道准则，亦即战士之道。所有赤诚的八犬遵循此道并视自身为最传统意义上的武士。八犬是唯一一个在亚洲的兽庭中拥有影响的狼人部族。"
 bagheera: "巴希拉"
 bagheera_adj: "巴希拉"
 bagheera_adherent: "巴希拉"
 bagheera_adherent_plural: "巴希拉"
 bagheera_desc: "Children of Saraam and feared as Kali's Executioners, Bagheera are Bastet who can assume the form of black panthers. The Bagheera claim that when Gaia was creating the Bastet, she hoped the Bagheera would be the lawgivers of catkind. This role never fully materialized, but traces of Gaia's intent linger still, filling them with a keen sense of justice and a spirit of righteous wrath that is terrible to behold."
 bubasti: "布巴斯提"
 bubasti_adj: "布巴斯提"
 bubasti_adherent: "布巴斯提"
 bubasti_adherent_plural: "布巴斯提"
 bubasti_desc: "也被称为影猫，是埃及的猫人。他们是猫族中的神秘主义者，是一个害羞而神秘的种族。然而，他们是芭丝特中最善于交际的，而且他们在大多数的工作中都倾向于彼此紧密合作。布巴斯提很久以前就被古老的吸血鬼神赛特诅咒了，因此，他们的生命永远与他们的故土黑土之国紧密相连。据说，如果某一代的布巴斯提全部离开埃及，那么这一代将是最后一代。没有人知道这个传言的真实性，但也没有人愿意去验证它。\n由于与赛特的战争，他们与荷鲁斯的$glossary_osirian_league$关系密切，他们的六位首领——凯布利已经获得了永生。"
 ceilican: "祟利坎"
 ceilican_adj: "祟利坎"
 ceilican_adherent: "祟利坎"
 ceilican_adherent_plural: "祟利坎"
 ceilican_desc: "他们也被称为环舞者，起源于北欧，与妖精有很强地联系，但本身不是妖精。祟利坎的祖先可以追溯到北欧的无名狮子，并被认为是辛巴的表亲（尽管每个辛巴被比作环舞者之一而感到愤怒）。在毁灭他们亲族的魂怒之战的恐怖中，幸存的祟利坎向一位妖精领主宣誓，后者很快就奴役了他们，并将他们多变的举止甚至对寒铁的虚弱传染给他们。"
 khan_adj: "可汗"
 khan_adherent: "可汗"
 khan_adherent_plural: "可汗"
 khan_desc: "可汗，也被称为光明王，是虎人，是芭丝特的九个剩余部族之一。他们将自己视为对抗黑暗的堡垒，他们是盖亚最完美的造物，因此有义务保护所有较弱的人。虽然通常像任何猫人一样独立且不善交际，但许多可汗都与兽庭结盟。\n作为一个可敬的族类，可汗更喜欢收集关于被遗忘的城市、偏远的飞地、繁华的大都市以及他们所居住的地方的日常生活的传说。"
 simba: "辛巴"
 simba_adj: "辛巴"
 simba_adherent: "辛巴"
 simba_adherent_plural: "辛巴"
 simba_desc: "辛巴是狮人。他们也被称为阳光领主或黑暗之王。辛巴代表了盖亚所能提供的最好一面，因为他们是高贵的、骄傲的、强大的，无与伦比。然而，即使在最好的情况下，他们也是傲慢的、专横的和恶意的。\n辛巴不是恶棍；他们是宏伟的领主，是恶魔的猎杀者。他们认为事情只是失去了秩序。当平衡被恢复时，当人类知道自己的位置时，当城市成为墓地时，狮子将被证明是正确的。在辛巴的心目中，黑暗时代的恶魔可以追溯到刀耕之治的终结和化形种族的松懈。而他们打算将事情归于正轨：如果这需要流血，那就这样吧。战争是国王的体育运动。"
 swara: "斯瓦拉"
 swara_adj: "斯瓦拉"
 swara_adherent: "斯瓦拉"
 swara_adherent_plural: "斯瓦拉"
 swara_desc: "芭丝特部族的豹人也被称为银之一族。与他们的亲族一样，他们的速度极快，常在旅行。他们还与[umbra|E]有着独特地联系。在芭丝特的所有部落中，斯瓦拉是最不被理解的。这是他们非常孤立的文化的结果。斯瓦拉是芭丝特中唯一能够小撇步的品种，使他们能够前往他们的同胞们无法到达的[umbra|E]界域。有些人猜测这是他们与露娜关系密切的结果，大多数斯瓦拉都崇敬露娜。一些传说称，在刀耕之治时期，是一位斯瓦拉第一次访问月球，正是这一点让他们了解到与$glossary_wyrm$战争的意义和重要性，以及形势之严峻。"
 gaia_death_deity_name_possessive: "$glossary_wyrm$"
 siberakh: "西伯勒克"
 siberakh_adj: "西伯勒克"
 siberakh_adherent: "西伯勒克"
 siberakh_adherent_plural: "西伯勒克"
 siberakh_desc: "西伯勒克，或称“外乡人”，他们自称是一个俄罗斯的狼族分支部族，与狼国的接触很少。他们的图腾是紫貂。西伯勒克是银牙的后裔，他们看到了为保持血统纯正而进行近亲繁殖的愚蠢行为，转而从温迪戈的种群中选择配偶。今晚，他们被隔离在西伯利亚的荒野中，不为大多数狼族所知；只有温迪戈和银牙知道他们。银牙将他们当作浪人回避，以维护他们对自己不锈血统的主张，而温迪戈则接受了西伯勒克不愿意参与狼国政治的态度。"
 gaia_divine_realm: "地球"
 gaia_witchgodname_the_horned_god_possessive: "$glossary_wyrm_corruption$的"
 gaia_good_god_earth: "地球"
 gaia_evil_god_eater_of_souls: "$glossary_wyrm_consumption$"
 gaia_evil_god_beast_of_war: "$glossary_wyrm_calamity$"
 gaia_evil_god_defiler: "$glossary_wyrm_corruption$"
 karoush_high_god_name_alternate: "纳拉"
 karoush_high_god_name_alternate_possessive: "纳拉"
 karoush_devil_name: "[Glossary('卡赫拉什', 'glossary_wyrm_tt')]"
 karoush_devil_name_possessive: "[Glossary('卡赫拉什', 'glossary_wyrm_tt')]"
 karoush_death_deity_name: "[Glossary('卡赫拉什', 'glossary_wyrm_tt')]"
 karoush_death_deity_name_possessive: "[Glossary('卡赫拉什', 'glossary_wyrm_tt')]"
 riverkeepers: "河流守护者"
 riverkeepers_adj: "河流守护者"
 riverkeepers_adherent: "河流守护者"
 riverkeepers_adherent_plural: "河流守护者"
 riverkeepers_desc: "河流守护者是大小河流的守护者和管家，他们不仅保护盖亚的水道，还为居住在它们旁边的人们担任萨满和气象工作者。"
 icestalkers: "冰之追猎者"
 icestalkers_adj: "冰之追猎者"
 icestalkers_adherent: "冰之追猎者"
 icestalkers_adherent_plural: "冰之追猎者"
 icestalkers_desc: "作为冰河时代的象征和北极可怕的北极熊的近亲，冰之潜行者不仅在古拉赫勒中，哪怕在所有化形者中也是最北方的部落。"
 holy_site_lille_ekkeroya_name:0 "小埃克勒岛"
