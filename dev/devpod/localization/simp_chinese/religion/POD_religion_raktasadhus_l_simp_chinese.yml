 mayaparisatya: "摩耶婆梨娑底"
 mayaparisatya_adj: "摩耶婆梨娑底"
 mayaparisatya_adherent: "阿修罗"
 mayaparisatya_adherent_plural: "阿修罗"
 mayaparisatya_desc: "矛盾之道在很大程度上归功于印度教的某些教义。根据它，血族永远被锁在宇宙的虚幻循环（摩耶）之外。大多数存在都能进入轮回，一种不断的转世重生循环，而血族被排除在该循坏之外。每个个体都有自己的目标，或者说自性，而被排除在循环之外的吸血鬼没有。"
 viaparadox: "矛盾之道"
 viaparadox_adj: "矛盾之道"
 viaparadox_adherent: "欺诈者"
 viaparadox_adherent_plural: "欺诈者"
 viaparadox_desc: "欺诈者相信每个人都有一个更高的目标，包括他们自己、其他吸血鬼和凡人。他们的天命是引导每个人走向其命中更高的位置。如果需要，这包括死亡，特别是那些他们认为过于任性的血族，他们已经从他们真正的命运中堕落了。\n在与东方同胞分裂的几个世纪里，这条心路发生了巨大的变化，现在常常被视为盗窃、酗酒和其他危害社会罪行的借口。"
 pathofdevaraja: "提婆罗阇之道"
 pathofdevaraja_adj: "提婆罗阇之道"
 pathofdevaraja_adherent: "天赐者"
 pathofdevaraja_adherent_plural: "天赐者"
 pathofdevaraja_desc: "此道的追随者不相信要有什么神权来统治。相反，他们相信他们必须自己赢得统治的权利，并在他们的人民眼中成为神。神不会创造臣民和下级，而是创造信徒和崇拜者。"
 pathofdaitya: "底提耶之道"
 pathofdaitya_adj: "底提耶之道"
 pathofdaitya_adherent: "弄蛇者"
 pathofdaitya_adherent_plural: "弄蛇者"
 pathofdaitya_desc: "底提耶崇拜湿婆，并宣称领导所有崇拜湿婆的吸血鬼。底提耶把他们的种姓义务看作是与凡人婆罗门教的奇异反面。作为恶魔，他们必须与神战斗，并努力推翻世界的道德秩序。然而，作为婆罗门，他们必须努力让他们的吸血鬼同胞履行自己的种姓义务，比如谋杀者、骗子、亵渎神圣仪式者以及其他所有被指派给恶魔的可憎使命。"
 samsara: "轮回之道"
 samsara_adj: "轮回之道"
 samsara_adherent: "罗刹"
 samsara_adherent_plural: "罗刹"
 samsara_desc: "现代的矛盾之道，也称为轮回之道，是雷伏诺稚子的新生。它不像摩耶婆梨娑底那样僵化，但也不允许西方该道的肆意残忍和享乐主义。它的道德规范和摩耶婆梨娑底是一样的，但是原罪阶级被调整了，以允许与不遵循这条心路的吸血鬼互动。"
 raktasadhus_desc: "印度的吸血鬼掌握着一种被称为“修持”的血术法。尽管实际上有不修持的印度$pod_cainites$，苦行血僧一词仍然有时被用来指所有印度$pod_cainites$集体，很大程度上是因为他们还没有把他们短暂效忠的网络正式形成一个实际的教派或皇庭。如果不是因为与南印度的永雷皇朝和东印度的朱雀皇朝的震旦族裔吸血鬼的冲突，这些效忠甚至可能根本就不存在。"
 raktasadhus_religious_head_title_name: "鲜血婆罗门"
