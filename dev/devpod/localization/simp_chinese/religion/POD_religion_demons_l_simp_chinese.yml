 avarice: "贪婪"
 avarice_adj: "贪婪"
 avarice_desc: "贪婪之恶魔想要占有一切，控制他们所看到的一切，并拒绝别人具有。与暴食者不同，贪婪之恶魔并不想消耗他们所觊觎的东西，他们想永远保留这些东西，直到它们崩溃成无用的垃圾的很久之后。贪婪之恶魔往往是微妙而狡猾的，他们着眼于长期的收益；对于一位永生的生命来说，花上三个世纪来获得对一个国家或密教的影响并不是什么大的努力，只要你最后能完全控制它。"
 avarice_adherent: "贪婪之恶魔"
 avarice_adherent_plural: "贪婪之恶魔"
 envy: "嫉妒"
 envy_adj: "嫉妒"
 envy_desc: "嫉妒之恶魔试图摧毁那些拥有恶魔所缺乏的东西的人——自由、爱、希望和上帝祝福给予的安慰。这些恶魔并不希望自己拥有这些东西；他们想要的是惩罚那些敢于拥有这些东西的人，其等因为拥有这些祝福而感到自己高人一等。只有在把其他人都拖入泥潭之后，这些恶魔才能得到满足，因为他们知道现在在尘世中没有其他人比他们更幸福。"
 envy_adherent: "嫉妒之恶魔"
 envy_adherent_plural: "嫉妒之恶魔"
 gluttony: "暴食"
 gluttony_adj: "暴食"
 gluttony_desc: "暴食之恶魔渴望快感，放纵食欲和欲望，超过饱腹的程度，并继续下去。凡人通常将暴食与对食物的渴望联系在一起，但实际上它只是一种吞噬欲望，非必要地使用资源。暴食之恶魔会选择一种特定的资源——食物、信仰、人类生命——并在使用或破坏该事物时获得偏执地快乐，而且向那些现在被迫没有了的人炫耀这种破坏和消费。"
 gluttony_adherent: "暴食之恶魔"
 gluttony_adherent_plural: "暴食之恶魔"
 lust: "色欲"
 lust_adj: "色欲"
 lust_desc: "色欲之恶魔迷失在肉体冲动和快感中，被肉欲放纵的可能性所迷惑。这些恶魔经常附身在追随者身上，在享受容器狰狞地死亡之前，大把地享受快乐和活动。色欲之恶魔常常迷恋性爱，但这并不是他们渴望的唯一形式的生理快感——他们在容器可活的时间里展开狂欢，吃、斗、喝和破坏。"
 lust_adherent: "色欲之恶魔"
 lust_adherent_plural: "色欲之恶魔"
 pride: "傲慢"
 pride_adj: "傲慢"
 pride_desc: "所有的恶魔都了解傲慢之罪，也许比人类更了解。傲慢是第一罪，是路西法和所有反抗上帝而不接受他的法令的天使的罪。傲慢之恶魔仍然将自己置于所有其他实体之上，并要求凡人和恶魔的崇拜和敬仰。在其中迷失，傲慢之恶魔可能会夷平一座城市，作为对一件小事的惩罚，或者折磨整个社区，直到每个成员同意无条件地爱和崇拜它。"
 pride_adherent: "傲慢之恶魔"
 pride_adherent_plural: "傲慢之恶魔"
 sloth: "怠惰"
 sloth_adj: "怠惰"
 sloth_desc: "怠惰之恶魔很难说是懒惰；那是一种被误导的凡人对原罪观点。怠惰是对简朴的需要，对方便的需要——最终对世界不感兴趣的反社会行为。怠惰之恶魔几乎都是死亡之恶魔，他们曾经牧养灵魂到最后的收割。现在他们渴望死亡的孤独和平静，渴望一个空旷世界的宁静。这些恶魔很罕见，因为地狱的虚无往往会永远吞噬他们；剩下的是那些为了让一个哭泣的小孩子安静下来而扼杀一个国家的怪物，他们渴望绝对地毁灭，渴望一个充满灰尘和墓碑的世界。"
 sloth_adherent: "怠惰之恶魔"
 sloth_adherent_plural: "怠惰之恶魔"
 wrath: "暴怒"
 wrath_adj: "暴怒"
 wrath_desc: "暴怒之恶魔是屠杀和破坏的旋风，是为了纯粹的破坏乐趣而横行霸道的怪物。然而，暴怒不仅仅是对暴力的渴望；它是对正当愤怒的诉求，是对那些违规者的惩罚。有些暴怒之恶魔把自己看成是社会秩序的执行者，但其他的恶魔却懒得告诉自己这样的谎言。在任何情况下，恶魔痴迷于抨击和摧毁任何让它感到沮丧、阻碍或仅仅是不便的东西。"
 wrath_adherent: "暴怒之恶魔"
 wrath_adherent_plural: "暴怒之恶魔"
