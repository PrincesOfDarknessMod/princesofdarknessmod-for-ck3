 tenet_advocatus_diaboli_desc:0 "撒旦和他的爪牙有强大的说服力，一种不可思议的能力，可以欺骗他人做事，以促进他们的恶魔目标。"
 doctrine_parameter_opinion_of_triat_balanced_opinion_active_active:0 "其他平衡织者与奇原的间者的[opinion|E]：$VALUE|+=0$"
 tenet_collectivism_name:0 "集体主义"
 tenet_collectivism_desc:0 "源自古中国统一主义的利维坦之道致力于构建出一个利维坦一般的集体，通过柔性的教化和硬性的律令催生躯士的集体观念，最终创造出统一的集体意志，像单细胞生物变成多细胞生物一样实现精神层面的进化。"
 tenet_wolves_of_sable_name:0 "紫貂之狼"
 tenet_wolves_of_sable_desc:0 "紫貂是流浪的隐形猎手；寂静沉思，耐心等待，毫无征兆地出手，然后又消失在冰、雪和风中，只留下一两滴血作为她曾经存在的证据。她是小型的幸存者，因周围环境而变得坚强，因孤独而变得温和。她代表了出乎意料的女猎手和在最艰难的情况下适者生存。紫貂的孩子被风之灵视为盟友，可以自由地召唤它们并与它们交谈。紫貂依靠她的孩子来保护她的西伯利亚领地。猎鹰把所有紫貂的孩子看作是不光彩的、混血的野蛮人，在任何情况下，猎鹰都不会容忍一位西伯勒克加入他自己选择的族群。"
