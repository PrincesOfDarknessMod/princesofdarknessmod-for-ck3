 special_doctrine_allied_to_anda_hostility_desc:0 "玄武皇朝里的恶鬼和安答在蒙古军队下保持不敌对。"
 special_doctrine_against_to_anda_hostility_name:0 "记仇万鬼"
 special_doctrine_against_to_anda_hostility_desc:0 "随着蒙古部落的联合，安答像风暴一样紧随其后，削弱了万鬼的统治。"
