l_simp_chinese:
 doctrine_vampirethemasquerade_name:0 "潜藏"
 doctrine_vampirethemasquerade_strict_name:0 "严格的潜藏"
 doctrine_vampirethemasquerade_strict_desc:0 "血之缄默是严格执行的。许多血族对这样严厉的执法感到愤怒。\n\n不要和吟游诗人交朋友，他们会歌颂你太多。\n\n不为人知。寻求阴影。\n\n不要让牧师、诗人或农民看到你吸食。无人能看见后安然离开。\n\n十字架稳固之时，确保你自身的安全。"
 doctrine_vampirethemasquerade_lax_name:0 "宽松的潜藏"
 doctrine_vampirethemasquerade_lax_desc:0 "血之缄默的执行是宽松的。虽然血族努力掩盖他们的存在，但他们有时也会犯可怕的错误，且没有受到长者的惩罚。"
 doctrine_vampirethemasquerade_none_name:0 "不进行潜藏"
 doctrine_vampirethemasquerade_none_desc:0 "吸血鬼行为不注重对血畜保密。"
 doctrine_vampirethemasquerade_consent_name:0 "只吸食自愿者"
 doctrine_vampirethemasquerade_consent_desc:0 "虽然不受社会欢迎，但亦然会寻求“捐赠者”的同意的吸血鬼。"
 doctrine_vampirethemasquerade_cult_name:0 "血之密教"
 doctrine_vampirethemasquerade_cult_desc:0 "吸血鬼有一个秘密结社或血之密教，将其神化为血神。"
 doctrine_vampirethemasquerade_family_name:0 "家族秘密"
 doctrine_vampirethemasquerade_family_desc:0 "吸血鬼的食物来自特定的凡人家庭，这些家庭可能对吸血鬼的情况有所了解。他们热衷于维持自己的血洁净，唾弃“不洁”的人。"
 doctrine_parameter_vampirethemasquerade_strict:0 "有着[trait|E]：[GetTrait('predatortype_consensualist').GetName( GetPlayer )]、[GetTrait('predatortype_cultist').GetName( GetPlayer )]或[GetTrait('predatortype_familias').GetName( GetPlayer )]的角色都是[criminals|E]"
 doctrine_parameter_vampirethemasquerade_lax:0 "有着[trait|E]：[GetTrait('predatortype_consensualist').GetName( GetPlayer )]、[GetTrait('predatortype_cultist').GetName( GetPlayer )]或[GetTrait('predatortype_familias').GetName( GetPlayer )]的角色都被[shunned|E]"
 doctrine_parameter_vampirethemasquerade_none:0 "有[GetTrait('predatortype_farmer').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]。"
 doctrine_parameter_vampirethemasquerade_family:0 "有[GetTrait('predatortype_alleycat').GetName( GetPlayer )]，[GetTrait('predatortype_bedlamite').GetName( GetPlayer )]，[GetTrait('predatortype_farmer').GetName( GetPlayer )]，[GetTrait('predatortype_footpad').GetName( GetPlayer )]或[GetTrait('predatortype_graverobber').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]。有[GetTrait('predatortype_familias').GetName( GetPlayer )][trait|E]的角色都被接纳。"
 doctrine_parameter_vampirethemasquerade_cult:0 "有着[trait|E]：[GetTrait('predatortype_consensualist').GetName( GetPlayer )]或[GetTrait('predatortype_familias').GetName( GetPlayer )]的角色都被[shunned|E]。而有着[GetTrait('predatortype_cultist').GetName( GetPlayer )][trait|E]的角色都被接纳。"
 doctrine_parameter_vampirethemasquerade_consent:0 "有[GetTrait('predatortype_alleycat').GetName( GetPlayer )][trait|E]的角色是[criminals|E]。有[GetTrait('predatortype_cauchemar').GetName( GetPlayer )]或[GetTrait('predatortype_extortionist').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]。有[GetTrait('predatortype_consensualist').GetName( GetPlayer )][trait|E]的角色是被赞扬。所有其他的掠食者类型都被接纳。"
 doctrine_oathbreaking_name:0 "破誓"
 doctrine_oathbreaking_crime_name:0 "罪行"
 doctrine_oathbreaking_crime_desc:0 "誓言是律法的基础。不守誓言的人将失去尊严，并且他们的生命将被剥夺。"
 doctrine_oathbreaking_shunned_name:0 "忌讳"
 doctrine_oathbreaking_shunned_desc:0 "不守誓言的人是不可信任的。小心他们。"
 doctrine_oathbreaking_accepted_name:0 "接受"
 doctrine_oathbreaking_accepted_desc:0 "破誓是被接受的。谁会相信不死族的话？"
 doctrine_parameter_oathbreaking_illegal:0 "有[GetTrait('oathbreaker').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_oathbreaking_shunned:0 "有[GetTrait('oathbreaker').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]"
 doctrine_parameter_oathbreaking_accepted:0 "有[GetTrait('oathbreaker').GetName( GetPlayer )][trait|E]的角色都被完全接纳"
 doctrine_vampirebloodoath_name:0 "血誓"
 doctrine_vampirebloodoath_crime_name:0 "罪行"
 doctrine_vampirebloodoath_crime_desc:0 "被血缚比被奴役更糟糕，因为它不仅束缚了身体，也束缚了心灵和思想。"
 doctrine_vampirebloodoath_shunned_name:0 "忌讳"
 doctrine_vampirebloodoath_shunned_desc:0 "血誓和成为血主的血奴一样，都是一种约束，如果发生的话，一定要谨慎选择。记住箴言。第一口，我会吸。第二口，我接受。第三口，我拒绝。"
 doctrine_vampirebloodoath_accepted_name:0 "接受"
 doctrine_vampirebloodoath_accepted_desc:0 "血誓是我们社会的基础。效忠的誓言应该通过某种程度的血之仆役来执行。"
 doctrine_parameter_vampirebloodoath_illegal:0 "有[GetTrait('unbondable').GetName( GetPlayer )][trait|E]的角色是被接纳的。会因为[bloodbond|E]而丢失虔诚。"
 doctrine_parameter_vampirebloodoath_shunned:0 "有[GetTrait('unbondable').GetName( GetPlayer )][trait|E]的角色是被接纳的。会因为[bloodbond|E]而丢失虔诚。"
 doctrine_parameter_vampirebloodoath_accepted:0 "有[GetTrait('unbondable').GetName( GetPlayer )][trait|E]的角色是[criminals|E]。"
 doctrine_vampireghouling_name:0 "血仆封臣"
 doctrine_vampireghouling_crime_name:0 "罪行"
 doctrine_vampireghouling_crime_desc:0 "血仆威胁着血之缄默，不要给无价值者分享血液。\n\n汝辈不当成为赛斯子嗣之神明，\n否则天主之戒备将与日俱增，永久断绝该隐之血脉，\n勿忘和蔼之亚斯他录，\n勿忘丰饶之巴尔，\n勿忘强壮之塔木兹，\n汝辈当知，若为赛斯子嗣之神明，\n其必将以天主之武器奋起反抗，并征服吾族，\n汝辈当如牧者引导其羊群般引导赛斯子嗣，于必要之时剔除彼辈之劣种，\n汝辈当清洁彼辈之血脉，使彼辈远离疾病之侵扰。"
 doctrine_vampireghouling_shunned_name:0 "忌讳"
 doctrine_vampireghouling_shunned_desc:0 "我们是掠食者，不是猎物。与血畜分享你的血将暴露你自己的弱点。\n\n汝辈不当成为赛斯子嗣之神明，\n否则天主之戒备将与日俱增，永久断绝该隐之血脉，\n勿忘和蔼之亚斯他录，\n勿忘丰饶之巴尔，\n勿忘强壮之塔木兹，\n汝辈当知，若为赛斯子嗣之神明，\n其必将以天主之武器奋起反抗，并征服吾族，\n汝辈当如牧者引导其羊群般引导赛斯子嗣，于必要之时剔除彼辈之劣种，\n汝辈当清洁彼辈之血脉，使彼辈远离疾病之侵扰。"
 doctrine_vampireghouling_accepted_name:0 "接受"
 doctrine_vampireghouling_accepted_desc:0 "血畜的职责是为我们服务，当他们被血缚束缚时，他们会成为更好的仆役。\n\n受服侍者\n\n为汝辈以该隐之力量所祝福者，可为守护汝等而居于汝之房屋，其不应为任一血族所[Embrace|E]，而应于恰当之时贡献彼辈之鲜血：\n令其成为汝辈之力量，不会因日光而削弱之力量，令其成为汝辈之双目，不会因白日而致盲之双目，令其成为汝辈之双耳，不会因沉眠而失聪之双耳。\n令彼辈被称之以赛斯子嗣中最伟大、最有特权者。\n令其沉迷于血族之华服，令其享乐于血族之天籁，令其耽溺于血族之美酒。\n吾辈应护其不受他人阻挠与伤害，吾辈应反抗拥吮他人仆从之血族，若非受到挑衅，否则血族不得杀戮他人之仆从。"
 doctrine_vampireghouling_mass_name:0 "接纳制造大量血仆"
 doctrine_vampireghouling_mass_desc:0 "血族之血可建立军队。\n\n受服侍者\n\n为汝辈以该隐之力量所祝福者，可为守护汝等而居于汝之房屋，其不应为任一血族所[Embrace|E]，而应于恰当之时贡献彼辈之鲜血：\n令其成为汝辈之力量，不会因日光而削弱之力量，令其成为汝辈之双目，不会因白日而致盲之双目，令其成为汝辈之双耳，不会因沉眠而失聪之双耳。\n令彼辈被称之以赛斯子嗣中最伟大、最有特权者。\n令其沉迷于血族之华服，令其享乐于血族之天籁，令其耽溺于血族之美酒。\n吾辈应护其不受他人阻挠与伤害，吾辈应反抗拥吮他人仆从之血族，若非受到挑衅，否则血族不得杀戮他人之仆从。"
 doctrine_parameter_vampireghouling_illegal:0 "有[GetTrait('ghoul').GetName( GetPlayer )][trait|E]，[GetTrait('regnant').GetName( GetPlayer )][trait|E]或[GetTrait('massregnant').GetName( GetPlayer )]的角色是[criminals|E]。"
 doctrine_parameter_vampireghouling_shunned:0 "有[GetTrait('ghoul').GetName( GetPlayer )][trait|E]或[GetTrait('regnant').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]。有[GetTrait('massregnant').GetName( GetPlayer )]的角色是[criminals|E]。"
 doctrine_parameter_vampireghouling_accepted:0 "有[GetTrait('ghoul').GetName( GetPlayer )][trait|E]或[GetTrait('regnant').GetName( GetPlayer )][trait|E]的角色是被完全接纳的。有[GetTrait('massregnant').GetName( GetPlayer )]的角色是[criminals|E]。"
 doctrine_parameter_vampireghouling_mass:0 "有[GetTrait('ghoul').GetName( GetPlayer )][trait|E]，[GetTrait('regnant').GetName( GetPlayer )][trait|E]或[GetTrait('massregnant').GetName( GetPlayer )]的角色是被完全接纳的。"
 doctrine_bloodsorcery_name:0 "血术法"
 doctrine_bloodsorcery_crime_name:0 "罪行"
 doctrine_bloodsorcery_crime_desc:0 "血术法是对所有血族的威胁，所以其应该被禁止。\n\n启迪之族\n\n力量之母，暗之莉莉丝，乃彼辈之中最为伟大者，但纷纷而来仍有他者。\n汝辈不当啜饮彼辈之鲜血，否则其将诱捕汝等，谨防彼辈，其乃诡计多端之众。\n彼辈知晓亚当之知识，彼辈知晓夏娃之智慧，彼辈乃烈焰之使者，土壤之耕者，兽群之牧者，书写之造者，彼辈乃日耀之子民，初升之明星。\n彼辈会将汝等拖入其之旅途，抵制！抵制！彼辈之路途漠视饥饿，鲜血，与躯体。\n汝辈不当信任一切目视拂晓者。\n切记，拂晓乃汝等死亡之使者"
 doctrine_bloodsorcery_shunned_name:0 "忌讳"
 doctrine_bloodsorcery_shunned_desc:0 "血术士是一个可疑的群体，最多只是一种有时必要的邪恶。\n\n启迪之族\n\n力量之母，暗之莉莉丝，乃彼辈之中最为伟大者，但纷纷而来仍有他者。\n汝辈不当啜饮彼辈之鲜血，否则其将诱捕汝等，谨防彼辈，其乃诡计多端之众。\n彼辈知晓亚当之知识，彼辈知晓夏娃之智慧，彼辈乃烈焰之使者，土壤之耕者，兽群之牧者，书写之造者，彼辈乃日耀之子民，初升之明星。\n彼辈会将汝等拖入其之旅途，抵制！抵制！彼辈之路途漠视饥饿，鲜血，与躯体。\n汝辈不当信任一切目视拂晓者。\n切记，拂晓乃汝等死亡之使者"
 doctrine_bloodsorcery_accepted_name:0 "接受"
 doctrine_bloodsorcery_accepted_desc:0 "魔法充斥着我们周围的世界，我们有权利也有特权像我们的祖先那样融入其中。"
 doctrine_parameter_bloodsorcery_illegal:0 "有[GetTrait('bloodsorcery').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_bloodsorcery_shunned:0 "有[GetTrait('bloodsorcery').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]"
 doctrine_parameter_bloodsorcery_accepted:0 "有[GetTrait('bloodsorcery').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_infernalism_name:0 "崇魔"
 doctrine_infernalism_crime_name:0 "罪行"
 doctrine_infernalism_crime_desc:0 "崇魔意味着将地狱带上人间大地。不要与黑暗交易：届时其将带走我们所有。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现崇魔者需追杀并将其消灭。"
 doctrine_infernalism_shunned_name:0 "忌讳"
 doctrine_infernalism_shunned_desc:0 "与恶魔契约者已种下他们的消亡。不要与黑暗交易：届时其将带走我们所有。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现崇魔者需追杀并将其消灭。"
 doctrine_infernalism_accepted_name:0 "接受"
 doctrine_infernalism_accepted_desc:0 "修炼崇魔是通往真正力量之路"
 doctrine_parameter_infernalism_illegal:0 "有[GetTrait('demon').GetName( GetPlayer )]、[GetTrait('infernalist').GetName( GetPlayer )]或[GetTrait('baali').GetName( GetPlayer )][trait|E]的角色是[criminals|E]。"
 doctrine_parameter_infernalism_shunned:0 "有[GetTrait('demon').GetName( GetPlayer )]、[GetTrait('infernalist').GetName( GetPlayer )]或[GetTrait('baali').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]"
 doctrine_parameter_infernalism_accepted:0 "有[GetTrait('demon').GetName( GetPlayer )]、[GetTrait('infernalist').GetName( GetPlayer )]或[GetTrait('baali').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_vampirediablerie_name:0 "吸榨"
 doctrine_vampirediablerie_crime_name:0 "罪行"
 doctrine_vampirediablerie_crime_desc:0 "吞噬另一个血族的灵魂是我们同类中最严重的罪行。\n\n告别辞，令人生畏的[diablerie|E]\n\n汝辈不当寻求汝之长者的鲜血，汝辈不当寻求汝[Sire|E]之[Sire|E]的鲜血，汝辈不当寻求汝之造者的鲜血，否则当汝因汝不灭之原罪付出代价时，汝将切身感受火葬柴堆之高热。"
 doctrine_vampirediablerie_shunned_name:0 "忌讳"
 doctrine_vampirediablerie_shunned_desc:0 "一旦吸血鬼尝到了其他吸血鬼的血的滋味，他们会停在哪里呢？"
 doctrine_vampirediablerie_accepted_name:0 "接受"
 doctrine_vampirediablerie_accepted_desc:0 "血液属于那些有足够力量来保存它的人。"
 doctrine_vampirediablerie_ignorant_name:0 "无知"
 doctrine_vampirediablerie_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_parameter_vampirediablerie_illegal:0 "有[GetTrait('diablerist').GetName( GetPlayer )]或[GetTrait('predatortype_bloodleech').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_vampirediablerie_shunned:0 "有[GetTrait('diablerist').GetName( GetPlayer )]或[GetTrait('predatortype_bloodleech').GetName( GetPlayer )][trait|E]的角色被[shunned|E]"
 doctrine_parameter_vampirediablerie_accepted:0 "有[GetTrait('diablerist').GetName( GetPlayer )]或[GetTrait('predatortype_bloodleech').GetName( GetPlayer )][trait|E]的角色是被完全接纳的"
 doctrine_parameter_vampirediablerie_ignorant:0 "我们对[GetTrait('diablerist').GetName( GetPlayer )]或[GetTrait('predatortype_bloodleech').GetName( GetPlayer )][trait|E]一无所知"
 doctrine_vampirefrenzy_name:0 "血狂"
 doctrine_vampirefrenzy_crime_name:0 "罪行"
 doctrine_vampirefrenzy_crime_desc:0 "被心兽控制就是变成心兽。记住谚语，控制心兽，别让它控制你。"
 doctrine_vampirefrenzy_shunned_name:0 "忌讳"
 doctrine_vampirefrenzy_shunned_desc:0 "所有血族都反抗心兽的需求，不要轻易屈服。记住谚语，控制心兽，别让它控制你。"
 doctrine_vampirefrenzy_accepted_name:0 "接受"
 doctrine_vampirefrenzy_accepted_desc:0 "乘风破浪！当我们最需要的时候，心兽就是力量！"
 doctrine_parameter_vampirefrenzy_illegal:0 "有[GetTrait('wight').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_vampirefrenzy_shunned:0 "有[GetTrait('wight').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_vampirefrenzy_accepted:0 "有[GetTrait('wight').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_vampirethinblood_name:0 "淡血"
 doctrine_vampirethinblood_crime_name:0 "罪行"
 doctrine_vampirethinblood_crime_desc:0 "淡血种会带来火焚末日！无论在何处发现都要将其消灭！"
 doctrine_vampirethinblood_shunned_name:0 "忌讳"
 doctrine_vampirethinblood_shunned_desc:0 "淡血种是火焚末日的一种预兆。他们被规避和忌讳。"
 doctrine_vampirethinblood_accepted_name:0 "接受"
 doctrine_vampirethinblood_accepted_desc:0 "晚生种和其他吸血鬼一样，只是弱一点。"
 doctrine_vampirethinblood_ignorant_name:0 "无知"
 doctrine_vampirethinblood_ignorant_desc:0 "我们不知道关于吸血鬼的血的事。"
 doctrine_parameter_vampirethinblood_illegal:0 "有着[GetTrait('caitiff').GetName( GetPlayer )]，[GetTrait('vampgeneration14').GetName( GetPlayer )]，[GetTrait('vampgeneration15').GetName( GetPlayer )]和[GetTrait('vampgeneration16').GetName( GetPlayer )][traits|E]的角色是[criminals|E]"
 doctrine_parameter_vampirethinblood_shunned:0 "有着[GetTrait('caitiff').GetName( GetPlayer )]，[GetTrait('vampgeneration14').GetName( GetPlayer )]，[GetTrait('vampgeneration15').GetName( GetPlayer )]和[GetTrait('vampgeneration16').GetName( GetPlayer )][traits|E]的角色是被[shunned|E]"
 doctrine_parameter_vampirethinblood_accepted:0 "有着[GetTrait('caitiff').GetName( GetPlayer )]，[GetTrait('vampgeneration14').GetName( GetPlayer )]，[GetTrait('vampgeneration15').GetName( GetPlayer )]和[GetTrait('vampgeneration16').GetName( GetPlayer )][traits|E]的角色是被接纳的"
 doctrine_parameter_vampirethinblood_ignorant:0 "我们对[GetTrait('caitiff').GetName( GetPlayer )]，[GetTrait('vampgeneration15').GetName( GetPlayer )]和[GetTrait('vampgeneration16').GetName( GetPlayer )][traits|E]一无所知。"
 doctrine_vampirism_name:0 "吸血"
 doctrine_vampirism_crime_name:0 "罪行"
 doctrine_vampirism_crime_desc:0 "血吸虫异怪必须被消灭"
 doctrine_vampirism_shunned_name:0 "忌讳"
 doctrine_vampirism_shunned_desc:0 "可怜这些不能再看日出的不幸者。"
 doctrine_vampirism_accepted_name:0 "接受"
 doctrine_vampirism_accepted_desc:0 "血族是被接纳的。"
 doctrine_parameter_vampirism_illegal:0 "有[GetTrait('vampire').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_vampirism_shunned:0 "有[GetTrait('vampire').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_vampirism_accepted:0 "有[GetTrait('vampire').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_lycanthropy_name:0 "狼人"
 doctrine_lycanthropy_crime_name:0 "罪行"
 doctrine_lycanthropy_crime_desc:0 "狼群必须被消灭。\n\n月之野兽\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 doctrine_lycanthropy_shunned_name:0 "忌讳"
 doctrine_lycanthropy_shunned_desc:0 "虽然和我们同样是超自然生物，但狼人和我们不一样。和我们一点都不一样。\n\n月之野兽\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 doctrine_lycanthropy_accepted_name:0 "接受"
 doctrine_lycanthropy_accepted_desc:0 "狼族是被接纳的。"
 doctrine_parameter_lycanthropy_illegal:0 "有[GetTrait('werewolf').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_lycanthropy_shunned:0 "有[GetTrait('werewolf').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_lycanthropy_accepted:0 "有[GetTrait('werewolf').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_magicraft_name:0 "魔法"
 doctrine_magicraft_crime_name:0 "罪行"
 doctrine_magicraft_crime_desc:0 "法师必须被消灭。\n\n启迪之族\n\n力量之母，暗之莉莉丝，乃彼辈之中最为伟大者，但纷纷而来仍有他者。\n汝辈不当啜饮彼辈之鲜血，否则其将诱捕汝等，谨防彼辈，其乃诡计多端之众。\n彼辈知晓亚当之知识，彼辈知晓夏娃之智慧，彼辈乃烈焰之使者，土壤之耕者，兽群之牧者，书写之造者，彼辈乃日耀之子民，初升之明星。\n彼辈会将汝等拖入其之旅途，抵制！抵制！彼辈之路途漠视饥饿，鲜血，与躯体。\n汝辈不当信任一切目视拂晓者。\n切记，拂晓乃汝等死亡之使者。"
 doctrine_magicraft_shunned_name:0 "忌讳"
 doctrine_magicraft_shunned_desc:0 "虽然和我们同样是超自然生物，但法师和我们不一样。和我们一点都不一样。\n\n启迪之族\n\n力量之母，暗之莉莉丝，乃彼辈之中最为伟大者，但纷纷而来仍有他者。\n汝辈不当啜饮彼辈之鲜血，否则其将诱捕汝等，谨防彼辈，其乃诡计多端之众。\n彼辈知晓亚当之知识，彼辈知晓夏娃之智慧，彼辈乃烈焰之使者，土壤之耕者，兽群之牧者，书写之造者，彼辈乃日耀之子民，初升之明星。\n彼辈会将汝等拖入其之旅途，抵制！抵制！彼辈之路途漠视饥饿，鲜血，与躯体。\n汝辈不当信任一切目视拂晓者。\n切记，拂晓乃汝等死亡之使者。"
 doctrine_magicraft_accepted_name:0 "接受"
 doctrine_magicraft_accepted_desc:0 "法师是被接纳的。"
 doctrine_parameter_magicraft_illegal:0 "有[GetTrait('mage').GetName( GetPlayer )]和[GetTrait('sorcerer').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_magicraft_shunned:0 "有[GetTrait('mage').GetName( GetPlayer )]和[GetTrait('sorcerer').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_magicraft_accepted:0 "有[GetTrait('mage').GetName( GetPlayer )]和[GetTrait('sorcerer').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_glamour_name:0 "梦华"
 doctrine_glamour_crime_name:0 "罪行"
 doctrine_glamour_crime_desc:0 "妖精必须被消灭。"
 doctrine_glamour_shunned_name:0 "忌讳"
 doctrine_glamour_shunned_desc:0 "虽然和我们同样是超自然生物，但妖精和我们不一样。和我们一点都不一样。\n\n荒野子民\n\n疯狂族类，荒野子民，听吾一言，勿饮其血！\n汝辈当观察彼辈，彼辈之生态令其美丽，彼辈之奥秘令其迷人，彼辈之战技令其致命。\n暗夜生物中之孤独者，彼辈于大地之中与吾族为伴，彼辈于吾族仍有呼吸之时送来解渴之清水。\n如吾一般，彼辈已遭流放，如吾之后裔一般，彼辈无家可归，如吾之后裔之后裔一般，彼辈徘徊徜徉，如吾之先母与先父一般，彼辈知之过多。\n但彼辈仍保有自身之计策，事关彼辈，听吾一言，铭记于心：保持沉默！\n闭口不言。\n观察，并学习。"
 doctrine_glamour_accepted_name:0 "接受"
 doctrine_glamour_accepted_desc:0 "妖精是被接纳的。\n\n荒野子民\n\n疯狂族类，荒野子民，听吾一言，勿饮其血！\n汝辈当观察彼辈，彼辈之生态令其美丽，彼辈之奥秘令其迷人，彼辈之战技令其致命。\n暗夜生物中之孤独者，彼辈于大地之中与吾族为伴，彼辈于吾族仍有呼吸之时送来解渴之清水。\n如吾一般，彼辈已遭流放，如吾之后裔一般，彼辈无家可归，如吾之后裔之后裔一般，彼辈徘徊徜徉，如吾之先母与先父一般，彼辈知之过多。\n但彼辈仍保有自身之计策，事关彼辈，听吾一言，铭记于心：保持沉默！\n闭口不言。\n观察，并学习。"
 doctrine_parameter_glamour_illegal:0 "有[GetTrait('fae').GetName( GetPlayer )]或[GetTrait('changeling').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_glamour_shunned:0 "有[GetTrait('fae').GetName( GetPlayer )]或[GetTrait('changeling').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_glamour_accepted:0 "有[GetTrait('fae').GetName( GetPlayer )]或[GetTrait('changeling').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_supehunting_name:0 "猎巫"
 doctrine_supehunting_crime_name:0 "罪行"
 doctrine_supehunting_crime_desc:0 "猎巫人必须被消灭。\n\n当十字有了目标时，你最好有找到安身之处。"
 doctrine_supehunting_shunned_name:0 "忌讳"
 doctrine_supehunting_shunned_desc:0 "最好不要招惹他们的注意。\n\n当十字有了目标时，你最好有找到安身之处。"
 doctrine_supehunting_accepted_name:0 "接受"
 doctrine_supehunting_accepted_desc:0 "猎巫人是被接纳的。"
 doctrine_parameter_supehunting_illegal:0 "有[GetTrait('supehunter').GetName( GetPlayer )][trait|E]的角色是[criminals|E]"
 doctrine_parameter_supehunting_shunned:0 "有[GetTrait('supehunter').GetName( GetPlayer )][trait|E]的角色是被[shunned|E]"
 doctrine_parameter_supehunting_accepted:0 "有[GetTrait('supehunter').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 tenet_vampiremasquerade_name:0 "潜藏"
 tenet_vampiremasquerade_desc:0 "血之缄默。汝勿向非同血者见汝之性。如此将弃汝谓吾之盟也。"
 tenet_vampireprogeny_name:0 "后嗣"
 tenet_vampireprogeny_desc:0 "惟得长者之许，方可再造。破此，汝与汝之后皆将死。若不得长者许而造一，汝与汝之后皆将死。"
 tenet_vampiredestruction_name:0 "毁灭"
 tenet_vampiredestruction_desc:0 "禁汝灭同类。灭之权惟汝之长。惟尔中最长者乃可召血猎。"
 tenet_vampiretouchstone_name:0 "心眷"
 tenet_vampiretouchstone_desc:0 "血族可以选择一位凡人作为心眷来保持其与人性的相连。该血族获得虔诚。并将有更多心眷相关事件。"
 tenet_vampireremorse_name:0 "懊悔"
 tenet_vampireremorse_desc:0 "血族反思他们的行为，为他们的恶行感到后悔，获得虔诚。"
 tenet_vampireblushoflife_name:0 "生之红晕"
 tenet_vampireblushoflife_desc:0 "血族可以模仿活人生活。这可以帮助他们的[masquerade|E]和回忆何为人类并获得虔诚。"
 tenet_vampirenecromanticexperimention_name:0 "亡灵实验"
 tenet_vampirenecromanticexperimention_desc:0 "铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切\n当吾于日升中天之刻沉眠时，吾兄弟之鲜血便于吾耳边哀号\n吾之兄弟，次生者亚伯，于吾耳畔尖叫\n铭记于心：彼辈乃已死之魂灵\n彼辈之力量非汝等所拥有\n汝辈当倾听彼辈之言词：其话语中蕴含智慧\n汝辈当塞听彼辈之歌声：其旋律内暗藏湮没\n\n死刑既给予抑郁质，又给予虔诚。"
 tenet_vampirenemetamorphopsisexperimention_name:0 "亡灵术实验"
 tenet_vampirenemetamorphopsisexperimention_desc:0 "处决既增加胆汁质经验又增加虔诚。"
 tenet_vampireauctoritasritae_name:0 "公共仪式"
 tenet_vampireauctoritasritae_desc:0 "一套由所有魔宴成员参与的十三项仪式。"
 tenet_vampireamaranth_name:0 "不凋花"
 tenet_vampireamaranth_desc:0 "[diablerie|E]实践"
 tenet_vampiremonomacy_name:0 "血斗"
 tenet_vampiremonomacy_desc:0 "一场光荣的决斗，最终以[diablerie|E]结束。血斗仪式用以解决所有魔宴之间的争端。"
 tenet_infernalism_name:0 "崇魔"
 tenet_infernalism_desc:0 "通过与魔鬼签订契约获得恶魔式的叙擢。"
 tenet_vampireinquisition_name:0 "裁判所"
 tenet_vampireinquisition_desc:0 "记住：天主的子嗣，智天使，炽天使，天使长，其之触碰将如米迦勒之焰般焚烧汝辈。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现崇魔者需追杀并将其消灭。"
 tenet_pleasure_name:0 "愉悦"
 tenet_pleasure_desc:0 "享乐者对狂喜的追求"
 tenet_cruelty_name:0 "残暴"
 tenet_cruelty_desc:0 "愉悦通过受苦获得"
 tenet_quiritare_name:0 "尖嚎"
 tenet_quiritare_desc:0 "抵抗心兽或试图安抚它是不可能的，所以你要完全把自己交给它，执行它的意愿。"
 tenet_legacyoftrinity_name:0 "三一传承"
 tenet_legacyoftrinity_desc:0 "法典规定了三大[Clans|E]：妥芮朵，棘秘魑和梵卓的优越性。其他[Clans|E]的成员需征得检察官的同意才可再造；三大主要[Clans|E]的成员可以再造任何他们想要的人。只有三大主要[Clans|E]的成员可以将领地遗赠给另一位吸血鬼，而在这片领地内的每位吸血鬼都有义务依法典行事。"
 tenet_legacyofashes_name:0 "灰烬传承"
 tenet_legacyofashes_desc:0 "法典规定，任何杀死三大主要[Clans|E]成员的人都将面临一场血猎。"
 tenet_legacyofshadow_name:0 "影之传承"
 tenet_legacyofshadow_desc:0 "法典规定，[cainites|E]不能向非同血者透露它们的本性。这样做就等于放弃同血声称。"
 tenet_oaths_name:0 "约誓"
 tenet_oaths_desc:0 "我们的法律来自我们长者的指令，而该隐的指令凌驾于一切之上。宣誓是封建秩序的基础。"
 tenet_vampirehighclans_name:0 "上位氏族"
 tenet_vampirehighclans_desc:0 "上位[Clans|E]优于下位[Clans|E]。下位[Clans|E]是最终会屈服于心兽的堕落者。他们不适合当统治者或体面人。"
 tenet_vampireselectivefeeding_name:0 "选择性摄食"
 tenet_vampireselectivefeeding_desc:0 "汝辈不当啜饮月之野兽，荒野子民，罹患恶疾者，精神错乱者，嗜酒如命者。"
 tenet_enkrateia_reie_sophrosyne_name:0 "自律 胆量 审慎"
 tenet_enkrateia_reie_sophrosyne_desc:0 "理智地对待亡生，此道集中于三个基本概念，被认为是布鲁赫在迦太基之夜中的潜在后嗣所追求的基本特征：自律、胆量、审慎。自律指的是内在的力量。胆量指的是道德的勇气。审慎意味着对自我的控制，代表了所有“哲学家”的理想化目标：控制住布鲁赫之怒。"
 special_doctrine_three_pillars_kindred_name:0 "三支柱"
 special_doctrine_three_pillars_kindred_desc:0 "封建社会的基础是城堡、教堂和城镇。血族社会对于此的镜像是王者之路、天国之路、人性之路之间相互包容。"
 doctrine_parameter_hostility_override_special_doctrine_three_pillars_kindred:0 "拥有三支柱教义的其他血族[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 tenet_fellow_selfcontrol_opinion:0 "自控同僚"
 doctrine_parameter_selfcontrol_opinion_active:0 ""
 selfcontrol_opinion_active_opinion_name:0 "自控同僚"
 selfcontrol_opinion_active_county_opinion_name:0 "自控同僚伯爵领"
 doctrine_parameter_opinion_of_selfcontrol_opinion_active:0 "其他自控者的[opinion|E]：$VALUE|+=0$"
 tenet_fellow_instinct_opinion:0 "本能同僚"
 doctrine_parameter_instinct_opinion_active:0 ""
 instinct_opinion_active_opinion_name:0 "本能同僚"
 doctrine_parameter_opinion_of_instinct_opinion_active:0 "其他有本能的[opinion|E]：$VALUE|+=0$"
 tenet_fellow_conscience_opinion:0 "良知同僚"
 doctrine_parameter_conscience_opinion_active:0 ""
 conscience_opinion_active_opinion_name:0 "良知同僚"
 conscience_opinion_active_county_opinion_name:0 "良知同僚伯爵领"
 doctrine_parameter_opinion_of_conscience_opinion_active:0 "其他有良知的[opinion|E]：$VALUE|+=0$"
 doctrine_parameter_conviction_opinion_active:0 ""
 conviction_opinion_active_opinion_name:0 "信念同僚"
 doctrine_parameter_opinion_of_conviction_opinion_active:0 "其他有信念的[opinion|E]：$VALUE|+=0$"
 doctrine_nomarriage_name:0 "不婚"
 doctrine_nomarriage_desc:0 "该宗教没有婚姻。"
 doctrine_onlyconcubines_name:0 "只有侍妾"
 doctrine_onlyconcubines_desc:0 "该宗教只有侍妾，没有配偶。"
 doctrine_vampirethemasquerade_ignorant_name:0 "无知"
 doctrine_vampirethemasquerade_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_oathbreaking_ignorant_name:0 "无知"
 doctrine_oathbreaking_ignorant_desc:0 "破誓不被视为罪行。"
 doctrine_parameter_oathbreaking_ignorant:0 "有[GetTrait('oathbreaker').GetName( GetPlayer )][trait|E]的角色被无视。"
 doctrine_vampirefrenzy_ignorant_name:0 "无知"
 doctrine_vampirefrenzy_ignorant_desc:0 "是什么让一个人这般失控？"
 doctrine_parameter_vampirefrenzy_ignorant:0 "有[GetTrait('wight').GetName( GetPlayer )][trait|E]的角色正遭受着一种未知的疾病。"
 doctrine_supehunting_ignorant_name:0 "无知"
 doctrine_supehunting_ignorant_desc:0 "教会确实对异端过于狂热了。"
 doctrine_parameter_supehunting_ignorant:0 "有[GetTrait('supehunter').GetName( GetPlayer )][trait|E]的角色对这个宗教是一种未知的奉行。"
 tenet_conviction_and_instinct_name:0 "信念与本能"
 tenet_conviction_and_instinct_desc:0 "不会因为严重伤害或杀死凡人而丢失虔诚。不会因为血狂而丢失虔诚。"
 tenet_conviction_and_selfcontrol_name:0 "信念与自控"
 tenet_conviction_and_selfcontrol_desc:0 "不会因为严重伤害或杀死凡人而丢失虔诚。会因为血狂而丢失虔诚。"
 tenet_conscience_and_selfcontrol_name:0 "良知与自控"
 tenet_conscience_and_selfcontrol_desc:0 "会因为严重伤害或杀死凡人而丢失虔诚。会因为血狂而丢失虔诚。"
 tenet_conscience_and_instinct_name:0 "良知与本能"
 tenet_conscience_and_instinct_desc:0 "会因为严重伤害或杀死凡人而丢失虔诚。不会因为血狂而丢失虔诚。"
 tenet_orun_and_aye_name:0 "奥伦与艾"
 tenet_orun_and_aye_desc:0 "莱本在两条不同的道德心路上度过一生：艾，这是他们对人类的道德：奥伦，这是他们对超自然的道德。"
 tenet_pursuit_of_knowledge_name:0 "追寻知识"
 tenet_pursuit_of_knowledge_desc:0 "对知识的执着追求。罪孽包括：没有在有机会的时候进行研究，拒绝进行实验，拒绝与心路同道者分享自己的见解。"
 tenet_greed_is_good_name:0 "贪即是善"
 tenet_greed_is_good_desc:0 "金钱就是力量，而因此可以使用财富来获得影响力以及餍足他们的心兽。"
 tenet_scorched_heart_name:0 "空心"
 tenet_scorched_heart_desc:0 "由拉斯莫尼库斯开创，通过系统性地根除吸血鬼内心的每一种情感来控制心兽。"
 tenet_isolation_name:0 "隔离"
 tenet_isolation_desc:0 "我们只想要独处。我们的事是我们自己的事，与他人无关，他们的事也与我们无关。"
 tenet_vengeance_of_lilith_name:0 "莉莉丝的复仇"
 tenet_vengeance_of_lilith_desc:0 "该隐的子嗣破坏了莉莉丝的花园并杀害她的子嗣们的。只有妥芮朵和诺斯费拉图没有破坏，为了表示尊重，他们还在死去的子嗣们的脸蒙上了面纱。因此，他们免受莉莉丝追随者的报复。"
 tenet_continued_life_name:0 "延续凡生"
 tenet_continued_life_desc:0 "一些不死族试图尽可能地继续他们的凡人生活。虽然这有助于他们与自己的晚年凡人生活保持联系，但也增加了[masquerade|E]的曝露。继续使用神秘力量来显出有生气也会增加饥饿感。"
 tenet_vengeance_of_samiel_name:0 "萨麦尔的复仇"
 tenet_vengeance_of_samiel_desc:0 "在扫罗不在的时候，“神圣上主”的指挥官米迦勒拜访了萨麦尔。天使长指示武者之王抄写了圣书，以及圣书中新武者获取力量和血化所必需的适当仪式。"
 tenet_devoted_to_michael_name:0 "献身于米迦勒"
 tenet_devoted_to_michael_desc:0 "天使长之道是十三世纪拜占庭流行的天国之路。它是为了纪念君士坦丁堡的过世牧首米迦勒。此道的追随者被称为米迦勒派。"
 tenet_fellow_conviction_opinion:0 "信念同僚"
 conviction_opinion_active_county_opinion_name:0 "信念同僚伯爵领"
 doctrine_haunting_name:0 "作祟"
 doctrine_haunting_crime_name:0 "罪行"
 doctrine_haunting_crime_desc:0 "幽灵必须被关在迷障之后。\n\n死者之魂\n\n铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切"
 doctrine_haunting_shunned_name:0 "忌讳"
 doctrine_haunting_shunned_desc:0 "幽灵是从尸体上分离出来的灵魂。它们可能会试图附身我们的身体。\n\n死者之魂\n\n铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切"
 doctrine_haunting_accepted_name:0 "接纳"
 doctrine_haunting_accepted_desc:0 "死灵可以很有用。那些懂得召唤死灵与缚灵死灵之术的人可以为了任何缘由使用它们。\n\n死者之魂\n\n铭记于心：彼方之黑暗，乃超越魂灵之所在，超越生者之所在\n黯影之地，黯影聚集之地\n死灵之岛，死灵之城，死灵之地\n吾曾经由毁灭之路旅至彼方\n吾曾目睹惧怖之王端坐于冥河之城之王庭\n吾曾亲见头罩兜帽之无面者横渡冥河之水\n彼辈如蝇群追逐腐尸般追逐吾辈，以吾等之恐惧、狂喜、愤怒为美食\n彼辈已死，却又不死，彼辈与吾等之关系比吾等所知更为密切"
 doctrine_parameter_haunting_illegal:0 "有[GetTrait('wraith').GetName( GetPlayer )][trait|E] 是[criminals|E]。有[GetTrait('necromancy').GetName( GetPlayer )]或[GetTrait('oblivion').GetName( GetPlayer )][trait|E]的角色会被[shunned|E]。"
 doctrine_parameter_haunting_shunned:0 "有[GetTrait('wraith').GetName( GetPlayer )]、[GetTrait('necromancy').GetName( GetPlayer )]或[GetTrait('oblivion').GetName( GetPlayer )][trait|E]的角色会被[shunned|E]。"
 doctrine_parameter_haunting_accepted:0 "有[GetTrait('wraith').GetName( GetPlayer )]、[GetTrait('necromancy').GetName( GetPlayer )]或[GetTrait('oblivion').GetName( GetPlayer )][trait|E]的角色是被完全接纳的。"
 tenet_apotheosis_name:0 "神化"
 tenet_apotheosis_desc:0 ""
 special_doctrine_ecumenical_hunters_name:0 "普世猎人"
 special_doctrine_ecumenical_hunters_desc:0 "虽然猎人的背景和信仰各不相同，但他们在与黑暗世界的超自然恐怖的斗争中获得了共同的牵绊。"
 doctrine_parameter_hostility_override_special_doctrine_ecumenical_hunters:0 "拥有普世猎人教条的其他猎人[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 doctrine_vampirebloodoath_ignorant_name:0 "无知"
 doctrine_vampirebloodoath_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_vampireghouling_ignorant_name:0 "无知"
 doctrine_vampireghouling_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_bloodsorcery_ignorant_name:0 "无知"
 doctrine_bloodsorcery_ignorant_desc:0 "根本就没有魔法这回事。"
 doctrine_infernalism_ignorant_name:0 "无知"
 doctrine_infernalism_ignorant_desc:0 "魔鬼只是一个形容词罢了，对吧？"
 doctrine_vampirism_ignorant_name:0 "无知"
 doctrine_vampirism_ignorant_desc:0 "吸血鬼不存在。"
 doctrine_lycanthropy_ignorant_name:0 "无知"
 doctrine_lycanthropy_ignorant_desc:0 "狼人不存在。"
 doctrine_magicraft_ignorant_name:0 "无知"
 doctrine_magicraft_ignorant_desc:0 "根本就没有魔法这回事。"
 doctrine_haunting_ignorant_name:0 "无知"
 doctrine_haunting_ignorant_desc:0 "你死了，就没了。"
 doctrine_glamour_ignorant_name:0 "无知"
 doctrine_glamour_ignorant_desc:0 "你不觉得你已经老于相信圣诞老人的年纪了么？"
 special_doctrine_ignorance_name:0 "不要引起注意"
 special_doctrine_ignorance_desc:0 "凡人对黑暗世界中的超自然生物一无所知。我们应该保持这种状态。"
 doctrine_parameter_hostility_override_special_doctrine_ignorance:0 "无知[faiths|E]（如无知者）使得其等对黑暗世界的超自然生物不成威胁。希望让凡人保持无知的信仰被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$或$hostility_evil_tooltippable$"
 doctrine_parameter_hostility_override_ignorance_hostility_doctrine:0 "无知[faiths|E]（如无知者）使得其等对黑暗世界的超自然生物不成威胁。希望让凡人保持无知的信仰被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$或$hostility_evil_tooltippable$"
 doctrine_parameter_vampireselectivefeeding:0 ""
 tenet_bloodcommunion_name:0 "血圣餐"
 tenet_bloodcommunion_desc:0 "神化信徒的血圣餐是凡人圣餐仪式的不圣洁版。在该信仰中，它与其有许多相同的功能。当然，这里的血并不是比喻——而是会有活人献祭。"
 tenet_exaltedideals_name:0 "崇高理想"
 tenet_exaltedideals_desc:0 "智力、身体和美貌的完美是理想，而与其对立就是罪行。完美不只是一种精神状态，更是向低等人开战的理由。"
 special_doctrine_ashirra_pillars_kindred_name:0 "阿什拉派支柱"
 special_doctrine_ashirra_pillars_kindred_desc:0 "虽然那些在伊斯兰教早期阶段皈依的人来自非常不同的氏族和背景，但他们都相信某自己更伟大的存在。"
 doctrine_parameter_hostility_override_special_doctrine_ashirra_pillars_kindred:0 "拥有[ashirra|E]支柱教义的其他血族[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_evil_tooltippable$"
 instinct_opinion_active_county_opinion_name:0 "本能同僚伯爵领"
 special_doctrine_sin_pillars_kindred_name:0 "欲望支柱"
 special_doctrine_sin_pillars_kindred_desc:0 "萨哈尔的学生在他失踪后各走各路，但他们仍然是信仰上的教友。"
 doctrine_parameter_hostility_override_special_doctrine_sin_pillars_kindred:0 "拥有欲望支柱教义的其他血族[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 special_doctrine_set_pillars_kindred_name:0 "赛特支柱"
 special_doctrine_set_pillars_kindred_desc:0 "赛特有许多形象，许多名字和许多起源故事。但归根结底，他仍然是伟大的解放者。"
 doctrine_parameter_hostility_override_special_doctrine_set_pillars_kindred:0 "拥有赛特支柱教义的其他血族[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 special_doctrine_fivefold_path_kindred_name:0 "五大正道"
 special_doctrine_fivefold_path_kindred_desc:0 "由首位罗汉血/学创造的五种传统心法。五大正道的追随者认为异端心法是痛苦妄想的蠢货，又或危险的叛徒，需要被永远地镇压。"
 doctrine_parameter_hostility_override_special_doctrine_fivefold_path_kindred:0 "拥有五大正道教义的其他[GetTrait('kueijin').GetName( GetNullCharacter )][faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非#V 迷途#!"
 special_doctrine_allied_to_yomi_wan_hostility_name:0 "阎魔之友"
 special_doctrine_allied_to_yomi_wan_hostility_desc:0 "阎魔至上。不从者必死。"
 special_doctrine_against_to_yomi_wan_hostility_name:0 "阎魔之敌"
 special_doctrine_against_to_yomi_wan_hostility_desc:0 "当心阎魔走狗。其等应当被灭。"
 doctrine_undying_name:0 "重生"
 doctrine_undying_crime_name:0 "罪行"
 doctrine_undying_crime_desc:0 "木乃伊必须被消灭。"
 doctrine_undying_shunned_name:0 "忌讳"
 doctrine_undying_shunned_desc:0 "木乃伊是受忌讳的。"
 doctrine_undying_accepted_name:0 "接纳"
 doctrine_undying_accepted_desc:0 "木乃伊是被接纳的。"
 doctrine_undying_ignorant_name:0 "无知"
 doctrine_undying_ignorant_desc:0 "木乃伊是什么？"
 doctrine_parameter_undying_illegal:0 "有[GetTrait('mummy').GetName( GetPlayer )][trait|E]的角色是[criminals|E]。"
 doctrine_parameter_undying_shunned:0 "有[GetTrait('mummy').GetName( GetPlayer )][trait|E]的角色被[shunned|E]。"
 doctrine_parameter_undying_accepted:0 "有[GetTrait('mummy').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 doctrine_enlightenment_virtues_name:0 "启蒙美德"
 doctrine_enlightenment_virtues_conscience_and_selfcontrol_name:0 "良知与自控"
 doctrine_enlightenment_virtues_conscience_and_selfcontrol_desc:0 "会因为严重伤害或杀死凡人而丢失虔诚。会因为血狂而丢失虔诚。"
 doctrine_enlightenment_virtues_conviction_and_selfcontrol_name:0 "信念与自控"
 doctrine_enlightenment_virtues_conviction_and_selfcontrol_desc:0 "不会因为严重伤害或杀死凡人而丢失虔诚。会因为血狂而丢失虔诚。"
 doctrine_enlightenment_virtues_conviction_and_instinct_name:0 "信念与本能"
 doctrine_enlightenment_virtues_conviction_and_instinct_desc:0 "不会因为严重伤害或杀死凡人而丢失虔诚。不会因为血狂而丢失虔诚。"
 doctrine_enlightenment_virtues_conscience_and_instinct_name:0 "良知与本能"
 doctrine_enlightenment_virtues_conscience_and_instinct_desc:0 "会因为严重伤害或杀死凡人而丢失虔诚。不会因为血狂而丢失虔诚。"
 doctrine_enlightenment_virtues_orun_and_aye_name:0 "奥伦与艾"
 doctrine_enlightenment_virtues_orun_and_aye_desc:0 "莱本在两条不同的道德心路上度过一生：艾，这是他们对人类的道德：奥伦，这是他们对超自然的道德。"
 tenet_cold_mind_name:0 "太上忘情"
 tenet_cold_mind_desc:0 "太上忘情是一种思维状态，对幽影颂至关重要。就其基本原理而言，它描述了一种无情、冷静和受控的对待周围世界的方法，但它的大部分含义都被掩盖在谜语和公案中，因此，太上忘情的全部含义最好在语境中理解。"
 tenet_willing_embrace_name:0 "自愿初拥"
 tenet_willing_embrace_desc:0 "让另一位灵魂陷入永恒的诅咒不是一件小事。潜在的[Embrace|E]候选人必须完全了解他们所将接触的内容。"
 doctrine_parameter_willing_embrace:0 "在任何[Embrace|E]之前，你都必须先说服受害者。"
 tenet_ashen_faith_name:0 "灰之信仰"
 tenet_ashen_faith_desc:0 "大多数吸血鬼心路主要是只与自我相联系的哲学。但你的信仰不是，你为所有[cainite|E]带来了救赎，这言语必须被传播。"
 doctrine_parameter_ashen_faith:0 "要求改信[character_interaction|E]将有更高的成功几率。"
 ASHEN_FAITH:0 "灰之信仰信条：$VALUE|=+0$"
 tenet_intellectual_detachement_name:0 "理智分解"
 tenet_intellectual_detachement_desc:0 "学者们并不害怕死亡；事实上，他们对死亡很着迷。他们将其视为一种强大的力量，需要研究、剖析和合理化，以便他们能够更好地理解自己的存在。"
 tenet_pact_of_athens_name:0 "雅典之约"
 tenet_pact_of_athens_desc:0 "大约在公元前1270年，早期的浪子，主包括布鲁赫、梵卓、妥芮朵和萨洛比，在雅典举行了会议，因为许多与会的吸血鬼认为雅典是心路本身的正式发源地。雅典之约成了吸血鬼社会中的不同潮流的模板准则，即试图抵御心兽并保持他们的人性。"
 tenet_judgement_name:0 "审判"
 tenet_judgement_desc:0 "对哨卫来说，这条心路的主要信条之一是让其追随者清除所有配不上该隐之血的家伙，并净化血系；一个人如果对哈基姆的信徒现出黑暗、不光彩的性质，大概会被粗暴地日刑。 荣誉、纪律和自我控制的概念对哨卫们来说同样重要。轻率行事是一种耻辱的标志；允许心兽控制他们更是可憎。"
 special_doctrine_allied_to_apophis_hostility_name:0 "阿波菲斯仆从"
 special_doctrine_allied_to_apophis_hostility_desc:0 "阿波菲斯至上。不从者必死。"
 special_doctrine_against_to_apophis_hostility_name:0 "奥西里斯联盟"
 special_doctrine_against_to_apophis_hostility_desc:0 "虽然被击败了，但奥西里斯联盟对赛特的反抗精神依然存在。"
 tenet_the_pyramid_name:0 "金字塔"
 tenet_the_pyramid_desc:0 "被强大的敌人四面围困，睿魔尔的主要防御手段是他们对极度严格的等级制度的完全服从。"
 doctrine_parameter_the_pyramid:0 "封臣如果没有对其领主的牵制，就不能对其他封臣宣战。"
 tenet_feral_vampires_name:0 "荒野吸血鬼"
 tenet_feral_vampires_desc:0 "未开化的土地是我们的狩猎场，我们的传承者确保我们的传承会被传唱。"
 doctrine_parameter_feral_lorekeepers:0 "可以在没有任何技能的情况下使用编纂史诗决议，但结果总会是一首歌。"
 doctrine_parameter_can_hunt:0 "能够使用召集狩猎决议，即使是吸血鬼。"
 tenet_sanctioned_diableries_name:0 "吸榨制裁"
 tenet_sanctioned_diableries_desc:0 "哈基姆的子嗣们必须夺回配不上的人的血，但要小心草率的判决。"
 doctrine_parameter_sanctioned_diableries:0 "当[diablerie|E]，若受害者是怯懦的、专断的或属于邪恶宗教的，虔诚花费将减少。若受害者是勇敢的、正义的或信奉正义宗教的，则花费会增加。"
 COURT_CHAPLAIN_CONVERSION_SECRET_CULT_PENALTY:0 "来自秘密密教信条的减值。"
 tenet_secret_cult_name:0 "秘密密教"
 tenet_secret_cult_desc:0 "该信仰的组织方式就像一种阴暗的幕后黑手。很少有人真正知道他们的存在，而他们喜欢也这种方式。"
 doctrine_parameter_secret_cult:0 "解锁触密教徒兵士。给予伯爵领宗教皈依减值。"
 tenet_noblesse_oblige_name:0 "贵族规范"
 tenet_noblesse_oblige_desc:0 "贵胄对主从责任极为重视。公正地御下应导致封臣幸福。封臣的赞许意味着领主的成功。"
 tenet_knowledge_above_all_name:0 "知识高于一切"
 tenet_knowledge_above_all_desc:0 "伟大的奥秘太重要了，不能被琐碎的道德问题所牵制。"
 doctrine_parameter_experiments_on_prisoners:0 "解锁专属处决选项。"
 EXECUTION_EXPERIMENTS:0 "将其拿来做实验"
 tenet_moments_of_truth_name:0 "真实时刻"
 tenet_moments_of_truth_desc:0 "灵感的闪现？来自上位力量的信息？在任何情况下，这样重大的事件可以改变任何个人的核心。"
 doctrine_parameter_moments_of_truth:0 "让人有机会获得特殊的压力应对，在那里你可以改变你的特质。"
 stress_threshold.7001.t:0 "精神崩溃：真实时刻"
 stress_threshold.7001.desc:0 "你已经得到了启示。你目前的动荡是全能者的考验，以评估你的虔诚。这样难得的清明时刻可能是你立下誓言的机会。\n例如，你可以努力克服你的个性中的一些缺陷，好让你更接近神性。"
 stress_threshold.7001.a:0 "正义是为弱者而设的！"
 stress_threshold.7001.b:0 "我是否失去了人性？"
 stress_threshold.7001.c:0 "我必须保持专注。"
 stress_threshold.7001.d:0 "我需要更多！"
 stress_threshold.7001.e:0 "他们绝对是来抓我的！"
 stress_threshold.7001.f:0 "他们可能不是来抓我的？"
 tenet_honor_and_bravery_name:0 "荣誉与勇敢"
 tenet_honor_and_bravery_desc:0 "真正的黑夜统治者领头冲锋，无畏地斩断任何愚蠢到阻挡其崇高目的的敌人！"
 doctrine_parameter_battle_winning_prestige:0 "你能从战斗胜利中获得更多的威望。"
 tenet_community_name:0 "社群"
 tenet_community_desc:0 "好牧人照顾他的羊群。让它繁衍成长，不让掠夺者靠近它。"
 doctrine_parameter_access_to_develop_capital:0 "你能够使用开发首府决议，而且其压力代价更低。"
 tenet_svadharma_name:0 "自法"
 tenet_svadharma_desc:0 "这条心路的追随者认为，他们已经从轮回中堕落。使事情变得正确的唯一方法是遵循一套新的职责，帮助别人找到自己的道路，无论他们是否喜欢。"
 doctrine_parameter_access_to_improve_scheme:0 "你能够使用加速计谋决议。"
 tenet_lilithmaid_name:0 "莉莉丝——少女"
 tenet_lilithmaid_desc:0 "少女愤怒地诅咒着摆在她面前的命运。她不会成为任何人、国家、甚至是上帝的附属物。"
 tenet_lilithmother_name:0 "莉莉丝——母亲"
 tenet_lilithmother_desc:0 "少女成为受苦的母亲，终于明白痛苦是这世界上唯一不变的东西。"
 tenet_lilithcrone_name:0 "莉莉丝——老妪"
 tenet_lilithcrone_desc:0 "老妪已经在世界繁衍众多，现在用她的知识来引导他们进入这个世界。"
 tenet_aphrodisiac_saturnalia_name:0 "美神节与农神节"
