 tenet_obeisance_to_devils_name: "顺从魔鬼"
 tenet_obeisance_to_devils_desc: "我们存在于小神之下。我们必须不引人注意，超脱审视，以免招致我们的毁灭。"
 doctrine_parameter_hostility_override_tenet_obeisance_to_devils: "拥有[GetFaithDoctrine('tenet_obeisance_to_devils').GetBaseName][faiths|E]的[doctrine|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]，而非#V 敌对#!"
 doctrine_parameter_east_building_parameter: "东方[Glossary('心法','podgloss.dharma')]在公爵级龙穴建筑中获得与发展度和瘟疫抗性相关的加成。"
 doctrine_parameter_south_building_parameter: "南方[Glossary('心法','podgloss.dharma')]在公爵级龙穴建筑中获得与战争相关的加成。"
 doctrine_parameter_west_building_parameter: "西方[Glossary('心法','podgloss.dharma')]在公爵级龙穴建筑中获得与密谋相关的加成。"
 doctrine_parameter_north_building_parameter: "北方[Glossary('心法','podgloss.dharma')]在公爵级龙穴建筑中获得与正统性相关的加成。"
 doctrine_parameter_center_building_parameter: "中央[Glossary('心法','podgloss.dharma')]在公爵级龙穴建筑中获得与生活方式经验相关的加成。"
 doctrine_bloodsorcery_kufr_name: "异教徒"
 doctrine_bloodsorcery_kufr_desc: "阿什拉派公开承认魔法的存在，但警告信徒不要寻求术士的帮助。这样做是对真主阿拉缺乏信心的表现，因为祂是宇宙中唯一绝对的力量。同样，那些实践魔法的人，尤其是占卜未来者，试图篡夺祂的部分权力，因而犯下亵渎之罪，将被禁止进入天堂。\n\n然而，一些阿什拉派信徒实践一种他们认为符合阿拉意志的魔法。这种名为“西尔”的魔法从信仰中汲取力量，并避免其他传统的常见做法。"
 doctrine_parameter_bloodsorcery_kufr: "有[GetTrait('bloodsorcery').GetName( GetPlayer )][trait|E]的角色都被完全接纳"
 doctrine_parameter_non_sihr_bloodsorcery_learning_penalty: "学习任何非“西尔”的[bloodmagic_path|E]会消耗虔诚并招致额外惩罚。"
 doctrine_parameter_ashirra_second_embrace: "解锁特殊子嗣教育事件"
 doctrine_parameter_cannot_embrace_prisoners: "不能$pod_Embrace$[prisoners|E]"
 doctrine_parameter_willing_embrace_restrictions: "不能$pod_Embrace$#TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L 猎人#!, #TOOLTIP:GAME_TRAIT,ghoul,[GetNullCharacter] #L \n血仆#!，或#TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] #L 换生灵#!"
 tenet_mercy_for_vanquished_name: "对败者的仁慈"
 tenet_mercy_for_vanquished_desc: "一旦敌人投降，必须给予与其地位相称的尊严和尊重。如果俘虏或其家人无力支付赎金，应出于怜悯释放他们。\n\n战场上的敌人理应被杀死，但败者应受到礼遇，希望有朝一日他们能皈依正道。\n\n沉湎于过去或为往事懊悔毫无意义。战士只向前看，期待下一场战斗，并希望表现出色。"
 doctrine_parameter_frequent_kingdom_holy_wars: "对王国的[holy_wars|E]间隔从50年缩短为25年"
 doctrine_parameter_house_arrest_only: "[prisoners|E]只能被[house_arrest|E]"
 house_arrest_only_tooltip: "信仰仅允许[house_arrest|E]"
 doctrine_parameter_piety_from_releasing: "释放$hostility_hostile_tooltippable$或$hostility_evil_tooltippable$角色（无附加条件）可获得[piety|El]"
 doctrine_parameter_prisoner_conversion_higher_chance: "囚犯更可能为换取自由而接受改信"
 prisoner_conversion_higher_chance_tooltip: "你的信仰：$VALUE|=+0$"
 doctrine_parameter_executing_hostile_evil_vampires_costs_piety: "处决$hostility_hostile_tooltippable$或$hostility_evil_tooltippable$信仰的[GetTrait('vampire').GetName(GetPlayer)]角色会消耗[piety|El]"
 tenet_struggles_of_desert_name: "沙漠之试炼"
 tenet_struggles_of_desert_desc: "沙漠的子民被教导直面每一次挑战，仅凭真主赐予的品质渡过难关。面对逆境只有一种回应——以纯粹的勇气和智慧战胜它。\n\n这些吸血鬼不断驱使自己去考验自己的胆识与能力，欣然接受任何挑战，并以纯粹的才华和技巧取胜。他们偏爱流浪者日夜不息的试炼，那里没有庇护或给养的保证。"
 land_of_faith_controlled_name: "信仰之地"
 special_doctrine_land_of_faith_controlled_name: "信仰之地"
 special_doctrine_land_of_faith_controlled_desc: "信仰之地已归我们掌控，我们从其提供的塞赫中获益良多。"
 unproven_dharma_name: "未证[Glossary('心法','podgloss.dharma')]"
 special_doctrine_unproven_dharma_name: "未证[Glossary('心法','podgloss.dharma')]"
 special_doctrine_unproven_dharma_desc: "并非所有[Glossary('心法','podgloss.dharma')]都被证实能通往[Glossary('云开雾散','podgloss.hundredclouds')]。对于那些从未有过飞升记载的修行之道，深陷绝境的恐惧始终如影随形。"
 doctrine_parameter_unproven_dharma_parameter: ""
 doctrine_vampirism_evil_calomena_name: "$doctrine_vampirism_evil_name$"
 doctrine_vampirism_evil_calomena_desc: "$doctrine_vampirism_evil_desc$"
 doctrine_fera_name: "化兽族裔"
 doctrine_fera_evil_name: "邪恶"
 doctrine_fera_evil_desc: "与野兽不可能有和平或谈判。我们将把他们全部消灭，或者死而后已。"
 doctrine_fera_crime_name: "罪行"
 doctrine_fera_crime_desc: "$glossary_fera$必须消灭。"
 doctrine_fera_shunned_name: "忌讳"
 doctrine_fera_shunned_desc: "$glossary_fera$遭到排斥。"
 doctrine_fera_accepted_name: "接受"
 doctrine_fera_accepted_desc: "$glossary_fera$被接纳。"
 doctrine_parameter_fera_illegal: "拥有[GetTraitGroup('fera').GetName()][trait|E]的角色是[criminals|E]。"
 doctrine_parameter_fera_shunned: "拥有[GetTraitGroup('fera').GetName()][trait|E]的角色是[shunned|E]。"
 doctrine_parameter_fera_accepted: "有[GetTraitGroup('fera').GetName()][trait|E]的角色是被接纳的"
 doctrine_parameter_hunter_hunting_fera: "对有[GetTraitGroup('fera').GetName()][trait|E]的角色有#N -100#![opinion|E]减成"
 doctrine_fera_triat_alignment_group_name: "三相倾向"
 doctrine_fera_triat_alignment_balanced_name: "平衡"
 doctrine_fera_triat_alignment_balanced_desc: "即使$glossary_triat$不再维系平衡，许多$glossary_fera$仍然相信过去的秩序。"
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_balanced: "有[GetFaithDoctrine('doctrine_fera_triat_alignment_balanced').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_triat_alignment_wyld_name: "奇原"
 doctrine_fera_triat_alignment_wyld_desc: "$glossary_weaver$和$glossary_wyrm$的共同威胁导致多数$glossary_fera$在$glossary_triat$中最尊崇$glossary_wyld$，视其和盖亚需要保护。"
 doctrine_fera_triat_alignment_weaver_name: "织者"
 doctrine_fera_triat_alignment_weaver_desc: "只要人类存在，$glossary_weaver$的发展便永不止息。"
 doctrine_parameter_ignore_fera_dev_requirements: "忽略$glossary_fera$建筑的低[development|E]要求"
 doctrine_parameter_no_fera_dev_reduction: "信奉该[faith|E]的省份中，$glossary_fera$建筑不会降低[development|E]"
 doctrine_fera_triat_alignment_wyrm_name: "妖蛆"
 doctrine_fera_triat_alignment_wyrm_desc: "就像他们堕落的主人一样，$glossary_wyrm$之仆只追求混乱与破坏。"
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_wyrm: "有[GetFaithDoctrine('doctrine_fera_triat_alignment_wyrm').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_triat_alignment_triatic_wyrm_name: "三相妖蛆"
 doctrine_fera_triat_alignment_triatic_wyrm_desc: "$glossary_wyrm_triatic$是对原始$glossary_triat$的戏仿。妖蛆的三个头首赋予其最亲密的仆从强大的污秽力量。"
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_triatic_wyrm: "有[GetFaithDoctrine('doctrine_fera_triat_alignment_triatic_wyrm').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_triat_alignment_gaia_name: "盖亚"
 doctrine_fera_triat_alignment_gaia_desc: "盖亚是已知存在的最强大精魂之一——或许是最初且最为强大的存在。她被认为是狼族与多数化兽族裔的创造者，这些生灵作为她的战士与使者，活跃于物质界与灵界之中。她是自然之母，既孕育万物、充满生机，亦会在被触怒时展现残酷与冷漠。"
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_gaia: "有[GetFaithDoctrine('doctrine_fera_triat_alignment_gaia').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_litany_group_name: "化兽族裔律法"
 doctrine_fera_werewolf_litany_name: "律令制"
 doctrine_fera_werewolf_litany_desc: "狼族之法自古有之。各部族的传统虽各有不同，但所有狼人都必须铭记并恪守名为律令的核心法典。完整的律令既是一部史诗，也是一部法规。唯有最渊博的学者方能精通律令全篇，而多数狼人仅习得其基本戒律。每条戒律皆有其实践根基，但并非所有戒律都被视为绝对不容置疑的道德准则。"
 doctrine_parameter_hostility_override_doctrine_fera_werewolf_litany: "有[GetFaithDoctrine('doctrine_fera_werewolf_litany').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_werewolf_dark_litany_name: "黑暗律令"
 doctrine_fera_werewolf_dark_litany_desc: "黑暗律令即$glossary_wyrm$律令，由黑螺旋舞者所奉行。其内容如下：服务于妖蛆的意志、尊重强者的力量、所有不被禁止的都是被允许的、纵容你的欲望。尽管黑旋舞者常被视作无法无天、混乱无序的部族，但其对自身律令的恪守往往比狼国更为严苛。"
 doctrine_parameter_hostility_override_doctrine_fera_werewolf_dark_litany: "有[GetFaithDoctrine('doctrine_fera_werewolf_dark_litany').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_bastet_karoush_name: "卡鲁什"
 doctrine_fera_bastet_karoush_desc: "卡鲁什是猫人的律法法典，类似于狼族的律令。这些律法由先祖传承而来，其权威超越任何猫人个体，也高于任何等级或头衔。它们是猫人的荣誉准则，猫人相信这些律法将他们与人类区分开来，使其免受人性弱点的侵蚀。卡鲁什是先祖制定的法典，包含月阳之法》《秘形之法》与《化形之法》，其核心为五大戒律：尊己、守信、护亲、敬土、守默。"
 doctrine_parameter_hostility_override_doctrine_fera_bastet_karoush: "有[GetFaithDoctrine('doctrine_fera_bastet_karoush').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_fallen_tribe_name: "堕落部族"
 doctrine_fera_fallen_tribe_desc: "一些化兽族裔的部族背离了最初的使命。原因可能多种多样，从理念分歧到灵性腐化，但结局都殊途同归。这些堕落者被母族孤立（最好的情况）或追杀（最糟的情况），只能蛰伏于阴影中，终日畏惧着昔日同袍的刀刃。"
 doctrine_parameter_hostility_override_doctrine_fera_fallen_tribe: "有[GetFaithDoctrine('doctrine_fera_fallen_tribe').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_pact_group_name: "化兽族裔盟约"
 doctrine_fera_werewolf_pact_name: "狼族盟约"
 doctrine_fera_werewolf_pact_desc: "出于种种原因，这一信仰的信徒与#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L 狼族#!建立了紧密联系。这些野蛮凶悍的部族虽不易结交，但一旦立下誓言便会恪守不渝。"
 doctrine_parameter_hostility_override_doctrine_fera_werewolf_pact: "有[GetFaithDoctrine('doctrine_fera_werewolf_pact').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_bastet_pact_name: "芭丝特盟约"
 doctrine_fera_bastet_pact_desc: "由于种种原因，该信仰的信徒与[GetTrait('bastet').GetName( GetPlayer )]建立了紧密联系。猫族天性好奇，这为他们赢得了许多意想不到的朋友……"
 doctrine_parameter_hostility_override_doctrine_fera_bastet_pact: "有[GetFaithDoctrine('doctrine_fera_bastet_pact').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_wyrm_pact_name: "妖蛆盟约"
 doctrine_fera_wyrm_pact_desc: "出于某种原因，该信仰的信徒对$glossary_wyrm$的追随者表现出一定程度的容忍。至于后者是否同样宽容，则取决于其一时兴起。毕竟在这螺旋之舞中，容身之处终究有限。"
 doctrine_parameter_hostility_override_doctrine_fera_wyrm_pact: "有[GetFaithDoctrine('doctrine_fera_wyrm_pact').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_alliance_group_name: "化兽族裔联盟"
 doctrine_fera_beast_courts_name: "兽庭"
 doctrine_fera_beast_courts_desc: "在$glossary_fera$中，跨物种联盟是很罕见的。其中最明显地是兽庭，他们发誓要保卫玉母（盖亚）。在兽庭中，有一个类似于神秘亚洲的天朝的社会，有执政者、廷臣和普通民众。任何$glossary_fera$都可以自由加入兽庭，只要他们发誓遵守被称为“翡翠美德之道”的荣誉与声望体系。"
 doctrine_parameter_hostility_override_doctrine_fera_beast_courts: "有[GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 tenet_vanilla_pursuit_of_knowledge_name: "追寻知识"
 tenet_vanilla_pursuit_of_knowledge_desc: "对知识的执着追求。罪孽包括：没有在有机会的时候进行研究，拒绝进行实验，拒绝与心路同道者分享自己的见解。"
 doctrine_parameter_can_perform_vaulderie: "可以通过[decision|E]与[coterie|E]成员举行血盟仪式"
 doctrine_parameter_overwork_capital_unlocked: "解锁 #V $overwork_capital_decision$#![decision|E]，以增加[development|E]，但需要付出[prestige|E]与[masquerade_exposure_with_icon|E]"
 tenet_amakusa_rite_name: "天草仪式"
 tenet_amakusa_rite_desc: "通过在共用的圣碗中混合$pod_vitae$，并辅以适当的仪式与敬意，那些打破压迫并在黑夜下使众生平等的圣酿，或可解放血族，使其永恒的革命得以继续，无需畏惧血誓束缚，也不缺乏施行革命的手段。"
 tenet_cruelty_of_stars_name: "星辰的残暴"
 tenet_cruelty_of_stars_desc: "每一笔巨额财富的背后，都隐藏着滔天的罪行。凡人是肉，而嗜血者便是食客。开悟是穷人的把戏。驱使他们、击垮他们、从他们身上榨取，再迫使他们挣回一切，并让他们深信这是一笔划算的交易。任他们称你为崇魔者——你自有生财之道。"
 tenet_one_blade_name: "人剑合一"
 tenet_one_blade_desc: "八犬是化兽族裔最杰出的战士与守护者。为此，他们中的许多人毕生致力于钻研刀剑之道。"
 doctrine_parameter_katana_crafting: "[crafting_forged|E]剑总会是武士刀"
 doctrine_parameter_no_sword_fetish_upkeep: "剑和武士刀[fetishes|E]不再需要$POD_energy_gnosis$维持"
 doctrine_parameter_pack_training_blademaster: "与你的[GetPlayer.Custom('PODCoterie')]训练[prowess|E]将给予[GetTrait('lifestyle_blademaster').GetName(GetPlayer)][trait_level_track_xp|E]"
 tenet_vengence_sobek_name: "索贝克复仇"
 tenet_vengence_sobek_desc: "大地将被净化。江河将奔流不息。清风将吹拂四方。神庙将被重新祝圣。烈日将熊熊燃烧。毒蛇将尽数焚毁。"
 tenet_flames_agni_name: "阿耆尼之焰"
 tenet_flames_agni_desc: "虽然所有魔克拉都尊崇神龙，但宇宙秩序的追随者称其为阿耆尼——火神、祭品承载者与瓦尼之语者。阿耆尼既强大又睿智，他的火焰庇护着追随者，焚毁着敌人。\n他每一位选中的子嗣心中都燃烧着永恒不灭的火焰，他们只需将其点燃。"
 doctrine_parameter_unlock_agni_totem: "在[GetPlayer.Custom('PODCoterie')]图腾选择中，以[GetModifier('agni_totem_modifier').GetNameWithTooltip]取代[GetModifier('dragon_totem_modifier').GetNameWithTooltip]。"
 doctrine_parameter_gain_fire_immunity: "获得对火焰伤害的免疫能力"
 tenet_lords_rivers_name: "江河之主"
 tenet_lords_rivers_desc: "许多中龙选择栖息于中华大地的江河之畔。水之流脉赋予它们对江河可怖的掌控力——一条年轻的魔克拉通常只能勉强驾驭溪流，而龙人则可令整条江河改道。\n龙人在施展此类力量时极为克制，否则将对大地带来灾难性的后果。"
 doctrine_parameter_gnosis_from_river_provinces: "该信仰拥有的沿河[counties|E]可获得$POD_energy_gnosis$回复：#P 2.5%#!。"
 doctrine_parameter_reduces_flood_weather_cost: "降低#V 洪水#!天气魔法消耗。"
 tenet_dragon_princes_name: "龙君"
 tenet_dragon_princes_desc: "和迩乃是中华之龙君，司掌云雨、统御水脉，执掌人间王朝。身具龙形真身的中华龙族，皆为和迩后裔。此说偶遭异族质疑，然雷霆骤降之际，众生皆当重审此言。"
 doctrine_parameter_can_learn_galliard_gifts: "可从[lunar_auspicegifts_lifestyle|E][lifestyle|E]中学习[GetTrait('galliard').GetName( GetPlayer )]天赋。"
 tenet_outlast_world_name: "寿逾世界"
 tenet_outlast_world_desc: "我们不需要任何人，只需依靠自己。我们的皮甲坚厚，诸灵强韧。纵使世界崩裂，我们依然屹立不倒。"
 tenet_pilgrims_waves_name: "波涛朝圣"
 tenet_pilgrims_waves_desc: "海洋蕴藏着巨大的危险和智慧，只有航行于其中，我们才能磨练精神。逆境可以孕育希望和韧性。"
 doctrine_parameter_dreaming_sands_pilgrimage: "完成[pilgrimages|E]奖励漫游者[lifestyle_experience|E]和$glossary_fera$$POD_fera_renown_wisdom$声望"
 doctrine_parameter_faith_can_raid_oversea: "允许跨海[raiding|E]"
 tenet_gaia_memory_name: "盖亚的记忆"
 tenet_gaia_memory_desc: "我们的职责始终是盖亚的记忆。我们有责任引导其他化兽种族，并向他们传授$glossary_fera$的悠久历史以及盖亚赋予我们的任务。"
 doctrine_parameter_pack_training_coterie_xp: "与你的[GetPlayer.Custom('PODCoterie')]训练奖励所有成员$glossary_fera$$POD_fera_renown_wisdom$声望"
 tenet_sun_blessed_name: "太阳祝福"
 tenet_sun_blessed_desc: "赫利俄斯天神仅赐予其恩惠于两$glossary_fera$，[GetTrait('mokole').GetName(GetNullCharacter)]和[GetTrait('corax').GetName(GetNullCharacter)]。\n阳光的温暖使身体充满活力，心灵得到平静。太阳是一个奇妙的天体，就像一位伟大的父亲。"
 tenet_eastern_mokole_name: "东方魔克拉"
 tenet_eastern_mokole_desc: "亚洲的魔克拉已经学会适应这片土地上流传的各种凡人和超自然信仰。尽管他们仍然认为自己的信仰远胜于其他信仰，但他们仍然愿意包容年轻种族的信仰。"
 doctrine_fera_mokole_duties_name: "职责"
 doctrine_fera_mokole_duties_desc: "赫利俄斯赋予了祂的子女们一系列道德与个人准则，供他们遵循一生。这些准则被称为职责，是魔克拉版本的狼族律令。每一项职责都与一个日兆相对应，尽管所有魔克拉都受其约束。违反职责要义将招致斥责、地位丧失及其他惩罚。严重者将被吞噬。虽然正午之日会执行这些律法，但即便是子夜之日也会惩戒不忠职守的魔克拉。"
 doctrine_parameter_hostility_override_doctrine_fera_mokole_duties: "有[GetFaithDoctrine('doctrine_fera_mokole_duties').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_fera_mokole_pact_name: "魔克拉之契"
 doctrine_fera_mokole_pact_desc: "由于种种原因，该信仰的信徒与[GetTrait('mokole').GetName( GetNullCharacter )]建立了紧密联系。蜥蜴人是顽强的团体，凭借其龙梦，他们不会忘记朋友，更不会忘记敌人。"
 doctrine_parameter_hostility_override_doctrine_fera_mokole_pact: "有[GetFaithDoctrine('doctrine_fera_mokole_pact').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 zhong_guo_reward_doctrine_name: ""
 special_zhong_guo_reward_doctrine_name: "龙的指引 "
 special_zhong_guo_reward_doctrine_desc: "中龙族引领着[GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName]走向了前所未有的繁荣。"
 doctrine_demonology_name: "恶魔学"
 doctrine_demonology_crime_name: "罪恶"
 doctrine_demonology_crime_desc: "研究$POD_splat_demon_plural$就等于成为其奴隶"
 doctrine_demonology_shunned_name: "忌讳"
 doctrine_demonology_shunned_desc: "那些研究地狱至暗深渊者，只有毁灭在等着他们。"
 doctrine_demonology_accepted_name: "接纳"
 doctrine_demonology_accepted_desc: "$POD_splat_demon_plural$研究是有价值的事业。"
 masterless_ghoul_dispossessed_doctrine_name: ""
 special_masterless_ghoul_dispossessed_doctrine_name: "无依者之盟"
 special_masterless_ghoul_dispossessed_doctrine_desc: "多亏了我们的支持，血仆的支持网络现在已经远远超出圣地范围。"
 doctrine_parameter_masterless_ghoul_dispossessed_parametr: "[ghouls|E]的邀请至[court|e]和成为[schemes|E]共谋的接受度：#P +50#!"
 masterless_ghoul_folch_cutthroats_doctrine_name: ""
 special_masterless_ghoul_folch_cutthroats_doctrine_name: "福尔奇杀手团之盟"
 special_masterless_ghoul_folch_cutthroats_doctrine_desc: "利用其愤怒来打击我们的敌人，这将成为一笔宝贵的资产。"
 doctrine_parameter_masterless_ghoul_folch_cutthroats_parametr: "[casus_belli|E]花费：#P -20%#!"
 masterless_ghoul_order_of_st_panteleimon_doctrine_name: ""
 special_masterless_ghoul_order_of_st_panteleimon_doctrine_name: "圣庞大良骑士团之盟"
 special_masterless_ghoul_order_of_st_panteleimon_doctrine_desc: "该隐教会曾经的官僚机构虽仍然是某种意义上的异端，但他们现在是\"我们的\"异端了。"
 doctrine_parameter_masterless_ghoul_order_of_st_panteleimon_parametr: "你的[court_chaplain|E][convert_county|E][councillor_task|E]加快#P 100%#!"
 masterless_ghoul_haqims_assassins_doctrine_name: ""
 special_masterless_ghoul_haqims_assassins_doctrine_name: "\"伪\"哈基姆的刺客之盟"
 special_masterless_ghoul_haqims_assassins_doctrine_desc: "无论是靠运气还是实力，我们显然都希望能够长期挫败阿刹迈的那个人站在我们这边。"
 special_doctrine_osirian_league_name: "奥西里斯联盟"
 special_doctrine_osirian_league_desc: "尽管战败，$glossary_osirian_league$对抗赛特的斗志不灭。"
