 tenet_constantinian_name: "君士坦丁派神学"
 tenet_constantinian_desc: "寻求了解人类信仰细节的妖精总是被视为追求相当无用的学术道途——直到现在。在誓约休战的年代里，君士坦丁派的成员数量大增。以君士坦丁一世的名字命名，这些妖精寻求了解人类宗教的更多，尤其是基督教会。\n\n那些走这条研究和推理之路的人往往出于两个主要原因之一：了解信仰现象，并找到一种方法来平衡它与妖精在世界中的位置；或者寻找人类新力量中的任何弱点，并找到一种方法来利用它。"
 changeling_rebirth_name: "换生灵转生"
 changeling_rebirth_doctrine_name: "换生灵转生"
 changeling_rebirth_doctrine_desc: "当换生灵的人类部分死亡时（板讷之死），妖精自我可以继续存活，但该换生灵将永远不会再存在。平民会重生到另一个人类宿主身上，这个宿主的外表和教育将不与之前的凡人形象相同。"
 doctrine_parameter_hurt_mortal_lose_piety: "严重伤害或杀死凡人时失去[piety_i][piety|E]"
 doctrine_parameter_frenzy_lose_piety: "血狂时失去[piety_i][piety|E]"
 doctrine_enlightenment_virtues_direction_north_name: "北"
 doctrine_enlightenment_virtues_direction_north_desc: "冷酷、公正和遵循逻辑，北属的[GetTrait('kueijin').GetName( GetNullCharacter )]担任法官和治安官，通常负责解决争端并追捕罪犯和[akuma|E]。"
 doctrine_enlightenment_virtues_direction_east_name: "东"
 doctrine_enlightenment_virtues_direction_east_desc: "通常被认为最怡于呆在在凡人中，东属的[GetTrait('kueijin').GetName( GetNullCharacter )]被认为是农民，培养障幕和照顾他们的凡人群众。"
 doctrine_enlightenment_virtues_direction_south_name: "南"
 doctrine_enlightenment_virtues_direction_south_desc: "以脾气凶恶而闻名的南属[GetTrait('kueijin').GetName( GetNullCharacter )]是社会的推动者，他们挑战破旧迷信，使五行宗保持最新的面貌。虽然他们的伙伴们经常认为他们令人难以忍受，但他们因其强大的智力和战斗力而被长老们所容忍。"
 doctrine_enlightenment_virtues_direction_west_name: "西"
 doctrine_enlightenment_virtues_direction_west_desc: "作为中原[spirit_worlds|E]的大使，偶尔也作为上官的刺客，西属[GetTrait('kueijin').GetName( GetNullCharacter )]往往被他们的同僚所不齿。他们以毫不留情而闻名，并以绝对精确的方式完成每一项任务——不管是灵类、死灵还是上官的任务。"
 doctrine_enlightenment_virtues_direction_center_name: "中"
 doctrine_enlightenment_virtues_direction_center_desc: "中属的[GetTrait('kueijin').GetName( GetNullCharacter )]通常负责指导年轻的中原族裔了解其社会的细微差别，但许多人选择探索自己的灵魂，致力于心法的开悟。"
 doctrine_kueijin_evil_name: "邪恶"
 doctrine_kueijin_evil_desc: "万鬼与印度该隐之子之间的永恒之战永不和解。"
