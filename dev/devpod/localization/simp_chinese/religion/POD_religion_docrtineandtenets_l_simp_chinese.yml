 doctrine_demonic_crime_name: "罪行"
 doctrine_demonic_crime_desc: "崇魔意味着将地狱带上人间大地。不要与黑暗交易：届时其将带走我们所有。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现崇魔者需追杀并将其消灭。"
 doctrine_demonic_shunned_name: "忌讳"
 doctrine_demonic_shunned_desc: "与恶魔契约者已种下他们的消亡。不要与黑暗交易：届时其将带走我们所有。记住：撒旦的子嗣，古蛇一族，其之触碰亦将焚烧汝辈，且其之口舌还将蛊惑欺诈于汝辈。无论何地发现崇魔者需追杀并将其消灭。"
