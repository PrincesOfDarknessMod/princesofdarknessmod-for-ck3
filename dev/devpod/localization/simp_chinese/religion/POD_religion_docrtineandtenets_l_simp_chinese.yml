 fae_morality_unseelie_opinion_active_opinion_name: "哀怒廷"
 special_doctrine_fae_militants_hostility_name: "尚武派派系"
 special_doctrine_fae_militants_hostility_desc: "尚武派希望摒弃誓约休战，重启四季之战"
 special_doctrine_fae_trucebearers_hostility_name: "休战派派系"
 special_doctrine_fae_trucebearers_hostility_desc: "休战派希望能保持誓约休战，让四季王廷轮流统治。"
 special_doctrine_fae_humanists_hostility_name: "人文派派系"
 special_doctrine_fae_humanists_hostility_desc: "人文派痴迷于人类，想要爱，又或控制他们。"
 special_doctrine_fae_constantinians_hostility_name: "君士坦丁派派系"
 special_doctrine_fae_constantinians_hostility_desc: "君士坦丁派被教会日益增长的力量所震慑，试图在其中为自己谋得一席之地。"
 special_doctrine_fae_undecided_hostility_name: "摇摆派派系"
 special_doctrine_fae_undecided_hostility_desc: "对恢复四季之战模棱两可，摇摆派还没有在妖精王廷之间的再起冲突中选择一条道路。"
