 tenet_summer_festivals_name: "夏日节庆"
 tenet_summer_festivals_desc: "夏之王廷以遵守传统和结构、严格遵守纪律而自豪。其中一部分传统是在夏季最炎热的时候举办受欢迎的节庆，这些节日象征着笑声、欢乐和自由。它们提供了一个借口，让妖精们从人类的炎热梦境中尽可能地聚集梦华，而在节日持续期间，妖精们被允许玩弄遇到的任何凡人。仲夏庆典允许喜乐廷精灵在一天之内毫不羞愧地将凡人当作玩物，并沉溺于戏谑和恶作剧之中。"
 tenet_oath_truce_name: "誓约休战"
 tenet_oath_truce_desc: "“休战派”是一个用来形容那些试图通过无限延长誓约休战或缔结一个新的持久条约来结束四季之战的妖精的术语。"
 tenet_summer_traditions_name: "夏日传统"
 tenet_summer_traditions_desc: "夏妖精对主从责任极为重视。公正地御下应导致封臣幸福。封臣的赞许意味着领主的成功。"
