 allied_to_anda_opinion_active_county_opinion_name: "同伙"
 doctrine_werewolf_veil_name: "迷障"
 doctrine_werewolf_veil_shall_not_lifted_name: "不可被揭开"
 doctrine_werewolf_veil_should_not_lifted_name: "不应被揭开"
 doctrine_werewolf_veil_should_not_lifted_desc: "迷障是一个有诗意的术语，指的是认为超自然现象不存在的错误假设，而妄悸则强化了这种假设。迷障是通过九千年前的“狼族协约”正式制定的，它结束了“刀耕之治”。律令明确指出，“迷障不可被揭开”。妄悸有助于保持迷障。伤害或撕毁迷障意味着在狼族中失去了巨大的荣誉，而修复迷障则意味着相反的情况。实际上，妄悸做了大部分的工作，狼族基本上不需要为此烦恼。一些部族认为它更多地是一种准则，而不是要强制执行的严格规则。"
 doctrine_werewolf_veil_should_does_not_matter_name: "这不重要"
 doctrine_werewolf_veil_should_does_not_matter_desc: "迷障是一个有诗意的术语，指的是认为超自然现象不存在的错误假设，而妄悸则强化了这种假设。迷障是通过九千年前的“狼族协约”正式制定的，它结束了“刀耕之治”。律令明确指出，“迷障不可被揭开”。妄悸有助于保持迷障。伤害或撕毁迷障意味着在狼族中失去了巨大的荣誉，而修复迷障则意味着相反的情况。一些狼人发现，迷障是一个过时的想法，不再重要了。有些人甚至积极努力地推翻迷障，以便狼人能够再次恢复刀耕之治，公开威慑全人类。"
 tenet_werewolf_oaths_desc: "宣誓是一人可以达成的最神圣的约束。违背誓言的领导人没有荣誉，并会将要将所有人带入其的腐化。"
 tenet_helios_truth_name: "赫利俄斯的真言"
 tenet_helios_truth_desc: "赫利俄斯教狼族用思考和逻辑来控制他们的本能和愤怒。因此，那些追随他的人往往成为熟练的外交家和谈判者。实现休战、条约或联盟的最大问题往往是让对方听从说客提出的论点。赫利俄斯重视真理和正义。赫利俄斯给尊敬他的狼人带来了理性和策略。"
 tenet_ivory_priesthood_name: "象牙圣职"
 tenet_ivory_priesthood_desc: "当第一只狼为了拯救盖亚而死时，它得知了“死亡的奥秘”。象牙圣职是一个由银牙通神者组成的秘密社团，他们在经历了一系列的精神考验和核查后，开始学习同样的秘密，了解死亡的尸幕之外的事物。"
 tenet_hexcraft_name: "巫术"
 tenet_hexcraft_desc: "精通邪眼、恶咒、厄运、诅心。小心不要过线，否则你会发现自己在承受诅咒的一端。你的胆会被扭曲成结，让你在一周内像个小熊一样无力地呕吐。他们的咒语帮助他们实施各种阴险的计谋。"
 tenet_vengeance_of_nut_name: "努特的复仇"
 tenet_vengeance_of_nut_desc: "那些为努特寻求复仇的人致力于消灭吸血鬼。他们为失去的故乡和失去的亲属复仇。努特之匕在任何地方都扮演着刺客的角色，默默地选择一到三只蚂蟥进行灭绝。遵循此法的人善于对吸血鬼“寻找巢穴”。"
 tenet_way_of_zhong_kuei_name: "钟馗之道"
 tenet_way_of_zhong_kuei_desc: "由钟馗开发的平息不死族恶魔的方法。遵循此法的人善于对吸血鬼“寻找巢穴”。"
 tenet_banepossession_name: "忌灵附身"
 tenet_banepossession_desc: "忌灵是为妖蛆服务的邪恶灵类。忌灵的种类很广，从弱小的、相对无害的到可怕的、能够撕裂周围现实的强大生物都有。弱小的忌灵经常被用来污染人类和动物，把他们变成堕妖。为忌灵寻找宿主被妖蛆邪教视为一项神圣的任务。"
 past_lives_name: "前世"
 past_lives_doctrine_name: "前世"
 past_lives_doctrine_desc: "对于最伟大的英雄来说，死亡并不是终点。最有智慧和最强壮的狼族继续存在，作为灵留在那里，指导他们的后代进行伟大的斗争。星占和盖亚之子将其视为狼族英雄在其后代中的实际转世。有些人觉得这更像是一个集体的种族记录，就像阿卡夏记录一样。其他狼族认为它更像是祖灵的指导。所来的幻象可以分享重要的智慧，甚至是实用的技能。有时，似乎狼族甚至被他们祖灵所占有。更为罕见的是，这位先祖曾经而且显然仍然是个疯子。"
 wyrm_tainted_name: "$glossary_wyrm$眷染"
 wyrm_tainted_doctrine_name: "$glossary_wyrm$眷染"
 wyrm_tainted_doctrine_desc: "许多狼人和其他崇尚盖亚的$glossary_fera$都有一种天赋，使他们能够感觉到其他人身上的$glossary_wyrm$污染。许多吸血鬼的教化心路被认为是如此腐败，以至于这些信仰的追随者天生就被视为受到妖蛆的侵蚀。"
 doctrine_parameter_hostility_override_wyrm_tainted_doctrine: "有[GetFaithDoctrine('wyrm_tainted_doctrine').GetBaseName]的[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 tenet_bacchanal_name: "酒神节"
 tenet_bacchanal_desc: "致力于醉生梦死的狂欢，有些人会认为消费这种毒素是一种危险的成瘾。这一信条使饮酒决议的减压效果加倍。"
 tenet_neter_sentra_name: "仙草"
 tenet_neter_sentra_desc: "神圣地吐息：祈祷被烟雾带向天堂。神圣烟雾的崇拜者采取了新颖的创新，不只是食用大麻，而是吸它们。他们尝试使用各种奇异的香精和潜在的危险烟雾。这一信条使吸食大麻决议的减压效果加倍。"
 tenet_paranoia_name: "妄想症"
 tenet_paranoia_desc: "他们不会因为你有妄想症就不来袭击你！"
 doctrine_parameter_find_the_lair_active: "解锁寻找巢穴[journey|E]"
 doctrine_parameter_hunter_hunting_ghoul: "对有[ghoul|E][trait|E]的角色有#N -100#![opinion|E]减成"
 hunter_hunting_name: "猎人对超自然"
 doctrine_kueijin_name: "[Glossary('饿殍','game_concept_kuei_jin_desc')]"
 doctrine_kueijin_crime_name: "罪行"
 doctrine_kueijin_crime_desc: "[GetTrait('kueijin').GetName( GetPlayer )]必须被消灭。"
 doctrine_kueijin_shunned_name: "忌讳"
 doctrine_kueijin_shunned_desc: "[GetTrait('kueijin').GetName( GetPlayer )]是受忌讳的。"
 doctrine_kueijin_accepted_name: "接纳"
 doctrine_kueijin_accepted_desc: "[GetTrait('kueijin').GetName( GetPlayer )]是被接纳的。"
 doctrine_parameter_kueijin_shunned: "有[GetTrait('kueijin').GetName( GetPlayer )][trait|E]的角色都被[shunned|E]"
 doctrine_parameter_kueijin_accepted: "有[GetTrait('kueijin').GetName( GetPlayer )][trait|E]的角色是被接纳的"
 anda_hostility_name: "[Glossary('安答','podgloss.anda')]敌对度"
 special_doctrine_allied_to_anda_hostility_name: "机会主义盟友"
 special_doctrine_allied_to_anda_hostility_desc: "[akuma|E]视[Glossary('安答','podgloss.anda')]视为渗透和间接破坏，并帮助他们扰乱传统的皇朝。"
 special_doctrine_against_to_anda_hostility_name: "记仇[Glossary('万鬼','game_concept_kuei_jin_desc')]"
 special_doctrine_against_to_anda_hostility_desc: "随着蒙古部落的联合，[Glossary('安答','podgloss.anda')]像风暴一样紧随其后，削弱了[Glossary('万鬼','game_concept_kuei_jin_desc')]的统治，挑起一场唯有以一方的死亡方能终结的世仇。"
 doctrine_parameter_hostility_override_special_doctrine_allied_to_anda_hostility: "拥有[GetFaithDoctrine('special_doctrine_allied_to_anda_hostility').GetBaseName][doctrine|E]的其他[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 doctrine_parameter_hostility_override_special_doctrine_against_to_anda_hostility: "拥有[GetFaithDoctrine('special_doctrine_against_to_anda_hostility').GetBaseName][doctrine|E]的其他[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 doctrine_parameter_city_aversion: "无法建筑象征对城市事务影响的建筑物，被乡野影响建筑取代。"
 tenet_old_ways_name: "原始传统"
 tenet_old_ways_desc: "自从凡俗北欧人崇尚并追随富商和狡猾的贵族而不是最大胆的劫掠者以来，已经过去了数个世纪。许多吸血鬼认为这是最可悲的发展。"
 doctrine_parameter_hostility_override_wraiths_hostility_doctrine: "[GetTrait('wraith').GetName( GetNullCharacter )][faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_demons_hostility_doctrine: "[GetTrait('demon').GetName( GetPlayer )][faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 tenet_advocatus_diaboli_name: "魔鬼的代言人"
 tenet_advocatus_diaboli_desc: "撒旦和他的爪牙有强大的说服力，一种不可思议的能力，可以欺骗他人做事，以促进他们的恶魔目标。"
 tenet_collectivism_name: "集体主义"
 tenet_collectivism_desc: "源自古中国统一主义的利维坦之道致力于构建出一个利维坦一般的集体，通过柔性的教化和硬性的律令催生躯士的集体观念，最终创造出统一的集体意志，像单细胞生物变成多细胞生物一样实现精神层面的进化。"
 tenet_wolves_of_sable_name: "紫貂之狼"
 tenet_wolves_of_sable_desc: "紫貂是流浪的隐形猎手；寂静沉思，耐心等待，毫无征兆地出手，然后又消失在冰、雪和风中，只留下一两滴血作为她曾经存在的证据。她是小型的幸存者，因周围环境而变得坚强，因孤独而变得温和。她代表了出乎意料的女猎手和在最艰难的情况下适者生存。紫貂的孩子被风之灵视为盟友，可以自由地召唤它们并与它们交谈。紫貂依靠她的孩子来保护她的西伯利亚领地。猎鹰把所有紫貂的孩子看作是不光彩的、混血的野蛮人，在任何情况下，猎鹰都不会容忍一位西伯勒克加入他自己选择的族群。"
 special_doctrine_lilith_pillars_kindred_name: "莉莉丝派支柱"
 special_doctrine_lilith_pillars_kindred_desc: "莉莉丝要向该隐的子嗣复仇。但必要时，她也会接受热心的皈依者或有用的棋子。"
 doctrine_parameter_hostility_override_special_doctrine_lilith_pillars_kindred: "拥有[GetFaithDoctrine('special_doctrine_lilith_pillars_kindred').GetBaseName][doctrine|E]的其他血族[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_evil_tooltippable$"
 doctrine_parameter_access_to_underworld: "允许在[umbra|E]漫游时进入[UmbraGlossaryLocalized('shadowlands','冥界')]。"
 seasons_time_name: "四季"
 doctrine_winter_time_name: "冬季"
 doctrine_winter_time_desc: "冬天给予了冬之王廷优势"
 doctrine_spring_time_name: "春季"
 doctrine_spring_time_desc: "春天给予了春之王廷优势"
 doctrine_summer_time_name: "夏季"
 doctrine_summer_time_desc: "夏天给予了夏之王廷优势"
 doctrine_autumn_time_name: "秋季"
 doctrine_autumn_time_desc: "秋天给予了秋之王廷优势"
 doctrine_fae_agenda_name: "议程"
 doctrine_fae_agenda_militant_name: "尚武派"
 doctrine_fae_agenda_militant_desc: "许多妖精都渴望誓约休战结束，以便他们可以回到四季之战中。受染加入王廷后所激发的强烈情感和忠诚很难在任何事上放下。几乎每个四大王廷的成员都真心相信他们的生活方式是正确的，无论是为了所有人创造一个更美好的世界，还是只是认为让最强者掌权。对于许多派系化的妖精来说，战争的恢复并不是什么可怕的事情，而是一个信号，表明决定世界命运的战斗终于可以开始了。"
 doctrine_fae_agenda_trucebearer_name: "休战派"
 doctrine_fae_agenda_trucebearer_desc: "“休战派”是一个用来形容那些试图通过无限延长誓约休战或缔结一个新的持久条约来结束四季之战的妖精的术语。所有王廷的休战派往往是孤立的个体或小团体，他们热衷于在社交领域努力，以影响当地的王廷朝着和平的方向发展。毫不奇怪，他们很少能够成功，但这只会激起他们内心的热情。无论代价如何，和平是他们的使命。"
 doctrine_fae_agenda_humanist_name: "人文派"
 doctrine_fae_agenda_humanist_desc: "人文派并不一定主张在与人类打交道时表现出善良和宽容，而是主张关注人类的伦理道德。人类如今的数量和力量已经超过了妖精本身所拥有的。人文派认为现在是收集关于人类的信息、与他们交流、缔结新的誓言，并在各个方面寻求两个种族之间的平衡的时候，否则就会太迟了。他们希望与人类实现一种相互依存的关系，让妖精再次被承认，并且被珍视和尊重……或者只是被重视和害怕。"
 doctrine_fae_agenda_constantinian_name: "君士坦丁派"
 doctrine_fae_agenda_constantinian_desc: "君士坦丁派能使用[GetTrait('supehunter').GetName( GetPlayer )]的[GetScheme('inquihunt').GetTypeName][hostile_scheme|E]来对付[GetTrait('vampire').GetName( GetPlayer )]。\n\n$tenet_constantinian_desc$"
 doctrine_fae_agenda_none_name: "摇摆派"
 doctrine_fae_agenda_none_desc: "不受任何议程的吸引。尚武派、休战派、人文派和君士坦丁派都有各自的观点，而许多妖精尚未决定前进的方向。"
