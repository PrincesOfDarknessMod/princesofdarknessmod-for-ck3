 doctrine_werewolf_veil_name:0 "迷障"
 doctrine_werewolf_veil_shall_not_lifted_name:0 "不可被揭开"
 doctrine_werewolf_veil_shall_not_lifted_desc:0 "迷障是一个有诗意的术语，指的是认为超自然现象不存在的错误假设，而月狂则强化了这种假设。迷障是通过九千年前的“狼族协约”正式制定的，它结束了“刀耕之治”。律令明确指出，“迷障不可被揭开”。月狂有助于保持迷障。伤害或撕毁迷障意味着在狼族中失去了巨大的荣誉，而修复迷障则意味着相反的情况。"
 doctrine_werewolf_veil_should_not_lifted_name:0 "不应被揭开"
 doctrine_werewolf_veil_should_not_lifted_desc:0 "迷障是一个有诗意的术语，指的是认为超自然现象不存在的错误假设，而月狂则强化了这种假设。迷障是通过九千年前的“狼族协约”正式制定的，它结束了“刀耕之治”。律令明确指出，“迷障不可被揭开”。月狂有助于保持迷障。伤害或撕毁迷障意味着在狼族中失去了巨大的荣誉，而修复迷障则意味着相反的情况。实际上，月狂做了大部分的工作，狼族基本上不需要为此烦恼。一些部族认为它更多地是一种准则，而不是要强制执行的严格规则。"
 doctrine_werewolf_veil_should_does_not_matter_name:0 "这不重要"
 doctrine_werewolf_veil_should_does_not_matter_desc:0 "迷障是一个有诗意的术语，指的是认为超自然现象不存在的错误假设，而月狂则强化了这种假设。迷障是通过九千年前的“狼族协约”正式制定的，它结束了“刀耕之治”。律令明确指出，“迷障不可被揭开”。月狂有助于保持迷障。伤害或撕毁迷障意味着在狼族中失去了巨大的荣誉，而修复迷障则意味着相反的情况。一些狼人发现，迷障是一个过时的想法，不再重要了。有些人甚至积极努力地推翻迷障，以便狼人能够再次恢复刀耕之治，公开威慑全人类。"
 tenet_werewolf_oaths_desc:0 "宣誓是一人可以达成的最神圣的约束。违背誓言的领导人没有荣誉，并会将要将所有人带入其的腐化。"
 tenet_helios_truth_name:0 "赫利俄斯的真言"
 tenet_helios_truth_desc:0 "赫利俄斯教狼族用思考和逻辑来控制他们的本能和愤怒。因此，那些追随他的人往往成为熟练的外交家和谈判者。实现休战、条约或联盟的最大问题往往是让对方听从说客提出的论点。赫利俄斯重视真理和正义。赫利俄斯给尊敬他的狼人带来了理性和策略。"
 tenet_ivory_priesthood_name:0 "象牙圣职"
 tenet_ivory_priesthood_desc:0 "当第一只狼为了拯救盖亚而死时，它得知了“死亡的奥秘”。象牙圣职是一个由银牙通神者组成的秘密社团，他们在经历了一系列的精神考验和核查后，开始学习同样的秘密，了解死亡的尸幕之外的事物。"
 tenet_hexcraft_name:0 "巫术"
 tenet_hexcraft_desc:0 "精通邪眼、恶咒、厄运、诅心。小心不要过线，否则你会发现自己在承受诅咒的一端。你的胆会被扭曲成结，让你在一周内像个小熊一样无力地呕吐。他们的咒语帮助他们实施各种阴险的计谋。"
 tenet_vengeance_of_nut_name:0 "努特的复仇"
 tenet_vengeance_of_nut_desc:0 "那些为努特寻求复仇的人致力于消灭吸血鬼。他们为失去的故乡和失去的亲属复仇。努特之匕在任何地方都扮演着刺客的角色，默默地选择一到三只蚂蟥进行灭绝。遵循此法的人善于对吸血鬼“寻找巢穴”。"
 tenet_way_of_zhong_kuei_name:0 "钟馗之道"
 tenet_way_of_zhong_kuei_desc:0 "由钟馗开发的平息不死族恶魔的方法。遵循此法的人善于对吸血鬼“寻找巢穴”。"
 special_doctrine_garou_nation_name:0 "狼国"
 special_doctrine_garou_nation_desc:0 "该部族或阵营遵循律令，是狼国公认的一部分。"
 doctrine_parameter_hostility_override_special_doctrine_garou_nation:0 "拥有狼国教条的其他狼族[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 special_doctrine_beast_courts_name:0 "兽庭"
 special_doctrine_beast_courts_desc:0 "在化形者中，跨物种联盟是很罕见的。其中最明显地是兽庭，他们发誓要保卫翡翠之母（盖亚）。在兽庭中，有一个类似于神秘亚洲的天朝的社会，有执政者、朝臣和普通民众。 任何化形者都可以自由加入兽庭，只要他们发誓遵守被称为“翡翠美德之道 ”的荣誉与声誉体系。"
 doctrine_parameter_hostility_override_special_doctrine_beast_courts:0 "拥有兽庭教条的其他[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 special_doctrine_dark_litany_name:0 "黑暗律令"
 special_doctrine_dark_litany_desc:0 "该邪教遵循黑暗律令：服务于妖蛆的意志。 尊重强者的力量。所有不被禁止的都是被允许的。纵容你的欲望。"
 doctrine_parameter_hostility_override_special_doctrine_dark_litany:0 "拥有黑暗律令教条的其他妖蛆[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"
 doctrine_triat_alignment_name:0 "三相倾向"
 doctrine_triat_alignment_wyrm_name:0 "妖蛆"
 doctrine_triat_alignment_wyrm_desc:0 "妖蛆是至高天神之一。妖蛆的目的是净化和纠正宇宙，使其更迟一步堕入熵。祂通过消除奇原的创造和织者的结构来实现这一目的。妖蛆是三相中第二个疯掉的成员。当织者疯了，开始用网包裹一切，妖蛆就逐渐受到囚禁，直到祂也被逼疯，一心想要毁灭一切。因此，妖蛆现在是破坏、混乱、黑暗和腐败的灵，是狼族所反对的一切的本质。大多数部族都有自己的神话，以自己特定的文化命名法描述妖蛆。"
 tenet_fellow_triat_wyrm_opinion:0 "妖蛆眷族"
 doctrine_parameter_opinion_of_triat_wyrm_opinion_active:0 ""
 doctrine_parameter_triat_wyrm_opinion_active:0 ""
 triat_wyrm_opinion_active_opinion_name:0 "妖蛆眷族"
 triat_wyrm_opinion_active_county_opinion_name:0 "妖蛆眷族伯爵领"
 doctrine_parameter_opinion_of_triat_wyrm_opinion_active_active:0 "其他妖蛆阵营的[opinion|E]：$VALUE|+=0$"
 doctrine_triat_alignment_wyld_name:0 "奇原"
 doctrine_triat_alignment_wyld_desc:0 "奇原是三相之一。奇原是一种创生之力：它创造了绝对地混沌，织者赋予它秩序，接着妖蛆摧毁它并恢复为混沌。在三相的另两发疯时，奇原正在减少，被织者压制，并被妖蛆不顾一切地摧毁。黑怒和赤爪是两个最重要地敬拜奇原的加鲁部落。他们之外，鼠人崇拜奇原，认为它是无上能量，远远超过盖亚。芭丝特用女性称呼纳拉来称呼奇原。"
 tenet_fellow_triat_wyld_opinion:0 "奇原与自由"
 doctrine_parameter_opinion_of_triat_wyld_opinion_active:0 ""
 doctrine_parameter_triat_wyld_opinion_active:0 ""
 triat_wyld_opinion_active_opinion_name:0 "奇原拥护者"
 triat_wyld_opinion_active_county_opinion_name:0 "奇原拥护者伯爵领"
 doctrine_parameter_opinion_of_triat_wyld_opinion_active_active:0 "其他奇原拥护者的[opinion|E]：$VALUE|+=0$"
 doctrine_triat_alignment_weaver_name:0 "织者"
 doctrine_triat_alignment_weaver_desc:0 "织女是三相之一。它的功能被认为是从奇原的造物中制造秩序，在它们被妖蛆摧毁之前的存在期间赋予它们形式和功能，维持创造和毁灭之间的平衡。人类是织者养子，为了给世界带来秩序，帮助她结束她的天神同胞们不断给造物带来的混乱。为此，织者为凡人植入了三种天赋，即教条、科学和技术，以便生存。据说，在刀耕之治之后，织者发誓不再让她的孩子成为被迫害的受害者。织者的化身和孩子们经常以蜘蛛的形式出现，有时是昆虫。它（或者，更多时候，她）是法律、秩序、科学和技术的守护者，因此受到人类监护者和安娜纳西（他们称她为蜘蛛祖母；他们认为织者创造了他们的守护神安娜纳莎女王）的敬重。巴希拉和其他芭丝特提到织者时，使用的是男性称呼——罗阇（这是印度语单词，意思是“执政者”）。"
 tenet_fellow_triat_weaver_opinion:0 "织者奉祀"
 doctrine_parameter_opinion_of_triat_weaver_opinion_active:0 ""
 doctrine_parameter_triat_weaver_opinion_active:0 ""
 triat_weaver_opinion_active_opinion_name:0 "织者奉祀"
 triat_weaver_opinion_active_county_opinion_name:0 "织者奉祀伯爵领"
 doctrine_triat_alignment_balanced_name:0 "平衡"
 doctrine_triat_alignment_balanced_desc:0 "所有化形者都同意，最初三相是处于平衡状态的。有些人说奇原创造了最初的物质、生命和灵性，而织者赋予这些造物形式和功能，妖蛆摧毁它们，为新的造物腾出空间。其他人则坚持认为，妖蛆曾经被称为“平衡”，它有选择地摧毁奇原和织者的造物，从混乱和秩序的对立力量中创造和谐。化形者也同意三相不再平衡：织者利用人类的力量——它的城市、技术、工业和科学——并且比以前更强大。随着自然资源被掠夺，世界上的荒芜之地被破坏，自然界被迫听从人类的命令，奇原的影响力也在退缩。然而，最危险的是妖蛆——它以邪恶为食，不加区分地进行破坏。有什么东西抑制着它，但狼族看到它的力量在增长，并担心有一天它会挣脱出来，带来终极的毁灭——怒嚎末日。大多数狼族都在努力使织者和奇原重新达到平衡。"
 tenet_fellow_triat_balanced_opinion:0 "三相平衡"
 doctrine_parameter_opinion_of_triat_balanced_opinion_active:0 ""
 doctrine_parameter_triat_balanced_opinion_active:0 ""
 triat_balanced_opinion_active_opinion_name:0 "三相平衡"
 triat_balanced_opinion_active_county_opinion_name:0 "三相平衡伯爵领"
 doctrine_parameter_opinion_of_triat_weaver_opinion_active_active:0 "其他织者奉祀的[opinion|E]：$VALUE|+=0$"
 tenet_banepossession_name:0 "忌灵附身"
 tenet_banepossession_desc:0 "忌灵是为妖蛆服务的邪恶灵类。忌灵的种类很广，从弱小的、相对无害的到可怕的、能够撕裂周围现实的强大生物都有。弱小的忌灵经常被用来污染人类和动物，把他们变成堕妖。为忌灵寻找宿主被妖蛆邪教视为一项神圣的任务。"
 past_lives_name:0 "前世"
 past_lives_doctrine_name:0 "前世"
 past_lives_doctrine_desc:0 "对于最伟大的英雄来说，死亡并不是终点。最有智慧和最强壮的狼族继续存在，作为灵留在那里，指导他们的后代进行伟大的斗争。星占和盖亚之子将其视为狼族英雄在其后代中的实际转世。有些人觉得这更像是一个集体的种族记录，就像阿卡夏记录一样。其他狼族认为它更像是祖灵的指导。所来的幻象可以分享重要的智慧，甚至是实用的技能。有时，似乎狼族甚至被他们祖灵所占有。 更为罕见的是，这位先祖曾经而且显然仍然是个疯子。"
 wyrm_tainted_name:0 "妖蛆眷族"
 wyrm_tainted_doctrine_name:0 "妖蛆眷族"
 wyrm_tainted_doctrine_desc:0 "许多狼人和其他崇尚盖亚的化形族都有一种天赋，使他们能够感觉到其他人身上的妖蛆玷污。许多吸血鬼的教化心路被认为是如此腐败，以至于这些信仰的追随者天生就被视为受到妖蛆的玷污。"
 doctrine_parameter_hostility_override_special_doctrine_wyrm_tainted:0 "盖亚[faiths|E]视拥有妖蛆眷族教条的[faith_evil|V]而非[faith_hostile|V]。 妖蛆[faiths|E]视拥有妖蛆眷族教条的[faith_astray|V]而非[faith_hostile|V]。"
 doctrine_parameter_hostility_override_wyrm_tainted_doctrine:0 "盖亚[faiths|E]视拥有妖蛆眷族教条的[faith_evil|V]而非[faith_hostile|V]。 妖蛆[faiths|E]视拥有妖蛆眷族教条的[faith_astray|V]而非[faith_hostile|V]。"
 special_doctrine_wyrm_tainted_name:0 "妖蛆眷族"
 special_doctrine_wyrm_tainted_desc:0 "许多狼人和其他崇尚盖亚的化形族都有一种天赋，使他们能够感觉到其他人身上的妖蛆玷污。许多吸血鬼的教化心路被认为是如此腐败，以至于这些信仰的追随者天生就被视为受到妖蛆的玷污。"
 tenet_bacchanal_name:0 "酒神节"
 tenet_bacchanal_desc:0 "致力于醉生梦死的狂欢，有些人会认为消费这种毒素是一种危险的成瘾。这一信条使饮酒决议的减压效果加倍。"
 tenet_neter_sentra_name:0 "仙草"
 tenet_neter_sentra_desc:0 "神圣地吐息：祈祷被烟雾带向天堂。神圣烟雾的崇拜者采取了新颖的创新，不只是食用大麻，而是吸它们。他们尝试使用各种奇异的香精和潜在的危险烟雾。这一信条使吸食大麻决议的减压效果加倍。"
 tenet_innovative_name:0 "创新"
 tenet_innovative_desc:0 "科技进步是任何人都能拥有的最重要的优势。虽然大多数狼族充其量是对创新持怀疑态度，但一些奇原的追随者公开推动创新，不仅是为了他们自己的采用，也是为了整个人类。"
 tenet_paranoia_name:0 "妄想症"
 tenet_paranoia_desc:0 "他们不会因为你有妄想症就不来袭击你！"
