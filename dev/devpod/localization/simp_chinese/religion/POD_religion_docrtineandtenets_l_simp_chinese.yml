 tenet_old_ways_name:0 "原始传统"
 tenet_old_ways_desc:0 "自从凡俗北欧人崇尚并追随富商和狡猾的贵族而不是最大胆的劫掠者以来，已经过去了数个世纪。许多吸血鬼认为这是最可悲的发展。"
