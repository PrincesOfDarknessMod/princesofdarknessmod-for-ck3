 doctrine_parameter_recruit_deviltiger_banes: "能够招募[GetMaA('rat_headed_dragonfly_demon').GetName]，[GetMaA('sleeper_seducing_bane').GetName]和[GetMaA('face_robe_demon').GetName]作为[men_at_arms|E]"
 tenet_fera_innovative_name: "Innovative"
 tenet_fera_innovative_desc: "Technological progress is the most important edge anyone can have. While most Garou are skeptical of innovation at best, some followers of the $glossary_weaver$ openly push innovation forward not only for their own adoption but humanity at large."
 tenet_soldiers_of_the_wyrm_name: "Soldiers of the Wyrm"
 tenet_soldiers_of_the_wyrm_desc: "We are the soldiers of the $glossary_wyrm$, not of its inferior servants. Our glory shall be seen, our faith rewarded."
 doctrine_parameter_reduced_urgetaints_xp: "Reduces [urgetaints_lifestyle|E] [lifestyle_experience|E] obtained by #N -25%#!"
 tenet_secrets_of_flesh_name: "Secrets of Flesh"
 tenet_secrets_of_flesh_desc: "Much wisdom lies dormant in the flesh. The Litany will deny us no longer."
 doctrine_parameter_wyrm_education_lifestyle_xp_from_cannibalism: "Gain [lifestyle_experience|E] matching your [education|E] when devouring other characters scaling with the victim's age"
 doctrine_parameter_infamy_renown_from_cannibalism: "Gain $POD_fera_renown_infamy$ $glossary_fera$ Renown when devouring characters older than 200"
 tenet_centipede_embrace_name: "Centipede's Embrace"
 tenet_centipede_embrace_desc: "The [Glossary('Centipede', 'glossary_wyrm_tt')] will grow endlessly, feeding on the land itself."
 doctrine_parameter_ignore_dragon_nest_requirements: "Ignore all [development|E] requirements in Dragon Nest [duchy_buildings|E]"
 tenet_wyrm_seekers_name: "Wyrm Seekers"
 tenet_wyrm_seekers_desc: "The $glossary_wyrm$ holds much knowledge and power, one simply needs to seek it."
 doctrine_parameter_increased_urgetaints_xp: "Increases [urgetaints_lifestyle|E] [lifestyle_experience|E] obtained by #P +25%#!"
 tenet_channel_darkness_name: "Channel the Darkness"
 tenet_channel_darkness_desc: "We are one with the darkness, mere phantoms in the dark. We move unseen until our shadows descend upon the fools that stand in our way."
 doctrine_parameter_unlock_shadow_shapeshift: "Unlock [GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip] shapeshift option"
 tenet_hypnotic_serpent_name: "Sway of the Hypnotic Serpent"
 tenet_hypnotic_serpent_desc: "[Glossary('Cahlash', 'glossary_wyrm_tt')] calls to us and we will answer. Soon, the others will learn to as well."
 doctrine_parameter_learn_secrets_from_seduction: "Successful [GetScheme('seduce').GetTypeName] [schemes|E] reveal all [secrets|E] the target knows, including their own."
 tenet_twisted_memories_name: "扭曲回忆"
