 fae_agenda_none_opinion_active_opinion_name: "摇摆派妖精议程"
 doctrine_fae_morality_name: "妖精道德"
 doctrine_fae_morality_seelie_name: "喜乐廷"
 doctrine_fae_morality_unseelie_name: "哀怒廷"
 doctrine_fae_morality_seelie_desc: "虽然经常被外人，甚至是没有人生经验的戚族描述为“善良”王廷，但喜乐廷实际上是由荣誉和爱的美德来定义的。虽然这似乎符合“善良”的概念，但骑士精神可能与现代世界的道德观相冲突，而且妖精的宫廷爱情观念有时与凡人所面临的现实相去甚远。在许多方面，喜乐廷律法都植根于武术传统中。\n\n在[Glossary('大碎溃','game_concept_shattering_desc')]之前，喜乐廷在春夏两季——从五朔节到夏末节——进行统治。喜乐廷律法是：宁死不屈，爱胜一切，美就是命，勿忘恩情。"
 doctrine_fae_morality_unseelie_desc: "许多喜乐廷妖精认为哀怒廷在某种程度上是邪恶的，但这种描述太直白了。哀怒廷拥抱变化，对传统嗤之以鼻，认为与他们的过去没有特别地联系，或者说，与似乎越来越遥远的[UmbraGlossary('dreaming')]没有联系。哀怒廷的行事方式是激切而务实的，既满足欲望，又满足需要；哀怒廷不否认自己。\n\n在[Glossary('大碎溃','game_concept_shattering_desc')]之前，哀怒廷在秋冬两季——从夏末节到五朔节——进行统治。哀怒廷律法是：变化是好的，梦华是免费的，荣誉是谎言，爱好先于责任。"
