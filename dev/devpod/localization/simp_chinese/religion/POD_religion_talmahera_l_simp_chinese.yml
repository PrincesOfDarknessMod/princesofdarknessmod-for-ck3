 talmahera:0 "塔尔玛埃拉"
 talmahera_adj:0 "塔尔玛埃拉"
 talmahera_adherent:0 "暗影圣战士"
 talmahera_adherent_plural:0 "暗影圣战士"
 talmahera_desc:0 "塔尔玛埃拉是一个由转轮者法师和几个吸血鬼[Clans|E]（尤其是阿刹迈）组成的不讨喜的联盟，虽然它的成员也包括除了吸血鬼和法师之外的其他超自然生物。"
 manusnigrum:0 "黑手之道"
 manusnigrum_adj:0 "黑手之道"
 manusnigrum_adherent:0 "黑手"
 manusnigrum_adherent_plural:0 "黑手"
 manusnigrum_desc:0 "一条古老死亡密教的西方分支，致力于崇拜一位被称为阿拉鲁的结合体，密教相信其是[antediluvians|E]，沉睡在鬼城以诺的亡者之地深处。这密教活跃参与吸血鬼政治，计划着消灭巴力。"
 pathofselffocus:0 "自我专注之道"
 pathofselffocus_adj:0 "自我专注之道"
 pathofselffocus_adherent:0 "内在论者"
 pathofselffocus_adherent_plural:0 "内在论者"
 pathofselffocus_desc:0 "内在论者相信，通过接受宇宙的进展，不干涉地追随，他们可以停止内心冲突，从而封闭心兽。他们声称，由于改变世界是不可能的，你只能改变自己以适应世界。"
 pathofthescorchedheart:0 "枯心之道"
 pathofthescorchedheart_adj:0 "枯心之道"
 pathofthescorchedheart_adherent:0 "不忘"
 pathofthescorchedheart_adherent_plural:0 "不忘"
 pathofthescorchedheart_desc:0 "基于拉斯莫尼库斯的《空心之书》，初次是在天主教廷的几个血族之间传播；它的经文后来被真黑手重新整理。枯心之道通过系统性地根除吸血鬼内心的所有情感来控制心兽。"
