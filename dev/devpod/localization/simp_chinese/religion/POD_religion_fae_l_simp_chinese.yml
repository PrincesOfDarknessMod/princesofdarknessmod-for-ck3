 empire_of_seeds_desc:0 "库贝拉——元素妖门属之一——的王廷。树精的国度是一个共享生命和物资的林中团体。宁芙的母界是树精位于梦界中母界诸界中心的广袤森林。在政治上，树精支持格洛姆，但对索利蒙德母界的待遇有所保留。作为受到造化之战影响最大的类群，他们对索利蒙德的再融入的事业并不十分同情。春分节是由库贝拉主办的盛大集市。元素妖的音乐家、艺术家和工匠汇聚一堂，展示他们的商品，共同庆祝生命的新陈代谢和冬天的结束。如果帝国领导人需要进行联合公告，这就是恰当的时间和地点。月会是一个假期，库贝拉在俄罗斯某处的高夏季节的一个巨大林地中聚集。在这里，树精被允许向他们的皇帝提出请愿。"
 empire_of_stones:0 "岩石帝国"
 empire_of_stones_adj:0 "岩石帝国"
 empire_of_stones_adherent:0 "岩石"
 empire_of_stones_adherent_plural:0 "岩石"
 empire_of_stones_desc:0 "格罗姆——元素妖门属之一——的王廷。岩石帝国是一个严格的阶级社会。每个格罗姆都知道自己在整体中的位置。同时，帝国也是一个任人唯贤的组织。对于那些能够推动帝国事业的人的晋升总是很快。格罗姆的梦境母界是一座由活山生长而成的巨大城堡。它曾被围攻过三次，每次入侵都被击退和粉碎。在这个结构的核心是数条奇魅铁脉中的一条。在所有的帝国中，格罗姆在政治上的立场是最极端的。他们坚持认为索利蒙德必须被摧毁。由格罗姆主办的冬至节是在梦界中举行的一场盛大比武，类似于奥运会，只不过重点是武艺。获胜者将被赞扬，并且如果是格罗姆，注定会迅速晋升。"
