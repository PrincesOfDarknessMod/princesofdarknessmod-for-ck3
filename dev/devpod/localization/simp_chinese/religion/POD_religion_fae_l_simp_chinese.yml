 winter_court_constantinians_desc:0 "寻求了解人类信仰细节的妖精总是被视为追求相当无用的学术道途——直到现在。在停战誓言的年代里，君士坦丁派的成员数量大增。以君士坦丁一世的名字命名，这些妖精寻求了解人类宗教的更多，尤其是基督教会。\n\n那些走这条研究和推理之路的人往往出于两个主要原因之一：了解信仰现象，并找到一种方法来平衡它与妖精在世界中的位置；或者寻找人类新力量中的任何弱点，并找到一种方法来利用它。\n\n冬之王廷的君士坦丁派倾向于利用他们对教会的了解为自己谋利（并对人类不利）。"
