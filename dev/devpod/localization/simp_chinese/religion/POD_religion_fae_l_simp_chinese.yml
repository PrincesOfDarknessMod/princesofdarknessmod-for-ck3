 empire_of_flames_desc:0 "索利蒙德——元素妖门属之一——王廷。沙罗曼达的国度拥有复杂的帝国君主制度，具有贵族等级制度、盛大仪式和礼仪，可以与仙族创造的任何事物相媲美。诸帝国中最初爱上肉人的是火灵们，受这种不幸的激情驱使，他们花费了无数岁月观察人类，并以爱人的眼光学习他们奇特而令人敬畏的思想。最终，他们再也无法隐藏，展示了自己的身份，并向人们展示了火焰的运作方式，以及它具备的变幻和真理的力量。因此，他们注定使元素妖世界沦为男人和女人手中的奴隶，并引发了造化之战，迫使其他帝国对这些叛逆的火焰进行了斗争，并将其排斥出去。现在，其他缓慢的帝国正在寻找扑灭沙罗曼达的根基。沙罗曼达的梦界母界曾经是一个铜色的宫殿和庄园的景观，天空上燃起了一片火焰的地平线。夏至节是一个庄重而高贵、美丽非凡的假面舞会，同时也是一个为期四天的大学，索利蒙德会在那里聚集并分享他们的知识。"
 empire_of_tears:0 "泪水帝国"
 empire_of_tears_adj:0 "泪水帝国"
 empire_of_tears_adherent:0 "泪水"
 empire_of_tears_adherent_plural:0 "泪水"
 empire_of_tears_desc:0 "温蒂妮——元素妖门属之一——的王廷。涅瑞伊得斯以雅典式的民主方式管理他们的帝国。任何涅瑞伊得斯都可以就任何问题投票。心灵收集者的梦界母界是一个无边无际的海洋，延伸到每一个地平线。二十英里深处，是一个有着巨大的珊瑚建筑和高速公路的城市。任何来访者必须能够在水下呼吸。许多海盗船长知道如何通过梦界中的捷径来导航，因为它与地球上的每一个水域和梦界都有联通。在政治上，这个帝国没有敌人，并与所有其他元素妖保持友好关系，尽管火和水从来有过极好的关系。秋分节是温蒂妮和帕罗塞米共同举办的节日。所有人都受邀来到涅瑞伊得斯的水下宫殿，氧气由天妖精供应。盛宴十分丰盛，经常赠送礼物。"
 empire_of_skies:0 "天空帝国"
 empire_of_skies_adj:0 "天空帝国"
 empire_of_skies_adherent:0 "西尔芙"
 empire_of_skies_adherent_plural:0 "西尔芙"
 empire_of_skies_desc:0 "帕罗塞米——元素妖门属之一——的王廷。天妖精的政府一般被认为为无政府主义和部落主义的结合。每年一次，最年长的13名活跃成员聚集在一起讨论影响所有小精灵的问题，然后发表冗长而华丽的宣言，但很快就会被所有人忽视。在深梦界中发现的帕罗塞米母界看起来像是由云和玻璃构成的国度。幻兽在云状的草地上吃草，轻盈的人们徒步或飞行在精致的乡村漫步。在领域的中心，一座云状的塔，形状像独角兽的角，直插云霄，坚如大理石。顶部是议会会议的地方。他们与泪水帝国保持良好关系，进行稳定的雨水蒸发贸易。对于岩石帝国来说，他们被认为太无聊了，只保持了肤浅的关系。他们与种子帝国保持友好关系。他们没有计划参加封锁火焰帝国的行动。没有人对人偶帝国有任何话要说。秋分节是温蒂妮和帕罗塞米共同举办的节日。所有人都受邀来到涅瑞伊得斯的水下宫殿，氧气由天妖精供应。盛宴十分丰盛，经常赠送礼物。"
 empire_of_dolls:0 "人偶帝国"
 empire_of_dolls_adj:0 "人偶帝国"
 empire_of_dolls_adherent:0 "人偶"
 empire_of_dolls_adherent_plural:0 "人偶"
 empire_of_dolls_desc:0 "马内坎——元素妖门属之一——的王廷。玩偶声称没有帝国或母界。他们偶尔聚集在梦境的宁静之地，保持他们的私密会议，并偶尔出现在其他帝国的宫廷上提供建议。一位自称代表整个马内坎的使者身穿黑袍，即使是格洛姆的元帅也会倾听黑袍带来的消息。马内坎从未邀请任何人来到他们的会议地点。在诸帝国的政治中，马内坎作为变革的催化剂。当他们的使者出现时，政策的转变近在眼前。许多人想知道黑袍的秘密是什么，但其他帝国永远不会透露其中的内容。在为数不多的几次使者对整个帝国演说发生时，战争都很快就会紧随其后。虽然马内坎没有每年的仪式，但有传言称，除夕夜的11点59分到午夜之间的时间被他们窃取了。人们窃窃私语，在那一分钟里，所有的玩偶都会醒来，过上一整天完全像人类一样的生活，然后回到他们的锚点，时间又回溯到午夜。如果这是真的，那将有助于解释为什么人偶对其他帝国所隐藏的许多事情了如指掌。"
 eshu_religion:0 "逸抒"
 eshu_religion_desc:0 "The Eshu have their own codes of conduct that differ from the courts of the Sidhe. Those who follow the ways of honor and tradition prefer Ojo, or daylight, fae. Those who follow their philosophy of casting off old ways and indulging passions, a death of tradition, call themselves Iku, or death. Don't think this means that all Ojo are kind and generous or all (or even most) Iku are murderous revelers. Both groups follow Uhuru. It can be as bad to be caught in the hands of an Ojo judge who will not bend as it is to be caught by an Iku with a grudge. The Eshu attach no stigma to these philosophies, except in extreme cases, because of all the fae they see themselves as individuals. Judge an Eshu by his chosen \"court\" at your own peril."
 ojo_religion:0 "奥祖"
 ojo_religion_desc:0 "In the common parlance of the Eshu, Ojo (aw-jaw) means Daylight and Life. "
 ojo:0 "奥祖"
 ojo_adj:0 "奥祖"
 ojo_adherent:0 "奥祖"
 ojo_adherent_plural:0 "奥祖"
 ojo_desc:0 "In the common parlance of the Eshu, Ojo (aw-jaw) means Daylight and Life. Most Eshu you meet are, in fact, going to be Ojo. It comes naturally and most Elegbara draw strength from the millennia of traditions and history tied up in it. They do not, however, follow the Seelie Code (which they predate). They have their own standards to judge themselves by, though they will still uphold the Seelie which usually doesn't conflict. The Eshu simply have different core values.\nHeed the Call of Fate--All Ojo believe that the orishas ordain everything that happens.\nPass On What You Have Heard--If one doesn't remember history we repeat the same mistakes. A story forgotten is a blow against all Fae.\nSeek Justice for Those Unheard--Eshu feel a kinship with other marginalized peoples and do their best to help."
 iku_religion:0 "艾库"
 iku_reilgion_desc:0 "In the common parlance of the Eshu, Iku (ee-ku) is Death and Darkness."
 iku:0 "艾库"
 iku_adj:0 "艾库"
 iku_adherent:0 "艾库"
 iku_adherent_plural:0 "艾库"
 iku_desc:0 "In the common parlance of the Eshu, Iku (ee-ku) is Death and Darkness. The Iku see things a bit different the Ojo. The Eshu may say they treat both Ojo and Iku the same but the Iku know that's not true. They know the Ojo see them as a joke and a nasty, bitter one at that and the moment the rest know, you drop down a few notches on their list. Many think that because they don't bow down to destiny that they aren't real Elegbara but they have a code to. Though not so exactly like the Unseelie, they mesh alright.\nThere is No Destiny--What does this mean? They are truly, ultimately, Free!\nLeave Trouble in Your Wake--Chaos snaps people out of complacency. Make those in power afraid of you and what you know.\nVengeance is Divine--They look out for themselves first and make sure anyone who messes with them ends up missing something, whether ego, valuables, or body part."
 mu_religion:0 "魔宫"
 mu_religion_desc:0 "The Mu Courts are groups of Hsien who surrendered themselves to the Yama Kings in the [fourth_age|E] as they saw no way out of the dilemma they had brought upon themselves by breaking the Mandate of Heaven. The two courts are not allied with each other but both are at odds with the other Hsien Courts."
 daityas:0 "底提耶"
 daityas_adj:0 "底提耶"
 daityas_adherent:0 "底提耶"
 daityas_adherent_plural:0 "底提耶"
 daityas_desc:0 "The Daityas are a Hsien Court who allied to the Yama Kings in the [fourth_age|E] but have since turned away from them. Shortly after they pledged allegiance to the Yama Kings, the society of Daityas realized that the demons would only corrupt them and feed on their life energies and so they left the alliance. Through their own dark sorceries they, too, figured out how to maintain their bodies and avoid falling into nothingness as did the other Hsien.\nThe Daityas work to encourage the coming of the [sixth_age|E]; to bring about a time when the August Personage of Jade is forced from his Celestial Court and the Dragons and Phoenixes war against each other in a bloody conflagration. By promoting lack of belief, they seek to weaken the wall created by the August Personage and so claim their rightful place in the Celestial Court.\nThough misguided in the eyes of the other Hsien, they are not beyond redemption. If they wanted to do so, they could come back to the right path and help the Hsien in avoiding the Age of Sorrow."
 kura_sau:0 "仓藏"
 kura_sau_adj:0 "仓藏"
 kura_sau_adherent:0 "仓藏"
 kura_sau_adherent_plural:0 "仓藏"
 kura_sau_desc:0 "The Kura Sau are a society of corrupted Hsien. Also referred to as the Gou Zhang, are a society of those Hsien that surrendered themselves to the Yama Kings and are regarded as a part of the Mu Courts. As a result, they are able to travel to Yomi Wan without suffering the curse of the August Personage In Jade. In addition, they have their own branch of Wu Tan known as Hac Tao, a vile art that allows them to carry the tainted chi of the Thousand Hells into the world.\They strive to fulfill the agendas of their dark masters, bringing on the [sixth_age|E] and corrupting most of the Middle Kingdom. Most are dark reflections of the original Hsien and some answer even prayers, on condition that they involve bloodshed and satisfaction of darker urges. Some claim that the Kura Sau are even responsible for the corruption of some dragons and phoenixes, tempting them with promises of power that only the Yama Kings can grant."
 shu_shen:0 "竖神"
 shu_shen_adj:0 "竖神"
 shu_shen_adherent:0 "竖神"
 shu_shen_adherent_plural:0 "竖神"
 shu_shen_desc:0 "The Shu Shen are the dissolute of Shinma society. The Profane Gods, defy the concept of balance and pursue extremes of both carnality and violence. They loot, plunder, murder, and generally ruin the reputation of the benevolent Hsien everywhere. They are mercenaries and body guards for more powerful Shen who can pay their price, including Kuei-jin or even Kin-jin. They may have allies among vampires or even the servants of the Yama Kings."
 li_shen:0 "礼神"
 li_shen_adj:0 "礼神"
 li_shen_adherent:0 "礼神"
 li_shen_adherent_plural:0 "礼神"
 li_shen_desc:0 "Also called the Traditionalists, the Ceremony Gods or just the Fu, the Li Shen embrace Confucian values. They believe in the Tao Te Hsien but the emphasize the orderliness of nature and maintaining it, not enlightenment of the self. The protection of nature concerns them above all else and their numbers are almost entirely Kamuii. Once the most powerful of the courts, the Ceremony Gods have lost touch with the other Shen and all too often look down their noses at them. Due to this prejudice, as well as all the in-fighting between ministries, they Fu no longer do their job as well as they could."
 tu_shen:0 "笃神"
 tu_shen_adj:0 "笃神"
 tu_shen_adherent:0 "笃神"
 tu_shen_adherent_plural:0 "笃神"
 tu_shen_desc:0 "While regarded by most other Shinma as sybarites, the Gods of Harmony, or Ambassadors of Heaven, have the same goals as the Xian Mo... just very different ways of getting there. They seek to bring about the Age of Joy by convincing everyone to have a good time. Rapture, exultation, and not mere physical ecstasy is their goal. They understand that a good dinner with family and friends is more satisfying and sustaining a joy than a handful of pills. The Gods of Harmony act on their beliefs by doing good deeds, trying to get different courts of shen to work together or at least talk. They walk, and occasionally party, just like they talk.\nThe Ambassadors of Heaven are looked askance upon by the Li Shen and their relations are strained with the Yü as well. Most of the others at least enjoy their company. The Tu Shen, for their part, say they have good relations with all groups."
 xian_mo:0 "默仙"
 xian_mo_adj:0 "默仙"
 xian_mo_adherent:0 "默仙"
 xian_mo_adherent_plural:0 "默仙"
 xian_mo_desc:0 "Also called the Quiet Ones or Immortal Magical Spirits, the Xian Mo are mystics and strong believers in the Tao Te Hsien. They believe that enlightened individuals can create a perfect world and reverse the turn of Ages. This emphasis on the individual leads them to resist order; they even refuse to see themselves as a court. Xian Mo is a name other Hsien give them.\nThe Quiet Ones, though, give the Shinma hope, which most gave up at the end of the [fourth_age|E] when the Wall barred them from the Spirit World. Hanuman brought the Tao Te Hsien to a Komuko sage in the Di Fu. The Komuko resigned their position and retired to the mountains. Eventually their teachings lead to the writings now called the Tao Te Hsien, or \"The Way of Imminent Hsien Power.\" Its ardent followers now make up the Xian Mo and their teachings have led some to pass beyond the Wall."
 xian_mun:0 "仙门"
 xian_mun_adj:0 "仙门"
 xian_mun_adherent:0 "仙门"
 xian_mun_adherent_plural:0 "仙门"
 xian_mun_desc:0 "The Xian Mun, also called the Immortal Society or the Worldly, are Shinma that either reject their true natures or are more concerned with their mortal lives. Some may even use their powers to promote other agendas. The best of the Worldly feel that it is possible to follow the Tao Te Hsien outside of traditional hsien society while the worst care little for it at all.\nThe Immortal Society see members of other courts as deluded fools. Individuals pay lip service (with a little cash and jade) to the local ministries and Yü strongmen just to be left alone. They tend to organize themselves along many different models, whether as families or corporations or other human institutions."
 yellow_lotus:0 "黄莲"
 yellow_lotus_adj:0 "黄莲"
 yellow_lotus_adherent:0 "黄莲"
 yellow_lotus_adherent_plural:0 "黄莲"
 yellow_lotus_desc:0 "The Yellow Lotus are a subtle, secret society within Hsien society. They are scattered among their fellow hsien and their goals can seem contradictory. In fact, no one knows their true agenda or who their members even are. Their one obvious aim is to foment rebellion within the ranks of the Shinma. They dredge up ancient rivalries and long-forgotten wrongs all to disrupt the order of the Li Shen ministries. They have also, however, claimed responsibility for punishing those who are too blatant about showing their wani forms and so sometimes act as a sort of secret police. Their work encompasses spreading rumors to assassination. What do they want? Maybe they just like stirring up chaos for its own sake."
 yu:0 "玉"
 yu_adj:0 "玉"
 yu_adherent:0 "玉"
 yu_adherent_plural:0 "玉"
 yu_desc:0 "The Yü, also called the Classicists or the Great Ten, model themselves after the Ten Chinese Kings of Chinese prehistory. (They may have even been some of them.) They carved the Middle Kingdom into 10 mystic provinces but their battles cause the borders to shift often. The generally support the Fu and their Ministries, as long as they can play them off of one another and draw upon their talents. The Yü have hoarded jade for centuries and possess some of the most powerful jade artifacts to this day. They also control many Dragon Nests.\nNot all of the Yü are nobles, though. Some are only powerful warlords and criminals who control powerful Tongs and Triads. These Shinma go toe to toe with other Shen who have interests in the less lawful business dealings of the Middle Kingdom like the Kuei-jin, Kindred, and others. None of the other Courts can afford to have bad relations with the Yü so they, in return, treat most of the others with respect. The Mu Courts and the Kuei-jin are their greatest enemies."
 wu_hsien:0 "妖仙屋室"
 wu_hsien_adj:0 "妖仙屋室"
 wu_hsien_adherent:0 "妖仙屋室"
 wu_hsien_adherent_plural:0 "妖仙屋室"
 wu_hsien_desc:0 "Also called the Peasants or the Family of Hsien, the Wu Hsien are a catchall society. It is an epithet for the vast majority of the Shinma who live in small villages and have strong ties to the land and local shrines. They may have tight organizations but only on a local scale. They can be insular and only concerned with the local people and environment.\nThere are undoubtedly more Hirayanu than Kamuii among the Peasants. These Hsien are often regarded as retainers of both the Li Shen and the Yü but their only loyalty really lies with the villages, shrines, and local sites of natural beauty."
