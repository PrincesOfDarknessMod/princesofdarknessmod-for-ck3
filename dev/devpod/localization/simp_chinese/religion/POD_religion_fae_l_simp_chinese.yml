 empire_of_seeds_adherent_plural:0 "种子"
 empire_of_seeds_desc:0 "Court of the Kuberas, a Phyla of the Inanimae. The Dryad's nation is a sylvan grouping that shares lives and goods. In the Dreaming, the Nymphs' Homeland is a far-reaching forest in the center of the Homeland Realms. Politically, the Dryads support the Glomes but do have reservations about the treatment of the Solimond Homeland. As the Phyla most affected by the War of Making, they aren't too terribly sympathetic to the the cause of Solimond re-integration. The Spring Equinox festival is a great Faire hosted by the Kuberas. Inanimae musicians, artists, and craftsfae meet to show their wares and all celebrate the renewal of life and Winter's end. If the leaders of the empires need to make any joint announcements, this is the time and place. The Moot is a holiday where the Kuberas gather in a huge glade on highsummer somewhere in Russia. Here the Dryads are allowed to petition their emperor."
 empire_of_stones:0 "岩石帝国"
 empire_of_stones_adj:0 "岩石帝国"
 empire_of_stones_adherent:0 "岩石"
 empire_of_stones_adherent_plural:0 "岩石"
 empire_of_stones_desc:0 "Court of the Glomes, a Phyla of the Inanimae. The Empire of Stones is a strict hierarchy. Every Glome knows their place in the greater whole. At the same time, the empire is a meritocracy. Advancement is rapid for the ones who can advance the Empire's causes. The Dreaming Homeland of the Glomes is a gigantic citadel grown from a living mountain. It has been sieged three times and every time the invaders were pushed back and crushed. At the heart of the structure is one of the few veins of chimerical iron. Of all the empires the Glomes are the most polarized politically. They maintain a hard line that the Solimonds must be destroyed. Hosted by the Glomes, the Winter Solstice Festival is a great Tourney held in the Dreaming that is similar to the Olympics, if the Olympics were about martial prowess. Winners are showered with praise and, if Glomes, destined for rapid advancement."
 empire_of_flames:0 "火焰帝国"
 empire_of_flames_adj:0 "火焰帝国"
 empire_of_flames_adherent:0 "火焰"
 empire_of_flames_adherent_plural:0 "火焰"
 empire_of_flames_desc:0 "Court of the Solimond, a Phyla of the Inanimae. The Salamander nation has a complex imperial monarchy with levels of nobility and pageantry and ceremonies that rival anything the Sidhe have come up with. The fire spirits who first fell in love with meat were among the empire and driven by this ill-fated passion they spent ages watching humankind and learning the ways of their odd and awesome hearts the way only a lover could. Finally, unable to hide any longer, they revealed themselves and showed the meat the working of Flame with its powers of transformation and truth. In this they doomed the inanimate world to slavery at the hands of men and women and caused the War of Making, forcing the other Empires to turn against the treasonous flames and excommunicate them. Now, the other Slow Empires search to quench the Salamanders' Anchors of the Glade. The Dreaming Homeland of the Salamanders was once a bronze vista of palaces and estates with a horizon of flame lighting up the sky. The Summer Solstice is a stately and noble masque of great beauty as well as a 4-day University where the Solimonds would gather and share their knowledge."
 empire_of_tears:0 "泪水帝国"
 empire_of_tears_adj:0 "泪水帝国"
 empire_of_tears_adherent:0 "泪水"
 empire_of_tears_adherent_plural:0 "泪水"
 empire_of_tears_desc:0 "Court of the Ondines, a Phyla of the Inanimae. The Nereids run their empire as an Athenian-style Democracy. Any Nereid may cast a vote on any issue. The Dreaming Homeland of the Heart Collectors is a vast ocean extending over every horizon. 20 miles deep, within it is a gigantic city of coral buildings and highways. Any visitor who visits must be able to breath underwater. Many Pirate captains have secrets to navigate shortcuts here through the Dreaming as it is attached to every body of water on Earth and in the Dreaming. Politically the empire has no enemies and remains on friendly terms with all other Inanimae, though fire and water have never been on the best terms. The Autumnal Equinox is a holiday jointly hosted by the Ondines and Parosemes. All are invited to the underwater palaces of the Nereids with oxygen supplied by the Silfar. Feasting is great and gifts are given."
 empire_of_skies:0 "天空帝国"
 empire_of_skies_adj:0 "天空帝国"
 empire_of_skies_adherent:0 "西尔芙"
 empire_of_skies_adherent_plural:0 "西尔芙"
 empire_of_skies_desc:0 "Court of the Parosemes, a Phyla of the Inanimae. The government of the Silfar can best be described as a cross between anarchy and tribalism. Once a year the 13 oldest active members meet and debate issues that effect all Sprites and then make long, ornate proclamations that are promptly ignored by everybody. Found in the Deep Dreaming, the Paroseme Homeland looks like an entire country made of clouds and glass. Phantasmal animals graze on cloud-like grass and wispy folk meander the delicate countryside by foot or flight. At the very center of the realm a tower of clouds, shaped like a unicorn's horn, reaches up, as solid as marble. At the top is where the council meets. Relations are good with the Empire of Tears with a steady trade of Rain for Evaporation. The Empire of Stones is considered too boring for anything more than cursory relations. They are on friendly terms with the Empire of Seeds. There are no plans to join the blockade of the Empire of Flames. No one has anything to say to the Empire of Dolls. The Autumn Equinox is a joint Festival for the Ondines and Parosemes. All are invited to the underwater palaces of the Nereids with oxygen supplied by the Silfar. Feasting is great and gifts are given."
 empire_of_dolls:0 "人偶帝国"
 empire_of_dolls_adj:0 "人偶帝国"
 empire_of_dolls_adherent:0 "人偶"
 empire_of_dolls_adherent_plural:0 "人偶"
 empire_of_dolls_desc:0 "Court of the Mannikins, a Phyla of the Inanimae. The Toys claim to have no empire or Homeland. They gather occasionally in quiet parts of the Dreaming to keep their councils private and will occasionally appear to give advice within the courts of the other empires. An emissary claiming to speak for the whole of the Mannikins wears a black robe and even the Marshall of the Glomes listens when the black-robe appears with news. The Mannikins have never invited anyone to their meeting place. In the politics of the empires, the Toys serve as catalysts for change. When their emissary appears, shifts in policy are close at hand. Many wonder what the secret of the black-robes is, but the other empires will never reveal what is said. The few times an emissary has addressed a whole empire, war has quickly followed. While the Mannikins have no yearly ritual, rumors persist of time stolen on New Year's Eve between 11:59 and Midnight. People whisper that in that minute all the Toys awaken and live out a whole day fully human then return to their Anchors and time rewinds to Midnight again. IF it were true, it would help explain how the Dolls know so much that remains hidden to the other empires. "
 eshu_religion:0 "逸抒"
 eshu_religion_desc:0 "The Eshu have their own codes of conduct that differ from the courts of the Sidhe. Those who follow the ways of honor and tradition prefer Ojo, or daylight, fae. Those who follow their philosophy of casting off old ways and indulging passions, a death of tradition, call themselves Iku, or death. Don't think this means that all Ojo are kind and generous or all (or even most) Iku are murderous revelers. Both groups follow Uhuru. It can be as bad to be caught in the hands of an Ojo judge who will not bend as it is to be caught by an Iku with a grudge. The Eshu attach no stigma to these philosophies, except in extreme cases, because of all the fae they see themselves as individuals. Judge an Eshu by his chosen \"court\" at your own peril."
 ojo_religion:0 "奥祖"
 ojo_religion_desc:0 "In the common parlance of the Eshu, Ojo (aw-jaw) means Daylight and Life. "
 ojo:0 "奥祖"
 ojo_adj:0 "奥祖"
 ojo_adherent:0 "奥祖"
 ojo_adherent_plural:0 "奥祖"
 ojo_desc:0 "In the common parlance of the Eshu, Ojo (aw-jaw) means Daylight and Life. Most Eshu you meet are, in fact, going to be Ojo. It comes naturally and most Elegbara draw strength from the millennia of traditions and history tied up in it. They do not, however, follow the Seelie Code (which they predate). They have their own standards to judge themselves by, though they will still uphold the Seelie which usually doesn't conflict. The Eshu simply have different core values.\nHeed the Call of Fate--All Ojo believe that the orishas ordain everything that happens.\nPass On What You Have Heard--If one doesn't remember history we repeat the same mistakes. A story forgotten is a blow against all Fae.\nSeek Justice for Those Unheard--Eshu feel a kinship with other marginalized peoples and do their best to help."
 iku_religion:0 "艾库"
 iku_reilgion_desc:0 "In the common parlance of the Eshu, Iku (ee-ku) is Death and Darkness."
 iku:0 "艾库"
 iku_adj:0 "艾库"
 iku_adherent:0 "艾库"
 iku_adherent_plural:0 "艾库"
 iku_desc:0 "In the common parlance of the Eshu, Iku (ee-ku) is Death and Darkness. The Iku see things a bit different the Ojo. The Eshu may say they treat both Ojo and Iku the same but the Iku know that's not true. They know the Ojo see them as a joke and a nasty, bitter one at that and the moment the rest know, you drop down a few notches on their list. Many think that because they don't bow down to destiny that they aren't real Elegbara but they have a code to. Though not so exactly like the Unseelie, they mesh alright.\nThere is No Destiny--What does this mean? They are truly, ultimately, Free!\nLeave Trouble in Your Wake--Chaos snaps people out of complacency. Make those in power afraid of you and what you know.\nVengeance is Divine--They look out for themselves first and make sure anyone who messes with them ends up missing something, whether ego, valuables, or body part."
 mu_religion:0 "魔宫"
 mu_religion_desc:0 "The Mu Courts are groups of Hsien who surrendered themselves to the Yama Kings in the Fourth Age as they saw no way out of the dilemma they had brought upon themselves by breaking the Mandate of Heaven. The two courts are not allied with each other but both are at odds with the other Hsien Courts."
 daityas:0 "底提耶"
 daityas_adj:0 "底提耶"
 daityas_adherent:0 "底提耶"
 daityas_adherent_plural:0 "底提耶"
 daityas_desc:0 "The Daityas are a Hsien Court who allied to the Yama Kings in the Fourth Age but have since turned away from them. Shortly after they pledged allegiance to the Yama Kings, the society of Daityas realized that the demons would only corrupt them and feed on their life energies and so they left the alliance. Through their own dark sorceries they, too, figured out how to maintain their bodies and avoid falling into nothingness as did the other Hsien.\nThe Daityas work to encourage the coming of the Sixth Age; to bring about a time when the August Personage of Jade is forced from his Celestial Court and the Dragons and Phoenixes war against each other in a bloody conflagration. By promoting lack of belief, they seek to weaken the wall created by the August Personage and so claim their rightful place in the Celestial Court.\nThough misguided in the eyes of the other Hsien, they are not beyond redemption. If they wanted to do so, they could come back to the right path and help the Hsien in avoiding the Age of Sorrow."
 kura_sau:0 "仓藏"
 kura_sau_adj:0 "仓藏"
 kura_sau_adherent:0 "仓藏"
 kura_sau_adherent_plural:0 "仓藏"
 kura_sau_desc:0 "The Kura Sau are a society of corrupted Hsien. Also referred to as the Gou Zhang, are a society of those Hsien that surrendered themselves to the Yama Kings and are regarded as a part of the Mu Courts. As a result, they are able to travel to Yomi Wan without suffering the curse of the August Personage In Jade. In addition, they have their own branch of Wu Tan known as Hac Tao, a vile art that allows them to carry the tainted chi of the Thousand Hells into the world.\They strive to fulfill the agendas of their dark masters, bringing on the Sixth Age and corrupting most of the Middle Kingdom. Most are dark reflections of the original Hsien and some answer even prayers, on condition that they involve bloodshed and satisfaction of darker urges. Some claim that the Kura Sau are even responsible for the corruption of some dragons and phoenixes, tempting them with promises of power that only the Yama Kings can grant."
 shu_shen:0 "竖神"
 shu_shen_adj:0 "竖神"
 shu_shen_adherent:0 "竖神"
 shu_shen_adherent_plural:0 "竖神"
 shu_shen_desc:0 "The Shu Shen are the dissolute of Shinma society. The Profane Gods, defy the concept of balance and pursue extremes of both carnality and violence. They loot, plunder, murder, and generally ruin the reputation of the benevolent Hsien everywhere. They are mercenaries and body guards for more powerful Shen who can pay their price, including Kuei-jin or even Kin-jin. They may have allies among vampires or even the servants of the Yama Kings."
 li_shen:0 "礼神"
 li_shen_adj:0 "礼神"
 li_shen_adherent:0 "礼神"
 li_shen_adherent_plural:0 "礼神"
 li_shen_desc:0 "Also called the Traditionalists, the Ceremony Gods or just the Fu, the Li Shen embrace Confucian values. They believe in the Tao Te Hsien but the emphasize the orderliness of nature and maintaining it, not enlightenment of the self. The protection of nature concerns them above all else and their numbers are almost entirely Kamuii. Once the most powerful of the courts, the Ceremony Gods have lost touch with the other Shen and all too often look down their noses at them. Due to this prejudice, as well as all the in-fighting between ministries, they Fu no longer do their job as well as they could."
 tu_shen:0 "笃神"
 tu_shen_adj:0 "笃神"
 tu_shen_adherent:0 "笃神"
 tu_shen_adherent_plural:0 "笃神"
 tu_shen_desc:0 "While regarded by most other Shinma as sybarites, the Gods of Harmony, or Ambassadors of Heaven, have the same goals as the Xian Mo... just very different ways of getting there. They seek to bring about the Age of Joy by convincing everyone to have a good time. Rapture, exultation, and not mere physical ecstasy is their goal. They understand that a good dinner with family and friends is more satisfying and sustaining a joy than a handful of pills. The Gods of Harmony act on their beliefs by doing good deeds, trying to get different courts of shen to work together or at least talk. They walk, and occasionally party, just like they talk.\nThe Ambassadors of Heaven are looked askance upon by the Li Shen and their relations are strained with the Yü as well. Most of the others at least enjoy their company. The Tu Shen, for their part, say they have good relations with all groups."
 xian_mo:0 "默仙"
 xian_mo_adj:0 "默仙"
 xian_mo_adherent:0 "默仙"
 xian_mo_adherent_plural:0 "默仙"
 xian_mo_desc:0 "Also called the Quiet Ones or Immortal Magical Spirits, the Xian Mo are mystics and strong believers in the Tao Te Hsien. They believe that enlightened individuals can create a perfect world and reverse the turn of Ages. This emphasis on the individual leads them to resist order; they even refuse to see themselves as a court. Xian Mo is a name other Hsien give them.\nThe Quiet Ones, though, give the Shinma hope, which most gave up at the end of the Fourth Age when the Wall barred them from the Spirit World. Hanuman brought the Tao Te Hsien to a Komuko sage in the Di Fu. The Komuko resigned their position and retired to the mountains. Eventually their teachings lead to the writings now called the Tao Te Hsien, or \"The Way of Imminent Hsien Power.\" Its ardent followers now make up the Xian Mo and their teachings have led some to pass beyond the Wall."
 xian_mun:0 "仙门"
 xian_mun_adj:0 "仙门"
 xian_mun_adherent:0 "仙门"
 xian_mun_adherent_plural:0 "仙门"
 xian_mun_desc:0 "The Xian Mun, also called the Immortal Society or the Worldly, are Shinma that either reject their true natures or are more concerned with their mortal lives. Some may even use their powers to promote other agendas. The best of the Worldly feel that it is possible to follow the Tao Te Hsien outside of traditional hsien society while the worst care little for it at all.\nThe Immortal Society see members of other courts as deluded fools. Individuals pay lip service (with a little cash and jade) to the local ministries and Yü strongmen just to be left alone. They tend to organize themselves along many different models, whether as families or corporations or other human institutions."
 yellow_lotus:0 "黄莲"
 yellow_lotus_adj:0 "黄莲"
 yellow_lotus_adherent:0 "黄莲"
 yellow_lotus_adherent_plural:0 "黄莲"
 yellow_lotus_desc:0 "The Yellow Lotus are a subtle, secret society within Hsien society. They are scattered among their fellow hsien and their goals can seem contradictory. In fact, no one knows their true agenda or who their members even are. Their one obvious aim is to foment rebellion within the ranks of the Shinma. They dredge up ancient rivalries and long-forgotten wrongs all to disrupt the order of the Li Shen ministries. They have also, however, claimed responsibility for punishing those who are too blatant about showing their wani forms and so sometimes act as a sort of secret police. Their work encompasses spreading rumors to assassination. What do they want? Maybe they just like stirring up chaos for its own sake."
 yu:0 "玉"
 yu_adj:0 "玉"
 yu_adherent:0 "玉"
 yu_adherent_plural:0 "玉"
 yu_desc:0 "The Yü, also called the Classicists or the Great Ten, model themselves after the Ten Chinese Kings of Chinese prehistory. (They may have even been some of them.) They carved the Middle Kingdom into 10 mystic provinces but their battles cause the borders to shift often. The generally support the Fu and their Ministries, as long as they can play them off of one another and draw upon their talents. The Yü have hoarded jade for centuries and possess some of the most powerful jade artifacts to this day. They also control many Dragon Nests.\nNot all of the Yü are nobles, though. Some are only powerful warlords and criminals who control powerful Tongs and Triads. These Shinma go toe to toe with other Shen who have interests in the less lawful business dealings of the Middle Kingdom like the Kuei-jin, Kindred, and others. None of the other Courts can afford to have bad relations with the Yü so they, in return, treat most of the others with respect. The Mu Courts and the Kuei-jin are their greatest enemies."
 wu_hsien:0 "妖仙屋室"
 wu_hsien_adj:0 "妖仙屋室"
 wu_hsien_adherent:0 "妖仙屋室"
 wu_hsien_adherent_plural:0 "妖仙屋室"
 wu_hsien_desc:0 "Also called the Peasants or the Family of Hsien, the Wu Hsien are a catchall society. It is an epithet for the vast majority of the Shinma who live in small villages and have strong ties to the land and local shrines. They may have tight organizations but only on a local scale. They can be insular and only concerned with the local people and environment.\nThere are undoubtedly more Hirayanu than Kamuii among the Peasants. These Hsien are often regarded as retainers of both the Li Shen and the Yü but their only loyalty really lies with the villages, shrines, and local sites of natural beauty."
