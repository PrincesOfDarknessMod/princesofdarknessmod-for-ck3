 winter_court_religion:0 "冬之王廷"
 winter_court_religion_adj:0 "冬之王廷"
 winter_court_religion_adherent:0 "冬妖精"
 winter_court_religion_adherent_plural:0 "冬妖精"
 winter_court_religion_desc:0 "The monsters of human legend, the creatures in the night's shadows—the Winter-kin live to inspire terror in humanity. Largely disdainful of the War of Seasons, the Court has lost much of its drive to eventually triumph over the other factions, now seeing them as almost below notice. The Winter fae seem incapable of empathizing with humanity, having neither basis nor starting ground to understand the mortals and their lives. Changelings (and Humanists) are rare in this court."
 winter_court:0 "冬之王廷"
 winter_court_adj:0 "冬之王廷"
 winter_court_adherent:0 "冬妖精"
 winter_court_adherent_plural:0 "冬妖精"
 winter_court_desc:0 "The most brutal of all the fae, the Winter-kin lurk under bridges and in dark forests. While they are vicious warriors, most of them are not looking forward to the end of the Oath-Truce with any degree of enthusiasm.  Organized war isn't much to their liking, but preying on humanity, the thrill of nighttime hunts, the taste of blood and fear—these things are very much to their tastes. It is only the notion of plunging the world into a dark, savage night that spurs them to participate in the War of Seasons at all."
 winter_court_militants:0 "冬之尚武派"
 winter_court_militants_adj:0 "冬之尚武派"
 winter_court_militants_adherent:0 "尚武派冬妖精"
 winter_court_militants_adherent_plural:0 "尚武派冬妖精"
 winter_court_militants_desc:0 "A great many fae are eager for the Oath-Truce to end so they can return to the engagements of the War or Seasons. The driving emotions from being Sained into a Court are fierce. The Winter-kin militants truly believes that their way of life is the true way—that the strongest deserve to rule. The resumption of the fae's war is not something that strikes dread into their cold hearts. It is a signal that the battle to decide the fate of the world can finally begin.\n\nThe Winter-kin are most brutal of all the fae, they lurk under bridges and in dark forests. Vicious warriors they preying upon humanity, the thrill of nighttime hunts, the taste of blood and fear—these things are very much to their tastes. They hunger for the War of Seasons so they can plunge the world into a dark, savage night."
 winter_court_trucebearers:0 "冬之休战派"
 winter_court_trucebearers_adj:0 "冬之休战派"
 winter_court_trucebearers_adherent:0 "休战派冬妖精"
 winter_court_trucebearers_adherent_plural:0 "休战派冬妖精"
 winter_court_trucebearers_desc:0 "As the Oath-Truce enters its last hours, the Winter fae 'Truce-Bearers' are hardly slavering for a fight with sharpened fangs and claws. Most members of this Court are actually somewhat apathetic about the War of Seasons. In many case, they are too removed from fae politics to keep up to speed with the latest shifting tide of alliances and betrayals; and to limit their involvement further, they often just don't care who is stabbing whom in the back over some petty local treaty. Many Winter fae are realists, and can see clearly that the War of Seasons is something of an unending trial. Most are more concerned with saving their own skins and protecting their domains against any human influence."
 winter_court_humanists:0 "冬之人文派"
 winter_court_humanists_adj:0 "冬之人文派"
 winter_court_humanists_adherent:0 "人文派冬妖精"
 winter_court_humanists_adherent_plural:0 "人文派冬妖精"
 winter_court_humanists_desc:0 "Is it better for the fae to be loved or fear by humans? The Court of Winter believes it is far better to be feared. Let the humans hate, so long as they fear. The Winter-kin Humanists approach humanity like a child torturing ants with a magnifying glass. They have an obsessive fascination with humans trying to determine how best to terrorize humans and extract glamour through that terror."
 winter_court_constantinians:0 "冬之君士坦丁派"
 winter_court_constantinians_adj:0 "冬之君士坦丁派"
 winter_court_constantinians_adherent:0 "君士坦丁派冬妖精"
 winter_court_constantinians_adherent_plural:0 "君士坦丁派冬妖精"
 winter_court_constantinians_desc:0 "The Winter Court Constantinians use their knowledge of the Church for their own advantage and to humanity's detriment. They have taken a great interest in the Church's persecution of heretics and witches—not so much the dogma but its techniques of torture and terror. The violent horror of the Albigensian Crusade has also sparked Winter-kin curiosity. Even the flagellants are of interest. The apocalyptic dreams of Christ with sword and vengeful angels may provide much glamour to be harvested."
 spring_court_religion:0 "春之王廷"
 spring_court_religion_adj:0 "春之王廷"
 spring_court_religion_adherent:0 "春妖精"
 spring_court_religion_adherent_plural:0 "春妖精"
 spring_court_religion_desc:0 "The Spring fae embrace change in all forms, watching life progress over the reasons and reveling it all of its myriad variations including the many different ways it can end. They have lost many of their greatest holdings from centuries past, but of all the Courts, they are the most adept at finding new homes and adapting to new surroundings."
 spring_court:0 "春之王廷"
 spring_court_adj:0 "春之王廷"
 spring_court_adherent:0 "春妖精"
 spring_court_adherent_plural:0 "春妖精"
 spring_court_desc:0 "In this new age of both faith and uncertainty, the Spring Court seeks to understand and resolve the wounds created between humanity and the fae. In the War of Seasons, they are keen fighters, eager to achieve victory once and for all; and in the mortal realm, they seek to regain the mantle of relevance to the humans and be feared and respected once more.\n\nThe Court of change and paradox,the Spring fae endeavor to change anything and everything to their advantage, before humanity either forgets them, or banishes the fae forever. Should such an impasse occur, the whole War of Seasons and all other efforts will come to a wasted end."
 spring_court_militants:0 "春之尚武派"
 spring_court_militants_adj:0 "春之尚武派"
 spring_court_militants_adherent:0 "尚武派春妖精"
 spring_court_militants_adherent_plural:0 "尚武派春妖精"
 spring_court_militants_desc:0 "In the War of Seasons, the Spring-kin militants are keen fighters, eager to achieve victory once and for all; and in the mortal realm, they seek to regain the mantle of relevance to the humans and be feared and respected once more. The Court of change and paradox, the Spring fae endeavor to change anything and everything to their advantage, before humanity either forgets them, or banishes the fae forever. Many Spring-kin Militants advocate discussing the issues of the human realm in-between hostile engagements with the other courts. Many Spring Courts boast the presence of assembled companies of soldiers, who, although a hollow reflection of the grand armies of the Battle of Stone, are still formidable for their skill and dedication."
 spring_court_trucebearers:0 "春之休战派"
 spring_court_trucebearers_adj:0 "春之休战派"
 spring_court_trucebearers_adherent:0 "休战派春妖精"
 spring_court_trucebearers_adherent_plural:0 "休战派春妖精"
 spring_court_trucebearers_desc:0 "While much of the Spring Court welcomes the end of the Oath-Truce as a great change, the Spring-kin Truce-Bearers argue that a compromise in which rule of the world cycles through the seasonal courts would be far more change than if a single court, even the Spring Court, came to rule alone."
 spring_court_humanists:0 "春之人文派"
 spring_court_humanists_adj:0 "春之人文派"
 spring_court_humanists_adherent:0 "人文派春妖精"
 spring_court_humanists_adherent_plural:0 "人文派春妖精"
 spring_court_humanists_desc:0 "The majority of the Spring Court follows a Humanist agenda. The Spring-kin are often seen as the most protective of humanity, although this is by no means necessarily an act of dedicated altruism. The Spring fae realize they must reinforce the mutually beneficial relationship between the two races, lest the fae slip from the minds of the mortals for all time. Consequently, their oaths often involve helping or protecting humans, although such weighty oaths require equally substantial pledges from the oath-bound mortal."
 spring_court_constantinians:0 "春之君士坦丁派"
 spring_court_constantinians_adj:0 "春之君士坦丁派"
 spring_court_constantinians_adherent:0 "君士坦丁派春妖精"
 spring_court_constantinians_adherent_plural:0 "君士坦丁派春妖精"
 spring_court_constantinians_desc:0 "The Spring Court boasts the largest portion of those fae who seek to understand the Church for the betterment and balance of both worlds. They work quickly to research and understand the marvels of things like vast cathedrals, holy prayer and the Crusades. The rise the church of the One God is certainly the biggest change to occur to the humans, and the Spring-kin Constantinians want to be part of what changes the Church brings next."
 summer_court_religion:0 "夏之王廷"
 summer_court_religion_adj:0 "夏之王廷"
 summer_court_religion_adherent:0 "夏妖精"
 summer_court_religion_adherent_plural:0 "夏妖精"
 summer_court_religion_desc:0 "The Summer Court prides itself on adherence to tradition and structure, and harsh observance of discipline. Summer fae are stern but fair masters, and their love of traditions means that they have retained many treasures and strongholds from ages past."
 summer_court:0 "夏之王廷"
 summer_court_adj:0 "夏之王廷"
 summer_court_adherent:0 "夏妖精"
 summer_court_adherent_plural:0 "夏妖精"
 summer_court_desc:0 "Wrapped in the traditional roles of the fae, the Sumer Court is populated by living reflections of Faerie-kind's fading might. The very core of this Court is the literal embodiment of unchanging stasis; and in the pillars of tradition and history, the Summer fae find a unique strength. The dignified Summer fae are aware of the changes with the mortal realm, but have made a conscious choice to resist them. Humankind has forgotten the old ways. The Summer fae have not. For these traditionalists, is time to remind the mortals of the way of things once—renewing all of their faded ties, reminding them of all the lost customs, and restoring the upstarts to their proper place in the world. For the Summer fae, ignorance of the law is no excuse. Humanity may have forgotten many of its oaths, but that does not mean punishment should be lightened accordingly."
 summer_court_militants:0 "夏之尚武派"
 summer_court_militants_adj:0 "夏之尚武派"
 summer_court_militants_adherent:0 "尚武派夏妖精"
 summer_court_militants_adherent_plural:0 "尚武派夏妖精"
 summer_court_militants_desc:0 "As the Oath-Truce moves into its final days, the faeries of the Summer Court are preparing for the resumption of conflict with gladdened hearts and sharpened blades. The War of Seasons is their battle, they have ever believed they would emerge as the ultimate victors.\n\nMost Summer holdings have traditional and utterly ostentatious shows of military influence. Be it war banners hanging from the rafters of a palace's throne room, or a collection of tunnels under the Earth filled with the pipes, flutes and harp-notes of an ancient war song, many of the Summer fae prize the tools of war and are fierce advocates of the Militant agenda. The Court bears a passionate hatred of the Patrons, which stands to reason considering the Summer fae's ardent assurance that they will triumph in the War of Seasons."
 summer_court_trucebearers:0 "夏之休战派"
 summer_court_trucebearers_adj:0 "夏之休战派"
 summer_court_trucebearers_adherent:0 "休战派夏妖精"
 summer_court_trucebearers_adherent_plural:0 "休战派夏妖精"
 summer_court_trucebearers_desc:0 "Truce-Bearers are almost unheard of in the Summer Court, and those who do pursue that agenda usually do so with the single intention of  allowing their own domains more time to prepare for the eventual recommencement of battle. Other summer-kin, over the course of the 800 years since the Battle of Stone (and especially during the 100 years of the Oath-Truce) have forged close alliances and friendships with the members of rival Courts, and are less than eager to take the field against these new comrades. Finally some fae don't care if the Courts return to war; they would just rather they themselves didn't have to join in the conflict. Some summer-kin even advocate a return to Arcadia."
 summer_court_humanists:0 "夏之人文派"
 summer_court_humanists_adj:0 "夏之人文派"
 summer_court_humanists_adherent:0 "人文派夏妖精"
 summer_court_humanists_adherent_plural:0 "人文派夏妖精"
 summer_court_humanists_desc:0 "The Summer-kin want humans to 'know their place' and see enchanted humans primarily as servants. They wish to reinforce the old relationships where to humans, the Summer fae are no less than awe-inspiring creatures of legend that can bring tears of joy or fear to mortal eyes."
 summer_court_constantinians:0 "夏之君士坦丁派"
 summer_court_constantinians_adj:0 "夏之君士坦丁派"
 summer_court_constantinians_adherent:0 "君士坦丁派夏妖精"
 summer_court_constantinians_adherent_plural:0 "君士坦丁派夏妖精"
 summer_court_constantinians_desc:0 "Some Summer-kin see a reflection of their own beliefs in the importance of ritual practice and hierarchy in the Church. Christianity has survived and even thrived for more than a millennium—it is just long enough as an institution to gain a grudging respect for some of the Summer Court. For many Summer changelings, the Church seems as eternal and immutable as the true fae. The Summer Court Constantinians seek to draw out the ancient traditions of Christianity from Jesus' resurrection depicted as a sunrise to Constantine's obsession with Sol Invictus. Let there be light!"
 autumn_court_religion:0 "秋之王廷"
 autumn_court_religion_adj:0 "秋之王廷"
 autumn_court_religion_adherent:0 "秋妖精"
 autumn_court_religion_adherent_plural:0 "秋妖精"
 autumn_court_religion_desc:0 "Fascinated with humanity, even more than most fae, the Autumn-kin are contemplative and clever. Swearing an oath with an Autumn fae is much like making a deal with the devil—enticing, empowering and often deadly in the final accounting. The Autumn fae look at humans and their faith with wonder and ambition, and they of all faeries know that the next phase of the War of Seasons depends entirely on dealing with humanity."
 autumn_court:0 "秋之王廷"
 autumn_court_adj:0 "秋之王廷"
 autumn_court_adherent:0 "秋妖精"
 autumn_court_adherent_plural:0 "秋妖精"
 autumn_court_desc:0 "The fae of the Autumn Court seek to hide their true selves from the humans, dominating and manipulating them from behind facades of mysterious benefactors. The Autumn fae realize that the mortals are slowly replacing the presence of fae in their lives with the incantations to a distant God.\n\nMany work to understand humanity's new stance and restore themselves as half-hidden overlords, while others seek to use humanity and the old oaths as weapons in the War of Seasons. Mortals, for all their frailties and weaknesses, are useful because of the oaths that bind them—useful both as shields against banality and as allies in the coming conflict."
 autumn_court_militants:0 "秋之尚武派"
 autumn_court_militants_adj:0 "秋之尚武派"
 autumn_court_militants_adherent:0 "尚武派秋妖精"
 autumn_court_militants_adherent_plural:0 "尚武派秋妖精"
 autumn_court_militants_desc:0 "Militants emerge from every Court, although Autumn Court has least among their number eager for battle. A few of the Autumn fae are eager for the Oath-Truce to end so they can return to the engagements of the War or Seasons.\n\nThe Autumn-Kin militants weave intrigues to manipulate fae and mortal alike serve as pawns in the war. They seek to use humanity and the old oaths as weapons in the War of Seasons. Mortals, for all their frailties and weaknesses, are useful because of the oaths that bind them—useful both as shields against banality and as allies in the coming conflict. The War of Seasons began with assassinations, skirmisher ambushes, duped human and fae proxy attacks, backstabbing, Solstice mercenaries and surprise—the Autumn fae believe it can be won by such means as well. Strike from the shadows!"
 autumn_court_trucebearers:0 "秋之休战派"
 autumn_court_trucebearers_adj:0 "秋之休战派"
 autumn_court_trucebearers_adherent:0 "休战派秋妖精"
 autumn_court_trucebearers_adherent_plural:0 "休战派秋妖精"
 autumn_court_trucebearers_desc:0 "The Autumn fae have opened their eyes and lowered their swords, because something is very, very wrong. The War of Seasons is a fool's gamble—Nigh-impossible to win, and crippling to the victors, for the Court that eventually achieves victory will be so weakened from the War that any triumph will be rendered pointless. The Autmun Court's fae are directing their attentions that the world is no longer theirs. The Autumn fae realize that what comes after the conflict is the truly the most important aspect. The humans have magic from their invented divine overseer, which makes many fae wonder if the One Above is indeed a mortal invention or not. Since the age of openly declared fae rule, the face of the world has altered too significantly to simply reveal themselves to the humans and expect fear, adoration and respect. Now, different methods must be employed if the fae wish to achieve their goals. The War of Seasons can wait. Now is the time to take stock of the world and see what the great war is actually being fought for."
 autumn_court_humanists:0 "秋之人文派"
 autumn_court_humanists_adj:0 "秋之人文派"
 autumn_court_humanists_adherent:0 "人文派秋妖精"
 autumn_court_humanists_adherent_plural:0 "人文派秋妖精"
 autumn_court_humanists_desc:0 "While most fae are Humanist to one degree or another, members of this faction significantly populate the Autumn Court. The fae of the Autumn Court excel at seeing the larger picture and working toward their goals with this in mind. Fascinated with humanity, even more than most fae, the Autumn-kin are contemplative and clever. Swearing an oath with an Autumn fae is much like making a deal with the devil—enticing, empowering and often deadly in the final accounting. The Autumn fae look at humans and their faith with wonder and ambition, and they of all faeries know that the next phase of the War of Seasons depends entirely on dealing with humanity. The fae of the Autumn Court seek to hide their true selves from the humans, dominating and manipulating them from behind facades of mysterious benefactors."
 autumn_court_constantinians:0 "秋之君士坦丁派"
 autumn_court_constantinians_adj:0 "秋之君士坦丁派"
 autumn_court_constantinians_adherent:0 "君士坦丁派秋妖精"
 autumn_court_constantinians_adherent_plural:0 "君士坦丁派秋妖精"
 autumn_court_constantinians_desc:0 "The Autumn Court is flooded with Constantinians, who make tentative contacts with select mortals in their immense undertaking to comprehend the complexities and power of human faith. The power of baptism terrifies the Autumn fae more than any other Court, both because the Court largely consists of changelings, and because they have learned the most about the intricacies of human faith. Baptism itself is unanimously regarded with horror, for a ritual that can immediately counteract a Saining and wash a fae clean of his mystical powers is seen as nothing less than a fate worse than death.\n\nThe Autumn-kin are pragmatic. Rather than seeing the Church as an enemy to be opposed and halted, they view it as a mystery to be revealed, opened and studied. Once the power of mortals' beliefs is understood, perhaps even the Mists will return to their more benevolent balance."
 solstice_court_religion:0 "至日王廷"
 solstice_court_religion_adj:0 "至日王廷"
 solstice_court_religion_adherent:0 "至日妖精"
 solstice_court_religion_adherent_plural:0 "至日妖精"
 solstice_court_religion_desc:0 "Courtless and scattered, the unSained are the neutral faction in the War of Seasons. While most are ignored, disregarded or simply despised, the Solstice fae can also make mercenaries and diplomats of extraordinary skill and usefulness, due to their unbiased stance in the whole conflict. A Solstice fae can be either a great boon to an oathcircle, or a great burden, depending on the local fae and their opinions—and the Solstice-king's personal skills. Many of them ignore fae society completely and exist on the fringes of domains, while others carve out what lives they can as sell-swords and couriers for the high and mighty Courts."
 solstice_court:0 "至日王廷"
 solstice_court_adj:0 "至日王廷"
 solstice_court_adherent:0 "至日妖精"
 solstice_court_adherent_plural:0 "至日妖精"
 solstice_court_desc:0 "Courtless and scattered, the unSained are the neutral faction in the War of Seasons. While most are ignored, disregarded or simply despised, the Solstice fae can also make mercenaries and diplomats of extraordinary skill and usefulness, due to their unbiased stance in the whole conflict. A Solstice fae can be either a great boon to an oathcircle, or a great burden, depending on the local fae and their opinions—and the Solstice-kin's personal skills. Many of them ignore fae society completely and exist on the fringes of domains, while others carve out what lives they can as sell-swords and couriers for the high and mighty Courts."
 solstice_court_militants:0 "至日王廷尚武派"
 solstice_court_militants_adj:0 "至日王廷尚武派"
 solstice_court_militants_adherent:0 "尚武派至日妖精"
 solstice_court_militants_adherent_plural:0 "尚武派至日妖精"
 solstice_court_militants_desc:0 "For all their perceived vulnerabilities, Solstice mercenaries are the hirelings of choice in the War of Seasons. It is safer to acquire the services of the Solstice fae over any Sained fae, because the Courtless have no predetermined or pre-sworn loyalties. While most are ignored, disregarded or simply despised, the Solstice fae can also make mercenaries of extraordinary skill and usefulness, due to their unbiased stance in the whole conflict. As soldiers, the Solstice fae are in their element.\n\nMany Solstice fae have earned their reputations for reliability through years of diligence, effort and conflict. Many of this creed of Solstice-kin see themselves as the elite of the elite—they are true-blooded fae, above the limitations that Court-bound fae must endure. It is these fae who are eager for the Oath-Truce to finally fall, so that they can once again accept military contracts. These tend to be the Solstice-kin that make the most desirable and keen hirelings."
 solstice_court_trucebearers:0 "至日王廷休战派"
 solstice_court_trucebearers_adj:0 "至日王廷休战派"
 solstice_court_trucebearers_adherent:0 "休战派至日妖精"
 solstice_court_trucebearers_adherent_plural:0 "休战派至日妖精"
 solstice_court_trucebearers_desc:0 "While most are ignored, disregarded or simply despised, the Solstice fae can also make diplomats of extraordinary skill and usefulness, due to their unbiased stance in the whole conflict. As diplomats, message-bearers, spies and ambassadors, the Solstice fae are in their element. The Courtless Truce-Bearers are isolated individuals or small groups of fae who fervently work in the social arena to sway the local courts towards peace. Unsurprisingly, they are rarely successful, but this only serves to stoke the fires in their hearts. Peace, no matter the price, is their calling."
 solstice_court_humanists:0 "至日王廷人文派"
 solstice_court_humanists_adj:0 "至日王廷人文派"
 solstice_court_humanists_adherent:0 "人文派至日妖精"
 solstice_court_humanists_adherent_plural:0 "人文派至日妖精"
 solstice_court_humanists_desc:0 "Very few Solstice fae risk prolonged contact with humanity, as they are unable to forge magical oaths with mortals. Those few Courtless following a Humanist agenda are drawn to humanity like a moth to the flame. The Humanist faction does not necessarily advocate kindness and tolerance when dealing with the human realm, rather it embraces an ethic that is primarily concerned with understanding humanity."
 solstice_court_constantinians:0 "至日君士坦丁派"
 solstice_court_constantinians_adj:0 "至日君士坦丁派"
 solstice_court_constantinians_adherent:0 "君士坦丁派至日妖精"
 solstice_court_constantinians_adherent_plural:0 "君士坦丁派至日妖精"
 solstice_court_constantinians_desc:0 "The Solstice Court fae, having rejected the War of Seasons and the values of the Seasonal courts, may be the most open to abandoning Fae ideals to seek conversion into the Church. If only there is some way they could hold their fae nature through the baptism but could also gain the powers of true faith."
 holy_order_winters_teeth:0 "冬之牙"
 holy_order_green_blades:0 "青之刃"
 holy_order_sun_guard:0 "太阳守卫"
 holy_order_crunch_of_leaves:0 "叶之脆响"
 holy_order_sunset_mercenaries:0 "日落佣兵"
 empire_of_seeds:0 "种子帝国"
 empire_of_seeds_adj:0 "种子帝国"
 empire_of_seeds_adherent:0 "种子"
 empire_of_seeds_adherent_plural:0 "种子"
 empire_of_seeds_desc:0 "库贝拉——元素妖门属之一——的王廷。树精的国度是一个共享生命和物资的林中团体。宁芙的母界是树精位于[dreaming|E]诸界中心的广袤森林。在政治上，树精支持格洛姆，但对索利蒙德母界的待遇有所保留。作为受到造化之战影响最大的类群，他们对索利蒙德的再融入的事业并不十分同情。春分节是由库贝拉主办的盛大集市。元素妖的音乐家、艺术家和工匠汇聚一堂，展示他们的商品，共同庆祝生命的新陈代谢和冬天的结束。如果帝国领导人需要进行联合公告，这就是恰当的时间和地点。月会是一个假期，库贝拉在俄罗斯某处的高夏季节的一个巨大林地中聚集。在这里，树精被允许向他们的皇帝提出请愿。"
 empire_of_stones:0 "岩石帝国"
 empire_of_stones_adj:0 "岩石帝国"
 empire_of_stones_adherent:0 "岩石"
 empire_of_stones_adherent_plural:0 "岩石"
 empire_of_stones_desc:0 "格罗姆——元素妖门属之一——的王廷。岩石帝国是一个严格的阶级社会。每个格罗姆都知道自己在整体中的位置。同时，帝国也是一个任人唯贤的组织。对于那些能够推动帝国事业的人的晋升总是很快。格罗姆的[dreaming|E]母界是一座由活山生长而成的巨大城堡。它曾被围攻过三次，每次入侵都被击退和粉碎。在这个结构的核心是数条奇魅铁脉中的一条。在所有的帝国中，格罗姆在政治上的立场是最极端的。他们坚持认为索利蒙德必须被摧毁。由格罗姆主办的冬至节是在[dreaming|E]中举行的一场盛大比武，类似于奥运会，只不过重点是武艺。获胜者将被赞扬，并且如果是格罗姆，注定会迅速晋升。"
 empire_of_flames:0 "火焰帝国"
 empire_of_flames_adj:0 "火焰帝国"
 empire_of_flames_adherent:0 "火焰"
 empire_of_flames_adherent_plural:0 "火焰"
 empire_of_flames_desc:0 "索利蒙德——元素妖门属之一——王廷。沙罗曼达的国度拥有复杂的帝国君主制度，具有贵族等级制度、盛大仪式和礼仪，可以与仙族创造的任何事物相媲美。诸帝国中最初爱上肉人的是火灵们，受这种不幸的激情驱使，他们花费了无数岁月观察人类，并以爱人的眼光学习他们奇特而令人敬畏的思想。最终，他们再也无法隐藏，展示了自己的身份，并向人们展示了火焰的运作方式，以及它具备的变幻和真理的力量。因此，他们注定使元素妖世界沦为男人和女人手中的奴隶，并引发了造化之战，迫使其他帝国对这些叛逆的火焰进行了斗争，并将其排斥出去。现在，其他缓慢的帝国正在寻找扑灭沙罗曼达的根基。沙罗曼达的[dreaming|E]母界曾经是一个铜色的宫殿和庄园的景观，天空上燃起了一片火焰的地平线。夏至节是一个庄重而高贵、美丽非凡的假面舞会，同时也是一个为期四天的大学，索利蒙德会在那里聚集并分享他们的知识。"
 empire_of_tears:0 "泪水帝国"
 empire_of_tears_adj:0 "泪水帝国"
 empire_of_tears_adherent:0 "泪水"
 empire_of_tears_adherent_plural:0 "泪水"
 empire_of_tears_desc:0 "温蒂妮——元素妖门属之一——的王廷。涅瑞伊得斯以雅典式的民主方式管理他们的帝国。任何涅瑞伊得斯都可以就任何问题投票。心灵收集者的[dreaming|E]母界是一个无边无际的海洋，延伸到每一个地平线。二十英里深处，是一个有着巨大的珊瑚建筑和高速公路的城市。任何来访者必须能够在水下呼吸。许多海盗船长知道如何通过[dreaming|E]中的捷径来导航，因为它与地球上的每一个水域和[dreaming|E]都有联通。在政治上，这个帝国没有敌人，并与所有其他元素妖保持友好关系，尽管火和水从来有过极好的关系。秋分节是温蒂妮和帕罗塞米共同举办的节日。所有人都受邀来到涅瑞伊得斯的水下宫殿，氧气由天妖精供应。盛宴十分丰盛，经常赠送礼物。"
 empire_of_skies:0 "天空帝国"
 empire_of_skies_adj:0 "天空帝国"
 empire_of_skies_adherent:0 "西尔芙"
 empire_of_skies_adherent_plural:0 "西尔芙"
 empire_of_skies_desc:0 "帕罗塞米——元素妖门属之一——的王廷。天妖精的政府一般被认为为无政府主义和部落主义的结合。每年一次，最年长的13名活跃成员聚集在一起讨论影响所有小精灵的问题，然后发表冗长而华丽的宣言，但很快就会被所有人忽视。在[deep_dreaming|E]中的帕罗塞米母界看起来像是由云和玻璃构成的国度。幻兽在云状的草地上吃草，轻盈的人们徒步或飞行在精致的乡村漫步。在领域的中心，一座云状的塔，形状像独角兽的角，直插云霄，坚如大理石。顶部是议会会议的地方。他们与泪水帝国保持良好关系，进行稳定的雨水蒸发贸易。对于岩石帝国来说，他们被认为太无聊了，只保持了肤浅的关系。他们与种子帝国保持友好关系。他们没有计划参加封锁火焰帝国的行动。没有人对人偶帝国有任何话要说。秋分节是温蒂妮和帕罗塞米共同举办的节日。所有人都受邀来到涅瑞伊得斯的水下宫殿，氧气由天妖精供应。盛宴十分丰盛，经常赠送礼物。"
 empire_of_dolls:0 "人偶帝国"
 empire_of_dolls_adj:0 "人偶帝国"
 empire_of_dolls_adherent:0 "人偶"
 empire_of_dolls_adherent_plural:0 "人偶"
 empire_of_dolls_desc:0 "马内坎——元素妖门属之一——的王廷。玩偶声称没有帝国或母界。他们偶尔聚集在[dreaming|E]的宁静之地，保持他们的私密会议，并偶尔出现在其他帝国的宫廷上提供建议。一位自称代表整个马内坎的使者身穿黑袍，即使是格洛姆的元帅也会倾听黑袍带来的消息。马内坎从未邀请任何人来到他们的会议地点。在诸帝国的政治中，马内坎作为变革的催化剂。当他们的使者出现时，政策的转变近在眼前。许多人想知道黑袍的秘密是什么，但其他帝国永远不会透露其中的内容。在为数不多的几次使者对整个帝国演说发生时，战争都很快就会紧随其后。虽然马内坎没有每年的仪式，但有传言称，除夕夜的11点59分到午夜之间的时间被他们窃取了。人们窃窃私语，在那一分钟里，所有的玩偶都会醒来，过上一整天完全像人类一样的生活，然后回到他们的锚点，时间又回溯到午夜。如果这是真的，那将有助于解释为什么人偶对其他帝国所隐藏的许多事情了如指掌。"
 eshu_religion:0 "逸抒"
 eshu_religion_desc:0 "The Eshu have their own codes of conduct that differ from the courts of the Sidhe. Those who follow the ways of honor and tradition prefer Ojo, or daylight, fae. Those who follow their philosophy of casting off old ways and indulging passions, a death of tradition, call themselves Iku, or death. Don't think this means that all Ojo are kind and generous or all (or even most) Iku are murderous revelers. Both groups follow Uhuru. It can be as bad to be caught in the hands of an Ojo judge who will not bend as it is to be caught by an Iku with a grudge. The Eshu attach no stigma to these philosophies, except in extreme cases, because of all the fae they see themselves as individuals. Judge an Eshu by his chosen \"court\" at your own peril."
 ojo_religion:0 "奥祖"
 ojo_religion_desc:0 "In the common parlance of the Eshu, Ojo (aw-jaw) means Daylight and Life. "
 ojo:0 "奥祖"
 ojo_adj:0 "奥祖"
 ojo_adherent:0 "奥祖"
 ojo_adherent_plural:0 "奥祖"
 ojo_desc:0 "In the common parlance of the Eshu, Ojo (aw-jaw) means Daylight and Life. Most Eshu you meet are, in fact, going to be Ojo. It comes naturally and most Elegbara draw strength from the millennia of traditions and history tied up in it. They do not, however, follow the Seelie Code (which they predate). They have their own standards to judge themselves by, though they will still uphold the Seelie which usually doesn't conflict. The Eshu simply have different core values.\nHeed the Call of Fate — All Ojo believe that the orishas ordain everything that happens.\nPass On What You Have Heard — If one doesn't remember history we repeat the same mistakes. A story forgotten is a blow against all Fae.\nSeek Justice for Those Unheard — Eshu feel a kinship with other marginalized peoples and do their best to help."
 iku_religion:0 "艾库"
 iku_reilgion_desc:0 "In the common parlance of the Eshu, Iku (ee-ku) is Death and Darkness."
 iku:0 "艾库"
 iku_adj:0 "艾库"
 iku_adherent:0 "艾库"
 iku_adherent_plural:0 "艾库"
 iku_desc:0 "In the common parlance of the Eshu, Iku (ee-ku) is Death and Darkness. The Iku see things a bit different the Ojo. The Eshu may say they treat both Ojo and Iku the same but the Iku know that's not true. They know the Ojo see them as a joke and a nasty, bitter one at that and the moment the rest know, you drop down a few notches on their list. Many think that because they don't bow down to destiny that they aren't real Elegbara but they have a code to. Though not so exactly like the Unseelie, they mesh alright.\nThere is No Destiny — What does this mean? They are truly, ultimately, Free!\nLeave Trouble in Your Wake — Chaos snaps people out of complacency. Make those in power afraid of you and what you know.\nVengeance is Divine — They look out for themselves first and make sure anyone who messes with them ends up missing something, whether ego, valuables, or body part."
 mu_religion:0 "魔宫"
 mu_religion_desc:0 "The Mu Courts are groups of Hsien who surrendered themselves to the Yama Kings in the [fourth_age|E] as they saw no way out of the dilemma they had brought upon themselves by breaking the Mandate of Heaven. The two courts are not allied with each other but both are at odds with the other Hsien Courts."
 daityas:0 "底提耶"
 daityas_adj:0 "底提耶"
 daityas_adherent:0 "底提耶"
 daityas_adherent_plural:0 "底提耶"
 daityas_desc:0 "The Daityas are a Hsien Court who allied to the Yama Kings in the [fourth_age|E] but have since turned away from them. Shortly after they pledged allegiance to the Yama Kings, the society of Daityas realized that the demons would only corrupt them and feed on their life energies and so they left the alliance. Through their own dark sorceries they, too, figured out how to maintain their bodies and avoid falling into nothingness as did the other Hsien.\nThe Daityas work to encourage the coming of the [sixth_age|E]; to bring about a time when the August Personage of Jade is forced from his Celestial Court and the Dragons and Phoenixes war against each other in a bloody conflagration. By promoting lack of belief, they seek to weaken the wall created by the August Personage and so claim their rightful place in the Celestial Court.\nThough misguided in the eyes of the other Hsien, they are not beyond redemption. If they wanted to do so, they could come back to the right path and help the Hsien in avoiding the Age of Sorrow."
 kura_sau:0 "仓藏"
 kura_sau_adj:0 "仓藏"
 kura_sau_adherent:0 "仓藏"
 kura_sau_adherent_plural:0 "仓藏"
 kura_sau_desc:0 "The Kura Sau are a society of corrupted Hsien. Also referred to as the Gou Zhang, are a society of those Hsien that surrendered themselves to the Yama Kings and are regarded as a part of the Mu Courts. As a result, they are able to travel to Yomi Wan without suffering the curse of the August Personage In Jade. In addition, they have their own branch of Wu Tan known as Hac Tao, a vile art that allows them to carry the tainted chi of the Thousand Hells into the world.\They strive to fulfill the agendas of their dark masters, bringing on the [sixth_age|E] and corrupting most of the Middle Kingdom. Most are dark reflections of the original Hsien and some answer even prayers, on condition that they involve bloodshed and satisfaction of darker urges. Some claim that the Kura Sau are even responsible for the corruption of some dragons and phoenixes, tempting them with promises of power that only the Yama Kings can grant."
 shu_shen:0 "渎神"
 shu_shen_adj:0 "渎神"
 shu_shen_adherent:0 "渎神"
 shu_shen_adherent_plural:0 "渎神"
 shu_shen_desc:0 "渎神是神魔社会的放荡不羁者。亵神蔑视平衡的概念，追求极端的肉欲和暴力。他们抢劫、掠夺、谋杀，到处败坏仁慈的妖仙的名声。他们是更强大的鬼神的雇佣兵和护卫，只要他们能付出代价，包括鬼人甚至该隐人。他们可能会与吸血鬼甚至阎魔的仆人结盟。"
 li_shen:0 "礼神"
 li_shen_adj:0 "礼神"
 li_shen_adherent:0 "礼神"
 li_shen_adherent_plural:0 "礼神"
 li_shen_desc:0 "Also called the Traditionalists, the Ceremony Gods or just the Fu, the Li Shen embrace Confucian values. They believe in the Tao Te Hsien but the emphasize the orderliness of nature and maintaining it, not enlightenment of the self. The protection of nature concerns them above all else and their numbers are almost entirely Kamuii. Once the most powerful of the courts, the Ceremony Gods have lost touch with the other Shen and all too often look down their noses at them. Due to this prejudice, as well as all the in-fighting between ministries, they Fu no longer do their job as well as they could."
 tu_shen:0 "途神"
 tu_shen_adj:0 "途神"
 tu_shen_adherent:0 "途神"
 tu_shen_adherent_plural:0 "途神"
 tu_shen_desc:0 "While regarded by most other Shinma as sybarites, the Gods of Harmony, or Ambassadors of Heaven, have the same goals as the Xian Mo... just very different ways of getting there. They seek to bring about the Age of Joy by convincing everyone to have a good time. Rapture, exultation, and not mere physical ecstasy is their goal. They understand that a good dinner with family and friends is more satisfying and sustaining a joy than a handful of pills. The Gods of Harmony act on their beliefs by doing good deeds, trying to get different courts of shen to work together or at least talk. They walk, and occasionally party, just like they talk.\nThe Ambassadors of Heaven are looked askance upon by the Li Shen and their relations are strained with the Yü as well. Most of the others at least enjoy their company. The Tu Shen, for their part, say they have good relations with all groups."
 xian_mo:0 "默仙"
 xian_mo_adj:0 "默仙"
 xian_mo_adherent:0 "默仙"
 xian_mo_adherent_plural:0 "默仙"
 xian_mo_desc:0 "Also called the Quiet Ones or Immortal Magical Spirits, the Xian Mo are mystics and strong believers in the Tao Te Hsien. They believe that enlightened individuals can create a perfect world and reverse the turn of Ages. This emphasis on the individual leads them to resist order; they even refuse to see themselves as a court. Xian Mo is a name other Hsien give them.\nThe Quiet Ones, though, give the Shinma hope, which most gave up at the end of the [fourth_age|E] when the Wall barred them from the Spirit World. Hanuman brought the Tao Te Hsien to a Komuko sage in the Di Fu. The Komuko resigned their position and retired to the mountains. Eventually their teachings lead to the writings now called the Tao Te Hsien, or \"The Way of Imminent Hsien Power.\" Its ardent followers now make up the Xian Mo and their teachings have led some to pass beyond the Wall."
 xian_mun:0 "仙门"
 xian_mun_adj:0 "仙门"
 xian_mun_adherent:0 "仙门"
 xian_mun_adherent_plural:0 "仙门"
 xian_mun_desc:0 "The Xian Mun, also called the Immortal Society or the Worldly, are Shinma that either reject their true natures or are more concerned with their mortal lives. Some may even use their powers to promote other agendas. The best of the Worldly feel that it is possible to follow the Tao Te Hsien outside of traditional hsien society while the worst care little for it at all.\nThe Immortal Society see members of other courts as deluded fools. Individuals pay lip service (with a little cash and jade) to the local ministries and Yü strongmen just to be left alone. They tend to organize themselves along many different models, whether as families or corporations or other human institutions."
 yellow_lotus:0 "黄莲"
 yellow_lotus_adj:0 "黄莲"
 yellow_lotus_adherent:0 "黄莲"
 yellow_lotus_adherent_plural:0 "黄莲"
 yellow_lotus_desc:0 "The Yellow Lotus are a subtle, secret society within Hsien society. They are scattered among their fellow hsien and their goals can seem contradictory. In fact, no one knows their true agenda or who their members even are. Their one obvious aim is to foment rebellion within the ranks of the Shinma. They dredge up ancient rivalries and long-forgotten wrongs all to disrupt the order of the Li Shen ministries. They have also, however, claimed responsibility for punishing those who are too blatant about showing their wani forms and so sometimes act as a sort of secret police. Their work encompasses spreading rumors to assassination. What do they want? Maybe they just like stirring up chaos for its own sake."
 yu:0 "玉"
 yu_adj:0 "玉"
 yu_adherent:0 "玉"
 yu_adherent_plural:0 "玉"
 yu_desc:0 "The Yü, also called the Classicists or the Great Ten, model themselves after the Ten Chinese Kings of Chinese prehistory. (They may have even been some of them.) They carved the Middle Kingdom into 10 mystic provinces but their battles cause the borders to shift often. The generally support the Fu and their Ministries, as long as they can play them off of one another and draw upon their talents. The Yü have hoarded jade for centuries and possess some of the most powerful jade artifacts to this day. They also control many Dragon Nests.\nNot all of the Yü are nobles, though. Some are only powerful warlords and criminals who control powerful Tongs and Triads. These Shinma go toe to toe with other Shen who have interests in the less lawful business dealings of the Middle Kingdom like the Kuei-jin, Kindred, and others. None of the other Courts can afford to have bad relations with the Yü so they, in return, treat most of the others with respect. The Mu Courts and the Kuei-jin are their greatest enemies."
 wu_hsien:0 "妖仙屋室"
 wu_hsien_adj:0 "妖仙屋室"
 wu_hsien_adherent:0 "妖仙屋室"
 wu_hsien_adherent_plural:0 "妖仙屋室"
 wu_hsien_desc:0 "Also called the Peasants or the Family of Hsien, the Wu Hsien are a catchall society. It is an epithet for the vast majority of the Shinma who live in small villages and have strong ties to the land and local shrines. They may have tight organizations but only on a local scale. They can be insular and only concerned with the local people and environment.\nThere are undoubtedly more Hirayanu than Kamuii among the Peasants. These Hsien are often regarded as retainers of both the Li Shen and the Yü but their only loyalty really lies with the villages, shrines, and local sites of natural beauty."
 eshu_religion_adj:0 "逸抒"
 eshu_religion_adherent:0 "逸抒"
 eshu_religion_adherent_plural:0 "逸抒"
 ojo_religion_adj:0 "奥祖"
 ojo_religion_adherent:0 "奥祖"
 ojo_religion_adherent_plural:0 "奥祖"
 iku_religion_adj:0 "艾库"
 iku_religion_adherent:0 "艾库"
 iku_religion_adherent_plural:0 "艾库"
 mu_religion_adj:0 "魔宫"
 mu_religion_adherent:0 "魔"
 mu_religion_adherent_plural:0 "魔"
 shinma_religion:0 "神魔"
 shinma_religion_adj:0 "神魔"
 shinma_religion_adherent:0 "神魔"
 shinma_religion_adherent_plural:0 "神魔"
 shinma_religion_desc:0 "东方妖精——神魔——的王廷，是根据意识形态和世界观建立的。"
 shinma_high_god_name:0 "盘古"
 shinma_high_god_name_possessive:0 "盘古的"
 shinma_high_god_name_alternate:0 "玉皇大帝"
 shinma_high_god_name_alternate_possessive:0 "玉皇大帝的"
 shinma_good_god_jesus:0 "麒麟"
 shinma_good_god_christ:0 "麒麟"
 shinma_devil_name:0 "魔皇"
 shinma_devil_name_possessive:0 "魔皇的"
 shinma_evil_god_lucifer:0 "魔皇"
