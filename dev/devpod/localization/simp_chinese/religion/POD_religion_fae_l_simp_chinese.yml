 empire_of_seeds:0 "种子帝国"
 empire_of_seeds_adj:0 "种子帝国"
 empire_of_seeds_adherent:0 "种子"
 empire_of_seeds_adherent_plural:0 "种子"
 empire_of_seeds_desc:0 "Court of the Kuberas, a Phyla of the Inanimae. The Dryad's nation is a sylvan grouping that shares lives and goods. In the Dreaming, the Nymphs' Homeland is a far-reaching forest in the center of the Homeland Realms. Politically, the Dryads support the Glomes but do have reservations about the treatment of the Solimond Homeland. As the Phyla most affected by the War of Making, they aren't too terribly sympathetic to the the cause of Solimond re-integration. The Spring Equinox festival is a great Faire hosted by the Kuberas. Inanimae musicians, artists, and craftsfae meet to show their wares and all celebrate the renewal of life and Winter's end. If the leaders of the empires need to make any joint announcements, this is the time and place. The Moot is a holiday where the Kuberas gather in a huge glade on highsummer somewhere in Russia. Here the Dryads are allowed to petition their emperor."
 empire_of_stones:0 "岩石帝国"
 empire_of_stones_adj:0 "岩石帝国"
 empire_of_stones_adherent:0 "岩石"
 empire_of_stones_adherent_plural:0 "岩石"
 empire_of_stones_desc:0 "Court of the Glomes, a Phyla of the Inanimae. The Empire of Stones is a strict hierarchy. Every Glome knows their place in the greater whole. At the same time, the empire is a meritocracy. Advancement is rapid for the ones who can advance the Empire's causes. The Dreaming Homeland of the Glomes is a gigantic citadel grown from a living mountain. It has been sieged three times and every time the invaders were pushed back and crushed. At the heart of the structure is one of the few veins of chimerical iron. Of all the empires the Glomes are the most polarized politically. They maintain a hard line that the Solimonds must be destroyed. Hosted by the Glomes, the Winter Solstice Festival is a great Tourney held in the Dreaming that is similar to the Olympics, if the Olympics were about martial prowess. Winners are showered with praise and, if Glomes, destined for rapid advancement."
 empire_of_flames:0 "火焰帝国"
 empire_of_flames_adj:0 "火焰帝国"
 empire_of_flames_adherent:0 "火焰"
 empire_of_flames_adherent_plural:0 "火焰"
 empire_of_flames_desc:0 "Court of the Solimond, a Phyla of the Inanimae. The Salamander nation has a complex imperial monarchy with levels of nobility and pageantry and ceremonies that rival anything the Sidhe have come up with. The fire spirits who first fell in love with meat were among the empire and driven by this ill-fated passion they spent ages watching humankind and learning the ways of their odd and awesome hearts the way only a lover could. Finally, unable to hide any longer, they revealed themselves and showed the meat the working of Flame with its powers of transformation and truth. In this they doomed the inanimate world to slavery at the hands of men and women and caused the War of Making, forcing the other Empires to turn against the treasonous flames and excommunicate them. Now, the other Slow Empires search to quench the Salamanders' Anchors of the Glade. The Dreaming Homeland of the Salamanders was once a bronze vista of palaces and estates with a horizon of flame lighting up the sky. The Summer Solstice is a stately and noble masque of great beauty as well as a 4-day University where the Solimonds would gather and share their knowledge."
 empire_of_tears:0 "泪水帝国"
 empire_of_tears_adj:0 "泪水帝国"
 empire_of_tears_adherent:0 "泪水"
 empire_of_tears_adherent_plural:0 "泪水"
 empire_of_tears_desc:0 "Court of the Ondines, a Phyla of the Inanimae. The Nereids run their empire as an Athenian-style Democracy. Any Nereid may cast a vote on any issue. The Dreaming Homeland of the Heart Collectors is a vast ocean extending over every horizon. 20 miles deep, within it is a gigantic city of coral buildings and highways. Any visitor who visits must be able to breath underwater. Many Pirate captains have secrets to navigate shortcuts here through the Dreaming as it is attached to every body of water on Earth and in the Dreaming. Politically the empire has no enemies and remains on friendly terms with all other Inanimae, though fire and water have never been on the best terms. The Autumnal Equinox is a holiday jointly hosted by the Ondines and Parosemes. All are invited to the underwater palaces of the Nereids with oxygen supplied by the Silfar. Feasting is great and gifts are given."
 empire_of_skies:0 "天空帝国"
 empire_of_skies_adj:0 "天空帝国"
 empire_of_skies_adherent:0 "西尔芙"
 empire_of_skiess_adherent_plural:0 "西尔芙"
 empire_of_skies_desc:0 "Court of the Parosemes, a Phyla of the Inanimae. The government of the Silfar can best be described as a cross between anarchy and tribalism. Once a year the 13 oldest active members meet and debate issues that effect all Sprites and then make long, ornate proclamations that are promptly ignored by everybody. Found in the Deep Dreaming, the Paroseme Homeland looks like an entire country made of clouds and glass. Phantasmal animals graze on cloud-like grass and whispy folk meander the delicate countryside by foot or flight. At the very center of the realm a tower of clouds, shaped like a unicorn's horn, reaches up, as solid as marble. At the top is where the council meets. Relations are good with the Empire of Tears with a steady trade of Rain for Evaporation. The Empire of Stones is considered too boring for anything more than cursory relations. They are on friendly terms with the Empire of Seeds. There are no plans to join the blockade of the Empire of Flames. No one has anything to say to the Empire of Dolls. The Autumn Equinox is a joint Festival for the Ondines and Parosemes. All are invited to the underwater palaces of the Nereids with oxygen supplied by the Silfar. Feasting is great and gifts are given."
 empire_of_dolls:0 "人偶帝国"
 empire_of_dolls_adj:0 "人偶帝国"
 empire_of_dolls_adherent:0 "人偶"
 empire_of_dolls_adherent_plural:0 "人偶"
 empire_of_dolls_desc:0 "Court of the Mannikins, a Phyla of the Inanimae. The Toys claim to have no empire or Homeland. They gather occasionally in quiet parts of the Dreaming to keep their councils private and will occasionally appear to give advice within the courts of the other empires. An emissary claiming to speak for the whole of the Mannikins wears a black robe and even the Marshall of the Glomes listens when the black-robe appears with news. The Mannikins have never invited anyone to their meeting place. In the politics of the empires, the Toys serve as catalysts for change. When their emissary appears, shifts in policy are close at hand. Many wonder what the secret of the black-robes is, but the other empires will never reveal what is said. The few times an emissary has addressed a whole empire, war has quickly followed. While the Mannikins have no yearly ritual, rumors persist of time stolen on New Year's Eve between 11:59 and Midnight. People whisper that in that minute all the Toys awaken and live out a whole day fully human then return to their Anchors and time rewinds to Midnight again. IF it were true, it would help explain how the Dolls know so much that remains hidden to the other empires. "