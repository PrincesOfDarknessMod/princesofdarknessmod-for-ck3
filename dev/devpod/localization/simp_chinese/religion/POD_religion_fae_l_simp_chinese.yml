 ojo_humanists: "奥祖人文派"
 ojo_humanists_adj: "奥祖人文派"
 ojo_humanists_adherent: "奥祖人文派"
 ojo_humanists_adherent_plural: "奥祖人文派"
 ojo_humanists_desc: "有些奥祖深深地将换生灵之道和与人类共同生活的理念融入了逸抒的方式，以至于他们推动了类似于四季王廷人文派的政治议程。"
 ojo_constantinians: "奥祖君士坦丁派"
 ojo_constantinians_adj: "奥祖君士坦丁派"
 ojo_constantinians_adherent: "奥祖君士坦丁派"
 ojo_constantinians_adherent_plural: "奥祖君士坦丁派"
 ojo_constantinians_desc: "犹太教、基督教和伊斯兰教在非洲广泛传播，取代了原始教信仰和习俗。一些奥祖试图将他们对光明和生命的信仰与人类教会的神学和实践相调和。以诺书在埃塞俄比亚被贝塔以色列犹太社区以及基督教埃塞俄比亚正统合性教会使用。书中包含了看守天使古利格利和他们的巨大的人类–天使后代拿非利的故事。妖精可能是被救赎的古利格利和拿非利。"
