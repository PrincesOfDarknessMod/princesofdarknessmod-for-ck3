 winter_court_religion: "@changeling_icon!冬之王廷"
 winter_court_religion_adj: "冬之王廷"
 winter_court_religion_adherent: "冬之一族"
 winter_court_religion_adherent_plural: "冬之一族"
 winter_court_religion_desc: "人类传说中的怪物，夜晚阴影中的生物——冬之一族活着就是为了在人类中激发恐惧。对于四季之战大多心存蔑视，该王廷已经失去了最终战胜其他派系的动力，现在几乎视它们为不值一提。冬妖精似乎无法与人类产生共情，他们既没有基础，也没有立足点去理解凡人及其生活。在这个王廷中，换生灵（和人文派）是罕见的存在。"
 winter_court: "冬之王廷"
 winter_court_adj: "冬之王廷"
 winter_court_adherent: "冬之一族"
 winter_court_adherent_plural: "冬之一族"
 winter_court_desc: "最残酷的妖精，冬之一族潜伏在桥下和黑暗的森林中。虽然他们是凶猛的战士，但他们大多不怀着任何热情期待誓约休战的结束。有组织的战争并不是他们所喜欢的，但对人类的掠食、夜间狩猎的刺激、鲜血和恐惧的滋味——这些都非常符合他们的口味。只有将世界陷入黑暗而野蛮的夜晚的想法才能激励他们参与四季之战。"
 winter_court_militants: "冬之尚武派"
 winter_court_militants_adj: "冬之尚武派"
 winter_court_militants_adherent: "尚武派冬妖精"
 winter_court_militants_adherent_plural: "尚武派冬妖精"
 winter_court_militants_desc: "许多妖精渴望结束誓约休战，以便重新投入到四季之战的战斗中。受染成为王廷一员所带来的强烈情感很强烈。冬之一族的战士们真正相信他们的生活方式才是真正的方式——强者掌权。妖精战争的重新开始并不会让他们冰冷的心灵感到恐惧，而是一个信号，表明决定世界命运的战斗终于可以开始了。\n\n冬天妖精是所有妖精中最残忍的，他们潜伏在桥下和黑暗的森林中。他们是以人类为猎物的凶猛战士，夜间狩猎的刺激、血液和恐惧的味道——这些都非常符合他们的口味。他们渴望四季之战，以便将世界陷入黑暗而野蛮的夜晚。"
 winter_court_trucebearers: "冬之休战派"
 winter_court_trucebearers_adj: "冬之休战派"
 winter_court_trucebearers_adherent: "休战派冬妖精"
 winter_court_trucebearers_adherent_plural: "休战派冬妖精"
 winter_court_trucebearers_desc: "随着誓约休战即将进入最后的时刻，冬妖精“休战派”们并不渴望以磨利的牙齿和爪子争斗。该王廷的大多数成员实际上对于四季之战颇感冷漠。在许多情况下，他们距离妖精政治太远，无法跟随最新的联盟和背叛的潮流；为了进一步限制他们的参与，他们通常并不关心谁只为了一些微不足道的地方条约在背刺谁。许多冬妖精都是现实主义者，他们清楚地认识到四季之战是一场无休止的考验。他们大多更关心如何保全自己和保护领地不受人类的影响。"
 winter_court_humanists: "冬之人文派"
 winter_court_humanists_adj: "冬之人文派"
 winter_court_humanists_adherent: "人文派冬妖精"
 winter_court_humanists_adherent_plural: "人文派冬妖精"
 winter_court_humanists_desc: "对于妖精来说，是被人类喜爱还是害怕更好呢？冬之王廷认为被畏惧要好得多。让人类憎恨吧，只要他们害怕就行。冬之王廷的人文派们像是一个孩子用放大镜虐待蚂蚁一样对待人类。他们对人类有着执着的迷恋，试图找出最佳的方式来恐吓人类，并通过这恐惧来提取梦华。"
 winter_court_constantinians: "冬之君士坦丁派"
 winter_court_constantinians_adj: "冬之君士坦丁派"
 winter_court_constantinians_adherent: "君士坦丁派冬妖精"
 winter_court_constantinians_adherent_plural: "君士坦丁派冬妖精"
 winter_court_constantinians_desc: "冬之王廷的君士坦丁派倾向于利用他们对教会的了解为自己谋利（并对人类不利）。他们对教会对异端和巫术的迫害表现出浓厚的兴趣，尤其是对酷刑和恐怖的技艺。阿尔比派十字军的暴力恐怖也引发了冬之一族的好奇心。甚至鞭笞者也引起了他们的兴趣。配剑基督和复仇天使的末日梦境可能会提供丰富的梦华可供利用。"
 spring_court_religion: "@changeling_icon!春之王廷"
 spring_court_religion_adj: "春之王廷"
 spring_court_religion_adherent: "春之一族"
 spring_court_religion_adherent_plural: "春之一族"
 spring_court_religion_desc: "春妖精拥抱一切形式的变化，观察生命在各种原因下的进展，并陶醉于它的无数变化，包括它可能终结的许多不同方式。他们在过去几个世纪中失去了许多最重要的财产，但在所有的王廷中，他们是最善于寻找新家园和适应新环境的。"
 spring_court: "春之王廷"
 spring_court_adj: "春之王廷"
 spring_court_adherent: "春之一族"
 spring_court_adherent_plural: "春之一族"
 spring_court_desc: "在这个既有信仰又充满不确定性的新时代，春之王廷追求理解并解决人类与妖精之间产生的伤痛。在四季之战中，他们是敏锐的战士，渴望一劳永逸地取得胜利；而在凡间，他们努力重新获得对人类的重要性，并再次被人们所敬畏和尊重。\n\n作为变革和悖论的王廷，春妖精努力将一切事物都改变为对他们有利的形式，以免人类要么忘记他们，要么永远驱逐妖精。如果出现这样的僵局，整个四季之战和其他努力都将成为徒劳的终结。"
 spring_court_militants: "春之尚武派"
 spring_court_militants_adj: "春之尚武派"
 spring_court_militants_adherent: "尚武派春妖精"
 spring_court_militants_adherent_plural: "尚武派春妖精"
 spring_court_militants_desc: "在四季之战中，春之一族的战士们是热衷的斗士，渴望一劳永逸地取得胜利；而在凡间中，他们希望重新获得对人类的重要性，再次被人们敬畏和尊重。作为变化和悖论的王廷，春妖精努力改变一切，以谋取自己的利益，以免人类要么忘记他们，要么永远放逐妖精。许多春之一族战士主张在与其他王廷进行敌对交战之间讨论人类国家的问题。春之王廷很以聚集在一起的士兵们为傲，虽然他们只是石之战时的壮丽军队的苍白倒影，但他们的技巧和奉献仍然令人敬畏。"
 spring_court_trucebearers: "春之休战派"
 spring_court_trucebearers_adj: "春之休战派"
 spring_court_trucebearers_adherent: "休战派春妖精"
 spring_court_trucebearers_adherent_plural: "休战派春妖精"
 spring_court_trucebearers_desc: "尽管春之王廷的很多成员对誓约休战的结束表示欢迎，将其视为一次伟大的变革，但春之一族的休战派却主张通过四季王廷之间轮流统治世界的妥协，将会比任何单一王廷，甚至是春之王廷独自统治更加具有变革性。"
 spring_court_humanists: "春之人文派"
 spring_court_humanists_adj: "春之人文派"
 spring_court_humanists_adherent: "人文派春妖精"
 spring_court_humanists_adherent_plural: "人文派春妖精"
 spring_court_humanists_desc: "春之王廷的大多数人都追随人文派议程。春之一族通常被认为是对人类最具保护意识的，尽管这并不一定是出于无私奉献。春妖精意识到他们必须加强两个种族之间的互利关系，以免妖精永远从凡人的记忆中消失。因此，他们的誓言通常涉及帮助或保护人类，尽管这样沉重的誓言同样需要誓约者做出同等重要的承诺。"
 spring_court_constantinians: "春之君士坦丁派"
 spring_court_constantinians_adj: "春之君士坦丁派"
 spring_court_constantinians_adherent: "君士坦丁派春妖精"
 spring_court_constantinians_adherent_plural: "君士坦丁派春妖精"
 spring_court_constantinians_desc: "春之王廷拥有最大一部分寻求了解教会以改善和平衡两个世界的妖精。他们迅速地研究和了解诸如巨大的主教座堂、神圣的祈祷和十字军等事物的奇妙之处。一神教会的崛起无疑是发生在人类身上最大的变革，而春之一族的君士坦丁派希望成为教会将带来的下一次变革的一部分。"
 summer_court_religion: "@changeling_icon!夏之王廷"
 summer_court_religion_adj: "夏之王廷"
 summer_court_religion_adherent: "夏之一族"
 summer_court_religion_adherent_plural: "夏之一族"
 summer_court_religion_desc: "夏之王廷以遵守传统和结构、严格遵守纪律而自豪。夏妖精是严厉但公正的主人，他们对传统的热爱意味着他们保留了许多来自过去时代的珍宝和要塞。"
 summer_court: "夏之王廷"
 summer_court_adj: "夏之王廷"
 summer_court_adherent: "夏之一族"
 summer_court_adherent_plural: "夏之一族"
 summer_court_desc: "夏之王廷承载着妖精的传统身份，其成员是妖精一族逐渐消逝的力量的活生生的反映。这个王廷的核心是不变的停滞的字面意义上的具体化；在传统和历史的支柱中，夏妖精找到了独特的力量。尊贵的夏妖精意识到了凡间的变化，但他们有意选择抵抗这些变化。人类已经忘记了古老的传统。夏妖精没有忘记。对于这些传统主义者来说，现在是时候提醒凡人们再次了解事物的方式——恢复所有已逝的联系，提醒他们所有失落的习俗，并将那些冒起者恢复到他们在世界中应有的位置。对于夏妖精来说，对法律的无知不是借口。人类可能已经忘记了许多誓言，但这并不意味着惩罚应该相应减轻。"
 summer_court_militants: "夏之尚武派"
 summer_court_militants_adj: "夏之尚武派"
 summer_court_militants_adherent: "尚武派夏妖精"
 summer_court_militants_adherent_plural: "尚武派夏妖精"
 summer_court_militants_desc: "随着誓约休战进入最后的日子，夏之王廷的妖精们正在以欢欣鼓舞的心情和锋利的刀刃准备重新投入战斗。四季之战是他们期望的战斗，他们一直相信自己将成为最终的胜利者。\n\n大多数夏之领地都有传统而极具炫耀性的军事相关展览。无论是悬挂在宫殿大厅的梁柱上的战旗，还是地下通道中充满的古老战歌的管乐、长笛和竖琴乐谱，许多夏妖精珍视战争工具，并热情支持尚武派议程。王廷对守护者怀有强烈的仇恨，这是可以理解的，考虑到夏之妖精坚定的确信他们将在四季之战中获胜。"
 summer_court_trucebearers: "夏之休战派"
 summer_court_trucebearers_adj: "夏之休战派"
 summer_court_trucebearers_adherent: "休战派夏妖精"
 summer_court_trucebearers_adherent_plural: "休战派夏妖精"
 summer_court_trucebearers_desc: "在夏之王廷，很少听说过有休战派，而那些追求这一议程的人通常只是出于一个目的，那就是让自己的领地有更多时间为即将重新开始的战斗做准备。在过去的800年里，自从石之战以来（尤其是在100年的誓约休战期间），其他夏之一族与敌对王廷的成员建立了密切的联盟和友谊，他们并不急于与这些新伙伴血战沙场。最后，一些妖精并不在乎王廷是否重返战争；他们只是不愿意自己加入冲突。甚至有一些夏之一族主张回归[UmbraGlossary('arcadia')]。"
 summer_court_humanists: "夏之人文派"
 summer_court_humanists_adj: "夏之人文派"
 summer_court_humanists_adherent: "人文派夏妖精"
 summer_court_humanists_adherent_plural: "人文派夏妖精"
 summer_court_humanists_desc: "夏之一族希望人类“安分守己”，并将受迷诱的人类视为仆人。他们希望加强古老的关系，让人类将夏妖精视为令人敬畏的传说生物，能够给凡人带来喜悦或恐惧的存在。"
 summer_court_constantinians: "夏之君士坦丁派"
 summer_court_constantinians_adj: "夏之君士坦丁派"
 summer_court_constantinians_adherent: "君士坦丁派夏妖精"
 summer_court_constantinians_adherent_plural: "君士坦丁派夏妖精"
 summer_court_constantinians_desc: "一些夏之一族在教会的仪式修习和阶级制度的重要性中看到了自己信念的倒影。基督教已经存活并繁荣了一个多世纪，作为一个机构，它已经足够长时间获得了夏之王廷的某些勉强尊重。对于许多夏的换生灵来说，教会似乎像真妖精一样永恒而不可动摇。夏之王廷的君士坦丁派寻求引出基督教的古老传统，从被描绘成日出的耶稣复活到君士坦丁对无敌者索尔的痴迷。要有光！"
 autumn_court_religion: "@changeling_icon!秋之王廷"
 autumn_court_religion_adj: "秋之王廷"
 autumn_court_religion_adherent: "秋之一族"
 autumn_court_religion_adherent_plural: "秋之一族"
 autumn_court_religion_desc: "秋之一族对人类的着迷超过了大多数仙族，他们思考深沉，机智敏锐。与秋妖精达成誓言就像与魔鬼达成交易一样，诱人、赋予力量，并且最后的结算往往是致命的。秋妖精以惊奇和雄心看待人类及其信仰，他们中的每一个妖精都知道，四季之战的下一个阶段完全取决于如何处理人类。"
 autumn_court: "秋之王廷"
 autumn_court_adj: "秋之王廷"
 autumn_court_adherent: "秋之一族"
 autumn_court_adherent_plural: "秋之一族"
 autumn_court_desc: "秋之王廷的妖精试图将他们真正的自我隐藏起来，作为神秘的施主的幕后主导和操纵人类。秋妖精意识到凡人正逐渐用向遥远的上帝祈祷来取代妖精在他们生活中的存在。\n\n许多妖精努力理解人类的新立场，并将自己恢复为半隐秘的霸主，而其他人则试图利用人类和旧誓言作为四季之战中的武器。凡人，尽管他们软弱而弱小，但因为束缚他们的誓言而变得有用，既可以作为抵御板讷的盾牌，又可以作为即将到来的冲突中的盟友。"
 autumn_court_militants: "秋之尚武派"
 autumn_court_militants_adj: "秋之尚武派"
 autumn_court_militants_adherent: "尚武派秋妖精"
 autumn_court_militants_adherent_plural: "尚武派秋妖精"
 autumn_court_militants_desc: "尚武派在每个王廷中都有，尽管秋之王廷中渴望战斗的人数最少。一小部分秋妖精渴望誓约休战结束，以便他们可以重新参与四季之战的战斗。\n\n秋之一族的尚武派编织阴谋，操纵妖精和凡人，让他们成为战争中的棋子。他们试图利用人类和古老誓言作为四季之战的武器。尽管凡人有着种种软肋和弱点，但只要有束缚他们的誓言，他们就能是有用的——既可以作为对抗板讷的盾牌，也可以成为即将到来的冲突中的盟友。四季之战始于暗杀、小规模伏击、受骗人类和妖精的误会攻击、背叛、至日雇佣兵和偷袭——秋妖精相信通过这些手段也能赢得战争。从阴影中发动袭击！"
 autumn_court_trucebearers: "秋之休战派"
 autumn_court_trucebearers_adj: "秋之休战派"
 autumn_court_trucebearers_adherent: "休战派秋妖精"
 autumn_court_trucebearers_adherent_plural: "休战派秋妖精"
 autumn_court_trucebearers_desc: "秋妖精已经睁开了眼，放下了剑，因为某些事情出了非常、非常大的错。四季之战是一个愚蠢的赌博，几乎不可能获胜，而且对胜利者来说是毁灭性的，因为最终取得胜利的王廷将在战争中变得如此衰弱，以至于任何胜利都变得毫无意义。秋之王廷的妖精们将他们的注意力转向世界，意识到这个世界不再属于他们。秋妖精意识到冲突之后才是真正重要的。人类拥有乐来自他们所创造的神圣观察者的魔法，这让许多妖精怀疑上帝是否真的是人类的发明。自从公开宣布妖精统治的时代以来，世界的面貌已经发生了太大的改变，不能简单地向人类显露自己并期待恐惧、崇拜和尊重。现在，如果妖精们希望实现他们的目标，就必须采用不同的方法。四季之战可以等。现在是时候审视世界"
 autumn_court_humanists: "秋之人文派"
 autumn_court_humanists_adj: "秋之人文派"
 autumn_court_humanists_adherent: "人文派秋妖精"
 autumn_court_humanists_adherent_plural: "人文派秋妖精"
 autumn_court_humanists_desc: "尽管大多数妖精或多或少都持有人文派观点，但此派别的成员主要集中在秋之王廷。秋之王廷的妖精善于洞察全局，并以此为目标努力工作。相较于其他妖精，秋之一族更加着迷于人类，他们思考深沉而机智灵活。与秋妖精立下誓言就如同与魔鬼达成交易，具有诱人的力量，但最终往往是致命的结局。秋妖精以惊叹和野心审视人类及其信仰，而他们是所有妖精中最了解四季之战的下一阶段完全取决于如何应对人类。秋之王廷的妖精试图隐藏自己的真实面目，作为神秘施主幕后主导和操控人类。"
 autumn_court_constantinians: "秋之君士坦丁派"
 autumn_court_constantinians_adj: "秋之君士坦丁派"
 autumn_court_constantinians_adherent: "君士坦丁派秋妖精"
 autumn_court_constantinians_adherent_plural: "君士坦丁派秋妖精"
 autumn_court_constantinians_desc: "秋之王廷充斥着君士坦丁派的成员，他们与特定的凡人进行初步接触，以理解人类信仰的复杂性和力量。相比其他王廷，受洗的力量对于秋妖精来说更加可怕，既因为该王廷主要由换生灵组成，又因为他们对人类信仰的复杂性了解最多。受洗本身被一致地视为恐怖的，因为这个仪式可以立即抵消赋名并使妖精失去神秘力量，被视为比死亡更糟糕的命运。\n\n秋之一族是务实的。他们并不将教会视为需要对抗和阻止的敌人，而是将其视为一个需要揭示、开放和研究的谜团。一旦理解了凡人信仰的力量，或许迷雾也会恢复到更加仁慈的平衡状态。"
 solstice_court_religion: "@changeling_icon!至日王廷"
 solstice_court_religion_adj: "至日王廷"
 solstice_court_religion_adherent: "至日一族"
 solstice_court_religion_adherent_plural: "至日一族"
 solstice_court_religion_desc: "无王廷无组织，不受染者是四季之战中的中立派系。虽然大多数人被忽视、被漠视，甚至被鄙视，但至日妖精也可以成为有着非凡才能和实用性的雇佣兵和外交家，因为他们在整个斗争中保持中立立场。至日妖精对誓盟来说可能是巨大的福音，也可能是巨大的负担，这取决于当地妖精及其观点，以及至日一族的个人技能。他们中的许多人完全忽视妖精社会，生活在领地的边缘，而其他人则作为雇佣兵和传令兵为高高在上的王廷服务，谋生。"
 solstice_court: "至日王廷"
 solstice_court_adj: "至日王廷"
 solstice_court_adherent: "至日一族"
 solstice_court_adherent_plural: "至日一族"
 solstice_court_desc: "无王廷无组织，不受染者是四季之战中的中立派系。虽然大多数人被忽视、被漠视，甚至被鄙视，但至日妖精也可以成为有着非凡才能和实用性的雇佣兵和外交家，因为他们在整个斗争中保持中立立场。至日妖精对誓盟来说可能是巨大的福音，也可能是巨大的负担，这取决于当地妖精及其观点，以及至日一族的个人技能。他们中的许多人完全忽视妖精社会，生活在领地的边缘，而其他人则作为雇佣兵和传令兵为高高在上的王廷服务，谋生。"
 solstice_court_militants: "至日王廷尚武派"
 solstice_court_militants_adj: "至日王廷尚武派"
 solstice_court_militants_adherent: "尚武派至日妖精"
 solstice_court_militants_adherent_plural: "尚武派至日妖精"
 solstice_court_militants_desc: "在四季之战中，尽管他们被认为有缺陷，至日雇佣兵任然是首选的雇佣对象。相较于任何受染的妖精，雇佣至日妖精更为安全，因为无王庭者没有预先确定或宣誓效忠的义务。尽管大多数人被忽视、被忽略或被蔑视，至日妖精也可以成为有非凡才能和实用性的雇佣兵，因为他们在整个冲突中保持中立。作为士兵，至日妖精处于他们的主场之中。\n\n许多至日妖精通过多年的勤奋、努力和冲突赢得了可靠性的声誉。许多至日一族都视自己为精英中的精英——他们是真血妖精，超越了受王廷束缚的妖精必须忍受的限制。正是这些妖精渴望誓约休战最终结束，以便他们可以再次接受军事契约。这些往往是最受欢迎和最敏锐的至日一族。"
 solstice_court_trucebearers: "至日王廷休战派"
 solstice_court_trucebearers_adj: "至日王廷休战派"
 solstice_court_trucebearers_adherent: "休战派至日妖精"
 solstice_court_trucebearers_adherent_plural: "休战派至日妖精"
 solstice_court_trucebearers_desc: "尽管大多数被忽视、被忽略或被蔑视，至日妖精也能成为具备非凡技巧和实用性的外交家，这是因为他们在整个冲突中保持中立的立场。作为外交家、传令官、间谍和大使，至日妖精处于他们的主场之中。无王廷者休战派是孤立的个人或小团体妖精，他们热衷于在社交领域努力，以影响当地的王廷走向和平。毫不奇怪，他们很少成功，但这只会激发他们内心的热情。无论代价如何，和平是他们的使命。"
 solstice_court_humanists: "至日王廷人文派"
 solstice_court_humanists_adj: "至日王廷人文派"
 solstice_court_humanists_adherent: "人文派至日妖精"
 solstice_court_humanists_adherent_plural: "人文派至日妖精"
 solstice_court_humanists_desc: "很少有至日妖精冒险与人类进行长时间的接触，因为他们无法与凡人缔结魔法誓约。只有极少数无王庭者就像飞蛾扑火一般被人类吸引，追随人文派议程。人文派并不一定主张对待人类的善良和宽容，而是更关注理解人类的伦理观。"
 solstice_court_constantinians: "至日君士坦丁派"
 solstice_court_constantinians_adj: "至日君士坦丁派"
 solstice_court_constantinians_adherent: "君士坦丁派至日妖精"
 solstice_court_constantinians_adherent_plural: "君士坦丁派至日妖精"
 solstice_court_constantinians_desc: "拒绝了四季之战和四季王廷价值观的至日王廷的妖精，可能是最愿意放弃妖精的理想以寻求皈依教会的。如果有一种方式能让他们在受洗时保持妖精本质，同时也获得真信的力量，那该多好啊。"
 holy_order_winters_teeth: "冬之牙"
 holy_order_green_blades: "青之刃"
 holy_order_sun_guard: "太阳守卫"
 holy_order_crunch_of_leaves: "叶之脆响"
 holy_order_sunset_mercenaries: "日落佣兵"
 empire_of_seeds: "种子帝国"
 empire_of_seeds_adj: "种子帝国"
 empire_of_seeds_adherent: "种子"
 empire_of_seeds_adherent_plural: "种子"
 empire_of_seeds_desc: "库贝拉——元素妖门属之一——的王廷。树精的国度是一个共享生命和物资的林中团体。宁芙的母界是树精位于[UmbraGlossary('dreaming')]诸界中心的广袤森林。在政治上，树精支持格洛姆，但对索利蒙德母界的待遇有所保留。作为受到造化之战影响最大的类群，他们对索利蒙德的再融入的事业并不十分同情。春分节是由库贝拉主办的盛大集市。元素妖的音乐家、艺术家和工匠汇聚一堂，展示他们的商品，共同庆祝生命的新陈代谢和冬天的结束。如果帝国领导人需要进行联合公告，这就是恰当的时间和地点。月会是一个假期，库贝拉在俄罗斯某处的高夏季节的一个巨大林地中聚集。在这里，树精被允许向他们的皇帝提出请愿。"
 empire_of_stones: "岩石帝国"
 empire_of_stones_adj: "岩石帝国"
 empire_of_stones_adherent: "岩石"
 empire_of_stones_adherent_plural: "岩石"
 empire_of_stones_desc: "格罗姆——元素妖门属之一——的王廷。岩石帝国是一个严格的阶级社会。每个格罗姆都知道自己在整体中的位置。同时，帝国也是一个任人唯贤的组织。对于那些能够推动帝国事业的人的晋升总是很快。格罗姆的[UmbraGlossary('dreaming')]母界是一座由活山生长而成的巨大城堡。它曾被围攻过三次，每次入侵都被击退和粉碎。在这个结构的核心是数条奇魅铁脉中的一条。在所有的帝国中，格罗姆在政治上的立场是最极端的。他们坚持认为索利蒙德必须被摧毁。由格罗姆主办的冬至节是在[UmbraGlossary('dreaming')]中举行的一场盛大比武，类似于奥运会，只不过重点是武艺。获胜者将被赞扬，并且如果是格罗姆，注定会迅速晋升。"
 empire_of_flames: "火焰帝国"
 empire_of_flames_adj: "火焰帝国"
 empire_of_flames_adherent: "火焰"
 empire_of_flames_adherent_plural: "火焰"
 empire_of_flames_desc: "索利蒙德——元素妖门属之一——王廷。沙罗曼达的国度拥有复杂的帝国君主制度，具有贵族等级制度、盛大仪式和礼仪，可以与仙族创造的任何事物相媲美。诸帝国中最初爱上肉人的是火灵们，受这种不幸的激情驱使，他们花费了无数岁月观察人类，并以爱人的眼光学习他们奇特而令人敬畏的思想。最终，他们再也无法隐藏，展示了自己的身份，并向人们展示了火焰的运作方式，以及它具备的变幻和真理的力量。因此，他们注定使元素妖世界沦为男人和女人手中的奴隶，并引发了造化之战，迫使其他帝国对这些叛逆的火焰进行了斗争，并将其排斥出去。现在，其他缓慢的帝国正在寻找扑灭沙罗曼达的根基。沙罗曼达的[UmbraGlossary('dreaming')]母界曾经是一个铜色的宫殿和庄园的景观，天空上燃起了一片火焰的地平线。夏至节是一个庄重而高贵、美丽非凡的假面舞会，同时也是一个为期四天的大学，索利蒙德会在那里聚集并分享他们的知识。"
 empire_of_tears: "泪水帝国"
 empire_of_tears_adj: "泪水帝国"
 empire_of_tears_adherent: "泪水"
 empire_of_tears_adherent_plural: "泪水"
 empire_of_tears_desc: "温蒂妮——元素妖门属之一——的王廷。涅瑞伊得斯以雅典式的民主方式管理他们的帝国。任何涅瑞伊得斯都可以就任何问题投票。心灵收集者的[UmbraGlossary('dreaming')]母界是一个无边无际的海洋，延伸到每一个地平线。二十英里深处，是一个有着巨大的珊瑚建筑和高速公路的城市。任何来访者必须能够在水下呼吸。许多海盗船长知道如何通过[UmbraGlossary('dreaming')]中的捷径来导航，因为它与地球上的每一个水域和[UmbraGlossary('dreaming')]都有联通。在政治上，这个帝国没有敌人，并与所有其他元素妖保持友好关系，尽管火和水从来有过极好的关系。秋分节是温蒂妮和帕罗塞米共同举办的节日。所有人都受邀来到涅瑞伊得斯的水下宫殿，氧气由天妖精供应。盛宴十分丰盛，经常赠送礼物。"
 empire_of_skies: "天空帝国"
 empire_of_skies_adj: "天空帝国"
 empire_of_skies_adherent: "西尔芙"
 empire_of_skies_adherent_plural: "西尔芙"
 empire_of_skies_desc: "帕罗塞米——元素妖门属之一——的王廷。天妖精的政府一般被认为为无政府主义和部落主义的结合。每年一次，最年长的13名活跃成员聚集在一起讨论影响所有小精灵的问题，然后发表冗长而华丽的宣言，但很快就会被所有人忽视。在[UmbraGlossary('deep_dreaming')]中的帕罗塞米母界看起来像是由云和玻璃构成的国度。幻兽在云状的草地上吃草，轻盈的人们徒步或飞行在精致的乡村漫步。在领域的中心，一座云状的塔，形状像独角兽的角，直插云霄，坚如大理石。顶部是议会会议的地方。他们与泪水帝国保持良好关系，进行稳定的雨水蒸发贸易。对于岩石帝国来说，他们被认为太无聊了，只保持了肤浅的关系。他们与种子帝国保持友好关系。他们没有计划参加封锁火焰帝国的行动。没有人对人偶帝国有任何话要说。秋分节是温蒂妮和帕罗塞米共同举办的节日。所有人都受邀来到涅瑞伊得斯的水下宫殿，氧气由天妖精供应。盛宴十分丰盛，经常赠送礼物。"
 empire_of_dolls: "人偶帝国"
 empire_of_dolls_adj: "人偶帝国"
 empire_of_dolls_adherent: "人偶"
 empire_of_dolls_adherent_plural: "人偶"
 empire_of_dolls_desc: "马内坎——元素妖门属之一——的王廷。玩偶声称没有帝国或母界。他们偶尔聚集在[UmbraGlossary('dreaming')]的宁静之地，保持他们的私密会议，并偶尔出现在其他帝国的宫廷上提供建议。一位自称代表整个马内坎的使者身穿黑袍，即使是格洛姆的元帅也会倾听黑袍带来的消息。马内坎从未邀请任何人来到他们的会议地点。在诸帝国的政治中，马内坎作为变革的催化剂。当他们的使者出现时，政策的转变近在眼前。许多人想知道黑袍的秘密是什么，但其他帝国永远不会透露其中的内容。在为数不多的几次使者对整个帝国演说发生时，战争都很快就会紧随其后。虽然马内坎没有每年的仪式，但有传言称，除夕夜的11点59分到午夜之间的时间被他们窃取了。人们窃窃私语，在那一分钟里，所有的玩偶都会醒来，过上一整天完全像人类一样的生活，然后回到他们的锚点，时间又回溯到午夜。如果这是真的，那将有助于解释为什么人偶对其他帝国所隐藏的许多事情了如指掌。"
 eshu_religion: "@changeling_icon!逸抒"
 eshu_religion_desc: "逸抒有着与仙族王廷不同的行为准则。那些遵循荣誉和传统之道的妖精更喜欢奥祖，也被称为白昼。而那些追随摒弃旧观念、沉溺于激情之哲学的人，则自称为艾库，也就是死亡。但并不意味着所有的奥祖都善良慷慨，或者所有（甚至大多数）的艾库都是凶残的狂欢者。两个群体都追随乌呼鲁原则。被一个不肯妥协的奥祖法官抓住，和被一个怀恨在心的艾库抓住一样可怕。逸抒对这些哲学观念并不带有贬低，除非在极端情况下，因为他们中的每个妖精都将自己视为独立个体。若以选择的“王廷”来评判一位逸抒，你将自行承担风险。"
 ojo_religion: "@changeling_icon!奥祖"
 ojo_religion_desc: "在逸抒的通俗语言中，奥祖意为白昼和生命。"
 ojo: "奥祖"
 ojo_adj: "奥祖"
 ojo_adherent: "奥祖"
 ojo_adherent_plural: "奥祖"
 ojo_desc: "在逸抒的通俗语言中，奥祖意味着白昼和生命。实际上，你遇到的大多数逸抒都是奥祖。这是自然而然的，大多数埃莱巴拉从与之相关的千年传统和历史中汲取力量。然而，他们并不遵循喜乐廷准则（他们的存在早于喜乐廷）。他们有自己的标准来评判自己，尽管他们仍然遵守通常不冲突的喜乐廷准则。逸抒只是有着不同的核心价值观。\n听从命运的召唤——所有的奥祖都相信众神注定了一切发生的事情。\n传承所听闻之事——如果一个人不记得历史，我们就会重蹈覆辙。一个被遗忘的故事对所有妖精都是一次打击。\n为受忽视者寻求正义——逸抒与其他被边缘化的人民有一种亲近感，并尽力提供帮助。"
 iku_religion: "@changeling_icon!艾库"
 iku: "艾库"
 iku_adj: "艾库"
 iku_adherent: "艾库"
 iku_adherent_plural: "艾库"
 iku_desc: "在逸抒的通俗语言中，艾库意味着死亡和黑暗。艾库对待事物的方式与奥祖有些不同。逸抒可能会说他们同样对待奥祖和艾库，但艾库知道这不是真的。他们知道奥祖把他们当作一个笑话，一个恶毒而痛苦的笑话，一旦被知道了，就会在心中排名下降数个档次的笑话。许多人认为，因为他们不向命运低头，所以他们不是真正的埃莱巴拉，但他们也有自己的准则。虽然不完全像不哀怒廷那样，但他们也能相互融合。\n没有命运——这意味着什么？他们真正、究极地自由！\n留下麻烦的痕迹——混乱能将人们从安逸中唤醒。让那些掌握权力的人害怕你和你所知道的事情。\n复仇是神圣的——他们首先保护自己，并确保任何惹他们生气的人最终会失去一些东西，无论是自尊心、财物还是身体的一部分。"
 mu_religion: "@changeling_icon!魔宫"
 mu_religion_desc: "魔宫是一群在[Glossary('第四纪元','game_concept_fourth_age_desc')]自愿向[Glossary('阎魔王','podgloss.yamaking')]投降的妖仙，因为他们看到了自己违背天命所带来的困境，而无法找到解决办法。这两个王廷并不相互结盟，但与其他妖仙王廷都存在分歧。"
 daityas: "底提耶"
 daityas_adj: "底提耶"
 daityas_adherent: "底提耶"
 daityas_adherent_plural: "底提耶"
 daityas_desc: "底提耶是一个在[Glossary('第四纪元','game_concept_fourth_age_desc')]与[Glossary('阎魔王','podgloss.yamaking')]结盟的妖仙王廷，但后来背离了他们。在他们宣誓效忠[Glossary('阎魔王','podgloss.yamaking')]后不久，底提耶社团意识到恶魔只想腐化他们，并吸食他们的生命能量，因此他们离开了这个联盟。通过他们自己黑暗术法，他们也找到了如何维持实体并避免像其他妖仙一样陷入虚无的方法。\n底提耶致力于推动[Glossary('第六纪元','game_concept_sixth_age_desc')]的到来；在这个时代，玉皇大帝将被迫离开他的天庭，龙和凤将在一场血腥的大战中相互对抗。通过推动信仰流失，他们试图削弱[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]所建立的绝壁，从而在天庭中占据他们应有的位置。\n尽管在其他妖仙眼中他们踏入了歧途，但他们并非无法救赎。如果他们愿意，他们可以回到正确的道路上，并帮助妖仙避免哀伤纪元。"
 kura_sau: "暗相"
 kura_sau_adj: "暗相"
 kura_sau_adherent: "暗相"
 kura_sau_adherent_plural: "暗相"
 kura_sau_desc: "暗相是一群堕落的妖仙社团。也被称为垢伥，是那些将自愿向[Glossary('阎魔王','podgloss.yamaking')]投降的妖仙，被视为魔宫的一部分。因此，他们能够前往[UmbraGlossary('yomi_wan')]而不受玉皇大帝的诅咒。此外，他们还有自己的五丹分支，被称为魔道，这是一种邪恶的术艺，使他们能够将无量地狱的腐化之气带入世界。\n他们努力履行他们黑暗主人的议程，引发[Glossary('Sixth Age','game_concept_sixth_age_desc')]，并腐化大部分中原。他们大多是原始妖仙的黑暗倒影，有些甚至会回应祈祷，前提是必须涉及血祭和用于满足邪念。有人声称暗相甚至负责腐化了一些龙和凤，以权力的诱惑引诱它们，而这种权力只有[Glossary('阎魔王','podgloss.yamaking')]才能赐予。"
 shu_shen: "渎神"
 shu_shen_adj: "渎神"
 shu_shen_adherent: "渎神"
 shu_shen_adherent_plural: "渎神"
 shu_shen_desc: "渎神是神魔社会的放荡不羁者。亵神蔑视平衡的概念，追求极端的肉欲和暴力。他们抢劫、掠夺、谋杀，到处败坏仁慈的妖仙的名声。他们是更强大的鬼神（包括[GetTrait('kueijin').GetName( GetNullCharacter )]甚至该隐人）的雇佣兵和护卫，只要他们能付得起价格。他们可能会与吸血鬼甚至[Glossary('阎魔王','podgloss.yamaking')]的仆人结盟。"
 li_shen: "礼神"
 li_shen_adj: "礼神"
 li_shen_adherent: "礼神"
 li_shen_adherent_plural: "礼神"
 li_shen_desc: "被称为传统派、典礼之神或者简称为府，礼神拥抱儒家价值观。他们相信[Glossary('道德仙道','game_concept_tao_te_hsien_desc')]，但强调自然的有序性和维护它，而非个体的开悟。保护自然对他们来说是首要任务，他们的成员几乎全部是神居。曾是最强大的王廷之一，礼神已经与其他神明失去了联系，往往看不起他们。由于这种偏见，以及诸部之间的内斗，府的工作已经不如他们本应该的那样出色。"
 tu_shen: "途神"
 tu_shen_adj: "途神"
 tu_shen_adherent: "途神"
 tu_shen_adherent_plural: "途神"
 tu_shen_desc: "虽然被大多数其他神魔视为放纵者，和谐之神或者天庭使者与默仙有着相同的目标……只是达成方式截然不同。他们试图通过说服每个人过得愉快来实现欢欣纪元。他们的目标是欢喜、欢腾，而不仅仅是生理上的狂喜。他们明白，与家人和朋友共进美食的快乐比一把药丸更加令人满足和持久。和谐之神通过行善事来实践他们的信仰，努力让不同的鬼神王廷合作，或者至少进行对话。他们言行一致，有时也会参加派对。\n和谐之神受到礼神的不屑一顾，与禹的关系也紧张。至少其他人都喜欢他们的陪伴。途神声称与所有群体关系良好。"
 xian_mo: "默仙"
 xian_mo_adj: "默仙"
 xian_mo_adherent: "默仙"
 xian_mo_adherent_plural: "默仙"
 xian_mo_desc: "被称为宁静者或仙灵，默仙是神秘主义者，也是对[Glossary('道德仙道','game_concept_tao_te_hsien_desc')]的坚定求道者。他们相信开悟的个体能够创造一个完美的世界，扭转时代的变迁。这种个体的强调使他们抵抗秩序，甚至拒绝将自等视为一王廷。默仙是其他妖仙给予他们的名字。\n然而，宁静者给了神魔希望，而大多数神魔在[Glossary('第四纪元','game_concept_fourth_age_desc')]末期，当绝壁将他们隔绝于[spirit_world|E]之时，已经放弃了希望。哈奴曼将[Glossary('道德仙道','game_concept_tao_te_hsien_desc')]带给了地府的一位土壻。这些土壻辞去了职位，隐居于山中。最终，他们的教诲演变成了现在被称为[Glossary('道德仙道','game_concept_tao_te_hsien_desc')]的文献，或者叫做“妖仙秘力之道”。热诚的追随者如今组成了默仙，他们的教诲使一些人越过了绝壁。"
 xian_mun: "仙门"
 xian_mun_adj: "仙门"
 xian_mun_adherent: "仙门"
 xian_mun_adherent_plural: "仙门"
 xian_mun_desc: "仙门，又被称为仙会或尘世之徒，是那些要么抵制自身真实本性，要么更关注凡人生活的神魔。有些人甚至利用他们的力量来推动其他议程。最优秀的尘世之徒认为在传统仙魔社会之外也能追随[Glossary('道德仙道','game_concept_tao_te_hsien_desc')]；而最糟糕的则对此毫不在乎。\n仙会将其他王廷成员视为愚昧的傻瓜。个体只是象征性地向当地的诸部和禹的强人示好（可能还附带一些金钱和玉石），只是为了能够被放任自由。他们倾向于按照各种不同的模式组织自己，可以是家族、公司或其他人类机构。"
 yellow_lotus: "黄莲"
 yellow_lotus_adj: "黄莲"
 yellow_lotus_adherent: "黄莲"
 yellow_lotus_adherent_plural: "黄莲"
 yellow_lotus_desc: "黄莲是妖仙社会中一个微妙而隐秘的组织。他们散布在其他妖仙之中，他们的目标看似矛盾。实际上，没有人了解他们真正的议程，甚至不知道他们的成员是谁。他们唯一明显的目标是在神魔阶层中挑起叛乱。他们翻出古老的敌对关系和被遗忘的冤屈，以此来破坏礼神诸部的秩序。然而，他们还声称承担惩罚那些过于明目张胆展示其灵形的人的责任，有时充当秘密警察的身份。他们的工作范围涵盖了传播谣言到刺杀。他们到底想要什么？也许他们只是喜欢为了混乱而煽动事端。"
 yu: "禹"
 yu_adj: "禹"
 yu_adherent: "禹"
 yu_adherent_plural: "禹"
 yu_desc: "禹，又称经学家或十圣人，以中国史前的十大帝王为榜样（他们甚至可能就是其中的一些）。他们将中原划分为十大神州，但他们的战斗导致边界经常变动。禹一般支持府及其诸部，只要他们能相互配合，利用他们的才能。禹囤积玉石已有数百年之久，至今仍拥有一些最强大的玉器。他们还控制着许多龙穴。\n但并非所有的禹都是贵胄。有些只是强大的军阀和罪犯，他们控制着强大的堂口和三合会。这些神魔与其他在中原不那么合法的商业交易中拥有利益的鬼神（如[GetTrait('kueijin').GetName( GetNullCharacter )]、血族和其他超自然）争锋相对。其他王廷都无法承受与禹关系恶化的后果，因此他们也对其他大多数王廷敬而远之。魔宫和[GetTrait('kueijin').GetName( GetNullCharacter )]是他们最大的敌人。"
 wu_hsien: "妖仙屋室"
 wu_hsien_adj: "妖仙屋室"
 wu_hsien_adherent: "妖仙屋室"
 wu_hsien_adherent_plural: "妖仙屋室"
 wu_hsien_desc: "妖仙屋室，又称仙民或妖仙之族，是一个综合性社会群体。它是对大多数生活在小村庄并与土地和当地神社有着紧密联系的神魔的称呼。他们可能有紧密的组织，但仅限于地方范围。他们可能会封闭自己，只关心当地的人民和环境。\n在仙民中，毫无疑问比起神居更多的是土居。这些妖仙常被视为礼神和禹的家臣，但他们真正的忠诚只属于村庄、神社和当地美景。"
