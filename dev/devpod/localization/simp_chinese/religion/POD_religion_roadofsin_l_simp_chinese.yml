 viapeccati: "原罪之道"
 viapeccati_adj: "原罪之道"
 viapeccati_adherent: "罪人"
 viapeccati_adherent_plural: "罪人"
 viapeccati_desc: "沉溺于自己的欲望中可以使原罪之路的信徒们得以控制自己的心兽，至于达成他们欲望的过程中是否会祸及他人，他们并不关心。无法保持身心愉悦的话他们的情况就会变糟，也因此，当原罪之路的信徒选择了自己的道路时，无论是道德还是伦理，亦或是法律，都已经不在他们的考量范围之内了。这并不代表原罪之路的信徒们都是恶人，他们只是沉浸在自我放纵中罢了。"
 viavoluptuous: "纵欲之道"
 viavoluptuous_adj: "纵欲之道"
 viavoluptuous_adherent: "纵欲者"
 viavoluptuous_adherent_plural: "纵欲者"
 viavoluptuous_desc: "走纵欲之道的罪人是那些走原罪之路的人中最享乐的。对他们来说，就其存在本身而言，快乐就是一切，绝对没有什么下限。"
 viacrudelitas: "残忍之道"
 viacrudelitas_adj: "残忍之道"
 viacrudelitas_adherent: "无情者"
 viacrudelitas_desc: "残忍之道的追随者是最愤世嫉俗和最可恨的罪人。这很大程度上源于一种“宁我先害人，勿等人害我”的哲学观念，这些罪人不相信慈悲、同情或怜悯。相反，他们唯有的快乐都建立在别人的痛苦之上。"
 viaadversarius: "敌对者之道"
 viaadversarius_adj: "敌对者之道"
 viaadversarius_adherent: "敌对者"
 viaadversarius_adherent_plural: "敌对者"
 viaadversarius_desc: "不要将“敌对者之道”与所谓的“魔鬼之道”混淆，这些罪人竭尽一切防止自己被操纵。他们是终极控制狂，他们会竭尽全力保护自己的自由意志，不寻常的时候，也会保护他人的自由意志。许多人认为他们是最“讨人喜欢”的罪人。"
 viadiabolis: "魔鬼之道"
 viadiabolis_adj: "魔鬼之道"
 viadiabolis_adherent: "魔鬼"
 viadiabolis_adherent_plural: "魔鬼"
 viadiabolis_desc: "作为一条天生具有破坏性的心路，魔鬼之道不被认为是一条可以轻易遵守的道；凡敢行邪淫的，就得放纵自己，行各样的放荡毁灭。许多人本身并非真正的邪恶，就像相信有着充满美德的亡生是一种徒劳的追求一样。然而，有些人认真对待魔鬼的角色，甚至称自己为魔鬼的化身和撒旦的仆从。此外巴力与魔鬼之道有着紧密关系。"
 viaprometheus: "普罗米修斯之道"
 viaprometheus_adj: "普罗米修斯之道"
 viaprometheus_adherent: "普罗米修斯派"
 viaprometheus_adherent_plural: "普罗米修斯派"
 viaprometheus_desc: "也被称为火焰使者，他们是$pod_cainites$的一个教派，梦想着重建迦太基和让血族与血畜和谐相处。不出所料，许多成员都是布鲁赫。由于许多上位氏族的成员认为这些计划是叛族行为，普罗米修斯派因此被迫秘密行动。"
 viafurores: "狂徒之道"
 viafurores_adj: "狂徒之道"
 viafurores_adherent: "狂徒"
 viafurores_adherent_plural: "狂徒"
 viafurores_desc: "这个教派的成员被认为是$pod_cainites$的无法之徒。他们被大多数亲王谴责是窃贼和捣蛋鬼，生活在吸血鬼社会的边缘，像类似处境的凡人一样，过着凄惨的生活。狂徒被看做为混乱的，但他们可以为自己的功业聚集一种在其他$pod_cainite$社会看不到的激情。"
 viaquiritare: "尖嚎之道"
 viaquiritare_adj: "尖嚎之道"
 viaquiritare_adherent: "嚎徒"
 viaquiritare_adherent_plural: "嚎徒"
 viaquiritare_desc: "最疯狂的罪人和敌对者之道的对立面，尖嚎之道的追随者相信他们已经被诅咒了，他们也已经是心兽的猎物，因此他们允许自己被心兽操纵来执行心兽的命令。它们本质上是人间地狱的活例子；连别的罪人也厌恶与这些疯子结交。"
 pathoftheeightfoldwheel: "八季轮之道"
 pathoftheeightfoldwheel_adj: "八季轮之道"
 pathoftheeightfoldwheel_adherent: "德鲁伊"
 pathoftheeightfoldwheel_adherent_plural: "德鲁伊"
 pathoftheeightfoldwheel_desc: "八季轮之道借鉴了凯尔特的异教信仰，特别是德鲁伊教。他们极为注重尊崇神灵和自然精神，致力于保持所有事物的平衡，且拥有一个以天文为基础的八等份循环历法。"
 pathofwatchfulgods: "旧神之道"
 pathofwatchfulgods_adj: "旧神之道"
 pathofwatchfulgods_adherent: "预言者"
 pathofwatchfulgods_adherent_plural: "预言者"
 pathofwatchfulgods_desc: "旧神之道崇敬古希腊和古罗马的异教万神殿，尽管不同的异教传统的万神殿也将自己定位在此道上。在此道上，吸血鬼通过定期献祭，尊重和保护神认为神圣的事物，并遵守严格的荣誉准则来为神奉献。"
 viahyron: "巢众之道"
 viahyron_adj: "巢众之道"
 viahyron_adherent: "亚伯之子"
 viahyron_adherent_plural: "亚伯之子"
 viahyron_desc: "巢群之路几乎是只被巴力的摩洛教团所追随。这条心路宣扬对整个血系，特别是对自己的[Glossary('尊长','game_concept_Sire_desc')]的忠诚。其主要原因是，巴力想要完成的伟大作品不能被单独获得，也不能干涉他人的作品。吸血鬼不得不让巢群的声音进入他的灵魂，以便理解外部黑暗生物的梦境并让他们入睡。除此之外，如果一位巴力愚蠢到暴露自己是信徒的话，其他大多数吸血鬼都会积极地消灭他。"
 holy_order_the_sinful: "有罪者"
