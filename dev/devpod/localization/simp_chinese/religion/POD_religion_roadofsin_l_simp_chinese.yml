 holy_order_the_heartless: "无情者"
 holy_order_the_adversaries: "敌对者"
 holy_order_the_firebringers: "火焰使者"
 holy_order_the_outlaws: "无法者"
 holy_order_the_screamers: "尖叫者"
 holy_order_order_of_abelenes: "亚伯派骑士团"
 holy_order_order_of_iblis: "易卜劣斯骑士团"
 holy_order_cult_of_augurs: "预兆密教"
 holy_order_order_of_vaticinators: "预言者骑士团"
 viatartaros: "塔耳塔洛斯之道"
 viatartaros_adj: "塔耳塔洛斯之道"
 viatartaros_adherent: "塔耳塔洛斯"
 viatartaros_adherent_plural: "塔耳塔洛斯"
 viatartaros_desc: "赞助者设定的非原作官设宗教。\n注意，大魔在此。打开我们血肉筋骨之监狱的钥匙，不可能仅仅通过研究和实验就能找到；相反，我们必须寻求，但不索取，那些站在世界门槛之外的人所拥有的知识。他们将会称呼为我们崇魔者，如果他们知道我们的真实意图，既超越我们曾两度出生的监狱。这条心路是黑暗的，充满了危险，我们唯一能找到的光明，是一种可怕的、刺人的光辉，它有灼烧我们的肉体，使我们的灵魂流血的危险。"
 deimosianism: "畏惧主义"
 deimosianism_adj: "畏惧主义"
 deimosianism_adherent: "畏惧派"
 deimosianism_adherent_plural: "畏惧派"
 deimosianism_desc: "吸血鬼是人类原始恐惧的化身。因此，他们必须以自己的状况来揭示。也许有一天，人类会强大到足以征服它的恐惧。在那之前，畏惧派想做啥就做啥。"
 servitorsofirad: "以拿从者"
 servitorsofirad_adj: "以拿从者"
 servitorsofirad_adherent: "从者"
 servitorsofirad_adherent_plural: "从者"
 servitorsofirad_desc: "自称是[Glossary('上古耆宿','game_concept_antediluvian_desc')]的下仆，以拿从者只想寻求无尽战争和流血漂卤。这个星球将被鲜血浸透，而他们将一直站在最前线。"
 viacrudelitas_adherent_plural: "无情者"
 baobhansith: "芭万·希"
 baobhansith_adj: "芭万·希"
 baobhansith_adherent: "芭万·希"
 baobhansith_adherent_plural: "芭万·希"
 baobhansith_desc: "赞助者设定的非原作官设宗教。\n\n芭万·希接纳了他们的创始人艾斯林·恋难舍的遗产，其的第一次吸食激发出了苏格兰高地的芭万·希传说。对杀手、诱人的精类吸血鬼的神话着迷的信徒们，遵从了其以保持传说的活力。"
 holy_order_host_of_the_broken_heart: "碎心宿主"
 holy_order_host_of_the_unseelie: "哀怒廷宿主"
 roadofsin_religious_head_title_name: "首民"
 holy_order_ancient_order_of_druids: "古德鲁伊教团"
 holy_order_order_of_morrigan: "摩莉甘骑士团"
 holy_order_order_of_tartaros: "塔耳塔洛斯骑士团"
 roadofsin_divine_realm: "永恒"
 roadofsin_witchgodname_the_horned_god_possessive: "敌寇的"
 pathoftevoro: "特沃罗之道"
 pathoftevoro_adj: "特沃罗之道"
 pathoftevoro_adherent: "蒂莫尼派"
 pathoftevoro_adherent_plural: "蒂莫尼派"
 pathoftevoro_desc: "赞助者设定的非原作官设宗教。\n\n特沃罗之道是通往许多超自然能力的一条捷径。特沃罗是阿特拉哈西斯的经历的最终顶点。蒂莫尼派宣扬追求知识——所有知识"
 bloodtribe: "血部落"
 bloodtribe_adj: "血部落"
 bloodtribe_adherent: "叛党"
 bloodtribe_adherent_plural: "叛党"
 bloodtribe_desc: "血部落最初由[GetTrait('bushi').GetName(GetNullCharacter)]血系的创始人宫子倡导，是一个坚定忠诚的兄弟会，团结一致反抗夜之世界的结构性压迫。他们常宁死不屈，并在彼此合作中遵循严格的内部行为准则。在许多方面，血部落与西方的布鲁赫狂徒相似，尽管相比没有传承的同胞，他们的组织性要强得多。"