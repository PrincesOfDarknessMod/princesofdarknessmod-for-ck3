 derechlilit: "莉莉丝之道"
 derechlilit_adj: "莉莉丝之道"
 derechlilit_adherent: "莉莉丝派"
 derechlilit_adherent_plural: "莉莉丝派"
 derechlilit_desc: "莉莉丝之道是献给拉比犹太人物莉莉丝的，她出现在多个挪得学家引用文献以及由隐藏的密教传承的传统中。大多数密教将莉莉丝的基本原则分解为：痛苦和创造。为了创造，一个人必须伤害和被伤害。这是生活本身的基本原则。"
 viafaciendi: "制造之道"
 viafaciendi_adj: "制造之道"
 viafaciendi_adherent_plural: "制造者"
 viafaciendi_desc: "制造之道致力于寻找和传播莉莉丝的恶魔子嗣，取材于圣经中的莉莉丝是万魔之母的传说。"
 viaspinae: "荆棘之道"
 viaspinae_adj: "荆棘之道"
 viaspinae_adherent: "巴哈"
 viaspinae_adherent_plural: "巴哈里"
 viaspinae_desc: "荆棘之道关注的是身体上的疼痛。成员们从逻辑上研究痛苦，寻求编纂痛点和打破受害者承受的方法，让她明白莉莉丝的痛苦真相。"
 viacalantica: "面纱之道"
 viacalantica_adj: "面纱之道"
 viacalantica_adherent: "基斯基勒莉拉"
 viacalantica_adherent_plural: "基斯基勒莉拉"
 viacalantica_desc: "面纱之道集中专注于莉莉丝的反叛者面和于亚伯拉罕神与该隐的对立面。他们是莉莉丝派中最恶毒的，常常是战士而不是学者。"
