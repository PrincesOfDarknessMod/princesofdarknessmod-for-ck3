 hellcats_knowledge_god_name_possessive: "$hellcats_high_god_name_possessive$"
 wyrmbound: "妖蛆奴仆"
 wyrmbound_adj: "妖蛆奴仆"
 wyrmbound_adherent: "腐化者"
 wyrmbound_adherent_plural: "腐化者"
 wyrmbound_desc: "$glossary_wyrm$的爪牙遍布各处。有些自知为其效命，有些则懵然不知。但它们的行径无一不在推动妖蛆的终极目标，引发怒嚎末日，终结盖亚。因此，所有制造苦难、沉溺堕落或参与毁灭的存在，无论自愿与否，知情与否，皆为妖蛆之仆。"
 maneaters: "食人者"
 maneaters_adj: "食人者"
 maneaters_adherent: "食人者"
 maneaters_adherent_plural: "食人者"
 maneaters_desc: "这个啮骨者战群通过违背禁止吞食人肉的律令戒条来获取力量。该阵营的大多数\"皈依者\"都是因频繁陷入血狂而堕落的狼族。如今他们数量稀少，残存者中许多已与寂静漫游者部族中类似的噬尸者阵营结盟。\n关于贪婪狼人的零星食尸传说也为食人者的存在提供了佐证，毕竟在饥荒年代，啮骨者很难抗拒既能果腹又能同时减少几张嗷嗷待哺之嘴的双重诱惑。"
 masks: "面具"
 masks_adj: "面具"
 masks_adherent: "面具"
 masks_adherent_plural: "面具"
 masks_desc: "一个致力于向敌人灌输恐惧的影爵秘密团体，面具对其黑暗技艺的狂热追求达到了如此程度，据称他们会通过仪式性的自残来激发受害者更大的恐怖。由于未知正是恐惧的游乐场，真正的面具成员从不向外界透露自己的派系身份；除非对方是被选中要吸纳进他们行列的人。"
 societyofnidhogg: "尼德霍格学会"
 societyofnidhogg_adj: "尼德霍格学会"
 societyofnidhogg_adherent: "尼德霍格派"
 societyofnidhogg_adherent_plural: "尼德霍格派"
 societyofnidhogg_desc: "所有风暴领主都了解黑暗的力量，但没有人比这个神秘的派系的成员更深。他们的狂热如此强烈，以至于他们声称阳光本身就是对雷霆力量的威胁，并试图将世界置于永恒的黑暗中。"
 eatersofthedead: "食死徒"
 eatersofthedead_adj: "食死徒"
 eatersofthedead_adherent: "食死徒"
 eatersofthedead_adherent_plural: "食死徒"
 eatersofthedead_desc: "寂静漫游者部族中一个被其他族人驱逐至地下的秘密营地，据传他们在阴影中举行亵渎的仪式。吞噬敌人的大脑以获知所有秘密：一项邪恶却实用的仪式。然而所有吞食同类血肉者都会逐渐陷入疯狂，并散发$glossary_wyrm$的腐臭。有些人甚至对新鲜脑髓产生成瘾性，会无差别猎杀无辜者与罪人以满足饕餮之欲。"
 metasticbirth: "扭曲之孳"
 metasticbirth_adj: "扭曲之孳"
 metasticbirth_adherent: "助产士"
 metasticbirth_adherent_plural: "助产士"
 metasticbirth_desc: "这些星占者认为$glossary_wyrm$并未被禁锢，而是处于茧中经历蜕变，准备迎接$glossary_weaver$所孕育的新现实。一旦完成蜕变，它将破茧而出，引领新世界的到来。追随此阵营的星占者相信这是件好事，部族应当帮助他人为此做好准备，而非抗拒它。"
 ebon_centipede: "玄蚣"
 ebon_centipede_adj: "玄蚣"
 ebon_centipede_adherent: "迷宫寻者"
 ebon_centipede_adherent_plural: "迷宫寻者"
 ebon_centipede_desc: "当暗影变得过于深邃，绝望或残忍压垮了某个八犬时，他们可能会将自己投身于玄色迷宫，并效忠于[Glossary('蜈蚣', 'glossary_wyrm_tt')]。这些孤独、悲惨且暴戾的存在，是一切灵性良善的灾星，与西方那些堕落的#ONCLICK:FAITH,blackspiraldancer #TOOLTIP:FAITH,blackspiraldancer $Destroyer Werewolves|L$#!#!极为相似。"
 ebon_centipede_high_god_name: "[Glossary('蜈蚣', 'glossary_wyrm_tt')]"
 ebon_centipede_high_god_name_possessive: "[Glossary('蜈蚣', 'glossary_wyrm_tt')]"
 ebon_centipede_high_god_name_alternate: "$ebon_centipede_high_god_name$"
 ebon_centipede_high_god_name_alternate_possessive: "$ebon_centipede_high_god_name_possessive$"
 ebon_centipede_creator_god_name: "$ebon_centipede_high_god_name$"
 ebon_centipede_creator_god_name_possessive: "$ebon_centipede_high_god_name_possessive$"
 mnetics: "食秘者"
 mnetics_adj: "食秘者"
 mnetics_adherent: "食秘者"
 mnetics_adherent_plural: "食秘者"
 mnetics_desc: "食秘者是那些吞食秘密之人。他们已洞悉真理：记忆不过是短暂且可塑之物。当其他莫科莱耗费岁月，透过龙梦重历往昔时，食秘者却明白，那一切皆是虚妄。若所有莫科莱都共享过去，为何每个人的记忆却又如此迥异？食秘者沉醉于以谎言与欺瞒扭曲龙梦。许多莫科莱因轻信[Glossary('解体者', 'glossary_wyrm_tt')]的谎言而堕落，而食秘者也因此愈发壮大。"
 holy_order_wyrm_chosen: "妖蛆选士"
 holy_order_calamity_heralds: "灾祸先驱"
 holy_order_bringer_ruin: "废墟使者"
 holy_order_defiler_champions: "亵渎蛆勇士"
 holy_order_death_spiral: "死亡螺旋"
 holy_order_heralds_hydra: "九头蛇先驱"
 holy_order_bringers_apocalypse: "怒嚎末日使者"
 holy_order_balefire_warriors: "恶火战士"
 holy_order_butchers_men: "人之屠夫"
 holy_order_writhing_shadows: "扭动暗影"
 holy_order_blackened_blades: "黑化之刃"
 holy_order_children_ammit: "阿米特之子"
 ouroboroans: "衔尾蛇"
 ouroboroans_adj: "衔尾蛇"
 ouroboroans_adherent: "衔尾蛇"
 ouroboroans_adherent_plural: "衔尾蛇"
 ouroboroans_desc: "他们意图将三相平衡的$glossary_wyrm$自巨网中解放。与其尽力对抗$glossary_weaver$，他们选择将力量投注于追寻妖蛆一切形态的踪迹，只为寻得将其释放的秘密。唯有循着妖蛆的轨迹直抵其巢穴，而非仅与其仆从周旋，他们才相信自己能真正左右终末之战的结局。因此，部分僧侣深信：妖蛆之道不应被回避，而必须被理解，甚至加以运用。"
 holy_order_unshacklers_corruption: "腐堕解缚者"
 holy_order_eyes_cahlash: "卡赫拉什之眼"
 holy_order_forgotten_nightmares: "被忘却的梦魇"
 fallen_tribes_religion: "@wyrm_icon!堕落部族"
 fallen_tribes_religion_adj: "堕落"
 fallen_tribes_religion_adherent: "堕落"
 fallen_tribes_religion_adherent_plural: "堕落"
 fallen_tribes_religion_desc: "这些堕落的$glossary_fera$已沦为$glossary_wyrm$影响力的牺牲品。他们背弃了自己的道路，转而追随黑暗大师，期盼其能对他们的忠诚给予回报。"
 black_spiral_dancer_religious_text: "$glossary_werewolf_dark_litany$"