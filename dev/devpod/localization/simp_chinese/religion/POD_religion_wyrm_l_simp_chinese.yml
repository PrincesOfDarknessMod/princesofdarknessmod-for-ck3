 wyrmbound: "妖蛆奴仆"
 wyrmbound_adj: "妖蛆奴仆"
 wyrmbound_adherent: "病魔之道"
 wyrmbound_adherent_plural: "病魔之道"
 wyrmbound_desc: "$glossary_wyrm$的爪牙遍布各处。有些自知为其效命，有些则懵然不知。但它们的行径无一不在推动妖蛆的终极目标，引发怒嚎末日，终结盖亚。因此，所有制造苦难、沉溺堕落或参与毁灭的存在，无论自愿与否，知情与否，皆为妖蛆之仆。"
 maneaters: "食人者"
 maneaters_adj: "食人者"
 maneaters_adherent: "食人者"
 maneaters_adherent_plural: "食人者"
 maneaters_desc: "这个啮骨者战群通过违背禁止吞食人肉的律令戒条来获取力量。该阵营的大多数\"皈依者\"都是因频繁陷入血狂而堕落的狼族。如今他们数量稀少，残存者中许多已与寂静漫游者部族中类似的噬尸者阵营结盟。\n关于贪婪狼人的零星食尸传说也为食人者的存在提供了佐证，毕竟在饥荒年代，啮骨者很难抗拒既能果腹又能同时减少几张嗷嗷待哺之嘴的双重诱惑。"
 masks: "面具"
 masks_adj: "面具"
 masks_adherent: "面具"
 masks_adherent_plural: "面具"
 masks_desc: "一个致力于向敌人灌输恐惧的影爵秘密团体，面具对其黑暗技艺的狂热追求达到了如此程度，据称他们会通过仪式性的自残来激发受害者更大的恐怖。由于未知正是恐惧的游乐场，真正的面具成员从不向外界透露自己的派系身份；除非对方是被选中要吸纳进他们行列的人。"
 societyofnidhogg: "尼德霍格学会"
 societyofnidhogg_adj: "尼德霍格学会"
 societyofnidhogg_adherent: "尼德霍格派"
 societyofnidhogg_adherent_plural: "尼德霍格派"
 societyofnidhogg_desc: "All Shadowlords understand the power of darkness, but none so deeply as the members of this secretive, mystic camp. So strong is their fanaticism that they claim that sunlight itself is a threat to the forces of Thunder, and seek to plunge the world into eternal darkness."
 eatersofthedead: "食死徒"
 eatersofthedead_adj: "Eaters"
 eatersofthedead_adherent: "食死徒"
 eatersofthedead_adherent_plural: "食死徒"
 eatersofthedead_desc: "寂静漫游者部族中一个被其他族人驱逐至地下的秘密营地，据传他们在阴影中举行亵渎的仪式。吞噬敌人的大脑以获知所有秘密：一项邪恶却实用的仪式。然而所有吞食同类血肉者都会逐渐陷入疯狂，并散发$glossary_wyrm$的腐臭。有些人甚至对新鲜脑髓产生成瘾性，会无差别猎杀无辜者与罪人以满足饕餮之欲。"
 metasticbirth: "扭曲之孳"
 metasticbirth_adj: "Metastic"
 metasticbirth_adherent: "助产士"
 metasticbirth_adherent_plural: "助产士"
 metasticbirth_desc: "这些星占者认为$glossary_wyrm$并未被禁锢，而是处于茧中经历蜕变，准备迎接$glossary_weaver$所孕育的新现实。一旦完成蜕变，它将破茧而出，引领新世界的到来。追随此阵营的星占者相信这是件好事，部族应当帮助他人为此做好准备，而非抗拒它。"
 boli_zouhisze: "玻璃走兽"
 boli_zouhisze_adj: "Zouhisze"
 boli_zouhisze_adherent: "Faithful"
 boli_zouhisze_adherent_plural: "Faithful"
 boli_zouhisze_desc: "人类监护者的中国分支，在公元前2000年之前的某个时候分出，尽管他们保留了其母族文化的某些方面，如对人类文化的欣赏和对蟑螂之灵的崇拜。后者导致中国本土的$glossary_fera$回避玻璃走兽，并将他们排除在兽庭之外，因为昆虫的意象与变化妖怪中的妖蛆眷族有很大关系。"
 ebon_centipede: "玄蚣"
 ebon_centipede_adj: "玄蚣"
 ebon_centipede_adherent: "迷宫寻者"
 ebon_centipede_adherent_plural: "迷宫寻者"
 ebon_centipede_desc: "When the shadows become too deep that despair or cruelty overwhelms one of the Hakken, they may subject themselves to the Ebon Maze and swear themselves to [Glossary('Centipede', 'glossary_wyrm_tt')]. Lone, wretched, and violent creatures, they are a bane to all that is spiritually good, much alike the degenerate #ONCLICK:FAITH,blackspiraldancer #TOOLTIP:FAITH,blackspiraldancer $Destroyer Werewolves|L$#!#! in the West."
 ebon_centipede_high_god_name: "[Glossary('蜈蚣', 'glossary_wyrm_tt')]"
 ebon_centipede_high_god_name_possessive: "[Glossary('蜈蚣', 'glossary_wyrm_tt')]"
 ebon_centipede_high_god_name_alternate: "$ebon_centipede_high_god_name$"
 ebon_centipede_high_god_name_alternate_possessive: "$ebon_centipede_high_god_name_possessive$"
 ebon_centipede_creator_god_name: "$ebon_centipede_high_god_name$"
 ebon_centipede_creator_god_name_possessive: "$ebon_centipede_high_god_name_possessive$"
 mnetics: "忆传素"
 mnetics_adj: "忆传"
 mnetics_adherent: "忆传"
 mnetics_adherent_plural: "忆传素"
 mnetics_desc: "The Mnetics are the Eaters of Secrets. Their eyes have been opened to the truth that memories are ephemeral and malleable. While the other Mokolé spend years reliving the past through Mnesis, the Mnetics know that it is all a lie. If all Mokolé remember the past, then why is it so different for everyone? The Eaters of Secrets revel in twisting Mnesis with their lies and deception. Many Mokolé have fallen to the [Glossary('Dissolver', 'glossary_wyrm_tt')] believing his lies, and the Mnetics grow ever stronger as a result."
 holy_order_wyrm_chosen: "Wyrm's Chosen"
 holy_order_calamity_heralds: "Calamity's Heralds"
 holy_order_bringer_ruin: "Bringers of Ruin"
 holy_order_defiler_champions: "Defiler's Champions"
 holy_order_death_spiral: "Death Spiral"
 holy_order_heralds_hydra: "Heralds of the Hydra"
 holy_order_bringers_apocalypse: "Bringers of the Apocalypse"
 holy_order_balefire_warriors: "Balefire Warriors"
 holy_order_butchers_men: "Butchers of Men"
 holy_order_writhing_shadows: "The Writhing Shadows"
 holy_order_blackened_blades: "Blackened Blades"
 holy_order_children_ammit: "Children of Ammit"
 ouroboroans: "Ouroboroans"
 ouroboroans_adj: "Ouroboroans"
 ouroboroans_adherent: "Ouroboroan"
 ouroboroans_adherent_plural: "Ouroboroans"
 ouroboroans_desc: "They seek to free the $glossary_wyrm$ of Balance from the Web. Instead of striving against the $glossary_weaver$, they use their energies to seek out the Wyrm in all its forms in hopes of discovering the secret of freeing it. Only by following the Wyrm to its cave, rather than fighting its minions, do they feel they may truly influence the outcome of the Final War. Hence, some of these monks believe that the ways of the Wyrm must be used, not shunned."
 holy_order_unshacklers_corruption: "Unshacklers of Corruption"
 holy_order_chaos_spinners: "Chaos Spinners"
 holy_order_eyes_cahlash: "Eyes of Cahlash"
 holy_order_forgotten_nightmares: "The Forgotten Nightmares"