 ishmaelite_adj: "以实玛利派"
 ishmaelite_adherent: "以实玛利派"
 ishmaelite_adherent_plural: "以实玛利派"
 ishmaelite_desc: "以实玛利派是流浪的贤荷鲁，他们因为各种原因放弃了荷鲁斯的圣战。他们以以实玛利的名字命名，以实玛利是第一位反对荷鲁斯领导的贤荷鲁，他被放逐且永恒独行。"
