 faces_of_apophis_desc: "阿波菲斯是世界上所有灾难的核心，是大灾祸的究极化身。自从时间之初，阿波菲斯就一直存在，玷污和破坏了玛阿特的信条。它是困扰着世界的究极欺骗者，是压倒性的黑暗和不间断的扭曲。"
