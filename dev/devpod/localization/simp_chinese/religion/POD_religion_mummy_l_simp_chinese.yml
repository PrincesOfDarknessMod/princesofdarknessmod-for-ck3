 ten_mandates_of_heaven:0 "十大天条"
 ten_mandates_of_heaven_adj:0 "十大天条"
 ten_mandates_of_heaven_adherent:0 "天亲"
 ten_mandates_of_heaven_adherent_plural:0 "天亲"
 ten_mandates_of_heaven_desc:0 "十大天条是天亲的规则和准则，由八仙在玉皇大帝的监督下制定。每项天条都同样重要，每位不朽者都有自己的优先级顺序来遵循它们，取决于他的性格和个人实力。"