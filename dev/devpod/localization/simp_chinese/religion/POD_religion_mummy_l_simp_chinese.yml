 code_of_horus_desc:0 "荷鲁斯法典是荷鲁斯对其追随者的戒律汇编。它总结了他一生的教诲和经验，包含了新不朽者在古埃及时代得到的所有指示。"
 ishmaelite:0 "以实玛利派"
 ishmaelite_adj:0 "以实玛利派"
 ishmaelite_adherent:0 "以实玛利派"
 ishmaelite_adherent_plural:0 "以实玛利派"
 ishmaelite_desc:0 "以实玛利派是流浪的贤荷鲁，他们因为各种原因放弃了荷鲁斯的圣战。他们以以实玛利的名字命名，以实玛利是第一位反对荷鲁斯领导的贤荷鲁，他被放逐且永恒独行。"
 faces_of_apophis:0 "阿波菲斯诸相"
