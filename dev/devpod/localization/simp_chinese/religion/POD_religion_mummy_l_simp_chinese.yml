 cabiri_adherent: "卡比里"
 cabiri_adherent_plural: "卡比里"
 cabiri_desc: "在生命之咒被创造出来，荷鲁斯和他的追随者对赛特和他的爪牙发动大战的很久后，一位以实玛利派把生命神咒的原理教给了一个名叫卡比洛斯的天才法师。卡比洛斯利用这一点创造了他自己的生命神咒，并创造了源自他的不朽者，其等对奥西里斯和玛阿特一无所知——这让贤荷鲁感到非常惊恐。"
