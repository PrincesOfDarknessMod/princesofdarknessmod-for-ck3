 ten_mandates_of_hell_adherent:0 "诡亲"
 ten_mandates_of_hell_adherent_plural:0 "诡亲"
 ten_mandates_of_hell_desc:0 "谣言说，阎魔创造了堕落版的不死奴隶来对抗天庭。"
