 laibon: "天道与地球之道"
 laibon_adj: "天道与地球之道"
 laibon_adherent: "天地行者"
 laibon_adherent_plural: "天地行者"
 laibon_desc: "天道与地道是莱本教派的核心灵修之道，平衡奥伦与艾这对孪生力量——神圣之天与物质之世。信奉者追求心兽的灵性饥渴与生者世界责任之间的和谐，行走于超脱与沉沦之间的一条窄径。失去这一平衡，便会滑向两极之一：化入超然神性而消散，或堕入贪婪魔性而沉沦。"
 roadoflaibon_religious_head_title_name: "灵性可罗"
 roadoflaibon_death_deity_name_possessive: "毁灭"
 roadoflaibon_divine_realm: "荒野"
 roadoflaibon_witchgodname_the_horned_god_possessive: "饥渴的"
 laibon_nyayo: "尼亚约"
 laibon_nyayo_adj: "尼亚约"
 laibon_nyayo_adherent: "尼亚约"
 laibon_nyayo_adherent_plural: "尼亚约"
 laibon_nyayo_desc: "尼亚约，即追随先祖足迹之人，是坚持埃博尼王国疆域须按其自身规矩治理的莱本。合作可行，臣服绝无可能。"
 laibon_luo: "卢奥"
 laibon_luo_adj: "卢奥"
 laibon_luo_adherent: "卢奥"
 laibon_luo_adherent_plural: "卢奥"
 laibon_luo_desc: "在尼亚约的议会警惕之处，卢奥人则要求战争。该隐之子在非洲的每一个立足点都是殖民行为。他们的信仰是通过暴力实现收复。"
 laibon_daughters_of_arawelo: "阿拉维洛之女"
 laibon_daughters_of_arawelo_adj: "阿拉维洛"
 laibon_daughters_of_arawelo_adherent: "阿拉维洛之女"
 laibon_daughters_of_arawelo_adherent_plural: "阿拉维洛之女"
 laibon_daughters_of_arawelo_desc: "阿拉维洛是一位碾压所有反对她的男人的女王。众女尊崇她，视之为身份是由自我锻造而非天赐的明证——力量、机敏与冷酷的野心，才是唯一重要的与生俱来之物。"
 laibon_birds_of_huur: "胡尔之鸟"
 laibon_birds_of_huur_adj: "胡里安"
 laibon_birds_of_huur_adherent: "斤养异"
 laibon_birds_of_huur_adherent_plural: "斤养异"
 laibon_birds_of_huur_desc: "胡尔是死亡的使者，他的鸟人行走在一种融合了非洲宇宙观的矛盾哲学之中。对基尼永伊人而言，漂泊即是崇拜，而旅程本身就是唯一诚实的归宿。"
 laibon_appeasers_of_eebo: "安抚者埃博"
 laibon_appeasers_of_eebo_adj: "埃博伊特"
 laibon_appeasers_of_eebo_adherent: "安抚者埃博"
 laibon_appeasers_of_eebo_adherent_plural: "安抚者埃博"
 laibon_appeasers_of_eebo_desc: "伊博是天界之神，以太阳为灼目之瞳。与奥伦紧密相连的安抚者一族，竭力彻底超越其兽性本质。"
 laibon_nidars_punishers: "尼达尔惩罚者"
 laibon_nidars_punishers_adj: "尼达尔"
 laibon_nidars_punishers_adherent: "尼达尔惩罚者"
 laibon_nidars_punishers_adherent_plural: "尼达尔惩罚者"
 laibon_nidars_punishers_desc: "这一殡仪与杀手组织致力于摧毁滥用权力的马加吉。其与艾深深共鸣，坚信正义属于物质世界。"
 laibon_children_of_sarapion: "萨拉皮翁之子"
 laibon_children_of_sarapion_adj: "萨拉皮翁"
 laibon_children_of_sarapion_adherent: "萨拉皮翁之子"
 laibon_children_of_sarapion_adherent_plural: "萨拉皮翁之子"
 laibon_children_of_sarapion_desc: "萨拉皮翁古老到无可度量。孩童们不认任何伪神，他们推翻任何变得过于强大的存在，因为无人能与其荣光相匹敌。"
 laibon_asiman: "阿西曼"
 laibon_asiman_adj: "阿西曼"
 laibon_asiman_adherent: "阿西曼"
 laibon_asiman_adherent_plural: "阿西曼"
 laibon_asiman_desc: "阿西曼才是正统之人。莱本既拒绝长者的权威，也否认马加吉的权柄，坚信没有吸血鬼能仅凭年龄或血统就统治他人。"
 laibon_tariq_alsama_walard: "塔里克之道"
 laibon_tariq_alsama_walard_adj: "塔里克之道"
 laibon_tariq_alsama_walard_adherent: "塔里克追随者"
 laibon_tariq_alsama_walard_adherent_plural: "塔里克追随者"
 laibon_tariq_alsama_walard_desc: "塔里克天地大道代表了阿什拉派伊斯兰与莱本精神传统之间的融合。非洲身份与伊斯兰虔诚并非相互竞争的忠诚，而是单一而统一的真理。"
 laibon_path_of_terror: "恐怖之道"
 laibon_path_of_terror_adj: "恐怖之道"
 laibon_path_of_terror_adherent: "恐怖散布者"
 laibon_path_of_terror_adherent_plural: "恐怖散布者"
 laibon_path_of_terror_desc: "恐怖之道植根于原始恐惧。欲成非凡之物，必先成可怖之身。"
 laibon_flowers_of_indulgence: "纵情之花"
 laibon_flowers_of_indulgence_adj: "纵情之花"
 laibon_flowers_of_indulgence_adherent: "纵情之花"
 laibon_flowers_of_indulgence_adherent_plural: "纵情之花"
 laibon_flowers_of_indulgence_desc: "享乐主义是面具，而非真容。在放纵之下，暗藏着一张马基雅维利式的阴谋之网。美酒总是甘甜，代价却总在日后偿付。"