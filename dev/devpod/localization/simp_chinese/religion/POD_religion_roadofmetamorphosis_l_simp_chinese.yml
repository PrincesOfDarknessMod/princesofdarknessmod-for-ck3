 pathofstars: "星辰之道"
 pathofstars_adj: "星辰之道"
 pathofstars_adherent: "探求者"
 pathofstars_adherent_plural: "探求者"
 pathofstars_desc: "作为蜕变之路的扭曲版本，星辰之道的追随者不仅追求自身的完美，更追求世界的完美，以此侍奉新的主人。苦难即是精髓，一种可供榨取的资源。因此，要真正飞升，就必须将苦难变得司空见惯，使其如同钱币般易于交易，如此普遍以至于无人想去挑战它。成为寻星者不仅是为了提升自我，更是要向全世界昭示其真正的价值所在。"