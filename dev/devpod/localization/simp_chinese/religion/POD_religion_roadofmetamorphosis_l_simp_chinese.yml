 viamutationis: "突变之道"
 viamutationis_adj: "突变之道"
 viamutationis_adherent: "修者"
 viamutationis_adherent_plural: "修众"
 viamutationis_desc: "蜕变之路的追随者对知识的利用不是为了别人，而是为了自己。那些成为修者的人，在发现自己的能力时，过着孤独、内向的生活。他们依靠于谜语和零散的信息，并通常给出相似的答案作为回报。"
 pathoftheflesh: "肉体之道"
 pathoftheflesh_adj: "肉体之道"
 pathoftheflesh_adherent: "体修者"
 pathoftheflesh_adherent_plural: "体修众"
 pathoftheflesh_desc: "这条心路的真正目标完全是物理的。身体的转变导致在物质世界获得巨大的力量。只有当精神能帮助生理转变时，精神才被认为是重要的。"
 pathofthespirit: "精神之道"
 pathofthespirit_adj: "精神之道"
 pathofthespirit_adherent: "灵修者"
 pathofthespirit_adherent_plural: "灵修众"
 pathofthespirit_desc: "这条心路的真正目标是完全的精神转变。他们视物质世界为一种幻觉和一种分散注意力的东西，充其量只是一种辅助精神成长的简单工具。"
