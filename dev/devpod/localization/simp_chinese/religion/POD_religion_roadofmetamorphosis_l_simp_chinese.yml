 viaapotheosis_desc: "赞助者设定的非原作官设宗教。\n追随者努力超越他们的生物限制，提高精神和身体能力，直到他们与神明无异。竞争性的仪式包括向上级卑躬屈膝并向其学习，以换取血祭。在终（亡）生追求完美的过程中，易变术是最常用的$pod_discipline$，尽管从业者被鼓励使用大多数可用的力量来实现他们的理想主义又自我主义的目标（甚至是恶魔契约和$pod_diablerie$）。"
 pathofasakku: "病魔之道"
 pathofasakku_adj: "病魔之道"
 pathofasakku_adherent: "腐化者"
 pathofasakku_adherent_plural: "腐化者"
 pathofasakku_desc: "赞助者基于原作官设宗教的二设。\n作为一位流浪的神秘主义者，德拉戈斯特用他的慈悲之心来治疗血畜和血族的病人和伤员。然而，随着每一次的治疗，他的污血都会传播给大众，使他们由内而外地腐烂，并使他们堕落为雅撒库意志的延伸。德拉戈斯特的诅咒有可能已经蔓延到了地中海的大部分地区。然而，雅撒库，或者更正确地说，主宰他的意志的观者，低估了这个城市的其他同类。魔龙是一位古老的棘秘魑，他对易变术的了解甚至超过了阿萨库，他根除了许多邪教，并迅速地将棘秘魑流民赶出了城市。然而，德拉戈斯特的一些残余疯狂仍然留在古拜占庭的边缘，尽管其几个世纪的准备和阴谋在短暂的几年内被推翻。此后，该教派在其教主马特忒俄斯·耶尔贝根的带领下迁徙到了西伯利亚的荒野。"
