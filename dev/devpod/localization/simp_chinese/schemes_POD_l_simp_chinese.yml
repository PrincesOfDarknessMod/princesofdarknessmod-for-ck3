 scheme_interaction_tt_POD_rationalize_approved:0 "支配[recipient.GetFirstName]让[recipient.GetHerHim]认为欠我牵制。\n这将导致一场以你的管理能力与[recipient.GetHerHis]的密谋能力之间的对抗。"
