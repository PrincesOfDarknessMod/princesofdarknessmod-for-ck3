 vamphunt_desc_general:0 "$vamphunt$是一个[hostile_scheme|E]，使得一个[GetTrait('vampire').GetName( GetNullCharacter )]猎食一个[GetTrait('mortal').GetName( GetNullCharacter )]角色的血液。这个计谋主要依据你的[intrigue|E]，这不是[secret_scheme_single|E]且不能用[agents|E]。成功后，[GetTrait('vampire').GetName( GetNullCharacter )]会吸食[GetTrait('mortal').GetName( GetNullCharacter )]的血液。如果计谋暴露了角色会违反[masquerade|E]，并会带来潜在的效应如被$POD_splat_hunter_plural$攻击。这个能力不能用在[landed|E]角色上。潜在受害者必须与你在同一个地方。"
