 PODmesmerize_action:0 "支配"
 PODmesmerize_desc:0 "通过支配术，我将在获得对[SCHEME.GetTarget.GetShortUINameNoTooltip]的牵制，以让我能给其下达各种命令！"
 PODmesmerize_desc_general:0 "$PODmesmerize$是一个[personal_scheme|E]，用来迫使另一个角色听从你的命令。它通过[GetTrait('dominate').GetName( GetNullCharacter )][discipline|E]的[GetPerk('mesmerize_perk').GetName(GetNullCharacter)][perk|E]解锁。\n\n#X 与普通计谋不同，计谋本身的成功几率并不重要。计谋完成后，一场管理能力对抗将决定成功与否。#!\n\n具有比攻击者更前[generation|E]和获得[golconda|E]的吸血鬼能免疫催眠。\n\n具有更弱势的性格的角色更容易被催眠。具有更前的[generation|E]的吸血鬼在对抗时将获得优势。成功率能通过以下提高：[GetPerk('rationalize_perk').GetName(GetNullCharacter)]、[GetTrait('dominateadvanced').GetName(GetNullCharacter)]、[GetPerk('will_conquers_perk').GetName(GetNullCharacter)]、和[GetPerk('as_below_so_above_perk').GetName(GetNullCharacter)]。\n\n[mesmerize_defenses|E]"
