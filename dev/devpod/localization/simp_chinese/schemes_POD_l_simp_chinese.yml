 diablerize_desc:0 "我将[diablerize|E][SCHEME.GetTarget.GetShortUINameNoTooltip]，吞噬其的灵魂！"
 diablerize_desc_general:0 "$diablerize$是一种[hostile_scheme|E]，意图杀死目标[GetTrait('vampire').GetName( GetNullCharacter )]并吸干对方的血和灵魂。这是一种基于[intrigue|E]的[secret_scheme|E]，能够招揽[agents|E]。\n\n成功的[diablerie|E]将导致[scheme_target|E][character_death_death|E]。\n\n成功保持秘密状态的一次谋杀将赋予[scheme_owner|E]一件谋杀[diablerie|E][secret|E]。\n\n被发现意图[diablerize|E]，或成功吸榨某[GetTrait('vampire').GetName( GetNullCharacter )]，都是对大多数[GetTrait('vampire').GetName( GetNullCharacter )]信仰的严重[crime|E]。在[diablerie|E]的第一个受害者之后也被称作“不调花”，这是[GetTrait('vampire').GetName( GetNullCharacter )]吸干另一个[GetTrait('vampire').GetName( GetNullCharacter )]的所有血液包括他们灵魂的过程。它允许[diablerist|E]获得[bloodpotency|E]，甚至回溯[vampgeneration|E]。这通常是以加强[GetTrait('vampire').GetName( GetNullCharacter )]的[beast|E]为代价。我们用失去[piety|E]等级来表示这一点。大多数[GetTrait('vampire').GetName( GetNullCharacter )]对[GetTrait('diablerist').GetName( GetNullCharacter )]有低好感度。"
