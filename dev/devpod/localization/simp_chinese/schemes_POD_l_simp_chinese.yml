 PODbloodbond_desc_general:0 "$PODbloodbond$是一个[hostile_scheme|E]，用以获得牵制或将弱[bloodbond|E]转为强牵制。这是一种基于[intrigue|E]的[secret_scheme|E]，能够招揽[agents|E]。你的目标也许会接受血缚而不反抗，取决于你是否是其领主，其信仰是否接纳血缚或其是否信任你。\n\n#X 与普通计谋不同，计谋本身的成功几率并不重要。然而，计谋力量确实会影响完成计谋的速度。计谋完成后，一场密谋和勇武能力对抗将决定成功与否。#!"
