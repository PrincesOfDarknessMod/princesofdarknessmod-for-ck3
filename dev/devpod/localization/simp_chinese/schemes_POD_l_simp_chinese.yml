 PODentrance:0 "迷人魅惑"
 PODentrance_action:0 "魅惑"
 POD_entrance_interaction:0 "魅惑#weak （计谋）#!"
 POD_entrance_interaction_desc:0 "通过威仪术[discipline|E]，调用血液来魅惑一个生物喜欢你。"
 PODentrance_desc:0 "通过魅惑，我让[SCHEME.GetTarget.GetShortUINameNoTooltip]喜欢上了我！"
 PODentrance_desc_general:0 "$PODentrance$是一个[personal_scheme|E]，用使对方喜欢你。它通过[GetTrait('presence').GetName( GetNullCharacter )][discipline|E]的[GetPerk('entrancement_perk').GetName(GetNullCharacter)][perk|E]解锁。\n\n#X 与普通计谋不同，计谋本身的成功几率并不重要。计谋完成后，一场外交能力对抗将决定成功与否。#!\n\n成功率能通过以下提高：[GetPerk('majesty_perk').GetName(GetNullCharacter)]、[GetTrait('presenceadvanced').GetName(GetNullCharacter)]、[GetPerk('ironclad_command_perk').GetName(GetNullCharacter)]、和[GetPerk('as_below_so_above_perk').GetName(GetNullCharacter)]。\n\n如果对方有[GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)]、[GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)]、或血术法的木星之曲，成功概率将被降低。"
 scheme_interaction_tt_PODentrance_approved:0 "[GetScheme('PODentrance').GetTypeName][recipient.GetFirstName]。\n这将导致一场以外交能力对抗。\n如果成功，受害者将提升对你的好感。"
 PODENTRANCE_SUCCESS_DESC:0 "[TARGET_CHARACTER.GetShortUINamePossessive]对你的[opinion|E]将会增加！"
