 diablerize: "吸榨"
 diablerize_action: "吸榨"
 diablerize_interaction: "[Glossary('吸榨','game_concept_diablerie_desc')]#weak （计谋）#!"
 diablerize_desc: "我将[Glossary('吸榨','game_concept_diablerie_desc')][SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]，吞噬其的灵魂！"
 diablerize_desc_general: "$diablerize$是一种[hostile_scheme|E]，意图杀死目标[GetTrait('vampire').GetName( GetNullCharacter )]并吸干对方的血和灵魂。这是一种基于[intrigue|E]的[secret_scheme|E]，能够招揽[agents|E]。\n\n成功的$pod_diablerie$将导致[scheme_target|E][character_death_death|E]。\n\n成功保持秘密状态的一次谋杀将赋予[scheme_owner|E]一件谋杀$pod_diablerie$[secret|E]。\n\n被发现意图[Glossary('吸榨','game_concept_diablerie_desc')]，或成功吸榨某[GetTrait('vampire').GetName( GetNullCharacter )]，都是对大多数[GetTrait('vampire').GetName( GetNullCharacter )]信仰的严重[crime|E]。在$pod_diablerie$的第一个受害者之后也被称作“不调花”，这是[GetTrait('vampire').GetName( GetNullCharacter )]吸干另一个[GetTrait('vampire').GetName( GetNullCharacter )]的所有血液包括他们灵魂的过程。它允许[Glossary('吸榨者','game_concept_diablerie_desc')]获得[blood_potency|E]，甚至回溯[Glossary('世代','game_concept_vampgeneration_desc')]。这通常是以加强[GetTrait('vampire').GetName( GetNullCharacter )]的[Glossary('心兽','game_concept_beast_desc')]为代价。我们用失去[piety|E]等级来表示这一点。大多数[GetTrait('vampire').GetName( GetNullCharacter )]对#TOOLTIP:GAME_TRAIT,diablerist,[GetNullCharacter] #L 吸榨者#!#!有低好感度。"
 scheme_interaction_tt_diablerize_approved: "[Glossary('吸榨','game_concept_diablerie_desc')][recipient.GetFirstName].。"
