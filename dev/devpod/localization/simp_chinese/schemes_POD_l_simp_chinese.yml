 PODentrance: "迷人魅惑"
 PODentrance_action: "魅惑"
 POD_entrance_interaction: "魅惑#weak （计谋）#!"
 POD_entrance_interaction_desc: "通过威仪术$pod_discipline$，调用血液来魅惑一个生物喜欢你。"
 PODentrance_desc: "通过魅惑，我让[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]喜欢上了我！"
 PODentrance_desc_general: "$PODentrance$是一个[personal_scheme|E]，用使对方喜欢你。它通过[GetTrait('presence').GetName( GetNullCharacter )]$pod_discipline$的[GetPerk('entrancement_perk').GetName(GetNullCharacter)][perk|E]解锁。\n\n#X 与普通计谋不同，计谋本身的成功几率并不重要。计谋完成后，一场外交能力对抗将决定成功与否。#!\n\n成功率受[GetPerk('majesty_perk').GetName(GetNullCharacter)]、[GetTrait('presenceadvanced').GetName(GetNullCharacter)]及[GetPerk('ironclad_command_perk').GetName(GetNullCharacter)]增益。\n\n如果对方有[GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)]、[GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)]、或血术法的木星之曲，成功概率将被降低。"
 scheme_interaction_tt_PODentrance_approved: "[GetScheme('PODentrance').GetTypeName][recipient.GetFirstName]。\n这将导致一场以外交能力对抗。\n如果成功，受害者将提升对你的好感。"
 PODENTRANCE_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive]对你的[opinion|E]将会增加！"
 PODentrance_my_diplomacy: "你的外交能力：$VALUE|=+0$"
 PODentrance_my_rival: "你目标的能力：$VALUE|=+0$"
 POD_summon: "召唤"
 PODsummon_action: "召唤"
 POD_summon_interaction: "召唤#weak （计谋）#!"
 POD_summon_interaction_desc: "通过威仪术$pod_discipline$，调用鲜血来召唤一个存在至你的宫廷。"
 PODsummon_desc: "通过你神秘的威仪术使用，[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]会被召唤到你的宫廷。"
 PODsummon_desc_general: "$PODsummon$是一个[personal_scheme|E]，用来拉另一个角色到你的宫廷。这个计谋主要依据你的[diplomacy|E]，这不是[secret_scheme_single|E]且不能用[agents|E]。通过[GetTrait('presence').GetName( GetNullCharacter )]$pod_discipline$的[GetPerk('summon_perk').GetName(GetNullCharacter)][perk|E]会使其可用。\n\n#X 与普通计谋不同，计谋本身的成功几率并不重要。计谋完成后，一场外交能力加谋略能力的对抗将决定成功与否。成功则计谋继续进行，并有几率每月增加一点饥渴。失败则会终止计谋，并在 10 年内无法尝试召唤目标。也有可能大失败或大成功，大成功会使目标到达的时间缩短一半，而大失败则会让你在50年内无法尝试召唤目标。#!\n\n成功率受[GetPerk('majesty_perk').GetName(GetNullCharacter)]、[GetTrait('presenceadvanced').GetName(GetNullCharacter)]及[GetPerk('ironclad_command_perk').GetName(GetNullCharacter)]提升。\n\n如果对方有[GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)]、[GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)]、或血术法的木星之曲，成功概率将被降低。\n\n如果目标为其他领主服务，或者是他们的访客，其领主的个人计谋防御会增加召唤他们所需的时间。"
 scheme_interaction_tt_PODsummon_approved: "召唤[recipient.GetFirstName]。\n这将导致一场以你的外交能力加谋略能力与[recipient.GetHerHis]的外交能力加谋略能力之间的对抗。"
 PODSUMMON_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName]会被召唤到你所在之地！"
 PODsummon_my_diplomacy: "你的外交能力：$VALUE|=+0$"
 PODsummon_my_rival: "你目标的能力：$VALUE|=+0$"
