 bookmark_fae_jurata:0 "朱拉塔"
 bookmark_fae_jurata_desc:0 "An Odine worshiped as a pagan goddess by several coastal villages along the Baltic Sea, the growing faith in the One God worries her. The mortals float offerings across the waters, and in return the sea washes precious amber upon the shores. Some claim the amber is shards of her palace, while others say it comes from her tears. She has said to have once fallen in love in with a mortal fisherman who the thunder god, Perkūnas, then killed. Her court at the Amber Palace has windows that leads to every shore of the Baltic Sea. Autumn-kin changeling merchants find the palace especially useful, as do many Humanist scholars who reside within. The palace has many fae visitors seeking to use it as a means of quick travel, though Jurata requires all who visit to partake in her hospitality for one night before departing.  She makes a point of meeting her visitors at dusk when they enter, and keeps a close eye on the comings and goings through her realm. She remembers every face that passes through her palace, and quite a few find such information exceedingly valuable."
 bm_1230_fae_sub_inanimae:0 "元素妖"
 bm_1230_fae_sub_inanimae_desc:0 "元素妖是真妖精的表亲。虽然他们不是真正的元素之灵，但他们与元素有着密切的亲缘关系。每个元素妖都以一种特定的元素来塑造自己。\n\n在散断时期间，元素妖的各个门属凝聚成第一个缓慢帝国。这些国度之间的关系是乏味而复杂的，其政治以数十年为一代。在这段时间里，元素妖和凡人经常互动。一些人无视他们，而另一些人则享受他们的崇拜，允许他们塑造自己的锚，并成为第一位居者。在这段时间里，火焰帝国选择援助人类，把制造火焰的知识赠送给他们。这被大多数其他元素妖视为一种重大的背叛，因为它允许人类塑造和奴役周围的世界，导致了第一位马内坎的诞生。这导致了造化之战，岩石帝国试图征服或摧毁火焰帝国。"
 bm_1230_fae_sub_african:0 "非洲戚系"
 bm_1230_fae_sub_african_desc:0 "古梦之地的梦华区域是整个世界上最明亮和最强大的，由浸透在土壤中的千年之梦以及目前仍在做梦的人的充满活力的希望和恐惧所支持。从最孤立的部落到最繁忙的城市居民，凡人都在庆祝这无数的生活方式，即使他们在漫长的幻灭的黄昏中不断重塑自己和他们的传统。若逸抒能说有个家乡，那就是伊费之国。古埃及的一位术士建立了杰迪。雄心勃勃的四眼奎诺来自几内亚。"
