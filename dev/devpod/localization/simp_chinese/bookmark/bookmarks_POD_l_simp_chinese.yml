 bm_1230_warofprinces_sub_kueijin: "东方血族"
 bm_1230_warofprinces_sub_kueijin_desc: "东方血族在亚洲各地有着不同的称谓，他们并非真正的“吸血鬼”。虽然与西方该隐之子有所往来，但他们以心法和皇朝而非氏族为组织基础，并拥有完全不同的力量体系。\n蒙古人的崛起及其背后的吸血鬼支持者，使得原本稳定但停滞的五大皇朝陷入混乱。变革与机遇的时代已然来临。\n\n#bold 遵循你的心法之道，在皇朝倾覆之际坚守本心，终将云开雾散得道飞升！#!"
 bookmark_warofprinces_piyau: "披耶·帕永"
 bookmark_warofprinces_piyau_desc: "当东南亚在[akuma|E]信徒的侵蚀下分崩离析时，一位女性见证了幻象，极致的阴柔之力将万物淹没于血海之中。\n曾是丛林隐士的披耶集结了一群含恨重生的女子，誓要焚毁辜负她们的世界。凭借超凡魅力、扎实武学与骇人实力，披耶之名将从巴布亚到中国令人闻风丧胆。无论她是魔女降世还是救世先知，这场血涤之后，亚洲的夜晚将永不复旧。\n\n#bold 你的激情无边无际，你的意志摧枯拉朽。这世界要么臣服于你的真理，要么在你的征途中碾为齑粉！#!"
 bookmark_warofprinces_wang_kyu: "王珪"
 bookmark_warofprinces_wang_kyu_desc: "王珪生前曾是地方宗族长，多次图谋夺权却屡遭挫败，最终身首异处。化为东方血族后，他依然我行我素。\n趁着平壤因宗教叛乱失败遭焚毁的乱局，王珪迅速抓住机遇，自封为这座重镇的老祖，尽管这个显赫头衔尚未得到朝鲜青龙皇朝的承认。\n\n#bold 你深谙乱中取利之道。如今青龙皇朝式微，也或许正是夺回数个世纪前被剥夺之物的良机。#!"
 bookmark_warofprinces_soo_kyung_ahn: "安秀景"
 bookmark_warofprinces_soo_kyung_ahn_desc: "安秀景的故事版本繁多：大贤学/血的私生女、堕凡的女神、蛰伏的龙女……她自己亦难辨真假。但能从[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]携宝逃脱的经历，至少印证了部分传说。\n这位朝鲜老祖们敬重的外交能手，如今随着青龙皇朝危机加剧，许多人正观望她是否会为履历添上朝鲜之主的头衔。\n\n#bold 是借助人脉问鼎朝鲜？还是追寻身世之谜？你的下一章由你书写。#!"
 bookmark_warofprinces_wu_zetian: "武则天"
 bookmark_warofprinces_wu_zetian_desc: "中国唯一被承认的女帝本就是位意志如铁的女性，因此她逃离[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]成为东方血族毫不令人意外。作为如此显赫的新成员，她在黑夜之道上的修行被托付给了洛阳少林寺最杰出的导师们。\n迄今为止，武则天始终是位勤勉尽责的学徒。就连最冷漠的老祖都在密切关注她的进展，暗自思忖这位“天册金轮圣神皇帝”是否会在万鬼朝廷重现生前的传奇。\n\n#bold 你正在融入的这个新生社会对你虎视眈眈。或许该等待危机时刻再行动，毕竟你比谁都清楚，乱世方能出英雄……#!"
 bookmark_warofprinces_shou: "璹"
 bookmark_warofprinces_shou_desc: "这位南中国恶名昭彰的\"噬焰者\"，或许是当世最强大的[akuma|E]（崇魔者）。其势力远离五大皇朝核心区，所幸她更多以扭曲的导师姿态引导其他[akuma|E]，而非真正扩张自身势力。\n有人担心，随着皇朝的崩溃，这种小小的恩赐可能不再是真实的了……\n\n#bold 劫掠沿海、被村民奉为黑暗神祇固然有趣，但如果想为[Glossary('魔皇','podgloss.demonemperor')]打开[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]之门，你需要更直接的行动……#!"
 bookmark_warofprinces_tashimoto: "田本半古"
 bookmark_warofprinces_tashimoto_desc: "日本“鬼子”（即血族）中最负盛名的将军是个神秘人物。表面上看，他忠心耿耿，致力于维护日本不受大陆皇朝的支配，但关于他战术才能与惊人实力的真实来源却众说纷纭。\n迄今为止，半古都无需为其模糊不清的过往多做解释。然而一旦失败，各种尖锐的质疑很可能会让这位日本最强守护者丢掉职位。\n\n#bold 他们不知道的事就伤害不了他们。而你心知肚明的是，你所做的一切都是为了日本的利益。\n即便这些利益与统治家族并不一致。#!"
 bookmark_warofprinces_yukio: "幸雄"
 bookmark_warofprinces_yukio_desc: "幸雄是为数不多从[Glossary('艾玛·欧','podgloss.emmao')]恐怖的[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]逃脱的女性。怀着对[Glossary('阎魔王','podgloss.yamaking')]的刻骨仇恨，她投身日本暗杀大师黑様的残酷训练。\n虽重生不久，但她立志成为连恶魔折磨者都畏惧的利刃。\n\n#bold 黑様的训练失败即意味着死亡，但这正合你意。你会成为日本史上最强的忍者，然后亲手终结[Glossary('艾玛·欧','podgloss.emmao')]。#!"
 bookmark_warofprinces_ma_hai_lan: "马海兰"
 bookmark_warofprinces_ma_hai_lan_desc: "马海兰将军是中国血族学者中的异类。当众人对[Glossary('安答','podgloss.anda')]部族与邪魔威胁视而不见时，她坚信唯有铁血手段能挽救华夏皇朝。\n她已聚集年轻同僚，试图在为时已晚前唤醒腐朽体制。\n\n#bold 皇朝将倾！唯有你的意志与剑锋能阻挡混沌洪流。#!"
 bookmark_warofprinces_li_jue: "李傕"
 bookmark_warofprinces_li_jue_desc: "前世曾是军阀的李傕，如今是覆灭的玄武皇朝对抗[akuma|E]大军的最后屏障。\n年轻血族视他为英雄，但他深知此战之艰难。幸好，知难而退从来不是他的信条。\n\n#bold 你似乎总是被卷入时代变革的漩涡。但这一次，你至少站在了正义一方。虽然你觉得这并不会改变什么。#!"
 bookmark_warofprinces_sun_li: "孙离"
 bookmark_warofprinces_sun_li_desc: "作为孙武那次著名演武的牺牲品，孙离早已超越了当年谋害她之人。她不仅被公认为$pod_kueijin$中最杰出的军事家，甚至可能是古今第一兵家，她将不朽战法的艺术推至了前所未有的境界。\n虽世人皆盼能将这位名震天下的“祥瑞之剑”招至麾下，然孙离不为任何人效命，唯携满腔热忱云游四方，在传道授业间精进不休。\n\n#bold 随着凡人与不朽者的演变，战争亦随之进化。世间总有某个战场能让你汲取智慧。#!"
 pod_bookmark_warning_auh: "#X 该剧本因最新的地图扩展已禁用，请等待进一步更新#!"
 mokole_sub_bookmark: "黑暗时代：魔克拉"
 bm_1230_inquisitor_sub_mokole: "黑暗时代：魔克拉"
 bm_1230_inquisitor_sub_mokole_desc: "那令人敬畏且尊贵的蜥蜴王曾是地球上占主导地位的变形族裔。然而，那个时代早已远去，他们几乎被狼人屠戮殆尽，以至于退居隐蔽之处，肩负起成为盖亚长久记忆的使命。\n\n自那以后，数个源流应运而生，适应了各自的地域环境以及随着时间出现的鳄鱼和短吻鳄新品种。因此，更年轻的一代正在崛起，他们怀揣着更多雄心与决心，要在世界的故事中书写自己的篇章。\n\n#bold 凭借自世界诞生之初传承下来的知识以及你们族裔的强大力量，是时候开创魔克拉领导的新纪元了。#!"
 bookmark_mokole_mokole_mbembe: "魔克拉-姆边贝"
 bookmark_mokole_mokole_mbembe_desc: "或许是仍在活动的存在之中最为古老的一位，魔克拉-姆边贝是在恐龙诸王纪元落幕之后，诞生的第一位魔克拉。\n\n为了守护魔克拉的丛林家园，他以致命的疫病诸灵布下结界来保护人民。他亲眼见证了第一城，也看着埃及、苏美尔、罗马相继崛起又崩毁；并与其兽嫡配偶们孕育出无数后嗣。他教导自己的血脉必须明智——但同时也必须成为战士，因为玉母的敌人，终究不可能永远只靠智谋来化解。\n\n如同所有与他同样古老的存在，魔克拉-姆边贝并不以他者所理解的时间尺度来思考，只在少数关键时刻才会起身出手。然而一旦他行动，世界将再度瞥见远古恐龙诸王昔日的余光。\n\n#bold 行动的时刻已然到来——你已看见征兆。让世界再次记起，谁才是这片大地太初的统治者。 #!"
 bookmark_mokole_swims_mbembe: "姆边贝浪痕游弋者"
 bookmark_mokole_swims_mbembe_desc: "果决的精神与旺盛的好奇心，使姆边贝浪痕游弋者在姆边贝众多子嗣之中显得独树一帜。曾经，他作为非洲诸化兽族裔与其父族群之间的中间人；而如今，他已建立了属于自己的族群。\n\n当其他魔克拉龙巢封闭自守、逐渐凋零之际，姆边贝浪痕游弋者的族群却展现出非凡的潜力——这在很大程度上，正得益于他在同族之中罕见的才能。\n\n#bold 你对父亲怀有深切的敬意，但魔克拉必须顺应时代变迁并培养盟友。如此重要使命，你正是不二人选。 #!"
 bookmark_mokole_sands: "沙末王"
 bookmark_mokole_sands_desc: "尽管大多数魔克拉性情平和、沉于冥思，沙末王却是彻头彻尾的战士。坦白说，他其实是别无选择。\n\n正如其自选名字所示，沙末王率领着其黑滨之巢，活在严峻的当下——赛特之子已战胜了$glossary_osirian_league$。身为一名阴郁易怒的将领，沙末王已与本可成为盟友的势力渐行渐远，导​​致这场艰难战争似乎只能孤身承担。\n\n#bold 只有你，才能为索贝克之子千年来所遭受卑污赛特信徒的屈辱复仇。你不会退却——现在不会，将来亦然。 #!"
 bookmark_mokole_hides: "大隐于市"
 bookmark_mokole_hides_desc: "印度最后一个龙巢早在多年前便已毁灭。作为唯一的幸存者，大隐于市将过去的恐怖一并背负至今。这名年轻的魔克拉从未真正认同过去族群所推崇的荣耀与名誉——他一直都是个异类。\n\n以魔克拉的标准而言他的行事手段极致命，也极不名誉。但当盖亚隐匿的愤怒降临，夜之生物终将学会畏惧自己的影子。\n\n#bold 你是印度最后的魔克拉。你会如其他族人般倒下，还是踏入阴影，为其复仇？塔卡什必须被净化——无论用什么方式。 #!"
 bookmark_mokole_red_sky: "赤天待时"
 bookmark_mokole_red_sky_desc: "一名年轻的(以其族群的标准)魔克拉，赤天待时正徘徊于她与生俱来的固执，以及逐渐渗入其存在的现实之间。\n\n她天赋异禀，能深入族群的集体记忆，并从中看见那个辉煌的远古时代——在她眼中，那不是逝去的历史，而是未来必须重现的预兆及奋斗的目标。然而，她初尝现实却苦涩不堪：印度的超自然族群对她的构想兴趣缺缺，就连她的同族，也更倾向于沉思静观的人生。\n\n被实际经历磨炼，赤天待时将近几十年投入于更学术的追求之中。但她年少时的火焰尚未熄灭——只要一个微小的契机，她便会再次追逐那些宏大的理想。\n\n#bold 正确的时刻或许即将到来。赤红的天空，终将结束其等待。 #!"
 bookmark_mokole_hao_zhi: "颢郅"
 bookmark_mokole_hao_zhi_desc: "出身显贵，颢郅自幼便接受了杰出的全面教育。然而，他此生所获得的最大恩赐并非财富或学识，而是原始觉醒。身为一名魔克拉，他将人生的大半时光沉浸于龙梦之中。正因如此，其他魔克拉揶揄其为\"卧龙\"。\n\n他从未将此视为嘲讽。在他所有的师长之中，最伟大的一位，乃是古中国的军事家诸葛亮——同样被世人称为\"卧龙\"。这个称号于他而言是一种荣耀，正因其善于重演古代兵法来碾压当前的敌人。\n\n#bold 你手握无穷的过往知识与卓绝的兵法武略。西方的征途，将由你揭开序幕。#!"
 bm_1230_inquisitor_sub_hengeyokai: "兽妖"
 bm_1230_inquisitor_sub_hengeyokai_desc: "亚洲的化形者是这些地区的本土化兽族裔。与西方由狼人主宰的世界不同，兽妖、变化妖怪以兽之王庭为组织形态，在其中彼此协作，维系着一种（相对）和谐的共存秩序。他们与其他本土超自然存在之间的关系，也比人们想象中要温和得多；尽管冲突依然存在，但东方化形者与东方血族或士坐而论史、辩析哲学，并不是什么稀罕之事。\n\n然而，这种世界观并非总能带来益处。部分曾经强盛无比的兽之王庭，如今正因宿敌的侵蚀而日渐衰弱，或遭到崇魔者的威胁。\n\n#bold 当亚洲的超自然世界坠入一个充满不确定性的新时代，你必须确保你的王庭，能够在即将到来的动荡岁月中存续下去。#!"
 bookmark_hengeyokai_tong_long: "唐龙华"
 bookmark_hengeyokai_tong_long_desc: "\"北方哲龙\"是中国超自然种中最著名的学者之一。曾是黄帝皇朝$pod_kueijin$的朋友，唐龙华最近却一直保持距离。显然是因为目睹了统治饿殍的道德沦丧。\n\n他打算对此事采取什么行动，目前还不得而知。\n\n#bold 你已看见征兆。黄帝皇朝的时代即将结束。你希望英明的智者们能领路至下一时代。否则，你可能不得不介入。 #!"
 bookmark_hengeyokai_nongkhai: "廊开"
 bookmark_hengeyokai_nongkhai_desc: "东南亚的隐居魔克拉——廊开，是在被朱雀皇廷的$pod_kueijin$从[akuma|E]手中救下之后，才真正明白外面世界的价值。\n\n看着黑暗的浪潮正于丛林边缘悄然涌起，他依旧骄傲，但已下定决心不再犯之前措手不及的错误。如果要阻止这场即将到来的浩劫，必须亲自团结那些尚未堕落的超自然存在——那便如此吧。\n\n#bold 在踏入更广阔的超自然政治世界时，迎接你的是残酷的现实；但如今，你已理解盟友的真正价值。是时候让丛林再度想起，为何在远古之时，魔克拉曾是众族之王。 #!"
 bookmark_hengeyokai_hunger: "奎尔之饥"
 bookmark_hengeyokai_hunger_desc: "虽然诸王纪元对多数仍承载着盖亚记忆的存在而言，只是萦绕于梦境中的残影；\n但对其中一位而言，使其记得那个时代的并非龙梦，而是亲身的回忆。\n在遥远得无法计数的远古年代——天工事件之前，哺乳类仍只是必须靠偷蛋才能苟活的恼人小兽之时，一头怀抱野心的沧龙，向那个时代的[Glossary('阎魔王','podgloss.yamaking')]上演了一场滔天大罪。它屠杀了无数罗基阿，并吞噬了其不朽。然而，逆阳的赤眼焚毁了那个世界；纪元之轮转动，哺乳类的时代取代了诸王纪元。\n但那名崇魔者仍然沉睡于最深的海沟之中，直到一件来自那个失落年代的遗物将其唤醒，并为其指明方向。\n\n如今，藉由龙梦也只知其名为奎尔之饥，饥者已再次回到这个世界，在盖亚界域和[UmbraGlossaryLocalized('yomi_wan','万狱')]的海洋中潜行猎杀。那些曾经声讨她罪名的同类，其后裔如今只配扮演卑微的小王——他们早已忘却自己曾拥有的尊贵。而那些直立行走、没有尾巴的卑劣宵小却戴上了王冠。他们忘记了恐惧。他们都对这个世界真正的诸王犯下了罪。他们必须再次跪下。他们必须再次恐惧。他们必须再次认清——\n自己从来就不在食物链的顶端。海洋将夺回一切，而那些该死的罪人，将亲身见识，究竟是哪些冥府力量，才配得上统治这个世界。\n\n#bold 对你同族的龙人而言，她是潜伏于记忆中的梦魇；也是地狱深渊的猎食之兽。饥者再度展开狩猎，立誓要让人类想起——在远古年代，其祖先只是供真正大地主宰享用的血肉。让他们记住，谁才真正位于食物链之巅，把他们全部变成鱼食。 #!"
 bookmark_hengeyokai_little: "厘特尔"
 bookmark_hengeyokai_little_desc: "在最后一支马来可汗势力遭到歼灭后，东南亚的可汗们恐慌四散。可汗虎族最后的长老未能完成阻止恶鬼势力的使命，而在他殒落之后，马来可汗转而拥立其遗孀为新的领袖。\n\n厘特尔的一生，迄今只由挣扎、丧亲与磨难所构成，如今正站在命运的十字路口。她对亡夫贵牙的哀痛尚未平息，但与来自北方的新兴力量的密会，却为她揭示了另一条可能的道路。恶鬼仍在血河中起舞，而玉母为其身躯遭到玷污悲泣不已——行动的时刻，已然迫在眉睫。\n\n厘特尔面前有两条道路。其一，是不动如山：内缩防守，将族群的猎场化为抵御恶鬼的堡垒。其二，是主动出击：踏上征途，将战火带向恶鬼本身。\n\n然而，可汗们曾经失败过，而族群的数量至今仍在恢复之中。这场战争中，她自己的女儿也将披甲上阵；而她早已立誓，不再失去任何一位家人。不过北方的万鬼也正走出其隐居之地——若厘特尔开始征途，她或许不必孤军奋战。\n\n#bold 等待着马来西亚可汗虎族的命运是？他们是否能一如既往，在风暴中屹立不倒？\n抑或由她率领，发动一场新的战争，歼灭那些掠夺玉母的玷污异兽？她会重蹈亡夫的覆辙？还是能建立一个足以与其印度表亲媲美的新可汗国度？ #!"
 bookmark_hengeyokai_towers: "凌驾诸王的众塔"
 bookmark_hengeyokai_towers_desc: "这名科摩多群岛的雄心勃勃年轻魔克拉，是一条与众不同的龙。她拒绝沉溺于沉思，也不愿将自己沉入族群的集体记忆深眠之中——凌驾诸王的众塔更渴望证明自己足以成为远古众龙的真正继承者。\n\n这样的追求，虽然是为了改善族人的处境，但也掺杂着对自我虚荣心的满足——但不论如何，其心意仍值得肯定。\n\n#bold 过去的教诲最好被留在过去。对往昔的执迷，正是你族群衰败的根源。唯有你的青春活力与鸿大野心，才能为科摩多群岛开辟前路。#!"
 bookmark_hengeyokai_wolaru: "沃拉鲁"
 bookmark_hengeyokai_wolaru_desc: "火之地的女王极少离开她的班达扬领地。她欢迎任何守护盖亚母亲者，并毫不留情地诛杀那些非前者的——一种简单，却极为有效的生存之道。\n\n然而，不祥的征兆与异象将她引至巴布亚、她疆域的边缘，迫使她观察外界的动向，并思索这种防御的姿态，未来是否仍是最有效的选择。\n\n#bold 在你的注视之下，班达扬牢不可破。然而，明智的统治者从不低估未来的威胁——而你已看见，许多隐患正于汪洋彼岸蓬勃滋长……#!"
 bookmark_hengeyokai_munekane: "宗兼"
 bookmark_hengeyokai_munekane_desc: "当其他兽妖忙着交友结盟时，孤身一人的宗兼却隐居在自己的神殿中。这名魔克拉认为与他人交往纯属浪费时间，因此毕生致力于掌控自己的身体。\n\n他的家乡既有不死者也有八犬肆虐，这位武僧有很多敌人需要对付。\n\n#bold 怒嚎末日终将到来，你会终结它还是被其终结？ #!兽妖、"
 bookmark_hengeyokai_masamune: "政宗"
 bookmark_hengeyokai_masamune_desc: "传说中的八犬，也是首批迁移至日本的狼人。政宗将大部分青春岁月用在锻造并运用各式刀剑上。他的生涯最终打造了一把威力强大的大太刀，他用这把刀取得了令人惊畏的战果。\n\n被发妻与六名子女围绕，政宗始终坚定不移地捍卫家族的利益。然而，岁月终究追上了他，守护家族的重任如今落在了他的子女身上。\n\n#bold 时不可待，你会在家中逐渐凋零吗？还是你会成为最后神风中的一道惊雷？ #!"
 bookmark_warofprinces_folch: "福尔奇"
 bookmark_warofprinces_folch_desc: "一名倒楣被卷入法兰西吸血鬼阴谋的荷兰佣兵，但也足够精明，得以在其中活下来。福尔奇一次又一次地被那些\"高人一等\"的存在利用并抛弃。\n\n然而，他终究从这些经历中带走了两样东西：身为[ghoul|E]的不死之身，以及对整个吸血鬼族群刻骨铭心的怨恨。\n在多年历练的磨砺下，福尔奇如今带领着他的佣兵团，一面对\"夜之主人\"们虚与委蛇，一面竭尽所能地从他们身上榨取可得的一切。\n\n\n#bold 你从不沉溺于宏大的妄想。你存在的目的只有一个——活下去。希望甚至比那些不朽的怪物活得更久，并且让他们明白：他们豢养的攻击犬，确实长着一口利齿。 #!"
 bm_1230_warofprinces_sub_ghouls: "血仆"
 bm_1230_warofprinces_sub_ghouls_desc: "给几乎任何生物喂一点吸血鬼的血，它就能变成血仆，至少暂时会是。血仆是无处不在的仆人，很容易被创造出来，并被严重虐待。\n然而，有些血仆开辟了自己的道路。从几千年来一直以上古者精血为食、尊长被毁灭或其他一些巧合；让这些曾经的吸血鬼仆人有机会找到自己的命运。\n\n#bold 从仆人到主人？#!"
 bookmark_warofprinces_prias: "帕里斯"
 bookmark_warofprinces_prias_desc: "帕里斯曾经是小亚细亚一座城市的统治者，以其帅气而闻名。有一次，他偶然发现一个美丽的女人和她的女仆躲在一个山洞里。那是海伦，当时还是一个凡人，她刚从米诺斯国王那里逃婚。这对璧人一见倾心，然而萌发的爱恋却因米诺斯对少女的[Glossary('初拥','game_concept_Embrace_desc')]而被骤然斩断。\n帕里斯帮助她杀死了他，此后他一直以[ghoul|E]的身份在她身边，因为他本人拒绝成为一位吸血鬼。然而，海伦并不缺少仇敌，而帕里斯的忠诚、勇敢和不朽的爱，直到今夜仍是海伦最珍视的瑰宝。\n\n#bold 你已寻得至纯至真的爱，你必须不顾前方的艰难险阻，努力让它开花结果。#!"
 bookmark_warofprinces_haqim: "哈基姆"
 bookmark_warofprinces_haqim_desc: "这名[ghoul|E]的本名早已湮没无存。他曾是阿刹迈战士的门徒，在氏族与巴力的战争时追随左右。当其主人遭到毁灭时，血誓反噬于他，彻底击碎了他的心智，迫使他逃入荒漠。他者皆以为这名[ghoul|E]已与其主人一同罹难。\n\n然而，他活了下来。他没有返回$pod_clan$，而是运用自身的恩赐与经验，伏击并猎杀数名$pod_cainites$，以此平息自己对$pod_vitae$的渴望。\n\n当他听闻一处名为Aluh Amut（惩罚之巢）的所在，以及那里聚集的一个凡人刺客教派时，他前往了那里，并从他们手中接过了领导的权柄。随着时日推移，这名[ghoul|E]自称为哈基姆——阿刹迈自己的[Glossary('上古耆宿','game_concept_antediluvian_desc')]——作为对昔日主人们的一场黑暗嘲弄。\n\n#bold 你已收获了阿刹迈的尊重。现在，你还要收获畏惧。 #!"
 bookmark_warofprinces_layla: "莱拉"
 bookmark_warofprinces_layla_desc: "莱拉是一个笼罩于谜团与传说中的存在。传言她本身便是莉莉丝的女儿。若如此，她的永生便与其他血族截然不同，而她对背叛其黑暗之母的$pod_cainites$，怀有刻骨的仇恨。\n\n另一些线索则指向另一种可能——她曾饮下莉莉丝的血。也许是亲自，也许是透过某位古老而强大的中介者。这一推测，因她与神秘的塔尔玛埃拉之间若即若离的关系而更显可信；该教派由诸多强大长老血族构成，其中甚至有人直接崇拜莉莉丝本身。\n\n无论真相为何，莱拉都是一个极度强大且危险的存在——或许，她早已不只是单纯的[ghoul|E]。许多人在私下揣测：她真正的终极目的，究竟是什么？\n\n#bold 黑暗之母——你的黑暗之母——正在对你低语。你不会令她失望。 #!"
 bookmark_warofprinces_ferox: "费罗克斯"
 bookmark_warofprinces_ferox_desc: "布狄卡之子以近乎狂热的勇武守护着他的母亲，甚至赢得了那些亲手粉碎叛乱的罗马吸血鬼的敬意。尽管沦为一名服侍[ghoul|E]，但费罗克斯始终未舍弃自身的荣誉准则，这反倒使其成为征服者眼中珍贵的资产。\n\n基督信仰的诞生，成为费罗克斯生命中的关键转折。当他全心拥抱这份信仰时，他新燃起的热忱，却被主人们巧妙利用成为渗透教会的工具，借此达成其各种目的。\n\n虽然他依然维持忠诚，费罗克斯却越来越把他的主人们视作怪物了。\n\n#bold 你的反叛精神尚未消亡。在炙热信仰的支撑下，你可以成为上帝的刑罚，惩戒那些腐化堕落的该隐之子。 #!"
 bookmark_warofprinces_delizbieta: "黛丽兹别塔"
 bookmark_warofprinces_delizbieta_desc: "黛丽兹别塔是罗姆人托雷努家族中一名年轻的[ghoul|E]，她敏锐的感官与天生的魔法天赋，使她成为族群中不可忽视的资产。\n\n在吸血鬼保护者伊兹多尔·托雷努身旁，她一路追随他的脚步，协助他为家族寻找一处安全的新居所。然而，她心中的不安正在加深——伊兹多尔似乎隐藏着并非全然出于利他的动机。\n\n而她最近短暂接触那位强大的存在——突伽·辛，更让她开始质疑：伊兹多尔的忠诚，究竟是献给族人，还是只献给他自己？\n\n#bold 慎重思索你的处境吧。通往族人安身之地的道路，既狭窄，又陡峭。 #!"
 bookmark_inquisitor_jeanne: "让娜·鲁莱"
 bookmark_inquisitor_jeanne_desc: " #R This character is landless and thus needs the Roads to Power DLC to be playable!#!\n\n Inspired by Leopold von Murnau's apocalyptic fervor and crusading spirit, Jeanne Roullet -a French visionary- began recruiting women to the same cause as Leopold's. Jeanne's faith is strong, she and her few followers battle the armies of the Enemy with as much dedication and might as the followers of Leopold. Unfortunately, their cause is frequently overlooked, resulting in Jeanne's group being simply acknowledged by the Church and the Inquisition instead of fully endorsed and thus, so far at least, lacking a power base of their own.\n\n#bold It doesn't matter if Rome helps you or not. Your vision was clear and your cause righteous. You must triumph no matter the trials ahead.#!"
 bookmark_inquisitor_belphegor: "贝尔芬格"
 bookmark_inquisitor_belphegor_desc: " #R This character is landless and thus needs the Roads to Power DLC to be playable!#!\n\n Tasked by Lucifer himself to understand the limits of humanity during the Fall, Belphegor enjoyed her work to the fullest. It took her a lot of trials and errors, and many broken test subjects, but she managed to lay the groundwork for the creation of the half-demons later known as Nephilim. Her reward was a palace of pleasure and horrors and she lazily ruled here until the Heavenly Host struck her down.\nSummoned by careless Hebrew infernalists centuries ago, she quickly set up to restart her beloved work.\n\n#bold Those funny mortals have learned a few tricks since the Fall. You will have to be more careful when thoroughly testing the new limits of their frail bodies.#!"