 bookmark_warofprinces_thrax:0 "色雷克斯"
 bookmark_warofprinces_thrax_desc:0 "Thrax was a Brujah residing in Rome during the Punic Wars. Her and all her brethren were submitted to various indignities and she choose to leave. During her travels, she encountered the Gnostic thought and found their theology a solace for her tired soul.\nNow she is back in Rome, to test her conviction against the might of the Ventrue and against Camilla himself, the bane of Carthage. The Eternal Consul seems more amused than concerned with her so far, but this might change.\n\n#bold You will make Camilla respect you or fear you. Once Rome is yours, you will lead [Clan|E] Brujah to a new, pure, beginning.#!"
 bookmark_warofprinces_caelestius:0 "色勒斯丟"
 bookmark_warofprinces_caelestius_desc:0 "No one would describe Caelestius as a quiet or timid man. An argumentative monk in his youth, he soon fell under the sway of the heretic Pelagius and followed him as his disciple.\nTheir heresy took root in Carthage but was soon under fire by the local clerical authorities and Caelestius refused to recant. It was during this trial that he attracted the attention of a local Brujah and was [Embrace|E]d.\nCaelestius quickly adapted to his new condition and merged his Pelagian leaning with the Noddist lore of the Cainites. He then boldly declared that he would travel to the Pope, present his theories and receive the Papal blessing. This mad plan that would result in the ultimate breach of the Masquerade has been foiled time and time again by the other Cainites, but the deluded heretic has never been caught yet.\n\n#bold Ignore the petty minds that want to hinder you, only the Pope can vindicate your genius! #!"
 bookmark_warofprinces_constancia:0 "康斯坦西娅"
 bookmark_warofprinces_constancia_desc:0 "Constancia is the Priestess of Bones and the Matron of the Erciyes Temple, the Cappadocian [Clan|E] spiritual center and home to the [antediluvian|E] Cappadocius himself.\nA seasoned traveler, Constancia knows first hand about many of the internal threats plaguing her clan, from the ambitious Giovanni to the deceitful Lazarenes. With Japhet's hands tied by Cappadocius, she takes it upon herself to save her undead family from some of the nightmarish fates she envisioned in her prophecies.\n\n#bold Only you see the dreadful future that await the Cappadocians, and only you can change it.#!"
 bookmark_warofprinces_lucretia:0 "卢克丽霞·乔凡尼"
 bookmark_warofprinces_lucretia_desc:0 "Born as a troubled child, Lucretia was confined to an asylum early in her youth because of the voices she heard. Nonetheless, she displayed a talent for occultism that made her a sought after prize for the newly vampiric Giovanni family. Claudius nearly secured her [Embrace|E] before Ambrogino won the argument and was awarded Lucretia as his own childe.\nFinally free, the young vampire quickly proved to be a tremendous asset to Ambrogino's occult pursuits but her zeal and drive hide a tortured mind sometimes wishing for death.\n\n#bold Ambrogino's quests are your own, and are perhaps the only way to stave the voices for a little while longer.#!"
 bookmark_warofprinces_guilelmo:0 "吉勒摩·阿里普兰多"
 bookmark_warofprinces_guilelmo_desc:0 "Narses, Prince of Venice and Archbishop of Nod, embraced Guilelmo for his obvious skills as a diplomat and negotiator. Consequently, he was the \"public face\" for the prince of Venice.\nIn the aftermath of the Fourth Crusade, he began to suspect that Narses' dedication to the Church of Caine was not sincere. Allying with Nikita of Sredetz, he called a Court of Blood and was given the right to [diablerize|E] his [Sire|E]. Since then, he has smoothly taken the reins of power left behind by Narses, and has for primary concern to exploit the new Venetian territory in the crumbling Byzantine Empire. Unfortunately, that's making him blind to closer threats, as the rising Inquisition and Giovanni family both greedily eyes the weakened power structure of Vampiric Venice.\n\n#bold You might be the last true believer of the Church of Caine. Will your faith be enough in the trying times ahead?#!"
 bookmark_warofprinces_fatimaallama:0 "法蒂玛·拉玛"
 bookmark_warofprinces_fatimaallama_desc:0 "Fatimah met her future [Sire|E] in Tunis, where he watched her from the shadows as she grew into womanhood and fell in love with her. When Sharif moved south, he took Fatimah with him. Since then, the gifted childe has learned a lot about her new condition and vampiric politics. Noticed by the leadership of [Clan|E] Lasombra, Fatimah has recently been assigned her first mission : securing Mogadishu for her [Clan|E]. A difficult task, as many or her clanmates have failed in claiming the city of pearls.\n\n#bold This is your first real assignment and it is a prestigious one. Demonstrate that the potential seen in you was indeed real.#!"
 bookmark_warofprinces_darshuf:0 "达舒夫"
 bookmark_warofprinces_darshuf_desc:0 "Darshuf's history is written in treachery. He betrayed his [Sire|E] and took Damascus from her during the rise of Islam then fell to the infernalist Annazir's insidious whispers. Darshuf knows that his soul is long lost and that Damascus is lost with it as he doesn't have the power or the will to oppose the Baali anymore.\nThere is one last thing that Darshuf wants to do before falling into oblivion and that is saving his dear childe Mannal. He has been protecting her so far from the horrors of Damascus and he is determined to make sure that this last ray of light isn't extinguished.\n\n#bold You, your soul and your city are lost. But Mannal isn't. Come what may, you must save her from the horrors you have fallen into.#!"
 bookmark_warofprinces_shamit:0 "撒米亚·伊本·亚西尔"
 bookmark_warofprinces_shamit_desc:0 "Recently empowered by the disappearance of his [Sire|E], Abd al-Haqq, Shamit is tasting sweet freedom after centuries of blood bond. And it tastes good. So much that he has no intention of relinquishing his Princedom once his [Sire|E] returns.\nAn extraordinarily capable administrator, he is capitalizing on the city's resources and busy harbor to make a place for himself.\nEach night without his [Sire|E] is one more night where Shamit consolidates his position and affirms his newfound independence with bravado.\n\n#bold Aden is yours. The Yemen is soon to be yours. You will never be curtailed again.#!"
 bookmark_warofprinces_nikita:0 "斯雷代茨的尼基塔"
 bookmark_warofprinces_nikita_desc:0 "Outwardly, Nikita of Sredetz is the zealous Archbishop of the Church of Caine. However, in truth Nikita is long dead.\nKilled then impersonated by Dracon, a powerful Methuselah hell bent on revenge against the Church for their part in the fall of Constantinople, \"Nikita\" is now undermining the organization from the inside. Once he is done, Dracon might shed this disguise and walk the Carpathians once more. No one, perhaps not even himself, knows what his next goal will be at this point.\n\n#bold Everything change and decay. It is time for the hated Church of Caine to feel that truth.#!"
 bookmark_warofprinces_kartarirya:0 "迦𫄨里璃"
 bookmark_warofprinces_kartarirya_desc:0 "In life, Kartarirya was a bloodthirsty warrior renowned for his inhumanity and aggressiveness, for which he was ultimately [Embrace|E]d.\nHis [Sire|E] allowed the warrior Kartarirya to act upon his whims. As to be expected from a multi-armed methuselah who considers all of India to be its personal hunting grounds, Kartarirya wages constant wars from his hideout in Sri Lanka, using horrible fleshcrafted ghouls as his war machines and terror as his main psychological weapon.\n\n#bold War and bloody conquest are your only purposes and India will drown in gore when you are done with it.#!"
 bookmark_warofprinces_vencel:0 "文策尔·里卡德"
 bookmark_warofprinces_vencel_desc:0 "The product of a Christian knightly education, Vencel came to Budapest when King Geza invited a contingent of Bavarian knights to become his personal bodyguard. [Embraced|E] by Bulscu as reward for his excellent service, Vencel is most concerned with retaining his position, maximizing his mercantile interests, and keeping the peace in a city that could quickly become a battleground.\nFearful of Bulscu's descent into depravity, then [torpor|E], Vencel is still a man of honor even in undeath and respect his [Sire|E] for the man he once was. He is now trying to maintain a balance between protecting him from his many enemies and fairly ruling over his city.\n\n#bold You have two duties, Budapest and Bulscu, and you intent on fulfilling them both.#!"
 bookmark_warofprinces_fabrizio:0 "法布里齐奥·乌尔菲拉"
 bookmark_warofprinces_fabrizio_desc:0 "Fabrizio Ulfila has been around since the first nights of Christianity in Ancient Rome. In life, he was a disciple of Bishop Eusebius of Nicomedia, and like his teacher, Ulfila had been a defender of the Arian heresy. In death, he became one of the most influential members of the Ecclesiasticals, the faction of Ventrue that believed that power lay in the Church.\nEven though the Church has been a battlefield for [cainite|E] conspiracies for centuries, Fabrizio has survived them all and come out on top. His long term goal is to expand his influence in the Church and Italy as much as possible, a prospect suddenly made difficult by Camilla's awakening.\n\n#bold Reassert your control over Rome and use the Christianity's power for your own gain, \"Cardinal\" Ulfila! #!"
 bookmark_warofprinces_enkara:0 "恩卡拉"
 bookmark_warofprinces_enkara_desc:0 "Born as a slave girl in Seleucia-on-Tigris, Enkara was chosen by Izhim Thrice-Blessed, a renowned Assamite of the Warrior Caste. He named her 'Enkara', which meant 'weapon' in a now forgotten Sumerian language, and spent eight centuries forging her into one.\nBy the end of the Second Baali War she was already a respected elder in her own right, and after her sire disappeared while spearheading a military operation at Chorazin, she personally led a detachment of fifteen Assamite warriors and thirty ghouls to the fortress.\nShe was able to prevent the demon's awakening but had to see her beloved Izhim being absorbed by it beforehand. Since then, she is desperately looking for a way to save him.\n\n#bold Izhim gave you everything. It is time to return the favor.#!"
 bookmark_warofprinces_farnaza:0 "法纳扎"
 bookmark_warofprinces_farnaza_desc:0 "The Queen of the White Pearl is an estranged ruler left to her own devices. The devout Zoroastrian, having seized control of Mogadishu by a combination of luck and her rivals' mistakes, see the ongoing wave of Islam immigrants to the city with a cautious eye.\nAlamut and the Banu Haqim leadership aren't watching her, both as a sign of confidence in her abilities and as a pragmatic choice due to the distances involved. As such, all blame will fall on her if she fails. But so far, Farnaza has walked this tight rope with great skill, using Muslims against Native African and her rivals against each other.\n\n#bold All is going well in Mogadishu. You wonder if you haven't lowered your guard down too much recently. Time will tell.#!"
 bookmark_warofprinces_ikkenai:0 "伊奇奈"
 bookmark_warofprinces_ikkenai_desc:0 "Ikkenai was born in a Saxon tribe and earned the [Embrace|E] for her fierce devotion to its Gangrel protector. She became a fearsome guardian for her people and managed to save them from the Romans but, centuries later, Charlemagne and his supernatural allies proved too strong.\nEnraged at the loss of her people, she retaliated by blindly attacking monasteries until she realized that it was too little too late. Ikkenai is now trying to focus her efforts, targeting her old home that has now become the bustling city of Aachen. To most German vampires, she is a relic of a bygone era with little power but some civilization hating wood dwellers are looking at her progress with interest...\n\n#bold You will take back your home, alone if you must. Your tribe cries for vengeance.#!"
 bookmark_warofprinces_arnulfgangrel:0 "阿努尔夫"
 bookmark_warofprinces_arnulfgangrel_desc:0 "Arnulf is a legend among Gangrel. He is the ultimate foe of civilization, the scourge that never ends and will one day return the world to its primal roots. Arnulf rode with the Huns to destroy Rome, with the Magyars to plunder Hungary and with the Mongols to burn the steppes.\nHe [Embraced|E] many of the greatest Gangrel and mentored even more and he is always followed by eager young Ferals wanting to make a name for themselves.\nRecently returning from a campaign in Transylvania against the Tremere, Arnulf has answered the call for pagan unity of the young Qarakh though he is so far unimpressed by the man himself.\n\n#bold This \"Ferals of Livonia\" alliance pleases you but you are doubtful that Qarakh has what it takes to lead. You know the whole [Clan|E] would answer if you called. Perhaps it's the time.#!"
 bookmark_warofprinces_inanna:0 "伊南娜"
 bookmark_warofprinces_inanna_desc:0 "Inanna was born in Nineveh and taken as the lover and childe of the vampire who posed as the city god. When Angiwar came to the city, he was disgusted by the blood rites of the Malkavians and Inanna's [Sire|E] turned against him. In the clash, the temple was destroyed and only Inanna survived. Enraged and saddened by the loss of her lover, she swore vengeance against the stranger who had come to her city and brought them nothing but misery.\nShe later resurfaced as one of the supporters of the Roman prince Camilla against Carthage. Fighting fiercely, she earned several privileges from the Eternal Senate, including the right to [diablerize|E] her foes. With her newfound power, she confronted Angiwar several more times but never quite achieved victory.\n\n#bold Your single minded obsession to kill your nemesis will be your strength.#!"
 bookmark_warofprinces_midian:0 "米甸"
 bookmark_warofprinces_midian_desc:0 "Midian came to Hamburg with the Saxons around the 9th century. He soon begin to cultivate his relationship with the Church and entered in a rivalry with the nascent merchant class and its undead backer. Taking the advantage in this shadowy battle, Midian was able to declare himself Prince in 1054. Then the Church's power dwindled leaving Midian in a state of bitter, somber despair.\nMidian's mind finally broke when he realized that he had no power left anymore. And so, his atrocities began. He started [diablerizing|E] any [cainite|E] entering 'his' city, incorporating their souls into the hive of his fractured mind, thus creating the court he never had.\n\n#bold You sit alone in the vast reception hall of your tower, brooding and holding elaborate conversations with a host of courtiers who exist only in your imagination... or perhaps they still pulse in your blood.#!"
 bookmark_warofprinces_angiwar:0 "安吉瓦"
 bookmark_warofprinces_angiwar_desc:0 "One of the original inhabitants of the Main river valley, a young Angiwar found a maiden crying tears of blood by the water. He listened to her story and did not reject her. Moved by his sincerity and honesty, the maiden [Embraced|E] him.\nHe then become a mentor and brotherly figure to many young Nosferatu, including those seeking Golconda, something he was keen on himself.\nAngiwar then turned his attention to the Niktuku, the fearsome boogeyman hunting the Nosferatu. Despite scoring some victories, he was forced to retreat to Frankfurt. That's where he met Julia Antasia and was soon enthralled by her utopic vision for the [cainite|E] society, immediately pledging himself to her cause.\n\n#bold You are the shining beacon of hope of your beleaguered [Clan|E] and you do not intent on disappointing them.#!"
 bookmark_warofprinces_kodesh:0 "克里·科德什"
 bookmark_warofprinces_kodesh_desc:0 "Born and [Embrace|E]d during the climatic events of early Christianity, Kli Kodesh's true origins are mysterious. It seems that he was the first vampire to drink (and survive) from the fabled Holy Grail, which explains his lack of deformities for a Nosferatu. Armed with this powerful artifact, Kli Kodesh contemplated the eternity stretching in front of him... and only found boredom in the prospect.\nTossing away the Grail in the closest dump, Kodesh decided to dedicate his eternity to the goal of always finding new entertainment from the smallest joke to the biggest scheme.\n\n#bold Eternity is too long to sit idle. Time to find new ways to relieve your jaded mind from this drawn out charade.#!"
 bookmark_warofprinces_varsik:0 "瓦西克"
 bookmark_warofprinces_varsik_desc:0 "A traveling merchant, Varsik's skills with words, sleight of hand, and inherent wanderlust attracted the notion of the methuselah Bashir, who [Embraced|E] him as one of his seven disciples.\nHe followed his [Sire|E] around the medieval world, fusing the teachings of the Road of Paradox with that of the Christian Book of Revelations.\nIn 1101 CE, he came to Jerusalem following the Final Death of another disciple. He hoped to use the chaos within the city to spread the Bashirite creed to others of his [Clan|E] and even other [cainites|E], while he amassed a massive fortune by himself, becoming one of the most powerful figures within the city.\n\n#bold The recent arrival of the Lioness has greatly reduced your influence. You must take a step back and plan your return to Jerusalem from afar.#!"
 bookmark_warofprinces_ramessu:0 "拉美苏"
 bookmark_warofprinces_ramessu_desc:0 "One of the childer of Zapathasura, Ramessu was quickly tired of the eternal war between his [Clan|E] and the eastern invaders in India. As such, he choose to settle in Egypt, helped by the then ongoing war between the Setites and the Osirian League.\nConquering a large part of the territory held by the distracted children of Set, Ramessu established his own Jati (caste) named as the Alexandrites. Since then, the Setites have regrouped and struck back, but the powerful Methuselah and his childer are still a major threat at their border.\n\n#bold You have grown to love Egypt. You will uphold its ancient glory while getting rid of the serpentine pests infesting it.#!"
 bookmark_warofprinces_sundervere:0 "孙陀罗伐罗"
 bookmark_warofprinces_sundervere_desc:0 "At first glance, Sundervere is just a small, skinny man in late middle age, with a shaved head, a V-mark on his forehead and a white robe. Then you see his eyes – black, magnetic, burning with fanatical will. The void stares back at you.\nAn Indian mastermind, Sundervere prefers to work only with other Daitya, or his mortal Indians and various strange and secret cults scattered around the world. He not only commands the allegiance of several doomsday cults, he may create new ones to order. One thing is for certain, the man is ambitious, arrogant and intent on becoming a powerplayer sooner rather than later.\n\n#bold India is a fertile ground to start your ascension to greatness!#!"
 bookmark_warofprinces_zhenga:0 "真加"
 bookmark_warofprinces_zhenga_desc:0 "Slaves, drugs, vitae, and secrets are Zhenga's trade and for anyone to buy – for the right price. Standing on good ground with the native Laibon, Zhenga prepares to claim the lands South of Egypt as her official domain to serve as a beachhead for Setite operations in sub-Saharan Africa.\nShe is also trying to create a new [revenant|E] line called bima (the Nilote word for [ghoul|E]), obedient only to the Setites in the African wilderness.\n\n#bold With your mastery over secrets, vice and revenant breeding, you will finally claim Africa for the glory of Set! #!"
 bookmark_warofprinces_abetorius:0 "阿贝托留斯"
 bookmark_warofprinces_abetorius_desc:0 "Abetorius was first sent to Greece in the 12th century by none other than Tremere himself. Upon arriving in the region, he was initially based in Constantinople under the tentative patronage of the Michaelite Toreador. His official mission was to establish diplomatic ties while his true assignment was to hunt down a Tremere runaway, Theresa Kymena, and investigate the rumors of a Salubri hiding in the city. With the 4th Crusade shattering Greece, Abetorius has thrown his lot with Anna Comnena, hoping to gain a strong ally once he helps her reclaim the City of the World's Desire.\n\n#bold While the situation has changed, the mission hasn't. The rogue must be brought to justice and the Tremere's position in the region secured.#!"
 bookmark_warofprinces_amichai:0 "阿米亥"
 bookmark_warofprinces_amichai_desc:0 "A skilled mage and Kabbalist, Amichai’s talent with magic vanished utterly upon his [Embrace|E], but his facility with Dominate and Auspex proved to be prodigious. Unable to progress through the House and burgeoning pyramid, his [Sire|E] turned what could be an embarrassment for her into a boon, dispatching her childe to India.\nEnsconcing himself within the Chochin Jewish population, Amichai has successfully enthralled several mortals of import within Mangaluru, acting as patron for merchant caravans. His lack of magical prowess causes the Danava to dismiss him, even as he maintains a casual and cordial relationship with the Ravnos of India.\n\n#bold You were always underestimated. It is time to prove them wrong by securing [Clan|E] Tremere's position in India! #!"
 bookmark_warofprinces_lamia:0 "拉米亚"
 bookmark_warofprinces_lamia_desc:0 "Through the ages, the Cult of Lamia remained a guarded secret from tyrants, senators, and kings who ground men's destinies beneath their heels. It was Lazarus of the Cappadocians who one moonless night found her.\nLamia's erudition and fervor, and perhaps other qualities, touched something long hidden in the heart of the Graverobber; and so, he came upon Lamia and bore her down beneath the disapproving eyes of the Dark Mother's ebony statue.\nShe soon got her revenge, as the mysteries she knew were too much for Lazarus to handle. Still, the Priestess agreed to a pact with her new [Clan|E].\n\n#bold You tolerate the Cappadocians, but your loyalty is to Lilith only. Praise the Dark Mother! #!"
 bookmark_inquisitor_inauhaten:0 "伊努哈顿"
 bookmark_inquisitor_inauhaten_desc:0 "The mummy known as Inauhaten was once an architect, but after his rebirth he began the study of death to learn more about himself and the afterlife.\nIt is said that it was him who told the mages of the Tal'Mahe'Ra about the nature of Enoch when they first met him in Egypt. In exchange for the protection of his body while Inauhaten was waiting for resurrection, he reported back to them the things he saw in the Underworld, including knowledge of wraiths and their arcane society. Most importantly, he spoke of a realm named Enoch and was accepted into the sect after he led them to the city and helped them capture it. He has since been a high ranking and respected, if aloof, member of the sect.\n\n#bold Your goals are your own but they are, for now, aligned with the Tal'mahe'Ra.#!"
 bookmark_inquisitor_astrokhen:0 "阿斯特罗金"
 bookmark_inquisitor_astrokhen_desc:0 "An ambitious mage in Ancient Egypt, Astrokhen sought eternal life and, after fleeing from an unpleasant encounter with Horus, found it thanks to the wayward Mummy Cabirus.\nHorus wasn't exactly pleased however and caught up to Astrokhen soon enough. Impressed by his stubbornness and will to survive, the Avenger decided against Astrokhen's destruction and instead choose to curse him with an important task. The unwilling Mummy was thus given a large number of powerful artifacts that Horus wanted to safeguard, with the order to not let anyone approach them. And so it was for millennia until the vampire named Kli Kodesh manipulated events so that Astroken's cache was raided, his beloved artifacts scattered to the wind.\n\n#bold You must gather as many artifacts as you can less Horus' curse catches on to you.#!"
 bm_1230_battle_royale:0 "诸族"
 bm_1230_battle_royale_desc:0 "黑暗世界中的其他可玩种族都在此剧本。如需更详细地了解每个种族，请在屏幕左侧选择次剧本。\n\n裁判官是教会派遣于猎杀超自然生物的专员。\n恶魔是堕落天使，一心想要腐蚀人类的灵魂。\n木乃伊是与赛特进行长久战争的埃及不朽者。\n狼人是盖亚的士兵，保护盖亚免受文明侵蚀。"