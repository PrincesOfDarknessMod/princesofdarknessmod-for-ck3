 bm_1230_inquisitor_sub_mummies:0 "黑暗时代：木乃伊"
 bm_1230_inquisitor_sub_mummies_desc:0 "很久以前，在埃及的土地上，众神在人类中行走。一切都很好，直到邪恶者赛特背叛并杀害了他的同胞，伊西斯和荷鲁斯是唯一的幸存者，但他们拒绝投降。他们创造了强大的生命神咒，确保他们的神选将永远重生，直到蛇最终被赶出埃及。\n从那个传奇时代到现在已经过去了很长时间，赛特的影响力只增不减，一些木乃伊甚至已经放下了这场失败的战争。然而，荷鲁斯本人并没有这样做，在为时已晚之前，玛阿特的平衡仍然可能被恢复。\n\n#bold 荷鲁斯的忠诚支持者、独立派或蛇的爪牙；谁将取得胜利？#!"
 bookmark_inquisitor_horus:0 "荷鲁斯"
 bookmark_inquisitor_horus_desc:0 "归来的王。活法老。复仇者。荷鲁斯有很多特点，但首先，他是奥西里斯和伊西斯的复仇之子。\n荷鲁斯的一生都在于他的叔父赛特的战争中度过。有过许多挫折，但更多的是胜利。他失去了自己的眼睛，但让赛特付出了沉重的代价。\n死亡对他这样的生命来说没有任何意义，他用生命神咒重生，永远地重生，直到有一天，对抗赛特的最终胜利终将属于他。从开始，荷鲁斯就组织了他忠诚的木乃伊军团，发动了永恒的战争，以恢复这个世界的平衡。\n\n#bold 战争仍在继续。你将血染埃及的沙场，直到每一位赛特的追随者都被置于阿努比斯严厉的注视之下。#!"
 bookmark_inquisitor_neferukhayt:0 "尼芙璐卡哈特"
 bookmark_inquisitor_neferukhayt_desc:0 "尼芙璐卡哈特在第一次死亡前是一位女王和学者，因为她的政治地位和她相当的博学而被伊西斯密教选中。然而，她很快确认她对荷鲁斯的圣战不感兴趣，她发现她对知识的渴求更适合用来度过她永恒的生命。\n荷鲁斯如她所愿地接受了这一点，此后，她与其他志同道合的木乃伊一起离开了埃及，去寻找她真正的使命。在这一点上，她再次成为某种意义上的女王，以她很久以前曾经闻名于世的优雅姿态进行统治。\n\n#bold 虽然你和其他木乃伊一样讨厌赛特，但你有比发动一场永恒的战争更紧迫的事情。这些远离埃及的陌生土地的新事物源源不断。#!"
 bookmark_inquisitor_cabirus:0 "卡比洛斯"
 bookmark_inquisitor_cabirus_desc:0 "在生命神咒被创造出来，荷鲁斯和他的追随者对赛特和他的爪牙发动战争后很久，一些木乃伊厌倦了他们看似徒劳的战争，成为了以实玛利派，他们想独立于荷鲁斯和他的战争。在接下来的几年里，他们中的一个人向一个名叫卡比洛斯的天才法师传授了生命神咒的原理。\n卡比洛斯利用这一点创造了他自己的生命洛咒，并创造了属于他的不朽者，他们对奥西里斯和玛阿特一无所知——这让荷鲁斯的忠诚者们感到非常惊恐。他们最终摧毁了卡比洛斯的手抄本，只剩少数欧洲木乃伊仍然存在，包括卡比洛斯本人……至少现在如此。\n\n#bold 你独自一人，与世隔绝，坚守着生命神咒，一个被许多人悬赏的秘密。危险无处不在。#!"
 bookmark_inquisitor_hemhemti:0 "赫赫提"
 bookmark_inquisitor_hemhemti_desc:0 "虽然赛特从未成功地从伊西斯和荷鲁斯手中夺取对生命神咒，但他仍然足以能够创造它自己的版本。这种对真正魔法的嘲弄确实创造了木乃伊，但却是有很大缺陷的，被诅咒有永恒的折磨和发癫的疯狂。\n在为赛特服务而重生之前，赫赫提是一个放荡贪吃的奴隶贩子，甚至吃了索贝克的神圣鳄鱼。这一彻底的越轨行为为他赢得了赛特的尊重，并使他成为所谓忌灵木乃伊的现任领袖。\n\n#bold 赛特要你为他吞噬世界，直到他归来。你会很享受这个过程的。#!"
 bookmark_werewolves_sister_worm:0 "虫修女"
 bookmark_werewolves_sister_worm_desc:0 "黑螺旋舞者部族是狼国的耻辱。因自己的傲慢而受诅咒的堕落狼人，他们现在都是怪物和疯子，与最可怕的存在结盟，带来了怒嚎末日。\n彻底疯狂的虫修女自认为是“妖蛆的先知”。在试图唤醒大草原上一个强大的恶灵失败后，她现在跟随“召唤”来到俄罗斯，她主人的一个伟大盟友需要她的帮助。\n\n#bold 虫说有个聪明的鬼婆需要你的帮助。如果你能成功，还会有更大的奖励。你不敢让虫失望。#!"
 bookmark_warofprinces_rocklord:0 "岩主"
 bookmark_warofprinces_rocklord_desc:0 "肖迪斯是第一只被格拉崔克斯和维斯塔尼亚认为彻底成功的石像鬼。他忠诚地服务了多年，直到他的睿魔尔主人在一次袭击中被杀。第一次尝到自由的滋味，肖迪斯现在面临着新的东西：选择。\n他是向魔物宣誓效忠，还是回到他的巫士主人身边，或者通过血来开辟自己的道路？\n\n#bold 指望岩主的人将重新获得力量。他们要像鹰一样展翅高飞。#!"
 bookmark_warofprinces_adisa:0 "阿迪萨"
 bookmark_warofprinces_adisa_desc:0 "如果传说是可信的，阿迪萨是芙蕾雅的女儿，一位不向任何人俯首的女武神。在她的旅行中，她引起了一位波斯国王的愤怒，因为她拒绝向他效忠而发动了他的整个军队。经过一场漫长的战斗，阿迪萨被打败了，但没有被打倒。\n在向芙蕾雅请求复仇的权利时，阿迪萨作为无情的灵体归来了，将波斯国王的城堡撕成碎片。她的职责完成后，阿迪萨选择留在米德加尔德，帮助其他受到伤害的女性，并将她们聚集在她的正当征服下死去敌人的名下——阿里曼。\n\n#bold 作为芙蕾雅的神选斗士，你必须为保护和提升她的女儿们而战。#!"
