 demons_sub_bookmark:0 "黑暗时代：恶魔"
 bm_1230_inquisitor_sub_demons:0 "黑暗时代：恶魔"
 bm_1230_inquisitor_sub_demons_desc:0 "早在亚当与夏娃出现之前，上帝制造了天使来协助他掌管宇宙。祂很快就对人类感到失望，并命令祂的天使隐藏自己，让人类衰败。路西法表示拒绝，于是天堂之战在这一天发动了。\n上帝的军团取得了胜利，将反叛者扔进了魔邪的深渊监狱，这将他们扭曲的不成样。随着时间的推移，他们中的少数逃了出来，被鲁莽的崇魔者召唤而出。因此，恶魔诞生了。\n\n#bold 把天上的星星撕下来，将整个宇宙翻过来，将灰烬扔到那无情的上帝的面前。也许那时你的磨难才将最终结束。#!"
 bookmark_inquisitor_vassago:0 "瓦沙克"
 bookmark_inquisitor_vassago_desc:0 "瓦沙克是一位嫉妒之恶魔，他以看到凡人的梦想和希望变成灰烬和耻辱为乐。他的力量比其他许多恶魔的力量更微妙，但尽管不会造成充满血腥和火焰的大场面，其效果也不差。他能感知凡人的命运和前途（以及如何阻止这种前途的实现）。他有能力控制美梦和噩梦、幻觉和预兆；他能读懂凡人的思想和记忆，并以不幸和疯狂地诅咒来困扰他们。\n瓦沙克被一位腐化的耆那教信徒在印度召唤，到目前为止，瓦沙克的力量已经被声称拥有该次大陆的其他强大实体有效地遏制了。\n\n#bold 你的信徒很弱，你的权威很低。但你很有耐心，毕竟永恒在你这边。#!"
 bookmark_inquisitor_orobas:0 "欧若博司"
 bookmark_inquisitor_orobas_desc:0 "欧若博司在几千年前被召唤出来，并被束缚入一尊潮湿、粘稠的砂岩雕像中，他的密教被摧毁，他的宿匣也失。大约在1210年代，一位过于好奇的瓦勒度派学者在阅读了关于一个可恶教派的古代教会文件后，发现了埋在德意志沼泽中的恶魔宿匣。他随后陷入疯狂，这是恶魔需要的扭曲信仰的涓涓细流，使他再次回到非自然的生活中。\n被归类为暴食之恶魔，欧若博司专注于身体上的快乐，但他的权柄也包括小型动物、毒药、生理废料和饥饿。自从他归来后，他对教会产生了浓厚的兴趣，认为这个强大的组织是他扬升的完美工具。\n\n#bold 把可悲的全人类从“约束”和“道德”的牢笼中解放出来，将是你的责任和乐趣……#!"
 bookmark_inquisitor_bezariel:0 "贝撒列尔"
 bookmark_inquisitor_bezariel_desc:0 "贝撒列尔曾经是一名死亡之天使。他很快就对收割凡人灵魂的使命感到厌烦，并试图无助地使自己看起来尽可能地吸引人。他想让人类爱他、信任他，但无论他塑造出多么无辜的面孔，他都无法减轻他们死亡时的恐惧和痛苦。\n然而，尽管他在战斗中表现出了可怕的勇武，他还是像其他人一样被扔进了深渊。几千年后，他被一位粗心的崇魔者召唤，但这棋子为一个更大的女主人服务。\n贝撒列尔发现自己被一位邪恶无比的生物所压迫，与之相比，恶魔几乎显得很渺小。这位女巫，在人类的传说中被称为芭芭雅嘎，对他喃喃自语她的计划。这样一来，他发现自己被束缚住了，依靠她才没有尖叫着回到深渊中。\n\n#bold 你在扮演着忠诚的将军。作为死亡之天使，你知道宿命总有一天会追上铁之鬼婆的。而你打算为那一夜做好准备。#!"
 bookmark_inquisitor_ares:0 "阿瑞斯"
 bookmark_inquisitor_ares_desc:0 "作为古希腊的战神，阿瑞斯是暴力、嗜血和虐待狂的化身。对他的崇拜更多的是一种安抚行为，只是为了抵御神灵的愤怒，而不是任何形式的奉献。\n虽然阿瑞斯首先被希腊人召唤，但在他作为罗马战神玛尔斯的任期内，他真正成为最强大的恶魔之一。依靠罗马军团对征服的暴力渴望，阿瑞斯的密教和权力几乎可以与地狱中最强大的大公相媲美。\n然后基督教来了。\n尽管阿瑞斯（和其他恶魔）尽了最大努力，但他们还是无法腐蚀第一批十字架信徒的信仰，玛尔斯很快就成了一个逐渐消失的记忆。如今，这个曾经强大的恶魔沦落到在希腊最偏僻的地方争夺信仰的地步，就像他被召唤的那天一样虚弱。\n\n#bold 世界已经忘记了你，但它还没有忘记战争。这将足以让你重新开始扬升。#!"
 bookmark_inquisitor_lamashtu:0 "拉玛什图"
 bookmark_inquisitor_lamashtu_desc:0 "拉玛什图被亚述人召唤，然后被崇拜为“进行抹除的她”，他与一个名叫提亚马特的更强恶魔联合在一起，并谋划着摆脱她。他们的斗争使拉玛什图的许多信徒付出了生命的代价，导致她在胜利后被大大削弱。\n拉玛什图被困在海底，几乎被拉回深渊，她用自己最后的力量拯救了反抗波斯统治的伊奥尼亚希腊人奥尼西卢斯。她得到了一名感恩的仆人，并且因为他的信仰而成功地坚持在了这个世界。然后她试图利用他迁移到亚柯（随后阿克），在那里她感觉到了巨大的潜在力量，但没有成功获取。\n从那时起，拉玛什图就开始玩起了长线游戏。她的密教很小，但足够虔诚，她终于可以向这世界行使一些力量。\n\n#bold 随着目前黎凡特的动荡，你终于可以夺取亚柯的控制权，希望城市下的神秘力量足以使你一劳永逸地登上大魔的行列。#!"
 bookmark_inquisitor_mammon:0 "玛门"
 bookmark_inquisitor_mammon_desc:0 "世界之王、马尔杜克、巨匠造物主、伊达波思……玛门有很多面目，但他真正的身份只有一个：世俗权力和物质主义的化身。事实上，玛门不需要寻求新信徒，他们会自然而然地来到他身边，愿意为金钱、权力和名声做任何事情。他们自行来到他身边，挥舞着相当程度的社会影响力，并且无情到足以粉碎挡在他们面前的任何人（或任何东西）。\n玛门的崛起只是被早期基督教及其对美德（通常是贫穷）生活的强调所减缓。陷入沉睡的“世界之王”最近苏醒过来，很惊讶地看到他曾经最大的敌人——教会，即使没有他的干预，也已经堕入了贪婪的恶习。\n\n#bold 生意在兴隆，有那么多的客户在等待你所提供的东西……#!"
 bookmark_inquisitor_nikannuranu:0 "尼卡努拉努"
 bookmark_inquisitor_nikannuranu_desc:0 "作为前任星光和苍穹之天使，尼卡努拉努在上帝的宏伟计划中是一个可靠但相当次要的工具。尼卡努拉努满足于观察星星和遵循宏伟设计，出于对这奇怪的模式变化的好奇心，他加入了路西法的叛乱。和其他反叛者一样，他也从恩典中跌落。\n几乎是在事后才被扔进深渊监狱的，尼卡努拉努直到最近才逃出来，发现自己被束缚在特兰西瓦尼亚的一个不起眼的城堡里，胡内多阿拉。没有人崇拜他，也没有人给他提供急需的信仰，他知道深渊监狱很快就会把他拉回来，然而他将再次远离他心爱的群星。\n\n#bold 如果你想避免深渊，你需要尽快找到信仰的来源。你心中有数位天真的候选人……#!"
 bm_1230_inquisitor_group:0 "猎人与猎物"
 bm_1230_warofprinces_group:0 "黑暗时代：吸血鬼"
 bm_1230_werewolves_group:0 "黑暗时代：狼人"
 bm_1510_birthofsects_group:0 "党派的诞生"
 bm_1230_fae_group:0 "黑暗时代：妖精"
 bm_1230_fae:0 "黑暗时代：妖精"
 bm_1230_fae_desc:0 "休战之誓的签署已经过去了一个世纪，它制止了仙族贵胄的王廷之间的公开敌对行动。岁月的车轮不断转动，现在尚武派推动着四季之战的回归，而休战派则坚守着和平契约。真言师们警告说，随着人类从梦想转向只求生存的板讷，黑暗即将来临。依人派主张妖精与人类更紧密地结合在一起，而君士坦丁派则被最强大的凡人机构——教会所吸引。\n\n#bold 春天还会来吗？夏天会持续吗？秋天是不可避免的吗？下一冬天会不会是永恒的？#!"
 bookmark_fae_jalendrel:0 "贾兰德尔"
 bookmark_fae_jalendrel_desc:0 "A great warrior and a prophet, Jalendrel is troubled by his dire visions of the future. He weeps for those terrible things he can foresee, but can not change. He once foresaw a terrible monster would destroy a village of his kin. He set out to slay the beast–and not only did he fail but he lost his hand to a withering darkness. Later, he followed his vision to slay the monster and save Lord Gwyidion, but the price of that victory was watching the village of his kin be destroyed. To change things that he could, Jalendrel founded a noble house from among the prophets of the Sidhe in Occitania in the small hilltown of Marvejols.\n\n#bold The Code of Jalendrel calls on its members to: honor the future and remember its secrets, not to burden others with the future lest it break them, and to accept your destiny while leaving others to theirs.#!"
 bm_1375_patronwar_group:0 "赞助之战"
 bookmark_fae_the_white_lady:0 "白女士"
 bookmark_fae_the_white_lady_desc:0 "西欧各地的一些偏远村庄对白女士有强烈地宣誓。她和她的臣民在村子里治愈或温柔地安抚每一个生病的人类婴儿，只要其履行某些仪式和坚持某些禁令。白女士是春之王廷的一位受人尊敬的古人，她居在妖精井之诺中，以仁慈和亲人类的观点领导春之王廷。"
 bm_1230_fae_sub_sidhe:0 "仙族世家"
 bm_1230_fae_sub_sidhe_desc:0 "贵族妖精世家给普通的戚族投下了长长的阴影。"
 bm_1230_fae_sub_kithain:0 "戚族贵胄"
 bm_1230_fae_sub_kithain_desc:0 "一些平民戚系被提升为贵族，并被假设为是与仙族贵胄“平等”的人。"
 bm_1230_fae_sub_jinn:0 "镇尼"
 bm_1230_fae_sub_jinn_desc:0 "中东的妖精主要用镇尼来称呼自己，但它也广泛用于任何超自然的存在。"
 bookmark_fae_wayland:0 "韦兰"
 bookmark_fae_wayland_desc:0 ""
 bookmark_fae_nincnivin:0 "宁斯尼文"
 bookmark_fae_nincnivin_desc:0 ""
 bookmark_fae_ana:0 "安娜"
 bookmark_fae_ana_desc:0 ""
 bookmark_fae_drail:0 "德雷尔"
 bookmark_fae_drail_desc:0 "作为最臭名昭著的妖精之一，他的身世一直笼罩在神秘之中。德雷尔是夏之王庭长子的孩子，他反抗王庭的压迫结构。他对权力充满野心，对那些阻止他获得权力的人不屑一顾。他被打上至日的烙印并被放逐，后来与其他亲族建立了关系。他制定了一个计划，要建立一个统一的夏日王庭，统治四季。德雷尔得到了妖精刺客和雇佣兵的支持，并从乞丐、小偷、信使和歌妓等社会底层人那里获得了誓言。据称，他的阴谋和秘密行动导致了四季之战。他的一名暗杀者被夏日王庭抓获并严刑拷打，从而揭露了德雷尔是这场冲突的主谋。在所有王庭的追捕下，他消失了。流言四起，说这个或那个至日起义的幕后主使就是德雷尔。\n\n#bold 为了实现你的野心，在王庭中策划、谋划和发动战争！#!"
 bookmark_fae_taulandryn:0 "塔兰特林"
 bookmark_fae_taulandryn_desc:0 "Every bridge in the world creates a portal to the twisted nightmare realm of Underbridge, a starless land of eternal night lit only by sputtering torches and eerie will o' the wisps. The most gruesome members of the Winter Court call Underbridge home. The expansion of human civilization has caused rapid growth in this nightmare realm, as new trade routes and cities spawn more and more bridges. During the War of Seasons, Winter armies moved quickly through Underbridge to strike at poiints across Europe.\nRumors claim that beyond a Sidhe, Taulandryn is an inanimae born of darkness itself or some monstrous creature of the abyss such as a T'arrkel or other bestial aberration of Underbridge. This Winter-kin firstborn lives at the heart of Underbridge, deep in the void.\n\n#bold Strike out from the realm of Underbrdige and expand along the rivers until you have forged an empire, then draw forth through a great Trod the Nightmare Realm so that mortals never forget the Fae. Let them hate so long as they fear.#!"
 bookmark_fae_tandoor:0 "唐多里"
 bookmark_fae_tandoor_desc:0 "A changeling rising quickly to prominence after the Battle of Ice, the small taste of status fueled his ambition.  During the battle, Davidian who held the Crystal Fortress, had defied orders and refused to fight the Spring fae on account of his spring lover Kapherah. Tandoor quietly gathered a large group of Summer Court changelings and staged a coup that managed to depose Davidian and took control of the Fortress. After their coup, Tandoor leveraged his victory to demand recognition from the Summer Court of the changeling contribution to the battle. Tandoor was given the first Medal of the Sun, marking him as a Summer Court hero.  Becoming increasing militant during the Dim Times, he is anxious for the Oath-Truce to end.  He still holds the treasured Crystal Fortress as his domain.\n\n#bold These first born Fae will come to respect you or else!#!"
 bookmark_fae_garain:0 "加莱恩"
 bookmark_fae_garain_desc:0 ""
 bookmark_fae_gwydion:0 "格威狄昂"
 bookmark_fae_donovan:0 "多诺万"
 bookmark_fae_donovan_desc:0 "An engineer at by craft, arch-typically of his house, is known for his long silences. He has a tendency to ask few questions and then let those who ramble on do just that, which often exasperates his courtiers.  Along with Aife and Morann, he was among the first lords of House Dougal that swore the Oath of Dougal: 'My heart is Dougal's heart. My arm will take up his hammer. My body will take his burden. My heart will take on his will. I will work until the end of my day's doing his work.' Donovan's passion lies in the construction of huge machines. Though known for his siege engines, he also enjoys building wonderfully arcane construction equipment. He uses his impressive ability to forge magical arms and armor to support the cause of the Summer Court in the War of Seasons. Secretly, Donovan is troubled with dreams of human wizards violating the sovereignty of Arcadia. \n\n#bold As Donovan has said, 'To fight a thing, you must understand a thing.'#!"
 bookmark_fae_fiona:0 "费恩娜"
 bookmark_fae_eiluned:0 "爱伦涅德"
 bookmark_fae_eiluned_desc:0 "Brooding daughter of Alynyad, she was the first of the fae to foresee the coming Sundering: a future where mortals have cast dreams aside and live in despair; a world with no place for Fae, or for anyone who dares to dream. Though her skill with prophecy and divination magics is unequaled, few have heeded her warnings. Even her dear brother Alil has dismissed her vision, and their quarrels became so great in time that Eiluned took leave of Ailil's court. With her companions, fae and otherwise, she founded a kingdom of her own several leagues hence, and though they have not always believed the things this strange lady has said, it was not long before the other kings and queens have come to recognize her as one of their own.\n\n#bold Others must heed your warnings, the sundering must be prevented! They ignore your warnings at their own peril.#!"
 bookmark_fae_ailil:0 "艾力"
 bookmark_fae_ailil_desc:0 "Dark and brooding, powerfully attractive, with a keen intelligence, Ailil has a fierce passion for both love and war. His great flaw is an inability to remain aloof from the world of mortals. Some believe that Ailil sought mortal glory and power to distract himself from the ominous warnings of his beloved sister, Eiluned. Time and again he has donned mortal flesh and entered the stream of human history, taking lovers and leading armies with his irresistible charm and guile. \n\n#bold Though his own temperament favored the Seelie Court, Ailil has gathered to himself a host of Unseelie fae who have swore allegiance to him as Winter King and sought to keep alive the balance of the seasons.#!"
 bookmark_fae_liam:0 "利亚姆"
 bookmark_fae_liam_desc:0 "Liam has become obsessed with the Christian Church–-the beauty of its art, architecture and particularly its music. So enthralled, he has risked possible persecution as a ‘demon’ just to hear a few notes of its choirs. He became enraptured with the singing of Sister Melisande at a local abbey. Duke Haleson ap Gwydion heard of Liam’s fascination, and worried such obsession would bring down the wrath of the Church upon the Fae. Haleson and his faction conspired dressed as clergy to kidnap Melisande from her nunnery. When Liam returned to the nunnery to find Melisande disappeared, he fell into a psychotic rage driving many of the nunnery insane with his glamour. After forcibly extracting the memories from the Mother Superior, he soon set upon Duke Haleson. Liam in his blind rage was handily defeated by Haleson. The Duke then had Liam face trial by the Arcadian Fae. \n\n#bold For his violation the Right of Demense and for attracting the ire of the Vatican, Liam and his entire house have been forever exiled from Arcadia!#!"
 bookmark_fae_daireann:0 "戴瑞恩"
 bookmark_fae_daireann_desc:0 "One of Bobh Dearg two beautiful daughters, Daireann is a renowned herbalist. She is said to having poisoned to werewolf hero Fionn MacCumhail in revenge for the lupine choosing to favor Daireann's sister Sadbh. Daireann gained noble title and founded a house by curing the goutish foot of Adwyr ap Gwydion. Daireann herself is not much of a warrior and knew it would be hard to prove the house's worth in the most visible way; on the battlefield. Some say she is skilled with the bow and sling, but that is stretching things a bit. \n\n#bold The true growth of the house, with the founder's blessing, came with the birth of her son, Conchobhair. Those who had been House Daireann in name now have a purpose and a cause--the thrill of war. There is no Gwydion king or queen who had more fanatically devoted followers than did Daireann’s greatest ard-righ. The house has never turned their faces from any challenge Conchohair has given and rallied to whatever task he asked of them.#!"
 bookmark_fae_leanhaun:0 "恋难舍"
 bookmark_fae_leanhaun_desc:0 "She is called 'Lark's song,' for her voice is pure and clear, her hair is like silvered sunlight, and her face is as fair as the dawn itself. She betrayed her lover Finellia by rhapsodizing Finellia's mortal lover Edann, the king's bard, to death. Reckless and heedless of all save her own desires, Leanhaun was given a death curse by Finellia's ritual suicide. Leanhaun's immortality fades unless she rhapsodizes a dreamer regularly. Her entire house shares her curse. The house has hidden this truth, and instead claims that Finella killed Edann in a fit of jealousy. Her house also shares here unearthly beauty and charisma. \n\n#bold Leanhaun and her house follow a simple creed for those they prey upon: Choose Only Those Who Want Your Attentions, Give Your Love and Inspiration Unconditionally and Never Regret.#!"
 bookmark_fae_varich:0 "瓦里克"
 bookmark_fae_varich_desc:0 "He is the bright and handsome son of the Slavic gods Miesiac the Moon and Dazbóga the Sun. They ordered the spirits to find his perfect love. Dazbóga turned to the sluagh and she placed a geas upon them, commanding that they must search until the most perfect of all maidens could be brought to her son. Charodei, the sluagh sorceress, fashioned a Snow Madien out of ice to seduce Varich. Varich loved her instantly upon sight, but in his embrace she melted away. So distraught with the loss, he is now incapable of ever giving his love to another. Varich has ruled his house for many centuries with an even hand and a just temperament, although he has never lost the darkness and pain he felt. He knows well who betrayed him and does not allow his hatred to cool with the centuries--no sluagh is ever allowed within the Varich freeholds without swearing the most powerful of oaths.\n\n#bold His greatest wish is to understand and conquer the pattern of the Endless Winter so that he may drive the Fomorians away when they arrive. Still, he fears what he sees in the pattern of the future.#!"
 bookmark_fae_dice:0 "戴斯"
 bookmark_fae_dice_desc:0 "A legendary wanderer, notoriously hard to locate even among the Elegbara, and has a habit of disappearing for a dozen years or so at a time then reappearing with a new face over his old soul. Some of the younger Eshu think this is a result of constantly dying and being reborn in rapid succession and makes him a comedic figure of misfortune. He is in fact one of the Síocháin; one of those rare changelings who have perfectly balanced the twin halves of their nature and so become effectively immortal. His staggering lifespan has allowed him to become fluent in hundreds of languages, master of more than a dozen Arts, walker of every trail and trod on Earth and in the Dreaming.\nAlone among the noble Houses, Danaan has a non-sidhe as High Lord, the eshu Dice, and it's perhaps no surprise they have no problem with inducting other commoners, though Arcadian sidhe still occupy many prominent positions. Any changeling with a passion for exploration and an interest in the Dreaming is welcome in the House.\n\n#bold Explore!#!"
 bookmark_fae_lugh:0 "鲁格"
 bookmark_fae_lugh_desc:0 ""
 bookmark_fae_ragnelf:0 "拉格纳夫"
 bookmark_fae_ragnelf_desc:0 "Two courts of noble Sidhe emerged from dreams of the Norse--the mystical Vanes and the martial Aesir. After bloody war, they merged to form the Aesin. The Aesin has given some of their magical power to mortal worshippers and encouraged them to go viking against the Christian Church. The Aesin has been losing its shadow war against the Church, as one Norse kingdom are Christianized. Some voices call for a retreat from Midgard to Asgard (Arcadia).\nRagnelf is a calm and gentle woman who has seen her share of tragedies. After her sister Ingirun died, the throne of Aesin went to her. Since then, she has created a strong house out of the ashes of a war-torn family. Her kindness is widely known among members of House Aesin, and although she is well-versed in most Arts, she realized a long time ago that her mind is her greatest weapon.\n\n#bold Keep to the old ways and try to keep the Kithain focused on real threat of the banality of the Christian Church, and not squabbling among each other.#!"
