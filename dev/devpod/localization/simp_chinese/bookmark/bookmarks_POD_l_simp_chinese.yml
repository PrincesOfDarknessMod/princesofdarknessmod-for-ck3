 demons_sub_bookmark: "黑暗时代：恶魔"
 bm_1230_inquisitor_sub_demons: "黑暗时代：恶魔"
 bm_1230_inquisitor_sub_demons_desc: "早在亚当与夏娃出现之前，上帝制造了天使来协助他掌管宇宙。祂很快就对人类感到失望，并命令祂的天使隐藏自己，让人类衰败。路西法表示拒绝，于是天堂之战在这一天发动了。\n上帝的军团取得了胜利，将反叛者扔进了魔邪的深渊监狱，这将他们扭曲的不成样。随着时间的推移，他们中的少数逃了出来，被鲁莽的崇魔者召唤而出。因此，恶魔诞生了。\n\n#bold 把天上的星星撕下来，将整个宇宙翻过来，将灰烬扔到那无情的上帝的面前。也许那时你的磨难才将最终结束。#!"
 bookmark_inquisitor_vassago: "瓦沙克"
 bookmark_inquisitor_vassago_desc: "瓦沙克是一位嫉妒之恶魔，他以看到凡人的梦想和希望变成灰烬和耻辱为乐。他的力量比其他许多恶魔的力量更微妙，但尽管不会造成充满血腥和火焰的大场面，其效果也不差。他能感知凡人的命运和前途（以及如何阻止这种前途的实现）。他有能力控制美梦和噩梦、幻觉和预兆；他能读懂凡人的思想和记忆，并以不幸和疯狂地诅咒来困扰他们。\n瓦沙克被一位腐化的耆那教信徒在印度召唤，到目前为止，瓦沙克的力量已经被声称拥有该次大陆的其他强大实体有效地遏制了。\n\n#bold 你的信徒很弱，你的权威很低。但你很有耐心，毕竟永恒在你这边。#!"
 bookmark_inquisitor_orobas: "欧若博司"
 bookmark_inquisitor_orobas_desc: "欧若博司在几千年前被召唤出来，并被束缚入一尊潮湿、粘稠的砂岩雕像中，他的密教被摧毁，他的宿匣也失。大约在1210年代，一位过于好奇的瓦勒度派学者在阅读了关于一个可恶教派的古代教会文件后，发现了埋在德意志沼泽中的恶魔宿匣。他随后陷入疯狂，这是恶魔需要的扭曲信仰的涓涓细流，使他再次回到非自然的生活中。\n被归类为暴食之恶魔，欧若博司专注于身体上的快乐，但他的权柄也包括小型动物、毒药、生理废料和饥饿。自从他归来后，他对教会产生了浓厚的兴趣，认为这个强大的组织是他扬升的完美工具。\n\n#bold 把可悲的全人类从“约束”和“道德”的牢笼中解放出来，将是你的责任和乐趣……#!"
 bookmark_inquisitor_bezariel: "贝撒列尔"
 bookmark_inquisitor_bezariel_desc: "贝撒列尔曾经是一名死亡之天使。他很快就对收割凡人灵魂的使命感到厌烦，并试图无助地使自己看起来尽可能地吸引人。但无论他塑造出多么无辜的面孔，他都无法减轻他们死亡时的恐惧和痛苦。\n然而，尽管他在战斗中表现出了可怕的勇武，他还是像其他人一样被扔进了深渊。几千年后，他被一位粗心的崇魔者召唤，但这棋子为一个更大的女主人服务。\n贝撒列尔发现自己被一位邪恶无比的生物所压迫，与之相比，恶魔几乎显得很渺小。这位女巫，在人类的传说中被称为芭芭雅嘎，对他喃喃自语她的计划。这样一来，他发现自己被束缚住了，依靠她才没有尖叫着回到深渊中。\n\n#bold 你在扮演着忠诚的将军。作为死亡之天使，你知道宿命总有一天会追上铁之鬼婆的。而你打算为那一夜做好准备。#!"
 bookmark_inquisitor_ares: "阿瑞斯"
 bookmark_inquisitor_ares_desc: "阿瑞斯是暴力、嗜血和虐待狂的化身。对他的崇拜更多的是一种安抚行为，只是为了抵御神灵的愤怒，而不是任何形式的奉献。\n虽然阿瑞斯首先被希腊人召唤，但在他作为罗马战神玛尔斯的任期内，他真正成为最强大的恶魔之一。依靠罗马军团对征服的暴力渴望，阿瑞斯的密教和权力几乎可以与地狱中最强大的大公相媲美。\n然后基督教来了。\n尽管阿瑞斯（和其他恶魔）尽了最大努力，但他们还是无法腐蚀第一批十字架信徒的信仰，玛尔斯很快就成了一个逐渐消失的记忆。如今，这个曾经强大的恶魔沦落到在希腊最偏僻的地方争夺信仰的地步，就像他被召唤的那天一样虚弱。\n\n#bold 世界已经忘记了你，但它还没有忘记战争。这将足以让你重新开始扬升。#!"
 bookmark_inquisitor_lamashtu: "拉玛什图"
 bookmark_inquisitor_lamashtu_desc: "拉玛什图被亚述人召唤，然后被崇拜为“进行抹除的她”，他与一个名叫提亚马特的更强恶魔联合在一起，并谋划着摆脱她。他们的斗争使拉玛什图的许多信徒付出了生命的代价，导致她在胜利后被大大削弱。\n拉玛什图被困在海底，几乎被拉回深渊，她用自己最后的力量拯救了反抗波斯统治的伊奥尼亚希腊人奥尼西卢斯。她得到了一名感恩的仆人，并且因为他的信仰而成功地坚持在了这个世界。然后她试图利用他迁移到亚柯（随后阿克），在那里她感觉到了巨大的潜在力量，但没有成功获取。\n从那时起，拉玛什图就开始玩起了长线游戏。她的密教很小，但足够虔诚，她终于可以向这世界行使一些力量。\n\n#bold 随着目前黎凡特的动荡，你终于可以夺取亚柯的控制权，希望城市下的神秘力量足以使你一劳永逸地登上大魔的行列。#!"
 bookmark_inquisitor_mammon: "玛门"
 bookmark_inquisitor_mammon_desc: "世界之王、马尔杜克、巨匠造物主、伊达波思……玛门有很多面目，但他真正的身份只有一个：世俗权力和物质主义的化身。事实上，玛门不需要寻求新信徒，他们会自然而然地来到他身边，愿意为金钱、权力和名声做任何事情。他们自行来到他身边，挥舞着相当程度的社会影响力，并且无情到足以粉碎挡在他们面前的任何人（或任何东西）。\n玛门的崛起只是被早期基督教及其对美德（通常是贫穷）生活的强调所减缓。陷入沉睡的“世界之王”最近苏醒过来，很惊讶地看到他曾经最大的敌人——教会，即使没有他的干预，也已经堕入了贪婪的恶习。\n\n#bold 生意在兴隆，有那么多的客户在等待你所提供的东西……#!"
 bookmark_inquisitor_nikannuranu: "尼卡努拉努"
 bookmark_inquisitor_nikannuranu_desc: "作为前任星光和苍穹之天使，尼卡努拉努在上帝的宏伟计划中是一个可靠但相当次要的工具。尼卡努拉努满足于观察星星和遵循宏伟设计，出于对这奇怪的模式变化的好奇心，他加入了路西法的叛乱。和其他反叛者一样，他也从恩典中跌落。\n几乎是在事后才被扔进深渊监狱的，尼卡努拉努直到最近才逃出来，发现自己被束缚在特兰西瓦尼亚的一个不起眼的城堡里，胡内多阿拉。没有人崇拜他，也没有人给他提供急需的信仰，他知道深渊监狱很快就会把他拉回来，然而他将再次远离他心爱的群星。\n\n#bold 如果你想避免深渊，你需要尽快找到信仰的来源。你心中有数位天真的候选人……#!"
 bm_1230_inquisitor_group: "猎人与猎物"
 bm_1230_warofprinces_group: "黑暗时代：吸血鬼"
 bm_1230_werewolves_group: "黑暗时代：狼人"
 bm_1510_birthofsects_group: "党派的诞生"
 bm_1230_fae_group: "黑暗时代：妖精"
 bm_1230_fae: "黑暗时代：妖精"
 bm_1230_fae_desc: "誓约休战的签署已经过去了一个世纪，它制止了仙族贵胄的王廷之间的公开敌对行动。岁月的车轮不断转动，现在尚武派推动着四季之战的回归，而休战派则坚守着和平契约。真言师们警告说，随着人类从梦想转向只求生存的板讷，黑暗即将来临。人文派主张妖精与人类更紧密地结合在一起，而君士坦丁派则被最强大的凡人机构——教会所吸引。\n\n#bold 春天还会来吗？夏天会持续吗？秋天是不可避免的吗？下一冬天会不会是永恒的？#!"
 bookmark_fae_jalendrel: "贾兰德尔"
 bookmark_fae_jalendrel_desc: "贾兰德尔，一位伟大的战士和先知，被他对未来的可怕预视所困扰。他为那些他能预视但无法改变的可怕事物而哭泣。他曾预视到一只可怕的怪物将摧毁他同族的一个村庄。他出发去杀死那只野兽，但不仅失败了，还失去了他的一只手，被一片凋零的黑暗所吞噬。后来，他按照自己的预视去击败怪物并拯救了吉维迪恩领主，但那场胜利的代价是看着他同族的村庄被摧毁。为了改变他能够改变的事情，贾兰德尔在奥克西塔尼亚的马尔沃若勒小山镇中，从仙族的先知中创立了一个贵族家族。\n\n#bold 贾兰德尔的准则要求其成员：尊重未来并记住它的秘密，不要将未来的重担加给他人，以免压垮他们，并接受自己的命运，同时让别人去承担自己的命运。#!"
 bm_1375_patronwar_group: "赞助之战"
 bookmark_fae_the_white_lady: "普列茜妮"
 bookmark_fae_the_white_lady_desc: "在西欧的几个偏远村庄，存在着与白夫人紧密相连的强大誓言。只要进行特定的仪式并遵守特定的禁忌，她和她的臣民就会治愈或温柔地安抚村庄中的每一个生病的婴儿。普列茜妮是春之王廷的尊敬的古老存在，她居在妖精井之诺中，以仁慈和亲人类的观点领导春之王廷。"
 bm_1230_fae_sub_sidhe: "仙族世家"
 bm_1230_fae_sub_sidhe_desc: "贵胄妖精世家给平民戚族投下了长长的阴影。"
 bm_1230_fae_sub_kithain: "戚族贵胄"
 bm_1230_fae_sub_kithain_desc: "一些平民戚系被提升为贵胄，并被假设为是与仙族贵胄“平等”的人。"
 bm_1230_fae_sub_jinn: "镇尼"
 bm_1230_fae_sub_jinn_desc: "中东的妖精主要用镇尼来称呼自己，但它也广泛用于任何超自然的存在。"
 bookmark_fae_wayland: "韦兰"
 bookmark_fae_wayland_desc: "韦兰是夏之王廷的至高匠师，是夏妖精无可争议的强大领袖，也是在四季之战中赢得恐惧和尊敬的著名战士。对于凡人，韦兰很少有善意的举动。\n他喜欢出现在人类面前，为他们提供丰厚的回报，以换取他们的誓言。因此，虽然骑士的腰间可能有一把做工精美的武器，但誓言一破，刀剑亦毁。他在坚守誓言的过程中找到了极大的满足感，然后惩罚那些不遵守约定的人类。\n虽然他的宫廷主要由尚武派妖精组成，但至高匠师接纳任何来到他领地的访客。据传他和哲人女王妮克内文曾经是一对恋人。韦兰是少数几个在誓约休战上签字的人之一——那天，他是带着痛苦的颤抖在羊皮纸上落笔的。\n韦兰在每笔交易中都积极争取夏之王廷的利益。\n#bold 现在是战争的时候了。阳光照耀着夏之王廷的荣耀！#!"
 bookmark_fae_nicnivin: "妮克内文"
 bookmark_fae_nicnivin_desc: "黑矮人的首领，克罗德领主已经去世。他的几位副手正在争夺空缺的王座，每个人都展示着自己在欧洲各地的强大势力。其中首屈一指的是妮克内文女士。她是守护者议会的支柱，但她的忠诚最终完全属于冬之王廷。有传言称，最近对美丽的哲人女王发动的刺杀企图几乎成功，妮克内文女士现在为了自己的安全而隐居起来。\n她被赋予许多名号——骨母、盖娅·卡琳、苏格兰的赫卡忒、巨大妖婆、农民们的母巫——她的影响力沿着黑路蔓延。如果有关她曾经是至高匠师韦兰的情人的传闻属实，那么现在她似乎对他怀有极大的敌意。在她众多的敌人名单中，神秘的德雷尔也在其中。她是否将德雷尔视为四季之战、布林德·尼克斯之死或克罗德领主的刺杀的责任人？\n#bold  在冬之王廷巩固你的权力，并在不重新引发四季之战的情况下为克罗德的死报仇。#!"
 bookmark_fae_ana: "安娜"
 bookmark_fae_ana_desc: "作为黄昏议会中备受赞誉的成员之一，安娜女王与她的同僚们对于四季之战有着相同的观点，这种态度在凯莎莉聚会的成员中也很受欢迎。向人类展示足够的力量，使他们尊重和珍视妖精，然后将他们的信任作为即将到来的战争的武器。作为誓约休战的签署者之一，她自然不愿看到条约破裂。\n具有讽刺意味的是，安娜让秋之王庭远离四季之战的最大障碍是她自己令人厌恶的前夫洛克里奇和与洛克里奇生下的可憎、怪物般的后代。这位违逆之主渴望更多的破坏、苦难和污染。她的孩子们与她对立，而这些孩子的怪物后代也随之其后。为了在遵守誓约休战和对她邪恶的前夫进行应得的复仇之间取得平衡，安娜将不得不做出可怕的选择。\n#bold 安娜会屈服于她前夫及其邪恶子女的诡计，还是能够引领高贵的凯莎莉走向更光明的黎明？#!"
 bookmark_fae_drail: "德雷尔"
 bookmark_fae_drail_desc: "作为最臭名昭著的妖精之一，德雷尔的背景笼罩在神秘之中。他是夏之首生妖精的孩子，他反抗王廷的压迫结构。他对权力充满野心，对那些阻止他获得权力的人不屑一顾。他被打上至日的烙印并被放逐，后来与其他至日同族建立了关系。他策划了一个统一的至日王廷的计划，该王廷将统治四季。德雷尔得到了妖精刺客和雇佣兵的支持，并从乞丐、小偷、信使和歌妓等社会底层人那里获得了誓言。据称，他的阴谋和秘密行动导致了四季之战。他的一名破坏者被夏之王廷抓获并严刑拷打，从而揭露了德雷尔是这场冲突的主谋。在所有王廷的追捕下，他消失了。流言四起，说这个或那个至日起义的幕后主使就是德雷尔。虽然许多人追求德雷尔的首级，但黑路的妮克内文似乎对他的死特别感兴趣。\n\n#bold 为了实现你的野心，在王廷中策划、谋划和发动战争！#!"
 bookmark_fae_taulandryn: "塔兰特林"
 bookmark_fae_taulandryn_desc: "世界上的每座桥梁都创造了通往扭曲的[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]桥底界域的门户，一个没有星辰的永夜之地，只有摇曳的火炬和怪异的鬼火照亮着。冬之王廷中最可怕的成员将桥底作为家园。人类文明的扩张导致这个噩梦界域迅速增长，因为新的贸易路线和城市孕育出越来越多的桥梁。在四季之战期间，冬妖精军队通过桥底迅速穿越，打击欧洲各地的目标。\n传言称，塔兰特林不仅是一位仙族，而且还是生于黑暗本身的元素妖，或者是桥底的某种怪物，比如塔克尔或其他野兽般的畸物。这位冬族的首生者居住在桥底的中心，深入虚空之中。\n\n#bold 冲出桥底界域，沿着河流扩张，直到建立起一个帝国，然后通过一条巨大的通道从噩梦界域中汲取力量，让凡人永远不会忘记妖精。让他们记恨吧，只要有惧怕就行。#!"
 bookmark_fae_tandoor: "唐多里"
 bookmark_fae_tandoor_desc: "在冰之战后，一个换生灵迅速崛起，小小的地位使他的野心燃烧起来。在战斗中，达维迪安守护着水晶堡垒，他违抗了命令，拒绝与春妖精战斗，因为他有一位春妖精恋人卡佩拉。唐多里悄悄地聚集了一大群夏之王廷换生灵，并发动了一次政变，成功废黜了达维迪安，并控制了堡垒。政变之后，唐多里利用自己的胜利要求夏之王廷承认换生灵在战斗中的贡献。唐多里被授予了第一枚太阳勋章，标志着他成为夏之王廷的英雄。在昏暗时期，他变得越来越好战，迫切希望誓约休战结束。他仍然将珍贵的水晶堡垒视为自己的领地。\n\n#bold 这些首生妖精将会尊重你，否则下场不妙！#!"
 bookmark_fae_garain: "加莱恩"
 bookmark_fae_garain_desc: "泪之使者通过签署誓约休战，为了暂时停止四季之战而给妖精带来了变革。时间不断前进，春之王廷再次呼吁变革。白夫人希望保持誓约休战，但通过改善与人类的关系来改变妖精。其他妖精纷纷聚集到青刃统帅齐格弗里德·海因的失落军团麾下，重启战争，这次以春的胜利为目标。\n\n#bold 现状已经失败。变革必将到来。但是，何种变革？你的选择可能决定妖精的命运。无论你选择什么，必将有许多哭泣。#!"
 bookmark_fae_gwydion: "格威狄昂"
 bookmark_fae_donovan: "多诺万"
 bookmark_fae_donovan_desc: "作为一名工程师，他是他世家的典型代表，以长时间的沉默而闻名。他倾向于少问问题，然后让那些喋喋不休的人继续发表演讲，这常常激怒他的廷臣们。与埃斐和莫兰恩一起，他是杜伽尔世家中最早宣誓效忠杜伽尔宣誓的领主之一：“我的心属于杜伽尔。我的手臂将拿起他的锤子。我的身躯将承担他的重担。我的心将秉承他的意志。我会为他奋斗，直至生命的尽头。”多诺万的热情在于建造庞大的机器。尽管以他的攻城器械而闻名，他也喜欢制造精巧的奥秘建筑设备。他利用自己令人印象深刻的锻造魔法武器和护甲的能力，支持夏之王廷在季节之战中的事业。暗中，多诺万被人类巫师侵犯[UmbraGlossary('arcadia')]主权的梦所困扰着。\n\n#bold 正如多诺万所说：“要与一物战斗，你必须了解一物。”#!"
 bookmark_fae_fiona: "费恩娜"
 bookmark_fae_eiluned: "爱伦涅德"
 bookmark_fae_eiluned_desc: "她是阿利尼亚德的沉思女儿，是第一个预见到即将到来的大散断的妖精：一个将梦想抛之脑后、生活在绝望中的未来；一个没有妖精的世界，也没有任何敢于梦想的人。尽管她在预言和占卜魔法方面的技艺无人能及，但很少有人听从她的警告。即使她亲爱的兄弟艾力也对她的预见不屑一顾，他们的争吵日益激烈，最终爱伦涅德离开了艾力的宫廷。她与妖精和其他伙伴一起，在数里之外创立了自己的王国，尽管他们并不总是相信这位奇怪女士所说的话，但其他国王和女王很快就认识到她是他们中的一员。\n\n#bold 其他人必须听从你的警告，必须阻止大散断！他们忽视你的警告将自食其果。#!"
 bookmark_fae_ailil: "艾力"
 bookmark_fae_ailil_desc: "艾力黑暗而沉思，极具吸引力，智慧敏锐，对爱情和战争都怀有强烈的激情。他最大的缺点是无法与凡人的世界保持疏离。有人认为，艾力寻求凡人的荣耀和权力，是为了转移对他心爱的妹妹爱伦涅德不祥警告的注意力。他一次又一次地投身于凡人的历史之中，化身为凡人，以他无法抗拒的魅力和狡诈，拥有情人，率领军队。\n\n#bold 尽管他自己的性格偏好喜乐廷，艾力却聚集了一群哀怒廷妖精，他们宣誓效忠他作为冬之王，并努力保持季节之间的平衡。#!"
 bookmark_fae_liam: "利亚姆"
 bookmark_fae_liam_desc: "利亚姆对基督教会产生了痴迷——它的艺术、建筑，尤其是它的音乐之美。他如此着迷，甚至冒着被视为“恶魔”而可能受迫害的风险，只为了听到几个合唱团的音符。他对当地修道院的梅丽桑德修女的歌声着迷不已。哈雷森·阿普·格威狄昂公爵得知了利亚姆的迷恋，担心这种痴迷会招致教会对妖精的愤怒。哈雷森和他的派系伪装成教士，从修道院中绑架了梅丽桑德。当利亚姆返回修道院发现梅丽桑德消失后，他陷入了疯狂的愤怒之中，用他的梦华使许多修道院的人发疯。在强行从修道院院长那里提取记忆后，他很快就对哈雷森公爵采取了行动。利亚姆在盲目的愤怒中被哈雷森轻易击败。然后，公爵让利亚姆接受了阿卡迪亚妖精的审判。\n\n#bold 由于他违反了私有地权，并招致了梵蒂冈的愤怒，利亚姆和他的整个世家被永远流放出[UmbraGlossary('arcadia')]！#!"
 bookmark_fae_daireann: "戴瑞恩"
 bookmark_fae_daireann_desc: "作为伯卜·德尔格的两个美丽女儿之一，戴瑞恩是一位著名的草药师。据说她曾毒害狼人英雄芬恩·麦克库尔，以报复狼人选择偏爱戴瑞恩的姐姐塞弗。戴瑞恩通过治愈阿德维尔·阿普·格威狄昂的痛风获得了贵族头衔并建立了一个世家。戴瑞恩本人并不是一名出色的战士，并且知道要在最显而易见的方式——战场上证明世家的价值将会很困难。有人说她擅长弓箭和投石索，但这是被夸张了。\n\n#bold 随着她的儿子康胡尔的诞生，世家得到了真正的发展和创始人的祝福。那些曾以戴瑞恩之名的人现在有了目标和事业——战争的刺激。没有任何格威狄昂国王或女王拥有比戴瑞恩最伟大的至高王更狂热的追随者。世家从未背离过康胡尔提出的任何挑战，并且总是奋起响应他提出的任何任务。#!"
 bookmark_fae_leanhaun: "恋难舍"
 bookmark_fae_leanhaun_desc: "她被称为“百灵鸟之歌”，因为她的声音纯净而清澈，她的头发如同镀银的阳光，她的脸庞美丽如黎明本身。她背叛了她的爱人菲尼利亚，对菲尼利亚的凡人情人艾丹进行乱梦，将国王的吟游诗人引向死亡。无所顾忌和冲动，只顾自己的欲望，恋难舍被菲尼利亚的仪式性自杀所诅咒。菲尼利亚的永生之力会逐渐消失，除非她定期乱梦一位梦种。她的整个世家都分享了她的诅咒。世家隐藏了这个真相，声称是菲尼利亚在嫉妒中杀死了艾丹。她的世家也共享着她超凡脱俗的美丽和魅力。\n\n#bold 恋难舍和她的世家对那些他们掠食的人有一个简单的信条：选择那些渴望你的关注的人，无条件地给予你的爱和灵感，永不后悔。#!"
 bookmark_fae_varich: "瓦里克"
 bookmark_fae_varich_desc: "他是斯拉夫神的明亮而英俊的儿子，父亲是月神米西亚克，母亲是太阳神达兹博加。他们命令诸灵们去寻找他完美的爱人。达兹博加转向斯珞俄，她对他们施加了诅咒，命令他们必须寻找到最完美的少女才能带给她的儿子。斯珞俄女术士夏洛代伊用冰雪制作了一位雪姑娘来魅惑瓦里克。瓦里克一见钟情，但在他的拥抱中，她融化消失了。他因失爱而痛苦不堪，现在再也无法将他的爱给予其他人。瓦里克几个世纪以来一直公正地统治着他的世家，虽然他从未忘记他所感受到的黑暗和痛苦。他很清楚是谁背叛了他，不会让他的仇恨随着世纪冷却——没有斯珞俄能够进入瓦里克的领地而不发誓最强大的约誓。\n\n#bold 他最大的愿望是理解和征服无尽冬天的式样，以便在弗摩尔族到来时将其驱逐。然而，他对未来式样的所见仍然感到恐惧。#!"
 bookmark_fae_dice: "戴斯"
 bookmark_fae_dice_desc: "一位传说中的流浪者，即使在埃拉巴拉之中也极难找到，他有一个习惯，就是会消失十几年，然后以新的面孔重新展现他旧有的灵魂。一些年轻的逸抒认为这是他不断死亡和迅速重生的结果，使他成为一个悲剧性的喜剧人物。实际上，他是希罕中的一员；那些稀有的换生灵之一，他们完美地平衡了自己天性的两面，因此变得有效地永生。他惊人的寿命使他能够流利地掌握数百种语言，精通十几种艺术，行走在地球和[UmbraGlossary('dreaming')]中的每一条仙路和足迹。\n在贵胄世家中，达南有唯一一个非仙族的大领主，逸抒戴斯，或因此并不奇怪他们对引入其他平民没有任何意见，尽管阿卡迪亚仙族仍占据许多重要职位。任何对探索和对梦界感兴趣的换生灵都受到这世家的欢迎。\n\n#bold 探索！#!"
 bookmark_fae_lugh: "鲁格"
 bookmark_fae_lugh_desc: ""
 bookmark_fae_ragnelf: "拉格纳夫"
 bookmark_fae_ragnelf_desc: "从北欧的梦中出现了两个贵胄仙族宫廷——神秘的华纳和尚武的阿萨。在血腥的战争之后，他们合并成了阿萨。阿萨将他们的一些魔力赋予凡人信徒，并鼓励他们对抗基督教会。阿萨在与教会的暗战中一直处于劣势，因为有一个北欧王国已经皈依了基督教。一些声音呼吁从米德加尔德撤退到阿斯加德（阿卡迪亚）。\n拉格纳夫是一位冷静而温柔的女性，她经历了独有的悲剧。在她的妹妹英吉伦去世后，阿萨的王位传给了她。从那时起，她从一个饱受战争蹂躏的世家的废墟中创建了一个强大的世家。她的善良在阿萨世家成员中广为人知，尽管她精通大多数术艺，但她很早就意识到她的头脑是她最强大的武器。\n\n#bold 坚持传统，并努力让戚族集中精力对抗基督教会的板讷威胁，而不是互相争斗。#!"
 bookmark_fae_scathach: "斯卡哈"
 bookmark_fae_scathach_desc: ""
 bookmark_fae_morann: "莫兰恩"
 bookmark_fae_morann_desc: "诺克是戚族中的匠师，能够将梦界的物质塑造成他们所渴望的任何形式。然而，他们的创作总是有缺陷的，而且他们对这个诅咒的了解使他们暴躁且易怒。\n诺克领主莫兰恩是锻造大师。当杜伽尔带着寒铁来锻造传说中的利刃安威斯时，莫兰恩是三位留在他身边的妖精之一。当杜伽尔在制作他的无与伦比之作时去世，莫兰恩被任命为杜伽尔世家的首三位领主之一。杜伽尔世家的一些仙族对这个“平民”领主的突出地位感到不满。\n莫兰恩勤奋而坚韧，几乎到了过度的地步。他对他的锻造工坊的工人和附属领地都是一个难以应付的监工。他并不热衷于重新点燃四季之战，认为这场冲突会分散对更有成效和有利可图的事务的注意力。\n\n#bold 让我们开始工作吧！#!"
 bookmark_fae_ottmar: "奥特玛"
 bookmark_fae_ottmar_desc: "坚如橡树，叛誓之人，最终是心如大海。传奇巨魔奥特玛是美丽的仙族布里安娜·阿布·科尔温·费恩娜的约誓伙伴。巨魔的剑和仙族的魔法一起，他们击败了邪兽埃克斯穆尔。奥特玛疯狂地、热情地迷恋着布里安娜，但他从未向她表露过自己的迷恋之情。另一位仙族，格威狄昂世家的银之肖恩，成功地追求到了布里安娜，令巨魔感到懊恼。愤怒之下，奥特玛放弃了保护布里安娜的誓言，任使她和她的爱人被一群哀怒廷俘虏。达南神族诅咒了奥特玛和所有巨魔，使他们背弃誓言时既会削弱了他们的泰坦之力，也会充满愤怒。奥特玛因为这个诅咒对他整个族群的耻辱感到极度的羞愧，并通过解救布里安娜和肖恩来重塑自己的誓言。奥特玛至今保护着他们。\n\n#bold 永远遵守你的誓言，它们是你的力量！#!"
 bookmark_fae_charodei: "夏洛代伊"
 bookmark_fae_charodei_desc: "斯珞俄女术士相信她可以为瓦里克领主打造一个完美的伴侣，远比他们在现实中找到的任何人都要好。她用雪、冰和魔法塑造了一位。瓦里克很快就迷恋上了雪姑娘，但在他们交合之后，奇魅消融了，让瓦里克心痛不已，他的父母——月神米西亚克和太阳女神达兹博加愤怒不已。众神试图惩罚夏洛代伊，但她知道如何悄然溜入最隐秘和阴暗的地方。最后，他们对她和她的同类施加了三重诅咒：她永远不能创造或拥有完美；她永远不能看到太阳或月亮的光芒而不感到恐惧；所有其他人都会认识到她是一位背叛者。\n\n#bold 保持隐藏，避免瓦里克世家的愤怒。#!"
 bookmark_fae_malgirich: "马尔吉里奇"
 bookmark_fae_malgirich_desc: "誓约休战对于食手者来说是乏味的。他是一名能干但残酷的战士，不出所料，根据他的绰号，他喜欢吃掉敌人的持剑手。对于一位哀怒廷来说，他直率而粗鲁，这一事实使得他的言辞容易冒犯，同时也引起了人们的兴趣。在过去的一个世纪里，他磨练了自己的讲故事技巧，以打发时间和接待访客。然而，这只是对战争的一个糟糕替代，他渴望回到以往的血腥和冰冷的杀戮时代。\n\n#bold 和平是无聊的，永远没有足够的手可供食用！战争万岁！#!"
 bookmark_fae_lailoken: "莱洛肯"
 bookmark_fae_lailoken_desc: "作为难以捉摸的吉尔杜之一，莱洛肯痴迷于板讷末日将降于妖精的预兆和预言。他渴望保护自己的魔法本质和他的家园——松林架，一片喀里多尼亚的朝塞斯中的秘境。\n\n#bold 必须不惜一切代价阻止大碎溃，即使这意味着与其他王廷开战。#!"
 bookmark_fae_salih: "沙里赫"
 bookmark_fae_salih_desc: "他随着集市流动，如同记忆般久远，有人猜测他是铸造了笼罩帐篷城市的约誓的人。沙里赫贩卖信息。沙之元素妖据说知晓生死和魔法的秘密，妖精的起源，联盟和阴谋。获得他的知识需要付出沉重的代价。一些与沙里赫打过交道的人为了追求他所要求用于交易的某点知识而丧命。与沙里赫交易的风险巨大，很少有人能从这次交锋中获得比他们带来的更多，但总有那些足够渴望答案的人。\n\n#bold 你为知识付出了巨大的代价，务必确保始终以更高的价格出售它。#!"
 bookmark_fae_callicantzaroi: "卡利坎察罗伊"
 bookmark_fae_callicantzaroi_desc: "卡利坎察罗伊是一位著名的将军，在石之战中指挥了数千名士兵；当撤退的号角响起时，他组织了一次熟练的战斗撤退，拯救了许多士兵的生命。失明领主在意大利南部的宫廷以政治争斗和暴力而闻名。似乎来自每个宫廷的大使都受到欢迎，失明领主耐心地倾听每一份请愿书、联盟提议和一般请求。事实上，卡利坎察罗伊伊厌恶其他宫廷，并正在集结著名的失落军团的残余力量，将其作为战术优势储备，以在誓约休战失败时派遣。这位失明领主，尽管表面上温文尔雅、耐心迷人，但并非仁慈的统治者。大多数冬妖精都很清楚，他对许多来访者怀有杀意。\n\n#bold 现在暂时扮演交际者，但很快你的计划将实现，鲜血将流淌。#!"
 bookmark_fae_grale: "格雷尔"
 bookmark_fae_grale_desc: "酒神的苹果酒酿坊是一位欢乐的羊人领主的庭院。那里的狂欢由大量的“笑果之庭”苹果提供。格雷尔是一位友善的长者，欢迎任何人加入他的社区。作为一个坚定的人文派，这位羊人犹豫地主张回到四季之战，只是因为他乐观地相信其他王廷在看到他与人类的良好关系的证据后会明智地行事，但也许这只是他说醉话。他的宫廷因其众多的大使和外交官而闻名，他们前往其他宫廷来赞美它的优点（并品尝其醉人的酒精饮品）。\n\n#bold 通过举办盛大的派对来赢得更多的盟友，为即将到来的战争做好准备。一个足够盛大的活动甚至可能在未来的许多季节中抵挡板讷。#!"
 bookmark_fae_scherezade: "山鲁佐德"
 bookmark_fae_scherezade_desc: "传奇淑女，面纱女主，是逸抒中的楷模。她是最早也是最伟大的戚系之一，达到了奥里莎的地位。故事说，国王山鲁亚尔发现他的第一位妻子对他不忠，于是决定每天娶一个新的处女，并在次日早晨斩首，以免她们玷污他的名声。最终，大臣找不到更多有贵族血统的处女，而山鲁佐德违背了父亲的意愿，自愿嫁给了国王。每天晚上，她都会给国王讲一个故事，但总是在中途停下来。于是，国王每晚都放过她的性命，以便在第二天晚上听完故事的结局。经过一千零一夜，山鲁佐德终于告诉国王，她已经没有更多的故事可讲了，并请求能够与她在这些年里生下的三个儿子告别。然而，在之前的一千零一夜里，国王爱上了山鲁佐德。他放过了她的性命，并让她成为了他的王后。\n\n#bold 愿你能活下来讲述一千篇故事！#!"
 bookmark_fae_zawba_ah: "扎瓦赫"
 bookmark_fae_zawba_ah_desc: "气旋"
 bookmark_fae_al_abyad: "阿比亚德"
 bookmark_fae_al_abyad_desc: "白者"
 bookmark_fae_shamhuresh: "沙姆胡瑞斯"
 bookmark_fae_shamhuresh_desc: ""
 bookmark_fae_al_ahmar: "阿赫马勒"
 bookmark_fae_al_ahmar_desc: "红者"
 bookmark_fae_maimn: "麦姆"
 bookmark_fae_maimn_desc: "繁荣者"
 bookmark_fae_barqan: "拜尔盖"
 bookmark_fae_barqan_desc: "双雷"
 bookmark_fae_mudhib: "穆迪布"
 bookmark_fae_mudhib_desc: "金者"
 bookmark_fae_jurata: "朱拉塔"
 bookmark_fae_jurata_desc: "在波罗的海沿岸的几个沿海村庄中，有一位被奉为异教女神的温蒂妮，而越来越多人对唯一的上帝的信仰让她感到担忧。凡人们将供品漂浮在水面上，而海洋则会将珍贵的琥珀冲刷到海岸上。有人声称这些琥珀是她宫殿的碎片，而其他人则说它们来自她的眼泪。据说她曾经与一个凡人渔夫坠入爱河，而雷神佩尔库那斯却将他杀害。她的琥珀宫殿的宫廷有窗户通向波罗的海的每一个海岸。秋之一族换生灵商人发现这座宫殿尤其有用，许多人文派学者也居住在其中。宫殿吸引了许多妖精游客，他们希望将其作为快速旅行的手段，尽管朱拉塔要求所有访客在离开之前要在她的款待下住上一晚。她会在黄昏时分与访客见面，并密切关注她的国度中的人来人往。她记得每一张经过她宫殿的脸，而其中一些信息对很多人来说非常有价值。"
 bm_1230_fae_sub_inanimae: "元素妖"
 bm_1230_fae_sub_inanimae_desc: "元素妖是真妖精的表亲。虽然他们不是真正的元素之灵，但他们与元素有着密切的亲缘关系。每个元素妖都以一种特定的元素来塑造自己。\n\n在散断时期间，元素妖的各个门属凝聚成第一个缓慢帝国。这些国度之间的关系是乏味而复杂的，其政治以数十年为一代。在这段时间里，元素妖和凡人经常互动。一些人无视他们，而另一些人则享受他们的崇拜，允许他们塑造自己的锚，并成为第一位居者。在这段时间里，火焰帝国选择援助人类，把制造火焰的知识赠送给他们。这被大多数其他元素妖视为一种重大的背叛，因为它允许人类塑造和奴役周围的世界，导致了第一位马内坎的诞生。这导致了造化之战，岩石帝国试图征服或摧毁火焰帝国。"
 bm_1230_fae_sub_african: "非洲戚系"
 bm_1230_fae_sub_african_desc: "古梦之地的梦华区域是整个世界中最明亮、最强大的之一，由浸透在土壤中的千年之梦以及目前仍在做梦的人的充满活力的希望和恐惧所支持。古老的神话不仅在这里占主导地位，而且在这里拥有王廷。\n\n自然#bold 逸抒#!是众多的，从非洲之角的东岸到西部的帝国摇篮漫游，但如果可以说他们有一个家，那就是伊费王国，那里有他们最强大的#bold 奥巴#!。魔法般蓝色的#bold 杰迪#!在尼罗河湿地中闪耀登场。富有进取精神的四眼#bold 奎诺#!争相组织自己，在能够获得最大回报的地方奠定存在。愤懑又善于仪式的#bold 奥班博#!潜伏在少数隐藏力量的地方，始终寻求禁忌的宝藏。\n\n虽然在古梦之地有许多戚族部落，但相反地，这些土著戚族尚未向外界展示自己。"
