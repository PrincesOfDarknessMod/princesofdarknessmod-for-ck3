 bookmark_fae_siegfreid_hein: "齐格弗里德·海因"
 bookmark_fae_siegfreid_hein_desc: "青刃统帅与他的和平使者领主白女士形成鲜明的对比。他将（主要是军事）注意力集中在妖精社会上。他的失落军团正准备在誓约休战最终瓦解后发起一系列攻击。多年来，海因曾与青刃最后一位真正的将军卡佩拉一起战斗，而海因仍然渴望将兵团恢复到其曾经的实力。目前，他已经将部队集结在黑森林以东，并认为他可以通过对神话般的传奇尼伯龙根宝藏——莱茵黄金的祖传宣称的帮助下建立自己的军队，并通过征服整个莱茵地区恢复自己的光辉。他的满肚子诡计的秋妖精表亲冈瑟可能成为一个需要清除的障碍。\n\n#bold 现在是改变的时刻，是战争的时刻！#!"
 bookmark_fae_halostian: "哈罗斯坦"
 bookmark_fae_halostian_desc: "\n\n#bold 政治是以其他方式进行的战争#!"
 bookmark_fae_rubezahl: "吕贝察尔"
 bookmark_fae_rubezahl_desc: "群山之主，一位被视为庄严而谦逊的巨魔贵胄统治者。他能熟练地遵循礼仪和礼貌的规则，给人一种非常有能力但有些难以亲近的印象。然而，“宝藏守护者”也有一个不可预测的哀怒廷一面，似乎喜欢让巨山深处的矿工的洞穴通道坍塌，或者对旅行者发动动物袭击。\n\n#bold 巨山之主应该被视为巨魔之王！#!"
 bookmark_fae_verdoren: "维尔德伦"
 bookmark_fae_verdoren_desc: "他的宫廷曾经是所有国度中最重要的之一，他保护着靠近他的森林边界的人类定居点。许多人类将他崇拜为自然的神灵。作为春之王廷的坚定捍卫者，他曾与奇幻生物进行搏斗，与其他王廷进行小规模冲突，但他对死亡感到厌倦。他退隐到森林的阴凉和庇护之中，等待着四季之战的最终结局。\n\n#bold 经历风暴，让春天再次来临。#!"
 bm_1230_hunter: "黑暗时代：猎人"
 bm_1230_hunter_desc: "无论何时何地，勇敢的男男女女总是拿起武器对抗超自然力量。不像天主教裁判所一样有组织且有影响力，这些小团体、家族甚至个人都面对着不可能战胜的挑战。但这从未阻止他们尝试，并为人类留下了足迹。\n\n#bold 胜利几乎是不可见的前景。然而，战斗本身是值得的。#!"
 bookmark_inquisitor_nachmanides: "纳贺蒙尼德"
 bookmark_inquisitor_nachmanides_desc: "以圣经中的民长为名，民长们继承了他们的名字和传统，他们是保护犹太信仰者免受在夜晚潜伏的怪物侵害的守护者。他们与被他们所认为是的莉莉丝的子嗣们作斗争。他们以《妥拉》和特殊版本的《塔木德》作为对抗超自然力量的资源。\n由于大多数国家犹太人的比例较低，民长们在没有中央协调的情况下以小组形式运作。大多数民长都是独行侠，与黑暗生物作战，专注于保护特定社群。他们往往忽视法师；崇魔者、化形者和吸血鬼是他们真正的目标。\n\n#bold 莉莉丝的怪物后裔无处不在。你必须阻挡它们。#!"
 bookmark_inquisitor_karl: "卡尔·施瑞克"
 bookmark_inquisitor_karl_desc: "作为孤军作战者，卡尔·施瑞克或许是他那个时代最臭名昭著的独立猎人。这位严厉的德意志人对外交毫不耐烦，对有组织的猎人团体毫无好感。他独自战斗，随着他所击败的吸血鬼数量不断增加，该隐的子们开始注意到他的存在。\n而且，长久以来，一个普通的凡人竟然让他们感受到一种他们认为低贱的情感：恐惧。\n\n#bold 有一夜，你可能会遇到与你匹敌的对手。然而，在那之前，你将继续一个接一个地杀死它们。#!"
 bookmark_inquisitor_emerik: "埃默里克"
 bookmark_inquisitor_emerik_desc: "斯拉夫太阳战神留下了一个英勇的传奇，毫不顾忌地与邪恶作战。自那时以来，许多年轻的战士跟随他的脚步，试图从邪恶的棘秘魑和他们的恶魔盟友库帕拉手中夺回家园。\n对达兹博格的信徒来说，战斗并不顺利，斯拉夫宗教的缓慢消亡使他们的人数几近灭绝。然而，他们仍然在为了他们心爱的守护神而光荣地与永生的敌人战斗，甘愿献身。\n\n#bold 尽管一切都如此，战士们仍然幸存。正如达兹博格所证明的，只要活着，你仍然可以战斗。这还没有结束。#!"
 bookmark_inquisitor_demetrios: "季米特里俄斯"
 bookmark_inquisitor_demetrios_desc: "感受到与$POD_splat_vampire_plural$、$glossary_fera$和其他怪物战斗的呼召的东正教神父和修女，边防军过着苦行的生活。虽然他们对其他猎人组织并不不友善，也不与其合作或串通。最近的第四次十字军东征对该组织造成了严重打击，并对其与天主教裁判所的关系造成了严重压力。\n随着曾经强大的拜占庭帝国的崩溃，我们将见证这些昔日的暗影守护者是否能在这个艰难的时代中幸存。\n\n#bold 边防军正处于十字路口。他们会原谅罗马教会对君士坦丁堡的可怕袭击吗？这可能是对抗超自然力量的统一基督教战线的唯一希望。#!"
 bookmark_inquisitor_ishaq: "伊沙克·伊本·贾米尔"
 bookmark_inquisitor_ishaq_desc: "伊沙克的第一个家庭在他惊恐逃离时被吸血鬼杀害。从那以后，他一直在培养一代新的穆斯林猎人，古兰赛义德，希望他们能比他更好地准备好对抗超自然力量。伊沙克自己知道他的时日不多了，但如果得以妥善管理，他的遗产可能会在未来的几个世纪中流传下去。\n\n#bold 一小群贝都因猎人对于黑夜中的强大怪物来说并不构成威胁。然而，经过时间和关怀，即使是最微小的火花也能引发宏大的净化之火。#!"
 bookmark_inquisitor_qorjin: "科尔沁"
 bookmark_inquisitor_qorjin_desc: "虽然历史记住了速不台和哲别等人的名字，但科尔沁的壮举却被沉默所掩盖。他的事业始于萨马拉弯之战，他独自一人拒绝向那些化身为狼的人屈服，制造了一个分散注意力的策略，让他的部队得以安全撤退。回到喀喇昆仑的家乡后，他被成吉思汗亲自召见，对他强调了一项神圣的新任务：保护蒙古帝国免受超自然力量的侵扰。在接下来的岁月里，他研究了人所不见的世界，学会了利用敌人的恐惧和迷信，将神话中的生物逼至蒙古帝国的边缘。\n\n#bold 科尔沁的早期成就非凡，但他开始意识到面前任务的巨大。尽管如此，可汗下令，科尔沁奉命。#!"
 bookmark_inquisitor_mayiyuan: "马义媛"
 bookmark_inquisitor_mayiyuan_desc: "士是中原的狩魔人，利用自身的气来施展所谓的窍功，以获得超人的力量。曾经统一在强大的天军之中，士变得傲慢，而在一次大地震中，天军被摧毁，只有那些拒绝加入的人幸存下来。如今，他们独自行动或者以非常小的团队形式行动，每个猎人都有自己的个性和战斗方式。\n士比大多数其他猎人更加开明，有时可以被说服与“善良”的超自然力量合作，对抗共同的敌人。\n\n#bold 随着天军的崩溃，士如今成为了流浪者，但他们仍然是超自然的可见威胁。他们的组织可能已经改变，但他们的使命并未改变。#!"
