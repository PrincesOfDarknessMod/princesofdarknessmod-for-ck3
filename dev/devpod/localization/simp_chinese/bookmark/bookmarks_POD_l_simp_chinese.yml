 bookmark_patronwar_xenoamess: "色诺·阿美"
 bookmark_patronwar_xenoamess_desc: "你是个没爹没妈的玩意，你不知道为啥长成了这样。但你决定跟你周边的杂种一起当乐子人。\n\n#bold 在这个世界上要小心，因为你可能不会得到任何人的爱。#!"
