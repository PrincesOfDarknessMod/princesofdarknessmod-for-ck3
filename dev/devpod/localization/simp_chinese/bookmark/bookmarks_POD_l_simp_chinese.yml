l_simp_chinese:
 bm_1230_warofprinces: "黑暗时代：吸血鬼"
 bm_1230_warofprinces_desc: "亲王之战是该隐之子历史上的一段冲突时期，开始于1204年第四次十字军东征导致君士坦丁堡沦陷后不久。此术语指的是血族亲王在无尽之夜结束后为争夺领土而发生的冲突。\n\n在裁判所成立前不久，亲王们的战争开始了。尽管裁判所最初只是长者们的工具，但他们很快就成为了对该隐之子的更大威胁。虽然尚不清楚亲王之战何时结束，但很可能会随着大反乱的到来而被迫中止。\n\n#bold 你能赢得这场战争的最终胜利吗？又或者在人类开始反抗他们的正当主人之时随同氏族一起被清算？#!"
 bookmark_warofprinces_montano: "蒙塔诺"
 bookmark_warofprinces_montano_desc: "勒森魃的忠实子嗣，同时也是横跨整个地中海的$pod_clan$之主。尽管蒙塔诺处于一个安全的位置，而且本身也是一位有权势的人，但一个大麻烦正在他视野外酝酿。伊比利亚的内战、意大利老敌人的崛起以及$pod_clan$中年轻成员的不守规矩都使对$pod_clan$安定的威胁。君士坦丁堡最近向他臣服，但它的亲王阿丰佐肯定是不值得信任的。更明智的做法可能是暂时将注意力集中在意大利。小心那些野心勃勃的封臣，比如克劳狄·欧亨尼奥和罗马亲王提图斯·梵卓鲁·卡米拉。\n\n#bold 你能再次确保勒森魃$pod_clan$作为欧洲最具影响力的$pod_clan$的正确地位么？#!"
 bookmark_warofprinces_camilla: "卡米拉"
 bookmark_warofprinces_camilla_desc: "提图斯·梵卓鲁·卡米拉在罗马的大部分辉煌历史中占据着重要地位，可以说是古代政治上最重要的$pod_cainite$。卡米拉在梵卓历史是一位争议人物，他因其政治敏锐性和对他们最强大的帝国的光荣领导而闻名，但也因创立了原罪之路而受到忌讳，该道德准则对于大多数梵卓的喜好来说过于……堕落。\n尽管有这些争议，卡米拉还是召集$pod_clan$发动该著名的战争，摧毁了迦太基，直到今晚，他的这一成就仍然受到称赞。他的$pod_clan$结束了罗马的光辉岁月，并预示着长夜的到来，梵卓$pod_clan$的力量大大削弱。\n\n#bold 刚在一陌生的新世界下苏醒，你能再一次，为了一颤动的、堕落的罗马的荣耀统治整个$pod_cainite$世界么？#!"
 bookmark_warofprinces_qawiya: "卡维娅·加杜巴"
 bookmark_warofprinces_qawiya_desc: "萨洛比$pod_clan$已支离破碎，几乎被睿魔尔家族的篡位者逼得绝种。耶路撒冷的雌狮，萨麦尔的子嗣是他们最后的希望，是他们在面对贤士的攻击时最后的生存机会。她与该地区的亲王互相结盟，而此“橄榄会议”却有些不稳定，此外还有着附近的[Glossary('阿什拉派','game_concept_ashirra_desc')]和巴力的威胁。对这位萨洛比选民来说，确保自己的权力基础是明智的第一步。\n\n#bold 你能将徒劳的最后一战转变为萨洛比$pod_clan$的辉煌复兴么？#!"
 bookmark_warofprinces_alexander: "亚历山大"
 bookmark_warofprinces_alexander_desc: "在作为法兰西的绝对统治者超过一千年后，亚历山大因他子嗣若弗鲁瓦·杜·坦普尔领导的阴谋失去了一切。现在，被放逐到黑十字成为了被忌讳的客卿后，强大的玛土撒拉正在策划他的回归。除了惊人的个人能力和宣称外他几乎一无所有……这对大计划是微不足道的。对于曾经是最强大的全能梵卓子嗣之一的他来说，这几乎是从零开始。\n\n#bold 你能让若弗鲁瓦和萨莉安娜为他们的背叛付出代价，并夺回属于你的王位么？或在这片东方土地上创造新的传承？#!"
 bookmark_warofprinces_werter: "维特"
 bookmark_warofprinces_werter_desc: "古斯堪的纳维亚人的古老生活方式正在消亡，奥丁的子嗣们也在消亡。当德意志梵卓向斯堪的纳维亚发起最后的进攻时，大多数[Glossary('英灵战士','game_concept_einherjar_desc')]都随从了他们的命运并迎接即将到来的诸神黄昏。\n\n#bold 作为你人民中最后的崇高之主，你是愿意平静地接受你的命运，还是为了瓦尔哈拉作出最后的抵抗？#!"
 bookmark_warofprinces_etrius: "埃特里乌斯"
 bookmark_warofprinces_etrius_desc: "作为最年轻的吸血鬼$pod_clan$，睿魔尔正处于一个艰难的位置。睿魔尔他本身也处于$pod_torpor$状态，好以消化$pod_diablerie$扫罗后的成果，而永远忠诚的埃特里乌斯不得不面对棘秘魑的无情攻击。你还剩着一些优势，因为$pod_clan$著名的纪律确保了团结，而德意志和匈牙利的梵卓在某种程度上支持你。你的敌人并不以耐心著名，你应该从他们的内部危机中寻找获利的机会。\n\n#bold 你能保证睿魔尔$pod_clan$能像睿魔尔那样在吸血鬼政治中拥有强大势力么？#!"
 bookmark_warofprinces_rustovitch: "罗斯托维奇"
 bookmark_warofprinces_rustovitch_desc: "军督之督的荣誉并没有落在最年长或最强大的库都术士手中，而是落在了最雄心勃勃的棘秘魑手中。到目前为止，弗拉基米尔·罗斯托维奇的统治有点复杂，他对十字军战士约根·冯·费尔登实行了无条件和平，对受人憎恨的睿魔尔实行了屈辱性的惩罚。在棘秘魑内部中，很多人都希望他下台，首先是他的前任，诺利兹。若罗斯托维奇不是一位精明的政治家的话，他将会什么也不是，只要他能够确保一些关键的胜利，他的对手可能很快就会“消失”……\n\n#bold “狼群克星”能带领内斗不休的棘秘魑领主对抗梵卓和睿魔尔篡位者的威胁吗？#!"
 bookmark_warofprinces_mithras: "密特拉"
 bookmark_warofprinces_mithras_desc: "密特拉被一些人信奉为一位字面上的波斯和罗马神。尽管这似乎难以想象，但这让他得以创建一个由狂热子嗣和密教徒组成的忠心心腹来执行他的命令。在古罗马时期的一些密谋计划失败后，密特拉逃到英格兰，但很快就厌倦了英格兰领主之间的琐碎纷争。他觉得自己最好还是在沉眠中度日，于是把领地交给了几个值得信赖的摄政王……他们很快就自作孽了。从[Glossary('蛰眠','game_concept_torpor_desc')]中苏醒后，密特拉迅速地巩固了他的权力，修复了他的摄政王们造成的大部分混乱。英格兰稳固了，但没有完全被征服。此外，你将不得不对付威尔士的野蛮冈格罗，诺丁汉的叛逆歹徒和苏格兰的残余[Glossary('英灵战士','game_concept_einherjar_desc')]。之后，法兰西的权力真空可通过你在波尔多的飞地被利用。\n\n#bold 你能达到多远没有限制。见证不朽之阳的荣耀吧！#!"
 bookmark_warofprinces_pustula: "塞尔维乌斯·马里乌斯·普斯图拉"
 bookmark_warofprinces_pustula_desc: "曾是古罗马的奴隶，在一场吸血鬼大战之后，他被一个名叫诺斯费拉图的吸血鬼初拥。然后在塔尼特巴尔的指导下，他通过写讽刺诗来发泄自己的愤怒。当他的导师失踪后，普斯图拉和他的同伴卡米拉密谋对付那些与塔尼特巴尔为敌的人，在陷入[Glossary('蛰眠','game_concept_torpor_desc')]之前，卡米拉把普斯图拉之路托付给了他。普斯图拉离开罗马，开始在国外传教，赢得了许多新的追随者。\n\n现在卡米拉已经苏醒，塞尔维乌斯必须决定是否帮助他的老盟友重建在原罪之路下的罗马的计划。"
 bookmark_warofprinces_esclarmonde: "埃丝克拉蒙德"
 bookmark_warofprinces_esclarmonde_desc: "曾经，埃丝克拉蒙德的宫廷是诗歌、爱情和艺术的中心。在她的耐心指导下，奥克西塔尼亚已经发展成为一个宽容与文明的要塞。\n然后，野蛮的法兰西人来了。他们以为埃丝克拉蒙德会在阿尔比派十字军的攻势面前迅速倒戈，但却惊讶地发现她是一位顽强的卫士和能干的政治家。这个地区遭受了巨大的损失，埃丝克拉蒙德为了生存不得不向“十字军”做出了许多妥协。但她还在这里，只要她在，奥克西塔尼亚就会延续下去。\n\n#bold 你还有时间重整旗鼓，建立新的联盟，但傲慢的法兰西人不会再低估你了。你必须坚强地站起来，拯救你心爱的国家，因为再没有其他人可以做到。#!"
 bookmark_warofprinces_roque: "罗克"
 bookmark_warofprinces_roque_desc: "罗克也许是最有影响力的末卡维亲王之一，他是一个技巧娴熟（但做事很强迫性）的阴谋家和计划者。他保住自己封地的能力为他赢得了勒森魃$pod_clan$勉强的尊重，他在“暗影再征服”中扮演了自己的角色。他对阴谋和阴谋的迷恋迫使他暗待，看他能否在摧毁敌人之前驾驭他们成为有用的东西。\n\n罗克也是解密会的杰出追信徒，他认为暗影再征服带来的混乱预示着对所有$pod_cainites$来说又一个伟大的毁灭时代。\n\n#bold 你的未来是不确定的，但如果你能控制住你的心魔，你可以在未来几个世纪里继续成为纳瓦拉的主要驱动力……甚至可能在半岛上扮演重要角色。#!"
 bookmark_warofprinces_natalya: "娜塔莉娅·斯维亚托斯拉夫"
 bookmark_warofprinces_natalya_desc: "娜塔莉娅是一位俄罗斯王族的女儿，在君士坦丁堡接受教育，她永远爱上了这座城市。她的行政技巧让她引起了布鲁赫的注意，布鲁赫给了她$pod_Embrace$，她欣然接受了。\n\n娜塔莉娅全身投入的想要建立一个新的迦太基，她的$pod_clan$之理想与米迦勒之幻梦的化身。十字军征服君士坦丁堡后，她逃到了伊庇鲁斯暴君那里，在那里她成功地成为了帖撒罗尼迦亲王。她将自己的城市视为有用的退路，但她梦想着从阿丰佐和拉丁野蛮人手中夺回君士坦丁堡。\n\n#bold 你也许是创造一个能与迦太基和君士坦丁堡匹敌的乌托邦的最后希望。尊重过去的成就，并利用它们来建设你梦想的更美好的未来。#!"
 bookmark_warofprinces_jasmin: "帕尔马的贾斯明"
 bookmark_warofprinces_jasmin_desc: "一位来自穆瓦希德王朝的哈基姆之子女术士。她设法重振[Glossary('阿什拉派','game_concept_ashirra_desc')]在巴利阿里群岛的信仰，但她在让他们领会基督教的威胁这一方面却不太成功。巴利阿里群岛的吸血鬼们享受着与主流的$pod_cainite$社会的隔离，形成了一个由隐居者、怪人和不合群者组成的混杂集合。"
 bookmark_warofprinces_durga_syn: "突伽·辛"
 bookmark_warofprinces_durga_syn_desc: "雷伏诺$pod_clan$的善良导师也许是$pod_cainite$俄罗斯的唯一正义力量。这片土地，被芭芭雅嘎和她的影幕所永远诅咒着，只会给那些反对暴虐巫婆的人带来痛苦和绝望。尽管有这些可怕的可能性，突伽·辛从未动摇，她的宫廷已经成为任何试图从芭芭雅嘎的下仆手中夺回这片古老土地的人的希望灯塔。如果突伽不能履行她的职责，影幕肯定会将整个欧洲卷入其中。\n\n#bold 让雷伏诺聚集在你明智的领导周围，打败芭芭雅嘎的疯狂仆从，为俄罗斯带来希望！#!"
 bookmark_warofprinces_maatkare: "玛阿特卡拉"
 bookmark_warofprinces_maatkare_desc: "玛阿特卡拉是是赛特之子$pod_clan$的圣显者之一，作为赛特之妾，拥有近乎是倾世无双的美貌。她拥有巨大的影响力，统治着马格里布的降世鸷巢神殿，在那里她小心翼翼地将赛特的影响力传播给当地误入歧途的$pod_cainites$们。\n穆斯林伊比利亚持续的崩溃产生了连锁反应，破坏了该地区的稳定。玛阿特卡拉现在正要好好利用下这个事实，在她的脑海中有了一个建立从伊比利亚到埃及的统一赛特之子$pod_clan$的梦想……\n\n#bold 不管是否误入歧途，你都是赛特对他所有子嗣不死之爱的化身。你会向他们说明这一点，且他们会牢记于心。因为他们别无选择。#!"
 bookmark_warofprinces_matasuntha: "玛瑟逊莎"
 bookmark_warofprinces_matasuntha_desc: "玛瑟逊莎是老冈格罗中的一个传说。作为游牧民族匈人的领袖，她几乎让罗马人跪在她面前，直到403年阿尔卑斯山的一场天时不测才勉强让停下脚步。然后她被遗忘了，最近从[Glossary('蛰眠','game_concept_torpor_desc')]中醒来，发现这个新世界变得奇怪而可怕。她曾经骄傲的$pod_clan$已经分裂，被十字架的仆众反推了回去，年轻的一代已不知道她的名字和她过去的功绩。然而，还有希望，当蒙古汗帐横扫草原时，玛塔孙塔认为他们是她子民的合格继承人。\n\n#bold 让草原上的其他冈格罗看看罗马在几个世纪前为什么向你求饶。随后，确保软弱的西方$pod_cainites$再也不会忘记你的名字。#!"
 bookmark_warofprinces_dionysius: "狄奥尼修斯"
 bookmark_warofprinces_dionysius_desc: "狄奥尼修斯是一个平和、朴素的人，在他还是人类的日子里，他加入了对珀耳塞福涅的崇拜，徒劳地试着去寻找他死去的亲人。这种对死亡的迷恋，使他成为了卡帕多西亚族$pod_Embrace$的对象。然而，成为不死族并没有改变狄奥尼乌斯多少，他拒绝追随他$pod_clan$那病态的方式，反而更愿意关心凡人和死者。因为他在编纂人性这一面上功不可没，由此吸引了大量的追随者。\n他所赢得的巨大尊重使他被选为雅典的亲王，这一职责至今仍由他担任。他的城市现在接纳了大量来自君士坦丁堡陷落的难民……他们哭着喊着要报仇。\n\n#bold 你将不得不平衡你的信念，和你对人性的信仰来应对希腊当前的混乱。也许你仁慈的领导方式是唯一的良药，可以阻止阻止第四次十字军东征所带来的无休止的疯狂。#!"
 bookmark_warofprinces_petaniqua: "佩塔尼奎亚"
 bookmark_warofprinces_petaniqua_desc: "佩塔尼奎亚曾被称为奥林匹娅斯，是马其顿腓力二世的妻子，亚历山大大帝的母亲。大多数人不知道的是，她也是西布莉密教的成员，一位疯狂的巴力族玛土撒拉。在她的“女神”的养育下，佩塔尼奎亚渐渐憎恨所有的男人，除了她的儿子，为了其她许要了这个世界。他得到了这个世界，但却被剥夺了永恒，只因西布莉禁止佩塔尼奎亚把亚历山大变成吸血鬼。\n这是她理智逐渐衰退的开始，这种衰退一直持续到今晚。从那以后，佩塔尼奎亚进入了更深的地狱，与那些最好不为人知的实体签订了协议。她甚至不知道原因。\n\n#bold 一定有办法找到他。或者是一位强大到能让他复活的实体。然后，他将成为世界之王，一切将再次完美。#!"
 bookmark_warofprinces_absalon: "阿布萨隆"
 bookmark_warofprinces_absalon_desc: "他曾是隆德的大主教，也是丹麦最有权势的人之一，国王和$pod_cainites$都对他爱不释手。就算死亡降临，他转化成为国家的吸血鬼主宰是轻而易举。他早期的统治是成功的，他小心地平衡了南方的梵卓和北方的野蛮冈格罗。直到一场针对温德的睿魔尔的战役让阿布萨隆分心了几十年，因为他发现了一个可以改变他命运的强大秘密。\n没有他的细心指导，丹麦成了小军阀和流氓冒险家的牺牲品。但这不会持续太久，因为阿布萨隆现在准备回到他的土地上。\n\n#bold 夺回你与生俱来的权利，但小心地打出你的牌，因为南方和北方都希望你离开。#!"
 bookmark_warofprinces_helena: "特洛伊的海伦"
 bookmark_warofprinces_helena_desc: "许多军队都为了世界上最美丽的女人的一瞥而战斗。但海伦从来就不是一位陷入困境的少女，因为她很早就[Glossary('吸榨','game_concept_diablerie_desc')]了她的[Glossary('尊长','game_concept_Sire_desc')]也是俘获她的人——米诺斯。吸血鬼政治圈很适合她，她在迦太基找到了庇护和爱。\n然而，爱并不能长久，当她意识到帮助迦太基抵抗罗马是徒劳的时候，她把自己的新家出卖给了拉丁人。而迦太基沦陷后唯剩的幸存者之一，斯巴达的墨涅拉俄斯，从那时起就在寻找毁灭她的机会。他们之间的冲突已经延续了几千年，成为了传说，但双方都没有占据上风。无数城市因此战争而沦陷。\n\n#bold 杀了墨涅拉俄斯。抹去他存在的一切痕迹。这样，他们所有人都会爱上你，并而绝望。#!"
 bookmark_warofprinces_tabitha: "泰贝莎·马斯里"
 bookmark_warofprinces_tabitha_desc: "当穆斯林国家在再征服前崩溃时，阿刹迈$pod_clan$派出了一支最优秀的战士试图阻止入侵。在泰贝莎·马斯里的领导下，他们已经在巴达霍斯安家，并打算尽可能长时间地控制这座城市。泰贝莎并不是一位狂热者，她接受那些该战斗的人想逃跑而不是战斗。到目前为止，她已经接受了苏丹巴德尔的统一呼吁，但任对格拉纳达的统治者心存疑虑。她知道不统一会给虔诚的信徒带来末日，所以她的监视行动只有她自己知道。\n\n#bold 你的使命很简单：顶住基督教的再征服，让他们为每一寸占据的土地付出代价。接下来，也许，得知苏丹巴德尔的真正目的……#!"
 bm_1375_patronwar: "赞助之战"
 bm_1375_patronwar_desc: "这个剧本是按照我们的赞助者的意愿制作的，并不呈现跑团原作。黑死病之后，血族社会陷入混乱。随着血液供应的枯竭，许多吸血鬼进入了蛰眠状态，还有一些被消灭了。当人类从浩劫中挣扎回来时，经历了黑死病的血族们在灾难之后建立了新的帝国和王国。"
 bookmark_patronwar_cecil: "塞西尔"
 bookmark_patronwar_cecil_desc: ""
 bookmark_patronwar_lvcivs: "卢基乌斯"
 bookmark_patronwar_lvcivs_desc: ""
 bookmark_patronwar_seitheach: "赛依赫"
 bookmark_patronwar_seitheach_desc: ""
 bookmark_patronwar_chrysantha: "基桑塔"
 bookmark_patronwar_chrysantha_desc: ""
 bookmark_patronwar_zethraeus: "齐特雷"
 bookmark_patronwar_zethraeus_desc: ""
 bookmark_patronwar_eden: "伊甸"
 bookmark_patronwar_eden_desc: "绑架凡人（特别是优秀的生理标本，强壮的，美丽的，等等）会引起人们的注意；特别是当大多数被绑架的人被发现时……已是遗体。死者似乎被残忍地实验过；他们的一些肢体或器官被扭曲得几乎无法辨认。唉，好助手是很难找的，那些伊甸“信赖”的人有（雇佣）任务处理这些失败品时，通常只是把尸体扔在一个随便的地方，假设它们只是被算作该地区的更多谋杀事故（凡俗的那种）。然而，任何对易变术的影响有一点了解的人都会保有怀疑。"
 bookmark_patronwar_loukios: "卢基奥斯"
 bookmark_patronwar_loukios_desc: "一位有名望的罗马百夫长，秘密地信仰着伊西斯女神密教。在阻止罗马被哥特人部落瓦解的那些年里，当战争开始变得不可挽回时，卢基奥斯离开了。他越来越迷恋埃及神话，为了更好地了解他的女神，他去了筛沙之乡朝圣。不幸的是，他没有找到他所追寻的知识——只找到古蛇的信徒。赛特在古庙里迎接他。他对他对罗马军队的了解很感兴趣。"
 bookmark_patronwar_ciaran: "基厄兰"
 bookmark_patronwar_ciaran_desc: "基厄兰是一个爱尔兰旅行者，或者更准确地说，是一位爱尔兰流浪者（原文的字面意思为“走路的人”）。他是一个23岁的年轻人，他只是做他需要的事情来生存并支撑他的家庭。这通常意味着撒谎和欺骗，因为他没有很多其他技能。虽然有着不诚实的本性，他还是非常顾家之人，而且他把所有的爱尔兰流浪者看作是他的家庭。他几乎同样尊敬任何一个游牧民族。这就是他为一个奇怪的印度斯坦旅行者提供住所的原因，该人称自己为维斯瓦纳坦。\n\n维斯瓦纳坦是一位雷伏诺$pod_clan$的吸血鬼玛土撒拉。随后他们的营地很快得遭到了当地人的袭击，而爱尔兰人也受了致命伤。因此维斯瓦纳坦违背了自己的原则，$pod_Embrace$了基厄兰，救了他一命。他教会他矛盾之路，并警告他不要做他刚刚做过的事情。然后就走了。"
 bm_1230_inquisitor: "黑暗时代：裁判官"
 bm_1230_inquisitor_desc: "公元1230年。在一群强大的怪物猎人的带领下，神圣教廷终于意识到了吸血鬼的威胁。这些英雄组成了一个崭新的，隐秘的，名为暗影裁判所的组织，他们是第一批试图重新征服夜晚并击退恐怖之物的人类。摆在他们面前的目标是艰巨的，而这些被诅咒的吸血怪物有着长达数世纪的时间来巩固自己且随时能反击。如果所谓的“裁判官”的牺牲会人类的美好未来铺平道路，那么他们就会像烈士一样牺牲。他们为同一个目标而战，这是任何吸血鬼都无法比拟的。\n\n#bold 你就是这无知世界的挽魂之战的唯一希望。#!"
 bookmark_inquisitor_gauthier: "戈捷·德·丹皮尔"
 bookmark_inquisitor_gauthier_desc: "戈捷是一个小法兰西伯爵的第三子，他在很小的时候就听到了天主的召唤，并以他唯一知道的方式回应了它：战斗。在第三次十字军东征中，他第一次遇到了一位吸血鬼，这让他看清了现实，此时他聚集了一群虔诚的骑士，他们一心要与邪恶作斗争。这足以让他成为暗影裁判所的创始人，在那里他是所有军事事务的领导者。戈捷是一位令人生畏的战士，也是一位极具魅力的领袖，但如今他年事已高，他开始担心自己死后，裁判所将面临怎样的命运。\n\n#bold 你的丰功伟绩已化为过往云烟，但你还有时间确保亚柯骑士比你活得更久。这是你服侍天主的漫长一生中最后的职责。#!"
 bookmark_inquisitor_leopold: "利奥波德·冯·穆尔瑙"
 bookmark_inquisitor_leopold_desc: "利奥波德是冯·穆尔瑙家族的次要后裔，体弱多病，被诅咒拥有一种奇怪的能力：能够真正的“闻”到邪恶的力量。头脑敏锐的利奥波德并没有害怕它，而是利用他的天赋帮助揭露了几起发生在他家里的吸血鬼阴谋。但他并没有就此止步，他很快就来到罗马，向新成立的亚柯骑士献礼。从那时起，他就成为了暗影裁判所的主要推动力量，召集了所有试图与各种形式的邪恶作斗争的人。他的家族在他身后支持，利奥波德也许是裁判所最强的支柱，领导着所有夺回夜间的努力。\n\n#bold 穆尔瑙家族立场很坚定，且巴伐利亚已经确保，但这仅仅是战斗的开始。在最后一只吸血鬼被赶出天主的光之前，你不能停下。#!"
 bookmark_inquisitor_maria: "玛利亚·伊马库拉达"
 bookmark_inquisitor_maria_desc: "圣约翰修女会的现任领袖并不是该修士会的创始人，但她的意志与蒙福的前任修女特蕾莎一样坚定。称她个人强大是在暗示教宗只有一点点神圣。在经历了几次经验不足的裁判官的失败后，玛利亚·伊马库拉达决定亲自前往英伦诸岛，希望能找到这个臭名昭著的吸血鬼“神王”，其可能统治着英伦诸岛。有了她坚定的信仰和裁判所其他修士会的支持，玛利亚准备教会这个敌人世上只有一个神。\n\n#bold 你确定英格兰是吸血鬼活动的中心。发现并摧毁它将是对裁判所的巨大恩惠。你将见证神王陨落。#!"
 bookmark_inquisitor_vittoria: "维特多利亚·圣蒂尼·迪·帕尔马"
 bookmark_inquisitor_vittoria_desc: "维特多利亚是一位智力超常、对天主有强烈爱的女人，她是红修会的非正式领袖，也是暗影裁判所的研究人员。她拥有一种不可思议的直觉，知道什么时候打破规则，什么时候准确地按照东正教方式行事。因此，她显然是最重要和最危险任务的人选：清除意大利本身的吸血鬼影响，保护圣座。随着维多利亚发现教廷间越来越多超自然腐化，她发现任务将比预想的更加复杂……\n\n#bold 你决心拯救教廷，而最好的方法就是揭露和消灭意大利的吸血鬼。你已经确定了两个主要目标，一个是米兰所谓的枢机主教，另一个是在罗马嘲笑教皇的憎恶之物……#!"
 bookmark_inquisitor_aignen: "善书者艾格尼恩"
 bookmark_inquisitor_aignen_desc: "欧西坦间谍首领是神目的首领，该修士会是裁判所的眼与耳。艾格尼恩曾是罗德里格·德·纳瓦拉的中尉，并当该朋友拒绝加入暗影裁判所时而与其决裂。艾格尼恩哀悼他失去的友谊，但他知道圣座将需要一个足智多谋的间谍的强大力量。前盟友对他不屑一顾，新盟友仍对他不信任，艾格尼恩走着有所用处和被视异端之间的孤独道路。\n\n#bold 法兰西是你的家，你知道这里孕育了吸血鬼力量。清洁派异端证明了这一切。与你能聚集的少数朋友，你必须采取行动来控制局势，并希望证明你对暗影裁判所有用。#!"
 bookmark_inquisitor_rodrigue: "罗德里格·德·纳瓦拉"
 bookmark_inquisitor_rodrigue_desc: "罗德里格是第一位接触到不死族的基督徒，他活了下来，然后选择拿起武器与之对抗。他是纳瓦拉的一个小贵族，正是在清洁派异端期间，他目睹了世界上真正的邪恶。从那时起，罗德里格就一直在疯狂地试图摧毁任何见到的吸血鬼衍生物……在他偏执的头脑里，这几乎是每个人。因此，他拒绝加入暗影裁判所，并按照自己的方式行动，与圣雅各伯之剑受其支配。\n\n#bold 他们到处都是。暗影裁判所可能是盟友，但你不能冒险。如果他们想帮忙，那很好，但你要用你自己的方式和条件来拯救伊比利亚。#!"
 bookmark_inquisitor_bayezid: "巴耶齐德"
 bookmark_inquisitor_bayezid_desc: "曾是卡洛梅娜选民的劣族$pod_cainite$斯坦尼斯拉夫的[ghoul|E]奴隶，巴耶齐德和他的兄弟巴西尔发现他们的鲍格米勒信仰受到了不死族利益的侵蚀。1204年，斯坦尼斯拉夫在米迦勒的幻梦的破灭之中被毁灭，甘滕宾兄弟也从他们的血缚中被解放。从那时起，他们就称自己为“卡洛梅娜的弃民”，并带领着鲍格米勒的信徒在波斯尼亚各地攻击吸血鬼。\n为了增长势力，巴耶齐德认为他应该制造更多像他一样的[ghoul|E]猎人。\n\n#bold 卡洛梅娜，该隐的孪生姐妹，期望该隐的不死族子嗣被毁灭，而你就是那工具。#!"
 bookmark_patronwar_jose: "何塞"
 bookmark_patronwar_jose_desc: "何塞于凡生在伊比利亚半岛北部某处的鱼贩子家庭，但他早年的大部分时间都是在街上惹事。他比大多数同龄男孩都要大，并利用这种体型来吓唬其他孩子。他在青少年时期就知道人们会花钱买信息，所以他开始尽可能多地收集信息，通过偷听、谨慎跟踪或单纯的恐吓来进行勒索或交易。他最终成为一个年轻的成年人，在萨里亚市经营一个小的信息圈，在那里他被一个来访的吸血鬼注意到。他注意到了何塞的才能，并觉得他能成为完美的候选者。何塞和他的尊长之间的关系很不稳定，最后何塞[Glossary('吸榨','game_concept_diablerie_desc')]了长者。\n\n在13世纪，何塞接管了拉科鲁尼亚公国，并向自己承诺，他将以心兽的名义统治伊比利亚半岛。"
 bookmark_patronwar_hannibal: "汉尼拔"
 bookmark_patronwar_hannibal_desc: "在第二次布匿战争期间，罗马父母会告诉他们的孩子：“汉尼拔在门外”，以此来吓唬他们。有传言说他在迦太基被布鲁赫的玛土撒拉特洛伊尔初拥，但他是在城市被摧毁后是幸存下来还是与城市一起灭亡，这一点仍不得而知。有些人甚至质疑是否真有一位汉尼拔。是有的。汉尼拔在哈图沙的废墟中从蛰眠中醒来，回到了他的祖屋，从那里他有一个想法，而且只有一个想法：摧毁——罗马——或者类似的东西。"
 bookmark_patronwar_antariksha: "案陀梨娑·旃陀罗"
 bookmark_patronwar_antariksha_desc: "足够古老到可能真的是《梨俱吠陀》中的一人，旃陀罗是《梨俱吠陀》中的月神。案陀梨娑是空间之神。出生于公元前1500年左右，可能在同一时期被初拥。"
 bookmark_patronwar_rostislav: "罗斯季斯拉夫"
 bookmark_patronwar_rostislav_desc: ""
 bookmark_warofprinces_hardestadt: "哈德施塔特"
 bookmark_warofprinces_hardestadt_desc: "哈德施塔特是第一位新生代梵卓亲王，比那些古罗马时代的长者更适应中世纪，来自于一个岌岌无名、毫无价值的世系。这位巴伐利亚军阀利用凡人的神圣罗马帝国将梵卓的中心从罗马转移到了德意志，在这个过程中他巩固了自己在同胞中的掌控。\n哈德施塔特在掌权后极少遇到阻碍，但是一些问题依然存在，例如茱莉亚·安塔西娅治下的顽固的罗马人……\n\n#bold 你有一个强大的领地以及由你支配的子嗣和盟友，抛弃罗马的过往包袱，你将在即将到来的数个世纪定义何为梵卓。#!"
 bookmark_warofprinces_antasia: "茱莉亚·安塔西娅"
 bookmark_warofprinces_antasia_desc: "罗马共和国的女儿是另一个时代的梵卓，那时她的$pod_clan$是永恒元老院的守护者，是$pod_cainites$的无情世界中的乌托邦。那是茱莉亚的完美世界，每位梵卓都有着话语权，而投票权也不分年龄和性别。元老院的法律能成为$pod_clan$未来千年的戒律……随后，卡米拉和他的堕落疯狂来了，紧随其后的是哈德施塔特和他无情的野心。\n于她的法兰克福亲王领，茱莉亚并没有失去将她的$pod_clan$带回其根源的希望。理想主义可能仍然是梵卓$pod_clan$的未来之路。\n\n#bold 你不能让哈德施塔特，或者更糟的卡米拉，支配梵卓$pod_clan$的未来。你必须为元老院与共和国而战！#!"
 bookmark_warofprinces_jurgen: "约根·冯·费尔登"
 bookmark_warofprinces_jurgen_desc: "这位声名显赫的德意志骑士是哈德施塔特的得力助手，尽管他年纪轻轻，但他的名字已经远近闻名。约根是马格德堡的一位严格但公正的统治者，他是完美的梵卓骑士，同时也是勇敢和无情的野心家。\n约根最近对棘秘魑军督领发动了战争，并强迫建立了一个缓冲国。但这还不够，他已经在计划下一次进攻了……只要他能摆脱亚历山大，这个累赘的流亡法兰西亲王。\n\n#bold 你的荣誉就是你的承诺，这是你的野心所遭受的唯一限制。通过火和剑，通过征服和外交，梵卓$pod_clan$总有一天会在你面前俯首。#!"
 bookmark_warofprinces_anna: "安娜·科穆宁"
 bookmark_warofprinces_anna_desc: "作为拜占庭公主，安娜·科穆宁在凡生中被剥夺了她与生俱来的权利……在她亡生又被剥夺了第二次。当她于不死族的君士坦丁堡的权力结构中努力工作时，第四次十字军东征将世界渴望之城的理智表象一把扯下。但安娜是个耐心细致的谋划者，她成功地将诸拜占庭继业者王国中最为强大的尼西亚确保为自己的领地。她对君士坦丁堡过去的梦想和乌托邦毫不在意，这使她与许多其他希腊幸存者产生了隔阂，但她不会让这些阻碍她取得战果。不再会了。\n\n#bold 君士坦丁堡终于在望了。不要让任何人挡在你的天命前，它最终将属于你。#!"
 bookmark_warofprinces_anadja: "阿娜佳"
 bookmark_warofprinces_anadja_desc: "作为一个波斯商人的女儿，阿娜佳注定要过着平淡无奇的生活，直到受人尊敬的贝利撒留和谢巴赫看上了她，把她当作自己的孩子抚养。有了这样令人印象深刻的导师们，阿娜佳很快就适应了$pod_cainite$的世界，并很快被一个秘密的密教组织注意到，认为她是他们应许的救主。\n从那时起，阿娜佳已经成为亚美尼亚最有影响力的吸血鬼，并且仍然在接受她的“父母”和密教组织的指导。她现在已经长大到可以独立统治了，只有时间能证明她是否能达到对她的崇高期望。\n\n#bold 你已经为这一时刻做了专业的准备。是时候写下你自己的故事了，该结局只能由你来讲述。#!"
 exit_char_window: "返回"
 bm_1230_warofprinces_sub_ventrue: "梵卓氏族"
 bm_1230_warofprinces_sub_ventrue_desc: "梵卓是高贵的黑夜领主和女士们，其自称是该隐之子世界的统治者。长期以来，他们一直是最自豪的吸血鬼世系之一，努力维持着荣誉、优雅的行为和领导的声誉。长期以来，贵族责任感充斥着这个家族，并伴随着一种真诚的信念，即梵卓知道什么对每个人都是最好的。\n最近一连串的挫折困扰着这些蓝血者，罗马的沦陷，以及法兰西——他们的据点之一——的丢失。尽管如此，梵卓氏族仍然统治着中世纪的夜晚。如它本该是。\n\n#bold 梵卓氏族的霸权是不可妥协的。教他们晓得。#!"
 ventrue_sub_bookmark: "梵卓"
 lasombra_sub_bookmark: "勒森魃"
 bm_1230_warofprinces_sub_lasombra: "勒森魃氏族"
 bm_1230_warofprinces_sub_lasombra_desc: "阴暗的掠夺者和无情的社会攀附者，勒森魃为个人的成功而存在，为个人的胜利而争斗，而不是仅仅为了戴上皇冠或坐上王座。他们相信强权即正义，并愿意牺牲一切来实现他们的目标。\n作为一个将精神信仰作为工具而不是寻求开明启蒙的氏族，他们善变的忠诚目前被困扰着暗影之海的大规模内战所凸显，他们那曾经横跨地中海的帝国。穆斯林在伊比利亚与基督徒作战，基督徒在意大利与异教徒作战，年轻人同时在各地与他们的长者作战。当勒森魃自相残杀时，其他氏族都松了一口气，他们知道若他们统一起来，他们能取得怎么样的成就。\n\n#bold 勒森魃氏族将于同族的血液中被重新铸造。溅血，并征服。#!"
 bookmark_warofprinces_lucita: "露西塔·德·阿拉贡"
 bookmark_warofprinces_lucita_desc: "作为阿拉贡国王阿方索二世的女儿，露西塔从小就渴望着独立和自由。她强烈的自立性和不屈不挠的意志让勒森魃枢机安布罗西奥·路易斯·蒙卡达无比欣赏并初拥了她。从那时起，露西塔就成了勒森魃$pod_clan$的新星和她[Glossary('尊长','game_concept_Sire_desc')]的骄傲。尽管她已经获得了赞扬和许多成就，这位凶猛的公主已经又再一次渴望着，更多，更多的自由……这违背了她[Glossary('尊长','game_concept_Sire_desc')]和$pod_clan$对她的期望。\n\n#bold 没人能把你关入笼中太久，露西塔。争取你的独立，即使你要为此激怒你的整个$pod_clan$。#!"
 bookmark_warofprinces_moncada: "安布罗西奥·路易斯·蒙卡达"
 bookmark_warofprinces_moncada_desc: "安布罗西奥·路易斯·蒙卡达是一个有野心、有才华、有信仰的人，生前是马德里的大主教。不出意外，蒙卡达充分利用了他的地位。然而，令许多人惊讶的是，他在这样做的同时，还坚持着严格的僧侣生活。他在信仰上是毋庸置疑的，在信念上是不可动摇的，在为他认为的天国功业上权力使用是坚决的。$pod_Embrace$对蒙卡达的改变比人们想象的要小。他很快就成为了暗影再征服的主要推动力，他在勒森魃$pod_clan$内部的影响力也在稳步上升，但他寻求权力的原因并没有改变。这不是为了蒙卡达（那个可怜的肉体外壳）的荣耀，而是为了天主的荣耀。\n\n#bold 你注定要统治伊比利亚和勒森魃$pod_clan$本身。天主选择了你担任祂的神圣大任，你将遵从祂的意愿，就像你一贯所做的那样。#!"
 bookmark_warofprinces_badr: "巴德尔"
 bookmark_warofprinces_badr_desc: "随着伊比利亚勒森魃内战的进行，被称为[Glossary('阿什拉派','game_concept_ashirra_desc')]的安达卢西亚$pod_cainites$找到了一个新的领袖。格拉纳达的巴德尔。这位神秘的苏丹采取了强硬的立场，并将不同的泰法诸国召集到她的功业中。她的努力使[Glossary('阿什拉派','game_concept_ashirra_desc')]社区产生了分歧，因为许多人认为她并不比基督徒好多少，但仍然设法减缓了可怕的再征服。随着她的名气越来越大，一些人开始对围绕她的谜团感兴趣……而其中有数个好奇的灵魂已经遭遇了痛苦的结局。巴德尔用阴暗的铁拳进行统治，但同样还是铁拳。\n\n#bold 你必须战胜再征服。这是你野心的跳板，那些阻挡你的人有祸了。#!"
 bookmark_warofprinces_lucius: "卢修斯·埃利乌斯·塞扬努斯"
 bookmark_warofprinces_lucius_desc: "卢修斯·埃利乌斯·塞扬努斯曾经是罗马禁卫军的一员，差点儿就成为了皇帝，但在他实现自己野心之前生命就截然而止。在台伯河岸边，据说是母狼发现罗穆卢斯和雷穆斯的地方，一名勒森魃从水流中拖出了塞扬努斯的尸体。在发现生命最后的余火还在他的胸中闪烁后，这位长者初拥了他。她离开时对其说：“就像你命中注定的那样，你必将再次掌权，消灭掉那些挑衅你的领主。你有超越主人的潜力，切记要明智的使用它。”从那时起，本该成为皇帝的他现在寻求成为黑夜的帝皇，即将在这场盛大游戏中走出第一步……\n\n#bold 天亮之前，你要运用力量去威胁你最强大的同类。确保这次你的真正命运不要再被打断！#!"
 bookmark_warofprinces_gratiano: "格拉齐亚诺·迪·维罗纳"
 bookmark_warofprinces_gratiano_desc: "格拉齐亚诺·德·维罗纳是勒森魃本人的最后一个子嗣，而且还很年轻，他在凡生中是一个不起眼的意大利贵族，导致许多人想知道为什么该[Glossary('上古耆宿','game_concept_antediluvian_desc')]如此青睐他。但格拉齐亚诺知道答案：他生而伟大。维罗纳确信自己的重要性，现在正公开反对他的“长兄”蒙塔诺，即勒森魃$pod_clan$的现任摄政。在维罗纳的宫廷里，格拉齐亚诺清楚地知道，除了他$pod_clan$中最年轻的家伙，他被所有的人鄙视和嘲笑。但是，即使是这样一个小而弱的权力基础也会随着时间的推移而增长，有一天晚上，格拉齐亚诺可能就是那个嘲笑他们所有人的人……\n\n#bold 你必须迅速赢得尊重和权力，若你要挑战你“兄长”的头衔。接着，可能是时候和你的“父亲”本人谈谈了……#!"
 bookmark_warofprinces_alfonzo: "威尼斯的阿丰佐"
 bookmark_warofprinces_alfonzo_desc: "威尼斯的阿丰佐是纳尔塞斯最有天赋的孩子之一，两个多世纪以来，他一直是君士坦丁堡最杰出的$pod_cainite$。众所周知，阿方索煽动了1185年的拉丁人暴动，他还利用第四次十字军东征，宣称自己是世界渴望之城的亲王，来为他赢得了巨大的权力……以及许多流亡的希腊$pod_cainites$永远的敌意。名义上阿丰佐像他的[Glossary('尊长','game_concept_Sire_desc')]一样是$pod_cainite$的追随者，但他更像是冷酷的实用主义者，而且他已发誓效忠暗影之海以保证自身的权力，尽管这些人对他的信仰持着反对意见。不过，未来可能还需要与魔鬼进行许多交易……\n\n#bold 你为确保最大的奖赏而不懈努力。没有人可以从你手中夺走君士坦丁堡。#!"
 bookmark_warofprinces_suleiman: "苏莱曼·伊本·阿卜杜拉"
 bookmark_warofprinces_suleiman_desc: "苏莱曼首先在麦地那接触了穆罕默德，目的是让他成为对抗麦加强大的$pod_cainites$的棋子。他本人复述说，在这一时刻，他看到了自身内心获得救赎的可能性，并皈依了先知传播的新宗教。随后，在先知的征服过程中，苏莱曼站在其一方，并成为了[Glossary('阿什拉派','game_concept_ashirra_desc')]的主要创始人之一，以任何方式来欢迎任何愿意继续追随这条道路的穆斯林。到目前为止，他的工作大部分是成功的，[Glossary('阿什拉派','game_concept_ashirra_desc')]从伊比利亚扩至波斯，但他们表面上的团结开始形成裂痕。苏莱曼必须迅速采取行动，以免这种早期的分歧将他的终身事业削弱到一个危险的程度。\n\n#bold 维持[Glossary('阿什拉派','game_concept_ashirra_desc')]的强大和团结，也许勒森魃$pod_clan$本身可能会在某个夜晚得知真相。#!"
 toreador_sub_bookmark: "妥芮朵"
 bm_1230_warofprinces_sub_toreador: "妥芮朵氏族"
 bm_1230_warofprinces_sub_toreador_desc: "妥芮朵是以最美丽、最色情、最诱人、最感性和最有魅力的吸血鬼氏族而闻名。美学家们负责创造吸血鬼的传说，他们用美貌、爱情和肉欲来诱惑和引诱他们的猎物。\n他们也不避讳统治的艺术，直到最近，他们还在可以说在最伟大的吸血鬼帝国，君士坦丁堡的幻梦中掌握着权力。它的衰落动摇了这个氏族，但对法兰西的一次适时的接管意味着妥芮朵有了一个新的，不过还是很脆弱的驻点。除了法兰西，妥芮朵在整个欧洲和中东都拥有较小的权力地位，并且仍然是该隐之子世界的主要推动力量之一。\n\n#bold 黑夜需要一位新的、优雅但致命的统治者。让世界知道玫瑰也有刺。#!"
 bookmark_warofprinces_salianna: "萨莉安娜"
 bookmark_warofprinces_salianna_desc: "萨莉安娜大约于公元前170年出生在希腊，是古代诸神的圣女，她从未原谅过她的[Glossary('尊长','game_concept_Sire_desc')]，即强大的米迦勒，因为他在精神上玷污了她的纯洁。她拒绝帮助他实现关于永生的疯狂幻梦，并独自出走，但在定居巴黎之前的几个世纪中，她只见得背叛和欺骗。她终于在这里找到了成功，并努力使法兰西与它的吸血鬼霸主亚历山大一起繁荣。\n然后她又被背叛了，因为亚历山大在愤怒中杀死了她心爱的子嗣。这是最后一根稻草。她在亚历山大本人的子嗣的帮助下策划了一场政变，将梵卓赶出了法兰西。现在，萨莉安娜是该地区的真正掌权者，但她的控制力仍然很弱……而亚历山大还未死。\n\n#bold 迅速巩固你的新力量。再也没有人能够背叛你了。#!"
 bookmark_warofprinces_isouda: "伊思妲·德·布莱斯"
 bookmark_warofprinces_isouda_desc: "伊思妲从不喜欢她作为小贵族的女儿所面临的命运。她非常痛恨这一点，以至于她狠狠地咬了一个潜在的追求者，以确保他明白她的意思。伊思妲在成为$pod_cainite$之后并没有什么变化，她的优雅和美丽几乎没有掩盖住近乎野化的攻击性和残忍……这使她能够在她年轻的时候就获得作为爱之女王的权力。但这对伊思妲的野心来说太小了，她打算利用萨莉安娜对法兰西不稳定的控制来实现自己的目的。安茹的女王不是一朵带刺的玫瑰，她是一朵带尖牙的玫瑰。\n\n#bold 在外表上，你是美丽的，优雅的，甚至是宜人的。在内心深处……你知道他们都是被你随意利用和抛弃的棋子。你的血腥扬升仅仅只是开始。#!"
 bookmark_warofprinces_melinda: "梅琳达·加尔布雷思"
 bookmark_warofprinces_melinda_desc: "梅琳达的过去被蒙上了一层神秘的面纱，唯一可以确定的是，她在被海伦绑架之前出生在西班牙。即使以玛土撒拉通常冷酷无情的$pod_Embrace$方式来说，梅琳达的那段经历也是肮脏而残酷的，后来海伦感到厌烦，就把她独自留在这里自生自灭。从海伦“养育”的熔炉中走出来的梅琳达是一个无情的幸存者，除了自己的野心，她对任何事情都不屑一顾。一个真正的掠夺者现在在伊比利亚被释放出来，如果她必须在身后留下一堆尸体才能扬升，那就这样吧。\n\n#bold 你从海伦那里学到了很多东西，你知道真相：这个世界是一个血腥的战场，只有少数人可以茁壮成长。你将是其中之一。#!"
 bookmark_warofprinces_rafael: "拉斐尔·德·柯拉蓉"
 bookmark_warofprinces_rafael_desc: "拉斐尔在年轻时就被教会收留，很快就发现了他在密谋方面的才能。他没有什么技巧，也不热心，但他还是利用他的阴谋对当地的僧侣取得了一些影响，过上了舒适的生活。然后有一天晚上，卡利斯蒂–卡斯蒂略来了。这个异教女巫迷上了僧侣们的一个雕塑……拉斐尔谎称是他的作品。她因此初拥了他，并要求他再做一些这样的艺术，而这个骗子显然没有能力做到这一点。她很生气，差点当场杀了他，直到拉斐尔说他的欺骗行为也算是一种艺术形式，才求得亡生。卡利斯蒂觉得很有趣，就同意了，让他在$pod_cainite$世界中自生自灭。\n\n#bold 你不知道你到底是怎么活下来的，但你做到了。现在你需要了解这个陌生的新世界。也许还有其他的傻瓜可以欺骗？#!"
 bookmark_warofprinces_karl: "青之卡尔"
 bookmark_warofprinces_karl_desc: "作为一位北欧的说书人，卡尔与勇敢的比约恩一起南下寻找财富和冒险，在亚历山大城被一个不信神的妥芮朵初拥了。在与他的[Glossary('尊长','game_concept_Sire_desc')]学习了一段时间的阿拉伯人故事后，卡尔踏上了回家的路，利用他无尽的日子对北欧传统的所有故事进行编目。当基督徒来临时，卡尔奋力抵抗，但很快预测到了不祥之兆。因此，他搬到了芬兰，创建了“自由邦”，这是最后的堡垒，他心爱的故事在这里得以延续……但即使在这片偏远的土地上，十字的阴影也在增长。\n\n#bold 你为一个比自己更伟大的功业而战，只要你有能力，你就会捍卫你的人民的传承。但你也知道大多数北欧故事的结局都…… #!"
 bookmark_warofprinces_rosamund: "伊斯灵顿的罗莎蒙"
 bookmark_warofprinces_rosamund_desc: "罗莎蒙是一名诺曼小贵族的女儿，自出生之后就一直被培养着要做大事。罗莎蒙幼时被选进了伊思妲·德·布莱斯的宫廷，在那里面茁壮地成长。她学会了如何表现得既谦虚而又迷人，用智慧与人辩论，用微笑醉人心魂。在她十七岁生日那天，她被叫到伊思妲面前来祝贺。随后她的女主人告诉了她其命运：加入$pod_cainites$的行列。从那时起，罗莎蒙就被大王庭的强大梵卓统治者亚历山大本人深深迷恋上了，并且他还在流亡马格德堡时把罗莎蒙一起带走了。这位残酷的玛土撒拉愈夜变得发疯，罗莎蒙正在寻找任何她能找到的逃跑方式……\n\n#bold 趁现在还来得及，你必须得摆脱亚历山大。也许风度翩翩的马格德堡公爵约根·冯·费尔登能帮上忙？#!"
 brujah_sub_bookmark: "布鲁赫"
 bm_1230_warofprinces_sub_brujah: "布鲁赫氏族"
 bm_1230_warofprinces_sub_brujah_desc: "布鲁赫是一个以对激进哲学的强烈追求而闻名的战士–学者氏族，他们经常以同样的纪律来训练他们的稚子的战斗和古典学。在古典时代，他们与梵卓平起平坐，在整个地中海地区拥有巨大的权力地位。后来，他们的乌托邦迦太基被毁于可恨的罗马人之手。现在，这个氏族堕落了，仍在哀悼失乐园，并从贤明的统治者衰落到今晚越来越常见的小逆徒。\n被他们的愤怒和悲伤所淹没，布鲁赫在已失的功业上大肆抨击，直到他们最终能够找到他们的新命运。一些长者担心，这可能永远不会发生。\n\n#bold 布鲁赫氏族正处于光荣的过去和未知的未来之间的过渡期。像你这样的伟大领袖将会成为决定未来数个世纪他们本我的火花。#!"
 bookmark_warofprinces_bjorn: "比约恩·加里森"
 bookmark_warofprinces_bjorn_desc: "这位可怕的巨人是不列颠群岛最后的[Glossary('英灵战士','game_concept_einherjar_desc')]（维京吸血鬼）之一。比约恩在逃离他的族人对挪威发动的战争败北时滞留在苏格兰，他的目光越来越向西，投向传说中的文兰。但他的魅力和潜伏力量使他成为国内抵抗密特拉的实际集结点。尽管他不愿意再打一场败仗，但比约恩从未放弃过他的朋友，因此将再次为他们拿起斧头。\n\n#bold 你已经习惯了绝望的战斗。但也许这一次还有希望……#!"
 bookmark_warofprinces_leeland: "罗宾·李兰德"
 bookmark_warofprinces_leeland_desc: "这个兜帽之下的男人整个一生乃至亡生都在与暴君斗争。他那坚毅而沾满灰尘的面容在跨越中世纪的几次平民起义中都有出现——他直接参与了各种反对英格兰贵族的农民起义，是一名无政府主义倾向特别强烈的倡导者，经常在军事冲突中奋战在最前线。\n但无论他如何努力，他都无法击败密特拉，那位英格兰的“神王”。在柯克利斯修道院之战中惨败后，罗宾的光环和影响力大大减弱，密特拉正步步逼近，准备一绝后患。在不列颠群岛，自由之光也许很快就会永远熄灭。\n\n#bold 你的功业正义，你的目标准确。这可能不足以赢得胜利，但足以创造传奇。#!"
 bookmark_warofprinces_veronique: "维罗妮克·德·奥尔良"
 bookmark_warofprinces_veronique_desc: "维罗妮克·德·奥尔良是一个多才多艺的女人。她是法兰西$pod_cainites$（甚至更广）的有能政治家，是她的凡人朋友和盟友的坚定捍卫者，是强大的战士，是熟练的治疗师，即使在她极其年轻的时候，也是亲王之战的参与者。\n维罗妮克因她平和的心态和创新的思维而被再造，她总是与社会对抗，无论是凡人的还是吸血鬼的，都是如此。她最近在推翻法兰西亲王亚历山大的过程中发挥了作用，但对残酷的巴黎政治很警惕。因此，她回到了自己的家乡，而法兰西$pod_cainites$则想知道她的下一个意外之举是什么。\n\n#bold 忠于自己的理想，让别人低估了你。他们很快就会明白，有情并不代表软弱。#!"
 bookmark_warofprinces_menele: "墨涅拉俄斯"
 bookmark_warofprinces_menele_desc: "墨涅拉俄斯是公元前13世纪的古希腊国王，他在凡生中被迦太基$pod_cainites$所取得的成就所感动，由于他是一位强大的战士和演说家，很快就沦为旅行外交官的角色。因此，当大背叛来临时，他不在城里，背叛者是一位名叫海伦的美丽妥芮朵。\n他们之间的传奇仇恨从这一天开始。他们在无数的战场上厮杀，在他们的身后摧毁了无数的城市，但他们仍然没有人能够占到上风。墨涅拉俄斯对这场“游戏”越来越厌倦，尤其是当他看到布鲁赫$pod_clan$在他周围分崩离析时。必须得有个结果了，不管它是什么。\n\n#bold 你的怒火终于平息了，但海伦还是必须得被绳之以法。然后，也许是时候治愈布鲁赫$pod_clan$了。#!"
 bookmark_warofprinces_ecaterina: "伊卡捷琳娜"
 bookmark_warofprinces_ecaterina_desc: "在一个男人的世界里，伊卡捷琳娜是一个坚强的女人，在一次差点被强奸的经历中勉强活了下来，在最后一刻被她未来的[Glossary('尊长','game_concept_Sire_desc')]所救。她被他关于迦太基和每个人之间和平共处的乌托邦的故事所吸引，成为了一名狂热的普罗米修斯派。她太年轻了，没有真正的影响力，她很快就为自己制作了一个假身份，作为迦太基毁灭的幸存者，为她赢得了巨大的尊重和名声。\n她最近的举动是$pod_Embrace$一个非常有前途的人，克里斯托夫·罗慕铎，他已经为她的认可付出了很多。他最近在与对抗一位强大的棘秘魑的终末之战后失踪，给她的计划带来了影响。\n\n#bold 找到克里斯托夫并确保他继续支持，那么你的功业就会更接近完成。#!"
 bookmark_warofprinces_yitzhak: "伊扎克·本·亚伯拉罕"
 bookmark_warofprinces_yitzhak_desc: "作为一位犹太拉比的独生子，伊扎克出生在布拉格，他对大多数事件的第一反应是同情和关怀，这一事实催化出了他受到的$pod_Embrace$，他的[Glossary('尊长','game_concept_Sire_desc')]认为这种善意必须保留下来。尽管他现在受诅的状态值得震惊，但伊扎克的不死族化并没有改变他的行为，在欧洲游荡了几年后，他最终安置在了波兰。\n在他的旅行中，他看到了犹太人在欧洲各地受到的待遇，以及许多吸血鬼在夜晚独自徘徊，因简单地效忠于他们的$pod_clan$或世代而被其他人排斥。他的精神责任是创造一个所有生命都能并肩存在的地方，就像天主为他们安排的那样。\n\n#bold 波兰可能是你一直梦想的安全港湾。但许多障碍仍在你的路上。#!"
 bookmark_warofprinces_hektor: "赫克托"
 bookmark_warofprinces_hektor_desc: "赫克托在西罗马灭亡和拜占庭兴起时被再造，他在稚子时期听着希腊和迦太基的荣耀故事度过黑夜。由于对他的[Glossary('尊长','game_concept_Sire_desc')]和他的同辈缺乏对$pod_clan$衰落做出实际行动的意愿感到沮丧，赫克托愤怒地四处寻找他可以把握的东西，以赋予他的存在以意义。\n赫克托召集了一群分割的年轻$pod_cainites$，成功地在帝国组织了一场叛乱，夺取了许多爱琴海岛屿，建立了他的新迦太基。他现在担任这个新国家的独裁者，这是一个混合了希腊民主理想和迦太基政治与宗教的奇怪构造。\n\n#bold 你的乌托邦还很年轻，你即将做出的决定将铸就它的真正身份。#!"
 cappadocian_sub_bookmark: "卡帕多西亚"
 bm_1230_warofprinces_sub_cappadocian: "卡帕多西亚氏族"
 bm_1230_warofprinces_sub_cappadocian_desc: "卡帕多西亚是研究死亡和灵魂的学者，他们经常专注于这些，而忽略了世界上更大的事务。得天独厚的是，他们一般都很平和，对统治权、政治暗杀和其他不死族生活的礼节都不太关心。\n直到最近，卡帕多西亚氏族只在他们同名的地区处有权力地位，除了一些例外。这一事实随着野心勃勃的威尼斯乔凡尼家族的加入而改变。意大利的亡灵术师们在很短的时间内就利用他们相当大的商业影响力，成为地中海各地的重要权力者。\n\n#bold 随着乔凡尼家族的到来，卡帕多西亚氏族似乎将会从重要的结构性变化中受害，或受益。注意不要被那些……所取代#!"
 bookmark_warofprinces_japhet: "雅弗"
 bookmark_warofprinces_japhet_desc: "雅弗是卡帕多西亚$pod_clan$的非正式领袖，无条件地忠于他的[Glossary('尊长','game_concept_Sire_desc')]卡帕多西亚本人。在埃尔吉耶斯领地上，雅弗的权威很强，但他的大多数同胞的隐居倾向限制了他对$pod_clan$的实际权力。更糟糕的是，他必须与他那古怪的、经常受骗的[Glossary('尊长','game_concept_Sire_desc')]和他的宏伟愿景相协调，而后者经常与雅弗更为务实的观点相冲突。\n他仍然没有原谅将乔凡尼家族引入血统的做法，有种种迹象表明这不是一个好主意。这个忠实的儿子越来越认为，自己的“父亲”可能是卡帕多西亚$pod_clan$通往繁荣的最大障碍。\n\n#bold 你必须在这些困难时期领导你的$pod_clan$，并努力减轻你[Glossary('尊长','game_concept_Sire_desc')]的妄想症。这是一项忘恩负义的任务，但只有你能做到。#!"
 bookmark_warofprinces_bela: "贝拉·拉森科"
 bookmark_warofprinces_bela_desc: "贝拉在凡生中受过良好的神学教育，但他从未真正关心过信仰问题。他被一个狂热的忏悔的吸血鬼$pod_Embrace$后，几乎没有改变这一事实，贝拉立刻陶醉在永生的荣耀中。当疯狂的预言家奥克塔维奥告诉他名为库帕拉的实体的伟大时，他发现了自己真正的使命。\n贝拉突然被他的新目标——成为这个黑暗生物的化身——所吞噬，他设法将索菲亚据为己有，这是他走向神化的第一步。在外界看来，拉森科是一个古怪但宜人的亲王。对有见识的人来说，他是对东欧稳定的最大威胁之一。\n\n#bold 你选择库帕拉，库帕拉也会选择你。即使你不得不牺牲整个城市来使其聆听。#!"
 bookmark_warofprinces_apacia: "阿帕西亚"
 bookmark_warofprinces_apacia_desc: "阿帕西亚于凡生时是斯基泰人，被训练成一名战士，并成为古代国王陵墓的守护者，这是一个非常荣耀的职位。其中一个坟墓是一位卡帕多西亚的藏身处，她很快就被初拥了，以继续她的职责，直到永远。\n最终，她的才能被卡帕多西亚本人注意到了，卡帕多西亚任命她为将军，进攻后来成为埃尔吉耶斯的山地堡垒。然而，不久之后，居民们开始反感阿帕西亚对研究和哲学的不感兴趣。事实上，他们中的许多人认为她是$pod_clan$血统的耻辱，因为她仍然顽固地目不识丁。最终，她被要求离开。\n\n#bold 你到达了俄罗斯，在寒冷的西伯利亚汗国被尊称为女王。这些人在精神上与你心爱的斯基泰人如此接近，这赢得了你的心，你将尽力保护他们。#!"
 bookmark_warofprinces_augustus: "奥古斯都·乔凡尼"
 bookmark_warofprinces_augustus_desc: "新被初拥的威尼斯乔凡尼家族的领袖是一位无情的亡灵术师，他是罗马术士的后代。虽然奥古斯都自己是一位非常有能的亡灵术师，但他更多地是作为家族的族长而闻名，这个身份为他赢得了被卡帕多修斯本人初拥的荣誉。\n这一事实使他在$pod_clan$中很少有朋友，大多数人认为他是一个随时准备背叛他们的新秀。已然永生，奥古斯都加强了对其家族的控制，将他们变成了一支纪律严明的军队，随时准备为他效劳。至于他的命令到底是什么，谁也不知道……\n\n#bold 在威尼斯的发展帮助下，你的家族的影响力正在快速增长。很快，你的恩人$pod_clan$的用处就将消失……#!"
 bookmark_warofprinces_ambrogino: "安布罗吉奥·乔凡尼"
 bookmark_warofprinces_ambrogino_desc: "安布罗吉奥是位出生于乔凡尼家族的私生子，通过他的亡灵术掌握，结合他的恶毒和纯粹的野心，他获得了家族长者的注意。当卡帕多西亚$pod_clan$开始初拥家族成员时，他是少数被选中接受迷吻的人之一。因此，他是极少数血统来自卡帕多修斯而非奥古斯都·乔凡尼的乔凡尼$pod_cainites$之一。\n虽然他经常被认为是奥古斯都的右手，但安布罗吉奥的真正热情在于神秘学。他对神格的兴趣使他找到并破译了无数的古代文字和预言，但迄今为止，真理还没有被他发现。\n\n#bold 通往神格的钥匙一定就在这里的某个地方，不找到它你就不能停下来。#!"
 bookmark_warofprinces_claudius: "克劳狄乌斯·乔凡尼"
 bookmark_warofprinces_claudius_desc: "克劳狄乌斯既是奥古斯都·乔凡尼的儿子，也是他的子嗣，在他父亲被接受进入死亡之$pod_clan$后不久就被初拥了。他是一个合格的亡灵术师，也是一个有能力的政治家，经常被认为是奥古斯都的右手……当这个头衔没有给安布罗吉奥·乔凡尼的时候，这个事实在两人之间造成了相当大的紧张气氛。\n克劳狄乌斯是少数几个了解奥古斯都真正计划的人之一，到目前为止，他只表现出对他父亲坚定不移的奉献。他目前的任务是监督威尼斯在堕落的拜占庭帝国中不断增长的财产，确保该家族在这个权力真空中脱颖而出。\n\n#bold 在你的新职责中勤奋努力，也许你最终可以一劳永逸地摆脱那个讨厌的安布罗吉奥。#!"
 bookmark_warofprinces_markus: "马库斯·穆萨·乔凡尼"
 bookmark_warofprinces_markus_desc: "马库斯·穆萨·乔凡尼是克劳狄乌斯最年轻的曾孙嗣，因其敏锐的好奇心和敏锐的智力而被纳入$pod_clan$。被[Glossary('初拥','game_concept_Embrace_desc')]后，他就证明自己是位杰出的学者，最重要的是他是位优秀的历史学家。他对自己有着卡帕多西亚的世系感到自豪，并试图向$pod_clan$中的怀疑者证明自己家族的价值。\n在第一次任命于君士坦丁堡后，马库斯与强大的流亡者拉撒路发生了冲突，并在收集到一些关键信息时成功逃脱。这些早期的成功使他成为家族的新星，而他的新任命可能会使他进一步提升。\n\n#bold 你既是乔凡尼，也是卡帕多西亚，你的两个家族都以把你算作他们的成员为荣。有什么会出错呢？#!"
 tzimisce_sub_bookmark: "棘秘魑"
 bm_1230_warofprinces_sub_tzimisce: "棘秘魑氏族"
 bm_1230_warofprinces_sub_tzimisce_desc: "如果有人说棘秘魑没有人性还是虐待狂，棘秘魑可能会赞扬他们的敏锐，然后证明他们对虐待狂的凡人式定义是可笑的微不足道。作为一个具有诫律和历史的氏族，从人们能记录以来，他们一直都是东欧的主人。\n从他们在特兰西瓦尼亚的居所，他们公开统治他们的小领地，不在乎可怜的牲畜的意见或福祉。最近，对可恨的梵卓和睿魔尔的挫折迫使他们统一在一个更大的军督领之下。但这种新建立的凝聚力是不稳定的，因为怪物之间没有荣耻。\n\n#bold 彻底的支配是棘秘魑氏族与生俱来的权利，其他所有人都应该明白自己的位置：匍匐在你脚下，乞求你的怜悯。而非剩下什么……#!"
 bookmark_warofprinces_myka: "迈卡·维科斯"
 bookmark_warofprinces_myka_desc: "学者，享乐主义者，无情的阴谋家……迈卡·维科斯是所有这些东西，甚至更多。曾经由睿魔尔魔法师培养的迈卡，在君士坦丁堡之幻梦的时代成为了一名有价值的奥伯图斯学者。当第四次十字军东征摧毁了这座城市时，他找到了一种新的信仰，一种无情的激情，并在他巴尔干的收养时家乡找到了新的政治诀窍。\n他的第一个重大成就是在梵卓和他自己的$pod_clan$之间充当了和平缔造者……并在这个过程中为他流亡的希腊同胞们争取到了一片领地作为缓冲国。\n\n#bold 你在和平协议期间的诡计树立了很多敌人，他们不会再低估你了。准备好迎接即将到来的清算吧。#!"
 bookmark_warofprinces_hedeon: "海德翁·雅罗斯拉维奇"
 bookmark_warofprinces_hedeon_desc: "彻头彻底的邪恶和狡猾，海德翁除了自己的权力之外，对任何事情都不关心。他认为所有人类凡生（和$pod_cainite$亡生）都只有在侍奉他时才有价值。他的城堡附近的村民被当作小白鼠，进行各种卑劣的实验。有些人现在在他的地牢里充当活陷阱，或者在他的堡垒的房间里充当活隔板。\n海德翁在波兰的真正影响力一直被他的（正确地说是被吓坏的）邻居们所限制，但克拉科夫的拉兹科利纳亲王最近的一阵[Glossary('蛰眠','game_concept_torpor_desc')]却带来了新的机遇……\n\n#bold 你显然是一位真正的棘秘魑应该是的最好例子。当你登上你的合法权位时，他们将尽情地恐惧和尖叫……#!"
 bookmark_warofprinces_razkoljna: "拉兹科利纳"
 bookmark_warofprinces_razkoljna_desc: "作为斯拉夫酋长的女儿出生，拉兹科利纳的丈夫在自己被$pod_Embrace$之后与她分享了这个迷吻。他们很快就确立了自己作为部落真正领袖的地位，并以最强壮的战士为食，杀死了任何敢于反对他们的人。\n当基督教传教士来到波兰时，这标志着他们的末日开始了。她的[Glossary('尊长','game_concept_Sire_desc')]倒在了入侵者的剑下，但拉兹科利纳设法杀死了其余的攻击者。\n她很快宣称克拉科夫是她的领地，并开始鼓励其发展，同时设法抵御匈牙利的梵卓和她自己的族人。\n\n#bold 你最近在经历了一小段时间的[Glossary('蛰眠','game_concept_torpor_desc')]后重新苏醒了。这个意外的挫折让新的势力在波兰获得了影响力，这是你必须尽快纠正的事情。#!"
 bookmark_warofprinces_shaagra: "莎格拉"
 bookmark_warofprinces_shaagra_desc: "莎格拉是斯拉夫部落沃雷的生育女神、战争领袖和萨满，她被一个欣赏她的智慧和决心的棘秘魑初拥。她以他的名义进行征服，直到她在6世纪陷入[Glossary('蛰眠','game_concept_torpor_desc')]。\n最近，她在现在的布拉格被唤醒，她的力量和年龄使她很快就再次成为该地区的领头$pod_cainite$。不过，仍有新的敌人要战胜，而且新一代的棘秘魑还不知道她的名字。莎格拉的新征服才刚刚开始。\n\n#bold 这对你来说是一个陌生的新世界，但有些事情永远不会改变。例如，你对战争和统治的渴求……#!"
 bookmark_warofprinces_yorak: "沃拉克"
 bookmark_warofprinces_yorak_desc: "沃拉克是最长者最早的子嗣之一，他是一位虔诚的库都和蜕变者，致力于促进$pod_clan$对血肉塑造的理解。他的杰作是“血肉大教堂”，这是一座令人厌恶的教堂堡垒，由农民、奴隶、对手、野兽和其他任何数量的受害者的血肉塑造而成，这些受害者被砌在建筑那脉动、化脓的墙壁上。\n由于沉浸在自己作为棘秘魑$pod_clan$精神领袖的角色中，沃拉克已经有一段时间没有活跃在政治舞台上了，但棘秘魑的现状，即勉强的团结和受到的攻击，可能会迫使他很快审视自己的立场。\n\n#bold 一切都会改变，当大教堂的墙壁发出你喜欢的尖叫时，也许棘秘魑$pod_clan$本身可能再次需要你的“温柔”触摸……#!"
 bookmark_warofprinces_darvag: "达瓦·格罗兹尼"
 bookmark_warofprinces_darvag_desc: "达瓦生前是现代乌克兰境内一个斯拉夫部落的贵族。他是一个坚定的原始教徒，并恶狠狠地拒绝皈依，发誓要亲自把教堂和城市夷为平地，这让一位初拥他的棘秘魑长者很开心。从那时起，格罗兹尼保护这座城市不受其他所有$pod_cainites$的蹂躏，不是出于对基辅的忠诚，而是因为他想亲自摧毁这座城市。\n达瓦也是俄罗斯著名的神秘“芭芭雅嘎”的坚定盟友，并尽职尽责地做出（主要是活人）献祭，希望能取悦这位黑暗女神。\n\n#bold 基辅只有你能烧，其他人都不行。在祖母的注视下，你将看到你的复仇得到实现。#!"
 bookmark_warofprinces_noriz: "诺利兹"
 bookmark_warofprinces_noriz_desc: "诺利兹曾被认为是军督之督（棘秘魑$pod_clan$的政治领袖），但他却堕落到了颓废和消沉的境地，满足于靠他作为长者亲王的荣誉和他过去辉煌的故事来维持生计。他艰难地发现，面对坚定的新敌人——弗拉基米尔·罗斯托维奇，过往的荣耀对他没有什么用。\n他的目标是成为喀尔巴阡山脉最强大的生物。他的对手认为他是个疯子，很危险，但不能否认诺利兹的战争策略的辉煌和他的阴谋和联盟的复杂性。随着罗斯托维奇最近对梵卓的挫败，一些人担心诺利兹的重新崛起是不可避免的……\n\n#bold 罗斯托维奇跌倒了。这是你等待的时刻，从你的颓废沉眠中站起来，给他们所有人一个教训。#!"
 assamite_sub_bookmark: "哈基姆圣裔"
 bm_1230_warofprinces_sub_assamite: "哈基姆圣裔氏族"
 bm_1230_warofprinces_sub_assamite_desc: "以中东的隐蔽堡垒鹰巢为基地，哈基姆圣裔自古就被西方该隐之子视为危险的刺客和吸榨者，但事实上他们是守护者、战士和学者，他们试图与亲王之战保持距离。\n哈基姆之嗣表面上是一个团结的氏族，实际上却因派系斗争而严重分裂。最近，一位新的、有争议的最长者的到来，使每个人都很紧张。这些问题使得新的敌人，主要是通过十字军东征，悄悄进入曾经完全在他们控制之下的中东地区。\n\n#bold 如果哈基姆圣裔能够团结起来，他们将成为一支不可阻挡的力量。他们需要一位配得上哈基姆的黑王座的人。也许那个人就是你？#!"
 bookmark_warofprinces_jamal: "贾迈勒"
 bookmark_warofprinces_jamal_desc: "在为圣地而战的圣战中，阿萨辛派的名字令人生畏。在所有阿萨辛派中，没有一个名字比贾迈勒的名字更伟大或更可怕。作为一名虔诚的穆斯林，贾迈勒是哈基姆圣裔的现任哈里发，也是他们战士种姓的领袖。\n作为一名狡猾而效率的将军，贾迈勒主要以他强大的战斗力而闻名，他的绰号是”不败者”。到目前为止，还没有人能够证明这是错误的。\n\n#bold 你站在哈基姆圣裔$pod_clan$战士和穆斯林亲的领袖位置上。这两个职位都很重要，责任也很艰巨，但你是个有担当的人。你将带领信徒们取得胜利，不管是在鹰巢的内部还是外部。#!"
 bookmark_warofprinces_dastur: "达斯图尔·阿诺什"
 bookmark_warofprinces_dastur_desc: "达斯图尔生有异象，是聚集在琐罗亚斯德身边的魔法师之一。他结识了他未来的学者[Glossary('尊长','game_concept_Sire_desc')]，他们共同发现了一个神秘的遗迹，名为泣石。这一神奇的发现并不符合哈基姆圣裔领导层的意愿，他们被打上了异端的烙印，并强迫他们流亡。\n他们毫不畏惧，聚集了志同道合的学者和名人，听他们讲述洗拉的故事，她被该隐变成了石头。他们自称为“鹰巢的失落部族”，在遭到哈基姆圣裔的手下的直接攻击，导致达斯图尔的[Glossary('尊长','game_concept_Sire_desc')]丧生后，他们被迫隐居起来。目前$pod_clan$派系林立，失落部族也许能得到预期的报复。\n\n#bold 你必须向你的[Glossary('尊长','game_concept_Sire_desc')]致敬，带领你的部族生存下去，若没对可恨的鹰巢后裔取得彻底胜利。#!"
 bookmark_warofprinces_fatima: "法蒂玛·法卡迪"
 bookmark_warofprinces_fatima_desc: "法蒂玛出生于一个在十字军东征期间与真主捍卫者并肩作战的穆瓦希德摩尔战士家庭。她的热情和技巧引起了哈基姆圣裔的注意。她被带到鹰巢，被埃及哈里发忒弥斯再造，并被训练成为了究极刺客。\n她的首项任务是确保第四次十字军东征永远到达不了中东海岸，这件事办得相当成功。鹰巢现在期望她可以做出更伟大的事业，法蒂玛也打算展其锋芒。\n\n#bold 第四次十字军东征四分五裂，在内讧和贪婪中失败了，不过你的工作还没有彻底完成。处理干净它的残军，并在安纳托利亚建立一个强大的缓冲国以保护你的$pod_clan$免受未来的入侵。#!"
 bookmark_warofprinces_alashrad: "阿什拉夫"
 bookmark_warofprinces_alashrad_desc: "阿什拉夫曾经是一名凡人法师和恶魔猎手，与哈基姆本人关系密切，直到一次事件导致他被$pod_Embrace$。此后，他一直担任着阿姆尔——哈基姆圣裔的首席术士，并参加了巴力大战和其他无数次的战斗，成为$pod_clan$中令人恐惧和敬仰的人物。\n在复杂的哈基姆派政治网络中，阿什拉夫是一个温和的人物，在这个动荡的时代领导他的小派别。他的敌意似乎只针对忒弥斯和他的刀锋之网，就此原因这位术士大师除了对他最信任的朋友外，拒绝透露。\n\n#bold 你知道哈基姆圣裔所有问题的核心是位真正的恶魔。他的代理人就在附近，必须加以解决，否则你将面临比毁灭更糟糕的命运。#!"
 bookmark_warofprinces_nakurtum: "纳穆尔图姆"
 bookmark_warofprinces_nakurtum_desc: "作为哈基姆最年长子嗣之一的纳穆尔图姆是家系的创立者，也是位负责记录$pod_clan$历史，维护精神方向的历史学家。她曾被认为已经湮没于历史之中，直到在1214年她出乎意料地回到了鹰巢，在那里她转变成了最长者，成为了整个$pod_clan$的领袖。\n她无所顾忌地攫取权力，蔑视大多数其他派系，并进行了彻底的改革，这使得她的朋友寥寥无几，并导致$pod_clan$本就不稳定的状况雪上加霜。许多人已经在策划新的最长者的到来……\n\n#bold 你是最长者，这些小派系将要么学会向你的权威俯首，要么就被抹除殆尽。只有你才配坐上黑王座。#!"
 bookmark_warofprinces_ahmed: "艾哈迈德·伊本·宰亚特"
 bookmark_warofprinces_ahmed_desc: "宰亚特的儿子艾哈迈德生前是一名穆斯林贸易商和油料批发商。艾哈迈德的信仰更多地寄托在全能的硬币上，其成为一名穆斯林更多是被教育导致的而不是自己选择的。同样对宗教无感的哈基姆圣裔在793年初拥了他，艾哈迈德带着荣誉和警惕心开始了其学徒生涯，这让所有人，包括他自己都感到惊讶。\n作为最后的考验，他必须潜入十字军的营地偷出某样东西并暗杀掉卫兵。不管他到底是发现了什么，这都彻底改变了他，让这个男人转变为了一名虔诚的基督徒。自那以后，他一直不知疲倦地努力寻找其他同样经历过启示的人，并致力为圣地带来和平。\n\n#bold 你是基督徒和穆斯林之间的桥梁，也许是这片深深分裂的土地上唯一能坚守之人。你的任务重大，但你的信念毋庸置疑。#!"
 bookmark_warofprinces_thetmes: "忒弥斯"
 bookmark_warofprinces_thetmes_desc: "还是凡人时，忒弥斯是托勒密军队中的一名士兵，与克里奥帕特拉和她的罗马盟友作战。在他们失败后，他证明了自己是一个可怕的角斗士，并吸引了哈基姆圣裔的注意，后者初拥了他。他是一个骄傲的非信徒，多年来他的上位使$pod_clan$内部出现了宗教裂痕。\n忒弥斯领导着刀锋之网，这是一个狂热的派系，由受雇的刺客和吸榨者组成，大多数外人对哈基姆圣裔的整体印象。但实际上，他并不只是个有着对血的饥渴的贪婪者，忒弥斯有一个黑暗而强大的主人，他将确保准备好一切来迎接他的回归。\n\n#bold 黑牧人仍在沉睡，所以你将处理好哈基姆圣裔来迎接他的光荣归来。#!"
 gangrel_sub_bookmark: "冈格罗"
 bm_1230_warofprinces_sub_gangrel: "冈格罗氏族"
 bm_1230_warofprinces_sub_gangrel_desc: "比起大多数城市里的表亲，游牧者与荒野的关系更密切，冈格罗也更具有心兽的兽性一面，经常被称为原始的、野蛮的甚至是粗暴的怪物。\n冈格罗氏族在该隐之子的历史上占有重要地位，是古典时代所谓的“蛮族”的主要推动力之一。不过从那时起，他们的运气就开始缩减了。城市的发展和似乎不可阻挡的基督教浪潮削弱了他们的人民，他们大多是异教徒的后代。不过，大草原仍然是未被驯服的，而且冈格罗也不是那种不经过最后一战就放弃自己在这个世界上的地位的吸血鬼。\n\n#bold 这可能是欧洲非基督徒的最后一次欢呼，但你们将使它成为值得世代歌唱的欢呼。#!"
 bookmark_warofprinces_morrow: "莫罗"
 bookmark_warofprinces_morrow_desc: "作为一个年轻的孤儿，莫罗被培养成理想的冈格罗子嗣——自给自足的吸血鬼，并拥有卓越的才能。当她终于在一场致命的猫捉老鼠的游戏中成功追踪并打伤了她未来的[Glossary('尊长','game_concept_Sire_desc')]时，他初拥了她。\n从那时起，她就获得了凶残战士的声誉。这个名声帮助她完成了召集同伴的任务。她相信，在文明不断增长的过程中，她的$pod_clan$唯一的生存方式就是合作，所以她鼓励冈格罗组成集群。她最近对梵卓和棘秘魑的胜利，巩固了她作为$pod_clan$主要战争领袖之一的名声。\n\n#bold 你看到了联合起来的冈格罗的光明前景。现在是实现这一梦想的时候了。#!"
 bookmark_warofprinces_viktor: "维克多"
 bookmark_warofprinces_viktor_desc: "维克多是一位强大而令人生畏的冈格罗，几个世纪以来，他一直是俄罗斯著名的可怕的芭芭雅嘎的心腹。作为唯一一个被信任到足以知道“小祖母”的计划的人，他在她陷入[Glossary('蛰眠','game_concept_torpor_desc')]之后被委托为她的摄政。\n维克多是一位狂热分子，不容忍任何对他女主人的不尊重，但他也被称为是一个光荣的敌人，一个喜欢公平竞争的人，不掩饰自己的真实意图。他现在必须捍卫她的国度，以抵御最近基督教于俄罗斯的来临，以及东方骑兵部落在草原上聚集的传言……\n\n#bold 芭芭雅嘎是$pod_cainite$的救赎。你不能也不会辜负她。#!"
 bookmark_warofprinces_brunhilde: "布伦希尔德"
 bookmark_warofprinces_brunhilde_desc: "布伦希尔德出生于斯堪的纳维亚，她在自己的$pod_Embrace$中感受到了重生，并迅速组建了女武神，狂热地侍奉她的祖尊奥丁，认为自己是北欧神话的现实衍现。她勇敢地与基督教的侵蚀影响作斗争，试图阻止他们人民的古老传统发生任何改变。\n然而，随着瑞典人民皈依基督教，这场斗争已经失败。尽管如此，当她的许多同胞倒在绝望或鲁莽的行动中时，布伦希尔德还没有失去希望。即使她的人民正在反对她，她也梦想着击退入侵的基督教$pod_cainites$，并保存她的信仰。\n\n#bold 诸神黄昏已经到来，你知道结局。但现在放弃还为时过早。阿萨诸神在看着。#!"
 bookmark_warofprinces_dunlop: "邓洛普"
 bookmark_warofprinces_dunlop_desc: "从高贵的苏格兰氏族那里抢出名声和头衔的拦路强盗，“邓洛普伯爵”是一个冷酷无情的男人，喜欢随意使用暴力。邓洛普甚至在他的$pod_Embrace$之前就已经是一个可怕的怪物，他把自己的儿子们培养得和他一样凶残，他生命中唯一的一线曙光是他无辜的女儿。\n他的倒台来自于他的贪婪，他袭击了强大的密特拉的财产。梵卓的反应是迅速而无情的，他让邓洛普卑躬屈膝，并杀死了他心爱的女儿作为惩罚。邓洛普被迫屈服，并从密特拉的眼中消失了。但这个受委屈的“伯爵”并没有忘记或原谅，他每天晚上都在策划他对手的倒台。\n\n#bold 密特拉把你的曙光夺走了。现在是时候让他明白，为什么苏格兰到现在还在害怕你的名字……#!"
 bookmark_warofprinces_qarakh: "喀喇"
 bookmark_warofprinces_qarakh_desc: "喀喇和他的[Glossary('尊长','game_concept_Sire_desc')]阿扎布生活在蒙古人中间，但喀喇是被未经允许就初拥的，所以他们从蒙古$pod_cainites$那里匆匆跑了出来。阿扎布在战斗中受伤，使喀喇一路背着他来到利沃尼亚，在那里他与一伙试图抵抗基督教到来的被围困的原始教徒吸血鬼达成了共识。\n由于他天生的魅力和战斗力，喀喇很快就成为这些“利沃尼亚野者”的领袖，并吸引了许多其他寻找最后的胜利机会的原始教徒的注意。虽然还很年轻，但喀喇已经越来越习惯于他的新身份，并准备好捍卫他收养的家园，直到他的终焉之死。\n\n#bold 这可能是波罗的海原始教徒的最后一搏，但你要确保基督徒将为每一寸土地流血。#!"
 bookmark_warofprinces_valborg: "瓦尔普尔加"
 bookmark_warofprinces_valborg_desc: "瓦尔普尔加是一个内心强大的维京人，她不顾自己的安全而战斗。她已经接受了诺斯人的时代已经过去的事实，现在打算为剩下的唯一有价值的功业而战：她自己。\n瓦尔普尔加拥有可怕的船员和日益增长的无情佣兵声誉，她有很多机会进行杀戮和掠夺。她以自己的方式保持着古老的北欧信仰的扭曲版本，并吸引着越来越多的人加入她的“功业”。瓦尔普尔加其实并不关心。更多的追随者意味着更多的基督徒被杀害，更多的财富被掠夺。如果旧神对她不满意，他们肯定也不会跳出来。\n\n#bold 有人认为你会带领北欧人进入一个新时代。你不知道，但你肯定享受劈出你的道路去寻找答案。#!"
 bookmark_warofprinces_thomas: "托马斯·费鲁"
 bookmark_warofprinces_thomas_desc: "托马斯是一位小贵族的独生子，在去圣地朝圣之前，他一直是个冷酷无情的人。他的$pod_Embrace$和幸运地加入君士坦丁堡$pod_cainites$改变了他。\n在这个城市一些最伟大的人的教导和照顾下，托马斯成长为君士坦丁堡的尽职后裔，发誓要永远保护他的家园。当第四次十字军东征摧毁了这座城市并杀害了他的导师们时，他没能完成这项任务。\n托马斯从未像许多希腊$pod_cainites$那样流亡，他仍然在他的城市里游荡，希望能拯救它。而且，即使他的导师们会不同意，也要对拉丁人进行一些应得的报复。\n\n#bold 你的地位很弱，而该死的拉丁人则根深蒂固。但你不能辜负梦想和你的导师们的回忆。这是你赎罪的时刻。#!"
 malkavian_sub_bookmark: "末卡维"
 bm_1230_warofprinces_sub_malkavian: "末卡维氏族"
 bm_1230_warofprinces_sub_malkavian_desc: "末卡维是一个神秘的、精神极度不正常的该隐之子群体。该氏族的成员在该隐之子和血畜中扮演着预言家和神谕者的角色，他们是被奇怪的强迫症和能感知他人无法感知的才能所束缚的阴森人物。他们也是臭名昭著的恶作剧者，他们的“玩笑”可从憨傻到残酷。\n在古典时代，他们是一个重要的氏族，因其预言天赋而深受尊重。然而，时代变了，基督教对末卡维是一个重大打击，现在被大多数人认为是纯粹的疯子。被贬为下位氏族，月触者已经失去了大部分的权力和威望。\n\n#bold 比起其他氏族，每位末卡维都是独特的生物，疯狂和清醒在争夺他们的思想。哪一个会赢？#!"
 bookmark_warofprinces_tryphosa: "特黎佛撒"
 bookmark_warofprinces_tryphosa_desc: "也许是古典时代最有影响力的末卡维，特黎佛撒是罗马的卡米拉的顾问，也是毁灭迦太基的炽热倡导者。正是由于她的不断表现和对强大的梵卓的影响，他终于对她所认为的恶魔出没的地狱之地采取了行动。\n特黎佛撒认为，她作为一位不死族的地位使她能够影响她所见证的未来的愿景，而这一点对于新一代的末卡维来说大多已经失去了。罗马沦陷后，特黎佛撒从未离开过意大利，等待卡米拉的回归来再次推动他前进。那个时候已经到来。\n\n#bold 卡米拉回来了，考虑到这个陌生的新世界与你心爱的罗马是如此不同，他肯定会比以前更需要你的指导。#!"
 bookmark_warofprinces_vasantasena: "春军"
 bookmark_warofprinces_vasantasena_desc: "春军是泰米尔皇帝大罗茶罗乍的女儿，被一位吸血鬼侍从长诅咒，慢慢消亡。一位流浪的末卡维向她提供了一个解决方案，她勇敢地接受了这个方案，向她的父亲揭露了侍从长的背叛行为，以她的生命作为了代价。她被她的拯救者带入不死族，开始周游世界。\n她宣扬反对血缚，拒绝对凡人抱有领主态度、传统的吸血鬼等级制度和所有失去自由意志的行为。她像刀锋一样挥舞着她的热情和魅力，她的名声迅速扩大。\n\n#bold 你是被压迫者之声。你将一次次打破束缚$pod_cainite$社会的桎梏。#!"
 bookmark_warofprinces_louhi: "娄希"
 bookmark_warofprinces_louhi_desc: "一位神秘的吸血鬼，在整个$pod_cainite$历史上很少被提及，从人们有记录以来，娄希一直是北芬兰的主要$pod_cainite$。\n她是有史以来最有才华的奇术师之一，她创造了自己的[Glossary('遗传血仆','game_concept_revenant_desc')]，即狡猾的凯斯基宁。有传言说，她为[Glossary('上古耆宿','game_concept_antediluvian_desc')]勒森魃本人服务，原因不明。许多人担心她的计划会给这个地区带来厄运，甚至更多，但少数敢于前往冰冷的北方与她对抗的人再也没有回来。\n\n#bold 你正在努力工作，以取悦深渊主人。你正在取得进展，但总是需要更多的“志愿者”来测试你最新的魔药。#!"
 bookmark_warofprinces_anatole: "阿纳托尔"
 bookmark_warofprinces_anatole_desc: "阿纳托尔生为一位城市守卫的长子，他被期望跟随父亲的脚步，但他却在为天主服务中找到了更高的使命。他的仪态和信仰引起了一个特别虔诚的吸血鬼的注意，他认为阿纳托尔可以促进基督教的功业。\n在此后的几年里，他已经作为所有形式的异端的狂热反对者而声名鹊起，击败了君士坦丁堡的卡洛梅娜的选民和巴黎的$pod_cainite$。他的愿景仍在驱使他前进，做得更多。\n\n#bold 法兰西南部的清洁派异端是一些危险的异端$pod_cainites$用于躲在背后的幌子。你必须找到并摧毁他们。#!"
 bookmark_warofprinces_elimelech: "以利米勒"
 bookmark_warofprinces_elimelech_desc: "以利米勒是拿俄米的丈夫，这在圣经的路得记中有记载。他被一个不知名的袭击者袭击并被初拥了。拿俄米发现她的丈夫在田野里游荡——一个冰冷的不死族空壳。她把他放在一个没有标记的浅坟里。三天后，他精神失常地站起来，忍受着没有泉水可以解救的饥渴。\n以利米勒从未从早期的夜晚中恢复过来，他经常迷失在他的心兽中，漫无目的地四处游荡，或者疯狂地攻击他人。以利米勒旅行最终将他带到了塔尔玛埃拉、无日之手，一个崇拜[Glossary('上古耆宿','game_concept_antediluvian_desc')]的末日死亡秘教。\n\n#bold 他们害怕并听从你。也许你的目的和救赎就在这震耳欲聋的情感合唱中。#!"
 bookmark_warofprinces_adolana: "拉斯乌埃加斯的阿多拉娜"
 bookmark_warofprinces_adolana_desc: "阿多拉娜的大部分时间是在修道院里度过的，因为她那虐待狂哥哥把她送到那里去隐藏他的罪行。她拒绝再受挨打，很快就用她的话术将修女院变成了一个支离破碎的社会，在那里暴力是司空见惯的，但她现在是食物链的顶端。\n一位来自$pod_cainite$的末卡维对她的才能印象深刻，初拥了她并扩张了她的野心。在几近崩溃的该隐教会帮助下，阿多拉娜迅速升职，现在是陷入困境的挪得教区的一员，这是她信仰的最后堡垒。\n\n#bold 你在该隐教会找到了新家，但是……即使在家中，你也知道，如果你想避免再次受到伤害，你必须站在顶端。#!"
 bookmark_warofprinces_harold: "哈罗德·泽特勒"
 bookmark_warofprinces_harold_desc: "哈罗德·泽特勒是“三启示之环”的成员，这是一个由末卡维预言家、哲学家和神秘主义者组成的松散集体，他也是当睿魔尔开始摧毁萨洛比时的有力捍卫者。利用他所拥有的一点影响力来庇护和保护他们，但这不够，而且随着睿魔尔的清剿行动越来越深入，他变得越来越绝望。\n哈罗德恳求任何灵体甚至是神明帮助他，其中一位回应了。\n那天晚上，哈罗德·泽特勒重生了，成为他曾经珍视的一切的嘲弄者。\n\n#bold 你现在明白了这么多。没有痛苦就没有救赎，你将在一段时间内成为最有成就的艺术家，这要感谢你慷慨的新后援。#!"
 nosferatu_sub_bookmark: "诺斯费拉图"
 bm_1230_warofprinces_sub_nosferatu: "诺斯费拉图氏族"
 bm_1230_warofprinces_sub_nosferatu_desc: "具有所有该隐之子中最明显的诅咒，初拥将每个诺斯费拉图扭曲成一个可怕的畸形生物。他们是死者的间谍首领，收集信息并以低廉的价格出售。作为下层社会的主人，诺斯费拉图倾向于更加重视氏族团结和共同生存，因此即使算是敌人，彼此之间也相当融洽。\n诺斯费拉图在黑夜世界中从来都不是重要的领土拥有者，但由于他们在信息收集方面的无与伦比的才能，他们总是挥舞着巨大的，甚至是不可见的影响力。\n\n#bold 你的氏族是唯一能理解你的家。如果你们能都团结起来，很少有什么威胁是不能克服的。#!"
 bookmark_warofprinces_josef: "约瑟夫·兹维"
 bookmark_warofprinces_josef_desc: "约瑟夫在布拉格的犹太区出生和长大。作为一名拉比的儿子，他希望能继承父亲的事业。犹太人所遭遇的暴力并不少见，约瑟夫遭受的痛苦最为残酷，有一天晚上，一帮基督教男孩把他的半颗脑袋砸碎。如果不是因为他被诺斯费拉图的耶胡达$pod_Embrace$，他早就死了。他问约瑟夫是否会保护其他人免受这种残暴行为的伤害，他只是握住这位诺斯费拉图的手作为回应。\n约瑟夫成为了布拉格诺斯费拉图社区的首领，在推翻其前任暴君亲王的过程中发挥了作用。在随后的权力真空中，他能已为自己和他的人民确保城市的安全。\n\n#bold 尽管布拉格是安全的，但一个新的威胁已经在东部显现，并可能危及你迄今为止的所有努力。你一定不能动摇。#!"
 bookmark_warofprinces_tarique: "塔利克"
 bookmark_warofprinces_tarique_desc: "在崛起之前，塔利克是一名西班牙血族，随后在伊斯兰教的黄金时代皈依。塔里克对“不可触碰”的麦加城非常着迷，于是他冒险来到阿拉伯半岛，凝视着穆斯林最神圣的场所。\n他参与了麦加的防御工作，以对抗末卡维的阴谋，并很快结识了[Glossary('阿什拉派','game_concept_ashirra_desc')]（穆斯林$pod_cainites$）领导人。塔里克因其坚定的信仰而聚集了一批追随者，塔利克声称，他和他的后嗣从此以后将成为伊斯兰教的守护者和麦加的管理者。\n\n#bold [Glossary('阿什拉派','game_concept_ashirra_desc')]很稳固，但在周围仍有威胁。你是他们的磐石，你的神圣职责决不能动摇。#!"
 bookmark_warofprinces_malachite: "马拉希底斯"
 bookmark_warofprinces_malachite_desc: "马拉希底斯出生于9世纪，是位君士坦丁堡原住民，长大后成为一名东正教的牧师。不幸的是，他与一位有权有势的$pod_cainite$发生了公开争执。为了伤害他的自尊心，他让马拉希底斯被一位诺斯费拉图[Glossary('初拥','game_concept_Embrace_desc')]。\n重生为$pod_cainite$后，马拉希底斯一直生活在绝望之中，直到他被君士坦丁堡的牧首，妥芮朵的米迦勒收留，并成为幻梦最忠实的仆人。\n第四次十字军东征对马拉希底斯的精神是一个沉重的打击，但他知道，即使没有米迦勒，幻梦也必须持续下去。\n\n#bold 你必须把君士坦丁堡从法兰克人的控制下解放出来，并让这座城市恢复昔日的荣耀。作为米迦勒的继承人，这是你的责任。#!"
 bookmark_warofprinces_mnemach: "谟涅摩"
 bookmark_warofprinces_mnemach_desc: "谟涅摩出生在高卢的最后的独立日子里，被一个想要保护他们的文化和传统的诺斯费拉图[Glossary('初拥','game_concept_Embrace_desc')]。在他的指导下，她很快成为一名出色的女巫，并在卢泰西亚建立了自己的地盘，这地方不久后成为了巴黎。\n作为法兰西最古老的$pod_cainites$之一，谟涅摩的影响力和权力是众所周知的，她的支持对于将巴黎的亚历山大赶下台至关重要。不过，她的真正目标仍不明确，这使得她身上的神秘光环更让其他$pod_cainites$感到担忧。\n\n#bold 你赶走亚历山大是有原因的，而这个原因现在就在你的手中。你的过去，也许还有你的未来的一个片段，再次与你重逢。#!"
 bookmark_warofprinces_lukas: "卢卡斯"
 bookmark_warofprinces_lukas_desc: "对大多数人来说，卢卡斯可能会被误认为是一个神圣修士会的唱诗班成员。他无辜的外表掩盖了藏在下的狡猾怪物，这个怪物以地狱的名义系统性地腐蚀了天主的殿堂。\n作为一个凡人男孩，卢卡斯为自己的完美美貌感到骄傲，当一位流浪的诺斯费拉图[Glossary('初拥','game_concept_Embrace_desc')]了他，来教他一些谦卑的时候，他感到了恐惧。绝望的卢卡斯说，他愿意做任何事情来恢复他的美貌。\n在地下深处，有什么听到了他的恳求，并提出了他的条件……\n\n#bold 你的魔邪赞助要求越来越多的东西来保持他的交易结果。你别无选择，只能服从，因为你的美貌值得任何牺牲。#!"
 bookmark_warofprinces_gregor: "格雷戈尔"
 bookmark_warofprinces_gregor_desc: "格雷戈尔生前是一名条顿骑士，以其残忍和粗心而闻名。被一个希望惩罚他的诺斯费拉图[Glossary('初拥','game_concept_Embrace_desc')]后，格雷戈尔反而很容易适应了他的新生活。\n他深入黑森林，很快就因杀死狼人和毁灭了一位强大而古老的尼克图库而闻名。对于像格雷戈尔这样年轻的人来说，这两项壮举几乎都是不可能的，这让很多人相信，在森林的最深处，有些事情并不像它看起来那样……\n\n#bold 你已经找到了你作为荆棘女士的骑士的真正目的。她给了你力量，并没有因为你对暴力的渴望而责备你。你们是完美的一对。#!"
 bookmark_warofprinces_zelios: "仄利俄斯"
 bookmark_warofprinces_zelios_desc: "仄利俄斯出生于一个富商家庭，他放弃了追求舒适的特权生活，而选择了发展一种有用的手艺。他游历了欧洲和其他地方，学习建筑的艺术和技术。\n一位诺斯费拉图意识到了这个年轻人的潜力，决定将他带入$pod_clan$，这样他就可以改善他$pod_clan$居住的战地。随着时间的推移，塞琉斯沉浸在自己的技艺中，专门为$pod_cainite$领主建造城堡。\n\n#bold 你在贵族和工匠中都很有名，但你知道，你真正的杰作还在后面。特兰西瓦尼亚在召唤你，它可能是你找到自己命运的地方。#!"
 ravnos_sub_bookmark: "雷伏诺"
 bm_1230_warofprinces_sub_ravnos: "雷伏诺氏族"
 bm_1230_warofprinces_sub_ravnos_desc: "分裂严重的雷伏诺氏族起源于印度，但众所周知，他们一直在远方游荡。在他们的家乡，他们是强大的统治者，但在西方却不那么稳固，在那里他们只是被称为游荡的骗子、神秘主义者和流浪者。\n东方雷伏诺有自己的种姓制度，是由他们所谓的创始人吒婆多修罗的后代发展而来的。就他们而言，每位雷伏诺流亡者都有不同的观点、价值观和动机，导致在欧洲境内有着众多分支（或种姓）。\n\n#bold 在西方世界被鄙视，在印度则陷入与死敌的永恒之战中，雷伏诺氏族的未来将是一场艰苦的斗争。有很多事情要做。#!"
 bookmark_warofprinces_chandraputra: "查古拉普夏"
 bookmark_warofprinces_chandraputra_desc: "查古拉普夏既是拯救者又是施害者，既是侍从又是征服者，他最重要的一点是：忠诚。他是吒婆多修罗唯一没有以某种方式背叛他的[Glossary('尊长','game_concept_Sire_desc')]的子嗣，自然而然地承担起了印度族人的领导衣钵。\n在凡人入侵次大陆的第一批印欧征服者中，查古拉普夏也许是今夜最成功的将军，这在很大程度上是因为他对威胁他的$pod_clan$的受诅的阿修罗提伽耶进行了永恒之战。\n\n#bold 战争从不改变，你也不会改变。你的敌人将明白，你永远不会动摇。#!"
 bookmark_warofprinces_karmenita: "卡门尼塔·约亚里"
 bookmark_warofprinces_karmenita_desc: "卡门尼塔自意大利，她很快就对罗马雷伏诺的颓废行为感到失望。她搬到了葡萄牙，以便探索她[Glossary('尊长','game_concept_Sire_desc')]教给她的“矛盾之道”私密版本的精神层面。在不了解原始教义的情况下，卡门尼塔形成了这样一种观念：在世俗世界中能够茁壮成长的事物、概念等只能是有限的数量。\n她还热衷于无意识的犯罪行为和其他适合自我满足的行为，这在她的$pod_clan$中非常普遍，引发了曾经的同胞们对她的不满。\n\n#bold 你正在从你的[Glossary('尊长','game_concept_Sire_desc')]留下的颓废混乱中慢慢创造自己的种姓。但你还有自己的家庭问题要处理……#!"
 bookmark_warofprinces_iago: "雅戈·卡斯提尔"
 bookmark_warofprinces_iago_desc: "地中海的“海盗亲王”是一位精明的船长，他被卡门尼塔·约亚里初拥到雷伏诺$pod_clan$，但他们的观点很快就发生了冲突，这位耐心的[Glossary('尊长','game_concept_Sire_desc')]不喜欢她孩子的火爆脾气。因此，雅戈很快就从她手中逃到了科西嘉。\n雅戈证明了自己是一个有魅力的领导者，他完全接受了自己作为一个贪婪和欺骗性的海盗的新生活。不过，低估他将是一个错误，因为他的阴谋和操纵技能已经让许多追捕者死于非命。\n\n#bold 有钱可赚，也有傲慢的亲王们可打倒。地中海将是你的天下！#!"
 bookmark_warofprinces_mritunjay: "大胜死亡"
 bookmark_warofprinces_mritunjay_desc: "巴格达最新的亲王在对上一任亲王实施了精心策划的计谋后，升得了这个头衔，并在这个过程中对她进行了报复。作为一个喜欢享受人生和亡生中美好事物的人，大胜死亡对他的新职位当然很合意，但如果把他当成一个浮夸的小丑，那就错了。\n凭借其敏捷的头脑，大胜死亡已成为玩弄各派别的专家，并在此过程中确保了他的安全。随着巴格达最终落入他的手中，他将能够在更大范围内使用这种能力。\n\n#bold 巴格达是最大的奖品，但要真正确保它的安全，还需要应对各种威胁，包括凡人和不死族。#!"
 bookmark_warofprinces_marcia: "玛西娅·费利西娅·莉西娜"
 bookmark_warofprinces_marcia_desc: "作为最年长的帕伊杜米特活跃分子，玛西娅为她的种姓的传承感到自豪，这是一个战士和骑士的种姓，有着荣誉和责任。但与她对知识的渴望相比，她对战斗的热爱就显得微不足道了。玛西娅承担了为她$pod_clan$撰写《伟大之作》的使命，她一直在努力收集有关她的不同同胞的信息。\n不过，她的一意孤行让她付出的代价越来越大，因为她可怕地看到雷伏诺家族陷入了颓废状态。她现在正考虑在政治上扮演一个更积极的角色。\n\n#bold 你不能看着你的$pod_clan$沉溺于有罪的行为而无所事事。你可以创造历史，而不仅仅是书写历史。#!"
 bookmark_warofprinces_zoe: "佐伊"
 bookmark_warofprinces_zoe_desc: "佐伊曾经是君士坦丁堡的一名普通学徒，在1204年君士坦丁堡被洗劫期间受了致命伤，为了保住性命而被$pod_Embrace$。她与被流放的希腊民众一起旅行，很快就在一群裁判官面前失去了她的尊长。\n如果不是同路人阿纳托尔的耐心教导，佐伊将被愤怒和绝望所击垮。他们两个人互相学习，佐伊对可恨的裁判官进行了报复。终于得到了安宁，她成为她朋友的亲卫和义子嗣，并跟随他到法兰西南部进行个人使命。\n\n#bold 你欠阿纳托尔很多，而且你还可以从他那里学到更多，也许在这其中你能最终找到你在这个世界上的位置。#!"
 bookmark_warofprinces_etienne: "艾蒂安·德·法贝热"
 bookmark_warofprinces_etienne_desc: "艾蒂安从小就知道他是由罪而生，他周围的世界在天主眼中是无用的。当十字军东征的号召发出后，他为了获得宽恕而加入。当他试图保护安条克附近的一个犹太商人时，他的伙伴们与他反目成仇，把他打倒在地，强迫他看着他们割断商人一家人的喉咙，留下艾蒂安在尸体中哭泣。就在那时，他遇到了他的尊长，被他的虔诚所感动。\n从那时起，艾蒂安就以守卫亚柯为己任，充当这座圣城的保护者。在这个动荡的时代，他的工作已经完成了。\n\n#bold 到目前为止，你已经成功地拯救了亚柯，但圣地的动荡从未结束。你还没有对你的罪孽有足够的忏悔。#!"
 setite_sub_bookmark: "赛特之子"
 bm_1230_warofprinces_sub_setite: "赛特之子氏族"
 bm_1230_warofprinces_sub_setite_desc: "赛特之子相信赛特有一天会回来统治或吞噬世界，而虔诚的赛特之子则将为他的复活做好准备。为此，该氏族保持独立于其他该隐之子的党派，并以精湛的技艺练习腐化、欺骗和古术法。\n在大多数时候，赛特之子的行为更像是一个密教，而不是一个真正的氏族。赛特之子在他们的祖国埃及仍然很强大，但伊斯兰教的兴起严重削弱了他们在埃及以外的力量。为了寻找新的盟友并将他们的神的荣耀传播到更远的地方，曾经闭塞的赛特之子已经开始在世界各地旅行。\n\n#bold 拉对世界的铁腕掌控仍然令人窒息。只有当所有被误导的该隐之子都唱起对赛特的赞歌时，世界才能真正获得自由。#!"
 bookmark_warofprinces_nakhthorheb: "纳赫特尔赫布"
 bookmark_warofprinces_nakhthorheb_desc: "在赛特失踪之前，信徒们没有任何组织。他们的神一失踪，圣显者就聚集在一起，宣布自己是$pod_clan$的管家。\n纳赫特尔赫布是最大的圣显者；正是他将他们牢牢地控制在手里。有传言说，他和赛特本人一样出生在同一个游牧部落里。虽然所有的法律和命令都必须经过七位长者的同意，但纳赫特尔赫布才是这些命令的来源。\n\n#bold 随着赛特的消失，信徒们比以往更需要你的领导。不要辜负他们，也不要辜负他。#!"
 bookmark_warofprinces_kemintiri: "刻茉媞里"
 bookmark_warofprinces_kemintiri_desc: "刻茉媞里曾经是伊西斯的女祭司，不该得引起了赛特的注意，由于她拒绝交出赛特所求的女神之秘，她在初拥前受到了暴力折磨。即使是这种残酷的待遇也没有击垮她，她忍受了他多夜虐待后才设法逃脱。\n从那时起，刻茉媞里就成了赛特之子$pod_clan$最可怕的敌人，只要有机会，她就会毁掉她所憎恨的尊长的传承。她的传奇故事夜以继日地增长，人们纷纷传说这位美丽的伊西斯最后的女祭司，是落入腐朽$pod_clan$的复仇天使。\n\n#bold 直到赛特珍视的一切都散落在风中前，你的大业永不完结。#!"
 bookmark_warofprinces_andreas: "安德烈亚斯·埃古普托斯"
 bookmark_warofprinces_andreas_desc: "安德烈亚斯曾经是早期基督教异端基督一性论的巴勒斯坦牧师，在流亡埃及期间遇到了赛特。安德烈亚斯证明了自己是一个聪明而好学的皈依者，他为自己的$pod_clan$扮演了一个商贾亲王的角色，在欧洲各地获得了联系和盟友。\n他无可挑剔的声誉和公平的交易帮助他建立了一个贸易帝国，但他真正的使命仍然是帮助别人找到赛特的真理，无论他们来自哪里。\n\n#bold 每个人都以他们自己的方式接受赛特。你只不过是他们一路走来所需要的耐心和理解的向导。#!"
 bookmark_warofprinces_neferu: "内弗鲁"
 bookmark_warofprinces_neferu_desc: "作为纳芙蒂蒂的侍女，内弗鲁是赛特在法老埃赫那吞的混乱时期的代理人，在推翻他的异端统治方面起了重要作用。她得到的回报是初拥和创建自己的神殿——火之庭。\n她专注于腐化试图征服埃及的外来吸血鬼，这项任务为她赢得了许多敌人。但是，不知何故，火之庭似乎总是能够生存下来，并且经常处于领先地位。\n\n#bold 你的宫廷缓慢而有条不紊地侵蚀着文明的支柱。许多人已经倒在了它的面前，未来还会有更多的人倒下。#!"
 bookmark_warofprinces_sarrasine: "萨拉金"
 bookmark_warofprinces_sarrasine_desc: "作为凡人时，萨拉金是查士丁尼大帝宫廷中的一个小男孩，他看见世俗领主往往不按照圣经的正统观念生活，而是听从幕后的主人。凯塔尔初拥了他，因为他在这个男孩身上看到了自己的影子。然而，萨拉金并没有对这些感情做出回应。在1204年第四次十字军东征洗劫君士坦丁堡期间，萨拉金试图$pod_diablerie$他的[Glossary('尊长','game_concept_Sire_desc')]，但功亏一篑。\n虽然凯塔尔在东正教赛特之子中没有多少朋友，但他仍然有狂热的追随者支持他的功业，而萨拉金现在正在逃亡。\n\n#bold 这整个事件只是一个挫折。是时候重新开始了，这是你相当擅长的事情。#!"
 bookmark_warofprinces_arnulf: "阿努尔夫·耶梦加得松"
 bookmark_warofprinces_arnulf_desc: "阿努尔夫·耶梦加得松是一名诺斯商人，在9世纪时曾到过亚历山大港。在那里，他被引入一个崇拜古神赛特的血腥密教中，并最终被赛特信徒的一名成员授予了初拥。\n当阿努尔夫回到斯堪的纳维亚时，现在以耶梦加得松为姓，他建立了耶梦加得之殿，作为一个崇拜世界之蛇的末日密教。到目前为止，他已经在珠宝贸易中获得了一个立足点，并在远离埃及的地方培育了一个小型的赛特之子殖民地。\n\n#bold 当维京世界瓦解时，这将有新的财富和皈依者可供利用。令人激动，却又危险的时代。#!"
 bookmark_warofprinces_jean: "让·巴蒂斯特·德·蒙特龙"
 bookmark_warofprinces_jean_desc: "让·巴蒂斯特是喝醉了才参与了十字军，这是对他一时的宗教狂热的唯一解释。\n在西西里岛的墨西拿耽搁期间，他发现自己沉溺于各种堕落和异端邪说，自欺说是教宗曾承诺十字军战士的所有罪过都会得到宽恕。仅仅几个星期后，他就放弃了对十字军的责任，向赛特密教屈服。不幸的是，那不勒斯的神殿被毁了，他不得不逃回法兰西。\n从那时起，让·巴蒂斯特就成了巴黎夜生活之主，在这之中满足他每一个扭曲的欲望。\n\n#bold 亡生如此美妙。当你可以用大量的快乐和财富包围自己时，谁还在乎这个叫赛特的家伙呢？#!"
 tremere_sub_bookmark: "睿魔尔"
 bm_1230_warofprinces_sub_tremere: "睿魔尔氏族"
 bm_1230_warofprinces_sub_tremere_desc: "睿魔尔是最新的吸血鬼氏族，在他们的创始人开始寻求如何保留他那正逐渐消失的不朽性前，他们曾经是赫耳墨斯秘会的法师。这一探索使他和他家族的大多数人都变成了吸血鬼。\n自从他们诞生以来，睿魔尔已经树敌无数，从被他们侵占的领土的棘秘魑到被他们谋杀了扫罗的萨洛比。尽管如此，他们铁一般的纪律和强大的魔法使他们能够坚持下来……目前而言。\n\n#bold 睿魔尔氏族的地位摇摇欲坠，被四面八方的敌人围困着。他们将需要他们最杰出的成员的才能和智慧来生存。#!"
 bookmark_warofprinces_goratrix: "格拉崔克斯"
 bookmark_warofprinces_goratrix_desc: "格拉崔克斯是睿魔尔本人最亲密的朋友之一，也是最有前途的学生，是他设计了将睿魔尔家族的精英转化为吸血鬼的仪式。\n尽管取得了巨大的成功，但睿魔尔的另一个学生埃特里乌斯被选为该家族的摄政，这激怒了格拉崔克斯。作为流放者被送到法兰西，这位雄心勃勃、才华横溢的魔法师已经充分利用了他在这里的时间，在法兰西政治中获得了非常强大的影响力。\n\n#bold 睿魔尔家族里有一些腐烂的东西，你知道它。那个愚蠢的埃特里乌斯甚至都不了解它。你必须结束这流放，在为时已晚之前拯救睿魔尔$pod_clan$。#!"
 bookmark_warofprinces_meerlinda: "梅琳达"
 bookmark_warofprinces_meerlinda_desc: "梅琳达是睿魔尔$pod_clan$内部七人议会中头脑清醒且理性的一员。在旧睿魔尔家族中，她是唯一被睿魔尔认为有资格陪伴他到魔法的最高境界的女性。\n她得到了埃特里乌斯和格拉崔克斯的尊重，能够在议会中扮演协调人的角色。被派往英格兰，梅林达的身份是双重的。为$pod_clan$准备一个新的家园以防喀尔巴阡沦陷，并调查围绕圣杯的传言及其对吸血鬼的影响。\n\n#bold 让埃特里乌斯和格拉崔克斯互相掐架。当他们都失败时，睿魔尔$pod_clan$将在这里重振旗鼓……在你的精心监督下。#!"
 bookmark_warofprinces_jervais: "热尔韦"
 bookmark_warofprinces_jervais_desc: "法兰西书记员的儿子，热尔韦有一点魔法天赋，足以吸引睿魔尔家族的注意，但还不足以独自成为一个强大的魔法师。\n不过，凭借着强烈的奉献精神和无情的野心，他还是成功地成为了睿魔尔最重要的大使之一，促成了对他的$pod_clan$生存至关重要的联盟。\n作为对他持续良好服务的回报，热尔韦被赋予了可能是他接过的最危险的任务：除掉利沃尼亚的睿魔尔分裂分子。\n\n#bold 你正在一步一步地在金字塔中攀登。你的决心将见证你的成功。#!"
 bookmark_warofprinces_rutor: "鲁托尔"
 bookmark_warofprinces_rutor_desc: "鲁托尔在棘秘魑的土地上出生和长大。他是为战争而生的，为对抗入侵祖国的睿魔尔而生的，他去参仗了，虽然不是他自己选择的。他的主人认为鲁托尔被血缚所制，但鲁托尔对此免疫，最后把她出卖给了她的敌人，赢得了睿魔尔$pod_clan$的$pod_Embrace$作为反逆的奖励。\n然而，鲁托尔一如既往地不满和叛逆，当他认为自己的学徒期结束后，他离开了，去建立自己的权力基地。经过多年的旅行和避免与他的$pod_clan$接触，他最终来到了斯堪的纳维亚，在那里他成为了哥本哈根的亲王。\n\n#bold 你属于你自己，你将创造你自己的命运。#!"
 bookmark_warofprinces_xavier: "哈维尔·德·辛考"
 bookmark_warofprinces_xavier_desc: "作为睿魔尔家族最强大的魔法师之一，哈维尔·德·辛考并不是议会中非常活跃的成员，他更愿意把注意力集中在学习超自然的秘密上，甚至超越吸血鬼和法师。\n因此，也不奇怪哈维尔开始进军北非，他认为这是一个很好的行动基地，可以更多地了解这个对睿魔尔来说相当神秘的大陆。尽管如此，哈维尔也不回避他的职责，自从他到来后，睿魔尔在西班牙和马格里布的影响力都得到了极大的扩展。\n\n#bold 有秘密要学习，有协议要订立……当然，都是为了$pod_clan$的荣耀。#!"
 bookmark_warofprinces_therimna: "泰瑞姆纳"
 bookmark_warofprinces_therimna_desc: "泰瑞姆纳曾经是格拉崔克斯的学徒，格拉崔克斯在她身上看到了固有的魔法火花，以及天赋和奉献精神。她很快就注意到了永生的机遇，并恳求她的主人$pod_Embrace$她，她的主人也照做了，然后让她成为睿魔尔$pod_clan$的正式刽子手，她对这个角色非常满意。\n然而，面对早期睿魔尔$pod_clan$被迫面临的诸多危险，她失去了希望。她现在正在与任何愿意倾听和包庇她的亲王做交易，她知道睿魔尔发现她的背叛只是时间问题。\n\n#bold 你会活下去。无论付出多大的代价，遭受多大的背叛，承受多大的苦难，这一切最终都是值得的。#!"
 bookmark_warofprinces_virstania: "维斯塔尼亚"
 bookmark_warofprinces_virstania_desc: "维斯塔尼亚是睿魔尔法师团中最年轻的学徒，达到了法师等级。但由于她太年轻，她无法与其他魔法师建立友谊。\n格拉崔克斯相信维斯塔尼亚已经成熟，可以帮助他完成下一个计划。她被初拥了，在格拉崔克斯身边辅导了一年后，她被投入到孵化第一批石像鬼的工作中。她用坚定的爱沐浴它们，它们对她的反应就像小鸡对它们的母亲一样。随着岁月的流逝，维斯塔尼亚对她的作品的关心程度已经超过了她的睿魔尔同伴。\n\n#bold 你将为睿魔尔的战争作战，但你渴望有一天晚上，你美丽的婴儿终于可以自由。#!"
 bloodlines_sub_bookmark: "血系"
 bm_1230_warofprinces_sub_bloodlines: "血系"
 bm_1230_warofprinces_sub_bloodlines_desc: "十三主要氏族并非是唯一的黑夜的潜伏者。从德鲁伊派的菈亚南到亚洲的万鬼，血系有很多变体。这些血系与传统的该隐之氏族有一些内在的区别，无论是在他们的弱点、血律，还是两者上。这些血系中的许多，实际上是氏族中的氏族。\n有些是非常有影响力的，如亚洲的万鬼或草原上的安答，而其他的则在湮灭的边缘徘徊，这使得每种血系都是样不同的、复杂的事物。\n\n#bold 十三主要氏族一直以来都是根据他们的政治资产而入榜的，就像最近他们中的睿魔尔的上台一样。也许是时候进行另一次动荡了。#!"
 bookmark_warofprinces_deverra: "德维拉"
 bookmark_warofprinces_deverra_desc: "作为一个有魔法天赋的少女，德维拉出生在利沃尼亚一个信奉于特亚维神的家庭，她从未忘记自己真正的忠诚，甚至当睿魔尔$pod_clan$收她为学徒时也是如此。她要求被调到她的故乡利沃尼亚，以便学习棘秘魑的库都术法。\n很快她就因为原始教徒的行为方式而被其他族人指责，德维拉和她的女巫团不得不寻找新的盟友，她在蒙古军阀喀喇那里找到了。他们很快就不只是盟友了，她现在尽职尽责地保护他和她的族人免受即将到来的基督教的攻击。\n\n#bold 你的信仰正在消亡，但仍有复兴的希望。坚强地站起来，对特亚维尽职尽责，你仍然可能获胜。#!"
 bookmark_warofprinces_magda: "玛格达"
 bookmark_warofprinces_magda_desc: "玛格达出生在费尔博格最后入侵爱尔兰的前几年，年幼时就被收入德鲁伊教派的神职体系中。在入侵过程中，冷酷无情的费尔博格残害了玛格达的身体，并将她抛在一边，直到夜幕降临才勉强维持住生命。她的尊长选择了$pod_Embrace$这个年轻的女孩，而不是看着她的天赋被死亡所剥夺。\n玛格达带着近乎疯狂的愤怒降临到这些入侵者身上，把他们扔回了他们来时的大海。在随后的几千年里，康诺特的女巫一直在寻找足够的血液来弥补她所认为的对她人民的阴险屠杀。\n\n#bold 诺曼人将付出代价，诺斯人将付出代价，罗马人将付出代价……爱尔兰很快就会被血染红。#!"
 bookmark_warofprinces_marconius: "马可纽斯"
 bookmark_warofprinces_marconius_desc: "在$pod_Embrace$之前，马可纽斯是一名凡人法师，擅长炼金术，致力于创造一个完美的存在。在叛教者尤利安皇帝统治时期，他喝下了用哀怒廷妖精的血液制成的魔药，被迅速转变。\n不用说，其他勒森魃也注意到了。随着他在妖精世界中的人脉越来越多，以及他在斯特拉斯堡的据点迅速站稳了脚跟，到目前为止，他们还没有能力对他采取行动。然而，关于他在妖精“盟友”身上做实验的传闻可能很快就会在马可纽斯的防御中产生一个漏洞。\n\n#bold 你走着一条了解你的状况和保持你的亲王领安全之间的危险丝线。切勿坠落。#!"
 bookmark_warofprinces_chinkhai: "剌曷"
 bookmark_warofprinces_chinkhai_desc: "在力量和年龄方面，剌曷在大草原上几乎无人能敌。他是多布鲁为人类时的孙子，也是多布鲁为吸血鬼时的子嗣，几个世纪以来，他一直守护着他$pod_clan$的坟墓。他负责保卫他的人民——安答，对抗亚洲万鬼和其他夜行怪物。\n打心底的游牧者，剌曷在安答的土地上游荡，无论走到哪里都要伸张正义，无论是对入侵者还是对不守规矩的同胞们。就像他经常在草原做的一样，他既不善良也不宽容，他的正义往往是相当无情的。\n\n#bold 你被委托保卫[Glossary('安答','podgloss.anda')]，且你会这样做。可怜那些挡在你面前的人！#!"
 bookmark_warofprinces_catubodua: "波乌狄纳"
 bookmark_warofprinces_catubodua_desc: "波乌狄纳生为一个早已消失的乌尔王国的公主，被认为是生活在传说中的第二城的最美丽的女人。她与布鲁赫和特洛伊尔都很亲近，当他们都陷入血腥冲突时，她感到非常震惊。\n逃离城市后，她被称为高卢女神（她至今仍使用这个名字），也是加洛林王朝复兴的主要力量。她终于在法兰西找到了她所寻找的东西，于是她前往遥远的地方，寻找失落的知识来帮助她堕落的$pod_clan$。\n\n#bold 你对布鲁赫做出了承诺，你打算遵守这个承诺，无论要花多少时间。#!"
 vampire_main_sub_bookmark: "主要"
 bm_1230_inquisitor_sub_zadruga: "家传血仆"
 bm_1230_inquisitor_sub_zadruga_desc: "为服务棘秘魑而经过多代的培育，家传血仆步于活人和死人之间，以及血奴和附庸之间。他们不完全是人类；而是在人类和吸血鬼之间，他们存在于社会规范之外。一些将吸血鬼当作神来崇拜，而另一些人则渴望自己达到这种状态。家传血仆即是凡人棋子，也是初拥候选人。几个世纪以来，与吸血鬼的接触、吸血鬼血液的注入和近亲繁殖，使该类遗传血仆变成了一种独特的超自然生物类型。"
 bm_1230_inquisitor_sub_revenants: "遗传血仆"
 bm_1230_inquisitor_sub_revenants_desc: "血仆属性可是先天的。通过努力，血仆特性可以通过他们吸血鬼主人在数代血仆中的配种努力，继承下来，从而形成遗传血仆家族；能自然分泌精血的血仆。由棘秘魑创造的世袭血仆家族并不是世界上唯一存在的此类宗族。在斯拉夫地盘之外，也可以找到一些“遗传血仆”家族，他们通过人工或偶然的方式用其他氏族的血制造出来。"
 bookmark_inquisitor_esona_bomkazi: "埃索纳·邦卡齐"
 bookmark_inquisitor_esona_bomkazi_desc: "生命女巫邦卡齐举行了一个伟大的仪式，让她与吸血鬼亡灵术师魔蛇鹫怀上了一位美丽的女婴，但这个仪式是有代价的。受孕后，魔蛇鹫和邦卡齐都立即感觉到他们的孩子有些不同。作为生与死的产物，这个被他们命名为埃索纳的女孩是一位[Glossary('遗传血仆','game_concept_revenant_desc')]。魔蛇鹫和邦卡齐的精髓已经融合到了一起，以至于埃索纳和她的后代将永远对血缚免疫，而魔蛇鹫的血脉除了他们之外，再也无法从任何人那里进食。当埃索纳足够大的时候，她自愿提出抚养她父亲的莱本子嗣，她把他看作是自己的兄弟姐妹。从这最初的配对开始，埃索纳的凡人血脉——她根据母亲取名为邦卡齐——与魔蛇鹫的血脉之间就建立了牢固的联系。\n\n#bold 生命与死亡的约定能持续到永远么？#!"
 bookmark_inquisitor_berthold_ducheski: "贝特霍尔德"
 bookmark_inquisitor_berthold_ducheski_desc: "克列夫切斯基是一个不起眼的学者家族，对攻城器械、钟表运转机制和神秘学有着极大的兴趣。这些爱管闲事的人挤进了家传血仆宫廷，并最终发现原来他们热情而又怪异的赞助是棘秘魑。\n\n与魔物的关系不会是永恒的。这片土地上出现了一种新的力量，或者说一种旧的力量发生了变化。睿魔尔家族的和赫耳墨斯法师不仅偷取了棘秘魑的血液成为该隐之子，而且还说服了克列夫切斯基背叛他们的主人。现被称为杜切斯基的钟表匠们现在被束缚在篡位者法师的指令下。贝特霍尔德·杜切斯基以他的智慧和积累的禁忌知识的力量领导着这个家族。\n\n#bold 尽管他很聪明，但他却无法改变他的祖先所造成的局面。#!"
 bookmark_inquisitor_tajaddin_kairouan: "塔杰丁"
 bookmark_inquisitor_tajaddin_kairouan_desc: "凯鲁万是一个源自阿刹迈术士对棘秘魑[Glossary('遗传血仆','game_concept_revenant_desc')]的实验而产生的[ghoul|E]家族。他们来自非洲北部的同名省份，一出生就被训练成初拥的候选人——每个种姓都会从该世系中寻找新人。\n\n塔杰丁被训练成一名战士，擅长潜行和渗透。虽然他还没有被选由初拥，但他相信通过勤奋的奉献，他总有一天会得到回报。他怀疑氏族把他留在身边是为了“留种”，并判决他在几代人之间传宗接代血脉来壮大家族基础。他不排除对他的亲属进行非常个人化的投资，以帮助保证结果。\n\n#bold 他是否会被初拥？等着瞧。#!"
 bookmark_inquisitor_pavel_angustri: "帕韦尔"
 bookmark_inquisitor_pavel_angustri_desc: "在与芭芭雅嘎势力的战争中，突伽·辛和她的雷伏诺子嗣有时会从俄罗斯的游牧民族中制作出血仆。几个世纪以来，他们中的一些繁殖得很好。他们被赋予了隐蔽的力量、超自然的敏捷性和预见力——他们已经成为反抗芭芭雅嘎的影幕的混乱斗争中的优秀派员。\n\n对于凡人来说，安格斯特里家族被视为骗子和巫师而不被信任。他们有一个既旖旎又虚伪的声誉。帕韦尔以其友善的个性和谎言的网络领导着他的家族。\n\n#bold 俄罗斯寒冷的夜晚充满了恐怖，你最好是在跟位好导师在一起。#!"
 bookmark_inquisitor_dhangadeva_nirriti: "诃伽达跋"
 bookmark_inquisitor_dhangadeva_nirriti_desc: "尼利提是个婆罗门种姓家族，业力给了他们一个巨大的负担。侍奉湿婆、楼陀罗和弗栗多等神的圣魔——底提耶。\n\n作为家族的族长和尼利提密教的大祭司，诃伽达跋是该密教事务的有效管理者——即使不是最灵性的开悟者。不过，他祖先的神秘血液在真·嚼克多摩耶——幻象瑜伽的基础知识方面对他很有帮助。这等血是很珍贵的，他必须确保家族保持这个伟大的财富。有了它，他们就可以按照湿婆的旨意，尽其所能地为他们的恶魔主人服务。\n\n#Bold 用谋杀、诡计和对亵渎圣仪来改变世界，这样湿婆就会打开他的第三只眼，带来一个新的世界！#!"
 bookmark_inquisitor_khachigun_kurulas: "合赤温"
 bookmark_inquisitor_khachigun_kurulas_desc: "丘鲁却是[Glossary('安答','podgloss.anda')]的凡人大家族之一，受到於都斤的祝福，拥有安答的一小部分力量。他们存在于白天和黑夜之间的中间地带。\n\n合赤温率领他的家族作为成吉思汗部落的一部分，在草原上驰骋。他是一名艰苦的战士，作为家族的族长，他恪守荣誉准则。战争是漫长的，有时深陷杯中的他看起来有点离家太近，让人分心。\n\n#bold 与血脉相连的兄弟们一起骑马出去，证明自己配得上初拥。#!"
 bookmark_inquisitor_valenti_crassus: "瓦伦蒂"
 bookmark_inquisitor_valenti_crassus_desc: "这些不道德的[Glossary('遗传血仆','game_concept_revenant_desc')]曾经是罗马贵族家族，他们热衷于向该隐之子提供服务以换取权力。由于他们的财产在意大利南部，通常是由勒森魃填充他们的库房。\n\n作为克拉苏家族的族长，瓦伦蒂是一个庄严的谈判者，但也是一个有着颓废食欲的人。\n\n#bold 虽然他目前与暗影之氏族结盟，但一个小小的暗示就能让他为卡米拉的原罪宫廷服务。#!"
 bookmark_inquisitor_habil_qarnaim: "哈比勒"
 bookmark_inquisitor_habil_qarnaim_desc: "在突尼斯附近的漫长黑夜中，有人仍在讲述被征服的迦太基的故事，唱着其的歌。罗马在其秘密主子的领导下，试图摧毁迦太基。他们杀死了英雄，拆毁了城墙，驱散或奴役了人民，并在田里播撒了盐。\n\n人民已经做好了准备。特洛伊尔和汉尼拔的血液流淌在他们的血管里。哈比勒被他的父亲在伟大的将军过世后命名，他已经接管了领导他的部落保护“博学者”的秘密圣地，如杰贝尔·布科宁，的责任。他们等待着，观察着，准备着战争！有人会来重建城市，唤醒沉睡的人民。黑暗的契约需要完成，承诺需要兑现。\n\n#bold 主人是伟大的！我们将看到迦太基的重建！#!"
 bookmark_inquisitor_mohkku_keskinen: "莫赫库"
 bookmark_inquisitor_mohkku_keskinen_desc: "凯斯基宁家族为名为娄希的疯狂上古者服务。不知这位神秘人是如何或何时取得这个家族，也不知她是否用偷来的仪式自己创造了这个世系。凯斯基宁家族是一个非常小的、紧密的家族，他们比他们的玛土撒拉主人更加深不可测。他们在欧洲各地旅行，获取炼金材料，偶尔也会与棘秘魑库都或凡人神秘主义者进行交易，以获取知识。他们修炼古老的、大多被遗忘的魔法，部分原因是他们扭曲的血液和多年来流传下来的传统。\n\n莫赫库几乎和娄希一样疯狂，但他怀有一个他担心娄希不会容忍的秘密。他对他人有怜悯之心，有些时候会暗中采取与深渊的冷酷无情相悖的行动。\n\n#bold 也许除了通过漠视他人，还有另一种获得知识的方式？#!"
 bookmark_inquisitor_johann_gravenor: "约翰"
 bookmark_inquisitor_johann_gravenor_desc: "他们是生活在城郊的野蛮和隐居的家庭，不幸的是他们被诺斯费拉图选中作为仆人。诺斯费拉图通常是[ghoul|E]化动物或罕见的乞丐——但格拉维诺尔是另一种情况。在人和怪物之间，在白天和黑夜之间，他们徘徊在一个可怕的黄昏里。他们每喝一口诺斯费拉图的血，都会使他们进一步陷入诅咒和阴谋之网。\n\n安德斯是家里的长子，他已经接纳了在他心中不断成长的心兽。既然他正在成为一个怪物，他决定陶醉于此。\n\n#bold 那些在格拉维诺尔庄园附近徘徊的人可能会发现自己变成了香肠。#!"
 bookmark_inquisitor_salinguerra_rafastio: "萨林格拉"
 bookmark_inquisitor_salinguerra_rafastio_desc: "最初是来自波河平原的树篱法师和巫师，有些人则与圣叶有联系。没有拉法斯蒂奥能通过任何方式成为吸血鬼；初拥永远不会起作用，[Glossary('遗传血仆','game_concept_revenant_desc')]的残骸会在瞬间化为虚无，阻止任何进一步调查。\n\n萨林格拉领导着一个莉莉丝信徒女巫会。尽管他是个男人，但他的知识以及他在仪式中在痛苦和快乐之间保持的极好的平衡受到了好评。正是通过他精明的谈判，他才得以与黑手联系，安排与恩拉提家族结盟，从而使两个家族都能在意大利北部繁荣发展。\n\n#bold 如果与黑手的联盟得以维持，拉法斯蒂奥就可以发挥，向波河平原外扩张。如果不行，巫会就需要寻找新的盟友。#!"
 bookmark_inquisitor_kakhopala_marijava: "迦羯呼波罗"
 bookmark_inquisitor_kakhopala_marijava_desc: "马里爪哇家族的祖先可以追溯到一个由强盗和刺客组成的图基教教派的领袖。他曾为塔尔玛埃拉的一些善终者服务，作为奖励，他成为了一名血仆。他的子孙被选中成为[ghoul|E]，并从那时起，成了[ghoul|E]家族。\n\n迦羯呼波罗是一个图基教教派的领袖。隐秘的大师们指导他学习枯心之道，但他内心深处的愤怒是对心路的超脱的障碍。他一直很精明地掩盖自己的过激行为，他沉思着，塔尔玛埃拉对他的求赤膊留了更大的神秘，因为他们觉得他不配。迦羯呼波罗对权力的渴望，让他模仿那伽罗阇吞噬人的肉体。\n\n#bold 死亡的秘密可以通过研究老祖的仪式和食欲来发现。#!"
 bookmark_inquisitor_cephus_dhabi: "塞弗斯"
 bookmark_inquisitor_cephus_dhabi_desc: "扎比最初是内尔伽勒在马什坎沙皮尔的仆人，由于他们中的一些人对内尔伽勒失去了信心，并将他出卖给了摩洛，因此遭受了分裂。然而，有些扎比被内尔伽勒用来监视他的血系，并作为他的手段来对付对手，在他们白日睡觉的时候暗杀他们，后来当他在衰旦的面具下再次显露自己时，则是让他的敌人无所遁形。他对那些不追随他的人施加了瘟疫，并把大多数巴力带到了他的身边。当第二次巴力大战衰旦在克诺索斯被击败后，塞弗斯的祖先继续忠于内尔伽勒。\n\n在11世纪，阿扎那利发现了被遗忘的通往哥拉汛的大门。在勒森魃崇魔者的帮助下，这扇门被打开了，通向地下城市和纳姆塔尔的古墓。从古墓里出来后，阿扎那利召集巴力、崇魔者和扎比加入他。\n\n#bold 塞弗斯和他的手下已经响应了哥拉汛的新衰旦的号召。#!"
 bookmark_inquisitor_ebrahim_dhabi: "易卜拉欣"
 bookmark_inquisitor_ebrahim_dhabi_desc: "扎比最初是内尔伽勒在马什坎沙皮尔的仆人，由于他们中的一些人对内尔伽勒失去了信心，并将他出卖给了摩洛，因此遭受了分裂。“瘟疫散播者”的邪恶计划让扎比无法支撑。自从摩洛教团夷平了城市后，扎比就被其他巴力认领了——他们的血统相互隔离了。\n\n摩洛教团成立于13世纪，是在即将成为衰旦的阿扎那利、他的追随者和不以为然的巴力参议之间的血腥冲突中成立的。易卜拉欣和他的家人遵循的是在马什坎沙皮尔背叛内尔伽勒的扎比一族。与某些人不同的是，他们并没有涌向阿扎那利的旗帜——他们已经承诺援助摩洛教团。\n\n#bold 必须在阿扎那利向世界释放纳姆塔尔之瘟疫之前阻止他！#!"
 bookmark_inquisitor_pancrazio_rosselini: "潘克拉齐奥"
 bookmark_inquisitor_pancrazio_rosselini_desc: "与乔凡尼家族一样，罗塞里尼家族也与威尼斯有着密切的联系，这两个家族都在那里从事亡灵术。在中世纪的其他法师眼中，罗塞里尼家族被认为是更有天赋的亡灵术师。除了亡灵术之外，许多罗塞里尼还是术士。即使如此，罗塞里尼也常常被认为是歇斯底里或各方面不稳定的人。在他们的乔凡尼对手化入卡帕多西亚血系后，罗塞里尼起初没有受到影响，只是他们开始更加努力地推动自己和自己的艺术，以便与对手竞争。罗塞里尼经过奥古斯都·乔凡尼的精心培育，成为了血仆，此前他们正向乔凡尼寻求治疗困扰他们的一种可怕疾病的方法。\n\n#bold 即使按照乔凡尼的标准，罗塞里尼家族的族长潘克拉齐奥也被认为是相当残忍的。#!"
 bookmark_inquisitor_sadiq_rawan: "萨迪克"
 bookmark_inquisitor_sadiq_rawan_desc: "这家族曾经是卑微的渔民，现在已经被古怪的梵卓阿努欣·拉万支配并培养成他的仆人。从者被培养成对阿努欣·拉万表示顺从，这一点也延续到了她的后代身上。这些生物充当娱乐奴隶、血皿和仆人。\n\n萨迪克几乎是阿努欣·拉万的完美的仆人——勤奋、耐心、沉默。他甚至还很帅。他似乎总是知道该说些什么，甚至能与该隐之子就各种高智商话题进行交流。他唯一的缺点是喜欢吃甜食和糕点——以及他倾向于品尝他碰巧与之有亲的美丽佳肴。\n\n#bold 阿努欣·拉万要求有一座宫殿和与之匹配的仆人。对那些来访的人来说，它是一个天堂，无论是生者还是死者。甚至尖叫都不常见。#!"
 bm_1375_patronwar_sub_brujah: "布鲁赫氏族"
 bm_1375_patronwar_sub_brujah_desc: "布鲁赫在非洲西部推举了一位自称汉尼拔的普罗米修斯派领袖，组成了一个新迦太基。"
 bm_1375_patronwar_sub_cappadocian: "卡帕多西亚氏族"
 bm_1375_patronwar_sub_cappadocian_desc: "黑死病在整个已知世界杀死了数百万人。这一切是死亡之氏族的阴谋吗？他们仔细地研究了这疾病。"
 bookmark_patronwar_marcus: "马库斯"
 bookmark_patronwar_marcus_desc: "禁欲者用黑死病带来的满山遍野的尸体进行各种形式的实验。他们是为了寻求瘟疫的力量，还是为了永远结束它？"
 bm_1375_patronwar_sub_setite: "赛特之子氏族"
 bm_1375_patronwar_sub_setite_desc: "信仰之氏族继续坚守其在埃及的堡垒，现在由一位罗马百夫长领导。"
 bm_1375_patronwar_sub_gangrel: "冈格罗氏族"
 bm_1375_patronwar_sub_gangrel_desc: "随着这么多的人死去，文明似乎要崩溃了，现在是狼的时代。到处都是侵占了织者领域的荒野。幸存者们转向原始教神秘主义，寻求治愈这场可怕瘟疫的方法。野兽能使世界重新焕发生机吗？一个人与自然和谐相处的世界；一个完美的狩猎场，在这里，冈格罗可以捕食血畜。"
 bm_1375_patronwar_sub_lasombra: "勒森魃氏族"
 bm_1375_patronwar_sub_lasombra_desc: "暗影之氏族已经陷入困境，他们的宗教团体成群结队地死去，修道院变成了坟墓。血畜呼唤着天主的救赎……而祂却没有回应。随着他们对凡人的影响逐渐减弱，一些贤士深深地凝视着黑暗，寻找答案。他们是否听到了答案的低语？"
 bm_1375_patronwar_sub_malkavian: "末卡维氏族"
 bm_1375_patronwar_sub_malkavian_desc: "在这场灾难中，人们挣扎着想了解发生了什么。神抛弃了他们吗？天启到了吗？火焚末日来了吗？神谕宣布了新先知的到来，他们承诺会有救赎或更大的谜团。"
 bookmark_patronwar_aleksandr: "亚力山大"
 bookmark_patronwar_aleksandr_desc: "第三该隐教会的普世牧首。"
 bm_1375_patronwar_sub_nosferatu: "诺斯费拉图氏族"
 bm_1375_patronwar_sub_nosferatu_desc: "先觉者们在阴影中游荡。许多人已经完全蛰眠了；不过还有几位在瘟疫医生的面具后面捕食病人和垂死者的人。"
 bookmark_patronwar_nicolas_davry: "尼古拉·德阿夫里"
 bookmark_patronwar_nicolas_davry_desc: "还有什么比诺斯费拉图骑士更可笑的呢？一个将成为法兰西西部亲王的诺斯费拉图骑士。"
 bm_1375_patronwar_sub_ravnos: "雷伏诺氏族"
 bm_1375_patronwar_sub_ravnos_desc: "即使是流浪之氏族也无法逃脱这疾病的侵袭。即使他们跑到天涯海角……甚至爱尔兰也不能幸免于黑死病的蹂躏。"
 bm_1375_patronwar_sub_toreador: "妥芮朵氏族"
 bm_1375_patronwar_sub_toreador_desc: "花园已死。这么多艺术家都死了。再也没有聚会了。玫瑰花瓣的气味几乎不能掩盖到处都是的腐烂尸体的臭味。然而，如果你仔细观察，有新芽萌生，有春天的希望。初拥那些仍然可以被拯救的艺术家，并尽可能地获得血液。"
 bookmark_patronwar_cecilia: "塞西莉娅"
 bookmark_patronwar_cecilia_desc: "有些欲望被禁止是有道理的。"
 bm_1375_patronwar_sub_tremere: "睿魔尔氏族"
 bm_1375_patronwar_sub_tremere_desc: "在黑死病的混乱中，许多七人议会至少也不温不火地陷入瘫痪，三家伟大的家族在努力领导睿魔尔。"
 bookmark_patronwar_cyrus: "居鲁士"
 bookmark_patronwar_cyrus_desc: "绿狐的巫士团已经主宰了法兰西东部地区。有传言说，这个巫团已经不再严格遵守睿魔尔法典，而是遵守人性之路和潜藏戒律。"
 bm_1375_patronwar_sub_tzimisce: "棘秘魑氏族"
 bm_1375_patronwar_sub_tzimisce_desc: "当大多数氏族在这场世界末日级瘟疫中挣扎求生时，棘秘魑却在茁壮成长。要么转变，要么灭亡，哦，棘秘魑是如何转变的：要么变成人类的完美理想化概念，要么变成颓废的享乐主义新极端，要么是来自外界黑暗的一些不可知的血肉变异。"
 bookmark_patronwar_matthaios: "马特忒俄斯"
 bookmark_patronwar_matthaios_desc: "雅撒库的追随者在西伯利亚北部的冰天雪地里建立了一个王国，他们将其称为许珀耳玻瑞亚。"
 bm_1375_patronwar_sub_ventrue: "梵卓氏族"
 bm_1375_patronwar_sub_ventrue_desc: "在瘟疫的混乱中，世界呼唤着秩序——而王者之氏族将作出回应！我们将履行对血畜的义务，但为了生存，我们必须有绝对的服从和效忠。我们不会容忍对我们权威的挑战。拳里的权杖至高无上。"
 bookmark_patronwar_nicholas_masterson: "尼古拉斯·马斯特森"
 bookmark_patronwar_nicholas_masterson_desc: "一位宣布自己为舍特守护者的梵卓，这个高贵的血族一直在努力保护血畜不受黑死病之夜中最可怕的怪物的猎食。"
 bm_1375_patronwar_sub_bloodlines: "血系"
 bm_1375_patronwar_sub_bloodlines_desc: "在黑死病之后，某些血系暂时能够重新确立自己的地位。最值得注意的是，巴力在美索不达米亚建立了一个帝国，他们在那里遭到了仍然坚守橄榄议会的萨洛比的反对。在大不列颠，一个新的阿瓦隆在萨洛比的领导下出现了，他声称自己是亚瑟王的衣钵传人——与此同时，在苏格兰出现了一只妖精眷染的遗传血仆血系。另一个萨洛比国度在一位中国神秘主义者的领导下在拉萨建立。甚至劣族也在威尼斯找到了一位斗士！"
 inquisition_sub_bookmark: "裁判所"
 zadruga_sub_bookmark: "家传血仆"
 revenants_sub_bookmark: "遗传血仆"
 ghouls_sub_bookmark: "血仆"
 patron_main_sub_bookmark: "主要"
 bookmark_patronwar_brand_de_draeck: "布兰德·德·德雷克"
 bookmark_patronwar_brand_de_draeck_desc: "他是一个被称为“德·德雷克”的有能战士。他击退了在周围地区强行索贡的丹麦人。他拒绝向丹麦人付款。在随后的战斗中，荷兰人取得了胜利，800名丹麦人中有500人被杀，包括他们的领袖。然而，荷兰人也失去了他们的领袖。\n\n或者大众是这样想的，实际上他在战斗中被初拥了，被着魔了，改变了他的身份，并从那时起在欧洲旅行，寻找他的归宿。最终，他回到了荷兰，在阴影中进行统治，同时努力恢复自己的理智——或者说屈服于疯狂。"
 bookmark_patronwar_richard_uagemred: "理查·乌格姆雷德"
 bookmark_patronwar_richard_uagemred_desc: ""
 bookmark_patronwar_luna_morningstar: "卢娜·莫宁斯塔"
 bookmark_patronwar_luna_morningstar_desc: "作为人类时，卢娜总是与她的同龄人不同。她对生与死持怀疑态度，对怪异的事物感兴趣，并爱上了黑夜。有些东西使她平静下来。缓慢但无情的微风穿过她父母房子的岩石时，其他孩子会吓到，她却感到舒适和安全。木头在她脚下的破裂声和黑暗房间的寂静激发了她的想象力。她的美貌似乎是永恒的，但在她拒绝邻居男孩的求爱并被宣布为女巫时，她的美貌几乎熄灭了。当审问者把她送上木桩时，她愤怒和痛苦的哭声传到了当地的一位吸血鬼领主那里，他看到了她对人类的无情仇恨。他救了她，并在不久之后初拥了她。他想看看这样一位美丽而疯狂的人在自取灭亡之前能造成怎样的混乱和痛苦，或者她是否能通过在黑夜宫廷中升阶，成为真正的夜之女主人。"
 bookmark_patronwar_lucia_canale: "露西娅·卡纳莱"
 bookmark_patronwar_caelia_tertia: "凯莉娅·忒尔狄亚"
 bookmark_patronwar_bimbee: "宾比"
 bookmark_patronwar_bimbee_desc: ""
 bookmark_patronwar_gorm: "戈尔姆"
 bookmark_patronwar_gorm_desc: "此人是一位凶猛的战士。他在战场上的意志和他对部队和地利的精心掌控使他获得了许多成功的战斗。在其中一次战斗中，他被布伦希尔德发现了。当他在杀死四个刺客后奄奄一息时，她初拥了他，让他独自在荒野中生存。在那些日子里，他了解到社交能力和计谋是如何只为弱者服务的，并利用他的狡猾和力量，以稳定的效率进行狩猎。在了解到自己成为什么之后，他开始积极废止那些唾弃神灵的人。作为一个指挥官和刽子手，他被派去杀死生命之树的腐烂根须。任何偏离道路的$pod_Embrace$都必须为他们对神灵犯下的罪行负责，他们中很少有人能活到加入基督教的时候。然而，他每打赢一场战役，就会有其他战役失败，基督教徒似乎从未退缩过。他的羊群的心受毒害后，$pod_Embrace$之间的许多争吵导致了米德加尔德的崩塌。"
 bookmark_patronwar_michel_tenoctis: "米歇尔·特诺克蒂斯"
 bookmark_patronwar_michel_tenoctis_desc: "人们对他的了解并不多，因为他通常都是独来独往地研究深渊。众所周知的是，在他被再造之前，他已经发现了深渊的存在并开始研究。这引起了勒森魃氏族的注意，并最终导致了他目前的不死族状态。"
 bookmark_patronwar_gabriel_felipe: "加百列·费利佩"
 bookmark_patronwar_gabriel_felipe_desc: "加百列是一位曾是贵族家庭的后代，自出生以来就被培养为统治者。在他受初拥之后，他选择避开众人的目光，从阴影中进行统治，这作为勒森魃氏族的成员是相称的。"
 bookmark_patronwar_elder_diego: "埃尔德·迭戈"
 bookmark_patronwar_elder_diego_desc: "迭戈是一个基督教圣修士会的前僧侣。他曾经是一名猎人，但在一次成功的猎杀后，被一位感兴趣的尊长初拥了——且并不太关心迭戈干掉的几个稚子。"
 bookmark_patronwar_hakon_fystond: "哈孔·斐斯通"
 bookmark_patronwar_hakon_fystond_desc: "由于他的皮肤像尸体一样苍白，他小时候总是引起大家的注意，他大部分时间都在森林里觅食，后来开始打猎，他很聪明，很狡猾，后来加入了一个盗贼团，以袭击在诺马克旅行的士兵和商人而闻名。他最终加入了盗贼团，并“幸运”的被初拥了。\n他的尊长是来自暗影之海中的受弃者，但从未提及为何。"
 bookmark_patronwar_eridanus: "厄利达诺斯·厄雷玻斯"
 bookmark_patronwar_eridanus_desc: "觉察到再造了他的怪物的非自然交易，达米安旨在发现他在他们的阴谋中所扮演的角色，并找到一种方法来解除灵幻的束缚，这种束缚迫使他静静地观察在背信弃义的傻瓜中的令人厌倦的小政治。即使现在死了，他也在寻求解决他从出生起就一直遵循的道路。\n\n#bold 遵随阻力最小的路径，就像河流的流动一样，只有当到大海时才会结束。#!"
 bookmark_patronwar_jimeno_fitzroy: "希梅诺·菲茨罗伊"
 bookmark_patronwar_jimeno_fitzroy_desc: "在被初拥之前，希梅诺·菲茨罗伊是瓦伦西亚的一个小贵族——与某个西班牙国王有远亲关系（他声称是这样）。他建立了一些恶名，因为他自由地与无良商人、盗贼和黑帮混在一起的事实。他的堕落和为自己的利益弯曲法律的意愿引起了一个强大的勒森魃的注意，他在寻找一个值得初拥的凡人。\n\n在初拥之后，希梅诺发现自己被阴暗的海浪所吸引——正如一些勒森魃一样。他招募了他在前世认识的罪犯作为船员，开始了充满冒险、战斗和大量掠夺战利品的伟大航程。对一些海盗来说，袭击和狂欢已经足够了，但希梅诺最终发现他的海上生活……受到了限制。利用十字军东征造成的黎凡特地区的混乱，他夺取了几个关键港口的控制权，决定“开店”。鸦廷由此诞生。"
 bookmark_patronwar_narcandana_markov: "纳兰达纳·马尔可夫"
 bookmark_patronwar_narcandana_markov_desc: ""
 bookmark_patronwar_petronia: "佩托妮"
 bookmark_patronwar_petronia_desc: ""
 bookmark_patronwar_bronach_o_cennfhaelaid: "布罗纳赫·奥森法哈莱德"
 bookmark_patronwar_bronach_o_cennfhaelaid_desc: ""
 bookmark_patronwar_izalda_kishlovsky: "伊扎尔达·基什洛夫斯基"
 bookmark_patronwar_izalda_kishlovsky_desc: "伊扎尔达离开了她的[Glossary('尊长','game_concept_Sire_desc')]梅兰迪斯，并放逐了自己，仍然对她的姐妹们的死亡充满了悲伤。在这期间，她深入研究了自己的$pod_clan$历史，发现了关于解密会的文本和信息。\n现在，在学会的启发下，她回到了自己的故乡文奇察，轻松地当上了女伯爵。然而，这只是一个更复杂的计划的第一步，该计划旨在提升末卡维和解密会的地位。同时，她将站在中间，准备在世界范围内释放真正的知识并收获其力量。"
 bookmark_patronwar_anatolios_tenebris: "阿那托利俄斯·泰涅布里斯"
 bookmark_patronwar_anatolios_tenebris_desc: "阿那托利俄斯将自己打造成一个忠诚、有执行力和聪明的家族成员。在这么短的时间内，他得以把以前的地方统治者赶走，并宣誓效忠于军督领的统治者。无论是弗拉基米尔·罗斯托维奇还是母主都不怀疑他的忠诚。但是，如果忠诚和誓言不过是幌子，而新的“家庭”是为旧的、真正的家庭复仇的主要目标呢？时间会告诉我们。"
 bookmark_patronwar_narcissus_cephissus: "纳西索斯·刻菲索斯"
 bookmark_patronwar_narcissus_cephissus_desc: ""
 bookmark_patronwar_tykado: "泰卡多"
 bookmark_patronwar_tykado_desc: ""
 bookmark_patronwar_daniel_hawk: "达尼尔·霍克"
 bookmark_patronwar_ghazia_khatun: "加齐亚·可敦"
 bookmark_patronwar_ghazia_khatun_desc: ""
 bookmark_patronwar_ruadh_sutherland: "鲁阿兹·萨瑟兰"
 bookmark_patronwar_ruadh_sutherland_desc: "他是基督教的大主教。他相信吸血鬼是天主意志的一部分，但初拥使他发生了偏转。他认为吸血鬼是人类的牧羊人，人类只是牲畜，通过吸血鬼的意志被引导到他们认为和看到的正确事情上。虽然他认为人类不应该撒谎或杀人（除非他们的吸血鬼领主告诉他们这样做），但他认为吸血鬼被允许使用这些工具“用于更大的善”。他相信人们或好或坏，非此即彼，并以黑白两色看待世界。他被格拉崔克斯接纳为牧师，对宗教和神秘学有着丰富的知识。当被初拥时，萨瑟兰偏转了。到了一个程度，甚至格拉崔克斯不得不把他送去马耳他一段时间，以便他能平静下来，让他的头脑清醒。他的应对机制使他仍然相信自己是天主的代理人，但后来他开始把世界看成是黑与白，善与恶。"
 bookmark_patronwar_morgano_murchadh: "摩加诺·穆尔查"
 bookmark_patronwar_morgano_murchadh_desc: "摩加诺在最近的夜晚因他的疯狂而闻名，在从他隐居研究中走出来后，巫士看到许多次级的血族，如劣族，已经上升到了显赫的位置。在大量研究了火焚末日预言之后，他把这当作一个预兆，并开始了自己的圣战，要把欧洲的无族者清洗干净，在他这样做的时候，他把许多传统的吸血鬼召集到了自己身边。虽然他曾经在俘虏身上做实验，但穆尔查家族的疯狂领主现在选择在木桩上或在他们的家里烧死他的敌人，有时，如果有谣言说他们窝藏着无族者，整个村庄和城镇都会被烧成灰烬。然而，由于他的孤僻和上位氏族的冷漠，没有人阻止摩加诺对匈牙利的疯狂扫荡。"
 bookmark_patronwar_descardion: "德斯卡迪翁"
 bookmark_patronwar_descardion_desc: "他从埃及的采石场被挖出来，当时他的学习力和洞察力引起了他尊长的注意。他的尊长灌输了对知识的渴求，以帮助他对抗时间的停滞。作为塔里克·萨玛的追随者，德斯卡迪翁相信自我和心兽之间的斗争是真主的终极考验。他勤奋工作，把学习和信仰带给他周围的人。他的实验通常是内化的，但他过去曾采取过极端的措施，如把整个村庄的人都吃掉，或亲自执行一个月的禁食，以净化当地部落的身心（和弱者）。作为为数不多的识字者之一，德斯卡迪翁一直保持着大量的日记和书面文字，因此他的宫廷对教育和策略的重视超过了其他任何特征。德斯卡迪翁越来越关注保护他的工作，并在北非变得积极主动，试图阻止国王和金字塔控制埃及的人民。"
 bookmark_patronwar_dunnlang_cathail: "邓朗"
 bookmark_patronwar_dunnlang_cathail_desc: ""
 bookmark_patronwar_liliana_szantovich: "莉莉安娜·桑托维奇"
 bookmark_patronwar_liliana_szantovich_desc: "被她的尊长斯托弗·拉芬斯堡初拥，祖先可追袭到魔龙。在她初拥的早期，她发现斯托弗是崇魔者，在他的另一个子嗣米格尔·巴巴内格拉的帮助下，追捕了斯托弗并将他最终杀死。现在，她努力确保自己在军督布兰科维努宫廷内的地位，尽管他们对彼此的心路有敌意。她仍然对她以前的[Glossary('遗传血仆','game_concept_revenant_desc')]养父母持有一定程度的孝心，并试图保护和确保她的老家族在这个世界上的地位，但收效甚微。"
 bookmark_patronwar_faustus_desdeuxvalleesvertes: "福斯图斯·戴什·瓦利·维特斯"
 bookmark_patronwar_faustus_desdeuxvalleesvertes_desc: ""
 bookmark_patronwar_severus_maximus_dominatus: "塞维鲁·马克西米努斯·多米那特"
 bookmark_patronwar_severus_maximus_dominatus_desc: ""
 bookmark_patronwar_kylar_shadovie: "凯拉"
 bookmark_patronwar_kylar_shadovie_desc: "作为贵族的私生子出生，他学会了宫廷密谋以生存，尽管他是一个多病的孩子。26岁那年，当他正在为他的主人制作一个把柄时，一位吸血鬼闯入了他的城堡并初拥了他。"
 bookmark_patronwar_aryan_de_gray: "阿尔扬·德·格雷"
 bookmark_patronwar_aryan_de_gray_desc: "阿尔扬·德·格雷出生为无地的骑士，他在主子的宫廷里度过了他的童年。他在战斗中表现出了自己的能力，为他赢得了领主卫队中最年轻的成员的位置，很快就在他的军队中获得了指挥职位。在诺曼底的一次叛乱中，这个年轻人有了机会证明自己。在五年的时间里，他被抓了三次。两次被赎回，一次逃脱。尽管有这些不幸的情况，但他的勇敢和技巧受到了赞扬，赢得了国王本人的信任。他职业生涯的高潮带来了战争的结束，在1119年的布雷米勒之战中，他成功地击溃了敌人的骑兵，并率领骑兵冲向他们的右翼。这次机动与他得到的命令毫无关系，被描述为“天才的一击”和“纯粹的疯狂行为”。无论是哪种情况，它都导致了一场决定性的胜利，而这场胜利似乎让阿尔扬失去了生命。一位吸血鬼则不同意此。"
 bookmark_patronwar_robert: "罗伯特"
 bookmark_patronwar_robert_desc: ""
 bookmark_patronwar_patrick_ramos: "帕特里克"
 bookmark_patronwar_patrick_ramos_desc: "被初拥后，他只能自生自灭，赢得尊重的唯一方法是通过力量和权力。由于没有氏族的支持，帕特里克渴望有一天能将该隐之子和凡人置于控制之下，他将不惜一切代价获得权力并按照自己的意愿建立世界。"
 bookmark_patronwar_aedan_cathasach: "艾丹·凯瑟琳"
 bookmark_patronwar_aedan_cathasach_desc: "艾丹被一位真布鲁赫长者所初拥，他关心着白嚎的消失和腐败。作为与白嚎一起协作的德鲁伊的后裔，他的尊长希望艾丹能对这个谜团提供一些见解。"
 bookmark_patronwar_illitharn_sagaard: "伊利萨恩·萨加尔德"
 bookmark_patronwar_illitharn_sagaard_desc: ""
 bookmark_patronwar_abe_no_seimei_onmyoji: "安倍晴明"
 bookmark_patronwar_abe_no_seimei_onmyoji_desc: "日本平安时代中期的阴阳大师。阴阴道是一种自然科学、天文、历法、占卜和魔法系统，以中国的阴阳和五行哲学为基础在日本独立发展。除了他在历史上的突出地位外，他还是日本民间传说中的传奇人物，在许多故事中都有描绘。安倍晴明作为阴阳师，为天皇和平安时代政府工作，就处理问题的正确精神方式提供建议。他为天皇和政府的福祉祈祷，并就各种问题提供建议。他也是一位占星家，预测星象事件。他的寿命非常长，没有任何重大疾病，这促使人们相信他有神秘的力量。在他生命的最后阶段，他被东方的一位萨洛比所初拥。"
 bookmark_patronwar_cody_dio: "科迪·迪奥"
 bookmark_patronwar_cody_dio_desc: ""
 bookmark_patronwar_arturia_pendragon: "阿尔托莉雅"
 bookmark_patronwar_arturia_pendragon_desc: "她声称要领导不列颠人的防御工作，对抗入侵的撒克逊人，并在凡人中伪装成一个男人。"
 bookmark_patronwar_alexandru: "亚历山德鲁"
 bookmark_patronwar_alexandru_desc: ""
 bookmark_patronwar_alexarchus: "亚历撒库斯"
 bookmark_patronwar_alexarchus_desc: "亚历撒库斯是一位著名的神秘主义者，在世界还很年轻、没有现在这么血腥的时候，他就在世界范围内旅行。看到古代世界慢慢陷入危险和琐碎的权力斗争，他专注于他作为一个神秘主义者的工作，为经常逃离城镇的民众提供一些痛苦中的慰藉。当他的初拥发生时，他并没有马上失去他善良的天性，但他确实变得非常隐蔽。在这些时候，他大部分的夜晚都是在他的房间里度过的，试图实现那些经常无法实现的目标。"
 bookmark_patronwar_irge_hectsaehtf: "依尔格"
 bookmark_patronwar_irge_hectsaehtf_desc: ""
 bookmark_patronwar_lucia_canale_desc: "露西娅像是突然登场的，幸运的是，在她崛起的过程中，她的许多对手都有“不幸的事故”或特别突然的改变。她的尊长被确认为一个被称为朱塞佩的阴暗男人，最后一次被看到是在与她会面的路上；不知道他的命运是被吸榨，还是仅仅是终焉之死，以结清最后的尾巴。如果你的间谍总管不是很能干，也许就不应该激怒她。"
 bookmark_patronwar_caelia_tertia_desc: "凯莉娅于公元390年出生在罗马城，生活中是罗马百夫长的第三个孩子。关于她的凡生，人们知道的不多，只是因为没多少可知道的，更不用说她那个时代的大部分记录都被销毁了；她在罗马过着平淡的生活，直到公元410年高卢人洗劫了罗马。她的父亲和哥哥们在战斗中丧生，在试图逃离时，她发现自己被一个血族袭击了。她尽力反击，但这从一开始就是一场无望的战斗，她被轻蔑地打败了。此后，她向东逃亡，在接下来的几个世纪里，她不断扩大和掌握自己的力量，并收集资金和权力。现在，她的时代可能终于到来了……"
 bookmark_patronwar_daniel_hawk_desc: ""
 bookmark_patronwar_gavrili: "加夫列"
 bookmark_patronwar_gavrili_desc: "加夫列是个小贵族。像他的父亲和祖父一样，在凡生时是一名士兵。他被培养成了他的人民的保护者。\n\n作为一位吸血鬼，他变态地以猎杀和吸食他以前的土地上的凡人为乐。\n\n尽管对他的氏族很忠诚，加夫列却很难理解棘秘魑的高级哲学。他通过将自己隐居在他的领地并专注于繁殖[ghoul|E]世系来进行补偿。"
 bookmark_patronwar_amducious: "阿姆杜乌斯"
 bookmark_patronwar_amducious_desc: "阿姆杜乌斯于787年出生在法兰西，是查理大帝统治时期宫廷中的一名法兰西贵族。他是查理大帝最亲密的顾问之一，也是一个极其聪明的人。他以其狡猾和奸诈的头脑而闻名，但也被法兰西宫廷中常见的妄想症所困扰。在查理大帝去世的当晚，他被阿扎那利初拥，很快就接受了他的新亡生，并摆脱了他的旧生活，他的原名也消失在历史中。教团现在只知道阿姆杜乌斯。他学崇魔术学得很快，在教团中被称为地狱衍体之主，并因其实验和研究在血系中受到高度尊重。"
 bm_1510_birthofsects: "秘盟与魔宴"
 bm_1510_birthofsects_desc: "裁判之年和大反乱已经随着1493年的荆棘大会而结束。这一重大事件引发了秘盟的创建，这是该隐之子有史以来最雄心勃勃的壮举，他们试图通过一套旨在维护潜藏的戒律来组织自己。\n但并不是所有的氏族都同意这一套，另一个以他们的怪物本性为基础的党派，也应运而生：魔宴。\n不过，并非所有的吸血鬼都在这两新方向中二选一，他们的未来仍然相当不确定。\n\n#bold 守矩的秘盟，野蛮的魔宴，幸存的叛党或剩余的独立分子……谁将大获全胜？#!"
 bookmark_birthofsects_tyler: "泰勒"
 bookmark_birthofsects_tyler_desc: "在支持英格兰起义军瓦特·泰勒的农民中，帕特莉夏成为了他的情人。不久后，她被抓获，被扔进了监狱，等待着死亡，这时一位名叫罗宾·李兰德的布鲁赫向她坦白了他对她的革命热情的钦佩。在对她的牢房结束访问时，罗宾初拥了她。\n在她[Glossary('尊长','game_concept_Sire_desc')]的启发下，她最终成为叛党事业的主要领导人之一。1394年，她是攻击西班牙一座小城堡的队伍中的一员。在战斗中，她趁机吸榨了老哈德施塔特。这一事件巩固了她永远的名声，所有叛党现在都把她视为最终将带领他们走向辉煌的英雄。\n\n#bold 有人说，大反乱已经结束，长者们已经赢了。但如果说罗宾教会了你什么，那就是这场斗争永远不会真正结束。革命是永恒的。#!"
 bookmark_birthofsects_genevra: "格内弗拉"
 bookmark_birthofsects_genevra_desc: "在凡生中，格内弗拉是一位意大利贵族，但在黑夜，她作为小家臣和受苦器具为乔凡尼服务。她利用自己相当高的阴谋能力，成功地骗过了她的主人，迫使他$pod_Embrace$她。\n格内弗拉重复了这一成功，这次她带领裁判官找到了她的弱小族人。她协助铲除了这么多吸血鬼，为格内弗拉赢得了裁判所的感激，她能够将这种感激转化为乔凡尼在教会本身的影响力。胆大妄为的乔凡尼$pod_clan$因此能够将这些裁判所的目光转向其他氏族的敌对吸血鬼。格内弗拉利用这种独特的影响力作为筹码，获得了守卫森严的亡灵术教导。\n\n#bold 你快速而诡谲的权力崛起为你赢得了许多敌人，你必须继续在通往顶峰的道路上智取他们。#!"
 bookmark_birthofsects_giangaleazzo: "加莱亚佐"
 bookmark_birthofsects_giangaleazzo_desc: "加莱亚佐被勒森魃修士[Glossary('初拥','game_concept_Embrace_desc')]，他很欣赏他的机智和意志力。初拥后不久，加莱亚佐就在不死族中兴旺起来，陶醉于他作为黑夜领主之一的新状态。他的[Glossary('尊长','game_concept_Sire_desc')]把他带到了荆棘大会，在那里他是少数支持秘盟的勒森魃之一，这要归功于他与一位猎巫人的不愉快的遭遇。魔宴组织成立后，加莱亚佐小心翼翼地脚踏两条船，试图保持中立。在他把他的尊长出卖给魔宴之后，他被该党派接受，并被授予米兰大主教的称号。\n\n#bold 你在魔宴的地位攀升得比大多数人想象的要快。虽然你并不真正关心他们的教条，但现在它们是有用的。毕竟，一个真正的现代亲王会抓住所有呈现给他的机会……#!"
 bookmark_birthofsects_villon: "弗朗索瓦·维永"
 bookmark_birthofsects_villon_desc: "原名为纪尧姆·德·洛里斯，并拥有许多其他名字，却被压在了可怕的海伦的獠牙下被冷酷无情的$pod_Embrace$。陷入绝望的纪尧姆花了很多年时间，在美丽的维奥莱塔的不断支持下，才重生为弗朗索瓦·维永。\n这位新男人会让他过去的自己感到恐惧，他几乎是他的[Glossary('尊长','game_concept_Sire_desc')]的复制品，一位冷酷无情、渴望权力的享乐主义者，几乎没有任何道德上的顾虑。不过，弗朗索瓦也不在乎了，他的权力崛起已经开始。海伦在他身上看到了一个潜在的天才，这是很正确的，因为在不到两个世纪的时间里，这个曾经沮丧的稚子现在是法兰西第二最具影响力的吸血鬼。\n\n#bold 你已经摆脱了你自己的凡生和它琐碎的道德底线。现在你是一个无情的、野心勃勃的权贵，你喜欢这样。法兰西只差一些背叛和破碎的心就能属于你了…….#!"
 bookmark_birthofsects_tepes: "弗拉德·德古拉"
 bookmark_birthofsects_tepes_desc: "弗拉德·采佩什生前是瓦拉几亚的一位足智多谋而又残忍的大公，在他“死亡”之前，他一直在饮用被他捕获并锁在德古拉堡中的吸血鬼的血液，并了解他们的秘密。\n由于对黑夜社会的好奇，弗拉德寻找一个能够给予他$pod_Embrace$的指路人——或受害人。他耐心地准备了一个计划，在他的城堡附近策划了一场秘盟与魔宴之间的战斗。一旦两股势力都被削弱，弗拉德就一举消灭他们，俘获剩下的最强大的吸血鬼为己所用。\n弗拉德·采佩什现在是一个非常年轻的吸血鬼，有很多敌人，但他们中的大多数人才刚刚开始了解他的才能。\n\n#bold 总有一夜，你会像该隐一样出名。但在那之前，你必须打造你的传奇，像你为凡人时一样去征服。特兰西瓦尼亚将永远是你的，而且只属于你一人。#!"
 bookmark_birthofsects_tegyrius: "特琪洛士"
 bookmark_birthofsects_tegyrius_desc: "作为凡人时，特琪洛士曾在亚历山大大帝的军队中服役。[Glossary('初拥','game_concept_Embrace_desc')]为$pod_clan$维齐尔种姓的一员，特琪洛士长期以来一直相信哈基姆的子嗣即是审判者的故事。\n他的大部分时间都在扮演这个角色：在$pod_cainites$之间的争端中作为匿名仲裁者，在优士丁尼法典编纂过程中待在拜占庭宫廷，或者像猎狼一样游荡，杀死他的敌人。\n随着推罗协议迫使哈基姆的子嗣与秘盟达成了不稳定的和平，安纳托利亚需要特琪洛士的外交技能，他的族人和秘盟共享这份脆弱地休战协议。\n\n#bold 你必须保护你氏族的利益，也许甚至要对抗自己。无论秘盟是否持续存在，安纳托利亚必须对哈基姆的子嗣保持安全。#!"
 bookmark_birthofsects_karsh: "喀什"
 bookmark_birthofsects_karsh_desc: "喀什被认为曾是塞尔柱人哈桑·萨米尔，曼齐刻尔特的征服者，最伟大的将军，曾为新生的奥斯曼帝国的两个苏丹服务，土耳其人在诗句中赞美他：“萨米尔，伟大的萨米尔，不可阻挡的萨米尔，古老的蓝天下最强大的战士。”\n该隐之子的历史学家们讲述了不死之手与不朽意志之间的祥和聚会。就在那里，哈桑·萨米尔向一位自称是梵卓的哈德施塔特的不朽者宣誓永远效忠，他是人类和怪物的领袖，他的话语能动摇国家，并拥有不可思议的智慧，他知道话语并不总是足够的。哈桑·萨米尔发下誓言，成为秘盟战将喀什。\n\n#bold 在和平时期，你沉默寡言，但只要上了战场，你就会变成一台杀人机器。任何威胁到秘盟的人都要先过你这一关。#!"
 bookmark_birthofsects_erianthe: "埃利安"
 bookmark_birthofsects_erianthe_desc: "还是婴儿时，埃利安被丢在克诺索斯宫的台阶上听天由命，她的父母从来不知道她被一位住在摇摇欲坠的废墟上的老妇人收留了。末卡维的女预言家塞奥法妮娅抚养了埃利安，并教她如何聆听神谕。当塞奥法妮娅感到被召唤离开克里特岛时，她[Glossary('初拥','game_concept_Embrace_desc')]了埃利安，并让她担任下一任先知。\n埃利安总是表现得很有尊严，但她却患有严重的抑郁症。每次预言成功后，她都会陷入深深的忧郁中，有时会在黎明来临之际拒绝躲避。有的时候，她望着爱琴海的波光粼粼的水面，渴望跳进波浪里。如果不是因为她忠实的追随者，这一切可能早就发生了。\n\n#bold 你是奥林匹亚的意志在大地上的最后接受者，这是一个巨大的负担，你必须学会适应。#!"
 bookmark_birthofsects_petrodon: "佩德罗顿"
 bookmark_birthofsects_petrodon_desc: "佩特罗顿于凡生时为塞维利亚的阿隆索·克里斯托·佩德罗顿伯爵，1348年遭遇了那瘟疫；诺斯费拉图的克里斯托[Glossary('初拥','game_concept_Embrace_desc')]了他，救了他的命。\n佩特罗顿很快赢得了残酷镇压叛党的声誉。也许是秘盟最狂热的支持者之一，佩特罗顿甚至让他最忠诚的追随者都感到害怕，担心他们随时会被发现不符合他崇高的期望。\n\n#bold 秘盟是唯一的出路。叛党、魔宴、独立人士，甚至那些没有表现出对功业绝对忠诚的人……他们都将被你正义的怒火扫出门。#!"
 bookmark_birthofsects_seinia: "塞尼娅"
 bookmark_birthofsects_seinia_desc: "塞尼娅是诺夫哥罗德附近的一位$pod_cainite$小地主，对她的牧群来说是一位严格但充满爱心的女主人。因此，当她的庄园遭到袭击，他们全部被屠杀，她对自己居然怀念他们的事实大吃一惊。\n在遇到苦烬骑士团的时候，塞尼娅与他们达成共识，为她的人民报仇。她随后加入了他们的组织，并成为少数几个接受杯之$pod_Embrace$的女性之一。\n然而，裁判所摧毁了大部分修士会，塞尼娅发现自己越来越多地陷入了灰色的旧道德习惯中。失去了信仰和信念，她加入了新生的魔宴，并担任了他们迄今为止最成功的俄罗斯大主教。\n\n#bold 你那幼稚的救赎之梦现在已经过去了。这个世界上唯一的真理就是权力，你的灵魂在途中受诅，因为它曾经让你有过一点善意。#!"
 bookmark_birthofsects_nefertiti: "娜芙蒂蒂"
 bookmark_birthofsects_nefertiti_desc: "纳芙蒂蒂曾经是埃及的一位公主，而据她所说，在她落魄之前是女王。有人说她是法老埃赫那吞的同名妃子，尽管其他可敬的赛特之子如内弗鲁可能会质疑这种说法。\n在凡生时，她被雷伏诺安卡-霍特普的魅力所吸引，直到她知道那位雷伏诺无赖想要的只是她的身体和财富，这让她心碎了。在赛特通过$pod_Embrace$把她从死亡线上救回来后，纳芙蒂蒂完全接受了她在$pod_clan$中的新身份，并成为赛特目标的最大支持者之一。\n在经历了几次失败后，她最近开始了对新生的秘盟集团的渗透，从德意志最薄弱的地方开始。\n\n#bold 你的赛特之子同伴对你的主张和成就表示怀疑。现在是时候通过腐化秘盟本身来证明他们的错误了！#!"
 bookmark_birthofsects_karl: "卡尔·施瑞克"
 bookmark_birthofsects_karl_desc: "在生前，卡尔·施瑞克是维也纳一位令人生畏的猎魔人。他是一个有魄力的人，据说他曾让强大的埃里克·艾格曼陷入[Glossary('蛰眠','game_concept_torpor_desc')]。\n他在一场艰难的斗争中被击败后，被他的[Glossary('尊长','game_concept_Sire_desc')][Glossary('初拥','game_concept_Embrace_desc')]。在裁判所的烈火中幸存下来（对于曾经猎杀恶魔的人来说，这是痛苦的讽刺），他得出结论，秘盟是血族历史上唯一最伟大的事件，并投身于此。\n卡尔在睿魔尔和秘盟中的声誉夜渐提高，许多低估他的魔宴或叛党都被烧在了篝火上。\n\n#bold 你的工作与你在凡生时的工作没有什么不同。你猎杀怪物以保护他人。你自己是个怪物的事实以前从未阻止过你，现在也不会。#!"
 bookmark_birthofsects_mukhtar: "穆赫塔尔·贝伊"
 bookmark_birthofsects_mukhtar_desc: "穆赫塔尔·贝伊在凡生是位马穆鲁克，在亡生是强大的开罗亲王安东尼乌斯的保镖。这一切都在狼人的攻击下发生了变化，亲王被杀，留下了受人尊敬的穆赫塔尔，被誉为新的领袖。\n穆赫塔尔·贝伊统治着开罗，视作自由的城市，他没有效忠于不死族大党派，允许各$pod_clan$的血族和遗传在其边界内。\n尽管有各种末日论者要求消灭他，但他还是能够控制开罗的不同派别，而且他赢得了尊重，因为他的统治在政治风向的多次变化中都很稳定。\n\n#bold 你仍然为在你的亲王和朋友在需要的时候辜负了他而感到羞愧，你对你的劣族传承可能是罪魁祸首而感到愤慨。尽管如此，你还是不会辜负开罗，无论付出什么代价。#!"
 bookmark_birthofsects_phaedyme: "菲迪米亚"
 bookmark_birthofsects_phaedyme_desc: "菲迪米亚原本是亚历山大大帝军队中的一名士兵，为了逃避她的性别所期望的命运而伪装成一个男人。在印度，菲迪米亚被迦梨[Glossary('初拥','game_concept_Embrace_desc')]，他们世界旅行了很长时间，然后在高卢建立了自己的地位。她把自己献给了战争和荣誉。\n她对骑士精神的理想非常着迷，但在黑暗时代的大部分时间里，她还是被迫陷入了[Glossary('蛰眠','game_concept_torpor_desc')]。最近，她被唤醒了，看到她所热爱的理想已经消逝，她感到非常愤怒，正在召集她的追随者靠近印度，远离腐败的党派，希望能在这个新的家园保留一些骑士精神的遗产。\n\n#bold 由于欧洲忘记了你所热爱的荣誉准则，你必须到其他地方去寻找，并重新开始。现在仍然是雷伏诺骑士团复兴的时候！#!"
 bookmark_inquisitor_oberto_grimaldi: "奥贝托·格里马尔迪"
 bookmark_inquisitor_oberto_grimaldi_desc: "格里马尔迪家族是棘秘魑与人类社会和意大利城邦的主要联络人。这些掮客会花时间在社会和社交氛围中，保持正常的表面伪装。他们是[Glossary('遗传血仆','game_concept_revenant_desc')]家族中最“人性化”的，通常负责维护棘秘魑的庄园，并作为魔宴在凡人中的中间人，如金融和政治。他们也是最独立的遗传血仆家族，有些甚至暗中策划将自己从主人的桎梏中解放出来。其他[Glossary('遗传血仆','game_concept_revenant_desc')]家族认为格里马尔迪家族很软弱，并蔑视他们。格里马尔迪家族则以牙还牙，将其他家族视为无意识的奴隶和怪胎。近段时间，与有影响力的普热米斯尔形成的联盟提供了可观的重要援助。也许到了扩张的时候。\n\n#bold 格里马尔迪对热那亚的罗伯托·德阿戈斯蒂诺的效忠充其量只是名义上的效忠。格里马尔迪家族在该市的影响力几乎与那位贤士一样大。棘秘魑一定会支持格里马尔迪的控制权。摩纳哥是一个适合度假的好地方。#!"
 bookmark_inquisitor_adrian_szantovich: "阿德里安·桑托维奇"
 bookmark_inquisitor_adrian_szantovich_desc: "桑托维奇是一个富裕的堕落的半吊子家族，他们感到自己像是在棘秘魑中崛起的明星。一个世纪前，他们中的一人，拉杜，已经上升为比斯特里察的该隐之子军督。\n\n在世的家族族长阿德里安比拉杜年轻近一个世纪，他目睹了这位血族长者将家族带入他那与梵卓组建的灰烬议会相关的计划中。\n\n#bold 事实上，阿德里安的亲属已经变得颓废和放荡——但这并没使他们的危险性降低。#!"
 bookmark_inquisitor_nepos_obertus: "尼波斯·奥伯图斯"
 bookmark_inquisitor_nepos_obertus_desc: "奥伯图斯是家传血仆中最古老的家族。很久以前，他们曾为古老的魔龙服务——幻梦三巨头之灵。随着1204年君士坦丁堡被洗劫一空，他们心爱的“被遗忘的图书馆”被烧毁。从那时起，这个学者家族就一直试图在东欧各地的隐秘图书馆和修道院中重建它。他们仍然为魔龙的子嗣服务——即西默盎和迈卡·维科斯。他们远离了在拜占庭的祖居地，发现自己现在正处于黑十字梵卓和军督领之间的边境地区。\n\n#bold 这对学者来说是一个困难的政治处地，但如果有足够的研究，他们可能会找到一种方法来忍受，甚至茁壮成长。#!"
 bookmark_inquisitor_sambor_bratovitch: "桑博尔·布拉托维奇"
 bookmark_inquisitor_sambor_bratovitch_desc: "曾经的猎犬饲养员和棘秘魑的对外领主，布拉托维奇以野蛮、易怒和兽性的暴力而闻名。他们是战士和追踪者，很少参与更高级的社交活动。他们也是领主的犬舍主，为他们的主人饲养狗、狼和其他野生动物，将它们塑造成可怕的生物，以便针对敌人。\n\n#bold 勇敢的桑博尔通过他的蛮力和他杀死了数位狼人的恶名来领导他的家族。据说他有不寻常的食欲。#!"
 bookmark_inquisitor_vlastimir_vlaszy: "弗拉斯蒂米尔·弗拉齐"
 bookmark_inquisitor_vlastimir_vlaszy_desc: "这些弗拉齐的骑手既有马扎尔人的血统，也有斯拉夫人的血统。在古代，棘秘魑氏族拯救了弗拉齐。从那晚起，骑士们就通过血誓对诸龙宣誓忠诚。\n\n弗拉斯蒂米尔和许多他的家族的猛将一样。他在战争中的冷酷无情使他受到了伊万·布兰科维努的关注。弗拉斯蒂米尔现在作为他忠实的心腹服务。\n\n#bold 如果弗拉斯蒂米尔对布兰科瓦努的忠诚有任何质疑，那也被他的血誓的力量完全消除了。#!"
 bookmark_inquisitor_premysl_otakar: "奥托卡·普热米斯尔"
 bookmark_inquisitor_premysl_otakar_desc: "普热米斯尔家族是欧洲最重要的皇室宗族之一，统领着从波罗的海到匈牙利的大波西米亚王国。他们成功的奥秘在于他们与棘秘魑氏族的血缘关系。\n\n瓦茨拉夫一世最近接管了他们的凡人事务，而他的父亲——奥托卡——则专注在家族的真正使命，即侍奉沃雷的女神莎格拉。奥托卡能继续满足于做一只纯粹的走狗吗？如果家传血仆能以某种方式统一起来……奥托卡所建立的联盟网无疑为我们提供了许多可能性。\n\n#bold 令人厌恶的诺斯费拉图约瑟夫·兹维和他的普罗米修斯派盟友把家族赶出了布拉格的祖居地。现在是夺回先祖席位的时候了。#!"
 bookmark_inquisitor_vilhelm_danislav: "威廉·达尼斯拉夫"
 bookmark_inquisitor_vilhelm_danislav_desc: "特兰西瓦尼亚北部的达尼斯拉夫家族原本是与影爵相关的贵族宗族，但陷入了残酷的棘秘魑弗洛雷斯库的支配，他将他们在人生的头十年里关在地牢里，使他们被调教好为他服务。弗洛雷斯库伯爵急于展示他的胜利，将他的[Glossary('遗传血仆','game_concept_revenant_desc')]作为大使和外交官派往其他棘秘魑的领地。他获得了巨大的声望，因他的调教好的家庭提供的服务而获得了声誉。\n\n虽然看起来是忠诚的狗，但少数达尼斯拉夫还是设法保留了一丝他们的传统。白天，当他们的主人沉睡时，他们会举行仪式，与灵类接触，把他们从永恒的束缚中释放出来，再次给予他们狼的祝福。\n\n#bold 远处传来的是雷鸣和狼嚎么？#!"
 bookmark_inquisitor_gedivilas_khazi: "杰迪维拉斯·卡茲"
 bookmark_inquisitor_gedivilas_khazi_desc: "哈茲是“白神”比洛博格的狂热仆从，即使以其他家传血仆家族的标准来看也是相当奇异。躲在腐烂的平斯克沼泽，很少有其他人类有机会看到这些密教徒的白化皮肤。密教徒们对外部世界毫不关心：他们不结成联盟，不建立外部关系。他们所拥有的一切和他们的一切都源自比洛博格。\n\n哈茲的族长杰迪维拉斯也是比洛博格的狂热大祭司。他开始越来越多地出现令人不安的幻觉，不仅对他的家人，而且对他们的神都构成了严重的威胁！杰迪维拉斯怀疑到处都是敌人：来自基督教传教士、其他棘秘魑，甚至他怀疑自己的家庭成员在信仰上有所动摇！\n\n#bold 必须不惜一切捍卫来比洛博格！#!"
 bookmark_inquisitor_ladislau_rustovitchi: "拉迪斯劳·罗斯托维奇"
 bookmark_inquisitor_ladislau_rustovitchi_desc: "最受军督之督宠爱的家族，弗拉基米尔·罗斯托维奇小心翼翼地培育和培养自己的凡人纽带，好成为他忠实的战士和仆人。这个家族以具有好战的天性而闻名，这种倾向无疑是弗拉基米尔所鼓励的。虽然这使他们很强大，但为军督领进行的持续战争已经严重影响了他们的人数。\n\n#bold 他们的命运与弗拉基米尔不可避免地联系在一起。或真是么？#!"
 bookmark_inquisitor_alexandru_basarab: "亚历山德鲁·巴萨拉布"
 bookmark_inquisitor_alexandru_basarab_desc: "因善于战斗，棘秘魑会给予这些家传血仆战将一些针对罗马尼亚当地凡人贵族的权力和交配自由。在未来的夜晚，这个家族将继续统治凡人的瓦拉几亚王国。\n\n目前，该家族的族长亚历山德鲁发誓效忠于比斯特里的拉杜；但有传言说他可能有另一位靠山。他肯定与雄心勃勃的棘秘魑稚子德拉戈米尔有家庭关系。\n\n随着时间的推移，该家族将分裂成两个分支——达讷蒂和德拉库勒蒂。\n\n#bold 德拉库勒蒂……这个名字听起来很不吉利。#!"
 bookmark_inquisitor_rodislav_narov: "罗季斯拉夫·纳罗夫"
 bookmark_inquisitor_rodislav_narov_desc: "作为一个保持原始教传统的斯拉夫贵族家庭，拉兹科利纳利用这些苍白的潜伏者作为她在整个波兰的代理人。通过与桑托维奇和奥伯图斯的通婚，这个家族是否会继续生存下去，或者干脆被吸收到更大更强的扎德鲁加家族中，将是一个问题。\n\n虽然罗季斯拉夫被训练成一名医生，他的技能通过易变术中得到了提高——他也不是抽屉里最锋利的手术刀。\n\n#bold 他曾经有过的雄心壮志已经被他的血缚和拉兹科利纳亲王的支配所消磨殆尽。#!"
 bookmark_inquisitor_bezprym_slatikov: "贝兹普雷姆·斯拉蒂科夫"
 bookmark_inquisitor_bezprym_slatikov_desc: "作为日渐式微的纳罗夫家族的分家，该家族最近从克拉科夫的亲王那里获得了一些青睐。不到十几年前，该家族的一个年轻的善于外交的后裔——扎拉——被拉兹科利纳所初拥了。\n\n#bold 又或扎拉会记住她的根源并保护她的家族，又或斯拉蒂科夫会跟随纳罗夫一起衰落。#!"
 bookmark_inquisitor_matteo_enrathi: "马泰奥"
 bookmark_inquisitor_matteo_enrathi_desc: "恩拉提家族的祖先可以追溯到伊特鲁里亚的农民，远在罗马成为一个重大的政治势力之前。大约在罗马共和国发展成为帝国的时候，恩拉提家族成为了出色的奴隶贩子。在奴隶制合法的时代和地方，恩拉提建立了联系网络，扩大了经营范围，当黑手找到他们时，他们很高兴地加入进来。\n\n这个家族的族长马泰奥和他的前辈们一样贪婪、残忍和放荡。\n\n与波河平原的巫师们的联盟目前是有用的，但如果有必要，马特奥很愿意背叛拉法斯蒂奥家族。\n\n#bold 能拿多少拿多少，别给任何回报！#!"
 bookmark_patronwar_aethelflaed: "埃塞尔芙莱德"
 bookmark_patronwar_aethelflaed_desc: "他被美露莘·德安茹再造，或多或少地成为了一件活生生的艺术品和玩物，他仅仅通过被她宠爱以及吸引他周围的人，而不是通过他严重缺乏的任何实际能力，积累了一点权力。他的名字和支系——多耶——都是她赐予他的，既是一种娱乐，也是为了迎合某种主题。\n\n#bold 证明你比假定的更强，又或不。#!"
 bookmark_patronwar_memnon: "门农"
 bookmark_patronwar_memnon_desc: "门农是曾与阿喀琉斯战斗过的埃塞俄比亚半神国王。虽然门农在战斗中阵亡了，但宙斯对他的技艺和勇敢印象深刻，授予了他永生。回到祖国后，他在对失败的绝望中徘徊了一段时间，直到陷入蛰眠。当他在12世纪醒来时，他回到希腊面对并击败了阿喀琉斯。阿喀琉斯早已死去。他被自我怀疑的感觉所困扰，在返回埃塞俄比亚之前，他试图填补自己的弱点——他曾与希腊人发生争执，以考验自己的勇气。又或许这个传说是虚构的，是一名冈格罗战士捏造的，他想通过虚张声势来激发追随者的忠诚和敌人的恐惧。\n\n#bold 世界将见证门农的勇气与埃塞俄比亚的复兴！#!"
 bookmark_patronwar_phillip: "菲利普"
 bookmark_patronwar_phillip_desc: "菲利普是一位崭露头角的意大利建筑师，他受雇于亚历山大的马塞卢斯，负责修复亚历山大的城市及其图书馆。在考察这座城市时，菲利普评价说，这座城市已经沦为了废墟和贫民窟，它从昔日的辉煌一落千丈，以及需要花费数十年的时间才能恢复图书馆和这座城市的辉煌。马塞卢斯提议要初拥他，以让他能够在这座城市中工作而不衰老，菲利普接受了，他认为亡生将会是一场不时点缀着建筑灵感的不散筵席。在被初拥后，他开始鄙夷千年圣战和永远的受天主诅咒。他越过地中海逃了回来。他通过为凡人建造项目来分散心兽的注意力，但凡人在他眼中越来越像玩偶屋中的玩偶。\n\n#bold 这种生活何其悲惨，唯一的慰藉就是不断建造！#!"
 bookmark_patronwar_senen: "塞嫩"
 bookmark_patronwar_senen_desc: "白色守望者是贤士中的一位古老而神秘的人物。他的后代，福斯沃恩，是勒森魃的分支之一，通常被称为“白影”，作为血之沉默——避世戒律——的看守者。他们把责任看得比什么都重要，并作为观察者来保护他们家族和宗族的未来。\n\n#bold 我们有责任维持避世，无论付出什么代价！#!"
 bookmark_patronwar_golub: "戈卢布"
 bookmark_patronwar_golub_desc: "戈卢布是一位波斯尼亚小贵族、波格米勒派的虔信徒和才华横溢的医生，他吸引到了斯雷代茨的尼基塔的注意并被其所初拥。但是，这并没有让尼基塔获得一颗愿意将世俗影响、宗教信仰和学习结合起来的棋子。\n\n戈卢布对该隐异端及其教会的腐败感到非常震惊。他觉得自己有责任回击那些以信仰为人质的怪物。为此，他打击了遇到的几名异端的长者和仆人。在不知不觉中，尽管他视自己为救世主，但也开始将宗教组织视为敌人。他看到了每一件事的背后都有异端和他的尊长的影子。\n\n#bold 摧毁该隐异端，还人们以自由！#!"
 bookmark_patronwar_niobe: "尼俄伯"
 bookmark_patronwar_niobe_desc: "尼俄伯大约于公元前14世纪出生在维奥蒂亚的迈锡尼城邦底比斯。她和她的尊长“音乐家”安菲翁会面的细节消失在了时间的长河中，公元10年，她在图卢兹地区建立了一个敌对者之道的教派，以便在南方传播原罪心路的信仰。清洁派诞生时，尼俄伯影响并组织了他们，目的是动摇罗马教会在欧西坦尼亚的统治。在阿比尔派十字军期间，她先是加入了黑之埃丝克拉蒙德的宫廷，帮助她击退了北方的入侵，然后，在反对派的奥克亲王们的支持下，为了自己利益，放逐了埃丝克拉蒙德。尼俄伯加强了她在欧西坦尼亚的影响力，使这个地区皈依了原罪心路。\n\n#bold 实现为受压迫的追随者们建立庇护之地的梦想。#!"
 bookmark_patronwar_hagbard: "海波德"
 bookmark_patronwar_hagbard_desc: "海波德出生在基辅罗斯的一个传统家庭中，从小就被了灌输对旧神的崇敬。他不是傻子，当他的领主宣布这个国家皈依基督教时，他让变革之风将他带离那里。在经历了无数在当时的凡人中闻名的冒险之后，这位经验丰富的旅行者似乎找到了一个家，作为瓦兰吉卫队的一员服务于拜占庭皇帝。在君士坦丁堡，海波德顽固的原始信仰被人们视为粗鄙野蛮，但不至于像在其他地方一样遭受公开敌视，然而他对旧神的信仰却引起了一种完全不同的关注。他遇到了一个人，这个人告诉他，他家乡的神在这里没有力量……同时，还把他介绍给了这样做的人。他的心智被初拥击碎了，只能紧紧抓住那些提醒他他是谁的碎片，成为了他第二故乡的古代诸神的坚定捍卫者。\n\n#bold 遵从旧神！谨听神谕！#!"
 bookmark_patronwar_conradoadelchi: "康拉多·阿德尔基"
 bookmark_patronwar_conradoadelchi_desc: "康拉多·阿德尔基在其六百年的亡生中获得并捐赠了大量财富，这些财富大多是通过合法手段获得的，包括艺术品交易、香水制造等，但偶尔也会通过盗墓、走私和其他犯罪活动获得。\n\n有一次，在康拉多亡生的早期，他把“该隐的礼物”免费卖给了那些真正绝望的人，也卖给了那些愿意付钱的人。在潜藏被破坏之前，他的错误被卡利达“纠正”了。妥芮朵奢华的晚会需要资助，而在卡利达看来，康拉多获取财富的天赋上升到了艺术的水平，至少足以弥补他年少轻狂的行为。\n\n#Bold 金子，金子能解决一切问题。#!"
 bookmark_patronwar_viktor: "维克多"
 bookmark_patronwar_viktor_desc: "一位令人敬畏的俄罗斯将军——作为一个统治者，他以铁腕统治。在他的凡生中，他从一名正直的贵族和将军升为一名拥有广阔领土和巨额财富的领主。作为一个坚信传统的骄傲的人，他培养了一群精英家臣；但即使是他们也无法解决他最大的恐惧——他的衰老和即将到来的死亡。当维克多的体力开始衰弱时，一个影子朝他走来。作为一只黑夜生物，他的权威和对权力的渴望只会越来越大，因为一个充满机遇的新世界已经被揭开。\n\n然而，维克多很快就意识到，现在他必须改变自己的策略，不再是在明处统治，而是要在暗处操纵。他初拥了亲密的追随者们，开始了新的生活，并在一个新的地区获得了领地。\n\n#bold 维克多以身作则，一如既往。#!"
 bookmark_patronwar_aisling: "艾斯林"
 bookmark_patronwar_aisling_desc: "该隐之子的世界与妖精的世界并没有什么不同，艾斯林告诉自己。统治它应该不会太困难。"
 bm_1230_werewolves: "黑暗时代：狼人"
 bm_1230_werewolves_desc: "狼族（狼人）为保卫地球（他们称为盖亚）而生，抵御威胁要将其撕裂的无数势力。这是一场与几乎无法克服的艰难斗争，特别是考虑到许多部族之间的内斗。他们认为自己是究极掠食者，沉浸在几千年来的关于勇敢和声誉的古老传统中。\n黑暗时代对狼国来说是一段多事之秋。城市的猖獗发展（以及它们的吸血鬼傀儡师）将他们推到了崖边。更糟糕的是，最近一种被称为剥皮瘟疫的神秘疾病使他们的人数达到了灾难性的谷底，迫使幸存者退缩到森林中，为生存而战，与他们的敌人斗智斗勇。\n\n#bold 盖亚需要你，任何艰难困苦都不能分散你对神圣职责的注意力！#!"
 bookmark_werewolves_helen: "热那亚的海伦"
 bookmark_werewolves_helen_desc: "黑怒部族是狼族的女族，只接受女性作为成员。她们以荣誉、智慧、骄傲和凶猛的战斗技巧而闻名。\n热那亚的海伦是一位受人尊敬的黑怒，她最近在欧洲最著名的圣地——日耀中踏入顶流。在强大的吸血鬼国度的包围下，她的合法性仍有争议，海伦将需要她所有的智慧和勇武来确保这个重要的立足点安全地留在黑怒的手中。\n\n#bold 你必须向仍然怀疑的日耀成员证明你的能力。还有什么比拿一堆吸血鬼的头骨做碗更好的办法呢？附近有很多目标！#!"
 bookmark_werewolves_lucille: "露西尔"
 bookmark_werewolves_lucille_desc: "啮骨者是狼族的清道夫和求生者，在其他部族看来，他们不过是在人类的废物中筛选出来的杂种。啮骨者视自己为弱者，等待着战胜过于自信的敌人。\n露西尔是一个年轻而粗鲁的啮骨者，她以自己的名义对吸血鬼进行了许多致命的恶作剧。她最近在星域圣地中取得了强大的权位，主要是因为该圣地几乎被裁判所所摧毁。\n\n#bold 作为非常罕见的啮骨者圣地领袖，你处于一个独特的地位，能终于获得其他部族的认可。但这并不容易，因为星域被吸血鬼和裁判官死命地包围着。#!"
 bookmark_werewolves_timno: "蒂莫"
 bookmark_werewolves_timno_desc: "盖亚之子是狼族的和平卫士，他们努力争取各部族之间的理解，并希望最终将所有的部族组成一个统一战线来对抗他们的敌人。\n蒂莫和他最好的朋友伊利亚是最受尊敬的盖亚之子中的其二。他们带着荣誉和责任领导着白海圣地，也以对敌人的不放过而闻名，使他们取得了其他部族的勉强尊重。\n\n#bold 芬兰仍然是一片未被开发的土地，但是，即使在那里，吸血鬼也在侵占。如果你能够永久地保护你的家园，其他部族或许学会尊重盖亚之子的果断行动，使你离统一更近一步。#!"
 bookmark_werewolves_bladdud: "布拉达"
 bookmark_werewolves_bladdud_desc: "芬尼安以凯尔特传统为基础，在狼族中以其对生活乐趣的热情、战斗的技艺和凶猛而闻名，并且还是狼族的音乐、故事和传说的守护者。\n强大而广受尊敬的布拉达是他们的王，也许是他们在灾难性的剥皮瘟疫之后的最后希望，该瘟疫使他们的人数狂减。随着他们的力量被摧毁，吸血鬼在群岛上比以往任何时候都更强大，布拉达将需要他所有的狡猾和勇武来拯救他的部族。\n\n#bold 摆在你面前的使命是庞大的，但你已经准备好了。吟游诗人会唱出你的胜利或你顽强的最后抵抗的故事。无论哪种方式，你都会让它成为一个好故事。#!"
 bookmark_werewolves_yvonne: "伊冯娜"
 bookmark_werewolves_yvonne_desc: "芬里尔仔兽是体现北欧理想的严酷战士。他们重视战斗力，但也非常重视个人荣誉和聪明才智。\n最近，该部族取得了对被称为沃坦（或奥丁）的吸血鬼的胜利，但付出了巨大的代价。在这场传奇性的战斗中，他们的大部分领导人和战士都被杀了，芬里尔仔兽现在由年轻的伊冯娜领导，她必须在吸血怪物从这次打击中恢复过来之前迅速稳固斯堪的纳维亚半岛。\n\n#bold 尽管取得了对沃坦的胜利，但你的处境比你看起来更弱。你必须巩固你的成果，然后再一头冲去屠杀奥丁剩下的追随者。#!"
 bookmark_werewolves_isabeau: "伊萨博·杜·洛朗"
 bookmark_werewolves_isabeau_desc: "沉浸在理性、人类宗教和城市的起伏中，人类监护者以进步的信条为生，也为其而死。\n他们最大的势力中心在亚柯，在那里，繁华的十字军城市提供了丰富的，人类监护者们所渴望的经验。在那里，他们由年轻而雄心勃勃的伊萨博·杜·洛朗领导，她在一场残酷的、虽然最终没有流血的政变后夺取了对圣地的控制权。她现在不得不将目光投向黎凡特的其他大城市，每一座城市都是值得争取的战利品。\n\n#bold 这个宗教、进步和思潮的中心对于思维敏捷的人类监护者来说是一个天堂。虽然亚柯还不够，但如果你想扩大你对的黎凡特统治，你就必须先撕毁一些吸血鬼的。#!"
 bookmark_werewolves_stains: "脏玻璃"
 bookmark_werewolves_stains_desc: "赤爪认为，治愈盖亚的唯一方法是杀死地球上所有的人类，然后让她来平衡一切。他们对人类嗤之以鼻，据说一见到人类就会攻击他们，甚至不惜吞食他们的血肉。\n剥皮瘟疫对赤爪和它们的狼亲来说尤其严重。在接近灭绝的情况下，他们已经撤退到草原，远离人类的影响。在那里，他们在脏玻璃的领导下与任何吸血鬼或人类的侵扰作斗争，脏玻璃是一只狡猾的赤爪，特别喜欢利用人类的宗教来对付他们。\n\n#bold 若要赤爪生存下去的话，你在这里的位置必须得到稳固。寻求附近部族的援助，并迅速打击任何威胁。#!"
 bookmark_werewolves_elizaveta: "布洛维采的伊丽莎白"
 bookmark_werewolves_elizaveta_desc: "影爵是狼族的政治家和操纵者，他们通过严格的阶级制度和阴暗手段做事，尽可能多地夺取权力。他们的故乡在东欧，他们与吸血鬼的棘秘魑氏族的斗争既是传奇性的又是永无止境的。\n剥皮瘟疫给影爵带来了沉重的打击，迫使他们放弃了数个据点，退到草原附近。他们的权力结构也受到了伤害，只剩下未曾受训，但却很有才华的伊丽莎白作为他们的领袖。幸运的是，棘秘魑一直忙于对付睿魔尔，没有趁机扑上去，让影爵有机会重新组织和恢复。\n\n#bold 影爵很有耐心。争取时间，重新获得力量，然后利用棘秘魑/睿魔尔的冲突来同时消灭他们。#!"
 bookmark_werewolves_wepauwet: "乌普奥特"
 bookmark_werewolves_wepauwet_desc: "寂静漫游者最初来自埃及和中东。他们被吸血鬼赛特赶出了他们的故土，从此一直在寻找新的家园。\n乌普奥特过去、现在和将来都是他们的领袖，因为他被荷鲁斯本人授予了永生。这位耐心的学者一直在带领他的兄弟们前往摩洛哥，追随盟友灵类留下的预兆。在那里，他们发现了强大的卜塔之轮圣地，并从附近的吸血鬼手中夺取了它的控制权。数个世纪以来，寂静漫游者第一次找到了他们的新家。\n\n#bold 你的部族期待着你，卜塔之轮必须为未来的战斗而得到保障和加强。流浪的时间可能要结束了。#!"
 bookmark_werewolves_yuri: "尤里·特瓦里维奇"
 bookmark_werewolves_yuri_desc: "银牙是狼国的“阿尔法部族”，是自古以来的统治者和战争领袖。这些高贵的狼族以其身体的美丽、勇气和荣誉而闻名。\n尤里和他的妹妹索菲亚在俄罗斯领导着部族的新月支系，并被视为银牙的典范。众所周知，他们亲自带头对抗可怕的芭芭雅嘎的怪物爪牙。他们的无数次胜利和对其他部族的外交姿态，使银牙在俄罗斯处有舒适的势力地位。\n\n#bold 在这样训练有素的统治者的带领下，银牙的未来看起来很光明，但没有自满的空间。鬼婆的爪牙仍然强大，其他部族期待你带领他们度过这个黑暗时代。#!"
 bookmark_werewolves_chakal: "尚卡尔"
 bookmark_werewolves_chakal_desc: "作为最小的部族，许多星占成员实际上是由其他部族转化而来。他们关注所有形式的平衡，寻求内部和外部的完美和谐。然而，他们经常在哲学思考中迷失自我，大多数狼族认为他们花了太多的时间沉思他们的肚脐，而没有足够的时间采取行动。\n尚卡尔领导着雪豹圣地，这是她部族中最著名的学识中心。在喜马拉雅山脉深处，欢迎所有人加入并学习，一些惊讶的外人已经注意到，其甚至与附近的吸血鬼建立了奇怪的友谊。\n\n#bold 和平需要持续的警惕。确保不要陷入自满，并在任何有威胁的邻居覆灭你的宁静和冥想绿洲之前遏制他们。#!"
