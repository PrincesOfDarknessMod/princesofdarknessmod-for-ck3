 bookmark_warofprinces_thrax: "色雷克斯"
 bookmark_warofprinces_thrax_desc: "在第一次布匿战争期间，色雷克斯是一名居住在罗马的布鲁赫。她和她的同族遭受了各种侮辱，而她选择了离开。在旅途中，她接触到了诺斯替主义思想，并发现他们的神学为她疲惫的灵魂带来了慰藉。\n现在，她回到了罗马，要将自己的信念与梵卓的力量以及卡米拉本人这个迦太基的灾祸相对抗。永恒执政似乎对她更多的是感到有趣，而不是担心，但这种情况可能会改变。\n\n#bold 你将让卡米拉尊敬你或者畏惧你。一旦罗马属于你，你将带领布鲁赫$pod_clan$迈向新的、纯净的开始。#!"
 bookmark_warofprinces_caelestius: "色勒斯丟"
 bookmark_warofprinces_caelestius_desc: "没有人会形容色勒斯丟是一个安静或胆小的人。他年轻时是一个好争论的修道士，很快就受到异端伯拉纠的影响，并成为他的门徒。\n他们的异端在迦太基扎根，但很快就受到当地教会当局的指责，而色勒斯丟拒绝了悔改。就在这次审判期间，他引起了当地布鲁赫的注意，并被$pod_Embrace$。\n色勒斯丟很快适应了他新的状态，并将他的伯拉纠倾向与该隐之子的挪得学说融合在一起。然后，他大胆宣布将前往见教宗，展示他的理论并获得教宗的祝福。这个疯狂的计划将导致对潜藏的最终破坏，因此被其他该隐之子一次又一次地挫败，但这个被蒙蔽的异端却从未被抓到。\n\n#bold 无视那些想要阻碍你的琐碎小人，只有教宗能为你的天才辩护！#!"
 bookmark_warofprinces_constancia: "康斯坦西娅"
 bookmark_warofprinces_constancia_desc: "康斯坦西娅是骸骨女祭司，也是埃尔吉耶斯神庙的主持人，这是卡帕多奇亚$pod_clan$的精神中心，也是[Glossary('上古耆宿','game_concept_antediluvian_desc')]卡帕多修斯本人的居所。\n作为一名经验丰富的旅行者，康斯坦西娅亲身经历了许多困扰她氏族的内部威胁，从野心勃勃的乔凡尼到狡诈的拉撒路。由于雅弗受到卡帕多修斯的束缚，她决定自己拯救她的不死族家族，使他们免受她在预言中所知的可怕命运的折磨。\n\n#bold 只有你看到了等待着卡帕多西亚的可怕未来，也只有你能够改变它。#!"
 bookmark_warofprinces_lucretia: "卢克丽霞·乔凡尼"
 bookmark_warofprinces_lucretia_desc: "卢克丽霞出生时就是一个麻烦的孩子，因为她听到的声音而在年轻时被送进了疯人院。尽管如此，她展示出对神秘学的天赋，使她成为新近成为吸血鬼的乔凡尼家族追逐的目标。克劳狄乌斯几乎成功地使她被他$pod_Embrace$，但安布罗吉奥赢得了争论，并被授予卢克丽霞作为他的子嗣。\n最终获得自由，年轻的吸血鬼迅速证明自己是安布罗吉奥在神秘学追求中的巨大资产，但她的热情和动力隐藏着一个受折磨的心灵，有时渴望死亡。\n\n#bold 安布罗吉奥的追求也是你的，也许是暂时抵挡这些声音的唯一方法。#!"
 bookmark_warofprinces_guilelmo: "吉勒摩·阿里普兰多"
 bookmark_warofprinces_guilelmo_desc: "纳尔塞斯，威尼斯亲王和挪得大主教，因吉勒摩明显的外交和谈判技巧而初拥了他。因此，他成为威尼斯亲王的“公众形象”。\n在第四次十字军东征后，他开始怀疑纳尔塞斯对该隐教会的奉献不是真诚的。他与斯雷代茨的尼基塔结盟，召开了一场血之法庭，并获得了[Glossary('吸榨','game_concept_diablerie_desc')]其[Glossary('尊长','game_concept_Sire_desc')]的权利。从那时起，他顺利地接管了纳尔塞斯留下的权力，而位于瓦解中的拜占庭帝国的威尼斯，这片新领土的将成为他的首要关注点。不幸的是，这使他对更近距离的威胁视而不见，因为兴起的裁判所和乔凡尼家族都贪婪地注视着削弱的吸血鬼威尼斯的权力结构。\n\n#bold 你可能是该隐教会最后一位真信徒。在即将到来的艰难时刻，你的信仰是否足够坚定？#!"
 bookmark_warofprinces_fatimaallama: "法蒂玛·拉玛"
 bookmark_warofprinces_fatimaallama_desc: "法蒂玛在突尼斯遇见了她未来的[Glossary('尊长','game_concept_Sire_desc')]，他在阴影中观察着她成长为女人，并爱上了她。当谢里夫向南移动时，他带着法蒂玛一同前往。从那时起，这位有天赋的子嗣对她的新身份和吸血鬼政治有了很多了解。法蒂玛引起了勒森魃$pod_clan$的领导层的注意，最近她被分配了她的第一个任务：为她的$pod_clan$夺取摩加迪沙。这是一项艰巨的任务，因为许多她的氏族成员在争夺这座珍珠之城时都失败了。\n\n#bold 这是你的第一个真正的任务，而且是一个很有声望的任务。展示出你所展现的潜力确实是真实的。#!"
 bookmark_warofprinces_darshuf: "达舒夫"
 bookmark_warofprinces_darshuf_desc: "达舒夫的历史充满背叛。他背叛了他的[Glossary('尊长','game_concept_Sire_desc')]，在伊斯兰崛起时夺取了大马士革，并沉溺于崇魔者安纳齐尔的阴险低语。达舒夫知道他的灵魂早已失去，而大马士革也随之失去，因为他既没有力量也没有意愿再对抗巴力。\n在陷入湮灭之前，达舒夫还有最后一件事要做，那就是拯救他心爱的子嗣玛娜尔。迄今为止，他一直保护她免受大马士革的恐怖之苦，他决心确保这最后一丝光明不会熄灭。\n\n#bold 你、你的灵魂和你的城市都已经失了。但玛娜尔没有。无论发生什么，你必须从你已经沉沦其中的恐怖中拯救她。#!"
 bookmark_warofprinces_shamit: "撒米亚·伊本·亚西尔"
 bookmark_warofprinces_shamit_desc: "在他的[Glossary('尊长','game_concept_Sire_desc')]阿卜杜勒·哈克消失后，撒米亚最近获得了强大的力量，经历了几个世纪的血缚后，他尝到了甜蜜的自由。这种自由的滋味令他十分满意，以至于他没有放弃自己占据亲王领的意图，即使他的[Glossary('尊长','game_concept_Sire_desc')]回归。\n作为一位非凡的能干的行政官员，他正在利用城市的资源和繁忙的港口为自己创造一个地位。\n每一他[Glossary('尊长','game_concept_Sire_desc')]不在的夜晚，撒米亚都在巩固自己的地位，并以大胆的方式证明他新获得的独立。\n\n#bold 亚丁是属于你的。也门很快将属于你。你再也不会受到限制了。#!"
 bookmark_warofprinces_nikita: "斯雷代茨的尼基塔"
 bookmark_warofprinces_nikita_desc: "在外看来，斯雷代茨的尼基塔是该隐教会狂热的大主教。然而，事实上，尼基塔早已经死了。\n被魔龙所杀并冒名顶替，这位强大的玛土撒拉因教会在君士坦丁堡的沦陷中的参与而渴望对它复仇。“尼基塔”现在正在从内部破坏该组织。完成任务后，魔龙可能会摒弃这个伪装，再次踏上喀尔巴阡。或许连他自己都不知道此时他的下一个目标将是什么。\n\n#bold 万物皆变，万物皆朽。是时候让可憎的该隐教会感受这个真理了。#!"
 bookmark_warofprinces_kartarirya: "迦𫄨里璃"
 bookmark_warofprinces_kartarirya_desc: "在凡生中，迦𫄨里璃是一位以嗜血的战士而闻名的人，以其残忍和攻击性而著称，最终被吸血鬼$pod_Embrace$。\n他的[Glossary('尊长','game_concept_Sire_desc')]允许战士迦𫄨里璃为所欲为。正如一位将整个印度视为个人狩猎场的多臂长生者所会做的那样，迦𫄨里璃在斯里兰卡的藏身处发动持续不断的战争，以可怕的肉塑血仆作为他的战争机器，恐怖则是他的主要心理武器。\n\n#bold 战争和血腥征服是你唯一的目标，当你完成时，印度将被血淹没。#!"
 bookmark_warofprinces_vencel: "文策尔·里卡德"
 bookmark_warofprinces_vencel_desc: "文策尔是基督教骑士教育的产物，在盖萨国王邀请一支巴伐利亚骑士队成为他的贴身卫士时来到了布达佩斯。作为对他出色服务的奖励，他被布尔斯库$pod_Embrace$。文策尔最关心的是保住自己的地位，最大化他的商业利益，并在这座可能很快变成战场的城市中保持和平。\n尽管担心布尔斯库陷入堕落，然后进入[Glossary('蛰眠','game_concept_torpor_desc')]，文策尔作为不死族仍然是一个有荣誉感的人，并尊重他的[Glossary('尊长','game_concept_Sire_desc')]，因为他曾经是一个伟大的人。现在，他正试图在保护他免受众多敌人的袭击同时，公正地统治自己的城市之间保持平衡。\n\n#bold 你有两个职责，布达佩斯和布尔斯库，你打算兼顾两者。#!"
 bookmark_warofprinces_fabrizio: "法布里齐奥·乌尔菲拉"
 bookmark_warofprinces_fabrizio_desc: "法布里奇奥.乌尔菲拉自古罗马基督教诞生的第一夜起就存在。生前，他是尼科美底亚的主教尤西比乌斯的门徒，和他的老师一样，乌尔菲拉曾是阿里乌异端的捍卫者。在死后，他成为教廷派中最有影响力的成员之一，这个派系认为权力应掌握在教廷手中。\n尽管教廷几个世纪以来一直是$pod_cainite$阴谋的战场，但法布里齐奥却幸存了下来，并且一直处于上风。他的长期目标是尽可能扩大自己在教会和意大利的影响力，而卡米拉的觉醒突然让这个前景变得困难起来。\n\n#bold 在罗马重新确立你的控制，并利用基督教的力量为自己谋取利益，“枢机主教”乌尔菲拉！#!"
 bookmark_warofprinces_enkara: "恩卡拉"
 bookmark_warofprinces_enkara_desc: "恩卡拉出生在底格里斯河畔的塞琉西亚，作为一个奴隶女孩。她被伊希姆·三重蒙福选中，他是一位著名的阿刹迈战士种姓成员。他给她取名为“恩卡拉”，在早已被遗忘的苏美尔语中意为“武器”，并花费了八个世纪的时间将她锻造成一名战士。\n第二次巴力之战结束时，她已经成为一位备受尊敬的长者。在她的尊长在哥拉汛率领军事行动时消失后，她亲自带领一支由十五名阿刹迈战士和三十名血仆组成的小队前往堡垒。\n她成功地阻止了恶魔的苏醒，但不得不在此之前目睹她心爱的伊希姆被吞噬。从那以后，她一直在拼命寻找拯救他的方法。\n\n#bold 伊希姆给了你一切，现在是时候回报了。#!"
 bookmark_warofprinces_farnaza: "法纳扎"
 bookmark_warofprinces_farnaza_desc: "白珍珠女王是一位离经叛道并我行我素的统治者。这位虔诚的琐罗亚斯德教徒，凭借一系列幸运和对手的错误，夺取了摩加迪沙的控制权，对这座城市不断涌入的伊斯兰移民持谨慎的态度。\n鹰巢和哈基姆圣裔的领导层并未对她进行监视，这既是对她能力的信心的表现，也是出于实际考虑，因为距离过远。因此，如果她失败了，所有的责任都将落在她身上。但到目前为止，法尔娜扎以极高的技巧走过了这条紧绷的绳索，利用穆斯林对抗本土非洲人，充分利用了对手之间的矛盾。\n\n#bold 摩加迪沙一切顺利。你不禁怀疑最近是否放松了警惕。时间会告诉我们答案。#!"
 bookmark_warofprinces_ikkenai: "伊奇奈"
 bookmark_warofprinces_ikkenai_desc: "伊奇奈生于撒克逊部落，并因对该部落的冈格罗守护者的忠诚而获得$pod_Embrace$。她成为她人民的可怕守护者，成功地将他们从罗马人手中拯救出来，但几个世纪后，查理曼大帝和他的超自然盟友证明了自己太过强大。\n对于失去人民的愤怒，她盲目地袭击修道院，直到意识到为时已晚。伊奇奈现在试图集中自己的努力，以目标定位她曾经的家园，如今已经成为繁华的亚琛。对于大多数德意志吸血鬼来说，她是过去时代的遗物，力量微弱，但一些憎恶文明的森林居民对她的进展充满兴趣……\n\n#bold 你将夺回你的家园，即使只有你一个人。你的部落呼唤着复仇。#!"
 bookmark_warofprinces_arnulfgangrel: "阿努尔夫"
 bookmark_warofprinces_arnulfgangrel_desc: "阿努尔夫在冈格罗中是一个传奇。他是文明的终极敌人，永不停歇的天罚，有一天将世界带回原始根源。阿努尔夫曾与匈人一起摧毁罗马，与马扎尔人一起掠夺匈牙利，与蒙古人一起焚烧大草原。\n他[Glossary('初拥','game_concept_Embrace_desc')]了许多最伟大的冈格罗，并指导了更多人，总是有渴望成名的年轻野者跟随在他身后。\n最近，阿努尔夫从对抗睿魔尔的特兰西瓦尼亚战役中回来，响应了年轻喀喇的原始教徒团结号召，尽管他对喀喇本人并不感到印象深刻。\n\n#bold 这个“利沃尼亚野者”联盟让你满意，但你对喀喇是否有领导能力表示怀疑。你知道如果你召集，整个$pod_clan$都会响应。也许现在是时候了。#!"
 bookmark_warofprinces_inanna: "伊南娜"
 bookmark_warofprinces_inanna_desc: "伊南娜生于尼尼微，并成为了伪装成城市之神的吸血鬼的情人和子嗣。当安吉瓦来到这座城市时，他对末卡维的血祭感到厌恶，伊南娜的[Glossary('尊长','game_concept_Sire_desc')]与他为敌。在冲突中，神庙被摧毁，只有伊南娜幸存下来。她对失去情人的愤怒和悲伤使她发誓要向那个给她的城市带来痛苦的陌生人复仇。\n后来，她作为罗马亲王卡米拉对抗迦太基的支持者之一再次露面。她战斗勇猛，从永恒元老院那里获得了几项特权，包括[Glossary('吸榨','game_concept_diablerie_desc')]敌人的权利。凭借她新获得的力量，她多次与安吉瓦对抗，但从未取得完全的胜利。\n\n#bold 你对杀死你的宿敌的执念将成为你的力量。#!"
 bookmark_warofprinces_midian: "米甸"
 bookmark_warofprinces_midian_desc: "在9世纪左右，米甸与撒克逊人一同来到了汉堡。他很快开始与教会建立起密切的关系，并与新兴的商人阶级及其的不死族支持者展开了竞争。在这场阴暗的战斗中，米甸利用优势于1054年宣布自己为亲王。随后，教会的力量逐渐衰落，使米甸陷入了痛苦和忧郁的绝望之中。\n当米甸意识到自己已经没有力量时，他的心灵终于崩溃了。于是，他的暴走开始了。他开始[Glossary('吸榨','game_concept_diablerie_desc')]任何进“他的”城市的$pod_cainite$，将他们的灵魂融入他破碎心智蜂巢中，从而创造了他从未拥有过的宫廷。\n\n#bold 你独自坐在高耸的塔楼的广阔接待厅里，沉思着并与一群只存在于你的想象中的廷臣进行精心编排的对话……或许他们仍然在你的血液中跳动着。#!"
 bookmark_warofprinces_angiwar: "安吉瓦"
 bookmark_warofprinces_angiwar_desc: "美茵河谷的原住民之一，年轻的安吉瓦在水边发现了一位少女流着血泪哭泣。他倾听了她的故事，并没有抗拒她。被他的真诚和诚实所感动，这位少女[Glossary('初拥','game_concept_Embrace_desc')]了他。\n随后，他成为了许多年轻的诺斯费拉图的导师和兄长般的人物，其中包括那些寻求[golconda|E]的人，这也正是他自己渴望的。\n安吉瓦随后将注意力转向了尼克图库，这些可怕的恶怪一直在追杀诺诺斯费拉图。尽管取得了一些胜利，他被迫撤退到法兰克福。就在那里，他遇到了茱莉亚·安塔西娅，并迅速为她对于$pod_cainite$社会的理想愿景所迷倒，立即向她的大业表示效忠。\n\n#bold 你是你所属$pod_clan$备受困扰的希望的明亮灯塔，你不打算让他们失望。#!"
 bookmark_warofprinces_kodesh: "克里·科德什"
 bookmark_warofprinces_kodesh_desc: "在早期基督教的重要事件中出生并被$pod_Embrace$，克里·科德什的真正起源充满了神秘。似乎他是第一位从传说中的圣杯中饮用（并幸存）的吸血鬼，这解释了他作为诺斯费拉图而不丑陋的原因。凭借这个强大的宝物，克利·科德什沉思着眼前漫长的永恒……却只发现了无聊。\n将圣杯扔进最近的垃圾堆，科德什决定将他的永恒奉献给一个目标，那就是从最小的笑话到最大的计谋，始终寻找新的娱乐方式。\n\n#bold 永恒太长了，无法闲坐。是时候找到新的方法来缓解你厌倦的心灵，摆脱这个拖延的闹剧。#!"
 bookmark_warofprinces_varsik: "瓦西克"
 bookmark_warofprinces_varsik_desc: "作为一名旅行商人，瓦西克以他的口才、手法和内在的流浪欲望吸引了玛土撒拉巴希里特的注意，他被作为七位门徒之一[Glossary('初拥','game_concept_Embrace_desc')]了。\n他跟随他的[Glossary('尊长','game_concept_Sire_desc')]游历于中世纪世界，将矛盾之路的教义与基督教《启示录》相融合。\n1101年，他来到耶路撒冷，追踪另一位门徒的终焉之死。他希望利用城市内部的混乱将巴希里特教义传播给他$pod_clan$的其他成员甚至其他$pod_cainites$，同时他自己积累了巨额财富，成为城市中最有权势的人物之一。\n\n#bold 最近雌狮的到来极大地削弱了你的影响力。你必须退后一步，计划从远处回到耶路撒冷。#!"
 bookmark_warofprinces_ramessu: "拉美苏"
 bookmark_warofprinces_ramessu_desc: "作为吒婆多修罗的子嗣之一，拉美苏很快对他所属的$pod_clan$与印度东部入侵者之间的永恒之战感到厌倦。因此，他选择在埃及定居，得益于赛特之子和奥西里斯联盟之间正在进行的战争。\n拉美苏征服了分心的赛特之子所占据的大片领土，建立了自己的迦提（种姓），名为亚历山得利特。此后，赛特之子重新组织并进行反击，但强大的玛土撒拉和他的子嗣仍然是他们边境上的主要威胁。\n\n#bold 你已经深爱上了埃及。你将维护它古老的荣耀，同时摆脱侵扰它的蛇形害虫。#!"
 bookmark_warofprinces_sundervere: "孙陀罗伐罗"
 bookmark_warofprinces_sundervere_desc: "乍一看，孙陀罗伐罗只是一位年近中年、身材瘦小的男人，他剃光了头，额头上有一个凹形痕迹，身穿一件白袍。然后你能看到他的眼睛——黑色的、磁性的，燃烧着狂热的意志。虚空凝视着你。\n作为一位印度谋略大师，孙陀罗伐罗更喜欢只与其他底提耶合作，或者与他的印度凡人和分散在世界各地的各种奇怪而秘密的末日邪教团体合作。他不仅有着数个末日邪教的效忠，还可能按照需要创建新的邪教。有一件事是确定的，这人野心勃勃，傲慢自大，并且有意尽早成为一个有权势的人。\n\n#bold 印度是你开始伟大崛起的肥沃土壤！#!"
 bookmark_warofprinces_zhenga: "真加"
 bookmark_warofprinces_zhenga_desc: "奴隶、毒品、$pod_vitae$和秘密是真加的货物，任何人都可以通过支付合适的价格购买。与土生土长的莱本保持良好关系，真加准备将埃及南部的土地宣布为她的正式领地，作为赛特之子在撒哈拉以南的非洲的行动基地。\n她还试图创建一支名为毕玛（尼罗语中的[ghoul|E]）的新[Glossary('遗传血仆','game_concept_revenant_desc')]血统，只服从非洲荒野中的赛特之子。\n\n#bold 凭借你对秘密、堕落和遗传血仆繁衍的掌控，你将最终为赛特的荣耀夺取非洲！#!"
 bookmark_warofprinces_abetorius: "阿贝托留斯"
 bookmark_warofprinces_abetorius_desc: "阿贝托留斯最初是在12世纪由睿魔尔本人派往希腊的。抵达该地区后，他最初在君士坦丁堡，受到米迦勒派妥芮朵的暂时庇护。他的官方任务是建立外交关系，而他真正的任务是追捕泰丽莎·埃纳这名叛逃的睿魔尔成员，并调查有关一名隐藏在城市中的萨洛比的传闻。随着第四次十字军东征摧毁了希腊，阿贝托留斯与安娜·科穆宁站在了一起，希望在帮助她夺回世界渴望之城后获得强大的盟友。\n\n#bold 虽然情况发生了变化，但任务并未改变。叛逃者必须被绳之以法，而睿魔尔在该地区的地位必须得到保障。#!"
 bookmark_warofprinces_amichai: "阿米亥"
 bookmark_warofprinces_amichai_desc: "作为一位有才的法师和卡巴拉学者，阿米亥在他的$pod_Embrace$之后，他的魔法天赋完全消失了，但他在支配术和观占术方面的能力却显示出非凡的才华。由于无法在家族和不断壮大的金字塔中取得进展，他的[Glossary('尊长','game_concept_Sire_desc')]将她的尴尬之处转化为机遇，派遣她前往印度。\n阿米亥融入了科钦犹太人群体中，成功地迷惑了曼加卢尔的几位重要凡人，充当商队的赞助人。他缺乏魔法技能使得檀那婆对他不屑一顾，尽管如此，他与印度的雷伏诺保持着一种随意而友好的关系。\n\n#bold 你一直被低估。是时候通过确保睿魔尔$pod_clan$在印度的地位来证明他们是错的了！#!"
 bookmark_warofprinces_lamia: "拉米亚"
 bookmark_warofprinces_lamia_desc: "历经岁月，拉米亚密教一直是一个被严密保守的秘密，避开了那些将人们的命运踩在脚下的暴君、元老和国王们的目光。正是在一个没有月光的夜晚，卡帕多西亚的拉撒路发现了她。\n拉米亚的博学和热情，也许还有其他的品质，触动了掘墓人内心深处长久隐藏的某种东西；于是，他胁迫了拉米亚，并将她带到了黑暗之母乌木雕像的不赞同目光下。\n她很快报了仇，因为她所知道的奥秘对于拉撒路来说太过强大。尽管如此，女祭司还是同意与她的新$pod_clan$达成了一个盟约。\n\n#bold 你容忍卡帕多西亚，但你的忠诚只属于莉莉丝。赞美黑暗之母！#!"
 bookmark_inquisitor_inauhaten: "伊努哈顿"
 bookmark_inquisitor_inauhaten_desc: "被称为伊努哈顿的木乃伊曾经是一名建筑师，但在他重生之后，他开始研究死亡，以更多地了解自己和来世。\n据说正是他在埃及首次与塔尔玛埃拉法师见面时，告诉了他们有关以诺城的本质。作为交换条件，当伊努哈顿等待复活时，他们保护了他的身体，他则向他们报告他在[UmbraGlossaryLocalized('shadowlands','冥界')]所见到的事物，包括死灵和他们秘隐社会的知识。最重要的是，他谈到了一个名为以诺城的界域，并在带领他们找到这座城市并帮助他们占领之后，被接纳为该教派的一员。自那以后，他一直是该教派中地位高且备受尊敬的成员，尽管有些孤高。\n\n#bold 你的目标是你自己的，但现在与塔尔玛埃拉是一致的。#!"
 bookmark_inquisitor_astrokhen: "阿斯特拉孔"
 bookmark_inquisitor_astrokhen_desc: "#R 该角色为无地冒险者，需安装《权力之路》DLC才能启用！#!\n\n阿斯特拉孔是一位追求永生的古埃及野心家法师。在与荷鲁斯的交锋中败走逃亡后，他通过迷途的木乃伊卡比洛斯找到了永生的方法。\n然而余怒未消的荷鲁斯很快追上了阿斯特拉孔。竟被他的顽强和求生意志所折服，复仇之神放弃了抹杀阿斯特拉孔，转而降下诅咒，赋予他一项艰难的任务。身不由己的阿斯特拉孔就此接手荷鲁斯托付的大批强力宝物，并被命令对其进行保管，不许任何人夺走。几千年来，情况一直如此，直到名为克里·科德什的吸血鬼幕后操纵的事件发生，使得阿斯特拉孔的宝库被洗劫一空，他的珍藏散落四方，不知所踪。\n\n#bold 你必须尽快找回这些宝物，以免荷鲁斯的诅咒降临到你身上。#!"
 bm_1230_battle_royale: "诸族"
 bm_1230_battle_royale_desc: "黑暗世界中的其他可玩种族都在此剧本。如需更详细地了解每个种族，请在屏幕左侧选择次剧本。\n\n裁判官是教会派遣于猎杀超自然生物的专员。\n猎人是不隶属裁判所但依然对抗超自然的人。\n恶魔是堕落天使，一心想要腐蚀人类的灵魂。\n木乃伊是与赛特进行长久战争的埃及不朽者。\n狼人是盖亚的战士，保护盖亚免受文明侵蚀。\n芭丝特是猫人，是盖亚在非洲和印度的卫士。\n​魔克拉是鳄鱼人与龙人，作为盖亚记忆的长寿守护者。"
