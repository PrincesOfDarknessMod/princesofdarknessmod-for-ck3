 bookmark_fae_salih:0 "沙里赫"
 bookmark_fae_salih_desc:0 "He has moved with the Bazaar as long as memory, and some speculate it was he who forged the oaths that govern the tent city. Salih peddles information. The Inanimae of Sand supposedly knows the secrets of life and death, of magic and the origins of the fae, of alliances and conspiracies. His knowledge comes with a heavy price. Some who have dealt with Salih have died in pursuit of some bit of knowledge he asked in trade. The risks of dealing with Salih are great, and precious few come away from the encounter with more than they brought, but there are always those desperate enough for answers\n\n#bold Your knowledge has come at great price, be sure to always sell it for more.#!"
