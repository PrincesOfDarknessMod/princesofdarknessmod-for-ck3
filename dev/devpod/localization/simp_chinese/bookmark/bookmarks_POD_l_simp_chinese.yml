 bookmark_fae_gwydion_desc: "格威狄昂是一位精湛的战士，同时也是一位有成就的术士。当格威狄昂年轻、愚蠢而骄傲时，他和一群人抢劫了他叔叔马斯·马索努伊的家园——卡尔·达塔尔。马索努伊邀战格威狄昂与他的女儿克雷德温进行战斗。她像格威狄昂对待她的父亲时一样击败了他。马索努伊将格威狄昂变成了一只雄鹿、一只野猪和一只狼，每次都被猎人追捕。他在这次磨难中幸存下来，成为了一位成长了的妖精——格威狄昂成为了威尔士人民反抗邪恶领主和残暴食人魔的正义而强大的捍卫者。他选择建立了一个由志同道合的战士组成的世家。他公开向他人发起挑战，试图在战斗中击败他，通过这些挑战，他从那些被他打败的人中招募了三百名忠诚的战士。最终，马斯的女儿克雷德温也前来挑战他。这一次，他勉强战胜了她。他们相爱并一直在一起。\n\n#bold 格威狄昂世家的人具有一种神秘的力量，可以察觉谎言，但他们也容易陷入狂暴的愤怒之中。#!"
 bookmark_fae_fiona_desc: "智者们说她体现了年轻恋人的激情；男孩的胜利带来了无敌的战欲，女孩的失贞带来了迷人的悲伤。这些特质已经成为她自己人民的标志；一个也以欲望、固执和喜悦蓬勃发展的世家。费恩娜还与行走的亡者建立了友谊，与不宁的灵魂交谈，并在原始教巫师的冬至篝火周围跳舞。她特别喜爱被称为狼族的浪子，而其中最喜爱的是芬尼安；他们内心的火焰、对誓言和歌曲的热爱与她自己轻而易举地相匹配。她的激情与这些芬尼安甚至与自称盖亚之子的其他人的激情交融在一起。\n\n#bold 许多人都爱上了费恩娜女士，尽管她对每个人都充满爱意，但她从未完全分享她的心。当她最终爱上一个凡人时，她背叛了狼族的信任，与人类分享了银的秘密。因为她的罪行，她被流放出[UmbraGlossary('arcadia')]。她的人类爱人被隐藏在一个魔法长眠中，费恩娜无法忍受看着他。#!"
 bookmark_fae_cathal: "卡哈尔"
 bookmark_fae_cathal_desc: "巴烙世家的起源可以追溯到卡哈尔，长臂鲁格之子，邪眼巴烙之孙。为了获得力量和对他们世系的保护，他对[UmbraGlossary('dreaming')]做出了一些承诺。其中之一就是他和他的世家成员将始终坚定地偏向哀怒廷。因此，他们在历史剧中的角色将永远得到履行。对于世家来说，他们的角色是无与伦比的英雄：为个体权利和对他们人民的不公进行正义战斗的勇敢战士，而对于喜乐廷来说，他们是故事中的恶棍。卡哈尔寻找并找到了许多强大的宝物，他将其视为信托，以便在巴烙世家足够强大时推翻其他尊贵的仙族世族。这位弗摩尔族裔的仙族有着与他的“畸形”相关的能力，例如对寒铁的某种耐受力。\n\n#bold 大多数喜乐廷相信巴烙世家的成员就像坏孩子一样，他们对妖精社会的地位不满，只是为了震惊他们的喜乐廷表亲而言行。很少有人理解巴烙世家所带来的真正危险。#!"
 bookmark_fae_uathach: "乌莎哈"
 bookmark_fae_uathach_desc: "乌莎哈这个名字（字面意思为可怕的）来自于神族老巫师马斯根的预言，他曾担任斯卡哈的导师和宰相。乌莎哈展示了超越了世家最年长的魔法师的术法技能。\n当马斯根最终屈服于其他已往达南神族的召唤，前往[UmbraGlossary('deep_dreaming')]时，乌莎哈接任他的位置，成为莫泊桑神谕的马利克和首领。她在这身份中不断成长，虽然她有时追求对最古老的上古黑暗的本质进行不健康的研究，她也忠诚地为世家服务了几个世纪，成为她母亲的得力助手。\n斯卡哈决定她和她的世家将经历换生灵之道——乌莎哈拒绝了。据说母女二人在这个问题上发生了激烈的争吵，甚至动起了手。在树之战之前的短短几年里，乌莎哈和几个志同道合的追随者离开，前往[UmbraGlossary('sea_of_silver')]追寻他们的命运。她在那里找到了什么，她只向极少数人透露。自从她回来以后，乌莎哈现在领导着世家。"
 bm_1375_patronwar_sub_easteregg: "彩蛋"
