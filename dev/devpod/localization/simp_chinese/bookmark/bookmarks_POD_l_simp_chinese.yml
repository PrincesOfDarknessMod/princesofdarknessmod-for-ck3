 bookmark_warofprinces_shahara: "沙哈拉·拉什瓦"
 bookmark_warofprinces_shahara_desc: "自从被赛特信徒从悲惨的生活中救赎后，沙哈拉欣然接受了教派赋予的一切。她化身为毒蛇$pod_clan$的典范诱骗者——神秘莫测、工于心计，为着神的荣光诱惑人心。\n尽管尚显稚嫩，但她在耶路撒冷的首项使命中便已初显锋芒，沙哈拉愈发渴望继续她的神圣职责。\n\n#bold 你热衷于引诱男人，直至其随你乐声翩翩起舞。这般欢愉亦为大解放者​的伟业添薪续火，你自当狂热践行。假以时日，赛特必视你为最宠爱的女儿。#!"
 bm_1230_warofprinces_sub_adventurers: "冒险者"
 bm_1230_warofprinces_sub_adventurers_desc: "虽然在黑暗的中世纪旅行是一件危险的事情，但许多吸血鬼仍然这样做。有些人甚至生存下来并发展壮大。无论是邪教教主、商队首领、有地统治者的大使还是骑士团的团长，这些角色和他们的亲王一样塑造着黑暗世界。\n\n#bold 作为一名灰烬冒险者，选择自己的财富之路，这些吸血鬼勇于面对道路上的危险，并且仍然能够取得胜利。#!"
 bookmark_warofprinces_unnamed: "无名者"
 bookmark_warofprinces_unnamed_desc: "无名者是恐惧与惊骇的具象之谜，其身世传闻如蛛网般矛盾交织。有人称其为崇魔者巴力的第三始祖，亦有人断言——她乃扫罗​子嗣，誓要报复她那冷血的父亲。惊惧长夜会已立誓寻其踪迹、奉其为主……无论她真正的目的为何。\n\n#bold 你自长眠中初醒。除却鲜血、尖啸与痛楚，你对往昔一无所忆。连名讳也弃你而去。是时候寻找真相了。#!"
 bookmark_warofprinces_aimeric: "艾默里克·德·卡巴雷"
 bookmark_warofprinces_aimeric_desc: "诗人、高洁骑士、美的痴徒……艾默里克肩负多重身份，但其首要之姿，乃是该隐之子中最为老练的使节——纵使他还年轻。为效忠其主​埃丝克拉蒙德，他于法兰西血族的混沌权局中穿行，仅凭片语机锋、三分诡策与些许魅惑，便助她稳踞高位。而今，他正斟酌是否向主君重宣誓约，或是探求与那位迷人的维罗妮克·德·奥尔良结盟（乃至更深羁绊）的机会。\n\n#bold 你精擅辞令与政治权谋的名声在法兰西无人不知无人不晓。诸多统治者中，谁将有幸成为你才华的下一位眷顾者？#!"
 bookmark_warofprinces_dona_lupa_manrique: "唐娜·卢帕·曼里克"
 bookmark_warofprinces_dona_lupa_manrique_desc: "唐娜·曼里克​——白色军团的统帅，是为无数伊比利亚歌谣所赞颂的传奇。这位集美貌致命与高洁于一身的骑士，周身始终萦绕不散的哀愁，反令无数倾慕者愈发好奇。其麾下军团亦是如此，唯在正义昭然之际方承接契约，持守严苛戒律，令半岛上血族相争的乱局尽显卑琐。\n\n#bold 你已将往昔锻为刀兵。你将带领白色军团在这黑暗时代化身荣耀与正义的灯塔。#!"
 bookmark_patronwar_nieve_tingi: "涅芙·廷吉"
 bookmark_patronwar_nieve_tingi_desc: ""
 bookmark_patronwar_ilya: "伊利亚"
 bookmark_patronwar_ilya_desc: "生者、死者、超自然者——无辜者。与许多自大狂暴君不同，伊利亚深知真正的绝对统治需围绕一人凝聚，而维系其统治的是一群才华横溢的谄媚者，他们的欲望与野心与她同样多变。此类忠诚只能通过个人接触、个人联系建立，即伊利亚参与你的生活，赋予你所缺乏的力量以自救、提升并变得更好。她确实在乎。正因如此，你愿为她赴汤蹈火。\n\n#bold 如她所言，冷漠是弱者的死亡。#!"
