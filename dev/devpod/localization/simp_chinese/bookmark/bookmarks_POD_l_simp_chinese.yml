 bookmark_fae_konowa_desc:0 ""
 bookmark_fae_gwydion_desc:0 "Gwydion is a masterful warrior and an accomplished sorcerer besides. When Gwydion was young, foolish, and full of pride he and a band of robbed the household of his uncle Math Mathonwy--Caer Dathal. Mathowny challegned Gwydion to fight Mathowny's daughter Keredwyn. She defeated him as she fought her father and Gwydion only for himself. Mathowny transformed Gwydion into a stag, a boar and a wolf in turn--each hunted by hunters. He survived the ordeal a changed fae--Gwydion became a righteous and powerful defender of the people of Cymru against wicked lords and brutal ogres. He chose to build a house of like-minded warriors. He held an open challenge to others to try an best him combat, through such challenges he recruited 300 loyal warriors among those he defeated. Eventually, Math's daughter  Keredwyn also came to challenge him. Barely, this time, he defeated her. They fell in love and have been together ever since.\n\n#bold Those of House Gwydion have a mystical power to detect lies, but they are also prone to berserk rages.#!"
 bookmark_fae_fiona_desc:0 "The sages say she embodies passion from both young lovers; invincible battlelust from the boy's victory and an alluring sadness from the girl's broken maidenhead. These attributes have become the hallmark of her own people; a house also thriving on lust, willfulness, and delight. Fiona also built friendships with the walking dead, speaking with restless spirits, and dancing around the pagan wizard's solstice fires. Especially beloved by her are the Prodigals called Garou and of all these, dearest to her heart are the Fianna; their inner fires and love of oaths and songs easily match her own. More than a little of her passions mix with those Fianna and even with others calling themselves Gaia's Children.\n\n#bold Many have fallen in love with Lady Fiona, and though she was loving to all, she has never shared her heart in full. When she finally fell in love with a mortal, she betrayed the trust of the Garou to share with humans the secret of silver. For her crime, she was exiled from Arcadia. He human lover is hidden away in an enchanted sleep, and Fiona can not bare to look at him.#!"
 bookmark_fae_cathal:0 "卡哈尔"
 bookmark_fae_cathal_desc:0 "House Balor began with Cathal, the son of Lugh of the Long Arm, grandson of Balor of the Evil Eye. He has made certain pledges to the Dreaming in return for power and the protection of his line. One such pledge was that the house and all its members would remain steadfastly Unseelie. Thus would their role in the pageant always be fulfilled. To the house, the role is that of the consummate hero: brave warriors for individual rights and the redressing of wrongs against their people, while to the Seelie, they are the villains of the story. Cathal has sought and found many powerful treasures that he held in trust against the day when the Balor will be strong enough to overthrow the other noble Sidhe houses. The fomorian-born sidhe to have powers associated with his 'deformity.' such as some tolerance of cold iron.\n\n#bold Most Seelie believe that members of House Balor are like bad children, that since they are dissatisfied by their place in fae society, they say and do things merely to shock their Seelie cousins. Few understand the true danger House Balor poses.#!"
 bookmark_fae_uathach:0 "乌莎哈"
 bookmark_fae_uathach_desc:0 "Uathach's name (literally meaning the terrible) came from a prophecy by the old Tuathan wizard Mathgen, who served as Scathach's mentor and vizier. Uathach exhibited sorcerous skills that outstripped those of the clan's oldest magicians.\nWhen Mathgen finally succumbed to the call of the other departed Tuatha de Danaan and left for the Deep Dreaming, Uathach took his place as Malik and head of the Morphean Oracles. She grew in that role and, if she sometimes pursued unhealthy studies into the nature of the eldest of the Elder Darks, she also served the house loyally and well for centuries as her mother's right hand.\nScathach decided that she and the rest of her house would undergo the Changeling Way--Uathach refused. It is said that mother and daughter spoke harshly and that they even came to violence over the matter. Some short years before the War of Trees, Uathach and several like-minded followers departed for the Sea of Silver in pursuit of their destiny. What she has found there she has revealed to few if any. Since her return, Uathach now leads the house."
