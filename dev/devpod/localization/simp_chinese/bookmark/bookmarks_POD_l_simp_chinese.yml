 bastet_sub_bookmark: "黑暗时代：芭丝特"
 bm_1230_inquisitor_sub_bastet: "黑暗时代：芭丝特"
 bm_1230_inquisitor_sub_bastet_desc: "猫人是盖亚的眼睛，是化兽族裔中最多才多艺的一族。虽然它们致力于功业，但任性和孤立的性格使它们在魂怒之战中被狼人击败，被迫撤退到非洲和印度的故乡。他们在那里依然强大，其中一些梦想着有一天能再次统一分裂的猫族部落。\n\n#bold 万猫之母塞勒涅创造了你们来守护这个世界。不要让吸血鬼这样的老对手或野蛮狼人这样的假朋友分散你们对神圣职责的注意。#!"
 bookmark_bastet_tola: "托拉"
 bookmark_bastet_tola_desc: "巴希拉，或称为黑豹族，被创造出来是为了成为猫人族的法官。虽然由于猫人族的分裂他们从没真当过法官，但巴希拉仍然被所有其他部族尊重为公正的调解者和博学的导师。\n他们是一个好奇且求知欲强的部族，尤其与人类亲近并对人类充满好奇，总是努力修复伤害猫人族及其与其他变形者关系的伤痕。尽管如此，黑豹族也以其凶猛的脾气而闻名，特别是当涉及到某些不公正的事情时。许多人曾错误地将他们的温和态度视为软弱。很少有人有机会犯第二次这样的错误。\n\n#bold 印度曾经是你们与人类共存的最爱游乐场。文明的无节制崛起使印度次大陆变得容易受到吸血鬼和其他怪物的侵害。现在是纠正这一错误的时候了。#!"
 bookmark_bastet_ananka: "阿南卡"
 bookmark_bastet_ananka_desc: "布巴斯提影猫是猫族中的神秘主义者，是一个隐秘且避世的部族。他们曾经被古埃及人尊为神灵，并享受着奢华的生活，直到赛特到来。一场漫长的战争以灾难告终，布巴斯提的数量减少到几乎灭绝，他们的猫族被赛特信徒奴役。\n在大义灭亲的荷鲁斯的庇护下，布巴斯提生存了下来。影猫从奥西里斯联盟中学到了许多秘密和术法，他们正在慢慢计划对夺走他们神圣宝座的人进行迟来的复仇。\n\n#bold 你与荷鲁斯的联盟对你的族群大有裨益，但作为难民生活不配曾经是赫姆神圣猫的族群。很快，毒蛇将在猫族的神圣术法面前恐惧的爬走。#!"
 bookmark_bastet_olwen: "奥尔文"
 bookmark_bastet_olwen_desc: "崇里坎族或称为“水银猫”，曾经是现在已经灭绝的欧洲洞狮的亲族。对于其他部族的猫人来说，他们就像他们的欧洲洞狮亲族一样已经灭绝。事实要稍微复杂一些。\n喜欢恶作剧的崇里坎族与妖精有着密切的关系，他们过着（一般冷酷无情）恶作剧人类和其他生物的生活。然而，一位妖精领主对他们特别感兴趣，并很快开始追捕他们。由于欧洲洞狮的灭绝（以及他们制造许多敌人的倾向），本就稀少的崇里坎几乎被杀光或被奴役为猫。尽管如此，他们中的一些人仍然存活下来，躲避着妖精和其他敌人，终于学会了微妙的价值。\n\n#bold 由于有这么多人想要你死（或更严重），并且其他猫人认为你早已不在，你的部族的生存岌岌可危。#!"
 bookmark_bastet_soft_walker: "软步行者"
 bookmark_bastet_soft_walker_desc: "可汗虎族是高贵而有荣誉感的战士，是盖亚神选应有的光辉典范。虽然有些可汗虎族脾气暴躁且具有攻击性，但他们已经将许多亚洲教诲铭记于心，以改善自己的心智和身体。\n可汗是社会性动物，是最有可能与其他变形者一起干活的猫人。他们的弱点，如果真有的话，来自于过于信任他人或过于自信。可汗直率且以行动为导向，不是狡猾的策划者。无论这些猫人做什么，他们都全力以赴，无论是战斗、恋爱、狩猎、学习，甚至是沉思。他们以巨大的热情投入到所有任务中，无论以何种形态，他们的身体都充满了活力。\n\n#bold 当傲慢的辛巴像小暴君一样统治时，可汗总是在自我提升。狮子的时代已经结束。老虎将带头冲锋！#!"
 bookmark_bastet_taa_mlimba: "塔·姆林巴"
 bookmark_bastet_taa_mlimba_desc: "辛巴狮族是自封的猫人族统治者。他们代表了盖亚最伟大的造物，即他们是高贵的、自豪的，并且无与伦比的强大。但反过来说，他们也是傲慢的、专横的和恶意的。\n辛巴坚信他们被创造出来是为了统治他们的同胞，反社会的猫人一般普遍厌恶的这点。作为团结点和他们族群的领导者，辛巴对反抗和对他们统治的挑战反应不佳。对许多人来说，他们最好是恶霸，最坏是暴君。对他们自己来说，他们是壮丽的领主和恶魔的杀手。当平衡恢复时，当人类知道他们的位置，当城市变成墓地时，狮子将被证明是正确的。\n\n#bold 是时候把事情恢复到正确的顺序了：如果这需要流血，那就让它流血吧。\n毕竟，战争是国王的运动。#!"
 bookmark_bastet_nyolo: "尼奥洛"
 bookmark_bastet_nyolo_desc: "斯瓦拉，也被称为银族，是猫人部族中的猎豹族。像他们的亲族一样，他们非常迅捷并且善于旅行。在所有猫人部族中，斯瓦拉是最不被理解的。这是他们文化非常孤立的结果。斯瓦拉是唯一能够自然穿越界域的猫人部族，使他们能够前往他们的同胞无法到达的[umbra|E]界域。\n许多斯瓦拉知道怒嚎末日即将来临并为此做准备。许多其他猫人，特别是辛巴，将斯瓦拉视为宁愿逃避敌人也不愿面对的懦夫。\n由于他们的精神心态，猎豹族是非洲神秘土地的真正守护者，保护它们免受掠夺。有人说斯瓦拉是懦夫，但没见过斯瓦拉保卫这样的区域。\n\n#bold 让辛巴和其他人在背后嘲笑你。你知道你的职责，你不会动摇。#!"
