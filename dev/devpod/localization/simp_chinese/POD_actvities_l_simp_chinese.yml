l_simp_chinese:
 activity_brujah_panegyra: "布鲁赫大赛"
 activity_brujah_panegyra_desc: "布鲁赫大赛是希腊布鲁赫建立的传统，它是吸血鬼版本的奥林匹克运动会，专为该隐的子嗣们量身定制，具有独特的优势和缺陷。"
 activity_brujah_panegyra_host_desc: "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i][stress|E]降低\n$BULLET_WITH_TAB$[GetTrait('tourney_participant').GetName( GetNullCharacter )][trait_level_track_xp|E]"
 activity_brujah_panegyra_selection_tooltip: "邀请你的$knight_culture_player_plural$、臣子和邻居来参加精彩的赛事\n\n预期奖励：\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i][stress|E]降低"
 activity_brujah_panegyra_destination_selection: ""
 brujah_panegyra_conclusion_general: "布鲁赫大赛终于结束了。\n"
 activity_brujah_panegyra_guest_desc: "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i][stress|E]降低\n$BULLET_WITH_TAB$[GetTrait('tourney_participant').GetName( GetNullCharacter )][trait_level_track_xp|E]"
 brujah_panegyra_option_accommodations: "住宿"
 brujah_panegyra_accommodations_bad: "简陋帐篷"
 brujah_panegyra_accommodations_bad_desc: "$EFFECT_LIST_BULLET$住宿条件越好，活动结束时你获得的宗族威望就越高。\n#weak 能力和舞台，哪项更重要？#!"
 brujah_panegyra_accommodations_normal: "简易帐蓬"
 brujah_panegyra_accommodations_normal_desc: "$EFFECT_LIST_BULLET$住宿条件越好，活动结束时你获得的宗族威望就越高。\n#weak 要想比赛表现好，记得晚上要睡早。#!"
 brujah_panegyra_accommodations_good: "豪华营地"
 brujah_panegyra_accommodations_good_desc: "$EFFECT_LIST_BULLET$住宿条件越好，活动结束时你获得的宗族威望就越高。\n#weak 布鲁赫大赛不应该仅是体育赛事，还应该是完整的体育#underline 经验#!。#!"
 brujah_panegyra_option_prizes: "奖品"
 brujah_panegyra_prizes_bad: "简单奖品"
 brujah_panegyra_prizes_bad_desc: "$EFFECT_LIST_BULLET$决定获胜者能获得的金钱数量。\n\n#weak 我们来这里是因为热爱运动，这种小玩意不过是个借口。#!"
 brujah_panegyra_prizes_normal: "得体奖品"
 brujah_panegyra_prizes_normal_desc: "$EFFECT_LIST_BULLET$决定获胜者能获得的金钱数量。\n\n#weak 虽然我们来这里不是为了这些奖品，但能拿上一笔回家的路费也算是一个非常现实的目标。#!"
 brujah_panegyra_prizes_good: "精致奖品"
 brujah_panegyra_prizes_good_desc: "$EFFECT_LIST_BULLET$决定获胜者能获得的金钱数量。\n\n#weak 没有彩头，竞争有什么意义？#!"
 brujah_panegyra_prizes_very_good: "优质奖品"
 brujah_panegyra_prizes_very_good_desc: "$EFFECT_LIST_BULLET$决定获胜者能获得的金钱数量。\n\n#weak 奖品不仅仅是颁发给胜者的小玩意，它还是吸引勇敢者参赛的灯塔。#!"
 brujah_panegyra_prizes_splendid: "华丽奖品"
 brujah_panegyra_prizes_splendid_desc: "$EFFECT_LIST_BULLET$决定获胜者能获得的金钱数量。\n\n#weak 最好的奖品是那些足以让胜利者黯然失色的奖品。#!"
 brujah_panegyra_phase_archery: "射箭"
 brujah_panegyra_phase_archery_desc: "一种射箭比赛，每位选手使用一定数量的箭矢射击箭靶，目标是获得尽可能多的分数。\n它是布鲁赫大赛的新项目，主要是布鲁赫氏族的年轻成员要求添加的，他们希望大赛能更“现代”一些。\n"
 brujah_panegyra_phase_kerykes: "克律克斯"
 brujah_panegyra_phase_kerykes_desc: "一种演讲技巧比赛，是布鲁赫最有学问的人最喜欢的活动，也是外人最害怕的活动，因为它太长了。"
 brujah_panegyra_phase_wrestling: "摔跤"
 brujah_panegyra_phase_wrestling_desc: "古希腊奥林匹克运动会的经典部分，一种力量与灵巧的比赛，选手试图将对手击倒或掷出擂台，以赢得比赛。"
 brujah_panegyra_phase_boxing: "拳击"
 brujah_panegyra_phase_boxing_desc: "拳击是最容易引起参赛者狂热的竞技项目，两名选手在决斗中对决，比赛规则非常复杂（而且经常在不同的布鲁赫大赛之间变化）。"
 brujah_panegyra_phase_board_game: "棋盘游戏"
 brujah_panegyra_phase_board_game_desc: "一种智力竞赛，选手进行一系列的棋盘游戏比赛，最后剩下的选手获得最终胜利。\n到目前为止，国际象棋是玩得最多的棋类，但在国际象棋并不盛行的地方举行的布鲁赫大赛常常将国际象棋换成更有地方特色的替代品。"
 brujah_panegyra_phase_horse_race: "赛马"
 brujah_panegyra_phase_horse_race_desc: "一种观赏性运动，男女领主们观看马匹竞速，最先抵达终点线的马匹获胜。\n有些布鲁赫大赛使用战车进行比赛，有些则将赛马比赛分成各种小型比拼。"
 panegyra_rewards_tt: "奖品将被给予胜者。"
 brujah_panegyra_events.1000.t: "射箭"
 brujah_panegyra_events.1000.desc: "射箭从来不是最初的奥林匹克运动会的一部分，因此布鲁赫认为它不适合在他们的布鲁赫大赛中登场。经过氏族年轻成员长期艰苦的努力，射箭才最终被纳入比赛项目。射箭比赛的支持者往往会解释说，这是布鲁赫的完美体现，因为它既需要身体素质，也需要敏锐的头脑。\n大多数获胜者都是那些手持弓箭长大的年轻新丁，这也是他们最期待的比赛。长老们往往认为这是必要之恶，是对布鲁赫大赛更传统、更受尊重的部分的导入。"
 brujah_panegyra_events.1000.a: "是时候用尽全力了！"
 brujah_panegyra_events.1000.b: "这不是我的强项，让我们放轻松。"
 brujah_panegyra_events.1000.c: "我准备好了。"
 panegyra_overdrive_tt: "这将增加你在比赛中胜利的几率。"
 panegyra_underdrive_tt: "这将减少你在比赛中胜利的几率。"
 brujah_panegyra_events.1010.t: "克律克斯"
 brujah_panegyra_events.1010.desc: "在古典奥运会上，克律克斯（传令官）与 萨尔平泰（号手）组成了传令官和号手比赛。小号比赛在布鲁赫中并不受欢迎，但演讲比赛却很受欢迎。优胜者是根据发音的清晰度和声音的可听性以及实际表达的内容选出的。有些人使用诗歌，有些人则喜欢古希腊政治著作，如柏拉图或亚里士多德。\n这比赛深受布鲁赫长者们的喜爱，但却令其他部族闻风丧胆，因为它可能要持续好几个夜晚才会结束。迄今为止，为每位参赛者设定时间限制的礼貌请求都遭到了坚决拒绝。"
 brujah_panegyra_events.1010.b: "让我们尝试不要睡着……"
 brujah_panegyra_events.1010.c: "我的声音就是一把锋利的武器！"
 brujah_panegyra_events.1020.t: "摔跤"
 brujah_panegyra_events.1020.desc: "摔跤是经典中的经典，自从有奥运会以来就一直是奥运会的固定项目。摔跤的规则从一开始就几乎没有改变过，直到现在，它仍然布鲁赫大赛粉丝们的最爱。冈格罗和诺斯费拉图是特别凶残的选手，他们经常让布鲁赫无法获胜，因为他们已经常备了在这里战胜对手所需的体能。"
 brujah_panegyra_events.1030.t: "拳击"
 brujah_panegyra_events.1030.desc: "拳击是规则变化最频繁的比赛，也是最能引起参赛者狂热的比赛。因此，拳击有时会被认为不适合吸血鬼，但将其从布鲁赫大赛中移除的呼声从未高涨。\n这是妥芮朵最喜欢的比赛，他们说他们欣赏这种比赛所展现的“身体艺术”。刻薄的布鲁赫会偷偷说妥芮朵只是想通过参赛者满足性欲，因为按照希腊的传统，拳击比赛是裸体进行的。"
 brujah_panegyra_events.1040.t: "棋盘游戏"
 brujah_panegyra_events.1040.desc: "棋盘游戏是布鲁赫大赛的第一个非希腊奥林匹克新增项目，长期以来一直是主要项目。这往往是最具政治意义的比赛，因为这些长者们经常在这些游戏中交谈，有些人认为塑造该隐世界的重要决定（或竞争）就是从这里开始的。\n国际象棋是主要的比赛项目，但远非唯一的比赛项目。不过，裁判们并不愿意很快引入新的游戏，因为有些参赛者会尝试从被遗忘的文化中引入被遗忘的游戏，而他们又没有办法查看规则，这就会带来不公平的优势。"
 brujah_panegyra_events.1050.t: "赛马"
 brujah_panegyra_events.1050.desc: "希腊奥林匹克运动会喜欢赛马，赛马被认为是最有声望的比赛，几个世纪以来，布鲁赫大赛一直在模仿赛马。不过，每场比赛本身都有不同的特点，战车虽然光彩夺目，但如今却越来越少见了（因为这个时代有能力的战车手和战车制造者已经很少了）。\n许多人已经过渡到更传统的赛马，然后不得不考虑是否接受血仆马。在这个问题上还没有达成明确的共识，因此，参赛者最好在赛前询问清楚，否则就有可能被指责作弊。"
 brujah_panegyra_events.20.t: "竞赛结束"
 brujah_panegyra_events.20.desc: "[contest_winner.GetTitledFirstName]赢得了比赛！\n随着布鲁赫大赛的结束，竞技场上尘埃落定。失败者舔舐自己（身体或其他方面）的伤口，获胜者沉浸在他们的表现所赢得的荣耀（和嫉妒）中，而血仆仆人们则要收拾他们的不死族主人留下的烂摊子。"
 brujah_panegyra_events.20.a: "胜利者荣耀，失败者悲哀。"
 brujah_panegyra_events.13.t: "奥林匹亚重生"
 brujah_panegyra_events.13.desc: "布鲁赫大赛最早是由对奥林匹克运动会概念感到着迷的希腊布鲁赫提出的，是布鲁赫氏族在查尔西斯岛的传统聚会，每十年举行一次。赞助的比赛紧跟古希腊奥林匹克运动会，是活动中最令人期待的部分。\n随着时间的推移和布鲁赫氏族的传播，在世界的其他地方也举办了许多小型的布鲁赫大赛。每个布鲁赫大赛都有自己的变化，通常与举办地的文化有关。所有吸血鬼都可以参加，但严禁使用$pod_discipline$，这样可以让不同的参赛者公平竞争。\n虽然大多数氏族对这一活动并不感兴趣，但许多吸血鬼至少会前来观看，或以此为掩护与来自遥远国度的该隐之子进行一些政治活动。                                                                                                                                                                                                                                                                                                                                                                                                                                "
 brujah_panegyra_events.13.a: "让比赛开始吧！"
 panegyra_conclusion_general: "布鲁赫大赛已经落下帷幕。有些人赢得了荣誉，有些人感受到了失败的刺痛，还有一些人则利用这次比赛谋划未来。评委们已经在考虑下一届比赛的规则修改，选手们也在考虑如何改进训练方法以取得更好的成绩。\n总之，布鲁赫氏族取得了成功，提醒了全世界的该隐之子，他们仍然坚持着精神与身体的完美的理想。"
 panegyra_archery_tt: "射箭比赛更青睐有耐心、弓法娴熟（拥有一把好弓也很有帮助）、身体素质全面过硬的选手。"
 panegyra_kerykes_tt: "克律克斯比赛更青睐有高外交技能、诗人和合群的参赛者。害羞或不善言辞的角色获胜的几率更低。"
 panegyra_wrestling_tt: "摔跤比赛非常青睐有高勇武技能和强壮的角色。"
 panegyra_boxing_tt: "拳击比赛更青睐有耐心、冷酷和擅长决斗（如刀剑大师）的角色。"
 panegyra_board_game_tt: "棋盘游戏比赛更青睐有学识、有耐心和狡诈的角色。"
 panegyra_horse_race_tt: "赛马比赛更青睐技术高超的骑手、高管理技能和勤勉的角色。"
 brujah_panegyra_events.1001.t: "交易工具"
 brujah_panegyra_events.1001.desc: "参加射箭比赛的选手都要自备弓箭，因此在布鲁赫大赛附近出现了一个规模不大但却很繁荣的弓匠社区。许多吸血鬼平时不用弓，所以他们会在比赛前购买工匠们推荐的弓。即使是少数自带武器的该隐之子，也会在比赛开始前对武器进行检查，以确保其完好无损。"
 brujah_panegyra_events.1001.a: "我要全国最好的弓！"
 brujah_panegyra_events.1001.b: "只要把两根树枝绑在一起就可以了吧。"
 brujah_panegyra_events.1001.c: "一把普通的弓就足够了。"
 panegyra_overdrive_other_tt: "该选手将有更多概率赢得本次比赛。"
 panegyra_underdrive_other_tt: "该选手将有更少概率赢得本次比赛。"
 brujah_panegyra_events.1002.t: "帮把手"
 brujah_panegyra_events.1002.desc: "射箭比赛正在进行中，另一位参赛者注意到了你最初取得的好成绩，前来向你寻求建议。按照吸血鬼社会的习惯，他们当然不会指望建议是免费的，而且他们也没有像你们这类人一样会玩复杂的政治交易，而是提出用少量金币聘请你在比赛期间担任顾问。"
 brujah_panegyra_events.1002.a: "首先，让我们来谈谈风……"
 brujah_panegyra_events.1002.b: "哈！不。"
 brujah_panegyra_events.1002.c: "给其一些基础建议，然后离开。"
 panegyra_disqualified_tt: "你被取消参赛资格。"
 brujah_panegyra_events.1003.t: "一点小帮助"
 brujah_panegyra_events.1003.desc: "即使是最年轻的吸血鬼，如果他们使用自己的血液，也有可能获得强大的体能。因此，在任何有利于这些的比赛中，作弊都是非常容易的。不过，布鲁赫的规则很明确，比赛期间不得使用任何血之力。众所周知，布鲁赫的裁判们会出奇地敏锐地发现任何此类作弊企图。\n不过你可以肯定有些人（如果不是大多数）不会被发现，所以你可以试试。这可能会让你在比赛中占得先机，也可能会让你在被抓后被取消资格。"
 brujah_panegyra_events.1003.a: "只要没被抓到，就不算作弊。"
 brujah_panegyra_events.1003.b: "我的完美身材就是我所需要的全部作弊手段。"
 brujah_panegyra_events.1003.c: "只有弱者才会作弊。"
 brujah_panegyra_events.1003.d: "抓住了！"
 brujah_panegyra_events.1011.t: "完美准备"
 brujah_panegyra_events.1011.desc: "对于一些传统的布鲁赫来说，克律克斯是布鲁赫大赛最重要的活动。他们花费数年时间准备演讲稿，寻找完美的词语和语调，以便在比赛中进行（很长时间的）表演。\n对于外人来说，如果没有充分的准备，是很难进入这种级别的比赛的。虽然比赛中也会出现一些意外情况，但最有可能的情况是，通常的参赛选手认为他们需要发表更长的演讲才能获胜。"
 brujah_panegyra_events.1011.a: "我把一切都安排得妥妥当当！"
 brujah_panegyra_events.1011.b: "我可以从这些演说家身上学到一两件事。"
 brujah_panegyra_events.1011.c: "让我们做好准备吧。"
 brujah_panegyra_events.1012.t: "代笔"
 brujah_panegyra_events.1012.desc: "当你在院子里漫步时，你注意到克律克斯的一位参与者在与不远处的另一位客人交谈时，将演讲稿丢在了一边。这种情况非常罕见，当你确认附近似乎没有人时，您嗅到了机会。\n战争和游戏都兵不厌诈，不是吗？"
 brujah_panegyra_events.1012.a: "烧掉它！因为这会很有趣。"
 brujah_panegyra_events.1012.b: "偷走它，妨碍其的表演。"
 brujah_panegyra_events.1012.c: "研究它，向其学习。"
 brujah_panegyra_events.1012.d: "礼貌地还回去吧。"
 brujah_panegyra_events.1013.t: "准备发言"
 brujah_panegyra_events.1013.desc: "在评委和观众面前发表演讲是克律克斯的重头戏。那些来自传统背景的选手通常会进行冗长、深思熟虑的演讲，从而赢得同行的尊重。而年轻的参赛者则倾向于采用更“直奔主题”的方式，谈论更现代的话题，甚至利用克律克斯作为宣泄政治不满情绪的平台。\n在比赛过程中，作弊的企图并非没有发生过，因为心智血律对影响评委很有帮助。不过，布鲁赫仲裁员会一如既往地在一旁密切关注，并随时准备在必要时迅速宣布取消比赛资格。"
 brujah_panegyra_events.1013.a: "只需一点精神上的推动……"
 brujah_panegyra_events.1013.b: "你会给我第一名！"
 brujah_panegyra_events.1013.c: "对于我的第一百六十六要点……"
 brujah_panegyra_events.1013.d: "让我们就这样继续吧。"
 brujah_panegyra_events.1021.t: "虎之眼"
 brujah_panegyra_events.1021.desc: "在布鲁赫大赛，拳击几乎被提升为一种艺术形式，这主要是因为一些拳击练习者经过几个世纪的练习来掌握它。如果你想与如此可怕的对手一较高下，就必须进行严格的训练。值得庆幸的是，布鲁赫大赛有足够的机会进行这种训练，尽管结果总是难以预料，因为吸血鬼的身体对这种训练的反应与凡人的不太一样。"
 brujah_panegyra_events.1021.a: "播放蒙太奇！"
 brujah_panegyra_events.1021.b: "我是完美的。"
 brujah_panegyra_events.1022.t: "陪练"
 brujah_panegyra_events.1022.desc: "参赛选手们正在为拳击比赛做准备，许多人都在寻找陪练，以真正检验自己的技能。其中一位选手找到了你，请求与你合作。是全力以赴，让对手占得先机，还是巧妙地削弱对手的潜能，就看你的选择了。"
 brujah_panegyra_events.1022.a: "你做你的，我看我的。"
 brujah_panegyra_events.1022.b: "更快！你可以做得更好！"
 brujah_panegyra_events.1023.t: "猛烈抨击"
 brujah_panegyra_events.1023.desc: "迄今为止，拳击是布鲁赫大赛取消资格最多的比赛。让两个吸血鬼互殴很容易让人陷入血狂，比赛几乎是意志力的比拼，而不是体力的比拼。陷入血狂会立刻输掉比赛，但过度抑制本能也会影响整体表现。要想获胜，就必须取得微妙的平衡。"
 brujah_panegyra_events.1023.a: "释放它！"
 brujah_panegyra_events.1023.b: "彻！底！释！放！它！"
 brujah_panegyra_events.1023.c: "沉着冷静。"
 brujah_panegyra_events.1031.t: "游戏进行中"
 brujah_panegyra_events.1031.desc: "每次布鲁赫大赛期间，都会有各种各样的棋盘游戏，尽管大多数只是用于训练或新奇的目的，而不是真正的比赛。尽管如此，许多吸血鬼还是觉得这些娱乐活动与他们夜以继日要面对的一些情况惊人地接近。因此，许多观众在闲暇时也会加入参赛者的行列，参与现场的各种活动。"
 brujah_panegyra_events.1031.a: "来局益智问答游戏？"
 brujah_panegyra_events.1031.b: "战棋是最好的！"
 brujah_panegyra_events.1031.c: "让我们把注意力集中在比赛上吧。"
 brujah_panegyra_events.1032.t: "奇怪规则"
 brujah_panegyra_events.1032.desc: "凡人世界创作了许多棋盘游戏，每种游戏都有许多不同的规则。要掌握这些规则是很困难的，尤其是吸血鬼，他们常常固步自封。有一位这样的参赛者找到你，希望你能帮助他了解你所在地区的一种特别神秘的游戏。这是一个展示你的知识的好机会……或者只是嘲笑其的失败。"
 brujah_panegyra_events.1032.a: "连小孩都知道怎么玩这个游戏！"
 brujah_panegyra_events.1032.b: "所以，在第一轮……"
 brujah_panegyra_events.1033.t: "千年圣战的棋招"
 brujah_panegyra_events.1033.desc: "在棋盘游戏比赛中，你的第一个对手显然把你玩的游戏看成是千年圣战的抽象，即该隐之子玩的所谓政治和阴谋的大棋。这种做法并不罕见，因为许多吸血鬼都把别人看作棋盘上的棋子，并提前几十年就计划好了自己的行动。但在真正的比赛中，这种情况就比较少见了，你的对手似乎更倾向于逼迫你用棋局发表一些微妙的政治声明，而不是真正下棋。"
 brujah_panegyra_events.1033.a: "让我们就单单玩游戏。"
 brujah_panegyra_events.1033.b: "如果这棋子代表了这亲王，那么……"
 brujah_panegyra_events.1041.t: "只逛不买"
 brujah_panegyra_events.1041.desc: "在正赛开始之前，布鲁赫大赛表演了一场凡人和血仆摔跤手之间的对决。虽然他们肯定缺乏经验和吸血鬼蛮力，但他们使用了一些更现代的战术，这在比赛中可能会被证明是有用的。\n这些凡人也是很好的标本，你注意到有几个吸血鬼正饥渴地看着他们，也许是希望喝到他们甜美而浓烈的鲜血"
 brujah_panegyra_events.1041.a: "好味！"
 brujah_panegyra_events.1041.b: "我更想要这只。"
 brujah_panegyra_events.1041.c: "只是研究他们的比拼。"
 brujah_panegyra_events.1042.t: "表演赛"
 brujah_panegyra_events.1042.desc: "布鲁赫大赛裁判通知你，在摔跤比赛正式开始之前，你被选中参加一场表演赛。这是一把双刃剑，因为如果你全力以赴，就有可能在其他选手面前暴露自己的弱点和长处。然而，如果你不全力以赴，就很可能输掉比赛，在众多观众面前输掉比赛总是一件令人羞愧的事情。"
 brujah_panegyra_events.1042.a: "输掉比赛，隐藏战术。"
 brujah_panegyra_events.1042.b: "为荣耀而胜！"
 brujah_panegyra_events.1043.t: "打假赛"
 brujah_panegyra_events.1043.desc: "摔跤比赛开始前，一位匿名选手的仆人找到了你。他们认为你可能会威胁到他们的胜利，于是给了你一些金钱，让你输掉早先的一场比赛，不再参加后面的比赛。众所周知，布鲁赫大赛的裁判们很注意吸血鬼能力的使用……但他们也很愚蠢，忽视老式的作弊和暗箱也会发生，所以你被抓住的可能性很小。"
 brujah_panegyra_events.1043.a: "金钱比荣耀更有用。"
 brujah_panegyra_events.1043.b: "……但荣耀是永恒的！"
 brujah_panegyra_events.1051.t: "黄金战车"
 brujah_panegyra_events.1051.desc: "这次布鲁赫大赛的组织者决定这次将是一场战车比赛，这是一个非常古老的传统，可以追溯到凡人的奥林匹克运动会。遗憾的是，战车已经被这个黑暗时代的凡人遗忘，要想弄到一辆既威风又高效的战车可不容易。\n工匠们（通常是来自吸血鬼培养的战车工匠血仆世家）就在布鲁赫大赛的郊外，随时准备为你提供他们的工艺品。你会选择什么呢？"
 brujah_panegyra_events.1051.a: "这个便宜的就绰绰有余了！"
 brujah_panegyra_events.1051.b: "要坚固耐用的。"
 brujah_panegyra_events.1051.c: "只有昔日的黄金战车才行！"
 brujah_panegyra_events.1052.t: "夜间马上枪术比武"
 brujah_panegyra_events.1052.desc: "很久以来，马上枪术比武一直是贵族凡人的一种流行消遣，但却迟迟未能赶上思想更为传统的吸血鬼。尽管如此，年轻一代的该隐之子还是在这个时代诞生了，有时甚至是曾练习过马上枪术比武的贵族们。因此，马上枪术比武已经有了足够的影响力，有时还被列为布鲁赫大赛的一部分。\n这是一项致命的比赛，因为比武要求毫不退缩，因为你很清楚，当你的长矛相撞时，对手可能会巧妙地利用他们血之力直接杀死你。"
 brujah_panegyra_events.1052.a: "恐惧不在我的词典中。"
 brujah_panegyra_events.1052.b: "在触碰之前，让我们退一步……"
 brujah_panegyra_events.1053.t: "有用的血"
 brujah_panegyra_events.1053.desc: "布鲁赫大赛的组织者已经决定，这次赛马比赛中不允许使用“血仆马”。为了确保没有人作弊，会对赛马进行检验。\n这给了你一个机会，因为你注意到在通往自己马厩的路上有一个无人看守的马厩。只要贿赂一下马厩管理员，再加上一些自己的血，你就能把其他参赛者的一匹马变成血仆，从而确保其在比赛中被取消资格。"
 brujah_panegyra_events.1053.a: "小阴谋是最好的计谋。"
 brujah_panegyra_events.1053.b: "……还是太小家子气了。"
