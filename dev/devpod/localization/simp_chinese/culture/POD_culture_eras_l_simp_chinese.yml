l_simp_chinese:
 culture_era_dark_fantastic: "黑暗奇幻"
 culture_era_dark_fantastic_desc: "在中世纪末期到近代早期，探险家正在慢慢揭开美洲的神秘面纱，强有力的中央集权君主制正在慢慢取代中世纪封邦建国的分封制。"
 culture_era_gothic_victorian: "哥特维多利亚"
 culture_era_gothic_victorian_desc: "“哥特维多利亚”这名字隐喻了对应世设的两种情怀：一种是古典哥特小说中忧郁、注定要失败的浪漫主义，另一种对应着英格兰维多利亚女王一世的统治时期，她从1837年6月20日统治大英帝国，直到1901年1月22日去世。这两种情怀都推断出一种对激进的社会变革的关注，因为它与传统本身的压制力量交替共存和互相冲突。《维多利亚血族》中的维多利亚哥特时代贯穿了从1890年到1897年的年份，并没有随着维多利亚的去世而结束，而是随着布拉姆·斯托克的小说《德古拉》而结束——该事件彻底惊动了整个血族世界的核心。维多利亚哥特时代与狂野西部（《狼人：狂野西部》的世设）部分重叠。不过，这两个世设的主题和基调有很大的不同。即将显现的《法师：超凡入圣》中的维多利亚法师也将遭遇维多利亚时代。"
 culture_era_final_nights: "终末之夜"
 culture_era_final_nights_desc: "在$pod_cainite$的末日预言中，终末之夜指的是火焚降临和血族灭亡之前的那些夜晚。终末之夜的大部分可信度基础来自于挪得学家写的传说，尤其是《挪得之书》。终末之夜应该是应由引起$pod_cainite$社会的巨大变化和[Glossary('上古耆宿','game_concept_antediluvian_desc')]的苏醒的数个迹象标明，例如淡血种的增长，劣族成为亲王，和[GetTrait('kueijin').GetName( GetNullCharacter )]入侵西方，据说大多数吸血鬼拥有对终末之夜的末日预感。"
 innovation_tenaille: "钳堡"
 innovation_tenaille_desc: "沿着弧形城墙开火是很困难的，一旦攻击者太过靠近防御工事，其他防御部队想从侧翼提供火力支援基本就不可能了。星形堡垒的发展保证了城墙的每一部分都可以得到其他方面的支援。"
 innovation_trunnions: "炮耳"
 innovation_trunnions_desc: "对于那些有着较强移动力的新式火炮来说有一个大问题——无法轻易地升降来调整开火角度。炮耳是圆柱形的突起，相当于支起枪支的枪架，这就使火炮可以调整倾斜度来提高命中率。"
 innovation_professional_officers: "职业军官"
 innovation_professional_officers_desc: "在战场上，训练和作战经验一直有着显著的价值。随着火药的到来以及因其他步兵武器所产生的战术变化，对于那些能够熟练使用新式武器的部队有很大的需求。"
 innovation_early_modern_military: "近代化军事"
 innovation_early_modern_military_desc: "中世纪末期，陆军向着职业化、组织化发展。更先进的体制被建立，以用来更好地支持由征召兵与职业军人组成的混编部队，这种搭配正逐渐成为战场上的主流。步兵正缓慢而稳定地缩减着与骑兵的战力差距。"
 innovation_standardized_pikes: "标准化长枪"
 innovation_standardized_pikes_desc: "长枪易于制作，但欲令其发挥最大作用，需整编部队挥舞的长枪有着相仿的长度和枪刃。"
 innovation_musketmen: "火枪兵"
 innovation_musketmen_desc: "轻便而可靠的火绳枪能够取代弓箭是由于三个主要因素——更好的穿甲能力、操作人员更容易训练以及不依赖使用者的力量大小。"
 innovation_early_modern_administration: "近代化管理"
 innovation_early_modern_administration_desc: "很明显，雇佣受过教育的官员的行政机关并采用更加集权的官僚体制对于建立一个早期现代化国家是十分必要的。"
 innovation_land_clearance: "土地清理"
 innovation_land_clearance_desc: "大范围的林地可以有效地作为柴火收集地和狩猎场使用，但如果我们把树林清理干净，我们可以用农田取而代之。"
 innovation_constitution: "宪法"
 innovation_constitution_desc: "一个被称为宪政主义的全新哲学概念逐渐兴起，它主张用法律来限制政府权力。这是一个很有趣的想法，但我不认为它会被广泛接受。"
 innovation_absolute_rulership: "专制统治"
 innovation_absolute_rulership_desc: "有很多人都想要在政府中得到一个职位，但事实上大多数人都希望在没有付出努力的情况下得到这一切。现在一股专制主义思想在兴起，我们可以借此除掉那些寄生虫并独揽大权。"
 innovation_textile_manufactory: "纺织工场"
 innovation_textile_manufactory_desc: "纺织品的出现时间已不可考。1589年织袜机的发明是迈向工业革命的第一步以及机械化生产的开端。这项发明将提高纺织产量。"
 innovation_renaissance_thought: "文艺复兴思想"
 innovation_renaissance_thought_desc: "贵族寡头统治社会的观念从罗马时代就已经出现，并且在某些地方很受欢迎。现在，这个观念重新在那些与之有关的阶层中兴起。"
 innovation_separation_of_powers: "权力分立"
 innovation_separation_of_powers_desc: "一部关于政治理论的匿名论著出现在人们的视野，虽有各方压力对其打压，但仍未能阻止它在世界范围的传播。书中分析了政府形成的本质——无论是君主制，独裁制，还是民主制。该书还提出应将行政权，立法权，司法权严格地分离开来。"
 innovation_spanish_square: "西班牙方阵"
 innovation_spanish_square_desc: "西班牙方阵的发明自然来自于长矛和射击编队。它的核心是一个传统的长矛方阵。在方阵的四角都配备了一组火绳枪兵。它保留了传统长矛方阵的威力并通过火绳枪兵增强了火力。"
 innovation_new_world: "新世界"
 innovation_new_world_desc: "更远处还有什么呢？……除了显然的财富与荣誉之外。"
 innovation_the_mughals: "莫卧儿"
 innovation_the_mughals_desc: "莫卧儿帝国是一个强大的土耳其–蒙古穆斯林国家，于16世纪初由帖木儿的王子同时也是帖木儿大帝的后裔巴布尔建立。在18世纪初的鼎盛时期，该帝国几乎控制了整个印度次大陆。"
 unlock_absolute_control_contract: "该革新启用绝对控制封臣契约。"
 unlock_harsh_taxation_contract: "该革新启用严峻征税封臣契约。"
 culture_this_equal: "该文化不允许使用此选项！"