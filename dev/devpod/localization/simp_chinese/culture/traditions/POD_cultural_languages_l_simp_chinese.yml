l_simp_chinese:
 language_enochian_name: "以诺语"
 language_ghemalish_name: "该玛尔语"
 language_punic_name: "布匿语"
 language_coptic_name: "科普特语"
 language_ancient_egyptian_name: "古埃及语"
 language_kaja_name: "鬼书"
 language_domari_name: "多姆语"
 language_kaja_desc: "古老的、异常复杂的[Glossary('万仙','game_concept_kuei_jin_desc')]表意文字。"
 language_spring_name: "春语"
 language_spring_desc: "春之王廷会讲一种音调语言，这交流方式既依赖于音调和声调，又依赖于实际的文字。这语言听起来很像唱歌和哼唱，此外还有听起来很优雅、很动听的词语。当书写时，春之王廷的语言看起来很像错综复杂的分层螺旋和圆形蜘蛛网。"
 language_summer_name: "夏语"
 language_summer_desc: "夏之一族使用一种——与任何人类或妖精语言相比——词汇量还要大的语言；它以几乎对每一个可能的物体或概念都有数个词而闻名。当说话时，它是一种快速发出的简短而尖锐的音节。当书写时，它在表面上看起来与人类语言相似（横着书写），虽然哪怕粗略地看了一眼，也能发现其口语有数百个字母，且没有标点符号。"
 language_autumn_name: "秋语"
 language_autumn_desc: "秋妖精会一种小声的语言，用手势来标点和转折。说话者的情绪通过动作的速度和清晰度来传达，从放松或疲惫时平静、缓慢的手势，到愤怒时切割般、锯齿般的手势；实际上，可以在不发出声音的情况下进行整个对话。书写时，这种语言显示为粗细不一的弧形斜线。"
 language_winter_name: "冬语"
 language_winter_desc: "冬之王廷的语言听起来像是动物般的咕哝声、嚎叫声、咆哮声和吼叫声的组合。冬妖精之间的谈话很容易被误认为是几只大型掠食动物之间的争斗，表现出口语的大量词汇量。这语言在书写时由大量的象形文字组成，有成千上万的单词，每个单词都由一个独特的符号代表。"
 language_ancient_arcadian_name: "古阿卡迪亚语"
 language_ancient_arcadian_desc: "四季王廷语言的前身似乎是一种难以破译的书面语言。它优雅的文字被刻在水晶堡垒的墙壁上。到目前为止，还没有学者能够对这种文字做出任何注解。它可能包含一些秘密，例如妖精的起源和他们在这个世界上的真正目的。"