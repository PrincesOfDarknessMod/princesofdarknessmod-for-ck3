l_simp_chinese:
 legend_chronicle_mithras_chronicle:0 "不朽的太阳神"
 legend_chronicle_mithras_chronicle_desc:0 "永恒之王密特拉的故事"
 mithras_chronicle_opening:0 "A God first worshiped by the ancient Persians, Mithras (or Mithra as He was known to them) ruled over the first tribes of men in the Middle East as a firm but fair ruler. Only appearing at night, Mithra devoted his time during the day to chase the night away and bring the glory of the Sun to his faithful followers.\nVenerated as the Sun God, Mithra became a deity of covenants, truth, oath and justice."
 mithras_chronicle_motivation:0 "Mithras' perfect rule seemed destined to last forever until the coming of another deity, Kemintiri of Egypt. Smitten to have finally found his equal, Mithras invited her to rule by his side. The Sun God offered his friendship too soon however and Kemintiri committed a terrible betrayal, robbing Mithras of his heir and his people of their God. The Sun set over Persia as the Lord of Light fell into despair."
 mithras_chronicle_famous_deed:0 "密特拉的悲伤将在罗马人的到来中结束。对这个好战的民族产生浓厚兴趣的密特拉显现真身，见此罗马人跪倒在地，拥抱他们的新神，并称他为屠牛者。在新信众的驱使下，密特拉选择率领他们作战，有一段时间，世界属于他。"
 mithras_chronicle_extra_deed:0 "The blessed reign of the Sun God over the Romans came to an end when a rival religion, Christianity, started making headway among the less warlike of the Roman people, a group that Mithras had so far dismissed in favor of the furious zeal of his devoted soldiers. Rather than risk a costly confrontation with this foe and endanger his flock, Mithras took his most faithful with him and embarked for Britain to recreate his utopia in this uncharted land."
 mithras_chronicle_conclusion:0 "Despite Christianity encroaching even in this new land, Britannia prospered under the Lord of Light's rule, ridding itself of the last barbaric followers of savage religions. Wisely choosing to work alongside the followers of the Cross instead of launching a costly war, Mithras is now subtly pulling the threads of fate that will transform Britannia from a brutish and unconquered land into a world power worthy of being his dominion."
 legend_chronicle_noddist_chronicle:0 "Caine : The First"
 legend_chronicle_noddist_chronicle_desc:0 "The tale of the first of your kind, Caine"
 noddist_chronicle_opening:0 "Caine is widely acknowledged by most as the first vampire.\nIn the earliest days of humankind, the son of Adam and Eve prepared a sacrificial offering to God, of his finest fruits and vegetables. His brother Abel also prepared a sacrificial offering, it being of the finest animals that he had raised. Either there was a dispute over whose offering was better, or God really favored Abel's over Caine's. The final result ended in Caine \"sacrificing\" Abel on the altar, his brother being the \"finest\" offering he could give to the almighty, as he loved nothing more than him.\nAs punishment, Cain's father Adam cursed him with a brand upon his flesh, and cast him out to wander in darkness."
 noddist_chronicle_motivation:0 "Roaming the Land of Nod, Caine encountered Lilith. She noticed a swirling stain in the air around him; a mark of some dark, unfathomable power: murder. He possessed the power to kill higher beings — not to hunt as Adam had, but to kill as had Jehovah.\nShe was amazed, for he bore no signs of godhood, but wandered in the dust like a lesser beast. Seeing that he was cold and hungry, she welcomed Caine into the warmth of her home. Lilith identified herself as the First Woman, the original wife of Caine's father. After staying with her for some time, the two became lovers."
 noddist_chronicle_famous_deed:0 "After Caine partook of Lilith's blood, he wad visited by three angels in a vision. These angels, who were agents of God, each offered Caine a chance to repent for the murder of his brother Abel, but Caine rebuffed them out of pride, seeing his actions as justified.\nMichael, when denied, cursed Caine and his childer to fear his living flame like no other.\nRaphael cursed Caine and his childer to fear the dawn, as the sun's rays would burn like Michael's holy fire.\nUriel then cursed Caine and his childer to cling to the Darkness, drink only blood, eat only ashes, and be frozen at the point of death, cursed so that all they touched would crumble into nothing.\nA fourth angel, Gabriel, then appeared to offer the way of Golconda, the only way to \"light\", by the mercy of God."
 noddist_chronicle_extra_deed:0 "After this experience, Caine became officially \"Awakened\", possessing the following Disciplines: Celerity, Potence, Fortitude, Obfuscate, Dominate, Presence, Protean, Animalism, and Auspex. Caine then became aware of the Path of Blood, the Final Path from which all paths stem. And with all these powers, he broke his bond with Lilith and left her in the land of Nod."
 noddist_chronicle_conclusion:0 "Caine continued to wander the Land of Nod in loneliness, the memory of his sin drowning him in sorrow. It was many ages before he decided to be amongst mortal men again. His powers and his mark were well known to mortal men, and some even worshiped him as a god.\nFinally, Caine settled in a small agricultural community, named Ubar. It was here, in this First City, that he became known as the “Dark Father.”"
 legend_chronicle_lilim_chronicle:0 "莉莉丝：第一位女人"
 legend_chronicle_lilim_chronicle_desc:0 "第一位女人莉莉丝的故事"
 lilim_chronicle_opening:0 "According to most early myths, Lilith was the first wife of Adam, his co-equal and counterpart in power and wisdom. She split from the \"primordial man\", and as punishment God (also known as Jehovah) banished her from Eden, replacing her by making Eve.\nFurthermore, God cursed Lilith to never know the love of another. In turn each being that Lilith truly loved and cared for, could never really love her in return.\nSome Lilith's worshippers claim that Adam attempted to rape Lilith – or he may have actually done so – which prompted Lilith to flee from Eden instead of being banished."
 lilim_chronicle_motivation:0 "According to the Bahari, however, Lilith enjoyed an extensive sequence of affairs with both Jehovah and Lucifer, who were gods with their own Gardens. Lucifer was said to have given Lilith the \"cloak of night\" as a gift after she had wandered the lands outside of Eden, scorched and tortured. She plucked stars from her cloak to use as seeds to create her first garden, Elona, the Garden of Hope."
 lilim_chronicle_famous_deed:0 "Some stories state that Lilith traveled and witnessed the other gardens, but eventually found her way back to Jehovah's garden. Lucifer was sent to block her entry, however, she promised that she only wished to gather information to make her own garden, and would not take anything. Lucifer agreed. While Lilith was in the garden, she transformed into a snake and saw the ignorant Eve, who knew nothing of the world. She gave Eve the fruit, which caused the fall of man, and gave Lilith her curse."
 lilim_chronicle_extra_deed:0 "Lilith and Lucifer traveled to the edge of the Endless Sea, where they founded D'hainu, the Garden of Renewal.\nEventually abandoned by Jehovah and Lucifer, she met the wandering banished descendant of her ex-husband, the First Murderer (as named in the Bible) Caine. She took Caine in, tended to his injuries, fed and healed him, and taught him secret wisdom – the seeds of which blossomed into the vampiric Disciplines."
 lilim_chronicle_conclusion:0 "And how does he repay her? By abandoning her as well, to wander forever apart, mother of monsters and thief of infant breaths. Caine goes on to found Enoch and Lilith leaves the scene. She is said, however, to have created a third garden, Ba'hara, the Garden of Sorrows, from which she will prepare for Gehenna."
 legend_chronicle_setite_chronicle:0 "杜阿特之主，赛特"
 legend_chronicle_setite_chronicle_desc:0 "伟大的解放者赛特的故事。"
 setite_chronicle_opening:0 "据赛特忠实的信徒所说，他出生在埃及的尼罗河畔，距今已有近 7000 年的历史。赛特是一位伟大的猎人和战士，能与之匹敌的只有他的兄长奥西里斯。他们都是统一了上下埃及的酋长拉的孙辈。"
 setite_chronicle_motivation:0 "The death of Set's parents, Geb and Nut, was ordered by Ra who felt that they had betrayed him for having additional offspring. Ra felt threatened by royal bloodlines and commanded that they must not bear children. Set was anguished by the order of his parent's deaths, and his voice in the matter subjected him to banishment. Osiris, on the other hand, possibly out of fear, expressed loyalty to Ra and became heir to the throne."
 setite_chronicle_famous_deed:0 "拉死后，奥西里斯控制了王国，神化了他的祖父，并将其奉为神灵。赛特回到哥哥奥西里斯身边，希望能够和解；然而，他在位的哥哥却继续执行放逐令。此后，赛特化名为“苏特赫”，北上亚述。"
 setite_chronicle_extra_deed:0 "仍在继续的传说中，赛特回到埃及，杀死了国王奥西里斯和他的儿子荷鲁斯。赛特将埃及据为己有并独揽大权，而他的目的也许（也许不是）是为了将人类从拉所强加的法律束缚中解放出来。无论真相如何，荷鲁斯死而复生，变成了木乃伊，并为父亲的毁灭复仇，将赛特赶下埃及王位，开始了一场持续千年的征伐。"
 setite_chronicle_conclusion:0 "While most Setites agree that Set was a vampire at some point (perhaps until he ascended to Godhood), there are some who reject the notion that their \"Founder\" was ever mortal, or even embraced. In this interpretation, Osiris, Set and Ra were all truly Gods.\nAnother point of contention arises regarding the role of the \"Serpent of Chaos\", Apep (or Apophis). Some claim that it was killed by Set (and perhaps absorbed into his being) while other claim that it is instead an ally (or perhaps even master) of their Founder. Both interpretations can hardly coexist and have caused a great deal of theological friction inside the Followers of Set."