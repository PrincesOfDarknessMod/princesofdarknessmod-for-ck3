l_simp_chinese:
 legend_chronicle_mithras_chronicle:0 "不朽的太阳神"
 legend_chronicle_mithras_chronicle_desc:0 "唯一且永恒之王密特拉的故事"
 mithras_chronicle_opening:0 "密特拉最早是古波斯人崇拜的神，他是中东地区最早的人类部落的统治者，为人刚正不阿。密特拉只在夜间出现，白天则专门驱赶黑夜，为他忠实的追随者带来太阳的光辉。\n密特拉被尊为太阳神，成为契约、真理、誓言和正义之神。"
 mithras_chronicle_motivation:0 "密特拉完美的统治似乎注定要永远持续下去，直到另一位神灵——埃及的刻茉媞里降临。密特拉为终于找到了与自己平起平坐的神灵而欣喜若狂，他邀请她与自己并肩作战。然而，太阳神的友谊来得太早，刻茉媞里犯下了可怕的背叛之罪，她夺走了密特拉神的继承人，也夺走了密特拉神的子民。太阳落在波斯的上空，光之主陷入了绝望。"
 mithras_chronicle_famous_deed:0 "密特拉的悲伤将在罗马人的到来中结束。对这个好战的民族产生浓厚兴趣的密特拉显现真身，见此罗马人跪倒在地，拥抱他们的新神，并称他为屠牛者。在新信众的驱使下，密特拉选择率领他们作战，有一段时间，世界属于他。"
 mithras_chronicle_extra_deed:0 "太阳神对罗马人的幸福统治结束了，因为一个敌对的宗教——基督教，开始在罗马人中不那么好战的人群中流行起来。密特拉没有冒险与这个敌人进行代价高昂的对抗，也没有危及他的信徒，而是带着他最忠实的信徒，踏上了前往不列颠的旅程，在这片未知的土地上重建他的乌托邦。"
 mithras_chronicle_conclusion:0 "尽管基督教甚至在这片新土地上肆虐，但不列颠在光之主的统治下繁荣昌盛，摆脱了野蛮宗教的最后一批野蛮信徒。密特拉明智地选择与基督教徒并肩作战，而不是发动一场代价高昂的战争，他现在正巧妙地牵引着命运之线，将不列颠从一片野蛮和未被征服的土地转变为一个值得他统治的世界强国。"
 legend_chronicle_noddist_chronicle:0 "该隐：初代"
 legend_chronicle_noddist_chronicle_desc:0 "你族类中的第一位的故事，该隐"
 noddist_chronicle_opening:0 "该隐被大多数人公认为第一个吸血鬼。\n在人类诞生之初，亚当和夏娃的儿子亚伯用最好的水果和蔬菜为上帝准备了祭品。他的兄弟亚伯也准备了祭品，是他饲养的最好的动物。要么是在谁的祭品更好的问题上发生了争执，要么就是上帝真的偏爱亚伯的祭品而不是该隐的祭品。最后的结果是该隐在祭坛上“献祭”了亚伯，他的弟弟是他能献给全能神的“最好”祭品，因为他爱亚伯胜过爱他自己。\n作为惩罚，该隐的父亲亚当诅咒他在肉体上留下烙印，并把他扔到黑暗中流浪。"
 noddist_chronicle_motivation:0 "在挪得漫游时，该隐遇到了莉莉丝。她注意到该隐周围的空气中有一种漩涡状的污点，那是某种黑暗、深不可测的力量留下的痕迹：谋杀。他拥有杀死高等生物的力量——不是像亚当那样狩猎，而是像神那样杀人。\n她很惊讶，因为他没有神性的迹象，而是像一头低等的野兽一样在尘土中游荡。看到他又冷又饿，她欢迎该隐进入她温暖的家中。莉莉丝自称是第一位女性，该隐父亲的原配妻子。在她那呆了一段时间后，两人成了恋人。"
 noddist_chronicle_famous_deed:0 "该隐吸食了莉莉丝的鲜血后，三个天使在幻觉中拜访了他。这些天使是上帝的代理人，他们分别给了该隐一个机会，让他为杀害兄弟亚伯忏悔，但该隐出于自尊拒绝了他们，认为自己的行为是正当的。\n米迦勒在遭到拒绝后，诅咒该隐和他的孩子们惧怕他的火焰。\n拉斐尔诅咒该隐和他的子孙惧怕黎明，因为太阳的光芒会像米迦勒的圣火一样燃烧。\n乌列尔接着诅咒该隐和他的孩子们拘束于黑暗，只喝鲜血，只吃灰烬，被冻结在死亡的边缘，诅咒的他们所接触的一切都将化为乌有。\n第四位天使加百列随后出现，以上帝的仁慈提供了通往 “光明”的唯一道路——戈尔康达之路。"
 noddist_chronicle_extra_deed:0 "在这次经历之后，该隐正式成为了“觉醒者”，拥有了以下能力：迅捷术、蛮力术、坚韧术、混淆术、支配术、威仪术、变形术、兽性术、观占术。然后，该隐意识到了“血之道途”，即所有道途都源于此的最终道途。凭借这些力量，他解除了与莉莉丝的血缚，将她留在了挪得。"
 noddist_chronicle_conclusion:0 "该隐继续在挪得孤独地游荡，他的罪恶记忆将他淹没在悲伤之中。许多年后，他才决定再次回到凡人中间。他的力量和印记为凡人所熟知，有些人甚至将他奉若神明。\n最后，该隐在一个名叫乌巴的小型农业城邦定居下来。就在这座第一城，他被称为“黑暗之父”。"
 legend_chronicle_lilim_chronicle:0 "莉莉丝：第一位女人"
 legend_chronicle_lilim_chronicle_desc:0 "第一位女人莉莉丝的故事"
 lilim_chronicle_opening:0 "根据大多数古老神话，莉莉丝是亚当的第一任妻子，是亚当在力量和智慧上的平等伙伴。她与“原人”分离，作为惩罚，上帝（又称耶和华）将她逐出伊甸园，并创造了夏娃取而代之。\n此外，上帝还诅咒莉莉丝永远无法获得他人的爱。反过来，莉莉丝真正爱过和关心过的每一个生命，都无法真正回报她的爱。\n一些莉莉丝的崇拜者声称，亚当曾试图强奸莉莉丝——或者他可能真这样做了——这促使莉莉丝逃离伊甸园，而不是被放逐。"
 lilim_chronicle_motivation:0 "不过，根据巴哈里的说法，莉莉丝与耶和华和路西法都有过一系列风流韵事，他们都是拥有自己花园的神。据说路西法送给莉莉丝一件“黑夜斗篷”作为礼物，因为她在伊甸园外的土地上游荡，饱受炙烤和折磨。她从斗篷中摘出星星作为种子，创造了她的第一个花园——希望花园伊洛纳。"
 lilim_chronicle_famous_deed:0 "有些故事说，莉莉丝旅行并目睹了其他花园，但最终还是回到了耶和华的花园。路西法被派去阻止她进入，但她答应说，她只想收集信息来建造自己的花园，不会带走任何东西。路西法同意了。当莉莉丝在花园里时，她变成了一条蛇，看到了对世界一无所知的无知夏娃。她给了夏娃禁果，导致了人类的堕落，也给了莉莉丝诅咒。"
 lilim_chronicle_extra_deed:0 "莉莉丝和路西法前往无尽之海的边缘，在那里创立了达海努，即复兴之园。\n自被耶和华和路西法抛弃后，莉莉丝遇到了流浪的被放逐者，也就是她前夫的后裔，圣经中第一个杀人犯，该隐。莉莉丝收留了该隐，照料他的伤势，喂养和治愈他，并教授他秘密的智慧——这些智慧的种子最终开花结果成为吸血鬼的血律。"
 lilim_chronicle_conclusion:0 "他是如何报答莉莉丝的呢？通过再次抛弃她，让她永远孤独地流浪，成为怪物之母和婴息盗取者。该隐接着建立了以诺城，而生活当中再也没有出现过莉莉丝的身影。据说莉莉丝创建了第三个花园，即悲伤之园巴哈拉，她将在那里为火焚末日做准备。"
 legend_chronicle_setite_chronicle:0 "杜阿特之主，赛特"
 legend_chronicle_setite_chronicle_desc:0 "伟大的解放者赛特的故事。"
 setite_chronicle_opening:0 "据赛特忠实的信徒所说，他出生在埃及的尼罗河畔，距今已有近 7000 年的历史。赛特是一位伟大的猎人和战士，能与之匹敌的只有他的兄长奥西里斯。他们都是统一了上下埃及的酋长拉的孙辈。"
 setite_chronicle_motivation:0 "赛特的父母盖布和努特是被拉下令杀死的，拉认为他们背叛了他，因为他们有了更多的后代。拉感到王室血统的威胁，命令他们不得生育。赛特对父母的死亡命令感到愤怒，他在这件事上的发言使他遭到放逐。另一方面，奥西里斯可能出于恐惧，表达了对拉的忠诚，成为了王位继承人。"
 setite_chronicle_famous_deed:0 "拉死后，奥西里斯控制了王国，神化了他的祖父，并将其奉为神灵。赛特回到哥哥奥西里斯身边，希望能够和解；然而，他在位的哥哥却继续执行放逐令。此后，赛特化名为“苏特赫”，北上亚述。"
 setite_chronicle_extra_deed:0 "仍在继续的传说中，赛特回到埃及，杀死了国王奥西里斯和他的儿子荷鲁斯。赛特将埃及据为己有并独揽大权，而他的目的也许（也许不是）是为了将人类从拉所强加的法律束缚中解放出来。无论真相如何，荷鲁斯死而复生，变成了木乃伊，并为父亲的毁灭复仇，将赛特赶下埃及王位，开始了一场持续千年的征伐。"
 setite_chronicle_conclusion:0 "虽然大多数赛特之子都认为赛特曾是吸血鬼（也许直到他升格为神），但也有一些人拒绝接受他们的“始祖”曾经是凡人，甚至是被初拥过的说法。根据这解释，奥西里斯、赛特和拉都是真正的神。\n另一个争议点是关于“混沌之蛇”阿佩普（或阿波菲斯）。有人说它是被赛特杀死的（也许被赛特吸收了），也有人说它是始祖的盟友（也许甚至是主人）。这两种解释难以共存，在赛特信徒内部引起了很大的神学摩擦。"
 legend_danu:0 "[GetDynastyByID( 'POD_fae_dynasty_tuatha_de_danaan' ).GetBaseName]"
 legend_danu_desc:0 "[GetScriptedCharacterByHistoryID('POD_fae_character_1000').GetFirstName], also known as Dana, was the mother of the Tuatha de Danaan. The Tuatha de Danaan are rumored to have given Humanity the ability to dream. Humanity, in turn, gave the Tuatha the raw material needed to shape the Age of Legends. From the Tuatha, all other kiths sprang forth and populated the Dreaming. Danu asks that her Children hold a celebrations in her honor on the solstices and the equinoxes."
 legend_balor:0 "The Blood of [ancestor.GetFirstNameNoTooltip]"
 legend_balor_desc:0 "In the first battle between the fomorians and the [GetDynastyByID( 'POD_fae_dynasty_tuatha_de_danaan').GetBaseName], a mighty warlord named [GetScriptedCharacterByHistoryID( 'POD_fae_character_09').GetFirstNameNicknamed] was chosen to lead the fomorians in battle. In his youth, Balor, who had but one eye, had spied on a solemn rite he was forbidden to witness. As punishment, the Dreaming cursed him so that his eye became a thing of terror. Whenever it was opened, a terrible red light issued from it, slaying all it gazed on. As prophesized, he was slain by his own grandson [GetScriptedCharacterByHistoryID( 'POD_fae_character_12').GetFirstNameNicknamed]"
 legend_varich:0 "The Child of the Sun and the Moon"
 legend_varich_desc:0 "Long ago, before dreams were shattered, [GetScriptedCharacterByHistoryID('POD_fae_character_19').GetFirstName] walked the northern lands. He was the bright and handsome son of Miesiac; known as the silver-haired, dark-eyed Moon; and Dazbóga the Sun, his proud mother, with golden braids coiling down to her feet and brilliant sapphire eyes."
 legend_aesin:0 "The Æsir and the Vanir"
 legend_aesin_desc:0 "The [GetDynastyByID( 'POD_fae_dynasty_aesin' ).GetBaseName] descend from the gods of Asgard, the Æsir and the Vanir. Some even claim descent from such notables as [GetScriptedCharacterByHistoryID('POD_fae_character_1024').GetFirstName] and [GetScriptedCharacterByHistoryID('POD_fae_character_1025').GetFirstName]"
 legend_mathonwy:0 "[ancestor.GetFirstNameNoTooltip]'s Legacy"
 legend_mathonwy_desc:0 "King of Gwynedd, Lord of Caer Dathal and a great sorcerer of the Tuatha de Danaan. The story of the Mathonwy is the fourth of the Four Branches of the Mabinogi."
 legend_eshu:0 "[ancestor.GetFirstNameNicknamed]"
 legend_eshu_desc:0 "After the great God Olorun, the greatest Orisha, conceived of the world and had his two sons, Obatala and Orunmila, design and order it, he sent another Orishas named [ancestor.GetFirstNameNoTooltip], his linguist and messenger, to collect sacrifices for him. Eshu is the orisha with authority over roads and gateways and who loves to cause mischief. He is neither good nor evil, he is simply himself. He plays tricks because it is his way. The good learn from his tricks and the wicked suffer. While on earth he also sired many children who would later become the Eshu, sharing his name and duties. His progeny, unfortunately, happened to steal his name for themselves, if without malice, and when Eshu heard that the mortals were treating his kin as him he new he had to punish his wayward children or others would loose their names as well and the world would be undone. He did this even though he was just a little proud of all his children had accomplished and how much they had learned from him. So, after observing to come up with the best punishment, he called all his children together and told them a great and powerful secret and made them his messengers to the world, commanding them with weighty words to teach their children to follow his ways as well. Then he flew back into the sky laughing. The joke and punishment? He got his kids to do his job for him and to enjoy it."