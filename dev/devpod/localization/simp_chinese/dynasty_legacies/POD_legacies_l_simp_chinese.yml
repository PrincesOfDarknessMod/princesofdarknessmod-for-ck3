 nagaraja_legacy_4_name: "饿殍"
 nagaraja_legacy_5_name: "世界终将被吞噬"
 impundulu_legacy_track_name: "魔蛇鹫传承"
 impundulu_legacy_track_desc: "魔蛇鹫血系传承的知识与传统，维系着生与死之间的誓约。"
 impundulu_legacy_1_name: "生与死的联结"
 impundulu_legacy_2_name: "行走于两界之人"
 impundulu_legacy_3_name: "碑冢之主"
