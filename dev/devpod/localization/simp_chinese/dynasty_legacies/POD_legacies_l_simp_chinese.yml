 ba_mummy_legacy_track_name: "巴"
 ba_mummy_legacy_track_desc: "让木乃伊在死后恢复活力的精神能量，巴的积累对木乃伊的持续生存至关重要。"
 ba_mummy_legacy_1_name: "智慧之巴"
 ba_mummy_legacy_2_name: "英勇之巴"
 ba_mummy_legacy_3_name: "职责之巴"
 ba_mummy_legacy_4_name: "革新之巴"
 ba_mummy_legacy_5_name: "胜利之巴"
 ba_mummy_legacy_1_perk: "死而复生现在将花费的虔诚#P -500#!。（基本的复活花费为3000虔诚，且每个罪恶特质都将让其翻倍。)"
 psyche_mummy_legacy_track_name: "真灵"
 psyche_mummy_legacy_track_desc: "让木乃伊在死后恢复活力的精神能量，真灵的积累对木乃伊的持续生存至关重要。"
 psyche_mummy_legacy_1_name: "睿智真灵"
 psyche_mummy_legacy_2_name: "英勇真灵"
 psyche_mummy_legacy_3_name: "职责真灵"
 psyche_mummy_legacy_4_name: "新生真灵"
 psyche_mummy_legacy_5_name: "真灵真灵"
 psyche_mummy_legacy_1_perk: "#flavor 历经千百世圆满人生，既得慧识加身，亦承其重。#!"
 psyche_mummy_legacy_2_perk: "解锁[GetMaA('hoplites').GetName]与[GetMaA('companion_cavalry').GetName]作为[men_at_arms|E]。\n#flavor 上古英灵曾应召而至，今将再度显圣。#!"
 psyche_mummy_legacy_3_perk: "#flavor 岁月积淀伴随重任，唯担纲者方能屹立。#!"
 psyche_mummy_legacy_4_perk: "#flavor 冥河险恶，然智者于每次渡越中参悟真谛。#!"
 psyche_mummy_legacy_5_perk: "如果拥有相应DLC则解锁[GetActivityType('activity_chariot_race').GetName]。\n#flavor 古竞技之魂纵经演变，其神髓永存。我等亘古之灵，岂容其湮没？#!"
 pharaoh_mummy_legacy_track_name: "埃及法老"
 pharaoh_mummy_legacy_track_desc: "木乃伊之乡也是最伟大的国王之乡，他们的遗产对那些真正不朽的人来说是永存的。"
 pharaoh_mummy_legacy_1_name: "克利奥帕特拉的传承"
 pharaoh_mummy_legacy_2_name: "托勒密的传承"
 pharaoh_mummy_legacy_3_name: "拉美西斯二世的传承"
 pharaoh_mummy_legacy_4_name: "埃赫那吞的传承"
 pharaoh_mummy_legacy_5_name: "胡夫的传承"
 pharaoh_mummy_legacy_1_perk: "#flavor 这位伟大的女王仅凭她的魅力就几乎推翻了一个新生的帝国。#!"
 pharaoh_mummy_legacy_2_perk: "#flavor 托勒密来自远方，他接纳了埃及，就像接纳自己的故乡一样。#!"
 pharaoh_mummy_legacy_3_perk: "#flavor 拉神之子指挥着埃及最强大的军队，很少有人能够反对他强大的野心。#!"
 pharaoh_mummy_legacy_4_perk: "#flavor 无论好坏，没有一位古埃及人会忘记埃赫那吞，那个蔑视众神的人。#!"
 pharaoh_mummy_legacy_5_perk: "#flavor 通过在吉萨大金字塔中永远安息，胡夫找到了自己的不朽。#!"
 wutian_mummy_legacy_track_name: "诸子百家"
 wutian_mummy_legacy_track_desc: "中国的伟大思想在他们离去后依然长久照亮世界。"
 wutian_mummy_legacy_1_name: "孔子的智慧"
 wutian_mummy_legacy_2_name: "孙子的智慧"
 wutian_mummy_legacy_3_name: "鬼谷子的智慧"
 wutian_mummy_legacy_4_name: "墨子的智慧"
 wutian_mummy_legacy_5_name: "老子的智慧"
 wutian_mummy_legacy_1_perk: "#flavor 孔子的智慧教导我们要尊敬长辈。#!"
 wutian_mummy_legacy_2_perk: "#flavor 孙子的军事思想将继续指引我们前进。#!"
 wutian_mummy_legacy_3_perk: "#flavor 鬼谷子的多才多艺可让我们更有效地管理军队。#!"
 wutian_mummy_legacy_4_perk: "#flavor 墨子激励我们成为最好的自己。#!"
 wutian_mummy_legacy_5_perk: "#flavor 老子教我们顺其自然。#!"
 mortuary_cult_mummy_legacy_track_name: "殓祭密教"
 mortuary_cult_mummy_legacy_track_desc: "殡葬崇拜滋养着先祖的灵。祭司们为了他们的利益而进行日常仪式，并得到回报的恩惠。"
 mortuary_cult_mummy_legacy_1_name: "侍死舞者"
 mortuary_cult_mummy_legacy_2_name: "净化祭司"
 mortuary_cult_mummy_legacy_3_name: "诵经祭司"
 mortuary_cult_mummy_legacy_4_name: "殡葬祭司"
 mortuary_cult_mummy_legacy_5_name: "神的仆人"
 mortuary_cult_mummy_legacy_1_perk: "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_1_modifier').GetNameWithTooltip][modifier|E]。\n\n#flavor 侍死舞者通过音乐和舞蹈为神灵服务。他们与妇女和生育女神哈索尔相关。#!"
 mortuary_cult_mummy_legacy_2_perk: "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_2_modifier').GetNameWithTooltip][modifier|E]。\n\n#flavor 纯净者是最常见的祭司类型，他们进行密教的日常维护。#!"
 mortuary_cult_mummy_legacy_3_perk: "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_3_modifier').GetNameWithTooltip][modifier|E]。\n\n#flavor 诵经祭司通过诵读咒语和向墓地中的死者提供祭品来滋养杜阿特的灵魂。#!"
 mortuary_cult_mummy_legacy_4_perk: "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_4_modifier').GetNameWithTooltip][modifier|E]。\n\n#flavor 殓葬师负责在将死者木乃伊化时，注意保持身体的完整性。#!"
 mortuary_cult_mummy_legacy_5_perk: "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_5_modifier').GetNameWithTooltip][modifier|E]。\n\n#flavor 大祭司关心死者的卡，允许其继续存在于杜阿特。#!"
