 seelie_romantic_legacy_track_name: "喜乐廷浪漫传承"
 seelie_romantic_legacy_track_desc: "浪漫传承是戚族在浪漫遭遇中表现出来的个性，特别是在宫廷爱情的私人或正式舞蹈中。"
 seelie_romantic_legacy_1_name: "浪漫传承是戚族在浪漫遭遇中表现出来的个性，特别是在宫廷爱情的私人或正式舞蹈中。"
 seelie_romantic_legacy_1_perk: "#flavor 你对你伴侣的情绪、愿望和欲望高度敏感。如果其不开心，你也不开心。#!"
 seelie_romantic_legacy_2_name: "亦爱亦友"
 seelie_romantic_legacy_2_perk: "解锁[GetScheme('befriend').GetTypeName][scheme|E]。\n#flavor 爱不仅仅是一种浪漫情感。如果一段关系的核心没有相互尊重和友谊，它就不是真正的爱情。#!"
 seelie_romantic_legacy_3_name: "天真无邪"
 seelie_romantic_legacy_3_perk: "#flavor 一点天真和单纯，仍然只看到爱的奇迹和美好的一面。大多数妖精通常会随着年龄的增长而脱离这传承，但并不总是如此。#!"
 seelie_romantic_legacy_4_name: "杂耍把戏"
 seelie_romantic_legacy_4_perk: "#flavor 你喜欢让你的恋人（和你自己）得到娱乐。爱是最大的快乐，应该充分享受。#!"
 seelie_romantic_legacy_5_name: "相爱相守"
 seelie_romantic_legacy_5_perk: "#flavor 你的爱是真正的，你渴望保护其免受世界上所有的弊病。这传承是出于高尚的意图，但可能令人窒息。#!"
 unseelie_romantic_legacy_track_name: "哀怒廷浪漫传承"
 unseelie_romantic_legacy_track_desc: "浪漫传承是戚族在浪漫遭遇中表现出来的个性，特别是在宫廷爱情的私人或正式舞蹈中。"
 unseelie_romantic_legacy_1_name: "争风吃醋"
 unseelie_romantic_legacy_1_perk: "你将根据你情人中的属性最高者获得一个给予每月威望的修正。\n#flavor 你是浪漫中的奥运选手。你用别人的情人的质量来评判别人，你知道他们也用同样的标准来评判你。你必须是世界上最强的情人，否则人生还有什么意义？#!"
 unseelie_romantic_legacy_2_name: "看破红尘"
 unseelie_romantic_legacy_2_perk: "#flavor 厌倦和厌世，你经常因出于习惯或害怕孤独而继续你的浪漫姿态。你已经降低了你的标准，因为你知道“真爱”只能在童话故事中找到。#!"
 unseelie_romantic_legacy_3_name: "为爱献躯"
 unseelie_romantic_legacy_3_perk: "#flavor 我如此努力地运作，使这段关系得以维持，而我得到的回报是什么？心痛！我没指望你能理解。#!"
 unseelie_romantic_legacy_4_name: "万花中过"
 unseelie_romantic_legacy_4_perk: "每有一[lover|E]叠加一层：[GetModifier( 'POD_gamester_modifier' ).GetNameWithTooltip|L]\n#flavor 爱情是一场盛大的牌局，充满了危险和刺激。你可能有一个配偶或许多配偶，但恋情必须得有不断的挑战和变化。#!"
 unseelie_romantic_legacy_5_name: "招蜂引谍"
 unseelie_romantic_legacy_5_perk: "#flavor 宫廷八卦和阴谋是你的食物和饮料。部分是攀附者，部分是欺骗者，你只对最了解谁对谁做什么感兴趣。#!"
 seelie_legacy_1_track_name: "喜乐廷传承"
 seelie_legacy_1_track_desc: "以生机勃勃的春日与骄阳似火的夏日之名，喜乐廷传承者更加强调集体与社区。"
 seelie_1_legacy_1_name: "人类主义"
 seelie_1_legacy_1_perk: "#flavor 你更加关注你的凡人生活，而不是你的妖精生活。#!"
 seelie_1_legacy_2_name: "捣蛋小鬼"
 seelie_1_legacy_2_perk: "#flavor 你喜欢开各种各样的玩笑和恶作剧。#!"
 seelie_1_legacy_3_name: "漂泊旅人"
 seelie_1_legacy_3_perk: "#flavor 你活在当下，随心而动。#!"
 seelie_1_legacy_4_name: "投其所好"
 seelie_1_legacy_4_perk: "#flavor 你的生活就是让别人开心。#!"
 seelie_1_legacy_5_name: "吟游诗人"
 seelie_1_legacy_5_perk: "诗人特质在宗族中变得更普遍。\n#flavor 比起别人，你更强烈的感受到了，不仅仅这个世界是美丽的，万物都是美丽的！#!"
 seelie_legacy_2_track_name: "喜乐廷传承"
 seelie_legacy_2_track_desc: "以生机勃勃的春日与骄阳似火的夏日之名，喜乐廷传承者更加强调集体与社区。"
 seelie_2_legacy_1_name: "社会牛虻"
 seelie_2_legacy_1_perk: "#flavor 你经常诚实的指出当权者的错误。#!"
 seelie_2_legacy_2_name: "花花公子"
 seelie_2_legacy_2_perk: "#flavor 你擅长宫廷礼仪，在骨子里是一个趋炎附势的人。#!"
 seelie_2_legacy_3_name: "战友同志"
 seelie_2_legacy_3_perk: "$PERK_CAN_SIGN_ALLIANCE$\n#flavor 你重视友谊胜过一切，并努力证明自己值得他人信任。#!"
 seelie_2_legacy_4_name: "宫廷廷臣"
 seelie_2_legacy_4_perk: "#flavor 社交是生活中唯一一个有意思的事情。#!"
 seelie_2_legacy_5_name: "执权摄政"
 seelie_2_legacy_5_perk: "#flavor 你是这个领地人格的化身，被选择为代表众人说话的人。#!"
 seelie_legacy_3_track_name: "喜乐廷传承"
 seelie_legacy_3_track_desc: "以生机勃勃的春日与骄阳似火的夏日之名，喜乐廷传承者更加强调集体与社区。"
 seelie_3_legacy_1_name: "下里巴人"
 seelie_3_legacy_1_perk: "#flavor 你是脚踏实地的老实人，对任何问题都能拿出解决办法。#!"
 seelie_3_legacy_2_name: "创作作者"
 seelie_3_legacy_2_perk: "#flavor 你一生的工作就是创作。#!"
 seelie_3_legacy_3_name: "抱负不凡"
 seelie_3_legacy_3_perk: "#flavor 生活就是不断的学习，你一直在努力提高自己。#!"
 seelie_3_legacy_4_name: "贤人智者"
 seelie_3_legacy_4_perk: "智者特质在宗族中变得更普遍。\n#flavor 你是顾问，智者，教师。#!"
 seelie_3_legacy_5_name: "艺术大家"
 seelie_3_legacy_5_perk: "选择一个生活方式特质，让其在宗族中变得更普遍。\n#flavor 无论你选择了什么领域，你都会成为大师。#!"
 seelie_legacy_4_track_name: "喜乐廷传承"
 seelie_legacy_4_track_desc: "以生机勃勃的春日与骄阳似火的夏日之名，喜乐廷传承者更加强调集体与社区。"
 seelie_4_legacy_1_name: "骑士侍从"
 seelie_4_legacy_1_perk: "#flavor 你的生活就是为了帮助和支持你现在的英雄为其事业而奋斗。#!"
 seelie_4_legacy_2_name: "游侠骑士"
 seelie_4_legacy_2_perk: "#flavor 你遵循古典骑士道，帮助需要帮助的人。#!"
 seelie_4_legacy_3_name: "圆桌骑士"
 seelie_4_legacy_3_perk: "#flavor 你是一个斗士，是一位勇敢的、坚强的健将亦或是英雄。#!"
 seelie_4_legacy_4_name: "乐善好施"
 seelie_4_legacy_4_perk: "#flavor 你努力帮助别人，做好事而不求回报。#!"
 seelie_4_legacy_5_name: "当世圣人"
 seelie_4_legacy_5_perk: "#flavor 你努力减轻别人的痛苦。#!"
 seelie_legacy_5_track_name: "喜乐廷传承"
 seelie_legacy_5_track_desc: "以生机勃勃的春日与骄阳似火的夏日之名，喜乐廷传承者更加强调集体与社区。"
 seelie_5_legacy_1_name: "娇嫩兰花"
 seelie_5_legacy_1_perk: "#flavor 你是一个幼稚者，被迫进入了这天地广阔而危机重重的世界。#!"
 seelie_5_legacy_2_name: "障目繁花"
 seelie_5_legacy_2_perk: "#flavor 对你来说，世界是一个充满了无尽的，儿童般的奇迹的地方。#!"
 seelie_5_legacy_3_name: "斯多葛派"
 seelie_5_legacy_3_perk: "#flavor 你很少表达自己的情绪。#!"
 seelie_5_legacy_4_name: "世外隐士"
 seelie_5_legacy_4_perk: "#flavor 比起朋朋党党，你更喜欢独自一人。#!"
 seelie_5_legacy_5_name: "阿卡迪亚"
 seelie_5_legacy_5_perk: "#flavor 你的妖精一面远重于你的人类一面。#!"
 unseelie_legacy_1_track_name: "哀怒廷传承"
 unseelie_legacy_1_track_desc: "以橙黄桔绿的秋日和暴雪肆虐的冬日之名，哀怒廷传承者往往是激情的个人主义者。"
 unseelie_1_legacy_1_name: "胆小懦弱"
 unseelie_1_legacy_1_perk: "#flavor 宁作安安懦夫，不当横死英雄。#!"
 unseelie_1_legacy_2_name: "心怀不满"
 unseelie_1_legacy_2_perk: "#flavor 什么都不能让你满意，你脾气又差，讲话难听，骂人更难听。#!"
 unseelie_1_legacy_3_name: "可悲可怜"
 unseelie_1_legacy_3_perk: "#flavor  你讨厌你自己，还以为谁都跟你一样也讨厌你。#!"
 unseelie_1_legacy_4_name: "厌世阴影"
 unseelie_1_legacy_4_perk: "#flavor 你跟行尸走肉一样，如同一个没有感情的梦游者，把世界看做一场永无止境的恐怖表演。#!"
 unseelie_1_legacy_5_name: "蠢傻愚昧"
 unseelie_1_legacy_5_perk: "#flavor 世界本无意义，所以你是小丑。#!"
 unseelie_legacy_2_track_name: "哀怒廷传承"
 unseelie_legacy_2_track_desc: "以橙黄桔绿的秋日和暴雪肆虐的冬日之名，哀怒廷传承者往往是激情的个人主义者。"
 unseelie_2_legacy_1_name: "下自由民"
 unseelie_2_legacy_1_perk: "#flavor 你粗鲁无礼、没教养、不讲礼貌、蔑视传统。#!"
 unseelie_2_legacy_2_name: "流氓无赖"
 unseelie_2_legacy_2_perk: "允许[raiding|E]他国[counties|E]以获取战利品。\n#flavor 当世界可以为你工作时，你为什么还要为自己的生计去忙活呢？#!"
 unseelie_2_legacy_3_name: "玩心骗徒"
 unseelie_2_legacy_3_perk: "#flavor 你诱惑别人去探索他们内心最黑暗的欲望。#!"
 unseelie_2_legacy_4_name: "蛮野如兽"
 unseelie_2_legacy_4_perk: "#flavor 你干倒了所有反对你的人。#!"
 unseelie_2_legacy_5_name: "罪魁祸首"
 unseelie_2_legacy_5_perk: "#flavor 你以铁腕统治你的组织。#!"
 unseelie_legacy_3_track_name: "哀怒廷传承"
 unseelie_legacy_3_track_desc: "以橙黄桔绿的秋日和暴雪肆虐的冬日之名，哀怒廷传承者往往是激情的个人主义者。"
 unseelie_3_legacy_1_name: "纨绔子弟"
 unseelie_3_legacy_1_perk: "#flavor 你是一个美丽的人，时尚界的沙皇。#!"
 unseelie_3_legacy_2_name: "虚荣骄傲"
 unseelie_3_legacy_2_perk: "#flavor 你觉得你是全世界最牛逼的人，你还想让全世界都知道你是最牛逼的人。#!"
 unseelie_3_legacy_3_name: "谜语连篇"
 unseelie_3_legacy_3_perk: "#flavor 你喜欢给别人讲谜语，而不是说直截了当的话。#!"
 unseelie_3_legacy_4_name: "邋里邋遢"
 unseelie_3_legacy_4_perk: "#flavor 内在大于外在，所以你表现得像个懒鬼来证明你内在多么深刻。#!"
 unseelie_3_legacy_5_name: "诡辩学士"
 unseelie_3_legacy_5_perk: "#flavor 你完全为了一己私利去分享知识。#!"
 unseelie_legacy_4_track_name: "哀怒廷传承"
 unseelie_legacy_4_track_desc: "以橙黄桔绿的秋日和暴雪肆虐的冬日之名，哀怒廷传承者往往是激情的个人主义者。"
 unseelie_4_legacy_1_name: "丑陋怪诞"
 unseelie_4_legacy_1_perk: "#flavor 你喜欢恶心别人。#!"
 unseelie_4_legacy_2_name: "妖邪魔物"
 unseelie_4_legacy_2_perk: "#flavor 你喜欢虐待别人。#!"
 unseelie_4_legacy_3_name: "不法之徒"
 unseelie_4_legacy_3_perk: "#flavor 规矩就是拿来打破的！宁让我负天下人，不让天下人负我！#!"
 unseelie_4_legacy_4_name: "分裂分子"
 unseelie_4_legacy_4_perk: "#flavor 你喜欢破坏社会组织，无论是政府、商团还是家族。#!"
 unseelie_4_legacy_5_name: "野生蛮荒"
 unseelie_4_legacy_5_perk: "#flavor 文明是浪费时间的。这里只有捕食、繁殖和丛林法则。#!"
 unseelie_legacy_5_track_name: "哀怒廷传承"
 unseelie_legacy_5_track_desc: "以橙黄桔绿的秋日和暴雪肆虐的冬日之名，哀怒廷传承者往往是激情的个人主义者。"
 unseelie_5_legacy_1_name: "潘多拉盒"
 unseelie_5_legacy_1_perk: "#flavor 你喜欢泄露别人的秘密，让他们陷入麻烦。#!"
 unseelie_5_legacy_2_name: "可怕鬼怪"
 unseelie_5_legacy_2_perk: "#flavor 只要笑得出来，你不在乎谁受伤。#!"
 unseelie_5_legacy_3_name: "享乐主义"
 unseelie_5_legacy_3_perk: "#flavor 追求快乐是你活着的理由。#!"
 unseelie_5_legacy_4_name: "浪荡放纵"
 unseelie_5_legacy_4_perk: "#flavor 你沉迷于物质体验和个人享受。#!"
 unseelie_5_legacy_5_name: "宿命论者"
 unseelie_5_legacy_5_perk: "#flavor  万物皆不完美，但是你喜欢指出万物的缺陷。#!"
 hunter_civil_legacy_track_name: "人类卫士"
 hunter_civil_legacy_track_desc: "怪物在街头游荡，劫掠无辜者的鲜血和灵魂。你是最后一道防线。"
 hunter_civil_legacy_1_name: "摧毁影响"
 hunter_civil_legacy_1_perk: "你的宫廷司祭现在能更快转化省份。\n#flavor 你很清楚该从哪里下手，铲除他们阴险的邪教组织。#!"
 POD_FASTER_COUNTY_CONVERSION_DESC: "宗族传承"
 hunter_civil_legacy_2_name: "人类唯一"
 hunter_civil_legacy_2_perk: "#flavor 你不在乎他们来自哪里，也不在乎他们向谁祈祷。这是我们人类对抗他们这些怪物。#!"
 hunter_civil_legacy_3_name: "无处可藏"
 hunter_civil_legacy_3_perk: "#flavor 怪物隐藏在凡人的阴影中。帮助人类夺取未知的新领地会让它们走出藏身之处。#!"
 hunter_civil_legacy_4_name: "四海皆友"
 hunter_civil_legacy_4_perk: "#flavor 当他们了解你的目的时，你遇到的绝大多数人都会热切地以各种方式支持你。#!"
 hunter_civil_legacy_5_name: "人族牧者"
 hunter_civil_legacy_5_perk: "你的财政总管将能执行$task_develop_county$任务。\n#flavor 在你的注视下，人类终将繁荣昌盛。#!"
 hunter_military_legacy_track_name: "猎人在猎"
 hunter_military_legacy_track_desc: "每只怪物都有自己的弱点，每种情况都对应的完美工具。"
 hunter_military_legacy_1_name: "移除资产"
 hunter_military_legacy_1_perk: "你的军队将能劫掠。\n#flavor 在杀戮之前，最好确保它们被彻底隔离。#!"
 hunter_military_legacy_2_name: "全部钉桩"
 hunter_military_legacy_2_perk: "能够招募[GetMaA('vampires_hunters').GetName]作为[men_at_arms|E]\n#flavor 无论他们躲在哪个黑暗的地窖里，你都会找到他们，并将木桩插入他们漆黑的心脏。#!"
 hunter_military_legacy_3_name: "严重驱魔"
 hunter_military_legacy_3_perk: "能够招募[GetMaA('demons_hunters').GetName]作为[men_at_arms|E]\n#flavor 祈祷和意志力只能让你走得更远。要铲除世界上的恶魔，你还需要坚固的盔甲和更强的钢铁。#!"
 hunter_military_legacy_4_name: "毛皮收藏"
 hunter_military_legacy_4_perk: "允许招募[GetMaA('monsters_hunters').GetName]作为[men_at_arms|E]\n#flavor 用你的灵魂对抗可怕的化形者，然后准备好你的银器武器。#!"
 hunter_military_legacy_5_name: "手足兄弟"
 hunter_military_legacy_5_perk: "#flavor 能与黑暗抗争的人少之又少。能与你并肩作战的人更是少之又少。#!"
 hunter_alliances_legacy_track_name: "同盟猎人"
 hunter_alliances_legacy_track_desc: "你并非孤身对抗黑暗。获得这些猎人同僚的支持将大有裨益。"
 hunter_alliances_legacy_1_name: "暗影审判庭"
 hunter_alliances_legacy_1_perk: "@warning_icon!#X 此王朝特质需通过完成特定重大决议解锁。#!\n可通过“联系猎人同僚”决议邀请该组织成员加入。\n$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor 最强大的猎人组织无疑是暗影审判庭。你希望他们站在你这边，或至少不干涉你的行动。#!"
 hunter_alliances_legacy_2_name: "精诚兄弟会"
 hunter_alliances_legacy_2_perk: "@warning_icon!#X 此王朝特质需通过完成特定决议解锁。#!\n现可通过“联系猎人同僚”决议邀请该组织成员加入。\n现可通过“联系猎人同僚”决议请求术法领域的特别指导。\n#flavor 尽管缺乏正式组织，精诚兄弟会在其领地内猎杀怪物的能力无与伦比。他们的专长值得你学习。#!"
 hunter_alliances_legacy_3_name: "判官团"
 hunter_alliances_legacy_3_perk: "@warning_icon!#X 此王朝特质需通过完成特定决议解锁。#!\n现可通过“联系猎人同僚”决议邀请该组织成员加入。\n现可通过“联系猎人同僚”决策请求神术领域的特别指导。\n#flavor 博学的审判者们若成为你的盟友，将为你的战斗带来丰富的经验与神秘学识。#!"
 hunter_alliances_legacy_4_name: "边防军"
 hunter_alliances_legacy_4_perk: "@warning_icon!#X 此王朝特质需通过完成特定决议解锁。#!\n现可通过“联系猎人同僚”决策邀请该组织成员加入。\n#flavor 东正教的捍卫者们继承了拜占庭复杂的法律与官僚体系。这对新兴猎人组织而言是一项实用技能。#!"
 hunter_alliances_legacy_5_name: "科尔沁把阿秃儿"
 hunter_alliances_legacy_5_perk: "@warning_icon!#X 此王朝特质需通过完成特定决议解锁。#!\n现可通过“联系猎人同僚”决议邀请该组织成员加入。\n允许招募[GetMaA('battlescarred_fera').GetName][men_at_arms|E]\n#flavor 蒙古猎人们有奇怪的盟友……但他们的蛮力让人容易对其视而不见。#!"
 wraith_legacy_track_name: "死灵背景"
 wraith_legacy_track_desc: "逝者的工具、技巧和悲伤回忆。"
 wraith_legacy_1_name: "夜灵梦景"
 wraith_legacy_1_perk: "小几率不获得黑暗炽情[decision|E]。\n#flavor 死灵抵抗黯影的能力。#!"
 wraith_legacy_2_name: "栖身鬼屋"
 wraith_legacy_2_perk: "#flavor 此乃灵界庇护所[UmbraGlossary('shadowlands')]中抵御危难的魂息之地。#!"
 wraith_legacy_3_name: "过往痕迹"
 wraith_legacy_3_perk: "每月自动恢复[Corpus|E]。\n#flavor 死灵生前的作品在死后仍将继续流传，作为对他们的纪念。#!"
 wraith_legacy_4_name: "世人悼念"
 wraith_legacy_4_perk: "每月自动恢复执念。\n#flavor 人们对逝者的记忆。可以作为执念的源泉……尽管记忆会因此褪色。#!"
 wraith_legacy_5_name: "携来遗器"
 wraith_legacy_5_perk: "获得随机历史宝物残像。\n#flavor 由于情感共鸣，物体穿过尸幕来到了死灵边。#!"
 kj_fuxi_legacy_track_name: "伏羲传承"
 kj_fuxi_legacy_track_desc: "三皇中的第一位，传说时代的典范人物"
 kj_fuxi_legacy_1_name: "渔夫之遗"
 KJ_FUXI_LEGACY_1_EFFECT: "#flavor 伏羲乃首位渔者，引领黎民从波涛中寻得温饱。#!"
 kj_fuxi_legacy_2_name: "猎人之遗"
 KJ_FUXI_LEGACY_2_EFFECT: "若尚未解锁 [GetActivityType('activity_hunt').GetName][activity|E]，则将其解锁。\n将[GetActivityType('activity_hunt').GetName][activity|E]的花费减半。\n#flavor 伏羲亦是最早的猎人，为远离海岸的百姓带来食物。#!"
 kj_fuxi_legacy_3_name: "牧者之遗"
 KJ_FUXI_LEGACY_3_EFFECT: "为低劣战争建筑添加一个新的修正效果。\n#flavor 伏羲教导人类饲养家畜，即便鱼兽稀少之时也能养活百姓。#!"
 kj_fuxi_legacy_4_name: "筑者之遗"
 KJ_FUXI_LEGACY_4_EFFECT: "#flavor 伏羲示范了建造永固居所之法，引领人类走出穴居。#!"
 kj_fuxi_legacy_5_name: "卜者之遗"
 KJ_FUXI_LEGACY_5_EFFECT: "#flavor 最终，伏羲亦教导早期人类仰望星辰，于苍穹之中探寻答案（更重要的是——问题。）#!"
 kj_shennong_legacy_track_name: "神农传承"
 kj_shennong_legacy_track_desc: "三皇中的第二位，传说时代的典范人物"
 kj_shennong_legacy_1_name: "牺牲之遗"
 KJ_SHENNONG_LEGACY_1_EFFECT: "在任何[dynasty|E]成员逝世后，[dynasty|E]将获得#V 100#![dynasty_prestige|E]。\n#flavor 神农教导百姓如何虔诚祭天，以安抚天威，庇佑自身安宁。#!"
 kj_shennong_legacy_2_name: "耕者之遗"
 KJ_SHENNONG_LEGACY_2_EFFECT: "#flavor 神农发明了农业，为早期人类的繁衍与兴盛开辟了道路。#!"
 kj_shennong_legacy_3_name: "织者之遗"
 KJ_SHENNONG_LEGACY_3_EFFECT: "为低劣战争建筑添加一个新的修正效果。\n#flavor 神农教导百姓如何制衣御寒，使他们即便在凛冬之中也能安然度日。#!"
 kj_shennong_legacy_4_name: "献祭之遗"
 KJ_SHENNONG_LEGACY_4_EFFECT: "#flavor 神农开创了创新这个概念，即便是以自身为祭，也要为人类的进步而奉献。#!"
 kj_shennong_legacy_5_name: "愈者之遗"
 KJ_SHENNONG_LEGACY_5_EFFECT: "#flavor 神农乃最初的医者，其对草药的精通在当时无人能及。#!"
 kj_huangti_legacy_track_name: "黄帝传承"
 kj_huangti_legacy_track_desc: "三皇中的第三位，传说时代的典范人物"
 kj_huangti_legacy_1_name: "炼金之遗"
 KJ_HUANGTI_LEGACY_1_EFFECT: "#flavor 黄帝乃最初的炼金术士，开创了悠久而自豪的传统，至今仍惠泽万民。#!"
 kj_huangti_legacy_2_name: "舟师之遗"
 KJ_HUANGTI_LEGACY_2_EFFECT: "#flavor 黄帝教导早期人类造船远航，开拓海上新土。#!"
 kj_huangti_legacy_3_name: "甲匠之遗"
 KJ_HUANGTI_LEGACY_3_EFFECT: "为低劣战争建筑添加一个新的修正效果。\n#flavor 黄帝铸造了最初的铠甲，护卫族群，抵御尚未开化的蛮人侵扰。#!"
 kj_huangti_legacy_4_name: "戍卫之遗"
 KJ_HUANGTI_LEGACY_4_EFFECT: "#flavor 黄帝在早期人类中播撒了团结的种子，使他们以坚不可摧的集体守护家园。#!"
 kj_huangti_legacy_5_name: "兵戈之遗"
 KJ_HUANGTI_LEGACY_5_EFFECT: "#flavor 最终，黄帝教导我们如何把握反击的时机，确保文明之光能够战胜蛮荒之力。#!"
 nagaraja_legacy_track_name: "那伽罗阇传承"
 nagaraja_legacy_track_desc: "那伽罗阇的知识代代相传"
 nagaraja_legacy_1_name: "神圣之口"
 nagaraja_legacy_2_name: "循环吞噬者"
