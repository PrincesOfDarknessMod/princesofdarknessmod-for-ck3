 eminence_legacy_track_name:0 "地狱显赫"
 eminence_legacy_track_desc:0 "恶魔们在深渊监狱的不愉快经历中失去了很多记忆和经验。他们到底是谁？"
 eminence_legacy_1_name:0 "地狱奴隶"
 eminence_legacy_1_perk:0 "若你是恶魔，你将：\n$TAB$解锁天使的原初力量——[lore_lifestyle|E]生活方式。\n$TAB$回忆起一段你过往作为天使的记忆。\n$TAB$获得“[GetModifier('known_eminence_modifier').GetNameWithTooltip]”。\n$TAB$每年来自[thrall|E]的[arcana_lifestyle|E]经验上限：#P 2000#!"
 eminence_legacy_2_name:0 "地狱士兵"
 eminence_legacy_2_perk:0 "若你是恶魔，你将：\n$TAB$回忆起一段你过往作为天使的记忆。\n$TAB$获得“[GetModifier('respected_eminence_modifier').GetNameWithTooltip]”。\n$TAB$每年来自[thrall|E]的[arcana_lifestyle|E]经验上限：#P 3000#!"
 eminence_legacy_3_name:0 "地狱将军"
 eminence_legacy_3_perk:0 "若你是恶魔，你将：\n$TAB$回忆起一段你过往作为天使的记忆。\n$TAB$获得“[GetModifier('honored_eminence_modifier').GetNameWithTooltip]”。\n$TAB$每年来自[thrall|E]的[arcana_lifestyle|E]经验上限：#P 4000#!"
 eminence_legacy_4_name:0 "地狱公爵"
 eminence_legacy_4_perk:0 "若你是恶魔，你将：\n$TAB$回忆起一段你过往作为天使的记忆。\n$TAB$获得“[GetModifier('powerful_eminence_modifier').GetNameWithTooltip]”。\n$TAB$每年来自[thrall|E]的[arcana_lifestyle|E]经验上限：#P 5000#!"
 eminence_legacy_5_name:0 "地狱大公"
 eminence_legacy_5_perk:0 "若你是恶魔，你将：\n$TAB$回忆起一段你过往作为天使的记忆。\n$TAB$获得“[GetModifier('exalted_eminence_modifier').GetNameWithTooltip]”。\n$TAB$每年来自[thrall|E]的[arcana_lifestyle|E]经验上限：#P 无限#!"
