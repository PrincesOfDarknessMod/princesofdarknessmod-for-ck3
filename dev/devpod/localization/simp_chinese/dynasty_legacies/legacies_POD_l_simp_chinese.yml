 pacts_legacy_track_desc:0 "恶魔契约可以赋予接受它的人力量，而代价是他们完全的献身。"
 pacts_legacy_1_name:0 "地狱学识"
 pacts_legacy_1_perk:0 "当一位角色接受了与你的契约，该角色将获得#V 5#![learning|E]。"
 pacts_legacy_2_name:0 "地狱魅力"
