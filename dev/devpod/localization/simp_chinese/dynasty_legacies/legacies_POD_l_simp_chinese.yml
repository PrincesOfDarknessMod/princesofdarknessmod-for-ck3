 pharaoh_mummy_legacy_5_name:0 "胡夫的传承"
 pharaoh_mummy_legacy_1_perk:0 "#flavor 这位伟大的女王仅凭她的魅力就几乎推翻了一个新生的帝国。#!"
 pharaoh_mummy_legacy_2_perk:0 "#flavor 托勒密来自远方，他接纳了埃及，就像接纳自己的故乡一样。#!"
 pharaoh_mummy_legacy_3_perk:0 "#flavor 拉神之子指挥着埃及最强大的军队，很少有人能够反对他强大的野心。#!"
 pharaoh_mummy_legacy_4_perk:0 "#flavor 无论好坏，没有一位古埃及人会忘记埃赫那吞，那个蔑视众神的人。#!"
 pharaoh_mummy_legacy_5_perk:0 "#flavor 通过在吉萨大金字塔中永远安息，胡夫找到了自己的不朽。#!"
