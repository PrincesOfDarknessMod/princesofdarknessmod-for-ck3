 pacts_legacy_5_name:0 "地狱英勇"
 pacts_legacy_5_perk:0 "当一位角色接受了与你的契约，该角色将获得#V 5#![martial|E]。"
 mortuary_cult_mummy_legacy_track_name:0 "殓祭密教"
 mortuary_cult_mummy_legacy_track_desc:0 "殡葬崇拜滋养着先祖的灵。祭司们为了他们的利益而进行日常仪式，并得到回报的恩惠。"
 mortuary_cult_mummy_legacy_1_name:0 "侍死舞者"
 mortuary_cult_mummy_legacy_2_name:0 "净化祭司"
 mortuary_cult_mummy_legacy_3_name:0 "阅读祭司"
 mortuary_cult_mummy_legacy_4_name:0 "殡葬祭司"
 mortuary_cult_mummy_legacy_5_name:0 "神的仆人"
 mortuary_cult_mummy_legacy_1_perk:0 "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_1_modifier').GetNameWithTooltip]修正。\n\n#flavor 侍死舞者通过音乐和舞蹈为神灵服务。他们与妇女和生育女神哈索尔相关。#!"
 mortuary_cult_mummy_legacy_2_perk:0 "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_2_modifier').GetNameWithTooltip]修正。\n\n#flavor 纯净者是最常见的祭司类型，他们进行密教的日常维护。#!"
 mortuary_cult_mummy_legacy_3_perk:0 "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_3_modifier').GetNameWithTooltip]修正。\n\n#flavor 阅读祭司通过诵读咒语和向墓地中的死者提供祭品来滋养杜阿特的灵魂。#!"
 mortuary_cult_mummy_legacy_4_perk:0 "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_4_modifier').GetNameWithTooltip]修正。\n\n#flavor 殓葬师负责在将死者木乃伊化时，注意保持身体的完整性。#!"
 mortuary_cult_mummy_legacy_5_perk:0 "你的[neteru|E]将获得[GetModifier('POD_neteru_legacy_5_modifier').GetNameWithTooltip]修正。\n\n#flavor 大祭司关心死者的卡，允许其继续存在于杜阿特。#!"
 seelie_romantic_legacy_track_name:0 "喜乐廷浪漫传承"
 seelie_romantic_legacy_track_desc:0 "浪漫传承是戚族在浪漫遭遇中表现出来的个性，特别是在宫廷爱情的私人或正式舞蹈中。"
 seelie_romantic_legacy_1_name:0 "同理共情"
 seelie_romantic_legacy_1_perk:0 "#flavor 你对你伴侣的情绪、愿望和欲望高度敏感。如果其不开心，你也不开心。#!"
 seelie_romantic_legacy_2_name:0 "亦爱亦友"
 seelie_romantic_legacy_2_perk:0 "解锁[GetScheme('befriend').GetTypeName][scheme|E]。\n你将可以交到最多7个朋友（原本为5）。\n#flavor 爱不仅仅是一种浪漫情感。如果一段关系的核心没有相互尊重和友谊，它就不是真正的爱情。#!"
 seelie_romantic_legacy_3_name:0 "天真无邪"
 seelie_romantic_legacy_3_perk:0 "#flavor 一点天真和单纯，仍然只看到爱的奇迹和美好的一面。大多数妖精通常会随着年龄的增长而脱离这传承，但并不总是如此。#!"
 seelie_romantic_legacy_4_name:0 "杂耍把戏"
 seelie_romantic_legacy_4_perk:0 "#flavor 你喜欢让你的恋人（和你自己）得到娱乐。爱是最大的快乐，应该充分享受。#!"
 seelie_romantic_legacy_5_name:0 "相爱相守"
 seelie_romantic_legacy_5_perk:0 "#flavor 你的爱是真正的，你渴望保护其免受世界上所有的弊病。这传承是出于高尚的意图，但可能令人窒息。#!"
 unseelie_romantic_legacy_track_name:0 "哀怒廷浪漫传承"
 unseelie_romantic_legacy_track_desc:0 "浪漫传承是戚族在浪漫遭遇中表现出来的个性，特别是在宫廷爱情的私人或正式舞蹈中。"
 unseelie_romantic_legacy_1_name:0 "争风吃醋"
 unseelie_romantic_legacy_1_perk:0 "你将根据你情人中的属性最高者获得一个给予每月威望的修正。\n#flavor 你是浪漫中的奥运选手。你用别人的情人的质量来评判别人，你知道他们也用同样的标准来评判你。你必须是世界上最强的情人，否则人生还有什么意义？#!"
 unseelie_romantic_legacy_2_name:0 "看破红尘"
 unseelie_romantic_legacy_2_perk:0 "#flavor 厌倦和厌世，你经常因出于习惯或害怕孤独而继续你的浪漫姿态。你已经降低了你的标准，因为你知道“真爱”只能在童话故事中找到。#!"
 unseelie_romantic_legacy_3_name:0 "为爱献躯"
 unseelie_romantic_legacy_3_perk:0 "#flavor 我如此努力地运作，使这段关系得以维持，而我得到的回报是什么？心痛！我没指望你能理解。#!"
 unseelie_romantic_legacy_4_name:0 "万花中过"
 unseelie_romantic_legacy_4_perk:0 "每有一[lover|E]叠加一层：[GetModifier( 'POD_gamester_modifier' ).GetNameWithTooltip|L]\n#flavor 爱情是一场盛大的牌局，充满了危险和刺激。你可能有一个配偶或许多配偶，但恋情必须得有不断的挑战和变化。#!"
 unseelie_romantic_legacy_5_name:0 "招蜂引谍"
 unseelie_romantic_legacy_5_perk:0 "#flavor 宫廷八卦和阴谋是你的食物和饮料。部分是攀附者，部分是欺骗者，你只对最了解谁对谁做什么感兴趣。#!"
 seelie_legacy_1_track_name:0 "喜乐廷传承"
 seelie_legacy_1_track_desc:0 "Known for the vibrancy of spring and the searing heat of summer, followers of the Seelie Legacies tend to put an emphasis on groups and community."
 seelie_1_legacy_1_name:0 "Humanist"
 seelie_1_legacy_1_perk:0 "#flavor You are more attentive to your mortal life than your fae one.#!"
 seelie_1_legacy_2_name:0 "Prankster"
 seelie_1_legacy_2_perk:0 "#flavor You delight in playing all manner of jokes and pranks.#!"
 seelie_1_legacy_3_name:0 "Wayfarer"
 seelie_1_legacy_3_perk:0 "#flavor You live for the moment, and do things on impulse.#!"
 seelie_1_legacy_4_name:0 "Panderer"
 seelie_1_legacy_4_perk:0 "#flavor You live to make others happy.#!"
 seelie_1_legacy_5_name:0 "Troubadour"
 seelie_1_legacy_5_perk:0 "Poet become more common in the Dynasty.\n#flavor The world is a beautiful place, and you feel this--and all things--more strongly than others do.#!"
 seelie_legacy_2_track_name:0 "喜乐廷传承"
 seelie_legacy_2_track_desc:0 "Known for the vibrancy of spring and the searing heat of summer, followers of the Seelie Legacies tend to put an emphasis on groups and community."
 seelie_2_legacy_1_name:0 "Gadfly"
 seelie_2_legacy_1_perk:0 "#flavor You keep the powers-that-be honest by pointing out their faults.#!"
 seelie_2_legacy_2_name:0 "Dandy"
 seelie_2_legacy_2_perk:0 "#flavor A social climber at heart, you excel at court etiquette.#!"
 seelie_2_legacy_3_name:0 "Comrade"
 seelie_2_legacy_3_perk:0 "$PERK_CAN_SIGN_ALLIANCE$\n#flavor 你重视友谊胜过一切，并努力证明自己值得他人信任。#!"
 seelie_2_legacy_4_name:0 "Courtier"
 seelie_2_legacy_4_perk:0 "#flavor The only thing interesting in life is social interaction.#!"
 seelie_2_legacy_5_name:0 "Regent"
 seelie_2_legacy_5_perk:0 "#flavor You are the living embodiment of the realm, the one chosen to speak for the many.#!"
 seelie_legacy_3_track_name:0 "喜乐廷传承"
 seelie_legacy_3_track_desc:0 "Known for the vibrancy of spring and the searing heat of summer, followers of the Seelie Legacies tend to put an emphasis on groups and community."
 seelie_3_legacy_1_name:0 "Bumpkin"
 seelie_3_legacy_1_perk:0 "#flavor You are the solid, practical sort who has a solution to every problem.#!"
 seelie_3_legacy_2_name:0 "Crafter"
 seelie_3_legacy_2_perk:0 "#flavor Creation is your life's work.#!"
 seelie_3_legacy_3_name:0 "Aspirant"
 seelie_3_legacy_3_perk:0 "#flavor Life is a learning experience, and you always strive to improve yourself.#!"
 seelie_3_legacy_4_name:0 "Sage"
 seelie_3_legacy_4_perk:0 "Mystic become more common in the Dynasty.\n#flavor You are the advisor, the wise one, the teacher.#!"
 seelie_3_legacy_5_name:0 "Virtuoso"
 seelie_3_legacy_5_perk:0 "Select a lifestyle trait to become more common in the Dynasty.\n#flavor You are the master of your chosen field, whatever it may be.#!"
 seelie_legacy_4_track_name:0 "喜乐廷传承"
 seelie_legacy_4_track_desc:0 "Known for the vibrancy of spring and the searing heat of summer, followers of the Seelie Legacies tend to put an emphasis on groups and community."
 seelie_4_legacy_1_name:0 "Squire"
 seelie_4_legacy_1_perk:0 "#flavor You live to help and support your current hero in his endeavors.#!"
 seelie_4_legacy_2_name:0 "Knight"
 seelie_4_legacy_2_perk:0 "#flavor You follow the old codes of chivalry and help those in need.#!"
 seelie_4_legacy_3_name:0 "Paladin"
 seelie_4_legacy_3_perk:0 "#flavor You are a competitor; the brave, stalwart athlete or hero.#!"
 seelie_4_legacy_4_name:0 "Philanthropist"
 seelie_4_legacy_4_perk:0 "#flavor You strive to help others and do good deeds without expecting a reward.#!"
 seelie_4_legacy_5_name:0 "Saint"
 seelie_4_legacy_5_perk:0 "#flavor You strive to ease the pain of others.#!"
 seelie_legacy_5_track_name:0 "喜乐廷传承"
 seelie_legacy_5_track_desc:0 "Known for the vibrancy of spring and the searing heat of summer, followers of the Seelie Legacies tend to put an emphasis on groups and community."
 seelie_5_legacy_1_name:0 "Orchid"
 seelie_5_legacy_1_perk:0 "#flavor You are an innocent who has been forced into the big, wide, dangerous world.#!"
 seelie_5_legacy_2_name:0 "Pishogue"
 seelie_5_legacy_2_perk:0 "#flavor The world is a place of endless, childlike wonder to you.#!"
 seelie_5_legacy_3_name:0 "Stoic"
 seelie_5_legacy_3_perk:0 "#flavor You rarely reveal your emotions.#!"
 seelie_5_legacy_4_name:0 "Hermit"
 seelie_5_legacy_4_perk:0 "#flavor You prefer your own company to that of others.#!"
 seelie_5_legacy_5_name:0 "Arcadian"
 seelie_5_legacy_5_perk:0 "#flavor Your fae side far outweighs your human side.#!"
 unseelie_legacy_1_track_name:0 "哀怒廷传承"
 unseelie_legacy_1_track_desc:0 "Colorful as an autumn harvest and chaotic and isolated as a winter ice storm, followers of the Unseelie Legacies tend to be passionate individualists."
 unseelie_1_legacy_1_name:0 "Craven"
 unseelie_1_legacy_1_perk:0 "#flavor Better a live coward than a dead hero.#!"
 unseelie_1_legacy_2_name:0 "Humbug"
