 bagheera_legacy_track_name: "沙罗摩的子嗣"
 bagheera_legacy_track_desc: "巴希拉好奇且博学，为了纪念母亲的牺牲，他们致力于维护人类与芭丝特之间的和平。"
 bagheera_legacy_1_name: "沙罗摩之傲"
 bagheera_legacy_1_perk: "能够招募[GetMaA('children_saraam').GetName]作为[men_at_arms|E]\n#flavor 沙罗摩家族的精英们优雅而致命，他们在所到之处守护正义和荣誉。#!"
 bagheera_legacy_2_name: "智者若尼"
 bagheera_legacy_2_perk: "#flavor “吾乃智慧。”黑猫说，“吾即夜间低语之秘密守护者。吾名若尼，来自森林的守望者。”#!"
 bagheera_legacy_3_name: "风武士"
 bagheera_legacy_3_perk: "#flavor 战斗中的巴希拉是一种美丽的生物，每一个经过计算的动作都与死亡之舞完美同步。#!"
 bagheera_legacy_4_name: "怒者阿贡"
 bagheera_legacy_4_perk: "#flavor “吾乃愤怒。”花斑猫说，“吾即千眼怒爪。吾名阿贡，来自平原的守望者。”#!"
 bagheera_legacy_5_name: "黑豹与老虎"
 bagheera_legacy_5_perk: "可以招募[GetMaA('durga_chosen').GetName]作为[men_at_arms|E]\n#flavor 虎之子——可汗氏族一直以来都是巴希拉的朋友。两个部族齐心协力，共同治愈受创的猫国。#!"
 bubasti_legacy_track_name: "赛玛之子"
 bubasti_legacy_track_desc: "布巴斯提神秘而高傲，他们渴望着作为埃及的正统神祇归来的那一个夜晚。"
 bubasti_legacy_1_name: "兀芭斯特的选民"
 bubasti_legacy_1_perk: "可以招募[GetMaA('warriors_ubastet').GetName]作为[men_at_arms|E]\n#flavor 没人比这些芭斯特勇士更了解埃及了。别信蛇的话。#!"
 bubasti_legacy_2_name: "黑土贵族"
 bubasti_legacy_2_perk: "#flavor 布巴斯提曾经只挑选埃及最杰出的贵族加入他们的行列。虽然这一时期已经结束，但他们的傲慢却依旧如故。#!"
 bubasti_legacy_3_name: "秘密术士"
 bubasti_legacy_3_perk: "#flavor 布巴斯提曾经用能夷平整个城市的强大魔法来惩罚无礼的凡人。从那时起，他们的力量逐渐衰弱，但秘密并未完全失传。#!"
 bubasti_legacy_4_name: "黑魔法大师"
 bubasti_legacy_4_perk: "#flavor 虽然布巴斯提在全盛时期后失去了很多东西，但他们一直密切关注着自己最强大的资产，那就是对许多不同寻常且强大的仪式的了解。#!"
 bubasti_legacy_5_name: "挚爱者伊西斯"
 bubasti_legacy_5_perk: "可以招募[GetMaA('cultists').GetName]作为[men_at_arms|E]\n#flavor 伊西斯曾与布巴斯提分享秘密和爱情，巩固了他们与$glossary_osirian_league$的关系。直到现在，她的崇拜者们仍然对黑土之猫敬而远之。#!"
 ceilican_legacy_track_name: "梦界之子"
 ceilican_legacy_track_desc: "被他们的妖精亲族背叛后，祟利坎的梦境变成了梦魇。"
 ceilican_legacy_1_name: "叛徒天罚"
 ceilican_legacy_1_perk: "可以招募[GetMaA('samhach_bane').GetName]作为[men_at_arms|E]\n#flavor 无上叛徒几乎灭绝了祟利坎。他总有一天会后悔没有斩草除根。#!"
 ceilican_legacy_2_name: "寂静之道"
 ceilican_legacy_2_perk: "#flavor 在外界看来，祟利坎要么死了，要么被萨姆哈奇奴役。而他们打算尽可能长久地让世人保持这种看法。#!"
 ceilican_legacy_3_name: "魔形猫"
 ceilican_legacy_3_perk: "#flavor 祟利坎善于伪装成其他芭丝特部族甚至是其他种类的超自然生物。这使他们能够混入其他秘密组织来保护自己。#!"
 ceilican_legacy_4_name: "苦涩玩笑"
 ceilican_legacy_4_perk: "#flavor 祟利坎失去了一切，只剩下燃烧的激情。他们将尽情欢舞，直到世界末日……甚至在世界末日之后。#!"
 ceilican_legacy_5_name: "妖精猫"
 ceilican_legacy_5_perk: "可以招募[GetMaA('ovinniks').GetName]作为[men_at_arms|E]\n#flavor 虽然他们遭到了妖精领主的背叛和追杀，但祟利坎仍然可以依靠曾经的妖精亲族中的一些盟友。#!"
 khan_legacy_track_name: "杜尔迦之子"
 khan_legacy_track_desc: "义不容辞的可汗随时准备保卫猫族，抵御众多敌人。他们的荣誉不容有失。"
 khan_legacy_1_name: "可汗守卫"
 khan_legacy_1_perk: "可以招募[GetMaA('durga_chosen').GetName]作为[men_at_arms|E]\n#flavor 最强壮、最坚毅的虎之子是一道亮丽的风景线，也是令人畏惧的敌人。#!"
 khan_legacy_2_name: "鲁莽的拯救者"
 khan_legacy_2_perk: "#flavor 可汗的传说讲述了他们为拯救月神杜尔迦而进行的伟大战斗，突伽看到他们战胜了阿修罗。然而在胜利的喜悦中，他们却被恶魔的真正目的蒙蔽了双眼。#!"
 khan_legacy_3_name: "虎之眼"
 khan_legacy_3_perk: "#flavor 一位可汗的训练永远不会结束。他要求自己要做到最好，从而激励他的盟友达到更高的境界。#!"
 khan_legacy_4_name: "共同行动"
 khan_legacy_4_perk: "#flavor 每个可汗都是天生的战士。他们整队冲锋陷阵，是猫国的光荣景象。#!"
 khan_legacy_5_name: "老虎与黑豹"
 khan_legacy_5_perk: "可以招募[GetMaA('children_saraam').GetName]作为[men_at_arms|E]\n#flavor 豹之子巴希拉氏族一直是可汗的朋友。两个部族齐心协力，共同治愈受创的猫国。#!"
 simba_legacy_track_name: "塞勒涅之子"
 simba_legacy_track_desc: "辛巴受命于月，统治着争吵不休、效率低下的猫国。天命难违，还能妄自尊大吗？"
 simba_legacy_1_name: "皇家武士"
 simba_legacy_1_perk: "可以招募[GetMaA('seline_pride').GetName]作为[men_at_arms|E]\n#flavor 狮子是统治者，因此很少需要亲征，但一旦出战，每个人都会记起他们的地位。#!"
 simba_legacy_2_name: "狮子王"
 simba_legacy_2_perk: "#flavor 辛巴的统治是合法和正义的统治……或者更多时候是恐怖和暴政的统治。狮子王们要求彻底的服从。#!"
 simba_legacy_3_name: "大草原之主"
 simba_legacy_3_perk: "#flavor 辛巴没有斯瓦拉那么敏捷，也没有可汗那么强壮，但他们那珍贵兽皮的坚韧度是任何芭丝特都无法比拟的。#!"
 simba_legacy_4_name: "以怖而治"
 simba_legacy_4_perk: "#flavor 辛巴重视力量和服从。他们将拯救猫国，并希望其他猫科动物在他们这样做的时候保持服从。#!"
 simba_legacy_5_name: "镇静火元素"
 simba_legacy_5_perk: "可以招募[GetMaA('fire_elemental').GetName]作为[men_at_arms|E]\n#flavor 作为最强大的$glossary_fera$作为撒哈拉以南非洲地区最强大的化形者血种，辛巴长期以来一直与这片土地上的诸灵缔结契约。#!"
 swara_legacy_track_name: "达南之子"
 swara_legacy_track_desc: "斯瓦拉是净土的守护者，他们总是从一个净土跑到另一个净土，一边跑一边净化它们。"
 swara_legacy_1_name: "猎豹奔行"
 swara_legacy_1_perk: "可以招募[GetMaA('danaa_runners').GetName]作为[men_at_arms|E]\n#flavor 斯瓦拉不像他们的芭丝特同伴一样强悍，看起来也不那么令人印象深刻，但他们无与伦比的速度让他们赢得了许多战斗。#!"
 swara_legacy_2_name: "速战速决"
 swara_legacy_2_perk: "#flavor 斯瓦拉总是不断迁徙，他们的骄傲几乎难以捕捉。你很可能只在他们愿意让你看到时才能见到他们。#!"
 swara_legacy_3_name: "无情复仇者"
 swara_legacy_3_perk: "#flavor 虽然斯瓦拉不像他们的芭丝特同伴那样咄咄逼人，但也会长期积怨。要躲过一个意图向你复仇的斯瓦拉几乎是闻所未闻的。#!"
 swara_legacy_4_name: "避开猿人"
 swara_legacy_4_perk: "#flavor 只要不侵犯净土，斯瓦拉不介意人类的打扰。他们中鲜少有人会与其发生冲突，这与其他芭丝特形成了鲜明的对比。#!"
 swara_legacy_5_name: "灵之联系"
 swara_legacy_5_perk: "可以招募[GetMaA('air_elemental').GetName]作为[men_at_arms|E]\n#flavor 斯瓦拉比其他芭丝特更了解[umbra|E]。其与[spirit_world|E]的联系无与伦比，而他们却极力保密这一点。#!"
