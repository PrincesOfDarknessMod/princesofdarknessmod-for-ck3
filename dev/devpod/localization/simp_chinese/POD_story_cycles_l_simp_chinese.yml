l_simp_chinese:
 POD_story_pact: "#glow_color:{0.5,0,0,1} 恶魔契约#!"
 POD_story_pact_desc: "你为力量付出了代价。\n这值得吗？"
 POD_story_pact_custom_string: "#font:TitleFont;size:19;glow_color:{0.5,0,0,1} 与[Story.MakeScope.Var('demon').Char.GetFirstName]签订契约#!\n#glow_color:{0.25,0,0,75} [demonic_pact_obligation|E]：[Localize(Concatenate('POD_obligation_', Story.MakeScope.GetVariable('obligation').GetFlagKey))|U]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactFrequencyAndStatus')]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactDeadline')]\n如果你#X 打破#!契约：\n[GetScriptedGui('POD_sidebar_show_demonic_pacts').BuildTooltip(GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('obligation', MakeScopeFlag(Story.MakeScope.GetVariable('obligation').GetFlagKey)).AddScope('consequence', MakeScopeFlag(Story.MakeScope.GetVariable('consequence').GetFlagKey)).End)]\n此[demonic_pact|E]带来[Story.MakeScope.GetVariable('perk_points_gained').GetValue|0V][investiture_lifestyle|E][perk|E][Select_CString( EqualTo_CFixedPoint( Story.MakeScope.GetVariable('perk_points_gained').GetValue, '(CFixedPoint)1' ), 'point', 'points' )]#!"
 POD_story_pact_prohibitory: "状态：#X 禁止#!"
 POD_story_pact_frequency_completed: "[demonic_pact_frequency|E]：每[story.MakeScope.GetVariable('frequency').GetValue|0V]年#!\n状态：#P 完成#!"
 POD_story_pact_frequency_notcompleted: "[demonic_pact_frequency|E]：每[story.MakeScope.GetVariable('frequency').GetValue|0V]年#!\n状态：#N 待处理#!"
 POD_asakku_depth_accumulation: "井边的守望者"
 POD_asakku_depth_accumulation_desc: "一个比记忆更古老的实体注意到了你的血脉。无论是心兽中的狂热，还是《创世记》被遗忘篇章中涌出的恶魔，你无从知晓，但当你恐惧地目睹它步步逼近，直抵你的灵魂深处时，你不敢去探寻真相。"
 POD_asakku_story_custom_string: "安德莱昂拥有以下独特内容来表现阿萨克感染。\n\n#bold 阿萨克腐蚀#! 以一个1到100的数值追踪实体对你的控制，作为角色修正显示。它会随时间缓慢累积，当你为其利益行动时则加速累积。#bold 25、50、75#!和#bold 100#!四个阈值标志着不可逆转的变化：新特质、新能力，以及追捕感染者的势力日益增大的关注。\n\n#bold 传播阿萨克#!——易变术是实体的传播媒介。携带该异能的人物易受感染。[soul_infection|E]诡计将这种存在植入自愿或不知情的宿主体内。一旦完全成为阿萨克，[blood_inception|E]会更快奏效，但需要一个被囚禁的目标。\n\n#bold 暗影圣战#!——塔尔玛埃拉知道你的真面目。随着腐蚀增强，埃利乌德——受过识别并清除传染源训练的血族——将动员起来对抗你。\n\n#bold 井边的守望者#!——四个目标推动阿萨克的扩张：传播感染、加深腐蚀、夺取古老的权力之地，并使东方的猎人臣服。每个阶段都对世界和你提出更多要求。"
 POD_asakku_story_depth_label: "阿萨克腐蚀"
 POD_asakku_story_depth_min_label: "未触碰"
 POD_asakku_story_depth_max_label: "Iryi Ascendant"
 POD_story_spell_of_life_explanation: "寻找[Concept('POD_spell_of_life', '生命咒术')|E]的任务"
 POD_story_spell_of_life_explanation_desc: "生命神咒允许创造$POD_splat_mummy_plural$，通过死亡与重生的循环赋予其不朽。鲜有人习得此咒。若想加入其列，道路将漫长而艰辛。"
 POD_story_spell_of_life_explanation_custom_string: "[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLInProgressQuest')]"
 POD_story_spell_of_life_explanation_inprogress: "如果你希望亲自习得生命神咒，便需完成一段漫长的旅程，并在[GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )]的生命神咒路线中获取更多[trait_level_track_xp|E]。\n\n#T 祈求先贤#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage1Desc')]\n\n#T 失落残篇#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage2Desc')]\n\n#T 守门之人#!\n一旦探索达到90点[trait_level_track_xp|E]，数个派系便会前来袭击你，意欲窃取你的研究成果，并为你的傲慢降下惩罚。\n\n#T 永恒之诞生#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage4Desc')]\n\n#R 为求真正的不朽，务必做好牺牲一切的准备，此道路危机四伏！#![GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage3Task')]"
 POD_story_spell_of_life_explanation_complete: "成就了罕有人及的伟业，新的机遇随之而来。[character_interaction|E]使你能创造新的$POD_splat_mummy_plural$，请求他人创造$POD_splat_mummy_plural$，或将生命神咒传授给他人。目标可能会提供有趣的路径，或允许你传授生命神咒（若当前受限）。\n\n拥有如此力量，世界尽在脚下。你是要创造一支木乃伊族群以施行可怕的复仇，还是重塑世界以符合你的形象？你是要维护还是打破平衡？你是要撕裂生死之间的迷障吗？"
 POD_story_spell_of_life_explanation_stage1_brief: "第一阶段提供4条路径，包含多项决议。完成整条路径可能在后续阶段获得奖励。"
 POD_story_spell_of_life_explanation_stage1_full: "第一阶段提供4条路径，每条路径包含3个决议。少数角色已经踏上了某条路径的初始步骤，且并非所有路径对每个人都开放或在所有书签中可用。完成整条路径可能在后续阶段带来奖励。\n#bold 荷鲁斯#!\n$BULLET_WITH_TAB$将下埃及献给荷鲁斯\n$BULLET_WITH_TAB$说服荷鲁斯协助你\n$BULLET_WITH_TAB$消除赛特之子的威胁\n#bold 刻茉媞里#!\n$BULLET_WITH_TAB$与凯米提瑞交好，获取伊西斯碎片，并夺回关键地点\n$BULLET_WITH_TAB$寻找凯米提瑞的一些旧友\n$BULLET_WITH_TAB$彻底摧毁塔瓦瑞特家族\n#bold 卡比洛斯#!\n$BULLET_WITH_TAB$获取卡比洛斯的秘密手稿\n$BULLET_WITH_TAB$学习术法并招募术士\n$BULLET_WITH_TAB$削弱睿魔尔对卡比洛斯的威胁\n#bold 实验#!\n$BULLET_WITH_TAB$折磨一名被囚禁的木乃伊和一些潜在的术士\n$BULLET_WITH_TAB$说服你的家人或同僚信徒协助你\n$BULLET_WITH_TAB$囚禁大量民众，获取若干宝物，并征服一片人口稠密的土地"
 POD_story_spell_of_life_explanation_stage2_brief: "达到30点[trait_level_track_xp|E]后，完成[journeys|E]以获取线索，并向那些对生命神咒略知一二的少数人学习。"
 POD_story_spell_of_life_explanation_stage2_full: "在达到30点[trait_level_track_xp|E]后，你将无法再完成早期路径中的决议。相反，完成[journeys|E]以获取线索，并向那些对生命神咒略知一二的少数人学习。特别博学或精通魔法者或许能被动研习神咒，进一步增长见识。此外，与$POD_splat_mummy_plural$关系密切之人，以及持有某些与奥西里斯之死相关的[counties|E]#TOOLTIP:MUMMY_SOL_PASSIVE_county_explanation #L 特定领地#!#!者，将被动获得某些洞见。"
 POD_story_spell_of_life_explanation_stage3_notask: ""
 POD_story_spell_of_life_explanation_stage3_task: "\n\n要前进，必须#T #X 生存！#!#!"
 POD_story_spell_of_life_explanation_stage4_brief: "若你幸存下来，便需获取一个[UmbraGlossary('shadow_realm')]，以便完成生命神咒。其本质将决定由你的神咒所诞生的$POD_splat_mummy_plural$的命运与本性。"
 POD_story_spell_of_life_explanation_stage4_full: "你需要先获得一个[UmbraGlossary('shadow_realm')]，以便通过将仪式与该界域绑定来完成生命神咒。其本质将决定你的神咒所孕育出的$POD_splat_mummy_plural$的命运与性质。除非加入像[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]这样稳固且成熟的界域，否则在完成使命之前，你都需要穿越成群结队的#TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L 怨灵#!#!，即使对最强大的统治者而言，这也是个冒险之举。"
 POD_story_elixir_of_eternal_life_explanation: "寻找长生不老药的任务"
 POD_story_elixir_of_eternal_life_explanation_desc: "长生不老药允许创造$POD_splat_mummy_plural$，通过死亡与重生的循环赋予其永生。鲜有人习得此秘。若你愿加入其行列，道路将漫长而艰辛。"
 POD_story_elixir_of_eternal_life_explanation_custom_string: "[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELInProgressQuest')]"
 POD_story_elixir_of_eternal_life_explanation_inprogress: "若想亲自习得长生不老药，你需要完成一段漫长的求索旅程，并在[GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )]的长生不老药路线中获取更多[trait_level_track_xp|E]。\n\n#T 求索之路#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage1Desc')]\n\n#T 汇聚天机#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage2Desc')]\n\n#T 四重诱惑#!\n当探险达到90点[trait_level_track_xp|E]后，4位[Glossary('阎魔王','podgloss.yamaking')]将向你提出一个无法拒绝的条件。\n\n#T 超脱生死，迈向彼方#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage4Desc')]\n\n#R 在追求真正不朽的路上，请准备好牺牲一切，因为这条道路充满艰险！#![GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage3Task')]"
 POD_story_elixir_of_eternal_life_explanation_complete: "成就罕有人能企及的伟业后，新的机遇随之而来。[character_interaction|E]让你能创造新的$POD_splat_mummy_plural$，请他人创造$POD_splat_mummy_plural$，或将长生不老药传授给他人。目标可能会提供有趣的路径，或让你传授长生不老药（若目前受限）。你甚至可能有机会获取长生不老药的另一种形态。\n\n拥有如此力量，世界尽在脚下。你会创造一支木乃伊大军来实施可怕的复仇，还是按自己的形象重塑世界？你会维护还是打破平衡？你会撕裂生与死之间的迷障吗？你会设法找到同时精通两种长生不老药形态的方法吗？"
 POD_story_elixir_of_eternal_life_explanation_stage1_brief: "第一阶段提供三条路径，每条路径包含若干决议。完成整条路径可能会在后续阶段获得奖励。"
 POD_story_elixir_of_eternal_life_explanation_stage1_full: "第一阶段提供3条路径，每条路径包含3个决议。并非所有人都能进入所有路径，也并非所有书签都开放所有路径。完成整条路径可能在后续阶段获得奖励。\n#bold 冥想与内丹#!\n$BULLET_WITH_TAB$没有负面健康或压力特质，并朝着[GetTrait('whole_of_body').GetName(GetPlayer)]的方向努力\n$BULLET_WITH_TAB$没有过度的人格特质，拥有正面压力特质，并具备[GetTrait('whole_of_body').GetName(GetPlayer)]\n$BULLET_WITH_TAB$完成一项技能的生活方式，并与世隔绝\n#bold 仪式与外丹#!\n$BULLET_WITH_TAB$收集混合地形，并拥有[GetTrait('lifestyle_gardener').GetName(GetPlayer)]或[GetTrait('lifestyle_herbalist').GetName(GetPlayer)]\n$BULLET_WITH_TAB$收集具有多种技能加成的宝物，探索[umbra|E]，或束缚死灵\n$BULLET_WITH_TAB$收集具有多种强力技能加成的宝物，或获得[spirit_companion|E]\n#bold 关系与养生#!\n$BULLET_WITH_TAB$改善你的界域并取悦你的封臣\n$BULLET_WITH_TAB$与技艺高超之人建立深厚关系\n$BULLET_WITH_TAB$获得行动的力量，并且不要"
 POD_story_elixir_of_eternal_life_explanation_stage2_brief: "达到30点[trait_level_track_xp|E]后，完成[journeys|E]以获取线索，并通过冥想使自己不断接近完美。"
 POD_story_elixir_of_eternal_life_explanation_stage2_full: "达到30点[trait_level_track_xp|E]后，你将无法再完成早期路径中的决议。取而代之的是，通过完成[journeys|E]来获取线索，并借助[decision|E]进行冥想，让自己日益臻于完美。特别博学或精通魔法之人或许能够被动研究长生药，增进学识。此外，虔诚与传奇之人会被动获得某些洞察，而可怖与暴虐之人则会发现自己步履维艰。"
 POD_story_elixir_of_eternal_life_explanation_stage3_notask: ""
 POD_story_elixir_of_eternal_life_explanation_stage3_task: "\n\n要取得进展，#T #X 生存或投降！#!#!"
 POD_story_elixir_of_eternal_life_explanation_stage4_brief: "若你能幸存下来，要么须说服八仙赐予你最后几份长生药，要么就得在幽冥地狱中开辟一片容身之地。"
 POD_story_elixir_of_eternal_life_explanation_stage4_full: "要完成长生不老药，你需要将其绑定到死者之地中的一个界域。这样的界域将成为你的[UmbraGlossary('shadow_realm')]，并提供注入你所创造的$POD_splat_mummy_plural$中的诸灵。然而，虽然法术可以绑定在任何地方，但唯有天门与无量地狱才能容纳中原不死者的灵魂。你需要说服一个界域之主将其用于炼制此药。曾有少数狂人试图同时掌握两种版本的长生不老药，但无人达成此等伟业。据说人不能侍二主；也许你会成为那个例外。"
 POD_story_pact_deadline_normal: "#N 下期贡品将于[story.MakeScope.GetVariable('years_until_obligation').GetValue|0V][Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('years_until_obligation').GetValue, '(CFixedPoint)1' ), '年', '年' )]后到期#!"
 POD_story_pact_deadline_fresh: "#N 下期贡品将于[story.MakeScope.GetVariable('frequency').GetValue|0V][Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('frequency').GetValue, '(CFixedPoint)1' ), '年', '年' )]后到期#!"
 POD_story_pact_deadline_urgent: "#X The tribute falls due within the year \nhonor the [demonic_pact_obligation|E] now or pay the price!#!"
 POD_story_pact_deadline_prohibitory: "#weak This prohibition must be upheld at all times.#!"
 POD_story_pact_deadline_completed: "The demon will demand it again in [story.MakeScope.GetVariable('years_until_obligation').GetValue|0V] [Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('years_until_obligation').GetValue, '(CFixedPoint)1' ), 'year', 'years' )]."
 POD_story_pact_deadline_completed_nodate: "#P Obligation fulfilled -- not currently due.#!"
 POD_story_pact_deadline_warning.toast: "#X [pact_demon.GetFirstName]'s pact comes due within the year.#!"
 POD_story_pact_deadline_warning_desc: "现在兑现誓言，否则将付出代价。"
 POD_maryb_story: "#glow_color:{0.75,0.5,0.21,0.5}The 黑色幻梦#!"
 POD_maryb_story_desc: "三块石板，一条通向圣索菲亚大教堂下方礼拜堂的小径。黑色玛丽再次踏足其上。"
 POD_maryb_story_custom_string: "[Story.GetOwner.Custom('POD_maryb_story_phase')]"
 POD_maryb_story_phase_seeking: "你自身的一部分散落在黎凡特的诸城之中，被封印于黏土之内。两块以你之血书写的泥版，以及一块出自已故祭司之手，正等待于#bold [GetTitleByKey('c_damascus').GetNameNoTier]#!、#bold [GetTitleByKey('c_mosul').GetNameNoTier]#!与#bold [GetTitleByKey('c_baghdad').GetNameNoTier]#!。夺取一座城，取回其泥版，她便会有更多往昔回归于你。\n\n#shinygold 一切终将引向于我，挚爱。你会明白的。#!"
 POD_maryb_story_phase_stylus: "Three tablets recovered, three buried lives remembered, and the clay of the fourth lies wet beneath her hand. There is nothing left in the Levant to find. What remains is to take up the stylus and write the ending, and to decide, with it poised above the clay, whose ending it will be.\n\n#shinygold Whenever you are ready, beloved. I have waited longer than you can know.#!"
 POD_maryb_story_phase_blackdream: "The tablets are read, the fourth is written, and the silence of the chapel belongs to you alone. Michael has an ending now. The Dream is yours now, and the only question left is how corrupt a Dream can grow before it turns to Nightmare."
 POD_maryb_story_phase_seconddream: "#shinygold 黑玛丽已死了。世间唯有幻梦，以及那位将幻梦带回的女子，如今我披上了她为我保存的肉体。你身上的巴力血脉或许仍有用处。我将把整个世界[Concept('receive_into_the_dream', '纳入幻梦')|E]之中。#!"
 POD_maryb_story_ashgold_body: "有另一个存在取代了玛丽和米迦勒，它回应这两个名字。两者都未被抹去，也未有一方获胜。它们所造之物透过一双眼睛望向外界，而操纵这双眼睛的是谁，则随不受任何意志支配的潮汐而流转。\n\n我们现在可以重建三位一体。我们需要一位[GetCourtPositionType('pillar_of_darkness_court_position').GetName()]和一位[GetCourtPositionType('pillar_of_light_court_position').GetName()]。"
 POD_maryb_story_phase_ashgold_mary: "$POD_maryb_story_ashgold_body$\n\n此刻是玛丽在向外看：眼眸陷入阴影，古老的饥渴紧紧贴着皮肤之下。"
 POD_maryb_story_phase_ashgold_michael: "$POD_maryb_story_ashgold_body$\n\n#shinygold 此刻，是米海尔在眺望：目光笃定，昔日的光辉已磨砺成璀璨的金色。#!"
 POD_maryb_story_phase_ashgold_neutral: "$POD_maryb_story_ashgold_body$"
 POD_maryb_story_balance_label: "玛丽与米迦勒"
 POD_maryb_story_balance_min_label: "#shinygold 米迦勒登顶#!"
 POD_maryb_story_balance_max_label: "#P 玛丽飞升#!"
 POD_maryb_story_tablets_label: "已复原的石板"
 POD_maryb_story_tablets_min_label: "无"
 POD_maryb_story_tablets_max_label: "全部三个"