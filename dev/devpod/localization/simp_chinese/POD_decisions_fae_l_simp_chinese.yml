 struggle_seasons_ending_compromise_decision:0 "Status Quo"
 struggle_seasons_ending_compromise_decision_desc:0 "These endless conflicts over the seasons only weaken us all. It is time to accept that the seasons were never meant to be united."
 struggle_seasons_ending_compromise_decision_tooltip:0 "结束四季[struggle|E]"
 struggle_seasons_ending_compromise_decision_confirm:0 "结束四季斗争"
 struggle_seasons_ending_conciliation_decision:0 "Seasons United"
 struggle_seasons_ending_conciliation_decision_desc:0 "The wounds of the past centuries will not be easily healed, but we must try if the seasons are to find a lasting peace. Truly, Seasons are meant to cycle."
 struggle_seasons_ending_conciliation_decision_tooltip:0 "结束四季[struggle|E]"
 struggle_seasons_ending_conciliation_decision_confirm:0 "结束四季斗争"
