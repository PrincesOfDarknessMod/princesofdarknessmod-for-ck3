 the_red_and_white_apple_of_avalon_decision:0 "阿瓦隆的红白苹果"
 the_red_and_white_apple_of_avalon_decision_desc:0 "在格拉斯顿伯里突岩的顶点坐落有两处泉水，红泉和白泉，象征着生死之力。在两处泉水的附近有着一颗全年结果的小苹果树，无论冬天，夏天亦或春天。有一半苹果是红色的，然而另一半却肤白似雪。"
 the_red_and_white_apple_of_avalon_decision_confirm:0 "摘走一个苹果"
 the_red_and_white_apple_of_avalon_decision_tooltip:0 "获得苹果宝物。"
 albion_pools_decision:0 "阿尔比恩池"
 albion_pools_decision_desc:0 "三座神秘的阿尔比恩池，在威尔士，苏格兰和布列塔尼这些地方各自藏着一座，它们是珍宝中最令法师们渴望拥有且广受欢迎的，因为据说无论谁得到全部的三池之力都能统治整个英格兰。一个传闻能让人永葆青春，一个能治愈所有创伤以及第三个据称被赋予了在凡人心灵上的控制力。至黑暗中世纪时期，已无人记得哪个池据传会造成哪种效益，虽然在多数妖精（据说是不朽的）中仍有些人记得。"
 albion_pools_decision_confirm:0 "阿尔比恩将是我的"
 albion_pools_decision_tooltip:0 "宣称阿尔比恩。"
 albion_pools_decision_custom:0 "的[realm_capital|E]位于[GetGeographicalRegion('ghw_region_britannia').GetName][region|E]"
 struggle_seasons_ending_outsider_decision_friendly_desc:0 "朋友们，不要再打斗了。"
 POD_patron_council_join_seeker_decision:0 "加入探求者"
 POD_patron_council_join_seeker_decision_desc:0 "核心派别被称为“探求者”。他们是守护者们的核心，那些最接近议会中“共同统治”制度的古老传说的妖精。他们对每个起源持有开明的观点，并且成员几乎平均来自三个起源，这些妖精真正相信共同统治可能带来的意识形态影响。探求者主要由学术派、守旧派的妖精组成，因此在公众眼中相对低调。这是守护者议会中深入研究古老传说文献，并派遣搜索者追寻即使是最模糊的历史妖精传说谣言的派别。失落的文物，讲述过去时代的脆弱手稿，甚至古老工艺的武器和物品，这些都是过去方式的线索，对于探求者的事业来说都是无价之宝。"
 POD_patron_council_join_seeker_decision_tooltip:0 "加入探求者，[patron_council|E]的派别。"
 POD_patron_council_join_seeker_decision_confirm:0 "追寻过往。"
 POD_patron_council_join_vanguard_decision:0 "加入先锋"
 POD_patron_council_join_vanguard_decision_desc:0 "先锋是守护者。至少，当提到守护者们时，绝大多数妖精会想到他们。先锋在守护者议会中担任着独特的角色，因为他们是组织的公开代表。与一个正式而团结的团体不同，先锋通常只是那些公开支持和赞美守护者美德，并支持其事业的妖精。大多数政治家、外交官、顾问和守护者议会的其他社会明星都被归为先锋一词，这个词在这“派别中的派别”之外都不会有感情色彩的运用。不用说，这个派别的成员是一个多样化的群体，拥有与妖精本身一样多样的意识形态和议程。绝大多数先锋成员并不是一个在种族真正过去问题上达成一致的有凝聚力的妖精集合体，他们只是为了一件事而参与政治游戏，那就是："
 POD_patron_council_join_vanguard_decision_tooltip:0 "加入先锋，[patron_council|E]的派别。"
 POD_patron_council_join_vanguard_decision_confirm:0 "权力。"
 POD_patron_council_join_austere_conclave_decision:0 "加入严朴密会"
 POD_patron_council_join_austere_conclave_decision_desc:0 "严朴密会并不存在。与探求者派别不同，严朴密会并不是因为任务的敏感性而隐藏，而是因为其成员积极希望如此，使其不为公众所知。\n对于整个守护者团体来说，严朴密会是危险、不可预测、不可靠、具有破坏性……但又极其有用。许多关于守护者的丑陋传闻都源自严朴密会，包括暗杀、伏击、拦截信使、泄露盟友之间的通信等等。当一个妖精对她的朋友们低声说守护者以某种原因杀死了达维娜女士时，她通常无意中指的是严朴密会的非授权行动。"
 POD_patron_council_join_austere_conclave_decision_tooltip:0 "加入严朴密会，[patron_council|E]的派别。"
 POD_patron_council_join_austere_conclave_decision_confirm:0 "肃静。"
 POD_patron_council_leave_decision:0 "离开守护者议会"
 POD_patron_council_leave_decision_desc:0 "离开守护者议会，放弃它带来的特权和义务。"
 POD_patron_council_leave_decision_tooltip:0 "我已经完成为守护者议会的义务。"
 POD_patron_council_leave_decision_confirm:0 "我不是再是守护者。"