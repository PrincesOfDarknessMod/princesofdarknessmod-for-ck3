 POD_fae_rapture_decision:0 "梦喜"
 POD_fae_rapture_decision_desc:1 "梦喜允许戚族从他们自己的想象中获得梦华。梦喜是纯粹和彻底的狂喜，因为戚族直接与梦界相连。他们天性中的两部分在一个短暂的、转瞬即逝的时刻合而为一。"
 POD_fae_rapture_decision_tooltip:1 "你将使用梦喜"
 POD_fae_rapture_decision_confirm:1 "已采集！"
