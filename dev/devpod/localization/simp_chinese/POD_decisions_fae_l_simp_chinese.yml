 pod_seasons_struggle.101.t:0 "Winter Dominance"
 pod_seasons_struggle.101.desc:0 "The chaos that the seasons suffered in the preceding centuries has left a stain in the hearts of all its inhabitants. Today begins this world's next chapter... Winter comes, and won't go."
 pod_seasons_struggle.101.a:0 "Eternal Winter"
 pod_seasons_struggle.102.t:0 "Spring Dominance"
 pod_seasons_struggle.102.desc:0 "The chaos that the seasons suffered in the preceding centuries has left a stain in the hearts of all its inhabitants. Today begins this world's next chapter... Spring has come again."
