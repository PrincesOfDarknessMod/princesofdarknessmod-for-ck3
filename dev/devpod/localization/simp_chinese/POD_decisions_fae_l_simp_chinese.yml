 struggle_seasons_ending_hostility_decision_desc:0 "No fae expected one solstice to be able to win this war, but you did, now they will listen to you as you choose which season should rule."
 struggle_seasons_ending_hostility_decision_tooltip:0 "结束四季[struggle|E]"
 struggle_seasons_ending_hostility_decision_confirm:0 "结束四季斗争"
 struggle_seasons_ending_winter_victory_decision:0 "Eternal Winter"
 struggle_seasons_ending_winter_victory_decision_desc:0 "It is time for a strong leader to finally drag the seasons from the mire of war and division. Winter comed, and won't go."
 struggle_seasons_ending_winter_victory_decision_confirm:0 "Eternal Winter"
 struggle_seasons_ending_spring_victory_decision:0 "Re-Spring"
 struggle_seasons_ending_spring_victory_decision_desc:0 "It is time for a strong leader to finally drag the seasons from the mire of war and division. Spring has come again."
