l_simp_chinese:
 predatortype_farmer_modifier: "掠食者类型：农场主"
 predatortype_farmer_modifier_desc: "这位吸血鬼更倾向于从动物身上吸食血液。"
 predatortype_bloodleech_modifier: "掠食者类型：吸蛭者"
 predatortype_bloodleech_modifier_desc: "这位吸血鬼更倾向于从其他吸血鬼身上吸食血液！"
 predatortype_phlebotomist_modifier: "掠食者类型：抽血师"
 predatortype_phlebotomist_modifier_desc: "该吸血鬼伪装成一个放血的医生来获得$pod_vitae$。"
 predatortype_bedlamite_modifier: "掠食者类型：狂人"
 predatortype_bedlamite_modifier_desc: "这位吸血鬼以疯子为猎物。他可能疯了，或至少在他的猎物看来是如此。"
 predatortype_cenobite_modifier: "掠食者类型：修道士"
 predatortype_cenobite_modifier_desc: "该吸血鬼在修道院这样的宗教机构里有[POD_herd|E]。"
 predatortype_alleycat_modifier: "掠食者类型：夜游猫"
 predatortype_alleycat_modifier_desc: "该吸血鬼跟踪并暴力攻击人类来获取血液。这是一种粗俗的做法。"
 predatortype_cauchemar_modifier: "掠食者类型：梦魇"
 predatortype_cauchemar_modifier_desc: "这种吸血鬼只以熟睡中的猎物为食。"
 predatortype_familias_modifier: "掠食者类型：掠家者"
 predatortype_familias_modifier_desc: "这位吸血鬼吸食的血液几乎来自同一个特定的家庭宗族。他可能跟这个家庭存在某种关联，起码他是这么认为的。"
 predatortype_footpad_modifier: "掠食者类型：拦路贼"
 predatortype_footpad_modifier_desc: "该嘬血佬混在社会的下级阶层中，吸取穷人的血。即使他们失踪了，当局也不会感兴趣。"
 predatortype_consensualist_modifier: "掠食者类型：顺求者"
 predatortype_consensualist_modifier_desc: "该吸血鬼从自愿者那吸食……这大大复杂化了[the_masquerade|E]在领地的掩盖。"
 predatortype_osiris_modifier: "掠食者类型：奥西里斯"
 predatortype_osiris_modifier_desc: "该吸血鬼如同上古时期一般领导着一个血之密教。血畜将他们的信仰与自身奉献于该血神。"
 predatortype_siren_modifier: "掠食者类型：塞壬"
 predatortype_siren_modifier_desc: "该吸血鬼通过迷吻来引诱爱人们并吸干他们的血。"
 predatortype_gentry_modifier: "掠食者类型：绅士"
 predatortype_gentry_modifier_desc: "这吸血鬼在人类社会中有一定的地位。他利用这种地位去猎食有钱有势的人。没有人会相信这样文雅的人是怪物。"
 predatortype_graverobber_modifier: "掠食者类型：掘墓人"
 predatortype_graverobber_modifier_desc: "这种吸血鬼会在墓地和墓穴附近徘徊，寻找新鲜的尸体或哀悼者们。"
 predatortype_extortionist_modifier: "掠食者类型：勒索者"
 predatortype_extortionist_modifier_desc: "该吸血鬼威胁并敲诈人类来获取他们的血。勒索者会提出无法被拒绝的“条件”。"