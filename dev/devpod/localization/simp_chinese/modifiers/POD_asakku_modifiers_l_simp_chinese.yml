l_simp_chinese:
 POD_asakku_phase1_reward: "基础"
 POD_asakku_phase1_reward_desc: "最初的种子已经生根发芽。如今，他人也染上了这感染，你能感受到他们每一个人，那是意识边缘隐约的脉搏。这实体以某种与满足无关的方式感到欣喜。它不过是在承认进展。"
 POD_asakku_phase3_reward: "清除西方篡位者"
 POD_asakku_phase3_reward_desc: "The western reach of the Shadow Crusade is finished. The kamuts who hunted you are gone, dead or changed. The voice in your thoughts is not satisfied. That would imply an ending."
 POD_asakku_phase4_reward: "东方清算"
 POD_asakku_phase4_reward_desc: "The east is done. The Elioud are gone. The True Hand continues, diminished and puzzled. The Watcher has what it came for. Victory for you or them? It might not matter at this point."
 POD_asakku_spread_wider: "扩大传播范围"
 POD_asakku_spread_wider_desc: "感染蔓延得更远、更快。实体已从耐心转向专注，你所播下的种子，在土壤还来不及抗拒之前，便已扎根。"
 POD_asakku_consolidated_network: "整合网络"
 POD_asakku_consolidated_network_desc: "血脉相连，同心同德。家族成员彼此注视，守望相助，任何敌对行动都发现，每一条攻击的路径，都被本不该注视着的眼睛所预料。"
 POD_asakku_press_advantage: "抓住优势"
 POD_asakku_press_advantage_desc: "The Elioud are reeling and you do not intend to let them recover. The entity drives your schemes with a sharpened urgency."
 POD_asakku_sinister_mastery_1: "阴险掌控"
 POD_asakku_sinister_mastery_1_desc: "The entity's influence sharpens your instincts for Vicissitude. The choleric arts come more naturally now."
 POD_asakku_sinister_mastery_2: "Sinister Mastery (Ascended)"
 POD_asakku_sinister_mastery_2_desc: "The entity's mastery of flesh runs deeper than any discipline. Your understanding of Vicissitude transcends what any teacher could offer."
 POD_asakku_andeleon_brood: "安德莱昂后裔"
 POD_asakku_andeleon_brood_desc: "被你腐化之人，行走世间，皆为你意志的延伸。更多的手，更多的眼，更多的你。"
 POD_asakku_occultation: "隐匿"
 POD_asakku_occultation_desc: "其中的存在教导你以与阴影无关的方式进行隐匿。你变得难以被察觉，即便是那些确切知道该往何处寻找的人也不例外。"
 POD_asakku_inner_babble: "内心碎语"
 POD_asakku_inner_babble_desc: "实体思绪的持续低语形成了一道噪音之壁，敌意计谋无法穿透。试图探入你心灵者所见的并非寂静，而是一曲合唱。\n获得#P 强力精神防护#!。"
 POD_asakku_vicissitude_taint: "易变术污染"
 POD_asakku_vicissitude_taint_desc: "鲜血已经渗入大地本身。这片土地变得奇异、戒备森严，对外来者充满敌意，其生机勃勃之处与自然界毫无关联。"
 POD_asakku_hunted: "被以利乌德追猎"
 POD_asakku_hunted_desc: "The Elioud have marked this $pod_cainite$ for elimination. Their kamuts share intelligence, and future operations against this target carry additional weight."
 POD_asakku_soul_infection_resistant: "抵御灵魂感染"
 POD_asakku_soul_infection_resistant_desc: "This $pod_cainite$ has narrowly avoided an unwanted intrusion by an alien entity. They will be more wary of such attempts in the near future."