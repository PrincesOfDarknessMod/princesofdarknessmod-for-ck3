 POD_delirium_modifier:0 "[battle_modifier|E]：妄悸"
 POD_delirium_modifier_desc:0 "妄悸是一种压倒性的本能恐惧，那些看到狼人和一些其他化兽族裔的战争形态的凡人会遭受它影响。"
 POD_ajaba_form_crinos_modifier:0 "半鬣狗形形态"
 POD_ajaba_form_anthros_modifier:0 "人鬣形形态"
 POD_ajaba_form_crocas_modifier:0 "巨鬣狗形形态"
 POD_ajaba_form_hyaenid_modifier:0 "鬣狗形形态"
 POD_bastet_form_crinos_modifier:0 "半猫形形态"
 POD_bastet_form_sokto_modifier:0 "人猫形形态"
 POD_bastet_form_chatro_modifier:0 "巨猫形形态"
 POD_bastet_form_feline_modifier:0 "猫形形态"
 POD_reduced_delirium_modifier:0 "[battle_modifier|E]：部分妄悸"
 POD_reduced_delirium_modifier_desc:0 "妄悸是一种压倒性的本能恐惧，那些看到狼人和一些其他化兽族裔的战争形态的凡人会遭受它影响。"
 POD_werewolf_form_crinos_modifier_desc:0 "战争形态，一种可怕的人与狼的混合体，具有超强的力量。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_ajaba_form_crinos_modifier_desc:0 "战争形态；比狼族相比的更小，力量更弱，但更坚韧。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_bastet_form_crinos_modifier_desc:0 "人与猫的混合体，会激发被抑制的妄悸。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_corax_form_crinos_modifier:0 "半鸦形形态"
 POD_corax_form_crinos_modifier_desc:0 "战争形态是非常笨拙的半鸟人。科拉克斯一般只用这种形态来击退敌人，使其有足够的时间逃跑，然后只在他们别无选择的时候使用。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_corax_form_corvid_modifier:0 "鸦形形态"
 POD_gurahl_form_crinos_modifier:0 "半熊形形态"
 POD_gurahl_form_crinos_modifier_desc:0 "战争形态。特别强壮和坚韧，更不用说有多巨大：身高在10到16英尺之间，体重达1200公斤。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_gurahl_form_arthren_modifier:0 "人熊形形态"
 POD_gurahl_form_bjornen_modifier:0 "巨熊形形态"
 POD_gurahl_form_urus_modifier:0 "熊形形态"
 POD_kitsune_form_koto_modifier:0 "半狐形形态"
 POD_kitsune_form_sambu_henge_modifier:0 "人狐形形态"
 POD_kitsune_form_juko_modifier:0 "巨狐形形态"
 POD_kitsune_form_kyubi_modifier:0 "狐形形态"
 POD_mokole_form_archid_modifier:0 "半龙形形态"
 POD_mokole_form_archid_modifier_desc:0 "战争形态被认为是任何个体莫科莱的“真实形态”。通过龙梦，他们梦到了过去的爬行动物、鸟类和恐龙，这决定了半龙形形态的特征。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_mokole_form_suchid_modifier:0 "龙形形态"
 POD_nagah_form_azhi_dahaka_modifier:0 "半蛇形形态"
 POD_nagah_form_azhi_dahaka_modifier_desc:0 "各个娜迦的战斗形态不同，但都有一个像眼镜蛇一样的肿胀头罩，许多人在下会给自己留下疤痕，以便在这形态更加引人注目，这形态允许极度张开下巴而不脱臼，并且有鳃（在这种形态下他们完全是两栖的）。娜迦的体重增加，但由于下半身有一条16至20英尺的尾巴，他们的手臂变得像蛇一样，因为他们的手臂上长出了脊椎骨而不是正常的骨头，使他们能更容易地抓取。蛇人的手长出了和任何狼族一样可怕的爪子，他们的鳞片和鱼鳞有一种超自然的弹性。在这种形态下，娜迦所接受的任何伤痕都很明显，通常在半蛇形形态的鳞片上出现图案。在这种形态下，娜迦会产生完全妄悸效应；很少有人类能忍受看着这样一个对蛇的原始恐惧的化身。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_nagah_form_silkaram_modifier:0 "人蛇形形态"
 POD_nagah_form_kali_dahaka_modifier:0 "巨蛇形形态"
 POD_nagah_form_vasuki_modifier:0 "蛇形形态"
 POD_nuwisha_form_mana_bozho_modifier:0 "半郊狼形形态"
 POD_nuwisha_form_mana_bozho_modifier_desc:0 "战争形态，一种可怕的人与郊狼的混合体。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_nuwisha_form_tsitsu_modifier:0 "人化郊狼形形态"
 POD_nuwisha_form_sendeh_modifier:0 "巨郊狼形形态"
 POD_nuwisha_form_latrani_modifier:0 "郊狼形形态"
 POD_ratkin_form_crinos_modifier:0 "半鼠形形态"
 POD_ratkin_form_crinos_modifier_desc:0 "战争形态，一种可怕的人与鼠的混合体\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_ratkin_form_rodens_modifier:0 "鼠形形态"
 POD_rokea_form_gladius_modifier:0 "半鲨形形态"
 POD_rokea_form_gladius_modifier_desc:0 "被称为“坚立之颚”，半鲨形像是一种十英尺长的双足鲨鱼生物。与半狼形相似，坚立之颚结合了鲨鱼的力量和人形的多功能性。这种形态会激发人类的部分妄悸。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_rokea_form_grabrus_modifier:0 "人鲨形形态"
 POD_rokea_form_chasmus_modifier:0 "巨鲨形形态"
 POD_rokea_form_squamus_modifier:0 "鲨形形态"
 POD_apis_form_crinos_modifier:0 "半牛形形态"
 POD_apis_form_aurochs_modifier:0 "牛形形态"
 POD_camazotz_form_crinos_modifier:0 "半蝙蝠形形态"
 POD_camazotz_form_crinos_modifier_desc:0 "卡玛佐兹的战争形态，一种可怕的人与蝙蝠的混合体。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_camazotz_form_apterous_modifier:0 "人蝠形形态"
 POD_camazotz_form_megachiroptera_modifier:0 "巨蝙蝠形形态"
 POD_camazotz_form_microchiroptera_modifier:0 "蝙蝠形形态"
 POD_grondr_form_crinos_modifier:0 "半猪形形态"
 POD_grondr_form_aperius_modifier:0 "人猪形形态"
 POD_grondr_form_daeodon_modifier:0 "巨猪形形态"
 POD_grondr_form_scrofa_modifier:0 "猪形形态"
 POD_ananasi_form_lilian_modifier:0 "半蛛形形态"
 POD_ananasi_form_lilian_modifier_desc:0 "一种人类与蜘蛛的混合形态，每个阿南西的形态不一定相同。有些是具有多条肢体的人体，而有些人的躯干化为巨型蜘蛛的腹部。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_ananasi_form_pithus_modifier:0 "巨蛛形形态"
 POD_ananasi_form_crawlerling_modifier:0 "蛛形形态"
 POD_bastet_form_chatro_modifier_desc:0 "原猫形态，激发了完全的妄悸。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_rokea_form_grabrus_modifier_desc:0 "也被称为“圆背”，这种形状通常只为陆上居住的罗基阿所知——对居住在海洋的鲨人没有什么用。失去了所有的体毛，变得比她的人形形态更丑。他或她的肌肉质量增加一倍，背部开始形成背鳍而变宽。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_rokea_form_chasmus_modifier_desc:0 "罗基阿称之为“战斗之颚”的形态是一种史前噩梦，会引起人类的全面妄悸。罗基阿变成了她的血种形态的巨大版本，比她的鲨鱼形形态又大了一半。罗基阿以这种形态进行水下战斗。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_ananasi_form_pithus_modifier_desc:0 "一只巨大的蜘蛛，至少有人形时的一半重量。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
 POD_werewolf_form_glabro_modifier_desc:0 "大致上类似于人类，但有过多的兽性特征。"
 POD_werewolf_form_hispo_modifier_desc:0 "史前恐狼。"
 POD_werewolf_form_lupus_modifier_desc:0 "与普通狼无异，但速度超群。"
 POD_ajaba_form_anthros_modifier_desc:0 "类人形态。"
 POD_ajaba_form_crocas_modifier_desc:0 "类鬣狗形态。一只小熊般大小的巨大鬣狗。"
 POD_ajaba_form_hyaenid_modifier_desc:0 "鬣狗形态。"
 POD_bastet_form_sokto_modifier_desc:0 "类人形态。"
 POD_bastet_form_feline_modifier_desc:0 "普通猫咪。"
 POD_corax_form_corvid_modifier_desc:0 "鸦子的外形与普通乌鸦基本相同，但科拉克斯是一种特别大的鸟类，体型更接近于老鹰。"
 POD_gurahl_form_arthren_modifier_desc:0 "类人形态。人熊形形态的古拉赫勒比人狼形形态的狼人要强壮和坚韧得多，人们认为是大脚野人和类似生物传说的灵感来源。"
 POD_gurahl_form_bjornen_modifier_desc:0 "类熊形态。类似于远古洞穴熊，拥有更长的爪子和獠牙，体型和力量几乎与半狼形不相上下，所造成的咬伤和爪伤更加凶狠。"
 POD_gurahl_form_urus_modifier_desc:0 "拟熊形态。古拉赫勒人子的熊形态与其部族相匹配。"
 POD_kitsune_form_koto_modifier_desc:0 "人与狐狸的混合体。"
 POD_kitsune_form_sambu_henge_modifier_desc:0 "类人形态。"
 POD_kitsune_form_juko_modifier_desc:0 "狼一样大的狐狸。"
 POD_kitsune_form_kyubi_modifier_desc:0 "普通狐狸。"
 POD_mokole_form_suchid_modifier_desc:0 "龙子的外形通常是鳄鱼、短吻鳄、吉拉怪兽（吉拉毒蜥的别称）或类似的大型爬行动物。他们的外形反映了莫科莱的变种。"
 POD_mokole_form_reptoid_modifier:0 "人龙形形态"
 POD_mokole_form_reptoid_modifier_desc:0 "介于人形和龙形之间的“人龙形”（类似于狼族的人狼形形态）。"
 POD_mokole_form_drachid_modifier:0 "真龙人形态"
 POD_mokole_form_drachid_modifier_desc:0 "传说中的真龙人形态（一种能够使用复杂工具的人形形态）在天工事件中消失了，此后没有任何莫科莱能够达到这种形态。"
 POD_nagah_form_silkaram_modifier_desc:0 "他们的外表几乎与人类无异，但头发和皮肤被小鳞片取代，脸变平，眼睛变得更像蛇，牙齿融合在一起，只有两颗獠牙像眼镜蛇一样缩了回去。在这种形态下，他们会获得一种对凡人甚至亡灵都很危险的毒液。"
 POD_nagah_form_kali_dahaka_modifier_desc:0 "与巨蛇相似，但有两点不同：它们比普通眼镜蛇大得多，而且长有巨大的毒牙。在原始状态下，它们可以长出一双细长的手臂。这种形态还长有鳃，可以在水下呼吸。"
 POD_nagah_form_vasuki_modifier_desc:0 "与普通眼镜蛇、响尾蛇、棉嘴蛇或其他品种形态无异。"
 POD_nuwisha_form_tsitsu_modifier_desc:0 "类人形态。"
 POD_nuwisha_form_sendeh_modifier_desc:0 "类郊狼形态。"
 POD_nuwisha_form_latrani_modifier_desc:0 "郊狼形态。"
 POD_ratkin_form_ratman_modifier:0 "人鼠形形态"
 POD_ratkin_form_ratman_modifier_desc:0 "具有细微老鼠特征的人类，与狼族的人狼形形态相似。"
 POD_ratkin_form_rat_thing_modifier:0 "巨鼠形形态"
 POD_ratkin_form_rat_thing_modifier_desc:0 "一种体型与大狗相当的巨鼠，与狼族的巨狼形形态相似。"
 POD_ratkin_form_rodens_modifier_desc:0 "大小不一的老鼠。"
 POD_ratkin_form_itchy_modifier:0 "橡皮管形态"
 POD_ratkin_form_itchy_modifier_desc:0 "鼠人甚至开始像卡通老鼠一样移动，变成了经典动画片中老鼠的一种形态。"
 POD_rokea_form_squamus_modifier_desc:0 "这种鲨鱼也被称为“会游泳的大白鲨”，与罗基阿品种中的普通鲨鱼没有区别。"
 POD_apis_form_crinos_modifier_desc:0 "又称弥诺陶洛斯形态，是一种长着锋利牙齿的巨大牛人"
 POD_apis_form_aurochs_modifier_desc:0 "动物形态。"
 POD_camazotz_form_apterous_modifier_desc:0 "外形近似人类，不会飞，但爬行能力特别好。"
 POD_camazotz_form_megachiroptera_modifier_desc:0 "一只翼展五英尺的巨型蝙蝠。"
 POD_camazotz_form_microchiroptera_modifier_desc:0 "一个将卡玛佐兹分裂成十几只小蝙蝠的蜂群形态。"
 POD_grondr_form_crinos_modifier_desc:0 "可怕的野猪头人形怪物"
 POD_grondr_form_aperius_modifier_desc:0 "类人形态。"
 POD_grondr_form_daeodon_modifier_desc:0 "巨大的史前食肉野猪。"
 POD_grondr_form_scrofa_modifier_desc:0 "野猪形态。"
 POD_ananasi_form_crawlerling_modifier_desc:0 "蜘蛛形态。在化兽族裔中独一无二的是，阿南西不会单变成一只动物，而是由数百只蜘蛛组成的蜘蛛群。这使它们很难被杀死，不过如果大量的蜘蛛群被杀死，阿南西可能会失去其他形态的记忆、技能和质量。"
 POD_ananasi_form_araneid_modifier:0 "人蛛形形态"
 POD_ananasi_form_araneid_modifier_desc:0 "蛛族在人形和半蛛形之间发展出一种类似人狼形的形态。"
 POD_ananasi_form_titaniform_modifier:0 "泰坦形态"
 POD_ananasi_form_titaniform_modifier_desc:0 "阿南西化为一种巨大的生物，有四条蜘蛛的腿，四根人的胳膊，八只发亮的红眼，以及巨大的獠牙，身上覆盖着厚厚的壳质铠甲。\n#weak 战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。#!"
