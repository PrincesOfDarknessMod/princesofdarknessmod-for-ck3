 POD_thought_form_of_the_twelve_ministers_modifier:0 "真灵平衡"
 the_paradox_of_time_perk_modifier:0 "战斗修正：对矛盾感到困惑"
 mousemaze_perk_modifier:0 "战斗修正：被困鼠迷宫所迷惑"
 call_to_battle_perk_modifier:0 "战斗修正：听到战争呼唤"
 POD_delirium_modifier:0 "战斗修正：妄悸"
 POD_delirium_modifier_desc:0 "妄悸是一种压倒性的本能恐惧，那些看到狼人和一些其他化兽族裔的战争形态的凡人会遭受它影响。"
 POD_ajaba_form_crinos_modifier:0 "半鬣狗形形态"
 POD_ajaba_form_anthros_modifier:0 "人鬣形形态"
 POD_ajaba_form_crocas_modifier:0 "巨鬣狗形形态"
 POD_ajaba_form_hyaenid_modifier:0 "鬣狗形形态"
 POD_bastet_form_crinos_modifier:0 "半猫形形态"
 POD_bastet_form_sokto_modifier:0 "人猫形形态"
 POD_bastet_form_chatro_modifier:0 "巨猫形形态"
 POD_bastet_form_feline_modifier:0 "猫形形态"
 POD_reduced_delirium_modifier:0 "战斗修正：部分妄悸"
 POD_reduced_delirium_modifier_desc:0 "妄悸是一种压倒性的本能恐惧，那些看到狼人和一些其他化兽族裔的战争形态的凡人会遭受它影响。"
 POD_werewolf_form_crinos_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n战争形态，一种可怕的人与狼的混合体，具有超强的力量。"
 POD_ajaba_form_crinos_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n战争形态；比狼族相比的更小，力量更弱，但更坚韧。"
 POD_bastet_form_crinos_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n人与猫的混合体，会激发被抑制的妄悸。"
 POD_corax_form_crinos_modifier:0 "半鸦形形态"
 POD_corax_form_crinos_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。\n半鸦形形态是一种非常笨拙的半鸟人。科拉克斯一般只用这种形态来击退敌人，使其有足够的时间逃跑，然后只在他们别无选择的时候使用。"
 POD_corax_form_corvid_modifier:0 "鸦形形态"
 POD_gurahl_form_crinos_modifier:0 "半熊形形态"
 POD_gurahl_form_crinos_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。\n战争形态。特别强壮和坚韧，更不用说有多巨大：身高在10到16英尺之间，体重达1200公斤。"
 POD_gurahl_form_arthren_modifier:0 "人熊形形态"
 POD_gurahl_form_bjornen_modifier:0 "巨熊形形态"
 POD_gurahl_form_urus_modifier:0 "熊形形态"
 POD_kitsune_form_koto_modifier:0 "半狐形形态"
 POD_kitsune_form_sambu_henge_modifier:0 "人狐形形态"
 POD_kitsune_form_juko_modifier:0 "巨狐形形态"
 POD_kitsune_form_kyubi_modifier:0 "狐形形态"
 POD_mokole_form_archid_modifier:0 "半龙形形态"
 POD_mokole_form_archid_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n战争形态被认为是任何个体莫科莱的“真实形态”。通过龙梦，他们梦到了过去的爬行动物、鸟类和恐龙，这决定了半龙形形态的特征。"
 POD_mokole_form_suchid_modifier:0 "龙形形态"
 POD_nagah_form_azhi_dahaka_modifier:0 "半蛇形形态"
 POD_nagah_form_azhi_dahaka_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n各个娜迦的战斗形态不同，但都有一个像眼镜蛇一样的肿胀头罩，许多人在下会给自己留下疤痕，以便在这形态更加引人注目，这形态允许极度张开下巴而不脱臼，并且有鳃（在这种形态下他们完全是两栖的）。娜迦的体重增加，但由于下半身有一条16至20英尺的尾巴，他们的手臂变得像蛇一样，因为他们的手臂上长出了脊椎骨而不是正常的骨头，使他们能更容易地抓取。蛇人的手长出了和任何狼族一样可怕的爪子，他们的鳞片和鱼鳞有一种超自然的弹性。在这种形态下，娜迦所接受的任何伤痕都很明显，通常在半蛇形形态的鳞片上出现图案。在这种形态下，娜迦会产生完全妄悸效应；很少有人类能忍受看着这样一个对蛇的原始恐惧的化身。"
 POD_nagah_form_silkaram_modifier:0 "人蛇形形态"
 POD_nagah_form_kali_dahaka_modifier:0 "巨蛇形形态"
 POD_nagah_form_vasuki_modifier:0 "蛇形形态"
 POD_nuwisha_form_mana_bozho_modifier:0 "半郊狼形形态"
 POD_nuwisha_form_mana_bozho_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。\n战争形态，一种可怕的人与郊狼的混合体。"
 POD_nuwisha_form_tsitsu_modifier:0 "人化郊狼形形态"
 POD_nuwisha_form_sendeh_modifier:0 "巨郊狼形形态"
 POD_nuwisha_form_latrani_modifier:0 "郊狼形形态"
 POD_ratkin_form_crinos_modifier:0 "半鼠形形态"
 POD_ratkin_form_crinos_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。\n战争形态，一种可怕的人与鼠的混合体"
 POD_ratkin_form_rodens_modifier:0 "鼠形形态"
 POD_rokea_form_gladius_modifier:0 "半鲨形形态"
 POD_rokea_form_gladius_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n被称为“坚立之颚”，半鲨形像是一种十英尺长的双足鲨鱼生物。与半狼形相似，坚立之颚结合了鲨鱼的力量和人形的多功能性。这种形态会激发人类的部分妄悸。"
 POD_rokea_form_grabrus_modifier:0 "人鲨形形态"
 POD_rokea_form_chasmus_modifier:0 "巨鲨形形态"
 POD_rokea_form_squamus_modifier:0 "鲨形形态"
 POD_apis_form_crinos_modifier:0 "半牛形形态"
 POD_apis_form_aurochs_modifier:0 "牛形形态"
 POD_camazotz_form_crinos_modifier:0 "半蝙蝠形形态"
 POD_camazotz_form_crinos_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n卡玛佐兹的战争形态，一种可怕的人与蝙蝠的混合体"
 POD_camazotz_form_apterous_modifier:0 "人蝠形形态"
 POD_camazotz_form_megachiroptera_modifier:0 "巨蝙蝠形形态"
 POD_camazotz_form_microchiroptera_modifier:0 "蝙蝠形形态"
 POD_grondr_form_crinos_modifier:0 "半猪形形态"
 POD_grondr_form_aperius_modifier:0 "人猪形形态"
 POD_grondr_form_daeodon_modifier:0 "巨猪形形态"
 POD_grondr_form_scrofa_modifier:0 "猪形形态"
 POD_ananasi_form_lilian_modifier:0 "半蛛形形态"
 POD_ananasi_form_lilian_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n一种人类与蜘蛛的混合形态，每个阿南西的形态不一定相同。有些是具有多条肢体的人体，而有些人的躯干化为巨型蜘蛛的腹部。"
 POD_ananasi_form_pithus_modifier:0 "巨蛛形形态"
 POD_ananasi_form_crawlerling_modifier:0 "蛛形形态"
 POD_bastet_form_chatro_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。\n原猫形态，激发了完全的妄悸。"
 POD_rokea_form_grabrus_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip]修正。\n也被称为“圆背”，这种形状通常只为陆上居住的罗基阿所知——对居住在海洋的鲨人没有什么用。失去了所有的体毛，变得比她的人形形态更丑。他或她的肌肉质量增加一倍，背部开始形成背鳍而变宽。"
 POD_rokea_form_chasmus_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n罗基阿称之为“战斗之颚”的形态是一种史前噩梦，会引起人类的全面妄悸。罗基阿变成了她的血种形态的巨大版本，比她的鲨鱼形形态又大了一半。罗基阿以这种形态进行水下战斗。"
 POD_ananasi_form_pithus_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n一只巨大的蜘蛛，至少有人形时的一半重量。"
 POD_werewolf_form_glabro_modifier_desc:0 "大致上类似于人类，但有过多的兽性特征。"
 POD_werewolf_form_hispo_modifier_desc:0 "史前恐狼。"
 POD_werewolf_form_lupus_modifier_desc:0 "与普通狼无异，但速度超群。"
 POD_ajaba_form_anthros_modifier_desc:0 "类人形态。"
 POD_ajaba_form_crocas_modifier_desc:0 "Near-hyena form. An enormous hyena the size of a small bear."
 POD_ajaba_form_hyaenid_modifier_desc:0 "鬣狗形态。"
 POD_bastet_form_sokto_modifier_desc:0 "类人形态。"
 POD_bastet_form_feline_modifier_desc:0 "普通猫咪。"
 POD_corax_form_corvid_modifier_desc:0 "The Corvid form is essentially that of a common raven, though Corax are particularly large birds that are closer in size to eagles."
 POD_gurahl_form_arthren_modifier_desc:0 "Near-man form. Considerably stronger and tougher than the glabro form of werewolves, Gurahl in Arthren form are thought to have inspired legends of the Sasquatch and similar creatures."
 POD_gurahl_form_bjornen_modifier_desc:0 "Near-bear form. Resembling an ancient cave bear, with longer claws and fangs, the Bjornen form is almost as large and powerful as Crinos, with even more vicious bite and claw damage."
 POD_gurahl_form_urus_modifier_desc:0 "Bear form. Homid Gurahl take the form of bears matching their Tribe."
 POD_kitsune_form_koto_modifier_desc:0 "人与狐狸的混合体。"
 POD_kitsune_form_sambu_henge_modifier_desc:0 "类人形态。"
 POD_kitsune_form_juko_modifier_desc:0 "狼一样大的狐狸。"
 POD_kitsune_form_kyubi_modifier_desc:0 "普通狐狸。"
 POD_mokole_form_suchid_modifier_desc:0 "The Suchid form is typically that of a crocodile, alligator, gila monster, or similar large reptile. The Suchid form reflects on the varna of the Mokolé."
 POD_mokole_form_reptoid_modifier:0 "人龙形形态"
 POD_mokole_form_reptoid_modifier_desc:0 "介于人形和龙形之间的“人龙形”（类似于狼族的人狼形形态）。"
 POD_mokole_form_drachid_modifier:0 "真龙人形态"
 POD_mokole_form_drachid_modifier_desc:0 "传说中的真龙人形态（一种能够使用复杂工具的人形形态）在天工事件中消失了，此后没有任何莫科莱能够达到这种形态。"
 POD_nagah_form_silkaram_modifier_desc:0 "Almost human in appearance, but hair and skin are replaced with small scales, the face flattens and the eyes become more snake like, the teeth fuse together except for two fangs which retract like a cobras. In this form, they gain a venom dangerous to mortals and even the undead."
 POD_nagah_form_kali_dahaka_modifier_desc:0 "Resembles a giant snake with two differences; they are much larger than any normal cobra, and they have large venomous fangs. With a Primal-urge, they can sprout a slender set of arms. This form also has gills and can breathe underwater."
 POD_nagah_form_vasuki_modifier_desc:0 "Indistinguishable from a normal cobra, rattler, cottonmouth, or other breed form."
 POD_nuwisha_form_tsitsu_modifier_desc:0 "类人形态。"
 POD_nuwisha_form_sendeh_modifier_desc:0 "类郊狼形态。"
 POD_nuwisha_form_latrani_modifier_desc:0 "郊狼形态。"
 POD_ratkin_form_ratman_modifier:0 "人鼠形形态"
 POD_ratkin_form_ratman_modifier_desc:0 "A human with subtle rat features, similar to the Garou's Glabro form."
 POD_ratkin_form_rat_thing_modifier:0 "巨鼠形形态"
 POD_ratkin_form_rat_thing_modifier_desc:0 "A monstrous rat the size of a large dog, similar to the Garou's Hispo form."
 POD_ratkin_form_rodens_modifier_desc:0 "大小不一的老鼠。"
 POD_ratkin_form_itchy_modifier:0 "橡皮管形态"
 POD_ratkin_form_itchy_modifier_desc:0 "The wererat even begins to move like a cartoon mouse, change into a form of Mouse in classic cartoons."
 POD_rokea_form_squamus_modifier_desc:0 "Also referred to as \"Swimming Jaws\", this form is indistinguishable from a normal shark of the Rokea's species."
 POD_apis_form_crinos_modifier_desc:0 "Also called the Minotaur, a huge bullman with sharp teeth"
 POD_apis_form_aurochs_modifier_desc:0 "动物形态。"
 POD_camazotz_form_apterous_modifier_desc:0 "Near-human, who could not fly, but climb exceptionally well."
 POD_camazotz_form_megachiroptera_modifier_desc:0 "A giant bat with a wingspan of 5 feet."
 POD_camazotz_form_microchiroptera_modifier_desc:0 "A swarm form that split the Camazotz into a dozen small bats."
 POD_grondr_form_crinos_modifier_desc:0 "Terrible, boar-headed humanoid."
 POD_grondr_form_aperius_modifier_desc:0 "类人形态。"
 POD_grondr_form_daeodon_modifier_desc:0 "Huge, prehistoric, carnivorous boar."
 POD_grondr_form_scrofa_modifier_desc:0 "野猪形态。"
 POD_ananasi_form_crawlerling_modifier_desc:0 "The spider form. Unique among the Fera, Ananasi do not transform into a single animal, but rather a swarm of hundreds of spiders. This makes them very difficult to kill, though if significant numbers of the swarm spiders are killed the Ananasi may lose memories, skills and mass in her other forms."
 POD_ananasi_form_araneid_modifier:0 "人蛛形形态"
 POD_ananasi_form_araneid_modifier_desc:0 "The Damhàn develops a Glabro-like form between Homid and Lilian."
 POD_ananasi_form_titaniform_modifier:0 "泰坦形态"
 POD_ananasi_form_titaniform_modifier_desc:0 "战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip]修正。\n阿南西化为一种巨大的生物，有四条蜘蛛的腿，四根人的胳膊，八只发亮的红眼，以及巨大的獠牙，身上覆盖着厚厚的壳质铠甲。"