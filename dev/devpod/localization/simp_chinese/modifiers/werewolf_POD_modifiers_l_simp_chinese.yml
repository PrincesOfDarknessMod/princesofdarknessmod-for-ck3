 POD_ananasi_form_swarmform_modifier: "虫群形态"
 POD_ananasi_form_swarmform_modifier_desc: "A roiling horde of spiders with the same mass as a human being, rising over corners and spreading with superb capacity to cover ground and evade death."
 POD_ananasi_form_microform_modifier: "小虫形态"
 POD_ananasi_form_microform_modifier_desc: "A single natural spider, unassuming if creepy, but largely forgetable with unparalled capacity for stealth."
 POD_ananasi_form_macroform_modifier: "巨虫形态"
 POD_ananasi_form_macroform_modifier_desc: "A collossal spider the size of a rhino, the Macroform is a terrible colossus of death and destruction.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_ananasi_form_warform_modifier: "战争形态"
 POD_ananasi_form_warform_modifier_desc: "Different for every Ananasi, the War Form is their analogy to Crinos, representing a spider form roughly the size of a gorilla with human elements such as hands, centauroid body plans, and a mix of spider and human anatomy.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_eshieho_form_swarmform_modifier: "虫群形态"
 POD_eshieho_form_swarmform_modifier_desc: "A scuttling mass of Crayfish of a menagerie of colors, the Eshieho Swarm Form is that of a large collection of various forms for a menagerie of smaller tasks the Eshieho might need done."
 POD_eshieho_form_microform_modifier: "小虫形态"
 POD_eshieho_form_microform_modifier_desc: "A single Crayfish smaller than a human hand, the Eshieho in Micro Form is very easy to miss for anyone passing by a river."
 POD_eshieho_form_macroform_modifier: "巨虫形态"
 POD_eshieho_form_macroform_modifier_desc: "A rhino sized crustacean with slim claws and flicking antennae, the Eshieho Macro Form is a terrible mix of elegance and power.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_eshieho_form_warform_modifier: "战争形态"
 POD_eshieho_form_warform_modifier_desc: "A centauroid crustacean with both manipulating hands and claws, the War Form of the Eshieho is a dextrous and strong shape for them to take when duty calls.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_eshieho_form_titaniform_modifier: "泰坦形态"
 POD_eshieho_form_titaniform_modifier_desc: "Resembling their creator, the Eshieho Titaniform is a ten legged colossus the size of an elephant with shell clad arms and two piercing claws, with bulbous eyes surveying and watching for all who would challenge C'et.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_mishaho_form_swarmform_modifier: "虫群形态"
 POD_mishaho_form_swarmform_modifier_desc: "A collection of hundreds of smaller crabs, the scuttling and evasive mass of crabs that is the Mishaho Swarm Form is a rave of scuttles and pincers."
 POD_mishaho_form_microform_modifier: "小虫形态"
 POD_mishaho_form_microform_modifier_desc: "A singular crab, the Micro Form is a safe form for a Mishaho to take when they want to be alone and unnoticed, especially when staying close to the shore."
 POD_mishaho_form_macroform_modifier: "巨虫形态"
 POD_mishaho_form_macroform_modifier_desc: "A crab nearly the size of a hippo, the Mishaho Macro Form is a great beast of power and durability, with it's unique shape hard to effectively strike beyond its well armored legs.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_mishaho_form_warform_modifier: "战争形态"
 POD_mishaho_form_warform_modifier_desc: "A mix of human and crab, the Mishaho War Form is composed of that of the best elements of the crab and human body, taking a menagerie of shapes varying from Mishaho to Mishaho.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_mishaho_form_titaniform_modifier: "泰坦形态"
 POD_mishaho_form_titaniform_modifier_desc: "Shaped in the image of Crab herself, the Titaniform of the Mishaho is simple but takes the end form of life. A colossal crab large enough to host an island on it, with claws that can smash boulders and legs that tower over trees.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_bahaesh_form_swarmform_modifier: "虫群形态"
 POD_bahaesh_form_swarmform_modifier_desc: "One of the least dense swarms among the Éntomos, the Bahaesh Swarm Form is a hundred or so lobsters under a single mind."
 POD_bahaesh_form_microform_modifier: "小虫形态"
 POD_bahaesh_form_microform_modifier_desc: "Unassuming and delicious, the Micro Form of the Bahaesh is that of a simple and singular lobster, allowing them to hide among others and at sea without their foes being any wiser to their secrecy."
 POD_bahaesh_form_macroform_modifier: "巨虫形态"
 POD_bahaesh_form_macroform_modifier_desc: "A tremendously large lobster the size of a draft horse with two claws of the same size, the Macro Form of the Bahaesh are the ones with the greatest natural claws, able to split steel with a press.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_bahaesh_form_warform_modifier: "战争形态"
 POD_bahaesh_form_warform_modifier_desc: "A scuttling and upright beast of power, the Bahaesh War Form is a form that emphasizes the strength of their claws mixed with the versatility of the human form.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_bahaesh_form_titaniform_modifier: "泰坦形态"
 POD_bahaesh_form_titaniform_modifier_desc: "A behemoth of shell and meat, the Bahaesh Titaniform is defined by it's claws the size of trebuchets, on a massive lobster's body in order to support their terrible power.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_ishihambi_form_swarmform_modifier: "虫群形态"
 POD_ishihambi_form_swarmform_modifier_desc: "A cloud of moths of varying colors and varieties and types, the Ishihambi Swarm Form is ethereally beautiful in it's twists of color."
 POD_ishihambi_form_microform_modifier: "小虫形态"
 POD_ishihambi_form_microform_modifier_desc: "No different than an ordinary moth of the Ishihambi's native species, the Micro Form of the Ishihambi is nonetheless one of profound freedom and liberation."
 POD_ishihambi_form_macroform_modifier: "巨虫形态"
 POD_ishihambi_form_macroform_modifier_desc: "A moth the size of a condor with wings larger than a parachute, the Macro Form of the Weaver's Sovereigns is one befitting their majesty.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_ishihambi_form_warform_modifier: "战争形态"
 POD_ishihambi_form_warform_modifier_desc: "Unique among the Éntomos as a wholly bipedal build, the Ishihambi War Form is that of a humanoid with moth characteristics, relatively human sized but with wings large enough to propel them into flight.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_ishihambi_form_titaniform_modifier: "泰坦形态"
 POD_ishihambi_form_titaniform_modifier_desc: "A behemoth of radiant fur and brightly colored wings, the Titaniform of the Ishihambi is a normal moth upscaled to be able to lift an orca from the water, with all their beauty translated to raw power.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_iqhawe_form_swarmform_modifier: "虫群形态"
 POD_iqhawe_form_swarmform_modifier_desc: "A flurry of mantises in a cluster of legs and arms, the Iqhawe Swarm Form isn't very subtle, but it accomplishes the valuable goal of being difficult to kill and able to spread their consciousness afar."
 POD_iqhawe_form_microform_modifier: "小虫形态"
 POD_iqhawe_form_microform_modifier_desc: "A single Mantis, the Iqhawe Micro Form is unendeniably the most lethal enemy on the Micro scale, nimble ambush predators for killing other Micro Éntomos while retaining the benefits of stealth."
 POD_iqhawe_form_macroform_modifier: "巨虫形态"
 POD_iqhawe_form_macroform_modifier_desc: "A lumbering mantis form the size of a draft horse with tearing limbs the lengths of war cleavers, the Macro Iqhawe is a brutal killing machine, adept at tearing people apart.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_iqhawe_form_warform_modifier: "战争形态"
 POD_iqhawe_form_warform_modifier_desc: "Unique among the Éntomos for having a shared form in their War Form, the Iqhawe War Form has their forward arms converted into lethal blades, adept at dueling and slashing their foes to pieces.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_iqhawe_form_titaniform_modifier: "泰坦形态"
 POD_iqhawe_form_titaniform_modifier_desc: "A mammoth of a praying mantis in the form of their creator, the Titaniform Iqhawe is a swinger of limbs that clear forests in single slash, able to smash through all foes that stand in the Weaver's Champions' way.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_umakhi_form_swarmform_modifier: "虫群形态"
 POD_umakhi_form_swarmform_modifier_desc: "An entire colony of Termites, the Umakhi Swarm Form is the bane of all wooden structures, and the most effective swarm at building things."
 POD_umakhi_form_microform_modifier: "小虫形态"
 POD_umakhi_form_microform_modifier_desc: "Either a single King or Queen termite, the Micro Umakhi is regal for termites, but extremely tiny, and incredibly easy to overlook as they hide underground."
 POD_umakhi_form_macroform_modifier: "巨虫形态"
 POD_umakhi_form_macroform_modifier_desc: "A colossal termite of the Warrior bodyplan, the Umakhi Macro Form has weaponized the acid spouts on their heads to unleash a torrent of pain.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_umakhi_form_warform_modifier: "战争形态"
 POD_umakhi_form_warform_modifier_desc: "A mish mash of caste shapes from Termites on a centauroid bodyplan, the Umahki War Form is a dervish of acid and jaws to destroy all foes to their civilization.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_umakhi_form_titaniform_modifier: "泰坦形态"
 POD_umakhi_form_titaniform_modifier_desc: "A termite warrior the size of the long extinct wooly mammoths, with an acid sprout the size of a greek fire thrower, the Umakhi Titaniform is a death hose of acid and pain.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_umlimi_form_swarmform_modifier: "虫群形态"
 POD_umlimi_form_swarmform_modifier_desc: "Taking the form of the bane of early human civilization, the Umlimi becomes a swarm of locusts, rending all agriculture before them to be harvested for the Umlimi's own ends."
 POD_umlimi_form_microform_modifier: "小虫形态"
 POD_umlimi_form_microform_modifier_desc: "Inconspicuous and easily forgettable, the Umlimi Micro Form is a single locust or grasshopper, easily disappearing into the thrush and grasses."
 POD_umlimi_form_macroform_modifier: "巨虫形态"
 POD_umlimi_form_macroform_modifier_desc: "Like their Micro Form scaled to the size of a mule with legs stronger than a kangaroo, a single bladed kick from a Macro Umlimi could flense someone into viscera.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_umlimi_form_warform_modifier: "战争形态"
 POD_umlimi_form_warform_modifier_desc: "Resembling a multitude of different arrays of human and locust, the gaunt shapes they often take reveal their unending and voracious hunger.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_umlimi_form_titaniform_modifier: "泰坦形态"
 POD_umlimi_form_titaniform_modifier_desc: "A horrifying amalgam of mouths and bladed legs spinning in a hurricane of death with millions of locusts swarming around it, the Umlimi Titaniform is famine incarnate.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_umbulali_form_swarmform_modifier: "虫群形态"
 POD_umbulali_form_swarmform_modifier_desc: "Nightmare incarnate, the Umbulali Swarm Form is that of an entire hive of wasps in a cloud of death and hate, moving through the air with a single mind's direction."
 POD_umbulali_form_microform_modifier: "小虫形态"
 POD_umbulali_form_microform_modifier_desc: "Barring the general natural shock of being near a wasp, the Micro Form is the Umbulali's stealthiest form, being that of a single dour wasp."
 POD_umbulali_form_macroform_modifier: "巨虫形态"
 POD_umbulali_form_macroform_modifier_desc: "Terror made manifest, the Umbulali Macro Form is a wasp the size of a buffalo, with a stinger larger than a great lance and jaws like a serrated vice grip, evoking terror in all sorry mortals who see it.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_umbulali_form_warform_modifier: "战争形态"
 POD_umbulali_form_warform_modifier_desc: "A blend of human and wasp, the sheer determination of a wasp with the terrible inclinations of humanity makes for a terrifying form.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_umbulali_form_titaniform_modifier: "泰坦形态"
 POD_umbulali_form_titaniform_modifier_desc: "The cruelest incarnation of the Weaver's Fury, the Umbulali Titaniform is a dinosaur sized wasp, with a stinger so large it could pierce through an elephant, with all the same fury that a hornet would have.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_umhloli_form_swarmform_modifier: "虫群形态"
 POD_umhloli_form_swarmform_modifier_desc: "An entire ant colony made manifest, the Umhloli Swarm Form is that of a collective hive working together under one mind."
 POD_umhloli_form_microform_modifier: "小虫形态"
 POD_umhloli_form_microform_modifier_desc: "Almost always an Ant Queen and blessed with her wings, the Umhloli Micro Form is the most regal shape alongside flight and fecundity."
 POD_umhloli_form_macroform_modifier: "巨虫形态"
 POD_umhloli_form_macroform_modifier_desc: "A massive soldier ant with tremendous strength and determination, the Umhloli Macro Form is implacable and determined, even if it is the smallest of the Éntomos Macro Forms.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_umhloli_form_warform_modifier: "战争形态"
 POD_umhloli_form_warform_modifier_desc: "The most insectile of the Éntomos War Forms, the Umhloli War Form is ever changing and drawing upon the ever changing diversity of ants to overcome any challenge before them.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_umhloli_form_titaniform_modifier: "泰坦形态"
 POD_umhloli_form_titaniform_modifier_desc: "A lumbering titan of chitin and power, the Umhloli Titaniform is a kind of power the Umhloli rarely know, as the ant the size of an orca with wings the size of fields thunders into battle.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_injiki_form_swarmform_modifier: "虫群形态"
 POD_injiki_form_swarmform_modifier_desc: "An entire beehive worth of bees, the Injiki Swarm Form is a cloud of pollen and wings, perfect for many uses where being a cloud is ideal."
 POD_injiki_form_microform_modifier: "小虫形态"
 POD_injiki_form_microform_modifier_desc: "Usually that of a single Queen Bee or Bee Drone, the Micro Form of the Injiki is industrious and austere even despite its side."
 POD_injiki_form_macroform_modifier: "巨虫形态"
 POD_injiki_form_macroform_modifier_desc: "A pillar of pollen and nectar falling from a huge bee with the ability to produce enough honey to drown a Gurahl, the Macro Injiki is a sight to behold.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_injiki_form_warform_modifier: "战争形态"
 POD_injiki_form_warform_modifier_desc: "Different for every Injiki, the Injiki War Form is their idea of the ideal mix of industry and battle between the benefits of both the human and bee form.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_injiki_form_titaniform_modifier: "泰坦形态"
 POD_injiki_form_titaniform_modifier_desc: "When the Injiki Titaniform is near, the smell of honey is perceptible miles away, as the Weaver's Farmers take to war.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"
 POD_kstyw_form_swarmform_modifier: "虫群形态"
 POD_kstyw_form_swarmform_modifier_desc: "A tornado of scarabs, beetles, and lady bugs, the Kstyw Swarm encompasses all of the versatile utility that beetles can command."
 POD_kstyw_form_microform_modifier: "小虫形态"
 POD_kstyw_form_microform_modifier_desc: "A single beetle of the Kstyw's native species, the Kstyw is still a durable and inexorable force when they set their minds to something."
 POD_kstyw_form_macroform_modifier: "巨虫形态"
 POD_kstyw_form_macroform_modifier_desc: "A hippo sized beetle with the terrible aspects of their native species brought to new heights, the Kstyw Macro Form is the pinacle of durability in the human ages among the Éntomos.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_kstyw_form_warform_modifier: "战争形态"
 POD_kstyw_form_warform_modifier_desc: "One of the most humanoid of the Éntomos War Forms, the Kstyw War Form resembles a human reshaped with beetle bodyparts, becoming a thundering battering ram of chitin and determination.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]#!"
 POD_kstyw_form_titaniform_modifier: "泰坦形态"
 POD_kstyw_form_titaniform_modifier_desc: "Radiating the terrible fury of the ancient pact between Helios and the Weaver, the Kstyw Titaniform is a dealer of death and fire with sandstorm wings, channeling the power of the heavens and Weaver in a colossal body.\n#weak Give [GetModifier('POD_delirium_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E]\nCan bypass delirium immunity.#!"