 POD_ananasi_form_swarmform_modifier: "虫群形态"
 POD_ananasi_form_swarmform_modifier_desc: "汹涌澎湃的蜘蛛群，总质量与人体相当，它们在角落里崛起、蔓延，以惊人的速度覆盖地面，防止被杀。"
 POD_ananasi_form_microform_modifier: "小虫形态"
 POD_ananasi_form_microform_modifier_desc: "一只普通蜘蛛，虽然令人毛骨悚然，但并不起眼，而且很容易被人遗忘，具有无与伦比的潜行能力。"
 POD_ananasi_form_macroform_modifier: "巨虫形态"
 POD_ananasi_form_macroform_modifier_desc: "有犀牛那么大的巨型蜘蛛，巨虫形态是死亡和毁灭的可怕巨兽。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_ananasi_form_warform_modifier: "战争形态"
 POD_ananasi_form_warform_modifier_desc: "对于每个阿南西来说，战争形态是他们对半虫形态的类比，代表了一种蜘蛛形态，大约是大猩猩的大小，具有人类元素，如手、半人马体形和蜘蛛与人类解剖学的混合。\n#weak 给予[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]敌人[knights|E]当在[combat_phase|E]或[single_combat_duel_plural|E]中作为[commander|E]#!"
 POD_eshieho_form_swarmform_modifier: "虫群形态"
 POD_eshieho_form_swarmform_modifier_desc: "伊希埃霍虫群形态是一个由各种颜色的小龙虾组成的庞大群体，它是Eshieho可能需要完成的一系列较小任务的各种形态的集合。"
 POD_eshieho_form_microform_modifier: "小虫形态"
 POD_eshieho_form_microform_modifier_desc: "一只比人手还小的小龙虾，伊希埃霍在小虫形态下很容易被任何经过河边的人忽略。"
 POD_eshieho_form_macroform_modifier: "巨虫形态"
 POD_eshieho_form_macroform_modifier_desc: "一只犀牛大小的甲壳类动物，拥有纤细的钳子和快速摆动的触角，伊希埃霍巨型形态是一种优雅与力量的可怕结合。\n#weak 当作为[commander|E]指挥[combat_phase|E]或在[single_combat_duel_plural|E]中时，给敌方[knights|E]施加[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_eshieho_form_warform_modifier: "战争形态"
 POD_eshieho_form_warform_modifier_desc: "一种半人马形的甲壳类生物，伊希埃霍的战争形态既灵活又强壮，是他们在接受战争召唤时采取的形态。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_eshieho_form_titaniform_modifier: "泰坦形态"
 POD_eshieho_form_titaniform_modifier_desc: "伊希埃霍的泰坦形态与它们的创造者相似，是一个拥有十条腿、体型如大象的巨兽，带有被甲壳覆盖的手臂和两只锐利的钳子，鼓胀的眼睛时刻警惕着那些胆敢挑战刻托的人。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_mishaho_form_swarmform_modifier: "虫群形态"
 POD_mishaho_form_swarmform_modifier_desc: "由数百只较小螃蟹组成的群体，米沙霍的虫群形态是一个快速移动且难以捕捉的螃蟹群体，它们以一种混乱而充满活力的方式移动着，挥舞着它们的钳子。"
 POD_mishaho_form_microform_modifier: "小虫形态"
 POD_mishaho_form_microform_modifier_desc: "一只单独的螃蟹，小虫形态是米沙霍在想要独处且不被注意时采取的安全形态，尤其是在靠近海岸时。"
 POD_mishaho_form_macroform_modifier: "巨虫形态"
 POD_mishaho_form_macroform_modifier_desc: "米沙霍的巨虫形态是一只接近河马大小的巨蟹，拥有强大的力量和耐力，其独特的形态使得很难有效打击到其被厚重装甲保护的腿部。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_mishaho_form_warform_modifier: "战争形态"
 POD_mishaho_form_warform_modifier_desc: "米沙霍的战争形态是人类与螃蟹的混合体，结合了螃蟹和人类身体的最佳元素，形态因个体而异。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_mishaho_form_titaniform_modifier: "泰坦形态"
 POD_mishaho_form_titaniform_modifier_desc: "米沙霍的泰坦形态以螃蟹本身的形象塑造，构造简单，但却展现了生命的最终形态。它是一只庞大的巨蟹，足以承载一座岛屿，钳子能粉碎巨石，腿部高耸如参天巨树。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_bahaesh_form_swarmform_modifier: "虫群形态"
 POD_bahaesh_form_swarmform_modifier_desc: "在虫族中，巴哈什的虫群形态是最不密集的群落之一，由大约一百只龙虾组成，但它们共享一个单一的意识。"
 POD_bahaesh_form_microform_modifier: "小虫形态"
 POD_bahaesh_form_microform_modifier_desc: "低调且美味的巴哈什小虫形态是一只简单而单一的龙虾，这使它们能够隐藏在其他同类之中，在海上而不被敌人察觉到它们的秘密。"
 POD_bahaesh_form_macroform_modifier: "巨虫形态"
 POD_bahaesh_form_macroform_modifier_desc: "巨虫形态的巴哈什是一只体型如驮马般巨大的龙虾，拥有两只同等大小的钳子，那是生物所能拥有的最强大的钳子，能够轻松夹断钢铁。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_bahaesh_form_warform_modifier: "战争形态"
 POD_bahaesh_form_warform_modifier_desc: "巴哈什的战争形态是一种力量强大的直立猛兽，将钳子的巨力与人类的灵巧和适应性相结合。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_bahaesh_form_titaniform_modifier: "泰坦形态"
 POD_bahaesh_form_titaniform_modifier_desc: "巴哈什的泰坦形态是一个由甲壳和肌肉构成的巨兽，标志性的是其如投石机般大小的钳子，依附在巨大的龙虾身体上，以支撑它们恐怖的力量。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_ishihambi_form_swarmform_modifier: "虫群形态"
 POD_ishihambi_form_swarmform_modifier_desc: "一群颜色、种类和类型各异的飞蛾，伊希汉比的虫群形态在色彩的变幻中呈现出一种超凡脱俗的美丽。"
 POD_ishihambi_form_microform_modifier: "小虫形态"
 POD_ishihambi_form_microform_modifier_desc: "伊希汉比的小虫形态与它们原生种类的普通飞蛾并无二致，但这种形态仍然是深刻自由和解放的象征。"
 POD_ishihambi_form_macroform_modifier: "巨虫形态"
 POD_ishihambi_form_macroform_modifier_desc: "巨虫形态的织者战争领主是一只如秃鹫般大小的蛾子，翅膀比降落伞还要大，这充分展现了它们的威严。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_ishihambi_form_warform_modifier: "战争形态"
 POD_ishihambi_form_warform_modifier_desc: "伊希汉比的战争形态是在虫族中独具一格的完全双足行走的构造，形态为带有蛾子特征的人形生物，体型与人类相仿，但其翅膀足够大，能够推动他们飞行。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_ishihambi_form_titaniform_modifier: "泰坦形态"
 POD_ishihambi_form_titaniform_modifier_desc: "伊希汉比的泰坦形态是一只拥有光辉毛发和鲜艳翅膀的巨兽，其外形如普通的蛾子，却巨大到能够从水中拽起一只虎鲸，这只巨兽将其所有的美丽都转化为了纯粹的力量。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_iqhawe_form_swarmform_modifier: "虫群形态"
 POD_iqhawe_form_swarmform_modifier_desc: "伊卡维虫群形态是由一群腿和手臂组成的螳螂群，伊卡维的群聚形态并不隐秘，但它实现了难以被杀死和能够将意识传播到远方的宝贵目标。"
 POD_iqhawe_form_microform_modifier: "小虫形态"
 POD_iqhawe_form_microform_modifier_desc: "一只单独的螳螂，伊卡维的小虫形态无疑是微观尺度上最致命的敌人，它们是敏捷的伏击捕食者，专门猎杀其他小虫形态的虫族，同时保留着隐秘的优势。"
 POD_iqhawe_form_macroform_modifier: "巨虫形态"
 POD_iqhawe_form_macroform_modifier_desc: "巨虫形态的伊卡维是一只如驮马般巨大的螳螂，有着如同战斧般锋利的肢体，是一台残酷的杀戮机器，擅长撕碎敌人。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_iqhawe_form_warform_modifier: "战争形态"
 POD_iqhawe_form_warform_modifier_desc: "伊卡维的战争形态在虫族中有独到之处，其形态与巨虫形态类似，只是其前臂变成了致命的刀刃，擅长决斗并将敌人劈成碎片。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_iqhawe_form_titaniform_modifier: "泰坦形态"
 POD_iqhawe_form_titaniform_modifier_desc: "泰坦形态的伊卡维是一只巨大的螳螂，呈现出其创造者的形象，能挥舞肢体，一击就能清理大片森林，足以摧毁挡在织者选民面前的所有敌人。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_umakhi_form_swarmform_modifier: "虫群形态"
 POD_umakhi_form_swarmform_modifier_desc: "作为一个完整的白蚁群落，乌玛希虫群形态是所有木质结构的克星，也是最有效率的白蚁群落。"
 POD_umakhi_form_microform_modifier: "小虫形态"
 POD_umakhi_form_microform_modifier_desc: "无论是单独的白蚁之王还是蚁后，小虫形态的乌玛希对于白蚁来说是高贵的，但它们极其微小，很容易被忽视，因为它们隐藏在地下。"
 POD_umakhi_form_macroform_modifier: "巨虫形态"
 POD_umakhi_form_macroform_modifier_desc: "巨虫形态的乌玛希是一只巨大的白蚁兵蚁，他们头部的酸液喷口已被武器化，能够释放出痛苦的洪流。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_umakhi_form_warform_modifier: "战争形态"
 POD_umakhi_form_warform_modifier_desc: "乌玛希的战争形态是一个混合了不同品种白蚁形态的半人马构造，化身为酸液和巨颚的旋风，用于摧毁所有威胁其社群的敌人。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_umakhi_form_titaniform_modifier: "泰坦形态"
 POD_umakhi_form_titaniform_modifier_desc: "乌玛希的泰坦形态是一只与早已灭绝的长毛象相当大小的白蚁战士，头上的酸液喷口如同希腊火喷射器，化身为酸液与痛苦的死亡之流。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_umlimi_form_swarmform_modifier: "虫群形态"
 POD_umlimi_form_swarmform_modifier_desc: "乌姆利米化身为早期人类文明的祸害——蝗虫群，将它们面前的所有农作物撕碎并收割，以满足乌姆利米自己的目的。"
 POD_umlimi_form_microform_modifier: "小虫形态"
 POD_umlimi_form_microform_modifier_desc: "不显眼且容易被遗忘，乌姆利米的小虫形态是一只单独的蝗虫或蚱蜢，很容易就消失在灌木和草丛中。"
 POD_umlimi_form_macroform_modifier: "巨虫形态"
 POD_umlimi_form_macroform_modifier_desc: "巨虫形态的乌姆利米就像他们的微形形态被放大到骡子般的大小，腿部比袋鼠还要强壮，一次带刃的踢击就能将人打成碎片。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_umlimi_form_warform_modifier: "战争形态"
 POD_umlimi_form_warform_modifier_desc: "乌姆利米的战争形态融合了人类和蝗虫的多种特征，常常呈现出瘦削的身姿，透露出他们无尽的贪婪与饥饿。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_umlimi_form_titaniform_modifier: "泰坦形态"
 POD_umlimi_form_titaniform_modifier_desc: "乌姆利米的泰坦形态是一种令人恐惧的存在，长着无数张嘴和刀刃般的腿，如同死亡的旋风一般旋转，数百万蝗虫在其身周盘旋，宛如饥荒的化身。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_umbulali_form_swarmform_modifier: "虫群形态"
 POD_umbulali_form_swarmform_modifier_desc: "噩梦成真，翁布拉利的虫群形态是整个黄蜂巢的化身，它们在死亡和仇恨的云中移动，以单一意识的指引在空中穿行。"
 POD_umbulali_form_microform_modifier: "小虫形态"
 POD_umbulali_form_microform_modifier_desc: "不易察觉且容易被忘记，翁布拉利的小虫形态是一只单独的阴沉的黄蜂。"
 POD_umbulali_form_macroform_modifier: "巨虫形态"
 POD_umbulali_form_macroform_modifier_desc: "翁布拉利的巨虫形态是一只体型如水牛般的黄蜂，是恐惧这一概念的具象化，带有比长枪还大的毒针和如同锯齿状虎钳的颚，令见到它的凡人无不感到恐惧。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_umbulali_form_warform_modifier: "战争形态"
 POD_umbulali_form_warform_modifier_desc: "翁布拉利的战争形态是人类与黄蜂的融合，黄蜂的坚定意志与人类最糟糕的嗜好结合，形成了一种令人恐惧的形态。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_umbulali_form_titaniform_modifier: "泰坦形态"
 POD_umbulali_form_titaniform_modifier_desc: "翁布拉利的泰坦形态是织者之怒的残暴化身，体型如恐龙般巨大的黄蜂，毒针足以刺穿大象，带着黄蜂攻击入侵者时的狂怒。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_umhloli_form_swarmform_modifier: "虫群形态"
 POD_umhloli_form_swarmform_modifier_desc: "做为整个蚁群的体现，乌姆霍利的虫群形态是一个虫群集体，在同一个意识下协同工作。"
 POD_umhloli_form_microform_modifier: "小虫形态"
 POD_umhloli_form_microform_modifier_desc: "几乎总是蚁后，并且拥有她的翅膀。乌姆霍利的小虫形态是最具王者风范的形态，同时具有飞行和繁殖能力。"
 POD_umhloli_form_macroform_modifier: "巨虫形态"
 POD_umhloli_form_macroform_modifier_desc: "巨虫形态的乌姆霍利是一只拥有巨力和不屈意志的巨型兵蚁，虽然是虫族巨虫形态中最小的，但它坚韧不拔、不可阻挡。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_umhloli_form_warform_modifier: "战争形态"
 POD_umhloli_form_warform_modifier_desc: "乌姆霍利的战争形态是虫族战争形态中最具昆虫特征的形态，它不断变化，借助蚂蚁种类的多样性来克服眼前的任何挑战。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_umhloli_form_titaniform_modifier: "泰坦形态"
 POD_umhloli_form_titaniform_modifier_desc: "乌姆霍利的泰坦形态是一个由坚硬甲壳与强大力量构成的巨兽，拥有着乌姆霍利中罕见的力量。这只如虎鲸般巨大的蚂蚁会扇动着如原野般宽广的翅膀，雷霆万钧地冲入战场。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_injiki_form_swarmform_modifier: "虫群形态"
 POD_injiki_form_swarmform_modifier_desc: "相当于整个蜂巢的蜜蜂，因吉齐的虫群形态是花粉和翅膀的云团，非常适合作为云的许多用途。"
 POD_injiki_form_microform_modifier: "小虫形态"
 POD_injiki_form_microform_modifier_desc: "通常是一只蜂后或雄蜂，因吉齐的小虫形态即使在其侧面也是勤劳而简朴的。"
 POD_injiki_form_macroform_modifier: "巨虫形态"
 POD_injiki_form_macroform_modifier_desc: "巨虫形态的因吉齐是一只巨大的蜜蜂，周身散落着花粉和花蜜，能够生产出足以淹没一只古拉赫勒(熊人)的蜂蜜，令人叹为观止。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_injiki_form_warform_modifier: "战争形态"
 POD_injiki_form_warform_modifier_desc: "每个因吉齐的战争形态都不同，是它们心目中理想的工作与战斗的结合体，融合了人类和蜜蜂形态的优势。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_injiki_form_titaniform_modifier: "泰坦形态"
 POD_injiki_form_titaniform_modifier_desc: "当因吉齐以泰坦形态靠近时，蜂蜜的香气在数英里之外都能闻到，就如同织者的农夫们走上了战场。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 POD_kstyw_form_swarmform_modifier: "虫群形态"
 POD_kstyw_form_swarmform_modifier_desc: "一场由圣甲虫、甲虫和瓢虫组成的旋风，克斯特乌的虫群形态包含了甲虫所能掌握的所有多功能功能。"
 POD_kstyw_form_microform_modifier: "小虫形态"
 POD_kstyw_form_microform_modifier_desc: "一只克斯特乌原生种类的甲虫，当克斯特乌下定决心做某事时，它仍是一个耐用且不可阻挡的力量。"
 POD_kstyw_form_macroform_modifier: "巨虫形态"
 POD_kstyw_form_macroform_modifier_desc: "巨虫形态的克斯特乌是一只体型如河马般的甲虫，将其原生物种的可怕特征提升到了新的高度，是虫族在这个时代中耐力的巅峰代表。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_kstyw_form_warform_modifier: "战争形态"
 POD_kstyw_form_warform_modifier_desc: "克斯特乌的战争形态是虫族中最具人形特征的形态之一，外形如同融合了甲虫身体部件的人类，成为了由坚固甲壳和坚韧意志组成的雷霆般的攻城锤。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的敌人[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]#!"
 POD_kstyw_form_titaniform_modifier: "泰坦形态"
 POD_kstyw_form_titaniform_modifier_desc: "克斯特乌的泰坦形态散发着古老契约中赫利俄斯与织者的恐怖怒火，它拥有沙尘暴般的翅膀，是死亡与火焰的操纵者，凭借庞大的身躯引导着天界与织者的力量。\n#weak 当担任[commander|E]在[combat_phase|E]期间行动时，给予敌方[knights|E]或在[single_combat_duel_plural|E]期间给予你的对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n可无视妄悸免疫。#!"
 hydra_warrior_modifier: "九头蛇战士"
 MODIFIER_DEFINITION_VALUE_PER_HYDRA_PROWESS_DIFF: "#weak 随着与最强成员的[prowess|E]区别而增长#!"