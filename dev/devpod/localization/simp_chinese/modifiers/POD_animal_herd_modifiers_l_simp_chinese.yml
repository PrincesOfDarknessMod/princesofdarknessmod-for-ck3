l_simp_chinese:
 POD_animal_herd_cattle_small_modifier: "小型奶牛牧群"
 POD_animal_herd_cattle_small_modifier_desc: "“这是个养牛场，外面当然有牛。”"
 POD_animal_herd_cattle_moderate_modifier: "中型奶牛牧群"
 POD_animal_herd_cattle_moderate_modifier_desc: "规模不大的待挤奶或待屠宰的牛群。"
 POD_animal_herd_cattle_large_modifier: "大型奶牛牧群"
 POD_animal_herd_cattle_large_modifier_desc: "将通过牛奶和屠宰给主人带来定期收入的庞大牛群。"
 POD_animal_herd_sheep_small_modifier: "小型绵羊牧群"
 POD_animal_herd_sheep_small_modifier_desc: "“黑绵羊咩咩叫，\n你有羊毛吗？\n是的，先生。是的，先生，\n有整整三袋\n一袋给男主人，\n一袋给女主人\n一袋送给小男孩，\n他住在小巷里。”"
 POD_animal_herd_sheep_moderate_modifier: "中型绵羊牧群"
 POD_animal_herd_sheep_moderate_modifier_desc: "提供羊毛或羊肉的规模不大的羊群"
 POD_animal_herd_sheep_large_modifier: "大型绵羊牧群"
 POD_animal_herd_sheep_large_modifier_desc: "将通过羊毛或羊肉为主人带来定期收入的一大群羊。"
 POD_animal_herd_goats_small_modifier: "小型山羊牧群"
 POD_animal_herd_goats_small_modifier_desc: "“是谁在我的桥上走啊？”巨魔用阴沉的声音问。\n“啊，是我呢。我是最小最柔弱的山羊吉福。我要去河那边的山坡吃草，然后快快长胖。”小山羊细声细气地回答。\n“小山羊啊，我要来把你一口吃掉！”巨魔道。"
 POD_animal_herd_goats_moderate_modifier: "中型山羊牧群"
 POD_animal_herd_goats_moderate_modifier_desc: "可以挤奶或宰杀的规模不大的山羊群。虽然比牛小，但它们几乎什么都吃，而且更容易维护。"
 POD_animal_herd_goats_large_modifier: "大型山羊牧群"
 POD_animal_herd_goats_large_modifier_desc: "将通过羊奶和屠宰为主人带来定期收入的一大群山羊。虽然比牛小，但它们几乎什么都吃，而且更容易维护。"
 POD_animal_herd_pigs_small_modifier: "小型家猪牧群"
 POD_animal_herd_pigs_small_modifier_desc: "“一只小猪去市场，\n一只小猪家中躺，\n一只小猪吃牛扒，\n一只小猪饿肚肠，\n还有一只小猪娃，\n哭哭啼啼跑回家。”"
 POD_animal_herd_pigs_moderate_modifier: "中型家猪牧群"
 POD_animal_herd_pigs_moderate_modifier_desc: "等待被屠宰的规模不大的猪群。虽然比牛小，但它们几乎什么都吃，而且更容易维护。"
 POD_animal_herd_pigs_large_modifier: "大型家猪牧群"
 POD_animal_herd_pigs_large_modifier_desc: "将通过屠宰为主人带来定期收入的一大群猪。虽然比牛小，但它们几乎什么都吃，而且更容易维护。"
 POD_animal_herd_reindeer_small_modifier: "小型驯鹿牧群"
 POD_animal_herd_reindeer_small_modifier_desc: "只在北方有，一个小型的驯鹿群。"
 POD_animal_herd_reindeer_moderate_modifier: "中型驯鹿牧群"
 POD_animal_herd_reindeer_moderate_modifier_desc: "只在北方有，可以通过宰杀获得肉和皮毛的规模不大的驯鹿群。"
 POD_animal_herd_reindeer_large_modifier: "大型驯鹿牧群"
 POD_animal_herd_reindeer_large_modifier_desc: "只在北方有，可以通过宰杀获得肉和皮毛的一大群驯鹿。"
 POD_animal_herd_camel_small_modifier: "小型骆驼牧群"
 POD_animal_herd_camel_small_modifier_desc: "这些动物是干燥的沙漠地带的理想选择，它们甚至可以被用于战争。"
 POD_animal_herd_camel_moderate_modifier: "中型骆驼牧群"
 POD_animal_herd_camel_moderate_modifier_desc: "这些动物是干燥的沙漠地带的理想选择，它们甚至可以被用于战争。它们的主要用途是用于长途贸易。"
 POD_animal_herd_camel_large_modifier: "大型骆驼牧群"
 POD_animal_herd_camel_large_modifier_desc: "这些动物是干燥的沙漠地带的理想选择，它们甚至可以被用于战争。它们的主要用途是用于长途贸易。"
