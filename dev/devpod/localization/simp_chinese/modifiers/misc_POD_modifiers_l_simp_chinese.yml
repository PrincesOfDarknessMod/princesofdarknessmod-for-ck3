l_simp_chinese:
 soul_crushed_modifier: "心死"
 soul_crushed_modifier_desc: "这个吸血鬼几乎不再接受他的亡生，只是机械地做完一件事后去做另一件事"
 POD_childe_dislike_opinion: "不喜欢你的教导"
 isolated_modifier: "分隔"
 isolated_modifier_desc: "你已将你与你的子嗣隔离开来，以确保其了解某些……核心原则。"
 left_alone_modifier: "放手"
 left_alone_modifier_desc: "作为一项信仰考验，你让这社区在没有你的插手下自主运行，这实际上有些好处。"
 POD_childe_like_opinion: "喜欢你的教导"
 helpful_diplomat_childe_modifier: "外交帮手子嗣"
 helpful_diplomat_childe_modifier_desc: "你的子嗣在数个宫廷留下了好印象，维持了一段时间的友谊。"
 helpful_childe_modifier: "帮手子嗣"
 helpful_childe_modifier_desc: "你的子嗣在诸事上都帮了很大的忙，帮你把事情处理得更好了。"
 helpful_steward_childe_modifier: "管理帮手子嗣"
 helpful_steward_childe_modifier_desc: "你的子嗣有数多可能会有用的关于新宫廷的扩展计划。"
 helpful_intrigue_childe_modifier: "计谋帮手子嗣"
 helpful_intrigue_childe_modifier_desc: "你的子嗣如同你的二重身，为你的利益而谋划。"
 exemplar_childe_modifier: "以怖而治"
 exemplar_childe_modifier_desc: "该角色已经证明，为了保住权力，他几乎没有什么底线是不会逾越的"
 martial_mentor_modifier: "战略导师"
 martial_mentor_modifier_desc: "一位精炼的指挥官教导着该角色。"
 flawless_presentation_modifier: "无瑕引见"
 flawless_presentation_modifier_desc: "你子嗣的引见甚至感动了最腻烦的封臣。"
 laying_back_modifier: "放松"
 laying_back_modifier_desc: "你正在放松一下。这是你该得的。"
 byzantine_community_modifier: "拜占庭社群"
 byzantine_community_modifier_desc: "一小群拜占庭难民，既有$pod_cainites$又有血畜，在你的省份找到了庇护。他们对避难所很感激。"
 shard_hagia_modifier: "圣索菲亚的碎片"
 shard_hagia_modifier_desc: "一小片来自于那曾经是该时代最伟大的吸血鬼——米迦勒——的遗产。你近乎要完全沉入在其中了……"
 roderigo_step1_modifier: "罗德里戈的教诲"
 roderigo_step1_modifier_desc: "不多话的法师有许多事可以教你。你只需要冒一下险……"
 roderigo_step2_modifier: "罗德里戈的智慧"
 roderigo_step2_modifier_desc: "你比以前懂得多了！但仍有一些触手可及的隐藏真相，足以让你感觉到……"
 roderigo_step3_modifier: "罗德里戈的真理"
 roderigo_step3_modifier_desc: "你知道了关于生与死的原初真理。只要你能想起它……"
 hunted_by_wolves_modifier: "被追猎"
 hunted_by_wolves_modifier_desc: "可怖的狼人每时每刻都在跟着你，等待着破绽。你除了让他们跟丢之外没啥可做的。"
 loose_wolves_modifier: "狼群在外"
 loose_wolves_modifier_desc: "狼人们在乡村肆虐，偶尔也会直接攻击城市。"
 crisis_of_faith_modifier: "信仰危机"
 crisis_of_faith_modifier_desc: "你失去了信仰，并没法使用真信之力了"
 fiend_lover_modifier: "魔物爱好者"
 fiend_lover_modifier_desc: "这个人因莫名其妙地释放了一个被囚禁的地狱仆从而背叛了功业。"
 tracked_down_modifier: "被追踪到"
 tracked_down_modifier_desc: "敌方知道着这人的下落\n#weak 允许瞬间达成对该角色的寻找巢穴[journey|E]#!"
 serpent_garden_modifier: "园中之蛇"
 serpent_garden_modifier_desc: "蛇回到了阿瓦隆。爵士们很不高兴。"
