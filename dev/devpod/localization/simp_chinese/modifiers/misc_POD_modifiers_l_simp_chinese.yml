 truce_of_tuzfold_modifier_desc: "你不得不签署的耻辱的无条件和平，这令你在你雄心勃勃的封臣面前显得软弱。"
 cowed_by_trial_modifier: "战争审判败方"
 cowed_by_trial_modifier_desc: "弗拉基米尔·罗斯托维奇通过一系列大胆的战术表现打败了你的军队。你没有资格推翻他。"
