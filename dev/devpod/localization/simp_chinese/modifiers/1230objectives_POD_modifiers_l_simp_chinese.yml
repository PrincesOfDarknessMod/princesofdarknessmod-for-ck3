 nagaraja_wraith_devoured_prowess_modifier: "Wraith-Fed"
 ennamaru_reborn_modifier: "Ennamaru, Reborn"
 ennamaru_reborn_modifier_desc: "The final act has concluded. The shards have been pieced together. Francia will burn."
 dark_angel_modifier: "Dark Angel"
 dark_angel_modifier_desc: "You have tuned your flawed body into one of agonizing, divine perfection."
 lutetian_roots_modifier: "Lutetian Roots"
 lutetian_roots_modifier_desc: "Ancient Gaulic traditions, protective blood sorceries and your efforts have cleansed this land of infernal corruption. Under your watchful guidance, the realm will finally prosper."