 gifts_from_heaven_modifier_desc: "窍之真传被授予给了该角色，允许其在[Glossary('第六纪元','game_concept_sixth_age_desc')]来临之前就能学到上级窍功。"
 hardened_heart_modifier: "刚硬之心"
 hardened_heart_modifier_desc: "该角色已经清洗了其心中阻碍其的多愁善感。"
 keening_modifier: "恸鸣"
 keening_modifier_desc: "即使在远离黑石的地方，恸鸣的力量仍然保护着你。"
 sufi_mystic_modifier: "秘术大师"
 sufi_mystic_modifier_desc: "你对神秘力量的知识与塔夫尼的教导相结合，让你学到了很多东西。"
 kabbalah_modifier: "卡巴拉大师"
 kabbalah_modifier_desc: "得益于你对塔木德秘经的全面了解，你是犹太神秘主义的大师。"
 antediluvian_dominor_modifier: "未成的仪式"
