 land_for_dragons_modifier_desc: "可以招募[GetMaA('dragon_fiends_maa').GetName][men_at_arms|E]"
 custom_mummy_dynasty_secured_future_modifier: "建立了第五王朝"
 vatican_secrets_modifier: "梵蒂冈的秘密"
 vatican_secrets_modifier_desc: "勒森魃在圣座中的嵌入效应提供了秘传知识，并允许其秘密转移资金。"
 beast_unleashed_modifier: "心兽释放"
 beast_unleashed_modifier_desc: "善良之人的灵魂换取力量，值得吗？"
 king_of_outlaws_modifier: "法外之徒之王"
 king_of_outlaws_modifier_desc: "奋起，再奋起，直到羔羊化为雄狮。"
 angel_soul_modifier: "天使之魂"
 angel_soul_modifier_desc: "迈克尔的灵魂威胁要将你淹没。"
 hideous_truth_modifier: "可怖的真相"
 hideous_truth_modifier_desc: "饥饿的寄生虫昭然若揭。"
 chivalric_ideal_modifier: "骑士精神理想"
 chivalric_ideal_modifier_desc: "真正的美，可以在战斗中优雅而完美的执行中找到。"
 exquisite_poison_modifier: "精妙毒药"
 exquisite_poison_modifier_desc: "帝国核心的腐朽，有时竟如此诱人。"
 muses_modifier: "缪斯"
 muses_modifier_desc: "我等威仪术便足以激发艺术与崇拜。"
 grand_patrons_modifier: "大赞助人"
 grand_patrons_modifier_desc: "我们无尽的赞助培育了文明。"
 dark_petal: "暗色花瓣"
 dark_petal_desc: "她的本质散发着死花的窒息气息。"
 POD_nicnevin_modifier: "Nicnevin Legacy"
 POD_pressyne_modifier: "Pressyne Legacy"
 mary_fragmented_self_modifier: "破碎的自我"
 mary_fragmented_self_modifier_desc: "她并非完整重生。她的心智与埃勃拉泥板一同散落，归来的只是碎片而已。"
 mary_fragmented_self_modifier_t1: "破碎的自我—已找回一块石板"
 mary_fragmented_self_modifier_t1_desc: "拼图的一部分被复原了。模糊的记忆变得愈发清晰。"
 mary_fragmented_self_modifier_t2: "破碎的自我—已找回两块石板"
 mary_fragmented_self_modifier_t2_desc: "她自身的两部分终于各归其位，但最后的碎片——召唤——仍在她触不可及的彼方。"
 mary_most_hated_modifier: "全欧洲最令人憎恨的血族之一"
 mary_most_hated_modifier_desc: "从亚科到伦敦，你的名字因参与毁灭幻梦而遭人唾弃。此事不会就此善罢甘休。"
 mary_tanith_protection_modifier: "坦尼斯的庇护"
 mary_tanith_protection_modifier_desc: "坦尼斯认可你的才能。千万别让她失望。"
 mary_tanith_legacy_modifier: "坦尼斯的遗产"
 mary_tanith_legacy_modifier_desc: "坦尼斯的庇护如今已不仅仅局限于她的王庭。摩洛氏族承认了你的地位。"
 mary_tanith_protection_lapsed_landless.toast: "Tanith cannot, or will not, protect you any longer. Her name will do you no good on the road, after all. The hunters are waiting."
 mary_tanith_commission_diyarbakr_modifier: "Tanith's Commission: A Rival in the Dark"
 mary_tanith_commission_diyarbakr_modifier_desc: "Tanith has given you orders concerning the Order of Azaneal. A county in [GetTitleByKey('d_diyarbakr').GetNameNoTier] or [GetTitleByKey('d_diyarrabia').GetNameNoTier] must be taken. Prove to her you're worth keeping around."
 mary_tanith_commission_cyprus_modifier: "Tanith's Commission: The Pious Threat"
 mary_tanith_commission_cyprus_modifier_desc: "Tanith has set you against the Knights of Acre in Cyprus. The Duchy of [GetTitleByKey('d_cyprus').GetNameNoTier] must fall before the hunters can grow in power."
 mary_tanith_commission_cyprus_brujah_modifier: "Tanith's Commission: The Daughter's Refuge"
 mary_tanith_commission_cyprus_brujah_modifier_desc: "Shutatara, Tanith's traitor childe, has fled to the court of the Brujah Nehemiah, Prince of Cyprus. The Duchy of [GetTitleByKey('d_cyprus').GetNameNoTier] must change hands before the daughter begins to like it there."
 mary_tanith_commission_olives_modifier: "Tanith's Commission: A Diet of Olives"
 mary_tanith_commission_olives_modifier_desc: "Tanith has set you against the Diet of Olives. A county in [GetTitleByKey('d_antioch').GetNameNoTier] or [GetTitleByKey('d_lebanon').GetNameNoTier] must be taken before they grow too strong."
 POD_maryb_starting_pacts.tt: "Two pacts to the demon Anoster fall due every eight years: one of blood and one of pain."
 mary_black_dream_modifier: "黑色幻梦"
 mary_black_dream_modifier_desc: "Mary has claimed the Dream for herself. What was once meant to be utopia has become a place of hellish suffering."
 mary_second_dream_modifier: "第二幻梦"
 mary_second_dream_modifier_desc: "#shinygold 米迦勒从灰烬中重生，再次崛起。幻梦依旧延续，虽比以往有些奇怪。#!"
 mary_ash_and_gold_modifier: "灰烬与黄金"
 mary_ash_and_gold_modifier_desc: "玛丽和米迦勒都未能完全主导。由于他们热烈而矛盾的情感，某种奇特的事物应运而生。两人之间的控制权毫无规律地频繁易手。"
 mary_ash_and_gold_michael_modifier: "灰烬与黄金:米迦勒现身"
 mary_ash_and_gold_michael_modifier_desc: "#shinygold 目前，亲爱的，是我的手在指引方向。让他们沐浴在我的温暖中片刻吧。#!光辉的一半掌控着局面。目前如此。"
 mary_ash_and_gold_mary_modifier: "灰烬与黄金:玛丽现身"
 mary_ash_and_gold_mary_modifier_desc: "她这次重新现身，再次证明了众人为何都对她心生畏惧。掠食者的一面正占据主导。至少目前如此。"
 mary_ash_gold_michael_surfaces.toast: "#shinygold 米海尔向水面靠近。幻梦的光辉半面此刻掌控着局面。#!"
 mary_ash_gold_mary_surfaces.toast: "玛丽向水面靠近。幻梦的黑暗一半现在掌控了一切。"
 maryb_trinity_the_fall_modifier: "堕落"
 maryb_trinity_the_fall_modifier_desc: "#shinygold 绝望之人带着诸多渴望与请求来到我面前。我不会让他们如同来时那般离去。#! 表面之下暗藏异动，然而双方都无法道明缘由。"
 mary_well_offering_t2: "献祭完成"
 mary_well_offering_t2_desc: "城市的血脉慷慨流淌。提升至下一层级。"
 mary_well_offering_t3: "献祭完成"
 mary_well_offering_t3_desc: "城市的血脉慷慨流淌。提升至下一层级。"
 mary_well_offering_t4: "献祭完成"
 mary_well_offering_t4_desc: "最后的献祭已经完成。那口井终将被开启；升起最后一层。"