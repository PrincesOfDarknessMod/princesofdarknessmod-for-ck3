 eternal_mullah_modifier: "永恒穆拉"
 eternal_mullah_modifier_desc: "[Glossary('阿什拉派','game_concept_ashirra_desc')]那位胜利的永恒穆拉，是集至高灵性与世俗权威于一身的存在。"
