 wutian_ninth_immortal: "第九真人"
 wutian_ninth_immortal_desc: "该角色已登临第九真人之位，在此过程中领悟了新的强大奥义。"
 nomenclature_master_modifier: "术言宗师"
 nomenclature_master_modifier_desc: "尽管未能成功达到拉-赫考，但这个角色却取得了某种接近的成就。\n可以通过“化身为彼“改变任意基础[trait|E]"
 POD_all_is_well_under_heaven_modifier: "普天之下，莫非王土"
 POD_all_is_well_under_heaven_modifier_desc: "太平盛世必将永存。岂有不然之理？"
