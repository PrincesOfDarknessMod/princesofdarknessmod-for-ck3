 ennamaru_reborn_modifier: "恩那玛鲁，重生"
 ennamaru_reborn_modifier_desc: "谢下终幕。碎片已被拼凑完整。法兰西将燃烧。"
 dark_angel_modifier: "暗黑天使"
 dark_angel_modifier_desc: "你已将缺陷的肉身转变成苦痛而神圣的完美。"
 lutetian_roots_modifier: "卢泰西亚根源"
 lutetian_roots_modifier_desc: "凭借古老的高卢传统、防护性的血巫术，以及不懈努力，你已将这片土地自地狱腐化中净化。在你警醒而坚定的引领下，此地终将迎来真正的繁荣。"
 koldunic_ways_founders_modifier: "库都大师"
 koldunic_ways_founders_modifier_desc: "施展[krainas|E]及其[bs_rituals|E]时消耗的@blood_icon!减少1点"
