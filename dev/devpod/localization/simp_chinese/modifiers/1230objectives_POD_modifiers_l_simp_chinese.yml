l_simp_chinese:
 mithras_bane_modifier: "密特拉克星"
 mithras_bane_modifier_desc: "这位有名望的吸血鬼把密特拉和祂的追随者赶出了不列颠尼亚。此壮举远近闻名。"
 politically_secure_modifier: "政治性安全"
 politically_secure_modifier_desc: "你最近的选择使你在同辈中受到尊重。你的地位目前似乎很稳固。"
 hostile_shadows_modifier: "敌意之影"
 hostile_shadows_modifier_desc: "你的迅速崛起使许多人嫉妒你。很长一段时间都会有凶器在暗处等着你。"
 blood_horn_modifier: "血角"
 blood_horn_modifier_desc: "你重新发现了著名的奥丁血角，一个可以从任何液体中制造血液的圣器。"
 broken_authority_modifier: "破碎的权威"
 broken_authority_modifier_desc: "该角色已经失去了极多的信用度：这在吸血鬼政治中一直是个问题。"
 capital_past_modifier: "安达卢西亚孑遗"
 capital_past_modifier_desc: "人类已经离开了安达卢西亚，但这座城市有一个不死族社团，致力于保存他们共同的传承。"
 sword_of_troile_modifier: "特洛伊尔之剑"
 sword_of_troile_modifier_desc: "这把水晶剑是血族历史上最强大的武器之一，特洛伊尔本人就曾在保卫迦太基的多次战斗中使用过它。"
 babayaga_victory_opinion: "忠诚于“老妪”。"
 eyes_and_ears_modifier: "遍布眼线"
 eyes_and_ears_modifier_desc: "作为诺斯费拉图$pod_clan$的领导者，你的线人网无与伦比。"
 fortified_alamut_modifier: "团结的鹰巢"
 fortified_alamut_modifier_desc: "摆脱了内部的纠葛，鹰巢顽强地屹立着，成为了$pod_cainite$世界的头号堡垒。"
 path_of_the_zealot_modifier: "狂热的哈基姆派"
 path_of_the_zealot_modifier_desc: "在信仰的旗帜下，每个阿刹迈现在都是真理的有力捍卫者。"
 path_of_the_diplomat_modifier: "哈基姆派外交家"
 path_of_the_diplomat_modifier_desc: "现在每位阿刹迈都有了新的领导，允许他们从世界各地寻求帮助和朋友。"
 path_of_the_sorcerer_modifier: "哈基姆派术士"
 path_of_the_sorcerer_modifier_desc: "隐居的阿刹迈$pod_clan$现在团结在他们的研究中，是许多未公开秘密的守秘人。"
 eternal_consul_modifier: "永恒执政"
 eternal_consul_modifier_desc: "罪人罗马的统治者是一个迷人的生物，他只需要一个低语就能使大多数人最黑暗的愿望成真。"
 lasombra_chronicles_modifier: "勒森魃编年史"
 lasombra_chronicles_modifier_desc: "关于勒森魃$pod_clan$的救主，[Glossary('阿什拉派','game_concept_ashirra_desc')]的克星的崛起的确定性卷册。"
 ashirra_castle_modifier: "[Glossary('阿什拉派','game_concept_ashirra_desc')]暗影之堡"
 ashirra_castle_modifier_desc: "随着勒森魃$pod_clan$由[Glossary('阿什拉派','game_concept_ashirra_desc')]掌控，一个新的，更合适的，总部正在建设中。"
 impressed_westerner_opinion: "了不起的西方冈格罗"
 collapse_civilisation_modifier: "文明崩溃"
 collapse_civilisation_modifier_desc: "狼群已在门前，你勉强把它们挡在门外。你现在的控制范围不比你的王座室大多少。"
 alpha_gangrel_modifier: "阿尔法冈格罗"
 alpha_gangrel_modifier_desc: "你打败了所有的挑战者。整个$pod_clan$对你即使不是服从，也是尊重。"
 prime_councilor_modifier: "首席议员"
 prime_councilor_modifier_desc: "代替睿魔尔管理$pod_clan$的摄政，该个体有机会获得稀有的知识，并且可以取得他族人的忠诚。"
 prime_curse_modifier: "首席诅咒"
 prime_curse_modifier_desc: "首席议员的诅咒已经触动到了该个体，使其甚至很难冷静思考。"
 dark_nobility_modifier: "黑暗贵族"
 dark_nobility_modifier_desc: "棘秘魑$pod_clan$统治着阴暗的城堡和受压迫的民众，是令人生畏的统治者。"
 kupala_empowered_modifier: "库帕拉授能"
 kupala_empowered_modifier_desc: "你和魔鬼做了交易。字面意思。"
 kupala_depowered_modifier: "库帕拉收能"
 kupala_depowered_modifier_desc: "喀尔巴阡地缚魔从这个人身上夺走了生命力，以赋予他最喜爱的仆从力量。"
 sargon_codex_modifier: "萨尔贡圣典"
 sargon_codex_modifier_desc: "究极力量，或者至少知识，是你的了。但你的理智却不是你的了。"
 grateful_brethren_opinion: "感恩的同胞"
 sargon_fragment_modifier: "萨尔贡残篇"
 sargon_fragment_modifier_desc: "被摧毁的萨尔贡圣典的一小块残篇仍然是预言和洞见的强大容器。"
 pseudo_third_modifier: "伪三代"
 pseudo_third_modifier_desc: "你并没有完成对[Glossary('上古耆宿','game_concept_antediluvian_desc')]的$pod_diablerie$，但你的能力和威望仍处于三代的水平。"
 cappadocian_purge_modifier: "卡帕多西亚大清洗"
 cappadocian_purge_modifier_desc: "新的乔凡尼$pod_clan$正致力于消灭那些曾经的恩人，以及任何愿意庇护他们的人。"
 kill_on_sight_modifier: "见则杀"
 kill_on_sight_modifier_desc: "这些角色被他们的敌人盯上了，他们时日不多，在每个角落都被猎杀。"
 decentralized_rule_modifier: "分权统治"
 decentralized_rule_modifier_desc: "你只是各种不同政治结构的和平维护者。因此，当你受到尊敬时，你并不总是被服从。"
 serpent_allure_modifier: "蛇之引诱"
 serpent_allure_modifier_desc: "你被赛特亲自祝福，带有一种可触的灵光，承诺实现每一黑暗的欲望。"
 sword_of_samiel_modifier: "萨麦尔之剑"
 sword_of_samiel_modifier_desc: "传说中第一位萨洛比武者是一个无与伦比的斗士，他愿意超越自己的职责去对抗黑暗力量。"
 saulot_heir_modifier: "扫罗继承人"
 saulot_heir_modifier_desc: "你是一位和扫罗一样聪慧的生物；有些人甚至说，经过这么多年的争斗，你终于找到了[golconda|E]。"
 usurpers_exposed_modifier: "篡位暴露"
 usurpers_exposed_modifier_desc: "睿魔尔$pod_clan$的真相已经暴露无遗。一群窃取灵魂的骗子，为了他们自己的私利，近乎把你的$pod_clan$推向灭绝。"
 herald_of_the_end_modifier: "大敌"
 herald_of_the_end_modifier_desc: "你是内尔伽勒重生，这个被诅咒的世界的厄运和诅咒的先兆。他们要么鞠躬，要么受死。"
 demons: "地缚恶魔"
 demons_flavor: "#F 被扑灭的路西法叛乱中的堕落天使。它们的深渊囚牢有一缺陷，因此可以通过巨大的代价将其召唤到凡间并缚约。#!"
 rebel_conqueror_modifier: "平西逆军"
 rebel_conqueror_modifier_desc: "你不向任何皇朝或老祖鞠躬。在你的土地上，你的意志是至高无上的，挑战你的人有祸了。"
 first_magaji_modifier: "第一马加吉"
 first_magaji_modifier_desc: "第一个被正式承认的全非洲的马加吉在莱本的政治中具有巨大的重要性。"
 TARGET_IS_HUNTER: "是一位裁判官：$VALUE|=+0$"
 TARGET_IS_VAMPIRE: "是一位吸血鬼：$VALUE|=+0$"
 chosen_of_light_modifier: "光之选民"
 chosen_of_light_modifier_desc: "该角色周围有一种奇怪的灵光。仿佛是神本身为了一个更大的目的选择了他。"
 link_enoch_modifier: "通往以诺城的传送门"
 link_enoch_modifier_desc: "以诺城，第一城，塔尔马埃拉在[UmbraGlossaryLocalized('shadowlands','冥界')]的真正家园。此伯爵领现已有直接连接它的通道，并可以在空闲的时候从它那里获取资源。"
 seed_of_rebellion_modifier: "叛变之种"
 seed_of_rebellion_modifier_desc: "阴险的塔尔玛埃拉已经在该角色心中播下了不信任和叛变的种子。"
 cursed_by_cathar_modifier: "清洁派的诅咒"
 cursed_by_cathar_modifier_desc: "最后的清洁派因不敬神而死，他在死前诅咒了你的名字。你感到……担心。"
 cathar_community_modifier: "清洁派团体"
 cathar_community_modifier_desc: "最后的清洁派在这里避难，受到你的庇护。这一事实令当地居民感到不安。"
 lost_in_callous_modifier: "恐怖之化身"
 lost_in_callous_modifier_desc: "他们惧怕你。他们说天主远离了你。但你知道他从未离你这么近过。"
 bloodline_founder_modifier: "血系建立者"
 bloodline_founder_modifier_desc: "自有血系的建立者，这个血系的每个成员都承认你是他们的始祖。"
 firebombs_modifier: "火炸弹"
 firebombs_modifier_desc: "此人携带了装有极度易燃物质的陶瓷球以及点火系统。"
 firespewer_modifier: "喷火器"
 firespewer_modifier_desc: "此人携带了一种实验中装置，能够喷射高压可燃物质同时点燃它。"
 masters_of_fire: "火之主"
 masters_of_fire_desc: "这个派系已经获得了希腊火的秘密，并根据他们的需要调整了武器。"
