l_simp_chinese:
 aye_disconnected_modifier: "与艾断开连接"
 aye_disconnected_modifier_desc: "你已与生者世界失去联系。凡人会察觉到你身上有种深入骨髓的不祥之感。"
 orun_disconnected_modifier: "与奥伦断开连接"
 orun_disconnected_modifier_desc: "灵界已背弃你。先祖们沉默不语。你在黑暗中孑然一身。"
 guruhi_beauty_1_modifier: "Hideous Guruhi"
 guruhi_beauty_2_modifier: "Homely Guruhi"
 guruhi_beauty_3_modifier: "Humanlike Guruhi"
 guruhi_beauty_4_modifier: "Radiant Guruhi"
 spirit_blessed_modifier: "Spirit-Blessed"
 spirit_blessed_modifier_desc: "A great spirit has acknowledged you. Its power lingers in your blood."
 spirit_beast_wound_modifier: "心兽创伤"
 spirit_beast_wound_modifier_desc: "心兽的拒绝留下了一道难以愈合的伤口。"
 beasts_counsel_modifier: "Beast's Counsel"
 beasts_counsel_modifier_desc: "Your Beast has shared its insight into the ways of the wild."
 fury_prowess_modifier: "Fury of the Osebo"
 fury_prowess_modifier_desc: "The warrior-spirits of your ancestors lend strength to your arm."
 fury_unleashed_modifier: "Fury Unleashed"
 fury_unleashed_modifier_desc: "You surrendered completely to the rage. The power is intoxicating and dangerous."
 scholars_insight_modifier: "Scholar's Insight"
 scholars_insight_modifier_desc: "Ancient knowledge has opened new paths of understanding."
 invoke_authority_of_the_living_modifier: "Authority of the Living"
 invoke_authority_of_the_living_modifier_desc: "You speak with the voice of the living world. Mortals obey because the land itself commands them."
 laibon_vassal_authority_modifier: "Aye-Authority of the Liege"
 laibon_vassal_authority_modifier_desc: "Your liege speaks with the authority of the living world. Even the dead listen."
 commune_with_ancestors_modifier: "Communion with the Ancestors"
 commune_with_ancestors_modifier_desc: "The ancestors have answered. Their strength flows through you, and their sight reveals what others would hide."
 mortal_petitioner_success_modifier: "Just Arbiter"
 mortal_petitioner_success_modifier_desc: "Your fair judgment has earned the respect of the mortals in your domain."
 mortal_petitioner_failure_modifier: "Unjust Arbiter"
 mortal_petitioner_failure_modifier_desc: "Your attempt at judgment has left the mortals wary of your authority."
 gathering_fire_modifier: "Gathering Fire"
 gathering_fire_modifier_desc: "The fire of the Gathering still burns in the memories of those who attended."
 harvest_celebration_modifier: "Harvest Guardian"
 harvest_celebration_modifier_desc: "凡人们铭记你在庆典上的威仪。你是他们的守护者。"
 masquerade_breach_modifier: "潜藏破漏"
 masquerade_breach_modifier_desc: "凡人之间流言四起。他们的领主出了些问题。"
 ancestors_grave_development_modifier: "Cleared Ancestral Ground"
 ancestors_grave_development_modifier_desc: "The cleared ground has been put to productive use, though the spirits do not approve."
 guruhi_crown_modifier: "王冠之重"
 guruhi_crown_modifier_desc: "你个人的干预已恢复了封臣间的秩序。"
 vice_spreads_failure_modifier: "恶行不受约束"
 vice_spreads_failure_modifier_desc: "你的纵容已在社群中留下痕迹。凡人心存戒备。"