 demonic_feature_antennae_modifier_desc: "角色长出一对类似昆虫的触角，帮助其感知周围环境。"
 demonic_feature_claws_modifier_desc: "角色长出了魔爪。"
 demonic_feature_demon_armor_modifier_desc: "表现为鳞片、华丽的武士盔甲或其他东西的魔甲，并提供更大的攻击保护。"
 demonic_feature_demon_weapon_modifier_desc: "一把神秘的武器出现在人物的手中。这样的武器可能闪烁着奇异的光芒，发出可怕的呻吟，布满淫秽的面孔，等等。"
 demonic_feature_enlarged_body_parts_modifier_desc: "角色的一个身体部位肿胀起来，比正常情况下大得多，常常布满疮口或露出难看的血管。"
 demonic_feature_eyes_of_horror_modifier_desc: "角色恶魔般的眼睛对任何凝视它的人来说都有一种恐怖和疯狂的暗示。"
 demonic_feature_extra_arms_modifier_desc: "两只额外的手臂从角色的躯干上长出，使得具有更强的抓捕能力，或者仅仅是实现比平时更多的攻击。"
 demonic_feature_form_of_the_yamamatsu_modifier_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]的魔体变得像橡胶一样松弛，有些地方几乎是流体，使其有一个可怕的扭曲的外观。"
 demonic_feature_foulness_modifier_desc: "角色的魔体是极其不干净的：也许被干涸的血和肉块包裹着，也许被包围在一团邪恶的云中，等等。"
 demonic_feature_hive_body_modifier_desc: "魔体皮肤上的小孔和巢穴会释放出微小而可怕的动物。蛇、蜘蛛、蜜蜂和蝙蝠都是这怪异力量的常见表现形式。"
 demonic_feature_horns_modifier_desc: "角色从他们的头上长出角。它们可以是短的或长的，光滑的或参差不齐的，直的或歪的，多棱的或单棱的，随角色意愿。"
 demonic_feature_horror_modifier_desc: "魔体可能会产生类似于妄悸的影响来折磨人类。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 demonic_feature_huge_size_modifier_desc: "角色的生命力会随着[GetTrait('kueijin').GetName( GetNullCharacter )]的突然变大成9至12英尺高而增加。"
 demonic_feature_mandibles_modifier_desc: "角色的嘴膨胀了，长出可怕的牙齿、獠牙，甚至可能是昆虫般的下颚。"
 demonic_feature_multiple_heads_modifier_desc: "角色长出一个或多个额外的头颅，每个头颅都能帮助[GetTrait('kueijin').GetName( GetNullCharacter )]感知他们的周围环境。"
 demonic_feature_poisoned_fangs_modifier_desc: "角色嘴里的獠牙变得特别大，锋利而具有腐蚀性。"
 demonic_feature_spikes_modifier_desc: "角色身体覆盖着以下一种：尖刺、像鲨鱼一样的磨蚀性皮肤、像刀片一样坚硬和锋利的体毛、钉子、火热或冰冷的皮肤、剃刀、倒刺或碎玻璃。"
 demonic_feature_spurting_tendrils_modifier_desc: "细小的卷须、手指或括约肌从[GetTrait('kueijin').GetName( GetNullCharacter )]的皮肤上冒了出来。"
 demonic_feature_suckers_modifier_desc: "角色的手臂或其他肢体上覆盖着类似于小灯笼鱼嘴的吸盘。"
 demonic_feature_suppurating_pustules_modifier_desc: "角色的魔体上布满了渗出的疮和伤口。"
 demonic_feature_tentacles_modifier_desc: "角色长出了令人厌恶的、被粘液覆盖的触手。"
 demonic_feature_tail_modifier_desc: "角色长出了条尾巴。"
 demonic_feature_the_host_modifier_desc: "长满獠牙的恶魔面孔从人物的背部、躯干和四肢中涌现出来。"
 demonic_feature_third_eye_modifier_desc: "角色在额头中间长出了第三只眼睛。"
 demonic_feature_wings_modifier_desc: "蝙蝠翅膀从角色的背上显现并延伸出来。"
 demonic_feature_wing_spines_modifier_desc: "角色的翅膀长出了带刺的、像手指一样的刺。"
