 demon_regalia_barbed_hide_modifier: "倒刺硬皮"
 demon_regalia_razor_claws_modifier: "剃刀爪"
 demon_regalia_razor_claws_modifier_desc: "角色长出锋利的爪刃。"
 demon_regalia_razor_horns_modifier: "刃角"
 demon_regalia_razor_horns_modifier_desc: "角色从他们的头上长出角。它们可以是短的或长的，光滑的或参差不齐的，直的或歪的，多棱的或单棱的，随角色意愿。"
 demon_regalia_demon_weapon_modifier: "恶魔武器"
 demon_regalia_demon_weapon_modifier_desc: "一把神秘的武器出现在人物的手中。这样的武器可能闪烁着奇异的光芒，发出可怕的呻吟，布满淫秽的面孔，等等。"
 demon_regalia_demon_armor_modifier: "魔甲"
 demon_regalia_demon_armor_modifier_desc: "表现为鳞片、华丽的武士盔甲或其他东西的魔甲，并提供更大的攻击保护。"
 demon_regalia_extra_arms_modifier: "额外手臂"
 demon_regalia_extra_arms_modifier_desc: "两只额外的手臂从角色的躯干上长出，使得具有更强的抓捕能力，或者仅仅是实现比平时更多的攻击。"
 demon_regalia_huge_size_modifier: "大型化"
 demon_regalia_huge_size_modifier_desc: "角色的体型骤然增长至九至十二英尺，生命力随之提升。"
 demon_regalia_poisoned_fangs_modifier: "毒牙"
 demon_regalia_poisoned_fangs_modifier_desc: "角色嘴里的獠牙变得特别大，锋利而具有腐蚀性。"
 demon_regalia_spikes_modifier: "尖刺"
 demon_regalia_spikes_modifier_desc: "角色身体覆盖着以下一种：尖刺、像鲨鱼一样的磨蚀性皮肤、像刀片一样坚硬和锋利的体毛、钉子、火热或冰冷的皮肤、剃刀、倒刺或碎玻璃。"
 demon_regalia_tentacles_modifier: "触手"
 demon_regalia_tentacles_modifier_desc: "角色长出了令人厌恶的、被粘液覆盖的触手。"
 demon_regalia_tail_modifier: "尾巴"
 demon_regalia_tail_modifier_desc: "角色长出了条尾巴。"
 demon_regalia_wings_modifier: "翅膀"
 demon_regalia_wings_modifier_desc: "蝙蝠翅膀从角色的背上显现并延伸出来。"
 demon_regalia_antennae_modifier: "触角"
 demon_regalia_antennae_modifier_desc: "角色长出一对类似昆虫的触角，帮助其感知周围环境。"
 demon_regalia_monstrous_maw_modifier: "凶暴巨口"
 demon_regalia_monstrous_maw_modifier_desc: "该角色的下颌可异常地大幅张开。"
