l_simp_chinese:
 house_hardestadt_modifier: "哈德施塔特家族"
 house_hardestadt_modifier_desc: "虽然与梵卓始祖的血脉联系有些模糊，但哈德施达特家族已经证明了自梵卓罗马之夜以来从未见过的统治智慧。"
 house_nabonidus_modifier: "那波尼德家族"
 house_nabonidus_modifier_desc: "这个隐居的阿刹迈族世系被周知为激发了他的追随者大信仰，即使他们似乎有更奇异的追求。"
 house_shahiri_modifier: "沙赫里家族"
 house_shahiri_modifier_desc: "最长者由哈基姆自身选择作为继承人的世系，是这个分裂$pod_clan$的一致选择。尽管这也可能是由于沙赫里被认为是一位容易被击败的存在。"
 house_anath_modifier: "阿娜特家族"
 house_anath_modifier_desc: "战争与爱情女王是一个朦胧的形象，但她的子嗣在外交和战争方面都取得了巨大的成就。不过，众所周知，他们有些鲁莽和直截了当。"
 house_jamal_modifier: "贾迈勒家族"
 house_jamal_modifier_desc: "[Glossary('阿什拉派','game_concept_ashirra_desc')]系的阿刹迈$pod_clan$的坚定领袖是一位无与伦比的战士。只是他对不信主的人不存忍耐。"
 house_urshulgi_modifier: "乌尔·舒尔吉家族"
 house_urshulgi_modifier_desc: "黑牧人的世系是一个谜。为了大家的好，这个问题应该继续得不到解决。"
 house_thetmes_modifier: "忒弥斯家族"
 house_thetmes_modifier_desc: "蜘蛛有着计划中的计划。没有时间去处理诸如统治地位之类的琐事。"
 house_anosh_modifier: "阿诺什家族"
 house_anosh_modifier_desc: "被整个$pod_clan$所忌讳，阿诺什世系是一种对未知的想象和实验。"
 house_azrael_modifier: "亚兹拉尔家族"
 house_azrael_modifier_desc: "战士$pod_clan$中最强的战士会自己动手。"
 house_nakurtum_modifier: "纳穆尔图姆家族"
 house_nakurtum_modifier_desc: "那狂傲暴躁的纳穆尔图姆用风暴攻取了阿刹迈$pod_clan$。她希望她的臣民能尽职尽责，但这却很难做到。"
 house_abuilaf_modifier: "阿布·伊拉夫家族"
 house_abuilaf_modifier_desc: "该哈基姆的次要后裔小家族主要由不问外事的，大多隐居和孤僻的修者组成。"
 house_shango_modifier: "桑戈家族"
 house_shango_modifier_desc: "桑戈是精明的统治者和顾问，但他们冷酷的行事方式仍然不被莱本所信任。就其本身而言，一位领导一片大领地而不遭受报复的桑戈是相当罕见的。"
 house_wahsheen_modifier: "瓦希恩家族"
 house_wahsheen_modifier_desc: "[Glossary('阿什拉派','game_concept_ashirra_desc')]冈格罗的信任很难获得，但一旦你做到了，这就形成了一种不可动摇的关系。"
 house_saad_modifier: "萨阿德家族"
 house_saad_modifier_desc: "阿刹迈$pod_clan$的贝都因人在某种程度上是不受欢迎的，他们倾向于互相或与部落团结在一起。"
 house_zayyat_modifier: "宰亚特家族"
 house_zayyat_modifier_desc: "宰亚特家族因新皈依者的信仰而燃烧。令人鼓舞又令人恐惧的景象。"
 house_hannibal_modifier: "汉尼拔家族"
 house_hannibal_modifier_desc: "尽管汉尼拔家族的成员们战斗英勇，战略周密，但他们似乎注定要失败。"
 house_losario_modifier: "洛萨里奥家族"
 house_losario_modifier_desc: "洛萨里奥家族成员是煽动者和创新者，总是在挑战极限。然而，似乎没有人能长时间地对我们生气。"
 house_leeland_modifier: "李兰德家族"
 house_leeland_modifier_desc: "李兰德的子嗣是自由$pod_cainite$世界的激情领袖。传统$pod_clan$总是怀疑他们在策划什么。"
 house_menele_modifier: "墨涅拉俄斯家族"
 house_menele_modifier_desc: "墨涅拉俄斯家族成员在为自己的信念而战时不屈不挠，而往往对更微妙的威胁视而不见。"
 house_dominic_modifier: "多米尼克家族"
 house_dominic_modifier_desc: "由于精通战争之术，多米尼克家族的成员经常是他们特别贪婪的[Glossary('心兽','game_concept_beast_desc')]的简易猎物。"
 house_gersakkun_modifier: "格萨坤家族"
 house_gersakkun_modifier_desc: "此几乎被遗忘的世系并没有在布鲁赫的历史上留下它的印记，哪怕养育出了一些天才的哲学家。"
 house_truebrujah_modifier: "真布鲁赫家族"
 house_truebrujah_modifier_desc: "没有人知道这个血系的离奇起源故事是否属实。但是他们的冷漠并没有给他们带来任何朋友。"
 house_baytmushakis_modifier: "贝特·穆沙基家族"
 house_baytmushakis_modifier_desc: "穆斯林布鲁赫正在不屈不挠地追杀可恨的梵卓。他们是他们顽强敌人的任何朋友的追踪者。"
 house_guillaume_modifier: "纪尧姆家族"
 house_guillaume_modifier_desc: "公平和公正，纪尧姆家族成员们更关心他们的灵魂状态而不是任何琐碎的政治活动。"
 house_azif_modifier: "阿吉夫家族"
 house_azif_modifier_desc: "阿吉夫家族在其贪婪灵魂上刻有窃取始祖的痕迹。这是很少有人愿意原谅的罪行。"
 house_osebo_modifier: "奥塞博家族"
 house_osebo_modifier_desc: "任其自生自灭，这些奥塞博就是一种由几乎不受约束的火和愤怒组成的生物。尽管他们自己知道这一点，但他们也在寻找的公正协助者来获得掌控。"
 house_giovanni_modifier: "乔凡尼家族"
 house_giovanni_modifier_desc: "这些人喜欢把它留在家里。"
 house_lazarene_modifier: "拉撒勒家族"
 house_lazarene_modifier_desc: "乞丐不能挑肥拣瘦，因为被自己的$pod_clan$追杀，拉撒路们会与任何愿意结盟的人结盟。"
 house_japhet_modifier: "雅弗家族"
 house_japhet_modifier_desc: "卡帕多西亚$pod_clan$的传统领袖都非常无为而治。这可能是有益的……和危险的。"
 house_byzar_modifier: "拜扎尔家族"
 house_byzar_modifier_desc: "拜扎尔家族的成员是文明的建设者。然而，他们并不擅长保护自己。"
 house_premascine_modifier: "普瑞玛森家族"
 house_premascine_modifier_desc: "如果野心勃勃是一种美德，那么这些人就是一群天使。"
 house_harbingersofskulls_modifier: "预告者家族"
 house_harbingersofskulls_modifier_desc: "这群奇怪的卡帕多西亚杀手，在阴影下要比在王位上轻松得多。"
 house_lamia_modifier: "拉米亚家族"
 house_lamia_modifier_desc_no_collide: "没有人知道莉莉丝的战士女儿们真正的结局。她们也不会说。"
 house_mlawatu_modifier: "姆拉·瓦图家族"
 house_mlawatu_modifier_desc: "你不能相信一个寻求力量，但却有着死者的灵魂和躯体的人。即使他们知道你想要的东西。"
 house_almawt_modifier: "马特家族"
 house_almawt_modifier_desc: "为了不引起穆斯林世界的愤怒，这个家族的卡帕多西亚的盟友很少，但秘密很多。"
 house_hecata_modifier: "赫卡塔家族"
 house_hecata_modifier_desc: "总有一晚，死亡女神会把她所有任性的子嗣们都迎进她冰冷的怀抱。"
 house_rusenko_modifier: "拉森科家族"
 house_rusenko_modifier_desc: "如果疯狂是一架梯子，那么已经不剩多少需要爬了。"
 house_lhiannan_modifier: "菈亚南家族"
 house_lhiannan_modifier_desc: "一个逝去时代的遗留者正在战斗到最后一刻。这是一个危险的景象。"
 house_odin_modifier: "奥丁家族"
 house_odin_modifier_desc: "全父正在注视[Glossary('英灵战士','game_concept_einherjar_desc')]的最后一战。任何懦夫都不能进入英灵殿。"
 house_rufus_modifier: "卢夫斯家族"
 house_rufus_modifier_desc: "卢夫斯已经保护了他的山脉数千年。他打算再坚持一千年。"
 house_matasuntha_modifier: "玛瑟逊莎家族"
 house_matasuntha_modifier_desc: "“匈人”曾经几乎摧毁了罗马。她不打算被再次阻止。"
 house_hukros_modifier: "胡克罗斯家族"
 house_hukros_modifier_desc: "胡克罗斯的世系总是在寻找隐藏的真理，这是一种好奇的精神，与同教信徒格格不入。"
 house_aajav_modifier: "阿扎布家族"
 house_aajav_modifier_desc: "阿扎布的旗帜高高飘扬在天空，这是对这个垂死世界的最后反抗。现在已经没有回头路了。"
 house_kurru_modifier: "库鲁家族"
 house_kurru_modifier_desc: "与冈格罗$pod_clan$的其他成员相比，库鲁家族成员在担任领导角色方面表现得异常自如。然而，他们直肠子的统治方式往往让他们容易被卑鄙的手段所欺骗。"
 house_vola_modifier: "沃拉家族"
 house_vola_modifier_desc: "顽强的沃拉家族北方人对傻瓜没有耐心。要做的只有突袭和劫掠！"
 house_anda_modifier: "[Glossary('安答','podgloss.anda')]家族"
 house_anda_modifier_desc: "大草原之鞭是无可匹敌的战士，但要适应统治这片广袤土地的严酷条件却很难。"
 house_akunanse_modifier: "阿库南斯家族"
 house_akunanse_modifier_desc: "非洲贤蛛对千年圣战没什么兴趣。这使他们成为乐于助人的邻居，却也是贫穷的统治者。"
 house_noiad_modifier: "诺亚德家族"
 house_noiad_modifier_desc: "霜冻北方的怪异$pod_cainites$乃是野蛮的，不适应统治人数众多的地区。"
 house_montano_modifier: "蒙塔诺家族"
 house_montano_modifier_desc: "勒森魃$pod_clan$的传统领袖是隐居的神秘主义者，通常不太适合他们的身份。"
 house_deruiz_modifier: "德·鲁伊斯家族"
 house_deruiz_modifier_desc: "伊比利亚穆斯林所仇视的敌人深深植根于伊比利亚的骑士文化中，并加以充分利用。"
 house_narses_modifier: "纳尔塞斯家族"
 house_narses_modifier_desc: "自从他们的大主教去世后，曾经伟大的该隐异端的领导就被拆散了。他们的原罪没有被忘却。"
 house_boukephos_modifier: "傅切佛斯家族"
 house_boukephos_modifier_desc: "勒森魃的博学外交官子嗣是友好的$pod_cainite$，深受年轻世代的喜爱。然而，他经常倾向于突然离开自己的领地。"
 house_sybil_modifier: "西比尔家族"
 house_sybil_modifier_desc: "$pod_clan$的其他成员几乎不承认这个被忌讳的女儿的世系。因此，她们学会了自强不息。"
 house_gratiano_modifier: "格拉齐亚诺家族"
 house_gratiano_modifier_desc: "格拉齐亚诺注定要成就大事。他希望提醒大家这一事实。"
 house_khanommehr_modifier: "可农·梅尔家族"
 house_khanommehr_modifier_desc: "不关心政治的可农·梅尔家族致力于保护$pod_clan$与它的始祖。"
 house_karotos_modifier: "卡洛托斯家族"
 house_karotos_modifier_desc: "一个几乎不为人知的神秘勒森魃世系，几乎没有任何带创伤的过去，但需要证明一切。"
 house_qabilatalkhayal_modifier: "卡比拉特·卡哈耶家族"
 house_qabilatalkhayal_modifier_desc: "[Glossary('阿什拉派','game_concept_ashirra_desc')]勒森魃处于不利地位，他们的酷虐的宗教热情在这些艰难时期既是祝福也是诅咒。"
 house_allama_modifier: "拉玛家族"
 house_allama_modifier_desc: "尽管他们不愿使用不正当手段，但凭借灵活的外交手段，小小的拉玛家族依旧确保了自己的生存。"
 house_tubalcain_modifier: "土八该隐家族"
 house_tubalcain_modifier_desc: "控制欲旺盛的土八该隐家族不喜欢不同的宗教观点。"
 house_tepelit_modifier: "特佩尔特家族"
 house_tepelit_modifier_desc: "隐居的、几乎不为人知的特佩尔特已经看到了他的终结，一些人说，他甚至接受了它。"
 house_blueeye_modifier: "青眼家族"
 house_blueeye_modifier_desc: "这勒森魃的神秘世系是隐居的，大多数人都同意其不适合统治或占据有权力的职位。"
 house_ramanga_modifier: "拉曼加家族"
 house_ramanga_modifier_desc: "一个无情的世系，毫不犹豫地公开影响血畜，马达加斯加女王的家族只相信自己的统治地位。"
 house_lamdiel_modifier: "拉姆迪尔家族"
 house_lamdiel_modifier_desc: "面对无尽的末日和黑暗预视，成为拉姆迪尔家族的一员并不容易。"
 house_eater_modifier: "吞名者家族"
 house_eater_modifier_desc: "他总是注视着你，等着你一不留神，他就会把你的言语夺去。"
 house_brahina_modifier: "婆罗那家族"
 house_brahina_modifier_desc: "婆罗那家族的成员有着强烈的激情，他们很难长时间专注于一件事。"
 house_delaurent_modifier: "德·洛朗家族"
 house_delaurent_modifier_desc: "作为专注而又才华横溢的学者，德·洛朗的最佳状态是独自呆在自己的图书馆里，而非掌管一间大宫廷。"
 house_midian_modifier: "米甸家族"
 house_midian_modifier_desc: "暴君也有走运的时候。但它总是会更早而非更迟的耗尽。"
 house_banes_modifier: "班恩斯家族"
 house_banes_modifier_desc: "了解未来可能是件好事。但它也可能打破已经岌岌可危的对现实的把握。"
 house_plague_modifier: "瘟疫家族"
 house_plague_modifier_desc: "瘟疫家族有着一简单、恐怖的使命，使得接近他们成为非常危险的事。"
 house_izaha_modifier: "伊扎哈家族"
 house_izaha_modifier_desc: "该末卡维氏族比普通的更疯狂，但在他们扭曲的眼睛里有一种不可思议的力量。"
 house_lerterimas_modifier: "勒特利马斯家族"
 house_lerterimas_modifier_desc: "由于与黑暗势力结盟，他们被自己的$pod_clan$所忌讳，勒特利马斯家族奔向了他们自己制造的末日。"
 house_panehesy_modifier: "帕尼赫希家族"
 house_panehesy_modifier_desc: "这个埃及末卡维家族在古埃及领地占有重要地位。如果不平息他们对更高权力的追求的话，这似乎会抑制他们的理智。"
 house_nissiku_modifier: "尼西库家族"
 house_nissiku_modifier_desc: "聪慧亲王知道什么时候耍花招，什么时候施展魅力。他的存在仍然能在他的世系中被感觉到，他总是被迫寻找新的方式来放纵他们不断扩张的灵体。"
 house_vrykolakas_modifier: "维克拉卡斯家族"
 house_vrykolakas_modifier_desc: "已经跑掉的，还在跑，不回头。"
 house_yagnatia_modifier: "雅嘎娜缇娅家族"
 house_yagnatia_modifier_desc: "祖母不再逃跑了。如果有必要，它的幼崽将坚守阵地，战斗到最后。"
 house_baytmutasharid_modifier: "贝特·穆塔沙尔家族"
 house_baytmutasharid_modifier_desc: "穆斯林世界的诺斯费拉图拒绝参加朝觐，过着隐居的生活，痛苦地生活在社会的边缘。"
 house_trajan_modifier: "图拉真家族"
 house_trajan_modifier_desc: "如果图拉真之网不知道某个信息，那它就根本不值得知道。"
 house_absalon_modifier: "阿布萨隆家族"
 house_absalon_modifier_desc: "丹麦的不死族主教在他的祖国拥有显赫的权力地位。显然，这是唯一值得关心的土地。"
 house_yima_modifier: "伊玛家族"
 house_yima_modifier_desc: "诺斯费拉图$pod_clan$的圣杯是一个可以让人团结在一起、得到安慰或为之牺牲的东西。"
 house_alexius_modifier: "阿莱克修斯家族"
 house_alexius_modifier_desc: "燃烧着狂热的愤怒，阿莱克修斯家族准备净化站在他们面前的不信者。"
 house_malachite_modifier: "马拉希底斯家族"
 house_malachite_modifier_desc: "君士坦丁堡的磐石同时也是最后希望。没有障碍能阻挡米迦勒的选民。"
 house_guruhi_modifier: "古鲁希家族"
 house_guruhi_modifier_desc: "莱本的传统领导，古鲁希珍视自己的地位，远离他们北方表亲的阴沟。"
 house_al_hajj_modifier: "哈吉家族"
 house_al_hajj_modifier_desc: "圣城的卫士，在信仰上不屈不挠。"
 house_chandraputra_modifier: "查古拉普夏家族"
 house_chandraputra_modifier_desc: "作为雷伏诺$pod_clan$无可争议的领袖，他不会在他的同胞们不断受到攻击时袖手旁观。胜利或死亡是将军唯一的选择。"
 house_ravana_modifier: "罗波那家族"
 house_ravana_modifier_desc: "叛徒很久以前就出卖了自己的灵魂。永远不要低估原始邪恶的魅力。"
 house_hazimel_modifier: "哈济梅尔家族"
 house_hazimel_modifier_desc: "……而且当你注视着眼睛时，永恒的知识就会从中产生。"
 house_alexandrite_modifier: "亚历山得利特家族"
 house_alexandrite_modifier_desc: "从蛇口中夺金，是亚历山得利特习以为常的事。"
 house_rroma_modifier: "普日·达伊家族"
 house_rroma_modifier_desc: "背井离乡，他们团结在一起，躲避着永不停息的暴风雨。"
 house_kali_modifier: "迦梨家族"
 house_kali_modifier_desc: "这是一个被遗忘的世系，它在雷伏诺的记录中的存在被抹去，只因他们可恶的罪行……或不同意见。"
 house_baytmujirim_modifier: "贝特·穆吉里姆家族"
 house_baytmujirim_modifier_desc: "由于[Glossary('阿什拉派','game_concept_ashirra_desc')]世界对其的广泛不信任，穆斯林雷伏诺是一自力更生的品种，虽然愤世嫉俗，但也很坚强。"
 house_kinyonyi_modifier: "斤养异家族"
 house_kinyonyi_modifier_desc: "乌木国的使者在大多数宫廷中都是受欢迎的景象，即使他们不会待太久。"
 house_samiel_modifier: "萨麦尔家族"
 house_samiel_modifier_desc: "天使们不再躲藏、撤退或畏缩。是时候开战了。"
 house_enosh_modifier: "以挪士家族"
 house_enosh_modifier_desc: "以挪士家族的贤明顾问们是一群坚忍之人，很少考虑暴力手段。"
 house_rayzeel_modifier: "雷齐尔家族"
 house_rayzeel_modifier_desc: "到目前为止，萨洛比$pod_clan$的医者们已经目睹了太多的死亡。他们的精神会因他们的每一次治疗而衰弱。"
 house_twilight_modifier: "暮光家族"
 house_twilight_modifier_desc: "人类的捍卫者，无情地与邪恶作斗争。"
 house_hrorsh_modifier: "赫罗什家族"
 house_hrorsh_modifier_desc: "赫罗什家族对睿魔尔的残酷袭击毫无准备，让人想起一个曾经辉煌的$pod_clan$。"
 house_mokur_modifier: "莫库尔家族"
 house_mokur_modifier_desc: "最后者倒下了，就像扫罗一直想要的那样。"
 house_watcher_modifier: "观者家族"
 house_watcher_modifier_desc: "随着他们西方亲戚的没落，其已在东方暗影中扎根，他们的驻视只是刚刚开始。"
 house_khaibit_modifier: "开比特家族"
 house_khaibit_modifier_desc: "赛特的初子的世系在同辈中带来了应有的尊敬和敬畏。"
 house_sarrasine_modifier: "萨拉金家族"
 house_sarrasine_modifier_desc: "萨拉金会为了一点点权力杀了他的父母。事实上，他已经这么做了。"
 house_jormungandr_modifier: "耶梦加得家族"
 house_jormungandr_modifier_desc: "这些异端分子除了为了自己的利益和生存之外，几乎没有别的目的。"
 house_isis_modifier: "伊西斯家族"
 house_isis_modifier_desc: "当心被鄙视的女人。尤其是当她是伊西斯的女儿，掌握着生与死的秘密时。"
 house_tawaret_modifier: "塔沃里特家族"
 house_tawaret_modifier_desc: "塔沃里特曾经与刻茉媞里战到不能动，然后幸存了下来讲述这个故事。她的勇猛在她的世系中代代相传。"
 house_nefertiti_modifier: "娜芙蒂蒂家族"
 house_nefertiti_modifier_desc: "如果骄傲先于堕落，娜芙蒂蒂将会堕落很长很长一段时间。"
 house_maatkare_modifier: "玛阿特卡拉家族"
 house_maatkare_modifier_desc: "古蛇的诱惑是仁慈的……而且如此诱人。"
 house_seterpenre_modifier: "赛特彭雷家族"
 house_seterpenre_modifier_desc: "善于外交的圣显者的思想极度开放，甚至可以与外人共事。有些人甚至会说他软弱。"
 house_heru_modifier: "赫鲁家族"
 house_heru_modifier_desc: "小心，这条蛇有一些锐利的尖牙。"
 house_scorpio_modifier: "毒蝎家族"
 house_scorpio_modifier_desc: "该家族在详细地阐述漫长的、冗长的、末日启示的计划时表现出使人惊恐的欣喜。更令人担忧的是，有些可能有一天真的会能用……"
 house_porphyrion_modifier: "波菲利翁家族"
 house_porphyrion_modifier_desc: "印度的魔鬼正准备将赛特的荣耀带入次大陆。如果他们成功了，任何人都会感到不快。"
 house_osiris_modifier: "奥西里斯家族"
 house_osiris_modifier_desc: "被古蛇所追杀，死神子嗣近乎都快跟他们父亲在一起了。"
 house_damballah_modifier: "丹巴拉家族"
 house_damballah_modifier_desc: "丹巴拉的子嗣们与主要$pod_clan$有些疏远，他们是务实的一群人，将他们的信条与非洲的信仰相适应。"
 house_khaytall_modifier: "凯塔尔家族"
 house_khaytall_modifier_desc: "曾经与米迦勒的君士坦丁堡有联系的被放逐的异端是一个被猎杀的世系。随着时间的推移，他们的选择越来越少。"
 house_wepwawet_modifier: "威普瓦卫家族"
 house_wepwawet_modifier_desc: "该战士密教将威胁隔离在埃及外，而他们本身也被自认为是威胁。"
 house_mucalinda_modifier: "目支邻陀家族"
 house_mucalinda_modifier_desc: "受人鄙视的那坦查拉是赛特之子$pod_clan$的一个佛教分支。他们隐遁于世，处于守势，处境岌岌可危。"
 house_glycon_modifier: "格利康家族"
 house_glycon_modifier_desc: "这些恶棍是一群渴望权力的赛特之子$pod_clan$战士。他们不懂阴谋诡计，只不过是只会盯准最近目标的乌合之众。"
 house_echidna_modifier: "厄喀德那家族"
 house_echidna_modifier_desc: "戈耳工已经预见到她们自己的灭亡。她们对它的不可思议的接受使大多数$pod_cainites$害怕。"
 house_nephilim_modifier: "拿非利家族"
 house_nephilim_modifier_desc: "随着始祖的去世，妥芮朵$pod_clan$最有名望的家族陷入了困境。然而，伟业的种子仍在那里。"
 house_salianna_modifier: "萨莉安娜家族"
 house_salianna_modifier_desc: "萨莉安娜已经两次失去一切了。她不会让这种事再发生第三次。"
 house_callisti_modifier: "卡利斯蒂–卡斯蒂略家族"
 house_callisti_modifier_desc: "作为外交官，家族的成员往往捡了芝麻丢了西瓜，这已经让他们付出了高昂的代价。"
 house_nicholas_modifier: "尼古拉斯家族"
 house_nicholas_modifier_desc: "与一伪造的世系，平淡无奇的为人，艾蒂安·德·普瓦捷使得他的家族成为了一个难以定位的目标。"
 house_andrew_modifier: "安德鲁家族"
 house_andrew_modifier_desc: "$pod_cainite$这位该隐异端的“天使长”用他的实用主义的观点，将宗教作为派系战争的激发因素，灌输给了他的家族。"
 house_helena_modifier: "海伦家族"
 house_helena_modifier_desc: "如果你还没有爱上过海伦家里的一个成员，那就是你还没有遇到过一个。"
 house_baldr_modifier: "巴德尔家族"
 house_baldr_modifier_desc: "北欧吟唱诗人正试图用他们的歌声和声音让他们的故事流传下去。"
 house_lubbock_modifier: "拉伯克家族"
 house_lubbock_modifier_desc: "失去了他们的激情，拉伯克家族的成员很容易成为无情的$pod_cainite$世界的猎物。"
 house_volgirre_modifier: "伏尔杰家族"
 house_volgirre_modifier_desc: "作为小奴隶领地的卑微统治者，伏尔杰家族是施虐成性的领主与残酷的尊长。"
 house_apollo_modifier: "阿波罗家族"
 house_apollo_modifier_desc: "幼小娇嫩的花朵，寻找着阳光却又轻易被战火蹂躏。"
 house_rayeenalfen_modifier: "雷因·芬家族"
 house_rayeenalfen_modifier_desc: "穆斯林世界的书法家们长期陷于代沟之中，足以在他们的血液中留下印记。"
 house_ishtarri_modifier: "伊斯塔尔里家族"
 house_ishtarri_modifier_desc: "承受着对沉溺于恶习的强烈渴望，伊斯塔尔里在操纵信息的微妙艺术依旧有着技巧。"
 house_goratrix_modifier: "格拉崔克斯家族"
 house_goratrix_modifier_desc: "光明使者将确保一个属于$pod_clan$的新时代，否则就会被黑暗吞噬。"
 house_etrius_modifier: "埃特里乌斯家族"
 house_etrius_modifier_desc: "被选中的睿魔尔摄政王领导着一个遭受重创的$pod_clan$的坚定防御。一个不令人羡慕的位置。"
 house_leduc_modifier: "勒杜克家族"
 house_leduc_modifier_desc: "前法兰西摄政王在那里是一位受人尊敬的$pod_cainite$，远远超过他的继任者，格拉崔克斯。"
 house_meerlinda_modifier: "梅琳达家族"
 house_meerlinda_modifier_desc: "七人议会中唯一的女性是真正保持金字塔在一起的人。英格兰将是她的战利品，如果她能战胜岛上小心翼翼的$pod_cainites$。"
 house_calderon_modifier: "卡尔德隆家族"
 house_calderon_modifier_desc: "凶猛的西班牙人直到咽下最后一口气前都将捍卫睿魔尔的荣誉，终生没有意识到阴暗的力量在后操作。"
 house_grimgroth_modifier: "古林格罗斯家族"
 house_grimgroth_modifier_desc: "迷雾峰的幽灵直到今晚还在愤怒，一个单独名字被以诅咒的口吻说出：古林格罗斯。"
 house_cincao_modifier: "德·辛扫家族"
 house_cincao_modifier_desc: "哈维尔的方法是无情的，但没有人能否认他这样做能提供惊人的结果。"
 house_telyavel_modifier: "特亚维家族"
 house_telyavel_modifier_desc: "作为异端被追捕，信仰旧神的魔法师们在志同道合的$pod_cainites$那里找到了相对的安全感。"
 house_trimira_modifier: "睿米拉家族"
 house_trimira_modifier_desc: "在一片充满敌意的土地上的陌生人，为了生存被迫做出让步。"
 house_kartarirya_modifier: "迦𫄨里璃家族"
 house_kartarirya_modifier_desc: "据悉，许多武装的印度棘秘魑在提问之前会先砍下几个头。"
 house_yaroslavich_modifier: "雅罗斯拉维奇家族"
 house_yaroslavich_modifier_desc: "海德翁越强大，就越喜欢粉碎他可怜的敌人。"
 house_ruthvenski_modifier: "卢希梵斯基"
 house_ruthvenski_modifier_desc: "卢希梵斯基是过时的一系，因守旧而闻名。他们的统治技巧和以往一样高超，但没人愿意再服从他们了。"
 house_vykos_modifier: "维科斯家族"
 house_vykos_modifier_desc: "迈卡一直在追寻人生的意义。每过一个夜晚，路的尽头就越来越近……"
 house_rustovitch_modifier: "罗斯托维奇家族"
 house_rustovitch_modifier_desc: "弗拉基米尔试图用武力驯服棘秘魑$pod_clan$。这是一个大胆的，很可能致命的举动。"
 house_yorak_modifier: "沃拉克家族"
 house_yorak_modifier_desc: "想象一下你最惧怕的噩梦被赋予人形。折磨你到永远。就像他之前的受害者看着你，在你加入他们之前砌在大教堂的墙上。"
 house_tabak_modifier: "塔巴克家族"
 house_tabak_modifier_desc: "塔巴克家族从出生就知道如何统治，知道什么时候使农民榨干最后一滴血，或者在失势时，什么时候逃跑。"
 house_dracon_modifier: "魔龙家族"
 house_dracon_modifier_desc: "魔龙和奥伯图斯的虔诚后裔们不适应战争，也不愿接受他们的同胞们所经历的变迁。"
 house_byelobog_modifier: "比洛博格家族"
 house_byelobog_modifier_desc: "白神统治冬天，但不关心统治其他任何东西。"
 house_triglav_modifier: "特里格拉夫家族"
 house_triglav_modifier_desc: "特里格拉夫家族在与宿敌魔龙家族的斗争中被消耗殆尽，几乎没有能力做任何其他事情。"
 house_andeleon_modifier: "安德莱昂家族"
 house_andeleon_modifier_desc: "抛开世俗，安德莱昂正在寻找超越星辰的真理。"
 house_demdemeh_modifier: "登梅赫家族"
 house_demdemeh_modifier_desc: "真正有学问的人知道他必须超越肉体才能成为神。"
 house_djavakhi_modifier: "贾瓦希家族"
 house_djavakhi_modifier_desc: "当你用钢拳统治时，永远不要放下你的手。"
 house_nagloper_modifier: "纳格罗珀家族"
 house_nagloper_modifier_desc: "如果你本身就是[Glossary('心兽','game_concept_beast_desc')]，心兽怎么能控制你呢？"
 house_hrothgar_modifier: "赫罗斯加家族"
 house_hrothgar_modifier_desc: "你能逃过自己的$pod_clan$，但你能逃过诸神黄昏吗？"
 house_jedrik_modifier: "耶德里克家族"
 house_jedrik_modifier_desc: "有时候，对你的统治最严重的威胁比你想象的更接近你。"
 house_tinia_modifier: "蒂妮娅家族"
 house_tinia_modifier_desc: "蒂妮娅家族的成员们充满着对旅行的热情，渴望新的、异国情调的体验。"
 house_mithras_modifier: "密特拉家族"
 house_mithras_modifier_desc: "太阳神的后裔很容易堕落，因为他们的始祖已经对他们进行了几百年的溺护。"
 house_alexander_modifier: "亚历山大家族"
 house_alexander_modifier_desc: "亚历山大在统治西欧最强大的帝国时证明了他精明的管理。但他的勃然大怒也被称为传奇。"
 house_antonian_modifier: "安东尼恩家族"
 house_antonian_modifier_desc: "幻梦的建筑师建造了一个最令人印象深刻的乌托邦般的$pod_cainite$世界。直到他崩溃并因它被毁灭。"
 house_camilla_modifier: "卡米拉家族"
 house_camilla_modifier_desc: "罗马的后裔们理应为他们的传承感到自豪。然而，他们所拥有的巨大威望和影响力很容易让他们变得懒惰。"
 house_eigermann_modifier: "艾格曼家族"
 house_eigermann_modifier_desc: "恶霸和粗人与梵卓$pod_clan$不太搭，艾格曼家族是他自己最大的敌人。"
 house_artemis_modifier: "阿尔忒弥斯家族"
 house_artemis_modifier_desc: "欧西雅派梵卓占领了宝座，他们很少等待时机，特别是当有一把剑能加速这一进程。他们相信他们应得荣耀，并且毫不犹豫地接受它。"
 house_bindusara_modifier: "宾杜萨拉家族"
 house_bindusara_modifier_desc: "流浪学者是知识的源泉，他们常常试图学习前人的神秘方法。"
 house_veddartha_modifier: "梵达多家族"
 house_veddartha_modifier_desc: "梵达多是一个骄傲、勤奋的有领导气质的家族，堪比梵卓本家。"
 house_arakur_modifier: "阿拉库家族"
 house_arakur_modifier_desc: "阿拉库一系因[Glossary('吸榨','game_concept_diablerie_desc')]、与魔鬼沟通、以及狂妄自大而得有恶名。当他们不能随心所欲地欺负别人时，他们也是不折不扣的懦夫。"
 house_medon_modifier: "梅敦家族"
 house_medon_modifier_desc: "梅敦被认为是第一个被人类杀死的真正强大的吸血鬼。时至今日，他的世系仍然为此感到羞耻。"
 house_nefermeriisis_modifier: "尼芙·美日·伊西斯家族"
 house_nefermeriisis_modifier_desc: "该凶猛的梵卓子嗣喜欢在战斗中弄脏自己的手。因此，她的世系蔑视依赖他人。"
 house_arpad_modifier: "阿尔帕德家族"
 house_arpad_modifier_desc: "顽强的阿尔帕德家族在匈牙利贵族中根深蒂固，是一个很难将其逐出家园的敌人。"
 house_antasia_modifier: "安塔西亚家族"
 house_antasia_modifier_desc: "性格平静、人脉广泛的茱莉亚·安塔西娅培养了自己的孩子，让他们互相尊重、和睦相处，总是带着关心和同情去解决问题。"
 house_le_croise_modifier: "克鲁瓦塞"
 house_le_croise_modifier_desc: "若弗鲁瓦和他的[Glossary('尊长','game_concept_Sire_desc')]一样被愤怒困扰。他只能指望自己的骑士风度来拯救自己免受$pod_clan$的怒火。"
 house_moloch_modifier: "摩洛教团家族"
 house_moloch_modifier_desc: "作为这忘恩负义的世界的看守，摩洛教团被其他氏族和他们的族人所追杀。前者不明白其等的目的，而后者则太清楚了。"
 house_nergal_modifier: "内尔伽勒派家族"
 house_nergal_modifier_desc: "内尔伽勒的子嗣们是该隐诅咒中最黑暗最令人憎恶的产物，他们只想看到这世界焚烧。"
 house_angellisater_modifier: "黑天使家族"
 house_angellisater_modifier_desc: "可憎的黑天使是巴力$pod_clan$间的篡位者，寻找一条通往魔性的疯狂道路。"
 house_asuratizayya_modifier: "阿修罗提伽耶家族"
 house_asuratizayya_modifier_desc: "被其他[Glossary('万鬼','game_concept_kuei_jin_desc')]视为异端的印度[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]仍然坚守他们的传统并捍卫他们的社群。"
 house_penangallan_modifier: "血花家族"
 house_penangallan_modifier_desc: "在敌人的血腥残骸中，阴柔之力将得到升华。"
 house_wanderers_modifier: "草原龟家族"
 house_wanderers_modifier_desc: "饱受恶鬼困扰，大草原的[Glossary('万鬼','game_concept_kuei_jin_desc')]正处于艰难的时期。"
 dynn_nagaraja_modifier: "那伽罗阇"
 dynn_nagaraja_modifier_desc: "那伽罗阇承受的令人憎恶的诅咒使他们成为一个被忌讳的群体，但同时他们也是一坚韧的群体。"
 dynn_unbound_modifier: "免缚者"
 dynn_unbound_modifier_desc: "仅仅是一条关于该等$pod_cainites$和其等世系的谣言就对现有秩序构成了威胁。"
 dynn_kiasyd_modifier: "吉雅希德"
 dynn_kiasyd_modifier_desc: "隐居又神秘的吉雅希德沉迷在炼金术师的实验室里，对周围不断增长的威胁一无所知。"
 dynn_impundulu_modifier: "魔蛇鹫"
 dynn_impundulu_modifier_desc: "魔蛇鹫正在寻找在很久以前的一张契约的漏洞，其正缓慢地将他们带向终结。"
 house_ahrimane_modifier: "阿里曼"
 house_ahrimane_modifier_desc: "阿迪萨在战斗中从不屈服或退缩。她的女儿也不会，毕竟芙蕾雅始终在看着。"
 house_feroux_modifier: "费鲁"
 house_feroux_modifier_desc: "所谓的希腊冈格罗是一个值得骄傲的世系，他们是君士坦丁堡的幻梦背后的主要力量之一。它的陷落沉重地压在他们的心头。"
 house_siren_modifier: "嘈杂之女"
 house_siren_modifier_desc: "她们为我歌唱，七海的塞壬……"
 house_ruthven_modifier: "卢希梵斯基家族"
 house_ruthven_modifier_desc: "棘秘魑的物质躯体的看守们被他们显赫的地位蒙住了眼睛，没有意识到它所带来的许多威胁。"
 dynn_knightsofacre_modifier: "亚柯骑士"
 dynn_knightsofacre_modifier_desc: "骑士在战斗中确实很凶猛，但是他们不喜欢用更微妙的方法来破坏敌人的计划。"
 dynn_swordofstjames_modifier: "圣雅各伯之剑"
 dynn_swordofstjames_modifier_desc: "老实说，罗德里格的追随者都是些混蛋自大狂。但他们也是钉子一般坚韧的混蛋自大狂！"
 dynn_redorder_modifier: "红修会"
 dynn_redorder_modifier_desc: "他们知道关于未知之恐怖的可怕秘密。但是他们在图书馆呆的时间太长，让他们变得……更弱于脚踏实地的战术。"
 dynn_sistersjohn_modifier: "圣约翰修女会"
 dynn_sistersjohn_modifier_desc: "被可怕的末日预景所困扰，修女们创造了一种非常强大的管理意识来粉碎他们可怕的存在。"
 dynn_oculidei_modifier: "神目"
 dynn_oculidei_modifier_desc: "天主之眼的偏执狂们对他们所恐惧的往往是正确的。但这并不会让他们的同伴喜欢他们。"
 dynn_murnau_modifier: "冯·穆尔瑙"
 dynn_murnau_modifier_desc: "该骄傲的德意志家族习惯于对付逃税农民。毕竟，天主之怖不仅仅只针对地狱衍体。"
 dynn_gantenbein_modifier: "甘滕宾"
 dynn_gantenbein_modifier_desc: "狂热的鲍格米勒派教友极难调和他们的诚实信仰和他们对吸血鬼血液的需求。这一事实使他们与自己的集群疏远。"
 house_obertus_modifier: "奥伯图斯"
 house_obertus_modifier_desc: "君士坦丁堡的陷落沉重地打击了勤奋的奥伯图斯教团。但他们仍然不知疲倦地工作，以揭开神性最深的秘密。"
 house_grimaldi_modifier: "格里马尔迪"
 house_grimaldi_modifier_desc: "最像人的[Glossary('遗传血仆','game_concept_revenant_desc')]，是连接棘秘魑$pod_clan$与凡人的世界的纽带。他们是有天赋的外交官和商人，但却被更好战的家族所蔑视。"
 house_bratovitch_modifier: "布拉托维奇"
 house_bratovitch_modifier_desc: "布拉托维奇通常是为棘秘魑服务的凶蛮怪物，他们是斗士和追踪者，很少参加更优越的社交活动。"
 house_szantovich_modifier: "桑托维奇"
 house_szantovich_modifier_desc: "桑托维奇是颓废的，富有的，享乐的交际花。他们刺激他们的感官，追求快乐，与人类玩耍，不计后果的放纵。他们可能是最不能自控的[Glossary('遗传血仆','game_concept_revenant_desc')]。"
 house_vlaszy_modifier: "弗拉齐"
 house_vlaszy_modifier_desc: "每一位弗拉齐从小就接受马术、政治技巧、战争艺术和其他宫廷技巧的训练，许多棘秘魑的长者喜欢把他们作为其等的斗士和使者。"
 house_basarab_modifier: "巴萨拉布"
 house_basarab_modifier_desc: "他们以骁勇善战和领导能力著称，是棘秘魑的宝贵资产。巴萨拉布世系每晚都在成长，开始让他们的一些主人对他们所谓的“宠物”的力量感到不安……"
 house_premysl_modifier: "普热米斯尔"
 house_premysl_modifier_desc: "作为波西米亚皇室世系的后裔，普热米斯尔对他们的下级来说是残忍和霸道的领主，但对他们的棘秘魑主人却是狂热的忠诚。"
 house_danislav_modifier: "达尼斯拉夫"
 house_danislav_modifier_desc: "原本是一个与影爵有联系的贵族宗族，北特兰西瓦尼亚的达尼斯拉夫被棘秘魑的弗洛雷斯库统治，头十年他把他们关在地牢里，并要求他们为他服务。"
 house_khazi_modifier: "哈茲"
 house_khazi_modifier_desc: "这个奇怪的和隐遁的世系只服务于玛土撒拉比洛博格，即使按照棘秘魑的标准，也被认为是异形和畸形的。"
 dynn_ducheski_modifier: "杜切斯基"
 dynn_ducheski_modifier_desc: "这是一个曾叫克列夫切斯基的家族，并曾属于棘秘魑，现在为睿魔尔服务，以擅长魔法和制造机械设备闻名，尤其是折磨人的工具。许多睿魔尔让杜切斯基维护他们的图书馆和实验室。"
 house_oprichniki_modifier: "特辖区管"
 house_oprichniki_modifier_desc: "伊凡雷帝的秘密警察从他们主人的统治下勉强幸存了下来。这些幸存者被俄罗斯的棘秘魑收养，并被养成了[Glossary('遗传血仆','game_concept_revenant_desc')]家族，尽管他们从未踏足过特兰西瓦尼亚贫瘠的土地。"
 house_narov_modifier: "纳罗夫"
 house_narov_modifier_desc: "傲慢的纳罗夫被大多数其他家庭所鄙视，但他们奢华的生活方式仍然是许多人羡慕的对象。"
 house_rustovitchi_modifier: "罗斯托维奇"
 house_rustovitchi_modifier_desc: "被扔进一场他们不想打的战争，罗斯托维奇一家别无选择，要么赢，要么死。"
 house_slatikov_modifier: "斯拉蒂科夫"
 house_slatikov_modifier_desc: "拉兹科利纳（克拉科夫的棘秘魑）的棋子，斯拉蒂科夫是一个由学者和有学问的人的组成的小家族，对千年圣战这盘大棋几乎没有兴趣。"
 dynn_enrathi_modifier: "恩拉提"
 dynn_enrathi_modifier_desc: "恩拉提是奴隶，一直都是。尽管时代在变化，但总有人希望有他们的服务……一直都有。"
 dynn_marijava_modifier: "马里爪哇"
 dynn_marijava_modifier_desc: "塔尔玛埃拉的间谍和刺客对他们所选择的技艺非常专注，甚至固执。"
 dynn_rafastio_modifier: "拉法斯蒂奥"
 dynn_rafastio_modifier_desc: "迷人的拉法斯蒂奥与塔尔玛埃拉有一定的联系，他们既是预言家，又是擅长社交的飞蝶。"
 dynn_dhabi_modifier: "扎比"
 dynn_dhabi_modifier_desc: "意志薄弱的扎比已经被他们的巴力主子几个世纪以来的虐待折磨得精神崩溃了。"
 dynn_keskinen_modifier: "凯斯基宁"
 dynn_keskinen_modifier_desc: "凯斯基宁是一个非常小的，关系紧密的家庭，他们为一个叫娄希的疯狂玛土撒拉服务。他们使用古老的，几乎被遗忘的魔法，部分是由他们扭曲的血液和传承多年的传统所提供的力量。"
 dynn_rosselini_modifier: "罗塞里尼"
 dynn_rosselini_modifier_desc: "精神错乱的罗塞里尼是一个亡灵术师家族，他们和乔凡尼有太多的交集。他们现在为其古老的敌人服务，不管愿意与否。"
 dynn_rawan_modifier: "拉万"
 dynn_rawan_modifier_desc: "为古怪的阿努欣·拉万服务的渔民们被培养的目的只有一个：对他们的女士绝对忠诚。"
 dynn_kairouan_modifier: "凯鲁万兄弟会"
 dynn_kairouan_modifier_desc: "凯鲁万兄弟会是阿刹迈的术士在棘秘魑的[Glossary('遗传血仆','game_concept_revenant_desc')]上进行的实验创造出来的。凯鲁万兄弟会在世界各地分裂，三个种姓都在为如何充分利用剩下的几个人而斗争。"
 dynn_dimitriou_modifier: "迪米特里奥"
 dynn_dimitriou_modifier_desc: "帕里斯曾经为了保护他的女士杀过人、怪物和神。他很快就会再这么做的。"
 dynn_nirriti_modifier: "尼利提"
 dynn_nirriti_modifier_desc: "死亡国度的捍卫者是一群坚强的人，是任何异端的可怕敌人。"
 dynn_crassus_modifier: "克拉苏"
 dynn_crassus_modifier_desc: "诞生于罗马时代的一个疯狂实验，克拉苏家族被诅咒为帝国时代最恶劣的暴行。"
 dynn_gravenor_modifier: "格拉维诺尔"
 dynn_gravenor_modifier_desc: "偏执的格拉维诺尔藏得很好，只要他们还清醒，就一直为诺斯费拉图主人服务。"
 dynn_angustri_modifier: "安格斯特里"
 dynn_angustri_modifier_desc: "罕见的安格斯特里以其聪慧而闻名，并充分利用他们的技能为他们的雷伏诺金主服务。"
 dynn_kurulas_modifier: "丘鲁却"
 dynn_kurulas_modifier_desc: "成吉思汗的配偶的部落是[Glossary('安答','podgloss.anda')]部族的珍宝。他们被谨慎地保护着，作为一种通向它们辉煌历史的享有盛誉的牵绊。"
 dynn_qarnaim_modifier: "加尔南"
 dynn_qarnaim_modifier_desc: "迦太基的人类–$pod_cainite$关系曾达成一次巅峰。加尔南正在努力使其的起源事件再次实现。"
 dynn_bomkazi_modifier: "邦卡齐"
 dynn_bomkazi_modifier_desc: "忠心于她们的魔蛇鹫伴侣，邦卡齐女巫担心其等的血液会慢慢被稀释。"
 house_faust_modifier: "福斯特"
 houst_faust_modifier_desc: "齐特雷执行了一大堆不道德的实验，并在其对更多知识的追求中跟崇魔力量进行了交易。"
 dynn_societyofstgeorge_modifier: "圣乔治社团"
 dynn_societyofstgeorge_modifier_desc: "没有人能在开阔的战场上发起像圣乔治骑士那样的毁灭性正面冲锋，但他们对这种战术的偏爱有着近乎盲目的自大。"
 dynn_custom_bloodline_war_modifier: "战士血系"
 dynn_custom_bloodline_war_modifier_desc: "该血系与征服共存，大多数的血族都认为他们是好战者。"
 dynn_custom_bloodline_prowess_modifier: "杀手血系"
 dynn_custom_bloodline_prowess_modifier_desc: "这一血系由致命的杀手组成。这不会让他们在血族中受欢迎，但几乎每个人都害怕他们。"
 dynn_custom_bloodline_intrigue_modifier: "谋士血系"
 dynn_custom_bloodline_intrigue_modifier_desc: "该血系的成员是$pod_cainite$世界里最致命的阴谋者。"
 dynn_custom_bloodline_diplomacy_modifier: "外交官血系"
 dynn_custom_bloodline_diplomacy_modifier_desc: "该血系的成员相信，一个人如果能从中受益时彬彬有礼，就能成就大事。"
 dynn_custom_bloodline_learning_modifier: "贤者血系"
 dynn_custom_bloodline_learning_modifier_desc: "该血系的成员在寻找着真理。他们认为知识远比政治阴谋和战争重要。"
 dynn_custom_bloodline_stewardship_modifier: "统治者血系"
 dynn_custom_bloodline_stewardship_modifier_desc: "该血系的成员总想凌驾于他人之上。不是因为他们自大，而是因为他们知道如何统治。"
 dynn_custom_bloodline_secret_modifier: "纯血"
 dynn_custom_bloodline_secret_modifier_desc: "该血系的成员认为他们是该隐的真正后代。在他们眼里，其他$pod_cainite$都只是吸血的蚂蟥，没有权利拥有该隐之血。"
 house_mancheaka_modifier: "曼彻阿卡家族"
 house_mancheaka_modifier_desc: "正如他们的始祖很久以前所做的那样，这一世系的成员倾向于一头扎进危险中，使他们成为善于布局者不费力的猎物。"
 house_caias_modifier: "柯因内家族"
 house_caias_modifier_desc: "凯亚斯·柯因内为保护[Glossary('尊长','game_concept_Sire_desc')]的荣誉而战，却被最邪恶的术法所害。"
 house_nebmaatsutekh_modifier: "内布玛阿特苏泰赫家族"
 house_nebmaatsutekh_modifier_desc: "奇迹之母是拉神欠赛特的不死证据。"
 house_nephtys_modifier: "奈芙蒂斯家族"
 house_nephtys_modifier_desc: "她因欺骗而生，也因欺骗而死。"
 house_wadjet_modifier: "瓦吉特家族"
 house_wadjet_modifier_desc: "曾被赛特迷惑，但瓦吉特挣脱出来，并勇敢地战斗，保护其他人免受他的伤害。"
 house_gilgamesh_modifier: "吉尔伽美什家族"
 house_gilgamesh_modifier_desc: "诗人创作了许多关于他的歌曲，但没一首是关于他死亡。"
 house_enkidu_modifier: "恩奇都家族"
 house_enkidu_modifier_desc: "被委以最重要的任务，恩奇都绝不会动摇。"
 house_amarantha_modifier: "阿莫拉察家族"
 house_amarantha_modifier_desc: "第一位被毁灭者仍然活着，痛苦和仇恨的传承。"
 house_amphion_modifier: "安菲翁家族"
 house_amphion_modifier_desc: "安菲翁用他和谐而舒缓的音乐迷住了亚力科本人。"
 house_tammuz_modifier: "搭模斯家族"
 house_tammuz_modifier_desc: "亚力科的保护者兼爱人的牺牲使他的世系充满了一种不祥的责任感。"
 house_ereshkigal_modifier: "埃列什基伽勒家族"
 house_ereshkigal_modifier_desc: "这位神秘又隐秘的女术士有自己的终局，远离着其他冈格罗的关注。"
 house_cyscek_modifier: "西斯克家族"
 house_cyscek_modifier_desc: "面对他的怪物亲属，西斯克会毫不犹豫地做出究极的牺牲。"
 house_gallod_modifier: "伽罗家族"
 house_gallod_modifier_desc: "最长者的怖行的受害者，伽罗的世系是用血写成的。"
 house_ionache_modifier: "约纳凯家族"
 house_ionache_modifier_desc: "第一军督早已被遗忘。但他的世系却记住了他们失去的荣耀。"
 house_toomler_modifier: "托姆勒家族"
 house_toomler_modifier_desc: "作为一位易变术大师，托姆勒无法看到那些更为平凡的危险。直到今晚，他仍然以另一种形式为$pod_clan$服务。"
 house_melachoate_modifier: "梅拉乔亚特家族"
 house_melachoate_modifier_desc: "叛逆的尼克图库在玩弄着两边，小心翼翼地确保他们中没有人怀疑它。"
 house_petrodon_modifier: "佩德罗顿家族"
 house_petrodon_modifier_desc: "一种狂热的激情驱使佩特罗顿不断前进，使他的敌人畏惧地低声呼唤他的名字。"
 house_carna_modifier: "卡纳家族"
 house_carna_modifier_desc: "一个寻找目标的迷失灵魂可能是对睿魔尔金字塔的最大威胁。"
 house_dracula_modifier: "德古拉家族"
 house_dracula_modifier_desc: "这人留下的恐惧和恐怖的传承，总有一天会成为所有吸血鬼的传承。"
 house_valerius_modifier: "瓦勒留斯家族"
 house_valerius_modifier_desc: "没有人尊重忠诚的中尉，直到他不再忠诚了。"
 house_giangaleazzo_modifier: "加莱亚佐家族"
 house_giangaleazzo_modifier_desc: "真亲王知道什么时候要审查他目前的拥护。"
 house_cardona_modifier: "卡多纳家族"
 house_cardona_modifier_desc: "一位真正的族长甚至会保护其家族中最卑微的成员。"
 house_rosselini_modifier: "罗塞里尼家族"
 house_rosselini_modifier_desc: "知识不在乎道德底线。"
 dynn_mamluk_modifier: "马穆鲁克劣族家族"
 dynn_mamluk_modifier_desc: "虽然因他们的劣族世系而受到偏见，但穆赫塔尔·贝伊的后裔还是一次又一次地证明了他们的行政能力。"
 house_cecilia_modifier: "塞西莉娅家族"
 houst_cecilia_modifier_desc: ""
 house_etheyra_modifier: "伊德利拉家族"
 house_etheyra_modifier_desc: "当背叛所有人和一切时，要预备好少数在最后还信任你的人。"
 custom_lay_order_modifier: "受引家族"
 custom_lay_order_modifier_desc: "一个发誓援助功业的由非专业人士组成的贵族家族。"
 custom_knightly_order_modifier: "骑士团"
 custom_knightly_order_modifier_desc: "一个由圣礼约束的战士组织"
 custom_mendicant_order_modifier: "托钵修会"
 custom_mendicant_order_modifier_desc: "一个发誓要生活在普通人中间并帮助他们的宗教社团。"
 custom_contemplative_order_modifier: "默观修会"
 custom_contemplative_order_modifier_desc: "一个由信徒组成的团体，远离俗世事务保持隐居，专注于祈祷。"
 house_dankovsky_modifier: "丹科夫斯基家族"
 house_dankovsky_modifier_desc: "草原上过于谨慎的亡灵术师在强行被初拥之后，注定要对家族永远不信任。"
 house_ananke_modifier: "阿南刻家族"
 house_ananke_modifier_desc: "受冤者将对欺骗者的儿女进行血腥的报复。"
 house_bashirite_modifier: "巴希里特家族"
 house_bashirite_modifier_desc: "末日之前，亦可赚钱。"
 house_phaedymite_modifier: "辉迪米特家族"
 house_phaedymite_modifier_desc: "雷伏诺骑士团不顾自己，试图挽回他们已经堕落的氏族。"
 house_sybarite_modifier: "希巴利特家族"
 house_sybarite_modifier_desc: "无对无错。愿取即拿。"
 house_yoryari_modifier: "约拉里家族"
 house_yoryari_modifier_desc: "寻找真理，回归本源。东方在呼唤。"
 indian_ravnos_improved_modifier: "印度雷伏诺授能"
 indian_ravnos_improved_modifier_desc: "雷伏诺氏族的中心坚守着，并将继续这样。其将获得永恒之战的胜利。"
 house_alexandrite_improved_modifier: "激昂的亚历山得利特家族"
 house_alexandrite_improved_modifier_desc: "古蛇在古埃及的真正继承人面前遮掩。"
 house_rroma_improved_modifier: "激昂的普日·达伊家族"
 house_rroma_improved_modifier_desc: "流浪者最终将找到一个可以称之为家的地方，以及他们真正应得的休息。"
 house_baytmujirim_improved_modifier: "激昂的贝特·穆吉里姆家族"
 house_baytmujirim_improved_modifier_desc: "从被抛弃者到统治者，他们曾经在桌上没有席位。现在他们拥有这张桌。"
 house_bashirite_improved_modifier: "激昂的巴希里特家族"
 house_bashirite_improved_modifier_desc: "如果天堂的位置可以买卖，巴希里特已经准备好为它讨价还价。"
 house_phaedymite_improved_modifier: "激昂的辉迪米特家族"
 house_phaedymite_improved_modifier_desc: "忠诚和荣誉永远不会消失。即使在不死族中也是如此。"
 house_sybarite_improved_modifier: "激昂的希巴利特家族"
 house_sybarite_improved_modifier_desc: "这宴席永远不会结束。"
 house_yoryari_improved_modifier: "激昂的约拉里家族"
 house_yoryari_improved_modifier_desc: "一个新的东西混合体崛起，比两者的总和还要强大。"
 dynn_horus_modifier: "贤荷鲁"
 dynn_horus_modifier_desc: "贤荷鲁是第一朝代，是由诸神创造的真正的不朽者，他们对$glossary_wyrm_apophis$发动了一场圣战。"
 dynn_ishmaelites_modifier: "以实玛利派"
 dynn_ishmaelites_modifier_desc: "变节的以实玛利派，即第二朝代，由自对自由和自决的渴望而建立。"
 dynn_apepnu_modifier: "阿佩普派"
 dynn_apepnu_modifier_desc: "第三朝代是受诅的阿佩普派，他们是$glossary_wyrm_apophis$的走狗，由恶敌赛特的诅咒仪式抚育。"
 dynn_cabiri_modifier: "卡比里"
 dynn_cabiri_modifier_desc: "窃取不朽的杂种，第四朝代卡比里，收到了同等的羡慕与嫉妒。"
 dynn_wufeng_modifier: "巫凤"
 dynn_wufeng_modifier_desc: "巫凤偏阳，是朱凰的下属。"
 dynn_xianlung_modifier: "仙龙"
 dynn_xianlung_modifier_desc: "仙龙偏阴，是玄龙的下属。"
 dynn_asharu_modifier: "阿撒乌"
 dynn_asharu_modifier_desc: "阿撒乌是被放逐到[UmbraGlossary('abyss')]的前守护天使。"
 dynn_rabisu_modifier: "拉比苏"
 dynn_rabisu_modifier_desc: "拉比苏是曾经负责保护和丰富自然，同时将其提供给人类的恶魔。"
 dynn_halaku_modifier: "哈拉库"
 dynn_halaku_modifier_desc: "哈拉库曾是带来死亡，以便为更多生命腾出空间的耶洛因。"
 dynn_namaru_modifier: "纳玛鲁"
 dynn_namaru_modifier_desc: "纳玛鲁是第一天族，在堕天之前担任上帝的传令官。"
 dynn_lammasu_modifier: "拉玛苏"
 dynn_lammasu_modifier_desc: "拉玛苏曾作为上帝的天使时，负责启发和寻找真理、美和内在力量。"
 dynn_annunaki_modifier: "阿努纳奇"
 dynn_annunaki_modifier_desc: "阿努纳奇在被上帝谴入[UmbraGlossary('abyss')]前曾是大地的塑造者和锻造者。"
 dynn_neberu_modifier: "尼比鲁"
 dynn_neberu_modifier_desc: "尼比鲁是上帝造物的维护者，在堕天之前为顾问和预言家。"
 dynn_beaumayn_modifier: "博迈恩世家"
 dynn_beaumayn_modifier_desc: "今日，我宣誓效忠于宝典和宝剑，效忠于我的命运——未来，我的责任——现在，我的财富——过去。我发誓忠于博迈恩世家的成员和目标，如果我违背了这份信任，愿被诅咒者的梦境萦绕在我的脑海。正如黑暗之星在我头顶燃烧，我的心也在为你燃烧。"
 dynn_dougal_modifier: "杜伽尔世家"
 dynn_dougal_modifier_desc: "我的心属于杜伽尔。我的手臂将拿起他的锤子。我的身躯将承担他的重担。我的心将秉承他的意志。我会为他奋斗，直至生命的尽头。"
 dynn_eiluned_modifier: "爱伦涅德世家"
 dynn_eiluned_modifier_desc: "今日，我通过我的领主向黑与银宣誓效忠。我将给予优于我者其等应得的尊重，并努力引导比我年轻的人走上理解与智慧之道。每一天，我都将努力学习更多关于世界和自己内心的知识，以更好地充实爱伦涅德和我自己。最重要的是，我发誓将自己献给爱伦涅德世家作为封臣，希望能够光荣而杰出地为之服务。"
 dynn_fiona_modifier: "费恩娜世家"
 dynn_fiona_modifier_desc: "女士/大人，我将我所有的情感和温暖都献给你，让你在未来的岁月里，轻松自如地跨越万水千山。如你所愿，我将成为你的朋友、同伴和伴侣。在凄凉的时刻，我将与你相伴；在战场上，我将以骄傲和荣耀之意携带你的信物。你永远不会感到孤独，你的泪水永远不会被我的手拭去。在我的约束被打破之前，我的腰间不再满足，我的心不再为肉欲的欢愉而欣喜。如果我辜负了你的信任，愿费恩娜的银狮之牙将我撕碎！"
 dynn_gwydion_modifier: "格威狄昂世家"
 dynn_gwydion_modifier_desc: "猎鹰的大人和女士们，从今天起我宣誓效忠你们和高贵的格威狄昂世家，直至太阳不再燃烧。我决不辜负重托，也不辜负兄弟姐妹们的荣誉。我将在和平中和蔼可亲，在战斗中不屈不挠，我将用我的行动为格威狄昂世家带来荣誉。我以灰之格威狄昂大人和克雷德温夫人的名义起誓。"
 dynn_liam_modifier: "利亚姆世家"
 dynn_liam_modifier_desc: "假若我抛却旅程的指引，\n假若我忽视[UmbraGlossary('dreaming')]的关怀，\n假若我忽视责任的需要，\n假若我忽略职责的纯粹。\n愿太阳之光炙烤我肌肤，\n愿月亮之光使我惊惧，\n愿大地之食引我饥饿，\n愿生命之水干涸我喉咙，"
 dynn_aesin_modifier: "阿萨世家"
 dynn_aesin_modifier_desc: "我永恒的灵魂现在属于阿萨世家。我以家乡的山林起誓，我将秉承阿萨世家的传统和习俗。我将在猫头鹰的羽翼下寻求庇护。如果我违背誓言，愿[UmbraGlossary('dreaming')]剥夺我的一切特权，永远不让我忘记我的过去和现在。"
 dynn_ailil_modifier: "艾力世家"
 dynn_ailil_modifier_desc: "借银龙之鳞，借四重星之光，借黑夜之毯，我将我的身躯、心灵和意志交付给艾力世家。愿它的目标指引我的视野，它的希望引导我的志向，它的宗旨激励我的行动。如果我背叛了今夜所说的话，就让我所有的雄心壮志化为灰烬。此刻，身旁的巨龙，顶上的星辰，身后的黑夜，皆在见证我的誓言。"
 dynn_balor_modifier: "巴烙世家"
 dynn_balor_modifier_desc: "我以缠绕在金塔上的巨蛇，巴烙之眼中射出的深红色光束，和我血管中像火一样流淌的血液起誓，我的心智和身体都将服从巴烙世家的意志。让我身上与众不同的挑战时刻提醒着我的出生和命运。如果我背叛了我的家族，愿我遭受万千烈焰的煎熬。我先于[UmbraGlossary('dreaming')]本身，以鲜血和眼睛起誓。"
 dynn_daireann_modifier: "戴瑞恩世家"
 dynn_daireann_modifier_desc: "兄弟姐妹们，我以剑的锋芒和血的纽带宣誓，我将用我双臂的力量和内心的勇气捍卫你们和我等的事业，抵抗敌人的力量。只要我还有一口气在，你们就永远不会在战场上孤立无援。如果我违背誓言，愿铁刀之雨刺穿我的胸膛，让我的灵魂永远陷入黑暗。"
 dynn_leanhaun_modifier: "恋难舍世家"
 dynn_leanhaun_modifier_desc: "在梦界的元素和精髓的指引下，我在见证者面前宣布，我已准备好在恋难舍世家中履行职责。我将忠于家族，保守家族的秘密，协助家族的成员，以及守护家族的宝藏。如果我未能履行我的职责，或者背叛了我的家族，那么就让我的名字从历史中删除，从梦种的脑海中抹去。让我的故事未完，再让我的使命未达，最终让我的精华随风飘散。不要让戚族想起曾经有我这样的存在。"
 dynn_varich_modifier: "瓦里克世家"
 dynn_varich_modifier_desc: "我开始了一个式样，现在我结束它，以瓦里克的名义开始新的旅程，他是我所承袭的家族的创始人。愿我永不错过任何一个式样的线索。愿我永不回避挑战的呼应。愿我永不对他人许下真爱的誓言。我向瓦里克世家致以敬意，并以我的思想、我的心灵和我的行动为其服务。如果我背弃我的誓言，愿我家族的每一双手都起来反抗我，愿我跳动的心脏的式样永远沉寂。"
 dynn_danaan_modifier: "达南世家"
 dynn_danaan_modifier_desc: "天上的每一颗星星，都有一条路要走。黑夜中的每一个梦境，都有一段旅程在等待着我们。我对着天上的星辰和心中的梦起誓，我将为达南世家服务，守护[UmbraGlossary('dreaming')]之路，然后在不存在的地方开辟新的道路。我将守护旅人，指引梦境之人，直到无路可走。我发誓，如果我不能遵守誓言，愿巨龙在梦中吞噬我。"
 dynn_scathach_modifier: "斯卡哈世家"
 dynn_scathach_modifier_desc: "今天，我以鲜血和钢铁起誓，将我的生命奉献给斯卡哈世家。我将倾听神谕的话语，并誓言不为任何带来耻辱的事业挥舞我的刀锋。我将维护自己的武器，保守自己的秘密，并沿着自己的道路行走，直到我不再投下阴影的那一天。因此，我发誓，以明亮的月光和沾满鲜血的刀刃为证。如此，我的漫长旅程开始了。"
 house_abdallah_modifier: "阿卜杜拉家族"
 house_abdallah_modifier_desc: "传承者，预言者，观察者。"
 POD_unity_impassive_tax_modifier: "改善行政"
 POD_unity_impassive_tax_modifier_desc: "该家族的成员行政效率得到了提高。"
 dynn_orderofstjoan_modifier: "圣贞德修会"
 dynn_orderofstjoan_modifier_desc: "无论教会喜欢与否，贞德的追随者们都以自己的方式与邪恶作斗争。"
 POD_aspiration_legacy_5_modifier: "进化之血"
 house_lexor_modifier: "莱克索尔家族"
 house_lexor_modifier_desc: "莱克索尔布鲁赫管理着整个帝国。可悲的是，他们的官僚主义使他们对远离本土的威胁视而不见。"
 dynn_rock_lord_modifier: "石像鬼家族"
 dynn_rock_lord_modifier_desc: "昔为奴仆，今以石铸之亲缘纽带，自由统御大地。"
 house_mnemach_modifier: "谟涅摩家族"
 house_mnemach_modifier_desc: "谟涅摩一生居于卢泰利亚。其对古魔法的精通，唯对城邦之爱可与之比肩。"
 house_ennamaru_modifier: "恩那玛鲁之子"
 house_ennamaru_modifier_desc: "忌子乃法兰西该隐之子宫廷中残忍而嗜虐的操纵者。凡涉其局者，皆无善终。"
 house_the_third_modifier: "第三始祖"
 house_the_third_modifier_desc: "敬畏未知"
 house_hollow_reeds_modifier: "空芦家族"
 house_hollow_reeds_modifier_desc: "万魔必须经历万次生命，才能作为天之英雄归来。"
 house_eight_lotus_modifier: "八莲家族"
 house_eight_lotus_modifier_desc: "血/学指明了道路，严格遵循它是唯一的救赎之路。"
 house_midnight_jewel_modifier: "夜珠家族"
 house_midnight_jewel_modifier_desc: "接受他们已死且静止，是$pod_kueijin$从过去的错误中吸取教训的唯一途径。"
 house_hell_tigers_modifier: "冥虎家族"
 house_hell_tigers_modifier_desc: "无情恶鬼将步步紧逼，直至[Glossary('魔皇','podgloss.demonemperor')]登临绝顶。"
 house_inward_seekers_modifier: "内引求者家族"
 house_inward_seekers_modifier_desc: "内引求以离群索居明心见性，或许这正是他们知己寥寥的缘由。"
 house_celestial_nails_modifier: "天钉家族"
 house_celestial_nails_modifier_desc: "这些自诩蒙冤女神子嗣者，究竟是妄自尊大还是癫狂迷乱？"
 house_cerulean_watchers_modifier: "青苍守望家族"
 house_cerulean_watchers_modifier_desc: "与喜怒无常的鬼神交感，或得莫大裨益……或遭灭顶之灾。"
 house_emperor_vanguard_modifier: "帝锋家族"
 house_emperor_vanguard_modifier_desc: "[Glossary('魔皇','podgloss.demonemperor')]登极需马前卒开道，至于这些卒子事后能否得偿所愿——则另当别论。"
 house_crane_modifier: "笑鹤家族"
 house_crane_modifier_desc: "圣母后裔在死后领悟的生存真谛，远胜生前所得。"
 house_jade_demons_modifier: "玉魔家族"
 house_jade_demons_modifier_desc: "坐拥最富矿脉的碧玉恶魔，已将贩卖珍宝的生意炼成艺术。"
 house_uji_modifier: "宇治家族"
 house_uji_modifier_desc: "传统豪门与夜寺宗师虽貌合神离，终成同盟。"
 house_thunder_tiger_modifier: "雷虎家族"
 house_thunder_tiger_modifier_desc: "专注于参悟人道变迁的魔虎，行动总快其他$pod_kueijin$一步。"
 house_wise_spider_modifier: "智蛛家族"
 house_wise_spider_modifier_desc: "智蛛培育独到的人道认知，他们深知凡人在对抗[Glossary('魔皇','podgloss.demonemperor')]的终极之战中将举足轻重。"
 house_blooming_blossom_modifier: "绽簇家族"
 house_blooming_blossom_modifier_desc: "恪守古道，循序渐进，终将赢得这场战争。"
 house_six_springs_modifier: "六泉家族"
 house_six_springs_modifier_desc: "每个人都有获得救赎的机会，即使不是每个人都会利用它。"
 house_yellow_moon_modifier: "黄月家族"
 house_yellow_moon_modifier_desc: "如果你追随他人的脚步，请确保他们没有先迷失方向。"
 house_inward_tempest_modifier: "内引怒者家族"
 house_inward_tempest_modifier_desc: "如果你找不到返回须弥山的路，请确保没有其他人能找到。"
 house_tigers_meru_modifier: "须弥虎家族"
 house_tigers_meru_modifier_desc: "在世界之巅，如此接近起源，却又如此远离启蒙。"
 house_proud_tigers_modifier: "傲虎家族"
 house_proud_tigers_modifier_desc: "至尊者为何是永不犯错的？没有人可以免受质疑。"
 house_scorching_devils_modifier: "灼魔家族"
 house_scorching_devils_modifier_desc: "每一个人都必须奋力阻止[Glossary('魔皇','podgloss.demonemperor')]。无论是否情愿。"
 house_bishamon_modifier: "毗沙门家"
 house_bishamon_modifier_desc: "日本夜间的统治者不允许异议，对威胁其统治的行为几乎没有耐心。"
 house_genji_modifier: "源氏家"
 house_genji_modifier_desc: "日本夜间那些年轻富有的暴发户会不择手段，只要他们能爬上顶峰。"
 house_iga_modifier: "伊贺家"
 house_iga_modifier_desc: "伊贺专门处理凡人威胁，尽管人数不多，但他们非常擅长自己的工作。"
 house_koga_modifier: "甲贺家"
 house_koga_modifier_desc: "甲贺专门处理超自然威胁，尽管人数不多，但他们非常擅长自己的工作。"
 house_sotogawa_modifier: "外川家"
 house_sotogawa_modifier_desc: "日本夜间政治的“外来者”为他们的绰号感到自豪。他们艰难地赢得了勉强的接受。"
 house_nukekubi_modifier: "辘轳首家"
 house_nukekubi_modifier_desc: "檀林之辘轳首是日本最殊胜的肉神体宗师之一，其事迹化作无数神话流传于世。"
 house_taira_modifier: "平氏家"
 house_taira_modifier_desc: "最重要的保守派家族也是天皇的守护者。一个享有盛誉，尽管只是礼仪性的职位。"
 house_echizen_modifier: "越前家"
 house_echizen_modifier_desc: "玉术士，工匠，与朝鲜的中间人，越前在许多领域都有涉足。"
 house_chibo_modifier: "赤膊家"
 house_chibo_modifier_desc: "[Glossary('瓮星','podgloss.mikaboshi')]的棘秘魑秘术师与祭司血脉，赤膊家是血染的魔法星辰。"
 house_monomi_modifier: "物见家"
 house_monomi_modifier_desc: "[Glossary('瓮星','podgloss.mikaboshi')]的棘秘魑战士，物见是剑刃的血色星辰。"
 house_kishu_modifier: "鬼众家"
 house_kishu_modifier_desc: "[Glossary('瓮星','podgloss.mikaboshi')]的棘秘魑刺客，鬼众是血染的匕首星辰。"
 house_kizoku_modifier: "华族家"
 house_kizoku_modifier_desc: "诞生于说书人而受噩梦缠身，华族是裂隙中的血族。"
 house_bushi_modifier: "武士家族"
 house_bushi_modifier_desc: "自称天津神中风暴神血浴而生的子嗣，武士家是无双的桀骜武者。"
 house_kuntilanak_modifier: "昆蒂拉娜家族"
 house_kuntilanak_modifier_desc: "受困于生死两界间的孤绝诅咒，昆蒂拉娜是幽魂般的亡灵术大师。"
 house_sangun_modifier: "山君家族"
 house_sangun_modifier_desc: "盘踞朝鲜山岳的领主，山君是化兽之形的统治者。"
 house_anh_modifier: "安赫家族"
 house_anh_modifier_desc: "与冈格罗氏族分化却不同于航海者血系，安赫是潜伏于印度尼西亚、中南半岛及马来西亚周边海域的隐秘猎手。"
 house_banpaia_modifier: "班派亚家族"
 house_banpaia_modifier_desc: "作为一支迷失东方的睿魔尔远征队后裔，吸血鬼家族已成为东亚夜界新势力。"
 house_bishamon_improved_modifier: "主导家族：毗沙门"
 house_bishamon_improved_modifier_desc: "日本夜间的统治者不允许异议，对威胁其统治的行为几乎没有耐心。"
 house_genji_improved_modifier: "主导家族：源氏"
 house_genji_improved_modifier_desc: "日本夜间那些年轻富有的暴发户会不择手段，只要他们能爬上顶峰。"
 house_iga_improved_modifier: "主导家族：伊贺"
 house_iga_improved_modifier_desc: "伊贺专门处理凡人威胁，尽管人数不多，但他们非常擅长自己的工作。"
 house_koga_improved_modifier: "主导家族：甲贺"
 house_koga_improved_modifier_desc: "甲贺专门处理超自然威胁，尽管人数不多，但他们非常擅长自己的工作。"
 house_sotogawa_improved_modifier: "主导家族：外川"
 house_sotogawa_improved_modifier_desc: "日本夜间政治的“外来者”为他们的绰号感到自豪。他们艰难地赢得了勉强的接受。"
 house_nukekubi_improved_modifier: "主导家族：辘轳首"
 house_nukekubi_improved_modifier_desc: "檀林之辘轳首是日本最殊胜的肉神体宗师之一，其事迹化作无数神话流传于世。"
 house_taira_improved_modifier: "主导家族：平氏"
 house_taira_improved_modifier_desc: "最重要的保守派家族也是天皇的守护者。一个享有盛誉，尽管只是礼仪性的职位。"
 house_echizen_improved_modifier: "主导家族：越前"
 house_echizen_improved_modifier_desc: "玉术士，工匠，与朝鲜的中间人，越前在许多领域都有涉足。"
 house_chibo_improved_modifier: "主导家族：赤膊"
 house_chibo_improved_modifier_desc: "[Glossary('瓮星','podgloss.mikaboshi')]的棘秘魑秘术师与祭司血脉，赤膊是血染的魔法星辰。"
 house_monomi_improved_modifier: "主导家族：物见"
 house_monomi_improved_modifier_desc: "[Glossary('瓮星','podgloss.mikaboshi')]的棘秘魑战士，物见是剑刃的血色星辰。"
 house_kishu_improved_modifier: "主导家族：鬼众"
 house_kishu_improved_modifier_desc: "[Glossary('瓮星','podgloss.mikaboshi')]的棘秘魑刺客，鬼众是血染的匕首星辰。"
 house_kizoku_improved_modifier: "主导家族：华族"
 house_kizoku_improved_modifier_desc: "诞生于说书人而受噩梦缠身，华族是裂隙中的血族。"
 house_bushi_improved_modifier: "主导家族：武士"
 house_bushi_improved_modifier_desc: "自称天津神中风暴神血浴而生的子嗣，武士是无双的桀骜武者。"
 japanese_uji_improved_modifier: "主导家族：宇治"
 japanese_uji_improved_modifier_desc: "该宇治已在日本夜之政治中超越其竞争对手，取得卓越地位。"
 house_nyayo_modifier: "主导家族：尼亚约"
 house_nyayo_modifier_desc: "非洲本土的劣族试图集结莱本族裔抵御外来干涉。"
 dynn_bima_modifier: "毕玛"
 dynn_bima_modifier_disc: "由真加创造的血仆世系毕玛，其血脉具有极端的混沌可塑性。"
 house_erk_improved_modifier: "激昂的厄克家族"
 house_erk_improved_modifier_desc: "这支突厥裔的雷伏诺已然牢牢掌控住自己的故土祖地。这一次他们绝不会再弃守分毫。"
 house_erk_modifier: "厄克家族"
 house_erk_modifier_desc: "在额尔古涅·昆与世隔绝的严酷环境中淬炼而生，厄克以近乎冷酷的高效手段从领地中榨取着财富。但他们这般坚忍孤僻的秉性却让其在社交场合中显得笨拙不堪。"
 dynn_impundulu_improved_modifier: "Impundulu — Keepers of the Passage"
 dynn_impundulu_improved_modifier_desc: "Having performed the sacred funeral rites, the Impundulu have strengthened their bond with the spirit world. The burden of their covenant weighs less heavily."
 covenant_of_life_and_death_modifier: "Covenant of Life and Death"
 covenant_of_life_and_death_modifier_desc: "Through ancient necromantic rites, the Impundulu have renewed their covenant with the Bomkazi line. The bond between living witch and undead necromancer is stronger than ever."
 ishologu_modifier: "The Ishologu"
 ishologu_modifier_desc: "Having broken the ancient pact through the Ishologu Rite, this vampire is no longer bound to the Bomkazi witches. Free from the feeding restriction, but severed from the life-magic that once sustained them."
 fellow_scholar_of_death_modifier: "Fellow Scholar of Death"
 fellow_scholar_of_death_modifier_desc: "We have exchanged knowledge of the necromantic arts. There is respect between scholars of the grave."
 memory_of_bomkazi_modifier: "Memory of Bomkazi"
 memory_of_bomkazi_modifier_desc: "The memory of Bomkazi, the first witch-wife, lingers still. Her sacrifice echoes through the ages."
 withering_blood_urgency_modifier: "The Withering Blood"
 withering_blood_urgency_modifier_desc: "The Bomkazi line grows weaker with each generation. Something must be done before the mortal witches are gone entirely."
 POD_impundulu_has_bomkazi_courtier_tt: "Has a Bomkazi witch in your court"
 POD_impundulu_is_necromantic_vampire_tt: "Has knowledge of Necromancy"
 POD_impundulu_has_completed_withering_blood_tt: "Has completed the 'Cure the Withering Blood' objective"