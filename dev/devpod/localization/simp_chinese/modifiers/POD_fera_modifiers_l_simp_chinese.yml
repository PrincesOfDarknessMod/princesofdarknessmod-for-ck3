 POD_delirium_modifier: "[battle_modifier|E]：妄悸"
 POD_delirium_modifier_desc: "妄悸是一种压倒性的本能恐惧，那些看到狼人和一些其他$glossary_fera$的战争形态的凡人会遭受它影响。"
 POD_reduced_delirium_modifier: "[battle_modifier|E]：部分妄悸"
 POD_reduced_delirium_modifier_desc: "妄悸是一种压倒性的本能恐惧，那些看到狼人和一些其他$glossary_fera$的战争形态的凡人会遭受它影响。"
 POD_werewolf_form_crinos_modifier: "半狼形形态"
 POD_werewolf_form_crinos_modifier_desc: "战争形态，一种可怕的人与狼的混合体，具有超强的力量。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_werewolf_form_glabro_modifier: "人狼形形态"
 POD_werewolf_form_glabro_modifier_desc: "大致上类似于人类，但有过多的兽性特征。"
 POD_werewolf_form_hispo_modifier: "巨狼形形态"
 POD_werewolf_form_hispo_modifier_desc: "史前恐狼。"
 POD_werewolf_form_lupus_modifier: "狼形形态"
 POD_werewolf_form_lupus_modifier_desc: "与普通狼无异，但速度超群。"
 POD_ajaba_form_crinos_modifier: "半鬣狗形形态"
 POD_ajaba_form_crinos_modifier_desc: "战争形态；比狼族相比的更小，力量更弱，但更坚韧。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_ajaba_form_anthros_modifier: "人鬣形形态"
 POD_ajaba_form_anthros_modifier_desc: "类人形态。"
 POD_ajaba_form_crocas_modifier: "巨鬣狗形形态"
 POD_ajaba_form_crocas_modifier_desc: "类鬣狗形态。一只小熊般大小的巨大鬣狗。"
 POD_ajaba_form_hyaenid_modifier: "鬣狗形形态"
 POD_ajaba_form_hyaenid_modifier_desc: "鬣狗形态。"
 POD_ananasi_form_lilian_modifier: "莉莉安形态"
 POD_ananasi_form_lilian_modifier_desc: ""
 POD_ananasi_form_crawlerling_modifier: "爬行形态"
 POD_ananasi_form_crawlerling_modifier_desc: ""
 POD_ananasi_form_pithus_modifier: "巨蛛形态"
 POD_ananasi_form_pithus_modifier_desc: ""
 POD_bastet_form_crinos_modifier: "半猫形形态"
 POD_bastet_form_crinos_modifier_desc: "魁梧的人猫混合体，力量与狡诈的危险结合\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_bastet_form_sokto_modifier: "人猫形形态"
 POD_bastet_form_sokto_modifier_desc: "类人形态。"
 POD_bastet_form_chatro_modifier: "巨猫形形态"
 POD_bastet_form_chatro_modifier_desc: "原始猫形态"
 POD_bastet_form_feline_modifier: "猫形形态"
 POD_bastet_form_feline_modifier_desc: "普通猫咪。"
 POD_corax_form_crinos_modifier: "半鸦形形态"
 POD_corax_form_crinos_modifier_desc: "战争形态是非常笨拙的半鸟人。科拉克斯一般只用这种形态来击退敌人，使其有足够的时间逃跑，然后只在他们别无选择的时候使用。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_corax_form_corvid_modifier: "鸦形形态"
 POD_corax_form_corvid_modifier_desc: "鸦子的外形与普通乌鸦基本相同，但科拉克斯是一种特别大的鸟类，体型更接近于老鹰。"
 POD_gurahl_form_crinos_modifier: "半熊形形态"
 POD_gurahl_form_crinos_modifier_desc: "战争形态。特别强壮和坚韧，更不用说有多巨大：身高在10到16英尺之间，体重达1200公斤。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_gurahl_form_arthren_modifier: "人熊形形态"
 POD_gurahl_form_arthren_modifier_desc: "类人形态。人熊形形态的古拉赫勒比人狼形形态的狼人要强壮和坚韧得多，人们认为是大脚野人和类似生物传说的灵感来源。"
 POD_gurahl_form_bjornen_modifier: "巨熊形形态"
 POD_gurahl_form_bjornen_modifier_desc: "类熊形态。类似于远古洞穴熊，拥有更长的爪子和獠牙，体型和力量几乎与半狼形不相上下，所造成的咬伤和爪伤更加凶狠。"
 POD_gurahl_form_urus_modifier: "熊形形态"
 POD_gurahl_form_urus_modifier_desc: "拟熊形态。古拉赫勒人子的熊形态与其部族相匹配。"
 POD_kitsune_form_koto_modifier: "半狐形形态"
 POD_kitsune_form_koto_modifier_desc: "人与狐狸的混合体。"
 POD_kitsune_form_sambuhenge_modifier: "掺部化形态"
 POD_kitsune_form_sambuhenge_modifier_desc: "类人形态。"
 POD_kitsune_form_juko_modifier: "巨狐形形态"
 POD_kitsune_form_juko_modifier_desc: "狼一样大的狐狸。"
 POD_kitsune_form_kyubi_modifier: "狐形形态"
 POD_kitsune_form_kyubi_modifier_desc: "普通狐狸。"
 POD_mokole_form_archid_modifier: "半龙形形态"
 POD_mokole_form_archid_modifier_desc: "战争形态被认为是任何个体魔克拉的“真实形态”。通过龙梦，他们梦到了过去的爬行动物、鸟类和恐龙，这决定了半龙形形态的特征。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_nagah_form_azhi_dahaka_modifier: "半蛇形形态"
 POD_nagah_form_azhi_dahaka_modifier_desc: "各个娜迦的战斗形态不同，但都有一个像眼镜蛇一样的肿胀头罩，许多人在下会给自己留下疤痕，以便在这形态更加引人注目，这形态允许极度张开下巴而不脱臼，并且有鳃（在这种形态下他们完全是两栖的）。娜迦的体重增加，但由于下半身有一条16至20英尺的尾巴，他们的手臂变得像蛇一样，因为他们的手臂上长出了脊椎骨而不是正常的骨头，使他们能更容易地抓取。蛇人的手长出了和任何狼族一样可怕的爪子，他们的鳞片和鱼鳞有一种超自然的弹性。在这种形态下，娜迦所接受的任何伤痕都很明显，通常在半蛇形形态的鳞片上出现图案。在这种形态下，娜迦会产生完全妄悸效应；很少有人类能忍受看着这样一个对蛇的原始恐惧的化身。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_nagah_form_silkaram_modifier: "人蛇形形态"
 POD_nagah_form_silkaram_modifier_desc: "他们的外表几乎与人类无异，但头发和皮肤被小鳞片取代，脸变平，眼睛变得更像蛇，牙齿融合在一起，只有两颗獠牙像眼镜蛇一样缩了回去。在这种形态下，他们会获得一种对凡人甚至亡灵都很危险的毒液。"
 POD_nagah_form_kali_dahaka_modifier: "巨蛇形形态"
 POD_nagah_form_kali_dahaka_modifier_desc: "与巨蛇相似，但有两点不同：它们比普通眼镜蛇大得多，而且长有巨大的毒牙。在原始状态下，它们可以长出一双细长的手臂。这种形态还长有鳃，可以在水下呼吸。"
 POD_nagah_form_vasuki_modifier: "蛇形形态"
 POD_nagah_form_vasuki_modifier_desc: "与普通眼镜蛇、响尾蛇、棉嘴蛇或其他品种形态无异。"
 POD_nuwisha_form_manabozho_modifier: "曼纳博佐形态"
 POD_nuwisha_form_manabozho_modifier_desc: "战争形态，一种可怕的人与郊狼的混合体。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_nuwisha_form_tsitsu_modifier: "人化郊狼形形态"
 POD_nuwisha_form_tsitsu_modifier_desc: "类人形态。"
 POD_nuwisha_form_sendeh_modifier: "巨郊狼形形态"
 POD_nuwisha_form_sendeh_modifier_desc: "类郊狼形态。"
 POD_nuwisha_form_latrani_modifier: "郊狼形形态"
 POD_nuwisha_form_latrani_modifier_desc: "郊狼形态。"
 POD_ratkin_form_crinos_modifier: "半鼠形形态"
 POD_ratkin_form_crinos_modifier_desc: "战争形态，一种可怕的人与鼠的混合体\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_ratkin_form_rodens_modifier: "鼠形形态"
 POD_ratkin_form_rodens_modifier_desc: "大小不一的老鼠。"
 POD_rokea_form_gladius_modifier: "半鲨形形态"
 POD_rokea_form_gladius_modifier_desc: "被称为“坚立之颚”，半鲨形像是一种十英尺长的双足鲨鱼生物。与半狼形相似，坚立之颚结合了鲨鱼的力量和人形的多功能性。这种形态会激发人类的部分妄悸。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_rokea_form_grabrus_modifier: "人鲨形形态"
 POD_rokea_form_grabrus_modifier_desc: "也被称为“圆背”，这种形状通常只为陆上居住的罗基阿所知——对居住在海洋的鲨人没有什么用。失去了所有的体毛，变得比她的人形形态更丑。他或她的肌肉质量增加一倍，背部开始形成背鳍而变宽。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_rokea_form_chasmus_modifier: "巨鲨形形态"
 POD_rokea_form_chasmus_modifier_desc: "罗基阿称之为“战斗之颚”的形态是一种史前噩梦，会引起人类的全面妄悸。罗基阿变成了她的血种形态的巨大版本，比她的鲨鱼形形态又大了一半。罗基阿以这种形态进行水下战斗。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_rokea_form_squamus_modifier: "鲨形形态"
 POD_rokea_form_squamus_modifier_desc: "这种鲨鱼也被称为“会游泳的大白鲨”，与罗基阿品种中的普通鲨鱼没有区别。"
 POD_apis_form_crinos_modifier: "牛头人形态"
 POD_apis_form_crinos_modifier_desc: "一个长着尖牙的巨大牛头人"
 POD_apis_form_aurochs_modifier: "牛形形态"
 POD_apis_form_aurochs_modifier_desc: "动物形态。"
 POD_camazotz_form_crinos_modifier: "半蝙蝠形形态"
 POD_camazotz_form_crinos_modifier_desc: "卡玛佐兹的战争形态，一种可怕的人与蝙蝠的混合体。\n#weak 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。#!"
 POD_camazotz_form_apterous_modifier: "人蝠形形态"
 POD_camazotz_form_apterous_modifier_desc: "外形近似人类，不会飞，但爬行能力特别好。"
 POD_camazotz_form_megachiroptera_modifier: "巨蝙蝠形形态"
 POD_camazotz_form_megachiroptera_modifier_desc: "一只翼展五英尺的巨型蝙蝠。"
 POD_grondr_form_crinos_modifier: "半猪形形态"
 POD_grondr_form_crinos_modifier_desc: "可怕的野猪头人形怪物"
 POD_grondr_form_aperius_modifier: "人猪形形态"
 POD_grondr_form_aperius_modifier_desc: "类人形态。"
 POD_grondr_form_daeodon_modifier: "巨猪形形态"
 POD_grondr_form_daeodon_modifier_desc: "巨大的史前食肉野猪。"
 POD_grondr_form_scrofa_modifier: "猪形形态"
 POD_grondr_form_scrofa_modifier_desc: "野猪形态。"
 POD_shapeshift_form_darkfungus_modifier: "黑暗真菌图腾形态"
 POD_shapeshift_form_glouogh_modifier: "格鲁奥格图腾形态"
 POD_shapeshift_form_greendragon_modifier: "绿龙图腾形态"
 POD_shapeshift_form_hakaken_modifier: "哈卡肯图腾形态"
 POD_shapeshift_form_shiva_modifier: "毁灭神湿婆"
 POD_shapeshift_form_shiva_modifier_desc: "在一阵圣光中，芭丝特变成了一位十二英尺高，六臂挥舞着火焰武器的化猫形豹人。无尽怒火将让周围的一切——无论是敌人还是其他——切割成血淋淋的杂碎，直到大地被堆满尸块。"
 POD_shapeshift_form_kali_modifier: "大黑女迦梨"
 POD_shapeshift_form_kali_modifier_desc: "在一阵圣光中，芭丝特变成了一位十二英尺高，六臂挥舞着火焰武器的化猫形豹人。无尽怒火将让周围的一切——无论是敌人还是其他——切割成血淋淋的杂碎，直到大地被堆满尸块。"
