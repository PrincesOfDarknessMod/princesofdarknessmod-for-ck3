 stewardship_quest_province_modifier_desc: "你的诸灵任务占用了你大量的时间，使你失去了对其他紧迫问题的关注。"
 intrigue_quest_scheme_modifier: "阴影任务"
 intrigue_quest_scheme_modifier_desc: "你感到……被监视。也许只是你诸灵任务中的考验之一？"
 intrigue_quest_owned_scheme_modifier: "阴影任务"
 intrigue_quest_owned_scheme_modifier_desc: "你感到……被监视。也许只是你诸灵任务中的考验之一？"
 intrigue_quest_owned_secrecy_modifier: "阴影任务"
 intrigue_quest_owned_secrecy_modifier_desc: "你感到……被监视。也许只是你诸灵任务中的考验之一？"
 learning_quest_piety_modifier: "学识任务"
 learning_quest_piety_modifier_desc: "这么多谜题！猫头鹰之灵不断质疑你对事业的承诺。"
 learning_quest_stress_modifier: "学识任务"
 learning_quest_stress_modifier_desc: "这么多谜题！猫头鹰之灵不断质疑你对事业的承诺。"
 learning_quest_stress_lifestyle_modifier: "学识任务"
 learning_quest_stress_lifestyle_modifier_desc: "这么多谜题！猫头鹰之灵不断质疑你对事业的承诺。"
 dragon_totem_modifier: "战群图腾：龙"
 dragon_totem_modifier_desc: "巨龙威严凶猛，以毒息焚尽一切抗逆之徒。"
 agni_totem_modifier: "战群图腾：阿耆尼"
 agni_totem_modifier_desc: "阿耆尼是觉醒的龙，力量无双"
 finch_totem_modifier: "战群图腾：雀鸟"
 finch_totem_modifier_desc: "雀鸟即适应，适应即生存。强行改变自然，必将招致灾祸。"
 horseshoe_crab_totem_modifier: "战群图腾：鲎"
 horseshoe_crab_totem_modifier_desc: "蜥蜴王朝兴衰更迭，他却始终繁盛不衰。他将比人类和天启本身更长久。"
 scarab_totem_modifier: "战群图腾：圣甲虫"
 scarab_totem_modifier_desc: "有太阳的侍从守护着你，黑土之地的黑暗终将得以净化。"
 snake_doctor_totem_modifier: "战群图腾：蛇医"
 snake_doctor_totem_modifier_desc: "他为鳞甲密布的友人缝合伤口，也为他人缝上双耳。"
 whiptail_lizard_totem_modifier: "战群图腾：鞭尾蜥"
 whiptail_lizard_totem_modifier_desc: "她赐予女儿们力量，却让男人们心生憎恨。"
 narukami_totem_modifier: "战群图腾：鸣神"
 narukami_totem_modifier_desc: "雷公爷爷尊重力量，但只认可配得上的人。"
 tsukiyomi_totem_modifier: "战群图腾：月读"
 tsukiyomi_totem_modifier_desc: "月之女神将照亮你的道路，但潮汐会随着月相变幻而汹涌。"
 susanowo_totem_modifier: "战群图腾：须佐之男"
 susanowo_totem_modifier_desc: "风暴之神以自身的狂怒回应你的怒火。\n使用#V 风暴#!天气魔法会对你的目标及其所有与你交战的[knights|E]造成1点闪电[POD_aggravated_damage|E]。"
