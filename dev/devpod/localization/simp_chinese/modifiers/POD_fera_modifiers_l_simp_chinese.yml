 whippoorwill_totem_modifier: "战群图腾：三声夜鹰"
 whippoorwill_totem_modifier_desc: "三声夜鹰的啼鸣将是他们听到的最后的声响。"
 kirijama_totem_modifier: "战群图腾：桐山"
 kirijama_totem_modifier_desc: "隐者桐山的存在始终被迷雾所笼罩。"
 bat_totem_modifier: "战群图腾：蝙蝠"
 bat_totem_modifier_desc: "蝙蝠残存的疯癫意识仍在效忠于它那位陨落的主人。"
 relshab_totem_modifier: "战群图腾：雷沙布"
 relshab_totem_modifier_desc: "如同雷沙布一样，你的饥饿亦将永无止境。"
