 fera_pack_rampage_modifier: "化兽族裔"
 fera_pack_rampage_modifier_desc: "该角色[GetPlayer.Custom('PODCoterie')]所属的$glossary_fera$正在首都横冲直撞，令当地凡人人心惶惶。"
 fera_pack_war_modifier: "嗜血的化兽族裔"
 fera_pack_war_modifier_desc: "该角色[GetPlayer.Custom('PODCoterie')]所属的$glossary_fera$已准备好作战。"
 falcon_totem_modifier: "战群图腾：猎鹰"
 falcon_totem_modifier_desc: "猎鹰憎恨懦夫，如果有必要，他会亲自攻击他们。"
 grandfatherthunder_totem_modifier: "战群图腾：雷公"
 grandfatherthunder_totem_modifier_desc: "雷公教导人们要有耐心和谨慎的进行计谋，但他对软弱的统治者毫不留情。"
 stag_totem_modifier: "战群图腾：牡鹿"
 stag_totem_modifier_desc: "牡鹿是大自然的完美化身，对朋友充满爱意和关怀，但对敌人却可怕而无情。"
 fenris_totem_modifier: "战群图腾：大芬里斯"
 fenris_totem_modifier_desc: "大芬里斯总是浑身浴血，并期望他的孩子们也是如此。"
 pegasus_totem_modifier: "战群图腾：天马"
 pegasus_totem_modifier_desc: "天马和她的女儿们保护神圣的仪式不受人类的伤害。"
 cockroach_totem_modifier: "战群图腾：蟑螂"
 cockroach_totem_modifier_desc: "时间在蟑螂一边。最终，他的孩子们将是最后还存活着的人。"
 owl_totem_modifier: "战群图腾：猫头鹰"
 owl_totem_modifier_desc: "猫头鹰的孩子们预见到了许多，但他们只向那些真正倾听的人透露他们的秘密。"
 raven_totem_modifier: "战群图腾：渡鸦"
 raven_totem_modifier_desc: "渡鸦用对食物、知识和财富的无止境的渴望带着他的孩子们前进。"
 rat_totem_modifier: "战群图腾：老鼠"
 rat_totem_modifier_desc: "老鼠有一支军队供他支配。很少有，如果有的话，能与他无数的步兵相比。"
 darkfungus_totem_modifier: "战群图腾：黑暗真菌"
 darkfungus_totem_modifier_desc: "唯一足够强大到在黑螺旋中生存的植物，为它的孩子们赐予了幻象。然而，并不是所有都受到欢迎。\n免除通过[journey|E]研习[GetTrait('demonology').GetName(GetNullCharacter)]的消耗。"
 glouogh_totem_modifier: "战群图腾：格鲁奥格"
 glouogh_totem_modifier_desc: "格鲁奥格是一个不断变化的恐怖球体，只要它出现，就会产生一些最可怕的$glossary_wyrm$生物。"
 greendragon_totem_modifier: "战群图腾：绿龙"
 greendragon_totem_modifier_desc: "绿龙曾经是白嚎的保护者，它和他们一样误入歧途，至今仍在继续保佑它的堕落的孩子们。"
 hakaken_totem_modifier: "战群图腾：哈卡肯"
 hakaken_totem_modifier_desc: "偏执和骄傲是哈卡肯追随者的两大属性。他们通过这些工具传播他们堕落灵君的话语。"
 bonyscrap_totem_modifier: "战群图腾：废骨"
 bonyscrap_totem_modifier_desc: "秃鹫之灵是个令人讨厌的家伙，但很少有人有像他那样拾荒能力。"
 hatii_totem_modifier: "战群图腾：哈迪"
 hatii_totem_modifier_desc: "该强大的象灵的记忆长久不衰，对它的朋友来说，它是无与伦比的可靠盟友。"
 ika_ika_totem_modifier: "战群图腾：伊卡·伊卡"
 ika_ika_totem_modifier_desc: "调皮的猴灵是个有趣的朋友，但他总是喜欢恶作剧，这让性格刚毅的芭丝特不太尊重他。"
 butterfly_totem_modifier: "战群图腾：蝴蝶"
 butterfly_totem_modifier_desc: "千变万化的蝴蝶是平和之心的守护神，是那些对永恒之舞充满好奇的人的守护神。"
 king_cats_totem_modifier: "战群图腾：猫王"
 king_cats_totem_modifier_desc: "聪明的猫王与芭丝特的相像无人能出其右。他是英勇反叛的精神，偏爱那些机智敏捷的人。"
 king_beasts_totem_modifier: "战群图腾：万兽之王"
 king_beasts_totem_modifier_desc: "狮灵是个慷慨的暴君。如果你在他面前卑躬屈膝，他就会赐予你一点他那令人钦佩的力量。"
 mantis_totem_modifier: "战群图腾：螳螂"
 mantis_totem_modifier_desc: "智慧的螳螂在一些民间传说中是世界的创造者，它通过做梦来摆脱麻烦。通过对七大等级的静默的精通，它总能及时为追随者找到解决办法。"
 mistress_catkind_totem_modifier: "战群图腾：猫族之女主"
 mistress_catkind_totem_modifier_desc: "女主是女性本质的化身，她既是点点滴滴的母亲，又是热情的情人、战争女神和神秘行者。"
 whispers_totem_modifier: "战群图腾：低语者"
 whispers_totem_modifier_desc: "如果芭丝特自己不喧闹，那么秘密之灵会引导他们去发现秘密。"
 spirit_quest_pet_modifier: "小宠物"
 spirit_quest_pet_modifier_desc: "谁是乖捣蛋鬼？"
 war_quest_knight_modifier: "战争任务"
 war_quest_knight_modifier_desc: "你的数个最好的勇士被派去进行诸灵的任务。"
 war_quest_prowess_modifier: "勇武任务"
 war_quest_prowess_modifier_desc: "在你的诸灵任务中，你不断受到觊觎者的挑战，这令人疲惫。"
 war_quest_province_modifier: "战争任务"
 war_quest_province_modifier_desc: "作为战争任务的一部分，你的伯爵领不断受到攻击，导致民众伤亡惨重。"
 leadership_quest_vassal_modifier: "领导任务"
 leadership_quest_vassal_modifier_desc: "作为你诸灵任务的一部分，你的领导素质不断受到质疑。"
 leadership_quest_diplomacy_modifier: "领导任务"
 leadership_quest_diplomacy_modifier_desc: "你的诸灵任务对你的情绪造成了负担，使你随意发泄。"
 leadership_quest_opinion_modifier: "领导任务"
 leadership_quest_opinion_modifier_desc: "你的诸灵任务对你的情绪造成了负担，使你随意发泄。"
 stewardship_quest_domain_modifier: "统治任务"
 stewardship_quest_domain_modifier_desc: "你的诸灵任务占用了你大量的时间，使你失去了对其他紧迫问题的关注。"
 stewardship_quest_vassal_modifier: "统治任务"
 stewardship_quest_vassal_modifier_desc: "你的诸灵任务占用了你大量的时间，使你失去了对其他紧迫问题的关注。"
