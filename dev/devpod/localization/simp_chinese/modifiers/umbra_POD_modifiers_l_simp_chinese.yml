 seat_of_burning_waters_modifier: "研习滚水灵座"
 seat_of_burning_waters_modifier_desc: "滚水灵座是微笑亡主的宫殿，也是冥河城狰狞军团的总部。在这里，微笑亡主谋划着与他的亡主同伴们对抗，并为他的冥秩分支的未来制定宏伟计划。"
 seat_of_dust_modifier: "研习尘土灵座"
 seat_of_dust_modifier_desc: "尘土灵座是骸骨亡主的宫殿，也是骸骨军团的总部。虽然大多数灵座的特色是让军团成员重新联系并解决他们的炽情和[Fetters|E]，但尘土灵座的独特之处在于它纯粹用于军团事务，包括军事和民事事务。"
 seat_of_golden_tears_modifier: "研习金泪灵座"
 seat_of_golden_tears_modifier_desc: "金泪灵座是乞丐亡主的宫殿，也是贫民军团的总部。与军团本身一样，金泪灵座也在不断变化，因为来自各行各业的新死灵都会加入其中。"
 seat_of_shadows_modifier: "研习阴影灵座"
 seat_of_shadows_modifier_desc: "阴影灵座是冥河城钢铁军团军团长灰烬亡女的宫殿。在阴影灵座，灰烬亡女和钢铁军团通过建造和加固冥河城及其死城的防御来监督他们在冥秩中所扮演的角色。"
 seat_of_silence_modifier: "研习寂静灵座"
 seat_of_silence_modifier_desc: "寂静灵座是肃静亡主的宫殿，也是寂静军团的总部。这座建筑简洁有序，与许多居民内心的躁动形成鲜明对比。"
 seat_of_succor_modifier: "研习救赎灵座"
 seat_of_succor_modifier_desc: "救赎灵座是大笑亡女的宫殿，也是忏悔军团的总部。它是唯一一座被其他军团征服过的宫殿，但许多人认为它的弱点也是它的优点。它既是一个防御工事，也是一个类似诊所的地方，军团成员在这里接受他们的疯狂。"
 seat_of_thorns_modifier: "研习荆棘灵座"
 seat_of_thorns_modifier_desc: "荆棘灵座是翡翠亡主的宫殿，也是翡翠军团的总部。建筑本身闪耀着成千上万翠绿色魂火水晶的光芒，使其在冥河城和[shadowlands|E]沉闷的灰黑色中显得格外醒目。每块水晶都充满了足够的能量，可以将一个死灵直接送入畏途。在美景的周围，缠绕着半英里厚的有生命的荆棘，它们保护着宫殿不受入侵者的侵扰，并在发生围攻时为建筑披上厚厚的盔甲。"
 seat_of_fate_modifier: "研习命运灵座"
 seat_of_fate_modifier_desc: "命运灵座是一座伊比利亚风格的庞大宅邸，但它仍能与所处的岛屿融为一体。最引人注目的是生长在建筑众多庭院中的树木；这些树木是[dark_kingdom_of_iron|E]中唯一生长的木材，与[river_of_death|E]沿岸的芦苇一起，成为[underworld|E]中为数不多的纸张来源之一"
 jade_palace_modifier: "访问玉宫"
 jade_palace_modifier_desc: "玉宫是黄泉帝国的政府中心，位于[tempest|E]的永恒死涡的中心。"
 memory_tower_modifier: "访问记忆之塔"
 memory_tower_modifier_desc: "记忆之塔是散布在[labyrinth|E]中的巨大而坚不可摧的物体。它们被巨孽们用来隐藏信息，使其不被蜂群心智发现。只要蜂群心智中没有人知道某件事情，那么整个蜂群心智都不会意识到这一事实，因此巨孽可以确保某些东西的安全。"
 gods_arrow_modifier: "追踪上帝之箭"
 gods_arrow_modifier_desc: "许多记忆之塔中藏有阴谋、计划等，还有一些记忆之塔中藏有巨孽认为太危险或太有用的遗器，不允许他人拥有，甚至不允许他人知道它的存在。大祖母的一座记忆之塔中藏有上帝之箭。巨孽不知道上帝之箭的确切性质，但他们知道大祖母不希望任何人接近它。\n#weak 你现在将能触发上帝之箭作为灵界发现。#!"
 abel_modifier: "亚伯"
 abel_modifier_desc: "亚伯是亚当和夏娃的第二个儿子，他被长兄该隐杀死，成为第一起谋杀的受害者。\n#weak 作为[character_interaction|E]，允许你杀死目标角色。\n最大约束死灵数量：#P +7777#!#!"