l_simp_chinese:
 difference_engine_modifier:0 "差分机"
 difference_engine_modifier_desc:0 "一个自动化数学机器，设计用于表达多项式函数。"
 aeolipile_modifier:0 "汽转球"
 aeolipile_modifier_desc:0 "一个简单的、无叶片的径向蒸汽轮机，在中央水容器被加热时旋转。"
 antikythera_mechanism_modifier:0 "安提基特拉机械"
 antikythera_mechanism_modifier_desc:0 "古希腊时期为了计算天体在天空中的位置而制造的青铜机器。"
 archimedes_death_ray_modifier:0 "阿基米德死亡光线"
 archimedes_death_ray_modifier_desc:0 "一大堆的抛物面镜和被打磨得闪闪发光的盾牌。"
 wodden_hawk_modifier:0 "木鸢"
 wodden_hawk_modifier_desc:0 "由墨子制作的能够在空中飞行的木风筝。"
 wodden_ox_modifier:0 "木牛流马"
 wodden_ox_modifier_desc:0 "诸葛亮创造的有双把手的单轮车。"
 lingjen_modifier:0 "伶人"
 lingjen_modifier_desc:0 "偃师制作的可以像活人一样能歌善舞的木偶。"
 south_pointing_chariot_modifier:0 "指南车"
 south_pointing_chariot_modifier_desc:0 "一种用差速器来辨认方向的仪器，车上有一小人，其手指的方向即为北方。"
 seismoscope_modifier:0 "候风地动仪"
 seismoscope_modifier_desc:0 "东汉张衡发明的用来粗略侦测地震方位的仪器。"
 bhaskaras_wheel_modifier:0 "魔轮"
 bhaskaras_wheel_modifier_desc:0 "印度数学家婆什迦罗第二创造的一种假想的永动机。"
 flexible_glass_modifier:0 "柔性玻璃碗"
