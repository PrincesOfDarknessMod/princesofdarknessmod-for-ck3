 POD_gargoyle_caste_chatterer_modifier: "饶舌家种姓石像鬼"
 POD_gargoyle_caste_chatterer_modifier_desc: "通过以末卡维为材料的奇术实验制造。他们不断的噪音可以使许多人发疯。"
 POD_gargoyle_caste_bingmayong_modifier: "兵马俑种姓石像鬼"
 POD_gargoyle_caste_bingmayong_modifier_desc: "通过以[GetTrait('kueijin').GetName( GetNullCharacter )]为材料的奇术实验制造，用东方的异国材料制成的构装体。"
 POD_gargoyle_caste_bone_modifier: "石像鬼响尾蛇种姓"
