 POD_gargoyle_caste_shade_modifier: "阴影种姓石像鬼"
 POD_gargoyle_caste_shade_modifier_desc: "通过以勒森魃为材料的奇术实验制造。"
 POD_gargoyle_caste_scout_modifier: "斥候种姓石像鬼"
 POD_gargoyle_caste_scout_modifier_desc: "通过奇术实验制造，善于间谍行动。"
 POD_gargoyle_caste_warrior_modifier: "战士种姓石像鬼"
 POD_gargoyle_caste_warrior_modifier_desc: "通过奇术实验制造，善于战斗。"
 POD_gargoyle_caste_sentinel_modifier: "哨兵种姓石像鬼"
 POD_gargoyle_caste_sentinel_modifier_desc: "通过奇术实验制造，善于守卫。"
 POD_gargoyle_caste_blood_modifier: "血卫种姓石像鬼"
