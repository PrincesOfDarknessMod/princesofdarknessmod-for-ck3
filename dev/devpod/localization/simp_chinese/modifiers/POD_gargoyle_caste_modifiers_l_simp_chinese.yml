 POD_gargoyle_caste_kintsugi_modifier: "石像鬼金缮种姓"
 POD_gargoyle_caste_kintsugi_modifier_desc: "金缮种姓最初通过华族与武士的炼金融合诞生，形如破碎后修复的精美瓷器。"
 POD_gargoyle_caste_rogata_modifier: "石像鬼罗伽塔种姓"
 POD_gargoyle_caste_rogata_modifier_desc: "罗伽塔种姓最初通过武士与赤膊、物见或鬼众的血术融合诞生，形如铸铁雕像。"
 POD_gargoyle_caste_totai_modifier: "石像鬼陶胎种姓"
 POD_gargoyle_caste_totai_modifier_desc: "陶胎种姓最初通过武士与赤膊、物见或鬼众的血肉塑形仪式诞生，因其形似陶瓷人偶而得名。"