 POD_gargoyle_caste_onyx_cat_modifier: "石像鬼黑猫种姓"
 POD_gargoyle_caste_onyx_cat_modifier_desc: "由芭丝特的奇术实验创造。"
 POD_gargoyle_caste_golden_manticore_modifier: "石像鬼金蝎狮种姓"
 POD_gargoyle_caste_golden_manticore_modifier_desc: "由辛巴部落芭丝特的奇术实验创造。"
 POD_gargoyle_caste_serpent_modifier: "石像鬼沙蛇种姓"
