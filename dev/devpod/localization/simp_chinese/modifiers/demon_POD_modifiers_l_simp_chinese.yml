 namaru_dynasty_modifier: "纳玛鲁天界遗墟"
 namaru_dynasty_modifier_desc: "晨星天殿昔日的辉煌已不复存在，如今仅余残垣断壁。\n#help 解锁先驱之秘义。#!"
 asharu_dynasty_modifier: "阿撒乌天界遗墟"
 asharu_dynasty_modifier_desc: "苍穹天殿昔日的荣光已消逝殆尽，仅剩破碎遗迹。\n#help 解锁生命赐予者之秘义。#!"
 annunaki_dynasty_modifier: "阿努纳奇天界遗墟"
 annunaki_dynasty_modifier_desc: "火与石天殿已倾颓，唯余断壁残垣诉说往昔。\n#help 创世之秘义。#!"
 neberu_dynasty_modifier: "尼比鲁天界遗墟"
 neberu_dynasty_modifier_desc: "天球圣殿的伟业已成云烟，仅存废墟见证历史。\n#help 先知之秘义。#!"
 lammasu_dynasty_modifier: "拉玛苏天界遗墟"
 lammasu_dynasty_modifier_desc: "深渊天殿的威仪已逝，如今只余凋零遗迹。\n#help 解锁美之秘义。#!"
 rabisu_dynasty_modifier: "拉比苏天界遗墟"
 rabisu_dynasty_modifier_desc: "狂野天殿的盛况不再，唯有残迹尚存。\n#help 生者之秘义。#!"
 halaku_dynasty_modifier: "哈拉库天界遗墟"
 halaku_dynasty_modifier_desc: "追猎天殿的辉煌已陨，徒留破碎圣所。\n#help 灵魄之秘义。#!"
 ritual_of_sundered_soul_tt: "#I 此[modifier|E]可通过决议升级。#!"
 ritual_of_sundered_soul_tt2: "#I 死亡时将降级此修正并复活。#X;bold 若携带[GetModifier('ritual_of_sundered_soul_unstable_modifier').GetNameWithTooltip]死亡，将永堕深渊。#!#!"
 ritual_of_sundered_soul_unstable_modifier: "不稳定肃灵仪式"
 ritual_of_sundered_soul_unstable_modifier_desc: "肃灵仪式是路西法赐予堕落使徒的新发明，使其得以干涉凡世。但当前的不稳定性使其成为极度痛苦的体验。\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
 ritual_of_sundered_soul_semi_stable_modifier: "波动肃灵仪式"
 ritual_of_sundered_soul_semi_stable_modifier_desc: "你改良了路西法设计的仪式方案，得以在宿主身上维持更久。\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
 ritual_of_sundered_soul_modifier: "肃灵仪式"
 ritual_of_sundered_soul_modifier_desc: "仪式已稳固到能让你在地球显现更多力量，正日益成为强大助力。\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
 ritual_of_sundered_soul_stabilized_modifier: "稳定肃灵仪式"
 ritual_of_sundered_soul_stabilized_modifier_desc: "你完善了路西法赐予堕落使徒的仪式构想，如今真容可昭示天下。\n\n$ritual_of_sundered_soul_tt2$\n\n"
 ritual_of_sundered_soul_exalted_modifier: "至高肃灵仪式"
 ritual_of_sundered_soul_exalted_modifier_desc: "不再依赖凡人宿主，你已将灵魂锚定于自造的永恒容器。世界在你留下的印记中震颤。\n\n$ritual_of_sundered_soul_tt2$\n\n"
