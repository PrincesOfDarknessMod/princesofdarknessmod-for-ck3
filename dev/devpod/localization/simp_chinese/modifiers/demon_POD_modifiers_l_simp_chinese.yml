 POD_shapeshift_form_apocalyptic_angelic_modifier: "天使天启形态"
 POD_shapeshift_form_apocalyptic_damned_modifier: "受诅天启形态"
 arsenal_of_the_beast_claws_modifier: "利爪"
 arsenal_of_the_beast_claws_modifier_desc: "该角色的指甲像猛禽的爪子一样弯曲或猫的可伸缩爪子一样延伸。"
 arsenal_of_the_beast_fangs_modifier: "尖牙"
 arsenal_of_the_beast_fangs_modifier_desc: "该角色的牙齿长得像狼或其他大型掠食者的牙齿一样锋利，又或者他们有猛禽的喙。"
 arsenal_of_the_beast_gaping_maw_modifier: "裂颌"
 arsenal_of_the_beast_gaping_maw_modifier_desc: "该角色的下巴可松开，或者干脆膨胀得不可能再大了，呈现出一排又一排闪闪发光的獠牙。"
 arsenal_of_the_beast_horns_modifier: "双角"
 arsenal_of_the_beast_horns_modifier_desc: "该角色长出了典型的山羊角，或像雄鹿一样的鹿角，或从头骨中突出的非自然的骨刺，或者其他一些能够进行突刺攻击的赘生物。"
 arsenal_of_the_beast_lashing_tail_modifier: "鞭尾"
 arsenal_of_the_beast_lashing_tail_modifier_desc: "该角色有一条强有力的肌肉尾巴。"
 arsenal_of_the_beast_poison_modifier: "毒液"
 arsenal_of_the_beast_poison_modifier_desc: "该角色的身体能产生一种致命的毒液。"
 arsenal_of_the_beast_venom_spit_modifier: "毒喷"
 arsenal_of_the_beast_venom_spit_modifier_desc: "该角色的喉咙里有一个毒腺，可以让他们能喷出毒液。"
 arsenal_of_the_beast_spines_modifier: "刺"
 arsenal_of_the_beast_spines_modifier_desc: "骨刺或羽毛从人物的皮肤中突出。"
 arsenal_of_the_beast_tentacles_modifier: "触手"
 arsenal_of_the_beast_tentacles_modifier_desc: "该角色有一条长长的触手或卷缠尾。"
 arsenal_of_the_beast_wings_modifier: "翅膀"
 arsenal_of_the_beast_wings_modifier_desc: "该角色从她的背上长出一双大翅膀，在完全伸展的情况下，能长达角色身高的三倍。"
 implacable_vengeance_perk_modifier: "无止复仇"
 unknown_eminence_modifier: "无名显赫"
 unknown_eminence_modifier_desc: "你已经被凡人、上帝和恶魔遗忘。你的天之名不再能激发人们的恐惧和尊重。"
 known_eminence_modifier: "闻名显赫"
 known_eminence_modifier_desc: "你的天之名对许多恶魔来说听起来很熟悉，尽管他们不记得你最初的目的或成就。"
 respected_eminence_modifier: "受敬显赫"
 respected_eminence_modifier_desc: "大多数恶魔可能听说过你的名字，许多恶魔都模糊的对你在逆神前的工作有一个大致的概念。"
 honored_eminence_modifier: "荣耀显赫"
 honored_eminence_modifier_desc: "在逆神之前和逆神期间，你都拥有指令其他天使的权位。尘世的某些特定方面由你来设计或维护，包括一些综合概念、生命或物体。"
 powerful_eminence_modifier: "强力显赫"
 powerful_eminence_modifier_desc: "曾经，你指导你的同胞们创造了宇宙的某组成部分。也许这项工作的本身就是你设计的，你因你的聪明才智和远见而闻名于天上万象。"
 exalted_eminence_modifier: "擢颂显赫"
 exalted_eminence_modifier_desc: "创世之初，有言而生，而你是祂宣读的下一音节之一。你指挥着一整个尘世分区，并作为路西法在逆神中选择的军官之一站在他身边。所有的恶魔都知道你，知道你的天之名，无论他们是否记得原因。"
 longevity_modifier: "额外寿命"
 extinguish_life_modifier: "熄灭众生"
 the_mark_of_the_celestials_perk_modifier: "天之印记"
