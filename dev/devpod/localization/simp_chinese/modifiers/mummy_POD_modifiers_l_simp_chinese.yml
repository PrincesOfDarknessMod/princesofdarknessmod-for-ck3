 lifeblood_addiction_modifier_desc: "吸血鬼渴望流淌在木乃伊血管中的强大精血，但无人性的吸血鬼鄙视喝木乃伊的血会在他们上激发的“道德改善”。一位在心理上对木乃伊血液上瘾的吸血鬼会迅速堕落成一只怪物。"
 goto_the_disaster_modifier: "前向灾害"
 cloud_of_smoke_modifier_desc: "打包好的粉末，向火中投掷能发出浓厚的窒息黑烟。"
 drink_of_seven_days_rest_modifier_desc: "这种药水可以解除饮用者的任何疲劳，使他从轻微的损伤中得到治疗。"
