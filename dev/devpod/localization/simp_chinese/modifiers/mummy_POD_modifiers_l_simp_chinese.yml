 eyes_of_the_ka_modifier_desc: "一种药膏，当涂在眼睛和耳朵上时，就可以目睹[UmbraGlossary('shadowlands')]。\n#weak 允许在灵游时进入[UmbraGlossaryLocalized('shadowlands','冥界')]。#!"
