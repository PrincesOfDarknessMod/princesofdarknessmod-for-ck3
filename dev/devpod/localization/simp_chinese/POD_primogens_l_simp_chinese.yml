 touchstones_court_position:0 "心眷"
 touchstones_court_position_desc:1 "心眷是吸血鬼与凡人世界的纽带，代表着一种他们珍视自己的心态。心眷必须是一个活着的人类。这个心眷可以是一位幸存的伴侣或家庭成员，与吸血鬼在早期亡生之前曾杀害过的某人有关，甚至只是他们经常遇到的某个人。\n由于与凡人世界的脱节，有些血族甚至可能选择一个不知道他们存在的心眷，而是选择潜伏并观察那个人，以保持他们与人性的联系。"
 alastor_court_position:0 "阿拉斯托"
 alastor_court_position_desc:0 "阿拉斯托是秘盟的一名血族派员，负责追捕咒逐：这些危险的吸血鬼已被列入秘盟的红名单，成为整个党派的消灭目标。"
 alastor_court_employer_custom_effect_description:0 "允许派遣阿拉斯托去猎杀咒逐来获得赏金。"
