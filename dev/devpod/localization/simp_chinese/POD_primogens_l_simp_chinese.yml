 underworld_ambassador_court_position:0 "冥界大使"
 underworld_ambassador_court_position_desc:0 "[underworld|E]大使为当地统治者服务，作为她与当地[underworld|E]的桥梁。"
 underworld_ambassador_employer_custom_effect_description:0 "宫廷内的所有人：\n每月灵界探索进度：[grace_i]#P +5%#!到[grace_i]#P +25%#!（基于[aptitude|E]）"
 umbra_ambassador_court_position:0 "影界大使"
 umbra_ambassador_court_position_desc:0 "影界大使为当地统治者服务，作为她与当地影界的桥梁。"
 umbra_ambassador_employer_custom_effect_description:0 "宫廷内的所有人：\n每月灵界探索进度：[grace_i]#P +5%#!到[grace_i]#P +25%#!（基于[aptitude|E]）"
 trod_wayfarer_court_position:0 "仙路旅人"
 trod_wayfarer_court_position_desc:1 "仙路是妖精与[dreaming|E]与[arcadia|E]的最近的联系点。它们也是力量。那些控制着仙路的人对妖精社会拥有巨大的控制力。"
 trod_wayfarer_employer_custom_effect_description:0 "宫廷内的所有人：\n每月灵界探索进度：[grace_i]#P +5%#!到[grace_i]#P +25%#!（基于[aptitude|E]）"
