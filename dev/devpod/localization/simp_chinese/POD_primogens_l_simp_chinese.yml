 gargoyle_primogen_court_position:0 "石像鬼参议"
 gargoyle_primogen_court_position_desc:1 "当你需要实施突然的暴力袭击时，石像鬼就是你需要的人。\n\n#help 有关[aptitude|E]需求，参见[gargoyle_primogen|E]。#!"
 oathsworn_mount_court_position:0 "约誓坐骑"
 oathsworn_mount_court_position_desc:0 "向妖精领主宣誓的[GetTrait('pooka').GetName( GetPlayer )]（有大型动物亲缘）或[GetTraitGroup('shapeshifter').GetName()][courtier|E]可以作为该君主的智能坐骑。"
 oathsworn_mount_employer_custom_effect_description:0 "根据[aptitude|e]提升旅行速度和行军速度。"
 strategoi_court_position:0 "军区将军"
 strategoi_court_position_desc:0 "军区将军们有效地管理着督政会日常事务的运作。每位负责督政会统治区的不同部分。从早到晚，军区将军们除了满足自己的需求和尊严之外，还要监督本地区的梵卓商业和政治事务。"
 lictor_court_position:0 "刀斧手"
 lictor_court_position_desc:0 "刀斧手是督政会的疑难解决者，这些梵卓被派去处理威胁氏族的问题。这种广泛的使命也导致他们需要广泛的技能，但大多数 刀斧手最终都成为了前线战士。他们的技能程度足以胜任，但并不重要到足以让人在意他们是否会因公殉职。"
 tribunes_court_position:0 "护民官"
 tribunes_court_position_desc:0 "督政会在世界各地维持着一个松散的人脉网和“外勤特工”。这些血族既被称为护民官，也被称为特工，他们在世界各地充当着督政的耳目。"
 POD_spread_legitimacy:0 "Spread Legitimacy"
 POD_spread_legitimacy_desc:0 "This character is tasked with representing their [liege|E] for a specific area, addressing a specific concern or being the spokesperson for a part of the realm."
 POD_tribute_collecting:0 "Collecting Tribute"
 POD_tribute_collecting_desc:0 "This character is tasked with making sure that everyone in the realm pay proper respect and tribute to the ruler, be it by charm, force or simply good administrative sense."
 POD_war_preparations:0 "War Preparations"
 POD_war_preparations_desc:0 "This character is tasked with making sure that everyone in the realm is ready for war at a moment's notice, be it by charm, force or simply good administrative sense."
 POD_vassal_handler:0 "Delegating Power"
 POD_vassal_handler_desc:0 "This character is tasked with representing their [liege|E] in faraway domains, making sure that even the frontier regions still feel connected to the center."
 POD_home_seneschal:0 "Consolidate Domain"
 POD_home_seneschal_desc:0 "This character is tasked with making sure that everything runs smoothly in the center of the realm while their liege might be focused on more global matters."
 POD_home_builder:0 "Improve Domain"
 POD_home_builder_desc:0 "This character is tasked with making sure that the influence of their liege is felt appropriately even while they are away."
 POD_home_defender:0 "Defend Domain"
 POD_home_defender_desc:0 "This character is tasked with defending their liege's domain no matter the cost."
 POD_stress_relief:0 "Master of Entertainment"
 POD_stress_relief_desc:0 "This character is tasked with making sure that the activities provided to the court and its ruler are always well prepared."
 POD_spread_prestige:0 "Spread Epic Tales"
 POD_spread_prestige_desc:0 "This character is tasked with spreading impressive stories about their liege. Some are even true."
 POD_spread_piety:0 "Spread Pious Tales"
 POD_spread_piety_desc:0 "This character is tasked with spreading impressive pious feats done by their liege. Some are even true."
 POD_help_schemes:0 "Help Shady Dealings"
 POD_help_schemes_desc:0 "This character offers some unofficial help to your more unsavory dealings."
 POD_organize_champions:0 "Organize Champions"
 POD_organize_champions_desc:0 "This character help recruit and manage their liege honor guard."
 POD_organize_retinue:0 "Organize Retinue"
 POD_organize_retinue_desc:0 "This character help recruit and manage their liege elite troops."
 court_position_lifestyle_traveler_trait:0 "[GetTrait('lifestyle_traveler').GetName( ROOT.Char )]"
 imperial_envoy_court_position:0 "Imperial Envoy"
 imperial_envoy_court_position_desc:1 "The $imperial_envoy_court_position$ is representing their liege in the far flung frontiers of their realm reminding them that they have to pay tribute even if they are far away."
 imperial_chancellor_court_position:0 "Imperial Chancellor"
 imperial_chancellor_court_position_desc:1 "The $imperial_chancellor_court_position$ is making sure their liege's voice is correctly heard. Even angry scoldings can be given a veneer of legitimacy if need be."
 imperial_minister_court_position:0 "Imperial Minister"
 imperial_minister_court_position_desc:1 "The $imperial_minister_court_position$ is helping running the day to day (or night to night) dealings in the realm. As the influence of their liege grows, their task becomes more and more critical."