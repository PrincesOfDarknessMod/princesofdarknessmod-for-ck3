 court_position_sorcerer_trait:0 "[GetTrait('sorcerer').GetName( ROOT.Char )]"
 praetor_court_position:0 "司法官"
 praetor_court_position_desc:0 "司法官，或项目领导者，是用来描述那些被赋予权力管理同僚的著名辅政官的术语。这个职位的任期通常与任务期限相同，但有些人仍以这个头衔为荣。"
 dogcatcher_court_position:0 "捕犬者"
 dogcatcher_court_position_desc:0 "捕犬者是一个非正式的称号，指的是那些习惯于对付狼人，对狼人的能力、习性和社会的了解远远超过其他吸血鬼的辅政官。"
 doppelganger_court_position:0 "二重身"
 doppelganger_court_position_desc:0 "二重身是一种非正式的称谓，指的是为了完成特定任务而采用深度卧底身份的辅政官。"
 josian_court_position:0 "上帝之火"
 josian_court_position_desc:0 "上帝之火是猎杀崇魔者的辅政官。他们还致力于铲除火焚末日邪教，同时秘密调查已发现的挪得学家知识，以寻找火焚末日可能是真正危险的证据。"
 quaesitor_court_position:0 "判官"
 quaesitor_court_position_desc:0 "判官是辅政官的一个分支，他们几乎都是睿魔尔吸血鬼。他们负责满足秘盟在术法方面的所有需求，无论是打击魔宴的库都术师、打击法师，还是猎杀叛逆睿魔尔。"
 court_position_forge_affinity_perk:0 "[GetPerk( 'forge_affinity_perk' ).GetName( ROOT.Char )]"
 artificer_journeymen_court_position:0 "魂铸匠"
 artificer_journeymen_court_position_desc:1 "魂铸匠是指通过了魂铸祭礼并拥有自己锻炉的手艺人。他们是手艺人的主力军，有权带自己的学徒。"
