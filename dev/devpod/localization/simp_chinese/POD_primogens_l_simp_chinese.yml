 brujah_primogen_court_position:0 "布鲁赫参议"
 brujah_primogen_court_position_desc:1 "按照传统，$brujah_primogen_court_position$负责一个地区的战略战争，尽管他们有时也会涉足学术研究，忠实于他们战士学者的称号。\n\n#help 有关[aptitude|E]需求，参见[brujah_primogen|E]。#!"
 cappadocian_primogen_court_position:0 "卡帕多西亚参议"
 cappadocian_primogen_court_position_desc:1 "很少有人像卡帕多西亚那样对不死族的状况了解得这么多。如果他们愿意谈的话，可以从他们那里学到很多东西。\n\n#help 有关[aptitude|E]需求，参见[cappadocian_primogen|E]。#!"
 lasombra_primogen_court_position:0 "勒森魃参议"
 lasombra_primogen_court_position_desc:1 "暗影大师是你身边的有用的盟友，但如果与之交恶，则是更致命的敌人。\n\n#help 有关[aptitude|E]需求，参见[lasombra_primogen|E]。#!"
 toreador_primogen_court_position:0 "妥芮朵参议"
 toreador_primogen_court_position_desc:1 "每个有自尊的宫廷都有一个有才华的妥芮朵来处理其聚会。不过，“才华”的定义有时可能会引起争议。\n\n#help 有关[aptitude|E]需求，参见[toreador_primogen|E]。#!"
 tzimisce_primogen_court_position:0 "棘秘魑参议"
 tzimisce_primogen_court_position_desc:1 "当一名客人不再受欢迎，但你仍然需要其回答几个问题时……你知道该找谁。\n\n#help 有关[aptitude|E]需求，参见[tzimisce_primogen|E]。#!"
 ventrue_primogen_court_position:0 "梵卓参议"
 ventrue_primogen_court_position_desc:1 "所谓的黑夜统治者期望有大量的权力和责任赋予他们，即使他们并不配拥有这些权力。\n\n#help 有关[aptitude|E]需求，参见[ventrue_primogen|E]。#!"
 assamite_primogen_court_position:0 "哈基姆圣裔参议"
 assamite_primogen_court_position_desc:1 "哈基姆的子嗣们很尽责，是为了共同事业而遵守纪律的典范。大部分时间如此。\n\n#help 有关[aptitude|E]需求，参见[assamite_primogen|E]。#!"
 gangrel_primogen_court_position:0 "冈格罗参议"
 gangrel_primogen_court_position_desc:1 "冈格罗从不远离他们的群落，随时准备为他们提供帮助或阻挠。\n\n#help 有关[aptitude|E]需求，参见[gangrel_primogen|E]。#!"
 malkavian_primogen_court_position:0 "末卡维参议"
 malkavian_primogen_court_position_desc:1 "预言家并不能控制预兆，但也许最好还是让他们站在你这边。\n\n#help 有关[aptitude|E]需求，参见[malkavian_primogen|E]。#!"
 nosferatu_primogen_court_position:0 "诺斯费拉图参议"
 nosferatu_primogen_court_position_desc:1 "让诺斯费拉图帮你的忙总是一个好主意。困难在于真正确保他们是站在你这边的……\n\n#help 有关[aptitude|E]需求，参见[nosferatu_primogen|E]。#!"
 ravnos_primogen_court_position:0 "雷伏诺参议"
 ravnos_primogen_court_position_desc:1 "分裂和不和的家庭仍然是一个家庭。\n\n#help 有关[aptitude|E]需求，参见[ravnos_primogen|E]。#!"
 setite_primogen_court_position:0 "赛特之子参议"
 setite_primogen_court_position_desc:1 "信仰之氏族可以在精神上引导你，但也许不能达到你所希望的结局。\n\n#help 有关[aptitude|E]需求，参见[setite_primogen|E]。#!"
 tremere_primogen_court_position:0 "睿魔尔参议"
 tremere_primogen_court_position_desc:1 "篡位者带来了大量的礼物，也带来了更多的诅咒。\n\n#help 有关[aptitude|E]需求，参见[tremere_primogen|E]。#!"
 salubri_primogen_court_position:0 "萨洛比参议"
 salubri_primogen_court_position_desc:1 "牧人者正在死去，但他们的职责依然存在。\n\n#help 有关[aptitude|E]需求，参见[salubri_primogen|E]。#!"
 aphrodisiac_celebrant_court_position:0 "美神节司仪"
 aphrodisiac_celebrant_court_position_desc:1 "一个被激烈竞争的社会政治职位，美神节司仪有主持美神节的荣誉，在那天，罪人用非常活跃和堕落的庆典来庆祝春天的到来。"
 lord_of_misrule_court_position:0 "狂宴之王"
 lord_of_misrule_court_position_desc:1 "在农神节期间当选的狂宴之王拥有完全的豁免权，并利用它来嘲笑和贬低该地区所有既定的该隐之子政权。"
 court_position_yin_imbalanced_trait:0 "[GetTrait('yin_imbalanced').GetName( ROOT.Char )]"
 court_position_yang_imbalanced_trait:0 "[GetTrait('yang_imbalanced').GetName( ROOT.Char )]"
 hidden_minister_of_jade_court_position:0 "玉部尚书"
 hidden_minister_of_jade_court_position_desc:0 "玉部尚书为皇朝收集和分配资金，无论是传统的凡人货币还是玉石。"
 hidden_minister_of_rites_court_position:0 "礼部尚书"
 hidden_minister_of_rites_court_position_desc:0 "礼部尚书负责监督广泛的活动，包括确保当地的暗战公正和公平执行。该职位还负责保障该地区的风水以及龙穴和脉络的整体活力。"
 hidden_minister_of_shen_court_position:0 "神部尚书"
 hidden_minister_of_shen_court_position_desc:0 "神部尚书是一个具有双重目的的外交职位。这个职位的公开目的是维持与本地鬼神的关系。然而，这个职位的私人目的是向至尊老祖提供敌对鬼神的可利用弱点。"
 hidden_minister_of_war_court_position:0 "兵部尚书"
 hidden_minister_of_war_court_position_desc:0 "当所有其他方法都失败，公开冲突不可避免时，兵部尚书往往是指挥地区万鬼部队打击敌人的将军。"
 hidden_minister_of_the_garden_court_position:0 "苑部尚书"
 hidden_minister_of_the_garden_court_position_desc:0 "苑部尚书负责处理地区的凡人事务，保障“民众的适当和优良的福祉”。"
 hidden_minister_of_hushed_lanterns_court_position:0 "宵部尚书"
 hidden_minister_of_hushed_lanterns_court_position_desc:0 "宵部尚书是麻烦处理者，处理“令人不快的问题”和至尊老祖或尚书们不想直接处理的尴尬情况。"
 minister_of_jade_court_position:0 "玉部司"
 minister_of_jade_court_position_desc:0 "玉部司与地方财政打交道，负责收取地区税收和要交给她上头的玉部尚书的贡品。"
 minister_of_rites_court_position:0 "礼部司"
 minister_of_rites_court_position_desc:0 "礼部司监督当地的暗战，如果没有郡城老祖来处理这些职责，他将帮助决定冲突的胜利者。"
 minister_of_shen_court_position:0 "神部司"
 minister_of_shen_court_position_desc:0 "神部司每每是神部尚书在与鬼神打交道时的大使，尽管至尊皇朝正式将他视为该地区神部尚书的助手。"
 minister_of_war_court_position:0 "兵部司"
 minister_of_war_court_position_desc:0 "如果兵部尚书是将军，那么兵部司则是他的助手。兵部司与实际的战斗没有什么关系，相反，他是尚书的眼睛、耳朵和喉舌，尚书通过他来发布命令，并通过他来获得信息。"
 minister_of_the_garden_court_position:0 "苑部司"
 minister_of_the_garden_court_position_desc:0 "苑部司代表为尚书监督当地的凡人问题，直到尚书认为情况严重到需要他亲自关注。"
 yin_ambassador_court_position:0 "阴使"
 yin_ambassador_court_position_desc:0 "阴使为当地老祖服务，作为她与当地[yin_world|E]及其可怕的诸界域的桥梁。"
 yang_ambassador_court_position:0 "阳使"
 yang_ambassador_court_position_desc:0 "阳使是阴使的类似物，提供了通往充满活力和生机的[yang_world|E]的桥梁。"
 first_oni_court_position:0 "鬼首"
 first_oni_court_position_desc:0 "鬼首类似于战将，负责主管地区安全，保护其不受恶鬼和幽冥的影响，通常会领导针对敌人的制裁战役。"
 infant_devil_civilizer_court_position:0 "幼鬼太傅"
 infant_devil_civilizer_court_position_desc:0 "父母的温和劝说有其时间和地点，但在驯服野生魑魅时却没有这样的时间。幼鬼太傅是各地方幼鬼点化社团的监督者，他们致力于开化野生魑魅。"
 master_rite_court_position:0 "仪式掌控者"
 master_rite_court_position_desc:1 "$master_rite_court_position$是负责圣地的精神健康。所有要举办的仪式必须首先获得他们的批准。"
 gatekeeper_court_position:0 "守门人"
 gatekeeper_court_position_desc:1 "$gatekeeper_court_position$很可能是新来者遇到的第一个人。守门人负责收集来访者的贡品和信息，他们往往相当忙碌，因为维护月桥也是他们的责任。"
 wyrm_foe_court_position:0 "妖蛆之敌"
 wyrm_foe_court_position_desc:1 "$wyrm_foe_court_position$是族群最凶猛的战士，不一定是最熟练的，但肯定是最热衷的。在对妖蛆的爪牙采取进攻行动时，他们作为族群领袖的副指挥。"
 talesinger_court_position:0 "唱书人"
 talesinger_court_position_desc:1 "$talesinger_court_position$负责维护圣地的声誉，创作和表演圣地英雄们的伟大事迹的故事或歌曲。他们还将狼族的历史传给年轻人。"
 master_challenges_court_position:0 "决斗掌控者"
 master_challenges_court_position_desc:1 "$master_challenges_court_position$在圣地发生的决斗中担任裁判。其等是令人生畏的人物，他们也被要求在和平时期维持战士们的秩序。"
 court_position_possessed_trait:0 "[GetTrait('possessed_1').GetName( ROOT.Char )]"
 court_position_lunatic_trait:0 "[GetTrait('lunatic_1').GetName( ROOT.Char )]"
 court_position_possessed_lunatic_trait:0 "[GetTrait('possessed_1').GetName( ROOT.Char )][GetTrait('lunatic_1').GetName( ROOT.Char )]"
 court_position_auspex_trait:0 "[GetTrait('auspex').GetName( ROOT.Char )]"
 court_position_auspexadvanced_trait:0 "[GetTrait('auspexadvanced').GetName( ROOT.Char )]"
 court_seer_court_position:0 "[SelectLocalization(GetPlayer.IsValid, 'court_seer_court_position_from_player', 'custom_court_seer')]"
 court_seer_court_position_from_player:0 "[GetPlayer.Custom('CourtSeer')]"
 custom_court_seer:0 "宫廷先知"
 custom_court_seer_oracle:0 "宫廷神谕"
 custom_court_seer_augur:0 "宫廷占兆官"
 court_seer_court_position_desc:0 "$court_seer_court_position$预见未来，决定举行官方活动的日子是否吉利。"
 minister_eagles_court_position:0 "鹰部"
 minister_eagles_court_position_desc:1 "鹰部专门研究任何类型的信息，无论是关于凡人设施和政治局势的世俗信息，还是他们被监禁前的失落传说，或是可能威胁到王庭的超自然活动。"
 minister_aurochs_court_position:0 "牛部"
 minister_aurochs_court_position_desc:1 "牛部，也被称为护卫者，其任务是保卫王庭并执行其法律。他们还保护高阶堕落者免受敌对恶魔的暗杀企图。"
 minister_dragons_court_position:0 "龙部"
 minister_dragons_court_position_desc:1 "龙部的使命是质疑和挑战权威。他们必须时刻注意腐化和背叛的迹象。恶魔们被鼓励在他们的交易中保持谨慎，监察官确保每个恶魔体内驱使他们反对上帝的叛逆火花被引导到更有建设性的地方。"
 minister_dust_court_position:0 "尘部"
 minister_dust_court_position_desc:1 "尘部的使命是保管凡人群众，以及推动王庭的发展。他们管理凡人机构，使他们远离王庭的基础设施，并通过支持宗教机构或管理城市，使人们更加紧紧依赖他们的迷信，从而增加人口中的普遍信仰量。"
 minister_swords_court_position:0 "狮部"
 minister_swords_court_position_desc:1 "狮部负责对抗对王庭的威胁，管理王庭的精英士兵。由于与愤怒之年相比，公开使用暴力和展示武力受到限制，所谓的“利剑”必须小心翼翼地履行其职责。"
 brujah_warmaster_court_position:0 "布鲁赫战帅"
 brujah_warmaster_court_position_desc:1 "$brujah_warmaster_court_position$是自古以来的新生布鲁赫的战斗导师。然而氏族已经衰落到如此程度，这传统也大多被遗忘了，但有些人仍然坚持这个传统，强迫稚子在进入宫廷后接受彻底的、近乎斯巴达式的训练。"
 court_position_art_wayfare_trait:0 "[GetTrait('art_wayfare').GetName( ROOT.Char )]"
 yin_ambassador_employer_custom_effect_description:0 "宫廷内的所有人：\n每月灵界探索进度：[grace_i]#P +10%#!到[grace_i]#P +50%#!（基于[aptitude|E]）"
