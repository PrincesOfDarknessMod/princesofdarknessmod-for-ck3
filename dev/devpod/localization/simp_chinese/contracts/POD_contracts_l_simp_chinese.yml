l_simp_chinese:
 POD_natural_disaster_contract: "自然灾害"
 POD_natural_disaster_desc_title: "[TaskContract.MakeScope.Var('disaster_loc').GetFlagName]"
 POD_natural_disaster_desc: "一场巨大的[TaskContract.MakeScope.Var('disaster_type').GetFlagName|l]将要袭击[TaskContract.MakeScope.Var('target_title').Title.GetNameNoTierNoTooltip] 。现在还来得及将其阻止……或是使之更糟？"
 POD_natural_disaster_request: "这份[task_contract|E]合同要求你前往[TaskContract.GetLocation.GetName]。然后你就可以开始根据你的[GetPlayer.Custom('PODCoterie')]能力来决定如何应对即将到来的灾难了。\n\n$POD_contract_show_time_remaining$"
 task_contract_reward_effect_success_prevented_disaster_desc: "#P 你阻止了灾难：#!"
 task_contract_reward_effect_success_turned_disaster_into_prosperity_desc: "#P 你阻止了灾难#bold #!同时也改善了气候#!"
 task_contract_reward_effect_success_provided_relief_desc: "#P 你为灾民们提供了赈灾救济#!"
 task_contract_reward_effect_success_provided_great_relief_desc: "#P 你为这些难民提供了#bold 大量的#!赈灾救济#!"
 task_contract_reward_effect_success_made_disaster_worse_desc: "#P 你让这场灾难#!#N;bold 更糟糕了：#!"
 task_contract_reward_effect_failure_do_nothing_desc: "#N 你什么都没做：#!"
 POD_assault_lair_contract: "袭击一个已然暴露的巢穴"
 POD_assault_lair_desc_title: "一个机会出现在眼前"
 POD_assault_lair_desc: "我们知晓了潜伏在这片区域的魔物的位置，如果我们迅速出击，也许可以先发制人"
 POD_assault_lair_request: "这份[task_contract|E]要求你前往[TaskContract.GetLocation.GetName]。然后你就可以利用你[GetPlayer.Custom('PODCoterie')]的能力来处理猎物了。\n\n$POD_contract_show_time_remaining$"
 POD_assault_lair_contract_success_tt: "你会得到[prestige_i][prestige|E]，[piety_i][piety|E]，[dynasty_prestige_i][dynasty_prestige|E]，以及[Glossary('真信','game_concept_true_faith_desc')][lifestyle_experience|E]。回报与[task_contract_tier|E]和你是否利索地完成狩猎有关"
 task_contract_reward_effect_failure_abandoned_hunt_desc: "#N 你放弃了这次掠食#!"
 task_contract_reward_effect_failure_failed_hunt_desc: "#N 魔物战胜了你#!"
 POD_accept_contract: "我马上就到那儿去。"
 POD_accept_contract_tt: "你打开规划书[travel|E]，然后前往[task_contract.GetLocation.GetName]"
 POD_postpone_contract: "我会考虑的。"
 POD_abandon_contract: "我对这份合同不感兴趣。"
 POD_abandon_contract_tt: "这份契约将会作废。"
 POD_contract_show_time_remaining: "这份合同将会于#bold [GetGameTimeDifferenceForDiffDays(GetVarTimeRemaining(TaskContract.MakeScope,'time_remaining'))]失效#!#italic ([GetCurrentDateWithDiff(GetVarTimeRemaining(TaskContract.MakeScope,'time_remaining'))])#!"
 POD_ghoul_mission_kill_hunter_contract: "猎杀猎人"
 POD_ghoul_mission_kill_hunter_desc_title: "致我果断的仆人，"
 POD_ghoul_mission_kill_hunter_desc: "一个名为[TaskContract.MakeScope.Var('target').Char.GetHerselfHimself][TaskContract.MakeScope.Var('target').Char.GetFirstName]的猎人正在我们的领地内四处窥探。在[TaskContract.MakeScope.Var('target').Char.GetSheHe]成为我们的麻烦之前，处理掉[TaskContract.MakeScope.Var('target').Char.GetHerHim]。"
 POD_ghoul_mission_kill_hunter_request: "这个[bound_ghoul_mission_with_icon|E]要求你杀死[TaskContract.MakeScope.Var('target').Char.GetFirstName]，通过一切必要的手段。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_cover_up_the_masquerade_contract: "掩盖潜藏"
 POD_ghoul_mission_cover_up_the_masquerade_desc_title: "致我谨慎的仆人，"
 POD_ghoul_mission_cover_up_the_masquerade_desc: "若要吾等之社会存续繁荣，则必须隐于暗影之中。汝需证明自身之智谋，确保血畜永不知晓吾等存在。"
 POD_ghoul_mission_cover_up_the_masquerade_request: "此[bound_ghoul_mission_with_icon|E]要求你通过一个针对[TaskContract.GetEmployer.GetHerHim]的[character_interaction|E]以掩盖[TaskContract.GetEmployer.GetShortUINamePossessive]的[masquerade_exposure_with_icon|E]。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_bribe_officials_contract: "贿赂官员"
 POD_ghoul_mission_bribe_officials_desc_title: "致我足智多谋的仆人，"
 POD_ghoul_mission_bribe_officials_desc: "那些烦人的地方法官正紧盯着我，扬言要彻查我的生意，替我转移他们的注意力。"
 POD_ghoul_mission_bribe_officials_request: "此[bound_ghoul_mission_with_icon|E]要求你通过对[TaskContract.GetEmployer.GetShortUIName]的[character_interaction|E]，支付[gold_i][GetPlayer.MakeScope.ScriptValue('minor_gold_max_value')|0V]。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_indoctrinate_plant_contract: "照料植物"
 POD_ghoul_mission_indoctrinate_plant_desc_title: "致我有说服力的仆人，"
 POD_ghoul_mission_indoctrinate_plant_desc: "情报乃是无价之宝，你难道不认同吗？为我寻来一位可靠之人，以间谍之身为吾等大业效命。"
 POD_ghoul_mission_indoctrinate_plant_request: "此[bound_ghoul_mission_with_icon|E]要求你通过一个[character_interaction|E]对任意的[GetTrait('mortal').GetName(GetNullCharacter)]进行思想灌输。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_abduct_desirable_mortal_contract: "绑架优质的凡人"
 POD_ghoul_mission_abduct_desirable_mortal_desc_title: "致我狡猾的仆人，"
 POD_ghoul_mission_abduct_desirable_mortal_desc: "近来有名为[TaskContract.MakeScope.Var('target').Char.GetFirstName]的凡人颇具潜质，已入我眼。将[TaskContract.MakeScope.Var('target').Char.GetHerHim]隐秘地带到我的面前，不得多问。"
 POD_ghoul_mission_abduct_desirable_mortal_request: "此[bound_ghoul_mission_with_icon|E]要求你不择手段地将[TaskContract.MakeScope.Var('target').Char.GetFirstName]纳入你的麾下，并且通过[character_interaction|E]将[TaskContract.MakeScope.Var('target').Char.GetHerHim]转交给[TaskContract.GetEmployer.GetShortUIName]。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_steal_rivals_gold_contract: "偷宿敌的钱"
 POD_ghoul_mission_steal_rivals_gold_desc_title: "致我那精于诡道的仆人，"
 POD_ghoul_mission_steal_rivals_gold_desc: "吾等之敌甚众。当先发制人，夺其资财，绝其用以反噬吾辈之可能。"
 POD_ghoul_mission_steal_rivals_gold_request: "此[bound_ghoul_mission_with_icon|E]要求你通过一个[infiltration_mission|E]对[TaskContract.GetEmployer.GetShortUINamePossessive]的任意一个[rivals|E]执行#V $POD_gold_heist_interaction$#!。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_damage_rivals_image_contract: "损害宿敌的声誉"
 POD_ghoul_mission_damage_rivals_image_desc_title: "致我狡猾的仆人，"
 POD_ghoul_mission_damage_rivals_image_desc: "吾辈之敌甚众，须给他们一些教训。先发制人，折损其威仪，令其在同侪之中尽失尊荣。"
 POD_ghoul_mission_damage_rivals_image_request: "此[bound_ghoul_mission_with_icon|E]要求你通过一个[character_interaction|E]以破坏[TaskContract.GetEmployer.GetShortUINamePossessive]任意[rivals|E]的[prestige|E]。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_slander_rival_contract: "诽谤宿敌"
 POD_ghoul_mission_slander_rival_desc_title: "致我诡谲的仆人，"
 POD_ghoul_mission_slander_rival_desc: "吾辈之敌甚众。散布其卑劣行径之流言，吾等便可兵不血刃，令其身败名裂。"
 POD_ghoul_mission_slander_rival_request: "此[bound_ghoul_mission_with_icon|E]要求你通过一个[character_interaction|E]以破坏[TaskContract.GetEmployer.GetShortUINamePossessive]任意[rivals|E]的[piety|E]。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_give_relative_away_contract: "送出亲戚"
 POD_ghoul_mission_give_relative_away_desc_title: "致我珍贵的仆人，"
 POD_ghoul_mission_give_relative_away_desc: "是时候证明你对我的绝对忠诚了。"
 POD_ghoul_mission_give_relative_away_request: "此[bound_ghoul_mission_with_icon|E]要求你通过一个[character_interaction|E]将你的一名至亲送至别处。你可能再也无法见到他们。\n\n$POD_contract_show_time_remaining$"
 POD_ghoul_mission_expand_domain_contract: "扩张领地"
 POD_ghoul_mission_expand_domain_desc_title: "致我那决不妥协的仆人，"
 POD_ghoul_mission_expand_domain_desc: "吾将沙场之任托付于汝之能。以吾之名，开疆拓土，征战四方。"
 POD_ghoul_mission_expand_domain_request: "这项[bound_ghoul_mission_with_icon|E]要求你通过#V 拥立新君#![casus_belli|E]征服领土，并将其授予[TaskContract.GetEmployer.GetShortUIName]。或者，你也可以通过#V $grant_titles_interaction$#![character_interaction|E]让出自己持有的一个[counties|E]。\n\n$POD_contract_show_time_remaining$"