 nick_vatican_hunter1_desc: "裁判官必须展现出狡猾的一面，因为黑夜中的魔物永远不知疲倦。"
 nick_vatican_hunter2: "狼"
 nick_vatican_hunter2_desc: "裁判官绝不能独自猎魔，因为孤狼很容易成为猎物。"
 nick_vatican_hunter3: "狮子"
 nick_vatican_hunter3_desc: "裁判官必须表现出勇敢，因为夜晚是黑暗的，充满了恐怖。"
 nick_vatican_hunter4: "羔羊"
 nick_vatican_hunter4_desc: "我又看见宝座与四活物并长老之中有羔羊站立，像是被杀过的，有七角七眼，就是神的七灵，奉差遣往普天下去的。"
