 nick_horned_snake: "角蛇"
 nick_the_schemer: "谋士"
 nick_the_dutiful_desc: "职责就是一切。永恒的职责更是如此。"
 nick_goddess_of_war_and_love_desc: "一个拥有两张面孔的女人，一个将为世界带来两种截然不同血系的女人。"
 nick_the_spearmaster_desc: "我的祖尊刺得比你还有力！他甚至已经死了！"
 nick_the_dark_angel_desc: "到头来，只有黑暗。"
 nick_the_bronze_bow_desc: "优雅的武器，精湛的技艺，从未失手。"
 nick_voyager_caged_desc: "对知识的渴望永远无法真正满足。"
 nick_mistress_of_weapons_desc: "被选中的末日预言者，巧妙地躲过了这一劫。"
 nick_eyes_of_the_serpent_desc: "深入观察他们。"
 nick_patron_of_the_sun_desc: "世上最伟大之城的救世主，却被继任者遗忘。"
 nick_dark_desc: "当你想确保别人很快就能明白你在善与恶之间的立场时。"
 nick_eternal_rebel_desc: "永远骑在正义的反抗之车上。"
 nick_muse_of_rebellion_desc: "不死族的革命找到了它们的追随之星"
 nick_anarch_visionary_desc: "隐藏在混乱背后的智脑，努力为那些推翻一切的人带来秩序。"
 nick_nines_desc: "这个贫困家庭的第九个孩子从未忘本。"
 nick_ruthless_iconoclast_desc: "亡生就是一个笑话。"
 nick_vanguard_thinblood_desc: "珍娜勇敢地带领受压迫者走向光明的未来。她可能是他们的救星，也可能是他们的末日。"
 nick_teacher_warrior_desc: "战争和其他学科一样，也是一门学科。"
 nick_unwilling_messiah_desc: "尽管你竭尽全力，但你真的能拯救世界吗？"
 nick_usurper_prince_desc: "严格说来，从该隐开始，所有的亲王领都是篡夺来的。"
 nick_the_ticktock_man_desc: "滴。答。滴。答。\n轰！"
 nick_count_desc: "贵族的反叛具有某种粗犷的吸引力。"
 nick_unhinged_autarkis_desc: "如果焚烧一切能让你体会到活着的感觉，那就这么去做吧。"
 nick_pelagian_heretic_desc: "总有一天，他们都会理解你的远见卓识。即使你必须为此咒骂他们。"
 nick_the_pale_desc: "随着彻底毁灭的可能性日益逼近，人们只能吓得脸色惨白。"
 nick_weak_overseer_desc: "软弱是不能容忍的。当然，除非你是家族的一员。"
 nick_guardian_of_nicaea_desc: "自我强加的责任最有可能得到遵守。"
 nick_the_penitent_desc: "救赎真的存在吗？"
 nick_keeper_of_the_golgotha_desc: "在卡帕多西亚氏族最黑暗的地下深处，恩热等待着她必然的回归。"
 nick_hanseatic_ambassador_desc: "从威尼斯到德意志，金钱的诱惑将它们联系在一起。"
 nick_wearer_sun_mask_desc: "一个相当直白的绰号。"
 nick_cynical_abbot_desc: "上帝终究是宽容的。"
 nick_the_young_wolf_desc: "有时候，智慧甚至可以来自年轻人。"
 nick_warlord_of_the_camarilla_desc: "一个执法机构首先需要一个野蛮而残忍的铁拳才能保持秩序。"
 nick_the_reluctant_prince_desc: "力量就是一切，甚至是你不想要的一切。"
 nick_lupine_hunter_desc: "享受最致命的运动，让吸血鬼觉得自己是温顺的猎物。"
 nick_the_midnight_queen_desc: "当灯光熄灭时，演出仍在继续。"
 nick_the_egyptian_desc: "为不值一提的入侵者起了一个讥讽的绰号。"
 nick_savage_military_mastermind_desc: "耐心并非一切。一个人可以靠原始的力量赢得战争。"
 nick_geoffrey_leigh_desc: "放弃自己的根本以洗刷过去的错误，获得新生。"
 nick_curious_nomad_desc: "围绕着他创造了新的身份，形成了新的神话，每一个都是新的保护层。"
 nick_chief_enforcer_desc: "秩序将得到执行，如果需要的话，可以用牙齿和爪子。"
 nick_byzantine_envoy_desc: "一个破败帝国的破败权威并不意味着什么。"
 nick_beast_of_wales_desc: "这片土地有它的保护者。但它可能来得太少太晚了。"
 nick_treacherous_beast_desc: "这只会咬你的手。"
 nick_tireless_pagan_desc: "她的信仰正在消亡，她的意志正在枯竭。休息只会摧垮她。"
 nick_friend_of_wolves_desc: "只要他们没有察觉到你身上的污染，他们就是你强大的盟友。"
 nick_vanguard_of_the_west_desc: "要打败敌人，首先要了解敌人。"
 nick_shattered_mind_desc: "风中失去了清明，疯狂填满了空虚。"
 nick_noble_savage_desc: "部分参与，但从未真正加入他们。"
 nick_spineless_tactician_desc: "有时也被称为扶手椅上的将军。"
 nick_hammer_of_the_goths_desc: "纳尔西斯赢得了所有的政治和军事战役。他对拜占庭的最终胜利也是他的致命伤。"
 nick_the_gadfly_desc: "扎姆拉从不放弃她的猎物和野心。很多人低估了她一次，但很少有人能低估她两次。"
 nick_monarch_of_the_light_desc: "世界上最伟大的城市的女继承人，在暗影之氏族中闪闪发光。"
 nick_the_golden_desc: "黄金可能会让人眼花缭乱，甚至对它的主人来说也是如此。"
 nick_the_knight_desc: "骑士精神并没有死亡。它是不死族的了。"
 nick_desperate_sultan_desc: "绝望只会加速人的死亡。"
 nick_the_spark_of_war_desc: "长期以来，内战仍需要一个适当的起点。"
 nick_daughter_of_genoa_desc: "共和国扩大了它的视野。它的不死族赞助人也是如此。"
 nick_the_reformist_desc: "在不死族的永恒社会中，变化来得很慢。"
 nick_the_patient_sister_desc: "在一个支离破碎的家庭中，一种平静的存在，也许足以治愈它。"
 nick_military_cardinal_desc: "战争和信仰，被捆绑在一起。"
 nick_the_people_choice_desc: "如果有人不同意，他们就会被拉回队伍。"
 nick_unruly_daughter_desc: "在不死族的社会中，天生伟大可能是一个令人窒息的事实。"
 nick_the_many_faced_desc: "但真正的一面在哪里？"
 nick_of_the_hoof_desc: "这匹马真的忠于它的骑手吗？"
 nick_savage_sorceress_desc: "谁说魔法必须是无聊的和老套的？"
 nick_sabbat_crusader_desc: "真正的信徒，准备为一项功业战斗和牺牲。"
 nick_conrad_desc: "身份中的身份，混淆敌人和朋友。"
 nick_daring_pirate_desc: "穿越七大洋，在他们自认为其统治的地方追猎影之主。"
 nick_misguided_zealot_desc: "狂热可以是一种强大的武器，也可以是一个强大的错误。"
 nick_burgeoning_diplomat_desc: "一种受庇护的生活，导致了缓慢但充满希望的不平凡亡生的开始。"
 nick_magister_envoy_desc: "篡位者和暗影，合二为一？"
 nick_small_desc: "被那些不知情的人低估了，通常风险自负。"
 nick_disgraced_physician_desc: "医者不能自医。"
 nick_fanatic_cultist_desc: "在彻底的奉献中，一些人得到了救赎，另一些人则受到了诅咒。"
 nick_the_moon_desc: "月眷者，注视着触染了其的月亮。"
 nick_the_madman_of_marrakich_desc: "他们不理解。也许这是最好的。"
 nick_vengeful_conspirator_desc: "复仇使人失去理智。"
 nick_sunblind_prophet_desc: "直视太阳可能会让人眼盲，也可能会给人以启迪。"
 nick_her_better_half_desc: "谁会否认它呢？"
 nick_auntie_desc: "从她开明的疯狂中寻找她的侄子和侄女。"
 nick_plot_twist_desc: "你没料到吧？"
 nick_the_jocastatian_desc: "知识通过血液传递。"
 nick_the_conquistadora_desc: "就像过去那些大胆的冒险家一样，她征服了前进道路上的一切，却丝毫没有注意到尸体的数量。"
 nick_vengeful_longbow_desc: "必须让这些自命不凡的新人安于其位，压制他们要求独立的琐碎呼声。"
 nick_the_arthurian_desc: "至少在一个傻瓜的妄想中，圣杯探险得以实现。"
 nick_the_peacock_prince_desc: "你看到他到处游行了吗？"
 nick_the_noddist_desc: "真相在古老的神话中。也许结局亦是如此。"
 nick_the_lizard_desc: "蜥蜴永远无法避免阳光的温柔抚摸。"
 nick_lazarus_james_desc: "一种源自破碎心灵的亵渎。"
 nick_fool_of_magdeburg_desc: "娱乐强者，肆无忌惮地嘲笑他们。"
 nick_king_of_the_underworld: "冥王"
 nick_inquisitive_guardian: "追根究底的守护者"
 nick_inquisitive_guardian_desc: "寻求过往的答案，鲁斯提库斯常常害怕自己有一天会发现真相。"
 nick_the_envious_sister: "嫉妒的妹妹"
 nick_the_intoxicating_sovereign: "醉人的君主"
 nick_the_intoxicating_sovereign_desc: "她的名字据说意为“醉人的女人”，与英语单词“蜂蜜酒”同源；王与女神之间神圣的结婚仪式很可能需要共饮一杯。"
 nick_the_sworn_prince: "宣誓王子"
 nick_maine_athramail: "梅因·阿特拉迈尔"
 nick_maine_athramail_desc: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。费德利米德成为了梅因·阿特拉迈尔（“如同他的父亲”）。"
 nick_maine_mathramail: "梅因·马斯拉米尔"
 nick_maine_mathramail_desc: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。凯布尔成为了梅因·马斯拉米尔（“如同他的母亲”）。"
 nick_maine_andoe: "梅因·安多"
 nick_maine_andoe_desc: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。欧凯德成为了梅因·安多（“迅速”）。"
 nick_maine_tail: "梅因·塔伊"
 nick_maine_tail_desc: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。欧凯德成为了梅因·塔伊（“寂静”）。"
 nick_maine_morgor: "梅因·莫尔戈"
 nick_maine_morgor_desc: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。瑟特成为了梅因·莫尔戈（“伟大的义务”）。"
 nick_maine_milscothach: "梅因·米尔斯科塔奇"
 nick_maine_milscothach_desc: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。塞恩成为了梅因·米尔斯科塔奇 （“甜言蜜语”）。"
 nick_maine_moepirt: "梅因·莫埃皮特"
 nick_maine_moepirt_desc: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。戴瑞成为了梅因·莫埃皮特（“不可名状”）。"
