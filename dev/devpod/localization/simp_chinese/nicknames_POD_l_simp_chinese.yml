 nick_middle: "次子"
 nick_younger: "幼子"
 nick_red_king: "红王"
 nick_elder_lord: "年老领主"
 nick_younger_lord: "年幼领主"
 nick_witch_queen: "女巫王"
 nick_fire_maiden: "火之少女"
 nick_copper_maiden: "铜处女"
 nick_foam_maiden: "泡沫少女"
 nick_hope_of_keshalyi: "凯沙利的希望"
 nick_goddess_hours: "时辰女神"
 nick_goddess_hours_desc: "光阴按照她的意愿滴答流逝。"
 nick_stubborn_apprentice: "固执的学徒"
 nick_stubborn_apprentice_desc: "托拉活着就是为了学习。他的老师往往比他更累。"
 nick_last_cat_standing: "最后一只站着的猫"
 nick_last_cat_standing_desc: "据她所知，奥尔文可能是最后一只同类了。看来，多变的猫咪们的派对已经结束了。"
 nick_savior_khans: "可汗的救主"
 nick_savior_khans_desc: "尽管软步行者已立下赫赫战功，甚至亲自救过忽必烈汗，他仍然力求让自己更上一层楼。"
 nick_rising_sun: "旭日初升"
 nick_rising_sun_desc: "太阳带来了生命，但也给那些过于接近太阳的人带来了炽热的死亡。"
 nick_bringer_bounty: "慷慨国王"
 nick_bringer_bounty_desc: "马努·查阿将他的人民从一场可怕的饥荒中拯救出来，证明了狮族可以公平地统治，并为他们的后代带来繁荣。"
 nick_clearwater_lover: "清水猎豹"
 nick_clearwater_lover_desc: "尼奥洛英俊潇洒、赏心悦目，但他对斯瓦拉的奉献却让他成为了一些强大实体的目标。"
 nick_pawn_samhach: "萨姆哈奇的棋子"
 nick_pawn_samhach_desc: "一些祟利坎自愿将自己的生命献给为他们部族带来毁灭的人。对他们来说，生存的代价太高了。"
 nick_wearer_triple_faced_mask: "三面面具佩戴者"
 nick_wearer_triple_faced_mask_desc: "三张昔日的面孔，正在寻找久违的复仇机会。"
 nick_wearer_gatto_mask: "公猫面具佩戴者"
 nick_wearer_gatto_mask_desc: "学者对知识的渴求让他字面意思上的起死回生。"
 nick_wearer_pantalone_mask: "丑角老人面具佩戴者"
 nick_wearer_pantalone_mask_desc: "别人告诉你的一切都是谎言"
 nick_fate_conspirator: "命运的阴谋家"
 nick_fate_conspirator_desc: "对于一个被命运本身驱使的人来说，阴谋不过是加速往不可避免的结局的一种行事方式。"
 nick_the_white_phantom_desc: "芬达贝意为“白色幻影”。在词源学上，它与格温赫弗同源，格温赫弗是葛妮薇儿在威尔士语中的语。库丘林称她为“美丽的诱饵”。"
 nick_birkibeinar: "桦木绑腿"
 nick_birkibeinar_desc: "挪威叛乱党派的名称，该党派成立于1174年，围绕着挪威王位的篡夺者埃斯泰因·梅拉。该名称源于正统党派的宣传，称反叛者非常贫穷，用桦树皮制作鞋子。虽然起初是贬义词，但反对派还是采用了比基比纳尔这个名字，并在1184年掌权后继续使用。"
 nick_harefoot: "飞毛腿"
 nick_harefoot_desc: "在十二世纪伊利修道院的历史中，他首次被记录为“飞毛腿”或“兔足”，根据一些中世纪晚期编年史家的说法，这意味着他“脚步敏捷”。"
 nick_wetfoot: "湿足"
 nick_wetfoot_desc: "克努特把宝座放在海边，命令涨潮停止，不要弄湿他的脚和长袍。然而，潮水一如既往地上涨，冲刷着他的双脚和双腿，丝毫不顾及他的王权。然后，国王向后一跃，说：“人们应当知道国王的权位是多么的空虚与毫无价值，因为除了统御着天空、陆地与海洋的主外，没有任何人配得上这个名字。”然后他把金冠挂在十字架上，再也不戴了，“以荣耀上帝，全能的王。”"
 nick_heartsong: "心之歌"
 nick_heartsong_desc: "冈特·索伦森一有机会就会把滑稽戏演员和民俗学家聚集在身边。他喜欢参加音乐活动和戏剧演出。"
 nick_the_poison_thorn: "毒荆棘"
 nick_the_poison_thorn_desc: "因使用有毒武器而臭名昭著。"
 nick_the_commoner_lover: "平民爱好者"
 nick_the_commoner_lover_desc: "在高贵的仙族中，尤其是在阿萨世家中，他是不同寻常的，他以支持平民妖精而闻名。"
 nick_the_mute: "哑巴"
 nick_the_mute_desc: "尽管身为军事指挥官，他却从不说话。"
 nick_of_the_gleaming_eyes: "荧眼之人"
 nick_of_the_gleaming_eyes_desc: "她的眼中闪烁着阴森的红色光芒"
 nick_servant_of_saint_secundinus: "圣赛公定的仆人"
 nick_servant_of_saint_secundinus_desc: "圣帕特里克的弟子，奥毛伊谢阿赫莱因或奥梅拉格伦家族的守护神；在十世纪及其后几个世纪相当普遍，尤其是在奥梅拉格伦、奥法雷尔、奥凯利和奥康纳家族中；现在仍在使用，但一般都伪装成圣玛拉基。"
 nick_doireannara: "多伊兰纳拉"
 nick_general_of_the_forces: "部队将军"
 nick_of_the_twisted_oak: "曲橡树之人"
 nick_general_of_the_bleak: "凄凉将军"
 nick_the_dance_master: "舞蹈大师"
 nick_black_tongue_prefix: "黑舌"
 nick_the_eye_blighter: "枯眼者"
 nick_the_eye_blighter_desc: "他因制造出巴烙世家杀手最喜欢的“眼枯”毒药而臭名昭著。这种毒药不会致命，但会导致受害者的眼睛在眼眶中腐烂。"
 nick_the_old_soldier: "老兵"
 nick_the_old_soldier_desc: "他曾长期担任巴烙世家的乌合之众的训练员，据说他对这些人很有一套。"
 nick_the_child_stealer: "窃童者"
 nick_the_child_stealer_desc: "哀怒廷妖精最擅长做的事就是从凡人那里偷孩子。该妖精善于诱拐有前途的凡人孩子，将他们变成换生灵。"
 nick_the_six_fingered: "六指"
 nick_the_six_fingered_desc: "作为巴烙世家与生俱来的诅咒，他的畸形是每只手上都有六根手指。他总是戴着特制的手套。"
 nick_the_hungry_fae: "饥饿妖精"
 nick_the_hungry_fae_desc: "作为巴烙世家的一员，他有一处畸形。他的畸形是身体上的，表现为极其憔悴的身材和一双饥饿的眼睛。他总是饥肠辘辘……为了食物、刺激、财宝、魅力、痛苦、快乐或赞美。他永远都不满足，永远都渴望得到更多，即使他刚刚吃饱。"
 nick_the_rebel_financier: "叛逆金融家"
 nick_the_rebel_financier_desc: "叛乱需要金钱。埃达纳善于通过她的说服天赋找到金钱。"
 nick_the_swift: "迅捷者"
 nick_the_swift_desc: "即使敌人就在附近，也能很好地适应情况快速移动。"
 nick_stern_steward: "严厉管家"
 nick_dashing_vixen: "潇洒雌狐"
 nick_the_inscrutable_host: "难以捉摸的东道主"
 nick_the_tempting_poet: "诱人的诗人"
 nick_the_honorable_adversary: "正直的对手"
 nick_the_white_wyrm: "白色龙蛇"
 nick_the_winter_guide: "冬之向导"
 nick_the_very_clever: "非常聪明"
 nick_the_very_clever_desc: "……还擅长背后捅刀子。"
 nick_the_forceful_personality: "强势人格"
 nick_the_forceful_personality_desc: "她魅力四射、风趣幽默，是许多宫廷的座上宾。"
 nick_the_hitherward_witch: "古灵女巫"
 nick_the_night_surgeon: "夜间外医"
 nick_the_night_surgeon_desc: "对刀上瘾。"
 nick_the_virgin: "童贞"
 nick_the_adventerous_cook: "冒险厨师"
 nick_divided_version: "分裂版本"
 nick_sweet_poison: "甜蜜毒药"
 nick_the_blessed_person: "蒙福之人"
 nick_the_blessed_person_desc: "他接受了阿什拉派的自愿初拥，通过走上一条神圣的道路来寻求同类的救赎。"
 nick_bamboo_ghost: "幽篁山鬼"
 nick_bamboo_ghost_desc: "幽静竹山的鬼魂"
 nick_the_crestfallen_steward: "垂头丧气的管家"
 nick_the_face_of_innocence: "无邪面孔"
 nick_the_face_of_innocent_desc: "格里高利的魅力和外表只是他用来掩盖终极罪行的面具：他吞噬了他尊长的灵魂。"
 nick_the_enamored_sire: "醉心的尊长"
 nick_the_enamored_sire_desc: "天真面孔的格里高利的再造者。是什么导致了安德烈亚斯的神秘失踪？"
 nick_the_mad_arab: "阿拉伯疯子"
 nick_the_mad_arab_desc: "叶尔鲁卜是三位疯狂原始教徒的追随者，阿什拉派认为叶尔鲁卜是个疯子。"
 nick_the_knight_of_tears: "泪之骑士"
 nick_the_knight_of_tears_desc: "他是这个时代最可怕的战士之一，却无法用刀剑战胜自己的悲伤。"
 nick_the_flickering_light: "闪烁光芒"
 nick_the_flickering_light_desc: "善良的人，当最后一浪过去，高呼他们脆弱的善行\n可能曾会多么光辉地在绿色的海湾里舞蹈，\n怒斥，怒斥光明的消逝。"
 nick_the_minotaur: "牛头怪"
 nick_the_big_headed: "大头"
 nick_death_dealer: "黑夜传说"
 nick_the_pale_elf: "苍白精灵"
 nick_daughter_of_coldharbour: "冷港之女"
 nick_abetorius_minor: "小阿贝托留斯"
 nick_abetorius_minor_desc: "要走出一位著名祖先的阴影是很难的。尤其是当祖先是永生者的时候。"
 nick_lady_of_keys: "钥之女士"
 nick_the_relentless: "无情者"
 nick_the_relentless_desc: "人们会说，“请不要劫掠我！”。\n\n而我会说，“不，我在劫掠所有人，包括你。“"
 nick_the_blue_al_azraq: "阿兹拉克"
 nick_the_blue_al_azraq_desc: "穆罕默德·阿布·阿卜杜阿拉·本·胡德哈伊尔·萨吉尔是伊比利亚瓦伦西亚南部的一名阿拉伯摩尔人指挥官。人们因他的眼睛而称他为“阿兹拉克”（蓝）。"
 nick_flushing_administrator: "羞怯的管理者"
 nick_flushing_administrator_desc: "虽然吸血鬼通常不会脸红，但每当阿拉贡的露西塔出现在视线范围内，马泰奥总有一种奇异的方式表现出脸红的模样。"
 nick_sadistic_twins: "虐待狂双子"
 nick_sadistic_twins_desc: "阿图罗和列昂尼德会执行阿丰佐交给他们的每一个肮脏任务，并且乐在其中。"
 nick_darkmane: "暗鬃"
 nick_darkmane_desc: "阿赫里曼的力量在英格丽德的$pod_vitae$中流淌，正如它在阿迪萨体内一样。英格丽德绝不会被其吞噬。"
 nick_prince_in_waiting_improved: "应许亲王"
 nick_prince_in_waiting_improved_desc: "安娜终于夺回了她的继承权。她梦寐以求的世界之都如今归于她手，而她的崛起才刚刚开始。"
 nick_blessed_vigilant: "神圣警戒者"
 nick_blessed_vigilant_desc: "塞西莉亚以预言天赋拯救初生暗影裁判所。唯有一人知其所付代价"
 nick_grandmistress_helena: "圣赫勒拿女大团长"
 nick_knight_helena: "圣赫勒拿骑士"
 nick_lugos_guardian: "卢戈斯守护者"
 nick_lugos_guardian_desc: "卢戈斯神古圣所的守护者，久远战役的活体记忆"
 nick_mortitian_cainite: "该隐子嗣葬仪师"
 nick_mortitian_cainite_desc: "众该隐子嗣携同伴骨灰予维特，以求灵魂终获救赎"
 nick_mistress_death: "死亡女主人"
 nick_mistress_death_desc: "至少她现可亲研其道"
 nick_lady_cyber: "赛博女士"
 nick_lady_cyber_desc: "醒醒，该隐子嗣，我们还有黑暗时代要焚尽。"
 nick_red_death: "猩红死疫"
 nick_red_death_desc: "世界末日的开端，可能就源于女儿被父亲背叛这种再简单不过的事儿。"
 nick_the_blood_mage: "血法师"
 nick_the_undeceiver: "破妄者"
 nick_the_bloody_student: "嗜血学徒"
 nick_balaur: "巴拉乌尔"
 nick_the_varangian_quartermaster: "瓦兰吉军需官"
 nick_the_never_satisfied: "永无餍足者"
 nick_slayer_of_the_undead: "亡灵屠戮者"
 nick_the_wolf_blooded: "狼血者"
 nick_red_dragon_piyau: "赤龙"
 nick_red_dragon_piyau_desc: "披耶的生活是放纵、情欲与武艺修炼的漩涡，传说连[Glossary('阎魔王','podgloss.yamaking')]都畏惧她不受束缚的狂热。"
 nick_disciple_arhat: "大阿罗汉门徒"
 nick_disciple_arhat_desc: "虽仅为血/学第二门徒，意却是首位真正悟道者。"
 nick_iron_poet: "疯铁诗人"
 nick_iron_poet_desc: "奥是首位深入[Glossary('阎魔王','podgloss.yamaking')]疆域者，然其心智未能全身而退。"
 nick_lovers_east: "东向恋人"
 nick_lovers_east_desc: "周侃与熙允死后仍如生前般共望东方。"
 nick_dragon_still_black_water: "静玄水第三龙"
 nick_wandering_dark: "游暗"
 nick_wandering_dark_desc: "廖初功曾试无限之力而觉其虚妄，今以猎杀[Glossary('阎魔王','podgloss.yamaking')]为乐。"
 nick_iron_foreman: "铁矿工头"
 nick_iron_foreman_desc: "铁盐地狱的工头确保劳作无误——而劳作永无止境。"
 nick_overseer_wicked: "妖邪之城监工"
 nick_overseer_wicked_desc: "无人真正见过茨様的面容——至少无活口能述"
 nick_crafty_general: "诡将"
 nick_crafty_general_desc: "田本的武艺卓绝背后藏有隐秘，然无人知真相几何。"
 nick_scheming_dilettante: "谋略浪人"
 nick_scheming_dilettante_desc: "空洞表象下藏着连长者都难解的可怖真相。"
 nick_demon_of_the_western_provinces: "西境恶魔"
 nick_demon_of_the_western_provinces_desc: "无论其是真魔或仅技艺超群，凡直面者皆无人生还。"
 nick_little_dragon: "幼龙"
 nick_little_dragon_desc: "纵使他愿七世报国——仍不足偿其志。"
 nick_lady_of_the_shadows: "暗影夫人"
 nick_lady_of_the_shadows_desc: "森辰临终恳求叔父照顾其妻。武田信玄不仅守诺，更予其子媳复仇之机。"
 nick_devil_philosopher: "魔鬼哲人"
 nick_devil_philosopher_desc: "山伯诘问万千却自以为已知答案，唯[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]可破其执。"
 nick_heavenly_duchess: "甘社哲天姬"
 nick_heavenly_duchess_desc: "作为黄帝皇朝的大调和者，荣耀战主，宏对同袍社会的贡献毋庸置疑。"
 nick_midnight_master: "子夜宗师"
 nick_midnight_master_desc: "元德将午夜战争加以法典化，他的教导至今仍是$pod_kueijin$践行正当与荣耀战争的根基。"
 nick_auspicious_sword: "祥瑞之剑"
 nick_auspicious_sword_desc: "君王宠妃，终被赐死。一代兵圣，吸取教训。午夜时分，死去的宠妃书写绝世兵法。"
 nick_daughter_ebon_scarlet: "玄朱之女"
 nick_daughter_ebon_scarlet_desc: "无人确知安秀景身世。学者私语她或握有通往玄龙与朱后界域之钥。"
 nick_focused_mind: "凝心者"
 nick_focused_mind_desc: "郝在转生觉醒后，凭借其敏锐且多变的智慧成为了$pod_kueijin$中最卓越的政治家之一。"
 nick_labyrintine_contestant: "迷宫竞技者"
 nick_labyrintine_contestant_desc: "许参与过两千场暮光之战，败绩仅两。有人说，她活着唯为了那份搏杀的快感与刺激。"
 nick_envoy_salt_iron: "盐铁御史"
 nick_envoy_salt_iron_desc: "田禄外表亲切友善，外交举止圆融，实则暗藏对盐铁坑主[Glossary('乌邝','podgloss.wuhua')]的忠心。"
 nick_herald_revolution: "革命先驱"
 nick_herald_revolution_desc: "部落民坚信青春的力量，他将以坚定的信念传播政治主张，力图逐一唤醒$pod_kueijin$社会的觉悟。"
 nick_fated_tragedy: "宿命悲怆"
 nick_fated_tragedy_desc: "玛丽婉的优雅与智慧为她赢得了众多挚友，但也为她招来了残酷的命运。"
 nick_martyr_teutonic: "条顿殉道者"
 nick_martyr_teutonic_desc: "赫尔曼深知，当最后一个异教徒被带到神光前时，他的生命也将走到尽头。但他无意停下脚步来逃避命运。"
 nick_albino_rat: "白化鼠辈"
 nick_albino_rat_desc: "托尔盖尔身处金字塔的最底层，而他那些“热心”的同仁们总是急于提醒他这一点。"
 nick_boyar_diplomat: "波雅尔外交官"
 nick_boyar_diplomat_desc: "奥索贝以其敏锐的分析力和聪慧的才智成为了弗拉基米尔·罗斯托维奇最值得信赖的重臣之一。"
 nick_dark_horse_from_faraway_lands: "异域黑马"
 nick_dark_horse_from_faraway_lands_desc: "风暴裹着丝绒谎言，在野心脊上驰骋。"
 nick_myeongwol: "妙音月"
 nick_myeongwol_desc: "明月以她的美丽与智慧辉映，为任何能解开“点一二口，牛头不出”的男子许下承诺。"
 nick_kwanryong_kuibu_koryo_changwan: "管领归附高丽军民长官"
 nick_kwanryong_kuibu_koryo_changwan_desc: "归顺高丽勇士的统帅，忠诚侍奉蒙古主子，誓与高丽贵族抗衡。"
 nick_king_of_light: "明王"
 nick_king_of_light_desc: "韩林儿自称大宋正统与弥勒佛转世，却无力证之"
 nick_architect_of_the_wall: "边墙缔造者"
 nick_architect_of_the_wall_desc: "没错，正是那堵墙。就是你心中所想的那一面。"
 nick_drifting_crane: "漂泊之鹤"
 nick_drifting_crane_desc: "王清惠远离故土，失去丈夫，却依旧保留着昔日嫔妃的风采与仪态。"
 nick_pear_blossom_spear: "梨花枪"
 nick_pear_blossom_spear_desc: "杨妙真是山东历代以来最为危险的女人。她凭借机智与勇略，从一位寡妇山贼女王崛起，最终成为正统的帝国行省。"
 nick_howling_wind: "怒号之风"
 nick_howling_wind_desc: "韩理笃信自己事业的正义。无论其他$pod_kueijin$是否认可，他的魅力与决心将化作坚盾，挡住[Glossary('阎魔王','podgloss.yamaking')]的来势。"
 nick_imperial_physician: "御医"
 nick_imperial_physician_desc: "这个带有讽刺意味的绰号，赠予那位誓言以血洗方式“治愈”腐朽[UmbraGlossary('dark_kingdom_of_jade')]官僚体系之人。"
 nick_the_tiger_kj: "猛虎"
 nick_the_tiger_kj_desc: "终有一夜，预言将成真，灭世大敌将降临于他眼前。届时，他将昂然挺立至最后一刻。"
 nick_jack_trades_devil: "万业恶魔"
 nick_jack_trades_devil_desc: "渡鸦如旋风般掠过，思绪纷飞，灵感迸发。唯独静止，她做不到。"
 nick_serene_flower: "寂花"
 nick_serene_flower_desc: "秦绍将骨花[Glossary('心法','podgloss.dharma')]编纂成今之所知的模样。她完美诠释了此[Glossary('心法','podgloss.dharma')]所求的超然静穆之境。"
 nick_sensei_daisetsuzan: "大雪山上师"
 nick_sensei_daisetsuzan_desc: "一代又一代的骨花密探与刺客皆在他的注视下诞生、磨炼，并将继续传承不息。"
 nick_family_protector: "族盾"
 nick_family_protector_desc: "在天台山一带的百姓心中，韩侯守是先祖意志的化身，因而备受敬仰。"
 nick_conservative_genius: "守成天才"
 nick_conservative_genius_desc: "顾祖不会忘记任何事情，正因如此，她对道的诠释不会因妥协而偏离。"
 nick_mother_shadows: "暗影之母"
 nick_mother_shadows_desc: "鲜有人能寻见尊贵的女主人。得见者，离顿悟更近一步。"
 nick_sambong: "三峰"
 nick_sambong_desc: "这位学者诗人系统编纂了朝鲜王朝的意识形态"
 nick_uiam: "义岩"
 nick_uiam_desc: "新安朱氏家族的义岩女士为复仇爱人而献出生命"
 nick_dae: "大"
 nick_dae_desc: "大长今克服了朝鲜王朝对女性的压迫，最终被认可为中宗的看护者。"
 nick_the_exiled_sage: "流放圣人"
 nick_the_exiled_sage_desc: "既非僧侣，亦非俗人，而是超越其上的存在。"
 nick_tempered_ronin: "淬刃浪人"
 nick_tempered_ronin_desc: "近江终于从曾经加害于他的人那讨回了公道。如今，他如一座宁静而耐心的灯塔矗立着……直到有人给他理由再度拔剑出鞘。"
 nick_seed_scatterer: "播道者"
 nick_seed_scatterer_desc: "圣母得道后向世间广施道种，如母舍食哺幼般牺牲自我。"
 nick_the_dragon_kj: "巨龙"
 nick_the_dragon_kj_desc: "终有一夜，预言将成真，灭世大敌将降临于他眼前。届时，他将昂然挺立至最后一刻。"
 nick_patient_blossom: "忍冬"
 nick_patient_blossom_desc: "静心与耐心，是通向王夫之开悟之道的真谛。"
 nick_six_springs: "六泉"
 nick_six_springs_desc: "高学理坚信，德行必须不择手段方能达成。他的丰功伟绩被其挚友伊丹谱成《六泉》诗篇，流传千古。"
 nick_vengeful_patron: "复仇恩主"
 nick_vengeful_patron_desc: "王从未真正离开她逝去的地方。然而，她的遗产或许并非如她所期望的那般。"
 nick_the_crane: "白鹤"
 nick_the_crane_desc: "终有一夜，预言将成真，灭世大敌将降临于她眼前。届时，她将昂然挺立至最后一刻。"
 nick_clear_sky_sage: "澄天圣者"
 nick_carthaginian_envoy: "迦太基使节"
 nick_bane_khotans: "于阗克星"
 nick_sky_swallowing_darkness: "噬天暗影"
 nick_artisan_hundred: "百蹄匠师"
 nick_the_dreadnought: "无畏舰"
 nick_the_chaineater: "锁链吞噬者"
 nick_the_uralic_stalker: "乌拉尔猎手"
 nick_wings_night: "夜翼"
 nick_the_defiant_prince: "逆王"
 nick_bane_vaults: "秘库克星"
 nick_the_emerald_wolf: "翠玉狼"
 nick_the_sapphire_hawk: "青空鹰"
 nick_steppe_lady: "草原夫人"
 nick_the_beauty: "美人"
 nick_the_red_moon_shaman: "赤月萨满"
 nick_the_black_wolf: "黑狼"
 nick_the_demonbane: "破魔者"
 nick_the_lighting_breaker: "碎雷者"
 nick_tigerbane: "虎灾"
 nick_golden_wolf: "金狼"
 nick_lucky_lion: "吉狮"
 nick_lucky_lion_desc: "虽然他本身技艺尚可，但真正令其他[Glossary('万鬼','game_concept_kuei_jin_desc')]忧心的是陈那种近乎诡异的好运。"
 nick_gold_counselor: "黄金顾问"
 nick_gold_counselor_desc: "摩耶将自须弥山的灰烬中崛起，带领影行者使世界重回光明。"
 nick_child_ages: "万古之子"
 nick_child_ages_desc: "狄风亲眼目睹天界的覆灭，遂逃离而去。如今，他独守记忆的残影，静待某一日能鼓起勇气反击。"
 nick_illuminating_darkness: "照彻幽暗"
 nick_delicate_nuances: "微妙隐喻女士"
 nick_god_rain: "雨泪之神"
 nick_god_rain_desc: "因陀罗或许是天族自始祖以来最具灵性的成员。有人相信，当纪元轮转之时，她将成为[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]的杀手。"
 nick_the_usurper_kj: "僭主"
 nick_the_usurper_kj_desc: "黑天之妻自死而归，只为庇护世间寡妇——至少她是这么认为的。"
 nick_assertive_excellence: "卓越自信"
 nick_assertive_excellence_desc: "他是否是那僭主，肆意以他人为代价篡夺神位？他是否便是那个古老传说的根源？哈奴曼对此保持缄默。"
 nick_spirit_guided: "灵引者"
 nick_spirit_guided_desc: "曾被诸灵用于卑微阴谋的里扬，渐渐成长为了与它们平起平坐的存在。"
 nick_last_sambyeolcho: "最后的三别抄"
 nick_last_sambyeolcho_desc: "最后的[Glossary('三別抄', 'podgloss.sambyeolcho')]起义，奋起反抗忽必烈对高丽的统治。"
 nick_princess_jeonghwa: "静华公主"
 nick_princess_jeonghwa_desc: "这位元朝公主在高丽王的虐待下饱受折磨，誓言不惜一切代价血洗旧恨。"
 nick_yi_chachun: "李子春"
 nick_yi_chachun_desc: "李子春毅然舍弃昔日对元朝的效忠，只为追求安定与太平。"
 nick_kayaji: "佳耶智"
 nick_kayaji_desc: "佳耶智出身[Glossary('奴婢','podgloss.nobi')|l]，凭借魅术成为了禑王妃，历经宫廷阴谋，九死一生。"
 nick_howol: "湖月"
 nick_howol_desc: "在遭受强暴威胁，夫君恭愍王也惨遭杀害后，湖月毅然舍弃宫廷荣华，遁入空门。"
 nick_sayuksin: "死六臣"
 nick_sayuksin_desc: "他是死六臣之一，曾参与刺杀篡位者世祖的密谋，最终英勇就义。"
 nick_eowudong: "於宇同"
 nick_eowudong_desc: "於宇同是朝鲜王朝历史上的恶女之一，她拒绝屈从儒家教义中对女性的桎梏。"
 nick_jeongam: "贞庵"
 nick_jeongam_desc: "贞庵是朝鲜十八贤之一，亦是儒家殉道者与[Glossary('士人', 'podgloss.seonbi')|l]学者，他曾极力推动朝鲜政制改革，最终却殒身于第三次士祸之中。"
 nick_chungmugong: "忠武公"
 nick_chungmugong_desc: "这位忠义与武略之公令所有听闻其名的水手敬畏不已。人们至今仍铭记着那支日本舰队是如何在他手中灰飞烟灭的。"
 nick_red_robe: "赤袍将军"
 nick_red_robe_desc: "这位将军身披以少女初潮之血染成的赤袍，总是冲锋在前，直面战火。赤袍将军得阴气庇佑，化敌阳煞为无物。"
 nick_fiery_patron_desc: "这位拉其普特之父自高山之巅降世，立志开创不朽伟业。如今随着穆斯林对印度的入侵，他的传承正处在存亡关头。"
 nick_holy_golden_emperor: "天册金轮圣神皇帝"
 nick_holy_golden_emperor_desc: "中国历史上唯一被正式承认的女皇帝，虽以血铸其路，却亦将天下推向“巅峰”。"
 nick_reclusive_advisor: "遁世顾问"
 nick_reclusive_advisor_desc: "考底利耶曾深刻影响了印度最早的征服者。当次大陆的暗影权力斗争开始对他不利时，他便悄然隐退，淡出了世人视线。"
 nick_guide_power: "通向权力"
 nick_guide_power_desc: "康主张[Glossary('万鬼','game_concept_kuei_jin_desc')]应如传说中的古时般统御凡人。当然这都是为了那些无知凡人的福祉。"
 nick_reaching_tiger: "攀升之虎"
 nick_reaching_tiger_desc: "达试图改革白虎皇朝，却以惨烈失败告终。如今若要拯救残余，恐怕已为时过晚。"
 nick_golden_jade_emperor: "金德玉圣皇帝"
 nick_golden_jade_emperor_desc: "王独居于自我天地，心无旁骛，唯求觉悟。然而，尘世终有一天会追上他。"
 nick_shout_anger: "怒啸"
 nick_shout_anger_desc: "玛华的怒火从未让她迷失方向。她凭此闯过炼狱，寻得血亲姊妹，这股怒焰将成为她得道飞升[Glossary('云开雾散','podgloss.hundredclouds')]的基石。"
 nick_diamond_soul: "钻石之魂"
 nick_diamond_soul_desc: "因檀是一位幸存者。这对她唯一的改变是她如今将那份卓越的直觉用作对整个[Glossary('屋室','podgloss.wu')]的掌控与守护。"
 nick_singing_crocodile: "吟鳄"
 nick_singing_crocodile_desc: "当她的姐妹们冲锋陷阵，弥逻底却潜行埋伏。最终的结局是一场无情惨烈的血腥屠杀。"
 nick_lifter_stones: "举石提梁者"
 nick_lifter_stones_desc: "茜蒂曾希望凭借她对数字的天赋助家业兴旺。如今她却与姐妹们并肩，将敌人的堡垒夷为平地。"
 nick_devil_eater: "噬魔者"
 nick_devil_eater_desc: "她的某些敌人认为这个名号只是虚张声势，而他们往往在惨痛折磨中才意识到自己的错误。"
 nick_warden_shogun: "幕府守护者"
 nick_warden_shogun_desc: "三浦忠实地保护着饱受困扰的幕府将军，却对袭击背后更复杂的真相一无所知。"
 nick_myochong: "妙清"
 nick_myochong_desc: "虎叱因业火而灼身，如今他以借亡师之名谋取权势。"
 nick_keeper_threshold: "界门守司"
 nick_keeper_threshold_desc: "江让通往中华的国门保持开放。不过有人觉得也太开放了点。"
 nick_ocean_striding: "踏海盗魁"
 nick_ocean_striding_desc: "尽管世人对此多嗤之以鼻，姚却以作为万鬼中最负盛名的海盗为傲。她的传奇不过才刚刚启程。"
 nick_alyad_alyumnaa_alsawda: "吉祥黑曜女"
 nick_alyad_alyumnaa_alsawda_desc: "幻象之重足以压垮无数幽影。唯独有一人未曾屈服——其将掌控那座不夜城。"
 nick_long_neck_legend: "长颈奇谭"
 nick_long_neck_legend_desc: "日本最殊胜的肉神体宗师，在凡间留下了难以磨灭的印记。世人至今仍传颂着她那曾一度展现出的奇景——细长、柔韧、无视重力般腾空伸展的颈项。"
 nick_imperial_steadfast: "铁杆忠臣"
 nick_imperial_steadfast_desc: "平氏与其朝廷笃信唯有天皇才是世间唯一的权威。凡非出自天皇的新思新念，皆当不惜一切代价抗拒。"
 nick_southern_sycophant: "南地佞臣"
 nick_southern_sycophant_desc: "当宋人惊惶于蒙古铁骑步步逼近之际，桂英何在？身处主君宫中，巧言令色，百般争宠。"
 nick_western_fawner: "西地谄臣"
 nick_western_fawner_desc: "当西方诸国纷纷与蒙古人结盟，异邦嗜血之徒步步逼近，白却将注意力转向了内部，对即将降临的灾难浑然不觉。"
 nick_northern_henchman: "北地走狗"
 nick_northern_henchman_desc: "命令就是命令，无悔之兵不知羞愧。"
 nick_eastern_parasite: "东地奸臣"
 nick_eastern_parasite_desc: "沿海已掀起惊涛骇浪，连魔虎亦感不安。此乃清之“虔诚”所致也。"
 nick_nocturne_illuminator: "夜奏明灯者"
 nick_nocturne_illuminator_desc: "当面对能塑血化肉的狂战妖女，鲜活炽烈的凡俗生机，千载沉淀的宗教信仰与文化脉络，以及深海中潜伏不出的冈格罗时，唯有巧策方能兴盛。"
 nick_flame_eater: "噬焰者"
 nick_flame_eater_desc: "什么样的怪物吞龙啖魔，吸血鬼、人间英杰、现实扭曲者、火焰与小神皆为其口粮？——一个曾经的凡人。"
 nick_purger_dragon_night: "龙夜之灾"
 nick_purger_dragon_night_desc: "静子使凡世与灵界免于春次郎勇的疯狂造物所带来的浩劫。哪怕是最顽固的异类也不得不承认他是最强大的猎魔人。"
 nick_knight_gold: "黄金骑士"
 nick_knight_gold_desc: "一位集骑士美德与荣耀于一身之人曾东行远赴，只为试探[Glossary('安答','podgloss.anda')]之威。但他究竟是为了骑士精神？抑或者是自负的粉饰？"
 nick_returned_khan: "归来的万汗之汗"
 nick_returned_khan_desc: "托默巴特尔自称是铁木真再世，只因旧躯已毁，重返人间时被迫寄身于一副女子之身。但她所言真是句句属实？"
 nick_thai_to: "太祖"
 nick_thai_to_desc: "[Glossary('太祖','podgloss.thai-to')]的庙号是[CHARACTER.GetHerHim]凭借其作为获得的，即使[CHARACTER.GetSheHe]从未登上过皇位。"
 nick_princess_of_precious_leaves_and_branches: "珍枝贵叶公主"
 nick_princess_of_precious_leaves_and_branches_desc: "她被作为诱饵分散敌人的注意力，发挥了自己的作用，助力皇帝扭转乾坤。而她付出的代价却是一切。"
 nick_duc_thanh_hung_dao: "德圣兴道"
 nick_duc_thanh_hung_dao_desc: "在[Glossary('陈朝庙','podgloss.tran-trieu')]中被奉为神祇，这位传奇将军的灵至今仍守护着大越疆土，抵御入侵者。"
 nick_father_of_dai_viet: "大越国父"
 nick_father_of_dai_viet_desc: "大越的首位史官在奠定大越自主与独立的历史地位上扮演了关键角色，使其得以与北方邻邦中国比肩。"
 nick_ca_doc_duoc: "洋金花"
 nick_ca_doc_duoc_desc: "花中最艳者往往最具毒性，而[Glossary(洋金花','podgloss.man_da_la')]亦不例外。"
 nick_ngoc_thien_lien: "玉井莲"
 nick_ngoc_thien_lien_desc: "玉井中的莲花虽身形矮小，却有着卓越的才学与外交手腕。"
 nick_daring_bandit: "胆大强盗"
 nick_daring_bandit_desc: "胆大强盗行踪如风，从一场劫掠奔赴另一场，不仅劫财，还偷走凡人与贵族们的心。"
 nick_mwei_manet: "梅玛内"
 nick_mwei_manet_desc: "鲁比小姐不惜一切代价攀登社会阶梯，凭借她的魅力——传闻中更借助了巫术，将一位叛逆王子牢牢掌控于指尖。"
 nick_poet_general: "诗人将军"
 nick_poet_general_desc: "比起辞章，诗人将军更精于统筹军务，他誓守阵地，直到最后一名战士与挚友的倒下。"
 nick_maha_devi: "摩诃提毗"
 nick_maha_devi_desc: "大天女筹划了一场历时十载的弑君风暴，终得登临王座。"
 nick_first_chua: "首主"
 nick_first_chua_desc: "首[Glossary('主', 'podgloss.chua' )]暗中策划，排除异己，稳固宗族于王座之后，暗中操控皇权。"
 nick_binnya_thau: "老女王"
 nick_binnya_thau_desc: "[Glossary('频耶陀', 'podgloss.binnya_thau')]在兄弟阋墙的战争中幸存，最终成为了僧王，开创了勃固的和平时期，随后归隐尘世。"
 nick_old_general: "老将"
 nick_old_general_desc: "尽管年事已高，但凭借着在战场厮杀与阿瓦宫廷权谋中积累的丰富阅历，这位老将依旧是那动荡政治风云中的一座不倒丰碑。"
 nick_wine_maker: "酿酒师"
 nick_wine_maker_desc: "这位角色是加利西亚美酒的鉴赏家，怀揣对佳酿的热爱踏上冒险之旅。他与相识之人共享美酒之趣，因此引发了一连串惊心动魄的际遇。"
 nick_mistress_lychee_garden: "荔枝园中的夫人"
 nick_mistress_lychee_garden_desc: "荔枝园是大越最杰出学者的栖居之所。正是在此地，那位夫人以魅力俘获了皇帝的心，而皇帝则在园中暴毙。"
 nick_screeching_onyx_dragon_desc: "当一位大师的影响力渐渐消退，其门下终将迎来抉择命运的时刻。无论前路如何，都应昂首前行，不负初心。"
 nick_ghost_killer: "斩鬼者"
 nick_ghost_killer_desc: "蒂特夸从不信任与死亡为伍之人——不过信任归信任，味道好不好可另当别论。"
 nick_tyrant_stars: "诸星暴君"
 nick_tyrant_stars_desc: "若[Glossary('魔皇','podgloss.demonemperor')]必将登临九天，那还有谁能配得上与之并肩的魔后？"
 nick_sword_tyranny_bane: "弑暴之剑"
 nick_sword_tyranny_bane_desc: "当宫古的刀锋出鞘，不是她倒下，便是暴君授首，绝无他途。"
 nick_the_seventh_son: "第七子"
 nick_the_seventh_son_desc: "他早已超越其余六人，然而皇座是否终将属于他？"
 nick_sword_great_clan: "宗家大族之剑"
 nick_sword_great_clan_desc: "看来即便是群魔之中，也未必全无荣耀可言。"
 nick_dagger_great_clan: "宗家大族之匕"
 nick_dagger_great_clan_desc: "复仇往往如黑暗中的匕首般简单而致命。"
 nick_sage_great_clan: "宗家大族贤者"
 nick_sage_great_clan_desc: "狂暴的怪物真的比智者更加可怕吗？"
 nick_the_shark_eater: "噬鲨者"
 nick_the_shark_eater_desc: "还真是角色大反转。"
 nick_lord_mountains: "群山之主"
 nick_lord_mountains_desc: "一位不情愿的领主或许会在守护她所收养的子民时展现真我。"
 nick_the_white_lady_indah: "白夫人"
 nick_the_white_lady_indah_desc: "一个鬼魂，不完全属于东方世界，也不完全属于西方世界。"
 nick_impulsive_scourge: "冲动天罚"
 nick_impulsive_scourge_desc: "在敌人的地盘上大声喧哗、鲁莽行事并非总是明智之举。"
 nick_seneschal_blood: "血之总管"
 nick_seneschal_blood_desc: "统治夜晚不仅仅是阴谋和恐吓。"
 nick_esotericist: "秘术士"
 nick_prodigal_student: "浪子学徒"
 nick_damnation_seer: "诅咒先知"
 nick_smog_prophet: "雾霾先知"
 nick_pale_phantom: "苍白幻影"
 nick_whispered_dagger: "低语匕首"
 nick_shadowed_flower: "暗影之花"
 nick_ox_monk: "牛僧"
 nick_serpent_monk: "蛇僧"
 nick_smiling_goblin: "笑面鬼"
 nick_the_rumormonger: "流言贩子"
 nick_nightmare_slayer: "梦魇杀手"
 nick_the_reed_stalker: "芦苇潜行者"
 nick_the_gold_gnawer: "噬金者"
 nick_the_farswimmer: "远游者"
 nick_the_sandfish: "沙鱼"
 nick_keeper_citadel: "影堡守护者"
 nick_the_quiet_vestige: "寂静残迹"
 nick_the_pale_penangallan: "苍白之庞南加兰"
 nick_grasping_dragon: "攫龙"
 nick_hellbringer: "地狱使者"
 nick_hellbringer_desc: "强茹为他亲自追猎的[akuma|E]带来地狱。未来，虽然这个绰号会保留，但其含义将变得更加黑暗。"
 nick_afterbirth_slaughter: "屠戮的余孽"
 nick_afterbirth_slaughter_desc: "任何将[Glossary('庞南加兰','podgloss.penangallan')]半吸血鬼误认为不如其[Glossary('庞南加兰','podgloss.penangallan')]母亲凶猛的人，都将迅速而血腥地认识到自己的错误。"
 nick_devorer_shade_born: "噬影者"
 nick_devorer_shade_born_desc: "弱肉相残，终为强者所噬"
 nick_light_false_promises: "虚妄之光"
 nick_light_false_promises_desc: "追随此道只会误入歧途"
 nick_gremlin_gold: "黄金劣魔"
 nick_gremlin_gold_desc: "更多，更多，更多！"
 nick_mother_monsters: "万怪之母"
 nick_mother_monsters_desc: "没有什么比母爱更纯洁，对吗？"
 nick_mommy_monster: "母魇"
 nick_mommy_monster_desc: "普特拉对婆罗洲清洗的激烈反抗，将使黄金皇朝世代男嗣堕入厄运"
 nick_king_ashes: "灰烬之王"
 nick_king_ashes_desc: "当一切都化为灰烬时，他将与谁战斗？"
 nick_craven_despoiler: "怯懦掠夺者"
 nick_craven_despoiler_desc: "有些人至死不变，只会愈演愈烈"
 nick_gaping_maw: "无底颚"
 nick_gaping_maw_desc: "永无饱足之日"
 nick_protector_red_light: "红灯庇护者"
 nick_protector_red_light_desc: "当守护者怀揣更可怕的意图时，希望何在？"
 nick_laughing_demon: "笑面鬼"
 nick_laughing_demon_desc: "终局之时，它将是最后发笑之人"
 nick_marble_resolve: "决意之石"
 nick_marble_resolve_desc: "此间尽是癫狂。有时需以雷霆手段拨乱反正"
 nick_ice_dragon: "冰龙"
 nick_ice_dragon_desc: "生死战场，战士女王始终持斧以待"
 nick_devil_rose: "绞魔蔷薇"
 nick_devil_rose_desc: "娇花遭弃，藤蔓必将以罪血为养"
 nick_millipede: "千足虫"
 nick_millipede_desc: "昔日，他们谈论着一只千足虫，用千条腿爬行，注视着每一个人。"
 nick_brilliant_viper: "璀璨毒蛇"
 nick_brilliant_viper_desc: "最艳丽的色彩往往藏最致命的毒液"
 nick_the_warrior_courtier: "武士廷臣"
 nick_the_warrior_courtier_desc: "鲜有老祖能容窃贼。这正是杰尊坚称自己绝非窃贼的缘由"
 nick_the_healing_courtier: "医者廷臣"
 nick_the_healing_courtier_desc: "扬瓦不过一介医师，对吧？他总归是出于善意？"
 nick_the_vermillion_courtier: "朱砂廷臣"
 nick_the_vermillion_courtier_desc: "行踪所至皆是谜，低吟着无人知晓的韵律"
 nick_heaven_hell_general: "天地将军"
 nick_heaven_hell_general_desc: "分久必合，合久必分。马海兰深信黑夜亦当如是"
 nick_spiked_chain_warlord: "棘链霸主"
 nick_spiked_chain_warlord_desc: "千个故事，千个谎言。而这一切都为了她的城市，她的家，一个不容他人染指的地方。"
 nick_scatterer_winds: "散风者"
 nick_scatterer_winds_desc: "即使付出生命，严祥也擅长杀死掠夺者。即使在死后，他也找到了很多敌人来施展他的技能。"
 nick_demon_bull: "魔牛"
 nick_demon_bull_desc: "泰伟岸如魔，身形魁梧，气势非凡。脚步所至之处，众人皆侧耳听命。"
 nick_alluring_devil: "魅惑恶魔"
 nick_alluring_devil_desc: "被赋予令人难以置信的诱人美貌和美妙嗓音，很少有人能意识到老虎的牙齿已经咬入他们的喉咙，直到为时已晚。"
 nick_serpent_sovereign: "蛇君"
 nick_serpent_sovereign_desc: "被群蛇抛弃的安派，终将寻得新途，哪怕为此血流成河。"
 nick_dragon_crushing: "碎龙巨蟒"
 nick_dragon_crushing_desc: "漂泊于无光世界的维赛，追逐着仅存的微芒，纵使与他共堕深渊。"
 nick_charcoal_viper: "玄墨蝮蛇"
 nick_charcoal_viper_desc: "草药与毒物，治愈与伤害仅一线之隔……在边界起舞时，方能感受那澎湃的力量激荡。"
 nick_financier_sorrows: "悲怆金融家"
 nick_financier_sorrows_desc: "他只需轻调账目，便能摧毁一个生命。一次拖欠的付款，就足以让人生崩塌。"
 nick_promising_cobra: "希望之眼镜蛇"
 nick_promising_cobra_desc: "自然界中，越是艳丽的生物，其毒液越是致命。而人类的危险，往往藏于言辞之间。"
 nick_radiant_falcon: "煌煌猎鹰"
 nick_radiant_falcon_desc: "世界核心的腐朽，非放纵可治，唯坚定光辉与守护生灵方能征服。"
 nick_ashen_hawk: "灰烬之鹰"
 nick_ashen_hawk_desc: "眼前尽是可能失去之物，身后皆为必须捍卫之家。纵使焚身，他们也要守护故土，即便高庭斥其为堕落。"
 nick_southern_wind_gold: "黄金南风"
 nick_southern_wind_gold_desc: "高庭倾颓之际，坐视先祖资产湮灭实属浪费，而吴黎山绝不会容许此事发生。"
 nick_roots_amber: "缠金之根"
 nick_roots_amber_desc: "狂风肆虐时，深根固守大地。正如静怡以坚韧维系同伴，共抗风暴。"
 nick_golden_blizzard: "金色暴雪"
 nick_golden_blizzard_desc: "战争既是杀戮，亦是金融博弈。在筹备军费方面，鲜有人能出薛之右。"
 nick_golden_godfather: "黄金教父"
 nick_golden_godfather_desc: "连作为[Glossary('心法','podgloss.dharma')]的虔修者，如同一棵硕果累累的树，其庞大的子嗣军团成为亡者信使的绝佳利器。"
 nick_golden_bookkeeper: "黄金簿记员"
 nick_golden_bookkeeper_desc: "若要转运极度危险的珍贵典籍，没有人比冷面如石的建宏更可靠。"
 nick_guardian_quills: "墨羽守卫"
 nick_guardian_quills_desc: "当未知袭击者盯上文士时，最柔弱的面容往往最致命。"
 nick_tortoise_scribe: "灵龟书吏"
 nick_tortoise_scribe_desc: "怀摒弃俗世烦忧，全心投入浩瀚典籍的编纂。"
 nick_phoenix_scribe: "凤凰录官"
 nick_phoenix_scribe_desc: "千百惊恐诘问，无数异端记载。有时这些文字，终归石沉大海。"
 nick_tiger_scribe: "猛虎文牍"
 nick_tiger_scribe_desc: "以文书之职解析永恒之战，足以摧垮常人意志。而飞山却如垂柳般坚韧不移。"
 nick_dragon_scribe: "龙纹史官"
 nick_dragon_scribe_desc: "众人认为纯子的忧虑毫无根据，但她深知：黑暗中有三只眼睛窥视，若不加防范，众生皆危"
 nick_shield_empire: "帝国之盾"
 nick_shield_empire_desc: "黄帝皇朝何须忧惧？卫安藏永驻防线，固若金汤。"
 nick_riderbreaker: "裂骑者"
 nick_riderbreaker_desc: "传说罡风可破万魔。大安将亲自示范如何令其溃散。"
 nick_champion_hebei: "河北平原之冠"
 nick_champion_hebei_desc: "玛黛芮久居草原。新征服者终将过客，而她永恒屹立。"
 nick_wardern_black_gates: "玄关镇守"
 nick_wardern_black_gates_desc: "北方凶兆频现时，一人奉主君之命立于关前，静候来敌。"
 nick_the_courier: "驿使"
 nick_the_courier_desc: "维系黄庭诸祖通讯需顶尖信差，而穆塔乌塔正是此中翘楚。"
 nick_the_ogre: "食人魔"
 nick_the_ogre_desc: "传说麻颇曾一口吞下一个人和一匹马。当然，这是谣言。其实他只吃了那匹马。"
 nick_whisper_winds: "风语者"
 nick_whisper_winds_desc: "乱世之中，太多人死于箭雨。[Glossary('安答','podgloss.anda')]部族难辞其咎……"
 nick_life_sage: "生命圣贤"
 nick_life_sage_desc: "精华流转于万物，而霞在万鬼中对心法的掌握已臻化境。"
 nick_the_gourmand: "美食家"
 nick_the_gourmand_desc: "与他共餐，如同啜饮神圣的终末，却仍渴望更多。"
 nick_unbound_shikome: "无缚泉津"
 nick_unbound_shikome_desc: "幸雄憎恨[Glossary('艾玛·欧','podgloss.emmao')]在她体内种下的祸种。她立志成为无与伦比的刺客，以期有朝一日能弑杀那夜之帝王。"
 nick_gaunt_lieutenant: "枯骨副官"
 nick_gaunt_lieutenant_desc: "向洛凡是[Glossary('斗姆','podgloss.toumu')]阳刚气质中的阴郁投影，这位铁腕女皇麾下的无情副官。"
 nick_the_eternal_mullah: "永恒穆拉"
 nick_the_eternal_mullah_desc: "对某些人来说，永生可能太长了。"
 nick_first_mullah: "第一位穆拉"
 nick_first_mullah_desc: "苏莱曼很久以前就看到该隐之子一族在先知脚下的救赎。现在没有什么能让他偏离这条道路。"
 nick_shrine_maiden_desc: "遗忘女神的最后一位女祭司，亦是最后一位为她哀悼之人。"
 nick_gatekeeper_desc: "任何人不得通行……除非获准。"
 nick_fire_mantled: "披火者"
 nick_fire_mantled_desc: "让那些胆敢威胁索琳娜伟业的人来吧，他们终将成为她辉煌之火中的燃料。"
 nick_sage_light: "光明贤者"
 nick_sage_light_desc: "救赎之光或许刺目，但极少让无忌偏离他的道路。"
 nick_sage_snow: "雪之贤者"
 nick_sage_snow_desc: "寒冬总是艰难时节，但必须竭力引导年轻一代度过他们的漫漫长夜。"
 nick_sage_embers: "余烬贤者"
 nick_sage_embers_desc: "世界已沦为暴虐与杀戮的燎原之火。弘坚希望教导世人，即便是灰烬也能滋养未来的世界。"
 nick_sage_reeds: "苇之贤者"
 nick_sage_reeds_desc: "人性孕育的花园可以硕果累累，而作为贤者之一的任远，必将确保自己的种子生生不息。"
 nick_sage_storms: "风暴贤者"
 nick_sage_storms_desc: "鲜少有人会怀疑鲜卑人位列五方贤者，更少人知晓她才是他们的中流砥柱。"
 nick_emerald_savant: "翡翠学者"
 nick_emerald_savant_desc: "拜尔家族以他们做为魔法使用者的技艺闻名于世，而在凌驾他们之上的便是他们专属的死灵术士。"
 nick_emerald_prophet: "翡翠先知"
 nick_emerald_prophet_desc: "赫玛瓦蒂虽是家族中的怪人，但她在家族内的角色却是举足轻重的。"
 nick_ruby_ghost: "赤红幽魂"
 nick_ruby_ghost_desc: "群和他的姐姐一样，看起来像是从噩梦中走出的幽影。对他而言，这种印象或许并非空穴来风。"
 nick_the_reubbelite_ghost: "红宝石幽魂"
 nick_the_reubbelite_ghost_desc: "幽雾，和她的弟弟一样，看起来像是噩梦中的幽灵。对她而言，这种印象或许并非空穴来风。"
 nick_goddess_state: "执掌国运的女神"
 nick_goddess_state_desc: "控制宦官阶层，就等于掌握了皇帝权力的钥匙。至少，在这个衰落的时代之前是如此。"
 nick_key_empress: "皇后的钥匙"
 nick_key_empress_desc: "作为侍奉世界统治者妻子的影子，元亨听遍了凡人宫廷中的每一句低语，并做出相应的反应。"
 nick_soft_faced: "柔面"
 nick_soft_faced_desc: "纪如曾赢得一位帝王的心。死后，他一直在试图重建类似的东西。"
 nick_staffless_martial: "无杖武者"
 nick_staffless_martial_desc: "作为一名宦官，安期却异常致命，传闻他在成为宦官之前曾是一名僧侣。"
 nick_frustrated_guard: "失意护卫"
 nick_frustrated_guard_desc: "让能在晚年才成为宦官，这件事他一直未能释怀，倒也并不令人意外。"
 nick_devil_treasurer: "魔鬼司库"
 nick_devil_treasurer_desc: "要支撑整个夜世界的运转，必须精于理财。而很少有人能像新甫那样冷酷无情。"
 nick_silver_keeper: "银锁守护者"
 nick_silver_keeper_desc: "对于像银锁这样富有的[Glossary('屋室','podgloss.wu')]，必须妥善看管钱财。其怀贞热切地承担了这一职"
 nick_golden_sword: "金剑"
 nick_golden_sword_desc: "在战争中，装备更精良的一方往往能取胜。这是巨源奉行的信条。"
 nick_ogre_spider: "食人蛛"
 nick_ogre_spider_desc: "经营商业帝国是项艰苦的工作，总得有人确保竞争对手永远不会成为问题。"
 nick_minister_industries: "工部侍郎"
 nick_minister_industries_desc: "投资是银锁资产组合中的重要部分，楚君负责管理这些投资。"
 nick_songbird_broken: "碎玻璃中的歌鸟"
 nick_songbird_broken_desc: "认可可能是一种极其有毒的瘾。英梅不会再强求它，她会靠实力赢得它。"
 nick_tiger_bandit: "虎匪"
 nick_tiger_bandit_desc: "一名凶悍的掠夺者，无辜者的杀手。如今，他是一名义警，吞噬邪恶。"
 nick_critic_blood_flower: "血花批评家"
 nick_critic_blood_flower_desc: "要批评一种愚蠢，就必须理解它。正因为如此，[Glossary('庞南加兰','podgloss.penangallan')]憎恨惠通是有原因的。"
 nick_penitent_ox: "忏悔之牛"
 nick_penitent_ox_desc: "有些罪孽不可饶恕。他接受这一点，并努力变得更好，即使明知永远无法弥补。"
 nick_silken_bear: "丝绒熊"
 nick_silken_bear_desc: "初见本利者，只觉他是个散发喜悦的壮汉。但知其过往者，闻其名便不寒而栗。"
 nick_prophet_mahavidya: "摩诃毗陀耶先知"
 nick_prophet_mahavidya_desc: "肖达希的同辈竟敢贬低摩诃女神赐予他们的救赎，声称这份神性本质本就是他们与生俱来的。她绝不会容忍这种亵渎。"
 nick_storm_crowned: "风暴加冕者"
 nick_storm_crowned_desc: "一位背离师道的战争学者，却是抵御异端与灾祸的最后防线。"
 nick_gold_crowned: "金冠者"
 nick_gold_crowned_desc: "对金冠者这般强者，鲜有人知他真正的才能在于治理。"
 nick_paper_crowned: "纸冠者"
 nick_paper_crowned_desc: "中国自古是创新与智慧之地，学者兄妹在此寻求救赎的永恒源泉。"
 nick_bonfire_crowned: "篝火冠者"
 nick_bonfire_crowned_desc: "怒火炽烈足以焚尽新学徒，红发陈兄令人畏惧。但他的烈焰会否反噬自身？"
 nick_cloud_crowned: "云冠者"
 nick_cloud_crowned_desc: "当其他兄妹沉溺凡尘琐事时，勇向往九霄云外。她能飞多高？"
 nick_rainbow_west: "西方虹"
 nick_rainbow_west_desc: "笑面虹的完美形态在西方崛起，但血云将至，众人惶惶。"
 nick_emerald_queen: "翡翠女王"
 nick_emerald_queen_desc: "与其在天堂为臣，不如在人间称王。"
 nick_young_rainbow: "幼虹"
 nick_young_rainbow_desc: "渺小低调，却终将成长至完美形态。"
 nick_self_serving_god: "自利神子"
 nick_self_serving_god_desc: "众人称你为神，你又何必反驳？"
 nick_queen_of_moths: "飞蛾女王"
 nick_queen_of_moths_desc: "虫群可噬巨兽，尤布达尔以此喻人伐暴君，并躬行其道。"
 nick_wasp_king: "黄蜂王"
 nick_wasp_king_desc: "每场成功的革命背后，总有一位精通操控之术的智者。蒙巴萨的吸血鬼有黄蜂之主守护。"
 nick_scarab_prince: "圣甲虫王子"
 nick_scarab_prince_desc: "虽有人贬低其血统，但萨加达的举止气度无可否认地彰显着王室风范。"
 nick_termite_merchant: "白蚁商人"
 nick_termite_merchant_desc: "富有的赞助者能振兴凡人城市。若钱财来路干净，亡者亦可繁荣一方。"
 nick_ant_general: "蚂蚁将军"
 nick_ant_general_desc: "暗夜世界危机四伏，铁域需以铁壁抵御。统领他们的将军证明，蚁群亦可撼巨兽。"
 nick_locust_whisperer: "蝗语者"
 nick_locust_whisperer_desc: "调和多元宫廷的利益如同走钢丝。法拉吉别无选择，唯有精于此道。"
 nick_dragonfly_mystic: "蜻蜓秘士"
 nick_dragonfly_mystic_desc: "循先贤之路常伴试炼与迷茫。法拉吉在此指引求道之人。"
 nick_mantis_warrior: "螳螂武士"
 nick_mantis_warrior_desc: "对于一个如此重视繁荣的世系，人们难免疑惑他们为何会接纳一名海盗。但阿莎坚持认为——她确实值得。"
 nick_skullcracker_sage: "碎颅贤者"
 nick_skullcracker_sage_desc: "许多人都能领悟萨米拉教诲中的智慧，但她从不介意用拳头让他们刻骨铭心。"
 nick_slayer_of_lies: "谎言斩杀者"
 nick_slayer_of_lies_desc: "内弗鲁塞赫麦特所谓的\"家人\"夺走了她的尊长。她绝不会允许他们再次摧毁任何她珍视之物。"
 nick_hand_of_iron: "铁腕"
 nick_hand_of_iron_desc: "领地需要守护者。因此双王议会始终在寻觅他们的铁腕之手。"
 nick_purveyor_of_delights: "欢愉使者"
 nick_purveyor_of_delights_desc: "作为贸易之都，蒙巴萨蕴藏着无数奇珍。埃罗塔通奇乐于一一验明真伪。"
 nick_junior_storyteller: "见习传颂者"
 nick_junior_storyteller_desc: "作为贸易之都，蒙巴萨有着诸多奇观。埃罗塔通奇乐于，验看。"
 nick_runaway: "逃亡者"
 nick_runaway_desc: "尊陀急于把沙瓦塔变成怪物。沙瓦塔则自行了断"
 nick_slayer_of_beasts: "野兽屠戮者"
 nick_slayer_of_beasts_desc: "萨德·达瓦收藏的狮鬣毛皮硕大异常，对此他只是神秘一笑。"
 nick_savant_of_whispers: "低语通晓者"
 nick_savant_of_whispers_desc: "许多人会密谋对抗铁域的事业。但那些窃窃私语者往往活不长久。"
 nick_underworld_shadow: "幽影行者"
 nick_underworld_shadow_desc: "繁华如蒙巴萨，总有些事物湮没无闻，任其遗失岂不可惜。"
 nick_shunned_ghostwalker: "遭忌的渡魂者"
 nick_shunned_ghostwalker_desc: "许多莱本会容忍其城市中存在亡灵师。奇迪玛非常乐意遵守她目前保持独处的约定。"
 nick_purger_of_invaders: "入侵者净化者"
 nick_purger_of_invaders_desc: "几支睿魔尔探险队曾试图寻找蒙巴萨。克达夫确保了无人生还。"
 nick_hermit: "隐士"
 nick_hermit_desc: "卡考是蒙巴萨的一个异类，拥有迅捷术的能力。至少，这座城市尊重他们的隐私。"
 nick_tithe_drawer: "贡赋征收官"
 nick_tithe_drawer_desc: "人们理应尊重拥有血律的领地亲王。恩沃基克当然很乐意收取提供这种服务的补偿。"
 nick_mask_made_man: "假面之人"
 nick_mask_made_man_desc: "当一个人扮演某个角色太久，他是否会成为那个角色？"
 nick_ebony_envoy: "乌木使者"
 nick_ebony_envoy_desc: "随着伊斯兰教在非洲传播，阿什拉派对此地渐生兴趣。法德瓦正在观察本地血族能否皈依先知之道。"
 nick_hand_of_hidden_trade: "暗贸之手"
 nick_hand_of_hidden_trade_desc: "真加竭力在蒙巴萨传播赛特信仰，苏泰克内杰迈特是她构建地下王国的左膀右臂。"
 nick_snake_harlot: "蛇蝎妖姬"
 nick_snake_harlot_desc: "赛特的教义在毕玛生根，内弗鲁苏泰赫渴望展示其中的解放与荣光。"
 nick_snake_brute: "毒蛇暴徒"
 nick_snake_brute_desc: "赛特的教义在毕玛生根，苏泰克霍特普乐于让抗拒者自食其果。"
 nick_serpents_relay: "灵蛇信使"
 nick_serpents_relay_desc: "真加远赴蒙巴萨时，仍欠氏族数笔旧债。涅菲尔塔丽受托追讨，同时检验毕玛的潜力。"
 nick_volcano_rage: "怒焰火山"
 nick_volcano_rage_desc: "信仰需要守护者才能扎根，佛母相首位门徒正是这面血染的盾牌。"
 nick_redeemed_warlord: "救赎的军阀"
 nick_redeemed_warlord_desc: "野心与残暴曾导致他的堕落，却可能正是玄武皇朝当下存续所需之物。"
 nick_tracker_tortoise: "玄武追踪者"
 nick_tracker_tortoise_desc: "萨格志的追踪术曾招致杀身之祸，如今却成为复仇的利器。"
 nick_escape_artist: "脱逃大师"
 nick_escape_artist_desc: "刺链地狱唯一的逃脱者是个安静害羞的男人，但他是银刃铁骑事业忠诚的朋友。"
 nick_furious_vanguard: "狂怒先锋"
 nick_furious_vanguard_desc: "[Glossary('多科尔汗','podgloss.dokhorkhan')]只要屹立不倒就有存在价值，至于之后吗......"
 nick_steppe_teacher: "草原导师"
 nick_steppe_teacher_desc: "明安虽已成为游骑反抗军，却始终与她的典籍形影不离。"
 nick_drifting_assistant: "漂泊助手"
 nick_drifting_assistant_desc: "当熟悉的故土分崩离析，你该何去何从？"
 nick_divine_conman: "神诳者"
 nick_divine_conman_desc: "史上最宏大的骗局即将拉开帷幕！"
 nick_third_eyed_heretic_desc: "她的第三只眼能窥见救赎之路。至少她是这么说的。"
 nick_religious_scholar_desc: "毒蛇引导她的手，磨砺她的心智。"
 nick_egyptologist_desc: "马里奥特对埃及的狂热，点燃了他对知识的贪婪。"
 nick_tester_wanting_desc: "他最大的试炼是自己的灵魂，而至今，他屡战屡败。"
 nick_the_archangel_desc: "安德鲁为异端，即便他的信仰已支离破碎。"
 nick_self_proclaimed_archbishop_desc: "从未有主教为阿德里安加冕，除了镜中倒影里的那位。"
 nick_aspiring_baron_desc: "他梦想着男爵领、大教堂，与跪拜的众生。"
 nick_spiteful_baron_desc: "菲利普缔造的遗产尽是残忍，却称之为优雅。"
 nick_quiet_beauty_desc: "卡利达的沉静，是亡生黑暗中的一抹柔光。"
 nick_thorn_on_their_side_desc: "死神已标记她，但她倔强不死，狩猎永无止境。"
 nick_upstart_baron_desc: "传奇嫌他太年轻，智慧嫌他太喧嚷。可他的匕首早已抵住太阳神的脊梁。"
 nick_the_compulsive_agitator_desc: "唯一比他嘴巴更快的，是他逃跑的速度。"
 nick_weak_outsider_desc: "怯懦不足以领导，怨毒不甘于追随，愤怒不允许消逝。"
 nick_seething_vassal_desc: "爱德华兹谦卑侍奉，目光却始终觊觎王座。"
 nick_ventrue_vanguard_desc: "在这片狂野诸神与古老血脉的土地上，他带来秩序冰冷的铁腕——无论他们是否想要。"
 nick_austere_seneschal_desc: "她不求王座，甘居其侧。"
 nick_the_weak_baron_desc: "他最大的才能是生存，尽管不配拥有太阳神之血。"
 nick_ardent_student_desc: "多米尼克的信仰淬炼于思考而非教条，因而更加炽烈。"
 nick_looming_threat_desc: "穆罕默德低语着，耐心等待伊比利亚分崩离析。"
 nick_shadowy_whisperer_desc: "每一声温柔低语之下，都藏着万劫不复。"
 nick_ireland_renewal_desc: "詹姆斯固执地战斗，不为黄金或荣耀，只为爱尔兰的灵魂。"
 nick_firebrand_of_wales_desc: "里斯因使命燃烧，烟尘却欲遮蔽太阳。"
 nick_the_siren_desc: "当心塞壬的歌声。"
 nick_foreign_envoy_desc: "阿米亥被放逐于氏族核心之外，孤独前行，誓要在无人认可之地开辟疆土。"
 nick_le_fier_desc: "诺曼钢铁、布鲁赫骄傲、征服者之血，亚伦格林将在君王骸骨上刻写自己的传奇。"
 nick_devil_of_armenia_desc: "那双冷眼后藏着诡计者的心智。当心你的后背，和灵魂。"
 nick_devil_of_moorlands_desc: "森林的眷属，居民的噩梦。"
 nick_queen_of_sul_desc: "他是枯萎圣林最后的君主，背负无人尊崇的头衔与被遗忘的神祇。"
 nick_rash_normand_desc: "他不是愚人，便是未来的传奇，或许二者皆是。"
 nick_champion_popolo_desc: "勇敢到鲁莽，傲慢入骨，却让所有倾听者为之倾倒。"
 nick_penitent_crusader_desc: "曾是神圣怒火的利剑，如今化作谦卑忏悔的坚盾。"
 nick_the_boogeyman_desc: "恐惧有许多面孔，而他的面孔金光熠熠，冷酷无情。"
 nick_instrument_of_vengeance_desc: "黑暗之母从不宽恕或遗忘，莱拉便是明证。"
 nick_harpy_battlefield_desc: "奥克西塔尼亚不再哭泣，只要她的鹰身女妖仍在呼吸与嗜血。"
 nick_stalwart_promethean_desc: "安东尼怀抱着迦太基的烈火之魂，意志坚如磐石。"
 nick_perfected_heir_desc: "马哈茂德忠诚而卓越，是阿什拉派烈焰与怒火的继承者。"
 nick_the_oddity_desc: "伦巴第人在英格兰，狂热者中的商人，却总能成为不可或缺的存在。"
 nick_sharpened_knife_desc: "她是哈基姆意志的化身，所有敌人都将深刻感受她信仰的锋芒。"
 nick_bloody_woodsman_desc: "切斯特·贾尔斯如荒野森林般冷酷无情。"
 nick_devious_planner_desc: "他的影响力无形却无处不在，每一条线索都指向唯一且必然的结局。"
 nick_the_lovestruck_desc: "杜尔西斯在责任与欲望的边界游走。"
 nick_god_gift_desc: "只要问他，他就会告诉你，他出生那天，诸天都因喜悦而落泪。"
 nick_comptempuous_powermonger_desc: "只要问他，他就会告诉你，他出生那天，诸天都因喜悦而落泪。"
 nick_king_of_kings_desc: "万冠皆俯首于一尊。"
 nick_pater_patriae_desc: "元老院议政，军团效命，寰宇倾耳。"
 nick_king_of_aesir_desc: "渡鸦群聚，旧神展颜，斯堪的纳维亚屹立不倒，直面基督洪流。"
 nick_voice_of_tremere_desc: "军督领化为尘埃，萨洛比遭尽唾弃，而金字塔坚不可摧"
 nick_seeker_of_seekers_desc: "蛹壳已破，更胜凡物者正崭露头角。"
 nick_lord_of_scions_desc: "古老血脉与新生子嗣皆俯首，因旧族唯此一魂之命是从。"
 nick_kupalas_favored_desc: "昔日共享之物，今唯哺育一人。"
 nick_the_great_enemy_desc: "灯火渐次熄灭，唯余永恒静默。"
 nick_warden_of_baali_desc: "沉睡者犹在梦中，却永无醒时——只要此身尚存。"
 nick_loyal_outsider: "忠义局外人"
 nick_loyal_outsider_desc: "纵有流言与侧目，图里尔仍愿为[Glossary('安答','podgloss.anda')]燃尽全部力量。"
 nick_seer_tengri: "腾格里之眼"
 nick_seer_tengri_desc: "库楚古登静候腾格里降下启示之兆，盼其拯救部族。"
 nick_steppe_aristocrat: "草原贵胄"
 nick_steppe_aristocrat_desc: "纵使草原苍穹无垠，有些事物亘古不变。"
 nick_unknowing_remainder: "无觉的残数"
 nick_unknowing_remainder_desc: "伊巴哈的存在对戈壁怪物而言弥足珍贵，其意义远超她所想。"
 nick_thunder_gods_incarnation: "雷神化身"
 nick_thunder_gods_incarnation_desc: "雨水敲打大地，他的呼吸与雷鸣共鸣。谁敢称他为凡人？"
 nick_ink_and_flame: "墨与焰"
 nick_ink_and_flame_desc: "这位叛逆者饮酒如匪徒，布道如圣徒。"
 nick_face_revolution: "革命之面"
 nick_face_revolution_desc: "独立与力量的平衡需谨慎维持，唯有狡智与坚定意志方能兼得。"
 nick_darkwater_trader: "暗水商人"
 nick_darkwater_trader_desc: "王艺媛必须在夜世界的海洋中把握微妙的平衡，若非如此，她也不会被初拥。"
 nick_content_administrator: "内容主管"
 nick_content_administrator_desc: "做事恰到好处，既让人满意，又不构成威胁，才是长寿的秘诀。"
 nick_bloody_warlord: "血腥军阀"
 nick_bloody_warlord_desc: "若一个人唯有战争才能生存，那他就必须确保战争永不停止。"
 nick_burgeoning_legend: "崛起传奇"
 nick_burgeoning_legend_desc: "阮权曾遇见过儿时的传奇人物，而她相信自己能与之比肩。"
 nick_cherryfire: "樱火"
 nick_cherryfire_desc: "此树一旦绽放，便将以怒火永燃。"
 nick_still_water_scribe: "静水文书"
 nick_still_water_scribe_desc: "平静的水面下，沉淀着无数故事的重量。"
 nick_second_chance: "第二机会"
 nick_second_chance_desc: "王珪生前几乎登顶朝鲜，如今他不会再浪费这重生的机会。"
 nick_midnight_provocateur: "午夜煽动者"
 nick_midnight_provocateur_desc: "极尽奢华，极尽恶意。"
 nick_time_eater: "时间吞噬者"
 nick_time_eater_desc: "她已吞食了自己的凡尘过往，再无归途。"
 nick_luminous: "光辉者"
 nick_luminous_desc: "塔拉曾渴望平静，如今却必须参与神明的博弈。"
 nick_spirit_queen: "灵魄女皇"
 nick_spirit_queen_desc: "身后世界的堤道足以迷惑众多探索者，而能驾驭它们的人将成为其主宰。"
 nick_thousand_times_martyred: "千殉者"
 nick_thousand_times_martyred_desc: "成为英雄是件可怕而痛苦的事。"
 nick_smoke_crone: "烟霭老妪"
 nick_smoke_crone_desc: "当人们看见烟时，常为烈火哀叹。但更应珍视那烟霭之下隐藏的滋养。"
 nick_gold_silencer: "黄金缄默者"
 nick_gold_silencer_desc: "\"谋杀\"一词太过粗鄙……她更愿称之为\"永久静默\"。"
 nick_outcast_sage: "逐圣贤者"
 nick_outcast_sage_desc: "昔日负责处理尸骸，如今却要应对它们自行站起的诡象。更讽刺的是，像她这般卑微之人竟会被选中。"
 nick_lotus_of_prosperity: "繁荣之莲"
 nick_lotus_of_prosperity_desc: "恒河是世上最富庶之地，唯有深谙其道者方能从中获益。"
 nick_violet_coral_sovereign: "紫珊瑚君主"
 nick_violet_coral_sovereign_desc: "作为唯一领地被怪物侵占的始祖，伊萨加尼虽沦为笑柄，却仍逆势前行。"
 nick_violet_grandmaster: "紫袍宗师"
 nick_violet_grandmaster_desc: "袁奉命以天朝之名在新大陆建立朝廷，至少名义如此。"
 nick_first_divider: "初分者"
 nick_first_divider_desc: "如何窃取塑躯之术？卡利瑙认为无需为自己的杰作多费唇舌。"
 nick_foul_blood_slayer: "秽血屠戮者"
 nick_foul_blood_slayer_desc: "巨鱿獠牙再利，鲸亦无惧。正因如此，马基西格从不回避阿恩族。"
 nick_mandirigma: "曼迪里格玛"
 nick_mandirigma_desc: "以猎魔人之姿直面恐怖会摧毁多数人。而阿迪卡明知其险仍奋然挑战，更显其意志之坚。"
 nick_favored_one: "天选者"
 nick_favored_one_desc: "作为[Glossary('多科尔汗','podgloss.dokhorkhan')]的副手，蒙苏克傲慢至极，可悲的是，他确实有与之相配的骇人力量。"
 nick_fickle_devil: "无常恶鬼"
 nick_fickle_devil_desc: "还有什么比世界终结更令人兴奋？"
 nick_spiked_avocate: "刺链代言人"
 nick_spiked_avocate_desc: "[Glossary('多科尔汗','podgloss.dokhorkhan')]的胜利将是未来世代较小的灾厄。松古尔将确保他的胜利，以此拯救众生。"
 nick_broken_champion: "破碎冠军"
 nick_broken_champion_desc: "库尔德贾奎兹曾是玄武皇朝的希望，如今却成了他们溃败的预兆。"
 nick_chained_couple: "镣铐眷侣"
 nick_chained_couple_desc: "并非所有英雄传说都该以幸福收场。"
 nick_incompetent_akuma: "无能恶鬼"
 nick_incompetent_akuma_desc: "坎达是[Glossary('多科尔汗','podgloss.dokhorkhan')]麾下一个极其无用的爪牙。但这真的算是坏事吗？"
 nick_dedicated_warden: "赤诚守望者"
 nick_dedicated_warden_desc: "有时，为了守护真正的正义，你不得不移开视线。"
 nick_chained_brother: "刺链兄弟"
 nick_chained_brother_desc: "有时，属于你的地狱会追随你来到人间。"
 nick_the_eclipse: "日蚀"
 nick_the_eclipse_desc: "再神圣的存在，也抵不过足够锋利的野心。"
 nick_fire_of_the_many: "众生之火"
 nick_fire_of_the_many_desc: "没有宫殿，没有神授君权。唯有黑夜，以及选择共享它的权利。"
 nick_rose_of_the_seven_sins: "七罪蔷薇"
 nick_rose_of_the_seven_sins_desc: "罗马再度崛起。不是作为帝国，而是作为食欲。"
 nick_sculptor_of_thrones: "王座雕塑师"
 nick_sculptor_of_thrones_desc: "克拉科夫的新城堡正在崛起，它的心脏在跳动。"
 nick_la_rose_couronnee: "加冕玫瑰"
 nick_la_rose_couronnee_desc: "法兰西再度绽放，重归合法统治者的手中。"
 nick_avenging_petal: "复仇花瓣"
 nick_avenging_petal_desc: "一片花瓣凋零。两位神明流血。花园以他们的鲜血为滋养，再度盛开。"
 nick_architect_of_splendor: "辉煌缔造者"
 nick_architect_of_splendor_desc: "妥芮朵的梦想，具现为血肉之躯，并覆盖着天鹅绒。"
 nick_second_seraph: "第二天使长"
 nick_second_seraph_desc: "城市或许会焚毁，天使或许会坠落，但梦想永存。"
 nick_errant_postulant_desc: "他因知道太多关于敌人的工具，以至于永远不被完全接纳，因此在术法为引、经文为鉴的孤途上独行。"
 nick_caretaker_of_dreams: "梦境看护者"
 nick_caretaker_of_dreams_desc: "城市或许会焚毁，天使或许会坠落，但梦想永存。"
 nick_western_warden: "西方守望者"
 nick_western_warden_desc: "很少有人比一个曾被贬至底层的人更痛恨世俗体制。"
 nick_godly_shepherd: "神圣牧者"
 nick_godly_shepherd_desc: "游走于正信与异端的刀锋之上，万物终将归于那些足够耐心和精明，默默培育它们的人。"
 nick_illuminated: "受启迪者"
 nick_illuminated_desc: "萨猜是东南亚某新兴信仰的早期皈依者，然其忠诚可疑。个中因果，时间将会揭晓。"
 nick_golden_ambition: "金色野心"
 nick_golden_ambition_desc: "只有龙才能阻止提拉卡的崛起。好在这种东西根本不存在，对吧？"
 nick_striking_gobetween: "惊世斡旋"
 nick_striking_gobetween_desc: "师提亚是虎王的后裔，他确保凶猛民族和十万战士彼此友好相处。"
 nick_shrouded_diplomat: "蒙面外交官"
 nick_shrouded_diplomat_desc: "神秘的气质掩盖了阻止邪恶获胜的炽热信念。"
 nick_dragon_savior: "龙之救星"
 nick_dragon_savior_desc: "一个花哨的称号有时弊大于利。"
 nick_excitable_center: "暴躁的中心"
 nick_excitable_center_desc: "黄金屏障的中心[Glossary('屋室','podgloss.wu')]是一股无束激情的旋风。"
 nick_oracle_storms: "风暴之神谕"
 nick_oracle_storms_desc: "危险的海洋风暴给许多水手带来了死亡。沈佑缓解这种情况的能力使他变得至关重要。"
 nick_biting_sands: "蚀骨风沙的将军"
 nick_biting_sands_desc: "温和温顺也能变得强悍凶猛，如果驱使得当，即使是沙子也能剥去血肉。"
 nick_golden_keeper: "金之守护"
 nick_golden_keeper_desc: "无数威胁潜藏于‘安全’的中央宫廷之中。灵渊维持着靖西南宫廷的凝聚力"
 nick_yellow_flower: "黄花"
 nick_yellow_flower_desc: "尽管她的老师充满热情，哈亚蒂不认为这长期可行。她发现成功在那些足够大胆、能在中心把握命运的人中更有可能。"
 nick_voice_sanity: "理智之声"
 nick_voice_sanity_desc: "她周遭一片混乱。在这样的时刻，需有沉稳的心态与强大的意志才能保持理智。"
 nick_flaying_gales: "掠剥狂风"
 nick_flaying_gales_desc: "被剥夺了一切，还能剩下什么呢？小婉每天都这样问自己，而那份空虚，在她心中燃起了一团火。"
 nick_grey_glacier: "灰冰川"
 nick_grey_glacier_desc: "三山寺监管着诸多事务。唯有真正高明的智者才能理清这一切。当然，他很享受这其中的益处。"
 nick_scalpel_vengeance: "复仇手术刀"
 nick_scalpel_vengeance_desc: "人们总以为医生不会伤人，而宗敏却选择夺走能减少世间罪恶之物。"
 nick_whip_hurricane: "飓风之鞭"
 nick_whip_hurricane_desc: "任他们怎么说，螳螂门的弟子和主庭一样迷茫。玉师就擅长击溃他们。"
 nick_knife_breaker: "破刀者"
 nick_knife_breaker_desc: "她看见一个焦黑的污血之神，坐于黑色王座之上，位于西边的一座山上，周遭是一片碎刀之海。爱秦确信这就是[Glossary('魔皇','podgloss.demonemperor')]……她真的能与之抗衡吗？"
 nick_shadow_self: "黯影自我"
 nick_troubled_noro: "困扰的祝女"
 nick_troubled_noro_desc: "若奄美久对她那失踪的女祭司有什么打算，她也没说清楚，不足以让海奏安心。"
 nick_unlikely_ancestor: "不合适的老祖"
 nick_unlikely_ancestor_desc: "有时，你是唯一能担起这份工作的人，无论你可能有多不称职。"
 nick_scarlet_seas: "猩红之海的"
 nick_scarlet_seas_desc: "尽管那曾夺走她的一切，但大海再也无法将达拉压制。"
 nick_crimsom_razor: "绯红剃刀"
 nick_crimsom_razor_desc: "苏里亚尼的利刃鲜少洁净。若要击败邪恶，必有鲜血飞溅。"
 nick_golden_appetites: "金色食欲的"
 nick_golden_appetites_desc: "因禁忌口味而缔结的羁绊，或许会给整个地区招致厄运。"
 nick_ajhan: "战士"
 nick_ajhan_desc: "伴随在他挚爱的尊长身侧，赋予了他存在的意义。可若那份意义有朝一日离他而去，又将如何？"
 nick_the_angel_desc: "他总是乐于伸出援手——只是，最好别在意那些附带的条款与条件"
 nick_eastern_vanguard: "东方先锋"
 nick_eastern_vanguard_desc: "中国不会因鲁莽之举而衰亡。唯有缓慢而周密的谋略，才能为大军开辟通向胜利的道路。"
 nick_smiling_envoy: "微笑的使者"
 nick_smiling_envoy_desc: "终于有一个外来者承认了$pod_kueijin$与生俱来的优越性！当然啦，他必须不断忍受的屈辱，肯定不会带来什么坏结果……"
 nick_simmering_vanguard: "炽隐先锋"
 nick_simmering_vanguard_desc: "赛姬誓要向整个世界复仇，但眼下她会满足于先毁灭那些$pod_kueijin$。"
 nick_courtly_bandit: "宫廷盗匪"
 nick_courtly_bandit_desc: "当被抛入两个庞然大物的争斗之间时，聪明的盗贼只会顾及自己"
 nick_bjornson: "熊之子"
 nick_lady_of_the_blackwoods: "幽林女主人"
 nick_of_the_white_hands: "白手之人"
 nick_sanguine_daimyo: "血色大名"
 nick_gardener: "荆棘园丁"
 nick_green_gold: "青翠与金辉者"
 nick_green_gold_desc: "锡昊的命运或许远在高丽之外。毕竟，野心从不知疆界。"
 nick_tired_young_man: "疲惫的青年"
 nick_tired_young_man_desc: "外表永葆青春，而心中那点叛逆与希望的火光，却在光华体内早已彻底殒灭。"
 nick_ceremonial_sword: "礼祭之锋"
 nick_ceremonial_sword_desc: "池昭厌倦了被当作战利品般的武者，这份烦躁正一点点啃噬着她。鲜有人知，当无物可供咀嚼时，所显露出来的将会是什么"
 nick_azure_threads: "天青丝裳之人"
 nick_azure_threads_desc: "卜慧无论目光投向何处，都能看见盘错的权谋丝线。她渴望将一切尽数掌握。"
 nick_jade_father: "玉父"
 nick_jade_father_desc: "像英这样不可或缺的人，自然注定会长寿而繁荣——只要他的过去不追上他。"
 nick_ambitious_toppler: "野心腐鸦"
 nick_ambitious_toppler_desc: "总得有人确保皇庭在劫数来临时土崩瓦解。而在废墟尘埃之上，也总得有人登临为王"
 nick_bane_wicked: "恶孽之忌灵"
 nick_bane_wicked_desc: "[Glossary('妖邪之城','podgloss.wickedcity')]终将被一砖一瓦地拆毁，直至万籁俱寂。"
 nick_first_shikome: "首位泉津"
 nick_first_shikome_desc: "依旧无可比拟地完美至今，清子殷切地期待着她的主上终有一日能为她再造出更多的姊妹……"
 nick_soul_kakuri: "灵魂之断绝"
 nick_soul_kakuri_desc: "守护阿伊努亡魂的守墓人已偏离了他的道途。但或许即便是那位“黑暗的大名”，也仍能被一束引路的光所照亮。"
 nick_cold_fire_shikome: "寒炎泉津"
 nick_cold_fire_shikome_desc: "[Glossary('泉津','podgloss.shikome')]本是阴寒生灵，但即便在阴炁极度充盈的状态下，人们依然能看见惠子的怒火在暗暗燃烧。"
 nick_scarlet_friend: "朱雀皇朝之友"
 nick_scarlet_friend_desc: "廊开拥有悠久的记忆。朱雀皇朝在他危难之时伸出的援手，将不会轻易被遗忘。"
 nick_wise_dragon_north: "北方智龙"
 nick_wise_dragon_north_desc: "看尽凡俗王朝的风起云涌，生与死的风暴似乎永无止息。"
 nick_radiant_light: "辉光"
 nick_radiant_light_desc: "以进攻守护净土，驱逐那些过于逼近的不安之敌。[CHARACTER.GetFirstNamePossessiveNoTooltip|U]的现身，常伴随着旭日的到来。"
 nick_dinosaur_king: "末代[Select_CString(CHARACTER.IsFemale,'龙后','龙王')]"
 nick_dinosaur_king_desc: "自始至终，[CHARACTER.GetSheHe|U]皆在场。许多人相信，[CHARACTER.GetSheHe]也将见证终焉。"
 nick_destroyer_ignorance: "破除无明"
 nick_destroyer_ignorance_desc: "天之部族并不以他们的战士闻名。但在[CHARACTER.GetHerHis]他短暂的任期里，[CHARACTER.GetFirstNameNoTooltip|U]已经证明了他们不需要战士。"
 nick_lord_people: "众生之主"
 nick_lord_people_desc: "[CHARACTER.GetFirstNameNoTooltip|U]对天之部族的真理颇感兴趣——即饿殍即是诸神。然而，[CHARACTER.GetSheHe] 究竟属于哪一位，却不得而知……"
 nick_fashioner_artistry: "技艺塑造者"
 nick_fashioner_artistry_desc: "熔炉既是工业之所，也是战争之地。真正的工匠，懂得如何演奏这两种旋律。"
 nick_rakshasha_break: "未曾破碎的罗刹"
 nick_rakshasha_break_desc: "[CHARACTER.GetFirstNameNoTooltip|U] 本可以成为一位 [Select_CString(CHARACTER.IsFemale,'Empress','Emperor')]。而[CHARACTER.GetSheHe|U]敢于成为一位[Select_CString(CHARACTER.IsFemale,'Goddess','God')]"
 nick_necessary_monster: "必要的怪物"
 nick_necessary_monster_desc: "魔城之王的[Select_CString(CHARACTER.IsFemale,'Sister','Brother')]……至少这是[CHARACTER.GetSheHe]所声称的。"
 nick_little_goddess: "小[Select_CString(CHARACTER.IsFemale,'Goddess','God')]"
 nick_little_goddess_desc: "如此多的小神都渴望成就宏伟之事，而[CHARACTER.GetFirstNameNoTooltip|U]满足于守护那些一直对[CHARACTER. GetHerHim]来说重要的事物。"
 nick_priestess_aravan: "[Select_CString(CHARACTER.IsFemale,'Priestess','Priest')]的女祭司"
 nick_priestess_aravan_desc: "涅槃凤凰们誓言要守护他们的社区。尽管这与[CHARACTER.GetFirstNameNoTooltip|U]有所不同，但[CHARACTER.GetSheHe]依然同样坚定地要遵循这一誓言。"
 nick_raksha_queen: "罗刹[Select_CString(CHARACTER.IsFemale,'女王','国王')]"
 nick_raksha_queen_desc: "被轻蔑的[CHARACTER.Custom('WomanManGirlBoy')]比地狱还要可怕。[CHARACTER.GetFirstNameNoTooltip|U]正等待着合适的时机，把这一点亲手教给那个[CHARACTER.GetSheHe]曾视为父亲的男人。"
 nick_lanka_enigma: "兰卡之谜"
 nick_lanka_enigma_desc: "[CHARACTER.GetFirstNamePossessiveNoTooltip|U]的忠诚可能在魔城的命运中扮演关键角色。"
 nick_hellist_arrivist: "地狱暴发户"
 nick_hellist_arrivist_desc: "如果偷工减料也能算作一种艺术，那么[CHARACTER.GetFirstNameNoTooltip|U]就是无人能及的大师。"
 nick_boiling_reaper: "沸腾死神"
 nick_boiling_reaper_desc: "赫鲁最强的[akuma|E]是一头高大的怪物，足以配得上[CHARACTER.GetHerHis]那位可怖主人令人闻风丧胆的名声。"
 nick_feverish_zealot: "狂热狂信"
 nick_feverish_zealot_desc: "当瘟疫君主互相厮杀时，[CHARACTER.GetFirstNameNoTooltip|U]选择了[CHARACTER.GetHerHis] 的一方，以避免重蹈 [CHARACTER. GetSheHe]曾经经历的痛苦。"
 nick_despair_eater: "绝望吞噬者"
 nick_despair_eater_desc: "如果眼前毫无希望，那么粉碎对更好未来的幻想，难道不是一种仁慈吗？"
 nick_elder_leyak: "年长疟痖克"
 nick_elder_leyak_desc: "作为让达将军中的首席，[CHARACTER.GetFirstNameNoTooltip|U]是一位扭曲的[Select_CString(CHARACTER.IsFemale,'mistress','master')]，能将最轻微的感冒扩展成摧毁躯体的疾病。"
 nick_prince_leyak: "疟痖克亲王"
 nick_prince_leyak_desc: "各种折磨与恐怖都在[CHARACTER.GetFirstNameNoTooltip|U]体内滋生并盘踞。更可怕的是，[CHARACTER.GetSheHe]看起来却丝毫不显其形……"
 nick_younger_leyak: "年轻疟痖克"
 nick_younger_leyak_desc: "各种疾病都能从人体的无数孔道流出。让达将她最年轻的部下托付给了这些“更为愉快”的传播途径。"
 nick_madonna_succulent: "鲜泪之[Select_CString(CHARACTER.IsFemale,'Madonna','Procurer')]"
 nick_madonna_succulent_desc: "盐与铁之坑是整个界域中“最顶级”妓院的所在。掌管此地的[CHARACTER.Custom('WomanManGirlBoy')]，既令人畏惧，又令人渴望"
 nick_devil_fish: "魔鬼鱼"
 nick_devil_fish_desc: "地狱之海，无不畏惧珍珠母之怪。流传的传说远未能真正体现饥饿的威力。"
 nick_vanguard_phoenix: "凤凰先驱"
 nick_vanguard_phoenix_desc: "迎敌的并非士兵，而是刺客。"
 nick_scourge_fiends: "魔邪之灾"
 nick_scourge_fiends_desc: "有某种污秽扭曲的存在潜伏在阴影中，使躯体对其主人变得陌生。让这些魔物畏惧雷霆的怒吼吧。"
 nick_godeater: "噬神者"
 nick_godeater_desc: "如果他们想自欺欺人，假装自己是神，那就随他们去吧。[CHARACTER.GetFirstNameNoTooltip|U]会让他们明白，神也能像猪一样轻易被碾碎。"
 nick_khan_veil: "可汗之幕"
 nick_khan_veil_desc: "从前，延陵默默见证了一座皇朝的诞生。而如今，[CHARACTER.GetSheHe]只渴望隐匿于无名之中，享受那份宁静。"
 nick_outrun_dawn: "黎明之先"
 nick_outrun_dawn_desc: "能在白昼前疾驰的信使，对于那些需要在夜间行动的人至关重要，而[CHARACTER.GetFirstNameNoTooltip|U]已将此技艺了然于心。然而，随着环境的转变，即便是[CHARACTER.GetSheHe]也可能无法跟上脚步。"
 nick_general_rock: "将军之石"
 nick_general_rock_desc: "在生前，[CHARACTER.GetFirstNameNoTooltip|U] 嫁给了中国有史以来最伟大的将军之一；在死后，她将这种才能用于对抗地狱。然而，随着威胁的变化，[CHARACTER.GetSheHe]也可能被人算计……"
 nick_decorated_champion: "荣誉战士"
 nick_decorated_champion_desc: "在玄武皇朝的所有饿殍中，[CHARACTER.GetFirstNameNoTooltip|U]的功绩遥遥领先，鹤立鸡群。然而，如今摆在[CHARACTER.GetSheHe]面前的，是[CHARACTER.GetHerHim]曾面对过的最大威胁。"
 nick_dull_eyed: "呆滞之眼"
 nick_dull_eyed_desc: "[CHARACTER.GetFirstNamePossessiveNoTooltip|U]的白色眼睛暗示着失明，虽然它曾可能真的是如此，但也可能只是世间重负压制了眼中的光芒。"
 nick_steppe_burner: "草原焚烧者"
 nick_steppe_burner_desc: "各种亡灵都惧怕火焰。[CHARACTER.GetFirstNameNoTooltip|U]非常乐意向它们展示地狱之火的威力。"
 nick_undoubted: "无惑者"
 nick_undoubted_desc: "怀疑是行动与荣耀的敌人。与其浪费时间思考行动，不如直接去做。"
 nick_gentle_sheperd: "温柔的牧者"
 nick_gentle_sheperd_desc: "在支持玄武皇朝的牧民中，[CHARACTER.GetFirstNameNoTooltip|U]是他们的引导。然而，这位温和的守护者在面对安达的残暴时，或许并不具备足够的应对之力。"
 nick_hunters_confidant: "猎人的知己"
 nick_hunters_confidant_desc: "尽管他们犯下了无数可怖之事，悔恨的猎人仍需要一个倾诉的对象。[CHARACTER.GetFirstNameNoTooltip|U]不情愿地成为了他们倾泄秘密的对象。"
 nick_overlord_doctor: "领主御医"
 nick_overlord_doctor_desc: "曾为一名骑士的外科医生，如今因一位流浪者而获得了新的使命。[CHARACTER.GetFirstNameNoTooltip|U]渴望探索东方的全新启蒙之秘……"
 nick_sorrowless: "无忧者"
 nick_sorrowless_desc: "在生前，[CHARACTER.GetFirstNameNoTooltip|U]迷失、彷徨且困惑不已。而成为不死之身后，[CHARACTER.GetSheHe]拥有了目标、艺术，以及从[CHARACTER.GetHerHim]身上流淌而出的血液，三者齐聚，浑然一体。"
 nick_iron_fiend: "钢铁邪魔"
 nick_iron_fiend_desc: "许多追求完美的人倾向于专注于肉体与灵魂的提升，而 [CHARACTER.GetFirstNameNoTooltip|U]则开辟了更为玄奥的完美之道。"
 nick_yakshi_artisan: "夜叉工匠"
 nick_yakshi_artisan_desc: "虽然大多数西方棘秘魑拥有令人恐惧的什拉赫塔，但印度棘秘魑的夜叉同样令人畏惧。而他们中的大多数，都可追溯到 [CHARACTER.GetFirstNameNoTooltip|U]的研究成果。"
 nick_shadow_of_london_desc: "这座城市的污秽隐藏着许多东西，包括他。"
 nick_solitary_zealot_desc: "孤独的朝圣者，孤独的刽子手。"
 nick_unrelenting_scholar_desc: "他对知识的追求如同死亡般无情。"
 nick_dedicated_illuminator_desc: "他那双专注的手试图保存那些许多人眼中注定被毁的事物。"
 nick_the_plague_desc: "腐败随他们而来。"
 nick_hidden_monster_desc: "美德的面具背后隐藏着一颗黑心。"
 nick_daring_protector_desc: "天上没有比爱化为恨更狂烈的愤怒，地狱也没有比被侮辱的女子更可怕的愤怒。"
 nick_shadow_greatness: "伟大的阴影"
 nick_shadow_greatness_desc: "从他为数不多的错误中吸取教训，查古拉普夏认为有必要培养真正的继承人。[CHARACTER.GetFirstNameNoTooltip|U] 超出了所有人的预期。"
 nick_sovereign_exchange: "交替之君主"
 nick_sovereign_exchange_desc: "[CHARACTER.GetFirstNameNoTooltip|U] 出生在帝国的巅峰时代，而在夜幕下，他会资助另一个帝国进行永无休止的战争。"
 nick_confounding_diplomat: "令人困惑的外交家"
 nick_confounding_diplomat_desc: "[CHARACTER.GetSheHe] 如何生存下来对所有人都是一个谜。[CHARACTER.GetSheHe] 如此迷人，让所有与[CHARACTER.GetSheHe]交谈的人都感到困惑。"
 nick_boy_commander: "[Select_CString(CHARACTER.IsFemale,'Girl','Boy')]指挥官"
 nick_boy_commander_desc: "[CHARACTER.GetFirstNamePossessiveNoTooltip|U] 的青春美貌永远无法逃脱 [CHARACTER.GetHerHim]。[CHARACTER.GetSheHe|U] 发现，没有比这张面孔更适合隐藏 [CHARACTER.GetHerHis] 真正本性的了。"
 nick_sanctum_keeper: "圣殿守护者"
 nick_sanctum_keeper_desc: "虽然 [CHARACTER.GetHerHim] 的初拥从未是他应得的，但查古拉普夏绝不会否认 [CHARACTER.GetHerHis] 的价值。"
 nick_banpaia: "班派亚"
 nick_banpaia_desc: "别人困惑地重复给她的话，汉娜都会自豪地在心中确认。"
 nick_grasping_dragon_desc: "其声望与世俗权力，仅次于黄帝皇朝皇帝本人。\n至少在纸面上是这样。"
 nick_boar_wisdom: "智慧野猪"
 nick_boar_wisdom_desc: "固执却睿智，愤怒却克制，那罗延是矛盾的风暴，却在决心上坚不可摧。"
 nick_pembuat_raja: "造王者"
 nick_pembuat_raja_desc: "[CHARACTER.GetFirstNameNoTooltip|U]通过耐心教导，将一个狡猾的土匪提升为国王。"
 nick_nareswari: "众生女主"
 nick_nareswari_desc: "[Glossary('娜瑞斯瓦丽', 'podgloss.nareswari')]，众生女主，被预言将诞下许多国王。"
 nick_kerbau_yang_menyeberang: "渡河水牛"
 nick_kerbau_yang_menyeberang_desc: "[Glossary('渡河水牛', 'podgloss.kerbau_yang_menyeberang')]是一位出色的海军统帅和能干的外交官，直到去世一直效力于满者伯夷王国。"
 nick_mahapati: "大统领"
 nick_mahapati_desc: "马哈帕提，也即“大统领”，对满者伯夷王国的伟大英雄们的死负有责任。"
 nick_pitaloka: "皮塔洛卡"
 nick_pitaloka_desc: "皮塔洛卡宁可选择死亡，也不愿蒙受成为满者伯夷国王的普通妾侍的屈辱。"
 nick_rakryan_mapatih_jirnodhara: "拉克里安·马帕蒂赫·吉尔诺达拉"
 nick_rakryan_mapatih_jirnodhara_desc: "恢復克尔塔涅加拉对努桑塔拉的雄心的人。"
 nick_kinalakian_queen: "基纳拉克女王"
 nick_kinalakian_queen_desc: "[Glossary('基纳拉克', 'podgloss.kinalakian')]女王通过宣扬战士公主的定义，挑战了人们对统治者和女性的期望。"
 nick_the_unwavering: "坚定不移"
 nick_the_unwavering_desc: "[CHARACTER.GetFirstNameNoTooltip|U] 对自己的理念坚定不移，这使他能够接受他人可能对世界有不同的理解。"
 nick_mahaguru: "伟大的上师"
 nick_mahaguru_desc: "伟大的上师是 [CHARACTER.GetHerHis|l] 技艺的大宗师。"
 nick_sunan_ampel: "苏南·安佩尔"
 nick_sunan_ampel_desc: "受人尊敬的安佩尔，作为[Glossary('九圣', 'podgloss.wally_songo')]之一，是努桑塔拉群岛伊斯兰传播的主要来源之一。"
 nick_nyai_gede_pinatih: "仔俾那智"
 nick_nyai_gede_pinatih_desc: "格雷西克大娘子仔俾那智确立了自己作为满者伯夷贸易赞助人及贸易发展主要推动者的地位。"
 nick_bendahara_paduka_raja: "王室御前宰相"
 nick_bendahara_paduka_raja_desc: "最伟大的[Glossary('盘陀诃罗', 'podgloss.bentahara')]曾是马六甲苏丹国真正的幕后掌权者。"
 nick_bitter_queen: "痛苦女王"
 nick_bitter_queen_desc: "发誓要为被诽谤的家族复仇，[CHARACTER.GetFirstNamePossessiveNoTooltip|U] 的声名在前，无论是在战场上还是宫廷中，都令对手胆寒。"
 nick_inong_balee: "伊农·巴利"
 nick_inong_balee_desc: "一支寡妇军队的[Glossary('拉克萨马纳', 'podgloss.laksamana')]。"
 nick_the_great_ethnographer: "大民俗学家"
 nick_the_great_ethnographer_desc: "[CHARACTER.GetFirstNameNoTooltip|U] 已记录了已知世界的所有民族与他们的所在地。"
 nick_bleak_warden: "荒寂守卫"
 nick_bleak_warden_desc: " “毋惧长夜，亲爱的大人，因为有更可怖的怪物正守护着您。”"
 nick_architectural_purist: "建筑纯粹派"
 nick_architectural_purist_desc: "为何要稀释美酒？又为何要用无稽之谈冲淡威严？正如教典所示，无需强行掺入异质，亦能成就大美。"
 nick_snow_monkey: "雪猴"
 nick_snow_monkey_desc: "对于宇治这种如此注重传统的氏族，人们或许会认为这位斗士是一种耻辱。他确实是，但他也已精于摆脱一切指控。"
 nick_nights_maiden: "夜之少女"
 nick_nights_maiden_desc: "她自出生便被培养与引入，注定成为一枚棋子。然而，她寻得了更高的使命，并成为了与之平等的一员"
 nick_vengeful_swan_desc: "她曾希望复仇能取代痛苦。然而它所做的，不过是让她为一个国度唱响了天鹅绝唱。"
 nick_azure_crane: "青鹤"
 nick_azure_crane_desc: "齐昭出身于两个世界之间。游走其间，于他而言并无二致。"
 nick_ashen_seneschal: "灰烬总管"
 nick_ashen_seneschal_desc: "吝啬鬼的心也能被焐热吗？至少，他的心是。"
 nick_golden_envoy: "黄金使者"
 nick_golden_envoy_desc: "一位奉命面见巨龙的使者。小吾子归来时，却携带着足以定义其宇治的、更为深邃的智慧。"
 nick_herald_of_scorn: "轻蔑先驱"
 nick_herald_of_scorn_desc: "他们皆被死亡烙印。他们皆由玷污定义。若非她是宇宙之死母的化身，他们又是什么？"
 nick_daughter_of_fire: "火之女"
 nick_daughter_of_fire_desc: "对于畏惧火焰者，引火自焚之举在多数人眼中无异于癫狂。然而，他们需要的，不过是一点信念。"
 nick_civilizing_samurai: "开化武士"
 nick_civilizing_samurai_desc: "他曾有漫长而传奇的侍奉生涯。这为他换来的，却是地狱。他深感，此乃不公。"
 nick_purifier: "净化者"
 nick_purifier_desc: "那幽暗深处，水域患病。疏浚它们，即是净化。"
 nick_key_holder: "持钥者"
 nick_key_holder_desc: "虽与其他恶鬼一样身为奴仆，但她掌管着[Glossary('断绝','podgloss.kakuri')]中那些可悲罪人的控制权，这使她乐在其中。"
 nick_ice_fanged_huntress: "冰啮猎女"
 nick_ice_fanged_huntress_desc: "她的吻从未有过半分温度，无论生前，还是死后。"
 nick_warrior_smith: "武志锻者"
 nick_warrior_smith_desc: "眼睁睁看着自己的杰作落入他人之手，这对明来说简直是奇耻大辱。他绝不能让任何心血之作蒙尘。"
 nick_tsuchigumo_slayer: "土蜘蛛杀手"
 nick_tsuchigumo_slayer_desc: "很少有宇治族人知道她为何如此疯狂地追杀。她比任何人都清楚，为何他们都必须死。"
 nick_protector_of_peace: "和平守护者"
 nick_protector_of_peace_desc: "她犯下了滔天罪行。为了赎罪，她维护和平。不论为此要牺牲多少生命。"
 nick_rebellious_swallow: "叛逆之燕"
 nick_rebellious_swallow_desc: "尽管出身高贵，这只燕子似乎却迷恋飞向未知之地。"
 nick_spear_of_the_sun: "曜日之矛"
 nick_spear_of_the_sun_desc: "对马老祖一直是青龙皇朝的关键人物。如果如此地位者有自己的图谋，那将会是不祥恶兆。"
 nick_advocate_of_the_gods: "众神代言"
 nick_advocate_of_the_gods_desc: "天照族裔和小神之间的联络者，她扮演了无人想要的角色。"
 nick_hellwatcher: "地狱看守者"
 nick_hellwatcher_desc: "诸众面对如此危险的工作都会感到恐惧。然而，她却不由自主地被其吸引。"
 nick_sunset_necromancer: "落日亡灵术师"
 nick_sunset_necromancer_desc: "死亡一直如影随形地在其身后。如今，她试图彻底了解死亡。"
 nick_high_society_devil: "上流恶魔"
 nick_high_society_devil_desc: "一生都没能享受到自己的地位，死后的她会弥补这一切。"
 nick_cleaner: "涤秽慈者"
 nick_cleaner_desc: "诸众都像对待失而复得的母亲般爱着他——多少是因为他懂得，血肉横飞的事，最好别多问。"
 nick_rising_star_kj: "后起之秀"
 nick_rising_star_kj_desc: "莫罗伊一直渴望登上舞台。他的梦想实现得异常艰辛。"
 nick_sullied_dragon: "污秽之龙"
 nick_sullied_dragon_desc: "他内心深处潜藏着一股黑暗的力量，在死亡中已然破碎。那么，如今获得自由意味着什么呢？"
 nick_true_bone_yacha: "真骨夜叉"
 nick_true_bone_yacha_desc: "肖氏漠视世事，必将自食其果。其门徒绝对不会重蹈覆辙。"
 nick_investment_fox: "投资之狐"
 nick_investment_fox_desc: "凡人总是乐于让梦想被资助。至于代价，他只要求一个\"合理\"的回报。"
 nick_fetter_fencer: "羁绊贩子"
 nick_fetter_fencer_desc: "逝者常将财富藏匿起来，任其白白浪费未免太过可惜。"
 nick_bone_shaper: "骇骨塑师"
 nick_bone_shaper_desc: "要靠这些材料供养一整个修会，本就困难重重，她始终难以达到期望。"
 nick_old_bear: "老熊"
 nick_old_bear_desc: "没有打手还算什么财阀？"
 nick_silent_butcher: "静默屠夫"
 nick_silent_butcher_desc: "人们以为不说那些语无伦次的话会使人安心，但他的沉默只是更加剧了恐惧。"
 nick_overseer_of_interiors: "内事督工"
 nick_overseer_of_interiors_desc: "管理像真骨会这种组织的内部事务可不是件容易的事，他面临着艰巨的任务。"
 nick_ivory_cook: "象牙大厨"
 nick_ivory_cook_desc: "中我们的毒，总好过中他们的，不是吗？"
 nick_bone_fox: "骨狐"
 nick_bone_fox_desc: "大量神话讲述狐灵伪装成倾国美女的危险，其真相却恰恰相反。"
 nick_lapdog: "走狗"
 nick_lapdog_desc: "很少人能承受瓮星血族密教的恐怖。他当然不是其中之一，于是他逃至其尊长的庇护所。"
 nick_wicked_citys_nightmare: "妖邪之城的梦魇"
 nick_wicked_citys_nightmare_desc: "瓮星的众多信徒中，大多数人都在努力追求其主的世界，但她却表现得好像已经生活在那个世界里一样，在她所能领会的一切堕落和恐怖之中放纵，以此来庆祝即将到来的世界。"
 nick_monsters_eyes: "魔物凝眼"
 nick_monsters_eyes_desc: "在茜避难所里所潜伏的是她的眼睛，一双似乎永远不眠的眼睛。"
 nick_monsters_hands: "魔物助手"
 nick_monsters_hands_desc: "他收集女主人工作所需的一切物品，一切都藏在怪诞的微笑后。"
 nick_monsters_meat: "魔物玉臠"
 nick_monsters_meat_desc: "在茜的避风港中，陶胎入眠之际，独有一只不离茜身边，在那安静时刻满足茜所能想见的每一个欲望。"
 nick_monsters_claws: "魔物利爪"
 nick_monsters_claws_desc: "一个讨厌孤独的人偶​​，第四人偶高兴地筹备着制作更多人偶的零件。"
 nick_towering_soldier: "屹立忠兵"
 nick_towering_soldier_desc: "身为众多石像鬼中的第一位，陶将暴力化为一场血腥的戏剧。"
 nick_restored_beauty: "重组美人"
 nick_restored_beauty_desc: "完美的整体可以用不完美的部件组成。"
 nick_wolfbreaker: "破狼之力"
 nick_wolfbreaker_desc: "无数八犬曾试图猎杀班派亚，但在面对其创始者之前，总有一股力量先一步出现，将狼粉碎于她的钢铁之握中。"
 nick_master_of_dolls: "人偶大师"
 nick_master_of_dolls_desc: "她无需以统治者的身份出现，仅仅只需操作适合的提线。"
 nick_forward_general: "进步将军"
 nick_forward_general_desc: "一位严肃冷峻的将军似乎并非创新思维的先锋，但岩濑却巧妙地使其成真。"
 nick_mother_harimau: "马来虎母"
 nick_mother_harimau_desc: "马来可汗们，不论是她所生还是服务于她，都称她为母亲。因为没有她，他们都会迷失。"
 nick_bon_bhat: "苯婆吒"
 nick_bon_bhat_desc: "生亦传奇，死亦传奇。"
 nick_soft_paw_cub: "软爪崽"
 nick_soft_paw_cub_desc: "拉腾未被赐予那万千形态。所以她追寻着一切方式，以找到她的位置"
 nick_wave_general: "波涛将军"
 nick_wave_general_desc: "兽庭本来想让她成为一名战士，而她选择领导。"
 nick_pale_stalker: "苍白猎手"
 nick_pale_stalker_desc: "白虎如何隐匿实在难以言喻。不过知道答案的，如今还没有一个活下来。"
 nick_mincemeat_demon: "碎肉之魔"
 nick_mincemeat_demon_desc: "曾有恶魔毁容一只幼虎。如今，一位被战火重塑面容的可汗正在猎杀他们。"
 nick_warrior_judge: "刃衡裁者"
 nick_warrior_judge_desc: "玉母的法则必须得到遵守。贵鬃已经下定决心，一定要确保自己完全了解这些规则。"
 nick_harimau_princess: "马来虎姬"
 nick_harimau_princess_desc: "身为族群战主的女儿自有其好处。傲瞳也确实沉溺于如此荣幸中。"
 nick_great_crocodile: "巨鳄"
 nick_great_crocodile_desc: "鳄神因一位上古耆宿的血术法而堕入黑暗，如今他的力量已超越神性。若怒嚎末日降临，索贝克将成为其先兆。"
 nick_blade_anubis: "阿努比斯之刃"
 nick_blade_anubis_desc: "挑战死神的勇士是最不明智之举了。"
 nick_one_shadow: "一影"
 nick_one_shadow_desc: "大火熄灭，一影尚存。"
 nick_sleeping_dragon: "卧龙"
 nick_sleeping_dragon_desc: "古老兵法以卧龙之梦重现于世。"
 nick_the_boulder: "不动巨石"
 nick_the_boulder_desc: "河流穿石非以其力，而以其恒——除非那石为宗兼。"
 nick_david_alroy: "大卫・阿尔罗伊"
 nick_david_alroy_desc: "一名有着无数名字的男子：大卫・阿尔罗伊、梅纳赫姆・伊本－阿比－达伍德、苏莱曼・伊本・阿尔－鲁吉、大卫・阿尔鲁伊、伊本・阿尔－鲁希、大卫・埃尔－大卫、梅纳赫姆・本・所罗门、梅纳赫姆・本・所罗门・本・鲁吉、伊本・鲁吉、伊本・阿尔－鲁吉、马纳希姆・伊本・苏莱曼・阿尔－鲁吉、阿布・达伍德、大卫之星的承载者、大卫・阿尔罗伊伊、马纳希姆・伊本・苏莱曼、达伍德・阿尔－鲁希、大卫・阿尔・罗伊伊、大卫・阿尔－大卫、梅纳赫姆・阿尔－鲁吉、梅纳赫姆・本・苏莱曼、梅纳赫姆・本・所罗门・本・杜吉、大卫・阿尔罗伊伊、达维德・阿尔－罗伊。"
 nick_raijin: "雷神"
 nick_raijin_desc: "首先他掌控刀刃，接着掌控风暴。"
 nick_raitaro: "雷太郎"
 nick_raitaro_desc: "雷之子肩负井上家族与八犬一族的厚望。千钧重担压于经寻之身，这狼形者却始终未露怯色。"
 nick_broken_blade: "支离之刃"
 nick_broken_blade_desc: "以此弱质，有栖影不能奢望砥砺其刃，故转而砥砺其智。"
 nick_eager_blade: "热切之刃"
 nick_eager_blade_desc: "身为么女，靖子始终被家族爱护宠溺。但如今她稚气已脱，渴望与其手足并肩作战。"
 nick_western_wind: "西风"
 nick_western_wind_desc: "延庆研读西风，寻找那些横行土地蛮族的迹象。"
 nick_dragon_judge: "巨龙法官"
 nick_dragon_judge_desc: "无论是有罪之人还是无辜之人，都惧怕他的裁决。仁实的判决既严厉又公正，他迅速且高效地为自己的国家带来了繁荣。"
 nick_rain_dragon: "雨龙"
 nick_rain_dragon_desc: "在雨夜，人们可以看到雨龙的身影在云层间翩翩起舞。"
 nick_noble_cyclone: "宏伟气旋"
 nick_noble_cyclone_desc: "任何胆敢伤害他所守护的人，都将被气旋摧毁。"
 nick_devil_tiger: "魔虎"
 nick_devil_tiger_desc: "山南的森林为众生所惧，他就是原因。"
 nick_tiger_lord: "虎君"
 nick_tiger_lord_desc: "舒哲伟岸尊贵的身姿，令见者既敬且畏。"
 nick_returned_wolf: "归来之狼"
 nick_returned_wolf_desc: "救赎不在大海彼岸的流亡。即使我们失败，荣誉也要求我们履行使命。"
 nick_singing_moon: "歌咏之月"
 nick_singing_moon_desc: "他吟唱着关于八犬故乡和其在耻辱之战中失败的忧郁歌谣回荡着夜色之中。而如今，或许其歌可以是希望。"
 nick_feral_samurai: "狂野狼侍"
 nick_feral_samurai_desc: "実盛不在乎优雅剑术，而是以连续猛击压倒敌人。到目前为止他的方法非常有效。"
 nick_cackling_darkness: "尖笑之暗"
 nick_cackling_darkness_desc: "没人知道这名狼子的神志出了什么事，又或是他如何成为八犬的反义词。在他背刺你之际，你只听得见他狂乱的尖笑。"
 nick_soaring_moonblade_dead: "翾翥月刃"
 nick_soaring_moonblade_dead_desc: "直影的剑术如同醉人之舞，其敌莫能共舞。尽管其艺之精湛，却不愿对子起舞，纵然是为了自保。"
 nick_deprived_moon: "受黜之月"
 nick_deprived_moon_desc: "当技艺更高超的兄长被指定为继承人时，利广骤怒弑父。他逃离其家，只是坠入更深的黑暗。现已完全迷失。"
 nick_soaring_moonblade: "翾翥月刃"
 nick_soaring_moonblade_desc: "子继父艺，承父其刃，然其独舞，何等悲哉。"
 nick_wolf_lord: "狼君"
 nick_wolf_lord_desc: "他拒绝为自己寻找伴侣，而是养育群狼，视为己出。无论结局如何，狼群都将追寻其君。"
 nick_the_outsider: "世外羁客"
 nick_the_outsider_desc: "远离导师和天照族裔，重野接受如此流亡生活并昂然走出自己的道路。"
 nick_lords_mistress: "众主嬖艳"
 nick_lords_mistress_desc: "能进出权力的密室，就拥有了左右世界的影响力。而瑠璃，正是能字面做到这一点的高手。"
 nick_steadfast_minister: "坚定大臣"
 nick_steadfast_minister_desc: "高尚的价值观固然很好，但实践起来则完全是另一回事。"
 nick_lord_crocodiles: "鳄君"
 nick_lord_crocodiles_desc: "鳄鱼们服从他不是出于亲缘关系，而是出于恐惧。"
 nick_crocodile_hunter: "鳄鱼猎手"
 nick_crocodile_hunter_desc: "他一生中的大部分时间都在猎杀鳄鱼。而他是否能成功猎取一只#TOOLTIP:GAME_TRAIT,mokole,[GetNullCharacter] #L 鳄鱼人#!则尚待观察。"
 nick_determined_tysiatskii: "果毅千夫长"
 nick_determined_tysiatskii_desc: "乔维尔达斯自己找到了王者之路。现在他只需要继续履行下去。"
 nick_falcontamer: "驯鹰者"
 nick_falcontamer_desc: "第七位受造的贤荷鲁个性严肃勤勉，其沉稳可靠足为模范，正是荷鲁斯于潜在新兵身上所寻求的。"
 nick_shoulder_devil: "肩上恶魔"
 nick_sheperd_power: "驭权牧者"
 nick_sheperd_power_desc: "生前，他目睹的只有他者的苦难；死后，他希望堕落強者的自利之举，仍能造福人类。"
 nick_chaser_innocence: "无觅纯真"
 nick_chaser_innocence_desc: "吉兰追寻不曾有过的往昔；逃离无法逃离的未来。"
 nick_goddess_prince: "女神之亲王"
 nick_goddess_prince_desc: "这位唯一配得上世间最美女子垂青的男子，以绝对的忠诚作为回报，将自己全然奉献于她。"
 nick_of_the_veela: "媚娃之属"
 nick_of_the_veela_desc: "也经常被称为\"投矛者\"，卢基娜必在威胁其主伊凡之人的面前以战争恶魔的姿态现身。"
 nick_diligent_hedonist: "勤奋的享乐主义者"
 nick_diligent_hedonist_desc: "对拉迪斯拉夫来说，处理统治领地的琐事，同时满足自己的欲望，从来没有问题。"
 nick_lost_seeker: "迷惘修者"
 nick_lost_seeker_desc: "梵丝对浩恩永生的寻找至今还没有取得太多成果，随着时间的推移，她的选择越来越少。"
 nick_bloody_succubus: "血腥魅魔"
 nick_bloody_succubus_desc: "自历史曙光初现之时，人类便已被警告过\"她\"——然而，仍有无数人置若罔闻。"
 nick_lilin_hierophant: "莉莉丝派的圣显者"
 nick_lilin_hierophant_desc: "只有通过苦痛才能获得力量。苦痛是无上导师，也是有着终极回报的考验。"
 nick_rebel_methuselah: "反叛的玛土撒拉"
 nick_rebel_methuselah_desc: "众多反叛者的靠山远比他看上去更加古老，而他一生所知的，唯有反叛。"
 nick_the_cataboligne: "腐解者"
 nick_the_cataboligne_desc: "作为效命于更强大恶魔的军团士兵，巴利亚格斯却格外擅长操纵凡人代理，尽管对他们始终心怀轻蔑。"
 nick_mandragora: "魔蔘曼德拉"
 nick_mandragora_desc: "诡诈难测，却对其神秘的恶魔主人异常忠诚；格兰特尔的\"智慧\"，会逐步腐化所有向他寻求\"帮助\"之人。"
 nick_leeches_succubus: "水蛭的魅魔"
 nick_leeches_succubus_desc: "专门诱惑吸血鬼的卢克雷西娅，很快学会将血缚反过来利用于他们身上，把掠食者变成自己的猎物。"
 nick_grand_vizier_infernal_realms: "地狱的大维齐尔"
 nick_grand_vizier_infernal_realms_desc: "距努巴鲁斯晋升为大恶魔仅一步之遥，他将谨慎而坚决地踏出那一步，一如既往。"
 nick_injurer_cats: "伤猫之魔"
 nick_injurer_cats_desc: "就算是恶魔也该有底线！"
 nick_the_riven: "分崩离析"
 nick_the_riven_desc: "无论他所至何处，友谊皆化为纷争，谋杀与混乱紧随其后。"
 nick_brain_taster: "品脑师"
 nick_brain_taster_desc: "脑子？脑子！"
 nick_guards_the_path: "守道者"
 nick_guards_the_path_desc: "在旅途中，他是极佳的同行伙伴——普萨姆提克满腹逸闻典故，总能讲出各种生动的历史趣谈。"
 nick_first_outrider: "第一掠骑"
 nick_first_outrider_desc: "草原之民常能策马远行，越出刺链地狱的掌控；然而凡被拖入其中者，无不畏惧那位亲手将他们拽入的斯基泰人。"
 nick_the_bagger: "裹尸之女"
 nick_the_bagger_desc: "极少有多科尔所需的罪人愿意赴死以进入刺链地狱，一位被遗忘的罗克索拉尼之女促成这段行程。"
 nick_the_tanner: "剥皮者"
 nick_the_tanner_desc: "魔虎向来因对付恶鬼的本领而深受看重，但没人真想看到他们以火攻火，还要再添一把火。"
 nick_the_apprentice: "学徒"
 nick_the_apprentice_desc: "虽然表面上其他的先锋掠骑更令人畏惧，但老祖们却害怕那张看似放过他们的平静笑脸。"
 nick_wolfskinner: "剥狼皮者"
 nick_wolfskinner_desc: "许多人自诩为草原之民，图格曼达赫决心亲自衡量——他们是否真有那分量。"
 nick_champion_sky: "苍穹勇士"
 nick_champion_sky_desc: "传统之存，自有其因；无论世道何等疯狂，违逆之，亦为疯狂。"
 nick_ocean_follower: "海洋从者"
 nick_ocean_follower_desc: "库慕德遇见比他生前更懂海洋的人，并立誓追随在她的航迹之后。"
 nick_misguided_wind_desc: "这股狂风向错误目标怒号，许多人将付出惨痛的代价。"
 nick_the_shaman_desc: "诸灵或许曾经指引过要人，但它们并不适合当政治顾问。"
 nick_steadying_flame: "镇定之火"
 nick_steadying_flame_desc: "尽管火焰通常是烧毁事物，有时却也能弥合并扶将倾之皇朝。"
 nick_the_hellhound: "地狱犬"
 nick_the_hellhound_desc: "他以猎人之姿从至暗深渊归来，地狱诸方正紧追其身后。"
 nick_the_strangler_bastards: "野种杀手"
 nick_the_strangler_bastards_desc: "半鬼人四处乱跑，只会引来猎魔人与变形者的注意。最好剪去那些歧出的枝条。"
 nick_shadowed_star: "遮影之星"
 nick_shadowed_star_desc: "他本可成就非凡，却永远被阴影所遮蔽。"
 nick_river_mother: "众河之母"
 nick_river_mother_desc: "整个大草原都流传着一位佳人从河中走出，建立了一个又一个部族。而玄武皇朝知道——塔塔豪伊又在外活动了。"
 nick_iron_pillar: "钢铁坚柱"
 nick_iron_pillar_desc: "巴特包勒德不为人所动摇，但他会被魔鬼动摇吗？"
 nick_blinding_star: "迷眩之星"
 nick_blinding_star_desc: "许多人希望此星修行腾龙舞，但此星同样擅长引诱[akuma|E]走向灭亡。"
 nick_dusk_ward: "黄昏戒护"
 nick_dusk_ward_desc: "照料士兵是件麻烦差事，这需要一双稳定的手。"
 nick_star_guide: "星之指引"
 nick_star_guide_desc: "引导整个至尊皇朝并非易事，但这是一座值得耕耘的花园。"
 nick_kumo_hawk: "猎蛛鹰蜂"
 nick_kumo_hawk_desc: "小心逃离蛛网的黄蜂。几乎没有什么人能比蜘蛛曾经的猎物更憎恨蜘蛛。"
 nick_tundra_wolf: "冻原之狼"
 nick_tundra_wolf_desc: "玄武皇朝与化兽族裔之间素有暴力冲突的历史，这段关系或许还有修复的可能。"
 nick_sandwyrm: "沙之妖蛆"
 nick_sandwyrm_desc: "从戈壁沙漠到剥皮地狱，孔戈尔策策格始终能适应并成长。她仅存的骄傲，不容她失败。"
 nick_silver_reaver: "银之边盗"
 nick_silver_reaver_desc: "他们早已忘记恐惧的感觉，艾苏丹会将之深深烙印进其灵魂。"
 nick_horsebreaker: "裂马者"
 nick_horsebreaker_desc: "凡是不幸被乌卢格别克骑乘的马匹，脊梁骨都难逃苦头。而那些在战场上与他狭路相逢的人，更是劫数难逃。"
 nick_silent_fox: "默狐"
 nick_silent_fox_desc: "狼是易于察觉的威胁，而在狐的笑容后唯有尖牙。"
 nick_hebei_outcast: "河北弃士"
 nick_hebei_outcast_desc: "几乎没有人会被逐出屋室，塞克绝不会忘记此等大辱。"
 nick_healing_flame: "治愈之火"
 nick_healing_flame_desc: "探寻这片沙漠的秘密始终是危险之举，如果你没人急救，此般探险很可能就是最后一次。"
 nick_fire_sage: "火之贤哲"
 nick_fire_sage_desc: "许多力量节点隐藏在大漠之下，让其化为炼狱，焚尽敌人。"
 nick_sand_scorpion: "沙蝎"
 nick_sand_scorpion_desc: "沙漠可是危险的地方，意外总是发生。"
 nick_scouring_flame: "搜寻之火"
 nick_scouring_flame_desc: "只有别具耐心之人才能在无垠的沙海中寻找宝藏。"
 nick_the_grim_courser: "冷面猎骑"
 nick_the_grim_courser_desc: "在整片草原维持正义并非易事。因此亦失哈会在草原的每一寸土地上追猎，确保正义不失其意义。"
 nick_the_battering_charger: "破城战骑"
 nick_the_battering_charger_desc: "城墙长久以来阻碍着草原诸大帝国行使征服权，因此都木立志将其一一击破。"
 nick_the_lightning_strider: "闪雷迅骑"
 nick_the_lightning_strider_desc: "如霆之猛，如雷之迅，使其不知所遭何击。"
 nick_the_thunder_mare: "霆母战驹"
 nick_the_thunder_mare_desc: "无尽的战争需要无尽的士兵，那就让士兵的来源永不枯竭。"
 nick_the_golden_shewolf: "黄金母狼"
 nick_the_golden_shewolf_desc: "这匹狼将保护其狼子直到最后。"
 nick_broken_guardian: "破碎卫士"
 nick_broken_guardian_desc: "传言他刻意杀了心爱的子嗣。这非实情，但他也将伴随此私议直到终死。"
 nick_vigilant_wolf: "机警之狼"
 nick_vigilant_wolf_desc: "那个鲁莽男孩早已死去，永恒之战需要的是一位谨慎的指挥。"
 nick_black_crow_east: "东方黑鸦"
 nick_black_crow_east_desc: "愿群鸦为汝泣涕。"
 nick_the_young_crow: "玄羽少鸦"
 nick_the_young_crow_desc: "赤心也许是个野心过大的莽夫，但其忠心毋庸置疑。"
 nick_ever_sweet: "永恒甜心"
 nick_ever_sweet_desc: "厄克的铁腕，需裹以丝绸，方能诱人上钩。"
 nick_goldenhand: "黄金手"
 nick_goldenhand_desc: "巴延沉溺于饮食与笑声之中，希冀能忘却那份空虚。"
 nick_gentle_moon: "仁柔之月"
 nick_gentle_moon_desc: "谦逊、公正、仁厚的艾托勒德以悲剧收场，本应回响明君笑声之处，只余令人煎熬的寂静。"
 nick_black_heart: "黑心"
 nick_black_heart_desc: "没有什么能动摇这颗黑心，除了金子。"
 nick_the_smiling_viper: "笑面毒蛇"
 nick_the_smiling_viper_desc: "他的笑意只在嘴角，未在眼中。"
 nick_beauty_millennium: "千年丽人"
 nick_beauty_millennium_desc: "数世纪已逝，她仍为夜中最无瑕之存在。"
 nick_death_blue: "死之苍蓝"
 nick_death_blue_desc: "一手是苍白绝美的女神恩宠，另一手则是尼福尔海姆的幽蓝寒冥。"
 nick_queen_for_a_night: "一夜之后"
 nick_queen_for_a_night_desc: "「昔在哥特之地，有一贵女，姿容无匹。其名小希尔德，长而艳绝。为其色者，多有骑士殒命。未及其死，已使一国三王崩逝。」——掠骑之至宝，仅以绝色，葬送匈王。"
 nick_twice_devil: "双重恶魔"
 nick_twice_devil_desc: "你还要被定罪多少次？你要为以生俱来的罪孽偿还到什么时候？"
 nick_bulgar_bride: "保加尔新娘"
 nick_bulgar_bride_desc: "身为自可汗称帝之人的妻子，萨比娜见证过无数草原帝国的兴衰，在地狱中更见过千百次。现在，也该看又一个帝国覆灭。"
 nick_prize_queen: "奖品女王"
 nick_prize_queen_desc: "曾两度自家园中被掳去，这位被当作战利品的公主将建立一个再也无人能将她掳去的家园。"
 nick_champions_trophy: "勇士奖品"
 nick_champions_trophy_desc: "被赐予一位崭露头角的征服者以巩固边境，但她从未忘记亲自统治的渴望。"
 nick_granddaughter_heaven: "天孙"
 nick_granddaughter_heaven_desc: "帝女出降草原之主，已是前所未有；更遑论最终竟沦入无量地狱。"
 nick_little_lion: "幼狮"
 nick_little_lion_desc: "嘲笑这头幼崽，后果自负——你很可能会尝到他的利齿。"
 nick_khazar_peacock: "可萨孔雀"
 nick_khazar_peacock_desc: "塞拉喜欢作秀张扬、昂首阔步，但她远非自己所以为的猛禽。"
 nick_mistress_of_sighs: "欢叹夫人"
 nick_mistress_of_sighs_desc: "凡禁之地，皆当践行；凡禁之言，皆当吐露；凡禁之事，皆当沉溺。"
 nick_la_jeune_desc: "在最血腥舞台上的最甜美布景；在那双无辜的眼眸之后，潜伏着一位操弄毁灭与悲剧的大师。"
 nick_l_ancienne_desc: "这位长者早在数世纪前就为最黑暗的巨作设置好了舞台。"
 nick_le_radieux_desc: "戈德温用金头银面的完美遮掩了深渊，完美地扮演了男主角。"
 nick_the_soothsayer_desc: "了解未来，但也不要忘记注意当下。"
 nick_political_animal_desc: "最不光荣的竞技场才能造就最精明的人。"
 nick_ennamaru_desc: "一位沉睡中的剧作家，正酝酿着一部伟大的悲剧。他在腐败的舞台下休眠，等待完美的登台时机。"
 nick_trusted_squire: "受信侍骑"
 nick_trusted_squire_desc: "阿达姆德被托付日耀的未来，然而其抉择或许会出乎多数人的意料。"
 nick_the_war_singer_desc: "当希尔德里克仍为日耀及其英雄的传奇震慑时，他自己也正迅速步入传奇之中。"
 nick_aging_confidant_desc: "岁月已消磨阿尔布雷希特的机智，但人们仍然会征求其意见。"
 nick_reluctant_heiress_desc: "银嚎被选为最负盛名的狼人圣地的继承人。这个前景令她兢兢翼翼，证明她是正确人选。"
 nick_gaia_wrath_desc: "无情、愤怒至于过度的海伦，往往以盖亚恐怖怒火的具象现身。"
 nick_son_thunderhowl_desc: "雷嚎并不是易于承担的传奇，但巴尔达将以荣誉与力量竭力不负其名。"
 nick_sun_glory_desc: "这位曾以前所未有之势团结诸部族的银牙楷模正逐渐老去；他的伟大传承，也即将迎来日落。"
 nick_wolfshead_desc: "从贵族到亡命之徒，这一切都是为了一只狼的自由。"
 nick_bishop_chester: "切斯特主教"
 nick_bishop_chester_desc: "杰弗里同时积累着世俗和精神的权势，他是罕见的银牙必须尊重和听从的狼嫡。"
 nick_born_competitor: "天生竞士"
 nick_born_competitor_desc: "马尔科姆是个彻头彻尾的冒险家，在他所处的小世界里，还没有遇到一个能与之匹敌的对手。"
 nick_stricken_knight: "受难骑士"
 nick_stricken_knight_desc: "麻疯病并没能削弱亨利的骑士精神和其剑术。"
 nick_abbot_connemara: "康尼马拉修士"
 nick_abbot_connemara_desc: "基南自成体系的信仰，使其拥有了意想不到的朋友——从狼人到妖精，皆在其列。"
 nick_cursed_bard: "受诅诗人"
 nick_cursed_bard_desc: "布里恩在任何宫廷都备受欢迎——但仅止于一两夜；随后，他的诅咒便会为其招来新的敌人。"
 nick_stranded_serpent: "困蛇"
 nick_stranded_serpent_desc: "朱利奥特远离她认为自己理应所属的权力殿堂，她对名气与财富的梦想将建立在他人的血泪之上。"
 nick_caretaker_martyr: "殉道救护"
 nick_caretaker_martyr_desc: "埃莎使耶路撒冷成为萨洛比的避难所，遗憾的是她没能亲眼见证。"
 nick_keeper_lore: "知识守护者"
 nick_keeper_lore_desc: "这位沉稳博学、塔玛赫拉学术派的创立者，正试图在远超其平和理念所能承受的动荡时局中寻求立足。"
 nick_farsighted_bride: "卓识新娘"
 nick_farsighted_bride_desc: "佐菲亚将为银牙在波兰的胜利铺路；无需动用武力，唯凭意志与美。"
 nick_shadow_upon_lily: "百合花上的阴影"
 nick_shadow_upon_lily_desc: "一幅苦难与绝望的杰作，涂抹于法兰西之心上。"
 nick_virtuoso: "艺术大师"
 nick_virtuoso_desc: "痛苦、血肉和白骨共同交织出骇人而美丽的杰作。"
 nick_druid_night: "夜之德鲁伊"
 nick_druid_night_desc: "一位睿智的夜之牧者，为血族与血畜所共知。"
 nick_songs_glory: "光荣之歌"
 nick_songs_glory_desc: "盖亚之声与智慧，存续于先祖荣耀的追忆中。"