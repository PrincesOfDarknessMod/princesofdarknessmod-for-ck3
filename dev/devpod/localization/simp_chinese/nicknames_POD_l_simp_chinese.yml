 nick_the_dark_mother_desc: "命运女士、第一位女人、伊什塔尔、它们的女王。莉莉丝是生命之起源，有些人担心她也是生命之终末。"
 nick_the_dark_father_desc: "首位杀人犯、首位吸血鬼、黑暗之父、流浪者、黑暗暴君、渔人王、伟大的血与黑暗王、加音、卡纳尔、卡根、血腥者、以及更多。该隐是初，亦又是终。"
 nick_trusted_regent_desc: "在纳穆尔图姆回来之前，沙赫里一直保持着哈基姆圣裔的统一。哈基姆选择他作为自己的继承人是明智的。"
 nick_exiled_prodigal_desc: "太多的匕首指着希勒尔的背。这位疲惫的战士看到了不祥之兆。"
 nick_the_shepherd_of_wolves_desc: "安多罗试图保持众多效忠以实现他的最终目标。到目前为止，他还算成功。"
 nick_cursed_sultan_desc: "卡里姆树立了一个强大的敌人，并付出了代价。一个缓慢、痛苦的代价。"
 nick_the_spear_of_destiny_desc: "宰亚特在十字军的帐中见到了真神，他痛苦哀叹为何十字军战士们没能做到。"
 nick_merciless_spider_desc: "忒弥斯的刀锋之网如今盘根错节，几乎牢不可破，服务于可怕的黑暗主宰。"
 nick_master_sorcerer_desc: "一切荣耀归于阿什拉夫，他执行了创造仪式，让哈基姆圣裔们保持强大。他锻造了迦梨之牙和太阳之弓。他以他的铁腕束缚太阳、击败恶魔。一切荣耀尽归于他！世界上最伟大的魔法师！"
 nick_impassible_diplomat_desc: "特琪洛士那冰冷的面容和刻薄的智慧从未阻止他被尊为哈基姆圣裔最值得信赖的大使。"
 nick_hand_of_vengeance_desc: "法蒂玛将哈基姆和安拉的怒火平等地带给她的敌人。她唯一害怕的是有一天晚上不得不在她所效忠的两尊神明之间做出选择。"
 nick_northern_bastion_desc: "安达卢斯已经陷落了，但基督徒在宣告胜利之前仍需突破泰贝莎严密的防御。"
 nick_the_rogue_desc: "塔拉克只侍奉他自己。他拯救自己人民的追求将会是他的救赎，或是他的毁灭。"
 nick_the_enigma_desc: "笼罩在几层欺诈的面纱之后，没人知道达斯图尔到底侍奉何人。"
 nick_herald_of_destruction_desc: "黑牧人。妒恨之子。哈基姆先驱。无皮者。毁灭先驱。乌尔·舒尔吉将看着世界在恶报的地狱中燃烧。"
 nick_the_thrice_damned_desc: "伊希姆是哈基姆派历史上最伟大的战士。他的陨落注定了他氏族的末日。"
 nick_the_once_and_forever_prince_desc: "密特拉已死。密特拉万岁！"
 nick_wind_of_change_desc: "纳穆尔图姆为哈基姆派带来了转机，无论他们是否喜欢这些改变。"
 nick_suffet_of_hell_desc: "由猎魔者转变为崇魔者的背叛仍旧困扰着哈基姆圣裔。"
 nick_sword_of_haqim_desc: "比斯塔克满怀正义的怒火，以她尊长的名义进行复仇。哈基姆本人似乎也祝福了她不灭的热情。"
 nick_lovestruck_ghost_desc: "谢巴赫为了追求唯一有价值的事——爱——而放弃了其余一切。"
 nick_the_cold_desc: "布鲁赫严肃而沉着的举止与他后代的热情相得益彰。"
 nick_the_fiery_desc: "激情可以让你登上极峰……在坠入深渊之前。"
 nick_the_serene_desc: "纪尧姆正在寻找真正的救赎，超凡脱俗的平静似乎从他身上散发出来。"
 nick_the_reluctant_sultan_desc: "大多数人都追求最终得握权柄。但有些人只是因命运的突发奇想而被迫登上高位。"
 nick_gods_witness_desc: "蒙塔西尔在他漫长的一生中看到了许多救赎的途径。但最后，他从未真正走过任何一个。"
 nick_outlaw_desc: "法律对罗宾来说无关紧要。他只为真正的正义而战。"
 nick_autokrator_desc: "一个在幻梦中被收养的陌客，娜塔莉亚可能是唯一能够真正再续幻梦的人。"
 nick_iberian_hound_desc: "亚历山德罗对他的同伴来说是真正的朋友，对他的许多敌人来说则是顽固的对手。"
 nick_the_gladiator_desc: "只有最强者才能在罗马角斗场中幸存下来。但即使是那少数在出来后也是变了个人。"
 nick_roman_promethean_desc: "卢修斯背叛了他的罗马家园，投入了布鲁赫的迦太基乌托邦的怀抱。如此怪行使得他几乎没有朋友。"
 nick_murderer_of_kings_desc: "阿明身为一名梵卓子嗣，却只想看到权贵们的头颅落地。"
 nick_flawed_dictator_desc: "赫克托正在努力重建迦太基，使其发挥最大的作用。包括它的阴暗面。"
 nick_praetor_urbanus_desc: "色雷克斯试图用她的攻击来激怒罗马梵卓。事与愿违，被逗乐的卡米拉将她置于权威之位。"
 nick_rightly_guided_desc: "保卫家园和信仰，才是最值得努力付出的事。"
 nick_mysterious_sorceress_desc: "艾琳知道一些精心安排的谣言可以发挥多大的作用。这就是她使用魔法的方式。"
 nick_soft_prince_desc: "尼希米关心的是比统治更高的目标。他不在乎人们在背后对他的窃笑。"
 nick_ashen_rabbi_desc: "有时，死亡只会加强人的信仰。"
 nick_pale_wolf_desc: "墨涅拉俄斯是一个复仇的幽灵，潜行于夜，寻找最美丽（也是最危险）的猎物。"
 nick_brute_patriarch_desc: "多米尼克用铁腕统治着迦太基的军队。死亡只是帮他收紧了手掌。"
 nick_paragon_humanity_desc: "正如她的许多朋友所熟知的那样，维罗是唯一一位真正关心她牧群的牧人。"
 nick_devious_zealot_desc: "燃烧的信念就像燃烧的愤怒一样迅速地消耗一个人。"
 nick_sole_survivor_desc: "比约恩失去了他的船员，但一位永恒的船长永远不会真正失去他的使命。"
 nick_doctor_desc: "过去人生中的职业在亡生中可能具有更黑暗的意义。"
 nick_tyler_desc: "瓦特·泰勒激励了许多人，帕特莉夏在她叛逆的心中以他的名字为荣，并受其鼓舞。"
 nick_redeemed_knight_desc: "克里斯托夫的故事是一个关于救赎的故事，由一个不寻常的爱情和对职责的不懈努力带来的。"
 nick_scion_of_carthage_desc: "扎姆拉比任何人都更多地体现了迦太基的乌托邦，这可能使她看不到更黑暗的真相。"
 nick_the_patriarch_desc: "家长让人尊敬。而族长则赢得不灭的尊敬。"
 nick_faithless_son_desc: "拉撒路看到了卡帕多修斯的疯狂，但却看不到自己的。"
 nick_guardian_of_the_necropoli_desc: "安琪莉柯等待着她心爱的主人回来，她知道真正的救赎只来自他的手中。"
 nick_faithful_son_desc: "雅弗将支持他的父，直到不可避免的痛苦终结。"
 nick_the_oracle_of_bones_desc: "康斯坦西娅看到了很多，也采取了更多行动。但即使如此，她的努力也可能不足以避免她看到的灾难。"
 nick_herald_of_kupala_desc: "库帕拉将再次在地上行走，在这个过程中高兴地索取他的卒子的身体。这将是他唯一的回报。"
 nick_ambition_personified_desc: "安布罗吉奥·乔凡尼有一个不光彩的声誉，那就是他是整个最自以为是的氏族中最自以为是的混蛋。"
 nick_augustus_right_hand_desc: "克劳狄斯听从他父亲的吩咐。然而，他的回报可能不是他所渴望的。"
 nick_unrelenting_loyalist_desc: "马库斯想成为他的家族的典范。可悲的是，他是一位乔凡尼。"
 nick_family_muscle_desc: "伊尼亚齐奥并不狡猾，也不聪明，但一个好打手的功效怎么强调都不为过。"
 nick_exemplar_of_humanity_desc: "狄奥尼修斯编纂了吸血鬼应该如何行事。他的榜样在未来会有很多人效仿。"
 nick_reckless_occultist_desc: "卢克丽霞一头冲进任何危险中。她的求死愿望仍未实现，也许是她自己也感到惊讶。"
 nick_the_queenoftombs_desc: "阿帕西亚曾经守护着她的斯基泰人坟墓。这是她至今仍为之自豪的遗产。"
 nick_byzantium_architect_desc: "拜扎尔在被米迦勒和他的亲信偷走它之前创造了拜占庭。当君士坦丁堡最终在1204年被烧毁时，他怀着复杂的心情观看了这一切。"
 nick_the_gentleman_desc: "这位坚忍不拔的密特拉的忠实顾问是知识的源泉，他准备用他一贯的冷静和沉着的态度来传递知识。"
 nick_fates_pawn_desc: "她知道，她的死亡将预示着一个巨大的变化。她也知道再逃避也没有意义。"
 nick_charnel_maid_desc: "德雷尼斯受尽折磨，终于赢得了自由。然而，她的救赎之路才刚刚开始。"
 nick_broken_hersir_desc: "维特知道诸神黄昏就在这里。而且他知道它是如何结束的。"
 nick_the_untamed_desc: "喀喇为其人民的未来而战。他的野蛮愤怒得到了对其大业的信念的支持。"
 nick_bestial_force_of_nature_desc: "阿努尔夫是冈格罗的典范，他是真正拒绝文明的人，将与文明斗争到底。"
 nick_furore_crusader_desc: "埃里克以令人印象深刻的热情与基督教徒作战。但他最大的敌人可能是他自己的怒火。"
 nick_chooser_of_the_slain_desc: "她曾经在最后一战中挑选了配得上战斗的人。而她现在与他们站在一起。"
 nick_thehun_desc: "玛瑟逊莎曾经与上帝之鞭一同骑行。她是最后一位匈人，那些让罗马本身惊恐地尖叫的人。"
 nick_thesandstorm_desc: "宰亚特漫步在阿拉伯的沙地上，为有资格的人提供智慧，为没有资格的人提供死亡。"
 nick_witch_of_connaught_desc: "就像神话照入现实一样，最后一位爱尔兰女巫在岛上徘徊，准备保卫她的领土，抵抗所有的入侵者。"
 nick_last_polish_pagan_desc: "约兰塔不知疲倦地工作，以恢复一个早已消失的时代。她功业的徒劳正在慢慢地使她发疯。"
 nick_crooked_eye_desc: "瓦尔普尔加像老维京人一样在海上游荡。即使阿萨神族已死，她也不打算很快停下来。"
 nick_the_valkyrie_desc: "布伦希尔德被奥丁亲自选中，亲自挑选值得为他的事业而战的英灵战士。现在，她打算领导他们。"
 nick_first_lilin_desc: "胡克罗斯找到了《黑暗之母启示录》，现在正在向那些愿意听的人传播真理。"
 nick_the_nubian_desc: "沙巴卡激励冈格罗寻找一个值得为之奋斗的事业。许多人寻找这位具有异国情调的黑皮肤人，学习他的智慧。"
 nick_the_night_general_desc: "芭芭雅嘎的副手是个品德高尚的人，忠诚到极点。他领导着她的军队，并将听从她的命令，甚至在必要时对抗可怕的上古耆宿。"
 nick_the_reaver_desc: "一个过往时代的遗留，仍然在远航，期望未来的夜晚会更好。"
 nick_diplomatic_shaman_desc: "易扬伽用巧妙的伎俩和欺骗猛烈地保护着她的人民。她话语的力量可以创造英雄，逼退亲王。"
 nick_scion_of_constantinople_desc: "托马斯欠君士坦丁堡一切。而且他想通过任何必要的手段来偿还他的债。"
 nick_warlord_of_avalon_desc: "密特拉的忠实战将在他所有的战斗中都带着他强大的后援的权威和友谊。"
 nick_veela_priestess_desc: "一个过往时代的遗留，试图阻止十字对她土地的冲击。"
 nick_shadow_prince_desc: "马克知道，真正的掌权者不一定坐在王座上。"
 nick_god_river_of_darkness_desc: "勒森魃是黑暗本身，与唯一配得上的敌人——太阳进行战斗。"
 nick_latin_tyrant_desc: "阿丰佐赢得了君士坦丁堡。但他不得不在这个过程中破坏它，现在统治着一个充满了过往幽灵的废墟城市。"
 nick_true_believer_desc: "第三该隐即将降临。只有配得上的人才能在他到来时得到奖赏。"
 nick_sword_of_alandalus_desc: "巴德尔背负一个垂死文化的希望。她选择以残酷的方式战斗，使其得以存续。"
 nick_lord_of_shadows_desc: "西尔维斯特领导着再征服。但他的敌人可能比他想象的更接近他。"
 nick_repudied_daughter_desc: "父亲忌讳他的女儿，使她成为终身宿敌。而西比尔打算活得足够长，以看到她的复仇。"
 nick_the_praetorian_desc: "禁卫军是在罗马最优秀的烈火中锻造出来的，他们是雄心勃勃的战争和阴谋的大师。成为吸血鬼并没有真正改变什么。"
 nick_the_upstart_desc: "由于格拉齐亚诺（自称）具有无以伦比的天赋，他应得一切。可悲的是，许多人似乎并不同意这简单的事实。"
 nick_dutiful_sire_desc: "傅切佛斯是著名的新晋勒森魃的导师。他的教诲可能很严厉，但最终总是富有成效。"
 nick_guardian_lasmedulas_desc: "马塞卢斯总是被吸引回塑造他的矿场，他在保护这个唯一能让他想起自己过去的地方中找到了慰藉。"
 nick_the_subtle_shadow_desc: "德·波朗科善于长线钓大鱼，且并不为此害臊。严酷而又可敬，很少有人会低估他在小计和大计方面的才能。"
 nick_hero_of_the_reconquista_desc: "特乔·布拉沃与熙德本人并肩作战，但在路上却忘记了他朋友的故事的真正教训。"
 nick_cardinal_maledictus_sanguine_desc: "阁下是由上帝推动的。他的所有行为，从善意的到可怕的，都是祂计划的一部分。"
 nick_the_independent_desc: "远离他人的争吵是一种美德，但也会导致缺乏盟友。"
 nick_the_mistake_desc: "阿什拉派社会有说：你的错误不会困扰你。相反，他们叫你尊长。"
 nick_the_prodigal_daughter_desc: "露西塔对她生活中的所有束缚大发雷霆。但是，当一个都不剩的时候，会发生什么？"
 nick_intense_venus_desc: "阿科尼亚充分体验一切，不受任何想让她沉沦的人或物的困扰。"
 nick_king_of_rome_desc: "有些称号是由功绩赢得的。另一些则是自我宣称的。这就是后者。"
 nick_lasombra_guardian_desc: "她对她的黑暗父亲充满了热情，为了保护他，她会不惜一切代价。"
 nick_latin_dissenter_desc: "在拉丁人的背叛和暴政的海洋中，加布里埃拉是一小滴和平共处解决方案。"
 nick_the_hound_desc: "塔利从未失去对猎物的追踪。但有时，即使是最好的猎犬也会对主人的绳索产生反感。"
 nick_traitor_prince_desc: "加莱亚佐的忠诚就像风一样变幻莫测。也许实际上更易变。"
 nick_smiling_mastermind_desc: "彼得罗正在为塔尔玛埃拉的未来做准备。在他轻松的笑容背后，是计中计。"
 nick_crafty_ambassador_desc: "在暗影之家族，大使们可以像刺客一样致命。"
 nick_mad_prince_desc: "只是我和我的廷臣们的头骨们在享受一顿美餐。没什么可看的。"
 nick_prince_of_the_mad_desc: "罗克以一名黑夜领袖所需要的偏执来统治他的人民。也许更多。"
 nick_the_greek_relic_desc: "如果你在雅典，就要像古希腊人一样行事。"
 nick_the_sybil_desc: "特黎佛撒看到了未来，并根据这些景象采取行动。见证和创造历史之间的界限在哪里？"
 nick_the_mortified_one_desc: "每一道伤疤都提醒我们知识和智慧的代价。这一切最终都是值得的。"
 nick_deadly_devoted_desc: "春军为她的信念而战，其热情在她冷酷的族群中很少见。"
 nick_cainite_krive_desc: "为失去的人和即将失去的人而战。"
 nick_abbess_of_cain_desc: "赞美黑暗之父，以便他有一夜能回到我们身边。"
 nick_old_man_hate_desc: "聪慧亲王、伊科托米、末卡维所含之物、巴比伦人、魔鬼扈从、噬愚者。谁知道那个才是？"
 nick_the_syracusan_desc: "阿尔基亚斯与他的罗马盟友一起坚定地对抗迦太基的恐怖，然后为他的勇气付出了代价。"
 nick_holy_harbinger_desc: "阿纳托尔听到了上帝的声音。这位蒙福的人可以是你最亲密的朋友，也可以是你最致命的敌人。"
 nick_typhoid_mary_desc: "玛丽用她的疯狂来偿还她的善良，她在世界徘徊，寻找失去的伴侣。"
 nick_his_own_enemy_desc: "以扫被锁定在与雅各的致命斗争中。一个人的思想的可以成为他本人的最可怕敌人。"
 nick_the_twice_damned_desc: "以利米勒试图为最大的罪行赎罪，但结果只是在恐怖中陷得更深。"
 nick_the_lion_of_bactria_desc: "曾与最伟大的将军并肩作战，拉多赢得了他作为著名的士兵亲王的声誉。"
 nick_dark_thaumaturgist_desc: "泽特勒为最黑暗的神明做事，他甚至会让最堕落的棘秘魑惊恐地退缩。"
 nick_of_cruel_appetites_desc: "捕食最易得的猎物并不能使你成为捕食者。它使你成为一个懦夫。"
 nick_master_of_ravens_desc: "恨、爱与疯狂沸腾为一体。三眼乌鸦将人们引入歧途。"
 nick_great_liar_desc: "也许连这绰号都是假的。"
 nick_relentless_fury_desc: "怀恨在心是她几个世纪前就掌握的一种艺术。"
 nick_voice_of_kupala_desc: "听到黑暗之神的声音是一种诅咒，而不是一种祝福。"
 nick_witness_end_times_desc: "直到终末，他仍将见证。"
 nick_the_littlegrandmother_desc: "她正在保护她的族人免受一个可怕怪物的伤害。但她能保护他们免受她的伤害吗？"
 nick_the_defender_desc: "由于命运的安排，约瑟夫被推到了亲王的位置上，但他仍然首先考虑的是他的大家庭。"
 nick_the_one_that_got_away_desc: "被狩猎者本人狩猎，永远的逃亡是唯一的选择。"
 nick_hope_of_the_clan_desc: "在他们受诅的始祖和癫狂的鬼婆之间，安吉瓦作为诺斯费拉图未来的希望而自豪地站在那里。"
 nick_master_of_denmark_desc: "阿布萨隆创造了丹麦。但他能控制它吗？"
 nick_guardian_of_holy_cities_desc: "塔利克只对最无上的呼唤作出回应，即信仰本身。"
 nick_the_salt_queen_desc: "在发现自己被困在克拉科夫的盐矿之后，古特卡的整个身躯已经变得怪异无比。"
 nick_the_spared_desc: "被该隐本人赦免或在精神上而不是身体上受到诅咒，没有人知道关于伊玛的真相，但许多人正在寻找。"
 nick_witch_of_paris_desc: "在巴黎还没有出现的时候，谟涅摩就在这里了。在它不再存在之后，她可能还在这里。"
 nick_chosen_of_michael_desc: "马拉希底斯在米迦勒的幻梦中看到了救赎。他现在承担着代替他将其发扬光大的重任。"
 nick_gentle_annie_desc: "不要让你的羔羊或子嗣在夜晚单独呆着。"
 nick_golden_son_desc: "看来救赎是以金币为代价的。"
 nick_preacher_of_sin_desc: "远赴各地传扬自由的福音，但最后总是要回乡。"
 nick_the_accursed_monster_desc: "与魔鬼打交道会使你成为魔鬼，除非你已经是魔鬼。"
 nick_prince_of_dirt_desc: "由于吸血鬼在很长一段时间内无法进入亚柯，艾蒂安被讽刺地称为尘土亲王。即使在获取城市之后，他仍然保留了这个称号，作为对他过去的谦卑提醒。"
 nick_the_general_desc: "永恒的战争需要永恒的将军。查古拉普夏就是这样的人。"
 nick_the_rakshasa_of_rakshasas_desc: "魔鬼或救世主，哈济梅尔可能都是。"
 nick_the_vaisya_desc: "拉美苏骄傲地以商人的身份出场，将埃及和他的家乡印度融合在一起。"
 nick_kind_mentor_desc: "所有的英雄都需要一位慈祥而耐心的导师。他们不可能比突伽·辛做得更好。"
 nick_rising_star_desc: "一颗新星在巴格达诞生。但蒙古人的影子却越来越近。"
 nick_avaricious_prophet_desc: "信仰还是利益？为什么不能两者兼顾？"
 nick_the_vengeful_apprentice_desc: "佐伊为她的导师报了仇，在这个过程中几乎迷失了自己。向阿纳托尔学习拯救了她。"
 nick_careless_pawn_desc: "在这个伟大的棋局中，这个人只是跌跌撞撞地走着，被他的（许多）棋手所玩弄。"
 nick_black_mother_desc: "迦梨看到了雷伏诺内部的分裂，并将自己从他们身边移开。但她会在他们需要的时候回来。"
 nick_driven_knight_desc: "菲迪米亚对骑士精神了如指掌。她希望雷伏诺氏族的全体成员也能这样做。"
 nick_thelionessofjerusalem_desc: "卡维娅以其大胆的行动在耶路撒冷掀起了风暴。如果萨洛比的迷途幼童需要一个母亲来团结他们，他们不必再去寻找。"
 nick_the_wise_counsel_desc: "战士必须由医者来平衡。行动必须由思考来平衡。"
 nick_singer_of_peace_desc: "她将为我们唱到最后。也许这就足够了。"
 nick_the_flaming_sword_desc: "萨洛比的典范死时依然持剑，他的职责似乎已经完成。"
 nick_the_retribution_desc: "即使是和平主义者也会被逼得太紧。"
 nick_dedicated_warrior_desc: "雅亿为了让她的氏族的真正使命能够在他们不可避免的崩溃中幸存下来而战斗。"
 nick_last_historian_desc: "萨洛比将终结，但希望他们的故事能在他们身上延续。"
 nick_divine_punishment_desc: "她会惩罚那些对不起她的族人的人，即使这意味着最终杀死自己。"
 nick_the_last_elder_desc: "最后一张多米诺骨牌倒下了。"
 nick_sword_of_vengeance_desc: "救赎已经太晚了，但对复仇而言依然来得及。"
 nick_typhon_desc: "我们的救赎，我们的自由，只能以我们的灵魂为代价。"
 nick_the_first_son_desc: "当你先认识化为人的神祇时，追随他会更容易。"
 nick_the_voice_of_reason_desc: "在一群自私自大的不朽者组成的议会里，当唯一保持清醒的声音，可太不容易了。"
 nick_the_sorceress_desc: "对黑暗技艺的掌握，其程度超越了人的想象。"
 nick_the_beloved_of_the_moon_desc: "赛特可能从未真正爱过。但如果他有，玛阿特卡拉就是那人。"
 nick_he_who_lives_desc: "传颂赛特的荣耀，无论他走到哪里，都会促进自由和自主。"
 nick_snake_among_snakes_desc: "几乎没有什么概念或人是萨拉金还没有背叛的。至于其他的？只要给他时间。"
 nick_daughter_of_hel_desc: "蛇有很多形式，其中有些形式比其他形式更值得赞美。"
 nick_opportunistic_preacher_desc: "赛特不会介意你在传播他的话语时快速获利，对吧？"
 nick_set_worst_nightmare_desc: "而伊西斯的最后一个女儿从未崩溃。她的复仇将在一夜之间吞噬一切，包括她自己。"
 nick_fire_child_desc: "火之庭的女主人是赛特之子的典范，无论好的还是坏的方面。"
 nick_queen_of_europe_desc: "娜芙蒂蒂更喜欢在真正实现成就之前得到成就的名声。"
 nick_born_from_fire_desc: "她的红发是来自赛特的祝福，她大胆地开始了她的旅程，以了解他的奥秘。"
 nick_the_serpent_of_paris_desc: "光明之城有更黑暗的一面。让·巴蒂斯特就是经营它的人。"
 nick_champion_of_set_desc: "一代又一代地承担着保护赛特的任务，库弗从未失职。"
 nick_third_vessel_of_iniquity_desc: "在火之庭，失宠是一种受完善的艺术。"
 nick_the_blossom_desc: "以诺城的美丽少女因为她的虚荣心而被诅咒，也可能是因为她让别人过多地想起了他们所失去的东西。"
 nick_patriarch_of_constantinople_desc: "米迦勒创造了一个幻梦，然后把它变成了噩梦。"
 nick_red_empress_desc: "被政变的鲜血染红的萨莉安娜终于得到了她的自由，但没得到救赎。"
 nick_la_noire_desc: "她的摩尔人血统为埃丝克拉蒙德赢得了这个粗俗的绰号。但她已经把它变成了专属的，现在还自豪地戴着它。"
 nick_king_of_roses_desc: "艾蒂安是女王中的唯一国王，他知道如何混入阴影中，并从中获利。"
 nick_la_juste_desc: "香槟的美丽少女在所有事情上都是公平的，除了当她的孩子气幻想迫使她时。"
 nick_saint_desc: "这圣人已经落得很深了，而且还没有看到坑的尽头。"
 nick_living_tragedy_desc: "她的人生将是神话，她的悲伤将是别人的娱乐。"
 nick_charming_con_man_desc: "对这人的信任只限于撇到他。或者更好的是，根本不要相信他。"
 nick_the_blue_desc: "诸神黄昏将需要它的吟唱诗人。卡尔已经准备好成为那人。"
 nick_empowered_childe_desc: "一个人的失踪就是另一个人的机遇。"
 nick_fallen_prince_desc: "除了对子嗣的爱之外，骄傲而睿智的老苏丹没有留下什么。"
 nick_fairy_of_lusignan_desc: "远离那使圣洁和不洁的人都逃离她的妖精。"
 nick_goddess_among_mortals_desc: "他们看到海伦，正沿着城墙走来，便压低声音，交换起长了翅膀的话语：“好一位标致的美人！难怪，为了她，特洛伊人和胫甲坚固的阿开亚人经年奋战，含辛茹苦——谁能责备他们呢？她的长相就像不死的女神，简直像极了！”"
 nick_shield_of_the_north_desc: "北欧的保护者知道，如果使用得当，盾牌可以成为致命的攻击性武器。"
 nick_le_vieux_desc: "赫拉德的五官明显显老，他更关心的是他的地位，而不是他被玷污的声誉。"
 nick_iceland_shieldmaiden_desc: "在远离大陆的地方，古老的传统被一个凡生相信这些传统的人保留了下来。"
 nick_careless_hedonist_desc: "如果说人生是一场戏，那么伊欧提乌斯打算把它活得淋漓尽致。"
 nick_lover_of_beauty_desc: "被艺术的宏伟愿景所蒙蔽，人们很容易落入更多世俗的陷阱。"
 nick_immortal_sword_maker_desc: "锻炉仍然燃着。即使它的主人不在了。"
 nick_bloody_rose_desc: "这朵玫瑰上只剩下了刺。"
 nick_broken_poet_desc: "他的才华给了他一切。现在，他的才华又夺走了他的一切。"
 nick_artisan_rose_desc: "任何时刻都可能是我们的最后时刻。因为我们注定要灭亡所以一切都更加美丽。你永远不会比现在更可爱。我们将永远不会在这了。"
 nick_le_chansonneur_desc: "没有人怀疑这吟游诗人，直到为时已晚。"
 nick_the_muse_desc: "凯瑟琳激励人们做到最好，她对他们的期望不低。"
 nick_bahari_prodigy_desc: "安托瓦内特对莉莉丝的奉献，只有她在粉碎对手时的快感才与之相称。"
 nick_muse_of_sculpture_desc: "米迦勒需要灵感，并在其追随者的思想和心灵中寻找灵感。"
 nick_the_dove_desc: "他们升得越高……"
 nick_muse_of_architecture_desc: "米迦勒需要灵感，并在其追随者的思想和心灵中寻找灵感。"
 nick_first_fallen_desc: "古蛇鞭打大天使的追随者，引诱他们走向毁灭。"
 nick_hope_of_damascus_desc: "在大马士革的绝望之井内，玛娜尔像一盏顽强的明灯一样闪耀。"
 nick_outsider_queen_desc: "在外参与棋局会导致最意想不到的结果。"
 nick_first_among_equals_desc: "七人议会是平等的。埃特里乌斯只是比他人更平等。"
 nick_magus_prince_desc: "当其他人专注于深奥的事务时，罗萨琉斯确保睿魔尔在需要的时候有一个可以求助的家。"
 nick_the_lightbearer_desc: "他是我们信仰的对象，是无数牺牲背后的意义——毕达哥拉斯派、清洁派、共济会、炼金术师——都在黑暗中挣扎，以便有一天，在几代人之后，有一人可以手握禁果，贤者之石，永生灵药。他的名字叫格拉崔克斯，我们的光明使者，我们的普罗米修斯，我们的路西法。"
 nick_eye_of_the_storm_desc: "当风暴肆虐并威胁要将金字塔拆散时，梅琳达仍然是这一切的平静和冷静的中心。"
 nick_the_brash_desc: "卡尔德隆并不轻视侮辱。他的怒火与传说中的布鲁赫的不相上下。"
 nick_the_smiling_envoy_desc: "在这个微笑的背后是野心和狡猾。一个致命的组合。"
 nick_the_bane_of_mistridge_desc: "祸害迷雾峰败亡，一个时代的结束，一个缓慢而痛苦的终结的开端。"
 nick_watchful_eye_desc: "泽维尔在别人看到问题时查看答案。这可能是他取得胜利的关键，也可能是他的败笔。"
 nick_no_one_pawn_desc: "鲁托尔再也不会被他人束缚了。至少不是公开的。"
 nick_goddess_of_strife_desc: "德维拉听到特亚维的呼唤，准备好她最可怕的魔法来回应他的战斗呼唤。"
 nick_servile_envoy_desc: "不满可以是一个强大的激励因素。热尔韦现在知道自己的位置，但不会永远满足于此。"
 nick_golden_lane_desc: "阿丹出生在布拉格，曾经是这里的秘所的主人，他把他街道的名字带到了不死族间。"
 nick_master_librarian_desc: "如果知识真的是力量，那么就应该惧怕塞莱廷。"
 nick_master_of_spies_desc: "谁能窥探密探大师？"
 nick_foppish_magus_desc: "最终，他可能是笑到最后的人。"
 nick_pyramid_climber_desc: "一步一步来，不计代价。"
 nick_iron_maiden_desc: "杀手之种或恶魔之种。魅惑，财富，痛苦。将再次加入战争，血是自由的污点。你不要再为我的灵魂祈祷。"
 nick_insightful_charlatan_desc: "听傻瓜说话的人是聪明人还是傻瓜？"
 nick_great_mother_desc: "她美丽、完美的造物必须得到保护。即使要推翻一座金字塔来实现这一目标。"
 nick_the_eldest_desc: "没有人真正知道这实体最初的名字是什么。对他的氏族来说，他只是他们中的第一位——最长者。"
 nick_the_manyarmed_desc: "嘲讽印度诸神的迦𫄨里璃试图在精神和形式上冒充战神迦𫄨吉夜。"
 nick_the_white_god_desc: "作为雾和雪的掌控者，比洛博格很快就被他的立陶宛本土同胞称为白神。"
 nick_corruptor_of_legions_desc: "诺利兹在追求权力的过程中毁灭了许多人。现在，他只为自己扭曲的快乐而毁灭。"
 nick_monster_among_monsters_desc: "即使是怪物也会害怕什么。特别是如果那什么叫海德翁。"
 nick_bane_of_wolves_desc: "罗斯托维奇与狼人的恩怨是传奇性的。这是他最喜欢的称号，提醒大家即使是令人畏惧的狼族也害怕他。"
 nick_mistress_of_hunedoara_desc: "一座被诅咒的城堡需要一个有足够狡猾和固执的女主人来看管。"
 nick_the_butcher_of_rus_desc: "达瓦保护的正是他曾发誓要摧毁的城市。只有他才能被允许给它带来死亡和绝望。"
 nick_the_seeking_sinner_desc: "通往知识的道路是漫长的，充满了乐趣。但要警惕过度沉迷。"
 nick_his_brothers_keeper_desc: "西默盎和格苏本应是一场幻梦的中心。他们的故事却使之成为一场噩梦。"
 nick_your_darkest_terror_desc: "因为他是噩梦的代言人，是居住在我们每个人体内的恐怖，等待着被释放到毫无警戒的世界。"
 nick_the_noble_born_desc: "塔巴克试图成为高尚者。他大概会最终成为一位愚者。"
 nick_the_puppet_prince_desc: "谁在牵线？"
 nick_herald_of_caine_desc: "第三该隐将来到这里，在一场血腥性爱狂欢中为有资格的人祈福。只有到那时，救赎才会真正到来。"
 nick_holy_spirit_desc: "圣灵已经从君士坦丁堡消失了，但并没有忘记它。幻梦将继续存在，无论如何。"
 nick_tzimisce_favorite_desc: "当世界最终被吞噬时，兰巴赫将是最后一位存活的人，惊恐地看着他的噩梦变成现实。"
 nick_blood_breaker_desc: "卢戈将领导一场革命。但也许不是他打算的那种。"
 nick_senescent_master_desc: "拉杜给混乱的军督领带来了平静和纪律，但他的笑容从未到达他的眼睛。"
 nick_hammer_of_the_tremere_desc: "当其他军督争吵和密谋时，伊万正单枪匹马地赢得对睿魔尔的战争。"
 nick_the_deal_broker_desc: "在争吵不休的棘秘魑之间进行调解，确实有助于为自己的外交赢得良好声誉。"
 nick_mother_of_horrors_desc: "即使是恐怖之物也需要爱他们，保护他们的母亲。"
 nick_alien_hunger_desc: "安德莱昂深情地凝视深渊。而它也确实回视了他。"
 nick_the_sculptor_of_wolves_desc: "狼确实是女士最好的朋友。"
 nick_dark_lord_tzimisce_desc: "响起帝国进行曲"
 nick_clever_monster_desc: "加比亚将他的聪明才智隐藏在一个可怕的面具后面。那些没有及时刺破它的人已经死了。"
 nick_diligent_autocrat_desc: "照看她羊群的牧人。毕竟保护自己的次级是贵族的职责。"
 nick_scholar_of_enlightenment_desc: "变化是生活中唯一不变的东西，也是唯一值得研究的话题。"
 nick_fiend_among_fiends_desc: "科班在战争中的可怕战术保证了他在拔出武器之前就取得了许多胜利。"
 nick_fiendish_knight_desc: "忠于她的领主，卡拉表明怪物之间也可以有荣誉。"
 nick_artist_of_screams_desc: "真正的夜之交响乐。"
 nick_the_unquenchable_desc: "无底的恐怖必须被喂养。"
 nick_sister_of_blood_desc: "迦𫄨里璃的血腥右手将让她敌人获胜之前使大陆淹没在血中。"
 nick_vroi_goddess_desc: "一位失落时代的失落民族的女神，被命运的心血来潮抛到了当前的夜晚。"
 nick_master_of_hellhounds_desc: "万千血肉的雕塑家和对任性军督的复仇者"
 nick_test_subject_desc: "忍受永恒煎熬只为一个更高尚的目的——知识。"
 nick_the_main_antagonist_desc: "只有击败布克迪拉卡才能赢得救赎。"
 nick_the_lord_of_the_night_desc: "梵卓本人的统治权是由该隐本人赋予的。然而，他的死亡权是由他的血之兄弟姐妹们给予的。"
 nick_sybaritic_mastermind_desc: "布尔斯库曾经有最大的潜力可挖，却在颓废和奢华中挥霍殆尽。不是每个人都能成为卡米拉。"
 nick_lord_of_light_desc: "密特拉万岁，伦敦之主，光之亲王，不列颠的征服者，太阳和光明的使者！愿他的神性超越诅咒，给我们带来救赎！"
 nick_the_graceful_tyrant_desc: "亚历山大经常被误认为是妥芮朵，他在年轻美丽的面具下隐藏着冷酷的傲慢。"
 nick_sword_bearer_desc: "约根是哈德施塔特和整个梵卓的剑。但即使是这完美的武器，有一天也会有自己的野心。"
 nick_roman_relic_desc: "茱莉亚代表了罗马的精华所在。对许多人来说，她是一个值得学习的榜样，也是一个值得仔细聆听的导师。"
 nick_bitter_ender_desc: "克瑞透斯不断变化的忠诚会让他做出非常无把握的选择，有时甚至是非常代价高昂的选择。"
 nick_ingenious_daughter_desc: "伊尔丝看到了不祥之兆，凡人是她准备解决的一个威胁。然而，她可能低估了离家较近的威胁……"
 nick_iron_fist_desc: "为了实现他的巨大野心，古斯塔夫将不惜一切代价，即使是让世界陷入战争。"
 nick_the_last_saxon_desc: "他的民族早已不在了，埃里克看了看他们的后裔，发现他们都很优秀。不过，他的世系还是显示出了希望。"
 nick_the_father_desc: "安东尼乌斯在三人组中的作用是很重要的。但即使是永生的幻梦也必须在某一点上结束。"
 nick_the_boy_king_desc: "寻找神性，安提诺乌斯只找到了永生。这是他至今仍不确定的交易。"
 nick_palace_prefect_desc: "米迦勒的幻梦是以拜占庭帝国为蓝本的，它的许多头衔都被这两个实体所使用。"
 nick_prince_in_waiting_desc: "安娜在凡生中被剥夺了她与生俱来的权利。她不会让最终在亡生中得到的机遇与她擦肩而过。"
 nick_caesar_magister_desc: "米迦勒的幻梦是以拜占庭帝国为蓝本的，它的许多头衔都被这两个实体所使用。"
 nick_the_military_prefect_desc: "贝利撒留在亡生继续做他凡生所做的事：光荣而勤奋地服务于君士坦丁堡。唯一使他最终偏离这一方向的是爱情。"
 nick_the_eastern_praetorian_prefect_desc: "米迦勒的幻梦是以拜占庭帝国为蓝本的，它的许多头衔都被这两个实体所使用。"
 nick_the_domestic_prefect_desc: "米迦勒的幻梦是以拜占庭帝国为蓝本的，它的许多头衔都被这两个实体所使用。"
 nick_pontifex_maximus_desc: "从卑微的开始到颓废的结束，卡米拉就是罗马。中世纪的罗马不再向执政官鞠躬，而是向教宗鞠躬？那就这样吧，忘掉永恒执政卡米拉，向最高教长卡米拉致敬！"
 nick_ambitious_pretender_desc: "为丹麦很值得作出一些牺牲。特别是如果其他人做出这些牺牲。"
 nick_honor_incarnate_desc: "卢修斯已经看到太多的人屈服于野心和贪婪，再也不能袖手旁观了。他将一如既往地忠实于自己的诺言，保护最神圣的城市。"
 nick_true_loyalist_desc: "马库斯真正相信密特拉的大业，是他最信任的副手。没有什么能动摇这样的关系……是吗？"
 nick_opportunist_crusader_desc: "埃翁成功地从阿尔比派十字军的混乱中脱颖而出，成为一名胜利者。他现在被仔细观察，而不是被低估。"
 nick_illprepared_king_desc: "若弗鲁瓦想对他的尊长进行报复，他得到了这个机会。并没有那么好的计划此后的下一步。"
 nick_fallen_countess_desc: "萨维拉曾经是法兰西最有影响力的该隐之子。但随着她记忆的恢复，她明白她失去的远不止是她的权力。"
 nick_knight_black_cross_desc: "卢克丽霞凭着她的力量和忠诚赢得了战斗的权利。她将与她的领主站在一起，直到最后。"
 nick_rome_advocate_desc: "拉文纳曾经是罗马世界的中心。莉薇娅没有忘记，并希望它可能再一次成为现实。"
 nick_little_wolf_desc: "阿里乌主义的最后一位捍卫者仍然对天主教怀恨在心。他现在有了永生，可以按照他的形象重塑它。"
 nick_bane_carthage_desc: "迦太基必须毁灭！如果加图是打倒迦太基的演说家，那么吕山德得就是那把剑。"
 nick_patient_rebel_desc: "远离政治中心，让自己被遗忘可能是最明智的行动。"
 nick_old_warrior_desc: "一个靠剑生存的人可能反而会死在匕首下。"
 nick_heir_to_the_throne_desc: "该隐的黑王座虚位以待。阿娜佳整个亡生都在为它做准备。"
 nick_last_crusader_desc: "贡多马尔在第四次十字军东征中失去了一切。为了他死去的领主，他将努力挽救还能挽救的东西。"
 nick_dutiful_son_desc: "文策尔在所有事情上都尊重他的尊长，就像一个好子嗣应该做的那样。有时，他担心这可能是他们两个人的结局。"
 nick_hungarian_overlord_desc: "诺娃·阿尔帕德认为自己是一个密谋大师和匈牙利的未来。可悲的是，现实有一种倾向，就是没有梦想那么美好。"
 nick_agent_of_god_desc: "一个无情而残酷的神明不可能会想要比格扎·阿尔帕德更好的代理人。"
 nick_scion_of_the_republic_desc: "阿奎莱亚经受住了罗马帝国的考验，并在阿提拉的肆虐后重建。它的亲王也是如此。"
 nick_unconcerned_soldier_desc: "何必麻烦？反正我们都已经死了。"
 nick_merchant_crusader_desc: "霍斯特作为一个商人是乏善可陈的，他知道作为一个十字军战士，他将更加糟糕。"
 nick_the_wise_and_prosperous_desc: "朦胧的真相围绕着这个人，最深的谜团只有少数人知道。"
 nick_the_explorer_desc: "有这么多东西需要探索，而我的永生却只有这么一点时间！"
 nick_the_level_headed_desc: "冷静、沉着、镇定地度过了一天。和一夜。"
 nick_father_of_emperors_desc: "一个忠诚士兵的动荡生活，得到了永生躯体和永恒名声为回报。"
 nick_battle_maiden_desc: "在阿尔忒弥斯冲进迦太基之前，梵卓从未表现出如此勇敢的精神。而且可能再也不会有了。"
 nick_historian_kindred_desc: "一个有价值的，即使从未达成的努力。"
 nick_born_seneschal_desc: "真的，这个人生来就是为了效忠，永远不会举手反对他的主人。真的。"
 nick_master_of_diplomacy_desc: "如果狼人在我门前嚎叫，这就是我想在我身边的人。"
 nick_drakonskyr_desc: "她用她整个灵魂进行斗争。但是，最终，唯有黑暗。"
 nick_tired_warrior_desc: "太多的战斗，太多的战争，永生有时也不会提供喘息的机会。"
 nick_tricked_prince_desc: "现在谁才是傻瓜？"
 nick_respected_hostess_desc: "到我家来，享受它的乐趣。没有任何附加条件……如你所见。"
 nick_the_chess_master_desc: "谁是卒，谁是王？"
 nick_the_light_wrath_desc: "菲迪米亚燃烧的热情将清洗不义之人……以及除他们之外的许多人。"
 nick_customs_officer_desc: "他们想笑就笑吧，他们最终还是要通过这里。"
 nick_lost_warrior_desc: "新的世界，新的时代。只有战争似乎是永恒的。"
 nick_the_wanderer_desc: "这个流浪者反而会找到那些迷失的人。"
 nick_distinguished_senator_desc: "元老院没有超过卡米拉的帝国的寿命，但元老们却超过了。"
 nick_power_hungry_beauty_desc: "在这个漂亮的面具背后是一位捕食者，已准备利用你的弱点。"
 nick_the_failure_desc: "即使是太阳神有时也会对子嗣做出一些可争论的选择。"
 nick_retired_rebel_desc: "所有的火最终都会熄灭。"
 nick_forever_searching_desc: "通往救赎的道路是漫长的，其结果可能并不像预期的那样有收获。"
 nick_serpent_of_the_family_tree_desc: "当树倒下时，蛇也跟着倒下。"
 nick_redbeard_desc: "最后，他在圣地面前找到了永生。"
 nick_warrior_search_war_desc: "有时，即使是嗜血的战士也想为一个有意义的事业而奋斗，以凝聚人心。"
 nick_daughter_of_jorvik_desc: "上帝并没有从维京人手中拯救英格兰。相反，祂让他们获得永生。"
 nick_the_freelancer_desc: "一把受雇的剑，也许是在寻找一个配得上的大业。"
 nick_defender_of_sin_desc: "即使是颓废和奢侈也应该有他们的斗士。"
 nick_mistress_of_mysteries_desc: "有些谜团最好还是成谜。"
 nick_utter_darkness_desc: "深渊看向他。深渊惊恐地退缩了。"
 nick_damnation_incarnate_desc: "在漫长道路的尽头，唯有黑暗。"
 nick_eyes_of_oblivion_desc: "一双让你自讨苦吃的眼睛！"
 nick_the_blackeyesofthewyrm_desc: "当她的孩子哀叹没有更多的世界可供征服时，佩塔尼奎亚准备完成对这个世界的征服。"
 nick_baal_hammon_desc: "迦太基被罗马人摧毁。但在他们到达该城之前，它就已经陷落了。"
 nick_great_enemy_desc: "这个世界已经没有希望了。只在缓慢的、痛苦的堕入疯狂和绝望。让我来结束它。"
 nick_first_sinner_desc: "真正认识自己并享受是存在的唯一真理。"
 nick_the_devils_advocate_desc: "上帝反而选择了自己代表自己。"
 nick_master_of_iblit_desc: "永恒的黑暗之井若隐若现，诱惑着它的主人越走越远。"
 nick_dark_priestess_desc: "重建迦太基需要作出一些……献祭。"
 nick_eldest_free_desc: "石人既是神话，也是人，他是该隐之子摆脱上古耆宿枷锁的希望。"
 nick_first_singer_desc: "许多发声者将及时加入她的行列，但没有人能够真正找到她。"
 nick_blood_stealer_desc: "这个窃贼可能永远不会被抓住，但他的罪行却在历史上产生了回响。"
 nick_lioness_of_britain_desc: "即使是狮子也会向太阳俯首。至少在它照耀的时候是如此。"
 nick_his_lady_shield_desc: "给她一切。因为她值得拥有一切。"
 nick_rose_au_loup_desc: "狼群在花园里肆虐，奇怪地保护着这一朵带刺的玫瑰。"
 nick_loving_grandson_desc: "祖母有很多敌人，但在这人的眼皮底下，他们不会威胁到她。"
 nick_the_spiteful_desc: "一切都归功于你。世界只是还没有理解它。"
 nick_sword_ashirra_desc: "信仰需要守护者，但信仰也需要战士。"
 nick_the_oriental_desc: "未知者的吸引力，到了永生者的程度。"
 nick_spice_merchant_desc: "也许是在你的血中添加调料？"
 nick_refugee_desc: "远离家乡，希望能摆脱金字塔的阴影。"
 nick_slave_trader_desc: "处理泪和血、苦难和痛苦。"
 nick_warlord_of_jorvik_desc: "丹麦区已经消失。丹麦人没有。"
 nick_the_macedonian_desc: "远离家乡，享受着玩弄小地方的小狼的乐趣。"
 nick_grand_arhat_desc: "智慧永恒，为受诅的玉之战士带来救赎。"
 nick_red_dragon_desc: "在天空中高高翱翔，试图摆脱永生的烦闷。"
 nick_retired_empress_desc: "可使女皇退其位，然能使帝国退其皇乎？"
 nick_vengeful_concubine_desc: "他在她报仇之前就去了。他的追随者将代他承受。"
 nick_predator_of_akuma_desc: "怪物们也有害怕的怪物。"
 nick_first_akuma_desc: "第一个错误，第一个错误的选择，在通往救赎的道路上制造了偏离。"
 nick_rising_phoenix_desc: "从灰烬中获得救赎。"
 nick_ironhammer_desc: "她的名声是在一个个草原骑手的碾压下获得的。"
 nick_judge_steppes_desc: "他们相信他的话语，他们欢迎他的领导。但他们害怕他的到来。"
 nick_warden_dobrul_desc: "让他归来的时机还不成熟。但总有一夜。"
 nick_guardian_khan_desc: "他与世界的统治者一起骑行。即使是永生也无法与之相比。"
 nick_the_ressurected_king_desc: "奥西里斯实现了永生，但还是死了，然后成为亡者界域的统治者。相当不错的履历。"
 nick_grand_undying_king_desc: "荷塔蒙是吸血鬼能够得到救赎的证明。而他们因此而恨他。"
 nick_forgotten_osirian_desc: "远离大地，接近天空，是通往喘息、智慧和救赎的真正道路。"
 nick_queen_white_pearl_desc: "摩加迪沙是一个充满自由精神的城市。它的“女王”知道自己权力的限度，这使她更有影响力。"
 nick_god_of_storms_desc: "雷电，听我号令！"
 nick_rapacious_queen_desc: "拉曼加曾经被唾弃过，此后她复仇的野心只增不减。"
 nick_looking_for_loz_desc: "也许他在这下面？或者在那边？反正搜索是乐趣的一半。"
 nick_enforcer_of_angels_desc: "神圣的保护，由永生者给予。"
 nick_the_necromancer_desc: "不死，真死，永生，短生，亡灵术……令人困惑。"
 nick_would_be_queen_desc: "如此之近，却又如此之远。"
 nick_blodletting_bastard_desc: "即使在非洲，也能保持棘秘魑的巨大声誉。"
 nick_sleeping_abomination_desc: "让怪物呆在你的床底下。"
 nick_advisor_sultan_desc: "聪明的议员因其领主的盲目而受苦。"
 nick_center_of_gravity_desc: "一切都必须先经过她，但是，有时，根本就没有出来。"
 nick_mathilde_pawn_desc: "陷入她的网中，不太可能挣脱。"
 nick_great_morningstar_desc: "如果你能拥有一个真正伟大而光荣的称号，为什么要满足于一个随意的称号呢？"
 nick_most_glorious_protector_desc: "特鲁瓦有一个不寻常的保护者，这个保护者来自于很久以前的入侵者，但却留在了这里，并对这个城市产生了爱意。"
 nick_gardener_of_roses_desc: "最美丽的花，送给爱之皇庭的玫瑰们。"
 nick_queen_night_desc: "如此久远的背叛，给她留下了一个新的目的，即修补最深的分裂。"
 nick_enclume_desc: "不死族中最著名的铁匠以他的工作为荣，就像他曾经以与查理曼大帝本人同骑为荣一样。"
 nick_the_german_lackey_desc: "我们都有心中所好，这人至少知道它们。"
 nick_ruthless_politician_desc: "那是赘语么？"
 nick_the_black_pack_desc: "与狼群一起打猎，或者更多的时候是自己猎狼。"
 nick_reckless_promethean_desc: "乌托邦等不及！"
 nick_gond_and_bald_desc: "贡德讨厌鲍尔德。鲍尔德讨厌贡德。"
 nick_knight_lady_desc: "骑士精神，达到巅峰。"
 nick_fierce_independant_desc: "阿拉里克抓着拉着他的绳子，不知道还有很多人在上面等着他们。"
 nick_bane_sun_desc: "与太阳的斗争是徒劳的，但吸血鬼对这种战斗已经习以为常。"
 nick_killer_of_romans_desc: "一个永恒的怨恨，在其预期的受害者消失在历史中之后，仍在继续。"
 nick_unstoppable_desc: "一颗坚定的心在其最终目标前不受任何阻挡。"
 nick_the_sybarite_pirate_desc: "一次一个港口，他们欢迎他的离开，也害怕他的归来。"
 nick_noblesse_oblige_desc: "一个不朽的荣誉准则，不被变幻莫测的血统所打破。"
 nick_priestess_black_dragon_desc: "一次一个碎片，她越来越接近于在这个世界上释放出毁灭。"
 nick_slayer_of_gods_desc: "至少宣扬一下也无妨。"
 nick_feared_renegade_desc: "莉莉丝冰冷无情的怒火得以彰显。"
 nick_mongrel_lord_desc: "一个嘲笑和羞辱用的绰号，由于持有它的人的骄傲而变得强大。"
 nick_lesser_sibling_desc: "生活在一个人的阴影中这事可永久持续下去。"
 nick_resolute_soldier_desc: "战争。战争从未改变。"
 nick_beloved_exile_desc: "远离目光，只要[CHARACTER.GetSheHe]保持距离便受爱戴。"
 nick_izhim_weapon_desc: "一件忠诚到底的锋利武器，即使这将使她的氏族失去一切。"
 nick_holy_roman_emperor_desc: "他既不神圣，也非罗马，更非皇帝。"
 nick_yorak_eyes_desc: "字面意义上的。"
 nick_bear_slayer_desc: "被训练对抗野性的狂暴，以便成为野性。"
 nick_artful_faerie_desc: "受到美丽而神秘的妖精的恩惠，也许成了其中一员，从而失去了时间。"
 nick_bloodthirsty_knight_desc: "用鲜血洗刷的荣誉根本就不是荣誉。"
 nick_alamut_backup_desc: "从山上到半岛，试图拯救已经失去的人。"
 nick_pyromaniac_desc: "火的确很烫。"
 nick_carrion_thief_desc: "不要责怪腐尸，要责怪喂它的人。"
 nick_western_prefect_desc: "米迦勒的幻梦是以拜占庭帝国为蓝本的，它的许多头衔都被这两个实体所使用。"
 nick_protector_erciyes_desc: "监护那些永远不该再见到阳光的人。"
 nick_blue_princess_desc: "她从寒冷中走来，以迅雷不及掩耳之势冲进旧机构，留下自己的痕迹。"
 nick_voice_of_mithras_desc: "太阳神发言了，但即使他的声音也只能传到这么远。"
 nick_bully_prince_desc: "没有能力维护自己的权威，只能依靠残暴来弥补。"
 nick_tragic_romance_desc: "在亚莲恩策划的故事中，没有幸福到永远。"
 nick_warmaster_desc: "古代军团在他的指挥下行进。他的权威从未离开过他，即使他们早已不在了。"
 nick_last_hope_desc: "在她身上寄托着整个血系的希望，寄托着在一个更友好的世界中的潜在复兴。"
 nick_the_thief_desc: "过去是你的，现在是他的。"
 nick_master_mason_desc: "建设世界，一次搬一块石头。"
 nick_founder_of_the_camarilla_desc: "一场保护旧有传统的革命，从文字中开始。"
 nick_founder_of_the_sabbat_desc: "一场打倒世界的革命，在血开始。"
 nick_hound_lord_desc: "戈捷用火和怒气追猎魔鬼，无论它在哪里。上帝与他同在。"
 nick_heir_inquisition_desc: "利奥波德带着火把，在黑暗世界里提供了一束微弱的光。"
 nick_huntress_tomorrow_desc: "让娜可能是我们的未来。也可能对这个世界来说来得太早了。"
 nick_le_breton_desc: "坚毅的骑士受到同行的尊重，也受到敌人的畏惧。"
 nick_soul_acre_desc: "必须有人确保猎杀怪物的人不会自己变成怪物。"
 nick_god_scribe_desc: "上帝的律法，用圣洁的墨水写成，用来击打魔鬼。"
 nick_bane_witches_desc: "不要遭受女巫的困扰。点燃火堆，净化世界。"
 nick_holy_terror_desc: "对上帝的敬畏得以彰显。"
 nick_le_libraire_desc: "知识就是力量。但在神圣的教会中，力量并不总是受到欢迎。"
 nick_first_hunter_desc: "他是第一个看到真相并选择反击的人。剩下的就是历史所说那样。"
 nick_the_drillmaster_desc: "因为我很强，你不会喜欢我。但是你越是讨厌我，你就会学到越多。我很强，但我很公平。在这里，你们都是一样的无价值。"
 nick_family_brawn_desc: "他并不聪明，但他很强壮。"
 nick_the_unconquered_soul_desc: "从最令人发指的罪行中复生，享受着其的复仇。"
 nick_vampire_killer_desc: "今夜有比吸血鬼更糟糕的东西。比如我。"
 nick_knight_of_avalon_desc: "他们从圆桌上走来，忠于国王亚……密特拉？"
 nick_muse_of_renewal_desc: "米迦勒需要灵感，并在其追随者的思想和心灵中寻找灵感。"
 nick_scarlet_witch_desc: "她长着血之翼而来，准备释放出毁灭磨难，为她的野心扫清道路。"
 nick_flower_knight_desc: "如果战争是一门高尚的艺术，这人将是大师。可悲的是，它并不是。"
 nick_weary_crusader_desc: "战争会改变一个人。圣战也不例外。"
 nick_damned_sorceress_desc: "最后，对魔法的追求吞噬了一切。"
 nick_champion_champagne_desc: "锦标赛的赢家，女士们的斗士，无可指责的荣誉。"
 nick_le_fol_desc: "一个疯帽匠嘲笑高高在上的人，受到其疯狂的保护。"
 nick_fallen_templar_desc: "曾经离上帝如此之近，现在却如此之远。"
 nick_agent_of_chaos_desc: "秩序没有招使徒。"
 nick_lost_faerie_desc: "迷失在板讷世界里，掠食着过往之梦。"
 nick_of_broceliande_desc: "国王和传奇的诞生地。"
 nick_sable_rose_desc: "勇敢的骑士为配得上的功业而战.……或更阴暗的东西。"
 nick_freemason_desc: "秘密社团中的秘密社团，由卑微的建设者开始。"
 nick_the_master_desc: "哈德施塔特的严厉举止使他走得很远。总有一夜，整个梵卓氏族都会向他俯首称臣。"
 nick_the_alchemist_desc: "捏一捏这个，滴一滴那个……"
 nick_pragmatic_knight_desc: "残酷的战争很少是由理性推动的。但有时，它仍然是最理性的选择。"
 nick_blunt_instrument_desc: "主人挥舞的武器罢了。"
 nick_of_the_black_mountain_desc: "将导致她垮台的叛徒，没有看到阴影中的傀儡线。"
 nick_le_jeune_desc: "年轻不是行愚昧之事的借口。"
 nick_the_war_regent_desc: "睿魔尔正处于战争状态，为了家族的生存，智慧和学识必须退后一步。"
 nick_chosen_of_lazarus_desc: "她希望他回来。她为他的救赎祈祷。"
 nick_carnaval_moriendi_desc: "进入并享受吧！你将永远不会想离开……"
 nick_ringmistress_desc: "奇妙、疯狂和不可能的女主人有这样的景象要给你看。"
 nick_protector_portugal_desc: "海洋的英雄，高贵的人民。勇敢的，不朽的国家。今再一次扬起葡萄牙的辉煌！"
 nick_grail_lady_desc: "圣杯给了她力量，但并没有修补她的灵魂。"
 nick_traitor_among_traitor_desc: "永远不要背对着这人。"
 nick_compulsive_liar_desc: "我从不撒谎！"
 nick_grail_aspirant_desc: "寻求杯之救赎。"
 nick_envious_crusader_desc: "妒忌和羡慕，助长了对“神圣”事业的需求。"
 nick_mysterious_mentor_desc: "以身作则，慈悲为怀，使用神秘作为教材。"
 nick_foul_mouthed_philosopher_desc: "你说我什么了，你这狡猾的白痴？"
 nick_daughter_raven_desc: "让她在奥丁的国度里高高飞翔，直到诸神黄昏的残酷事实将她带回我们身边。"
 nick_ambitious_priestess_desc: "救赎可以给你带来力量，或者至少给她带来力量。"
 nick_the_epic_desc: "我们这个时代的第一个伟大的冒险，被该隐子嗣的诅咒所改变和扭曲。"
 nick_the_noah_desc: "在他自己身上，他带着被遗忘者的救赎。"
 nick_the_musician_desc: "夜晚的和谐在盛大的展示中被照亮。"
 nick_the_first_voivode_desc: "创造了压榨制度，直到今天晚上仍然使特兰西瓦尼亚窒息。"
 nick_vrol_warleader_desc: "一个失落部族的战士，仍在为她的女神而战。"
 nick_daughter_freya_desc: "被选中的战争之女，为那些不能作战的人而战。"
 nick_tireless_tracker_desc: "总是在狩猎，总是在抓捕她的猎物。"
 nick_lovestruck_valkyrie_desc: "爱在战场上开花结果。"
 nick_norse_hero_desc: "他们将歌唱他的事迹，他们将哀悼他的死亡。"
 nick_harmless_waif_desc: "这里没什么可怕的。"
 nick_bored_apprentice_desc: "厌倦是灵魂之死，也是忠诚之死。"
 nick_warden_caine_desc: "保护那些古老的地方，让它们的故事作为一种警告而存在。"
 nick_warden_ennoia_desc: "保护那些古老的地方，让它们的故事作为一种警告而存在。"
 nick_social_predator_desc: "只需看一眼就行了。"
 nick_the_eagle_desc: "在天空中高高翱翔，渴望着自由。"
 nick_daughter_venus_desc: "从水中升起，像太阳一样美丽。"
 nick_avatar_kupala_desc: "只是最黑暗的宿主的一个容器。"
 nick_angel_caine_desc: "总是在变化，在思想和形态的流动性中找到完美。"
 nick_ruthless_mercenary_desc: "在那里，要么杀，要么被杀。"
 nick_butcher_count_desc: "一个虐待狂的偷来头衔。后报肯定会随之而来。"
 nick_butcher_heir_desc: "怪物的骄傲和喜悦。"
 nick_butcher_knife_desc: "怪物的骄傲和喜悦。"
 nick_butcher_pride_desc: "怪物的骄傲和喜悦。"
 nick_alamut_voice_desc: "山脉之声，带着法官的威严。"
 nick_graverobber_envoy_desc: "来自骸骨之氏族的大使，在睿魔尔的中心寻找亲属关系。"
 nick_steward_ceoris_desc: "保持疯狂和致命的野心家的相对秩序。"
 nick_the_battle_hungry_desc: "战争可以充实一个人的灵魂，但它也可以吞噬它。"
 nick_bolsterous_berserker_desc: "带着笑容砍头斩首。"
 nick_charming_fanatic_desc: "理智族民的微笑，隐藏着信念的疯狂。"
 nick_careful_opportunist_desc: "等待合适的机会出击，从不看走眼。"
 nick_greedy_rebel_desc: "一切为了大业！也为了我！"
 nick_maltese_godfather_desc: "永生是一个你无法拒绝的提议。"
 nick_deluded_arrivist_desc: "野心会使人对自己的价值产生错觉。"
 nick_acclaimed_assassin_desc: "以杀戮为生，通过消除另一个人的名声来使自己出名。"
 nick_appeased_rebel_desc: "如果你打不过他们，就加入他们。"
 nick_family_monster_desc: "躲在家里的衣柜里，远离外人的目光。"
 nick_triumphant_warrior_desc: "胜利的滋味如此甜美又血香。"
 nick_mistress_mirrors_desc: "镜子里面有着超脱或受诅的机遇。"
 nick_oracle_knossos_desc: "诸神可能已经死亡，但他们的愿景依然存在。"
 nick_broken_empress_desc: "她再一次失去了一切。也许这一次是永远的。"
 nick_warlord_desc: "一个战争和战斗的大师，痛苦和屠戮的大师。"
 nick_dark_eyes_desc: "用她那双深渊之眼，她看到了许多。"
 nick_renaissance_ventrue_desc: "王者之氏族在不断发展，但王权却从未改变。"
 nick_modern_prince_desc: "一个现代时代需要一个现代的极权统治者。"
 nick_the_antediluvian_desc: "来自彼时的彼方之力，在这个世界上发动了大灾。"
 nick_sets_herald_desc: "腐败和自由之声，说着最蜜意的话语。"
 nick_broken_sword_of_alandalus_desc: "西班牙时代来临，摩尔人消失在时间的流沙中，他们的斗士孤独而被遗忘。"
 nick_vengeful_rose_desc: "即使在永生者中，爱情也不会永远持续。然而，仇恨……"
 nick_sniveling_coward_desc: "墓地里有很多勇敢的人。这人明白这个道理。"
 nick_cernunnos_desc: "作为凯尔特最伟大的英雄的继承人，布拉达像他们中最好的一样战斗、喝酒和调情。"
 nick_singes_cull_desc: "最后，你总是成为露西尔的笑柄。"
 nick_heir_firebird_desc: "银牙的英雄们是伟大的。甚至对他们的期望也更大。"
 nick_hidden_voices_desc: "伊冯娜听到了诸灵的声音。但最重要的是，她听到并遵循自己的内心。"
 nick_isis_wrath_desc: "奈斯将烧毁世界以最终阻止赛特。她只担心她会先焚尽自己。"
 nick_socialite_queen_desc: "从古埃及到今天的现代宫殿，没有人能够像内弗鲁海特那样以优雅和文明的方式举办宴会。"
 nick_the_roarer_desc: "聆听他的怒吼！"
 nick_crack_in_the_pyramid_desc: "这么小的裂缝不可能威胁到强大的睿魔尔金字塔……对吗？"
 nick_the_lord_of_war_desc: "战争是无法逃避的。只要它肆虐，阿瑞斯就会为它提供动力。"
 nick_blood_angel_desc: "贝撒列尔的美丽隐藏了他的真实本性。祈求它永远不必显露出来。"
 nick_horus_avenger: "复仇者"
 nick_horus_avenger_desc: "复仇者、归来的王、不死之子、独眼之王、活法老、第一重生者。"
 nick_vindictive_zealot: "怀恨的狂热者"
 nick_bloodfist: "血拳"
 nick_ruthless_snake: "无情之蛇"
 nick_eternal_fugitive: "永恒逃犯"
 nick_eternal_fugitive_desc: "没人相信你的话的负担确实很重。"
 nick_wizened_mercenary: "老练佣兵"
 nick_wizened_mercenary_desc: "战争的工具和伎俩，被用于更狡猾的目的。"
 nick_vengeful_flower: "记仇之花"
 nick_master_thief: "盗贼大师"
 nick_master_thief_desc: "她的生命被偷走了，她现在一块块地找回它。"
