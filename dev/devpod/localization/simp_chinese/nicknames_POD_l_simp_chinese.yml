 nick_eternal_seeker: "永恒探求者"
 nick_eternal_seeker_desc: "她一直在寻找她的另一半，那个从她生命中过早离去的人。"
 nick_unhindered_ages: "不忌岁月"
 nick_unhindered_ages_desc: "笑吧，让别人看不到你的眼泪。"
 nick_god_storm: "上帝的风暴"
 nick_god_storm_desc: "让娜是一个对信仰毫不妥协的女人。她的固执为她赢得了暗影裁判所的尊重。"
 nick_the_last_white_howler: "最后的白嚎"
 nick_the_last_white_howler_desc: "科鲁克是白嚎部族中最后一位逃脱被变成黑螺旋舞者的命运的成员。"
 nick_truthcatcher: "真理捕捉者"
 nick_philosopher: "哲学家"
 nick_philosopher_desc: "亚里士多德在中世纪穆斯林学者中被尊称为“第一位老师”，在托马斯·阿奎那等中世纪基督徒中则被尊称为“那个哲学家”，而诗人但丁则称他为“智者之王”。"
 nick_bonastruc_ca_porta: "门旁天使"
 nick_bonastruc_ca_porta_desc: "“门旁天使”是伊比利亚犹太人社区对他们最尊敬的学者的尊称。"
 nick_leaf_typhoon: "台风眼"
 nick_leaf_typhoon_desc: "在台风中心轻轻舞动的树叶，是佩玲在与科尔沁共事一段时间后给他起的绰号。没有比这更贴切的形容了。"
 nick_champion_dazbog: "达兹博格的斗士"
 nick_champion_dazbog_desc: "没有人能与战神的功绩相媲美，但这人一定会努力尝试。"
 nick_mouth_dazbog: "达兹博格之口"
 nick_mouth_dazbog_desc: "唯一能够解释神的旨意……并平衡其鲁莽战士的人。"
 nick_of_tronje: "特罗涅之人"
 nick_of_tronje_desc: "“特罗涅”也可能是乌尔比亚·图拉亚那殖民地，这是一个靠近现代克桑滕的罗马城市，也是齐格弗里德的出生地。这可以解释哈根对齐格弗里德年少时的事件和事迹似乎有着深刻的了解。同样，洪斯吕克山脉中的德罗内肯城堡小村庄的名字听起来像“特龙耶”，在中世纪，它的名字是“特龙埃克”，位于历史上的勃艮第王国。不远处的地名都暗指《尼伯龙根之歌》中的人物，尤其是哈根的亲戚梅斯的奥特温以及他的同事于诺尔特和沃尔克·冯·阿尔泽。根据德罗内肯周围的城堡，我们可以将奥特温分配给梅斯，哈根分配给德罗内肯，胡诺尔德分配给胡诺迪佩特拉（现在莫巴赫的胡诺斯坦），沃尔克分配给阿尔蔡。这些是旅客从克桑滕出发，经过梅斯和沃尔姆斯前往帕绍的途中经过的地方。"
 nick_lord_of_the_mountains: "群山之主"
 nick_la_bretagne: "布列塔尼"
 nick_eileen: "艾琳"
 nick_siren_of_the_rhine: "莱茵的塞壬"
 nick_kills_the_weak: "杀死弱者"
 nick_handmaiden_of_the_cursed: "被诅咒者的女仆"
 nick_handmaiden_of_the_cursed_desc: "拉蒙特的女族长已将法恩湾的费恩隐修院麻风病院作为黑螺旋舞者的聚集地。"
 nick_mistborn: "迷障之子"
 nick_mistborn_desc: "迷障是将妖精世界隐藏于人类世界的机制。它们在目标身上引发一种遗忘感，使其忽略奇魅行为，或将其视为妄想，或为所见之事找到“理性”的解释。不知出于何种原因，布兰杜夫与迷障有着特殊的联系，似乎并非完全属于这个世界。"
 nick_half_giant: "半巨人"
 nick_half_giant_desc: "法坎"
 nick_the_weeper: "哭泣者"
 nick_good_son: "善子"
 nick_good_son_desc: "真正信仰一项功业可能足以赦免你的罪。但不能安抚你饱受折磨的灵魂。"
 nick_premonstratensian_giant: "普雷蒙特雷修会巨人"
