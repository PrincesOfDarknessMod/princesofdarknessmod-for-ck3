l_simp_chinese:
 jagglings: "侍灵"
 jagglings_flavor: "#F 侍灵是常见的影界“公民”。他们通常有自我意识，并且拥有个人身份。侍灵通常为灵君服务。#!"
 rat_headed_dragonfly_demon: "鼠头蜻蜓妖"
 rat_headed_dragonfly_demon_flavor: "#F 蜻蜓妖从一英尺到一英尺半长，翼展可达两英尺，其甲壳具有与苍蝇胸部或水油一样的绚丽的彩虹色，他们被魔虎用作侦察兵#!"
 sleeper_seducing_bane: "睡诱忌灵"
 sleeper_seducing_bane_flavor: "#F 这些类似于魅魔的恶魔一点也不迷人。事实上，睡诱忌灵的外观是湿漉漉的、肉乎乎的红色块状物，有几英尺宽，上面镶有各种大小的触角，魔虎以将他们束缚为己用而闻名。#!"
 face_robe_demon: "人脸礼袍妖"
 face_robe_demon_flavor: "#F 人脸礼袍妖的存在即使按照恶灵的标准来看，也是令人不快的。居住在暴行和绝望中的面袍恶魔之所以被命名为人脸礼袍妖，是因为他们有一个令人不快的习惯，就是穿着用受害者的脸制成的雅致长袍。#!"
 fire_elemental: "火元素"
 fire_elemental_flavor: "#F 火元素，他们将自己视为盖亚的激情，曾经教导人类如何使用火。它们在险棘后面自发地涌现，一旦养分耗尽就会消失。#!"
 air_elemental: "风元素"
 air_elemental_flavor: "#F 气元素，他们通常居住在[UmbraGlossary('aetherial_realm')]的外围，或追随影界之风。#!"
 water_elemental: "水元素"
 water_elemental_flavor: "#F 水元素，居住在影界景观内的水体中#!"
 earth_elemental: "土元素"
 earth_elemental_flavor: "#F 土元素，据传与盖亚最亲近，通常居住在[UmbraGlossary('penumbra')]内未受污染的土壤中。#!"
 electricity_elemental: "电元素"
 electricity_elemental_flavor: "#F 年长的狼族认为，元素是盖亚的第一个造物，较新的元素是一种扭曲，是怒嚎末日的信号。其他人则认为，这些元素一直存在，但缺乏物质来表现自己。虽然有关于[UmbraGlossaryLocalized('astral_reaches','高影界')]地区的元素法庭的故事，但大多数狼族不相信它的存在。元素们说，外人认为的阶级制度只是其自己的假设的投影，而元素随其投影是为了更好地与血肉生物沟通。#!"
 metal_elemental: "金元素"
 metal_elemental_flavor: "#F 金属元素将自己视为同类的未来统治者，与土元素关系紧张。他们以自己所代表的金属制成的人形出现，通常脾气暴躁、傲慢无礼。#!"
 wood_elemental: "木元素"
 wood_elemental_flavor: "#F 木神仅比金元素稍微古老一些，但也与人类有着密切的关系。有些木神觉得自己被人类遗弃，而大多数木元素则觉得自己是受害者。#!"
 liderci: "吕德西"
 liderci_flavor: "#F 这些狡猾的灵体是纯粹欲望的表现，是灵类诱惑者和恶魔爱好者。#!"
 animated_tree: "活化树木"
 animated_tree_flavor: "#F 灌注魔法被赋予行动能力的树木，在魔法圃师的引导下，奔赴战场。#!"
 stormcrows: "风暴鸦"
 stormcrows_flavor: "#F 受到雷公的宠爱，风暴鸦主要充当影爵的间谍，但当数量足够多时，它们可以成为一支强大的部队。#!"
 apis_minotaurs: "牛头人"
 apis_minotaurs_flavor: "#F 阿匹斯（亦称月牛）被狼族灭绝，此乃加诸于一个仁慈种族之上的滔天罪行；然其慈悲绝非软弱——凭借魔克拉的龙梦，他们从灭亡中归来，誓要清算血债。#!"
 camazotz_megachiropteras: "巨蝠"
 camazotz_megachiropteras_flavor: "#F 经由龙梦之力，已灭绝的蝙蝠人重回暗影之中再次翱翔。其利牙已准备好随时刺入造成他们灭绝之人，或是一切碍事的人。#!"
 grondr_daeodons: "凶齿豨"
 grondr_daeodons_flavor: "#F 当他者可能因被腐化的恐惧或是被$glossary_wyrm$附身而退缩时，格隆迪尔总会毫不畏惧地直面压倒性的腐化。许多化兽族裔都记得格隆迪尔是如此英勇的，而现在此记忆被龙梦之力带入现实之中。如今格隆迪尔寻觅狼族，意图清除他们及其腐蚀堕落。否则他们为何会犯下如此背叛之罪？#!"
 hoglings: "大霾之灵"
 hoglings_flavor: "#F 这些忌灵以厚重毒云的形式出现，不详地向其目标翻涌而至。#!"
 furmlings: "大辐之灵"
 furmlings_flavor: "#F 令人作呕的发光绿火球，这些忌灵无论去哪都散布火焰与毁灭。#!"
 hrugglings: "大沼之灵"
 hrugglings_flavor: "#F 这些忌灵是成堆滚动的纯污水，散发着恶臭，而且拥有与之相配的不洁力量。#!"
 wakshaani: "大毒之灵"
 wakshaani_flavor: "#F 这些忌灵以片状紫红色液体呈现，上面有斑点、血管和冒泡的疣状物。#!"
 phantasmi: "幻骸"
 phantasmi_flavor: "#F 幻骸乃死去堕妖的残存之物。这些空壳执意摧毁一切曾将其灭杀之人。#!"
 bitter_rages: "仇恨怒灵"
 bitter_rages_flavor: "#F 由妖蛆创造的忌灵，意图使所有人陷入狂乱。#!"
 meat_puppets: "肉偶"
 meat_puppets_flavor: "#F 被附身的冤死幼小动物和人类尸体，将之带回人间散播苦难。#!"
 shade_spiders: "荫蛛"
 shade_spiders_flavor: "#F 由人类断手所构成，试图将生者拖入毁灭。#!"
 gray_masses: "灰暗菌团"
 gray_masses_flavor: "#F 原为奇原之灵，现在其破坏性的真菌爆长转而服务于妖蛆。#!"
 thinbones: "瘦骨"
 thinbones_flavor: "#F 永不餍足的饥饿忌灵，生于饥荒肆虐之地。#!"
 glutton_worms: "饕餮之虫"
 glutton_worms_flavor: "#F 它们看起来大致上就像巨大的蛴螬和臃肿的无皮蛇之间的杂交体；它们没有眼睛，只有一卷淡粉灰色的肉围绕着长长的、类似梭鱼的下巴。#!"
 scrags: "腐骸战灵"
 scrags_flavor: "#F 此战士忌灵是妖蛆在无尽的毁灭征途中服役的士兵。#!"
 nexus_crawlers: "节点爬行者"
 nexus_crawlers_flavor: "#F 极恐怖之忌灵，光是存在就会腐蚀和破坏周围的现实结构。#!"