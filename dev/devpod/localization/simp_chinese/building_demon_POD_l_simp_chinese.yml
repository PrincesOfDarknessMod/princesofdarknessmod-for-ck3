 building_pseudo_angelic_cults_03_desc:0 "You now have an entire building secretly dedicated to your worship, a beacon of power and faith for you alone."
 building_pseudo_angelic_cults_04:0 "大型邪教"
 building_pseudo_angelic_cults_04_desc:0 "Everyone in the city knows the name of your head priest, and you can gorge yourself on faith, a true delight!"
 building_pseudo_angelic_cults_05:0 "巨型邪教"
 building_pseudo_angelic_cults_05_desc:0 "Your influence in the hearts and faith of mortals has grown to be the official doctrine of this area, with more faith than you would have ever asked for in the past."
 building_pseudo_angelic_cults_06:0 "永恒邪教"
 building_pseudo_angelic_cults_06_desc:0 "Not even the cults of the Elohim of days long past equal what you have now."
 building_type_demonic_cults_01:0 "恶魔密教"
 building_type_demonic_cults_01_desc:0 "#F 虽然实际上来讲，所有有恶魔崇拜的密教都可以被称为恶魔密教，但这个词在这里指的是服务于恶魔的密教，它没有试图掩盖其真实性质。恶魔密教的信徒对他们所崇拜的生物不抱任何妄想。#!"
 building_demonic_cults_01:0 "微型密教"
 building_demonic_cults_01_desc:0 "Within a few holy places, the whispers of your power have begun."
 building_demonic_cults_02:0 "小型密教"
