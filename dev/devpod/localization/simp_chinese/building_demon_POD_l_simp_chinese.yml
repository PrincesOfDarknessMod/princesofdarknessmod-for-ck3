l_simp_chinese:
 building_type_bastion_01:0 "要塞"
 building_type_bastion_01_desc:0 "#F 堡垒是反叛的耶洛因在地球上的天怒之战中的据点，他们在那里聚集力量，完善他们的技能，并辅导他们的凡人妻妾。#!"
 building_bastion_01:0 "小型要塞"
 building_bastion_01_desc:0 "这里建立了一个小前哨。要建成要塞，还有很多工作要做。"
 building_bastion_02:0 "大型要塞"
 building_bastion_02_desc:0 "曾经的小前哨已经变成了一处不错的据点，你的地位现在相当强大。"
 building_bastion_03:0 "巨型要塞"
 building_bastion_03_desc:0 "这处庞大的建筑群错综复杂、勾心斗角，足以抵御你的敌人。"
 building_bastion_04:0 "超巨型要塞"
 building_bastion_04_desc:0 "威严而光荣的堡垒，这是你的力量，是你意志的证明。"
 building_bastion_05:0 "极巨型要塞"
 building_bastion_05_desc:0 "足以与天堂之门相匹敌，你的要塞可以抵御任何致命的攻击。"
 building_bastion_06:0 "至巨型要塞"
 building_bastion_06_desc:0 "在这里，你甚至可以经受启示录之火的考验。"
 building_type_ministry_of_dragons_01:0 "龙部"
 building_type_ministry_of_dragons_01_desc:0 "#F 龙部也被称为监察官，其使命是质疑和挑战权威。当然，这里的权威指上帝。#!"
 building_ministry_of_dragons_01:0 "次等龙部"
 building_ministry_of_dragons_01_desc:0 "在这，你有一些致力于巨龙之道的灵魂。"
 building_ministry_of_dragons_02:0 "像样龙部"
 building_ministry_of_dragons_02_desc:0 "模仿着仍被困在深渊中的堕落者，他们已经开始成长。"
 building_ministry_of_dragons_03:0 "高级龙部"
 building_ministry_of_dragons_03_desc:0 "甚至你们周围的凡人也开始质疑他们的目的和神性本身，回应你的监察官的呼唤。"
 building_ministry_of_dragons_04:0 "上阶龙部"
 building_ministry_of_dragons_04_desc:0 "你们的监察机构现在在整个地区都有影响力，扩大了他们的权力，也扩大了你们的权力。"
 building_ministry_of_dragons_05:0 "强力龙部"
 building_ministry_of_dragons_05_desc:0 "现在，即使是其他地球生物也会在你的监察官的风化问题下犹豫，你们的影响是不可否认的。"
 building_ministry_of_dragons_06:0 "永恒龙部"
 building_ministry_of_dragons_06_desc:0 "万物非虚，万事皆允。除了你和你的真理。没有其他的信仰是安全的。"
 building_type_ministry_of_eagles_01:0 "鹰部"
 building_type_ministry_of_eagles_01_desc:0 "#F 鹰部，也称观察者，其使命是获得有关潜在敌人的情报。#!"
 building_ministry_of_eagles_01:0 "次等鹰部"
 building_ministry_of_eagles_01_desc:0 "你现在有一些间谍，你的第一批观察者，开始扩大你的视野。"
 building_ministry_of_eagles_02:0 "像样鹰部"
 building_ministry_of_eagles_02_desc:0 "你的观察者现在已经遍布你的行动基地，并定期向你汇报。"
 building_ministry_of_eagles_03:0 "高级鹰部"
 building_ministry_of_eagles_03_desc:0 "此地的人口中心现在就在你的注视下，很少有事情在你不知情的情况下发生。"
 building_ministry_of_eagles_04:0 "上阶鹰部"
 building_ministry_of_eagles_04_desc:0 "秘密和八卦都为你所知，你的观察者的目光现在覆盖了农村地区，几乎没有什么东西能逃过你的视线。"
 building_ministry_of_eagles_05:0 "强力鹰部"
 building_ministry_of_eagles_05_desc:0 "你的观察者现在知道这个地区的所有事情，你的间谍是无与伦比的，甚至让其他地球生物都羡慕不已。"
 building_ministry_of_eagles_06:0 "永恒鹰部"
 building_ministry_of_eagles_06_desc:0 "据说凡人间流传着关于“老大哥”的传说。而你已经远超“老大哥”。"
 building_type_ministry_of_aurochs_01:0 "牛部"
 building_type_ministry_of_aurochs_01_desc:0 "#F 牛部，也被称为护卫者，其使命是保卫王庭并执行其法律。#!"
 building_ministry_of_aurochs_01:0 "次等牛部"
 building_ministry_of_aurochs_01_desc:0 "你现在有一小队保镖，即你的第一批护卫者，目的是在该领地保护你。"
 building_ministry_of_aurochs_02:0 "像样牛部"
 building_ministry_of_aurochs_02_desc:0 "现在这里已有一小队部队，足以提供不错的安保。"
 building_ministry_of_aurochs_03:0 "高级牛部"
 building_ministry_of_aurochs_03_desc:0 "现在你的权力程度足以让你拥有一支听命于你的护卫者小军队。"
 building_ministry_of_aurochs_04:0 "上阶牛部"
 building_ministry_of_aurochs_04_desc:0 "你的护卫者开始在你的王庭蔓延，仅他们的影响力就能劝阻暴力。"
 building_ministry_of_aurochs_05:0 "强力牛部"
 building_ministry_of_aurochs_05_desc:0 "护卫者现在相当于一支军队，其强度很少有人能与之相比，其力量几乎无人能及。"
 building_ministry_of_aurochs_06:0 "永恒牛部"
 building_ministry_of_aurochs_06_desc:0 "天堂本身也需要考虑攻击这样的军队的利弊。"
 building_type_ministry_of_lions_01:0 "狮部"
 building_type_ministry_of_lions_01_desc:0 "#F 狮部，又称宝剑，其使命是对抗对王庭的威胁。#!"
 building_ministry_of_lions_01:0 "次等狮部"
 building_ministry_of_lions_01_desc:0 "你已经与一些宝剑签订了合同，他们现在充当你想要清除的当地人的“清洁工”。"
 building_ministry_of_lions_02:0 "像样狮部"
 building_ministry_of_lions_02_desc:0 "足以打一场漂亮的小仗的军事势力，你的宝剑现在是你信任的心腹。"
 building_ministry_of_lions_03:0 "高级狮部"
 building_ministry_of_lions_03_desc:0 "你的宝剑现在对整个城市进行控制，在你的召唤下在内部起义。"
 building_ministry_of_lions_04:0 "上阶狮部"
 building_ministry_of_lions_04_desc:0 "这是你扩大影响力的第一个迹象，其他堕落者已经开始惧怕你信任的宝剑。"
 building_ministry_of_lions_05:0 "强力狮部"
 building_ministry_of_lions_05_desc:0 "凡人军队会害怕面对你的宝剑，而你的触角更进一步，使之成为你野心的燃烧之剑。"
 building_ministry_of_lions_06:0 "永恒狮部"
 building_ministry_of_lions_06_desc:0 "天堂也该在你的势力面前颤抖。"
 building_type_ministry_of_dust_01:0 "尘部"
 building_type_ministry_of_dust_01_desc:0 "#F 尘部，也被称为人部或引导者，其使命是保管凡人群众，以及推动王庭的发展。#!"
 building_ministry_of_dust_01:0 "次等尘部"
 building_ministry_of_dust_01_desc:0 "一些守卫已经被安排到你的密教徒中，目前是一股看不见的势力，在需要时必须警告你。"
 building_ministry_of_dust_02:0 "像样尘部"
 building_ministry_of_dust_02_desc:0 "你的引导者现在在他们居住的小地方对你的密教保持着警惕。"
 building_ministry_of_dust_03:0 "高级尘部"
 building_ministry_of_dust_03_desc:0 "引导者经常充当联络人，现在是你的密教徒和他们敌人的生活中永远的关注点。"
 building_ministry_of_dust_04:0 "上阶尘部"
 building_ministry_of_dust_04_desc:0 "引导者现在掌握着本地领地的更大权力，坚定地守护着你的信仰和力量来源。"
 building_ministry_of_dust_05:0 "强力尘部"
 building_ministry_of_dust_05_desc:0 "引导者现在是你领地的杰出者，你的信徒安全并受到保护，他们的敌人不敢伤害你珍贵的信仰储备。"
 building_ministry_of_dust_06:0 "永恒尘部"
 building_ministry_of_dust_06_desc:0 "尘归尘，土归土，这里的一切都在你永恒的注视下保持安全。"
 building_type_theistic_cults_01:0 "有神论密教"
 building_type_theistic_cults_01_desc:0 "#F 有神论，或相信存在着对人类有个人兴趣的神，给了恶魔无数机会进入已经建立的宗教体系并颠覆它们。这些密教围绕着对冒充神或女神的恶魔崇拜而展开，通常为民族神，模仿传说中的神灵并亲自与他们的信徒互动。#!"
 building_theistic_cults_01:0 "微型密教"
 building_theistic_cults_01_desc:0 "在数个神圣之地内，你的力量的低语已经开始。"
 building_theistic_cults_02:0 "小型密教"
 building_theistic_cults_02_desc:0 "一些圣洁的人不再圣洁了，你的魔奴数现在开始真正增长。"
 building_theistic_cults_03:0 "中型密教"
 building_theistic_cults_03_desc:0 "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_theistic_cults_04:0 "大型邪教"
 building_theistic_cults_04_desc:0 "城里的每个人都知道你的首席牧师的名字，让你可以随意吸食信仰，真好！"
 building_theistic_cults_05:0 "巨型邪教"
 building_theistic_cults_05_desc:0 "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_theistic_cults_06:0 "永恒邪教"
 building_theistic_cults_06_desc:0 "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"
 building_type_pseudo_angelic_cults_01:0 "伪天使密教"
 building_type_pseudo_angelic_cults_01_desc:0 "#F 恶魔打着天使的幌子出现，往往是以他们自己以前的天使形态出现，产生了伪天使（假天使）密教。虽然恶魔曾经作为天使侍奉上帝，但他们现在已经从恩典中堕落得很远，任何声称自己是天使的企图都只是欺骗。#!"
 building_pseudo_angelic_cults_01:0 "微型密教"
 building_pseudo_angelic_cults_01_desc:0 "在数个神圣之地内，你的力量的低语已经开始。"
 building_pseudo_angelic_cults_02:0 "小型密教"
 building_pseudo_angelic_cults_02_desc:0 "一些圣洁的人不再圣洁了，你的魔奴数现在开始真正增长。"
 building_pseudo_angelic_cults_03:0 "中型密教"
 building_pseudo_angelic_cults_03_desc:0 "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_pseudo_angelic_cults_04:0 "大型邪教"
 building_pseudo_angelic_cults_04_desc:0 "城里的每个人都知道你的首席牧师的名字，让你可以随意吸食信仰，真好！"
 building_pseudo_angelic_cults_05:0 "巨型邪教"
 building_pseudo_angelic_cults_05_desc:0 "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_pseudo_angelic_cults_06:0 "永恒邪教"
 building_pseudo_angelic_cults_06_desc:0 "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"
 building_type_demonic_cults_01:0 "恶魔密教"
 building_type_demonic_cults_01_desc:0 "#F 虽然实际上来讲，所有有恶魔崇拜的密教都可以被称为恶魔密教，但这个词在这里指的是服务于恶魔的密教，它没有试图掩盖其真实性质。恶魔密教的信徒对他们所崇拜的生物不抱任何妄想。#!"
 building_demonic_cults_01:0 "微型密教"
 building_demonic_cults_01_desc:0 "在数个神圣之地内，你的力量的低语已经开始。"
 building_demonic_cults_02:0 "小型密教"
 building_demonic_cults_02_desc:0 "一些圣洁的人不再圣洁了，你的魔奴数现在开始真正增长。"
 building_demonic_cults_03:0 "中型密教"
 building_demonic_cults_03_desc:0 "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_demonic_cults_04:0 "大型邪教"
 building_demonic_cults_04_desc:0 "城里的每个人都知道你的首席牧师的名字，让你可以随意吸食信仰，真好！"
 building_demonic_cults_05:0 "巨型邪教"
 building_demonic_cults_05_desc:0 "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_demonic_cults_06:0 "永恒邪教"
 building_demonic_cults_06_desc:0 "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"