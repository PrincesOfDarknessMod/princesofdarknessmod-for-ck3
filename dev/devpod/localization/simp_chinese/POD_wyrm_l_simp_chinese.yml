 POD_wyrm.1.t: "与红宝石沟通"
 POD_wyrm.1.desc: "随着你向灵魂红宝石注入能量，其嗡鸣声也越来越大。很快，黑螺旋舞者的声音侵入你的脑海，询问你想用这些能量换取什么。虽然你确信此灵感激你所给予的能量，但祂听起来似乎对目前的困境感到恼火。"
 POD_wyrm.1.option.a: "给我力量！"
 POD_wyrm.1.option.b: "教授我你的[ancestral_tongue|E]"
 POD_wyrm.1.option.c: "以$glossary_wyrm$之力祝福我！"
 POD_wyrm.1.option.d: "与我谈谈此红宝石之事。"
 POD_wyrm.1.option.e: "现在什么也不做。"
 POD_wyrm.101.t: "被妖蛆奴役"
 POD_wyrm.101.desc: "从你懂事起，你就被教导关于邪恶——$glossary_wyrm$的观念。你每天都被告知要与其爪牙战斗，提防其代理人，抵制其影响。\n看来你彻底失败了。\n\n#I 那些蠢货是错的。 $glossary_wyrm$才是真理，你的双目终于睁开看清。 #!"
 POD_wyrm.101.option.a: "我服侍黑暗者......"
 temple_obscura_rooms_intro: "是一座由暗色、绿脉大理石构筑而成的巨型神殿。其外墙覆满扭曲而不协调的异形符纹，交织着象征痛苦与堕落的浮雕。\n神殿之内的光源，来自于活体壁烛的微小烽火——那些烛座由囚徒被斩断的手臂构成，仍保有生命；以及来自穹顶彩绘玻璃所透出的幽暗绿光。\n整座神殿由九个房间构成，彼此相连。每一室之中，皆陈列着雕像与壁画，其内容为等待胆敢闯入者的试炼与折磨。少数人得以归来，尚存片段清明；更多人勉强维持基本身体机能，然而无人能保持理智。"
 POD_wyrm.501.t: "失败之室"
 POD_wyrm.501.desc: "$temple_obscura_rooms_intro$\n\n神殿的第一间房间就在你眼前。你一踏入，过往的种种景象便涌上心头。你记起了每一个失败，每一个糟糕决定，以及过去行为的每一个后果。消沉之源开始占据，但你必须抵抗。"
 POD_wyrm.501.option.a: "我试着忘记的记忆......"
 POD_wyrm.501.option.b: "弱点必须清除。"
 POD_wyrm.502.t: "愤怒之室"
 POD_wyrm.502.desc: "$temple_obscura_rooms_intro$\n\n进入第二个房间，你感到愤怒压倒理智。你无法分辨这怒火是源自于自身，还是来自$glossary_wyrm$的低语。你不明白自己为何在此，为何如此愤怒，只知道你必须摧毁。"
 POD_wyrm.502.option.a: "我一定要破坏些什么！"
 POD_wyrm.502.option.list1: "你徒手猛击其中一根支柱"
 POD_wyrm.502.option.list2: "你攻击一个[balefire|E]火盆"
 POD_wyrm.503.t: "苦痛之室"
 POD_wyrm.503.desc: "$temple_obscura_rooms_intro$\n\n进入第三个房间，剧痛随之袭来。你的身体忍受着这番折磨，脑海中再次涌现出过往失败的景象。但这一次，这些景象向你揭示，$glossary_wyrm$才是你的救赎，只有透过祂，你才能获得胜利。"
 POD_wyrm.503.option.a: "这些景象予我洞察。"
 POD_wyrm.503.option.b: "我向伟大的$glossary_wyrm$效忠。"
 POD_wyrm.503.option.c: "$glossary_wyrm$祝福了我！"
 POD_wyrm.504.t: "狡诈之室"
 POD_wyrm.504.desc: "$temple_obscura_rooms_intro$\n\n你发现一位忌灵在第四房间等待你，此忌灵非常狡猾，你必须在智力较量中击败祂，祂才会允许你继续前进。"
 POD_wyrm.504.option.a: "机智交锋。"
 POD_wyrm.504.option.b: "真相即谎言。"
 POD_wyrm.504.option.list1: "压倒性胜利"
 POD_wyrm.504.option.list2: "险胜"
 POD_wyrm.505.t: "战斗之室"
 POD_wyrm.505.desc: "$temple_obscura_rooms_intro$\n\n在你踏入第五间房间之前，战斗的声响便已传来。一群忌灵、堕妖以及其他$glossary_wyrm$之仆挡在你面前，你很清楚自己该做什么。"
 POD_wyrm.505.option.a: "战斗！"
 POD_wyrm.506.t: "腐蚀之室"
 POD_wyrm.506.desc: "$temple_obscura_rooms_intro$\n\n从你踏入第六房间的那一刻起，一股腐化浪潮便席卷而来。你的感官被纯粹的恶意所轰炸，你的身​​体被黑暗能量充斥。 $glossary_wyrm$赐予你其灵赋，现在你唯一需要的是设法存活。"
 POD_wyrm.506.option.a: "压倒性的力量......"
 POD_wyrm.507.t: "忠诚之室"
 POD_wyrm.507.desc: "$temple_obscura_rooms_intro$\n\n第七房间没有复杂的考验、谜题或敌人。只有一块铭牌孤零零地立在房间中央。\n用盛大的牺牲来证明你对$glossary_wyrm$的忠诚。\n现在，你将献上什么？"
 POD_wyrm.507.option.a: "[sacrifice.GetFirstName]的生命。"
 POD_wyrm.507.option.b: "我的血肉。"
 POD_wyrm.507.option.c: "我的物质财富。"
 POD_wyrm.507.option.d: "我臣民们的生命。"
 POD_wyrm.508.t: "谜题之室"
 POD_wyrm.508.desc: "$temple_obscura_rooms_intro$\n\n第八房间被黑暗笼罩，里面什么也看不见，什么也听不见，连自己的脚步声都听不到。只有一阵低语打破了这令人毛骨悚然的寂静，那个声音在你脑海中抛出疑问。随着问题越来越多，你只能一一作答，意识也渐渐开始模糊。"
 POD_wyrm.508.option.a: "真多有趣的问题......."
 POD_wyrm.508.option.b: "我必须逃跑！"
 POD_wyrm.508.tooltip: "@warning_icon!#X 你必须稍后重试此室才能进入最后房间。#!"
 POD_wyrm.509.t: "秘奥之室"
 POD_wyrm.509.desc: "$temple_obscura_rooms_intro$\n\n最终，神殿最后的房间出现在你眼前。房间中央，一头高大的狼人骑着一匹阴影笼罩的骏马。他的盔甲设计似乎违背现实，他的剑和坐骑都燃烧着$glossary_wyrm$的烽火。在他向你发起冲锋之前只说了一句话：\n\"你还没做好准备。\""
 POD_wyrm.509.option.a: "我最终的考验......"
 POD_wyrm.509.option.b: "我还没准备好。快逃！"
 POD_wyrm.509.tooltip: "#help $glossary_wyrm$嘲笑你的软弱。#!\n@warning_icon!#X 你必须之后重试此室。#!"
 POD_wyrm.510.t: "烽火之舞"
 POD_wyrm.510.desc.a: "经过一场仿佛持续数日的战斗，你终于击败了这头怪物。当其尸体崩解，他的坐骑却瞬间移动到了尸体后方不远处。你一度以为那匹燃烧的骏马要为主人报仇。然而，它却将尸体吞噬于炽灼烽火中，才缓缓接近你。\n这匹充满$glossary_wyrm$力量的恐怖骏马似乎认定你为新主人。"
 POD_wyrm.510.desc.b: "你的对手说得没错，你确实准备不足。你的大部分攻击都被对方轻松化解，有些甚至完全落空。而他的攻击精准、威力强大，而且极具破坏力。你现在唯一的希望就是逃跑。\n罪责不在于实力不如人，而在于未能认清这一点。"
 POD_wyrm.510.option.a: "现在我是你的主人了。"
 POD_wyrm.510.option.b: "我不能死在这......"
 POD_wyrm.510.tooltip: "@warning_icon!#X 你必须稍后重试此室......如果你活得下来的话。#!"