 artifact_archator_name: "大导师"
 artifact_archator_description: "一只巨大的恐龙与魔克拉巨蜥融合而成的生物出现了。这只庞然大物凶猛地带着它的蜥蜴伙伴投入战斗，它能够轻易地捕食那些挡在他们面前的敌人。"
 artifact_dipelta_name: "双盾龙"
 artifact_dipelta_description: "找一块你所能找到的最坚固、最大的盾牌，再给它加上腿脚部分，这样你就能造出一只双盾龙了。这种恐龙在向前冲撞时能够抵御大多数攻击。"
 artifact_avithon_name: "羽翼龙"
 artifact_avithon_description: "这只会飞翔的长羽毛恐龙会带着它的乘客在天空中翱翔，这样他们就能轻松避开大多数危险。"
 artifact_dicravenator_name: "双喙掠夺者"
 artifact_dicravenator_description: "即便是速度最快的马也无法与双喙掠夺者的速度相匹敌。它会一直前进，直到追上猎物为止。"
 artifact_rhincanthus_name: "棘鼻龙"
 artifact_rhincanthus_description: "无论棘鼻龙受到怎样的伤害，它都不会停止前进。它是一台坚定的破坏机器，会将面前的一切夷为平地。"
 artifact_baroceratops_name: "重角龙"
 artifact_baroceratops_description: "若敌人龟缩于城墙之后紧闭城门，不妨让您的重角龙为您开辟一条新路。"
 artifact_dracomus_name: "德拉科穆斯龙怪"
 artifact_dracomus_description: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中施加1火焰[POD_aggravated_damage_with_box|E]。\n\n一只体型庞大的龙形灾兽，全身覆盖着一层极易燃的黏液，它会透过爪子相互摩擦点燃黏液。这只燃烧的怪物真不该离开魔克拉的梦。"
 artifact_archeorex_name: "始祖霸王龙"
 artifact_archeorex_description: "一只顶级掠食者呈现在世人面前。这是一头极度饥饿、极具破坏力的庞然大物。倘若魔克拉族人能梦出更可怕的景象，那将会引发怒嚎末日。"
