 hibernation_attendant_court_position: "冬眠侍者"
 hibernation_attendant_court_position_desc: "在追忆中，魔克拉在梦境中和现实里都容易受到伤害。冬眠侍者会保护他的主人，确保不会有任何事物干扰他的梦境。"
 wallow_warden_court_position: "栖巢守护者"
 wallow_warden_court_position_desc: "栖巢是魔克拉的核心。它是一个避难所、一所学校，最重要的是一个家。监督它的建设和保护是一种巨大的荣誉，但也是一种更大的责任。"
 sun_herald_court_position: "太阳使者"
 sun_herald_court_position_desc: "所有魔克拉皆能与太阳沟通，但唯有传谕者会潜心参悟太阳的智慧真谛。"
 crested_purifier_court_position: "冠羽净化者"
 crested_purifier_court_position_desc: "无论敌人是不死生物、恶魔，甚至其他变形者，冠羽净化者都会率领同魔克拉迎战。"
 solar_salvager_court_position: "日光拾荒者"
 solar_salvager_court_position_desc: "魔克拉乃造物技艺之大师，对锻造材料的需求永无止境。拾荒者负责识别并回收可在魔克拉太阳熔炉中重铸的废弃装备。"
 mokole_gain_common_shards: "寻找宝物碎片#weak （普通级）#!"
