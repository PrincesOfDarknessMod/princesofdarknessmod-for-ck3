l_simp_chinese:
 PODcanon_chars.1.t:0 "新的开始"
 PODcanon_chars.1.desc:0 "终于结束了。那个蠢货，斯巴达的墨涅拉俄斯，已经死了，而你，千百年来第一次，可以随心所欲了。胜利感觉……比你想象的要空虚，因为你突然失去了你亡生中的目标……但你会继续活下去，一如既往。\n这个世界已经忘记了你，甚至连最老的妥芮朵都认为你是个神话。这可能对你有利。现在是时候回到[cainite|E]政治的世界了，一个你非常熟悉的世界，但有一个明显的优势：没有重要的人真的怀疑你真正的权力。\n这是一种非常有用的资产，你打算尽可能长时间地保留它……"
 PODcanon_chars.1.a:0 "我的扬升终于可以开始了"
 PODcanon_chars.helena:0 "你解锁了对外地统治者的新[character_interaction|E]：渗入"
 PODcanon_chars.2.t:0 "神的觉醒"
 PODcanon_chars.2.desc:0 "终于完成了。你几乎完成了召唤斯凡特维德降临到自愿宿主的仪式。你迫不及待地想要感受神的力量流淌在你永恒的血管里！\n不过有个小问题，在你的研究过程中，你发现宿主的心智应该会因为斯凡特维德的到来而被抹除掉。很明显，你意志坚强，不会像一些被你击垮的白痴密教徒那样轻易颓败，但是……这仍然令人担忧。\n简单地解读这个仪式已经教会了你很多，可能本身就是一个足够的奖励。\n或者你可以召唤一位神并试着让祂屈从于你的意志。选择权在你手中……也许这是最后一次了。"
 PODcanon_chars.2.a:0 "究极力量！"
 PODcanon_chars.2.b:0 "……我感觉不太妙"
 PODcanon_chars.3.t:0 "神之间的浪漫"
 PODcanon_chars.3.desc:0 "她回来了。\n伊西斯心爱的女儿再次加入了你的阵营，一股矛盾的情绪又回到了你的身边。你这一次拥有的是激情，虽然转瞬即逝。也许你的故事会更经得起时间的考验，因为现在你们都长大了，希望也更聪明了。\n至少，这将是有趣的，特别是当你的封臣已经在你背后抱怨。刻茉媞里从来都不是他们当中最受欢迎的人物。\n但你不在乎。她回来了，亡生似乎值得再活一段时间，希望是很长一段时间。"
 PODcanon_chars.3.a:0 "让我们依照我们的想法去重建这片土地"
 PODcanon_chars.mithras:0 "你解锁了一项限时的大决议"
 PODcanon_chars.4.t:0 "战争审判"
 PODcanon_chars.4.desc:0 "你已经谋略了一系列快速而果断的小规模战斗来对付这个反叛的封臣。如果你能取得胜利，你就可以暂时不受叛乱的影响，至少是这个人的。\n不过在发动攻击前最好确定一下成功的概率，如果你输了，后果会比根本不尝试这样的行动更糟糕……"
 PODcanon_chars.4.a:0 "迈向胜利！"
 PODcanon_chars.4.b:0 "今夜不是那夜"
 PODcanon_chars.4.effect.success.desc:0 "胜利将暂时性的崩坏封臣的精神"
 PODcanon_chars.4.success:0 "胜利！"
 PODcanon_chars.4.critical.failure.effect.desc:0 "失败将鼓励封臣的叛乱精神"
 PODcanon_chars.4.failure:0 "失败……"
 PODcanon_chars.5.t:0 "仰望金字塔"
 PODcanon_chars.5.desc:0 "现在是时候使用你作为睿魔尔[Clan|E]之主的正当权力，来进行一些老式的封闭政治。既然你站在金字塔的顶端，你就会赢得最后的胜利，问题是你能从中得到什么具体的好处。\n这么多的选择，后果却如此之小！除了显而易见地惹恼你下面的人。不过这其实都无所谓。"
 PODcanon_chars.5.a:0 "偷走其他人的主意"
 PODcanon_chars.5.b:0 "让其他人为你的失败负责"
 PODcanon_chars.5.c:0 "征用氏族金库"
 PODcanon_chars.5.d:0 "我没心情应对政治"
 PODcanon_chars.6.t:0 "鹰巢的奖励"
 PODcanon_chars.6.desc:0 "哈基姆的子嗣的领导人对伊比利亚午夜新月的进展感到高兴。他们向你致以最诚挚的问候和祝贺，同时也向你表示支持，向维齐尔、术士和战士种姓的稚子们表示祝贺。\n你的工作还没有完成，但你身上的压力现在不那么沉重了，看起来他们终于相信你会为[Clan|E]的最大利益着想。甚至有可能让伊比利亚成为一个配得上哈基姆本人的未来重要据点。"
 PODcanon_chars.6.a:0 "我将是鹰巢十年内的话题人物"
 PODcanon_chars.7.t:0 "计中计"
 PODcanon_chars.7.desc:0 "你对这个潜在的敌人有了更多的了解。这对你来说总是一种奇怪的安慰，罗克亲王，因为你喜欢智取你的敌人，让他们落入一个无法陶土的阴谋之网。\n尽管如此，你有时并不只是为了搞阴谋而搞阴谋。您可以利用获得的信息进行进一步的计划！"
 PODcanon_chars.7.a:0 "对这家伙启用更多的计谋！"
 PODcanon_chars.7.b:0 "勾心斗角是一种舒缓的消遣……"
 PODcanon_chars.7.c:0 "让每个人都知道你的阴谋技巧有多厉害！"
 PODcanon_chars.8.t:0 "兴风作浪"
 PODcanon_chars.8.desc:0 "蒙塔诺大人，随着意大利大部分地区在你的控制下回归，你向勒森魃[Clan|E]证明了你仍然是一个有效而果断的统治者。显然，要恢复暗影之海在地中海世界的位置还有很多工作要做，但至少，你作为[Clan|E]首领的地位不再有争议。\n你现在可以使用它来宣称对任何任性的勒森魃亲王领的统治权。"
 PODcanon_chars.8.a:0 "我可以做得更好"
 PODcanon_chars.montano:0 "你现在在与任何勒森魃统治者的“提议附庸”互动的接受度上有专属增益"
 PODcanon_chars.9.t:0 "携爱初拥"
 PODcanon_chars.9.desc:0 "美丽的玛阿特卡勒，当你全身心投入某件事时，你很难被阻挡，但[cainites|E]是固执的生物。如果你要展示赛特之爱，它将需要你所有会得的说服和诱惑技巧来实现。\n失败的风险总是存在的，这将会让你在赛特无情的眼神中付出相当大的代价……"
 PODcanon_chars.9.a:0 "赛特的荣耀不能等待"
 PODcanon_chars.9.b:0 "今夜不是那夜"
 PODcanon_chars.9.effect.success.desc:0 "胜过意志将使该角色皈依赛特之道"
 PODcanon_chars.9.success:0 "赞美赛特！"
 PODcanon_chars.9.critical.failure.effect.desc:0 "失败将使你付出一些代价"
 PODcanon_chars.9.failure:0 "我输了……"
 PODcanon_chars.10.t:0 "行于黑螺旋"
 PODcanon_chars.10.desc:0 "你见过那些“黑旋舞者”，他们的一举一动显得丧心病狂，即使是按照你的松散标准。你受到的痛苦有微小的可能得到解答，但这值得吗？唯一可以肯定的是，一旦你从这个被诅咒的地方回去，你整个人就不会再和之前一样了……"
 PODcanon_chars.10.a:0 "现在没有回头路了"
 PODcanon_chars.10.b:0 "这是个非常非常坏的主意"
 PODcanon_chars.petaniqua:0 "你更有可能从现在回到比起点更糟糕的地方。但也许有一丝希望能做点有价值的事……"
 PODcanon_chars.11.t:0 "疯于黑螺旋"
 PODcanon_chars.11.desc:0 "人们认为你已经从黑螺旋中回来了，相较之前并没有任何改变。但你自己更清楚，你未从那里回来，从来没有。而它现在与你同在。\n而这些……你所看到的东西将永远不会离开你的视野。也许整个世界只是它的延伸。或者你只是走得太远，不再去关心。\n你不会想再回到那里。还是说你想？"
 PODcanon_chars.11.a:0 "再也没有光了"
 PODcanon_chars.12.t:0 "明于黑螺旋"
 PODcanon_chars.12.desc:0 "你不记得你在黑螺旋中的大部分旅程，是……也许这是最好的结果。你没有发现隐藏的真相，或肮脏的恐怖。如果你有，你会对他们有一些记忆，对吗？\n不管怎么说，尽管遇到了所谓的挫折，你还是很欣慰地离开了那里。奇怪的是，现在外面的世界似乎很舒适。"
 PODcanon_chars.12.a:0 "情况本来可能更糟"
 PODcanon_chars.13.t:0 "黑螺旋之力"
 PODcanon_chars.13.desc:0 "毫无疑问，黑螺旋是一个究极疯狂的地方。但你的凡生和亡生经历了这么多，这次它并没有击垮你。你克服了恐惧，“它”对你的表现感到满意。\n尽管有这力量的展示，你会承认你很高兴再次加入外面的世界。这一点也不轻松。"
 PODcanon_chars.13.a:0 "我不容易被吓到"
 PODcanon_chars.14.t:0 "黑螺旋之礼"
 PODcanon_chars.14.desc:0 "你找到了他。\n也许是黑螺旋怜悯你，或是被你的奉献精神所打动。又或许这只是一个梦，也就是你那破碎心灵的幻想。但你不关心。\n他现在和你在一起了，一切都会再一次好起来的。"
 PODcanon_chars.14.a:0 "你注定要成为世界之王"
 PODcanon_chars.petaniqua2:0 "从现在开始，你没有理由再行于黑螺旋了"
 podintroductions.116.t:0 "你的故事就此展开"
 podintroductions.116.desc:0 "哈德施塔特大人，到目前为止，你的政治升迁是非常出色的。从一个被漠视的世系和边境处地起家，你成功地利用凡人的神圣罗马帝国的崛起，将梵卓[Clan|E]从罗马重新集中到德意志。\n不过，旧习难改，你不得不与罗马遗民的领袖茱莉亚·安塔西亚合作，才走到这一步。现在可能是时候“重新谈判”你们的伙伴关系，把这些尘封的古物放到属于它们的博物馆里去。\n你有强大的盟友和忠诚的子嗣，让他们保持亲近并注意他们的处位，历史将由你来书写。"
 podintroductions.116.a:0 "德意志即是未来"
 podintroductions.hardestadt:0 "作为哈德施塔特，你有着针对你的子嗣的专属[character_interaction|E]，用以驾驭其等。\n你开局时与茱莉亚·安塔西亚在权力斗争。"
 pressure_on_modifier:0 "施加压力"
 pressure_on_modifier_desc:0 "这个角色正处于要做到最好的压力之下。"
 PODcanon_chars.15.t:0 "绷紧缰绳"
 PODcanon_chars.15.desc:0 "你的子嗣回应了你的召唤，急切地想听到你的诉求。你是出了名的严格的[Sire|E]，是那种不轻易容忍失败的人。不过，没有人可以否认，你的教育选择造就了他们这一代中最有天赋的稚子。其他人……他们往往没能过久的玷污你的声誉。"
 PODcanon_chars.15.a:0 "做得更好！"
 PODcanon_chars.15.b:0 "永不满足"
 PODcanon_chars.15.c:0 "你是一个毫无价值的失败者！"
 PODcanon_chars.hardestadt_tooltip:0 "只要这个角色一直是仇敌，你就不能再召来其。"
 POD_hardestadt_interaction:0 "绷紧缰绳"
 POD_hardestadt_interaction_desc:0 "召集你的子嗣进行谈话"
 podintroductions.117.t:0 "你的故事就此展开"
 podintroductions.117.desc:0 "安塔西亚女士，你在你于流放中在德意志的居所中坚强地站立着，但你的心却在为凯旋罗马而隐隐作痛。梵卓[Clan|E]已经从它在永恒元老院的高贵根基上跌落得很远，而你是唯一能阻止哈德施塔特和卡米拉把你心爱的[Clan|E]变成自己的玩物的人。\n虽然这一努力需要时间，但你最近在你的探索中发现了一个令人惊讶的盟友。诺斯费拉图族的安吉瓦是一个奇怪的人，喜欢着幻想故事，但他已经证明是一个值得信赖的朋友，更是一个值得你去争取的人。凭借你们的联合力量，真正理想的罗马仍有希望。"
 podintroductions.117.a:0 "元老院不会堕落"
 podintroductions.antasia:0 "作为茱莉亚·安塔西亚，只要你们保持朋友关系，你就可以获得与安吉瓦的专属[character_interaction|E]。\n你开局时与哈德施塔特在权力斗争。"
 POD_antasia_interaction:0 "友善交谈"
 POD_antasia_interaction_desc:0 "邀请安吉瓦进行一次愉快的交谈"
 PODcanon_chars.16.t:0 "说书人安吉瓦"
 PODcanon_chars.16.desc:0 "当你第一次见到他时，你希望安吉瓦能洞悉你的祖尊，梵卓本人。遗憾的是，事实并非如此，因为即使是像他这么老的家伙，也从未遇到过[antediluvian|E]。尽管如此，该诺斯费拉图还是有很多关于[cainite|E]世界的故事，其中一些你甚至很难相信。\n不过安吉瓦并不介意，他只是很高兴与你分享它们。从这样一个古老而古怪的吸血鬼那里获得如此友好的、没有欺骗的洞察力，是一种祝福，你不打算破坏。"
 PODcanon_chars.16.a:0 "真的吗？太不可思议了！"
 PODcanon_chars.17.t:0 "自信者安吉瓦"
 PODcanon_chars.17.desc:0 "安吉瓦今晚很安静，似乎很乐意倾听你的烦恼。在[cainite|E]世界里，一个人能够向另一个人倾诉而不用担心被欺骗或操纵，这是很罕见的。但你对这个老诺斯费拉图感到放心，知道你们的目标是紧密一致的。对你来说，拥有这种奢侈的生活是不小的祝福，而且每次你和他在一起的时候，年长之倦似乎都不那么旖旎。"
 PODcanon_chars.17.a:0 "友谊是宝贵的财富"
 PODcanon_chars.18.t:0 "战士安吉瓦"
 PODcanon_chars.18.desc:0 "安吉瓦今晚很激动，谈到了他的[Clan|E]所面临的严重威胁：尼克图库。你以前也见过他这样，虽然你对他说的事情一无所知，但你更愿意幽默地对待他。甚至当他突然要求在你们之间进行决斗训练，以便“在他们来的时候做好准备”。你不是每天晚上都能和这样一位经验丰富的战士比试，你肯定能学到一些东西。"
 PODcanon_chars.18.a:0 "我们将做好准备"
 podintroductions.118.t:0 "你的故事就此展开"
 podintroductions.118.desc:0 "亚历山大大人，你曾经是世界上最重要的梵卓，对查理曼大帝本人耳提面命。现在，你被受诅的萨利安娜和你的叛徒子嗣杰弗里从你心爱的法兰西流放了。你会回来的，但有其他事情需要你的关注。\n约根·冯·费尔登大人，你现居处的东道主，已经召集了一支小部队来帮助你，履行他作为年轻同族的职责。接受它将是有帮助的，但也意味着你基本上沦为到为得帮助而乞求。拒绝它更符合你的地位……但无疑会激怒马格德堡的亲王。在这里做出正确的决定，这可能是你凯旋回到整个[cainite|E]世界的第一块垫脚石。"
 podintroductions.118.a:0 "感谢帮助，约根大人"
 podintroductions.118.b:0 "王不求人！"
 alexander_black_cross_event_troops:0 "黑十字血仆"
 alexander_help_modifier:0 "人脉通达"
 alexander_help_modifier_desc:0 "由于有一位强大的引路人的帮助，你在上层圈子中的好评不断。"
 podintroductions.119.t:0 "你的故事就此展开"
 podintroductions.119.desc:0 "约根大人，自从你被[Embrace|E]以来，就一直在以惊人的速度崛起。但最近在与军督领的战争中遭到的小挫折使你的影响力受到了削弱。不过，随着流亡的法兰西亲王亚历山大来到你的宫廷，一个新的机会出现了。\n到目前为止，你一直是个完美的东道主，继续这样做对你的野心有利，因为亚历山大在[Clan|E]中仍有着很大威望。但这位强大的梵卓并非是单独前来的，他还带来了伊斯灵顿的罗莎蒙，这位美之[Clan|E]中最美的倾世佳丽，也是个偷走你心的妙人儿。\n你最近向这位女士表白了你的感情，但似乎亚历山大本人也看上了她。因此，必须要做出选择了……"
 podintroductions.119.a:0 "爱……"
 podintroductions.119.b:0 "或力量？"
 jurgen_love_tooltip:0 "罗莎蒙将加入你的宫廷，将她的地盘托管给你。"
 podintroductions.120.t:0 "你的故事就此展开"
 podintroductions.120.desc:0 "赞美伟大的卡米拉，罗马与梵卓[Clan|E]过往的无可争辩的主人！\n在该幸福的时代，所有的人都在你面前俯首称臣。崇魔的迦太基在你的命令下被摧毁，一切都很完美，直到你陷入[torpor|E]。很显然，没有人能够继承你的衣钵，帝国也同你一共衰落。你最近于这个新世界苏醒过来，与你所知道的那个世界如此不同……但仍然充满了机会。\n重申你对你心爱的罗马的控制很容易，但现在更大的挑战在等着你。\n你是原罪永恒执政，你的未来只能是永生的荣耀和颓废的快乐。"
 podintroductions.120.a:0 "罗马永恒"
 podintroductions.camilla:0 "作为卡米拉，你在“主办欢会​”活动期间有一项专属的、更有利的、更可能触发的事件。\n你的桂冠能在你完成“原罪之政”决议后升级。"
 POD_elysium_events.25.t:0 "像罗马人一样狂欢"
 POD_elysium_events.25.desc:0 "除了是最强大的梵卓之一和精明的政治动物之外，你还被称为所有[cainite|E]中最好的派对主持人。毕竟，你在罗马帝国时期开创了该整个概念，你完全知道该如何进行。\n血将流淌，而每人都会有一段美妙的时光，由于你的精心策划，使罗马伟大的如此一小部分将在今晚得以延续。"
 POD_elysium_events.25.option.a:0 "让我们开始狂欢吧！"
 anna_ambition_modifier:0 "燃烧的野心"
 anna_ambition_modifier_desc:0 "安娜将不惜一切代价来获得她与生俱来的权利。你可以帮助她或被她撇开，没有中间地带。"
 podintroductions.121.t:0 "你的故事就此展开"
 podintroductions.121.desc:0 "尊贵的女士，你来自最伟大的希腊世系，君士坦丁堡应属于你，即使成为吸血鬼也没有改变这个事实。你很好地适应了你的新状态，并在第四次十字军东征发生时迅速地攀升拜占庭阶级。随着米迦勒和幻梦的毁灭，以及拉丁吸血鬼的胜利，你的城市再次离你渐行渐远。\n然而，还没走投无路，因为拉丁人难以巩固他们的地位，这使你能够帮助继任者帝国尼西亚开始运作。在这个强大的权力基础上，你离实现你永恒的野心如此之近……\n继续前进吧，诸皇的女儿，达成你的天命！"
 podintroductions.121.a:0 "我的世界渴望之城……"
 podintroductions.anna:0 "你可通过一项要求你守住君士坦丁堡的专属[decision|E]来提升你的初始修正"
 anna_decision:0 "生于紫室"
 anna_decision_tooltip:1 "拉丁人的压迫必须被终结"
 anna_decision_desc:0 "君士坦丁堡必须是你的，这于此时比任何其他都重要。你将把它从受诅的拉丁勒森魃手中解放出来，然后开始你对这个世界上最伟大城市的永恒统治。"
 anna_decision_effect_tooltip:1 "你将达成你的野心。"
 anna_decision_confirm:0 "终于！"
 anna_ambition_fulfilled_modifier:0 "达成野心"
 anna_ambition_fulfilled_modifier_desc:0 "科穆宁现在是君士坦丁堡的永生和永恒的统治者。如它本该是。"
 podintroductions.122.t:0 "你的故事就此展开"
 podintroductions.122.desc:0 "阿娜佳女士，你简单的生活随着贝利撒留和谢巴赫的到来而陷入混乱。这两个吸血鬼对你很有好感，并教给你很多如何在黑夜社会中生存的知识……然后你的生活变得更加奇怪了，一个秘密的末日密教——“黑手”——宣布你是其应许的领导者。\n尽管发生了这些事情，但到目前为止你做得很好，亚美尼亚在你的统治下已经成为一个强大的要塞，吸引了这个密教的成员和来自拜占庭的难民。你的“养父母”还在这里，在帮助稳定你的新国家方面提供了宝贵的帮助，但现在是时候把事情掌握在你自己手中了。\n你得到了最好的指导，许多人已经把你看作是世界上最重要的[cainites|E]之一，但你的故事是你自己的，只有你自己才能书写。"
 podintroductions.122.a:0 "我自成一系该隐之子"
 podintroductions.anadja:0 "只要谢巴赫与贝利撒留还活着，你就可以通过[decision|E]要求进一步的辅导。"
 anadja_decision:0 "向最优秀者学习"
 anadja_decision_tooltip:1 "总有提高的空间。"
 anadja_decision_desc:0 "谢巴赫与贝利撒留一直乐于帮助你提升，尽管他们的课程有时会相当费力。"
 anadja_decision_effect_tooltip:1 "训练课程将开始"
 anadja_decision_confirm:0 "我准备好了。"
 anadja_custom_decision:0 "该[decision|E]将于你取有25军事、20外交和20密谋，又或谢巴赫与贝利撒留两者死去时不可用。"
 PODcanon_chars.19.t:0 "向最优秀者学习"
 PODcanon_chars.19.desc:0 "贝利撒留在凡生中曾经是一位伟大的将军，然后为君士坦丁堡的[cainite|E]的幻梦处理许多军事事务。从他身上可以学到很多东西。而谢巴赫则是一位间谍和大使专家，常常同时兼任，可以教你这些课题。你今晚要问他们什么？"
 PODcanon_chars.19.a:0 "告诉我更多关于军事战役的事，贝利撒留"
 PODcanon_chars.19.b:0 "外交是一项复杂的课题……"
 PODcanon_chars.19.c:0 "……也许跟密谋一样复杂"
 PODcanon_chars.19.d:0 "我改变主意了"
 shaky_secrets_modifier:0 "将泄的秘密"
 shaky_secrets_modifier_desc:0 "他们知道你在藏着什么，而他们想找出来。"
 shrouded_secrets_modifier:0 "虚藏的秘密"
 shrouded_secrets_modifier_desc:0 "你的秘密被一层稀薄的暗影所保护着。"
 darkened_secrets_modifier:0 "黑暗中的秘密"
 darkened_secrets_modifier_desc:0 "他们完全不晓得你。也将没有人能会。"
 secrets_secrets_modifier:0 "秘密中的秘密"
 secrets_secrets_modifier_desc:0 "棋盘上的棋子，经由你的手操纵。"
 podintroductions.123.t:0 "你的故事就此展开"
 podintroductions.123.desc:0 "巴德尔苏丹，你已经掌握了午夜新月的控制权，被逼到角落的[ashirra|E]正明智地团结在你身后。注意那些不这样做的人，以便日后惩罚。\n你必须尊重基督教的暗影再征服，因为德·鲁伊斯和他的世系都是可怕的对手，但你最紧迫的事情是保密问题。\n你对你的新“忠诚”的追随者隐藏了很多东西，尽管他们坚持，但你不希望他们发现这些东西。利用你对阴影和阴谋的掌握，在为时已晚之前将自己隐藏在坚不可摧的神秘面纱后面。只有这样，你才能将基督教徒从伊比利亚连根拔起。"
 podintroductions.123.a:0 "真理由我塑造"
 podintroductions.badr:0 "到1300年之前，你可以使用一项专属决议，来提升你的初始修正。"
 badr_decision:0 "巴德尔的秘法"
 badr_decision_tooltip:1 "他们决不能知道。"
 badr_decision_desc:0 "作为午夜新月的新统治者，所有的目光都投向了你。你必须在为时已晚之前好好隐藏自己。"
 badr_decision_decision_effect_tooltip:1 "辛秘深藏。"
 badr_decision_confirm:0 "他们决不会知道。"
 podintroductions.124.t:0 "你的故事就此展开"
 podintroductions.124.desc:0 "虔诚的苏莱曼，[ashirra|E]信徒们的日子不好过了。卑鄙的基督徒勒森魃已经向你的人民宣战，使伊比利亚和马格里布陷入混乱。此外家边也有麻烦了。你曾经的朋友哈立德在美索不达米亚集结了军队，因为他与你在干涉或不干涉凡人事务上发生了激烈的分歧。你自己的子嗣，哈罗恩·拉伊尔，在他的异端教义被揭露后，也提出了独立的要求。\n你必须采取行动，苏莱曼。现在[ashirra|E]比以往任何时候都更需要团结，也许需要做出让步来实现这一目标。尽管强硬的立场也是一种可能……"
 podintroductions.124.a:0 "绝不妥协"
 podintroductions.124.b:0 "哈立德，我们有更大的威胁得对付！"
 podintroductions.124.c:0 "哈罗恩，我们可以多谈谈你的理论……"
 podintroductions.125.t:0 "你的故事就此展开"
 podintroductions.125.desc:0 "无畏的露西塔，在因为是女人而在凡人世界困扰之后，你现在又因为是勒森魃而在不死族世界困扰。这不能再继续下去了。你是一个自由的灵魂，渴望独立，你不会等待成为长者所需的几个世纪来实现它。\n你的第一个目标应该是你自己的[Sire|E]，安布罗西奥·路易斯·蒙卡达，一个自以为能控制你的傻瓜。然后勒森魃[Clan|E]本身必须明白，你不是他们的“新星”，你是属于你自己的女人，这些腐朽的白痴将学会尊重你。\n被你的[Clan|E]内战吞噬的伊比利亚的混乱局面，将是你为自己争取伟大地位的绝佳机会。你只需要好好利用它就可以了。"
 podintroductions.125.a:0 "不自由毋宁死"
 podintroductions.lucita:0 "作为露西塔，你可以通过达成你的专属决议，来提高你的起始修正"
 caged_lucita_modifier:0 "笼中的露西塔"
 caged_lucita_modifier_desc:0 "你还不是你自己故事的主人公，这让你愤怒不已。"
 unleashed_lucita_modifier:0 "受释的露西塔"
 unleashed_lucita_modifier_desc:0 "你自己的故事终于开始了。这将是光荣的。"
 lucita_decision:0 "露西塔的宿命"
 lucita_decision_tooltip:1 "时候到了"
 lucita_decision_desc:0 "你得先处理好困住你的最后一道枷锁。随后，将是反击时刻。"
 lucita_decision_confirm:0 "终于，自由了！"
 lucita_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死"
 good_moncada_modifier:0 "完美世界"
 good_moncada_modifier_desc:0 "无论她是爱你还是恨你，露西塔都活着。你的世界是完美和谐的。"
 podintroductions.126.t:0 "你的故事就此展开"
 podintroductions.126.desc:0 "虔诚的蒙卡达，伊比利亚正处于动荡之中，天主呼唤你来拯救它。你的[Sire|E]西尔维斯特·德·鲁伊斯正式领导基督教一方，但你才是权位背后的真正力量。目前，他很有用，但你可能想在某个时候步入台前。\n然后，还有露西塔……毫无疑问，她是天主派来引导你的天使，即使她没有意识到这一点。自从她受[Embrace|E]之后，你已经是最好的你了，更敏锐、更迅速、更强大。她会慢慢学会欣赏你，但在那之前，你需要确保她保持安全。你甚至无法想象，如果她出了什么事，你可怜的灵魂会变成什么样子……"
 podintroductions.126.a:0 "天主赐予了我最棒的礼物"
 podintroductions.moncada:0 "作为蒙卡达，只要露西塔还活着，你就能享受这个修正。但如果她死了……\n你开局时与西尔维斯特·德·鲁伊斯在权力斗争。"
 PODcanon_chars.20.t:0 "你的小世界的终末"
 PODcanon_chars.20.desc:0 "她死了。\n露西塔，你的引路天使，死了。\n你已经失去希望了。这个世界可能也失去希望了，因为这显然证明天主已经放弃了祂最忠实的仆人。你还能继续这种可悲的亡生吗？即使尝试又有什么意义呢？……也许，也许这是一项考验，就像天主以前所做的那么多次。如果是这样，这将是你整个亡生中最艰难的一次。\n也许你会忍耐，但你甚至不确定你是否愿意。"
 PODcanon_chars.20.a:0 "她走了……"
 bad_moncada_modifier:0 "破碎世界"
 bad_moncada_modifier_desc:0 "你世界的重心已经死了。你现在是一个没有灵魂的躯壳，继续着毫无意义的亡生。"
 podintroductions.127.t:0 "你的故事就此展开"
 podintroductions.127.desc:0 "阿丰佐亲王，经过几个世纪的等待，君士坦丁堡终于属于你了。不过要小心，那些胆小的希腊吸血鬼在你巧妙地利用第四次十字军东征中时逃跑了，现在正召集他们的军队和手下来对付你。你明智地向暗影教区屈膝，在巩固你的统治时得到他们的保护。当然，这是一个暂时的过程，因为你有更大的野心，而不是仅仅做一个附庸。\n你并不关心你对该隐异端的“信仰”，如果需要的话，你会马上改变它，尽管坚持下去可能还有机遇。\n尽快扩大拉丁人的统治，摆脱拜占庭的残余势力。你的扬升才刚刚开始！"
 podintroductions.127.a:0 "新的胜利即将来临"
 podintroductions.alfonzo:0 "作为阿丰佐，你是唯一一位可以通过专属决议创建拉丁帝国的人。"
 alfonzo_decision:0 "拉丁之治"
 alfonzo_decision_tooltip:1 "是时候处理残余了"
 alfonzo_decision_desc:0 "你是拉丁人战胜希腊人的象征。接纳并利用这一形象为自己打造一个新的帝国。"
 alfonzo_decision_confirm:0 "拜占庭亡了"
 bad_gratiano_modifier:0 "新贵"
 bad_gratiano_modifier_desc:0 "你是勒森魃家族的不受宠子嗣。这没带来任何帮助！"
 podintroductions.128.t:0 "你的故事就此展开"
 podintroductions.128.desc:0 "格拉齐亚诺大人，强大的勒森魃本人看到了你的伟大，将你[Embrace|E]入他的[Clan|E]。这一行为激怒了你的新“同胞”，从那时起你就被打上了新贵的烙印，被剥夺了本该属于你的众多责任和头衔。你必须从头开始。\n为此，你选择了维罗纳，一个你还是凡人时就很熟悉的城市，立足点已经形成，但是……一切都还没有改变。他们仍然嘲笑你，在你背后侮辱你，甚至策划你的灭亡！这必须停止。\n你要让他们知道为什么勒森魃选择了你。你要让他们知道，格拉齐亚诺·德·维罗纳生来就是为了统治！"
 podintroductions.128.a:0 "他们会明白……"
 podintroductions.gratiano:0 "要摆脱格拉齐亚诺的初始修正，你必须完成一项专属决议。"
 gratiano_decision:0 "天生的统治者"
 gratiano_decision_tooltip:1 "他们会学会的。"
 gratiano_decision_desc:0 "向勒森魃[Clan|E]证明，你不仅仅是爸爸的新宠。取得一些他们必须注重的成就。"
 gratiano_decision_confirm:0 "他们已然学会"
 podintroductions.129.t:0 "你的故事就此展开"
 podintroductions.129.desc:0 "塞扬努斯大人，在你命中注定的[Embrace|E]之后，你在欧洲漂泊了相当长的时间，寻找一个地方来建立你的夜之帝国。你现在的位置很有期望，虽然可能离强大的哈德施塔特有点太近。你将不得不与他打交道。\n你很容易就获得了这个地区的亲王领，因为你得到了一些非常意外的帮助。一个名叫杰克的陌生英格兰棘秘魑被你和你的梦想所震慑，热切地承诺为你服务。经过简单的询问，你认为他是值得信赖的，而且对于这样一个年轻的吸血鬼来说，他实际上很有能力。\n发现一个较小的人认识到你的伟大总是令人欣慰的，也许你可以奖励他在你新兴的国度中担任一个重要角色？"
 podintroductions.129.a:0 "我可以利用你"
 podintroductions.129.b:0 "我不需要任何帮助！"
 podintroductions.130.t:0 "你的故事就此展开"
 podintroductions.130.desc:0 "萨利安娜女士，你对亚历山大的政变取得了巨大成功，你现在终于控制了法兰西的大部分地区。不过你不得不做出一些让步，最值得一提的是对亚历山大的子嗣杰弗里·杜·坦普尔的让步，他得到了巴黎本身作为回报。如果你要真正加强你对这个国家的控制，你就需要把这个著名的首都掌握在你手中。\n杰弗里年轻，容易受骗，但他有很多可能会成为麻烦的朋友。你必须谨慎行事，以便在不发生不必要的流血事件的情况下胜过他。"
 podintroductions.130.a:0 "是时候反思一下我们的关系了"
 salianna_intro_tooltip:0 "在接下来的日子里，你会引发一些考虑你与杰弗里的关系的事件。\n你开局时与杰弗里·杜·坦普尔在权力斗争。"
 PODcanon_chars.21.t:0 "战胜杰弗里"
 PODcanon_chars.21.desc:0 "要开始实施你取得巴黎的密谋，你必须孤立杰弗里。他的手下和人脉网络并不强大，但身为一位梵卓，对你的一些臣民来说，他是一个比你更“合法”的法兰西统治者。通过一些贿赂和隐晦的威胁，你可以改变这种状况。显然，他们会很容易理解，你会成为一个比一些愚蠢的军阀更好的巴黎亲王。"
 PODcanon_chars.21.a:0 "小菜一碟"
 PODcanon_chars.21.b:0 "我会让杰弗里留着他的战利品"
 salianna_exit_tooltip:0 "你放弃了为你自己取得巴黎的计划"
 PODcanon_chars.22.t:0 "剪除杰弗里的羽翼"
 PODcanon_chars.22.desc:0 "你很容易就摆脱了大部分杰弗里的试探性支持者，除了剩下两个人。安茹女王伊思妲·德·布莱斯已经表明了她的反对意见，但是……反正她已经厌恶你了，所以谁在乎呢？\n更麻烦的是顽固的弗朗索瓦·德阿伦库。这位有权有势的里昂亲王已经承诺为杰弗里的功业效力，永不变节。如果你继续你的行动路线，你将面对一个新的强大敌人。"
 PODcanon_chars.22.a:0 "或多或少……"
 PODcanon_chars.22.b:0 "我会让杰弗里留着他的战利品"
 PODcanon_chars.23.t:0 "巴黎，我回来了"
 PODcanon_chars.23.desc:0 "你已经完成了准备工作，现在准备以破竹之势将杰弗里驱出巴黎。这座城市将成为你的爱之皇廷的强大首都，并确保妥芮朵在法兰西的优势地位世代相传。\n最后要解决的问题是杰弗里本人。没有了巴黎，他基本上就没有爪牙了，如果你认为他没有更多的用处，你可以把他扔到一边。或者你可以把他留在手边，以便在将来执行另一项任务。在任何情况下，他显然对此事没有发言权。"
 PODcanon_chars.23.a:0 "我将在胜利中获得恩典"
 PODcanon_chars.23.b:0 "娇气的血侍对我没用"
 podintroductions.131.t:0 "你的故事就此展开"
 podintroductions.131.desc:0 "伊思妲女士，在亚历山大倒台的混乱中，你被萨利安娜击败，没能成为爱之皇庭的领导。但这并不是你事业的终点。你对安茹的控制力仍然很强，只要萨利安娜的权力没有得到巩固，她就很脆弱。\n在未来的战斗中，你将需要帮助，无论是政治还是军事。幸运的是，你对如何“教育”你的子嗣和摆脱无用的弱者有很好的把握。利用这个优势，法兰西可能最终是你的。"
 podintroductions.131.a:0 "战争还没有结束"
 isouda_intro_tooltip:0 "作为伊思妲，你在教育子嗣方面有一种更有回报，但有风险的专属可能性。"
 POD_education_events.1.option.e:0 "让我们看看其是否在我的宫廷里幸存下来……"
 POD_education_events.1.option.isouda:0 "作为伊思妲，你可以把你的子嗣放在无情的角斗场，或者说你的宫廷上。他们将从中变得更加强大……如果他们能活下来的话。"
 POD_education_events.26.t:0 "教育：可用的子嗣"
 POD_education_events.26.desc:0 "试炼已经结束，看起来这位还算是有用。嗯，勉强还不错吧，但说实话，你有一点点失望。也许你下次应加点料，让其在你无情的宫廷里蠕动求生的时候获得更多挑战，而看起来更有乐趣？嘛，改夜再想吧。"
 POD_education_events.26.option.a:0 "干得不错我猜"
 POD_education_events.27.t:0 "教育：无用的子嗣"
 POD_education_events.27.desc:0 "试炼已经结束，嗯，而这位没能度过。哦，好吧，反正还有很多凡人可以试炼。至少在中途完结之前，其看起来都很有趣。目睹无助的稚子陷入你的宫廷的阴谋网中，总是给你一种深深的满足感。"
 POD_education_events.27.option.a:0 "真的是最好的娱乐"
 podintroductions.132.t:0 "你的故事就此展开"
 podintroductions.132.desc:0 "埃丝克拉蒙德女士，你是公认的自阿尔比派十字军开始以来的奥克人抵抗法兰西的领袖……虽然你对奥克西塔尼亚本身并不那么关心，不过这也是个有用的针对公众视线的伪装。\n由于你的一种独特能力，该障眼法更上一层。通过以你过世的[Sire|E]告诉你的方式使用威仪术，你能够使任何男人迷失在一个他是骑士而你是公主的童话故事中。显然，从此，这位善良的公主可以指挥她勇敢的骑士杀死“怪物”，以保护她……"
 podintroductions.132.a:0 "我们每人都扮演着一位角色"
 esclarmonde_intro_tooltip:0 "作为埃丝克拉蒙德，你有一项可对你国度内的男人使用的专属[character_interaction|E]，该允许你魅惑他们。这将需要花费虔诚。"
 POD_esclarmonde_interaction:0 "埃丝克拉蒙德的童话魔咒"
 POD_esclarmonde_interaction_desc:0 "勇敢的骑士，请在我需要的时候帮助我吧！"
 faydit_modifier:0 "埃丝克拉蒙德的童话魔咒"
 faydit_modifier_desc:0 "这个可怜的灵魂迷失在幻觉中，以为自己是美丽的埃丝克拉蒙德公主的骑士。"
 podintroductions.133.t:0 "你的故事就此展开"
 podintroductions.133.desc:0 "无畏的梅琳达，你的[Sire|E]海伦在厌倦了对你的折磨后抛弃了你。你现在只能自力更生，但你在海伦的“教导”下学到了一件重要的事情：唯我独尊。\n那些愿意亲吻你的脚并证明有用的人可能会活下去。其他人……你将很乐意来对付这些其他人。\n如果这个世界必须陷入永恒的恐怖，以使你变得强大、受敬和独立，那就这样吧。\n你将在地狱中统治，并诅咒天堂。"
 podintroductions.133.a:0 "我想我现在明白了，“母亲”"
 melinda_intro_tooltip:0 "作为梅琳达·加尔布雷思，你有一项专属决议，只要你的首都还没有完全毁掉，你就可以蹂躏你的首都，获得一些快速的回报。"
 melinda_decision:0 "暴动！"
 melinda_decision_tooltip:1 "是时候发泄一下了"
 melinda_decision_desc:0 "在你的首都有许多无助的凡人。现在可能是时候让他们知道，末日的到来比他们想象的要快……"
 melinda_decision_confirm:0 "……而地狱紧随她后"
 podintroductions.134.t:0 "你的故事就此展开"
 podintroductions.134.desc:0 "狡猾的拉斐尔，说实话，你根本不知道这到底是怎么回事。你通过欺骗你的[Sire|E]，使其认为你是一位关于阴谋和恶作剧的艺术家，才勉强保住了自己的亡生，但你仍然对整个吸血鬼社会的运作没有真正的线索。\n从你收集到的一些东西来看，你最好尽快学习，因为无知的吸血鬼在大多数情况下都是死得快的吸血鬼。你只有一个优势可言，就是你的智慧。你有能力说服几乎所有的人去做任何事情。这可能将是你的救生索……"
 podintroductions.134.a:0 "我能做到！"
 rafael_intro_tooltip:0 "作为拉斐尔，你有一项花费声望来欺骗其他有地统治者给你一些东西的专属[character_interaction|E]。具体回报取决于他们的特质。"
 POD_rafael_interaction:0 "我的超值提议！"
 POD_rafael_interaction_desc:0 "向这位统治者提出一个非同寻常的提议"
 PODcanon_chars.24.t:0 "诱人的骗局"
 PODcanon_chars.24.desc:0 "拉斐尔，你的完美推销让这个人着迷了。现在是时候去收割了，你想要什么？它将取决于你所处的角度。"
 PODcanon_chars.24.a:0 "你可以相信我！"
 rafael_trusting_tooltip:0 "这个选项可用是因为你的目标拥有轻信他人或合群特质。"
 PODcanon_chars.24.b:0 "……然后我的尊长就抛弃了我！"
 rafael_compassionate_tooltip:0 "这个选项可用是因为你的目标拥有慈悲特质。"
 PODcanon_chars.24.c:0 "这很吸引人，我肯定会皈依的！"
 rafael_zealous_tooltip:0 "这个选项可用是因为你的目标拥有狂热特质。"
 PODcanon_chars.24.d:0 "有意思的东西，让我记个笔记！"
 rafael_diligent_tooltip:0 "这个选项可用是因为你的目标拥有勤勉或耐心特质。"
 PODcanon_chars.24.e:0 "该死的，我从来没敢这么做！"
 rafael_brave_tooltip:0 "这个选项可用是因为你的目标拥有勇敢或固执特质。"
 PODcanon_chars.24.f:0 "你简直是最棒的！"
 rafael_ambitious_tooltip:0 "这个选项可用是因为你的目标拥有野心勃勃或傲慢特质。"
 PODcanon_chars.24.g:0 "亡生很棒！"
 rafael_content_tooltip:0 "这个选项可用是因为你的目标拥有安于现状或谦卑特质。"
 PODcanon_chars.24.h:0 "他们绝对是来抓我们的！"
 rafael_deceitful_tooltip:0 "这个选项可用是因为你的目标拥有狡诈或多疑特质。"
 PODcanon_chars.24.i:0 "……这很形象"
 rafael_cynical_tooltip:0 "这个选项可用是因为你的目标拥有愤世嫉俗或冷酷特质。"
 PODcanon_chars.24.j:0 "说的不错！"
 rafael_end_tooltip:0 "你没有更多角度来进逼该目标！"
 podintroductions.135.t:0 "你的故事就此展开"
 podintroductions.135.desc:0 "美丽的罗莎蒙，你现在在马格德堡，被流亡的玛土撒拉亚历山大几乎绑架了。这个曾经的法兰西统治者说他爱你，但你知道，他那颗冷酷的心有一天晚上会被激怒，足以摧毁你，就像他对他曾经的“灵魂伴侣“所做的那样。你需要盟友。\n还有谁比大胆的约根·冯·费尔登更合适呢？你认识他已经有一段时间了，而且你们都非常喜欢对方。但是，你们的爱情将无法真正成长，即使你嫁给他，若亚历山大没被彻底解决。你被教导得很好，你不是无助的少女，罗莎蒙德，你知道该怎么做。"
 podintroductions.135.a:0 "爱战胜一切"
 rosamund_intro_tooltip:0 "作为罗莎蒙，只要你和约根仍然是灵魂伴侣，你就有一项专属决议可以使用。"
 love_triumph_modifier:0 "爱的胜利"
 love_triumph_modifier_desc:0 "……他们从此就幸福地生活在了一起。大概。"
 rosamund_decision:0 "三角恋"
 rosamund_decision_tooltip:1 "是时候简化你的爱情生活了"
 rosamund_decision_desc:0 "亚历山大是一个压迫性的控制狂，随时都可能在愤怒中杀死你。你得对付他。"
 rosamund_decision_confirm:0 "圆满的结局"
 rosamund_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死"
 rosamund_custom_decisionb:0 "你必须得是[TARGET_CHARACTER.GetFirstName]的灵魂伴侣"
 podintroductions.136.t:0 "你的故事就此展开"
 podintroductions.136.desc:0 "睿智的卡尔，你保护旧有传统的倡议到目前为止是成功的。自由邦还很年轻，但每夜都在增长，更令人放心……但麻烦就在眼前。\n你的两个主要盟友，埃里克·朗托斯和乌尔夫斯多蒂尔，已经到了摊牌的地步，并互相掐架。埃里克是一个强大的战士，但他对凡人的完全不关心使女武神感到不安。作为回报，乌尔夫斯多蒂尔默默地接受了你传统缓慢的终末，这激怒了朗托斯。\n如果你想让自由邦继续存在下去，你需要选择一个阵营……并且可能要对付那个会感到受委屈的一边。"
 podintroductions.136.a:0 "你是个怪物，埃里克，必须得有人阻止你"
 podintroductions.136.b:0 "我们必须为了大业而战，乌尔夫斯多蒂尔！"
 podintroductions.136.c:0 "你们都是蠢货！"
 podintroductions.137.t:0 "你的故事就此展开"
 podintroductions.137.desc:0 "强大的比约恩，你又一次被拖入一场失败的战争。在你驶向文兰时，你在苏格兰遇难，成了船员中唯一的幸存者。当地的吸血鬼，大多是来自密特拉对岛屿的铁腕控制的难民，非常欢迎你，以至于你觉得亏欠了他们。\n你不是那种会把朋友留在身后的人，所以你现在在这里，领导者针对密特拉对这片土地不可避免的攻击的抗战。你需要新船员来完成这样一项艰巨的任务，只有最好的、最忠诚的人才能胜任。"
 podintroductions.137.a:0 "新地方，老麻烦"
 bjorn_intro_tooltip:0 "作为比约恩，你有着可以让某人成为你的队友的专属[character_interaction|E]。\n你最多只能有5个无地的吸血鬼作为队友，而且他们需要对你有好感才会接受。"
 bjorn_crew_modifier:0 "比约恩的队友"
 bjorn_crew_modifier_desc:0 "比约恩·加里森的队伍的成员，一个留给训练有素的战士的位置"
 POD_bjorn_crew_opinion:0 "比约恩的队友"
 POD_bjorn_interaction:0 "邀请加入你的队伍"
 POD_bjorn_interaction_desc:0 "该角色将成为你的5个队友之一"
 POD_bjorn_crew_interaction_limit:0 "该角色必须对你好感为正，而且你不能有超过5个队友"
 POD_bjorn_opinion_limit:0 "该角色必须对你好感为正"
 podintroductions.138.t:0 "你的故事就此展开"
 podintroductions.138.desc:0 "无畏的罗宾，你的义军的未来看起来很糟糕。可恨的暴君密特拉在几年前赢得了你们之间最近的一场战斗，严重削弱了你对不列颠群岛的影响力。但仍有希望，因为他还没有去杀戮，也许他正忙于其他事情，或者像他这样的老吸血鬼只是感到无聊。这可能是你的机会。\n迅速做好准备，以防再次受到攻击，在那些愿意听从的人中播下起义的种子，并一劳永逸地拿下密特拉。只有这样，不列颠群岛才能真正获得自由。"
 podintroductions.138.a:0 "我被逼到了墙角，但我还没有被击败"
 leeland_intro_tooltip:0 "作为罗宾，你有一项在年轻吸血鬼中播下叛变的种子的专属[character_interaction|E]，给其他国度造成混乱。"
 seed_of_rebellion_leeland_modifier:0 "叛变之种"
 seed_of_rebellion_leeland_modifier_desc:0 "这个角色已经被一个传奇的不法之徒推到了叛变的边缘"
 POD_leeland_interaction:0 "叛变之种"
 POD_leeland_interaction_desc:0 "在该年轻吸血鬼心智中播下叛变的种子"
 podintroductions.139.t:0 "你的故事就此展开"
 podintroductions.139.desc:0 "维罗妮克女士，在巴黎的冒险之后，你回到了你的家乡。你在反对暴虐的法兰西亲王亚历山大的政变中提供了帮助，并在此过程中获得了一些认可。可悲的是，你也在狡诈的让·巴蒂斯特·德·蒙特龙手下失去了许多值得信赖的家臣。总有一夜，你将能“报答”他。\n除了这场突如其来的竞争，你的地位基本上是安全的。你已经在努力重建你的凡人朋友队伍，这在[cainites|E]中是个怪现象，但却给了你力量。利用你对人性的信任来发挥你的优势，那些低估你的人很快就会知道，你在任何专业领域都可以和他们一样熟练。"
 podintroductions.139.a:0 "我会以自己的方式参与他们的棋局"
 veronique_intro_tooltip:0 "作为维罗妮克，只要你还具有人性之道信仰，你在“巡视首都​”活动中就有着专属事件。"
 POD_survey_events.150.t:0 "巡视：维罗妮克的伴随者"
 POD_survey_events.150.desc:0 "你是少数几位真正会与凡人培养一些关系的[cainites|E]之一，而不是只把他们当作牲畜或更大棋局中的棋子。因此，你在城里实际上有一些朋友，愿意在许多不同的事情上帮助你。就像所有的人脉一样，你必须不时地拜访他们，处理他们可能遇到的任何相关麻烦，但你总是发现这是一些有意义的经历。凡人对不断变化的世界的适应性比任何[cainite|E]所想象的要强得多。"
 POD_survey_events.150.option.a:0 "很高兴再次见到你！"
 veronique_survey_tooltip:0 "只要维罗妮克坚持人性之道信仰，这种专属巡视结果就会一直发生在她身上。"
 podintroductions.140.t:0 "你的故事就此展开"
 podintroductions.140.desc:0 "伟大的斯巴达的墨涅拉俄斯，你追捕叛徒海伦已经几个世纪了，这场冲突似乎没有尽头。她显然需要受到惩罚，因为她策划了你心爱的迦太基的毁灭，但你也为你的[Clan|E]的衰落感到悲哀。你可以做很多事情来帮助它恢复……如果你不是那么专注于追捕你的宿敌。\n你们之间的传说级竞争必须以某种方式结束，那么也许还有时间来治愈你破碎的[Clan|E]。"
 podintroductions.140.a:0 "终结永恒恩怨……"
 menele_intro_tooltip:0 "作为墨涅拉俄斯，你有一项专属决议，需要你先解决海伦这麻烦。如果你达成了它，你就可以解锁一项[character_interaction|E]，能让其他布鲁赫了解你[Clan|E]的光辉。"
 menele_decision:0 "斯巴达对特洛伊"
 menele_decision_desc:0 "海伦已经占据了你过多的时间。处理掉她，之后还有更重要的事需要你关注。"
 menele_decision_confirm:0 "终于！"
 menele_decision_tooltip:1 "是时候结束这无稽之谈了"
 menele_decision_effect_tooltip:0 "你将可以解锁一项让其他布鲁赫了解你[Clan|E]的光辉的[character_interaction|E]"
 PODcanon_chars.25.t:0 "新的开始"
 PODcanon_chars.25.desc:0 "终于，与海伦的这桩破事过去了。这花了很长时间，但你终于意识到，她最大的背叛并不是帮助罗马人对抗迦太基，而实际上是在你的[Clan|E]最需要你的时候让你分心了。\n布鲁赫依然分裂，被愤怒和悲伤所淹没，是辉煌的古时夜晚的苍白反转。这不一定是唯一的出路。你是传奇的墨涅拉俄斯，只要你开口，即使是你[Clan|E]中最顽固的成员也会倾听。你必须成为他们前进的指路明灯，因为没有其他人能做到。"
 PODcanon_chars.25.a:0 "我们是迦太基的遗裔"
 menele_victory_tooltip:0 "你将可以解锁一项让其他布鲁赫了解你[Clan|E]的光辉的新[character_interaction|E]"
 POD_menele_teachings_interaction:0 "迦太基的教诲"
 POD_menele_teachings_interaction_desc:0 "让其他布鲁赫记起他们的光荣历史和光明的未来。"
 PODcanon_chars.26.t:0 "课程"
 PODcanon_chars.26.desc:0 "作为仍活跃在这些夜的最受尊敬的布鲁赫，你有足够的影响力让你的[Clan|E]的任何成员坐下来听你说话，只要你用心去做。\n在准备工作完成后，你只需要考虑你到底要教这个人什么。如果说与海伦的冲突教会了你什么，那就是你没有足够的时间只浪费在一个人身上。"
 PODcanon_chars.26.a:0 "掌控你的心兽只有一种办法"
 PODcanon_chars.26.b:0 "让我们谈谈迦太基"
 PODcanon_chars.26.c:0 "自控是关键"
 ANTI_HEDEON_PACT:0 "反海德翁协定"
 podintroductions.141.t:0 "你的故事就此展开"
 podintroductions.141.desc:0 "伊扎克大人，由于拉兹科利纳亲王对梵卓入侵的纠缠，你最近成功地大大扩展了你在波兰的影响力。但你并不是唯一从这个事件中获利的人。海德翁·雅罗斯拉维奇，即使对他已经相当虐待狂的[Clan|E]来说也是一个恶毒的怪物，也使他的国度得到了相当大的发展。他的黑暗阴影现在越来越接近于吞噬波兰。\n也许有一条出路。你不信任拉兹科利纳，但你知道她的邪恶程度远远低于海德翁，而且她可能对你也有同样的感觉。在你们之间谈判休战，可以让你们俩先把注意力放在海德翁身上。在那之后，很明显，所有的赌注都会消失……"
 podintroductions.141.a:0 "拉兹科利纳亲王，让我谈谈"
 podintroductions.141.b:0 "她不比海德翁好多少！"
 podintroductions.142.t:0 "你的故事就此展开"
 podintroductions.142.desc:0 "赫克托大人，新拉科尼亚的安全要归功于你强有力的领导。如果你愿意，你的领地周围摇摇欲坠的拜占庭帝国甚至可能提供扩张的机遇。虽然国内也有麻烦需要处理。\n按照迦太基的传统，你在元老院的建议下进行统治，但这个庄严的机构存在分歧。大多数参议员希望你走理想化和纯粹的迦太基之路。开始变得越来越多的少数人则希望采取更实用的方法，包括古迦太基中最不光彩的因素。你对其中一个派别的支持将为你的国度在未来几年的重点铺平道路。"
 podintroductions.142.a:0 "大会开始！"
 hektor_intro_tooltip:0 "作为赫克托，你有一项专属决定，那就是召集参议院并选择你未来几年的重心。\n如果安条克和莫林这两位党派领导人还活着，你可以选择一个更强大的重心。"
 hektor_decision:0 "参议院大会"
 hektor_decision_tooltip:1 "我需要参议院的建议"
 hektor_decision_desc:0 "在即将到来的参议院任期内，你会偏向哪一党派？"
 hektor_decision_confirm:0 "开会时请保持秩序！"
 hektor_decision_effect_tooltip:0 "你将选择未来几年的政策。"
 PODcanon_chars.27.t:0 "参议院"
 PODcanon_chars.27.desc:0 "赫克托，你的新生迦太基参议院的这次新大会和以往一样。理想主义者斥责你“背叛”了他们亲爱的乌托邦，而实用主义者则敦促你想想为什么迦太基曾如此强大，且不计代价。值得庆幸的是，最后的决定权只属于你。"
 PODcanon_chars.27.a:0 "为理想而战！"
 PODcanon_chars.27.b:0 "迦太基是首要且主要的理想。"
 PODcanon_chars.27.c:0 "两者间持平是唯一的途径。"
 PODcanon_chars.27.d:0 "必须做出牺牲！"
 PODcanon_chars.27.e:0 "狼群已在我等门外！"
 antiochus_alive_tooltip:0 "这个选项可用是因为安条克还活着。"
 maureen_alive_tooltip:0 "这个选项可用是因为莫林还活着。"
 full_idealist_support_modifier:0 "彻底支持理想主义"
 full_idealist_support_modifier_desc:0 "迦太基是一个纯粹而完美的乌托邦。没有人可以反驳这个事实。"
 idealist_support_modifier:0 "支持理想主义"
 idealist_support_modifier_desc:0 "迦太基是一个值得为之斗争的理想，尽管它可能有任何缺陷。"
 pragmatist_support_modifier:0 "支持实用主义"
 pragmatist_support_modifier_desc:0 "我们并不生活在梦中。必须得有牺牲。"
 full_pragmatist_support_modifier:0 "彻底支持实用主义"
 full_pragmatist_support_modifier_desc:0 "如果没有它的梦魇，迦太基的幻梦就一无是处。"
 podintroductions.143.t:0 "你的故事就此展开"
 podintroductions.143.desc:0 "伊卡捷琳娜女士，到目前为止，您在该地区的影响力一直在增长，这在很大程度上要归功于您非常有才华的子嗣克里斯托夫·罗慕铎。遗憾的是，你那鲁莽的后代在维谢赫拉德的一场残酷战斗后失踪了。这个疯子试图通过砍杀守卫城堡的所有恐怖棘秘魑，独自冲进堡垒！\n不过，毕竟克里斯托夫还是克里斯托夫，你知道，如果引导得当，他可以非常有用。你可以组织一个搜索队去维谢赫拉德的废墟，找到他并把他带回来给你。或者，也许他的用处已经用完了？"
 podintroductions.143.a:0 "我又有一项任务要给你，克里斯托夫"
 podintroductions.143.b:0 "他那由阴谋组成防护似乎已经持续不了多久了"
 podintroductions.144.t:0 "你的故事就此展开"
 podintroductions.144.desc:0 "奥古斯都大人，你一直在迅速抓住[Embrace|E]给你的机会。你家族的商业（和亡灵术）帝国正在成长，而这些懒散的卡帕多西亚并没预测到这。如此，你只是一个人，你必须首先集中精力，最终夺取威尼斯本身的控制权。\n对于其他事务，你可以依靠你的三个副手，克劳狄乌斯、安布罗吉奥和伊尼亚齐奥。每个人都有自己的强项，他们都希望得到你的认可。如果你出对了牌，你可以让他们在很长一段时间内都有用，并忙于彼此之间的争吵（而不是谋害你）。"
 podintroductions.144.a:0 "我等的扬升开始了"
 augustus_intro_tooltip:0 "作为奥古斯都，你有一项专属决议，让你可以偏爱众副手中的之一，只要其还活着。"
 augustus_decision:0 "你的右手"
 augustus_decision_tooltip:1 "吵闹但是有用的子嗣"
 augustus_decision_desc:0 "哪位副手在接下来的年里会有你的偏爱？"
 augustus_decision_confirm:0 "让我想想……"
 augustus_decision_effect_tooltip:0 "你将选择在接下来的年里偏爱的副手"
 augustus_custom_decision:0 "至少[CHARACTER.GetFirstName]、[TARGET_CHARACTER.GetFirstName]或安布罗吉奥中的一人还活着"
 claudius_support_modifier:0 "克劳狄乌斯的支持"
 claudius_support_modifier_desc:0 "克劳狄乌斯是个阴险狡诈的混蛋。但他是你的阴险狡诈的混蛋。"
 ignazio_support_modifier:0 "伊尼亚齐奥的支持"
 ignazio_support_modifier_desc:0 "伊尼亚齐奥并不是最聪明的乔凡尼，但他强力的剑术可能是非常有用的。"
 ambrogino_support_modifier:0 "安布罗吉奥的支持"
 ambrogino_support_modifier_desc:0 "安布罗吉奥的野心大到对其不利的地步。最好还是满足和亲近他。"
 PODcanon_chars.28.t:0 "副手"
 PODcanon_chars.28.desc:0 "作为家族的族长，你的宠爱本就是一种宝贵的资源。你的三个主要代理人总是想讨好你，并超越其的竞争对手。这个小竞争还有一个好处，就是让其分割开来，忙着在其等之间策划阴谋互相针对，而不是反抗你。双赢。\n但最终，该信任谁和该拒绝谁，只能由你自己选择。"
 PODcanon_chars.28.a:0 "克劳狄乌斯是我最宠爱的儿子。"
 PODcanon_chars.28.b:0 "安布罗吉奥是我们间最棒的。"
 PODcanon_chars.28.c:0 "伊尼亚齐奥的简易方法很有用。"
 PODcanon_chars.28.d:0 "这次没人赢得我的青睐"
 claudius_alive_tooltip:0 "这个选项可用是因为克劳狄乌斯还活着。"
 ambrogino_alive_tooltip:0 "这个选项可用是因为安布罗吉奥还活着。"
 ignazio_alive_tooltip:0 "这个选项可用是因为伊尼亚齐奥还活着。"
 podintroductions.145.t:0 "你的故事就此展开"
 podintroductions.145.desc:0 "安布罗吉奥大人，你注定将是伟大的。尽管你只是乔凡尼家族的一个私生子，但你已经取得了很多成就，对你新的吸血鬼状况的了解比家族其他成员（包括奥古斯都）还要多。但这仅仅是个开始，因为你的脑袋正为眼前的各种可能性而旋转。\n你需要更多的神秘文本，更多失落的预言，更多隐秘的羊皮纸。在某处可以找到一个真理，这个真理可以导往神格，你确信这一点。旅程将是漫长的，但回报……回报将是你最疯狂的幻想，不，你的宿命！成真。"
 podintroductions.145.a:0 "我将寻到关键"
 ambrogino_intro_tooltip:0 "作为安布罗吉奥，你在完成“萨尔贡圣书”决议后将获得一项专属决议。"
 ambrogino_sargon_codex_modifier:0 "安布罗吉奥的宿命"
 ambrogino_sargon_codex_modifier_desc:0 "萨尔贡圣书所展示的比你所能想像出的还要多！神格从未如此触手可及……"
 pod1230objectives.49.c:0 "我知道该如何掌控它……"
 sargon_ambrogino_tooltip:0 "这个选项只对安布罗吉奥·乔凡尼可用"
 podintroductions.146.t:0 "你的故事就此展开"
 podintroductions.146.desc:0 "克劳狄乌斯大人，那个阴险狡诈的私生子安布罗吉奥这次做得太过分了。你长期以来一直在培养你自己的曾孙女卢克丽霞，让她成为你的一个子嗣，但那个贪婪的小偷不知怎么说服了你的亲生父亲奥古斯都，把卢克丽霞送给了他！这是最后一根稻草。\n你是奥古斯都的继承人，无论是在凡生还是亡生。安布罗吉奥不过是一个发迹的女仆的儿子，过于自命不凡。现在是时候一劳永逸地除掉他了……还有卢克丽霞，因为她现在已经被这个杂种的血液玷污了。只有这样，你才能够承担起你作为奥古斯都的右手的应有地位。"
 podintroductions.146.a:0 "他将为这一阴谋感到后悔！"
 claudius_intro_tooltip:0 "作为安布罗吉奥，你有一项除掉克劳狄乌斯和卢克丽霞来获得收益的专属决议。"
 rightful_giovanni_heir_modifier:0 "正当的乔凡尼继承人"
 rightful_giovanni_heir_modifier_desc:0 "没有人可以否认你现在是你父亲遗产的真正继承人。"
 claudius_decision:0 "乔凡尼的继承者"
 claudius_decision_tooltip:1 "唯有你，没有他人，是奥古斯都的继承者"
 claudius_decision_desc:0 "除掉那个讨厌的安布罗吉奥和他从你那里偷走的最受他宠的子嗣！这将是对任何潜在的对手的有力警告。"
 claudius_decision_confirm:0 "正义的胜利！"
 claudius_custom_decision:0 "[CHARACTER.GetFirstName]和[TARGET_CHARACTER.GetFirstName]都必须死"
 weak_falsinar_modifier:0 "微弱的法尔西纳之助"
 weak_falsinar_modifier_desc:0 "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 podintroductions.147.t:0 "你的故事就此展开"
 podintroductions.147.desc:0 "马库斯·穆萨大人，你在家族和[Clan|E]中的名声正在迅速上升。你在埃及挫败了拉撒路的疯狂计谋，证明了自己的能力。但代价是高昂的，你在战斗中失去了你的两个亲信。其中一个人，法尔西纳，被证明是一个相当有意志力的灵魂，因为即使在冥界，他仍然尽其所能地帮助你。\n法尔西纳仍然是一个弱小而年轻的死灵，但你是一个熟练的亡灵术师，因此你已经确定了两种可能性，以帮助你的鬼朋友在你的世界中更容易地显现出自己。这两个方法都不容易实现，但反正你和法尔西纳有的是时间。"
 podintroductions.147.a:0 "亡灵术师与死灵，完美的搭档"
 markus_intro_tooltip:0 "作为马库斯·穆萨，你有两项当达成时能强化法尔西纳的专属决议"
 markus_nikita_decision:0 "死亡节点"
 markus_nikita_decision_tooltip:1 "关键之一在于克罗地亚"
 markus_nikita_decision_desc:0 "斯雷代茨的尼基塔，挪得大主教，似乎在引诱一些强大的亡灵能量到他身边。这是个加强法尔西纳的机会。"
 markus_nikita_decision_confirm:0 "又一受我束缚的灵魂"
 markus_nikita_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死"
 markus_nikita_decision_effect_tooltip:0 "法尔西纳将变得更强"
 medium_falsinar_modifier:0 "法尔西纳之助"
 medium_falsinar_modifier_desc:0 "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 high_falsinar_modifier:0 "强力的法尔西纳之助"
 high_falsinar_modifier_desc:0 "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 markus_egypt_decision:0 "回到埃及"
 markus_egypt_decision_tooltip:1 "这个地方有一些不好的回忆……"
 markus_egypt_decision_desc:0 "法尔西纳在埃及为保护你免受拉撒路的伤害而死。你从未能够找回他的遗体。若做到了肯定会帮助你加强他的死灵。"
 markus_egypt_decision_confirm:0 "适当的安葬"
 markus_egypt_decision_effect_tooltip:0 "法尔西纳将变得更强"
 podintroductions.148.t:0 "你的故事就此展开"
 podintroductions.148.desc:0 "雅弗大人，您作为卡帕多西亚[Clan|E]的非正式领袖的身份并不切合实际。你的同胞们都是出了名的孤僻，对你的崇高责任大多不闻不问。更糟糕的是，你的[Sire|E]卡帕多修斯自己也经常迷失在自己的宏伟幻想或疯狂情绪中。但作为[Clan|E]的始祖，他的话就是法律，而你若不尽责，就什么都不是。\n他最近的幻想看到威尼斯人乔凡尼被[Embrace|E]入血脉，这是你坚决不同意的事情。不过，你别无选择，只能就这样继续下去，限制你的[Sire|E]最糟糕的过度行为，同时维护卡帕多西亚[Clan|E]的完整性。永恒从未如此漫长。"
 podintroductions.148.a:0 "我的工作从未完成"
 japhet_intro_tooltip:0 "作为雅弗，你有一项检视卡帕多修斯的专属小决议。不过要小心他的奇行。"
 japhet_decision:0 "父之罪"
 japhet_decision_tooltip:1 "希望他正处于好心情……"
 japhet_decision_desc:0 "你是埃尔吉耶斯，卡帕多修斯本人的居所的看守人。这是一个巨大的荣誉……也是一个巨大的负担，因为[antediluvian|E]往往是难以理解的。"
 japhet_decision_confirm:0 "没有回头路了"
 japhet_decision_effect_tooltip:0 "你将检视卡帕多修斯，期望他还好……而且没太迷失在自己的幻想世界里。"
 PODcanon_chars.29.t:0 "卡帕多修斯：计划"
 PODcanon_chars.29.desc:0 "他又来了……你庄严的[Sire|E]，可敬的卡帕多修斯自己又开始了他的妄想，想要[diablerize|E]天主。作为一个热衷于基督教的人，他一直以自己扭曲的方式迷恋着“全一的天主”。你很肯定奥古斯都·乔凡尼的[Embrace|E]也与此有某种联系。\n在任何情况下，他都在详细讲述他的疯狂计划，当然希望得到你的热情批准。你没有办法和他讲道理，但你至少希望不要在被这个疯狂的追求拖得太深。"
 PODcanon_chars.29.a:0 "这可能仍有一些缺陷。"
 PODcanon_chars.29.b:0 "多么完美的计划，尊长！"
 PODcanon_chars.29.c:0 "*叹气*是的，这很厉害"
 PODcanon_chars.30.t:0 "卡帕多修斯：导师"
 PODcanon_chars.30.desc:0 "你尊敬的[Sire|E]今晚的心情很好，很安静，把你带回到了他的妄想心开始游荡之前的美好时光。他实际上很高兴见到你，你们谈论了你们所看到的许多奇迹和恐怖。正是在这些轻松的时光里，你回忆起了卡帕多修斯曾经是一位伟大的人，希望现在也能如此。\n你离开他的房间时，更加坚定了继续工作的决心，而且比进来时更加聪慧了。"
 PODcanon_chars.30.a:0 "萨尔贡为尊长如何？"
 PODcanon_chars.30.b:0 "我期望我能认识以诺本人……"
 PODcanon_chars.30.c:0 "我们能谈谈亚设么？"
 PODcanon_chars.31.t:0 "卡帕多修斯：牧师"
 PODcanon_chars.31.desc:0 "卡帕多修斯是一个狂热的信徒，他对基督教的看法是扭曲的。因此，他想参加弥撒……或亲自担任牧师，尽管这显然很讽刺。\n你已经习惯于处理他的这种癖好，但总是很难避免不必要的关注，因为你的[Sire|E]对他的吸血鬼状况并不完全谨慎。"
 PODcanon_chars.31.a:0 "我将举办圣餐"
 PODcanon_chars.31.b:0 "祈祷就够了"
 PODcanon_chars.31.c:0 "安全第一"
 podintroductions.149.t:0 "你的故事就此展开"
 podintroductions.149.desc:0 "贝拉大人，你终于找到了你的人生目标。基督教道德的琐碎枷锁并不适合你，你注定要做得更多！库帕拉，这个仁慈而强大的实体，正在大地上寻找一个化身，还有谁比你更合适？\n显然，必须做出一些献祭……或很多献祭。但在神化面前，谁会在乎一个人、一个城市甚至整个国家呢？你当然不会。很快你就会撕开这个注定要毁灭的世界脆弱的理智面纱，然后一切都将成为灰、血和火。\n而在这场末日性的涅槃中，你将成为唯一的幸存者。"
 podintroductions.149.a:0 "一个垂死世界的最后喘息……"
 bela_intro_tooltip:0 "作为贝拉·拉森科，你有一项为库帕拉献祭你的伯爵领的专属决议。如果你做得够多，谁知道会发生什么？"
 bela_decision:0 "库帕拉崛起"
 bela_decision_tooltip:1 "送他们下地狱！"
 bela_decision_desc:0 "库帕拉需要献祭才能显现在这个不幸的世界上。而你非常乐意提供。"
 bela_decision_confirm:0 "地狱在崛起。"
 bela_decision_effect_tooltip:0 "完成了……"
 kupala_rising_weakest:0 "隐然的库帕拉影响"
 kupala_rising_weakest_desc:1 "伟大的恶魔已经注意到你的努力……"
 kupala_rising_weak:0 "微弱的库帕拉影响"
 kupala_rising_weak_desc:0 "伟大的地缚魔已经注意到你的持续努力……"
 kupala_rising_medium:0 "中等的库帕拉影响"
 kupala_rising_medium_desc:0 "伟大的大公爵把你当作祂最喜爱的侍从……"
 kupala_rising_strong:0 "强力的库帕拉影响"
 kupala_rising_strong_desc:0 "伟大的大天使现在离你很近，在你耳边低语，让你做更多的事……"
 kupala_avatar_modifier:0 "库帕拉的化身"
 kupala_avatar_modifier_desc:0 "……而地狱随祂其后"
 PODcanon_chars.32.t:0 "吾等为一"
 PODcanon_chars.32.desc:0 "该宿主很有趣。显然，与你的天启形态相比，它是相当脆弱的，但它能用。你不能否认它为把你召唤入一个更适合这个世界的形态所做的巨大努力。在你接管的过程中，你很高兴能迅速吞噬他的灵魂。\n在那个该死的监狱里关了那么久之后，你终于自由了，现在有很多事情可做。尽管你有相当大的力量，但这脆弱的身体在崩溃之前只能承受这么多，所以你必须小心。不过，感谢召唤你的那个傻瓜，你有的是时间。\n毕竟通往地狱最安全的那条道路是渐进的那一条。"
 PODcanon_chars.32.a:0 "天堂在垂泪"
 silver_attacks_modifier:0 "银牙劫掠"
 silver_attacks_modifier_desc:1 "狼人在这个省份里很不安分，不断地试探你控制力的极限。"
 podintroductions.150.t:0 "你的故事就此展开"
 podintroductions.150.desc:0 "阿帕西亚女士，你的收养的人民正处于危险之中。你对西比尔汗国的控制受到了狂热的银牙狼人战群的挑战，他们对你在他们认为是自己家园的地方的干涉感到愤怒。你可以与他们战斗，但这将是一个漫长而艰巨的过程，而且你在该地区的地位已经相当不安全了。\n然而，另一个解决方案正在出现，安答，来自蒙古文化的吸血鬼，正在迅速为自己争取大草原。他们的领袖最近发来消息，要求你向他的部族效忠，以换取他对掠夺成性的狼人的保护。也许暂时失去独立来换取你的人民的安全是值得的？"
 podintroductions.150.a:0 "我不需要任何帮助！"
 podintroductions.150.b:0 "大草原在统一"
 podintroductions.151.t:0 "你的故事就此展开"
 podintroductions.151.desc:0 "迈卡大人，您在最近的和平条约中的聪明之举使您的奥伯图斯教团被确立为德意志梵卓和您东边的族人之间的一个缓冲国。但这一地位并不安全，仍有许多工作要做。\n你最近还了解到，斯雷代茨的尼基塔，挪得大主教，可能与棘秘魑[Clan|E]的一个最严密的秘密有关。你的学术头脑无法抗拒这种发现的诱惑，但你必须冲进尼基塔的城市去了解更多，这可能是一个令人生畏的前景。像往常一样，注意平衡你对知识的追求和你更多的世俗野心。这一直是你自己通往伟大的道路。"
 podintroductions.151.a:0 "一刻也不能耽误。"
 myka_intro_tooltip:0 "作为迈卡·维科斯，你有一项学得挪德大主教的秘密的专属决议。其收益可能将是远大于迈卡所能把握的……"
 myka_decision:0 "黑暗的秘密"
 myka_decision_tooltip:1 "寻求不可知的真相"
 myka_decision_desc:0 "斯雷代茨的尼基塔隐藏着棘秘魑[Clan|E]最重要的秘密之一。与他打交道，冲进他的藏身处，并得知真相。"
 myka_decision_confirm:0 "我必须要知道！"
 myka_decision_effect_tooltip:0 "迈卡将获得新生。"
 PODcanon_chars.33.t:0 "丑陋的真相"
 PODcanon_chars.33.desc:0 "所有这些充满幻想的探索都只是一个陷阱。\n你在尼基塔的藏身处里没有发现任何真相，除了意识到尼基塔在你知道他是谁之前就已经死了，并被一个强大的棘秘魑玛土撒拉所冒充。而这位玛土撒拉引导你来到了这里，因为他发现你会成为比已故大主教更好的“宿主”。\n你已经可以看到它的卷须，不管是精神上的还是其他方面的，都在伸来将你融合到一个更“适当”的形式中去。\n这可能是迈卡·维科斯的终末。"
 PODcanon_chars.33.a:0 "……一切都改变了"
 PODcanon_chars.33.b:0 "快跑！"
 podintroductions.152.t:0 "你的故事就此展开"
 podintroductions.152.desc:0 "诺利兹大人，懒散颓废的时代已经过去。虽然让你的子嗣们在大逃杀中互相对决当然很有趣，但你不能忘记你曾经是棘秘魑[Clan|E]的主人。弗拉基米尔·罗斯托维奇，那个懦弱的篡位者，从你手中夺走了它，但他对德意志梵卓的羞辱性失败是你等待的机会。\n你必须坚持你作为军督之督的合法宣称，彻底解决罗斯托维奇。然后你的世系就可以重新获得应有的威望。"
 podintroductions.152.a:0 "这是你最终的错误，弗拉基米尔……"
 noriz_intro_tooltip:0 "作为诺利兹，如果你成为军督领的领袖，你将能解锁一项专属决议。如果达成，它将提高你的起始修正。"
 house_noriz_modifier:0 "诺利兹家族"
 house_noriz_modifier_desc:1 "真正的军督之督已然回归。特兰西瓦尼亚比以往任何时候都更令人恐惧。"
 noriz_decision:0 "军督的回归"
 noriz_decision_tooltip:1 "罗斯托维奇的时代已经结束"
 noriz_decision_desc:0 "许多人认为你很怠惰，迷失在颓废中。夺回你的头衔，证明他们错了。"
 noriz_decision_confirm:0 "他们将再次下跪"
 noriz_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死。"
 podintroductions.153.t:0 "你的故事就此展开"
 podintroductions.153.desc:0 "拉兹科利纳女士，你最近陷入了[torpor|E]，对波兰的控制被削弱了。不过，克拉科夫还没有沦陷，所以你有一个强大的基地来发动你的重新征服。\n这对你特别重要，因为你是少数真正关心城市安危的吸血鬼之一。这显然不是出于任何不当的善意，而是从务实的角度来看，一个强大的城市意味着一个强大的亲王。你必须迅速重建你在克拉科夫的影响网，并帮助它再次繁荣。这座城市必须变得强大起来，成为你的新棘秘魑帝国的首都。"
 podintroductions.153.a:0 "特兰西瓦尼亚已是过去，此处可是未来。"
 raz_intro_tooltip:0 "作为拉兹科利纳，你在“巡视首都​”活动中就有着专属事件。"
 POD_survey_events.160.t:0 "巡视：拉兹科利纳的首都"
 POD_survey_events.160.desc:0 "你比任何棘秘魑都更了解一个发达的凡人社区的重要性。因此，你在克拉科夫长期以来一直在实践引导一座城市走向繁荣的艺术。你学到的宝贵经验使你更容易巧妙地将你的首都向你的目标发展。不过，这仍然是一个令人疲惫的过程，你可能更想控制自己的劳逸。"
 POD_survey_events.160.option.a:0 "没有时间可以浪费了"
 POD_survey_events.160.option.b:0 "永恒在我身旁"
 raz_survey_tooltip:0 "只要你扮演拉兹科利纳，就可以得到该专属巡视结果。"
 podintroductions.154.t:0 "你的故事就此展开"
 podintroductions.154.desc:0 "海德翁大人，由于拉兹科利纳亲王在[torpor|E]浪费的时间，你最近在波兰的影响力越来越大。随着你的影响力的增长，你所“照顾”的凡人的尖叫也在增加，这显然是最令人愉快的声音。你的堡垒总是需要更多的修缮，因此你显然需要更多的牲畜来剥皮和肢解以达到艺术目的。\n有什么办法能比粉碎拉兹科利纳和其他波兰篡位者，然后把他们可怜的城市纳入你的版图更有说服力呢？你毕竟是一个富有想象力的人，想想看，有这么多无助的凡人加入你的国度，你会做什么呢……"
 podintroductions.154.a:0 "艺术家的负担很重。"
 hedeon_intro_tooltip:0 "作为海德翁，当你折磨一个人的时候，你会得到巨量的压力缓解和一些密谋生活方式的经验。"
 podintroductions.155.t:0 "你的故事就此展开"
 podintroductions.155.desc:0 "沃拉克大人，作为活跃在特兰西瓦尼亚的棘秘魑最长子嗣，你承担了你[Clan|E]的精神领袖的角色。你建造的“血肉大教堂”加强了这一作用，这是血肉塑造艺术的一项杰出成就。\n不过，你曾经也是一股政治势力，而且你可能需要再次成为政治势力，因为你的同胞们受到了德意志梵卓及其睿魔尔盟友的攻击。很明显，你是唯一一个有足够影响力，来真正统一[Clan|E]的人。至于那些不同意的人呢？嘛，大教堂总是很饿……"
 podintroductions.155.a:0 "开门……"
 yorak_intro_tooltip:0 "作为沃拉克，只要你还掌控着大教堂，你就拥有着一项专属处决方式。"
 EXECUTION_YORAK:0 "喂给大教堂"
 cathedral_famished_modifier:0 "极饥的大教堂"
 cathedral_famished_modifier_desc:1 "在最近的开胃菜之后，大教堂想要更多。许多许多。"
 cathedral_hungry_modifier:0 "饥饿的大教堂"
 cathedral_hungry_modifier_desc:1 "随着可怜的灵魂被喂养到它永无止境的饥饿中，这个令人发疯的结构越发扩大了。"
 cathedral_satiated_modifier:0 "饱食的大教堂"
 cathedral_satiated_modifier_desc:1 "大教堂看上去保持着平静，若非那无数受害者的惨叫声。"
 podintroductions.156.t:0 "你的故事就此展开"
 podintroductions.156.desc:0 "令人畏惧的达瓦，基辅任由你摆布，你将在某天晚上向背叛你古老宗教的善变民众复仇。但更紧迫的事情还在眼前。\n你西边的棘秘魑军督领要求你效忠，但你拒绝了，因为你知道有比他们更强大的力量。俄罗斯著名的小祖母，芭芭雅嘎，正在接近，你可以感觉到。她是否在沉眠并不重要，你知道她是这些土地上唯一的女神，你也知道那些故事：她会保佑那些表现出适当敬意的人。好吧，你确信基辅的人们会很乐意成为祭品……"
 podintroductions.156.a:0 "听我说，祖母！"
 darvag_intro_tooltip:0 "作为达瓦，你具有一项专属处决方式。"
 EXECUTION_DARVAG:0 "献祭给芭芭雅嘎"
 baba_intrigued_modifier:0 "受鬼婆关注"
 baba_intrigued_modifier_desc:1 "芭芭雅嘎对你对她的大奉献表现出了兴趣。"
 baba_pleased_modifier:0 "芭芭雅嘎的赞许"
 baba_pleased_modifier_desc:1 "俄罗斯鬼婆对你的狂热奉献很欢喜。"
 baba_delighted_modifier:0 "最爱之孙"
 baba_delighted_modifier_desc:1 "很明显，你现在是她的最爱，能得到最棒赠礼的人。"
 podintroductions.157.t:0 "你的故事就此展开"
 podintroductions.157.desc:0 "莎格拉女士，随着你对波西米亚的控制不断加强，你了解到一个有趣的信息。布克迪拉卡，一个比你更年长的棘秘魑，最近在布拉格很活跃，直到他在与一些不知名的袭击者进行了一场激烈的战斗后陷入[torpor|E]。\n布克迪拉卡是个虐待狂和傲慢的疯子，但你不能否认他的力量和技能。如果你能救出他，至少在一段时间内，他可能会对一个盟友很友好。他的力量将是一笔巨大的财富，可以帮助你重新掌权……但这也可能在未来适得其反，布克迪拉卡自己也很有野心。"
 podintroductions.157.a:0 "怪物亦有荣誉。"
 podintroductions.157.b:0 "……这听起来像个很坏的主意。"
 podintroductions.158.t:0 "你的故事就此展开"
 podintroductions.158.desc:0 "令人畏惧的贾迈勒，只要提到你的名字，就会在试图入侵你的土地的不信教者心中产生恐惧。但这还不够。\n作为哈基姆圣裔战士种姓的领袖，你在[Clan|E]内是一个受人尊敬的强大人物，你必须利用这一事实来确保你的同胞们不会偏离真正的道路。太多相互竞争的派别和一个受惑的最长者，试图阻碍你对哈基姆圣裔的未来的独特看法。利用你的至高勇武和领导能力，他们徒劳的努力肯定会失败。"
 podintroductions.158.a:0 "通过外交或战争，我们将取得胜利。"
 jamal_intro_tooltip:0 "作为贾迈勒，你可以使用一项专属[character_interaction|E]，与任何非哈基姆圣裔的角色开始一场决斗。"
 POD_jamal_interaction:0 "不败者"
 POD_jamal_interaction_desc:0 "你将与这个角色开始决斗。有一人将归于尘土。"
 podintroductions.159.t:0 "你的故事就此展开"
 podintroductions.159.desc:0 "达斯图尔大人，目前哈基姆圣裔[Clan|E]的混乱局面给您的失落部族带来了一些美好明天的希望。不过，你还是很担心。\n你发现一个名为“黑手”的末日密教组织的手下已经渗透到你的国度，目的不明，但可能是邪恶的。你可以对这个密教的所谓手下进行广泛的清洗，但这可能会被视为一种偏执和鲁莽的行为。另一个选择是对他们保持更宽松的监视，但这也可能让他们获得越来越大的影响力。"
 podintroductions.159.a:0 "让我们砍下这“黑手”"
 podintroductions.159.b:0 "他们还不是威胁……目前而言。"
 podintroductions.160.t:0 "你的故事就此展开"
 podintroductions.160.desc:0 "无畏的法蒂玛，到目前为止，你阻碍第四次十字军东征的任务取得了巨大的成功。但仍有工作要做。\n鹰巢已经发出了新的命令，你要确保滞留在安纳托利亚的十字军残部得到处理。然后，长者们希望你利用拜占庭帝国灭亡的混乱局面作为掩护，在该地区开辟一个新的封邑领地。这将成为一个伟大的缓冲国，防止法兰克进一步入侵你们的家园。\n可以肯定的是，这期望很大，但你不是以失败而闻名的。这一次你也不会让他们失望。"
 podintroductions.160.a:0 "我的使命很明确。"
 fatima_intro_tooltip:0 "作为法蒂玛，你就有一项要求你掌控安纳托利亚到1300的专属决议。"
 fatima_decision:0 "终结十字军"
 fatima_decision_tooltip:1 "法兰克人不属于此！"
 fatima_decision_desc:0 "第四次十字军东征的最后残余势力必须得到解决，来为哈基姆圣裔确保安纳托利亚。"
 fatima_decision_confirm:0 "使命完成"
 fatima_decision_effect_tooltip:0 "鹰巢向您送来了问候……和奖励。"
 podintroductions.161.t:0 "你的故事就此展开"
 podintroductions.161.desc:0 "睿智的阿什拉夫，哈基姆圣裔正处于动荡之中。你们[Clan|E]内部的派系斗争已经达到了沸点，你知道这是一些黑暗势力伺机而动，试图夺取[Clan|E]控制权的时刻。你必须要坚强起来。\n值得庆幸的是，你已经做好了准备。你是一个无与伦比的血术士，你的神秘学知识在未来的混乱时期肯定会派上用场。培养这种力量，研究你的敌人，然后果断出击。只有你能保护哈基姆圣裔免受潜伏在内部的恐怖之害。"
 podintroductions.161.a:0 "谨慎的策划将确保胜利"
 alashrad_intro_tooltip:0 "作为阿什拉夫，你有一个特殊的决定，允许你每十年提高一次你的学识。"
 alashrad_decision:0 "学无止境"
 alashrad_decision_tooltip:1 "我必须找到答案……"
 alashrad_decision_desc:0 "阿什拉夫你知道很多东西，但总是有更多的物事需要破译和理解。你的追求将永远不会结束。"
 alashrad_decision_confirm:0 "……就差那么点了"
 broken_alamut_modifier:0 "最弱的最长者"
 broken_alamut_modifier_desc:0 "你对鹰巢的最长者的宣称是极其脆弱的。没有人尊重你，你对局势的控制也在不断恶化。"
 podintroductions.162.t:0 "你的故事就此展开"
 podintroductions.162.desc:0 "纳穆尔图姆女士，情况很糟糕。哈基姆圣裔没有接受你作为最长者的身份。[Clan|E]四分五裂。\n你控制了鹰巢本身，但并没有控制更多，其他长者对你的权威口惠而实不至。情况越来越接近于内战。也许在这时，它已经是不可避免的。\n如果你想挽回你的地位，你将不得不迅速而果断地出击，因为哈基姆的子嗣不尊重软弱。"
 podintroductions.162.a:0 "吾即哈基姆之摄政！"
 nakurtum_intro_tooltip:0 "作为纳穆尔图姆，你有两项专属决议，允许你摆脱开始的负面修正。"
 nakurtum_losing_control_modifier:0 "失控"
 nakurtum_losing_control_modifier_desc:0 "你几乎无法控制鹰巢本身。其他一切都在从你薄弱的掌握中滑落。"
 nakurtum_eldest_decision:0 "赢得尊重"
 nakurtum_eldest_decision_tooltip:1 "我将向他们证明我的价值！"
 nakurtum_eldest_decision_desc:0 "如果你想作为哈基姆圣裔的最长者长久地生存下去，你就必须证明自己。主张对哈基姆派的家园进行控制是一个好的开始。"
 nakurtum_eldest_decision_confirm:0 "我有自信"
 nakurtum_control_decision:0 "稳定你的统治"
 nakurtum_control_decision_tooltip:1 "我将向他们证明我的价值！"
 nakurtum_control_decision_desc:0 "如果你想作为哈基姆圣裔的最长者长久地生存下去，你就必须证明自己。主张对哈基姆派的家园进行控制是一个好的开始。"
 nakurtum_control_decision_confirm:0 "我有自信"
 podintroductions.163.t:0 "你的故事就此展开"
 podintroductions.163.desc:0 "艾哈迈德大人，你参与了橄榄会议的创建，希望在该地区实现持久和平，但你仍有一些保留。也许你必须找到另一种方式，一种可能迫使你更多地采取行动的方式。\n可悲的是，你的信仰将你与其他[Clan|E]族人隔离开来。因此，你可能不得不依靠寻找有前途的学徒，向他们介绍你独特的哲学。这将是一项漫长的任务，但为了圣地的和平？这是很值得的。"
 podintroductions.163.a:0 "世上最重要的任务"
 ahmed_intro_tooltip:0 "作为艾哈迈德，只要你还具有基督之道信仰，你总是会在教育子嗣的信仰教学部分取得成功。"
 POD_education_events.100.option.d:0 "聆听主的话语"
 POD_education_events.100.ahmed:0 "作为艾哈迈德，你可以使用这个选项，确保你的子嗣遵循你的宗教。只有当你留在基督之道上时，才可以使用这个选项。"
 podintroductions.164.t:0 "你的故事就此展开"
 podintroductions.164.desc:0 "忒弥斯大人，您最近取得了相当大的进展。哈基姆圣裔比以前更加分裂，这意味着你的“刀锋之网”可以比以前发挥更大的影响力。不过，在[Clan|E]准备好迎接你的主人归来之前，仍有许多工作要做。\n注意你周围的其他派别，迅速粉碎它们。你不能让另一个长者接管哈基姆圣裔。一旦鹰巢被你的同胞们完全掌控，你可以确信，黑牧人会给予你丰厚的回报，难道你不是他最信任的仆人吗？"
 podintroductions.164.a:0 "应许的时代将会来临。"
 thetmes_intro_tooltip:0 "作为忒弥斯，如果你完成了“神之梦”目标，你将获得额外的奖励。"
 pod1230objectives.24.customthetmes:0 "作为忒弥斯，你获得了额外的奖励。乌尔·舒尔吉为你的持续服务而祝福你。"
 podintroductions.165.t:0 "你的故事就此展开"
 podintroductions.165.desc:0 "令人畏惧的莫罗，你在冈格罗[Clan|E]中的名声与日俱增，这要归功于你最近对黑十字的梵卓和军督领的棘秘魑的胜利。但这仅仅是一个开始。\n如果你想真正统一[Clan|E]，你就必须继续朝这个方向前进，证明你确实是最强大的战争领袖。你已经很出名的一个手段是，你习惯于不请自来地潜行到敌人的宫廷上，在离开之前展示一下武力。这种策略在过去对你很有帮助，而且可以继续这样做。"
 podintroductions.165.a:0 "兽之纪元即将到来。"
 morrow_intro_tooltip:0 "作为莫罗，你有一项针对有地统治者的专属[character_interaction|E]，让你可以通过实力彰显吓唬他们。"
 show_of_force_morrow_modifier:0 "实力彰显"
 show_of_force_morrow_modifier_desc:0 "该角色已经被莫罗的突然出现和在宫廷上的悄悄威胁吓坏了。"
 POD_morrow_interaction:0 "彰显实力"
 POD_morrow_interaction_desc:0 "通过突然出现在其的宫廷来吓唬这个统治者。"
 podintroductions.166.t:0 "你的故事就此展开"
 podintroductions.166.desc:0 "维克多大人，你的女主人芭芭雅嘎将她的国度托付给你，因为她正在从对她[Sire|E]的可怕战斗中恢复过来。你不会让人失望的。\n事实证明，基督教和东方部族的兴起是一个很大的问题，你必须迅速稳固你周围的环境，让祖母能够安然入睡。还要注意你西边的突伽·辛，他是芭芭雅嘎的长期对手。\n如果你设法处理所有这些威胁，毫无疑问，祖母会很高兴并给予你相应的奖励……"
 podintroductions.166.a:0 "好好睡吧，祖母，我在看着。"
 viktor_intro_tooltip:0 "作为忒弥斯，如果你完成了“体贴的祖母”目标，你将获得额外的奖励。"
 pod1230objectives.20.custom.viktor:0 "作为维克多，你获得了额外的奖励。芭芭雅嘎对她的最宠侍从非常满意。"
 podintroductions.167.t:0 "你的故事就此展开"
 podintroductions.167.desc:0 "布伦希尔德女士，[einherjar|E]正在消亡。你们的信仰正在被白神和他的追随者所取代，你们的同胞们已经放弃了希望。维特本人，这个被奥丁选中在这个混乱的时代领导你们的人，似乎已经接近崩溃的边缘。你必须采取行动。\n你们非常尊重维特，几个世纪以来他都是一个值得信赖的朋友，但你们现在必须迫使他放弃他作为米德加尔德崇高之主的地位，以免他把你们都带向毁灭。现在是女武神在你的带领下拯救斯堪的纳维亚的时候了！"
 podintroductions.167.a:0 "英灵殿还能再等一会儿。"
 brunhilde_intro_tooltip:0 "作为布伦希尔德，在未来几个月里，你将有几个事件让你能篡夺米德加尔德头衔。"
 PODcanon_chars.34.t:0 "信仰与力量"
 PODcanon_chars.34.desc:0 "你现在已经向米德加尔德的其他居民表明了你的野心：你必须尽快取代维特成为领袖。这在你的同胞中引发了一些争论，但最初的支持率很高，尤其是在那些仍想反对基督教的人中。\n维特本人对你的举动其实并不感到惊讶，但他敦促你重新考虑你的立场。他毕竟是被奥丁本人选中的人，违背全父的意志可能比倒向白神更糟糕。"
 PODcanon_chars.34.a:0 "奥丁会理解的。"
 brunhilde_exit_tooltip:0 "你放弃了控制米德加尔德的计划。"
 PODcanon_chars.34.b:0 "……他言之在理。"
 PODcanon_chars.35.t:0 "传统与力量"
 PODcanon_chars.35.desc:0 "出现了一个反对你夺权的强大对手：芬兰自由邦的青之卡尔。这位英勇的[einherjar|E]是一位坚定的传统主义者，他不赞成你的行动，理由和维特一样：奥丁没有选择你，甚至可能北欧信仰的终结就是你的宿命。\n在这个阶段没什么能改变他的想法，你要么接受他的敌意，要么完全放弃你的计划。"
 PODcanon_chars.35.a:0 "我铸就我自己的命运。"
 PODcanon_chars.35.b:0 "……他言之在理。"
 PODcanon_chars.36.t:0 "新的萨迦传奇"
 PODcanon_chars.36.desc:0 "你现在已经强大到足以称霸米德加尔德，而且值得庆幸的是，维特并不想和你比拼，也不想发起一场血腥的内战。现在你要考虑的最后一件事是如何处理你的胜利。\n按照惯例，你应该羞辱维特和他的软弱政策，这样你就可以从头开始。但把这位强大的奥丁子嗣留在你身边也会有好处。"
 PODcanon_chars.36.a:0 "败者为耻！"
 PODcanon_chars.36.b:0 "让我们合作吧。"
 podintroductions.168.t:0 "你的故事就此展开"
 podintroductions.168.desc:0 "邓洛普大人，你等待复仇的机会已经很久了。密特拉杀死了你心爱的女儿，他将为这次谋杀付出沉重的代价。你毕竟不是以宽恕或仁慈著称的。\n这将是一个艰难的过程，因为密特拉在不列颠群岛根深蒂固，他的后裔保护着他。这个想法实际上让你暂停了……也许你可以针对他的子嗣，让他忍受你在那个决定性夜晚所感受到的痛苦的一小部分？"
 podintroductions.168.a:0 "你不会被忘记的，玛丽。"
 dunlop_intro_tooltip:0 "作为邓洛普，你有一项杀死密特拉和他的孩子们的专属决议。"
 mary_dunlop_avenged_modifier:0 "玛丽之仇已报"
 mary_dunlop_avenged_modifier_desc:0 "复仇的感觉真爽。每个人都可以看到，曾经的那位可怕的邓洛普伯爵又回来了。"
 dunlop_decision:0 "复仇与清算"
 dunlop_decision_tooltip:1 "亲爱的，宝贝的玛丽·伊丽莎白……"
 dunlop_decision_desc:0 "密特拉和他的子嗣将为杀害你心爱的女儿付出沉重的代价。清算正在向他们降临。"
 dunlop_decision_confirm:0 "为纪念你……"
 dunlop_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死"
 dunlop_custom_decision2:0 "[TARGET_CHARACTER.GetFirstName]，密特拉最宠的最幼子嗣，必须死。"
 dunlop_custom_decision3:0 "[TARGET_CHARACTER.GetFirstName]，密特拉最忠诚且付出最多的子嗣，必须死。"
 dunlop_custom_decision4:0 "[TARGET_CHARACTER.GetFirstName]，密特拉的最长子嗣，必须死。"
 podintroductions.169.t:0 "你的故事就此展开"
 podintroductions.169.desc:0 "喀喇大人，您正带领利沃尼亚野者对抗西方的持续攻击。到目前为止，局势得到了控制，但你的国度再次受到攻击只是时间问题。你心爱的德维拉提出了一个解决方案。\n利用她与这片土地上的神——特亚维的神秘联系，她可以制定一个仪式，给你巨大的力量，也许足以拯救你的人民。但代价是……代价是德维拉的生命。仅仅是想到这一点，你就会心碎。\n你会允许吗？"
 podintroductions.169.a:0 "不！我需要你！"
 podintroductions.169.b:0 "你不会被忘记的，亲爱的。"
 podintroductions.170.t:0 "你的故事就此展开"
 podintroductions.170.desc:0 "无畏的巴尔伯格，诸神黄昏即将到来，但你已经准备好利用它了。对于像你这样的熟练战士来说，将有很多机遇。有人会说这是对“真正的北欧信仰”的叛逆，但你更愿意说这只是对这个变化的时代的一种适应。\n在你心爱的船“红托尔号”上，你已经准备好为财富和荣耀而进行掠夺和抢劫。如果旧神不同意，他们可以随时来这里，当着你可靠的锤子的面说！"
 podintroductions.170.a:0 "起航！"
 valborg_intro_tooltip:0 "作为巴尔伯格，你有一项赚取一些“小钱”的专属小决议。"
 valborg_decision:0 "佣兵合约"
 valborg_decision_tooltip:1 "维京待雇！"
 valborg_decision_desc:0 "对于经验丰富的北欧战士组成的艰苦团队来说，机运无处不在。"
 valborg_decision_confirm:0 "指明我们的目标！"
 valborg_decision_effect_tooltip:0 "你将得在合约间选择。"
 red_thor_weakened_modifier:0 "红托尔的虚弱"
 red_thor_weakened_modifier_desc:0 "你的一些战士正在执行雇佣兵任务，这小小削弱了你对你的国家的控制。"
 red_thor_depleted_modifier:0 "红托尔的空虚"
 red_thor_depleted_modifier_desc:0 "你的许多战士都在执行雇佣兵任务，削弱了你对你的国家的控制。"
 red_thor_empty_modifier:0 "红托尔的空无"
 red_thor_empty_modifier_desc:0 "你的战士们都在执行雇佣兵任务，严重削弱了你对你的国家的控制。"
 PODcanon_chars.37.t:0 "红托尔起航"
 PODcanon_chars.37.desc:0 "你的船员准备出发了，许多外国[cainites|E]急于征召他们参加自己的小规模战争。你必须做出的选择是关于合同的难度。难度越大，奖励就越多，但你必须投入更多的战士来完成任务。如果他们在海外，他们显然不能再在国内帮助你。"
 PODcanon_chars.37.a:0 "简易就行了。"
 PODcanon_chars.37.b:0 "这个似乎很适度。"
 PODcanon_chars.37.c:0 "最难的！"
 PODcanon_chars.37.d:0 "我们现在不出航。"
 podintroductions.171.t:0 "你的故事就此展开"
 podintroductions.171.desc:0 "托马斯大人，尽管你尽了最大努力，君士坦丁堡还是落入了拉丁人之手。但事情还没有结束。\n你不是那种会放弃的人，即使大多数希腊[cainites|E]都流亡了，你仍然会战斗。这肯定是一场艰苦的战斗，但你有几十年的经验作为这个城市的主要执法者。你将使拉丁[cainites|E]的亡生陷入地狱，然后出击，一劳永逸地解决他们！"
 podintroductions.171.a:0 "清算将来。"
 thomas_intro_tooltip:0 "作为托马斯，你有一项针对有地统治者的专属[character_interaction|E]，让你可以在战争前削弱他们。"
 guerilla_thomas_modifier:0 "希腊冈格罗游击战"
 guerilla_thomas_modifier_desc:0 "被组织良好的希腊冈格罗盯上，该角色很难保持对其国度的控制。"
 POD_thomas_interaction:0 "游击战"
 POD_thomas_interaction_desc:0 "通过发动一些游击行动来扰乱这个统治者的国度。"
 podintroductions.172.t:0 "你的故事就此展开"
 podintroductions.172.desc:0 "特黎佛撒女士，卡米拉已经苏醒，并再次控制了罗马，正如你所预料的那样。你曾经是他的密友，也是他信任的顾问，凭借这个角色，你发挥了巨大的影响力。也许你可以再次这样做？\n你可以让强大的梵卓知道你的存在，再次为他服务。这将提供一些有用的保护，以抵御南方狡诈的勒森魃。或者你可以继续自己的事业，也许这次卡米拉并不是你未来的一部分。"
 podintroductions.172.a:0 "欢迎回来，执政官。"
 podintroductions.172.b:0 "他的时代过去了。"
 podintroductions.173.t:0 "你的故事就此展开"
 podintroductions.173.desc:0 "春军女士，你很愤怒。在你多年的流浪和宣扬自由的过程中，你从未见过像这个“睿魔尔家族”这样可憎的东西。这些法师都被压迫在一个暴虐的议会之下，更糟糕的是，他们被迫忍受血缚，直到最后一人！这不能再继续下去了。\n幸运的是，睿魔尔显然低估了你，还没有真正注意到你的存在和影响。这是一个从内部打破这个“金字塔”的好机会。这将是你的杰作，一旦你完成了，整个[cainite|E]世界将涌现出希望！"
 podintroductions.173.a:0 "让我们打破他们的枷锁。"
 vasantasena_intro_tooltip:0 "作为春军，你有一项专属决议，如果成功的话，将允许你创造你自己的信仰。"
 vasantasena_decision:0 "打破金字塔"
 vasantasena_decision_tooltip:1 "这个可憎的东西必须被打倒！"
 vasantasena_decision_desc:0 "睿魔尔家族反对你所珍视的一切。你必须采取行动。"
 vasantasena_decision_effect_tooltip:1 "你编译了你自己的心路，为将来的进一步解放铺平道路。"
 vasantasena_decision_confirm:0 "金字塔已被推倒！"
 podintroductions.174.t:0 "你的故事就此展开"
 podintroductions.174.desc:0 "娄希，你与深渊主人的契约进展很顺利。你已经向他宣誓效忠，他对你迄今为止的工作感到满意，但还有更多的工作要做。\n你所居住的遥远的北方是与世隔绝的，这对孤立很有帮助，但限制了你的实验规模，特别是关于你精心制作的[revenant|E]——凯斯基宁。也许你可以扩大你的国度？你知道你主人的仆人们会很乐意为这样的努力提供帮助……"
 podintroductions.174.a:0 "机遇，机遇！"
 louhi_intro_tooltip:0 "作为娄希，只要你还留在深渊之路上，你就能通过决议生成渊影，一种本来是勒森魃独有的兵士。"
 louhi_decision:0 "阴暗业务"
 louhi_decision_tooltip:1 "你在暗处有些朋友。"
 louhi_decision_desc:0 "深渊主人是慷慨的。请求他的支持。"
 louhi_decision_effect_tooltip:1 "你将选择召唤多少只渊影。"
 louhi_decision_confirm:0 "听我说！"
 PODcanon_chars.38.t:0 "阴暗业务"
 PODcanon_chars.38.desc:0 "你已经准备好向深渊主人献上你的祭品了。你想尝试召唤他的多少个仆人？"
 PODcanon_chars.38.a:0 "只是其中的一些。"
 PODcanon_chars.38.b:0 "更多！"
 PODcanon_chars.38.c:0 "所有！"
 PODcanon_chars.38.d:0 "转念一想……"
 louhi_small_shades_tt:0 "一组渊影会被加入到你的可用兵士中。"
 louhi_medium_shades_tt:0 "两组渊影会被加入到你的可用兵士中。"
 louhi_high_shades_tt:0 "三组渊影会被加入到你的可用兵士中。"
 podintroductions.175.t:0 "你的故事就此展开"
 podintroductions.175.desc:0 "阿纳托尔大人，你一直在做天主之事，即羞辱了巴黎的该隐异端，但你的任务还没有完成。这些南方的土地上充满了隐藏在清洁派背后或中间的异端。\n你已经获得了在该地区活动的权利，你相信你会及时成功。然而，腐化的根源可能比你最初想象的更深，你可能需要把一些亲王从他们的办公室里赶走，以揭开他们。在那之后……天主会选择你的下一步道路，就像祂总是这样。"
 podintroductions.175.a:0 "让我们开始吧。"
 anatole_intro_tooltip:0 "作为阿纳托尔，你有一项专属小决议来理解天主对你的意愿。"
 anatole_decision:0 "天主的意愿"
 anatole_decision_tooltip:1 "祂对我有什么计划？"
 anatole_decision_desc:0 "你的信念很强，但祂的做事方法很神秘。你必须抽出时间来理解它们。"
 anatole_decision_effect_tooltip:1 "你会获得一个愿景，可能是好的，也可能是坏的。"
 anatole_decision_confirm:0 "前进的道路……"
 PODcanon_chars.39.t:0 "天主之怒"
 PODcanon_chars.39.desc:0 "你做错了什么吗？还是只是祂对你不满意？你可能永远不知道，但你知道的是，天主对你不满意。你刚刚收到的恐惧和愤怒的幻象很清楚：你必须改变你的做事方式。"
 PODcanon_chars.39.a:0 "我必须得做的更好！"
 PODcanon_chars.39.b:0 "在我得到救赎之前，我不会休息。"
 PODcanon_chars.39.c:0 "我尽力了！"
 PODcanon_chars.40.t:0 "天主之狂热"
 PODcanon_chars.40.desc:0 "你总是可以改进和做得更多。这就是你收到的最新异象所提醒你的。你的狂热被重新激发，你的目标感从未如此强烈。\n你将把这个巨大的恩惠引向何处？"
 PODcanon_chars.40.a:0 "了解圣经"
 PODcanon_chars.40.b:0 "当众传教。"
 PODcanon_chars.40.c:0 "理解我的定位。"
 PODcanon_chars.41.t:0 "天主的意愿"
 PODcanon_chars.41.desc:0 "由于最近的一个异象，你在附近发现了一处吸血鬼异端的巢穴。可悲的是，这个人隐藏在众目睽睽之下，与这片土地上的凡人统治者有着强大的联系。对他采取行动肯定会引起一些不必要的注意。\n但你真的能拒绝对这样一位受诅的灵魂施用天主的正义吗？"
 PODcanon_chars.41.a:0 "他的灵魂将得到净化。"
 PODcanon_chars.41.b:0 "救赎仍然是一个可选项。"
 PODcanon_chars.41.c:0 "这次我不能采取行动。"
 broken_talmahera_modifier:0 "难当的德尔罗"
 broken_talmahera_modifier_desc:0 "你对塔尔玛埃拉的德尔罗（被服侍者）的宣称是非常弱的。没有人尊重你，你对局势的控制也在不断恶化。"
 podintroductions.176.t:0 "你的故事就此展开"
 podintroductions.176.desc:0 "以利米勒大人，在你相当多的迷茫徘徊之后，你最终来到了这个名为塔尔玛埃拉的奇怪死亡密教。从你目前看到的情况来看，他们有自己的怪异想法，比如崇拜[antediluvians|E]。\n你的圣经级年龄和相当大的个人力量使你被这个密教组织所恐惧和害怕，他们已经在你周边听从你和你的命令。也许这就是你至今为止错过的你的亡生的目的？如果你决定留在这里，你将不得不迅速巩固你对他们的薄弱控制。"
 podintroductions.176.a:0 "奇怪的发展。"
 elimelech_intro_tooltip:0 "作为以利米勒，你有两个专属决议，可以让你摆脱开始时的负面修正。"
 elimelech_losing_control_modifier:0 "失控"
 elimelech_losing_control_modifier_desc:0 "你几乎无法控制你的王座室本身。其他一切都在从你薄弱的掌握中滑落。"
 elimelech_delroh_decision:0 "赢得你的权力"
 elimelech_delroh_decision_tooltip:1 "我将向他们证明我的领导能力！"
 elimelech_delroh_decision_desc:0 "如果你想长期作为塔尔玛埃拉的德尔罗（被服侍者）活下去，你就得证明自己。主张对周围土地的控制是一个好的开始。"
 elimelech_delroh_decision_confirm:0 "尊重我的权威！"
 elimelech_control_decision:0 "稳定你的统治"
 elimelech_control_decision_tooltip:1 "我将向他们证明我的领导能力！"
 elimelech_control_decision_desc:0 "你对神秘的塔尔玛埃拉的统治是一个奇怪的现象，没有人期望它能持续很长时间。证明他们错了。"
 elimelech_control_decision_confirm:0 "我还在这！"
 elimelech_custom_decision:0 "该决议只有在1300后开始才能达成。"
 podintroductions.177.t:0 "你的故事就此展开"
 podintroductions.177.desc:0 "泽特勒大人，你现在明白了很多。三头巨龙已经向你展示了真相。\n你试图在睿魔尔前防护萨洛比的举动是天真的，因为到头来，你不就是灰烬吗？在这可恶的存续中只有一个不变的东西，那就是痛苦。感谢你的新后援的许多祝福，你将学会所有的秘密，并成为施展它的终极艺术家。\n尖叫将永远不会停止，但你现在将理解它们。"
 podintroductions.177.a:0 "终于有了明确的答案。"
 zettler_intro_tooltip:0 "作为泽特勒，你有一项能调用三头巨龙的示相之一来帮助你的决议。"
 zettler_beast_of_war_modifier:0 "战争之兽"
 zettler_beast_of_war_modifier_desc:0 "最年轻的幼弟，一个由不受约束的暴怒和愤怒组成的生物。"
 zettler_eater_of_souls_modifier:0 "噬魂者"
 zettler_eater_of_souls_modifier_desc:0 "中间的兄弟，也就是最终会吞噬一切者。"
 zettler_defiler_modifier:0 "亵渎者"
 zettler_defiler_modifier_desc:0 "最年长的兄长，能败坏它所接触的一切。"
 zettler_decision:0 "三兄弟"
 zettler_decision_tooltip:1 "巨龙对你言语，对你的奉献感到高兴。"
 zettler_decision_desc:0 "巨龙的三个头分别代表不同的示相和不同的好处，可以用于你的目标。"
 zettler_decision_effect_tooltip:1 "在未来五年内，你将在这三大示相中选择其一。"
 zettler_decision_confirm:0 "神圣之助……"
 PODcanon_chars.42.t:0 "三头巨龙"
 PODcanon_chars.42.desc:0 "你的后援是一位强大的实体，但即使对你来说也是很神秘。到目前为止，你所了解的是它分为三个“头”，它们几乎是不同的生物，但在某种程度上仍然是整体的一部分。\n每一个都渴望你的奉献，并承诺如果你遵从的话会有回报。"
 PODcanon_chars.42.a:0 "战争之兽"
 PODcanon_chars.42.b:0 "噬魂者"
 PODcanon_chars.42.c:0 "亵渎者"
 PODcanon_chars.42.d:0 "我现在不做选择。"
 podintroductions.178.t:0 "你的故事就此展开"
 podintroductions.178.desc:0 "阿道拉那女士，当该隐异端在你周围崩溃时，尽管你年纪轻轻，却利用这场混乱在挪得教区中获得了一个席位。你毕竟知道如何在糟糕的情况下做到最好。\n自从你来到这里，你就对目前的挪得大主教非常怀疑，他似乎对你们教会的危急状况不以为然，很奇怪。也许现在是更换领导层的时候了？你可以在教廷的下一届会议上提出这个问题，确保每个人都知道你的野心……显然，这可能是一把双刃剑。"
 podintroductions.178.a:0 "我们需要变革！"
 podintroductions.178.b:0 "大主教有我的全力支持。"
 lucita_decision_effect_tooltip:1 "这终于发生了！"
 josef_terrified_modifier:0 "压力之下"
 josef_terrified_modifier_desc:0 "你冥冥感觉到，莎格拉要抓到你了。你得立刻往后看！"
 podintroductions.179.t:0 "你的故事就此展开"
 podintroductions.179.desc:0 "约瑟夫大人，在你反抗上一任亲王的暴政后，你一直在努力确保布拉格的安全，但一个新问题已经出现了。\n在古代统治波希米亚的莎格拉已经苏醒，并轻易地夺取了该地东部地区的控制权。她肯定会想要更多，而你理所当然地害怕这样一个古老的存在能对你做什么。你必须找到一种方法来除掉她！"
 podintroductions.179.a:0 "还有希望！"
 josef_intro_tooltip:0 "作为约瑟夫，你可以通过达成你的专属决议，来提高你的起始修正。"
 josef_breathing_modifier:0 "喘息空间"
 josef_breathing_modifier_desc:0 "莎格拉不在了，你可以重新呼吸了……非字面意思。"
 josef_decision:0 "波希米亚的命运"
 josef_decision_tooltip:1 "她要来了！"
 josef_decision_desc:0 "莎格拉，这个曾经以铁腕统治波西米亚的远古恐怖，又回来了。她肯定不会欣赏你占有她这么多的“正当”土地。"
 josef_decision_confirm:0 "……好险"
 josef_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死"
 podintroductions.180.t:0 "你的故事就此展开"
 podintroductions.180.desc:0 "塔利克大人，麦加和麦地那安全地掌握在虔诚的[ashirra|E]手中，这在很大程度上要感谢你。但你的工作还没有结束。\n其他重要城市，如开罗、大马士革和科尔多瓦，仍然处于冲突之中，或被宗教的敌人彻底控制。不能让这种情况继续下去！你们知道自己的职责，不会让你们的工作继续下去。你们知道自己的职责，在[ashirra|E]能保护从阿拉伯到伊比利亚的信徒之前，你们不会停止。"
 podintroductions.180.a:0 "朝觐必胜。"
 tarique_intro_tooltip:0 "作为塔利克，你有一项专属决议，即确保伊斯兰教最重要的城市。"
 tarique_guardian_modifier:0 "圣城守护者"
 tarique_guardian_modifier_desc:0 "守护者的威望和虔诚远近闻名。是少有的真正献身于某项功业的[cainites|E]之一。"
 tarique_decision:0 "圣城守护者"
 tarique_decision_tooltip:1 "你的使命很明确。"
 tarique_decision_desc:0 "你已经在麦加的恩典下重生了，你想让别人也有这种受祝福的经历。因此，必须保护信仰中最重要的城市。"
 tarique_decision_confirm:0 "我的使命已完成。"
 podintroductions.181.t:0 "你的故事就此展开"
 podintroductions.181.desc:0 "马拉希底斯大人，徘徊和绝望的时候已经过去。你必须采取行动。\n拉丁人在君士坦丁堡站稳了脚跟，这种对米迦勒回忆的侮辱决不能容忍。你是他的岩石，他的门徒，现在你必须通过拯救他的遗产来报答他的恩情。\n君士坦丁堡是永恒的。幻梦是永恒的。要确保那些该死的拉丁人很快就能明白这一点。"
 podintroductions.181.a:0 "我们不值得，牧首。"
 malachite_intro_tooltip:0 "作为马拉希底斯，如果你完成“幻梦再临”目标，你会得到额外的奖励。"
 pod1230objectives.6.c:0 "他们知道我是谁。"
 pod1230objectives.6.custom.malachite:0 "这个选项可用是因为你扮演着马拉希底斯。"
 podintroductions.182.t:0 "你的故事就此展开"
 podintroductions.182.desc:0 "内马赫女士，你有多处得注意。\n一方面，萨利安娜政变的后果使法兰西处于弱势地位。你有很多人脉和足够的影响力，你可以利用这一点，最终让这片土地回归到它的古老根基。\n另一方面，你终于找回了你的姐妹。虽然苏勒维亚被数个世纪的梵卓调教得彻底崩溃了，而且几乎不认识你。你曾经深爱着她，帮助她也许可以恢复她的记忆。但你不能在做这一艰巨任务的同时还进入法兰西的政治舞台。"
 podintroductions.182.a:0 "家人就是家人。"
 podintroductions.182.b:0 "那些时刻已经一去不返了。"
 podintroductions.183.t:0 "你的故事就此展开"
 podintroductions.183.desc:0 "卢卡斯大人，尽管被一位诺斯费拉图[Embrace|E]，你还是设法保存了你完美的美貌……但有代价。你的魔邪赞助要求在你存续的第一个百年里给出百条灵魂，你已经完成了，但是……他现在想要更多，而且速度要更快。\n但你没有选择，因为若你能保持你的年轻外表，任何牺牲都是值得的。现在是时候开启你的溺亡修道院并扩张了。只要你的恩人渴望得到更多，你就会需要更多的人被诱骗和腐蚀。他很快就会满足的……\n对吧？"
 podintroductions.183.a:0 "完美之化身。"
 lukas_intro_tooltip:0 "作为卢卡斯，你的魔邪赞助会定期要求你献祭你的首都发展度（如果足够）或随机数位宫廷成员。你可以拒绝，但卢卡斯的理智可能无法承受再一次失去美貌。"
 PODcanon_chars.43.t:0 "完美的代价"
 PODcanon_chars.43.desc:0 "你的后援回来了，提醒你必须偿还的债务。必须做出献祭，莫有妥协，以挽救你的无瑕的皮肤。\n如果你的首都人口足够多，你可以献祭其中一些。否则，你将不得不让恶魔从你的宫廷中挑选。或者……你可以完全拒绝玩这个可怕的游戏，但你知道其代价……"
 PODcanon_chars.43.a:0 "谁会怀念一些愚蠢的凡人呢？"
 PODcanon_chars.43.b:0 "廷臣，他们有什么用？"
 PODcanon_chars.43.c:0 "……我不能这样继续下去了。"
 lukas_sacrifice_dev_tt:0 "你必须有一个发展度超过5的首都，才能在未来的要求中保有这个选项。"
 gregor_knight_modifier:0 "女士的骑士"
 gregor_knight_modifier_desc:0 "格雷戈尔生活在自己的幻想世界里，他必须永远不离开他心爱的女士。"
 podintroductions.184.t:0 "你的故事就此展开"
 podintroductions.184.desc:0 "令人畏惧的格雷戈尔，你终于为你的生活找到了一个目标。那些可悲的条顿骑士们太害怕你的力量而不接受你，但荆棘女士却不同。\n她不在乎你那所谓的“残忍”，甚至让你觉得比以前更强大。她需要一个勤奋的勇士，而你就是那个被选中的人。但她似乎有占有欲，不喜欢你离她太远，从长远来看，这可能是一个问题。\n没关系，你还是可以以她的名义杀戮怪物！"
 podintroductions.184.a:0 "为完美女士而设的完美骑士。"
 gregor_intro_tooltip:0 "作为格雷戈尔，你有一项专属小决议，允许你向女士寻求更多的帮助，或者与她断绝关系。"
 gregor_decision:0 "与女士见面"
 gregor_decision_tooltip:1 "我是她忠实的仆人。"
 gregor_decision_desc:0 "女士赋予了你力量，但如果你要，她可以帮助你更多。如果她对你的占有欲太强，你也可以尝试与她断绝关系。"
 gregor_decision_confirm:0 "为您服务。"
 gregor_decision_effect_tooltip:0 "你将与女士见面。她可以在一段时间内赋予你力量，或者你可以与她断绝关系。"
 PODcanon_chars.44.t:0 "荆棘女士"
 PODcanon_chars.44.desc:0 "在她的森林深处，女士在等待你，就像你第一个见到她的晚上一样美丽。她微笑着，热情地感谢你的持续服务。\n作为温柔善良的后援，如果你有任何要求，她无疑会倾听你的请求。或者她可能有自己的要求。"
 PODcanon_chars.44.a:0 "我谦卑地请求您的祝福。"
 PODcanon_chars.44.b:0 "新的仆人？当然行，我的女士。"
 PODcanon_chars.44.c:0 "这种疯狂举动必须结束！"
 gregor_briey_tooltip:0 "你必须控制布里埃伯爵领，才能确保这选项可用。"
 PODcanon_chars.44.d:0 "我将在其他时候拜访她。"
 gregor_is_done_tooltip:0 "你今后将无法再与女士互动。"
 podintroductions.185.t:0 "你的故事就此展开"
 podintroductions.185.desc:0 "著名的仄利俄斯，你已经被称为黑夜世界中最灵巧的建筑师。几十年来，你为不死族领主和女士们建造城堡和庄园。然而，你真正的杰作仍未被显现。\n一种预感将你引向特兰西瓦尼亚，那里的土地本身似乎……与众不同。这些奇怪的地脉能量渴望被你的巧手所驾驭，而你已经迫不及待地想开始了。"
 podintroductions.185.a:0 "最好的材料？"
 zelios_intro_tooltip:0 "作为仄利俄斯，你具有一项专属建筑——仄利俄斯工坊。"
 building_type_architect_workshop_01:0 "仄利俄斯工坊"
 building_type_architect_workshop_01_desc:1 "#F 每一座建筑都是从一位好工匠手中的好工具开始的。#!"
 building_architect_workshop_01:0 "仄利俄斯工坊"
 building_architect_workshop_01_desc:1 "仄利俄斯在这里有自己的工场，为他的计划和学徒们准备一些即将到来的高超的建筑工程。"
 podintroductions.186.t:0 "你的故事就此展开"
 podintroductions.186.desc:0 "查古拉普夏大人，你知道你的职责。\n战争是你的血液，你的[Sire|E]把为雷伏诺绝对确有印度这一崇高而又困难的任务交给了你。受诅的阿修罗提伽耶是强大的对手，其他印度[cainites|E]不服从你的正义领导也无济于事。没关系，你迟早会取得胜利的。\n你是你的[Clan|E]坚定的摄政和战争之主。准备好你的军队，集结你的部队，向胜利迈进！"
 podintroductions.186.a:0 "我们的宿命将用血写成。"
 chandraputra_intro_tooltip:0 "作为查古拉普夏，你具有一项提高你军事相关技巧的专属小决议。"
 chandraputra_decision:0 "战争的鼓声"
 chandraputra_decision_tooltip:1 "战争是一件复杂的事情，你必须做好准备。"
 chandraputra_decision_desc:0 "从很久以前的凡人时代起，你就一直是战争之主。尽管如此，仍有改进的余地。"
 chandraputra_decision_confirm:0 "老将军配新战术。"
 chandraputra_decision_effect_tooltip:0 "在接下来的五年里，你将把精力集中在与战争有关的特定事务上，来获得一些加值。"
 chandraputra_martial_modifier:0 "战争之主"
 chandraputra_martial_modifier_desc:0 "查古拉普夏领导的军队似乎有超自然的速度，几乎不需要喘息就能压上。"
 chandraputra_knights_modifier:0 "激烈的演练"
 chandraputra_knights_modifier_desc:0 "你的勇士们永远不会变得足够好到能满足你的眼光。但他们可以通过一些老式的演练来接近它。"
 PODcanon_chars.45.t:0 "战争的鼓声"
 PODcanon_chars.45.desc:0 "即使你具有丰富的战争经验也不一定足以确保胜利。总是有新的战术需要研究，新的训练方法需要设计，或者新的战斗计划需要制定。你必须保持勤奋。"
 PODcanon_chars.45.a:0 "兵贵神速。"
 PODcanon_chars.45.b:0 "我现在就想准备一场模拟战役！"
 PODcanon_chars.45.c:0 "我想知道有关最近的凡人战役的消息。"
 PODcanon_chars.45.d:0 "你还自称是勇士？"
 podintroductions.187.t:0 "你的故事就此展开"
 podintroductions.187.desc:0 "卡门尼塔女士，你一直在努力推广你的新雷伏诺种姓，以至于你没有看到你的子嗣伊雅戈·卡斯提尔堕入罪孽，直到它太晚了。\n你曾经有前途的学生现在只是一个强盗，在科西嘉岛的藏身处中掠夺海洋。这不是你想要的世系传承。\n你可以试着给他发个信息，缓和你们的关系，希望将来能够和解。或者，最好是彻底忘记他。"
 podintroductions.187.a:0 "对我们来说还不算太晚，孩子。"
 podintroductions.187.b:0 "他已经太过分了。"
 podintroductions.188.t:0 "你的故事就此展开"
 podintroductions.188.desc:0 "无畏的雅戈，你是地中海之主……或者至少期望是这样。你在科西嘉岛的海盗乐园可以让你及时达到。\n让那些傲慢的亲王们去打他们的小算盘吧，你知道真正的权力在哪里，而且你足够精明，可以通过任何必要的手段夺取它。\n当地中海的所有水手都畏惧你的名字，你的宝箱里充满了黄金……这时你将真正取得胜利！"
 podintroductions.188.a:0 "全员出动！"
 iago_intro_tooltip:0 "作为雅戈，你有一项寻求掠夺和财富的专属决议。"
 iago_decision:0 "起航"
 iago_decision_tooltip:1 "船员们都很不安分，也许是时候出航了？"
 iago_decision_desc:0 "执政是不错，但你需要风在后方，掠夺在前方，才能真正感觉到活着。或近乎。"
 iago_decision_confirm:0 "风在后方！"
 iago_decision_effect_tooltip:0 "你将得在目标间选择。"
 iago_crew_weakened_modifier:0 "船员空虚"
 iago_crew_weakened_modifier_desc:0 "你的一些水手在上次的掠夺后再也没有回来，这在一定程度上削弱了你对你国度的控制。"
 iago_crew_depleted_modifier:0 "船员枯竭"
 iago_crew_depleted_modifier_desc:0 "你的许多水手在上次的掠夺后再也没有回来，削弱了你对你国度的控制。"
 iago_crew_empty_modifier:0 "无船员"
 iago_crew_empty_modifier_desc:0 "你的船员在上次的掠夺中几乎被杀到了只剩最后一个人，严重削弱了你对你的国度的控制。"
 PODcanon_chars.46.t:0 "海盗亲王起航"
 PODcanon_chars.46.desc:0 "你的船员已经准备好出发了，而且有许多富有的目标可选。你必须做出的选择是关于掠夺的难度。难度越大，回报越多，但在跳帮过程中你将失去更多的船员。如果他们死了，就显然不能再在家园里帮助你。"
 PODcanon_chars.46.a:0 "小猎物，小风险。"
 PODcanon_chars.46.b:0 "这个似乎很适度。"
 PODcanon_chars.46.c:0 "史上最大的劫掠！"
 PODcanon_chars.46.d:0 "我们现在不出航。"
 podintroductions.189.t:0 "你的故事就此展开"
 podintroductions.189.desc:0 "摩梨东社夜大人，经过漫长的等待和一些精心的计划，你终于为自己争取到了巴格达。是时候享受你的新权力了！\n也可能不是，因为宫廷越来越担心所谓的“蒙古汗国”，这些凡人的骑兵现在正在攻击哈里发国。你不相信，因为他们最近在埃尔比勒被打败了，但你听到了你的顾问们的谨慎的敦促。如果这些可怕的预兆成真，也许你可以保留一些战后的存续？"
 podintroductions.189.a:0 "我可以先等一等，然后再享受亡生。"
 podintroductions.189.b:0 "我的钱，我想怎么用就怎么用！"
 mritunjay_intro_tooltip:0 "你得提前计划，以防蒙古人靠近你的城市。"
 baghdad_recovering_modifier:0 "恢复中"
 baghdad_recovering_modifier_desc:0 "多亏了你的精心策划，蒙古军队造成的损失没那么严重。城市正在恢复中。"
 PODcanon_chars.47.t:0 "睿智亲王"
 PODcanon_chars.47.desc:0 "蒙古军队终于停止了对巴格达这座美丽城市的掠夺和破坏。这是个令人痛苦的经历，但由于你的精心准备，你得以保存了大部分的东西。你不寒而栗地想，如果没有像你这样的准备，会发生什么。\n好吧，时间总是在流逝，但至少由于你的努力，你心爱的巴格达将保持是个伟大的学识和文化中心。"
 PODcanon_chars.47.a:0 "我在三十年前抉择得很好。"
 podintroductions.190.t:0 "你的故事就此展开"
 podintroductions.190.desc:0 "玛西娅女士，你一直在努力做事，完成你关于雷伏诺[Clan|E]及其众多种姓的论文。不过，你可能要暂时把注意力放在其他地方。\n在你的旅行中，你注意到很大一部分[Clan|E]的堕落，与你的[Sire|E]和你自己所坚持的高尚品德相去甚远。如果你的行动足够迅速，你就可以为年轻一代提供一个集合点和学习的榜样，也许在这个过程中可以挽救你[Clan|E]的传承。如果你有时间，你甚至可以在你的《伟大之作》中写上一两章。"
 podintroductions.190.a:0 "该行动了。"
 marcia_intro_tooltip:0 "作为玛西娅，你有一项专属决议，那就是在一段时间内专注于你的写作，让你可在各种生活方式的回报中进行选择。"
 marcia_decision:0 "雷伏诺氏族之人"
 marcia_decision_tooltip:1 "没时间写稿了。"
 marcia_decision_desc:0 "你没有忘记你在引用雷伏诺[Clan|E]的每一个世系方面上的无止境的工作。你应该继续。"
 marcia_decision_confirm:0 "主题将是……"
 marcia_decision_effect_tooltip:0 "你将得在主题重点间选择。"
 PODcanon_chars.48.t:0 "雷伏诺氏族之人"
 PODcanon_chars.48.desc:0 "随着你继续对你的[Clan|E]各世系的概述，你对他们的专长了解得越来越多。就像任何一本好书一样，你非常肯定，你最终学到的东西会比你的读者读到的东西还要多。"
 PODcanon_chars.48.a:0 "帕伊杜米特，骄傲的骑士。"
 PODcanon_chars.48.b:0 "普日·达伊，狡猾的诡计者。"
 PODcanon_chars.48.c:0 "亚历山得利特，精明的商人。"
 PODcanon_chars.48.d:0 "巴希利特，聪慧的狂热者。"
 podintroductions.191.t:0 "你的故事就此展开"
 podintroductions.191.desc:0 "佐伊女士，在接连失去你的城市和你的[Sire|E]后，你几乎被绝望和愤怒所迷惑。值得庆幸的是，阿纳托尔把你带到了他的羽翼之下，你们都因此变得更加优秀。\n你显然对他心存感激，所以你接受了他在法兰西南部的最新追求。也许在这里，你将最终为你的亡生找到一个目标？许多人因为阿尔比派十字军而失去了和你一样多的东西，而你可以帮助他们重建。你确信阿纳托尔会同意这个计划，如果可以的话，他甚至可能会再次帮助你。"
 podintroductions.191.a:0 "也许是个新的家园？"
 zoe_intro_tooltip:0 "作为佐伊，你有一项针对阿纳托尔的专属[character_interaction|E]，用以寻求他的帮助。"
 POD_zoe_interaction:0 "共同成长"
 POD_zoe_interaction_desc:0 "阿纳托尔和你仍然可以从对方身上学到很多东西。"
 PODcanon_chars.49.t:0 "两个迷失的灵魂"
 PODcanon_chars.49.desc:0 "阿纳托尔是一个复杂的人，经常迷失在他的愿景中。但当他在精神正常的时候，他总是对你很好，很有耐心。他经常隐晦地告诉你，你是他在现实世界中的“锚”之一，而且他似乎真的很感谢你的友谊。\n在任何情况下，你们两个人在一起的时间总是以你们两个人对事物的新看法而告终。这是一个走向智慧的漫长旅程，但至少有一个朋友在你身边。"
 PODcanon_chars.49.a:0 "让我们今晚好好聊聊。"
 PODcanon_chars.49.b:0 "关于……我明白了。"
 PODcanon_chars.49.c:0 "你有一个愿景？我们可以一起理解它。"
 PODcanon_chars.49.d:0 "祈祷？……这可能有帮助。"
 etienne_support_modifier:0 "约根名义上的附庸"
 etienne_support_modifier_desc:0 "约根·冯·费尔登仍然认为你是他的附庸，并向你提供支持和帮助，尽管这涉及到遥远的距离。"
 podintroductions.192.t:0 "你的故事就此展开"
 podintroductions.192.desc:0 "艾蒂安大人，你被夹在两股对立的力量之间。在最近的十字军之后，由于约根·冯·费尔登的德意志骑士的帮助，你已经确保了对亚柯的控制，然后作为交换向他宣誓效忠。但最近橄榄会议的诞生给你带来了压力。\n它的领导人卡维娅·加杜巴希望你效忠，因为你显然在她的势力范围内。约根离得太远来有所轻重，但他承诺，如果你至少在名义上保持对他的附庸地位，他将给予支持。不过，这可能会激怒卡维娅。"
 podintroductions.192.a:0 "我在这必须要务实一点。"
 podintroductions.192.b:0 "我将忠实于我的承诺。"
 podintroductions.193.t:0 "你的故事就此展开"
 podintroductions.193.desc:0 "刻茉媞里女士，在与赛特的受诅眷族进行了一场可怕的战斗之后，你刚刚从漫长的[torpor|E]中醒来。你忍耐着，就像你一贯所做的那样。\n赛特夺走了你的一切，除了他真正想要的一样东西，而你将回报他。他那充满亲信和佞臣的可悲世系必须被清除掉。诚然，你是在孤军奋战，对抗整个[Clan|E]的全部力量，但……他们已经有了一个非常真实的理由来害怕你。而你在未来会给他们更多。"
 podintroductions.193.a:0 "我希望你在看着。"
 kemintiri_intro_tooltip:0 "作为刻茉媞里，你有一项专属决议，即摧毁赛特的密教。"
 kemintiri_decision:0 "伊西斯的复仇"
 kemintiri_decision_tooltip:1 "蛇必须被碾碎。"
 kemintiri_decision_desc:0 "一旦赛特之子和他们被诅咒的密教不再存在，赛特的名字被沉入泥浆……那时你才与他扯平。"
 kemintiri_decision_confirm:0 "伊西斯怜悯我。"
 kemintiri_decision_effect_tooltip:0 "赛特之子将消失，其信徒将改信人性之道。"
 podintroductions.194.t:0 "你的故事就此展开"
 podintroductions.194.desc:0 "安德烈亚斯大人，您是著名的公平和可靠的商队主人。诚然，你经常利用这些旅行来宣扬赛特的荣耀，但你总是遵守你的诺言。\n你最近在这个地区停了下来，花时间教你的新成员了解他们在赛特的计划中的作用，更重要的是，在你的商队中的作用。很快就到了再次出发的时候，但道路每年都会变得更加艰难。也许，在你的旅程之间，把这个地区作为一个大本营是明智的。"
 podintroductions.194.a:0 "尊敬赛特，尊敬圣言。"
 andreas_intro_tooltip:0 "作为安德烈亚斯，你可以通过一项小决议来踏上旅行队旅行，以获得各种回报，代价是离政一段时间。"
 andreas_decision:0 "旅行队主"
 andreas_decision_tooltip:1 "让我们回顾一下各种可能性。"
 andreas_decision_desc:0 "作为一个著名的旅行队主，你总是有机会接受流浪[cainites|E]的各种提议。"
 andreas_decision_confirm:0 "让我们来谈些生意。"
 andreas_decision_effect_tooltip:0 "你将能提供各种工作机会。"
 andreas_away_modifier:0 "旅行队主"
 andreas_away_modifier_desc:0 "安德烈亚斯正在引导他的一个旅行队，使他经常移动，暂时没法关注他的国度。"
 PODcanon_chars.50.t:0 "旅行队主"
 PODcanon_chars.50.desc:0 "由于你出色的声誉，很多人愿意为你向导。像往常一样，你也会利用这段离开你的国度的时间，将赛特的话语传播得更远更广，但有一个问题：这段旅程会有多长？要你的国度不受影响，你在国外呆的时间是有限制的。"
 PODcanon_chars.50.a:0 "一段小旅程会很好。"
 PODcanon_chars.50.b:0 "我可以处理这个。"
 PODcanon_chars.50.c:0 "没有我，这国度也会很好。"
 PODcanon_chars.50.d:0 "这里需要我。"
 podintroductions.195.t:0 "你的故事就此展开"
 podintroductions.195.desc:0 "纳克塔内波大人，你是赛特的摄政，直到他认为这个世界足以归来。但你必须与其他圣显者一起工作。\n这个庄严的议会在大多数时候都明智地听从你的意见，但他们在需要时仍会提供有用的建议。作为赛特最重要的守护者，你的职责是保护[Clan|E]，并将不信者带入羊栏。这肯定是一个漫长的过程，但你有永恒在身边。"
 podintroductions.195.a:0 "荣耀归于杜阿特之主。"
 nakh_intro_tooltip:0 "作为纳克塔内波，只要赛特彭雷和玛阿特卡勒还活着，你就可以用一个小决议来召集圣显者聚会。"
 nakh_decision:0 "圣显者的聚会"
 nakh_decision_tooltip:1 "我们得谈谈。"
 nakh_decision_desc:0 "作为赛特之子[Clan|E]的主要领导人，你仍然要听取其他方面的意见。因为身份，你的同僚圣显者们是最值得信赖的。"
 nakh_decision_confirm:0 "今晚的议程……"
 nakh_decision_effect_tooltip:0 "你将被提供未来五年的行动方案。"
 nakh_custom_decision:0 "这个决议只要[CHARACTER.GetFirstName]和[TARGET_CHARACTER.GetFirstName]还活着就可用。"
 seterpenre_advice_modifier:0 "赛特彭雷提供建议"
 seterpenre_advice_modifier_desc:0 "思想前卫的赛特彭雷总是想把注意力放在对外关系和[Clan|E]形象上。"
 maatkare_advice_modifier:0 "玛阿特卡勒提供建议"
 maatkare_advice_modifier_desc:0 "耐心的玛阿特卡勒希望专注于你自己的土地，使埃及成为大地上最伟大的地方，值得赛特归来。"
 PODcanon_chars.51.t:0 "圣显者的会晤"
 PODcanon_chars.51.desc:0 "这类事件总是很容易预测的。吸血鬼毕竟不会有太大的变化，他们的政治立场也是如此。作为他们中最重要的圣显者，你总是拥有最后的决定权，但即使是你也知道，有时听从别人的建议也是有好处的。"
 PODcanon_chars.51.a:0 "赛特彭雷，我们将遵循你的计划。"
 PODcanon_chars.51.b:0 "玛阿特卡勒，这次你是对的。"
 PODcanon_chars.51.c:0 "我们将按我的方式来！"
 podintroductions.196.t:0 "你的故事就此展开"
 podintroductions.196.desc:0 "尼芙璐女士，你的火之庭的力量正在逐年增长。但你可以做得更多。\n你作为秘法和腐化的女主人的名声是当之无愧的，很少有存在能在离开火之庭时不向赛特抵押他们不死族灵魂。这是一个你必须培养的声誉，因为它将有助于你在赛特的阶级中的提升。很快，他们都将学会对你的温柔关怀有同等程度的恐惧和爱戴。"
 podintroductions.196.a:0 "欢迎你，祝你住得愉快……"
 neferu_intro_tooltip:0 "作为尼芙璐，你有一项专属的通过火之庭释放囚犯的选项。"
 NEFERU_RELEASE:0 "火之庭的试炼"
 sarrasine_running_modifier:0 "逃亡中"
 sarrasine_running_modifier_desc:0 "凯塔尔的追随者仍在追杀你。这无疑使事务变得复杂了。"
 podintroductions.197.t:0 "你的故事就此展开"
 podintroductions.197.desc:0 "萨拉金大人，事情并没有真正按计划进行。你对凯塔尔的[diablerie|E]行动失败了，你不得不匆忙逃跑，以从他愤怒的追随者手中保住你的皮。是时候反击了。\n你加入了第四次十字军东征的残余部队，因为你感觉到了他们的弱点，他们可以从内部被打垮，而希腊人正忙于夺回君士坦丁堡，无法抓住这个机会。因此，你可能会在其他人做出反应之前，在安纳托利亚划出自己的封地。只有到那时，你才会有足够的力量来永远避开你的追兵。"
 podintroductions.197.a:0 "是时候脱下我的皮了。"
 sarrasine_intro_tooltip:0 "作为萨拉金，你开始时有一个负面修正，可通过一项专属决议来摆脱它。"
 sarrasine_decision:0 "末路"
 sarrasine_decision_tooltip:1 "我已经厌倦了逃跑。"
 sarrasine_decision_desc:0 "只有当你变得足够强大，让他们感到害怕时，凯塔尔的追随者才会停止追杀你。还有什么地方比摇摇欲坠的拜占庭帝国更适合做这件事呢？"
 sarrasine_decision_confirm:0 "现在该谁逃了？"
 podintroductions.198.t:0 "你的故事就此展开"
 podintroductions.198.desc:0 "阿努尔夫大人，你的耶梦加得密教发展得很好，在该地区的动荡中得到了很大帮助。不过，还是有一些问题需要处理。\n其中最重要的是瓦尔季斯，你的子嗣，他对斯堪的纳维亚诸神的“适当”密教有了奇怪想法。让我们说实话，你在这是为了金钱和权力，你更乐意把神明相关的玩意留给牧师。\n不过，你将来可能会需要瓦尔季斯，而为和解打下基础，即使是不真诚的，也可能是明智之举。"
 podintroductions.198.a:0 "我当然关心诸神，瓦尔季斯！"
 podintroductions.198.b:0 "不，她没救了。"
 podintroductions.199.t:0 "你的故事就此展开"
 podintroductions.199.desc:0 "让·巴蒂斯特大人，亡生看起来相当不错。你的开始是坎坷的，但你很好地反击了，现在是法兰西最成功的“夜间企业家”之一。\n你为凡人和[cainite|E]政治家的最高层面提供优质娱乐。其中有钱可赚，而且若关于金钱和权力之间的说法是真的，你很快就会变得非常强大。"
 podintroductions.199.a:0 "是时候扩大我的业务范围了！"
 jean_intro_tooltip:0 "作为让·巴蒂斯特，你具有一项专属建筑系列：掌控夜生活。"
 building_type_influence_night_life_01:0 "掌控夜生活"
 building_type_influence_night_life_01_desc:1 "#F 让·巴蒂斯特敏锐的商业意识可以在本省份中得到很好的利用。#!"
 building_influence_night_life_01:0 "掌控赌场"
 building_influence_night_life_01_desc:1 "庄家总会赢。"
 building_influence_night_life_02:0 "掌控酒馆"
 building_influence_night_life_02_desc:1 "遗忘你的悲伤，但不要遗忘你的钱包。"
 building_influence_night_life_03:0 "掌控妓院"
 building_influence_night_life_03_desc:1 "据称没有人会去的地方，但每天晚上却仍然神秘地满员。"
 podintroductions.200.t:0 "你的故事就此展开"
 podintroductions.200.desc:0 "格拉崔克斯大人，尽管你为家族做了那么多事，睿魔尔本人还是把你流放到了法兰西。显然，这是一种更大的疾病在侵蚀你[Clan|E]的症状。\n而这并不是这个胡言乱语的小丑埃特里乌斯能揭开的真相！那个白痴还在试图破坏你，即使他已经被任命为睿魔尔家族的摄政。没关系，你将利用法兰西肥沃的政治局势，建立你自己的权力基础，然后胜利地回到睿魔尔的中心地带。你将拯救你的家族，甚至在必要时从它本身手中拯救。"
 podintroductions.200.a:0 "我会回来的。"
 goratrix_intro_tooltip:0 "作为格拉崔克斯，只要埃特里乌斯还活着，你就得忍受他的鬼把戏。"
 PODcanon_chars.52.t:0 "埃特里乌斯的鬼把戏"
 PODcanon_chars.52.desc:0 "又一个埃特里乌斯用于损害你的阴谋被揭穿了。像往常一样，这是一个意志薄弱的粗鲁者的微弱侵犯。可悲的是，在可预见的未来，它仍会扰乱你的计划，你将不得不以某种方式处理它。"
 PODcanon_chars.52.a:0 "贿赂那些为他工作的傻瓜。"
 PODcanon_chars.52.b:0 "我有的是人去处理这个问题！"
 PODcanon_chars.52.c:0 "行，我自己来。"
 podintroductions.201.t:0 "你的故事就此展开"
 podintroductions.201.desc:0 "梅琳达女士，尽管有一些困难，你已经能够在英格兰建立起强大的睿魔尔势力。不过密特拉并没有让你的生活变得轻松，你必须仔细观察他接下来的行动。\n你也一直在寻找有关传说中的圣杯及其对吸血鬼影响的信息。为此，你确定了两个可能的来源，即阿瓦隆和怨烬的城堡，那里居住着两个“吸血鬼骑士”组织。如果你能探索这些堡垒，即使不能找到圣杯本身，至少也能找到一些关于它的有趣的小故事。"
 podintroductions.201.a:0 "也许我是这片土地的摩根勒菲。"
 meerlinda_intro_tooltip:0 "作为梅琳达，你有一项专属决议，即获取两大城堡以得到回报。"
 meerlinda_morgan_modifier:0 "摩根勒菲再世"
 meerlinda_morgan_modifier_desc:0 "梅琳达没有找到圣杯，但她肯定找到了一些东西。她现在是这些岛屿的美丽、强大而可怕的妖女。"
 meerlinda_decision:0 "英格兰的妖精"
 meerlinda_decision_tooltip:1 "传说故事往往藏有真相的火花。"
 meerlinda_decision_desc:0 "阿瓦隆的城堡和怨烬的城堡肯定隐藏着一些关于圣杯的秘密。获取它们，并将它们隐藏的力量据为己有。"
 meerlinda_decision_confirm:0 "……亚瑟王有何用？"
 podintroductions.202.t:0 "你的故事就此展开"
 podintroductions.202.desc:0 "热尔韦大人，你的扬升仍在继续。由于你对德意志外交界的巨大了解，你被赋予了一项富有回报的使命，虽然很困难。摧毁被称为“特亚维派睿魔尔”的分裂分子领袖德维拉，以及支持她的冈格罗。\n你已经组建了一支由可靠和有才华的族人组成的小团体，但你的人数仍然远远少于敌人。这可能是你迄今为止最大的挑战。"
 podintroductions.202.a:0 "我们必须谨慎谋划。"
 jervais_intro_tooltip:0 "作为热尔韦，你有一项专属决议，那就是除掉德维拉和利沃尼亚野者来获得奖赏。"
 jervais_rising_modifier:0 "明日之星"
 jervais_rising_modifier_desc:0 "热尔韦在睿魔尔金字塔中的地位继续快速提升，给整个[Clan|E]留下了深刻的印象。"
 jervais_decision:0 "利沃尼亚的克星"
 jervais_decision_tooltip:1 "我必须在该分裂蔓延之前终结它。"
 jervais_decision_desc:0 "埃特里乌斯的命令很明确。杀死特亚维派的首领德维拉，以及庇护她的利沃尼亚野者。"
 jervais_decision_confirm:0 "任务完成。"
 jervais_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死。"
 jervais_custom_decision2:0 "[GetTitleByKey('k_ferals_livonia').GetNameNoTier]必须已被销毁。"
 rutor_running_modifier:0 "逃亡中"
 rutor_running_modifier_desc:0 "睿魔尔因你的背叛想要你死，并且正在追杀你。这无疑使事务变得复杂了。"
 podintroductions.203.t:0 "你的故事就此展开"
 podintroductions.203.desc:0 "鲁托尔大人，你已经受够了被人指手画脚，不管是被棘秘魑还是睿魔尔。你再也不会向任何人俯首了。\n你通过跑向丹麦而逃离了睿魔尔家族，这是一个碰巧的选择，因为该地区缺乏一个强大的集中式吸血鬼势力。也许它可能是你？如果你的行动足够迅速和果断，以确保一个坚实的权力基础，你的[Clan|E]将不得不放弃追捕。然后，就终于轮到你发号施令了，这的确是一个非常诱人的前景。"
 podintroductions.203.a:0 "新的开始？"
 rutor_intro_tooltip:0 "作为鲁托尔，你可以通过达成你的专属决议，来除掉你的起始修正"
 rutor_decision:0 "末路"
 rutor_decision_tooltip:1 "我已经厌倦了逃跑。"
 rutor_decision_desc:0 "睿魔尔[Clan|E]将永远不会停止对你的追杀，除非你足够强大，迫使他们暂停。是时候掌控局面了。"
 rutor_decision_confirm:0 "现在该谁逃了？"
 faithful_xavier_modifier:0 "忠诚议员"
 faithful_xavier_modifier_desc:0 "作为睿魔尔精英的典范，没有人怀疑哈维尔对功业的承诺。"
 unfaithful_xavier_modifier:0 "忠诚议员？"
 unfaithful_xavier_modifier_desc:0 "没人怀疑哈维尔对功业的承诺……至少在公开场合不会。"
 podintroductions.204.t:0 "你的故事就此展开"
 podintroductions.204.desc:0 "哈维尔大人，你已经抵达北非，决心为你[Clan|E]的荣耀揭开这片大陆的神秘面纱。至少，这是官方的说法。\n事实上，议会的其他成员对你在核心地带本身被围困时离开他们的决定并不十分满意。但你没有给他们选择的余地，因为你已经厌倦了国内琐碎的阴谋，渴望得到更伟大的东西。你将不得不小心地平衡你对睿魔尔的官方职责和你对知识和秘密的不懈追求。"
 podintroductions.204.a:0 "为了睿魔尔氏族的荣耀！"
 podintroductions.204.b:0 "为了睿魔尔氏族的荣耀……"
 therimna_secrets5_modifier:0 "剩余秘密：5"
 therimna_secrets5_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[Clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets4_modifier:0 "剩余秘密：4"
 therimna_secrets4_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[Clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets3_modifier:0 "剩余秘密：3"
 therimna_secrets3_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[Clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets2_modifier:0 "剩余秘密：2"
 therimna_secrets2_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[Clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets1_modifier:0 "剩余秘密：1"
 therimna_secrets1_modifier_desc:0 "你正在向出价最高的人出售你所知道的关于睿魔尔[Clan|E]的一切。这带给了你一些朋友……和一些敌人。"
 podintroductions.205.t:0 "你的故事就此展开"
 podintroductions.205.desc:0 "泰瑞姆纳女士，睿魔尔要完了，你知道的。而你不会随船沉没。\n你带着许多关于血术法的有趣秘密逃离了你的[Clan|E]，这些秘密许多人都会花大价钱去获取。这些可能是你的救生索，因为你太重要了，只要你持有这些秘密就不会被杀死……但你也将成对睿魔尔而言更重要的击杀目标。\n你将不得不在出售你的秘密以换取一些总是很重要的金币和保留它们给你带来的余地之间取得平衡。"
 podintroductions.205.a:0 "我的存活是最重要的。"
 therimna_intro_tooltip:0 "作为泰瑞姆纳，你开始时具有5个秘密，你可以通过一个小决议出售，改变它们给你的减益和增益的平衡。"
 therimna_decision:0 "讨价还价"
 therimna_decision_tooltip:1 "万物皆有价。"
 therimna_decision_desc:0 "你所拥有的血术法的秘密使你成为睿魔尔的目标，但也使你成为一位对其他人来说过于重要不该被杀的人。你愿意用这种相对的平静来换取金钱吗？"
 therimna_decision_confirm:0 "成交。"
 podintroductions.206.t:0 "你的故事就此展开"
 podintroductions.206.desc:0 "维斯塔尼亚女士，你终于在你心爱的石像鬼中找到了慰藉和陪伴。远离你其他同胞的残忍和野蛮，只有他们真正理解你。\n一想到要让它们为毫无意义的睿魔尔战争而被屠杀，你的心就会痛。但现在，你没有什么选择，必须当他们的棋子。但你致力于尽快改变这种状况。你美丽的婴儿毕竟只能由他们慈爱的母亲来真正照顾。"
 podintroductions.206.a:0 "家庭是最重要的。"
 virstania_intro_tooltip:0 "作为维斯塔尼亚，你能使用决议来生成石像鬼兵士军团。"
 virstania_decision:0 "漂亮的石宝宝"
 virstania_decision_tooltip:1 "还有更多正在到来！"
 virstania_decision_desc:0 "你是石像鬼之母，你必须帮助它们正确地生活。这是一项巨大的责任，但也是你最大的幸福。"
 virstania_decision_confirm:0 "嘘……妈妈在这。"
 virstania_decision_effect_tooltip:0 "你将选择生成多少石像鬼。"
 PODcanon_chars.53.t:0 "诞生"
 PODcanon_chars.53.desc:0 "下一批石像鬼几乎已经准备好了。然而，贪婪的睿魔尔已经在试图从你手中夺走它们，如果你想拯救它们，你必须迅速行动。你想救下多少？"
 PODcanon_chars.53.a:0 "我至少救了其中的一些。"
 PODcanon_chars.53.b:0 "我必须拯救更多！"
 PODcanon_chars.53.c:0 "所有！"
 PODcanon_chars.53.d:0 "这次我无法帮助他们……"
 virstania_small_gargoyles_tt:0 "一组石像鬼会被加入到你的可用兵士中。"
 virstania_medium_gargoyles_tt:0 "两组石像鬼会被加入到你的可用兵士中。"
 virstania_high_gargoyles_tt:0 "三组石像鬼会被加入到你的可用兵士中。"
 angry_fays_marconius_modifier:0 "愤怒的妖精"
 angry_fays_marconius_modifier_desc:0 "通过对神秘的妖精进行实验，你学到了很多东西……但你也在制造强大的敌人。"
 podintroductions.207.t:0 "你的故事就此展开"
 podintroductions.207.desc:0 "马可纽斯大人，你一直在努力工作，试图了解你作为吉雅希德之一的新状况。显然，最好的行动方案是在一些被俘的妖精身上进行“实验”，因为你似乎与他们有一些相似之处。不过他们对这一点并不满意。\n你也知道勒森魃[Clan|E]正在寻找任何弱点的迹象来针对你，而这次与你的盟友之间的分裂可能就是他们所等待的。你可能需要小心平衡你对知识的渴求和你与妖精不稳定的联盟。"
 podintroductions.207.a:0 "令人为难的情况。"
 marconius_intro_tooltip:0 "作为马可纽斯，你可以具有一项平衡你与妖精的关系的决议。"
 marconius_decision:0 "你与妖精"
 marconius_decision_tooltip:1 "如何接触他们……"
 marconius_decision_desc:0 "无论你喜欢与否，妖精都是你的国度的一个重要部分。因此，你必须谨慎选择对他们的立场。"
 marconius_decision_confirm:0 "是时候重新考虑我的选择了？"
 marconius_decision_effect_tooltip:0 "你将选择如何接触妖精。"
 happy_fays_marconius_modifier:0 "有帮助的妖精"
 happy_fays_marconius_modifier_desc:0 "妖精认为你是一个有用的，即使是善变的盟友，而且目前更喜欢是你在权位上，而不是另一位吸血鬼。"
 PODcanon_chars.54.t:0 "你与妖精"
 PODcanon_chars.54.desc:0 "由于你的国家对妖精的历史意义，它正在与妖精合作，而你必须处理好这个问题。他们是有用的盟友，尤其是用于对付你的同族族人的潜在报复，但他们也是非常有趣的实验对象，可以了解你这么一位被妖精眷染的[cainite|E]的状况。决定，决定……"
 PODcanon_chars.54.a:0 "遗憾的是，我现在需要他们作为盟友。"
 PODcanon_chars.54.b:0 "我将暂时保持距离。"
 PODcanon_chars.54.c:0 "有太多可了解的了！"
 podintroductions.208.t:0 "你的故事就此展开"
 podintroductions.208.desc:0 "剌曷大人，你的职责是保护安答。然而，大草原很广阔，你不得不经常徘徊，以处理夜以继日出现的各种问题。\n自从你的人民开始呼唤你作为解决争端和其他小冲突的最终权威，情况变得更糟。作为非正式的“大草原之判官”，你有很大的权力，你开始为了你的同胞们的更大利益而滥用这种权力。无论他们是否知道。"
 podintroductions.208.a:0 "判官与军阀。"
 chinkhai_intro_tooltip:0 "作为剌曷，你有一项审判你封臣的专属[character_interaction|E]。"
 POD_chinkhai_interaction:0 "大草原之判官"
 POD_chinkhai_interaction_desc:0 "我将开庭。"
 PODcanon_chars.55.t:0 "审判"
 PODcanon_chars.55.desc:0 "作为安答部族的究极权威，你可以完全自由地以你喜欢的方式开始和结束任何审判。然而，你要维护自己的声誉，太过宽松可能会被看作是一种软弱。"
 PODcanon_chars.55.a:0 "无罪！"
 PODcanon_chars.55.b:0 "有罪！"
 PODcanon_chars.55.c:0 "本案尚无定论。"
 podintroductions.209.t:0 "你的故事就此展开"
 podintroductions.209.desc:0 "令人畏惧的玛格达，又有一个入侵者试图掠夺你的美丽岛屿。这个密特拉只是一长串外来征服者中最新的一个，他们在抢夺属于你的东西。你不会允许这样做的。\n你的人民早已不复存在，你的信仰也几乎成了一种记忆，甚至对你本身在这一刻也算是如此。只有你的愤怒还在，现在是时候让它为你发声了。岛屿已经被腐化得无法修复，你将不得不摧毁你路上的一切，使它们重新变得纯净。\n这将是血腥的，但他们这是自作自受。"
 podintroductions.209.a:0 "他们将付出代价。"
 magda_intro_tooltip:0 "作为玛格达，你可以在低发展度的省份中建造专属建筑系列。"
 building_type_magda_purge_01:0 "玛格达的清洗"
 building_type_magda_purge_01_desc:1 "#F 该让岛屿重新开始了。崭新且血腥的开始。#!"
 building_magda_purge_01:0 "玛格达的群落"
 building_magda_purge_01_desc:1 "在玛格达的指挥下，冈格罗部群在这片土地上游荡，在他们的路上散布恐怖和死亡。"
 building_magda_purge_02:0 "玛格达的部族"
 building_magda_purge_02_desc:1 "野蛮的强者为王法则已经重新控制了这里。文明在玛格达的记仇部族的爪子和獠牙下轰然倒塌。"
 podintroductions.210.t:0 "你的故事就此展开"
 podintroductions.210.desc:0 "波乌狄纳女士，在度过了相当长的一段时间后，你终于离开了法兰西。你终于找到了你所寻找的东西，现在是时候继续前进了。\n布鲁赫本人信任你，让你保持他的[Clan|E]在正确的道路上，但使命是巨大的。你必须让你的其他同胞们了解你，并使你已经令人印象深刻的传奇更加壮大。只有这样，他们才会接受你是布鲁赫传承的真正继承者。"
 podintroductions.210.a:0 "要做的事情还很多。"
 catubodua_intro_tooltip:0 "作为波乌狄纳，你不能[Embrace|E]，因为她在第一位子嗣之后就发誓不再这样做。\n你还具有一项专属决议，用以增长你的传奇，给其他氏族族人留下深刻印象。"
 catu_heir_of_brujah_modifier:0 "布鲁赫的嗣女"
 catu_heir_of_brujah_modifier_desc:0 "终于，布鲁赫[Clan|E]正在痊愈。一位配得上布鲁赫和特洛伊尔的女继承人已经崛起，将带领战士–学者们进入一个新的、光明的时代。"
 catubodua_decision:0 "布鲁赫的复兴"
 catubodua_decision_tooltip:1 "我不能让他失望。"
 catubodua_decision_desc:0 "骄傲的布鲁赫不会接受新的首领，除非他或她能完美地代表他们[Clan|E]的战士又学者的一面。显然，同时还要是个成功的统治者。"
 catubodua_decision_confirm:0 "新的时代开始了。"
 podintroductions.211.t:0 "你的故事就此展开"
 podintroductions.211.desc:0 "德维拉女士，你的人民正处于严重的危险之中。随着基督教信徒变得越来越有侵略性，睿魔尔[Clan|E]派了一个由热尔韦领导的小团体来杀你和其他特亚维派。\n幸运的是，你遇到了喀喇，现在正受到利沃尼亚野者的保护。不过，在解决这位睿魔尔的攻击，以及确保野者的边境安全之前，你不会轻易休息。你和你的安全是以这个为保证的。"
 podintroductions.211.a:0 "特亚维保佑我们。"
 deverra_intro_tooltip:0 "作为德维拉，你有一项专属决议，那就是摆脱热尔韦，将野者的疆域向东扩展。\n你开局时与喀喇在权力斗争。"
 deverra_blessed_modifier:0 "特亚维的选民"
 deverra_blessed_modifier_desc:0 "德维拉显然是特亚维的选民。她的信仰散发着光芒，让所有人都能看到，这对十字的追随者来说是一位剩敌，他们还没有赢。"
 deverra_decision:0 "特亚维的选民"
 deverra_decision_tooltip:1 "我不能让他失望。"
 deverra_decision_desc:0 "你的人民在未来的混乱时期依靠你和野者的保护。如果你能杀死在攻的睿魔尔首领，并确保你西部边界的安全，你的情况将会得到改善。"
 deverra_decision_confirm:0 "我们忍过了。"
 deverra_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死。"
 deverra_custom_decision2:0 "你或你的领主完全控制了[GetTitleByKey('d_pomerelia').GetNameNoTier]公国。"
 deverra_custom_decision3:0 "你或你的领主完全控制了[GetTitleByKey('d_prussia').GetNameNoTier]公国。"
 podintroductions.212.t:0 "你的故事就此展开"
 podintroductions.212.desc:0 "达楠女士，你的皇朝很强大。由于您与大越和吴哥丛林中的凶民结盟，您的东部边界是安全的。只有西方现在需要您的关注。\n印度一直是一个难以驯服的地区，充满了永雷皇朝的异端和所谓的[cainites|E]造成的问题。也许你的东方朋友可以伸出他们的爪子和獠牙，帮助你安抚这个不守规矩的地区？"
 podintroductions.212.a:0 "朱雀高舞。"
 dyanang_intro_tooltip:0 "作为达楠，你有一项专属的招募狼人兵士小决议。"
 dyanang_decision:0 "凶民"
 dyanang_decision_tooltip:1 "朋友们，我需要你们的帮助。"
 dyanang_decision_desc:0 "你的皇朝和丛林王国的凶民之间的良好关系可以被利用来获得帮助。"
 dyanang_decision_confirm:0 "欢迎，并谢谢你。"
 dyanang_decision_effect_tooltip:0 "你将选择生成多少狼人兵士。"
 PODcanon_chars.56.t:0 "来自丛林的帮助"
 PODcanon_chars.56.desc:0 "自从1210年黄金障壁屋室无私地拯救了被称为廊开的龙化人中龙的生命后，可怕的兽妖就成了你暂时的盟友。滥用这种友谊仍然是不明智的，但你仍然可以指望他们在需要时帮助你。"
 PODcanon_chars.56.a:0 "一支战队就够了。"
 PODcanon_chars.56.b:0 "需要两支战队。"
 PODcanon_chars.56.c:0 "你有多少我要多少。"
 PODcanon_chars.56.d:0 "实际上，我可以自己处理情况。"
 dyanang_small_werewolves_tt:0 "一组狼人会被加入到你的可用兵士中。"
 dyanang_medium_werewolves_tt:0 "两组狼人会被加入到你的可用兵士中。"
 dyanang_high_werewolves_tt:0 "三组狼人会被加入到你的可用兵士中。"
 durga_young_tt:0 "由于你在扮演突伽·辛，通过实现这一目标，你也解除了芭芭雅嘎对你的诅咒。"
 podintroductions.213.t:0 "你的故事就此展开"
 podintroductions.213.desc:0 "利奥波德大人，尽管你是著名的裁判官，但你仍然是一个需要履行职责的贵族。其中之一就是要找到一个合适的配偶。\n作为巴伐利亚小家族的后裔，娶一个当地的贵族少女是很容易的。格蓓尔佳显而易见，因为你觉得她可以成为一位有用的伙伴。另一个选择是把你的网撒得更大，也许到意大利。一个更有声望的选项是肯定有的，但你对你的新娘将了解甚少。\n最末的选择是……非常规的。你最好的朋友鲍迪奥恩经常开玩笑说要把他的一个儿时伙伴介绍给你，这个粗野的假小子看上去有比年轻的鲍迪奥恩更胜一筹的斗殴技巧。以你脆弱的体质，她的力量可以弥补你的弱点。\n……如果你在那么多玩笑之后真的和他的朋友结婚，你一定很想看看鲍迪奥恩的表情。"
 podintroductions.213.a:0 "是的，鲍迪奥恩，这正在发生。"
 podintroductions.213.b:0 "格蓓尔佳女士，你能……？"
 podintroductions.213.c:0 "很高兴终于见到你了，阿德莱德女士。"
 podintroductions.213.d:0 "我没有时间做这些无聊的事。"
 aignen_secrets_modifier:0 "艾格尼恩的秘密"
 aignen_secrets_modifier_desc:0 "神目知道许多。也许对教廷中一些更狂热的成员来说，其知道得太多了。"
 podintroductions.214.t:0 "你的故事就此展开"
 podintroductions.214.desc:0 "艾格尼恩大人，你处于一个惹人的位置，那就是新生的暗影裁判所的眼睛和耳朵，这是神圣教廷中许多人不赞成的事情。然而你知道你的任务的重要性。\n在你的指导下，神目已经传播得很远很广，提供了许多人脉，你可以利用这些人脉为裁判所赢得荣耀。不过，这项关键的准备工作已经受到了圣座本身的威胁，你将不得不暂时让你的“盟友”远离你。"
 podintroductions.214.a:0 "我知道必须得做什么。"
 aignen_intro_tooltip:0 "作为艾格尼恩，你一开始就有一个强大的密谋修正。只要艾格尼恩还活着，和教廷不找你麻烦，它就会一直存在。"
 PODcanon_chars.57.t:0 "教宗的来访"
 PODcanon_chars.57.desc:0 "圣座的特使即将到来，想看看你们行动的真实程度。这可能会很危险，因为罗马的许多人只想关闭神目，担心他们的小计谋会因为你的存在而受到干扰。\n你知道你的任务比这重要得多，但如果你想继续你自己的神圣事业，你仍将不得不对付这些目光短浅的傻瓜。"
 PODcanon_chars.57.a:0 "贿赂特使应该足够了。"
 PODcanon_chars.57.b:0 "我是教廷的一个卑微的仆人。"
 PODcanon_chars.57.c:0 "我将成为你的个人向导。"
 PODcanon_chars.57.d:0 "我别无选择，只能与一些人脉切断联系。"
 vittoria_illness_modifier:0 "超自然诅咒"
 vittoria_illness_modifier_desc:0 "维特多利亚被一个强大的女巫诅咒了。虽然她的心智仍然很强大，但她的身体却在慢慢枯萎。"
 podintroductions.215.t:0 "你的故事就此展开"
 podintroductions.215.desc:0 "无畏的维特多利亚，你已经开始了你在意大利的神圣职责，但你对你的同胞们隐藏了一个可怕的事实：你被诅咒了。\n多年前与你战斗的一个强大的女巫在使用她邪恶的魔法后得以逃脱。从那时起，你的身体就开始慢慢枯萎，如果这种情况继续下去，你可能会在完成你的任务之前就被主传唤。\n幸好，最近出现了一个解决方案。感谢神目的一些情报，你了解到女巫已经在马赛定居了。如果你能“绕道”到这个城市，并清除它的吸血鬼和术士居民……你受到的诅咒肯定将结束。"
 podintroductions.215.a:0 "小小的诅咒不会终结我！"
 vittoria_intro_tooltip:0 "作为维特多利亚，你具有一项专属决议，既通过取得马赛来除掉你身上的诅咒。"
 vittoria_decision:0 "诅咒"
 vittoria_decision_tooltip:1 "你仍然有很多事情要做。"
 vittoria_decision_desc:0 "你仍然很强大，但那个可恶的诅咒仍然令人担忧。清洗马赛，消灭女巫！"
 vittoria_decision_confirm:0 "火，即净化。"
 rodrigue_paranoia_modifier:0 "彻底的偏执"
 rodrigue_paranoia_modifier_desc:0 "有人要害你。所有人都可能被其所控制。"
 podintroductions.216.t:0 "你的故事就此展开"
 podintroductions.216.desc:0 "罗德里格大人，你是第一个面对吸血鬼并活下来的人，而你仍然是唯一知道真相的人：他们无处不在。\n甚至教廷和他们所谓的“暗影裁判所”也可能充满了他们的仆人。除了你自己，你必须绝对不相信任何人。一场大清算即将到来，天主将为你指明救赎之路。\n如果这个世界得被焚毁来得到救赎，你将站在灰烬之上。"
 podintroductions.216.a:0 "我不会再被愚弄了。"
 roque_paranoia_modifier:0 "罗克的计谋"
 roque_paranoia_modifier_desc:0 "现在是制定计谋的时候吗？为什么得分是，每时每刻都是制定计谋的时候！"
 podintroductions.217.t:0 "你的故事就此展开"
 podintroductions.217.desc:0 "玛丽亚修女，尽管你在英格兰的任务繁重，但你不能忘记你的出身。\n你的一切都归功于特蕾莎修女，她是创立圣约翰修女会的受祝福的灵魂，是早期裁判所的核心。她的去世对所有修女来说是一个艰难的时刻，如果神圣教廷知道这位圣洁的女性，你们会更加安心。\n因此，你们已经开始编纂特蕾莎的人生和奇迹的记载，准备带到罗马去，希望能将她封为圣人。如果你能成功，修女们就会感到安宁，知道她们逝去的创始人永远活在世上。"
 podintroductions.217.a:0 "一项最神圣的使命。"
 maria_intro_tooltip:0 "作为玛利亚，你具有一项专属决议，即编纂关于特蕾莎的生活的记录。如果你在玛丽亚去世前完成，修女会将获得可观的声誉提升。"
 teresa_life_4_modifier:0 "特蕾莎的封圣进度：4"
 teresa_life_4_modifier_desc:0 "你正在努力将特蕾莎修女的奇迹的真相带到罗马的耳边。\n一旦这个修正达到5，整个过程就完成了。"
 teresa_life_3_modifier:0 "特蕾莎的封圣进度：3"
 teresa_life_3_modifier_desc:0 "你正在努力将特蕾莎修女的奇迹的真相带到罗马的耳边。\n一旦这个修正达到5，整个过程就完成了。"
 teresa_life_2_modifier:0 "特蕾莎的封圣进度：2"
 teresa_life_2_modifier_desc:0 "你正在努力将特蕾莎修女的奇迹的真相带到罗马的耳边。\n一旦这个修正达到5，整个过程就完成了。"
 teresa_life_1_modifier:0 "特蕾莎的封圣进度：1"
 teresa_life_1_modifier_desc:0 "你正在努力将特蕾莎修女的奇迹的真相带到罗马的耳边。\n一旦这个修正达到5，整个过程就完成了。"
 maria_decision:0 "特蕾莎修女的封圣"
 maria_decision_tooltip:1 "她应得这，而且更多。"
 maria_decision_desc:0 "为了帮助你的修女们知道特蕾莎修女仍然在注视着他们，你必须确保罗马承认她给这片土地带来的许多祝福。你将写一份关于她的生活的详细说明，无疑会说服罗马对她进行封圣。"
 maria_decision_confirm:0 "圣徒的努力。"
 heir_gauthier_modifier:0 "戈捷的继承人"
 heir_gauthier_modifier_desc:0 "强大的鲍迪奥恩是戈捷选定的继任者。亚柯骑士正尽职尽责地团结在“布列塔尼”身后。"
 heiress_gauthier_modifier:0 "戈捷的女继承人"
 heiress_gauthier_modifier_desc:0 "聪明的让是戈捷选定的继任者。她将带领亚柯骑士取得胜利……无论他们是否愿意。"
 podintroductions.218.t:0 "你的故事就此展开"
 podintroductions.218.desc:0 "戈捷大人，时间不等人，主很快就会召唤你回到祂身边。你必须让亚柯骑士们为这一时刻做好准备。\n预期的行动方案是，你将忠实的鲍迪奥恩从德意志召回，并提名他为你的继任者。作为一个有才华和有魅力的领导人，他将做得足够好，你确信这一点。\n但是……还有詹妮，或者说让，她喜欢如此被称呼。她头脑中的光辉在过去曾多次让你感到震惊，她可能是世界上有史以来对敌对者的最大威胁。不过有一个问题……她是个女人。亚柯骑士们已经对你提拔她进入你的核心圈子感到不满，所以如果你提名她为继承人……\n无论如何，必须做出选择。你的传承取决于此。"
 podintroductions.218.a:0 "鲍迪奥恩是显而易见的选择。"
 podintroductions.218.b:0 "让就是未来。"
 gauthier_intro_tooltip:0 "让大怒，离开了亚柯骑士团，再也没有人看到她。"
 PODcanon_chars.58.t:0 "哈德施塔特到永远"
 PODcanon_chars.58.desc:0 "你的[Sire|E]——哈德施塔特最近已经终焉之死。可以肯定的是，这是一个悲惨的事件，但从长远来看，你并不认为它会对你产生多大的影响。不过，自从他去世后，你一直感觉……很奇怪。\n关于与他会面的回忆，关于“应急计划”的谈话，你的记忆中有一星期的空白……你突然觉得自己越来越多地模仿你已故的主上，像他那样说话和行动……甚至像他那样思考。哈德施塔特真的死了吗？你身上发生了什么？\n也许永远会有一位哈德施塔特……"
 PODcanon_chars.58.a:0 "说我已终焉之死的报道过于夸大了。"
 PODcanon_chars.58.b:0 "我是我自己！"
 hardestadt_takeover_tt:0 "你将成为哈德施塔特，获得他的特质，失去你的特质，甚至变得看起来像他。"
 podintroductions.219.t:0 "你的故事就此展开"
 podintroductions.219.desc:0 "袁马义无疑是一位杰出的[GetTrait('shih').GetName( GetPlayer )]。尽管她多年来一直是位狩魔人，但她生活在宋朝的上流社会。在那里，作为一名小望族的妻子，袁马义经常被访求，既因社交活动，也因那些与鬼神与望族之间的纠纷。\n自然，很少有人——或妖魔——预想到袁马义如此足智多谋。许多被她打败的妖魔从未意识到——直到太晚——她携带的两把扇子是武器。袁马义非常巧妙地使用它们，成功地处理了许多对她所在地区的望族的安全的威胁。"
 podintroductions.219.a:0 "而他们涌泉相报。"
 PODcanon_chars.59.t:0 "蒙卡达的传承"
 PODcanon_chars.59.desc:0 "露西塔女士，几年前你战胜了你受诅的尊长蒙卡达，但这场胜利开始感到空虚。你曾致力于将他拉下马，而现在事已至此……你漫无目的，从一个事业徘徊到另一个事业，希望找到一个新的驱动你生存的目标。\n更糟的是，你有一种耿耿于怀的感觉，蒙卡达预言了这个结果和这个非常时刻。的确，你的[Sire|E]经常谈到他的神圣职责和你的命运，即跟随他的脚步，无论你是否打算这样做。在当时，这听起来像是一种威胁，但现在……也许更像是一种预言。也许他是对的，也许他的职责一直以来都会成为你的职责。\n逃脱你的命运似乎并不那么容易。"
 PODcanon_chars.59.a:0 "我明白了。"
 PODcanon_chars.59.b:0 "我不能让他赢！"
 podintroductions.220.t:0 "你的故事就此展开"
 podintroductions.220.desc:0 "伟大的荷鲁斯，你与你的丑恶叔父赛特的传奇战争必须继续。你不会否认有一些挫折，而且蛇之子在埃及也像以前一样强大。但这并不重要，因为你是复仇者。奥西里斯和伊西斯从远方注视着你，等待着你最终将这条懦弱的蛇惨叫着送回催生他的深渊的那一刻。\n召集你忠实的战士们，准备向北进军。是时候一劳永逸地解决这个问题了。"
 podintroductions.220.a:0 "我向你而来，叔父……"
 horus_intro_tooltip:0 "作为荷鲁斯，你有一项专属决议，即最终达成你的复仇。"
 horus_decision:0 "复仇者"
 horus_decision_tooltip:1 "我很快就会出现在你的噩梦中，叔父。"
 horus_decision_desc:0 "如果你要找到赛特的藏身之处，你首先要削弱他的邪教羽翼，并摧毁他最信任的追随者骨干。"
 horus_decision_confirm:0 "他在哪？!"
 horus_custom_decision_1:0 "[TARGET_CHARACTER.GetFirstName]，赛特的宠儿，必须死。"
 horus_custom_decision_2:0 "[TARGET_CHARACTER.GetFirstName]，赛特邪教的支柱，必须死。"
 horus_custom_decision_3:0 "[TARGET_CHARACTER.GetFirstName]，赛特的妻妾，必须死。"
 horus_custom_decision_4:0 "[TARGET_CHARACTER.GetFirstName]，赛特的勇士，必须死。"
 horus_decision_effect_tooltip:0 "你的复仇将得以实现。"
 horus_the_avenger_modifier:0 "荷鲁斯，复仇者"
 horus_the_avenger_modifier_desc:0 "活法老、不死之子、复仇者、归来的王、独眼之王、第一重生者以及其他许多头衔……但首先，是赛特克星。"
 PODcanon_chars.60.custom.tt:0 "所有残余的赛特之子的权威都将破碎。"
 PODcanon_chars.60.t:0 "斩蛇"
 PODcanon_chars.60.desc:0 "令人失望。\n在把他的教派毁于一旦，并杀死了他最信任的顾问之后，你期望赛特能为你提供一场光荣的最后一战来庆祝你的胜利。诚然，你不得不在上百个疯狂的狂热者中杀出一条血路，才能来到这座金字塔的地下室，而且你现在浑身是血，但这仅仅是热身而已。而现在，你站在你叔父的石棺前，那个蠢货在石棺里休眠，不时地扭动，也许有点意识到你为他准备的宿命。\n你开始疯狂地砍他的尸体，直到每块都切成能被抓在手里。然后你走到外面，让神圣地拉神将遗体烧成焦炭。除了他的眼睛，你把它扔给一只路过的秃鹫，以纪念你自己失去的那只。\n然后，只有在那时，你才会跪下来，让沙子把你冲走，直到你再次重生，数个世纪以来第一次摆脱了对复仇的需求。"
 PODcanon_chars.60.a:0 "父亲，母亲，安息吧。"
 podintroductions.221.t:0 "你的故事就此展开"
 podintroductions.221.desc:0 "受祝福的埃及女王，你已经明智地与荷鲁斯愚蠢的圣战保持距离。相反，你关心的是更重要的事情，比如在凡人的心目中保护旧埃及的伟大。这确实是一个巨大的任务，即使是像你这样有奉献精神和影响力的人。\n然而你别无选择，荷鲁斯一心想要打仗，而赛特的堕落追随者则在腐蚀你心爱的祖国，只有你能记得当年是什么让埃及成为一个如此特别和强大的地方。你有责任让火种继续存在。"
 podintroductions.221.a:0 "伊西斯唯一有价值的传承是埃及本身"
 neferukhayt_intro_tooltip:0 "作为尼芙璐卡哈特，你无法转变文化。\n但你推广文化任务速度更快。"
 socialite_queen_egypt_modifier:0 "交际女王"
 socialite_queen_egypt_modifier_desc:0 "尼芙璐卡哈特是古埃及伟大者的具身。与她交谈让你真的感觉到，黑土之国是永恒的。"
 NEFERUKHAYT_CULTURE_BONUS:0 "尼芙璐卡哈特的激情"
 podintroductions.222.t:0 "你的故事就此展开"
 podintroductions.222.desc:0 "伟大的赫赫提，你是赛特本人创造的七大忌灵木乃伊之一。而且，在你看来，你是这群可怜人中唯一有能力的人（除了阿门，他是一位非常好地食伴没别的）。因此，你必须起带头作用，确保你神圣地灭世任务不偏离目标。\n显然，你对其他六个人的期望不亚于完全的服从，以及在你需要的时候随时愿意拿出他们的金钱。即使在曾是凡人时，你也总是喜欢金钱，而且，很明显，在你宽大的口袋里比在他们瘦小的财库里更合适。如果他们手头没有足够的金钱呢？好吧，也许他们可以成为你著名宴会的特殊宾客……"
 podintroductions.222.a:0 "有什么比吃饱肚子，填满宝库更好呢？"
 hemhemti_intro_tooltip:0 "作为赫赫提，你可以直接使用敲诈臣民决议。该决议也将能消除压力。"
 hunted_down_eternity_modifier:0 "永恒追杀"
 hunted_down_eternity_modifier_desc:0 "荷鲁斯和他的贤荷鲁将永远不会停止追捕你。赛特和他的忌灵木乃伊也不会。而每一位想要真正不朽的贪婪法师或吸血鬼，也在追捕中。\n这就是你的宿命。"
 cabirus_intro_tooltip:0 "你将保留对生命神咒的使用权和制造新木乃伊的能力，但你将永远被那些想拥有该神咒的人追杀。"
 cabirus_intro_giveup_tooltip:0 "你放弃了生命神咒，使得你无法在未来创造新的木乃伊。"
 podintroductions.223.t:0 "你的故事就此展开"
 podintroductions.223.desc:0 "卡比洛斯大人，你已经完成了不可能的任务：学会了生命神咒，从众神手中夺回了真正的不朽……但众神很生气。自从你把自己化为木乃伊的光荣之日，你就被无数想要获得神咒的人追杀。\n唯一的出路（除了缓慢而痛苦的死亡之外）是荷鲁斯本人给你的，要求你让他从你的记忆中抹去生命神咒。这无疑会免去你的追捕者，但也意味着你将永远无法再制造新的木乃伊。而永生可能是过长于独自忍受……"
 podintroductions.223.a:0 "我不能永生永世都在逃亡！"
 podintroductions.223.b:0 "我将一如既往地坚持下去"
 menele_custom_decision:0 "[TARGET_CHARACTER.GetFirstName]必须死，或者不再是你的敌人"
 helen_internal_modifier:0 "内部问题"
 helen_internal_modifier_desc:0 "你正专注于内部事务，确保迅速加强你在日耀族群的新权位。"
 shaky_helen_modifier:0 "受争议的统治"
 shaky_helen_modifier_desc:0 "你在族群的狼族居民眼皮底下夺走了它。他们还没有忘记这个事实。"
 podintroductions.225.t:0 "你的故事就此展开"
 podintroductions.225.desc:0 "大胆的海伦，通过你的果断行动和纯粹的意志力，你已经确保了你在享有盛誉的日耀族群中登顶。可悲的是，族群的大多数狼还没有真正承认你的崛起，这种不团结可能是族群众多敌人的一个机会。你必须要采取行动。\n你可以摆出一副倾听他们顾虑的模样，或者你可以依靠你的姐妹们的帮助，把日耀族群真正地变成一个黑怒族群。"
 podintroductions.225.a:0 "我将倾听你的顾虑。"
 podintroductions.225.b:0 "姐妹们，我们将重塑这片土地！"
 podintroductions.225.c:0 "我不需要任何帮助！"
 lucille_intro_tooltip:0 "作为露西尔，你开局时拥有更多的金钱，这要归功于你以前的冒险。你还将获得购买停战协议[character_interaction|E]。"
 podintroductions.226.t:0 "你的故事就此展开"
 podintroductions.226.desc:0 "狡猾的露西尔，在附近的裁判官取得了一场皮洛士式胜利之后，星域族群已经被消灭了。随着大部分领导层的消失，你几乎不费吹灰之力就成为被围困的守卫者的最后希望。然而，你知道勇敢和武力并不足以赢得对你强大敌人的胜利。\n由于你的许多邻居认为你很弱小或无足轻重，你也许能说服他们中的一些人，为了一袋硬币的承诺而暂时看开。而且，正如命运所安排的，你在以前的冒险中存下了几袋硬币。"
 podintroductions.226.a:0 "谁不喜欢钱呢？"
 timno_intro_tooltip:0 "作为蒂莫，你亲自辅导的每个孩子在成年后将获得5管理和5外交。"
 podintroductions.227.t:0 "你的故事就此展开"
 podintroductions.227.desc:0 "聪明的蒂莫，你的族群坐落在许多强大国度的交叉口。你将不得不小心你强大的吸血鬼邻居——自由邦和影幕。与瑞典的芬里尔仔兽或俄罗斯的银牙取得联系可能会有帮助。\n不管怎样，你知道在就算在你去世后，为盖亚的斗争也将继续很长时间。因此，你已经发誓要尽你所能为下一代准备好等待他们的考验。这可能是对抗怒嚎末日的最终胜利的关键。"
 podintroductions.227.a:0 "他们将做好准备。"
 podintroductions.228.t:0 "你的故事就此展开"
 podintroductions.228.desc:0 "大胆的布拉达，在经历了许多冒险之后，你已从流放归来，在不列颠群岛的芬尼安最需要的时候领导他们。你的魅力和精明的策略使他们摆脱了困境，但仍有许多事情要做。\n不过还有一个问题需要考虑，一个更私人的问题。你的先祖因为与名为斯蒂芬妮的吸血鬼有联系而受辱，这导致了你的家族被流放。虽然你已经证明了自己，但斯蒂芬妮仍然逍遥法外，并在玩弄着你。一直有暗示、警告甚至预言：你将在未来不得不面对她。也许你会赢，也许你不会，但重要的是，你将面对她手中的剑，洗去仍然玷污你的血脉的耻辱。"
 podintroductions.228.a:0 "我无法逃脱我的宿命。"
 bladdud_intro_tooltip:0 "如果你们都还活着，斯蒂芬妮会在10年后来找你们。"
 podintroductions.229.t:0 "命中注定的决斗"
 podintroductions.229.desc:0 "她就在那。那个欺骗了你的先祖并从那时起一直困扰着你的家族的人。她花了不少时间，但这魔物终于玩够了。\n你已经证明了自己的廉洁，所以她不是带着承诺或提议来的，她是带着獠牙来的。\n你不会屈服。你不会退缩。你的先祖在看着，希望你能成为为他们的耻辱复仇的人。是时候迎接你的命运了，布拉达。"
 podintroductions.229.a:0 "盖亚注视着我！"
 podintroductions.229.effect.success.desc:0 "斯蒂芬妮被击败了！"
 podintroductions.229.critical.failure.effect.desc:0 "到最后，光有勇敢还是不够。"
 podintroductions.230.t:0 "战胜宿命"
 podintroductions.230.desc:0 "你做到了，布拉达国王。斯蒂芬妮现在在你的脚下只剩下灰烬，你的血脉的耻辱的最后痕迹被风卷走了。巨大的欣慰涌上心头，因为虽然你仍要带领芬尼安走向他们的未来，但你知道你祖先的殿堂又是纯洁的，一旦时机成熟，就会迎接你。\n你离开了战场，准备回到你的人民身边。这是一个值得庆祝的时刻，吟游诗人会想听到关于这场决斗的一切，以确保你的故事在篝火旁被讲述，直到怒嚎末日。"
 podintroductions.230.a:0 "胜利的味道几乎和麦芽酒一样甜。"
 podintroductions.231.t:0 "迎接你的宿命"
 podintroductions.231.desc:0 "没有人能逃脱他的宿命，布拉达国王，甚至你也不能。正如预言所预言的那样，斯蒂芬妮将在更长的时间内压迫和诅咒你的血脉。当你躺在地上，流血不止时，你知道你并没有全输。面对如此强大的敌人，依然手握利剑而死，者将被你的部族长期铭记，你的血脉可耻的过往将被宽恕。\n也许有一天，你的某个后裔会为你报仇，并最终结束这场争斗。然而在那之前，你最后一次闭上眼睛，希望盖亚会在她的怀抱中欢迎她死去的斗士。"
 podintroductions.231.a:0 "我的死证明我活过。"
 depopulated_fenris_modifier:0 "失去的一代"
 depopulated_fenris_modifier_desc:0 "太多勇敢的芬里尔和他们的兽嫡在对抗奥丁的战争中死去。圣地需要时间来重新恢复狼口。"
 podintroductions.232.t:0 "你的故事就此展开"
 podintroductions.232.desc:0 "伊冯娜女士，在对奥丁的战斗达到巅峰时，你正在英格兰执行任务。虽然勇敢的战士们胜利归来，但代价太高了。太多训练有素的芬里尔和他们忠实的兽嫡在那场战役中死去。事实上，如此之多，以至于你突然成为剩下的酋长中最有可能成为领导的人选。\n你不能大声说出来，但你知道情况很糟糕。到头来损失了整整一代，也没在对抗奥丁的受诅眷族中有什么成果。你将不得不依靠快速的劫掠，直到芬里尔恢复了足够的力量来恢复战争。"
 podintroductions.232.a:0 "我们必须舔舐我们的伤口。"
 podintroductions.233.t:0 "你的故事就此展开"
 podintroductions.233.desc:0 "狡猾的脏玻璃，你的绰号和你的名声源自于你对白十字信徒的大胆突袭和诡计，但先礼后兵的时代正在结束。从东方来了一批新的入侵者，他们与马为伍，把人与狼都踩在脚下。这些是危险的敌人，你能感觉到他们中受诅的吸血鬼的气味。\n你在当地的群落中受到尊重，他们现在期待你带领他们进行更大胆的突袭。然而，这一次，这些将是血腥的突袭，以提醒这些东方人，草原是狼的土地，不属于其他任何人。"
 podintroductions.233.a:0 "我们狩猎。他们死亡。"
 stains_intro_tooltip:0 "每次脏玻璃的军队掠夺一个男爵领，她都会获得额外的声望。"
 podintroductions.234.t:0 "你的故事就此展开"
 podintroductions.234.desc:0 "伊丽莎白女士，夜空的影爵们面临着严峻的形势。最近对可恨的棘秘魑的攻击并不成功，只有他们对睿魔尔的战争分散了他们对你的全部注意。\n附近新的月银牙，认真对待他们作为狼国统治者的职责，已经提议了许多援助。这是一个诱人的提议，但即使考虑这个选项也会让你骄傲的影爵火冒三丈。接受他们的领导，在你的许多部族伙伴眼中是可耻的，但也许这次，骄傲必须退居其次。"
 podintroductions.234.a:0 "我们自豪地独当一面！"
 podintroductions.234.b:0 "一些帮助总是好的。"
 podintroductions.234.c:0 "他们是我们的王。目前而言。"
 podintroductions.235.t:0 "你的故事就此展开"
 podintroductions.235.desc:0 "聪慧的乌普奥特，寂静漫游者再次期待你在他们被迫流亡的过程中领导他们。你是最后一个记得旧埃及的人，他们希望有一天你会带领他们回到你的故乡。\n诚然，你是独一无二的。作为荷鲁斯最早的支持者之一，你被赋予了生命神咒，并差点成为木乃伊，但你们部族的守护灵——猫头鹰介入了。在他的祝福下，你现在是……别的东西：永生，部分木乃伊，但也是完整的狼人。利用这一可观的好处，帮助你被困的人民最终再次找到目标。"
 podintroductions.235.a:0 "我是世界之间的桥梁。"
 wepauwet_intro_tooltip:0 "作为乌普奥特，你是永生的，且可以在保留了所有狼人能力的情况下获取一些木乃伊能力。"
 podintroductions.236.t:0 "你的故事就此展开"
 podintroductions.236.desc:0 "睿智的尚卡尔，你作为一个受人尊敬的导师领导星占已经有一段时间了，希望在未来的日子里也能如此。\n在这些时间里，你结识了你的陌生邻居，吸血鬼米拉日巴，一个神秘但睿智的家伙，似乎非常喜欢与你们的人谈论许多灵性话题。自从他在一个世纪前帮助保护圣地对抗可怕的节点爬虫后，他就成为了你们的朋友。吸血鬼和狼人之间的友谊几乎是闻所未闻的，但你们仍然珍惜它。这样一位古老而博学的生物并不经常出现，你仍然很想希望了解他和他对世界的看法。"
 podintroductions.236.a:0 "我是世界之间的桥梁。"
 chakal_intro_tooltip:0 "只要你和米拉日巴仍然是最好的朋友，他就会定期过来与你交谈，提供一些恩惠。"
 podintroductions.237.t:0 "老朋友"
 podintroductions.237.desc:0 "米拉日巴最近从他的山中庇护所来到你的宫廷，希望在你的人民中度过一些时间并与他们交谈。虽然许多人对一个吸血鬼出现在这个神圣的地方仍有戒心，但你知道米拉日巴是无害的，所以你第一个迎接他，并询问他目前的前景，以此来表明你的态度。"
 podintroductions.237.a:0 "一本旧书？说说。"
 podintroductions.237.b:0 "诸灵？我们知道关于它们的一两件事。"
 podintroductions.237.c:0 "盖亚心法？该从哪开始说……"
 tvarivich_twins_modifier:0 "命运双子"
 tvarivich_twins_modifier_desc:0 "特瓦里维奇双子有很多事情要做。只要他们在一起，他们就是不可阻挡的。"
 podintroductions.238.t:0 "你的故事就此展开"
 podintroductions.238.desc:0 "大胆的尤里，你是银牙的合法国王，因此，也是狼国的国王。尽管你已经有过伟大的冒险和许多名声，但仍有人对这一事实提出异议。你将证明他们是错的。\n为了这一努力，你可以继续得到你的孪生姐妹索菲亚的不朽支持。你们已经多次证明，你们在一起可以完成几乎所有的事情。靠着她，就像她会靠着你一样，去将银牙带到更高的高度！"
 podintroductions.238.a:0 "妹妹，我们将取得胜利！"
 yuri_intro_tooltip:0 "只要你和索菲亚还活着，你就会享受一个强大的修正。如果你们中的一个人死了，另一个人将遭受负面的后果。"
 PODcanon_chars.61.t:0 "你的小世界的终末"
 PODcanon_chars.61.desc:0 "索菲亚已经死了。看来，命运不等人，即使是传说中的特瓦里维奇双子。很久以前，在更幸福的时光，你们向对方承诺，你们将尽可能地同年同月同日死，因为否则继续下去有什么意义？但你是银牙的国王，你甚至可能没有奢望履行这个承诺，因为你有很多职责。\n如果索菲亚在再次见到你之前不得不多等一会儿，也许她会理解，但没有她你真的能继续下去吗？"
 PODcanon_chars.61.a:0 "姐姐，再等一等。"
 PODcanon_chars.61.b:0 "我有一个承诺要履行。"
 podintroductions.239.t:0 "你的故事就此展开"
 podintroductions.239.desc:0 "伊萨博女士，你通过袭击将最后的统治者困在勒索网中实现了光誓族群的控制。\n这种无情的手段一次又一次地让你得手，特别是在夺取你贵族家族在法兰西的的土地时。由于你在十字军国家根深蒂固，这些地产现在没有什么用处，但你可以用这些小头衔来换取一些快钱。毕竟，根据你的经验，如果勒索不足以获得你想要的东西，那么金钱通常就能。"
 podintroductions.239.a:0 "收获时间到。"
 isabeau_intro_tooltip:0 "作为伊萨博，你获得出售头衔决议。它的威望花费将减少。"
 podintroductions.240.t:0 "你的故事就此展开"
 podintroductions.240.desc:0 "虫修女，妖蛆在呼唤你，它总是这样。他们都认为你疯了，包括你哥哥（不过他已经死了，所以显然是他疯了），但你知道真相：妖蛆关爱着你。\n这就是为什么祂引导你到这里来帮助它最强大的仆人之一——某个鬼婆。它现在很高兴地告诉你，你可能想把自己交给它的三头之一，为你的神圣使命做号充分准备。虫有很多头，大家都知道。你只需选一个。\n你并不像你哥哥那样是个白痴。"
 podintroductions.240.a:0 "像战争之兽一样咆哮！"
 podintroductions.240.b:0 "吞魂听起来很有意思"
 podintroductions.240.c:0 "我是伟大的欺诈者！"
 podintroductions.240.d:0 "妖蛆就喜欢我现在这样！"
 podintroductions.241.t:0 "你的故事就此展开"
 podintroductions.241.desc:0 "无畏的阿迪萨，你战斗到了最后一刻，芙蕾雅被你打动，让你获得了复仇的机会。但现在这个问题已经解决了，还有新的紧迫问题。\n在你的每一次旅程中，你都看到过俯首的女人，她们的女性精神被暴君——就像那个该死的阿里曼——的意志所奴役。她们需要一位斗士，一位能将她们提升到她们能达到的不可思议的高度的人。这人只能是你。\n现在是时候让你神圣的母亲再次感到自豪了。"
 podintroductions.241.a:0 "觉醒吧，芙蕾雅的女武神！"
 adisa_intro_tooltip:0 "作为阿迪萨，你只能[Embrace|E]女性。你的子嗣会获得专属教育事件。"
 horus_first_modifier:0 "荷鲁斯，第一木乃伊"
 horus_first_modifier_desc:0 "荷鲁斯被他的母亲伊西斯亲自制成木乃伊。因此，他比其他不死者保留了更多的原始力量。"
 podintroductions.242.t:0 "你的故事就此展开"
 podintroductions.242.desc:0 "无上的瓦沙克，你精心设计的一个计划很快就要实现了。\n你早就预见到了你在戈尔康达的耆那教正在衰弱，因此决定将你的精华分割成许多较小的宝物，然后让你的信徒将它们散布到世界各地。其中一件耳环，已经找到了一位够格的主人。一个名叫维奥丽卡的强大的睿魔尔女巫已经跟着你的调子跳了一段时间，在遥远的欧洲传播着你的荣耀。这一直是一个有趣的乐子，但现在你正在准备你的下一步行动，你面临着一个选择。\n你想把维奥丽卡引到印度，用耳环把她完全腐蚀成一位潜在的有用的仆人？或者你想促使她为你的荣耀牺牲自己，在这个过程中为你的宝物注入更多的力量？"
 podintroductions.242.a:0 "来见我，魔女！"
 podintroductions.242.b:0 "我的宝贝必须回归！"
 vassago_intro_tt:0 "作为瓦沙克，注意你的灵魂与名为”瓦沙克的宿匣“的宝物共存。不要让它被毁坏或被偷！"
 artifact_monthly_lifestyle_xp_2_modifier:0 "每月[lifestyle|E]的经验值"
 podintroductions.243.t:0 "你的故事就此展开"
 podintroductions.243.desc:0 "怪诞的欧若博司，你不可能在一个更好的时代醒来。\n凡人受困于饥荒，被保守的教会剥夺了他们应有的欲望。你的责任，不，是你的愉悦！把他们从枷锁中解放出来，让他们沉溺于每一个他们遗憾地压抑的黑暗欲望。\n然而现在你还很虚弱，可能需要你最喜欢的宠物的帮助来巩固你的地位。你总是喜欢那些在你闻名的壮观盛宴之后四处都是的害虫。这些暴食的小信徒可能不会给你带来真正的力量，但人多就有力量……"
 podintroductions.243.a:0 "我们一起过了一段多么快乐的时光啊！"
 orobas_intro_tt:0 "作为欧若博司，注意你的灵魂与名为”欧若博司雕像“的宝物共存。不要让它被毁坏或被偷！\n你解锁了数项动物兵士。"
 babayaga_bound_bezariel_modifier:0 "缚于芭芭雅嘎"
 babayaga_bound_bezariel_modifier_desc:0 "鬼婆封印了你真正的力量以保持对你的控制，但她在你身边的轻微痕迹使你显得更加可怕。"
 podintroductions.244.t:0 "你的故事就此展开"
 podintroductions.244.desc:0 "完美的贝撒列尔，到目前为止，你在凡俗位面的回归是一件困难的事情。\n你被称为芭芭雅嘎的强大吸血鬼召唤和束缚，她打算将你作为她军队中的一名将军。虽然你很感激她帮助你逃离深渊监狱和提供的权位，但你知道命运不等人，即使是像鬼婆这样强大的存在，有一天晚上也不得不面对她的命运。你要为这种情况的发生做好准备，并在这期间创建你自己的基地。\n你总是注定要做伟大的事情，甚至路西法如果看到你潜力的真正程度也会停步。作为曾经的命运天使，现在是再造你自己的时候了，让天堂和地狱都为之颤抖吧！"
 podintroductions.244.a:0 "我将比鬼婆、路西法甚至是上帝本人都要长久！"
 bezariel_intro_tt:0 "作为瓦沙克，注意你的灵魂与名为”仪式匕首“的宝物共存。不要让它被毁坏或被偷！\n你有着专属决议，允许你重新考虑你对芭芭雅嘎的忠诚。"
 bezariel_decision:0 "血天使的扬升"
 bezariel_decision_tooltip:1 "鬼婆是一位有用的盟友，但……"
 bezariel_decision_desc:0 "芭芭雅嘎为了她自己的目的而召唤你。但如果你不顾她的枷锁而壮大自己的力量，你可以“重新谈判”你的协议……"
 bezariel_decision_effect_tooltip:1 "你将重新考虑你与鬼婆的合作关系。"
 bezariel_decision_confirm:0 "探望祖母……"
 PODcanon_chars.62.t:0 "血与铁"
 PODcanon_chars.62.desc:0 "铁之鬼婆，芭芭雅嘎，在将你从深渊监狱中解救出来的过程中起到了重要作用。在某种程度上，你欠她你的自由，但她也足够谨慎，对你能真正驾驭多少天使的力量施加了一些限制。\n尽管有这个缺点，你已经成功地增长了力量，并获得了影幕中——祖母本人之下——的最终权位。这可能是一个完美的机会，让你重新谈判之前的协议条款，使之对你有利……"
 PODcanon_chars.62.a:0 "我们仍可以共同合作……"
 PODcanon_chars.62.b:0 "我不向任何人屈膝！"
 bezariel_loyal_tt:0 "芭芭雅嘎会让你接触到戈里尼奇，这是一群非常强大的腐化巨龙兵士。"
 bezariel_disloyal_tt:0 "所有噩魇之道的角色将会皈依你的信仰。"
 babayaga_allied_bezariel_modifier:0 "铁与血"
 babayaga_allied_bezariel_modifier_desc:0 "血天使与铁之鬼婆形式上的结盟。上帝本人也应该为这一事件的转变而停步。"
 bezariel_unleashed_modifier:0 "血之扬升"
 bezariel_unleashed_modifier_desc:0 "没有任何监狱能够可以囚禁他。没有任何锁链能够可以遏制他。他的扬升已经开始。"
 ares_war_modifier:0 "战神"
 ares_war_modifier_desc:0 "战神鄙视这时代所谓的士兵，他们不过是农民而已。他只配为那些真正致力于战争的人服务！"
 podintroductions.245.t:0 "你的故事就此展开"
 podintroductions.245.desc:0 "愤怒的阿瑞斯，你已经从你在光荣的古希腊的鼎盛时期跌落得很低。\n你不再被希腊勇敢的希腊重装步兵和罗马不可阻挡的军团当作神来崇拜了。你的力量已经大大削弱，因为现在战争是由弱小的农兵构成的，他们向基督教的上帝而不是你本人致敬。不过，你的故事还没有结束。在这个世界上仍然有真正的战士，包括一些适当尊重战神的人，他们有许多形式。这可能不多，但它足以让你重新点燃人类对战斗和流血的热爱。\n毕竟，战争永不改变。"
 podintroductions.245.a:0 "和平是一种幻想。"
 podintroductions.246.t:0 "你的故事就此展开"
 podintroductions.246.desc:0 "拉玛什图女士，你从一位次级恶魔到神明霸权的崛起，到目前为止是漫长而艰辛的。\n你对提亚玛特的胜利是一个很好的起点，但你随后努力创造并维持了一个足够强大的密教，以进一步提升地位。波斯人在你的栖息所完全稳固之前就将其摧毁，你被迫沉睡了几个世纪。一次偶然的相遇唤醒了你，你仍然可以感受到你在第一次失败时在现在被称为亚柯的城市中失去的力量的回声。如果你能恢复对它的控制，你就能最终完成这个重要的仪式。这是你走向最终胜利的重要第一步。"
 podintroductions.246.a:0 "我已存续，现在我将胜利！"
 lamashtu_intro_tt:0 "作为拉玛什图，注意你的灵魂与名为”拉玛什图之心“的宝物共存。不要让它被毁坏或被偷！\n你有着专属决议，允许在取回亚柯后升级该宝物。"
 gabriel_trumpet_modifier:0 "圣约的诅咒"
 lamashtu_decision:0 "完善圣约"
 lamashtu_decision_tooltip:1 "处理未完成的事务。"
 lamashtu_decision_desc:0 "在波斯人的袭击之前，你的宿匣几乎已经完成。如果你收复亚柯，它的游荡力量将再次成为它的一部分。"
 lamashtu_decision_confirm:0 "我的心又一次完整了！"
 podintroductions.247.t:0 "你的故事就此展开"
 podintroductions.247.desc:0 "无所不吞的玛门，你的权位开始上升了。\n贪婪是一种可以控制的强大情感，你曾经相信没有人可以阻止你。然而，当早期的基督徒到来时，你被证明是错误的。利用对贫穷和虔诚的生活的宣扬，他们大大削弱了你的密教，直到最后让你沉眠。\n因此，当你的苏醒是由于这些同样的基督徒，现在终于像所有人一样欣赏奢侈品和黄金时，这对你来说是相当令魔高兴的。然而，你仍在恢复中，你会很明智地慢慢建立你的权力基础，一次一位新信徒。每个生命都渴望得到比他们所拥有的更多的东西，而你会很乐意提供……以那么一丁点的代价。"
 podintroductions.247.a:0 "你真正渴望什么？"
 mammon_intro_tt:0 "作为玛门，你的“赠送礼物”[character_interaction|E]有机会给目标带来“贪婪”特质，为腐化提供更多可能性。"
 podintroductions.248.t:0 "你的故事就此展开"
 podintroductions.248.desc:0 "明智的尼卡努拉努，你从深渊监狱突然逃出是最出人意料的，对是你自己也是。\n也许上帝怜悯你了？他没有回答，但你发现自己被束缚在匈牙利这片被战争蹂躏的土地上的一个不起眼的城堡——胡内多阿拉。除了等待审判日，你没有什么野心，但你不是傻瓜。如果你不尽快找到信徒资源，你将被拉回可怕的监狱。幸运的是，你有一个想法：为那些寻求远离世界的人提供庇护和保护，也许是为了寻找沉思和安静。\n一个契约很快就会形成，而你心中有完美的人选……"
 podintroductions.248.a:0 "隐秘的巢穴打开了……"
 niku_intro_tt:0 "作为拉玛什图，注意你缚于胡内多阿拉城堡即胡尼奥德伯爵领。不要失去它！\n你将有机会契约一些特别的吸血鬼。"
 PODcanon_chars.63.t:0 "契约：战士"
 PODcanon_chars.63.desc:0 "你确定了一群潜在的候选人，或是厌倦了战争，或是被敌人打得遍体鳞伤，或只是在寻找一个喘息的机会，他们愿意签署契约，将他们与胡内多阿拉结合起来。他们将是有用的仆人和训练有素的信徒，以确保你在凡俗位面的持久居留。"
 PODcanon_chars.63.a:0 "欢迎来到你的新家。"
 PODcanon_chars.63.b:0 "他们不行。"
 PODcanon_chars.64.t:0 "契约：学者"
 PODcanon_chars.65.t:0 "契约：贵族"
 PODcanon_chars.66.t:0 "契约：旅行者"
 podintroductions.249.t:0 "波斯的秘密"
 podintroductions.249.desc:0 "密特拉大人，你隐藏着一个很具有破坏性的秘密。你一直声称梵达多是你的[Sire|E]，这是真的，但所有人都认为这个名字是梵卓本人的化名，这不是真的。很久以前，你对一位被遗忘的吸血鬼实施了可怕的[diablerie|E]，这就是你真正成为强大的第四代成员的原因。如果有人发现真相，潜在的危机将是巨大的。\n幸运的是，这[diablerie|E]是如此之久，以至于大部分证据都被时间掩埋了。不过，一些痕迹还是可能被好奇的对手发现，你正在考虑在太晚之前摆脱任何可能导致他们发现这一罪行的东西。"
 podintroductions.249.a:0 "他们决不能知道这一点。"
 podintroductions.249.b:0 "我的秘密已经够隐蔽了。"
 PODcanon_chars.67.t:0 "下一步"
 PODcanon_chars.67.desc:0 "刻茉媞里女士，随着你死敌的信徒被解决，你现在可以自由地重新考虑你过往的麻烦了。赛特因为你对生命神咒——伊西斯的强大魔法，使她能够为对抗她的弟弟而创造木乃伊——的了解而折磨你。在这些黑暗的夜晚，你坚定地站在那里，从未讲出你的秘密。遗憾的是，你的心灵被这一事件打碎了，你只记得这艰难仪式的片段。\n随着赛特信徒被打败，你的心态也更加平和，你现在可以尝试找到一种方法来回忆生命神咒。无论怎样，创造木乃伊的知识将是你未来功业的强大资产。"
 PODcanon_chars.67.a:0 "我的心灵终于得到治愈。"
 kemintiri_phasetwo_tt:0 "你获得一项专属决议。"
 kemintiri_second_decision:0 "生之回忆"
 kemintiri_second_decision_tooltip:1 "你知道你的内心深处有一个最重要的秘密。你只需回忆。"
 kemintiri_second_decision_desc:0 "为了保护伊西斯的生命神咒，你承受了很多。如果你最终能清楚地回忆它，你就能再次创造出传说中的木乃伊。"
 kemintiri_second_decision_confirm:0 "我无愧于伊西斯的传承。"
 kemintiri_second_decision_custom:0 "[TARGET_CHARACTER.GetFirstName]知道生命神咒。如果你能向他展示你对伊西斯的虔诚，他可能会帮忙。\n该角色必须是你的朋友或灵魂伴侣。"
 kemintiri_second_decision_effect_tooltip:0 "你将能够对凡人使用[character_interaction|E]，使他们成为你的信徒，又称奈特鲁。\n你将获得对奈特鲁使用生命神咒[character_interaction|E]，使你能够将他们变成木乃伊。"
 PODcanon_chars.68.t:0 "伊西斯之女"
 PODcanon_chars.68.desc:0 "刻茉媞里女士，这么多年后你终于想起了一切。你对神圣的奥西里斯的功业的奉献。伊西斯教你生命神咒时的美丽微笑。与大敌的永恒战争。赛特为了从你身上套出他所渴望的秘密而经历的几个世纪的折磨。\n但你也记得最痛苦的事，明白那时没有人能够拯救你。荷鲁斯和他的信徒们已经忘记了你，或者更糟的是，认为你是自愿加入赛特的。你记得他们讲述的关于你的故事，你是如何不可救药，你一些最老的朋友甚至何时毁灭你而与荷鲁斯争论。\n从那时起，你第一次记得足以做出一个可能改变你永恒亡生的选择。宽恕从来不是你的强项，但也许你能学会。"
 PODcanon_chars.68.a:0 "我终于回家了，伊西斯。"
 PODcanon_chars.68.b:0 "他们将付出代价！"
 kemintiri_no_redemption_tt:0 "你将能够对凡人使用[character_interaction|E]，使他们成为你的信徒，又称奈特鲁。\n你将获得对奈特鲁使用生命神咒[character_interaction|E]，使你能够将他们变成木乃伊。\n你只需要2500而非10000虔诚来制造木乃伊。"
 PODcanon_chars.69.t:0 "我来，我看见，我征服！"
 PODcanon_chars.69.desc:0 "永恒执政救恩！\n您在意大利政坛的胜利回归正如许多人所期待的那样，打破了传统。您再一次向梵卓氏族证明，只有在欣赏亡生中的美好事物，呵护永恒灵魂的同时，才能找到真正的统治之路。\n一些梵卓希望您能凯旋而归，因为这意味着您的氏族将重回辉煌的罗马时代。但也有很多人悄悄地希望你失败，然后把失败归咎于你的享乐主义，把梵卓氏族搅入单调而严苛的未来。事实证明这些蠢人错了，虽然在永恒罗马重振雄风之前还有很多工作要做，但第一步已经迈出。"
 PODcanon_chars.69.a:0 "罗马和我一样永恒。"
 PODcanon_chars.70.t:0 "长嗣"
 PODcanon_chars.70.desc:0 "海伦女士，在亡生中你[Embrace|E]了些子嗣。随着对抗墨涅拉俄斯的战争再次激烈，是时候重审他们潜在的用处了。\n伊莱特丽雅是你的长嗣，你的挚爱帕里斯所怜悯的斯巴达艺术家，促使你拯救她免于险恶的结局。坦白说，伊莱特丽雅是没有骨气的胆小鬼，强迫她回来你身边十分简单，毕竟她不敢反抗。她不是你见过最优秀的血族，但还是有些用处，反正也不对你构成任何威胁。"
 PODcanon_chars.70.a:0 "该回来了，不然的话……"
 PODcanon_chars.70.b:0 "我的王廷不需要怯懦的蠢货。"
 PODcanon_chars.71.t:0 "次嗣"
 PODcanon_chars.71.desc:0 "残酷偏狭的贵族菲利普·伏尔杰是你的次嗣。遗憾的是由于他对自己血液的改变你无法触及他，也许之后需要调查下。玛利亚是你的三嗣，但她逃得太远，找她也许是不值得的事。\n接下来就是梅琳达·加尔布雷思，你的骄傲与喜悦。\n你将梅琳达塑造成冷酷无情且野心勃勃的生物，挡在她道路上的一切都将被践踏。在你训练她时，她也没像你其他子嗣那样崩溃，而是对你恨之入骨，一找到机会便逃离……但显然逃得还不够远。在许多方面，她都让你想起自己，经历过的艰苦血族教育，还有对自己[Sire|E]米诺斯的仇恨。\n你可以强迫梅琳达“回家”，毕竟她太幼小无法抵抗。不过她的意志总是如此坚定，可以确定的是，如果你这么做，她会更恨你……但也许你愿意付出如此代价，让你的浪子再次回到你身边。"
 PODcanon_chars.71.a:0 "你迟早会学会爱我的。"
 PODcanon_chars.71.b:0 "……我可不想要像米诺斯那样的下场。"
 PODcanon_chars.72.t:0 "幼嗣"
 PODcanon_chars.72.desc:0 "纪尧姆·德·洛里斯不久之前是法兰西的著名诗人。他的名气甚至使全爱之皇庭上下都争先恐后地争取初拥他的荣幸，用上复杂规则与密谋手段来确保对他的宣称。而后你半路杀出，在没有他们的（和他的）同意下初拥他，只因为你觉得他们的表情会很有趣。\n你很快对纪尧姆厌倦，于是留他在法兰西自生自灭，差不多是逼他深陷自我厌恶和绝望的短暂亡生。然而，在你与他相处的短暂时间里，你在他身上看到了一些东西，一些更深刻、更黑暗的野心和才能的火花，也许可以被导引出来并磨练成强大的武器。强迫这位破碎的诗人到你身边并对他用些心力，看看他最终会到达何处，这是否为值得的事？"
 PODcanon_chars.72.a:0 "我会密切关注他的诗人事业。"
 PODcanon_chars.72.b:0 "他那时候很有趣，不过也就这样。"
 helena_villon_tt:0 "如果纪尧姆·德·洛里斯留在你的宫廷，或是作为你的封臣，在三年后，他的个性会改变，他的能力将提升。"
 PODcanon_chars.73.t:0 "重生的诗人"
 PODcanon_chars.73.desc:0 "你已经栽培你从纪尧姆·德·洛里斯身上看到的异样潜能三年了，你很欣慰地注意到他个性的“改善”。在你的教导下，曾经绝望的诗人已经学会享受亡生的精致事物，他现在是你王廷的宝贵资产，之前他几乎没参与其中。\n你对他潜力的评估似乎是正确的。从某种角度来说也许太过了，纪尧姆现在表现出的野心与无情是他前所未有的。\n你必须确保对他的严加管束。"
 PODcanon_chars.73.a:0 "你已经变得有用，可别变成威胁了。"
 PODcanon_chars.74.t:0 "阿莱克修斯传"
 PODcanon_chars.74.desc:0 "尊贵的安娜，你从未能掌握住拜占庭的皇位，也不被凡人所铭记为本应该成为的巴塞丽莎。但是你还是完成了巨作阿莱克修斯传——对你时代的拜占庭政治的生动纪录，如果你对自己诚实的话，其中不乏个人偏见。由于你非比凡俗的写作风格与神秘的君士坦丁堡的内部活动描述，此书很快成为受人敬重的文本。\n随着你深爱的城市现今沦于拉丁野蛮人之手，阿莱克修斯传便成为美好岁月的遗迹。至少此书能让你专注于你的目标，为希腊人夺回该城并写下你自己的历史，这一次，是写给夜晚的统治者们。"
 PODcanon_chars.74.a:0 "父亲，我会使你自豪的。"
 podintroductions.250.desc:0 "Lady Thrax, the Gnostic theological gospel saved you from despair and you ache seeing the mortals Cathars burning in France but you have more pressing matters to attend to.\nRome is the head of the Ventrue snake and you were very successful in weakening it until Camilla awakened. In a puzzling move, the Eternal Consul declared your attacks \"great sport\" and named you Praetor Urbanus of the city. Maybe the powerful Ventrue has an hidden agenda or he is simply as carefree at he seems.\nIn any case, your path is clear. You must defang Camilla in one way or another, claim Rome for yourself and rebuild [Clan|E] Brujah from there, cleansed from its old sins."
 podintroductions.250.a:0 "A perfected Clan Brujah awaits!"
 thrax_intro_tt:0 "As Thrax, you have access to an unique objective to guide the Brujah towards your goal."
 thrax_decision:0 "Perfected Brujah"
 thrax_decision_tooltip:1 "Now is the time to guide the Brujah to a new age."
 thrax_decision_desc:0 "Tame Rome and its Eternal Consul and the Brujah will flock to your banner."
 thrax_decision_confirm:0 "A new utopia!"
 thrax_decision_custom:0 "Camilla must be dead, in torpor or your vassal."
 thrax_decision_effect_tooltip:0 "Clan Brujah will gain renown and many of its members will convert to Via Pura."
 PODcanon_chars.75.desc:0 "Exalted lady, you did it. Rome is incontestably yours, the Ventrue's yoke over the Brujah's spirit has been finally cast aside after centuries of hardship. Your clansmates from all over the world look to your victory with awe and debate fiercely at the merit of your so far niche ideology of Gnosticism. After Carthage's fall, the Brujah were looking desperately for a new utopia to cling to from the Constantinople Dream to the Menelean Entelechian but, in the end, it seems you prevailed over them all.\nYour undeniable success will pave the way for the future of your clan. Stand tall in your convictions and forge on and you will be remembered as the second coming of Troile!"
 PODcanon_chars.75.a:0 "A new road ahead."
 thrax_conversion_tt:0 "Non zealous Brujah have a high chance of converting to Via Pura."
 podintroductions.251.desc:0 "Wise Caelestius, your time is now! In life, you have been denied the recognition that should have been yours with your work on the so called \"Pelagian Heresy\". Those simple minded fools won't stop you again now that you have immortality on your side.\nYou have merged your Pelagian theories with your new Cainite condition to form a perfect understanding of Christianity and Noddism. You only lack the Papal blessing to make sure the world finally acknowledge your genius.\nSo far, those Italian vampires simpletons barred your way to the Holy See every time you tried, talking about narrow minded concepts such as the \"Masquerade\" or \"This is just a terrible idea\" but you have not given up. You will see the Pope and then the name of Caelestius will go down in history!"
 podintroductions.251.a:0 "Rome awaits!"
 podintroductions.252.desc:0 "Wise Constancia, you have recently returned from your successful journey to Egypt where you managed to thwart the mad Lazarus' plans. Still, he was just one part of the many issues that plague [Clan|E] Cappadocian. With Japhet busy trying to curtail your fickle grand-sire, it falls on you to act.\nThe Giovanni are the most pressing concern and needs to be curtailed before they get any ideas. The Lamia are outwardly loyal but their strange Lilith worship needs careful watching. Finally Lazarus has been stopped but he still lives, some of his cronies will likely try to awaken him which must not come to pass.\nClan Cappadocian's future hangs on your actions lady Constancia. Don't let the dark prophecies you experienced come to pass."
 podintroductions.252.a:0 "The future can change."
 constancia_intro_tt:0 "As Constancia, you have an unique decision to unify clan Cappadocian."
 united_cappadocians_modifier:0 "United Cappadocians"
 united_cappadocians_modifier_desc:0 "For the first time in history, the clan of death is truly united in thoughts and purpose."
 constancia_decision:0 "Mending the Cappadocians"
 constancia_decision_tooltip:1 "You have to act before the prophecies come true."
 constancia_decision_desc:0 "Various internal forces are trying to tear the Cappadocians apart. You are the only one that can act to stop them."
 constancia_decision_confirm:0 "The prophecies won't come to pass."
 constancia_decision_custom:0 "Lamia must be dead, in torpor, your vassal or the Erciyes' vassal."
 constancia_decision_custom2:0 "Angelique, Lazarus' main lieutenant, must be dead or in torpor."
 constancia_decision_custom3:0 "Lazarus must be dead or in torpor."
 constancia_decision_custom4:0 "The Giovanni Family title must not exist."
 lucretia_reckless_modifier:0 "Reckless Lucretia"
 lucretia_reckless_modifier_desc:0 "Without always noticing it, Lucretia takes way more risks than she should in all of her endeavors."
 podintroductions.253.desc:0 "Fearless Lucretia, you have been welcomed into the vampiric side of the Giovanni family with open arms thanks to your strong connection to the realm of the dead. Sadly what they do not realize is that this link has been a terrible burden to you for a long time to a point where you feel careless about your life, ready to throw it away on a whim.\nLuckily your [Sire|E] has kept you busy with many interesting occult tasks, perhaps understanding that making sure your mind is always occupied might be the best way to help you endure your fate. Perhaps this is the key, if you could find a purpose interesting enough to focus your energy on, the voices would finally get quieter."
 podintroductions.253.a:0 "I will find a way."
 lucretia_intro_tt:0 "As Lucretia, you start with a negative modifier that can be improved via an unique decision."
 lucretia_appeased_modifier:0 "Appeased Lucretia"
 lucretia_appeased_modifier_desc:0 "On the outside, Lucretia seems to be as daring as ever. On the inside however, she is now valuing her unlife as critical in continuing her newfound purpose."
 lucretia_decision:0 "The Reckless Prodigy"
 lucretia_decision_tooltip:1 "What is the value of your own life?"
 lucretia_decision_desc:0 "Ambrogino saw potential in you and helped you foster it. Maybe finding a higher purpose is the key to your predicament."
 lucretia_decision_confirm:0 "My mind is focused."
 lucretia_decision_custom:0 "One of the following must be true : \n - You have a Kingdom title \n - Your sire, Ambrogino Giovanni, has the Giovanni Family title \n - Your learning skill is superior or equal to 25"
 podintroductions.254.desc:0 "Lord Guilelmo, you find yourself in what should be an enviable position : Prince of the powerful city of Venice and respected bishop of the Church of Caine. But the reality is far more troubling.\nYour coup (and subsequent lack of interest in administering) has left Venice easy prey for the greedy Giovanni family who, for all intents and purposes, now control the Republic's territory except the city itself. They might want to go for the (and your) throat soon.\nWorse, the new archbishop of the Church of Caine, Nikita of Sredetz, has proven to be a threat to the See of Nod itself, apparently committed in making the worst decisions possible. You are currently mounting a case against him to present in front of the See... but all those efforts would be in vain if you lost Venice beforehand."
 podintroductions.254.a:0 "I'm walking a tightrope."
 guilelmo_intro_tt:0 "As Guilelmo, you have an unique decision requiring you to hold Venice for the next 20 years. If you do, you will inherit what's left of the See of Nod at this point."
 guilelmo_decision:0 "Saving the Church and Yourself"
 guilelmo_decision_tooltip:1 "Saving the Children of Caine's souls first require saving yourself."
 guilelmo_decision_desc:0 "You are almost finished with your case on Nikita of Sredetz. If you can just hold your position for a little longer, the See of Nod will be yours."
 guilelmo_decision_confirm:0 "You stand accused!"
 guilelmo_custom_decision:0 "This decision is available after the 1st of January 1250."
 podintroductions.255.desc:0 "Lady Fatima, your unlife has been serene so far. Your [Sire|E] was a patient mentor and [Clan|E] Lasombra quickly recognized your potential. But with this great upbringing comes great expectations and the clan has now outlined its first mission for you and it's a difficult one.\nThe Lasombra have always claimed Mogadishu as their city despite never really controlling it. Many neonates (or even more experimented vampires) were sent to the \"city of pearls\" to tame it but none of them were able to navigate the complex political situation there.\nFrankly, none of them ever made it back.\nYou are not just another Lasombra though. You have been groomed for greatness and you will prove your worth here and now!"
 podintroductions.255.a:0 "I will come back victorious."
 fatimaallama_intro_tt:0 "As Fatima, you have a special decision requiring you to fully control Ajuraan. If you achieve it, clan Lasombra will send you great rewards."
 fatima_queen_pearls_modifier:0 "Monarch of Pearled Light"
 fatima_queen_pearls_modifier_desc:0 "The Queen of Mogadishu rules over one of the most prosperous towns in the world, making her entire clan proud in the process."
 fatimaallama_decision:0 "Monarch of Pearled Light"
 fatimaallama_decision_tooltip:1 "You have a mission and you will accomplish it. The eyes of the clan are on you."
 fatimaallama_decision_desc:0 "Mogadishu must be Lasombra's. This is your task and the rewards waiting for you are great. You have been too well prepared to fail."
 fatimaallama_decision_confirm:0 "Shadows over Mogadishu"