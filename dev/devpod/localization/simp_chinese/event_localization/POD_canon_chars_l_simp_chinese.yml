l_simp_chinese:
 PODcanon_chars.1.t: "新的开始"
 PODcanon_chars.1.desc: "终于结束了。那个蠢货，斯巴达的墨涅拉俄斯，已经死了，而你，千百年来第一次，可以随心所欲了。胜利感觉……比你想象的要空虚，因为你突然失去了你亡生中的目标……但你会继续活下去，一如既往。\n这个世界已经忘记了你，甚至连最老的妥芮朵都认为你是个神话。这可能对你有利。现在是时候回到$pod_cainite$政治的世界了，一个你非常熟悉的世界，但有一个明显的优势：没有重要的人真的怀疑你真正的权力。\n这是一种非常有用的资产，你打算尽可能长时间地保留它……"
 PODcanon_chars.1.a: "我的扬升终于可以开始了"
 PODcanon_chars.helena: "你解锁了对外地统治者的新[character_interaction|E]：渗入"
 PODcanon_chars.2.t: "神的觉醒"
 PODcanon_chars.2.desc: "终于完成了。你几乎完成了召唤斯凡特维德降临到自愿宿主的仪式。你迫不及待地想要感受神的力量流淌在你永恒的血管里！\n不过有个小问题，在你的研究过程中，你发现宿主的心智应该会因为斯凡特维德的到来而被抹除掉。很明显，你意志坚强，不会像一些被你击垮的白痴密教徒那样轻易颓败，但是……这仍然令人担忧。\n简单地解读这个仪式已经教会了你很多，可能本身就是一个足够的奖励。\n或者你可以召唤一位神并试着让祂屈从于你的意志。选择权在你手中……也许这是最后一次了。"
 PODcanon_chars.2.a: "究极力量！"
 PODcanon_chars.2.b: "……我感觉不太妙"
 PODcanon_chars.3.t: "神之间的浪漫"
 PODcanon_chars.3.desc: "她回来了。\n伊西斯心爱的女儿再次加入了你的阵营，一股矛盾的情绪又回到了你的身边。你这一次拥有的是激情，虽然转瞬即逝。也许你的故事会更经得起时间的考验，因为现在你们都长大了，希望也更聪明了。\n至少，这将是有趣的，特别是当你的封臣已经在你背后抱怨。刻茉媞里从来都不是他们当中最受欢迎的人物。\n但你不在乎。她回来了，亡生似乎值得再活一段时间，希望是很长一段时间。"
 PODcanon_chars.3.a: "让我们依照我们的想法去重建这片土地"
 PODcanon_chars.mithras: "你解锁了一项限时的大决议"
 PODcanon_chars.4.t: "战争审判"
 PODcanon_chars.4.desc: "你已经谋略了一系列快速而果断的小规模战斗来对付这个反叛的封臣。如果你能取得胜利，你就可以暂时不受叛乱的影响，至少是这个人的。\n不过在发动攻击前最好确定一下成功的概率，如果你输了，后果会比根本不尝试这样的行动更糟糕……"
 PODcanon_chars.4.a: "迈向胜利！"
 PODcanon_chars.4.b: "今夜不是那夜"
 PODcanon_chars.4.effect.success.desc: "胜利将暂时性的崩坏封臣的精神"
 PODcanon_chars.4.success: "胜利！"
 PODcanon_chars.4.critical.failure.effect.desc: "失败将鼓励封臣的叛乱精神"
 PODcanon_chars.4.failure: "失败……"
 PODcanon_chars.5.t: "仰望金字塔"
 PODcanon_chars.5.desc: "现在是时候使用你作为睿魔尔$pod_clan$之主的正当权力，来进行一些老式的封闭政治。既然你站在金字塔的顶端，你就会赢得最后的胜利，问题是你能从中得到什么具体的好处。\n这么多的选择，后果却如此之小！除了显而易见地惹恼你下面的人。不过这其实都无所谓。"
 PODcanon_chars.5.a: "偷走其他人的主意"
 PODcanon_chars.5.b: "让其他人为你的失败负责"
 PODcanon_chars.5.c: "征用氏族金库"
 PODcanon_chars.5.d: "我没心情应对政治"
 PODcanon_chars.6.t: "鹰巢的奖励"
 PODcanon_chars.6.desc: "哈基姆的子嗣的领导人对伊比利亚午夜新月的进展感到高兴。他们向你致以最诚挚的问候和祝贺，同时也向你表示支持，向维齐尔、术士和战士种姓的稚子们表示祝贺。\n你的工作还没有完成，但你身上的压力现在不那么沉重了，看起来他们终于相信你会为$pod_clan$的最大利益着想。甚至有可能让伊比利亚成为一个配得上哈基姆本人的未来重要据点。"
 PODcanon_chars.6.a: "我将是鹰巢十年内的话题人物"
 PODcanon_chars.7.t: "计中计"
 PODcanon_chars.7.desc: "你对这个潜在的敌人有了更多的了解。这对你来说总是一种奇怪的安慰，罗克亲王，因为你喜欢智取你的敌人，让他们落入一个无法陶土的阴谋之网。\n尽管如此，你有时并不只是为了搞阴谋而搞阴谋。你可以利用获得的信息进行进一步的计划！"
 PODcanon_chars.7.a: "对这家伙启用更多的计谋！"
 PODcanon_chars.7.b: "勾心斗角是一种舒缓的消遣……"
 PODcanon_chars.7.c: "让每个人都知道你的阴谋技巧有多厉害！"
 PODcanon_chars.8.t: "兴风作浪"
 PODcanon_chars.8.desc: "蒙塔诺大人，随着意大利大部分地区在你的控制下回归，你向勒森魃$pod_clan$证明了你仍然是一个有效而果断的统治者。显然，要恢复暗影之海在地中海世界的位置还有很多工作要做，但至少，你作为$pod_clan$首领的地位不再有争议。\n你现在可以使用它来宣称对任何任性的勒森魃亲王领的统治权。"
 PODcanon_chars.8.a: "我可以做得更好"
 PODcanon_chars.montano: "你现在在与任何勒森魃统治者的“提议附庸”互动的接受度上有专属增益"
 PODcanon_chars.9.t: "携爱初拥"
 PODcanon_chars.9.desc: "美丽的玛阿特卡拉，当你全身心投入某件事时，你很难被阻挡，但$pod_cainites$是固执的生物。如果你要展示赛特之爱，它将需要你所有会得的说服和诱惑技巧来实现。\n失败的风险总是存在的，这将会让你在赛特无情的眼神中付出相当大的代价……"
 PODcanon_chars.9.a: "赛特的荣耀不能等待"
 PODcanon_chars.9.b: "今夜不是那夜"
 PODcanon_chars.9.effect.success.desc: "胜过意志将使该角色皈依赛特之道"
 PODcanon_chars.9.success: "赞美赛特！"
 PODcanon_chars.9.critical.failure.effect.desc: "失败将使你付出一些代价"
 PODcanon_chars.9.failure: "我输了……"
 PODcanon_chars.10.t: "行于黑螺旋"
 PODcanon_chars.10.desc: "你见过那些“黑旋舞者”，他们的一举一动显得丧心病狂，即使是按照你的松散标准。你受到的痛苦有微小的可能得到解答，但这值得吗？唯一可以肯定的是，一旦你从这个被诅咒的地方回去，你整个人就不会再和之前一样了……"
 PODcanon_chars.10.a: "现在没有回头路了"
 PODcanon_chars.10.b: "这是个非常非常坏的主意"
 PODcanon_chars.petaniqua: "你更有可能从现在回到比起点更糟糕的地方。但也许有一丝希望能做点有价值的事……"
 PODcanon_chars.11.t: "疯于黑螺旋"
 PODcanon_chars.11.desc: "人们认为你已经从黑螺旋中回来了，相较之前并没有任何改变。但你自己更清楚，你未从那里回来，从来没有。而它现在与你同在。\n而这些……你所看到的东西将永远不会离开你的视野。也许整个世界只是它的延伸。或者你只是走得太远，不再去关心。\n你不会想再回到那里。还是说你想？"
 PODcanon_chars.11.a: "再也没有光了"
 PODcanon_chars.12.t: "明于黑螺旋"
 PODcanon_chars.12.desc: "你不记得你在黑螺旋中的大部分旅程，是……也许这是最好的结果。你没有发现隐藏的真相，或肮脏的恐怖。如果你有，你会对他们有一些记忆，对吗？\n不管怎么说，尽管遇到了所谓的挫折，你还是很欣慰地离开了那里。奇怪的是，现在外面的世界似乎很舒适。"
 PODcanon_chars.12.a: "情况本来可能更糟"
 PODcanon_chars.13.t: "黑螺旋之力"
 PODcanon_chars.13.desc: "毫无疑问，黑螺旋是一个究极疯狂的地方。但你的凡生和亡生经历了这么多，这次它并没有击垮你。你克服了恐惧，“它”对你的表现感到满意。\n尽管有这力量的展示，你会承认你很高兴再次加入外面的世界。这一点也不轻松。"
 PODcanon_chars.13.a: "我不容易被吓到"
 PODcanon_chars.14.t: "黑螺旋之礼"
 PODcanon_chars.14.desc: "你找到了他。\n也许是黑螺旋怜悯你，或是被你的奉献精神所打动。又或许这只是一个梦，也就是你那破碎心灵的幻想。但你不关心。\n他现在和你在一起了，一切都会再一次好起来的。"
 PODcanon_chars.14.a: "你注定要成为世界之王"
 PODcanon_chars.petaniqua2: "从现在开始，你没有理由再行于黑螺旋了"
 podintroductions.116.t: "你的故事就此展开"
 podintroductions.116.desc: "哈德施塔特大人，到目前为止，您的政治升迁是非常出色的。从一个被漠视的世系和边境处地起家，您成功地利用凡人的神圣罗马帝国的崛起，将梵卓$pod_clan$从罗马重新集中到德意志。\n不过，旧习难改，您不得不与罗马遗民的领袖茱莉亚·安塔西娅合作，才走到这一步。现在可能是时候“重新谈判”您们的伙伴关系，把这些尘封的古物放到属于它们的博物馆里去。\n您有强大的盟友和忠诚的子嗣，让他们保持亲近并注意他们的处位，历史将由您来书写。"
 podintroductions.116.a: "德意志即是未来"
 podintroductions.hardestadt: "作为哈德施塔特，你有着针对你的子嗣的专属[character_interaction|E]，用以驾驭其等。\n你开局时与茱莉亚·安塔西娅在权力斗争。"
 pressure_on_modifier: "施加压力"
 pressure_on_modifier_desc: "该角色正处于要做到最好的压力之下。"
 PODcanon_chars.15.t: "绷紧缰绳"
 PODcanon_chars.15.desc: "你的子嗣回应了你的召唤，急切地想听到你的诉求。你是出了名的严格的[Glossary('尊长','game_concept_Sire_desc')]，是那种不轻易容忍失败的人。不过，没有人可以否认，你的教育选择造就了他们这一代中最有天赋的稚子。其他人……他们往往没能过久的玷污你的声誉。"
 PODcanon_chars.15.a: "做得更好！"
 PODcanon_chars.15.b: "永不满足"
 PODcanon_chars.15.c: "你是一个毫无价值的失败者！"
 PODcanon_chars.hardestadt_tooltip: "只要该角色一直是仇敌，你就不能再召来其。"
 POD_hardestadt_interaction: "绷紧缰绳"
 POD_hardestadt_interaction_desc: "召集你的子嗣进行谈话"
 podintroductions.117.t: "你的故事就此展开"
 podintroductions.117.desc: "安塔西亚女士，您在您于流放中在德意志的居所中坚强地站立着，但您的心却在为凯旋罗马而隐隐作痛。梵卓$pod_clan$已经从它在永恒元老院的高贵根基上跌落得很远，而您是唯一能阻止哈德施塔特和卡米拉把您心爱的$pod_clan$变成自己的玩物的人。\n虽然这一努力需要时间，但您最近在您的探索中发现了一个令人惊讶的盟友。诺斯费拉图族的安吉瓦是一个奇怪的人，喜欢着幻想故事，但他已经证明是一个值得信赖的朋友，更是一个值得您去争取的人。凭借您们的联合力量，真正理想的罗马仍有希望。"
 podintroductions.117.a: "元老院不会堕落"
 podintroductions.antasia: "作为茱莉亚·安塔西娅，只要你们保持朋友关系，你就可以获得与安吉瓦的专属[character_interaction|E]。\n你开局时与哈德施塔特在权力斗争。"
 POD_antasia_interaction: "友善交谈"
 POD_antasia_interaction_desc: "邀请安吉瓦进行一次愉快的交谈"
 PODcanon_chars.16.t: "说书人安吉瓦"
 PODcanon_chars.16.desc: "当你第一次见到他时，你希望安吉瓦能洞悉你的祖尊，梵卓本人。遗憾的是，事实并非如此，因为即使是像他这么老的家伙，也从未遇到过[Glossary('上古耆宿','game_concept_antediluvian_desc')]。尽管如此，该诺斯费拉图还是有很多关于$pod_cainite$世界的故事，其中一些你甚至很难相信。\n不过安吉瓦并不介意，他只是很高兴与你分享它们。从这样一个古老而古怪的吸血鬼那里获得如此友好的、没有欺骗的洞察力，是一种祝福，你不打算破坏。"
 PODcanon_chars.16.a: "真的吗？太不可思议了！"
 PODcanon_chars.17.t: "自信者安吉瓦"
 PODcanon_chars.17.desc: "安吉瓦今晚很安静，似乎很乐意倾听你的烦恼。在$pod_cainite$世界里，一个人能够向另一个人倾诉而不用担心被欺骗或操纵，这是很罕见的。但你对这个老诺斯费拉图感到放心，知道你们的目标是紧密一致的。对你来说，拥有这种奢侈的生活是不小的祝福，而且每次你和他在一起的时候，年长之倦似乎都不那么旖旎。"
 PODcanon_chars.17.a: "友谊是宝贵的财富"
 PODcanon_chars.18.t: "战士安吉瓦"
 PODcanon_chars.18.desc: "安吉瓦今晚很激动，谈到了他的$pod_clan$所面临的严重威胁：尼克图库。你以前也见过他这样，虽然你对他说的事情一无所知，但你更愿意幽默地对待他。甚至当他突然要求在你们之间进行决斗训练，以便“在他们来的时候做好准备”。你不是每天晚上都能和这样一位经验丰富的战士比试，你肯定能学到一些东西。"
 PODcanon_chars.18.a: "我们将做好准备"
 podintroductions.118.t: "你的故事就此展开"
 podintroductions.118.desc: "亚历山大大人，您曾经是世界上最重要的梵卓，对查理大帝本人耳提面命。现在，您被受诅的萨莉安娜和您的叛徒子嗣若弗鲁瓦从您心爱的法兰西流放了。您会回来的，但有其他事情需要您的关注。\n约根·冯·费尔登大人，您现居处的东道主，已经召集了一支小部队来帮助您，履行他作为年轻同族的职责。接受它将是有帮助的，但也意味着您基本上沦为到为得帮助而乞求。拒绝它更符合您的地位……但无疑会激怒马格德堡的亲王。在这里做出正确的决定，这可能是您凯旋回到整个$pod_cainite$世界的第一块垫脚石。"
 podintroductions.118.a: "感谢帮助，约根大人"
 podintroductions.118.b: "王不求人！"
 alexander_black_cross_event_troops: "黑十字血仆"
 alexander_help_modifier: "人脉通达"
 alexander_help_modifier_desc: "由于有一位强大的引路人的帮助，你在上层圈子中的好评不断。"
 podintroductions.119.t: "你的故事就此展开"
 podintroductions.119.desc: "约根大人，自从您被$pod_Embrace$以来，就一直在以惊人的速度崛起。但最近在与军督领的战争中遭到的小挫折使您的影响力受到了削弱。不过，随着流亡的法兰西亲王亚历山大来到您的宫廷，一个新的机会出现了。\n到目前为止，您一直是个完美的东道主，继续这样做对您的野心有利，因为亚历山大在$pod_clan$中仍有着很大威望。但这位强大的梵卓并非是单独前来的，他还带来了伊斯灵顿的罗莎蒙，这位美之$pod_clan$中最美的倾世佳丽，也是个偷走您心的妙人儿。\n您最近向这位女士表白了您的感情，但似乎亚历山大本人也看上了她。因此，必须要做出选择了……"
 podintroductions.119.a: "爱……"
 podintroductions.119.b: "或力量？"
 jurgen_love_tooltip: "罗莎蒙将加入你的宫廷，将她的地盘托管给你。"
 podintroductions.120.t: "你的故事就此展开"
 podintroductions.120.desc: "赞美伟大的卡米拉，罗马与梵卓$pod_clan$过往的无可争辩的主人！\n在该幸福的时代，所有的人都在您面前俯首称臣。崇魔的迦太基在您的命令下被摧毁，一切都很完美，直到您陷入[Glossary('蛰眠','game_concept_torpor_desc')]。很显然，没有人能够继承您的衣钵，帝国也同您一共衰落。您最近于这个新世界苏醒过来，与您所知道的那个世界如此不同……但仍然充满了机会。\n重申您对您心爱的罗马的控制很容易，但现在更大的挑战在等着您。\n您是原罪永恒执政，您的未来只能是永生的荣耀和颓废的快乐。"
 podintroductions.120.a: "罗马永恒"
 podintroductions.camilla: "作为卡米拉，你在“主办欢会​”活动期间有一项专属的、更有利的、更可能触发的事件。\n你的桂冠能在你完成“原罪之政”决议后升级。"
 POD_elysium_events.25.t: "像罗马人一样狂欢"
 POD_elysium_events.25.desc: "除了是最强大的梵卓之一和精明的政治动物之外，你还被称为所有$pod_cainite$中最好的派对主持人。毕竟，你在罗马帝国时期开创了该整个概念，你完全知道该如何进行。\n血将流淌，而每人都会有一段美妙的时光，由于你的精心策划，使罗马伟大的如此一小部分将在今晚得以延续。"
 POD_elysium_events.25.option.a: "让我们开始狂欢吧！"
 anna_ambition_modifier: "燃烧的野心"
 anna_ambition_modifier_desc: "安娜将不惜一切代价来获得她与生俱来的权利。你可以帮助她或被她撇开，没有中间地带。"
 podintroductions.121.t: "你的故事就此展开"
 podintroductions.121.desc: "尊贵的女士，您来自最伟大的希腊世系，君士坦丁堡应属于您，即使成为吸血鬼也没有改变这个事实。您很好地适应了您的新状态，并在第四次十字军东征发生时迅速地攀升拜占庭阶级。随着米迦勒和幻梦的毁灭，以及拉丁吸血鬼的胜利，您的城市再次离您渐行渐远。\n然而，还没走投无路，因为拉丁人难以巩固他们的地位，这使您能够帮助继任者帝国尼西亚开始运作。在这个强大的权力基础上，您离实现您永恒的野心如此之近……\n继续前进吧，诸皇的女儿，达成您的天命！"
 podintroductions.121.a: "我的世界渴望之城……"
 podintroductions.anna: "你可通过一项要求你守住君士坦丁堡的专属[decision|E]来提升你的初始修正"
 anna_decision: "生于紫室"
 anna_decision_tooltip: "拉丁人的压迫必须被终结"
 anna_decision_desc: "君士坦丁堡必须是你的，这于此时比任何其他都重要。你将把它从受诅的拉丁勒森魃手中解放出来，然后开始你对这个世界上最伟大城市的永恒统治。"
 anna_decision_effect_tooltip: "你将达成你的野心。"
 anna_decision_confirm: "终于！"
 anna_ambition_fulfilled_modifier: "达成野心"
 anna_ambition_fulfilled_modifier_desc: "科穆宁现在是君士坦丁堡的永生和永恒的统治者。如它本该是。"
 podintroductions.122.t: "你的故事就此展开"
 podintroductions.122.desc: "阿娜佳女士，您简单的生活随着贝利撒留和谢巴赫的到来而陷入混乱。这两个吸血鬼对您很有好感，并教给您很多如何在黑夜社会中生存的知识……然后您的生活变得更加奇怪了，一个秘密的末日密教——“黑手”——宣布您是其应许的领导者。\n尽管发生了这些事情，但到目前为止您做得很好，亚美尼亚在您的统治下已经成为一个强大的要塞，吸引了这个密教的成员和来自拜占庭的难民。您的“养父母”还在这里，在帮助稳定您的新领地方面提供了宝贵的帮助，但现在是时候把事情掌握在您自己手中了。\n您得到了最好的指导，许多人已经把您看作是世界上最重要的$pod_cainites$之一，但您的故事是您自己的，只有您自己才能书写。"
 podintroductions.122.a: "我是我自己的$pod_cainite$"
 podintroductions.anadja: "只要谢巴赫与贝利撒留还活着，你就可以通过[decision|E]要求进一步的辅导。"
 anadja_decision: "向最优秀者学习"
 anadja_decision_tooltip: "总有提高的空间。"
 anadja_decision_desc: "谢巴赫与贝利撒留一直乐于帮助你提升，尽管他们的课程有时会相当费力。"
 anadja_decision_effect_tooltip: "训练课程将开始"
 anadja_decision_confirm: "我准备好了"
 anadja_custom_decision: "该[decision|E]将于你取有25军事、20外交和20密谋，又或[GetScriptedCharacterByHistoryID('790015').GetFirstName]与[GetScriptedCharacterByHistoryID('790962').GetFirstName]两者死去时不可用"
 PODcanon_chars.19.t: "向最优秀者学习"
 PODcanon_chars.19.desc: "贝利撒留在凡生中曾经是一位伟大的将军，然后为君士坦丁堡的$pod_cainite$的幻梦处理许多军事事务。从他身上可以学到很多东西。而谢巴赫则是一位间谍和大使专家，常常同时兼任，可以教你这些课题。你今晚要问他们什么？"
 PODcanon_chars.19.a: "告诉我更多关于军事战役的事，贝利撒留"
 PODcanon_chars.19.b: "外交是一项复杂的课题……"
 PODcanon_chars.19.c: "……也许跟密谋一样复杂"
 PODcanon_chars.19.d: "我改变主意了"
 shaky_secrets_modifier: "将泄的秘密"
 shaky_secrets_modifier_desc: "他们知道你在藏着什么，而他们想找出来。"
 shrouded_secrets_modifier: "虚藏的秘密"
 shrouded_secrets_modifier_desc: "你的秘密被一层稀薄的暗影所保护着。"
 darkened_secrets_modifier: "黑暗中的秘密"
 darkened_secrets_modifier_desc: "他们完全不晓得你。也将没有人能会。"
 secrets_secrets_modifier: "秘密中的秘密"
 secrets_secrets_modifier_desc: "棋盘上的棋子，经由你的手操纵。"
 podintroductions.123.t: "你的故事就此展开"
 podintroductions.123.desc: "巴德尔苏丹，您已经掌握了午夜新月的控制权，被逼到角落的[Glossary('阿什拉派','game_concept_ashirra_desc')]正明智地团结在您身后。注意那些不这样做的人，以便日后惩罚。\n您必须尊重基督教的暗影再征服，因为德·鲁伊斯和他的世系都是可怕的对手，但您最紧迫的事情是保密问题。\n您对您的新“忠诚”的追随者隐藏了很多东西，尽管他们坚持，但您不希望他们发现这些东西。利用您对阴影和阴谋的掌握，在为时已晚之前将自己隐藏在坚不可摧的神秘面纱后面。只有这样，您才能将基督教徒从伊比利亚连根拔起。"
 podintroductions.123.a: "真理由我塑造"
 podintroductions.badr: "到1300年之前，你可以使用一项专属决议，来提升你的初始修正。"
 badr_decision: "巴德尔的秘法"
 badr_decision_tooltip: "他们决不能知道。"
 badr_decision_desc: "作为午夜新月的新统治者，所有的目光都投向了你。你必须在为时已晚之前好好隐藏自己。"
 badr_decision_decision_effect_tooltip: "辛秘深藏。"
 badr_decision_confirm: "他们决不会知道"
 podintroductions.124.t: "你的故事就此展开"
 podintroductions.124.desc: "虔诚的苏莱曼，[Glossary('阿什拉派','game_concept_ashirra_desc')]信徒们的日子不好过了。卑鄙的基督徒勒森魃已经向您的人民宣战，使伊比利亚和马格里布陷入混乱。此外家边也有麻烦了。您曾经的朋友哈立德在美索不达米亚集结了军队，因为他与您在干涉或不干涉凡人事务上发生了激烈的分歧。您自己的子嗣，哈罗恩·拉伊尔，在他的异端教义被揭露后，也提出了独立的要求。\n您必须采取行动，苏莱曼。现在[Glossary('阿什拉派','game_concept_ashirra_desc')]比以往任何时候都更需要团结，也许需要做出让步来实现这一目标。尽管强硬的立场也是一种可能……"
 podintroductions.124.a: "绝不妥协"
 podintroductions.124.b: "哈立德，我们有更大的威胁得对付！"
 podintroductions.124.c: "哈罗恩，我们可以多谈谈你的理论……"
 podintroductions.125.t: "你的故事就此展开"
 podintroductions.125.desc: "无畏的露西塔，在因为是女人而在凡人世界困扰之后，您现在又因为是勒森魃而在不死族世界困扰。这不能再继续下去了。您是一个自由的灵魂，渴望独立，您不会等待成为长者所需的几个世纪来实现它。\n您的第一个目标应该是您自己的[Glossary('尊长','game_concept_Sire_desc')]，安布罗西奥·路易斯·蒙卡达。尽管您至今仍享受着他的保护，并且用他的名义来达成自己的目的，但显然他将你视为己有的行为在将来会是个麻烦。然后，勒森魃$pod_clan$本身必须明白，您不是他们的“新星”，您是属于您自己的女人，这些腐朽的白痴将学会尊重您。\n被您的$pod_clan$内战吞噬的伊比利亚的混乱局面，将是您为自己争取伟大地位的绝佳机会。您只需要好好利用它就可以了。"
 podintroductions.125.a: "不自由毋宁死"
 podintroductions.lucita: "作为露西塔，你可以通过达成你的专属决议，来提高你的起始修正"
 caged_lucita_modifier: "笼中的露西塔"
 caged_lucita_modifier_desc: "你还不是你自己故事的主人公，这让你愤怒不已。"
 unleashed_lucita_modifier: "受释的露西塔"
 unleashed_lucita_modifier_desc: "你自己的故事终于开始了。这将是光荣的。"
 lucita_decision: "露西塔的宿命"
 lucita_decision_tooltip: "时候到了"
 lucita_decision_desc: "你得先处理好困住你的最后一道枷锁。随后，将是反击时刻。"
 lucita_decision_confirm: "终于，自由了！"
 lucita_custom_decision: "[GetScriptedCharacterByHistoryID('505154').GetFirstName]必须死"
 good_moncada_modifier: "完美世界"
 good_moncada_modifier_desc: "无论她是爱你还是恨你，露西塔都活着。你的世界是完美和谐的。"
 podintroductions.126.t: "你的故事就此展开"
 podintroductions.126.desc: "虔诚的蒙卡达，伊比利亚正处于动荡之中，天主呼唤您来拯救它。您的[Glossary('尊长','game_concept_Sire_desc')]西尔维斯特·德·鲁伊斯正式领导基督教一方，但您才是权位背后的真正力量。目前，他很有用，但您可能想在某个时候步入台前。\n然后，还有露西塔……毫无疑问，她是天主派来引导您的天使，即使她没有意识到这一点。自从她受$pod_Embrace$之后，您已经是最好的您了，更敏锐、更迅速、更强大。她会慢慢学会欣赏您，但在那之前，您需要确保她保持安全。您甚至无法想象，如果她出了什么事，您可怜的灵魂会变成什么样子……"
 podintroductions.126.a: "天主赐予了我最棒的礼物"
 podintroductions.moncada: "作为蒙卡达，只要露西塔还活着，你就能享受这个修正。但如果她死了……\n你开局时与西尔维斯特·德·鲁伊斯在权力斗争。"
 PODcanon_chars.20.t: "你的小世界的终末"
 PODcanon_chars.20.desc: "她死了。\n露西塔，你的引路天使，死了。\n你已经失去希望了。这个世界可能也失去希望了，因为这显然证明天主已经放弃了祂最忠实的仆人。你还能继续这种可悲的亡生吗？即使尝试又有什么意义呢？……也许，也许这是一项考验，就像天主以前所做的那么多次。如果是这样，这将是你整个亡生中最艰难的一次。\n也许你会忍耐，但你甚至不确定你是否愿意。"
 PODcanon_chars.20.a: "她走了……"
 bad_moncada_modifier: "破碎世界"
 bad_moncada_modifier_desc: "你世界的重心已经死了。你现在是一个没有灵魂的躯壳，继续着毫无意义的亡生。"
 podintroductions.127.t: "你的故事就此展开"
 podintroductions.127.desc: "阿丰佐亲王，经过几个世纪的等待，君士坦丁堡终于属于您了。不过要小心，那些胆小的希腊吸血鬼在您巧妙地利用第四次十字军东征中时逃跑了，现在正召集他们的军队和手下来对付您。您明智地向暗影教区屈膝，在巩固您的统治时得到他们的保护。当然，这是一个暂时的过程，因为您有更大的野心，而不是仅仅做一个附庸。\n您并不关心您对$pod_cainite$的“信仰”，如果需要的话，您会马上改变它，尽管坚持下去可能还有机遇。\n尽快扩大拉丁人的统治，摆脱拜占庭的残余势力。您的扬升才刚刚开始！"
 podintroductions.127.a: "新的胜利即将来临"
 podintroductions.alfonzo: "作为阿丰佐，你是唯一一位可以通过专属决议创建拉丁帝国的人。"
 alfonzo_decision: "拉丁之治"
 alfonzo_decision_tooltip: "是时候处理残余了"
 alfonzo_decision_desc: "你是拉丁人战胜希腊人的象征。接纳并利用这一形象为自己打造一个新的帝国。"
 alfonzo_decision_confirm: "拜占庭亡了"
 bad_gratiano_modifier: "新贵"
 bad_gratiano_modifier_desc: "你是勒森魃家族的不受宠子嗣。这没带来任何帮助！"
 podintroductions.128.t: "你的故事就此展开"
 podintroductions.128.desc: "格拉齐亚诺大人，强大的勒森魃本人看到了您的伟大，将您初拥入他的$pod_clan$。这一行为激怒了您的新“同胞”，从那时起您就被打上了新贵的烙印，被剥夺了本该属于您的众多责任和头衔。您必须从头开始。\n为此，您选择了维罗纳，一个您还是凡人时就很熟悉的城市，立足点已经形成，但是……一切都还没有改变。他们仍然嘲笑您，在您背后侮辱您，甚至策划您的灭亡！这必须停止。\n您要让他们知道为什么勒森魃选择了您。您要让他们知道，格拉齐亚诺·德·维罗纳生来就是为了统治！"
 podintroductions.128.a: "他们会明白……"
 podintroductions.gratiano: "要摆脱格拉齐亚诺的初始修正，你必须完成一项专属决议。"
 gratiano_decision: "天生的统治者"
 gratiano_decision_tooltip: "他们会学会的。"
 gratiano_decision_desc: "向勒森魃$pod_clan$证明，你不仅仅是爸爸的新宠。取得一些他们必须注重的成就。"
 gratiano_decision_confirm: "他们已然学会"
 podintroductions.129.t: "你的故事就此展开"
 podintroductions.129.desc: "塞扬努斯大人，在您命中注定的$pod_Embrace$之后，您在欧洲漂泊了相当长的时间，寻找一个地方来建立您的夜之帝国。您现在的位置很有期望，虽然可能离强大的哈德施塔特有点太近。您将不得不与他打交道。\n您很容易就获得了这个地区的亲王领，因为您得到了一些非常意外的帮助。一个名叫杰克的陌生英格兰棘秘魑被您和您的梦想所震慑，热切地承诺为您服务。经过简单的询问，您认为他是值得信赖的，而且对于这样一个年轻的吸血鬼来说，他实际上很有能力。\n发现一个较小的人认识到您的伟大总是令人欣慰的，也许您可以奖励他在您新兴的国度中担任一个重要角色？"
 podintroductions.129.a: "我可以利用你"
 podintroductions.129.b: "我不需要任何帮助！"
 podintroductions.130.t: "你的故事就此展开"
 podintroductions.130.desc: "萨莉安娜女士，您对亚历山大的政变取得了巨大成功，您现在终于控制了法兰西的大部分地区。不过您不得不做出一些让步，最值得一提的是对亚历山大的子嗣若弗鲁瓦·杜·坦普尔的让步，他得到了巴黎本身作为回报。如果您要真正加强您对这个国家的控制，您就需要把这个著名的首都掌握在您手中。\n若弗鲁瓦年轻，容易受骗，但他有很多可能会成为麻烦的朋友。您必须谨慎行事，以便在不发生不必要的流血事件的情况下胜过他。"
 podintroductions.130.a: "是时候反思一下我们的关系了"
 salianna_intro_tooltip: "在接下来的日子里，你会引发一些考虑你与若弗鲁瓦的关系的事件。\n你开局时与若弗鲁瓦·杜·坦普尔在权力斗争。"
 PODcanon_chars.21.t: "战胜若弗鲁瓦"
 PODcanon_chars.21.desc: "要开始实施你取得巴黎的密谋，你必须孤立若弗鲁瓦。他的手下和人脉网络并不强大，但身为一位梵卓，对你的一些臣民来说，他是一个比你更“合法”的法兰西统治者。通过一些贿赂和隐晦的威胁，你可以改变这种状况。显然，他们会很容易理解，你会成为一个比一些愚蠢的军阀更好的巴黎亲王。"
 PODcanon_chars.21.a: "小菜一碟"
 PODcanon_chars.21.b: "我会让若弗鲁瓦留着他的战利品"
 salianna_exit_tooltip: "你放弃了为你自己取得巴黎的计划"
 PODcanon_chars.22.t: "剪除若弗鲁瓦的羽翼"
 PODcanon_chars.22.desc: "你很容易就摆脱了大部分若弗鲁瓦的试探性支持者，除了剩下两个人。安茹女王伊思妲·德·布莱斯已经表明了她的反对意见，但是……反正她已经厌恶你了，所以谁在乎呢？\n更麻烦的是顽固的弗朗索瓦·德阿伦库。这位有权有势的里昂亲王已经承诺为若弗鲁瓦的功业效力，永不变节。如果你继续你的行动路线，你将面对一个新的强大敌人。"
 PODcanon_chars.22.a: "或多或少……"
 PODcanon_chars.22.b: "我会让若弗鲁瓦留着他的战利品"
 PODcanon_chars.23.t: "巴黎，我回来了"
 PODcanon_chars.23.desc: "你已经完成了准备工作，现在准备以破竹之势将若弗鲁瓦驱出巴黎。这座城市将成为你的爱之皇廷的强大首都，并确保妥芮朵在法兰西的优势地位世代相传。\n最后要解决的问题是若弗鲁瓦本人。没有了巴黎，他基本上就没有爪牙了，如果你认为他没有更多的用处，你可以把他扔到一边。或者你可以把他留在手边，以便在将来执行另一项任务。在任何情况下，他显然对此事没有发言权。"
 PODcanon_chars.23.a: "我将在胜利中获得恩典"
 PODcanon_chars.23.b: "娇气的血侍对我没用"
 podintroductions.131.t: "你的故事就此展开"
 podintroductions.131.desc: "伊思妲女士，在亚历山大倒台的混乱中，您被萨莉安娜击败，没能成为爱之皇庭的领导。但这并不是您事业的终点。您对安茹的控制力仍然很强，只要萨莉安娜的权力没有得到巩固，她就很脆弱。\n在未来的战斗中，您将需要帮助，无论是政治还是军事。幸运的是，您对如何“教育”您的子嗣和摆脱无用的弱者有很好的把握。利用这个优势，法兰西可能最终是您的。"
 podintroductions.131.a: "战争还没有结束"
 isouda_intro_tooltip: "作为伊思妲，你在教育子嗣方面有一种更有回报，但有风险的专属可能性。"
 POD_education_events.1.option.e: "让我们看看其是否在我的宫廷里幸存下来……"
 POD_education_events.1.option.isouda: "作为伊思妲，你可以把你的子嗣放在无情的角斗场，或者说你的宫廷上。他们将从中变得更加强大……如果他们能活下来的话。"
 POD_education_events.26.t: "教育：可用的子嗣"
 POD_education_events.26.desc: "试炼已经结束，看起来这位还算是有用。嗯，勉强还不错吧，但说实话，你有一点点失望。也许你下次应加点料，让其在你无情的宫廷里蠕动求生的时候获得更多挑战，而看起来更有乐趣？嘛，改夜再想吧。"
 POD_education_events.26.option.a: "干得不错我猜"
 POD_education_events.27.t: "教育：无用的子嗣"
 POD_education_events.27.desc: "试炼已经结束，嗯，而这位没能度过。哦，好吧，反正还有很多凡人可以试炼。至少在中途完结之前，其看起来都很有趣。目睹无助的稚子陷入你的宫廷的阴谋网中，总是给你一种深深的满足感。"
 POD_education_events.27.option.a: "真的是最好的娱乐"
 podintroductions.132.t: "你的故事就此展开"
 podintroductions.132.desc: "埃丝克拉蒙德女士，您是公认的自阿尔比派十字军开始以来的奥克人抵抗法兰西的领袖……虽然您对奥克西塔尼亚本身并不那么关心，不过这也是个有用的针对公众视线的伪装。\n由于您的一种独特能力，该障眼法更上一层。通过以您过世的[Glossary('尊长','game_concept_Sire_desc')]告诉您的方式使用威仪术，您能够使任何男人迷失在一个他是骑士而您是公主的童话故事中。显然，从此，这位善良的公主可以指挥她勇敢的骑士杀死“怪物”，以保护她……"
 podintroductions.132.a: "我们每人都扮演着一位角色"
 esclarmonde_intro_tooltip: "作为埃丝克拉蒙德，你有一项可对你国度内的男人使用的专属[character_interaction|E]，该允许你魅惑他们。这将需要花费虔诚。"
 POD_esclarmonde_interaction: "埃丝克拉蒙德的童话魔咒"
 POD_esclarmonde_interaction_desc: "勇敢的骑士，请在我需要的时候帮助我吧！"
 faydit_modifier: "埃丝克拉蒙德的童话魔咒"
 faydit_modifier_desc: "这个可怜的灵魂迷失在幻觉中，以为自己是美丽的埃丝克拉蒙德公主的骑士。"
 podintroductions.133.t: "你的故事就此展开"
 podintroductions.133.desc: "无畏的梅琳达，您的[Glossary('尊长','game_concept_Sire_desc')]海伦在厌倦了对您的折磨后抛弃了您。您现在只能自力更生，但您在海伦的“教导”下学到了一件重要的事情：唯我独尊。\n那些愿意亲吻您的脚并证明有用的人可能会活下去。其他人……您将很乐意来对付这些其他人。\n如果这个世界必须陷入永恒的恐怖，以使您变得强大、受敬和独立，那就这样吧。\n您将在地狱中统治，并诅咒天堂。"
 podintroductions.133.a: "我想我现在明白了，“母亲”"
 melinda_intro_tooltip: "作为梅琳达·加尔布雷思，你有一项专属决议，只要你的首都还没有完全毁掉，你就可以蹂躏你的首都，获得一些快速的回报。"
 melinda_decision: "暴动！"
 melinda_decision_tooltip: "是时候发泄一下了"
 melinda_decision_desc: "在你的首都有许多无助的凡人。现在可能是时候让他们知道，末日的到来比他们想象的要快……"
 melinda_decision_confirm: "……而地狱紧随她后"
 podintroductions.134.t: "你的故事就此展开"
 podintroductions.134.desc: "狡猾的拉斐尔，说实话，您根本不知道这到底是怎么回事。您通过欺骗您的[Glossary('尊长','game_concept_Sire_desc')]，使其认为您是一位关于阴谋和恶作剧的艺术家，才勉强保住了自己的亡生，但您仍然对整个吸血鬼社会的运作没有真正的线索。\n从您收集到的一些东西来看，您最好尽快学习，因为无知的吸血鬼在大多数情况下都是死得快的吸血鬼。您只有一个优势可言，就是您的智慧。您有能力说服几乎所有的人去做任何事情。这可能将是您的救生索……"
 podintroductions.134.a: "我能做到！"
 rafael_intro_tooltip: "作为拉斐尔，你有一项花费声望来欺骗其他有地统治者给你一些东西的专属[character_interaction|E]。具体回报取决于他们的特质。"
 POD_rafael_interaction: "我的超值提议！"
 POD_rafael_interaction_desc: "向这位统治者提出一个非同寻常的提议"
 PODcanon_chars.24.t: "诱人的骗局"
 PODcanon_chars.24.desc: "拉斐尔，你的完美推销让这个人着迷了。现在是时候去收割了，你想要什么？它将取决于你所处的角度。"
 PODcanon_chars.24.a: "你可以相信我！"
 rafael_trusting_tooltip: "这个选项可用是因为你的目标拥有轻信他人或合群特质。"
 PODcanon_chars.24.b: "……然后我的[Glossary('尊长','game_concept_Sire_desc')]就抛弃了我！"
 rafael_compassionate_tooltip: "这个选项可用是因为你的目标拥有慈悲特质。"
 PODcanon_chars.24.c: "这很吸引人，我肯定会皈依的！"
 rafael_zealous_tooltip: "这个选项可用是因为你的目标拥有狂热特质。"
 PODcanon_chars.24.d: "有意思的东西，让我记个笔记！"
 rafael_diligent_tooltip: "这个选项可用是因为你的目标拥有勤勉或耐心特质。"
 PODcanon_chars.24.e: "该死的，我从来没敢这么做！"
 rafael_brave_tooltip: "这个选项可用是因为你的目标拥有勇敢或固执特质。"
 PODcanon_chars.24.f: "你简直是最棒的！"
 rafael_ambitious_tooltip: "这个选项可用是因为你的目标拥有野心勃勃或傲慢特质。"
 PODcanon_chars.24.g: "亡生很棒！"
 rafael_content_tooltip: "这个选项可用是因为你的目标拥有安于现状或谦卑特质。"
 PODcanon_chars.24.h: "他们绝对是来抓我们的！"
 rafael_deceitful_tooltip: "这个选项可用是因为你的目标拥有狡诈或多疑特质。"
 PODcanon_chars.24.i: "……这很形象"
 rafael_cynical_tooltip: "这个选项可用是因为你的目标拥有愤世嫉俗或冷酷特质。"
 PODcanon_chars.24.j: "说的不错！"
 rafael_end_tooltip: "你没有更多角度来进逼该目标！"
 podintroductions.135.t: "你的故事就此展开"
 podintroductions.135.desc: "美丽的罗莎蒙，您现在在马格德堡，被流亡的玛土撒拉亚历山大几乎绑架了。这个曾经的法兰西统治者说他爱您，但您知道，他那颗冷酷的心有一天晚上会被激怒，足以摧毁您，就像他对他曾经的“灵魂伴侣“所做的那样。您需要盟友。\n还有谁比大胆的约根·冯·费尔登更合适呢？您认识他已经有一段时间了，而且您们都非常喜欢对方。但是，您们的爱情将无法真正成长，即使您嫁给他，若亚历山大没被彻底解决。您被教导得很好，您不是无助的少女，罗莎蒙德，您知道该怎么做。"
 podintroductions.135.a: "爱战胜一切"
 rosamund_intro_tooltip: "作为罗莎蒙，只要你和约根仍然是灵魂伴侣，你就有一项专属决议可以使用。"
 love_triumph_modifier: "爱的胜利"
 love_triumph_modifier_desc: "……他们从此就幸福地生活在了一起。大概。"
 rosamund_decision: "三角恋"
 rosamund_decision_tooltip: "是时候简化你的爱情生活了"
 rosamund_decision_desc: "亚历山大是一个压迫性的控制狂，随时都可能在愤怒中杀死你。你得对付他。"
 rosamund_decision_confirm: "圆满的结局"
 rosamund_custom_decision: "[GetScriptedCharacterByHistoryID('505082').GetFirstName]必须死"
 rosamund_custom_decisionb: "你必须得是[GetScriptedCharacterByHistoryID('505086').GetFirstName]的灵魂伴侣"
 podintroductions.136.t: "你的故事就此展开"
 podintroductions.136.desc: "睿智的卡尔，您保护旧有传统的倡议到目前为止是成功的。自由邦还很年轻，但每夜都在增长，更令人放心……但麻烦就在眼前。\n您的两个主要盟友，埃里克·朗托斯和乌尔夫斯多蒂尔，已经到了摊牌的地步，并互相掐架。埃里克是一个强大的战士，但他对凡人的完全不关心使女武神感到不安。作为回报，乌尔夫斯多蒂尔默默地接受了您传统缓慢的终末，这激怒了朗托斯。\n如果您想让自由邦继续存在下去，您需要选择一个阵营……并且可能要对付那个会感到受委屈的一边。"
 podintroductions.136.a: "你是个怪物，埃里克，必须得有人阻止你"
 podintroductions.136.b: "我们必须为了大业而战，乌尔夫斯多蒂尔！"
 podintroductions.136.c: "你们都是蠢货！"
 podintroductions.137.t: "你的故事就此展开"
 podintroductions.137.desc: "强大的比约恩，您又一次被拖入一场失败的战争。在您驶向文兰时，您在苏格兰遇难，成了船员中唯一的幸存者。当地的吸血鬼，大多是来自密特拉对岛屿的铁腕控制的难民，非常欢迎您，以至于您觉得亏欠了他们。\n您不是那种会把朋友留在身后的人，所以您现在在这里，领导者针对密特拉对这片土地不可避免的攻击的抗战。您需要新船员来完成这样一项艰巨的任务，只有最好的、最忠诚的人才能胜任。"
 podintroductions.137.a: "新地方，老麻烦"
 bjorn_intro_tooltip: "作为比约恩，你有着可以让某人成为你的队友的专属[character_interaction|E]。\n你最多只能有5个无地的吸血鬼作为队友，而且他们需要对你有好感才会接受。"
 bjorn_crew_modifier: "比约恩的队友"
 bjorn_crew_modifier_desc: "比约恩·加里森的队伍的成员，一个留给训练有素的战士的位置"
 POD_bjorn_crew_opinion: "比约恩的队友"
 POD_bjorn_interaction: "邀请加入你的队伍"
 POD_bjorn_interaction_desc: "该角色将成为你的5个队友之一"
 POD_bjorn_crew_interaction_limit: "该角色必须对你好感为正，而且你不能有超过5个队友"
 POD_bjorn_opinion_limit: "该角色必须对你好感为正"
 podintroductions.138.t: "你的故事就此展开"
 podintroductions.138.desc: "无畏的罗宾，您的义军的未来看起来很糟糕。可恨的暴君密特拉在几年前赢得了您们之间最近的一场战斗，严重削弱了您对不列颠群岛的影响力。但仍有希望，因为他还没有去杀戮，也许他正忙于其他事情，或者像他这样的老吸血鬼只是感到无聊。这可能是您的机会。\n迅速做好准备，以防再次受到攻击，在那些愿意听从的人中播下起义的种子，并一劳永逸地拿下密特拉。只有这样，不列颠群岛才能真正获得自由。"
 podintroductions.138.a: "我被逼到了墙角，但我还没有被击败"
 leeland_intro_tooltip: "作为罗宾，你有一项在年轻吸血鬼中播下叛变的种子的专属[character_interaction|E]，给其他国度造成混乱。"
 seed_of_rebellion_leeland_modifier: "叛变之种"
 seed_of_rebellion_leeland_modifier_desc: "该角色已经被一个传奇的不法之徒推到了叛变的边缘"
 POD_leeland_interaction: "叛变之种"
 POD_leeland_interaction_desc: "在该年轻吸血鬼心智中播下叛变的种子"
 podintroductions.139.t: "你的故事就此展开"
 podintroductions.139.desc: "维罗妮克女士，在巴黎的冒险之后，您回到了您的家乡。您在反对暴虐的法兰西亲王亚历山大的政变中提供了帮助，并在此过程中获得了一些认可。可悲的是，您也在狡诈的让·巴蒂斯特·德·蒙特龙手下失去了许多值得信赖的家臣。总有一夜，您将能“报答”他。\n除了这场突如其来的竞争，您的地位基本上是安全的。您已经在努力重建您的凡人朋友队伍，这在$pod_cainites$中是个怪现象，但却给了您力量。利用您对人性的信任来发挥您的优势，那些低估您的人很快就会知道，您在任何专业领域都可以和他们一样熟练。"
 podintroductions.139.a: "我会以自己的方式参与他们的棋局"
 veronique_intro_tooltip: "作为维罗妮克，只要你还具有人性之道信仰，你在“巡视首都​”活动中就有着专属事件。"
 POD_survey_events.150.t: "巡视：维罗妮克的伴随者"
 POD_survey_events.150.desc: "你是少数几位真正会与凡人培养一些关系的$pod_cainites$之一，而不是只把他们当作牲畜或更大棋局中的棋子。因此，你在城里实际上有一些朋友，愿意在许多不同的事情上帮助你。就像所有的人脉一样，你必须不时地拜访他们，处理他们可能遇到的任何相关麻烦，但你总是发现这是一些有意义的经历。凡人对不断变化的世界的适应性比任何$pod_cainite$所想象的要强得多。"
 POD_survey_events.150.option.a: "很高兴再次见到你！"
 veronique_survey_tooltip: "只要维罗妮克坚持人性之道信仰，这种专属巡视结果就会一直发生在她身上。"
 podintroductions.140.t: "你的故事就此展开"
 podintroductions.140.desc: "伟大的斯巴达的墨涅拉俄斯，您追捕叛徒海伦已经几个世纪了，这场冲突似乎没有尽头。她显然需要受到惩罚，因为她策划了您心爱的迦太基的毁灭，但您也为您的$pod_clan$的衰落感到悲哀。您可以做很多事情来帮助它恢复……如果您不是那么专注于追捕您的宿敌。\n您们之间的传说级竞争必须以某种方式结束，那么也许还有时间来治愈您破碎的$pod_clan$。"
 podintroductions.140.a: "终结永恒恩怨……"
 menele_intro_tooltip: "作为墨涅拉俄斯，你有一项专属决议，需要你先解决海伦这麻烦。如果你达成了它，你就可以解锁一项[character_interaction|E]，能让其他布鲁赫了解你$pod_clan$的光辉。"
 menele_decision: "斯巴达对特洛伊"
 menele_decision_desc: "海伦已经占据了你过多的时间。处理掉她，之后还有更重要的事需要你关注。"
 menele_decision_confirm: "终于！"
 menele_decision_tooltip: "是时候结束这无稽之谈了"
 menele_decision_effect_tooltip: "你将可以解锁一项让其他布鲁赫了解你$pod_clan$的光辉的[character_interaction|E]"
 PODcanon_chars.25.t: "新的开始"
 PODcanon_chars.25.desc: "终于，与海伦的这桩破事过去了。这花了很长时间，但你终于意识到，她最大的背叛并不是帮助罗马人对抗迦太基，而实际上是在你的$pod_clan$最需要你的时候让你分心了。\n布鲁赫依然分裂，被愤怒和悲伤所淹没，是辉煌的古时夜晚的苍白反转。这不一定是唯一的出路。你是传奇的墨涅拉俄斯，只要你开口，即使是你$pod_clan$中最顽固的成员也会倾听。你必须成为他们前进的指路明灯，因为没有其他人能做到。"
 PODcanon_chars.25.a: "我们是迦太基的遗裔"
 menele_victory_tooltip: "你将可以解锁一项让其他布鲁赫了解你$pod_clan$的光辉的新[character_interaction|E]"
 POD_menele_teachings_interaction: "迦太基的教诲"
 POD_menele_teachings_interaction_desc: "让其他布鲁赫记起他们的光荣历史和光明的未来。"
 PODcanon_chars.26.t: "课程"
 PODcanon_chars.26.desc: "作为仍活跃在这些夜的最受尊敬的布鲁赫，你有足够的影响力让你的$pod_clan$的任何成员坐下来听你说话，只要你用心去做。\n在准备工作完成后，你只需要考虑你到底要教这个人什么。如果说与海伦的冲突教会了你什么，那就是你没有足够的时间只浪费在一个人身上。"
 PODcanon_chars.26.a: "掌控你的心兽只有一种办法"
 PODcanon_chars.26.b: "让我们谈谈迦太基"
 PODcanon_chars.26.c: "自控是关键"
 ANTI_HEDEON_PACT: "反海德翁协定"
 podintroductions.141.t: "你的故事就此展开"
 podintroductions.141.desc: "伊扎克大人，由于拉兹科利纳亲王对梵卓入侵的纠缠，您最近成功地大大扩展了您在波兰的影响力。但您并不是唯一从这个事件中获利的人。海德翁·雅罗斯拉维奇，即使对他已经相当虐待狂的$pod_clan$来说也是一个恶毒的怪物，也使他的国度得到了相当大的发展。他的黑暗阴影现在越来越接近于吞噬波兰。\n也许有一条出路。您不信任拉兹科利纳，但您知道她的邪恶程度远远低于海德翁，而且她可能对您也有同样的感觉。在您们之间谈判休战，可以让您们俩先把注意力放在海德翁身上。在那之后，很明显，所有的赌注都会消失……"
 podintroductions.141.a: "拉兹科利纳亲王，让我谈谈"
 podintroductions.141.b: "她不比海德翁好多少！"
 podintroductions.142.t: "你的故事就此展开"
 podintroductions.142.desc: "赫克托大人，新拉科尼亚的安全要归功于您强有力的领导。如果您愿意，您的领地周围摇摇欲坠的拜占庭帝国甚至可能提供扩张的机遇。虽然国内也有麻烦需要处理。\n按照迦太基的传统，您在元老院的建议下进行统治，但这个庄严的机构存在分歧。大多数参议员希望您走理想化和纯粹的迦太基之路。开始变得越来越多的少数人则希望采取更实用的方法，包括古迦太基中最不光彩的因素。您对其中一个派别的支持将为您的国度在未来几年的重点铺平道路。"
 podintroductions.142.a: "大会开始！"
 hektor_intro_tooltip: "作为赫克托，你有一项专属决定，那就是召集参议院并选择你未来几年的重心。\n如果安条克和莫林这两位党派领导人还活着，你可以选择一个更强大的重心。"
 hektor_decision: "参议院大会"
 hektor_decision_tooltip: "我需要参议院的建议"
 hektor_decision_desc: "在即将到来的参议院任期内，你会偏向哪一党派？"
 hektor_decision_confirm: "开会时请保持秩序！"
 hektor_decision_effect_tooltip: "你将选择未来几年的政策。"
 PODcanon_chars.27.t: "参议院"
 PODcanon_chars.27.desc: "赫克托，你的新生迦太基参议院的这次新大会和以往一样。理想主义者斥责你“背叛”了他们亲爱的乌托邦，而实用主义者则敦促你想想为什么迦太基曾如此强大，且不计代价。值得庆幸的是，最后的决定权只属于你。"
 PODcanon_chars.27.a: "为理想而战！"
 PODcanon_chars.27.b: "迦太基是首要且主要的理想。"
 PODcanon_chars.27.c: "两者间持平是唯一的途径。"
 PODcanon_chars.27.d: "必须做出牺牲！"
 PODcanon_chars.27.e: "狼群已在我等门外！"
 antiochus_alive_tooltip: "这个选项可用是因为安条克还活着。"
 maureen_alive_tooltip: "这个选项可用是因为莫林还活着。"
 full_idealist_support_modifier: "彻底支持理想主义"
 full_idealist_support_modifier_desc: "迦太基是一个纯粹而完美的乌托邦。没有人可以反驳这个事实。"
 idealist_support_modifier: "支持理想主义"
 idealist_support_modifier_desc: "迦太基是一个值得为之斗争的理想，尽管它可能有任何缺陷。"
 pragmatist_support_modifier: "支持实用主义"
 pragmatist_support_modifier_desc: "我们并不生活在梦中。必须得有牺牲。"
 full_pragmatist_support_modifier: "彻底支持实用主义"
 full_pragmatist_support_modifier_desc: "如果没有它的梦魇，迦太基的幻梦就一无是处。"
 podintroductions.143.t: "你的故事就此展开"
 podintroductions.143.desc: "伊卡捷琳娜女士，到目前为止，您在该地区的影响力一直在增长，这在很大程度上要归功于您非常有才华的子嗣克里斯托夫·罗慕铎。遗憾的是，您那鲁莽的后代在维谢赫拉德的一场残酷战斗后失踪了。这个疯子试图通过砍杀守卫城堡的所有恐怖棘秘魑，独自冲进堡垒！\n不过，毕竟克里斯托夫还是克里斯托夫，您知道，如果引导得当，他可以非常有用。您可以组织一个搜索队去维谢赫拉德的废墟，找到他并把他带回来给您。或者，也许他的用处已经用完了？"
 podintroductions.143.a: "我又有一项任务要给你，克里斯托夫"
 podintroductions.143.b: "他那由阴谋组成防护似乎已经持续不了多久了"
 podintroductions.144.t: "你的故事就此展开"
 podintroductions.144.desc: "奥古斯都大人，您一直在迅速抓住$pod_Embrace$给您的机会。您家族的商业（和亡灵术）帝国正在成长，而这些懒散的卡帕多西亚并没预测到这。如此，您只是一个人，您必须首先集中精力，最终夺取威尼斯本身的控制权。\n对于其他事务，您可以依靠您的三个副手，克劳狄乌斯、安布罗吉奥和伊尼亚齐奥。每个人都有自己的强项，他们都希望得到您的认可。如果您出对了牌，您可以让他们在很长一段时间内都有用，并忙于彼此之间的争吵（而不是谋害您）。"
 podintroductions.144.a: "我等的扬升开始了"
 augustus_intro_tooltip: "作为奥古斯都，你有一项专属决议，让你可以偏爱众副手中的之一，只要其还活着。"
 augustus_decision: "你的右手"
 augustus_decision_tooltip: "吵闹但是有用的子嗣"
 augustus_decision_desc: "哪位副手在接下来的年里会有你的偏爱？"
 augustus_decision_confirm: "让我想想……"
 augustus_decision_effect_tooltip: "你将选择在接下来的年里偏爱的副手"
 augustus_custom_decision: "至少[GetScriptedCharacterByHistoryID('790141').GetFirstName]、[GetScriptedCharacterByHistoryID('790140').GetFirstName]或[GetScriptedCharacterByHistoryID('790144').GetFirstName]中的一人还活着"
 claudius_support_modifier: "克劳狄乌斯的支持"
 claudius_support_modifier_desc: "克劳狄乌斯是个阴险狡诈的混蛋。但他是你的阴险狡诈的混蛋。"
 ignazio_support_modifier: "伊尼亚齐奥的支持"
 ignazio_support_modifier_desc: "伊尼亚齐奥并不是最聪明的乔凡尼，但他强力的剑术可能是非常有用的。"
 ambrogino_support_modifier: "安布罗吉奥的支持"
 ambrogino_support_modifier_desc: "安布罗吉奥的野心大到对其不利的地步。最好还是满足和亲近他。"
 PODcanon_chars.28.t: "副手"
 PODcanon_chars.28.desc: "作为家族的族长，你的宠爱本就是一种宝贵的资源。你的三个主要代理人总是想讨好你，并超越其的竞争对手。这个小竞争还有一个好处，就是让其分割开来，忙着在其等之间策划阴谋互相针对，而不是反抗你。双赢。\n但最终，该信任谁和该拒绝谁，只能由你自己选择。"
 PODcanon_chars.28.a: "克劳狄乌斯是我最宠爱的儿子。"
 PODcanon_chars.28.b: "安布罗吉奥是我们间最棒的。"
 PODcanon_chars.28.c: "伊尼亚齐奥的简易方法很有用。"
 PODcanon_chars.28.d: "这次没人赢得我的青睐"
 claudius_alive_tooltip: "这个选项可用是因为克劳狄乌斯还活着。"
 ambrogino_alive_tooltip: "这个选项可用是因为安布罗吉奥还活着。"
 ignazio_alive_tooltip: "这个选项可用是因为伊尼亚齐奥还活着。"
 podintroductions.145.t: "你的故事就此展开"
 podintroductions.145.desc: "安布罗吉奥大人，您注定将是伟大的。尽管您只是乔凡尼家族的一个私生子，但您已经取得了很多成就，对您新的吸血鬼状况的了解比家族其他成员（包括奥古斯都）还要多。但这仅仅是个开始，因为您的脑袋正为眼前的各种可能性而旋转。\n您需要更多的神秘文本，更多失落的预言，更多隐秘的羊皮纸。在某处可以找到一个真理，这个真理可以导往神格，您确信这一点。旅程将是漫长的，但回报……回报将是您最疯狂的幻想，不，您的宿命！成真。"
 podintroductions.145.a: "我将寻到关键"
 ambrogino_intro_tooltip: "作为安布罗吉奥，你收集“萨尔贡圣典”残页的速度将会更快。"
 ambrogino_sargon_codex_modifier: "安布罗吉奥的宿命"
 ambrogino_sargon_codex_modifier_desc: "萨尔贡圣典所展示的比你所能想像出的还要多！神格从未如此触手可及……"
 pod1230objectives.49.c: "我知道该如何掌控它……"
 sargon_ambrogino_tooltip: "这个选项只对安布罗吉奥·乔凡尼可用"
 podintroductions.146.t: "你的故事就此展开"
 podintroductions.146.desc: "克劳狄乌斯大人，那个阴险狡诈的私生子安布罗吉奥这次做得太过分了。您长期以来一直在培养您自己的曾孙女卢克丽霞，让她成为您的一个子嗣，但那个贪婪的小偷不知怎么说服了您的亲生父亲奥古斯都，把卢克丽霞送给了他！这是最后一根稻草。\n您是奥古斯都的继承人，无论是在凡生还是亡生。安布罗吉奥不过是一个发迹的女仆的儿子，过于自命不凡。现在是时候一劳永逸地除掉他了……还有卢克丽霞，因为她现在已经被这个杂种的血液玷污了。只有这样，您才能够承担起您作为奥古斯都的右手的应有地位。"
 podintroductions.146.a: "他将为这一阴谋感到后悔！"
 claudius_intro_tooltip: "作为克劳狄乌斯，你有一项除掉安布罗吉奥和卢克丽霞来获得收益的专属决议。"
 rightful_giovanni_heir_modifier: "正当的乔凡尼继承人"
 rightful_giovanni_heir_modifier_desc: "没有人可以否认你现在是你父亲遗产的真正继承人。"
 claudius_decision: "乔凡尼的继承者"
 claudius_decision_tooltip: "唯有你，没有他人，是奥古斯都的继承者"
 claudius_decision_desc: "除掉那个讨厌的安布罗吉奥和他从你那里偷走的最受他宠的子嗣！这将是对任何潜在的对手的有力警告。"
 claudius_decision_confirm: "正义的胜利！"
 claudius_custom_decision: "[GetScriptedCharacterByHistoryID('790140').GetFirstName]和[GetScriptedCharacterByHistoryID('790161').GetFirstName]都必须死"
 weak_falsinar_modifier: "微弱的法尔西纳之助"
 weak_falsinar_modifier_desc: "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 podintroductions.147.t: "你的故事就此展开"
 podintroductions.147.desc: "马库斯·穆萨大人，您在家族和$pod_clan$中的名声正在迅速上升。您在埃及挫败了拉撒路的疯狂计谋，证明了自己的能力。但代价是高昂的，您在战斗中失去了您的两个亲信。其中一个人，法尔西纳，被证明是一个相当有意志力的灵魂，因为即使在冥界，他仍然尽其所能地帮助您。\n法尔西纳仍然是一个弱小而年轻的死灵，但您是一个熟练的亡灵术师，因此您已经确定了两种可能性，以帮助您的鬼朋友在您的世界中更容易地显现出自己。这两个方法都不容易实现，但反正您和法尔西纳有的是时间。"
 podintroductions.147.a: "亡灵术师与死灵，完美的搭档"
 markus_intro_tooltip: "作为马库斯·穆萨，你有两项当达成时能强化法尔西纳的专属决议"
 markus_nikita_decision: "死亡节点"
 markus_nikita_decision_tooltip: "关键之一在于克罗地亚"
 markus_nikita_decision_desc: "斯雷代茨的尼基塔，挪得大主教，似乎在引诱一些强大的亡灵能量到他身边。这是个加强法尔西纳的机会。"
 markus_nikita_decision_confirm: "又一受我束缚的灵魂"
 markus_nikita_custom_decision: "[GetScriptedCharacterByHistoryID('790261').GetFirstName]必须死"
 markus_nikita_decision_effect_tooltip: "法尔西纳将变得更强"
 medium_falsinar_modifier: "法尔西纳之助"
 medium_falsinar_modifier_desc: "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 high_falsinar_modifier: "强力的法尔西纳之助"
 high_falsinar_modifier_desc: "你忠实的法尔西纳仍然于冥界尽心尽力地帮助你。"
 markus_egypt_decision: "回到埃及"
 markus_egypt_decision_tooltip: "这个地方有一些不好的回忆……"
 markus_egypt_decision_desc: "法尔西纳在埃及为保护你免受拉撒路的伤害而死。你从未能够找回他的遗体。若做到了肯定会帮助你加强他的死灵。"
 markus_egypt_decision_confirm: "适当的安葬"
 markus_egypt_decision_effect_tooltip: "法尔西纳将变得更强"
 podintroductions.148.t: "你的故事就此展开"
 podintroductions.148.desc: "雅弗大人，您作为卡帕多西亚$pod_clan$的非正式领袖的身份并不切合实际。您的同胞们都是出了名的孤僻，对您的崇高责任大多不闻不问。更糟糕的是，您的[Glossary('尊长','game_concept_Sire_desc')]卡帕多修斯自己也经常迷失在自己的宏伟幻想或疯狂情绪中。但作为$pod_clan$的始祖，他的话就是法律，而您若不尽责，就什么都不是。\n他最近的幻想看到威尼斯人乔凡尼被初拥入血脉，这是您坚决不同意的事情。不过，您别无选择，只能就这样继续下去，限制您的[Glossary('尊长','game_concept_Sire_desc')]最糟糕的过度行为，同时维护卡帕多西亚$pod_clan$的完整性。永恒从未如此漫长。"
 podintroductions.148.a: "我的工作从未完成"
 japhet_intro_tooltip: "作为雅弗，你有一项检视卡帕多修斯的专属小决议。不过要小心他的奇行。"
 japhet_decision: "父之罪"
 japhet_decision_tooltip: "希望他正处于好心情……"
 japhet_decision_desc: "你是埃尔吉耶斯，卡帕多修斯本人的居所的看守人。这是一个巨大的荣誉……也是一个巨大的负担，因为[Glossary('上古耆宿','game_concept_antediluvian_desc')]往往是难以理解的。"
 japhet_decision_confirm: "没有回头路了"
 japhet_decision_effect_tooltip: "你将检视卡帕多修斯，期望他还好……而且没太迷失在自己的幻想世界里。"
 PODcanon_chars.29.t: "卡帕多修斯：计划"
 PODcanon_chars.29.desc: "他又来了……你庄严的[Glossary('尊长','game_concept_Sire_desc')]，可敬的卡帕多修斯自己又开始了他的妄想，想要[Glossary('吸榨','game_concept_diablerie_desc')]天主。作为一个热衷于基督教的人，他一直以自己扭曲的方式迷恋着“全一的天主”。你很肯定奥古斯都·乔凡尼的$pod_Embrace$也与此有某种联系。\n在任何情况下，他都在详细讲述他的疯狂计划，当然希望得到你的热情批准。你没有办法和他讲道理，但你至少希望不要在被这个疯狂的追求拖得太深。"
 PODcanon_chars.29.a: "这可能仍有一些缺陷。"
 PODcanon_chars.29.b: "多么完美的计划，尊长！"
 PODcanon_chars.29.c: "*叹气*是的，这很厉害"
 PODcanon_chars.30.t: "卡帕多修斯：导师"
 PODcanon_chars.30.desc: "你尊敬的[Glossary('尊长','game_concept_Sire_desc')]今晚的心情很好，很安静，把你带回到了他的妄想心开始游荡之前的美好时光。他实际上很高兴见到你，你们谈论了你们所看到的许多奇迹和恐怖。正是在这些轻松的时光里，你回忆起了卡帕多修斯曾经是一位伟大的人，希望现在也能如此。\n你离开他的房间时，更加坚定了继续工作的决心，而且比进来时更加聪慧了。"
 PODcanon_chars.30.a: "萨尔贡为[Glossary('尊长','game_concept_Sire_desc')]如何？"
 PODcanon_chars.30.b: "我期望我能认识以诺本人……"
 PODcanon_chars.30.c: "我们能谈谈阿舒尔么？"
 PODcanon_chars.31.t: "卡帕多修斯：牧师"
 PODcanon_chars.31.desc: "卡帕多修斯是一个狂热的信徒，他对基督教的看法是扭曲的。因此，他想参加弥撒……或亲自担任牧师，尽管这显然很讽刺。\n你已经习惯于处理他的这种癖好，但总是很难避免不必要的关注，因为你的[Glossary('尊长','game_concept_Sire_desc')]对他的吸血鬼状况并不完全谨慎。"
 PODcanon_chars.31.a: "我将举办圣餐"
 PODcanon_chars.31.b: "祈祷就够了"
 PODcanon_chars.31.c: "安全第一"
 podintroductions.149.t: "你的故事就此展开"
 podintroductions.149.desc: "贝拉大人，您终于找到了您的人生目标。基督教道德的琐碎枷锁并不适合您，您注定要做得更多！库帕拉，这个仁慈而强大的实体，正在大地上寻找一个化身，还有谁比您更合适？\n显然，必须做出一些献祭……或很多献祭。但在神化面前，谁会在乎一个人、一个城市甚至整个国家呢？您当然不会。很快您就会撕开这个注定要毁灭的世界脆弱的理智面纱，然后一切都将成为灰、血和火。\n而在这场末日性的涅槃中，您将成为唯一的幸存者。"
 podintroductions.149.a: "一个垂死世界的最后喘息……"
 bela_intro_tooltip: "作为贝拉·拉森科，你有一项为库帕拉献祭你的伯爵领的专属决议。如果你做得够多，谁知道会发生什么？"
 bela_decision: "库帕拉崛起"
 bela_decision_tooltip: "送他们下地狱！"
 bela_decision_desc: "库帕拉需要献祭才能显现在这个不幸的世界上。而你非常乐意提供。"
 bela_decision_confirm: "地狱在崛起"
 bela_decision_effect_tooltip: "完成了……"
 kupala_rising_weakest: "隐然的库帕拉影响"
 kupala_rising_weakest_desc: "伟大的恶魔已经注意到你的努力……"
 kupala_rising_weak: "微弱的库帕拉影响"
 kupala_rising_weak_desc: "伟大的地缚魔已经注意到你的持续努力……"
 kupala_rising_medium: "中等的库帕拉影响"
 kupala_rising_medium_desc: "伟大的大公爵把你当作祂最喜爱的侍从……"
 kupala_rising_strong: "强力的库帕拉影响"
 kupala_rising_strong_desc: "伟大的大天使现在离你很近，在你耳边低语，让你做更多的事……"
 kupala_avatar_modifier: "库帕拉的化身"
 kupala_avatar_modifier_desc: "……而地狱随祂其后"
 PODcanon_chars.32.t: "吾等为一"
 PODcanon_chars.32.desc: "该宿主很有趣。显然，与你的天启形态相比，它是相当脆弱的，但它能用。你不能否认它为把你召唤入一个更适合这个世界的形态所做的巨大努力。在你接管的过程中，你很高兴能迅速吞噬他的灵魂。\n在那个该死的监狱里关了那么久之后，你终于自由了，现在有很多事情可做。尽管你有相当大的力量，但这脆弱的身体在崩溃之前只能承受这么多，所以你必须小心。不过，感谢召唤你的那个傻瓜，你有的是时间。\n毕竟通往地狱最安全的那条道路是渐进的那一条。"
 PODcanon_chars.32.a: "天堂在垂泪"
 silver_attacks_modifier: "银牙劫掠"
 silver_attacks_modifier_desc: "狼人在这个省份里很不安分，不断地试探你控制力的极限。"
 podintroductions.150.t: "你的故事就此展开"
 podintroductions.150.desc: "阿帕西亚女士，您的收养的人民正处于危险之中。您对西比尔汗国的控制受到了狂热的银牙狼人战群的挑战，他们对您在他们认为是自己家园的地方的干涉感到愤怒。您可以与他们战斗，但这将是一个漫长而艰巨的过程，而且您在该地区的地位已经相当不安全了。\n然而，另一个解决方案正在出现，[Glossary('安答','podgloss.anda')]，来自蒙古文化的吸血鬼，正在迅速为自己争取大草原。他们的领袖最近发来消息，要求您向他的部族效忠，以换取他对掠夺成性的狼人的保护。也许暂时失去独立来换取您的人民的安全是值得的？"
 podintroductions.150.a: "我不需要任何帮助！"
 podintroductions.150.b: "大草原在统一"
 podintroductions.151.t: "你的故事就此展开"
 podintroductions.151.desc: "迈卡大人，您在最近的和平条约中的聪明之举使您的奥伯图斯教团被确立为德意志梵卓和您东边的族人之间的一个缓冲国。但这一地位并不安全，仍有许多工作要做。\n您最近还了解到，斯雷代茨的尼基塔，挪得大主教，可能与棘秘魑$pod_clan$的一个最严密的秘密有关。您的学术头脑无法抗拒这种发现的诱惑，但您必须冲进尼基塔的城市去了解更多，这可能是一个令人生畏的前景。像往常一样，注意平衡您对知识的追求和您更多的世俗野心。这一直是您自己通往伟大的道路。"
 podintroductions.151.a: "一刻也不能耽误。"
 myka_intro_tooltip: "作为迈卡·维科斯，你有一项学得挪德大主教的秘密的专属决议。其收益可能将是远大于迈卡所能把握的……"
 myka_decision: "黑暗的秘密"
 myka_decision_tooltip: "寻求不可知的真相"
 myka_decision_desc: "斯雷代茨的尼基塔隐藏着棘秘魑$pod_clan$最重要的秘密之一。与他打交道，冲进他的藏身处，并得知真相。"
 myka_decision_confirm: "我必须要知道！"
 myka_decision_effect_tooltip: "迈卡将获得新生。"
 PODcanon_chars.33.t: "丑陋的真相"
 PODcanon_chars.33.desc: "所有这些充满幻想的探索都只是一个陷阱。\n你在尼基塔的藏身处里没有发现任何真相，除了意识到尼基塔在你知道他是谁之前就已经死了，并被一个强大的棘秘魑玛土撒拉所冒充。而这位玛土撒拉引导你来到了这里，因为他发现你会成为比已故大主教更好的“宿主”。\n你已经可以看到它的卷须，不管是精神上的还是其他方面的，都在伸来将你融合到一个更“适当”的形式中去。\n这可能是迈卡·维科斯的终末。"
 PODcanon_chars.33.a: "……一切都改变了"
 PODcanon_chars.33.b: "快逃！"
 podintroductions.152.t: "你的故事就此展开"
 podintroductions.152.desc: "诺利兹大人，懒散颓废的时代已经过去。虽然让您的子嗣们在大逃杀中互相对决当然很有趣，但您不能忘记您曾经是棘秘魑、$pod_clan$的主人。弗拉基米尔·罗斯托维奇，那个懦弱的篡位者，从您手中夺走了它，但他对德意志梵卓的羞辱性失败是您等待的机会。\n您必须坚持您作为军督之督的合法宣称，彻底解决罗斯托维奇。然后您的世系就可以重新获得应有的威望。"
 podintroductions.152.a: "这是你最终的错误，弗拉基米尔……"
 noriz_intro_tooltip: "作为诺利兹，如果你成为军督领的领袖，你将能解锁一项专属决议。如果达成，它将提高你的起始修正。"
 house_noriz_modifier: "诺利兹家族"
 house_noriz_modifier_desc: "真正的军督之督已然回归。特兰西瓦尼亚比以往任何时候都更令人恐惧。"
 noriz_decision: "军督的回归"
 noriz_decision_tooltip: "罗斯托维奇的时代已经结束"
 noriz_decision_desc: "许多人认为你很怠惰，迷失在颓废中。夺回你的头衔，证明他们错了。"
 noriz_decision_confirm: "他们将再次下跪"
 noriz_custom_decision: "[GetScriptedCharacterByHistoryID('505053').GetFirstName]必须死。"
 podintroductions.153.t: "你的故事就此展开"
 podintroductions.153.desc: "拉兹科利纳女士，您最近陷入了[Glossary('蛰眠','game_concept_torpor_desc')]，对波兰的控制被削弱了。不过，克拉科夫还没有沦陷，所以您有一个强大的基地来发动您的重新征服。\n这对您特别重要，因为您是少数真正关心城市安危的吸血鬼之一。这显然不是出于任何不当的善意，而是从务实的角度来看，一个强大的城市意味着一个强大的亲王。您必须迅速重建您在克拉科夫的影响网，并帮助它再次繁荣。这座城市必须变得强大起来，成为您的新棘秘魑帝国的首都。"
 podintroductions.153.a: "特兰西瓦尼亚已是过去，此处可是未来。"
 raz_intro_tooltip: "作为拉兹科利纳，你在“巡视首都​”活动中就有着专属事件。"
 POD_survey_events.160.t: "巡视：拉兹科利纳的首都"
 POD_survey_events.160.desc: "你比任何棘秘魑都更了解一个发达的凡人社区的重要性。因此，你在克拉科夫长期以来一直在实践引导一座城市走向繁荣的艺术。你学到的宝贵经验使你更容易巧妙地将你的首都向你的目标发展。不过，这仍然是一个令人疲惫的过程，你可能更想控制自己的劳逸。"
 POD_survey_events.160.option.a: "没有时间可以浪费了"
 POD_survey_events.160.option.b: "永恒在我身旁"
 raz_survey_tooltip: "只要你扮演拉兹科利纳，就可以得到该专属巡视结果。"
 podintroductions.154.t: "你的故事就此展开"
 podintroductions.154.desc: "海德翁大人，由于拉兹科利纳亲王在[Glossary('蛰眠','game_concept_torpor_desc')]浪费的时间，您最近在波兰的影响力越来越大。随着您的影响力的增长，您所“照顾”的凡人的尖叫也在增加，这显然是最令人愉快的声音。您的堡垒总是需要更多的修缮，因此您显然需要更多的牲畜来剥皮和肢解以达到艺术目的。\n有什么办法能比粉碎拉兹科利纳和其他波兰篡位者，然后把他们可怜的城市纳入您的版图更有说服力呢？您毕竟是一个富有想象力的人，想想看，有这么多无助的凡人加入您的国度，您会做什么呢……"
 podintroductions.154.a: "艺术家的负担很重。"
 hedeon_intro_tooltip: "作为海德翁，当你折磨一个人的时候，你会得到巨量的压力缓解和一些密谋生活方式的经验。"
 podintroductions.155.t: "你的故事就此展开"
 podintroductions.155.desc: "沃拉克大人，作为活跃在特兰西瓦尼亚的棘秘魑最长子嗣，您承担了您$pod_clan$的精神领袖的角色。您建造的“血肉大教堂”加强了这一作用，这是血肉塑造艺术的一项杰出成就。\n不过，您曾经也是一股政治势力，而且您可能需要再次成为政治势力，因为您的同胞们受到了德意志梵卓及其睿魔尔盟友的攻击。很明显，您是唯一一个有足够影响力，来真正统一$pod_clan$的人。至于那些不同意的人呢？嘛，大教堂总是很饿……"
 podintroductions.155.a: "开门……"
 yorak_intro_tooltip: "作为沃拉克，只要你还掌控着大教堂，你就拥有着一项专属处决方式。"
 EXECUTION_YORAK: "喂给大教堂"
 cathedral_famished_modifier: "极饥的大教堂"
 cathedral_famished_modifier_desc: "在最近的开胃菜之后，大教堂想要更多。许多许多。"
 cathedral_hungry_modifier: "饥饿的大教堂"
 cathedral_hungry_modifier_desc: "随着可怜的灵魂被喂养到它永无止境的饥饿中，这个令人发疯的结构越发扩大了。"
 cathedral_satiated_modifier: "饱食的大教堂"
 cathedral_satiated_modifier_desc: "大教堂看上去保持着平静，若非那无数受害者的惨叫声。"
 podintroductions.156.t: "你的故事就此展开"
 podintroductions.156.desc: "令人畏惧的达瓦，基辅任由您摆布，您将在某天晚上向背叛您古老宗教的善变民众复仇。但更紧迫的事情还在眼前。\n您西边的棘秘魑军督领要求您效忠，但您拒绝了，因为您知道有比他们更强大的力量。俄罗斯著名的小祖母，芭芭雅嘎，正在接近，您可以感觉到。她是否在沉眠并不重要，您知道她是这些土地上唯一的女神，您也知道那些故事：她会保佑那些表现出适当敬意的人。好吧，您确信基辅的人们会很乐意成为祭品……"
 podintroductions.156.a: "听我说，祖母！"
 darvag_intro_tooltip: "作为达瓦，你具有一项专属处决方式。"
 EXECUTION_DARVAG: "献祭给芭芭雅嘎"
 baba_intrigued_modifier: "受鬼婆关注"
 baba_intrigued_modifier_desc: "芭芭雅嘎对你对她的大奉献表现出了兴趣。"
 baba_pleased_modifier: "芭芭雅嘎的赞许"
 baba_pleased_modifier_desc: "俄罗斯鬼婆对你的狂热奉献很欢喜。"
 baba_delighted_modifier: "最爱之孙"
 baba_delighted_modifier_desc: "很明显，你现在是她的最爱，能得到最棒赠礼的人。"
 podintroductions.157.t: "你的故事就此展开"
 podintroductions.157.desc: "莎格拉女士，随着您对波西米亚的控制不断加强，您了解到一个有趣的信息。布克迪拉卡，一个比您更年长的棘秘魑，最近在布拉格很活跃，直到他在与一些不知名的袭击者进行了一场激烈的战斗后陷入[Glossary('蛰眠','game_concept_torpor_desc')]。\n布克迪拉卡是个虐待狂和傲慢的疯子，但您不能否认他的力量和技能。如果您能救出他，至少在一段时间内，他可能会对一个盟友很友好。他的力量将是一笔巨大的财富，可以帮助您重新掌权……但这也可能在未来适得其反，布克迪拉卡自己也很有野心。"
 podintroductions.157.a: "怪物亦有荣誉。"
 podintroductions.157.b: "……这听起来像个很坏的主意。"
 podintroductions.158.t: "你的故事就此展开"
 podintroductions.158.desc: "令人畏惧的贾迈勒，只要提到您的名字，就会在试图入侵您的土地的不信教者心中产生恐惧。但这还不够。\n作为哈基姆圣裔战士种姓的领袖，您在$pod_clan$内是一个受人尊敬的强大人物，您必须利用这一事实来确保您的同胞们不会偏离真正的道路。太多相互竞争的派别和一个受惑的最长者，试图阻碍您对哈基姆圣裔的未来的独特看法。利用您的至高勇武和领导能力，他们徒劳的努力肯定会失败。"
 podintroductions.158.a: "通过外交或战争，我们将取得胜利。"
 jamal_intro_tooltip: "作为贾迈勒，你可以使用一项专属[character_interaction|E]，与任何非哈基姆圣裔的角色开始一场决斗。"
 POD_jamal_interaction: "不败者"
 POD_jamal_interaction_desc: "你将与该角色开始决斗。有一人将归于尘土。"
 podintroductions.159.t: "你的故事就此展开"
 podintroductions.159.desc: "达斯图尔大人，目前哈基姆圣裔$pod_clan$的混乱局面给您的失落部族带来了一些美好明天的希望。不过，您还是很担心。\n您发现一个名为“黑手”的末日密教组织的手下已经渗透到您的国度，目的不明，但可能是邪恶的。您可以对这个密教的所谓手下进行广泛的清洗，但这可能会被视为一种偏执和鲁莽的行为。另一个选择是对他们保持更宽松的监视，但这也可能让他们获得越来越大的影响力。"
 podintroductions.159.a: "让我们砍下这“黑手”"
 podintroductions.159.b: "他们还不是威胁……目前而言。"
 podintroductions.160.t: "你的故事就此展开"
 podintroductions.160.desc: "无畏的法蒂玛，到目前为止，您阻碍第四次十字军东征的任务取得了巨大的成功。但仍有工作要做。\n鹰巢已经发出了新的命令，您要确保滞留在安纳托利亚的十字军残部得到处理。然后，长者们希望您利用拜占庭帝国灭亡的混乱局面作为掩护，在该地区开辟一个新的封邑领地。这将成为一个伟大的缓冲国，防止法兰克进一步入侵您们的家园。\n可以肯定的是，这期望很大，但您不是以失败而闻名的。这一次您也不会让他们失望。"
 podintroductions.160.a: "我的使命很明确。"
 fatima_intro_tooltip: "作为法蒂玛，你就有一项要求你掌控安纳托利亚到1300的专属决议。"
 fatima_decision: "终结十字军"
 fatima_decision_tooltip: "法兰克人不属于此！"
 fatima_decision_desc: "第四次十字军东征的最后残余势力必须得到解决，来为哈基姆圣裔确保安纳托利亚。"
 fatima_decision_confirm: "使命完成"
 fatima_decision_effect_tooltip: "鹰巢向您送来了问候……和奖励。"
 podintroductions.161.t: "你的故事就此展开"
 podintroductions.161.desc: "睿智的阿什拉夫，哈基姆圣裔正处于动荡之中。您们$pod_clan$内部的派系斗争已经达到了沸点，您知道这是一些黑暗势力伺机而动，试图夺取$pod_clan$控制权的时刻。您必须要坚强起来。\n值得庆幸的是，您已经做好了准备。您是一个无与伦比的血术士，您的神秘学知识在未来的混乱时期肯定会派上用场。培养这种力量，研究您的敌人，然后果断出击。只有您能保护哈基姆圣裔免受潜伏在内部的恐怖之害。"
 podintroductions.161.a: "谨慎的策划将确保胜利"
 alashrad_intro_tooltip: "作为阿什拉夫，你有一个特殊的决定，允许你每十年提高一次你的学识。"
 alashrad_decision: "学无止境"
 alashrad_decision_tooltip: "我必须找到答案……"
 alashrad_decision_desc: "阿什拉夫你知道很多东西，但总是有更多的物事需要破译和理解。你的追求将永远不会结束。"
 alashrad_decision_confirm: "……就差那么点了"
 broken_alamut_modifier: "最弱的最长者"
 broken_alamut_modifier_desc: "你对鹰巢的最长者的宣称是极其脆弱的。没有人尊重你，你对局势的控制也在不断恶化。"
 podintroductions.162.t: "你的故事就此展开"
 podintroductions.162.desc: "纳穆尔图姆女士，情况很糟糕。哈基姆圣裔没有接受您作为最长者的身份。$pod_clan$四分五裂。\n您控制了鹰巢本身，但并没有控制更多，其他长者对您的权威口惠而实不至。情况越来越接近于内战。也许在这时，它已经是不可避免的。\n如果您想挽回您的地位，您将不得不迅速而果断地出击，因为哈基姆的子嗣不尊重软弱。"
 podintroductions.162.a: "吾即哈基姆之摄政！"
 nakurtum_intro_tooltip: "作为纳穆尔图姆，你有两项专属决议，允许你摆脱开始的负面修正。"
 nakurtum_losing_control_modifier: "失控"
 nakurtum_losing_control_modifier_desc: "你几乎无法控制鹰巢本身。其他一切都在从你薄弱的掌握中滑落。"
 nakurtum_eldest_decision: "赢得尊重"
 nakurtum_eldest_decision_tooltip: "我将向他们证明我的价值！"
 nakurtum_eldest_decision_desc: "如果你想作为哈基姆圣裔的最长者长久地生存下去，你就必须证明自己。主张对哈基姆派的家园进行控制是一个好的开始。"
 nakurtum_eldest_decision_confirm: "我有自信"
 nakurtum_control_decision: "稳定你的统治"
 nakurtum_control_decision_tooltip: "我将向他们证明我的价值！"
 nakurtum_control_decision_desc: "如果你想作为哈基姆圣裔的最长者长久地生存下去，你就必须证明自己。主张对哈基姆派的家园进行控制是一个好的开始。"
 nakurtum_control_decision_confirm: "我有自信"
 podintroductions.163.t: "你的故事就此展开"
 podintroductions.163.desc: "艾哈迈德大人，您参与了橄榄会议的创建，希望在该地区实现持久和平，但您仍有一些保留。也许您必须找到另一种方式，一种可能迫使您更多地采取行动的方式。\n可悲的是，您的信仰将您与其他$pod_clan$族人隔离开来。因此，您可能不得不依靠寻找有前途的学徒，向他们介绍您独特的哲学。这将是一项漫长的任务，但为了圣地的和平？这是很值得的。"
 podintroductions.163.a: "世上最重要的任务"
 ahmed_intro_tooltip: "作为艾哈迈德，只要你还具有基督之道信仰，你总是会在教育子嗣的信仰教学部分取得成功。"
 podintroductions.164.t: "你的故事就此展开"
 podintroductions.164.desc: "忒弥斯大人，您最近取得了相当大的进展。哈基姆圣裔比以前更加分裂，这意味着您的“刀锋之网”可以比以前发挥更大的影响力。不过，在$pod_clan$准备好迎接您的主人归来之前，仍有许多工作要做。\n注意您周围的其他派别，迅速粉碎它们。您不能让另一个长者接管哈基姆圣裔。一旦鹰巢被您的同胞们完全掌控，您可以确信，黑牧人会给予您丰厚的回报，难道您不是他最信任的仆人吗？"
 podintroductions.164.a: "应许的时代将会来临。"
 thetmes_intro_tooltip: "作为忒弥斯，如果你完成了“神之梦”目标，你将获得额外的奖励。"
 pod1230objectives.24.customthetmes: "作为忒弥斯，你获得了额外的奖励。乌尔·舒尔吉为你的持续服务而祝福你。"
 podintroductions.165.t: "你的故事就此展开"
 podintroductions.165.desc: "令人畏惧的莫罗，您在冈格罗$pod_clan$中的名声与日俱增，这要归功于您最近对黑十字的梵卓和军督领的棘秘魑的胜利。但这仅仅是一个开始。\n如果您想真正统一$pod_clan$，您就必须继续朝这个方向前进，证明您确实是最强大的战争领袖。您已经很出名的一个手段是，您习惯于不请自来地潜行到敌人的宫廷上，在离开之前展示一下武力。这种策略在过去对您很有帮助，而且可以继续这样做。"
 podintroductions.165.a: "兽之纪元即将到来。"
 morrow_intro_tooltip: "作为莫罗，你有一项针对有地统治者的专属[character_interaction|E]，让你可以通过实力彰显吓唬他们。"
 show_of_force_morrow_modifier: "实力彰显"
 show_of_force_morrow_modifier_desc: "该角色已经被莫罗的突然出现和在宫廷上的悄悄威胁吓坏了。"
 POD_morrow_interaction: "彰显实力"
 POD_morrow_interaction_desc: "通过突然出现在其的宫廷来吓唬这个统治者。"
 podintroductions.166.t: "你的故事就此展开"
 podintroductions.166.desc: "维克多大人，您的女主人芭芭雅嘎将她的国度托付给您，因为她正在从对她[Glossary('尊长','game_concept_Sire_desc')]的可怕战斗中恢复过来。您不会让人失望的。\n事实证明，基督教和东方部族的兴起是一个很大的问题，您必须迅速稳固您周围的环境，让祖母能够安然入睡。还要注意您西边的突伽·辛，他是芭芭雅嘎的长期对手。\n如果您设法处理所有这些威胁，毫无疑问，祖母会很高兴并给予您相应的奖励……"
 podintroductions.166.a: "好好睡吧，祖母，我在看着。"
 viktor_intro_tooltip: "作为维克多，如果你完成了“体贴的祖母”目标，你将获得额外的奖励。"
 pod1230objectives.20.custom.viktor: "作为维克多，你获得了额外的奖励。芭芭雅嘎对她的最宠侍从非常满意。"
 podintroductions.167.t: "你的故事就此展开"
 podintroductions.167.desc: "布伦希尔德女士，[Glossary('英灵战士','game_concept_einherjar_desc')]正在消亡。您们的信仰正在被白神和他的追随者所取代，您们的同胞们已经放弃了希望。维特本人，这个被奥丁选中在这个混乱的时代领导您们的人，似乎已经接近崩溃的边缘。您必须采取行动。\n您们非常尊重维特，几个世纪以来他都是一个值得信赖的朋友，但您们现在必须迫使他放弃他作为米德加尔德崇高之主的地位，以免他把您们都带向毁灭。现在是女武神在您的带领下拯救斯堪的纳维亚的时候了！"
 podintroductions.167.a: "为了大家好，我必须把维特推到一边。"
 brunhilde_intro_tooltip: "作为布伦希尔德，在未来几个月里，你将有几个事件让你能篡夺米德加尔德[title|E]。"
 PODcanon_chars.34.t: "信仰与力量"
 PODcanon_chars.34.desc: "你现在已经向米德加尔德的其他居民表明了你的野心：你必须尽快取代维特成为领袖。这在你的同胞中引发了一些争论，但最初的支持率很高，尤其是在那些仍想反对基督教的人中。\n维特本人对你的举动其实并不感到惊讶，但他敦促你重新考虑你的立场。他毕竟是被奥丁本人选中的人，违背全父的意志可能比倒向白神更糟糕。"
 PODcanon_chars.34.a: "奥丁会理解的。"
 brunhilde_exit_tooltip: "你放弃了控制米德加尔德的计划。"
 PODcanon_chars.34.b: "……他言之在理。"
 PODcanon_chars.35.t: "传统与力量"
 PODcanon_chars.35.desc: "出现了一个反对你夺权的强大对手：芬兰自由邦的青之卡尔。这位英勇的[Glossary('英灵战士','game_concept_einherjar_desc')]是一位坚定的传统主义者，他不赞成你的行动，理由和维特一样：奥丁没有选择你，甚至可能北欧信仰的终结就是你的宿命。\n在这个阶段没什么能改变他的想法，你要么接受他的敌意，要么完全放弃你的计划。"
 PODcanon_chars.35.a: "我铸就我自己的命运。"
 PODcanon_chars.35.b: "……他言之在理。"
 PODcanon_chars.36.t: "新的萨迦传奇"
 PODcanon_chars.36.desc: "你现在已经强大到足以称霸米德加尔德，而且值得庆幸的是，维特并不想和你比拼，也不想发起一场血腥的内战。现在你要考虑的最后一件事是如何处理你的胜利。\n按照惯例，你应该羞辱维特和他的软弱政策，这样你就可以从头开始。但把这位强大的奥丁子嗣留在你身边也会有好处。"
 PODcanon_chars.36.a: "败者为耻！"
 PODcanon_chars.36.b: "让我们合作吧。"
 podintroductions.168.t: "你的故事就此展开"
 podintroductions.168.desc: "邓洛普大人，您等待复仇的机会已经很久了。密特拉杀死了您心爱的女儿，他将为这次谋杀付出沉重的代价。您毕竟不是以宽恕或仁慈著称的。\n这将是一个艰难的过程，因为密特拉在不列颠群岛根深蒂固，他的后裔保护着他。这个想法实际上让您暂停了……也许您可以针对他的子嗣，让他忍受您在那个决定性夜晚所感受到的痛苦的一小部分？"
 podintroductions.168.a: "你不会被忘记的，玛丽。"
 dunlop_intro_tooltip: "作为邓洛普，你有一项杀死密特拉和他的孩子们的专属决议。"
 mary_dunlop_avenged_modifier: "玛丽之仇已报"
 mary_dunlop_avenged_modifier_desc: "复仇的感觉真爽。每个人都可以看到，曾经的那位可怕的邓洛普伯爵又回来了。"
 dunlop_decision: "复仇与清算"
 dunlop_decision_tooltip: "亲爱的，宝贝的玛丽·伊丽莎白……"
 dunlop_decision_desc: "密特拉和他的子嗣将为杀害你心爱的女儿付出沉重的代价。清算正在向他们降临。"
 dunlop_decision_confirm: "为纪念你……"
 dunlop_custom_decision: "[GetScriptedCharacterByHistoryID('505071').GetFirstName]必须死"
 dunlop_custom_decision2: "[GetScriptedCharacterByHistoryID('790820').GetFirstName]，密特拉最宠的最幼子嗣，必须死。"
 dunlop_custom_decision3: "[GetScriptedCharacterByHistoryID('790134').GetFirstName]，密特拉最忠诚且付出最多的子嗣，必须死。"
 dunlop_custom_decision4: "[GetScriptedCharacterByHistoryID('505109').GetFirstName]，密特拉的最长子嗣，必须死"
 podintroductions.169.t: "你的故事就此展开"
 podintroductions.169.desc: "喀喇大人，您正带领利沃尼亚野者对抗西方的持续攻击。到目前为止，局势得到了控制，但您的国度再次受到攻击只是时间问题。您心爱的德维拉提出了一个解决方案。\n利用她与这片土地上的神——特亚维的神秘联系，她可以制定一个仪式，给您巨大的力量，也许足以拯救您的人民。但代价是……代价是德维拉的生命。仅仅是想到这一点，您就会心碎。\n您会允许吗？"
 podintroductions.169.a: "不！我需要你！"
 podintroductions.169.b: "你不会被忘记的，亲爱的。"
 podintroductions.170.t: "你的故事就此展开"
 podintroductions.170.desc: "无畏的瓦尔普尔加，诸神黄昏即将到来，但您已经准备好利用它了。对于像您这样的熟练战士来说，将有很多机遇。有人会说这是对“真正的北欧信仰”的叛逆，但您更愿意说这只是对这个变化的时代的一种适应。\n在您心爱的船“红托尔号”上，您已经准备好为财富和荣耀而进行掠夺和抢劫。如果旧神不同意，他们可以随时来这里，当着您可靠的锤子的面说！"
 podintroductions.170.a: "起航！"
 valborg_intro_tooltip: "作为瓦尔普尔加，你有一项赚取一些“小钱”的专属小决议。"
 valborg_decision: "佣兵合约"
 valborg_decision_tooltip: "维京待雇！"
 valborg_decision_desc: "对于经验丰富的北欧战士组成的艰苦团队来说，机运无处不在。"
 valborg_decision_confirm: "指明我们的目标！"
 valborg_decision_effect_tooltip: "你将得在合约间选择。"
 red_thor_weakened_modifier: "红托尔号的虚弱"
 red_thor_weakened_modifier_desc: "你的一些战士正在执行雇佣兵任务，这小小削弱了你对你的领地的控制。"
 red_thor_depleted_modifier: "红托尔号的空虚"
 red_thor_depleted_modifier_desc: "你的许多战士都在执行雇佣兵任务，削弱了你对你的领地的控制。"
 red_thor_empty_modifier: "红托尔号的空无"
 red_thor_empty_modifier_desc: "你的战士们都在执行雇佣兵任务，严重削弱了你对你的领地的控制。"
 PODcanon_chars.37.t: "红托尔号起航"
 PODcanon_chars.37.desc: "你的船员准备出发了，许多外国$pod_cainites$急于征召他们参加自己的小规模战争。你必须做出的选择是关于契约的难度。难度越大，奖励就越多，但你必须投入更多的战士来完成任务。如果他们在海外，他们显然不能再在国内帮助你。"
 PODcanon_chars.37.a: "简易就行了。"
 PODcanon_chars.37.b: "这个似乎很适度。"
 PODcanon_chars.37.c: "最难的！"
 PODcanon_chars.37.d: "我们现在不出航。"
 podintroductions.171.t: "你的故事就此展开"
 podintroductions.171.desc: "托马斯大人，尽管您尽了最大努力，君士坦丁堡还是落入了拉丁人之手。但事情还没有结束。\n您不是那种会放弃的人，即使大多数希腊$pod_cainites$都流亡了，您仍然会战斗。这肯定是一场艰苦的战斗，但您有几十年的经验作为这个城市的主要执法者。您将使拉丁$pod_cainites$的亡生陷入地狱，然后出击，一劳永逸地解决他们！"
 podintroductions.171.a: "清算将来。"
 thomas_intro_tooltip: "作为托马斯，你有一项针对有地统治者的专属[character_interaction|E]，让你可以在战争前削弱他们。"
 guerilla_thomas_modifier: "希腊冈格罗游击战"
 guerilla_thomas_modifier_desc: "被组织良好的希腊冈格罗盯上，该角色很难保持对其国度的控制。"
 POD_thomas_interaction: "游击战"
 POD_thomas_interaction_desc: "通过发动一些游击行动来扰乱这个统治者的国度。"
 podintroductions.172.t: "你的故事就此展开"
 podintroductions.172.desc: "特黎佛撒女士，卡米拉已经苏醒，并再次控制了罗马，正如您所预料的那样。您曾经是他的密友，也是他信任的顾问，凭借这个角色，您发挥了巨大的影响力。也许您可以再次这样做？\n您可以让强大的梵卓知道您的存在，再次为他服务。这将提供一些有用的保护，以抵御南方狡诈的勒森魃。或者您可以继续自己的事业，也许这次卡米拉并不是您未来的一部分。"
 podintroductions.172.a: "欢迎回来，执政官。"
 podintroductions.172.b: "他的时代过去了。"
 podintroductions.173.t: "你的故事就此展开"
 podintroductions.173.desc: "春军女士，您很愤怒。在您多年的流浪和宣扬自由的过程中，您从未见过像这个“睿魔尔家族”这样可憎的东西。这些法师都被压迫在一个暴虐的议会之下，更糟糕的是，他们被迫忍受血缚，直到最后一人！这不能再继续下去了。\n幸运的是，睿魔尔显然低估了您，还没有真正注意到您的存在和影响。这是一个从内部打破这个“金字塔”的好机会。这将是您的杰作，一旦您完成了，整个$pod_cainite$世界将涌现出希望！"
 podintroductions.173.a: "让我们打破他们的枷锁。"
 vasantasena_intro_tooltip: "作为春军，你有一项专属决议，如果成功的话，将允许你创造你自己的信仰。"
 vasantasena_decision: "打破金字塔"
 vasantasena_decision_tooltip: "这个可憎的东西必须被打倒！"
 vasantasena_decision_desc: "睿魔尔家族反对你所珍视的一切。你必须采取行动。"
 vasantasena_decision_effect_tooltip: "你编译了你自己的心路，为将来的进一步解放铺平道路。"
 vasantasena_decision_confirm: "金字塔已被推倒！"
 podintroductions.174.t: "你的故事就此展开"
 podintroductions.174.desc: "娄希，您与深渊主人的契约进展很顺利。您已经向他宣誓效忠，他对您迄今为止的工作感到满意，但还有更多的工作要做。\n您所居住的遥远的北方是与世隔绝的，这对孤立很有帮助，但限制了您的实验规模，特别是关于您精心制作的[Glossary('遗传血仆','game_concept_revenant_desc')]——凯斯基宁。也许您可以扩大您的国度？您知道您主人的仆人们会很乐意为这样的努力提供帮助……"
 podintroductions.174.a: "机遇，机遇！"
 louhi_intro_tooltip: "作为娄希，只要你还留在深渊之路上，你就能通过决议生成渊影，一种本来是勒森魃独有的兵士。"
 louhi_decision: "阴暗业务"
 louhi_decision_tooltip: "你在暗处有些朋友。"
 louhi_decision_desc: "深渊主人是慷慨的。请求他的支持。"
 louhi_decision_effect_tooltip: "你将选择召唤多少只渊影。"
 louhi_decision_confirm: "听我说！"
 PODcanon_chars.38.t: "阴暗业务"
 PODcanon_chars.38.desc: "你已经准备好向深渊主人献上你的祭品了。你想尝试召唤他的多少个仆人？"
 PODcanon_chars.38.a: "只是其中的一些。"
 PODcanon_chars.38.b: "更多！"
 PODcanon_chars.38.c: "所有！"
 PODcanon_chars.38.d: "转念一想……"
 louhi_small_shades_tt: "一组渊影会被加入到你的可用兵士中。"
 louhi_medium_shades_tt: "两组渊影会被加入到你的可用兵士中。"
 louhi_high_shades_tt: "三组渊影会被加入到你的可用兵士中。"
 podintroductions.175.t: "你的故事就此展开"
 podintroductions.175.desc: "阿纳托尔大人，您一直在做天主之事，即羞辱了巴黎的$pod_cainite$异端，但您的任务还没有完成。这些南方的土地上充满了隐藏在清洁派背后或中间的异端。\n您已经获得了在该地区活动的权利，您相信您会及时成功。然而，腐化的根源可能比您最初想象的更深，您可能需要把一些亲王从他们的办公室里赶走，以揭开他们。在那之后……天主会选择您的下一步道路，就像祂总是这样。"
 podintroductions.175.a: "让我们开始吧。"
 anatole_intro_tooltip: "作为阿纳托尔，你有一项专属小决议来理解天主对你的意愿。"
 anatole_decision: "天主的意愿"
 anatole_decision_tooltip: "祂对我有什么计划？"
 anatole_decision_desc: "你的信念很强，但祂的做事方法很神秘。你必须抽出时间来理解它们。"
 anatole_decision_effect_tooltip: "你会获得一个愿景，可能是好的，也可能是坏的。"
 anatole_decision_confirm: "前进的道路……"
 PODcanon_chars.39.t: "天主之怒"
 PODcanon_chars.39.desc: "你做错了什么吗？还是只是祂对你不满意？你可能永远不知道，但你知道的是，天主对你不满意。你刚刚收到的恐惧和愤怒的幻象很清楚：你必须改变你的做事方式。"
 PODcanon_chars.39.a: "我必须得做的更好！"
 PODcanon_chars.39.b: "在我得到救赎之前，我不会休息。"
 PODcanon_chars.39.c: "我尽力了！"
 PODcanon_chars.40.t: "天主之狂热"
 PODcanon_chars.40.desc: "你总是可以改进和做得更多。这就是你收到的最新异象所提醒你的。你的狂热被重新激发，你的目标感从未如此强烈。\n你将把这个巨大的恩惠引向何处？"
 PODcanon_chars.40.a: "了解圣经"
 PODcanon_chars.40.b: "当众传教。"
 PODcanon_chars.40.c: "理解我的定位。"
 PODcanon_chars.41.t: "天主的意愿"
 PODcanon_chars.41.desc: "由于最近的一个异象，你在附近发现了一处吸血鬼异端的巢穴。可悲的是，这个人隐藏在众目睽睽之下，与这片土地上的凡人统治者有着强大的联系。对他采取行动肯定会引起一些不必要的注意。\n但你真的能拒绝对这样一位受诅的灵魂施用天主的正义吗？"
 PODcanon_chars.41.a: "他的灵魂将得到净化。"
 PODcanon_chars.41.b: "救赎仍然是一个可选项。"
 PODcanon_chars.41.c: "这次我不能采取行动。"
 broken_talmahera_modifier: "难当的德尔罗"
 broken_talmahera_modifier_desc: "你对塔尔玛埃拉的德尔罗（被服侍者）的宣称是非常弱的。没有人尊重你，你对局势的控制也在不断恶化。"
 podintroductions.176.t: "你的故事就此展开"
 podintroductions.176.desc: "以利米勒大人，在您相当多的迷茫徘徊之后，您最终来到了这个名为塔尔玛埃拉的奇怪死亡密教。从您目前看到的情况来看，他们有自己的怪异想法，比如崇拜[Glossary('上古耆宿','game_concept_antediluvian_desc')]。\n您的圣经级年龄和相当大的个人力量使您被这个密教组织所恐惧和害怕，他们已经在您周边听从您和您的命令。也许这就是您至今为止错过的您的亡生的目的？如果您决定留在这里，您将不得不迅速巩固您对他们的薄弱控制。"
 podintroductions.176.a: "奇怪的发展。"
 elimelech_intro_tooltip: "作为以利米勒，你有两个专属决议，可以让你摆脱开始时的负面修正。"
 elimelech_losing_control_modifier: "失控"
 elimelech_losing_control_modifier_desc: "你几乎无法控制你的王座室本身。其他一切都在从你薄弱的掌握中滑落。"
 elimelech_delroh_decision: "赢得你的权力"
 elimelech_delroh_decision_tooltip: "我将向他们证明我的领导能力！"
 elimelech_delroh_decision_desc: "如果你想长期作为塔尔玛埃拉的德尔罗（被服侍者）活下去，你就得证明自己。主张对周围土地的控制是一个好的开始。"
 elimelech_delroh_decision_confirm: "尊重我的权威！"
 elimelech_control_decision: "稳定你的统治"
 elimelech_control_decision_tooltip: "我将向他们证明我的领导能力！"
 elimelech_control_decision_desc: "你对神秘的塔尔玛埃拉的统治是一个奇怪的现象，没有人期望它能持续很长时间。证明他们错了。"
 elimelech_control_decision_confirm: "我还在这！"
 elimelech_custom_decision: "该决议只有在1300后开始才能达成"
 podintroductions.177.t: "你的故事就此展开"
 podintroductions.177.desc: "泽特勒大人，您现在明白了很多。三头巨龙已经向您展示了真相。\n您试图在睿魔尔前防护萨洛比的举动是天真的，因为到头来，您不就是灰烬吗？在这可恶的存续中只有一个不变的东西，那就是痛苦。感谢您的新后援的许多祝福，您将学会所有的秘密，并成为施展它的终极艺术家。\n尖叫将永远不会停止，但您现在将理解它们。"
 podintroductions.177.a: "终于有了明确的答案。"
 zettler_intro_tooltip: "作为泽特勒，你有一项能调用三头巨龙的示相之一来帮助你的决议。"
 zettler_beast_of_war_modifier: "战争之兽"
 zettler_beast_of_war_modifier_desc: "最年轻的幼弟，一个由不受约束的暴怒和愤怒组成的生物。"
 zettler_eater_of_souls_modifier: "噬魂者"
 zettler_eater_of_souls_modifier_desc: "中间的兄弟，也就是最终会吞噬一切者。"
 zettler_defiler_modifier: "亵渎者"
 zettler_defiler_modifier_desc: "最年长的兄长，能败坏它所接触的一切。"
 zettler_decision: "三兄弟"
 zettler_decision_tooltip: "巨龙对你言语，对你的奉献感到高兴。"
 zettler_decision_desc: "巨龙的三个头分别代表不同的示相和不同的好处，可以用于你的目标。"
 zettler_decision_effect_tooltip: "在未来五年内，你将在这三大示相中选择其一。"
 zettler_decision_confirm: "神圣之助……"
 PODcanon_chars.42.t: "三头巨龙"
 PODcanon_chars.42.desc: "你的后援是一位强大的实体，但即使对你来说也是很神秘。到目前为止，你所了解的是它分为三个“头”，它们几乎是不同的生物，但在某种程度上仍然是整体的一部分。\n每一个都渴望你的奉献，并承诺如果你遵从的话会有回报。"
 PODcanon_chars.42.a: "战争之兽"
 PODcanon_chars.42.b: "噬魂者"
 PODcanon_chars.42.c: "亵渎者"
 PODcanon_chars.42.d: "我现在不做选择。"
 podintroductions.178.t: "你的故事就此展开"
 podintroductions.178.desc: "阿多拉娜女士，当$pod_cainite$异端在您周围崩溃时，尽管您年纪轻轻，却利用这场混乱在挪得教区中获得了一个席位。您毕竟知道如何在糟糕的情况下做到最好。\n自从您来到这里，您就对目前的挪得大主教非常怀疑，他似乎对您们教会的危急状况不以为然，很奇怪。也许现在是更换领导层的时候了？您可以在教廷的下一届会议上提出这个问题，确保每个人都知道您的野心……显然，这可能是一把双刃剑。"
 podintroductions.178.a: "我们需要变革！"
 podintroductions.178.b: "大主教有我的全力支持。"
 josef_terrified_modifier: "压力之下"
 josef_terrified_modifier_desc: "你冥冥感觉到，莎格拉要抓到你了。你得立刻往后看！"
 podintroductions.179.t: "你的故事就此展开"
 podintroductions.179.desc: "约瑟夫大人，在您反抗上一任亲王的暴政后，您一直在努力确保布拉格的安全，但一个新问题已经出现了。\n在古代统治波希米亚的莎格拉已经苏醒，并轻易地夺取了该地东部地区的控制权。她肯定会想要更多，而您理所当然地害怕这样一个古老的存在能对您做什么。您必须找到一种方法来除掉她！"
 podintroductions.179.a: "还有希望！"
 josef_intro_tooltip: "作为约瑟夫，你可以通过达成你的专属决议，来提高你的起始修正。"
 josef_breathing_modifier: "喘息空间"
 josef_breathing_modifier_desc: "莎格拉不在了，你可以重新呼吸了……非字面意思。"
 josef_decision: "波希米亚的命运"
 josef_decision_tooltip: "她要来了！"
 josef_decision_desc: "莎格拉，这个曾经以铁腕统治波西米亚的远古恐怖，又回来了。她肯定不会欣赏你占有她这么多的“正当”土地。"
 josef_decision_confirm: "……好险"
 josef_custom_decision: "[GetScriptedCharacterByHistoryID('790946').GetFirstName]必须死"
 podintroductions.180.t: "你的故事就此展开"
 podintroductions.180.desc: "塔利克大人，麦加和麦地那安全地掌握在虔诚的[Glossary('阿什拉派','game_concept_ashirra_desc')]手中，这在很大程度上要感谢您。但您的工作还没有结束。\n其他重要城市，如开罗、大马士革和科尔多瓦，仍然处于冲突之中，或被宗教的敌人彻底控制。不能让这种情况继续下去！您们知道自己的职责，不会让您们的工作继续下去。您们知道自己的职责，在[Glossary('阿什拉派','game_concept_ashirra_desc')]能保护从阿拉伯到伊比利亚的信徒之前，您们不会停止。"
 podintroductions.180.a: "朝觐必胜。"
 tarique_intro_tooltip: "作为塔利克，你有一项专属决议，即确保伊斯兰教最重要的城市。"
 tarique_guardian_modifier: "圣城守护者"
 tarique_guardian_modifier_desc: "守护者的威望和虔诚远近闻名。是少有的真正献身于某项功业的$pod_cainites$之一。"
 tarique_decision: "圣城守护者"
 tarique_decision_tooltip: "你的使命很明确。"
 tarique_decision_desc: "你已经在麦加的恩典下重生了，你想让别人也有这种受祝福的经历。因此，必须保护信仰中最重要的城市。"
 tarique_decision_confirm: "我的使命已完成"
 podintroductions.181.t: "你的故事就此展开"
 podintroductions.181.desc: "马拉希底斯大人，徘徊和绝望的时候已经过去。您必须采取行动。\n拉丁人在君士坦丁堡站稳了脚跟，这种对米迦勒回忆的侮辱决不能容忍。您是他的岩石，他的门徒，现在您必须通过拯救他的遗产来报答他的恩情。\n君士坦丁堡是永恒的。幻梦是永恒的。要确保那些该死的拉丁人很快就能明白这一点。"
 podintroductions.181.a: "我们不值得，牧首。"
 malachite_intro_tooltip: "作为马拉希底斯，如果你完成“幻梦再临”目标，你会得到额外的奖励。"
 pod1230objectives.6.c: "他们知道我是谁。"
 pod1230objectives.6.custom.malachite: "这个选项可用是因为你扮演着马拉希底斯。"
 podintroductions.182.t: "你的故事就此展开"
 podintroductions.182.desc: "谟涅摩女士，您有多处得注意。\n一方面，萨莉安娜政变的后果使法兰西处于弱势地位。您有很多人脉和足够的影响力，您可以利用这一点，最终让这片土地回归到它的古老根基。\n另一方面，您终于找回了您的姐妹。虽然苏利维伊被数个世纪的梵卓调教得彻底崩溃了，而且几乎不认识您。您曾经深爱着她，帮助她也许可以恢复她的记忆。但您不能在做这一艰巨任务的同时还进入法兰西的政治舞台。"
 podintroductions.182.a: "家人就是家人。"
 podintroductions.182.b: "那些时刻已经一去不返了。"
 podintroductions.183.t: "你的故事就此展开"
 podintroductions.183.desc: "卢卡斯大人，尽管被一位诺斯费拉图初拥，您还是设法保存了您完美的美貌……但有代价。您的魔邪赞助要求在您存续的第一个百年里给出百条灵魂，您已经完成了，但是……他现在想要更多，而且速度要更快。\n但您没有选择，因为若您能保持您的年轻外表，任何牺牲都是值得的。现在是时候开启您的溺亡修道院并扩张了。只要您的恩人渴望得到更多，您就会需要更多的人被诱骗和腐蚀。他很快就会满足的……\n对吧？"
 podintroductions.183.a: "完美之化身。"
 lukas_intro_tooltip: "作为卢卡斯，你的魔邪赞助会定期要求你献祭你的首都发展度（如果足够）或随机数位宫廷成员。你可以拒绝，但卢卡斯的理智可能无法承受再一次失去美貌。"
 PODcanon_chars.43.t: "完美的代价"
 PODcanon_chars.43.desc: "你的后援回来了，提醒你必须偿还的债务。必须做出献祭，莫有妥协，以挽救你的无瑕的皮肤。\n如果你的首都人口足够多，你可以献祭其中一些。否则，你将不得不让恶魔从你的宫廷中挑选。或者……你可以完全拒绝玩这个可怕的游戏，但你知道其代价……"
 PODcanon_chars.43.a: "谁会怀念一些愚蠢的凡人呢？"
 PODcanon_chars.43.b: "廷臣，他们有什么用？"
 PODcanon_chars.43.c: "……我不能这样继续下去了。"
 lukas_sacrifice_dev_tt: "你必须有一个发展度超过5的首都，才能在未来的要求中保有这个选项。"
 gregor_knight_modifier: "女士的骑士"
 gregor_knight_modifier_desc: "格雷戈尔生活在自己的幻想世界里，他必须永远不离开他心爱的女士。"
 podintroductions.184.t: "你的故事就此展开"
 podintroductions.184.desc: "令人畏惧的格雷戈尔，您终于为您的生活找到了一个目标。那些可悲的条顿骑士们太害怕您的力量而不接受您，但荆棘女士却不同。\n她不在乎您那所谓的“残忍”，甚至让您觉得比以前更强大。她需要一个勤奋的勇士，而您就是那个被选中的人。但她似乎有占有欲，不喜欢您离她太远，从长远来看，这可能是一个问题。\n没关系，您还是可以以她的名义杀戮怪物！"
 podintroductions.184.a: "为完美女士而设的完美骑士。"
 gregor_intro_tooltip: "作为格雷戈尔，你有一项专属小决议，允许你向女士寻求更多的帮助，或者与她断绝关系。"
 gregor_decision: "与女士见面"
 gregor_decision_tooltip: "我是她忠实的仆人。"
 gregor_decision_desc: "女士赋予了你力量，但如果你要，她可以帮助你更多。如果她对你的占有欲太强，你也可以尝试与她断绝关系。"
 gregor_decision_confirm: "为您服务"
 gregor_decision_effect_tooltip: "你将与女士见面。她可以在一段时间内赋予你力量，或者你可以与她断绝关系。"
 PODcanon_chars.44.t: "荆棘女士"
 PODcanon_chars.44.desc: "在她的森林深处，女士在等待你，就像你第一个见到她的晚上一样美丽。她微笑着，热情地感谢你的持续服务。\n作为温柔善良的后援，如果你有任何要求，她无疑会倾听你的请求。或者她可能有自己的要求。"
 PODcanon_chars.44.a: "我谦卑地请求您的祝福。"
 PODcanon_chars.44.b: "新的仆人？当然行，我的女士。"
 PODcanon_chars.44.c: "这种疯狂举动必须结束！"
 gregor_briey_tooltip: "你必须控制布里埃伯爵领，才能确保这选项可用。"
 PODcanon_chars.44.d: "我将在其他时候拜访她。"
 gregor_is_done_tooltip: "你今后将无法再与女士互动。"
 podintroductions.185.t: "你的故事就此展开"
 podintroductions.185.desc: "著名的仄利俄斯，您已经被称为黑夜世界中最灵巧的建筑师。几十年来，您为不死族领主和女士们建造城堡和庄园。然而，您真正的杰作仍未被显现。\n一种预感将您引向特兰西瓦尼亚，那里的土地本身似乎……与众不同。这些奇怪的地脉能量渴望被您的巧手所驾驭，而您已经迫不及待地想开始了。"
 podintroductions.185.a: "最好的材料？"
 zelios_intro_tooltip: "作为仄利俄斯，你具有专属建筑——仄利俄斯工坊。"
 building_type_architect_workshop_01: "仄利俄斯工坊"
 building_type_architect_workshop_01_desc: "#F 每一座建筑都是从一位好工匠手中的好工具开始的。#!"
 building_architect_workshop_01: "仄利俄斯工坊"
 building_architect_workshop_01_desc: "仄利俄斯在这里有自己的工场，为他的计划和学徒们准备一些即将到来的高超的建筑工程。"
 podintroductions.186.t: "你的故事就此展开"
 podintroductions.186.desc: "查古拉普夏大人，您知道您的职责。\n战争是您的血液，您的[Glossary('尊长','game_concept_Sire_desc')]把为雷伏诺绝对确有印度这一崇高而又困难的任务交给了您。受诅的[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]是强大的对手，其他印度$pod_cainites$不服从您的正义领导也无济于事。没关系，您迟早会取得胜利的。\n您是您的$pod_clan$坚定的摄政和战帅。准备好您的军队，集结您的部队，向胜利迈进！"
 podintroductions.186.a: "我们的宿命将用血写成。"
 chandraputra_intro_tooltip: "作为查古拉普夏，你具有一项提高你军事相关技巧的专属小决议。"
 chandraputra_decision: "战争的鼓声"
 chandraputra_decision_tooltip: "战争是一件复杂的事情，你必须做好准备。"
 chandraputra_decision_desc: "从很久以前的凡人时代起，你就一直是战争之主。尽管如此，仍有改进的余地。"
 chandraputra_decision_confirm: "老将军配新战术"
 chandraputra_decision_effect_tooltip: "在接下来的五年里，你将把精力集中在与战争有关的特定事务上，来获得一些加值。"
 chandraputra_martial_modifier: "战争之主"
 chandraputra_martial_modifier_desc: "查古拉普夏领导的军队似乎有超自然的速度，几乎不需要喘息就能压上。"
 chandraputra_knights_modifier: "激烈的演练"
 chandraputra_knights_modifier_desc: "你的勇士们永远不会变得足够好到能满足你的眼光。但他们可以通过一些老式的演练来接近它。"
 PODcanon_chars.45.t: "战争的鼓声"
 PODcanon_chars.45.desc: "即使你具有丰富的战争经验也不一定足以确保胜利。总是有新的战术需要研究，新的训练方法需要设计，或者新的战斗计划需要制定。你必须保持勤奋。"
 PODcanon_chars.45.a: "兵贵神速。"
 PODcanon_chars.45.b: "我现在就想准备一场模拟战役！"
 PODcanon_chars.45.c: "我想知道有关最近的凡人战役的消息。"
 PODcanon_chars.45.d: "你还自称是勇士？"
 podintroductions.187.t: "你的故事就此展开"
 podintroductions.187.desc: "卡门尼塔女士，您一直在努力推广您的新雷伏诺种姓，以至于您没有看到您的子嗣伊雅戈·卡斯提尔堕入罪孽，直到它太晚了。\n您曾经有前途的学生现在只是一个强盗，在科西嘉岛的藏身处中掠夺海洋。这不是您想要的世系传承。\n您可以试着给他发个信息，缓和您们的关系，希望将来能够和解。或者，最好是彻底忘记他。"
 podintroductions.187.a: "对我们来说还不算太晚，孩子。"
 podintroductions.187.b: "他已经太过分了。"
 podintroductions.188.t: "你的故事就此展开"
 podintroductions.188.desc: "无畏的雅戈，您是地中海之主……或者至少期望是这样。您在科西嘉岛的海盗乐园可以让您及时达到。\n让那些傲慢的亲王们去打他们的小算盘吧，您知道真正的权力在哪里，而且您足够精明，可以通过任何必要的手段夺取它。\n当地中海的所有水手都畏惧您的名字，您的宝箱里充满了黄金……这时您将真正取得胜利！"
 podintroductions.188.a: "全员出动！"
 iago_intro_tooltip: "作为雅戈，你有一项寻求掠夺和财富的专属决议。"
 iago_decision: "起航"
 iago_decision_tooltip: "船员们都很不安分，也许是时候出航了？"
 iago_decision_desc: "执政是不错，但你需要风在后方，掠夺在前方，才能真正感觉到活着。或近乎。"
 iago_decision_confirm: "风在后方！"
 iago_decision_effect_tooltip: "你将得在目标间选择。"
 iago_crew_weakened_modifier: "船员空虚"
 iago_crew_weakened_modifier_desc: "你的一些水手在上次的掠夺后再也没有回来，这在一定程度上削弱了你对你国度的控制。"
 iago_crew_depleted_modifier: "船员枯竭"
 iago_crew_depleted_modifier_desc: "你的许多水手在上次的掠夺后再也没有回来，削弱了你对你国度的控制。"
 iago_crew_empty_modifier: "无船员"
 iago_crew_empty_modifier_desc: "你的船员在上次的掠夺中几乎被杀到了只剩最后一个人，严重削弱了你对你的国度的控制。"
 PODcanon_chars.46.t: "海盗亲王起航"
 PODcanon_chars.46.desc: "你的船员已经准备好出发了，而且有许多富有的目标可选。你必须做出的选择是关于掠夺的难度。难度越大，回报越多，但在跳帮过程中你将失去更多的船员。如果他们死了，就显然不能再在家园里帮助你。"
 PODcanon_chars.46.a: "小猎物，小风险。"
 PODcanon_chars.46.b: "这个似乎很适度。"
 PODcanon_chars.46.c: "史上最大的劫掠！"
 PODcanon_chars.46.d: "我们现在不出航。"
 podintroductions.189.t: "你的故事就此展开"
 podintroductions.189.desc: "大胜死亡大人，经过漫长的等待和一些精心的计划，您终于为自己争取到了巴格达。是时候享受您的新权力了！\n也可能不是，因为宫廷越来越担心所谓的“蒙古汗国”，这些凡人的骑兵现在正在攻击哈里发国。您不相信，因为他们最近在埃尔比勒被打败了，但您听到了您的顾问们的谨慎的敦促。如果这些可怕的预兆成真，也许您可以保留一些战后的存续？"
 podintroductions.189.a: "我可以先等一等，然后再享受亡生。"
 podintroductions.189.b: "我的钱，我想怎么用就怎么用！"
 mritunjay_intro_tooltip: "你得提前计划，以防蒙古人靠近你的城市。"
 baghdad_recovering_modifier: "恢复中"
 baghdad_recovering_modifier_desc: "多亏了你的精心策划，蒙古军队造成的损失没那么严重。城市正在恢复中。"
 PODcanon_chars.47.t: "睿智亲王"
 PODcanon_chars.47.desc: "蒙古军队终于停止了对巴格达这座美丽城市的掠夺和破坏。这是个令人痛苦的经历，但由于你的精心准备，你得以保存了大部分的东西。你不寒而栗地想，如果没有像你这样的准备，会发生什么。\n好吧，时间总是在流逝，但至少由于你的努力，你心爱的巴格达将保持是个伟大的学识和文化中心。"
 PODcanon_chars.47.a: "我在三十年前抉择得很好。"
 podintroductions.190.t: "你的故事就此展开"
 podintroductions.190.desc: "玛西娅女士，您一直在努力做事，完成您关于雷伏诺$pod_clan$及其众多种姓的论文。不过，您可能要暂时把注意力放在其他地方。\n在您的旅行中，您注意到很大一部分$pod_clan$的堕落，与您的[Glossary('尊长','game_concept_Sire_desc')]和您自己所坚持的高尚品德相去甚远。如果您的行动足够迅速，您就可以为年轻一代提供一个集合点和学习的榜样，也许在这个过程中可以挽救您$pod_clan$的传承。如果您有时间，您甚至可以在您的《伟大之作》中写上一两章。"
 podintroductions.190.a: "该行动了。"
 marcia_intro_tooltip: "作为玛西娅，你有一项专属决议，那就是在一段时间内专注于你的写作，让你可在各种生活方式的回报中进行选择。"
 marcia_decision: "雷伏诺氏族之人"
 marcia_decision_tooltip: "没时间写稿了。"
 marcia_decision_desc: "你没有忘记你在引用雷伏诺$pod_clan$的每一个世系方面上的无止境的工作。你应该继续。"
 marcia_decision_confirm: "主题将是……"
 marcia_decision_effect_tooltip: "你将得在主题重点间选择。"
 PODcanon_chars.48.t: "雷伏诺氏族之人"
 PODcanon_chars.48.desc: "随着你继续对你的$pod_clan$各世系的概述，你对他们的专长了解得越来越多。就像任何一本好书一样，你非常肯定，你最终学到的东西会比你的读者读到的东西还要多。"
 PODcanon_chars.48.a: "帕伊杜米特，骄傲的骑士。"
 PODcanon_chars.48.b: "普日·达伊，狡猾的诡计者。"
 PODcanon_chars.48.c: "亚历山得利特，精明的商人。"
 PODcanon_chars.48.d: "巴希里特，聪慧的狂热者。"
 podintroductions.191.t: "你的故事就此展开"
 podintroductions.191.desc: "佐伊女士，在接连失去您的城市和您的[Glossary('尊长','game_concept_Sire_desc')]后，您几乎被绝望和愤怒所迷惑。值得庆幸的是，阿纳托尔把您带到了他的羽翼之下，您们都因此变得更加优秀。\n您显然对他心存感激，所以您接受了他在法兰西南部的最新追求。也许在这里，您将最终为您的亡生找到一个目标？许多人因为阿尔比派十字军而失去了和您一样多的东西，而您可以帮助他们重建。您确信阿纳托尔会同意这个计划，如果可以的话，他甚至可能会再次帮助您。"
 podintroductions.191.a: "也许是个新的家园？"
 zoe_intro_tooltip: "作为佐伊，你有一项针对阿纳托尔的专属[character_interaction|E]，用以寻求他的帮助。"
 POD_zoe_interaction: "共同成长"
 POD_zoe_interaction_desc: "阿纳托尔和你仍然可以从对方身上学到很多东西。"
 PODcanon_chars.49.t: "两个迷失的灵魂"
 PODcanon_chars.49.desc: "阿纳托尔是一个复杂的人，经常迷失在他的愿景中。但当他在精神正常的时候，他总是对你很好，很有耐心。他经常隐晦地告诉你，你是他在现实世界中的“锚”之一，而且他似乎真的很感谢你的友谊。\n在任何情况下，你们两个人在一起的时间总是以你们两个人对事物的新看法而告终。这是一个走向智慧的漫长旅程，但至少有一个朋友在你身边。"
 PODcanon_chars.49.a: "让我们今晚好好聊聊。"
 PODcanon_chars.49.b: "关于……我明白了。"
 PODcanon_chars.49.c: "你有一个愿景？我们可以一起理解它。"
 PODcanon_chars.49.d: "祈祷？……这可能有帮助。"
 etienne_support_modifier: "约根名义上的附庸"
 etienne_support_modifier_desc: "约根·冯·费尔登仍然认为你是他的附庸，并向你提供支持和帮助，尽管这涉及到遥远的距离。"
 podintroductions.192.t: "你的故事就此展开"
 podintroductions.192.desc: "艾蒂安大人，您被夹在两股对立的力量之间。在最近的十字军之后，由于约根·冯·费尔登的德意志骑士的帮助，您已经确保了对亚柯的控制，然后作为交换向他宣誓效忠。但最近橄榄会议的诞生给您带来了压力。\n它的领导人卡维娅·加杜巴希望您效忠，因为您显然在她的势力范围内。约根离得太远来有所轻重，但他承诺，如果您至少在名义上保持对他的附庸地位，他将给予支持。不过，这可能会激怒卡维娅。"
 podintroductions.192.a: "我在这必须要务实一点。"
 podintroductions.192.b: "我将忠实于我的承诺。"
 podintroductions.193.t: "你的故事就此展开"
 podintroductions.193.desc: "刻茉媞里女士，在与赛特的受诅衍体进行了一场可怕的战斗之后，您刚刚从漫长的[Glossary('蛰眠','game_concept_torpor_desc')]中醒来。您忍耐着，就像您一贯所做的那样。\n赛特夺走了你的一切，除了他真正想要的一样东西，而你将回报他。他那充满亲信和佞臣的可悲世系必须被清除掉。诚然，你是在孤军奋战，对抗整个$pod_clan$的全部力量，但……他们已经有了一个非常真实的理由来害怕你。而你在未来会给他们更多。"
 podintroductions.193.a: "我希望你在看着。"
 kemintiri_intro_tooltip: "作为刻茉媞里，你有一项专属决议，即摧毁赛特的密教。"
 kemintiri_decision: "伊西斯的复仇"
 kemintiri_decision_tooltip: "蛇必须被碾碎。"
 kemintiri_decision_desc: "一旦赛特之子和他们被诅咒的密教不再存在，赛特的名字被沉入泥浆……那时你才与他扯平。"
 kemintiri_decision_confirm: "伊西斯怜悯我"
 kemintiri_decision_effect_tooltip: "赛特之子将消失，其信徒将改信人性之道。"
 podintroductions.194.t: "你的故事就此展开"
 podintroductions.194.desc: "安德烈亚斯大人，您是著名的公平和可靠的[ashen_caravan|E]。诚然，您经常利用这些旅行来宣扬赛特的荣耀，但您总是遵守您的诺言。\n您最近在这个地区停了下来，花时间教您的新成员了解他们在赛特的计划中的作用，更重要的是，在您的商队中的作用。很快就到了再次出发的时候，但道路每年都会变得更加艰难。幸运的是，你强大的追随者团体和无可挑剔的声誉确保未来你在有需要时会有很多潜在的帮助和联系来协助你。"
 podintroductions.194.a: "尊敬赛特，尊敬圣言。"
 andreas_intro_tooltip: "作为安德烈亚斯，起始时你将拥有数个已经在先前的生意中支持过你的赞助人。"
 podintroductions.195.t: "你的故事就此展开"
 podintroductions.195.desc: "纳赫特尔赫布大人，您是赛特的摄政，直到他认为这个世界足以归来。但您必须与其他圣显者一起工作。\n这个庄严的议会在大多数时候都明智地听从您的意见，但他们在需要时仍会提供有用的建议。作为赛特最重要的守护者，您的职责是保护$pod_clan$，并将不信者带入羊栏。这肯定是一个漫长的过程，但您有永恒在身边。"
 podintroductions.195.a: "荣耀归于杜阿特之主。"
 nakh_intro_tooltip: "作为纳赫特尔赫布，只要塞特普奈拉和玛阿特卡拉还活着，你就可以用一个小决议来召集圣显者聚会。"
 nakh_decision: "圣显者的聚会"
 nakh_decision_tooltip: "我们得谈谈。"
 nakh_decision_desc: "作为赛特之子$pod_clan$的主要领导人，你仍然要听取其他方面的意见。因为身份，你的同僚圣显者们是最值得信赖的。"
 nakh_decision_confirm: "今晚的议程……"
 nakh_decision_effect_tooltip: "你将被提供未来五年的行动方案。"
 nakh_custom_decision: "这个决议只要[GetScriptedCharacterByHistoryID('790126').GetFirstName]和[GetScriptedCharacterByHistoryID('790128').GetFirstName]还活着就可用。"
 seterpenre_advice_modifier: "赛特彭雷提供建议"
 seterpenre_advice_modifier_desc: "思想前卫的赛特彭雷总是想把注意力放在对外关系和$pod_clan$形象上。"
 maatkare_advice_modifier: "玛阿特卡拉提供建议"
 maatkare_advice_modifier_desc: "耐心的玛阿特卡拉希望专注于你自己的土地，使埃及成为大地上最伟大的地方，值得赛特归来。"
 PODcanon_chars.51.t: "圣显者的会晤"
 PODcanon_chars.51.desc: "这类事件总是很容易预测的。吸血鬼毕竟不会有太大的变化，他们的政治立场也是如此。作为他们中最重要的圣显者，你总是拥有最后的决定权，但即使是你也知道，有时听从别人的建议也是有好处的。"
 PODcanon_chars.51.a: "赛特彭雷，我们将遵循你的计划。"
 PODcanon_chars.51.b: "玛阿特卡拉，这次你是对的。"
 PODcanon_chars.51.c: "我们将按我的方式来！"
 podintroductions.196.t: "你的故事就此展开"
 podintroductions.196.desc: "内弗鲁女士，您的火之庭的力量正在逐年增长。但您可以做得更多。\n您作为秘法和腐化的女主人的名声是当之无愧的，很少有存在能在离开火之庭时不向赛特抵押他们不死族灵魂。这是一个您必须培养的声誉，因为它将有助于您在赛特的阶级中的提升。很快，他们都将学会对您的温柔关怀有同等程度的恐惧和爱戴。"
 podintroductions.196.a: "欢迎你，祝你住得愉快……"
 neferu_intro_tooltip: "作为内弗鲁，你有一项专属的通过火之庭释放囚犯的选项。"
 NEFERU_RELEASE: "火之庭的试炼"
 sarrasine_running_modifier: "逃亡中"
 sarrasine_running_modifier_desc: "凯塔尔的追随者仍在追杀你。这无疑使事务变得复杂了。"
 podintroductions.197.t: "你的故事就此展开"
 podintroductions.197.desc: "萨拉金大人，事情并没有真正按计划进行。您对凯塔尔的$pod_diablerie$行动失败了，您不得不匆忙逃跑，以从他愤怒的追随者手中保住您的皮。是时候反击了。\n您加入了第四次十字军东征的残余部队，因为您感觉到了他们的弱点，他们可以从内部被打垮，而希腊人正忙于夺回君士坦丁堡，无法抓住这个机会。因此，您可能会在其他人做出反应之前，在安纳托利亚划出自己的封地。只有到那时，您才会有足够的力量来永远避开您的追兵。"
 podintroductions.197.a: "是时候脱下我的皮了。"
 sarrasine_intro_tooltip: "作为萨拉金，你开始时有一个负面修正，可通过一项专属决议来摆脱它。"
 sarrasine_decision: "末路"
 sarrasine_decision_tooltip: "我已经厌倦了逃跑。"
 sarrasine_decision_desc: "只有当你变得足够强大，让他们感到害怕时，凯塔尔的追随者才会停止追杀你。还有什么地方比摇摇欲坠的拜占庭帝国更适合做这件事呢？"
 sarrasine_decision_confirm: "现在该谁逃了？"
 podintroductions.198.t: "你的故事就此展开"
 podintroductions.198.desc: "阿努尔夫大人，您的耶梦加得密教发展得很好，在该地区的动荡中得到了很大帮助。不过，还是有一些问题需要处理。\n其中最重要的是瓦尔季斯，您的子嗣，他对斯堪的纳维亚诸神的“适当”密教有了奇怪想法。让我们说实话，您在这是为了金钱和权力，您更乐意把神明相关的玩意留给牧师。\n不过，您将来可能会需要瓦尔季斯，而为和解打下基础，即使是不真诚的，也可能是明智之举。"
 podintroductions.198.a: "我当然关心诸神，瓦尔季斯！"
 podintroductions.198.b: "不，她没救了。"
 podintroductions.199.t: "你的故事就此展开"
 podintroductions.199.desc: "让·巴蒂斯特大人，亡生看起来相当不错。您的开始是坎坷的，但您很好地反击了，现在是法兰西最成功的“夜间企业家”之一。\n您为凡人和$pod_cainite$政治家的最高层面提供优质娱乐。其中有钱可赚，而且若关于金钱和权力之间的说法是真的，您很快就会变得非常强大。"
 podintroductions.199.a: "是时候扩大我的业务范围了！"
 jean_intro_tooltip: "作为让·巴蒂斯特，你具有专属建筑链——掌控夜生活。"
 building_type_influence_night_life_01: "掌控夜生活"
 building_type_influence_night_life_01_desc: "#F 让·巴蒂斯特敏锐的商业意识可以在本省份中得到很好的利用。#!"
 building_influence_night_life_01: "掌控赌场"
 building_influence_night_life_01_desc: "庄家总会赢。"
 building_influence_night_life_02: "掌控酒馆"
 building_influence_night_life_02_desc: "遗忘你的悲伤，但不要遗忘你的钱包。"
 building_influence_night_life_03: "掌控妓院"
 building_influence_night_life_03_desc: "据称没有人会去的地方，但每天晚上却仍然神秘地满员。"
 podintroductions.200.t: "你的故事就此展开"
 podintroductions.200.desc: "格拉崔克斯大人，尽管您为家族做了那么多事，睿魔尔本人还是把您流放到了法兰西。显然，这是一种更大的疾病在侵蚀您$pod_clan$的症状。\n而这并不是这个胡言乱语的小丑埃特里乌斯能揭开的真相！那个白痴还在试图破坏您，即使他已经被任命为睿魔尔家族的摄政。没关系，您将利用法兰西肥沃的政治局势，建立您自己的权力基础，然后胜利地回到睿魔尔的中心地带。您将拯救您的家族，甚至在必要时从它本身手中拯救。"
 podintroductions.200.a: "我会回来的。"
 goratrix_intro_tooltip: "作为格拉崔克斯，只要埃特里乌斯还活着，你就得忍受他的鬼把戏。"
 PODcanon_chars.52.t: "埃特里乌斯的鬼把戏"
 PODcanon_chars.52.desc: "又一个埃特里乌斯用于损害你的阴谋被揭穿了。像往常一样，这是一个意志薄弱的粗鲁者的微弱侵犯。可悲的是，在可预见的未来，它仍会扰乱你的计划，你将不得不以某种方式处理它。"
 PODcanon_chars.52.a: "贿赂那些为他工作的傻瓜。"
 PODcanon_chars.52.b: "我有的是人去处理这个问题！"
 PODcanon_chars.52.c: "行，我自己来。"
 podintroductions.201.t: "你的故事就此展开"
 podintroductions.201.desc: "梅琳达女士，尽管有一些困难，您已经能够在英格兰建立起强大的睿魔尔势力。不过密特拉并没有让您的生活变得轻松，您必须仔细观察他接下来的行动。\n您也一直在寻找有关传说中的圣杯及其对吸血鬼影响的信息。为此，您确定了两个可能的来源，即阿瓦隆和怨烬的城堡，那里居住着两个“吸血鬼骑士”组织。如果您能探索这些堡垒，即使不能找到圣杯本身，至少也能找到一些关于它的有趣的小故事。"
 podintroductions.201.a: "也许我是这片土地的摩根勒菲。"
 meerlinda_intro_tooltip: "作为梅琳达，你有一项专属决议，即获取两大城堡以得到回报。"
 meerlinda_morgan_modifier: "摩根勒菲再世"
 meerlinda_morgan_modifier_desc: "梅琳达没有找到圣杯，但她肯定找到了一些东西。她现在是这些岛屿的美丽、强大而可怕的妖女。"
 meerlinda_decision: "英格兰的妖精"
 meerlinda_decision_tooltip: "传说故事往往藏有真相的火花。"
 meerlinda_decision_desc: "阿瓦隆的城堡和怨烬的城堡肯定隐藏着一些关于圣杯的秘密。获取它们，并将它们隐藏的力量据为己有。"
 meerlinda_decision_confirm: "……亚瑟王有何用？"
 podintroductions.202.t: "你的故事就此展开"
 podintroductions.202.desc: "热尔韦大人，您的扬升仍在继续。由于您对德意志外交界的巨大了解，您被赋予了一项富有回报的使命，虽然很困难。摧毁被称为“特亚维派睿魔尔”的分裂分子领袖德维拉，以及支持她的冈格罗。\n您已经组建了一支由可靠和有才华的族人组成的小团体，但您的人数仍然远远少于敌人。这可能是您迄今为止最大的挑战。"
 podintroductions.202.a: "我们必须谨慎谋划。"
 jervais_intro_tooltip: "作为热尔韦，你有一项专属决议，那就是除掉德维拉和利沃尼亚野者来获得奖赏。"
 jervais_rising_modifier: "明日之星"
 jervais_rising_modifier_desc: "热尔韦在睿魔尔金字塔中的地位继续快速提升，给整个$pod_clan$留下了深刻的印象。"
 jervais_decision: "利沃尼亚的克星"
 jervais_decision_tooltip: "我必须在该分裂蔓延之前终结它。"
 jervais_decision_desc: "埃特里乌斯的命令很明确。杀死特亚维派的首领德维拉，以及庇护她的利沃尼亚野者。"
 jervais_decision_confirm: "任务完成"
 jervais_custom_decision: "[GetScriptedCharacterByHistoryID('790106').GetFirstName]必须死"
 jervais_custom_decision2: "[GetTitleByKey('k_ferals_livonia').GetNameNoTier]必须已被销毁"
 rutor_running_modifier: "逃亡中"
 rutor_running_modifier_desc: "睿魔尔因你的背叛想要你死，并且正在追杀你。这无疑使事务变得复杂了。"
 podintroductions.203.t: "你的故事就此展开"
 podintroductions.203.desc: "鲁托尔大人，您已经受够了被人指手画脚，不管是被棘秘魑还是睿魔尔。您再也不会向任何人俯首了。\n您通过跑向丹麦而逃离了睿魔尔家族，这是一个碰巧的选择，因为该地区缺乏一个强大的集中式吸血鬼势力。也许它可能是您？如果您的行动足够迅速和果断，以确保一个坚实的权力基础，您的$pod_clan$将不得不放弃追捕。然后，就终于轮到您发号施令了，这的确是一个非常诱人的前景。"
 podintroductions.203.a: "新的开始？"
 rutor_intro_tooltip: "作为鲁托尔，你可以通过达成你的专属决议，来除掉你的起始修正"
 rutor_decision: "末路"
 rutor_decision_tooltip: "我已经厌倦了逃跑。"
 rutor_decision_desc: "睿魔尔$pod_clan$将永远不会停止对你的追杀，除非你足够强大，迫使他们暂停。是时候掌控局面了。"
 rutor_decision_confirm: "现在该谁逃了？"
 faithful_xavier_modifier: "忠诚议员"
 faithful_xavier_modifier_desc: "作为睿魔尔精英的典范，没有人怀疑哈维尔对功业的承诺。"
 unfaithful_xavier_modifier: "忠诚议员？"
 unfaithful_xavier_modifier_desc: "没人怀疑哈维尔对功业的承诺……至少在公开场合不会。"
 podintroductions.204.t: "你的故事就此展开"
 podintroductions.204.desc: "哈维尔大人，您已经抵达北非，决心为您$pod_clan$的荣耀揭开这片大陆的神秘面纱。至少，这是官方的说法。\n事实上，议会的其他成员对您在核心地带本身被围困时离开他们的决定并不十分满意。但您没有给他们选择的余地，因为您已经厌倦了国内琐碎的阴谋，渴望得到更伟大的东西。您将不得不小心地平衡您对睿魔尔的官方职责和您对知识和秘密的不懈追求。"
 podintroductions.204.a: "为了睿魔尔氏族的荣耀！"
 podintroductions.204.b: "为了睿魔尔氏族的荣耀……"
 therimna_secrets5_modifier: "剩余秘密：5"
 therimna_secrets5_modifier_desc: "你正在向出价最高的人出售你所知道的关于睿魔尔$pod_clan$的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets4_modifier: "剩余秘密：4"
 therimna_secrets4_modifier_desc: "你正在向出价最高的人出售你所知道的关于睿魔尔$pod_clan$的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets3_modifier: "剩余秘密：3"
 therimna_secrets3_modifier_desc: "你正在向出价最高的人出售你所知道的关于睿魔尔$pod_clan$的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets2_modifier: "剩余秘密：2"
 therimna_secrets2_modifier_desc: "你正在向出价最高的人出售你所知道的关于睿魔尔$pod_clan$的一切。这带给了你一些朋友……和一些敌人。"
 therimna_secrets1_modifier: "剩余秘密：1"
 therimna_secrets1_modifier_desc: "你正在向出价最高的人出售你所知道的关于睿魔尔$pod_clan$的一切。这带给了你一些朋友……和一些敌人。"
 podintroductions.205.t: "你的故事就此展开"
 podintroductions.205.desc: "泰瑞姆纳女士，睿魔尔要完了，您知道的。而您不会随船沉没。\n您带着许多关于血术法的有趣秘密逃离了您的$pod_clan$，这些秘密许多人都会花大价钱去获取。这些可能是您的救生索，因为您太重要了，只要您持有这些秘密就不会被杀死……但您也将成对睿魔尔而言更重要的击杀目标。\n您将不得不在出售您的秘密以换取一些总是很重要的金币和保留它们给您带来的余地之间取得平衡。"
 podintroductions.205.a: "我的存活是最重要的。"
 therimna_intro_tooltip: "作为泰瑞姆纳，你开始时具有5个秘密，你可以通过一个小决议出售，改变它们给你的减益和增益的平衡。"
 therimna_decision: "讨价还价"
 therimna_decision_tooltip: "万物皆有价。"
 therimna_decision_desc: "你所拥有的血术法的秘密使你成为睿魔尔的目标，但也使你成为一位对其他人来说过于重要不该被杀的人。你愿意用这种相对的平静来换取金钱吗？"
 therimna_decision_confirm: "成交"
 podintroductions.206.t: "你的故事就此展开"
 podintroductions.206.desc: "维斯塔尼亚女士，您终于在您心爱的石像鬼中找到了慰藉和陪伴。远离您其他同胞的残忍和野蛮，只有他们真正理解您。\n一想到要让它们为毫无意义的睿魔尔战争而被屠杀，您的心就会痛。但现在，您没有什么选择，必须当他们的棋子。但您致力于尽快改变这种状况。您美丽的婴儿毕竟只能由他们慈爱的母亲来真正照顾。"
 podintroductions.206.a: "家庭是最重要的。"
 virstania_intro_tooltip: "作为维斯塔尼亚，你能使用决议来生成石像鬼兵士军团。"
 virstania_decision: "漂亮的石宝宝"
 virstania_decision_tooltip: "还有更多正在到来！"
 virstania_decision_desc: "你是石像鬼之母，你必须帮助它们正确地生活。这是一项巨大的责任，但也是你最大的幸福。"
 virstania_decision_confirm: "嘘……妈妈在这"
 virstania_decision_effect_tooltip: "你将选择生成多少石像鬼。"
 PODcanon_chars.53.t: "诞生"
 PODcanon_chars.53.desc: "下一批石像鬼几乎已经准备好了。然而，贪婪的睿魔尔已经在试图从你手中夺走它们，如果你想拯救它们，你必须迅速行动。你想救下多少？"
 PODcanon_chars.53.a: "我至少救了其中的一些。"
 PODcanon_chars.53.b: "我必须拯救更多！"
 PODcanon_chars.53.c: "所有！"
 PODcanon_chars.53.d: "这次我无法帮助他们……"
 virstania_small_gargoyles_tt: "一组石像鬼会被加入到你的可用兵士中。"
 virstania_medium_gargoyles_tt: "两组石像鬼会被加入到你的可用兵士中。"
 virstania_high_gargoyles_tt: "三组石像鬼会被加入到你的可用兵士中。"
 angry_fays_marconius_modifier: "愤怒的妖精"
 angry_fays_marconius_modifier_desc: "通过对神秘的妖精进行实验，你学到了很多东西……但你也在制造强大的敌人。"
 podintroductions.207.t: "你的故事就此展开"
 podintroductions.207.desc: "马可纽斯大人，您一直在努力工作，试图了解您作为吉雅希德之一的新状况。显然，最好的行动方案是在一些被俘的妖精身上进行“实验”，因为您似乎与他们有一些相似之处。不过他们对这一点并不满意。\n您也知道勒森魃$pod_clan$正在寻找任何弱点的迹象来针对您，而这次与您的盟友之间的分裂可能就是他们所等待的。您可能需要小心平衡您对知识的渴求和您与妖精不稳定的联盟。"
 podintroductions.207.a: "令人为难的情况。"
 marconius_intro_tooltip: "作为马可纽斯，你可以具有一项平衡你与妖精的关系的决议。"
 marconius_decision: "你与妖精"
 marconius_decision_tooltip: "如何接触他们……"
 marconius_decision_desc: "无论你喜欢与否，妖精都是你的国度的一个重要部分。因此，你必须谨慎选择对他们的立场。"
 marconius_decision_confirm: "是时候重新考虑我的选择了？"
 marconius_decision_effect_tooltip: "你将选择如何接触妖精。"
 happy_fays_marconius_modifier: "有帮助的妖精"
 happy_fays_marconius_modifier_desc: "妖精认为你是一个有用的，即使是善变的盟友，而且目前更喜欢是你在权位上，而不是另一位吸血鬼。"
 PODcanon_chars.54.t: "你与妖精"
 PODcanon_chars.54.desc: "由于你的国度对妖精的历史意义，它正在与妖精合作，而你必须处理好这个问题。他们是有用的盟友，尤其是用于对付你的同族族人的潜在报复，但他们也是非常有趣的实验对象，可以了解你这么一位被妖精眷染的$pod_cainite$的状况。决定，决定……"
 PODcanon_chars.54.a: "遗憾的是，我现在需要他们作为盟友。"
 PODcanon_chars.54.b: "我将暂时保持距离。"
 PODcanon_chars.54.c: "有太多可了解的了！"
 podintroductions.208.t: "你的故事就此展开"
 podintroductions.208.desc: "剌曷大人，您的职责是保护[Glossary('安答','podgloss.anda')]。然而，大草原很广阔，您不得不经常徘徊，以处理夜以继日出现的各种问题。\n自从您的人民开始呼唤您作为解决争端和其他小冲突的最终权威，情况变得更糟。作为非正式的“大草原之判官”，您有很大的权力，您开始为了您的同胞们的更大利益而滥用这种权力。无论他们是否知道。"
 podintroductions.208.a: "判官与军阀。"
 chinkhai_intro_tooltip: "作为剌曷，你有一项审判你封臣的专属[character_interaction|E]。"
 POD_chinkhai_interaction: "大草原之判官"
 POD_chinkhai_interaction_desc: "我将开庭。"
 PODcanon_chars.55.t: "审判"
 PODcanon_chars.55.desc: "作为[Glossary('安答','podgloss.anda')]部族的究极权威，你可以完全自由地以你喜欢的方式开始和结束任何审判。然而，你要维护自己的声誉，太过宽松可能会被看作是一种软弱。"
 PODcanon_chars.55.a: "无罪！"
 PODcanon_chars.55.b: "有罪！"
 PODcanon_chars.55.c: "本案尚无定论。"
 podintroductions.209.t: "你的故事就此展开"
 podintroductions.209.desc: "令人畏惧的玛格达，又有一个入侵者试图掠夺您的美丽岛屿。这个密特拉只是一长串外来征服者中最新的一个，他们在抢夺属于您的东西。您不会允许这样做的。\n您的人民早已不复存在，您的信仰也几乎成了一种记忆，甚至对您本身在这一刻也算是如此。只有您的愤怒还在，现在是时候让它为您发声了。岛屿已经被腐化得无法修复，您将不得不摧毁您路上的一切，使它们重新变得纯净。\n这将是血腥的，但他们这是自作自受。"
 podintroductions.209.a: "他们将付出代价。"
 magda_intro_tooltip: "作为玛格达，你可以在低发展度的省份中建造专属建筑系列。"
 building_type_magda_purge_01: "玛格达的清洗"
 building_type_magda_purge_01_desc: "#F 该让岛屿重新开始了。崭新且血腥的开始。#!"
 building_magda_purge_01: "玛格达的群落"
 building_magda_purge_01_desc: "在玛格达的指挥下，冈格罗部群在这片土地上游荡，在他们的路上散布恐怖和死亡。"
 building_magda_purge_02: "玛格达的部族"
 building_magda_purge_02_desc: "野蛮的强者为王法则已经重新控制了这里。文明在玛格达的记仇部族的爪子和獠牙下轰然倒塌。"
 podintroductions.210.t: "你的故事就此展开"
 podintroductions.210.desc: "波乌狄纳女士，在度过了相当长的一段时间后，您终于离开了法兰西。您终于找到了您所寻找的东西，现在是时候继续前进了。\n布鲁赫本人信任您，让您保持他的$pod_clan$在正确的道路上，但使命是巨大的。您必须让您的其他同胞们了解您，并使您已经令人印象深刻的传奇更加壮大。只有这样，他们才会接受您是布鲁赫传承的真正继承者。"
 podintroductions.210.a: "要做的事情还很多。"
 catubodua_intro_tooltip: "作为波乌狄纳，你不能$pod_Embrace$，因为她在第一位子嗣之后就发誓不再这样做。\n你还具有一项专属决议，用以增长你的传奇，给其他氏族族人留下深刻印象。"
 catu_heir_of_brujah_modifier: "布鲁赫的嗣女"
 catu_heir_of_brujah_modifier_desc: "终于，布鲁赫$pod_clan$正在痊愈。一位配得上布鲁赫和特洛伊尔的女继承人已经崛起，将带领战士–学者们进入一个新的、光明的时代。"
 catubodua_decision: "布鲁赫的复兴"
 catubodua_decision_tooltip: "我不能让他失望。"
 catubodua_decision_desc: "骄傲的布鲁赫不会接受新的首领，除非他或她能完美地代表他们$pod_clan$的战士又学者的一面。显然，同时还要是个成功的统治者。"
 catubodua_decision_confirm: "新的时代开始了"
 podintroductions.211.t: "你的故事就此展开"
 podintroductions.211.desc: "德维拉女士，您的人民正处于严重的危险之中。随着基督教信徒变得越来越有侵略性，睿魔尔$pod_clan$派了一个由热尔韦领导的小团体来杀您和其他特亚维派。\n幸运的是，您遇到了喀喇，现在正受到利沃尼亚野者的保护。不过，在解决这位睿魔尔的攻击，以及确保野者的边境安全之前，您不会轻易休息。您和您的安全是以这个为保证的。"
 podintroductions.211.a: "特亚维保佑我们。"
 deverra_intro_tooltip: "作为德维拉，你有一项专属决议，那就是摆脱热尔韦，将野者的疆域向东扩展。\n你开局时与喀喇在权力斗争。"
 deverra_blessed_modifier: "特亚维的选民"
 deverra_blessed_modifier_desc: "德维拉显然是特亚维的选民。她的信仰散发着光芒，让所有人都能看到，这对十字的追随者来说是一位剩敌，他们还没有赢。"
 deverra_decision: "特亚维的选民"
 deverra_decision_tooltip: "我不能让他失望。"
 deverra_decision_desc: "你的人民在未来的混乱时期依靠你和野者的保护。如果你能杀死在攻的睿魔尔首领，并确保你西部边界的安全，你的情况将会得到改善。"
 deverra_decision_confirm: "我们忍过了"
 deverra_custom_decision: "[GetScriptedCharacterByHistoryID('790359').GetFirstName]必须死"
 deverra_custom_decision2: "你或你的领主完全控制了[GetTitleByKey('d_pomerelia').GetNameNoTier]公国"
 deverra_custom_decision3: "你或你的领主完全控制了[GetTitleByKey('d_prussia').GetNameNoTier]公国"
 podintroductions.212.t: "你的故事就此展开"
 podintroductions.212.desc: "达楠女士，你的皇朝已分崩离析。\n[akuma|E]信徒如雨后春笋般涌现，地方派系的老祖对你的诏令置若罔闻，而你昔日的弟子披耶·帕永似乎正在酝酿一场宏大的复仇。但并非全无希望。\n得益于与傣越和吴哥丛林猛兽部族的盟约，你手中仍握有一张强大的底牌。诸多恩情与契约将他们与你紧密相连，尽管这些喜怒无常的化兽族裔不宜过度驱使，但他们应当很乐意协助你对付那些最狡诈的敌人。有了他们的助力，皇朝秩序的重建指日可待。"
 podintroductions.212.a: "朱雀尚未到重生之时。"
 dyanang_intro_tooltip: "作为达楠，你有一项专属的招募狼人兵士小决议。"
 dyanang_decision: "凶民"
 dyanang_decision_tooltip: "朋友们，我需要你们的帮助。"
 dyanang_decision_desc: "你的皇朝和丛林王国的凶民之间的良好关系可以被利用来获得帮助。"
 dyanang_decision_confirm: "欢迎，并谢谢你"
 dyanang_decision_effect_tooltip: "你将选择生成多少狼人兵士。"
 PODcanon_chars.56.t: "来自丛林的帮助"
 PODcanon_chars.56.desc: "自从1210年黄金障壁[Glossary('屋室','podgloss.wu')]无私地拯救了被称为廊开的龙化人中龙的生命后，可怕的兽妖就成了你暂时的盟友。滥用这种友谊仍然是不明智的，但你仍然可以指望他们在需要时帮助你。"
 PODcanon_chars.56.a: "一支战队就够了。"
 PODcanon_chars.56.b: "需要两支战队。"
 PODcanon_chars.56.c: "你有多少我要多少。"
 PODcanon_chars.56.d: "实际上，我可以自己处理情况。"
 dyanang_small_werewolves_tt: "一组狼人会被加入到你的可用兵士中。"
 dyanang_medium_werewolves_tt: "两组狼人会被加入到你的可用兵士中。"
 dyanang_high_werewolves_tt: "三组狼人会被加入到你的可用兵士中。"
 durga_young_tt: "由于你在扮演突伽·辛，通过实现这一目标，你也解除了芭芭雅嘎对你的诅咒。"
 podintroductions.213.t: "你的故事就此展开"
 podintroductions.213.desc: "利奥波德大人，尽管您是著名的裁判官，但您仍然是一个需要履行职责的贵族。其中之一就是要找到一个合适的配偶。\n作为巴伐利亚小家族的后裔，娶一个当地的贵族少女是很容易的。格蓓尔佳显而易见，因为您觉得她可以成为一位有用的伙伴。另一个选择是把您的网撒得更大，也许到意大利。一个更有声望的选项是肯定有的，但您对您的新娘将了解甚少。\n最末的选择是……非常规的。您最好的朋友鲍迪奥恩经常开玩笑说要把他的一个儿时伙伴介绍给您，这个粗野的假小子看上去有比年轻的鲍迪奥恩更胜一筹的斗殴技巧。以您脆弱的体质，她的力量可以弥补您的弱点。\n……如果您在那么多玩笑之后真的和他的朋友结婚，您一定很想看看鲍迪奥恩的表情。"
 podintroductions.213.a: "是的，鲍迪奥恩，这正在发生。"
 podintroductions.213.b: "格蓓尔佳女士，你能……？"
 podintroductions.213.c: "很高兴终于见到你了，阿德莱德女士。"
 podintroductions.213.d: "我没有时间做这些无聊的事。"
 aignen_secrets_modifier: "艾格尼恩的秘密"
 aignen_secrets_modifier_desc: "神目知道许多。也许对教廷中一些更狂热的成员来说，其知道得太多了。"
 podintroductions.214.t: "你的故事就此展开"
 podintroductions.214.desc: "艾格尼恩大人，您处于一个惹人的位置，那就是新生的暗影裁判所的眼睛和耳朵，这是神圣教廷中许多人不赞成的事情。然而您知道您的任务的重要性。\n在您的指导下，神目已经传播得很远很广，提供了许多人脉，您可以利用这些人脉为裁判所赢得荣耀。不过，这项关键的准备工作已经受到了圣座本身的威胁，您将不得不暂时让您的“盟友”远离您。"
 podintroductions.214.a: "我知道必须得做什么。"
 aignen_intro_tooltip: "作为艾格尼恩，你一开始就有一个强大的密谋修正。只要艾格尼恩还活着，和教廷不找你麻烦，它就会一直存在。"
 PODcanon_chars.57.t: "教宗的来访"
 PODcanon_chars.57.desc: "圣座的特使即将到来，想看看你们行动的真实程度。这可能会很危险，因为罗马的许多人只想关闭神目，担心他们的小计谋会因为你的存在而受到干扰。\n你知道你的任务比这重要得多，但如果你想继续你自己的神圣事业，你仍将不得不对付这些目光短浅的傻瓜。"
 PODcanon_chars.57.a: "贿赂特使应该足够了。"
 PODcanon_chars.57.b: "我是教廷的一个卑微的仆人。"
 PODcanon_chars.57.c: "我将成为你的个人向导。"
 PODcanon_chars.57.d: "我别无选择，只能与一些人脉切断联系。"
 vittoria_illness_modifier: "超自然诅咒"
 vittoria_illness_modifier_desc: "维特多利亚被一个强大的女巫诅咒了。虽然她的心智仍然很强大，但她的身体却在慢慢枯萎。"
 podintroductions.215.t: "你的故事就此展开"
 podintroductions.215.desc: "无畏的维特多利亚，您已经开始了您在意大利的神圣职责，但您对您的同胞们隐藏了一个可怕的事实：您被诅咒了。\n多年前与您战斗的一个强大的女巫在使用她邪恶的魔法后得以逃脱。从那时起，您的身体就开始慢慢枯萎，如果这种情况继续下去，您可能会在完成您的任务之前就被主传唤。\n幸好，最近出现了一个解决方案。感谢神目的一些情报，您了解到女巫已经在马赛定居了。如果您能“绕道”到这个城市，并清除它的吸血鬼和术士居民……您受到的诅咒肯定将结束。"
 podintroductions.215.a: "小小的诅咒不会终结我！"
 vittoria_intro_tooltip: "作为维特多利亚，你具有一项专属决议，既通过取得马赛来除掉你身上的诅咒。"
 vittoria_decision: "诅咒"
 vittoria_decision_tooltip: "你仍然有很多事情要做。"
 vittoria_decision_desc: "你仍然很强大，但那个可恶的诅咒仍然令人担忧。清洗马赛，消灭女巫！"
 vittoria_decision_confirm: "火，即净化"
 rodrigue_paranoia_modifier: "彻底的偏执"
 rodrigue_paranoia_modifier_desc: "有人要害你。所有人都可能被其所控制。"
 podintroductions.216.t: "你的故事就此展开"
 podintroductions.216.desc: "罗德里格大人，您是第一个面对吸血鬼并活下来的人，而您仍然是唯一知道真相的人：他们无处不在。\n甚至教廷和他们所谓的“暗影裁判所”也可能充满了他们的仆人。除了您自己，您必须绝对不相信任何人。一场大清算即将到来，天主将为您指明救赎之路。\n如果这个世界得被焚毁来得到救赎，您将站在灰烬之上。"
 podintroductions.216.a: "我不会再被愚弄了。"
 roque_paranoia_modifier: "罗克的计谋"
 roque_paranoia_modifier_desc: "现在是制定计谋的时候吗？为什么得分是，每时每刻都是制定计谋的时候！"
 podintroductions.217.t: "你的故事就此展开"
 podintroductions.217.desc: "玛利亚修女，尽管您在英格兰的任务繁重，但您不能忘记您的出身。\n您的一切都归功于修女特蕾莎，她是创立圣约翰修女会的受祝福的灵魂，是早期裁判所的核心。她的去世对所有修女来说是一个艰难的时刻，如果神圣教廷知道这位圣洁的女性，您们会更加安心。\n因此，您们已经开始编纂特蕾莎的人生和奇迹的记载，准备带到罗马去，希望能将她封为圣人。如果您能成功，修女们就会感到安宁，知道她们逝去的创始人永远活在世上。"
 podintroductions.217.a: "一项最神圣的使命。"
 maria_intro_tooltip: "作为玛利亚，你具有一项专属决议，即编纂关于特蕾莎的生活的记录。如果你在玛利亚去世前完成，修女会将获得可观的声誉提升。"
 teresa_life_4_modifier: "特蕾莎的封圣进度：4"
 teresa_life_4_modifier_desc: "你正在努力将特蕾莎修女的奇迹的真相带到罗马的耳边。\n一旦这个修正达到5，整个过程就完成了。"
 teresa_life_3_modifier: "特蕾莎的封圣进度：3"
 teresa_life_3_modifier_desc: "你正在努力将特蕾莎修女的奇迹的真相带到罗马的耳边。\n一旦这个修正达到5，整个过程就完成了。"
 teresa_life_2_modifier: "特蕾莎的封圣进度：2"
 teresa_life_2_modifier_desc: "你正在努力将特蕾莎修女的奇迹的真相带到罗马的耳边。\n一旦这个修正达到5，整个过程就完成了。"
 teresa_life_1_modifier: "特蕾莎的封圣进度：1"
 teresa_life_1_modifier_desc: "你正在努力将特蕾莎修女的奇迹的真相带到罗马的耳边。\n一旦这个修正达到5，整个过程就完成了。"
 maria_decision: "特蕾莎修女的封圣"
 maria_decision_tooltip: "她应得这，而且更多。"
 maria_decision_desc: "为了帮助你的修女们知道特蕾莎修女仍然在注视着他们，你必须确保罗马承认她给这片土地带来的许多祝福。你将写一份关于她的生活的详细说明，无疑会说服罗马对她进行封圣。"
 maria_decision_confirm: "圣徒的努力"
 heir_gauthier_modifier: "戈捷的继承人"
 heir_gauthier_modifier_desc: "强大的鲍迪奥恩是戈捷选定的继任者。亚柯骑士正尽职尽责地团结在“布列塔尼”身后。"
 heiress_gauthier_modifier: "戈捷的女继承人"
 heiress_gauthier_modifier_desc: "聪明的让是戈捷选定的继任者。她将带领亚柯骑士取得胜利……无论他们是否愿意。"
 podintroductions.218.t: "你的故事就此展开"
 podintroductions.218.desc: "戈捷大人，时间不等人，主很快就会召唤您回到祂身边。您必须让亚柯骑士们为这一时刻做好准备。\n预期的行动方案是，您将忠实的鲍迪奥恩从德意志召回，并提名他为您的继任者。作为一个有才华和有魅力的领导人，他将做得足够好，您确信这一点。\n但是……还有让娜，或者说让，她喜欢如此被称呼。她头脑中的光辉在过去曾多次让您感到震惊，她可能是世界上有史以来对敌对者的最大威胁。不过有一个问题……她是个女人。亚柯骑士们已经对您提拔她进入您的核心圈子感到不满，所以如果您提名她为继承人……\n无论如何，必须做出选择。您的传承取决于此。"
 podintroductions.218.a: "鲍迪奥恩是显而易见的选择。"
 podintroductions.218.b: "让就是未来。"
 gauthier_intro_tooltip: "让大怒，离开了亚柯骑士团，再也没有人看到她。"
 PODcanon_chars.58.t: "哈德施塔特到永远"
 PODcanon_chars.58.desc: "你的[Glossary('尊长','game_concept_Sire_desc')]——哈德施塔特最近已经终焉之死。可以肯定的是，这是一个悲惨的事件，但从长远来看，你并不认为它会对你产生多大的影响。不过，自从他去世后，你一直感觉……很奇怪。\n关于与他会面的回忆，关于“应急计划”的谈话，你的记忆中有一星期的空白……你突然觉得自己越来越多地模仿你已故的主上，像他那样说话和行动……甚至像他那样思考。哈德施塔特真的死了吗？你身上发生了什么？\n也许永远会有一位哈德施塔特……"
 PODcanon_chars.58.a: "说我已终焉之死的谣言被严重夸大了。"
 PODcanon_chars.58.b: "我是我自己！"
 hardestadt_takeover_tt: "你将成为哈德施塔特，获得他的特质，失去你的特质，甚至变得看起来像他。"
 podintroductions.219.desc: "狡猾的女士，你是士之一，恶名昭彰的天军的继承者。这个伟大联盟的覆灭让你类化为乌合之众，如今你独自猎妖。你已经在这场棋局中表现得相当娴熟，利用你那无知的丈夫在望族中的关系，追踪并消灭毫无防备的超自然敌人。\n然而，还有一个更大的奖赏在等着你。天军的覆灭导致他们最珍贵的宝物散落四方，如今被那些不配拥有的人用作战利品（甚至更糟，武器）。你强大的神秘扇子已经在你手中，但你梦想着如果能够找回其他宝物，你将能够取得什么样的成就。这些本身就是强大的遗物，但它们也会为持有者带来很多声望，也许会让你踏上重建天军的道路，如果你愿意的话。"
 podintroductions.219.a: "我已经追踪到了它们，现在要去得到它们……"
 PODcanon_chars.59.t: "蒙卡达的传承"
 PODcanon_chars.59.desc: "露西塔女士，几年前你战胜了你受诅的尊长蒙卡达，但这场胜利开始感到空虚。你曾致力于将他拉下马，而现在事已至此……你漫无目的，从一个事业徘徊到另一个事业，希望找到一个新的驱动你生存的目标。\n更糟的是，你有一种耿耿于怀的感觉，蒙卡达预言了这个结果和这个非常时刻。的确，你的[Glossary('尊长','game_concept_Sire_desc')]经常谈到他的神圣职责和你的命运，即跟随他的脚步，无论你是否打算这样做。在当时，这听起来像是一种威胁，但现在……也许更像是一种预言。也许他是对的，也许他的职责一直以来都会成为你的职责。\n逃脱你的命运似乎并不那么容易。"
 PODcanon_chars.59.a: "我明白了。"
 PODcanon_chars.59.b: "我不能让他赢！"
 podintroductions.220.t: "你的故事就此展开"
 podintroductions.220.desc: "伟大的荷鲁斯，您与您的丑恶叔父赛特的传奇战争必须继续。您不会否认有一些挫折，而且蛇之子在埃及也像以前一样强大。但这并不重要，因为您是复仇者。奥西里斯和伊西斯从远方注视着您，等待着您最终将这条懦弱的蛇惨叫着送回催生他的深渊的那一刻。\n召集您忠实的战士们，准备向北进军。是时候一劳永逸地解决这个问题了。"
 podintroductions.220.a: "我向你而来，叔父……"
 horus_intro_tooltip: "作为荷鲁斯，你有一项专属决议，即最终达成你的复仇。"
 horus_decision: "复仇者"
 horus_decision_tooltip: "我很快就会出现在你的噩梦中，叔父。"
 horus_decision_desc: "如果你要找到赛特的藏身之处，你首先要削弱他的邪教羽翼，并摧毁他最信任的追随者骨干。"
 horus_decision_confirm: "他在哪？!"
 horus_custom_decision_1: "[GetScriptedCharacterByHistoryID('505094').GetFirstName]，赛特的宠儿，必须死"
 horus_custom_decision_2: "[GetScriptedCharacterByHistoryID('790126').GetFirstName]，赛特邪教的支柱，必须死"
 horus_custom_decision_3: "[GetScriptedCharacterByHistoryID('790128').GetFirstName]，赛特的妻妾，必须死"
 horus_custom_decision_4: "[GetScriptedCharacterByHistoryID('790988').GetFirstName]，赛特的勇士，必须死"
 horus_decision_effect_tooltip: "你的复仇将得以实现。"
 horus_the_avenger_modifier: "荷鲁斯，复仇者"
 horus_the_avenger_modifier_desc: "活法老、不死之子、复仇者、归来的王、独眼之王、第一重生者以及其他许多头衔……但首先，是赛特克星。"
 PODcanon_chars.60.custom.tt: "所有残余的赛特之子的权威都将破碎。"
 PODcanon_chars.60.t: "斩蛇"
 PODcanon_chars.60.desc: "令人失望。\n在把他的教派毁于一旦，并杀死了他最信任的顾问之后，你期望赛特能为你提供一场光荣的最后一战来庆祝你的胜利。诚然，你不得不在上百个疯狂的狂热者中杀出一条血路，才能来到这座金字塔的地下室，而且你现在浑身是血，但这仅仅是热身而已。而现在，你站在你叔父的石棺前，那个蠢货在石棺里休眠，不时地扭动，也许有点意识到你为他准备的宿命。\n你开始疯狂地砍他的尸体，直到每块都切成能被抓在手里。然后你走到外面，让神圣地拉神将遗体烧成焦炭。除了他的眼睛，你把它扔给一只路过的秃鹫，以纪念你自己失去的那只。\n然后，只有在那时，你才会跪下来，让沙子把你冲走，直到你再次重生，数个世纪以来第一次摆脱了对复仇的需求。"
 PODcanon_chars.60.a: "父亲，母亲，安息吧。"
 podintroductions.221.t: "你的故事就此展开"
 podintroductions.221.desc: "受祝福的埃及女王，您已经明智地与荷鲁斯愚蠢的圣战保持距离。相反，您关心的是更重要的事情，比如在凡人的心目中保护旧埃及的伟大。这确实是一个巨大的任务，即使是像您这样有奉献精神和影响力的人。\n然而您别无选择，荷鲁斯一心想要打仗，而赛特的堕落追随者则在腐蚀您心爱的祖国，只有您能记得当年是什么让埃及成为一个如此特别和强大的地方。您有责任让火种继续存在。"
 podintroductions.221.a: "伊西斯唯一有价值的传承是埃及本身"
 neferukhayt_intro_tooltip: "作为内弗鲁海特，你无法转变文化。\n但你推广文化任务速度更快。"
 socialite_queen_egypt_modifier: "交际女王"
 socialite_queen_egypt_modifier_desc: "内弗鲁海特是古埃及伟大者的具身。与她交谈让你真的感觉到，黑土之国是永恒的。"
 NEFERUKHAYT_CULTURE_BONUS: "内弗鲁海特的激情"
 podintroductions.222.t: "你的故事就此展开"
 podintroductions.222.desc: "伟大的赫赫提，您是赛特本人创造的七大忌灵木乃伊之一。而且，在您看来，您是这群可怜人中唯一有能力的人（除了阿门，他是一位非常好地食伴没别的）。因此，您必须起带头作用，确保您神圣地灭世任务不偏离目标。\n显然，您对其他六个人的期望不亚于完全的服从，以及在您需要的时候随时愿意拿出他们的金钱。即使在曾是凡人时，您也总是喜欢金钱，而且，很明显，在您宽大的口袋里比在他们瘦小的财库里更合适。如果他们手头没有足够的金钱呢？好吧，也许他们可以成为您著名宴会的特殊宾客……"
 podintroductions.222.a: "有什么比吃饱肚子，填满宝库更好呢？"
 hemhemti_intro_tooltip: "作为赫赫提，你可以直接使用敲诈臣民决议。该决议也将能消除压力。"
 hunted_down_eternity_modifier: "永恒追杀"
 hunted_down_eternity_modifier_desc: "荷鲁斯和他的贤荷鲁将永远不会停止追捕你。赛特和他的忌灵木乃伊也不会。而每一位想要真正不朽的贪婪法师或吸血鬼，也在追捕中。\n这就是你的宿命。"
 cabirus_intro_tooltip: "你将保留对生命神咒的使用权和制造新木乃伊的能力，但你将永远被那些想拥有该神咒的人追杀。"
 cabirus_intro_giveup_tooltip: "你放弃了生命神咒，使得你无法在未来创造新的木乃伊。"
 podintroductions.223.t: "你的故事就此展开"
 podintroductions.223.desc: "卡比洛斯大人，您已经完成了不可能的任务：学会了生命神咒，从众神手中夺回了真正的不朽……但众神很生气。自从您把自己化为木乃伊的光荣之日，您就被无数想要获得神咒的人追杀。\n唯一的出路（除了缓慢而痛苦的死亡之外）是荷鲁斯本人给您的，要求您让他从您的记忆中抹去生命神咒。这无疑会免去您的追捕者，但也意味着您将永远无法再制造新的木乃伊。而永生可能是过长于独自忍受……"
 podintroductions.223.a: "我不能永生永世都在逃亡！"
 podintroductions.223.b: "我将一如既往地坚持下去"
 menele_custom_decision: "[GetScriptedCharacterByHistoryID('790179').GetFirstName]必须死，或者不再是你的敌人"
 helen_internal_modifier: "内部问题"
 helen_internal_modifier_desc: "你正专注于内部事务，确保迅速加强你在日耀族群的新权位。"
 shaky_helen_modifier: "受争议的统治"
 shaky_helen_modifier_desc: "你在族群的狼族居民眼皮底下夺走了它。他们还没有忘记这个事实。"
 podintroductions.225.t: "你的故事就此展开"
 podintroductions.225.desc: "大胆的海伦，通过您的果断行动和纯粹的意志力，您已经确保了您在享有盛誉的日耀族群中登顶。可悲的是，族群的大多数狼还没有真正承认您的崛起，这种不团结可能是族群众多敌人的一个机会。您必须要采取行动。\n您可以摆出一副倾听他们顾虑的模样，或者您可以依靠您的姐妹们的帮助，把日耀族群真正地变成一个黑怒族群。"
 podintroductions.225.a: "我将倾听你的顾虑。"
 podintroductions.225.b: "姐妹们，我们将重塑这片土地！"
 podintroductions.225.c: "我不需要任何帮助！"
 lucille_intro_tooltip: "作为露西尔，你开局时拥有更多的金钱，这要归功于你以前的冒险。你还将获得购买停战协议[character_interaction|E]。"
 podintroductions.226.t: "你的故事就此展开"
 podintroductions.226.desc: "狡猾的露西尔，在附近的裁判官取得了一场皮洛士式胜利之后，星域族群已经被消灭了。随着大部分领导层的消失，您几乎不费吹灰之力就成为被围困的守卫者的最后希望。然而，您知道勇敢和武力并不足以赢得对您强大敌人的胜利。\n由于您的许多邻居认为您很弱小或无足轻重，您也许能说服他们中的一些人，为了一袋硬币的承诺而暂时看开。而且，正如命运所安排的，您在以前的冒险中存下了几袋硬币。"
 podintroductions.226.a: "谁不喜欢钱呢？"
 timno_intro_tooltip: "作为蒂莫，你亲自辅导的每个孩子在成年后将获得5管理和5外交。"
 podintroductions.227.t: "你的故事就此展开"
 podintroductions.227.desc: "聪明的蒂莫，您的族群坐落在许多强大国度的交叉口。您将不得不小心您强大的吸血鬼邻居——自由邦和影幕。与瑞典的芬里尔仔兽或俄罗斯的银牙取得联系可能会有帮助。\n不管怎样，您知道在就算在您去世后，为盖亚的斗争也将继续很长时间。因此，您已经发誓要尽您所能为下一代准备好等待他们的考验。这可能是对抗怒嚎末日的最终胜利的关键。"
 podintroductions.227.a: "他们将做好准备。"
 podintroductions.228.t: "你的故事就此展开"
 podintroductions.228.desc: "大胆的布拉达，在经历了许多冒险之后，您已从流放归来，在不列颠群岛的芬尼安最需要的时候领导他们。您的魅力和精明的策略使他们摆脱了困境，但仍有许多事情要做。\n不过还有一个问题需要考虑，一个更私人的问题。您的先祖因为与名为斯蒂芬妮的吸血鬼有联系而受辱，这导致了您的家族被流放。虽然您已经证明了自己，但斯蒂芬妮仍然逍遥法外，并在玩弄着您。一直有暗示、警告甚至预言：您将在未来不得不面对她。也许您会赢，也许您不会，但重要的是，您将面对她手中的剑，洗去仍然玷污您的血脉的耻辱。"
 podintroductions.228.a: "我无法逃脱我的宿命。"
 bladdud_intro_tooltip: "如果你们都还活着，斯蒂芬妮会在10年后来找你们。"
 podintroductions.229.t: "命中注定的决斗"
 podintroductions.229.desc: "她就在那。那个欺骗了您的先祖并从那时起一直困扰着您的家族的人。她花了不少时间，但这魔物终于玩够了。\n您已经证明了自己的廉洁，所以她不是带着承诺或提议来的，她是带着獠牙来的。\n您不会屈服。您不会退缩。您的先祖在看着，希望您能成为为他们的耻辱复仇的人。是时候迎接您的命运了，布拉达。"
 podintroductions.229.a: "盖亚注视着我！"
 podintroductions.229.effect.success.desc: "斯蒂芬妮被击败了！"
 podintroductions.229.critical.failure.effect.desc: "到最后，光有勇敢还是不够。"
 podintroductions.230.t: "战胜宿命"
 podintroductions.230.desc: "您做到了，布拉达国王。斯蒂芬妮现在在您的脚下只剩下灰烬，您的血脉的耻辱的最后痕迹被风卷走了。巨大的欣慰涌上心头，因为虽然您仍要带领芬尼安走向他们的未来，但您知道您祖先的殿堂又是纯洁的，一旦时机成熟，就会迎接您。\n您离开了战场，准备回到您的人民身边。这是一个值得庆祝的时刻，吟游诗人会想听到关于这场决斗的一切，以确保您的故事在篝火旁被讲述，直到怒嚎末日。"
 podintroductions.230.a: "胜利的味道几乎和麦芽酒一样甜。"
 podintroductions.231.t: "迎接你的宿命"
 podintroductions.231.desc: "没有人能逃脱他的宿命，布拉达国王，甚至您也不能。正如预言所预言的那样，斯蒂芬妮将在更长的时间内压迫和诅咒您的血脉。当您躺在地上，流血不止时，您知道您并没有全输。面对如此强大的敌人，依然手握利剑而死，者将被您的部族长期铭记，您的血脉可耻的过往将被宽恕。\n也许有一天，您的某个后裔会为您报仇，并最终结束这场争斗。然而在那之前，您最后一次闭上眼睛，希望盖亚会在她的怀抱中欢迎她死去的斗士。"
 podintroductions.231.a: "我的死证明我活过。"
 depopulated_fenris_modifier: "失去的一代"
 depopulated_fenris_modifier_desc: "太多勇敢的芬里尔和他们的兽嫡在对抗奥丁的战争中死去。圣地需要时间来重新恢复狼口。"
 podintroductions.232.t: "你的故事就此展开"
 podintroductions.232.desc: "伊冯娜女士，在对奥丁的战斗达到巅峰时，您正在英格兰执行任务。虽然勇敢的战士们胜利归来，但代价太高了。太多训练有素的芬里尔和他们忠实的兽嫡在那场战役中死去。事实上，如此之多，以至于您突然成为剩下的酋长中最有可能成为领导的人选。\n您不能大声说出来，但您知道情况很糟糕。到头来损失了整整一代，也没在对抗奥丁的受诅衍体中有什么成果。您将不得不依靠快速的劫掠，直到芬里尔恢复了足够的力量来恢复战争。"
 podintroductions.232.a: "我们必须舔舐我们的伤口。"
 podintroductions.233.t: "你的故事就此展开"
 podintroductions.233.desc: "狡猾的脏玻璃，您的绰号和您的名声源自于您对白十字信徒的大胆突袭和诡计，但先礼后兵的时代正在结束。从东方来了一批新的入侵者，他们与马为伍，把人与狼都踩在脚下。这些是危险的敌人，您能感觉到他们中受诅的吸血鬼的气味。\n您在当地的群落中受到尊重，他们现在期待您带领他们进行更大胆的突袭。然而，这一次，这些将是血腥的突袭，以提醒这些东方人，草原是狼的土地，不属于其他任何人。"
 podintroductions.233.a: "我们狩猎。他们死亡。"
 stains_intro_tooltip: "每次脏玻璃的军队掠夺一个男爵领，她都会获得额外的声望。"
 podintroductions.234.t: "你的故事就此展开"
 podintroductions.234.desc: "伊丽莎白女士，夜空的影爵们面临着严峻的形势。最近对可恨的棘秘魑的攻击并不成功，只有他们对睿魔尔的战争分散了他们对您的全部注意。\n附近新的月银牙，认真对待他们作为狼国统治者的职责，已经提议了许多援助。这是一个诱人的提议，但即使考虑这个选项也会让您骄傲的影爵火冒三丈。接受他们的领导，在您的许多部族伙伴眼中是可耻的，但也许这次，骄傲必须退居其次。"
 podintroductions.234.a: "我们自豪地独当一面！"
 podintroductions.234.b: "一些帮助总是好的。"
 podintroductions.234.c: "他们是我们的王。目前而言。"
 podintroductions.235.t: "你的故事就此展开"
 podintroductions.235.desc: "聪慧的乌普奥特，寂静漫游者再次期待您在他们被迫流亡的过程中领导他们。您是最后一个记得旧埃及的人，他们希望有一天您会带领他们回到您的故乡。\n诚然，您是独一无二的。作为荷鲁斯最早的支持者之一，您被赋予了生命神咒，并差点成为木乃伊，但您们部族的守护灵——猫头鹰介入了。在他的祝福下，您现在是……别的东西：永生，部分木乃伊，但也是完整的狼人。利用这一可观的好处，帮助您被困的人民最终再次找到目标。"
 podintroductions.235.a: "我是世界之间的桥梁。"
 wepauwet_intro_tooltip: "作为乌普奥特，你是永生的，且可以在保留了所有狼人能力的情况下获取一些木乃伊能力。"
 podintroductions.236.t: "你的故事就此展开"
 podintroductions.236.desc: "睿智的尚卡尔，您作为一个受人尊敬的导师领导星占已经有一段时间了，希望在未来的日子里也能如此。\n在这些时间里，您结识了您的陌生邻居，吸血鬼米拉日巴，一个神秘但睿智的家伙，似乎非常喜欢与您们的人谈论许多灵性话题。自从他在一个世纪前帮助保护圣地对抗可怕的节点爬行者后，他就成为了您们的朋友。吸血鬼和狼人之间的友谊几乎是闻所未闻的，但您们仍然珍惜它。这样一位古老而博学的生物并不经常出现，您仍然很想希望了解他和他对世界的看法。"
 podintroductions.236.a: "我是世界之间的桥梁。"
 chakal_intro_tooltip: "只要你和米拉日巴仍然是最好的朋友，他就会定期过来与你交谈，提供一些恩惠。"
 podintroductions.237.t: "老朋友"
 podintroductions.237.desc: "米拉日巴最近从他的山中庇护所来到您的宫廷，希望在您的人民中度过一些时间并与他们交谈。虽然许多人对一个吸血鬼出现在这个神圣的地方仍有戒心，但您知道米拉日巴是无害的，所以您第一个迎接他，并询问他目前的前景，以此来表明您的态度。"
 podintroductions.237.a: "一本旧书？说说。"
 podintroductions.237.b: "诸灵？我们知道关于它们的一两件事。"
 podintroductions.237.c: "盖亚心法？该从哪开始说……"
 tvarivich_twins_modifier: "命运双子"
 tvarivich_twins_modifier_desc: "特瓦里维奇双子有很多事情要做。只要他们在一起，他们就是不可阻挡的。"
 podintroductions.238.t: "你的故事就此展开"
 podintroductions.238.desc: "大胆的尤里，您是银牙的合法国王，因此，也是狼国的国王。尽管您已经有过伟大的冒险和许多名声，但仍有人对这一事实提出异议。您将证明他们是错的。\n为了这一努力，您可以算上您的孪生姐妹索菲亚的不朽支持。您们已经多次证明，您们在一起可以完成几乎所有的事情。靠着她，就像她会靠着您一样，去将银牙带到更高的高度！"
 podintroductions.238.a: "妹妹，我们将取得胜利！"
 yuri_intro_tooltip: "只要你和索菲亚还活着，你就会享受一个强大的修正。如果你们中的一个人死了，另一个人将遭受负面的后果。"
 PODcanon_chars.61.t: "你的小世界的终末"
 PODcanon_chars.61.desc: "索菲亚已经死了。看来，命运不等人，即使是传说中的特瓦里维奇双子。很久以前，在更幸福的时光，你们向对方承诺，你们将尽可能地同年同月同日死，因为否则继续下去有什么意义？但你是银牙的国王，你甚至可能没有奢望履行这个承诺，因为你有很多职责。\n如果索菲亚在再次见到你之前不得不多等一会儿，也许她会理解，但没有她你真的能继续下去吗？"
 PODcanon_chars.61.a: "姐姐，再等一等。"
 PODcanon_chars.61.b: "我有一个承诺要履行。"
 podintroductions.239.t: "你的故事就此展开"
 podintroductions.239.desc: "伊萨博女士，您通过袭击将最后的统治者困在勒索网中实现了光誓族群的控制。\n这种无情的手段一次又一次地让您得手，特别是在夺取您贵族家族在法兰西的的土地时。由于您在十字军国家根深蒂固，这些地产现在没有什么用处，但您可以用这些小头衔来换取一些快钱。毕竟，根据您的经验，如果勒索不足以获得您想要的东西，那么金钱通常就能。"
 podintroductions.239.a: "收获时间到。"
 isabeau_intro_tooltip: "作为伊萨博，你获得出售头衔决议。它的威望花费将减少。"
 podintroductions.240.t: "你的故事就此展开"
 podintroductions.240.desc: "虫修女，$glossary_wyrm$在呼唤您，它总是这样。他们都认为您疯了，包括您哥哥（不过他已经死了，所以显然是他疯了），但您知道真相：妖蛆关爱着您。\n这就是为什么祂引导您到这里来帮助它最强大的仆人之一——某个鬼婆。它现在很高兴地告诉您，您可能想把自己交给它的三头之一，为您的神圣使命做号充分准备。虫有很多头，大家都知道。您只需选一个。\n您并不像您哥哥那样是个白痴。"
 podintroductions.240.a: "像战争之兽一样咆哮！"
 podintroductions.240.b: "吞魂听起来很有意思"
 podintroductions.240.c: "我是伟大的欺诈者！"
 podintroductions.240.d: "$glossary_wyrm$就喜欢我现在这样！"
 podintroductions.241.t: "你的故事就此展开"
 podintroductions.241.desc: "无畏的阿迪萨，您战斗到了最后一刻，芙蕾雅被您打动，让您获得了复仇的机会。但现在这个问题已经解决了，还有新的紧迫问题。\n在您的每一次旅程中，您都看到过俯首的女人，她们的女性精神被暴君——就像那个该死的阿里曼——的意志所奴役。她们需要一位斗士，一位能将她们提升到她们能达到的不可思议的高度的人。这人只能是您。\n现在是时候让您神圣的母亲再次感到自豪了。"
 podintroductions.241.a: "觉醒吧，芙蕾雅的女武神！"
 adisa_intro_tooltip: "作为阿迪萨，你只能$pod_Embrace$女性。你的子嗣会获得专属教育事件。"
 horus_first_modifier: "荷鲁斯，第一木乃伊"
 horus_first_modifier_desc: "荷鲁斯被他的母亲伊西斯亲自制成木乃伊。因此，他比其他不死者保留了更多的原始力量。"
 podintroductions.242.t: "你的故事就此展开"
 podintroductions.242.desc: "无上的瓦沙克，您精心设计的一个计划很快就要实现了。\n您早就预见到了您在戈尔康达的耆那教正在衰弱，因此决定将您的精华分割成许多较小的宝物，然后让您的信徒将它们散布到世界各地。其中一件耳环，已经找到了一位够格的主人。一个名叫维奥丽卡的强大的睿魔尔女巫已经跟着您的调子跳了一段时间，在遥远的欧洲传播着您的荣耀。这一直是一个有趣的乐子，但现在您正在准备您的下一步行动，您面临着一个选择。\n您想把维奥丽卡引到印度，用耳环把她完全腐蚀成一位潜在的有用的仆人？或者您想促使她为您的荣耀牺牲自己，在这个过程中为您的宝物注入更多的力量？"
 podintroductions.242.a: "来见我，魔女！"
 podintroductions.242.b: "我的宝贝必须回归！"
 podintroductions.243.t: "你的故事就此展开"
 podintroductions.243.desc: "怪诞的欧若博司，您不可能在一个更好的时代醒来。\n凡人受困于饥荒，被保守的教会剥夺了他们应有的欲望。您的责任，不，是您的愉悦！把他们从枷锁中解放出来，让他们沉溺于每一个他们遗憾地压抑的黑暗欲望。\n然而现在您还很虚弱，可能需要您最喜欢的宠物的帮助来巩固您的地位。您总是喜欢那些在您闻名的壮观盛宴之后四处都是的害虫。这些暴食的小信徒可能不会给您带来真正的力量，但人多就有力量……"
 podintroductions.243.a: "我们一起过了一段多么快乐的时光啊！"
 orobas_intro_tt: "作为欧若博司，你独有权限招募多种小型动物兵种"
 babayaga_bound_bezariel_modifier: "缚于芭芭雅嘎"
 babayaga_bound_bezariel_modifier_desc: "鬼婆封印了你真正的力量以保持对你的控制，但她在你身边的轻微痕迹使你显得更加可怕。"
 podintroductions.244.t: "你的故事就此展开"
 podintroductions.244.desc: "完美的贝撒列尔，到目前为止，您在凡俗位面的回归是一件困难的事情。\n您被称为芭芭雅嘎的强大吸血鬼召唤和束缚，她打算将您作为她军队中的一名将军。虽然您很感激她帮助您逃离深渊监狱和提供的权位，但您知道命运不等人，即使是像鬼婆这样强大的存在，有一天晚上也不得不面对她的命运。您要为这种情况的发生做好准备，并在这期间创建您自己的基地。\n您总是注定要做伟大的事情，甚至路西法如果看到您潜力的真正程度也会停步。作为曾经的命运天使，现在是再造您自己的时候了，让天堂和地狱都为之颤抖吧！"
 podintroductions.244.a: "我将比鬼婆、路西法甚至是上帝本人都要长久！"
 bezariel_intro_tt: "作为贝撒列尔，你有独特权限通过决议重新考量对芭芭雅嘎的忠诚"
 bezariel_decision: "血天使的扬升"
 bezariel_decision_tooltip: "鬼婆是一位有用的盟友，但……"
 bezariel_decision_desc: "芭芭雅嘎为了她自己的目的而召唤你。但如果你不顾她的枷锁而壮大自己的力量，你可以“重新谈判”你的协议……"
 bezariel_decision_effect_tooltip: "你将重新考虑你与鬼婆的合作关系。"
 bezariel_decision_confirm: "探望祖母……"
 PODcanon_chars.62.t: "血与铁"
 PODcanon_chars.62.desc: "铁之鬼婆，芭芭雅嘎，在将你从深渊监狱中解救出来的过程中起到了重要作用。在某种程度上，你欠她你的自由，但她也足够谨慎，对你能真正驾驭多少天使的力量施加了一些限制。\n尽管有这个缺点，你已经成功地增长了力量，并获得了影幕中——祖母本人之下——的最终权位。这可能是一个完美的机会，让你重新谈判之前的协议条款，使之对你有利……"
 PODcanon_chars.62.a: "我们仍可以共同合作……"
 PODcanon_chars.62.b: "我不向任何人屈膝！"
 bezariel_loyal_tt: "芭芭雅嘎会让你接触到戈里尼奇，这是一群非常强大的腐化巨龙兵士。"
 bezariel_disloyal_tt: "所有噩魇之道的角色将会皈依你的信仰。"
 babayaga_allied_bezariel_modifier: "铁与血"
 babayaga_allied_bezariel_modifier_desc: "血天使与铁之鬼婆形式上的结盟。上帝本人也应该为这一事件的转变而停步。"
 bezariel_unleashed_modifier: "血之扬升"
 bezariel_unleashed_modifier_desc: "没有任何监狱能够可以囚禁他。没有任何锁链能够可以遏制他。他的扬升已经开始。"
 ares_war_modifier: "战神"
 ares_war_modifier_desc: "战神鄙视这时代所谓的士兵，他们不过是农民而已。他只配为那些真正致力于战争的人服务！"
 podintroductions.245.t: "你的故事就此展开"
 podintroductions.245.desc: "愤怒的阿瑞斯，您已经从您在光荣的古希腊的鼎盛时期跌落得很低。\n您不再被希腊勇敢的希腊重装步兵和罗马不可阻挡的军团当作神来崇拜了。您的力量已经大大削弱，因为现在战争是由弱小的农兵构成的，他们向基督教的上帝而不是您本人致敬。不过，您的故事还没有结束。在这个世界上仍然有真正的战士，包括一些适当尊重战神的人，他们有许多形式。这可能不多，但它足以让您重新点燃人类对战斗和流血的热爱。\n毕竟，战争永不改变。"
 podintroductions.245.a: "和平是一种幻想。"
 podintroductions.246.t: "你的故事就此展开"
 podintroductions.246.desc: "拉玛什图女士，您从一位次级恶魔到神明霸权的崛起，到目前为止是漫长而艰辛的。\n您对提亚玛特的胜利是一个很好的起点，但您随后努力创造并维持了一个足够强大的密教，以进一步提升地位。波斯人在您的栖息所完全稳固之前就将其摧毁，您被迫沉睡了几个世纪。一次偶然的相遇唤醒了您，您仍然可以感受到您在第一次失败时在现在被称为亚柯的城市中失去的力量的回声。如果您能恢复对它的控制，您就能最终完成这个重要的仪式。这是您走向最终胜利的重要第一步。"
 podintroductions.246.a: "我已存续，现在我将胜利！"
 lamashtu_intro_tt: "作为拉玛什图，注意你的灵魂与名为”拉玛什图之心“的宝物共存。不要让它被毁坏或被偷！\n你有着专属决议，允许在取回亚柯后升级该宝物。"
 gabriel_trumpet_modifier: "圣约的诅咒"
 lamashtu_decision: "完善圣约"
 lamashtu_decision_tooltip: "处理未完成的事务。"
 lamashtu_decision_desc: "在波斯人的袭击之前，你的宿匣几乎已经完成。如果你收复亚柯，它的游荡力量将再次成为它的一部分。"
 lamashtu_decision_confirm: "我的心又一次完整了！"
 podintroductions.247.t: "你的故事就此展开"
 podintroductions.247.desc: "无所不吞的玛门，您的权位开始上升了。\n贪婪是一种可以控制的强大情感，您曾经相信没有人可以阻止您。然而，当早期的基督徒到来时，您被证明是错误的。利用对贫穷和虔诚的生活的宣扬，他们大大削弱了您的密教，直到最后让您沉眠。\n因此，当您的苏醒是由于这些同样的基督徒，现在终于像所有人一样欣赏奢侈品和黄金时，这对您来说是相当令魔高兴的。然而，您仍在恢复中，您会很明智地慢慢建立您的权力基础，一次一位新信徒。每个生命都渴望得到比他们所拥有的更多的东西，而您会很乐意提供……以那么一丁点的代价。"
 podintroductions.247.a: "你真正渴望什么？"
 mammon_intro_tt: "作为玛门，你的“赠送礼物”[character_interaction|E]有机会给目标带来“贪婪”特质，为腐化提供更多可能性。"
 podintroductions.248.t: "你的故事就此展开"
 podintroductions.248.desc: "明智的尼卡努拉努，您从深渊监狱突然逃出是最出人意料的，对是您自己也是。\n也许上帝怜悯您了？他没有回答，但您发现自己被束缚在匈牙利这片被战争蹂躏的土地上的一个不起眼的城堡——胡内多阿拉。除了等待审判日，您没有什么野心，但您不是傻瓜。如果您不尽快找到信徒资源，您将被拉回可怕的监狱。幸运的是，您有一个想法：为那些寻求远离世界的人提供庇护和保护，也许是为了寻找沉思和安静。\n一个契约很快就会形成，而您心中有完美的人选……"
 podintroductions.248.a: "隐秘的巢穴打开了……"
 niku_intro_tt: "作为拉玛什图，注意你缚于胡内多阿拉城堡即胡尼奥德伯爵领。不要失去它！\n你将有机会契约一些特别的吸血鬼。"
 PODcanon_chars.63.t: "契约：战士"
 PODcanon_chars.63.desc: "你确定了一群潜在的候选人，或是厌倦了战争，或是被敌人打得遍体鳞伤，或只是在寻找一个喘息的机会，他们愿意签署契约，将他们与胡内多阿拉结合起来。他们将是有用的仆人和训练有素的信徒，以确保你在凡俗位面的持久居留。"
 PODcanon_chars.63.a: "欢迎来到你的新家。"
 PODcanon_chars.63.b: "他们不行。"
 PODcanon_chars.64.t: "契约：学者"
 PODcanon_chars.65.t: "契约：贵族"
 PODcanon_chars.66.t: "契约：旅行者"
 podintroductions.249.t: "波斯的秘密"
 podintroductions.249.desc: "密特拉大人，您隐藏着一个很具有破坏性的秘密。您一直声称梵达多是您的[Glossary('尊长','game_concept_Sire_desc')]，这是真的，但所有人都认为这个名字是梵卓本人的化名，这不是真的。很久以前，您对一位被遗忘的吸血鬼实施了可怕的$pod_diablerie$，这就是您真正成为强大的第四代成员的原因。如果有人发现真相，潜在的危机将是巨大的。\n幸运的是，这$pod_diablerie$是如此之久，以至于大部分证据都被时间掩埋了。不过，一些痕迹还是可能被好奇的对手发现，您正在考虑在太晚之前摆脱任何可能导致他们发现这一罪行的东西。"
 podintroductions.249.a: "他们决不能知道这一点。"
 podintroductions.249.b: "我的秘密已经够隐蔽了。"
 PODcanon_chars.67.t: "下一步"
 PODcanon_chars.67.desc: "刻茉媞里女士，随着你死敌的信徒被解决，你现在可以自由地重新考虑你过往的麻烦了。赛特因为你对生命神咒——伊西斯的强大魔法，使她能够为对抗她的弟弟而创造木乃伊——的了解而折磨你。在这些黑暗的夜晚，你坚定地站在那里，从未讲出你的秘密。遗憾的是，你的心灵被这一事件打碎了，你只记得这艰难仪式的片段。\n随着赛特信徒被打败，你的心态也更加平和，你现在可以尝试找到一种方法来回忆生命神咒。无论怎样，创造木乃伊的知识将是你未来功业的强大资产。"
 PODcanon_chars.67.a: "我的心灵终于得到治愈。"
 kemintiri_phasetwo_tt: "你获得一项专属决议。"
 kemintiri_second_decision: "生之回忆"
 kemintiri_second_decision_tooltip: "你知道你的内心深处有一个最重要的秘密。你只需回忆。"
 kemintiri_second_decision_desc: "为了保护伊西斯的生命神咒，你承受了很多。如果你最终能清楚地回忆它，你就能再次创造出传说中的木乃伊。"
 kemintiri_second_decision_confirm: "我无愧于伊西斯的传承"
 kemintiri_second_decision_custom: "[GetScriptedCharacterByHistoryID('792593').GetFirstName]知道生命神咒。如果你能向他展示你对伊西斯的虔诚，他可能会帮忙。\n该角色必须是你的[friend|E]、[coterie|E]成员或[soulmate|E]。"
 kemintiri_second_decision_effect_tooltip: "你将能够对凡人使用[character_interaction|E]，使他们成为你的信徒，又称奈特鲁。\n你将获得对奈特鲁使用生命神咒[character_interaction|E]，使你能够将他们变成$POD_splat_mummy_plural$。"
 PODcanon_chars.68.t: "伊西斯之女"
 PODcanon_chars.68.desc: "刻茉媞里女士，这么多年后你终于想起了一切。你对神圣的奥西里斯的功业的奉献。伊西斯教你生命神咒时的美丽微笑。与大敌的永恒战争。赛特为了从你身上套出他所渴望的秘密而经历的几个世纪的折磨。\n但你也记得最痛苦的事，明白那时没有人能够拯救你。荷鲁斯和他的信徒们已经忘记了你，或者更糟的是，认为你是自愿加入赛特的。你记得他们讲述的关于你的故事，你是如何不可救药，你一些最老的朋友甚至何时毁灭你而与荷鲁斯争论。\n从那时起，你第一次记得足以做出一个可能改变你永恒亡生的选择。宽恕从来不是你的强项，但也许你能学会。"
 PODcanon_chars.68.a: "我终于回家了，伊西斯。"
 PODcanon_chars.68.b: "他们将付出代价！"
 kemintiri_no_redemption_tt: "你将能够对凡人使用[character_interaction|E]，使他们成为你的信徒，又称奈特鲁。\n你将获得对奈特鲁使用生命神咒[character_interaction|E]，使你能够将他们变成$POD_splat_mummy_plural$。\n你只需要2500而非10000虔诚来制造木乃伊。"
 PODcanon_chars.69.t: "我来，我看见，我征服！"
 PODcanon_chars.69.desc: "永恒执政救恩！\n您在意大利政坛的胜利回归正如许多人所期待的那样，打破了传统。您再一次向梵卓氏族证明，只有在欣赏亡生中的美好事物，呵护永恒灵魂的同时，才能找到真正的统治之路。\n一些梵卓希望您能凯旋而归，因为这意味着您的氏族将重回辉煌的罗马时代。但也有很多人悄悄地希望你失败，然后把失败归咎于你的享乐主义，把梵卓氏族搅入单调而严苛的未来。事实证明这些蠢人错了，虽然在永恒罗马重振雄风之前还有很多工作要做，但第一步已经迈出。"
 PODcanon_chars.69.a: "罗马和我一样永恒。"
 PODcanon_chars.70.t: "长嗣"
 PODcanon_chars.70.desc: "海伦女士，在亡生中你[Glossary('初拥','game_concept_Embrace_desc')]了些子嗣。随着对抗墨涅拉俄斯的战争再次激烈，是时候重审他们潜在的用处了。\n伊莱特丽雅是你的长嗣，你的挚爱帕里斯所怜悯的斯巴达艺术家，促使你拯救她免于险恶的结局。坦白说，伊莱特丽雅是没有骨气的胆小鬼，强迫她回来你身边十分简单，毕竟她不敢反抗。她不是你见过最优秀的血族，但还是有些用处，反正也不对你构成任何威胁。"
 PODcanon_chars.70.a: "该回来了，不然的话……"
 PODcanon_chars.70.b: "我的王廷不需要怯懦的蠢货。"
 PODcanon_chars.71.t: "次嗣"
 PODcanon_chars.71.desc: "残酷偏狭的贵族菲利普·伏尔杰是你的次嗣。遗憾的是由于他对自己血液的改变你无法触及他，也许之后需要调查下。玛利亚是你的三嗣，但她逃得太远，找她也许是不值得的事。\n接下来就是梅琳达·加尔布雷思，你的骄傲与喜悦。\n你将梅琳达塑造成冷酷无情且野心勃勃的生物，挡在她道路上的一切都将被践踏。在你训练她时，她也没像你其他子嗣那样崩溃，而是对你恨之入骨，一找到机会便逃离……但显然逃得还不够远。在许多方面，她都让你想起自己，经历过的艰苦血族教育，还有对自己[Glossary('尊长','game_concept_Sire_desc')]米诺斯的仇恨。\n你可以强迫梅琳达“回家”，毕竟她太幼小无法抵抗。不过她的意志总是如此坚定，可以确定的是，如果你这么做，她会更恨你……但也许你愿意付出如此代价，让你的浪子再次回到你身边。"
 PODcanon_chars.71.a: "你迟早会学会爱我的。"
 PODcanon_chars.71.b: "……我可不想要像米诺斯那样的下场。"
 PODcanon_chars.72.t: "幼嗣"
 PODcanon_chars.72.desc: "纪尧姆·德·洛里斯不久之前是法兰西的著名诗人。他的名气甚至使全爱之皇庭上下都争先恐后地争取初拥他的荣幸，用上复杂规则与密谋手段来确保对他的宣称。而后你半路杀出，在没有他们的（和他的）同意下初拥他，只因为你觉得他们的表情会很有趣。\n你很快对纪尧姆厌倦，于是留他在法兰西自生自灭，差不多是逼他深陷自我厌恶和绝望的短暂亡生。然而，在你与他相处的短暂时间里，你在他身上看到了一些东西，一些更深刻、更黑暗的野心和才能的火花，也许可以被导引出来并磨练成强大的武器。强迫这位破碎的诗人到你身边并对他用些心力，看看他最终会到达何处，这是否为值得的事？"
 PODcanon_chars.72.a: "我会密切关注他的诗人事业。"
 PODcanon_chars.72.b: "他那时候很有趣，不过也就这样。"
 helena_villon_tt: "如果纪尧姆·德·洛里斯留在你的宫廷，或是作为你的封臣，在三年后，他的个性会改变，他的能力将提升。"
 PODcanon_chars.73.t: "重生的诗人"
 PODcanon_chars.73.desc: "你已经栽培你从纪尧姆·德·洛里斯身上看到的异样潜能三年了，你很欣慰地注意到他个性的“改善”。在你的教导下，曾经绝望的诗人已经学会享受亡生的精致事物，他现在是你王廷的宝贵资产，之前他几乎没参与其中。\n你对他潜力的评估似乎是正确的。从某种角度来说也许太过了，纪尧姆现在表现出的野心与无情是他前所未有的。\n你必须确保对他的严加管束。"
 PODcanon_chars.73.a: "你已经变得有用，可别变成威胁了。"
 PODcanon_chars.74.t: "阿莱克修斯传"
 PODcanon_chars.74.desc: "尊贵的安娜，你从未能掌握住拜占庭的皇位，也不被凡人所铭记为本应该成为的巴塞丽莎。但是你还是完成了巨作阿莱克修斯传——对你时代的拜占庭政治的生动纪录，如果你对自己诚实的话，其中不乏个人偏见。由于你非比凡俗的写作风格与神秘的君士坦丁堡的内部活动描述，此书很快成为受人敬重的文本。\n随着你深爱的城市现今沦于拉丁野蛮人之手，阿莱克修斯传便成为美好岁月的遗迹。至少此书能让你专注于你的目标，为希腊人夺回该城并写下你自己的历史，这一次，是写给夜晚的统治者们。"
 PODcanon_chars.74.a: "父亲，我会使你自豪的。"
 podintroductions.250.desc: "色雷克斯女士，诺斯替派神学的福音拯救了您，使您免于绝望，您心痛地看到凡俗清洁派在法兰西被焚烧，但您还有更紧迫的事情要处理。\n罗马是梵卓的首要之地，你在削弱它的方面非常成功，直到卡米拉苏醒过来。在令人费解的举动中，永恒执政宣称您的攻击是“巨大的娱乐”，并任命您为城市的都市民选官。也许强大的梵卓有着隐藏的目的，或者他只是无所担忧。\n无论如何，您的道路是清晰的。您必须以某种方式削弱卡米拉的势力，将罗马夺为己有，并从那里重新建立布鲁赫$pod_clan$，使其摆脱旧罪的污染。"
 podintroductions.250.a: "完美的布鲁赫氏族将来临！"
 thrax_intro_tt: "作为色雷克斯，你具有一项专属决议，允许你将布鲁赫带向你的目标。"
 thrax_decision: "完美化布鲁赫"
 thrax_decision_tooltip: "现在是引导布鲁赫走向新时代的时候了。"
 thrax_decision_desc: "驯服罗马和它的永恒执政，布鲁赫就会拥护你的旗帜。"
 thrax_decision_confirm: "新的乌托邦！"
 thrax_decision_custom: "[GetScriptedCharacterByHistoryID('790101').GetFirstName]已经死亡、陷入[Glossary('蛰眠','game_concept_torpor_desc')]或成为你的封臣"
 thrax_decision_effect_tooltip: "布鲁赫氏族将获得宗族威望并且大部分角色将会皈依纯净之道。"
 PODcanon_chars.75.desc: "崇高的女士，你做到了。罗马毫无争议地属于你，经过数个世纪的艰辛，梵卓对布鲁赫精神的压制终于被打破。来自世界各地的你的族人惊叹地注视着你的胜利，并激烈地辩论你迄今为止的诺斯替派意识形态的价值。在迦太基的覆灭之后，布鲁赫绝望地寻找一个新的乌托邦，从君士坦丁堡的幻梦到墨涅拉俄斯派隐德來希，但最终，似乎你战胜了所有人。\n你不可否认的成功将为你的氏族铺平未来之路。坚守信念，继续前行，你将被铭记为特洛伊尔再世！"
 PODcanon_chars.75.a: "新的道路在前方。"
 thrax_conversion_tt: "非狂热布鲁赫将大概率皈依纯净之道。"
 podintroductions.251.desc: "智慧的色勒斯丟，您的时候到了！在凡生中，您因为所谓的“伯拉纠异端”而被剥夺了应有的认可。那些心胸狭窄的愚人再也不能阻止您，因为您已经拥有了永生。\n您将伯拉纠派的理论与你新获得的堕落吸血鬼的状态融合在一起，形成了对基督教和挪得教义的完美理解。您只缺少教宗的祝福，这样世界才能最终承认您的天才。\n到目前为止，那些意大利吸血鬼蠢材每次都阻止你觐见圣座，他们谈论狭隘的概念，比如“潜藏”或者“这只是个糟糕的主意”，但您并没有放弃。您将会见教宗，然后色勒斯丟的名字将载入历史！"
 podintroductions.251.a: "罗马在等待！"
 podintroductions.252.desc: "智慧的康斯坦西娅，您最近从成功的埃及之行中返回，成功地阻止了疯狂地拉撒路的计划。然而，他只是困扰卡帕多西亚$pod_clan$的众多问题中的一部分。由于雅弗正在忙于限制你善变的祖尊，您需要采取行动。\n乔凡尼家族是最紧迫的问题，必须在他们产生任何想法之前加以遏制。拉米亚表面上忠诚，但她们奇怪的莉莉丝崇拜需要谨慎监视。最后，拉撒路已经被阻止，但他仍然活着，他的一些同伙可能会试图唤醒他，这是绝对不能发生的。\n卡帕多西亚氏族的未来取决于您的行动，康斯坦西娅女士。不要让您体会过的黑暗预言成真。"
 podintroductions.252.a: "未来可以改变。"
 constancia_intro_tt: "作为康斯坦西娅，你具有一项专属决议来统一卡帕多西亚氏族。"
 united_cappadocians_modifier: "统一的卡帕多西亚"
 united_cappadocians_modifier_desc: "有史以来，死亡之氏族第一次真正统一了思想和目标。"
 constancia_decision: "弥合卡帕多西亚"
 constancia_decision_tooltip: "你必须在预言成真之前采取行动。"
 constancia_decision_desc: "各种内部势力正试图瓦解卡帕多西亚。你是唯一能阻止他们的人。"
 constancia_decision_confirm: "预言不会成真"
 constancia_decision_custom: "[GetScriptedCharacterByHistoryID('790537').GetFirstName]已经死亡、陷入[Glossary('蛰眠','game_concept_torpor_desc')]、成为你的封臣或成为[GetTitleByKey('k_erciyes').GetNameNoTier]的封臣"
 constancia_decision_custom2: "[GetScriptedCharacterByHistoryID('710502').GetFirstName]，[GetScriptedCharacterByHistoryID('710501').GetFirstName]的主要副手，必须死亡或者陷入[Glossary('蛰眠','game_concept_torpor_desc')]"
 constancia_decision_custom4: "[GetTitleByKey('k_giovanni').GetNameNoTier][title|E]已被销毁"
 lucretia_reckless_modifier: "鲁莽的卢克丽霞"
 lucretia_reckless_modifier_desc: "卢克丽霞总是在不知不觉中，在她所有的企图中冒着比她应该冒的更大的风险。"
 podintroductions.253.desc: "无畏的卢克丽霞，由于您与死者界域的强烈联系，您被乔凡尼家族热情地欢迎进入吸血鬼的世界。然而，他们没有意识到这个联系对您来说是一个巨大的负担，以至于您对自己的生命漠不关心，随时准备随心所欲地放弃它。\n幸运的是，您的[Glossary('尊长','game_concept_Sire_desc')]让您忙于许多有趣的神秘任务，或许是理解到让您的思绪始终忙碌可能是帮助您忍受命运的最好方式。也许这就是关键，如果您能找到一个足够有趣的目标来集中您的精力，那些声音终将变得更加安静。"
 podintroductions.253.a: "我会找到出路。"
 lucretia_intro_tt: "作为卢克丽霞，你开始时有一个负面修正，可通过一项专属决议来改善它。"
 lucretia_appeased_modifier: "平定的卢克丽霞"
 lucretia_appeased_modifier_desc: "从外表上看，卢克丽霞似乎一如既往地大胆。然而，在她的内心深处，她现在更看重自己的生命，因为这对她继续实现新的目标至关重要。"
 lucretia_decision: "鲁莽的奇才"
 lucretia_decision_tooltip: "你生命的价值是什么？"
 lucretia_decision_desc: "安布罗吉奥看到了你的潜力，并帮助你培养它。也许找到更高的目标才是解决你困境的关键。"
 lucretia_decision_confirm: "我全神贯注"
 podintroductions.254.desc: "吉勒摩大人，您身处一个本应令人羡慕的境地：您是威尼斯这座强大城市的亲王，也是该隐教会的备受尊敬的主教。但实际情况远比想象中更令人烦恼。\n您的政变（以及随后对行政事务的漠不关心）使得威尼斯成为贪婪的乔凡尼家族的易于攻击的猎物，他们现在几乎完全控制了共和国的领土，除了城市本身。他们可能很快会对您和威尼斯采取行动。\n更糟糕的是，新任的该隐教会大主教斯雷代茨的尼基塔，已经证明对于挪得教区本身构成了威胁，显然他在做出最糟糕的决策方面毫不犹豫。您目前正在对他进行调查，准备在教区面前展示证据……但如果您在此之前失去威尼斯，那么所有这些努力都将毫无意义。"
 podintroductions.254.a: "我在走钢丝。"
 guilelmo_intro_tt: "作为吉勒摩，你具有一项专属决议，要求你在接下来20年里持有威尼斯。如果做到，你将继承所剩的挪得教区。"
 guilelmo_decision: "拯救教会和你自己"
 guilelmo_decision_tooltip: "要救赎该隐子嗣的灵魂首先需要救赎自己的。"
 guilelmo_decision_desc: "你关于斯雷代茨的尼基塔的告发已经快达成了。如果你能再坚守阵地一段时间，挪得教区就是你的了。"
 guilelmo_decision_confirm: "你被指控了！"
 guilelmo_custom_decision: "此决议只在1250年后可用"
 podintroductions.255.desc: "法蒂玛女士，迄今为止，您的亡生一直都是宁静的。您的尊长是一位耐心的导师，勒森魃$pod_clan$也迅速认识到了您的潜力。但是，伴随着这样的良好成长，也伴随着巨大地期望，氏族现在为您规划了第一个任务，而这是一项艰巨的任务。\n尽管从未真正控制过摩加迪沙，但勒森魃氏族一直声称它是他们的城市。许多稚子（甚至更有经验的吸血鬼）被派往这座“珍珠之城”来征服它，但他们中没有人能够在那里适应复杂的政治局势。\n坦率地说，他们中没有人能够平安归来。\n然而，您并不仅仅是普通的勒森魃氏族成员。您已经被培养成为伟大的人物，而您将在此刻证明您的价值！"
 podintroductions.255.a: "我将胜利归来。"
 fatimaallama_intro_tt: "作为法蒂玛，你就有一项要求你完全掌控阿朱兰的专属决议。如果你做到了，勒森魃氏族会给你带来丰厚的奖励。"
 fatima_queen_pearls_modifier: "珍光君主"
 fatima_queen_pearls_modifier_desc: "摩加迪沙女王统治着世界上最繁华的城镇之一，并让她的整个氏族引以为豪。"
 fatimaallama_decision: "珍光君主"
 fatimaallama_decision_tooltip: "你有一项使命，你必须完成它。全氏族的目光都集中在你身上。"
 fatimaallama_decision_desc: "摩加迪沙必须属于勒森魃。这是你的使命，等待你的将是丰厚的回报。你已经做好了失败的准备。"
 fatimaallama_decision_confirm: "暗影在摩加迪沙之上"
 podintroductions.256.desc: "达舒夫大人，这是您的末路了。您曾公平地统治过大马士革，曾让这座城市成为黎凡特的一颗明珠，但安纳西尔的腐化让你无法忍受。现在崇魔者巴力在你的街道上游荡，代替您统治您的城市。而您却只能无助地困在您的宫殿里。关于可怕的献祭之井的传言不胫而走，您可能会被人们记住，因为您是那个让地狱降临人间的软弱亲王。哈基姆圣裔即将对您的城市发动攻击，这给了您一些希望，但您无力帮助他们。\n不过，您可以做一些事情。您亲爱的子嗣玛娜尔从未离开过你的身边，并竭尽全力拯救您。现在是您拯救她的时候了。你要用仅存的力量帮助她在大马士革掌权，挫败巴力。您知道，在这条道路的尽头，等待您的只有毁灭。\n但也可能是救赎。"
 podintroductions.256.a: "我的最后一件事将是一件好事。"
 podintroductions.256.b: "已经完了……"
 darshuf_intro_tt: " 在这一事件链结束时，您将让位给玛娜尔，并做好各种准备帮助她掌权。"
 PODcanon_chars.76.t: "与魔鬼打交道"
 PODcanon_chars.76.desc: "安纳齐尔成为了你的终末。他来到大马士革，伪装成朋友，慢慢地将他的腐化渗入你的思想中，使你参与了一些可怕的事情，你不愿回忆起来。从那时起，他就几乎完全控制了大马士革，他的党羽们正在您的城市中蜂拥而至。\n现在已经太晚再采取温和的手段了。如果您希望马纳尔能够继承一个复苏的城市，你需要大胆地对抗巴力，不管后果如何。您仍然是一位具有令人印象深刻的个人武力的吸血鬼，给你提供了两个选择。第一个选择是袭击安纳齐尔的手下，他们在你的眼皮底下傲慢地生活着，而另一个选择则是处理自从他来到大马士革以来所获得的众多凡人资源。"
 PODcanon_chars.76.a: "“朋友们”，该去死了。"
 PODcanon_chars.76.b: "大马士革必须被清洗。"
 PODcanon_chars.77.t: "你的遗产"
 PODcanon_chars.77.desc: "当大马士革最终落入玛娜尔的掌管时，她将需要尽可能多的帮助。在巴力发起反攻之前，你仍然可以变卖一些资产，因为金钱肯定会有用。此外，尽管自那时以来发生了许多事情，你曾经成功使大马士革成为一个繁荣和良好管理的城市。花时间与她交谈，教她你所学到的知识，可以让她有一个先发优势，并希望她能避免犯同样的错误。\n而且，如果你对自己诚实，你将享受与她共度你在这个世界上的最后几个夜晚。"
 PODcanon_chars.77.a: "我的时代已经过去，她需要资产。"
 PODcanon_chars.77.b: "孩子，我们得谈谈……"
 PODcanon_chars.78.t: "结束与开始"
 PODcanon_chars.78.desc: "达舒夫大人，时机已至。如今你已不再是巴力的傀儡，敌人正逐渐逼近。你只剩下最后一个选择，选择你的死亡方式。\n哈基姆圣裔的比斯塔克将很愿意为你的罪行夺取你的首级，你知道你是她与玛娜尔友谊之间的唯一障碍。拥有如此强大的盟友无疑将对你的子嗣在未来带来帮助。\n安纳齐尔是另一选项。以殉道者身份离世可能会为那些尚未被邪恶者腐化的人们聚集一些善意，这也将对玛娜尔有所帮助。\n这就是结束的时刻。你将使其有所意义。"
 PODcanon_chars.78.a: "正义得到了伸张。"
 PODcanon_chars.78.b: "光彩夺目。"
 podintroductions.257.desc: "撒米亚大人，您[Glossary('尊长','game_concept_Sire_desc')]的突然消失，使您得以在亚丁掌握权力的大权。在此之前，您一直是一位勤奋尽责的子嗣，以出色的管理能力闻名，帮助亚丁实现了今天的繁荣。转变为掌握实际权力的身份是自然而然的，且令人振奋。\n全面利用这个机遇，您迅速在该地区扩大了影响力，成为也门的主要势力。然而，您的天空上有两朵乌云。最近有传言称您的尊长有在东方出没，您不会放弃权力，只能彻底与他解决这个问题。\n更近的麻烦是您的血亲萨坎，她曾经被您的尊长培养成为统治者，可能构成威胁。然而，她迄今为止没有对您采取任何行动，所以您可能能够在不诉诸暴力的情况下处理她。"
 podintroductions.257.a: "我再也不会向任何人屈服了。"
 shamshit_intro_tt: "作为撒米亚，你有一项要求你在寻找新机遇之前先稳定自己的状况的专属决议。"
 shamit_decision: "巩固统治"
 shamit_decision_tooltip: "亚丁是你的，你要确保它一直是你的。"
 shamit_decision_desc: "你尊长的阴影仍笼罩着也门。在寻找北上机会之前，你必须先铲除其的残余势力。"
 shamit_decision_confirm: "不再是子嗣"
 shamit_decision_custom: "[GetScriptedCharacterByHistoryID('790296').GetFirstName]，你的尊长，必须死亡或者陷入[Glossary('蛰眠','game_concept_torpor_desc')]"
 shamit_decision_custom2: "[GetScriptedCharacterByHistoryID('791099').GetFirstName]，你的血亲，必须死亡、陷入$pod_torpor$，或与你有正面关系（[lover|E]、[friend|E]、[soulmate|E]、[best_friend|E]、[coterie|E]成员）"
 podintroductions.258.desc: "强大的魔龙，您一直在扮演弱小的斯雷代茨的尼基塔，以从内部削弱令人憎恨的该隐教会。到目前为止，这一行动取得了骄人地成功，因为您已将这个曾经强大地组织削弱到了巴尔干地区的核心领地。\n现在是致命一击的时刻。一旦该隐教会的中心本身倒下，您将能够摆脱这个精心打造的身份，并思考接下来该做什么。重建幻梦可能是一个选择，至少是为了纪念您心爱的米迦勒。但还有其他选择，一旦您完成了复仇，面前将是永恒的未来。"
 podintroductions.258.a: "我将结束这一切，获得新生。"
 podintroductions.258.b: "前方或许还有另一条路。"
 nikita_intro_tt: "你将经历一连串的事件，这些事件将彻底改变你的起始地位，最终您将成为魔龙，一位强大的吸血鬼，但同时也会摧毁挪得教区，从单个伯爵领重新开始。"
 PODcanon_chars.79.t: "清算教会"
 PODcanon_chars.79.desc: "作为挪得大主教，你对该教会成员拥有巨大的权威。到目前为止，你的破坏行动一直很隐蔽，但现在已经到了不再需要这种欺骗手段的时候了。你将发布一系列矛盾且荒谬的法令给忠实信徒，同时也向他们的敌人揭示他们的秘密资产。\n在你的清洗行动之后，任何仍留在该教会的成员都将发现他们的亡生变得相当不愉快。"
 PODcanon_chars.79.a: "他们的末日开始了。"
 nikita_liquidating_tt: "除了你自己，所有该隐之道的追随者都将失去金钱、声望和虔诚。"
 PODcanon_chars.80.t: "谋杀诸枢机"
 PODcanon_chars.80.desc: "在你几年前对该组织的最早阴谋中，许多教会高层成员已经被处理过了。然而，仍有一些强大的枢机主教幸存下来，如果他们在你离开后试图夺取教会，可能会构成威胁。\n为了确保这种情况不会发生，你召集了一次挪得教区会议，剩下的枢机主教们渴望讨论解救他们衰败宗教的解决方案。\n你将确保没有人能够活着离开晚餐厅。当然，除了你自己。"
 PODcanon_chars.80.a: "在他们的血液中重生。"
 PODcanon_chars.81.t: "其时代的终结"
 PODcanon_chars.81.desc: "该隐教会已经一无所有。他们的领导者已经死亡，他们的教义被诽谤，他们的成员如同弱者一般被猎杀。你的复仇已经完成，那场导致你心爱的米迦勒作古的灾难性第四次十字军东征的策划者已经成为风中的灰烬。只剩下最后一步。\n是时候摒弃这个可悲地伪装，解散挪得教区，消除该隐异端可能仍然怀有的最后一丝希望。该隐教会已经死了。斯雷代茨的尼基塔已经死了。\n魔龙将重生。"
 PODcanon_chars.81.a: "在他们的愚昧中，我得到了救赎。"
 kartarirya_eternal_war_modifier: "永恒之战"
 kartarirya_eternal_war_modifier_desc: "你前去征服这个可悲的世界，你凶猛的血仆们在前面带路。"
 podintroductions.259.desc: "可畏的迦𫄨里璃，印度对您的抵抗已经持续太久。作为这片大陆的战神，您早该让它沐浴在鲜血和残暴之中，但这些顽固的雷伏诺和[Glossary('万鬼','game_concept_kuei_jin_desc')]却证明自己是坚韧的敌人，有时甚至联合起来阻止您。不再如此了。\n您已经花费了一个纪元的时间，将您的战争血仆强化至前所未有的程度，并准备在一场辉煌而血腥的征服中释放它们。\n当整片大陆躺在您脚下，垂死挣扎时，印度的永恒之战将终结……然后……那时，整个世界将成为您可怕的游乐场。"
 podintroductions.259.a: "死亡和杀戮在等待着我们！"
 kartarirya_intro_tt: "作为迦𫄨里璃，无论你的宗教或文化为何，你都可以使用入侵[casus_belli|E]。"
 vencel_divided_attention_modifier: "注意力的分散"
 vencel_divided_attention_modifier_desc: "他对尊长的誓言和对布达佩斯的誓言让文策尔的生活变得相当复杂。"
 podintroductions.260.desc: "忠诚的文策尔，布达佩斯在您细心的统治下繁荣发展，您在于傲慢的德意志梵卓和他们的睿魔尔盟友外交时在两者之间保持平衡。目前，棘秘魑大多对您置之不理，他们的注意力都集中在睿魔尔身上。然而，您仍然有更亲近的问题需要处理。\n您已经一段时间以来一直看护着您的[Glossary('尊长','game_concept_Sire_desc')]布尔斯库。这位曾经傲视群雄、强大无比的首领，尽管您尽力而为，却已经堕落成一个沉溺于享乐的废物。然而，最近他陷入了[Glossary('蛰眠','game_concept_torpor_desc')]，您希望他在苏醒时能够摆脱不体面的渴望。在照顾他的同时，您还必须积极管理着您不断发展的城市和错综复杂的阴谋网络。这种分心让您感到压力重重，但您将像往常一样，尽力履行所需之责。"
 podintroductions.260.a: "荣誉使然。"
 vencel_intro_tt: "在未来几年里，你将有机会去掉你的起始修正。如果你不这样做，而是平衡你的注意力，你的付出将会得到回报。"
 PODcanon_chars.82.t: "最亲的家人"
 PODcanon_chars.82.desc: "文策尔大人，你一直是你尊长布尔斯库建立的“阿尔帕德”吸血鬼血统中唯一忠诚而有用的子嗣。您的同伴们从近乎滑稽的无能者诺娃，到比起有用更加有害的格扎和他奇怪的末日论思想，各种各样。\n可悲的是，尽管你努力将他们的影响从匈牙利彻底抹去，但他们远离布尔斯库时造成的伤害只是不断积累。你可以亲自处理这些事务，但那将需要你暂时离开布尔斯库的身边，而这正是你不愿意做的事情。"
 PODcanon_chars.82.a: "他们必须被阻止。"
 PODcanon_chars.82.b: "只要付钱给一些代理人，就能削弱他们的影响力。"
 vencel_balancing_tt: "你将保持持平的，和分散的，意图。"
 PODcanon_chars.83.t: "在十字和军督之间"
 PODcanon_chars.83.desc: "文策尔大人，匈牙利一直处于一个不稳定的局势中。一方面，黑十字封邑基本上把你视为封臣，而另一方面，棘秘魑军督领则认为你是入侵者。事实上，你一直在谨慎地平衡他们的立场，以确保你的“东部领主”保持独立并对每人都有用。\n到目前为止，这一切进展顺利，但最近一连串的通信，从要求到威胁，来自邻国的压力让你过于忙碌，难以跟上。你可以将所有工作时间都投入到这个重要任务中，但那将让你其他更为隐秘的职责无人照料。"
 PODcanon_chars.83.a: "这太重要了，不能再拖了。"
 PODcanon_chars.83.b: "我可以自己处理好一切。"
 PODcanon_chars.84.t: "血人回归"
 PODcanon_chars.84.desc: "起初，你很难相信这个消息，但事实却是如此，布尔斯库——你尊敬的[Glossary('尊长','game_concept_Sire_desc')]——终于从他的放纵沉眠中苏醒过来。你曾担心他会重新陷入黑暗的习性，但似乎这段[Glossary('蛰眠','game_concept_torpor_desc')]对他有益，你能看到他曾经伟大战将的影子。\n布尔斯库迅速宣布回到宫廷，他的魅力和力量已经吸引了许多渴望分享他重归的辉煌的人。作为首领，他也没有忽视您的忠诚，让你在匈牙利保持权力，直到他完全适应这个变化的时代。\n凭借他的魅力、军事经验以及你尽职尽责的管理，你相信现在没有什么能阻挡你。"
 PODcanon_chars.84.a: "很荣幸能再次为您效忠。"
 podintroductions.261.desc: "蒙福的枢机主教，您长期以来一直是教会中最重要的$pod_cainite$影响。有人担心您的计划可能会给这个强大的组织带来麻烦，但您相信自己已经掌控了一切。\n事实上，您并不喜欢天主教，它只是您年轻时伟大的阿利乌教派的苍白影子，但您能在初见时就辨别该是否是可利用的工具。然而，麻烦正在逼近，因为曾经的罗马永恒执政卡米拉苏醒过来，并迅速掌控了罗马，有效地削弱了您的许多资源。更糟糕的是，如果他设法削弱天主教会本身，您自己的权力也将受到影响。\n事实上，只有一条前进的道路。您必须掌控罗马本身，这样就没有人能再次危及您在梵蒂冈的大业了。"
 podintroductions.261.a: "我也将如此。"
 fabrizio_intro_tt: "作为法布里齐奥，你有一项要求你控制罗马专属决议。如果你成功了，就能获得一种新的兵士，并确保在裁判时代，意大利能够幸免于难。"
 eternal_cardinal_modifier: "永恒枢机"
 eternal_cardinal_modifier_desc: "梵蒂冈的画作上有你的面孔，教宗的诏书上有你的话语，圣座的脑海中有你的意志。"
 fabrizio_decision: "永恒枢机"
 fabrizio_decision_tooltip: "你对罗马政治的控制受到了威胁。你必须采取行动。"
 fabrizio_decision_desc: "卡米拉对罗马的接管威胁到你对圣座的控制。你不能坐视不管。"
 fabrizio_decision_confirm: "罗马有福了。我有福了"
 fabrizio_custom_decision: "你将获得猎巫人兵士。此外，在裁判时代，意大利将幸免于难"
 podintroductions.262.desc: "勇敢的恩卡拉，多年来，您一直计划着回到哥拉汛。拯救您心爱的[Glossary('尊长','game_concept_Sire_desc')]免于恶魔纳姆塔尔的魔爪是您的首要任务。可悲的是，您氏族其他成员并不赞成。\n即使是睿智而受人尊敬的阿什拉夫也劝告您不要踏上这段旅程，他预见到如果您这样做，哈基姆圣裔将面临一场巨大的危机。但这并不重要，因为最终，您是鹰巢最强大、最受尊敬的战士之一，他们无法真正阻止您。\n您期待与伊希姆重聚，并最终回报他为您所做的一切。但您心中仍有一种烦扰的感觉，警告您这可能确实是一个可怕的主意……"
 podintroductions.262.a: "没有时间可以浪费了。"
 podintroductions.262.b: "也许我应该重新考虑……"
 enkara_intro_tt: "这是最危险的行动。"
 PODcanon_chars.85.t: "近在咫尺，却……"
 PODcanon_chars.85.desc: "当你进入洞穴时，洞穴异常死寂，与你很久以前带领的疯狂战斗形成鲜明对比。你的使命与当时一样重要，至少对你来说是如此。你预料会有陷阱，也许还有狂热的邪教徒，但却没有出现任何这样的情况。只有你的记忆、悲伤和坚定不移的信念与你为伴。最终，你到达了目的地。\n伊希姆站在你离开他的地方，显然仍被那个恶魔折磨着，被紧紧握在掌中。虚弱的哈基姆圣裔伸出手向您，递上你如此渴望的狡猾微笑的阴影。这是你的时刻，然而……"
 PODcanon_chars.85.a: "有什么不对劲……"
 PODcanon_chars.85.b: "终于！"
 PODcanon_chars.86.t: "埋葬你的爱"
 PODcanon_chars.86.desc: "当恩卡拉，你的爱人，尖叫着溶入纳姆塔尔的魔掌，你思索着你必须做出的牺牲。为了摆脱它的控制，你接受了纳姆塔尔的提议，一劳永逸地释放巴力的诅咒在他们身上，确保他们永远不再如旧。如此强大的仪式需要一个够格的祭品，你知道恩卡拉总有一天会来。她来了。\n现在你可以再次自由行走，但你知道恶魔永远不会完全放过你。为了摆脱这个主人，你将不得不寻找其他强大的实体来帮助你。\n最终，你的灵魂仍然属于你自己，你将通过确保无论未来会带来什么，你都能幸存下来来纪念恩卡拉的牺牲。"
 PODcanon_chars.86.a: "我不会忘记你的。"
 izhim_intro_tt: "你现在扮演伊希姆。由于你的行为，哈基姆圣裔氏族除了你之外，都受到了巴力的诅咒。"
 white_pearl_modifier: "白珍珠"
 white_pearl_modifier_desc: "摩加迪沙是整个非洲大陆繁华而不羁的贸易中心，它一直在扩张，仿佛有自己的思想。"
 podintroductions.263.desc: "法纳扎女士，你正处在一个十字路口。随着摩加迪沙成为一个强大的城市，每个人都试图将其从你手中夺走。莱本认为应该由他们自己中的一位领导这个非洲城市，拉曼加希望夺回城市，以洗刷你夺城的玷污，阿什拉派利用日益壮大的穆斯林社区来主张自己的权利，甚至勒森魃也编织了一些关于他们作为天生海洋统治者的地位的奇幻故事。好吧，让他们都来试试吧。\n然而，你并不自负到闲置不动，你有几个选择可供选择。白珍珠女王不会轻易放弃她的王座。"
 podintroductions.263.a: "呼吁鹰巢提供支持。"
 podintroductions.263.b: "我需要阿什拉派的支持。"
 podintroductions.263.c: "开放港口，摩加迪沙将在混乱中茁壮成长。"
 podintroductions.263.d: "我需要查库塔提供更多的见解……"
 podintroductions.264.desc: "可畏的伊奇奈，您正在为对亚琛的进攻做准备。这并不是您第一次攻击这个地方，因为在这座城市仍被称为阿奎伊斯的时候，您曾经进攻过一次。那时候，您领导了一支难以想象的芬里尔仔兽狼人和旧神信仰法师的联盟，但即使有这些强大的盟友，也不足以胜利。\n自那时以来，政治局势发生了很大的变化，但芬里尔仔兽并没有忘记您曾经是战友。其中一小部分人提出帮助您进行这次新的进攻，虽然这肯定不足够，但对于您的事业来说，这仍然是一个巨大的福音。\n如果您能证明自己的实力并夺取亚琛，芬里尔仔兽很可能会允许建立更正式的关系。显然，这是为您部族报仇的优先道途。"
 podintroductions.264.a: "我们再次踏上征程！"
 ikkenai_intro_tt: "作为伊奇奈，你有一项要求您掌控亚琛的专属决议。如果你成功了，你就能获得[GetMaA('mjolnir').GetName]兵士。"
 ikkenai_decision: "旧传统的战士"
 ikkenai_decision_tooltip: "只要你还活着，你的部族就不会被遗忘。"
 ikkenai_decision_desc: "阿奎伊斯城，也就是日后所称的亚琛，自建立以来一直是你们部族的灾祸。摧毁它将是你们削弱德意志基督徒的第一步。"
 ikkenai_decision_confirm: "传统的胜利！"
 ikkenai_custom_decision: "当狼人对你战胜文明的胜利刮目相看时，你将获得[GetMaA('mjolnir').GetName]兵士。"
 podintroductions.265.desc: "可畏的阿尔努夫，“利沃尼亚野者”联盟使您感到满意。终于，野性的力量在同一旗帜下团结起来，抵挡十字军的战士们。\n虽然你不得不对年轻的喀喇给予一些认可，但你发现他有所欠缺，并且对他是否能带领你赢得胜利感到怀疑。\n你在冈格罗中享有传奇般的声誉，虽然你不喜欢过多利用它，但现在或许是时候这么做了。这绝佳的机遇可能不会再出现。\n在你的亡生中，你见过许多试图结束文明的失败尝试，从哥特入侵到当前的蒙古汗帐，但这一次你可以感觉到，这将是成功的时刻。"
 podintroductions.265.a: "十字将倒！"
 arnulf_intro_tt: "作为阿努尔夫，你有一项专属[character_interaction|E]，允许你召唤任何非敌人、非[Glossary('蛰眠','game_concept_torpor_desc')]的冈格罗加入你的战争方。他们越强大，花费就越高。"
 POD_arnulf_interaction: "阿努尔夫的号召"
 POD_arnulf_interaction_desc: "加入我！我们将骑向胜利！"
 indebted_giovanni_modifier: "欠债于乔凡尼"
 indebted_giovanni_modifier_desc: "你还在向你的亡灵术师金主还债。"
 podintroductions.266.desc: "强大的伊南娜，您上次去消灭邪恶的安吉瓦的远征并不顺利。您需要重新思考策略，考虑新的或旧的联盟，特别是因为安吉瓦本人与强大的茱莉亚·安塔西娅成为了朋友。\n茱莉亚的对手哈德施塔特会很乐意让您向他屈膝，这将有助于在您和安吉瓦之间持平德意志盟友援助。\n神秘的乔凡尼亡灵术师也对在您的领地建立自己的势力感兴趣，如果您接受他们的帮助，他们愿意提供急需的金钱贷款。\n最后，曾经的罗马永恒领袖卡米拉最近苏醒过来。过去，您是他钟爱的将军之一，你们合作得很好。如果您重新点燃这段友谊，他很可能会送您礼物，甚至是您过去的罗马装备。\n在做出选择之前，请仔细考虑，并骑马前往，最终彻底摧毁您的宿敌！"
 podintroductions.266.a: "我需要属于我的德意志靠山。"
 podintroductions.266.b: "金钱和不死族部队？在哪签字？"
 podintroductions.266.c: "就像往日一样。"
 podintroductions.266.d: "我不求任何人！"
 midian_courtiers_modifier: "谁需要廷臣？"
 midian_courtiers_modifier_desc: "你已经在脑海中有了自己的宫廷！"
 midian_councilors_modifier: "谁需要阁臣？"
 midian_councilors_modifier_desc: "这些低语有更明智的建议。"
 midian_vassals_modifier: "谁需要封臣？"
 midian_vassals_modifier_desc: "自己主宰一切要安全得多。"
 podintroductions.267.desc: "米甸大人，您公正而公平地统治着汉堡市，在战胜贪婪的商人阶级之后。从您闪耀的塔楼上，被睿智的顾问和威武的宫廷所环绕，您现在准备为德意志带来繁荣的新时代！\n不要理会那些来到您城市并声称您孤独地在一座正在衰败的塔楼中，只被您头脑中的低语所包围的愚昧小人。或者更好的是，使他们加入您的宫廷。您会发现，您遇到的敌人的灵魂一旦加入您的心灵宫殿，就变得更加易于驾驭了……"
 podintroductions.267.a: "在宫廷保持肃静！不要同时发言！"
 midian_intro_tt: "作为米甸，如果你能无论如何在汉堡亲王的位置上存活20年，你就能治愈你的一项负面修正。\n但其他的就不行了，没人说只因当最疯狂的末卡维亲王就该受到优待。"
 midian_decision: "汉堡的睿智统治者"
 midian_decision_tooltip: "你的统治可能不是永恒的，但能至少持续20年吗？"
 midian_decision_desc: "在你的英明领导下，平和的汉堡一切顺利。显然，一切都将永远美好。"
 midian_decision_confirm: "永恒而繁荣的统治"
 midian_decision_effect_tooltip: "一项事件将允许你移除一个负面起始修正。"
 PODcanon_chars.87.t: "精益求精"
 PODcanon_chars.87.desc: "尽管有些人持不同观点，你已经证明了你在汉堡的明智统治将会持久。在你博学的顾问和尊贵的廷臣的引领下，你成功地将这座城市引向了它的巅峰。\n然而，即使是完美也有改进的空间，你一直在考虑允许一些变革来改善你的统治方式。也许，让一些新来者发表意见，即使他们并非坐在你心灵宫殿中，也能带来一些好处呢？"
 PODcanon_chars.87.a: "我将开放我的宫廷。"
 PODcanon_chars.87.b: "我欢迎新的建议。"
 PODcanon_chars.87.c: "也许授权是明智之举？"
 PODcanon_chars.87.d: "现在一切都很好！"
 podintroductions.268.desc: "尊敬的安吉瓦，您的一切都在为了诺斯费拉图$pod_clan$的救赎而战斗。您最近一次对抗可怕的尼克图库，那些追捕您族人的家伙，使您意识到您无法独自赢得这场战争。\n最近与茱莉亚·安塔西娅的会面以及她对罗马风乌托邦的诱人构想让您深感兴趣，也许在这位强大的玛土撒拉的帮助下，您的氏族终于能够茁壮成长。然而，还有其他选择。\n许多诺斯费拉图想要您成为氏族的统治者，这是您一直在考虑但迄今未采取行动实现的事情。\n最后，您可以努力实现您的族人更加团结一致，与您的兄弟姐妹并肩站立，寻找力量来反击那些追捕你们的恐怖之物。"
 podintroductions.268.a: "罗马是我们的救赎之路吗？"
 podintroductions.268.b: "我必须领导和拯救他们。"
 podintroductions.268.c: "齐心协力，我们必将胜利。"
 angiwar_intro_tt: "作为安吉瓦，你解锁永恒共和国决议。"
 angiwar_intro_tt2: "作为安吉瓦，达成黑暗中的恐怖决议将给予额外奖励。"
 angiwar_intro_tt3: "作为安吉瓦，你将总是能与诺斯费拉图角色进行同盟谈判。"
 podintroductions.269.desc: "科德什大人，寻得圣杯使你摆脱了诺斯费拉图诅咒……但却带来了永恒的无聊。你并不喜欢死亡，但永生的未来对你来说实在是乏味至极。因此，你全天都致力于寻找新的娱乐来源。\n最近，你让耶路撒冷的圣殿骑士陷入了一次愚蠢地寻找不存在的圣杯的冒险，而且还是在一位脾气暴躁的木乃伊的陵墓中。这很有趣，但你知道这只能让你开心一段时间。\n在你漫长的亡生中，你还没有来过这个地区，这给你带来了新的兴奋，可以在这个地区的无防备生物身上尝试新的计谋。他们可能不会太在意，尽管你也并不在乎。"
 podintroductions.269.a: "如此多的乐趣在等着我们！"
 kodesh_intro_tt: "克里·科德什颓废得令人难以置信，他只能从专属的科德什小计[character_interaction|E]中恢复压力。"
 eternal_boredom_modifier: "永恒无聊"
 eternal_boredom_modifier_desc: "克里·科德什颓废得令人难以置信，他只能从专属的科德什小计[character_interaction|E]中恢复压力。"
 POD_kodesh_interaction: "科德什小计"
 POD_kodesh_interaction_desc: "耍耍该角色，既能娱乐，又能缓解压力。"
 grail_fool_errand_modifier: "愚蠢地为圣杯跑腿"
 grail_fool_errand_modifier_desc: "该角色正在疯狂地寻找一件不存在的宝物"
 PODcanon_chars.88.desc: "在你漫长的一生中，你已经掌握了把快乐建立在别人的痛苦之上的艺术。现在，你的目标已经选定，剩下的唯一事情就是从你的多个选项中选择一个，确保其在未来的岁月里不情愿地取悦你。"
 PODcanon_chars.88.a: "给其送去一个无解的谜题。"
 PODcanon_chars.88.b: "贿赂其最好的守卫，让其放松警惕。"
 PODcanon_chars.88.c: "在其耳边说一些听起来很重要的废话。"
 PODcanon_chars.88.d: "让其去寻找伪圣杯。"
 podintroductions.270.desc: "瓦西克大人，您初入耶路撒冷的吸血鬼政治领域就取得了巨大的成功，您的影响力和财富稳步增长。然而，所谓的“雌狮”出现了，她的激进态度与您的计划格格不入。您明智地决定退后一步，尝试更长期的方法。\n您相当确定她很快就会自取灭亡，没有任何人会帮助她，但您在想是否需要在这方面做一点“推动”。您需要回到耶路撒冷，在末日来临之前，传播巴希里特的美好真言。\n当然，也可以顺便赚点钱。毕竟，没有人是完美的。"
 podintroductions.270.a: "我的羊群呼唤着我的归来！"
 varsik_intro_tt: "作为瓦西克，你一项要求控制耶路撒冷的专属决议。一旦完成，你就可以在信仰和贪婪之间做出选择。"
 varsik_decision: "回到耶路撒冷"
 varsik_decision_tooltip: "这里是世界的终点，也是新的起点，这里是你的归属。"
 varsik_decision_desc: "在被迫离开圣城之前，你离伟大已经不远了。是时候计划你的回归了。"
 varsik_decision_confirm: "一座充满信仰的黄金城！"
 PODcanon_chars.89.desc: "你回到耶路撒冷的归来如预期一般辉煌。圣城显然在等待着您，你的信徒们也渴望聆听您的智慧言辞。商业也蓬勃发展，你已重新启动了一些旧计划，以确保金钱再次流向你应得的金库。\n尽管取得了这一胜利，你却感到不安，一些门徒也提出了很有道理的观点。或许是你在灵魂和财富之间的分心使你感到有些失落。\n也许是时候致力于一条道路并坚持下去了？"
 PODcanon_chars.89.a: "灵魂更重要……"
 PODcanon_chars.89.b: "……但金钱更闪亮！"
 PODcanon_chars.89.c: "我能兼顾！"
 podintroductions.271.desc: "拉美苏大人，虽然您并非这个地区的土著，但您迅速爱上了埃及丰富的历史和文化。您利用赛特与奥西里斯的忠实拥护者之间的战乱，开辟了自己的一片土地，但您的征服事业很快变得不同寻常。\n赛特的信徒是对古埃及的一种扭曲，奥西里斯的狂热者也不见得更好。您很快得出结论，只有您能够保存这片土地的荣耀，您将以自己强大的力量为此而战。\n是时候崛起了，伟大的法老，通过创建一个新的、永恒的王朝来拯救这片土地！"
 podintroductions.271.a: "我将拯救埃及于水火之中！"
 ramessu_intro_tt: "作为拉美苏，你具有专属公国建筑。"
 podintroductions.272.desc: "孙陀罗伐罗大人，印度是雷伏诺与[Glossary('万鬼','game_concept_kuei_jin_desc')]激烈争夺的地盘。您年轻，不如那些强大派系强大，并且信仰和$pod_clan$都来自外邦。许多人甚至不会将您视为真正权力的竞争者。是时候证明他们错了。\n您在阴影中发挥出最好的才能，结合狂热的热情和狡猾的操控，有人会说这是您这一类人的标志。善用这些优势，您可能成为印度永恒之战中意想不到的胜者！"
 podintroductions.272.a: "印度将臣服于蛇神！"
 sundervere_intro_tt: "作为孙陀罗伐罗，你具有专属公国建筑。"
 podintroductions.273.desc: "真加女士，您被委以重任，要确保赛特之子南方边境的安全。可以说，这是一项艰巨的任务，因为非洲大陆被各种凶残生物占据，且都对您的蛇神非常敌视。然而，您有一个计划。\n为了取得胜利，您需要数量上的优势，并且您已经研究了其他氏族的遗传血仆繁殖措施。如果成功完成，这些共有血缘的家族将提供忠诚的冲击部队，为您在非洲征服中带来严重优势。\n您的$pod_clan$在这方面并不十分了解，但您仍然取得了一些进展，第一个成果已经在您眼前呈现。"
 podintroductions.273.a: "结实的肌肉看起来不错。"
 podintroductions.273.b: "我需要善于欺诈、诱惑的间谍。"
 podintroductions.273.c: "智力应优先考虑。"
 zhenga_intro_tt: "你将初始就获得数位善于体力的遗传血仆在宫廷。"
 zhenga_intro_tt2: "你将初始就获得数位善于阴谋的遗传血仆在宫廷。"
 zhenga_intro_tt3: "你将初始就获得数位善于智慧的遗传血仆在宫廷。"
 podintroductions.274.desc: "阿贝托留斯摄政，您被派往君士坦丁堡执行三项任务。第一项任务是杀死一位躲藏的萨洛比，第二项任务是处理对付叛离睿魔尔的泰丽莎·埃纳，第三项任务是确保睿魔尔$pod_clan$在拜占庭的地位。第一项任务已经完成，因为那位愚蠢的窃魂者被他的一位学徒杀死了。还剩两项。\n第四次十字军东征使情况发生了很大变化，而您选择与安娜·科穆宁联手，继续您的任务。内环希望你能尽快取得成果，但具体手段由您决定。拥有强大的安娜对您来说可能已经足够了，尽管自己来统治的前景也很诱人……"
 podintroductions.274.a: "一个新的势力在拜占庭的废墟上崛起。"
 abetorius_intro_tt: "作为阿贝托留斯，你具有一项专属决议来确保睿魔尔氏族在该地区的地位。"
 abetorius_decision: "完成任务"
 abetorius_decision_tooltip: "你有任务在身。塞奥里斯在看着。"
 abetorius_decision_desc: "尽管第四次十字军东征造成了混乱，但你的任务还没有完成。您必须结束叛徒的生命，确保睿魔尔氏族在拜占庭废墟中的地位。"
 abetorius_decision_custom: "叛徒，[GetScriptedCharacterByHistoryID('790474').GetFirstName]，必须死"
 abetorius_decision_custom2: "你或[GetScriptedCharacterByHistoryID('790004').GetFirstName]必须掌控[GetTitleByKey('c_byzantion').GetNameNoTier]，并且是[king|E]或[emperor|E]等级"
 abetorius_decision_custom3: "如果你通过自己控制[GetTitleByKey('c_byzantion').GetNameNoTier]来达成这个决议，你将获得虔诚，而城市也会因为氏族帮助你重建而获得发展度。\n如果你通过帮助[GetScriptedCharacterByHistoryID('790004').GetFirstName]控制[GetTitleByKey('c_byzantion').GetNameNoTier]来达成这个决议，她会奖励你金钱和威望，你们也会增进友谊。"
 abetorius_decision_confirm: "干得漂亮"
 podintroductions.275.desc: "阿米亥摄政，您对血术法的理解不足，使您在睿魔尔政治中成为了被排斥的人，而这次被派往印度，远离您的氏族成员，对许多人来说并不是一个理想的任务。但您将让它成功。\n您被当地人低估了，而您已经利用这一事实为自己谋利。在印度吸血鬼严格的阶级制度中，您与受压迫的人民建立了一些友谊，发展了一个新的系统，将一些土著吸血鬼与金字塔结合，使他们在某种程度上成为“荣誉睿魔尔”。凭借这一强大的创新帮助您扩大势力基础，现在是时候向那些自以为是的头目们证明他们对您有多么错误了！"
 podintroductions.275.a: "印度睿魔尔——睿米拉的崛起！"
 amichai_intro_tt: "作为阿米亥，你可以对喜欢你的高世代（9或更后）的无地吸血鬼使用[character_interaction|E]，给他们“荣誉睿米拉”修正。"
 honorary_trimira_modifier: "荣誉睿米拉"
 honorary_trimira_modifier_desc: "印度睿魔尔——睿米拉——的荣誉成员，尽管不是睿魔尔，却为睿魔尔的荣耀而行事。"
 POD_amichai_interaction: "荣誉睿米拉"
 POD_amichai_interaction_desc: "让该角色成为印度睿魔尔——睿米拉——的荣誉成员。"
 more_than_20opinion_tt: "该角色对你的好感为20或以上。"
 podintroductions.276.desc: "智慧的拉米亚，成为不死族并非在您计划之中，但显然，这是黑暗之母的旨意。\n您将曾经的秘密教派转变为血系——拉米亚——选择继续与您的卡帕多西亚先祖并肩工作。不死族的政治是致命的，独自应对是不明智的。因此，您与他们达成了一项协议，您的教派为善于学术的卡帕多西亚提供武力帮助，而您则可以自由地继续崇拜莉莉丝。\n几个世纪以来，这项协议对您的族类来说证明是富有成效的，慢慢地将对黑暗之母的崇拜传播到欧洲乃至更远的地方。而您，作为黑暗女祭司，位于这一切的中心，随时准备号召忠诚的信徒以应对各种需要。"
 podintroductions.276.a: "赞美第一位女人！"
 lamia_intro_tt: "作为拉米亚，你有一项专属[character_interaction|E]，可以号召任何非敌对、非[Glossary('蛰眠','game_concept_torpor_desc')]的莉莉丝之路信徒加入你的一方。他们越强大，花费就越高。"
 POD_lamia_interaction: "莉莉丝的号召"
 POD_lamia_interaction_desc: "利用你作为莉莉丝选民的权威，让这位虔诚的角色加入你的宫廷。"
 podintroductions.277.desc: "神秘的伊努哈顿，您的目标一直在稳步前进。您已经获得了强大的塔尔玛埃拉教派的帮助，有些人甚至说您是其背后的真正策划者。无论如何，这确保了您在可预见的未来的地位。\n您需要继续改善塔尔玛埃拉在印度的处境，因为您知道彼此的命运紧密相连。幸运的是，您现在已经熟练地掌握从冥界中获取塞赫的力量，使您比那些局限于埃及的木乃伊更加灵活。这是一种您打算充分利用的力量。"
 podintroductions.277.a: "从埃及到以诺城……"
 inauhaten_intro_tt: "作为伊努哈顿，你解锁终局的开端决议。\n你还具有专属公国建筑"
 podintroductions.278.desc: "阿斯特拉孔大人，永生并不像您以为的那样美好。是的，您不再为死亡而痛苦，但现在您必须担心荷鲁斯对您施加的诅咒。您被托管的这个宝库已经成为了几千年来的负担。在过去的岁月中，您利用了许多教派、代理人和其他愚蠢的凡人团体来帮助您完成任务，一切都进展顺利……直到克里·科德什出现。\n这个令人恼火的小丑操纵了圣殿骑士团和一些吸血鬼冒险者，洗劫了您的宝藏，并利用战斗的混乱逃走，带走了您珍贵的宝物……然后将它们散布到世界各地。\n您从未知道荷鲁斯诅咒的具体细节，但您担心时钟已经开始滴答作响。在您为之奋斗了那么久的永生岌岌可危之前，您需要逐个取回这些宝物，必要时甚至可以一一追踪。"
 podintroductions.278.a: "这属于我的博物馆！"
 astrokhen_intro_tt: "作为阿斯特拉孔，你可以免费使用购买宝物宣称[character_interaction|E]。"
 caelestius_intro_tt: "作为色勒斯丟，你可以免费开始向梵蒂冈把你自己公之于众[journey|E]。"
 PODcanon_chars.90.t: "你的原罪"
 PODcanon_chars.90.desc: "海伦女士，您作为一名吸血鬼的第一次行动，是杀死了您那残暴的[Glossary('尊长','game_concept_Sire_desc')]，并在绝望的自卫行为中吞噬了他的灵魂。当时，您对吸血鬼的习俗一无所知，直到后来您才了解到，您的行为被称为$pod_diablerie$，被大多数$pod_cainites$视为最严重的罪行。\n您明智地将这一事件隐藏了起来，但担心这个秘密在某个时刻会浮出水面，给您带来麻烦的恐惧仍然存在。\n您一直努力寻找可以让好奇者发现米诺斯之死的真相的最后线索，您相信只要付出一些努力，就能彻底埋葬这个不幸的事件。"
 PODcanon_chars.90.a: "克诺索斯必须永远埋葬。"
 PODcanon_chars.90.b: "我不畏惧我的过去。"
 podintroductions.279.desc: "边防军仍因信仰上的兄弟姐妹对君士坦丁堡发动的震惊攻击而震惊不已。在正义的愤怒中，他们切断了与天主教裁判所所有正在萌芽的联系，并在需要的时候转向俄罗斯的会友。\n到目前为止，他们几乎完全是拜占庭的组织，现在正在向更广阔的东正教世界敞开怀抱。然而，一些担忧的声音正在高涨，他们认为寻求俄罗斯人的帮助会将边防军的权力中心从神圣的君士坦丁堡转移出去，这是许多人可以接受的。显而易见的反驳是，鉴于他们的情况如此严峻，边防军可能别无选择。"
 podintroductions.279.a: "我们的信仰足以拯救我们！"
 podintroductions.279.b: "来自俄罗斯的爱？"
 dazbog_reckless_modifier: "达兹博格之怒"
 dazbog_reckless_modifier_desc: "达兹博格不会眷顾懦夫。他的子民会像他曾经那样，面带微笑地冲向战场。"
 dazbog_patient_modifier: "达兹博格之耐"
 dazbog_patient_modifier_desc: "达兹博格赢得了许多战斗，但也输掉了一些。我们可以从他的耐性中学到很多面对失败的办法。"
 podintroductions.280.desc: "由于与斯拉夫信仰紧密相连，达兹博格战士在其传统家园受到基督教的严重侵蚀。现在他们几乎不为人知，甚至他们的宿敌棘秘璃吸血鬼也没注意到他们。他们一头扎进战场、寻求光荣死亡的做法当然也于事无补。\n尽管遭受了这些挫折，但战士们仍以一个团结的组织存在着，这证明了他们对事业的执着。虽然战士之神的子民前途渺茫，但也许他们仍有希望扭转局面。"
 podintroductions.280.a: "光荣的终结在等着我们！"
 podintroductions.280.b: "我们必须吸取教训。"
 podintroductions.281.desc: "勇敢的伊沙克，随着岁月的流逝，你必须承认自己的失败。你一直没能找到多年前杀害你第一个家庭的吸血鬼，你在那命运多端的夜晚的懦弱仍然困扰着你。尽管如此，看到你的新家庭茁壮成长，并从你的错误中吸取教训，你对未来充满了希望。你的子嗣们已经展现出了巨大的潜力，也许他们会在你失败的地方取得成功。\n然而，他们仍然很年轻，也许是时候与他们分享你辛苦得来的经验了。他们都值得你的帮助，但你在这个世界上的时间不是无限的，所以必须做出选择。"
 podintroductions.281.a: "贾海拉和穆巴拉克会做得很好的。"
 podintroductions.281.b: "亚丝明的信仰令人敬畏。"
 artifact_judge_talmud_name: "民长的塔木德"
 artifact_judge_talmud_description: "民长们继承了一本秘传的《塔木德》中积累的丰富智慧，这是一本由早期民长们的教学和辩论汇编而成的书。与其他猎人团体不同，民长们有足够的信息来区分吸血鬼使用的不同类型的魔法。"
 podintroductions.282.desc: "虽然民长是一个小而高度分散的组织，但由于他们掌握了一本神秘的《塔木德》，使他们在保护社区免受超自然力量的侵害方面取得了相当大的成功。《塔木德》记录了早期猎人们积累的所有知识。\n你最近被委托保管这本令人着迷的书，作为一位学识渊博的学者，你无法避免注意到这本书中存在的一些逻辑（和神学）上的不一致之处。你正在考虑添加自己的注释，以帮助下一代民长。这确实是一项艰巨的工作，但未来的好处可能值得一试。"
 podintroductions.282.a: "这部分需要重写，这部分还有……"
 podintroductions.282.b: "已经足够了。"
 qorjin_werewolf_modifier: "狼人教官"
 qorjin_werewolf_modifier_desc: "把阿秃儿的新兵们正在与友好的狼人密切合作进行训练。尽管他们可能会争辩说，“友好”并不是描述为他们准备的训练计划的最佳词汇。"
 podintroductions.283.desc: "勇敢的科尔沁，你在保护蒙古帝国免受超自然邪恶威胁的任务中取得了巨大进步。你选择与“友好”的狼人结盟确实引起了一些担忧，但结果证明了你的选择是正确的。有了他们的帮助，你更深入地了解了你的敌人，也避免了许多没有准备的猎人容易陷入的陷阱。\n可汗们对你的进步感到满意，最近又派来了一批有潜力的新兵加入你的行列。然而，你的主要狼人顾问佩玲却建议你把精力集中在将狼人更深地融入你的指挥结构中。你可以清楚地看到，由这些凶猛的战士训练的精英部队带来的好处，但可汗们可能会担心你与敌人过于亲近，从而撤回他们的支持。"
 podintroductions.283.a: "欢迎加入战斗！"
 podintroductions.283.b: "你得到了我的许可，佩玲。"
 fire_fury_modifier: "火与怒焰"
 fire_fury_modifier_desc: "你会让他们乞求饶命。然后再拒绝他们。"
 fire_fury_scorn_modifier: "火，怒焰与蔑视"
 fire_fury_scorn_modifier_desc: "地狱来要他们的命了，而你是地狱的使徒！"
 podintroductions.284.desc: "可怕的卡尔，由于你战胜了一个名叫艾格曼的强大恶魔，你最近作为怪物猎人的名声大涨。尽管对你来说，这个怪物只是和其他猎物一样的另一个目标，但德意志吸血鬼们却在担忧地私下议论你的名字。你也引起了所谓天主教教会暗影裁判所及其非正式领导人利奥波德·冯·穆尔瑙的注意。这位外交人士已向你抛出橄榄枝，试图招募你，他辩称，在教会支持下的强大组织内部，你能比单打独斗取得更大的成就。他承诺提供家族全力支持，包括在战斗中可供你指挥的狂热信徒、供你武装的金钱，以及让你始终领先敌人一步的线人网络。\n他的使者正在等待你的答复。"
 podintroductions.284.a: "不"
 podintroductions.284.b: "不！"
 artifact_monthly_piety_gain_mult_5_modifier: "每月[piety|E]：#P +10%#!"
 qorjin_intro_tt: "三名才华横溢的蒙古新兵将加入你的宫廷。"
 podintroductions.285.desc: "虽然他们表面上追随着同样的目标，即以鲍格米勒信仰的名义摆脱世界上的吸血鬼，但甘滕宾兄弟是非常不同的个体。巴西尔是一名真信徒，一个温和耐心的人，以真挚的爱对待他的群众。他经常被他的兄弟巴耶齐德的愤怒所吓到，后者那严厉的哲学思维对他来说似乎只是暴力的借口。\n事实上，巴耶齐德早已失去了年轻时的理想主义，只空有一身信仰的外壳，只为了获得他现在像瘾君子一样渴望的下一杯血族之血。\n巴耶齐德是一个更具魅力的人，自弃民成立以来一直是他们的非正式领袖，但现在的他显然正在引领他们走向黑暗的道路。如果巴西尔悄然离去而放任他兄弟的行为，挣扎中的卡洛梅娜的弃民们可能会改变自我……或者像许多理想主义者一样更轻易被击溃。"
 podintroductions.285.a: "我们将为理想而生，为理想而死。"
 podintroductions.285.b: "好意并不能拯救我们。"
 podintroductions.286.desc: "在生者的国度里，人们是这样讲述这个故事的：很久以前，哈迪斯看到德墨忒尔的女儿珀尔塞福涅后爱上了她，并把她绑架到了自己的国度，让她成为自己的王后。哈迪斯给了她食物和饮料，但她既不吃也不喝，直到出于礼貌，她吃了六颗石榴籽。每吃一颗石榴籽，她就会被判处每年有一个月在亡者之地度过。在这期间，她的母亲会哀伤，土地会变得寒冷和贫瘠。\n\n六个月结束后，珀尔塞福涅将回到母亲身边，回到鲜活的世界。德墨忒尔欣喜之余会使气候变暖，植物重新生长开花。\n\n从表面上看，这是一个关于绝望、胜利、妥协的简单故事，当然还有四季的起源。但故事的另一半，也就是它的暗面呢？\n\n哈迪斯不是神，而是一位强大的死灵，他爱上了一个名叫珀尔塞福涅的活人女孩，并安排她过早地死去，这样他就可以在死后与她相伴。德墨忒尔不是女神，而是一位才华横溢的法师。理论上，“石榴”是一种遗器，其确切性质早已被人遗忘。据说，珀尔塞福涅也是通过这件遗器获得了必要的力量，才能把自己拖回生者之地。"
 podintroductions.286.a: "我将永恒兴衰。"
 podintroductions.286.a.tt: "作为珀尔塞福涅，你有一项在哈迪斯呆六个月的专属[decision|E]。"
 persephone_decision: "冬临哈迪斯"
 persephone_decision_desc: "珀尔塞福涅的一部分爱上了哈迪斯，随着爱情的兴逝，她在生死两界之间来回穿梭。当哈迪斯的占有欲和嫉妒心让她无法忍受时，她就会逃离哈迪斯，而当孤独感压倒她时，她又会回到哈迪斯身边。"
 persephone_decision_tooltip: "哈迪斯在召唤我。"
 persephone_decision_confirm: "凛冬将至"
 living_in_hades_modifier: "生活在哈迪斯"
 podintroductions.287.desc: "聪慧的托拉，你的部族巴希拉曾是争夺印度控制权的强大挑战者。然而，随着文明的边界不断扩展，尽管你的部族并不介意与人类共存，吸血鬼仍然凭借对人类的强大影响力占据了上风。自那以后，你的族人们满足于和印度人并肩同行与学习，但你们更加军事化的姐妹部族泰卢固汗却并非如此。\n他们的新领袖最近向你提出了联盟的建议，详细说明了关于对抗那些沉迷于血液的傻瓜，以及夺回曾属于你们的领土的计划。作为一名巴希拉，你常被视为猫族的裁决者，你的认可对于这位未来的战将来说至关重要。"
 podintroductions.287.a: "骄傲的猛虎啊，露出你的獠牙。"
 podintroductions.287.b: "让我专心于我的研究！"
 podintroductions.288.desc: "精明的阿南卡，你的部族布巴斯提曾在古埃及被人们奉为神明。不幸的是，那场与赛特之间灾难性的战争几乎灭绝了你的整个族群，许多幸存的亲族也被胜利的赛特之子作为战利品囚禁。这使你们坚定地站在荷鲁斯的$glossary_osirian_league$一方，成为最忠诚的对抗赛特的战士。\n尽管如此，这段往事已经成久远的历史。虽然你对荷鲁斯的庇护心存感激，但你仍希望为未来探索其他可能性，而不仅仅是陷入与赛特信徒的永恒战争。作为目前最知名、最活跃的布巴斯提，你在引领族群的未来上有着很大的影响力。荷鲁斯显然希望你将资源投入到他的战斗中，但他真的能强迫你这么做吗？\n毕竟，猫是反复无常的生物。"
 podintroductions.288.a: "敌人的敌人仍然是我的朋友。"
 podintroductions.288.b: "告诉他我很忙。"
 POD_alliance_formed_tt: "你将与这位统治者结盟。"
 podintroductions.289.desc: "勇敢的软步行者，你因在可汗部族中的显赫声望，受到了藏族表亲的欢迎。这片土地虽然蕴藏着许多智慧，但也充满了危险。你的新朋友们请求你指引他们，如何保护家园免受四周威胁的侵害。\n你了解到附近有一个狼人的圣地，雪豹族群。它的领袖似乎是一位通情达理且博学的女性，你们可能有共同的立场。遗憾的是，藏族的可汗似乎并不同意这种观点，因他们与狼族之间的宿怨而不愿妥协。\n你确信，与雪豹结盟将对你们的防守工作大有裨益，但你初来乍到根基尚浅，真的能够快速平定局势而非搅动争端吗？"
 podintroductions.289.a: "结交新朋友是我最擅长的事。"
 podintroductions.289.b: "这次最好谨慎行事。"
 podintroductions.290.desc: "强大的塔·姆林巴，凭借你最近在对抗豪萨兰吸血鬼时的胜利，你如今已是强大的辛巴族无可争议的统治者。这只是重新确立狮族在非洲统治地位的第一步，但你仍应花些时间享受这场胜利的成果。\n在辛巴族这个极度父权制的社会中，成为像你这般成功的征服者的第一夫人是所有母狮所能获得的最高荣誉。不出意料地，你的众多情人温和敦促你在她们中选择一位担任这一重要角色。毕竟，强大的万兽之王身边需要一位同样强大的女王。"
 podintroductions.290.a: "精明的娜菲撒。"
 podintroductions.290.b: "强壮的尤玛。"
 podintroductions.290.c: "聪慧的德延丽。"
 podintroductions.290.d: "美貌的萝拉内。"
 podintroductions.290.e: "我会做出我自己的选择！"
 podintroductions.291.desc: "睿智的尼奥洛，你最近一次进入[umbra|E]的探险引来了不该引起的关注。一个强大的灵体——水之幽魂希娅，对你产生了非常危险的兴趣。你不得不使出浑身解数，用智慧与魅力说服她给你一些时间，延迟“融入她的怀抱”，不论这意味着什么（但可能绝不是什么好事）。\n你知道这只是暂时推迟了她的行动，她一定会再回来，而且这次不会再轻易被你阻止了。你需要为她的再次来临做好准备。幸运的是，你聪明的头脑已经在积极谋划各种可能的解决方案来应对这个难题。"
 podintroductions.291.a: "怎么办，怎么办呢……"
 nyolo_intro_tt: "15年后，希娅将会归来。如果你没有斯瓦拉生活方式中的鬼魂爱抚技能，或者没有超过15点的外交或谋略值，或者没有超过750点虔诚值，你会面临严重的后果。"
 ghost_water_spirit_curse_modifier: "幽魂之水的诅咒"
 ghost_water_spirit_curse_modifier_desc: "在1245年，希娅将会归来。如果你没有斯瓦拉生活方式中的鬼魂爱抚技能，或者没有超过15点的外交或阴谋值，或者没有超过750点虔诚值，你将面临严重的后果。"
 ghost_water_spirit_blessing_modifier: "幽魂之水的祝福"
 ghost_water_spirit_blessing_modifier_desc: "在你的灵性爱侣的帮助下，你与[umbra|E]的联系从未如此强大。"
 podintroductions.292.desc: "正如你所预料，幽魂之水的灵体希娅回来了，等待着你加入她的灵体世界。她似乎比上次更加坚定，但愿你已经有时间做好准备了……"
 podintroductions.292.a: "即使分隔两地，我们的爱依然愈发强烈。"
 podintroductions.292.b: "我可以命令你，灵体！"
 podintroductions.292.c: "我不像你想象的那么完美。"
 podintroductions.292.d: "我会在远方保护你！"
 podintroductions.292.e: "快跑！"
 podintroductions.292.f: "是时候了，我已经为这一天做好了关于继承人的准备。"
 Eleanor_of_Aragon: "埃莉诺·德·阿拉贡"
 PODcanon_chars.91.desc: "尊贵的露西塔女士，四年前你在南法执行你那可憎的[Glossary('尊长','game_concept_Sire_desc')]交给你的任务。正如往常一样，你在表面上保持忠诚的同时尽力违背他的命令。然而，实际上你还有另一个目标。你的远亲埃莉诺·德·阿拉贡就在这个地区，战争的变化无常使这位前伯爵夫人成为了一个诱人的目标。\n你对这位你家族中的女性有一种亲切感，她在阿尔比十字军造成的混乱中艰难求生，同时依然维持着尊严。众所周知，你与她进行了多次谈话来评估她是否适合接受$pod_Embrace$。然而，世人并不清楚的是，你的最终选择是什么——你会将埃莉诺带到你身边，成为你漫漫长夜中的伙伴，还是让她像所有凡人一样面对死亡的命运？"
 PODcanon_chars.91.a: "我诅咒她，她将远离死亡，如我一般。"
 PODcanon_chars.91.b: "最终，我没有干预她的命运。"
 qorjin_intro_tt2: "请注意，只有星占和寂静漫游者狼人部族完全接受了你们的联盟。其他部族仍会对你们持怀疑态度。"
 podintroductions.167.b: "召唤女武神，我们将骑马拯救中庭！"
 pod_experimental_landless_tooltip: "#warning 在黑暗亲王中，无地是非常试验性的。请将此视为测试游玩，并期待出现问题和怪异现象，如果可以，请报告这些问题和怪异现象。#!"
 PODcanon_chars.92.desc: "当你召集完凡人和各种血仆，准备在接下来的夜晚管理你的营地时，你欣慰地听到剩下的女武神们已经响应了你的号召。虽然在过去的岁月里，她们每个人都走上了自己的道路，但她们对事业（和您）的承诺依然坚定。她们带来了自己所能调动的资源，以帮助开始这次新的冒险。\n现在，她们正等待着您的带领，准备为奥丁的荣耀征战沙场，就像很久以前你们所有人所做的那样。"
 PODcanon_chars.92.a: "到瓦尔哈拉，姐妹们！"
 brunhilde_landless_cb_tt: "只要布伦希尔德保持无地，并且信仰英灵之道，她就可以使用特殊的战争借口入侵公国，并在获胜后安排一名女武神掌管公国。"
 vampire_demonhood_tt: "你将获得新的恶魔兵士和一棵新的地狱生活方式树。"
 podintroductions.125.b: "或许还有其他的选择……"
 podintroductions.1250.desc: "你的[Glossary('尊长','game_concept_Sire_desc')]，安布罗西奥·路易斯·蒙卡达到目前为止都抱有一种喜忧参半的心情。作为勒森魃$pod_clan$的一名强大而有影响力的成员，你作为他最喜欢的“女儿”的身份在你获得新机遇上助力颇多，并保护你免受于早期所犯错误的恶果。尽管如此，这个人强烈的存在感和其在帮助“塑造你的命运”上的热切执念仍让你不寒而栗。\n安布罗西奥并非对此毫无察觉，他建议你像之前在君士坦丁堡一样，重新作为[ashen_ambassador|E]为他工作。这样，你就可以在不与他进行密切接触的情况下帮助他，而这正是你求之不得的。\n这是一个目前来看对你事业很有帮助的提议，尤其是当你可以指望你的老朋友阿纳托尔在他的新子嗣佐伊的陪伴下加入你的时候。你们三个可以在这片土地上漫步，基本上随心所欲，希望届时能忘记你[Glossary('尊长','game_concept_Sire_desc')]那过长的阴影。"
 podintroductions.1250.a: "至少是一种有条件的自由"
 lucita_landless_tt: "你现在将成为一位无封地角色，开始时为安布罗西奥·路易斯·蒙卡达的[ashen_ambassador|E]。只要你仍然是无封地状态，你将有一个替代的决议来去掉你起始的“囚禁露西塔”修正。"
 heiress_lucita_modifier: "露西塔，夜之继承者"
 heiress_lucita_modifier_desc: "你已接受尊长为你铺设的道途。这个世界将由你来主宰，正如他曾预见的那样。"
 lucita_landless_decision: "露西塔的宿命"
 lucita_landless_decision_tooltip: "时候到了"
 lucita_landless_decision_desc: "虽然你自由地游走于世界，但你依然受到尊长效应的束缚。或许有一天，他会认为你已经准备好，能够完全放手。"
 lucita_landless_decision_effect_tooltip: "如果尊长安布罗西奥·路易斯·蒙卡达仍然活着，他将向你提供继承他所有头衔的机会。如果他不在，你将简单地移除你的负面修正。"
 lucita_landless_decision_confirm: "一种形式的自由？"
 podintroductions.135.b: "前进的另一条路。"
 rosamund_landless_tt: "你将作为一位无地冒险者开始，更确切地说，作为约根·冯·费尔登的一位[ashen_ambassador|E]。"
 PODcanon_chars.93.desc: "露西塔女士，你的[Glossary('尊长','game_concept_Sire_desc')]对你的成长感到非常满意。你最终是否为他工作对他来说并不重要，因为他所做的一切都是为了你。在他（被迷惑了？）的头脑中，他只是一个信使，需要为你升为黑夜女王的过程铺平道路。\n这是你以前从未有过的雄心壮志，也是一个可怕的前景，但随着蒙卡达提出辞职并给你他所拥有的一切，前景仍然很诱人。这不是自由，完全不是，但权力本身就是一种解放。至少，这就是蒙卡达和他的教义所说的，也许这是你人生中第一次看到这种哲学的魅力。\n也许你的故事从来不是叛逆的故事，而是成长并最终拥抱你伟大命运的故事。"
 lucita_landless_transfer_tt: "你将继承安布罗西奥·路易斯·蒙卡达所拥有的所有头衔。"
 podintroductions.284.c: "是时候行动了。"
 pod_generic_landless_tooltip: "由于你拥有所需的DLC，而且从剧情上来看这个角色可以被解释为无封地，我们为你提供了成为他们冒险者的可能性，如果你愿意的话"
 podintroductions.293.desc: "弗里德布拉特勋爵，到目前为止，你一直向暗影裁判所隐瞒着你的力量，但同时仍然尽可能地支持他们。你知道，如果裁判所知道这种帮助来自你的魔法天赋，那么其中的部分人就不会接受它。然而，当你意识到威胁的规模时，也许到了该做出选择的时候了。\n如果你要放弃你的天赋，你可以指望裁判所为你提供部队和熟练人员的支持，希望他们能帮助你做更多的事情来打击邪魔的仆从们。另一种选择是像往常一样继续下去，相信你的魔法能力可以弥补作为孤狼的不足。"
 podintroductions.293.a: "是时候显露真身了。"
 podintroductions.293.b: "术法本身就是足够的力量。"
 podintroductions.294.desc: "艾梅里克领主，您担任埃斯克拉蒙德的[ashen_ambassador|E]已经有一段时间了，您在确保她在金十字王庭的地位方面发挥了重要作用。这位女士对你非常满意，并希望以黄金和有才的朝臣的形式给予你更多的支持，以帮助你完成任务。虽然你受到了埃斯克拉蒙德的善待，也非常尊重她，但你最近得知，你的旧爱维罗妮克·奥尔良已经成为了亲王。\n令人惊讶是，她仍经常像之前那样天真，你称之为“维罗”的她很可能会在自己的新身份中处处受挫。既然埃斯克拉蒙德现在很安全，你在考虑是否要提出成为维罗的[ashen_ambassador|E]的候选人。虽然她在支持方面几乎没有什么可以提供的，但在她身边工作本身就是一种回报。\n维罗并不是一个陷入困境的少女，但像你这样的诗人能抗拒成为身披闪亮盔甲的骑士的诱惑吗？"
 podintroductions.294.a: "唉，责任和埃斯克拉蒙德夫人是第一位的。"
 podintroductions.294.b: "一场史诗般的传奇正在酝酿！"
 podintroductions.295.desc: "阿里沙特夫人，你是你的主人和[Glossary('尊长','game_concept_Sire_desc')]，阿扎尼尔在哥拉汛地狱般的阴影中第一个重塑的人。你已经被标记了，从现在开始，你将永远是魔鬼的后裔，但你的外表和充满算计的举止并没有改变。这些是你的主人想要利用的财富。\n你已经开始扮演阿扎尼尔的耳目，并且腐化了一些毫无戒心的勒森魃。尽管如此，还有很多工作要做，你在哥拉汛的主人希望你在未来能做得更好。"
 podintroductions.295.a: "如他所愿"
 podintroductions.295.b: "我会在离家更近的地方侍奉。"
 arishat_landless_tt: "你将作为一位无地冒险者开始，更确切地说，作为阿扎那利[ashen_ambassador|E]"
 podintroductions.296.desc: "兰佐领主，几十年来，您一直是哈德施塔特最重要的大使，从第四次十字军东征的筹备到之后在君士坦丁堡为梵卓保卫这座城市，您都有所参与。\n老实说，到目前为止，你的往绩并不是最令人印象深刻的，因为这两项活动都以你的德国梵卓利益的失败而告终。有人会说你毫不妥协的热情发挥了作用，但你当然更清楚事实。\n尽管如此，哈德施塔特开始重新考虑他给你的崇高职位，并可能很快寻找另一位大使。这不是你能承担得起的，你必须加倍努力说服那些异教徒和野蛮人信服（德国）梵卓的统治权。"
 podintroductions.296.a: "梵卓的统治不可商议。"
 lanzo_landless_tt: "你将作为一位无地冒险者开始，更确切地说，作为哈德施塔特[ashen_ambassador|E]"
 podintroductions.297.desc: "谢巴赫夫人，你和你心爱的贝利萨留已经从君士坦丁堡离开几十年了。这段和平旅行的时光是你亡生中最好的一段时光，但政治开始追上你。\n你和贝利萨留收养了阿娜佳作为你的子嗣，你一直在教这位年轻女子很多关于吸血鬼生活的知识。你的“女儿”最近受到了一个奇怪的死亡邪教的关注，这个邪教将她视为他们注定的领袖，这让你很担心。\n他们很有影响力，并且强大。因此你不想直接对抗他们，尤其是当阿娜佳可以自己处理他们的时候。尽管如此，她仍可会利用你的帮助来巩固她的统治，让她脚踏实地，并确保这个“马努斯·尼格鲁姆”不会最终导致她的死亡。\n也许是时候重新审视你作为大使，有时是刺客的过去，以达到新的目的了。"
 podintroductions.297.a: "我将守护你。"
 shabah_landless_tt: "你将作为一位无地冒险者开始，更确切地说，作为阿娜佳[ashen_ambassador|E]"
 podintroductions.175.b: "停留在原地不适合我。"
 podintroductions.298.desc: "曼里克夫人，您是受人尊敬的伊比利亚骑士团白色军团的创始人和领导者。你带领你的军团为违背真理和荣誉的罪行复仇。你期望你的追随者有自制力和绅士风度，你在锦标赛中的致命技巧，翩翩风度和朴素的优雅已经让你成为了许多吟游诗人关于猜测你过去的主题。\n#N 你是一名[ashen_grandmaster|E]，可以通过使用此特质经验来提高你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的部队有以下戒律：\n#bold 特定行动#!：您可以解锁军营住所建筑的新内部升级。\n#bold 荣誉募军#!此准则提供的当前效果体现为角色修正。\n#bold 平衡型部队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.298.a: "我的故事由我来书写。"
 podintroductions.299.desc: "乌拉卡，你是伊比利亚森林野人中最受尊敬的成员。野蛮人是一群不再遵守骑士规则或骑士行为准则的不死骑士。相反，他们组成了从一个村庄到另一个村庄的游牧战帮，拿走任何他们喜欢的东西，惩罚任何敢于暗示某个大锅/华丽的金十字架/年轻女子不是他们的东西的人。大多数森林野人特别喜欢折磨他们遇到的任何凡人骑士，他们经常用力量或勇气的测试来挑战他们。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 特定行动#!：您可以解锁军营住所建筑的新内部升级。\n#bold 众簇募军#!此准则提供的当前效果体现为角色修正。\n#bold 粗野军队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.299.a: "是时候制造些混乱了！"
 podintroductions.300.desc: "费利佩，你领导着罗德里戈之狮，一群致力于暗影再征服事业的无情吸血鬼。你寻求消灭伊比利亚半岛内的[Glossary('阿什拉派','game_concept_ashirra_desc')]。你的热情如此之高，以至于你甚至攻击那些试图与你的敌人和解的叛徒基督徒该隐之子。自从拉斯纳瓦斯‑德托洛萨战役以来，你就是一支不可忽视的力量，即使是曾经谨慎的基督教亲王现在也更加尊重……和恐惧你。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 修士会#!：你可以要求你的朝臣皈依。到第二个等级时，当你加入一场涉及你信仰的统治者的战争时，你会得到一个正面的战争修正。在最高等级，你的所有骑士都会获得这个修正。\n#bold 众簇募军#!此准则提供的当前效果体现为角色修正。\n#bold 粗野军队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.300.a: "再征服运动的战火熊熊燃烧。"
 podintroductions.301.desc: "戈弗雷大人，你是阿瓦隆骑士团的创始人和领袖。该骑士团是英国的一个骑士团，主要由冈格罗组成，他们抵触斯堪的纳维亚和异教兄弟的野蛮行径，而是渴望遵循骑士精神和中世纪荣誉的原则。你必须感谢密特拉和阿瓦隆诸郡，他们委托你以他的名义传播他的影响力和杀死怪物。你目前驻扎在诺曼底，试图清除异教联盟的残余势力。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 献身者修会#!：与[ashen_ambassador|E]协同作用，您可以为您的大使赞助人创建部队并获得[ashen_ambassador|E]特质经验，此准则的级别越高，您创建的部队就越多。 \n#bold 众簇募军#!此准则提供的当前效果体现为角色修正。\n#bold 粗野军队#!此准则提供的当前效果体现为角色修正。\n\n同时，您也将作为密特拉的[ashen_ambassador|E]开始。"
 podintroductions.301.a: "以圣奥斯特贝尔特的名义。"
 podintroductions.302.desc: "瓦罗大人，你领导着匈牙利弯曲十字架骑士团。有时也被称为弯曲十字架兄弟会，这是一群末卡维骑士，他们选择尊重他们的[Glossary('上古耆宿','game_concept_antediluvian_desc')]，并遵循《安德烈亚斯书》中发现的基督教三位一体的略有不同的版本。它包含了一位名叫安德烈亚斯的基督吸血鬼门徒的教义，以及一个新的三位一体：耶稣——圣子、该隐——圣父和圣灵——末卡维。通过服务和遵守耶稣制定的律法，修会试图悔改并将该隐从上帝的诅咒中救赎出来。为此，他们跟随末卡维的声音，解读他的疯狂指导。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 修士会#!：你可以要求你的朝臣皈依。到第二个等级时，当你加入一场涉及你信仰的统治者的战争时，你会得到一个正面的战争修正。在最高等级，你的所有骑士都会获得这个修正。\n#bold 众簇募军#!此准则提供的当前效果体现为角色修正。\n#bold 突击队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.302.a: "为神、该隐和末卡维而战！"
 podintroductions.303.desc: "勒珀骑士团由一群志同道合的诺斯费拉图组成，他们在$pod_Embrace$期间感觉自己被上帝所触碰，他们是圣拉撒路凡人骑士团的$pod_cainite$伙伴。他们的历史与拜占庭的诺斯费拉图交织在一起，他们中的大多数人认为诺斯费拉图的领袖马拉希底斯是他们的精神支柱。他们现在的大师佐提库斯就是这种情况，他是幻梦和马拉希底斯愿景的著名追随者。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 托钵修会#!：朝圣后，第一级时，补充你受损的军士，在第二级获得补给，在最后一级获得额外的虔诚。\n#bold 暗影募军#!此准则提供的当前效果体现为角色修正。\n#bold 平衡型部队#!此准则提供的当前效果体现为角色修正。\n\n同时，您也将作为马拉希底斯的[ashen_ambassador|E]开始。"
 podintroductions.303.a: "追随我们的神圣异象。"
 podintroductions.304.desc: "哈维尔大人，自从你被$pod_Embrace$以来，你一直站在许多对抗地狱的战争的最前沿。在这个中世纪时代，你一直是怨烬骑士团最受尊敬的成员之一，他们是难以捉摸的怪物和饮过圣杯的文物猎人。虽然你赞扬了这样的工作，但你一直不停地对抗杀害你亲属的睿魔尔。尽管如此，圣杯的祝福并不是理所当然的，你必须平衡你对骑士团的责任和心中燃烧的复仇需求。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 特定行动#!：您可以解锁军营住所建筑的新内部升级。\n#bold 精英募军#!此准则提供的当前效果体现为角色修正。\n#bold 纪律严明的军队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.304.a: "萨麦尔与圣杯引导我。"
 podintroductions.305.desc: "约阿希姆大人，对睿魔尔复仇的需求已经离开了你的脑海。你现在致力于暮光骑士团。该骑士团的任务是追捕猎物，这是一项困难但必要的努力。它对所有追随人性之道并表现出足够勇气来处理这项任务的人开放。你仍然知道睿魔尔会在某个时候追上你，你的最后一项职责是让暮光骑士团强大到足以在你可能的死亡中幸存下来。你不会让篡位者取得这场胜利的。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 特定行动#!：您可以解锁军营住所建筑的新内部升级。\n#bold 众簇募军#!此准则提供的当前效果体现为角色修正。\n#bold 特种部队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.305.a: "在最终安息之前的最后一项任务"
 podintroductions.306.desc: "安东尼大人，你有幸成为萨利安娜最信任的特工。你对她非常忠诚，并创建了法兰克守夜人，一个（主要是）妥芮朵骑士的精英团体，以保护你的女士免受许多威胁她的人的伤害。随着她最近在法国的掌权，你敏锐的眼光和灵巧的剑臂比以往任何时候都更被需要。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 献身者修会#!：与[ashen_ambassador|E]协同作用，您可以为您的大使赞助人创建部队并获得[ashen_ambassador|E]特质经验，此准则的级别越高，您创建的部队就越多。 \n#bold 精英募军#!此准则提供的当前效果体现为角色修正。\n#bold 突击队#!此准则提供的当前效果体现为角色修正。\n\n同时，您也将作为萨利安娜的[ashen_ambassador|E]开始。"
 podintroductions.306.a: "永远为她效劳，现今及永远。"
 podintroductions.307.desc: "阿方斯大人，你是黑蔷薇骑士团的领袖，渗透到医院骑士团里的该隐异端的子团。你主要与血仆一起工作，以便更容易与凡人交往，你只通过代理人与异端的高层协作。虽然复杂，但这一策略使你免于最近异端的缓慢崩溃，让你和你的骑士团面临不确定的未来。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 修士会#!：你可以要求你的朝臣皈依。到第二个等级时，当你加入一场涉及你信仰的统治者的战争时，你会得到一个正面的战争修正。在最高等级，你的所有骑士都会获得这个修正。\n#bold 暗影募军#!此准则提供的当前效果体现为角色修正。\n#bold 平衡型部队#!此准则提供的当前效果体现为角色修正。\n\n同时，您也将作为马拉希底斯的[ashen_ambassador|E]开始。"
 podintroductions.307.a: "是时候重新思考我们的忠诚了吗？"
 podintroductions.308.desc: "卡雷尔大人，你是黑蔷薇兄弟会的领袖，这是一个从医院骑士团汲取人才为该隐异端提供精英骑士的阴谋。这个组织最近的缓慢崩溃对你影响不大，因为你在布拉班特有很强的影响力，并且在医院骑士团里植根深入，很难被轻易根除。这可能仍然是重新评估你未来的好时机。\n成为大师或亲王？\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 修士会#!：你可以要求你的朝臣皈依。到第二个等级时，当你加入一场涉及你信仰的统治者的战争时，你会得到一个正面的战争修正。在最高等级，你的所有骑士都会获得这个修正。\n#bold 精英募军#!此准则提供的当前效果体现为角色修正。\n#bold 纪律严明的部队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.308.a: "兄弟会将会永存"
 podintroductions.309.desc: "贝里森达女士，你和你的血妹埃尔明森达是法伊迪特的领袖，这是埃斯克拉蒙德致力于保卫奥克西塔尼亚的私人军事组织。你以在战场上的无情和对蹂躏你土地的北方人的复仇而闻名。由于越来越多的南方骑士被巴黎取代，法伊迪特每晚都在成长。随着这种力量的增强和埃斯克拉蒙德夫人狡猾的政治头脑，你会看到奥克西塔尼亚在法兰西人的血液中得到恢复！\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 献身者修会#!：与[ashen_ambassador|E]协同作用，您可以为您的大使赞助人创建部队并获得[ashen_ambassador|E]特质经验，此准则的级别越高，您创建的部队就越多。\n#bold 特定募军#!此准则提供的当前效果体现为角色修正。\n#bold 平衡型部队#!此准则提供的当前效果体现为角色修正。\n\n同时，您也将作为埃斯克拉蒙德的[ashen_ambassador|E]开始。"
 podintroductions.309.a: "我们将见证巴黎如同我们一样受苦。"
 podintroductions.310.desc: "伊迪丝夫人，你是雄鸡骑士团最著名的成员。这个致力于摧毁地狱主义者和恶魔的鲁莽军事组织最近被大多数其他该隐之子疏远了。他们咄咄逼人的虔诚，最近对哥拉汛的灾难性攻击，以及对“怠惰”亲王的公然蔑视，使他们几乎没有朋友。在亲自侮辱了许多英国亲王之后，你自己也被正式置于血猎之下。这会是雄鸡骑士团的终结，还是说你的正义事业会继续战斗到另一个晚上？\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。你的组织将有以下戒律：\n#bold 特定行动#!：您可以解锁军营住所建筑的新内部升级。\n#bold 特定募军#!此准则提供的当前效果体现为角色修正。\n#bold 特种部队#!此准则提供的当前效果体现为角色修正。\n"
 podintroductions.310.a: "一群没有脑子的傻瓜！"
 podintroductions.311.desc: "荆棘冠冕最初是为了抵御10世纪摩尔人的入侵而建立的，自那时起，它就一直是奥克西塔尼亚一个有影响力的军事组织。随着其最初的目的大多被遗忘，它已成为其雄心勃勃的领导人纪尧姆的工具，纪尧姆曾多次（迄今为止未成功）试图控制该地区。纪尧姆并不介意将他的组织用于自己的目的，这已经慢慢地将荆棘冠变成了一个雇佣军组织，接受任何任务，只要它符合其领导人的目的。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 雇佣兵军团#!：当你签订雇佣合同时，你会得到更高的奖励，这个准则的等级越高，提升就越大。\n#bold 众簇募军#!此准则提供的当前效果体现为角色修正。\n#bold 平衡型部队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.311.a: "我升华的工具。"
 podintroductions.312.desc: "圣母团契是威廉·格雷在收到圣母玛利亚的异象后创立的一个小型骑士团。它的使命是保护和帮助女性，希望最终能让她们从吸血鬼状态中获得救赎。该组织只接受在凡人生命中被封为骑士的吸血鬼，甚至会拒绝那些格雷认为因错误原因被封为骑士的吸血鬼。这种态度和他们对人类的付出使他们在更有政治头脑的$pod_cainites$中几乎没有朋友。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 特定行动#!：您可以解锁军营住所建筑的新内部升级。\n#bold 特定募军#!此准则提供的当前效果体现为角色修正。\n#bold 突击队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.312.a: "以圣母之名。"
 podintroductions.313.desc: "加百列大人，你在圣地遇到了一个勒森魃崇魔者后，把余生都献给了摧毁敌人仆人的任务。在聚集了那些表现出同样热情的人后，你创建了晨星骑士团，从那以后一直在寻找新的士兵和盟友。你目前的努力是针对阿扎尼尔教团，这是现存最强大、最疯狂的巴力教派之一。也许是时候聚集你的骑士团，再次去打猎了\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 修士会#!：你可以要求你的朝臣皈依。到第二个等级时，当你加入一场涉及你信仰的统治者的战争时，你会得到一个正面的战争修正。在最高等级，你的所有骑士都会获得这个修正。 \n#bold 众簇募军#!此准则提供的当前效果体现为角色修正。\n#bold 特种部队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.313.a: "恶魔从不睡觉。我也不会。"
 jurgen_landless_tt: "作为黑十字骑士团的创始人和领导者，你可以将你的亲王头衔交给你的朋友卢克丽霞，并选择领导你的军事组织，暂时退出该隐之子的政治。\n#N 你将成为一名无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 特定行动#!：您可以解锁军营住所建筑的新内部升级。\n#bold 暗影募军#!此准则提供的当前效果体现为角色修正。\n#bold 纪律严明的部队#!此准则提供的当前效果体现为角色修正。"
 podintroductions.119.c: "还有另一种方法……"
 podintroductions.314.desc: "卢克丽霞女士，你是约根·冯·费尔登领主值得信赖的得力助手。当他在马格德堡统治时，你组织了隐藏在凡人条顿骑士团内的黑十字骑士团。当他与骑士团作战时，你代替他统治他的领地。你对此感到满意，尽管你有时会对你主人的一些最具争议的裁决提出异议。即使他不听，他也会重视你的意见，这对你来说已经足够了。你目前正在为黑十字骑士准备下一个对抗你领主的敌人的任务。\n#N 你将成为一位无地的[ashen_grandmaster|E]，并能够通过使用该特质经验来改善你的军队，你可以通过赢得战争，或签订军事和战争合同来获得这些经验。\n你的组织将有以下戒律：\n#bold 献身者修会#!：与[ashen_ambassador|E]协同作用，您可以为您的大使赞助人创建部队并获得[ashen_ambassador|E]特质经验，此准则的级别越高，您创建的部队就越多。\n#bold 暗影募军#!此准则提供的当前效果体现为角色修正。\n#bold 纪律严明的部队#!此准则提供的当前效果体现为角色修正。\n\n同时，您也将作为约根·冯·费尔登的[ashen_ambassador|E]开始。"
 podintroductions.314.a: "我们准备出征。"
 podintroductions.315.desc: "沙哈拉女士，被引进到赛特之子$pod_clan$，让你摆脱了痛苦的生活，从那以后你一直茁壮成长。你以极大的热情和成功接受了你[Glossary('尊长','game_concept_Sire_desc')]的教义，成为赛特信徒最重要的诱惑者之一。你擅长奉承“二把手”类型的男人，那些有足够的野心去听赞美，但没有足够的理智去认出他们是什么样的人。你们目前在耶路撒冷的努力是有希望的，但萨洛比最近作为主导力量的到来可能会对你们的计划构成威胁。\n最终，这并不重要。你的幸存是第一位的，如果你不能在这个城市传播赛特的邪教，你只需继续前进，重新开始。毕竟，你面前还有永恒。"
 podintroductions.315.a: "男人真是简单的生物。"
 shahara_intro_tooltip: "作为沙哈拉，当你成功完成一个诱惑计划时，你将获得虔诚，并可以选择将你的目标转信阿佩普之道或知晓他们的所有秘密。"
 unnamed_amnesia_modifier: "我是谁？"
 podintroductions.316.desc: "除却鲜血、尖叫与焦肉的记忆残片，你的过往只剩虚无空寂。连你的名字——倘若你确曾拥有——也成谜题。你苏醒之地的恐怖气息如此熟悉，其年代却难以追溯。世界似乎早已将这些早期记忆的碎片抛诸身后。你感到迟钝、虚弱、迷失方向，唯一的线索来自那些发现你的人（在你重燃的饥渴将他们化作食粮之前）。他们自称为惊惧长夜会。或许世间还有更多他们的同类。\n或许，他们甚至知晓你的真实身份。"
 podintroductions.316.a: "我是谁？"
 unnamed_intro_tooltip: "作为“无名者”，你将有一个独特的决议。一旦完成这一决议，将引发一系列连锁事件，最终可能导致你自身发生重大改变（同时移除初始的负面修正）。"
 unnamed_decision: "命名不可名状之物"
 unnamed_decision_desc: "“惊惧长夜会”是你与过往唯一的羁绊。寻觅并维系这份联系，遮蔽记忆的迷雾或许终将消散。"
 unnamed_decision_tooltip: "我需要知道……"
 unnamed_decision_confirm: "这是……"
 unnamed_decision_prerequisites_tt: "你需要10名或更多同信仰追随者。"
 PODcanon_chars.94.t: "你的开始"
 PODcanon_chars.94.desc: "尽管你致力于重建“惊惧长夜会”，但你的起源始终笼罩在迷雾中。有人认为你属于巴力始祖，那支最早崇魔的人类部族成员，曾被投入熔炉深渊。若此说属实，你便是与手足（或是情人？）共同爬出深渊的三位始祖之一。\n另有隐秘传闻低语：扫罗是你的[Glossary('尊长','game_concept_Sire_desc')]（甚至可能是你的生父？），他在追寻浩恩永生时将你遗弃。在此版本中，你目睹扫罗对血裔的冷酷漠视，决意为他终将到来的回归早作筹谋。\n两则传说皆漏洞百出，有时甚至自相矛盾。虽无确凿真相可循，但这些往昔碎片或许已足够唤醒你灵魂深处的某种……"
 PODcanon_chars.94.b: "那口井……内尔伽勒？摩洛？"
 PODcanon_chars.94.a: "我是否该警告萨麦尔关于父亲的事"
 PODcanon_chars.95.t: "你的目标"
 PODcanon_chars.95.desc: "即便惊惧长夜会是个专司崇拜你的教派，其在助你追忆目标方面却出奇地无用武之地。部分信徒认为你是崇魔者巴力即所谓崇魔派系与反崇魔派系之间的某种平衡支点。至于这平衡支点究竟象征何物，往好处说是神秘莫测，往坏处想则全然不可解。\n另有些信徒编织出更宏大的传说：你曾与名为舍迪姆的超世存在接触（或是其主动找上你？）。据称，这些生灵早于人类诞生，因被神判定不配栖居其所创之宇宙而遭驱逐。若您真与其结盟，便是在践行焚毁现世、重塑乾坤的炽烈誓愿。\n你深觉这群无能信徒不可能知晓你计划的真正规模，但这些零碎线索或仍能助你拼凑出些许真相。"
 PODcanon_chars.95.a: "无尽的火焰……"
 PODcanon_chars.95.b: "争吵的恶魔兄弟姐妹？"
 PODcanon_chars.96.t: "他们的终结"
 PODcanon_chars.96.a: "于是，一切由此开始。"
 PODcanon_chars.96.unnamed: "召集惊惧长夜会并未带来你渴求的答案。随着调查深入，他们那些矛盾到近乎荒谬的传说只会让你愈加沮丧。最近的失败成了压垮骆驼的最后一根稻草。\n你已下定决心接受现实：记忆或许永远无法恢复。更糟的是，那些声称要帮助你的人很可能别有用心，在过程中将你拖入他们的蛛网。你厌倦了追寻。\n你所知已足够。你是一位强大的血族，或许是当下最强大的存在。你的力量足以实现任何愿望。也许你会征服这个可悲的世界，也许你会焚毁它。你或许会留下一些生灵来恐惧和崇拜你……又或许不会。\n毕竟，你已不再被过去所束缚。"
 PODcanon_chars.96.seker: "尽管惊惧长夜会所述的故事可能充斥着谬误与矛盾，但其中一部分确实唤醒了你内心深处的某些东西——当你听闻“扫罗”之名时，那汹涌而至的痛苦与憎恨。或许教团所言非虚，你的“父亲”确实背叛了你（以及所有源自他的存在，无论是萨洛比、巴力，抑或其他未知的血裔），但这已无关紧要。这份恨意是你漫长岁月中首次感受到的、令你真切体会到生命存在的悸动。它或许能成为你前行的驱动力。\n若传说属实，扫罗已被睿魔尔吸榨（也许是在你的协助下？），但你深知这绝非他的终章。为确保扫罗永世不得重返世间，唯有一途可循……\n焚尽一切……而你恰好知晓召唤何人可堪此任。"
 PODcanon_chars.96.third: "惊惧长夜会所述诸多自相矛盾的故事使你意识到，这或许并非你首次经历记忆的湮灭。你曾历经多世轮回，以不同名讳、性别身份存世，追逐着或相悖的人生目标。唯一恒常的，是万物起源的深渊——你曾与内尔伽勒及摩洛共同攀爬而出的炼狱。他们声名狼藉，你籍籍无名；他们固守单一称号，你变换万千名号；他们执着于单一目标，你早已超脱束缚。\n身为巴力原始血系最后一位活跃的幸存者——第三始祖，你将如何诠释这份沉重的真实？"
 podintroductions.320.desc: "大天使崇拜在口语中（也有贬义）被称为殉道者，或者对少数人来说，被称为天使长之道。在牧首的最后几个晚上，他那迟钝的妄想触动了城里每一个妥芮朵的心灵，让他们相信他真的是大天使米迦勒。他们对他的崇拜压倒了公民义务、创意、血缘关系——一切。他的最终死亡并没有治愈他们的奉献精神，只是把它变成了一个新的目的。他的两个子嗣，保罗·巴塔洛斯和帕库里亚尼斯，领导着剩下的殉道者。"
 podintroductions.320.a: "我们将传扬米迦勒的圣言"
 podintroductions.320.b: "夺回君士坦丁堡是当务之急。"
 podintroductions.321.desc: "贝纳是首批为斯坦尼斯瓦夫服务的血仆之一，斯坦尼斯瓦夫是克拉科夫的一名吸血鬼，以“圣人”的身份领导着一个邪教组织，她很快成为他最喜欢的人之一。她一直跟着他，只有在接到命令时才离开他身边，她的忠诚很快为她赢得了$pod_Embrace$。随着邪教的扩张，越来越多的崇拜者向从死里复活的“圣人”献上鲜血，斯坦尼斯瓦夫逐渐变得更加懒散和傲慢，迷失在自大的幻觉中。因此，贝纳承担了大部分的夜间业务。她变得善于掏腰包来充实他们的金库，并通过熟练扮演一个受惊的小女孩将潜在的邪教者引诱到地下洞穴中，她将不断壮大的邪教培养成一个强大而统一的团体。\n据报道，近年来，斯坦尼斯瓦夫陷入了[Glossary('蛰眠','game_concept_torpor_desc')]。这背后的原因尚不清楚，贝纳也没有解释。她现在公开经营这个邪教，尽管她是以温和的方式这样做的，而且自从斯坦尼斯瓦夫停止公开露面以来，邪教徒的数量已经大幅增长。当然，贝纳现在似乎和被$pod_Embrace$之前一样相信她的尊长，但他失踪的情况表明，这个故事背后可能有更多的原因，并且她非常愿意接管邪教的控制权。"
 podintroductions.321.a: "我将引领他们进入新的界域。"
 podintroductions.321.b: "波兰将依旧是我们的家。"
 podintroductions.322.t: "玄武之变"
 podintroductions.322.desc: "$TAB$东北亚历来是$pod_kueijin$[GetTitleByKey('e_andong').GetNameNoTier]的势力范围。受其共居的游牧民族深刻影响，该皇朝与中华[GetTitleByKey('h_china').GetNameNoTier]的边境冲突已持续数百年，自女真金朝开始南侵后更是愈演愈烈。\n\n$TAB$玄武皇朝高度分权的特性正成为其覆灭的根源——[Glossary('阎魔王','podgloss.yamaking')]的影响力长期稳步增长，如今[akuma|E]已在草原肆虐。追随蒙古人的$pod_cainite$[Glossary('安答','podgloss.anda')]更成为压垮骆驼的最后一根稻草。玄武皇朝现已分崩离析，其权力中心却仿佛对自身崩解浑然不觉，仍与黄帝朝廷进行着小规模冲突。\n\n$TAB$悬而未决的核心问题在于：最终将由哪股势力终结玄武的垂死挣扎，进而掌控这片地域？"
 podintroductions.322.a: "昔日强廷的缓慢衰亡"
 podintroductions.323.t: "夜之大名"
 podintroductions.323.desc: "$TAB$从名义上说，日本是大陆$pod_kueijin$的[GetTitleByKey('e_goryeo').GetNameNoTier]一部分。但事实上，几个世纪以来它一直自行其是。\n$TAB$日本的吸血鬼自称为“鬼子”，按氏族划分，目前由[GetScriptedCharacterByHistoryID('795044').GetFirstName]领导的[GetDynastyHouseByID('house_bishamon').GetName]家族占据主导地位。这里还聚集着亚洲最密集的$pod_cainites$群体，不过他们的政治影响力基本可以忽略不计。\n\n$TAB$日本的暗夜统治者们一直饶有兴致地观察着大陆各廷的崩溃。三浦康民主张等待它们自行衰落后再正式断绝关系，而其他派系则希望采取更激进的分离方式。无论最终选择何种方式，日本的$pod_kueijin$似乎正准备很快建立自己的皇朝，成为一支不可小觑的独立势力。\n$TAB$在实现这个共同目标后，敌对的氏族们（以及疏离的$pod_cainites$）能否继续保持团结，仍有待观察。"
 podintroductions.323.a: "天照之域崛起"
 podintroductions.324.t: "蛰伏之龙"
 podintroductions.324.desc: "$TAB$高丽是[GetTitleByKey('e_goryeo').GetNameNoTier]的核心，这个政治实体本应同时管辖日本。但几个世纪以来事实并非如此，朝廷已沦为更强大的[GetTitleByKey('h_china').GetNameNoTier]的附庸。由中原“推举”的最新任皇帝[GetScriptedCharacterByHistoryID('793153').GetFirstName]，正是这一连串庸碌傀儡的鲜明例证。\n\n$TAB$然而随着黄帝皇朝日渐衰微，时局正在转变。雄心勃勃的朝鲜$pod_kueijin$——包括（未获承认的）平壤老祖[GetScriptedCharacterByHistoryID('795046').GetFirstName]与神秘的[GetScriptedCharacterByHistoryID('793174').GetFirstName]——正在蛰伏蓄力。肖氏皇位恐难长久，但青龙皇朝陨落之后将由何人主政，仍是一片迷雾。"
 podintroductions.324.a: "在十字路口"
 podintroductions.325.t: "血凰陨落"
 podintroductions.325.desc: "$TAB$东南亚曾是与中华[GetTitleByKey('h_china').GetNameNoTier]分庭抗礼的朱凰皇朝唯一所在。尽管该皇朝在名义上依然存在，但因数百年的怠惰与严重内耗已名存实亡。权力真空使得[akuma|E]掌控了大部分区域，如今[GetTitleByKey('h_scarlet_phoenix_court').GetNameNoTier]落得个崇魔者盘踞的魔窟恶名。\n\n$TAB$黄帝皇朝本身曾考虑直接干预，但该地区桀骜不驯的[Glossary('鬼人','game_concept_kuei_jin_desc')]恐怕不会轻易允准。\n\n$TAB$就在众人皆视朱凤皇朝无可救药之际，却有传闻称一位名为[GetScriptedCharacterByHistoryID('791113').GetFirstName]的隐修[Glossary('菩萨','podgloss.bodhisattva')]自丛林现身意图拨乱反正。\n\n$TAB$然而深知披耶那“独特”道法的人们不禁怀疑——这剂解药是否会比病症本身更令人煎熬……"
 podintroductions.325.a: "血色清算即将来临……"
 podintroductions.326.t: "普天之下，莫非王土"
 podintroductions.326.desc: "$TAB$在外界看来，[GetTitleByKey('h_china').GetNameNoTier]仍是$pod_kueijin$皇朝的巅峰。它在倡导区域创新的英明领导下统一，不关心凡俗纷争，运转如昔，恍若盛世余晖。\n\n$TAB$但真相往往更为复杂。\n\n$TAB$#ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('795039').GetID] #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('795039').GetID] #L 黄帝#!#!#!往好里说是深居简出，往坏里说简直是个疯子。无能的谄媚之徒正代他执掌朝纲。北方的女真朝廷与南方的宋廷正悄然策划分裂。[Glossary('安答','podgloss.anda')]$pod_cainites$静待时机，准备追随其凡人同类的征服脚步。近乎魔道的新异端邪说在各地肆无忌惮地涌现。\n\n$TAB$天朝这脆弱的霸权，离崩塌仅一步之遥。"
 podintroductions.326.a: "合久必分……"
 junius_alim_modifier: "阿里姆"
 junius_alim_modifier_desc: "尤尼乌斯在阿什拉派之外的伊斯兰$pod_cainite$世界中，拥有无与伦比的伊斯兰律法与传统的学识。这为他赢得了广泛的尊重。"
 EXECUTION_SHOU: "噬焰者"
 podintroductions.327.desc: "野心家王珪，你生前企图掌控朝鲜的大胆计划未能实现。但死亡似乎只是你必然崛起的一步。作为$pod_kueijin$重生后，你立刻开始寻找攀登永生阶梯的机会。\n平壤当前的混乱导致前任老祖陨落，在青龙皇朝尚未反应时，你抓住时机登上王座。尽管朝廷尚未正式承认你，但你并不担心，你在那里时已注意到他们慵懒且反应迟缓。\n对你统治的真正威胁近在眼前：自称叛军的虎叱曾于1136年与其师妙清一同被焚入地狱，如今他卷土重来，凭借声望集结追随者，宣称平壤归其所有。\n这是你的第一道坎，如果能除掉虎叱，或许能以此为契机赢得些许正统性。"
 podintroductions.327.a: "我必将长存。"
 wang_kyu_intro_tt: "作为王珪，你的初始正统性极低，可以通过特殊决议解决。"
 wang_kyu_decision: "朝鲜天命之主"
 wang_kyu_decision_desc: "自你死后，规则已变，但目标未改。无论代价如何，朝鲜终将属于你。而掌控平壤是第一步。"
 wang_kyu_decision_tooltip: "展望未来。"
 wang_kyu_decision_confirm: "平壤与朝鲜，皆为我物。"
 wang_kyu_custom_decision: "[GetScriptedCharacterByHistoryID('795047').GetFirstName]必须死"
 podintroductions.328.desc: "安夫人，你对生前毫无记忆，作为$pod_kueijin$苏醒时身畔绽放着奇异花朵。你凭借这份神秘气质与天生魅力，已在朝鲜血族中赢得显赫声名。但过往的谜团仍困扰着你。\n那些显然蕴含魔力的花朵，无疑是揭开更深秘密的钥匙。在花园中培育并研究它们，或许能解答你的困惑。"
 podintroductions.328.a: "玄朱交织……"
 soo_kyung_intro_tt: "安秀景，只要你持有那件独特宝物，就能通过特殊决议提升它的品质。"
 soo_kyung_decision: "玄朱交织"
 soo_kyung_decision_desc: "当你作为$pod_kueijin$觉醒时，身旁的鲜花蕴含着更深层的意义。是时候揭开它们的秘密了。"
 soo_kyung_decision_tooltip: "这关乎我的过去，还是未来？"
 soo_kyung_decision_confirm: "告诉我更多吧，我花园的女王们……"
 soo_kyung_decision_tt: "你将把花卉宝物提升至更高稀有度，并为其选择一个新加成。"
 PODcanon_chars.97.desc: "这些伴随你记忆之始的鲜花，似乎与玄龙和朱后有所关联，这两位是亚洲超自然最强大的神性存在之一。\n它们是礼物？是警示？还是承诺？无人知晓。但即便是外行也能感受到其中蕴藏的魔力。作为你著名花园的杰作，它们似乎随着你对自我与世界的理解而生长绽放。"
 PODcanon_chars.97.a: "它们的魔力正在扩张。"
 PODcanon_chars.97.b: "它们与我的[Glossary('心法','podgloss.dharma')]共鸣。"
 PODcanon_chars.97.c: "它们充盈着气。"
 PODcanon_chars.97.d: "它们低语着秘密……"
 artifact_magic_amulet_modifier: "魔法共鸣"
 the_celestial_nail_modifier: "心法启迪"
 the_three_books_modifier: "气之源泉"
 artifact_learning_per_piety_level_modifier: "求知之器"
 podintroductions.329.desc: "女皇武则天，你降临$pod_kueijin$世界的消息，在这个倦怠的超自然社群中引发了轩然大波。尽管无人敢当面直言，但显然他们正紧盯着你的一举一动，揣测你是否会像当年统治大唐般撼动此地。而你则从容研习着这套奇特的皇朝体系，与凡人中国如此迥异，却又如此相似。\n在修行的少林寺内，你已听闻北方游牧入侵者与内部邪修威胁黄帝皇朝长久和平的传闻。若乱世将至，那些窥视你的目光终将转移，届时……或许正是你为第二世择定天命与野心的时机。"
 podintroductions.329.a: "不朽王朝触手可及？"
 wu_zetian_modifier: "天授女帝"
 wu_zetian_modifier_desc: "世人铭记武则天的统治。她的称帝之权甚至超越了死亡。\n[fabricate_claim|E][councillor_task|E]加快#P 50%#!"
 podintroductions.330.desc: "璹，你长期稳居亚洲最令人闻风丧胆的[akuma|E]，名副其实。纵使黄帝皇朝与朱雀皇朝多次（短暂）联手剿杀，你仍屹立不倒，而他们却在自身腐朽中崩塌。\n这虽为你提供了扩张领地而无人干预的良机，却也令一切……索然无味。如果没有正义英雄可供焚烧，对小村落与海盗团伙的统治很快将失去趣味。你急需新的志愿者来源，毕竟\"噬焰者\"的凶名岂能蒙尘？"
 podintroductions.330.a: "为[Glossary('魔皇','podgloss.demonemperor')]焚尽前路。"
 shou_intro_tt: "拥有独特处决方式噬焰，可以获得生活方式经验并缓解压力。"
 podintroductions.331.desc: "狡诈的田本半古，你作为最杰出的不死日军将领迅速崛起，其声望之盛令所有人惊叹。对你心怀嫉妒之人而言，这或许暗示着某个黑暗秘密在推动这空前之事。\n\n坦白说，他们猜对了。\n\n你实为效忠[Glossary('艾玛·欧','podgloss.emmao')]的[akuma|E]，将灵魂卖给了[Glossary('艾玛·欧','podgloss.emmao')]以换取超凡武艺与诡谲血律。但无论是战争还是与恶魔交易，你从不愿遵守规则。当日本为你歌颂、阎魔为招揽你而狂喜时，你正谋划着史上最猖狂的欺诈。\n\n这需要时间周密策划，毕竟赌注是你的灵魂。"
 podintroductions.331.a: "他们永远预料不到这一刻。"
 tashimoto_intro_tt: "20年后，田本半古将启动计划。此事将引发严重后果（与丰厚回报）。"
 hunted_emmao_modifier: "被[Glossary('艾玛·欧','podgloss.emmao')]追猎"
 hunted_emmao_modifier_desc: "这位最强大的[Glossary('阎魔王','podgloss.yamaking')]对你怀揣着私人的、偏执的暴怒。任何提供你情报者都将获得力量的许诺，这极大满足了你的虚荣。"
 PODcanon_chars.98.t: "窃回己魂"
 PODcanon_chars.98.desc: "时机已成熟。\n利用[Glossary('艾玛·欧','podgloss.emmao')]的疏忽与你在日本日益增长的声望，你有信心完成这场豪赌，夺回为力量出卖给恶魔的灵魂。但仍需权衡后果。\n你可以放手一搏，在窃魂时顺带洗劫[Glossary('艾玛·欧','podgloss.emmao')]的宝库。这将揭露你[akuma|E]的身份并彻底激怒[Glossary('阎魔王','podgloss.yamaking')]，但回报惊人。\n或者仅偷回灵魂。虽然会遭其他$pod_kueijin$排斥，却能稍缓[Glossary('艾玛·欧','podgloss.emmao')]之怒。\n当然，你也可以放弃行动，永远沦为[Glossary('断绝','podgloss.kakuri')]国度主宰的奴仆……"
 PODcanon_chars.98.a: "要么做大，要么滚蛋！"
 PODcanon_chars.98.b: "我的灵魂已是足够报酬。"
 PODcanon_chars.98.c: "太冒险了……"
 podintroductions.332.desc: "无畏的幸雄，你是传说中的$pod_kueijin$刺客大师黑様最受重的弟子之一。但你的修行远未结束，对[Glossary('艾玛·欧','podgloss.emmao')]的复仇执念与效忠甲贺的职责分散了你的注意力。\n唯有平衡二者，才能兑现你的潜力。山巅虽遥，你决不动摇。"
 podintroductions.332.a: "专注与忍耐。"
 yukio_intro_tt: "幸雄可通过特殊互动向黑様求教，将勇武提升至40。此后她将完成修行。"
 pod_exhausted_modifier: "精疲力竭"
 POD_yukio_interaction: "师傅的教导"
 POD_yukio_interaction_desc: "（残酷的）刺客之道修习。"
 PODcanon_chars.99.t: "最终试炼"
 PODcanon_chars.99.desc: "你已征服大雪山。这座黑様训练弟子的荒寂峰巅，如今对你而言已是挚友而非严师。他倾囊相授所有刺杀技，从周密布局到利刃穿心时的冷酷决断。\n师傅始终冷漠难测，今夜也不例外。在最后一战中，他评估你的剑技与姿态（尽管这仅是形式）。对决结束后，你被勒令永不得重返雪山。\n当你低头准备离开时，黑様或许此生首次露出一丝赞许的微笑，说他期待听闻你复仇成功之日。\n至此，你不再是学徒……"
 PODcanon_chars.99.a: "……而是真正的忍者。"
 podintroductions.333.desc: "马将军，虽以不朽者而言你尚年轻，却已声名显赫。严谨的治军思想虽受长者赞赏，但你批判玄武皇朝的言论使他们将你调往与玄武皇朝交锋的前线。\n你深知比廷间争斗更凶险的威胁正在逼近，但这也是锤炼天狱军团的良机，这支由与你理念相同的$pod_kueijin$组成的铁军，坚信武力才能终结乱世。\n在这动荡之年，你笃定他们很快就有机会证明价值。"
 podintroductions.333.a: "无论代价，我必带来秩序。"
 ma_hai_lan_intro_tt: "马将军拥有独特兵种天魔军团。"
 podintroductions.334.desc: "李将军，时代正在剧变。你本远离廷政隐居草原，如今却莫名其妙都成为抵抗蒙古势力的领袖。\n你从未索求此位，那些纠缠不休的年轻人也令人烦躁……但如果诚实面对自己，你确实好奇能否借此洗刷残暴无能的恶名。\n然而[Glossary('多科尔汗','podgloss.dokhorkhan')]兵强马壮，玄武皇朝更对其唯命是从。若想带着麾下这群残兵败将存活，你必须要出其不意、劫掠、伏击、避实击虚。\n好在阴招本就是你的强项。"
 podintroductions.334.a: "至少这次没有郭汜搅局。"
 li_jue_intro_tt: "只要信仰不禁止，李傕总是可以发动劫掠。"
 podintroductions.335.desc: "无畏的披耶，你在丛林隐居时目睹螳螂噬偶而顿悟：阴性能量方为真理，将其推向极致即是$pod_kueijin$的救赎之道。\n当你离开丛林，目睹朱雀皇朝在[akuma|E]与腐吏手中分崩离析，你明白自己该做什么。你与被压迫姐妹们的狂怒将净化世界。臣服于阴性能量者得赦，抗拒者将在血、欲与混沌的清洗中灭亡。\n\n是时候了——按你的意志重塑世界。"
 podintroductions.335.a: "我们将沐浴在凡人的鲜血中"
 piyau_intro_tt: "披耶的内容始于一个独特决议，使她能够获得[GetTrait('conqueror').GetName(GetNullCharacter)]特质。"
 piyau_first_decision: "披耶觉醒"
 piyau_first_decision_desc: "你的血潮需先积蓄力量。以马来西亚邪教徒为食将是一道不错的开胃菜。"
 piyau_first_decision_tooltip: "从丛林深处……"
 piyau_first_decision_confirm: "他们死去，我们愈发强大。"
 piyau_first_decision_tt: "解锁披耶后续内容的决议。"
 PODcanon_chars.100.desc: "可畏的披耶，你的初次征服进展顺利，越来越多的皈依者正欣喜加入炽血花。但这也暴露出日益严重的问题。\n你创立的[Glossary('心法','podgloss.dharma')]看似简单，但其放纵教义与对规则的蔑视极易被曲解，导致无谓的暴乱与[Glossary('心法','podgloss.dharma')]崩坏。所幸，你亲自教导这些新成员：\n\n#italic 炽血花崇尚女性之力以解放自身与后代。她们放纵欲望，因未被满足的渴望会滋生嫉妒与疑虑。全力对抗邪教徒与妄图奴役世界者，如果世界毁灭，你将消亡。\n让[Glossary('阎魔王','podgloss.yamaking')]在你的怒火中战栗。以獠牙利爪迎接魔皇，至死方休。\n\n这便是生命真谛。若需更多解释，你已误入歧途。若认同懦弱之道，不如自封阴户去当鹤派！\n雷霆只知一词，而此词撼动天地。当你学会如雷霆般生存，方得真知。#!"
 PODcanon_chars.100.a: "升华你的饥渴"
 PODcanon_chars.100.b: "升华你的肉欲"
 PODcanon_chars.100.c: "升华你的荣耀"
 piyau_second_decision: "披耶之舞"
 piyau_second_decision_desc: "血潮高涨，但东南亚仍被慵懒官吏与邪教徒束缚。他们的鲜血将滋养你饥渴怒放的血花。"
 piyau_second_decision_tooltip: "……掀起血之潮汐……"
 piyau_second_decision_confirm: "将丛林染红"
 piyau_second_decision_tt: "你与你的[GetPlayer.Custom('PODCoterie')]将获得属性加成。\n所有领地（无特殊建筑时）将建造[GetBuilding('bloodflowers_fleshpits_01').GetName]。\n你将选择一个新的家族修正"
 house_penangallan_improved_modifier: "血花家族"
 house_penangallan_improved_modifier_desc: "在敌人的血腥残骸中，阴柔之力将得到升华。"
 house_penangallan_run_modifier: "狡诈之花"
 house_penangallan_run_modifier_desc: "#italic 遇险则逃，被困则战。莫损己之战，伤虎难再斗。若逃无可逃、战无可胜，便慨然赴死。#!"
 house_penangallan_protect_modifier: "守护之花"
 house_penangallan_protect_modifier_desc: "#italic 守护织锦，因世人皆欲撕裂它。誓死捍卫，你存于世间，世间灭则你灭。面对此敌，你永无退路。#!"
 PODcanon_chars.101.t: "龙之舞"
 PODcanon_chars.101.desc: "胜利的披耶，你最近的战果令北方皇朝震惊，他们曾愚蠢地将你的军队视为不懂战争的疯妇，却忘了你是赤龙。\n\n此名号源于你对龙之舞的完美掌控，这是一种充盈阳气的战舞，优雅而暴烈。虽唯你真正精通，但你的[Glossary('屋室','podgloss.wu')]，剥皮猿众亦非弱者。\n\n你蔑视北方人复杂的战争规则，你的哲学简单却有效：\n能胜则速胜，不可胜则逃，逃无可逃则如困虎死斗。\n曾嘲笑此道的中原朝廷如今沉默，因你数十年诛杀的邪教徒远超他们百年之功。流言渐起，你对东南亚的清洗或许只是野心的开端。\n\n很好。畏惧即是你的胜利。"
 PODcanon_chars.101.a: "完善龙之舞"
 PODcanon_chars.101.b: "如果他们太强，就逃……"
 PODcanon_chars.101.c: "……但对真敌永不言退"
 piyau_third_decision: "披耶的净化"
 piyau_third_decision_desc: "不留余地。东南亚将在鲜血中重生，由赋予生命女性本质统治。"
 piyau_third_decision_tooltip: "……涤净世间"
 piyau_third_decision_confirm: "姐妹们，痛饮、饕餮、交欢吧，我们赢了"
 piyau_third_decision_tt: "非狂热、非崇魔$pod_kueijin$女性统治者，如果境界低于[GetTrait('dharma7').GetName(GetNullCharacter)]，将改信炽血花。\n符合条件者更容易接受你的改信要求。\n炽血花角色将永远接受披耶的附庸提议。\n所有领地改信炽血花。"
 PODcanon_chars.102.t: "血与女之潮"
 PODcanon_chars.102.desc: "天选的披耶，你的胜利无止境。无数[akuma|E]与庸吏倒下，迎来女性升华的新纪元。\n有人称你的宫廷是野蛮虐妇的魔窟，但你深知，这才是生命真谛，是让天庭重眷误入歧途之女的荣光。\n昔年你仅率少数姐妹，如今整个国度追随你的哲学，撕裂腐朽父权，代之以无尽的饥渴、欲望与杀戮。\n你的威名已传至整个万鬼皇朝，激情血花的传播远超你最狂野的梦境，而你本就以狂梦著称。\n\n当姐妹与女儿们高唱你的名号征战四方时，你不禁思索，为何止步于此？\n\n为何不解放整个世界？"
 PODcanon_chars.102.a: "向苍天献上永恒之血"
 podintroductions.336.desc: "孙夫人，您与孙武的那场不幸的邂逅早已湮没于记忆长河。如今您被公认为$pod_kueijin$世界中空前绝后的兵法大家。连最尊贵的宫廷老祖都不惜代价想招揽您为将，却遭您悉数回绝。您选择云游四方，且行且教且学。凡有志研习兵法的门徒，皆须拜读您留下的典籍——当然，最精妙的战术仍被您密藏于胸。\n但您无暇沉溺于往日荣光，毕竟战争的艺术永远在演进，您又岂甘落于人后？祥瑞之剑，注定会再现其惊世锋芒。"
 podintroductions.336.a: "下一场千年圣战会在何处爆发？”"
 sun_li_intro_tt: "作为孙离，你有一个独特决议，消耗你的[ashen_grandmaster|E]经验来直接提升军事。"
 sun_li_decision: "战争艺术家"
 sun_li_decision_desc: "对于你钟爱的领域，总有更多东西值得学习。还有什么比不断超越孙子的学识直至永恒更能嘲讽他的呢？"
 sun_li_decision_tooltip: "以鲜血为墨绘就。"
 sun_li_decision_confirm: "一幅由鲜血织就的变幻画卷。"
 PODcanon_chars.103.t: "凤凰垂死之鸣"
 PODcanon_chars.103.desc: "尽管达楠是一位备受尊敬且技艺高超的领导者，朱雀皇朝却已经长时间处于衰落状态，这主要是因为达楠越来越专注于她的[Glossary('心法','podgloss.dharma')]启蒙。这一发展并不令人意外，而她在专注于灵性修行时选择退位也是在预料之中的。\n遗憾的是，尽管她付出了努力，但她从未找到合适的继承者来让皇朝稳妥延续。局势日渐恶化，直到最近达到临界点。\n\n达楠毫无预兆地突然从吴哥消失使朱雀皇朝陷入完全混乱，各地老祖疯狂动员势力，以争夺曾经强盛的皇朝疆域。\n有人说，实际上，达楠以迂回的方式选择了她疏远的弟子披耶·帕永作为继承人。大多数人认为，披耶残酷的[Glossary('心法','podgloss.dharma')]与其继位的合法性只能通过一场暴力且血腥的争斗来证明，因此达楠的突然退位创造了一个混乱的试炼场，披耶将在此过程中崛起或毁灭。\n\n无论事实如何，朱雀皇朝如今已不复存在，很少有人能真正预见接下来会发生什么，除了可能一场漫长而艰难的斗争。"
 PODcanon_chars.103.a: "凤凰已展翅高飞。"
 PODcanon_chars.105.t: "利沃尼亚的机会"
 PODcanon_chars.105.desc: "约根大人，利沃尼亚异教之地的战争，为您提供了一个改变权力天平的机会。数十年来，您的黑十字骑士一直在暗中操纵条顿骑士团，影响其决策与走向；然而，利沃尼亚骑士团却始终令人沮丧地难以渗透。但如今，当骑士们正向其领土进军之际，您终于有机会纠正这一点。代价将会十分高昂，但回报同样极具价值——又一个被黑十字渗透的骑士团，一个准备为您而战、也为您而死的武装教团。"
 PODcanon_chars.105.a: "这是我的好机会。"
 livonian_orders_tooltip: "你将能够获得[GetMaA('knights_livonia_maa').GetName]作为[men_at_arms|E]使用"
 PODcanon_chars.105.b: "不，这不值得。"
 PODcanon_chars.106.t: "罗马元老院的回忆"
 PODcanon_chars.106.desc: "塞扬努斯司法官，你亲身经历、并直接影响了血族历史中最关键的时代之一——罗马与迦太基的年代。那些夜晚的记忆，仍在你不死的心智中翻涌不息。在那个时代，永恒之城是血族权势的核心。无数血族在此展开他们的政治博弈，企图塑造历史的未来。参与者众多，但真正凌驾其上的，只有二者。\n\n茱莉亚·安塔西娅构想了一个罗马——一个不论氏族、不论地位，每一位血族都能在元老院中发声的罗马；一个即使是最卑微的稚子，也享有声音能被听见自由的罗马。她的外交手腕登峰造极，因此，她在罗马夜晚中成为举足轻重的人物并不令人意外。\n\n与她对立的是卡米拉。一位罪人，渴望将罗马溺毙于纵欲与感官狂欢之中。对他而言，无度的沉溺、情欲与支配，才是不死者最纯粹的表现。他所举办的节庆让农神节都显得温和无害。\n\n而你，塞扬努斯，正立于这两种愿景的交会之处。在永恒之城的那些夜晚里，你究竟支持了谁的理想？"
 PODcanon_chars.106.a: "安塔西亚女士辩才无碍，折服了我。"
 PODcanon_chars.106.b: "卡米拉的言辞确实很诱人。"
 aphro_saturn_court_tooltip: "你解锁两项宫廷职位：狂宴之王和美神节司仪。"
 PODcanon_chars.106.c: "他们试图说服我实在是愚蠢。"
 PODcanon_chars.107.t: "罗马殒落的回忆"
 PODcanon_chars.107.desc: "当你的思绪游走回往昔，你不由得想起不列颠。不是那里的泥泞、雾气，或那些令人头痛的居民，而是你曾经相伴的人。在诸派系的战火与致命阴谋之中，有一个人始终站在你身旁——梵卓氏族的齐格弗里德。\n\n他行事严谨，恪守荣誉，是一个信念高贵到几乎过于理想的梵卓；理想得让他的氏族难以真正接纳他——而这一点，你深有共鸣。你们之间的相互尊重与合作，最终开花结果，化为真正的友谊。无论局势如何，他都在罗马殒落之际支持着你，从未动摇。\n\n而近来，你似乎又找到了一位忠诚的盟友。这个名叫\"杰克\"的人，直觉敏锐，忠心耿耿。或许粗砺未琢，但忠诚不容置疑。但你仍然可以选择重燃旧日的情谊。你很清楚，那位坚定不移的齐格弗里德，必会再次站到你身边。\n\n又或者，让那段记忆静静沉睡。世界早已剧变，而你亦然。杰克可以被锻造成你手中最致命的利刃——一个行动派，或许会比一名外交家更为实用。\n\n血族的夜晚，正等待你的抉择。"
 PODcanon_chars.107.a: "一切就像往日时光那样，齐格弗里德。"
 PODcanon_chars.107.b: "是时候看向新的机会、新的盟友了。"
 PODcanon_chars.108.t: "野性盟友"
 PODcanon_chars.108.desc: "毫无顾忌的披耶，如今你的大清洗既已展开，便势必要划出界线——哪些人会俯首称臣，哪些人只能迎来死亡。\n而有一个耐人寻味的族群，或许能被归入前者。\n\n马来西亚的虎人，亦即\"可汗\"，与你交情匪浅。甚至可以说，关系不仅止于友好——在你离开丛林之前，其领袖曾与你共享过一段亲密时光。他们对[akuma|E]的憎恨，几乎与你不相上下，而其战斗本领亦绝不可小觑。\n\n当你开始你的征服之路时，他们或许能成为极为强大的盟友。"
 PODcanon_chars.108.a: "加入我们，猛虎的女儿们。"
 PODcanon_chars.108.b: "她曾是有趣的消遣，不过也就如此。"
 piyau_khans_tt: "如果可汗虎族接受，他们会成为你的朝贡国，派遣勇士在你的军队效力并使你获取新的兵士。"
 PODcanon_chars.109.desc: "睿智的虎母，旧日战火重燃，再次向世人宣告了她的存在。\n\n披耶·帕永，一名令人闻风丧胆的 [Glossary('鬼人','game_concept_kuei_jin_desc')]，已离开她在丛林中的隐居之所，开始清洗亚洲日益滋长的崇魔者腐化势力。你曾在不久前与披耶有所交集(相当亲密)——你很清楚，这名女子在她的攻势被天庭察觉之前绝不会停手。幸运的是，她并未忘记你们曾共度的时光，并已向你送来讯息。她请求你与你的猫崽协助她的行动，作为回报，她将给予你们庇护。\n\n你的女儿们似乎也渴望加入她的事业；如此一来，接受这项提议，恐怕才是更为审慎的选择。"
 PODcanon_chars.109.a: "虎族将会加入披耶的进军。"
 podintroductions.337.desc: "骄傲的王者，你早已远离埃及，更远离那个你的族裔曾被奉为神明的黄金时代。\n蛇之子夺走了你的一切。你参与的命运多舛的$glossary_osirian_league$，并未真正改变局势，反而使你的族裔群落与荷鲁斯日渐凋零的联盟一同走向孤立。\n\n然而，希望尚未彻底断绝。你的子嗣正逐渐步入成熟，为未来带来新的视角与可能。你亦远离赛特之子权力核心，使你得以在他们窥伺的目光之外，庇护你的家族，暗中积蓄力量。\n\n或许，终有一日，你将再度整军进发，解放你的故土——这一次，站在你身侧的，将是你的子女，而非那些仅因权宜而结盟、终究不可信赖的盟友。"
 podintroductions.337.a: "我等既不宽恕也不忘记。"
 podintroductions.338.desc: "政宗大人，自你先祖近一世纪前从中国选择自我放逐以来，你的家族已然壮大。就连你的新名号——\"八犬\"，如今也开始显得亲切自然。\n\n当初，许多人预言你的族裔在日本那片未知的群岛上，必将迅速走向灭亡；然而你却以卓越的外交手腕证明了他们的错误。你主动与当地的[Glossary('饿殍','game_concept_kuei_jin_desc')]建立联系，并在他们对抗地狱孽物的战争中，提供你家族的力量。\n\n这一连串胜利，使你得以在日本建立你们族群的第一座圣地，而这份成功，希望只是漫长征途的起点。即便你很可能无法亲眼见证其后续发展，你依然深信——你的子嗣终将使八犬成为足以经得起时间考验的强权，在这片新家园中屹立不倒。"
 podintroductions.338.a: "我们的成就赢得了认可。"
 podintroductions.339.desc: "睿智的廊开，你过往的孤立倾向几乎让你付出生命的代价。你已从那次教训中学会警惕，如今正勤勉地监视着丛林之外的世界。可惜，你所见的一切并不乐观。\n\n你在朱雀皇朝的线人回报，局势正以夜复一夜的速度恶化，昔日强盛的至尊皇朝恐怕不久后便会分崩离析。你必须做好准备。\n\n曾经拯救你性命的黄金障壁[Glossary('屋室','podgloss.wu')]，是你在即将到来的动荡时代中最有力的潜在盟友。然而不幸的是，他们近来内斗频仍，迫使你必须选边站——选择一位未来的潜在朋友。"
 podintroductions.339.a: "师提亚尊重我们族类。"
 podintroductions.339.b: "我欠巴德拉一命。"
 podintroductions.340.desc: "睿智之龙，黑暗的时代正在逼近——而你早已预见此景。\n\n昔日威震四方的黄帝皇朝，如今命悬一线。你心知王宏本绝不会对你心怀敌意，但他的鹰犬是否如此，却难以保证。若是长安仅存的权威也随之消散，局势恐怕只会雪上加霜。你并非好战之人，也不热衷于冲突，但你对自己的朝廷负有责任。你将竭尽所能，为即将到来的风暴做好准备并幸存下来。\n\n毕竟，你的朝廷之所以被称为\"永风\"，绝非虚名。"
 podintroductions.340.a: "我们会建立渡过风暴的庇护所。"
 podintroductions.341.desc: "坚毅的沃拉鲁，自魔克拉那令人惊叹的记忆力所能追溯之时起，你与你的族群便一直守护着班达扬。迄今为止，你从未辜负这份使命，你们的家园依旧如盖亚母亲所期望般纯净。然而，自满从来不是你的天性。\n\n当你目睹邻近你族群的诸岛逐一堕入腐蚀，甚至更深的堕落中，你已下定决心，亲自率领先锋，正面迎击威胁，在其蔓延至班达扬之前将之阻断。所幸，你并非孤身一人。犬之子嗣，亦即\"本耶普\"一族，渴望偿还因你族人的款待而欠下的恩情，并愿意与你并肩作战。"
 podintroductions.341.a: "最好的防御就是……"
 wolaru_intro_tt: "你能使用[GetMaA('battlescarred_fera').GetName]兵士"
 podintroductions.342.desc: "骄傲的女士，你所统治的领域——无可否认——幅员不大，且四面受制于[akuma|E]与其他威胁。然而，眼下却有一件更加迫切的问题。\n\n你的族群以故土的\"科莫多之龙\"为名。诚然，你对那些体型较小的同族怀有与其他魔克拉无异的敬意，但这层关联却并非外人所能理解。在他们眼中，你的领民不过是自称\"小龙\"罢了。这显然不可接受。\n\n是时候严肃地审视这件至关重要的问题，并做出一个果断的抉择了。"
 podintroductions.342.a: "我们需要立刻正名！"
 podintroductions.342.b: "也许这不是优先事项？"
 d_clutch_majestic_dragons: "神龙之攫"
 towers_intro_tt: "你将公国重新命名为神龙之攫"
 podintroductions.343.desc: "坚忍之龙，你的固执恐怕最终会招致毁灭。\n\n虽然你从未特别喜欢作为邻居的[Glossary('鬼子','game_concept_kuei_jin_desc')]，你乐于忽视他们，他们同样如此。然而，当所谓的\"八犬\"狼族在数十年前来到日本时，情况便彻底改变了。\n\n你在他们身上看见了会使群岛超自然族群道德堕落的种子，于是警告[Glossary('鬼子','game_concept_kuei_jin_desc')]：这些中国流亡者不可轻信。可惜，你的忠告如石沉大海。如今，八犬已成为宇治氏族的盟友，而你则被排斥在外。更糟的是，你不断的干涉(有些人称之为唠叨)——已到了临界点，三浦康民要求你正式道歉。\n\n接受将是屈辱，而拒绝则可能引来邻居的战争威胁。"
 podintroductions.343.a: "道歉？永远不可能！"
 podintroductions.343.b: "……也许我是有点反应过度。"
 podintroductions.344.desc: "睿智之龙，你对诸葛亮的倾心钻研，使你几乎成了那位伟大兵法家的一部活百科全书。对他一生的探究本身同样让你受益匪浅，你足以自诩(至少在理论层面上)，在你的同族之中，拥有无人能及的军事战略造诣。\n然而，#italic 孔明#!的一生功业绵长辉煌，于是问题便随之而来——在他众多征战之中，究竟是哪一场，成了你最为钟爱的一役？"
 podintroductions.344.a: "武侯北伐。"
 podintroductions.344.b: "当然是赤壁之战。"
 podintroductions.344.c: "平定南蛮可谓经典。"
 podintroductions.345.desc: "雄心勃勃的女士，你大胆的目标并不为你那向来沉思内省的同族所喜。你曾尽力迎合他们的框架，也在学习节制一事上取得了一些进展，但你的躁动终究无法被永远驯服。行动的时刻到了。\n\n然而，若你真要将印度从其寄生般的冥界势力中解放出来，你或许仍需要盟友。你的同族已然无可指望，但被称为巴希拉的豹人却非如此。你与靠近你龙巢的他们一向交好，而他们也对协助你完成此一使命的想法表现出相当的意愿。\n\n另一方面，向世界展示你不需要任何人的援手，也可以是你那重新燃起的信念的大胆宣示。"
 podintroductions.345.a: "欢迎，朋友们！"
 podintroductions.345.b: "我只需要自己的顾问。"
 podintroductions.346.desc: "很久很久以前，你的族群曾统治这片土地。你透过族群共享的集体记忆，亲眼见证过那段时代。那已是久远到近乎梦境的往昔——凡人早已遗忘你们，而吸血水蛭与恶魔则腐化了这片大地，摧毁了曾在此繁盛的诸多龙巢。对你们大多数族人而言，这不过是一个只能接受、只能追忆的悲哀现实。\n\n但你不同。\n\n你是唯一拒绝此等现状的魔克拉，你选择反击。纵然敌众我寡、形势悬殊，你仍决意以非常之道应对非常之敌。或许，这一次，蜥蜴之王将不再沐浴于阳光之下，而是在阴影中潜伏。"
 podintroductions.346.a: "清算即将到来。"
 podintroductions.347.desc: "受人崇敬的祖宗，你在漫长的千年岁月中见证、成就无数事业。你许多经历，如今已沉入你族类共享的集体记忆之中，指引着后代寻得自己的路。然而，仍有些时候需要你亲自干预。\n\n当你自长久的安息中苏醒，你的心智仍需时间，重新适应凡人世界飞速的节奏。所幸，你部分不朽的知识依然清晰地浮现在思绪前沿，将成为你重返世间的坚实基石。"
 podintroductions.347.a: "我伴侣们的爱和孩子们的自豪。"
 podintroductions.347.b: "我精心照料的亲巢。"
 podintroductions.347.c: "庄严超脱于时序之外的特莱湖。"
 podintroductions.348.desc: "精明的族督，自你来到此地以来，便一直与当地的[GetTrait('bastet').GetName(GetNullCharacter)]建立并培养外交联系。豹人(巴希拉)——已成为唾手可得的盟友，且对未来更深层的关系展现出相当的开放态度。遗憾的是狮人(辛巴)——凡是可能导致他们失去主导地位的安排皆持抗拒态度。尽管如此，你的耐心经营并非徒劳。你能感觉到，只需再多推一把，便可能迎来突破。\n\n现在，你必须决定此刻将心力投注于何处：是将巴希拉正式纳入你的族群；还是继续培养与辛巴之间的盟友关系？"
 podintroductions.348.a: "这是化兽族裔伟大联合的开端。"
 podintroductions.348.b: "狮群会是可贵的盟友。"
 podintroductions.348.c: "目前两者都不需要。"
 podintroductions.350.t: "纵欲之道的女大祭司"
 podintroductions.350.desc: "瓦伦蒂娜女祭司，你统治罪人的安科纳领地已有一段时日。然而，尽管情势看来如此，你仍不过是是暂代其位的看管者。女大祭司阿科尼亚·梅莎莉娜在不久前便陷入了$pod_torpor$，使你成为唯一合格的替补。你履行职责的表现令人称许，但阿科尼亚本人的缺席仍令人挂念。而如今，卡密拉重返罗马，或许正是向她展示这个陌生新时代的最佳时机。\n\n只要你愿意，你确信自己能将她自沉眠中唤醒，并把领地的统治权归还给那位名正言顺的原罪女大祭司。然而，你已证明自己足以承继此位——若你选择继续统治安科纳，想必也无人会出声反对。"
 podintroductions.350.a: "我的女主人，苏醒吧！"
 podintroductions.350.b: "女大祭司，安眠吧。我会照顾好我们的子民。"
 PODcanon_chars.111.t: "沉睡的女祭司"
 PODcanon_chars.111.desc: "最高教长卡密拉，你与定居于安科纳的纵欲女祭司们曾有过相当亲密的合作，尤其是与她们的领袖——阿科尼亚·梅莎莉娜。这位女大司祭如今已在其守护女神的神殿之下沉眠多时，由其世系中的一人代为统治该地。\n\n凭借你对此地的影响力，以及你与她们之间的关系，你完全可以说服阿科妮亚的继任者向你宣誓效忠，进一步巩固你对义大利的掌控。同时，你那位旧日的情人，也终于可以被唤醒。或者，若你愿意，也可以干脆不去理会她们。"
 PODcanon_chars.111.a: "向我效忠，女祭司，你将受到保护。"
 PODcanon_chars.111.b: "他们能管理好自己。"
 podintroductions.349.desc: "冷峻的福尔奇，你在法兰西南部是著名的佣兵首领。数十年来，你为此地的$pod_cainite$领主征战不休。然而在其眼中，你与你的部下始终不过是受雇的匪徒——在这黑夜世界里，无论完成多少合约，都换不来真正的尊重。无妨。你向来都是亲手夺回属于自己的东西。\n\n你最近一次合约尤其残酷。梵卓的让娜动用其能力操弄你，用你进行根本是自杀式的攻击。然而你活了下来。如今，你可以满怀快意地看着珍娜声名尽毁，被她昔日的女主人与无数仇敌联手猎杀。\n\n说实话，你有点想在他们之前亲手抓到她。复仇本身固然甜美——但若能向所有人证明，你能比他们更快做到，那滋味只会更加甜美。\n\n#warning 请注意你是[masterless_ghoul|E]#!"
 podintroductions.349.a: "你在哪里呢……"
 folch_intro_tt: "As Folch, having Jehanne in your prison will open a unique decision."
 folch_decision: "冷酷的复仇"
 folch_decision_desc: "让娜数年前糟蹋了你。是时候让她看看小兵也能晋升成国王。"
 folch_decision_tooltip: "我不会轻易忘记。或者说，我根本不会忘记。"
 folch_decision_confirm: "再次见到你真是高兴……"
 folch_decision_effect_tt: "事件将提供你如何处理你最\"钟爱\"囚犯的数项选择。"
 PODcanon_chars.110.desc: "Well, this was somewhat anticlimactic. The woman you once saw as a powerful and domineering vampire turned out to be a broken wreck just trying to survive in a world of much bigger powers than her. Kind of like you in a way.\nHer being barely responsive now that she has been caught hampers the pride you should feel to be honest. Still, you got her before her many other enemies could which is still something. Executing her now would send a strong message to those uppity lords that Folch and his men aren't just pawns in their games and should be taken seriously.\n\nStill, a part of you wonders if you could not just work with her now that you are clearly the dominant force. She has useful skills, no strings to other vampires and would have nowhere else to go. Desperation and mutual hatred of the lords of the night could make you unlikely bedfellows."
 PODcanon_chars.110.a: "给我起身准备工作了。"
 PODcanon_chars.110.b: "该复仇的还是要复仇。"
 PODcanon_chars.110.c: "她烂死也与我无关。"
 podintroductions.351.desc: "崇高的哈基姆，你公然以昔日主人们的挚爱——那位[Glossary('上古耆宿','game_concept_antediluvian_desc')]之名自称，无异于对他们的嘲讽。尽管他们多次尝试，却始终无能为力阻止你。\n\n除却你的狡猾与力量，你最重要的资产，便是你对传奇刺客组织阿萨辛的影响力。虽然你对他们的掌控并非绝对，但已足以在你接下来的生存发挥作用。\n\n波斯的吸血鬼们正逐渐开始尊重你——你的战略与胆识令他们印象深刻，甚至有的开始模仿你。虽然你欣赏这种带刺的赞赏，但你也很清楚，这不过只是第一步。终有一夜，他们将不再称你为\"伪\"哈基姆。\n\n#warning 请注意你是[masterless_ghoul|E]#!"
 podintroductions.351.a: "我是鹰巢之主！"
 false_haqim_assassins_modifier: "对阿萨辛的影响力"
 false_haqim_assassins_modifier_desc: "一个许多吸血鬼梦寐以求的特工和间谍的强大关系网，"
 podintroductions.352.desc: "忠诚的帕里斯，千年已过，你与海伦的爱意却从未褪色。虽然你曾婉拒她将你变为吸血鬼的提议，但以一名[ghoul|E]之身，能与她共享永生之景，这前景依然令你心驰神往。只可惜，你的灵魂伴侣做出了一些……令人质疑的抉择，导致你的亡生变得格外艰难，尤其是她与墨涅拉俄斯之间那看似永恒的敌对。\n\n尽管你只是海伦麾下一枚微小的棋子，但有时你比她更能看清全局，而你那睿智的谏言也是她至今唯一愿意容忍的声音。这并非意味着你的剑术已钝——你依然记得，在久远之前将长矛刺入米诺斯胸膛的那一幕。或许你下一个目标，就会是墨涅拉俄斯本人。\n为了守护你的挚爱，直至永恒，你愿付出一切。\n\n#warning 请注意，你是海伦的[bound_ghoul|E]#!。"
 podintroductions.352.a: "传奇的情侣谱写传奇的故事。"
 prias_intro_tt: "只要你是海伦的[bound_ghoul|E]，你完成[bound_ghoul_missions_with_icon|E]将获得更多共鸣经验。"
 podintroductions.353.desc: "神秘的莱拉，你的过往是一则由谎言与误导编织而成的故事。这一切确实助你达成了目标——然而，在层层假象之下，始终只有一个真相。\n\n有人说，你是真正的莉莉丝之女；也有人相信，你不过是一名饮过其血的凡人。他们传言根特亲王，迪德里克·雷彻瓦迪根已经落入你的圈套，而你正密谋他的覆灭，甚至整个布鲁赫的崩解。\n\n也有人认为，你是波乌狄纳的血仆——那位目前栖身非洲的强大真布鲁赫，你正协助你的女主人完成她艰巨的使命：弥合布鲁赫的分裂，并达成浩恩永生。\n\n还有一些声音，将你与一个投身于莉莉丝的神秘远古结社联系在一起。有人低语，那些存在或许本身就是失落的[Glossary('上古耆宿','game_concept_antediluvian_desc')]。\n\n这些传闻究竟孰真孰假——唯有你自己知晓。"
 podintroductions.353.a: "莉莉丝之女回应其召。"
 podintroductions.353.b: "波乌狄纳女士会需要所有她能得到的帮助。"
 podintroductions.353.c: "我是黑暗之母的忠诚代理。"
 POD_ghoul_unlimited_blood_tt: "这名血仆通过某些神秘方法生成自己的血液。"
 layla_intro_1_tt: "选择此项，你将在法兰西北部获得领地。你会以[masterless_ghoul|E]的身分开始，并拥有不会被动地失去血液的独特优势。"
 layla_intro_2_tt: "选择此项，你将在达尔富尔获得领地，并成为波乌狄纳的[bound_ghoul|E]。"
 layla_intro_3_tt: "选择此项，你不会转移他处并以标准[masterless_ghoul|E]身分开始。"
 layla_intro_4_tt: "此选项只在血仆剧本可用"
 podintroductions.354.desc: "坚毅的费罗克斯，自你与母亲布狄卡最后那场并肩作战的英勇抵抗以来，数个世纪已在漫长而艰辛的岁月中流逝。此后，你始终光荣服役于梵卓主人们——最近的一位便是法布里齐奥·乌尔菲拉。然而，你仍感到自己的灵魂空虚。\n\n自你在罗马末期热切地皈依基督信仰后，信仰便一直是你的救赎恩典。数百年来钻研教会的智慧，使你愈发坚信：这才是人类得以获得救赎的正道。\n然而你也很清楚，前路仍旧漫长；看着凡人被傲慢的$pod_cainite$领主愈来愈冷酷地对待，更令你心中煎熬。看来，即便历经永恒的服侍，你的反叛之魂仍未彻底熄灭。\n\n你明白，将信仰与怒火交织在一起，往往只会导向灾难——而这，正使你面临一个艰难的抉择。\n\n#warning 请注意你是[masterless_ghoul|E]。因为你无法被血缚，你无法变成[bound_ghoul|E]。 #!"
 podintroductions.354.a: "信仰……"
 podintroductions.354.b: "……还是怒火？"
 podintroductions.355.desc: "黛丽兹别塔女士，尽管年纪尚轻，你的魔法天赋却成了家族在这片艰困土地上生存的重要助力。你们吉普赛团体的保护者——吸血鬼伊兹多尔也注意到了这一点，并将你收为他的血仆。你对这份不朽的恩赐心怀感激，却同时对伊兹多尔的鲁莽与复仇心切深感忧虑，唯恐这将为你的族人招致灾祸。\n\n此刻，你们正接近突伽·辛的领地。你与她仅有过短暂的相处，但她仁善的风度，以及对你魔法天赋流露出的兴趣(毕竟她曾是一名萨满)——在你心中留下了深刻印象。\n你曾提议让族人投身于突伽·辛的庇护之下，然而伊兹多尔却断然拒绝，声称他在更南方仍有未了之事。\n\n过去的数日里，你始终在挣扎：是否该动用自己的影响力，将族人置于突伽·辛的庇护之下；抑或无论未来潜在代价如何，都继续对伊兹多尔保持忠诚。\n\n#warning 请注意你是伊兹多尔·托雷努的[bound_ghoul|E]。 #!"
 podintroductions.355.a: "我的人民先于我的忠诚。"
 podintroductions.355.b: "我们欠伊兹多尔太多了。"
 PODcanon_chars.112.desc: "至高女王伊恩弗莱德，你正处于覆亡边缘。血族敌人视你为遗世残骸，以\"苏尔至高女王\"之名讥讽嘲笑；当爱尔兰的兄弟姊妹仍困守残败圆环时，你独自屹立于此岸。\n\n密特拉的阴影漫天铺展，其军团与诸该隐之子皆视你为其秩序之敌。你所守的，不过是一隅孤土，在仇敌之海中岌岌可危，他们希望看到你的世系灭绝。\n\n如今抉择在前——是深扎根系迎接即将到来的风暴，抑或切断土地连系，步入迷雾，如羁客般流浪？"
 PODcanon_chars.112.t: "垂死的信仰"
 PODcanon_chars.112.a: "不会弯曲的树便会断裂，前途在呼唤。"
 PODcanon_chars.112.b: "让他们来亲身体验一下，即使是老树也会有刺。"
 PODcanon_chars.113.desc: "妳端坐于一张摇摇欲坠的王座之上，诺娃女士。妳的实验——\"灰烬议会\"如今已濒临崩溃。它原本被设计为一个能被各方势力接受的缓冲之地，然而不过转瞬之间，便沦为权力角逐与冷酷算计的泥沼。妳所谓的\"中立\"，很快将再也无法庇护妳分毫。\n\n北方与东方的篡位者正在塞奥里斯积聚力量，其术法将夜空染得污浊。南方棘秘魑的军督们正磨利刀锋，在他们眼中，妳的领地不过是等待收回的旧产。妳被群狼环伺。然而最先咬向妳喉咙的，却是一位同样拥有蓝血的同族。\n\n\n文策尔·里卡德的使者此刻正立于妳的王廷之中。他带来保护的提议——能替妳挡下术士与魔物的侵袭。代价却简单得近乎羞辱：妳只需向他宣誓效忠，终止这场失败的\"缓冲国\"实验，成为他的朝贡国。并承认一件事——身为阿尔帕德的妳，若没有他牵着手，甚至连自己的领土都无法守住。"
 PODcanon_chars.113.t: "圣王之血族"
 PODcanon_chars.113.a: "今日我会屈膝，以便在明日起身出击。"
 PODcanon_chars.113.b: "我不需要主人！"
 PODcanon_chars.113.toast: "诺娃乞求你的保护！"
 podintroductions.356.desc: "Lady Belphegor, you were once the respected mistress of the Palace of Sighs, tasked by Lucifer himself to experiment on humanity.\nWhat a delightful time you had, learning all about how these peculiar creatures thrive, bend and break. Your findings were used in the creation of the Laham, the imperfect mortals with demonic essence, and the Nephilim, the much more refined \"half demons\".\n\nSadly, the Heavenly Host won in the end and scoured your palace thoroughly before sending you to Hell, calling your work \"revolting\" and \"heinous\", proving their small mindedness. You were luckily able to escape thanks to some careless Hebrew infernalists and what you did to them was so ruthlessly perfect that it became a myth.\n\nSince then, you have been wandering the world, trying to get back to where you were though, without the support of Lucifer's host, it has been slow going as you must now be much more careful about your experiments. A breakthrough has been happening lately, with Chenksa being the first Nephilim born under your care since the Fall.\n\nThe first but clearly not the last."
 podintroductions.356.a: "每一声惨叫，都是迈向知识的一步。"
 belphegor_intro_tt: "贝尔芬格自诞生起，便已掌握培育[GetTrait('nephilim').GetName(GetNullCharacter)]所需的全部知识。"