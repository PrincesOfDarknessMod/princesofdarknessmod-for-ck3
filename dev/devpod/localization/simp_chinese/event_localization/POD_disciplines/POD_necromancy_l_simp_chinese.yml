l_simp_chinese:
 POD_find_wraith.100.t: "邻家怪事"
 POD_find_wraith.100.desc: "搜索该区域时，你会发现附近有一些死灵可以很容易的被暗中袭击。"
 POD_find_wraith.100.option.a: "现在我该对你做什么？"
 POD_curse_of_the_maelstrom.100.t: "死涡诅咒"
 POD_curse_of_the_maelstrom.100.desc: "只要深吸一口气，用力呼出，你就能召唤出怨灵群，那些尊崇[UmbraGlossary('oblivion')]的可怕鬼魂，来对付你的敌人，虽然对世俗的观察者来说，没有证据能显示出发生了什么，但即使是在摇篮中的婴儿也会感觉到可怕的事情即将发生。"
 POD_curse_of_the_maelstrom.100.option.a: "让湮灭的仆从们飞舞吧！"
 POD_curse_of_the_maelstrom.100.option.a.tt: "你在[target.GetFirstNamePossessive]的首都召出怨灵群"
 POD_curse_of_the_maelstrom.100.option.b: "时机未到。"
 POD_curse_of_the_maelstrom.100.option.b.tt: "你将放弃诅咒其国度的想法。目前而言……"
 POD_wails_and_whispers.100.t: "哀嚎与低语"
 POD_wails_and_whispers.100.desc: "随着亡灵术师的理解加深，她探索了生与死之间摇摆不定的屏障。当她像报丧女妖一样尖叫时，她可以引诱一个灵魂走向灭亡，增加承受严重伤害的概率。"
 POD_wails_and_whispers.100.option.a: "让我在你耳边低语"
 POD_wails_and_whispers.100.option.b: "也许我该重新考虑一下"
 POD_wails_and_whispers.100.option.b.tt: "现在时机还不成熟。但它可能很快就会到来……"
 POD_intimations_of_mortality.100.t: "短生的暗示"
 POD_intimations_of_mortality.100.desc: "短生的暗示将短生种的令人不快和恼怒的一面加诸于吸血鬼身上。这些经验是直接从$pod_discipline$使用者的记忆中提取的，包括诸如凡人的饥饿、消除体内废物的需要、低敏锐的感官以及容易受到身体创伤等，即使是稚子吸血鬼也能甩掉的东西。"
 POD_intimations_of_mortality.100.option.a: "[recipient.GetFirstName]需要被提醒短生种是怎么样的"
 POD_intimations_of_mortality.100.option.a.tt: "让我们看看[recipient.GetSheHe]如何处理"
 POD_intimations_of_mortality.100.option.b: "也许我该重新考虑一下"
 POD_intimations_of_mortality.100.option.b.tt: "也许[recipient.GetSheHe]不该遭受这。至少不是现在……"
 POD_gift_of_melancholia.100.t: "忧郁之赠"
 POD_gift_of_melancholia.100.desc: "该力量对凡人和该隐之子都会造成一种剧烈萎缩病。两者都会受到疾病的折磨，导致头晕、虚弱、乏力和恶心。这种疾病在凡人中具有高度的传染性，他们仅仅通过接近就能把它传播给对方。\n\n一旦疾病开始传播，由于它的致病力，是没有办法阻止它的，这意味着唯一的选择是让它自己消失。你也没有办法控制疾病在第一次感染后的传播，所以如果你不小心，你自己的地盘也可能遭受同样的命运。"
 POD_gift_of_melancholia.100.option.a: "我带着可怕的礼物而来"
 POD_gift_of_melancholia.100.option.b: "也许我该重新考虑一下"
 POD_gift_of_melancholia.100.option.b.tt: "你放弃了在其的领地传播疾病的计划。目前而言……"
 POD_witchs_fruit.100.t: "女巫之果"
 POD_witchs_fruit.100.desc: "每样植物都依靠死亡来生长。腐烂之物丰富了土壤，而树木、藤蔓和草在吸收重要的营养物质的同时，也吸收了坏死回声。一个亡灵术师可以通过将它们的果实暴露在她的血液中来唤醒这种死亡灵光。她会唤醒并集中它们的微量坏死能量，因此任何食用它们的凡人在受到它们的影响时，都会被扭曲的鬼魂和早已倒下的建筑组成的幻觉所迷惑。"
 POD_witchs_fruit.100.option.a: "是时候让[recipient.GetFirstName]品尝禁果了"
 POD_witchs_fruit.100.option.a.tt: "一颗漂亮的红苹果……"
 POD_witchs_fruit.100.option.b: "也许我该重新考虑一下"
 POD_witchs_fruit.100.option.b.tt: "果实尚未成熟……"
 POD_song_of_the_dead.100.t: "死者之歌"
 POD_song_of_the_dead.100.desc: "吸血鬼吟唱着，将未曾听过的话语编入歌曲，向听众灌输对死亡的不健康的迷恋。受影响的人发现自己被吸引到孤独、不吉利的地方，他们陷入抑郁；死亡让他们感到前所未有的担忧，他们看到到处都是不祥之兆。如果长期受到这种力量的影响，凡人会发疯，变得有自杀倾向，而吸血鬼最终会屈服于蛰眠。"
 POD_song_of_the_dead.100.option.a: "我将为你唱我的民众的歌"
 POD_song_of_the_dead.100.option.b: "也许我该重新考虑一下"
 POD_song_of_the_dead.100.option.b.tt: "还会有其他机会让大家一起唱。"
 POD_necromancy.200.t: "窃取颅骨与灵魂"
 POD_necromancy.200.desc: "当吞没首次被施行时，它的亡灵法师创造者们陷入了漫长而阴暗的沉思中。这些夜晚，吞没的功效被谨慎地权衡，因其潜在的危险而备受关注。与“恶魔附身”专注于将逝去的灵魂移入尸体的空壳不同，吞没则是亡灵法师吞噬灵魂片段并永远将其保存在自己体内的方法。亡灵法师吞噬灵魂的过程需要施法者极大的牺牲，他们必须放弃自己的一部分，以便让逝者之魂进入。一些亡灵法师剥离身体的虚弱部分，以吸收强大武士的灵魂，而另一些则放弃自己熟知的语言，来容纳古老而神秘的方言。在极端情况下，有些“先驱者”甚至放弃了氏族赋予的力量，以换取逝去该隐之子所拥有的血律。\n首先，你将从受害者的头骨中选择一个你没有的$pod_discipline$…"
 POD_necromancy.201.desc: "……随后你付出代价。"
