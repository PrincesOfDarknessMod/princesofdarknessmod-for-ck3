l_simp_chinese:
 POD_travel_events.1.t:0 "Alamut : the Eagle Nest"
 POD_travel_events.1.desc:0 "在小亚细亚的莽原上，如果有人知道去哪里寻找，就会发现有一条狭窄的小路，从几十英里没有村庄的主要贸易道路上分支出来。这条路要爬上最陡峭的山坡，途经险峻的深渊，寒风呼啸，不小心就会被卷到下面锋利的岩石上摔死。这条路通往阿拉穆特，通往鹰巢，通往哈基姆圣裔的古老据点。\n从外面看，阿拉穆特并不起眼：一座黑色玄武岩砌成的小山堡，城墙又矮又薄，根本经不起围攻。然而，这只是要塞的门楼。\n在中央建筑内，有一条宽阔平坦的小路向山下延伸。这里是阿拉穆特防御工事的起点，三个种姓的成员经常对其进行维护和监督。附魔使它的位置不被所有想伤害它的居民的人发现。\n这里是训练大厅，百名战士在此检验自己的能力。这里有数不清的实验室，术士们在此试验人类失传已久的魔法。这里是伟大的图书馆，维齐尔在这里思考宇宙的秘密。\n这里是哈基姆的黑色王座，它占据着要塞最中心的大殿，等待着它合法而可怖的主人归来。"
 POD_travel_events.1.a:0 "这里有许多值得学习的东西。"
 POD_travel_events.1.b:0 "我不能再耽搁了。"
 POD_travel_events.2.t:0 "Ceoris : Tremere's Pride"
 POD_travel_events.2.desc:0 "来访者或攻击者必须从南面险峻、重兵把守的山麓接近塞里奥斯。山谷被大雨、浓雾和暴风雨笼罩，守卫人员日夜巡逻。小路的尽头是通往塞里奥斯大门的陡峭斜坡。山路坎坷曲折，无法拖动攻城武器攻击秘所。巨妖嶙峋的巨岩为守军提供了理想的伏击地点。\n来访者除了浓雾什么也看不见，除了呼啸的狂风什么也听不到。这是一个从人造高原上突起的巨大黑岩竖井。它的表面没有任何装饰，只有几十个狭长的窗户，现在已经用砖砌起，并用铅板封住，破坏了其垂直表面的完美光泽。八座塔楼从建筑的主体上拔地而起，但由于它们都不是通往塞里奥斯的入口，因此只能充当诱饵。其中几座塔楼在受到重压时会燃起熊熊大火。看来睿魔尔无法轻易停止他们的戏剧冲动。\n一道巨大的鸿沟环绕着秘所，只有最狭窄的桥梁可以穿越它。最后，门楼是最后一道障碍，由经验丰富的士兵和最凶猛的石像鬼守护。即使他们被击败，强大的魔法陷阱也在等待着顽固的入侵者。门楼之后就是塞里奥斯本身，它是无魂的睿魔尔的心脏和灵魂。"
 POD_travel_events.2.a:0 "The Usurpers' lair."
 POD_travel_events.2.b:0 "Impressive, to say the least."
 POD_travel_events.3.t:0 "迦太基：美梦与噩梦"
 POD_travel_events.3.desc:0 "The Brujah still draw inspiration from legends of the great scholars and philosophers that flourished in Carthage, a culture where Kindred and kine were closer to one another than any point before or since. Indeed, some Brujah (and a few others) remember Carthage as the \"Third City\", the spiritual and political heir of the First and Second Cities. However, other, darker tales speak of a degenerate blood cult under none other than Troile, the Antediluvian ancestor of the Brujah; of human sacrifices – including infant sacrifices – to infernal powers; and of collusion between Troile and the Baali methuselah Moloch.\nThe Ventrue of Rome were fierce rivals of their Brujah cousins in Carthage. As Moloch drew Troile into desensitization and degeneration, news of the endemic corruption among Carthaginian Brujah spread to the Roman clans. The Malkavian seeress Tryphosa gave guidance to the Roman prince Camilla directing him to act against Carthage, and the Carthaginian Toreador Helena betrayed her city to the Romans. Through the Toreador Antediluvian, Artemis Orthia, Lysander and prince Alchias an alliance formed against the Brujah of Carthage; under the leadership of the Roman Ventrue the alliance encompassed the Malkavians, Toreador, Lasombra and their allies. As the Third Punic War razed Carthage in 146 BCE, the collective forces of the Roman Cainite alliance defeated Carthage's Brujah and Baali masters. In the end, Troile and Moloch were driven into torpor, entwined in an eternal lovers' embrace beneath the salted fields of Carthage."
 POD_travel_events.3.a:0 "一场沉睡的噩梦。"
 POD_travel_events.3.b:0 "The ruins of our utopia."
 POD_travel_events.4.t:0 "Erciyes : Cappadocius' Folly"
 POD_travel_events.4.desc:0 "Sometimes called the Monastery of Shadows due to its location, the high cliffs on all sides means it receives only a few hours of direct sunlight each day, Erciyes was taken over by the Cappadocians in a mass assault (the only military action in the history of the clan) sometime in the 1st century BCE, when they replaced a mountain monastery originally serving as a cult for a Malkavian. Since that time, the clan supported a temple complex at the mountain dedicated to the Cappadocian study of death and God. This temple is Christian (as Cappadocians tend to be), but is known for its strange and horrifying secrets.\nIts \"sister city\", Kaymakli lies nearby and bolsters an even darker reputation. The city was a hybrid community of Cappadocians and mortals; the mortals provided all the amenities and served as a herd for the undead scholars in their ranks. While hardly ideal, the arrangement seemed to be moderately satisfactory for both parties, possibly tempered both by the generally unpleasant conditions of a 9th century Turkish peasant and the generally passive and somewhat more humane attitudes of Cappadocius.\nWhen the clan was purged during the Feast of Folly, the city became a tomb for thousands of unfortunate Cappadocians. After that, the clan moved most of its activity back to Erciyes."
 POD_travel_events.4.b:0 "The final rest of our brothers and sisters."
 POD_travel_events.5.t:0 "The Cathedral of Flesh : Yorak's Folly"
 POD_travel_events.5.desc:0 "The Cathedral is the creation, the haven, and the ward of Yorak, a childe of the Tzimisce Antediluvian. It was built to protect a germ of the Antediluvian's consciousness that Yorak was charged with, and in time it took the form of a harrowing church-fortress, sculpted from the flesh of peasants, slaves, rivals, beasts, and any number of other victims who were built into the pulsing, suppurating walls of the structure built by the methuselah and his retinue over a span of millennia.\nHowever the Cathedral is much more than that, it is a living (or perhaps undead) vessel of mad collective consciousness. The cathedral displays some very disturbing ambiance, like a pool of blood lined with sitting victims whom you can use as a chair, pillars of grafted bodies, walls of mouths that sing a wailing chorus as you pass them, or the open gallery where corpses remain impaled by stalactites. Those thick stalactites and stalagmites form the Cathedral's pillars, with bone trusses over which limestone grows and forms an osseous mix of liquid architecture. Either skulls – with their eyes and surrounding muscular structure still intact – thin enough to behold the sea of viscera and floating organs comprise the walls.\nScores of ghouls moisten the eyes so they can blink properly. Even more Revenants conduct the ritual tattooing by drawing charcoal-dusted threads through their victim's skin with bone needles. Later, Yorak and his childer would carefully slough the flesh from their screaming sacrifices, treat the flesh canvas in a preservative, and stretch it over the windows like a mosaic."
 POD_travel_events.5.a:0 "The Tzimisce have no limits."
 POD_travel_events.5.b:0 "真是个奇迹！"
 POD_travel_events.6.t:0 "The Castel del Ombro : Lasombra's Lair"
 POD_travel_events.6.desc:0 "There are occasional mysterious phenomena associated with this place, and an old tale about how the shadows here remained intact even when lava flows from nearby Mount Etna cast their lurid red glow on everything else. Neither local residents nor visiting authorities realize how thoroughly their minds are twisted on a regular basis to hide all that is genuinely interesting about this castle at the center of the estate. To vampiric sight it is a different matter altogether.\nThe castle itself is a simple design, modified countless times over the centuries and not really depending on physical strength at all for its defenses. A long outer wall, precisely square, encloses two interior towers, also square. The eastern tower rises higher, with a spreading upper deck to allow watchers the best view of any trouble coming from the volcano as well as other directions. It is impossible to tell from a distance what the walls are made of, precisely, because animated shadows crawl over every surface in a just barely visible ebb and flow. Tides of shadow rise out of the depths after sunset each night and wrap around the castle in a generally spiral pattern, reversing after midnight to gradually drain away.\nIt is said that the gates are only opened when Lasombra himself is away from the castle, a worrying sight for the world at large."
 POD_travel_events.6.a:0 "Spooky."
 POD_travel_events.6.b:0 "我们氏族的核心。"
 POD_travel_events.7.t:0 "The Pit of Malkav : Madness Incarnate"
 POD_travel_events.7.desc:0 "隧道位于耶路撒冷地下，早在这座城市出现之前就已废弃。这个由坍塌的通道组成的迷宫，有些地方几乎无法通行，高高的石拱通向悬崖边的崖壁，一直延伸到彻底的黑暗。在原地，支撑石质通道的天平可能就像骨头一样脆弱。只要轻轻一撞，走廊就会掉下一大截。通道在三维空间中交织，除了第一层，还有许多其他层次。\n一个人真的可以在这里游荡到永远。\n要绘制这些废墟的地图是不可能的，但有三个地方非常突出。\n涂鸦室，墙壁上满是黑乎乎的白垩涂鸦。疯狂的图像攻击着试图破译它们的可怜傻瓜。\n血河，任何试图饮用血河之水的该隐之子都会因其毒性而遭受可怕的后果。\n最后，上古耆宿传说中的安息之地。上古耆宿在这里做着梦，有时会召唤他的后代。但无论他如何强烈地呼唤或呼唤多久，从来没有人能够来到他身边。"
 POD_travel_events.7.a:0 "这里不是我这种人待的地方。"
 POD_travel_events.7.b:0 "Father, I'm listening!"
 POD_travel_events.8.t:0 "The Fire Court : Eye of the Snake"
 POD_travel_events.8.desc:0 "The Fire Court lies near the Valley of the Kings. Using the lure of power and riches of the area, the Setites often claim would be adventurers in their clutches to be drawn to the Court.\nAnyone who enter find themselves in a deep cavern painted in a strange orange light. Paintings hang on the walls, with the most prominent one depicting a great black serpent devouring the sun. The tunnel leads to a great room carved from sandstone. Six huge statues of men and women with snakes coiled around them serve as pillars, holding the vaulted ceiling aloft. The statues' expressions are either of ecstasy or agony. The ceiling is veiled by shadows that seem to ripple with a life all their own, those with keen eyesight realize that carved snakes cover the entire ceiling. Dozens of real snakes slither around the room as well.\nA large, circular pit fire is near the center of the room. Its fire burns a ghastly green and emits an intoxicating fume. Behind the fire is a dais, stairs lead from it to a coiled stone cobra that spread its hood over a golden throne. This is where the mistress of the Fire Court sits, somehow more intimidating than anything else in this room."
 POD_travel_events.8.a:0 "They really love their snakes."
 POD_travel_events.8.b:0 "Set's power, shown to all."
 POD_travel_events.9.t:0 "Knossos' Labyrinth : Namtaru's Lair"
 POD_travel_events.9.desc:0 "内尔伽勒是一个可怖的名字，这个吸血鬼将自己的灵魂出卖给了更强大的力量，并设法用他的恶魔和崇魔者大军威胁第二城。内尔伽勒最初的尝试遭到了挫败，但当他发现他想要唤醒的黑暗野兽的安息之地就在加利利北部后，他再次出现，自称为巴力氏族的创始人衰旦。\n他在瘟疫使者，纳姆塔尔的坟墓上建造了乔拉津要塞，设法挖掘出了沉睡的躯体，并将其移至爱琴海上的克诺索斯，建造了一座巨大的迷宫，其灵感来自人类大脑表面的裂隙和管道。当纳姆塔鲁的意识越来越强时，岛屿周围的现实也发生了扭曲，其他吸血鬼惊慌失措，攻击了内尔伽勒的据点。十三个氏族的联手导致克诺索斯地下的火山爆发，将纳姆塔鲁沉入海底，显然也永远摧毁了内尔伽勒。\n时至今日，克诺索斯仍然是大多数吸血鬼本能会避开的地方，除了那些想方设法与不该被打扰的生物为伍的吸血鬼。"
 POD_travel_events.9.a:0 "人间地狱。"
 POD_travel_events.9.b:0 "The darkest and greatest power awaits here."
 POD_travel_events.10.t:0 "Sernog Monastery : Tzimisce's Lair"
 POD_travel_events.10.desc:0 "The structure lies high atop a ridge above the treeline. An abandoned fortress looms menacingly, its blackened walls forming a dark skeleton against the sky, a shell of a building open to the stars. Attached to the fortress is an ancient cathedral, ostensibly in better condition but no less sinister than its companion building. Long ago desecrated, the land around the monastery cathedral no longer qualifies as holy ground; Cainites may tread upon the premises with impunity.\nThe cathedral's interior reflects an atmosphere of dark foreboding. The architecture seems carved from the fevered imagination of some mad designer. Grotesque carvings of beings that might be angels but resemble devils glare down upon those who pass through the archway at the entry to the former sanctuary. The air inside the cathedral has a musty, cloying odor, as if something eternally dying has embedded itself within the stones and now oozes forth its essence in a miasma of perpetual decay. Eerie moaning sounds fill the cavernous central chamber, echoing off the high vaulted beams and reverberating in a cacophony of shrill screams that mimic the cries of victims undergoing the agonies of prolonged and exquisite torture.\nThere is a trapdoor hidden beneath the altar of the church. Cut into the wooden planking of the floor, the door opens by pulling up on its iron ring. A narrow, dark stairway leads down into the crypt of the cathedral which contains a sarcophagus guarded by a small army of servitor creatures."
 POD_travel_events.10.a:0 "Where Samiel met his end, if the stories are true."
 POD_travel_events.10.b:0 "他正在沉睡，等待着回来的时机。"
 POD_travel_events.11.t:0 "Hunedoara : Lair of the Hidden"
 POD_travel_events.11.desc:0 "Ask the people of Hunedoara where the castle stands and you will get a blank look. They would be very surprised to learn that older maps show a magnificent castle less than an hour from their village. The castle is unknown.\nInconnu.\nForbidding and desolate in its fading grandeur, its remains concealed from the world at large, tucked away in a rocky abode. No mortals can enter the castle, for the ritual cause all who pass within eyesight of it to feel great fear. The farther they get from it, the more faint their memories grow, until they remember it no more.\nEntering the castle is an almost impossible task, even great vampiric powers cannot force someone to avoid this fear. As such, those who do make it to the castle are usually forced to. Entrance to the castle can only be gained by a long, winding mountain path, thin and treacherous, and often with a deep chasm on its side. The outer walls are in a state of gross disrepair, and almost all of the outer buildings have collapsed, making the whole area seem more deserted and malevolent. Anyone trying to enter via any way other than the main gate are pushed back by winds, lightning and finally bursts of flame.\nInside resides the greatest concentration of vampiric power since Carthage... and something even more dangerous."
 POD_travel_events.11.a:0 "Where Golconda died, and Hell began."
 POD_travel_events.12.t:0 "Vienna, the House that Etrius Built"
 POD_travel_events.12.desc:0 "Created after Etrius expressed his serious concerns about transforming House Tremere into a vampire clan too fast, Vienna soon became the safest haunt for the clan's conservative faction.\nPerched on a jagged promontory several miles to the north of the city, the Vienna chantry looks like a large and imposing hunting lodge. Its walls are composed of massive chunks of gray stone, hewn from the Earth by Etrius' magic. Massive timbers act as pillars and cross-beams throughout the structure. Every chamber is grand and oversized. An extensive network of disused chambers crisscrosses the hill on which the building stands. Etrius build those to allow room for future expansion without arousing unwanted attention.\nVienna's laboratories are large and well stocked and the library is the best that the Tremere have at their disposal outside of Ceoris. Common areas are at the same time sumptuous and forbidding. Heavy wooden furniture is padded in gold embroidered velvet. Incense of overpowering sweetness wafts from numerous copper censers. Tapestries depict Tremere, Etrius and Goratrix disapprovingly starring down at the room's occupants, while massive stag's horns, boar's heads and other trophies appear throughout the building.\nVienna lacks the elaborate protective measures of Ceoris, but the ground is still lard with ingenious traps."
 POD_travel_events.12.a:0 "The Usurpers' backup plan."
 POD_travel_events.12.b:0 "An oasis of calm far from our enemies."
 POD_travel_danger_events.13.success:0 "They are defeated!"
 POD_travel_danger_events.13.wound:0 "A difficult victory."
 POD_travel_danger_events.13.failure:0 "Costly escape..."
 POD_travel_events.13.t:0 "$travel_danger_prefix$ Werewolf Ambush!"
 POD_travel_events.13.desc:0 "Forests are the domain of the Lupines and, despite your best efforts to remain stealthy, those damn overgrown wolves managed to track your scent. Luckily, you were prepared for the possibility and you aren't completely caught by surprise.\nStill, these are powerful creatures, much more accustomed to a fight here than you ever will be. This won't be easy."
 POD_travel_events.13.a:0 "Stand your ground!"
 POD_travel_events.13.b:0 "You there, protect me!"
 POD_travel_danger_events.14.success:0 "They let you pass!"
 POD_travel_events.14.t:0 "$travel_danger_prefix$ Hunters on the Prowl"
 POD_travel_events.14.desc:0 "Despite your best efforts to stay stealthy during your travels, it seems rumors of your convoy have been heard by a band on enterprising hunters. They have blockaded a bridge that you will have to cross to continue your journey but, luckily, don't seem to be entirely sure of who (or what) to expect.\nYou are as such not attacked on sight, which gives you the opportunity to try deceiving them, maybe avoiding a fight in the process."
 POD_travel_events.14.a:0 "Charge before they react!"
 POD_travel_events.14.b:0 "You, deal with them."
 POD_travel_events.14.c:0 "We are humble merchants passing through..."
 POD_travel_events.15.t:0 "$travel_danger_prefix$ Mad Prophet"
 POD_travel_events.15.desc:0 "A disheveled individual, clearly not completely sane of mind, has started to follow your convoy for some time now. He is sprouting nonsense about Gehenna, Apocalypse, Ascension, the Time of Judgment and other drivel. Your best efforts to shoo him away have failed, and even resorting to violence only seems to make him reappear later with even more doom and gloom in his speech.\nYour caravan is starting to get aggravated by the constant doomsday prattle, forcing you to consider acting."
 POD_travel_events.15.a:0 "Talk to me instead."
 POD_travel_events.15.b:0 "Just ignore the madman."
 POD_travel_events.15.c:0 "I have prophecies of my own too!"
 POD_travel_events.16.t:0 "$travel_danger_prefix$ Quiet Town"
 POD_travel_events.16.desc:0 "Since you have entered this region, rumors have been spread to your caravan about one quaint little town that your travel plan is making you go through. Locals speak of unholy abominations ruling the night there, forcing the townsfolk to pray to see the morning dawn as soon as possible.\nAs you get closer, the rumors get even more graphical and your entourage is sharing their unease with you. They are arguing for a small detour instead of risking setting foot in this accursed village and angering whoever is truly ruling here."
 POD_travel_events.16.a:0 "I fear no ghost story!"
 POD_travel_events.16.b:0 "Yes, a detour. Not that I'm afraid..."
 POD_travel_events.16.c:0 "I sense a kindred spirit!"
 POD_travel_events.17.t:0 "$travel_danger_prefix$ Mortal Wars"
 POD_travel_events.17.desc:0 "The clueless mortals are waging a war in this region for one petty reason or another. Not that you care, but the devastation brought by the conflicting armies and the risk of stumbling upon one of them is a concern to your travel plan. An option would be to simply make a rather lengthy detour, hopefully avoiding any contact with the clashing mortals. You could also hire more local guides than originally planned since they would be the best suited to find a safe alternative travel route.\nThe most unorthodox solution would be to join the fray with your entourage, a time consuming but potentially enlightening solution to observe the mortals' latest warfare tactics."
 POD_travel_events.17.a:0 "Let's just avoid them."
 POD_travel_events.17.b:0 "Hire more locals to speed things up."
 POD_travel_events.17.c:0 "A war? Let me join!"
 POD_travel_events.18.t:0 "$travel_event_prefix$ Under the Night Guise"
 POD_travel_events.18.desc:0 "Traveling long distance for a vampire is a miserable affair as the sun proves a formidable deterrent. If you try to move by day, you will have to have some very specific (and suspicious) accommodations to make sure your resting place stays perfectly sun proof and can only be protected by those minor servants that can actually endure the daylight. If you travel only by night, you are likely to draw even more unwanted attention and need to account for the sleep schedule of those same daylight servants...\nThere isn't an easy solution to that issue and, as such, travels with a vampire tend to get much lengthier than without one, even with the best preparation made beforehand."
 POD_travel_events.18.a:0 "It is what it is."
 POD_travel_events.18.b:0 "Push onward! Faster!"
 POD_travel_events.19.t:0 "$travel_event_prefix$ Old Egyptian Style"
 POD_travel_events.19.desc:0 "As a mummy, you have lived a very long time and seen (and likely even led) great civilizations of Antiquity. The pomp and glory of this past world stands as a stark contrast to the gloom of these \"Dark Ages\". Where are the musicians, the processions, the orators announcing your glorious titles as you walk through the land? And what are those horrible carriages even supposed to look like? They don't hold a candle to your golden chariot!\nYou have a sudden fancy of delaying your current travel until you are able to recreate some of this past glory. A costly and long endeavor but you really want to show those modern people how a true Pharaoh travels."
 POD_travel_events.19.a:0 "Fetch my Hemhemet!"
 POD_travel_events.19.b:0 "...Nostalgia hit me hard there."
 POD_travel_events.20.t:0 "$travel_event_prefix$ Hunters of the People"
 POD_travel_events.20.desc:0 "As an hunter of all the horrible things that prey on humanity, your duty has to be a secret vow. Your fellow men would panic if they knew the extent of the threat just lurking behind every corner. This secrecy often causes some issues as many people confuse you for some manner of clerical authority and then unburden their current, often very mundane, issues on you as you travel through their lands.\nAdministering justice is something you know how to do but it would also be quite the delay on your more pressing (and much more important) combat against the supernatural."
 POD_travel_events.20.a:0 "I will listen, and judge."
 POD_travel_events.20.b:0 "The Devil's minions won't wait for me."
 POD_travel_events.21.t:0 "$travel_event_prefix$ Meeting of the Wolves"
 POD_travel_events.21.desc:0 "As a tradition, traveling werewolves are supposed to be able to find shelter in local Caerns as long as they respect the authority and customs of its inhabitants. They are also expected to not stay for too long as werewolves are territorial creatures and don't like the potential competition.\nYour scouts noticed a nearby Caern that could serve as a potential friendly shelter. It would delay your travel for a while, but would reflect well on you and yours to partake in the traditions of the Garou with the locals."
 POD_travel_events.21.a:0 "Can we share your fire for a while?"
 POD_travel_events.21.b:0 "No time for delays."
 POD_travel_events.22.t:0 "$travel_event_prefix$ Hell on your Small Town"
 POD_travel_events.22.desc:0 "Traveling brings opportunity for your kind and their servants. It is a way to discover small, isolated, villages that are barely acknowledged as existing by the various authorities of their country. Such easy preys to corrupt make for a relaxing recreation during a boring long trip. Obviously it would delay your travel for a while but isn't self gratification worth everything in the end?"
 POD_travel_events.22.a:0 "The delights I will show you..."
 ghouled_entourage_option:0 "Ghouled Entourage"
 ghouled_entourage_option_desc:0 "Vampires need a strong and loyal entourage during travels, as they can't act during daylight. Ghouls make for a good option."
 mummies_grandeur_option:0 "Travels of the Pharaoh"
 mummies_grandeur_option_desc:0 "Mummies remember a time when they were Pharaoh and traveled with an entourage and grandeur that could make the petty Kings of today blush. Sometimes, they want to bring that era back."
 werewolves_umbra_option:0 "Moon Bridges"
 werewolves_umbra_option_desc:0 "Werewolves can travel using the fabled Moon Bridges that cross the umbra. In many instances, this is much faster and safer than taking the mundane road instead."
 spread_cults_option:0 "Spread Cults"
 spread_cults_option_desc:0 "Traveling brings you an opportunity to infiltrate loyal members of your cult into the local villages and towns you will pass through. This will delay you a little, but increasing your influence is certainly beneficial."