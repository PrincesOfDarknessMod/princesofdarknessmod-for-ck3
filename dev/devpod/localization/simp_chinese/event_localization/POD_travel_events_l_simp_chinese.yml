l_simp_chinese:
 POD_travel_events.1.t: "阿拉穆特：鹰巢"
 POD_travel_events.1.desc: "在小亚细亚的莽原上，如果有人知道去哪里寻找，就会发现有一条狭窄的小路，从几十英里没有村庄的主要贸易道路上分支出来。这条路要爬上最陡峭的山坡，途经险峻的深渊，寒风呼啸，不小心就会被卷到下面锋利的岩石上摔死。这条路通往阿拉穆特，通往鹰巢，通往哈基姆圣裔的古老据点。\n从外面看，阿拉穆特并不起眼：一座黑色玄武岩砌成的小山堡，城墙又矮又薄，根本经不起围攻。然而，这只是要塞的门楼。\n在中央建筑内，有一条宽阔平坦的小路向山下延伸。这里是阿拉穆特防御工事的起点，三个种姓的成员经常对其进行维护和监督。附魔使它的位置不被所有想伤害它的居民的人发现。\n这里是训练大厅，百名战士在此检验自己的能力。这里有数不清的实验室，术士们在此试验人类失传已久的魔法。这里是伟大的图书馆，维齐尔在这里思考宇宙的秘密。\n这里是哈基姆的黑色王座，它占据着要塞最中心的大殿，等待着它合法而可怖的主人归来。"
 POD_travel_events.1.a: "这里有许多值得学习的东西。"
 POD_travel_events.1.b: "我不能再耽搁了。"
 POD_travel_events.2.t: "塞奥里斯：睿魔尔之骄傲"
 POD_travel_events.2.desc: "来访者或攻击者必须从南面险峻、重兵把守的山麓接近塞奥里斯。山谷被大雨、浓雾和暴风雨笼罩，守卫人员日夜巡逻。小路的尽头是通往塞里奥斯大门的陡峭斜坡。山路坎坷曲折，无法拖动攻城武器攻击秘所。巨妖嶙峋的巨岩为守军提供了理想的伏击地点。\n来访者除了浓雾什么也看不见，除了呼啸的狂风什么也听不到。这是一个从人造高原上突起的巨大黑岩竖井。它的表面没有任何装饰，只有几十个狭长的窗户，现在已经用砖砌起，并用铅板封住，破坏了其垂直表面的完美光泽。八座塔楼从建筑的主体上拔地而起，但由于它们都不是通往塞奥里斯的入口，因此只能充当诱饵。其中几座塔楼在受到重压时会燃起熊熊大火。看来睿魔尔无法轻易停止他们的戏剧冲动。\n一道巨大的鸿沟环绕着秘所，只有最狭窄的桥梁可以穿越它。最后，门楼是最后一道障碍，由经验丰富的士兵和最凶猛的石像鬼守护。即使他们被击败，强大的魔法陷阱也在等待着顽固的入侵者。门楼之后就是塞奥里斯本身，它是无魂的睿魔尔的心脏和灵魂。"
 POD_travel_events.2.a: "篡位者的巢穴"
 POD_travel_events.2.b: "至少能说令人印象深刻。"
 POD_travel_events.3.t: "迦太基：美梦与噩梦"
 POD_travel_events.3.desc: "布鲁赫仍然从迦太基蓬勃孕育的伟大学者和哲学家的传说中汲取灵感，在这文化中，血族和血畜的关系空前绝后地密切。有些布鲁赫（和其他血族）铭记迦太基为第三城，在精神与政治上继承第一、第二城。然而其他更黑暗的传说则讲述了堕落的血之密教，献祭人类，甚至包括婴儿给地狱强权，该教的主使不是他者，正是特洛伊尔——布鲁赫的上古耆宿，与巴力的玛土撒拉摩洛的共谋下。\n罗马梵卓是他们迦太基布鲁赫表亲的劲敌。当摩洛使特洛伊尔麻木腐化时，迦太基布鲁赫的堕落情形业已流传至罗马的诸多氏族。末卡维女先知特黎佛撒指导罗马亲王卡密拉采取行动对抗迦太基，而身为迦太基人的妥芮朵海伦也叛变投向罗马方。借着妥芮朵的上古耆宿、阿尔忒弥斯·欧西雅、吕山德和阿尔基亚斯亲王的反迦太基布鲁赫联盟成立，并在罗马梵卓的领导下，末卡维、妥芮朵、勒森魃和他们的盟友陆续加入。西元前146年，在罗马该隐之子的合力下战胜了布鲁赫与巴力之主，第三次布匿战争夷平了迦太基。最后，特洛伊尔和摩洛被迫蛰眠，两人以永恒的爱人之拥交缠在洒了盐的迦太基地底下。"
 POD_travel_events.3.a: "一场沉睡的噩梦。"
 POD_travel_events.3.b: "我们乌托邦的废墟。"
 POD_travel_events.4.t: "埃尔吉耶斯：卡帕多修斯的殿堂"
 POD_travel_events.4.desc: "因为所处位置，有时也被称为暗影修道院，四周高耸的悬崖意味着一天只有几个小时会受到阳光的直接照射。在西元前一世纪的某时，卡帕多西亚们在一次大型袭击中占领了埃尔吉耶斯（该氏族在历史中唯一一次军事行动），他们取代了修道院原先作为侍奉某位末卡维的密教之用。自那时，卡帕多西亚们便资助山岭间的宗教建筑群来致力于研究死亡与天主。尽管这是座天主教殿堂（卡帕多西亚们的倾向），但也以其奇怪与令人恐怖的秘密知名。\n周遭的姊妹城——凯马克利更加剧了其黑暗的名声。该城混居卡帕多西亚和凡人，凡人不仅供应了所有基础设施，也作为牧群服务不死学者们。虽然算不上是理想，但这种安排似乎对双方来说都还满意，可能是受到九世纪土耳其农民普遍艰苦的条件和卡帕多修斯们普遍被动且更人道的态度所影响。\n当该氏族在愚蠢盛宴中被屠杀时，这座城市便成为成千上万不幸的卡帕多西亚们的墓地。此后，该氏族便将大多数活动带回埃尔吉耶斯举行。"
 POD_travel_events.4.b: "我们兄弟姊妹的最终归宿"
 POD_travel_events.5.t: "血肉大教堂：沃拉克的殿堂"
 POD_travel_events.5.desc: "该大教堂是沃拉克的创作、避难所和囚室，沃拉克是上古耆宿棘秘魑的子嗣。它的建造是为了保护沃拉克所负责的上古耆宿意识胚芽，随着时间的推移，它采取了一座折磨人的教堂堡垒形式，由农民、奴隶、对手、野兽和许多其他受害者的肉体雕刻而成。玛土撒拉和他的随从在千年以来的时间中将他们建造成不断脉动化脓的墙壁。\n然而大教堂远不止于此，它是一个充满疯狂集体意识，活生生的（或者也许是不死的）容器。大教堂呈现出令人非常不安的氛围，比如血泊中坐着受害者，你可以把他们当作椅子，接合的尸体作为柱子，一经过就会唱着哀号合唱的嘴墙，或是在开放画廊，仍然被钟乳石刺穿的尸体。这些厚重的钟乳石和石笋构成了大教堂的支柱，骨桁架上的石灰石生长并形塑成液体建筑的骨质混合物。不论哪种头骨，有眼睛的和有周围的肌肉组织的都仍然完好无损，漂动的器官组成的墙壁足够薄，能够看到内脏之海。\n许多血仆湿润了眼睛，以便它们能够正常眨眼。更多的遗传血仆会用骨针将沾有炭粉的线穿过受害者的皮肤来进行纹身仪式。之后，沃拉克和他的子嗣会小心地从他们尖叫着的祭品中剥下肉，用防腐剂处理血肉窗纸，然后将其像马赛克一样铺在窗户上。"
 POD_travel_events.5.a: "棘秘魑没有极限。"
 POD_travel_events.5.b: "真是个奇迹！"
 POD_travel_events.6.t: "暗影之堡：勒森魃的藏身处"
 POD_travel_events.6.desc: "这个地方偶尔会出现一些神秘的现象，还有一个古老的传说，说即使附近埃特纳火山的熔岩流将可怕的红光洒在其他一切上时，这里的阴影仍然保持完整。当地居民和来访的官员都没有意识到，为了隐藏这座庄园中心的城堡的所有真正重要之处，他们的思维被彻底地扭曲了。对于吸血鬼的视觉来说，这完全是另外一回事。\n这座城堡本身设计简单，经过无数次修改，实际上并不依赖于任何物理力量来进行防御。一个精确的方形外墙将两座内部方形塔楼包围起来。东塔更高，顶部有一个宽敞的露台，让守望者可以从火山以及其他方向获得最佳视野。从远处无法准确判断墙壁由什么材料构成，因为活动的阴影在每个表面上蠕动，仅能隐约可见。每天日落后，阴影的潮汐从深处升起，以一种大致螺旋的形式缠绕城堡，午夜后逐渐消散。\n据说只有在勒森魃本人亲自离开城堡时，大门才会打开，这对于整个世界来说是一个令人担忧的景象。"
 POD_travel_events.6.a: "真吓人。"
 POD_travel_events.6.b: "我们氏族的核心。"
 POD_travel_events.7.t: "末卡维地穴：疯狂体现"
 POD_travel_events.7.desc: "隧道位于耶路撒冷地下，早在这座城市出现之前就已废弃。这个由坍塌的通道组成的迷宫，有些地方几乎无法通行，高高的石拱通向悬崖边的崖壁，一直延伸到彻底的黑暗。在原地，支撑石质通道的天平可能就像骨头一样脆弱。只要轻轻一撞，走廊就会掉下一大截。通道在三维空间中交织，除了第一层，还有许多其他层次。\n一个人真的可以在这里游荡到永远。\n要绘制这些废墟的地图是不可能的，但有三个地方非常突出。\n涂鸦室，墙壁上满是黑乎乎的白垩涂鸦。疯狂的图像攻击着试图破译它们的可怜傻瓜。\n血河，任何试图饮用血河之水的该隐之子都会因其毒性而遭受可怕的后果。\n最后，上古耆宿传说中的安息之地。上古耆宿在这里做着梦，有时会召唤他的后代。但无论他如何强烈地呼唤或呼唤多久，从来没有人能够来到他身边。"
 POD_travel_events.7.a: "这里不是我这种人待的地方。"
 POD_travel_events.7.b: "父主，我在倾听！"
 POD_travel_events.8.t: "火之庭：巨蛇之眼"
 POD_travel_events.8.desc: "火之庭位于国王谷附近。利用该地区力量和财富的诱惑，赛特之子经常声称被他们掌控的冒险家们会被吸引到火之庭。\n任何进入的人都会发现自己身处一个笼罩着奇怪橙色光芒的深洞中。墙上挂着画作，其中最引人注目的一幅描绘了一条吞噬太阳的黑色巨蛇。隧道通向一间用砂岩雕刻而成的大房间。六尊巨大的男女雕像，周身盘绕着蛇，作为柱子将拱形天花板高高举起。雕像的表情或狂喜或痛苦。天花板上笼罩着阴影，似乎具有生命荡漾着，眼力敏锐的人会发现雕刻的蛇覆盖了整个天花板。数十条真蛇也在房间里蜿蜒爬行。\n房间中央有一个巨大的圆形火坑。它的火焰燃烧成阴森的绿色，并散发出醉人的烟雾。火堆后面是一个平台，平台的楼梯通向一条盘绕的石眼镜蛇，它的颈部张开覆盖在一个金色的王座上。这是火之庭女主人坐的地方，不知为何，她比这个房间里的任何东西都更令人恐惧。"
 POD_travel_events.8.a: "这些人确实很爱他们的蛇。"
 POD_travel_events.8.b: "赛特的力量，展示给所有人！"
 POD_travel_events.9.t: "克诺索斯迷宫：纳姆塔尔的巢穴"
 POD_travel_events.9.desc: "内尔伽勒是一个可怖的名字，这个吸血鬼将自己的灵魂出卖给了更强大的力量，并设法用他的恶魔和崇魔者大军威胁第二城。内尔伽勒最初的尝试遭到了挫败，但当他发现他想要唤醒的黑暗野兽的安息之地就在加利利北部后，他再次出现，自称为巴力氏族的创始人衰旦。\n他在瘟疫使者，纳姆塔尔的坟墓上建造了哥拉汛要塞，设法挖掘出了沉睡的躯体，并将其移至爱琴海上的克诺索斯，建造了一座巨大的迷宫，其灵感来自人类大脑表面的裂隙和管道。当纳姆塔鲁的意识越来越强时，岛屿周围的现实也发生了扭曲，其他吸血鬼惊慌失措，攻击了内尔伽勒的据点。十三个氏族的联手导致克诺索斯地下的火山爆发，将纳姆塔鲁沉入海底，显然也永远摧毁了内尔伽勒。\n时至今日，克诺索斯仍然是大多数吸血鬼本能会避开的地方，除了那些想方设法与不该被打扰的生物为伍的吸血鬼。"
 POD_travel_events.9.a: "人间地狱。"
 POD_travel_events.9.b: "最黑暗强大的力量在此等候。"
 POD_travel_events.10.t: "塞尔诺格修道院：棘秘魑的巢穴"
 POD_travel_events.10.desc: "这座建筑高高地坐落在树线之上的山脊上。一座废弃的堡垒威胁性地矗立着，其黑色的墙壁在天空中形成了一个黑暗的骨架，一个向星空敞开的建筑壳体。与堡垒相连的是一座古老的大教堂，表面上状况较好，但与其伴建物一样邪恶。很久以前，这座修道院大教堂的周围被亵渎，不再被视为神圣之地；该隐之子可以毫不顾忌地踏入这里。\n大教堂内部散发出一种黑暗的不祥气氛。建筑仿佛出自某个疯狂设计师的狂热想象。在通往前教堂的拱门处，被丑陋的雕刻所注视着，这些雕刻可能是天使，但却像恶魔一样。教堂内部的空气有一种陈腐而令人窒息的气味，仿佛永远在死去的东西已经融入石头之中，并以一种永恒腐朽的瘴气渗透出来。可怕的呻吟声充满了宽敞的中央大厅，回荡在高高的拱顶横梁上，回响成一片刺耳的尖叫声，仿佛模仿着那些正在经历长时间和极度折磨的受害者的哭喊声。\n教堂的祭坛下隐藏着一个陷阱门。门刻在木板地板上，通过拉起铁环来打开。一条狭窄而黑暗的楼梯通向教堂的地下室，那里有一个由一小队仆从生物守护的石棺。"
 POD_travel_events.10.a: "如果传说是真的，这里就是萨麦尔的终末之处。"
 POD_travel_events.10.b: "他正在沉睡，等待着回来的时机。"
 POD_travel_events.11.t: "胡内多阿拉：隐秘巢穴"
 POD_travel_events.11.desc: "如果向胡内多阿拉的居民问城堡在哪里，你会看到一脸茫然。如果他们得知旧地图上显示一座宏伟的城堡距离他们的村庄不到一小时，将会感到非常惊讶。该城堡不为人所知。\n遁世。\n岩石居所的宏伟逐渐消逝，满目荒凉令人生畏，隐藏的遗迹不为世人所见。没有凡人能进入城堡，因为仪式会让所有在其视线范围内经过的人感到极大的恐惧。离它越远，记忆就越模糊，直到他们不再记得它。\n进入城堡几乎是一项不可能的任务，即使是强大的吸血鬼力量也无法使人避免这种恐惧。因此，那些成功进入城堡的人通常是被迫的。进入城堡只能通过一条漫长而蜿蜒的山路，这条路又细又险，而且路上不时有深不见底的鸿沟。外墙年久失修，外围建筑几乎全部倒塌，让整个地区显得更加荒凉和凶恶。任何试图从主门以外的任何方式进入的人都会被狂风、闪电最后是爆发的火焰所击退。\n里面蕴藏着自迦太基以来最浓缩的吸血鬼力量……还有比之更危险的东西。"
 POD_travel_events.11.a: "浩恩永生灭亡之地，地狱的序章。"
 POD_travel_events.12.t: "维也纳，埃特里乌斯所建之屋"
 POD_travel_events.12.desc: "在埃特里乌斯对于过快将睿魔尔家族转变为一个吸血鬼氏族表示严重担忧之后，维也纳很快成为了家族保守派的最安全之地。\n维也纳秘所坐落在城市以北几英里的一座嶙峋的岬角上，看起来像一座庞大而威严的狩猎小屋。它的墙壁由埃特里乌斯的魔法从大块灰色石头中凿出。巨大的木材作为支柱和横梁贯穿整个结构。每个房间都是宏伟而超大型的。一系列废弃的房间交错分布在建筑所在的山丘上，为未来的扩展提供了空间，同时又不引起不必要的注意。\n维也纳的实验室宽敞且设备齐全，图书馆是睿魔尔家族在塞奥里斯之外最好的。公共区域既豪华又令人生畏。沉重的木制家具上垫着刺绣金丝绒。香烟的甜味从许多铜香炉中飘散出来。挂毯上描绘着睿魔尔、埃特里乌斯和格拉崔克斯不满地注视着房间的居住者，而巨大的鹿角、野猪头和其他战利品则遍布整座建筑。\n维也纳没有塞奥里斯那样复杂的保护措施，但地面上仍布满了巧妙的陷阱。"
 POD_travel_events.12.a: "篡位者的后备计划。"
 POD_travel_events.12.b: "一处远离我们敌人的宁静之地。"
 POD_travel_danger_events.13.success: "击败他们了！"
 POD_travel_danger_events.13.wound: "艰难的胜利。"
 POD_travel_danger_events.13.failure: "代价高昂的逃脱……"
 POD_travel_events.13.t: "$travel_danger_prefix$狼人埋伏！"
 POD_travel_events.13.desc: "森林是狼人的地盘，虽然你尽可能地维持隐匿，那些过度生长该死的狼还是设法追踪到你的味道。幸运的是你对此情形早有准备，并不全然措手不及。\n不过，它们是强大的生物，比你更适应在森林里战斗。这场战斗将并非易事。"
 POD_travel_events.13.a: "坚守阵地！"
 POD_travel_events.13.b: "那边那个你，保护我！"
 POD_travel_danger_events.14.success: "他们让你通过！"
 POD_travel_events.14.t: "$travel_danger_prefix$逡巡的猎人们"
 POD_travel_events.14.desc: "虽然你尽可能地在旅途中维持隐匿，看来你旅队的传言已经被一群有进取心的猎人听到了。他们已经封锁了在你必经之路上的桥梁，不过幸运的是，他们并不确定拦到谁（或什么怪物）。\n你不是显而易见的攻击目标，这给你机会来欺骗他们，也许可以在此过程中避战。"
 POD_travel_events.14.a: "在他们做出反应之前冲锋！"
 POD_travel_events.14.b: "你，去处理他们。"
 POD_travel_events.14.c: "我们只是路过的卑微商人……"
 POD_travel_events.15.t: "$travel_danger_prefix$疯先知"
 POD_travel_events.15.desc: "一个蓬头垢面显然神志不清的人已经跟随你的车队一段时间了。他持续吐出关于火焚末日、怒嚎末日、升华、最终审判和诸如此类的疯言疯语。\n你尽力赶走他的努力也失败了，甚至诉诸暴力也只是让他稍后带着更多厄运与绝望的演说回来。\n你的旅队开始不满持续不断的末日胡扯，迫使你考虑如何应对。"
 POD_travel_events.15.a: "来对我说吧。"
 POD_travel_events.15.b: "别理那疯子。"
 POD_travel_events.15.c: "我也有自己的预言！"
 POD_travel_events.16.t: "$travel_danger_prefix$寂静城镇"
 POD_travel_events.16.desc: "自从进入此区域后，在旅行计画中预计经过的古怪小镇谣言便传到你的车队。当地人提到一个不洁可憎之物统治那里的夜晚，迫使镇民祈祷黎明尽速降临。\n随着你的接近，谣言愈加具体，你的随行人员也向你分担不安。他们争论著小小地改道而不是冒险踏入那个受诅的小镇并激怒在那统治本体不明的东西。"
 POD_travel_events.16.a: "我才不怕鬼故事！"
 POD_travel_events.16.b: "好，我们改道。可不是说我怕了……"
 POD_travel_events.16.c: "我能感知到一位血族的灵魂！"
 POD_travel_events.17.t: "$travel_danger_prefix$凡人间的战争"
 POD_travel_events.17.desc: "无知的凡人们基于不值一提的理由在此区域发动了战争。尽管你不关心，但冲突的军队所带来的破坏，遇到交战人员的风险，都将影响你的旅行计画。一个简单的选择是绕远路，希望能借此避免所有正在交战中的凡人。你也可以雇用比预定计画更多的当地向导，毕竟他们更擅长找到安全的替代路线。\n最非常规的解决方案是与你的随行人员一同参战，一个耗时但可能颇具启发性的选择，借此观察凡人的最新战略。"
 POD_travel_events.17.a: "我们避开他们就是。"
 POD_travel_events.17.b: "雇用更多当地人加快速度。"
 POD_travel_events.17.c: "一场战争？让我也加入！"
 POD_travel_events.18.t: "$travel_event_prefix$在夜之伪装下"
 POD_travel_events.18.desc: "对于血族来说，长途跋涉是一件苦不堪言的事情，因为阳光具有强大的威慑力。如果你试着在白天移动，你必须要有一些非常特别（且可疑）的藏身设备，以确保你的休息处完全防晒，并且只能由那些真正能忍受日光的弱小仆人来保护。如果你只在夜间移动，你可能会引起更多不必要的注意，并且需要考虑那些白日活动仆人的睡眠时间……\n这个问题没有简单的解决方法，与血族同行的旅程比没有血族的更容易耗时，就算有充分的事前准备也是如此。"
 POD_travel_events.18.a: "就这样吧。"
 POD_travel_events.18.b: "向前推进！加速！"
 POD_travel_events.19.t: "$travel_event_prefix$古埃及风格"
 POD_travel_events.19.desc: "身为木乃伊，你已经活了很长一段时间，并且见识（甚至可能领导）了伟大的古代文明。过去世界的盛况和辉煌与这些“黑暗时代”的阴暗形成了鲜明的对比。当你走过这片土地时，宣告你光荣头衔的音乐家、游行队伍和演说家在哪里？那些糟透的马车究竟是打算造成什么样子的？根本比不上你的黄金战车！\n你突然想推迟当前的旅行，直到你能够重现过去的辉煌。这是一项耗资巨大且漫长的努力，但你真的想向当代人展示一个真正的法老如何旅行。"
 POD_travel_events.19.a: "取我的三重王冠来！"
 POD_travel_events.19.b: "……强烈的怀旧感涌上我心头。"
 POD_travel_events.20.t: "$travel_event_prefix$人民的猎人"
 POD_travel_events.20.desc: "身为所有伤害人类的可憎之物的猎人，你的使命必须誓以秘密。你所保护的民众如果知道威胁隐藏在每个角落将会恐慌。如此隐密行事也造成一些问题，许多民众误以为你是什么教会当局，在你路过时向你倾诉他们目前、通常十分凡俗的问题。\n你知道如何伸张正义，但这也会相当拖延你与超自然更紧迫（而且更重要）的战斗。"
 POD_travel_events.20.a: "我会聆听，并且裁决。"
 POD_travel_events.20.b: "邪恶的爪牙可不会等我。"
 POD_travel_events.21.t: "$travel_event_prefix$狼群会面"
 POD_travel_events.21.desc: "按照传统，旅行时的狼人应该能够在当地的圣地栖身，只要他们尊重当地居民的权威和习俗。他们也不该停留太久，因为狼人是领域性生物，不喜欢潜在的竞争。你的斥侯注意到附近有一个圣地，可以作为潜在的友好庇护所。这可能会耽误旅行一段时间，但与当地狼人一起体验狼族传统会对你和你的同伴产生良好的影响。"
 POD_travel_events.21.a: "我们能分享你们的篝火一段时间吗？"
 POD_travel_events.21.b: "没时间耽搁了。"
 POD_travel_events.22.t: "$travel_event_prefix$你的小镇地狱"
 POD_travel_events.22.desc: "旅行为你的同类和他们的仆人带来了机会。这是一种发现小而偏僻村庄的方法，这些村庄几乎不被当局意识到存在。这些易于腐化的猎物是无聊的长途旅行中轻松的消遣。显然这会耽误你的旅行一段时间，但最终满足自我难道不值得一切吗？"
 POD_travel_events.22.a: "我将展现给你的喜悦是……"
 ghouled_entourage_option: "血仆化随从"
 ghouled_entourage_option_desc: "吸血鬼在旅途中需要一个强大又忠诚的随从人员，毕竟他们无法在日间活动。血仆会是很好的选择。"
 mummies_grandeur_option: "法老的旅行"
 mummies_grandeur_option_desc: "木乃伊记得他们还是法老的时候与随从旅行，其宏伟排场能让今时的小国王为之脸红羞愧。有时候，他们想带回那个时代。"
 werewolves_umbra_option: "月桥"
 werewolves_umbra_option_desc: "狼人可以使用传说中跨越[umbra|E]的月桥来旅行。在许多实例中，比之于凡间道路要来得迅速安全。"
 spread_cults_option: "传播密教"
 spread_cults_option_desc: "旅行给你一个将密教的忠诚成员渗入至经过的当地村庄与城镇的机会。这会稍微延迟你的行程，但增强你的影响力绝对是有益的。"
 POD_travel_events.23.t: "翁布，赛特之眼"
 POD_travel_events.23.desc: "从远处看，翁布看起来像是一片土丘，几根倒塌的柱子和残片墙壁，不过如此。曾经的赛特崇拜的中心的遗迹所剩无几。当你穿过星光照耀下的废墟时，一位男人从一座受侵蚀的方封墓后面走出来。他身穿一件简单的黑袍，手持着古埃及祭司的测量杆。“欢迎来到赛特之家。”\n你在沙漠中行走了近一个小时，直到一个孤零零的塔门在你面前升起。“伟大的赛特就在那边等待。笔直向前走，你会来到他的面前。他会亲自回答你的问题。”\n你从未见过星星在暗淡月光下如此明亮。岩石的突出部分在银色的沙漠上投下不透明的阴影。然而，你没有投下任何影子，在沙滩上也没有留下脚印。你注视着地平线上的一颗星星，数到一千，重数三次。它没有移动。\n是否时间本身也害怕强大的赛特？你不知道，但如果继续朝着地平线走去，你可能很快就会知道……"
 POD_travel_events.23.a: "必胜的赛特，请听我祷告。"
 POD_travel_events.23.b: "我感觉到有什么东西或什么人……"
 POD_travel_events.24.t: "舍伍德，叛逆之巢"
 POD_travel_events.24.desc: "一片位于埃里沃什河和东德比郡森林以西的大型皇家狩猎森林，舍伍德是诺曼入侵后贵族们最喜爱的狩猎场所。然而，它真正崭露头角的时刻是当它成为著名的罗宾·李兰德的根据地之后。\n虽然这人的起源是神秘的，但罗宾一直与暴君斗争。他坚毅而粗犷的面容在几次平民起义中得以见证——他直接参与了对英格兰贵族的各种农民起义，尤其是极力主张无政府主义，在军事冲突中常常站在前线作战。\n他的“大橡树”，一棵巨大的树木，位于森林中心，他以此为庇护所，如今几乎成为潜在自由斗士们朝圣的地点，希望在“罗宾汉”的指引下获得智慧。"
 POD_travel_events.24.a: "打倒暴君！"
 POD_travel_events.24.b: "奇特的景象。"
 POD_travel_events.25.t: "爱之庭"
 POD_travel_events.25.desc: "即使在众多声望卓著的爱之庭中，萨莉安娜的宫廷被认为是最奢华的。这些“晚会”通常在历史悠久的地点举办，是展示智慧或武艺的场所。这些表演的最终目标始终是一样的，娱乐巴黎女王并赢得她宝贵的青睐。\n在冬季，宫廷更加注重政治，举办地点在萨莉安娜的庄园里，这个地方的曲折和转折有利于阴谋家和八卦者发挥他们的手腕。宫廷上的一切都受到“美丽而无情的贵妇们”（Belles Dames sans Merci）的调控，她们是四位高雅的贵妇，凭借几句挑剔的话语就能摧毁任何放肆的该隐之子的声誉。\n萨莉安娜的爱之庭，虽然比伊思妲的要温和一些，但仍不适合胆小怕事之人，许多抱有希望的新生吸血鬼在这场（慈悲而常常无声的）权力博弈中被碾压。"
 POD_travel_events.25.a: "我需要效仿！"
 POD_travel_events.26.t: "特亚维神龛"
 POD_travel_events.26.desc: "特亚维是亡者的守护者，同时也是被称为事物创造者的铁匠神。流行的立陶宛信仰认为，铁匠与世界的基本元素——气、火、水和地——一起运作，按照自己的意愿塑造它们，因此成为铁匠不仅是向神灵致敬的一种方式，也是以有限的方式了解成为神灵的感受。特亚维使死者的灵魂重生，将它们作为原材料创造出暗影之林的金属叶子。\n为了做到这一点，一个灵魂会以小人（人造人）的形式出现在他的铁砧上。特亚维会用钳子抓住灵魂，将其投入火中。小人会痛苦地尖叫，但当铁匠将钳子从火中取出时，他会持有一块热腾腾的金属，准备进行打造。铁匠会将金属放在铁砧上，用锤子敲打，每一锤下都会喷出蒸汽般的鲜血，沿着沟槽流动，并落入下方的孔洞中——填满附近的一片广阔的血海。整个过程结束时，一个完美的金属叶子会出现，并被风带到暗影之林中。\n特亚维最著名的信徒是被称为特亚维派睿魔尔的血系，他们激烈地保护着暗影之林。"
 POD_travel_events.26.a: "一位强大的神明和一座强大的魔法场所。"
 POD_travel_events.26.b: "奇特的景象。"
 POD_travel_events.27.t: "陵墓，威尼斯的死亡之心"
 POD_travel_events.27.desc: "“你是否了解威尼斯，来访者？”你的导游眼神突然变得冰冷，声音也同样冷漠。“那么，请仔细听好。”\n“在威尼斯，诺斯费拉图隐藏在下水道和运河中，希望上方的目光不会发现他们。梵卓与旅行商人一同来到这里，他们打算建立栖身之地，但他们不会停留很久。威尼斯，来访者，属于乔凡尼家族。”\n“乔凡尼家族无人可敌。其他吸血鬼在这里只能容身于他们的允许下，否则根本无法在此居住。威尼斯的夜晚没有明显的冲突，因为乔凡尼不允许它发生。他们是一个家族，来访者，也是一个氏族。几个世纪以来，他们一直在这里居住，他们的祖居腐朽在家族的庄园里，在大学、银行和放债人那里。他们了解死亡之外的秘密，来访者，因为他们的整个帝国都建立在死者的背上！”\n“总有一夜，一个可怕的夜晚，他们将打开通向禁土的大门，威尼斯将成为世界，乔凡尼终将成为一片死寂的土地的主人。”"
 POD_travel_events.27.a: "是时候向“家族”致敬了。"
 POD_travel_events.27.b: "谣传罢了……对吧？"
 nosferatu_hajj_option: "朝觐"
 nosferatu_hajj_option_desc: "哈吉是[Glossary('阿什拉派','game_concept_ashirra_desc')]中狂热的诺斯费拉图群体，他们自视为伊斯兰圣地与朝圣者的守护者。"