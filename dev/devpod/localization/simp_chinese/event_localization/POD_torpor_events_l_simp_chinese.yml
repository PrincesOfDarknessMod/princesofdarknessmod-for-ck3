l_simp_chinese:
 POD_vampire_torpor_events.001.title: "深眠"
 POD_vampire_torpor_events.001.desc: "你的伤口让你变得虚弱，现在你感到自己受到一种奇怪的拉扯，该拉扯迫使你陷入[Glossary('蛰眠','game_concept_torpor_desc')]，该深眠可以持续几千年之久。"
 POD_vampire_torpor_events.001.resist: "我将抵抗！"
 POD_vampire_torpor_events.001.resist.fight: "你将尝试抵抗陷入[Glossary('蛰眠','game_concept_torpor_desc')]。你的伤口和饥渴等级将对此决定有重大的影响。"
 POD_vampire_torpor_events.001.surrender: "我不会抵抗……"
 POD_vampire_torpor_events.001.surrender.surrender: "你自愿的陷入[Glossary('蛰眠','game_concept_torpor_desc')]。这将强制你退位。"
 POD_vampire_torpor_events.101.title: "永眠"
 POD_vampire_torpor_events.101.desc: "你已经没力量带着这么严重的伤口继续亡生了，是时候长眠了。你只希望在你[Glossary('蛰眠','game_concept_torpor_desc')]期间没发生任何事情。"
 POD_vampire_torpor_events.101.defeat: "将陷永眠。"
 POD_vampire_torpor_events.101.defeat.sleep: "你将陷入[Glossary('蛰眠','game_concept_torpor_desc')]，退位给你的继承人"
 POD_vampire_torpor_events.201.title: "拒绝蛰眠"
 POD_vampire_torpor_events.201.desc: "你抵抗住了。莫名软弱的感觉消退了，而你在长眠前还有事要做。"
 POD_vampire_torpor_events.201.success: "我的工作还没有完成。"
 POD_vampire_torpor_events.201.success.victory: "你将暂时不进入[Glossary('蛰眠','game_concept_torpor_desc')]。"
 POD_vampire_torpor_events.002.title: "永恒亡生"
 POD_vampire_torpor_events.002.desc: "你的亡生已经延续了好几百年，你开始对这个时代感到厌倦了，也许是时候长眠了？吸血鬼的亡生是漫长又持久的，因好友来了又走而痛苦，而凡人的变化如此之快，他们很快地就陌生于你。\n也许下一个时代会更好……但很可能不是。"
 POD_vampire_torpor_events.002.resist: "我还有事要做。"
 POD_vampire_torpor_events.002.resist.nosleep: "你还没准备好去长眠。"
 POD_vampire_torpor_events.002.rest: "我觉得是时候长眠了。"
 POD_vampire_torpor_events.002.rest.sleep: "你自愿的陷入[Glossary('蛰眠','game_concept_torpor_desc')]。这将强制你退位。"
 POD_vampire_torpor_events.102.title: "没时间长眠"
 POD_vampire_torpor_events.102.desc: "你还没准备好进入[Glossary('蛰眠','game_concept_torpor_desc')]，还有许多凡人需要你亲自问候，而你的敌人还该因恐惧而颤抖更多的一小段时间。"
 POD_vampire_torpor_events.102.resist: "我还有情况要关注。"
 POD_vampire_torpor_events.102.resist.nosleep: "你将不进入[Glossary('蛰眠','game_concept_torpor_desc')]……目前而言。"
 POD_vampire_torpor_events.202.desc: "你已经醒了这么久了……是时候长眠了，敌人可以等。也许下一个时代将是应许的黄金时代……或者是可怕的火焚末日。但你已经足够老了，知道这可能是另一个无聊而漫长的时代，人类总会把事情搞得一团糟……"
 POD_vampire_torpor_events.202.title: "永眠"
 POD_vampire_torpor_events.202.accept: "将陷[Glossary('蛰眠','game_concept_torpor_desc')]。"
 POD_vampire_torpor_events.202.accept.sleep: "你将自愿陷入[Glossary('蛰眠','game_concept_torpor_desc')]"
 POD_vampire_torpor_events.003.title: "苏醒"
 POD_vampire_torpor_events.003.desc: "你已经陷入了[Glossary('蛰眠','game_concept_torpor_desc')]一小段时间。是不是时候让你回到亡生了？"
 POD_vampire_torpor_events.003.awake: "是时候回归了。"
 POD_vampire_torpor_events.003.awake.torpor: "你将从[Glossary('蛰眠','game_concept_torpor_desc')]中苏醒，而你的敌人应当因此惧怕"
 POD_vampire_torpor_events.003.sleep: "我还没准备好。"
 POD_vampire_torpor_events.003.sleep.nowake: "你将继续[Glossary('蛰眠','game_concept_torpor_desc')]一小段时间"
 POD_vampire_torpor_events.103.title: "永眠"
 POD_vampire_torpor_events.103.desc: "你还没准备好回归。"
 POD_vampire_torpor_events.103.sleep: "美梦。"
 POD_vampire_torpor_events.103.sleep.continue: "你将继续休眠。"
 POD_vampire_torpor_events.203.title: "回到亡生"
 POD_vampire_torpor_events.203.desc: "你终于准备好回归，你的敌人应当因此颤抖"
 POD_vampire_torpor_events.203.awake: "我回来了"
 POD_vampire_torpor_events.203.awake.torpor: "你回到了黑暗世界"