l_simp_chinese:
 pod1230objectives_wraith.1.t: "超脱"
 pod1230objectives_wraith.1.desc: "超脱从本质上讲就是接受自己的死亡。从历史上看，摆渡人、彼岸和冥秩都是实现超脱的方法。命运女神赋予卡戎的使命是帮助最终进入冥界的灵魂实现超脱并继续前进。\n超脱从本质上讲就是接受自己的死亡。必须解除那些将幽灵束缚在冥界的炽情和羁绊。如果它们都解除了，那么幽灵必须寻求某种与黯影共处的存在形式。"
 pod1230objectives_wraith.1.a: "自由 "
 death_transcendence: "这个角色超越了死亡，终于获得了彼方的自由"
 pod1230objectives_wraith.2.t: "死而复生"
 pod1230objectives_wraith.2.desc: "返生者是用来描述一个设法回到自己的身体，重新在皮囊之地的生者间行走的死灵。总结来说，返生者几乎是僵尸，但没有缓慢的步态、腐烂的肉体或需要吃大脑。成为返生者是幽土最严密的秘密之一；然而，如果有足够的助力的话，这是可以实现的。\n对于任何想回到生者之地的死灵来说，这可能是最明智的可能，尽管并非没有缺点和挑战。"
 pod1230objectives_wraith.2.a: "重生"
 pod1230objectives_wraith.2.a.tt: "你将重生，仿佛自你死亡以来的一切都只是幻梦。"
 pod1230objectives_wraith.2.b: "返生者之身"
 pod1230objectives_wraith.3.t: "尸幕守护"
 pod1230objectives_wraith.3.desc: "乔凡尼家族已被清除，他们摧毁尸幕的计划已成泡影。他们的灰烬作为警告，警示任何试图亵渎冥河城神圣的生者或死灵。然而，作为冥秩的执法者，你的工作永不停息。总会有愚蠢之人违反亡者律令，而你将永远在那里让他们后悔。"
 pod1230objectives_wraith.3.a: "尸幕在我的保护之下。"
 the_enforcer_of_dictum_mortuum: "亡者律令的执法者"
 the_enforcer_of_dictum_mortuum_desc: "你将能够使用死灵建筑。"
 pod1230objectives_wraith.4.t: "亡者律令的终结"
 pod1230objectives_wraith.4.desc: "卡戎已经投降，亡者律令不复存在，现在你可以随心所欲地与任何生者互动"
 pod1230objectives_wraith.4.a: "让我们收拾这个烂摊子"
 pod1230objectives_wraith.4.b: "把它们全部烧掉！"
 pod1230objectives_wraith.4.c: "我是新皇帝！"
 the_gravedigger_of_dictum_mortuum: "亡者律令的墓穴掘墓人"