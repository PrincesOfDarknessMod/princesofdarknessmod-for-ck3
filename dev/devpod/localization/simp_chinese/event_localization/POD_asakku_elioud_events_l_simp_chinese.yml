l_simp_chinese:
 POD_asakku.0205.t: "一桩奇特的调查"
 POD_asakku.0205.desc: "你的间谍总管带来消息，说有一位陌生人在巴库附近的宫廷中打听情况。问得很具体。只有知道该找什么的人才会问出那种问题。那人一直在打听[GetTrait('vicissitude').GetName(GetNullCharacter)]的事。"
 POD_asakku.0205.a: "找到他们。"
 POD_asakku.0205.b: "安排一场意外。"
 POD_asakku_reveal_elioud_tt: "The nearest Elioud's identity and location will be revealed."
 POD_asakku_assassinate_elioud_tt: "You may begin a scheme against the nearest Elioud."
 POD_asakku.0210.t: "The Phalanx: Warning"
 POD_asakku.0210.desc: "They are coming in numbers. Not an assassin but a team. Your spymaster counts at least three, moving together with the kind of discipline that suggests a lifetime of this kind of work. They know where your haven is and, more importantly, they know what you are. A name surfaces from your informants, an [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] hunter your network has flagged before.\n\nPatient. Methodical. Dangerous."
 POD_asakku.0210.a: "为其做好准备。"
 POD_asakku.0211.t: "The Phalanx: The Assault"
 POD_asakku.0211.desc: "They hit the haven at the hour before dawn. The [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] hunter leads from the front. The mark of someone who believes what they are doing. The others hold the exits.\n\nYou have seconds to choose how you meet this."
 POD_asakku.0211.a: "Meet them with everything you have. #weak (Prowess)#!"
 POD_asakku.0211.a.success: "Their leader breaks first. The others scatter. You stand in the wreckage of your own haven and feel, strangely, something like satisfaction, though you are no longer certain whether it is yours."
 POD_asakku.0211.a.success.desc: "其领袖崩溃，其他人四散而去。"
 POD_asakku.0211.a.wounded: "你击退了他们，但猎人在撤退前还是让你挂了彩。他们会回来的。不过今夜，你活了下来。"
 POD_asakku.0211.a.wounded.desc: "你驱使他们撤退。"
 POD_asakku.0211.a.grave: "They nearly had you. The Elioud hunter leaves with something to show for the effort. You are alive, but the cost was severe."
 POD_asakku.0211.a.grave.desc: "They nearly had you"
 POD_asakku.0211.b: "Use the network against them. #weak (Intrigue)#!"
 POD_asakku.0211.b.success: "You feed false intelligence through the infected, draw the kamut into the wrong haven, and disappear before they realize. By the time they regroup, you are three streets away, watching them explain to each other what went wrong."
 POD_asakku.0211.b.success.desc: "The deception succeeds"
 POD_asakku.0211.b.failure: "The deception collapses. The hunter has seen this before or something like it. You escape, but barely, and they know exactly how you think now."
 POD_asakku.0211.b.failure.desc: "The deception collapses"
 POD_asakku.0211.c: "Vanish. Let them find nothing. #weak (Flee)#!"
 POD_asakku_phalanx_vanish_tt: "You abandon the haven and disappear. You will survive, but the Elioud will know you fled and the connection to the Asakku frays under the weight of fear. Lose 5 Depth and gain the Hunted modifier."
 POD_asakku.0212.t: "The Phalanx: Aftermath"
 POD_asakku.0212.desc.fight_clean: "The Phalanx came. You survived. You sit, trying to learn from what happened. They knew what they were looking for. They had names for it, protocols, years of practice identifying the thing that rides in the blood of others. They came for you specifically, and they were competent, but they still lost.\n\nOne of them, dying, looked at you without hatred. Not without fear but with something more like exhaustion. This was work to them. Necessary work. The question, when it came, was not an accusation.\n\n'Is it still you in there?'\n\nYou did not answer. You are afraid of what the answer would have been."
 POD_asakku.0212.desc.fight_wounded: "The Phalanx came. You drove them back. You sit alone with what the night cost you. They knew what they were looking for. They had names for it, protocols, years of practice. They drew blood before retreating, and you spent the hours before dawn assessing the damage, wondering what was lost, what would heal, what might not.\n\nThe entity within you was not troubled by any of it. Perhaps it was convinced of your ultimate victory. Or perhaps it didn't care."
 POD_asakku.0212.desc.fight_grave: "The Phalanx came. You survived barely. You sit, slowly detaching yourself from the tempest to assess what truly happened. They knew what they were looking for. They had names for it, protocols, years of practice. They almost had you.\n\nIn the moments before the tide turned, there was a stretch of time you cannot account for. A gap where something else was operating the body you call yours. You are alive. You are not entirely sure which of you to thank for that. Perhaps you should worry more about this than you end up doing."
 POD_asakku.0212.desc.outmaneuvered: "The Phalanx came. You survived and more than survived. You sit, wondering what the night revealed about them and, more importantly, about yourself. They knew what they were looking for. They came for you specifically, with names and protocols and years of practice.\n\nYou fed them false intelligence through the infected. They hit the wrong haven, found nothing, and spent the better part of an hour trying to understand what had gone wrong. You felt the entity's attention sharpening alongside yours, not directing you, but watching. Interested.\n\nYou also think you were pleased by the results. Or maybe it was pleased? You wonder where the line is drawn nowadays, if it even exists anymore."
 POD_asakku.0212.desc.intrigue_failed: "The Phalanx came. You survived but not as you intended. You sit, your narrow escape finally over and letting you time to (mentally) breathe. They knew what they were looking for. They had names for it, protocols, years of practice. Tonight they added something new to that list: the way you think.\n\nThe deception collapsed faster than it should have. You escaped, but barely and by the time you had cleared the haven you understood what had changed. They know how you think now. They know how the entity moves through you, how it uses your connections, how it routes intelligence. That kind of knowledge does not expire. They will use it."
 POD_asakku.0212.desc.fled: "The Phalanx came. You survived at a cost that has not finished being counted. You sit with what left and the memories of tonight's events. They knew what they were looking for. They had names for it, protocols, years of practice identifying the thing that rides in the blood of others. Tonight you gave them nothing to find.\n\nYou abandoned the haven and moved fast, without sentiment, without looking back. The voice in your blood was silent the entire time. Not approving the decision. Not opposing it. Simply present, the way a tide is present. Patient in a way that has nothing to do with forgiveness. For one that might have witnessed the beginning of all things, your petty \"immortality\" is a drop in an ocean."
 POD_asakku.0212.a: "还是我。大体上还是。"
 POD_asakku.0212.b: "我们赢了。但我仍在思量，这个词用得是否恰当。"
 POD_asakku.0212.c: "他们现在知道我怎么想了。它也是。"
 POD_asakku.0212.d: "我做出了正确的选择。"
 POD_asakku.0215.t: "东方阴影"
 POD_asakku.0215.desc.base: "The western dominions are broken. The kamuts that hunted you across Christendom have been silenced. But the entity within you does not rest, and it does not permit you the comfort of believing the work is finished. The east, where it all began, remains. The traitor scribe that once stopped you, Yamadanda's tradition did not die with him. It was inherited, refined, sharpened by hands that never knew the original smith but understood the purpose of the blade.\n\nTwo names surface from the intelligence your blood carries. Figures operating in the eastern reaches of the True Hand, each dangerous in a way the western hunters were not. The western Elioud were soldiers. These are something else. They know they are the last wall before something terrible, perhaps even more terrible than Gehenna.\n\nBefore you."
 POD_asakku.0215.desc.mokhadaji: "\n\nThe first is Mokhadaji Ranpur. A Nagaraja prince from the Bengali foothills who has spent two centuries compiling dossiers on the corrupted. Where the western Elioud struck with iron and fire, Mokhadaji works with ink and patience. He catalogues. He cross-references. He maps the shape of your infection across courts and bloodlines with the precision of a scholar annotating scripture. He has never raised a weapon against you. He has done something worse: he understands you.\nThe first traitor, Yamadanda, was a scribe himself. You know all too well to not underestimate these men of the word."
 POD_asakku.0215.desc.nattadevi: "\n\nThe second is Nattadevi. They call her the Red Finger in the eastern dominions. Where Mokhadaji maps, she cuts. A field operative whose interference with your operations has been surgical, targeted, and infuriatingly effective. She does not compile dossiers. She acts, moving through your network with the certainty of someone who knows exactly where every thread connects."
 POD_asakku.0215.a: "现在我知道他们的名字了。"
 POD_asakku.0220.t: "最终结算"
 POD_asakku.0220.desc.base: "Word comes from Enoch. The Del'Roh has issued a directive. The language is clinical: a 'spiritual contagion' has been identified in the Caucasus. They do not name you.\n\nThey do not need to."
 POD_asakku.0220.desc.pietro_asakku: "One of the kamuts they have designated is no longer available. You know where he is. He is in your court, looking out through different eyes. A foe has become an ally, like they all will in the end."
 POD_asakku.0220.a: "让他们来吧。"
 POD_asakku.0401.t: "阶段完成：灵魂感染"
 POD_asakku.0401.desc: "The seeds are planted. The infection moves through Vicissitude the way fire moves through dry wood. Your court holds carriers. Your network holds carriers. Like the disease it perhaps is, you have started to lose track of how many might or might not be infected.\n\nThe voice within you is pleased, though 'pleased' implies an emotion it does not quite possess. What it has is recognition: this stage of the work is complete. The voice has done this before, perhaps, in courts and rooms and centuries that have passed beyond your memory but not, you suspect, beyond its own.\n\nYou are no longer alone in the work. You have not, in truth, been alone in anything for a very long time."
 POD_asakku.0401.a: "加深根基。"
 POD_asakku.0401.b: "继续扩大。"
 POD_asakku_phase1_deepen_tt: "与阿萨克的联系加深。获得#bold 5深度#!。"
 POD_asakku_phase1_spread_tt: "感染加速。获得#bold 更广泛传播#!修正，持续10年，提高计谋成功率并降低被发现的风险。"
 POD_asakku.0402.t: "阶段完成：蔓延之污"
 POD_asakku.0402.desc: "The Elioud came for you, and they failed. Whatever the cost, measured in burnt havens, in vassals who did not survive the night, in plans that had to be remade in the dark. You remain. The kamut that the Wazir chose for your specific destruction is dead, dispersed, or wearing your face in their reports.\n\nThe Blood Inception has given you converts. Hands in courts you have not visited. Eyes in rooms you have never seen. Mouths that speak in your voice when they speak about anything that matters, and in their own voices when they speak about anything that does not.\n\nThe entity rewards loyalty in the only currency it understands: more of itself. You have begun, perhaps, to suspect that the bargaining was a courtesy."
 POD_asakku.0402.a: "Consolidate the network."
 POD_asakku.0402.b: "乘胜追击。"
 POD_asakku_phase2_consolidate_tt: "Fortify your position. Gain the #bold Consolidated Network#! modifier, reducing enemy scheme success and slowing hostile operations against you."
 POD_asakku_phase2_press_tt: "Strike while they reel. Gain the #bold Press the Advantage#! modifier, increasing hostile scheme power and reducing discovery risk."
 POD_asakku_war_forms_unlocked_tt: "Unlock #bold Asakku War-Forms#! as a recruitable Men-at-Arms regiment. Fleshcrafted ghouls shaped by the entity's will."
 POD_asakku.0403.t: "清除西方篡位者"
 POD_asakku.0403.desc: "The western reach of the Shadow Crusade is finished. The kamuts who hunted you from Constantinople to Zaragoza to the Caucasus, the safehouses they used, the dominions that briefed them, the chains of intelligence that fed them targets, all gone. Dead, where killing was efficient. Changed, where changing was useful. Hollowed and continued in their old roles, where the deception promised more than the killing would have offered.\n\nThe Del'roh has made her peace with the loss in whatever manner she chooses to call peace. The eastern dominions move with renewed urgency. The True Hand continues. The Hand always continues.\n\nYou continue also, with the voice guiding you to a triumph that will come in this life or the next."
 POD_asakku.0403.a: "向东"
 POD_asakku.0404.t: "守望者之声"
 POD_asakku.0404.desc: "You are no longer certain when you last had a thought that was entirely your own. The uncertainty is not, as it would once have been, distressing. It is simply the state of things. Whatever was in that well has been with you since the Sighing Lion turned its prow back toward the upper world, and you have come to understand that 'possession' is not the right word for what has happened in the centuries since.\n\nTzimisce who Embraced you understood this, in their own way. The koldun in their towers sometimes glimpsed it. The entity has always been a participant in the discipline they call Vicissitude, perhaps the original participant, perhaps the only one whose participation truly matters, and the participation is not truly predation. It is co-authorship. The author has simply been patient about taking credit.\n\nYou did not lose yourself. You became something that contains both. The seam where the two of you meet has dissolved, and the dissolution is not, as you once feared, the death of one party. It is the becoming of a third.\n\nSomewhere in the back of your thoughts, a name waits. You have spent a thousand years pretending you did not hear it. The pretense does not, in this moment, seem like it can be sustained much longer. But tonight is not the night you speak it. Not yet."
 POD_asakku.0404.a: "还没有。但快了。"
 POD_asakku.0405.t: "东方清算"
 POD_asakku.0405.desc.base: "The east is done. Yamadanda's tradition ends here, not with scholars and iron needles and carefully chosen inheritors, but with fire or blood and your victory. The Wazir's eastern dominions have been silenced. The cells they cultivated have been disbanded by the simple expedient of having no one left to report to. The libraries in Enoch still hold his writing but no one is left to read them.\n\nThe Elioud are gone. The True Hand continues, the Hand always continues, but it continues diminished, puzzled in a way it has not been since the Long Night, missing members it cannot fully account for. \n\nWhat remains is the Watcher. What remains is the work. The work is at the edge. You are at the edge. It is a long way from the high pastures above the temple where you first learned the proper way to part flesh from bone, but you have been walking it since before you understood you were walking."
 POD_asakku.0405.desc.both_converted: "Mokhadaji and Nattadevi. The Nagaraja prince in the foothills who has compiled dossiers on you for two centuries. The Red Finger who has run interference against your operations. They sit in your court now, both of them, looking out through eyes that are not entirely their own. They listen for the voice your blood carries, the part that takes its instruction in the gaps between your words.\n\nThey were your most patient enemies. They are now, perhaps, your most useful instruments. Yamadanda, wherever he has gone, would find this either magnificent or unbearable. He is no longer in a position to choose between the two."
 POD_asakku.0405.a: "已经结束了。"
 POD_asakku.0406.t: "残余之物"
 POD_asakku.0406.desc: "You sit in the small hours of the morning and find yourself thinking about the founder himself. [yamadanda.GetName] has been gone for at least a thousand years. The official record names neither destruction nor the dignified torpor of an elder who has chosen to set the world down for a while.\n\nThe Elioud he flayed and rebuilt were just means to an end. With the hand broken, the end remains. The libraries in Enoch still hold his recitations. The protocols still circulate, even with no cell left to act on them. And somewhere, in some chamber or some long quiet labyrinth of the Tempest, the magus himself. The yamasattva, the soul bound into a body older than most empires, is still listening.\n\nYou do not know whether the destruction of his Elioud will reach him. But the voice in your blood is alert in a way it has not been since the Phalanx came. It has noticed something. It will not yet tell you what.\n\nYou have closed the eastern wound. You have not, perhaps, closed the book."
 POD_asakku.0406.a: "那我们也会等待。"