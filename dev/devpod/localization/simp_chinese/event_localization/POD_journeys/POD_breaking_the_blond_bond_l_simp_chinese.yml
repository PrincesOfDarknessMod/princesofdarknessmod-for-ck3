l_simp_chinese:
 POD_breaking_the_blond_bond.1.t: "削弱血缚"
 POD_breaking_the_blond_bond.1.desc: "你做到了，曾经那份深沉的爱与眷恋已化为一丝淡淡的好感。从此，你可以伤害那个曾被你视为永恒主宰的人了。但这绝非易事，毕竟如此强烈的依赖并非一日可除——但至少你已勇敢迈出了第一步。\n\n#weak 你只需忽略心中那噬人的空虚感……#!"
 POD_breaking_the_blond_bond.1.a: "我感到迷茫……"
 POD_breaking_the_blond_bond.1.a.tooltip: "接下来的#V 10#!年内，你将能够使用[character_interaction|E]以[modifier|E]的代价逃离，亦或直接杀死你的[Glossary('侍主','game_concept_domitor_desc')]。#X 如果你完成了任何[bound_ghoul_mission_with_icon|E]，整个旅程将立即被取消。#!"
 POD_breaking_the_blond_bond.2.t: "血缚已回归"