l_simp_chinese:
 POD_journey_maintenance.1.t: "[Localize(Concatenate(PlayerJourneyID,'_planning_title'))]"
 POD_journey_maintenance.1.desc: "[Localize(Concatenate(PlayerJourneyID,'_planning_desc'))]"
 POD_journey_maintenance.1.option.a: "[Localize(Concatenate(PlayerJourneyID,'_planning_confirm'))]"
 POD_journey_maintenance.1.option.a.tt: "[Select_CString( GetScriptedGui('POD_can_start_travel_phase_sgui').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).End), Localize('POD_journey_maintenance.1.option.a.tt.default'), GetPlayer.Custom('PODCoterieTravelStatusGUI') )]"
 POD_journey_maintenance.1.option.a.tt.default: "$EFFECT_LIST_BULLET$你立即开始该[journey|E]的[travel_phase|E]。\n[GetPlayer.Custom('PODCoterieTravelStatus')]"
 POD_journey_maintenance.1.option.b: "[Localize(Concatenate(PlayerJourneyID,'_planning_decline'))]"
 POD_journey_maintenance.1.option.b.tt: "该[journey|E]的[planning_phase|E]将结束。"
 POD_journey_maintenance.20.t: "不合时宜的去世"
 POD_journey_maintenance.20.desc: "我刚刚收到消息，[journey_target.GetName]已经死了。\n\n这自然意味着我无法继续任何以[journey_target.GetHerHim]为目标的[journeys|E]了。"
 POD_journey_maintenance.20.option.a: "遗憾。"
 POD_journey_maintenance.20.tt: "所有你以[journey_target.GetName]为目标的[journeys|E]都将结束。"
 POD_journey_maintenance.100.t: "[Localize(Concatenate(PlayerJourneyID,'_travel_title'))]"
 POD_journey_maintenance.100.desc: "[GetPlayer.Custom('PODCoterieTravelStatusFlavor')]\n\n[Localize(Concatenate(PlayerJourneyID,'_travel_desc'))]"
 POD_journey_maintenance.100.desc.companion: "\n\n[companion.Custom('PODCoterieIntroFlavor')]"
 POD_journey_maintenance.100.option.a: "[Localize(Concatenate(PlayerJourneyID,'_travel_confirm'))]"
 POD_journey_maintenance.1.option.b.tt.2: "$POD_current_journey$[journey|E]将暂停。你可以在之后重启并且其将保留进度。"
 POD_journey_maintenance.110.t: "接下来是什么？"
 POD_journey_maintenance.110.desc: "现在我已经回到家，可以把注意力转移到其他未完成的事情上了。\n\n我的一些[journeys|E]可以重新开始了。"
 POD_journey_maintenance.110.option.a: "我现在不想进行任何旅程。"
 POD_journey_maintenance.21.t: "宝藏已失落"
 POD_journey_maintenance.21.desc: "不知是有意还是无意，我一直在寻找的[artifacts|E]被毁了。\n\n当然，这意味着我将无法继续任何以它为目标的[journeys|E]。"
 POD_journey_maintenance.21.tt: "所有你以失落[artifact|E]为目标的[journeys|E]都将结束。"
 POD_journey_maintenance.3.message: "找到合同"