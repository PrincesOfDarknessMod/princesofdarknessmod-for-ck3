l_simp_chinese:
 POD_azhi_dahaka_journey.1.t: "肉体和精神之谜"
 POD_azhi_dahaka_journey.1.desc: "通往阿兹・达哈卡的道路不止一条，而是有很多条。想要研究 “变化” 本身，你的心智就得适应永不停歇的变动。任何突破都必须立刻着手研究，免得想法转眼就变。身体上的考验也必须扛过去，不然你的身躯会被变化的漩涡吞噬。"
 POD_azhi_dahaka_journey.1.a: "我必须逼自己再进一步。"
 POD_azhi_dahaka_journey.2.t: "力量的临界点"
 POD_azhi_dahaka_journey.2.desc: "阿兹·达哈卡、魔龙、伊卢扬卡什、德古拉和利维坦，皆为巨龙。你不禁好奇，为什么这只巨兽在棘秘魑的神话中占据如此重要的地位。其实答案很简单。从人类文明的萌芽开始，巨龙的阴影就盘旋在人类的传说之上。凡人畏惧这些巨大蛇形生物，而对棘秘魑而言，它象征着伟大的蜕变。巨龙是混沌边缘的蜕变先兆，它螺旋和蜿蜒的形态永远处于运动之中。吸引你的并非它的外貌，而是它化茧成蝶的潜力——以及超越这一切的可能性。它们是我们尚未真正实现的蜕变的真实体现。\n数十年的研究和实验终于有了成果。你发明了一种能让自己血肉和魂灵急速蜕变的仪式。你需要在这个过程中保持神智清醒，否则就会变成一团没有心智的血肉。"
 POD_azhi_dahaka_journey.2.a: "我的飞升近在咫尺。"
 POD_azhi_dahaka_journey.3.t: "阿兹·达哈卡"
 POD_azhi_dahaka_journey.3.desc: "一般而言，除了少数显眼的例外，棘秘魑并不倾向于虔诚信仰某物。当你可以将自己塑造为神时，为何要崇拜某个彼方的神灵呢？他们不是真正的神明，也没有真正的教义。易变涅槃是氏族超验主义的象征、图腾和焦点。\n从魔龙到伊卢扬卡什，从德古拉到利维坦，龙的形象深深嵌套于棘秘魑的神话中。凡人畏惧的东西，正是我们所追求的——并非龙的字面或物理形态，而是龙作为变革者的象征。我们追求超凡的境界，行走在易变涅槃蜿蜒的螺旋中，凝视它的无数张口与双眼。在混沌与永恒交织的运动中，我们会找到跳动的龙之心，并尽情吸取其中的力量。\n隐喻得以具现，谜题化为血肉。易变涅槃是我们无神、异类灵性中的翼手天使。\n现在，它是你的了。"
 POD_azhi_dahaka_journey.3.a: "只消一个念头，现实就能改变。"
 POD_azhi_dahaka_journey.2.tooltip: "#help 一个新的[journey|E]现在可用#!"