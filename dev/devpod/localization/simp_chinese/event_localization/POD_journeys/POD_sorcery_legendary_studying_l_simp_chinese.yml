l_simp_chinese:
 POD_sorcery_legendary_studying.1.t: "术法突破"
 POD_sorcery_legendary_studying.1.desc: "自古以来，多数旁门左道的术法早已被世人摸透，但关于更高层次法术的传言始终不绝于耳——贤者之石、预见未来、真正的永生……这些历代术士梦寐以求的壮举，虽罕有（甚至从未？）实现，却始终令人心驰神往。\n\n有人认为唯有真正的魔法才能实现如此颠覆现实的咒语，但你即将证明他们是错的。是时候加入极少数术法大师的行列了。"
 POD_sorcery_legendary_studying.1.a: "我做到了。"