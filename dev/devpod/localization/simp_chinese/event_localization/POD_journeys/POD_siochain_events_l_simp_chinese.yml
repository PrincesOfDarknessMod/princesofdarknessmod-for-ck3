l_simp_chinese:
 POD_siochain.1.t: "灰暗世界"
 POD_siochain.1.desc: "秋暮世界向我展现了它的真容。\n\n板讷是必要的。没有阴影，便无光明。没有轮廓，便无形状。而板讷正是赋予梦界中那原始无羁混沌以形状的力量。\n\n有了这一理解，我已得知谜题的一部分。然而，要学的东西还有很多。"
 POD_siochain.1.a: "离完美又近了一步。"
 POD_siochain.1.a.tooltip: "你现在可以进入你[journey|E]的下一阶段：梦界沉思。"
 POD_siochain.2.t: "绚丽世界"
 POD_siochain.2.desc: "梦界向我显现了它的奥秘。\n\n创造力意味着顺其自然。意味着对一切可能发生的情况保持开放的心态，无论是好是坏，无论是喜悦还是悲伤，无论是成功还是失败。\n\n这在离世独居时显得合理，但这种见解能否与板讷共存？"
 POD_siochain.2.a.tooltip: "你现在可以进入你[journey|E]的最后一步：使你灵魂的两个部分合二为一。"
 POD_siochain.3.t: "风暴之眼"
 POD_siochain.3.desc: "我冥想以召唤自身的两个对立部分，空气仿佛在尖叫。\n\n轻盈的梦华在拉扯我，渴望着自由。而沉重的板讷则将我牢牢钉在原地，固执而无情。\n\n那儿有什么东西一闪而过。一些即将忘却的领悟，像是话到嘴边我却无法想起要说的东西。它在那儿。我知道它在那儿。我正要失去它……"
 POD_siochain.3.a.tooltip: "现在是关键时刻。保持冷静。耐心等待。"
 POD_siochain.3.a.success: "你成功了"
 POD_siochain.3.a.failure: "你失败了"
 POD_siochain.4.t: "风暴后的宁静"
 POD_siochain.4.desc: "我没想到这种压力还能变得更糟。它快要把我撕裂了。\n\n但是，它没有。\n\n我突然开始放声大笑，因为现在一切变得如此清晰明了。平衡不是终点。平衡是一个过程。而这个过程就是我自己。\n\n我感到比以往任何时候都更有生气。我的肌肉绷紧，我的思维飞速运转，充满了新的可能性，我感到自己前所未有地活在当下。"
 POD_siochain.4.a: "我已重获新生。"
 POD_siochain.4.a.tooltip: "你实现了被认为是不可能的事。"
 POD_siochain.5.t: "灾难"
 POD_siochain.5.desc: "我没想到这种压力还能变得更糟。它快要把我撕裂了。\n\n然后它确实撕裂了我。\n\n我的妖精之魂在面对板讷时如受惊的小动物般瑟缩，哦，宏伟的板讷，摧毁灵魂的板讷。那伟大的空虚。宇宙冷漠、无情的主宰啊。\n\n我在想什么，竟敢与这种天灾对抗？整个世界的色彩全都消失了。一切都结束了。一定是这样……"
 POD_siochain.5.a: "……还没有结束！"
 POD_siochain.5.a.tooltip: "要克服板讷，你需要付出你所有的力量，但你会逐渐好起来的。"
 POD_siochain.5.b: "……所以从一开始就没有希望……"
 POD_siochain.5.b.tooltip: "你困在了板讷中……"
 dauntain_work_in_progress: "猎妖人在[princes_of_darkness|E]中尚未实装！"
 POD_siochain.6.t: "一段灰暗的历程"
 POD_siochain.6.desc.1: "板讷就像无边汪洋。它……它太大了！"
 POD_siochain.6.desc.2: "板讷就像一头毛茸茸的驴子。"
 POD_siochain.6.desc.3: "板讷就像一个骄傲的骑士，如果他没有那么自负的话。"
 POD_siochain.6.desc.4: "板讷就像一种失色的色彩。"
 POD_siochain.6.desc.5: "板讷就像一条双向行驶的单行道。"
 POD_siochain.6.desc: "\n\n哇，那真是一个糟糕的比喻。我以前对这些比喻非常拿手。我的创意火花去哪了？一定是待在秋暮世界太久，我失去了它。\n\n我好像还失去了别的东西。那是什么？我已经记不起来了……"
 POD_siochain.6.a: "“梦种”是什么？"
 POD_siochain.6.a.tooltip: "你对板讷的探索使你与梦种脱离了联系……"
 POD_siochain.7.t: "一段多彩的历程"
 POD_siochain.7.desc: "梦华令人陶醉。当你能将纯粹的幻想变成可以看到、品尝和触摸的东西时，谁还会在乎什么是所谓的“真实”呢？\n\n我是不是玩过头了？并没有。这对我的成长很重要。\n\n在品尝过这些虚幻的美妙后，使用魔咒做其他事情变得更难了。但这大概很正常。"
 POD_siochain.7.a: "原来紫色是这种味道。"