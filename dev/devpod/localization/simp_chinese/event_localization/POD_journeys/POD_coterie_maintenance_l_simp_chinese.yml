l_simp_chinese:
 POD_coterie_maintenance.1.t: "组建[ROOT.Char.Custom('PODCoterieNoTooltip')]"
 POD_coterie_maintenance.1.desc: "最近，我一直在思考与团队合作的好处。\n\n在这个$pod_wod$中，信任是很难得的，但这是否意味着我必须在剩下的日子里做一匹孤狼，没有人与我并肩作战或支持我的努力呢？\n\n如果我组建一个由志同道合的人组成的[ROOT.Char.Custom('PODCoterie')]，我们就可以在未来的[journeys|E]中汇集我们的技能和资源。"
 POD_coterie_maintenance.1.option.a: "我将组建一个新[ROOT.Char.Custom('PODCoterieNoTooltip')]"
 POD_coterie_maintenance.1.option.b: "我现在不想要组建一个新[ROOT.Char.Custom('PODCoterieNoTooltip')]"
 POD_coterie_maintenance.2.t: "命名我的[ROOT.Char.Custom('PODCoterieNoTooltip')]"
 POD_coterie_maintenance.2.desc: "你的[ROOT.Char.Custom('PODCoterie')]的名称该是什么？\n\n你之后可以随时更改。"
 POD_coterie_maintenance.2.option.a: "选择该名字。"
 POD_coterie_maintenance.2.option.b: "使用默认名称#italic ([ROOT.Char.Custom('PODGetDefaultCoterieName')])#!"
 POD_coterie_maintenance.10.t: "又一个化为尘土的"
 POD_coterie_maintenance.10.desc: "$POD_player_coterie$失去了一位成员。\n\n[dead_member.GetFirstNameNicknamed][dead_member.GetDeathReason]。"
 POD_coterie_maintenance.10.option.a: "我们的[ROOT.Char.Custom('PODCoterieNoTooltip')]正在缩小。"
 POD_coterie_maintenance.20.t: "可考虑的[ROOT.Char.Custom('PODCoterieNoTooltip')]"
 POD_coterie_maintenance.20.desc: "作为[dead_member.GetFirstNameNicknamed]的继承人，我可以选择加入[dead_member.GetHerHis]的[dead_member.Custom('PODCoterie')]，[coterie.Custom('PODGetCoterieNameFromStory')]。"
 POD_coterie_maintenance.20.desc.2: "由于我已经是$POD_player_coterie$的成员，我还需要决定如何处理它。"
 POD_coterie_maintenance.20.option.a: "我将#bold 加入#![coterie.Custom('PODGetCoterieNameFromStory')]。"
 POD_coterie_maintenance.20.option.a.tt: "你将加入你前任[dead_member.GetFirstNameNicknamedPossessive]的[dead_member.Custom('PODCoterie')]，[coterie.Custom('PODGetCoterieNameFromStory')]。"
 POD_coterie_maintenance.20.option.b: "我将#bold 解散#![coterie.Custom('PODGetCoterieNameFromStory')]。"
 POD_coterie_maintenance.20.option.b.tt: "你将解散你前任[dead_member.GetFirstNameNicknamedPossessive]的[dead_member.Custom('PODCoterie')]，[coterie.Custom('PODGetCoterieNameFromStory')]。"
 POD_coterie_maintenance.20.option.c: "我什么也不做。"
 POD_coterie_maintenance.20.option.c.tt: "你不会加入你前任[dead_member.GetFirstNameNicknamedPossessive]的[dead_member.Custom('PODCoterie')]，[coterie.Custom('PODGetCoterieNameFromStory')]，但它将依然存在。"
 POD_coterie_maintenance.20.option.d: "#bold 加入#![coterie.Custom('PODGetCoterieNameFromStory')]并且离开[ROOT.Char.Custom('PODGetCoterieName')]。"
 POD_coterie_maintenance.20.option.e: "#bold 加入#![coterie.Custom('PODGetCoterieNameFromStory')]并且#bold 解散#![ROOT.Char.Custom('PODGetCoterieName')]。"
 POD_coterie_maintenance.20.option.f: "#bold 解散#![coterie.Custom('PODGetCoterieNameFromStory')]并且留在[ROOT.Char.Custom('PODGetCoterieName')]。"
 POD_coterie_maintenance.20.option.g: "只是留在[ROOT.Char.Custom('PODGetCoterieName')]。"
 POD_coterie_maintenance.30.t: "酝酿不满"
 POD_coterie_maintenance.30.desc: "最近我和[potential_rival.GetFirstNameNicknamed]的关系确实不太好。\n\n昨晚，[potential_rival.GetSheHe]质问我，说如果情况没有改善，[potential_rival.GetSheHe]就要离开$POD_player_coterie$。"
 POD_coterie_maintenance.30.option.a: "现在解决分歧还为时不晚。"
 POD_coterie_maintenance.30.option.a.tt: "如果#V 3#!月内[potential_rival.GetFirstName]的[opinion|E]任在#N [EmptyScope.ScriptValue('coterie_rivalry_opinion')]#!以下，[potential_rival.GetSheHe]将离开$POD_player_coterie$并成为你的[rival|E]。"
 POD_coterie_maintenance.30.option.b: "你想走？那就走啊。"