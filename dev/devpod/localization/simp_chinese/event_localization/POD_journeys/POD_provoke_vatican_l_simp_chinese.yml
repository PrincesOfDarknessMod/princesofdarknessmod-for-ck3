l_simp_chinese:
 POD_provoke_inquisition_effect_tt: "#N;bold 因为你，世界发生了不可逆转的变化。#!"
 POD_provoke_inquisition_effect_tt_2: "圣座已经注意到你的行动，裁判所已经开始动员。大约#V [EmptyScope.ScriptValue('premature_inquisition_delay')]#!年后，他们将向$pod_wod$派出军队，不知道这次事件会产生什么连锁反应……"
 POD_vatican_coterie_duel_success_tt: "[prowess_duelist.GetFirstNameNicknamed]击败了[adversary.GetFirstName]"
 POD_vatican_coterie_duel_failure_tt: "[prowess_duelist.GetFirstNameNicknamed]和[adversary.GetFirstName]都受伤倒下了"
 POD_vatican_coterie_duel_critfail_tt: "[prowess_duelist.GetFirstNameNicknamed]被彻底毁灭了"
 POD_psalm23_translated: "#TOOLTIP:POD_psalm23_translation #V;L $POD_psalm23_latin$#!#!"
 POD_psalm23_untranslated: "#TOOLTIP:POD_verses_notranslation #V;L $POD_psalm23_latin$#!#!"
 POD_psalm94_translated: "#TOOLTIP:POD_psalm94_translation #V;L $POD_psalm94_latin$#!#!"
 POD_psalm94_untranslated: "#TOOLTIP:POD_verses_notranslation #V;L $POD_psalm94_latin$#!#!"
 POD_lordsprayer_translated: "#TOOLTIP:POD_lordsprayer_translation #V;L $POD_lordsprayer_latin$#!#!"
 POD_lordsprayer_untranslated: "#TOOLTIP:POD_verses_notranslation #V;L $POD_lordsprayer_latin$#!#!"
 POD_verses_notranslation: "[GetPlayer.GetFirstNameNoTooltip]#bold 不#!掌握拉丁语"
 POD_psalm23_latin: "“Nam et si ambulavero in medio umbrae mortis, non timebo mala, quoniam tu mecum es. Virga tua, et baculus tuus, ipsa me consolata sunt.”"
 POD_psalm23_translation: "#italic 我纵使走过死亡的幽谷，也不怕遭害，因为你与我同在，你的杖和竿带给我安慰。#!"
 POD_psalm94_latin: "“Et factus est mihi Dominus in refugium, et Deus meus in adjutorium spei meae. Et reddet illis iniquitatem ipsorum, et in malitia eorum disperdet eos: disperdet illos Dominus Deus noster.”"
 POD_psalm94_translation: "#italic 但耶和华向来做了我的高台，我的神做了我投靠的磐石。他叫他们的罪孽归到他们身上，他们正在行恶之中，他要剪除他们——耶和华我们的神要把他们剪除！#!"
 POD_lordsprayer_latin: "“Pater noster, qui es in caelis, sanctificetur nomen tuum. Adveniat regnum tuum. Fiat voluntas tua, sicut in caelo et in terra.”"
 POD_lordsprayer_translation: "#italic 我们在天上的父：愿人都尊你的名为圣。愿你的国降临；愿你的旨意行在地上，如同行在天上。#!"
 POD_faith_vulnerability_demon_tt: "与恶魔为伍的人特别难以抵御[Glossary('真信','game_concept_true_faith_desc')]……"
 POD_faith_vulnerability_wraith_tt: "死灵特别难以抵御[Glossary('真信','game_concept_true_faith_desc')]……"
 POD_provoke_vatican_escape_tt: "你继续逃离城市……"
 POD_provoke_vatican_escape_complete_tt: "你终于成功逃脱了追捕你的裁判官。"
 POD_progenitor_caine: "[GetScriptedCharacterByHistoryID('505001').GetFirstNameNicknamed]"
 POD_progenitor_lilith: "[GetScriptedCharacterByHistoryID('505002').GetFirstNameNicknamed]"
 POD_progenitor_set: "[GetScriptedCharacterByHistoryID('505012').GetFirstName]"
 POD_progenitor_odin: "[GetScriptedCharacterByHistoryID('505055').GetFirstName]"
 POD_progenitor_zapathasura: "[GetScriptedCharacterByHistoryID('505020').GetFirstNameNicknamed]"
 POD_provoke_vatican.1.t: "隆重登场"
 POD_provoke_vatican.1.desc: "如今我站在永恒之城的门槛上。\n\n舞台已经布置好了，演员们已经集结完毕。帷幕拉开，伟大的戏剧即将展开。还剩下什么？啊，对了，那就是被囚禁的观众。\n\n周围没有人来迎接我，这有些奇怪，因为我的计划已经在同族中传开了。他们并不欣赏我即将要做的事情。\n\n确实是一个难以应对的观众群体。难道我真的如此脱离实际吗？"
 POD_provoke_vatican.1.option.a: "不，是其他人错了。"
 POD_provoke_vatican.1.option.a.tt: "你将进一步深入城市……"
 POD_provoke_vatican.2.t: "拒之门外"
 POD_provoke_vatican.2.desc: "当我试图进入城市时，[adversary.GetFirstName]挡住了我的去路。\n\n"
 POD_provoke_vatican.2.desc.vampire: "“你得立刻放弃这愚蠢的冒险，[ROOT.Char.GetFirstNameNoTooltip]。你难道不明白你这样做的后果吗？为了该隐所有子嗣的幸福，你必须被阻止。”"
 POD_provoke_vatican.2.desc.nonvampire: "“你得立刻放弃这愚蠢的冒险，[ROOT.Char.GetFirstNameNoTooltip]。你难道不明白你这样做的后果吗？如果凡人知道你的存在，他们会不惜一切代价毁灭你。”"
 POD_provoke_vatican.2.desc.ruler: "\n\n[GetTitleByKey('c_roma').GetNameNoTier]的统治者冷冷地看着我。看来是不可能让[adversary.GetHerHim]相信我事业的正义了。"
 POD_provoke_vatican.2.desc.neighbor: "\n\n如果[adversary.GetSheHe]千里迢迢来到[GetTitleByKey('c_roma').GetNameNoTier]就是为了阻止我进入，那么[adversary.GetSheHe]一定是认真的。看来是不可能让[adversary.GetHerHim]相信我事业的正义了。"
 POD_provoke_vatican.2.desc.repeat: "[coterie_loser.GetFirstNameNicknamed]冲了进来，立刻就显露出[coterie_loser.GetSheHe]无可救药地处于劣势。[adversary.GetFirstName]侧身闪过，低位假动作，高位砍击，还没等任何人反应过来，[coterie_loser.GetFirstNamePossessiveNoTooltip]的头颅已经在空中飞舞。\n\n我们又回到了原点，我的[GetPlayer.Custom('PODCoterie')]少了一名成员。\n\n[adversary.GetFirstNameNoTooltip]依然没有流露出任何情感，他转过身来对我说：“我有整夜的时间，[ROOT.Char.GetFirstNameNoTooltip]。”"
 POD_provoke_vatican.2.option.a: "靠边站，否则我让你好看。"
 POD_provoke_vatican.2.option.a.2: "好了，轮到我了。"
 POD_provoke_vatican.2.option.a.tt: "看来[adversary.GetSheHe]对谈判不感兴趣……你将不得不与[adversary.GetHerHim]战斗。"
 POD_provoke_vatican.2.option.b: "[prowess_duelist.GetFirstName]，给这个[adversary.Custom('WomanManGirlBoy')]上一课。"
 POD_provoke_vatican.2.option.c: "你说得对。我应该趁早转身离开。"
 POD_provoke_vatican.2.option.c.2: "你说到了点子上。我将放弃这次追求。"
 POD_provoke_vatican.2.option.c.tt: "你将放弃你的[journey|E]。但你的名誉损失将永远无法挽回……"
 POD_provoke_vatican.3.t: "清除第一个障碍"
 POD_provoke_vatican.3.desc: "[adversary.GetFirstName]躺在我的脚下，遍体鳞伤。现在，[adversary.GetHersHis]的自信哪里去了？"
 POD_provoke_vatican.3.desc.root: "它一定是在我把[adversary.GetHerHim]打得落花流水时凭空消失了。"
 POD_provoke_vatican.3.desc.coterie: "它一定是在[coterie_victor.GetFirstNameNicknamed]把[adversary.GetHerHim]打得落花流水时凭空消失了。"
 POD_provoke_vatican.3.desc.end: "\n\n在继续前进之前，我需要决定如何处理[adversary.GetHerHim]。"
 POD_provoke_vatican.3.option.a: "让你活着太危险了。"
 POD_provoke_vatican.3.option.b: "你完全不值得我注意。"
 POD_provoke_vatican.4.t: "短命"
 POD_provoke_vatican.4.desc: "我的视线变得模糊。到底是哪里出了问题？我只想让我们摆脱束缚。"
 POD_provoke_vatican.4.desc.caelestius: "我的视线变得模糊。到底是哪里出了问题？我只想要一个祝福。"
 POD_provoke_vatican.4.desc.end: "为什么[adversary.GetFirstName]无法理解呢？为什么没有人能够理解……\n\n我的对手摇了摇头。“今晚，我在为世界做一件好事。这对于你的追求来说是最好的结果，[ROOT.Char.GetFirstNameNoTooltip]：你死了，你的名字从所有记录中被抹去，以至于再也没有人会受到启发去尝试这样一个不明智的计划。”\n\n在一切结束之前，[adversary.GetHerHis]武器的闪光是我看到的最后一件事情。"
 POD_provoke_vatican.4.option.a: "但我想创造历史……"
 POD_provoke_vatican.4.option.a.caelestius: "但我还没和教宗谈过话……"
 POD_provoke_vatican.5.t: "皮洛士式的胜利"
 POD_provoke_vatican.5.desc: "战斗迅速变得非常混乱。[coterie_loser.GetFirstNameNicknamed]向[adversary.GetFirstName]扑去，片刻之间，血液四溅。我们试图帮助我们的[ROOT.Char.Custom('PODCoterie')]成员，但在这片混乱中，根本找不到机会。\n\n[adversary.GetFirstNameNoTooltip]怒吼着，加倍了[adversary.GetHerHis]的攻击。[coterie_loser.GetFirstNameNoTooltip]以牙还牙。\n\n当尘埃落定时，很明显他们两个都受到了严重的恶性伤害。我们的对手很快就死了，但[coterie_loser.GetFirstNameNoTooltip]也同样离世了。"
 POD_provoke_vatican.5.option.a: "你的牺牲不会白费，[coterie_loser.GetFirstNameNoTooltip]。"
 POD_provoke_vatican.10.t: "待宰羔羊"
 POD_provoke_vatican.10.desc: "凡人们拥挤在[GetTitleByKey('c_roma').GetNameNoTier]的街道上，他们的景象让我充满了鄙视之情。\n\n为什么像我这样的[Select_CString(ROOT.Char.IsFemale,'雌狮','雄狮')]被迫躲在黑暗中，而这些绵羊们可以随心所欲地去任何地方？\n\n我无法进入梵蒂冈——圣地的力量肯定会让我遭受毁灭。但这是永恒之城。圣人无处不在。"
 POD_provoke_vatican.10.desc.caelestius: "我本不愿事情发展到这一步，但是[GetTitleByKey('c_roma').GetNameNoTier]的圣人们让我别无选择。\n\n我一直表现得很有礼貌，而他们却对我不屑一顾！我打赌他们在我背后嘲笑我。我做错了什么，值得他们这样对待我？"
 POD_provoke_vatican.10.desc.end: "\n\n给他们一个永生难忘的演出是多么容易啊。"
 POD_provoke_vatican.10.option.a: "杀了他们。杀光他们。"
 POD_provoke_vatican.10.option.a.tt.beast: "#beast 好……快干。#!"
 POD_provoke_vatican.10.option.a.tt: "你将露出獠牙，开始行动。"
 POD_provoke_vatican.10.option.b: "等等，不对。我有其他想法。"
 POD_provoke_vatican.10.option.b.tt.beast: "#beast 扫兴。#!"
 POD_provoke_vatican.10.option.b.tt: "你将放弃你的[journey|E]。但你的名誉损失将永远无法挽回……"
 POD_provoke_vatican.10.option.b.tt.caelestius: "你将思考其他选择。"
 POD_provoke_vatican.11.t: "大屠杀"
 POD_provoke_vatican.11.desc: "我是一位艺术家，而[GetTitleByKey('c_roma').GetNameNoTier]是我的画布。今夜，她的街道将染上深红色。\n\n为什么凡人们在逃跑？成为我杰作的颜料是他们将要扮演的最伟大的角色。\n\n我的尖牙裸露在外，供全世界瞻仰。他们将会看见我。仔细看吧，每个人！看看你们的新统治者，即将不再躲藏在阴影之中。\n\n我感觉比以往任何时候都要好。这是我早就应该做的事情。"
 POD_provoke_vatican.11.desc.caelestius: "哦，如果伯拉纠此刻能看到我。这是揭露神职人员的虚伪的更简单方式。我只需要撕裂和撕碎。撕裂和撕碎……\n\n尽管他们口若悬河，但他们的鲜血与其他人一样。他们的内脏和其他人一样。如果我堆积得足够高，我能够触及天堂吗？\n\n我感觉比以往任何时候都要好。这是我早就应该做的事情。让我的行动代替言语……"
 POD_provoke_vatican.11.tt.caelestius: "你饱食了罗马圣职者的鲜血。"
 POD_provoke_vatican.11.tt: "你饱食了罗马平民的鲜血。"
 POD_provoke_vatican.11.tt.notvampire: "你在罗马平民中制造了一场大屠杀。"
 POD_provoke_vatican.11.option.a: "一场旷世血浴。"
 POD_provoke_vatican.12.t: "教宗在哪？"
 POD_provoke_vatican.12.desc: "迄今为止，我对[GetTitleByKey('c_roma').GetNameNoTier]的访问充满了巨大的挫折感。\n\n梵蒂冈对我关闭了大门。没有一个神职人员似乎有时间和我交谈。他们甚至不愿意听我说！而我可是一位神学大师！\n\n我该如何说服他们，让他们相信我带来的事情极其重要？"
 POD_provoke_vatican.12.desc.repeat: "迄今为止尚未成功。"
 POD_provoke_vatican.12.desc.repeat.coterie: "我们找了很多地方，但没有一位神职人员对我们感兴趣。\n\n"
 POD_provoke_vatican.12.desc.repeat.1: "[commenter.GetFirstNameNicknamed]沉着地点点头。“我们只需继续努力”，[commenter.GetSheHe]说。"
 POD_provoke_vatican.12.desc.repeat.2: "[commenter.GetFirstNameNicknamedPossessive]眉头紧皱。“我们的耐心会得到回报的”，[commenter.GetSheHe]说道，语气越发不坚定。"
 POD_provoke_vatican.12.desc.repeat.3: "[commenter.GetFirstNameNicknamed]在[commenter.GetHerHis]口中抱怨着什么，听起来疑似#italic “真好客的邻里社区……”#!"
 POD_provoke_vatican.12.desc.repeat.4: "[commenter.GetFirstNameNicknamed]眯着[commenter.GetHerHis]的眼睛看着地平线，好像[commenter.GetSheHe]只要使劲瞪大眼睛就能召唤出主教。"
 POD_provoke_vatican.12.desc.repeat.5: "[commenter.GetFirstNameNicknamed]摇摇[commenter.GetHerHis]的头。“还以为读圣经会让他们学会更多的词，而不仅仅只会说‘不’。”"
 POD_provoke_vatican.12.desc.repeat.6: "[commenter.GetFirstNameNicknamed]发出一声刺耳的沮丧尖叫，把附近的几只鸟都惊飞了。“别用那种眼神看我”，[commenter.GetSheHe]说。“这是完全合情合理的”。"
 POD_provoke_vatican.12.desc.repeat.7: "[commenter.GetFirstNameNicknamed]伸展[commenter.GetHerHis]的腿。“你知道什么会让我感觉更好吗？把其中一位主教打成肉酱。”"
 POD_provoke_vatican.12.desc.repeat.8: "[commenter.GetFirstNameNicknamed]叹息道：“我们已经尝试过外交途径了。难道我们不应该考虑其他办法吗？”"
 POD_provoke_vatican.12.desc.repeat.9: "[commenter.GetFirstNameNicknamed]声嘶力竭：“也许我们应该学尼禄一把火烧了这里。”"
 POD_provoke_vatican.12.desc.repeat.10: "[commenter.GetFirstNameNicknamed]只是怨恨地看了我一眼，什么也没说。"
 POD_provoke_vatican.12.desc.repeat.nocoterie: "我找了很多地方，但没有一位神职人员感兴趣。\n\n我只能继续尝试。或许还有更激烈的选择可以考虑……"
 POD_provoke_vatican.12.option.a: "我将进入梵蒂冈，亲自与教宗对话。"
 POD_provoke_vatican.12.option.a.tt: "世上没有比这更集中的圣地了。只有一种办法可以结束这一切。"
 POD_provoke_vatican.12.option.b: "显然一位高级主教可以接见我们。"
 POD_provoke_vatican.12.option.b.tt: "显然……"
 POD_provoke_vatican.12.option.b.success.root: "你找到一位愿意听你倾诉的主教。"
 POD_provoke_vatican.12.option.b.success.coterie: "[learning_duelist.GetFirstNameNicknamed]找到愿意听你倾诉的人。"
 POD_provoke_vatican.12.option.b.failure.root: "你找不到任何人。"
 POD_provoke_vatican.12.option.b.failure.coterie: "[learning_duelist.GetFirstNameNicknamed]找不到任何人。"
 POD_provoke_vatican.12.option.b.pope.root: "万幸的是，你真的能在远离圣地的地方觐见教宗。"
 POD_provoke_vatican.12.option.b.pope.coterie: "万幸的是，[learning_duelist.GetFirstNameNicknamed]居然成功安排了一次在远离圣地的地方与教宗本人的会面。"
 POD_provoke_vatican.12.option.c: "这太过分了！我应该教他们尊重我……"
 POD_provoke_vatican.12.option.c.tt: "你将变得狂暴。"
 POD_provoke_vatican.12.option.d: "这不可行。我放弃了。"
 POD_provoke_vatican.13.t: "因信仰而降卑"
 POD_provoke_vatican.13.desc: "我并不会#italic 立即#!后悔我的决定。\n\n疼痛起初是缓慢的。我咬紧牙关，继续前行。毫无疑问，这只是一次考验——信徒证明他们虔诚的道途。但是情况变得越来越糟，越来越糟，越来越糟……\n\n我甚至还没有到达圣彼得大教堂，灼烧感已经变得难以忍受。然而，这不仅仅是一种感觉。我真的被神圣之火所洗礼。\n"
 POD_provoke_vatican.13.desc.coterie: "我[ROOT.Char.Custom('PODCoterie')]的其他人在哪里？他们不知去向。他们已经离开了吗？\n\n"
 POD_provoke_vatican.13.desc.nocoterie: "为什么这种事发生在我身上？难道我的信仰不应该保护我吗？\n\n"
 POD_provoke_vatican.13.desc.end: "我只有片刻的时间来思考这个问题，因为大火已经完全吞噬了我。"
 POD_provoke_vatican.13.option.a: "对一位神学家来说，这是多么讽刺的结局。"
 POD_provoke_vatican.14.t: "遭到质疑"
 POD_provoke_vatican.14.desc.coterie: "终于有进展了！[learning_duelist.GetFirstNameNicknamedPossessive]的专业神学知识可以铺平许多道路。"
 POD_provoke_vatican.14.desc.nocoterie: "终于有进展了！我的专业神学知识可以铺平许多道路。"
 POD_provoke_vatican.14.desc.end: "在这种情况下，这意味着与副主教[bishop.GetFirstName]见面。\n\n他对我的学术辩论印象深刻，但这还不够。他带着神圣的微笑告诉我，不，不是每个礼貌地请求的人都能去见教宗。\n\n他是在试图委婉地拒绝我吗？他甚至知道我是谁吗？这是不能容忍的。"
 POD_provoke_vatican.14.option.a: "我必须说服他，不惜一切代价。"
 POD_provoke_vatican.14.option.a.tt: "神学辩论！你生来就是干这个的。告诉他一切。"
 POD_provoke_vatican.14.option.b: "这毫无意义。我会继续去其他地方寻找教宗。"
 POD_provoke_vatican.14.option.b.tt: "你继续搜索……"
 POD_provoke_vatican_revelation: "我告诉了他#italic 一切#!。\n\n我告诉他关于$POD_progenitor_caine$的事情。我告诉他关于$POD_progenitor_lilith$的事情。我告诉他关于很久以前在挪得之地发生的一切事件。我告诉他关于今晚在欧洲城市中徘徊的许多$pod_cainites$。\n\n我说得越多，我就越兴奋。[bishop.GetFirstName]聚精会神地听着我。他的眼睛越来越大。这进展得很顺利，我能感觉到。"
 POD_provoke_vatican.15.t: "揭露"
 POD_provoke_vatican.15.desc: "$POD_provoke_vatican_revelation$\n\n不知什么时候，他打断了我，感谢我的解释，然后借口离开了。他匆匆离开了。"
 POD_provoke_vatican.15.option.a: "嘿，你得帮我跟教宗美言几句！"
 POD_provoke_vatican.15.option.a.tt: "但他已经离开了……"
 POD_provoke_vatican.16.t: "圣父教宗"
 POD_provoke_vatican.16.desc: "哈利路亚！上帝今夜真正眷顾着我，因为我成功地获得了与圣父教宗亲自面谈的机会。我多次幻想过这个时刻，现在它成为了现实。\n\n他似乎……没我想象中那么虔诚。但无所谓。\n\n这就是我一直等待的时刻。见证奇迹的时刻。有机会从[bishop.GetFirstName]亲自得到祝福的机会。"
 POD_provoke_vatican.17.t: "揭露"
 POD_provoke_vatican.17.desc: "$POD_provoke_vatican_revelation$\n\n突然，他打断了我。“我听够了，[ROOT.Char.GetFirstNameNoTooltip]。谢谢你让我注意到这一点。”他微笑着说。"
 POD_provoke_vatican.17.option.a: "……这是好事，对吧？"
 POD_provoke_vatican.17.option.a.tt: "但是，身后的声音是怎么回事？"
 POD_provoke_vatican.17.option.a.tt.success: "有些糟糕的事情发生了"
 POD_provoke_vatican.17.option.a.tt.failure: "有些非常糟糕的事情发生了"
 POD_provoke_vatican.18.t: "背叛！"
 POD_provoke_vatican.18.desc.coterie: "幸运的是，[prowess_duelist.GetFirstNameNicknamed]反应足够快，挡住了瞄准我心脏的木桩。\n\n"
 POD_provoke_vatican.18.desc.nocoterie: "幸运的是，我反应足够快，挡住了瞄准我心脏的木桩。\n\n"
 POD_provoke_vatican.18.desc: "一位[GetTrait('supehunter').GetName(GetNullCharacter)]潜行到我身后，试图干掉我。周围突然出现了很多这样的人。他们一直都在那里吗？"
 POD_provoke_vatican.18.desc.end.coterie: "[bishop.GetFirstNamePossessive]眼睛里充满狂热，他大喊：“干掉他们！”\n\n当$POD_player_coterie$逃跑的时候，我努力压抑着对这次聚会结果的失望。"
 POD_provoke_vatican.18.desc.end.nocoterie: "[bishop.GetFirstNamePossessive]眼睛里充满狂热，他大喊：“干掉[Select_CString(ROOT.Char.IsFemale,'她','他')]！”\n\n当我逃跑的时候，我努力压抑着对这次聚会结果的失望。"
 POD_provoke_vatican.18.option.a: "快逃！"
 POD_provoke_vatican.18.option.a.tt: "你将尝试逃离这座城市……同时一群裁判官正在追赶你。"
 POD_provoke_vatican.19.t: "背叛……"
 POD_provoke_vatican.19.desc: "我没有及时察觉到[GetTrait('supehunter').GetName(GetNullCharacter)]在悄悄地靠近我。\n\n一根木桩穿透了我的心脏，将我固定在原地。我迟钝的身躯只能无助地注视着裁判所的人们逼近。其中一些人手持火炬……\n\n[bishop.GetFirstName]投来一个富有意义的眼神。他说：“我应该感谢你，[ROOT.Char.GetFirstNameNoTooltip]。如果没有你的到来，我永远不会知道教会所面临的麻烦的真正严重程度。我们需要动用所有资源。暗影裁判所将不再隐藏于暗影之中。”"
 POD_provoke_vatican.19.option.a: "这和我想象的不一样……"
 POD_provoke_vatican.20.t: "[adversary.GetFirstNameNicknamedNoTooltip]"
 POD_provoke_vatican.20.desc.coterie: "当我们开始离开城市的时候，一位[GetTrait('supehunter').GetName(adversary)]横在我们的路上。终于！多么令人兴奋。\n\n然而，当[adversary.GetSheHe]开始朗诵道：[GetPlayer.Custom('PODPsalm23')]，我们的兴奋很快变成了恐惧。\n\n一种突如其来的虚弱感笼罩着我。与我一同前行的$POD_player_coterie$成员们也不好过。显然，这是一个不可小视的敌人。"
 POD_provoke_vatican.20.desc.nocoterie: "当我开始离开城市的时候，一位[GetTrait('supehunter').GetName(adversary)]横在我的路上。终于！多么令人兴奋。\n\n然而，当[adversary.GetSheHe]开始朗诵道：[GetPlayer.Custom('PODPsalm23')]，我的兴奋很快变成了恐惧。\n\n一种突如其来的虚弱感笼罩着我。显然，这是一个不可小视的敌人。"
 POD_provoke_vatican.20.desc.coterie.bishop: "怀着复杂的情绪，我们漫步在[GetTitleByKey('c_roma').GetNameNoTier]的街道上，思考接下来该采取什么行动。突然，一位圣骑士出现在我们面前。多么令人兴奋！也许[adversary.GetSheHe]能带领我们去见教宗？\n\n然而，当[adversary.GetSheHe]开始朗诵道：[GetPlayer.Custom('PODPsalm23')]，我们的兴奋很快变成了恐惧。\n\n一种突如其来的虚弱感笼罩着我。与我一同前行的$POD_player_coterie$成员们也不好过。接着，那位骑士拔出了[adversary.GetHerHis]的[adversary.Custom('signature_weapon')]。这并非我所希望的发展……"
 POD_provoke_vatican.20.desc.nocoterie.bishop: "怀着复杂的情绪，我漫步在[GetTitleByKey('c_roma').GetNameNoTier]的街道上，思考接下来该采取什么行动。突然，一位圣骑士出现在我面前。多么令人兴奋！也许[adversary.GetSheHe]能带领我去见教宗？\n\n然而，当[adversary.GetSheHe]开始朗诵道：[GetPlayer.Custom('PODPsalm23')]，我的兴奋很快变成了恐惧。\n\n一种突如其来的虚弱感笼罩着我。接着，那位骑士拔出了[adversary.GetHerHis]的[adversary.Custom('signature_weapon')]。这并非我所希望的发展……"
 POD_provoke_vatican.20.desc.coterie.pope: "当我们开始离开城市的时候，一位[GetTrait('supehunter').GetName(adversary)]横在我们的路上。我们与教宗的会面消息一定传得很快。\n\n更糟糕的是，[adversary.GetSheHe]开始咏唱：[GetPlayer.Custom('PODPsalm23')]\n\n一种突如其来的虚弱感笼罩着我。与我一同前行的$POD_player_coterie$成员们也不好过。显然，这是一个不可小视的敌人。"
 POD_provoke_vatican.20.desc.nocoterie.pope: "当我开始离开城市的时候，一位[GetTrait('supehunter').GetName(adversary)]横在我们的路上。我与教宗的会面消息一定传得很快。\n\n更糟糕的是，[adversary.GetSheHe]开始咏唱：[GetPlayer.Custom('PODPsalm23')]\n\n一种突如其来的虚弱感笼罩着我。显然，这是一个不可小视的敌人。"
 POD_provoke_vatican.20.desc.hunter2.coterie: "我们匆忙穿过后街和小巷，尽力避开所有[GetTrait('supehunter').GetName(adversary)]的巡逻队。我们几乎成功了，直到我们遇到了一名独行侠。\n\n[adversary.GetSheHe|U]挥舞着[adversary.GetHerHis]长矛对着我们，咏唱：[GetPlayer.Custom('PODPsalm94')]\n\n这人的信仰甚至更加坚定。这真的开始变得令人烦恼了……"
 POD_provoke_vatican.20.desc.hunter2.nocoterie: "我匆忙穿过后街和小巷，尽力避开所有[GetTrait('supehunter').GetName(adversary)]的巡逻队。我几乎成功了，直到我遇到了一名独行侠。\n\n[adversary.GetSheHe|U]挥舞着[adversary.GetHerHis]长矛对着我，咏唱：[GetPlayer.Custom('PODPsalm94')]\n\n这人的信仰甚至更加坚定。这真的开始变得令人烦恼了……"
 POD_provoke_vatican.20.desc.hunter3.coterie: "现在我们几乎已经离开城市了。自由就在眼前，我几乎可以尝到它的滋味。远离城市，似乎也没有[GetTrait('supehunter').GetName(adversary)]的巡逻队。\n\n然后，一位如同真正的巨人般的[adversary.Custom('WomanManGirlBoy')]从门口走出来。\n\n[adversary.GetSheHe|U]高举着[adversary.GetHerHis]斧头，大声喊道：[GetPlayer.Custom('PODLordsPrayer')]\n\n面对[adversary.GetHerHis]那威胁着我们的信仰，我们准备迎接最后一次决战。"
 POD_provoke_vatican.20.desc.hunter3.nocoterie: "现在我几乎已经离开城市了。自由就在眼前，我几乎可以尝到它的滋味。远离城市，似乎也没有[GetTrait('supehunter').GetName(adversary)]的巡逻队。\n\n然后，一位如同真正的巨人般的[adversary.Custom('WomanManGirlBoy')]从门口走出来。\n\n[adversary.GetSheHe|U]高举着[adversary.GetHerHis]斧头，大声喊道：[GetPlayer.Custom('PODLordsPrayer')]\n\n面对[adversary.GetHerHis]那威胁着我的信仰，我准备迎接最后一次决战。"
 POD_provoke_vatican.20.option.a: "如果你想跟我作战，那就来吧。"
 POD_provoke_vatican.20.option.a.tt: "你要亲自与这位上帝的仆人决斗。"
 POD_provoke_vatican.20.option.b: "[prowess_duelist.GetFirstName]，这是你大显身手的时候了。"
 POD_provoke_vatican.21.t: "克服逆境"
 POD_provoke_vatican.21.desc: "[adversary.GetFirstNameNicknamed]已被彻底击败。[adversary.GetHerHis|U]的信仰破灭了，[adversary.GetHerHis]的圣咏沉默了。\n\n我是应该现在就杀死[adversary.GetHerHim]，还是尽快继续前进？"
 POD_provoke_vatican.21.desc.drain: "\n\n当然，我可以补充我的$pod_vitae$并同时解决这个麻烦……"
 POD_provoke_vatican.21.desc.sanguine: "\n\n该[GetTrait('supehunter').GetName(adversary)]的血液里充满了信仰。喝下它将是一个极其糟糕的主意。"
 POD_provoke_vatican.21.option.b: "我会吸干你所有的血。"
 POD_provoke_vatican.22.t: "坚定信仰"
 POD_provoke_vatican.22.desc: "[adversary.GetFirstNameNicknamed]夺去了我的武器，并以一名专业人士的速度，迅速逼近，准备给予致命一击。\n\n时间似乎变得缓慢，今晚的事件在我眼前闪现。我的死会不会激励其他$POD_splat_hunter_plural$？凡人们现在会不会团结在一起？这整个企图是否都是一个巨大的错误？\n\n当[GetTrait('supehunter').GetName(adversary)]的[adversary.Custom('signature_weapon')]砍向我的脖子时，我的思考被打断。"
 POD_provoke_vatican.22.option.a: "我在想，我的继任者会是谁……"
 POD_provoke_vatican.23.t: "高昂的代价"
 POD_provoke_vatican.23.desc: "[adversary.GetFirstNameNicknamed]的信仰使我们措手不及。[adversary.GetSheHe|U]挥舞着[adversary.GetHerHis]的十字架，使周围的地面被神圣化，这给[adversary.GetHerHim]带来了巨大的战术优势。\n\n现在我们被困在外面，而[coterie_loser.GetFirstNameNicknamed]正站着被烧焦。\n\n然而，我们的[ROOT.Char.Custom('PODCoterie')]成员并不愿意轻易认输，即使在[coterie_loser.GetHerHis]皮肤变黑并冒烟的情况下，[coterie_loser.GetSheHe]也设法与[GetTrait('supehunter').GetName(adversary)]一起倒下。"
 POD_provoke_vatican.30.t: "终……？"
 POD_provoke_vatican.30.desc: "完成。\n\n梵蒂冈得到了一堂关于尊重的教训，而我则活了下来，讲述这个故事。战斗是艰苦的，我取得了胜利。现在，我可以书写历史了。"
 POD_provoke_vatican.30.desc.coterie: "\n\n然而，当我和$POD_player_coterie$其他成员道别，分道扬镳时，紧张的情绪并没有离开我的身体。"
 POD_provoke_vatican.30.desc.nocoterie: "\n\n然而……紧张的情绪并没有离开我的身体。"
 POD_provoke_vatican.30.desc.end: "我赢了，不是吗？那为什么我无法摆脱这恐惧感呢？\n\n当我走近我[ROOT.Char.Custom('PODDomicile')]的门，看到它敞开着时，我的忧虑并没有减轻。\n\n有人来过这里。\n\n而我肯定没有邀请任何人。"
 POD_provoke_vatican.30.option.a: "我拔出武器，做好最坏的打算……"
 POD_provoke_vatican.31.t: "#TOOLTIP:NICKNAME,nick_vatican_hunter4,[hunter4.GetID] #L 羔羊#!#!"
 POD_provoke_vatican.31.desc.coterie: "$POD_player_coterie$的其他成员死伤惨重。在他们中间站着一位[Select_CString(hunter4.IsFemale,'女裁判官','裁判官')]，笼罩在令人难以忍受的日光光环中，宛如天启。\n\n"
 POD_provoke_vatican.31.desc.nocoterie: "我的[ROOT.Char.Custom('PODDomicile')]内部是一片燃烧的废墟。中间矗立着一位[Select_CString(hunter4.IsFemale,'女裁判官','裁判官')]，笼罩在令人难以忍受的日光光环中，宛如天启。\n\n"
 POD_provoke_vatican.31.desc.vampire: "[hunter4.GetSheHe|U]不祈祷。\n[hunter4.GetSheHe|U]不说话。\n[hunter4.GetSheHe|U]向前迈出一步，我的血液痛苦地嗥叫。\n\n罪之启示淹没了我。来自我的祖先，一直追溯到[ROOT.Char.Custom('PODProgenitor')]的所有罪孽的重压，像饥饿的幽灵一样袭击着我，像刀子一样刺入我的思绪。\n\n它很烫。\n"
 POD_provoke_vatican.31.desc.notvampire: "[hunter4.GetSheHe|U]不祈祷。\n[hunter4.GetSheHe|U]不说话。\n[hunter4.GetSheHe|U]向前迈出一步，而[hunter4.GetHerHis]的信仰则如霹雳般回响。\n\n罪之启示淹没了我。我祖先所有罪孽的重压，威胁着要将我毁灭，像饥饿的幽灵一样袭击着我，像刀子一样刺入我的思绪。\n\n它很烫。\n"
 POD_provoke_vatican.31.desc.end: "我想尖叫，但嘴里却发不出任何声音。"
 POD_provoke_vatican.31.option.a: "你想要我？那就来抓我啊。"
 POD_provoke_vatican.31.option.a.tt: "当你最后一次准备好你的刀剑时，一种终结感笼罩着你……"
 POD_provoke_vatican.32.t: "尘归尘"
 POD_provoke_vatican.32.desc: "当我的武器击中[GetTrait('supehunter').GetName(hunter4)]的心脏时，末日幻象逐渐消散。日光也随之退去。那也只是一场幻觉吗？\n\n我坐在曾经是我的[ROOT.Char.Custom('PODDomicile')]的废墟中，反思着这段旅程的经历。\n\n"
 POD_provoke_vatican.32.desc.coterie: "我安然无恙。而$POD_player_coterie$的其他成员却不是这样。是我的选择害了他们？还是无论如何，裁判所都会来找他们？\n\n"
 POD_provoke_vatican.32.desc.nocoterie: "我安然无恙。这才是最重要的，对吧？\n\n"
 POD_provoke_vatican.32.desc.caelestius.nopope: "我安然无恙。这才是最重要的，对吧？可惜我没能见到教宗。不知道他会不会祝福我呢？\n\n"
 POD_provoke_vatican.32.desc.caelestius.pope: "我安然无恙。这才是最重要的，对吧？真遗憾和教宗的会面就这样结束了。难道他就没有机会祝福我吗？\n\n"
 POD_provoke_vatican.32.desc.end: "不管情况如何……我感觉困难才刚刚开始。"
 POD_provoke_vatican.32.option.a: "俗话说“愿你生活在有趣的时代”。"
 POD_provoke_vatican.32.option.a.tt: "$POD_splat_hunter_plural$已经停止追踪你了。目前如此。"
 POD_provoke_vatican.32.option.a.tt2: "你的行为已经让你在$pod_wod$中声名狼藉。要改变你的声誉，恐怕需要一个真正的奇迹……"
 POD_provoke_vatican.33.t: "第四印"
 POD_provoke_vatican.33.desc: "我在这场战斗中感到异常迟缓，就像在浓稠的蜂蜜中行走。现实和虚幻已经交织，我已无法分辨其中的界限……\n\n\n我又看见且听见，宝座与活物并长老的周围有许多天使的声音；他们的数目有千千万万;\n\n大声说：曾被杀的羔羊是配得权柄、丰富、智慧、能力、尊贵、荣耀、颂赞的。"
 POD_provoke_vatican.200.t: "永不屈服"
 POD_provoke_vatican.200.desc: "我一直都是对的。\n\n我还需要再说什么吗？\n\n不，不需要。"
 POD_provoke_vatican.200.option.a: "现在我可以说：“我早就告诉过你了。”"
 POD_provoke_vatican.30.desc.caelestius: "结束了。\n\n我可能没有得到我所期望的祝福，但尽管如此，这次旅程还是对我的信仰进行了一次巨大的考验。我最终取得了胜利。没有任何$POD_splat_hunter_plural$能打败我。"