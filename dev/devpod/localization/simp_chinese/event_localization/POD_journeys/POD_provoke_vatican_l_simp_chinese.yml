l_simp_chinese:
 POD_provoke_inquisition_effect_tt:0 "#N;bold 因为你，世界发生了不可逆转的变化。#!"
 POD_provoke_inquisition_effect_tt_2:0 "圣座已经注意到你的行动，裁判所已经开始动员。大约#V [EmptyScope.ScriptValue('premature_inquisition_delay')]#!年后，他们将向[world_of_darkness|E]派出军队，不知道这次事件会产生什么连锁反应……"
 POD_vatican_coterie_duel_success_tt:0 "[prowess_duelist.GetFirstNameNicknamed]击败了[adversary.GetFirstName]"
 POD_vatican_coterie_duel_failure_tt:0 "[prowess_duelist.GetFirstNameNicknamed]和[adversary.GetFirstName]都受伤倒下了"
 POD_vatican_coterie_duel_critfail_tt:0 "[prowess_duelist.GetFirstNameNicknamed]被彻底毁灭了"
 POD_psalm23_translated:0 "#TOOLTIP:POD_psalm23_translation #V;L $POD_psalm23_latin$#!#!"
 POD_psalm23_untranslated:0 "#TOOLTIP:POD_verses_notranslation #V;L $POD_psalm23_latin$#!#!"
 POD_psalm94_translated:0 "#TOOLTIP:POD_psalm94_translation #V;L $POD_psalm94_latin$#!#!"
 POD_psalm94_untranslated:0 "#TOOLTIP:POD_verses_notranslation #V;L $POD_psalm94_latin$#!#!"
 POD_lordsprayer_translated:0 "#TOOLTIP:POD_lordsprayer_translation #V;L $POD_lordsprayer_latin$#!#!"
 POD_lordsprayer_untranslated:0 "#TOOLTIP:POD_verses_notranslation #V;L $POD_lordsprayer_latin$#!#!"
 POD_verses_notranslation:0 "[GetPlayer.GetFirstNameNoTooltip]#bold 不#!掌握拉丁语"
 POD_psalm23_latin:0 "“Nam et si ambulavero in medio umbrae mortis, non timebo mala, quoniam tu mecum es. Virga tua, et baculus tuus, ipsa me consolata sunt.”"
 POD_psalm23_translation:0 "#italic 我纵使走过死亡的幽谷， 也不怕遭害， 因为你与我同在， 你的杖和竿带给我安慰。#!"
 POD_psalm94_latin:0 "“Et factus est mihi Dominus in refugium, et Deus meus in adjutorium spei meae. Et reddet illis iniquitatem ipsorum, et in malitia eorum disperdet eos: disperdet illos Dominus Deus noster.”"
 POD_psalm94_translation:0 "#italic 但耶和华向来做了我的高台，我的神做了我投靠的磐石。他叫他们的罪孽归到他们身上，他们正在行恶之中，他要剪除他们——耶和华我们的神要把他们剪除！#!"
 POD_lordsprayer_latin:0 "“Pater noster, qui es in caelis, sanctificetur nomen tuum. Adveniat regnum tuum. Fiat voluntas tua, sicut in caelo et in terra.”"
 POD_lordsprayer_translation:0 "#italic 我们在天上的父：愿人都尊你的名为圣。愿你的国降临；愿你的旨意行在地上，如同行在天上。#!"
 POD_faith_vulnerability_demon_tt:0 "与恶魔为伍的人特别难以抵御[GetTrait('truefaith').GetName(GetNullCharacter)]……"
 POD_faith_vulnerability_wraith_tt:0 "死灵特别难以抵御[GetTrait('truefaith').GetName(GetNullCharacter)]……"
 POD_provoke_vatican_escape_tt:0 "你继续逃离城市……"
 POD_provoke_vatican_escape_complete_tt:0 "你终于成功逃脱了追捕你的裁判官。"
 POD_progenitor_caine:0 "[GetScriptedCharacterByHistoryID('505001').GetFirstNameNicknamed]"
 POD_progenitor_lilith:0 "[GetScriptedCharacterByHistoryID('505002').GetFirstNameNicknamed]"
 POD_progenitor_set:0 "[GetScriptedCharacterByHistoryID('505012').GetFirstName]"
 POD_progenitor_odin:0 "[GetScriptedCharacterByHistoryID('505055').GetFirstName]"
 POD_progenitor_zapathasura:0 "[GetScriptedCharacterByHistoryID('505020').GetFirstNameNicknamed]"
 POD_provoke_vatican.1.t:0 "隆重登场"
 POD_provoke_vatican.1.desc:0 "如今我站在永恒之城的门槛上。\n\n舞台已经布置好了，演员们已经集结完毕。帷幕拉开，伟大的戏剧即将展开。还剩下什么？啊，对了，那就是被囚禁的观众。\n\n周围没有人来迎接我，这有些奇怪，因为我的计划已经在同族中传开了。他们并不欣赏我即将要做的事情。\n\n确实是一个难以应对的观众群体。难道我真的如此脱离实际吗？"
 POD_provoke_vatican.1.option.a:0 "不，是其他人错了。"
 POD_provoke_vatican.1.option.a.tt:0 "你将进一步深入城市……"
 POD_provoke_vatican.2.t:0 "拒之门外"
 POD_provoke_vatican.2.desc:0 "当我试图进入城市时，[adversary.GetFirstName]挡住了我的去路。\n\n"
 POD_provoke_vatican.2.desc.vampire:0 "“你得立刻放弃这愚蠢的冒险，[ROOT.Char.GetFirstNameNoTooltip]。你难道不明白你这样做的后果吗？为了该隐所有子嗣的幸福，你必须被阻止。”"
 POD_provoke_vatican.2.desc.nonvampire:0 "“你得立刻放弃这愚蠢的冒险，[ROOT.Char.GetFirstNameNoTooltip]。你难道不明白你这样做的后果吗？如果凡人知道你的存在，他们会不惜一切代价毁灭你。”"
 POD_provoke_vatican.2.desc.ruler:0 "\n\n[GetTitleByKey('c_roma').GetNameNoTier]的统治者冷冷地看着我。似乎无法说服[adversary.GetHerHim]我的事业是正义的。"
 POD_provoke_vatican.2.desc.neighbor:0 "\n\n如果[adversary.GetSheHe]千里迢迢来到[GetTitleByKey('c_roma').GetNameNoTier]就是为了阻止我进入，那么[adversary.GetSheHe]一定是认真的。似乎无法说服[adversary.GetHerHim]我的事业是正义的。"
 POD_provoke_vatican.2.desc.repeat:0 "[coterie_loser.GetFirstNameNicknamed]冲了进来，立刻就显露出[coterie_loser.GetSheHe]无可救药地处于劣势。[adversary.GetFirstName]侧身闪过，低位假动作，高位砍击，还没等任何人反应过来，[coterie_loser.GetFirstNamePossessiveNoTooltip]的头颅已经在空中飞舞。\n\n我们又回到了原点，我的[GetPlayer.Custom('PODCoterie')]少了一名成员。\n\n[adversary.GetFirstNameNoTooltip]依然没有流露出任何情感，他转过身来对我说：“我有整夜的时间，[ROOT.Char.GetFirstNameNoTooltip]。”"
 POD_provoke_vatican.2.option.a:0 "靠边站，否则我让你好看。"
 POD_provoke_vatican.2.option.a.2:0 "好了，轮到我了。"
 POD_provoke_vatican.2.option.a.tt:0 "看来[adversary.GetSheHe]对谈判不感兴趣……你将不得不与[adversary.GetHerHim]战斗。"
 POD_provoke_vatican.2.option.b:0 "[prowess_duelist.GetFirstName]，给这个[adversary.Custom('WomanManGirlBoy')]上一课。"
 POD_provoke_vatican.2.option.c:0 "你说得对。我应该趁早转身离开。"
 POD_provoke_vatican.2.option.c.2:0 "你说到了点子上。我将放弃这次追求。"
 POD_provoke_vatican.2.option.c.tt:0 "你将放弃你的[journey|E]。但你的名誉损失将永远无法挽回……"
 POD_provoke_vatican.3.t:0 "清除第一个障碍"
 POD_provoke_vatican.3.desc:0 "[adversary.GetFirstName]躺在我的脚下，遍体鳞伤。现在，[adversary.GetHersHis]的自信哪里去了？"
 POD_provoke_vatican.3.desc.root:0 "它一定是在我把[adversary.GetHerHim]打得落花流水时凭空消失了。"
 POD_provoke_vatican.3.desc.coterie:0 "它一定是在[coterie_victor.GetFirstNameNicknamed]把[adversary.GetHerHim]打得落花流水时凭空消失了。"
 POD_provoke_vatican.3.desc.end:0 "\n\n在继续前进之前，我需要决定如何处理[adversary.GetHerHim]。"
 POD_provoke_vatican.3.option.a:0 "让你活着太危险了。"
 POD_provoke_vatican.3.option.b:0 "你完全不值得我注意。"
 POD_provoke_vatican.4.t:0 "短命"
 POD_provoke_vatican.4.desc:0 "我的视线变得模糊。到底是哪里出了问题？我只想让我们摆脱束缚。"
 POD_provoke_vatican.4.desc.caelestius:0 "我的视线变得模糊。到底是哪里出了问题？我只想要一个祝福。"
 POD_provoke_vatican.4.desc.end:0 "为什么[adversary.GetFirstName]无法理解呢？为什么没有人能够理解……\n\n我的对手摇了摇头。“今晚，我在为世界做一件好事。这对于你的追求来说是最好的结果，[ROOT.Char.GetFirstNameNoTooltip]：你死了，你的名字从所有记录中被抹去，以至于再也没有人会受到启发去尝试这样一个不明智的计划。”\n\n在一切结束之前，[adversary.GetHerHis]武器的闪光是我看到的最后一件事情。"
 POD_provoke_vatican.4.option.a:0 "但我想创造历史……"
 POD_provoke_vatican.4.option.a.caelestius:0 "但我还没和教宗谈过话……"
 POD_provoke_vatican.5.t:0 "皮洛士式的胜利"
 POD_provoke_vatican.5.desc:0 "战斗迅速变得非常混乱。[coterie_loser.GetFirstNameNicknamed]向[adversary.GetFirstName]扑去，片刻之间，血液四溅。我们试图帮助我们的[ROOT.Char.Custom('PODCoterie')]成员，但在这片混乱中，根本找不到机会。\n\n[adversary.GetFirstNameNoTooltip]怒吼着，加倍了[adversary.GetHerHis]的攻击。[coterie_loser.GetFirstNameNoTooltip]以牙还牙。\n\n当尘埃落定时，很明显他们两个都受到了严重的伤害。我们的对手很快就死了，但[coterie_loser.GetFirstNameNoTooltip]也同样离世了。"
 POD_provoke_vatican.5.option.a:0 "你的牺牲不会白费，[coterie_loser.GetFirstNameNoTooltip]。"
 POD_provoke_vatican.10.t:0 "待宰羔羊"
 POD_provoke_vatican.10.desc:0 "凡人们拥挤在[GetTitleByKey('c_roma').GetNameNoTier]的街道上，他们的景象让我充满了鄙视之情。\n\n为什么像我这样的[Select_CString(ROOT.Char.IsFemale,'雌狮','雄狮')]被迫躲在黑暗中，而这些绵羊们可以随心所欲地去任何地方？\n\n我无法进入梵蒂冈——圣地的力量肯定会让我遭受毁灭。但这是永恒之城。圣人无处不在。"
 POD_provoke_vatican.10.desc.caelestius:0 "我本不愿事情发展到这一步，但是[GetTitleByKey('c_roma').GetNameNoTier]的圣人们让我别无选择。\n\n我一直表现得很有礼貌，而他们却对我不屑一顾！我打赌他们在我背后嘲笑我。我做错了什么，值得他们这样对待我？"
 POD_provoke_vatican.10.desc.end:0 "\n\n给他们一个永生难忘的演出是多么容易啊。"
 POD_provoke_vatican.10.option.a:0 "杀了他们。杀光他们。"
 POD_provoke_vatican.10.option.a.tt.beast:0 "#R 好……快干。#!"
 POD_provoke_vatican.10.option.a.tt:0 "你将露出獠牙，开始行动。"
 POD_provoke_vatican.10.option.b:0 "等等，不对。我有其他想法。"
 POD_provoke_vatican.10.option.b.tt.beast:0 "#R 扫兴。#!"
 POD_provoke_vatican.10.option.b.tt:0 "你将放弃你的[journey|E]。但你的名誉损失将永远无法挽回……"
 POD_provoke_vatican.10.option.b.tt.caelestius:0 "你将思考其他选择。"
 POD_provoke_vatican.11.t:0 "大屠杀"
 POD_provoke_vatican.11.desc:0 "我是一位艺术家，而[GetTitleByKey('c_roma').GetNameNoTier]是我的画布。今夜，她的街道将染上深红色。\n\n为什么凡人们在逃跑？成为我杰作的颜料是他们将要扮演的最伟大的角色。\n\n我的尖牙裸露在外，供全世界瞻仰。他们将会看见我。仔细看吧，每个人！看看你们的新统治者，即将不再躲藏在阴影之中。\n\n我感觉比以往任何时候都要好。这是我早就应该做的事情。"
 POD_provoke_vatican.11.desc.caelestius:0 "Oh, if Pelagius could see me now. This is a much easier way to expose the clergy's hypocrisy. All I need to do is rip and tear. Rip and tear...\n\nFor all their great words, their blood tastes the same as everyone else's. Their viscera look the same as everyone else's. If I piled them high enough, could I reach heaven?\n\nI'm feeling better than ever. This is something I should've done a long time ago. Letting my actions do the talking, instead of my words..."
 POD_provoke_vatican.11.tt.caelestius:0 "你饱食了罗马圣职者的鲜血。"
 POD_provoke_vatican.11.tt:0 "你饱食了罗马平民的鲜血。"
 POD_provoke_vatican.11.tt.notvampire:0 "你在罗马平民中制造了一场大屠杀。"
 POD_provoke_vatican.11.option.a:0 "一场旷世血浴。"
 POD_provoke_vatican.12.t:0 "教宗在哪？"
 POD_provoke_vatican.12.desc:0 "So far, my visit to [GetTitleByKey('c_roma').GetNameNoTier] has been one giant exercise in frustration.\n\nThe Vatican is barred to me. None of the holy men seem to have time to talk to me. They aren't even willing to hear me out! Me, a master of theology!\n\nWhat can I do to convince them that I'm bringing them matters of the gravest import?"
 POD_provoke_vatican.12.desc.repeat:0 "迄今为止尚未成功。"
 POD_provoke_vatican.12.desc.repeat.coterie:0 "我们找了很多地方，但没有一位神职人员对我们感兴趣。\n\n"
 POD_provoke_vatican.12.desc.repeat.1:0 "[commenter.GetFirstNameNicknamed]沉着地点点头。\"我们只需继续努力\"，[commenter.GetSheHe]说。"
 POD_provoke_vatican.12.desc.repeat.2:0 "[commenter.GetFirstNameNicknamedPossessive]眉头紧皱。\"我们的耐心会得到回报的\"，[commenter.GetSheHe]说道，语气越发不坚定。"
 POD_provoke_vatican.12.desc.repeat.3:0 "[commenter.GetFirstNameNicknamed]在[commenter.GetHerHis]口中抱怨着什么，听起来疑似#italic “真好客的邻里社区……”#!"
 POD_provoke_vatican.12.desc.repeat.4:0 "[commenter.GetFirstNameNicknamed]眯着[commenter.GetHerHis]的眼睛看着地平线，好像[commenter.GetSheHe]只要使劲瞪大眼睛就能召唤出主教。"
 POD_provoke_vatican.12.desc.repeat.5:0 "[commenter.GetFirstNameNicknamed]摇摇[commenter.GetHerHis]的头。“还以为读圣经会让他们学会更多的词，而不仅仅只会说‘不’。”"
 POD_provoke_vatican.12.desc.repeat.6:0 "[commenter.GetFirstNameNicknamed]发出一声刺耳的沮丧尖叫，把附近的几只鸟都惊飞了。“别用那种眼神看我”，[commenter.GetSheHe]说。“这是完全合情合理的”。"
 POD_provoke_vatican.12.desc.repeat.7:0 "[commenter.GetFirstNameNicknamed]伸展[commenter.GetHerHis]的腿。“你知道什么会让我感觉更好吗？把其中一位主教打成肉酱。”"
 POD_provoke_vatican.12.desc.repeat.8:0 "[commenter.GetFirstNameNicknamed]叹息道： “我们已经尝试过外交途径了。难道我们不应该考虑其他办法吗？”"
 POD_provoke_vatican.12.desc.repeat.9:0 "[commenter.GetFirstNameNicknamed]声嘶力竭： “也许我们应该学尼禄一把火烧了这里。”"
 POD_provoke_vatican.12.desc.repeat.10:0 "[commenter.GetFirstNameNicknamed]只是怨恨地看了我一眼，什么也没说。"
 POD_provoke_vatican.12.desc.repeat.nocoterie:0 "我找了很多地方，但没有一位神职人员感兴趣。\n\n我只能继续尝试。或许还有更激烈的选择可以考虑……"
 POD_provoke_vatican.12.option.a:0 "我将进入梵蒂冈，亲自与教宗对话。"
 POD_provoke_vatican.12.option.a.tt:0 "世上没有比这更集中的圣地了。只有一种办法可以结束这一切。"
 POD_provoke_vatican.12.option.b:0 "显然一位高级主教可以接见我们。"
 POD_provoke_vatican.12.option.b.tt:0 "显然……"
 POD_provoke_vatican.12.option.b.success.root:0 "你找到一位愿意听你倾诉的主教。"
 POD_provoke_vatican.12.option.b.success.coterie:0 "[learning_duelist.GetFirstNameNicknamed]找到愿意听你倾诉的人。"
 POD_provoke_vatican.12.option.b.failure.root:0 "你找不到任何人。"
 POD_provoke_vatican.12.option.b.failure.coterie:0 "[learning_duelist.GetFirstNameNicknamed]找不到任何人。"
 POD_provoke_vatican.12.option.b.pope.root:0 "万幸的是，你真的能在远离圣地的地方觐见教宗。"
 POD_provoke_vatican.12.option.b.pope.coterie:0 "万幸的是，[learning_duelist.GetFirstNameNicknamed]居然成功安排了一次在远离圣地的地方与教宗本人的会面。"
 POD_provoke_vatican.12.option.c:0 "这太过分了！我应该教他们尊重我……"
 POD_provoke_vatican.12.option.c.tt:0 "你将变得狂暴。"
 POD_provoke_vatican.12.option.d:0 "这不可行。我放弃了。"
 POD_provoke_vatican.13.t:0 "Humbled by Faith"
 POD_provoke_vatican.13.desc:0 "I don't #italic immediately#! regret my decision.\n\nThe pain starts slowly at first. I grit my teeth and march onward. Surely this is just a test — a way for the faithful to prove their devotion. But it gets worse, and worse, and worse...\n\nI haven't even reached the Basilica yet, and the burning sensation has become unbearable. It's not just a sensation, though. I am literally bathed in divine fire.\n\n"
 POD_provoke_vatican.13.desc.coterie:0 "Where is the rest of my [ROOT.Char.Custom('PODCoterie')]? They're nowhere to be seen. Did they leave already?\n\n"
 POD_provoke_vatican.13.desc.nocoterie:0 "Why is this happening to me? Shouldn't my faith protect me?\n\n"
 POD_provoke_vatican.13.desc.end:0 "I only have moments to ponder this question as the fire fully consumes me."
 POD_provoke_vatican.13.option.a:0 "What an ironic way to go for a theologian."
 POD_provoke_vatican.14.t:0 "Met with Skepticism"
 POD_provoke_vatican.14.desc.coterie:0 "Finally, we are getting somewhere! [learning_duelist.GetFirstNameNicknamedPossessive] theological expertise can open many doors. "
 POD_provoke_vatican.14.desc.nocoterie:0 "Finally, we are getting somewhere! My theological expertise can open many doors. "
 POD_provoke_vatican.14.desc.end:0 "In this case, it means a meeting with Suffragan Bishop [bishop.GetFirstName].\n\nHe is impressed with my learned arguments, but it's not enough. With a beatific smile, he tells me that, no, not just anyone who asks nicely can go see the Pope.\n\nIs he trying to let me down gently? Does he even know who I am? This cannot stand."
 POD_provoke_vatican.14.option.a:0 "I must convince him, whatever it takes."
 POD_provoke_vatican.14.option.a.tt:0 "A chance for a theological debate! This is what you were born to do. Tell him everything."
 POD_provoke_vatican.14.option.b:0 "This is pointless. I'll keep looking for the Pope elsewhere."
 POD_provoke_vatican.14.option.b.tt:0 "You continue your search..."
 POD_provoke_vatican_revelation:0 "I tell him #italic EVERYTHING#!.\n\nI tell him about $POD_progenitor_caine$. I tell him about $POD_progenitor_lilith$. I tell him all about the events that transpired in the Land of Nod, long ago. And I tell him about the many [cainites|E] that roam the cities of Europe tonight.\n\nThe more I talk, the more animated I get. [bishop.GetFirstName] is listening to me with rapt attention. His eyes are growing wider by the minute. This is going well, I can feel it."
 POD_provoke_vatican.15.t:0 "The Revelation"
 POD_provoke_vatican.15.desc:0 "$POD_provoke_vatican_revelation$\n\nAt some point, he cuts me off, thanks me for the insights, and excuses himself. He leaves in a hurry."
 POD_provoke_vatican.15.option.a:0 "Hey! You have to put in a good word with the Pope for me!"
 POD_provoke_vatican.15.option.a.tt:0 "But he's already gone..."
 POD_provoke_vatican.16.t:0 "The Holy Father"
 POD_provoke_vatican.16.desc:0 "Hallelujah! God truly smiles on me this night, for I've secured an audience with the Holy Father himself. So many times have I fantasized about this event, and now it's become reality.\n\nHe does seem... a bit less pious than he did in my imagination. But no matter.\n\nThis is what I've been waiting for. The moment of truth. A chance to receive a blessing from [bishop.GetFirstName] himself."
 POD_provoke_vatican.17.t:0 "The Revelation"
 POD_provoke_vatican.17.desc:0 "$POD_provoke_vatican_revelation$\n\nSuddenly, he cuts me off. \"I've heard quite enough, [ROOT.Char.GetFirstNameNoTooltip]. Thank you for bringing this to my attention.\" He smiles."
 POD_provoke_vatican.17.option.a:0 "...That's good, right?"
 POD_provoke_vatican.17.option.a.tt:0 "But what's that noise you hear behind you?"
 POD_provoke_vatican.17.option.a.tt.success:0 "Something bad happens"
 POD_provoke_vatican.17.option.a.tt.failure:0 "Something VERY bad happens"
 POD_provoke_vatican.18.t:0 "背叛！"
 POD_provoke_vatican.18.desc.coterie:0 "Luckily, [prowess_duelist.GetFirstNameNicknamed] reacts quickly enough to deflect the stake aimed at my heart.\n\n"
 POD_provoke_vatican.18.desc.nocoterie:0 "Luckily, I react quickly enough to deflect the stake aimed at my heart.\n\n"
 POD_provoke_vatican.18.desc:0 "A [GetTrait('supehunter').GetName(GetNullCharacter)] had snuck up behind me and tried to take me out. There are a lot of them around, all of a sudden. Were they always there?\n\n"
 POD_provoke_vatican.18.desc.end.coterie:0 "[bishop.GetFirstNamePossessive] eyes are burning with zeal as he shouts: \"AFTER THEM!\"\n\nI try to suppress my disappointment at how this meeting went as $POD_player_coterie$ make their escape."
 POD_provoke_vatican.18.desc.end.nocoterie:0 "[bishop.GetFirstNamePossessive] eyes are burning with zeal as he shouts: \"AFTER HIM!\"\n\nI try to suppress my disappointment at how this meeting went as I make my escape."
 POD_provoke_vatican.18.option.a:0 "Time to run!"
 POD_provoke_vatican.18.option.a.tt:0 "You will try and escape the city... with a horde of Inquisitors coming after you."
 POD_provoke_vatican.19.t:0 "Betrayal..."
 POD_provoke_vatican.19.desc:0 "I don't react quickly enough to the [GetTrait('supehunter').GetName(GetNullCharacter)] sneaking up behind me.\n\nA stake is driven through my heart, locking me in place. My torpid form can only watch helplessly as the Inquisitors close in around me. Some of them are carrying torches...\n\n[bishop.GetFirstName] shoots me a meaningful look. \"I should be thanking you, [ROOT.Char.GetFirstNameNoTooltip]\", he says. \"If you hadn't come, I'd never have known the true extent of what the Church is facing. We need to bring all our resources to bear. The Shadow Inquisition shall be in the shadows no longer.\""
 POD_provoke_vatican.19.option.a:0 "This isn't how I imagined this would go..."
 POD_provoke_vatican.20.t:0 "[adversary.GetFirstNameNicknamedNoTooltip]"
 POD_provoke_vatican.20.desc.coterie:0 "As we start making our way out of the city, a [GetTrait('supehunter').GetName(adversary)] crosses our path. Finally! How exciting.\n\nOur excitement turns into horror when [adversary.GetSheHe] recites a verse. [GetPlayer.Custom('PODPsalm23')]\n\nA sudden sense of frailty overcomes me. The other members of $POD_player_coterie$ aren't faring much better. Clearly, this is a foe not to be trifled with."
 POD_provoke_vatican.20.desc.nocoterie:0 "As I start making my way out of the city, a [GetTrait('supehunter').GetName(adversary)] crosses my path. Finally! How exciting.\n\nMy excitement turns into horror when [adversary.GetSheHe] recites a verse. [GetPlayer.Custom('PODPsalm23')]\n\nA sudden sense of frailty overcomes me. Clearly, this is a foe not to be trifled with."
 POD_provoke_vatican.20.desc.coterie.bishop:0 "With mixed feelings, we walk the streets of [GetTitleByKey('c_roma').GetNameNoTier], pondering what our next step should be. Suddenly, a holy knight crosses our path. How exciting! Maybe [adversary.GetSheHe] can bring us to the Pope?\n\nOur excitement turns into horror when [adversary.GetSheHe] recites a verse. [GetPlayer.Custom('PODPsalm23')]\n\nA sudden sense of frailty overcomes me. The other members of $POD_player_coterie$ aren't faring much better. Then, the knight draws [adversary.GetHerHis] [adversary.Custom('signature_weapon')]. This isn't going the way I hoped..."
 POD_provoke_vatican.20.desc.nocoterie.bishop:0 "With mixed feelings, I walk the streets of [GetTitleByKey('c_roma').GetNameNoTier], pondering what my next step should be. Suddenly, a holy knight crosses my path. How exciting! Maybe [adversary.GetSheHe] can bring me to the Pope?\n\nMy excitement turns into horror when [adversary.GetSheHe] recites a verse. [GetPlayer.Custom('PODPsalm23')]\n\nA sudden sense of frailty overcomes me. Then, the knight draws [adversary.GetHerHis] [adversary.Custom('signature_weapon')]. This isn't going the way I hoped..."
 POD_provoke_vatican.20.desc.coterie.pope:0 "As we start making our way out of the city, a [GetTrait('supehunter').GetName(adversary)] crosses our path. Word of our meeting with the Pope must've traveled fast.\n\nTo make matters worse, [adversary.GetSheHe] starts reciting a verse. [GetPlayer.Custom('PODPsalm23')]\n\nA sudden sense of frailty overcomes me. The other members of $POD_player_coterie$ aren't faring much better. Clearly, this is a foe not to be trifled with."
 POD_provoke_vatican.20.desc.nocoterie.pope:0 "As I start making my way out of the city, a [GetTrait('supehunter').GetName(adversary)] crosses my path. Word of my meeting with the Pope must've traveled fast.\n\nTo make matters worse, [adversary.GetSheHe] starts reciting a verse. [GetPlayer.Custom('PODPsalm23')]\n\nA sudden sense of frailty overcomes me. Clearly, this is a foe not to be trifled with."
 POD_provoke_vatican.20.desc.hunter2.coterie:0 "We hurry through back streets and alleyways, doing our best to stay clear of all [GetTrait('supehunter').GetName(adversary)] patrols. And we almost succeed, until we run into a lone-wolf operator.\n\n[adversary.GetSheHe|U] brandishes [adversary.GetHerHis] spear at us and proclaims: [GetPlayer.Custom('PODPsalm94')]\n\nThe faith of this one is even stronger. This is starting to get annoying..."
 POD_provoke_vatican.20.desc.hunter2.nocoterie:0 "I hurry through back streets and alleyways, doing my best to stay clear of all [GetTrait('supehunter').GetName(adversary)] patrols. And I almost succeed, until I run into a lone-wolf operator.\n\n[adversary.GetSheHe|U] brandishes [adversary.GetHerHis] spear at me and proclaims: [GetPlayer.Custom('PODPsalm94')]\n\nThe faith of this one is even stronger. This is starting to get annoying..."
 POD_provoke_vatican.20.desc.hunter3.coterie:0 "We've almost made it out of the city now. Freedom is so close, I can practically taste it. There seem to be no [GetTrait('supehunter').GetName(adversary)] patrols this far out, either.\n\nThen, a true giant of a [adversary.Custom('WomanManGirlBoy')] steps out of a doorway.\n\n[adversary.GetSheHe|U] raises [adversary.GetHerHis] axe aloft and hollers: [GetPlayer.Custom('PODLordsPrayer')]\n\nWith [adversary.GetHerHis] faith threatening to crush us, we ready ourselves for one final confrontation."
 POD_provoke_vatican.20.desc.hunter3.nocoterie:0 "I've almost made it out of the city now. Freedom is so close, I can practically taste it. There seem to be no [GetTrait('supehunter').GetName(adversary)] patrols this far out, either.\n\nThen, a true giant of a [adversary.Custom('WomanManGirlBoy')] steps out of a doorway.\n\n[adversary.GetSheHe|U] raises [adversary.GetHerHis] axe aloft and hollers: [GetPlayer.Custom('PODLordsPrayer')]\n\nWith [adversary.GetHerHis] faith threatening to crush me, I ready myself for one final confrontation."
 POD_provoke_vatican.20.option.a:0 "If you want to fight me, then let's fight."
 POD_provoke_vatican.20.option.a.tt:0 "You will duel this servant of God yourself."
 POD_provoke_vatican.20.option.b:0 "[prowess_duelist.GetFirstName], this is your time to shine."
 POD_provoke_vatican.21.t:0 "Overcoming Adversity"
 POD_provoke_vatican.21.desc:0 "[adversary.GetFirstNameNicknamed] has been utterly defeated. [adversary.GetHerHis|U] faith is broken, [adversary.GetHerHis] psalms are silenced.\n\nShould I finish [adversary.GetHerHim] off now, or is it better to move on quickly?"
 POD_provoke_vatican.21.desc.drain:0 "\n\nOf course, I could replenish my vitae and take care of this problem, all at once..."
 POD_provoke_vatican.21.desc.sanguine:0 "\n\nThis [GetTrait('supehunter').GetName(adversary)]'s blood is thoroughly suffused with faith. Drinking it would be an extremely bad idea."
 POD_provoke_vatican.21.option.b:0 "I will drain all your blood."
 POD_provoke_vatican.22.t:0 "Unflinching Faith"
 POD_provoke_vatican.22.desc:0 "[adversary.GetFirstNameNicknamed] disarms me and, with the speed of a consummate professional, moves in for the coup de grace.\n\nTime seems to slow down as the events of tonight flash before my eyes. Will other #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L Hunters#!#! become emboldened by my death? Will the mortals now rally around a common cause? Has this whole endeavor been one big mistake?\n\nMy ponderings are cut short when the [GetTrait('supehunter').GetName(adversary)]'s [adversary.Custom('signature_weapon')] strikes my neck."
 POD_provoke_vatican.22.option.a:0 "What will become of my successors, I wonder..."
 POD_provoke_vatican.23.t:0 "At Great Cost"
 POD_provoke_vatican.23.desc:0 "The faith of [adversary.GetFirstNameNicknamed] catches us off guard. [adversary.GetSheHe|U] brandishes [adversary.GetHerHis] crucifix and sanctifies the ground all around [adversary.GetHerselfHimself], which ends up giving [adversary.GetHerHim] a great tactical advantage.\n\nNow we are locked out, and [coterie_loser.GetFirstNameNicknamed] is getting burned where [coterie_loser.GetSheHe] stands.\n\nYet our [ROOT.Char.Custom('PODCoterie')] member isn't willing to go out without a fight, and even as [coterie_loser.GetHerHis] skin blackens and smokes, [coterie_loser.GetSheHe] manages to take the [GetTrait('supehunter').GetName(adversary)] down with [coterie_loser.GetHerHim]."
 POD_provoke_vatican.30.t:0 "The End...?"
 POD_provoke_vatican.30.desc:0 "It is done.\n\nThe Vatican has been taught a lesson in respect, and I lived to tell the tale. The battles were hard-fought, and I came out victorious. Now I get to be the one who writes history."
 POD_provoke_vatican.30.desc.coterie:0 "\n\nYet as I say my goodbyes to the rest of $POD_player_coterie$ and we go our separate ways, the tension does not leave my body. "
 POD_provoke_vatican.30.desc.nocoterie:0 "\n\nAnd yet... the tension does not leave my body. "
 POD_provoke_vatican.30.desc.end:0 "I won, didn't I? Then why can't I shake this sense of dread?\n\nMy apprehension does not abate as I approach the doors of my haven and see that they are wide open.\n\nSomeone's been here.\n\nAnd I certainly didn't invite anyone."
 POD_provoke_vatican.30.option.a:0 "I draw my weapon and prepare for the worst..."
 POD_provoke_vatican.31.t:0 "#TOOLTIP:NICKNAME,nick_vatican_hunter4,[hunter4.GetID] #L 羔羊#!#!"
 POD_provoke_vatican.31.desc.coterie:0 "The other members of $POD_player_coterie$ are lying dead in a heap. In their midst stands an [Select_CString(hunter4.IsFemale,'Inquisitrix','Inquisitor')], framed in a halo of excruciating daylight, resembling a vision of apocalypse.\n\n"
 POD_provoke_vatican.31.desc.nocoterie:0 "The interior of my haven is a smoldering ruin. In its midst stands an [Select_CString(hunter4.IsFemale,'Inquisitrix','Inquisitor')], framed in a halo of excruciating daylight, resembling a vision of apocalypse.\n\n"
 POD_provoke_vatican.31.desc.vampire:0 "[hunter4.GetSheHe|U] does not pray.\n[hunter4.GetSheHe|U] does not speak.\n[hunter4.GetSheHe|U] steps forward, and my blood howls in agony.\n\nRevelations of guilt overcome me. The weight of all the sins of my forefathers, going back all the way to [ROOT.Char.Custom('PODProgenitor')], assaulting me like hungry ghosts, cutting into my mind like knives.\n\nIt burns.\n\n"
 POD_provoke_vatican.31.desc.notvampire:0 "[hunter4.GetSheHe|U] does not pray.\n[hunter4.GetSheHe|U] does not speak.\n[hunter4.GetSheHe|U] steps forward, and [hunter4.GetHerHis] faith reverberates like a clap of thunder.\n\nRevelations of guilt overcome me. The weight of all the sins of my forefathers, threatening to annihilate me, assaulting me like hungry ghosts, cutting into my mind like knives.\n\nIt burns.\n\n"
 POD_provoke_vatican.31.desc.end:0 "I want to scream, but no sound escapes my lips."
 POD_provoke_vatican.31.option.a:0 "You want me? Then come and get me."
 POD_provoke_vatican.31.option.a.tt:0 "A sense of finality overcomes you as you ready your blade one last time..."
 POD_provoke_vatican.32.t:0 "尘归尘"
 POD_provoke_vatican.32.desc:0 "When my weapon strikes the [GetTrait('supehunter').GetName(hunter4)]'s heart, the apocalyptic visions fade. The daylight recedes as well. Was that just a hallucination, too?\n\nI sit amongst the rubble of what used to be my haven and reflect on this journey's events.\n\n"
 POD_provoke_vatican.32.desc.coterie:0 "I made it out in one piece. The same can't be said for the other members of $POD_player_coterie$. Was it my choices that doomed them? Or would the Inquisition have come for them regardless?\n\n"
 POD_provoke_vatican.32.desc.nocoterie:0 "I made it out in one piece. That's what counts, right?\n\n"
 POD_provoke_vatican.32.desc.caelestius.nopope:0 "I made it out in one piece. That's what counts, right? It's a shame I never ended up meeting the Pope. Would he have blessed me, I wonder?\n\n"
 POD_provoke_vatican.32.desc.caelestius.pope:0 "I made it out in one piece. That's what counts, right? It's a shame the meeting with the Pope went the way it did. Was there never a chance he could've blessed me?\n\n"
 POD_provoke_vatican.32.desc.end:0 "Whatever the case may be... I get the feeling that the hardships have only just started."
 POD_provoke_vatican.32.option.a:0 "俗话说“愿你生活在有趣的时代”。"
 POD_provoke_vatican.32.option.a.tt:0 "#TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L 猎人#!#!已经停止追踪你了。目前如此。"
 POD_provoke_vatican.32.option.a.tt2:0 "你的行为已经让你在[world_of_darkness|E]中声名狼藉。要改变你的声誉，恐怕需要一个真正的奇迹……"
 POD_provoke_vatican.33.t:0 "第四个封印"
 POD_provoke_vatican.33.desc:0 "我在这场战斗中感到异常迟缓，就像在浓稠的蜂蜜中行走。现实和虚幻已经交织，我已无法分辨其中的界限……\n\n\n我又看见且听见， 宝座与活物并长老的周围有许多天使的声音； 他们的数目有千千万万;\n\n大声说： 曾被杀的羔羊是配得权柄、 丰富、 智慧、 能力、 尊贵、 荣耀、颂赞的。"
 POD_provoke_vatican.33.option.a:0 "……"
 POD_provoke_vatican.200.t:0 "永不屈服"
 POD_provoke_vatican.200.desc:0 "我一直都是对的。\n\n我还需要再说什么吗？\n\n不，不需要。"
 POD_provoke_vatican.200.option.a:0 "现在我可以说：“我早就告诉过你了。”"