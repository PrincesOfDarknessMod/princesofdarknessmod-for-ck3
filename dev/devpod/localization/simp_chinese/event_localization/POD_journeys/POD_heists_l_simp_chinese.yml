l_simp_chinese:
 POD_heist_suspicion: "[suspicion_with_icon|E]：[CurrentHeist.Var('suspicion').GetValue]"
 POD_heist_coterie: "你的[GetPlayer.Custom('PODCoterie')]：$POD_player_coterie$"
 POD_heist_unexplored_node_tt: "未知地点"
 POD_heist_raise_suspicion_desc: "[suspicion_with_icon|E]将#N 增加#!$VALUE|V0$"
 POD_heist_raise_suspicion_desc_past: "[suspicion_with_icon|E]已#N 增加#!$VALUE|V0$"
 POD_heist_node_location_tt: "这是你当前的位置"
 POD_heist_node_effect_tt: "当你进入该位置时："
 POD_heist_node_isvalid_tt: "从你当前的位置无法到达此地点"
 POD_heist_option_exit: "离开任务。"
 POD_heist_option_exit_tt: "你将带着收集到的财富离开[infiltration|E]。"
 POD_heist_option_money: "$POD_heist_option_vault$"
 POD_heist_title_node_exit: "你在出口处"
 POD_heist_desc_node_exit: "这是你可以进出的地方。\n一旦你达到了[infiltration|E]的目的，你还必须返回出口，这样才能安全离开。"
 POD_heist_title_node_artifact: "无价之宝"
 POD_heist_desc_node_artifact: "找到了\n你找到了你来偷的[artifact|E]\n现在你只需要离开……"
 POD_heist_title_node_event: "意想不到的事情会发生"
 POD_heist_desc_node_event: "有人在向你招手，希望与你交谈。\n他想要什么？只有一个办法可以知道……"
 POD_heist_effect_node_event: "随机事件……也许是好事，也许是坏事。"
 POD_heist_title_node_diplomacy: "急需说客"
 POD_heist_desc_node_diplomacy: "一位廷臣坚持说其之前见过您。\n你最好说服他们，否则会很麻烦。"
 POD_heist_effect_node_diplomacy_success: "你的魅力无人能及"
 POD_heist_effect_node_diplomacy_fail: "你的魅力有人能及"
 POD_heist_effect_node_diplomacy_critfail: "什么不应该做的完美范例"
 POD_heist_title_node_intrigue: "巧妙路过"
 POD_heist_desc_node_intrigue: "这一带的巡逻卫兵还没发现你\n目前而言\n是时候考验一下你的潜行技能了"
 POD_heist_effect_node_intrigue_success: "你如影随形"
 POD_heist_effect_node_intrigue_fail: "你如影显形"
 POD_heist_effect_node_intrigue_critfail: "你如随魔宴"
 POD_heist_title_node_learning: "不起眼的陷阱"
 POD_heist_desc_node_learning: "这条走廊布满了陷阱。\n稍有智慧和建筑学知识就能避开它们。"
 POD_heist_effect_node_learning_success: "呵。小儿科"
 POD_heist_effect_node_learning_fail: "陷阱让你有点吃不消"
 POD_heist_effect_node_learning_critfail: "哎呦喂"
 POD_heist_title_node_money: "已解锁的金库！"
 POD_heist_desc_node_money: "这个房间里堆满了金钱。\n你可以花点时间收集起来，但这样做会提高你的[suspicion|E]。"
 POD_heist_setup_suspicion_tt: "你将在[GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]开始执行[infiltration|E]任务。"
 POD_heist_coterie_member_absent: "@warning_icon!#X [Scope.Char.GetFirstNameNicknamed]将#bold 不#!在该[infiltration|E]中#!"
 POD_heist_trigger_suspicion_event_desc: "@warning_icon!#X 一个周折将在#bold $VALUE|V0$#!嫌疑引发#!"
 POD_heist_trigger_suspicion_event_desc_past: "#N 由于[suspicion_with_icon|E]达到了#bold $VALUE|V0$#!，一个周折引发了。#!"
 POD_heist_trigger_suspicion_event_hint: "#N 在这次[infiltration|E]过程中，未来的[skill|E]检定会更加困难。#!"
 POD_heist_maximum_suspicion_desc: "@warning_icon!#X 你将在#bold [EmptyScope.ScriptValue('suspicion_max')|V0]#!嫌疑时渗透失败#!"
 POD_heist_maximum_suspicion_desc_past: "#N 由于[suspicion_with_icon|E]达到了#bold [EmptyScope.ScriptValue('suspicion_max')|V0]#!，你[infiltration|E]失败#!"
 POD_heist_heist_paused_tt: "在有需要你注意的状况下，你无法移动"
 POD_heist_gain_artifact_desc: "[CurrentHeist.Var('target_artifact').Artifact.Custom('ColorizedArtifactName')]将加入到你的战利品中"
 POD_heist_gain_artifact_desc_past: "[CurrentHeist.Var('target_artifact').Artifact.Custom('ColorizedArtifactName')]被加入到你的战利品中"
 POD_heist_gain_artifact_hint: "一旦离开[infiltration|E]，你将获得所有战利品。"
 POD_heists.100.t: "成功逃脱"
 POD_heists.101.t: "就这样结束了"
 POD_heists.101.desc: "你太走运了。运气终究会用完的。\n\n[heist_imprisoner.GetFirstNameNicknamed]的随从包围了你。无处可逃。你被隐秘押送到一间牢房中。\n\n坐在锁着的牢房里，你突然意识到自己不太可能得到公正的审判。"
 POD_heists.101.a: "当然，这只是暂时的挫折。"
 POD_heists.1001.t: "周折：太受欢迎"
 POD_heists.1001.a: "这很简单。听我解释……"
 POD_heists.1002.t: "周折：[chancellor.GetCouncilTitle]"
 POD_heists.1002.desc: "是[CurrentHeistTarget.GetFirstNamePossessive][chancellor.GetCouncilTitle]，[chancellor.GetFirstNameNicknamed]。\n\n"
 POD_heists.1003.t: "周折：还有一件事……"
 POD_heists.1003.a: "哦，我可以澄清这个简单的误会。"
 POD_heists.1003.b: "别挡路。"
 POD_heists.7777.t: "向说书人复仇"
 POD_heists.7777.desc: "你正准备从[GetScriptedCharacterByHistoryID('POD_wraith_01').GetFirstNameNicknamed]手中窃取[charon_artifact.Custom('ColorizedArtifactName')]。\n\n这听起来像个好主意吗？"
 POD_heists.7777.a: "是啊，没错。"
 POD_heists.7777.b: "不尽然……"
 POD_heist_resource_deltas_tt: "[infiltration|E]期间的净额："
 POD_heist_option_vault: "尽可能多地收集金钱。"
 POD_heist_option_vault_empty: "@warning_icon!#X [CurrentHeist.Var('gold_owner').Char.GetFirstNameNicknamed]没有更多的金钱了#!"
 POD_heist_option_fame: "散布一些关于你自己的谣言。"
 POD_heist_option_gossip: "留下来听听八卦吧。"
 POD_heist_option_destress: "放松一会儿。"
 POD_heist_title_node_empty: "秘密通道！"
 POD_heist_desc_node_empty: "这条走廊空无一人。\n你可以从这里通过，而不必担心引起[suspicion|E]。"
 POD_heist_gain_artifact_toast: "你找到[artifact|E]"
 POD_heist_title_node_vault: "巨大的金库"
 POD_heist_desc_node_vault: "一个堆满金钱的房间。这就是你来这里的目的。\n小心：花费的时间越长，你的[suspicion|E]就会越高。"
 POD_heist_title_node_stewardship: "必要之贿"
 POD_heist_desc_node_stewardship: "有些廷臣发现你在偷偷摸摸。\n他们愿意守口如瓶……但要付出代价。"
 POD_heist_effect_node_stewardship_success: "行贿成功"
 POD_heist_effect_node_stewardship_fail: "廷臣无动于衷"
 POD_heist_effect_node_stewardship_critfail: "你被敲诈了"
 POD_heist_title_node_prowess: "卫兵！"
 POD_heist_desc_node_prowess: "你被巡逻队逮住了。来不及逃跑了。\n守卫不是你的对手，但你能迅速击败他们而不引起注意吗？"
 POD_heist_effect_node_prowess_success: "就像热刀切黄油"
 POD_heist_effect_node_prowess_fail: "你们的混战制造了一些噪音"
 POD_heist_effect_node_prowess_critfail: "像地震一样"
 POD_heist_title_node_fame: "让人印象深刻"
 POD_heist_desc_node_fame: "一些宫廷正在分享著名[Concept('coterie','圈子')|E]的故事。\n你可以通过谈论自己的成就来获得[prestige|E]，但这样做会引起[suspicion|E]。"
 POD_heist_title_node_gossip: "宫廷谈话"
 POD_heist_desc_node_gossip: "仆人们正在分享多汁的八卦。\n你可以花些时间倾听，从中获得[secrets|E]或[hooks|E]，但这样做会提升你的[suspicion|E]。"
 POD_heist_effect_node_gossip: "你了解了[CurrentHeist.Var('court_owner').Char.GetFirstNameNicknamed]的[secret|E]或获得了[hook|E]。"
 POD_heist_title_node_destress: "享受款待"
 POD_heist_desc_node_destress: "这是一间为宫廷客人提供便利设施的休息室。\n你可以在这里放松一下，消除[stress|E]，但这样做会提升你的[suspicion|E]。"
 POD_heist_arrival_title: "渗透开始了"
 POD_heist_arrival_confirm: "这将是一个难忘的夜晚。"
 POD_heist_arrival_decline: "我改变主意了。我们回头吧"
 POD_heists.1.desc.coterie: "我们到了。\n\n[PlayerJourneyArtifact.GetOwner.GetShortUINamePossessive]的守卫还没有招手让$POD_player_coterie$进去，我们就进去了。当然，我们本该要在这里。没有理由不这么想。\n\n完全没有。\n\n现在我们要做的就是获得宝库的钥匙，找到[PlayerJourneyArtifact.GetName]，然后不慌不忙地带走它。"
 POD_heists.1.desc.nocoterie: "我到了。\n\n[PlayerJourneyArtifact.GetOwner.GetShortUINamePossessive]的守卫还没有招手让我进去，我就进去了。当然，我本该要在这里。没有理由不这么想。\n\n完全没有。\n\n现在我要做的就是获得宝库的钥匙，找到[PlayerJourneyArtifact.GetName]，然后不慌不忙地带走它。"
 POD_heists.2.desc.coterie: "我们到了。\n\n[PlayerJourneyTarget.GetShortUINamePossessive]的守卫还没有招手让$POD_player_coterie$进去，我们就进去了。当然，我们本该要在这里。没有理由不这么想。\n\n完全没有。\n\n现在我们要做的就是获得钥匙，找到[PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip]的金库，然后不慌不忙地装满我们的口袋。"
 POD_heists.2.desc.nocoterie: "我到了。\n\n[PlayerJourneyTarget.GetShortUINamePossessive]的守卫还没有招手让我进去，我就进去了。当然，我本该要在这里。没有理由不这么想。\n\n完全没有。\n\n现在我要做的就是获得钥匙，找到[PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip]的金库，然后不慌不忙地装满我的口袋。"
 POD_heists.100.desc.coterie: "我们离开了[CurrentHeistTarget.GetShortUIName]的宫廷。终于自由了。\n\n"
 POD_heists.100.desc.nocoterie: "我离开了[CurrentHeistTarget.GetShortUIName]的宫廷。终于自由了。\n\n"
 POD_heists.100.desc.artifact: "[displayed_artifact.GetName]在我的背包里很安全。没人看到我拿走了它。在我看来，这是一次巨大的成功。"
 POD_heists.100.desc.noartifact: "我没能获取[CurrentHeist.Var('target_artifact').Artifact.GetName]。这一次而言。略有失望，但下次我会准备得更充分。"
 POD_heists.100.desc.gold: "由于我的努力，[CurrentHeistTarget.GetHerHis|U]金库少了[gold_i|E][CurrentHeist.Var('stolen_gold').GetValue|V0] 。这次行动还不错。"
 POD_heists.100.desc.nogold: "这一次，我没能偷到任何[gold|E]。这肯定让我失望，但下次我会做更充分的准备。"
 POD_heists.100.a.success.coterie: "$POD_player_coterie$的又一次胜利。"
 POD_heists.100.a.success.nocoterie: "我的腰带上又多了一个胜利标记。"
 POD_heists.100.a.failure: "我已经在计划下一步行动了……"
 POD_heists.1001.desc.coterie: "到目前为止，我们的[infiltration|E]进展顺利……事实上，有点太顺利了。没有人怀疑我们的“外交使团”身份，所以我们不得不回答很多关于外交关系的问题。"
 POD_heists.1001.desc.nocoterie: "到目前为止，我的[infiltration|E]进展顺利……事实上，有点太顺利了。没有人怀疑我的“外交使者”身份，所以我不得不回答很多关于外交关系的问题。"
 POD_heists.1001.desc.end: "\n\n[diplomacy_courtier.GetFirstNameNicknamed]清了清[diplomacy_courtier.GetHerHis]喉咙。“面对日益增长的[flavortext_realm.GetAdjective]扩张主义威胁，您建议该如何应对？”"
 POD_heists.1001.a.success: "你的掩护身份保持成立"
 POD_heists.1001.a.failure: "存在一些不一致之处"
 POD_heists.1001.b.coterie: "失陪一下。"
 POD_heists.1001.b.nocoterie: "失陪一下。"
 POD_heists.1002.t.target: "周折：[chancellor.Custom('WomanManGirlBoy')][chancellor.GetHerselfHimself]"
 POD_heists.1002.desc.coterie: "我们设法躲开了嗡嗡作响的廷臣群，但我们的反常举动似乎引起了某人的注意。\n\n"
 POD_heists.1002.desc.nocoterie: "我设法躲开了嗡嗡作响的廷臣群，但我的反常举动似乎引起了某人的注意。\n\n"
 POD_heists.1002.desc.target: "是[chancellor.GetFirstNameNicknamed]，不是别人，正是负责人。\n\n"
 POD_heists.1002.desc.end.coterie: "[chancellor.GetSheHe|U]邀请我们就重要的政治问题进行更深入的交谈，这也是我们外交官的职责所在。"
 POD_heists.1002.desc.end.nocoterie: "[chancellor.GetSheHe|U]邀请我就重要的政治问题进行更深入的交谈，这也是我外交官的职责所在。"
 POD_heists.1002.desc.end: "\n\n[chancellor.GetSheHe]怀疑什么吗？[chancellor.GetHerHis|U]的表情让人看不懂。"
 POD_heists.1002.a.coterie: "当然。我们会加入你的。"
 POD_heists.1002.a.nocoterie: "当然。我会加入你的。"
 POD_heists.1002.a.success: "你们聊得很开心"
 POD_heists.1002.a.failure: "你看起来很阴晴不定"
 POD_heists.1002.b.coterie: "我们必须谢绝。"
 POD_heists.1002.b.nocoterie: "我必须谢绝。"
 POD_heists.1003.desc.coterie: "[chancellor.GetFirstNameNicknamed]再次闯入我们的视线，让自身看起来随意的试图过猛，以至于达到了滑稽的状态。"
 POD_heists.1003.desc.nocoterie: "[chancellor.GetFirstNameNicknamed]再次闯入我的视线，让自身看起来随意的试图过猛，以至于达到了滑稽的状态。"
 POD_heists.1003.desc.end: "\n\n“哦，听着，我还想问你一件事”，[chancellor.GetSheHe]开始说。“一位仆人告诉我，他们看到你经常待在禁止访客进入的地方。听起来很傻，我知道。无论如何，我只是想再确认一下您的证件，这只是一个小小的手续……”"
 POD_heists.1003.a.success: "原来你有"
 POD_heists.1003.a.failure: "原来你没有"
 POD_heist_wounded_toast: "你受伤了"
 POD_heists.1021.t: "周折：纠纷"
 POD_heists.1021.desc: "这次外出的一些事情激发出了$POD_player_coterie$最坏的一面。\n\n我们为小事争吵。然后，又为一些非小事争吵。无论如何，我们都无法就如何进行[infiltration|E]达成一致。礼貌性的分歧变成了毒舌。\n\n这可不是让任务成功的好兆头。"
 POD_heists.1021.a: "我们必须保持理智和专注"
 POD_heists.1021.a.success: "听起来很有说服力"
 POD_heists.1021.a.failure: "听起来很有侮辱性"
 POD_heists.1021.b: "按计划行事。"
 POD_heists.1021.b.success: "你是天生的领袖"
 POD_heists.1021.b.failure: "没门"
 POD_heists.1021.c: "我猜他们需要发泄一下。"
 POD_heists.1022.t: "周折：门"
 POD_heists.1022.desc: "我们遇到对手了。\n\n是一扇门。\n\n半个小时以来，我们一直在争论。如何才能最好地打开它的锁。或者是摧毁它。还是绕过它 。还是把它解开。半小时！这太荒唐了。"
 POD_heists.1022.a: "如果我们集思广益，就能克服这一挑战。"
 POD_heists.1022.a.success: "智慧占据上风"
 POD_heists.1022.a.failure: "什么智慧？"
 POD_heists.1022.b: "听我指挥。"
 POD_heists.1022.b.success: "你的领导才能占上风"
 POD_heists.1022.b.failure: "什么领导才能？"
 POD_heists.1022.c: "把这该死的东西砸开。"
 POD_heists.1023.t: "周折：吸取教训？"
 POD_heists.1023.desc: "纷争可以拉近人与人之间的距离。当分歧得到解决，就会加深友谊。今晚，我们了解到了这种团队建设经验的价值。\n\n开玩笑的。$POD_player_coterie$还在战斗。\n\n照这样下去，我们中总有一个人会留下什么罪证。"
 POD_heists.1023.a: "我仍然认为这可能是一次学习经验。"
 POD_heists.1023.a.success: "你的[GetPlayer.Custom('PODCoterieNoTooltip')]赞同"
 POD_heists.1023.a.failure: "你完全没有看清房间里的情况"
 POD_heists.1023.b: "合作符合我们的最佳利益。"
 POD_heists.1023.b.success: "原来你很擅长赶猫"
 POD_heists.1023.b.failure: "那些猫不喜欢被赶着走"
 POD_heists.1023.c: "闭嘴！所有人。"
 POD_heists.1051.t: "周折：小菜一碟"
 POD_heists.1051.desc: "并不是每次计划都能如此顺利。\n\n今夜，$POD_player_coterie$[GetPlayer.Custom('PODCoterie')]真的是大显身手。我们正围着这漠视的宫廷转大圈。一群傻瓜！没人有任何怀疑。\n\n[coterie_member.GetFirstNameNicknamed]向我眨了眨眼睛，显然和我一样乐在其中。"
 POD_heists.1051.a: "这一次，我们可以放松警惕了。"
 POD_heists.1051.b: "我们还是别太大意了。"
 POD_heists.1052.t: "周折：刺激"
 POD_heists.1052.desc: "$POD_player_coterie$周围的压力越来越大，但这只会让事情变得更加刺激。[GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]的宫廷是否怀疑有人在搞鬼？这重要吗？反正他们也抓不到我们。\n\n像这样的表现将使$POD_player_coterie$成为一个值得传奇的[GetPlayer.Custom('PODCoterie')]。"
 POD_heists.1052.a: "他们会讲述我们在家乡的传奇故事。"
 POD_heists.1052.b: "最好保持谦虚，低调行事。"
 POD_heists.1053.t: "周折：成功之苦"
 POD_heists.1053.desc: "[court_owner.GetFirstNameNicknamed]也赶来见证这一盛况。\n\n但可惜的是，[court_owner.GetSheHe|U]根本就没有意识到这场盛演正在上演。$POD_player_coterie$的精湛技艺是如此之高，以至于人们不得不对它敬而远之。\n\n但一定要这样吗？一个疯狂的计划在我脑海中形成……"
 POD_heists.1053.a: "“嘿，你知道有人潜入你的宫廷了吗？”"
 POD_heists.1053.b: "我没“那么”疯。"
 POD_heists.1053.b.mad: "我是疯了，但没“那么”疯。"
 POD_heists.1011.t: "周折：拔刀"
 POD_heists.1011.desc.coterie: "我们选择了最糟糕的时机潜入[GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]。"
 POD_heists.1011.desc.nocoterie: "我选择了最糟糕的时机潜入[GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]。"
 POD_heists.1011.desc: "一些领土争端让这宫廷沸沸扬扬。有人说要开战\n\n紧张气氛浓得可以用刀子割开。这里的每个人都在找借口割断别人的喉咙。"
 POD_heists.1011.desc.end.coterie: "作为场上的新人，我们是公平竞争的对象。\n\n[potential_rival.GetFirstNameNicknamed]向我们喊话：“你们是支持我们？还是反对我们？”"
 POD_heists.1011.desc.end.nocoterie: "作为场上的新人，我是公平竞争的对象。\n\n[potential_rival.GetFirstNameNicknamed]向我喊话：“你是支持我们？还是反对我们？”"
 POD_heists.1011.a.coterie: "我们支持你。"
 POD_heists.1011.a.nocoterie: "我支持你。"
 POD_heists.1011.a.success: "你的声援看起来很认真"
 POD_heists.1011.a.failure: "不是很有说服力"
 POD_heists.1011.b: "我试着转移话题。"
 POD_heists.1011.b.success: "你的花招奏效了"
 POD_heists.1011.b.failure: "重大失误"
 POD_heists.1011.c.coterie: "你敢质疑我们？"
 POD_heists.1011.c.nocoterie: "你敢质疑我？"
 POD_heists.1012.t.spymaster: "周折：[spymaster.GetCouncilTitle]"
 POD_heists.1012.t.rando: "周折：阴谋家"
 POD_heists.1012.desc.coterie: "宫廷的激进气氛让我们的计划变得复杂。我们躲进了一旁的走廊，想重整旗鼓，讨论下一步行动。但我们并不孤单。\n\n"
 POD_heists.1012.desc.nocoterie: "宫廷的激进气氛让我的计划变得复杂。我躲进了一旁的走廊，想重整旗鼓，思考下一步行动。但我并不孤单。\n\n"
 POD_heists.1012.desc.spymaster: "从阴影中几乎看不到[spymaster.GetFirstNamePossessive]的笑容。真巧，在这里遇到了[spymaster.GetCouncilTitle][CurrentHeistTarget.GetFirstNamePossessive]。\n\n"
 POD_heists.1012.desc.rando: "从阴影中几乎看不到[spymaster.GetFirstNamePossessive]的笑容。真巧，在这里碰到了这个世界上最多谋的阴谋家。\n\n"
 POD_heists.1012.desc.end: "“别在意我。”[spymaster.GetSheHe]说，“我只是在巡视，监视对王冠的威胁。”"
 POD_heists.1012.a.coterie: "我们与你无怨无仇。"
 POD_heists.1012.a.nocoterie: "我与你无怨无仇。"
 POD_heists.1012.a.success: "[spymaster.GetFirstName]感到满意"
 POD_heists.1012.a.failure: "[spymaster.GetFirstName]盯紧了你"
 POD_heists.1012.b: "你应该更担心这宫廷的其他人。"
 POD_heists.1012.b.success: "你成功转移了[spymaster.GetHerHis]的注意力"
 POD_heists.1012.b.failure: "这正是想做坏事的人会说的话"
 POD_heists.1012.c: "去别的地方溜达吧。"
 POD_heists.1013.t: "周折：主要反派"
 POD_heists.1013.desc: "现在，[court_owner.GetFirstNameNicknamed]也对此事产生了浓厚的兴趣。[court_owner.GetSheHe|U]正像一只鹰一样注视着宫廷上的争论、"
 POD_heists.1013.desc.coterie: "[court_owner.GetHerHis]的目光经常在我们身上徘徊。\n\n如果[infiltration|E]要继续下去，我们必须对[court_owner.GetHerHim]做点什么。"
 POD_heists.1013.desc.nocoterie: "[court_owner.GetHerHis]的目光经常在我身上徘徊。\n\n如果[infiltration|E]要继续下去，我必须对[court_owner.GetHerHim]做点什么。"
 POD_heists.1013.a.coterie: "我们假装支持[court_owner.GetHerHis]的统治。"
 POD_heists.1013.a.nocoterie: "我假装支持[court_owner.GetHerHis]的统治。"
 POD_heists.1013.a.success: "拍马屁总是有用的"
 POD_heists.1013.a.failure: "拍马屁总是有用的，除非拍不响"
 POD_heists.1013.b.coterie: "我们试图隐藏在人群中。"
 POD_heists.1013.b.nocoterie: "我试图隐藏在人群中。"
 POD_heists.1013.b.success: "你消失了"
 POD_heists.1013.b.failure: "你吸引更多的关注"
 POD_heists.1013.c: "[court_owner.GetSheHe|U]可以随便[court_owner.GetSheHe]怎么想。"
