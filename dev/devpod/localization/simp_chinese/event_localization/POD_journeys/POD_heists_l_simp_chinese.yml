l_simp_chinese:
 POD_heist_suspicion: "[suspicion_with_icon|E]：[CurrentHeist.Var('suspicion').GetValue]"
 POD_heist_coterie: "你的[GetPlayer.Custom('PODCoterie')]：$POD_player_coterie$"
 POD_heist_unexplored_node_tt: "未知地点"
 POD_heist_raise_suspicion_desc: "[suspicion_with_icon|E]将#N 增加#!$VALUE|V0$"
 POD_heist_raise_suspicion_desc_past: "[suspicion_with_icon|E]已#N 增加#!$VALUE|V0$"
 POD_heist_node_location_tt: "这是你当前的位置"
 POD_heist_node_effect_tt: "当你进入该位置时："
 POD_heist_node_isvalid_tt: "从你当前的位置无法到达此地点"
 POD_heist_option_exit: "离开任务。"
 POD_heist_option_exit_tt: "你将带着收集到的财富离开[infiltration|E]。"
 POD_heist_option_money: "$POD_heist_option_vault$"
 POD_heist_title_node_exit: "你在出口处"
 POD_heist_desc_node_exit: "这是你可以进出的地方。\n一旦你达到了[infiltration|E]的目的，你还必须返回出口，这样才能安全离开。"
 POD_heist_title_node_artifact: "无价之宝"
 POD_heist_desc_node_artifact: "找到了\n你找到了你来偷的[artifact|E]\n现在你只需要离开……"
 POD_heist_title_node_event: "意想不到的事情会发生"
 POD_heist_desc_node_event: "有人在向你招手，希望与你交谈。\n他想要什么？只有一个办法可以知道……"
 POD_heist_effect_node_event: "随机事件……也许是好事，也许是坏事。"
 POD_heist_title_node_diplomacy: "急需说客"
 POD_heist_desc_node_diplomacy: "一位廷臣坚持说其之前见过您。\n你最好说服他们，否则会很麻烦。"
 POD_heist_effect_node_diplomacy_success: "你的魅力无人能及"
 POD_heist_effect_node_diplomacy_fail: "你的魅力有人能及"
 POD_heist_effect_node_diplomacy_critfail: "什么不应该做的完美范例"
 POD_heist_title_node_intrigue: "巧妙路过"
 POD_heist_desc_node_intrigue: "这一带的巡逻卫兵还没发现你\n目前而言\n是时候考验一下你的潜行技能了"
 POD_heist_effect_node_intrigue_success: "你如影随形"
 POD_heist_effect_node_intrigue_fail: "你如影显形"
 POD_heist_effect_node_intrigue_critfail: "你如随魔宴"
 POD_heist_title_node_learning: "不起眼的陷阱"
 POD_heist_desc_node_learning: "这条走廊布满了陷阱。\n稍有智慧和建筑学知识就能避开它们。"
 POD_heist_effect_node_learning_success: "呵。小儿科"
 POD_heist_effect_node_learning_fail: "陷阱让你有点吃不消"
 POD_heist_effect_node_learning_critfail: "哎呦喂"
 POD_heist_title_node_money: "已解锁的金库！"
 POD_heist_desc_node_money: "这个房间里堆满了金钱。\n你可以花点时间收集起来，但这样做会提高你的[suspicion|E]。"
 POD_heist_setup_suspicion_tt: "你将在[GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]开始执行[infiltration|E]任务。"
 POD_heist_coterie_member_absent: "@warning_icon!#X [Scope.Char.GetFirstNameNicknamed]将#bold 不#!在该[infiltration|E]中#!"
 POD_heist_trigger_suspicion_event_desc: "@warning_icon!#X 一个周折将在#bold $VALUE|V0$#!嫌疑引发#!"
 POD_heist_trigger_suspicion_event_desc_past: "#N 由于[suspicion_with_icon|E]达到了#bold $VALUE|V0$#!，一个周折引发了。#!"
 POD_heist_trigger_suspicion_event_hint: "#N 在这次[infiltration|E]过程中，未来的[skill|E]检定会更加困难。#!"
 POD_heist_maximum_suspicion_desc: "@warning_icon!#X 你将在#bold [EmptyScope.ScriptValue('suspicion_max')|V0]#!嫌疑时渗透失败#!"
 POD_heist_maximum_suspicion_desc_past: "#N 由于[suspicion_with_icon|E]达到了#bold [EmptyScope.ScriptValue('suspicion_max')|V0]#!，你[infiltration|E]失败#!"
 POD_heist_heist_paused_tt: "在有需要你注意的状况下，你无法移动"
 POD_heist_gain_artifact_desc: "[CurrentHeist.Var('target_artifact').Artifact.Custom('ColorizedArtifactName')]将加入到你的战利品中"
 POD_heist_gain_artifact_desc_past: "[CurrentHeist.Var('target_artifact').Artifact.Custom('ColorizedArtifactName')]被加入到你的战利品中"
 POD_heist_gain_artifact_hint: "一旦离开[infiltration|E]，你将获得所有战利品。"
 POD_heists.100.t: "成功逃脱"
 POD_heists.101.t: "就这样结束了"
 POD_heists.101.desc: "你太走运了。运气终究会用完的。\n\n[heist_imprisoner.GetFirstNameNicknamed]的随从包围了你。无处可逃。你被隐秘押送到一间牢房中。\n\n坐在锁着的牢房里，你突然意识到自己不太可能得到公正的审判。"
 POD_heists.101.a: "当然，这只是暂时的挫折。"
 POD_heists.1001.t: "周折：太受欢迎"
 POD_heists.1001.a: "这很简单。听我解释……"
 POD_heists.1002.t: "周折：[chancellor.GetCouncilTitle]"
 POD_heists.1002.desc: "是[CurrentHeistTarget.GetFirstNamePossessive][chancellor.GetCouncilTitle]，[chancellor.GetFirstNameNicknamed]。\n\n"
 POD_heists.1003.t: "周折：还有一件事……"
 POD_heists.1003.a: "哦，我可以澄清这个简单的误会。"
 POD_heists.1003.b: "别挡路。"
 POD_heists.7777.t: "向说书人复仇"
 POD_heists.7777.desc: "你正准备从[GetScriptedCharacterByHistoryID('POD_wraith_01').GetFirstNameNicknamed]手中窃取[charon_artifact.Custom('ColorizedArtifactName')]。\n\n这听起来像个好主意吗？"
 POD_heists.7777.a: "是啊，没错。"
 POD_heists.7777.b: "不尽然……"
 POD_heist_resource_deltas_tt: "[infiltration|E]期间的净额："
 POD_heist_option_vault: "尽可能多地收集金钱。"
 POD_heist_option_vault_empty: "@warning_icon!#X [CurrentHeist.Var('gold_owner').Char.GetFirstNameNicknamed]没有更多的金钱了#!"
 POD_heist_option_fame: "散布一些关于你自己的谣言。"
 POD_heist_option_gossip: "搜索文件。"
 POD_heist_option_destress: "放松一会儿。"
 POD_heist_title_node_empty: "秘密通道！"
 POD_heist_desc_node_empty: "这条走廊空无一人。\n你可以从这里通过，而不必担心引起[suspicion|E]。"
 POD_heist_gain_artifact_toast: "你找到[artifact|E]"
 POD_heist_title_node_vault: "巨大的金库"
 POD_heist_desc_node_vault: "一个堆满金钱的房间。这就是你来这里的目的。\n小心：花费的时间越长，你的[suspicion|E]就会越高。"
 POD_heist_title_node_stewardship: "必要之贿"
 POD_heist_desc_node_stewardship: "有些廷臣发现你在偷偷摸摸。\n他们愿意守口如瓶……但要付出代价。"
 POD_heist_effect_node_stewardship_success: "行贿成功"
 POD_heist_effect_node_stewardship_fail: "廷臣无动于衷"
 POD_heist_effect_node_stewardship_critfail: "你被敲诈了"
 POD_heist_title_node_prowess: "卫兵！"
 POD_heist_desc_node_prowess: "你被巡逻队逮住了。来不及逃跑了。\n守卫不是你的对手，但你能迅速击败他们而不引起注意吗？"
 POD_heist_effect_node_prowess_success: "就像热刀切黄油"
 POD_heist_effect_node_prowess_fail: "你们的混战制造了一些噪音"
 POD_heist_effect_node_prowess_critfail: "像地震一样"
 POD_heist_title_node_fame: "让人印象深刻"
 POD_heist_desc_node_fame: "一些宫廷正在分享著名[coteries|E]的故事。\n你可以通过谈论自己的成就来获得[prestige|E]，但这样做会引起[suspicion|E]。"
 POD_heist_title_node_gossip: "秘密文件"
 POD_heist_desc_node_gossip: "这个房间里有信件、账簿和其他不当行为的书面证据。\n你可以花些时间搜索，从中获得[secrets|E]或[hooks|E]，但这样做会提升你的[suspicion|E]。"
 POD_heist_effect_node_gossip: "你了解了[CurrentHeist.Var('court_owner').Char.GetFirstNameNicknamed]的[secret|E]或获得了[hook|E]。"
 POD_heist_title_node_destress: "享受款待"
 POD_heist_desc_node_destress: "这是一间为宫廷客人提供便利设施的休息室。\n你可以在这里放松一下，消除[stress|E]，但这样做会提升你的[suspicion|E]。"
 POD_heist_arrival_title: "渗透开始了"
 POD_heist_arrival_confirm: "这将是一个难忘的夜晚。"
 POD_heist_arrival_decline: "我改变主意了。我们回头吧"
 POD_heists.1.desc.coterie: "我们到了。\n\n[PlayerJourneyArtifact.GetOwner.GetShortUINamePossessive][PlayerJourneyArtifact.GetOwner.Custom('PODDomicile')]的守卫还没有招手让$POD_player_coterie$进去，我们就进去了。当然，我们本该要在这里。没有理由不这么想。\n\n完全没有。\n\n现在我们要做的就是获得宝库的钥匙，找到[PlayerJourneyArtifact.GetName]，然后不慌不忙地带走它。"
 POD_heists.1.desc.nocoterie: "我到了。\n\n[PlayerJourneyArtifact.GetOwner.GetShortUINamePossessive][PlayerJourneyArtifact.GetOwner.Custom('PODDomicile')]的守卫还没有招手让我进去，我就进去了。当然，我本该要在这里。没有理由不这么想。\n\n完全没有。\n\n现在我要做的就是获得宝库的钥匙，找到[PlayerJourneyArtifact.GetName]，然后不慌不忙地带走它。"
 POD_heists.2.desc.coterie: "我们到了。\n\n[PlayerJourneyTarget.GetShortUINamePossessive][PlayerJourneyTarget.Custom('PODDomicile')]的守卫还没有招手让$POD_player_coterie$进去，我们就进去了。当然，我们本该要在这里。没有理由不这么想。\n\n完全没有。\n\n现在我们要做的就是获得钥匙，找到[PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip]的金库，然后不慌不忙地装满我们的口袋。"
 POD_heists.2.desc.nocoterie: "我到了。\n\n[PlayerJourneyTarget.GetShortUINamePossessive][PlayerJourneyTarget.Custom('PODDomicile')]的守卫还没有招手让我进去，我就进去了。当然，我本该要在这里。没有理由不这么想。\n\n完全没有。\n\n现在我要做的就是获得钥匙，找到[PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip]的金库，然后不慌不忙地装满我的口袋。"
 POD_heists.100.desc.coterie: "我们离开了[CurrentHeistTarget.GetShortUIName]的宫廷。终于自由了。\n\n"
 POD_heists.100.desc.nocoterie: "我离开了[CurrentHeistTarget.GetShortUIName]的宫廷。终于自由了。\n\n"
 POD_heists.100.desc.artifact: "[displayed_artifact.GetName]在我的背包里很安全。没人看到我拿走了它。在我看来，这是一次巨大的成功。"
 POD_heists.100.desc.noartifact: "我没能获取[CurrentHeist.Var('target_artifact').Artifact.GetName]。这一次而言。略有失望，但下次我会准备得更充分。"
 POD_heists.100.desc.gold: "由于我的努力，[CurrentHeistTarget.GetHerHis|U]金库少了[gold_i|E][CurrentHeist.Var('stolen_gold').GetValue|V0]。这次行动还不错。"
 POD_heists.100.desc.nogold: "这一次，我没能偷到任何[gold|E]。这肯定让我失望，但下次我会做更充分的准备。"
 POD_heists.100.a.success.coterie: "$POD_player_coterie$的又一次胜利。"
 POD_heists.100.a.success.nocoterie: "我的腰带上又多了一个胜利标记。"
 POD_heists.100.a.failure: "我已经在计划下一步行动了……"
 POD_heists.1001.desc.coterie: "到目前为止，我们的[infiltration|E]进展顺利……事实上，有点太顺利了。没有人怀疑我们的“外交使团”身份，所以我们不得不回答很多关于外交关系的问题。"
 POD_heists.1001.desc.nocoterie: "到目前为止，我的[infiltration|E]进展顺利……事实上，有点太顺利了。没有人怀疑我的“外交使者”身份，所以我不得不回答很多关于外交关系的问题。"
 POD_heists.1001.desc.end: "\n\n[diplomacy_courtier.GetFirstNameNicknamed]清了清[diplomacy_courtier.GetHerHis]喉咙。“面对日益增长的[flavortext_realm.GetAdjective]扩张主义威胁，您建议该如何应对？”"
 POD_heists.1001.a.success: "你的掩护身份保持成立"
 POD_heists.1001.a.failure: "存在一些不一致之处"
 POD_heists.1001.b.coterie: "失陪一下。"
 POD_heists.1001.b.nocoterie: "失陪一下。"
 POD_heists.1002.t.target: "周折：[chancellor.Custom('WomanManGirlBoy')][chancellor.GetHerselfHimself]"
 POD_heists.1002.desc.coterie: "我们设法躲开了嗡嗡作响的廷臣群，但我们的反常举动似乎引起了某人的注意。\n\n"
 POD_heists.1002.desc.nocoterie: "我设法躲开了嗡嗡作响的廷臣群，但我的反常举动似乎引起了某人的注意。\n\n"
 POD_heists.1002.desc.target: "是[chancellor.GetFirstNameNicknamed]，不是别人，正是负责人。\n\n"
 POD_heists.1002.desc.end.coterie: "[chancellor.GetSheHe|U]邀请我们就重要的政治问题进行更深入的交谈，这也是我们外交官的职责所在。"
 POD_heists.1002.desc.end.nocoterie: "[chancellor.GetSheHe|U]邀请我就重要的政治问题进行更深入的交谈，这也是我外交官的职责所在。"
 POD_heists.1002.desc.end: "\n\n[chancellor.GetSheHe]怀疑什么吗？[chancellor.GetHerHis|U]的表情让人看不懂。"
 POD_heists.1002.a.coterie: "当然。我们会加入你的。"
 POD_heists.1002.a.nocoterie: "当然。我会加入你的。"
 POD_heists.1002.a.success: "你们聊得很开心"
 POD_heists.1002.a.failure: "你看起来很阴晴不定"
 POD_heists.1002.b.coterie: "我们必须谢绝。"
 POD_heists.1002.b.nocoterie: "我必须谢绝。"
 POD_heists.1003.desc.coterie: "[chancellor.GetFirstNameNicknamed]再次闯入我们的视线，让自身看起来随意的试图过猛，以至于达到了滑稽的状态。"
 POD_heists.1003.desc.nocoterie: "[chancellor.GetFirstNameNicknamed]再次闯入我的视线，让自身看起来随意的试图过猛，以至于达到了滑稽的状态。"
 POD_heists.1003.desc.end: "\n\n“哦，听着，我还想问你一件事”，[chancellor.GetSheHe]开始说。“一位仆人告诉我，他们看到你经常待在禁止访客进入的地方。听起来很傻，我知道。无论如何，我只是想再确认一下您的证件，这只是一个小小的手续……”"
 POD_heists.1003.a.success: "原来你有"
 POD_heists.1003.a.failure: "原来你没有"
 POD_heist_wounded_toast: "你受伤了"
 POD_heists.1021.t: "周折：纠纷"
 POD_heists.1021.desc: "这次外出的一些事情激发出了$POD_player_coterie$最坏的一面。\n\n我们为小事争吵。然后，又为一些非小事争吵。无论如何，我们都无法就如何进行[infiltration|E]达成一致。礼貌性的分歧变成了毒舌。\n\n这可不是让任务成功的好兆头。"
 POD_heists.1021.a: "我们必须保持理智和专注"
 POD_heists.1021.a.success: "听起来很有说服力"
 POD_heists.1021.a.failure: "听起来很有侮辱性"
 POD_heists.1021.b: "按计划行事。"
 POD_heists.1021.b.success: "你是天生的领袖"
 POD_heists.1021.b.failure: "没门"
 POD_heists.1021.c: "我猜他们需要发泄一下。"
 POD_heists.1022.t: "周折：门"
 POD_heists.1022.desc: "我们遇到对手了。\n\n是一扇门。\n\n半个小时以来，我们一直在争论。如何才能最好地打开它的锁。或者是摧毁它。还是绕过它 。还是把它解开。半小时！这太荒唐了。"
 POD_heists.1022.a: "如果我们集思广益，就能克服这一挑战。"
 POD_heists.1022.a.success: "智慧占据上风"
 POD_heists.1022.a.failure: "什么智慧？"
 POD_heists.1022.b: "听我指挥。"
 POD_heists.1022.b.success: "你的领导才能占上风"
 POD_heists.1022.b.failure: "什么领导才能？"
 POD_heists.1022.c: "把这该死的东西砸开。"
 POD_heists.1023.t: "周折：吸取教训？"
 POD_heists.1023.desc: "纷争可以拉近人与人之间的距离。当分歧得到解决，就会加深友谊。今晚，我们了解到了这种团队建设经验的价值。\n\n开玩笑的。$POD_player_coterie$还在战斗。\n\n照这样下去，我们中总有一个人会留下什么罪证。"
 POD_heists.1023.a: "我仍然认为这可能是一次学习经验。"
 POD_heists.1023.a.success: "你的[GetPlayer.Custom('PODCoterieNoTooltip')]赞同"
 POD_heists.1023.a.failure: "你完全没有看清房间里的情况"
 POD_heists.1023.b: "合作符合我们的最佳利益。"
 POD_heists.1023.b.success: "原来你很擅长赶猫"
 POD_heists.1023.b.failure: "那些猫不喜欢被赶着走"
 POD_heists.1023.c: "闭嘴！所有人。"
 POD_heists.1051.t: "周折：小菜一碟"
 POD_heists.1051.desc: "并不是每次计划都能如此顺利。\n\n今夜，$POD_player_coterie$[GetPlayer.Custom('PODCoterie')]真的是大显身手。我们正围着这漠视的宫廷转大圈。一群傻瓜！没人有任何怀疑。\n\n[coterie_member.GetFirstNameNicknamed]向我眨了眨眼睛，显然和我一样乐在其中。"
 POD_heists.1051.a: "这一次，我们可以放松警惕了。"
 POD_heists.1051.b: "我们还是别太大意了。"
 POD_heists.1052.t: "周折：刺激"
 POD_heists.1052.desc: "$POD_player_coterie$周围的压力越来越大，但这只会让事情变得更加刺激。[GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]的宫廷是否怀疑有人在搞鬼？这重要吗？反正他们也抓不到我们。\n\n像这样的表现将使$POD_player_coterie$成为一个值得传奇的[GetPlayer.Custom('PODCoterie')]。"
 POD_heists.1052.a: "他们会讲述我们在家乡的传奇故事。"
 POD_heists.1052.b: "最好保持谦虚，低调行事。"
 POD_heists.1053.t: "周折：成功之苦"
 POD_heists.1053.desc: "[court_owner.GetFirstNameNicknamed]也赶来见证这一盛况。\n\n但可惜的是，[court_owner.GetSheHe|U]根本就没有意识到这场盛演正在上演。$POD_player_coterie$的精湛技艺是如此之高，以至于人们不得不对它敬而远之。\n\n但一定要这样吗？一个疯狂的计划在我脑海中形成……"
 POD_heists.1053.a: "“嘿，你知道有人潜入你的宫廷了吗？”"
 POD_heists.1053.b: "我没“那么”疯。"
 POD_heists.1053.b.mad: "我是疯了，但没“那么”疯。"
 POD_heists.1011.t: "周折：拔刀"
 POD_heists.1011.desc.coterie: "我们选择了最糟糕的时机潜入[GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]。"
 POD_heists.1011.desc.nocoterie: "我选择了最糟糕的时机潜入[GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]。"
 POD_heists.1011.desc: "一些领土争端让这宫廷沸沸扬扬。有人说要开战\n\n紧张气氛浓得可以用刀子割开。这里的每个人都在找借口割断别人的喉咙。"
 POD_heists.1011.desc.end.coterie: "作为场上的新人，我们是公平竞争的对象。\n\n[potential_rival.GetFirstNameNicknamed]向我们喊话：“你们是支持我们？还是反对我们？”"
 POD_heists.1011.desc.end.nocoterie: "作为场上的新人，我是公平竞争的对象。\n\n[potential_rival.GetFirstNameNicknamed]向我喊话：“你是支持我们？还是反对我们？”"
 POD_heists.1011.a.coterie: "我们支持你。"
 POD_heists.1011.a.nocoterie: "我支持你。"
 POD_heists.1011.a.success: "你的声援看起来很认真"
 POD_heists.1011.a.failure: "不是很有说服力"
 POD_heists.1011.b: "我试着转移话题。"
 POD_heists.1011.b.success: "你的花招奏效了"
 POD_heists.1011.b.failure: "重大失误"
 POD_heists.1011.c.coterie: "你敢质疑我们？"
 POD_heists.1011.c.nocoterie: "你敢质疑我？"
 POD_heists.1012.t.spymaster: "周折：[spymaster.GetCouncilTitle]"
 POD_heists.1012.t.rando: "周折：阴谋家"
 POD_heists.1012.desc.coterie: "宫廷的激进气氛让我们的计划变得复杂。我们躲进了一旁的走廊，想重整旗鼓，讨论下一步行动。但我们并不孤单。\n\n"
 POD_heists.1012.desc.nocoterie: "宫廷的激进气氛让我的计划变得复杂。我躲进了一旁的走廊，想重整旗鼓，思考下一步行动。但我并不孤单。\n\n"
 POD_heists.1012.desc.spymaster: "从阴影中几乎看不到[spymaster.GetFirstNamePossessive]的笑容。真巧，在这里遇到了[spymaster.GetCouncilTitle][CurrentHeistTarget.GetFirstNamePossessive]。\n\n"
 POD_heists.1012.desc.rando: "从阴影中几乎看不到[spymaster.GetFirstNamePossessive]的笑容。真巧，在这里碰到了这个世界上最多谋的阴谋家。\n\n"
 POD_heists.1012.desc.end: "“别在意我。”[spymaster.GetSheHe]说，“我只是在巡视，监视对王冠的威胁。”"
 POD_heists.1012.a.coterie: "我们与你无怨无仇。"
 POD_heists.1012.a.nocoterie: "我与你无怨无仇。"
 POD_heists.1012.a.success: "[spymaster.GetFirstName]感到满意"
 POD_heists.1012.a.failure: "[spymaster.GetFirstName]盯紧了你"
 POD_heists.1012.b: "你应该更担心这宫廷的其他人。"
 POD_heists.1012.b.success: "你成功转移了[spymaster.GetHerHis]的注意力"
 POD_heists.1012.b.failure: "这正是想做坏事的人会说的话"
 POD_heists.1012.c: "去别的地方溜达吧。"
 POD_heists.1013.t: "周折：主要反派"
 POD_heists.1013.desc: "现在，[court_owner.GetFirstNameNicknamed]也对此事产生了浓厚的兴趣。[court_owner.GetSheHe|U]正像一只鹰一样注视着宫廷上的争论、"
 POD_heists.1013.desc.coterie: "[court_owner.GetHerHis]的目光经常在我们身上徘徊。\n\n如果[infiltration|E]要继续下去，我们必须对[court_owner.GetHerHim]做点什么。"
 POD_heists.1013.desc.nocoterie: "[court_owner.GetHerHis]的目光经常在我身上徘徊。\n\n如果[infiltration|E]要继续下去，我必须对[court_owner.GetHerHim]做点什么。"
 POD_heists.1013.a.coterie: "我们假装支持[court_owner.GetHerHis]的统治。"
 POD_heists.1013.a.nocoterie: "我假装支持[court_owner.GetHerHis]的统治。"
 POD_heists.1013.a.success: "拍马屁总是有用的"
 POD_heists.1013.a.failure: "拍马屁总是有用的，除非拍不响"
 POD_heists.1013.b.coterie: "我们试图隐藏在人群中。"
 POD_heists.1013.b.nocoterie: "我试图隐藏在人群中。"
 POD_heists.1013.b.success: "你消失了"
 POD_heists.1013.b.failure: "你吸引更多的关注"
 POD_heists.1013.c: "[court_owner.GetSheHe|U]可以随便[court_owner.GetSheHe]怎么想。"
 POD_heist_stress_toast: "令人紧张的经历"
 POD_heist_title_node_key: "宝库的钥匙"
 POD_heist_desc_node_key: "这个房间里有一把钥匙。\n它可以打开存放最珍贵物品的房间。"
 POD_heist_title_node_key_half: "通向宝库的钥匙"
 POD_heist_desc_node_key_half: "这个房间里有一把钥匙。\n你需要两把#bold 两#!把钥匙才能打开存放贵重物品的房间。"
 POD_heist_node_key_empty: "#weak 你已经获取了这位置的钥匙#!"
 POD_heist_gain_key_toast: "获得钥匙"
 POD_heist_found_key_desc: "你将获得[CurrentHeist.Var('keys_required').GetValue|V0]把宝库钥匙中的$VALUE|V0$把。"
 POD_heist_found_key_desc_past: "你现在有[CurrentHeist.Var('keys_required').GetValue|V0]把宝库钥匙中的$VALUE|V0$把"
 POD_heist_found_all_keys_desc: "你可以打开宝库的锁"
 POD_heist_found_all_keys_desc_past: "现在你可以打开宝库"
 POD_heist_vault_no_key: "@warning_icon!#X $POD_heist_vault_no_key_basic$#!"
 POD_heist_vault_no_key_basic: "你拥有的[CurrentHeist.Var('keys_found').GetValue|V0]把钥匙少于打开此宝库所需的[CurrentHeist.Var('keys_required').GetValue|V0]钥匙。"
 POD_heist_levelup_hint_desc: "如果你成功完成$VALUE|V0$[Concept( 'infiltration', SelectLocalization( EqualTo_int32( '(int32)1', '(int32)$VALUE|0q$' ), 'game_concept_infiltration_mission', 'game_concept_infiltration_missions' ) )|E]，你将获得[GetModifier('infiltration_experience_modifier').GetNameWithTooltip]。"
 POD_heists.1031.t: "周折：让我们祈祷"
 POD_heists.1031.desc.coterie: "我们今晚要潜入的宫廷显然正处于神学气氛中\n\n[court_chaplain.GetFirstNameNicknamed]正在就他们错综复杂的信仰进行冗长的布道。每个人似乎都聚集在这里，至少在布道开始时是这样，这意味着我们不能偷偷溜走，否则会显得可疑。\n\n看来是时候留下来听一会儿了。"
 POD_heists.1031.desc.nocoterie: "我今晚要潜入的宫廷显然正处于神学气氛中\n\n[court_chaplain.GetFirstNameNicknamed]正在就他们错综复杂的信仰进行冗长的布道。每个人似乎都聚集在这里，至少在布道开始时是这样，这意味着我不能偷偷溜走，否则会显得可疑。\n\n看来是时候留下来听一会儿了。"
 POD_heists.1031.a: "希望不会太无聊。"
 POD_heists.1031.b: "长篇大论！我唯一的弱点。"
 POD_heists.1032.t: "周折：祈祷狂热"
 POD_heists.1032.desc.coterie: "结果，布道比我们预想的要长很多。事实上，我们还在那里，因为我们无法在不惊动这个显然非常虔诚的宫廷的情况下离开。\n\n我早就记不清[court_chaplain.GetFirstNamePossessive]的故事了，什么神话人物做神话事情之类的。\n\n他们总会停下来的，对吧？\n\n对吧？"
 POD_heists.1032.desc.nocoterie: "结果，布道比我预想的要长很多。事实上，我还在那里，因为我无法在不惊动这个显然非常虔诚的宫廷的情况下离开。\n\n我早就记不清[court_chaplain.GetFirstNamePossessive]的故事了，什么神话人物做神话事情之类的。\n\n他们总会停下来的，对吧？\n\n对吧？"
 POD_heists.1032.a: "扣人心弦……"
 POD_heists.1032.b: "我的耐心是有限度的。"
 POD_heists.1033.t: "周折：祈祷疯狂"
 POD_heists.1033.desc.coterie: "还在继续。\n\n我们有几次都快睡着了，直到[court_chaplain.GetFirstName]讲到[court_chaplain.GetSheHe]布道中更“史诗”的部分时，[court_chaplain.GetHerHis]的突然爆发才让我们回过神来。[court_chaplain.GetSheHe]是如何把一个有趣的故事写得如此冗长的，这将是一个千古之谜。\n\n不过，我们只需再等一会儿，[court_chaplain.GetSheHe]就会停下来，我们就可以继续执行任务了。随时随刻。\n\n等等，[court_chaplain.GetSheHe]要开念新的篇章了吗？"
 POD_heists.1033.desc.nocoterie: "还在继续。\n\n我有几次都快睡着了，直到[court_chaplain.GetFirstName]讲到[court_chaplain.GetSheHe]布道中更“史诗”的部分时，[court_chaplain.GetHerHis]的突然爆发才让我回过神来。[court_chaplain.GetSheHe]是如何把一个有趣的故事写得如此冗长的，这将是一个千古之谜。\n\n不过，我只需再等一会儿，[court_chaplain.GetSheHe]就会停下来，我就可以继续执行任务了。随时随刻。\n\n等等，[court_chaplain.GetSheHe]要开念新的篇章了吗？"
 POD_heists.1033.a: "我想回家。"
 POD_heists.1033.b: "没有什么宝藏比它更有价值了！"
 POD_heist_treasury_amount_desc: "\n#I [CHARACTER.GetShortUINameNoTooltipNoFormat]有[gold_i|E][CHARACTER.GetGold|V0]剩余#!"
 POD_heist_legitimacy_loss_tt: "由于你在行窃[vassal|E]时被抓，你失去[legitimacy_i][EmptyScope.ScriptValue('major_legitimacy_loss')|V0][legitimacy|E]"
 POD_heist_option_prisoners: "释放一名囚犯。"
 POD_heist_option_prisoners_empty: "@warning_icon!#X [CurrentHeistTarget.GetFirstNameNicknamed]没有囚犯#!"
 POD_heist_title_node_scramble: "静观其变"
 POD_heist_desc_node_scramble: "你可以躲藏在这个隐秘的角落中等待。\n事态会平息，守卫会转移，你可能会获得一些新的机会。"
 POD_heist_effect_node_scramble: "此[infiltration|E]中的大部分节点将被新的节点替换。"
 POD_heist_title_node_martial: "军队调动中"
 POD_heist_desc_node_martial: "这里有许多守卫，正在进行某种训练。  \n战略知识将帮助你预测并避开他们。"
 POD_heist_effect_node_martial_success: "显然，你熟读孙子兵法"
 POD_heist_effect_node_martial_fail: "孙子是谁？"
 POD_heist_effect_node_martial_critfail: "你既不了解敌人，也不了解自己"
 POD_heist_title_node_fight_elite: "危险的战斗"
 POD_heist_desc_node_fight_elite: "你看到一个属于[CurrentHeistTarget.GetFirstNamePossessive]的[CurrentHeistTarget.Custom('KnightCulturePlural')]。\n快速解决他们，你就可以在不引起[suspicion|E]的情况下通过。"
 POD_heist_effect_node_fight_elite: "你将开始一场@death_icon!#N;bold 生死决斗#!。"
 POD_heist_fight_elite_error_toast: "骑士消失了……"
 POD_heist_title_node_map: "计划与地图"
 POD_heist_desc_node_map: "这个房间不仅有这个[CurrentHeistTarget.Custom('PODDomicile')]的地图，还有守卫和廷臣的时间表。\n一旦你花时间阅读完这些，它将极大地助益你的[infiltration|E]。"
 POD_heist_effect_node_map: "你将揭示此[infiltration|E]中的所有节点。"
 POD_heist_title_node_prisoners: "监狱"
 POD_heist_desc_node_prisoners: "[CurrentHeistTarget.GetFirstNameNicknamed]的囚犯被关押在这里。\n如果你愿意，你可以释放他们，但这样做会提高你的[suspicion|E]。"
 POD_heist_release_prisoner_desc: "你将走近[CHARACTER.GetNameNicknamed]的牢房，并决定如何处置[CHARACTER.GetHerHim]。"
 POD_heists.1.desc.hostile.coterie: "我们到了。\n\n除了$POD_player_coterie$轻轻的脚步声外，没有任何声音。我们非常小心地隐藏自己，避免引起任何注意，因为一旦进入这个地方，就必须#bold;N 见者即杀#!。这是敌人的地盘。\n\n现在我们只需要拿到金库的钥匙，找到[PlayerJourneyArtifact.GetName]，并在不被发现的情况下将其拿走。"
 POD_heists.1.desc.hostile.nocoterie: "我到了。\n\n除了我轻轻的脚步声外，没有任何声音。我非常小心地隐藏自己，避免引起任何注意，因为一旦进入这个地方，就必须#bold;N 见者即杀#!。这是敌人的地盘。\n\n现在我只需要拿到金库的钥匙，找到[PlayerJourneyArtifact.GetName]，并在不被发现的情况下将其拿走。"
 POD_heists.2.desc.hostile.coterie: "我们到了。\n\n除了$POD_player_coterie$轻轻的脚步声外，没有任何声音。我们非常小心地隐藏自己，避免引起任何注意，因为一旦进入这个地方，就必须#bold;N 见者即杀#!。这是敌人的地盘。\n现在我们只需要拿到钥匙，找到[PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip]的宝库，然后在不被发现的情况下把口袋装满。\n"
 POD_heists.2.desc.hostile.nocoterie: "我到了。\n\n除了我轻轻的脚步声外，没有任何声音。我非常小心地隐藏自己，避免引起任何注意，因为一旦进入这个地方，就必须#bold;N 见者即杀#!。这是敌人的地盘。\n现在我只需要拿到钥匙，找到[PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip]的宝库，然后在不被发现的情况下把口袋装满。\n"
 POD_heists.103.desc: "你太走运了。运气终究会用完的。\n\n[heist_imprisoner.GetFirstNameNicknamed]的随从将你团团围住，无处可逃。没有喧嚣，也没有审判，只有[heist_imprisoner.Custom('PODSplat')]那轻蔑的目光，[heist_imprisoner.GetSheHe]挥剑将你斩杀。\n\n至少[heist_imprisoner.GetSheHe]很快就结束了这一切。"
 POD_heists.103.a.resurrection: "我会回来的，记住我的话……"
 POD_heists.200.t: "该如何处理你？"
 POD_heists.200.t.relation: "重逢"
 POD_heists.200.desc: "穿过[CurrentHeistTarget.GetShortUIName]的牢房，我遇到了我的[GetPlayer.Custom2('RelationToMeShort', SCOPE.sC('prisoner_to_release'))]，[prisoner_to_release.GetShortUIName]。[prisoner_to_release.GetSheHe|U]见到我时明显松了一口气。"
 POD_heists.200.desc.stranger: "穿过[CurrentHeistTarget.GetShortUIName]的牢房，我遇到了[prisoner_to_release.GetShortUIName]。"
 POD_heists.200.desc.hostile: "穿过[CurrentHeistTarget.GetShortUIName]的牢房，我遇到了[prisoner_to_release.GetShortUIName]。\n\n我认为[prisoner_to_release.Custom('PODSplat')]讨厌的家伙，比如[prisoner_to_release.GetHerHim]没什么用处，但也许我可以通过其他方式从[prisoner_to_release.GetHerHim]身上获得些价值。"
 POD_heists.200.a: "我带你离开这里。"
 POD_heists.200.b: "我会带你出去……但你得付出代价。"
 POD_heists.200.c: "你愿意加入我的宫廷吗？"
 POD_heists.200.d: "我可以在这里杀了你，无人知晓……"
 POD_heists.202.t: "艰苦的胜利"
 POD_heists.202.desc: "[sc_loser.GetShortUIName]再也无法阻挡我了。\n\n我该怎么处置[sc_loser.GetHerHim]？"
 POD_heists.202.a: "现在去死吧。"
 POD_heists.202.b: "制服[sc_loser.GetHerHim]并将[sc_loser.GetHerHim]押入我的监狱。"
 POD_heists.202.c: "放[sc_loser.GetHerHim]一条生路足够让其感到耻辱。"
 POD_heists.2011.t: "周折：食草者"
 POD_heists.2011.desc.coterie: "为了完成我们[infiltration|E]的目标，我们得出结论，领地的私人花园是最安全的路径。这片奢华的地区充满植被，给了我们很多机会来隐蔽前进。\n\n我们正匍匐在高耸的草丛中时，我注意到一只流浪狗向我们走来。如果这个不速之客开始狂吠，情况可能会迅速恶化……"
 POD_heists.2011.desc.nocoterie: "为了完成我的[infiltration|E]目标，我得出结论，领地的私人花园是最安全的路径。这片奢华的地区充满植被，给了我们很多机会来隐蔽前进。\n\n我正匍匐在高耸的草丛中时，注意到一只流浪狗向我走来。如果这个不速之客开始狂吠，情况可能会迅速恶化……"
 POD_heists.2011.a: "咻，滚开！"
 POD_heists.2011.b: "一动不动……"
 POD_heists.2011.c: "能看向别处吗？"
 POD_heists.2012.t: "周折：黑暗中的变色龙"
 POD_heists.2012.desc.coterie: "这座花园更像是一片森林。我几乎可以确定我们已经迷路好几次了，更糟糕的是，这里还有几名守卫在巡逻。\n\n一个主意浮现在我脑海中。我们的衣服在这片绿色环境中显得格外显眼。或许可以用一些泥土和草叶来淡化颜色，帮助我们避免不必要的关注？"
 POD_heists.2012.desc.nocoterie: "这座花园更像是一片森林。我几乎可以确定我已经迷路好几次了，更糟糕的是，这里还有几名守卫在巡逻。\n\n一个主意浮现在我脑海中。我的衣服在这片绿色环境中显得格外显眼。或许可以用一些泥土和草叶来淡化颜色，帮助我避免不必要的关注？"
 POD_heists.2012.a: "如果我必须的话……"
 POD_heists.2012.b: "这有点过分了吧！"
 POD_heists.2013.t: "周折：烧个精光"
 POD_heists.2013.desc: "够了够了，穿过这个‘花园’是个糟糕的主意。我现在根本不知道自己身处何地，衣服脏得不行，浑身还散发着像农夫一样的味道。是时候重新考虑整个计划了。\n\n我有强烈的冲动想去找最近的火把把这地方一把火烧了，但这可能有点过分。\n\n或者说，其实并不过分？"
 POD_heists.2013.a: "焦土战术！"
 POD_heists.2013.a.success: "我利用混乱取得了胜利！"
 POD_heists.2013.a.failure: "等下。火？！"
 POD_heists.2013.b: "我讨厌大自然。"
 POD_heists.2041.t: "周折：陷阱？"
 POD_heists.2041.desc.coterie: "到目前为止，我们的盗窃行动一直进行得非常谨慎，避免了不必要的关注，看来这份小心谨慎也带来了意想不到的收获。仔细检查后，一个看似普通的走廊墙壁上露出了细小的孔洞。\n\n我们必须通过这里，所以我们需要找到解除或避开这个机关的办法。"
 POD_heists.2041.desc.nocoterie: "到目前为止，我的盗窃行动一直进行得非常谨慎，避免了不必要的关注，看来这份小心谨慎也带来了意想不到的收获。仔细检查后，一个看似普通的走廊墙壁上露出了细小的孔洞。\n\n我必须通过这里，所以我需要找到解除或避开这个机关的办法。"
 POD_heists.2041.a.coterie: "也许[learning_duelist.GetFirstName]可以解除这个机关？"
 POD_heists.2041.a.nocoterie: "也许我可以解除这个机关？"
 POD_heists.2041.a.success: "……搞定了。"
 POD_heists.2041.a.failure: "等等，不对劲！"
 POD_heists.2041.b: "也许我速度够快的话？"
 POD_heists.2041.b.success: "轻松搞定！"
 POD_heists.2041.b.failure: "哎呦！"
 POD_heists.2042.t: "周折：陷阱"
 POD_heists.2042.desc.coterie: "现在我们对前方可能等待着的更多“惊喜”格外警惕，因此我们的行动更加谨慎。眼前的挑战似乎是一个不平整的地面，我怀疑它可能会是一个令人不太愉快的陷阱，比如满是尖刺的坑。\n\n为了避免被刺穿的结局，我开始考虑我的选择。"
 POD_heists.2042.desc.nocoterie: "现在我对前方可能等待我的更多“惊喜”格外警惕，因此我的行动更加谨慎。眼前的挑战似乎是一个不平整的地面，我怀疑它可能会是一个令人不太愉快的陷阱，比如满是尖刺的坑。\n\n为了避免被刺穿的结局，我开始考虑我的选择。"
 POD_heists.2042.a.coterie: "我们只需要避开那些被设下陷阱的地砖。"
 POD_heists.2042.a.nocoterie: "我只需要避开那些被设下陷阱的地砖。"
 POD_heists.2042.b: "这里有一个数字规律在起作用……"
 POD_heists.2043.t: "周折：陷阱！"
 POD_heists.2043.desc: "[infiltration|E]已进入关键阶段。根据以往的经验，我预料这里会有最恶毒的陷阱。然而，乍一看我似乎并没有发现什么异常之处，这反而让我更加紧张。与其说这里什么都没有，不如说某些东西隐藏得很好。"
 POD_heists.2043.a: "再仔细检查一遍……"
 POD_heists.2043.a.success: "哈！找到了！"
 POD_heists.2043.a.failure: "那是……一块巨石？!"
 POD_heists.2043.b: "在哪儿可能有埋伏？"
 POD_heists.6001.t: "过早的终结"
 POD_heists.6001.desc: "死亡对我来说只是一个小小的挫折。\n\n不幸的是，由于我的复活能力的特性，我的新身体出现在距离我的[infiltration_mission|E]位置很远的地方。\n\n如果我想再试一次，就必须从头开始。"
 POD_heists.6001.a: "总比做凡人强。"
 POD_heists.6001.a.tt: "由于你的死亡，你的[infiltration_mission|E]提前结束了。"
 POD_heists.2031.t: "周折：屋顶冒险"
 POD_heists.2031.desc.coterie: "我们对目标的初步研究让我得出结论，最好的方法是从空中接近。我们可以通过攀登附近的塔楼，在屋顶上跳跃来获得有利的位置，从而避开大部分的防御。\n\n这是个完美的计划，只要我不掉下去。"
 POD_heists.2031.desc.nocoterie: "我对目标的初步研究让我得出结论，最好的方法是从空中接近。我可以通过攀登附近的塔楼，在屋顶上跳跃来获得有利的位置，从而避开大部分的防御。\n\n这是个完美的计划，只要我不掉下去。"
 POD_heists.2031.a: "别往下看……"
 POD_heists.2031.a.success: "跳，跳，跳……"
 POD_heists.2031.a.failure: "……我滑倒了"
 POD_heists.2032.t: "周折：死从天降"
 POD_heists.2032.desc.coterie: "我们正在接近目标。按照我们的计划，现在我们需要短暂降到地面，然后再攀爬上去。我在开始下降前偷偷看了一眼，很快就发现那里有一名守卫。\n\n我们处于一个绝佳的位置，真的可以对他来个从天而降的突袭。\n\n这是一个高效解决威胁的完美方式，而且看起来帅爆了。"
 POD_heists.2032.desc.nocoterie: "我正在接近目标。按照我的计划，现在我需要短暂降到地面，然后再攀爬上去。我在开始下降前偷偷看了一眼，很快就发现那里有一名守卫。\n\n我处于一个绝佳的位置，真的可以对他来个从天而降的突袭。\n\n这是一个高效解决威胁的完美方式，而且看起来帅爆了。"
 POD_heists.2032.a: "一，二，……"
 POD_heists.2032.a.success: "……三！"
 POD_heists.2032.a.failure: "……哎呦！"
 POD_heists.2033.t: "周折：信仰之跃"
 POD_heists.2033.desc: "最后的障碍之一是一次跳跃。一次从塔顶跳下的大跳，目标是（希望如此）一个非常巧妙地放置在这里的干草车。\n\n没有太多需要考虑的。我不会错过目标。\n\n对吧？"
 POD_heists.2033.a: "我好像听到了一只鹰在鸣叫！"
 POD_heists.2033.a.success: "天啊，我真帅。"
 POD_heists.2033.a.failure: "后世会以为你是自杀的。"
 POD_heists.2033.b: "瞄准地面对我来说不是什么问题。"
 POD_heists.2001.t: "周折：遭遇"
 POD_heists.2001.desc.coterie: "这个庭院的安保非常严密。\n\n我们已经注意到有多支巡逻队按照严格的时间表，几乎覆盖了整个区域。\n\n如果我们不想惊动守卫，就必须小心行事。"
 POD_heists.2001.desc.nocoterie: "这个庭院的安保非常严密。\n\n我已经注意到有多支巡逻队按照严格的时间表，几乎覆盖了整个区域。\n\n如果我不想惊动守卫，就必须小心行事。"
 POD_heists.2001.a: "在阴影中行走。"
 POD_heists.2001.a.success: "继续潜行。"
 POD_heists.2001.a.failure: "！"
 POD_heists.2001.b: "我可以藏在那个桶里！"
 POD_heists.2002.t: "周折：决斗"
 POD_heists.2002.desc.coterie: "我们正在稳步前进。下一个障碍似乎是一个壮实的家伙在守卫着一扇关键的门。\n\n我不确定他是否拥有超自然的能力，但硬碰硬似乎是唯一的解决办法。\n\n我们还有时间上的限制，因为战斗的喧嚣很可能会迅速引来不必要的关注。"
 POD_heists.2002.desc.nocoterie: "我正在稳步前进。下一个障碍似乎是一个壮实的家伙在守卫着一扇关键的门。\n\n我不确定他是否拥有超自然的能力，但硬碰硬似乎是唯一的解决办法。\n\n我还有时间上的限制，因为战斗的喧嚣很可能会迅速引来不必要的关注。"
 POD_heists.2002.a.coterie: "[prowess_duelist.GetFirstName]可以解决他"
 POD_heists.2002.a.nocoterie: "我可以解决他。"
 POD_heists.2002.a.success: "威胁已消除"
 POD_heists.2002.a.failure: "大失败"
 POD_heists.2002.b: "一定还有别的路进去，即使需要绕很大一圈……"
 POD_heists.2003.t: "周折：逃脱"
 POD_heists.2003.desc.coterie: "嗯，我们犯了个错误。\n\n现在我们没时间多想，因为一群愤怒的守卫正在追赶我们，他们的喊叫声足以唤醒死人。收到警示后，更多的守卫从各个角落出现，逼得我们只能勉强躲避他们。\n\n我们必须迅速甩掉他们。"
 POD_heists.2003.desc.nocoterie: "嗯，我犯了个错误。\n\n现在我没时间多想，因为一群愤怒的守卫正在追赶我，他们的喊叫声足以唤醒死人。收到警示后，更多的守卫从各个角落出现，逼得我只能勉强躲避他们。\n\n我必须迅速甩掉他们。"
 POD_heists.2003.a: "我能做到……"
 POD_heists.2003.a.success: "有惊无险。"
 POD_heists.2003.a.failure: "现在，我会死在你面前。"
 POD_heists.2061.t: "周折：内应"
 POD_heists.2061.desc.coterie:0 "为了成功进行我们的[infiltration|E]，我们选择了间接的方式。每个人都有自己的弱点，我们找到了对后门守卫最有效的贿赂方式。\n\n当这个人按约定让我们进入时，我真心希望我没有误判他以至于陷入埋伏。"
 POD_heists.2061.desc.nocoterie: "为了成功进行我们的[infiltration|E]，我选择了间接的方式。每个人都有自己的弱点，我找到了对后门守卫最有效的贿赂方式。\n\n当这个人按约定让我进入时，我真心希望我没有误判他以至于陷入埋伏。"
 POD_heists.2061.a: "你会得到丰厚的报酬。"
 POD_heists.2061.b: "我认可你的价值。"
 POD_heists.2061.b.success: "如约而至。"
 POD_heists.2061.b.failure: "为什么你在锁门？!"
 POD_heists.2061.c: "你的禁忌梦想近在咫尺"
 POD_heists.2062.t: "周折：不可靠的向导"
 POD_heists.2062.desc.coterie: "我们的内应到目前为止并没有我所期望的那样有用。他对领地中隐秘部分的明显缺乏了解，浪费了我们宝贵的时间，几次差点让我们被抓住。\n\n尽管我心存怀疑，但不可否认我们确实在取得进展。\n\n我只好在心里提醒自己，今后要仔细核实他所说的一切。"
 POD_heists.2062.desc.nocoterie: "我的内应到目前为止并没有我所期望的那样有用。他对领地中隐秘部分的明显缺乏了解，浪费了我宝贵的时间，几次差点让我被抓住。\n\n尽管我心存怀疑，但不可否认我确实在取得进展。\n\n我只好在心里提醒自己，今后要仔细核实他所说的一切。"
 POD_heists.2062.a: "有些不对劲，但继续前进吧。"
 POD_heists.2062.b.coterie: "趁现在还能走，我们应该离开。"
 POD_heists.2062.b.nocoterie: "趁现在还能走，我应该离开。"
 POD_heists.2063.t: "周折：预期中的背叛"
 POD_heists.2063.desc.coterie: "随着我们的[infiltration|E]进入关键阶段，我们的向导将$POD_player_coterie$引入一个新房间。还没等我们反应过来，门被锁上，我听到剑出鞘和弩上弦的声音。\n\n我对我们的内应保持警惕是对的，但显然还不够谨慎，以至于被逼入了一个精心准备的埋伏。\n\n现在是时候看看我们是否足够强大，能够纠正这个错误了。"
 POD_heists.2063.desc.nocoterie: "随着我的[infiltration|E]进入关键阶段，我的向导将我引入一个新房间。还没等我反应过来，门被锁上，我听到剑出鞘和弩上弦的声音。\n\n我对内应保持警惕是对的，但显然还不够谨慎，以至于被逼入了一个精心准备的埋伏。\n\n现在是时候看看我是否足够强大，能够纠正这个错误了。"
 POD_heists.2063.a: "事情还没结束。"
 POD_heists.2063.a.success: "绝境中的老鼠，奋战如狮。"
 POD_heists.2063.a.failure: "致命的错误"
 POD_heist_title_node_fight_hunt: "你的任务目标"
 POD_heist_desc_node_fight_hunt: "这一定是恶徒的藏身之处。\n猎人已经找到了猎物。但谁能说清你们中究竟谁是猎人，谁是猎物？"
 POD_heist_effect_node_fight_hunt: "你将面对 [CurrentHeist.Var('hunt_target').Char.GetShortUIName]。一旦开始，就没有回头路。"
 POD_heist_effect_node_fight_hunt_invalid: "#weak [CurrentHeist.Var('hunt_target').Char.GetShortUIName]已经被击败#!"
 POD_heists.3.t: "深入虎穴"
 POD_heists.3.desc.coterie: "我们到了。\n\n四周寂静无声，只有$POD_player_coterie$的轻微脚步声。我们小心翼翼地隐藏自己，不引起任何注意，因为一旦进入这个地方，就会被#bold;N 格杀勿论#!。这里是敌人的地盘。\n\n现在我们必须迅速找到[PlayerJourneyTarget.GetShortUIName]的藏身之处并终结[PlayerJourneyTarget.GetHerHim]，以免惊动[PlayerJourneyTarget.GetHerHis]的爪牙。"
 POD_heists.3.desc.nocoterie: "我到了。\n\n四周寂静无声，只有我轻微的脚步声。我小心翼翼地隐藏自己，不引起任何注意，因为一旦进入这个地方，就会被#bold;N 格杀勿论#!。这里是我的敌人的地盘。\n\n现在我必须迅速找到[PlayerJourneyTarget.GetShortUIName]的藏身之处并终结[PlayerJourneyTarget.GetHerHim]，以免惊动[PlayerJourneyTarget.GetHerHis]的爪牙。"
 POD_heists.3.a: "猎杀开始。"
 POD_heists.100.desc.hunt: "[CurrentHeist.Var('hunt_target').Char.GetShortUIName]已被击败。这个世界上的怪物又少了一个。确实值得庆祝，但夜晚中仍有更多怪物潜伏。\n\n猎人的工作永无止境。"
 POD_heists.100.desc.nohunt: "[CurrentHeist.Var('hunt_target').Char.GetShortUIName]仍然逍遥法外。这次猎杀失败了。不过，我依然可以认为自己是幸运的，因为我还活着，还能在下次继续猎杀。\n\n猎人的工作永无止境。"
 POD_heists.203.t: "最后的光芒"
 POD_heists.203.desc.rational: "[adversary.GetFirstName]对我的到来毫不动摇，[adversary.GetHerHis]眼中散发出冰冷而睿智的神色，仿佛对任何局势都了然于胸。这个对手不可小觑。"
 POD_heists.203.desc.irrational: "即使对恶徒而言，[adversary.GetFirstName]也显得疯狂且难以捉摸。无论接下来发生什么，必定一片狼藉。"
 POD_heists.203.desc.compassionate: "当我持武器进入时，[adversary.GetFirstName]看起来几乎有些悲伤，仿佛在说：真遗憾事情走到了这一步。但我们都清楚，别无他法。"
 POD_heists.203.desc.callous: "对于[adversary.GetFirstName]来说显而易见的是，[adversary.GetHerHim]已不再具有人性。这是最危险的敌人：在[adversary.GetHerHis]的心中只将他人视作棋盘上的棋子，或仅仅是待宰的肉。"
 POD_heists.203.desc.honorable: "[adversary.GetFirstName]目光坚定地迎上我的视线，[adversary.GetHerHis]始终保持着冷静与骑士般的风范。"
 POD_heists.203.desc.dishonorable: "当我进入时，[adversary.GetFirstNamePossessive]的目光在房间中快速扫视，仿佛在寻找逃跑路线、隐藏的陷阱，或是可以偷袭我的东西。幸运的是，[adversary.GetSheHe]没能得逞。"
 POD_heists.203.desc.coterie: "\n\n$POD_player_coterie$ 只有短短几秒钟来决定行动。"
 POD_heists.203.desc.nocoterie: "\n\n无处可逃。唯一的选择就是行动。"
 POD_heists.203.a: "我是来终结你的。"
 POD_heists.203.a.tt: "你将与[adversary.GetShortUIName]一对一决斗。"
 POD_heists.203.b: "[prowess_duelist.GetFirstName]，抓住先机。"
 POD_heists.203.b.success: "决定性胜利"
 POD_heists.203.b.failure: "一步走错，全军覆没"
 POD_heists.205.desc: "我无情的工作已完成。恶徒[sc_loser.GetFirstName]已被击败。\n\n怜悯从未被纳入考量。"
 POD_heists.101.desc.spirit: "你过于托大了。运气终有耗尽之时。\n\n[heist_imprisoner.GetFirstNameNicknamed]的随从们将你团团围住，无处可逃。被押往牢房时，四周没有一丝喧哗。\n\n当然，凡人的牢房困不住你这般的灵体。转瞬之间，你已重获自由。但名誉上的污痕，可不会如此轻易消褪。"
 POD_heists.101.desc.landless: "你过于托大了。运气终有耗尽之时。\n\n[heist_imprisoner.GetFirstNameNicknamed]的随从们将你团团围住。无处可逃。被押送出去时，四周寂静无声。\n\n值得庆幸的是，这个[heist_imprisoner.Custom('PODDomicile')]并未设置牢房，否则此刻你早已身陷囹圄。但无论如何，关于你背信弃义的流言必将在此事后迅速蔓延。"
 POD_heists.202.a.dead: "没什么，因为[sc_loser.GetSheHe]已经在斗争中去世了。"
 POD_heists.206.t: "太慢了"
 POD_heists.206.desc.coterie: "This only could've worked if we had seized the initiative. We failed.\n\n[adversary.GetFirstName|U] fends off our blows easily, and when the door busts open and guards surround our group, I realize [adversary.GetSheHe] was just stalling for time.\n\nHopelessly outmatched, they cut us down one by one.\n\nMy [GetPlayer.Custom2('RelationToMeShort', SCOPE.sC('friend'))] [friend.GetFirstName], my brave comrade-in-arms, turns to me pleadingly one last time before [friend.GetSheHe] perishes like the rest.\n\nI doomed them. I doomed them all."
 POD_heists.206.desc.nocoterie: "This only could've worked if I had seized the initiative. I failed.\n\n[adversary.GetFirstName|U] fends off my blows easily, and when the door busts open and guards surround me, I realize [adversary.GetSheHe] was just stalling for time.\n\nNow I'm hopelessly outmatched.\n\nThe guards know this too, and nick me with one superficial wound after another. Contemptuous. Like they're playing with their food. But I know it's only a matter of time before they tire of this.\n\nWhat was I thinking, coming here all by myself?"
 POD_heists.206.a: "WAIT! Don't kill me! I can serve you as a ghoul."
 POD_heists.206.b: "WAIT! Don't kill me! I can serve you as a thrall."
 POD_heists.206.c: "I will face my death with dignity."
 POD_heists.207.t: "The First Hit is Free"
 POD_heists.207.desc.rational: "[adversary.GetFirstNameNoTooltip|U] seems lost in thought. To [adversary.GetHerHis] credit, [adversary.GetSheHe] gives my offer serious consideration. Then, a curt nod. \"Yes, this is agreeable.\"\n\n[adversary.GetSheHe|U] produces a knife and cuts [adversary.GetHerHis] wrist matter-of-factly. \"Your former allies will hunt you for this. You do have an exit strategy, yes? If not, formulate one. I expect a degree of initiative from my subordinates.\"\n\nI can see what this is to [adversary.GetHerHim]. A transaction. Nothing more, nothing less.\n\nNow all I need to do is drink [adversary.GetHerHis] blood, and sign myself away."
 POD_heists.207.desc.irrational: "[adversary.GetFirstNameNoTooltip|U] stops dead in [adversary.GetHerHis] tracks. Just for once, this unhinged bloodsucker is caught by surprise. [adversary.GetHerHis|U] face contorts back and forth, going through an entire journey's worth of expressions before settling on a big grin. It's meant to be friendly. I think.\n\n\"Yes, of #italic course#! we can be friends. Let bygones be bygones, eh? Come, come. Let's celebrate our new friendship with a snack.\"\n\n[adversary.GetSheHe|U] means [adversary.GetHerHis] blood. Naturally."
 POD_heists.207.desc.compassionate: "[adversary.GetFirstNameNoTooltip|U] smiles at my words. \"I'm relieved to hear you say that. It would be a shame to rid the world of such a remarkable [ROOT.Char.Custom('WomanManGirlBoy')]. Even if we started out as enemies.\"\n\n[adversary.GetSheHe|U] hesitates for a moment. \"I had to make sure you did this of your own free will. Once you partake of my blood, your will is no longer your own. I do not take this lightly.\"\n\nWith no small amount of gravitas, [adversary.GetSheHe] cuts [adversary.GetHerHis] wrist and lets [adversary.GetHerHis] blood well forth."
 POD_heists.207.desc.callous: "As the words leave my mouth, I wonder if I have made the biggest mistake of my life. [adversary.GetFirstNameNoTooltip|U] slowly circles me and looks me up and down, like a predatory animal who knows its prey can't escape.\n\nNo. [adversary.GetSheHe|U]'s something else. An animal would blink, or breathe, or show emotion, or any other sign of life. [adversary.GetFirstNameNoTooltip|U] simply observes, [adversary.GetHerHis] face a mask.\n\nSlowly, [adversary.GetSheHe] takes a dagger and slices open his wrist. Blood pools around the blade's tip. [adversary.GetSheHe|U] never breaks eye contact.\n\n\"Yes\", [adversary.GetSheHe] finally speaks.\n\n\"You'll do nicely.\""
 POD_heists.207.desc.honorable: "\"Remarkable. After all that transpired tonight, knowing you had planned to hunt me down like an animal, you'd still look me in the eye and appeal to my sense of honor. I could execute you right here, and I would be justified in doing so.\"\n\n[adversary.GetFirstNameNoTooltip|U] sighs. A theatric gesture for a being that doesn't need to breathe.\n\n\"But I will not. You are right, I do have a sense of honor. But you have incurred a great debt to me tonight. Show me that you are willing to repay it. Swear this oath on my blood.\"\n\n[adversary.GetSheHe|U] cuts [adversary.GetHerHis] wrist and bids me to drink."
 POD_heists.207.desc.dishonorable: "\"What?\" [adversary.GetFirstNameNoTooltip] blurts out. \"Is this a trick? What sort of buffoon do you take me for?\"\n\n[adversary.GetSheHe|U] looks indignant for a moment, but quickly calms [adversary.GetHerselfHimself] down.\n\n\"No, of course not. You're just trying to save your own hide. I can respect that. You'd even go so far as to willingly become my pawn.\"\n\n\"To answer your question... yes, I will gladly accept a new pawn. Obviously.\" [adversary.GetSheHe|U] bites into [adversary.GetHerHis] wrist and thrusts it towards me, like [adversary.GetSheHe] can't wait to get this over with. \"Drink and get out of my face. I'll have work for you soon enough.\""
 POD_heists.207.a: "I drink from the offered wrist, and my fate is sealed..."
 POD_heists.208.t: "熟识的魔鬼..."
 POD_heists.208.desc: "\"Excellent!\" [adversary.GetFirstNameNoTooltip] says, looking mighty pleased. \"Since you consented, this will only take a moment.\" [adversary.GetSheHe|U] presses [adversary.GetHerHis] finger to my forehead, and #italic TWISTS#!.\n\n#italic Eons pass by in an instant.#!\n\n#italic in lakes of fire my skin is flayed and I see the end of all things all creation quakes before the Lord and we are His unrepentant children and when His righteous anger is revealed He will#!\n\n\"There you go!\" [adversary.GetFirstNameNoTooltip] beams as [adversary.GetSheHe] removes [adversary.GetHerHis] finger from my forehead. \"Now, if you'll excuse me, I have some other sinners to get to. You're a sinner now, by the way. Toodles!\"\n\n[adversary.GetSheHe|U] strolls away and leaves me alone with my thoughts."
 POD_heists.208.a: "I can't help but feel like I lost something important."