 POD_heists.1031.t: "周折： 让我们祈祷"
 POD_heists.1031.desc.coterie: "我们今晚要潜入的宫廷显然正处于神学气氛中\n\n[court_chaplain.GetFirstNameNicknamed]正在就他们错综复杂的信仰进行冗长的布道。每个人似乎都聚集在这里，至少在布道开始时是这样，这意味着我们不能偷偷溜走，否则会显得可疑。\n\n看来是时候留下来听一会儿了。"
 POD_heists.1031.desc.nocoterie: "我今晚要潜入的宫廷显然正处于神学气氛中\n\n[court_chaplain.GetFirstNameNicknamed]正在就他们错综复杂的信仰进行冗长的布道。每个人似乎都聚集在这里，至少在布道开始时是这样，这意味着我不能偷偷溜走，否则会显得可疑。\n\n看来是时候留下来听一会儿了。"
 POD_heists.1031.a: "希望不会太无聊。"
 POD_heists.1031.b: "长篇大论！我唯一的弱点。"
 POD_heists.1032.t: "周折：祈祷狂热"
 POD_heists.1032.desc.coterie: "结果，布道比我们预想的要长很多。事实上，我们还在那里，因为我们无法在不惊动这个显然非常虔诚的宫廷的情况下离开。\n\n我早就记不清[court_chaplain.GetFirstNamePossessive]的故事了，什么神话人物做神话事情之类的。\n\n他们总会停下来的，对吧？\n\n对吧？"
 POD_heists.1032.desc.nocoterie: "结果，布道比我预想的要长很多。事实上，我还在那里，因为我无法在不惊动这个显然非常虔诚的宫廷的情况下离开。\n\n我早就记不清[court_chaplain.GetFirstNamePossessive]的故事了，什么神话人物做神话事情之类的。\n\n他们总会停下来的，对吧？\n\n对吧？"
 POD_heists.1032.a: "扣人心弦……"
 POD_heists.1032.b: "我的耐心是有限度的。"
 POD_heists.1033.t: "周折：祈祷疯狂"
 POD_heists.1033.desc.coterie: "还在继续。\n\n我们有几次都快睡着了，直到[court_chaplain.GetFirstName]讲到[court_chaplain.GetSheHe]布道中更“史诗”的部分时，[court_chaplain.GetHerHis]的突然爆发才让我们回过神来。[court_chaplain.GetSheHe]是如何把一个有趣的故事写得如此冗长的，这将是一个千古之谜。\n\n不过，我们只需再等一会儿，[court_chaplain.GetSheHe]就会停下来，我们就可以继续执行任务了。随时随刻。\n\n等等，[court_chaplain.GetSheHe]要开念新的篇章了吗？"
 POD_heists.1033.desc.nocoterie: "还在继续。\n\n我有几次都快睡着了，直到[court_chaplain.GetFirstName]讲到[court_chaplain.GetSheHe]布道中更“史诗”的部分时，[court_chaplain.GetHerHis]的突然爆发才让我回过神来。[court_chaplain.GetSheHe]是如何把一个有趣的故事写得如此冗长的，这将是一个千古之谜。\n\n不过，我只需再等一会儿，[court_chaplain.GetSheHe]就会停下来，我就可以继续执行任务了。随时随刻。\n\n等等，[court_chaplain.GetSheHe]要开念新的篇章了吗？"
 POD_heists.1033.a: "我想回家。"
 POD_heists.1033.b: "没有什么宝藏比它更有价值了！"
