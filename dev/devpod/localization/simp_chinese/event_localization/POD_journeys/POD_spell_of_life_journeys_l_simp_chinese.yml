l_simp_chinese:
 POD_mummy_spell_of_life_journeys.10.t: "乌普奥特的教诲"
 POD_mummy_spell_of_life_journeys.10.desc: "Wepauwet does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Wepauwet and found him among the swirling sands of Africa. Once, he was one of the Silent Striders' greatest warriors, blood-brother of Shu Horus and diplomat to the Shemsu-heru. He helped lead his people in great battles against the Cult of Sutekh in the lands of Khem. Now, he lives among the ruins of his people in a foreign land, cut off from their ancestor spirits by Set's curse. He sought to cheat the curse through service to Horus, but the spirit Owl punished him for violating Gaia's plan. He is left with trying to preserve his people's history and knowledge with the one, albeit ageless, life he has left. As the only one able to hear the tribe's ancestors, he exists between life and death, guiding his people, communicating with the spirits in their tribal homeland, and trying to resurrect memories of their past glories from the days of Khem.\n\nAmong Wepauwet's knowledge is a few fragments regarding the Spell of Life. However, he is immensely loyal to Horus, who prohibits sharing such details. In addition, his history has left him distrustful of strangers. You will need to convince him to teach you."
 POD_mummy_spell_of_life_journeys.10.a: "作为同僚学者，请不吝赐教。"
 POD_mummy_spell_of_life_journeys.10.b: "要是我帮助你们的人民，会怎么样？"
 POD_mummy_spell_of_life_journeys.10.c: "荷鲁斯已授予我许可"
 POD_mummy_spell_of_life_journeys.10.effect.success.desc: "我证明了有说服力"
 POD_mummy_spell_of_life_journeys.10.critical.failure.effect.desc: "我未能说服他。"
 POD_mummy_spell_of_life_journeys.11.t: "米拉日巴的教诲"
 POD_mummy_spell_of_life_journeys.11.desc: "Milarepa does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Milarepa and found him among the towering peaks of the Himalayan Mountains. Once, Khetamon was a philosopher and magician in the court of Osiris, embraced to preserve his skills. One of the few of Osiris' progeny to survive the battle at Mestha's far, Khetamon led the Children of Osiris on a spiritual journey into the east, following the footsteps of Osiris' own journey. When Osiris returned, he came with the teachings of Bardo, and so, Khetamon sought the same source of enlightenment. The poet-sorcerer Milarepa, disciple of Khetamon, accompanied his master. Resting in the Himalayas, Milarepa aided the Stargazers, friends of the Silent Striders and the tribe of Milarepa's friend Justinian, to kill a beast called the Nexus Crawler and eventually achieved his own enlightenment, a state called Golconda.\n\nDue to his time working alongside the mystics of the Shemsu-heru and the Cult of Isis, he learned some fragments regarding the Spell of Life. However, his loyalty lies with the forces of Osiris, and he considers many supernatural creatures to be misguided at best. You will need to prove that you meet his ethical, intellectual, and metaphysical standards."
 POD_mummy_spell_of_life_journeys.11.a: "让我与你一同冥想。"
 POD_mummy_spell_of_life_journeys.11.b: "没有什么比一场真正的哲学辩论更令人向往的了。"
 POD_mummy_spell_of_life_journeys.12.t: "阿斯特拉孔的教诲"
 POD_mummy_spell_of_life_journeys.12.desc: "Astrokhen does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Astrokhen and found him hiding among shifting sands of Africa. Once, Astrokhen was a mage in the lands of Khem who sought immortality. In his arrogance, he ordered Horus to use the Spell of Life on him, which ended poorly. After years of searching, he happened upon the writings of another mage calling himself Hermes. Using all his resources to follow a long-dead trail, Astrokhen eventually found \"Hermes\" who turned out to be Cabirus, a mage that apparently pieced together (or stole) the Spell of Life. When Horus discovered Astrokhen's new immortality, Horus cursed him to forever protect Horus' powerful artifacts and acquire additional artifacts that needed protection. Astrokhen's own love of secrets and hidden knowledge reinforced the curse, ensuring that he spent countless centuries pursuing ancient tomes and concealed powers. Morality was never much of a consideration for him.\n\nAmong these secrets are a few fragments regarding the Spell of Life. Beyond the curse, he lacks any loyalty to Horus. If you satisfy the curse's needs and temporarily relieve his burden, he may be willing to part with a few tidbits of information."
 POD_mummy_spell_of_life_journeys.12.a: "我也有不少自己的收藏呢。"
 POD_mummy_spell_of_life_journeys.12.b: "我可以资助你的努力。"
 POD_mummy_spell_of_life_journeys.12.c: "我不愿协助这样一个人。"
 POD_mummy_spell_of_life_journeys.12.effect.success.desc: "你击败了阿斯特拉孔，并搜刮了他的宝库。"
 POD_mummy_spell_of_life_journeys.12.critical.failure.effect.desc: "他击退了你"
 POD_mummy_spell_of_life_journeys.13.t: "伊努哈顿的教诲"
 POD_mummy_spell_of_life_journeys.13.desc: "Inauhaten does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Inauhaten and found him among the many hidden caves of the Himalayan Mountains. Once a mortal architect, he was turned into a mummy by the Cult of Isis and decided to spend his newfound immortality studying death and the afterlife. In time, he determined that Horus' crusade against Set to be a distraction from greater matters: watching over a grand, sunless city admist the dead and soaring defiantly above the end of all. After being impressed by their knowledge of necromancy, Inauhaten offered a deal to a cult of mages. In exchange for their aid caring for a forgotten city, he utilized a fragmented version of the Spell of Life to transform the Idran into yamasattvas. Through them, he contacted an ancient sect of vampires that worshipped the Antediluvians. He taught them of the Underworld and its government. He led them to the city and helped them capture it. He gave them a series of volumes that distilled his millennia of experience with necromantic praxis. He aided them as they assembled one of the most complete archives of early Cainite history in the world, one whose size surpassed even the fabled Library of the Forgotten. He illuminated a path for the Tal'mahe'Ra and set them on a course they could not deviate from.\n\nWhile he only knows a corrupted form of the Spell of Life, he could teach you much. However, you may need to make a deal with him, like the Idran so long ago."
 POD_mummy_spell_of_life_journeys.13.a: "I am already bound by the Idran's deal"
 POD_mummy_spell_of_life_journeys.13.b: "我宣誓投身于这项事业。"
 POD_mummy_spell_of_life_journeys.13.c: "他们需要一些资源吗？"
 POD_mummy_spell_of_life_journeys.14.t: "姆塞塔的教诲"
 POD_mummy_spell_of_life_journeys.14.desc: "Mestha does not hold the Spell of Life. However, he knows enough about it to provide some insights that will further your own efforts. Little helps more than hearing the same material from another person.\n\nAs such, you sought out Mestha and found him living on a quiet farm within sight of the Nile River. Once, he was a simple farmer of the Lower Nile, tending the same land as his father, his father's father, going back many generations. His sons served in the mortal armies of Osiris and Horus, brave, zealous, and ultimately dead. His second son brought Isis and Horus to Mestha's farm where he sheltered them. Mestha sacrificed the bull whose blood fueled Osiris' recovery. He watched the creation and preparation of the Spell of Life. When Isis proved reluctant to test the spell on her injured son, Mestha offered to undergo it, took poison to still his heart, felt as his Ba passed into the spirit world, and was reborn for the first time. He witnessed the ritual as it gave Horus eternal life. As his immortality stretched on, he served as Osiris' confidant on the rare occasions that his master left Amenti.\n\nHe has seen much over his millennia, giving him a few fragments of knowledge regarding the Spell of Life. However, his loyalty to Osiris and Horus is absolute."
 POD_mummy_spell_of_life_journeys.14.a: "他是个和蔼可亲的人。我们试着谈谈吧。"
 POD_mummy_spell_of_life_journeys.14.b: "他或许忠诚，但依然会感到痛苦……"
 POD_mummy_spell_of_life_journeys.20.t: "[Concept('translation_minigame', '翻译')|E]深奥的记录"
 POD_mummy_spell_of_life_journeys.20.desc: "Your efforts have yielded some esoteric record of an undiscernible age. Despite your familiarity with multiple languages and the linguistic capabilities of your courtiers, your combined efforts have proven insufficient to render it interpretable. Invisible ink obscures critical details. Enciphered words speckle the text. The portions written in a familiar language are barely interpretable, requiring a technical and magical mastery that you are just starting to achieve. The writer's shorthand only further complicates your translation efforts.\n\nOne particular, five-letter word seems to be the key to translating the remainder. Unfortunately, you'll only have 6 opportunities as your efforts are rather destructive."
 POD_mummy_spell_of_life_journeys.20.a: "好的，我们来试试吧。"
 POD_mummy_spell_of_life_journeys.20.b: "我放弃了！"
 POD_mummy_spell_of_life_journeys.20.effect.success: "你的翻译很成功。"
 POD_mummy_spell_of_life_journeys.20.effect.failure: "你的翻译失败了。"
 POD_mummy_spell_of_life_journeys.20.effect.failure.details: "你失败的尝试毁掉了记录"
 POD_mummy_spell_of_life_journeys.21.t: "分支任务"
 POD_mummy_spell_of_life_journeys.21.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"A lying head rests above the safe path.\"\nThe green head says, \"The red head speaks only the truth.\"\nThe blue head says, \"The red head rest above the safe path.\""
 POD_mummy_spell_of_life_journeys.21.a: "我走红色的门。"
 POD_mummy_spell_of_life_journeys.21.b: "我走绿色的门。"
 POD_mummy_spell_of_life_journeys.21.c: "我走蓝色的门"
 POD_mummy_spell_of_life_journeys.21.effect.success: "The path leads to knowledge"
 POD_mummy_spell_of_life_journeys.22.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"The green head rest above the safe path.\"\nThe blue head says, \"The green head speaks only lies.\"\nThe green head does not speak."
 POD_mummy_spell_of_life_journeys.23.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"Only one head lies.\"\nThe green head says, \"Only one head speaks the truth.\"\nThe blue head says, \"A lying head rests above the safe path.\""
 POD_mummy_spell_of_life_journeys.24.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"The blue head speaks only lies.\"\nThe green head says, \"The blue head speaks only the truth.\"\nThe blue head says, \"A lying head rests above the safe path.\""
 POD_mummy_spell_of_life_journeys.25.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"Another head rests above the safe path.\"\nThe green head says, \"Another head speaks only the truth.\"\nThe blue head says, \"Another head has said 'another head'.\""
 POD_mummy_spell_of_life_journeys.26.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. However, a deadly test lies within as the priests were rather particular about who they deemed worthy of their sacred mysteries. You found a hidden trapdoor behind the altar, leading down into darkness. After making your way through narrow tunnels arranged in a maze, the walls open up before you into a large circular chamber. Three gateways, seemingly carved from the pure darkness of the void and held in place by golden etchings, lie before you. Above each gate is a head of different colors: red, green, and blue. As you enter the room, you trigger an unseen mechanism, and all three heads begin speaking in perfect synchronization.\n\n\"Hear us, seekers of forbidden knowledge.\nBefore you stand the paths of judgment.\nOf the voices that speak to you now, at least one speaks only truth,\nand at least one speaks only falsehood.\nKnow this as well: one door alone leads onward,\nwhile the other two grant only death—swift, certain, and final.\nBefore you rests eternity or doom\nChoose your path carefully.\"\n\nThe red head says, \"The safe path lies below the only head that speaks the truth.\"\nThe green head says, \"Only one head speaks the truth.\"\nThe blue head says, \"The red head rests above the safe path.\""
 POD_mummy_spell_of_life_journeys.27.t: "黑暗之路"
 POD_mummy_spell_of_life_journeys.27.desc: "You pass between the golden etchings and walk into the emptiness, allowing it to swallow you. The darkness tugs at you, unraveling your form like a loosely-bound ball of yarn. On the hand held in front of your face, your fingers stretch as if thread pulled taut. Despite lacking anything to compare yourself against within this endless void, you know that your body is becoming longer and thinner, stretching and curling, twisting and turning. On the loom of space, your thread is being pulled out and woven into a new location as your body leaves the temple.\n\nYou know that your only chance is to reestablish your body around your mind and will so that you can push further into the temple."
 POD_mummy_spell_of_life_journeys.27.a: "我凝聚意志……"
 POD_mummy_spell_of_life_journeys.27.effect.success: "你取得了你的奖品。"
 POD_mummy_spell_of_life_journeys.27.effect.failure: "The temple spits you out"
 POD_mummy_spell_of_life_journeys.28.t: "Bones Rattle"
 POD_mummy_spell_of_life_journeys.28.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient tomb. Historical records differ regarding its inhabitants. Some say that a mage or sorcerer was buried there. Perhaps the remnants of a liche were placed there by their followers. Others say that a mummy, maybe Horus himself, once stored their body in this tomb between rebirths. Regardless of the truth, clues lie among the corpses.\n\nAfter breaking apart stones that have seen more years fall away than you have seen leaves fall, you enter into a strange cavern. A strange pedestal stands at the center, and four sarcophagi stand upright, aligned with the cardinal directions. Atop the pedestal is a scroll in a sealed container, and four buttons stick out from the pedestal's sides. On their faces are an octagon, a square, two parallel lines from top-left to bottom-right, and a vertical line. Scattered throughout the room are strange phrases, inscribed on the sarcophagi, carved into the floor, printed on the walls. \"Bones rattle\" appears 4 times. \"Cursed bones\" appears 4 times. \"Trapped doom\" appears 3 times."
 POD_mummy_spell_of_life_journeys.28.a: "Press the octagon, square, & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.b: "Press the square button"
 POD_mummy_spell_of_life_journeys.28.c: "Press the parallel line button"
 POD_mummy_spell_of_life_journeys.28.d: "Press the square, parallel, & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.e: "Press the octagon, parallel, & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.f: "Press the parallel & vertical line buttons"
 POD_mummy_spell_of_life_journeys.28.effect.success: "The container slides away"
 POD_mummy_spell_of_life_journeys.29.t: "Statues Rise"
 POD_mummy_spell_of_life_journeys.29.desc: "As you begin entering your chosen sequence, an orange glow suffuses the pedestal. With the last press, the soft orange glow is replaced with a red flash and a screeching sound from all angles. The carved covers of the cardinal sarcophagi slide away with the pained groans of a man as old as the tomb itself. From their once-hidden depths, four animated statues step forth, bearing chiseled armor and sculpted swords. Embedded in the stone are human bones covered in ancient runes, animating these humanoid effigies. Working in perfect concert, they begin attacking you, swinging blades that weigh as much as you with ease."
 POD_mummy_spell_of_life_journeys.29.a: "No antique figurine can beat me!"
 POD_mummy_spell_of_life_journeys.29.effect.success: "They crumble before you"
 POD_mummy_spell_of_life_journeys.29.effect.failure: "他们将你驱赶走。"
 POD_mummy_spell_of_life_journeys.30.t: "如其在上，如其在下"
 POD_mummy_spell_of_life_journeys.30.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried in an ancient temple. Once, it was a home to a mystery cult. Some theorize that the priests here worshipped Osiris and Isis, though their true gods have been lost to the sands of time. Supposedly, the cult emphasized the continuation of life after death. Today, all that remains is the stone edifice of their place of worship.\n\nBuried under the temple is a hidden one, in far better condition and once witness to the cult's inner mysteries. It is a perfect reflection of what was once above the surface, flipped upside such that as you descend down the stairs, you approach what would have been a tower reaching towards the sky. At the deepest depth is a perfectly circular room. A beam of light shines down from a series of mirrors hidden within the room's ceiling, illuminating an otherwise empty portion of the room. Upon a shockingly-light pedestal at the room's center is a papyrus scroll, ancient and yet intact. A seal bearing the Feather of Judgment rests upon the scroll's front. Below, the words inscribed into the pedestal read, \"Is there no good scribe and learned man who may read this letter which I have brought to Egypt before Pharaoh without spoiling its seal? Who will read the writing within without breaking the wax?\""
 POD_mummy_spell_of_life_journeys.30.a: "I cut myself and bleed on the seal"
 POD_mummy_spell_of_life_journeys.30.b: "I bundle it in papyrus to reed it"
 POD_mummy_spell_of_life_journeys.30.c: "I sleep with my head beside it"
 POD_mummy_spell_of_life_journeys.30.d: "I reposition it below the mirrors"
 POD_mummy_spell_of_life_journeys.30.e: "I cast a spell to read the scroll's contents"
 POD_mummy_spell_of_life_journeys.30.effect.success: "You memorize the words you see"
 POD_mummy_spell_of_life_journeys.30.effect.failure: "The scroll crumbles at your touch"
 POD_mummy_spell_of_life_journeys.31.t: "残余之物"
 POD_mummy_spell_of_life_journeys.31.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie buried amongst the ruins of a city, cadaverous and interred but not dead. Beyond the Pillars of Melqart and the Gates of Gades, unholy beings claimed a city and feasted. Their loathsomeness seeped into surfaces reminiscent of spheres, angles sticking into unseeable spaces. The flat became tilted, the convex became concave, and the corners became mouths. Nightmares bred, the Cyclops came, the seven moved on, and the great wen drowned. Well... so the stories say.\n\nAs you swim down, you see diseased masonry, so similar to familiar architecture and yet cancerous, so firm and yet oozing as if slime along a shoreline. Masses of flesh and tentacles silently slither over grins held by faces resting in the darkness while above them, centuries passed. Perhaps they are waiting for banged grains. You make your way towards a monolith-crowned citadel festooned with effigies beyond description and hieroglyphs beyond definition. At the peak rests a plaque whose symbols shift and squirm under your vision.\n\"Bear your mind. Speak the phrase.\n2-1-16 1-2-5 1-2-17\""
 POD_mummy_spell_of_life_journeys.31.a: "Cancerous Melqart feasted"
 POD_mummy_spell_of_life_journeys.31.b: "虽死犹梦"
 POD_mummy_spell_of_life_journeys.31.c: "Cadaverous Cyclopean drowned"
 POD_mummy_spell_of_life_journeys.31.d: "在彼方之纹外，凸起化作凹陷，扭曲翻涌，蠕动不休"
 POD_mummy_spell_of_life_journeys.31.e: "我凭直觉行事。"
 POD_mummy_spell_of_life_journeys.31.effect.success: "Secrets reveal themselves in the squirming"
 POD_mummy_spell_of_life_journeys.31.effect.failure: "它从你这里扭身逃开了。"
 POD_mummy_spell_of_life_journeys.32.t: "梦想之堤"
 POD_mummy_spell_of_life_journeys.32.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie in the remnants of a noble's house. The ruin lies buried under soil left by countless floods of the nearby river. Within the house should be a book locked within a box of iron. In the box of iron is a box of copper. In the box of copper is a box of juniper wood. In the box of juniper wood is a box of ivory and ebony. In the box of ivory and ebony is a box of silver. In the box of silver is a box of gold, and in it is the book.\n\nYou scrape away the layers of dirt and walk through what was once a doorway. You pass through ancient halls and descend into what once was a basement and is now little more than a hole lit by an unnatural green. And such a green it is, coming from every angle and yet clearly originating from a jagged rip in reality. The stories told you of the so-called Dam of Dreams. Passing through it leaves you at the edge of a cliff. The air hums with the green you saw before, pulsing in time with your heartbeat. Stretched out before and below you are six miles of giant serpents, crocodiles, spiders, scorpions, and every form of reptile and arachnid ever seen or imagined. They coil and uncoil, forming vast living patterns. Circles within circles, tails brushing teeth, endlessly consuming themselves. Across the Sea of Serpents rests an ouroboros, fangs sunk into its own tail and eternally encircling the box you seek.\n\nThe old stories say that these creatures await a single command. One word to still their movements, to shift their patterns, to form a bridge."
 POD_mummy_spell_of_life_journeys.32.a: "结论"
 POD_mummy_spell_of_life_journeys.32.b: "冲突"
 POD_mummy_spell_of_life_journeys.32.c: "无尽"
 POD_mummy_spell_of_life_journeys.32.d: "宇宙"
 POD_mummy_spell_of_life_journeys.32.e: "I shall form a waxen crew & cut my way through"
 POD_mummy_spell_of_life_journeys.32.effect.success: "你打开你的奖励"
 POD_mummy_spell_of_life_journeys.32.effect.failure: "The sea of serpents is endless"
 POD_mummy_spell_of_life_journeys.33.t: "亲和，或是死亡！"
 POD_mummy_spell_of_life_journeys.33.desc: "在探求生命神咒秘典的过程中，你发现了一些线索藏在一座古墓之中，不过墓中是否有遗体，实为一大争议。传说中提到一位睿智的大师，曾将多名学生逼至疯狂，甚至更糟。他以严苛的考验和惩罚闻名，凡是达不到他标准的人，都会受到他的制裁。在他看来，那些不配拥有他知识的人，必须证明自己配得上生命。若不如此，他非常乐意纠正这个问题。\n\n打开古墓并逐层向下后，你进入其中，看到一座30英尺高的雕像，手持一块刻有文字的卷轴，雕像坐落于一个带有铭牌和5个按钮的底座上。按钮依次为红、橙、黄、绿、蓝。雕像下方的铭牌写道：“解读我的教诲，以证明你对魔法的亲和力，从而赢得我的知识。或许你能描述一个仿射空间的自同构。若你连如此简单的信息都无法解读，或连如此简单的数学都无法完成，我所有的知识都将被摧毁。别像个无知的莽夫一样硬闯。”雕像所持卷轴上写着：\n\nG2w mooi sg ix26nojyo 2t s4y8e m2 7h21o g2whmont 74hr64g e2s7oroxr. G2w m32wnj 7homm r3o 2h4xyo 9wrr2x."
 POD_mummy_spell_of_life_journeys.33.a: "按下红色按钮。"
 POD_mummy_spell_of_life_journeys.33.b: "按下橙色按钮。"
 POD_mummy_spell_of_life_journeys.33.c: "按下黄色按钮。"
 POD_mummy_spell_of_life_journeys.33.d: "按下绿色按钮。"
 POD_mummy_spell_of_life_journeys.33.e: "按下蓝色按钮。"
 POD_mummy_spell_of_life_journeys.33.f: "我凭直觉行事。"
 POD_mummy_spell_of_life_journeys.33.effect.success: "卷轴碎裂，露出纸张。"
 POD_mummy_spell_of_life_journeys.33.effect.failure: "雕像骤然燃起烈焰。"
 POD_mummy_spell_of_life_journeys.34.t: "探索者的巢穴"
 POD_mummy_spell_of_life_journeys.34.desc: "在探求生命神咒秘典的过程中，你揭示了一种最终仪式所必需的成分。那成分是一种早已灭绝的爬行动物的胆汁，据说其嘴巴能张得极大，足以让一个人不用低头就能走进去。不幸的是，过去一位生命神咒的寻求者因其失败的努力而灭绝了所有那种爬行动物。幸运的是，你找到了一个据说是那位探索者宝库的地点。\n\n你穿过森林，一路披荆斩棘，斩开植被与野兽。木上的节瘤似乎随着你的动作移动，责备着你的每一步。沉甸甸的枝条向下垂挂，像爪子一样刮擦着你的盔甲和皮肤。终于，你到达了那里。泛黄的骨头从泥土中凸出，一张豁开的巨口从地貌中显现。风在齿间呼啸，像无形的磨石一样磨利它们。你小心地走下台阶，任由自己被黑暗吞噬。底部先是一张张开的颚，然后是一张闭合的颚。两副颚的牙齿上都刻着生硬、棱角分明的字母。从顶角从左向右读，张开的颚上写着：“展示你应在此，方可获准进入。”闭合的颚上则写着更令人困惑的内容。“BTELDIIEBTELDIOETBRBRYHBAELVDYHBAEHPDOEEON”。"
 POD_mummy_spell_of_life_journeys.34.a: "等一下，拿个酸液瓶"
 POD_mummy_spell_of_life_journeys.34.b: "等一下，让我看看这具尸体。"
 POD_mummy_spell_of_life_journeys.34.c: "等一下，举起剑来。"
 POD_mummy_spell_of_life_journeys.34.d: "等一下，敲响钟铃。"
 POD_mummy_spell_of_life_journeys.34.effect.success: "胆汁归你所有。"
 POD_mummy_spell_of_life_journeys.35.t: "一堆乱牙"
 POD_mummy_spell_of_life_journeys.35.desc: "巨颚缓缓张开，发出的声响犹如利剑出鞘。你本以为会见到向下的阶梯，或是一瓶半空的胆汁，映入眼帘的却是野兽——一种你从未见过的爬行动物。它们形似鳄鱼，但六条腿的关节构造更接近短吻鳄，锥刺状的尾巴拖在圆桶般的躯体之后。数十颗牙齿上下交错，赫然突出于口外。看来，这位前辈寻道者认定，豢养这些野兽以取胆汁，远比在野外猎杀它们来得轻松。此法虽妙，只是历经岁月，它们似乎已然回归野性。"
 POD_mummy_spell_of_life_journeys.35.a: "剑能解决的事，都不算事。"
 POD_mummy_spell_of_life_journeys.35.effect.success: "胆汁归你所有。"
 POD_mummy_spell_of_life_journeys.35.effect.failure: "他们将你赶走"
 POD_mummy_spell_of_life_journeys.36.t: "神秘人物"
 POD_mummy_spell_of_life_journeys.36.desc: "在探求生命神咒秘典的过程中，你发现了一些线索藏于一座古老的墓穴之中，尽管其中是否有尸体仍是一个争议极大的问题。传说中，有一位睿智的大师曾将多名学生逼至疯狂，甚至更糟。他因严苛的考验以及对未能达到他标准者的惩罚而臭名昭著。在他看来，那些不配获得他知识的人必须证明自己配得上生命。若不能，他则乐于纠正这个问题。\n\n打开墓穴并向下深入后，你进入其中，看到一尊三十英尺高的雕像，手中握着一卷刻有文字的卷轴，放置于带有一块铭牌和四个按钮的基座之上。每个按钮上都有一个数字。雕像下方的铭牌写着：“解读我的教诲，以证明你对魔法的亲和力，从而获得我的知识。若你连如此简单的信息都无法读懂，或连如此简单的算术都无法完成，我所知的一切将被毁去。别像愚昧的蛮夫一样强行硬闯。”雕像手中的卷轴内容如下：\n\n橙色 + 蓝色 = 5 ；蓝色 + 红色 = 3 ；橙色 + 红色 = 4 ；紫色 = ？"
 POD_mummy_spell_of_life_journeys.36.a: "按3"
 POD_mummy_spell_of_life_journeys.36.b: "按4"
 POD_mummy_spell_of_life_journeys.36.c: "按5"
 POD_mummy_spell_of_life_journeys.36.d: "按6"
 POD_mummy_spell_of_life_journeys.36.e: "我凭直觉行事。"
 POD_mummy_spell_of_life_journeys.36.effect.success: "卷轴碎裂，露出纸张。"
 POD_mummy_spell_of_life_journeys.36.effect.failure: "雕像骤然燃起烈焰。"
 POD_mummy_spell_of_life_journeys.37.t: "塞尔凯特哨兵"
 POD_mummy_spell_of_life_journeys.37.desc: "在探求生命神咒秘典的过程中，你发现了一些线索指向一座金字塔内部。关于其内容的记载寥寥无几，但你也听闻过那位强大的守护者。传说中有几分真实，尚待验证。\n\n一股非自然的雾气弥漫在空气中，比你吃过的任何浓汤都要厚重，气味却出奇地相似。当你趟过雾气时，它仿佛被一道无形的屏障挡住，突然停住。眼前延伸着无尽的血红色沙丘，在阳光下格外醒目。金字塔的银色塔顶在远处耸立，随着你翻过沙丘、逐渐靠近，塔身慢慢过渡为黑色大理石。封闭的石门两侧矗立着两座方尖碑，仿佛几乎要吞噬阳光，并将其脉动般传输进大理石的纹理之中。门前站着的东西起初看似一个手持巨斧的巨人，但沙地很快分向两侧，露出其腰部以下蝎子的腿和尾刺。当你走近时，这名塞尔凯特守护者挡住了你的去路，开口说话。\n\n“你可以说一句话。若为真，我便砍下你的头；若为假，我便剖开你的肚腹。”"
 POD_mummy_spell_of_life_journeys.37.a: "你会砍掉我的头。"
 POD_mummy_spell_of_life_journeys.37.b: "你会剖开我的肚子。"
 POD_mummy_spell_of_life_journeys.37.c: "你会杀了我。"
 POD_mummy_spell_of_life_journeys.37.d: "我先杀了你！"
 POD_mummy_spell_of_life_journeys.37.effect.success: "斧头移开，让你通过。"
 POD_mummy_spell_of_life_journeys.37.effect.failure: "斧头落在了你曾经站立之处。"
 POD_mummy_spell_of_life_journeys.38.t: "Power of the Party"
 POD_mummy_spell_of_life_journeys.38.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that some clues lie within a tomb. Where most seekers of the Spell of Life worked on their own, this cabal of mages worked together to further their goals. Where others pursued the magic of the Spell of Life alone, they sought a more holistic approach where they improved body, mind, and soul. Some say they were influenced by traditions that came from lands east of  Kemet, following the trade routes. Few details remain of their work, though the word 'akasha' appears a few times and their failure is clear.\n\nAt first, it seems like nothing more than a hole in the ground, covered over by the dirt of ages long past. You expected a staircase or a ladder, but instead, a ramp descends before you, curving to the right. With each step and each turn, you move ever downwards. Step after step, turn after turn, you pass by carved images depicting many scenes of studying, chanting, meditating, crafting, growing, dancing, and more. So it continues as you pass through gate after gate until 4 gates are behind you. Finally, you stand before a closed gate. Above it, there are some words inscribed. \"Speak the truth to continue. When there are two of me, we are better than one. When there are two hundred of me, we are a loud fool. When we move as one, nothing can stand against us. When we move in opposite directions, we move nowhere. What am I?\""
 POD_mummy_spell_of_life_journeys.38.a: "Minds"
 POD_mummy_spell_of_life_journeys.38.b: "Oxen"
 POD_mummy_spell_of_life_journeys.38.c: "Drums"
 POD_mummy_spell_of_life_journeys.38.d: "Wheels"
 POD_mummy_spell_of_life_journeys.38.e: "我凭直觉行事。"
 POD_mummy_spell_of_life_journeys.38.effect.success: "门缓缓开启……"
 POD_mummy_spell_of_life_journeys.38.effect.failure: "The turns lead only upwards"
