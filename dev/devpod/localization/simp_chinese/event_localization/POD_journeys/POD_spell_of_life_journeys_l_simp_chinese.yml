 POD_mummy_spell_of_life_journeys.43.effect.failure: "“让我独自等待一个配得上我秘密的蠢货吧”。"
 POD_mummy_spell_of_life_journeys.44.t: "古老殿堂"
 POD_mummy_spell_of_life_journeys.44.desc: "在探求生命神咒秘典的过程中，你发现了一些线索藏在一座古老堡垒之中。你接近时，巍峨的山峰在你面前拔地而起，仿佛要伸手去攫取诸神的不朽。你行走在曾经是路、如今已成田野的地方，远处残留的几块石砖堆成了篱笆的一部分。你的书籍记载，这里曾是一条繁忙的商道，通往一座由山间影堡守护的矿业小镇。当你眼前只有草地时，很难想象大型商队曾在此穿行。小镇本身只剩下腐烂的木头，其余都被留在当地的居民重新利用了。通往堡垒的路上，那曾经从山体内部雕凿出的宏伟阶梯，如今已与废弃矿坑无异。就连台阶本身也被侵蚀殆尽，只剩下勉强能称为坡道的东西。每一步都回响在弯曲的墙壁间，在寂静中回荡。顶端是一座大门，虽然不再像曾经那样装饰华丽，却依然坚固挺立。那些曾经费尽心力雕刻的花纹已磨损殆尽，油漆褪色，黄金装饰也已被盗走。然而，门和它的标记依然存在。\n\n“我从未存在，却永远将至，无人见过我，也将无人得见，不属于任何人之手，却由你掌控。然而我是所有生灵的信念，在这圣殿中呼吸存活。”"
 POD_mummy_spell_of_life_journeys.44.a: "希望"
 POD_mummy_spell_of_life_journeys.44.b: "时间"
 POD_mummy_spell_of_life_journeys.44.c: "明天"
 POD_mummy_spell_of_life_journeys.44.d: "灵魂"
 POD_mummy_spell_of_life_journeys.44.e: "我凭直觉行事。"
 POD_mummy_spell_of_life_journeys.44.effect.success: "门吱呀一声开了……"
 POD_mummy_spell_of_life_journeys.44.effect.failure: "大门紧闭，纹丝不动。"
 POD_mummy_spell_of_life_journeys.45.t: "被遗忘的失败"
 POD_mummy_spell_of_life_journeys.45.desc: "在探求生命神咒秘典的过程中，你发现了一些线索，表明某些遗迹中藏有提示，尽管无人记得那地方原本的用途。铺石小径已被草脉割裂。曾经宏伟的立柱碎落一地。昔日旗帜骄傲飘扬之处，如今所剩无几。墙壁已经破败，整座结构不断坍塌，进一步掩盖了它本来的面目。那座气势逼人的大厅似乎旨在引导人们前往某个特定地点。每走一步，你都会经过散落在泥泞地面上的精美壁画和细致雕刻。一些松动的石板上有符号，而某些石头上则刻着完整的句子。“§我即源头，即宇宙，即不可分割的整体§”这是你遇到的第一块石头上的文字。第二块写着“Ð我即主宰，生死之主Ð。”接着还有“ß我即一切存在，曾是，将是ß”以及“Ǿ我即星球上的首要方位，虚假自由的象征Ǿ。”再往前，你看到另一块石头，“Ѭ我即存在的掌握，握于拳中Ѭ。”有趣的是，有些符号似曾相识，而另一些则让你困惑不解。\n\n不久，你到达一座大门前，它被魔法与凡人之力封印。门上粗糙地刻着“于是世界的宫殿成了愚者的牢笼”，后面跟着一个带有缺失字符的方格。你需要将散落的石板放回正确的位置才能继续前行。\n\n Ð (a) ß (b) Ѭ \n(c) Ð  Ѭ  ß (d)\n Ѭ (e) Ǿ (f) Ð \n §  Ǿ  Ð  Ѭ (g)\n ß  Ѭ (h) Ð (i)"
 POD_mummy_spell_of_life_journeys.45.a: "a=§, b=Ǿ, c=Ǿ, d=§, e=ß, f=§, g=ß, h=§, i=Ǿ"
 POD_mummy_spell_of_life_journeys.45.b: "a=§, b=§, c=§, d=§, e=§, f=§, g=§, h=§, i=§"
 POD_mummy_spell_of_life_journeys.45.c: "a=§, b=Ð, c=Ð, d=§, e=Ǿ, f=§, g=Ǿ, h=§, i=Ð"
 POD_mummy_spell_of_life_journeys.45.d: "a=Ð, b=§, c=§, d=Ð, e=Ǿ, f=Ð, g=Ǿ, h=§, i=Ð"
 POD_mummy_spell_of_life_journeys.45.e: "a=ß, b=ß, c=§, d=Ð, e=Ð, f=ß, g=Ð, h=ß, i=§"
 POD_mummy_spell_of_life_journeys.45.effect.success: "门缓缓开启……"
 POD_mummy_spell_of_life_journeys.46.t: "被遗忘的失败"
 POD_mummy_spell_of_life_journeys.46.desc: "选定答案后，墙壁与门后传来阵阵碾磨声、撞击声与大碎溃的轰鸣。大门或许正缓缓敞开，但你隐约感到，这些古老机关并未妥善应对你选错的答案。\n\n步入房间，阴影中两点暗红的光晕隐约闪烁，下方是自扭曲笑容中垂落的獠牙。“我重获自由只是时间问题。那些凡俗蠢货永远无法接受我崭新而辉煌的形态，也无法理解我已拥有无尽时光，足以等他们尽数消亡。他们从不明白我所掌握的力量——我确确实实是生死之主，正如我命中注定那般！现在，现在……”一个扭曲、枯槁的身影一边说着，一边向你窜来。“你将为我注入力量，好让我登上本应属于我的世界之主之位！我只需你付出一样廉价之物：你的性命。不过别担心，我会让我的信徒把你尊为殉道者。”那两排闪亮的獠牙朝你扑来……"
 POD_mummy_spell_of_life_journeys.46.a: "我要将这个蠢货击倒在地。"
 POD_mummy_spell_of_life_journeys.46.effect.success: "他的头颅滚落开来"
 POD_mummy_spell_of_life_journeys.46.effect.failure: "你赢了，但代价是什么"
 POD_mummy_elixir_of_eternal_life_journeys.10.t: "对永恒的沉思"
 POD_mummy_elixir_of_eternal_life_journeys.10.desc: "唯有通过冥想，我们才能真正理解轮回之道。\n\n虽然这意味着疏忽我其他的职责，但通过退隐静修冥想，我也许能更深入地了解自己，并领悟如何实现永恒的转生。"
 POD_mummy_elixir_of_eternal_life_journeys.10.a: "我将隐居在我的[ROOT.Char.Custom('ResidenceBuilding')]之中。"
 POD_mummy_elixir_of_eternal_life_journeys.10.b: "我将在荒野中找到一个地方。"
 POD_mummy_elixir_of_eternal_life_journeys.10.c: "我将退隐至一处僻静之地。"
 POD_mummy_elixir_of_eternal_life_journeys.10.a.tt: "Rather than starting a [journey|E], you shall meditate here, a #P safe and easy#! place"
 POD_mummy_elixir_of_eternal_life_journeys.10.b.tt: "你将开始一段[journey|E]，前往#bold $elixir_of_eternal_life_stage2_meditation_name$#!，到一个#Z 颇具挑战#!的地方进行冥想。"
 POD_mummy_elixir_of_eternal_life_journeys.10.c.tt: "你将开启一段[journey|E]旅程，前往#bold $elixir_of_eternal_life_stage2_meditation_name$#!，抵达一个#N 艰难险阻#!地方进行冥想。"
 POD_mummy_elixir_of_eternal_life_journeys.10.success: "你的修行带来了一些洞见。"
 POD_mummy_elixir_of_eternal_life_journeys.10.failure: "你的冥想未能带来任何洞察。"
 POD_mummy_elixir_of_eternal_life_journeys.11.t: "对永恒的沉思"
 POD_mummy_elixir_of_eternal_life_journeys.11.desc: "踏入荒野，心神无羁，自由徜徉。借由斋戒与冥想，思绪转而向内。我思量所学一切，致力于巩固修炼根基，深化对永世轮回的理解。"
 POD_mummy_elixir_of_eternal_life_journeys.11.a: "这些打断带来了一些困难……"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success.critical: "但它从我的意识中滑落，如同水从玻璃上流走。"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success: "但我战胜了他们。"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure: "并阻止我找到内心的平静"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure.critical: "那无休止的喧嚣让我寸步难行。"
 POD_mummy_elixir_of_eternal_life_journeys.11.b: "旅途与孤独本身带来了一些挑战……"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success.critical: "但匮乏给了我一个洞察。"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success: "但我战胜了他们。"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure: "并且迫使我撤退到掩体中。"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure.critical: "我的嘴唇因口渴而迅速干裂"
 POD_mummy_elixir_of_eternal_life_journeys.11.internal: "你对冥想的体验和对身体的掌控，提高了你取得重大成功的几率，并降低了遭受重大失败的风险。"
 POD_mummy_elixir_of_eternal_life_journeys.21.t: "[Concept('translation_minigame', '翻译')|E]深奥的记录"
 POD_mummy_elixir_of_eternal_life_journeys.21.desc: "Your efforts have yielded some esoteric record of an undiscernible age. Despite your familiarity with multiple languages and the linguistic capabilities of your courtiers, your combined efforts have proven insufficient to render it interpretable. Invisible ink obscures critical details. Enciphered words speckle the text. The portions written in a familiar language are barely interpretable, requiring a technical and magical mastery that you are just starting to achieve. The writer's shorthand only further complicates your translation efforts.\n\nOne particular, five-letter word seems to be the key to translating the remainder. Unfortunately, you'll only have 6 opportunities as your efforts are rather destructive."
 POD_mummy_elixir_of_eternal_life_journeys.21.b: "我放弃"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.success: "你的翻译很成功。"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure: "你的翻译失败了。"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure.details: "你失败的尝试毁掉了记录"
 POD_mummy_elixir_of_eternal_life_journeys.22.t: "无尽回廊之厅"
 POD_mummy_elixir_of_eternal_life_journeys.22.desc: "Through your research and explorations, you discovered an ancient technique to aid in cultivation: the Halls of Infinite Reflection. By positioning yourself at the center of a ritual formation made of mirrors, the power within you will be reflected upon and unto itself many times before re-entering your body. That power will be further amplified as it courses through the geometric shapes used to construct the formation.\n\nAs you place yourself at the formation's core, there are two mirrors set almost facing one another, such that you can see yourself over your shoulder, endlessly curving away into the universe within the mirror. As you turn your eyes inward, you can feel yourself pouring into yourself, multiplying itself through the endless reflections. From an outsider's perspective, it would be almost impossible to determine where the mirrors end and you begin.\n\nAt first, everything is going well. Your cultivation is advancing by leaps and bounds. Then, you feel yourself cracking and shattering into infinite shards, each shard a fractal reflection of your form before flowing into silvered surface of the mirror before you. When you awaken, a multilayered, silvery world stretches out before you, perfectly smooth, perfectly endless. At every turn, there is a reflection of you, perfect yet insubstantial, mirroring you yet each wearing a different expression, unique even amongst all of the others. No two smiles are exactly the same, nor any two frowns. They do not move as you walk amongst and through them, only turning so that their eyes may follow you. Through the surprise and panic, an old story of the Mirror Realm comes to mind. \"Only by finding the real can one escape the prison of their own reflection.\""
 POD_mummy_elixir_of_eternal_life_journeys.22.a: "指着你自己"
 POD_mummy_elixir_of_eternal_life_journeys.22.b: "尝试寻找不完美的副本"
 POD_mummy_elixir_of_eternal_life_journeys.22.c: "闭上眼睛，然后过一遍副本。"
 POD_mummy_elixir_of_eternal_life_journeys.22.d: "寻找规律和形状"
 POD_mummy_elixir_of_eternal_life_journeys.22.e: "我还记得更多那个故事吗？"
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.success: "倒影碎散，融入你身"
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.failure: "你在逃跑前经历了无数次反思。"
 POD_mummy_elixir_of_eternal_life_journeys.23.t: "一箱药片"
 POD_mummy_elixir_of_eternal_life_journeys.23.desc: "Your latest expedition led you to a cache of 4 medicinal pills left behind by someone that previously sought the Elixir of Eternal Life. Among the remnants of the notes, you learn that you would benefit greatly by taking exactly one of each of the 2 pill types every day. However, taking too much of any one type will negate the benefits. Unfortunately, the pills are mixed together in a single bottle, are unmarked, and look identical. How can you make sure that you take the correct pills?"
 POD_mummy_elixir_of_eternal_life_journeys.23.a: "Take 3 pills the first day & 1 the second day"
 POD_mummy_elixir_of_eternal_life_journeys.23.b: "Take 1 random pill each day to prevent the penalty"
 POD_mummy_elixir_of_eternal_life_journeys.23.c: "Eat 1 half of each pill on each day"
 POD_mummy_elixir_of_eternal_life_journeys.23.d: "将2片药片碾碎，混合后每日服用。"
 POD_mummy_elixir_of_eternal_life_journeys.23.e: "每天随机服用2粒药片"
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.success: "丹药能够增强你的修炼"
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.failure: "经过大量呕吐后，你看不到任何好处。"
 POD_mummy_elixir_of_eternal_life_journeys.24.t: "沙地数字"
 POD_mummy_elixir_of_eternal_life_journeys.24.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in an ancient temple. This sect was known for its esoteric teachings regarding mathematics and divine symmetries. According to their surviving records, they believed that only through math could the Wheel of Ages be understood, tracked, or affected. However, their inner mysteries and the nature of these equations was lost when the sect declined in popularity.\n\nAfter arriving, you realized that the temple was little more than a small meeting space with seats arranged around a pit of sand. Across from the entry was a door barred with some form of magic. While most of the sand pit had been swept by the wind, you saw several stone plaques embedded into the sand before the door. After cleaning off the sand blown over them, you realized each plaque bore a number. You suspect that you need to draw the missing numbers in the sand between the plaques.\na 1 b\n3 5 7\nc 9 d"
 POD_mummy_elixir_of_eternal_life_journeys.24.a: "a=8, b=6, c=4, d=2"
 POD_mummy_elixir_of_eternal_life_journeys.24.b: "a=6, b=8, c=2, d=4"
 POD_mummy_elixir_of_eternal_life_journeys.24.c: "a=5, b=9, c=5, d=1"
 POD_mummy_elixir_of_eternal_life_journeys.24.d: "a=-1, b=3, c=7, d=11"
 POD_mummy_elixir_of_eternal_life_journeys.24.e: "我强行闯过去"
 POD_mummy_elixir_of_eternal_life_journeys.24.effect.success: "魔法消散，道路在你面前展开"
 POD_mummy_elixir_of_eternal_life_journeys.24.effect.failure: "魔法爆炸，摧毁了其中的一切。"
 POD_mummy_elixir_of_eternal_life_journeys.25.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in an ancient temple. This sect was known for its esoteric teachings regarding mathematics and divine symmetries. According to their surviving records, they believed that only through math could the Wheel of Ages be understood, tracked, or affected. However, their inner mysteries and the nature of these equations was lost when the sect declined in popularity.\n\nAfter arriving, you realized that the temple was little more than a small meeting space with seats arranged around a pit of sand. Across from the entry was a door barred with some form of magic. While most of the sand pit had been swept by the wind, you saw several stone plaques embedded into the sand before the door. After cleaning off the sand blown over them, you realized each plaque bore a number. You suspect that you need to draw the missing numbers in the sand between the plaques.\n2 a 6\nb 5 c\n4 d 8"
 POD_mummy_elixir_of_eternal_life_journeys.25.a: "a=4, b=1, c=3, d=6"
 POD_mummy_elixir_of_eternal_life_journeys.25.b: "a=7, b=9, c=1, d=3"
 POD_mummy_elixir_of_eternal_life_journeys.25.c: "a=7, b=5, c=5, d=3"
 POD_mummy_elixir_of_eternal_life_journeys.25.d: "a=1, b=3, c=7, d=9"
 POD_mummy_elixir_of_eternal_life_journeys.25.e: "我强行闯过去"
 POD_mummy_elixir_of_eternal_life_journeys.26.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in an ancient temple. This sect was known for its esoteric teachings regarding mathematics and divine symmetries. According to their surviving records, they believed that only through math could the Wheel of Ages be understood, tracked, or affected. However, their inner mysteries and the nature of these equations was lost when the sect declined in popularity.\n\nAfter arriving, you realized that the temple was little more than a small meeting space with seats arranged around a pit of sand. Across from the entry was a door barred with some form of magic. While most of the sand pit had been swept by the wind, you saw several stone plaques embedded into the sand before the door. After cleaning off the sand blown over them, you realized each plaque bore a number. You suspect that you need to draw the missing numbers in the sand between the plaques.\na 9 b\n7 5 3\nc 1 d"
 POD_mummy_elixir_of_eternal_life_journeys.26.a: "a=4, b=2, c=6, d=8"
 POD_mummy_elixir_of_eternal_life_journeys.26.b: "a=1, b=5, c=7, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.26.c: "a=2, b=4, c=6, d=8"
 POD_mummy_elixir_of_eternal_life_journeys.26.d: "a=2, b=4, c=5, d=9"
 POD_mummy_elixir_of_eternal_life_journeys.26.e: "我强行闯过去"
 POD_mummy_elixir_of_eternal_life_journeys.27.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in an ancient temple. This sect was known for its esoteric teachings regarding mathematics and divine symmetries. According to their surviving records, they believed that only through math could the Wheel of Ages be understood, tracked, or affected. However, their inner mysteries and the nature of these equations was lost when the sect declined in popularity.\n\nAfter arriving, you realized that the temple was little more than a small meeting space with seats arranged around a pit of sand. Across from the entry was a door barred with some form of magic. While most of the sand pit had been swept by the wind, you saw several stone plaques embedded into the sand before the door. After cleaning off the sand blown over them, you realized each plaque bore a number. You suspect that you need to draw the missing numbers in the sand between the plaques.\n4 a 8\nb 5 c\n2 d 6"
 POD_mummy_elixir_of_eternal_life_journeys.27.a: "a=3, b=9, c=2, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.27.b: "a=2, b=9, c=1, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.27.c: "a=3, b=1, c=9, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.27.d: "a=3, b=9, c=1, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.27.e: "我强行闯过去"
 POD_mummy_elixir_of_eternal_life_journeys.28.t: "万物轮回"
 POD_mummy_elixir_of_eternal_life_journeys.28.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in a sect's hall. Hidden in an isolated area and protected by ancient magics, their ancient hall now lays abandoned. Trees and plants have grown up around it, forming a second roof over the surprisingly-untouched structure. Vines and grass almost serve as a barrier around the hall, halting just before the hall's walls. Before the sealed gate are 5 statues arranged in a circle. Their terracotta bodies are intricately molded and shockingly life-like. Their armor is lovingly crafted and painted green, gray, blue, red, and yellow. Their axes... well, their axes are not molded at all. The axes are real, made of peach wood hafts and cold iron heads. Around the bases of the statues, you see some strange scuff marks, and some brief experimentation reveals that each statue is easily rotated. Above the gate is a plaque:\n\"A forest turned into a raging inferno that changed night to day. Hot springs and magma turned to stone as the earth bucked and heaved like a living thing. Enormous rocks hammered into the earth. Marble and granite changed to iron and tin, killing the earth and poisoning the water. The vast mines exploded as ore turned to ten times its volume in water. The lakes and rivers were choked by an endless expanse of green to be burnt once more. And so it was as the world was remade. So it was as the wheel turned once more.\"\n\nHow do you rotate each statue? Towards which statue does each face?"
 POD_mummy_elixir_of_eternal_life_journeys.28.a: "Green at Yellow. Yellow at Blue. Blue at Red. Red at Gray. Gray at Green."
 POD_mummy_elixir_of_eternal_life_journeys.28.b: "Green at Red. Red at Yellow. Yellow at Gray. Gray at Blue. Blue at Green."
 POD_mummy_elixir_of_eternal_life_journeys.28.c: "Green at Gray. Gray at Red. Red at Blue. Blue at Yellow. Yellow at Green."
 POD_mummy_elixir_of_eternal_life_journeys.28.d: "Green at Blue. Blue at Gray. Gray at Yellow. Yellow at Red. Red at Green."
 POD_mummy_elixir_of_eternal_life_journeys.28.e: "我认得出这个循环吗？"
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.success: "The statues face the gate and swing their axes down, opening the doors"
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.failure: "The statues face you and swing their axes down, casting you out"
 POD_mummy_elixir_of_eternal_life_journeys.29.t: "The Proper Order"
 POD_mummy_elixir_of_eternal_life_journeys.29.desc: "经过广泛的研究和派遣你的手下四处探查，你获得了5瓶药水，这些药水出自一位几个世纪前成为“天宗”的炼金术士之手。红色药瓶内火焰燃烧，那火焰在玻璃的束缚中欢快地舞动。绿色药瓶低鸣着微妙的生机，藤蔓般的触须像缓慢的心跳一样舒展又蜷缩。蓝色药瓶摇晃时带着天生的流动感，仿佛随潮汐起伏。黄色药瓶在你手中沉甸甸的，每次细微晃动都像一座山在缓缓沉降。最后，白色药瓶如铃铛般清脆作响，表面泛着镜面般的光泽。若按正确顺序将它们混合，将对你的修为大有裨益。遗憾的是，他的笔记只留下了一则摘录：\n\n“白色药水不是第一。红色药水在黄色药水之前。绿色药水不在白色药水之前，但在黄色药水之前。蓝色药水应该排在第二位。”"
 POD_mummy_elixir_of_eternal_life_journeys.29.a: "红、蓝、白、绿、黄"
 POD_mummy_elixir_of_eternal_life_journeys.29.b: "红、蓝、绿、白、黄"
 POD_mummy_elixir_of_eternal_life_journeys.29.c: "红、蓝、绿、黄、白"
 POD_mummy_elixir_of_eternal_life_journeys.29.d: "蓝、红、白、绿、黄"
 POD_mummy_elixir_of_eternal_life_journeys.29.e: "嗯，也许那个，然后再加那个……"
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.success: "一瞬间，它变得完全透明。"
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.failure: "一闪之间，一缕烟雾从中升起。"
 POD_mummy_elixir_of_eternal_life_journeys.30.t: "奇怪的材料"
 POD_mummy_elixir_of_eternal_life_journeys.30.desc: "After extensive research and sending your agents far and wide, you have obtained an ancient alchemical recipe book, though most of its antiquated pages are beyond recovery. On the first page are listed Wormwood, Knotgrass, Pearl Dust, Spider Ichor, Moondew, Shadowbloom Leaves, Pufferfish Powder, Snake Bile, Honey Water, and Frog Eyes. Moondew is a particularly odd ingredient since itself is a liquid mixture of several other ingredients and was difficult to obtain. The only surviving recipe appears to have been written poetically. However, deciphering it could yield substantial benefits and allow for the brewing of a very potent elixir.\n\n\"Five you must shun.\nTo start the brew, neither end you should pick\nSecond inside, only one will do the trick\nYou will not need any creatures of the land\nAnd only one plant will provide a helping hand\nThree you desire, all in a line\nThe last is a powder, grown in water brine\nTo make the elixir add the neighbors and stir well, clockwise\nNext, add the liquid and bubbles shall arise\nThe last ingredient you must sprinkle, then mix it around\nNow time to drink it down.\""
 POD_mummy_elixir_of_eternal_life_journeys.30.a: "Wormwood, Knotgrass, Pearl dust, Moondew, Pufferfish Powder"
 POD_mummy_elixir_of_eternal_life_journeys.30.b: "Pearl Dust, Moondew, Shadowbloom Leaves, Snake Bile, Pufferfish Powder"
 POD_mummy_elixir_of_eternal_life_journeys.30.c: "Shadowbloom Leaves, Pufferfish Powder, Honey Water, Pearl Dust, Moondew"
 POD_mummy_elixir_of_eternal_life_journeys.30.d: "Moondew, Shadowbloom Leaves, Pufferfish Powder, Honey Water, Pearl Dust"
 POD_mummy_elixir_of_eternal_life_journeys.30.e: "少许这个，再来点那个……"
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.success: "一瞬间，它变得完全透明。"
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.failure: "一闪，它便燃烧起来。"
 POD_mummy_elixir_of_eternal_life_journeys.31.t: "奇异酿造"
 POD_mummy_elixir_of_eternal_life_journeys.31.desc: "After extensive research and sending your agents far and wide, you have obtained a single vial. Upon uncorking it, a cocktail of scents arise from the inscrutable liquid within, clearly a potion in the making. Based on your expertise with brewing and the rumors collected by your agents, the vial is only missing a single ingredient to be complete. Alongside the vial in its hiding place was a collection of 7 ingredients: Garrison Root, Rainbow Sycamore Oil, Psion Salt, Parsley, Skeletal Violet, Golden Skullcap, Snapdragon. Each ingredient would imbue a different effect to the vial, and adding multiple ingredients risks the entire mixture exploding. Unfortunately, you specifically need a love potion to complete your current experiment. However, all of the surviving notes are written in shorthand, and the ink has faded over the long years it was left untended. Either that, or the author was untrained in the ways of proper calligraphy.\n\nGldn ht drns fyr and prmots yin. Rnbw yl trgrs cmbstn in jain from sn. Erb tsts gud fr sup, lv it. Rd Npdrg prvd brth of fyr. Grsnrt prvnt gngrne in wuwnds. Cyon s curus rsidu frm ndrgnd lks; prmots obsshon wt tgt. Prpls eet meet dislvd bye its hcid."
 POD_mummy_elixir_of_eternal_life_journeys.31.a: "Golden Skullcap"
 POD_mummy_elixir_of_eternal_life_journeys.31.b: "Parsley"
 POD_mummy_elixir_of_eternal_life_journeys.31.c: "Psion Salt"
 POD_mummy_elixir_of_eternal_life_journeys.31.d: "Skeletal Violet"
 POD_mummy_elixir_of_eternal_life_journeys.31.e: "试着把他们都加上"
 POD_mummy_elixir_of_eternal_life_journeys.31.effect.success: "随着一声轻响，一个心形泡泡浮现出来。"
 POD_mummy_elixir_of_eternal_life_journeys.31.effect.failure: "它喷涌出一团灼热的烟雾"
 POD_mummy_elixir_of_eternal_life_journeys.32.t: "登临峰顶之后，便沿山而下。"
 POD_mummy_elixir_of_eternal_life_journeys.32.desc: "On your most recent journey, you have sought out an ancient oral tale that is supposed to carry one of the secrets of ascension. Finding a storyteller that knew it was extremely difficult and ultimately led you to an old woman. While her body was failing, she had little difficulty recounting the story.\n\n\"Many summers and dynasties ago, there was a cultivator named Jian. Like so many others, he sought the Heavenly Gate, to ascend beyond the mortal bounds. For a hundred years, he meditated on the highest peak, never speaking with another soul. He refined his core until even the wind dared not brush against him. One winter, a spirit blizzard, fed by the land's despair, swallowed the mountain. Admidst the madness yet completely untouched, Jian achieved all that he had sought and stood before the Gate at last. However, the winds carried the cries of a starving village at the mountain's base, frozen in the blizzard's ferocity. With a single step, he could have ascended. Leave them, and ascension was his. Stay, and the storm would devour much of his hard-earned cultivation. Help them, and it would cost even more.\nWithout a thought, Jian descended the mountain. He gave them firestones to warm them, talismans to shield them, and eventually his own breath, warming their bodies as his own grew cold. The blizzard, angered by the theft of its victims, threw its full force against him, and his cultivation shattered like thin ice. At dawn, the storm evaporated in a moment, its hunger sated not by despair but overwhelmed by generosity. Still, the Gate stood on the peak, waiting, but Jian could no longer see it. As the sun's light shone upon him, his body collapsed into dust, each of his long years catching up to him in a moment. The last thing to fade was his smile.\"\n\nWhat lesson do you glean from this tale?"
 POD_mummy_elixir_of_eternal_life_journeys.32.a: "If he was wiser, he could have aided them and preserved his strength"
 POD_mummy_elixir_of_eternal_life_journeys.32.b: "By abandoning immortality, he transcended the self that sought it"
 POD_mummy_elixir_of_eternal_life_journeys.32.c: "Visible sacrifice is the only path to transcendence"
 POD_mummy_elixir_of_eternal_life_journeys.32.d: "The world punishes virtue and generosity."
 POD_mummy_elixir_of_eternal_life_journeys.32.e: "这确实是个难题。"
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.success: "Applying this lesson enhances your own cultivation"
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.failure: "This lesson doesn't seem to further your efforts"
 POD_mummy_elixir_of_eternal_life_journeys.33.t: "不朽者与医者"
 POD_mummy_elixir_of_eternal_life_journeys.33.desc: "On your most recent journey, you have sought out an ancient oral tale that is supposed to carry one of the secrets of ascension. Finding a storyteller that knew it was extremely difficult and ultimately led you to an herbalist in a small town. As he ground herbs and sold pills to the villagers, he recited a tale passed on to him from his master.\n\n\"Many summers and dynasties ago, one of the Eight Immortals was walking the lands and came across a town plagued by a deadly illness. The sick filled the streets, and among them was an alchemist who was testing unproven elixirs on the dying. Some were saved while the ends of others were hastened or made far more agonous. When the Immortal beheld this, they declared 'To gamble with life is to defy Heaven's command. To pursue the bright light of a desired future without care for the risks is to set fire to the forest.' With a breath, she cured the town entirely but cast upon the alchemist every agony he had inflicted. He wandered the land as a madman, his senses consumed by the pain. The town rejoiced, praising her mercy.\nHowever, in time, another illness came, and none of the healers dared risk error. They clung to what was known, paralyzed by fear. Many who might have been saved were instead buried with prayers.\"\n\nWhat lesson do you glean from this tale?"
 POD_mummy_elixir_of_eternal_life_journeys.33.a: "Only the fool worships blindly, and even the wise make questionable choices"
 POD_mummy_elixir_of_eternal_life_journeys.33.b: "Had the immortal remained, illness would not have returned"
 POD_mummy_elixir_of_eternal_life_journeys.33.c: "Suffering is a necessary price for progress"
 POD_mummy_elixir_of_eternal_life_journeys.33.d: "The pursuit of knowledge creates cruelty"
 POD_mummy_elixir_of_eternal_life_journeys.33.e: "这确实是个难题。"
 POD_mummy_elixir_of_eternal_life_journeys.33.effect.success: "Applying this lesson enhances your own cultivation"
 POD_mummy_elixir_of_eternal_life_journeys.33.effect.failure: "This lesson doesn't seem to further your efforts"
 POD_mummy_elixir_of_eternal_life_journeys.34.t: "春种秋收"
 POD_mummy_elixir_of_eternal_life_journeys.34.desc: "在你最近的旅途中，你追寻了一则古老的传说，据说其中蕴含着晋升的秘密之一。找到知道这传说的说书人极其困难，最终引领您你到了一位老农。他背脊驼曲，皮肤因多年耕作而变得黝黑。每挥一下锄头，他都会讲述一个从他祖父那里学来的故事。\n\n“经过漫长的战斗岁月，一名士兵退役后漫游四方。他来到一处被古老植被阻塞的荒芜山谷。谷中的河流汹涌奔腾，摧毁了沿途的一切。土壤中散落着能折断犁铧的巨石，金属毒化了大地。他并未诅咒命运，而是一棵接一棵地砍倒树木，尽管他的斧头断了三次。他通过耐心凿出的沟渠引开水流，尽管每个季节的洪水都毁掉他的劳作。他用火与锤击碎岩石，尽管双手流血。他种植蘑菇并撒布木炭来滤除毒素，尽管每个季节看到的只有所植之物的枯萎。多年过去，他才播下第一粒种子。许多人嘲笑，因为他们只见辛劳而未见果实，但他从未动摇。当山谷终于变得柔软，他进行播种。当雨水来临，它们滋养而非摧毁。当秋天临近，他收获了足以供养十个村落的丰硕庄稼。”\n\n你从这则故事中领悟到了什么？"
 POD_mummy_elixir_of_eternal_life_journeys.34.a: "总要摧毁旧有的，才能建造更美好的。"
 POD_mummy_elixir_of_eternal_life_journeys.34.b: "让成功变得不可避免，你需要彻底转变自己。"
 POD_mummy_elixir_of_eternal_life_journeys.34.c: "无视他人的警告，因其皆为愚者。"
 POD_mummy_elixir_of_eternal_life_journeys.34.d: "在求索权力之前，清除阻碍你的一切。"
 POD_mummy_elixir_of_eternal_life_journeys.34.e: "这确实是个难题。"
 POD_mummy_elixir_of_eternal_life_journeys.34.effect.success: "Applying this lesson enhances your own cultivation"
 POD_mummy_elixir_of_eternal_life_journeys.34.effect.failure: "This lesson doesn't seem to further your efforts"
 POD_mummy_elixir_of_eternal_life_journeys.35.t: "被遗忘的奇迹"
 POD_mummy_elixir_of_eternal_life_journeys.35.desc: "In your quest for esoteric records on the Elixir of Eternal Life, you have found evidence that some clues lie buried in an ancient temple. The god or gods worshipped within have long been forgotten. Even its purpose as a temple is merely a guess. Around noon, you finally reach the temple, buried by countless ages of forest growth.\n\nThe doors open upon a land of eternal night, but not of darkness. The twinkling light of innumerable stars chases away shadows left by trees many times your own height. Through the branches far above your head, gentle light streams down to play upon the blooming wildflowers. Where shadowy beasts would be expected and where hidden predators normally lurk, there are only joyful shapes cast by the stars, leaping amongst the kaleidoscope of colors. Birds, frogs, crickets, and many others you cannot name join together in a harmony lost to humanity, none overpowering another but rather one great orchestra remembering the song of a day long past.\n\nOn the far side is a locked door. Upon the lintel rests writing:\nWhat is something if you claim to have it, you lack it?\nIf you miss it in yourself, you may have it."
 POD_mummy_elixir_of_eternal_life_journeys.35.a: "自信"
 POD_mummy_elixir_of_eternal_life_journeys.35.b: "理智"
 POD_mummy_elixir_of_eternal_life_journeys.35.c: "智慧"
 POD_mummy_elixir_of_eternal_life_journeys.35.d: "谦逊"
 POD_mummy_elixir_of_eternal_life_journeys.35.e: "环境中的线索是否有所暗示？"
 POD_mummy_elixir_of_eternal_life_journeys.35.effect.success: "门打开了。"
 POD_mummy_elixir_of_eternal_life_journeys.35.effect.failure: "门消失在树林中"