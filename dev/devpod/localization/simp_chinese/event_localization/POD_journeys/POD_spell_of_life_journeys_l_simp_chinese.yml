 POD_mummy_spell_of_life_journeys.39.effect.failure: "盘子落入岩浆中。"
 POD_mummy_spell_of_life_journeys.40.t: "通往地狱之路"
 POD_mummy_spell_of_life_journeys.40.desc: "In your quest for esoteric records on the Spell of Life, you have found evidence that a few clues can be found in a lost pyramid. Some say that the pyramids of old collected sunlight at their peak, using it to create a river of light for the soul to follow into the afterlife. However, not all saw sunlight as the best path into the Shadowlands. A few sought to channel darker energies from deep underground, using it in their failed attempts at the Spell of Life. They constructed an upside-down, pentagonal pyramid which dove deep, ever so deep into the rock. The rumors also speak of their obsession with the role of numerology in magical rituals, including a particular series that functioned as their identifying mark.\n\nYou pass the entrance and look down an empty void with 5 staircases leading downwards. The vast expanse is filled with an empty echo, reverberating endlessly. The dark void obscures the strange channels carved into the blackened stone that forms the pyramid's walls. Thicker than a tree's trunk, stygian chains veined with silver run from the ceiling down to the floor and key points in the walls. Upon each of the 5 floors is a series of numbers.\n13\n1113\n3113\n132113\n1113122113\n\nAt the pyramid's lowest point sits a triangular altar linked to the channels along the walls. Upon the altar's sides are 3 buttons, each with a number going from 1 to 3."
 POD_mummy_spell_of_life_journeys.40.a: "按“132”"
 POD_mummy_spell_of_life_journeys.40.b: "按“213”"
