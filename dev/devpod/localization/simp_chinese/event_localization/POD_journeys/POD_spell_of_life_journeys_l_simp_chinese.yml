 POD_mummy_spell_of_life_journeys.42.effect.success: "方尖碑的光芒照耀在你身上，揭示出……"
 POD_mummy_spell_of_life_journeys.42.effect.failure: "The golden peak blackens, before crumbling away"
 POD_mummy_spell_of_life_journeys.43.t: "失落之地"
 POD_mummy_spell_of_life_journeys.43.desc: "在探求生命神咒秘典的过程中，你发现线索可能藏在一处仪式遗址中——那里曾有位追寻者，在施展自己版本的生命神咒后便消失无踪。与你到访过的几乎所有地方相比，此处几乎没留下任何昔日痕迹。就连你敏锐的感官也无法辨别这里曾矗立过什么。雾气在空气中盘旋，在你手上凝成露珠。空气弥漫着臭氧的刺鼻气息，令你鼻孔发胀。草木吱嘎作响，动物的声音远远传来，仿佛相隔千里。你走过时，蕨草在脚下弯折，又在你身后缓缓挺立，抹去你所有的踪迹。时光已逝，此地被遗弃荒芜。魔法在空气中奔涌，如心跳般搏动，却又显得无精打采。旷野中央，一个身形朦胧、看不出年纪的男人，仿佛坐在一把无形的椅子上。\n\n“啊，鲜有愚者能走到此地。久远以来，此景未曾再现。答对我的谜语，我便将当年因愚昧所求之物赐予你。何物飞翔，却难以止息？何物吞噬所触之一切，却一无所食？何物永不可借出，却总被浪费？何物总被耗尽，却从未挣得？”"
 POD_mummy_spell_of_life_journeys.43.a: "死亡"
 POD_mummy_spell_of_life_journeys.43.b: "时间"
 POD_mummy_spell_of_life_journeys.43.c: "风"
 POD_mummy_spell_of_life_journeys.43.d: "财富"
 POD_mummy_spell_of_life_journeys.43.e: "我凭直觉行事。"
