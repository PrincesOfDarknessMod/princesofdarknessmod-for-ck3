 POD_mummy_spell_of_life_journeys.40.e: "按“311311222113”"
 POD_mummy_spell_of_life_journeys.40.f: "我凭直觉行事。"
 POD_mummy_spell_of_life_journeys.40.effect.success: "渠道光晕流转，祭坛之上文字浮现。"
 POD_mummy_spell_of_life_journeys.40.effect.failure: "随着通道发出光芒，你发现自己身处别处。"
 POD_mummy_spell_of_life_journeys.41.t: "崩塌的石块"
 POD_mummy_spell_of_life_journeys.41.desc: "在探求生命神咒秘典的过程中，你找到了线索，表明在一位寻求者消失的仪式遗址中可能藏有答案，而那位寻求者曾施展他们版本的生命神咒。与你去过的大多数地方相比，这座坟墓几乎荡然无存。雾气在空气中缭绕，凝结成露滴在你的手上。空气中弥漫着臭氧的刺鼻气息，直冲鼻腔。植物发出嘎吱声，动物的声音隐约传来，仿佛远在天边。你走过时，蕨类植物在你脚下弯折，随后缓缓立起，抹去你行经的一切痕迹。大自然已吞没了这座昔日宏伟的庙宇。柱顶石散落在树根之间，那些树木可能比你还要古老。雕刻的石砖每一步都会碎裂。最终，你抵达了曾是墓穴地基之处，如今却只余一圈裂开的石头。中央坐着一位透明的人影，难辨年龄，仿佛坐在一把无形的椅子上。\n\n“啊，少有蠢人能走到此地。这里已经很久没有访客了。猜中我的谜题，我便将当年愚昧所求之物赐予你。法师的年龄是法师年龄为两人现在年龄和一半时的两倍时，术士将会达到的岁数，而到那时法师与术士现在的年龄差等于术士当时年龄的两倍。他们各有多少岁？”"
 POD_mummy_spell_of_life_journeys.41.a: "法师30岁，术士20岁。"
 POD_mummy_spell_of_life_journeys.41.b: "法师60岁，术士20岁。"
 POD_mummy_spell_of_life_journeys.41.c: "法师45岁，术士30岁。"
 POD_mummy_spell_of_life_journeys.41.d: "法师60岁，术士45岁。"
 POD_mummy_spell_of_life_journeys.41.e: "我凭直觉行事。"
 POD_mummy_spell_of_life_journeys.41.effect.success: "“你追寻的秘密是……”"
 POD_mummy_spell_of_life_journeys.41.effect.failure: "“让我独自等待一个配得上我秘密的蠢货吧”。"
 POD_mummy_spell_of_life_journeys.42.t: "神秘符文"
 POD_mummy_spell_of_life_journeys.42.desc: "在探求生命神咒秘典的过程中，你发现了一些线索，指向一座古老神庙的废墟。你抵达时，只见庙宇被掩埋，残存的屋顶碎片在你脚下嘎吱作响。唯一可见的是一座方尖碑，历经沧桑却奇迹般地未受侵蚀。金色的顶端仿佛捕捉阳光，再将光芒反射入你眼中，更凸显出石面闪烁的光彩——无数微小晶粒向四面八方折射着光芒。方尖碑的基座上刻着一块铭牌。\n\n“说吧，寻者，谨慎选择你的言辞，\n因为真理之光只回应配得之人。\n说出正确的字句，便将被其光辉照亮，\n但若妄言相欺，黑暗将永远夺走你的机缘。\n∫ ο љ ₫ …  ҈\""
