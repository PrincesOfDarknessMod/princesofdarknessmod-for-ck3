l_simp_chinese:
 POD_learn_true_name.1.t: "真名"
 POD_learn_true_name.1.desc: "\"真名乃存在之本质，历史之烙印，身份之根源。凡人可将其理解为生命体的理型蓝本。这个词涵盖了目标的每个部分，从血肉脏腑到灵魂核心。\n\n灵智越高，真名越复杂。禽兽真名简朴，凡人之名则会随重大经历更易。探寻真名本就是凶险之事，需对目标有深刻的心理洞察。若人知晓己身真名，可通过秘法符文与魔法结界加以守护，防范术士的恶意利用。\""
 POD_learn_true_name.1.a: "此刻，[PlayerJourneyTarget.GetFirstName]已毫无秘密"