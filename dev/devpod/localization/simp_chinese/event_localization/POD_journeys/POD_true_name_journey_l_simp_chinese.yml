l_simp_chinese:
 POD_learn_true_name.1.t: "真名"
 POD_learn_true_name.1.desc: "“[Glossary('真名','podgloss.truename')]乃存在之本质，历史之烙印，身份之根源。凡人可将其理解为生命体的理型蓝本。这个词涵盖了目标的每个部分，从血肉脏腑到灵魂核心。\n\n灵智越高，[Glossary('真名','podgloss.truename')]越复杂。禽兽真名简朴，凡人之名则会随重大经历更易。\n\n探寻[Glossary('真名','podgloss.truename')]本就是凶险之事，需对目标有深刻的心理洞察。若人知晓己身[Glossary('真名','podgloss.truename')]，可通过秘法符文与魔法结界加以守护，防范术士的恶意利用。”"
 POD_learn_true_name.1.a: "此刻，[PlayerJourneyTarget.GetFirstName]已毫无秘密"
 POD_learn_true_name.2.t: "[Localize(Concatenate('POD_truename_', GetPlayer.MakeScope.Var('true_name_variable').GetFlagKey))]的真名"
 POD_learn_true_name.2.desc: "我的冥想已结出果实。\n\n我已完全知晓一个新的[Glossary('真名','podgloss.truename')]：#V [Localize(Concatenate('POD_truename_', GetPlayer.MakeScope.Var('true_name_variable').GetFlagKey))]#!"
 POD_learn_true_name.2.a: "我的思维在扩展。但我尚未完成"
 POD_learn_true_name.2.a.tt: "你将立即开始又一[journey|E]，学习新的[Glossary('真名','podgloss.truename')]。\n花费：[piety_i]250。"
 POD_learn_true_name.2.b: "我的思维在扩展。随之而来的是各种可能性。"
 POD_learn_true_name.3.t: "内在真名"
 POD_learn_true_name.3.desc: "你想学哪项[traits|E]？"
 POD_learn_true_name.3.a: "学习这些特质。"
 POD_learn_true_name.3.b: "算了"
 POD_learn_true_name.4.t: "[GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)]洞见"
 POD_learn_true_name.4.desc: "我的思考结出了硕果。\n\n我完全理解了一个新的[Glossary('真名','podgloss.truename')]: [GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)]."
 POD_learn_true_name.4.a: "我的思维在扩展。随之而来的是各种可能性。"