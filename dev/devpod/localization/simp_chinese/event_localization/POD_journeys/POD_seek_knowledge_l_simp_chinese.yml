l_simp_chinese:
 POD_seek_knowledge.2.t:0 "会见导师"
 POD_seek_knowledge.2.desc:0 "到达[ROOT.Var('current_journey').Var('destination').Province.GetCounty.GetTitle.GetNameNoTier]后，我开始打听我未来导师的下落。\n"
 POD_seek_knowledge.2.desc.local_ruler:0 "原来，这人正是本地的统治者，[recipient.GetNameNicknamed]。"
 POD_seek_knowledge.2.desc.wanderer:0 "在一家昏暗的旅店里，我最终遇到了我要找的人：一个名叫[recipient.GetFirstName]的流浪者。"
 POD_seek_knowledge.2.desc.ghoul:0 "在小镇边缘一家破旧的小酒馆里，我遇到了我要找的人：一位独立[GetTrait('ghoul').GetName(GetNullCharacter)]，名叫[recipient.GetFirstName]。看来[recipient.GetSheHe]最近挣脱了血缚，现在正在泄露[recipient.GetHerHis]前主人的秘密，以此作为报复手段。"
 POD_seek_knowledge.2.desc.mortal:0 "在一家昏暗的旅店里，我最终遇到了我要找的人：一个名叫[recipient.GetFirstName]的神秘凡人。"
 POD_seek_knowledge.2.desc.2:0 "\n\n我们先寒暄了几句，然后话题转向了更实际的事务。"
 POD_seek_knowledge.2.option.a:0 "我准备好学习了。"
 POD_seek_knowledge.2.option.b:0 "$POD_player_coterie$中的每个人都会从你收到的指导中受益。"
 POD_seek_knowledge.2.option.c:0 "只教我一人。"