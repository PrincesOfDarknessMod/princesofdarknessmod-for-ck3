l_simp_chinese:
 POD_seek_knowledge.2.t:0 "会见导师"
 POD_seek_knowledge.2.desc:0 "到达[ROOT.Var('current_journey').Var('destination').Province.GetCounty.GetTitle.GetNameNoTier]后，我开始打听我未来导师的下落。\n"
 POD_seek_knowledge.2.desc.local_ruler:0 "原来，这人正是本地的统治者，[recipient.GetNameNicknamed]。"
 POD_seek_knowledge.2.desc.wanderer:0 "在一家昏暗的旅店里，我最终遇到了我要找的人：一个名叫[recipient.GetFirstName]的流浪者。"
 POD_seek_knowledge.2.desc.ghoul:0 "在小镇边缘一家破旧的小酒馆里，我遇到了我要找的人：一位独立[GetTrait('ghoul').GetName(recipient)]，名叫[recipient.GetFirstName]。看来[recipient.GetSheHe]最近挣脱了血缚，现在正在泄露[recipient.GetHerHis]前主人的秘密，以此作为报复手段。"
 POD_seek_knowledge.2.desc.mortal:0 "在一家昏暗的旅店里，我最终遇到了我要找的人：一个名叫[recipient.GetFirstName]的神秘凡人。"
 POD_seek_knowledge.2.desc.2:0 "\n\n我们先寒暄了几句，然后话题转向了更实际的事务。"
 POD_seek_knowledge.2.option.a:0 "我准备好学习了。"
 POD_seek_knowledge.2.option.b:0 "我们准备好学习了。"
 POD_seek_knowledge.2.option.a.tt:0 "你将继续学习该新能力。"
 POD_seek_knowledge.2.option.b.tt:0 "由于你们共同旅行，$POD_player_coterie$的其他成员也会学到该能力（如果他们能学）。"
 POD_seek_knowledge.2.desc.gargoyle:0 "在小镇边缘一条隐蔽的小巷里，我遇到了我要找的人：一位名叫[recipient.GetFirstName]的独自一人的[GetTrait('gargoyle').GetName(recipient)]。"
 POD_seek_knowledge.2.desc.fae:0 "在小镇边缘一座废弃公园里，我遇到了我要找的人：一位名叫[recipient.GetFirstName]神秘妖精。"
 POD_seek_knowledge.100.t:0 "课程解散"
 POD_seek_knowledge.100.desc:0 "经过长期的学习和实践，我的理解终于完成了。\n\n"
 POD_seek_knowledge.100.desc.tutor:0 "多亏了值得信赖的[GetCourtPositionType('court_tutor_court_position').GetName()][court_tutor.GetNameNicknamed]，我才做成这件事。"
 POD_seek_knowledge.100.option.a:0 "我的努力终于见效。"