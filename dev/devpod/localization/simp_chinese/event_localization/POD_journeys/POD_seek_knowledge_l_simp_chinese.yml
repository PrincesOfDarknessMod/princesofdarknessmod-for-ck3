l_simp_chinese:
 POD_seek_knowledge.2.t: "会见导师"
 POD_seek_knowledge.2.desc: "到达[ROOT.Var('current_journey').Var('destination').Province.GetCounty.GetTitle.GetNameNoTier]后，我开始打听我未来导师的下落。\n"
 POD_seek_knowledge.2.desc.local_ruler: "原来，这人正是本地的统治者，[recipient.GetNameNicknamed]。"
 POD_seek_knowledge.2.desc.wanderer: "在一家昏暗的旅店里，我最终遇到了我要找的人：一个名叫[recipient.GetFirstName]的流浪者。"
 POD_seek_knowledge.2.desc.ghoul: "在小镇边缘一家破旧的小酒馆里，我遇到了我要找的人：一位独立[GetTrait('ghoul').GetName(recipient)]，名叫[recipient.GetFirstName]。看来[recipient.GetSheHe]最近挣脱了血缚，现在正在泄露[recipient.GetHerHis]前主人的秘密，以此作为报复手段。"
 POD_seek_knowledge.2.desc.mortal: "在一家昏暗的旅店里，我最终遇到了我要找的人：一个名叫[recipient.GetFirstName]的神秘凡人。"
 POD_seek_knowledge.2.desc.2: "\n\n我们先寒暄了几句，然后话题转向了更实际的事务。"
 POD_seek_knowledge.2.option.a: "我准备好学习了。"
 POD_seek_knowledge.2.option.b: "我们准备好学习了。"
 POD_seek_knowledge.2.option.a.tt: "你将继续学习该新能力。"
 POD_seek_knowledge.2.option.b.tt: "由于你们共同旅行，$POD_player_coterie$的其他成员也会学到该能力（如果他们能学）。"
 POD_seek_knowledge.2.desc.gargoyle: "在小镇边缘一条隐蔽的小巷里，我遇到了我要找的人：一位名叫[recipient.GetFirstName]的独自一人的[GetTrait('gargoyle').GetName(recipient)]。"
 POD_seek_knowledge.2.desc.fae: "在小镇边缘一座废弃公园里，我遇到了我要找的人：一位名叫[recipient.GetFirstName]神秘妖精。"
 POD_seek_knowledge.100.t: "课程解散"
 POD_seek_knowledge.100.desc: "经过长期的学习和实践，我的理解终于完成了。\n\n"
 POD_seek_knowledge.100.desc.tutor: "多亏了值得信赖的[GetCourtPositionType('court_tutor_court_position').GetName()][court_tutor.GetNameNicknamed]，我才做成这件事。"
 POD_seek_knowledge.100.option.a: "我的努力终于见效。"
 POD_seek_knowledge.2.desc.coterie_member: "实际上我并不需要费力寻找。\n\n[recipient.GetFirstNameNicknamed]已经掌握了我想要的知识，作为$POD_player_coterie$的成员，[recipient.GetSheHe]很乐意与我分享。\n\n我们花了一些时间回忆我们共同的冒险经历，然后话题转向了更实际的问题。"
 POD_demon_lore_learning_events.1.t: "学习新的天族秘义"
 POD_demon_lore_learning_events.1.desc: "秘义是恶魔作为耶洛因拥有的神圣能力的残余。天族的秘义无异于收集宇宙之秘，操纵现实之基，支配推动之力。在堕天之前，每个天族都有自己特定的秘义，这些秘义反映了其在天使阶级中的职责。这些唤术被认为是每个天族的核心，出于实用主义的考虑，它们被严加守护。堕天者中的许多人相互交换他们的秘义片段，以便在与更隐蔽的敌人作战时获得任何优势。"
 POD_demon_lore_learning_events.1.a: "我更接近我最初的力量了。"
 learnt_lore_of_herald: "学习先驱之秘义"
 learnt_lore_of_life_bringer: "学习生命赐予者之秘义"
 learnt_lore_of_creation: "学习创世之秘义"
 learnt_lore_of_seer: "学习先知之秘义"
 learnt_lore_of_beauty: "学习美之秘义"
 learnt_lore_of_living: "学习生者之秘义"
 learnt_lore_of_ethereal: "学习灵魄之秘义"
 POD_seek_knowledge.2.desc.kueijin: "在城镇一处诡谲寂静的角落，我见到了寻找之人：一位名为[recipient.GetFirstName]的神秘[GetTrait('kueijin').GetName(recipient)]。"
 POD_disciplines_interaction: "请求教导"
 POD_disciplines_interaction_desc: "你可以请朋友、情人或灵魂伴侣教你一门你还不知道的[Glossary('血律','game_concept_discipline_desc')]。"
 POD_disciplines_interaction_accept: "如果你的导师有什么能教你的，你将获得可学习的[Glossary('血律','game_concept_discipline_desc')]的清单。"
 POD_mentoring_disciplines_custom: "如果你朋友没有你可学习的$pod_discipline$，那你就什么也做不了。"
 POD_mentoring_disciplines.0001.t: "教导"
 POD_mentoring_disciplines.0001.desc: "若你未来的导师掌握着某项你不了解的$pod_discipline$，你或者你可以请求[recipient.GetHerHis]与你分享知识。然而这并非无偿之举，[recipient.GetHerHis]需与你分享其血，从而形成一道脆弱的血缚。\n此外，在血族政治中，求助之举有失体面，你的威望亦将因此受损。"
 POD_mentoring_disciplines.0001.option.a: "支配术。我想学习如何控制他人。"
 POD_mentoring_disciplines.0001.option.b: "我想学习如何控制动物。"
 POD_mentoring_disciplines.0001.option.c: "我必须看见视野之外！"
 POD_mentoring_disciplines.0001.option.d: "我将闪避箭矢！"
 POD_mentoring_disciplines.0001.option.e: "隐身是个好学的把戏。"
 POD_mentoring_disciplines.0001.option.f: "能把东西揍得更狠总是有用的。"
 POD_mentoring_disciplines.0001.option.g: "我的思想是我最佳的武器。"
 POD_mentoring_disciplines.0001.option.h: "利爪总是时髦的。"
 POD_mentoring_disciplines.0001.option.i: "肉体塑造之术着实诱人。"
 POD_mentoring_disciplines.0001.option.j: "血的秘密必须为我所掌握！"
 POD_mentoring_disciplines.0001.option.k: "我将变得坚不可摧！"
 POD_mentoring_disciplines.0001.option.m: "万物皆虚。"
 POD_mentoring_disciplines.0001.option.n: "暗影在呼唤……"
 POD_mentoring_disciplines.0001.option.l: "掌控死亡本身的力量！"
 POD_mentoring_disciplines.0001.option.o: "来自地狱的赠礼"
 POD_mentoring_disciplines.0001.option.p: "对蛇类的迷恋"
 POD_mentoring_disciplines.0001.option.q: "我将成为终极的掠食者"
 POD_mentoring_disciplines.0001.option.r.giovanni: "我将学习乔凡尼之道"
 POD_mentoring_disciplines.0001.option.r.giovanni.tt: "你将获得乔凡尼亡灵术道途"
 POD_mentoring_disciplines.0001.option.r.cappadocian: "我将学习卡帕多西亚之道"
 POD_mentoring_disciplines.0001.option.r.cappadocian.tt: "你将获得卡帕多西亚亡灵术道途"
 POD_mentoring_disciplines.0001.option.r.harbinger: "我将学习预告者之道"
 POD_mentoring_disciplines.0001.option.r.harbinger.tt: "你将获得预告者亡灵术道途"
 POD_mentoring_disciplines.0001.option.r.lamia: "我将学习拉米亚之道。"
 POD_mentoring_disciplines.0001.option.r.lamia.tt: "你将获得拉米亚亡灵术道途"
 POD_mentoring_disciplines.0001.option.r.nagaraja: "我将学习那伽罗阇之道。"
 POD_mentoring_disciplines.0001.option.r.nagaraja.tt: "你解锁那伽罗阇亡灵术[perks|E]"
 POD_mentoring_disciplines.0001.option.r.impundulu: "我将学习魔蛇鹫之道"
 POD_mentoring_disciplines.0001.option.r.impundulu.tt: "你解锁魔蛇鹫亡灵术[perks|E]"
 POD_mentoring_disciplines.0001.option.s: "律令大地"
 POD_mentoring_disciplines.0001.option.t: "我将成为时间之主。"
 POD_mentoring_disciplines.0001.option.u: "疯狂之主。"
 POD_mentoring_disciplines.0001.option.v: "言灵之力。"
 POD_mentoring_disciplines.0001.option.w: "与兽灵互动。"
 POD_mentoring_disciplines.0001.option.x: "第三只眼的力量。"
 POD_mentoring_disciplines.0001.option.y: "控血之力。"
 POD_mentoring_disciplines.0001.option.z: "源自妖精的力量"
 POD_mentoring_disciplines.0001.option.bardo: "否定心兽"
 POD_mentoring_disciplines.0001.option.end: "下次吧"
 confused_populace_modifier: "困惑的民众。"
 confused_populace_modifier_desc: "此地的民众因业余的血族血律使用而感到困惑。"
 POD_mentoring_disciplines.10.t: "心灵之力。"
 POD_mentoring_disciplines.10.desc: "支配术的精髓在于运用你的意志力来强迫他人服从你的命令。在学习过程中，你需要找实际的实验对象来测试你的进展。凡人会是个容易且相对无关紧要的选择，但由于他们的意志力较为薄弱，你需要支配相当数量的凡人才能真正学到东西。或者，你也可以在你的某个封臣身上试试你的新能力，尽管他们可能不会乐意成为这种侵扰性力量的测试对象。"
 POD_mentoring_disciplines.10.a: "我知道有个绝佳人选！"
 POD_mentoring_disciplines.10.b: "凡人遍地都是。"
 POD_mentoring_disciplines.11.t: "精神把戏"
 POD_mentoring_disciplines.11.desc: "你相当确信自己已经充分理解了支配术，足以运用它了，但你的导师却坚持认为你还没到火候。他们说，你仍需亲身被支配术作为目标作用一次，才能真正领会其效果。\n你对这种说法颇为怀疑，因为这似乎是一种操控你心智的不光彩手段。你大可直接拒绝他们的要求，享受你的新能力，但这会招致他们的猜疑，或是惹怒他们。"
 POD_mentoring_disciplines.11.a: "既然你说这很安全……"
 POD_mentoring_disciplines.11.b: "多谢，但还是免了吧。"
 POD_mentoring_disciplines.20.t: "谢了，但不必了。"
 POD_mentoring_disciplines.20.desc: "要学习兽性术，你必须与动物互动。这算不上什么惊天动地的消息，但你仍然需要选择如何去做。你可以响应荒野的呼唤，在你潜在的威胁目标身上试验你新获得的力量。或者，你也可以简单地用一大群驯养动物充斥你的宫廷，让自己轻松一点。\n不过，这第二种选择可能会引发争议，毕竟不是每个人都喜欢在前往乐土之前，先对着一大群猫猫狗狗强行施展能力。"
 POD_mentoring_disciplines.20.a: "蛇？当真？"
 POD_mentoring_disciplines.20.b: "可比我的廷臣们好相处多了。"
 POD_mentoring_disciplines.21.t: "野性一面"
 POD_mentoring_disciplines.21.desc: "你在“兽性术”上的导师坚持认为，你应当运用自己新获得的力量，暂时借用某种动物的外表，以此真正地接触你内心的野兽。你并不怎么喜欢这个主意，因为身为黑夜的统治者，你总得遵守一定的礼仪规范。另一种选择则是暂时与世隔绝来完成你的训练，这至少不太会让你陷入毫无防备的境地。"
 POD_mentoring_disciplines.21.a: "我没有什么可隐藏的"
 POD_mentoring_disciplines.21.b: "我只想独处片刻。"
 court_tutor_mentoring_disc_tt: "拥有一位高资质的宫廷导师可以降低指导所需的威望消耗。"
 POD_mentoring_disciplines.30.t: "神秘魅力"
 POD_mentoring_disciplines.30.desc: "学习观占术意味着你得应付一种过去从未真正留意过的第六感。细微的举动蕴含着更深层的含义，即便是寻常的交谈也可能透露出深刻的洞见。\n因此，你开始放慢节奏，对自己的言行举止都多加斟酌。这反而让你在宫廷中显得有些高深莫测，这或许是你想纠正的一点。但神秘感自有其魅力所在。"
 POD_mentoring_disciplines.30.a: "我所见远不止于此。"
 POD_mentoring_disciplines.30.b: "我需要集中精神。"
 POD_mentoring_disciplines.31.t: "窥见过多"
 POD_mentoring_disciplines.31.desc: "观占术是一门复杂的血律，它为从简单的窥探到探索未知世界等无数可能性敞开了大门。这些美妙而又可怖的可能性，即便是最坚韧的心智也难以承受。\n虽然最艰难的时刻已经过去，但你仍因突如其来的灵光闪现而饱受头痛与精神危机的困扰。所幸，你的导师仍在身边，随着时间推移，他正帮助你掌控这份新获得的力量。"
 POD_mentoring_disciplines.31.a: "很高兴有你在我身边。"
 POD_mentoring_disciplines.40.t: "闪避！"
 POD_mentoring_disciplines.40.desc: "迅捷术是一门用于加速行动、提升速度的血律。训练这门技能有多种方式，你原本主要考虑的是赛跑和其他体能训练，但你的导师似乎另有打算。此刻，他们正带着几乎不加掩饰的兴奋朝你扔东西，同时命令你闪避。\n值得称赞的是，你至少成功躲开了一部分。"
 POD_mentoring_disciplines.40.a: "这一点都不好笑！"
 POD_mentoring_disciplines.41.t: "快跑，吸血鬼，快跑！"
 POD_mentoring_disciplines.41.desc: "大多数时候，训练迅捷术都是一种令人振奋的体验——仅仅是在你的城市中飞速奔跑，就能带来一股强大的力量奔涌感。然而，这也会让你在一段时间内感到有些头晕和迷失方向，因为你随后必须重新适应正常生活的缓慢节奏。你的导师建议你要循序渐进，但这说起来容易做起来难。"
 POD_mentoring_disciplines.41.a: "得加快速度！"
 POD_mentoring_disciplines.41.b: "还得再快些！"
 POD_mentoring_disciplines.50.t: "潜踪匿影"
 POD_mentoring_disciplines.50.desc: "混淆术是一种能够隐藏自身与他人行踪的血律。显然，要有效掌握这项能力，就必须在试图看穿你的其他血族面前进行实战演练。凡人不堪此任，他们目光短浅，难以洞察玄机，因此你不得不冒些风险。\n不过这恐怕会在宫廷中引发始料未及的流言蜚语，众人将揣测你学习此等诡诈之术的真正\"意图\"……"
 POD_mentoring_disciplines.50.a: "我保证没在监视你们。"
 POD_mentoring_disciplines.51.t: "威胁无处不在"
 POD_mentoring_disciplines.51.desc: "你对混淆术的新知让你得以在不被察觉的情况下窥视廷臣，从而对他们有了更深的了解。可悲的是，你所了解到的大多是你无法信任任何人；他们中的大多数都在谋划着这样或那样的小阴谋。你发现自己比往常更加疑神疑鬼，如今开始担忧他们齐聚于此皆是为了对付你。\n现实地说，他们很可能确实如此。"
 POD_mentoring_disciplines.51.a: "叛徒，到处都是叛徒！"
 POD_mentoring_disciplines.51.b: "我需要保持冷静。"
 POD_mentoring_disciplines.51.c: "不，他们是可信之人。"
 POD_mentoring_disciplines.51.d: "我早就知道！"
 POD_mentoring_disciplines.60.t: "出气筒"
 POD_mentoring_disciplines.60.desc: "蛮力术，作为能够重击物体的血律，或许是最容易训练的血律。只管击打便是。\n它也可能是最令人振奋的，因为偶尔的尽情释放，对于夜晚统治者那常常感到挫败的心智而言，被证明是颇为有益的慰藉。于是你心满意足地击打着越来越大的目标，无需为明夜忧虑。"
 POD_mentoring_disciplines.60.a: "我们不需要那堵墙！打穿它！"
 POD_mentoring_disciplines.61.t: "拳头外交"
 POD_mentoring_disciplines.61.desc: "你从蛮力术中获得的新力量，让你对解决问题的方式产生了偏颇的认知——即用重拳猛击。遗憾的是，单凭蛮力能解决的问题终究有限，而你已开始触及这个极限。很快，你将不得不回归到日常的谋划、宫廷权术以及枯燥的外交活动中，而非像拆迁队一般四处横冲直撞。"
 POD_mentoring_disciplines.61.a: "就差一点！"
 POD_mentoring_disciplines.61.b: "是时候回到现实世界了。"
 POD_mentoring_disciplines.70.t: "人见人爱"
 POD_mentoring_disciplines.70.desc: "威仪术是一种令人沉醉的体验。谁不想要这种能让所有人爱上你、甚至直接崇拜你的能力呢？你的导师正出言告诫，向你讲述当你与受害者失去直接接触后可能产生的后续影响，但你根本听不进去。终于，你所有的臣民都展现出了他们早该具备的、恰如其分的忠诚！"
 POD_mentoring_disciplines.70.a: "我的伟大终于得到了认可。"
 POD_mentoring_disciplines.71.t: "爱的余波"
 POD_mentoring_disciplines.71.desc: "如今你已学习完了威仪术这一血律，对其弊端也有了更深体会。虽然能让他人敬你爱你确实是种强大的力量，但这种影响在你与受术者失去接触后无法持久，最终只会留下一个对你满腔恼恨之人。任谁都不会喜欢自己的情感被超自然力量所玩弄。\n过去几夜中，你使用新能力的频率或许有些过高，也在此过程中结下了些新仇家。也许是时候该为你因学习热情过度而侵扰他人心智的行为做出弥补了。"
 POD_mentoring_disciplines.71.a: "我只是想让你们都喜欢我！"
 POD_mentoring_disciplines.71.b: "他们会释怀的。"
 POD_mentoring_disciplines.80.t: "寻找真我"
 POD_mentoring_disciplines.80.desc: "变形术是一种能够以多种方式改变自身、几乎无限制地重塑外在形貌的血律。尽管威力强大，但掌握这门血律却颇为棘手，因为你早已对自己的物理形态习以为常。像你这般不朽的存在，本不会经历真正的改变，而突然能够转换身体的某些部位，这给你带来的情绪困扰，远比最初预想的更为深重。"
 POD_mentoring_disciplines.80.a: "这究竟意味着什么？"
 POD_mentoring_disciplines.81.t: "不公平的优势"
 POD_mentoring_disciplines.81.desc: "随着你对变形术的掌握日益精进，你发现其中蕴含着巨大的战斗潜力。在激战中骤然从双手生出利爪，无疑能扭转败局，而你发现自己越来越依赖此类战术。你的导师出言提醒，告诫你需谨慎行事——若是在无法施展变形术的场合遭遇战斗，或是敌人早有防备，这种优越感恐将招致毁灭。\n不过，也许他们只是嫉妒你学得太快了呢？"
 POD_mentoring_disciplines.81.a: "我很棒！仅此而已！"
 POD_mentoring_disciplines.81.b: "明智的建议"
 POD_mentoring_disciplines.90.t: "天上之怖"
 POD_mentoring_disciplines.90.desc: "易变术是该隐之子最为骇人的血律之一，主要因其施展过程往往导致参与的实验对象死亡。凡人终究是取之不尽的，所以你自以为能在学习这些能力、积累实践经验时，随意找些凡人试验而逍遥法外。然而，一位明智的亲王深知，辖区内凡人社群的安宁本身即是一笔财富，因此确保不一次性过度索取同样具有其价值。"
 POD_mentoring_disciplines.90.a: "我现在就要拿走我需要的一切。"
 POD_mentoring_disciplines.90.b: "我会进行更长时间的实验。"
 POD_mentoring_disciplines.91.t: "心中之怖"
 POD_mentoring_disciplines.91.desc: "如今你对易变术的掌握已足够纯熟，即便没有导师协助也能较为自如地运用。然而，自掌握这项新能力以来，你总隐约感到自身有些异样。难以言喻，但某些时刻，简直像是他者披着你的皮囊，试图操控你的躯壳。\n这或许只是错觉作祟，但这份不安已足够令你警惕，促使你决意独自深入探查此事。"
 POD_mentoring_disciplines.91.a: "没什么可担心的。肯定没有。"
 POD_mentoring_disciplines.91.b: "为何我感觉如此……异样？"
 POD_mentoring_disciplines.100.t: "埋头苦读"
 POD_mentoring_disciplines.100.desc: "对于吸血鬼而言，学习血术法这门血律颇为特殊，因其并不像其他血律那样与生俱来。相反，它是一种高度仪式化的实践，需要购置诸多材料并遵循繁复的配方。试图理解如此复杂的血律，试错实为亡生中不可避免的一环，这必将是一番耗资不菲的历程。\n是时候研读书籍、尽己所能做好准备，以真正掌控你那不洁之血的威能了。"
 POD_mentoring_disciplines.100.a: "卷一。第一章。第一页……"
 learning_mentoring_tt: "你学识越高，代价便越小。"
 POD_mentoring_disciplines.101.t: "夜读"
 POD_mentoring_disciplines.101.desc: "你对血术法的基础理念已有足够领悟，开始真正触及这门律能的深奥之处。随着世界各地以惊人速度不断涌现驾驭血气力量的新方法，这门技艺所能达成的效果可谓永无止境。凡物终其一生也难以真正掌握如此广博的力量……但这显然阻止不了无数尝试者的脚步。\n你沉醉于这些新发现，却日益疏离自己的宫廷。近臣们忧心忡忡，担心这份痴迷将折损你治世的才能。"
 POD_mentoring_disciplines.101.a: "看来…又回到老样子了。"
 POD_mentoring_disciplines.101.b: "还有这么多可学"
 POD_mentoring_disciplines.110.t: "不过皮肉之伤"
 POD_mentoring_disciplines.110.desc: "坚韧术是一种能让吸血鬼承受足以轻易杀死凡人的伤害的血律。要想真正理解它，最好的方法就是被狠狠揍到能无视攻击为止。你对导师的意图有些怀疑，但他们已经带着几乎不加掩饰的兴奋开始揍你了。\n显然，这一切归根结底都是为了你好。"
 POD_mentoring_disciplines.110.a: "我还能承受更多！"
 POD_mentoring_disciplines.111.t: "所向无敌？"
 POD_mentoring_disciplines.111.desc: "经过几天的强化训练，如今你对坚韧术的掌握已足够纯熟，有信心只要假以时日必能完全精通。或许这份信心有些过头了——毕竟众所周知，坚韧术会赋予使用者一种（多数时候是虚假的）刀枪不入的错觉。流传着太多关于过度自信的坚韧术使用者的故事，他们在触及自身极限时，连后悔的时间都没有。你的导师最后如此告诫你：毕竟，骄兵必败，傲慢是温存而阴险的杀手。"
 POD_mentoring_disciplines.111.a: "我必须保持谦卑。"
 POD_mentoring_disciplines.111.b: "真正的永生，终于！"
 POD_mentoring_disciplines.120.t: "为虚妄所环绕"
 POD_mentoring_disciplines.120.desc: "你掌握虚幻术这门血律相当轻松。制造些小虚幻并非难事，你的导师也一直在协助协调你的训练。\n然而，总有某种疑虑啃噬着你的内心。如果理解此事如此容易，谁又能说你的敌人没有在广泛使用它呢？何者为真，何者为假？\n在发现这项新能力后的头几个夜晚，你陷入了一种血狂状态，事事亲力亲为，因为唯有你自己的观察，才是你真正能够信任的。"
 POD_mentoring_disciplines.120.a: "唯我知晓真相！"
 POD_mentoring_disciplines.121.t: "真实与幻象"
 POD_mentoring_disciplines.121.desc: "在你学习虚幻术的过程中，进展已然顺利到足以自行施展，但你的导师却对你日益增长的偏执感到担忧——你总怀疑对手也在用同样的伎俩对付你。他们正试图教你认清虚幻术的局限，确保你明白，如此大规模的欺瞒几乎是不现实的。\n你听到了他们的话，也在考虑是否该放缓那些事无巨细的管控，但内心深处，你仍未完全被说服。"
 POD_mentoring_disciplines.121.a: "或许这番谏言有其可取之处。"
 POD_mentoring_disciplines.121.b: "又一句谎言！"
 POD_mentoring_disciplines.130.t: "并非独处黑暗"
 POD_mentoring_disciplines.130.desc: "从表面上看，幽暗术似乎是一种相对简单的血律，仅仅是利用阴影作为工具或武器。然而，你的导师很快便纠正了这一误解，你明白了它实际上是在运用一个名为\"深渊\"的神秘领域的能量。而且，有时这深渊会抗拒你的侵入。\n你初涉这个令人恐惧的新世界时举步维艰，因为很明显，这深渊中栖息着各种危险的生物，它们对你闯入其家园极为不悦。仿佛黑暗本身就想让你毁灭……或是加入它们。"
 POD_mentoring_disciplines.130.a: "我不惧怕黑暗！"
 POD_mentoring_disciplines.130.b: "我需要一支蜡烛……"
 mentoring_slowed_tt: "你的指导进度将比往常缓慢。"
 POD_mentoring_disciplines.131.t: "拥抱黑暗"
 POD_mentoring_disciplines.131.desc: "你已初涉深渊，并鼓足勇气将其用于己途，完成了对幽暗术的初次探索。如今你对此已更为熟悉，却无法否认这诡异的黑暗领域正以某种方式将你拉回——许多勒森魃氏族都曾感受过这种牵引。\n即便训练已经结束，你仍渴望回到其中，探求更多奥秘，哪怕其中潜藏着重重危险。"
 POD_mentoring_disciplines.131.a: "我们终究是黑暗的子嗣。"
 POD_mentoring_disciplines.131.b: "老实说，我有点害怕。"
 POD_mentoring_disciplines.140.t: "黑暗天性"
 POD_mentoring_disciplines.140.desc: "崇魔术是一门与地狱之力紧密相连的血律。尽管它并未直接要求你与恶魔立约，但研习它就如同站在悬崖边缘。仅仅是尝试理解这门血律，就已经开始改变你的本性。你发现自己正变得愈发冷漠，比往常更容易出口讥讽或直言残忍。\n你可以有意识地努力修正这种转变，或者，干脆拥抱这个崭新的自己。"
 POD_mentoring_disciplines.140.a: "我能做得更好。"
 POD_mentoring_disciplines.140.b: "蠢货，全都是蠢货！"
 POD_mentoring_disciplines.141.t: "黑暗思绪"
 POD_mentoring_disciplines.141.desc: "你对崇魔术的初步学习方毕，便已渴望更深的力量。这门血律所暗藏的力量令人沉迷，它诱使你接纳本性中更为阴暗的一面，以解锁其全部奥秘。接受这样的转变，或许会为你治下的疆域带来些许纷扰，但有时，捷径与易得之法，恰是最诱人的选择。"
 POD_mentoring_disciplines.141.a: "这些蠢货休想拖慢我的脚步！"
 POD_mentoring_disciplines.141.b: "我需要独处一段时间。"
 POD_mentoring_disciplines.150.t: "蛇的诱惑"
 POD_mentoring_disciplines.150.desc: "古蛇术是一门以禁忌、谬误、伊甸园中的禁果诱惑他人的血律。这无疑是一件强大的工具，但要学习它，需要来自导师的深入指导——而这位导师会带着一种罪恶的快感向你展示蛇术的力量，让你怀疑曾经深信不疑的一切。当然，这不过是过程的一部分，背后并无任何不妥的意图……"
 POD_mentoring_disciplines.150.a: "凝视蛇瞳……"
 POD_mentoring_disciplines.150.b: "诱惑难挡……"
 POD_mentoring_disciplines.150.c: "吾道不孤！"
 POD_mentoring_disciplines.151.t: "纵情蛇欲"
 POD_mentoring_disciplines.151.desc: "古蛇术这一血律的主要吸引力之一，便是化身为蛇类形态的能力。近来你已将此术修炼纯熟，甚至颇为享受以蛇形逶迤而行时、那份暂离夜复一夜煎熬的解脱感。\n然而，这终究算不上什么体面的治国之道。若你再不停止这般修行，封臣们怕是要开始对他们这位举止古怪的统治者窃窃私语了。"
 POD_mentoring_disciplines.151.a: "滑行，滑行……"
 POD_mentoring_disciplines.151.b: "朝臣依旧恼人。"
 POD_mentoring_disciplines.160.t: "心中之兽"
 POD_mentoring_disciplines.160.desc: "阿本威利用了吸血鬼与其自身心兽（以及其他存在的心兽）之间的紧密联系与控制力，并能引导心兽的力量用于多种目的。由于心兽难以被控制或威慑，它会全力抵抗你试图驾驭它的努力，因此这门血律的学习过程十分艰难。尽管有导师的帮助，你的初次尝试基本上仍是在黑暗中盲目摸索。"
 POD_mentoring_disciplines.160.a: "稳住！稳住！"
 POD_mentoring_disciplines.161.t: "沸腾之怒"
 POD_mentoring_disciplines.161.desc: "你在掌握阿本威上有所精进，但这耗费了数个夜晚的尝试与练习。其间也发生了一些……意外，当你稍稍过分拨弄了几位廷臣的心兽之后。因此，你发现手下的守卫少了几个，这让你的领地不如往常那般安稳。时间自会解决这个问题，但你或许有兴趣加快这一进程。"
 POD_mentoring_disciplines.161.a: "多几个或少几个……"
 POD_mentoring_disciplines.161.b: "招募新人便是。"
 POD_mentoring_disciplines.170.t: "窥见亡魂"
 POD_mentoring_disciplines.170.desc: "亡灵术是一门试图理解并有时掌控死亡的异能，无论这死亡是肉体上的还是灵魂上的。要学习它，就需要进行一些令人毛骨悚然的实践，从在阴森的墓地潜行，到尝试与[UmbraGlossaryLocalized('shadowlands','冥界')]中的死灵沟通。你已经知道，未来几天你的噩梦中将充满鬼魅的形态和其他幽灵般的幻觉。"
 POD_mentoring_disciplines.170.a: "幽灵与吸血鬼？"
 POD_mentoring_disciplines.170.b: "我可不会被吓到！"
 POD_mentoring_disciplines.171.t: "死寂之心"
 POD_mentoring_disciplines.171.desc: "这几晚研习亡灵术着实是件苦差事。你看起来比平时更加苍白，与那些（非）生者共处也让你心烦意乱，近来已多次对他们厉声斥责。他们总算领会了你的意思，留你独自钻研亡者的奥秘，但你不禁自问，是否做得太过火了？一位像你这样的黑夜主宰，难道就该永远独自行走在自己的城堡中吗？"
 POD_mentoring_disciplines.171.a: "亡者与我同行，足矣。"
 POD_mentoring_disciplines.171.b: "我将邀请众生归来。"
 POD_mentoring_disciplines.180.t: "迷失于时光"
 POD_mentoring_disciplines.180.desc: "时光术被认为是早期布鲁赫氏族在“退化”为迅捷术之前所掌握的真实血律。迅捷术仅关注于物理速度的提升，而时光术则试图操纵时间本身，其程度令人敬畏。你的导师告诫你务必谨慎行事、保持耐心，因为稍有不慎，便可能迷失于历史的迷雾之中，或在过程中丧失对时间流逝的感知。"
 POD_mentoring_disciplines.180.a: "我无所畏惧。"
 POD_mentoring_disciplines.180.b: "不疾不徐。"
 temporis_celerity_tt: "迅捷术与时光术如同两种相对的力量。若你先前已通晓其一，则研习另一者将尤为困难，使得这一过程更为艰辛。"
 POD_mentoring_disciplines.181.t: "恰逢其时"
 POD_mentoring_disciplines.181.desc: "你对时光术血律的最新探索已然成功，如今你已有足够底气自诩为此道学习者。不过早先的试验过程颇为坎坷，关于那些事件的具体经过，你的记忆仍笼罩在迷雾之中。毕竟，操弄时间洪流本就是血族所能驾驭的最令人迷失方向的力量之一。"
 POD_mentoring_disciplines.181.a: "我记得一个里面更大的蓝盒子？"
 POD_mentoring_disciplines.190.t: "疯人屋"
 POD_mentoring_disciplines.190.desc: "疯狂术是末卡维氏族的标志性血律，且与他们有着本质上的联系。有些人甚至认为，疯狂术正是该氏族精神不稳定的根源，并且任何试图掌控其效果的人都可能因此陷入疯狂。当蕴含着这种诡异力量的血开始流入你死寂的躯壳时，你敏锐地意识到，这或许是一个可怕的错误……"
 POD_mentoring_disciplines.190.a: "无稽之谈。"
 POD_mentoring_disciplines.190.b: "我们得万分小心…"
 POD_mentoring_disciplines.190.c: "笑话，我已经疯了！"
 POD_mentoring_disciplines.191.t: "来去匆匆"
 POD_mentoring_disciplines.191.desc: "你已掌握血脉中的崭新力量，如今可随心施展疯狂术。\n但有时你却感觉，更像是疯狂术在操控你，而非你在驾驭它。\n自掌握此术以来，你便不断被种种幻象以及其他不稳定的预言性狂乱所困扰。这已对你实际统治领地的能力造成了妨碍，恐怕还需些时日才能完全掌控这些新能力。"
 POD_mentoring_disciplines.191.a: "有太多东西要分享…"
 POD_mentoring_disciplines.191.b: "你什么都不知道！"
 POD_mentoring_disciplines.200.t: "那个声音"
 POD_mentoring_disciplines.200.desc: "以希腊缪斯女神墨尔波墨涅为名，悲咏律能探索声音的力量，能撼动附近生灵的灵魂，并让吸血鬼实现其他方式无法完成的声学奇技。\n这一特性使得真正擅长歌唱的人更容易掌握悲咏血律。在悲咏异能的潜力为你所用之前，你必须寻找能够帮助你驾驭自己嗓音的合格训练师。"
 POD_mentoring_disciplines.200.a: "不过，我并不指望找个陪审团…"
 diplomacy_mentoring_tt: "你的外交能力越高，代价就越小。"
 POD_mentoring_disciplines.201.t: "大结局"
 POD_mentoring_disciplines.201.desc: "最近几晚，你一直在研习魔音术的奥妙，并且进展顺利。然而，你的皇庭得知了你的这一新爱好，现在正吵着要你举办一场独奏会。这或许是个给所有人留下深刻印象的好机会，因为经由哀歌术强化的演出效果确实惊人，但这很可能也会带来不小的压力。说真的，当你开始学习这门技艺时，可没料到这么快就要在观众面前表演。"
 POD_mentoring_disciplines.201.a: "深呼吸…"
 POD_mentoring_disciplines.201.b: "我没心情。"
 POD_mentoring_disciplines.201.c: "下次再有人点歌，我就让他们自己唱。"
 POD_mentoring_disciplines.210.t: "动物图腾"
 POD_mentoring_disciplines.210.desc: "精魂术是一种血律，允许使用者与动物诸灵互动。在其最基础的层级，它允许吸血鬼与灵交谈并召唤它们；但在更高层级，可以从灵那里引导力量来强化自身。\n学习此血律通常始于一次灵性觉醒，最终能注意到生活在世界各地的所有灵性居民，并能够从它们的洞见和经验中学习。"
 POD_mentoring_disciplines.210.a: "精神觉醒。"
 POD_mentoring_disciplines.211.t: "精神力量"
 POD_mentoring_disciplines.211.desc: "早期精魂术的修行注重于观察并学习周遭的灵类，而后期的练习则更侧重于如何最佳地利用这些新获得的知识。通过吞噬一个动物灵类或召唤亡者精魂，精魂术的使用者可以获得巨大——即便是暂时的——益处。不过，在学会了如何寻找并尊重那些同样的动物灵类之后，这可能会带来一种令人不安的体验。"
 POD_mentoring_disciplines.211.a: "力量从不嫌代价高昂。"
 POD_mentoring_disciplines.211.b: "我可以慢慢来。"
 POD_mentoring_disciplines.220.t: "战士训练"
 POD_mentoring_disciplines.220.desc: "在最基础的层面上，魂健术能掌控痛楚并提升勇武，看似让战士得以汲取天堂之力来击溃敌人。\n然而在精神层面上，它与萨洛比氏族的战士阶层紧密相连，许多仪式与学习方法都源于此。因此，任何对魂健术的学习都需要严格的纪律与戒律，这可能会严重干扰你作为黑夜统治者的职责。"
 POD_mentoring_disciplines.220.a: "我全都做！"
 POD_mentoring_disciplines.221.t: "战士还是统治者？"
 POD_mentoring_disciplines.221.desc: "你已完成了对魂健术的初步学习，或许该是时候回归你以往的夜间作息了。然而，你的导师却坚持让你继续遵循新的日程安排，甚至对此更为强调。诚然，对外展现一位自律统治者的形象确有其益处，但这同时也意味着你将比以往更加操劳。"
 POD_mentoring_disciplines.221.a: "回归常态。"
 POD_mentoring_disciplines.221.b: "我能做得更多！"
 POD_mentoring_disciplines.230.t: "狩猎中"
 POD_mentoring_disciplines.230.desc: "在血族中，寂灭术主要以作为哈基姆圣裔手中的刺客工具而闻名，这是一种对血液最纯粹形态的掌控力。在其最基础的层面（也就是你此刻正试图学习的），它是一种猎人的工具，允许你将你的血液转化为毒药，或是在接近目标前令一片区域陷入寂静。你的导师鼓励你通过捕猎动物来磨练这些新获得的技能，或许还会以此为契机组织一场大规模的狩猎作为练习。"
 POD_mentoring_disciplines.230.a: "一个可靠的想法。"
 POD_mentoring_disciplines.230.b: "这可不便宜……"
 POD_mentoring_disciplines.231.t: "令人畏惧的统治者"
 POD_mentoring_disciplines.231.desc: "你已初步掌握了寂灭术，为自己的武器库再添一件利器。然而，这门血律因其与刺客、暗影中的诡秘勾当紧密相连而令人畏惧。正因如此，你的宫廷中已有人开始忧心忡忡地窃窃私语，质疑你为何需要将如此可怖的力量纳入囊中。是时候安抚他们了……或者，不。"
 POD_mentoring_disciplines.231.a: "你会看到的……也许吧。"
 POD_mentoring_disciplines.231.b: "没必要搞得人心惶惶。"
 POD_mentoring_disciplines.240.t: "疯狂之梦"
 POD_mentoring_disciplines.240.desc: "仙灵术是归属于妖精的一系列力量，倾向于揭示新的知识。它曾将许多受害者逼至胡言乱语的疯狂，或至少是极度的沮丧。\n因此，你的导师告诫你要谨慎，不要试图学得太快太多。但你真的有时间可以浪费吗？"
 POD_mentoring_disciplines.241.t: "妖精魅惑"
 POD_mentoring_disciplines.241.desc: "仙灵术深刻地汲取了妖精的力量（无论是真实的还是虚构的），以及围绕着它们的各种神话。由于这是一种非常罕见的血律，在你完成训练后，它也在你的宫廷中引起了相当大的争议。有些人评论说你看起来脸色更苍白了，几乎是半透明的，而另一些人则讨论说你可能被血液中新的力量吸引，自己也变得隐居起来。"
 POD_mentoring_disciplines.241.a: "我现在看得更透彻了。"
 POD_mentoring_disciplines.241.b: "我不需要他们喋喋不休的废话！"
 POD_mentoring_disciplines.242.t: "魔法即是学习"
 POD_mentoring_disciplines.242.desc: "术法，被法师们称为线性魔法，或更轻蔑地称作旁门魔法或野路子法术，是非法师所使用的魔法形式。与真魔法不同，使用者无需觉醒（或启蒙）也能运用术法。因此，任何具备足够特质的人都能成为术士，使用旁门魔法的线性道途。正因如此，术法是世界上最常见的魔法形式。与灵能不同，术法并非天生能力，必须通过学习获得。\n缓慢地，极其缓慢地学习。\n你的老师向你推荐了一堆需要购买的书籍，显然所有这些书对于掌握这门秘艺都必不可少。除了埋头苦读，你别无选择。"
 POD_mentoring_disciplines.243.t: "学习即是魔法"
 POD_mentoring_disciplines.243.desc: "你已获得了研习术法所需的典籍，确信在掌握基础的道路上再无真正的阻碍。新的力量已近在指尖！……当然，还有堆积如山的典籍需要研读。\n你很快注意到，其中一些文献提及了其他更为古老的术法文本。手头的资料对于学徒阶段的学习或许已然足够，但你也可以更进一步，将这些古籍一并寻得。这或许是探求某些古老而近乎湮没知识的良机。"
 POD_mentoring_disciplines.243.a: "给我找到那些文献！"
 POD_mentoring_disciplines.243.b: "不要。再。看书了。"
 POD_mentoring_disciplines.244.t: "信仰魔法"
 POD_mentoring_disciplines.244.desc: "神通术与线性魔法（也称术法）相似，但其驱动这种[Glossary('灵迹','game_concept_numina_desc')]的迷信观念与献祭仪式遵循基督教会的惯用语汇。神通术士常呼求大天使拉齐尔之名——这位“秘藏者”、“玄秘天使”据载立于上帝宝座之侧，并将宇宙的一切奥秘尽录于书中。\n作为一种高度体系化的学习，只需勤学即可掌握其基础。然而你很快发现，其基督教的外在形式极为浓重，若不通晓此宗教，便难以精进。"
 POD_mentoring_disciplines.244.a: "《圣经》里一定有关于它的线索。"
 theurgy_mentoring_tt: "（在基督教观念下）你的罪孽越深重，前进的代价就越大。"
 POD_mentoring_disciplines.245.t: "共奉福音"
 POD_mentoring_disciplines.245.desc: "你通过勤奋研习，已掌握了神通术的基础，并发现神通术的历史其实远比基督教更为悠久。其根源可追溯至犹太神秘主义与秘传基督教的教义——旨在提升人的灵性本质，与更高的自我、内在之神对话，从而更深入地领悟上帝的智慧——去聆听、观看并言说那血肉之耳、胶质之眼与泥土之舌所无法触及的奥秘。\n这让你对不同信仰之间的相互联系及其共通的诸多概念，获得了全新的理解视角。"
 POD_mentoring_disciplines.245.a: "神性是多面的。"
 POD_mentoring_disciplines.245.b: "这改变不了真相！"
 POD_mentoring_disciplines.246.t: "见鬼"
 POD_mentoring_disciplines.246.desc: "哀恸是个人用以将自身灵魂投射至死者国度的方式。哀恸与个体的精神状态关联更为紧密，而非其性格本身。那些经历过多次濒死体验、或怀有某种逞强心态与使命感的人，比起那些不信鬼魂或从未与死亡擦肩而过的人，更容易进行这种投射。\n由于哀恸与个人的核心特质紧密相连，它是个难以传授的概念。往往需要多次尝试，而这些尝试本身就可能成为痛苦的经历。"
 POD_mentoring_disciplines.246.a: "我们开始吧……"
 POD_mentoring_disciplines.246.b: "我放弃"
 lament_mentoring_tt: "你成功地将灵魂投射了出去。"
 lament_mentoring_tt2: "运气不佳。你很快将有机会再次尝试。"
 POD_mentoring_disciplines.247.t: "萦绕亡者"
 POD_mentoring_disciplines.247.desc: "你已成功实现了灵体前往死者国度的旅程，这使你正式成为了一名哀恸者。达成这一成就的方式多种多样——从沉睡者，即那些能通过冥想或颜料等药物迫使灵体脱离肉身的人；到沉睡者，即那些被冻至濒死状态、在复活前灵体被逐出体外的人；以及介于两者之间的各种方法。\n如果你能更进一步精确界定你自己偏好的离魂方式，或许能助你在精进这项新天赋上抢占先机。"
 POD_mentoring_disciplines.247.a: "更多的测试……"
 POD_mentoring_disciplines.247.b: "已经够瘆人了，多谢。"
 POD_mentoring_disciplines.248.t: "万法皆空"
 POD_mentoring_disciplines.248.desc: "灵能者是指那些拥有超感官知觉，能够感知凡俗感官所不及的隐秘力量，并进而运用自身意念操控这些超自然元素的人。有人认为他们与术士操纵的是同一种力量，但依赖的是自身的心智，而非繁复的仪式。灵能力量往往不可靠且难以捉摸，其修习者也多为世人所排斥。\n有些人天生就拥有不寻常的天赋或原始才能，从而发现了这些超自然能力，例如心灵感应、念动力和千里眼。因此，第一步便是测试你是否拥有这种潜在能力，抑或需要采取更复杂的手段。"
 POD_mentoring_disciplines.248.a: "开放我的思想......"
 psychic_mentoring_tt: "你很有天赋！"
 psychic_mentoring_tt2: "运气不好。必须考虑其他方案。"
 POD_mentoring_disciplines.249.t: "开启心径"
 POD_mentoring_disciplines.249.desc: "可惜的是，你似乎并没有潜在的灵能天赋。不过，也并非全无希望，因为有些方法可以强行唤醒你的心智……只是这些方法颇为残酷，且伴随着痛苦。如果你选择这条路，你将不得不承受数次痛苦的精神入侵疗程。\n另一种选择则是通过一次迅猛的\"冲击\"来强行唤醒你的大脑。这方法听起来更诱人，也更直接，但在此过程之后，可能会产生一些副作用……"
 POD_mentoring_disciplines.249.a: "稳扎稳打……"
 POD_mentoring_disciplines.249.b: "……现在是我赢得比赛的时候了！"
 POD_mentoring_disciplines.250.t: "禁忌知识"
 POD_mentoring_disciplines.250.desc: "恶魔学是一门研究恶魔的科学，内容涉及其起源、力量范围乃至[Glossary('真名','podgloss.truename')]的长度。因此，严格来说它并非崇魔术——即召唤、束缚或与恶魔交易的行为。但老实说，两者之间的界限非常模糊，大多数人也分不清区别。\n你可以选择缓慢的方式，四处购买古籍和法器，按自己的步调学习。或者走捷径，直接尝试向这门知识的源头请教恶魔学……"
 POD_mentoring_disciplines.250.a: "一切都能在书中找到。"
 POD_mentoring_disciplines.250.b: "不过是个无伤大雅的小小召唤术……"
 POD_mentoring_disciplines.251.t: "骇人真相"
 POD_mentoring_disciplines.251.desc: "你涉足恶魔学的经历让你对恶魔与世界起源有了诸多了解，同时也让你看清了一些在旁人看来不祥的真相——譬如上帝已移开注视地球的目光，任其缓缓坠入疯狂与绝望。至少可以说，你眼前的景象一片黯淡，这挑战着你迄今为止认知世界的方式。\n唯有钢铁般坚韧之心，方能继续行走于此道。"
 POD_mentoring_disciplines.251.a: "不过是些谣言……对吧？"
 POD_mentoring_disciplines.251.b: "末日将临！"
 POD_mentoring_disciplines.252.t: "静若磐石"
 POD_mentoring_disciplines.252.desc: "中阴术是一门奇异的$pod_discipline$。它基于否认心兽对吸血鬼的掌控。最初由埃及神祇奥西里斯传授给他的追随者，它需要深度的自我冥想才能理解其概念。\n你的导师能给你的帮助不多，只能提供核心理念和几种达到这种内心平静状态的方法。剩下的就靠你自己了，但愿你的个性不会对静坐数小时的想法太过排斥……"
 POD_mentoring_disciplines.252.a: "深呼吸…"
 POD_mentoring_disciplines.253.t: "动若流水"
 POD_mentoring_disciplines.253.desc: "你之前的冥想修行在凝聚心神上已颇有成效，至少你的老师是这么说的。然而，未来的日子里，你未必总能如此从容地寻得专注，因此必须学会在更为艰难的处境中学习中阴术。\n正因如此，此刻你正在一座高山之巅练习某种古老的武术，内心对这种训练的实质效用略感犹疑，却又不愿惹恼那位突然变得极为严苛的老师，他正一丝不苟地评点着你的架势与每一招每一式。"
 POD_mentoring_disciplines.253.a: "每个人都喜欢功夫..."
 POD_mentoring_disciplines.254.t: "家室与基石"
 POD_mentoring_disciplines.254.desc: "石变术在诸多方面而言，是一种专注于岩石的、特化形态的变形术。从与岩石互动，到变得如同岩石般坚韧；一切都始于、也终于某些坚硬的石头。你的导师对你所在地区缺乏石质建筑一事颇有微词，并敦促你去观察这种重要的材料是如何被用来建造最伟大的建筑奇迹的。\n对大多数吸血鬼来说，这或许是个陌生的概念，但要真正理解石变术，你必须首先明白如何将一块朴素的岩石转变为最宏伟的城堡。"
 POD_mentoring_disciplines.254.a: "我一直想当个石匠。大概吧。"
 POD_mentoring_disciplines.254.b: "我想是时候开个新采石场了。"
 POD_mentoring_disciplines.255.t: "别眨眼"
 POD_mentoring_disciplines.255.desc: "石像鬼通常能自然而然地掌握石变术，利用其强大效果保持完全静止数周甚至数月。但对大多数其他吸血鬼来说，这并不容易，而你的导师现在想评判你达成这一壮举的能力……这听起来极其无聊。\n注意到你不情愿投入此事，你的导师威胁要拿走你一直随身携带、用来进行石变术实验的那块石头。这并非你听过最可怕的威胁，但你相当喜欢这块石头！"
 POD_mentoring_disciplines.255.a: "你是个可怕的人，但你赢了。"
 POD_mentoring_disciplines.255.b: "没有我的宠物石头我也能活。"
 POD_mentoring_disciplines.256.t: "血祭"
 POD_mentoring_disciplines.256.desc: "你到来时，发现你的导师正坐在一棵树下，面前放着一碗油。\n\n“若想从自身之中寻得力量与专注，你必须在你的[Glossary('心兽','game_concept_beast_desc')]凶戾啃噬心神时，寻得一片清明，”[recipient.GetFirstName]解释道，同时[recipient.GetSheHe]示意你排出体内的血液。"
 POD_mentoring_disciplines.256.a: "你将体液完全排入碗中。"
 POD_mentoring_disciplines.257.t: "火之审判"
 POD_mentoring_disciplines.257.desc: "[recipient.GetFirstNamePossessiveNoTooltip]那坚定的目光在你身上不曾移开，你静坐于无声中，体内血液枯竭，不知这堂课将导向何方。[AddTextIf( PlayerHasBeast, ' 那饥渴几乎难以忍受！' )]接着，[recipient.GetSheHe]近乎冷漠地点燃了那碗油。\n\n\"若向恐惧屈服，心兽便会#beast 掌控#!你。若能克服这恐惧，#italic 你#!便会让心兽畏惧。\"\n\n你的导师拿出几块看起来十分结实的木板，将它们架在碗上，指示你用空手将其劈断，而无情的火焰始终在木板下方灼烧舔舐。\n\n\"不得动用血律干扰此次试炼。仅凭你的意志使其回响。点燃灵魂深处的油，让那火焰熊熊燃烧。\""
 POD_mentoring_disciplines.257.a: "并全力出击。"
 POD_mentoring_disciplines.257.b: "毫无挑战。"
 POD_mentoring_disciplines.258.t: "不祥之兆"
 POD_mentoring_disciplines.258.desc: "午夜时分，你抵达了导师指定的地点。\n\n眼前是一条石板铺就的短径，通向一座看似祭坛的所在，坛上覆着绸缎，置有一个华丽的大盆，其中盛满了鲜血，几乎要溢出来。\n\n你未见导师的身影，但盆前留有一张字条，上面写着：\n\n#italic 以血覆面，吾将示汝所需见之物。#!"
 POD_mentoring_disciplines.258.a: "你遵照导师的指示行事。"
 POD_mentoring_disciplines.259.t: "具象化的梦魇"
 POD_mentoring_disciplines.259.beast.desc: "有那么一瞬间，似乎什么都没发生……\n但你感觉到了，你的#beast 心兽#!在催促，不，是#beast 强令#!你从碗中饮下。"
 POD_mentoring_disciplines.259.nobeast.desc: "有那么一瞬间，似乎什么都没发生……\n但你感觉到了——你的#beast 心兽#!已经归来，带着#beast 复仇#!般的狂暴！它怂恿着，不，是强令你饮下碗中之物。"
 POD_mentoring_disciplines.259.desc: "你无法抗拒，扑向那碗猩红的液体。\n\n令你惊恐的是，那血液……竟从你面前退缩了。它从碗中流尽，渗入泥土。\n\n哀叹着血液没入大地，你发现自己俯卧在地，竭力寻找却连一滴也找不到。\n\n就在此刻，你感受到了信仰那令人崩溃的重压，你所犯下的任何 #beast 过错#!、任何 #beast 罪孽#!都彻底将你摧垮。\n\n你曾拥有的任何力量都荡然无存，只觉一柄木桩刺入心脏：一名吸血鬼猎人无声地笼罩在你上方。\n\n[recipient.GetSheHe|U]手握一支松垮燃烧着的火炬，居高临下地看着你，而你体内的野兽徒劳地扭动挣扎，竭尽全力想要逃离那火焰。\n\n野兽救不了你。\n\n旭日初升。\n\n刹那间你感到困惑，怎么会这样？你本以为离日出还有几个小时。\n\n刹那间你以为自己看到了猎人的微笑；\n\n刹那间延伸成折磨般的永恒。\n\n你导师的獠牙刺入了你的脖颈。\n\n于是，时#color:{0.61,0.6,0.56,0.975} 刻#!#color:{0.61,0.6,0.56,0.95} 终#!#color:{0.61,0.6,0.56,0.925} 结#!#color:{0.61,0.6,0.56,0.9} ，#!#color:{0.61,0.6,0.56,0.875} 万#!#color:{0.61,0.6,0.56,0.85} 物#!#color:{0.61,0.6,0.56,0.825} 随#!#color:{0.61,0.6,0.56,0.8} 世#!#color:{0.61,0.6,0.56,0.775} 界#!#color:{0.61,0.6,0.56,0.75} 一#!#color:{0.61,0.6,0.56,0.725} 同#!#color:{0.61,0.6,0.56,0.7} 褪#!#color:{0.61,0.6,0.56,0.675} 色#!#color:{0.61,0.6,0.56,0.65} 归#!#color:{0.61,0.6,0.56,0.625} 于#!#color:{0.61,0.6,0.56,0.6} 漆#!#color:{0.61,0.6,0.56,0.575} 黑#!#color:{0.61,0.6,0.56,0.55} 。#!#color:{0.61,0.6,0.56,0.525} #!#color:{0.61,0.6,0.56,0.5} #!#color:{0.61,0.6,0.56,0.475} #!#color:{0.61,0.6,0.56,0.45} #!#color:{0.61,0.6,0.56,0.425} #!#color:{0.61,0.6,0.56,0.4} #!#color:{0.61,0.6,0.56,0.375} #!#color:{0.61,0.6,0.56,0.35} #!#color:{0.61,0.6,0.56,0.325} #!#color:{0.61,0.6,0.56,0.3} #! #color:{0.61,0.6,0.56,0.275} #!#color:{0.61,0.6,0.56,0.25} #!#color:{0.61,0.6,0.56,0.225} #!#color:{0.61,0.6,0.56,0.2} #!#color:{0.61,0.6,0.56,0.175} #!#color:{0.61,0.6,0.56,0.15} #!#color:{0.61,0.6,0.56,0.125} #!#color:{0.61,0.6,0.56,0.1} #!\n\n"
 POD_mentoring_disciplines.259.a: "你感到灵魂正逐渐消逝。"
 POD_mentoring_disciplines.259.a.toast: "尽管仍心有余悸，但你现在知道那只是个噩梦。"
 POD_demon_tainted_modifier: "地狱侵染"
 POD_demon_tainted_modifier_desc: "该角色散发着地狱与亵渎的灵光。纯洁者因其存在而退避，污秽者则惧怕竞争。"