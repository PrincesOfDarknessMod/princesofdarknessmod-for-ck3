l_simp_chinese:
 POD_realm_mastery.2.t: "[PlayerJourneyDestination.GetHolding.GetCurrentSpecialBuildingType.GetNameNoTooltip][Select_CString( DidShatteringHappen, '的残余', '的宫廷' )]"
 POD_realm_mastery.2.desc: "这里的梦华无处不在。仿佛空气本身就充满了创造的潜能，随时准备将梦境变为现实。\n\n"
 POD_realm_mastery.2.desc.preshattering: "居住在[PlayerJourneyDestination.GetHolding.GetCurrentSpecialBuildingType.GetName]的$POD_splat_fae$贵胄允许我觐见。四周都是拘谨的面孔，但不一定充满敌意。"
 POD_realm_mastery.2.desc.postshattering: "在[Glossary('大碎溃','game_concept_shattering_desc')]之后，[PlayerJourneyDestination.GetHolding.GetCurrentSpecialBuildingType.GetName]的永契堡据说被遗弃了。然而，显然有一位强者在监视着我——我能在[UmbraGlossary('dreaming')]中感受到其的存在。"
 POD_realm_mastery.2.desc.end: "有一种好奇的期待感。\n\n\n我该如何陈述我的理由？"
 POD_realm_mastery.2.option.a: "展现无价的宝物。"
 POD_realm_mastery.2.option.a.success: "[Select_CString( DidShatteringHappen, '失落者', '贵胄' )]很惊讶"
 POD_realm_mastery.2.option.a.fail: "[Select_CString( DidShatteringHappen, '失落者', '贵胄' )]想要更多"
 POD_realm_mastery.2.option.a.critfail: "更多"
 POD_realm_mastery.2.option.b: "朗诵史诗。"
 POD_realm_mastery.2.option.b.success: "完美无缺的表演"
 POD_realm_mastery.2.option.b.fail: "虽有小瑕疵但不俗的表演"
 POD_realm_mastery.2.option.b.critfail: "许多小插曲"
 POD_realm_mastery.2.option.c: "制作一件虚构的艺术品"
 POD_realm_mastery.2.option.c.success: "令人惊叹的艺术品"
 POD_realm_mastery.2.option.c.fail: "该艺术品还需要稍作修改"
 POD_realm_mastery.2.option.c.critfail: "该艺术品还需要巨量的调整"
 POD_realm_mastery.3.t.success: "一个成功的请愿"
 POD_realm_mastery.3.t.fail: "一个昂贵的请愿"
 POD_realm_mastery.3.t.critfail: "一个非常昂贵的请愿"
 POD_realm_mastery.3.desc.preshattering: "人群中响起了一阵附和声。看来我的请愿满足了贵胄。"
 POD_realm_mastery.3.desc.postshattering: "我仍然没有看到我的同伴，但似乎无形的存在对我的请愿很满意。"
 POD_realm_mastery.3.desc: "空气中火花四溅，原始的梦华从[UmbraGlossary('dreaming')]中涌出，凝聚成一连串闪烁的图像。\n\n"
 POD_realm_mastery.3.desc.actor: "我看到天空中的奥林匹斯众神在争斗、争吵、厮杀，直到云层中响起雷鸣，下面的凡人用低沉的语调诉说着他们传奇般的恩怨。"
 POD_realm_mastery.3.desc.fae: "我看到了浪子们，看到了成千上万张面孔，他们忘记了自己的$POD_splat_fae$出身，等待着与[UmbraGlossary('dreaming')]重聚，渴望着他们从不知道的东西。"
 POD_realm_mastery.3.desc.prop: "我看见一把插在岩石上的剑，等待合格的持剑人。我看见一把缺陷且短柄的锤子，注定要成就一番伟业。我还看见更多类似的宝物，它们在歌曲和传奇中永垂不朽，并成为[UmbraGlossary('dreaming')]本身的一部分。"
 POD_realm_mastery.3.desc.nature: "我看到四季交替，相互交战，同时又相互滋养，就像一场错综复杂的舞蹈。我看到波涛汹涌的海洋和肆虐的风暴。我看到了月亮，泪水从我眼中肆意流淌，虽然我不知道为什么。"
 POD_realm_mastery.3.desc.scene: "我看到了故事，它们像有生命一样穿越各大洲，到达世界的每一个角落，无论距离多远，都能激发梦种和戚族的敬畏之心。"
 POD_realm_mastery.3.desc.time: "在我看来，故事就像古老的宝藏，历久弥新，只要有梦种和戚族讲述，故事就会一直流传下去。尽管岁月流逝，但它们的火花永不熄灭，它们的灵感永不褪色。"
 POD_realm_mastery.3.desc.end: "\n\n这些奇魅的画面让我难以处理，但我内心深处已经有了新的认知。"
 POD_realm_mastery.3.option.a: "我会珍惜这次的经验。"