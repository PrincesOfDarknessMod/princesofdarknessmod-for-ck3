l_simp_chinese:
 POD_golconda_journey.1000.t:0 "黑暗，我的老朋友"
 POD_golconda_journey.1000.desc:0 "#R “现在”我们可以谈谈了。\n\n你以为你能永远摆脱我吗？你“真的”以为你那副乖巧的样子能骗过任何人吗？骗不了我！\n\n看看你的下场。你就是抵挡不住诱惑，对吧。我“很”高兴你回来了。\n\n我们在一起会很开心的。你等着……#!"
 POD_golconda_journey.1000.option.a:0 "……"
 POD_golconda_journey.1000.option.a.tt:0 "你从[golconda|E]之道堕落。如果你想恢复，就必须从头开始……"
 POD_golconda_journey.1.t:0 "寻找答案"
 POD_golconda_journey.1.desc:0 "在一个僻静的花园里，[teacher.GetFirstName]与我相见，远离窥探的目光。[teacher.GetHerHis|U]的声音低沉，但是[teacher.GetHerHis]的眼睛闪闪发光。\n\n[teacher.GetSheHe|U]向我讲述了救赎。\n\n最初由天使加百列向[GetScriptedCharacterByHistoryID('505001').GetFirstName]承诺。最初由[GetScriptedCharacterByHistoryID('505008').GetFirstNameNicknamed]实现。许多人追求的状态，只有少数人达到。\n\n这个救赎的名字是[GetTrait('golconda').GetName(GetNullCharacter)]。"
 POD_golconda_journey.1.option.a:0 "我们一直聊到凌晨……"
 POD_golconda_journey.2.t:0 "千里之行"
 POD_golconda_journey.2.desc:0 "[teacher.GetFirstName]尝试用一系列模糊的隐喻来解释通往[golconda|E]的道途，每一个都比上一个更加深奥和令人困惑。我#italic 认为#!我大致理解了其中的要点。\n\n在某种程度上，浩恩永生是回归人性。一个走在道途上的[cainite|E]#X 绝不能通过犯下谋杀或盗窃来丧失自己的人性。#!\n\n此外，必须#X 不惜一切代价避免血狂#!在[Concept('faith','心路')|E]上具有更高的[piety_level|E]可以削弱[the_beast|E]的影响力。\n\n当[teacher.GetFirstName]向我告别时，我陷入了深思之中。"
 POD_golconda_journey.2.effect:0 "你知晓了[golconda|E]，开启了[journey|E]，与你的[beast|E]和平相处。"
 POD_golconda_journey.2.option.a:0 "我知道我得做什么了。"
 POD_golconda_journey.10.t:0 "涓滴感悟"
 POD_golconda_journey.10.desc:0 "我隐居在我的藏身处里，思考我学到的东西。\n\n"
 POD_golconda_journey.10.desc.1:0 "[the_beast|E]强大无比。确实，有些[Concept('faith','心路')|E]试图通过向它#R 投降#!来驾驭其力量，它们的信徒渐行渐远离人性，对后果毫不关心。\n\n当然，[golconda|E]之道与这种方法根本不相容。然而，[the_beast|E]只接受彻底#R 投降#!。能否说服它进入平等的伙伴关系？"
 POD_golconda_journey.10.desc.2:0 "[the_beast|E]很是#R 饥渴#!。心兽就是#R 饥饿#!本身。\n\n但是，#R 饥饿#!到底#italic 是#!什么？只是一种生存本能。提醒着这世上的每个生物需要#R 进食#!。\n\n然而，心兽的要求远远超出了生存所需。有些地方不对劲。"
 POD_golconda_journey.10.desc.3:0 "[the_beast|E]冲动难抑。它不断地拉扯着我，要求我#R 吸食#!我的廷臣、同辈、朋友，我所遇到的每个人，我所珍视的每个人。\n\n然而，它也很狡猾。在我的观察中，我看到了它有智慧的证据。所以它能提前计划。\n\n这引出了一个问题：它所有看似冲动的要求是否都是为了某种更大的目的服务？"
 POD_golconda_journey.10.option.a:0 "每个答案都会引出更多的问题。"
 POD_golconda_journey.10.option.a.success:0 "你对[the_beast|E]的理解有了突破。"
 POD_golconda_journey.11.t:0 "凝视深渊"
 POD_golconda_journey.11.desc:0 "这一次有所不同。\n\n当我坐下来沉思时，我变得非常放松。我的意识随着身体的感觉，血管中精血的流动而流转。突然，我注意到了它。\n\n就像是最微小的一针灼热的痛楚。一种模糊的疼痛漂浮在我心脏的血液中。\n\n它是……回忆？还有#R 饥渴#!。\n\n我感到非常确定。这就是[the_beast|E]所驻扎的地方。如果我激发我的血液，我可以揭开它隐藏的一切。我终于可以面对它，直视它。"
 POD_golconda_journey.11.effect:0 "你解锁了欢息[journey|E]。"
 POD_golconda_journey.11.option.a:0 "问题是……我准备好了吗？"
 POD_golconda_journey.100.t:0 "送入深处"
 POD_golconda_journey.100.desc:0 "我最后一次锁上藏身处的大门，回想着导致我来到这里的种种事件。\n\n"
 POD_golconda_journey.100.desc.compassion:0 "我无论做什么，我都努力看到他人的优点。我也努力将同样的同情心延伸给[the_beast|E]，但这并不容易。\n\n我能对#R 盲目的饥渴#!展示慈悲吗？我越是试图理解它的动机，它就显得越是深不可测。\n\n我只能希望直面它将会引导我找到我所追寻的答案。"
 POD_golconda_journey.100.desc.selfreliance:0 "我早已认识到他人是不可信任的。这是世界的法则。天真会像阳光一样毁灭一位[cainite|E]。\n\n在这件事中，没有人可以帮助我。如果我想直面[the_beast|E]，责任完全落在我身上。\n\n我知道我需要做什么，而且我有决心去做到。"
 POD_golconda_journey.100.option.a:0 "我伸展我的感知，送往内心深处……"
 POD_golconda_journey.101.t:0 "没有方向"
 POD_golconda_journey.101.desc:0 "痛苦。\n\n我陷入了一场喧嚣的旋涡，耳膜震耳欲聋的色彩环绕着我。刺耳的噪音在我的舌尖留下金属的余味。上下颠倒，颠倒上下。\n\n感官的攻击如同雪崩般袭来。恐慌开始蔓延。我要死了吗？\n\n我需要找到一种快速让自己稳定下来的方法。"
 POD_golconda_journey.101.option.a:0 "专注于身体感受。"
 POD_golconda_journey.101.option.b:0 "专注于愉悦回忆。"
 POD_golconda_journey.102.t:0 "漂浮"
 POD_golconda_journey.102.desc:0 "周围的混乱稍稍平静下来。形状重新排列，呈现出几何的秩序。就像无尽的镜子序列，我在其中看到了自己的重复倒影。\n\n它们就像是关于我过去的微观陈列。所有的欢乐和伤痛、自豪和遗憾、失望和宽慰的记忆。\n\n从这个距离看，它们显得如此微小和无足轻重。"
 POD_golconda_journey.102.option.a:0 "提醒我不要让俗事冲昏头脑。"
 POD_golconda_journey.102.option.b:0 "提醒我思考什么才是真正重要的。"
 POD_golconda_journey.103.t:0 "脚踏实地"
 POD_golconda_journey.103.desc:0 "幻象破碎，我发现自己置身于一条河谷之中。\n\n阳光明媚。我已经忘记了它的温暖。言语无法形容这种感受。\n\n一个男人站在河岸边。他弟弟的尸体躺在他面前，头部的伤口血流不止，倾泻入水中。\n\n这个男人的脸上一片空白。然而，一种强烈的共情涌上心头。我清楚地知道他的感受。"
 POD_golconda_journey.103.option.a:0 "内疚。"
 POD_golconda_journey.103.option.b:0 "困惑。"
 POD_golconda_journey.103.option.c:0 "不可估量的狂怒。"
 POD_golconda_journey.104.t:0 "事件视界"
 POD_golconda_journey.104.desc:0 "男人转过头看着我。他周围的景象开始旋转和溶解。整个世界都变成了一片翻滚的红色海洋。\n\n#R;bold 饥渴。#!\n\n我终于明白了饥渴是什么。"
 POD_golconda_journey.104.desc.guilt:0 "那是他的内疚。\n\n他被贴上了罪人的标签，然而千年过去了，他没有得到任何真正的救赎机会。"
 POD_golconda_journey.104.desc.confusion:0 "那是他的困惑。\n\n他感到弱小，因为法则对他进行了改变，他疑惑着是否还有什么能让他再次感到强大的东西。"
 POD_golconda_journey.104.desc.rage:0 "那是他的愤怒。\n\n他曾经给予爱，却换来了千年的惩罚。"
 POD_golconda_journey.104.desc.end:0 "\n\n而我意识到——这些感受都不是我的。它们是他的，应该由他承担。\n\n然而，它们的重量即将将我淹没。"
 POD_golconda_journey.104.option.a:0 "……"
 POD_golconda_journey.104.option.a.tt:0 "你将尽最后的努力避免血狂。"
 POD_golconda_journey.104.option.a.success:0 "你将对饥渴的理解更加深刻，从而获得[enlightenment|E]。"
 POD_golconda_journey.104.option.a.failure:0 "你成为了#R 饥渴#!，而#R 饥渴#!成为了你。"
 POD_golconda_journey.105.t:0 "浩恩永生"
 POD_golconda_journey.105.desc:0 "我醒来了。现实逐渐变得清晰起来，慢慢回归焦点，花费了它应当的时间。\n\n我浑身都被精血所覆盖。它一定是在我意识追寻幻境的时候从我的毛孔中渗出来的。\n\n这景象足以让任何[cainite|E]陷入血狂之中。但我内心没有丝毫波动。没有内在的声音敦促我将其全部饮下。\n\n只有宁静。"
 POD_golconda_journey.105.option.a:0 "宁静……"
 POD_golconda_journey.106.t:0 "欢宴"
 POD_golconda_journey.106.desc:0 "我能看到的只有血。\n\n无处不在。滚沸、沸腾、咕噜咕噜的泡泡在招手。\n\n在我体内，在我周围。没有分离。没有对比，没有对决，只有#R 投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投#!"
 POD_golconda_journey.106.option.a:0 "#R 投降#!"
 POD_golconda_journey.1000.option.b:0 "我放弃。"
 POD_golconda_journey.1000.option.b.tt:0 "你放弃[golconda|E]之道，失去[GetTrait('golconda_seeker').GetName(GetNullCharacter)][trait|E]。"
 POD_golconda_journey.1001.t:0 "挫折"
 POD_golconda_journey.1001.desc:0 "#R 我就知道！我就知道！我就他妈知道。\n\n你就喜欢装高高在上是吧？你以为自己是什么圣人？你以为你比我厉害？那就再想想，傻逼。\n\n我更喜欢你这样。屈服于你的冲动会让你更讨人喜欢。你应该养成习惯。#!"
 POD_golconda_journey.1001.option.a:0 "……"
 POD_golconda_journey.1001.option.a.tt:0 "你堕出了[golconda|E]之道，你在[GetTrait('golconda_seeker').GetName(GetNullCharacter)][trait|E]中的进度已被重置。"
 POD_golconda_journey.10.desc.4:0 "[the_beast|E] is a #R curse#!. Many would say by God himself or some other entity of such power, but the details don't really matter.\n\nIt can never be trusted, bargained with or even coerced. Whether it is a foreign invader or a dark reflection is of no consequence because, in the end, it is a test.\n\nUnderstanding this test and how to overcome it might be the key to everything."
 POD_golconda_journey.10.desc.5:0 "[the_beast|E] is primeval. Man was #R savage#! once, and all the modern trappings of \"civilization\" are clumsily trying to hide the brutality inherent to man's existence.\n\nMortals don't hear [the_beast|E] as we do but they certainly feel its effects, explaining the #R violence#! of their world. Vampires, as creatures stuck in eternal stasis, are closer to this primeval state of affairs and as such hear the call for violence much more clearly.\n\nGolconda is perhaps the true next step of one's evolution, where the #R savagery#! of humanity's birth can finally be left behind."
 POD_golconda_journey.10.desc.6:0 "[the_beast|E] is I. Many would balk at such a notion but few can deny the raw #R allure#! of its whispers. How could such an #R allure#! be born if not by being a dark reflection of one's persona? As vampires know very well, the best tempters know everything about their prey.\n\nMoving on from this realization is no small matter however. One can not simply remove a part of themselves without losing much in the process, which leaves only one course of action, terrifying in its simplicity.\n\nAcceptance.\n\nI am [the_beast|E] and [the_beast|E] is me."
 POD_golconda_journey.10.desc.7:0 "[the_beast|E] is seductive. Like the serpent in the first garden, it offers enticing promises, simple solutions and easy ways out. And, still like the serpent, those are all roads to #R damnation#!.\n\nIf vampirism was indeed a Biblical curse of some sort, there can be no simple solution, no magical power to undo everything.\n\nThe answer can only lie on a long road of self-atonement, far from the bestial #R cravings#! of our kind. On this lonely road, there is only one companion, [the_beast|E] trying to make us fall every step of the way. We just have to decline its tempting offers.\n\nEve only had to decline the serpent's ones, after all."
 POD_golconda_journey.10.desc.8:0 "[the_beast|E] is Prometheus. The firebringer that saved humanity from slavery to the Gods but also condemned it to burn itself again and again. It fuels my powers, crushes my enemies and protects me from the horrors in the dark.\n\nBut it also makes me a monster, a Slaver-God that enthralls humanity for my own perverted #R pleasure#! and repeats the never ending cycle. Perhaps to break it means simply to stop relying on it.\n\nBut what am I without the #R power#! that set me free?"
 POD_golconda_journey.10.desc.9:0 "[the_beast|E] is an illusion. A fabrication of our own mind to rationalize the horrors we #R unleash#! upon humanity. The mere existence of Golconda, and the fact that those that attain it are rumored to be free of it, proves that [the_beast|E] is a myth so deeply ingrained into the [cainites|E]' psyche that it has become its own form of reality.\n\nThe voices in my head, the dark #R urge#! to drink, kill, maim, are just that, fragments of a predatory mindset that can be curtailed with enough willpower."
 POD_golconda_journey.2000.toast.t:0 "End of Mentorship"
 POD_golconda_journey.2000.toast.golconda:0 "[golconda_mentee.GetShortUIName] has achieved [GetTrait('golconda').GetName(GetNullCharacter)]"
 POD_golconda_journey.2000.toast.insight:0 "[golconda_mentee.GetShortUINamePossessive] insight has exceeded yours"
 POD_golconda_journey.2001.t:0 "Steady Guidance"
 POD_golconda_journey.2001.desc:0 "A year has passed since I last imparted some some of my knowledge on [the_beast|E] to [golconda_mentee.GetFirstNameNicknamed].\n\nIn the time since, [golconda_mentee.GetHerHis] insight has deepened, and so [golconda_mentee.GetHerHis] mind is open to new knowledge once more.\n\nI should decide whether to keep mentoring [golconda_mentee.GetHerHim] or not."
 POD_golconda_journey.2001.option.a:0 "I'll mentor [golconda_mentee.GetHerHim] tonight, and do it again next year."
 POD_golconda_journey.2001.option.a.tt:0 "In one year, you will mentor [golconda_mentee.GetShortUIName] again"
 POD_golconda_journey.2001.option.b:0 "I'll mentor [golconda_mentee.GetHerHim] tonight, but not any further."
 POD_golconda_journey.2001.option.b.tt:0 "You will stop mentoring [golconda_mentee.GetShortUIName]"
 POD_golconda_journey.2001.option.c:0 "I'll stop mentoring [golconda_mentee.GetHerHim] for now."
 POD_golconda_journey.2000.toast.invalid:0 "Due to your low insight, you can no longer mentor others"