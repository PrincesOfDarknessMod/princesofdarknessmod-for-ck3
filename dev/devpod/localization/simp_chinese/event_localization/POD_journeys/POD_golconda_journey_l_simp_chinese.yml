l_simp_chinese:
 POD_golconda_journey.1000.t:0 "黑暗，我的老朋友"
 POD_golconda_journey.1000.desc:0 "#R “现在”我们可以谈谈了。\n\n你以为你能永远摆脱我吗？你“真的”以为你那副乖巧的样子能骗过任何人吗？骗不了我！\n\n看看你的下场。你就是抵挡不住诱惑，对吧。我“很”高兴你回来了。\n\n我们在一起会很开心的。你等着……#!"
 POD_golconda_journey.1000.option.a:0 "……"
 POD_golconda_journey.1000.option.a.tt:0 "你从[golconda|E]堕落，[the_beast|E]的声音将再次成为你永恒的伴侣。"