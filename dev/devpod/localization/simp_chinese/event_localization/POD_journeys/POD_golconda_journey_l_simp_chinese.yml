l_simp_chinese:
 POD_golconda_journey.1000.t: "黑暗，我的老朋友"
 POD_golconda_journey.1000.desc: "#beast “现·在”我们可以谈谈了。\n\n你以为你能永远摆脱我吗？你“真·的”以为你那副乖巧的样子能骗过任何人吗？骗不了“我”！\n\n看看你的下场。你就是抵挡不住诱惑，对吧。我“很”高兴你回来了。\n\n我们在一起会很开心的。你等着……#!"
 POD_golconda_journey.1000.option.a.tt: "你从[golconda|E]之道堕落。如果你想恢复，就必须从头开始……"
 POD_golconda_journey.1.t: "寻找答案"
 POD_golconda_journey.1.desc: "在一个僻静的花园里，[teacher.GetFirstName]与我相见，远离窥探的目光。[teacher.GetHerHis|U]的声音低沉，但是[teacher.GetHerHis]的眼睛闪闪发光。\n\n[teacher.GetSheHe|U]向我讲述了救赎。\n\n最初由天使加百列向[GetScriptedCharacterByHistoryID('505001').GetFirstName]承诺。最初由[GetScriptedCharacterByHistoryID('505008').GetFirstNameNicknamed]实现。许多人追求的状态，只有少数人达到。\n\n这个救赎的名字是[GetTrait('golconda').GetName(GetNullCharacter)]。"
 POD_golconda_journey.1.option.a: "我们一直聊到凌晨……"
 POD_golconda_journey.2.t: "千里之行"
 POD_golconda_journey.2.desc: "[teacher.GetFirstName]尝试用一系列模糊的隐喻来解释通往[golconda|E]的道途，每一个都比上一个更加深奥和令人困惑。我#italic 认为#!我大致理解了其中的要点。\n\n在某种程度上，浩恩永生是回归人性。一个走在道途上的$pod_cainite$#X 绝不能通过犯下谋杀或盗窃来丧失自己的人性。#!\n\n此外，必须#X 不惜一切代价避免血狂#!在[Concept('faith','心路')|E]上具有更高的[piety_level|E]可以削弱[Glossary('心兽','game_concept_beast_desc')]的影响力。\n\n当[teacher.GetFirstName]向我告别时，我陷入了深思之中。"
 POD_golconda_journey.2.effect: "你知晓了[golconda|E]，开启了[journey|E]，与你的[Glossary('心兽','game_concept_beast_desc')]和平相处。"
 POD_golconda_journey.2.option.a: "我知道我得做什么了。"
 POD_golconda_journey.10.t: "涓滴感悟"
 POD_golconda_journey.10.desc: "我隐居在我的[ROOT.Char.Custom('PODDomicile')]里，思考我学到的东西。\n\n"
 POD_golconda_journey.10.desc.1: "[Glossary('心兽','game_concept_beast_desc')]强大无比。确实，有些[Concept('faith','心路')|E]试图通过向它#beast 投降#!来驾驭其力量，它们的信徒渐行渐远离人性，对后果毫不关心。\n\n当然，[golconda|E]之道与这种方法根本不相容。然而，[Glossary('心兽','game_concept_beast_desc')]只接受彻底#beast 投降#!。能否说服它进入平等的伙伴关系？"
 POD_golconda_journey.10.desc.2: "[Glossary('心兽','game_concept_beast_desc')]很是#beast 饥渴#!。心兽就是#beast 饥饿#!本身。\n\n但是，#beast 饥饿#!到底#italic 是#!什么？只是一种生存本能。提醒着这世上的每个生物需要#beast 进食#!。\n\n然而，心兽的要求远远超出了生存所需。有些地方不对劲。"
 POD_golconda_journey.10.desc.3: "[Glossary('心兽','game_concept_beast_desc')]冲动难抑。它不断地拉扯着我，要求我#beast 吸食#!我的廷臣、同辈、朋友，我所遇到的每个人，我所珍视的每个人。\n\n然而，它也很狡猾。在我的观察中，我看到了它有智慧的证据。所以它能提前计划。\n\n这引出了一个问题：它所有看似冲动的要求是否都是为了某种更大的目的服务？"
 POD_golconda_journey.10.option.a: "每个答案都会引出更多的问题。"
 POD_golconda_journey.10.option.a.success: "你对[Glossary('心兽','game_concept_beast_desc')]的理解有了突破。"
 POD_golconda_journey.11.t: "凝视深渊"
 POD_golconda_journey.11.desc: "这一次有所不同。\n\n当我坐下来沉思时，我变得非常放松。我的意识随着身体的感觉，血管中$pod_vitae$的流动而流转。突然，我注意到了它。\n\n就像是最微小的一针灼热的痛楚。一种模糊的疼痛漂浮在我心脏的血液中。\n\n它是……回忆？还有#beast 饥渴#!。\n\n我感到非常确定。这就是[Glossary('心兽','game_concept_beast_desc')]所驻扎的地方。如果我激发我的血液，我可以揭开它隐藏的一切。我终于可以面对它，直视它。"
 POD_golconda_journey.11.effect: "你解锁了欢息[journey|E]。"
 POD_golconda_journey.11.option.a: "问题是……我准备好了吗？"
 POD_golconda_journey.100.t: "送入深处"
 POD_golconda_journey.100.desc: "我最后一次锁上[ROOT.Char.Custom('PODDomicile')]的大门，回想着导致我来到这里的种种事件。\n\n"
 POD_golconda_journey.100.desc.compassion: "我无论做什么，我都努力看到他人的优点。我也努力将同样的同情心延伸给[Glossary('心兽','game_concept_beast_desc')]，但这并不容易。\n\n我能对#beast 盲目的饥渴#!展示慈悲吗？我越是试图理解它的动机，它就显得越是深不可测。\n\n我只能希望直面它将会引导我找到我所追寻的答案。"
 POD_golconda_journey.100.desc.selfreliance: "我早已认识到他人是不可信任的。这是世界的法则。天真会像阳光一样毁灭一位$pod_cainite$。\n\n在这件事中，没有人可以帮助我。如果我想直面[Glossary('心兽','game_concept_beast_desc')]，责任完全落在我身上。\n\n我知道我需要做什么，而且我有决心去做到。"
 POD_golconda_journey.100.option.a: "我伸展我的感知，送往内心深处……"
 POD_golconda_journey.101.t: "没有方向"
 POD_golconda_journey.101.desc: "痛苦。\n\n我陷入了一场喧嚣的旋涡，耳膜震耳欲聋的色彩环绕着我。刺耳的噪音在我的舌尖留下金属的余味。上下颠倒，颠倒上下。\n\n感官的攻击如同雪崩般袭来。恐慌开始蔓延。我要死了吗？\n\n我需要找到一种快速让自己稳定下来的方法。"
 POD_golconda_journey.101.option.a: "专注于身体感受。"
 POD_golconda_journey.101.option.b: "专注于愉悦回忆。"
 POD_golconda_journey.102.t: "漂浮"
 POD_golconda_journey.102.desc: "周围的混乱稍稍平静下来。形状重新排列，呈现出几何的秩序。就像无尽的镜子序列，我在其中看到了自己的重复倒影。\n\n它们就像是关于我过去的微观陈列。所有的欢乐和伤痛、自豪和遗憾、失望和宽慰的记忆。\n\n从这个距离看，它们显得如此微小和无足轻重。"
 POD_golconda_journey.102.option.a: "提醒我不要让俗事冲昏头脑。"
 POD_golconda_journey.102.option.b: "提醒我思考什么才是真正重要的。"
 POD_golconda_journey.103.t: "脚踏实地"
 POD_golconda_journey.103.desc: "幻象破碎，我发现自己置身于一条河谷之中。\n\n阳光明媚。我已经忘记了它的温暖。言语无法形容这种感受。\n\n一个男人站在河岸边。他弟弟的尸体躺在他面前，头部的伤口血流不止，倾泻入水中。\n\n这个男人的脸上一片空白。然而，一种强烈的共情涌上心头。我清楚地知道他的感受。"
 POD_golconda_journey.103.option.a: "内疚。"
 POD_golconda_journey.103.option.b: "困惑。"
 POD_golconda_journey.103.option.c: "不可估量的狂怒。"
 POD_golconda_journey.104.t: "事件视界"
 POD_golconda_journey.104.desc: "男人转过头看着我。他周围的景象开始旋转和溶解。整个世界都变成了一片翻滚的红色海洋。\n\n#beast;bold 饥渴。#!\n\n我终于明白了饥渴是什么。"
 POD_golconda_journey.104.desc.guilt: "那是他的内疚。\n\n他被贴上了罪人的标签，然而千年过去了，他没有得到任何真正的救赎机会。"
 POD_golconda_journey.104.desc.confusion: "那是他的困惑。\n\n他感到弱小，因为法则对他进行了改变，他疑惑着是否还有什么能让他再次感到强大的东西。"
 POD_golconda_journey.104.desc.rage: "那是他的愤怒。\n\n他曾经给予爱，却换来了千年的惩罚。"
 POD_golconda_journey.104.desc.end: "\n\n而我意识到——这些感受都不是我的。它们是他的，应该由他承担。\n\n然而，它们的重量即将将我淹没。"
 POD_golconda_journey.104.option.a.tt: "你将尽最后的努力避免血狂。"
 POD_golconda_journey.104.option.a.success: "你将对饥渴的理解更加深刻，从而获得[enlightenment|E]。"
 POD_golconda_journey.104.option.a.failure: "你成为了#beast 饥渴#!，而#beast 饥渴#!成为了你。"
 POD_golconda_journey.105.t: "浩恩永生"
 POD_golconda_journey.105.desc: "我醒来，现实从朦胧中退去，慢吞吞地回到我的视野里。\n\n我浑身都被$pod_vitae$所覆盖。一定是在我意识追寻幻境的时候从我的毛孔中渗出来的。\n\n这景象足以让任何$pod_cainite$陷入血狂之中。但我内心没有丝毫波动。没有内在的声音敦促我将其全部饮下。\n\n只有宁静。"
 POD_golconda_journey.105.option.a: "宁静……"
 POD_golconda_journey.106.t: "欢宴"
 POD_golconda_journey.106.desc: "我能看到的只有血。\n\n无处不在。滚沸、沸腾、咕噜咕噜的泡泡在招手。\n\n在我体内，在我周围。没有分离。没有对比，没有对决，只有#beast 投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投降，只有投#!"
 POD_golconda_journey.106.option.a: "#beast 投降#!"
 POD_golconda_journey.1000.option.b: "我放弃。"
 POD_golconda_journey.1000.option.b.tt: "你将彻底放弃[golconda|E]之道。"
 POD_golconda_journey.1001.t: "挫折"
 POD_golconda_journey.1001.desc: "#beast 我·就·知·道！我就知道！我就他妈知道。\n\n你就喜欢装高高在上是吧？你以为自己是什么圣人？你以为你·比·我·厉·害？那·就·再·想·想，傻·逼。\n\n我更喜欢你这样。屈服于你的冲动会让你更讨人喜欢。你应该养成习惯。#!"
 POD_golconda_journey.1001.option.a.tt: "你堕出了[golconda|E]之道，你在[GetTrait('golconda_seeker').GetName(GetNullCharacter)][trait|E]中的进度已被重置。"
 POD_golconda_journey.10.desc.4: "[Glossary('心兽','game_concept_beast_desc')]是#beast 诅咒#!。很多人会说是上帝本人或其他具有这种力量的实体所为，但细节并不重要。\n\n它永远不可信任，不可讨价还价，甚至不可胁迫。不管它是外来入侵者还是黑暗地倒影，都无关紧要，因为归根结底，它是一种考验。\n\n了解这个考验以及如何克服它，可能是一切的关键。"
 POD_golconda_journey.10.desc.5: "[Glossary('心兽','game_concept_beast_desc')]是原始的。曾经，人类是#beast 野蛮的#!，所有现代的“文明”装束都在笨拙地试图掩盖人类内在的固有的残暴野性。\n\n凡人不会像我们一样听到[Glossary('心兽','game_concept_beast_desc')]，但他们肯定能感受到它的影响，这也解释了他们世界的#beast 暴力#!。作为永恒停滞的生物，吸血鬼更接近这种原始状态，因此更清楚地听到了暴力的呼唤。\n\n浩恩永生也许是人类进化的真正下一步，可以最终抛弃人类诞生时的#beast 野蛮#!。"
 POD_golconda_journey.10.desc.6: "[Glossary('心兽','game_concept_beast_desc')]是我。许多人会对这种观念表示反对，但很少有人能否认它低语中的纯粹#beast 诱惑#!。如果不是一个人内心的黑暗倒影，又怎么会这样的#beast 诱惑#!呢？正如吸血鬼深知的，最好的诱惑者对他们的猎物了如指掌。\n\n然而，从这一认知中迈出步伐并非易事。一个人不可能简单地割舍掉自己的一部分而不在过程中失去很多，这就只剩下一个简单得可怕的办法。\n\n接受。\n\n我就是[Glossary('心兽','game_concept_beast_desc')]，[Glossary('心兽','game_concept_beast_desc')]就是我。"
 POD_golconda_journey.10.desc.7: "[Glossary('心兽','game_concept_beast_desc')]善于诱惑。就像伊甸园里的蛇一样，它提供诱人地承诺、简单的解决方案和轻松的逃避方式。而且，就像蛇一样，这些都是通向#beast 灭亡#!的道路。\n\n如果吸血鬼真的是某种圣经式诅咒，那就不可能有简单的解决办法，也不可能有神奇的力量来消除一切。\n\n答案只能是在漫长的自我赎罪的道路上，远离我们同类的兽性#beast 渴望#!。在这条孤独的道路上，只有一个同伴，[Glossary('心兽','game_concept_beast_desc')]试图让我们一步步堕落。我们只需拒绝它的诱惑。\n\n毕竟，夏娃只需要拒绝蛇的诱惑。"
 POD_golconda_journey.10.desc.8: "[Glossary('心兽','game_concept_beast_desc')]是普罗米修斯。他是使人类摆脱众神奴役的火焰使者，但也注定了人类一次又一次地自焚。它激发我的力量，粉碎我的敌人，保护我免受黑暗中的恐怖。\n\n但它也让我成为了一个怪物，一个奴役人类的神，一个为了自己变态的#beast 快感#!而迷惑人类，重复着永无止境的循环。也许要打破这个循环意味着简单地停止依赖它。\n\n但是，没有让我获得自由的#beast 力量#!，我又算什么呢？"
 POD_golconda_journey.10.desc.9: "[Glossary('心兽','game_concept_beast_desc')]是一种幻觉。是我们自己编造出来的，用来合理化对人类所#beast 释放#!的恐怖。浩恩永生的存在，以及传言中那些获得浩恩永生的血族可以摆脱它的事实，就证明了[Glossary('心兽','game_concept_beast_desc')]是一种深深根植于$pod_cainites$心灵中的传言，它已经成为一种独立的现实形态。\n\n我头脑中的声音，那种黑暗的喝血、杀戮、伤害的#beast 冲动#!，只不过是猎食者思维的碎片，只要有足够的意志力，就能够控制它们。"
 POD_golconda_journey.2000.toast.t: "指导结束"
 POD_golconda_journey.2000.toast.golconda: "[golconda_mentee.GetShortUIName]达成了[GetTrait('golconda').GetName(GetNullCharacter)]"
 POD_golconda_journey.2000.toast.insight: "[golconda_mentee.GetShortUINamePossessive]的见解超过了你"
 POD_golconda_journey.2001.t: "稳步教导"
 POD_golconda_journey.2001.desc: "距离我上次向[golconda_mentee.GetFirstNameNicknamed]传授一些关于[Glossary('心兽','game_concept_beast_desc')]的知识已经过去一年了。\n\n在这段时间里，[golconda_mentee.GetHerHis]的理解加深了，因此[golconda_mentee.GetHerHis]的思想再次向新知识敞开。"
 POD_golconda_journey.2001.option.a: "今夜我将教导[golconda_mentee.GetHerHim]，来年我还会这么做。"
 POD_golconda_journey.2001.option.a.tt: "一年后，你将再次教导[golconda_mentee.GetShortUIName]"
 POD_golconda_journey.2001.option.b: "我今夜将教导[golconda_mentee.GetHerHim]，但不会再进一步。"
 POD_golconda_journey.2001.option.b.tt: "你将停止对[golconda_mentee.GetShortUIName]的教导。"
 POD_golconda_journey.2001.option.c: "我将暂时停止对[golconda_mentee.GetHerHim]的教导。"
 POD_golconda_journey.2000.toast.invalid: "[golconda_mentee.GetShortUIName]无法再被指导"
 POD_golconda_journey.2001.desc.xp: "\n\n当前，[golconda_mentee.GetHerHis]的#TOOLTIP:GAME_TRAIT,golconda_seeker,[golconda_mentee.GetID] #L 见解#!#!为#V [golconda_mentee.MakeScope.ScriptValue('suspire_success_chance')]%#!。"
 POD_golconda_journey.2001.desc.end: "\n\n我应该决定是否继续教导[golconda_mentee.GetHerHim]。"
 POD_golconda_journey.2000.toast.lowinsight: "由于你的见解太低，你无法再指导他人。"
 POD_golconda_journey.105.option.b: "探索更深层的寂静"
 POD_golconda_journey.105.option.b.tt: "你重新变成了[GetTrait('mortal').GetName(GetNullCharacter)]，失去了所有的吸血鬼效应和能力。"
 POD_golconda_journey.107.t: "第二黎明"
 POD_golconda_journey.107.desc: "我剧烈地呕吐。\n\n每一口溅落在地板上的$pod_vitae$，都像是把我整个人从内到外翻了个遍。世界在旋转。往日的记忆在一根根地松脱，织成的画卷一丝丝断裂。我一阵又一阵地干呕。\n\n然后，一切结束了。\n\n我深吸一口气，又一口。#italic 死去的东西#! 不会呼吸，我好一会儿才反应过来。那个劫持了我身体的、自称“[ROOT.Char.GetFirstNameNoTooltip]”的饥渴，已被彻底驱逐。\n\n留下的，才是真正的我。一个脆弱、鲜活的存在。这值得吗？"
 POD_golconda_journey.107.option.a: "我的故事就此终结。"
 POD_golconda_journey.107.option.a.tt: "你变成了[GetTrait('mortal').GetName(GetNullCharacter)]，#N 游戏结束了#!。[THIS.Char.GetFirstName]离开$pod_wod$，过完了[THIS.Char.GetHerHis]平静的一生。"
 POD_golconda_journey.107.option.b: "我的故事在别处继续。"
 POD_golconda_journey.107.option.b.tt: "由于[THIS.Char.GetFirstName]变成了[GetTrait('mortal').GetName(GetNullCharacter)]，并被废黜，你将作为你的继承人[heir_tooltip.GetShortUIName]继续游戏。"
 POD_golconda_journey.107.option.c: "我的故事在此处继续。"
 POD_golconda_journey.107.option.c.tt: "你将会成为一位[GetFaithByKey('independenthunters').GetAdjective][GetTrait('supehunter').GetName(GetNullCharacter)]，并作为一位[unlanded|E][adventurer|E]带着新的[dynasty|E]继续游戏。如果他们视你的[splat|E]为敌对，你可能会失去你的[THIS.Char.Custom('PODCoterie')]或者配偶。"