l_simp_chinese:
 POD_sorcery_events.1000.t: "人性渐泯，兽性昭彰"
 POD_sorcery_events.1000.desc: "即便在原始魔艺之中，化身异兽的能力亦显得出众非凡。许多出没于暗夜的怪物都拥有变形之能，其中便包括那些真正的形变者。钻研形变之道的巫师模拟了其中的部分力量：他们先是改变自身的部分肢体，随后能以剧烈的方式转化整个肉身。\n\n你形变之道上的造诣已足以让你进一步完善你的野兽形态。"
 POD_sorcery_events.1000.a: "就这样吧。"
 POD_sorcery_events.1000.no_points: "你已凭当前的经验，将你的野兽形态磨炼至极境！"
 POD_sorcery_events.1000.claws: "$POD_shapeshift_bestial_form_claws_modifier$"
 POD_sorcery_events.1000.claws.upgrade: "你将升级[GetModifier('POD_shapeshift_bestial_form_claws_modifier').GetNameWithTooltip]至等级[SCOPE.GetValue('new_level')|0V]"
 POD_sorcery_events.1000.claws.buy: "你将把[GetModifier('POD_shapeshift_bestial_form_claws_modifier').GetNameWithTooltip]引入野兽形态"
