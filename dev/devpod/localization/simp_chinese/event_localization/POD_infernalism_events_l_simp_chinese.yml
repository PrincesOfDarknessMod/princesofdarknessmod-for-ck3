l_simp_chinese:
 POD_infernalism_events.1.t: "魔契仲裁者"
 POD_infernalism_events.1.desc: "$POD_splat_demon_plural$非常看重他们的[demonic_pacts|E]。虽然他们必须遵守契约的条款，但也会抓住任何对他们有利的漏洞或模糊条款。许多愚蠢的#TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L 崇魔者#!#!等到发现时已经太晚，他们本该更仔细地阅读那些用血写就的小字，而不是只看大字。"
 POD_infernalism_events.1.pact: "•与[EventWindowWidget.GetScope.sC('recipient').GetFirstNameNoTooltip]签订契约•"
 POD_infernalism_events.1.confirm: "以我灵魂换取力量。"
 POD_infernalism_events.1.a: "这对我无益。"