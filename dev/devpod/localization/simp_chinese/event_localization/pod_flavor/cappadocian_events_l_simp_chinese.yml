l_simp_chinese:
 podcappadocian.1.t: "莉莉丝的女儿们"
 podcappadocian.1.desc: "神秘的拉米亚血系主动与卡帕多西亚氏族连结在一起。莉莉丝的女儿们是一个难以理解的群体，但她们一直被证明很可靠又坚定，维护着她们很久以前与卡帕多西亚达成的交易：为知名的卡帕多西亚担任保镖。\n现在是你要求一位这样的同伴的时候了。通常的步骤是你向拉米亚女祭司提出要求，这样就会有一位年轻的成员被分配给你。一个更复杂的行动方案是坚持对过程提一些要求，这可能会惹恼拉米亚，但也会让你对谁将成为这潜在的终身伴侣有更多的控制。"
 podcappadocian.1.a: "女祭司，我相信你的判断。"
 podcappadocian.1.b: "我想在选择之前更多地了解莉莉丝的女儿们。"
 lamia_bodyguard_generic_tt: "一位年轻地拉米亚会被带你面前，大概率对战斗训练有素，但在其他方面并不出众。"
 lamia_bodyguard_specialized_tt: "你将获得更多选择，并有可能得到更好的候选人，但要付出威望作为代价。"
 podcappadocian.2.t: "最小的妹妹"
 podcappadocian.2.desc: "拉米亚神庙已经承认了你对保镖的请求，被选中的人最近已经到达，开始为你服务。没有什么惊喜，被派来的是一位相当年轻地拉米亚成员，她被教会了够用的剑术，但其他方面没有什么长处。不过，这些年轻地拉米亚的忠诚和干劲是传奇性的，她还有很多时间可以成长。\n在那之前，她正在等待你的命令。"
 podcappadocian.2.a: "一段富足的关系的开始。"
 podcappadocian.3.t: "莉莉丝之谜"
 podcappadocian.3.desc: "尽管她们与卡帕多西亚氏族关系密切，但拉米亚并不完全喜欢你窥探他们的神庙和信仰活动。不过，她们还是勉强接受教会你莉莉丝的三相：少女、母亲和老妪。每相都代表了女人生命中的不同部分，并被相应地庆祝。你的向导拒绝告诉你更多，拉米亚敦促你迅速选择一位同伴，然后让她们去做仪式。\n从你所收集到的信息来看，少女的女祭司应该很年轻漂亮，擅长外交。母亲的女祭司是主妇般的管理者，处理宗教的日常事务。最后，老妪的女祭司是老女巫，守护着莉莉丝的神圣仪式。"
 podcappadocian.3.a: "少女的女祭司"
 podcappadocian.3.b: "母亲的女祭司"
 podcappadocian.3.c: "老妪的女祭司"
 podcappadocian.4.t: "最小的姐妹"
 podcappadocian.4.desc: "你选择了一位少女的女祭司来陪伴你。她是一位美丽的、迷人的生物，她似乎很满意在可预见的未来和你在一起。她很善于交谈，但每次谈话都很快以将对自身奉献给莉莉丝将能得到的巨大快乐地赞美而告终。\n她是简单的，纯洁的，自由和美丽的，年轻少女的纯真通过她的一举一动传达出来。重回青春——至少在精神方面——总是一个诱人的前景……"
 podcappadocian.4.a: "让我们不要再谈论宗教了。"
 podcappadocian.4.b: "我觉得我被动摇了……"
 podcappadocian.5.t: "中间的姐妹"
 podcappadocian.5.desc: "你选择一位母亲的女祭司来陪伴你。母亲的仆人是强壮而专注的女性，她们容易接管周围人的职责和负担，往往让自己付出代价。她们是莉莉丝神圣的创造性本质的代表，在神话中经常被误解为“怪物之母”。母亲的仆人以最谨慎的态度对待她们的责任，很少看到她们不忙着调解少女们或照顾老妪们。"
 podcappadocian.6.t: "最老的姐妹"
 podcappadocian.6.desc: "你选择一位老妪的女祭司来陪伴你。作为莉莉丝密教中最令人畏惧的成员，老妪是莉莉丝禁忌知识的保存者。没有人真正知道莉莉丝派学识的范围，但即使是最顽固地挪得学者也会同意，莉莉丝在创世纪中的部分是那些事件中最神秘和最可怕的。\n老妪们不说话，但她们喜欢证明她们知道真相，不管它是什么，而她们令人不安的微笑承诺那些准备向黑暗之母效忠的人将获得更多的知识。"