l_simp_chinese:
 podgrandcity.01.t: "偿还代价"
 podgrandcity.01.desc: "巴黎的其他吸血鬼都知道你资助了睿魔尔秘所的扩建。在血族社会中，这种行为从不免费，你的臣民也心知肚明。\n睿魔尔向你呈上多件礼物。实际上，这些礼物是为了偿还欠你的债务。对他们而言，主动献上所有物总比等你索取他们没有的东西要好。"
 podgrandcity.01.option.a: "传授你的秘术"
 podgrandcity.01.option.b: "深化我的研究"
 podgrandcity.01.option.c: "展示石之力量"
 podgrandcity.01.tooltip: "学习制造[GetTrait('gargoyle').GetName(GetNullCharacter)]仆从\n\n@warning_icon! #N 你仍需掌握[GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]#!"
 podgrandcity.02.t: "梦庭教义"
 podgrandcity.02.desc: "在你的努力下，神庙大部重建完成。众多赛特之子于此密谋颂神，却有许多人莫名忘却初衷，沉溺享乐——或许这亦是令你感兴趣的崇拜形式。"
 podgrandcity.02.option.a: "肉体欢愉将解放我"
 podgrandcity.02.tooltip.a: "你的未来信仰将获得[GetDoctrine('tenet_carnal_exaltation').GetBaseName]"
 podgrandcity.02.option.b: "若不为纵欲，此物何存？"
 podgrandcity.02.tooltip.b: "你的未来信仰将获得[GetDoctrine('tenet_hedonistic').GetBaseName]"
 podgrandcity.02.option.c: "愈多愈欢！"
 podgrandcity.02.tooltip.c: "你的未来信仰将获得[GetDoctrine('tenet_ritual_celebrations').GetBaseName]"
 podgrandcity.03.t: "尘骨之廷教义"
 podgrandcity.03.desc: "这座神庙名副其实——在强大血魔法的作用下，除了尘与骨还能剩下什么？此处典籍记载着赛特的伟业与权能。知识宝库近在眼前，只待你攫取。"
 podgrandcity.03.option.a: "赛特即君王"
 podgrandcity.03.tooltip.a: "你的未来信仰将获得[GetDoctrine('tenet_ashen_faith').GetBaseName]"
 podgrandcity.03.option.b: "赛特即堤丰"
 podgrandcity.03.tooltip.b: "你的未来信仰将获得[GetDoctrine('tenet_sacred_shadows').GetBaseName]"
 podgrandcity.03.option.c: "赛特即胜利者"
 podgrandcity.03.tooltip.c: "你的未来信仰将获得[GetDoctrine('tenet_pursuit_of_power').GetBaseName]"
 podgrandcity.04.t: "鳄神神庙教义"
 podgrandcity.04.desc: "此地沉睡着赛特的眷子索贝克。传说赛特通过血腥仪式将魔克拉族扭曲为怪物。作为玛土撒拉与恶煞的双重存在，索贝克是当世最强大的生物之一。如今它以“饥渴”化身在此长眠。这份饥渴中蕴含着力量、混沌与杀戮。崇拜鳄神，或许就能获得这种力量。"
 podgrandcity.04.option.a: "饥渴是永恒的挣扎"
 podgrandcity.04.tooltip.a: "你的未来信仰将获得[GetDoctrine('tenet_struggle_submission').GetBaseName]"
 podgrandcity.04.option.b: "血祭方能平息嗜血渴望"
 podgrandcity.04.tooltip.b: "你的未来信仰将获得[GetDoctrine('tenet_gruesome_festivals').GetBaseName]"
 podgrandcity.04.option.c: ".狂怒可碎我枷锁"
 podgrandcity.04.tooltip.c: "你的未来信仰将获得[GetDoctrine('tenet_warmonger').GetBaseName]"
 podgrandcity.05.t: "新道显现"
 podgrandcity.05.desc: "三座神庙均已修复。你从中获得的知识让你对赛特崇拜有了全新认知。\n或许该让世人知晓？\n又或许该摒弃这些异端思想？"
 podgrandcity.05.option.a: "此为正道"
 podgrandcity.05.option.b: "有趣，但我道途不改"