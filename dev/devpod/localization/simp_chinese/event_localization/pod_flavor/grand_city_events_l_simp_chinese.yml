l_simp_chinese:
 podgrandcity.01.t: "偿还代价"
 podgrandcity.01.desc: "巴黎的其他吸血鬼都知道你资助了睿魔尔秘所的扩建。在血族社会中，这种行为从不免费，你的臣民也心知肚明。\n睿魔尔向你呈上多件礼物。实际上，这些礼物是为了偿还欠你的债务。对他们而言，主动献上所有物总比等你索取他们没有的东西要好。"
 podgrandcity.01.option.a: "传授你的秘术"
 podgrandcity.01.option.b: "深化我的研究"
 podgrandcity.01.option.c: "展示石之力量"
 podgrandcity.01.tooltip: "学习制造[GetTrait('gargoyle').GetName(GetNullCharacter)]仆从\n\n@warning_icon! #N 你仍需掌握[GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]#!"
 podgrandcity.100.t: "梦庭教义"
 podgrandcity.100.desc: "在你的努力下，神庙大部重建完成。众多赛特之子于此密谋颂神，却有许多人莫名忘却初衷，沉溺享乐——或许这亦是令你感兴趣的崇拜形式。"
 podgrandcity.100.option.a: "肉体欢愉将解放我"
 podgrandcity.100.tooltip.a: "你的未来信仰将获得[GetDoctrine('tenet_carnal_exaltation').GetBaseName]"
 podgrandcity.100.option.b: "若不为纵欲，此物何存？"
 podgrandcity.100.tooltip.b: "你的未来信仰将获得[GetDoctrine('tenet_hedonistic').GetBaseName]"
 podgrandcity.100.option.c: "多多益善!"
 podgrandcity.100.tooltip.c: "你的未来信仰将获得[GetDoctrine('tenet_ritual_celebrations').GetBaseName]"
 podgrandcity.101.t: "尘骨之廷教义"
 podgrandcity.101.desc: "这座神庙名副其实——在强大血魔法的作用下，除了尘与骨还能剩下什么？此处典籍记载着赛特的伟业与权能。知识宝库近在眼前，只待你攫取。"
 podgrandcity.101.option.a: "赛特即君王"
 podgrandcity.101.tooltip.a: "你的未来信仰将获得[GetDoctrine('tenet_ashen_faith').GetBaseName]"
 podgrandcity.101.option.b: "赛特即堤丰"
 podgrandcity.101.tooltip.b: "你的未来信仰将获得[GetDoctrine('tenet_sacred_shadows').GetBaseName]"
 podgrandcity.101.option.c: "赛特即胜利者"
 podgrandcity.101.tooltip.c: "你的未来信仰将获得[GetDoctrine('tenet_pursuit_of_power').GetBaseName]"
 podgrandcity.102.t: "鳄神神庙教义"
 podgrandcity.102.desc: "此地沉睡着赛特的眷子索贝克。传说赛特通过血腥仪式将莫科莱族扭曲为怪物。作为玛土撒拉与恶煞的双重存在，索贝克是当世最强大的生物之一。如今它以“饥渴”化身在此长眠。这份饥渴中蕴含着力量、混沌与杀戮。崇拜鳄神，或许就能获得这种力量。"
 podgrandcity.102.option.a: "饥渴是永恒的挣扎"
 podgrandcity.102.tooltip.a: "你的未来信仰将获得[GetDoctrine('tenet_struggle_submission').GetBaseName]"
 podgrandcity.102.option.b: "血祭方能平息嗜血渴望"
 podgrandcity.102.tooltip.b: "你的未来信仰将获得[GetDoctrine('tenet_gruesome_festivals').GetBaseName]"
 podgrandcity.102.option.c: ".狂怒可碎我枷锁"
 podgrandcity.102.tooltip.c: "你的未来信仰将获得[GetDoctrine('tenet_warmonger').GetBaseName]"
 podgrandcity.103.t: "新道显现"
 podgrandcity.103.desc: "三座神庙均已修复。你从中获得的知识让你对赛特崇拜有了全新认知。\n或许该让世人知晓？\n又或许该摒弃这些异端思想？"
 podgrandcity.103.option.a: "就该这么做"
 podgrandcity.103.option.b: "有趣，但我道途不改"
 podgrandcity.201.t: "巴格达的烈火"
 podgrandcity.201.desc: "没有哪座城市能够永恒。这一简单的真理，你们已知晓，但面对所发生的一切，你们仍毫无准备。巴格达的陷落，发生在整整一周的劫掠与杀戮之中，蒙古旭烈兀的军队横扫了这座曾是伊斯兰明珠的城市。或许有近百万人丧生，而因死亡带来的瘟疫，实际人数可能更多。巴格达图书馆的无数书籍被投入底格里斯河，河水因数量之巨而变为黑色。延续五百年的阿拔斯哈里发国就此崩塌，随之而去的是中东学术的中心。\n\n尽管超自然之物善于隐匿，这场屠杀与流血仍使许多人陷入疯狂，不止一人被胜利的蒙古人砍倒。\n\n如今，你统治着一座灰烬、跳蚤与死亡之城。"
 podgrandcity.201.option.a: "面对这样的破坏，我们能做些什么？"
 podgrandcity.201.tooltip.a: "巴格达已不再是昔日那座伟大的城市，也再也无法恢复到曾经的辉煌地位。但或许你仍能重建它。"
 podgrandcity.202.t: "巴格达康复"
 podgrandcity.203.t: "余烬重生"
 podgrandcity.203.desc: "尽管巴格达将永远带着那段历史的伤痕，但它挺立至今。这座城市在中东的重要地位虽已削弱，却依然是人们生活、求知与逝去之所。你的城市，你的珍宝，已不如往昔那般璀璨，但它设法存活了下来。或许，在你的影响之下，这场烈火中的重塑正是它恢复昔日辉煌、甚至超越过往所必需的。"
 podgrandcity.203.option.a: "古老都市的新篇章。"
 podgrandcity.203.tooltip.a: "新的故事，新的人民，同样的雄心壮志。"