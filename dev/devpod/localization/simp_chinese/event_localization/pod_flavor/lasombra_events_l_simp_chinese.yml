l_simp_chinese:
 pod_lasombraevents.1.n: "寻脸"
 pod_lasombraevents.1.desc: "脸。你在过去已经敏锐地意识到了它们。无论是凡人、吸血鬼还是一堆排列整齐的石头，所有东西都有一张脸。当然，也包括你。只是，跟你$pod_clan$所有人一样，你被诅咒再也见不着你的脸和你的身体。你有多久没有看到自己的倒影了？你到底有没有见过它？许久以前你还是个凡人……而当其他人第一次看到你时，他们有什么反应？他们是害怕，还是陶醉，还是在你背后笑？\n这些问题影响你太多了，现在是时候做点什么了。最直接的方法是聘请一位艺术家，让其为你画像。至少，这可能会减轻你的痛苦。"
 pod_lasombraevents.1.loverdesc: "脸。你在过去已经敏锐地意识到了它们。无论是凡人、吸血鬼还是一堆排列整齐的石头，所有东西都有一张脸。当然，也包括你。只是，跟你$pod_clan$所有人一样，你被诅咒再也见不着你的脸和你的身体。你有多久没有看到自己的倒影了？你到底有没有见过它？许久以前你还是个凡人……而当其他人第一次看到你时，他们有什么反应？他们是害怕，还是陶醉，还是在你背后笑？\n这些问题影响你太多了，现在是时候做点什么了。最直接的方法是聘请一位艺术家，让其为你画像。你也可以让你的爱人[helper.GetTitledFirstName]对你进行一个漂亮的描述，也许有用？"
 pod_lasombraevents.1.a: "我需要一幅画像……"
 pod_lasombraevents.1.b: "我不需要它。"
 pod_lasombraevents.1.c: "呵！我不需要！"
 pod_lasombraevents.1.d: "我会寻求帮助。"
 pod_lasombraevents.1.a.t: "你雇佣了一名艺术家来为你画像。"
 pod_lasombraevents.1.b.t: "你有更重要的事需要花钱"
 pod_lasombraevents.1.b.beast: "#beast 你不需要任何东西。你有我。#!"
 pod_lasombraevents.1.c.t: "你总是看起来不错。"
 pod_lasombraevents.1.d.t: "而你会得到帮助。"
 POD_courts_blood_interaction: "请愿吸榨制裁"
 POD_courts_blood_interaction_desc: "向血之法庭请愿，说明为什么该角色应该从勒森魃的保护中被移除，并追捕其的灵魂。"
 courts_blood_tooltip: "如果你赢了，吸榨该角色就不会再花费虔诚。如果你没有胜诉，你很可能为亡生立了一个敌人。"
 POD_asdiqa_al_lail_interaction: "请愿吸榨制裁"
 POD_asdiqa_al_lail_interaction_desc: "向莱尔之友请愿，说明为什么该角色应该从勒森魃的保护中被移除，并追捕其的灵魂。"
 POD_amis_noirs_interaction: "请愿吸榨制裁"
 pod_lasombraevents.2.n: "新案例？"
 pod_lasombraevents.2.desc: "血之法庭是勒森魃$pod_clan$的司法机构。这些匿名的长者可以被要求对与整个氏族有关的各种问题进行审判。但这些长者的时间很宝贵，所以血之法庭通常只为最严重的案件而开庭，即受制裁的$pod_diablerie$。\n勒森魃氏族重视对权力的渴望，并为确保每个子孙都配得上这种权力感到自豪。因此，任何勒森魃认为另一个勒森魃不配活着时，都有权向法院提出请求，他们的血液最好用于赋予另一个人权力。\n毫不奇怪，这样的案例经常是传奇性对抗的开始，并且总是引起激烈的争议。"
 pod_lasombraevents.2.a: "继续审理此案。"
 pod_lasombraevents.2.b: "转念一想……"
 pod_lasombraevents.3.n: "开庭"
 pod_lasombraevents.3.desc: "血之法庭的开庭是一件奇怪的事情。笼罩在黑暗中的看不见的法官，他们的声音也被掩盖了，给人一种非常不真实的感觉。不过，风险比戏剧性的想象要高得多。\n你和辩护人已被传唤到法庭，现在是你们两个人说服长者相信你们各自价值的时候了。你知道，当所有的事情都说出来后，法院并不真正关心事情的真相。他们只是想确保勒森魃的血只给有价值的人，所以这个过程的最终目标是证明你比你的对手更有野心、更无情、更有价值。"
 pod_lasombraevents.3.a: "尊敬的法官们……"
 pod_lasombraevents.3.effect.success.desc: "你很有说服力。"
 pod_lasombraevents.3.critical.failure.effect.desc: "你没有说服力。"
 pod_lasombraevents.4.n: "贪赃枉法"
 pod_lasombraevents.4.desc: "虽然血之法庭的法官是匿名的，但暗夜之友，即统治勒森魃氏族的长者组织，却不是。在每个主要城市找到一个他们的代表是比较容易的，如果只是为了开始正式请愿的话。\n这些中间人很少是美德的典范，很容易被贿赂，以确保一些证据突然出现在法官面前（或在某些情况下从未出现）。这其实是一个公开的秘密，狡猾的勒森魃被期望拥有进行这种“事业”的手段。毕竟，财富是衡量你价值的一种方式。"
 pod_lasombraevents.4.a: "明智的捐赠。"
 pod_lasombraevents.4.b: "我不需要这就能赢。"
 won_round_court_blood_tt: "血之法庭的案件进展对你有利。"
 pod_lasombraevents.5.n: "街区正义"
 pod_lasombraevents.5.desc: "在勒森魃$pod_clan$的战争和正义中，一切都很公平。你正试图结束一个勒森魃同胞的亡生，而他们正想尽一切办法生存下去，并使法庭对他们有利。雇佣一帮当地的暴徒在法庭休庭期间对你动粗是他们最后的努力。\n这是个绝望的尝试，你并没有真正的危险。但你能不能直接地打发这些害虫，这将反映在整体判决上。毕竟，勒森魃应该远远高于这些琐碎的问题，并能轻易地显示他们对凡人的优势。"
 pod_lasombraevents.5.a: "你针对了错误的勒森魃。"
 pod_lasombraevents.5.effect.success.desc: "完美!"
 pod_lasombraevents.5.critical.failure.effect.desc: "皮洛士式的胜利。"
 pod_lasombraevents.6.n: "虔诚的表现"
 pod_lasombraevents.6.desc: "勒森魃氏族重视信念。在许多方面，他们是一个有信仰的氏族，对这个领域的任何新的凡人创新都要加以坚持，以创造他们自己的扭曲对应。到了晚上，只要你能充分展示出令人信服的信仰，你遵循什么样的信仰并不重要。\n为了动摇法官，证明你是一个有价值的勒森魃后裔，表现出虔诚也许是个不错的选择。"
 pod_lasombraevents.6.a: "我可以实现奇迹。"
 pod_lasombraevents.7.n: "展示力量"
 pod_lasombraevents.7.desc: "勒森魃是极端的社会攀比者。他们的氏族文化迫使他们的成员总是试图在每一个可能的领域超越对方。通常情况下，这导致只有最无情和最有能力的勒森魃才有能力领导，但有时也会导致那些有很多影响力的浮夸的傻瓜被提升到超出他们的才能范围。\n在这次庭审中，你可能值得参与一些政治活动，炫耀你的成就，贬低你的对手的成就。"
 pod_lasombraevents.7.a: "你知道吗，我……"
 pod_lasombraevents.8.n: "就我们两个人"
 pod_lasombraevents.8.desc: "在这次的血之法庭上，你的对手采取了进攻性的立场。他们并不试图为自己的指控辩护，而是攻击你的成就并诋毁你毫无瑕疵的品格。这是一种相当有效的策略，因为法庭的长者们珍视氏族的力量胜过一切，如果你让他们相信你比受害者地位低下，那么你的大部分案子都将瓦解。\n现在是时候回应这些指控并争取法官的支持了。"
 pod_lasombraevents.8.a: "我没有弱点!"
 pod_lasombraevents.8.effect.success.desc: "我真棒。"
 pod_lasombraevents.8.critical.failure.effect.desc: "我犯了一些错误。"
 pod_lasombraevents.10.n: "异议！"
 pod_lasombraevents.10.desc: "血之法庭已经做出了最后的裁决，对你来说不是一个好的裁决。你的对手被发现是一个有价值的勒森魃，而你的指控并没有足够的说服力来动摇长者们。这将对你产生不好的影响，而且你现在有一个可能是持久的敌人，不会忘记你对其的诉讼。\n正义确实是盲目的，或者至少目前对你不友好。"
 pod_lasombraevents.10.a: "很明显，其贿赂了法官！"
 sentenced_court_blood_modifier: "被血之法庭判刑"
 sentenced_court_blood_modifier_desc: "这勒森魃已经被血之法庭认定为不合格。就他们的氏族而言，他们现在是正当的吸榨游戏目标。"
 pod_lasombraevents.11.n: "审判与成功"
 pod_lasombraevents.11.desc: "血之法庭已经做出了最终裁决，对你来说是个好的裁决。你的对手被发现是不合格的，不配用伟大的勒森魃的血，而你的指责也足以让长者们信服。这将对你产生良好的影响，而你现在有了一个被逼入绝境的敌人，可以正式开始“夺回血液”了。\n正义真正得到了伸张。"
 pod_lasombraevents.11.a: "我爱我们的司法制度。"
 victory_court_blood_tt: "你的对手现在将在30年内拥有一个负面修正。在这段时间里，对其进行$pod_diablerie$不会花费任何虔诚，也不会被视为谋杀。"
 end_lasombra_cw_tt: "勒森魃内战结束。请愿吸榨制裁[character_interaction|E]现在可用于所有勒森魃，而不仅仅是你所属的内战阵营。"
 pod_lasombraevents.12.n: "暗影之氏族的内部运作"
 pod_lasombraevents.12.desc: "勒森魃氏族在一个无情的社会爬升体系中茁壮增长，只有最优秀的人才能成为这个庄严世系的一员。暗夜之友是一个秘密的长者机构，他们的任务是确保没有不配的人能够长期继承勒森魃的血液。为此，他们成立了“血之法庭”，这是一个司法机构，允许任何人向他们请愿，要求允许他们对另一个已被证明不配的勒森魃进行可怕的$pod_diablerie$。\n目前的勒森魃内战使法庭在[Glossary('阿什拉派','game_concept_ashirra_desc')]和忠诚派之间产生了分歧，双方都不承认对方的权威。\n#X 作为勒森魃，你可以对任何其他内战中属于你这边的勒森魃使用请愿吸榨制裁。如果内战结束，法庭将再次拥有对所有勒森魃的权威。#!"
 pod_lasombraevents.12.a: "我将激励勒森魃氏族走向它的天命。"
 pod_lasombraevents.12.b: "也许我可以加入他们……"
 member_amici_noctis_tt: "你的角色已经是暗夜之友的一部分，你可能会被要求在未来做出有关该氏族的重要决定。"
 not_member_amici_noctis_tt: "你的角色不是暗夜之友的一部分，可能以后会被要求加入，这取决于威望和权力。"
 pod_lasombraevents.20.n: "阴暗提议"
 pod_lasombraevents.20.desc: "最近有一个神秘的人找到你，对你进行了奇怪的询问。这本应是一个令人担忧的事件，但对你来说却是一个期待之源。事实上，众所周知，神秘的暗夜之友，勒森魃氏族的长者组织，就是通过这种方式开始招募的。\n其他的你都知道了。如果你表现出兴趣，你将被封在一个坟墓里几个晚上，以便你可以在没有干扰的情况下“与黑暗交流”。然后，你将被带到一个匿名的长者团体面前，他们将正式要求你加入暗夜之友。\n总而言之，这只算是个过场，哪怕这很给压力，真正的筛选过程发生在绑架之前，所以，只要你参与传统，你就能加入。"
 pod_lasombraevents.20.a: "我已经准备好加入你们了。"
 pod_lasombraevents.20.b: "这个腐朽的组织并不适合我。"
 join_amici_noctis_tt: "加入暗夜之友可能为你提供新的机会，以促进勒森魃氏族的议程。"
 end_amici_noctis_tt: "这是一个一次性的提议。你将不能今后再加入暗夜之友。"
 pod_lasombraevents.15.n: "你是法律吗？"
 pod_lasombraevents.15.desc: "作为暗夜之友的成员，你被要求不时地参加血之法庭的工作。这并不是一个危险的过程，因为法官们总是以匿名的方式来避免报复，但它可能是一个乏味的过程。\n今晚的案子是两个不重要的勒森魃之间的小案子。如果你只是随机挑选一个判决，没有人会责怪你，但勒森魃氏族的理想可能要求你仍然对即使是最无聊的案件给予充分关注。"
 pod_lasombraevents.15.a: "法庭正在开庭。"
 pod_lasombraevents.15.b: "法庭正在开庭……"
 pod_lasombraevents.16.n: "阴暗贪污"
 pod_lasombraevents.16.desc: "暗夜之友可能是一个由强大的长者组成的阴暗组织，它仍然有运行成本。它的多个派员和代表希望得到工作报酬，而且确保血之法庭期间法官的旅行安全也不便宜。因此，他们欢迎“捐赠”，通常是由雄心勃勃的年轻勒森魃向整个$pod_clan$炫耀他们的财富。\n最近你收到了这样一笔捐款，是时候把它放入暗夜之友的库房了……还是？"
 pod_lasombraevents.16.a: "氏族优先。"
 pod_lasombraevents.16.b: "钱消失了！"
 pod_lasombraevents.17.n: "寻找朋友"
 pod_lasombraevents.17.desc: "暗夜之友将自己隐藏起来，不为人知。在他们看来，这是一个必要的预防措施，以避免被氏族的敌人盯上，并能够在血之法庭上公正地判断问题。\n然而，对于勒森魃氏族的年轻成员来说，这可能被视为懦弱和软弱的证明，多年来，许多人试图揭开他们的身份。最近，一个这样的团体正在取得令人担忧的进展，你必须采取行动。仅仅惩罚主要犯罪者可能就足够了，但揭发他的所有同伙会发出更有力的信息。"
 pod_lasombraevents.17.a: "我们将惩罚他们所有人。"
 pod_lasombraevents.17.b: "一个罪魁祸首就够了。"
 pod_lasombraevents.17.effect.success.desc: "他们都被找到了。"
 pod_lasombraevents.17.critical.failure.effect.desc: "他们逃脱了……"
 pod_lasombraevents.18.n: "黑夜里的朋友"
 pod_lasombraevents.18.desc: "暗夜之友是一个强大的组织，它煽动着勒森魃$pod_clan$朝着他们神秘的目标前进。但除了政治上的重要性外，他们也是著名的幽暗术大师，勒森魃的标志性力量。即使是那些在进入社会之前没有掌握这种能力的罕见的暗夜之友，也会很快学会掌握这种能力，这也是对他们新职位的期望。"
 pod_lasombraevents.18.a: "我是暗影大师，正如其所应当。"
 pod_lasombraevents.18.b: "我仍然必须更多地了解幽暗术。"
 pod_lasombraevents.18.c: "我必须尽快努力学习它。"
 pod_lasombraevents.19.n: "抢功"
 pod_lasombraevents.19.desc: "暗夜之友处理许多对勒森魃$pod_clan$的威胁，无论是内部还是外部。一个这样的威胁出现在你的地区，该组织迅速表示支持，并为你提供了果断处理的手段。\n你的法庭正在赞扬这一完美的胜利，现在是你揭示暗夜之友在这件事上的重要帮助的时候了，以促进氏族的团结……或者你可以只荣耀自己，而掩盖他们的参与。"
 pod_lasombraevents.19.a: "是，我很棒。"
 pod_lasombraevents.19.b: "我得到了帮助。"