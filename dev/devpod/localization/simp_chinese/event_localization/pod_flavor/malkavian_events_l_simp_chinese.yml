l_simp_chinese:
 podmalkavian.1.t: "疯网：瘟疫新娘"
 podmalkavian.1.desc: "末卡维疯网是三位凌驾于他人之上的灵体居民的家园。有些人甚至会说，如果这些加冕者，末卡维本人的孩子，如果在物质世界中死亡，也将在这里生存。\n瘟疫新娘就是其中之一。第一城的圣殿娼妓是在末卡维发疯时安慰他的人，许多末卡维氏族人在困难时期都向她求助。她会时常出现，卸下你的精神重担，但总要付出代价，治愈现在的精神疾病，也会埋下未来疯狂的种子。"
 podmalkavian.1.a: "将来太遥远，不值得关心。"
 podmalkavian.1.b: "我过得很好!"
 podmalkavian.2.t: "疯网：聪慧亲王"
 podmalkavian.2.desc: "末卡维疯网是三位凌驾于他人之上的灵体居民的家园。有些人甚至会说，如果这些加冕者，末卡维本人的孩子，如果在物质世界中死亡，也将在这里生存。\n聪慧亲王就是其中之一。当他的欺骗针对一个人的敌人时，他会是一个有用的盟友，但吸引他的注意力确实是一种不幸的命运。因为你永远无法知道他最终会站在哪一边。"
 podmalkavian.2.a: "我需要领先一步!"
 random_scheme_exposed_tt: "如果存在任何针对你的随机敌对计谋，它将被揭露……"
 random_scheme_exposed_tt2: "……或者你的敌对计谋将会被揭露给目标。"
 podmalkavian.3.t: "疯网：无名者"
 podmalkavian.3.desc: "末卡维疯网是三位凌驾于他人之上的灵体居民的家园。有些人甚至会说，如果这些加冕者，末卡维本人的孩子，如果在物质世界中死亡，也将在这里生存。\n无名者就是其中之一。一个有着贪婪的（生理和灵性）食欲的生物，如果他足够饿，他会吃掉你的一切，从你的烦恼到你的名字。呼唤他可能会让人忘记一些吸血鬼亡生中最痛苦的经历，但总是要付出代价的。"
 podmalkavian.3.a: "幸福而无知地等待。"
 podmalkavian.4.t: "疯网：大疑问"
 podmalkavian.4.desc: "梅塔特隆、上帝之口、连接、蜘网、末卡维的神经、巴别、织布机、军团思想、生命之树……疯网的名字几乎和其中的末卡维一样多，但是，到了黑夜，没有人真正知道它是什么。\n对于许多末卡维来说，它甚至不需要解释，它就是这样。但是有一些好奇的人想知道更多，并在它的灵性范围内穿梭，希望有一天晚上能找到一个解决方案。你是其中之一吗？"
 podmalkavian.4.a: "我需要一个答案!"
 podmalkavian.4.b: "它真的是这样。"
 podmalkavian.5.t: "疯网：双子"
 podmalkavian.5.desc: "在末卡维氏族中有一个不为人知的传言，那就是有一个名叫玛拉基的失落[Glossary('上古耆宿','game_concept_antediluvian_desc')]存在。有人说她是末卡维本人的双胞胎，而且令人担忧的是，她可能比她哥哥更加危险和疯狂。在对这个传言的一些解释中，很久以前两人之间的被迫分离是导致你们氏族先祖精神分裂的原因。\n不管是真是假，你有时能在疯网中感受到一种牵引力，接近某人，哄骗你放弃所有的烦恼，最终找到远离不死族的残酷政治的平静。可以肯定的是，这是一个诱人的提议……"
 podmalkavian.5.a: "终得安宁？"
 podmalkavian.5.b: "我有工作要做!"
 podmalkavian.6.t: "疯网：父"
 podmalkavian.6.desc: "许多人认为，末卡维，你们氏族的创始人，至少与疯网有关系。也许他把它作为一个间谍网络，或者作为一种保证控制你们灵魂的方式，甚至也许这个网络实际上是末卡维破碎的心灵在他的后代身上表现出来并试图重建自己！没有人知道，而且很可能没有人会知道，直到末卡维（如果他真的与此有关）揭示真相。\n但是，这并不妨碍好奇的人们去寻找真相。然而，过多地涉足这精神上的疯狂的最远端可能会有一些严重的缺陷。"
 podmalkavian.6.b: "有时候，不知情会更好。"
 podmalkavian.7.t: "疯网：转瞬即逝的个性"
 podmalkavian.7.desc: "疯网，首先是末卡维的集体心智，以某种方式联系在一起。对于那些深入其中的人来说，它可以迅速成为一种过强的感觉，危及到穿梭者的自我意识。然而，对于那些愿意冒险的人来说，在这个界域里可以找到整个氏族的知识积累。"
 podmalkavian.7.a: "我能看到一切！"
 podmalkavian.7.b: "我已经够完整了，谢谢。"
 podmalkavian.8.t: "疯网：过往之梦"
 podmalkavian.8.desc: "疯网附满了回忆。非常古老的吸血鬼在这，他们看到了很多东西。有些人甚至说，即使是死去的吸血鬼的记忆也能在这里保留一段时间。这些碎片中的大多数都谈到了末卡维氏族的一个更好的时代，那时他们被尊重为预言家和先知，并为最伟大的皇帝提供建议。\n每个末卡维都有自己的火花，以实现这一古老的伟大。但是激活它需要很多的努力。"
 podmalkavian.8.a: "我想看到未来!"
 podmalkavian.8.b: "活在当下似乎更安全。"
 podmalkavian.9.t: "疯网：未来之梦"
 podmalkavian.9.desc: "末卡维氏族充满了预言家和先知。预言的性质就是这样，它们是出了名的难以解释，但是，很少有人能真正瞥见未来的景象。在你最近一次进入氏族集体意识的旅行中，你得到了这样一个祝福。虽然你不记得具体细节，但你能感觉到一种新的力量试图在你体内觉醒，这力量在未来几十年甚至几个世纪里对你的同胞们来说将变得至关重要。"
 podmalkavian.9.a: "我必须掌握这个。"
 podmalkavian.10.t: "疯网：疯子与天才"
 podmalkavian.10.desc: "末卡维比其他氏族更多地徘徊在疯狂和天才之间的界线上。他们的洞察力受到任何明智的亲王的追求，但也因其不可靠因素而令人惧怕。就连末卡维自己大部分时候也无法理解两者的区别。\n深入疯网中的氏族集体意识，会将这两个相反的特性加剧到极端。一个血位可能会带着新的、有洞察力的人生观回来……或成为一位疯狂嗜血的疯子。"
 podmalkavian.10.a: "我会越界吗？"