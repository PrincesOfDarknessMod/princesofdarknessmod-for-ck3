l_simp_chinese:
 pod_vampire_flavor.1000.t: "追忆阳光"
 pod_vampire_flavor.1000.desc: "一人在初拥后怀念什么是令人惊讶的。你发现自己想念阳光。你试图记住世界在晴朗的日子里的样子，有蓝色的天空和明亮的浮云。这些小快乐真的是你永远无法企及的吗？"
 pod_vampire_flavor.1000.a: "我会请一位画师"
 pod_vampire_flavor.1000.b: "若我附身动物，我应该能看到太阳。"
 pod_vampire_flavor.1000.c: "只一瞥应该无妨……"
 pod_vampire_flavor.1000.d: "控制住自己！你是血族！表现得像样一点！"
 pod_vampire_flavor.1001.t: "追忆阳光"
 pod_vampire_flavor.1001.desc: "艺术家揭开了他的画作，供大家欣赏。这幅画描绘了阳光明媚的日子里当地美丽的风景。当你看到这幅画时，你会感觉到你真的在外面的阳光下！这幅画是你的收藏作品。委托这幅杰作提高了你的声誉，这是额外的收益。"
 pod_vampire_flavor.1001.a: "这正是我想要的。"
 pod_mass.100.t:0 "血仆，血仆到处都是！"
 pod_mass.100.desc:0 "有人指责你将自己的鲜血喂给了许多当地人，用血仆士兵来充当你的战争机器，而这是该隐诫律和许多心路都避之唯恐不及的。这也被大多数认为是严重破坏潜藏的行为，因为如此多的血仆是很难隐藏的。\n您的回应是什么？"
 pod_mass.100.a:0 "找些人来掩盖这事。"
 POD_massregnant_event_repeat.tt:0 "若你仍拥有[POD_ghoul_maa|E]军团，此事件将在未来再次触发。"
 pod_mass.100.b:0 "这是真事，怎样？"
 pod_mass.200.t:0 "吸血鬼，吸血鬼到处都是！"
 pod_mass.200.desc:0 "有人指责你将自己的鲜血喂给了许多当地人，用新生吸血鬼士兵来充当你的战争机器，而这是该隐诫律和许多心路都避之唯恐不及的。这也被大多数认为是严重破坏潜藏的行为，因为如此多的吸血鬼是很难隐藏的。\n你的回应是什么？"
 pod_mass.200.a:0 "找些人来掩盖这事。"
 POD_masssire_event_repeat.tt:0 "若你仍拥有吸血鬼[men_at_arms|E]军团，此事件将在未来再次触发。"
 pod_mass.200.b:0 "这是真事，怎样？"