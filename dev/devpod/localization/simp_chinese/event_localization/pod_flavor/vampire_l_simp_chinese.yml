l_simp_chinese:
 pod_vampire_flavor.1000.t: "追忆阳光"
 pod_vampire_flavor.1000.desc: "一人在初拥后怀念什么是令人惊讶的。你发现自己想念阳光。你试图记住世界在晴朗的日子里的样子，有蓝色的天空和明亮的浮云。这些小快乐真的是你永远无法企及的吗？"
 pod_vampire_flavor.1000.a: "我会请一位画师"
 pod_vampire_flavor.1000.b: "若我附身动物，我应该能看到太阳。"
 pod_vampire_flavor.1000.c: "只一瞥应该无妨……"
 pod_vampire_flavor.1000.d: "控制住自己！你是血族！表现得像样一点！"
 pod_vampire_flavor.1001.t: "追忆阳光"
 pod_vampire_flavor.1001.desc: "艺术家揭开了他的画作，供大家欣赏。这幅画描绘了阳光明媚的日子里当地美丽的风景。当你看到这幅画时，你会感觉到你真的在外面的阳光下！这幅画是你的收藏作品。委托这幅杰作提高了你的声誉，这是额外的收益。"
 pod_vampire_flavor.1001.a: "这正是我想要的。"
 trait_bomkazi_witch: "邦卡齐女巫"
 trait_bomkazi_witch_desc: "由魔蛇鹫培养的凡人生命女巫。邦卡齐血液中蕴藏着生命魔法的火花，她们既是其不死伴侣的精神同伴，也是生命能量的来源。"
 trait_bomkazi_witch_character_desc: "[ROOT.Char.GetFirstNameNoTooltip|U]乘载邦卡齐生命女巫的全部力量，经由古老的仪式培养，作为魔蛇鹫的伴侣。"
 trait_bomkazi_apprentice: "邦卡齐学徒"
 trait_bomkazi_apprentice_desc: "一个拥有一定生命魔法潜能但尚未育成的凡人。与真正的邦卡齐女巫相比，其血液中的力量显得微弱。"
 trait_bomkazi_apprentice_character_desc: "[ROOT.Char.GetFirstNameNoTooltip|U]表露出生命魔法天赋的迹象，虽然其力量还未完全体现。邦卡齐传统的学徒。"
 artifact_shewstone_name: "示现石"
 artifact_shewstone_description: "一块祝圣的光滑石头，上面以鸟血涂抹。亡灵会低语名字在石头上之人的秘密。"
 artifact_nightmare_drums_name: "梦魇之鼓"
 artifact_nightmare_drums_description: "用人皮人骨制作的鼓。生者听不到鼓声，但能驱使亡灵在敌人的梦中折磨。"
 artifact_witch_eye_name: "巫眼"
 artifact_witch_eye_description: "来自不眠者尸体上的附魔眼球，移植在亡灵术士自己的眼眶。以可怕的代价换取永恒的死亡之视。"
 imp_requires_cenotaph_path_tt: "要求碑之道知识#italic ([GetPerk('ns_a_touch_of_death_perk').GetName(GetPlayer)][perk|E])#!"
 imp_requires_haunting_path_3_tt: "要求作祟之道等级3#italic ([GetPerk('ns_harrowing_perk').GetName(GetPlayer)][perk|E])#!"
 artifact_shewstone_modifier: "示现石"
 artifact_shewstone_modifier_desc: "亡灵低语其秘密"
 artifact_nightmare_drums_modifier: "梦魇之鼓"
 artifact_nightmare_drums_modifier_desc: "死者服从梦魇之鼓无声的召唤。"
 artifact_witch_eye_modifier: "巫眼"
 artifact_witch_eye_modifier_desc: "死者之眼见生者所不能见。"
 imp_witch_eye_scarred_modifier: "巫眼伤痕"
 imp_witch_eye_scarred_modifier_desc: "巫眼仪式所需的自残行为会留下永久性的伤痕。"
 POD_impundulu.1001.t: "招唤邦卡齐"
 POD_impundulu.1001.desc: "我们与邦卡齐女巫之间古老契约需要更新。我们必须找到一位新的伴侣──血管中流淌着生命魔法火花，一位既能与我们并肩前行，又能滋养我们的伴侣。\n\n搜寻工作需要时间和精力，但如果没有像邦卡齐这样的人在我们身边，我们就会被削弱。"
 POD_impundulu.1001.a: "立即开始搜查。"
 POD_impundulu.1001.b: "时机未到。"
 POD_impundulu.1001.c: "我不需要女巫。"
 POD_impundulu_bomkazi_start_cultivation_tt: "你将搜寻一名有着生命魔法潜能的凡人来栽培成邦卡齐伴侣。"
 POD_impundulu_bomkazi_delay_cultivation_tt: "你将在20‑40年间被再次提醒。"
 POD_impundulu_bomkazi_refuse_cultivation_tt: "你拒绝培养，死生之契弱化了。"
 POD_impundulu.1002.t: "天赋的型态"
 POD_impundulu.1002.desc: "我们究竟在寻求何种形式的邦卡齐？生命魔法在每个承载其种子的人身上展现的方式各不相同。有些人透过智慧和学习来引导，有些人则依靠身体自身的韧性，而极少数人则能洞悉迷障之后的景象。\n\n搜寻必须以我们的需求为导向。"
 POD_impundulu.1002.a: "寻找学者──一位才思敏捷者。"
 POD_impundulu.1002.b: "寻找医者──其触能弥合血肉。"
 POD_impundulu.1002.c: "寻找先知──能窥视迷障之外。"
 POD_impundulu_bomkazi_seek_scholar_tt: "栽培偏向智性学识，你的搜寻将需5到15年。"
 POD_impundulu_bomkazi_seek_healer_tt: "栽培偏向健康韧性，你的搜寻将需5到15年。"
 POD_impundulu_bomkazi_seek_seer_tt: "栽培偏向灵视直觉，你的搜寻将需5到15年。"
 POD_impundulu.1004.t: "找到一名邦卡齐"
 POD_impundulu.1004.desc: "搜索已有结果。一位年轻的[bomkazi_candidate.Custom('WomanManGirlBoy')]立于我们面前，[bomkazi_candidate.GetHerHis]的血液中吟唱着古老的力量。[bomkazi_candidate.GetSheHe|U]已历经试炼与训练，生命魔法在其血脉中真实流淌。\n\n[bomkazi_candidate.GetSheHe|U]将成为我们的同伴，我们与生者世界的锚点。盟社永存。"
 POD_impundulu.1004.a: "欢迎你，盟誓之地的[Select_CString( bomkazi_candidate.IsFemale, '姐妹', '兄弟' )]。"
 POD_impundulu_bomkazi_witch_arrives_tt: "一位完全驯化的邦卡齐巫师加入你的宫廷，成为你的朋友和同伴。"
 POD_impundulu.1005.t: "学徒的承诺"
 POD_impundulu.1005.desc: "候选人很有潜力，但[bomkazi_candidate.GetHerHim]体内的生命魔法却黯淡无光——本应是熊熊烈火，如今却只剩摇曳烛光。[bomkazi_candidate.GetSheHe|U]可以作为邦卡齐学徒，学习古老之道，尽管[bomkazi_candidate.GetSheHe]或许永远无法达到昔日巫师的全部力量。\n\n总算是聊胜于无。或许也只能如此了。"
 POD_impundulu.1005.a: "[bomkazi_candidate.GetSheHe|U]将随时间成长。欢迎[bomkazi_candidate.GetHerHim]。"
 POD_impundulu.1005.b: "不够好。我会等。"
 POD_impundulu_bomkazi_apprentice_arrives_tt: "一位邦卡齐学徒加入了你的宫廷。[bomkazi_candidate.GetHerHis|U]的力量比完整的邦卡齐巫师要弱"
 POD_impundulu.1006.t: "搜索受挫"
 POD_impundulu.1006.desc: "多年的搜寻一无所获。每一个接受测试的候选人，每一个被检验的凡人——都没有足够强大的生命魔法火花可供培养。邦卡齐血系随着每一代人而日渐稀薄。\n\n或许下一次搜寻会有更好的结果。又或者，古老之物确实在消亡。"
 POD_impundulu.1006.a: "我们再试一次，正如盟社所要求。"
 POD_impundulu.1006.b: "邦卡齐的血脉正在衰落……"
 POD_impundulu.3001.t: "示现石仪式"
 POD_impundulu.3001.desc: "石头被打磨光滑，安放于墓穴之上。我们以鸟血描绘欲守护之人的名讳。诸灵骚动，如飞蛾扑火般被这石头吸引。\n\n仪式祭礼完成时，石头在掌中发出微弱的嗡鸣。无论被铭刻者去向何方，低语都将如影随形。"
 POD_impundulu.3001.a: "死者无所不见，如今我亦可为。"
 POD_impundulu_shewstone_crafted_tt: "你制作了一块示现石。它能提供谋略和计谋发现加成。"
 POD_impundulu.3002.t: "恐惧之鼓"
 POD_impundulu.3002.desc: "人皮覆骨，鼓槌以绞刑犯肋骨雕成。敲击之时，生者之耳不闻其声——但死者能听见，并遵从号令。\n\n缚于鼓中的诸灵将把噩梦送入我们指定的任何沉睡者梦中。"
 POD_impundulu.3002.a: "让生者知晓亡者的恐惧。"
 POD_impundulu_nightmare_drums_crafted_tt: "你已制作出梦魇之鼓。其能提高恐怖值并提升阴谋强度。"
 POD_impundulu.3003.t: "视力的代价"
 POD_impundulu.3003.desc: "尸体的眼睛已经备好——浸透了墓穴之土，刻满了死亡符文，灌注了我们全部的亡灵学识。现在，最艰难的部分来了。\n\n我们以稳健的手势剜出自己的眼珠，将那死者的眼球填入眼眶。剧痛超乎想象。然后——我们看见了一切。诸灵，徘徊的亡者，每个活人面孔后隐藏的谎言。\n\n世界将永不复旧观。"
 POD_impundulu.3003.a: "代价偿已，视界归一。"
 POD_impundulu_witch_eye_crafted_tt: "你植入了巫眼。它提供了亡灵术和计谋发现加成，但会永久改变你的外貌。"
 POD_impundulu.1.t: "血脉稀薄"
 POD_impundulu.1.desc: "你的邦卡齐带来了令人不安的消息。年轻一代的凡人女巫所展现的天赋远不如其母亲。曾经在她们血系中燃烧的生命魔法正在减弱，正如风中残烛。\n\n每过十年，展现出天赋的候选者就越少。维系着我们——维系了我们数个世纪的盟社——或许正在消亡。"
 POD_impundulu.1.a: "这让我非常困扰。我们必须找到解决办法。"
 POD_impundulu.1.b: "我绝不会让盟社消亡，只要我还在。"
 POD_impundulu.1.c: "邦卡齐将继续延续，一如既往。"
 POD_impundulu.2.t: "邦卡齐之逝"
 POD_impundulu.2.desc: "邦卡齐巫师死了。维系我们生命、将我们锚定于现世的生命魔法已然黯淡无光。\n\n古老仪式要求我们引导其灵魂穿越世界间的通道。这是我们对那些付出一切者最起码的回报。"
 POD_impundulu.2.a: "我会主持葬礼仪式，正如盟社所要求。"
 POD_impundulu.2.b: "我默默哀悼。逝者自有其道。"
 POD_impundulu.3.t: "死灵法师的提议"
 POD_impundulu.3.desc: "我们听闻了一位死亡学者——[imp_necromancer_contact.GetFirstNameNicknamed]的消息，其亡灵术与我们有所不同。[imp_necromancer_contact.GetSheHe|U]对我们魔蛇鹫独有的碑之道和作崇之道很感兴趣。\n\n或许交流知识能让双方都受益。"
 POD_impundulu.3.a: "我应接触他们。知识即力量。"
 POD_impundulu.3.b: "我还没准备好进行这样的交换。"
 POD_impundulu_necromancer_offer_hint_tt: "与该角色可能可以进行“交流死灵学识”互动。"
 POD_impundulu.4.t: "缔造者之殇"
 POD_impundulu.4.desc: "夜深人静时，一段记忆不由自主地浮现——邦卡齐，第一位女巫之妻。她的面容。她的声音。那个将我们联结在一起的仪式，生者与死者，共同缔结了一个双方都未能完全理解的盟社。\n\n她拒绝了初拥。她选择了凡人之躯，选择了衰老凋零，而我们却始终不变。然而她留了下来。直到最后一刻。\n\n岁月流逝，却未能磨灭这份悲伤。或许，永远也不能。"
 POD_impundulu.4.a: "我记得你，邦卡齐。我会永远记得。"
 POD_impundulu.4.b: "悲伤已成为伴侣，不好受却熟悉。"
 POD_hideout_clan.0002.t: "低语之声"
 POD_hideout_clan.0002.desc: "The mirrors in your Oracle's Chamber have begun to fog of their own accord. Images form and dissolve; a face you recognize, a conversation you were never part of, a truth that someone believed was safely buried.\n\nThe Madness Network delivers its gifts unbidden, and the price of Malkav's sight is that you cannot close your eyes."
 POD_hideout_clan.0002.a: "镜子不会撒谎。让我看看一切。"
 POD_hideout_clan.0002.b: "有些真相，还是留在黑暗中为好。"
 POD_hideout_clan.0002.c: "今夜悄无声息。无可探寻的秘密。"
 POD_hideout_clan_0001_no_target_tt: "No suitable targets with unknown secrets were found."
 POD_hideout_clan.0010.t: "一个旅人伫立于门槛之前"
 POD_hideout_clan.0010.desc: "Word of your Jati Refuge has reached the road-courts. A fellow Charlatan stands at your threshold, weary from travel and bearing the signs of a particular caste. The ancient obligation of Ravnos hospitality demands an answer.\n\nThe traditions of the jati are clear: shelter given freely is repaid tenfold. Shelter refused is remembered forever."
 POD_hideout_clan.0010.a: "Welcome them. Offer shelter and sustenance."
 POD_hideout_clan.0010.b: "Turn them away. This is not a waystation."
 POD_hideout_clan.0011.t: "The Phuri Dae's Wisdom"
 POD_hideout_clan.0011.desc: "The elder carries themselves with the quiet authority of the Phuri Dae; the wise ones whose counsel shapes the road-courts of the Ravnos. They speak of old debts and older friendships, and their presence lends weight to your authority among both Cainite and kine.\n\nFor five years, their blessing will mark your domain as a place of wisdom and just rule."
 POD_hideout_clan.0011.a: "Their wisdom honors my house."
 POD_hideout_clan.0012.t: "刹帝利之刃"
 POD_hideout_clan.0012.desc: "一个行走在路上的刹帝利。满身伤痕，警惕而敏锐，行动间带着久经沙场战士的蓄势待发，其经历过的伏击数不胜数。作为换取安身之所的回报，他们将传授来之不易的战斗与战术心得。\n\n五年之内，你的军队将带着路的智慧作战。"
 POD_hideout_clan.0012.a: "好好休息吧。你的剑令我的炉火生辉。"
 POD_hideout_clan.0013.t: "吠舍商队"
 POD_hideout_clan.0013.desc: "一名吠舍商人带着来自远方的货物抵达；香料、织物，还有比这两者更有价值的情报。他们提供优惠的条件，并分享他们的人脉网络，以换取一夜的庇护。\n\n五年之内，你的金库将因这条商路的贸易而获益。"
 POD_hideout_clan.0013.a: "贸易是道路的血液。欢迎。"
 POD_hideout_clan.0014.t: "The Sybarite's Whisper"
 POD_hideout_clan.0014.desc: "A Sybarite — quick-fingered, silver-tongued, and radiating the easy charm of someone who has talked their way out of more trouble than most Cainites ever encounter. Over strong wine and whispered confidences, they share tricks of misdirection and manipulation.\n\nFor five years, your schemes will benefit from the Sybarite's craft."
 POD_hideout_clan.0014.a: "Tell me everything. I have the stomach for it."
 POD_hideout_clan.0015.t: "婆罗门的祝福"
 POD_hideout_clan.0015.desc: "A Brahmin of the road-faith arrives, bearing the marks of long pilgrimage. They speak of the Road of Paradox with a conviction that borders on the prophetic, and their blessings carry the weight of genuine belief.\n\nFor five years, the faithful will look upon you with greater reverence."
 POD_hideout_clan.0015.a: "Walk the road in peace, holy one."