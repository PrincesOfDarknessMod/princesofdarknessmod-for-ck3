l_simp_chinese:
 setite_faith_corruption_decision:0 "传扬赛特的福音"
 setite_faith_corruption_decision_tooltip:1 "赛特总是需要更多忠诚的信徒。"
 setite_faith_corruption_decision_desc:0 "赛特的密教被认为是一种隐蔽的力量，能够渗透到任何宗教中，并将其宗旨扭曲成为赞美赛特的荣耀。"
 setite_faith_corruption_decision_effect_tooltip:0 "The Pillars of Set special doctrine will be added to the religion, making its practitioners righteous with (and towards) the various other Setite cults."
 setite_faith_corruption_decision_confirm:0 "让我们一起赞美赛特！"
 setite_corrupt_sites:0 "你需要控制三个或更多属于一个还未拥有赛特支柱教义的吸血鬼宗教的圣地。"
 podsetite.1.t:0 "信仰之氏族"
 podsetite.1.desc:0 "The Followers of Set are as much a religion as they are a proper [Clan|E]. They see every vampire worshiping Set as part of their community, although those directly descended from him are still the most favored.\nThe Setites have perfected the art of infiltrating and corrupting (or \"liberating\") other religions and cults, slowly unveiling the mysteries of Set to them before fully bringing them into the fold. This is by far their greatest weapon, and many would be conquerors of Egypt found themselves welcomed, then enthralled into the cult instead of directly resisting them.\nIn this age of Crusades and religious fervor, the Setites are looking abroad at all these poor souls despairing for their heretical gods' approval. And they see opportunities aplenty."
 podsetite.1.a:0 "Welcome to the Serpent's Garden."
 setite_intro_tt:0 "As long as you stay of a Setite faith, you have access to a decision to syncretize any religion you control three or more holy sites with the Cult of Set."
 podsetite.2.t:0 "蛇之拥吮"
 podsetite.2.desc:0 "it starts slowly. The hint of a deep mystery teased to some important figures of the targeted faith, the fostering of decadence and self gratification, the slow spread of more \"liberating\" ideas to the practitioners.\nThen it cascades. The revelation that all mysteries (including their own) lead to Set. The acceptance that the world is a prison built by Ra and his Aeons, and everything they though true was a lie. Then, finally, the zeal of the new convert, eager to show the truth to their fellow brethren.\nAnd before you know it, this whole faith is now only an useful facade for Set's cult. As all should be, until the grand night of liberation."
 special_doctrine_set_corrupted_kindred_name:0 "赛特密教"
 special_doctrine_set_corrupted_kindred_desc:0 "This faith, while keeping the facade of its earlier days, has been thoroughly infiltrated by the Cult of Set."
 corrupted_set_name:0 "赛特密教"
 doctrine_parameter_hostility_override_special_doctrine_set_corrupted_kindred:0 "Other Kindred [faiths|E] that have the Cult of Set doctrine are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_hostile_tooltippable$"