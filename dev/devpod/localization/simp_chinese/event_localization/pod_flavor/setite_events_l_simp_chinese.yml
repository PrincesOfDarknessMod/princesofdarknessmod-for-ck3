l_simp_chinese:
 setite_faith_corruption_decision:0 "传扬赛特的福音"
 setite_faith_corruption_decision_tooltip:1 "赛特总是需要更多忠诚的信徒。"
 setite_faith_corruption_decision_desc:0 "赛特的密教被认为是一种隐蔽的力量，能够渗透到任何宗教中，并将其宗旨扭曲成为赞美赛特的荣耀。"
 setite_faith_corruption_decision_effect_tooltip:0 "赛特支柱特殊教义将被添加到该宗教中，使其信徒与其他各种赛特教派互相视为正义。"
 setite_faith_corruption_decision_confirm:0 "让我们一起赞美赛特！"
 setite_corrupt_sites:0 "你需要控制三个或更多属于一个还未拥有赛特支柱教义的吸血鬼宗教的圣地。"
 podsetite.1.t:0 "信仰之氏族"
 podsetite.1.desc:0 "赛特信徒作为[Clan|E]，更像是宗教。他们把每一位崇拜赛特的吸血鬼都看作是他们群体的一部分，尽管那些直接来自塞特的后裔仍然是最受青睐的。\n赛特之子已经完善了渗透和腐化（或“解放”）其他宗教和密教的技艺，慢慢地揭开赛特的奥秘，直到将他们完全带入他们的阵营。这是迄今为止他们最大的武器，许多埃及的征服者发现自己受到了欢迎，然后被劝入密教，而没能直接对抗他们。\n在这个充满十字军与宗教狂热的时代，赛特之子正关注着所有这些绝望地寻求他们的异端神明认可的可怜灵魂。而且他们看到了大量的机遇。"
 podsetite.1.a:0 "欢迎来到蛇之花园。"
 setite_intro_tt:0 "只要你持有赛特之子信仰，你就可以使用让你控有三个或更多的圣地的信仰与赛特密教进行协同的决议。"
 podsetite.2.t:0 "蛇之拥吮"
 podsetite.2.desc:0 "它开始得很慢。对目标信仰重要人物的深层神秘的暗示，对颓废和自满的培养，更多对信徒的缓慢“解放”思想传播。\n然后层层递进。揭示出所有的奥秘（包括他们自己的奥秘）都通向赛特。接受世界是由拉神和他的移涌建造的监狱，而他们认为现实的一切是谎言。之后，终于，新的皈依者的热情，将用于向他们的同胞展示真相。\n在你得知之前，这整个信仰已经只是赛特密教的一个有用的门面。一切都该如此，直到盛大的解放之夜。"
 special_doctrine_set_corrupted_kindred_name:0 "赛特密教"
 special_doctrine_set_corrupted_kindred_desc:0 "该信仰虽然保持着原本表象，但内部已经被赛特密教彻底渗透。"
 corrupted_set_name:0 "赛特密教"
 doctrine_parameter_hostility_override_special_doctrine_set_corrupted_kindred:0 "拥有赛特密教教义的其他血族[faiths|E]被视为[GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]而非$hostility_hostile_tooltippable$"