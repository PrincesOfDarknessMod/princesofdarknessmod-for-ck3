l_simp_chinese:
 podgiovanni.1.t: "家人最懂"
 podgiovanni.1.desc: "虽然相对于身为神秘的威尼斯亡灵术师的卑微开头，他们的视野已经大大扩展，但乔凡尼首先仍然是一个家族。许多人认为这仍然是他们最大的优势，有能力在任何时候依靠一个强大的、关系良好的家庭是一种奢侈，其他人只能梦想。\n自从他们进入吸血鬼世界以来，乔凡尼仍然密切关注着他们的凡人亲属，在向真正有资格的人提供$pod_Embrace$之前，精心培养他们成为伟大的人。然而，有一些乔凡尼不屑于这种做法，他们专门从家族以外的地方挑选未来的子嗣，而让他们的凡人亲属听天由命。\n作为一个受人尊敬的乔凡尼，现在是时候表明你对这个传统的立场了。"
 podgiovanni.1.a: "我已经盯上了几个潜在对象……"
 podgiovanni.1.b: "一个值得尊敬的传统，但我暂时不需要它。"
 podgiovanni.1.c: "不要打扰家人。"
 start_giovanni_content_tt: "你将被呈现出几个选项，以概述你对乔凡尼子嗣的偏好。一旦找到一个合适的候选人，你将会收到通知。"
 delayed_start_giovanni_content_tt: "在大约20至40年后，你将再次为下一代凡人乔凡尼的前景进行选择。"
 end_giovanni_content_tt: "你将永远不会再进行这选择。"
 podgiovanni.2.t: "乔凡尼的子女们"
 podgiovanni.2.desc: "虽然从他们早期作为罗马商人家族开始就非常重男轻女，但乔凡尼家族很快就了解了吸血鬼的一个真理：女性很容易与男性平等。这种心态的突然转变对家族的女儿们来说是一个福音，她们发现自己和她们的兄弟一样受到重视，因为她们可以为乔凡尼家族带来潜力。有些人甚至把她们放在比男性同辈更重要的位置上，因为许多人都很想证明这种新发现的赞赏是有道理的。另一些人则很难从他们陈旧的凡人思维中走出来，他们会很自然地倾向于年轻的乔凡尼男子。\n但最终，这里没有错误的选择。"
 podgiovanni.2.a: "儿子……"
 podgiovanni.2.b: "或女儿。"
 giovanni_content_risks_increase_tt: "你要求的越多，在与其他竞争者的竞争中确保你的前景就越困难，而且可能代价高昂。"
 podgiovanni.3.t: "家族容貌"
 podgiovanni.3.desc: "他们的罗马传承使乔凡尼对自己的良好基因感到相当自豪。他们首先认为自己是罗马沦陷后半岛上唯一没有被野蛮人污染的居民，然后认为自己是古典罗马的完美和现代意大利的美丽的完美结合，他们一直重视（并利用）大自然赋予他们的东西。然而，尽管他们大胆地宣称，并没有真正的证据表明家族在容貌方面比其他人更有气质，因此，真正显示出这种夸耀的身材的家族子弟特别受到追捧，成为乔凡尼的不朽典范。"
 podgiovanni.3.a: "只有阿波罗下凡才行！"
 podgiovanni.3.b: "我可以用几乎完美的方式来处理。"
 podgiovanni.3.c: "一些优雅的曲线永远不会伤害任何人。"
 podgiovanni.3.d: "美貌没那么值"
 podgiovanni.4.t: "家族智商"
 podgiovanni.4.desc: "比起体力或美貌，乔凡尼家族更重视智力。作为意大利的商人和秘密亡灵术师，几个世纪以来，他们很快就明白，他们的成员如果太笨，不知道什么时候不要对陌生人谈论家族，就会成为一个真正有威胁的累赘。因此，如果你不表现出至少适度的聪明才智，你将很快被贬为家族的打手，或者更糟糕的是，被贬到边缘。\n这是凡人家族中最著名的“潜规则”之一，雄心勃勃的人很快就会试图通过在遥远的土地上熟练的商业或精明的外交的伟大壮举来超越对方，以吸引他们不死族赞助的目光。"
 podgiovanni.4.a: "我想要最好的。"
 podgiovanni.4.b: "熟练，但不完美。"
 podgiovanni.4.c: "至少聪明到足以让人感兴趣。"
 podgiovanni.4.d: "这个特定的前景不需要高等智力。"
 podgiovanni.5.t: "家族肌肉"
 podgiovanni.5.desc: "在历史上，家族总是需要武力，无论是为了保护其辛苦赚来的资产，还是“夺取”一些竞争对手的资产。在乔凡尼家族存在的早期，与罗塞里尼家族的冲突凸显了这一关键需求，并一直延续到现在。几位雄心勃勃的长者提出了关于创建某种“分家”的建议，该家族将只关注此类身体事务，从而确保适当的乔凡尼子孙可以继续从事更高层次的追求，但到目前为止，它还没有显示出结果。因此，家族中强大而健壮的儿子和女儿受到那些希望在能力组合中增加一些蛮力的人的尊敬和追捧。"
 podgiovanni.5.a: "要完美的身体才行。"
 podgiovanni.5.b: "坚强和持久。"
 podgiovanni.5.c: "坚实的体魄总是很有帮助。"
 podgiovanni.5.d: "没有这个必要。"
 podgiovanni.6.t: "搜寻开始"
 podgiovanni.6.desc: "你已经把你的要求告诉了家族，现在唯一要做的就是等待。如你所知，凡人的生死速度快得有趣，但即使是他们也需要几十年才能开始变得有用。如果你要求的是非常具体的人，可能需要很长时间才能让乔凡尼家族产生这样的人。"
 podgiovanni.6.a: "时间在我这边。"
 giovanni_wait_time_tt: "你要求的越多，在合适的候选人出现之前需要的时间就越长。"
 podgiovanni.8.t: "值得考虑的候选人？"
 podgiovanni.8.desc: "乔凡尼凡人家族的一个子孙终于被带到了你的面前，以满足你目前的要求。你利用你积累的家族威望，确保你是第一个能够评估他们能力的人。这个人渴望服务，很高兴被选为乔凡尼家族真正权力的合格候选人，但是，最终，你将如何对待他们，取决于你，也只有你。"
 podgiovanni.8.a: "不要让我失望。"
 giovanni_content_end_tt: "你的一些威望已被移除，以“支付”确保这个候选人所需的影响力。\n要求另一个潜在子嗣的选项将在数十年后呈现给你。"
 podgiovanni.9.t: "家族琐事"
 podgiovanni.9.desc: "由于你正在监测各种可能符合你要求的潜在凡人乔凡尼，你很遗憾地不得不比平时更多地参与家庭事务。这不是乔凡尼生活中最诱人的部分，因为对某个大伯父对另一个大表哥所做的事情的琐碎破事在这里真的永远不会消失。坦率地说，这很无聊，但你至少要努力保持兴趣，如果你想让家人保持对你的好感，而不是破坏你的未来前景，众所周知，那些经常“错过”家庭团聚的人就会这样。"
 podgiovanni.9.a: "找个借口。"
 podgiovanni.9.b: "我会去的……"
 podgiovanni.9.c: "我有更重要的事情要处理!"
 giovanni_head_tt: "作为一家之主有其好处……"
 podgiovanni.10.t: "家族宿命"
 podgiovanni.10.desc: "一个有前途的家族子弟引起了你的注意，可能是你的命中注定。然而，他们还很年轻，因此，在一些重要的里程碑上仍然很容易失败。你并不期待干等下一个有能力的候选人，你现在考虑明确为这个年轻人铺设伟大的道路。\n利用你辛苦赚来的影响力，你可以确保其上最好的意大利大学和乔凡尼家能负担得起的最好的私人教师。这当然应该帮助其实现其潜力。"
 podgiovanni.10.a: "就这么办。"
 podgiovanni.10.b: "他们能自己解决问题。"
 podgiovanni.10.c: "家族有许多待定的恩惠，可以用于此。"
 giovanni_adopt_boosted_tt: "你的候选人将在他们的青春时代结束时属性+3。"
 podgiovanni.11.t: "家族决斗"
 podgiovanni.11.desc: "近来的意大利城镇中，击剑和决斗非常流行。虽然这主要是贵族传统，但贵商之间的界限在意大利常常模糊不清，因此许多年轻的乔凡尼都热衷于这项致命的艺术。你督察的其中一名有前途的年轻人热衷于这项爱好，并且已经证明自己在这方面非常有能力。这让你思考是否应该在这条道路上进一步推动他们，比如聘请私教等。毕竟一个致命的剑客除了文化沙龙方面，在战场也能成为不容小觑的力量。"
 podgiovanni.11.a: "就这么办。"
 podgiovanni.11.b: "没这个必要。"
 podgiovanni.11.c: "家族有数位随叫随到的大师级决斗者。"
 giovanni_adopt_blademaster_tt: "你的候选人将在他们的青春时代结束时获得刀剑大师特质。"
 podgiovanni.12.t: "家族谋划"
 podgiovanni.12.desc: "意大利城邦将阴谋诡计提升到了艺术级的高度，当时一些最伟大的艺术作品都是在“颂扬”半岛上臭名昭著的背信弃义者和野心勃勃的贵族和商人。乔凡尼青年在这种环境中出生和长大，还有一个附加的注意事项，那就是作为不死族的亡灵术师家族的一员，将无情发挥到极致。因此，迟钝和懒惰的人往往在达到不死族的注意之前就被熨平了，被他们更有野心的同龄人击溃。尽管如此，在斗篷和匕首的游戏中，真正的卓越需要训练和专业知识，因此你正在考虑为你未来的门徒准备一些“测试”，希望在这个过程中能给其一些宝贵的经验。"
 podgiovanni.12.a: "就这么办。"
 podgiovanni.12.b: "没这个必要。"
 podgiovanni.12.c: "家族可以提供许多“有趣”的测试。"
 giovanni_adopt_schemer_tt: "你的候选人将在他们的青春时代结束时获得阴谋家特质。"
 podgiovanni.13.t: "家族术法"
 podgiovanni.13.desc: "在他们重生为吸血鬼之前，乔凡尼家族被称为精通的亡灵术师。不过，他们从来没有像睿魔尔那样认为自己是“真正的法师”，他们更擅长于他们所谓的“线性魔法”，一种非常规范和结构化的意志运作形式，使他们能够缓慢但稳定地提高他们对亡灵术法的掌握程度，但从未真正扩展到其他魔法领域的专长。\n在今夜，家族中的一些年轻人仍然生来就具有使用这线性魔法的能力，并且被整个家族高度珍视。然而，这些被选中的少数人越来越稀少，显然推动了家族在其存在的某个时刻完全过渡到亡灵术血术法。然而，在那之前，这种有天赋的年轻乔凡尼是未来的尊长们所追求的最高奖励。"
 podgiovanni.13.a: "我需要这样的人才！"
 podgiovanni.13.b: "没这个必要。"
 podgiovanni.13.c: "家族不能拒绝我。"
 giovanni_adopt_sorcerer_tt: "你的候选人将在他们的青春时代结束时获得术士特质。"