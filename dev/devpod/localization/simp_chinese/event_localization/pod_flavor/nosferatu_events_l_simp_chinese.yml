l_simp_chinese:
 podnosferatu.1.t: "黑暗中的恐怖"
 podnosferatu.1.desc: "诺斯费拉图氏族受到双重诅咒。首个诅咒在他们身上明显可见，但第二个则显得隐蔽。\n该$pod_clan$的始祖雅斯米利亚德认为，只有杀死他的整个世系才能得到该隐的宽恕。为此，他创建了一小群狂热的子嗣，统称为尼克图库。尼克图库的唯一目的是尽可能多地杀死诺斯费拉图，而他们在这方面相当有效率。\n因此，诺斯费拉图过着恐惧和偏执的生活，总是惴惴不安，希望著名的怪谈不会出现并准备结束他们的性命。"
 podnosferatu.1.a: "他们抓不到我！"
 nosferatu_intro_tt: "也许尼克图库在未来会干涉你的亡生。也可能不会。谁知道呢？"
 nictuku_well_prepared_modifier: "尼克图库大妄"
 nictuku_well_prepared_modifier_desc: "他们来了。他们要来了!"
 nictuku_well_prepared_tt: "如果真的发生什么事，你会有一定的准备。"
 nictuku_prepared_modifier: "尼克图库大妄"
 nictuku_prepared_modifier_desc: "我们应该做好准备，希望如此。"
 nictuku_prepared_tt: "如果真的发生什么事，你会有一定的准备。"
 podnosferatu.3.t: "黑暗中的恐怖：死亡迷雾"
 podnosferatu.3.desc: "人们报告说，你们地区的失踪事件突然增加，且无法解释。这似乎与天气有关，突如其来的浓雾使旅行特别困难。\n你的诺斯费拉图同伴开始窃窃私语，说可怕的尼克图库奥巴瑟可能就在附近，因为他被称为“迷雾之主”。你的那些比较冷静的廷臣只是把责任归咎于狼族的惯常攻击，而对任何真正的担忧置之不理。"
 podnosferatu.3.a: "把所有的东西都挡起来！"
 podnosferatu.3.b: "让我们……谨慎点"
 podnosferatu.3.c: "童话与怪谈"
 podnosferatu.30.t: "黑暗中的恐怖：奥巴瑟"
 podnosferatu.30.desc: "你所在地区周围的神秘失踪事件仍在继续，而且迷雾还没有散去。你最信任的派员现在成了目标，越来越多的人怀疑尼克图库确实在跟踪你，在去杀人之前慢慢地清除他们道路上的任何障碍。\n然而，你还没有完蛋，现在知道了情况的危险性，你可以重新组织你的资产，希望能把这个古老恐怖留在过往。\n或者你可以直接逃跑，躲在某个洞里。"
 podnosferatu.30.a: "我可以智取他们。"
 podnosferatu.30.effect.success.desc: "他们放弃了！"
 podnosferatu.30.critical.failure.effect.desc: "为什么我的王座间里有雾？"
 podnosferatu.4.t: "黑暗中的恐怖：憎恶？"
 podnosferatu.4.desc: "你的领地里的凡人报告说他们越来越多地看到了他们所描述的“魔邪憎恶”。这个突如其来的、在你看来无法解释的事件导致许多潜在的猎人涌向这个地区。\n你的大多数廷臣认为，这仅仅是由于一些下落不明的吸血鬼（或其他生物）的一些松懈行为，但你的诺斯费拉图同伴却不那么自信，他们分享说，将凡人鞭打入疯狂是尼克图库阿匝则耳的一种已知策略。他们主张更直接地控制局势，即使这意味着必须给一些凡人洗脑，从而使自己暂时暴露。"
 podnosferatu.4.a: "获得直接控制权"
 podnosferatu.40.t: "黑暗中的恐怖：阿匝则耳"
 podnosferatu.40.desc: "无数的猎人涌向你的领地，寻找人们报告的“憎恶”，已经有好几年了。他们中的很多人都无法忽视，而你的影响力也随着怀疑在整个地区的蔓延而逐渐瘫痪了。毋庸置疑，这是一个针对你的协同努力，可能是为了在杀人之前孤立你。\n你可以做最后一次尝试，以某种受人尊敬的教士权威的形象出现，向凡人解释这些“魔邪景象”。也许那时情况会自行解决。\n或者你可以直接跑开，低调行事，直到尼克图库放弃。"
 podnosferatu.40.a: "不需要惊慌！"
 podnosferatu.40.critical.failure.effect.desc: "我不是那些可憎之物中的一个！停下！"
 podnosferatu.5.t: "黑暗中的恐怖：死亡与腐烂"
 podnosferatu.5.desc: "凡人正在死亡。虽然这并不是一个新的现象，但最近在你的领地内死于疾病的人数之多让你感到担忧。你的廷臣们争辩说这是一场瘟疫，就像在这个时代经常遭受的那样，过一段时间就会消失。然而，你的诺斯费拉图同胞回答说，这场“瘟疫”似乎过于集中在你的地区，不可能是事实。他们讲述了腐烂之母尼克图库厄喀德那的故事，以及她所接近的任何东西都会腐化并碎裂成灰。他们的解决方案是非常严格地隔离受影响的地区，这可能有助于扰乱厄喀德那的行动，但也会使当地社区陷入瘫痪。"
 podnosferatu.5.a: "不要让凡人在我们的街道上徘徊。"
 podnosferatu.50.t: "黑暗中的恐怖：厄喀德那"
 podnosferatu.50.desc: "现在已经没有比拼了，可怕的尼克图库厄喀德那正在瞄准你。通过用她强大的腐化作用感染你的凡人，她已经确保将你与你的牧群和你在附近城镇的影响力隔离开来。很明显，她现在很快就会直接攻击你。\n但仍有时间来反击她的计划，因为旅行的治疗师已经开始尝试帮助当地的民众。如果你能成功地帮助和引导他们，厄喀德那孤立你的主要方法就会失败。"
 podnosferatu.50.a: "他们将得到他们需要的一切。"
 podnosferatu.50.critical.failure.effect.desc: "什么突然闻起来这么臭？"
 podnosferatu.6.t: "黑暗中的恐怖：影子战争"
 podnosferatu.6.desc: "最近有人一直在瞄准你的资产。这个对手，不管他是谁，一直在收买你有用的凡人联系人，甚至是一些吸血鬼，然后让他们来对付你。这还处于初级阶段，你有时间做出反应，但这可能要付出代价。\n你的廷臣们正在寻找谁可能是这个潜在的新对手，但你的诺斯费拉图同胞们正在低声谈论一个阴暗的人物，他用天使的伪装来欺骗和贿赂你的旧联系人。他们在讲尼克图库加约玛特，并警告你，这可能是他对你攻击的第一步。"
 podnosferatu.6.a: "更多的金钱将解决这个问题。"
 podnosferatu.60.t: "黑暗中的恐怖：加约玛特"
 podnosferatu.60.desc: "已经没有争论了：你正在被你的领域中一个看不见的人物巧妙地切断你的凡人联系和吸血鬼盟友。你所在地区的诺斯费拉图坚定地认为这是加约玛特的杰作，也就是迷人的尼克图库，而且他很快就会直接对你采取行动，因为你已经被孤立了。\n然而，现在仍有时间采取行动，你可以完全部署你的阴谋网，以确保你在受到攻击时仍有盟友可以求助。或者你可以逃跑，希望在为时已晚之前逃离。"
 podnosferatu.60.a: "我仍然有牌可打。"
 podnosferatu.60.critical.failure.effect.desc: "独自在黑暗中……"
 nictuku_knight_large_modifier: "尼克图库大妄"
 nictuku_knight_large_modifier_desc: "你的勇士们正忙着抓鬼。也许是字面意义上的鬼。"
 nictuku_knight_modifier: "尼克图库大妄"
 nictuku_knight_modifier_desc: "你的勇士们正忙着抓鬼。也许是字面意义上的鬼。"
 podnosferatu.7.t: "黑暗中的恐怖：游击战"
 podnosferatu.7.desc: "最近有人针对你的武装力量，你在军队中的一些凡人联系人被发现神秘死亡。即使是你工资单上的普通士兵也突然害怕为你工作，说有一个可怕的猎人专门捕杀那些与你合作的人。\n你的廷臣们正在谈论一个试图破坏你的潜在新对手，但你的诺斯费拉图同胞们并不相信。他们低声说起戈尔戈，黑暗中尖嚎之女，一位强大的尼克图库，以使用这种战术而闻名。他们敦促你使用你所掌握的一切可观的手段来拖住她。"
 podnosferatu.7.a: "找到她！"
 podnosferatu.70.t: "黑暗中的恐怖：戈尔戈"
 podnosferatu.70.desc: "经过多年的与传说中的尼克图库戈尔戈的游击战，你对你领域内的武装力量的控制已经大大减弱。新的和未经证实的卫兵站在你的王室间面前，在今晚出席的诺斯费拉图的脸上可以看到恐惧。这必须要停止。\n你可以聚集你剩余的力量，组织一次全域范围内的尼克图库狩猎，以永久拿下（或至少迫使其逃离）戈尔戈。或者你可以逃跑，也许希望通过这种方式再避开尼克图库的报复，再活过一晚。"
 podnosferatu.70.a: "我们将追捕到她！"
 podnosferatu.70.critical.failure.effect.desc: "这是个糟糕的主意……"
 podnosferatu.8.t: "黑暗中的恐怖：收割者"
 podnosferatu.8.desc: "最近，在你的领域内有骇人凶杀案的报道。虽然到目前为止还没有发现明显的规律，但它似乎潜伏在你的利益周围，并慢慢地开始使你通常的联系人和影响来源对与你合作保持警惕。\n你的廷臣们正在谈论一个潜在的下落不明的野者吸血鬼，或者完全是另一种类型的生物。然而，你的诺斯费拉图同胞们指出，你氏族中的一些年轻成员已经以这种方式被杀害，并要求你采取相当大的措施来应对这种威胁。他们低声说，这可能是一位可怕的尼克图库干的。"
 podnosferatu.8.a: "到处都要看！"
 podnosferatu.80.t: "黑暗中的恐怖：伊卢扬卡什"
 podnosferatu.80.desc: "毫无疑问，你是一位尼克图库的目标。诺斯费拉图学者认为这可能是伊卢扬卡什——收割者——以血腥地谋杀任何阻碍他实现目标的人而闻名。你追踪他已经有一段时间了，但无法阻止他。\n你还有两个选择，为他准备一个陷阱，希望在你的勇士们的帮助下把他打跑。或者干脆逃得远远的，直到他闻不到你的气味。"
 podnosferatu.80.a: "奋起作战！"
 podnosferatu.80.critical.failure.effect.desc: "我们战败了……"
 podnosferatu.9.t: "黑暗中的恐怖：怪物"
 podnosferatu.9.desc: "最近，有人向你报告了奇怪的目击事件。一个像马一样的可怕怪物显然已经开始在离你的势力范围不远的地方横行霸道。你的廷臣们正在寻找有关这种生物身份的线索，提出它可能是一种迄今为止未曾见过的化形者品种。然而，你的诺斯费拉图同胞们并不相信，他们低声谈论纳克拉维，一个令人畏惧的具有该怪物形状的尼克图库。他们要求采取严厉的措施来保护你（和他们）免遭他的愤怒，如果他朝你的方向走去的话。"
 podnosferatu.9.a: "准备防御！"
 podnosferatu.90.t: "黑暗中的恐怖：尼克图库"
 podnosferatu.90.desc: "你从几年前就听说的那个像马一样的怪物已经被证明是一个比你最初想象的要大得多的问题。他有些随机的攻击规律让你很难追踪到他，而他明显的强大力量让你更难真正把他放倒。在横扫整个地区（特别是针对诺斯费拉图）之后，他现在正在接近你的领域。\n剩下的两个选择很清楚，准备好你最好的防御，在战场上面对他，或者逃离，希望他丢失你的踪迹。"