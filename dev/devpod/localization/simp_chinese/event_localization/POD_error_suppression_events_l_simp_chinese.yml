 POD_error_suppression.0002.t:0 "Better Barbershop"
 POD_error_suppression.0002.desc:0 "我们注意到你正在使用《Better Barbershop》MOD（曾经的全屏理发店MOD）。请确保你使用的是以下加载顺序： 黑暗亲王MOD，然后是《Better Barbershop》MOD，然后是《POD + Better Barbershop Compatibility Patch》MOD (podbb)。\n否则，你将错过黑暗亲王的一些功能，且所有角色最终都将变成肌肉人或脂肪人，角色互动菜单不显示滚动条等等。感谢合作。"
 POD_error_suppression.0002.a:0 "我明白了"
 POD_error_suppression.0004.t:0 "搜索和交易宝物"
 POD_error_suppression.0004.desc:0 "你正在使用#bold 搜索和交易宝物#!MOD，但没有使用兼容MOD。这将导致bug和意外。\n\n建议从下面的链接下载[princes_of_darkness|E]兼容MOD。"
 POD_error_suppression.0004.a:0 "我明白了"
