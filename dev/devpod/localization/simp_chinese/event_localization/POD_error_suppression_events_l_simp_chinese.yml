 POD_error_suppression.0002.t: "Better Barbershop"
 POD_error_suppression.0002.desc: "我们注意到你正在使用“Better Barbershop”模组（旧称 “Full Screen Barbershop”）。该模组目前与PoD#N 不兼容#!，其兼容性补丁已过时。我们建议你暂时从游戏模组列表中移除它。\n\n否则，你将错过黑暗亲王的一些功能，且所有角色最终都将变成肌肉人或脂肪人，角色互动菜单不显示滚动条等等。感谢合作。"
 POD_error_suppression.0002.a: "我明白了"
 POD_error_suppression.0004.t: "搜索和交易宝物"
 POD_error_suppression.0004.desc: "你正在使用#bold 搜索和交易宝物#!MOD，但没有使用兼容MOD。这将导致bug和意外。\n\n建议从下面的链接下载[princes_of_darkness|E]兼容MOD。"
 POD_error_suppression.0004.button: "#T 重新加载文本#!"
 POD_search_artifacts_steam_link: "https://steamcommunity.com/sharedfiles/filedetails/?id=3108318083"
 POD_error_suppression.0005.t: "原版特质冲突警告"
 POD_error_suppression.0005.desc: "您安装的某个模组正在修改原版特质，这将覆盖[princes_of_darkness|E]的修改，导致错误和意外行为。建议移除其他模组直至本警告消失。"