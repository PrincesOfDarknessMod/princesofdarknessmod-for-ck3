l_simp_chinese:
 POD_soulmate_frenzy.001.t: "灵魂残缺"
 POD_soulmate_frenzy.001.desc: "你刚得知这个消息，你的世界就崩溃了。[lost_soulmate.GetFirstName]真正的死去了。你的脑海在颤抖，并否认这个事实。你需要无尽的回缓才真正明白这意味着什么：你的一部分肯定已经消失了。你独自一人在夜空下，这种眩人的孤独扼杀了你的心智。但有一只怪物在期待着你的弱势。心兽在你体内升起，乘着你的痛苦和绝望。很快，它的咆哮就会围住你的灵魂。怒从哀生。"
 POD_soulmate_frenzy.001.option.a: "我必须全力抵抗"
 POD_soulmate_frenzy.001.option.a.tt: "#beast 你无法抵抗我！#!"
 POD_soulmate_frenzy.001.option.b: "我必须抵抗足够长的时间，到离开我的宫廷"
 POD_soulmate_frenzy.001.option.b.tt: "#beast 你无法逃离我！#!"
 POD_soulmate_frenzy.001.option.c: "我接受它的怀拥；心兽永不受苦"
 POD_soulmate_frenzy.001.option.c.tt: "#beast 是时候大快朵颐了！#!"
 POD_soulmate_frenzy.002.t: "尝试抵抗"
 POD_soulmate_frenzy.002.desc: "你的内心生长着一只可怖的存在。它充满了赤红的激情，致命的欲望，而你也许想要屈服于其。你可以忘记你所有的痛苦，并找到解脱，只要让心兽进来。只需一口气，当你正被自己的痛苦窒息。但你有自己的理由去抗拒。你知道心兽是内在的掠食者，而你是它的猎物。\n它什么都给不了你，它本身就是更多的绝望。于是，你与心兽抗争，你与自己抗争，与自己的放弃思想抗争。你的脑海是一片战场，其中光明正在消逝。你独自对抗自己的黑暗，而这黑暗吞噬了你。"
 POD_soulmate_frenzy.002.option.a: "继续斗争"
 POD_soulmate_frenzy.002.option.a.tt: "#beast 由你掌权……目前而言#!"
 POD_soulmate_frenzy.102.t: "超越痛苦"
 POD_soulmate_frenzy.102.desc: "接下来的夜晚似乎永远不会结束。心兽就在这里，随时准备利用你的一丝烦躁，一丝啜泣，来控制你。你的廷臣们觉得你不对劲，希望他们会本能地避开你。你的目光充满了狞恶，连人类都能看出来。然而，你一点一点地压下了你内心的怪物。它的爪子再也找不到抓住你的意识的机会。所以，经过几周的艰苦斗争，你又把怪物锁在了笼子里。你赢了，在付出了巨大的努力后。至少，这可能因此挽救了许多生命。\n你的哀伤还在，你的永生还有着苦涩的味道。但时间却还是你的盟友。也许，在某一个夜晚，天空又会布满繁星。"
 POD_soulmate_frenzy.102.option.a: "结束了"
 POD_soulmate_frenzy.102.option.a.tt: "你忍住了血狂，但你还是感觉到了内心的空虚……"
 POD_soulmate_frenzy.003.t: "红天之下"
 POD_soulmate_frenzy.003.desc: "至少是一段时间内，你设法保住了心兽的缰绳。就像地狱在你身后一般，你离开了你的领地。你在夜色中前行，尽可能地远离你的家园，而心兽却在你的体内愤怒地冲击着。直到，你也不记得是什么时候了，你做了唯一能做的事：你打开了笼子。随后你淹没在你长久以来的情感的折磨中。\n许多人可能会死，但不会是你的廷臣。"
 POD_soulmate_frenzy.003.option.a: "今晚将血流成河"
 POD_soulmate_frenzy.003.option.a.tt: "#beast 终于！给他们见见我们的怒火！#!"
 POD_soulmate_frenzy.103.t: "当人民在流血"
 POD_soulmate_frenzy.103.desc: "血狂笼罩了你几个星期。你像一场嗜血的风暴一样穿过你的领地。很快，有传言说有只怪物在晚上出现，杀死拦它路的任何东西。白天变得过于短促，夜晚变得注定送死。\n你不记得它何时停止。你只是站在一个村庄的中心，周围散落着居民的碎片。这个画面你已经很熟悉了，但现在，你能体会到它的恐怖。最后，你回到了你的避难所。你内在的真实，被你脸上和手上涂抹的干涸血迹所表达。你是故事中的怪物，给孩子们的童年带来恐怖。"
 POD_soulmate_frenzy.103.option.a: "你的罪行罄竹难书"
 POD_soulmate_frenzy.103.option.a.tt: "#beast 嗝#!"
 POD_soulmate_frenzy.203.t: "痛苦与愤怒的疤痕"
 POD_soulmate_frenzy.203.desc: "伟大的血狂并没有安抚你的痛苦。哀悼不是用愤怒和狂欢来完成的。你感到空虚，被一种不真实的感受所侵袭。以你还不明白的方式，心兽在你的脑海中留下了印记。你将永远不会再一样了。\n但你会活下来，夜复一夜。这就是永生者的宿命。"
 POD_soulmate_frenzy.203.option.a: "从此以后，一切都将味同嚼蜡"
 POD_soulmate_frenzy.203.option.a.tt: "你屈服于血狂，但你仍然感到内心的空虚……"
 POD_soulmate_frenzy.303.t: "$glossary_wyrm$之子"
 POD_soulmate_frenzy.303.desc: "血狂笼罩了你几个星期。你像一场嗜血的风暴一样穿过你的领地。很快，有传言说有只怪物在晚上出现，杀死拦它路的任何东西。白天变得过于短促，夜晚变得注定送死。\n但有时，即使是鬼也会遇到聻。由于对死亡的渴望，心兽闹得太过了，太显眼了。数位存在听到了大地的哭泣。他们闻到了你的屠杀的气味，并追踪了它的踪迹。某夜，它们终于找到了你，你成了猎物。狼人战群突然包围了你，他们决心结束你亵渎的存在。尽管你怀怒的力量很强大，但他们的獠牙和利爪太多了。这可能是你的最后一战。"
 POD_soulmate_frenzy.303.option.a: "怪物是不会怕小狗的"
 POD_soulmate_frenzy.303.option.a.tt: "#beast 来啊！#!"
 POD_soulmate_frenzy.303.option.a.desc: "为了你的亡生而战"
 POD_soulmate_frenzy.303.option.a.success: "你是最优秀的"
 POD_soulmate_frenzy.303.option.a.tt.win: "你赢了"
 POD_soulmate_frenzy.303.option.a.failure: "你被打败了"
 POD_soulmate_frenzy.303.option.a.tt.lose: "你输了"
 POD_soulmate_frenzy.403.t: "对爪之后"
 POD_soulmate_frenzy.403.desc: "狼群的咆哮与你的咆哮交织在一起，可怕的对抗开始了。你的心兽没有丝毫的辨别力，但它本能地知道如何杀戮和生存。你站在战场的中心；舞在狂野的风暴中。你躲过一些攻击，没能躲过另一些，并为每次失误付出一道新伤口，你的愤怒一次又一次地增长。\n在你狂热的脑海中，你看到自己抓住了触手可及的肉体，打爆了眼睛，扳断了下巴，砍断了手臂头颅。痛苦的撕碎了这些幻象。你的身体是有极限的，再多的愤怒都无法突破它们。疲劳和你的伤势越来越大；而恐惧则占据了控制你的怪物。所以，你不顾追杀着你的疯狂狼人，逃跑了。经过几个小时的追逐，如似某种奇迹，你设法逃离了他们。"
 POD_soulmate_frenzy.403.option.a: "我现在需要休息"
 POD_soulmate_frenzy.403.option.a.tt: "#beast 他们不是我们的对手！#!"
 POD_soulmate_frenzy.503.t: "我是任剩的其中之一"
 POD_soulmate_frenzy.503.desc: "你终于到家了。心兽沉默了，你独自一人。你的爱人已经不在了，只剩下其留下的空缺和回忆了。你还活着，但代价是什么？往后将更加度日如年。"
 POD_soulmate_frenzy.503.option.a: "从此以后，一切都将味同嚼蜡"
 POD_soulmate_frenzy.503.option.a.tt: "你屈服于血狂，但你仍然感到内心的空虚……"
 POD_soulmate_frenzy.603.t: "爱能拯救"
 POD_soulmate_frenzy.603.desc: "狼群的咆哮与你的咆哮交织在一起，可怕的对抗开始了。你站在战场的中心；舞在狂野的风暴中。你躲过一些攻击，没能躲过另一些，并为每次失误付出一道新伤口，你的愤怒一次又一次地增长。痛苦撕碎了这些幻象。你的身体是有极限的，再多的愤怒都无法突破它们。疲劳和你的伤势越来越大。突然间，愤怒抛弃了你。\n盖亚的战士们残忍地抓住了你。他们凶残的武器击在你腹部皮肤后的枯萎器官上，捣碎你的骨头，将你的存在化为无穷无尽的粉末。在你奄奄一息的时候，你感到空虚，但一种奇怪的声音引起了你的注意。尽管你的眼睛上有血迹，但你还是能看到不知什么向你和战群冲来。你认出是[friend_savior.GetFirstName]。新的战斗开始了，但你伤得太重，无法旁观到。一切都很模糊，直到[friend_savior.GetFirstName]靠在你身上。“我在这，我为你而来。”"
 POD_soulmate_frenzy.603.option.a: "你好，黑暗，我的老朋友"
 POD_soulmate_frenzy.603.option.a.tt: "你被[friend_savior.GetFirstName]拯救"
 POD_soulmate_frenzy.703.t: "迎接你的终末"
 POD_soulmate_frenzy.703.desc: "狼群的咆哮与你的咆哮交织在一起，可怕的对抗开始了。你站在战场的中心；舞在狂野的风暴中。你躲过一些攻击，没能躲过另一些，并为每次失误付出一道新伤口，你的愤怒一次又一次地增长。在你狂热的脑海中，你看到自己抓住了触手可及的肉体，打爆了眼睛，扳断了下巴，砍断了手臂头颅。痛苦的撕碎了这些幻象。\n你的身体是有极限的，再多的愤怒都无法突破它们。突然间，愤怒抛弃了你，留下的只有恐惧。盖亚的战士们残忍地抓住了你。他们凶残的武器击在你腹部皮肤后的枯萎器官上，捣碎你的骨头，将你的存在化为无穷无尽的粉末。在你的头离开你的脖子之前，你感到空虚。在这最后一次，你可以见着星星，随后是黑暗。"
 POD_soulmate_frenzy.703.option.a: "永眠待着我"
 POD_soulmate_frenzy.703.option.a.tt: "你在与狼人们的不平等战斗中死去"
 POD_soulmate_frenzy.004.t: "未被释放之兽"
 POD_soulmate_frenzy.004.desc: "你的意识突然中断了流淌。一股强烈的愤怒淹没了你的思维，你变得像一个空壳，只为暴力而动。这个东西，是你又不是你，在你的领地里狂奔。它对后悔视而不见，只顾着给予死亡，因为它的死亡生出了它。所以它的爪子割开脸皮，粉碎骨头；它的牙齿撕开喉咙，摘出心脏。\n你的屋子现在被血和尖叫淹没了。夜晚很快就会恢复寂静。这是注定的，也是必受的。"
 POD_soulmate_frenzy.004.option.a: "待到黎明，大地将一片血红"
 POD_soulmate_frenzy.004.option.a.tt: "#beast 让我们开始大快朵颐吧！#!"
 POD_soulmate_frenzy.104.t: "血腥宿醉"
 POD_soulmate_frenzy.104.desc: "终于，你醒了。眼睑掀起，你可以见着你在这漫漫长夜里所做的一切。在你的脚下，是一片血潮。你被尸体包围着，部分是饱受折磨后的尸体，和其他一些无法辨认的东西。你能认出许多你的侍卫，你的仆人，你的廷臣，还有一些对你来说不那么陌生的面孔。所有人的表情都永远凝为了惊恐。你的屋子就像一个开放的公墓，而你就是那个掘墓人。"
 POD_soulmate_frenzy.104.option.a: "你的罪行罄竹难书"
 POD_soulmate_frenzy.104.option.a.tt: "#beast 杀廷臣真有趣，我们应该再来一次！#!"
 POD_soulmate_frenzy.204.t: "痛苦与愤怒的疤痕"
 POD_soulmate_frenzy.204.desc: "血狂并没有安抚你的痛苦。哀悼不是用愤怒和狂欢来完成的。你感到空虚，被一种不真实的感受所侵袭。以你还不明白的方式，心兽在你的脑海中留下了印记。你将永远不会再一样了。但你会活下来，夜复一夜。这就是永生者的宿命。"
 POD_soulmate_frenzy.204.option.a: "从此以后，一切都将味同嚼蜡"
 POD_soulmate_frenzy.204.option.a.tt: "你屈服于血狂，但你仍然感到内心的空虚……"