 POD_werewolves_spirit_quest.1.t: "诸灵之任"
 POD_werewolves_spirit_quest.1.desc: "你已经咨询了诸灵，它们中的数位有任务可提供。完成其中一个将使你在心灵之旅中取得进展，学习更多的力量，但也会在不同方面削弱你，因为每个任务都有特定的挑战。\n如果你拒绝这些提议，你可以在五年内再次要求不同的任务（大概）。"
 POD_werewolves_spirit_quest.1.option.a: "战争之灵的任务"
 POD_werewolves_spirit_quest.1.option.b: "领导之灵的任务"
 POD_werewolves_spirit_quest.1.option.c: "统治之灵的任务"
 POD_werewolves_spirit_quest.1.option.d: "鸦灵的任务"
 POD_werewolves_spirit_quest.1.option.e: "猫头鹰之灵的任务"
 POD_werewolves_spirit_quest.1.option.f: "现在不是接任务的好时机"
 spirit_quest_decision: "诸灵之任"
 spirit_quest_decision_tooltip: "听从他们的请求，学习他们的能力。"
 spirit_quest_decision_desc: "灵类是狼族世界中的老师，但学习他们的灵赋是有代价的。"
 spirit_quest_decision_confirm: "下一个任务是什么？"
 spirit_quest_decision_effect: "你将被展示各种获得狼人生活方式经验的方式选项。"
