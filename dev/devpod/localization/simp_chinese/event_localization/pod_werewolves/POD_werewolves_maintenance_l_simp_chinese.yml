 POD_werewolves_adoption.10.t:0 "你的毛茸朋友"
 POD_werewolves_adoption.10.desc:0 "狼人与他们的狼亲有着密切的关系。每个部族，即使是像人类监护者这样最受城市约束的部族，也会小心地照顾他们的四条腿的朋友，并在他们中间寻找原始觉醒的迹象。\n那些最终成为狼人的狼在成为部族的正式成员之前往往需要更多的准备，因为人类世界的服饰对他们来说是新的。作为当地领导人，你有责任选择如何密切监控和计划这种潜在的帮助。"
 POD_werewolves_adoption.10.bubasti:0 "Long ago, the Bubasti joined Horus in his eternal fight against his decadent uncle, Set. While the cause was righteous and the Bubasti still take great pride in their contribution, it still resulted in a terrible defeat. The triumphant Setites captured the cat kin of the Bubasti, the Kyphur cats, and either killed them or fed them blood to turn them into aberrant monsters.\nNowadays, the Bubasti still never recovered and, unlike their Bastet sister tribes, don't have access to their feline kinfolk for help and bolstering of numbers.\nThe tribe will likely never truly prosper until the last Kyphur cats are rescued from the Setites."
 POD_werewolves_adoption.10.bastet:0 "芭丝特和他们的猫亲有着密切的关系。 每个部族都小心翼翼地监视着他们的四足朋友，并寻找他们之中原始觉醒的迹象。 猫人的领地意识很强，这也意味着部族倾向于留在其亲眷居住的地区。\n那些最终成为芭丝特的猫在成为部落的正式成员之前往往需要更多的准备，因为人类世界的装饰对他们来说是新的。 作为当地领导者，您可以选择对这种潜在帮助进行监控和计划的密切程度。"
 POD_werewolves_adoption.10.a:0 "我会抚养我的亲眷。"
 start_beastborn_content_tt:0 "你将可以选择让你部族的[GetTrait('beast_born').GetName( GetPlayer )]化形者到达你的宫廷。 这可能会花费你一些资源。"
 POD_werewolves_adoption.10.b:0 "或许以后再说吧。"
 delayed_start_beastborn_content_tt:0 "在30到40年后，你将获得选择，让你部落的[GetTrait('beast_born').GetName( GetPlayer )]化形者到达你的宫廷。这需要你花费声望，如果你更挑剔，花费的声望会更高。"
 POD_werewolves_adoption.10.c:0 "他们自己会做得很好的。"
 end_beastborn_content_tt:0 "你不会再听到这个消息了。"
 POD_werewolves_adoption.10.d:0 "我们将拯救我们失踪的亲眷。"
 bubasti_beastborn_content_tt:0 "布巴斯塔的目标是拯救他们失踪的猫亲。 在那之前他们无法从他们的帮助中受益。"
 POD_werewolves_adoption.11.t:0 "Pack Animals"
 POD_werewolves_adoption.11.desc:0 "您决定采取积极主动的方法来监测您所在地区的亲眷。你有几个值得信赖的盟友在现场寻找原始觉醒的迹象，但覆盖的区域非常大。当一只动物经历原始觉醒时，这往往是你的同类和各种充满恶意的猎人之间的竞争，所以你分配给监视任务的人越多，你就越有可能不错过任何人。"
 POD_werewolves_adoption.11.a:0 "没有亲眷会被留下。"
 numerous_beast_born_tooltip:0 "当这个事件链结束时，你会得到数个[GetTrait('beast_born').GetName( GetPlayer )]廷臣。"
 POD_werewolves_adoption.11.b:0 "我无法涵盖所有人。"
 single_beast_born_tooltip:0 "当这个事件链结束时，你会得到一个[GetTrait('beast_born').GetName( GetPlayer )]廷臣。"
 POD_werewolves_adoption.12.t:0 "野兽之王"
 POD_werewolves_adoption.12.desc:0 "大自然是个苛刻的女主人。你的动物亲眷，没有意识到这个世界的斗争，仍然按照它的规则生存和死亡。化形者之间的一个常见论点是，在保护你的亲眷免受外部世界和人类对其自然环境的掠夺时，你必须采取多大程度的干预。一些人认为他们应该不惜一切代价保护他们，而另一些人则认为，当他们经历原始觉醒时，这些斗争只会导致更强的化形者。"
 POD_werewolves_adoption.12.a:0 "他们将在斗争中变得强大。"
 POD_werewolves_adoption.12.b:0 "保护他们是我们的职责。"
 POD_werewolves_adoption.12.c:0 "保持中立是最好的。"
 beastborn_no_interference_tooltip:0 "你的未来将接受军事或军事能力教育，可能会有更傲慢的特质，比如暴怒或冷酷。"
 beastborn_full_interference_tooltip:0 "你的后继将是非军事教育类型，更有可能具有冷静或耐心等特质。"
 wait_time_beastborn_tooltip:0 "Your choices of approach now being made, you will have to wait for a sign of First Change among your animal kin. This will likely take several years."
 POD_werewolves_adoption.13.t:0 "Playing Buddy"
 POD_werewolves_adoption.13.desc:0 "The animal kin you are attending today are in a playful mood. Already recognizing you as a friend of their brood, they gather around you, looking inquisitively while obviously waiting for you to entertain them. Opening their horizons by introducing new concepts using games is certainly something you can do if you have the time."
 POD_werewolves_adoption.13.a:0 "Playtime it is!"
 POD_werewolves_adoption.13.b:0 "Not today friends."
 beastborn_more_diplomacy_tooltip:0 "The [GetTrait('beast_born').GetName( GetPlayer )] that will later join your court will start with more diplomacy."
 POD_werewolves_adoption.14.t:0 "Storytelling Nature"
 POD_werewolves_adoption.14.desc:0 "No signs of the First Change in your local animal kin yet but that doesn't mean that you can't spend time with them. While they lack the worldly knowledge of your kind, your animal cousins still instinctively listen to you. As they gather around you, wondering what you will do, you ponder if you have time to tell them a story. You speak their language after all and this could be a good way to prepare potential future shapeshifters to the world beyond."
 POD_werewolves_adoption.14.a:0 "Stay a while and listen."
 beastborn_more_learning_tooltip:0 "The [GetTrait('beast_born').GetName( GetPlayer )] that will later join your court will start with more learning."
 POD_werewolves_adoption.15.t:0 "Wrath of Nature"
 POD_werewolves_adoption.15.desc:0 "Thanks to your careful monitoring, you recently learned that poachers have been encroaching in your animal kin's habitat. This will be the last mistake they make.\nWhile their death is already a done deal, you ponder if you could subtly help your animal kin fend for itself, hopefully having them learn and grow in the process. Otherwise, you could simply end this threat on your own quite easily."
 POD_werewolves_adoption.15.a:0 "Nature strikes back."
 POD_werewolves_adoption.15.b:0 "I will deal with them myself."
 beastborn_more_martial_tooltip:0 "The [GetTrait('beast_born').GetName( GetPlayer )] that will later join your court will start with more martial."
 POD_werewolves_adoption.16.t:0 "Overbearing Parent"
 POD_werewolves_adoption.16.desc:0 "You have been a little too overprotective of your animal kin recently. They have grown numerous thanks to plentiful preys and few predators, and the usual harsh laws of nature have been softened quite a bit by your watchful presence. A simple solution to restore balance would be to move some of them to a new environment, hopefully leading them into learning and adapting from this new struggle. You could also just let this situation slide, having happy and plentiful animal kin in your area is far from a curse anyway."
 POD_werewolves_adoption.16.a:0 "Time for a change."
 POD_werewolves_adoption.16.b:0 "Never too much of a good thing."
 beastborn_more_stewardship_tooltip:0 "The [GetTrait('beast_born').GetName( GetPlayer )] that will later join your court will start with more stewardship."
 POD_werewolves_adoption.17.t:0 "Gifted One"
 POD_werewolves_adoption.17.desc:0 "One of your animal kin has shown great promise recently with wits and craftiness aplenty. While not the most strong or impressive specimen, some in your court still see these talents as a sign of greatness and certain First Change in the future. No one truly understands what really makes one experience the First Change however so you are unsure about joining in this chorus of praise. What if the spirits disagree?"
 POD_werewolves_adoption.17.a:0 "Clearly, he is the one!"
 POD_werewolves_adoption.17.b:0 "We can't know for sure."
 beastborn_more_intrigue_tooltip:0 "The [GetTrait('beast_born').GetName( GetPlayer )] that will later join your court will start with more intrigue."
 POD_werewolves_adoption.18.t:0 "New Generation"
 POD_werewolves_adoption.18.desc:0 "The animal population of your area has recently experienced a First Change. Your monitoring of their activities paid off and your agents were the first on site, helping ease the traumatic experience for the new shapeshifters and hide their trail for any prospective hunters. Grateful, they now joined your court ready to discover the wider world and your worthy cause."
 POD_werewolves_adoption.18.a:0 "Welcome!"
 POD_werewolves_adoption.18.b:0 "I don't need more [GetTrait('beast_born').GetName( GetPlayer )] in the future."