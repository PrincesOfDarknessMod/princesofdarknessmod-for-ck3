l_simp_chinese:
 POD_werewolves_maintenance.2.t:0 "原始觉醒"
 POD_werewolves_maintenance.2.desc:0 "原始觉醒是对年幼狼族（和大多数化兽族裔）第一次变身的称呼。通常它伴随着第一次魂怒和在高度紧张的情况下的第一次半狼形战斗形态。\n你刚刚经历了这一创伤性事件，现在正式成为一名狼人，成为你的部族的正式成员，拥有这样的身份所带来的所有责任和特权。"
 POD_werewolves_maintenance.2.option.a:0 "我现在是成人了。"
 POD_werewolves_maintenance.3.t:0 "是个男孩……"
 POD_werewolves_maintenance.3.desc:0 "看上去盖亚今天没啥可祝福你：你的孩子是个男孩。黑怒的社会对接下来的事非常严格，你知道这是你们部族几代人以来的做法。\n你们族人中确实有几只男性，所以如果你愿意，保留这个孩子的选择也并非前无先例，但这仍然是对传统的极大冒犯，被你的姐妹们视为软弱的表现。然而，在白日结束时，你将自己下决定。"
 POD_werewolves_maintenance.3.option.a:0 "软弱的男性不可与我们为伍！"
 POD_werewolves_maintenance.3.option.b:0 "我依然是他的母亲！"
 cub_recruited_tt:0 "你将收下幼崽，培训且承认为你的后代。"
 cub_redtalon4_tt:0 "由于你的赤爪传承技能，幼崽在受招时将有额外的勇武。"
 POD_werewolves_adoption.101.t:0 "New Generation"
 POD_werewolves_adoption.101.desc:0 "The wolves' population of your area has recently experienced an handful of First Change among them. As is the duty of any self serving Tribe, you have been scouting for those lost pups and brought the most deserving home with you.\nAfter a time of adaptation needed to teach those lupus the ways of the world beyond their forests, they are now ready to become fully fledged members of your pack."
 POD_werewolves_adoption.101.option.a:0 "Welcome, wyld brothers and sisters"
 POD_werewolves_adoption.102.t:0 "A Worthy Cub?"
 POD_werewolves_adoption.102.desc:0 "As a lupus-born, you often have encounters with your non werewolf kind in the forests. Sometimes, these encounters result in new cubs being born.\nThese cubs end up as mundane wolves the vast majority of the time and escape your notice quickly. Sometimes though, one of them experience the First Change and becomes a full fledged werewolf like you did.\nAs a lupus-born, they will need to be taught about the world outside the forests before being useful. But if you are willing to make that effort, they could join you, continuing your legacy for the next generation."
 POD_werewolves_adoption.102.option.a:0 "Welcome to the pack!"
 POD_werewolves_adoption.102.option.b:0 "Welcome to the pack!"
 POD_werewolves_adoption.102.option.c:0 "I don't have time to spare."
