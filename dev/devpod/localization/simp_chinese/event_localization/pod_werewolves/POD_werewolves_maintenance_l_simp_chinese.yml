l_simp_chinese:
 POD_werewolves_maintenance.2.t:0 "原始觉醒"
 POD_werewolves_maintenance.2.desc:0 "原始觉醒是对年幼狼族（和大多数化兽族裔）第一次变身的称呼。通常它伴随着第一次魂怒和在高度紧张的情况下的第一次半狼形战斗形态。\n你刚刚经历了这一创伤性事件，现在正式成为一名狼人，成为你的部族的正式成员，拥有这样的身份所带来的所有责任和特权。"
 POD_werewolves_maintenance.2.option.a:0 "我现在是成人了。"
 POD_werewolves_maintenance.3.t:0 "新一代"
 POD_werewolves_maintenance.3.desc:0 "你所在地区的狼群最近经历了少数的原始觉醒。作为为自我维持的部族职责，你一直在寻找那些丢失的幼崽，并把最有能的幼崽带回家。\n经过一段时间的适应，教给这些狼子森林以外的世界，其现在已经准备好成为你战群的正式成员了。"
 POD_werewolves_maintenance.3.option.a:0 "欢迎，奇原下的兄弟姐妹"
 POD_werewolves_maintenance.4.t:0 "是个男孩……"
 POD_werewolves_maintenance.4.desc:0 "看上去盖亚今天没啥可祝福你：你的孩子是个男孩。黑怒的社会对接下来的事非常严格，你知道这是你们部族几代人以来的做法。\n你们族人中确实有几只男性，所以如果你愿意，保留这个孩子的选择也并非前无先例，但这仍然是对传统的极大冒犯，被你的姐妹们视为软弱的表现。然而，在白日结束时，你将自己下决定。"
 POD_werewolves_maintenance.4.option.a:0 "软弱的男性不可与我们为伍！"
 POD_werewolves_maintenance.4.option.b:0 "我依然是他的母亲！"
 POD_werewolves_maintenance.5.t:0 "幼崽？"
 POD_werewolves_maintenance.5.desc:0 "作为狼子，你经常在森林里与你的非狼人同种相遇。有时，这些遭遇会导致新的幼崽的诞生。\n这些幼崽在绝大多数情况下都会变成普通的狼，并且很快就会逃离你的关注。但有时，他们中的一个会经历原始觉醒，像你一样成为一位成熟的狼人。\n作为狼子，他们需要在成为有用的人之前被教导了解森林以外的世界。但如果你愿意做出这种努力，他们可以加入你，为你传承。"
 POD_werewolves_maintenance.5.option.a:0 "欢迎来到战群！"
 POD_werewolves_maintenance.5.option.b:0 "欢迎来到战群！"
 POD_werewolves_maintenance.5.option.c:0 "我很忙。"
 cub_recruited_tt:0 "你将收下幼崽，培训且承认为你的后代。"
 cub_redtalon4_tt:0 "由于你的赤爪传承技能，幼崽在受招时将有额外的勇武。"