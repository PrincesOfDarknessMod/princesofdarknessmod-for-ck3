 POD_werewolves_adoption.10.t: "你的毛茸朋友"
 POD_werewolves_adoption.10.desc: "狼人与他们的狼亲有着密切的关系。每个部族，即使是像人类监护者这样最受城市约束的部族，也会小心地照顾他们的四条腿的朋友，并在他们中间寻找原始觉醒的迹象。\n那些最终成为狼人的狼在成为部族的正式成员之前往往需要更多的准备，因为人类世界的服饰对他们来说是新的。作为当地领导人，你有责任选择如何密切监控和计划这种潜在的帮助。"
 POD_werewolves_adoption.10.bubasti: "很久以前，布巴斯提加入了荷鲁斯对抗他堕落叔叔赛特的永恒战争中。尽管这一事业正义非凡，布巴斯提也为他们的贡献感到无比自豪，但最终却以惨败告终。胜利的赛特之子俘获了布巴斯提的猫族，凯布尔猫，他们或被屠戮，或被用血喂养，变成可怕的变异怪物。\n时至今日，布巴斯提仍未从这场打击中恢复过来，与他们的姐妹部落芭丝特不同，他们无法获得猫子兽裔的帮助来增加人数。\n除非从赛特之子手中解救出最后一只凯布尔猫，否则部族可能永远无法真正繁荣。"
 POD_werewolves_adoption.10.bastet: "芭丝特和他们的猫亲有着密切的关系。 每个部族都小心翼翼地监视着他们的四足朋友，并寻找他们之中原始觉醒的迹象。 猫人的领地意识很强，这也意味着部族倾向于留在其亲眷居住的地区。\n那些最终成为芭丝特的猫在成为部落的正式成员之前往往需要更多的准备，因为人类世界的装饰对他们来说是新的。 作为当地领导者，您可以选择对这种潜在帮助进行监控和计划的密切程度。"
 POD_werewolves_adoption.10.a: "我会抚养我的亲眷。"
 start_beastborn_content_tt: "你将可以选择让你部族的[GetTrait('beast_born').GetName( GetPlayer )]化形者到达你的宫廷。 这可能会花费你一些资源。"
 POD_werewolves_adoption.10.b: "或许以后再说吧。"
 delayed_start_beastborn_content_tt: "在30到40年后，你将获得选择，让你部落的[GetTrait('beast_born').GetName( GetPlayer )]化形者到达你的宫廷。这需要你花费声望，如果你更挑剔，花费的声望会更高。"
 POD_werewolves_adoption.10.c: "他们自己会做得很好的。"
 end_beastborn_content_tt: "你不会再听到这个消息了。"
 POD_werewolves_adoption.10.d: "我们将拯救我们失踪的亲眷。"
 bubasti_beastborn_content_tt: "布巴斯提的目标是拯救他们失踪的猫亲。 在那之前他们无法从他们的帮助中受益。"
 POD_werewolves_adoption.11.t: "群居动物"
 POD_werewolves_adoption.11.desc: "您决定采取积极主动的方法来监测您所在地区的亲眷。你有几个值得信赖的盟友在现场寻找原始觉醒的迹象，但覆盖的区域非常大。当一只动物经历原始觉醒时，这往往是你的同类和各种充满恶意的猎人之间的竞争，所以你分配给监视任务的人越多，你就越有可能不错过任何人。"
 POD_werewolves_adoption.11.a: "不落下任何一位亲族。"
 numerous_beast_born_tooltip: "当这个事件链结束时，你会得到数个[GetTrait('beast_born').GetName( GetPlayer )]廷臣。"
 POD_werewolves_adoption.11.b: "我无法涵盖所有人。"
 single_beast_born_tooltip: "当这个事件链结束时，你会得到一个[GetTrait('beast_born').GetName( GetPlayer )]廷臣。"
 POD_werewolves_adoption.12.t: "野兽之王"
 POD_werewolves_adoption.12.desc: "大自然是个苛刻的女主人。你的动物亲眷，没有意识到这个世界的斗争，仍然按照它的规则生存和死亡。化形者之间的一个常见论点是，在保护你的亲眷免受外部世界和人类对其自然环境的掠夺时，你必须采取多大程度的干预。一些人认为他们应该不惜一切代价保护他们，而另一些人则认为，当他们经历原始觉醒时，这些斗争只会导致更强的化形者。"
 POD_werewolves_adoption.12.a: "他们将在斗争中变得强大。"
 POD_werewolves_adoption.12.b: "保护他们是我们的职责。"
 POD_werewolves_adoption.12.c: "保持中立是最好的。"
 beastborn_no_interference_tooltip: "你的未来将接受军事或军事能力教育，可能会有更傲慢的特质，比如暴怒或冷酷。"
 beastborn_full_interference_tooltip: "你的后继将是非军事教育类型，更有可能具有冷静或耐心等特质。"
 wait_time_beastborn_tooltip: "你现在做出抉择，你将不得不等待你的动物亲眷出现原始觉醒的迹象。这可能需要几年时间。"
 POD_werewolves_adoption.13.t: "玩伴"
 POD_werewolves_adoption.13.desc: "你今天要接待的动物亲眷们正沉浸在嬉戏中。它们已经认出你是它们的朋友，围在你身边，好奇地看着你，显然在等着你逗它们开心。如果你有时间，当然可以通过游戏引入新概念来开拓它们的视野。"
 POD_werewolves_adoption.13.a: "现在是玩耍时间！"
 POD_werewolves_adoption.13.b: "抱歉朋友，今天不行。"
 beastborn_more_diplomacy_tooltip: "稍后加入你宫廷的[GetTrait('beast_born').GetName( GetPlayer )]将拥有更多的外交属性。"
 POD_werewolves_adoption.14.t: "诉说自然的故事"
 POD_werewolves_adoption.14.desc: "你当地的动物亲眷还没有原始觉醒的迹象，但这并不意味着你不能花时间和他们在一起。虽然它们缺乏你同类的世俗知识，但你的动物表亲们仍然本能地听你说话。当他们聚集在你周围，想知道你会做什么时，你会思考是否有时间给他们讲一个故事。毕竟，你会说他们的语言，这可能是一个很好的方式，让未来潜在的化形者为未来的世界做好准备。"
 POD_werewolves_adoption.14.a: "停留一会，仔细倾听。"
 beastborn_more_learning_tooltip: "稍后将加入您的宫廷的[GetTrait('beast_born').GetName( GetPlayer )]将有更多学识属性。"
 POD_werewolves_adoption.15.t: "自然之怒"
 POD_werewolves_adoption.15.desc: "多亏了你的仔细监测，你最近才知道偷猎者一直在侵占你动物亲眷的栖息地。这将是他们犯的最后一个错误。\n虽然他们的死亡已经是板上钉钉的事了，但你会思考是否可以巧妙地帮助你的动物亲眷自生自灭，希望能让它们在这个过程中学习和成长。否则，你可以很容易地独自结束这种威胁。"
 POD_werewolves_adoption.15.a: "自然的反击。"
 POD_werewolves_adoption.15.b: "我将自己处理他们。"
 beastborn_more_martial_tooltip: "稍后将加入你的宫廷的[GetTrait('beast_born').GetName( GetPlayer )]将有更多的军事属性。"
 POD_werewolves_adoption.16.t: "专横父母"
 POD_werewolves_adoption.16.desc: "你最近有点过于保护你的动物亲眷了。由于有大量的猎物和很少的捕食者，它们的数量已经增加了，而通常严酷的自然法则也因为你的警惕而有所软化。恢复平衡的一个简单解决方案是将他们中的一些转移到一个新的环境中，希望能引导他们从这场新的斗争中学习和适应。你也可以顺其自然，在你的地区拥有快乐而丰富的动物亲眷绝非诅咒。"
 POD_werewolves_adoption.16.a: "是时候改变了。"
 POD_werewolves_adoption.16.b: "多多益善。"
 beastborn_more_stewardship_tooltip: "稍后将加入你的宫廷的[GetTrait('beast_born').GetName( GetPlayer )]将有更多的管理属性。"
 POD_werewolves_adoption.17.t: "天赋异禀"
 POD_werewolves_adoption.17.desc: "你的一位动物亲眷最近表现出了巨大的潜力，他的智慧和狡猾无处不在。虽然他并不是最强壮或最令人印象深刻的榜样，但你宫廷中的一些人仍然将这些才能视为伟大和未来必将发生原始觉醒的标志。然而，没有人真正了解是什么让能经历原始觉醒，因此你不确定是否要加入这股赞美风潮。如果诸灵不同意呢？"
 POD_werewolves_adoption.17.a: "显然，他就是被选中的！"
 POD_werewolves_adoption.17.b: "我们无法确定。"
 beastborn_more_intrigue_tooltip: "稍后将加入你的宫廷的[GetTrait('beast_born').GetName( GetPlayer )]将有更多的谋略属性。"
 POD_werewolves_adoption.18.t: "新一代"
 POD_werewolves_adoption.18.desc: "你所在地区的动物最近经历了原始觉醒。你对它们活动的监控取得了成效，你的探员是第一批到达现场的人，帮助缓解了新化形者的痛苦经历，并隐藏了它们的踪迹，以防任何潜在的猎人。感激之余，它们现在加入了你的宫廷，准备探索更广阔的世界和你那有价值的功业。"
 POD_werewolves_adoption.18.a: "欢迎！"
 POD_werewolves_adoption.18.b: "我不再需要更多[GetTrait('beast_born').GetName( GetPlayer )]了"
 POD_werewolves_adoption.10.bubastivictorious: "很久以前，布巴斯提加入了荷鲁斯对抗他堕落叔叔赛特的永恒战争中。尽管这一事业正义非凡，布巴斯提也为他们的贡献感到无比自豪，但最终却以惨败告终。胜利的赛特之子俘获了布巴斯提的猫族，凯布尔猫，他们或被屠戮，或被用血喂养，变成可怕的变异怪物。\n然而，随着最近的胜利和最后几只凯布尔猫被英勇营救，布巴斯提再次繁荣起来，并看护着他们的猫子亲族，帮助它们恢复力量，并从长时间被赛特之子奴役的创伤中愈合。"