l_simp_chinese:
 POD_vampire_banes.0001.t: "被美所吸引"
 POD_vampire_banes.0001.desc.intro: "妥芮朵对美有敏锐的眼光。如此敏锐，以至于他们可以被驱使到狂喜的程度，被迷住，被真正的一瞥所迷惑。\n\n"
 POD_vampire_banes.0001.desc.painting: "你撇过了这幅画，然后又回去看了一遍，又看了一遍，一次盯着它看了几个小时。璀璨的色彩，微妙的阴影和笔触，艺术家的意图在一个普通场景上的分层……你与这幅画相处的每个夜晚，你都会注意到新的东西。"
 POD_vampire_banes.0001.desc.song: "你是偶然听到的。一位洗碗间的女仆，在工作时漫无目的地唱歌给自己听。然而，她如此无艺术地创作的旋律有一种深度，一种神圣的火花。夜复一夜，你对自己哼唱，试图重拾那一刻的辉煌。"
 POD_vampire_banes.0001.desc.sculpture: "你很少注意装饰你的大厅和走廊的雕塑。但有一天晚上，一个雕塑引起了你的注意。它被遗忘了在它的壁龛里，很少被清洁，然而灰尘的痕迹使它变得最好，掩盖了这个意外的杰作的曲线和边缘。你禁止你的仆人触摸它，夜复一夜地回到这个雕塑前，每次都能发现它的新美。"
 POD_vampire_banes.0001.desc.poem: "有时图书馆可能是危险的。特别是当你拿起一本书，有半首诗掉了出来。半首诗！而且是一首如此有潜力的诗。它表达了灵魂中真实的东西，但缺失的部分却让人抓狂。夜复一夜，你试着用韵律来完成这首诗。你每次都很接近，但你的作品没有一篇是恰当的。"
 POD_vampire_banes.0001.desc.end: "\n\n像这样的分心将持续几个月才会消失。"
 POD_vampire_banes.0001.a: "美是世界的灵魂。"