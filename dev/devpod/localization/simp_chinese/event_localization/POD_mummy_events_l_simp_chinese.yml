 podmummy.4000.desc:0 "你想要干什么？"
 podmummy.4000.a:0 "练习发音。"
 podmummy.4000.b:0 "学习新的真名"
 podmummy.4100.t:0 "$learning_true_names_head$练习发音"
 podmummy.4100.desc:0 "真名魔法来得并不容易。真名必须被理解，并以严格的方式发音。一个不耐烦的书写人会发现，她说得不恰当的列涅不会产生任何效果。"
 podmummy.4100.a:0 "我有时间。"
 podmummy.4101.t:0 "$learning_true_names_head$练习发音"
