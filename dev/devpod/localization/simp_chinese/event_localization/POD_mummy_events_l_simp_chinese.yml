 podmummy.4200.t:0 "$learning_true_names_head$发现新名"
 podmummy.4200.desc:0 "学习一个真名并不是简单的听一次名字就可以了。它是一个将名字分解成各个组成它的词，学习每个词的含义，学习它们的正确发音和节奏，然后将它们重新组合成列涅的课题。"
 podmummy.4200.a:0 "这需要时间和投入。"
 podmummy.4201.t:0 "$learning_true_names_head$新名发现"
 podmummy.4201.desc_opening:0 "你成功发现了一个新真名——"
 podmummy.4201.desc_fallback:0 "或你并没发现任一个。"
 podmummy.4201.desc_ending:0 "！"
 podmummy.4201.a:0 "这需要时间和投入。"
