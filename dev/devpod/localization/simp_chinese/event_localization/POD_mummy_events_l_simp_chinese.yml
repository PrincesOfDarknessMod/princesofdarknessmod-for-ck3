 podmummy.5000.t:0 "古墓王"
 podmummy.5000.desc:0 "木乃伊是真正的不朽者，但他们的灵魂在每次 “死亡”后可能会在来世逗留一段时间。因此，在这段时间内，肉体必须得到适当的预备和仆人的照顾。在很久以前，伟大的埃及木乃伊为自己建造了神话般的陵墓（甚至是金字塔），以妥善保护他们的身体。然而，这个时代早已一去不复返，这些古墓大多年久失修或早已被土匪洗劫一空。\n尽管如此，需求仍然存在，你现在正在考虑如何为你下一次进入来世的旅行做最好的准备。一个选择是使用现有的古墓（也许甚至是你过去的陵墓）并重新打点它，另一个选择是建立一个适合你的新的埋葬地点，远离窥视和贪婪的手。"
 podmummy.5000.a:0 "我们将使用一个现有的地方。"
 podmummy.5000.b:0 "只有新墓才行!"
 increase_tomb_quality_tt:0 "你的古墓质量将提升。"
 decrease_tomb_quality_tt:0 "你的古墓质量将降低。"
 podmummy.5001.t:0 "合适的死亡地点"
 podmummy.5001.desc:0 "在考虑你的墓时，要评估的一个重要问题是它的周围环境。地震，无论是自然地震还是由你的敌人引发的地震，都和任何掠夺者一样具有潜在的致命性。许多粗心的木乃伊在复活后发现自己被埋在沙子和岩石下，不得不在几年甚至几十年内痛苦地抓出自己的身体。你很想避免这种命运。\n如果你对你所在地区的地形足够了解，你可以自己进行这项调查。否则，以虚假的借口雇用一些有学问的人应该是很容易的，尽管成本较高。"
 podmummy.5001.a:0 "我将进行彻底的检查。"
 podmummy.5001.b:0 "我需要一些技术上的帮助。"
 podmummy.5001.effect.success.desc:0 "找到了最完美的地点。"
 podmummy.5001.critical.failure.effect.desc:0 "这看起来还行。也许吧。"
 podmummy.5002.t:0 "古墓政治"
 podmummy.5002.desc:0 "人类文明似乎一直在增长。曾经是完美的藏身之处的偏远地区现在已经成为繁荣的新社区，这对一个醒来的木乃伊来说可能意味着麻烦。很难找到一个现实中不会被凡人触及而又对你有用的地方，所以你把精力放在确保当地政府你计划使用的某个区域上设立禁区。这不一定能成，但它应该让那些讨厌的好奇的凡人暂时远离。\n尽管如此，还是有所顾虑，凡人当局来来去去，所有这些努力到头来都可能是徒劳的。也许将你新发现的影响力用于其他的前景可能是更明智的行动方案。"
 podmummy.5002.a:0 "仍是最好的解决方案。"
 podmummy.5002.b:0 "转移一些影响来帮助当地人。"
 podmummy.5002.c:0 "放弃这个地区作为你的古墓的潜在场所。"
 podmummy.5002.effect.success.desc:0 "现在凡人都避开这个区域。"
 podmummy.5002.critical.failure.effect.desc:0 "离开我的草坪！"
 podmummy.5003.t:0 "古墓建筑"
 podmummy.5003.desc:0 "建造一个合适的古墓需要大量的规划。即使没有达到古代金字塔的程度，也需要大量的人力、材料和熟练的建筑师。这些都不便宜，也不容易，而且木乃伊可以简单地命令凡人去做的时代已经过去了。因此，它需要一些规划技巧和与商人公会等的稳固联系来实现所需的结果。\n如果你想把建墓的优先级降低一点的话，这一大笔投入也可以用来改善当地的环境。"
 podmummy.5003.a:0 "我将使这一工作顺利进行。"
 podmummy.5003.b:0 "更多的金钱将解决任何问题。"
 podmummy.5003.c:0 "古墓可以放一放。"
 podmummy.5003.effect.success.desc:0 "按部就班地进行。"
 podmummy.5003.critical.failure.effect.desc:0 "太多的延误了……"
 podmummy.5004.t:0 "古墓守卫"
 podmummy.5004.desc:0 "古墓在任何时候都需要守卫。当木乃伊的肉体毫无防备地躺在里面时，你所有的敌人（甚至只是随机的盗贼）都可能闯入并亵渎你的圣地。因此，你要准备好你的护墓队，以便在你的埋葬地和附近进行战斗的特殊目的。不过这些训练是非常专业的，在战场上不太适用。\n你可以把训练范围扩大一些，但这很可能意味着你选择的守墓人在守墓方面的专业知识会减少。"
 podmummy.5004.a:0 "守墓人需要学习守墓，仅此而已。"
 podmummy.5004.b:0 "我们可以把视野放宽一点。"
 podmummy.5004.c:0 "在场上的实际演练将是有益的。"
 podmummy.5004.critical.failure.effect.desc:0 "不要再跑到陷阱里去了！"
 podmummy.5005.t:0 "陷——阱——！"
 podmummy.5005.desc:0 "任何名副其实的古墓都需要陷阱。虽然你的守卫可以掩盖大多数危险，但仍有可能有特别坚定（或狡猾）的敌人会越过他们。这就是精心设计的陷阱的用处。\n老式的巨石、飞镖或死亡之坑当然有其优点，但木乃伊还有其他更神秘的选择。利用你大量的炼金术和活化雕像，你可以为任何愚蠢到进入你的埋葬地的人制作一些真正特别的东西。如果你愿意的话，它也可以作为一个很好的训练场来训练新的赫考技艺。"
 podmummy.5005.a:0 "先设陷阱，后做实验。"
 podmummy.5005.b:0 "先做实验，后设陷阱。"
 podmummy.5006.t:0 "古墓丽影"
 podmummy.5006.desc:0 "你的古墓甚至还没有完工，就已经有讨厌的流氓试图从建筑工地上偷取材料，或者开始为珍贵的珠宝溜入。好吧，如果他们期望发现一个很容易被偷走的沉睡木乃伊，他们会非常失望的。\n现在是时候让你给这群人做个榜样了，希望能给所有的冒险者一个明确的信息，让他们不要乱动你的陵墓。"
 podmummy.5006.a:0 "你闯入了错误的墓穴！"
 podmummy.5006.b:0 "你确确实实的闯入了错误的墓穴！"
 podmummy.5006.effect.success.desc:0 "这将教训他们。"
 podmummy.5006.critical.failure.effect.desc:0 "不是一个好的先例……"
 podmummy.5007.t:0 "古墓装饰"
 podmummy.5007.desc:0 "将木乃伊与珠宝、装饰性雕像和其他宝物一起埋葬是一个强大的传统。虽然有点问题，因为它往往会吸引小偷，但如果你不确保所有东西都以适当的风格装饰在古墓里，会被认为是相当低俗的。\n不使用任何装饰当然是可能的，但会对你的名望产生不好的影响。"
 podmummy.5007.a:0 "用黄金装饰一切！"
 podmummy.5007.b:0 "让我们保持节俭。"
 podmummy.5007.c:0 "石头是足够的装饰。"
 podmummy.5009.t:0 "古墓建筑师"
 podmummy.5009.desc:0 "由于你决定建造一个新的古墓，而不是使用现有的古墓，你一直在学习建筑知识和建造一个可以持续很长时间的建筑物的细微之处。在对你的杰作进行最后润色时，你正在考虑利用这些新发现的知识进行一些最后几分钟的修改。这将是昂贵的，但可以改善整体结构，并将你的新发现的一些知识付诸实践。"
 podmummy.5009.a:0 "收尾工作。"
 podmummy.5009.b:0 "没有这个必要。"
 podmummy.5009.c:0 "完美的点睛之笔。"
 podmummy.5010.t:0 "古墓回忆"
 podmummy.5010.desc:0 "由于你决定修复你的一个旧葬地，自从你开始工作以来，记忆一直在涌现。除了怀旧的感觉外，回忆起你很久以前在那里布下的古老陷阱也很有用。\n在探索这个地方的同时，避开古时自己准备的招数，让你觉得自己在与自己进行狡诈和智力的较量。相当令人振奋的感觉，尽管可悲的是，过去在这里结束（或开始）的无数次来世之旅往往给它蒙上了阴影。"
 podmummy.5010.a:0 "计时赛！"
 podmummy.5010.b:0 "缓慢而谨慎。"
 podmummy.5010.c:0 "我在睡梦中都能做到！"
 podmummy.5011.t:0 "古墓开张"
 podmummy.5011.desc:0 "经过多年的精心准备和无计划的试验，你终于对你的古墓的位置和布局感到满意。从现在开始，每次你被召唤回到来世时，你的肉体都会被你的侍者小心翼翼地带到这里，然后你的卫兵会启动陷阱并封住这里，防止任何人打扰你最终的回归。\n只有时间能告诉我们，这个地方是否会永远隐藏在人类的视线之外，或者在某个时候必须建造一个新的地方。但在那之前，你的安息之所，希望能配得上你的辉煌，终于完成了。"
 podmummy.5011.a:0 "永恒在等待。"
 building_type_mummy_tomb_01:0 "古墓"
 building_type_mummy_tomb_01_desc:1 "#F 一个由强大的木乃伊专门制作的休养地，他们希望在每次死亡后有一个安全和安稳的休养地。#!"
 building_mummy_tomb_01:0 "奇墓"
 building_mummy_tomb_01_desc:1 "一处小型的埋葬地点，隐藏得很好，但并不张扬。"
 building_mummy_tomb_02:0 "古墓"
 building_mummy_tomb_02_desc:1 "几个相连的房间，有陷阱和足够的装饰，适于一个受人尊敬的王。"
 building_mummy_tomb_03:0 "大墓地"
 building_mummy_tomb_03_desc:1 "一个庞大的迷宫，可以包含数个陵墓，外观雄伟，陷阱致命。"
 building_mummy_tomb_04:0 "金字塔"
 building_mummy_tomb_04_desc:1 "就像古代的金字塔一样，这座雄伟的古墓将吸引冒险家和考古学家们的目光，直到永远。如果他们能找到它的话。"
