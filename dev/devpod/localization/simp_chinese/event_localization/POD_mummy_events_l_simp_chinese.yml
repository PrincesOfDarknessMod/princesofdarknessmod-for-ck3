 POD_mummy_hekau.201.option.a.tt.failure:0 "你没能分隔你的黑影"
 POD_mummy_hekau.201.option.b:0 "还不到时候"
 POD_mummy_hekau.201.option.b.tt:0 "你将放弃斩出黑影的想法"
 POD_mummy_hekau.202.t:0 "分离黑影（二）"
 POD_mummy_hekau.202.desc:0 "通过你对通灵赫考的掌握，你成功将你的黑影斩出体外，现在可以给它下达命令了。"
 POD_mummy_hekau.202.option.a:0 "我的专属怨灵"
