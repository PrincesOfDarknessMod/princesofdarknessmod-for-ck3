 POD_show_known_true_names_events.110.t:0 "植物和真菌"
 POD_show_known_true_names_events.110.desc:0 "知晓植物和真菌真名的阿蒙提可以对土地施加各种祝福或诅咒。他们还可以将自己的变成植物或真菌。"
 POD_show_known_true_names_events.110.option.a:0 "好"
 POD_show_known_true_names_events.110.option.b:0 "回到先前菜单"
 POD_show_known_true_names_events.120.t:0 "人体部位"
 POD_show_known_true_names_events.120.desc:0 "知晓人体部位的阿蒙提可以使身体部位枯萎或重新生长。"
 POD_show_known_true_names_events.130.t:0 "动物"
 POD_show_known_true_names_events.130.desc:0 "知晓动物真名的阿蒙提可以将这些动物召唤到自己身边作为宠物，或者变身为该动物。"
 POD_show_known_true_names_events.140.t:0 "金属"
 POD_show_known_true_names_events.140.desc:0 "知晓金属真名的阿蒙提可以将贵金属召唤出来，或将自己的皮肤转化为该金属。"
 POD_mummy_resurrection.100.t:0 "审判"
 POD_mummy_resurrection.100.desc:0 "你死了，现在你正处于[underworld|E]，且得通过审判来证明你值得重生。"
 POD_mummy_resurrection.100.a:0 "称量我的罪恶。"
 POD_mummy_resurrection.101.t:0 "复活进行时"
 POD_mummy_resurrection.101.desc:0 "即使通过了审判，依然需要时间来重塑你的身体以复活。不过，你可以使用一些道具来缩短这过程。"
 POD_mummy_resurrection.101.a:0 "使用卓越级生命圣甲虫。"
 POD_mummy_resurrection.101.b:0 "使用名作级生命圣甲虫。"
 POD_mummy_resurrection.101.c:0 "使用大师级生命圣甲虫。"
 POD_mummy_resurrection.101.d:0 "使用普通级生命圣甲虫。"
 POD_mummy_resurrection.101.e:0 "我没有相关道具。"
 POD_mummy_hekau.100.t:0 "动产"
 POD_mummy_hekau.100.desc:0 "你可以激活一个动产，使其成为你当前装备的宝物（不包括饰品）的复制品。如果你没有装备任何宝物，或者你的动产的等级低于该宝物的稀有度，这将是不可行，比如低级动产只能是普通级宝物的复制品，复杂动产可以是大师级……以此类推。"
 POD_mummy_hekau.100.a:0 "造出我武器的复制品。"
 POD_mummy_hekau.100.b:0 "造出我盔甲的复制品。"
 POD_mummy_hekau.100.c:0 "造出我礼器的复制品。"
 POD_mummy_hekau.100.d:0 "造出我冠冕的复制品。"
 POD_mummy_hekau.100.e:0 "我现在不想制造复制品。"
 POD_mummy_hekau.201.t:0 "分离黑影"
 POD_mummy_hekau.201.desc:0 "通过你对通灵赫考的掌握，你能将你的黑影斩出体外作为一位怨灵仆从。"
 POD_mummy_hekau.201.option.a:0 "出来吧，我的影子！服侍我。"
 POD_mummy_hekau.201.option.a.tt:0 "你尝试将你的黑影分出来。"
