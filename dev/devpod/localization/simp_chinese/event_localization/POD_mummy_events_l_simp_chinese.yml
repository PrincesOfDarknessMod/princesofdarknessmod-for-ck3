l_simp_chinese:
 podmummy.1000.a: "谁敢打扰我的睡眠？！"
 podmummy.1000.b: "是时候亲手碾碎这些讨厌的蚂蚁了。"
 podmummy.1000.c: "我还有更重要的事情去做。"
 learning_true_names_head: "学习真名："
 POD_mummy_scheme.100.t: "塞赫美特之眼"
 POD_mummy_scheme.100.desc: "你将萨赫麦特的符号刻在目标身上，使伤口愈合更难愈合。"
 POD_mummy_scheme.100.a: "很好。"
 POD_discover_true_name_outcome.2000.t: "你没能知晓[target.GetTitledFirstNamePossessive]的列涅！"
 POD_discover_true_name_outcome.2000.desc: "在花了几个月的时间将名分解成各个组成它的词，学习每个词的含义，学习它们的正确发音和节奏，并试图发现它们的内在本质后，我失败了。"
 POD_discover_true_name_outcome.2000.a: "我放弃。"
 POD_discover_true_name_outcome.2000.b: "[target.GetTitledFirstNamePossessive]的列涅受我掌控！"
 POD_command_effigy_ongoing.1030.option.b.t.PAY_MINOR: "便宜价格"
 POD_command_effigy_ongoing.1030.option.b.t.PAY_MEDIUM: "适中价格"
 POD_command_effigy_ongoing.1030.option.b.t.PAY_MAJOR: "昂贵价格"
 POD_show_known_true_names_events.100.t: "已知真名"
 POD_show_known_true_names_events.100.desc: "[PlayerGuiBuildTooltip('POD_display_known_ren_sgui')]"
 POD_show_known_true_names_events.100.option.a: "好"
 POD_show_known_true_names_events.100.option.b: "知晓植物可以做什么？"
 POD_show_known_true_names_events.100.option.c: "知晓人体部位可以做什么？"
 POD_show_known_true_names_events.100.option.d: "知晓动物可以做什么？"
 POD_show_known_true_names_events.100.option.e: "知晓金属可以做什么？"
 POD_show_known_true_names_events.110.t: "植物"
 POD_show_known_true_names_events.110.desc: "知晓植物真名的阿蒙提可以对土地施加各种祝福或诅咒。他们还可以将自己的变成植物或真菌。"
 POD_show_known_true_names_events.110.option.a: "好"
 POD_show_known_true_names_events.110.option.b: "回到先前菜单"
 POD_show_known_true_names_events.130.t: "动物"
 POD_show_known_true_names_events.130.desc: "知晓动物真名的阿蒙提可以将这些动物召唤到自己身边作为宠物，或者变身为该动物。"
 POD_show_known_true_names_events.140.t: "金属"
 POD_show_known_true_names_events.140.desc: "知晓金属真名的阿蒙提可以将贵金属召唤出来，或将自己的皮肤转化为该金属。"
 POD_mummy_hekau.201.t: "分离黑影"
 POD_mummy_hekau.201.desc: "通过你对通灵赫考的掌握，你能将你的黑影斩出体外作为一位怨灵仆从。"
 POD_mummy_hekau.201.option.a: "出来吧，我的影子！服侍我。"
 POD_mummy_hekau.201.option.a.tt: "你尝试将你的黑影分出来。"
 POD_mummy_hekau.201.option.a.desc: "与你黑影的斗争"
 POD_mummy_hekau.201.option.a.tt.success: "你的黑影被成功分了出来"
 POD_mummy_hekau.201.option.a.tt.failure: "你没能分隔你的黑影"
 POD_mummy_hekau.201.option.b: "还不到时候"
 POD_mummy_hekau.201.option.b.tt: "你将放弃斩出黑影的想法"
 POD_mummy_hekau.202.t: "分离黑影（二）"
 POD_mummy_hekau.202.desc: "通过你对通灵赫考的掌握，你成功将你的黑影斩出体外，现在可以给它下达命令了。"
 POD_mummy_hekau.202.option.a: "我的专属怨灵"
 POD_mummy_hekau.202.option.a.tt: "你的黑影被成功分了出来"
 POD_mummy_hekau.203.t: "分离黑影（二）"
 POD_mummy_hekau.203.desc: "即使以是你目前对通灵赫考的掌握，也不足以斩出你的黑影……目前而言。"
 POD_mummy_hekau.203.option.a: "我还没准备好"
 POD_mummy_hekau.203.option.a.tt: "你没能分隔你的黑影"
 POD_mummy_hekau.204.t: "黑影的回归"
 POD_mummy_hekau.204.desc: "你斩出的黑影受到了意外，并不得不回归。"
 POD_mummy_hekau.204.option.a: "我的影子回归了"
 POD_mummy_hekau.204.option.a.tt: "你的黑影和你又合一了"
 POD_mummy_resurrection.1.t: "真是永生不死吗？"
 POD_mummy_resurrection.1.desc: "当木乃伊死亡时，它们的灵魂会进入一个漫长（且不愉快）的过程，被抛入一个名为[UmbraGlossary('tempest')]灵界。在那里，它们慢慢地返回[UmbraGlossary('earth')]。此外，某些类型的木乃伊$POD_splat_mummy_plural$也会被审判。\n贤荷鲁木乃伊会前往埃及亡者的国度阿蒙提，与阿努比斯和玛阿特的审判者见面，而卡比里木乃伊则会前往哈迪斯，在那里它们必须在一个更恶劣的环境中自谋生路。"
 POD_mummy_resurrection.1.a: "审判我吧。"
 POD_mummy_resurrection.1.a.tt: "死后，你将根据你的正道受到审判。"
 POD_mummy_resurrection.1.b: "我失去了重要的东西……"
 POD_mummy_resurrection.1.b.tt: "由于你根基不稳，你在[UmbraGlossary('tempest')]中失去了一部分自我。"
 POD_mummy_resurrection.1.c: "主人，我失败了。"
 POD_mummy_resurrection.1.c.tt: "$glossary_wyrm_apophis$从不会对失败者仁慈……"
 POD_mummy_resurrection.1.d: "我会回来的"
 POD_mummy_resurrection.1.d.tt: "凭借深厚的根基，你安然渡过了[UmbraGlossary('tempest')]，未受半分损耗。"
 POD_mummy_resurrection.2.t: "玛阿特的天平"
 POD_mummy_resurrection.2.desc: "你已死去，如今发现自己身处[UmbraGlossaryLocalized('shadowlands','冥界')]，必须通过审判以证明你值得复活。\n首先需要等待阿努比斯找到你，这一过程可能漫长而煎熬，随后你将被带到玛阿特的审判者面前，由他们评估你在前世是否努力维护了平衡之道。"
 POD_mummy_resurrection.2.a: "称量我的罪恶。"
 POD_mummy_resurrection.2.a.tt: "你将受到的惩罚基于你的正道等级。"
 POD_mummy_resurrection.2.b: "我不需要你。"
 POD_mummy_resurrection.2.b.tt: "你将另寻新主，成为你曾誓言毁灭的存在。"
 POD_mummy_resurrection.2.c: "我会做得更好！"
 POD_mummy_resurrection.2.c.tt: "你会向审判者求情。未来50年内，此举将不再奏效。"
 podmummy.1.homelandandtomb: "[POD_homeland|E]与墓穴"
 podmummy.1.homeland: "[POD_homeland|E]:"
 podmummy.1.tomb: "因你的古墓"
 podmummy.1000.t: "盗墓贼！"
 podmummy.1000.desc: "你的古墓中存放着大量前世的情感寄托之物……而在粗鄙的现代人眼中，这些却是无价之宝。盗墓传统与陵墓本身一样古老，成为木乃伊永恒的困扰，他们常在新轮回苏醒时发现关键纪念品不翼而飞。\n为此，木乃伊发展出密教与陷阱来保护属于自己的财物，但有时即使最严密的防御也会被这些恼人的冒险者以纯粹运气攻破。"
 podmummy.1001.t: "吸血鬼盗墓贼！"
 podmummy.1001.desc: "自接触伊始，吸血鬼便对木乃伊深深着迷。这种（看似）更\"纯粹\"、不受该隐诅咒的永生形态令他们心驰神往，尤其当吸血鬼视木乃伊为真正的永生者，即便终极死亡也只是新轮回的开始。因此，许多吸血鬼痴迷于揭开你们族类的秘密也就不足为奇。\n遗憾的是，他们往往与普通盗墓贼无异，将你的遗物视为破解秘密的钥匙。但吸血鬼通常更具威胁性，因为他们深知你的能力，并掌握凡人盗墓者梦寐以求的力量。"
 podmummy.1001.a: "我该建造一座日光浴陵墓……"
 podmummy.1001.b: "我会让你见识真正的永生！"
 podmummy.1001.c: "我还有更重要的事情去做。"
 POD_not_in_homelands_tt: "你不在你的[POD_homeland|E]，因此未能获取任何记忆。"
 POD_no_tomb_memory_tt: "\n你的陵墓没有提供任何记忆。"