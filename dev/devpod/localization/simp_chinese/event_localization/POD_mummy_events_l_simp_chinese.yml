 podmummy.1000.c:0 "稀有材料"
 podmummy.1000.d:0 "珍稀材料"
 podmummy.1000.e:0 "独特材料"
 podmummy.1010.t:0 "$alchemy_preparaion_head$鉴定"
 podmummy.1010.desc:0 "知识就是力量。具体了解任何物体、生物或物质的组成，就能使炼金术师对其有所掌控。炼金术师能意识到物质的固有特性，而这些特性是单纯的化学家所无法发现的。"
 podmummy.1010.b:0 "只用学识来鉴定"
 podmummy.1010.a:0 "使用能力来鉴定"
 podmummy.1010.fail:0 "失败"
 podmummy.1010.fail_result:0 "材料失去了略微的有效度"
 podmummy.1010.critical_fail:0 "大失败"
 podmummy.1010.critical_fail_result:0 "材料失去了所有的有效度"
 podmummy.1110.t:0 "$alchemy_preparaion_head$嬗变"
 podmummy.1110.desc:0 "许多炼金术过程仅仅是为了将一种物质变成另一种物质，比如众所周知的从贱金属中创造黄金的追求。其结果可能是原本物质的提纯形式，全新的物质，又或者是奇怪的混合物。"
 podmummy.1110.a:0 "使用能力来嬗变"
 podmummy.1110.b:0 "使用能力来停滞"
 podmummy.1110.fail:0 "失败"
 podmummy.1110.fail_result:0 "材料失去跟你的溯源技能等级成正比的有效度。"
 podmummy.1210.t:0 "$alchemy_preparaion_head$催化"
 podmummy.1210.desc:0 "许多炼金术制剂的主要目标是能够引起其他物质或形式的变化。在极度熟练后，炼金术师甚至可以把自己的身体变成催化剂，以引起周围世界的变化。"
 podmummy.1210.a:0 "我成功了！#weak （有效度[ROOT.Var('alchemy_craft_outcome').GetValue|0]）#!"
 podmummy.1999.t:0 "$alchemy_preparaion_head$结果"
 podmummy.1999.desc_super_fail:0 "爆炸！你受伤了。"
 podmummy.1999.desc_fail:0 "你制作出了失败作。"
 podmummy.1999.desc_trash:0 "空无"
 podmummy.1999.desc_comma:0 "、"
 podmummy.1999.a:0 "啊啊！"
 podmummy.1999.b:0 "我不需要这个……"
 podmummy.1999.c:0 "就这样吧。"
