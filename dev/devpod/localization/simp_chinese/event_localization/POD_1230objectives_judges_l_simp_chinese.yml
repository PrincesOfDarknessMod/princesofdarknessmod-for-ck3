l_simp_chinese:
 pod_judges_promised_land: "应许之地"
 e_judges_title: "判官"
 e_judges_title_adj: "判官"
 judge_reclaim_promised_land_objective_decision: "安顿判官"
 judge_reclaim_promised_land_objective_decision_desc: "判官们是一个松散的团体，各自主要保护自己的社群。我们可以效仿暗影再征服，团结于共同的旗帜下，如此便能高效得多。我们只需要一位凝聚人心的领袖和一场奠基性的胜利来实现这一点。"
 judge_reclaim_promised_land_objective_decision_confirm: "新的开始"
 judge_reclaim_promised_land_objective_decision_tooltip: "一族之监护，正在联合。"
 judge_get_mystic_decision: "研习智者之道"
 judge_get_mystic_decision_desc: "为了恰当地履行我的职责，我应当研习祖先的古老与神秘之道。我将从他们的智慧中受益，成长为真正的智者。"
 judge_get_mystic_decision_confirm: "开始吧"
 judge_get_mystic_decision_tooltip: "我将研习先祖的道途，成为智者"
 judge_verify_christian_claim_objective_decision: "十字架的纠纷"
 judge_verify_christian_claim_objective_decision_desc: "在我们能全心投入协助基督教会猎捕受诅者之前，必须先与他们解决神学上的分歧。"
 judge_verify_christian_claim_objective_decision_confirm: "实用主义必将主宰"
 judge_verify_christian_claim_objective_decision_tooltip: "我们疏远的神学后裔"
 judge_contact_magi_objective_decision: "联系魔法师"
 judge_contact_magi_objective_decision_desc: "遵循先知但以理所确立的传统，司祭们长期以来一直修习一种更线性的魔法。此外，在这黑暗的时代，他们也是仅存的少数米兹拉希审判者之一。让我们重新与他们取得联系，以协调各个单位的行动。"
 judge_contact_magi_objective_decision_confirm: "让我们和他们谈谈"
 judge_contact_magi_objective_decision_tooltip: "我们将向米兹拉希和他们的司祭学习"
 judge_contact_ashkenazic_objective_decision: "联络阿肯纳什齐审判者"
 judge_contact_ashkenazic_objective_decision_desc: "阿什肯纳兹民长比大多数人更深入地研究了《造化之书》。拉比·巴力·舍姆创造构装体的能力众所周知，也正是这项能力使他们得以在被诅咒者之中生存。此外，他们还赢得了本地区两名被诅咒者的庇护。让我们重新与他们取得联系，以协调各个单位的行动。"
 judge_contact_ashkenazic_objective_decision_confirm: "让我们和他们谈谈"
 judge_contact_ashkenazic_objective_decision_tooltip: "我们将向阿什肯纳齐学习"
 judge_contact_ashkenazic_objective_decision_befriend_josef: "布拉格的守护者 [GetScriptedCharacterByHistoryID('505089').GetFirstName]必须是你的[friend|E]、[lover|E]、[soulmate|E]，或[GetPlayer.Custom('PODCoterie')]成员，只要祂们仍然存在并活动"
 judge_contact_ashkenazic_objective_decision_befriend_yitzhak: "阿什肯纳齐拉比，[GetScriptedCharacterByHistoryID('790246').GetFirstName]必须是你的[friend|E]、[lover|E]、[soulmate|E]或[GetPlayer.Custom('PODCoterie')]成员，只要祂们仍然存在并活动"
 judge_contact_esraelawi_objective_decision: "联络以色拉维审判者"
 judge_contact_esraelawi_objective_decision_desc: "为了保护我们的同胞，所有审判者都被迫成为士兵与战士。然而，以色拉维审判者则特别保留了但支派的武士传统。若我们能向他们证明自身的价值，他们或许愿意将这些传统教授给我们。"
 judge_contact_esraelawi_objective_decision_confirm: "让我们和他们谈谈"
 judge_contact_esraelawi_objective_decision_tooltip: "我们将向以色拉维学习"
 judge_contact_kochinim_objective_decision: "联络柯枝审判者"
 judge_contact_kochinim_objective_decision_desc: "只要付出一些金钱并承受更高的公众曝光，我们便能够与在印度的兄弟们取得联系。柯枝以其贸易网络及围绕该网络构建的情报体系而闻名；与他们接触应能让我们利用好这两项优势。"
 judge_contact_kochinim_objective_decision_confirm: "让我们和他们谈谈"
 judge_contact_kochinim_objective_decision_tooltip: "我们将向柯枝学习"
 judge_contact_sephardim_objective_decision: "联络塞法迪审判者"
 judge_contact_sephardim_objective_decision_desc: "我们在伊比利亚与北非的同胞，以对《塔纳赫》之外经文的理解见长，并以在那些动荡之地中求生的本领而闻名。若我们能与他们取得联系并帮助解决他们所面临的一些难题，他们应当能够协助我们未来的行动。"
 judge_contact_sephardim_objective_decision_confirm: "让我们和他们谈谈"
 judge_contact_sephardim_objective_decision_tooltip: "我们将向塞法迪学习"
 judge_research_origins_mummies_objective_decision: "确定不朽者的起源"
 judge_research_origins_mummies_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几。我们应该找寻到#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L 不朽者#!#!，或称木乃伊的起源。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_mummies_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_mummies_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_mummies_objective_decision_benefit: "我们发现了#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L 不朽者#!#!的起源"
 judge_research_origins_mummies_objective_decision_befriend_cabirus: "独立的木乃伊，[GetScriptedCharacterByHistoryID('792600').GetFirstName]必须是你的[friend|E]、[lover|E]、[soulmate|E]或[GetPlayer.Custom('PODCoterie')]成员，只要祂们仍然存在并活动"
 judge_research_origins_demons_objective_decision: "确定堕天使的起源"
 judge_research_origins_demons_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几。我们应该找寻到#TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L 堕天使#!#!，或称恶魔的起源。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_demons_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_demons_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_demons_objective_decision_benefit: "我们发现了#TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L 堕天使#!#!的起源"
 judge_research_origins_fae_objective_decision: "确定妖精的起源"
 judge_research_origins_fae_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几。我们应该找寻到$POD_splat_fae$的起源，尽管由于缺乏关于其的文本记载，将迫使我们转向搜寻其他的信息来源。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_fae_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_fae_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_fae_objective_decision_benefit: "我们发现了$POD_splat_fae$的起源"
 judge_research_origins_wraiths_objective_decision: "确定死灵的起源"
 judge_research_origins_wraiths_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几。我们应该找寻到$POD_splat_wraith_plural$的起源，甚至可能的话，通过冥想亲自与这些存在沟通。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_wraiths_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_wraiths_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_wraiths_objective_decision_benefit: "我们发现了$POD_splat_wraith_plural$的起源"
 judge_research_origins_kueijin_objective_decision: "确定鬼人的起源"
 judge_research_origins_kueijin_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几。我们应该找寻到$pod_kueijin$，或称万仙的起源。也许可能的话，我们会在祂们堕落之前，发现祂们最初的回归起源。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_kueijin_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_kueijin_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_kueijin_objective_decision_benefit: "我们发现了$POD_splat_kueijin$的起源"
 judge_research_origins_therianthropes_objective_decision: "确定化形者的起源"
 judge_research_origins_therianthropes_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几。我们应该找寻到[Glossary('化形者', 'glossary_fera_tt')]的起源，甚至可能的话，通过冥想亲自与这些存在沟通。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_therianthropes_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_therianthropes_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_therianthropes_objective_decision_benefit: "我们发现了[Glossary('化形者', 'glossary_fera_tt')]的起源"
 judge_research_origins_mortal_magic_objective_decision: "确定凡人魔法的起源"
 judge_research_origins_mortal_magic_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几。我们应该找寻到凡人魔法的起源，甚至可能的话，尝试学习它们全部。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_mortal_magic_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_mortal_magic_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_mortal_magic_objective_decision_benefit: "你将获得赫考、丹和窍的力量。"
 judge_research_origins_vampires_3rdgen_objective_decision: "研究三代血族的起源"
 judge_research_origins_vampires_3rdgen_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几，而其中受诅咒者的隐秘是尤为重要的。我们的第一步是研究[Glossary('上古耆宿','game_concept_antediluvian_desc')]们在大洪水之后的活动。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_vampires_3rdgen_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_vampires_3rdgen_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_vampires_3rdgen_objective_decision_benefit: "你发现了[Glossary('上古耆宿','game_concept_antediluvian_desc')]的历史，那大洪水后建立的第二城"
 judge_research_origins_vampires_2ndgen_objective_decision: "研究二代血族的起源"
 judge_research_origins_vampires_2ndgen_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几，而其中受诅咒者的隐秘是尤为重要的。我们的第二步是研究被称为二代血族的存在，以及祂们在大洪水之前的活动。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_vampires_2ndgen_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_vampires_2ndgen_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_vampires_2ndgen_objective_decision_benefit: "我们发现了​第二代吸血鬼以及大洪水之前第一城​的历史。"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision: "研究血律的起源"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几，而其中受诅咒者的隐秘是尤为重要的。我们的下一步是研究受诅咒者们那被称作血律的异能，以及祂们与我们憎恨之敌——莉莉丝的联系。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_benefit: "我们发现了被诅咒者律能的起源。"
 judge_research_origins_vampires_caine_n_abel_objective_decision: "研究该隐的起源"
 judge_research_origins_vampires_caine_n_abel_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几，而其中受诅咒者的隐秘是尤为重要的。我们的下一步是研究该隐本身的起源。我们将把所有发现记录在一本名为《起源》的著作中。"
 judge_research_origins_vampires_caine_n_abel_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_vampires_caine_n_abel_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_vampires_caine_n_abel_objective_decision_benefit: "我们发现了该隐本身的起源。"
 judge_research_origins_vampires_golconda_objective_decision: "研究救赎的可能性。"
 judge_research_origins_vampires_golconda_objective_decision_desc: "我们知道耶和华创造万物，拣选我们作祂的子民。然而，我们对祂的创世宇宙所知寥寥无几其中最主要的就是受诅咒者。最后一步是研究受诅咒者获得救赎的可能性。我们将把研究成果记录在一部名为《起源》的著作中。"
 judge_research_origins_vampires_golconda_objective_decision_confirm: "让我们寻找真相"
 judge_research_origins_vampires_golconda_objective_decision_tooltip: "隐秘事物是　神的荣耀，而研究它们则是众王的荣耀。"
 judge_research_origins_vampires_golconda_objective_decision_benefit: "我们发现了获得救赎的可能性。"
 judge_research_origins_vampires_golconda_objective_decision_befriend_nahum: "睿智谏臣，[GetScriptedCharacterByHistoryID('790237').GetFirstName]必须是你的[friend|E]、[lover|E]、[soulmate|E]或[GetPlayer.Custom('PODCoterie')]成员，只要祂们仍然存在并活动"
 judge_reclaim_promised_land_objective_decision_effect1: "你获得了裁判官头衔。"
 judge_reclaim_promised_land_objective_decision_effect2: "你成为[GetFaithByKey('judge').GetName]的信仰领袖。"
 judge_reclaim_promised_land_objective_decision_effect3: "应许之地的所有伯爵领都将获得[GetModifier('undone_diaspora_modifier').GetNameWithTooltip]修正，并加入裁判官阵营。"
 judge_reclaim_promised_land_objective_decision_jerusalem_judge: "[GetTitleByKey('c_jerusalem').GetNameNoTier]必须皈依你的信仰。"
 judge_reclaim_promised_land_objective_decision_promised_land_capital: "你的[capital|E]已迁到[GetTitleByKey('c_jerusalem').GetNameNoTier]。"
 pod1230objectives_judges.1.t: "先知的麻葛"
 pod1230objectives_judges.1.desc: "在侍奉巴比伦与波斯诸王期间，先知达尼尔成为魔法师中的首席。凭借其术法知识与上帝的智慧，达尼尔担任魔法师首席，并向他们传授《塔纳赫》的奥秘以指导其技艺。他们观测星象以预兆未来，并研习塔木德秘经所传授的、更为直接的传统神迹术之道。\n\n随着该区域受诅者与堕天者的崛起，魔法师已被宫廷广泛摒弃为顾问，被迫退入加昂学院。他们的力量对我们而言或许成谜，但显然源自先知达尼尔的教导，这使他们成为我们的盟友。在夺回其活动中心后，我们得以在数个世纪以来首次与他们建立联系。凭借他们的智慧与米兹拉希裁判官的协助，我们能够传承曾仅由少数人掌握的秘仪，并强化我们对抗那些藏身暗影之物的永恒之战。"
 pod1230objectives_judges.1.a: "我们共同学习。"
 pod1230objectives_judges.2.t: "魔像制造者"
 pod1230objectives_judges.2.desc: "历经多方努力，我们已与该区域的阿肯纳什齐裁判官及受诅者建立了联系。受诅者无意介入我们的狩猎，仅愿庇护我们凡人同胞。尽管少数更为激进的裁判官或许对此持有异议，我们仍感激他们在庇护我们的同胞以及探寻魔像制造秘法上所提供的援助。\n依托他们拉比·巴力·舍姆——所谓的“真名掌控者”——将我们对构造体工艺的认知推进了十倍。让我们驱使这些魔像护卫我们的社群，并将那些自暗影中捕食我们的存在连根拔起。"
 pod1230objectives_judges.2.a: "我们共同守护。"
 pod1230objectives_judges.3.t: "丹的传承"
 pod1230objectives_judges.3.desc: "虽然我们可能希望成为学者或拉比，但所有的判官都被迫成为士兵和战士，因为保护我们的族人必须放在首位。然而，阿比西尼亚的以色拉维审判者们保留了我们族人——特别是但支派——古老的战士传统。赛特之子、不朽者、莱本和阿什拉派不断试图抹除我们在贝塔以色列的兄弟，这迫使以色拉维审判者必须精通战争艺术。\n既然我们已经与他们取得联系，并证明了自己有能力提供帮助，他们便传授了最古老的教义。有了这个基础，我们可以确保这些传统在我们的家族内部得以延续，助力我们完成消灭该隐与莉莉丝后裔的使命。"
 pod1230objectives_judges.3.a: "我们共同战斗。"
 pod1230objectives_judges.4.t: "贸易大师"
 pod1230objectives_judges.4.desc: "由于长期与大多数犹太社群隔绝，接触到柯枝确实费了一番功夫。他们的起源极为多元：其中一些曾是所罗门王统帅下的商人，旨在抵达那些未曾被察觉的海岸；另一些则是为了逃避那两次大流散而迁徙至此。他们的审判者必须面对同样众多的威胁，无论是印度的受诅咒者、来自西方的受诅咒者，还是从更远东方而来的饿殍。\n\n柯枝精通两个领域以求生存，而现在他们已将这两项专长赋予了我们：他们掌控着一个横跨印度及其周边地区的庞大贸易网络，为审判者们提供资金；并且他们在贸易链之上构建了一个情报网，以协助判官们的狩猎行动。"
 pod1230objectives_judges.4.a: "我们共同守望。"
 pod1230objectives_judges.5.t: "伊比利亚的外交家与神学家"
 pod1230objectives_judges.5.desc: "塞法迪犹太人几个世纪以来都在不断深化对神圣经卷的理解，并学会在充满敌意的环境中生存——在那样的环境里，前任统治者可能还予以宽容，继任者便已试图将其灭绝。这些生存技能已转化为当地审判官的本领，使他们成为我们同胞中最具效力的一支力量。\n\n虽然耗费了一些时间和精力，但我们最终成功争取到了塞法迪人的支持，并帮助缓解了他们的处境。为了感谢我们的努力，他们派遣了拉比来协助我们，共同对抗那些在阴影中蠕动的邪恶。"
 pod1230objectives_judges.5.a: "我们团结一致。"
 pod1230objectives_judges.6.t: "不朽者的起源"
 pod1230objectives_judges.6.desc: "奥西里斯是一位远古的受诅咒者，由该隐的某位子嗣进行初拥，很可能是第三或第四[Glossary('世代','game_concept_vampgeneration_desc')]$pod_cainite$。其[Glossary('尊长','game_concept_Sire_desc')]身份不明，不过在我们学者圈中，伊利耶斯（布鲁赫$pod_clan$的始祖）常被视为一个可能的人选，部分依据是将伊西斯（奥西里斯之妻）认定为莉莉丝后裔的理论。\n\n此后某人（学者指向伊利耶斯、莉莉丝，或一位名为透特的法师）归来，协助伊西斯与奈芙蒂斯追寻魔法的知识，拓展了伊西斯原有的智慧体系。\n\n凭借这些秘法（或许还利用了神之子们的缺席，导致亡魂无人引渡的漏洞？），不朽者将灵魂永久锚定于肉身，使得灵魂得以在[UmbraGlossaryLocalized('shadowlands','地狱边境')]恢复力量后重返物质世界。\n\n尽管埃及的不朽者（或称木乃伊）常与受诅咒者兵戎相见（或许是受莉莉丝操纵？），其他地区的不死者则成功避开了纷争，他们似乎找到了迥异却殊途同归的永生之道——其中甚至包括炼金术体系。"
 pod1230objectives_judges.6.a: "只有莉莉丝的子嗣才值得我们关注。"
 pod1230objectives_judges.7.t: "堕天使的起源"
 pod1230objectives_judges.7.desc: "……于是，三分之一的神之子因着贪婪和傲慢的驱使，同路西法一并叛变。有些坚信自己的谋略比神更为高明；有些企图夺取主宰人类的权柄、窃取神的大能，或是想毁灭一切眼中的不洁之物、以及那些分享了神之爱的人。还有些则对该隐的暴行之术深深着迷。无论怀着何种缘由，他们背离了神完美的造物——他们与米迦勒和他的使者作战，并没有得胜，天上再没有他们的地方。\n\n路西法被摔在地上，他的使者也一同被摔下去。他们被困于无底坑，唯有借助凡人的罪孽与狂妄方能暂时逃脱。在无底坑当中，他们静候最终的审判，那时他们将永堕欣嫩谷。\n\n因煽动叛乱的罪责，路西法承受了额外的诅咒。正如大地曾暂时交由堕落者掌管，如今堕落者也被交予他们自身的腐化之中。路西法将站在无底坑外，不受扭曲罪孽的侵蚀，只为让他亲眼见证他的使者在自己孕育的堕落中扭曲。\n\n迄今亚斯她录与亚巴顿已两次图谋以被称作“拿非利”的扭曲奴仆取代人类，而两次神粉碎了他们的计划。第一次，大洪水涤尽了所有污秽的血；为应对第二次，从我们信仰中诞生了名为基督教的新信仰。"
 pod1230objectives_judges.7.a: "我很好奇，下次他们再尝试时，“他”会作何反应。"
 pod1230objectives_judges.9.t: "耶稣的真相"
 pod1230objectives_judges.9.desc: "那个被世人通称为拿撒勒的耶稣的男人，长期以来始终是我们研究中的一个谜团。我们中的部分学者持有一种观点，认为他实质上是一位被称为麦基洗德的不朽者。如同许多不朽者一样，他拥有模拟“复活”的能力，能在一段时间后于原有的躯壳中再度苏醒。这种观点得到了相关记录的支持：当时发现他的坟墓里空无一物，仅剩下裹尸布——这正是“不朽者”完成复苏过程的典型特征。\n\n尽管这一推测极具颠覆性，但目前仍缺乏公认的可靠文献支持。我们的教团内部已达成共识：将其严格限定在“假说”范畴内，以避免激怒与我们并肩作战的基督徒猎人。过去无数次的经验证明，与他们的合作成果斐然；在聚焦于真正威胁的同时，对神学分歧保持缄默，显然是一种更为务实且高效的做法。\n\n——摘自《起源》第21卷第16章草案，从未在审判者高层圈子之外发布。"
 pod1230objectives_judges.9.a: "我们可以接受这种分歧"
 pod1230objectives_judges.11.t: "妖精的起源"
 pod1230objectives_judges.11.desc: "所有的人都是照着上帝的形象和样式造的。正如祂是万物的创造者，人类亦渴望并能够进行创造。作为祂微弱的倒影，人类可以将他们的梦想与梦魇化为现实。当人类真真切切地从梦境与霓虹中创造出事物时，妖精便诞生了，他们反映了当地任何人的理想与恐惧……\n\n他们与信仰的联系意味着：现实、悲观主义、好奇心的缺失以及混乱的匮乏，都能够从肉体上伤害他们或限制他们的力量……\n\n寒铁，通过纯粹的意志力被锻造成秩序，已知能够轻易摧毁这些梦境生物……\n\n妖精目前是邪恶的存在，是荒野及其野兽的投影，因为他们试图摧毁文明。然而，大众信仰、价值观和恐惧的充分改变，可能会导致妖精的本质发生变化，并使他们转化为狩猎中中有用的盟友。唯一的例外是那些自称为谢迪姆的群体，即所谓的真主之仆，我们认为他们诞生自莉莉丝及其后裔的梦境。他们将永远带着她的污秽。\n\n——摘录自《起源》第51卷第1及第3章，以及第52卷第20章"
 pod1230objectives_judges.11.a: "我们的信仰与梦想能否扭曲现实来协助我们的狩猎？"
 pod1230objectives_judges.12.t: "死灵的起源"
 pod1230objectives_judges.12.desc: "死灵是最基础的非自然造物，是构成其他许多存在的基石——尤其当它们依附于躯体时。本文将阐述……\n\n由于堕落者不再担任灵魂引渡者、不再将亡魂摆渡至来世，亡魂开始在地球上积聚，甚至逐渐压垮生者。更糟的是，某些堕落者主动收集死者灵魂，将其囚禁于痛苦与苦难交织的迷障之地……\n\n历经岁月，忠信的神之子刺穿这层迷障，擒获堕落者，将其带至上帝前接受审判……\n\n上帝不愿因单纯摧毁界域而惩戒困于此地陷阱的众多灵魂，于是出言分海，将迷障置于两片海洋之间。一侧赐予生者，另一侧[UmbraGlossaryLocalized('shadowlands','地狱边境')]则交付给尚未愿往生的不眠亡者……\n\n上帝赋予夏娃——这位仍在寻求与儿子和解的初代女性与母亲——遴选不眠亡者守护者的权能。为对抗[UmbraGlossaryLocalized('shadowlands','地狱边境')]残留的黑暗腐蚀，她选择了一位兽化者（狼人之一），其后来被受助的不朽者们称为阿努比斯。这种腐蚀侵蚀着困于此界域的所有灵魂，时刻在它们耳畔低语，诱使其沉沦于黑暗深渊……\n\n在摩西分开红海的同一世纪（虽未知二者是否关联），夏娃再度归来为不眠亡者择定统御者。一位迈锡尼人被授予[UmbraGlossaryLocalized('shadowlands','地狱边境')]堕落创造者之名，由此承袭了部分该界域的堕落者权能，得以分隔生死、助亡魂渡往来世。他后来被称为卡戎……\n\n凡非上帝亲创之物，终将迎来终结——因一切造物皆非完美的创造者。所谓[UmbraGlossaryLocalized('湮灭术','Oblivion')]即为此理本质。它是这片由堕落者开创的奇异界域注定的终局、崩毁与腐化。此处既无意志亦无智慧，唯有熵增显化为堕落者之恶与困于此异域的死灵之惧，使一切信息失序、所有能量溃散。\n\n摘自《起源》卷二十三，第一、二、五、六章"
 pod1230objectives_judges.12.a: "一群值得怜悯的奇怪生物。"
 pod1230objectives_judges.13.t: "鬼人的起源"
 pod1230objectives_judges.13.desc: "由于近几千年以前我方同胞在该地区的缺失，在讨论饿殍时，确切的日期难以考证。然而，其起源似乎与他们所称的“第三纪元”紧密相连。根据其命名体系，“第一纪元”是指地还是空虚混沌，渊面黑暗，上帝的灵运行在水面上的时期。他们的“第二纪元”始于上帝将光暗分家、将水分开之时，并以堕天告终——那场灾难创造了各种邪恶生物，堕天者仅是其中一部分。作为对堕天的回应，上帝（在东方被称为“玉皇大帝”）选拔了一位天使，去挑选万千仙神，作为人类的保护者与引导者……\n\n正如所有人都会被原罪玷污一样，这些仙神也被权力所腐蚀，通过窃取受其看护之人的生命来增强自身，并与堕落者交易以换取更大的力量。在因傲慢和贪欲而引发的内斗中，神之子几乎无法填补所有战死者的空缺……\n\n他们的恶行在耻辱之战中达到顶峰：他们杀害了自己的子嗣，污染了受上帝祝福、由龙类与化形者守护的圣地，并创造了九个伪日……\n\n甚至连选拔测试也被腐蚀，以至于只有邪恶之徒才能加入他们的行列……\n\n上帝不再忍耐审判，也不再施予仁慈，对这万千仙神降下了诅咒，仅有四人幸免，其中一人后来竟加入了原本与之对抗的势力。这一诅咒让他们窥见了死后等待着的折磨，并剥夺了曾经赐予他们的力量，迫使他们若想保留权能，就必须吸取人类的能量。这些曾经的仙神并非该地区唯一被困在物质界的生物，且并非所有人都被永远困住，因为上帝是仁慈的，总会为愿意行走其间的人留下回归之路……\n\n人们普遍存在一种误解，认为如今被称为鬼人的生物仅限于东亚和太平洋地区。事实上，这些前仙神和越狱的罪犯可能在任何地方产生。然而，在受诅咒者盛行的地区，他们会被当作劣族、尸妖或异常强大的死灵而被铲除。历史上，化形者自认为更加虔诚，因此对鬼人产生了仇恨与厌恶。\n虽然原因已被遗忘，但仇恨依然存在，因此化形者同样会清除领地内任何新生的鬼人。唯有东方拥有足够少、或足够开明的受诅咒者与化形者，才让鬼人得以扎根，并从那时起，他们能够简化未来鬼人的转化与嵌入过程。\n\n——摘录自《起源》第46卷第1、3及9章，以及第50卷第4章"
 pod1230objectives_judges.13.a: "我们能否复制上帝曾赋予的那些力量？"
 pod1230objectives_judges.14.t: "化形者的起源"
 pod1230objectives_judges.14.desc: "在大堕天之后，上帝选择了一位天使来选拔一万名人类的英雄与保护者。这位天使选择了那些死于堕天者之手的虔诚凡人灵魂，并给了他们第二次生命的机会。作为玛拉因重生，这些灵魂展现出了与他们曾经遭受的暴行相匹配的残酷，他们热衷于灭绝堕天者，让所有堕天者的心中都充满了恐惧。他们可以追踪并猎杀猎物到造物界的任何角落，甚至能穿透[UmbraGlossaryLocalized('shadowlands','Limbo')] 领域。在协助者的祝福下，他们可以要求大自然（包括动植物）的帮助。事实上，他们甚至可以变形成不同的动物来辅助他们的狩猎和战斗，其中熊人是他们中最古老也最智慧的一群……\n\n当时，他们根据猎杀的对象或在支持天堂军势中的角色被划分。例如，现在被称为罗基阿的那些人主要猎杀拉玛苏家族，而可汗芭丝特则与其他化形者一起被归类为重装步兵……\n\n就像许多其他存在一样，这些英雄屈服于其地位和权力的诱惑。他们奴役人类，像“受诅者”那样将人类视为牲畜。由于他们的罪行，他们被诅咒带上了与其并肩作战并长相相似的动物的天性。随着时间的推移，曾经强大的玛拉因退化成了我们今天所知的化形者……\n\n一些学者假设，魂怒之战导致了玛拉因最终向化形者的崩溃。当时发生了许多领土冲突、对最优人类种群的争夺、对最强种族的角逐，以及据称对他们守护之母的背叛。当一名被堕天者腐蚀的纳迦杀害了一名携带重要信息的狼族并嫁祸给其他部落时，一切达到了顶点。当古拉赫勒拒绝复活那名狼族信使时，狼族攻击了古拉赫勒，而古拉赫勒则与他们在格隆迪尔中的盟友一同反击。随着战争的爆发，狼族利用这个机会来满足他们的各种欲望：他们的傲慢、对他族秘密的贪婪，以及他们认为自己有权统治所有其他部落的信念……\n\n关于化形者的一个有趣记录是他们与第二重天中看到的某些天体有着独特的联系。根据我们对[UmbraGlossaryLocalized('shadowlands','Limbo')]、[UmbraGlossaryLocalized('dreaming','Dreamland')]以及其他影界领域的研究，似乎大多数（如果不是全部的话）天体都是人类梦想和信仰的体现，以至于这些天体在人类决定将那些星星与其他星星区别开来之前可能并不存在。关于进一步的讨论，请查阅下一章以及第52卷……\n\n——摘自《起源》第31卷第1与第2章，及第39卷第2章"
 pod1230objectives_judges.14.a: "我们能否复制上帝曾赋予的那些力量？"
 pod1230objectives_judges.15.t: "凡人魔法的起源"
 pod1230objectives_judges.15.desc: "人类曾多次、反复地背弃上帝。亚当的所有子嗣和夏娃的所有女儿都背负着原罪的烙印。该隐通过他无数的罪行——从谋杀到强奸，乃至拒绝悔改——创造了被诅咒者。许多人类也加入了堕天者的反叛，共同对抗上帝……\n\n虽然祂暂时向我们掩面，但祂从未忘记人类。关于弥赛亚以及以色列子民受选特性的讨论超出了本书范围，请参阅相关卷册和拉比文献。与当前讨论相关的是，上帝留下了许多受选者来援助人类，例如夏娃，以及两位被称为神之子的个体：拉比苏家族的齐亚娜和拉玛苏家族的拉齐尔。后两者被冠以使者之名……\n\n在堕落后不久，甚至在大洪水之前，拉结尔选择了万名英雄，他们以美貌和知识战斗，不断推动人类前进。这些英雄启发了关于“万仙”（Wan Xian）的传说，他们的许多知识被传授给了“武天”（Wu T'ian），使后者能够创造“长生不老药”，并以某种方式与至今仍在中天（3rd Heaven）为上帝效力的“八仙”联系在一起。八仙至今仍与武天保持沟通，指派他们任务以缓解各类问题。与之类似，齐亚娜选择了万千仙神，他们与自然本身战斗，控制并化身为自然界动植物的形态。他们可以命令植物协助自己，并变身为选中他们的动物灵体。从这些被赋予独特魔力的英雄梦境中，诞生了被称为妖精的存在。虽然现代的梦境可以改变妖精，但正是这些最初的梦境孕育了真正的首生妖精……\n\n随着万千仙神的失败，这两位使者决定合力改变他们的运作方式。此类力量不再交付予单一主体，而是被拆分。部分能力将通过学习获得，使者们通过渴望鼓励人们探寻隐藏的知识；其他能力则在出生时被赋予，并随着时间的推移而发掘；还有一些力量则作为忍受磨难的奖励或援助而授予，通常伴随着指引的信息。（译者注：为什么使者的指引非得搞得这么扑朔迷离？直接说“去哪儿做啥”不行吗？）这些能力让凡人能够听到、看到和说出那肉耳、凡胎之眼和泥舌无法触及的奥秘。每位受赐福者都可以通过不同的方式和形式来运用他们的“天赋”，包括秘学、神秘主义、炼金术、仪式、咒语、祈祷、冥想以及精神能力……\n\n在拉齐尔的英雄中，只有8人找到了真正的平静并回到了上帝的怀抱。受拉齐尔和齐亚娜新尝试的启发，这八仙将他们的一部分知识传授给了天宗，使天宗得以在不依赖莉莉丝族群邪术的情况下创造出“长生不老药”。八仙与天宗保持着积极沟通，交给他们一些看似随机且毫无关联的任务……\n\n使者以及上帝其他代理人的最终目标尚不可知，尽管有人说他们是在损害变得过于严重之前进行缓解。也许他们是在考验我们？时间会给出答案……\n\n——摘自《起源》第22卷第1章、第31卷第1章及第46卷第4章节选"
 pod1230objectives_judges.15.a: "让我们学习那些初代英雄们的技艺。"
 pod1230objectives_judges.16.t: "第二城的故事"
 pod1230objectives_judges.16.desc: "上帝以其智慧看到了同时解决多种罪孽的方法，因此降下大洪水，以冲刷掉堕天者（其前仆从中的腐化者）的憎恶以及受诅者的傲慢……\n\n在大洪水之后，该隐选择了自我流放。他曾创造了如此多的事物，却在短短一年内被抹除殆尽，200多名受诅者中仅有少数在大洪水中幸存。但这并不重要。尽管他付出了所有努力，一切从未真正好转，只是发生了微小的变化……\n\n失去该隐的约束后，第三代受诅者开始放纵他们最恶劣的恶习和偏执。随着诺亚子裔的扩散导致食物供应有限，第三代迅速决定反抗他们幸存的尊长，迫使他们进入蛰眠却无法将其彻底杀死。有人说以拿在被他们背叛前曾协助过他们。另一些人说洗拉是最后一个倒下的，她在看到兄弟们倒下时向该隐呼救。该隐听到了她的恳求并心生怜悯，将她变成了石头，以免被发现和杀害。此外，该隐向他心爱的洗拉承诺，待一切修复后，他们将再次共同漫步于黑夜。还有人说亚伯大成功完全逃脱，作为永远忠诚的仆人随该隐一同流放……\n\n该隐得知他的顾问、将军和妻子竟然被他们自己的子嗣如此对待时，愤怒爆发，并因此启发了许多关于复仇之神的神话。他横扫了他们所谓的“第二城”，向第三代的13名成员每人施加了三道诅咒：其一是目标最大缺陷或恐惧的个人放大版，其二是针对所有人的两道通用诅咒。每一层远离该隐的[Glossary('Generation','game_concept_vampgeneration_desc')]都会比前一层更虚弱，且没有任何一个[Glossary('Generation','game_concept_vampgeneration_desc')]能享有和平，因为所有人都将陷入取代其前辈的永恒斗争中。事实上，在诅咒之前，第三代的力量可能与该隐的直系子嗣持平。最后，该隐植入了一种对堕天者天生的不信任和恐惧，促使他的后代避开堕天者或铲除其信徒，这或许解释了为何巴力战争和迦太基之攻是极少数多个氏族联手合作的案例。正如第三代所尝试的那样，每一代[Glossary('Generation','game_concept_vampgeneration_desc')]都会试图抹除前辈，永远生活在对更强大的前代[Glossary('Generation','game_concept_vampgeneration_desc')]可能对他们所做之事的恐惧中。这些诅咒还加剧了同一 [Glossary('Generation','game_concept_vampgeneration_desc')]成员之间的紧张关系，制造了彼此间无处不在的恐惧……\n\n甚至在该隐诅咒他们之前，第三代就试图重现该隐之城的荣光。他们初拥了第四代的新成员。他们聚集诺亚的后裔来崇拜并供养他们……\n\n然而，他们永远无法摆脱该隐的诅咒。他们抹杀了任何试图初拥自己子嗣的人。他们将城市里的每一个居民都变成了棋子，仅仅是一场超乎想象的博弈中的一环……\n\n沉溺于博弈中的他们从未注意到城市在他们周围日益老旧并走向毁灭。当他们最终逃离时，为时已晚，许多人在逃亡中丧生……\n\n该隐大笑着，利用他精湛的支配术修改了关于这座第二城的所有记忆，甚至抹去了它的名字。幸存者的脑海中几乎没有留下什么，除了城市如何陨落的惨状以及对自己失败的记忆。\n\n——摘自《起源》第一卷第14章与第17章"
 pod1230objectives_judges.16.a: "一如既往，他们自我毁灭并堕落了。"
 pod1230objectives_judges.17.t: "第一城的故事"
 pod1230objectives_judges.17.desc: "在他流浪期间，该隐滋生了两种欲望：对权力的渴求和对新家庭的向往。当一个名叫以诺的人找到他时，实现这两个愿望的机会出现了。武帕尔的国王和王后——但这是否意味着武帕尔才是第一城？——派出了他们最卓越的公民以诺，为他们的城市寻找一位守护者与神灵。以诺带回的人正是该隐……\n\n该隐第一次初拥了三个人：带他去武帕尔的以诺，以及武帕尔的国王和王后（此说法源自一本阿拉伯古籍的推测），以此留住他们的爱与智慧。在该隐看来，后两者的爱或许能开始减轻他的罪孽。然而，在发现自己无法再孕育真正的子嗣后，国王与王后走向阳光自尽。该隐发誓永不再进行初拥，这一誓言一直持续到以诺的劝说和该隐自身的孤独让他改变主意为止……\n\n以拿是当时最伟大的将军，被该隐选中来保护武帕尔城。虽然新获得的特质提高了他的领导才能，但也加剧了以拿对鲜血的渴望……\n\n洗拉唤醒了该隐想要寻找一位妻子陪伴他度过永恒的欲望，但她对该隐的魅力并不感冒，于是该隐寻求其他手段来赢取她的芳心。绝望中，该隐找到了他父亲的第二任妻子莱瓦提尔——她曾因亚当在目睹其创造过程时感到厌恶而被逐出伊甸园。莱瓦提尔承诺教他秘诀，却将该隐血缚，使该隐沦为她的仆人和奴隶。通过这种束缚，她强迫该隐初拥了她（这不太可能，没有该隐子嗣的文献支持这一点），并从第二代和第三代中偷走了他的一些子嗣。然而，在受制于束缚期间，该隐掌握了其中的秘密并准备杀掉莱瓦提尔。在他被奴役一年零一天后，束缚减弱到足以让该隐用木桩刺穿莱瓦提尔，并将她留给阳光处死。那些被她据为己有的该隐子嗣以及她自己的子嗣都没能救她，这导致了对该隐子嗣永恒的仇恨；这种仇恨通过在洪水中幸存的少数人延续下来，并引导他们加入了莉莉丝的族群。通过血缚，该隐将洗拉与自己链接在一起，但这种束缚究竟是创造了爱的幻觉，还是随着时间的推移让她真正爱上了他，尚未可知……\n\n该隐并没有初拥他的仆从之首，而是将其转化成了第一个血仆或归来者。雅八拥有足以媲美第三代的力量，是第一城中地位最高的凡人……\n\n该隐以铁腕统治着武帕尔，放逐或处死任何违反其规则的被诅咒者，例如与堕天者结盟或互相残杀。考虑到有多少第三代是在未经他允许的情况下被初拥的，他从未对此进行严厉打击，这一点颇为有趣。此外，他对比他的子嗣对凡人更仁慈。有人说他是不想冒险失去食物来源，也有人说他仍在为自己的行为寻求救赎，但考虑到洗拉的故事和他的宗教禁令，后者不太可能。具体而言，该隐禁止任何人崇拜上帝，并取缔了所有不属于他自己或其他被诅咒者的神庙。在他自己的神庙里，他经常宣称他的所有子嗣都注定永远腐烂，一旦死去便会在地狱受苦，并在末日最终降临时被上帝所唾弃……\n\n目前尚不清楚以诺是如何说服所有人该隐将武帕尔改名为以诺城的（是他真的改了名，还是这仅仅是为了调和武帕尔与以诺城说法而产生的推测？）。也许他使用了支配术重写了记忆，又或者是他的子嗣——这三组人中数量最多的——在声势上压倒了其他人。\n\n——摘自《起源》第一卷，第5-12章弃稿"
 pod1230objectives_judges.17.a: "确实是个黑暗的故事"
 pod1230objectives_judges.18.t: "莉莉丝与血律的故事"
 pod1230objectives_judges.18.desc: "莉莉丝是亚当的第一任妻子，因两个原因被驱逐：一是因为她不服从亚当的命令，二是因为她在原罪和堕落之前与一位神之子通奸。在上帝创造的荒野中流浪后，她回到了伊甸园，并说服她的天使情人允许她进入。利用从神之子那里窃取的诡异巫术，她将自己化身为引诱天真的夏娃并促成原罪的古蛇……\n在该隐流浪期间，他在莉莉丝模仿的伊甸园中遇到了她。莉莉丝被上帝将他标记为杀人犯的烙印及其代表的力量所吸引。她邀请该隐进入她的家，喂养他，包扎他的伤口，并成为了他的情人。久而久之，该隐意识到莉莉丝拥有诡异的巫术，并恳求她将这些力量赐予他，无论是出于爱，还是为了让他减轻上帝的诅咒。于是，莉莉丝准备了一个特殊的仪式，并让该隐饮下了一些她的生命之血。\n在分享了她的血之后，该隐见到了承载神圣战车的四活物、神之子以及大天使们，每一位都给了他悔改的机会，而随着他的拒绝，每一位施加的诅咒都比前一个更加恶毒。当该隐拒绝米迦勒（意为“谁如上帝”）时，米迦勒诅咒该隐恐惧他的活火。当该隐拒绝拉斐尔（意为“上帝已治愈”）时，拉斐尔诅咒该隐恐惧黎明，因为太阳的光辉将如米迦勒的活火一般灼烧。当该隐拒绝乌列尔（意为“上帝是我的光”）时，乌列尔诅咒该隐依附于阴影，像在这次仪式中那样饮血（如同他所流下的兄弟之血），吞食米迦勒活火留下的灰烬，在死亡的一刻凝固，并让他所接触的一切都崩碎为万物源起的尘土。加百列（意为“上帝是我的力量”）提供了最后一个无法被拒绝且永不消逝的机会，那是接受上帝仁慈并解除诅咒的唯一剩余途径。\n当该隐从这些幻象中醒来时，他已经获得了构成现代血律基础的9种魔法。此后，他因不明原因抛弃了莉莉丝，从而导致了莉莉丝及其子嗣至今对该隐后裔抱有的恨意。有人推测，上帝因莉莉丝在原罪中扮演的角色而对她强制执行了祂的诅咒，确保她的怪物后代永远不会与受诅者并肩作战……\n莉莉丝目前的行踪不明，因为大洪水摧毁了她活动的许多痕迹，包括她的花园。一些资料指出，她退入了[UmbraGlossaryLocalized('shadowlands','Limbo')]或[UmbraGlossaryLocalized('dreaming','Dreamland')]，在那里她重建了她的花园，等待着有朝一日能铲除对其“孩子”的所有威胁，并对该隐实施她可怕的报复。该隐后裔历史上的一些事件也可以追溯到她，作为她削弱敌人以准备……\n\n——摘自《起源》第一卷第2-4章"
 pod1230objectives_judges.18.a: "该隐是个蠢材，但上帝是明智的。"
 pod1230objectives_judges.19.t: "该隐的故事"
 pod1230objectives_judges.19.desc: "亚伯是牧羊的，该隐是种地的。有一日，该隐拿地里的蔬菜和粮食为供物献给耶和华；亚伯也将他羊群中头生的和羊的脂油献上。耶和华看中了亚伯和他的供物，只是看不中该隐和他的供物，因为该隐没有献上初熟的产物，也没有献上最好的出产。他献祭乃为了炫耀自己的富裕，并引起他想娶的那个孪生妹妹的注意。该隐就大大的发怒，变了脸色。耶和华对该隐说：“你为什么发怒呢？你为什么变了脸色呢？你若行得好，岂不蒙神悦纳？你若行得不好，罪就伏在门前。它必恋慕你，你却要制伏它。”\n\n耶和华不接纳他的祭物，该隐就生了怨气。一个堕落的灵就趁机煽动该隐的怒气和嫉妒，让他做了一个梦：梦里出现两个长得像该隐和亚伯的人，其中一个指责另一个。被指责的那个就发怒，拿起一把打扁了的犁刀。\n\n他不顾对方的苦苦哀求，竟割断了他的喉咙，把他杀了。该隐一直让怒气在心里燃烧，不肯熄灭，并且深信：根本没有审判，没有全能的主宰，义人得不到奖赏，恶人也受不到报应。后来，父母安排亚伯和该隐的孪生妹妹结婚，该隐对弟弟的嫉妒就越来越深。有一天，该隐拿起他的犁，打扁成一把刀，就到田里去找亚伯，把他杀了。\n\n耶和华对该隐说：“你兄弟亚伯在哪里？”，他说：“我不知道！我岂是看守我兄弟的吗？”。耶和华说：“你做了什么事呢？你兄弟的血的声音通过地里向我哀告。地开了口，从你手里接受你兄弟的血。你必从这地受诅咒。你种地，地不再给你效力，你必流离飘荡在地上。”\n\n该隐对耶和华说：“我的刑罚太重，过于我所能当的。你如今赶逐我离开这地，以致不见你面。我必流离漂荡在地上，凡遇见我的必杀我。”，耶和华对他说：“绝不会这样，凡杀该隐的，必遭报七倍。”耶和华就给该隐立一个记号，免得人遇见他就杀他。于是该隐就将眼目离开了耶和华，不再视见耶和华的面，去住伊甸东边的挪得之地。"
 pod1230objectives_judges.19.a: "但我们的上帝是会赐予第二次机会的神。难道我们就此止步了吗？"
 pod1230objectives_judges.20.t: "即使是受诅咒者也能获得救赎"
 pod1230objectives_judges.20.desc: "从根本上说，受诅者（通常被称为吸血鬼）是附身于自己尸体的怨灵，其尸体和该隐的诅咒共同充当着羁绊。在祂永恒的仁慈中，尽管该隐拒绝接受这份礼物，上帝还是给了该隐及其后代一条现在被称为浩恩永生的道路，以解除他们的诅咒，并将他们的灵魂从永恒的沉沦中解救出来。虽然可以肯定地说该隐在大洪水之前尚未达到浩恩永生，但自那时起已过去数千年，因此学者们提出了极具说服力的论点，认为该隐可能已经达到了浩恩永生，但尚未进入来世，因为他必须先解决与其后裔的纠葛。关于该隐现状的进一步讨论，请参阅第18章中的评论和文章……\n\n扫罗声称自己在窃取了拉结尔授予万仙后裔的部分知识后达到了浩恩永生。他将这些教义传给了萨洛比氏族，赋予了他们标志性的第三只眼，并引导其中的许多人走向浩恩永生。然而，当地审判者最近的发现表明，扫罗本人从未达到过浩恩永生。此外，睿魔尔不遗余力地试图消灭整个萨洛比氏族，尤其是那些达到了浩恩永生的成员……\n\n扫罗甚至从东方神秘主义者那里窃取了这个名字，这个词诗意地指代这些超越存在所拥有的巨大精神财富。讽刺的是，那些神秘主义者讨厌浩恩永生这个词，因为它并不是最准确的术语，而仅仅是扫罗拿走并在西方受诅者中普及的那个词……\n\n要达到浩恩永生，受诅者必须找到一位导师，保持或恢复其人性，并为所有的罪孽赎罪。在充分的研究和冥想之后，他们可能会获得一些特殊的顿悟。凭借这种顿悟，他们终于可以开始一次欢息——这是一场深入其梦境与灵魂的幻象寻求之旅。在欢息过程中，他们会发现存在的意义、心兽的起源以及他们与该隐的联系。如果他们在欢息中未能达到浩恩永生，即便其肉体和精神能够幸存，他们也将永远失去再次尝试的机会。如果他们因犯罪而跌落浩恩永生境界，结果也是一样的……\n\n一旦达成，浩恩永生会消除受诅者被心兽吞噬的风险，几乎消除了对血的需求，并抵消了该隐施加于其后裔身上的诅咒，包括氏族缺陷以及[Glossary('Generation','game_concept_vampgeneration_desc')]的限制。与莉莉丝的子嗣相比，我们猎杀该隐后裔更多是因为他们的残忍。因此，那些达到了浩恩永生的人被免于我们的猎杀，使我们能够将资源用于消灭对我们同胞构成更大威胁的目标。\n\n摘自《起源》第一卷第三章的废弃草案，标注有“缺乏严肃来源”。"
 pod1230objectives_judges.20.a: "莉莉丝永远是我们的首要任务。"
 pod1230objectives_judges.24.t: "传播真言"
 pod1230objectives_judges.24.desc: "审判者正如他们所保护的社群一样，散布在世界各地。虽然这曾是一种可以接受的现状（在某些情况下甚至是种优势，例如能借此了解远方的超自然怪物），但它同样也是个弱点。一个去中心化的群体所能成就的事终究有限。\n\n你近期的胜利与发现，使你置身于审判者中前所未有的核心权威地位。你的话语举足轻重，足以将来自世界各地的猎人吸引到你那蓬勃发展的组织中。\n\n以肃清了怪物的圣地作为行动基地，彻底战胜莉莉丝后嗣的希望从未如此高涨。"
 pod1230objectives_judges.24.a: "赞美至高的主！"
 judge_religious_head_title_name: "穆萨尔公议会"
 embrace_hebrew_culture_vassals_custom: "封臣已转变为希伯来文化。"
 embrace_hebrew_culture_counties_custom: "伯爵领已转变为希伯来文化。"
 decision_embrace_hebrew_culture_get_innovations: "希伯来文化继承了大流散文化的所有革新。"
 magi_modifier: "大祭司"
 magi_modifier_desc: "你对神秘力量的知识与魔法师的教导相结合，让你学到了很多东西。"
 ashkenazic_modifier: "阿布拉·卡达布拉"
 ashkenazic_modifier_desc: "你的家族已经掌握了改变语言并从尘土中创造出栩栩如生的构装体所必需的秘密。"
 esraelawi_modifier: "但支派传统"
 esraelawi_modifier_desc: "一些仍记得这些传统的审判者，已经向你的家族传授了但支派的部分战争传统。"
 kochinim_modifier: "首席长老"
 kochinim_modifier_desc: "作为柯枝的首席长者，您的家族如今负责掌管其贸易与情报网络。"
 sephardim_modifier: "首席拉比"
 sephardim_modifier_desc: "塞法迪已派遣行政拉比前来协助并辅佐你的的家族。"
 second_city_modifier: "第二城的教训"
 second_city_modifier_desc: "第二之城曾是一个充斥着阴谋诡计的地方，城中的每一位居民都参与到了这场伟大游戏之中，并企图通过谋杀或吸榨来取代他们的上位者。"
 first_city_modifier: "第一城的教训"
 first_city_modifier_desc: "尽管该隐存在诸多缺陷与罪孽，但他仍不失为一名能干且老练的统治者。我们可以从他的行径以及他治理第一城——武帕尔的方式中汲取教训。"
 lilith_and_disciplines_modifier: "莉莉丝与该隐的魔法"
 lilith_and_disciplines_modifier_desc: "在离开莉莉丝之前，该隐从她那里获得了一些特殊的魔力。我们对此课题的研究提供了一些有用的见解，可以应用于其他领域的研究。"
 caine_and_abel_modifier: "分享该隐的故事"
 caine_and_abel_modifier_desc: "在发现并分享了该隐的完整故事后，我们进一步聚集了反对受诅咒者的支持力量，并团结了许多盟友。"
 mashiach_cometh_name: "犹太-基督教共同历史"
 special_doctrine_mashiach_cometh_name: "犹太-基督教共同历史"
 special_doctrine_mashiach_cometh_desc: "虽然我们在许多观点上与基督徒弟兄存在分歧，但我们仍能与教会的暗影裁判所进行更紧密的合作，并支持他们的行动。"
 mummy_origins_modifier: "理解不朽者"
 mummy_origins_modifier_desc: "在研究了不朽者之后，我们得以将其炼金术能力与我们的卡巴拉相结合，为狩猎提供额外的资金。"
 demon_origins_modifier: "理解堕天使"
 demon_origins_modifier_desc: "在研究了堕天者之后，我们能更好地抵御他们的侵袭。"
 fae_origins_modifier: "理解妖精"
 fae_origins_modifier_desc: "在研究了妖精之后，我们能够凭借信仰与梦想微妙地扭曲现实，从而提升了建造新建筑的能力。"
 kueijin_origins_modifier: "理解鬼人"
 kueijin_origins_modifier_desc: "在研究了鬼人和最初的万千仙神之后，我们得以延长寿命，从而提升了我们的狩猎能力。"
 therianthrope_origins_modifier: "理解化形者"
 therianthrope_origins_modifier_desc: "在研究了化形者之后，我们或许能够像他们曾经那样增强自身。"
 undone_diaspora_modifier: "回归的审判者"
 undone_diaspora_modifier_desc: "从不列颠群岛到中国沿岸，审判者们回归故土，随之带来了巨大的繁荣、知识与人力。虽然不同传统之间以及与目前居住在应许之地的人们之间存在一些动荡，但我们将学会适应，正如我们一贯所做的那样。"
 doctrine_origins_improvements_name: "研究收益"
 wraith_origins_name: "理解死灵"
 wraith_origins_desc: "在研究了不朽者之后，我们隐于幕后行动的能力得到了提升。"
 mortal_magic_origins_name: "理解所有凡人魔法"
 mortal_magic_origins_desc: "经过广泛且有人认为甚至过度的研究，我们发现了所有凡人魔法的起源。凭借我们新获得的理解，我们已经掌握了与每种形式相关的许多基础技能。"
 doctrine_prioritized_hunting_name: "优先狩猎"
 golconda_repentance_name: "关于被诅咒者的真相"
 golconda_repentance_desc: "经过如此深入的研究，我们已经真正理解了那些受诅咒者的本质，这将使我们能够与那些蒙受上帝怜悯的人并肩作战，共同追捕莉莉丝的后裔。此外，我们所有的犹太同胞——无论是受诅咒的还是凡人——现在都可以齐心协力，去实现我们的终极目标。"
 doctrine_parameter_hostility_override_golconda_repentance: "其他拥有[GetFaithDoctrine('golconda_repentance').GetBaseName][doctrine|E]的[faiths|E]——无论是 $pod_cainite$ 还是猎人——都将被视为 [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]，而非 $hostility_evil_tooltippable$。"
 judge_research_origins_mummies_objective_decision_osiris_flail: "你必须拥有[GetPODArtifact('osiris_flail_link').GetName]，它记录了木乃伊的历史"
 judge_research_origins_mummies_objective_decision_book_thoth: "你必须拥有[GetPODArtifact('book_thoth_link').GetName]，它提供了托特传授给伊西斯的木乃伊术法的见解"
 judge_research_origins_mummies_objective_decision_isis_fragments: "你必须拥有[GetPODArtifact('isis_fragments_link').GetName]，它从伊西斯教团的视角记录了埃及木乃伊的历史"
 judge_research_origins_mummies_objective_decision_writings_cabirus: "你必须拥有 [GetPODArtifact('writings_cabirus_link').GetName]，它是其生命神咒的一个翻译拙劣的副本"
 judge_research_origins_demons_objective_decision_dreams_angra: "你必须拥有 [GetPODArtifact('dreams_angra_link').GetName]，它提供了对巴力古老仪式的洞察"
 judge_research_origins_demons_objective_decision_incunabulum_kupalam: "你必须拥有[GetPODArtifact('incunabulum_kupalam_link').GetName]，它提供了关于恶魔库帕拉的本质以及召唤与束缚他的仪式的洞察"
 judge_research_origins_demons_objective_decision_book_tobit: "你必须拥有[GetPODArtifact('book_tobit_link').GetName]，它描述了上帝如何利用恶魔考验信徒，以及古老[Glossary('氏族','game_concept_Clan_desc')]的魔邪传说"
 judge_research_origins_demons_objective_decision_control_tunis: "你控制了[GetTitleByKey('c_tunis').GetNameNoTier]​，巴力氏族曾在此献祭了许多孩童并散播他们的疯狂。"
 judge_research_origins_demons_objective_decision_control_chandax: "你控制了[GetTitleByKey('c_chandax').GetNameNoTier]，纳姆塔尔之躯体安息的场所"
 judge_research_origins_fae_objective_decision_mayo: "你控制了[GetTitleByKey('c_mayo').GetNameNoTier]，银门的所在地，诸王之廷昔日聚会与爆发冲突的中心之所"
 judge_research_origins_fae_objective_decision_atholl: "你控制着 [GetTitleByKey('c_atholl').GetNameNoTier]，那是时刻部族目前的家园，许多妖精（包括部分先知）正躲避在其中的风暴之下。"
 judge_research_origins_fae_objective_decision_aviovara: "你控制着 [GetTitleByKey('c_aviovara').GetNameNoTier]，妖精称之为水晶堡垒，也是他们冲突的中心。"
 judge_research_origins_fae_objective_decision_ailech: "你控制着 [GetTitleByKey('c_ailech').GetNameNoTier]，那是邪眼巴烙及弗摩尔族之王的古老家园。"
 judge_research_origins_fae_objective_decision_monmouthshire: "你统治着 [GetTitleByKey('c_monmouthshire').GetNameNoTier]，这里是神话中卡美洛的心脏，也是一窥[UmbraGlossaryLocalized('dreaming','Dreamland')] 的地方。"
 judge_research_origins_fae_objective_decision_lennox: "你控制着 [GetTitleByKey('c_lennox').GetNameNoTier]，即众所周知的妖精血路。"
 judge_research_origins_fae_objective_decision_reval: "你控制了[GetTitleByKey('c_reval').GetNameNoTier]​，琥珀宫殿的所在地。"
 judge_research_origins_fae_objective_decision_bayeux: "你控制了[GetTitleByKey('c_bayeux').GetNameNoTier]，妖精井之诺的所在地。"
 judge_research_origins_fae_objective_decision_warwickshire: "你控制了[GetTitleByKey('c_warwickshire').GetNameNoTier]，这里是英勇锻造厂所在地，妖精们在此打造奇妙的物品。"
 judge_research_origins_fae_objective_decision_black_torc_of_carniog: "你必须拥有[GetPODArtifact('black_torc_of_carniog_link').GetName]，它或许能让我们命令妖精协助我们的行动。"
 judge_research_origins_fae_objective_decision_tapestry_of_fate: "你必须拥有[GetPODArtifact('tapestry_of_fate_link').GetName]​，它能让我们洞悉[Glossary('真名','podgloss.truename')]与[UmbraGlossaryLocalized('dreaming','Dreamland')]的命运。"
 judge_research_origins_demons_objective_decision_book_of_the_spirits_secrets: "你必须拥有 [GetPODArtifact('book_of_the_spirits_secrets_link').GetName]，它提供了关于名为[umbra|E] 的界域的诸灵的术法信息"
 judge_research_origins_demons_objective_decision_khazar_diary: "你必须拥有[GetPODArtifact('khazar_diary_link').GetName]，它由我们的某位同胞撰写，描述了我们所在界域与[UmbraGlossaryLocalized('shadowlands','地狱边境')]之间的边界"
 judge_research_origins_demons_objective_decision_book_going_night: "你必须拥有 [GetPODArtifact('book_going_night_link').GetName]，它提供了关于进入来世的某些仪式与法术的洞察，尽管这是从一位埃及被诅咒者的视角出发"
 judge_research_origins_demons_objective_decision_ignace_notes: "你必须拥有 [GetPODArtifact('ignace_notes_link').GetName]，它可能为我们提供一份灵界的地图"
 judge_research_origins_demons_objective_decision_black_torc_of_carniog: "你必须拥有[GetPODArtifact('black_torc_of_carniog_link').GetName]，它在传说中允许佩戴者捕获灵魂，并可能让我们洞察[UmbraGlossaryLocalized('shadowlands','地狱边境')]是如何困住其居民的"
 judge_research_origins_kueijin_objective_decision_lhasa: "你控制了[GetTitleByKey('c_lhasa').GetNameNoTier]，藏区首府与圣地之一"
 judge_research_origins_kueijin_objective_decision_purang: "你控制了[GetTitleByKey('c_purang').GetNameNoTier]，昔日的须弥——神话万仙之道场"
 judge_research_origins_kueijin_objective_decision_baizetu: "你需要合成《白泽图》的五块碎片，一本传说中黄帝书写的宝图，据说它包含了所有11520种超自然生物的秘密。"
 judge_research_origins_therianthropes_objective_decision_torture_therian: "由于他们依赖口头传统，你必须至少捕获5个[Glossary('化形者', 'glossary_fera_tt')]以便审问"
 judge_research_origins_therianthropes_objective_decision_torture_fallen: "囚禁并审讯一名#TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L 堕天者#!#!，因为他们对[Glossary('化形者', 'glossary_fera_tt')]的恐惧表明他们可能掌握着化形者起源的线索。"
 judge_research_origins_mortal_magic_objective_decision_origins_mummies: "你必须已发现#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L 不朽者#!#!的起源。"
 judge_research_origins_mortal_magic_objective_decision_origins_wraiths: "你必须已发现$POD_splat_wraith_plural$的起源。"
 judge_research_origins_mortal_magic_objective_decision_origins_kueijin: "你必须已发现$POD_splat_kueijin$的起源。"
 judge_research_origins_mortal_magic_objective_decision_origins_fallen: "你必须已发现#TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L 堕天者#!#!的起源。"
 judge_research_origins_mortal_magic_objective_decision_origins_therians: "你必须已发现[Glossary('化形者', 'glossary_fera_tt')]的起源。"
 judge_research_origins_mortal_magic_objective_decision_origins_fae: "你必须已发现$POD_splat_fae$的起源。"
 judge_research_origins_vampires_3rdgen_objective_decision_promised_land: "你的[capital|E]必须位于[GetGeographicalRegion('pod_judges_promised_land').GetName]。"
 judge_research_origins_vampires_3rdgen_objective_decision_sargon_codex: "你必须已发现萨尔贡圣典的13块碎片。"
 judge_research_origins_vampires_3rdgen_objective_decision_tale_of_the_first_city: "你必须拥有[GetPODArtifact('tale_of_the_first_city1').GetName]或[GetPODArtifact('tale_of_the_first_city2').GetName]，该书论述了大洪水之前及之后的历史。"
 judge_research_origins_vampires_3rdgen_objective_decision_biblia_negra: "你必须拥有[GetPODArtifact('biblia_negra_link').GetName]，该书论及67个被囚禁的、意图毁灭或接管世界的实体，其中13个是[Glossary('上古耆宿','game_concept_antediluvian_desc')]。"
 judge_research_origins_vampires_3rdgen_objective_decision_chronicles_heartblood: "你必须拥有[GetPODArtifact('chronicles_heartblood_link').GetName]​，这是一部关于哈基姆圣裔的历史。"
 judge_research_origins_vampires_3rdgen_objective_decision_karalavanisha_vrana: "你必须拥有[GetPODArtifact('karalavanisha_vrana_link').GetName]，该书论述了印度​雷伏诺氏族​的起源。"
 judge_research_origins_vampires_3rdgen_objective_decision_canticle_japhet: "你必须拥有[GetPODArtifact('canticle_japhet_link').GetName]​，该书声称该隐​已死。"
 judge_research_origins_vampires_3rdgen_objective_decision_book_enoch: "你必须拥有[GetPODArtifact('book_enoch_link').GetName]​，该书提供了一些最古老的该隐之子预言、传说和知识。"
 judge_research_origins_vampires_2ndgen_objective_decision_chronicle_of_caine: "你必须拥有该隐传​，该书提供了关于第一城​时代的更多细节。"
 judge_research_origins_vampires_2ndgen_objective_decision_codex_damned: "你必须拥有[GetPODArtifact('codex_damned_link').GetName]，它描述了第一城与第二城的统治。"
 judge_research_origins_vampires_2ndgen_objective_decision_ubar_chronicles: "你必须拥有 [GetPODArtifact('ubar_chronicles_link').GetName]，该书解决了关于以诺和武帕尔之间相互矛盾的传说。"
 judge_research_origins_vampires_2ndgen_objective_decision_gospels_irad: "你必须拥有 [GetPODArtifact('gospels_irad_link').GetName]，该书讨论了以拿以及该隐另一名子嗣亚大的历史。"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_tablet_of_destiny: "你必须拥有[GetPODArtifact('tablet_of_destiny').GetName]​，它记载了以诺所掌握的所有血魔法。"
