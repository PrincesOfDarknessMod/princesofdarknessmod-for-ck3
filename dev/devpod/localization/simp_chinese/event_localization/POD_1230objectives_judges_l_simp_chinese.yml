 pod1230objectives_judges.111.t: "米拿现的导师"
 pod1230objectives_judges.111.desc: "夺取了莉莉丝后裔手中的巴格达后，我们重新与魔法师取得了联系。他们是《塔木德》——无论是公开版还是隐藏版——的宗师，其渊源可追溯至第一次大流散时期由先知丹尼尔所创立的传统。在他们的谱系中，常有人荣膺拉比学院院长或尊者的头衔。这份遗产赋予了他们对卡巴拉与巫术技艺极深造诣，使其成为审判者不可或缺的盟友。\n\n正因如此，当米拿现在追求知识的旅途中造访巴格达时，他首次遇见了魔法师。他们指导他如何正确运用宇宙之主赋予他的神圣天赋；他们揭示了莉莉丝之子以及其他潜伏在阴影中的生物的存在。在他们的帮助下，当米拿成长为一名强悍且博学的领袖，在父亲去世后带领我们摆脱了黑暗的桎梏。\n\n此前，魔法师虽听闻过我们的行动，但一直未能建立正式联系。现在，他们提议恢复古老的盟约，并将曾传授给米拿现的知识倾囊相授。作为回报，他们仅要求我们在其研究黑暗生物的过程中提供协助，以便更有效地进行战斗。\n\n随着巴格达归于我手以及魔法师的鼎力相助，收复耶路撒冷、使其脱离黑暗已是势在必行。"
 pod1230objectives_judges.111.a: "追随梅纳赫姆的脚步，并更进一步"
 pod1230objectives_judges.111.b: "灯台之火燃得愈发明亮"
 house_menahemites_improved_menahem_modifier: "米拿现的脚步"
 house_menahemites_improved_menahem_modifier_desc: "虽然曾经有人怀疑米拿现是否真的是大卫之子，但现在已毋庸置疑。在他那个时代，他也许未能完全继承大卫的衣钵，但我们已经实现了他的许多诺言，并准备好去完成他的宿命。他教会了我们如何识别并对抗真正的敌人，而这一目标现在得到了他导师们的助力。我们已获得力量，准备好击退黑夜。"
 house_menahemites_menahem_teachers_modifier: "米拿现的导师"
 house_menahemites_menahem_teachers_modifier_desc: "正如这些魔法师曾教导米拿现，如今他们也将学识传予我们，令我们得以洞悉自身所抗争之物。在他们的襄助下，众判官的灯台愈发明亮，将黑暗步步逼退。"