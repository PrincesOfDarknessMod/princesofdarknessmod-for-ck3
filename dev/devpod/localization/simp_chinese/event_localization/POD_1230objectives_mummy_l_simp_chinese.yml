l_simp_chinese:
 pod1230objectives_mummy.1.t: "终结流散"
 pod1230objectives_mummy.1.desc: "面对埃及被多次占领的情况，以及亚历山大大帝之后外来超自然生物的涌入，荷鲁斯于公元132年颁布了大迁徙，释放了他的忠实追随者，让他们以自己的方式与阿波菲斯战斗。但如今这一切已经结束，埃及再次归属于贤荷鲁，针对赛特的圣战即将重新开始！"
 pod1230objectives_mummy.1.a: "教友，追随我！"
 pod1230objectives_mummy.2.t: "以荷鲁斯之名"
 pod1230objectives_mummy.2.desc: "荷鲁斯与他叔叔赛特之间的漫长而血腥的战争已经持续了几个世纪。尽管经历了许多挫折和少许宝贵的胜利，那些忠实于复仇者的人从未放弃过恢复世界平衡的信念。\n荷鲁斯本人有时也会离开他的门徒，去完成自己的任务。而就在这个时候，你挺身而出，迎接面前的巨大挑战。\n作为贤荷鲁的领导者，你以严谨有效的力量取得了连荷鲁斯自己也只能梦想的胜利。然而，奥西里斯的儿子并非愚人，他承认了你的成就，任命你为他的神圣维齐尔，并给予你极高的赞誉，同时对你的未来寄予更高的期望。如今，你已成为玛阿特之选的得力副官，而蛇之仆从将学会畏惧你的名字。"
 pod1230objectives_mummy.2.t_horus: "复仇者荷鲁斯，为父报仇者"
 pod1230objectives_mummy.2.desc_horus: "你竭尽全力维持贤荷鲁的秩序，对抗吸血鬼并挫败赛特之子的阴谋。而这一天终于到来……腐化的蛇之子们或死去、或躲避着你神圣的怒火，恐惧着那不可避免的夜晚——你将对他们实施复仇。你是复仇之子荷鲁斯，你赢得了胜利！"
 pod1230objectives_mummy.2.a: "赛特之子已被击败！"
 horus_chosen_modifier: "荷鲁斯的神圣维齐尔"
 horus_chosen_modifier_desc: "如果存在，允许要求超自然的[neteru|E]皈依奥西里斯联盟[faith|E]的[doctrine|E]。"
 unlock_osiris_league_conversion: "如果存在，允许要求你的超自然[neteru|E]皈依带有奥西里斯联盟[doctrine|E]的[faith|E]。"
 pod1230objectives_mummy.3.t: "光照信仰之地"
 pod1230objectives_mummy.3.desc: "你做到了不可能的事，这片土地和信仰之网在你的掌控之下，你将确保它永远不会再次陷入黑暗。"
 pod1230objectives_mummy.3.a: "唯一且永恒。"
 living_pharaoh_modifier: "活法老"
 pod1230objectives_mummy.4.t: "纯粹邪恶"
 pod1230objectives_mummy.4.desc: "你已经实现了古蛇的意志，你在世界上播下了邪恶的种子，通过这一点，阿波菲斯肯定会比以前更快地崛起，它也因此而回报了你。"
 pod1230objectives_mummy.4.a: "末日将至。"
 pure_evil_modifier: "纯粹邪恶"
 pure_evil_modifier_desc: "如果存在，允许要求超自然的[neteru|E]皈依阿波菲斯[faith|E]的[doctrine|E]。"
 unlock_apophis_conversion: "如果存在，可以要求你的超自然[neteru|E]皈依带有阿波菲斯[doctrine|E]的[faith|E]。"
 pod1230objectives_mummy.5.t: "生生不息"
 pod1230objectives_mummy.5.desc: "当鬼神逐鹿争玉之时，阎魔们在各方的心中下毒，使让极端化与中间派对立起来，这下去只有阎魔才是赢家。\n巫凤的大使们不仅仅是阻止了几场战争，他们还招募其他高尚的鬼神加入他们的事业，从凶猛的变化妖怪到隐秘的妖仙。生命是宝贵的，过于宝贵，不能浪费在无意义的内斗中。和平带来希望，希望带来治愈，治愈带来生命。万事皆成，阎魔必败。"
 pod1230objectives_mummy.5.a: "地狱将陷于我手。"
 pod1230objectives_mummy.6.t: "荷鲁斯之疑"
 pod1230objectives_mummy.6.desc: "荷鲁斯是致力于对抗赛特的木乃伊领袖，当他们中的一些人（包括你）决定放弃这场战斗时，他非常在意。虽然他的力量往往过于薄弱以至于无法构成威胁，但他仍然是世界上活跃的强大实体之一。因此，你一直在准备展示武力，将顽固的埃及人推向谈判桌。\n了解荷鲁斯，只有当他认为惩罚你（和你的同类）会付出太多的努力，而这些努力本可以更好地用来对抗他的叔叔赛特时，他才会同意倾听。\n随着这一准备工作的完成，实际谈判将如何结束还有待观察……"
 pod1230objectives_mummy.6.a: "荷鲁斯不同意我们的要求……"
 pod1230objectives_mummy.6.b: "荷鲁斯同意我们的要求！"
 pod1230objectives_mummy.7.t: "玛阿特的平衡"
 pod1230objectives_mummy.7.desc: "玛阿特的判官是一群执行玛阿特的法则的生物，当木乃伊死亡并回到阿努比斯身边时，阿努比斯引导他们走向判官，他们会判断木乃伊的平衡进展。如果他们发现某个木乃伊的行为有亏，他们会剥夺其力量，甚至可能将木乃伊的灵魂投入阿米玛特彻底毁灭。判官的本质和名字无人知晓，因为一旦被知晓，他们可能会被魔法和赫考所控制。埃及的祭司尽其所能地将已知的名字编纂出来，并描述了判官的职责和起源。作为凡人，祭司们往往对每个判官所代表的玛阿特法则做了过于简化或错误的记录。\n我对阿蒙提的忠诚众所周知，凭借我对赫考的理解，我有可能成为[GetTrait('judge_of_maat').GetName( GetNullCharacter )]之一。最初，每个判官都有一个对应的贤荷鲁，判官会观察并评判其行为。随着生命神咒的传播，这种职能逐渐变得更宽泛，你的职责范围现在将远远超出仅仅监察单一存在。"
 pod1230objectives_mummy.7.a: "更重大的责任。"
 pod1230objectives_mummy.8.t: "脱离玛阿特"
 pod1230objectives_mummy.8.desc: "由伊西斯创造并由她的丈夫奥西里斯维持的生命神咒赐予了木乃伊不朽的生命，这一咒语一直与古埃及的信仰深深相连。因此，木乃伊必须遵循这些古老的习俗，并适当向这个已逝之地的守护者致敬。\n然而，也许有另一种方式。卡比洛斯在窃取生命神咒用于自己的时候，试图将仪式与他本土的古希腊神祇和风俗结合起来。虽然他只取得了部分成功，但这仍然是一个有前途的例子，展示了所能取得的成就。凭借你对自己形态和死灵法术的完全掌控，现在是时候超越前人的尝试，彻底切断你与玛阿特的联系。你的新木乃伊身躯将在哪个界域重生呢？"
 pod1230objectives_mummy.8.a: "哈迪斯"
 pod1230objectives_mummy.8.b: "赫尔海姆"
 pod1230objectives_mummy.8.c: "幽冥"
 pod1230objectives_mummy.8.d: "地狱"