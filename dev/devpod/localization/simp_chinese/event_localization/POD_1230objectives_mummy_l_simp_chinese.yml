l_simp_chinese:
 pod1230objectives_mummy.1.t: "终结蛇裔"
 pod1230objectives_mummy.1.desc: "荷鲁斯与赛特之间的永恒之战，不过是奥西里斯与赛特之战的延续，更是秩序与熵灭本质冲突的体现。这场关乎现实存续的根本之战中，我们可悲地长期处于败势。\n虽然赛特与$glossary_wyrm_apophis$至今仍遥不可及，但其爪牙却近在咫尺。这次我们以蛇身而非蛇首为突破口展开的全新攻势，已初见成效。"
 pod1230objectives_mummy.1.a: "决定性胜利。"
 pod1230objectives_mummy.2.t: "信仰之地"
 pod1230objectives_mummy.2.desc: "埃及是我们的家园，更是借由汲取土地能量\"塞赫\"而力量鼎盛之地。随着文明变迁，埃及的影响力与塞赫之力已扩散至广袤疆域。这使我们能在传统疆域之外调动这份力量。\n掌控所有受埃及超凡之力祝福的土地，将让我们重现诸神时代的威能，为未来决战赢得关键优势。"
 pod1230objectives_mummy.2.a: "化不可能为可能？"
 pod1230objectives_mummy.3.t: "终极之敌：$glossary_wyrm_apophis$"
 pod1230objectives_mummy.3.desc: "巨蛇$glossary_wyrm_apophis$始终是我们最根本的敌人。作为熵灭与失衡的化身，赛特在诸多层面都只是他心甘或被迫的仆从。对抗如此原始的存在向来非我们所能及，阿波菲斯便借此逐步腐蚀玛阿特平衡，将世界推向湮灭。\n但随着我们对其爪牙的节节胜利，阿波菲斯的掌控正持续削弱，直至奥西里斯自阿蒙提传来久违的神谕：\"终结这一切\"。\n\n我们照做了。\n\n凭借近乎无限的塞赫供给，我们追随阿努比斯攻入湮灭最黑暗的角落，直击巨蛇。无数同胞陨落，但奥西里斯的神力令他们不断重生。最终时刻，据说伊西斯亲自降临永久禁锢了阿波菲斯。\n\n无论真相如何，阿波菲斯已不再是威胁。世界终将如注定般，逐步回归正义与平衡。\n而我们将如亘古以来那般，守望这一切。"
 pod1230objectives_mummy.3.a: "我们最终的胜利"
 pod1230objectives_mummy.4.t: "守护根源"
 pod1230objectives_mummy.4.desc: "我们源自众神与法老之地，古埃及，我们的存在与这片土地紧密相连，对它的记忆滋养着我们的力量。然而世界未曾停歇，早已将我们的家园抛在身后，只余废墟与被掠夺的遗物。\n尽管荷鲁斯正专注于对抗赛特的战争，但遗忘根源比叛徒的爪牙更能摧毁我们。因此，我们将始终致力于守护埃及的遗产，无论是保全其珍宝，还是向新生代传授它的历史与文化。"
 pod1230objectives_mummy.4.a: "埃及即吾魂"
 pod1230objectives_mummy.5.t: "斩断鹰首"
 pod1230objectives_mummy.5.desc: "我们的创造者赛特与荷鲁斯的战争已延续数代。尽管他始终未能彻底消灭对手令人忧心，但必须承认，荷鲁斯确是值得一战的敌人——毕竟你的真主$glossary_wyrm_apophis$如此告诫过你。\n这位鹰首神明是玛阿特（他所理解的“平衡”）的捍卫者，也是阿波菲斯为世间带来湮灭馈赠的最大阻碍。如今，复仇者与其父母一同步入真正的死亡，命运之轮转动的速度已势不可挡……"
 pod1230objectives_mummy.5.a: "鹰隼绝啼"
 pod1230objectives_mummy.6.t: "午夜前的最后一餐"
 pod1230objectives_mummy.6.desc: "荷鲁斯之死虽然重创了平衡守护者，却意外坚定了他们的决心。就连曾指责他过于偏执顽固的敌手，此刻也集结在他的名号（与事业）之下试图阻止你。\n\n当然，他们并未成功。\n\n但他们确实上演了一场精彩抵抗，让湮灭与$glossary_wyrm_apophis$的终极胜利迟来了片刻。随着最后一位抵抗者的倒下，世界正加速滑向终局。阿波菲斯已胜，这腐朽的现实终将归于虚无。"
 pod1230objectives_mummy.6.a: "盛宴之时"
 pod1230objectives_mummy.7.t: "平息复仇之怒"
 pod1230objectives_mummy.7.desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName]向来明确表示，他认为自己是唯一配得上使用生命神咒的存在。因此，任何不遵守他律法的木乃伊都会不幸地被列入他的敌人名单。\n不过，荷鲁斯虽固执却不愚蠢。他深知世间存在比你更严重的威胁。通过动摇他的核心圈子，并展示足够实力让他明白追猎你将付出沉重代价，紧张局势已略有缓和。你或许永远无法与这位奥西里斯之子成为朋友，但他至少勉强同意暂时放过你。"
 pod1230objectives_mummy.7.a: "至少达成了停战。"
 pod1230objectives_mummy.8.t: "终结复仇者"
 pod1230objectives_mummy.8.desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName]向来宣称唯有自己配得上使用生命神咒。任何违逆其律法的木乃伊，都会被他视为仇敌。\n与一个历经数纪元仍执念复仇的存在理论毫无意义。木乃伊虽难杀死却非真正不朽，你带着快意让那个世代折磨你的存在亲身体验了这一点。随着奥西里斯与伊西斯之子终归冥界与双亲团聚，你大可安心规划自己的未来了。"
 pod1230objectives_mummy.8.a: "赛特此刻定在嗤笑。"
 pod1230objectives_mummy.9.t: "拓展神术技艺"
 pod1230objectives_mummy.9.desc: "木乃伊诞生自古埃及生命神咒，天然亲近赫考，古埃及的术法体系。即便前世非此文化者也会迅速掌握赫考。但这始终是其他木乃伊，如古希腊卡比里的痛点，他们曾以其他术法取得辉煌成就。\n尽管重拾这些技艺的尝试长期无果，你近期通过搜集凡人术士及其（古今）知识的方法已初见成效。虽然非赫考术法对木乃伊而言永远难以得心应手，但至少具备了可行性。"
 pod1230objectives_mummy.9.a: "再启学徒制。"
 pod1230objectives_mummy.10.t: "掌控哈迪斯"
 pod1230objectives_mummy.10.desc: "[GetScriptedCharacterByHistoryID('792600').GetFirstName]初创生命神咒时，面临无法进入阿蒙提（木乃伊死后重组自身的古埃及冥界）的难题。为此他割据幽土一隅命名为\"哈迪斯\"作为替代，并说服冥界统领卡戎承认这片飞地，传说因二者皆具迈锡尼血统。\n无论真相如何，哈迪斯始终是阿蒙提的拙劣仿品，几无助于木乃伊实现真正永生。而经你努力，卡比里木乃伊如今能在需要时于冥界获得更安稳的休憩之所。"
 pod1230objectives_mummy.10.a: "属于我们的乐土。"
 pod1230objectives_mummy.11.t: "从希腊到埃及"
 pod1230objectives_mummy.11.desc: "木乃伊源于古埃及，其力量塞赫仍与这片土地相连。而由迈锡尼始祖衍生的卡比里则无此便利，这使他们长期处于劣势，老练的木乃伊能将塞赫发挥至强。\n因数量稀少且遭超自然存在猎杀，卡比里从未有机会深入研究解决之道。直到你开创性地直接从源头汲取并适配迈锡尼根基的塞赫，终于弥合了与荷鲁斯古追随者间的鸿沟。"
 pod1230objectives_mummy.11.a: "再续希腊埃及之盟。"
 pod1230objectives_mummy.12.t: "守护知识"
 pod1230objectives_mummy.12.desc: "天宗虽封闭自利，却也知永生者面对第六纪元负有重任。即便[Glossary('魔皇','podgloss.demonemperor')]降临无可阻挡，那也不过是永恒轮回中的一瞬。因此他们认为必须及时保存历代文明精华。\n知识是这项使命的核心。[Glossary('魔皇','podgloss.demonemperor')]将开启蒙昧纪元，使人类重归野蛮。唯有确保先代智慧不失，方可避免文明倾覆。"
 pod1230objectives_mummy.12.a: "求知者，方存在。"
 pod1230objectives_mummy.13.t: "庇护众生"
 pod1230objectives_mummy.13.desc: "天宗虽封闭自利，却也知永生者面对第六纪元负有重任。即便[Glossary('魔皇','podgloss.demonemperor')]降临无可阻挡，那也不过是永恒轮回中的一瞬。因此他们认为必须及时保存历代文明精华。\n虽终将失败，但天宗必须确保其中高洁者不致陨落。牵制[Glossary('魔皇','podgloss.demonemperor')]的注意力，才能保证纪元之轮在其登极后继续转动。"
 pod1230objectives_mummy.13.a: "为将倾之世铸就英雄。"
 pod1230objectives_mummy.14.t: "守护中原"
 pod1230objectives_mummy.14.desc: "天宗虽封闭自利，却也知永生者面对第六纪元负有重任。即便[Glossary('魔皇','podgloss.demonemperor')]降临无可阻挡，那也不过是永恒轮回中的一瞬。因此他们认为必须及时保存历代文明精华。你已竭尽所能，成就甚至超越常人所想。你的抗争将延迟魔皇登极，并使黑暗统治遭遇抵抗。\n但你深知这仍不足够，正是在这疑虑中，你恍悟位列八仙并非如曾经所想是种奖赏，而是意味着更沉重的责任。如果你愿意，与邪恶的下一战场将是宇宙实相之境。"
 pod1230objectives_mummy.14.a: "末世英雄"
 pod1230objectives_mummy.15.t: "守护中原"
 pod1230objectives_mummy.15.desc: "你已竭尽所能，成就甚至超越常人所想。你的抗争将延迟[Glossary('魔皇','podgloss.demonemperor')]登极，并使黑暗统治遭遇抵抗。\n但你深知这仍不足够，正是在这疑虑中，你恍悟位列八仙并非如曾经所想是种奖赏，而是意味着更沉重的责任。\n若你愿意，与邪恶的下一战场将是宇宙实相之境。"
 pod1230objectives_mummy.15.a: "此地仍需我存续。"
 pod1230objectives_mummy.15.b: "战火已燃向其他疆域。"
 pod1230objectives_mummy.16.t: "成就拉-赫考"
 pod1230objectives_mummy.16.desc: "古老的木乃伊们将拉-赫考称为赫考的至高神术，通过运用万物的[Glossary('真名','podgloss.truename')]令其屈从于己志，从而主宰世界。据埃及传说记载，当太阳神拉将自己的[Glossary('真名','podgloss.truename')]赐予伊西斯以治愈致命剧毒时，拉-赫考首次显现于世。此举使她成为魔法女神，并构筑了生命神咒。\n他们很快悲哀地意识到，生命神咒存在缺陷，且在初次死亡后便丧失了维系这种真正魔法形式所需的人性火花。部分木乃伊始终致力于重新发掘失落的秘术，或寻求完善生命神咒的方法，以期重返木乃伊力量的黄金时代。\n尽管完全掌控拉-赫考对他们而言仍遥不可及，但通过实验与改进现有知识，仍能逐步提升其当前形态的能力。"
 pod1230objectives_mummy.16.a: "更近昔日荣光。"