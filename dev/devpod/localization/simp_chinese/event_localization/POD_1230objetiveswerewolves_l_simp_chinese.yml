 coruroc_quest_decision: "科鲁克的个人委托"
 coruroc_quest_decision_desc: "科鲁克请求你以白嚎的名义清除黑螺旋舞者污染。他们肮脏的巢穴必须全部清除！"
 coruroc_quest_decision_tooltip: "为白嚎复仇。"
 coruroc_quest_decision_confirm: "终于干净了？"
 coruroc_quest_decision_custom: "在地图上不能有[GetReligionByKey('blackspiraldancer_religion').GetName][religion|E]信徒[ruler|E]"
