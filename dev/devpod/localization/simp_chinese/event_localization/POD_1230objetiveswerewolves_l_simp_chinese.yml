l_simp_chinese:
 blackfury_objective_decision:0 "盖亚之女"
 blackfury_objective_decision_tooltip:1 "黑怒必须挺身而出，领导狼国。"
 blackfury_objective_decision_desc:0 "如果黑怒要领导狼国摆脱喋喋不休的玩闹，她们必须首先找到一个配得上的女族长，并巩固他们的故土。"
 blackfury_objective_decision_effect_tooltip:1 "你将获得黑怒帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 blackfury_objective_decision_confirm:0 "母亲，女儿和头领"
 blackfury_decision_custom:0 "[GetTitleByKey('b_montbelliard').GetNameNoTier]的日耀圣地，必须已升到满级"
 pod1230objectives_werewolves.1.t:0 "盖亚之女"
 pod1230objectives_werewolves.1.desc:0 "黑怒一直与她们的地中海故乡联系在一起。罗马的崛起和随其而来的城市发展，标志着她们对该地区统治的结束，以及黑怒的影响一点一点地被吸血鬼减少。不再是了。\n多亏了新来的强大女族长，狡猾地利用凡人的机构来对付吸血鬼，以及一些堪比亚马逊的大胆攻击，黑怒再次在意大利巩固了一个坚实的立足点。\n其他部族现在正在观察，想知道黑怒是否能利用这个令人惊讶的胜利。也许盖亚真的打算让她的勇士们团结在她的诸女儿之下？"
 pod1230objectives_werewolves.1.a:0 "母亲，请听我们胜利的呼声！"
 pod1230objectives_werewolves.2.a:0 "卑鄙的狼人！"
 pod1230objectives_werewolves.2.b:0 "亚马逊再次横行"
 bonegnawer_objective_decision:0 "盖亚之笑"
 bonegnawer_objective_decision_tooltip:1 "倘若拾荒者成了领导者，且不是特别病态的玩笑？"
 bonegnawer_objective_decision_desc:0 "我们是狼国食物链的底层。但凭借我们的技巧和狡猾，我们可能会向所有这些高大上的部族证明我们真的可以很有用。"
 bonegnawer_objective_decision_effect_tooltip:1 "你将获得啮骨者帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 bonegnawer_objective_decision_confirm:0 "推翻王座！"
 bonegnawer_decision_custom:0 "[GetTitleByKey('b_oviedo').GetNameNoTier]的星域圣地，必须已升到满级"
 pod1230objectives_werewolves.3.t:0 "盖亚之笑"
 pod1230objectives_werewolves.3.desc:0 "当强大的影爵和银牙争斗不休，当勇敢的芬里尔仔兽和芬尼安无望绝战的时候，啮骨者在等待。在人类文明发展的帮助下，鼠之子们做了他们最擅长的事情：生存、适应和发展。\n当其他部族看起来越来越像过去的遗迹时，啮骨者比以往任何时候都更适应变化了的人类，现在每个人都在勉强地向他们寻求帮助和建议，以应对这个变化了的社会。狼国的底层人有了复仇的机会，而且正相互传递帮助，迅速地往上攀升……"
 pod1230objectives_werewolves.3.a:0 "老鼠不会离开这艘船，它们会掌控它！"
 pod1230objectives_werewolves.4.b:0 "从清道夫到头领？"
 childofgaia_objective_decision:0 "盖亚之团结"
 childofgaia_objective_decision_tooltip:1 "证明团结不是弱点，而是一个永无止境的挑战。"
 childofgaia_objective_decision_desc:0 "我们一直在努力争取狼国的团结，但更好战的部族仍然避开我们。我们必须证明，团结给了我们力量，而不是弱点。"
 childofgaia_objective_decision_effect_tooltip:1 "你将获得盖亚之子帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 childofgaia_objective_decision_confirm:0 "且来且听"
 childofgaia_decision_custom:0 "[GetTitleByKey('b_kem').GetNameNoTier]的白海圣地，必须已升到满级"
 pod1230objectives_werewolves.5.t:0 "盖亚之团结"
 pod1230objectives_werewolves.5.desc:0 "盖亚之子常常被认为是一个和平而软弱的部族，但他们是一支团结的力量，目的高于一切。过去，他们努力说服他们的同胞部族坐下来讨论他们的争斗（而不是互相敲打对方的头），但没有取得成果。\n然而，这种情况最近有所改变，因为他们已经证明了他们的信念的力量，以及如果盖亚的所有拥护者作为一个整体行动，可以取得的巨大成果。最后，也许是第一次，各部族都在倾听，狼国似乎从未如此强大和团结。\n诚然，盖亚现在一定在对她的孩子们微笑。"
 pod1230objectives_werewolves.5.a:0 "他们终于懂了。"
 pod1230objectives_werewolves.6.b:0 "统合的狼族？可怕的前景。"
 fianna_objective_decision:0 "盖亚的英雄"
 fianna_objective_decision_tooltip:1 "群岛是我们祖先的土地，没有蚂蟥能把我们赶出这里！"
 fianna_objective_decision_desc:0 "曾经群岛无可争议的主人，随着密特拉的回归和剥皮瘟疫的发生，芬尼安已经陷入了困境。我们必须在为时已晚之前进行反击！"
 fianna_objective_decision_effect_tooltip:1 "你将获得芬尼安帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 fianna_objective_decision_confirm:0 "盛宴时间到！"
 fianna_decision_custom:0 "[GetTitleByKey('b_castletown').GetNameNoTier]的狂海圣地，必须已升到满级"
 pod1230objectives_werewolves.7.t:0 "盖亚的英雄"
 pod1230objectives_werewolves.7.desc:0 "虽然因其战斗力和著名的说书人而备受尊重，但芬尼安往往被其他部族认为太不守规矩。由于缺乏纪律，他们在群岛上遭受了重大挫折，导致他们越来越多地与狼国的其他成员隔离。\n然而，随着强大的统治者的继任和新的使命感，芬尼安再次成为不列颠尼亚的主人。人们已经开始创作歌曲来纪念这一伟大的事迹，芬尼安现在将开始向外看，也许会把他们的帮助带给狼国的其他部分。\n……在从所举办的最史诗般的盛宴中恢复过来之后。"
 pod1230objectives_werewolves.7.a:0 "我还能喝……嗝。"
 pod1230objectives_werewolves.8.b:0 "凯尔特人来了。"
 get_fenris_objective_decision:0 "盖亚的狂战士"
 get_fenris_objective_decision_tooltip:1 "奥丁的幼崽仍然活着。对伟大的芬里斯的所有战士的侮辱！"
 get_fenris_objective_decision_desc:0 "尽管赢了除掉沃坦的巨大战役，他的衍体仍然潜伏在南方，而德意志的蚂蟥也侵入了我们的土地。他们都必须受到惩罚！"
 get_fenris_objective_decision_effect_tooltip:1 "你将获得芬里尔仔兽帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 get_fenris_objective_decision_confirm:0 "我们将摧毁英灵殿！"
 get_fenris_decision_custom:0 "[GetTitleByKey('b_biton').GetNameNoTier]的芬布尔之冬夜圣地，必须已升到满级"
 pod1230objectives_werewolves.9.t:0 "盖亚的狂战士"
 pod1230objectives_werewolves.9.desc:0 "芬里尔仔兽是无比可怕的战士，在狼国没有人否认这一点。但他们的暴力、近乎狂虐的方式使他们与其他部族产生了矛盾。但时代变了。\n随着文明和控制着它的蚂蟥的猖獗发展，芬里尔仔兽主张狼国在他们的领导下统一在无可争议的阿尔法旗下。随着瑞典故土的成功收复，他们为自己提出了强有力的证明，许多人已经涌向了他们的旗帜。\n鲜血和暴力将摧毁盖亚的敌人，如果这还不够，甚至更多的流血应该会有效果……"
 pod1230objectives_werewolves.9.a:0 "我们将摧毁天堂！"
 pod1230objectives_werewolves.10.b:0 "诸神黄昏？"
 redtalon_objective_decision:0 "盖亚之怒"
 redtalon_objective_decision_tooltip:1 "奇原尚未死。"
 redtalon_objective_decision_desc:0 "文明正越来越猖獗，而其他部族拒绝采取行动。最终要靠我们从可恶的人类手中拯救盖亚。"
 redtalon_objective_decision_effect_tooltip:1 "你将获得赤爪帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 redtalon_objective_decision_confirm:0 "牢记刀耕之治"
 redtalon_decision_custom:0 "[GetTitleByKey('b_kazan').GetNameNoTier]的冬林圣地，必须已升到满级"
 pod1230objectives_werewolves.11.t:0 "盖亚之怒"
 pod1230objectives_werewolves.11.desc:0 "赤爪从未放松过对刀耕之治的关注，他们认为这种对人类的杀戮是必要的。由于其他部族放弃了这个想法，他们发现自己越来越孤立。但是，若赤爪如果没有耐心的话，那他们就什么都不是。\n撤退到仍然荒芜的大草原上，他们确保清除该地区任何不受欢迎的外来者，并等待时机。当其他部族被人类的发展和随之而来的吸血鬼所吞噬时，赤爪却蓬勃发展。而现在，他们是狼国剩下的最强大的势力，他们的嚎叫将被聆听。\n刀耕之治将按计划进行，盖亚将在人类的血液中得到拯救，无论他们是否愿意。"
 pod1230objectives_werewolves.11.a:0 "他们将再次惧怕狼群。"
 pod1230objectives_werewolves.12.b:0 "人类对抗狂野，再上演。"
 warderofmen_objective_decision:0 "盖亚的坚韧"
 warderofmen_objective_decision_tooltip:1 "为了生存，我们必须适应"
 warderofmen_objective_decision_desc:0 "人类存留在此，我们必须向狼国证明，前进的方向跟他们在一起，而不是反过来。"
 warderofmen_objective_decision_effect_tooltip:1 "你将获得人类监护者帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 warderofmen_objective_decision_confirm:0 "共同走向新道路"
 warderofmen_decision_custom:0 "[GetTitleByKey('b_acre').GetNameNoTier]的光誓圣地，必须已升到满级"
 pod1230objectives_werewolves.13.t:0 "盖亚的坚韧"
 pod1230objectives_werewolves.13.desc:0 "人类监护者很快就被其他部族斥为“人类爱好者”，但人类监护者并不在意。就像他们的灵类图腾——蟑螂一样，他们努力奋斗，在一切中生存。人类和文明现在正处于上升期，而人类监护者知道这一点。他们对人类胜利的不可抗拒性的深刻理解是导致他们今天处于强势地位的原因。\n当其他部族试图依附于过去的时代时，人类监护者则为他们铺平了前进的道路，对他们计划的合理性充满信心。像他们一样，狼国将忍受和发展，但最重要的是，将生存下去。"
 pod1230objectives_werewolves.13.a:0 "生存、忍耐、兴旺。"
 pod1230objectives_werewolves.14.b:0 "城狼？"
 shadowlord_objective_decision:0 "盖亚之影"
 shadowlord_objective_decision_tooltip:1 "应该由我们领导狼国，而不是那些浮夸的银牙。"
 shadowlord_objective_decision_desc:0 "如果我们想让其他部族承认我们统治他们的正确性，我们必须首先展示出强大的武力。"
 shadowlord_objective_decision_effect_tooltip:1 "你将获得影爵帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 shadowlord_objective_decision_confirm:0 "早该如此！"
 shadowlord_decision_custom:0 "[GetTitleByKey('b_okachiv').GetNameNoTier]的夜空圣地，必须已升到满级"
 pod1230objectives_werewolves.15.t:0 "盖亚之影"
 pod1230objectives_werewolves.15.desc:0 "长期以来，狼国一直缺乏适当的领导。银牙，这些喋喋不休的小丑，一直在大张旗鼓地“领导”我们。但他们只是让各部族陷入分裂和无望的战斗。\n随着我们的故土再次安全，我们已经证明，只有影爵才适合领导狼国前进。而现在，我们将使用我们所掌握的所有工具，确保盖亚最终取得胜利。各个部族将跟随我们取得对怒嚎末日的胜利……无论他们是否愿意。"
 pod1230objectives_werewolves.15.a:0 "盖亚需要机智的勇士。"
 pod1230objectives_werewolves.16.b:0 "银牙的王位被推翻了。"
 silentstrider_objective_decision:0 "流放者的新家"
 silentstrider_objective_decision_tooltip:1 "我们已经失去了埃及，我们必须重新开始。"
 silentstrider_objective_decision_desc:0 "马拉喀什是我们失去埃及后的新家。我们必须确保该悲剧不再发生。"
 silentstrider_objective_decision_effect_tooltip:1 "你将获得寂静漫游者帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 silentstrider_objective_decision_confirm:0 "我们现已准备好"
 silentstrider_decision_custom:0 "[GetTitleByKey('b_marrakesh').GetNameNoTier]的卜塔之轮圣地，必须已升到满级"
 pod1230objectives_werewolves.17.t:0 "流放者的新家"
 pod1230objectives_werewolves.17.desc:0 "在与赛特的长期斗争之后，寂静漫游者被迫从他们的故乡埃及流亡。成为游牧民族一段时间后，他们终于在马拉喀什定居，从那时起，他们的命运有了很大的改善。\n现在，寂静漫游者牢牢地控制着他们的新家，作为一股不可忽视的势力回来了。他们从流亡中获得的智慧和信念的力量也使他们越来越受到其他部族的追捧，他们现在想知道，寂静漫游者是否可能成为领导狼国的一个不寻常但有前途的新候选人。"
 pod1230objectives_werewolves.17.a:0 "一起去埃及？"
 pod1230objectives_werewolves.18.b:0 "一起去埃及？"
 silverfang_objective_decision:0 "王的回归"
 silverfang_objective_decision_tooltip:1 "我们是狼国的领袖，从现在到永远。"
 silverfang_objective_decision_desc:0 "我们对其他部族的领导权近来一直有争议。需要展示武力来平息反对者的不满。"
 silverfang_objective_decision_effect_tooltip:1 "你将获得银牙帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 silverfang_objective_decision_confirm:0 "我将篡夺直控权"
 silverfang_decision_custom:0 "[GetTitleByKey('b_voronezh').GetNameNoTier]的新月圣地，必须已升到满级"
 pod1230objectives_werewolves.19.t:0 "王的回归"
 pod1230objectives_werewolves.19.desc:0 "自罗马时代以来，银牙一直狼国的传统领袖。随着帝国的衰落，以及该部族逐渐向东转移，这一传统已经受到了质疑。像影爵或赤爪这样的部族已经出现在权力真空中，以削弱银牙的权威，而像寂静漫游者或芬尼安这样的部族则由于地理距离的原因而失联了。\n然而，随着他们最近在俄罗斯的成功，银牙证明了他们只是转移了他们的势力中心，而没有失去先前使他们受到尊重的能力。还不是所有的部族都失败了，但狼人的贵族们正逐渐接近于重申他们的自然权利。"
 pod1230objectives_werewolves.19.a:0 "诸王万岁！"
 pod1230objectives_werewolves.20.b:0 "他们保下了他们的王位……目前而言"
 stargazer_objective_decision:0 "盖亚的智慧"
 stargazer_objective_decision_tooltip:1 "从内心的平静中可以升华出更大的团结。"
 stargazer_objective_decision_desc:0 "我们宣扬节制，我们也选择站在狼国的一边。但无为不该持续过久，免得变成冷漠。"
 stargazer_objective_decision_effect_tooltip:1 "你将获得星占帝国[title|E]，来自你的部族的强大遗产，并离统一狼族的目标更近一步。"
 stargazer_objective_decision_confirm:0 "是时候拜见我们的西方表亲了"
 stargazer_decision_custom:0 "[GetTitleByKey('b_xigaze').GetNameNoTier]的雪豹圣地，必须已升到满级"
 pod1230objectives_werewolves.21.t:0 "盖亚的智慧"
 pod1230objectives_werewolves.21.desc:0 "我们没有参加魂怒之战，此后我们一直保持中立，保持自己的意见。不过，我们与我们的西方表亲能保持多大的距离是有限度的。显然，狼族在这个新时代所面临的威胁需要团结一致。\n其他部族一次又一次地显示出他们轻率行动的倾向和缺乏仔细的计划。我们可以提供贤明的领导，将这种愤怒引导到更有成效的事情上。现在是狼国拥抱盖亚的智慧的时候了。"
 pod1230objectives_werewolves.21.a:0 "是时候冷静下来听一听了，表亲们。"
 pod1230objectives_werewolves.22.b:0 "这些奇怪的家伙"
 gaia_objective_decision:0 "盖亚的胜利"
 gaia_objective_decision_tooltip:1 "我们已经提出了领导狼国的主张，现在是证明自己配得上的时候了！"
 gaia_objective_decision_desc:0 "我们已经提出了领导狼国的主张，现在是证明自己配得上的时候了！"
 gaia_objective_decision_effect_tooltip:1 "你将获得狼国帝国[title|E]、强大的独特信仰信条、以及对非狼人统治者的削弱。"
 gaia_objective_decision_confirm:0 "为了盖亚! 向前进！"
 pod1230objectives_werewolves.23.t:0 "盖亚的胜利"
 pod1230objectives_werewolves.23.desc:0 "尽管发生了剥皮瘟疫和文明的猖獗发展，狼族还是经受住了考验。在一个新的和受人尊敬的领导下，各部族已经团结起来，对可怕的吸血鬼和他们众多的爪牙发动了一场共同的战争。狼人正一步步收复失去的圣地，遏制城市的发展，并确保人类保持其适当的位置。随着越来越多的蚂蟥被獠牙和利爪撕碎，几乎没有疑问：这是一个狼的时代。\n怒嚎末日可以再等等，因为狼族比以往任何时候都更准备好着守护他们心爱的盖亚。"
 pod1230objectives_werewolves.23.a:0 "地母得救了！"
 pod1230objectives_werewolves.24.b:0 "盖亚真的被拯救了？"
 pod1230objectives_werewolves.23.custom:0 "非狼人统治者将在未来100年内获得一个极度负面的增益——文明崩溃。更低头衔等级的狼人统治者现在将永远接受该角色的要求臣服提议，黑螺旋舞者除外。"
 blackspiraldancer_objective_decision:0 "慈爱的孙子女"
 blackspiraldancer_objective_decision_tooltip:1 "小祖母希望我们能好好表现！"
 blackspiraldancer_objective_decision_desc:0 "鬼婆——芭芭雅嘎——是我们主人最信任的仆人之一。如果我们通过消灭她的敌人来取悦她，她一定会奖励我们的！"
 blackspiraldancer_objective_decision_effect_tooltip:1 "芭芭雅嘎将赐予你在某种程度上的永生。"
 blackspiraldancer_objective_decision_confirm:0 "祖母你满意了么？"
 blackspiraldancer_victory_objective_decision_custom:0 "[GetTitleByKey('k_crescent_moon').GetNameNoTier][title|E]必须被你掌控或已被销毁"
 pod1230objectives_werewolves.25.t:0 "慈爱的孙子女"
 pod1230objectives_werewolves.25.desc:0 "影幕的迅速扩张，在很大程度上归功于你，使小祖母芭芭雅嘎非常高兴。所有对她统治的密切威胁的毁灭使她能够集中精力处理更重要的事情，但这并不意味着她已经忘记了你。\n在进行了巨大的仪式以确保你（可能）会存活下来之后，鬼婆已[Embraced|E]了你，使你成为她的“维克拉卡斯”之一，即吸血鬼和狼人之间的混血，有人称之为“恶煞”。你现在是永生者，能够同时调用两大种族的力量。大多数人都会想起你可怕的转变，但你知道它的真正含义：最强的赠礼。"
 pod1230objectives_werewolves.25.a:0 "我已完美。"
 pod1230objectives_werewolves.26.a:0 "这是什么脏东西！？"
 pod1230objectives_werewolves.26.b:0 "这是什么脏东西！？"
 become_abomination_tt:0 "作为恶煞，你可以使用所有吸血鬼能力，除了[Embrace|E]。虽然你不再是狼人了，但你仍然可以使用血种和月兆灵赋，以及化形选项。"
 become_abomination_holdings_tt:0 "你的地产将从部落转为城堡，并在过程中失去不兼容的建筑。"
 storyteller_quest_decision:0 "盖亚的重任"
 storyteller_quest_decision_desc:0 "狼人为灵类实体授予的史诗任务而生（往往也为之而死）。如果能成功完成一项任务，你将获得丰厚的奖励。\n收集传奇书籍对盖亚来说是一项值得付出的努力。"
 storyteller_quest_decision_tooltip:1 "赢得传奇灵赋"
 storyteller_quest_decision_confirm:0 "为了盖亚！"
 release_from_bondage_quest_decision:0 "灵君的重任"
