 prelude_to_apocalypse_quest_decision_desc: "狼人为灵类实体授予的史诗任务而生（往往也为之而死）。如果能成功完成一项任务，你将获得丰厚的奖励。\n杀死世界上最强大的盖亚派统治者肯定会让恶神灵君感到高兴。"
