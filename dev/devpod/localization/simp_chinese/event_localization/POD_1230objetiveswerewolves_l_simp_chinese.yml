 aidan_farwatcher_quest_decision_desc:0 "艾丹·远望者为了向背叛的部族复仇，要求你杀死黑螺旋舞者。"
 aidan_farwatcher_quest_decision_tooltip:1 "解开螺旋？"
 aidan_farwatcher_quest_decision_confirm:0 "血腥的报复"
 stop_flaying_plague_decision:0 "停止剥皮瘟疫"
 stop_flaying_plague_decision_tooltip:1 "一定有解决办法！"
 stop_flaying_plague_decision_desc:0 "剥皮瘟疫正在夺走无数狼族和狼嫡的生命。如果不采取任何措施，这可能就是曾经骄傲的盖亚战士们的末日。"
 stop_flaying_plague_decision_effect_tooltip:1 "剥皮瘟疫将停止不断重复蔓延。"
 stop_flaying_plague_decision_confirm:0 "机不可失，时不再来！"
 stop_flaying_plague_decision_custom:0 "你需要每个属性都在10以上，而勇武需要在40以上。或者用你的战群的最高属性也行。"
 pod1230objectives_werewolves.27.t:0 "清除瘟疫"
 pod1230objectives_werewolves.27.desc:0 "Thanks to the skills of your pack and your entourage, you have managed to uncover clues about the truth concerning the Flaying Plague. This terrible disease was indeed supernatural in origins, apparently created by a group of mages devoted to the Wyrm calling themselves the Circle of Red.\nThese fools were already behind several brazen attacks against eastern Caerns, most notably in Sofia, and while they tried to cover their tracks, they haven't done it well and quickly enough.\nStorming their lair, you have taken great satisfaction into slashing your way into these Wyrm ridden cultists until their rituals circles were red with their own blood.\nWhile the threat of the Flaying Plague is now behind you, there are still some doubts about the details regarding its creation, some clues leading to a mysterious vampire and others to a demon. This might be worth investigating in the future but, for now at least, you duty to Gaia has been fulfilled."
 pod1230objectives_werewolves.27.a:0 "旷世胜利！"
 pod1230objectives_werewolves.28.a:0 "我想，这对狼来说是件好事。"
 pod1230objectives_werewolves.28.b:0 "终于！"
 weaponize_flaying_plague_decision:0 "掌控剥皮瘟疫"
 weaponize_flaying_plague_decision_tooltip:1 "对付狼人的终极武器？"
 weaponize_flaying_plague_decision_desc:0 "狼人和他们的亲系们，也就是狼嫡们，最近受到了一种非常致命的疾病——剥皮瘟疫的影响。他们显然正在努力寻找解决办法，但在此之前，这种罕见的打破化形者体抗的方法提供了一个机遇。"
 weaponize_flaying_plague_decision_effect_tooltip:1 "作为角色互动，允许你传播剥皮瘟疫。"
 weaponize_flaying_plague_decision_effect_tooltip_2:1 "对囚犯使用剥皮瘟疫，就能在必定成功初拥其并使其变成恶煞（除非是根本无法变成恶煞的化形者）。"
 weaponize_flaying_plague_decision_confirm:0 "我完美的秘密武器！"
 weaponize_flaying_plague_decision_custom:0 "你需要3个或更多的狼人囚犯来做实验。"
 weaponize_flaying_plague_decision_customb:0 "狼人正在努力寻找剥皮瘟疫的源头。一旦他们找到源头（1240年左右），这决议就会消失。"
 pod1230objectives_werewolves.29.t:0 "已掌控剥皮瘟疫"
 pod1230objectives_werewolves.29.desc:0 "The true origins of the Flaying Plague are mysterious. The infernalist Circle of Red seems to be the likeliest culprit but you also came across mentions of interference from a major demon and even some vampires. In any case it is a very impressive feat of ritualized magic with clearly an infernal taint to it.\nYour own experiments on the werewolves at your disposal managed to uncover enough of the process to now understand how to replicate it if necessary.\nEven if the werewolves end up destroying the source of the current Flaying Plague, you will be able to use it in the future."
 pod1230objectives_werewolves.29.a:0 "确实是一个有用的工具……"
 POD_spawn_flaying_plague_interaction:0 "释放剥皮瘟疫"
 POD_spawn_flaying_plague_interaction_desc:0 "你拥有可怕的剥皮瘟疫。只要有一些特定的仪式材料，你就能再次向毫无防备的化形者释放它。"
 POD_spawn_flaying_plague_interaction.tt:0 "在[recipient.GetFirstNamePossessive]的所在地释放剥皮瘟疫。"
 POD_spawn_flaying_plague_actor_toast:0 "剥皮瘟疫在[recipient.GetFirstNamePossessive]的所在地肆虐。"
 POD_spawn_flaying_plague_actor_toast.desc:0 "希望你不会因此而后悔。"
 POD_spawn_flaying_plague_failure_toast:0 "你没能散播在[recipient.GetFirstNamePossessive]的所在地释放出剥皮瘟疫"
 POD_spawn_flaying_plague_failure_toast.desc:0 "但未来会有更多的机会……"
 POD_spawn_flaying_plague_interaction_success:0 "剥皮瘟疫将在[recipient.GetFirstNamePossessive]的所在地爆发，并随着时间的推移从那里蔓延开来。"
 POD_spawn_flaying_plague_interaction_failure:0 "剥皮瘟疫未能生效。"
 POD_inflict_flaying_plague_interaction:0 "感染剥皮瘟疫"
 POD_inflict_flaying_plague_interaction_desc:0 "用剥皮瘟疫感染[recipient.GetFirstName]，削弱其的化形者体抗。如果其能成为恶煞，这将确保初拥能成功。"