 firebringer_quest_decision_desc:0 "狼人为灵类实体授予的史诗任务而生（往往也为之而死）。如果能成功完成一项任务，你将获得丰厚的奖励。\n诡计多端的郊狼神肯定会对此异想天开的任务感到高兴。"
