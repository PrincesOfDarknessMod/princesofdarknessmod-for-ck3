 aidan_farwatcher_quest_decision: "艾丹·远望者的个人委托"
 aidan_farwatcher_quest_decision_desc: "艾丹·远望者为了向背叛的部族复仇，要求你杀死黑螺旋舞者。"
 aidan_farwatcher_quest_decision_tooltip: "解开螺旋？"
 aidan_farwatcher_quest_decision_confirm: "血腥的报复"
 stop_flaying_plague_decision: "停止剥皮瘟疫"
 stop_flaying_plague_decision_tooltip: "一定有解决办法！"
 stop_flaying_plague_decision_desc: "剥皮瘟疫正在夺走无数狼族和狼嫡的生命。如果不采取任何措施，这可能就是曾经骄傲的盖亚战士们的末日。"
 stop_flaying_plague_decision_effect_tooltip: "剥皮瘟疫将停止不断重复蔓延。"
 stop_flaying_plague_decision_confirm: "机不可失，时不再来！"
 stop_flaying_plague_decision_custom: "你需要每个属性都在10以上，而勇武需要在40以上。或者用你的战群的最高属性也行。"
 pod1230objectives_werewolves.27.t: "清除瘟疫"
 pod1230objectives_werewolves.27.desc: "多亏了你的战群和随从的技能，你们成功找到了关于剥皮瘟疫真相的线索。这种可怕的疾病确实有着超自然的起源，其显然是由一群献身于妖蛆的法师创造的，他们自称为“红环会”。\n这帮蠢货已经对东方的圣地发动了数次大胆的袭击，最显著的是在索菲亚。尽管他们试图掩盖自己的踪迹，但做得即不够精巧，也不够迅速。\n在攻入他们的巢穴时，你大肆屠戮这些被妖蛆侵蚀的教徒，直到他们的仪式法阵被自己的血染红。\n虽然剥皮瘟疫的威胁已经过去，但关于其起源的细节仍有疑点，有些线索指向一位神秘的吸血鬼，另一些则指向一位恶魔。虽然这些可能值得未来进一步调查，但至少现在，你对盖亚的职责已经完成。"
 pod1230objectives_werewolves.27.a: "旷世胜利！"
 pod1230objectives_werewolves.28.a: "我想，这对狼来说是件好事。"
 pod1230objectives_werewolves.28.b: "终于！"
 weaponize_flaying_plague_decision: "掌控剥皮瘟疫"
 weaponize_flaying_plague_decision_tooltip: "对付狼人的终极武器？"
 weaponize_flaying_plague_decision_desc: "狼人和他们的亲系们，也就是狼嫡们，最近受到了一种非常致命的疾病——剥皮瘟疫的影响。他们显然正在努力寻找解决办法，但在此之前，这种罕见的打破化形者体抗的方法提供了一个机遇。"
 weaponize_flaying_plague_decision_effect_tooltip: "作为角色互动，允许你传播剥皮瘟疫。"
 weaponize_flaying_plague_decision_effect_tooltip_2: "对囚犯使用剥皮瘟疫，就能在必定成功初拥其并使其变成恶煞（除非是根本无法变成恶煞的化形者）。"
 weaponize_flaying_plague_decision_confirm: "我完美的秘密武器！"
 weaponize_flaying_plague_decision_custom: "你需要3个或更多的狼人囚犯来做实验。"
 weaponize_flaying_plague_decision_customb: "狼人正在努力寻找剥皮瘟疫的源头。一旦他们找到源头（1240年左右），这决议就会消失。"
 pod1230objectives_werewolves.29.t: "已掌控剥皮瘟疫"
 pod1230objectives_werewolves.29.desc: "剥皮瘟疫的真正起源依然神秘。虽然崇魔的“红环会”似乎是最有可能的罪魁祸首，但你也发现了一些提到大恶魔甚至是吸血鬼干预的线索。无论如何，这显然是一个令人印象深刻的仪式魔法壮举，且显然带有崇魔的色彩。\n你在狼人身上进行的实验已经揭示了足够的过程细节，足以在必要时复制这种瘟疫。\n即使狼人最终摧毁了当前剥皮瘟疫的源头，你也将能在未来利用它。"
 pod1230objectives_werewolves.29.a: "确实是一个有用的工具……"
 POD_spawn_flaying_plague_interaction: "释放剥皮瘟疫"
 POD_spawn_flaying_plague_interaction_desc: "你拥有可怕的剥皮瘟疫。只要有一些特定的仪式材料，你就能再次向毫无防备的化形者释放它。"
 POD_spawn_flaying_plague_interaction.tt: "在[recipient.GetFirstNamePossessive]的所在地释放剥皮瘟疫。"
 POD_spawn_flaying_plague_actor_toast: "剥皮瘟疫在[recipient.GetFirstNamePossessive]的所在地肆虐。"
 POD_spawn_flaying_plague_actor_toast.desc: "希望你不会因此而后悔。"
 POD_spawn_flaying_plague_failure_toast: "你没能散播在[recipient.GetFirstNamePossessive]的所在地释放出剥皮瘟疫"
 POD_spawn_flaying_plague_failure_toast.desc: "但未来会有更多的机会……"
 POD_spawn_flaying_plague_interaction_success: "剥皮瘟疫将在[recipient.GetFirstNamePossessive]的所在地爆发，并随着时间的推移从那里蔓延开来。"
 POD_spawn_flaying_plague_interaction_failure: "剥皮瘟疫未能生效。"
 POD_inflict_flaying_plague_interaction: "感染剥皮瘟疫"
 POD_inflict_flaying_plague_interaction_desc: "用剥皮瘟疫感染[recipient.GetFirstName]，削弱其的化形者体抗。如果其能成为恶煞，这将确保初拥能成功。"
 bagheera_objective_decision: "阿卡里、普拉、多亚拉"
 bagheera_objective_decision_tooltip: "探索、奠基、传承"
 bagheera_objective_decision_desc: "巴希拉认为自己是猫人中最全面的一族。凭借众多才华和极大的魅力，黑豹是唯一被其他所有部族接受为朋友的部族。或许，他们可以利用这一点推动猫国的统一？"
 bagheera_objective_decision_effect_tooltip: "你将解锁一系列事件，带你走上统一猫国的道路。作为一名巴希拉，这个过程将相对容易一些。"
 bagheera_objective_decision_confirm: "稳步如猫。"
 bagheera_objective_decision_custom: "你需要每项属性达到10以上，勇武属性需达到40以上。你的战群成员的属性也能计入。"
 pod1230objectives_werewolves.31.desc: "根据他们的传说，巴希拉曾作为猫族的裁判者被创造。虽然这一职责早已不存，但他们保留了与之相关的天生好奇心和令人亲近的魅力。正如他们常说的那样，他们是真正的猫之精神的体现，智慧、爱与愤怒融合在一起。在破碎的芭丝特部族中，只有巴希拉保持了与所有亲属的友好关系，随着他们最近声名鹊起，一个想法被屡屡提及，也许是时候了，是时候让豹人利用这一优势，推动分裂的猫国实现统一了。\n尽管其他部族对这一想法持怀疑态度，但巴希拉目前才华横溢的统治者至少使他们能够坐到谈判桌前。现在，还需观察这些富有魅力的豹人是否能将这一努力推进到令人满意的结局。"
 pod1230objectives_werewolves.31.a: "我们都是塞勒涅的孩子！"
 bubasti_objective_decision: "猫与蛇之战"
 bubasti_objective_decision_tooltip: "我们很有耐心。我们会等待我们的胜利复仇。"
 bubasti_objective_decision_desc: "布巴斯提曾经被埃及人尊敬为神祇，但由于与赛特之子的战争，他们失去了一切。然而，就像女神芭丝特一样，他们是耐心的，蛇神的信徒还没有见识到黑土之国的午夜黑猫的最后一面。"
 bubasti_objective_decision_effect_tooltip: "你将解放被捕获的猫类亲族，从而在未来获得他们的帮助。\n你还将解锁一系列事件，使你踏上统一猫国之路。"
 bubasti_objective_decision_confirm: "保持谨慎。"
 pod1230objectives_werewolves.32.desc: "曾被埃及人民尊敬为神祇的布巴斯提在与赛特信徒的战争中失去了一切。然而，他们一直保持耐心，并凭借数千年的魔法知识，观察和等待合适的时机来反击。\n他们找到了那个时机。\n通过领导一支勇敢的奥西里斯联盟联合军进攻赛特之子的翁布神殿，布巴斯提成功解救了他们失散的亲属凯布尔猫，并对他们永恒的敌人造成了强力的打击。\n随着他们骄傲的复兴，猫子亲族也终于得以再次繁荣，黑土之国的午夜黑猫给猫国其他部族留下了深刻的印象。虽然许多人对他们奇异术法仍然感到警惕，但大多数人至少愿意考虑让布巴斯提在未来扮演更重要的角色。"
 pod1230objectives_werewolves.32.a: "向影猫致敬。"
 ceilican_objective_decision: "舞动的疯狂"
 ceilican_objective_decision_tooltip: "悠闲和漫不经心的时间已经结束。妖精的背叛者们将会受到惩罚。"
 ceilican_objective_decision_desc: "曾经无忧无虑、过着享乐主义生活的祟利坎，已被妖精领主萨姆哈奇背叛，他的追捕手段高效得几乎将他们逼至灭绝。解救这些俘虏需要一个周密的计划和一个坚强的英雄团队，但这可能是祟利坎生存的唯一希望。"
 ceilican_objective_decision_effect_tooltip: "你将解救被俘的兄弟姐妹，他们将加入你的宫廷。\n你还将解锁一系列事件，使你踏上统一猫国之路。"
 ceilican_objective_decision_confirm: "另一种形式的舞蹈……"
 pod1230objectives_werewolves.33.desc: "曾经无忧无虑、过着享乐主义生活的祟利坎，已被妖精领主萨姆哈奇背叛，他的追捕手段高效得几乎将他们逼至灭绝。然而，这些“变化无常的猫”并未放弃，在你的细心领导下，他们成功地策划了一次惊人的复仇，攻入了萨姆哈奇的妖精王庭，解救了他们被俘的同胞。\n当战胜的祟利坎在他们仇恨并唾弃的叛徒的王庭废墟中跳舞庆祝时，猫国其他部族注意到了这一令人困惑的发展。现在似乎是时候欢迎曾经被认为已灭绝的祟利坎重新回到他们的猫子亲族之中，这或许是塞勒涅母亲旨意的标志，预示着她的孩子们终将超越个人恩怨，团结在同一面旗帜下？"
 pod1230objectives_werewolves.33.a: "聚会还没有结束！"
 khan_objective_decision_judgment_hammer: "你必须找回[GetPODArtifactName('judgment_hammer')]，这是可汗虎族最珍贵的武器，也可以说是整个芭丝特中最强大的武器。"
 khan_objective_decision: "凶猛而又智慧的虎。"
 khan_objective_decision_tooltip: "通过实现完美的平衡，我们将为猫国指引方向。"
 khan_objective_decision_desc: "作为尊贵的猎手、战士和导师，可汗虎族是真正的芭丝特贵族，尽管暴虐的辛巴可能有不同的说法。通过自我完善，他们可以向猫族展示，他们确实是母亲塞勒涅的选民，能够引领猫族走向辉煌未来的领袖。"
 khan_objective_decision_effect_tooltip: "这将提升审判之锤的力量。\n你还将解锁一系列事件，使你踏上统一猫国之路。"
 khan_objective_decision_confirm: "激情、活力与智慧。"
 pod1230objectives_werewolves.34.desc: "愤怒的辛巴认为芭丝特应由狮子领导，那是一种懒惰的生物，依赖妻子狩猎，用力量威逼他人屈服。然而，可汗虎族则以老虎为榜样，老虎是一种智慧而优雅的掠食者，在必要时亲自战斗，但平时则寻求改善自己和族群的状况。长久以来，其他芭丝特秘密希望可汗虎族能在猫国中发挥更重要的作用，以对抗 辛巴。\n由于你的稳健领导，以及复原了传说中的审判之锤，这一时刻终于来临。尽管辛巴可能继续做作和咆哮，但其他部族现在正团结在老虎呼吁统一的号召下。"
 pod1230objectives_werewolves.34.a: "猫族的光辉纪元开始了！"
 simba_objective_decision: "狮子霸王"
 simba_objective_decision_tooltip: "狮子是自然之王。是时候让他们记住这一点了。"
 simba_objective_decision_desc: "辛巴是猫族的合法统治者。然而，其他部族的软弱时刻和对“专制统治”的指责侵蚀了这一主张。是时候提醒其他部族谁才是真正的掌控者了。"
 simba_objective_decision_effect_tooltip: "你还将解锁一系列事件，使你踏上统一猫国之路。"
 simba_objective_decision_confirm: "吾王万岁！"
 ruler_catkind_dynasty_modifier: "尊贵而可怕的狮子"
 ruler_catkind_dynasty_modifier_desc: "辛巴已重新确认了对其他芭丝特部族的统治权。狮子们准备好捍卫这一权利，防御任何胆敢挑战这一事实的愚蠢者。"
 pod1230objectives_werewolves.35.desc: "辛巴的传说称，每个芭丝特部族都是由母亲塞勒涅赋予特定使命而创立的。辛巴的使命就是成为统治者。然而，其他芭丝特对这一解释显然持强烈反对态度。这些微不足道的抱怨对强大的狮子们来说毫无影响。\n当其他部族沉迷于无谓的小事时，辛巴只做一件值得做的事情：他们征服并确立了自己作为这片土地的真正统治者的权利，不仅限于非洲。凭借最近在这一主张方面取得的成功，其他部族暂时保持了沉默。"
 pod1230objectives_werewolves.35.a: "真正的王会寻找他能够夺取的东西。"
 swara_spiritual_guardians_modifier: "达马阿奥之灵"
 swara_spiritual_guardians_modifier_desc: "由于与精神世界的紧密联系，斯瓦拉能够比其他芭丝特部族更轻松地依赖于超自然的帮助。"
 swara_objective_decision: "纯净之地的守护者"
 swara_objective_decision_tooltip: "当其他人争吵时，我们在完成母亲塞勒涅交给给我们的工作。"
 swara_objective_decision_desc: "斯瓦拉是灵性满溢之地的守护者。尽管其他芭丝特部族将他们视为懦弱者和孤僻者，但他们却以一种连可汗虎族都艳羡的热情秘密捍卫着非洲的纯洁。"
 swara_objective_decision_effect_tooltip: "你还将解锁一系列事件，使你踏上统一猫国之路。"
 swara_objective_decision_confirm: "我们做必须做的事。"
 swara_objective_decision_caern_tooltip: "你需要拥有每种类型的圣地达到最高等级（5级公国建筑，包括意志圣地、魂怒圣地、领导圣地、智慧圣地和隐谜圣地）。"
 pod1230objectives_werewolves.36.desc: "豹人对于其他部族来说是神秘的。许多人将他们视为懦夫，总是看似无目的地从一个地方跑到另一个地方，避免冲突。然而，事实恰恰相反。斯瓦拉是土地纯洁的勤勉守护者，当他们的神圣职责受到威胁时，他们会像任何狮子一样奋力作战。\n虽然他们没有过多张扬，但最近，他们的工作开始在猫国中取得认可。其他部落沉默了，反思自己在斯瓦拉执行母亲塞勒涅旨意时，争吵或执着于琐碎的问题的行为。这导致了意料之外的动力，将他们推到了恢复猫国统一呼声的前沿。未来是否会看到这个通常孤立的“银族”响应这一号召，还需拭目以待。"
 pod1230objectives_werewolves.36.a: "他们开始明白了吗？"
 pod1230objectives_werewolves.37.t: "万猫之国的统一"
 pod1230objectives_werewolves.37.desc: "随着你最近的成功将你的部族推到芭丝特的前沿，将散布的部族整合成一个统一国家的想法再次浮现。大多数猫族的传说都一致认为，母亲塞勒涅的本意是让你们彼此合作，而第一次分裂是你们在魂怒之战中败给狼人主要的原因。\n尽管这一点已经得到普遍认同，但将猫族重新团结起来仍然是一个非常困难的任务。每个部族都需要被说服，而猫族既顽固又多变，难以应对。"
 pod1230objectives_werewolves.37.a: "来听听他们的观点。"
 pod1230objectives_werewolves.38.desc: "巴希拉完全支持你恢复猫国的计划。毕竟，他们已经倡导这样做了几个世纪。然而，作为猫族的裁判者，他们不希望重蹈覆辙，想要确保你具备领导族人走向繁荣未来的能力。\n他们打算观察你如何工作以及你如何在作为统治者时围绕自己建立团队，在这之后才会完全投入到这个事业中。为此，他们提供了一位睿智导师的教导，以帮助你弥补不足，同时提升你的优点。"
 pod1230objectives_werewolves.38.a: "我们自己就足矣了"
 pod1230objectives_werewolves.38.b: "对他们的帮助表示感激。"
 new_objective_effect_tooltip: "一个新的大决议可用。"
 bagheera_nation_decision_custom: "你需要每项属性达到15或以上，除勇武外，勇武需要达到50或以上。你的战群成员的属性也可以算作有效。"
 bastet_nation_progress_objective_decision_effect_tooltip: "你离恢复猫国又进了一步。"
 bagheera_nation_objective_decision: "万猫之国:巴希拉"
 bagheera_nation_objective_decision_tooltip: "我们必须被裁定为配得上领导猫族。"
 bagheera_nation_objective_decision_desc: "巴希拉认为自己是猫人中最全面的一族。凭借众多才华和极大的魅力，黑豹是唯一被其他所有部族接受为朋友的部族。他们热切希望参与你统一芭丝特的事业，但首先要确保你是一位明智且能干的统治者。"
 bagheera_nation_objective_decision_confirm: "这是对统治能力的绝佳展示。"
 pod1230objectives_werewolves.39.desc: "布巴斯提对你统一猫国这一愿景并不太在意。这个神秘的埃及影猫部族有自己的问题要处理，尤其是他们的族人凯布尔猫被赛特信徒绑架。他们愿意接受你作为猫族的统治者……如果你承诺你将投入大量资源帮助他们的话。不过，他们并非空手而来，还愿意传授你他们祖传魔法的秘密，这些魔法源自于伟大的女神伊西斯曾经滋养他们部族的时代。"
 pod1230objectives_werewolves.39.a: "你们的事业就是我们的事业。"
 pod1230objectives_werewolves.39.b: "你说魔法？"
 pod1230objectives_werewolves.39.c: "我相信我们可以说服他们重新考虑。"
 used_bagheera_joker_tooltip: "你将使用你的“王牌”，这是一次性机会，可以直接将这个部族召集到你的事业中，而无需满足他们的要求。"
 bubasti_knight_help_modifier: "帮助布巴斯提"
 bubasti_knight_help_modifier_desc: "你许多最优秀的勇士目前正在外面，帮助布巴斯提计划着从赛特信徒手中解救他们的同胞。"
 bubasti_nation_objective_decision: "万猫之国：布巴斯提"
 bubasti_nation_objective_decision_tooltip: "是时候走出阴影了。"
 bubasti_nation_objective_decision_desc: "曾被埃及人尊奉为神祇的布巴斯提，因与赛特之子的战争而失去了一切。如果你能提供足够的支持，从解救他们被俘的亲族开始，帮助他们恢复失去的荣耀，他们将投身于你的事业。"
 bubasti_nation_objective_decision_confirm: "这应该足够了。"
 ceilican_nation_objective_decision: "万猫之国：祟利坎"
 pod1230objectives_werewolves.40.desc: "一个意外的客人令在场的芭丝特代表们大吃一惊，他声称自己是 祟利坎中的一员。这个“善变之猫”在凯尔特民间传说中早已被认为已灭绝。这位来访者解释说，祟利坎曾被一个妖精领主追杀至几乎灭绝，但仍有少数人成功隐藏和幸存下来。他们得知了你们重新努力统一芭丝特的消息，特来请求你们协助解救他们的幸存者，摆脱敌人的掌控。\n作为所有赛勒涅子民的潜在统治者，你很难拒绝这样的求助请求。"
 pod1230objectives_werewolves.40.b: "藏匿如此之久？你一定掌握了一两招诀窍。"
 ceilican_nation_objective_decision_tooltip: "被遗忘的表亲回归家庭。"
 ceilican_nation_objective_decision_confirm: "这是一个配得上新任芭丝特统治者的胜利！"
 khan_nation_objective_decision: "万猫之国：可汗虎族"
 pod1230objectives_werewolves.41.desc: "强大的虎人一直被认为是猫国强有力的领导候选者，他们无与伦比的力量和高尚的品行赢得了其他部族的尊重。然而，他们却慷慨地同意在你实现自己的雄心时处于次要地位，承认你迄今为止的显著成功。然而，可汗虎族向你发出了一个挑战，以证明你确实是你所声称的赛勒涅的选中的人。他们甚至愿意让你接受他们传统的贵族试炼——一个众所周知的残酷而困难的考验。虽然这不足以赢得他们的效忠，但这无疑会提升你在整个芭丝特中的合法性。"
 pod1230objectives_werewolves.41.a: "告诉我你的请求。"
 pod1230objectives_werewolves.41.b: "关于这个试炼……"
 khan_nation_objective_decision_desc: "作为威严的猎手、战士和导师，可汗虎族是真正的芭丝特贵族，尽管暴虐的辛巴可能有不同的说法。他们不会接受一个没有身心都完美的统治者。"
 khan_nation_objective_decision_tooltip: "与老虎做朋友。"
 khan_nation_objective_decision_confirm: "我是万汗之汗。"
 simba_nation_objective_decision: "万猫之国：辛巴"
 pod1230objectives_werewolves.42.desc: "作为自封的猫国之王，傲慢自大的狮人们一直声称自己才是统治者，经常为了宣示自己的主张而与其他 芭丝特激烈冲突。你本以为向他们提出在你领导下团结猫族的提议会遭遇相当糟糕的反响。\n然而，实际情况比你预想的还要糟糕。\n你费尽心力才将辛巴代表们压制住，阻止他们直接扑向你以“惩罚你的冒犯”。他们在被拖出房间时仍在咆哮不已，你不得不考虑下一步的行动。显然，只有你在狮子们自己的领土非洲上证明自己的实力后才能被征服。"
 pod1230objectives_werewolves.42.a: "是时候驯服他们了。"
 pod1230objectives_werewolves.42.b: "我们需要一个滩头堡来开始我们的入侵。"
 simba_nation_objective_decision_desc: "辛巴认为自己是猫族的合法统治者……至少在他们自己看来是这样。他们不会放弃这一主张，直到有人在他们的领土上挑战他们并征服他们的心腹之地。"
 simba_nation_objective_decision_tooltip: "狩猎狮子。"
 simba_nation_objective_decision_confirm: "是时候把他们丢下悬崖了。"
 swara_nation_objective_decision: "万猫之国：斯瓦拉"
 pod1230objectives_werewolves.43.desc: "作为对你的尊重，孤僻的斯瓦拉邀请你到他们的一个巢域中，讨论你关于重新统一猫国的提议。虽然豹人不打算妨碍你或质疑你的主张，但他们提醒你，作为塞勒涅的孩子，保护纯净的土地是神圣的职责。如果你能证明你对这一传统职责的承诺，他们将全体加入你的阵营。否则，他们将继续像以往一样，远离猫族的权谋争斗，继续他们自己的生活。\n根据你在这个特别巢域中发现的一些结构性弱点，你认为可以通过捐赠来帮助他们改善防御，从而展示你对他们要求的认真态度。"
 pod1230objectives_werewolves.43.a: "我会考虑你的请求。"
 pod1230objectives_werewolves.43.b: "这是一个重要的任务。我会立即帮助你。"
 swara_nation_objective_decision_desc: "斯瓦拉是灵性满溢之地的守护者。他们希望在完全加入你重建猫国计划之前，看到你对他们事业的承诺。"
 swara_nation_objective_decision_tooltip: "守护者需要我们的保护。"
 swara_nation_objective_decision_confirm: "伟大的统治者成就伟大的功业。"
 pod1230objectives_werewolves.44.t: "万猫之国"
 pod1230objectives_werewolves.44.desc: "通过巧妙的外交手腕、意志力以及一些“直接”的说服手段，你终于将所有部族联合在了你的旗帜下。一个接一个地，他们都承认你的胜利，成为了统一的万猫之国的新统治者。整个猫族终于团结一心，这种景象自传说时代以来从未见过，早于与残暴狼族的失败战争。\n一些新“臣民”期待你会很快失败，而另一些则真诚地相信你和你承诺的未来。归根结底，这些都不重要。你赢得了这场胜利。\n现在，你将带领你的同胞走向光明的未来。猫的时代终于来临。"
 pod1230objectives_werewolves.44.a: "在月光的映照下，我等之母塞勒涅展露微笑。"
 blessed_seline_modifier: "被塞勒涅祝福"
 blessed_seline_modifier_desc: "猫族之母对她天选选民微笑。"
 bastet_nation_unifier_tooltip: "只要你持有猫国头衔，你将可以获得所有种类的猫人军队。"
 any_knight_ceilican_tooltip: "你必须拥有 5 位或更多骑士，并且他们的勇武至少为 45。"
 POD_simba_heartlands: "辛巴的心脏地带：豪萨兰、伊博-贝努埃、约鲁巴地区和博尔古地区"
 artifact_attacker_advantage_5_modifier: "[command_modifier_i|E]进攻方[advantage|E]：#P +5#!"
 artifact_monthly_prestige_10_modifier: "每月[prestige|E]：#P +40%#!"
 gaian_church_objective_decision: "万物之母"
 gaian_church_objective_decision_tooltip: "人类必须理解盖亚。"
 gaian_church_objective_decision_desc: "一些狼人试图以真正的虔诚或机会主义的心态渗透教会。他们试图将盖亚与圣母玛利亚混为一谈，并推动后者在罗马教义中的地位上升。"
 gaian_church_objective_decision_effect_tooltip: "你将改变教会的教义，将盖亚的理想与人类的制度结合。"
 gaian_church_objective_decision_confirm: "引导我们，母亲"
 gaian_church_objective_decision_custom1: "$POD_splat_hunter_plural$将不再视狼人作为不可调和的敌人。相反，狼人将被视为守护者、保护者、行奇迹者或肩负神圣使命的存在。\n这将使他们的信仰更加容易地合作。"
 pod1230objectives_werewolves.125.desc: "尽管大多数狼人被基督教的崛起所吸引，但少数人看到了一个机会，更少的人在凡人对玛利亚的崇敬中看到了盖亚的影子。起初这些派系属于边缘，但他们善于利用教会权力的快速增长，并巧妙地影响神学辩论，在可能的情况下支持对玛利亚的崇拜。\n经历了漫长的时间和许多失败的尝试，结果终于开始显现。通过这种看似微妙的影响，“盖亚教会”成功地创造了一个连锁反应，最终促使天主教会悄悄地将注意力从狼人身上转移到其他事务上。"
 pod1230objectives_werewolves.125.a: "一切归于母亲"
 gaiachurch_objective_decision_custom_roma: "[GetTitleByKey('c_roma').GetNameNoTier]的持有者必须是 [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] 或属于你的信仰。"
 bubasti_objective_decision_extra1: "你必须拥有至少 20 个[perks|E]在[sorcery_lifestyle|E]"
 pod1230objectives_werewolves.25.b: "那可能有点太过了……"