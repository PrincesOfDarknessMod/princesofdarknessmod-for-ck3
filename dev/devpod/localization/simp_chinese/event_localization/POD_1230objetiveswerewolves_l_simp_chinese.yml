 coruroc_quest_decision:0 "科鲁克的个人委托"
 coruroc_quest_decision_desc:0 "科鲁克请求你以白嚎的名义清除黑螺旋舞者污染。他们肮脏的巢穴必须全部清除！"
 coruroc_quest_decision_tooltip:1 "为白嚎复仇。"
 coruroc_quest_decision_confirm:0 "终于干净了？"
