 POD_artifacts_book_of_nod.100.t: "挪得之书"
 POD_artifacts_book_of_nod.100.desc: "一套古老的文书，被挪得学家该隐之子视为圣物。它由多页修订和残页组成，被不同的血族学者重新组合。传统上，该隐的故事的主要传播方式是口述，而带有该隐之子历史上最重要事件的文本则被严密保护，以保护该隐之子。必须提到的是，撇开个人信仰不谈，对于历代流传下来的文本和笔记，应该非常谨慎地对待。关于挪得之书的历史，有许多悬而未决的问题。它的作者不详，尽管末卡维、扫罗，甚至该隐都经常被引证为写了它的部分内容，即使不是全部内容。有些人认为整本书是神话或谎言，是吸血鬼为了解释他们的存在而编造的故事，或者是用来误导他人以某种方式思考和行动的工具。令这些疑虑更加严重的是，许多归于挪得之书的著作都非常模糊或自相矛盾，有时似乎是彻头彻尾的误导——这在挪得学家团体之间造成了一些大型（而且往往是暴力）的分歧。该书最古老的片段被确定为在苏美尔时代之前，大约是公元前4500年。"
 POD_artifacts_book_of_nod.100.option.a: "该隐传"
 POD_artifacts_book_of_nod.100.option.b: "暗影史"
 POD_artifacts_book_of_nod.100.option.c: "秘闻录"
 POD_artifacts_book_of_nod.100.option.d: "关闭挪得之书"
 POD_artifacts_book_of_nod.100.option.e: "合成该隐传"
 POD_artifacts_book_of_nod.100.option.f: "合成挪得之书"
 POD_artifacts_book_of_nod.200.t: "该隐传"
 POD_artifacts_book_of_nod.200.desc: "该隐讲述了他导致自己被诅咒的动机，给出了他对人类堕落后的事件的看法，以及他作为黑暗之父的历史。"
 POD_artifacts_book_of_nod.200.option.a: "原初时代"
 POD_artifacts_book_of_nod.200.option.b: "莉莉丝的来临"
 POD_artifacts_book_of_nod.200.option.c: "莉莉丝的魔法"
 POD_artifacts_book_of_nod.200.option.d: "该隐的诱惑"
 POD_artifacts_book_of_nod.200.option.e: "洗拉的故事"
 POD_artifacts_book_of_nod.200.option.f: "老妪的故事"
 POD_artifacts_book_of_nod.200.option.g: "第一城的故事"
 POD_artifacts_book_of_nod.200.option.h: "内容表"
 POD_artifacts_book_of_nod.300.t: "暗影史"
 POD_artifacts_book_of_nod.300.desc: "挪得之书的篇章。收集了一些碎片和片段，这些碎片甚至被争论为是否是挪得之书的一部分。有分析家称，这部分内容被迦太基的学者和作家稀释了，他们采取诗意的方式写下了“该隐戒律”。甚至有人说，暗影史只是秘盟为支持其暴政而创作的宣传文集。虽然有些人认为这是末卡维精心策划的恶作剧，但也有人认为这些文本直接来自黑暗之父本人，尤其是在真实的远古石板上提供的十三条戒律。"
 POD_artifacts_book_of_nod.300.desc.notale: "你不具有“暗影史”的副本"
 POD_artifacts_book_of_nod.300.option.a: "继续阅读"
 POD_artifacts_book_of_nod.400.t: "秘闻录"
 POD_artifacts_book_of_nod.400.desc: "挪得之书的篇章。它包含对一个名为火焚末日事件的预言和图景。在一些人看来，对这一事件的担忧已经代代相传，并引起了偏执和恐惧的涟漪，继续在该隐之子和凡俗人类中回荡。"
 POD_artifacts_book_of_nod.400.desc.notale: "你不具有“秘闻录”的副本"
 POD_artifacts_book_of_nod.400.option.a: "继续阅读"
 POD_artifacts_book_of_nod.500.t: "原初时代"
 POD_artifacts_book_of_nod.500.desc: "我梦想着原初时代和最久远的记忆\n我叙说着原初时代和最古老的先父\n我唱诵着原初时代和黑暗前的破晓\n\n漂泊之地上，乐园的光芒照耀着夜空，父母的泪滴洒湿了大地\n离去之路上，我们彼此开始学习生存，从土地中获取维生所需"
 POD_artifacts_book_of_nod.500.desc.notale: "你不具有“原初时代”的副本"
 POD_artifacts_book_of_nod.500.option.a: "继续阅读原初时代"
 POD_artifacts_book_of_nod.500.option.b: "翻回到该隐传"
 POD_artifacts_book_of_nod.510.t: "原初时代，续页"
 POD_artifacts_book_of_nod.510.desc: "我，初生者该隐，手舞锐器，播撒黑色种子，灌溉并照料它们生长\n次生者亚伯，照料动物，协助分娩生产，喂食并照看它们生长\n\n我珍爱他，我的兄弟\n他是最聪明的\n他是最灵巧的\n他是最强壮的\n他是我所有喜悦的极致"
 POD_artifacts_book_of_nod.510.option.b: "上一页"
 POD_artifacts_book_of_nod.520.t: "原初时代，续页"
 POD_artifacts_book_of_nod.520.desc: "一天，我们的父对我们说\n该隐，亚伯，你们当向天上的他献祭，供奉你们所有之物的极致\n\n我，初生者该隐，收集了最柔软的枝芽，最新鲜的果实，最甜美的谷物\n次生者亚伯，宰杀了最鲜嫩的家畜，最强壮的牲口，最美味的禽兽"
 POD_artifacts_book_of_nod.530.t: "原初时代，续页"
 POD_artifacts_book_of_nod.530.desc: "我们在父的祭坛上升火烘烤，看着烟雾将献祭带给上位者\n\n次生者亚伯的献祭，上位者赞赏其美味，他得到了祝福\n我，初生者该隐的献祭，上位者谴责其糟粕，我得到了诅咒"
 POD_artifacts_book_of_nod.540.t: "原初时代，续页"
 POD_artifacts_book_of_nod.540.desc: "我看着亚伯的献祭，血肉与鲜血熏烟弥漫\n我哭了，捂住自己的双眼\n我日夜祈祷\n\n我们的父所说的献祭之日再度来临了\n\n亚伯献祭了他最鲜嫩、最美味、也是最喜爱之物，投入燃烧的火焰\n我没有带来自己最新鲜，最甜美之物，因为我知道上位者不要那些"
 POD_artifacts_book_of_nod.550.t: "原初时代，续页"
 POD_artifacts_book_of_nod.550.desc: "我的兄弟，最爱的亚伯，对我说\n“该隐，你没有带来献祭，那些你喜悦之物的极致，在祭坛上为他而烘烤。”\n\n我哭了，为爱而流泪，用锐器将我所有喜悦的极致，我的兄弟，献祭了\n\n亚伯的鲜血覆盖了祭坛，在火焰中闻起来是如此香甜"
 POD_artifacts_book_of_nod.560.t: "原初时代，续页"
 POD_artifacts_book_of_nod.560.desc: "但是我的父说\n“诅咒你，该隐，你杀了自己的兄弟。你将如我般被放逐。”\n\n他将我流放进了黑暗，挪得之地\n\n我被投进了黑暗\n我看不到光亮，我感到恐惧\n和孤独"
 POD_artifacts_book_of_nod.600.t: "莉莉丝的来临"
 POD_artifacts_book_of_nod.600.desc: "我孤独地待在黑暗中\n我感到饥饿\n我孤独地待在黑暗中\n我感到寒冷\n我孤独地待在黑暗中\n我悲伤泣下\n\n随后响起了一个甜蜜的声音，一个甘美的嗓音\n许诺着救助\n许诺着终止\n\n一名幽暗而秀美的女子来到我身边，眼中所见是对整个黑暗的洞悉"
 POD_artifacts_book_of_nod.600.desc.notale: "你不具有“莉莉丝的来临”的副本"
 POD_artifacts_book_of_nod.600.option.a: "继续阅读莉莉丝的来临"
 POD_artifacts_book_of_nod.610.t: "莉莉丝的来临，续页"
 POD_artifacts_book_of_nod.610.desc: "“我知道你的故事。挪得的该隐。”\n她微笑着说\n“你很饥饿。来！我这有食物。\n你很寒冷。来！我这有衣裳。\n你很悲伤。来！我这有抚慰。”\n\n“谁会抚慰受诅如我者？\n谁会为我穿衣？\n谁会给我食物？”\n\n“我是汝父第一任妻子\n我与上位者抗争，我于黑暗中自由\n我是莉莉丝。"
 POD_artifacts_book_of_nod.620.t: "莉莉丝的来临，续页"
 POD_artifacts_book_of_nod.620.desc: "曾经，我也很寒冷，但没有人温暖我\n曾经，我也很饥饿，但没有人喂食我\n曾经，我也很悲伤，但没有人抚慰我。”\n\n她接纳了我，她喂食了我\n她为我穿上了衣服\n在她的臂弯里，我得到了抚慰\n我哭着，直至眼中渗血，而她吻掉了那些血珠"
 POD_artifacts_book_of_nod.700.t: "莉莉丝的魔法"
 POD_artifacts_book_of_nod.700.desc: "我在莉莉丝之屋中居住了一段时间\n问她\n“在这黑暗中，你是如何建造的房屋？\n你是如何编织的衣裳？\n你是如何培育的食物？”\n\n莉莉丝笑了\n“我和你不同，我已经觉醒。\n我能看到围绕着你的纤维，我制造所需之物的力量即源于此。”"
 POD_artifacts_book_of_nod.700.desc.notale: "你不具有“莉莉丝的魔法”的副本"
 POD_artifacts_book_of_nod.700.option.a: "继续阅读莉莉丝的魔法"
 POD_artifacts_book_of_nod.710.t: "莉莉丝的魔法，续页"
 POD_artifacts_book_of_nod.710.desc: "“那么，让我觉醒吧，莉莉丝。”我说\n“我需要这种力量。\n这样，我也可以编织自己的衣裳，\n培育自己的食物，\n建造自己的房屋。”\n\n担忧在莉莉丝的面庞上浮现\n“我不知道觉醒会给你带来什么，\n因为你受到了父亲真正的诅咒。\n你可能会死。\n你可能会永久地改变。”"
 POD_artifacts_book_of_nod.720.t: "莉莉丝的魔法，续页"
 POD_artifacts_book_of_nod.720.desc: "该隐开口了，“即便如此，没有力量的生命不值得生存。\n没有你的赠礼我会死掉。\n我不要作为你的奴隶苟活。”\n\n莉莉丝爱着我，我知道这点\n莉莉丝会为我做任何事情，即使违背自己的意愿"
 POD_artifacts_book_of_nod.730.t: "莉莉丝的魔法，续页"
 POD_artifacts_book_of_nod.730.desc: "因此，莉莉丝，明眸善睐的莉莉丝\n唤醒了我\n她用小刀割伤自己，为我准备了一碗鲜血\n我痛饮着，甜美的血\n\n我堕入了深渊\n我永远地堕落了，堕进最深邃的黑暗"
 POD_artifacts_book_of_nod.800.t: "该隐的诱惑"
 POD_artifacts_book_of_nod.800.desc: "耀眼的火光自夜晚的黑暗中而现\n天使长米迦勒在我面前显现\n我没有惧怕，我询问他的目的\n\n米迦勒，天国的统帅，挥舞圣火者，对我说\n“亚当之子，夏娃之子，汝之罪孽深重，但吾父的慈悲同样博大。\n难道你不会忏悔自己所做的罪恶，并让他的慈悲将你洗涤吗？”"
 POD_artifacts_book_of_nod.800.desc.notale: "你不具有“该隐的诱惑”的副本"
 POD_artifacts_book_of_nod.800.option.a: "继续阅读该隐的诱惑"
 POD_artifacts_book_of_nod.810.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.810.desc: "我对米迦勒说\n“我将骄傲地以自己意志生存，而不是依靠'上位者'的赦免苟活。”\n\n米迦勒诅咒了我，说\n“那么，在你行走于大地之时，你和你的子嗣都将惧怕我的烈焰，\n它将深噬汝等之血肉。”\n\n到了早上，拉斐尔摇曳着柔软光亮的羽翼而来，照亮了地平线\n日轮的驾驭者，东方的守护者"
 POD_artifacts_book_of_nod.820.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.820.desc: "拉斐尔开口了，“该隐，亚当之子，夏娃之子，你的兄弟亚伯宽恕了你的原罪\n难道你还不忏悔，并接受全能之主的仁慈吗？”\n\n我对拉斐尔说\n“我将以自己的宽恕原谅自己，而不是凭借亚伯的宽恕。”"
 POD_artifacts_book_of_nod.830.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.830.desc: "拉斐尔诅咒了我，说\n“那么，在你行走于大地之时，你和你的子嗣都将惧怕拂晓，\n无论藏身何处，日光都会试图将你如柴火般点燃。\n现在就藏起来吧，避开这日耀的愤怒。”\n\n我在大地中找到了一个秘密之所，避开了日光的灼烧\n我在大地深处沉睡，直至光明的世界隐藏于黑夜的山脉之后"
 POD_artifacts_book_of_nod.840.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.840.desc: "当我从白日的睡眠中苏醒时，我听到了羽翼温柔扇动的声音\n看到了乌列尔的黑色羽翼将我覆盖－\n乌列尔，收割者，死亡天使，居于黑暗的黑之乌列尔\n\n乌列尔平静地对我说着\n“亚当之子。夏娃之子。全能的主已经宽恕了你的原罪。\n你会接受他的怜悯，让我给你应得的奖赏，使你不再受咒诅吗？”\n\n我对黑翼的乌列尔说\n“我将以自己的怜悯而生存，而不是靠着神的怜悯。\n我是我自己，我做我自己，永远不会变。”"
 POD_artifacts_book_of_nod.850.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.850.desc: "随后，借着恐怖的乌列尔之口，神主诅咒了我，说\n“那么，在你行走于大地之时，你和你的子嗣都将与黑暗纠缠\n你将只能喝下鲜血\n你将只能吃下尘土\n你将永远如已死一般，\n既从未死过，也从未活过。\n你将永远行走于暗夜，你所触摸之物将崩溃于虚无，直至终末之日。”"
 POD_artifacts_book_of_nod.860.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.860.desc: "我因这可怖的诅咒发出痛苦的哭号，撕扯着自身的血肉\n我双目泣血\n我用杯子接住泪水，并喝下了它们\n当我停止啜饮悲伤，抬起头时\n天使长加百列\n温柔的加百列\n加百列，仁慈之主在我面前显现了"
 POD_artifacts_book_of_nod.870.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.870.desc: "天使长加百列对我说\n“亚当之子，夏娃之子，看哪，天父的慈悲远超你所知\n甚至就连此时，慈悲之路也仍开启，汝可呼其为[golconda|E]之路。\n将它告知你的子嗣，经由此路，他们将能再次居于光明。”"
 POD_artifacts_book_of_nod.875.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.875.desc: "就在此时，黑暗如幕纱般升起，只有莉莉丝的明目闪闪发光\n\n环顾四周，我知道自己已经觉醒了\n\n当汹涌澎湃的力量初次在我体内激荡时\n我发现了如闪电般移动的方法\n发现了借助大地力量的方法\n发现了如磐石般坚硬的方法\n这些就如我曾经的呼吸般自然"
 POD_artifacts_book_of_nod.880.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.880.desc: "莉莉丝向我展示了她如何避开猎手追捕\n如何命令敌人服从\n如何要求对手尊敬\n\n随着更进一步的觉醒\n我发现了改变形体之道\n统治动物之道\n延展视界之道"
 POD_artifacts_book_of_nod.885.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.885.desc: "莉莉丝命我停下，说我已经超越了自己的界限\n我已经走得太远\n我威胁着自己的真正本质\n\n她使用自己的力量命令我停下\n我因她的力量而需要她，但内心深处已种下了叛变的种子\n当她将视线从我身上转开时，我再次向黑夜开放了自身\n在群星之中看到了无限的可能，知晓了力量之道，鲜血之道\n已经为我所用\n我在这分茬出众多路途的最终之道上，觉醒了"
 POD_artifacts_book_of_nod.890.t: "该隐的诱惑，续页"
 POD_artifacts_book_of_nod.890.desc: "借助这全新的力量，我破坏了夜之女士加诸于身的镣铐\n在那个夜晚我离开了诅咒女皇，将自己隐身于暗影\n我逃离了挪得之地，最终来到了一个甚至连她的恶魔也找不到的地方"
 POD_artifacts_book_of_nod.900.t: "洗拉的故事"
 POD_artifacts_book_of_nod.900.desc: "现在让我讲述洗拉的故事\n该隐的第一个爱人，该隐的第一任妻子，拥有最甜美的血液，最柔滑的皮肤，最清澈的眼神\n\n她是该隐最初子嗣中的孤独者，该隐渴求着她\n但她并未留意他的欲望，而是避开了他\n\n赠礼，祭祀，香料，鸽子，舞者，歌手，公牛，雕塑，丽服\n没有一样能打动洗拉的芳心，没有什么能使她坚硬如石的心软化成甜蜜果实"
 POD_artifacts_book_of_nod.900.desc.notale: "你不具有“洗拉的故事”的副本"
 POD_artifacts_book_of_nod.900.option.a: "继续阅读洗拉的故事"
 POD_artifacts_book_of_nod.910.t: "洗拉的故事，续页"
 POD_artifacts_book_of_nod.910.desc: "该隐抓挠着胡子，撕扯着头发，在暗夜下的荒原中徘徊，为她而相思煎熬，为她而欲火焚心\n最后该隐遇到了一个对月歌唱的老妪\n\n该隐问老妪\n“为什么你要这样歌唱？”\n老妪回答说\n“因为我渴望着自己所未拥有之物。”"
 POD_artifacts_book_of_nod.920.t: "洗拉的故事，续页"
 POD_artifacts_book_of_nod.920.desc: "该隐对老妪说\n“我也有此渴望。你能做些什么吗？”\n老妪微笑着说\n“饮我的血，该隐，血族之父，明晚再回来。\n然后我会将月之智慧教授与你。”\n该隐吮吸老妪裸露的颈部，然后离开了。"
 POD_artifacts_book_of_nod.930.t: "洗拉的故事，续页"
 POD_artifacts_book_of_nod.930.desc: "第二个晚上，该隐发现老妪在岩石上沉睡\n“醒来，老妪。”\n该隐说\n“我回来了。”\n老妪睁开一只眼睛，说\n“今晚我在梦中为你寻求解决之道。再喝一次我的血，明晚再回来。\n再带来一个粘土碗。\n以及一把锋利的刀。\n那时我将知晓你寻找的答案。”"
 POD_artifacts_book_of_nod.940.t: "洗拉的故事，续页"
 POD_artifacts_book_of_nod.940.desc: "再一次的，该隐吸走了老妪的血，她立即就又沉沉睡去。\n\n第三个晚上该隐回来时，老妪微笑着看着他\n“恭喜，心兽之主，”老妪说\n“我有了你所寻求的智慧。\n用你带来的碗取一些我的血，将它与这些浆果和药草混合，\n并喝下这灵药。"
 POD_artifacts_book_of_nod.950.t: "洗拉的故事，续页"
 POD_artifacts_book_of_nod.950.desc: "“你将不可抵挡。\n你将强势霸道。\n你将睥睨众生。\n你将激动人心。\n你将热情洋溢。\n洗拉之心将如春雪般融化。”\n\n如此，该隐便喝下了老妪的灵药，因为他是如此深爱着洗拉\n是如此渴求着她的爱"
 POD_artifacts_book_of_nod.960.t: "洗拉的故事，续页"
 POD_artifacts_book_of_nod.960.desc: "老妪咯咯地笑着，说，“停手。”\n该隐便不能违抗她\n老妪咕咕地笑着，说，“爱我。”\n该隐便只能凝视着她老浊的双眼，渴求着她革质的皮肤\n老妪嘎嘎地笑着，说，“使我不朽。”\n\n该隐便初拥了她。她再度怪笑，因这初拥的纯然狂喜而狂笑\n因为它不再使她感到痛苦"
 POD_artifacts_book_of_nod.970.t: "洗拉的故事，续页"
 POD_artifacts_book_of_nod.970.desc: "“我使你变得强大。以诺的该隐，挪得的该隐，但你将永远被我束缚。\n我使你成为万物之主，但你将永远无法忘记我！\n你的血如今强而有力，喝下它的人将会被其束缚，就如你在这三个夜晚所做的一般。\n你将成为主宰。\n他们都将成为你的奴仆，正如你成为我的奴隶。\n虽然洗拉会如你所愿爱上你，但你将会永远爱恋我。现在去吧，迎娶你可爱的新娘吧，\n我将在最黑暗之处等着你，我将为你的生命制作更多的药剂。”"
 POD_artifacts_book_of_nod.980.t: "洗拉的故事，续页"
 POD_artifacts_book_of_nod.980.desc: "如此，该隐心情沉重地回到了以诺。\n连续三夜的每个夜晚\n洗拉都喝下了她尊长的鲜血，虽然她并不知情\n随后，第三夜，该隐宣布他将成婚\n新娘是洗拉，他最甜蜜的子嗣\n她同意了"
 POD_artifacts_book_of_nod.1000.t: "老妪的故事"
 POD_artifacts_book_of_nod.1000.desc: "该隐不情愿地服侍了老妪一年又一天，那个以血之智慧将他如囚犯般束缚的老妪\n\n她每晚都强迫他献出自己的血，用来制作秘密灵药和强力处方\n\n她取走他子嗣的子嗣，他们不再为人所知\n\n但该隐拥有智慧，他再没有啜饮过她\n她并没有说什么，认为他仍然是自己的血奴"
 POD_artifacts_book_of_nod.1000.desc.notale: "你不具有“老妪的故事”的副本"
 POD_artifacts_book_of_nod.1000.option.a: "继续阅读老妪的故事"
 POD_artifacts_book_of_nod.1010.t: "老妪的故事，续页"
 POD_artifacts_book_of_nod.1010.desc: "某天晚上\n该隐去到老妪所在丛林之处，告诉她自己睡眠中所见的恐怖噩梦\n\n“我惧怕自己的生命，老妪\n我惧怕乌列尔的预言，我的子嗣贪求我的鲜血。\n告诉我秘密的知识吧，这样我就有足够的力量去自己应付。”\n\n老妪便走到一棵歌斐树旁\n折下了一根树枝\n用锋利的刀削尖了这树枝"
 POD_artifacts_book_of_nod.1020.t: "老妪的故事，续页"
 POD_artifacts_book_of_nod.1020.desc: "“拿着这锋利结实的活木枝桠，将它刺进你任性子嗣的心脏。\n它便会依汝之命将其定住。\n觊觎你的心血者，必将承负你的审判。”\n\n“谢谢你，母亲，”该隐说着快速移动脚步\n抓起了歌斐木的木桩，将其深深推进了老妪的心脏"
 POD_artifacts_book_of_nod.1030.t: "老妪的故事，续页"
 POD_artifacts_book_of_nod.1030.desc: "该隐，睿智的该隐，在过去的一年又一天中从没有喂养过她，并以全副意志贯注于手上\n因此他打破了加诸于己的束缚，夺回了自己的命运\n\n她再次怪笑，鲜血从她嘴中倾泻而出\n她的眼中溢满憎恨\n该隐亲吻了她，亲吻了她那冰冷、血红的嘴唇，然后将她留给了拉斐尔的微笑：\n初升的日光"
 POD_artifacts_book_of_nod.1040.t: "老妪的故事，续页"
 POD_artifacts_book_of_nod.1040.desc: ""
 POD_artifacts_book_of_nod.1050.t: "老妪的故事，续页"
 POD_artifacts_book_of_nod.1050.desc: ""
 POD_artifacts_book_of_nod.1100.t: "第一城的故事"
 POD_artifacts_book_of_nod.1100.desc: "起初只有该隐\n该隐因爱而献祭了他的兄弟\n该隐被放逐了\n该隐被诅咒以永恒的不朽\n该隐被诅咒以鲜血的欲望\n该隐是我们的起源\n吾父之父\n\n在那流逝的岁月里他曾居住在挪得之地\n处于寂寞与痛苦之中\n相当久远的一段时间里都形单影只\n但往昔的回忆淹没了他的悲伤"
 POD_artifacts_book_of_nod.1100.desc.notale: "你不具有“第一城的故事”的副本"
 POD_artifacts_book_of_nod.1100.option.a: "继续阅读第一城的故事"
 POD_artifacts_book_of_nod.1110.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1110.desc: "他回到了凡人的世界，\n回到了他的兄弟舍特，夏娃第三子，\n和舍特的子民所创建的世界。\n\n他归来了，受到了欢迎，\n因他那身上的标记，没有人敢于反抗他，\n人们看到了他的力量，崇拜着他，\n他成长得强壮有力，他的力量强横无比，他的敬畏与服从之道精湛巧妙，\n舍特的子民争取到了他，\n请他统治他们的伟大城市，第一城。"
 POD_artifacts_book_of_nod.1115.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1115.desc: "但是该隐的力量中滋长着孤独\n深入骨髓的孤独之种生根发芽，长成一朵黑暗之花\n经由召唤恶魔，倾听耳边低语的智慧\n他在自己的血液中看到了无边的力量\n他学到了制造自己子民的方法\n他知晓了它的力量，决定去初拥那些最接近他的人，并实施了"
 POD_artifacts_book_of_nod.1120.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1120.desc: "看哪，乌列尔，恐怖的乌列尔，在那真夜里显现，并对他说话\n\n“该隐，虽然你很强大，但你仍留有神的印记\n记住：你所制造的每个子嗣都将承受你的诅咒，你的每个子孙都将永远行走于挪得之地\n将恐惧烈焰和日光，吞咽鲜血与尘土。\n他们背负着其父的嫉妒之种，他们将永远互相陷害和争斗。\n不要将厄运带给那些寻求义之道路的亚当子孙，该隐！\n停止你那恐怖的初拥！”"
 POD_artifacts_book_of_nod.1125.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1125.desc: "然而，该隐知道他必须做些什么，一个年轻的男人，以诺\n舍特的血脉中最受恩宠的一个，祈求成为黑暗之父的子嗣\n虽然留意着乌列尔的命令，该隐还是占有了以诺\n将他陷入黑暗拥吮的缠绕\n\n如此，该隐造就了以诺，并将第一城命名为以诺城"
 POD_artifacts_book_of_nod.1130.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1130.desc: "以诺祈求一个兄弟，一个姐妹，而该隐，纵容的父亲\n将这些给予了他，他们的名字是洗拉，血液最受该隐喜爱者\n和以拿，以自己的强壮服侍该隐者\n\n这些该隐的血族学到了制造自己后裔的方法\n不加思考地拥吮了众多的舍特子民\n\n然后睿智的该隐发话了。“这种罪恶必须终结。\n不会再有更多的罪恶了。”\n该隐的命令就是法律，他的子嗣都服从于他。"
 POD_artifacts_book_of_nod.1135.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1135.desc: "城市矗立了许多个年头\n成了一个强盛帝国的中心\n该隐与那些非其族类者更加亲近\n舍特的子民知晓了他\n而他也知晓了他们\n\n但是世界因原罪而滋生着黑暗\n该隐的子嗣徜徉于大地，纵容着他们的黑暗之道\n\n该隐对自己子嗣的战斗感到愤怒\n看着他们互相攻击诋毁，他发现了欺诈\n看着他们虐待舍特子民，他知晓了悲伤\n\n该隐在幽暗的天空里看到了征兆，但他什么都没说"
 POD_artifacts_book_of_nod.1140.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1140.desc: "然后大洪水来临了，滔天的波浪清洗了整个世界\n舍特的子民连同他们的城市一起被摧毁了\n\n再一次的，该隐陷入了巨大的悲伤，走进了自闭的孤独\n他离开了我们，他的后裔，任我们自生自灭\n\n在长久的搜寻后，我们在大地深处找到了他，他命令我们离开\n他说大洪水是个惩罚，是对他回到生者世界的惩罚\n是对颠覆自然规律的惩罚\n他要求我们离开，让他再次沉眠"
 POD_artifacts_book_of_nod.1145.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1145.desc: "因此我们独自回去了，找到了诺亚的子民\n宣布我们是新的统治者\n每一个都创造了新的后裔\n以荣耀该隐的声名\n即使我们缺乏他的智慧或自制\n大战爆发了，长者对抗着他们的子辈，正如乌列尔所说的\n子嗣屠杀着他们的血父\n\n他们叛变了\n使用火焰和木桩\n利剑和尖爪\n摧毁了他们的创造者\n\n反叛者建造了新的城市\n从殒落的帝国中，他们找到了在战乱中分散的十三个氏族\n将他们重新聚集在了一起"
 POD_artifacts_book_of_nod.1150.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1150.desc: "他们创造了王权之氏族\n兽性之氏族\n月相之氏族\n隐匿之氏族\n流浪之氏族\n玫瑰之氏族\n暗夜之氏族\n塑形之氏族\n巨蛇之氏族\n死亡之氏族\n医者之氏族\n猎手之氏族\n学者之氏族"
 POD_artifacts_book_of_nod.1155.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1155.desc: "他们兴建了一座美丽的城市，人类将他们如神般崇拜\n他们创造了自己的后裔，该隐的第四代\n但他们恐惧着千年圣战，乌列尔的预言\n那些子嗣\n被禁止创造更多的子嗣\n他们的长者维持着自身的权力\n如有违反，尊长将与子嗣一同被追捕杀戮"
 POD_artifacts_book_of_nod.1160.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1160.desc: "虽然该隐离开了我们，我们仍能感到他谨慎的眼神\n我们知道他在评判我们的行为和道路\n\n他诅咒了末卡维，那诽谤诋毁他的名誉者，诅咒他永远疯狂\n在发现雅斯米利亚德以污秽的手段纵情于品尝他自己的子嗣时\n该隐降下了审判，声称诺斯费拉图将永远为自身的邪恶所笼罩\n并扭曲了他的面容"
 POD_artifacts_book_of_nod.1165.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1165.desc: "他诅咒了我们全部，因为我们杀掉了他最喜爱的子嗣，第二代\n我们一个接一个的捕杀了他们，“美艳者”洗拉，“强壮者”以拿，还有以诺，原初主君\n\n我们为他们悲伤，因为我们都是他们的子嗣，都是该隐后裔的一员\n\n虽然这座城市如该隐的城市一般伟大，但最终\n它走向了衰老\n如同所有活物一般，它缓慢地走向死亡"
 POD_artifacts_book_of_nod.1170.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1170.desc: "起初，神们看不到这个事实\n而当他们最终不得不开始关注时，已经太晚了\n\n正如乌列尔所说的，邪恶的种子开出了血红的花朵\n特洛伊尔，该隐子嗣的子嗣的子嗣，叛变了，屠杀了他的父长\n吃掉了他的血肉\n随后战争毁灭了城市\n没有什么能够维持原状"
 POD_artifacts_book_of_nod.1175.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1175.desc: "十三长者看着他们的城市毁灭，他们的力量消亡\n他们被迫逃亡，他们的后裔追随着他们\n但仍有很多在战斗中被杀，他们开始衰退\n由于他们权力的丧失，创造子嗣不再受束缚\n很快就出现了更多的子嗣\n他们的统治横跨大地\n但这并没有维持多久\n\n随着时间推移，子嗣迅速泛滥\n战争再次爆发了"
 POD_artifacts_book_of_nod.1180.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1180.desc: "由于学到了教训\n长者们都已深藏了起来\n但他们的子嗣创立了自己的城市和血脉\n并被战争的狂涛所冲溃\n战争是如此全面，再没有一个世代\n可以夸耀自己的长久\n凡俗血肉的汹涌波涛横跨了大陆\n碾碎并烧毁血族的城市\n凡人认为他们是在为自己而战\n但他们的鲜血是为我们而流"
 POD_artifacts_book_of_nod.1185.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1185.desc: "战争一结束\n所有的血族就都避开了其他血族\n避开了围绕在身周的人类\n我们至今仍在隐藏\n为了依然持续的千年圣战\n\n没人知道该隐何时会从他那大地之内的沉眠中苏醒\n并将炼狱之城\n终末之城，审判之城带临这世上\n千年圣战仍在持续"
 POD_artifacts_book_of_nod.1185.option.f: "复兴第一城的文化"
 POD_artifacts_book_of_nod.1190.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1190.desc: ""
 POD_artifacts_book_of_nod.1195.t: "第一城的故事，续页"
 POD_artifacts_book_of_nod.1195.desc: ""
 POD_artifacts_book_of_nod.reading.gain: "阅读挪得之书能给予伟大的见解。"
 POD_artifacts_book_of_nod.reading.loss: "阅读挪得之书将揭露可怕的真相。"
 POD_artifacts_book_of_nod.reading.learn.enochian: "阅读挪得之书将让你学会以诺语。"