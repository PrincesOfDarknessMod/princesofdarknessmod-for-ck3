l_simp_chinese:
 POD_perfect_world.001.t: "完美世界"
 POD_perfect_world.001.desc: "你是一个具有极强力量的存在，你对威仪术的掌握是深不可测的。你看着你的领地，看到所有那些血畜自顾自，不关心大局。但你有能力改变这一点，使他们以你认为合适的方式生活，有能力使你的领地成为一个完美的世界……对你而言的。\n但你的完美世界是怎样的？"
 POD_perfect_world.001.a: "我将激励他们成为伟人，统治精英将更好。"
 POD_perfect_world.001.a.tt.beast: "#beast 哈，我们何必要统治贱民？#!"
 POD_perfect_world.001.b: "这个世界是残酷的，他们应该建立自己的势力来帮助我的计划。"
 POD_perfect_world.001.b.tt.beast: "#beast 战争即将来临#!"
 POD_perfect_world.001.c: "现在还不是时候"
 POD_perfect_world.001.c.tt: "你将放弃让凡人按你的意愿行事的企图"
 POD_perfect_world.001.c.tt.beast: "#beast 不！我们应该控制他们！#!"
 POD_perfect_world.002.t: "完美世界"
 POD_perfect_world.002.desc: "你花费了大量的力量，有些血畜则注意到了一些奇怪的事情，但回报是惊人的！你已经看到了凡人按照你的意愿行动，且你已经准备好了收获。"
 POD_perfect_world.002.option.a: "啊，如此完美"
 POD_perfect_world.002.option.a.tt: "你成功地影响了城市中的凡人"
 POD_mask_of_empathy.001.t: "移情面具"
 POD_mask_of_empathy.001.desc: "万物皆动，利用你巨大的威仪术力量，你现在能够有所行动。你扩大了你的意志和非自然的魅力，你已经可以感觉到你的目标正在接近，非常接近。你会继续吗？"
 POD_mask_of_empathy.001.option.a: "是时候破坏牵绊了"
 POD_mask_of_empathy.001.option.a.tt: "你将尝试使用移情面具能力"
 POD_mask_of_empathy.001.option.a.desc: "意志之战"
 POD_mask_of_empathy.001.option.a.tt.attacker_wins: "[target.GetFirstName]与[target_relation.GetFirstName]不在具有牵绊"
 POD_mask_of_empathy.001.option.a.tt.defender_wins: "你失败了，你的意志动摇了"
 POD_mask_of_empathy.001.option.b: "还不是时候"
 POD_mask_of_empathy.001.option.b.tt: "你将放弃切断[target.GetFirstName]和[target_relation.GetFirstName]的牵绊的尝试。"
 POD_mask_of_empathy.002.t: "移情面具"
 POD_mask_of_empathy.002.desc: "你成功了，你已经可以感觉到[target.GetFirstName]和[target_relation.GetFirstName]对对方的感觉不一样了。"
 POD_mask_of_empathy.002.option.a: "啊，他们当然无法抵挡我的魅力"
 POD_mask_of_empathy.002.option.a.tt: "你成功了"
 POD_mask_of_empathy.002.option.a.tt.beast: "#beast 我们掌控了他们！#!"
 POD_mask_of_empathy.003.t: "移情面具"
 POD_mask_of_empathy.003.desc: "你已经失败了，[target.GetFirstName]和[target_relation.GetFirstName]仍然彼此相连。你勉强没有被抓到，这还不错。"
 POD_mask_of_empathy.003.option.a: "多么耻辱"
 POD_mask_of_empathy.003.option.a.tt: "你失败了"
 POD_mask_of_empathy.003.option.a.tt.beast: "#beast 真是扫兴#!"