l_simp_chinese:
 POD_drain_the_life.001.t:0 "众生衰竭"
 POD_drain_the_life.001.desc:0 "以你目前的幽暗术等级，你可以将[target.GetFirstNamePossessive]的首都笼罩在黑暗中。但这样力量是有代价的。"
 POD_drain_the_life.001.desc.ahrimans_demesne:0 "你是黑暗之主。凭借你对深渊的巨大掌握，你可以将整个[target.GetFirstName]控制的国度笼罩在黑暗中，吞噬它所接触的一切。这样的力量是有代价的，[target.GetFirstName]不会高兴。"
 POD_drain_the_life.001.option.a:0 "凭借我对深渊的巨大控制力，我将把[target.GetHerHis]的国度笼罩在黑暗之中！"
 POD_drain_the_life.001.option.a.tt:0 "你将尝试对[target.GetFirstName]的国度施放众生衰竭，这种力量将影响[target.GetSheHe]控制的每一个伯爵领，甚至是[target.GetHerHis]的封臣控制的地区。"
 POD_drain_the_life.001.option.a.desc:0 "黑暗挑战"
 POD_drain_the_life.001.option.a.success:0 "你成功使用了众生衰竭能力"
 POD_drain_the_life.001.option.a.tt.attacker_wins:0 "[target.GetFirstNamePossessive]的国度淹没在黑暗中，该将吞噬了它所接触的一切。"
 POD_drain_the_life.001.option.a.failure:0 "你没能用出众生衰竭能力"
 POD_drain_the_life.001.option.a.tt.attacker_lost:0 "你失败了"
 POD_drain_the_life.001.option.b:0 "很快，[target.GetFirstNamePossessive]的首都将被笼罩在黑暗中。"
 POD_drain_the_life.001.option.b.tt:0 "在[target.GetFirstNamePossessive]的首都伯爵领施展了众生衰竭"
 POD_drain_the_life.001.option.c:0 "还不是时候"
 POD_drain_the_life.001.option.c.tt:0 "你将停止在[target.GetFirstNamePossessive]的领地上施放众生衰竭的尝试。"
 POD_whole_realm_was_drained_toast:0 "可怖的黑暗被[attacker.GetFirstName]释放到你的国度。"
 POD_drained_enemy_realm_toast:0 "你成功得在[target.GetFirstNamePossessive]的国度释放出可怖的黑暗"
 POD_drain_the_life_failed_toast:0 "你没能在[target.GetFirstNamePossessive]的国度中释放出可怖的黑暗。"
 POD_capital_county_drained_toast:0 "可怖的黑暗被[attacker.GetFirstName]释放在你的首都。"
 POD_shadow_twin.001.t:0 "暗影分身"
 POD_shadow_twin.001.desc:0 "凭着你对幽暗术的掌握，你可以尝试将自己的影子活动起来，使其成为自己的双重身。这样的生物在千年圣战的永恒斗争中会有很大的帮助，但这样的力量是有代价的。"
 POD_shadow_twin.001.option.a:0 "我指使着暗影，是时候让其服从了"
 POD_shadow_twin.001.option.a.tt:0 "你将尝试制造一位暗影分身"
 POD_shadow_twin.001.option.a.desc:0 "与你内心的黑暗作斗争"
 POD_shadow_twin.001.option.a.tt.success:0 "一位暗影分身已被成功造出"
 POD_shadow_twin.001.option.a.tt.failure:0 "你没能制造出一位暗影分身"
 POD_shadow_twin.001.option.b:0 "还不到时候"
 POD_shadow_twin.001.option.b.tt:0 "你将放弃制造暗影分身的想法"
 POD_shadow_twin.002.t:0 "暗影分身（二）"
 POD_shadow_twin.002.desc:0 "凭着你对幽暗术的掌握，你成功地制造出了一位暗影分身，现在是时候发出指令了。"
 POD_shadow_twin.002.option.a:0 "所有暗影都该听从于我"
 POD_shadow_twin.002.option.a.tt:0 "一位暗影分身已被成功造出。"
 POD_shadow_twin.003.t:0 "暗影分身（二）"
 POD_shadow_twin.003.desc:0 "即使以是你目前对幽暗术的掌握，也不足以制造出一位暗影分身……目前而言。"
 POD_shadow_twin.003.option.a:0 "我还没有准备好指令暗影"
 POD_shadow_twin.003.option.a.tt:0 "你没能制造出一位暗影分身"
 POD_shadow_twin.death_management.t:0 "失去你自我的一部分"
 POD_shadow_twin.death_management.desc:0 "噩耗传来，你的暗影分身，你自己灵魂的一部分，已经死亡。你能感觉到内心的可怕空虚。"
 POD_shadow_twin.death_management.option.a:0 "又一个化为尘土的……"
 POD_shadow_twin.death_management.option.a.tt:0 "你的暗影分身死了"