l_simp_chinese:
 POD_daimonion_events.1000.title: "感知罪恶——障碍"
 POD_daimonion_events.1000.desc: "即使有了恶魔的力量，无知的人为了控制自己的欲望而设置的障碍也很难击倒。能否解放这欲望就全靠你能不能溜进[recipient.GetFirstNamePossessive]的头脑中。首先，你必须得突破这障碍。"
 POD_daimonion_events.1000.option.a: "血之力就足够了。"
 POD_daimonion_events.1000.a.tt_true_faith: "其用信仰抵抗了我！"
 POD_daimonion_events.1000.a.success.desc: "胜利！"
 POD_daimonion_events.1000.a.failure.desc: "败北"
 POD_daimonion_events.1000.a.tt_success: "其的罪恶将增长并反噬其。"
 POD_daimonion_events.1000.a.tt_failure: "[recipient.GetSheHe]不在触及范围"
 POD_daimonion_events.1000.option.b: "我的意志将粉碎其的防御！"
 POD_daimonion_events.1000.option.c: "今夜不是合适的时候……"
 POD_daimonion_events.1000.option.c.tt: "放弃"
 POD_daimonion_events.1000.option.b.tt.beast: "#beast 我想我是这里的坏家伙……#!"
 POD_daimonion_events.2000.title: "感知罪恶——胜利"
 POD_daimonion_events.2000.desc: "我已经突破了心灵防线，恶魔的力量扭曲和腐化了[recipient.GetName]。"
 POD_daimonion_events.2000.option_a: "又一灵魂落入我名录"
 POD_daimonion_events.3000.title: "感知罪恶——玷污"
 POD_daimonion_events.3000.desc: "你的一生都在压制你的情感和需求。你听从别人告诉你什么是对的，什么是错的。你压制自己并迫使自己变得更好。\n[AddTextIf( PlayerHasBeast, ' #beast 为何？#!' )]\n 不再了。你知道你想要什么，和你需要做什么。"
 POD_daimonion_events.3000.desc.auspex: "是的，有些事情是不对劲。这些情绪，它并不来自你。你隐约看到了一位……男人？女人？恶魔？很难说。但你的超自然感官向你展示出了一个名字——[actor.GetFirstNameNoTooltip]。"
 POD_daimonion_events.3000.option_a: "这很爽"
 POD_daimonion_events.4000.title: "感知罪恶——失败"
 POD_daimonion_events.4000.desc: "这不是你的目标向其的罪恶屈服的那一晚，但这只是时间问题——所有的天使都将堕落，当其到了地狱时，你会在等着其。"
 POD_daimonion_events.4000.option_a: "很快的……"
 POD_daimonion_events.5000.title: "灵魂之战——结果"
 POD_daimonion_events.5000.option.loss: "你好，黑暗，我的老朋友……"
 POD_daimonion_events.5000.option.loss.ct: "你将获得几项新罪恶，以及它们的增强版本"
 POD_daimonion_events.5000.option.victory: "只有最强的英雄才能够主宰自己"
 POD_daimonion_events.5000.desc.victory: "你在与自己最糟糕的部分作斗争——罪恶、缺陷和黑暗。而你赢了。黑暗仍然在你体内，但现在它对你作出回应。\n\n你的罪的力量是由你来挥霍的。"
 POD_daimonion_events.5000.desc.loss: "这一切都太突然了——该显象凭空出现，用你身上每一参差不齐的、有缺陷的部分的力量进行攻击。这毫无希望……你怎么可能与一个使你的一切都显得如此弱小的存在战斗？\n\n你不能。最好还是放弃。"
 POD_daimonion_events.5000.loss.toast: "[recipient.GetFirstName]输了"
 POD_daimonion_events.5000.loss.toast.torpor: "其很快陷入了[Glossary('蛰眠','game_concept_torpor_desc')]逃避"
 POD_daimonion_events.5000.loss.toast.sins: "其屈服于堕落"
 POD_daimonion_events.5000.victory.toasttitle: "[recipient.GetFirstName]赢了"
 POD_daimonion_events.5000.victory.toast: "[recipient.GetFirstName]获得了对自身罪恶的掌控"
 POD_daimonion_events.5001.title: "灵魂之战——开场"
 POD_daimonion_events.5001.desc: "一场与心灵最黑暗的部分的战斗——这就是你给[recipient.GetName]规定的命运。唉，其不知道这种对峙的价值，并试图抵抗。让堤溃蚁孔吧。"
 POD_daimonion_events.5001.a.tt_success: "争斗将开始"
 POD_daimonion_events.5001.a.tt_failure: "[recipient.GetSheHe]将在无知的情况下保有安全"
 POD_daimonion_events.5001.power_fail: "灵魂之战失败"
 invite_infernalist_decision: "引诱崇魔者"
 invite_infernalist_decision_desc: "通过引导你自身扭曲的力量，找到一位被恶魔缠身的凡人，并把其吸引到你身边。"
 invite_infernalist_decision_tooltip: "让有才能的崇魔者为你服务"
 invite_infernalist_decision_effect_tooltip: "一位崇魔者加入了你的宫廷"
 invite_infernalist_decision_tp: "黑暗能提供……"
 invite_infernalist_decision_confirm: "如同蜘蛛入网……"
 tempt_ct: "启动一个计谋，引诱目标人物堕为崇魔者。"
 demonic_plague_contraction: "感染了魔疫"
 demonic_plague_contraction_ct: "你已经染上了可怕的魔疫，注定将缓慢、痛苦地死去。"
 demonic_plague_wound: "魔疫程度"
 demonic_plague_overcome: "正抵御魔疫"
 demonic_plague_overcome_ct: "至少在一段时间内，你的生命力和力量正在阻止瘟疫的增长。继续努力，你可能会战胜它。"
 demonic_plague_overcome_complete: "克服魔疫"
 demonic_plague_overcome_complete_ct: "你已经战胜了可怕的魔疫，并将它从你的人体系统中清除了！"