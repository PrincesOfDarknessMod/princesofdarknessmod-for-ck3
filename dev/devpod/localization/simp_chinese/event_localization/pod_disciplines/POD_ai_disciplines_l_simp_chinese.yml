l_simp_chinese:
 auspex_reveal_scheme: "计谋暴露！"
 auspex_reveal_scheme_tt: "你的目标使用了高阶观占术暴露了你的计谋！"
 POD_ai_disciplines.500.t: "癫兽潮"
 POD_ai_disciplines.500.desc: "在没有任何迹象的情况下，你们首都周围的当地动物突然变得非常具有攻击性。你的派员报告了许多针对当地人受到的袭击，而且损失数字开始堆积。凡人被吓坏了，该地区的商业和习惯性生活已经完全停止。\n在研究了其中一只动物的尸体后，你终于明白这是你的一个邻居利用他们在兽性术方面的巨大力量进行的一次联合攻击。你可以努力阻止这种攻击，或者只是尝试承受风暴。"
 POD_ai_disciplines.500.a: "召集部队！"
 POD_ai_disciplines.500.success: "你把动物们压回去了！"
 POD_ai_disciplines.500.failure: "它们太强了……"
 POD_ai_disciplines.500.b: "组织凡人进行抵抗！"
 POD_ai_disciplines.500.c: "他们终将会耗尽血液……"
 POD_ai_disciplines.900.t: "蛇的诱惑"
 POD_ai_disciplines.900.desc: "你最近对你的领主有一种奇怪的好感。他们似乎比平时更强大、更聪明、更……有吸引力。很可疑，你一直在寻找迹象，现在确定了：你受到了源自古蛇术的魅惑。\n然而，知道这一点并不能使你更容易遏制这种非自然的吸引力，你仍然要下决心反抗它。"
 POD_ai_disciplines.900.a: "为什么要斗争？"
 POD_ai_disciplines.900.b: "我的心灵属于我！"
 POD_ai_disciplines.2000.t: "警惕的牧人"
 POD_ai_disciplines.2000.desc: "无论他们的种姓或出身如何，萨洛比都认为自己是人类的守护者。他们的标志性$pod_discipline$——魂健术，反映了这一事实。你的领主对这种力量有一些了解，并提出帮助你监控你所在地区的凡人，促进他们的成长。\n然而，在吸血鬼的世界里没有什么是免费的，这样的提议肯定会让你在某个时候付出回报。"
 POD_ai_disciplines.2000.a: "令人感激的帮助。"
 POD_ai_disciplines.2000.b: "我会处理我自己的凡人。"
 POD_ai_disciplines.2400.t: "死亡寂静"
 POD_ai_disciplines.2400.desc: "你最近发现你的国度很难管理。你的命令似乎被忽视了，你的信使在没有警告的情况下被驱散，而且人们似乎并没有正确地登记你的命令。怀疑之余，你终于发现原因是你的一个邻居利用他们强大的混淆术技能来干扰你的事务。\n掌握了这，你现在可以尝试用各种方法来反击它。"
 POD_ai_disciplines.2400.a: "我只需要几句话就能得到服从。"
 POD_ai_disciplines.2400.success: "你的领地恢复正常。"
 POD_ai_disciplines.2400.failure: "没人在听！"
 POD_ai_disciplines.2400.b: "培训更多熟练有素的信使。"
 POD_ai_disciplines.2400.c: "我现在不需要那么大的掌控。"
 obfuscate_end_scheme: "计谋中止！"
 obfuscate_end_scheme_tt: "你的目标使用了高阶混淆术中止了你的计谋！"
 POD_ai_disciplines.2700.t: "众生衰竭"
 POD_ai_disciplines.2700.desc: "在你的领地里出了一些问题。你花了点时间才注意到，但你所在地区的凡人人口看起来很不健康。经过一番调查，你明白了一些超自然玩意在作祟。太阳经常在白天被遮住，因为暗影似乎有了自己的意志，影响了当地居民的生活。\n很明显，有人在利用一个强大的仪式来削弱你，你必须找到一个解决方案，或者接受这个令人不安的转变。"
 POD_ai_disciplines.2700.a: "是时候查书解决这个问题了。"
 POD_ai_disciplines.2700.success: "你的领地恢复正常。"
 POD_ai_disciplines.2700.failure: "行吧，那不管用……"
 POD_ai_disciplines.2700.b: "我了解了一些术法。"
 POD_ai_disciplines.2700.c: "一点黑暗无伤大雅。"
 POD_ai_disciplines.2800.t: "梦见亡者"
 POD_ai_disciplines.2800.desc: "你的沉眠最近一直被不健康的噩梦折磨着，以至于你对外界的干扰感到怀疑。经过一些调查，你确信你被一位亡灵术师诅咒了，其利用死灵手下来削弱你。\n知道来源至少可以帮助你在这些玩意对你影响过大之前寻找到阻止它们的方法。然而，根据亡灵术师的能力，这可能并不像听起来那么容易。"
 POD_ai_disciplines.2800.success: "和平夜晚。"
 POD_ai_disciplines.2800.failure: "行吧，那不管用……"
 POD_ai_disciplines.2800.b: "我了解了一些亡灵术。"
 POD_ai_disciplines.2800.c: "谁需要睡眠？我有工作要做！"
 dominate_end_faction: "派系终结！"
 dominate_end_faction_tt: "你的领主使用了支配术用来结束一个针对其的派系！"
 advanced_dominate_end_faction: "派系终结！"
 advanced_dominate_end_faction_tt: "你的领主使用了高阶支配术用来结束所有针对其的派系！"
 POD_ai_disciplines.3400.t: "舞动的疯狂"
 POD_ai_disciplines.3400.desc: "最近有一种奇怪的迷雾笼罩着你的头脑，使你的思想变得混沌。随机图像有时会出现在你的视野边缘，使你更难区分现实和虚幻。这已经达到了令人担忧的程度，你对此事展开了微妙的调查。结果发现，一个邻近的疯狂术大师出于某种深不可测的原因，用这种可怕的$pod_discipline$来针对你。现在你明白了问题的根源，你可以试着防止它失去控制。"
 POD_ai_disciplines.3400.success: "我的心灵属于我！"
 POD_ai_disciplines.3400.failure: "我感觉……有点怪。"
 POD_ai_disciplines.3400.a: "滚出我的脑海！"
 POD_ai_disciplines.3400.b: "我不认为这转变有什么问题。"
 POD_ai_disciplines.3400.c: "如果与之对抗，它可能会更糟……"
 ai_presence_majesty_modifier: "雄伟威仪"
 ai_presence_majesty_modifier_desc: "通过强大的威仪术力量，该角色在他们的臣民面前显得像一个完美的统治者。"
 POD_ai_disciplines.3900.t: "雄伟威仪"
 POD_ai_disciplines.3900.desc: "在过去的几周里，你的领主显得更加威严，而且，也更有吸引力。你不是唯一注意到这一点的人，在密切注意一些微妙的线索后，你可以确认其正在使用威仪术$pod_discipline$来创造这威武灵光。这很难以抗拒，而且每次你在宫廷上露面时都会变得更加困难。\n一个解决办法是，在未来的日子里避开宫廷，但这将被视为相当懦弱的行为。你也可以尝试用外交手段诱导你的领主，确保其在你在对抗其之前放弃这玩意。"
 POD_ai_disciplines.3900.success: "成功的政治运作。"
 POD_ai_disciplines.3900.failure: "外交失礼。"
 POD_ai_disciplines.3900.a: "陛下，如果可以的话……"
 POD_ai_disciplines.3900.b: "找个借口逃避宫廷。"
 baals_caress_amplified_perk_modifier: "巴尔的爱抚"
 baals_caress_amplified_perk_modifier_desc: "一种使人虚弱的血液疾病，使受害者虚弱。"
 POD_ai_disciplines.4000.t: "淬血"
 POD_ai_disciplines.4000.desc: "你忠诚的（或不那么忠诚的）勇士们最近感觉不对劲。你首先把它归结为你的下属的正常抱怨，但这似乎是一个更大的问题。经过一番调查，你的派员报告说，你的一个邻居正在利用其掌握的寂灭术$pod_discipline$诅咒你所在地区的资源供应。\n如果你没有魔法手段来抵抗，你就必须在它失去控制之前抓住其用来传播诅咒的派员。"
 POD_ai_disciplines.4000.success: "危机消除。"
 POD_ai_disciplines.4000.failure: "他们逃脱了……"
 POD_ai_disciplines.4000.a: "抓住他们！"
 POD_ai_disciplines.4000.b: "启动一个魔法仪式来阻止这诅咒。"
 POD_ai_disciplines.4000.c: "最好暂时低调行事。"
 ai_quietus_tooltip2: "你的一位勇士将得到巴尔的爱抚修正，降低其的勇武。"
 ai_quietus_tooltip1: "你的所有勇士将得到巴尔的爱抚修正，降低他们的勇武。"