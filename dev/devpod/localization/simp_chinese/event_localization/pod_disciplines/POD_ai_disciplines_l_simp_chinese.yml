l_simp_chinese:
 auspex_reveal_scheme:0 "计谋暴露！"
 auspex_reveal_scheme_tt:0 "你的目标使用了高阶观占术暴露了你的计谋！"
 POD_ai_disciplines.500.t:0 "癫兽潮"
 POD_ai_disciplines.500.desc:0 "在没有任何迹象的情况下，你们首都周围的当地动物突然变得非常具有攻击性。你的派员报告了许多针对当地人受到的袭击，而且损失数字开始堆积。凡人被吓坏了，该地区的商业和习惯性生活已经完全停止。\n在研究了其中一只动物的尸体后，你终于明白这是你的一个邻居利用他们在兽性术方面的巨大力量进行的一次联合攻击。你可以努力阻止这种攻击，或者只是尝试承受风暴。"
 POD_ai_disciplines.500.a: "召集部队！"
 POD_ai_disciplines.500.success:0 "你把动物们压回去了！"
 POD_ai_disciplines.500.failure:0 "它们太强了……"
 POD_ai_disciplines.500.b: "组织凡人进行抵抗！"
 POD_ai_disciplines.500.c: "他们终将会耗尽血液……"
 POD_ai_disciplines.900.t:0 "蛇的诱惑"
 POD_ai_disciplines.900.desc:0 "你最近对你的领主有一种奇怪的好感。他们似乎比平时更强大、更聪明、更……有吸引力。很可疑，你一直在寻找迹象，现在确定了：你受到了源自古蛇术的魅惑。\n然而，知道这一点并不能使你更容易遏制这种非自然的吸引力，你仍然要下决心反抗它。"
 POD_ai_disciplines.900.a: "为什么要斗争？ "
 POD_ai_disciplines.900.b: "我的心灵属于我！"
 POD_ai_disciplines.2000.t:0 "警惕的牧人"
 POD_ai_disciplines.2000.desc:0 "无论他们的种姓或出身如何，萨洛比都认为自己是人类的守护者。他们的标志性律能——魂健术，反映了这一事实。你的领主对这种力量有一些了解，并提出帮助你监控你所在地区的凡人，促进他们的成长。\n然而，在吸血鬼的世界里没有什么是免费的，这样的提议肯定会让你在某个时候付出回报。"
 POD_ai_disciplines.2000.a: "令人感激的帮助。"
 POD_ai_disciplines.2000.b: "我会处理我自己的凡人。"
 POD_ai_disciplines.2400.t:0 "死亡寂静"
 POD_ai_disciplines.2400.desc:0 "你最近发现你的国度很难管理。你的命令似乎被忽视了，你的信使在没有警告的情况下被驱散，而且人们似乎并没有正确地登记你的命令。怀疑之余，你终于发现原因是你的一个邻居利用他们强大的混淆术技能来干扰你的事务。\n掌握了这，你现在可以尝试用各种方法来反击它。"
 POD_ai_disciplines.2400.a: "我只需要几句话就能得到服从。"
 POD_ai_disciplines.2400.success:0 "你的领地恢复正常。"
 POD_ai_disciplines.2400.failure:0 "没人在听！"
 POD_ai_disciplines.2400.b: "培训更多熟练有素的信使。"
 POD_ai_disciplines.2400.c: "我现在不需要那么大的掌控。"
 obfuscate_end_scheme:0 "计谋中止！"
 obfuscate_end_scheme_tt:0 "你的目标使用了高阶混淆术中止了你的计谋！"
 POD_ai_disciplines.2700.t:0 "众生衰竭"
 POD_ai_disciplines.2700.desc:0 "在你的领地里出了一些问题。你花了点时间才注意到，但你所在地区的凡人人口看起来很不健康。经过一番调查，你明白了一些超自然玩意在作祟。太阳经常在白天被遮住，因为暗影似乎有了自己的意志，影响了当地居民的生活。\n很明显，有人在利用一个强大的仪式来削弱你，你必须找到一个解决方案，或者接受这个令人不安的转变。"
 POD_ai_disciplines.2700.a: "是时候查书解决这个问题了。"
 POD_ai_disciplines.2700.success:0 "你的领地恢复正常。"
 POD_ai_disciplines.2700.failure:0 "行吧，那不管用……"
 POD_ai_disciplines.2700.b: "我了解了一些术法。"
 POD_ai_disciplines.2700.c: "一点黑暗无伤大雅。"
 POD_ai_disciplines.2800.t:0 "梦见亡者"
 POD_ai_disciplines.2800.desc:0 "你的沉眠最近一直被不健康的噩梦折磨着，以至于你对外界的干扰感到怀疑。经过一些调查，你确信你被一位亡灵术师诅咒了，其利用死灵手下来削弱你。\n知道来源至少可以帮助你在这些玩意对你影响过大之前寻找到阻止它们的方法。然而，根据亡灵术师的能力，这可能并不像听起来那么容易。"
 POD_ai_disciplines.2800.success:0 "和平夜晚。"
 POD_ai_disciplines.2800.failure:0 "行吧，那不管用……"
 POD_ai_disciplines.2800.b: "我了解了一些亡灵术。"
 POD_ai_disciplines.2800.c: "谁需要睡眠？我有工作要做！"
 dominate_end_faction:0 "派系终结！"
 dominate_end_faction_tt:0 "你的领主使用了支配术用来结束一个针对其的派系！"
 advanced_dominate_end_faction:0 "派系终结！"
 advanced_dominate_end_faction_tt:0 "你的领主使用了高阶支配术用来结束所有针对其的派系！"