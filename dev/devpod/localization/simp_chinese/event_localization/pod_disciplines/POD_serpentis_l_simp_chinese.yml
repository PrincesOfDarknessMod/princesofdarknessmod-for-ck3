l_simp_chinese:
 POD_heart_of_darkness.001.t:0 "黑暗之心"
 POD_heart_of_darkness.001.desc:0 "现在是离人性更远的时候了。一切都准备好了，一个黑暗的仪式将允许你移除自己的心，成为自己命运的主宰，你的心兽对你的影响越来越小。但你有足够的勇气继续下去吗？"
 POD_heart_of_darkness.001.option.a:0 "时候到了"
 POD_heart_of_darkness.001.option.a.tt:0 "你将移除你的心"
 POD_heart_of_darkness.001.option.a.tt.beast:0 "#R 大错特错！#!"
 POD_heart_of_darkness.001.option.b:0 "我还没准备好"
 POD_heart_of_darkness.001.option.b.tt:0 "你放弃了接受仪式的尝试"
 POD_heart_of_darkness.001.option.b.tt.beast:0 "#R 这就对了！没有我，你就无法生存！#!"
 POD_heart_of_darkness.002.t:0 "无心"
 POD_heart_of_darkness.002.desc:0 "它完成了，仪式达成了。你感觉你的情绪变得迟钝，使你更容易生存。缺点是，你变得更难理解别人，现在你的敌人可能会找到你的心并摧毁它。但最大的好处与心兽有关，它现在更安静了，更容易克服。"
 POD_heart_of_darkness.002.option.a:0 "情绪无法控制我！"
 POD_heart_of_darkness.002.option.a.tt:0 "你成功地取出了你的心，但你可以随时把它放回你的胸腔里。"
 POD_heart_of_darkness.003.t:0 "窃心"
 POD_heart_of_darkness.003.desc:0 "时候到了，你已经准备好对[heart_victim.GetFirstName]进行你的黑暗仪式。直到为时已晚，你拥有了[heart_victim.GetHerHis]的心脏时，[heart_victim.GetSheHe]才会知道发生了什么！这就是你的目的。现在，唯一剩下的事情就是将你的黑暗计划付诸实施。"
 POD_heart_of_darkness.003.option.a:0 "[heart_victim.GetHerHis|U]的心脏将属于我！"
 POD_heart_of_darkness.003.option.a.tt:0 "你将尝试偷走[heart_victim.GetFirstNamePossessive]的心脏"
 POD_heart_of_darkness.003.option.a.tt.beast:0 "#R 我们将掌控[heart_victim.GetHerHim]！#!"
 POD_heart_of_darkness.003.option.a.desc:0 "该计划开始运作。"
 POD_heart_of_darkness.003.option.a.success:0 "你成功地偷了心脏。"
 POD_heart_of_darkness.003.option.a.failure:0 "你没能偷走心脏。"
 POD_heart_of_darkness.003.option.a.tt.attacker_wins:0 "你拥有了[heart_victim.GetFirstName]的心脏。"
 POD_heart_of_darkness.003.option.a.tt.defender_wins:0 "你失败得很厉害，现在不得不处理后果。"
 POD_heart_of_darkness.003.option.b:0 "还不是时候……"
 POD_heart_of_darkness.003.option.b.tt:0 "你放弃了窃取[heart_victim.GetFirstNamePossessive]心脏的计划。"
 POD_heart_of_darkness.003.option.b.tt.beast:0 "#R 你让我很失望！#!"
 POD_heart_of_darkness.004.t:0 "屈服之心"
 POD_heart_of_darkness.004.desc:0 "你的黑暗仪式成功了！[heart_victim.GetFirstName]无助地看着你取走了[heart_victim.GetHerHis]的心脏，却无法阻止这个仪式。而现在[heart_victim.GetSheHe]只能希望你不会决定结束[heart_victim.GetHerHis]的亡生。你带着你的黑暗收藏中的一个新藏品回家了。"
 POD_heart_of_darkness.004.option.a:0 "你的死活就全看我了。"
 POD_heart_of_darkness.004.option.a.tt:0 "你成功地偷走了[heart_victim.GetFirstNamePossessive]的心脏。"
 POD_heart_of_darkness.005.t:0 "不从之心"
 POD_heart_of_darkness.005.desc:0 "[heart_victim.GetFirstName]看穿了你的计谋，避开了你。仪式还没有结束，[heart_victim.GetFirstNamePossessive]已经怒不可挡。勉强逃过一劫，你担心[heart_victim.GetFirstName]会对你进行报复。"
 POD_heart_of_darkness.005.option.a:0 "该溜了！"
 POD_heart_of_darkness.005.option.a.tt:0 "你的计划没有成功。"