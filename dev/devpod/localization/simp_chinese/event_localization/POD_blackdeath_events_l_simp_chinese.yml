l_simp_chinese:
 POD_blackdeath.0002.t: "瘟疫的传闻"
 POD_blackdeath.0002.desc: "疾病是这个时代的必然现象，但一个新的传言让你感到不安。它说的是一种比其他任何疾病都要可怕的瘟疫，来自遥远的东方。这种可怕的传染病似乎在以惊人的速度蔓延，死亡人数每天都在攀升。\n你的统治，虽然在某种程度上脱离了凡人事务，但仍然与你领地内那些脆弱的生命的福祉息息相关。若你只能统治尸体和跳蚤，会发生什么？这是个严峻的猜想，甚至足以让最残酷的领主有所顾虑。\n然而，时间已经不多了，你必须做出决定，你是否会尝试巧妙地让你所在地区的凡人对未来的动荡时期有所准备？"
 POD_blackdeath.0002.a: "让我们为救赎而祈祷！"
 POD_blackdeath.0002.b: "我需要我的凡人保持健康！"
 POD_blackdeath.0002.c: "不关我事"
 POD_blackdeath_preparations: "当苍白骑士到来时，你将有更多准备。"
 POD_blackdeath.0004.t: "黑死病"
 POD_blackdeath.0004.desc: "世界已晓得瘟疫和疾病，但它是否曾经知道像黑死病这样致命的东西？即使以你丰富的知识，你也不记得有像这样可怕的事件。\n凡人在奔逃中死亡，被苍白骑士所收割，他从一个城市到另一个城市，只留下尸体和跳蚤。祈祷、火灾、指责……似乎没有什么能够阻止它，甚至减缓它。整个社区已经化为灰烬，空气弥漫着阴森的寂静，日日夜夜低语着……\n这就是末日吗？"
 POD_blackdeath.0004.a: "人类将迎来缓慢苦难的终末？"
 POD_blackdeath_happening: "黑死病已经来临。诸国都受到了破坏，根据感染的规模，失去了发展度和建筑。你会看到伯爵领修正，表明每个伯爵领所受的损害程度。"
 POD_blackdeath.0005.t: "灾疫"
 POD_blackdeath.0005.desc: "情况越来越糟。\n不知何故，黑死病毒株似乎已经变异了。之前，它只影响凡人，对吸血鬼没有什么直接影响，但现在不再是这样了。这个变种，被学者们称为“灾疫”，能直接攻击吸血鬼的$pod_vitae$。它使血液的力量不如原来，因此需要更大的耗费才能发挥作用。再加上由于凡人仍在随着黑死病的发生而不断死亡，血液供应被缩减……\n唯一的好消息是，瘟疫似乎对吸血鬼并不致命，最多只是使人衰弱。尽管进行了疯狂的调查，但没有人知道这一切是如何发生的，或者是否有人对此负责……"
 POD_blackdeath.0005.a: "这场噩梦有尽头吗？"
 POD_blackdeath.0005.b: "肯定都是睿魔尔干的！"
 POD_blackdeath.0005.c: "是卡帕多西亚对死去凡人的尸体进行了干预！"
 POD_blackdeath.0005.d: "显然都是赛特之子的错。"
 POD_scourge_tremere: "你国内的睿魔尔不会喜欢这。"
 POD_scourge_cappadocian: "你国内的卡帕多西亚不会喜欢这。"
 POD_scourge_setite: "你国内的赛特之子不会喜欢这。"
 POD_scourge_warning: "一些吸血鬼已经开始被“灾疫”感染并传播它。"
 POD_blackdeath.0007.t: "剥皮瘟疫"
 POD_blackdeath.0007.desc: "并非所有狼族的敌人都可以用尖牙利爪来对付。1229年冬天，立陶宛的狼人患上了高烧。起初，这似乎是一种奇怪的痨病后遗症，接着出现了疖子，接着皮肤从骨头上脱落，令人痛苦不堪。该地区的狼族全部死亡，疾病开始向西蔓延。数以百计的狼族和狼嫡死于此病，眉月狼似乎几乎无法控制它。\n来自世界各地的战群都在分享关于这种致命疾病的潜在原因的信息和谣言，这种疾病显然具有超自然的性质，因为它只针对狼人及其狼嫡。对于骄傲的盖亚战士来说，在为时已晚之前，能找到罪魁祸首吗？"
 POD_blackdeath.0007.a: "我们必须行动！"
 POD_scourge_happening: "你已经被灾疫感染了。由于这种疾病的传染性，你的随从也可能很快被感染。\n你可以查看特质经验条来知晓你当前症状的严重程度。"
 POD_flaying_plague_happening: "剥皮瘟疫从东欧开始散播。你有一项决议来阻止它。直到找到解决方案前，疫情会不断定期爆发。"