l_simp_chinese:
 POD_blackdeath.0002.t:0 "瘟疫的传闻"
 POD_blackdeath.0002.desc:0 "疾病是这个时代的必然现象，但一个新的传言让你感到不安。它说的是一种比其他任何疾病都要可怕的瘟疫，来自遥远的东方。这种可怕的传染病似乎在以惊人的速度蔓延，死亡人数每天都在攀升。\n你的统治，虽然在某种程度上脱离了凡人事务，但仍然与你领地内那些脆弱的生命的福祉息息相关。若你只能统治尸体和跳蚤，会发生什么？这是个严峻的猜想，甚至足以让最残酷的领主有所顾虑。\n然而，时间已经不多了，你必须做出决定，你是否会尝试巧妙地让你所在地区的凡人对未来的动荡时期有所准备？"
 POD_blackdeath.0002.a:0 "让我们为救赎而祈祷！"
 POD_blackdeath.0002.b:0 "我需要我的凡人保持健康！"
 POD_blackdeath.0002.c:0 "不关我事"
 POD_blackdeath_preparations:0 "当苍白骑士到来时，你将有更多准备。"
 POD_blackdeath.0004.t:0 "黑死病"
 POD_blackdeath.0004.desc:0 "世界已晓得瘟疫和疾病，但它是否曾经知道像黑死病这样致命的东西？即使以你丰富的知识，你也不记得有像这样可怕的事件。\n凡人在奔逃中死亡，被苍白骑士所收割，他从一个城市到另一个城市，只留下尸体和跳蚤。祈祷、火灾、指责……似乎没有什么能够阻止它，甚至减缓它。整个社区已经化为灰烬，空气弥漫着阴森的寂静，日日夜夜低语着……\n这就是末日吗？"
 POD_blackdeath.0004.a:0 "人类将迎来缓慢苦难的终末？"
 POD_blackdeath_happening:0 "黑死病已经来临。诸国都受到了破坏，根据感染的规模，失去了发展度和建筑。你会看到伯爵领修正，表明每个伯爵领所受的损害程度。"
 POD_blackdeath.0005.t:0 "灾疫"
 POD_blackdeath.0005.desc:0 "情况越来越糟。\n不知何故，黑死病毒株似乎已经变异了。之前，它只影响凡人，对吸血鬼没有什么直接影响，但现在不再是这样了。这个变种，被学者们称为“灾疫”，能直接攻击吸血鬼的精血。它使血液的力量不如原来，因此需要更大的耗费才能发挥作用。再加上由于凡人仍在随着黑死病的发生而不断死亡，血液供应被缩减……\n唯一的好消息是，瘟疫似乎对吸血鬼并不致命，最多只是使人衰弱。尽管进行了疯狂的调查，但没有人知道这一切是如何发生的，或者是否有人对此负责……"
 POD_blackdeath.0005.a:0 "这场噩梦有尽头吗？"
 POD_blackdeath.0005.b:0 "肯定都是睿魔尔干的！"
 POD_blackdeath.0005.c:0 "是卡帕多西亚对死去凡人的尸体进行了干预！"
 POD_blackdeath.0005.d:0 "显然都是赛特之子的错。"
 POD_scourge_tremere:0 "你国内的睿魔尔不会喜欢这。"
 POD_scourge_cappadocian:0 "你国内的卡帕多西亚不会喜欢这。"
 POD_scourge_setite:0 "你国内的赛特之子不会喜欢这。"
 POD_scourge_warning:0 "一些吸血鬼已经开始被“灾疫”感染并传播它。"
 POD_blackdeath.0007.t:0 "剥皮瘟疫"
 POD_blackdeath.0007.desc:0 "Not all enemies of the Garou can be battled with fangs and claws. In the winter of 1229, werewolves in Lihuania fell victim to a fever. At first it seemed like a strange offshot of consumption, then the boils appeared, then the skin fell, agonizingly, from the bones. The entire Garou population of the region died and the disease started to spread west. Hundreds of Garou and Kinfolk die in its wake as the Theurges seem barely able to contain it.\nPacks from all over the world are sharing information and rumors about the potential cause of this deadly disease which seems clearly supernatural in nature as it only targets werewolves and their kinfolks. Will the culprit be found before it is too late for the proud warriors of Gaia?"
 POD_blackdeath.0007.a:0 "我们必须行动！"
 POD_scourge_happening:0 "你已经被灾疫感染了。由于这种疾病的传染性，你的随从也可能很快被感染。\n你可以查看特质经验条来知晓你当前症状的严重程度。"
 POD_flaying_plague_happening:0 "剥皮瘟疫从东欧开始散播。你有一项决议来阻止它。"