l_simp_chinese:
 POD_blood_tithe_kine.100.t: "血贡到达"
 POD_blood_tithe_kine.100.desc: "[recipient.GetTitledFirstName]已经发送了所要求的血贡。该贡品被称为“[kine_tithe.GetFirstName]”。据说[kine_tithe.GetHerHis|U]的血液含有"
 POD_blood_tithe_kine.100.desc.negligible: "微弱"
 POD_blood_tithe_kine.100.desc.fleeting: "平淡"
 POD_blood_tithe_kine.100.desc.intense: "强烈"
 POD_blood_tithe_kine.100.desc.acute: "极锐"
 POD_blood_tithe_kine.100.desc.choleric: "胆汁质"
 POD_blood_tithe_kine.100.desc.melancholic: "抑郁质"
 POD_blood_tithe_kine.100.desc.phlegmatic: "黏液质"
 POD_blood_tithe_kine.100.desc.sanguine: "多血质"
 POD_blood_tithe_kine.100.desc.finish: "共鸣。"
 POD_blood_tithe_kine.100.option.a: "我将让其加入我的牧群。"
 POD_blood_tithe_kine.100.option.b: "将其丢入我的地牢。"
 POD_blood_tithe_kine.100.option.b.tt: "[kine_tithe.GetFirstName]将被监禁。"
 POD_blood_tithe_kine.100.option.b.imprison: "血畜血贡被丢在了地牢。"
 POD_blood_tithe_kine.100.option.c: "欢迎来到我的宫廷，[kine_tithe.GetFirstName]。"
 POD_blood_tithe_kine.100.option.d: "我现在就享用。"
 POD_blood_tithe_kine.100.option.e: "这血皿无法令人接受，重新给我带一只。"
 POD_blood_tithe_kine.100.option.f: "滚出我的视线。"