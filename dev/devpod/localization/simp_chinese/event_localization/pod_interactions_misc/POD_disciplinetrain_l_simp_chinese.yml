 POD_disciplinetrain.100.option.w: "兽灵"
 POD_disciplinetrain.100.option.x: "第三眼"
 POD_disciplinetrain.140.t: "赐予灵赋"
 POD_disciplinetrain.140.desc: "有时，狼族可以把灵赋教给其他狼族，但这个过程通常需要几个星期（或几个月），而且学生的新能力练习充满了风险。有些兽嫡可以学习天赋，但这些人非常罕见。大多数兽嫡不知道任何灵赋。即使是最训练有素的兽嫡也可能只知道一两个。你要教[disciplinetrainee.GetFirstName]……"
 POD_disciplinetrain.140.option.a: "通常灵赋"
 POD_disciplinetrain.140.option.b: "血种灵赋"
 POD_disciplinetrain.140.option.c: "月兆灵赋"
 POD_disciplinetrain.100.option.y: "操纵血液"
 POD_disciplinetrain.100.option.z: "源自妖精的力量"
 POD_disciplinetrain.150.t: "魔咒传授"
 POD_disciplinetrain.150.desc: "学习一个全新的技能、知识、术艺或术域需要一些辅导和研究。该学习可以是简易的（与朋友一起训练几天，学习近战的基础知识），也可以是复杂的（进入[UmbraGlossary('near_dreaming')]探索梦占术艺背后的原理），但它总是得去做。导师能提供帮助，但即使是导师也只能教其自己知道的东西。你要教[disciplinetrainee.GetFirstName]……"
