l_simp_chinese:
 POD_disciplinetrain.100.t: "$pod_discipline$教导"
 POD_disciplinetrain.100.desc: "如果你家臣[disciplinetrainee.GetHerHis]的血管里流着吸血鬼的血，但不了解一项你知道的$pod_discipline$，你可以发掘[disciplinetrainee.GetHerHim]的那项$pod_discipline$。这不是无代价的，你必须将血分享给[disciplinetrainee.GetHerHim]。更重要的是，你需要分享你的经验和积累的血液共鸣。有些[Glossary('血律','game_concept_discipline_desc')]比其他更难教，因此会消耗你的意志力，造成压力。你将教会[disciplinetrainee.GetFirstName]去如何……"
 POD_disciplinetrain.100.option.a: "获取强大的蛮力"
 POD_disciplinetrain.100.option.b: "以超自然的敏捷移动"
 POD_disciplinetrain.100.option.c: "忍受伤害并巩固[disciplinetrainee.GetHerHis]的心智"
 POD_disciplinetrain.100.option.d: "跟动物对话"
 POD_disciplinetrain.100.option.e: "强化[disciplinetrainee.GetHerHis]的感官"
 POD_disciplinetrain.100.option.f: "操控心智"
 POD_disciplinetrain.100.option.g: "魅惑他人"
