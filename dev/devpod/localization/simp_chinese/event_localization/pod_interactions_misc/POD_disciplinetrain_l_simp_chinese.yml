 POD_disciplinetrain.100.option.l: "行使隐秘魔法"
 POD_disciplinetrain.100.option.m: "将幻象施加于现实"
 POD_disciplinetrain.100.option.n: "恶魔式操纵"
 POD_disciplinetrain.100.option.o: "掌控暗影"
 POD_disciplinetrain.100.option.p: "蛇之痴迷"
 POD_disciplinetrain.120.t: "传功"
 POD_disciplinetrain.120.desc: "几个世纪以来，[GetTrait('shih').GetName( GetPlayer )]的修行几乎没什么变化。为了能抵御鬼神的迷惑与惊怖，[GetTrait('shih').GetName( GetPlayer )]的心灵必须被锻造成型，因此这是修行开始的第一个领域。你将传授给[disciplinetrainee.GetFirstName]……"
 POD_disciplinetrain.120.option.a: "吾神窍"
 POD_disciplinetrain.120.option.b: "魔功窍"
 POD_disciplinetrain.120.option.c: "玉安窍"
 POD_disciplinetrain.120.option.d: "凤窍"
 POD_disciplinetrain.120.option.e: "蛇窍"
 POD_disciplinetrain.120.option.f: "镜窍"
 POD_disciplinetrain.120.option.g: "龙令窍"
 POD_disciplinetrain.120.option.h: "梦窍"
 POD_disciplinetrain.120.option.i: "竹猫窍"
 POD_disciplinetrain.100.option.q: "掌控死亡"
 POD_disciplinetrain.100.option.r: "行于黑夜"
 POD_disciplinetrain.130.t: "赫考教导"
 POD_disciplinetrain.130.desc: "木乃伊们应当接受且接纳永生。木乃伊不该把永生当作一种诅咒，而应该学会把它看作是一个获得智慧的机会。木乃伊不会被经验所淹没，也不会发现自己对世界的沧海桑田毫无准备，而是有机会去传道，去求生，去获有长生所有的好处且不受副作用。你将教导[disciplinetrainee.GetFirstName]……"
 POD_disciplinetrain.130.option.a: "炼金"
 POD_disciplinetrain.130.option.b: "护符"
 POD_disciplinetrain.130.option.c: "天文"
 POD_disciplinetrain.130.option.d: "俑像"
 POD_disciplinetrain.130.option.e: "通灵"
 POD_disciplinetrain.130.option.f: "术言"
 POD_disciplinetrain.130.option.g: "丹"
