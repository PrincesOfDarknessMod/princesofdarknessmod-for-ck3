l_simp_chinese:
 POD_learntruefaith.001.t: "真信"
 POD_learntruefaith.001.desc: "你请求[teacher.GetFirstName]的帮助。尽管你是最虔诚的神的仆人之一，但你就是得不到其他一些信徒所拥有并展现的神圣力量。是你的灵魂太弱了吗？还是说你做错了什么？你现在下定决心要改进，但你并不清楚该怎么做。[teacher.GetFirstName]想出了一个可以帮助你的信仰考验，但你是否有足够的虔诚去完成它？"
 POD_learntruefaith.001.option.a: "我已经够虔诚了！"
 POD_learntruefaith.001.option.a.tt: "你的信仰受到了考验"
 POD_learntruefaith.001.option.a.desc: "信仰考验"
 POD_learntruefaith.001.option.a.success: "你是值得的"
 POD_learntruefaith.001.option.a.success.tt: "你完成了考验"
 POD_learntruefaith.001.option.a.failure: "你不值得"
 POD_learntruefaith.001.option.a.failure.tt: "你没有通过考验"
 POD_learntruefaith.001.option.b: "我不认为我可以做到这一点"
 POD_learntruefaith.001.option.b.tt: "你放弃了获得[Glossary('真信','game_concept_true_faith_desc')]的尝试"
 POD_learntruefaith.101.t: "得有神力"
 POD_learntruefaith.101.desc: "你完成了考验！也许这种力量一直都在你身上，仅只需要你部分自信的表现？你可能永远也无法知道，因为天主以神秘的方式运转这一切。[teacher.GetFirstName]非常以你为荣，而你和[teacher.GetHerHim]在一起的时间也已经结束了，因为现在你总算能感受到天主的恩惠。"
 POD_learntruefaith.101.option.a: "我将终身侍奉祂"
 POD_learntruefaith.101.option.a.tt: "你配得获有神圣力量"
 POD_learntruefaith.201.t: "不得神力"
 POD_learntruefaith.201.desc: "你未通过考验。也许这不是天主为你选择的道路。你想相信这一点，因为另一种选择，即你以某种方式失去祂宠爱的可能性，让你无法忍受。[teacher.GetFirstName]对这项结果感到很失望，但愿意再尝试一次。"
 POD_learntruefaith.201.option.a: "我是不会停下来的"
 POD_learntruefaith.201.option.a.tt: "你还没有获得[Glossary('真信','game_concept_true_faith_desc')]……目前来说"