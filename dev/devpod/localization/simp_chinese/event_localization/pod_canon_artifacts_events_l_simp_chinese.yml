l_simp_chinese:
 POD_canon_artifacts.100.t: "剑在呼唤"
 POD_canon_artifacts.100.desc: "你知道那些传言。你携带的武器可能是世界上最臭名昭著的武器。空无之剑在很久以前被创造出来，作为古代苏美尔的强大恶魔德拉孔斯基的容器。就在他最终被释放到凡间之前，他被一个名叫提亚马特的吸血鬼挫败了，她把他困在自己的身体里，然后把那把被诅咒的剑扔掉了。\n从那时起，它就一直试图与它的主人团聚，而且它的大多数主人都知道，如果他们不服从恶魔的牵引，就会在某一时刻遭遇不幸地死亡……"
 POD_canon_artifacts.100.a: "我不会听从一把剑的！"
 POD_canon_artifacts.100.b: "……我将响应呼唤"
 sword_of_nul_warning: "这条路径——显然——相当危险……"
 POD_canon_artifacts.101.t: "剑在呼唤（二）"
 POD_canon_artifacts.101.desc: "当你回应它的牵引时，你很快意识到空无之剑根本不关心你的安危。它无情地驱使你走向它主人的安息之地，甚至试图让你在白天保持清醒。就这样，你从一个危险走向另一个危险，无论是黑暗的森林、缺血还是在陌生的土地上寻找休息地的麻烦。\n按照这种速度，你将加入一长串的持剑者伤亡名单，你需要放慢脚步，在为时已晚之前计划好行动方案。"
 POD_canon_artifacts.101.a: "让我准备一名向导……"
 POD_canon_artifacts.101.b: "花钱雇来向导和强大的武装护卫！"
 POD_canon_artifacts.101.effect.success.desc: "避过危险"
 POD_canon_artifacts.101.critical.failure.effect.desc: "有一名死于剑的受害者……"
 POD_canon_artifacts.101.critical.failure: "又一咬……"
 POD_canon_artifacts.102.t: "剑在呼唤（三）"
 POD_canon_artifacts.102.desc: "你终于接近了德拉孔斯基的休息地，你几乎能感觉到空无之剑充满了期待。不过有一个小问题，这只恶魔正躺在一个充满陷阱的迷宫里，以阻止任何不受欢迎的入侵者。\n显然，你有这把剑，所以你可以“跟随”它的脚步，避开里面的大部分危险。但总是有转错弯的风险……不过现在不能回头，因为你几乎可以肯定，如果你在这个时候退后一步，剑就会攻击你。"
 POD_canon_artifacts.102.a: "小心，小心……"
 POD_canon_artifacts.102.effect.success.desc: "成了！"
 POD_canon_artifacts.102.critical.failure.effect.desc: "这石头在这里干嘛？"
 POD_canon_artifacts.102.critical.failure: "受石而死"
 drakonskyr_reborn_modifier: "德拉孔斯基再世"
 drakonskyr_reborn_modifier_desc: "长久之后，你终于获得了自由。世界将颤抖，之后将鞠躬。向魔邪战争之主致敬！"
 POD_canon_artifacts.103.t: "剑在呼唤（四）"
 POD_canon_artifacts.103.desc: "成了，你终于站在了提亚马特–德拉孔斯基的面前。恶魔已从沉睡中醒来，他忠实的剑警告了你的到来。这名地狱领主很温和，感谢你解救了他，并承诺为你的帮助提供丰富的回报。\n你很快评估到，现在抵抗他已经太晚了，因为有空无之剑在他身边，他对你而言已经过于强大了，所以你考虑了下能做的选择。\n一方面，德拉孔斯基提出将这个坟墓中的宝藏交给你，并让你保留这把剑，显然他已经从里面提取了他的精华。另一方面，这个恶魔试图用成为他的新宿主的可能性来诱惑你，并承诺如果你们两个人“一起合作”，就将会有永恒的力量。"
 POD_canon_artifacts.103.a: "哦不！"
 POD_canon_artifacts.103.b: "哦耶！"
 drakonskyr_free: "恭喜，你释放了一名地狱领主。至少空无之剑现在会对你忠心耿耿。"
 tablet_of_destiny_decision: "命运石板"
 tablet_of_destiny_decision_tooltip: "无尽的知识！"
 tablet_of_destiny_decision_desc: "命运石板具有以诺对所有血之力量的了解。很值得研究。"
 tablet_of_destiny_decision_effect_tooltip: "你将能从石板中学到新[Glossary('血律','game_concept_discipline_desc')]"
 tablet_of_destiny_decision_confirm: "新的力量！"
 POD_canon_artifacts.200.t: "解读命运石板"
 POD_canon_artifacts.200.desc: "命运石板是原始$pod_discipline$的蓝图，也许是由该隐本人编纂的。它实际上没有你担心的那么难理解，但练习释放你血之力量所需的仪式仍然需要你付出一些努力。\n你认为明智的做法是一次学习一门$pod_discipline$，以避免潜在的信息过载危险。今夜你将专注于哪一门？"
 POD_canon_artifacts.200.option.a: "支配术"
 POD_canon_artifacts.200.option.b: "兽性术"
 POD_canon_artifacts.200.option.c: "观占术"
 POD_canon_artifacts.200.option.d: "迅捷术"
 POD_canon_artifacts.200.option.e: "混淆术"
 POD_canon_artifacts.200.option.f: "蛮力术"
 POD_canon_artifacts.200.option.g: "威仪术"
 POD_canon_artifacts.200.option.h: "变形术"
 POD_canon_artifacts.200.option.j: "坚韧术"
 POD_canon_artifacts.200.option.l: "时机还不成熟"
 eye_of_hazimel_decision: "哈济梅尔之眼"
 eye_of_hazimel_decision_tooltip: "它在看着你……"
 eye_of_hazimel_decision_desc: "哈济梅尔之眼是一个邪恶的遗物，如果不小心处理，就会夺走思想和灵魂。到目前为止，你一直很谨慎，将眼球封装在一个盒子里，但这也使你无法利用它的真正力量。"
 eye_of_hazimel_decision_effect_tooltip: "你将尝试释放眼球的全部力量……并不让自己消失"
 eye_of_hazimel_decision_confirm: "让我想想"
 POD_canon_artifacts.300.t: "植入眼球"
 POD_canon_artifacts.300.desc: "哈济梅尔之眼是一个来历不明的邪恶遗物，众所周知，它能赋予任何用它取代自己眼睛的人强大的力量，但也会带来巨大的精神损伤。有些人在它所提供的疯狂幻象中迷失了自己，而这只眼睛本身似乎也乐于把它的宿主变成它腐化意志的延伸。\n到目前为止，你已经抵制了它的呼唤，让它安全地封装在一个密封的盒子里，但诱惑是永远存在的。也许你足够强大，可以驾驭它的力量而不失去自己……或者，这种傲慢的感觉是眼睛为引诱你而投射的错觉。"
 POD_canon_artifacts.300.a: "我比这玩意更强！"
 POD_canon_artifacts.300.b: "让我们关着盒子吧"
 eye_of_hazimel_warning: "这条路径——显然——相当危险……"
 POD_canon_artifacts.301.t: "植入眼球（二）"
 POD_canon_artifacts.301.desc: "你把自己的眼睛扯出来，打开密封的盒子，可怕地看到哈济梅尔之眼跳到了你的眼窝里去植入自己。这种感觉让人困惑。这并不完全是痛苦，因为你已经远远超越了这种琐碎的事，但突然涌入你的大量图像和记忆是压倒性的。你看到文明的兴起和衰落，看到比你年长的该隐之子在无休止的战争中相互争斗……而在这期间，眼睛在你呆滞的身体里伸展它的卷须，试图在你分心的时候接管。\n你很快意识到这一点，有了机会进行反击，但当眼睛看到你还没有放弃时，它对你的思想的攻击增加了十倍……"
 POD_canon_artifacts.301.a: "抵抗！"
 POD_canon_artifacts.301.effect.success.desc: "我能做到！"
 POD_canon_artifacts.301.critical.failure.effect.desc: "好多奇妙可看……"
 eye_of_hazimel_tamed_modifier: "受控的哈济梅尔之眼"
 eye_of_hazimel_tamed_modifier_desc: "眼球已经承认你是一个有价值的宿主，并没有试图接管你。目前而言。"
 POD_canon_artifacts.302.t: "哈济梅尔之眼（二）"
 POD_canon_artifacts.302.desc: "你比单纯的血肉遗物更强大，即使是像哈济梅尔之眼这样的恶毒遗物。慢慢地，一块一块地，你抵抗着你脑海中的腐化影响，取回了意识。那只眼睛还尝试了一些其他的把戏，从恶梦幻觉到基本的身体疼痛，但你坚强地站了起来。\n疲惫不堪，或者也许只是被你的复原力所打动，宝物已经停止了对你的攻击，现在似乎满足于作为你自己的眼睛。但它仍然是一个有知觉的生命，而且你能感觉到它的力量险些超出你的掌握。一个奇怪的、但非常有利可图的伙伴关系诞生了。"
 POD_canon_artifacts.302.a: "我能看到一切！"
 eye_of_hazimel_unleashed_modifier: "受释的哈济梅尔之眼"
 eye_of_hazimel_unleashed_modifier_desc: "你和眼睛是一体的。除了它在更多时候掌权。"
 POD_canon_artifacts.303.t: "哈济梅尔之眼（二）"
 POD_canon_artifacts.303.desc: "你已经尽力了。即使在它的胜局中，眼球也承认你是它意志最坚强的宿主之一，并且可以发挥作用。这种浅层次的胜利意味着你仍有一些自由意志，但眼球在它觉得合适时就会接管。而当这种情况发生时，对你周围的人来说总是不愉快的。\n当然，你比以前更强大、更有威慑力，但代价也很高。好的是，你没有处于一个可以思考这是否值得的状态。"
 POD_canon_artifacts.303.a: "我们能看到一切！"
 ankaran_sarcophagus_decision: "安卡拉石棺"
 ankaran_sarcophagus_decision_tooltip: "啥在里面？"
 ankaran_sarcophagus_decision_desc: "一种不祥的预感从这个石棺中散发出来，仿佛有一位古老而不可否认的邪物在里面等待。或者它可能只是一个空盒子。谁知道呢？"
 ankaran_sarcophagus_decision_effect_tooltip: "你对接下来会发生什么毫无头绪"
 ankaran_sarcophagus_decision_confirm: "我真想测试我的运气么？"
 POD_canon_artifacts.400.t: "安卡拉石棺"
 POD_canon_artifacts.400.desc: "这石棺中有一些可怕的东西，而且你不是唯一感觉到它的人。许多吸血鬼，甚至是其他生物，都已经死于试图得到它，这使它的名声越来越大。石棺上的表面壁画描绘了一位拿碗喝血的人物，暗示了某种形式的吸血鬼行为。\n最令人遐想的传言是，里面安放着一位上古耆宿，承诺为打开它的人提供永恒的力量或诅咒。这件艺术品本身已经很有用了，因为它可以方便地分散你的对手的注意力，但发现其秘密的诱惑力仍然存在。你会为了潜在的更大的回报而勇敢面对巨大的潜在危险吗？"
 POD_canon_artifacts.400.a: "开启它！"
 POD_canon_artifacts.400.b: "不开启它！"
 ankaran_sarcophagus_warning: "这条路径——显然——相当危险……"
 POD_canon_artifacts.401.t: "安卡拉石棺（二）"
 POD_canon_artifacts.401.desc: "好吧，反转了。\n尽管这个石棺周围有很多神秘的气息，但事实证明，里面只有一具平凡的木乃伊，尽管保存得很好。可能是某位凡人国王吧，但对你来说没什么重要的。尽管有此遗憾，但由于没有人知道真相，它仍然对你有用。你可以用石棺困住你的领地里的粗心小偷，或者把观看石棺的权利卖给好奇的学者们。或者更大胆一些，把它的真相说出来！……当然，只对一些值得信赖的盟友说。你将如何利用这一发现？"
 POD_canon_artifacts.401.a: "仔细研究这木乃伊"
 POD_canon_artifacts.401.b: "放些蛇进去！蛇很有玩"
 POD_canon_artifacts.401.c: "对一些即将蒙恩的“朋友”说实话"
 POD_canon_artifacts.401.d: "计划一场该隐之子式游客诈骗"
 full_blood_decision: "血遗物"
 full_blood_decision_tooltip: "饥渴已是过去"
 full_blood_decision_desc: "你拥有一件无价的宝物，它能够制造足以维持你的不死族之身的血液。有了这个，你就不会再受饥渴了。"
 full_blood_decision_confirm: "血将流淌"
 shemaziel_sarcophagus_decision: "夏孟泽尔石棺"
 shemaziel_sarcophagus_decision_tooltip: "啥在里面？"
 shemaziel_sarcophagus_decision_desc: "一种不祥的预感从这个石棺中散发出来，仿佛有一位古老而不可否认的邪物在里面等待。或者它可能只是一个空盒子。谁知道呢？"
 shemaziel_sarcophagus_decision_effect_tooltip: "你对接下来会发生什么毫无头绪"
 shemaziel_sarcophagus_decision_confirm: "我真想测试我的运气么？"
 POD_canon_artifacts.500.t: "夏孟泽尔石棺"
 POD_canon_artifacts.500.desc: "这石棺中有一些可怕的东西，而且你不是唯一感觉到它的人。许多吸血鬼，甚至是其他生物，都已经死于试图得到它，这使它的名声越来越大。它由一种黑色的石头制成，也许是黑曜石或玛瑙，没有明显的雕刻或迹象表明其来源。\n最富想象力的传言说，里面有一个沉睡的恶魔，甚至是一个充满魔邪恐怖的移动献祭坑堑。你会为了潜在的更大的回报而勇敢面对巨大的潜在危险吗？"
 POD_canon_artifacts.500.a: "开启它！"
 POD_canon_artifacts.500.b: "不开启它！"
 shemaziel_sarcophagus_warning: "这条路径——显然——相当危险……"
 POD_canon_artifacts.501.t: "夏孟泽尔石棺（二）"
 POD_canon_artifacts.501.desc: "嗯，传言是真的。\n石棺里躺着一位字面意义上的地狱大公，正慢慢向你起身。你看到神圣的战场、深渊的监狱和你永远无法理解的实体的图像。你看到你对这个将撕碎你的灵魂以索取你的身体作为宿主的生物来说什么都不是。你的心兽在你的头脑中因恐惧而畏缩，而你却反应迟钝。你能做什么来对付这样一个实体？\n嗯……也许在太晚之前把石棺封回去，然后把它扔进海里，这可能会有用。或者你可以直接接受你的魔邪宿命。"
 POD_canon_artifacts.501.a: "抵抗是徒劳的"
 POD_canon_artifacts.501.b: "滚回去沉眠！"
 oblivionadvanced_decision: "死亡遗物"
 oblivionadvanced_decision_tooltip: "生命与死亡的秘密是你的了"
 oblivionadvanced_decision_desc: "你有一个强大的死灵遗物供你使用。挖掘它的力量会让你对来世的事情有很大的洞察力。"
 oblivionadvanced_decision_confirm: "墓将从我！"
 bloodsorceryadvanced_decision: "魔法遗物"
 bloodsorceryadvanced_decision_tooltip: "血的最深秘密是你的了"
 bloodsorceryadvanced_decision_desc: "你有一个强大的奇术遗物可以使用。挖掘它的力量会让你对血术法的研究有很大的洞察力。"
 bloodsorceryadvanced_decision_confirm: "血腥苏醒"
 auspexadvanced_decision: "洞察遗物"
 auspexadvanced_decision_tooltip: "你将见到一切！"
 auspexadvanced_decision_desc: "你有一个强大的预言遗物可供你使用。挖掘它的力量会让你对观占术$pod_discipline$有更深的了解。"
 auspexadvanced_decision_confirm: "完美感知"
 truefaith_decision: "信仰宝物"
 truefaith_decision_tooltip: "信仰是一件强力的武器"
 truefaith_decision_desc: "你有一件强大的圣物供你使用。挖掘它的力量会让你对信徒的祝福有很大的洞察力。"
 truefaith_decision_confirm: "蒙福于神圣"
 obfuscate_decision: "暗影宝物"
 obfuscate_decision_tooltip: "我等潜入黑暗"
 obfuscate_decision_desc: "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的混淆术$pod_discipline$有更深的了解。"
 obfuscate_decision_confirm: "太多可藏……"
 auspex_decision: "洞察宝物"
 auspex_decision_tooltip: "你将见到一切"
 auspex_decision_desc: "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的观占术$pod_discipline$有更深的了解。"
 auspex_decision_confirm: "强力感知"
 dominate_decision: "支配宝物"
 dominate_decision_tooltip: "终于，他们将听话了"
 dominate_decision_desc: "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的支配术$pod_discipline$有更深的了解。"
 dominate_decision_confirm: "其等将服从"
 obtenebration_decision: "深渊宝物"
 obtenebration_decision_tooltip: "若要注视深渊……"
 obtenebration_decision_desc: "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的幽暗术$pod_discipline$有更深的了解。"
 obtenebration_decision_confirm: "还有这么多可学"
 gaffari_scrolls_decision: "加法里卷轴"
 gaffari_scrolls_decision_tooltip: "有趣的过目"
 gaffari_scrolls_decision_desc: "鹰巢中的阴谋的证据，哈基姆圣裔的领导层很想得到这个东西……阴谋家也是。"
 gaffari_scrolls_decision_effect_tooltip: "你会用这些卷轴为你带来好处，不管是哪种方式"
 gaffari_scrolls_decision_confirm: "让我们想想……"
 POD_canon_artifacts.600.t: "加法里卷轴"
 POD_canon_artifacts.600.desc: "这些卷轴揭示了哈基姆圣裔氏族内部存在一个巨大的阴谋，旨在将他们从“软弱的新宗教”中清除出去，并为一位不知名的“黑牧人”的归来铺平道路。\n显然，他们对阿刹迈的领导层具有极大的重要性，他们已经寻找了一段时间了。但是它们也会引起阴谋家本身的兴趣，他们可能会为了取回它们而付出很不错的代价……"
 POD_canon_artifacts.600.a: "把它们卖给阴谋家"
 POD_canon_artifacts.600.b: "向最长者揭露阴谋"
 POD_canon_artifacts.600.c: "我大概会用它们来实现我自己的野心……"
 animalismadvanced_decision: "蛮荒遗物"
 animalismadvanced_decision_tooltip: "我将于自然合一。"
 animalismadvanced_decision_desc: "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的兽性术$pod_discipline$有更深的了解。"
 animalismadvanced_decision_confirm: "变形大师"
 POD_inquihunt_truecross_tt: "因为你持有真十字，你将在事件期间获得强力的勇武加成。"
 shemaziel_reborn_modifier: "夏孟泽尔再世"
 shemaziel_reborn_modifier_desc: "骄傲之大公、虚荣之先知、傲慢与蔑视的大司祭——夏孟泽尔万岁！"
 grail_ashes_decision: "怨烬之杯"
 grail_ashes_decision_tooltip: "小小一口？"
 grail_ashes_decision_desc: "据说圣杯可以给予心地纯洁的人神奇的力量。你有这资格吗？"
 grail_ashes_decision_effect_tooltip: "你将饮用圣杯内的液体。谁知道会发生什么？"
 grail_ashes_decision_confirm: "天国之味？"
 POD_canon_artifacts.700.t: "望杯者之勇"
 POD_canon_artifacts.700.desc: "圣杯，即怨烬之杯，在该隐之子和凡人中都是一个传奇。它能给予你什么神奇力量？只有喝下才能知道。\n当你能喝下第一口时，你发现你的思想在漂移，并觉得自己像是被用外语说话的蒙面人包围。他们迅速冲向你，拔出了剑。\n而且，不知何故，你能感觉到他们在你周围存在，好像他们就在这里……"
 POD_canon_artifacts.700.a: "我不惧任何人或鬼！"
 POD_canon_artifacts.700.effect.success.desc: "胜利，你继续你的饮用。"
 POD_canon_artifacts.700.critical.failure.effect.desc: "失败，你在被击杀前放回了圣杯。"
 POD_canon_artifacts.701.t: "望杯者之魂"
 POD_canon_artifacts.701.desc: "试炼失败者的幽灵已经消失，第一口圣液在你的舌头上跳舞。虽然你已经能感觉到这个遗物的力量，但如果你要完全释放它，你还需要更多。\n继续喝，你发现自己再次飘飘然，这次是唤起你的灵魂每次被冷酷或自私的行为所玷污的时刻。圣杯似乎不轻易为恶棍服务。"
 POD_canon_artifacts.701.a: "我够资格！"
 drink_grail_tt: "你的灵魂和你的个性正在接受考验。"
 POD_canon_artifacts.702.t: "望杯者之魔"
 POD_canon_artifacts.702.desc: "在你征服圣杯的努力中，最后的障碍似乎是……你。你面对的是你自己的怪异镜像，且比平日更野蛮，它向你咬牙切齿，似乎在威胁你不准喝这口。\n心兽，这只存在于每位该隐之子灵魂中的邪恶诅咒，正因你这受诅的身体中突然闯入的神圣而感到受威胁。它不会在没有可怕的精神决斗的情况下倒下，已经试图对你进行控制。"
 POD_canon_artifacts.702.a: "由我掌权！"
 drink_grail_tt2: "你的心兽比你的意志更强？"
 POD_canon_artifacts.703.t: "圣杯骑士的觉醒"
 POD_canon_artifacts.703.desc: "成了。你向圣杯证明了你的勇敢、你的灵魂和你的意志，你现在可以自由饮用。尽管如此，即使取得了这些胜利，也会有很大的伤害，因为圣杯从根本上改变了你是谁。\n即使这个强大的遗物也不足以真正克服上帝对该隐的诅咒，但它仍然是一个深刻的、奇迹般的变化。你现在不仅仅只是吸血鬼了，[AddTextIf( PlayerHasBeast, '当你体内的心兽发出它最后的、垂死的嚎叫时，' )]你身上散发着神圣的能量。"
 POD_canon_artifacts.703.a: "终来的救赎？"
 drink_grail_tt3: "作为[GetTrait('POD_grail_knight').GetName(GetPlayer)]你获得：\n$BULLET_WITH_TAB$你拥有无限血液。\n$BULLET_WITH_TAB$你不会再血狂\n$BULLET_WITH_TAB$你（通过凡人）制造的血仆的属性变得更强。\n$BULLET_WITH_TAB$允许招募[GetMaA('order_bitter_ashes_maa').GetName]作为兵士。"
 drink_grail_tt4: "作为[GetTrait('POD_grail_knight').GetName(GetPlayer)]，你的血仆比其他更强，因为他们分享了你的一点圣血。"
 POD_canon_artifacts.704.t: "不够格的望杯者"
 POD_canon_artifacts.704.desc: "圣杯的行事是神秘的。当你忍受着喝下圣物的可怕痛苦时，液体突然变成了灰烬，就像上帝对该隐的诅咒。当心兽看到你的失败而大笑时，你猛地将象征着你的耻辱的高脚杯扔掉。\n很难说在一段时间内再次尝试这个仪式是否会导致不同的结果。你可以以后再试，但那时圣杯将不得不安在这里，提醒大家你不光彩的失败。"
 POD_canon_artifacts.704.a: "把这个小玩意扔到海里去吧！"
 POD_canon_artifacts.704.b: "总有一晚，我能做到。"
 full_glamour_decision: "玫瑰"
 full_glamour_decision_desc: "玫瑰一直保持着纯洁和活力，同时使它的持有者不需要乱梦就能维持梦华。持有玫瑰的妖精能直接从它身上汲取梦华。"
 full_glamour_decision_tooltip: "乱梦已是过去"
 full_glamour_decision_confirm: "吸取梦华"
 baizetu_decision: "白泽图"
 baizetu_decision_tooltip: "斩妖除魔的终极指南？"
 baizetu_decision_desc: "据传，白泽图是由黄帝本人撰写的，几个世纪以来它已经变得支离破碎，但仍有可能重新拼凑。"
 baizetu_decision_confirm: "读书时间到"
 baizetu_decision_custom: "你需要具有五份白泽图碎片"
 artifact_baizetu_name: "白泽图"
 artifact_baizetu_description: "一本传说中的宝图，其作者不是别人，正是神一样的黄帝，据说它包含了所有11520种超自然生物的秘密。\n有了完整的书，人们就会知道他们的敌人的每一个力量和弱点，有了这智慧，其将变得战无不胜。\n现实要复杂得多，这本巨著很难破译，而且充满了误导，尽管对有心和耐心的读者来说仍然非常有用。"
 spear_orthia_decision: "重塑碎矛"
 spear_orthia_decision_tooltip: "重新锻造勇敢的象征？"
 spear_orthia_decision_desc: "阿尔忒弥斯·欧西雅的长矛在她勇敢地攻击迦太基城墙时碎裂了。在一位熟练的超自然铁匠的帮助下，它可以被重新铸造。"
 spear_orthia_decision_confirm: "传说中的武器！"
 shattered_spear_decision_custom: "[TARGET_CHARACTER.GetFirstName]必须是你的[friend|E]、[coterie|E]成员或[soulmate|E]"
 artifact_spear_orthia_name: "阿尔忒弥斯·欧西雅之矛"
 artifact_spear_orthia_description: "一件曾由一位传奇战士挥舞的传奇武器。阿尔忒弥斯·欧西雅，据说是梵卓本人的心腹，像斯巴达女神一样勇敢地冲向迦太基的疯狂。虽然她的长矛在战斗中碎裂了，但现在已经被重新锻造回以前的辉煌。"
 truth_saulot_decision_tt: "你将破译贾瓦尼尔的日记和石碑，然后决定如何处理它们。"
 truth_saulot_decision: "关于扫罗的真相？"
 truth_saulot_decision_tooltip: "从这本神秘的日记中可以了解到什么？"
 truth_saulot_decision_desc: "你发现的日记似乎是由一位萨洛比吸血鬼写的。它是加密的，如果你想阅读它的内容，你需要用一个特定的密钥来破译它。"
 truth_saulot_decision_confirm: "让我们开始阅读"
 POD_canon_artifacts.800.t: "关于扫罗的真相？"
 POD_canon_artifacts.800.desc: "你终于解开了贾瓦尼尔的日记，其内容是……令人不安的。\n贾瓦尼尔是活跃在很久以前的萨洛比，在巴力大战期间是扫罗和萨麦尔的伙伴。他对这些事件的描述将扫罗描绘成一个冷酷无情，甚至是彻头彻尾的邪恶，是创造崇魔巴力的幕后策划者，与他作为圣人导师的形象相去甚远。你手中的象牙碑板也证实了这一事实，声称扫罗已经准备好烧毁整个世界，如果这意味着在“下一轮回”中统治它的话。\n贾瓦尼尔早就死了，显然是被扫罗本人杀死的，以掩盖真相，所以你是唯一一个有具体证据证明这位受敬的上古耆宿鲜为人知的一面的人。如果你揭示了它，萨洛比氏族将被动摇，他们的敌人也会胆战心惊。"
 POD_canon_artifacts.800.a: "除了学术上的追求，吸血鬼的遗物对我没有什么用处。"
 POD_canon_artifacts.800.b: "世界必须知道真相！"
 POD_canon_artifacts.800.custom: "萨洛比将失去大量的威望并获得大量的压力。\n睿魔尔将获得一定威望，同时失去一定压力。"
 POD_canon_artifacts.800.c: "我将销毁这本日记，把真相留给自己。"
 POD_canon_artifacts.800.d: "谎言！谎言！"
 samiel_code_decision: "重组萨麦尔圣书"
 samiel_code_decision_tooltip: "萨麦尔的遗产，勉强残存。"
 samiel_code_decision_desc: "唯一幸存下来的萨麦尔圣书副本在睿魔尔早期崛起时被分成了两部分。找到并合并这两部分将使其恢复完整时期的荣耀。对萨洛比来说，这是一个微小但很值的胜利。"
 samiel_code_decision_confirm: "萨麦尔的遗产永存"
 codex_mortis_decision: "死灵抄本"
 codex_mortis_decision_tooltip: "死亡的秘密触手可及。"
 codex_mortis_decision_desc: "一本由各种羊皮纸组成的大书，显然记载着亡灵术的秘密。在说服或胁迫它的幽灵看守蒂蒂亚·赛比娜帮忙之前，似乎什么都无法读懂。"
 codex_mortis_decision_confirm: "死灵，听我说！"
 codex_mortis_decision_tt: "你将尝试说服蒂蒂亚·赛比娜退下，以便能让你了解书中的秘密。"
 POD_canon_artifacts.900.desc: "一些研究证实，你手中的这本书包含了乔凡努斯家族的秘密死灵知识，也就是现在最常称的乔凡尼家族。这本手抄本是早在他们变成吸血鬼之前就由他们家族的一个叛逆成员制作的，从那时起就一直由他保管，主要是为了报复夺走他一切的家族。\n这个名叫奥勒留·弗拉维乌斯·约维安的男人，将他被杀害的妻子蒂蒂亚·赛比娜的灵魂与这本书绑定在一起，试图拯救她，同时也为这本手抄本创造强大的守护者。这一努力得到了很好的回报，你确信，没有蒂蒂亚的同意，你无法访问书中的内容。\n直接冲突是不明智的，因为你发现蒂蒂亚在这个世界上有数个[Fetters|E]，所以如果你试图对她采取敌对行动，她很容易就会毁掉这本书。高明的外交似乎是唯一的出路。"
 POD_canon_artifacts.900.a: "它为什么在发出红光？"
 codex_mortis_kill_tt: "蒂蒂亚知道你杀了她心爱的奥勒留。为了复仇，她毁掉了这本书。"
 POD_canon_artifacts.900.b: "奥勒留可以为我美言几句！"
 codex_mortis_friend_tt: "你和她心爱的奥勒留关系很好。因此，蒂蒂亚不做阻挠地打开了这本书。"
 POD_canon_artifacts.900.custom: "萨洛比将失去大量的威望并获得大量的压力。\n睿魔尔将获得一定威望，同时失去一定压力。"
 POD_canon_artifacts.900.c: "我可以说服一位死灵。大概。"
 POD_canon_artifacts.900.effect.success.desc: "蒂蒂亚翻开书！"
 POD_canon_artifacts.900.critical.failure.effect.desc: "蒂蒂亚拒绝打开书。"
 codex_mortis_fail_tt: "抄本拒绝了你，留给你一本无用的空白书。"
 tapestry_of_fate_decision: "命运织锦"
 tapestry_of_fate_decision_tooltip: "无尽的知识！"
 tapestry_of_fate_decision_desc: "命运织锦存有所有[Glossary('真名','podgloss.truename')]。它值得被研究。"
 tapestry_of_fate_decision_effect_tooltip: "你将能从织锦中学到新[Glossary('真名','podgloss.truename')]。"
 tapestry_of_fate_decision_confirm: "新真名！"
 POD_canon_artifacts.1000.t: "阅读命运织锦"
 POD_canon_artifacts.1000.desc: "命运织锦包含了所有存在的[Glossary('真名','podgloss.truename')]，以及[UmbraGlossary('dreaming')]的命运。它实际上没有你担心的那么难懂，但学习这些真名仍需要你付出一些努力。\n你认为一次只学习一种概念比较明智，这样可以避免信息过载带来的潜在危险。今天你的重点是哪个？"
 POD_canon_artifacts.1000.k: "时机还不成熟"
 murder_prevented_tf_tt: "目标受到真信的庇佑"
 incunabulum_kupalam_decision: "库帕拉摇篮本"
 incunabulum_kupalam_decision_tooltip: "特兰西瓦尼亚之下的恶魔的故事一部分。"
 incunabulum_kupalam_decision_desc: "许多人都试图整理他们所知道的有关特兰西瓦尼亚的魔主库帕拉的知识。如果能将这些知识汇编成册，也许就能最终了解部分真相。"
 incunabulum_kupalam_decision_confirm: "最终答案是什么？"
 incunabulum_kupalam_decision_custom: "你需要找到至少5本库帕拉条约宝物才能将这部典籍编纂成册。"
 broken_blade_michael_decision: "重铸米迦勒的锋刃"
 broken_blade_michael_decision_tooltip: "重新锻造勇敢的象征？"
 broken_blade_michael_decision_desc: "断裂的米迦勒之刃是爱与恨、神性与魔性的象征，它具有多重意义。然而，现在的断刃不过是一块名贵的金属。"
 broken_blade_michael_decision_confirm: "传奇武器，重回世界。"
 artifact_blade_michael_name: "米迦勒的锋刃"
 artifact_blade_michael_description: "这把古老的刀刃是早在米海尔成为米迦勒之前所持有的。它曾被一个来自埃布拉城的女孩用来自杀，因为她永生的爱人没有来拯救他们。几个世纪后，这女孩找回了这把刀刃，她现在已经永生，并对抛弃她的人充满了魔化般的仇恨。\n最后，在1204年，这把刀刃回到了它最初的主人手中，而它的毁灭则因曾是埃布拉城小女孩的那人的第二次也是最后一次复仇行动。\n现在，它已被重新锻造，恢复了昔日的光彩，但真正了解它的人仍能感受到它动荡的过去。"
 akhu_decision: "咒术血术法"
 akhu_decision_tooltip: "蛇之法"
 akhu_decision_desc: "咒术虽然是少数几个了解它的赛特信徒严守的秘密，但在漫长的岁月中已被多次编纂。你可以使用你的宝物启始了解它的旅程。"
 akhu_decision_effect_tooltip: "你现在将能在咒术血术法生活方式树点选技能。"
 akhu_decision_confirm: "埃及之秘"
 POD_canon_artifacts.1000.personality: "特质"
 POD_canon_artifacts.1000.education: "教育"
 POD_canon_artifacts.1000.commander: "将领"
 POD_canon_artifacts.1000.lifestyle: "生活方式"
 POD_canon_artifacts.1000.fame: "名望"
 POD_canon_artifacts.1000.stress: "压力"
 POD_canon_artifacts.1000.health: "健康"
 POD_canon_artifacts.1000.physical: "身体"
 POD_canon_artifacts.1011.t: "$learning_true_names_head$新真名已发现"
 POD_canon_artifacts.1011.desc: "你成功的学习关于[trait.GetName( GetPlayer.Self )]的[Glossary('真名','podgloss.truename')]，现在你可以使用它用于命名魔咒。"
 POD_canon_artifacts.1011.a: "这需要时间和投入。"
 POD_canon_artifacts.1012.t: "$learning_true_names_head$无真名可发现"
 POD_canon_artifacts.1012.desc: "你已经发现了该类所有你可以利用的[Glossary('真名','podgloss.truename')]。"
 POD_canon_artifacts.1012.a: "我现在需要休息。"
 POD_canon_artifacts.1020.t: "夜龙"
 POD_canon_artifacts.1020.desc: "你知道那些故事。 你手中的武器或许是世上最臭名昭著的一柄刀。很久以前，宗匠刀匠 原次郎勇 的技艺无人能及，甚至连诸神也曾索求他的刀。最初他感到荣幸，但随着神灵们琐碎的要求不断妨碍他的创作，他渐渐心生厌倦，最终决定将他最好的刀留给自己——辰子·小夜。\n在力量的醉意中，他向灵界宣战，由此开启了长达四千夜无尽悲哀的战争。原次郎的屠戮之惨烈，甚至令一向分崩离析的灵界势力罕见地团结一心，并派出了他们的斗士——石太郎前去阻止他。二人在决战中同归于尽，而那柄刀也随之失落。\n\n然则，刀匠的故事并未就此落幕。他以怨灵之身归来，被玉之冥府的帝王胁迫，再度寻觅此刀。作为复起之魂，原次郎踏返尘世，然最终亦在新一轮的合力阻截下再度败亡。世人以为，这便是终结……殊不知，这仅是序曲。\n\n原次郎将灵魂的一部分封印于辰子·小夜之中，以此作为最后的算计。那残魂静伫于刀锋之间，伺机择主。它以无与伦比的力量诱惑历代持有者，随后审视、试探，决定是予以附体——抑或“弃绝”那些不配者。\n\n毋庸置疑，若你执意继续持有此太刀，你所面对的，绝非荣光，而是步入死亡与附身之间的险境。"
 POD_canon_artifacts.1020.b: "不过是传说……对吧？"
 POD_canon_artifacts.1021.t: "不配"
 POD_canon_artifacts.1021.desc: "自你选择将辰子·小夜留在身边以来，它赐予你无穷的力量。然则，你始终能感受到，刀中之魂……因你缺乏野心而愈加不满。毕竟，它曾经属于那位敢于抗衡诸神界域的叛逆之人。\n在一场鏖战之后，你忽然觉察到，这柄刀拒绝再归鞘……更确切地说，它正试图将刀鞘化作你的躯干。正如传说所述，凡是不被认可者，必将被此太刀弃绝。\n\n传闻它昔日的持有者中，亦有人寻得秘仪与祭法，以强行将己意志烙印其上，从而逃避这阴冷的命运。至于你……但愿你所知的仪式与准备，足以支撑到最后一刻。"
 POD_canon_artifacts.1021.a: "此处由我掌管！"
 POD_canon_artifacts.1021.b: "弃刀吧"
 POD_canon_artifacts.1021.effect.success.desc: "你夺得了刀的控制权"
 POD_canon_artifacts.1021.critical.failure: "确实不配"
 POD_canon_artifacts.1022.t: "春次郎勇"
 POD_canon_artifacts.1022.desc: "你本以为终于彻底掌控了辰子·小夜，然而残酷的真相很快昭然若揭。那柄刀之所以沉寂，只是因为它因你近期展现出的意志力而暂时折服。换言之，你已被判定为值得让铸刀师之魂寄居的容器。\n\n显然，你对此毫无选择。\n\n骤然间，你被拖入 阴界，面对太刀的真命——原次郎勇的怨灵。若你能在此役中胜出，他的魂魄将被彻底净逐，永不再栖于此刀。若你败北……那么，你的肉身将成为这位复仇刀匠的完美依凭\n是时候考验你的胆魄了，对抗那位昔日震撼苍穹的存在。\n\n压力，全在你身上”？"
 POD_canon_artifacts.1022.a: "我悔不当初。"
 POD_canon_artifacts.1022.effect.success.desc: "一场胜利"
 POD_canon_artifacts.1022.critical.failure.effect.desc: "一场胜利！但与你无关。"
 POD_canon_artifacts.1023.t: "降龙"
 POD_canon_artifacts.1023.desc: "随着春次的怨灵在你面前消散，你终于能感受到这把太刀从其铸造者入侵性的灵魂中获得了自由。\n不再有意外的惊扰，不再有支配的企图——你成功战胜了夜龙那恶名昭彰的诅咒。如今，你可以尽情享受胜利的果实：世间最强大的武器之一已归你掌控，而驯服它的荣耀，也将永远属于你。"
 POD_canon_artifacts.1023.a: "#italic 收刀入鞘，行云流水#!"
 POD_canon_artifacts.1024.t: "恭迎主上归来"
 POD_canon_artifacts.1024.desc: "当那个试图驯服夜龙的蠢货缓缓倒在你脚下奄奄一息时，你思忖着这把武士刀是否为你选对了新宿主。是否该直接了结这个废物，另寻更合适的躯壳？\n不，你在刀中蛰伏的岁月已太过漫长，短期内恐怕难遇良机。这个蠢货足以支撑你重获新生。\n\n是的，他们很合适……"
 POD_canon_artifacts.1024.a: "我的战争尚未结束。"
 nick_vengeful_spectre: "复仇怨灵"
 nick_vengeful_spectre_desc: "即便是死亡，也不过是令诸天垂泪之人的一时挫败。"
 Isamu_Harujiro: "春次郎勇"
 isamu_modifier: "悲恸使者"
 isamu_modifier_desc: "世人皆知你与天下为敌。但这又如何？佐夜龙子之渴，永无止息。"
 sword_of_fever_decision: "拔出瘟疫之剑"
 sword_of_fever_decision_tooltip: "如此多的死亡……"
 sword_of_fever_decision_desc: "瘟疫之剑镇压着整个恩托班的疫病诸灵。只要以极端的谨慎，将它从剑鞘中抽出一指之宽，便可将疾病施加于你的敌人。然而，一旦将其完全出鞘，便会把一场可怖而毁灭性的瘟疫释放到大地之上。"
 sword_of_fever_decision_effect_tooltip: "如果你是如此渴望，你将能够把剑完全拔出。"
 sword_of_fever_decision_confirm: "我心意已决。"
 robe_golden_mandarin_decision: "上官金袍"
 robe_golden_mandarin_decision_tooltip: "金色诅咒"
 robe_golden_mandarin_decision_desc: "甘老千对其珍贵长袍施展的神奇保护法术威力惊人。你是否足够聪明，能找到办法避开这些防护，从而释放出这件杰出神器的全部力量呢？"
 robe_golden_mandarin_decision_confirm: "我的才智无人能及。"
 POD_canon_artifacts.1100.t: "瘟疫之剑"
 POD_canon_artifacts.1100.desc: "你已下定决心，彻底拔出瘟疫之剑，由此释放一场将夺去无数生命的灾厄。无人真正知晓你为何要这样做——或许，连你自己也未必明白。无论原因为何，若你心中仍残存哪怕一丝犹疑，现在就是放弃这一念头的最后机会。"
 POD_canon_artifacts.1100.a: "没错，将其拔出！"
 POD_canon_artifacts.1100.b: "或许这并不是个好主意。"
 sword_of_fever_used_modifier: "拔出瘟疫之剑"
 sword_of_fever_used_modifier_desc: "你出于不明原因释放了一种致命疾病，导致数百万人丧命。"