l_simp_chinese:
 POD_canon_artifacts.100.t:0 "剑在呼唤"
 POD_canon_artifacts.100.desc:0 "你知道那些传言。你携带的武器可能是世界上最臭名昭著的武器。努尔之剑在很久以前被创造出来，作为古代苏美尔的强大恶魔德拉孔斯基的容器。就在他最终被释放到凡间之前，他被一个名叫提亚马特的吸血鬼挫败了，她把他困在自己的身体里，然后把那把被诅咒的剑扔掉了。\n从那时起，它就一直试图与它的主人团聚，而且它的大多数主人都知道，如果他们不服从恶魔的牵引，就会在某一时刻遭遇不幸地死亡……"
 POD_canon_artifacts.100.a:0 "我不会听从一把剑的！"
 POD_canon_artifacts.100.b:0 "……我将响应呼唤"
 sword_of_nul_warning:0 "这条路——很明显的——极度危险……"
 POD_canon_artifacts.101.t:0 "剑在呼唤（二）"
 POD_canon_artifacts.101.desc:0 "当你回应它的牵引时，你很快意识到努尔之剑根本不关心你的安危。它无情地驱使你走向它主人的安息之地，甚至试图让你在白天保持清醒。就这样，你从一个危险走向另一个危险，无论是黑暗的森林、缺血还是在陌生的土地上寻找休息地的麻烦。\n按照这种速度，你将加入一长串的持剑者伤亡名单，你需要放慢脚步，在为时已晚之前计划好行动方案。"
 POD_canon_artifacts.101.a:0 "让我准备一名向导……"
 POD_canon_artifacts.101.b:0 "花钱雇来向导和强大的武装护卫！"
 POD_canon_artifacts.101.effect.success.desc:0 "避过危险"
 POD_canon_artifacts.101.critical.failure.effect.desc:0 "有一名死于剑的受害者……"
 POD_canon_artifacts.101.critical.failure:0 "又一咬……"
 POD_canon_artifacts.102.t:0 "剑在呼唤（三）"
 POD_canon_artifacts.102.desc:0 "你终于接近了德拉孔斯基的休息地，你几乎能感觉到努尔之剑充满了期待。不过有一个小问题，这只恶魔正躺在一个充满陷阱的迷宫里，以阻止任何不受欢迎的入侵者。\n显然，你有这把剑，所以你可以“跟随”它的脚步，避开里面的大部分危险。但总是有转错弯的风险……不过现在不能回头，因为你几乎可以肯定，如果你在这个时候退后一步，剑就会攻击你。"
 POD_canon_artifacts.102.a:0 "小心，小心……"
 POD_canon_artifacts.102.effect.success.desc:0 "成了！"
 POD_canon_artifacts.102.critical.failure.effect.desc:0 "这石头在这里干嘛？"
 POD_canon_artifacts.102.critical.failure:0 "受石而死"
 drakonskyr_reborn_modifier:0 "德拉孔斯基再世"
 drakonskyr_reborn_modifier_desc:0 "长久之后，你终于获得了自由。世界将颤抖，之后将鞠躬。向地狱的战争之主致敬！"
 POD_canon_artifacts.103.t:0 "剑在呼唤（四）"
 POD_canon_artifacts.103.desc:0 "成了，你终于站在了提亚马特–德拉孔斯基的面前。恶魔已从沉睡中醒来，他忠实的剑警告了你的到来。这名地狱领主很温和，感谢你解救了他，并承诺为你的帮助提供丰富的回报。\n你很快评估到，现在抵抗他已经太晚了，因为有努尔之剑在他身边，他对你而言已经过于强大了，所以你考虑了下能做的选择。\n一方面，德拉孔斯基提出将这个坟墓中的宝藏交给你，并让你保留这把剑，显然他已经从里面提取了他的精华。另一方面，这个恶魔试图用成为他的新宿主的可能性来诱惑你，并承诺如果你们两个人“一起合作”，就将会有永恒的力量。"
 POD_canon_artifacts.103.a:0 "哦不！"
 POD_canon_artifacts.103.b:0 "哦耶！"
 drakonskyr_free:0 "恭喜，你释放了一名地狱领主。至少努尔之剑现在会对你忠心耿耿。"
 tablet_of_destiny_decision:0 "命运石板"
 tablet_of_destiny_decision_tooltip:1 "无尽的知识！"
 tablet_of_destiny_decision_desc:0 "命运石板具有以诺对所有血之力量的了解。很值得研究。"
 tablet_of_destiny_decision_effect_tooltip:1 "你将能从石板中学到新律能"
 tablet_of_destiny_decision_confirm:0 "新的力量！"
 POD_canon_artifacts.200.t:0 "解读命运石板"
 POD_canon_artifacts.200.desc:0 "命运石板是原始律能的蓝图，也许是由该隐本人编纂的。它实际上没有你担心的那么难理解，但练习释放你血之力量所需的仪式仍然需要你付出一些努力。\n你认为明智的做法是一次学习一门律能，以避免潜在的信息过载危险。今夜你将专注于哪一门？"
 POD_canon_artifacts.200.option.a:0 "支配术"
 POD_canon_artifacts.200.option.b:0 "兽性术"
 POD_canon_artifacts.200.option.c:0 "观占术"
 POD_canon_artifacts.200.option.d:0 "迅捷术"
 POD_canon_artifacts.200.option.e:0 "混淆术"
 POD_canon_artifacts.200.option.f:0 "蛮力术"
 POD_canon_artifacts.200.option.g:0 "威仪术"
 POD_canon_artifacts.200.option.h:0 "变形术"
 POD_canon_artifacts.200.option.i:0 "血术法"
 POD_canon_artifacts.200.option.j:0 "坚韧术"
 POD_canon_artifacts.200.option.k:0 "幽暗术"
 POD_canon_artifacts.200.option.l:0 "时机还不成熟"
 eye_of_hazimel_decision:0 "哈济梅尔之眼"
 eye_of_hazimel_decision_tooltip:1 "它在看着你……"
 eye_of_hazimel_decision_desc:0 "哈济梅尔之眼是一个邪恶的遗物，如果不小心处理，就会夺走思想和灵魂。到目前为止，你一直很谨慎，将眼球封装在一个盒子里，但这也使你无法利用它的真正力量。"
 eye_of_hazimel_decision_effect_tooltip:1 "你将尝试释放眼球的全部力量……并不让自己消失"
 eye_of_hazimel_decision_confirm:0 "让我想想"
 POD_canon_artifacts.300.t:0 "植入眼球"
 POD_canon_artifacts.300.desc:0 "哈济梅尔之眼是一个来历不明的邪恶遗物，众所周知，它能赋予任何用它取代自己眼睛的人强大的力量，但也会带来巨大的精神损伤。有些人在它所提供的疯狂幻象中迷失了自己，而这只眼睛本身似乎也乐于把它的宿主变成它腐化意志的延伸。\n到目前为止，你已经抵制了它的呼唤，让它安全地封装在一个密封的盒子里，但诱惑是永远存在的。也许你足够强大，可以驾驭它的力量而不失去自己……或者，这种傲慢的感觉是眼睛为引诱你而投射的错觉。"
 POD_canon_artifacts.300.a:0 "我比这玩意更强！"
 POD_canon_artifacts.300.b:0 "让我们关着盒子吧"
 eye_of_hazimel_warning:0 "这条路——很明显的——极度危险……"
 POD_canon_artifacts.301.t:0 "植入眼球（二）"
 POD_canon_artifacts.301.desc:0 "你把自己的眼睛扯出来，打开密封的盒子，可怕地看到哈济梅尔之眼跳到了你的眼窝里去植入自己。这种感觉让人困惑。这并不完全是痛苦，因为你已经远远超越了这种琐碎的事，但突然涌入你的大量图像和记忆是压倒性的。你看到文明的兴起和衰落，看到比你年长的该隐之子在无休止的战争中相互争斗……而在这期间，眼睛在你呆滞的身体里伸展它的卷须，试图在你分心的时候接管。\n你很快意识到这一点，有了机会进行反击，但当眼睛看到你还没有放弃时，它对你的思想的攻击增加了十倍……"
 POD_canon_artifacts.301.a:0 "抵抗！"
 POD_canon_artifacts.301.effect.success.desc:0 "我能做到！"
 POD_canon_artifacts.301.critical.failure.effect.desc:0 "好多奇妙可看……"
 eye_of_hazimel_tamed_modifier:0 "受控的哈济梅尔之眼"
 eye_of_hazimel_tamed_modifier_desc:0 "眼球已经承认你是一个有价值的宿主，并没有试图接管你。目前而言。"
 POD_canon_artifacts.302.t:0 "哈济梅尔之眼（二）"
 POD_canon_artifacts.302.desc:0 "你比单纯的血肉遗物更强大，即使是像哈济梅尔之眼这样的恶毒遗物。慢慢地，一块一块地，你抵抗着你脑海中的腐化影响，取回了意识。那只眼睛还尝试了一些其他的把戏，从恶梦幻觉到基本的身体疼痛，但你坚强地站了起来。\n疲惫不堪，或者也许只是被你的复原力所打动，宝物已经停止了对你的反击，现在似乎满足于作为你自己的眼睛。但它仍然是一个有知觉的生命，而且你能感觉到它的力量险些超出你的掌握。一个奇怪的、但非常有利可图的伙伴关系诞生了。"
 POD_canon_artifacts.302.a:0 "我能看到一切！"
 eye_of_hazimel_unleashed_modifier:0 "受释的哈济梅尔之眼"
 eye_of_hazimel_unleashed_modifier_desc:0 "你和眼睛是一体的。除了它在更多时候掌权。"
 POD_canon_artifacts.303.t:0 "哈济梅尔之眼（二）"
 POD_canon_artifacts.303.desc:0 "你已经尽力了。即使在它的胜局中，眼球也承认你是它意志最坚强的宿主之一，并且可以发挥作用。这种浅层次的胜利意味着你仍有一些自由意志，但眼球在它觉得合适时就会接管。而当这种情况发生时，对你周围的人来说总是不愉快的。\n当然，你比以前更强大、更有威慑力，但代价也很高。好的是，你没有处于一个可以思考这是否值得的状态。"
 POD_canon_artifacts.303.a:0 "我们能看到一切！"
 ankaran_sarcophagus_decision:0 "安卡拉石棺"
 ankaran_sarcophagus_decision_tooltip:1 "啥在里面？"
 ankaran_sarcophagus_decision_desc:0 "一种不祥的预感从这个石棺中散发出来，仿佛有一个古老而不可否认的邪物在里面等待。或者它可能只是一个空盒子。谁知道呢？"
 ankaran_sarcophagus_decision_effect_tooltip:1 "你毫无会发生什么的头绪"
 ankaran_sarcophagus_decision_confirm:0 "我真想测试我的运气么？"
 POD_canon_artifacts.400.t:0 "安卡拉石棺"
 POD_canon_artifacts.400.desc:0 "这石棺中有一些可怕的东西，而且你不是唯一感觉到它的人。许多吸血鬼，甚至是其他生物，都已经死于试图得到它，这使它的名声越来越大。石棺上的表面壁画描绘了一位拿碗喝血的人物，暗示了某种形式的吸血鬼行为。\n最令人遐想的传言是，里面安放着一位上古耆宿，承诺为打开它的人提供永恒的力量或诅咒。这件艺术品本身已经很有用了，因为它可以方便地分散你的对手的注意力，但发现其秘密的诱惑力仍然存在。你会为了潜在的更大的回报而勇敢面对巨大的潜在危险吗？"
 POD_canon_artifacts.400.a:0 "开启它！"
 POD_canon_artifacts.400.b:0 "不开启它！"
 ankaran_sarcophagus_warning:0 "这条路——很明显的——相当危险……"
 POD_canon_artifacts.401.t:0 "安卡拉石棺（二）"
 POD_canon_artifacts.401.desc:0 "好吧，这是个反常现象。\n尽管这个石棺周围有很多神秘的光环，但事实证明，里面只有一具平凡的木乃伊，尽管保存得很好。可能是某位凡人国王，对你来说没有什么重要的。尽管有此遗憾，但由于没有人知道真相，它仍然对你有用。你可以用石棺困住你的领地里给粗心的小偷，或者把看石棺的权利卖给好奇的学者们。或者更大胆一些，把它的真相说出来！……当然，只对一些值得信赖的盟友说。你将如何利用这一发现？"
 POD_canon_artifacts.401.a:0 "仔细研究这木乃伊"
 POD_canon_artifacts.401.b:0 "放蛇进去！蛇很乐"
 POD_canon_artifacts.401.c:0 "对一些即将负债的“朋友”说实话"
 POD_canon_artifacts.401.d:0 "设置一个该隐之子旅者陷阱"
 beatific_decision:0 "圣遗物"
 beatific_decision_tooltip:1 "唾手可得的神圣赠礼"
 beatific_decision_desc:0 "你拥有信仰中最神圣的遗物之一任你处置。它的灵光闪耀，赋予你非凡的力量。"
 beatific_decision_confirm:0 "神圣赠礼，毫无疑问"
 full_blood_decision:0 "血遗物"
 full_blood_decision_tooltip:1 "饥渴已是过去"
 full_blood_decision_desc:0 "你拥有一件无价的宝物，它能够制造足以维持你的不死族之身的血液。有了这个，你就不会再受饥渴了。"
 full_blood_decision_confirm:0 "血将流淌"
 shemaziel_sarcophagus_decision:0 "夏孟泽尔石棺"
 shemaziel_sarcophagus_decision_tooltip:1 "啥在里面？"
 shemaziel_sarcophagus_decision_desc:0 "一种不祥的预感从这个石棺中散发出来，仿佛有一个古老而不可否认的邪物在里面等待。或者它可能只是一个空盒子。谁知道呢？"
 shemaziel_sarcophagus_decision_effect_tooltip:1 "你毫无会发生什么的头绪"
 shemaziel_sarcophagus_decision_confirm:0 "我真想测试我的运气么？"
 POD_canon_artifacts.500.t:0 "夏孟泽尔石棺"
 POD_canon_artifacts.500.desc:0 "这石棺中有一些可怕的东西，而且你不是唯一感觉到它的人。许多吸血鬼，甚至是其他生物，都已经死于试图得到它，这使它的名声越来越大。它由一种黑色的石头制成，也许是黑曜石或玛瑙，没有明显的雕刻或迹象表明其来源。\n最富想象力的传言说，里面有一个沉睡的恶魔，甚至是一个充满地狱恐怖的移动献祭坑堑。你会为了潜在的更大的回报而勇敢面对巨大的潜在危险吗？"
 POD_canon_artifacts.500.a:0 "开启它！"
 POD_canon_artifacts.500.b:0 "不开启它！"
 shemaziel_sarcophagus_warning:0 "这条路——很明显的——极度危险……"
 POD_canon_artifacts.501.t:0 "夏孟泽尔石棺（二）"
 POD_canon_artifacts.501.desc:0 "嗯，传言是真的。\n石棺里躺着一位字面意义上的地狱大公，正慢慢向你起身。你看到神圣的战场、深渊的监狱和你永远无法理解的存在体的图像。你看到你对这个将撕碎你的灵魂以索取你的身体作为宿主的生物来说什么都不是。你的心兽在你的头脑中因恐惧而畏缩，而你却反应迟钝。你能做什么来对付这样一个存在体？\n嗯……也许在太晚之前把石棺封回去，然后把它扔进海里，这可能会有用。或者你可以直接接受你的地狱宿命。"
 POD_canon_artifacts.501.a:0 "抵抗是徒劳的"
 POD_canon_artifacts.501.b:0 "滚回去沉眠！"
 oblivionadvanced_decision:0 "死亡遗物"
 oblivionadvanced_decision_tooltip:1 "生命与死亡的秘密是你的了"
 oblivionadvanced_decision_desc:0 "你有一个强大的死灵遗物供你使用。挖掘它的力量会让你对来世的事情有很大的洞察力。"
 oblivionadvanced_decision_confirm:0 "墓将从我！"
 bloodsorceryadvanced_decision:0 "魔法遗物"
 bloodsorceryadvanced_decision_tooltip:1 "血的最深秘密是你的了"
 bloodsorceryadvanced_decision_desc:0 "你有一个强大的奇术遗物可以使用。挖掘它的力量会让你对血术法的研究有很大的洞察力。"
 bloodsorceryadvanced_decision_confirm:0 "血腥苏醒"
 auspexadvanced_decision:0 "洞察遗物"
 auspexadvanced_decision_tooltip:1 "你将见到一切！"
 auspexadvanced_decision_desc:0 "你有一个强大的预言遗物可供你使用。挖掘它的力量会让你对观占术律能有更深的了解。"
 auspexadvanced_decision_confirm:0 "完美感知"
 truefaith_decision:0 "信仰宝物"
 truefaith_decision_tooltip:1 "信仰是一件强力的武器"
 truefaith_decision_desc:0 "你有一件强大的圣物供你使用。挖掘它的力量会让你对信徒的祝福有很大的洞察力。"
 truefaith_decision_confirm:0 "蒙福于神圣"
 obfuscate_decision:0 "暗影宝物"
 obfuscate_decision_tooltip:1 "我等潜入黑暗"
 obfuscate_decision_desc:0 "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的混淆术律能有更深的了解。"
 obfuscate_decision_confirm:0 "太多可藏……"
 auspex_decision:0 "洞察宝物"
 auspex_decision_tooltip:1 "你将见到一切"
 auspex_decision_desc:0 "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的观占术律能有更深的了解。"
 auspex_decision_confirm:0 "强力感知"
 dominate_decision:0 "支配宝物"
 dominate_decision_tooltip:1 "终于，他们将听话了"
 dominate_decision_desc:0 "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的支配术律能有更深的了解。"
 dominate_decision_confirm:0 "其等将服从"
 obtenebration_decision:0 "深渊宝物"
 obtenebration_decision_tooltip:1 "若要注视深渊……"
 obtenebration_decision_desc:0 "你有一件强大的宝物可以使用。挖掘它的力量会让你对吸血鬼的幽暗术律能有更深的了解。"
 obtenebration_decision_confirm:0 "还有这么多可学"
 gaffari_scrolls_decision:0 "加法里卷轴"
 gaffari_scrolls_decision_tooltip:1 "有趣的过目"
 gaffari_scrolls_decision_desc:0 "鹰巢中的阴谋的证据，哈基姆圣裔的领导层很想得到这个东西……阴谋家也是。"
 gaffari_scrolls_decision_effect_tooltip:1 "你会用这些卷轴为你带来好处，不管是哪种方式"
 gaffari_scrolls_decision_confirm:0 "让我们想想……"
 POD_canon_artifacts.600.t:0 "加法里卷轴"
 POD_canon_artifacts.600.desc:0 "这些卷轴揭示了哈基姆圣裔氏族内部存在一个巨大的阴谋，旨在将他们从“软弱的新宗教”中清除出去，并为一位不知名的“黑牧人”的归来铺平道路。\n显然，他们对阿刹迈的领导层具有极大的重要性，他们已经寻找了一段时间了。但是它们也会引起阴谋家本身的兴趣，他们可能会为了取回它们而付出很不错的代价……"
 POD_canon_artifacts.600.a:0 "把它们卖给阴谋家"
 POD_canon_artifacts.600.b:0 "向最长者揭露阴谋"
 POD_canon_artifacts.600.c:0 "我大概会用它们来实现我自己的野心……"
 animalismadvanced_decision:0 "蛮荒遗物"
 animalismadvanced_decision_tooltip:1 "我将于自然合一。"
