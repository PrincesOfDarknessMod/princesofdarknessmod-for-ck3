l_simp_chinese:
 POD_ashen_prospect.001.t: "邀请灰之适任者"
 POD_ashen_prospect.001.desc: "你在血族和血畜世界中的地位和影响力使你可以为你的宫廷带来潜在的家臣。"
 POD_ashen_prospect.001.option.a: "贵族适任者"
 POD_ashen_prospect.001.option.a.tt: "召来能追随于你的拥有高贵血统的$pod_cainites$"
 POD_ashen_prospect.001.option.b: "骑士适任者"
 POD_ashen_prospect.001.option.b.tt: "号召懂得军事又善于勇武的$pod_cainites$。"
 POD_ashen_prospect.001.option.c: "执事适任者"
 POD_ashen_prospect.001.option.c.tt: "以财富和地位的承诺吸引管家和执事到你的宫廷。"
 POD_ashen_prospect.001.option.d: "盗贼适任者"
 POD_ashen_prospect.001.option.d.tt: "邀请那些善于潜行又忽视亲王权威的$pod_cainites$"
 POD_ashen_prospect.001.option.e: "密教适任者"
 POD_ashen_prospect.001.option.e.tt: "接触那些在密教中控制凡人的雄心勃勃的$pod_cainites$"
 POD_ashen_prospect.101.t: "召唤得到了回应！"
 POD_ashen_prospect.101.desc.noble: "不是所有的贵族都想要地盘；一些人满足于成为权力中心者的心腹。只要你出个价，他们的才华就是你的了。"
 POD_ashen_prospect.101.desc.knight: "人类的战争造就了一个到处都是擅长作战的$pod_cainites$的世界，只要有合适的价格，他们就愿意将剑和忠诚奉献给一位慷慨的亲王。"
 POD_ashen_prospect.101.desc.seneschal: "虽然其等的存货和道具可能与凡人的世界的有所不同，一个明智的$pod_cainite$领主任然重视着是否有一位好执事来管理他们的资产。"
 POD_ashen_prospect.101.desc.thief: "即使是血族也不都能过上体面的生活，当他们被统治者压迫的时候，让他们中的一位为你服务也许会有用"
 POD_ashen_prospect.101.desc.cult: "宗教对凡人非常重要。这就是为什么一些$pod_cainites$戴上神或神仆的面具来操纵血畜成为他们的下仆"
 POD_ashen_prospect.101.option.a: "我选择[prospect_one.GetFirstName]"
 POD_ashen_prospect.101.option.a.tt: "[prospect_one.GetFirstName]加入你的宫廷，[prospect_two.GetFirstName]和[prospect_three.GetFirstName]会被遣散"
 POD_ashen_prospect.101.option.b: "我选择[prospect_two.GetFirstName]"
 POD_ashen_prospect.101.option.b.tt: "[prospect_two.GetFirstName]加入你的宫廷，[prospect_one.GetFirstName]和[prospect_three.GetFirstName]被遣散"
 POD_ashen_prospect.101.option.c: "我选择[prospect_three.GetFirstName]"
 POD_ashen_prospect.101.option.c.tt: "[prospect_three.GetFirstName]加入你的宫廷，[prospect_one.GetFirstName]和[prospect_two.GetFirstName]被遣散"