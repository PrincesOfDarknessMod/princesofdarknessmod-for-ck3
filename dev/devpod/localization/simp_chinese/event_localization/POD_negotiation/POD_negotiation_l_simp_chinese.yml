l_simp_chinese:
 POD_negotiation.4000.t: "堕落猎人"
 POD_negotiation.4000.desc: "到底是什么在驱使着你，贪婪？恐惧？还是对权力的渴望？你或许已经说服了你自己，这违背了自己原则的行为都是为了某种更崇高的目标？\n\n当尘埃落定时，你可能会为自己的决定感到心安理得，但你的同僚$POD_splat_hunter_plural$不会。你堕落的消息会迅速传开。\n\n在利刃出鞘前，你最好迅速做出行动。"
 POD_negotiation.4000.a: "我必须与之前的战友切断联系，并保持低调。"
 POD_negotiation.4000.b: "幸运的是，我的附庸没有一个敢反对我。"
 POD_negotiation.4000.c: "我将完全放弃我的所有财产。"
 POD_negotiation.4000.d: "所以他们想和我战斗？让他们放马过来。"
 POD_negotiation.4010.t: "这个凡人知道的太多了。"
 POD_landed_mortal_warning: "#N;bold 你是一个毫无权力的领主$POD_splat_mortal$与任何现有的派系都没有联系。因此，你不能在你的领地内建造任何建筑。#!"
 POD_negotiation.4010.desc: "你就像一条正在流血的小鱼，正置身于一群嗜血的鲨鱼中。"
 POD_negotiation.4010.desc.diabolist: "你血缚住一个$POD_splat_demon$的事实现在看来并不那么令人印象深刻。你没有盟友，没有收入，也没有影响力。除非你能够找到支持你的人，除了你肩上那愤怒的恶魔。"
 POD_negotiation.4010.desc.exghoul: ""
 POD_negotiation.4010.desc.fallenhunter: "从前，你可以依靠那些同为$POD_splat_hunter_plural$的同僚。但现在这让你感觉到像是活在另一个事件。你孤身一人。并且你太清楚那些潜伏在黑夜里的怪物会对像你这样的累赘做什么。"
 POD_negotiation.4010.desc.mortal: "#italic 出于某种未知的原因#!，你在$pod_wod$持有一些无主的房产。来自冥界的住户认为你的存在是一个错误。他们很快就会纠正它。作为一个没有权力和关系的孤独$POD_splat_mortal$，你对这件事无权干涉。"
 POD_negotiation.4010.desc.end: "这是你最绝望的时刻。你进行了一次深呼吸，然后开始考虑你的选择。"
 POD_negotiation.4010.a: "我唯一能做的事就是跑得远远的。"
 POD_negotiation.4010.b: "我愿意冒这个险。"
 POD_negotiation.4010.b.tt: "除非你能获得某种形式的支持#italic ，非常#!迅速。否则这件事只有一种结局。"
 POD_negotiation.4010.c: "裁判所当然愿意接纳一个新成员。"
 POD_negotiation.4010.d: "我将会加入士。"
 POD_negotiation.4010.e: "我会找到其他想与黑暗作斗争的人。"
 POD_negotiation.4010.f: "吸血鬼会对他们的仆人很好，对吧？"
 POD_negotiation.4010.f.tt: "不，他们不会这么做。"
 POD_negotiation.4010.f.tt2: ""
 POD_negotiation.4010.g: "幸运的是，我有一个可供提取精血的囚犯。"
 POD_negotiation.4010.g.tt: ""
 POD_negotiation.4010.h: "我唯一的选择就是将我的灵魂卖给一个新的主人。"
 POD_negotiation.4010.i: "木乃伊站在正义的一方。"
 POD_negotiation.4010.j: "也许会有一个妖精迷诱我？"
 POD_negotiation.4020.t: "潜渊"
 POD_negotiation.4020.desc: "在某一个夜晚你入睡后，就再也没有醒来。\n\n你无法知道是谁导致了这种平淡无奇的结局。也许是一个隐形的诺斯费拉图在你昏迷时割开了你的喉咙。也许是一个灭世者从远处诅咒了你，认为即兴的残忍行为是喜剧的巅峰。也许完全是另外一个人。如果你还有思考或实验的能力，这会是一个有趣的思想实验。\n\n至少这样，你不会像现在这样，为自己的决定感到后悔。"
 POD_negotiation.4020.a: "我会有一个好生活吗？"
 POD_negotiation.4020.b: "我的生活几乎是最糟糕的。"
 POD_negotiation.4020.c: "我还有一些未竟之事。"