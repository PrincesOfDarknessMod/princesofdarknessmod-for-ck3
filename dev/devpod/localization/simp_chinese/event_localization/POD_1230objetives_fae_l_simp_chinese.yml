 pod1230objectives_fae.11.desc: "$the_middle_way_objective_decision_desc$"
 pod1230objectives_fae.11.a: "$the_middle_way_objective_decision_tooltip$"
 pod1230objectives_fae.15.t: "道德仙道"
 pod1230objectives_fae.15.desc: "通过研究内丹，占据最强大的龙穴，你已达成道德仙道，与天庭再次搭上联系。"
 pod1230objectives_fae.15.a: "我回来了"
 pod1230objectives_fae.30.t: "四季之战：胜利"
 pod1230objectives_fae.30.desc: "四季之战已经结束。既然你是明确的胜者，整个$POD_splat_fae$社会就掌握在你手中。"
 pod1230objectives_fae.30.a: "胜利的味道，确实带着汗水。"
 pod1230objectives_fae.31.t: "四季之战：永恒休战"
 pod1230objectives_fae.31.desc: "四季之战已经结束。所有$POD_splat_fae$终于彼此和平相处。"
 pod1230objectives_fae.31.a: "和平是最佳之选。"
 pod1230objectives_fae.150.t: "桥底王"
 pod1230objectives_fae.150.desc: "我已控制了越来越多的桥梁，扩展了我的桥底界，成为一个强大的王国。我将获得我应得的一切。可怜那些无法支付我通行费的贫穷旅行者。哀怒庭妖精和可怕的怪物聚集在我的旗帜和黑暗洪流之下。"
 pod1230objectives_fae.150.a: "没我允许，任何人都不得过我的桥"
 pod1230objectives_fae.151.t: "桥底至高王"
 pod1230objectives_fae.151.desc: "整个东欧的河流都处于你的控制之下，众多桥梁下的可怕空间成为你的伟大领土。除非得到你的准许，没有人可以在汹涌的水流上行走。所有人都将向你付出应有的代价，而你可以轻松地将由纯粹噩梦构成生物带入这个世界，就像春游散步一般容易。"
 pod1230objectives_fae.151.a: "没我允许，任何人都不得过我的桥"
 pod1230objectives_fae.1100.t: "博尔贝托马古斯已收复！"
 pod1230objectives_fae.1100.desc: "古勃艮第的古都现在是你国度的一部分。"
 pod1230objectives_fae.1100.a: "通往莱茵的道路向我敞开。"
 pod1230objectives_fae.1200.t: "莱茵之王！"
 pod1230objectives_fae.1200.desc: "整条莱茵河现在都在你的控制之下。莱茵黄金肯定会在这条神秘河流的某处发出声音。"
 pod1230objectives_fae.1200.a: "在莱茵河畔成……王，王，王，王！"
 pod1230objectives_fae.1300.t: "莱茵之帝！"
 pod1230objectives_fae.1300.desc: "莱茵河沿岸的每一个公国都在你的掌控之中，莱茵黄金也安全地存放在你的国库中，没有人可以质疑你统治莱茵河的权利。"
 pod1230objectives_fae.1300.a: "莱茵——我的，永远的！"