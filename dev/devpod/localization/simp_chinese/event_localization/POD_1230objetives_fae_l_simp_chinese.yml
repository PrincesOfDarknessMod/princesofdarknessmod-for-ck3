l_simp_chinese:
 pod1230objectives_fae.1.t: "裁判所的终末"
 pod1230objectives_fae.1.desc: "裁判所的建立是散断的顶点，因为教会开始追求从世界上消除所有不受欢迎的超自然元素，包括妖精。但现在它已经结束了。"
 pod1230objectives_fae.1.a: "更多迷信！"
 pod1230objectives_fae.2.t: "君士坦丁派探题"
 pod1230objectives_fae.2.desc: "我们在天上的父，\n愿你的名被尊为圣，\n愿你的国早日降临，\n愿你的旨意成就在地上，如同成就在天上。\n求你赐给我们今天所需要的食物，\n求你宽恕我们的罪，就像我们宽恕得罪我们的人。\n求你不要让我们向试探——大碎溃——屈服，救我们脱离那板讷。\n因为国度、能力、荣耀，都是你的，直到永远。"
 pod1230objectives_fae.2.a: "阿门。"
 pod1230objectives_fae.3.t: "超越理性"
 pod1230objectives_fae.3.desc: "理性之子的阴谋已经瓦解。他们将世界束缚于理性与科学的阴谋已经破产。他们的寒铁工坊已经沉寂。随着睿魔尔被摧毁，他们与赫耳墨斯秘会的魔煞之战以不死族篡位者巫士的失败告终。统一的赫尔墨斯家族能够将全部注意力和愤怒转向石匠兄弟，以及与其志同道合的学者、吝啬鬼、拘谨的信仰者和其他板讷传播者的秘密联盟对迷雾峰的摧毁。不再有“理性”的哲学家，人类已经开始回归他们的古老信仰，并与妖精达成旧约，以理解这个奇幻世界并在其中生存下去。"
 pod1230objectives_fae.3.a: "天地间的万事万物，远非你们的哲学所能想象"
 pod1230objectives_fae.4.t: "鼠族大谋"
 pod1230objectives_fae.4.desc: "卑鄙的鼠族确实酝酿了一个黑暗的计划，他们创造了有史以来最致命的疾病，被称为黑死病。你很高兴你在他们完全释放疾病之前阻止了他们。"
 pod1230objectives_fae.4.a: "肮脏的老鼠。"
 pod1230objectives_fae.5.t: "灾害"
 pod1230objectives_fae.5.desc: "世界上每个人都喜欢猫了，老鼠预言不会实现……但我们可能有另一个问题要处理。"
 pod1230objectives_fae.5.a: "哦，天哪……"
 pod1230objectives_fae.6.t: "阿卡迪亚光复"
 pod1230objectives_fae.6.desc: "Banality problem is solved, and Autumn World is [UmbraGlossary('dreaming')] than ever before. Even [Glossary('Mythic Age','game_concept_mythic_age_desc')]'s Autumn World wasn't soo close, But this state won't last forever. Just like [Glossary('Mythic Age','game_concept_mythic_age_desc')] ended, this era will too.\n\nBut it doesn't have to, Thanks to sheer closeness to [UmbraGlossary('dreaming')], Autumn World needs a slight push to finally merge into Dreaming World where dreams and 'reality' coexist"
 pod1230objectives_fae.6.a: "将梦界与地球合并。"
 pod1230objectives_fae.6.b: "Initiate process, but don't finish it."
 pod1230objectives_fae.6.a.tt: "随着[UmbraGlossary('arcadia')]与地球合并，你的游戏将结束，因为你熟知的世界将被永远改变。"
 pod1230objectives_fae.6.b.tt: "虽未完全完成，[UmbraGlossary('dreaming')]与地球的融合仍使“迟暮期世界”变得如梦似幻，导致任何[bunk|E]必定成功，且梦华每月恢复至上限。"
 pod1230objectives_fae.7.t: "永恒的圣诞老人！"
 pod1230objectives_fae.7.desc: "完成了！无数孩子已经收到了奇魅礼物。无数孩子相信你！他们的梦想使你充满了无尽的梦华！世界可能被血腥的战争、可怕的瘟疫、可怕的裁判和压抑人心的板讷所困扰，但你将永存！\n\n#EMP “在今天，各地方，\n众孩童，高声唱，\n赞美主，世之王，\n降世为怜救我；\n天父将祂赐我。\n\n主耶稣，来世上，\n祂受罚，我得安，\n伯利恒，马槽旁，\n祇有牛马相伴，\n以身为主蔽寒。\n\n有天星，发亮光，\n自东方，领三王，\n屈身跪主牀旁，\n黄金，没药，乳香，\n献给主新生王。\n\n在今天，天使唱，\n各地方，声嘹亮，\n赞美主，天上王，\n降世为怜救我，\n爱与平安赐我。\n\n同来赞美主，同来赞美主，\n在天上，至高处，荣耀归与上主！”#!"
 pod1230objectives_fae.7.a: "呵呵呵！"
 pod1230objectives_fae.8.t: "$elemental_ascension_objective_decision$"
 pod1230objectives_fae.8.desc: "$elemental_ascension_objective_decision_desc$"
 pod1230objectives_fae.8.a: "$elemental_ascension_objective_decision_tooltip$"
