 pod1230objectives_fae.9.a: "$the_peace_of_making_objective_decision_tooltip$"
 pod1230objectives_fae.10.t: "$the_krofted_way_objective_decision$"
 pod1230objectives_fae.10.desc: "$the_krofted_way_objective_decision_desc$"
 pod1230objectives_fae.10.a: "$the_krofted_way_objective_decision_tooltip$"
