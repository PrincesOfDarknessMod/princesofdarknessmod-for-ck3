l_simp_chinese:
 POD_fera_spirit_quest.1.t: "诸灵之任"
 POD_fera_spirit_quest.1.desc: "你已经咨询了诸灵，它们中的数位有任务可提供。完成其中一个将使你在心灵之旅中取得进展，学习更多的力量，但也会在不同方面削弱你，因为每个任务都有特定的挑战。"
 POD_fera_spirit_quest.1.option.a: "一个简单的任务"
 POD_fera_spirit_quest.1.option.b: "一些简单的东西。"
 POD_fera_spirit_quest.1.option.c: "我已准备好应对一切。"
 POD_fera_spirit_quest.1.option.d: "给我一个挑战。"
 POD_fera_spirit_quest.1.option.e: "我无所畏惧。"
 POD_fera_spirit_quest.1.option.exit: "现在不是接任务的好时机"
 spirit_quest_difficulty_1: "这些任务 #bold 极为简单 #!，几无风险亦无回报。"
 spirit_quest_difficulty_2: "这些任务 #bold 简单 #!，风险不大但回报微薄。"
 spirit_quest_difficulty_3: "这些任务兼具 #bold 普通 #! 的风险与回报。"
 spirit_quest_difficulty_4: "这些任务 #bold 颇具挑战 #!，风险多变然回报丰厚。"
 spirit_quest_difficulty_5: "@warning_icon! 这些任务 #bold 是致命的 #!，风险极高 #warning 甚或殒命 #!，然其回报惊人。"
 spirit_quest_difficulty_spirit_wilds_unavailable: "你没有 $spirit_wilds_access$"
 spirit_quest_message_title: "精神探索"
 POD_fera_spirit_quest.10.good: "你解开了谜题，使灵体折服。"
 POD_fera_spirit_quest.10.bad: "你没能解开谜题，遭受灵体嘲笑。"
 POD_fera_spirit_quest.11.good: "灵体与你玩捉迷藏，它隐去身形却仍被你找到。"
 POD_fera_spirit_quest.11.bad: "灵体与你玩捉迷藏，它隐去身形你却没能找到它。"
 POD_fera_spirit_quest.12.good: "你遇见了一个友好的灵体，它说着古老的语言。幸运的是你听懂了它。"
 POD_fera_spirit_quest.12.bad: "你遇见了一个友好的灵体，它说着古老的语言。不幸的是你完全听不懂。"
 POD_fera_spirit_quest.13.good: "一个灵体给你讲了一个极其冗长的故事，而你从中学到了一些东西。"
 POD_fera_spirit_quest.13.bad: "一个灵体给你讲了一个极其冗长的故事，而你从中什么都没学到。"
 POD_fera_spirit_quest.14.good: "你受到一个灵体的饮酒挑战，并赢了比赛。"
 POD_fera_spirit_quest.14.bad: "你受到一个灵体的饮酒挑战，并输了比赛。"
 POD_fera_spirit_quest.15.good: "一个灵体称赞了你的美貌。"
 POD_fera_spirit_quest.15.bad: "一个灵体说你长得丑。"
 POD_fera_spirit_quest.16.good: "你遭到猎人伏击，但他们不是你的对手。"
 POD_fera_spirit_quest.16.bad: "你遭到猎人伏击。"
 POD_fera_spirit_quest.17.good: "你和一些灵体共舞。"
 POD_fera_spirit_quest.17.bad: "你试着和一些灵体共舞，这真是糟糕的尝试。"
 POD_fera_spirit_quest.18.good: "一个灵体向你征求人际关系建议，你成功帮到了它。"
 POD_fera_spirit_quest.18.bad: "一个灵体向你征求感情建议，你不知怎的使事情变得更糟糕了。"
 POD_fera_spirit_quest.19.good: "你在路上迷了路，但设法重新找到了路。"
 POD_fera_spirit_quest.19.bad: "你在路上迷路了。"
 POD_fera_spirit_quest.20.good: "你偶然遇到一场凡人之间的战斗，但设法奋力突围了。"
 POD_fera_spirit_quest.20.bad: "你偶然遇到一场凡人之间的战斗，还被卷入了他们中间。"
 POD_fera_spirit_quest.21.good: "你成功穿越了[UmbraGlossary('spirit_wilds')]。"
 POD_fera_spirit_quest.21.bad: "你在[UmbraGlossary('spirit_wilds')]中迷失了。"
 POD_fera_spirit_quest.22.good: "你遭到了其他$glossary_fera$的攻击，的成功击退了他们。"
 POD_fera_spirit_quest.22.bad: "一个无赖$glossary_fera$攻击了你。"
 POD_fera_spirit_quest.23.good: "一个灵体向你询问生命的意义，你竟给出了令它满意的回答。"
 POD_fera_spirit_quest.23.bad: "一个灵体向你询问生命的意义。它觉得你的答案很荒谬，于是决定抢劫你。"
 POD_fera_spirit_quest.24.good: "一个灵体成功引诱了你，然后突然离开了。你埋藏了自己的感情，继续前行。"
 POD_fera_spirit_quest.24.bad: "一个灵体成功引诱了你，然后突然离开了。这让你很伤心。"
 POD_fera_spirit_quest.25.good: "一个灵体试图把你当成小宠物对待，你把它吓跑了。"
 POD_fera_spirit_quest.25.bad: "一个灵体把你当成它的小宠物对待，而你无法让它停止。"
 POD_fera_spirit_quest.26.good: "你在一家客栈赌博并且赢了。"
 POD_fera_spirit_quest.26.bad: "你在一家客栈赌博并且输惨了。"
 POD_fera_spirit_quest.1000.t: "任务成功"
 POD_fera_spirit_quest.1000.desc: "灵体拥有对灵界景观的广博知识。无论交涉、沟通或驱使它们，皆为强力盟友。然短暂存在之物需以交换获取协助；$glossary_fera$ 用\"灵务\"指代能驱使灵体的赠礼与恩惠。\n\n任务形式多变，从谜题到英雄冒险无所不包。无论何种形式，自太古以来便是$glossary_fera$社会不可或缺的部分。今日你履行责任，践行了与灵界结盟的悠久传统。"
 POD_fera_spirit_quest.1000.option.a: "传授我我这个血种的秘术吧。"
 POD_fera_spirit_quest.1000.option.b: "强化我与生俱来的力量。"
 POD_fera_spirit_quest.1000.option.c: "我从我的[GetPlayer.Custom('PODFeraAuspiceType')]中汲取力量。"
 POD_fera_spirit_quest.1000.option.d: "我族人的灵赋。"
 POD_fera_spirit_quest.1000.option.e: "向我展示兽庭的玄奥之道。"
 POD_fera_spirit_quest.1000.option.f: "赐我一件灵具。"
 POD_fera_spirit_quest.1000.option.g: "此番经历已改变了我。"
 POD_fera_spirit_quest.common_artifact: "你将获得一个#V 普通#![fetish|E]"
 POD_fera_spirit_quest.masterwork_artifact: "你将获得一个#color_dark_green 大师级#![fetish|E]"
 POD_fera_spirit_quest.famed_artifact: "你将获得一个#FAMEDBLUE 名作级#![fetish|E]"
 POD_fera_spirit_quest.illustrious_artifact: "你将获得一个#ILLUSTRIOUSPURPLE 卓越级#![fetish|E]"
 POD_fera_spirit_quest.1000.option.h: "助我成就大业。"
 POD_fera_spirit_quest.27.good: "一些灵体要求你为他们准备一场盛宴，结果非常成功。"
 POD_fera_spirit_quest.27.bad: "一些灵体要求你为他们准备一场盛宴，你却搞砸了。"
 POD_fera_spirit_quest.28.t: "吸血鬼袭击"
 POD_fera_spirit_quest.28.desc: "在你的灵类探索中，一只孤独的吸血鬼袭击了你。你必须先击退它，才能继续前行。"
 POD_fera_spirit_quest.28.a: "战斗！"
 POD_fera_spirit_quest.29.good: "击败吸血鬼后，你继续前行。"
 POD_fera_spirit_quest.29.bad: "吸血鬼击败了你，让你的进度倒退了。"
 POD_fera_spirit_quest.30.good: "你向诸灵吟唱了一首关于你族人的故事。"
 POD_fera_spirit_quest.30.bad: "你讲起你族人的故事时，说得磕磕巴巴。"