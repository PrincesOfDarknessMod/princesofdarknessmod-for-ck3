l_simp_chinese:
 POD_werewolves.1.t: "原始之歌"
 POD_werewolves.1.desc: "凸月狼是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。\n作为篝火旁的说书者，凸月狼自古以来代代相传的故事和歌曲。今天会演哪一个呢？"
 POD_werewolves.1.option.a: "一首关于部族团结的歌曲。"
 primal_song_modifier: "团结之歌"
 primal_song_modifier_desc: "像古代的英雄一样，我们必须同舟共济！"
 POD_werewolves.1.option.b: "复述古代胜利的故事。"
 song_heroes_modifier: "英雄之歌"
 song_heroes_modifier_desc: "英雄之歌"
 POD_werewolves.1.option.c: "关于血与战斗的故事。"
 song_rage_modifier: "魂怒之歌"
 song_rage_modifier_desc: "我们首先是战士，必须永远记住我们的战斗精神。"
 POD_werewolves.1.option.d: "关于团结与勇气的故事。"
 POD_werewolves.2.t: "召唤暗影复制体"
 POD_werewolves.2.desc: "通过你对夜之灵赠礼的掌握，你可以尝试召唤出你自己的暗影复制体用于战斗。"
 POD_werewolves.2.option.a: "我召唤你！"
 POD_werewolves.2.option.a.tt: "你将尝试召唤你的暗影复制体。"
 POD_werewolves.2.option.a.desc: "与你意志的斗争"
 POD_werewolves.2.option.a.tt.success: "你的暗影复制体被成功召唤"
 POD_werewolves.2.option.a.tt.failure: "你没能召唤出你的暗影复制体"
 POD_werewolves.2.option.b: "还不到时候"
 POD_werewolves.2.option.b.tt: "你将放弃召唤暗影复制体的想法"
 POD_werewolves.3.t: "召唤暗影复制体"
 POD_werewolves.3.desc: "通过你对夜之灵赠礼的掌握，你成功召唤出你自己的暗影复制体，现在可以给它下达命令了。"
 POD_werewolves.3.option.a: "为我而战"
 POD_werewolves.3.option.a.tt: "你的暗影复制体被成功召唤"
 POD_werewolves.4.t: "召唤暗影复制体"
 POD_werewolves.4.desc: "即使以是你目前对夜之灵赠礼的掌握，也不足以召唤你的暗影复制体……目前而言。"
 POD_werewolves.4.option.a: "我还没准备好"
 POD_werewolves.4.option.a.tt: "你没能召唤出你的暗影复制体"
 POD_werewolves.5.t: "暗影复制体"
 POD_werewolves.5.desc: "你的暗影复制体遭遇了一场意外，并消逝了。"
 POD_werewolves.5.option.a: "我的暗影复制体被摧毁了"
 POD_werewolves.5.option.a.tt: "你的暗影复制体已经不复存在"
 POD_werewolves.6.t: "舍弃月兆"
 POD_werewolves.6.desc: "在这罕见的仪式中，狼人拒绝他出生自带的月兆并选择了一个新的月兆。你选择接纳……"
 POD_werewolves.7.t: "是个男孩……"
 POD_werewolves.7.desc: "看上去盖亚今天没啥可祝福你：你的孩子是个男孩。黑怒的社会对接下来的事非常严格，你知道这是你们部族几代人以来的做法。\n你们族人中确实有几只男性，所以如果你愿意，保留这个孩子的选择也并非前无先例，但这仍然是对传统的极大冒犯，被你的姐妹们视为软弱的表现。然而，在白日结束时，你将自己下决定。"
 POD_werewolves.7.option.a: "软弱的男性不可与我们为伍！"
 POD_werewolves.7.option.b: "我依然是他的母亲！"