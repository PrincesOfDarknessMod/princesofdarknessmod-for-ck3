l_simp_chinese:
 POD_fera_pack.1.t: "你的[GetPlayer.Custom('PODCoterie')]"
 POD_fera_pack.1.desc: "你[GetPlayer.Custom('PODCoterie')]的成员已集结完毕。作为首领，你有权决定未来数年的训练方向或重点活动。"
 POD_fera_pack.1.option.a: "我们必须遏制人类的发展"
 POD_fera_pack.1.option.b: "我们必须为战争做好准备！"
 POD_fera_pack.1.option.c: "是时候拼搏了！"
 POD_fera_pack.1.option.d: "[pack_diplomacy_teacher.GetFirstName]的雄辩之才令人敬服"
 POD_fera_pack.1.option.e: "我们都能从[pack_martial_teacher.GetFirstName]身上学到更多战略技巧。"
 POD_fera_pack.1.option.f: "学习[pack_stewardship_teacher.GetFirstName]的治理能力将大有裨益。"
 POD_fera_pack.1.option.g: "[pack_intrigue_teacher.GetFirstName]将教导我们如何与阴影融为一体。"
 POD_fera_pack.1.option.h: "[pack_learning_teacher.GetFirstName]的智慧可为我们启迪心智。"
 POD_fera_pack.1.option.i: "我们必须向诸灵祈求它们的祝福。"
 POD_fera_pack.1.option.z: "目前什么也不做"
 fera_pack_coterie_rewards_tt: "你的[GetPlayer.Custom('PODCoterie')]成员也将获得此项奖励。"
 fera_pack_teaching_rewards_tt: "除导师外，你的[GetPlayer.Custom('PODCoterie')]所有成员将提升相关[skill|E]。"
 fera_pack_teaching_warning_tt: "@warning_icon!#X 你是[GetPlayer.Custom('PODCoterie')]中[skill|E]最高者，自身无法获得奖励。#!"
 fera_pack_totem_tt: "你将为自己的[GetPlayer.Custom('PODCoterie')]祈求图腾\n@warning_icon!#X 图腾选择不可更改。#!"
 POD_fera_pack.2.t: "灵之庇护"
 POD_fera_pack.2.desc: "在$glossary_fera$尤其是狼族中，图腾是战群最根本的联结纽带。图腾是强大的精魂，它会向具备神秘倾向的群体借出力量，以换取某种服务或贡品。对战群而言，选择图腾至关重要，因为这位精魂将在危难时庇护他们，并成为狼族追随的指引之光。\n此举相当于向图腾精魂请愿，由它决定是否接纳战群成员为\"子嗣\"。"
 POD_fera_pack.2.desc.bastet: "\n芭丝特称诸灵为“贾马克”，那些选择与猫类结盟的灵类往往反复无常，会突然出现，提出看似荒唐的要求。尽管如此，它们还是会像其他所有的灵类图腾一样给予保护，并被尊称为强大（尽管难以理解）的芭丝特保护者。"
 POD_fera_pack.2.option.a: "坚强而高贵的猎鹰"
 POD_fera_pack.2.option.b: "狡猾和睚眦必报的雷公"
 POD_fera_pack.2.option.c: "大自然的爱与怒，牡鹿"
