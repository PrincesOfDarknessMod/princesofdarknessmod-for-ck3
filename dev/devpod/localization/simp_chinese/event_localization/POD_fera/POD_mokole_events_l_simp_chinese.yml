l_simp_chinese:
 mokole_3_pulse_title: "魔克拉"
 POD_mokole.100.t: "你的梦界形态"
 POD_mokole.100.desc: "不像绝大多数$glossary_fera$彼此近乎雷同的战争形态，魔克拉绝不会有两个完全相同的龙形。\n龙形态来自于梦界，在魔克拉的原始觉醒时降临。通过记忆传承，他们会梦到远古时期的爬行类，鸟类与恐龙，这些幻象将决定他们龙形的特征。在这场神秘的体验中魔克拉会切实经历他们那被铭记的祖先的生平，而龙形便从他们的身体中塑造而成。\n该形态通常会近似鳄类、恐龙或者巨龙，不过也会存在翼龙形态、海蛇形态的魔克拉。这些形态往往混合了自然界中不可能同时共存于一个生物上的躯体部位，例如生有双翼的鳄鱼——毕竟形态源于梦界，而非对现实生物的刻板记忆。\n\n你的形态是？"
 POD_mokole.100.option.a: "吾之梦境，铸就吾身。"
 POD_mokole.100.tooltip1: "@warning_icon!#warning 你必须选择所有能够选择的选项才能继续！#!"
 POD_mokole.100.tooltip2: " 你所选择的选项会被添加至你的[GetModifier('POD_mokole_form_archid_modifier').GetNameWithTooltip]"
