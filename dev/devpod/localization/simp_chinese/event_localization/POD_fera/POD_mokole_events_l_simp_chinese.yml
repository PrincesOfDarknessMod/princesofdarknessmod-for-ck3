 POD_mokole.101.t: "万兽之主"
 POD_mokole.101.desc: "历经多年踏遍影界与世界遗忘之地的追寻，你终于找到了龙族最后的幸存兽嫡。完成登记入册后，他们便可在你的庇护下安然重归世间。"
 POD_mokole.101.option.a: "生命自会寻求出路…"
 POD_mokole.300.t: "黄沙之下"
 POD_mokole.300.desc: "当你收到克罗迪洛波利斯现阶段修复完工的报告时，一则更为离奇的消息随之传来。你们发现了两具古老的木乃伊，刚一出土，他们便从圣棺中苏醒并完成了蜕变。你亲自接见了二者，这两位古老的莫科莱同族用古老的语言说出往事：他们曾是一位至强斗士的子嗣，在城池陷落之际一同陷入了蛰眠。他们二人对你的唤醒心怀感激，现已归入你的麾下成为斗士的一员。然而他们恳请你继续深入发掘，他们那更为强大的父亲，很可能以类似的状态沉眠于地底深处。"
 POD_mokole.300.option.a: "倘若其二人尚为学生，仍处地底深处之物，又为何等存在？"
 POD_mokole.301.t: "上古战士"
 POD_mokole.301.desc: "你正在亲自监督着克罗迪洛波利斯修复的最后工序，那对兄妹的话语仍在你的脑海回响，一座终极古墓却于此时现世。当墓门打开，阳光倾泻而入的刹那，一头身形巨硕，眼睛乳白的巨鳄破棺而出。它舒展着庞大身躯，随即化为人形。你大步向前，对方也立刻认出眼前之人正是唤醒自己的族中长者。虽目不能视，但仅凭他的动作，足以知道他的敏锐直觉无与伦比。他身着阿努比斯斗士的制式服装，恍如离水之螈，对周遭环境尚感陌生。数日之后，经过你的详细讲解，他终于对当下的世界有了清晰的认识；为了报答你重建其故土的恩情，他决定为你效力。在他的墓中还有着无数古代赛特之子的遗骸，此番发现，价值无可估量。"
 POD_mokole.301.option.a: "阿努比斯又赐给你一份厚礼。"
 POD_mokole.502.t: "四流源一 "
 POD_mokole.502.desc: "曾经，所有莫科莱皆为同一源流。在诸龙王的时代，没有莫科莱-姆贝姆贝、古玛甘、摩迦罗、中龙之别，只有龙王之流。当你梦见该时代时，你自己的源流开始汇聚，新的灵赋向你敞开。"
 POD_mokole.502.option.a: "魔克拉-姆边贝之梦"
 POD_mokole.502.option.b: "古玛甘之梦"
 POD_mokole.502.option.c: "摩迦罗之梦"
 POD_mokole.502.option.d: "中龙之梦"
 mnesis_quest_message_title: "龙梦"
 POD_mokole.600.desc: "你梦见更多放松时光。"
 POD_mokole.601.desc: "你梦见魔克拉死者"
 POD_mokole.602.desc: "你梦见和平时光"
 POD_mokole.603.desc: "你梦见黑暗混乱的梦魇。"
 POD_mokole.604.desc: "你梦见沐浴于灵知中。"
 POD_mokole.605.desc: "你梦见一个早已消失的巢群，彼此蜷缩在一起，寻求温暖与安全"
 POD_mokole.606.desc: "你梦见安巴拉索凯的丛林，既凶猛又野性美丽。"
 POD_mokole.607.desc: "你梦见战争和残垣断壁，没有尽头的纷争和恐惧。"
 POD_mokole.608.desc: "你梦见了根达西，那片无尽的平原，安抚着你的睡眠。"
 POD_mokole.609.desc: "你梦见尼罗河之约，蜥蜴和狼之间前所未有的和平希望。"
 POD_mokole.610.desc: "你梦见友谊恶化，最后演变成苦涩的敌对关系。"
 POD_mokole.611.desc: "你梦见强大的布拉岑图斯克·强蹄，最后一位格隆迪尔国王倒在了狼人的利爪之下。"
 POD_mokole.612.desc: "你梦见克里特岛的最后一位阿皮斯，他在狼人和凡人的记忆中都饱受污蔑。"
 POD_mokole.613.desc: "你梦见古老的黑土之地，在那里，魔克拉的亲属确保太阳得到应有的崇拜。"
 POD_mokole.614.desc: "你梦见恩托班的生命肇始，在所有事和所有人出现之前的很久以前。"
 POD_mokole.615.desc: "你梦见被阳光炙烤的班达扬，永远纯洁无秽。"
 POD_mokole.616.desc: "你梦见自己在沉梦纪元做梦。"
 POD_mokole.617.desc: "你梦见人们用黄金铺满城市，而后被血河淹没。"
 POD_mokole.618.desc: "你梦见欧涅斯，智慧既被分享也被窃取之处。"
 POD_mokole.619.desc: "你梦见那些失去的梦想，然后又失去了它们。"
 POD_mokole.620.desc: "你梦见盖亚的目标，却无法理解它们。"
 POD_mokole.621.desc: "你梦见恐龙诸王，它们发出凶猛的咆哮，却对等待着它们的命运浑然不知。"
 POD_mokole.622.desc: "你梦见太古终纪，一切的开始和结束。"
 POD_mokole.623.desc: "你梦见王冠和权杖，被时间消磨至尘埃，终归虚无。"
 POD_mokole.624.desc: "你梦见蛇形法官，他们试图像偷走你的形态一样偷走你的梦。"
 POD_mokole.625.desc: "你梦见和迩将其蛋给予西王母，让她带到中原。"
 POD_mokole.626.desc: "你梦见八犬将他们自己放逐至日本群岛。"
 POD_mokole.627.desc: "你梦见那些古老的蜥蜴王庙宇，它们供奉着赫利俄斯神——太阳之父。"
 POD_mokole.628.desc: "你梦见耻辱之战和兽庭的建立。"
 POD_mokole.629.desc: "你梦见魔克拉的失败，以及盖亚创造其他$glossary_fera$借此补救。"
 POD_mokole.630.desc: "你梦见了伟大的恐龙，以及驾驭它们的蜥蜴王。"
 POD_mokole.681.t: "迷失的梦"
 POD_mokole.681.desc: "当多数魔克拉沉湎于梦境、藏身梦乡时，怀旧本身却暗藏威胁。对魔克拉而言，梦魇猎手正是这样的存在 —— 这些被自身梦境折磨扭曲的暗影追猎者，试图扼杀他们对往昔的渴望。不幸的是，此刻正有一名猎手在你沉睡时悄然潜入你的思绪，伺机将你毁灭。"
 POD_mokole.681.option.a: "说服它离开。"
 POD_mokole.681.option.b: "驱离它。"
 POD_mokole.682.t: "记忆入侵者"
 POD_mokole.682.desc: "沉溺于 \"记忆之境\" 的温暖回忆是莫科莱独有的奢侈，但这把双刃剑也暗藏危机。梦魇猎手 —— 那些在莫科莱每次精神遁逃中如影随形的暗影追猎者 —— 已悄然侵入你暂避的 \"记忆之境\"，渴望将你的死亡烙印进这片祖传记忆的永恒画卷。"
 POD_mokole.682.option.a: "智取它。"
 POD_mokole.682.option.b: "驱离它。"
 POD_mokole.689.good: "你从那位失败的“梦境猎人”那里还是学到了一些东西的。"
 POD_mokole.690.t: "再次苏醒"
 POD_mokole.690.desc: "随着龙梦的探索落幕，属于生者与凡俗的世界再次向你呼唤。你搅动，记忆随之而来——更多莫科莱所共享的记忆，如今已成为你自身的一部分。你自记忆中醒来，而要如何运用这些记忆，取决于你。"
 POD_mokole.690.option.a: "入睡，也许会梦见。"
 mokole_mnesis_quest_widget_tt: "你将立即开始又一#bold 龙梦#![journey|E]。"
 mokole_mnesis_quest_widget_desc: "继续另一#bold 龙梦#![journey|E]？"
 POD_mokole.torment: "折磨！"
 POD_mokole.700.t: "无垢灵袭击"
 POD_mokole.700.desc: "一个[innocent|E]攻击了你！"
 POD_mokole.701.t: "如影随形"
 POD_mokole.701.desc: "某种险恶之物在影界跟踪你。"
 POD_mokole.702.t: "精疲力竭"
 POD_mokole.702.desc: "一个潜藏的[innocent|E]已吸干你的力量。"
 POD_mokole.703.t: "突然袭击"
 POD_mokole.703.desc: "一对[innocents|E]攻击了你！"
 POD_mokole.704.t: "暗银伤人"
 POD_mokole.704.desc: "一个浸染银的[innocent|E]伏击了你！"
 POD_mokole.705.t: "恐耸詟栗"
 POD_mokole.705.desc: "[innocents|E]可怕的声音吓到了你。"
 POD_mokole.706.t: "体无完肌"
 POD_mokole.706.desc: "[innocents|E]摧残了你的身体！"
 POD_mokole.720.t: "黑暗迫身"
 POD_mokole.720.desc: "在龙梦时，许多莫科莱在遭遇黑暗回忆时未能克制其情绪，如此导致了[innocents|E]。这些负面情绪凝聚而成的恶灵试图毁灭其创造者及其他莫科莱。不幸的是其以灵知为食，其中一只无垢灵开始跟踪你，想要把你变成晚餐。\n"
 POD_mokole.720.a: "我必须抵抗！"
 POD_mokole.720.b: "保护我！"
 POD_mokole.720.c: "我坚持不下去了……"
 POD_mokole.721.t: "梦魇化身"
 POD_mokole.721.desc: "在龙梦时，许多莫科莱在遭遇黑暗回忆时未能克制其情绪，如此导致了[innocents|E]。这些负面情绪凝聚而成的恶灵试图毁灭其创造者及其他莫科莱。不幸的是其中一只无垢灵已窃取到了其它莫科莱的形态，并已经决定要抢走你的半龙形形态。\n"
 POD_mokole.721.a: "来战！"
 POD_mokole.721.b: "这能使它分心！"
 POD_mokole.721.c: "我必须逃跑！"
 POD_mokole.torment_desc: "你的一位[tormentors|E]正在与你作对！"