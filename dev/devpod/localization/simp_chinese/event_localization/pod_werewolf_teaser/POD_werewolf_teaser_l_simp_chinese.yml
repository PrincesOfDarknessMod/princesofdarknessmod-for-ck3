l_simp_chinese:
 POD_werewolf_teaser.100.t:0 "突袭！"
 POD_werewolf_teaser.100.desc:0 "当你在外面猎食时，你突然发现一只用后腿站着的九英尺高的狼！它还没有看到你。你要怎么做？"
 POD_werewolf_teaser.100.option.a:0 "快逃！"
 POD_werewolf_teaser.100.option.a.tt:0 "这是不是玩家在MOD刚推出时就一直在乞求的新内容的抢先体验？"
 POD_werewolf_teaser.100.option.b:0 "杀狼！"
 POD_werewolf_teaser.100.option.b.tt:0 "玩家们已经等了一年多了！让我们开始吧！"
 POD_werewolf_teaser.300.t:0 "狼嚎"
 POD_werewolf_teaser.300.desc:0 "你击败了狼人，取走了它的血！那是多么可怕的野兽。你不禁要问，还有多少在这片土地上游荡，你是否会在未来看到他们。\n\n在远处，你听到一群狼的嚎叫。"
 POD_werewolf_teaser.300.option.a:0 "“全都在这了？”"
 POD_werewolf_teaser.300.option.a.tt:0 "一个完整的新种族是需要时间的。当我们完全发布可玩的狼人角色时，我们希望它至少有猎人加入MOD时的深度和复杂性；有游戏机制，带来不同的游玩风格。如果你对我们应该如何在《黑暗亲王》MOD中创建狼人有想法，现在是时候告诉我们了。来我们的Discord，让我们知道！"
 POD_werewolf_teaser.400.t:0 "狼嚎"
 POD_werewolf_teaser.400.desc:0 "当这只可怕的野兽用它的狼口咬住你的喉咙时，你想知道这是否是终末。这是你的终焉之死吗？你的最后时刻被锁定在与这个可怕的生物的战斗中。还有很多像它一样的家伙吗？\n\n在远处，你听到一群狼的嚎叫。\n\n随后狼人把你的头从你的身体上撕了下来。"
 POD_werewolf_teaser.400.option.a:0 "“全都在这了？”"
 POD_werewolf_teaser.400.option.a.tt:0 "一个完整的新种族是需要时间的。当我们完全发布可玩的狼人角色时，我们希望它至少有猎人加入MOD时的深度和复杂性；有游戏机制，带来不同的游玩风格。如果你对我们应该如何在《黑暗亲王》MOD中创建狼人有想法，现在是时候告诉我们了。来我们的Discord，让我们知道！"
 POD_werewolf_teaser_hunting_tt:0 "如果你今晚到树林里去，你收到一个大惊喜。"
 POD_hunting_accident_tt:0 "狩猎事故。"
 POD_hunting_success_tt:0 "一次成功的狩猎。"