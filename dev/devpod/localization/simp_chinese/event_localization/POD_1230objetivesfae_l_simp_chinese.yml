 prevent_black_death_rat_objective_decision:0 "鼠族阴谋"
 prevent_black_death_rat_objective_decision_tooltip:1 "你将试图阻止老鼠预言的实现。"
 prevent_black_death_rat_objective_decision_desc:0 "为了防止老鼠预言，你应该找到隐藏着的鼠族，所以首先你必须对付他们的妖蛆盟友。"
 prevent_black_death_rat_objective_decision_confirm:0 "说！"
 prevent_black_death_rat_objective_decision_custom:0 "在地图上不能有[GetReligionFamily('rf_wyrm').GetName][religion|E]信徒[independent_ruler|E]。"
 prevent_black_death_cat_objective_decision:0 "猫咪！"
 prevent_black_death_cat_objective_decision_tooltip:1 "你将通过使每个人都崇拜猫来防止老鼠预言。"
 prevent_black_death_cat_objective_decision_desc:0 "很明显，为了防止老鼠预言，你应该让每个人都爱上猫！"
 prevent_black_death_cat_objective_decision_confirm:0 "喵！"
 prevent_black_death_anda_objective_decision:0 "阻止蒙古肆虐"
 prevent_black_death_anda_objective_decision_tooltip:1 "你将通过阻止蒙古人，针对他们的安答保镖来削弱他们，从而阻止老鼠预言的发生。"
 prevent_black_death_anda_objective_decision_desc:0 "那老鼠预言不是很清楚，但你有种感觉，针对蒙古和安答也许会有帮助。"
 prevent_black_death_anda_objective_decision_confirm:0 "不再劫掠。"
 destroy_inquisition_objective_decision:0 "摧毁裁判所"
 destroy_inquisition_objective_decision_tooltip:1 "你将摧毁暗影裁判所。"
 destroy_inquisition_objective_decision_desc:0 "教会和它裁判所对原始教徒和妖精进行着可怕地迫害，还用洗礼来扼杀年轻换生灵的梦华之火，且持续传播令人失魂的板讷。为了让妖精留在大地上，现在是时候阻止他们了。"
 destroy_inquisition_objective_decision_confirm:0 "不再有神学了"
 destroy_inquisition_objective_decision_before_last_date:0 "日期是1430年1月1日或更早"
 destroy_inquisition_objective_decision_custom1:0 "大裁判将不会发生。"
 destroy_inquisition_objective_decision_custom2:0 "解锁$prodigal_objective_decision$决议"
 prodigal_objective_decision:0 "浪子回头"
 prodigal_objective_decision_tooltip:1 "你将使浪子回忆起他们的起源。"
 prodigal_objective_decision_desc:0 "浪子已经忘记了他们在梦界的起源，现在是时候提醒他们自己是谁了。"
 prodigal_objective_decision_confirm:0 "回来吧。"
 prodigal_objective_decision_custom:0 "在地图上不能有对你有负好感的非妖精[independent_ruler|E]。"
 prodigal_objective_decision_custom1:0 "所有其他超自然都将被重命名为浪子"
 prodigal_objective_decision_custom2:0 "非妖精超自然将一定接受你的要求臣服提议"
 pod1230objectives_fae.100.t:0 "老鼠预言"
 pod1230objectives_fae.100.desc:0 "十三世纪初，冬天变得漫长而寒冷，大雨下个不停。庄稼被淹没。道路变成了泥泞的沼泽地。饥荒和严寒使墓地满目疮痍。\n你的预言家说，他们已经看到了一个比大散断更糟糕的黑暗未来，预言只揭露它起源于老鼠。你应该在这世纪将注意力集中阻止它的手段之一，以确保它不会发生。"
 pod1230objectives_fae.100.a:0 "鼠族和它们的盟友！"
 pod1230objectives_fae.100.b:0 "要防止老鼠，我们需要猫！"
 pod1230objectives_fae.100.c:0 "蒙古入侵是罪魁祸首！"
 pod1230objectives_fae.101.t:0 "鼠族大谋"
 pod1230objectives_fae.101.desc:0 "卑鄙的鼠族确实酝酿了一个黑暗的计划，他们创造了有史以来最致命的疾病，被称为黑死病。你很高兴你在他们完全释放疾病之前阻止了他们。"
 pod1230objectives_fae.101.a:0 "肮脏的老鼠。"
 pod1230objectives_fae.102.t:0 "猫灾"
 pod1230objectives_fae.102.desc:0 "世界上每个人都喜欢猫了，老鼠预言不再是一个麻烦……但我们可能有另一个问题要处理。"
 pod1230objectives_fae.102.a:0 "我的……"
 pod1230objectives_fae.103.t:0 "天罚"
 pod1230objectives_fae.103.desc:0 "由于你的努力，蒙古汗帐的发展速度正在减慢，你的预言家确认你阻止了蒙古在围攻中使用死老鼠的未来，那本可能会传播一种大流行病。"
 pod1230objectives_fae.103.a:0 "我是对的。"
 pod1230objectives_fae.120.t:0 "裁判所的终末"
 pod1230objectives_fae.120.desc:0 "裁判所的建立是散断的顶点，因为教会开始追求从世界上消除所有不受欢迎的超自然元素，包括妖精。但现在它已经结束了。"
 pod1230objectives_fae.120.a:0 "更多迷信！"
 pod1230objectives_fae.121.t:0 "浪子回头"
 pod1230objectives_fae.121.desc:0 "黑暗世界的所有其他超自然居民都曾是妖精，他们已经忘记了自己在梦界中的起源。现在他们已经恢复了理智。"
 pod1230objectives_fae.121.a:0 "欢迎回来。"
 POD_fae_maintenance.21.t:0 "大碎溃"
 POD_fae_maintenance.21.desc:0 "你没能阻止预言发生。\n最终，凡界和梦界之间被拉得很细的线开始断裂。这断裂就是大碎溃。它不仅粉碎了阿卡迪亚和地球之间的联系，而且粉碎了逆转它的希望。\n你必须选择一种选项来面对它。"
 POD_fae_maintenance.21.a:0 "化为换生灵"
 POD_fae_maintenance.21.b:0 "逃往阿卡迪亚"
 POD_fae_maintenance.21.c:0 "封入永契堡"
 POD_fae_maintenance.22.t:0 "大碎溃"
 POD_fae_maintenance.22.desc:0 "最终，凡界和梦界之间被拉得很细的线开始断裂。这断裂就是大碎溃。它不仅粉碎了阿卡迪亚和地球之间的联系，而且粉碎了逆转它的希望。"
 POD_fae_maintenance.22.a:0 "好耶？"
