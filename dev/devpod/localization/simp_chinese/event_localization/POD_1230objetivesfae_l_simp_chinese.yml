 inert_cold_iron_objective_decision_vulcans_hammer: "你必须拥有[GetPODArtifactName('vulcans_hammer_link')]"
 inert_cold_iron_objective_decision_gold_mines: "你有10000金钱或[completely_control|E]任一以下金矿：[GetTitleByKey('b_turoc').GetNameNoTier]、[GetTitleByKey('b_abrudbanya').GetNameNoTier]、[GetTitleByKey('c_chalkidike').GetNameNoTier]、[GetTitleByKey('c_allaqi').GetNameNoTier]、[GetTitleByKey('b_wasulu').GetNameNoTier]、[GetTitleByKey('b_diakha').GetNameNoTier]、[GetTitleByKey('b_goundafa').GetNameNoTier]"
 POD_fae_maintenance.21.d: "你找到专属的永生之路。"
 POD_fae_maintenance.21.d.tt: "大碎溃将不再影响你，个人层面。"
 rhineland_duchy_objective_decision: "收复博尔贝托马古斯"
 rhineland_duchy_objective_decision_desc: "德意志民族的每个家庭都仍然传颂着关于齐格弗里德、龚特尔和尼伯龙根的传说。甚至现今美因茨的凡人大主教都被命名为齐格弗里德。季比宏家族的祖先之地，即旧勃艮第的古都，应该再次回到妖精们的掌控之下。夺取沃尔姆斯的控制权是夺回莱茵河的第一步。"
 rhineland_duchy_objective_decision_tooltip: "确保旧勃艮第古都"
 rhineland_duchy_objective_decision_confirm: "收复博尔贝托马古斯"
 rhineland_duchy_objective_rhineland_dejure: "[GetTitleByKey('d_rhineland').GetName]成为[GetTitleByKey('c_worms').GetNameNoTier]、[GetTitleByKey('c_speyer').GetNameNoTier]和[GetTitleByKey('c_kaiserslautern').GetNameNoTier]的[de_jure|E]领主"
 rhineland_duchy_objective_rhineland_county_claims: "获得对上莱茵（[GetTitleByKey('d_alsace').GetName]和[GetTitleByKey('c_breisgau').GetNameNoTier]、[GetTitleByKey('c_sundgau').GetNameNoTier]、[GetTitleByKey('c_colmar').GetNameNoTier]、[GetTitleByKey('c_strassburg').GetNameNoTier]、[GetTitleByKey('c_baden').GetNameNoTier]、[GetTitleByKey('c_erbach').GetNameNoTier]、[GetTitleByKey('c_frankfurt').GetNameNoTier]、[GetTitleByKey('c_mainz').GetNameNoTier]等[counties|E]）和对中莱茵（[GetTitleByKey('c_koblenz').GetNameNoTier]和[GetTitleByKey('c_sayn').GetNameNoTier]）的[unpressed_claims|E]。"
 rhineland_kingdom_objective_decision: "莱茵兰王国"
 rhineland_kingdom_objective_decision_tooltip: "沿着莱茵河扩张[GetTitleByKey('d_rhineland').GetName]为[kingdom|E]。"
 rhineland_kingdom_objective_decision_desc: "一旦在旧勃艮第的古都[GetTitleByKey('d_rhineland').GetName]建立了宫廷，征服整个莱茵河地区就会将势如破竹。当莱茵河地区被确保之后，寻找传说中的尼伯龙根宝藏——[GetGlobalVariable('rhinegold').Artifact.GetName]——就可以真正开始了。"
 rhineland_kingdom_objective_decision_confirm: "加冕"
 rhineland_duchy_objective_rhineland_duchy_claims: "获得对莱茵河边的所有[duchies|E]（[GetTitleByKey('d_currezia').GetNameNoTier]、[GetTitleByKey('d_augsburg').GetNameNoTier]、[GetTitleByKey('d_swabia').GetNameNoTier]、[GetTitleByKey('d_alsace').GetNameNoTier]、[GetTitleByKey('d_west_franconia').GetNameNoTier]、[GetTitleByKey('d_lower_lorraine').GetNameNoTier]、[GetTitleByKey('d_julich').GetNameNoTier]、[GetTitleByKey('d_gelre').GetNameNoTier]、[GetTitleByKey('d_brabant').GetNameNoTier]和[GetTitleByKey('d_holland').GetNameNoTier]）的[pressed_claims|E]。"
 rhineland_empire_objective_decision: "莱茵兰帝国"
 rhineland_empire_objective_decision_tooltip: "沿着河扩张[GetTitleByKey('k_rhineland').GetName]为[empire|E]。"
 rhineland_empire_objective_decision_desc: "当你统治着整个[GetTitleByKey('e_rhineland').GetNameNoTier]的所有[duchies|E]，那些曾经声称对这片土地拥有主权的吸血鬼豪强被消灭，而莱茵黄金也安全地存放在你的国库中时，所有人都必须承认你对整个莱茵河的统治。"
 rhineland_empire_objective_decision_confirm: "莱茵河畔的一切！"
 rhineland_empire_objective_dead_stiffs: "对莱茵地区有主权宣称的著名吸血鬼必须死亡或者陷入[Glossary('蛰眠','game_concept_torpor_desc')]：[GetScriptedCharacterByHistoryID('505050').GetFirstName]、[GetScriptedCharacterByHistoryID('505096').GetFirstName]、[GetScriptedCharacterByHistoryID('505086').GetFirstName]和[GetScriptedCharacterByHistoryID('505121').GetFirstName]。"
 rhineland_empire_objective_dejure_done: "[GetTitleByKey('k_rhineland').GetName]成为莱茵河边所有[duchies|e]（[GetTitleByKey('d_currezia').GetNameNoTier]、[GetTitleByKey('d_augsburg').GetNameNoTier]、[GetTitleByKey('d_swabia').GetNameNoTier]、[GetTitleByKey('d_alsace').GetNameNoTier]、[GetTitleByKey('d_west_franconia').GetNameNoTier]、[GetTitleByKey('d_lower_lorraine').GetNameNoTier]、[GetTitleByKey('d_julich').GetNameNoTier]、[GetTitleByKey('d_gelre').GetNameNoTier]、[GetTitleByKey('d_brabant').GetNameNoTier]和[GetTitleByKey('d_holland').GetNameNoTier]）的[de_jure|E]领主"
 pod1230objectives_fae.1100.t: "博尔贝托马古斯已收复！"
 pod1230objectives_fae.1100.desc: "古勃艮第的古都现在是你国度的一部分。"
 pod1230objectives_fae.1100.a: "通往莱茵的道路向我敞开。"
 pod1230objectives_fae.1200.t: "莱茵之王！"
 pod1230objectives_fae.1200.desc: "整条莱茵河现在都在你的控制之下。莱茵黄金肯定会在这条神秘河流的某处发出声音。"
 pod1230objectives_fae.1200.a: "在莱茵河畔成……王，王，王，王！"
 pod1230objectives_fae.1300.t: "莱茵之帝！"
 pod1230objectives_fae.1300.desc: "莱茵河沿岸的每一个公国都在你的掌控之中，莱茵黄金也安全地存放在你的国库中，没有人可以质疑你统治莱茵河的权利。"
 pod1230objectives_fae.1300.a: "莱茵——我的，永远的！"
 pod1230objectives_fae.110.t: "第四纪元"
 pod1230objectives_fae.110.desc: "妖仙曾经是天庭最强大的神灵的仆人，负责按照上司的意愿回应凡人的祈祷。在[Glossary('第四纪元','game_concept_fourth_age_desc')]初期的龙河战争[Glossary('第三纪元','game_concept_third_age_desc')][Glossary('万鬼','game_concept_kuei_jin_desc')]堕落的可怕事件中，许多妖仙反抗了他们在天庭中的职责，他们或者帮助凡人，或者背叛凡人。结果，他们受到了玉皇大帝的惩罚。那些敢于将自己置于[Glossary('万鬼','game_concept_kuei_jin_desc')]之位的人被赶了出去，被迫生活在中原的凡人之中。"
 pod1230objectives_fae.110.a: "我错了吗？"
 pod1230objectives_fae.110.a.t: "你被强制化为换生灵，你在自然死亡时将获得继承人。完成你的决议来再次成为妖精。"
 pod1230objectives_fae.111.t: "道德仙道"
 pod1230objectives_fae.111.desc: "通过研究内丹，占据最强大的龙穴，你已达成道德仙道，与天庭再次搭上联系。"
 pod1230objectives_fae.111.a: "我回来了"
