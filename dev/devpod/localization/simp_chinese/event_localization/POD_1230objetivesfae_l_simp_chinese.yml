 pod1230objectives_fae.172.desc.start:0 "House Balor has traced your ancestry back to a line of sidhe who mixed their blood with that of the Fomorians. The Endless Winter is almost here, and you need to guide fae through it, whether they consent to your rule or not. You have prepared the ritual to merge your Fae self with a powerful bane spirit to create a Fae-Fomori hybrid — a Fomarch. Balor's Crystal Eye glows a dull red and radiates a great heat. "
 pod1230objectives_fae.172.desc.steaming_spear_of_vengeance:0 "Hefting the [GetGlobalVariable('steaming_spear_of_vengeance_link').Artifact.GetName], you lick hot blood from its blade feeling your self filled with rage."
 pod1230objectives_fae.172.desc.cauldron_of_fear:0 "Having prepared the foul, mystical concoction — you drink deeply from the [GetGlobalVariable('cauldron_of_fear_link').Artifact.GetName]."
 pod1230objectives_fae.172.desc.blood_dross:0 "Crushing the crystallized sugar tiny vial, you drink the vampiric blood contained within the Blood Dross and are filled with dark glamour."
 pod1230objectives_fae.172.desc.end:0 "You open a trod to the Umbra to call forth the Nexus Crawler.\nA black shimmer appears in the air along with a warbling vibrato moan. You have a feeling on your skin like fingernails scraped across a blackboard. The air stinks of a miasmic scent reminiscent of a cancerous illness. The Wyrm spirit manifests into a loathsome and horrifying avatar. Its claws and fangs rip open your flesh and it violently thrusts itself into your chest cavity. You are filled with excruciating pain. And then...\nWe are united. Forever."
