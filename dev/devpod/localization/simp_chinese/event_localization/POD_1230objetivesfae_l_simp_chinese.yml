l_simp_chinese:
 black_death_prevented:0 "黑死病将不会发生。"
 shattering_prevented:0 "[shattering|E]将不会发生。"
 prevent_black_death_objective_decision_before_last_date:0 "日期是1347年1月1日或更早"
 prevent_black_death_rat_objective_decision:0 "鼠族阴谋"
 prevent_black_death_rat_objective_decision_tooltip:1 "你将试图阻止老鼠预言的实现。"
 prevent_black_death_rat_objective_decision_desc:0 "妖精先知们都梦见了关于未来的一场灾难性事件，这场事件将导致数百万梦种的死亡。细节模糊不清，但似乎涉及大批从东方涌来的老鼠，成堆的燃烧尸体，舞动的骷髅，黑化的手指和脚趾。一些妖精深信鼠族及其带有疾病的妖蛆附属必须被消灭。"
 prevent_black_death_rat_objective_decision_confirm:0 "制止黑死病"
 prevent_black_death_rat_objective_decision_custom:0 "在地图上不能有[GetReligionFamily('rf_wyrm').GetName][religion|E]信徒[independent_ruler|E]"
 prevent_black_death_cat_objective_decision:0 "猫咪！"
 prevent_black_death_cat_objective_decision_tooltip:1 "你将通过使每个人都崇拜猫来防止老鼠预言。"
 prevent_black_death_cat_objective_decision_desc:0 "很明显，为了防止老鼠预言，你应该让每个人都爱上猫！"
 prevent_black_death_cat_objective_decision_confirm:0 "喵！"
 prevent_black_death_anda_objective_decision:0 "阻止汗帐肆虐"
 prevent_black_death_anda_objective_decision_tooltip:1 "你将通过阻止蒙古人，针对他们的安答保镖来削弱他们，从而阻止老鼠预言的发生。"
 prevent_black_death_anda_objective_decision_desc:0 "那老鼠预言不是很清楚，但你有种感觉，针对蒙古和安答也许会有帮助。"
 prevent_black_death_anda_objective_decision_confirm:0 "不再劫掠。"
 destroy_inquisition_objective_decision:0 "摧毁裁判所"
 destroy_inquisition_objective_decision_tooltip:1 "你将摧毁暗影裁判所。"
 destroy_inquisition_objective_decision_desc:0 "教会和它裁判所对原始教徒和妖精进行着可怕地迫害。它以剑传教，折磨或焚烧那些信奉旧神和修行神秘技艺的人。它的牧师们通过洗礼仪式永远剥夺换生灵孩子的魔法本质，扼杀梦华火花的闪耀。教宗策肋定二世和英诺森三世宣布通过十字军东征来进行对利沃尼亚的暴力改教。教宗敕令宣布与波罗的海原始教徒的战斗与参与耶路撒冷十字军东征同等重要。为了让妖精留在大地上，现在是时候阻止他们了。"
 destroy_inquisition_objective_decision_confirm:0 "结束火刑架的时代。"
 destroy_inquisition_objective_decision_before_last_date:0 "日期是1430年1月1日或更早"
 destroy_inquisition_objective_decision_custom1:0 "大裁判将不会发生。"
 destroy_inquisition_objective_decision_custom2:0 "解锁$prodigal_objective_decision$决议"
 prodigal_objective_decision:0 "浪子回头"
 prodigal_objective_decision_tooltip:1 "你将使浪子回忆起他们的起源。"
 prodigal_objective_decision_desc:0 "浪子已经忘记了他们在梦界的起源，现在是时候提醒他们自己是谁了。"
 prodigal_objective_decision_confirm:0 "回来吧。"
 prodigal_objective_decision_custom:0 "在地图上不能有对你有负好感的非妖精[independent_ruler|E]"
 prodigal_objective_decision_custom1:0 "所有其他超自然都将被重命名为浪子"
 prodigal_objective_decision_custom2:0 "非妖精超自然将一定接受你的要求臣服提议"
 pod1230objectives_fae.100.t:0 "老鼠预言"
 pod1230objectives_fae.100.desc:0 "十三世纪初，冬天变得漫长而寒冷，大雨下个不停。庄稼被淹没。道路变成了泥泞的沼泽地。饥荒和严寒使墓地满目疮痍。有关未来一场灾难性事件的预言梦被传诉，该事件据说将导致数百万梦种的死亡。细节模糊不清，但似乎涉及大批从日出处涌来的老鼠，成堆的燃烧尸体，跳舞的骷髅，黑化的手指和脚趾。一些妖精深信鼠族及其带有疾病的妖蛆盟友必须被消灭。\n你的预言家说，他们已经看到了一个比大散断更糟糕的黑暗未来，预言只揭露它起源于老鼠。你应该在这世纪将注意力集中阻止它的手段之一，以确保它不会发生。"
 pod1230objectives_fae.100.a:0 "鼠族和它们的盟友！"
 pod1230objectives_fae.100.b:0 "要防止老鼠，我们需要猫！"
 pod1230objectives_fae.100.c:0 "蒙古汗帐是罪魁祸首！"
 pod1230objectives_fae.101.t:0 "鼠族大谋"
 pod1230objectives_fae.101.desc:0 "卑鄙的鼠族确实酝酿了一个黑暗的计划，他们创造了有史以来最致命的疾病，被称为黑死病。你很高兴你在他们完全释放疾病之前阻止了他们。"
 pod1230objectives_fae.101.a:0 "肮脏的老鼠。"
 pod1230objectives_fae.102.t:0 "猫灾"
 pod1230objectives_fae.102.desc:0 "世界上每个人都喜欢猫了，老鼠预言不会实现……但我们可能有另一个问题要处理。"
 pod1230objectives_fae.102.a:0 "我的……"
 pod1230objectives_fae.103.t:0 "天罚"
 pod1230objectives_fae.103.desc:0 "由于你的努力，蒙古汗帐的发展速度正在减慢，你的预言家确认你阻止了蒙古在围攻中使用死老鼠的未来，那本可能会传播一种大流行病。"
 pod1230objectives_fae.103.a:0 "我是对的。"
 pod1230objectives_fae.120.t:0 "裁判所的终末"
 pod1230objectives_fae.120.desc:0 "裁判所的建立是散断的顶点，因为教会开始追求从世界上消除所有不受欢迎的超自然元素，包括妖精。但现在它已经结束了。"
 pod1230objectives_fae.120.a:0 "更多迷信！"
 pod1230objectives_fae.121.t:0 "浪子回头"
 pod1230objectives_fae.121.desc:0 "黑暗世界的所有其他超自然居民都曾是妖精，他们已经忘记了自己在梦界中的起源。现在他们已经恢复了理智。"
 pod1230objectives_fae.121.a:0 "欢迎回来。"
 POD_fae_maintenance.21.t:0 "大碎溃"
 POD_fae_maintenance.21.desc:0 "你没能阻止预言发生。\n最终，凡界和梦界之间被拉得很细的线开始断裂。这断裂就是[shattering|E]。它不仅粉碎了阿卡迪亚和地球之间的联系，而且粉碎了逆转它的希望。\n你必须选择一种选项来面对它。"
 POD_fae_maintenance.21.a:0 "化为换生灵，放弃永生。"
 POD_fae_maintenance.21.b:0 "逃往阿卡迪亚"
 POD_fae_maintenance.21.c:0 "封入永契堡"
 POD_fae_maintenance.22.t:0 "大碎溃"
 POD_fae_maintenance.22.desc:0 "最终，凡界和梦界之间被拉得很细的线开始断裂。这断裂就是[shattering|E]。它不仅粉碎了阿卡迪亚和地球之间的联系，而且粉碎了逆转它的希望。"
 POD_fae_maintenance.22.a:0 "好耶？"
 unlock_convert_to_catlover_scheme:0 "解锁[GetScheme('convert_to_catlover').GetTypeName][scheme|E]。"
 constantinian_objective_decision:0 "融入教会"
 constantinian_objective_decision_tooltip:1 "教会将把妖精视为神圣：天使、先知、行奇迹者和真正的受祝福者。"
 constantinian_objective_decision_desc:0 "君士坦丁派将教会视为一个需要揭示、研究和引导的谜团，而非敌对和阻止的敌人。一旦理解了凡人信仰的力量，或许连迷雾都会回归更加仁慈的平衡，妖精也能收获信徒的创意梦华。"
 constantinian_objective_decision_confirm:0 "建立君士坦丁派探题"
 constantinian_objective_decision_custom1:0 "$POD_splat_hunter_plural$将不再视妖精为大敌。相反，妖精将被视作天使、先知、行奇迹者和真正的受祝福者"
 constantinian_objective_decision_custom2:0 "能够招募[GetMaA('witchhunters').GetName]作为[men_at_arms|E]"
 pod1230objectives_fae.122.t:0 "君士坦丁派探题"
 pod1230objectives_fae.122.desc:0 "我们在天上的父，\n愿你的名被尊为圣，\n愿你的国早日降临，\n愿你的旨意成就在地上，如同成就在天上。\n求你赐给我们今天所需要的食物，\n求你宽恕我们的罪，就像我们宽恕得罪我们的人。\n求你不要让我们向试探——大碎溃——屈服，救我们脱离那板讷。\n因为国度、能力、荣耀，都是你的，直到永远。"
 pod1230objectives_fae.122.a:0 "阿门。"
 destroy_order_of_reason_objective_decision:0 "理性之外"
 destroy_order_of_reason_objective_decision_tooltip:1 "你将阻止理性之子给世界带来更多的板讷。"
 destroy_order_of_reason_objective_decision_desc:0 "学者们努力将世界束缚于理性和科学之中。他们对世界进行平庸的分类、定义和限制的努力，造成了使对神秘和不可控之力的信仰逐渐消逝的威胁。石匠兄弟会，古罗马戒律学社的继承者，在与规则兄弟会的新联盟中，试图用平庸的律法束缚现实，就像光辉奇艺的冷酷铁律的板讷律师一样。他们追踪灵脉，寻找他们称之为节点的梦华之源，然后将其耗尽并摧毁。公元1210年，石匠兄弟会用熟铁长管发射冷铁球，摧毁了迷雾峰的盟誓之地，这一物他们称之为“火炮”。据说狼顾的睿魔尔家族，曾经是赫尔墨斯法师，现在成为了吸血鬼，对石匠兄弟会的胜利做出了贡献。这些所谓的“理性之人”屠杀了他们在迷雾峰及其周围废墟中找到的每一个女巫和妖精。必须不惜一切代价阻止他们！"
 destroy_order_of_reason_objective_decision_confirm:0 "再无停滞"
 destroy_order_of_reason_objective_decision_before_last_date:0 "日期是1851年1月1日或更早"
 destroy_order_of_reason_objective_decision_custom:0 "理性之子[title|E]必须已被销毁\n你必须掌控蒂罗尔公国的因斯布鲁克锻铁兵工厂。"
 inert_cold_iron_objective_decision:0 "惰化寒铁"
 inert_cold_iron_objective_decision_tooltip:1 "你将改变科学“现实”，寻求一种方法来转化或以其他方式改变寒铁的属性，使其惰化失去作用。"
 inert_cold_iron_objective_decision_desc:0 "The Fae struggle to understand why Cold Iron harms them. It can cause the permanent destruction of a Fae spirit. The Founder of House Dougal gave his life to try and break cold iron's grip on the fae. Many believe that iron represents the force of the Sundering; the philosophical division between humankind and the Dreaming incorporated... made flesh. It was formed not by any 'thing,' but as a 'natural' effect when Banality reached a critical level. Some believe that iron is the \"anti-matter\" of Glamour. Others postulate that iron was poisoned by Balor, or that it may even be made from that demon's body. While this is ridiculous to most fae, two hard facts back up this theory. First, the members of House Balor seem to be immune to cold iron's effects. Secondly, many fae have dreams of Arcadia involving cold iron, suggesting that it exists in Arcadia as well. Perhaps cold iron houses some evil spirit, placed there by the Garou. Dougal's refining process that transforms cold iron into steel may drive the spirit off. If true, then the Garou may be able to infest other materials with this spirit. The Fae must study Cold Iron and somehow render it inert."
 inert_cold_iron_objective_decision_confirm:0 "免疫"
 inert_cold_iron_objective_decision_before_last_date:0 "日期是1510年1月1日或更早"
 arcadian_restoration_objective_decision:0 "阿卡迪亚光复"
 arcadian_restoration_objective_decision_tooltip:1 "你将带回[mythic_age|E]。"
 arcadian_restoration_objective_decision_desc:0 "滚滚长江东逝水，浪花淘尽英雄。是非成败转头空，青山依旧在，几度夕阳红。白发渔樵江渚上，惯看秋月春风。一壶浊酒喜相逢，古今多少事， 都付笑谈中。"
 arcadian_restoration_objective_decision_confirm:0 "终于"
 pod1230objectives_fae.130.t:0 "理性之外"
 pod1230objectives_fae.130.desc:0 "。"
 pod1230objectives_fae.130.a:0 "理性已屈服。"
 pod1230objectives_fae.131.t:0 "惰化寒铁"
 pod1230objectives_fae.131.desc:0 ""
 pod1230objectives_fae.131.a:0 "科学不再是，幻想的障碍了。"
 pod1230objectives_fae.140.t:0 "阿卡迪亚光复"
 pod1230objectives_fae.140.desc:0 "滚滚长江东逝水，浪花淘尽英雄。是非成败转头空，青山依旧在，几度夕阳红。白发渔樵江渚上，惯看秋月春风。一壶浊酒喜相逢，古今多少事， 都付笑谈中。"
 pod1230objectives_fae.140.a:0 "将梦界与地球合并。"
 fae_ending_tooltip:0 "随着阿卡迪亚与地球合并，你的游戏将结束，因为你熟知的世界将被永远改变。"
 pod1230objectives_fae.140.b:0 "我仍然有事情要做。"
