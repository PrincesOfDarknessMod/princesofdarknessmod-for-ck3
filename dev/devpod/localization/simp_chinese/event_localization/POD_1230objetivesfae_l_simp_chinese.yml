 pod1230objectives_fae.165.desc:0 "成事已毕。羊群已接纳妖精为他们的牧者和引导。教会将不再对妖精构成威胁，而所有妖精一族都应感谢[ROOT.Char.GetFullName]。赞美将永远歌颂[ROOT.Char.GetHouse.GetName]家族。\n\n地上和天上的每个妖精都需要考虑与神圣教会及其神圣的调停者——[ROOT.Char.GetHouse.GetName]的关系。祈求他们选择通往救赎的正义之路，否则地狱的巨口将永远等待着他们。救赎已经来临！\n\n凡人将以各种方式助力，创造宏伟的大教堂、壮丽的艺术和胜利的音乐，都是为了荣耀神圣和他的圣洁使者。让我们建造一座耀眼的山顶之城，成为对所有有心听到我们祥和歌声的人们希望和救赎的灯塔！"
