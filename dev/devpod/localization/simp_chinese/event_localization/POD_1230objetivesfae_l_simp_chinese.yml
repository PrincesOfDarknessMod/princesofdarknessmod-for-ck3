l_simp_chinese:
 black_death_prevented: "黑死病将不会发生。"
 shattering_prevented: "[Glossary('大碎溃','game_concept_shattering_desc')]将不会发生。"
 prevent_black_death_objective_decision_before_last_date: "日期是1347年1月1日或更早"
 prevent_black_death_rat_objective_decision: "鼠族阴谋"
 prevent_black_death_rat_objective_decision_tooltip: "你将试图阻止老鼠预言的实现。"
 prevent_black_death_rat_objective_decision_desc: "妖精先知们都梦见了关于未来的一场灾难性事件，这场事件将导致数百万梦种的死亡。细节模糊不清，但似乎涉及大批从东方涌来的老鼠，成堆的燃烧尸体，舞动的骷髅，黑化的手指和脚趾。一些妖精深信鼠族及其带有疾病的妖蛆附属必须被消灭。"
 prevent_black_death_rat_objective_decision_confirm: "制止黑死病"
 prevent_black_death_rat_objective_decision_custom: "在地图上不能有[GetReligionFamily('rf_wyrm').GetName][religion|E]信徒[independent_ruler|E]"
 prevent_black_death_cat_objective_decision: "猫咪！"
 prevent_black_death_cat_objective_decision_tooltip: "你将通过使每个人都崇拜猫来阻止老鼠预言。"
 prevent_black_death_cat_objective_decision_desc: "很明显，为了阻止老鼠预言，你应该让每个人都爱上猫！"
 prevent_black_death_cat_objective_decision_confirm: "喵！"
 prevent_black_death_anda_objective_decision: "阻止汗帐肆虐"
 prevent_black_death_anda_objective_decision_tooltip: "你将通过阻止蒙古人，针对他们的[Glossary('安答','podgloss.anda')]保镖来削弱他们，从而阻止老鼠预言的发生。"
 prevent_black_death_anda_objective_decision_desc: "那老鼠预言不是很清晰，但你有种预感，针对蒙古和[Glossary('安答','podgloss.anda')]也许会有帮助。"
 prevent_black_death_anda_objective_decision_confirm: "不再有劫掠"
 destroy_inquisition_objective_decision: "摧毁暗影裁判所"
 destroy_inquisition_objective_decision_tooltip: "你将摧毁暗影裁判所。"
 destroy_inquisition_objective_decision_desc: "教会和它裁判所对原始教徒和妖精进行着可怕地迫害。它以剑传教，折磨或焚烧那些信奉旧神和修行神秘技艺的人。它的牧师们通过洗礼仪式永远剥夺换生灵孩子的魔法本质，扼杀梦华火花的闪耀。教宗策肋定二世和英诺森三世宣布通过十字军东征来进行对利沃尼亚的暴力改教。教宗敕令宣布与波罗的海原始教徒的战斗与参与耶路撒冷十字军东征同等重要。为了让妖精留在大地上，现在是时候阻止他们了。"
 destroy_inquisition_objective_decision_confirm: "结束火刑架的时代"
 destroy_inquisition_objective_decision_before_last_date: "这一目标需要在[GetPlayer.MakeScope.ScriptValue('inquisition_spawn_year')|0]年前完成"
 destroy_inquisition_objective_decision_custom1: "大裁判将不会发生。"
 destroy_inquisition_objective_decision_custom2: "解锁$prodigal_objective_decision$决议"
 prodigal_objective_decision: "浪子回头"
 prodigal_objective_decision_tooltip: "你将使浪子回忆起他们的起源。"
 prodigal_objective_decision_desc: "根据妖精所说，吸血鬼、狼人、法师、木乃伊和幽灵都是妖精，他们已经忘记了自己在[UmbraGlossary('dreaming')]中的起源。虽然这些超自然种族各自的创世神话肯定与这一观点相矛盾，但梦界中存在的无限可能性肯定意味着这可能是真的。妖精将这些其他超自然生物称为浪子。浪子已经忘记了他们在[UmbraGlossary('dreaming')]的起源，现在是时候提醒他们自己是谁了。"
 prodigal_objective_decision_confirm: "回家吧，迷途的孩子们"
 prodigal_objective_decision_custom: "在地图上不能有对你有负好感的非妖精[independent_ruler|E]"
 prodigal_objective_decision_custom1: "所有其他超自然都将被重命名为浪子"
 prodigal_objective_decision_custom2: "浪子超自然将一定接受你的要求臣服提议"
 pod1230objectives_fae.100.t: "老鼠预言"
 pod1230objectives_fae.100.desc: "十三世纪初，冬天变得漫长而寒冷，大雨下个不停。庄稼被淹没。道路变成了泥泞的沼泽地。饥荒和严寒使墓地满目疮痍。有关未来一场灾难性事件的预言梦被传诉，该事件据说将导致数百万梦种的死亡。细节模糊不清，但似乎涉及大批从日出处涌来的老鼠，成堆的燃烧尸体，跳舞的骷髅，黑化的手指和脚趾。一些妖精深信鼠族及其带有疾病的妖蛆盟友必须被消灭。\n你的预言家说，他们已经看到了一个比大散断更糟糕的黑暗未来，预言只揭露它起源于老鼠。你应该在这世纪将注意力集中阻止它的手段之一，以确保它不会发生。"
 pod1230objectives_fae.100.a: "鼠族和它们的盟友！"
 pod1230objectives_fae.100.b: "要防止老鼠，我们需要猫！"
 pod1230objectives_fae.100.c: "蒙古汗帐是罪魁祸首！"
 pod1230objectives_fae.101.t: "鼠族大谋"
 pod1230objectives_fae.101.desc: "卑鄙的鼠族确实酝酿了一个黑暗的计划，他们创造了有史以来最致命的疾病，被称为黑死病。你很高兴你在他们完全释放疾病之前阻止了他们。"
 pod1230objectives_fae.101.a: "肮脏的老鼠。"
 pod1230objectives_fae.102.t: "猫灾"
 pod1230objectives_fae.102.desc: "世界上每个人都喜欢猫了，老鼠预言不会实现……但我们可能有另一个问题要处理。"
 pod1230objectives_fae.102.a: "我的……"
 pod1230objectives_fae.103.t: "天罚"
 pod1230objectives_fae.103.desc: "由于你的努力，蒙古汗帐的发展速度正在减慢，你的预言家确认你阻止了蒙古在围攻中使用死老鼠的未来，那本可能会传播一种大流行病。"
 pod1230objectives_fae.103.a: "我是对的。"
 pod1230objectives_fae.120.t: "裁判所的终末"
 pod1230objectives_fae.120.desc: "裁判所的建立是散断的顶点，因为教会开始追求从世界上消除所有不受欢迎的超自然元素，包括妖精。但现在它已经结束了。"
 pod1230objectives_fae.120.a: "更多迷信！"
 pod1230objectives_fae.121.t: "浪子回头"
 pod1230objectives_fae.121.desc: "黑暗世界的所有其他超自然居民都曾是妖精，他们已经忘记了自己在[UmbraGlossary('dreaming')]中的起源。现在他们已经恢复了理智。"
 pod1230objectives_fae.121.a: "欢迎回来。"
 POD_fae_maintenance.21.t: "大碎溃"
 POD_fae_maintenance.21.desc: "你没能阻止预言发生。\n最终，凡界和[UmbraGlossary('dreaming')]之间被拉得很细的线开始断裂。这断裂就是[Glossary('大碎溃','game_concept_shattering_desc')]。它不仅粉碎了[UmbraGlossary('arcadia')]和地球之间的联系，而且粉碎了逆转它的希望。\n你必须选择一种选项来面对它。"
 POD_fae_maintenance.21.a: "化为换生灵，放弃永生。"
 POD_fae_maintenance.21.b: "逃往阿卡迪亚"
 POD_fae_maintenance.21.c: "封入永契堡"
 POD_fae_maintenance.22.t: "大碎溃"
 POD_fae_maintenance.22.desc: "最终，凡界和[UmbraGlossary('dreaming')]之间被拉得很细的线开始断裂。这断裂就是[Glossary('大碎溃','game_concept_shattering_desc')]。它不仅粉碎了[UmbraGlossary('arcadia')]和地球之间的联系，而且粉碎了逆转它的希望。"
 POD_fae_maintenance.22.a: "好耶？"
 unlock_convert_to_catlover_scheme: "解锁$POD_convert_to_catlover_interaction$[interaction|E]。"
 constantinian_objective_decision: "融入教会"
 constantinian_objective_decision_tooltip: "教会将把妖精视为神圣：天使、先知、行奇迹者和真正的受祝福者。"
 constantinian_objective_decision_desc: "君士坦丁派将教会视为一个需要揭示、研究和引导的谜团，而非敌对和阻止的敌人。一旦理解了凡人信仰的力量，或许连迷雾都会回归更加仁慈的平衡，妖精也能收获信徒的创意梦华。"
 constantinian_objective_decision_confirm: "建立君士坦丁派探题"
 constantinian_objective_decision_custom1: "$POD_splat_hunter_plural$将不再视妖精为大敌。相反，妖精将被视作天使、先知、行奇迹者和真正的受祝福者"
 constantinian_objective_decision_custom2: "能够招募[GetMaA('witchhunters').GetName]作为[men_at_arms|E]"
 pod1230objectives_fae.122.t: "君士坦丁派探题"
 pod1230objectives_fae.122.desc: "我们在天上的父，\n愿你的名被尊为圣，\n愿你的国早日降临，\n愿你的旨意成就在地上，如同成就在天上。\n求你赐给我们今天所需要的食物，\n求你宽恕我们的罪，就像我们宽恕得罪我们的人。\n求你不要让我们向试探——大碎溃——屈服，救我们脱离那板讷。\n因为国度、能力、荣耀，都是你的，直到永远。"
 pod1230objectives_fae.122.a: "阿门。"
 destroy_order_of_reason_objective_decision: "超越理性"
 destroy_order_of_reason_objective_decision_tooltip: "你将阻止理性之子给世界带来更多的板讷。"
 destroy_order_of_reason_objective_decision_desc: "学者们努力将世界束缚于理性和科学之中。他们对世界进行平庸的分类、定义和限制的努力，造成了使对神秘和不可控之力的信仰逐渐消逝的威胁。石匠兄弟会，古罗马戒律学社的继承者，在与规则兄弟会的新联盟中，试图用平庸的律法束缚现实，就像光辉奇艺的冷酷铁律的板讷律师一样。他们追踪灵脉，寻找他们称之为节点的梦华之源，然后将其耗尽并摧毁。公元1210年，石匠兄弟会用熟铁长管发射冷铁球，摧毁了迷雾峰的盟誓之地，这一物他们称之为“火炮”。据说狼顾的睿魔尔家族，曾经是赫尔墨斯法师，现在成为了吸血鬼，对石匠兄弟会的胜利做出了贡献。这些所谓的“理性之人”屠杀了他们在迷雾峰及其周围废墟中找到的每一个女巫和妖精。必须不惜一切代价阻止他们！"
 destroy_order_of_reason_objective_decision_confirm: "再无停滞"
 destroy_order_of_reason_objective_decision_before_last_date: "日期是1851年1月1日或更早"
 destroy_order_of_reason_objective_decision_custom: "理性之子[title|E]必须已被销毁\n你必须掌控蒂罗尔公国的因斯布鲁克锻铁兵工厂。"
 inert_cold_iron_objective_decision: "惰化寒铁"
 inert_cold_iron_objective_decision_tooltip: "你将改变科学“现实”，寻求一种方法来转化或以其他方式改变寒铁的属性，使其惰化失去作用。"
 inert_cold_iron_objective_decision_desc: "妖精们努力理解为什么寒铁会伤害到它们。它可以永久性地摧毁一位妖精的灵。[GetScriptedCharacterByHistoryID('POD_fae_character_04').GetFirstName]为了试图打破寒铁对妖精的束缚而献出了自己的生命。许多人认为铁代表了大散断的力量；人类与[UmbraGlossary('dreaming')]之间的哲学分界……化为现实。它并不是由任何“事物”形成的，而是一种当板讷达到临界水平时的“自然”效应。妖精必须研究寒铁，并设法使其失去作用。"
 inert_cold_iron_objective_decision_confirm: "转换范式！"
 inert_cold_iron_objective_decision_before_last_date: "日期是1510年1月1日或更早"
 arcadian_restoration_objective_decision: "阿卡迪亚光复"
 arcadian_restoration_objective_decision_tooltip: "你将带回[Glossary('神话纪元','game_concept_mythic_age_desc')]。"
 arcadian_restoration_objective_decision_desc: ""
 arcadian_restoration_objective_decision_confirm: "终于"
 pod1230objectives_fae.130.t: "超越理性"
 pod1230objectives_fae.130.desc: "理性之子的阴谋已经瓦解。他们将世界束缚于理性与科学的阴谋已经破产。他们的寒铁工坊已经沉寂。随着睿魔尔被摧毁，他们与赫耳墨斯秘会的魔煞之战以不死族篡位者巫士的失败告终。统一的赫尔墨斯家族能够将全部注意力和愤怒转向石匠兄弟，以及与其志同道合的学者、吝啬鬼、拘谨的信仰者和其他板讷传播者的秘密联盟对迷雾峰的摧毁。不再有“理性”的哲学家，人类已经开始回归他们的古老信仰，并与妖精达成旧约，以理解这个奇幻世界并在其中生存下去。"
 pod1230objectives_fae.130.a: "天地间的万事万物，远非你们的哲学所能想象"
 pod1230objectives_fae.131.t: "惰化寒铁"
 pod1230objectives_fae.131.desc: "“自然哲学”家们错了，宇宙并不受刚性、可发现的法则所束缚。通过巨大的努力、时间、花费和意志的纯粹力量，你已经证明了所有追求贤者之石的炼金术师们所怀疑的事实。通过进行数千次实验，你坚持不懈，最终实现了你所追求的结果。现实会向那些有着思想和自信的人扭曲，使他们的愿望成真。如果像传说中炼金术师将铅变成黄金的低级追求是可能的，那么为何不能转化寒铁使它毁灭妖精的不朽灵魂的特性也被消除呢？尤里卡！你做到了！"
 pod1230objectives_fae.131.a: "现实由我决定！"
 pod1230objectives_fae.140.t: "阿卡迪亚光复"
 pod1230objectives_fae.140.desc: ""
 pod1230objectives_fae.140.a: "将梦界与地球合并。"
 fae_ending_tooltip: "随着[UmbraGlossary('arcadia')]与地球合并，你的游戏将结束，因为你熟知的世界将被永远改变。"
 pod1230objectives_fae.140.b: "我仍然有事情要做。"
 prevent_black_death_cat_objective_decision_custom1: "所有国王和皇帝都有[GetModifier('cat_story_modifier').GetNameWithTooltip][modifier|E]"
 prevent_black_death_cat_objective_decision_custom2: "能够招募[GetMaA('cats').GetName]作为[men_at_arms|E]"
 underbridge_kingdom_objective_decision: "桥底王"
 underbridge_kingdom_objective_decision_desc: "通过控制越来越多的桥梁，你将扩展桥底界成为一个强大的王国。你将获得你应得的一切。可怜那些无法支付你通行费的贫穷旅行者。"
 underbridge_kingdom_objective_decision_tooltip: "你将成为桥底王。"
 underbridge_kingdom_objective_decision_confirm: "没我允许，任何人都不得过我的桥"
 underbridge_kingdom_objective_decision_custom: "我将能使用夺桥之战[casus_belli|E]"
 underbridge_kingdom_objective_decision_riverside_county_contol_tt: "你[completely_control|E]了[GetTitleByKey('k_novgorod').GetNameNoTier]的所有河边[counties|E]（[SCOPE.ScriptValue('underbridge_kingdom_controlled_riverside_county_value')|0]/[SCOPE.ScriptValue('underbridge_kingdom_total_riverside_county_value')|0]）"
 underbridge_king_modifier: "桥底王"
 underbridge_empire_objective_decision: "桥底至高王"
 underbridge_empire_objective_decision_desc: "当整个东欧的河流都处于你的控制之下时，那么众多桥梁下的可怕空间将成为你的伟大领土。除非得到你的准许，没有人可以在汹涌的水流上行走。所有人都将向你付出应有的代价，而你可以轻松地将由纯粹噩梦构成生物带入这个世界，就像春游散步一般容易。"
 underbridge_empire_objective_decision_tooltip: "你将成为桥底至高王。"
 underbridge_empire_objective_decision_confirm: "没我允许，任何人都不得过我的桥"
 underbridge_empire_objective_decision_custom: "所有通过夺桥之战[casus_belli|E]夺取的桥边伯爵领都将成为[GetTitleByKey('e_underbridge').GetNameNoTier]的[de_jure|E][counties|E]"
 underbridge_empire_objective_decision_riverside_county_contol_tt: "你[completely_control|E]了[GetTitleByKey('e_shadow_curtain').GetNameNoTier]的所有河边[counties|E]（[SCOPE.ScriptValue('underbridge_empire_controlled_riverside_county_value')|0]/[SCOPE.ScriptValue('underbridge_empire_total_riverside_county_value')|0]）"
 underbridge_emperor_modifier: "桥底至高王"
 pod1230objectives_fae.150.t: "桥底王"
 pod1230objectives_fae.150.desc: "我已控制了越来越多的桥梁，扩展了我的桥底界，成为一个强大的王国。我将获得我应得的一切。可怜那些无法支付我通行费的贫穷旅行者。哀怒庭妖精和可怕的怪物聚集在我的旗帜和黑暗洪流之下。"
 pod1230objectives_fae.150.a: "没我允许，任何人都不得过我的桥"
 pod1230objectives_fae.151.t: "桥底至高王"
 pod1230objectives_fae.151.desc: "整个东欧的河流都处于你的控制之下，众多桥梁下的可怕空间成为你的伟大领土。除非得到你的准许，没有人可以在汹涌的水流上行走。所有人都将向你付出应有的代价，而你可以轻松地将由纯粹噩梦构成生物带入这个世界，就像春游散步一般容易。"
 pod1230objectives_fae.151.a: "没我允许，任何人都不得过我的桥"
 sidhe_house_dominance_beaumayn_objective_decision: "兄弟阋墙"
 sidhe_house_dominance_beaumayn_objective_decision_desc: "博迈恩世家因[GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName]和[GetScriptedCharacterByHistoryID('POD_fae_character_54').GetFirstName]两兄弟之间的激烈秘密争斗而分裂。世家的所有成员都困扰于[GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName]公爵的致命终极预言：铁之路是拯救还是毁灭？世家将通过一场秘密战争来确定自己的道路。"
 sidhe_house_dominance_beaumayn_objective_decision_tooltip: "你将击溃对方的论点——永久地。"
 sidhe_house_dominance_beaumayn_objective_decision_confirm: "一劳永逸地解决争论"
 brandell_victory_modifier: "归没法维护者"
 markesh_victory_modifier: "出离先驱"
 sidhe_house_dominance_dougal_objective_decision: "从金到钢"
 sidhe_house_dominance_dougal_objective_decision_desc: "杜伽尔世家作为铁匠，在仙族中享有盛誉。在政治的权谋中，许多人认为杜伽尔世家是冗余的，然而正是他们的器具推动了爱伦涅德世家的阴谋。热血沸腾的菲奥娜为他们美丽的工艺品争吵不休。格威狄昂世家的领主们则佩戴杜伽尔剑，身披杜伽尔甲，完成了伟大的壮举。而其他大部分世家只会争吵、生闷气和碌碌无为，杜伽尔世家却在工作、建设和创造。如今，青铜已被铁和钢所取代，杜伽尔世家需要建造一个庞大的武器和护甲库。杜伽尔的学徒和工坊将专注于创建这样一个军械库，但这并非易事。"
 sidhe_house_dominance_dougal_objective_decision_tooltip: "你将创建一个庞大的武器和盔甲库"
 sidhe_house_dominance_dougal_objective_decision_confirm: "铁匠的一击等于金匠的百击"
 dougal_victory_modifier: "从金到钢"
 sidhe_house_dominance_eiluned_objective_decision: "强化永契堡"
 sidhe_house_dominance_eiluned_objective_decision_desc: "秘密之世家与许多黑暗而神秘的存在和力量密谋，以收集魔法知识。凭借众多有天赋的先知，爱伦涅德世家得到了预警，因此他们寻求有备无患。凭借对未来的幻象和预言，爱伦涅德建筑师提出了复杂的防御工事，预测了各种可能的围攻，包括秘密通道、迷宫、箭孔、暗门和魔法陷阱。建造如此复杂的防御工事并非易事。"
 sidhe_house_dominance_eiluned_objective_decision_tooltip: "高瞻远瞩，精心建造堡垒。"
 sidhe_house_dominance_eiluned_objective_decision_confirm: "有备无患"
 eiluned_victory_modifier: "强化永契堡"
 sidhe_house_dominance_fiona_objective_decision: "伟大情人"
 sidhe_house_dominance_fiona_objective_decision_desc: "对于菲奥娜来说，被爱远比被恐惧更好。几乎所有的菲奥娜都是浪漫主义者；他们欣然陶醉于宫廷式的爱情，围绕着一切涉及心灵的事物建立起复杂的游戏和仪式。菲奥娜的宫廷是美丽和激情的场所，常常充满着嬉戏的阴谋、秘密的约会和禁忌的爱情。菲奥娜可以通过在性爱方面具备出色的技巧而获得声名，进一步增加他们已经超凡的吸引力，并拥有各种各样的有用的、强大的情人，这对他们未来的计划非常有帮助。"
 sidhe_house_dominance_fiona_objective_decision_tooltip: "你需拥有六位有趣的恋人。"
 sidhe_house_dominance_fiona_objective_decision_confirm: "用超越爱的爱去爱"
 sidhe_house_dominance_fiona_objective_decision_custom: "有#V 3#!位伟人[lovers|E]"
 fiona_victory_modifier: "伟大情人"
 sidhe_house_dominance_gwydion_objective_decision: "真王"
 sidhe_house_dominance_gwydion_objective_decision_desc: "随着大散断，达南神族已经离开地球前往[UmbraGlossary('arcadia')]。格威狄昂世家曾习惯于游侠骑士的角色，随着大散段，他们意识到了新的责任——领导所有的妖精。现在，格威狄昂世家有必要宣称土地为自有，并保护这些领地免受迷失和绝望的侵害。格威狄昂·阿普·唐，格温内斯国王[GetScriptedCharacterByHistoryID('POD_fae_character_84').GetFirstName]的侄子，可以追溯到欧格玛和达努本人。传说中，[GetScriptedCharacterByHistoryID('POD_fae_character_03').GetFirstName]领主亲自见证了第一位统治者的加冕，并将一对巨大的灰色狮鹫赠送给新领主。他声称：“如果你的臣民的心中曾有疑虑，让他们注视这对狮鹫，它们将成为真正至高王的使者。”格威狄昂世家的领主们拥有勇气、雄心和合法的血统，他们将引领所有的喜乐廷仙族进入一个新的黄金时代。除了真王，还有谁能追寻并驾驭雷霆霹雳——光明之剑——和平使者之刃——[GetPODArtifact('caliburn_link').GetName]呢！"
 sidhe_house_dominance_gwydion_objective_decision_tooltip: "你必须长期统治众多永契堡，保护着受人尊敬的梦华之地，获得了美妙的宝物，并且有讲述功绩的伟大史诗来向所有人证明格威狄昂世家，这将使所有妖精相信你的传奇辉煌。最后，找到真王之剑——亚瑟王之剑——[GetPODArtifact('caliburn_link').GetName]将证明你无可否认的威严。"
 sidhe_house_dominance_gwydion_objective_decision_confirm: "加冕！"
 sidhe_house_dominance_gwydion_objective_decision_custom: "你必须从[great_chasm|E]取回[GetPODArtifactName('caliburn_link')]"
 gwydion_victory_modifier: "真王"
 sidhe_house_dominance_liam_objective_decision: "凡人之歌"
 sidhe_house_dominance_liam_objective_decision_desc: "凡人的想象力已经被教会的框架所束缚。利亚姆世家引领妖精努力理解教会对人类的神秘控制力。要么最具暴虐性质的教会组织需要被中和，要么教会需要妖精的引导来远离板讷。如果利亚姆世家成功，他们可以引导人类的成长朝着创造力的方向发展。"
 sidhe_house_dominance_liam_objective_decision_tooltip: "整合或废弃教会"
 sidhe_house_dominance_liam_objective_decision_confirm: "站在歌之主前吧"
 sidhe_house_dominance_liam_objective_decision_custom1: "你达成了$destroy_inquisition_objective_decision$[decision|E]"
 sidhe_house_dominance_liam_objective_decision_custom2: "你的信仰是[GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]，且达成了$constantinian_objective_decision$[decision|E]"
 sidhe_house_dominance_liam_objective_decision_custom3: "在地图上不能有[GetTrait('supehunter').GetName( GetPlayer )][independent_ruler|E]"
 liam_victory_modifier: "凡人之歌"
 sidhe_house_dominance_aesin_objective_decision: "伫立中土"
 sidhe_house_dominance_aesin_objective_decision_desc: "被钉死之神的信徒已经遍布于北欧各地，他们将人们驱离与阿萨神族和华纳神族的契约。被称为[GetFaithByKey('viaeinherjar').GetName]的吸血鬼冒名顶替者占据着[GetTitleByKey('e_midgard').GetNameNoTier]的古老神庙，包括乌普萨拉，他们将我们古老的仪式扭曲成了板讷的血腥邪教。[GetFaithByKey('getoffenris').GetName]在[GetTitleByKey('k_fimbul_winter').GetNameNoTier]的北方荒野游荡，必须被制服。[GetTitleByKey('d_crystal_fortress').GetNameNoTier]掌握在[GetFaithByKey('summer_court').GetName][GetTrait('changeling').GetName( GetPlayer )][GetDynastyByID( 'POD_fae_dynasty_gwydion' ).GetBaseName]世家的手中，而它应该是我们的。我们将拿起我们古老而神圣的武器，用鲜血夺回我们的家园。"
 sidhe_house_dominance_aesin_objective_decision_tooltip: "为阿萨夺回整个米德加尔德"
 sidhe_house_dominance_aesin_objective_decision_confirm: "宁为光荣而死，不为耻辱而活"
 aesin_victory_modifier: "中土存留"
 sidhe_house_dominance_ailil_objective_decision: "终结四季之战"
 sidhe_house_dominance_ailil_objective_decision_desc: "艾力世家以权力为生，通过外交和阴谋磨练了自己的技巧。喜乐廷妖精背叛了王位的季节性更替，从而剥夺了艾力世家合法的统治权。为了恢复平衡，四季之战必须结束。如果艾力世家能够结束四季之战，他们在所有仙族世家中的显赫将无可争议。"
 sidhe_house_dominance_ailil_objective_decision_tooltip: "结束四季之战或宣称整个爱尔兰并获得认可"
 sidhe_house_dominance_ailil_objective_decision_confirm: "凡事都有定季，凡事都有定时"
 sidhe_house_dominance_ailil_objective_decision_custom: "四季之战斗争已结束"
 ailil_victory_modifier: "终结四季之战"
 sidhe_house_dominance_balor_objective_decision: "弗摩尔族传承"
 sidhe_house_dominance_balor_objective_decision_desc: "巴烙世家可以追溯到一系列与弗摩尔族的血脉混合的仙族。他们相信无尽之冬即将到来，需要有强有力的手来引导妖精度过这个时期。通过与$glossary_wyrm$的联系，他们寻求哀怒廷与黑螺旋舞者和弗摩尔族之间的联盟。鉴于巴烙世家与弗摩尔族之间的祖先关系，通过一种强大的仪式，将妖精与强大的忌灵融合，创造出妖精–堕妖混血——堕魔，这是有可能的。"
 sidhe_house_dominance_balor_objective_decision_tooltip: "与忌灵融合，成为妖精堕妖混合体"
 sidhe_house_dominance_balor_objective_decision_confirm: "召唤节点爬行者"
 balor_victory_modifier: "弗摩尔族"
 sidhe_house_dominance_daireann_objective_decision: "医师战士"
 sidhe_house_dominance_daireann_objective_decision_desc: "世家通过[GetScriptedCharacterByHistoryID('POD_fae_character_21').GetFirstName]治愈了一位格威狄昂领主而获得了他们的贵胄地位，但是他们通过他们的勇士[GetScriptedCharacterByHistoryID('POD_fae_character_88').GetFirstName]的英勇行为获得了真正的尊重。戴瑞恩非常清楚，能进行治愈的手也能伤害。一杯子可以容纳毒药，也可以容纳解药。一把刀既可以用来手术，也可以用来切断生命的纽带。"
 sidhe_house_dominance_daireann_objective_decision_tooltip: "同时发展你的战争和医疗能力"
 sidhe_house_dominance_daireann_objective_decision_confirm: "万物皆有季节"
 daireann_victory_modifier: "医师战士"
 sidhe_house_dominance_leanhaun_objective_decision: "恋难舍的诅咒"
 sidhe_house_dominance_leanhaun_objective_decision_desc: "[GetScriptedCharacterByHistoryID('POD_fae_character_15').GetFirstName]身上的秘密诅咒延伸到了她整个世家，使其成员在没有乱梦凡人的情况下迅速衰老。有预言说这个诅咒将“直到星星哭泣鲜血，大地在你脚下变得寒冷”，这似乎不太可能在短期内发生。通常，恋难舍一次只会迷诱并乱梦于一位凡人受害者。有人猜测，如果有足够多的梦种被培养，并且这些梦种的梦华数量众多，诅咒的影响可能会减轻，甚至消除。"
 sidhe_house_dominance_leanhaun_objective_decision_tooltip: "利用足够的梦种来减轻诅咒"
 sidhe_house_dominance_leanhaun_objective_decision_confirm: "我们的痛苦可能成为我们的本分"
 leanhaun_victory_modifier: "恋难舍的诅咒已受削弱"
 sidhe_house_dominance_varich_objective_decision: "罗斯之灵"
 sidhe_house_dominance_varich_objective_decision_desc: "元素妖，天地之灵，一直是[GetScriptedCharacterByHistoryID('POD_fae_character_19').GetFirstName]的仆人，他们的子民。罗斯的土地曾经充满了元素妖。对于妖精来说，诸灵是一切的一部分：大地、河流、他们的永企堡和无尽的环绕着它们的原野。瓦里克了解如何取悦这些灵魂，以及如何利用它们。炉灶和家园之灵与它们的锚的规模和壮丽程度以及对它们的尊重程度一样强大和有帮助。没有它们，瓦里克的领地将不完整，而且瓦里克世家的成员不会故意冒犯这些有益的灵类。通过将更多的元素妖变为附庸，加强瓦里克世家的力量。"
 sidhe_house_dominance_varich_objective_decision_tooltip: "引领俄罗斯文化，并拥有许多元素妖容器"
 sidhe_house_dominance_varich_objective_decision_confirm: "没有不好的土地，只有不好的地主"
 varich_victory_modifier: "罗斯之灵"
 sidhe_house_dominance_scathach_objective_decision: "莫泊桑神谕的敕令"
 sidhe_house_dominance_scathach_objective_decision_desc: "自[GetScriptedCharacterByHistoryID('POD_fae_character_17').GetFirstName]在树之战中击败了弗摩尔族的白王奥克崔拉齐以来，莫泊桑神谕的一直是斯卡哈世家的决定性力量。虽然对于世家成员来说，莫泊桑神谕的敕令并不总是合乎逻辑的，但世家统一遵循这些敕令。然而，莫泊桑神谕预见到特瑟拉之剑被带入[UmbraGlossary('dreaming')]之心将会带来灾难，因此斯卡哈世家袭击了试图将其移动的格威狄昂世家。在随后的流血冲突中，剑消失在周围的梦界中。战斗的政治后果导致斯卡哈世家被喜乐廷流放和排斥。尽管如此，世家成员仍然遵循莫泊桑神谕的敕令。尽管有这种团结，世家在兼顾留守换生灵和逃往[UmbraGlossary('arcadia')的大多数仙族之间产生了分歧，而[GetScriptedCharacterByHistoryID('POD_fae_character_87').GetFirstName]和她的首生妖精追随者则在[UmbraGlossary('deep_dreaming')]的[UmbraGlossary('sea_of_silver')]中寻找能够保护秋暮世界并击败弗摩尔族的东西。"
 sidhe_house_dominance_scathach_objective_decision_tooltip: ""
 sidhe_house_dominance_scathach_objective_decision_confirm: "坚守道途"
 sidhe_house_dominance_scathach_objective_decision_custom: "[Glossary('大碎溃','game_concept_shattering_desc')]已被阻止"
 scathach_victory_modifier: "莫泊桑神谕的敕令"
 sidhe_house_dominance_danaan_objective_decision: "梦界守卫"
 sidhe_house_dominance_danaan_objective_decision_desc: "达南世家漫游于[UmbraGlossary('dreaming')]中的众多路径。他们守护着仙路，开辟新的小径。他们引导着梦种，并通过他们与龙之誓约获得了许多奇魅的青睐。当世家中的领导者在[UmbraGlossary('dreaming')]中远行后，也许能够召集一支令人印象深刻的奇魅军团，在合适的时机释放到秋暮世界上。"
 sidhe_house_dominance_danaan_objective_decision_tooltip: "游历世界和[UmbraGlossary('dreaming')]，了解其中的秘密，打造一支奇魅军团。"
 sidhe_house_dominance_danaan_objective_decision_confirm: "两条路在迷障中分岔，我选择了人迹罕至的那条"
 danaan_victory_modifier: "寻求梦卫"
 pod1230objectives_fae.160.t: "铁之分裂"
 pod1230objectives_fae.160.desc: "关于公爵[GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName]最后的致命预言的辩论已经以对立观点的毁灭来解决。通过鲜血，世家的团结得以恢复，而你对博迈恩世家的领导地位是毋庸置疑的。"
 pod1230objectives_fae.160.a: "[GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName]的追随者胜利并将强制执行归没法！"
 pod1230objectives_fae.160.b: "出离先驱将带领我们行于铁之路"
 pod1230objectives_fae.161.t: "从金到钢"
 pod1230objectives_fae.161.desc: "尽管花费巨大，你领导的杜伽尔世家的工匠大师们还是建造出一座传奇中的强大武器库。有了这样的武器，妖精们可以征服整个世界。成千上万的人持械而立，渴望着信号的到来，迎接飞升的时刻！"
 pod1230objectives_fae.161.a: "准备作战！准备作战！"
 pod1230objectives_fae.162.t: "强化永契堡"
 pod1230objectives_fae.162.desc: "有预警就有准备。凭借你对未来可能性的超自然洞察，爱伦涅德世家的建筑师们构建了精巧的防御工事，能够抵御任何形式的围攻。你的防御设施里充满了秘密通道、迷宫、箭孔、暗门和魔法陷阱。最终，你感到安全了。"
 pod1230objectives_fae.163.t: "最伟大的恋人"
 pod1230objectives_fae.163.desc: "吟游诗人将永远满怀渴望地歌颂你的浪漫冒险。你从象征欲望的神话人物——羊人那里学习了爱的艺术。你体现了仙族最美丽的那一份美。你驯服了一颗狂暴的狼人心，并将它们束缚在你的欲望之下。伟大的人们会放下他们最伟大的计划，只为在你的床上度过一个夜晚。众人都会爱上你，然后绝望！"
 pod1230objectives_fae.163.a: "爱我，爱我，说你爱我"
 pod1230objectives_fae.164.a: "现在，所有人都可以顶礼膜拜"
 pod1230objectives_fae.165.t: "凡人之歌"
 pod1230objectives_fae.165.desc: "成事已毕。羊群已接纳妖精为他们的牧者和引导。教会将不再对妖精构成威胁，而所有妖精一族都应感谢[ROOT.Char.GetFullName]。赞美将永远歌颂[ROOT.Char.GetHouse.GetName]世家。\n\n地上和天上的每个妖精都需要考虑与神圣教会及其神圣的调停者——[ROOT.Char.GetHouse.GetName]的关系。祈求他们选择通往救赎的正义之路，否则地狱的巨口将永远等待着他们。救赎已经来临！\n\n凡人将以各种方式助力，创造宏伟的大教堂、壮丽的艺术和胜利的音乐，都是为了荣耀神圣和他的圣洁使者。让我们建造一座耀眼的山顶之城，成为对所有有心听到我们祥和歌声的人们希望和救赎的灯塔！"
 pod1230objectives_fae.165.a: "哈利路亚！"
 pod1230objectives_fae.170.t: "中土存留"
 pod1230objectives_fae.170.desc: "随着米德加尔德上所有超自然生物都屈服于你的统治，斯堪的纳维亚的基督教化开始逆转。北欧人将尊崇古老的信仰，敬仰阿萨作为大地上的神明。\n\n“听从我的话，各个阶层的人们，海姆达尔的伟大和平凡的子民。你们召唤我们，阿萨，来讲述我们记忆中最古老的神与人之间的事迹。”"
 pod1230objectives_fae.170.a: "我的渡鸦，每日飞过全世界。"
 pod1230objectives_fae.171.t: "四季艾力"
 pod1230objectives_fae.171.desc: "凭借你的谋略和外交手腕，你成功地结束了长期以来分裂仙族的可怕冲突。在你的领导下，艾力世家超越了其他仙族世家之间的琐碎争斗。如今，随着你世家的崛起，仙族的努力可以集中在与人类更替古老契约上。他们将再次相信，并且永远如此。"
 pod1230objectives_fae.171.a: "一段战争。一段和平。"
 pod1230objectives_fae.172.t: "弗摩尔族到永远"
 pod1230objectives_fae.172.a: "吾等既是堕魔！"
 pod1230objectives_fae.173.t: "医师战士"
 pod1230objectives_fae.173.desc: "作为戴瑞恩世家的领袖，你努力展示了医师和战士的双重本质。你的手可以治愈，也可以伤害。你就像一个杯子，可以容纳毒药或解药，就像一把刀可以用来治愈，也可以割断生命的纽带。"
 pod1230objectives_fae.173.a: "医师战士"
 pod1230objectives_fae.174.t: "恋难舍的诅咒"
 pod1230objectives_fae.174.desc: "作为恋难舍世家的领袖，你发现了一种减轻整个宗族的诅咒的方法。与其只在迫切需要时从一个被乱梦的凡人身上获取，你培养了一个庞大的凡人群体进行收割，其中包括一些充满梦华的重要人物。通过反复汲取如此庞大的梦华源泉，你成功地减轻了诅咒的影响。"
 pod1230objectives_fae.174.a: "恋难舍的诅咒"
 pod1230objectives_fae.175.t: "罗斯之灵"
 pod1230objectives_fae.175.desc: "作为瓦里克世家的领袖，你与罗斯土地上的自然之灵建立了紧密的联系。对于妖精来说，诸灵是一切的一部分：大地、河流、他们的居所以及周围无尽的针叶林。你知道如何取悦这些灵类，也知道如何利用它们。家庭和家园之灵与其锚的规模和壮丽一样强大而有帮助，也与你对它们的尊敬程度有关。贵族和仆人之间的义务是双向的，因此元素妖准备按照你的意愿行动。"
 pod1230objectives_fae.175.a: "他们是美好土地的诸灵。"
 pod1230objectives_fae.180.t: "莫泊桑神谕的敕令"
 pod1230objectives_fae.180.a: "一如既往，我们向莫泊桑神谕致敬"
 pod1230objectives_fae.181.t: "梦界守卫"
 pod1230objectives_fae.181.desc: "作为达南世家的领袖，你曾在[UmbraGlossary('dreaming')]中漫游无数路径。如今，你守护着这些仙路，并开辟新的道路。你为许多梦种充当了向导。通过对龙之誓约的守护，你获得了许多奇魅的青睐。你已经拥有了一支令人印象深刻的奇魅军团，它们等待着你的命令，甚至愿意在你的召唤下入侵秋暮世界。"
 pod1230objectives_fae.181.a: "防卫通往阿卡迪亚的仙路！"
