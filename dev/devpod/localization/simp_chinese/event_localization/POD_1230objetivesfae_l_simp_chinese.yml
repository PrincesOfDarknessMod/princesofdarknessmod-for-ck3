 underbridge_empire_objective_decision_artifact_cauldron_of_fear: "你必须拥有[GetPODArtifactName('cauldron_of_fear_link')]"
 pod1230objectives_fae.172.desc.start: "巴烙世家可以追溯到一系列与弗摩尔族的血脉混合的仙族。无尽之冬即将到来，无论他们是否同意你的统治，你都需要引导妖精度过这个时期。你已经准备好一种强大的仪式，将你的妖精本质与强大的忌灵融合，创造出妖精–堕妖混血——堕魔。巴烙的水晶眼发着暗淡的红光，散着巨大的热量。"
 pod1230objectives_fae.172.desc.steaming_spear_of_vengeance: "握着[GetPODArtifact('steaming_spear_of_vengeance_link').GetName]，你舔着刃上的热血，感受着愤怒充盈自己的身体。"
 pod1230objectives_fae.172.desc.cauldron_of_fear: "准备好那恶心而神秘的混合物后——你深深地用[GetPODArtifact('cauldron_of_fear_link').GetName]饮下。"
 pod1230objectives_fae.172.desc.blood_dross: "碾碎糖晶小瓶，喝下血渣中的吸血鬼之血，你充满了黑暗梦华。"
 pod1230objectives_fae.172.desc.end: "你打开通往[umbra|E]的仙路，召唤出节点爬行者。\n空气中出现了黑色的闪光，伴随着颤动的颤音呻吟。你的皮肤感觉像指甲刮过黑板一样。空气中弥漫着一种致癌疾病的恶臭。那条$glossary_wyrm$属灵变成了可憎和可怕的化身。它的爪子和牙齿撕开了你的肌肤，猛烈地插入你的胸腔。你被剧烈的疼痛所充斥。然后……\n我们永远团结在一起。"
 underbridge_kingdom_objective_decision_custom2: "$unlocks_sailable_major_rivers$"
 underbridge_kingdom_objective_decision_custom3: "$culture_parameter_culture_can_raid_at_sea_even_if_feudal_no_restrictions$"
 pod1230objectives_fae.162.a: "让我的敌人来吧——他们会被石头砸死！"
 pod1230objectives_fae.164.t.king: "真王加冕"
 pod1230objectives_fae.164.t.queen: "真女王加冕"
 pod1230objectives_fae.164.desc.king: "在你的领导下，格威狄昂世家通过英勇的努力证明自己是所有仙族中最高贵的存在。还有谁能够追寻并驾驭雷霆霹雳——光明之剑——和平使者之刃——[GetPODArtifact('caliburn_link').GetName]，除了你这位真正的国王！所有妖精都必须向你的威严俯首，承认你的绝对主权。"
 pod1230objectives_fae.164.desc.queen: "在你的领导下，格威狄昂世家通过英勇的努力证明自己是所有仙族中最高贵的存在。还有谁能够追寻并驾驭雷霆霹雳——光明之剑——和平使者之刃——[GetPODArtifact('caliburn_link').GetName]，除了你这位真正的国王！所有妖精都必须向你的威严俯首，承认你的绝对主权。"
 pod1230objectives_fae.180.desc.fae: "尽管莫泊桑神谕的敕令对于世家成员来说并不总是合乎常理，但世家仍然一致遵循。作为斯卡哈世家的首生妖精领袖，你曾踏上[UmbraGlossary('deep_dreaming')]和[UmbraGlossary('sea_of_silver')]的探索之旅，寻找被预言的物事。这是否足够呢？"
 pod1230objectives_fae.180.desc.changeling: "尽管莫泊桑神谕的敕令对于世家成员来说并不总是合乎常理，但世家仍然一致遵循。作为斯卡哈世家的换生灵领袖，你严格遵循着斯卡哈的命令，即使面对不断上升的板讷，也要留在秋暮世界。这样就够了吗？"
 become_santa_objective_decision: "成为圣诞老人"
 become_santa_objective_decision_desc: "你有一个特别的疯狂计划，以避免随着大碎溃而失去永生。每年的耶鲁节，你将定期分发奇魅玩具给无数孩子，因为他们对你的信仰，你将永生。他们会给你写信请求援助。他们会尊重古老传统，并留下供品来满足你无尽的饥饿。"
 become_santa_objective_decision_before_last_date: "你必须在黑死病和大碎溃到来前成为圣诞老人！"
 become_santa_objective_decision_winter_capital: "你的首都必须处于冬季"
 become_santa_objective_decision_court_antiquarian_excellent: "你有一位具有良好[aptitude|E]的[GetTrait('boggan').GetName( GetPlayer )]或[GetTrait('nocker').GetName( GetPlayer )][GetCourtPositionType('antiquarian_court_position').GetName()]"
 become_santa_objective_decision_tooltip: "每年的耶鲁节，你都会向无数儿童分发奇魅玩具，从而获得永生。"
 become_santa_objective_decision_deer_pooka: "你需要有有至少一位有[GetModifier('POD_pooka_deer_affinity_modifier').GetNameWithTooltip]的[GetTrait('pooka').GetName( GetPlayer )]廷臣。圣诞老人需要驯鹿！"
 become_santa_objective_decision_elves: "你有至少三位[GetTrait('nocker').GetName( GetPlayer )]和至少三位[GetTrait('boggan').GetName( GetPlayer )]作为廷臣。圣诞老人的工场需要“圣诞精灵”。"
 become_santa_objective_decision_confirm: "我将成为圣诞老人，礼物使者"
 become_santa_objective_decision_louhi: "邪恶的[GetScriptedCharacterByHistoryID('790633').GetFirstName]可能会试图阻止你的飞升，她必须死或处于[Glossary('蛰眠','game_concept_torpor_desc')]。"
 become_santa: "你成为了圣诞老人！"
 pod1230objectives_fae.1000.t: "永恒的圣诞老人！"
 pod1230objectives_fae.1000.a: "嗬！嗬！嗬！"
 pod1230objectives_fae.1000.desc: "完成了！无数孩子已经收到了奇魅礼物。无数孩子相信你！他们的梦想使你充满了无尽的梦华！世界可能被血腥的战争、可怕的瘟疫、可怕的裁判和压抑人心的板讷所困扰，但你将永存！\n\n#EMP “在今天，各地方，\n众孩童，高声唱，\n赞美主，世之王，\n降世为怜救我；\n天父将祂赐我。\n\n主耶稣，来世上，\n祂受罚，我得安，\n伯利恒，马槽旁，\n祇有牛马相伴，\n以身为主蔽寒。\n\n有天星，发亮光，\n自东方，领三王，\n屈身跪主牀旁，\n黄金，没药，乳香，\n献给主新生王。\n\n在今天，天使唱，\n各地方，声嘹亮，\n赞美主，天上王，\n降世为怜救我，\n爱与平安赐我。\n\n同来赞美主，同来赞美主，\n在天上，至高处，荣耀归与上主！”#!"
 inert_cold_iron_objective_decision_no_murder: "寒铁将被惰化，不再威胁妖精之灵。所有首生妖精将无法作为谋杀计谋的目标。"
 prodigal_objective_decision_osiris_flail: "你必须有[GetPODArtifactName('osiris_flail_link')]，它记录了所有的历史。"
 prodigal_objective_decision_tapestry_of_fate: "你必须有[GetPODArtifactName('tapestry_of_fate_link')]，它记录了所有[Glossary('真名','podgloss.truename')]，以及[UmbraGlossary('dreaming')]的宿命。"
 prodigal_objective_decision_book_of_nod: "你必须合成[GetPODArtifactName('book_of_nod_link')]，它包含了该隐之子的历史。"
 prodigal_objective_decision_baizetu: "你需要合成五份[GetPODArtifactName('baizetu_link')]，一本传说中黄帝书写的宝图，据说它包含了所有11520种超自然生物的秘密。"
