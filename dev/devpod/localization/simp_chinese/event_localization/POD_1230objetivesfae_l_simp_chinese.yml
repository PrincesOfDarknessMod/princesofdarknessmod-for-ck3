 brandell_victory_modifier:0 "归没法维护者"
 markesh_victory_modifier:0 "出离先驱"
 sidhe_house_dominance_dougal_objective_decision:0 "从金到钢"
 sidhe_house_dominance_dougal_objective_decision_desc:0 "House Dougal is renowned among the Sidhe as smiths. In the machinations of politics, many believe that House Dougal is superfluous, but it is their devices that fuel the intrigues of House Eiluned. The hot-blooded Fiona squabble over their beautiful artifices. The lords of House Gwydion perform their great deeds with Dougal swords, clad in Dougal mail. While most other houses squabble, pout, and piddle, Dougal works, builds, and creates. Now that Bronze has been surpassed by Iron and Steel, House Dougal needs to create a vast repository of weapons and armor. The journeymen and workshops of the Dougal will be focused on the creation of such an armory, but it will not come cheap."
 sidhe_house_dominance_dougal_objective_decision_tooltip:0 "你将创建一个庞大的武器和盔甲库"
 sidhe_house_dominance_dougal_objective_decision_confirm:0 "铁匠的一击等于金匠的百击。"
 dougal_victory_modifier:0 "从金到钢"
 sidhe_house_dominance_eiluned_objective_decision:0 "强化永契堡"
 sidhe_house_dominance_eiluned_objective_decision_desc:0 "The House of Secrets has conspired with many dark and mysterious beings and powers to gather magical knowledge. With many gifted seers, the Eiluned are forewarned and thus seek to be forearmed. With visions and prophecies of the future, Eiluned architects propose elaborate fortifications that anticipate any kind of siege filled with secret passages, labyrinths, bolt holes, murder holes, and magical cantrips traps. The building of such elaborate fortifications will not come cheap."
 sidhe_house_dominance_eiluned_objective_decision_tooltip:0 "高瞻远瞩，精心建造堡垒。"
 sidhe_house_dominance_eiluned_objective_decision_confirm:0 "有备无患"
 eiluned_victory_modifier:0 "强化永契堡"
 sidhe_house_dominance_fiona_objective_decision:0 "伟大情人"
 sidhe_house_dominance_fiona_objective_decision_desc:0 "For the Fionna, it is far better to be loved than fear. Practically all Fiona are Romanticists; they gleefully indulge in courtly love and build elaborate games and rituals around all affairs of the heart. Fiona courts are places of beauty and passion, often filled with playful intrigues, secret trysts, and forbidden loves. Fionna can gather fame by having great skill in lovemaking, increasing their already supernatural attractiveness, and also having varied and powerful paramours that are useful in their future schemes."
 sidhe_house_dominance_fiona_objective_decision_tooltip:0 "你将拥有六位有趣的恋人。"
 sidhe_house_dominance_fiona_objective_decision_confirm:0 "我们用超越爱的爱去爱"
 sidhe_house_dominance_fiona_objective_decision_custom:0 "有#V 3#!位伟人[lovers|E]"
 fiona_victory_modifier:0 "伟大情人"
 sidhe_house_dominance_gwydion_objective_decision:0 "真王"
 sidhe_house_dominance_gwydion_objective_decision_desc:0 "With the Sundering, the Tuatha de Danaan have left Earth for Arcadia. House Gwydion long accustomed to the role of knight-errant has with the Sundering recognized a new responsibility — too lead all the Fae. Now it was necessary for House Gwydion to claim lands as their own and to guard these holdings against the depredations of the lost and desperate. The Gwydion fab Don, nephew to the Venedotian king, Math fab Mathonwy, has a clear line of descent from Ogma and Danu herself. Tales say that Lord Gwydion was present for the coronation of the first High King ever to rule and that he made a present out of a pair of huge grey griffons to the new lord. He claims, 'If ever doubt claims the heart of your subjects let them look to the griffons, who will be the heralds of the true High King.' The lords of House Gwydion have bravery, ambition and lineage to rightfully lead all Seelie Sidhe to a renewed Golden Age. Who else could quest to find and wield the thuderbolt — the Sword of Light — the peace-makers's blade — Caliburn, but the True King!"
 sidhe_house_dominance_gwydion_objective_decision_tooltip:0 "You must prove to all House Gwydion is known throughout the world through long reign of many freehold, securing revered sites of glamour, acquiring wonderful artifacts and having great epics told of your exploits will convince all Fae of your legendary splendor. Finally, a quest to find the sword of the True King — Excalibur — Caliburn will prove your undeniable majesty."
 sidhe_house_dominance_gwydion_objective_decision_confirm:0 "我等是伟岸的"
 sidhe_house_dominance_gwydion_objective_decision_custom:0 "你必须从[great_chasm|E]取回[GetGlobalVariable('caliburn_link').Artifact.GetName]"
 gwydion_victory_modifier:0 "真王"
 sidhe_house_dominance_liam_objective_decision:0 "凡人之歌"
 sidhe_house_dominance_liam_objective_decision_desc:0 "凡人的想象力已经被教会的框架所束缚。利亚姆世家引领妖精努力理解教会对人类的神秘控制力。要么最具暴虐性质的教会组织需要被中和，要么教会需要妖精的引导来远离板讷。如果利亚姆世家成功，他们可以引导人类的成长朝着创造力的方向发展。"
 sidhe_house_dominance_liam_objective_decision_tooltip:0 "整合或废弃教会"
 sidhe_house_dominance_liam_objective_decision_confirm:0 "站在歌之主前吧。"
 sidhe_house_dominance_liam_objective_decision_custom1:0 "你达成了$destroy_inquisition_objective_decision$[decision|E]"
 sidhe_house_dominance_liam_objective_decision_custom2:0 "你的信仰是[GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]，且达成了$constantinian_objective_decision$[decision|E]"
 sidhe_house_dominance_liam_objective_decision_custom3:1 "在地图上不能有[GetTrait('supehunter').GetName( GetPlayer )][independent_ruler|E]"
 liam_victory_modifier:0 "凡人之歌"
 sidhe_house_dominance_aesin_objective_decision:0 "伫立中土"
 sidhe_house_dominance_aesin_objective_decision_desc:0 "Followers of the Nailed God have spread throughout Norse lands, driving the people away from their pacts with the Aesir and Vanir. Vampire impostors called the [GetFaithByKey('viaeinherjar').GetName] are holding the old temples of [GetTitleByKey('k_midgard').GetNameNoTier] including Uppsala — perverting our ancient rites into their banal blood cult. The [GetFaithByKey('getoffenris').GetName] of the [GetTitleByKey('k_fimbul_winter').GetNameNoTier] roam the northern wastes of Sweden and must be brought to heel. The [GetTitleByKey('d_crystal_fortress').GetNameNoTier] is in the hands of [GetFaithByKey('summer_court').GetName] [GetTrait('changeling').GetName( GetPlayer )] of House [GetDynastyByID( 'POD_fae_dynasty_gwydion' ).GetBaseName] and it should rightfully be ours. We shall take up our ancient and hallowed arms and reclaim our homeland with blood."
 sidhe_house_dominance_aesin_objective_decision_tooltip:0 "为阿萨夺回整个米德加尔德"
 sidhe_house_dominance_aesin_objective_decision_confirm:0 "宁为光荣而死，不为耻辱而活"
 aesin_victory_modifier:0 "伫立中土"
 sidhe_house_dominance_ailil_objective_decision:0 "终结四季之战"
 sidhe_house_dominance_ailil_objective_decision_desc:0 "House Ailil thrives on power and has honed its skills with diplomacy and intrigue. The Seelie fae betrayed the regular seasonal turning of the throne, and through it have denied the Ailil their rightful turn at rulership. To restore the balance, the War of Seasons must end. If the Ailil can end the War of Seasons, their eminence among all Sidhe Houses will be unchallengeable."
 sidhe_house_dominance_ailil_objective_decision_tooltip:0 "结束四季之战或宣称整个爱尔兰并获得认可"
 sidhe_house_dominance_ailil_objective_decision_confirm:0 "凡事都有定季，凡事都有定时"
 sidhe_house_dominance_ailil_objective_decision_custom:0 "四季之战斗争已结束"
 ailil_victory_modifier:0 "终结四季之战"
 sidhe_house_dominance_balor_objective_decision:0 "弗摩尔族传承"
 sidhe_house_dominance_balor_objective_decision_desc:0 "House Balor trace their ancestry back to a line of sidhe who mixed their blood with that of the Fomorians. They believe that the Endless Winter is almost here, and that a strong hand needs to guide the helm to steer the fae through it. Through their connection to the Wyrm, they seek alliances between the Unseelie with Black Spiral Dancers and the Fomori. Given the ancestral tie between House Balor and the Fomorians, it may be possible with a potent ritual to merge a Fae with a powerful bane spirit to create a Fae-Fomori hybrid — a Fomarch."
 sidhe_house_dominance_balor_objective_decision_tooltip:0 "与忌灵融合，成为妖精堕妖混合体"
 sidhe_house_dominance_balor_objective_decision_confirm:0 "召唤节点爬行者"
 balor_victory_modifier:0 "弗摩尔族"
 sidhe_house_dominance_daireann_objective_decision:0 "医师战士"
 sidhe_house_dominance_daireann_objective_decision_desc:0 "The House gained their noble station by Daireann healing a Gwydion lord, but they gained their true respect by the valor of their warrior Conchobhair. The Daireann know very well that the hand that can heal can also harm. A cup can hold both poison or an antidote. A blade can be used to heal, and it can be used to sever the thread of a life."
 sidhe_house_dominance_daireann_objective_decision_tooltip:0 "同时发展你的战争和医疗能力"
 sidhe_house_dominance_daireann_objective_decision_confirm:0 "万物皆有季节"
 daireann_victory_modifier:0 "医师战士"
 sidhe_house_dominance_leanhaun_objective_decision:0 "恋难舍的诅咒"
 sidhe_house_dominance_leanhaun_objective_decision_desc:0 "The secret curse upon House Leanhaun that causes its members to rapidly age without rhapsodizing mortals is prophesied not to end 'until the stars weep blood and the very earth grows cold beneath your feet' seems unlikely to occur any time soon. Usually, the Leanhaun enchant and rhapsodize one mortal victim at a time. It is speculated that if enough dreamers are being cultivated and the glamour of those dreamers is of great quantity, the impact of the curse may be lessened if not eliminated."
 sidhe_house_dominance_leanhaun_objective_decision_tooltip:0 "利用足够的梦种来减轻诅咒"
 sidhe_house_dominance_leanhaun_objective_decision_confirm:0 "我们的痛苦可能成为我们的本分"
 leanhaun_victory_modifier:0 "恋难舍的诅咒已受削弱"
 sidhe_house_dominance_varich_objective_decision:0 "罗斯之灵"
 sidhe_house_dominance_varich_objective_decision_desc:0 "The Inanimae, spirits of the earth and sky, have always been Varich’s servants; their children. The land of Russia once teemed with Inanimae. These spirits were part of everything for the fae: the earth, the rivers, their freeholds, and the endless taiga surrounding them. The Varich understand how to please these spirits as well as how to use them. Spirits of the hearth and home are as powerful and helpful as the size and magnificence of their Anchors, as well as the amount of respect paid to them, allows them to be. No Varich holding is complete without them, and no member of House Varich will knowingly insult these helpful spirits. Shore up the ranks of House Varich by bringing more Inanimae into vassalage."
 sidhe_house_dominance_varich_objective_decision_tooltip:0 "引领俄罗斯文化，并拥有许多元素妖容器"
 sidhe_house_dominance_varich_objective_decision_confirm:0 "没有不好的土地，只有不好的地主"
 varich_victory_modifier:0 "罗斯之灵"
 sidhe_house_dominance_scathach_objective_decision:0 "莫泊桑神谕的敕令"
 sidhe_house_dominance_scathach_objective_decision_desc:0 "Since House Scathach defeated Octriallach the White King of the Fomorians in the War of the Trees, the Morphean Oracles have been the defining force within House Scathach. While the Edicts of the Morphean Oracles do not always make sense to members of the house, the is house is unified in following them. The Oracles foresaw calamity if the Sword of Tethra entered the Heart of the Dreaming, however, and the Scathach attacked the Gwydion attempting to move it. During the ensuing bloodshed, the blade disappeared into the surrounding Dreaming. The political consequences of the battle caused the Scathach to become an exiled and shunned House by the Seelie. Stil, the members of the house follow the Edicts of the Oracles. Despite this unity, the House is divided between the Changelings task with remaining behind as most Sidhe flee to Arcadia, and Uathach and her first born Fae followers search the Sea of Silver in the Deep Dreaming for something to preserve both the Autumn World and defeat the Fomorians."
 sidhe_house_dominance_scathach_objective_decision_tooltip:0 "滚滚长江东逝水，浪花淘尽英雄。是非成败转头空，青山依旧在，几度夕阳红。白发渔樵江渚上，惯看秋月春风。一壶浊酒喜相逢，古今多少事， 都付笑谈中。"
 sidhe_house_dominance_scathach_objective_decision_confirm:0 "我等是伟岸的"
 sidhe_house_dominance_scathach_objective_decision_custom:0 "[shattering|E]已被阻止"
 scathach_victory_modifier:0 "莫泊桑神谕的敕令"
 sidhe_house_dominance_danaan_objective_decision:0 "梦界守卫"
 sidhe_house_dominance_danaan_objective_decision_desc:0 "House Danaan roams the many paths through the Dreaming. They guard its trods and blaze new trails. They guide dreamers and through their Oath of the Dragon gain the favor of many Chimera. A leader of the house who has traveled far in the dreaming may be able to raise an impressive horde of Chimera to unleash upon the Autumn World when the moment is right."
 sidhe_house_dominance_danaan_objective_decision_tooltip:0 "游历世界和梦界，了解其中的秘密，打造一支奇魅军团。"
 sidhe_house_dominance_danaan_objective_decision_confirm:0 "两条路在迷障中分岔，我选择了人迹罕至的那条"
 danaan_victory_modifier:0 "梦界守卫"
