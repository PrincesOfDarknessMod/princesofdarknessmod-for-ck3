 host_elysium_decision: "主办欢会​"
 host_elysium_decision_tooltip: "将举办欢会​，紧随内阁会议之后"
 host_elysium_decision_opening_desc: "你的宫廷今晚将出席欢会​，然后你将向你的议会咨询目前的事务。如果他们能力足够，他们的提议可能会所有帮助。"
 elysium_decision_effect_tooltip: "将举办欢会​，随后你的内阁将根据本身的属性能力提出各等提案"
 host_elysium_decision_confirm: "开办欢会​"
 host_elysium_decision_desc_shy: "如果你害羞，这项活动会给你带来压力"
 ignored_my_plan_opinion: "无视提议"
 busy_chancellor_modifier: "勤奋的$councillor_chancellor_vampire$"
 busy_chancellor_modifier_desc: "你的侍从长正忙于在你的领地内为你唱赞歌"
 marshal_elysium_levies_modifier: "受控的群众"
 marshal_elysium_levies_modifier_desc: "你的治安官对这一区域有很强的控制力，确保你的权威无处不在。"
 capital_reined_in_modifier: "血腥投资"
 capital_reined_in_modifier_desc: "通过支持正确的人，你对这个地区的影响越来越大。"
 spymaster_elysium_scheme_modifier: "$councillor_spymaster_vampire$的资源"
 spymaster_elysium_scheme_modifier_desc: "你的鞭笞人现在正在使用一个非常有效的消息来源和人脉网"
 cheap_elysium_opinion: "廉价欢会​"
 POD_elysium_events.1.t: "内阁会议"
 POD_elysium_events.1.desc: "一场内阁会议已被安排于今夜。这是吸血鬼世界的经典事件之一，在这一时刻，你最亲密的顾问将能够说出他们对各种问题以及如何处理它们的想法。作为他们的领主，是否接受他们的建议显然取决于你。"
 POD_elysium_events.1.option.a: "让我们开始吧"
 POD_elysium_events.1.option.b: "不在今晚"
 POD_elysium_events.1.option.meeting: "你的内阁的属性越高，结果就会越好。如果他们的能力不行，就不要指望有什么好结果。"
 POD_elysium_events.100.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]：下等提案"
 POD_elysium_events.100.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l]提出了一个计划，那就是用奉承、礼物等方式来讨好附近的一些统治者。虽然这是看起来没啥坏处，但费这力气所需的金钱成本似乎相当高，却没什么有效的结果。然而，你还得做出选择。"
 POD_elysium_events.100.option.a: "我希望这值得……"
 POD_elysium_events.100.option.b: "这不值得！"
 POD_elysium_events.101.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]：中等提案"
 POD_elysium_events.101.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l]提出了一个计划，那就是用奉承、礼物等方式来讨好附近的一些统治者。大部分的工作已经由你的内阁成员完成，你只需要支付礼物本身的费用。如果你对这个主意感兴趣的话。"
 POD_elysium_events.101.option.a: "我希望这值得……"
 POD_elysium_events.101.option.b: "这不值得！"
 POD_elysium_events.102.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]：上等提案"
 POD_elysium_events.102.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l]提出了一个计划，那就是用奉承、礼物等方式来讨好附近的一些统治者。这事已经准备就绪，你那有才的顾问已经做了所有幕后工作。你只需要批准就行。"
 POD_elysium_events.102.option.a: "干得好"
 POD_elysium_events.102.option.b: "我不需要这个"
 POD_elysium_events.103.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]：下等提案"
 POD_elysium_events.103.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l]提议为你忠诚的臣民举行一场盛大的巡演，歌颂你的丰功伟绩，以使他们更加尊重你的统治。虽然这是个好主意，但举行这样一次巡演价格不菲。"
 POD_elysium_events.103.option.a: "我希望这值得……"
 POD_elysium_events.103.option.b: "这不值得！"
 POD_elysium_events.104.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]：中等提案"
 POD_elysium_events.104.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l]提议为你忠诚的臣民举行一场盛大的巡演，歌颂你的丰功伟绩，以使他们更加尊重你的统治。你只需要支付一部分费用就能开始。"
 POD_elysium_events.104.option.a: "我希望这值得……"
 POD_elysium_events.104.option.b: "这不值得！"
 POD_elysium_events.105.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]：上等提案"
 POD_elysium_events.105.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l]提议为你忠诚的臣民举行一场盛大的巡演，歌颂你的丰功伟绩，以使他们更加尊重你的统治。该大部分已经被其所付，而你那训练有素的顾问只需你给予祝福就可以起始巡演。"
 POD_elysium_events.105.option.a: "干得好"
 POD_elysium_events.105.option.b: "我不需要这个"
 POD_elysium_events.200.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]：下等提案"
 POD_elysium_events.200.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]提出了一个计划，即支持当地的一群暴徒，并从他们的“收入”中收取一部分作为回报。这并不是很光荣的作为，而且你也想避免与之发生联系。可悲的是，你的[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]似乎没有事先想到这个问题。"
 POD_elysium_events.200.option.a: "威望没那么值"
 POD_elysium_events.200.option.b: "这是历史上最糟糕的计划"
 POD_elysium_events.201.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]：中等提案"
 POD_elysium_events.201.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]提出了一个计划，即支持当地的一群暴徒，并从他们的“收入”中收取一部分作为回报。这并不是很光荣的作为，而且你也想避免与之发生联系。你的财政总管已经想到了一些保障措施来保护你的声誉，这将缓解整个作业。"
 POD_elysium_events.201.option.a: "钱总是很重要"
 POD_elysium_events.201.option.b: "我不需要这个"
 POD_elysium_events.202.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]：上等提案"
 POD_elysium_events.202.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]提出了一个计划，即支持当地的一群暴徒，并从他们的“收入”中收取一部分作为回报。这并不是很光荣的作为，而且你也想避免与之发生联系。可喜的是，你的财政总管已经采取了措施，尽可能避免了玷污你的名声。"
 POD_elysium_events.202.option.a: "干得好"
 POD_elysium_events.202.option.b: "我不需要这个"
 POD_elysium_events.203.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]：下等提案"
 POD_elysium_events.203.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]提出了一个扩大你在你首都的影响力的建议。毕竟总是有更多、更新的凡人机构可以让你的爪牙进入。可悲的是，你那不怎么训练有素的顾问仅仅为了启动这个想法就要求大量的金钱，因为其事先没有安排手下来准备这个计划。"
 POD_elysium_events.203.option.a: "钱没那么值"
 POD_elysium_events.203.option.b: "你疯啦？！"
 POD_elysium_events.204.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]：中等提案"
 POD_elysium_events.204.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]提出了一个扩大你在你首都的影响力的建议。毕竟总是有更多、更新的凡人机构可以让你的爪牙进入。基础工作已经被其完成，只剩下最后的贿赂之类的东西需要支付，就足以使这个想法得以实现。"
 POD_elysium_events.204.option.a: "你得到许可了"
 POD_elysium_events.204.option.b: "没这个必要"
 POD_elysium_events.205.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]：上等提案"
 POD_elysium_events.205.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]提出了一个扩大你在你首都的影响力的建议。毕竟总是有更多、更新的凡人机构可以让你的爪牙进入。大部分工作已经由你那训练有素的顾问完成，只剩下一些小贿赂，就足以便让这个计划得以进行。"
 POD_elysium_events.205.option.a: "干得好"
 POD_elysium_events.205.option.b: "没这个必要"
 POD_elysium_events.300.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]：下等提案"
 POD_elysium_events.300.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l]提出了一个计划，以增加你对你的省份之一的整体控制。这将允许你从它那里获得更多的影响力，但也可能引起一些不必要的注意。可悲的是，这是一个你的顾问没有预备好的细节，使这一作为现在的风险比它本该有的风险更大。"
 POD_elysium_events.300.option.a: "任然是一项有用的计谋"
 POD_elysium_events.300.option.b: "你就不懂得目光放长远点，嗯？"
 POD_elysium_events.301.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]：中等提案"
 POD_elysium_events.301.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l]提出了一个计划，以增加你对你的省份之一的整体控制。这将允许你从它那里获得更多的影响力，但也可能引起一些不必要的注意。你的顾问已经准备了一些措施，以避免最严重的反击。"
 POD_elysium_events.301.option.a: "一项有用的计谋"
 POD_elysium_events.301.option.b: "还是太危险了"
 POD_elysium_events.302.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]：上等提案"
 POD_elysium_events.302.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l]提出了一个计划，以增加你对你的省份之一的整体控制。这将允许你从它那里获得更多的影响力，但也可能引起一些不必要的注意。可喜的是，你训练有素的顾问已经处理了这个潜在的问题，现在的被发现风险极其之小。"
 POD_elysium_events.302.option.a: "干得好"
 POD_elysium_events.302.option.b: "没这个必要"
 POD_elysium_events.303.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]：下等提案"
 POD_elysium_events.303.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l]想把你的宫廷的工作重点放在提高勇士的属性上。这是一项有价值的努力，但可能会代价高昂。但你的顾问似乎不认为这是一个真正的问题，并要求提供一笔巨额资金来建立一个“适当”的训练方案。"
 POD_elysium_events.303.option.a: "钱对我来说不紧要"
 POD_elysium_events.303.option.b: "你看我像不像钱你这蠢货！"
 POD_elysium_events.304.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]：中等提案"
 POD_elysium_events.304.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l]想把你的宫廷的工作重点放在提高勇士的属性上。这是一项有价值的努力，但可能会代价高昂。你的顾问有一些创新的想法，可能会减少一些成本，但所需的代价仍然很高。"
 POD_elysium_events.304.option.a: "钱对我来说不紧要"
 POD_elysium_events.304.option.b: "你看我像不像钱？！"
 POD_elysium_events.305.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]：上等提案"
 POD_elysium_events.305.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l]想把你的宫廷的工作重点放在提高勇士的属性上。这是一项有价值的努力，但可能会代价高昂。你的顾问处理了大部分的费用，并有一些关于避免制造新费用的想法。由于该熟练的处理，代价并不是太高。"
 POD_elysium_events.305.option.a: "干得好"
 POD_elysium_events.305.option.b: "没这个必要"
 POD_elysium_events.400.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]：下等提案"
 POD_elysium_events.400.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l]有一个计划，能把你对附近地区的统治合法化。它显然包括大量的贿赂和人情的调用。可悲的是，你那不怎么训练有素的顾问还没能找到缩减费用的方法，导致了一个相当令人望而却步的提议。"
 POD_elysium_events.400.option.a: "我有的是钱"
 POD_elysium_events.400.option.b: "我并非有的是钱"
 POD_elysium_events.401.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]：中等提案"
 POD_elysium_events.401.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l]有一个计划，能把你对附近地区的统治合法化。它显然包括大量的贿赂和人情的调用。你的顾问已经做了大量的准备工作，留给你的只是最后要支付的部分费用。"
 POD_elysium_events.401.option.a: "一项值得的计谋"
 POD_elysium_events.401.option.b: "还是太贵了"
 POD_elysium_events.402.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]：上等提案"
 POD_elysium_events.402.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l]有一个计划，能把你对附近地区的统治合法化。它显然包括大量的贿赂和人情的调用。但你训练有素的顾问设法支付了所有费用，使这个计划已经完成。"
 POD_elysium_events.402.option.a: "干得好"
 POD_elysium_events.402.option.b: "没这个必要"
 POD_elysium_events.403.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]：下等提案"
 POD_elysium_events.403.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l]主张你该抛开亲王职责休息一下。放假一段时间对你饱受摧残的灵魂有好处，但对你的国度就没那么好了。可悲的是，你那不怎么训练有素的顾问其实并不可靠，所以无论如何你还是得自己做很多实际工作。"
 POD_elysium_events.403.option.a: "让我身边的蠢货少些听起来不错"
 POD_elysium_events.403.option.b: "……但我不能让他们取代我的统治！"
 POD_elysium_events.404.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]：中等提案"
 POD_elysium_events.404.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l]主张你该抛开亲王职责休息一下。放假一段时间对你饱受摧残的灵魂有好处，但对你的国度就没那么好了。你的顾问足够可靠，如果你愿意，你应该能够在这段时间内真正重新集中精力。"
 POD_elysium_events.404.option.a: "放假听起来不错"
 POD_elysium_events.404.option.b: "我会休息的，当我……嘛"
 POD_elysium_events.405.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]：上等提案"
 POD_elysium_events.405.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l]主张你该抛开亲王职责休息一下。放假一段时间对你饱受摧残的灵魂有好处，但对你的国度就没那么好了。可喜的是，你的顾问非常训练有素，这意味着如果你愿意，你将能够真正轻松一段时间。"
 POD_elysium_events.405.option.a: "放假听起来不错"
 POD_elysium_events.405.option.b: "我会休息的，当我……嘛"
 POD_elysium_events.500.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]：下等提案"
 POD_elysium_events.500.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l]总是担心潜在的[the_masquerade|E]破漏，即使在没有目光的地方也是如此。由于这主要是其本身的工作，所以你在大多数时候都不用去管它。今夜，你的顾问的计划是让你放弃你所拥有的几个著名的影响力来源，以确保你不会受到损害。"
 POD_elysium_events.500.option.a: "反正威望也没什么用"
 POD_elysium_events.500.option.b: "就这样没事的"
 POD_elysium_events.501.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]：中等提案"
 POD_elysium_events.501.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l]总是担心潜在的[the_masquerade|E]破漏，即使在没有目光的地方也是如此。由于这主要是其本身的工作，所以你在大多数时候都不用去管它。你的顾问希望你缩减一些比较明显的活动，以确保你仍能从凡人的眼睛中隐藏起来。"
 POD_elysium_events.501.option.a: "这听起来不错"
 POD_elysium_events.501.option.b: "就这样没事的"
 POD_elysium_events.502.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]：上等提案"
 POD_elysium_events.502.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l]总是担心潜在的[the_masquerade|E]破漏，即使在没有目光的地方也是如此。由于这主要是其本身的工作，所以你在大多数时候都不用去管它。你的顾问已经隔离了一些非常明显但并不那么重要的你所使用的影响力来源。放弃这些不会有什么损失，而且可以确保你安全的不被凡人察觉。"
 POD_elysium_events.502.option.a: "干得好"
 POD_elysium_events.502.option.b: "我不怕凡人"
 POD_elysium_events.503.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]：下等提案"
 POD_elysium_events.503.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l]有几个新的有前途的线人和其他人脉，可证明对你的功业有用。问题是，你那不怎么训练有素的顾问在与他们的初步接触中出了差错，如果你想利用这个新机会，你就需要自己去应对他们。"
 POD_elysium_events.503.option.a: "我非得事必躬亲吗？"
 POD_elysium_events.503.option.b: "不是我该干的"
 POD_elysium_events.504.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]：中等提案"
 POD_elysium_events.504.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l]有几个新的有前途的线人和其他人脉，可证明对你的功业有用。虽然大部分的初始工作已经完成，但仍需要你出手来确保一些更隐蔽的人脉。"
 POD_elysium_events.504.option.a: "可接受的代价"
 POD_elysium_events.504.option.b: "不是我该干的"
 POD_elysium_events.505.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]：上等提案"
 POD_elysium_events.505.desc: "你的[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l]有几个新的有前途的线人和其他人脉，可证明对你的功业有用。你训练有素的顾问已经完成了几乎所有需要进行的工作，你只需要对一些比较顽固的潜在资产进行个人处理。"
 POD_elysium_events.505.option.a: "干得好"
 POD_elysium_events.505.option.b: "没这个必要"
 POD_elysium_events.106.t: "内阁会议：大成功"
 POD_elysium_events.106.desc: "在这次内阁会议上，你和你有才的顾问进行了长时间的、非常有指导意义的谈话。你觉得你比以前更了解了关于统治的一些细微之处，多亏了这样一位有才华的人的影响。"
 POD_elysium_events.106.option.a: "向最优秀者学习"
 POD_elysium_events.107.t: "内阁会议：大失败"
 POD_elysium_events.107.desc: "在今晚的内阁会议上，你那无才的顾问更是如你所预料的那样让人厌烦。这个没有头脑的傻瓜根本不知道作为的复杂性，浪费了你的宝贵时间。"
 POD_elysium_events.107.option.a: "我身边都是蠢货"
 POD_elysium_events.108.t: "外交总管：夜常一晚"
 POD_elysium_events.108.desc: "议会的这一部分没有什么特别的事发生，一切如常。你的顾问的演讲有点无聊，但你还是在其中取到了一些有用的小东西。"
 POD_elysium_events.108.option.a: "一夜一夜来……"
 POD_elysium_events.2.t: "欢会​：大手笔？"
 POD_elysium_events.2.desc: "当你在准备将来的欢会​时，你被提醒了一个始终存在的问题，那就是费用。很明显，你的封臣们会期待最奢侈的聚会，以真正让他们对你的权力和财富印象深刻。\n问题是，钱不是从树上长出来的，你可能想剩下一些边角料。或所有边角。"
 POD_elysium_events.2.option.a: "钱对我无关紧要。"
 POD_elysium_events.2.option.b: "钱对我有关紧要。"
 POD_elysium_events.2.option.c: "这谷仓似乎很适合用于聚会！"
 POD_elysium_events.3.t: "欢会​：茶点"
 POD_elysium_events.3.desc: "与这么多吸血鬼聚集在一个地方，你将需要一些血源。最好是新鲜的、仍然活着的。凡人很容易找到，但要说服他们为你的客人当做茶点就有点难了。那么你将如何进行呢？"
 POD_elysium_events.3.option.a: "劫掠地区"
 POD_elysium_events.3.option.b: "我会自己去做的"
 POD_elysium_events.3.option.c: "雇佣专家来静悄悄地处理这件事"
 POD_elysium_events.4.t: "欢会​：安保？"
 POD_elysium_events.4.desc: "按照经验，欢会​是吸血鬼的安全空间，在那里不可能发生任何坏事。显然，“经验”和“实际”是两件非常不同的事情，你可能想准备一些安全力量，以确保一切顺利进行。"
 POD_elysium_events.4.option.a: "招募一些守卫"
 POD_elysium_events.4.option.b: "不用安保。这将使他们处于警惕状态"
 POD_elysium_events.4.option.c: "我够安全了"
 elysium_security_tooltip: "这个选项可用是因为你是位强者"
 favored_elysium_opinion: "在欢会​中讨好了我"
 disfavored_elysium_opinion: "在欢会​中唾弃了我"
 POD_elysium_events.5.t: "欢会​：切磋"
 POD_elysium_events.5.desc: "你的两个勇士想在他们之间进行一场友好的决斗，以取悦于宫廷。很明显，他们每个人都希望在决斗前得到你的青睐。你可以肯定，你不选择的那一个会很反感。这就是吸血鬼政治。"
 POD_elysium_events.5.option.a: "[duelingknight.GetFirstNameNoTooltip]，我看好你！"
 POD_elysium_events.5.option.b: "[otherknight.GetFirstNameNoTooltip]，我选择你！"
 POD_elysium_events.5.option.c: "嘛，你们我都不喜欢"
 really_disfavored_elysium_opinion: "在欢会​戏弄了我"
 POD_elysium_events.6.t: "欢会​：帮把手？"
 POD_elysium_events.6.desc: "[baffledvassal.GetFirstNameNoTooltip]的心思不在今晚的玩乐中。[baffledvassal.GetSheHe|U]已经成为宫廷的话题，而且不是褒义。这是一个相当大的困境，但也是一个机会，因为你可以用一些精选的词语来拯救这个可怜的家伙。或者，你也可以加入迫害。"
 POD_elysium_events.6.option.a: "我来帮忙了"
 POD_elysium_events.6.option.b: "与我无关"
 POD_elysium_events.6.option.c: "一起迫害听起来很有意思……"
 POD_elysium_events.7.t: "欢会​：机会"
 POD_elysium_events.7.desc: "你无意中听到你的一位封臣在谈论在凡人中施加影响的一种潜在的新可能性。从你的消息来源来看，这的确是一个有利可图的前景，但可恨的猎人已经渗入其中，使整个业务变得相当危险。警告你的属下，可以为你赢得他的人情。"
 POD_elysium_events.7.option.a: "让我们一起冒这风险吧！"
 POD_elysium_events.7.option.b: "听我的建议，这是个陷阱"
 POD_elysium_events.7.option.c: "你别去追查这条线索，这是命令"
 POD_elysium_events.8.t: "欢会​：吵闹邻隔"
 POD_elysium_events.8.desc: "看来你的欢会​并不像你希望的那样安静。这么多的人在晚上聚集在一起，引起了附近凡人的不必要的注意。显然，没有什么是你不能处理的，但你继续聚会就会危及[the_masquerade|E]了。"
 POD_elysium_events.8.option.a: "没什么可担心的"
 POD_elysium_events.8.option.b: "让我们取消今晚的欢会​"
 POD_elysium_events.8.option.c: "取消欢会​，随后应对凡人"
 ending_elysium_tooltip: "这个选项可用是因为你拥有强大的精神力量"
 POD_elysium_events.9.t: "欢会​：血在流"
 POD_elysium_events.9.desc: "作为欢会​的尊贵东道主，你已经为你的客人提供了大量的血液。一切都很顺利，但看着这么多美味的红酒让你的心兽兴奋了起来。也许你也可以放纵一下？东道主这样做其实并不合适，但你毕竟是这里的统治者。"
 POD_elysium_events.9.option.a: "您自己享受就好"
 POD_elysium_events.9.option.b: "也给我一点谢谢"
 POD_elysium_events.9.option.c: "还要！我还要！"
 POD_elysium_events.10.t: "欢会​：夜还很长"
 POD_elysium_events.10.desc: "今夜是一场非常普通的欢会​，你必须承认。有些起伏但不多，有些隐蔽的威胁，但没有太多危险……偶尔有些放松时间也不错。你甚至可以加把力，把它延长到一个整晚。"
 POD_elysium_events.10.option.a: "只是享受平静"
 POD_elysium_events.10.option.b: "欢会​结束了！让我一个人待着"
 POD_elysium_events.11.t: "欢会​：准备工作"
 POD_elysium_events.11.desc: "要成功举办一场欢会​，有很多事情需要考虑和准备。你已经涵盖了基本的需求，但你现在正在考虑更进一步，以真正打动你的客人。你是否会要考验你的东道主技巧，以确保一场更有声望的欢会​？"
 POD_elysium_events.11.option.a: "让我们计较计较！"
 POD_elysium_events.11.option.b: "只要付钱给一些训练有素的人去处理就好了"
 POD_elysium_events.11.option.c: "我欢会​就这样就好"
 POD_elysium_events.11.effect.success.desc: "你做了一笔非常棒的交易！"
 POD_elysium_events.11.success: "完美的交易"
 POD_elysium_events.11.failure.effect.desc: "你做了个回本的交易"
 POD_elysium_events.11.failure: "普通的交易"
 POD_elysium_events.11.critical.failure.effect.desc: "你做了一个非常糟糕的交易"
 POD_elysium_events.11.critical.failure: "糟糕的交易"
 POD_elysium_events.12.t: "欢会​：战棋"
 POD_elysium_events.12.desc: "在大多数欢会​的长久传统中，战棋是值得骄傲的之一，是刷新你的军事属性的好方法。你的一位封臣现在正在玩一局，评论如何最好地表现凡人战争的新发展。也许可以玩一玩？你可以学到一些东西。"
 POD_elysium_events.12.option.a: "弩炮放前排？你会玩嘛？"
 POD_elysium_events.12.option.b: "谢了，但今晚没兴趣"
 POD_elysium_events.12.effect.success.desc: "彻底的胜利！"
 POD_elysium_events.12.success: "一场彻底的胜利！"
 POD_elysium_events.12.failure.effect.desc: "惨胜"
 POD_elysium_events.12.failure: "一场惨胜"
 POD_elysium_events.12.critical.failure.effect.desc: "失败……"
 POD_elysium_events.12.critical.failure: "被击败"
 POD_elysium_events.13.t: "欢会​：演讲？"
 POD_elysium_events.13.desc: "大多数时候，欢会​是安静的作为，倾向于一小群人一起密谋。但有些时候，你会感到喉咙痒，想发表一场宏大的演讲，提醒大家他们的目标，当然还有你对他们的权威。今晚就是这样的时候吗？"
 POD_elysium_events.13.option.a: "大家听我说！"
 POD_elysium_events.13.option.b: "并不是"
 POD_elysium_events.13.effect.success.desc: "激昂的演讲！"
 POD_elysium_events.13.success: "一场激昂的演讲！"
 POD_elysium_events.13.failure.effect.desc: "普通的演讲"
 POD_elysium_events.13.failure: "一场普通的演讲"
 POD_elysium_events.13.critical.failure.effect.desc: "失败的演讲"
 POD_elysium_events.13.critical.failure: "一场拙劣的演讲"
 POD_elysium_events.14.t: "欢会​：小规模谋略"
 POD_elysium_events.14.desc: "欢会​是一个充满谣言和欺骗的地方。虽然都不是什么太重要的，因为大多数关键的密谋都发生在不太公开的地方，但这里在这里任然能创造或毁灭声誉。你的一位封臣今晚正以相当热心的方式从事这种吸血鬼艺术。这可能是一个测试你自己的机会。"
 POD_elysium_events.14.option.a: "八卦起来！"
 POD_elysium_events.14.option.b: "我不喜欢这种小计"
 POD_elysium_events.14.effect.success.desc: "完美的展示！"
 POD_elysium_events.14.success: "一场完美的展示！"
 POD_elysium_events.14.failure.effect.desc: "勉强的表现"
 POD_elysium_events.14.failure: "一次勉强的表现"
 POD_elysium_events.14.critical.failure.effect.desc: "拙劣的尝试"
 POD_elysium_events.14.critical.failure: "一次拙劣的尝试"
 POD_elysium_events.15.t: "欢会​：理论"
 POD_elysium_events.15.desc: "今夜，你的欢会​对来自凡人的最新风潮非常感兴趣。像往常一样，许多吸血鬼声称他们是这些凡人的想法和发明的先驱，但没有任何证据。这是一场无休止的争论，但这是一个相当好的机会，可以在没有任何真正危险的情况下提出你自己的理论。"
 POD_elysium_events.15.option.a: "据说……"
 POD_elysium_events.15.option.b: "没用的脑筋急转弯"
 POD_elysium_events.15.effect.success.desc: "令人信服的论证！"
 POD_elysium_events.15.success: "令人信服的论证！"
 POD_elysium_events.15.failure.effect.desc: "勉勉强强的论证"
 POD_elysium_events.15.failure: "勉勉强强的论证"
 POD_elysium_events.15.critical.failure.effect.desc: "发挥失常的论证"
 POD_elysium_events.15.critical.failure: "发挥失常的论证"
 roaming_elysium_modifier: "巡游欢会​"
 roaming_elysium_modifier_desc: "你在迁移你的地盘使得你很难被抓到"
 POD_elysium_events.16.t: "欢会​：巡游宫廷？"
 POD_elysium_events.16.desc: "巡游欢会​是诞生于德意志梵卓的传统，它是在几年内将你的宫廷从一个地方移到另一个地方的过程，沿途拜访你的所有“下属”。除了被你的封臣们所敬仰外，这在安全方面也是相当不错的，因为你不会在一个地方呆得太久。缺点是当你不在时将无法有效地控制自己的领地。你会在未来五年内采用这一传统吗？"
 POD_elysium_events.16.option.a: "又该上路了……"
 POD_elysium_events.16.option.b: "我是个安定的人"
 POD_elysium_events.17.t: "欢会​：提护"
 POD_elysium_events.17.desc: "你的一个封臣对[patronvassal.GetSheHe]最近的一个好发现非常自豪。一位显然很有前途的凡人，好到可以被于欢会​展示，这是一个罕见的情况……而且不被官方允许。作为这里的统治者，如果你愿意，你可以利用这个“失礼”把这个凡人拉到自己身边。不过别指望你的封臣会很快原谅你。"
 POD_elysium_events.17.option.a: "我对你有大安排"
 POD_elysium_events.17.option.b: "乖宠物"
 POD_elysium_events.18.t: "欢会​：该隐为何？"
 POD_elysium_events.18.desc: "该隐的真实本性在吸血鬼界一直是颇有争议的。因此，你的欢会​再次谈论到了他，这并不令人惊讶。每个人对这个问题都有自己的看法，包括你。谁才是第一位吸血鬼？它是救主、是怪物、就是位凡俗的谋杀者、还是什么其他物事？"
 POD_elysium_events.18.option.a: "亚当与夏娃之子，他是首位杀人犯"
 POD_elysium_events.18.option.b: "他是我们的灾祸，也是我们的救赎"
 POD_elysium_events.18.option.c: "一个早已消失的无名氏"
 POD_elysium_events.18.option.d: "也许是位不错的司机？"
 POD_elysium_events.19.t: "欢会​：恐怖宾客"
 POD_elysium_events.19.desc: "在你的欢会​真正开始之前，你的一位封臣向你提出了一个请求：成为即将到来的聚会的荣誉嘉宾。很明显，你封臣之间的一些小阴谋是这个要求的原因，而接受这个要求会让你在宫廷其他成员面前显得软弱。但接受意味着这个人对你有欠，这可能会是有用的。"
 POD_elysium_events.19.option.a: "你现在欠我一笔"
 POD_elysium_events.19.option.b: "没兴趣"
 POD_elysium_events.20.t: "欢会​：见面礼"
 POD_elysium_events.20.desc: "你的封臣之一带着一份礼物来到你面前，显然是某种传家宝。这是一份诱人的供品，因为你可以把它作为一件虚荣的道具保留下来，或者卖掉它换取一些有用的钱。但是，很明显，在吸血鬼的世界里没有什么是只取不舍的。你肯定以后会为对方的慷慨付出代价。"
 POD_elysium_events.20.option.a: "接受然后卖了它"
 POD_elysium_events.20.option.b: "接受然后留着它"
 POD_elysium_events.20.option.c: "你留着吧"
 POD_elysium_events.21.t: "欢会​：次代"
 POD_elysium_events.21.desc: "今夜欢会​的辩论似乎是围绕着二代而展开的。这些神话中该隐本人的子嗣，大概，在传说中于以诺城被他们自己的后嗣所毁灭。但有些人对这一理论提出质疑，甚至认为这种生物根本不存在。你有什么看法？"
 POD_elysium_events.21.option.a: "他们早去了，被三代所杀"
 POD_elysium_events.21.option.b: "他们是一个关于骄傲和堕落的教训"
 POD_elysium_events.21.option.c: "童话与怪谈"
 POD_elysium_events.21.option.d: "有机会的话，我一定会吸榨他们"
 POD_elysium_events.109.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]：外交训练？"
 POD_elysium_events.109.desc: "今晚你的顾问请求你在训练方面提供帮助。一场在附近的宫廷间的旅行，以了解他们的传统和怪癖，这可能会带来很大的改进。但这对你来说是不利的，因为你将承认你的内阁得改善。"
 POD_elysium_events.109.option.a: "你有我的许可"
 POD_elysium_events.109.option.b: "你才能够强了"
 POD_elysium_events.209.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]：财政训练？"
 POD_elysium_events.209.desc: "今晚你的顾问请求你在训练方面提供帮助。一大笔投资在各种新的凡人事业上的金钱，可能会给你的[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]带来一些重要的启示。不过你想再次看到这笔钱的希望不大。"
 POD_elysium_events.309.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]：军事训练？"
 POD_elysium_events.309.desc: "今晚你的顾问请求你在训练方面提供帮助。一些凡人发明的新战争武器，研究它们可以提高见地。不过获得这些武器的成本很高，需要大量的贿赂。"
 POD_elysium_events.409.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]：学识训练？"
 POD_elysium_events.409.desc: "今晚你的顾问请求你在训练方面提供帮助。有几本重要的书引起了你的顾问的注意，它们可能会很有作用。当然，要确保这些著作最终落入你的手中，成本会相当高。"
 POD_elysium_events.509.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]：计谋训练？"
 POD_elysium_events.509.desc: "今晚你的顾问请求你在训练方面提供帮助。在你的领地出现了几场小事件，你的[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l]想利用它们来测试一些处理此类问题的新方法。不过，与这种小打小闹的阴谋诡计联系在一起对你来说并不是好事。"
 POD_elysium_events.22.t: "欢会​：陌生人"
 POD_elysium_events.22.desc: "一个不起眼的吸血鬼今晚意外地来到了你的欢会​。你不认识他，也不欠他什么，但他请求你的款待，并在上路前能与你和你的廷臣们讨论和辩论。招待一位看起来像误入歧途的无名小卒并不是很威严，但你感觉到他可能比他看起来更有趣。"
 POD_elysium_events.22.option.a: "今晚你是我的客人"
 POD_elysium_events.22.option.b: "奇葩快滚！"
 strangeraccepted_tooltip: "他在隐瞒什么？"
 POD_elysium_events.23.t: "欢会​：陌生人（二）"
 POD_elysium_events.23.desc: "几年前来到你的欢会​的那位看起来很奇怪的独行侠回来了，再次要求你的款待。今夜他想和你及你的宫廷玩一些版图桌游，甚至一些你甚至不知道其存在的游戏。你仍然很怀疑这个人，你的廷臣们也不喜欢他，虽然你觉得放松一下可能也不错。"
 POD_elysium_events.23.option.a: "所以规则是什么？"
 POD_elysium_events.23.option.b: "奇葩快滚！"
 POD_elysium_events.24.t: "欢会​：陌生人（三）"
 POD_elysium_events.24.desc: "那个已经来过你欢会​两次的陌生吸血鬼又回来了。今夜他看起来比以前更高大，更威武，而且没有要求你的款待。相反，他要求与你私下交谈。你不得不同意，把他领到你宫殿的无人之处。\n这个人有着奇怪的微笑，在单单说了“你配得上这个”后，给了你一小杯血。在你还没来得及反应过来的时候，他已经走了，留给你这份充满力量的小礼物。"
 POD_elysium_events.24.option.a: "……而这是你从未尝过的最美味的血"
 POD_elysium_events.500.option.c: "我们现在全力潜藏着，没有那个必要"
 perfectmasquerade_tooltip: "这个选项可用是因为你的[masquerade_exposure_with_icon|E]为最低"
 perfectstress_tooltip: "这个选项可用是因为你没有压力。"
 POD_elysium_events.403.option.c: "我已经很放松了，谢谢。"
 POD_elysium_events.26.t: "欢会​：值得的武器？"
 POD_elysium_events.26.desc: "一位神秘的陌生人，甚至可能根本就不是吸血鬼，今晚不知何故出现在你的欢会。他直接向你提出了一个建议，用金钱抵押他携带的一件武器。\n除了这潜在的交易之外，他对其他任何事情都不感兴趣，但他还是同意在做出任何决定之前，将它们展示给你。即使是匆匆一瞥，也足以看出这是真正值得的交易，确实是强大而罕见的武器。\n陌生人正不耐烦地等待着你的回答。"
 POD_elysium_events.26.option.a: "这剑看上去很华贵。"
 POD_elysium_events.26.option.b: "是罗马短剑！真复古！"
 POD_elysium_events.26.option.c: "这奇怪的东西是什么？"
 POD_elysium_events.26.option.d: "这看上去很凶恶。"
 POD_elysium_events.26.option.e: "我什么都不需要。"