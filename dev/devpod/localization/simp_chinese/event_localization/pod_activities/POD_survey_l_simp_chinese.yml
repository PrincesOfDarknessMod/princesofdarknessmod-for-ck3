l_simp_chinese:
 survey_capital_decision: "巡视你的首都"
 survey_capital_decision_tooltip: "你将在你的亲王领中转一圈"
 survey_capital_decision_opening_desc: "有时，你得靠自己才能把事情做好。毕竟谁能真正相信这些谄媚的顾问呢？"
 survey_capital_decision_confirm: "让我们参观下我的地盘"
 survey_capital_decision_desc_shy: "如果你懒惰，这项活动会给你带来压力"
 survey_decision_effect_tooltip: "这将给予你发展你首都的机会"
 strict_control_modifier: "严格掌控"
 strict_control_modifier_desc: "你在监控你的领地内发生的一切，给于你更多施加影响的机会，但也有更多来自凡人的反抗。"
 lax_control_modifier: "宽松掌控"
 lax_control_modifier_desc: "你让凡人在这自由地做他们想做的事。没有了吸血鬼相关物来阻碍他们，他们很快就会繁荣起来。"
 opportunities1_modifier: "新的机会1"
 opportunities1_modifier_desc: "在这省份，新的施加影响的机会将会出现。一但该修正达到5，一个新的建筑槽将被解锁。注意，你一次最多可以拥有9个建筑槽，达到这个上限后，这个修正就无用了。"
 opportunities2_modifier: "新的机会2"
 opportunities2_modifier_desc: "在这省份，新的施加影响的机会将会出现。一但该修正达到5，一个新的建筑槽将被解锁。注意，你一次最多可以拥有9个建筑槽，达到这个上限后，这个修正就无用了。"
 opportunities3_modifier: "新的机会3"
 opportunities3_modifier_desc: "在这省份，新的施加影响的机会将会出现。一但该修正达到5，一个新的建筑槽将被解锁。注意，你一次最多可以拥有9个建筑槽，达到这个上限后，这个修正就无用了。"
 opportunities4_modifier: "新的机会4"
 opportunities4_modifier_desc: "在这省份，新的施加影响的机会将会出现。一但该修正达到5，一个新的建筑槽将被解锁。注意，你一次最多可以拥有9个建筑槽，达到这个上限后，这个修正就无用了。"
 POD_survey_events.1000.t: "巡视：护卫？"
 POD_survey_events.1000.desc: "你意识到，尽管名义上是在你的领地，但在你的权势之外任然潜伏着一些危险。当你准备对你的首都进行这次重要的巡视时，你在想，如果有的话，应该带什么护卫。显然，你不想让人觉得你害怕在自己的地盘上行走，但你可能更担心潜在的伏击或意外的威胁……"
 POD_survey_events.1000.option.a: "一整支军队！"
 POD_survey_events.1000.option.b: "一些守卫就够"
 POD_survey_events.1000.option.c: "应该是他们害怕我，而非相反"
 full_escort_survey_tooltip: "一个安全但让人看不起的选择"
 half_escort_survey_tooltip: "大概是个比较平衡的选择"
 no_escort_survey_tooltip: "威武但有潜在危险的选择"
 POD_survey_events.1001.t: "巡视：去哪？"
 POD_survey_events.1001.desc: "你已经准备好了，但夜晚不是永恒的（可惜），所以你将不得不选择今晚要视察城市的哪个部分。很明显，每个地方都有不同的机会和风险。你也将限制你的选择于有有需要照顾的资产的地区间，没有必要漫无目的地徘徊。"
 POD_survey_events.1001.option.a: "全面抽查我对城镇的影响"
 POD_survey_events.1001.option.b: "让我们去军区驻地"
 POD_survey_events.1001.option.c: "也许去商人公会？"
 survey_buildings_option_tooltip: "更多选择的启用取决于你的首都中存在的建筑"
 POD_survey_events.1001.option.d: "神职人员在晚上会做什么？"
 POD_survey_events.1001.option.e: "贵族区才是权力所在"
 POD_survey_events.1001.option.f: "我在下层区有些朋友"
 POD_survey_events.1.t: "巡视：巡逻队"
 POD_survey_events.1.desc: "在你巡视城市的过程中，你遇到了一支可能来自民兵的警卫巡逻队。老实说，他们是一些可怜的人，他们的盔甲几乎无法提供防护，他们的脚也只能勉强拖着他们前行。这使他们很容易避开，而且他们也不烦扰你，但这次遭遇让你想到，也许，你可以通过影响他们中的一些人，增加你对这个城市的控制。\n这很容易做到，但这肯定无助于市民的生活，其平日略有受着这种假冒士兵的保护。另一方面，你可以收回你对他们的影响，希望他们在没有你的干扰下逐渐改善。"
 POD_survey_events.1.option.a: "更多的掌控总是更好的"
 POD_survey_events.1.option.b: "也许在对该具体案例，我可以缓和一下"
 POD_survey_events.1.option.c: "支付新制服的费用就是了"
 POD_survey_events.2.t: "巡视：无家可归者"
 POD_survey_events.2.desc: "当你在城市中经过时，你意识到周围有很多无家可归的凡人，其只是想在街中生存。这些人很容易成为猎物，但他们对你领地的声望有负面影响。一个新奇的想法出现在你的脑海中，也许你可以做一项“投资”！给他们一些钱，可以帮助他们在一段时间内成为你的牲畜中有生产力的成员。或者你也可以不管它，毕竟凡人终有一死。"
 POD_survey_events.2.option.a: "给你，来更好地服从于我"
 POD_survey_events.2.option.b: "是易掠的猎物就够了"
 POD_survey_events.3.t: "巡视：新兵"
 POD_survey_events.3.desc: "你对驻扎在城市里的军队的控制是很好的，但必须始终维护。特别是当新兵受训时，因为那些新人还没有受到你的影响。当你接近军区时，你注意到他们正在进行夜间演习，这可能是一个机会。也许你可以上去介绍一下自己？"
 POD_survey_events.3.option.a: "将我视为你的上司"
 POD_survey_events.3.option.b: "我不会打扰这些人"
 POD_survey_events.3.option.c: "我将亲自训练这些蛆虫！"
 survey_mercenaries_contact_modifier: "佣兵人脉"
 survey_mercenaries_contact_modifier_desc: "你在当地雇佣兵身上投资了很多。这给予了回报。"
 POD_survey_events.4.t: "巡视：佣兵"
 POD_survey_events.4.desc: "在这个动荡的时代，佣兵是生活中的常见物。你已经勤奋地投资了当地佣兵很长一段时间，所以今晚看到他们在城市的街道上大声地自娱自乐时，你并不感到惊讶。如果你打算进行一些军事行动，在他们身上投入更多的资金可能会证明是富有成效的。另一个选择是缩减人数来闷他们一会，因为你很肯定，镇民们对有这么多暴躁的流氓在他们中间游荡而不受惩戒并不感到开心。"
 POD_survey_events.4.option.a: "朋友们，我为你们准备了一份新工作！"
 POD_survey_events.4.option.b: "请不要再烦扰邻居们了"
 POD_survey_events.5.t: "巡视：商机"
 POD_survey_events.5.desc: "由于你对镇上的商人阶层有相当大的影响力，你常常是第一个得知新的有利可图的机会的人。就像任何像你一样慷慨的金主一样，你会毫不犹豫地从任何新业务中获取你的分成。你的一个人脉今晚告诉了你关于最新消息和如何最好地从中获利的方式。他还说，这对城市的发展可能是一个巨大的帮助……但从其中抽取你应得的部分可能会阻碍该发展。你会怎么做？"
 POD_survey_events.5.option.a: "我会在上投资"
 POD_survey_events.5.option.b: "让我看看钱"
 POD_survey_events.5.option.c: "让 我 看 看 所 有 的 钱"
 auspexadvanced_tooltip: "这个选项可用是因为你拥有强大的观占力量"
 POD_survey_events.6.t: "巡视：新人"
 POD_survey_events.6.desc: "最近有一家新的企业在你的城市开业，你想今晚去拜访一下。很明显，这将帮助让任何外来者谁是这里商人区的真正领导者。不过，你还是有些疑虑。\n你注意到，在你的拜访之后，这些商人中的大多数人似乎在某种程度上失去了真正为社区的发展而努力的意愿。也许你可以尝试一种新的、大胆的方法，那就是不干预？"
 POD_survey_events.6.option.a: "老方法是最好的"
 POD_survey_events.6.option.b: "不去烦他"
 POD_survey_events.6.option.c: "剥削他！"
 greedy_tooltip: "这个选项可用是因为你是贪婪的吸血者"
 POD_survey_events.7.t: "巡视：信仰之人"
 POD_survey_events.7.desc: "神职人员可能是凡人社会中最难影响的部分。只需要他们中的一个成员有强烈的信仰，就能使你的整个行动陷入困境。今夜，你被告知，一位麻烦的传教士来你的镇上举办集会，他已经吸引了相当多的追随者。他对“魔鬼”和“怪物”的抨击可能是一个潜在的危险……但通过武力或其他方式进行清除也会带来后果。"
 POD_survey_events.7.option.a: "传教士滚出我的城！"
 POD_survey_events.7.option.b: "他不会是威胁……对吧？"
 POD_survey_events.7.option.c: "装作信徒混入人群"
 obfuscateadvanced_tooltip: "这个选项可用是因为你对混淆术的强力掌握"
 POD_survey_events.8.t: "巡视：新神殿"
 POD_survey_events.8.desc: "尽管你对你的领地的神职人员有不错的影响，但你一直无法阻止其在附近建造一个新的祈祷场所的计划。你现在正徘徊在它附近，恼怒地看着正在进行的施工现场。在你的地区有更多有信仰的人可能会很麻烦，因为他们往往很有能力辨别你的真实天性。不过还有时间来确保施工遭受一些不幸的挫折……"
 POD_survey_events.8.option.a: "不去烦他"
 POD_survey_events.8.option.b: "雇佣些暴徒"
 POD_survey_events.8.option.c: "吃我一拳！"
 potenceadvanced_tooltip: "这个选项可用是因为你的拳击能字面意义上的引发地震"
 POD_survey_events.9.desc: "当你在贵族区徘徊时，你遇到了一个有趣的情况。在街上，一个年轻人正试图向一位在阳台上看着他的年轻女士求爱。但这似乎不是很有效，因为他口吃得很厉害，他的爱人很快就关上了窗户，让他感到沮丧。\n他显然是一位贵族的儿子，该情况对你似乎很便利，即使有些不寻常，也有可能带来一位新人脉，该在未来可能是有用的。"
 POD_survey_events.9.option.a: "给与他一些意见"
 POD_survey_events.9.option.b: "嘲笑他"
 POD_survey_events.9.option.c: "帮助带来一个圆满的结局"
 POD_survey_events.10.t: "巡视：律法"
 POD_survey_events.10.desc: "你在你所在城市的凡人司法系统中有一些有用的人脉。你从其中一个人那里了解到，今晚将对一个案件进行审判，其中包括一些暴徒，他们可能会因为他们的错误行为而被绞死。问题是，这些是“你的”暴徒，他们仍然可以为你所用，以确保该地区的凡人听话。你会出面帮助他们吗？"
 POD_survey_events.10.option.a: "正义是盲目的"
 POD_survey_events.10.option.b: "吾即律法！"
 POD_survey_events.11.t: "巡视：盗贼"
 POD_survey_events.11.desc: "由于你在你的城市的下层社会中的人脉，你已经能够把一伙有成就的盗贼逼到墙角，他们已经困扰贵族区有一段时间了。他们只是凡人，对你不构成威胁，但他们可能会是有用的。你在考虑“雇佣”他们，确保他们的收益能回馈给你。或者你可以把他们除掉，以便在可预见的未来，让这一带更加安全。"
 POD_survey_events.11.option.a: "你现在为我工作了"
 POD_survey_events.11.option.b: "让我们阻止这些荒唐的小贼"
 POD_survey_events.12.t: "巡视：暴徒"
 POD_survey_events.12.desc: "尽管你在这个城市的下层社会中德高望重，但似乎有一位下层人士没有得到这个消息。在这位暴徒威胁你的时候，你在偷笑。真的，这一切都太古怪了，以至于你勉强压制住了笑声，这使得这位暴徒明显激动起来，用看起来很有威胁的目光向你逼近。这是个令人耳目一新的乐子，但现在该怎么做？"
 POD_survey_events.12.option.a: "吸干他"
 POD_survey_events.12.option.b: "让他为你工作"
 POD_survey_events.12.option.c: "是时候重选你的生活了"
 POD_survey_events.101.t: "巡视：平淡回归"
 POD_survey_events.101.desc: "在对你的城市进行了小规模的参观之后，你顺利地回到了你的[ROOT.Char.Custom('PODDomicile')]。夜以继夜的活动很快就会消磨掉你的理智，但至少四处走走已经让你感到很新鲜。"
 POD_survey_events.101.option.a: "一切都很顺利"
 POD_survey_events.110.t: "巡视：刺客"
 POD_survey_events.110.desc: "你几乎没有看到它的到来。\n当你回到你的[ROOT.Char.Custom('PODDomicile')]时，匕首出鞘的声音使你转过身来，正好看到一个离你的脖子太近的朦胧轮廓。对手的手下？早已被遗忘的对手？你没有时间去思考这个问题，因为杀手跳向你的动作太快了，不可能是普通人能做到的动作……"
 POD_survey_events.110.option.a: "守卫！救架！"
 survey_assassin_tooltip: "你的整支护卫队会处理这个。"
 POD_survey_events.110.option.b: "来啊"
 POD_survey_events.110.effect.success.desc: "不知所措，刺客逃了"
 POD_survey_events.110.critical.failure.effect.desc: "错判一招……"
 POD_survey_events.110.critical.failure: "血与黑暗"
 POD_survey_events.110.option.d: "快逃！"
 POD_survey_events.111.t: "巡视：刺客（二）"
 POD_survey_events.111.desc: "被你强大的防守所压制，刺客突然掉头开始逃跑。由自你的记仇心兽驱动的反射性动作，你跟着他跑了过去。你们以超自然的速度极快前进，追赶的过程中，你们跨越了街道、建筑甚至屋顶。跟着他变得相当困难，但你也从你的目标身上看到了疲惫的迹象。也许他的血已经流干了？不管是什么情况，追逐结束了而……"
 POD_survey_events.111.option.a: "……他想逃！"
 assassin_flees_tooltip: "他比你更快。该回家了。"
 POD_survey_events.111.option.b: "……你抓住了他！"
 celerityadvanced_tooltip: "这个选项可用是因为你有超自然的迅捷力量"
 list_names_survey_modifier: "名字清单"
 list_names_survey_modifier_desc: "你知道他们是谁。而且你会找到他们。"
 POD_survey_events.112.t: "巡视：刺客（三）"
 POD_survey_events.112.desc: "你正在接近那曾是猎人的猎物，突然，刺客把他的匕首转向了自己。可能是意识到他的逃跑是徒劳的，并且想象到你会做非常残酷的事情来让他开口，他选择结束自己的亡生。\n这并不是你想要的结局，但在快速扫过灰烬后，你注意到有几张关于你的悬赏。这些显然没有准确列出谁想让你死，但仍然很有启发……"
 POD_survey_events.112.option.a: "比什么都没有强"
 POD_survey_events.120.t: "巡视：火焰"
 POD_survey_events.120.desc: "为何是现在？还说只是凡人的无能？又或是你某个对手的间接攻击？不管罪魁祸首是谁，一场大火已经开始在你的城市周围蔓延，并环绕着接近你的位置，使得返回你的[ROOT.Char.Custom('PODDomicile')]变得很危险。\n当你考虑如何最好地避开，或清除那些尖叫的凡人和贪婪的火焰时，你的心兽开始在它的囚笼里咆哮。这将有点难办。"
 POD_survey_events.120.option.a: "守卫！开路！"
 beast_takeover_survey_tooltip: "你血狂的心兽将带你到安全的地方"
 POD_survey_events.120.option.b: "我会找到出路……"
 POD_survey_events.120.effect.success.desc: "你成功逃离最糟糕的地狱之灾"
 POD_survey_events.120.critical.failure.effect.desc: "其终如其始。与火之中。"
 POD_survey_events.120.critical.failure: "好烫！好烫！"
 POD_survey_events.120.option.d: "让心兽接管状况"
 POD_survey_events.121.t: "巡视：火焰（二）"
 POD_survey_events.121.desc: "你设法避开了最猛烈的火焰，凡人正在慢慢地清除它。可悲的是，你的逃生路线使你离你的[ROOT.Char.Custom('PODDomicile')]很远，如果你想过去的话，这太远了，你将无法避免清晨的太阳。因此，你别无选择，只能在一个不体面的地方找个避难所，直到你第二天晚上能回到你的根据地。"
 POD_survey_events.121.option.a: "这就像是去露营！"
 survey_fire_ending_tooltip: "你于次夜回到家里，感到很脏，但仍旧无损的活着。"
 POD_survey_events.121.option.b: "我将遁入大地"
 proteanadvanced_tooltip: "这个选项可用是因为你对变形术的掌握。"
 POD_survey_events.121.option.c: "安排良好的住宿"
 POD_survey_events.130.t: "巡视：猎人"
 POD_survey_events.130.desc: "伏击！在你返回[ROOT.Char.Custom('PODDomicile')]的路上，一队显然是有组织的（而且消息灵通）的吸血鬼猎人已经包围了你。他们装备精良，态度谨慎，证明这不是他们的第一次猎杀。凡人通常不是问题，但这样一群带着火把、火箭和可能有一两个真信信徒的人完全是另一回事……你在考虑你的下步行动。"
 POD_survey_events.130.option.a: "守卫！处理他们！"
 best_bravely_tooltip: "他们没料到你会逃跑。你很容易的让他们追丢了，但他们会记住你"
 POD_survey_events.130.option.b: "来战！"
 POD_survey_events.130.effect.success.desc: "彻底的胜利！"
 POD_survey_events.130.critical.failure.effect.desc: "其终如其始。与火之中。"
 POD_survey_events.130.critical.failure: "好烫！好烫！"
 POD_survey_events.130.option.d: "快逃！"
 POD_survey_events.131.t: "巡视：猎人（二）"
 POD_survey_events.131.desc: "你取得了胜利。你将用这些凡人的血帮助自己，他们不再需要它了，并考虑如何处理这次袭击中受伤的幸存者，其现在任由你摆布。把他们带回你的[ROOT.Char.Custom('PODDomicile')]，在你的宫廷前进行“示威”，似乎是一个不错的放松选择。或者你可以在你城市的中心地带进行更公开的示威，但这肯定会在未来引起更多猎人的注意。"
 POD_survey_events.131.option.a: "弄成私人展示品听起来不错"
 POD_survey_events.131.option.b: "支配其，让他人不再跟踪你"
 POD_survey_events.131.option.c: "是时候杀鸡儆猴了"
 POD_survey_events.140.t: "巡视：先知"
 POD_survey_events.140.desc: "当你回到你的[ROOT.Char.Custom('PODDomicile')]时，一个老人向你搭讪，喃喃自语，似乎是语无伦次的废话。不过你能听出“吸血鬼”和“天主”这样的词，这引起了你的注意。当你稍稍放慢脚步时，这个疯子走得更近了，开始比以前更兴奋地说话。即使注意到了，理解他想说的一丝一毫也是相当大的难事。"
 POD_survey_events.140.option.a: "留步且听"
 ending_survey_tooltip: "你没受更多阻碍，直接回到家中"
 POD_survey_events.140.option.b: "我不听任何疯子的话"
 POD_survey_events.140.effect.success.desc: "这很合理，某种意义上"
 POD_survey_events.140.critical.failure.effect.desc: "我没搞懂……"
 POD_survey_events.140.critical.failure: "毫无线索！"
 POD_survey_events.141.t: "巡视：先知（二）"
 POD_survey_events.141.desc: "好吧，这……并不完全是“开悟”，但关于这个老人所说的事情，至少有一些有趣的事情值得深思。虽然这种预言的性质总是很隐蔽，在大多数时候并不值得一听。无论如何，这位自称的预言家很高兴你听了他的话，并让你独自离开。你的[ROOT.Char.Custom('PODDomicile')]正在还等你回归，你的疑问多于解答。"
 POD_survey_events.141.option.a: "胡言乱语罢了"
 malkavian_survey_tooltip: "这个选项可用是因为你是末卡维"
 POD_survey_events.141.option.b: "问题才是重点！"
 POD_survey_events.141.option.c: "不不，这一清二楚"
