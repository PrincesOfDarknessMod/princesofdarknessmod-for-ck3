 artifact_elemental_armor_name: "元素护甲"
 artifact_elemental_armor_description: "在地元素庭中发现的一副神秘护甲。它似乎能够与四大元素庭的力量产生共鸣，并在适当的时机利用这些力量来强化自身。"
 POD_umbra_gp.110.t: "元素护甲"
 POD_umbra_gp.110.desc: "在旅行者真正到达五大门之前，在众峰的中段能找到元素庭，每个元素都有一个界域来代表其固有的性质。地之界主要分布在众峰的北面，在它们显现或用魔法感知检测之前，并不能立即与众峰本身的物质区分开来，它们会以洞穴或奇特岩层的形式出现。这些界域及其居民的短暂形体相当于物质的固态，除非受到外力作用，否则会保持独特的形状和体积。\n旅途虽然有些艰辛，但由于之前对该地区进行了彻底的侦察，你设法找到了探险的目标——一套奇怪的（显然是魔法的）盔甲。简单检查一下就会发现，这并不是一件显眼的盔甲，尽管它似乎在汲取元素庭的能量。不过把它带在身上也没什么坏处，所以你就这么做了。将来也许有办法提高它的潜力。"
 POD_umbra_gp.110.a: "我想还得继续。"
 POD_umbra_gp.111.desc: "在旅行者真正到达五大门之前，在众峰的中段能找到元素庭，每个元素都有一个界域来代表其固有的性质。爬上众峰的南坡，星界旅行者可能会遇到火之界，除非以地热喷口或火山口的形式显现外，它那绽开的火焰和燃烧的区域都显得格格不入。\n你的元素护甲会对这些强大的能量做出反应，显然是想让你尽可能靠近这片地狱，真正沉浸其中。这是一个有点令人紧张的前景。"
 POD_umbra_gp.111.a: "烫烫烫！"
 POD_umbra_gp.111.b: "这不值得。"
 POD_umbra_gp.112.desc: "在旅行者真正到达五大门之前，在众峰的中段能找到元素庭，每个元素都有一个界域来代表其固有的性质。气之界一般位于众峰的东面，不了解的人可能会误以为是表层云，但通过研究在其中和周围活动的诸灵的形态和活动，它们的本质就显而易见了。它们短暂的形体与物质的气态相对应，不断膨胀和渗透，以填充它们占据的空间。\n你的元素护甲正在对这些强大的能量做出反应，显然是想让你尽可能地接近飓风，真正地沐浴其中。这是一个有点令人紧张的前景。"
 POD_umbra_gp.112.a: "风拂过我的头发……"
 POD_umbra_gp.113.desc: "在旅行者真正到达五大门之前，在众峰的中段能找到元素庭，每个元素都有一个界域来代表其固有的性质。水元素的界域通常位于众峰的西坡，可以是山泉、瀑布，甚至是宽阔岩壁上的湖泊。这些界域及其居民的短暂形体与物质的液态相对应，它们会流动到所占空间的形状中，但体积保持不变。\n你的元素护甲正在对这些强大的能量做出反应，显然是想让你尽可能靠近汹涌的波涛，真正沉浸其中。这是一个有点令人紧张的前景。"
 POD_umbra_gp.113.a: "小心别被水冲走……"
