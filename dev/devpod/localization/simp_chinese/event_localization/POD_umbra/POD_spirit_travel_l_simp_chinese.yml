 POD_umbra_pet.400.t: "[ROOT.Char.Custom('UnicornStoryName')|U]与[ROOT.Char.Custom('PegasusStoryName')]：天角兽"
 POD_umbra_pet.400.desc: "有翼独角兽（“独角飞马”、“天角兽”或“空角兽”）是一种同时有飞马的翅膀和独角兽的角的虚构马。但现在我有了我的独角兽[ROOT.Char.Custom('UnicornStoryName')|U]和天马[ROOT.Char.Custom('PegasusStoryName')]，我也许能够将这传说中的生物化为现实，带入我们的世界。"
 POD_umbra_pet.400.a: "值得一试。"
 POD_umbra_pet.400.b: "很可惜，[ROOT.Char.Custom('UnicornStorySheHe')|U]与[ROOT.Char.Custom('PegasusStorySheHe')|U]之间无法配种。"
