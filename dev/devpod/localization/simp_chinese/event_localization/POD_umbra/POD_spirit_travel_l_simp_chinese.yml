l_simp_chinese:
 POD_umbra_pass.101.t: "开启虚洞"
 POD_umbra_pass.101.desc: "在[UmbraGlossary('shadowlands')]和[UmbraGlossary('tempest')]之间存在着一层影膜，你得先在上开启一个[GetModifier('nihil_modifier').GetNameWithTooltip]来进入[UmbraGlossary('tempest')]。"
 POD_umbra_pass.101.a: "我将做出献祭来开启它。"
 POD_umbra_pass.101.b: "我将使用我的即用虚洞。"
 POD_umbra_pass.103.t: "不再游荡"
 POD_umbra_pass.103.desc: "你完全不受活人世界的束缚，只要你想，就可以直接前往[UmbraGlossaryLocalized('shadowlands','冥界')]不复返。你仍然在这里的唯一原因是你想在这里，而不是说你必须像大多数鬼魂一样受束。你确定你现在就要离世吗？"
 POD_umbra_pass.103.a: "是时候跨越[UmbraGlossary('tempest')]了。"
 POD_umbra_pass.103.b: "我还有事要做。"
 POD_umbra_pass.104.t: "穿过尸幕"
 POD_umbra_pass.104.desc: "你确定要以将自己射过尸幕吗？这将伤害你的[Corpus|E]（伤害相当于当地的尸幕等级）。"
 POD_umbra_pass.104.a: "是的！"
 POD_umbra_pass.104.b: "不"
 POD_umbra_diplomacy.desc: "你被住在这个区域的人拦住了，也许你可以说服他们告诉你如何通过？[umbra|E]的居民是出了名的难以理解，甚至更难以说服。"
 POD_umbra_martial.desc: "你被一个棋局所阻止，是时候展示你有多善于此道了。不过，以缚灵形式玩“动态”战役，一开始是很难掌握的，这使得这是一种令人不安的超现实体验。"
 POD_umbra_stewardship.desc: "你被一个数学谜题拦住了，你善于此么？你必须先破译诡计多端的灵类所使用的数字，这使问题更难解决。"
 POD_umbra_intrigue.desc: "你在路上遇到了一个强大的灵卫，也许你可以用一些小把戏来分散其的注意力？不过最好让人信服，他看起来真的不友好。"
 POD_umbra_learning.desc: "你被一个字谜拦住了，你能解决这个问题吗？[umbra|E]是“真实”世界的扭曲版本，你可以找到一些规律和线索，至少对你有一点意义。"
 POD_gauntlet.101.t: "险棘"
 POD_gauntlet.101.desc: "险棘，也在中原被称为绝壁，是围绕着物质现实的屏障，将其与[umbra|E]分开。\n\n你可以通过能力将险棘强化或弱化，如果被提升到10，当地的灵类得耗费意志力不然必须逃离本地。"
 POD_gauntlet.101.a: "增强险棘"
 POD_gauntlet.101.b: "削弱险棘"
 POD_gauntlet.101.c: "击溃险棘！"
 POD_gauntlet.101.d: "算了。"
 POD_gauntlet.102.t: "绝壁"
 POD_gauntlet.102.desc: "中原的灵界受一道神秘的壁障阻碍，这道壁障被称作绝壁，它阻隔了[spirit_worlds|E]和凡界之间的直接接触。绝壁在部分地区极其强大，于某些地方又极其薄弱，但绝壁无处不在永不缺席。\n\n你可以通过能力将绝壁强化或弱化，如果被提升到10，当地无法使用任何气功功法，同时当地的灵类得耗费意志力不然必须逃离本地，此类环境下使用气池能量会极大不适而且困难。"
 POD_gauntlet.102.a: "增强绝壁"
 POD_gauntlet.102.b: "弱化绝壁"
 POD_gauntlet.102.d: "算了。"
 POD_umbra_lost.100.t: "#X 落入湮灭#!"
 POD_umbra_lost.100.desc: "#X 你落入到湮灭中……#!"
 POD_umbra_lost.100.a: "#X ……#!"
 POD_umbra_lost.104.t: "困在深渊"
 POD_umbra_lost.104.a: "我会再逃出去的！"
 POD_umbra_lost.104.b: "我会献祭一名囚犯。"
 POD_umbra_lost.104.desc_demon: "你再次落入上帝在路西法反叛之后为你的同族创造的永恒监狱。上帝，似乎仍然笑到最后。"
 POD_umbra_lost.104.desc_infernalist: "你困在了地狱，似乎除非向恶魔领主献祭之外没有办法出来……"
 POD_umbra_lost.104.c: "我不和恶魔做交易！"
 POD_umbra_diplomacy.success: "外交挑战：成功"
 POD_umbra_diplomacy.fail: "外交挑战：失败"
 POD_umbra_martial.success: "军事挑战：成功"
 POD_umbra_martial.fail: "军事挑战：失败"
 POD_umbra_stewardship.success: "管理挑战：成功"
 POD_umbra_stewardship.fail: "管理挑战：失败"
 POD_umbra_intrigue.success: "谋略挑战：成功"
 POD_umbra_intrigue.fail: "谋略挑战：失败"
 POD_umbra_learning.success: "学识挑战：成功"
 POD_umbra_learning.fail: "学识挑战：失败"
 POD_gauntlet.102.c: "击溃绝壁！"
 POD_umbra_kj.1001.t: "灵感"
 POD_umbra_kj.1001.desc: "邻近绝壁的[spirit_worlds|E]区域被称为镜像之地，因为其看起来就像附近中原地区的倒影而得名。\n\n看到这奇异的景色让你感到悟得了什么。"
 POD_umbra_kj.1001.a: "厉害！"
 POD_umbra_kj.1002.t: "灵师教导"
 POD_umbra_kj.1002.desc_opening: "你进入了[spirit_world|E]，尽可能的深，然后你遇到了一位"
 POD_umbra_kj.1002.desc_high: "上古者，历史记录上的[Glossary('万鬼','game_concept_kuei_jin_desc')]，太上老祖"
 POD_umbra_kj.1002.desc_yin: "[Glossary('阎魔王','podgloss.yamaking')]"
 POD_umbra_kj.1002.desc_yang: "强大灵类"
 POD_umbra_kj.1002.desc_low: "普通灵类"
 POD_umbra_kj.1002.desc_ending: "其向你分享了一些[Glossary('心法','podgloss.dharma')]理解。"
 POD_umbra_kj.1002.a: "我的灵师。"
 POD_umbra_action.1001.t: "战界"
 POD_umbra_action.1001.desc: "战界是一个致力于暴力和愤怒的领域，混乱统治一切，军队混合在一起，秦朝士兵与罗马军团作战，十字军与维京野蛮人结盟对抗玛雅军队。只要不进入其中一个冲突，旅者可走在与他们所见证的战斗相适应的“过道”上（海战时是船、布匿战争是罗马道路、等等）。只要他们不踏出过道，他们就不会被直接攻击。\n这是学习新的（或旧的）战略的好方法，可以在某种程度上与你的时代相连。"
 POD_shroud.101.t: "尸幕"
 POD_shroud.101.desc: "[UmbraGlossaryLocalized('shadowlands','冥界')]与[Glossary('皮囊之地','game_concept_skinlands_desc')]被一个被称为”尸幕“的神秘屏障分开。尸幕使大多数生物无法感知[UmbraGlossary('shadowlands')]，并使死人无法看到[Glossary('皮囊之地','game_concept_skinlands_desc')]的活动。它在部分地区极其强大，于某些地方又极其薄弱，但它无处不在永不缺席。\n\n你可以通过能力将尸幕强化或弱化，如果被提升到10，当地的灵类得耗费意志力不然必须逃离本地。"
 POD_shroud.101.a: "增强尸幕"
 POD_shroud.101.b: "削弱尸幕"
 POD_shroud.101.c: "击溃尸幕！"
 POD_shroud.101.d: "算了"
 POD_umbra_pass.202.t: "跨过暗隐寺庙"
 POD_umbra_pass.202.desc: "暗隐寺庙是[UmbraGlossary('malfeas')]的一个地点，位于[UmbraGlossary('black_spiral_labyrinth')]的入口。它是清真寺和大教堂的混合体，是东方宣礼塔和西方柱身凹槽的混合体。"
 POD_umbra_pass.202.a: "我将要求通过。"
 POD_umbra_pass.202.a.tt: "这个选项可用是因为你是$glossary_wyrm$的仆从。"
 POD_umbra_pass.202.b: "我想溜进去"
 POD_umbra_pass.202.b.duel.tt.success: "还好过了。"
 POD_umbra_pass.202.b.duel.tt.failure: "！"
 POD_umbra_pass.202.c: "我最好还是别进去。"
 POD_umbra_pass.205.t: "停下！"
 POD_umbra_pass.205.desc: "你被守卫拦住了，他们觉得你不是冥河城的一份子，你将如何处理？"
 POD_umbra_pass.205.a: "我是来加入军团的。"
 POD_umbra_pass.205.b: "我是来加入行会的。"
 POD_umbra_pass.205.c: "我已经是你们的一员了！"
 POD_umbra_pass.205.d: "我只是在周边走走。"
 POD_umbra_pass.206.t: "停下！"
 POD_umbra_pass.206.desc: "你被守卫拦住了，他们觉得你不是[UmbraGlossary('far_shore')]的一份子，你将如何处理？"
 POD_umbra_pass.206.a: "我是来赞扬闪耀者的。"
 POD_umbra_pass.206.b: "我已经是你们的一员了！"
 POD_umbra_pass.206.c: "我只是在周边走走。"
 POD_umbra_pass.207.t: "停下！"
 POD_umbra_pass.207.desc: "狄斯被由失事船只组成的迷宫所保护，里面住着一些被努德里的怀拥所奴役的怨灵，以防止好奇的死灵和敌对的怨灵靠近。穿过迷宫的路径不断变化，没有船夫协会的同意，几乎不可能进入狄斯。你将如何处理？"
 POD_umbra_pass.207.a: "我想向你们效忠。"
 POD_umbra_pass.207.b: "我只是在周边走走。"
 POD_umbra_pass.207.a.duel.desc: "断绝仪式"
 POD_umbra_pass.208.t: "步入太阳"
 POD_umbra_pass.208.desc: "赫利俄斯所在的[UmbraGlossary('deep_umbra')]，除了热量和耀眼的白光，什么都没有。在赫利俄斯的界域内，任何表面都因温度过高而无法长时间站立或停留。只有会飞的灵体才能进入该[UmbraGlossary('deep_umbra')]区域，没有飞行能力的旅行者还没来得及意识到自己的错误，就会被烈火焚烧殆尽。\n\n你确定要触摸太阳本身吗？"
 POD_umbra_pass.208.a: "是，我要触摸太阳本身。多好的主意！"
 POD_umbra_pass.208.b: "赫利俄斯将保护我的灵魂。"
 POD_umbra_pass.208.c: "伟哉日神。"
 POD_umbra_prowess.success: "勇武挑战：成功"
 POD_umbra_prowess.fail: "勇武挑战：失败"
 POD_umbra_prowess.desc: "你被一位灵类拦住了，也许你可以与其战斗并获取战利品。"
 umbra_expedition_challange_spirit: "你将与一位灵类进行[single_combat_duel|E]。"
 umbra_expedition_challange_spirit.win: "你将获得祝福[modifier|E]或[prestige|E]。"
 POD_umbra_expedition.101.t: "一比灵"
 POD_umbra_expedition.101.desc: "选择一项祝福。"
 POD_umbra_expedition.101.fallback: "我拒绝它们。"
 POD_umbra_expedition.201.t: "灵类小贩"
 POD_umbra_expedition.201.desc: "你遇见了一位在售卖宝物的灵类，你想要买什么？"
 POD_umbra_expedition.201.fallback: "我不需要这些。"
 POD_umbra_pass.101.c: "算了。"
 POD_artifact_pieces.100.t: "合成遗物碎片"
 POD_artifact_pieces.100.desc: "你找到一位死灵工匠，[creator.GetFirstName]，[creator.GetSheHe]也许能帮你合成已装备的遗物碎片。你想合成什麽？"
 POD_artifact_pieces.100.b: "使用这些碎片来强化一件装备着的宝物。"
 POD_artifact_pieces.100.c: "强化该碎片。"
 POD_artifact_pieces.100.c.tt: "你会试着熔铸已装备的数个碎片更强大的一片。"
 POD_artifact_pieces.100.c.success: "你装备的碎片现已强化。"
 POD_artifact_pieces.100.d: "也许改夜吧。"
 POD_artifact_pieces.100.back: "回到先前选项。"
 POD_artifact_pieces.300.t: "加强遗物"
 POD_artifact_pieces.300.desc: "你想强化哪种宝物？"
 POD_artifact_pieces.300.a: "武器"
 POD_artifact_pieces.300.a.invalid: "你#bold 没有#!未强化过的已装备武器。"
 POD_artifact_pieces.300.b: "盔甲"
 POD_artifact_pieces.300.b.invalid: "你#bold 没有#!未强化过的已装备盔甲。"
 POD_artifact_pieces.300.c: "礼器"
 POD_artifact_pieces.300.c.invalid: "你#bold 没有#!未强化过的已装备礼器。"
 POD_artifact_pieces.300.d: "冠冕"
 POD_artifact_pieces.300.d.invalid: "你#bold 没有#!未强化过的已装备冠冕。"
 POD_umbra_expedition.201.artifact_1: "[artifact_1.Custom('ColorizedArtifactNameNoTooltip')]"
 POD_umbra_expedition.201.artifact_2: "[artifact_2.Custom('ColorizedArtifactNameNoTooltip')]"
 POD_umbra_expedition.201.artifact_3: "[artifact_3.Custom('ColorizedArtifactNameNoTooltip')]"
 POD_umbra_expedition.201.reroll: "其他选项？"
 POD_umbra_expedition.300.t: "与战士灵君的会面"
 POD_umbra_expedition.300.desc: "灵君是$glossary_fera$用来描述一类灵类的术语；它们比天神弱小，但无论如何都是极其强大的灵类。灵君有明确的职责和影响范围，但他们强大到足以存在于现实的多个层面。\n根据线索，你成功找到了战士灵君，其承诺如果你能完成一项任务：杀死世界上最强大的妖蛆派统治者，其就会传授你传说中的无敌战士灵赋。"
 POD_umbra_expedition.300.a: "接受挑战"
 POD_umbra_expedition.302.t: "无敌战士"
 POD_umbra_expedition.302.desc: "你已经到达了任务注定的敌人所在地，是时候决一死战了。"
 POD_umbra_expedition.302.a: "我在这！"
 POD_umbra_expedition.304.t: "奖励"
 POD_umbra_expedition.304.desc: "你已经证明了自己的价值，战士灵君将灵赋传授给了你。你已达到狼人勇武的巅峰。"
 POD_umbra_expedition.304.a: "一场旷世胜利！"
 POD_umbra_expedition.400.t: "与盖亚化身的会面"
 POD_umbra_expedition.400.desc: "盖亚比天神更上一层，是已知得极强灵类之一——也许还是第一个和最强的。她被认为创造了狼族和大多数$glossary_fera$，作为她在物界和[spirit_worlds|E]的战士和使徒。\n根据线索，你成功找到了盖亚的化身，她承诺如果你能完成一项任务：收集传奇书籍，她就会传授你传说中的说书人灵赋。"
 POD_umbra_expedition.400.a: "接受挑战"
 POD_umbra_expedition.500.t: "与强大灵类的会面"
 POD_umbra_expedition.500.desc: "诸灵和[spirit_world|E]是狼族和其他化形种族生活和文化的一个重要方面。眉月狼尤其擅长通过灵务与诸灵讨价还价，并通过灵赋和仪式束缚诸灵。\n根据线索，你成功找到了一位特别强大的灵类，其承诺如果你能完成一项任务：摧毁$glossary_wyrm$肆虐的影幕，其就会传授你传说中的解脱束缚灵赋。"
 POD_umbra_expedition.500.a: "接受挑战"
 POD_umbra_expedition.600.t: "与郊狼神的会面"
 POD_umbra_expedition.600.desc: "郊狼神是究极诡骗师，比新月狼还要新月狼，是混乱的化身。郊狼神深不可测，常常愚蠢至极，却又才华横溢，他既是一位骗术大师，也是一位非常聪明的战士。\n根据线索，你成功找到了诡计多端的郊狼神的化身，他承诺如果你能完成一项任务：将一个帝国送给别人，他就会传授给你传说中的盗火者灵赋。只有郊狼神知道他为什么会提出这样的要求。"
 POD_umbra_expedition.600.a: "接受挑战"
 POD_umbra_expedition.700.t: "与盖亚的会面"
 POD_umbra_expedition.700.desc: "盖亚比天神更上一层，是已知得极强灵类之一——也许还是第一个和最强的。她被认为创造了狼族和大多数$glossary_fera$，作为她在物界和[spirit_worlds|E]的战士和使徒。\n根据线索，你成功找到了盖亚本人，她承诺如果你能完成一项任务：统一狼国，她就会传授你传说中的再生产灵赋。考虑到你同胞的分裂本性，这可能是最困难的任务。"
 POD_umbra_expedition.700.a: "我将在完成后再来，母亲。"
 POD_umbra_expedition.700.b: "我做到了！"
 POD_umbra_expedition.800.t: "与芬尼安祖灵的会面"
 POD_umbra_expedition.800.desc: "芬尼安在狼族中以其对生活乐趣的热情、战斗的技巧和勇猛而闻名，并也是狼族的音乐、故事和传说的传承者。他们的祖灵往往是最聪明的。\n根据线索，你成功找到了一些芬尼安祖灵，他们承诺如果你能完成一项任务：完成盖亚的英雄决议，他们就会传授你传奇灵赋。"
 POD_umbra_expedition.800.a: "我将在完成后再来，祖先们。"
 POD_umbra_expedition.800.b: "我做到了！"
 POD_umbra_expedition.900.t: "与大芬里尔的会面"
 POD_umbra_expedition.900.desc: "北欧传说中的狼神——芬里尔是一头在末日吞噬太阳的野兽。芬里尔力量强大，嗜血成性，从来和今后都不会让步。芬里尔仔兽的守护灵是战士的图腾，只对经常让敌人流血的狼族战群感兴趣。\n根据线索，你成功找到了大芬里尔本狼，他承诺如果你能完成一项任务：完成盖亚的狂战士决议，他就会传授你传奇灵赋。"
 POD_umbra_expedition.900.a: "我将在完成后再来，大芬里尔。"
 POD_umbra_expedition.900.b: "我做到了！"
 POD_umbra_expedition.1000.t: "与祖狼的会面"
 POD_umbra_expedition.1000.desc: "赤爪说，他们的部族是直接由盖亚建立的，他们是最纯粹的狼族，一直保持着最初的形态。因此，他们比其他部族更崇拜历史上最早的狼。\n根据线索，你成功找到了祖狼本狼，他承诺如果你能完成一项任务：完成盖亚之怒决议，他就会传授你传奇灵赋。"
 POD_umbra_expedition.1000.a: "我将在完成后再来，先祖。"
 POD_umbra_expedition.1000.b: "我做到了！"
 POD_umbra_expedition.1100.t: "与盖亚化身的会面"
 POD_umbra_expedition.1100.desc: "盖亚比天神更上一层，是已知得极强灵类之一——也许还是第一个和最强的。她被认为创造了狼族和大多数$glossary_fera$，作为她在物界和[spirit_worlds|E]的战士和使徒。\n根据线索，你成功找到了盖亚的化身，她承诺如果你能完成一项任务：王的回归，她就会传授你传说中的说书人灵赋。"
 POD_umbra_expedition.1100.a: "我将在完成后再来，母亲。"
 POD_umbra_expedition.1100.b: "我做到了！"
 POD_umbra_expedition.1200.t: "与奇美拉化身的会面"
 POD_umbra_expedition.1200.desc: "奇美拉是星占的守护灵，是谜的化身。她有许多面孔，邀请战群去寻找每个狼人在层层谜题和自欺欺人之下所蕴藏的智慧。\n根据线索，你成功找到了奇美拉的化身，她承诺如果你能完成一项任务：完成盖亚的智慧决议，她就会传授你传奇灵赋。"
 POD_umbra_expedition.1200.a: "我将在完成后再来，奇美拉。"
 POD_umbra_expedition.1200.b: "我做到了！"
 POD_umbra_expedition.1300.t: "与恶神灵君的会面"
 POD_umbra_expedition.1300.desc: "恶神曾经是凡人，但他们被一种特殊的恶惑彻底侵蚀，变成了体现这种恶惑的强大灵体。每位恶神都为它服务，直到他以某种方式失败，或者有更新、更强大的候选人浮出水面。每当有必要采取更直接的行动时，恶神就会充当恶惑的眼睛、耳朵、声音，有时还会充当恶惑的双手。\n根据线索，你成功找到了一位恶神灵君，其承诺如果你能证明自己对妖蛆的忠诚，其就会传授你传奇灵赋。"
 POD_umbra_expedition.1300.a: "接受挑战"
 POD_umbra_expedition.1400.t: "与低语者的会面"
 POD_umbra_expedition.1400.desc: "作为秘密之灵，低语者带领她的盟友们发现秘密。只要稍加努力，她所选中的人就能破译常人无法理解的信息。这位伴灵飘荡在空中，看不见也听不见。据说她是伴灵们的回声，是天之声，以半信半疑的记忆形式传入凡间。她是一个很难找到的伴灵，往往只在最聪明的芭丝特前现身。\n根据线索，你成功找到了低语者，而神秘的灵类则将你引向通往终极秘密——圣甲虫脱壳的道路。这个仪式显然是布巴斯提获得永生的关键，它是伊西斯的生命神咒的衍生品，却有着更加邪恶的名声。只要你能让木乃伊开口……"
 POD_umbra_expedition.1400.a: "九条命还是不够用。"
 POD_umbra_expedition.1500.t: "与抹除者的会面"
 POD_umbra_expedition.1500.desc: "抹除者是芭丝特对平衡之$glossary_wyrm$在被囚禁和腐化之前的称呼。芭丝特说，[Glossary('卡赫拉什', 'glossary_wyrm_tt')]，$glossary_triat$中的平衡净化者的原名，仍然存在，忠实地履行着他最初的使命。这与大多数其他$glossary_fera$的传言相冲突，在这些传言中，整个妖蛆现在都是邪恶之力。\n不管真相如何，众所周知，卡赫拉什喜欢强大的辛巴。注意到你的力量，灵类向你提出了挑战。你的奖励是什么？足够强大的，被猫国他人禁止的……"
 POD_umbra_expedition.1500.a: "接受挑战"
 POD_umbra_expedition.1600.t: "与大祖父的会面"
 POD_umbra_expedition.1600.desc: "根据他们的传说，古拉赫勒是盖亚最初的保护者，他们的诞生是为了抵御式样破坏者的破坏力。\n根据线索，你成功找到了大祖父，古拉赫勒的原初守护灵之一，他承诺如果你能完成一项任务，他就会传授你传奇灵赋。"
 POD_umbra_expedition.1600.a: "接受挑战"
 POD_umbra_expedition.1700.t: "与和迩的会面"
 POD_umbra_expedition.1700.desc: "和迩又称龙王或陆龙，是娜迦用来描述作为族群守护灵的伟大龙灵的术语，也是唯一知道神圣秘密的灵类。\n根据线索，你成功找到了和迩，其承诺如果你能完成一项任务，其就会传授你传奇灵赋。"
 POD_umbra_expedition.1700.a: "接受挑战"
 POD_umbra_expedition.1800.t: "与郊狼神的会面"
 POD_umbra_expedition.1800.desc: "郊狼神是究极诡骗师，比新月狼还要新月狼，是混乱的化身。郊狼神深不可测，常常愚蠢至极，却又才华横溢，他既是一位骗术大师，也是一位非常聪明的战士。\n根据线索，你成功找到了郊狼神，他承诺如果你能完成一项任务，他就会传授你传奇灵赋。"
 POD_umbra_expedition.1800.a: "接受挑战"
 POD_umbra_expedition.399.t: "转念一想"
 POD_umbra_expedition.399.desc: "也许对于一位$glossary_wyrm$信徒来说，去跟一位无比强力的盖亚灵类会面不是什么好主意？"
 POD_umbra_expedition.399.a: "逃！"
 POD_umbra_expedition.399.b: "没什……"
 POD_umbra_gp.101.t: "面见最后的白嚎"
 POD_umbra_gp.101.desc: "作为震天战群的成员，科鲁克是唯一一位成功逃离黑螺旋并返回地表的白嚎部族成员。他被他那被污染的同族追捕，并且几乎被杀，但是他被骨雕者——一个被白嚎祖灵艾丹·远望者附身的神秘者——所救。在他临死之前，他设法向狼国警告白嚎已经堕落。\n在他去世后，他无法成为祖灵，因为白嚎的部族母界已经被妖蛆污染所改变。因此，他陷入了[UmbraGlossaryLocalized('shadowlands','暗影界')]，成为一名游荡的死灵。受折磨的回忆几乎使他陷入[UmbraGlossary('oblivion')]，直到一小队黑螺旋舞者来到[UmbraGlossaryLocalized('shadowlands','暗影界')]。科鲁克试图与他们交涉，但当他的询问遭到嘲笑时，他将他们的灵魂从身体中抽出，使他们自己也成为死灵。他花费了漫长的岁月来清除他们身上的妖蛆污染，并与他们组成了自己的战群。这支小队现在在[UmbraGlossary('shadowlands')]中旅行，寻找摧毁被腐化的白嚎狼嫡的灵，或者转化（必要时摧毁）其他黑螺旋舞者的灵。\n在找到他之后，如果你能完成一项任务，他会提供互助的契约。"
 POD_umbra_gp.101.a: "部族的最后一人，你有什么请求？"
 POD_umbra_gp.101.b: "我没时间。"
 POD_umbra_gp.102.t: "面见唯一的白嚎祖灵"
 POD_umbra_gp.102.desc: "艾丹·远望者是人子凸月白嚎狼，活于公元前31年。因为永恒追踪仪式，艾丹的灵在他去世后依然追逐着那位溺没之王。公元200年，艾丹附身于一位被称为“骨雕者”的白嚎向导身上，一位来自深湖圣地的眉月狼。艾丹亲眼目睹了他的部族的厄运，英勇地与首批黑螺旋舞者战斗，但却无法阻止它的发生。他成为了唯一幸存的白嚎部族的祖灵。\n如果你能完成他的任务，他会向你提供他的服务（如果你是狼人，还可以教授你白嚎的灵赋）。"
 POD_umbra_gp.102.a: "我将倾听，聪慧的先祖。"
 POD_umbra_gp.102.b: "我没时间。"
 POD_umbra_gp.103.t: "亚里士多德"
 POD_umbra_gp.103.desc: "亚里士多德是古希腊的哲学家和博学家。他的著作涵盖了广泛的主题，包括自然科学、哲学、语言学、经济学、政治学、心理学和艺术。作为雅典的伊壁鸠鲁学派哲学的创始人，他开启了随之而来的更广泛的亚里士多德传统，为现代科学的发展奠定了基础。亚里士多德晚年的生活被他与曾经的学生亚历山大之间日益恶化的关系所困扰。被迫逃离雅典的家园，他的死对于这样一位备受尊崇的哲学思想巨擘来说并不光彩，这可能是他在去世后来到卡戎的国度的原因。\n他对凡人世界的兴趣，就像大多数死灵一样，你已经轻易地说服了他来到你的宫廷。"
 POD_umbra_gp.103.a: "你能使我成为下一位亚历山大么？"
 POD_umbra_gp.103.b: "没兴趣。"
 POD_umbra_gp.104.t: "希帕蒂娅"
 POD_umbra_gp.104.desc: "希帕蒂娅是一位新柏拉图主义哲学家、天文学家和数学家，生活在当时属于东罗马帝国的埃及亚历山大港。她在亚历山大港是一位杰出的思想家，教授哲学和天文学。她是第一位生平记录相对完整的女性数学家。希帕提娅在她的一生中以伟大的教师和智慧的顾问而闻名。她撰写了对丢番图的十三卷《算术》的评论，以及对阿波罗尼奥斯关于圆锥曲线的论文的另一份评论。\n作为一位发明家，希帕蒂娅制作了天文仪和水力计。她对基督徒持宽容态度，并教授了许多基督教学生，包括未来的托勒密主教辛奈西斯。希帕提娅受到原始教徒和基督徒的广泛喜爱，并在亚历山大港的政治精英中建立了巨大的影响力。在她生命的最后阶段，希帕蒂娅为亚历山大港的罗马总督欧瑞斯特提供了建议，而他正处于与亚历山大港的主教西里尔之间的政治争斗中。谣言传开，指责她阻止欧瑞斯特与西里尔和解，415年3月，她被一群以一位名叫彼得的读经员为首的基督徒暴民杀害。\n在[umbra|E]徘徊时，你遇到了一个自称是她的灵，据说她在著名的[umbra|E]博学院担任院长。她可以成为一位宝贵的盟友。"
 POD_umbra_gp.104.a: "拜托了，在我的宫廷里你会学到很多东西！"
 POD_umbra_gp.104.b: "没兴趣。"
 POD_umbra_gp.105.t: "马哈福兹·阿拉姆"
 POD_umbra_gp.105.desc: "马哈福兹·阿拉姆，一位穆斯林战士，为了保卫耶路撒冷免受十字军骑士的侵略而英勇牺牲。他领导着一群被称为叛逆的死灵。他通过殉道确保了自己在天堂的地位，所谓的耶路撒冷死城对他来说是个可耻的笑话。他听说了太多关于浩瀚的[UmbraGlossary('sunless_sea')]的[UmbraGlossaryLocalized('far_shore','彼岸')]的虚假故事，他不相信仅凭体能努力就能到达天堂。\n因此，阿拉姆和他的盟友（虽然人数不多，但正在增长）希望驱逐占据耶路撒冷死城的成千上万的冥河城士兵，在来世建立一个穆斯林王国，挑战基督徒（被称为渔民）和明显不够格的冥河城的统治。\n面对这位穆斯林战士，你已经说服他，用他现有的力量挑战冥河城将会如同面对[UmbraGlossary('oblivion')]。与你合作，帮助他积蓄力量，更适合他的计划。"
 POD_umbra_gp.105.a: "我们将共同成长。"
 POD_umbra_gp.105.b: "没兴趣。"
 POD_umbra_crisis.110.t: "罪魁祸首"
 POD_umbra_crisis.110.desc: "你找到了仪式举行者的所在地，是时候在其能够召唤节点爬行者或更糟糕的憎恶之前阻止其了！"
 POD_umbra_crisis.110.a: "立刻停下来，妖蛆狼渣！"
 POD_umbra_pet.101.t: "龙"
 POD_umbra_pet.101.desc: "我抚摸着幼龙的脑袋，[ROOT.Char.Custom('DragonStorySheHe')]高兴地摇着[ROOT.Char.Custom('DragonStoryHerHis')]的尾巴。什么名字适合[ROOT.Char.Custom('DragonStoryHerHim')]呢？历史一点的？这是一个重要的决定，幼龙翻过身来让我摸[ROOT.Char.Custom('DragonStoryHerHis')]的肚子时我才发现自己走神了一段时间。\n\n不过等等，我知道了！我要叫[ROOT.Char.Custom('DragonStoryHerHim')]……"
 POD_umbra_pet.199.t: "[ROOT.Char.Custom('DragonStoryName')]：逝兽需逝"
 POD_umbra_pet.199.desc: "我的宠物[ROOT.Char.Custom('DragonStoryName')]陪伴我多年，但终究没能挡住板讷和共识的侵袭。当人类从过往的奇迹中走出，走向钟表一样的机械未来时，已经没有魔法的空间了。地球不再适合这些魔法生物生存，为了避免可怕的命运，唯一的办法就是放生到[umbra|E]。"
 POD_umbra_pet.199.a: "我会想你的，[ROOT.Char.Custom('DragonStoryName')]！"
 POD_umbra_pet.121.t: "摸摸[ROOT.Char.Custom('DragonStoryName')|U]"
 POD_umbra_pet.121.desc: "我发现[ROOT.Char.Custom('DragonStoryName')]正在我的房间里熟睡，我坐在边上，[ROOT.Char.Custom('DragonStoryHerHim')]轻轻地发出一声咂嘴声，声音里略带困扰。\n\n不过，当我的手指撸过[ROOT.Char.Custom('DragonStoryHerHis')]的鳞片之后，[ROOT.Char.Custom('DragonStorySheHe')]立马满意地咕噜咕噜了起来，听声音似乎十分享受我这么做。"
 POD_umbra_pet.122.desc: "我发现[ROOT.Char.Custom('DragonStoryName')]正在院子里踱来踱去。[ROOT.Char.Custom('DragonStorySheHe')]一看到我，[ROOT.Char.Custom('DragonStorySheHe')]立马吼吼叫唤跑过来，不住地蹭蹭我的腿。\n\n我花了好长一段时间，蹲在[ROOT.Char.Custom('DragonStoryHerHis')]身边给[ROOT.Char.Custom('DragonStoryHerHim')]撸鳞，挠[ROOT.Char.Custom('DragonStoryHerHim')]的下巴。当我重新站起身来时，我感觉心情好久没有这么轻快过了。"
 POD_umbra_pet.111.t: "[ROOT.Char.Custom('DragonStoryName')]：彰显力量"
 POD_umbra_pet.111.desc: "拥有一条龙已经令人难以置信，但是在你的宫廷中展示它们，并让所有臣民都在场，这真是一种强大的举动。[ROOT.Char.Custom('DragonStoryName')]发出一声咆哮，伸展身体，令你的廷臣们欢喜不已。当[ROOT.Char.Custom('DragonStorySheHe')]开始深吸一口气时，其他廷臣突然对这些传说中能够喷出神秘火焰的生物感到害怕。但幸好，由于[ROOT.Char.Custom('DragonStoryHerHis')]迄今为止的良好表现，没有发生任何意外事件。"
 POD_umbra_pet.111.a: "甚至连龙都听我的！"
 POD_umbra_pet.112.t: "[ROOT.Char.Custom('DragonStoryName')]：被迷住的封臣"
 POD_umbra_pet.112.desc: "我偶然发现我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))][vassal.GetTitledFirstName]正在欣赏我的龙[ROOT.Char.Custom('DragonStoryName')]。\n\n“我的[ROOT.Char.GetLadyLord]，这只神奇的幻兽比传说中的还要令人印象深刻！”看来我这只与众不同的宠物给我的臣民们留下了深刻的印象。"
 POD_umbra_pet.112.a: "我力量的象征！"
 POD_umbra_pet.113.t: "[ROOT.Char.Custom('DragonStoryName')]：龙息"
 POD_umbra_pet.113.desc: "“[ROOT.Char.GetFirstNameNoTooltip]，你必须把这只怪物送走！”\n\n我的仆人指向[ROOT.Char.Custom('DragonStoryName')]。“趁你不注意，[ROOT.Char.Custom('DragonStorySheHe')]一直在四处喷火，把[ROOT.Char.Custom('DragonStorySheHe')]留在身边很危险！”\n\n难道这些威严的神兽也有欺诈的天性？还是说，这只是它们的本能，而你却不在它们身边？"
 POD_umbra_pet.113.a: "肯……肯定是哪里搞错了！"
 POD_umbra_pet.113.b: "你这#EMP 畜生#!！"
 POD_umbra_pet.201.t: "独角兽"
 POD_umbra_pet.201.desc: "独角兽现在遵循我的每一个指令，真棒。我思索着应该如何称呼[ROOT.Char.Custom('PegasusStoryHerHim')]……"
 POD_umbra_pet.211.t: "[ROOT.Char.Custom('UnicornStoryName')|U]：值得信任的独角兽"
 POD_umbra_pet.211.desc: "听闻了我的那匹强健的独角兽[ROOT.Char.Custom('UnicornStoryName')]，一位著名的驯马师前来觐见，并表示[ROOT.Char.Custom('RandomHerHis')]想要向我效劳。\n\n“我所要求的只是一点小小的报偿。”"
 POD_umbra_pet.211.a: "[ROOT.Char.Custom('UnicornStorySheHe')|U]需要变得更强壮。"
 POD_umbra_pet.211.b: "[ROOT.Char.Custom('UnicornStorySheHe')]需要学的是如何跑得更快。"
 POD_umbra_pet.211.c: "[ROOT.Char.Custom('UnicornStorySheHe')|U]需要在[ROOT.Char.Custom('UnicornStoryHerHis')]的耐力上下点功夫。"
 POD_umbra_pet.211.d: "如果说[ROOT.Char.Custom('UnicornStorySheHe')]缺少一样东西的话，那一定是凶猛！"
 POD_umbra_pet.211.e: "我不感兴趣。"
 POD_umbra_pet.211.e.tt: "#F “[THIS.Char.Custom('UnicornStoryName')]除了我以外不需要任何驯马人！”#!"
 POD_umbra_pet.211.f: "这正是我付钱给$master_of_horse_court_position$的目的！"
 POD_umbra_pet.211.f.tt: "你的$master_of_horse_court_position$开始训练[THIS.Char.Custom('UnicornStoryName')]"
 POD_umbra_pet.211.f.failure: "你高估了你的$master_of_horse_court_position$"
 POD_umbra_pet.211.f.failure.tt: "[m_horse.GetTitledFirstNameNoTooltip]训练[ROOT.Char.Custom('UnicornStoryName')]失败。"
 POD_umbra_pet.212.t: "[ROOT.Char.Custom('UnicornStoryName')|U]：美好时光"
 POD_umbra_pet.212.desc: "当我走进马厩时，迎接我的是[ROOT.Char.Custom('UnicornStoryName')]欢快的嘶鸣。看来[ROOT.Char.Custom('UnicornStorySheHe')|U]渴望在美好的天气里活动一下[ROOT.Char.Custom('UnicornStoryHerHis')]的腿脚，我只能同意。"
 POD_umbra_pet.212.a: "我必须抓紧一切时间去训练！"
 POD_umbra_pet.212.b: "天气太好了，我要好好欣赏一番！"
 POD_umbra_pet.213.t: "[ROOT.Char.Custom('UnicornStoryName')|U]：爱马仕"
 POD_umbra_pet.213.desc: "[horse_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U]上下打量着[ROOT.Char.Custom('UnicornStoryName')]，并赞许地点点头。\n\n“这真是一匹好马，尊敬的[ROOT.Char.GetTitleTierName]！如果您能允许我骑[ROOT.Char.Custom('UnicornStoryHerHim')]溜一圈，那真是我的荣幸。”"
 POD_umbra_pet.213.a: "玩的开心！"
 POD_umbra_pet.213.a.tt: "[THIS.Char.Custom('UnicornStoryName')]是一匹烈马，而[horse_vassal.GetFirstNameNoTooltip]，[horse_vassal.GetHerHis]可没有以勇武闻名于世——[horse_vassal.GetSheHe]不会出事吧？"
 POD_umbra_pet.213.b: "只有我能骑[ROOT.Char.Custom('UnicornStoryName')]！"
 POD_umbra_pet.299.t: "[ROOT.Char.Custom('UnicornStoryName')]：逝兽需逝"
 POD_umbra_pet.299.desc: "我的宠物[ROOT.Char.Custom('UnicornStoryName')]陪伴我多年，但终究没能挡住板讷和共识的侵袭。当人类从过往的奇迹中走出，走向钟表一样的机械未来时，已经没有魔法的空间了。地球不再适合这些魔法生物生存，为了避免可怕的命运，唯一的办法就是放生到[umbra|E]。"
 POD_umbra_pet.299.a: "我会想你的，[ROOT.Char.Custom('UnicornStoryName')]！"
 POD_umbra_pet.301.t: "天马"
 POD_umbra_pet.301.desc: "天马现在遵循我的每一个指令，真棒。我思索着应该如何称呼[ROOT.Char.Custom('PegasusStoryHerHim')]……"
 POD_umbra_pet.311.t: "[ROOT.Char.Custom('PegasusStoryName')|U]：值得信任的天马"
 POD_umbra_pet.311.desc: "听闻了我的那匹强健的天马[ROOT.Char.Custom('PegasusStoryName')]，一位著名的驯马师前来觐见，并表示[ROOT.Char.Custom('RandomHerHis')]想要向我效劳。\n\n“我所要求的只是一点小小的报偿。”"
 POD_umbra_pet.311.a: "[ROOT.Char.Custom('PegasusStorySheHe')|U]需要变得更强壮。"
 POD_umbra_pet.311.b: "[ROOT.Char.Custom('PegasusStorySheHe')]需要学的是如何跑得更快。"
 POD_umbra_pet.311.c: "[ROOT.Char.Custom('PegasusStorySheHe')|U]需要在[ROOT.Char.Custom('PegasusStoryHerHis')]的耐力上下点功夫。"
 POD_umbra_pet.311.d: "如果说[ROOT.Char.Custom('PegasusStorySheHe')]缺少一样东西的话，那一定是凶猛！"
 POD_umbra_pet.311.e: "我不感兴趣。"
 POD_umbra_pet.311.e.tt: "#F “[THIS.Char.Custom('PegasusStoryName')]除了我以外不需要任何驯马人！”#!"
 POD_umbra_pet.311.f: "这正是我付钱给$master_of_horse_court_position$的目的！"
 POD_umbra_pet.311.f.tt: "你的$master_of_horse_court_position$开始训练[THIS.Char.Custom('PegasusStoryName')]"
 POD_umbra_pet.311.f.failure: "你高估了你的$master_of_horse_court_position$"
 POD_umbra_pet.311.f.failure.tt: "[m_horse.GetTitledFirstNameNoTooltip]训练[ROOT.Char.Custom('PegasusStoryName')]失败。"
 POD_umbra_pet.312.t: "[ROOT.Char.Custom('PegasusStoryName')|U]：美好时光"
 POD_umbra_pet.312.desc: "当我走进马厩时，迎接我的是[ROOT.Char.Custom('PegasusStoryName')]欢快的嘶鸣。看来[ROOT.Char.Custom('PegasusStorySheHe')|U]渴望在美好的天气里活动一下[ROOT.Char.Custom('PegasusStoryHerHis')]的腿脚，我只能同意。"
 POD_umbra_pet.312.a: "我必须抓紧一切时间去训练！"
 POD_umbra_pet.312.b: "天气太好了，我要好好欣赏一番！"
 POD_umbra_pet.313.t: "[ROOT.Char.Custom('PegasusStoryName')|U]：爱马仕"
 POD_umbra_pet.313.desc: "[horse_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U]上下打量着[ROOT.Char.Custom('PegasusStoryName')]，并赞许地点点头。\n\n“这真是一匹好马，尊敬的[ROOT.Char.GetTitleTierName]！如果您能允许我骑[ROOT.Char.Custom('PegasusStoryHerHim')]溜一圈，那真是我的荣幸。”"
