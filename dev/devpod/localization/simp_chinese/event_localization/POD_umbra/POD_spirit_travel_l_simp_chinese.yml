l_simp_chinese:
 spirit_travel_header:0 "灵游："
 POD_umbra_pass.101.t:0 "开启虚洞"
 POD_umbra_pass.101.desc:0 "在[shadowlands|E]和[tempest|E]之间存在着一层影膜，你得先在上开启一个虚洞来进入[tempest|E]。"
 POD_umbra_pass.101.a:0 "我将做出献祭来开启它。"
 POD_umbra_pass.101.b:0 "算了。"
 POD_umbra_pass.103.t:0 "不再游荡"
 POD_umbra_pass.103.desc:0 "你完全不受活人世界的束缚，只要你想，就可以直接前往[underworld|E]不复返。你仍然在这里的唯一原因是你想在这里，而不是说你必须像大多数鬼魂一样受束。你确定你现在就要离世吗？"
 POD_umbra_pass.103.a:0 "是时候跨越[tempest|E]了。"
 POD_umbra_pass.103.b:0 "我还有事要做。"
 POD_umbra_pass.104.t:0 "穿过尸幕"
 POD_umbra_pass.104.desc:0 "你确定要以将自己射过尸幕吗？这将伤害你的[Corpus|E]（伤害相当于当地的尸幕等级）。"
 POD_umbra_pass.104.a:0 "是的！"
 POD_umbra_pass.104.b:0 "不。"
 POD_umbra_lost.101.t:0 "迷失于大风暴"
 POD_umbra_lost.101.desc:0 "你无法在大风暴中确定自己的方向，现在你又回到了你起始的地方。"
 POD_umbra_lost.101.a:0 "行吧。"
 POD_umbra_lost.102.t:0 "陷于迷宫域"
 POD_umbra_lost.102.desc:0 "你无法在无意义的迷宫域中确定自己的方向，现在你又回到了你起始的地方。"
 POD_umbra_lost.102.a:0 "我迷失了。"
 POD_umbra_lost.102.b:0 "巨蛇救我！"
 POD_umbra_diplomacy.desc:0 "你被住在这个区域的人拦住了，也许你可以说服他们告诉你如何通过？影界的居民是出了名的难以理解，甚至更难以说服。"
 POD_umbra_martial.desc:0 "你被一个棋局所阻止，是时候展示你有多善于此道了。不过，以缚灵形式玩“动态”战役，一开始是很难掌握的，这使得这是一种令人不安的超现实体验。"
 POD_umbra_stewardship.desc:0 "你被一个数学谜题拦住了，你善于此么？你必须先破译诡计多端的灵类所使用的数字，这使问题更难解决。"
 POD_umbra_intrigue.desc:0 "你在路上遇到了一个强大的灵卫，也许你可以用一些小把戏来分散其的注意力？不过最好让人信服，他看起来真的不友好。"
 POD_umbra_learning.desc:0 "你被一个字谜拦住了，你能解决这个问题吗？影界是“真实”世界的扭曲版本，你可以找到一些规律和线索，至少对你有一点意义。"
 POD_gauntlet.101.t:0 "险棘"
 POD_gauntlet.101.desc:0 "险棘，也在中原被称为绝壁，是围绕着物质现实的屏障，将其与影界分开。\n\n你可以通过能力将险棘强化或弱化，如果被提升到10，当地的灵类得耗费意志力不然必须逃离本地。"
 POD_gauntlet.101.a:0 "增强险棘"
 POD_gauntlet.101.b:0 "削弱险棘"
 POD_gauntlet.101.c:0 "击溃险棘！"
 POD_gauntlet.101.d:0 "算了。"
 POD_gauntlet.102.t:0 "绝壁"
 POD_gauntlet.102.desc:0 "中原的灵界受一道神秘的壁障阻碍，这道壁障被称作绝壁，它阻隔了灵界和凡界之间的直接接触。绝壁在部分地区极其强大，于某些地方又极其薄弱，但绝壁无处不在永不缺席。\n\n你可以通过能力将绝壁强化或弱化，如果被提升到10，当地无法使用任何气功功法，同时当地的灵类得耗费意志力不然必须逃离本地，此类环境下使用气池能量会极大不适而且困难。"
 POD_gauntlet.102.a:0 "强化绝壁"
 POD_gauntlet.102.b:0 "弱化绝壁"
 POD_gauntlet.102.d:0 "算了。"
 POD_umbra_lost.100.t:0 "#X 落入湮灭#!"
 POD_umbra_lost.100.desc:0 "#X 你落入到湮灭中……#!"
 POD_umbra_lost.100.a:0 "#X ……#!"
 POD_umbra_lost.104.t:0 "困在深渊"
 POD_umbra_lost.104.a:0 "我会再逃出去的！"
 POD_umbra_lost.104.b:0 "我会献祭一名囚犯。"
 trapped_in_abyss_modifier:0 "困在深渊"
 POD_umbra_lost.104.desc_demon:0 "你再次落入上帝在路西法反叛之后为你的同族创造的永恒监狱。上帝，似乎仍然笑到最后。"
 POD_umbra_lost.104.desc_infernalist:0 "你困在了地狱，似乎除非向恶魔领主献祭之外没有办法出来……"
 POD_umbra_lost.104.c:0 "我不和恶魔做交易！"
 POD_umbra_diplomacy.success:0 "外交挑战：成功"
 POD_umbra_diplomacy.fail:0 "外交挑战：失败"
 POD_umbra_martial.success:0 "军事挑战：成功"
 POD_umbra_martial.fail:0 "军事挑战：失败"
 POD_umbra_stewardship.success:0 "管理挑战：成功"
 POD_umbra_stewardship.fail:0 "管理挑战：失败"
 POD_umbra_intrigue.success:0 "谋略挑战：成功"
 POD_umbra_intrigue.fail:0 "谋略挑战：失败"
 POD_umbra_learning.success:0 "学识挑战：成功"
 POD_umbra_learning.fail:0 "学识挑战：失败"
 POD_gauntlet.102.c:0 "击溃绝壁！"
 POD_umbra_kj.1001.t:0 "灵感"
 POD_umbra_kj.1001.desc:0 "邻近绝壁的灵界区域被称为镜像之地，因为其看起来就像附近中原地区的倒影而得名。\n\n看到这奇异的景色让你感到悟得了什么。"
 POD_umbra_kj.1001.a:0 "厉害！"
 POD_umbra_kj.1002.t:0 "灵师教导"
 POD_umbra_kj.1002.desc_opening:0 "你进入了灵界，尽可能的深，然后你遇到了一位"
 POD_umbra_kj.1002.desc_high:0 "上古者，历史记录上的万鬼，太上老祖"
 POD_umbra_kj.1002.desc_yin:0 "阎魔"
 POD_umbra_kj.1002.desc_yang:0 "强大灵类"
 POD_umbra_kj.1002.desc_low:0 "普通灵类"
 POD_umbra_kj.1002.desc_ending:0 "其向你分享了一些心法理解。"
 POD_umbra_kj.1002.a:0 "我的灵师。"
 POD_umbra_action.1001.t:0 "战界"
 POD_umbra_action.1001.desc:0 "战界是一个致力于暴力和愤怒的领域，混乱统治一切，军队混合在一起，秦朝士兵与罗马军团作战，十字军与维京野蛮人结盟对抗玛雅军队。只要不进入其中一个冲突，旅者可走在与他们所见证的战斗相适应的“过道”上（海战时是船、布匿战争是罗马道路、等等）。只要他们不踏出过道，他们就不会被直接攻击。\n这是学习新的（或旧的）战略的好方法，可以在某种程度上与你的时代相连。"
 POD_shroud.101.t:0 "尸幕"
 POD_shroud.101.desc:0 "[underworld|E]与[skinlands|E]被一个被称为”尸幕“的神秘屏障分开。尸幕使大多数生物无法感知[shadowlands|E]，并使死人无法看到[skinlands|E]的活动。它在部分地区极其强大，于某些地方又极其薄弱，但它无处不在永不缺席。\n\n你可以通过能力将尸幕强化或弱化，如果被提升到10，当地的灵类得耗费意志力不然必须逃离本地。"
 POD_shroud.101.a:0 "增强尸幕"
 POD_shroud.101.b:0 "削弱尸幕"
 POD_shroud.101.c:0 "击溃尸幕！"
 POD_shroud.101.d:0 "算了"
 POD_umbra_local.101.t:0 "讨好灵类"
 POD_umbra_local.101.desc:0 "你将尝试提升本地灵类对你的好感，让其等听从你。\n你可以尝试外交途径，也可以采取强硬手段。灵类往往是古怪的生物，与他们争论可能会花费很长时间。"
 POD_umbra_local.101.a:0 "朋友们，听我说。"
 POD_umbra_local.101.b:0 "同为灵类……"
 POD_umbra_local.101.c:0 "听从灵上灵！"
 POD_umbra_local.101.d:0 "也许之后再说吧。"
 POD_umbra_local.102.t:0 "讨好死灵"
 POD_umbra_local.102.desc:0 "你将尝试提升本地死灵对你的好感，让其等听从你。\n你可以尝试外交途径，也可以采取强硬手段。死灵往往是一种唯我的生物，与他们争论可能会花费很长时间。"
 POD_umbra_local.102.a:0 "朋友们，听我说。"
 POD_umbra_local.102.b:0 "同为死灵……"
 POD_umbra_local.102.c:0 "我命令你！"
 POD_umbra_local.102.d:0 "也许之后再说吧。"
 POD_umbra_local.201.t:0 "殖民"
 POD_umbra_local.201.desc:0 "你将努力夺取这片没有统治者的[spirit_wilds|E]，您只需要与一些不友好的土著打交道。外交或武力都可以说服他们承认你是这片灵域的新主人。"
 POD_umbra_local.201.a:0 "滚出我的地盘。"
 POD_umbra_local.201.b:0 "让我们来做个交易。"
 POD_umbra_local.201.c:0 "也许之后再说吧。"
 POD_umbra_local.202.t:0 "殖民"
 POD_umbra_local.202.desc:0 "你将努力夺取这片没有统治者的[shadowlands|E]，您只需要与一些不友好的土著打交道。外交或武力都可以说服他们承认你是这片灵域的新主人。"
 POD_umbra_local.202.a:0 "滚出我的地盘。"
 POD_umbra_local.202.b:0 "让我们来做个交易。"
 POD_umbra_local.202.c:0 "也许之后再说吧。"
 POD_umbra_local.301.t:0 "征服"
 POD_umbra_local.301.desc:0 "您将尝试向[victim.GetFirstName]索要这部分[spirit_wilds|E]。外交或武力都可以说服他们承认你是这片灵域的新主人。"
 POD_umbra_local.301.a:0 "这地方不错，我要了。"
 POD_umbra_local.301.b:0 "让我们来做个交易。"
 POD_umbra_local.301.c:0 "我命令你把它交给我！"
 POD_umbra_local.301.d:0 "也许之后再说吧。"
 POD_umbra_local.302.t:0 "征服"
 POD_umbra_local.302.desc:0 "您将尝试向[victim.GetFirstName]索要这部分[shadowlands|E]。"
 POD_umbra_local.302.a:0 "这地方不错，我要了。"
 POD_umbra_local.302.b:0 "让我们来做个交易。"
 POD_umbra_local.302.c:0 "我命令你把它交给我！"
 POD_umbra_local.302.d:0 "也许之后再说吧。"
 POD_umbra_pass.202.t:0 "跨过暗隐寺庙"
 POD_umbra_pass.202.desc:0 "暗隐寺庙是[malfeas|E]的一个地点，位于[black_spiral_labyrinth|E]的入口。它是清真寺和大教堂的混合体，是东方宣礼塔和西方柱身凹槽的混合体。"
 POD_umbra_pass.202.a:0 "我将要求通过。"
 POD_umbra_pass.202.a.tt:0 "这个选项可用是因为你是妖蛆的仆从。"
 POD_umbra_pass.202.b:0 "我想溜进去"
 POD_umbra_pass.202.b.duel.tt.success:0 "还好过了。"
 POD_umbra_pass.202.b.duel.tt.failure:0 "！"
 POD_umbra_pass.202.c:0 "我最好还是别进去。"
 POD_umbra_pass.205.t:0 "停下！"
 POD_umbra_pass.205.desc:0 "你被守卫拦住了，他们觉得你不是冥河城的一份子，你将如何处理？"
 POD_umbra_pass.205.a:0 "我是来加入军团的。"
 POD_umbra_pass.205.b:0 "我是来加入行会的。"
 POD_umbra_pass.205.c:0 "我已经是你们的一员了！"
 POD_umbra_pass.205.d:0 "我只是在周边走走。"
 POD_umbra_pass.206.t:0 "停下！"
 POD_umbra_pass.206.desc:0 "你被守卫拦住了，他们觉得你不是彼岸的一份子，你将如何处理？"
 POD_umbra_pass.206.a:0 "我是来赞扬闪耀者的。"
 POD_umbra_pass.206.b:0 "我已经是你们的一员了！"
 POD_umbra_pass.206.c:0 "我只是在周边走走。"
 POD_umbra_pass.207.t:0 "停下！"
 POD_umbra_pass.207.desc:0 "帝乌斯被由失事船只组成的迷宫所保护，里面住着一些被努德里的怀拥所奴役的怨灵，以防止好奇的死灵和敌对的怨灵靠近。穿过迷宫的路径不断变化，没有船夫协会的同意，几乎不可能进入帝乌斯。你将如何处理？"
 POD_umbra_pass.207.a:0 "我想向你们效忠。"
 POD_umbra_pass.207.b:0 "我只是在周边走走。"
 POD_umbra_pass.207.a.duel.desc:0 "断绝仪式"
 POD_umbra_pass.208.t:0 "步入太阳"
 POD_umbra_pass.208.desc:0 "赫利俄斯所在的深影界，除了热量和耀眼的白光，什么都没有。在赫利俄斯的界域内，任何表面都因温度过高而无法长时间站立或停留。只有会飞的灵体才能进入该深影界区域，没有飞行能力的旅行者还没来得及意识到自己的错误，就会被烈火焚烧殆尽。\n\n你确定要触摸太阳本身吗？"
 POD_umbra_pass.208.a:0 "是，我要触摸太阳本身。多好的主意！"
 POD_umbra_pass.208.b:0 "赫利俄斯将保护我的灵魂。"
 POD_umbra_pass.208.c:0 "跑！"
 POD_umbra_prowess.success:0 "勇武挑战：成功"
 POD_umbra_prowess.fail:0 "勇武挑战：失败"
 POD_umbra_prowess.desc:0 "你被一位灵类拦住了，也许你可以与其战斗并获取战利品。"
 umbra_adv_challange_spirit:0 "你将与一位灵类进行[single_combat_duel|E]。"
 umbra_adv_challange_spirit.win:0 "你将获得祝福[modifier|E]或[prestige|E]。"
 POD_umbra_adv.101.t:0 "一比灵"
 POD_umbra_adv.101.desc:0 "选择一项祝福。"
 POD_umbra_adv.101.fallback:0 "我拒绝它们。"
 POD_umbra_adv.201.t:0 "宝物"
 POD_umbra_adv.201.desc:0 "您发现了一个宝藏，里面有几件宝物，你想要带走哪一件？"
 POD_umbra_adv.201.fallback:0 "我将赠送它们。"
