 POD_umbra_gp.107.t: "缪斯庭"
 POD_umbra_gp.107.desc: "随着对古希腊神话重新燃起的兴趣，一个古老的宫廷从集体无意识中重新崛起，拥有了新的成员，并在现代崇高思想领域焕发出新的活力和目标。这便是缪斯，印度称之为飞天女神，在北欧神话中则被称为女武神，但古希腊人最清楚其各自的名字和职责。\n缪斯在众峰之一上拥有自己的宫殿，基座位于庸底中的博学院附近；该峰酷似希腊的赫利孔山，古代传说中缪斯的居所。\n缪斯最初有九种，加上长者缪斯与其领袖；如今这个数字翻了一番，但最初的九位依然存在，只是她们的专长和影响范围略有变化。随着人类表达方式的丰富，缪斯的种类也随之多样化。这些宙斯与记忆女神谟涅摩叙涅的女儿们已经在外表和职权上有所现代化。\n你在这个宫廷里的时间不会是无限的，因为长者缪斯们只容许访客来逗年轻缪斯开心。你希望与哪一组年轻的缪斯打成一片？"
 POD_umbra_gp.107.a: "媒体之缪斯，文化承载者。"
 POD_umbra_gp.107.b: "模式之缪斯，分析与哲思者。"
 POD_umbra_gp.108.t: "媒体之缪斯"
 POD_umbra_gp.108.desc: "卡利俄珀，声音之缪斯。原为文诗之缪斯，其职责范围已扩展至所有使用声音的领域——歌唱、播报、讲课、讲故事，以及任何仅通过声音表现的形式。\n克利俄，文字之缪斯。原为历史之缪斯，现在其激励着各种形式的写作，不论风格、题材或意图如何。\n欧忒耳佩，乐律之缪斯。原为抒情诗之缪斯，其职责范围已转变为所有除人声以外的音乐创作，人声音乐属于卡利俄珀的领域。\n忒耳普西科瑞，舞蹈之缪斯。忒耳普西科瑞始终是舞蹈的缪斯，但其领域已扩展至所有以身体运动为核心的艺术形式。\n阿基俄珀，建筑之缪斯。作为新缪斯，阿基俄珀的领域涵盖空间围合和划分（通常是永久性的建筑物，但帐篷和简易棚屋也在她的管辖范围内）。\n塔玛拉彭米，服饰之缪斯。另一位新缪斯，其领域包括所有外在的个人形象和展示。\n尤多瑞，戏剧之缪斯。尤多瑞的领域是角色的实体化，不论是自我、他人还是完全虚构的人物。\n菲狄亚斯，雕塑之缪斯。菲狄亚斯曾是凡人，其雕刻石头的技艺如此卓越，以至于被众神邀请成为雕塑之缪斯。\n克塞洛普斯，绘画之缪斯。克塞洛普斯是二维图像的新缪斯，包括具象和抽象图像，其掌管着古典意义上的绘画和素描。"
 POD_umbra_gp.108.a: "与卡利俄珀共度时光"
 POD_umbra_gp.108.b: "与克利俄共度时光"
 POD_umbra_gp.108.c: "与欧忒耳佩共度时光"
 POD_umbra_gp.108.d: "与忒耳普西科瑞共度时光"
 POD_umbra_gp.108.e: "与阿基俄珀共度时光"
 POD_umbra_gp.108.f: "与塔玛拉彭米共度时光"
 POD_umbra_gp.108.g: "与尤多瑞共度时光"
 POD_umbra_gp.108.h: "与菲狄亚斯共度时光"
 POD_umbra_gp.108.i: "与克塞洛普斯共度时光"
 POD_umbra_gp.109.t: "模式之缪斯"
 POD_umbra_gp.109.desc: "厄剌托，浪漫之缪斯。原为爱情诗之缪斯，厄剌托关注生命中那种压倒一切的激情，尤其是那些让人们互相吸引的情感，如爱与欲望。她喜欢幸福的结局，但可能会让她的信徒们经历无尽的磨难才能到达终点。\n墨尔波墨涅，悲剧之缪斯。墨尔波墨涅依然是悲剧之缪斯，因为凡人之间的痛苦几千年来几乎没有改变。她并不以这种痛苦为乐，而是试图引导人们理解这种痛苦的根源，并探讨如何在未来避免它。\n波吕许谟妮娅，宗教之缪斯。波吕姆尼亚原为颂歌之缪斯，现引导那些在精神道路上寻求灵魂奥秘的人们。\n塔利亚，喜剧之缪斯。塔利亚曾是且仍是喜剧之缪斯，其总能敏锐地察觉生活中固有的荒诞，并指出任何情况下的幽默之处。\n乌剌尼亚，科学之缪斯。乌拉尼亚原为天文之缪斯，如今其领域扩展至所有科学，随时为那些探索和理解世界的人提供帮助。\n阿尔基罗库斯，行动之缪斯。其被誉为地球上最早的讽刺诗人之一，阿尔基罗库斯的风趣因其不屈不挠的好斗性而著称，他经常需要用实战来捍卫他的诗句。他因此成为了行动之缪斯。\n梭伦，正义之缪斯。雅典的梭伦被认为是人类道德良知的代表，其强调法律执行中的平等与公正，因此现在是正义之缪斯。\n普修多卢斯，阴谋之缪斯。其实际上是普劳图斯作品中的虚构人物，普修多卢斯因世界上所有的阴谋诡计和肮脏交易而在阴影中获得了生命，成为了阴谋之缪斯。\n蕾诺尔，恐怖之缪斯。恐怖之缪斯被认为自人类意识萌芽之初就伴随人类，尽管很少有人敢提及她的名字。"
