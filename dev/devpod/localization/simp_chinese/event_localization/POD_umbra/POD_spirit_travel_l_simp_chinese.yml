 POD_umbra_pet.399.desc: "我的宠物[ROOT.Char.Custom('PegasusStoryName')]陪伴我多年，但终究没能挡住板讷和共识的侵袭。当人类从过往的奇迹中走出，走向钟表一样的机械未来时，已经没有魔法的空间了。地球不再适合这些魔法生物生存，为了避免可怕的命运，唯一的办法就是放生到[umbra|E]。"
