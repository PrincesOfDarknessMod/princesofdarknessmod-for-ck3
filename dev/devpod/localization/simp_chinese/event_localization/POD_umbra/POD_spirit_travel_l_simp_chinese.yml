 Theotime: "西奥蒂姆"
 skilled_umbra_explorer_modifier: "训练有素的[umbra|E]探险家"
 POD_umbra_gp.114.t: "灵界探险家"
 POD_umbra_gp.114.desc: "除了长椅、喷泉和大门之外，荣耀大厅里空无一人。偶尔也会有旅行者在此相遇；不过，这里的人流量很低，你可以在大厅里漫步数日，却不会与其他人擦肩而过。走廊四通八达，偶尔会分支到楼梯间、水井和凹室。疯狂的无尽走廊布局，让任何试图“作弊”和使用某种形式的魔法来找到正确路径的人都无所适从。\n因此，也就不足为奇为何荣耀大厅吸引了最好奇的灵界实体，也就是那些致力于冒险和探索精神的人。想要联系你的人告诉你，其已经厌倦了在荣耀大厅中旅行，希望成为你的正式灵界探险家。其的技艺似乎相当娴熟，可以成为进一步绘制[umbra|E]地图的有利条件，因此这个前景非常诱人。"
 POD_umbra_gp.114.a: "你被雇佣了。"
 POD_umbra_gp.114.b: "你没过。"
 POD_umbra_gp.115.t: "完美化信仰"
 POD_umbra_gp.115.desc: "所有天堂都存在于这一界域，源自非洲传说、伊斯兰教义、基督教信条和美洲原住民的希望的天堂。胜利的北欧战士在瓦尔哈拉大快朵颐，古希腊灵魂在极乐世界竞技。据说，每种信仰都有其在天堂的最佳写照，而每种信仰都满足于独善其身。只有有资格的死者、未出生者或真正的信徒才能进入天堂，如果有人胆敢威胁天堂，他们会发现最强大的天使和英雄都在与他们作对。\n你的向导是一位名叫卡连娜的（看似）年轻女子，在她的带领下，你穿过了暮光之城。各种信仰的建筑，从清真寺、庙宇、大教堂到简易旅店，在你走过的宏伟大道上鳞次栉比，而城市生活的尘世痕迹——肮脏、商业、罪恶和腐朽却无处可寻。这座城市的存在似乎只有两个目的：给人留下深刻印象，让人心潮澎湃。\n然后，她引导你穿过大山、无尽之海、动物神殿……你惊叹于这一切的美丽。\n这个世界可能只是人类无法领略的辉煌的一个影子，一个根据凡人想象中的天堂而塑造的影子，但当你离开的时候，你会发现自己比以前更有活力，更坚信自己的信仰。"
 POD_umbra_gp.115.a: "完美。"
 POD_umbra_gp.116.t: "执政的堡垒"
 POD_umbra_gp.116.desc: "在一片荒芜的岩石和矮小的树木上，矗立着人愚之堡垒。这座由木头和石头砌成的不朽城堡，是智慧、武力和贪婪的据点，周围堆满了大便。在臭气熏天的粪堆上，方圆数百码矗立着一丛完美的白玫瑰。这些花值得我们为之付出努力吗？要塞需要吗？如果可以，谁会采摘这些玫瑰？千百年来，人们一直在争论这些问题。而且，你猜想，他们还将一直争论下去。"
 POD_umbra_gp.116.a: "堡垒和玫瑰是连在一起的。"
 POD_umbra_gp.116.b: "要塞保护着玫瑰，不让我们靠近。"
 POD_umbra_gp.116.c: "堡垒保护我们不受玫瑰的伤害。"
 POD_umbra_gp.116.d: "我一定要得到玫瑰！"
 POD_umbra_gp.116.e: "这里是映照我们的愚昧的一面镜子，仅此而已。"
 POD_umbra_action.1101.t: "灵座"
 POD_umbra_action.1101.desc: "灵座是亡主的宫殿，也是军团的总部，你要造访哪一座？"
 POD_umbra_action.1101.a: "滚水灵座"
 POD_umbra_action.1101.b: "尘土灵座"
 POD_umbra_action.1101.c: "金泪灵座"
 POD_umbra_action.1101.d: "阴影灵座"
 POD_umbra_action.1101.e: "寂静灵座"
 POD_umbra_action.1101.f: "救赎灵座"
 POD_umbra_action.1101.g: "荆棘灵座"
