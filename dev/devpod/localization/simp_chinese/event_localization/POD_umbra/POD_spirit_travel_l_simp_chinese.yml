l_simp_chinese:
 spirit_travel_header:0 "灵游："
 POD_umbra_pass.101.t:0 "开启虚洞"
 POD_umbra_pass.101.desc:0 "在[shadowlands|E]和[tempest|E]之间存在着一层影膜，你得先在上开启一个虚洞来进入[tempest|E]。"
 POD_umbra_pass.101.a:0 "我将做出献祭来开启它。"
 POD_umbra_pass.101.b:0 "我将使用我的即用虚洞。"
 POD_umbra_pass.103.t:0 "不再游荡"
 POD_umbra_pass.103.desc:0 "你完全不受活人世界的束缚，只要你想，就可以直接前往[underworld|E]不复返。你仍然在这里的唯一原因是你想在这里，而不是说你必须像大多数鬼魂一样受束。你确定你现在就要离世吗？"
 POD_umbra_pass.103.a:0 "是时候跨越[tempest|E]了。"
 POD_umbra_pass.103.b:0 "我还有事要做。"
 POD_umbra_pass.104.t:0 "穿过尸幕"
 POD_umbra_pass.104.desc:0 "你确定要以将自己射过尸幕吗？这将伤害你的[Corpus|E]（伤害相当于当地的尸幕等级）。"
 POD_umbra_pass.104.a:0 "是的！"
 POD_umbra_pass.104.b:0 "不。"
 POD_umbra_diplomacy.desc:0 "你被住在这个区域的人拦住了，也许你可以说服他们告诉你如何通过？影界的居民是出了名的难以理解，甚至更难以说服。"
 POD_umbra_martial.desc:0 "你被一个棋局所阻止，是时候展示你有多善于此道了。不过，以缚灵形式玩“动态”战役，一开始是很难掌握的，这使得这是一种令人不安的超现实体验。"
 POD_umbra_stewardship.desc:0 "你被一个数学谜题拦住了，你善于此么？你必须先破译诡计多端的灵类所使用的数字，这使问题更难解决。"
 POD_umbra_intrigue.desc:0 "你在路上遇到了一个强大的灵卫，也许你可以用一些小把戏来分散其的注意力？不过最好让人信服，他看起来真的不友好。"
 POD_umbra_learning.desc:0 "你被一个字谜拦住了，你能解决这个问题吗？影界是“真实”世界的扭曲版本，你可以找到一些规律和线索，至少对你有一点意义。"
 POD_gauntlet.101.t:0 "险棘"
 POD_gauntlet.101.desc:0 "险棘，也在中原被称为绝壁，是围绕着物质现实的屏障，将其与影界分开。\n\n你可以通过能力将险棘强化或弱化，如果被提升到10，当地的灵类得耗费意志力不然必须逃离本地。"
 POD_gauntlet.101.a:0 "增强险棘"
 POD_gauntlet.101.b:0 "削弱险棘"
 POD_gauntlet.101.c:0 "击溃险棘！"
 POD_gauntlet.101.d:0 "算了。"
 POD_gauntlet.102.t:0 "绝壁"
 POD_gauntlet.102.desc:0 "中原的灵界受一道神秘的壁障阻碍，这道壁障被称作绝壁，它阻隔了灵界和凡界之间的直接接触。绝壁在部分地区极其强大，于某些地方又极其薄弱，但绝壁无处不在永不缺席。\n\n你可以通过能力将绝壁强化或弱化，如果被提升到10，当地无法使用任何气功功法，同时当地的灵类得耗费意志力不然必须逃离本地，此类环境下使用气池能量会极大不适而且困难。"
 POD_gauntlet.102.a:0 "强化绝壁"
 POD_gauntlet.102.b:0 "弱化绝壁"
 POD_gauntlet.102.d:0 "算了。"
 POD_umbra_lost.100.t:0 "#X 落入湮灭#!"
 POD_umbra_lost.100.desc:0 "#X 你落入到湮灭中……#!"
 POD_umbra_lost.100.a:0 "#X ……#!"
 POD_umbra_lost.104.t:0 "困在深渊"
 POD_umbra_lost.104.a:0 "我会再逃出去的！"
 POD_umbra_lost.104.b:0 "我会献祭一名囚犯。"
 trapped_in_abyss_modifier:0 "困在深渊"
 POD_umbra_lost.104.desc_demon:0 "你再次落入上帝在路西法反叛之后为你的同族创造的永恒监狱。上帝，似乎仍然笑到最后。"
 POD_umbra_lost.104.desc_infernalist:0 "你困在了地狱，似乎除非向恶魔领主献祭之外没有办法出来……"
 POD_umbra_lost.104.c:0 "我不和恶魔做交易！"
 POD_umbra_diplomacy.success:0 "外交挑战：成功"
 POD_umbra_diplomacy.fail:0 "外交挑战：失败"
 POD_umbra_martial.success:0 "军事挑战：成功"
 POD_umbra_martial.fail:0 "军事挑战：失败"
 POD_umbra_stewardship.success:0 "管理挑战：成功"
 POD_umbra_stewardship.fail:0 "管理挑战：失败"
 POD_umbra_intrigue.success:0 "谋略挑战：成功"
 POD_umbra_intrigue.fail:0 "谋略挑战：失败"
 POD_umbra_learning.success:0 "学识挑战：成功"
 POD_umbra_learning.fail:0 "学识挑战：失败"
 POD_gauntlet.102.c:0 "击溃绝壁！"
 POD_umbra_kj.1001.t:0 "灵感"
 POD_umbra_kj.1001.desc:0 "邻近绝壁的灵界区域被称为镜像之地，因为其看起来就像附近中原地区的倒影而得名。\n\n看到这奇异的景色让你感到悟得了什么。"
 POD_umbra_kj.1001.a:0 "厉害！"
 POD_umbra_kj.1002.t:0 "灵师教导"
 POD_umbra_kj.1002.desc_opening:0 "你进入了灵界，尽可能的深，然后你遇到了一位"
 POD_umbra_kj.1002.desc_high:0 "上古者，历史记录上的万鬼，太上老祖"
 POD_umbra_kj.1002.desc_yin:0 "阎魔"
 POD_umbra_kj.1002.desc_yang:0 "强大灵类"
 POD_umbra_kj.1002.desc_low:0 "普通灵类"
 POD_umbra_kj.1002.desc_ending:0 "其向你分享了一些心法理解。"
 POD_umbra_kj.1002.a:0 "我的灵师。"
 POD_umbra_action.1001.t:0 "战界"
 POD_umbra_action.1001.desc:0 "战界是一个致力于暴力和愤怒的领域，混乱统治一切，军队混合在一起，秦朝士兵与罗马军团作战，十字军与维京野蛮人结盟对抗玛雅军队。只要不进入其中一个冲突，旅者可走在与他们所见证的战斗相适应的“过道”上（海战时是船、布匿战争是罗马道路、等等）。只要他们不踏出过道，他们就不会被直接攻击。\n这是学习新的（或旧的）战略的好方法，可以在某种程度上与你的时代相连。"
 POD_shroud.101.t:0 "尸幕"
 POD_shroud.101.desc:0 "[underworld|E]与[skinlands|E]被一个被称为”尸幕“的神秘屏障分开。尸幕使大多数生物无法感知[shadowlands|E]，并使死人无法看到[skinlands|E]的活动。它在部分地区极其强大，于某些地方又极其薄弱，但它无处不在永不缺席。\n\n你可以通过能力将尸幕强化或弱化，如果被提升到10，当地的灵类得耗费意志力不然必须逃离本地。"
 POD_shroud.101.a:0 "增强尸幕"
 POD_shroud.101.b:0 "削弱尸幕"
 POD_shroud.101.c:0 "击溃尸幕！"
 POD_shroud.101.d:0 "算了"
 POD_umbra_local.101.t:0 "讨好灵类"
 POD_umbra_local.101.desc:0 "你将尝试提升本地灵类对你的好感，让其等听从你。\n你可以尝试外交途径，也可以采取强硬手段。灵类往往是古怪的生物，与他们争论可能会花费很长时间。"
 POD_umbra_local.101.a:0 "朋友们，听我说。"
 POD_umbra_local.101.b:0 "同为灵类……"
 POD_umbra_local.101.c:0 "听从灵上灵！"
 POD_umbra_local.101.d:0 "也许之后再说吧。"
 POD_umbra_local.102.t:0 "讨好死灵"
 POD_umbra_local.102.desc:0 "你将尝试提升本地死灵对你的好感，让其等听从你。\n你可以尝试外交途径，也可以采取强硬手段。死灵往往是一种唯我的生物，与他们争论可能会花费很长时间。"
 POD_umbra_local.102.a:0 "朋友们，听我说。"
 POD_umbra_local.102.b:0 "同为死灵……"
 POD_umbra_local.102.c:0 "我命令你！"
 POD_umbra_local.102.d:0 "也许之后再说吧。"
 POD_umbra_local.201.t:0 "殖民"
 POD_umbra_local.201.desc:0 "你将努力夺取这片没有统治者的[spirit_wilds|E]，您只需要与一些不友好的土著打交道。外交或武力都可以说服他们承认你是这片灵域的新主人。"
 POD_umbra_local.201.a:0 "滚出我的地盘。"
 POD_umbra_local.201.b:0 "让我们来做个交易。"
 POD_umbra_local.201.c:0 "也许之后再说吧。"
 POD_umbra_local.202.t:0 "殖民"
 POD_umbra_local.202.desc:0 "你将努力夺取这片没有统治者的[shadowlands|E]，您只需要与一些不友好的土著打交道。外交或武力都可以说服他们承认你是这片灵域的新主人。"
 POD_umbra_local.202.a:0 "滚出我的地盘。"
 POD_umbra_local.202.b:0 "让我们来做个交易。"
 POD_umbra_local.202.c:0 "也许之后再说吧。"
 POD_umbra_local.301.t:0 "征服"
 POD_umbra_local.301.desc:0 "您将尝试向[victim.GetFirstName]索要这部分[spirit_wilds|E]。外交或武力都可以说服他们承认你是这片灵域的新主人。"
 POD_umbra_local.301.a:0 "这地方不错，我要了。"
 POD_umbra_local.301.b:0 "让我们来做个交易。"
 POD_umbra_local.301.c:0 "我命令你把它交给我！"
 POD_umbra_local.301.d:0 "也许之后再说吧。"
 POD_umbra_local.302.t:0 "征服"
 POD_umbra_local.302.desc:0 "您将尝试向[victim.GetFirstName]索要这部分[shadowlands|E]。"
 POD_umbra_local.302.a:0 "这地方不错，我要了。"
 POD_umbra_local.302.b:0 "让我们来做个交易。"
 POD_umbra_local.302.c:0 "我命令你把它交给我！"
 POD_umbra_local.302.d:0 "也许之后再说吧。"
 POD_umbra_pass.202.t:0 "跨过暗隐寺庙"
 POD_umbra_pass.202.desc:0 "暗隐寺庙是[malfeas|E]的一个地点，位于[black_spiral_labyrinth|E]的入口。它是清真寺和大教堂的混合体，是东方宣礼塔和西方柱身凹槽的混合体。"
 POD_umbra_pass.202.a:0 "我将要求通过。"
 POD_umbra_pass.202.a.tt:0 "这个选项可用是因为你是妖蛆的仆从。"
 POD_umbra_pass.202.b:0 "我想溜进去"
 POD_umbra_pass.202.b.duel.tt.success:0 "还好过了。"
 POD_umbra_pass.202.b.duel.tt.failure:0 "！"
 POD_umbra_pass.202.c:0 "我最好还是别进去。"
 POD_umbra_pass.205.t:0 "停下！"
 POD_umbra_pass.205.desc:0 "你被守卫拦住了，他们觉得你不是冥河城的一份子，你将如何处理？"
 POD_umbra_pass.205.a:0 "我是来加入军团的。"
 POD_umbra_pass.205.b:0 "我是来加入行会的。"
 POD_umbra_pass.205.c:0 "我已经是你们的一员了！"
 POD_umbra_pass.205.d:0 "我只是在周边走走。"
 POD_umbra_pass.206.t:0 "停下！"
 POD_umbra_pass.206.desc:0 "你被守卫拦住了，他们觉得你不是彼岸的一份子，你将如何处理？"
 POD_umbra_pass.206.a:0 "我是来赞扬闪耀者的。"
 POD_umbra_pass.206.b:0 "我已经是你们的一员了！"
 POD_umbra_pass.206.c:0 "我只是在周边走走。"
 POD_umbra_pass.207.t:0 "停下！"
 POD_umbra_pass.207.desc:0 "帝乌斯被由失事船只组成的迷宫所保护，里面住着一些被努德里的怀拥所奴役的怨灵，以防止好奇的死灵和敌对的怨灵靠近。穿过迷宫的路径不断变化，没有船夫协会的同意，几乎不可能进入帝乌斯。你将如何处理？"
 POD_umbra_pass.207.a:0 "我想向你们效忠。"
 POD_umbra_pass.207.b:0 "我只是在周边走走。"
 POD_umbra_pass.207.a.duel.desc:0 "断绝仪式"
 POD_umbra_pass.208.t:0 "步入太阳"
 POD_umbra_pass.208.desc:0 "赫利俄斯所在的深影界，除了热量和耀眼的白光，什么都没有。在赫利俄斯的界域内，任何表面都因温度过高而无法长时间站立或停留。只有会飞的灵体才能进入该深影界区域，没有飞行能力的旅行者还没来得及意识到自己的错误，就会被烈火焚烧殆尽。\n\n你确定要触摸太阳本身吗？"
 POD_umbra_pass.208.a:0 "是，我要触摸太阳本身。多好的主意！"
 POD_umbra_pass.208.b:0 "赫利俄斯将保护我的灵魂。"
 POD_umbra_pass.208.c:0 "跑！"
 POD_umbra_prowess.success:0 "勇武挑战：成功"
 POD_umbra_prowess.fail:0 "勇武挑战：失败"
 POD_umbra_prowess.desc:0 "你被一位灵类拦住了，也许你可以与其战斗并获取战利品。"
 umbra_adv_challange_spirit:0 "你将与一位灵类进行[single_combat_duel|E]。"
 umbra_adv_challange_spirit.win:0 "你将获得祝福[modifier|E]或[prestige|E]。"
 POD_umbra_adv.101.t:0 "一比灵"
 POD_umbra_adv.101.desc:0 "选择一项祝福。"
 POD_umbra_adv.101.fallback:0 "我拒绝它们。"
 POD_umbra_adv.201.t:0 "宝藏"
 POD_umbra_adv.201.desc:0 "您发现了一个宝藏，里面有几件宝物，你想要带走哪一件？"
 POD_umbra_adv.201.fallback:0 "我将售卖它们。"
 POD_umbra_pass.101.c:0 "算了。"
 POD_artifact_pieces.100.t:0 "合成遗物碎片"
 POD_artifact_pieces.100.desc:0 "你找到一位死灵工匠，[creator.GetFirstName]，[creator.GetSheHe]也许能帮你合成已装备的遗物碎片。你想合成什麽？"
 POD_artifact_pieces.100.a:0 "合成这些碎片成一件宝物。"
 POD_artifact_pieces.100.b:0 "使用这些碎片来强化一件装备着的宝物。"
 POD_artifact_pieces.100.c:0 "强化该碎片。"
 POD_artifact_pieces.100.c.tt:0 "你会试着熔铸已装备的数个碎片更强大的一片。"
 POD_artifact_pieces.100.c.success:0 "你装备的碎片现已强化。"
 POD_artifact_pieces.100.d:0 "也许改夜吧。"
 POD_artifact_pieces.100.back:0 "回到先前选项。"
 POD_artifact_pieces.200.t:0 "重塑"
 POD_artifact_pieces.200.desc:0 "你想重塑成哪种宝物？"
 POD_artifact_pieces.300.t:0 "强化遗物"
 POD_artifact_pieces.300.desc:0 "你想强化哪种宝物？"
 POD_artifact_pieces.300.a:0 "武器"
 POD_artifact_pieces.300.a.invalid:0 "你#bold 没有#!未强化过的已装备武器。"
 POD_artifact_pieces.300.b:0 "盔甲"
 POD_artifact_pieces.300.b.invalid:0 "你#bold 没有#!未强化过的已装备盔甲。"
 POD_artifact_pieces.300.c:0 "礼器"
 POD_artifact_pieces.300.c.invalid:0 "你#bold 没有#!未强化过的已装备礼器。"
 POD_artifact_pieces.300.d:0 "冠冕"
 POD_artifact_pieces.300.d.invalid:0 "你#bold 没有#!未强化过的已装备冠冕。"
 POD_umbra_adv.201.artifact_1:0 "[artifact_1.Custom('ColorizedArtifactNameNoTooltip')]"
 POD_umbra_adv.201.artifact_2:0 "[artifact_2.Custom('ColorizedArtifactNameNoTooltip')]"
 POD_umbra_adv.201.artifact_3:0 "[artifact_3.Custom('ColorizedArtifactNameNoTooltip')]"
 POD_umbra_adv.201.reroll:0 "其他选项？"
 POD_umbra_adv.300.t:0 "与战士灵君的会面"
 POD_umbra_adv.300.desc:0 "灵君是化兽族裔用来描述一类灵类的术语；它们比天神弱小，但无论如何都是极其强大的灵类。灵君有明确的职责和影响范围，但他们强大到足以存在于现实的多个层面。\n根据线索，你成功找到了战士灵君，其承诺如果你能完成一项任务：杀死世界上最强大的妖蛆派统治者，其就会传授你传说中的无敌战士灵赋。"
 POD_umbra_adv.300.a:0 "接受挑战"
 POD_umbra_adv.302.t:0 "无敌战士"
 POD_umbra_adv.302.desc:0 "你已经到达了任务注定的敌人所在地，是时候决一死战了。"
 POD_umbra_adv.302.a:0 "我在这！"
 POD_umbra_adv.304.t:0 "奖励"
 POD_umbra_adv.304.desc:0 "你已经证明了自己的价值，战士灵君将灵赋传授给了你。你已达到狼人勇武的巅峰。"
 POD_umbra_adv.304.a:0 "一场旷世胜利！"
 POD_umbra_adv.400.t:0 "与盖亚化身的会面"
 POD_umbra_adv.400.desc:0 "盖亚比天神更上一层，是已知得极强灵类之一——也许还是第一个和最强的。她被认为创造了狼族和大多数化兽族裔，作为她在物界和灵界的战士和使徒。\n根据线索，你成功找到了盖亚的化身，她承诺如果你能完成一项任务：收集传奇书籍，她就会传授你传说中的说书人灵赋。"
 POD_umbra_adv.400.a:0 "接受挑战"
 POD_umbra_adv.500.t:0 "与强大灵类的会面"
 POD_umbra_adv.500.desc:0 "诸灵和灵界是狼族和其他化形者生活和文化的一个重要方面。眉月狼尤其擅长通过灵务与诸灵讨价还价，并通过灵赋和仪式约束诸灵。\n根据线索，你成功找到了一位特别强大的灵类，其承诺如果你能完成一项任务：摧毁妖蛆肆虐的影幕，其就会传授你传说中的解脱束缚灵赋。"
 POD_umbra_adv.500.a:0 "接受挑战"
 POD_umbra_adv.600.t:0 "与郊狼神的会面"
 POD_umbra_adv.600.desc:0 "郊狼神是究极诡骗师，比新月狼还要新月狼，是混乱的化身。郊狼神深不可测，常常愚蠢至极，却又才华横溢，他既是一位骗术大师，也是一位非常聪明的战士。\n根据线索，你成功找到了诡计多端的郊狼神的化身，他承诺如果你能完成一项任务：将一个帝国送给别人，他就会传授给你传说中的盗火者灵赋。只有郊狼神知道他为什么会提出这样的要求。"
 POD_umbra_adv.600.a:0 "接受挑战"
 POD_umbra_adv.700.t:0 "与盖亚的会面"
 POD_umbra_adv.700.desc:0 "盖亚比天神更上一层，是已知得极强灵类之一——也许还是第一个和最强的。她被认为创造了狼族和大多数化兽族裔，作为她在物界和灵界的战士和使徒。\n根据线索，你成功找到了盖亚本人，她承诺如果你能完成一项任务：统一狼国，她就会传授你传说中的再生产灵赋。考虑到你同胞的分裂本性，这可能是最困难的任务。"
 POD_umbra_adv.700.a:0 "我将在完成后再来，母亲。"
 POD_umbra_adv.700.b:0 "我做到了！"
 POD_umbra_adv.800.t:0 "与芬尼安祖灵的会面"
 POD_umbra_adv.800.desc:0 "芬尼安在狼族中以其对生活乐趣的热情、战斗的技巧和勇猛而闻名，并也是狼族的音乐、故事和传说的传承者。 他们的祖灵往往是最聪明的。\n根据线索，你成功找到了一些芬尼安祖灵，他们承诺如果你能完成一项任务：完成盖亚的英雄决议，他们就会传授你传奇灵赋。"
 POD_umbra_adv.800.a:0 "我将在完成后再来，祖先们。"
 POD_umbra_adv.800.b:0 "我做到了！"
 POD_umbra_adv.900.t:0 "与大芬里尔的会面"
 POD_umbra_adv.900.desc:0 "北欧传说中的狼神——芬里尔是一头在末日吞噬太阳的野兽。芬里尔力量强大，嗜血成性，从来和今后都不会让步。芬里尔仔兽的守护灵是战士的图腾，只对经常让敌人流血的狼族战群感兴趣。\n根据线索，你成功找到了大芬里尔本狼，他承诺如果你能完成一项任务：完成盖亚的狂战士决议，他就会传授你传奇灵赋。"
 POD_umbra_adv.900.a:0 "我将在完成后再来，大芬里尔。"
 POD_umbra_adv.900.b:0 "我做到了！"
 POD_umbra_adv.1000.t:0 "与祖狼的会面"
 POD_umbra_adv.1000.desc:0 "赤爪说，他们的部族是直接由盖亚建立的，他们是最纯粹的狼族，一直保持着最初的形态。因此，他们比其他部族更崇拜历史上最早的狼。\n根据线索，你成功找到了祖狼本狼，他承诺如果你能完成一项任务：完成盖亚之怒决议，他就会传授你传奇灵赋。"
 POD_umbra_adv.1000.a:0 "我将在完成后再来，先祖。"
 POD_umbra_adv.1000.b:0 "我做到了！"
 POD_umbra_adv.1100.t:0 "与盖亚化身的会面"
 POD_umbra_adv.1100.desc:0 "盖亚比天神更上一层，是已知得极强灵类之一——也许还是第一个和最强的。她被认为创造了狼族和大多数化兽族裔，作为她在物界和灵界的战士和使徒。\n根据线索，你成功找到了盖亚的化身，她承诺如果你能完成一项任务：王的回归，她就会传授你传说中的说书人灵赋。"
 POD_umbra_adv.1100.a:0 "我将在完成后再来，母亲。"
 POD_umbra_adv.1100.b:0 "我做到了！"
 POD_umbra_adv.1200.t:0 "与奇美拉化身的会面"
 POD_umbra_adv.1200.desc:0 "奇美拉是星占的守护灵，是谜的化身。她有许多面孔，邀请战群去寻找每个狼人在层层谜题和自欺欺人之下所蕴藏的智慧。\n根据线索，你成功找到了奇美拉的化身，她承诺如果你能完成一项任务：完成盖亚的智慧决议，她就会传授你传奇灵赋。"
 POD_umbra_adv.1200.a:0 "我将在完成后再来，奇美拉。"
 POD_umbra_adv.1200.b:0 "我做到了！"
 POD_umbra_adv.1300.t:0 "与恶神灵君的会面"
 POD_umbra_adv.1300.desc:0 "恶神曾经是凡人，但他们被一种特殊的恶惑彻底侵蚀，变成了体现这种恶惑的强大灵体。每位恶神都为它服务，直到他以某种方式失败，或者有更新、更强大的候选人浮出水面。每当有必要采取更直接的行动时，恶神就会充当恶惑的眼睛、耳朵、声音，有时还会充当恶惑的双手。\n根据线索，你成功找到了一位恶神灵君，其承诺如果你能完成一项任务：杀死世界上最强大的盖亚派统治者，其就会传授你传奇灵赋。"
 POD_umbra_adv.1300.a:0 "接受挑战"
 POD_umbra_adv.1400.t:0 "与低语者的会面"
 POD_umbra_adv.1400.desc:0 "作为秘密之灵，低语者带领她的盟友们发现秘密。只要稍加努力，她所选中的人就能破译常人无法理解的信息。这位伴灵飘荡在空中，看不见也听不见。据说她是伴灵们的回声，是天之声，以半信半疑的记忆形式传入凡间。她是一个很难找到的伴灵，往往只在最聪明的芭丝特前现身。\n根据线索，你成功找到了低语者，她承诺如果你能完成一项任务，她就会传授你传奇灵赋。"
 POD_umbra_adv.1400.a:0 "接受挑战"
 POD_umbra_adv.1500.t:0 "与抹除者的会面"
 POD_umbra_adv.1500.desc:0 "很少有妖蛆的爪牙像可怕的节点爬行者一样可怕或强大。一些眉月狼相信这些异形生物来自已知现实之外。\n根据线索，你成功找到了抹除者，节点爬行者之卵，它承诺如果你能完成一项任务，它就会传授你传奇灵赋。"
 POD_umbra_adv.1500.a:0 "接受挑战"
 POD_umbra_adv.1600.t:0 "与大祖父的会面"
 POD_umbra_adv.1600.desc:0 "根据他们的传说，古拉赫勒是盖亚最初的保护者，他们的诞生是为了抵御式样破坏者的破坏力。\n根据线索，你成功找到了大祖父，古拉赫勒的原初守护灵之一，他承诺如果你能完成一项任务，他就会传授你传奇灵赋。"
 POD_umbra_adv.1600.a:0 "接受挑战"
 POD_umbra_adv.1700.t:0 "与龙鳄的会面"
 POD_umbra_adv.1700.desc:0 "龙鳄又称龙王或陆龙，是娜迦用来描述作为族群守护灵的伟大龙灵的术语，也是唯一知道神圣秘密的灵类。\n根据线索，你成功找到了龙鳄，其承诺如果你能完成一项任务，其就会传授你传奇灵赋。"
 POD_umbra_adv.1700.a:0 "接受挑战"
 POD_umbra_adv.1800.t:0 "与郊狼神的会面"
 POD_umbra_adv.1800.desc:0 "郊狼神是究极诡骗师，比新月狼还要新月狼，是混乱的化身。郊狼神深不可测，常常愚蠢至极，却又才华横溢，他既是一位骗术大师，也是一位非常聪明的战士。\n根据线索，你成功找到了郊狼神，他承诺如果你能完成一项任务，他就会传授你传奇灵赋。"
 POD_umbra_adv.1800.a:0 "接受挑战"
 POD_umbra_adv.399.t:0 "转念一想"
 POD_umbra_adv.399.desc:0 "也许对于一位妖蛆信徒来说，去跟一位无比强力的盖亚派灵类会面不是什么好主意？"
 POD_umbra_adv.399.a:0 "逃！"
 POD_umbra_adv.399.b:0 "没什……"
 POD_umbra_gp.101.t:0 "面见最后的白嚎"
 POD_umbra_gp.101.desc:0 "作为震天战群的成员，科鲁克是唯一一位成功逃离黑螺旋并返回地表的白嚎部族成员。他被他那被污染的同族追捕，并且几乎被杀，但是他被骨雕者——一个被白嚎祖灵艾丹·远望者附身的神秘者——所救。在他临死之前，他设法向狼国警告白嚎已经堕落。\n在他去世后，他无法成为祖灵，因为白嚎的部族母界已经被妖蛆污染所改变。因此，他陷入了暗影界，成为一名游荡的死灵。受折磨的回忆几乎使他陷入湮灭，直到一小队黑螺旋舞者来到暗影界。科鲁克试图与他们交涉，但当他的询问遭到嘲笑时，他将他们的灵魂从身体中抽出，使他们自己也成为死灵。他花费了漫长的岁月来清除他们身上的妖蛆污染，并与他们组成了自己的战群。这支小队现在在暗影界中旅行，寻找摧毁被腐化的白嚎狼嫡的灵，或者转化（必要时摧毁）其他黑螺旋舞者的灵。\n在找到他之后，如果你能完成一项任务，他会提供互助的契约。"
 POD_umbra_gp.101.a:0 "部族的最后一人，你有什么请求？"
 POD_umbra_gp.101.b:0 "我没时间。"
 POD_umbra_gp.102.t:0 "面见唯一的白嚎祖灵"
 POD_umbra_gp.102.desc:0 "艾丹·远望者是人子凸月白嚎狼，活于公元前31年。因为永恒追踪仪式，艾丹的灵在他去世后依然追逐着那位溺没之王。公元200年，艾丹附身于一位被称为“骨雕者”的白嚎向导身上，一位来自深湖圣地的眉月狼。艾丹亲眼目睹了他的部族的厄运，英勇地与首批黑螺旋舞者战斗，但却无法阻止它的发生。他成为了唯一幸存的白嚎部族的祖灵。\n如果你能完成他的任务，他会向你提供他的服务（如果你是狼人，还可以教授你白嚎的灵赋）。"
 POD_umbra_gp.102.a:0 "我将倾听，聪慧的先祖。"
 POD_umbra_gp.102.b:0 "我没时间。"
 POD_umbra_gp.103.t:0 "亚里士多德"
 POD_umbra_gp.103.desc:0 "亚里士多德是古希腊的哲学家和博学家。他的著作涵盖了广泛的主题，包括自然科学、哲学、语言学、经济学、政治学、心理学和艺术。作为雅典的伊壁鸠鲁学派哲学的创始人，他开启了随之而来的更广泛的亚里士多德传统，为现代科学的发展奠定了基础。亚里士多德晚年的生活被他与曾经的学生亚历山大之间日益恶化的关系所困扰。被迫逃离雅典的家园，他的死对于这样一位备受尊崇的哲学思想巨擘来说并不光彩，这可能是他在去世后来到卡戎的国度的原因。\n他对凡人世界的兴趣，就像大多数死灵一样，你已经轻易地说服了他来到你的宫廷。"
 POD_umbra_gp.103.a:0 "你能使我成为下一位亚历山大么？"
 POD_umbra_gp.103.b:0 "没兴趣。"
 POD_umbra_gp.104.t:0 "希帕蒂娅"
 POD_umbra_gp.104.desc:0 "希帕蒂娅是一位新柏拉图主义哲学家、天文学家和数学家，生活在当时属于东罗马帝国的埃及亚历山大港。她在亚历山大港是一位杰出的思想家，教授哲学和天文学。她是第一位生平记录相对完整的女性数学家。希帕提娅在她的一生中以伟大的教师和智慧的顾问而闻名。她撰写了对丢番图的十三卷《算术》的评论，以及对阿波罗尼奥斯关于圆锥曲线的论文的另一份评论。\n作为一位发明家，希帕蒂娅制作了天文仪和水力计。她对基督徒持宽容态度，并教授了许多基督教学生，包括未来的托勒密主教辛奈西斯。希帕提娅受到原始教徒和基督徒的广泛喜爱，并在亚历山大港的政治精英中建立了巨大的影响力。在她生命的最后阶段，希帕蒂娅为亚历山大港的罗马总督欧瑞斯特提供了建议，而他正处于与亚历山大港的主教西里尔之间的政治争斗中。谣言传开，指责她阻止欧瑞斯特与西里尔和解，415年3月，她被一群以一位名叫彼得的读经员为首的基督徒暴民杀害。\n在影界徘徊时，你遇到了一个自称是她的灵，据说她在著名的灵界博学院担任院长。她可以成为一位宝贵的盟友。"
 POD_umbra_gp.104.a:0 "拜托了，在我的宫廷里你会学到很多东西！"
 POD_umbra_gp.104.b:0 "没兴趣。"
 POD_umbra_gp.105.t:0 "马哈福兹·阿拉姆"
 POD_umbra_gp.105.desc:0 "马哈福兹·阿拉姆，一位穆斯林战士，为了保卫耶路撒冷免受十字军骑士的侵略而英勇牺牲。他领导着一群被称为叛逆的死灵。他通过殉道确保了自己在天堂的地位，所谓的耶路撒冷死城对他来说是个可耻的笑话。他听说了太多关于无日之海的彼岸的虚假故事，他不相信仅凭体能努力就能到达天堂。\n因此，阿拉姆和他的盟友（虽然人数不多，但正在增长）希望驱逐占据耶路撒冷死城的成千上万的冥河城士兵，在来世建立一个穆斯林王国，挑战基督徒（被称为渔民）和明显不够格的冥河城的统治。\n面对这位穆斯林战士，你已经说服他，用他现有的力量挑战冥河城将会如同面对湮灭。与你合作，帮助他积蓄力量，更适合他的计划。"
 POD_umbra_gp.105.a:0 "我们将共同成长。"
 POD_umbra_gp.105.b:0 "没兴趣。"
 POD_umbra_crisis.102.t:0 "为时已晚"
 POD_umbra_crisis.102.desc:0 "妖蛆式仪式已经达成，一只强大的妖蛆属灵类被召唤到了[crisis_location.GetName]并摧毁了该地区。"
 POD_umbra_crisis.102.a:0 "该死！"
 POD_umbra_crisis.102.a.tt:0 "[crisis_location.GetName]内的所有建筑都被移除。"
 POD_umbra_crisis.110.t:0 "罪魁祸首"
 POD_umbra_crisis.110.desc:0 "你找到了仪式举行者的所在地，是时候在其能够召唤节点爬行者或更糟糕的憎恶之前阻止其了！"
 POD_umbra_crisis.110.a:0 "立刻停下来，妖蛆狼渣！"