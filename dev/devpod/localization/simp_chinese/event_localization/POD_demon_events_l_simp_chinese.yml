l_simp_chinese:
 POD_demon_maintenance.10.t:0 "容器"
 POD_demon_maintenance.10.desc:0 "为了留在尘世中，恶魔必须居住在某种物理容器中。恶魔憎恨他们的容器，一个他们必须躲在其中的上帝的无用世界里的壳；虽然比虚无空荡的深渊要好，但容器仍然是某种形式的监狱，在肉体中度过的每一刻都是另一个憎恨上帝的理由。他们期待着有一天能把整个物质世界点燃，在他们令人憎恶的灵国里舒适地观看光辉地毁灭。"
 POD_demon_maintenance.10.option.a:0 "我附身在人类宿主中。"
 POD_demon_maintenance.10.option.b:0 "我处于石之牢狱之中。"
 POD_demon_maintenance.10.option.c:0 "我缚于大地。"
 POD_demon_maintenance.10.option.c.tt:0 "你将无法移动你的首都或成为指挥官，且会在首都被占后退位。"
 reliquarie_destroyed_notification:0 "宿匣被毁"
 POD_demon_maintenance.11.t:0 "石之监牢"
 POD_demon_maintenance.11.desc:0 "大多数落入尘世的恶魔都存在宿匣中，这些宿匣是由它们的崇拜者创造出来供它们居住的无生命物体。当恶魔被召唤时，仪式会集中在宿匣上；恶魔会出现在宿匣中，它的灵与物品的物融为一体。"
 POD_demon_maintenance.11.option.a:0 "我宿于武器"
 POD_demon_maintenance.11.option.b:0 "我宿于盔甲"
 POD_demon_maintenance.11.option.c:0 "我宿于权器"
 POD_demon_maintenance.11.option.d:0 "我宿于书"
 POD_demon_maintenance.11.option.e:0 "我宿于家具"
 POD_demon_maintenance.11.option.f:0 "我宿于饰品"
 artifact_reliquarie_name:0 "宿匣"
 artifact_reliquarie_description:0 "#Bold 若宝物被摧毁，附身于此的[GetTrait('demon').GetName( GetNullCharacter )]将失去[GetTrait('earthbound').GetName( GetNullCharacter )][trait|E]。#!\n有着[owner.GetTitledFirstNameNoTooltip]灵魂于此，此宿匣取得了[GetTrait('demon').GetName( GetNullCharacter )]的部分特性。"
 POD_demon_arcana.100.t:0 "购买野兽军火"
 POD_demon_arcana.100.desc:0 "获得新兽性武器。"
 artifact_new_reliquarie_name:0 "恶魔之[this_artifact.GetNameNoTooltip]"
 artifact_new_reliquarie_desc:0 "[this_artifact.GetDesc]\n\n有着[owner.GetTitledFirstNameNoTooltip]附身于它，此宿匣取得了[GetTrait('demon').GetName( GetNullCharacter )]的部分特性。"
 artifact_old_reliquarie_desc:0 "[this_artifact.GetDesc]\n\n[owner.GetTitledFirstNameNoTooltip]不再附身于此宝物。"
 POD_demon_maintenance.20.t:0 "新宿主"
 POD_demon_maintenance.20.desc:0 "对于堕天使来说，栖息宿匣之外的唯一选择是占有人类宿主——直到最近，这都是一个非常糟糕的选择。恶魔可以在一段时间内附身于人类，但不是永久性的，因为附身的行为注定凡人在短时间内会不可避免的血腥死亡。肃灵仪式是一种新发现的可能性，使这一过程更容易一些。\n#X 在游戏层面，你必须始终有一个宿主，否则就会被迫返回深渊监狱。你可以通过恶魔附身角色互动来选择你的下一个宿主，这也将允许你“吸取”宿主的一些属性。如果你现在的宿主死后没有宿主，你将选择一位随机魔奴作为“应急”宿主来代替（且没有属性加成）。正如你可能已经猜到的那样，宿主角色对你的游戏玩法很重要，注意（或别忘了）他们的状况！#!"
 POD_demon_maintenance.20.option.a:0 "我的新身体准备好了。"
 POD_demon_maintenance.20.option.b:0 "让我变回灵体形态"
 POD_days_of_fire.1342.t:0 "第二次大恶湍"
 POD_days_of_fire.1342.desc:0 "因着被定罪者的追随者们，黑暗降临了大地\n降临到人类的灵魂之上\n生者不仅嫉妒着死者，也嫉妒着忘却了死亡的存在。\n正当死者遭受着他们的第二次大风暴之时，这些生者，\n也依然藐视赐予者的最终赠礼，\n而代之以拥吮，伟大的鲜血之王的诅咒。\n这将发生不只一次，而是两次。"
 POD_days_of_fire.1401.t:0 "文艺复兴"
 POD_days_of_fire.1401.desc:0 "时候来临，黑暗消散。\n男人再一次将他的眼光投向天空\n发现了比自己更为伟大的事物。\n有着玻璃瞳孔的男人看到了真实，有着银色鼻梁的男人嗅到了真实。\n睿智的愚者问：“月亮为何不会掉落？”\n无意之中，他们成了战胜未知的全新部族的创始者。\n他们创立了理性之部族。"
 POD_days_of_fire.1430.t:0 "裁判所"
 POD_days_of_fire.1430.desc:0 "当被定罪者的子民成了父亲\n仍然拒绝生育子嗣\n他们将会攻击伟大的鲜血之王的子民\n他们也将会攻击书之子民。\n他们倾盆而下的，并非甘霖，而是烈焰\n将义与不义一并笼罩。\n试图以良善之名作恶，他们仍是在作恶。"
 POD_days_of_fire.1450.t:0 "大反乱"
 POD_days_of_fire.1450.desc:0 "此时，伟大的王的诅咒\n瓜熟蒂落了。\n就像长子唾弃赐予者那样，\n就像他的杂种唾弃他自己那样，\n他那卑鄙巢穴中的蠕虫\n亦将会起来刺痛蛇豸。\n他们的弱点之数为十四：其中之一的力量将会衰退。"
 POD_days_of_fire.1492.t:0 "新大陆"
 POD_days_of_fire.1492.desc:0 "丰饶地土依然沉睡\n直至被木鱼上的铁人们唤醒。\n他们的第一名使者是灾祸。\n他们的第二名使者是马匹。\n他们的第三名使者是源自大地的电光。\n他们的第四名使者是起于毒虫的疫病。\n他们来临，照亮，并掠夺。"
 POD_days_of_fire.1605.t:0 "第三次大恶湍"
 POD_days_of_fire.1605.desc:0 "丰饶地土之部族的沦落\n是那个民族最初的原罪。\n痛苦之雨因它第三次降临，甚至死者也为之哀恸。\n他们的第二个原罪是偷取了颅骨地界之子民。\n劳作在这片土地上的奴隶失去了所有的馈赠\n自由，家庭，以及信仰\n那些窃贼则沉浸于柔软的织品和甜美的醇酒。"
 POD_days_of_fire.1759.t:0 "工业革命"
 POD_days_of_fire.1759.desc:0 "亲见了奇象、奇观甚至奇迹之后\n人群蜂拥涌入理性之部族。\n虽然没有抛弃书，柱子，或者被定罪者\n但仍有许多人最初的忠诚远离了灵魂，游离于嘴角。\n他们越发精致的衣物不再由人手缀缝和编织。\n他们仅是利用霞雾的霾气就能起动引擎。\n人类的选择导致了随后的一切。"
 POD_days_of_fire.1775.t:0 "美国独立革命"
 POD_days_of_fire.1775.desc:0 "新生势力来到了古老的大陆\n使用新的材质挑战旧有的智慧\n利用新的物主挑战旧有的规则。\n这是为了叶片和饮料\n也是为了开启去往中土帝国和梦之子民的途径。\n一个远古王国的骄傲因此而消沉\n它的子民被迫忍受侵入者的藐视。"
 POD_days_of_fire.1837.t:0 "维多利亚时代"
 POD_days_of_fire.1837.desc:0 "这是一个美好的年代，不属于颅骨或梦境之子民的人如此说。\n实际上那些人只是少数，因此它仅持续了不到一个世代。\n博爱、仁慈、以及人性之完美的概念\n成了贪婪、嫉妒和人性之缺陷的祭品。\n对理性之统治的呼唤\n反而导致了理性被激情所统治。\n在美德之名下，行进着的是黑暗的欲望。"
 POD_days_of_fire.1914.t:0 "第一次世界大战"
 POD_days_of_fire.1914.desc:0 "每个国度都在贪婪地注视着邻居的碗中之物。\n受到永恒诅咒的颅骨地界，仿佛落在豺狼爪中般沉沦。\n战争动摇了世界，\n战火不仅在陆地上燃烧，也波及了海洋和天空。\n当女人、男人和孩子们因旗帜而亡时\n废墟、泥淀、毒物和利刃的辽阔荒原\n在大地上割出绵延不绝的伤疤。"
 POD_days_of_fire.1916.t:0 "第四次大恶湍"
 POD_days_of_fire.1916.desc:0 "战争产生了如此巨大的悲伤\n墓穴中的死者再一次被扰乱。\n第四次的黯影风暴\n第四次的记忆骤雨\n带来的痛苦更甚以往\n但比起即将到来的之后两次\n它的狂暴和毁灭并未达到极致。"
 POD_days_of_fire.1918.t:0 "流感大流行"
 POD_days_of_fire.1918.desc:0 "只有当丰饶地土\n因它父母的哭喊而苏醒时\n战争才会着陆，留下悲哀的结局。\n但是痛苦并未随之终止。\n在人屠杀人的场面\n被吞噬一切的瘟疫所取代后\n世界的时间将以百年来计数。"
 POD_days_of_fire.1931.t:0 "第二次世界大战"
 POD_days_of_fire.1931.desc:0 "第一次战争留下的种子孵化出了第二次战争\n被杀戮者之中卷起了第二次风暴。\n失败者要靠战斗夺回自己的骄傲\n他们的标志是扭曲的生命之蜘蛛\n因为他们把死亡带给了书之子民。\n他们的屠戮并非源于战争所产生的狂热\n而是如母亲烘培面包般冷静沉着的谋杀。"
 POD_days_of_fire.1937.t:0 "抗日战争"
 POD_days_of_fire.1937.desc:0 "并非只有黑蛛之国度在战争着。\n东方之光的岛屿也参与了进来。\n他们用暴力威胁掠夺了中土帝国。\n狼之子民的后裔们\n再一次回到了颅骨地界\n寻求着先祖之征服的再现。"
 POD_days_of_fire.1945.t:0 "第二次世界大战的结束"
 POD_days_of_fire.1945.desc:0 "再一次的，丰饶地土倾斜了战争的微妙平衡\n这是用食物、钢铁以及儿辈们的鲜血换来的。\n战争结束了，\n人屠杀人的场面\n被思想和信仰之屠戮所代替。\n火与电的战争\n被静寂与寒颤之争斗所取代。"
 POD_days_of_fire.1950.t:0 "铁幕"
 POD_days_of_fire.1950.desc:0 "一道墙兴建起来\n但却因鹰与熊之间的竞争而被跨越。\n肤浅的思维孵生出了深烈的恨意\n他们所盲目恐惧之物，其数为五十又七。\n傀儡的战斗流着真正的鲜血\n所有一切都生活在邪恶烈焰的阴影之中。"
 POD_days_of_fire.1999.t:0 "第六次大恶湍"
 POD_days_of_fire.1999.desc:0 "永不消逝、从未被日光所平息的第六次风暴来临了。\n寂静而无踪的风暴，惊骇与黯影的障壁。\n它是天使为唤醒所有沉眠者的火焰而给予的赠礼吗？\n还是源自仍被铭记的幽魂们针对遗忘所发动的战争？\n它来了。然后她来了。\n墓穴喷发着，记忆摧毁了真实，哀号在湮灭大厅中回响。\n她恐怖的后裔对这慈爱如同毁灭的吞噬万物者充满畏惧。"
 demon_without_host_tt:0 "这是一个危险的选择。没有宿主，你可能会落入深渊很长一段时间。"