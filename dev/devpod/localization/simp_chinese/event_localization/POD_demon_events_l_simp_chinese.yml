l_simp_chinese:
 POD_demon_maintenance.10.t: "容器"
 POD_demon_maintenance.10.desc: "为了留在尘世中，恶魔必须居住在某种物理容器中。恶魔憎恨他们的容器，一个他们必须躲在其中的上帝的无用世界里的壳；虽然比虚无空荡的深渊要好，但容器仍然是某种形式的监狱，在肉体中度过的每一刻都是另一个憎恨上帝的理由。他们期待着有一天能把整个物质世界点燃，在他们令人憎恶的灵国里舒适地观看光辉地毁灭。\n#X 在游戏中，深种缚是永生的，但必须将他们的灵魂放在物质世界的某个部件中。它可以是他们的首都，导致他们不能指挥军队，不能移动他们的首都，如果他们失去了它，就会被遣回深渊监狱。或者，他们可以被绑在一个宿匣上，一个给他们更多的移动性，但也更脆弱的宝物。如果宿匣被摧毁，恶魔就会再次回到深渊监狱，逃离的代价将是非常昂贵的。#!"
 POD_demon_maintenance.10.option.a: "我只附身人类宿体。"
 POD_demon_maintenance.10.option.b: "我处于石之牢狱之中。"
 POD_demon_maintenance.10.option.c: "我缚于大地。"
 POD_demon_maintenance.10.option.c.tt: "你将无法移动你的首都，且会在首都被占后退位。"
 POD_demon_maintenance.11.t: "石之监牢"
 POD_demon_maintenance.11.desc: "大多数落入尘世的恶魔都存在宿匣中，这些宿匣是由它们的崇拜者创造出来供它们居住的无生命物体。当恶魔被召唤时，仪式会集中在宿匣上；恶魔会出现在宿匣中，它的灵与物品的物融为一体。"
 POD_demon_maintenance.11.option.a: "我宿于武器"
 POD_demon_maintenance.11.option.b: "我宿于盔甲"
 POD_demon_maintenance.11.option.c: "我宿于权器"
 POD_demon_maintenance.11.option.d: "我宿于书"
 POD_demon_maintenance.11.option.e: "我宿于家具"
 POD_demon_maintenance.11.option.f: "我宿于饰品"
 POD_demon_arcana.100.t: "购买野兽军火"
 POD_demon_arcana.100.desc: "获得新兽性武器。"
 POD_demon_maintenance.20.t: "新宿主"
 POD_demon_maintenance.20.desc: "对于堕天使来说，栖息宿匣之外的唯一选择是占有人类宿主——直到最近，这都是一个非常糟糕的选择。恶魔可以在一段时间内附身于人类，但不是永久性的，因为附身的行为注定凡人在短时间内会不可避免的血腥死亡。肃灵仪式是一种新发现的可能性，使这一过程更容易一些。\n#X 在游戏层面，你必须始终有一个宿主，否则就会被迫返回深渊监狱。你可以通过添加潜在宿主[character_interaction|E]来选择你的下一个宿主，这也将允许你“吸取”宿主的一些属性。如果你现在的宿主死后没有宿主，你将选择一位随机教徒作为“应急”宿主来代替（且没有属性加成）。正如你可能已经猜到的那样，宿主角色对你的游戏玩法很重要，你可以在从属界面找到他们，注意（或别忘了）他们的状况！#!"
 POD_demon_maintenance.20.option.a: "我将附身任意教徒。"
 POD_demon_maintenance.20.option.b: "我将附身任意物品。"
 POD_days_of_fire.1342.t: "第二次大死涡"
 POD_days_of_fire.1342.desc: "因着被定罪者的追随者们，黑暗降临了大地\n降临到人类的灵魂之上\n生者不仅嫉妒着死者，也嫉妒着忘却了死亡的存在。\n正当死者遭受着他们的第二次大风暴之时，这些生者，\n也依然藐视赐予者的最终赠礼，\n而代之以拥吮，伟大的鲜血之王的诅咒。\n这将发生不只一次，而是两次。"
 POD_days_of_fire.1401.t: "文艺复兴"
 POD_days_of_fire.1401.desc: "时候来临，黑暗消散。\n男人再一次将他的眼光投向天空\n发现了比自己更为伟大的事物。\n有着玻璃瞳孔的男人看到了真实，有着银色鼻梁的男人嗅到了真实。\n睿智的愚者问：“月亮为何不会掉落？”\n无意之中，他们成了战胜未知的全新部族的创始者。\n他们创立了理性之部族。"
 POD_days_of_fire.1430.t: "裁判所"
 POD_days_of_fire.1430.desc: "当被定罪者的子民成了父亲\n仍然拒绝生育子嗣\n他们将会攻击伟大的鲜血之王的子民\n他们也将会攻击书之子民。\n他们倾盆而下的，并非甘霖，而是烈焰\n将义与不义一并笼罩。\n试图以良善之名作恶，他们仍是在作恶。"
 POD_days_of_fire.1450.t: "大反乱"
 POD_days_of_fire.1450.desc: "此时，伟大的王的诅咒\n瓜熟蒂落了。\n就像长子唾弃赐予者那样，\n就像他的杂种唾弃他自己那样，\n他那卑鄙巢穴中的蠕虫\n亦将会起来刺痛蛇豸。\n他们的弱点之数为十四：其中之一的力量将会衰退。"
 POD_days_of_fire.1492.t: "新大陆"
 POD_days_of_fire.1492.desc: "丰饶地土依然沉睡\n直至被木鱼上的铁人们唤醒。\n他们的第一名使者是灾祸。\n他们的第二名使者是马匹。\n他们的第三名使者是源自大地的电光。\n他们的第四名使者是起于毒虫的疫病。\n他们来临，照亮，并掠夺。"
 POD_days_of_fire.1605.t: "第三次大死涡"
 POD_days_of_fire.1605.desc: "丰饶地土之部族的沦落\n是那个民族最初的原罪。\n痛苦之雨因它第三次降临，甚至死者也为之哀恸。\n他们的第二个原罪是偷取了颅骨地界之子民。\n劳作在这片土地上的奴隶失去了所有的馈赠\n自由，家庭，以及信仰\n那些窃贼则沉浸于柔软的织品和甜美的醇酒。"
 POD_days_of_fire.1759.t: "工业革命"
 POD_days_of_fire.1759.desc: "亲见了奇象、奇观甚至奇迹之后\n人群蜂拥涌入理性之部族。\n虽然没有抛弃书，柱子，或者被定罪者\n但仍有许多人最初的忠诚远离了灵魂，游离于嘴角。\n他们越发精致的衣物不再由人手缀缝和编织。\n他们仅是利用霞雾的霾气就能起动引擎。\n人类的选择导致了随后的一切。"
 POD_days_of_fire.1775.t: "美国独立革命"
 POD_days_of_fire.1775.desc: "新生势力来到了古老的大陆\n使用新的材质挑战旧有的智慧\n利用新的物主挑战旧有的规则。\n这是为了叶片和饮料\n也是为了开启去往中土帝国和梦之子民的途径。\n一个远古王国的骄傲因此而消沉\n它的子民被迫忍受侵入者的藐视。"
 POD_days_of_fire.1837.t: "维多利亚时代"
 POD_days_of_fire.1837.desc: "这是一个美好的年代，不属于颅骨或梦境之子民的人如此说。\n实际上那些人只是少数，因此它仅持续了不到一个世代。\n博爱、仁慈、以及人性之完美的概念\n成了贪婪、嫉妒和人性之缺陷的祭品。\n对理性之统治的呼唤\n反而导致了理性被激情所统治。\n在美德之名下，行进着的是黑暗的欲望。"
 POD_days_of_fire.1914.t: "第一次世界大战"
 POD_days_of_fire.1914.desc: "每个国度都在贪婪地注视着邻居的碗中之物。\n受到永恒诅咒的颅骨地界，仿佛落在豺狼爪中般沉沦。\n战争动摇了世界，\n战火不仅在陆地上燃烧，也波及了海洋和天空。\n当女人、男人和孩子们因旗帜而亡时\n废墟、泥淀、毒物和利刃的辽阔荒原\n在大地上割出绵延不绝的伤疤。"
 POD_days_of_fire.1916.t: "第四次大死涡"
 POD_days_of_fire.1916.desc: "战争产生了如此巨大的悲伤\n墓穴中的死者再一次被扰乱。\n第四次的黯影风暴\n第四次的记忆骤雨\n带来的痛苦更甚以往\n但比起即将到来的之后两次\n它的狂暴和毁灭并未达到极致。"
 POD_days_of_fire.1918.t: "流感大流行"
 POD_days_of_fire.1918.desc: "只有当丰饶地土\n因它父母的哭喊而苏醒时\n战争才会着陆，留下悲哀的结局。\n但是痛苦并未随之终止。\n在人屠杀人的场面\n被吞噬一切的瘟疫所取代后\n世界的时间将以百年来计数。"
 POD_days_of_fire.1931.t: "第二次世界大战"
 POD_days_of_fire.1931.desc: "第一次战争留下的种子孵化出了第二次战争\n被杀戮者之中卷起了第二次风暴。\n失败者要靠战斗夺回自己的骄傲\n他们的标志是扭曲的生命之蜘蛛\n因为他们把死亡带给了书之子民。\n他们的屠戮并非源于战争所产生的狂热\n而是如母亲烘培面包般冷静沉着的谋杀。"
 POD_days_of_fire.1937.t: "抗日战争"
 POD_days_of_fire.1937.desc: "并非只有黑蛛之国度在战争着。\n东方之光的岛屿也参与了进来。\n他们用暴力威胁掠夺了中土帝国。\n狼之子民的后裔们\n再一次回到了颅骨地界\n寻求着先祖之征服的再现。"
 POD_days_of_fire.1945.t: "第二次世界大战的结束"
 POD_days_of_fire.1945.desc: "再一次的，丰饶地土倾斜了战争的微妙平衡\n这是用食物、钢铁以及儿辈们的鲜血换来的。\n战争结束了，\n人屠杀人的场面\n被思想和信仰之屠戮所代替。\n火与电的战争\n被静寂与寒颤之争斗所取代。"
 POD_days_of_fire.1950.t: "铁幕"
 POD_days_of_fire.1950.desc: "一道墙兴建起来\n但却因鹰与熊之间的竞争而被跨越。\n肤浅的思维孵生出了深烈的恨意\n他们所盲目恐惧之物，其数为五十又七。\n傀儡的战斗流着真正的鲜血\n所有一切都生活在邪恶烈焰的阴影之中。"
 POD_days_of_fire.1999.t: "第六次大死涡"
 POD_days_of_fire.1999.desc: "永不消逝、从未被日光所平息的第六次风暴来临了。\n寂静而无踪的风暴，惊骇与黯影的障壁。\n它是天使为唤醒所有沉眠者的火焰而给予的赠礼吗？\n还是源自仍被铭记的幽魂们针对遗忘所发动的战争？\n它来了。然后她来了。\n墓穴喷发着，记忆摧毁了真实，哀号在[UmbraGlossary('oblivion')]大厅中回响。\n她恐怖的后裔对这慈爱如同毁灭的吞噬万物者充满畏惧。"
 demon_without_host_tt: "这是一个危险的选择。没有宿主，你可能会在很长一段时间内困在[umbra|E]。"
 earthbound_artifact_choice_tt: "你将会能可以选择宝物作为你的宿匣，即你的灵魂容器。"
 POD_demon_flavor.1.t: "回忆：曾是天使"
 POD_demon_flavor.1.desc: "所有的恶魔都曾经是天使，是上帝亲自创造，帮助祂管理和看管人类。每位天使都有一个（有时是广泛的，有时是非常具体的）使命，在创造过程中根植于他们的存在之中。这神圣的使命是他们的本质，虽然已经被无数年来的深渊监禁所扭曲和腐蚀，但它永远无法被完全洗掉。\n你的显赫增长将一些早期的记忆从遗忘中拉了回来。在逆神之前的那些轻松日子时，你的使命是什么？"
 POD_demon_flavor.1.a: "命运之天使"
 POD_demon_flavor.1.b: "形式之天使"
 POD_demon_flavor.1.c: "领导之天使"
 POD_demon_flavor.1.d: "道途之天使"
 POD_demon_flavor.1.e: "星光之天使"
 POD_demon_flavor.100.t: "通往地狱的阶梯"
 POD_demon_flavor.100.desc: "恶魔的燃料来自他们的魔奴直接提供的信仰，甚至间接地来自落入他们所了解的原罪的人。有了信仰，恶魔就会变得强大，至少在理论上可以达到与上帝本身同等的力量。\n随着你的显赫地增长和你对人类的统治的扩大，你的力量也在增强。你想利用你的羊群的虔诚来增强你自己的力量，并在恶魔的序列中上升吗？"
 POD_demon_flavor.100.a: "小小提升。"
 POD_demon_flavor.100.b: "我的潜力是无穷的。"
 POD_demon_flavor.100.c: "赞美我！"
 POD_demon_flavor.100.d: "天堂将颤抖！"
 POD_demon_flavor.100.e: "无穷的力量！"
 POD_demon_flavor.100.f: "我已经足够强大"
 POD_demon_flavor.2.t: "回忆：创世纪"
 POD_demon_flavor.2.desc: "人类是上帝最好的造物，或者说祂是这么认为的。你作为天使的使命，是看护他们并引导他们，但永远不要展示你自己。事实上，这是一个转折，上帝明显偏爱他最新的造物……但也警告你不要干涉他们潜在的错误。即使这样的错误可能导致灾难的发生。许多天使在这件事上很纠结，有些人认为上帝矛盾的命令是一种考验。或者说，既人类开始崛起，祂就不再关心他们了。\n最后，有些开始嫉妒人类，有些过度保护，有些则保持旁观。你呢？"
 POD_demon_flavor.2.a: "你遵守了你的使命：引导他们。"
 POD_demon_flavor.2.b: "你对他们充满了羡慕和怨恨。"
 POD_demon_flavor.2.c: "你表明了自己的导师身份。"
 POD_demon_flavor.3.t: "回忆：堕天"
 POD_demon_flavor.3.desc: "天堂之战始于一个预言，它警告天使们人类将面临一场即将到来的灾难。以路西法为首的一些天使想向凡人显露自己，以拯救他们脱离这场厄运。其他人则认为，上帝不干涉人类的意愿比他们作为守护者的职责更重要。在该隐谋杀了他的兄弟亚伯后，争论演变为战争，将暴力这一概念引入了这个新生的世界。\n路西法的叛乱最终失败了，所有的叛乱者都变成了现在被称为恶魔的生物，比如你。但你当初为何选择加入路西法的阵营？"
 POD_demon_flavor.3.a: "路西法的魅力动摇了你。"
 POD_demon_flavor.3.b: "你想保护人类。"
 POD_demon_flavor.3.c: "战争这一新概念让你着迷。"
 POD_demon_flavor.3.d: "时至今日，你仍然不确定。"
 POD_demon_flavor.4.t: "回忆：判入地狱"
 POD_demon_flavor.4.desc: "被打败的叛逆天使，包括你，都被扔在深渊监狱里。这可怕的结构将大多数囚犯打成了他们曾经的可悲影子。有些人仍然设法找到了一些新常态，没有让他们在神圣磨难中更加受苦。然而，即使这样也是有代价的。这些曾经被称为天使的生命远离了他们最初的目的，他们的本质，变得扭曲得面目全非，希望找到一种方法来应对被永远禁止进入天堂的状况。\n最后，你是逃脱的少数幸运儿之一，但你仍能感觉到监狱对你的召唤。对这个地方的记忆也在涌出。"
 POD_demon_flavor.4.a: "你在那里做了一些你宁愿忘记的事情。"
 POD_demon_flavor.4.b: "你祈求着从未到来的宽恕。"
 POD_demon_flavor.4.c: "你忍了下来。这是最重要的。"
 POD_demon_flavor.5.t: "回忆：人间地狱"
 POD_demon_flavor.5.desc: "你是少数最终被召唤出深渊监狱的幸运儿之一，让你在与你的逆神者同伴一起经历了千年的煎熬之后，逃到了凡间。自从你被监禁以来，世界发生了很大的变化。战争和绝望随处可见，疾病横行，伊甸园的天堂在此时看来是如此的神话。人类仍然崇拜上帝，但有多种形式，并为哪种形式更好而争斗。\n他可能真的把目光从地球上移开了，也许是因为路西法的叛乱，或者人类的失败。在任何情况下，当第一次看到这个新世界时，你的第一反应是什么？"
 POD_demon_flavor.5.a: "它需要被清洗！"
 POD_demon_flavor.5.b: "这么多潜在的信徒！"
 POD_demon_flavor.5.c: "也许，在某地方，有一丝微弱的救赎希望。"
 POD_demon_maintenance.20.option.c: "我将附身我的首都"
 POD_demon_maintenance.20.option.d: "让我变回灵体。"
 POD_demon_maintenance.10.option.a.tt: "只附身人类宿体（且不附身无生命容器）将降低你的磨难。（-1磨难/年）"
 POD_demon_maintenance.10.option.b.tt: "你将无法成为指挥官或旅行，除非你还附身人类宿体。"
 POD_demon_maintenance.70.t: "你这该死的魔奴"
 POD_demon_maintenance.70.desc: "你胆敢试图囚禁你的主人？！你灵魂的拥有者？！\n你误入歧途的野心会让你付出惨重的代价，我会享受这一切……"
 POD_demon_maintenance.70.option.a: "这是个无心之过！"
 POD_demon_maintenance.15.t: "继续附身宿体？"
 POD_demon_maintenance.15.desc: "在附身物体的同时切换使用人类宿体可以让你旅行和享受各种活动，但它也有缺点，那就是宿体会更快死去，就像你现在遇到的情况一样。你还要继续这样做么？"
 POD_demon_maintenance.15.option.a: "我就继续切换。"
 POD_demon_maintenance.15.option.b: "我厌倦了凡人的琐事。"
 demonic_objective_final_war_unlock: "解锁#s $POD_demon_final_war_objective_decision$决议#!（若你已经完成其他先置决议）"
 demonic_objective_overthrow_unlock: "若已完成前置目标，则解锁#s $POD_new_genesis_objective_decision$目标#!"
 chance_of_redemption_unlock: "解锁#s $POD_demon_redemption_objective_decision$决议#!"
 POD_demon_flavor.5.d: "我必须找到神圣之问的答案。"
