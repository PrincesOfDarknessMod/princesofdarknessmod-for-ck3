l_simp_chinese:
 POD_talmahera.10.t: "幕后黑手"
 POD_talmahera.10.desc: "最近，你和其他有类似想法的黑夜统治者收到了一些令人担忧的报告，说有一个什么火焚末日密教。虽然大多数末日狂热者在大多数时候都是无害的，但这些特定的人似乎在利用他们无害的外表来收集各种情报，如该地区的主要权力人物、他们的弱点以及其他通常与火焚末日密教实践无关的政治资产。\n这其中可能有更大的阴谋。"
 POD_talmahera.10.a: "是谁在操纵我们？"
 POD_talmahera.11.t: "暴露！"
 POD_talmahera.11.desc: "如果说秘盟是塔尔玛埃拉的剑，那么魔宴就是他们的棍。并不是所有的魔宴吸血鬼都是狂欢的铲头，但只有在这些队伍中才会发现明显缺乏约束的现象。塔尔玛埃拉已经渗透到该党派的各个权力和影响力层面，其中至少包括两位大主教和一位枢机。他们的优势在于可以自由地在魔宴各地播撒其主要密教的枝叶。这些组织规模较小，由忠诚虔诚的代理人组成，向魔宴展现出不同的公众形象。\n尽管取得了这些成功，魔宴仍然是塔尔玛埃拉在意识形态上必须面对的最真正的敌人。该隐之剑试图向上古耆宿开战。当火焚末日降临时，魔宴无疑将成为主要的反抗力量。当对上古耆宿的信仰的消息传到该党派真正信徒的耳中时，他们的回答总是迅速而血腥。\n#N 该事件源于你的侵入达到了最大嫌疑！#!"
 POD_talmahera.11.a: "一点小挫折。"
 POD_talmahera.11.a.tt: "魔宴在未来#V 20#!年内无法被渗透。"
 POD_talmahera.12.t: "暴露！"
 POD_talmahera.12.desc: "秘盟既是最容易渗透的党派，也是最难渗透的党派，塔尔玛埃拉的特工在他们的任务中取得了不同程度的成功。无论从哪个方面来看，秘盟都是功利和贵族制度的私生子，塔尔玛埃拉已成为在党派政治结构中玩弄制度以获得权力的高手。塔尔玛埃拉的特工们小心翼翼地监视着秘盟，他们认为上古耆宿只是童话和都市传说。塔尔玛埃拉内部对此一直存在争议。一些特工在他们的城市播下怀疑的种子，试图引诱人们加入密教。他们试图利用自己的成员从内部推翻腐败的党派，从而结束秘盟的弊端。其他特工则助长秘盟的无知，培养并强化他们的不信任感。毕竟，上古耆宿醒来后还得进食。有什么能比大快朵颐一群毫无准备的意志薄弱、血气方刚的吸血鬼更好呢？\n尽管表面上很轻松，但一些亲王和巡行裁决官还是起了疑心，开始进行调查。到目前为止，还没有大阴谋的证据浮出水面，但揭露罪证可能只是时间问题。\n#N 该事件源于你的侵入达到了最大嫌疑！#!"
 POD_talmahera.12.a: "一点小挫折。"
 POD_talmahera.12.a.tt: "秘盟在未来#V 20#!年内无法被渗透。"
 POD_talmahera.13.t: "暴露！"
 POD_talmahera.13.desc: "非洲和中东的塔尔玛埃拉是一个与世隔绝的小组织，它不与教派的主体分享自己的秘密。有些人认为该组织中居住着一位炽天使，但很多人都知道非洲之手根本不是由炽天使监管的，而是由三位长者组成的，他们按照自己的意愿解释德尔罗的旨意。这个部门的主要目的是监视秘盟、阿什拉派和魔宴在非洲的存在，挫败赛特之子的阴谋，并获取有关非洲神秘而孤僻的莱本吸血鬼的信息。非洲之手并不经常参与该地区的事务，因此是塔尔玛埃拉最被动的部门。松散的阶级制度在很大程度上让其成员自生自灭。因此，在塔尔玛埃拉的指导下，许多血腥邪教如雨后春笋般涌现，为主人源源不断地提供血液、家臣、特工、间谍和线人。尽管非洲之手如此被动，但它并不总是能巧妙地避免麻烦，其中最明显的是组织严密、意识形态保持对立的阿什拉派教派。\n#N 该事件源于你的侵入达到了最大嫌疑！#!"
 POD_talmahera.13.a: "一点小挫折。"
 POD_talmahera.13.a.tt: "阿什拉派在未来#V 20#!年内无法被渗透。"
 POD_talmahera.14.t: "暴露！"
 POD_talmahera.14.desc: "赛特信徒似乎是塔尔玛埃拉的一个显而易见的新同好，因为他们的行事与我们对氏族尊长的崇敬并无太大偏差。然而，教派从其历史的早期就开始与赛特之子交战。战争最初源于千年前对以诺城的争夺，后来的冲突则源于蛇们操纵塔尔玛埃拉和阿刹迈的冲突。\n虽然塔尔玛埃拉只想彻底消灭这个氏族，但他们必须小心行事。赛特之子对教派了如指掌，一旦塔尔玛埃拉对他们采取过于公开的行动，他们就会利用这些信息进行战略自卫。这迫使教派放弃对赛特之子的关注，集中精力控制损失，以保守秘密。\n令人遗憾的是，蛇们也是间谍游戏的高手，导致埃及的许多塔尔玛埃拉代理人失踪或直接转而崇拜赛特。\n#N 该事件源于你的侵入达到了最大嫌疑！#!"
 POD_talmahera.14.a: "一点小挫折。"
 POD_talmahera.14.a.tt: "赛特之子在未来#V 20#!年内无法被渗透。"
 POD_talmahera.15.t: "暴露！"
 POD_talmahera.15.desc: "从布达拉宫和罗布林卡宫的阴影，到大昭寺的镀金屋顶，拉萨是西藏文化的心脏和灵魂，也是亚洲塔尔玛赫拉的。亚洲之手的阶级制度非常严格，不重视个人利益，更重视对整体的奉献。内部的每个吸血鬼都知道自己在教团中的位置，那些越界者会被果断处理。这个分部与该地区的凡人关系密切，塔尔马赫拉在吸血鬼的日常生活中扮演着更积极的角色。\n塔尔玛埃拉的影响力受到限制的原因很简单，因为这些地区通常都在中原族裔或[GetTrait('kueijin').GetName( GetNullCharacter )]的控制之下，这些生物很容易发现西方吸血鬼插手他们的事务。\n#N 该事件源于你的侵入达到了最大嫌疑！#!"
 POD_talmahera.15.a: "一点小挫折。"
 POD_talmahera.15.a.tt: "中原族裔在未来#V 20#!年内无法被渗透。"