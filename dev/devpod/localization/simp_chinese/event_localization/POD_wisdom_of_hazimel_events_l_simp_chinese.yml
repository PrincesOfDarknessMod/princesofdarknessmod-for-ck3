l_simp_chinese:
 POD_hazimel_wisdom.001.t: "寻找智慧"
 POD_hazimel_wisdom.001.desc: "伟大的哈济梅尔为他的智慧付出了代价：他的眼睛。直到今晚，他的事迹仍被一些雷伏诺追随，因为没有人能不做出牺牲而成就伟大。\n并不是每个血族都愿意牺牲他们永生躯体的一部分来获得知识。你不像其他人，你已经准备好了。只有勇敢者才能获得永恒的智慧，但你是否强大到可以做出不能回头的牺牲？"
 POD_hazimel_wisdom.001.option.a: "我将追随哈济梅尔所做。用一只眼睛来换取知识"
 POD_hazimel_wisdom.001.option.a.tt: "你将失去你的眼睛，并且你无法将其治愈回来"
 POD_hazimel_wisdom.001.option.b: "我的腿无法跟我将获得的知识相比！"
 POD_hazimel_wisdom.001.option.b.tt: "你将失去你的腿，并且你无法将其治愈回来"
 POD_hazimel_wisdom.001.option.c: "我……我还没准备好"
 POD_hazimel_wisdom.001.option.c.tt: "你将放弃你对智慧的追求"