l_simp_chinese:
 stress_threshold.3311.t: "精神崩溃：心兽获胜"
 stress_threshold.3311.desc: "经过数个世纪的争斗，心兽终于接管了一切。你曾试图遵循一条心路，坚持崇高的思想，控制自己，击退心兽。\n但你失败了。\n随着你对心路的坚持被废除，你的意志力被粉碎，没有什么能阻止心兽。#beast 你不能阻止我。你！是！我！的！了！#!"
 stress_threshold.3311.desc_instinct: "经过数个世纪的争斗，心兽终于淹过了你。你曾试图遵循一条心路，保持着一种雄心勃勃的想法，既控制心兽，驾驭它的力量，同时保留你的个性。\n但你失败了。\n随着你对这条心路的坚持被废除，你的意志力被粉碎，血狂的浪潮将永远淹没你。#beast 你想利用我？驾役我？弱者，我将向你展示我的力量。#!"
 stress_threshold.3311.a: "我迷失了。"
 stress_threshold.3321.t: "精神崩溃：入魔"
 stress_threshold.3321.desc: "在所有状态中，入魔状态是最可怕的，在此状态下角色的心魔完全掌控了其的躯体。当触发入魔时角色的内心陷入剧烈的天人交战，\n若失败，心魔将完全占据上风。严重的入魔状况甚至会导致角色从[Glossary('心法','podgloss.dharma')]上偏移滑落，沦为最低级的魑魅，或更糟。"
 stress_threshold.3321.a: "我迷失了。"
 stress_threshold.2361.t: "精神崩溃：走火"
 stress_threshold.2361.desc: "走火即是狂乱，纯粹又简单。处于走火状态的[GetTrait('kueijin').GetName( GetNullCharacter )]是野蛮的怪物，被愤怒所吞噬。无知的该隐人将这称为“血狂”，这两种状态之间有着微妙的区别。"
 stress_threshold.2361.a: "屈服于狂暴。"
 stress_threshold.2361.b: "动用你所有的阴气来抵制。"
 stress_threshold.2361.fight.failed: "你失败了。"
 stress_threshold.2371.t: "精神崩溃：骇浪"
 stress_threshold.2371.desc: "遭受骇浪的[GetTrait('kueijin').GetName( GetNullCharacter )]完全失去对惧怕冲动的控制。这种状态（名字来自于被其控制的[GetTrait('kueijin').GetName( GetNullCharacter )]像是被连绵不断的恐惧波浪所冲击）被[Glossary('饿殍','game_concept_kuei_jin_desc')]认为是非常可耻的，他们试图不惜一切代价避免这种状态，特别是在他们的同伴面前。"
 stress_threshold.2371.a: "屈服于恐惧。"
 stress_threshold.2371.b: "动用所有的阳气来抵制。"
 stress_threshold.2371.fight.failed: "你失败了。"
 stress_threshold.1742.t: "精神崩溃：暴徒附身"
 stress_threshold.1742.desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]在转生时也许是为了充当特定的角色或是完成特殊的使命，暴徒则无此类束缚。\n此类心魔于轮回全无益处，它无视天庭和地狱的存在，只会驱使[GetTrait('kueijin').GetName( GetNullCharacter )]进行混乱无序的自毁行动来自我满足，暴徒的终极目的是摧毁轮回的存在，这是出于被遣返回阳间的愤怒，这也让它把愤怒播撒向一切目标——任何代表秩序的象征——来发泄自己不熄的怒火。"
 stress_threshold.1742.a: "我心不宁。"
 stress_threshold.1743.t: "精神崩溃：蛮夷附身"
 stress_threshold.1743.desc: "蛮夷拒绝受[GetTrait('kueijin').GetName( GetNullCharacter )]的传统束缚，并尝试用混沌无序的方式取代所有的秩序。\n蛮夷对西方血族的相对自由和腐化堕落无比羡慕，他嗤笑心神对责任的奉献和传统的尊重，并会尝试在所有地方对比震旦和西方的优劣，无需多言，就它的观点，西方的月亮永远更圆。"
 stress_threshold.1743.a: "我心不宁。"
 stress_threshold.1744.t: "精神崩溃：骗徒附身"
 stress_threshold.1744.desc: "骗徒对真相，好坏漠不关心，他单纯为了撒谎而撒谎——他向心神撒谎，用虚假的伪装把心神推向疯狂的边缘。\n非常讽刺的是，骗徒本身并无单纯的目的，他只是为了让[GetTrait('kueijin').GetName( GetNullCharacter )]陷入混乱，使得其连自己都不能相信自己，随着心神被骗徒欺骗的次数增多，心神将对真相漠视，无法相信自身的判断，到最后，心神将无法做出任何决定，只能被骗徒的甜蜜谎言引导走向崩溃。"
 stress_threshold.1744.a: "我心不宁。"
 stress_threshold.1745.t: "精神崩溃：邪魔附身"
 stress_threshold.1745.desc: "邪魔贪婪的渴求一切，所有比[GetTrait('kueijin').GetName( GetNullCharacter )]弱小的生物都是猎物，而一切更强的力量都可以通过背叛的手段来获取。尽管邪魔嘴上说着要履行职责，重视友情，彰显荣誉，但邪魔本质上只重视他自己。\n从西方社会的观点来看，邪魔是不折不扣的反社会分子，当然邪魔本人对此不屑一顾，对邪魔本人而言，世间的一切都是他取乐消遣的对象，发泄暴虐欲望的玩具，可供吞食的猎物，具体的定位完全取决于他一时兴起。心神对他而言也不过是可吞噬的对象罢了。"
 stress_threshold.1745.a: "我心不宁。"
 stress_threshold.1746.t: "精神崩溃：愚人附身"
 stress_threshold.1746.desc: "心神的存在对愚人来说完全不可理解。任何简单的行为甚至是本能举止都会要求解释说明，除此以外，愚人不适于任何长期或者稳定的合作计划，[GetTrait('kueijin').GetName( GetNullCharacter )]因此无法用任何轻松简单的方式来回避不必要的困难。\n愚人式心魔会持续喋喋不休，这无止休的呓语能把最有自制力的心神给逼疯。"
 stress_threshold.1746.a: "我心不宁。"
 stress_threshold.1747.t: "精神崩溃：官僚附身"
 stress_threshold.1747.desc: "官僚对一切违背天庭戒律的事物毫无容忍怜悯。没有任何解释和注解的余地，所有事物都有其定规所在，且绝不可逾越。\n[GetTrait('kueijin').GetName( GetNullCharacter )]的一切逾矩行径——不论是和上级没大没小的说话还是不服从命令的下级——都会让官僚无比抓狂，除非此类“冒犯”被及时纠正，至于纠正的标准和赔偿的量度完全取决于心魔自身的好恶而非[GetTrait('kueijin').GetName( GetNullCharacter )]自身的考量。如此一来，心神将被禁锢在无比拘束处处碰壁的环境之中。"
 stress_threshold.1747.a: "我心不宁。"
 stress_threshold.1748.t: "精神崩溃：心猿附身"
 stress_threshold.1748.desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]是为了特定的目的于中原转生，心猿对此不屑一顾。顽猴永远活在当下，新鲜的享受和值得分心的事项永远是最重要的，某些精心策划的短途目标也许不在话下，长远的规划？想都别想。心猿尝试在每个契机把震旦族裔从他的既定目标上岔开，转移他的注意力，浪费他的精力，让一切虚掷荒渡。"
 stress_threshold.1748.a: "我心不宁。"
 stress_threshold.1749.t: "精神崩溃：囚徒附身"
 stress_threshold.1749.desc: "囚徒对[GetTrait('kueijin').GetName( GetNullCharacter )]的一切判断都不抱信任，他会尝试利用一切机会贬低[GetTrait('kueijin').GetName( GetNullCharacter )]，让其处于他人的控制之下，如此一来[GetTrait('kueijin').GetName( GetNullCharacter )]将不能胜任任何工作。此外囚徒会质疑心神做的一切举动，并迫使鬼人屈服于心魔的支配。\n不出意外的，如果心魔压倒了心神，他会驱动[GetTrait('kueijin').GetName( GetNullCharacter )]去找一个所谓的“主人”来指导命令自己。囚徒的终极目的是服从于[Glossary('阎魔王','podgloss.yamaking')]，具有囚徒式心魔的中原族裔常常会堕落成为真正的[akuma|E]。"
 stress_threshold.1749.a: "我心不宁。"
 stress_threshold.3331.t: "精神崩溃：失去赐福"
 stress_threshold.3331.desc: "玛阿特之路很难遵行，并不是所有的重生者都能走完。如果一位木乃伊失去恩典，会出现两种可能。第一种可能是，玛阿特的判官认为木乃伊不值得永生。他们把木乃伊的灵魂投给阿米玛特，木乃伊就这样无了。第二种可能，也是木乃伊想继续存在的唯一机会，就是阿蒙提抛弃奥西里斯和玛阿特，同意向$glossary_wyrm_apophis$效忠。"
 stress_threshold.3331.a: "我接受您的判决。"
 stress_threshold.3331.b: "巨蛇救我！"
 stress_threshold.3341.t: "精神崩溃：怨灵诞生"
 stress_threshold.3341.desc: "在特别暴力的情况下死亡的凡人或被黯影掌控的死灵会“重生”为怨灵。这不仅仅是一个简单的物理转变。个人的个性和心理构成，以及她的身体形态，都会被溶解，并以来自[UmbraGlossary('oblivion')]之物重建。具体情况因怨灵而异——有些人看上去是个怪物，他们的[Corpus|E]被烫伤、扭曲，被拉伸成行走的噩梦，而其他人除了死亡的证据被永久烙印在他们身上外，似乎没有什么不同——但都带有明确无误的湮灭印记。"
 stress_threshold.3341.a: "我迷失了。"
 stress_threshold.3341.b: "你掌控不了我！"
 stress_threshold.3341.tooltip: "这个选项可用是因为你拥有[GetPerk( 'defiance_perk' ).GetName( GetPlayer )][perk|E]"
 stress_threshold.3351.t: "精神崩溃：自耗"
 stress_threshold.3351.desc: "圣经指出，原罪的代价是死亡，受诅者知道这是真的。每天黎明时分，承受大量磨难的恶魔和魔奴都会受到致命的伤害。这些伤害的实际表现在受诅者中各不相同，尽管它往往与角色的原罪相关，并不可避免地导致戏剧性的可怕死亡。愤怒可能会像火焰一样燃烧，直到角色自燃。嫉妒可能会以毒药甚至酸液的形式达到类似的目的。暴食往往会吞噬肉体，把身体吃成一个枯萎的躯壳。傲慢也许会采取圣痕的形式来嘲弄基督的牺牲。"
 stress_threshold.3351.a: "呃……！"
 stress_threshold.3361.t: "精神崩溃：失衡"
 stress_threshold.3361.desc: "所有的妖精都对迷雾和魔网，混乱和秩序，魔力潜能和魔力运用具有有限的控制能力。然而，对于一个个体的妖精来说，保持这两股力量的平衡至关重要。如果其中一方超越了另一方，妖精就可能变得迷失（迷雾过多）或禁锢（魔网过多）。如果这两种状态不受控制，就可能意味着妖精的终结，使他要么完全从世界中消失，要么变得过于执着于物质和可预测的事物，失去与迷雾的联系，实际上成为了人类。"
 stress_threshold.3361.a: "呃……！"
 stress_threshold.3362.t: "精神崩溃：抹煞"
 stress_threshold.3362.desc: "板讷可以完全击溃一位换生灵，让他和自己的妖精本质彻底剥离，抹去他的关于妖精的一切记忆，以及和[UmbraGlossary('dreaming')]的联系。当这种事情发生时，换生灵会慢慢遗忘一切事情，只记得自己是个凡人。他的妖精本相会黯淡失色，其他换生灵好不容易才能辨认出他也是戚族的一员。这种灾难被称为“抹煞”，因为它瓦解了换生灵身上一切阿卡迪亚的元素，只剩下一副肉身凡胎和空洞的灵魂。"
 stress_threshold.3362.a: "呃……！"