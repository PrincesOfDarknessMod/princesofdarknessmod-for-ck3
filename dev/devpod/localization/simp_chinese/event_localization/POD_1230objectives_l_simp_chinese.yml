 year_black_kites_japan_decision: "黑鸢之年"
 year_black_kites_japan_decision_tooltip: "是时候正式分裂了。"
 year_black_kites_japan_decision_desc: "虽然名义上涵盖朝鲜和日本，但青龙皇朝早已在海外失去影响力。若日本要作为独立的政治力量崛起，就必须将这一分裂正式化。"
 year_black_kites_japan_decision_confirm: "你已无利用价值。"
 year_black_kites_japan_custom_decision: "年份必须至少为#V 1242#!年。"
 year_black_kites_japan_custom_decision2: "[GetTitleByKey('e_goryeo').GetNameNoTier]在日本不得拥有任何领地。"
 year_black_kites_japan_decision_effect: "日本将成为独立帝国，并解锁新目标。"
 pod1230objectives.177.desc: "当正统（亲华派）[Glossary('心法','podgloss.dharma')]传入列岛时，青龙皇朝被确立为统治日本与朝鲜的朝廷。自此，日本影响力与日俱增，甚至一度成为皇朝核心，这引发了仍视日本为需要管教的\"顽劣小弟\"的大陆势力不满。\n随着大陆诸朝廷的衰落与日本势力的巩固，分裂早已是时间问题。今夜终成定局，震怒的中原与朝鲜$pod_kueijin$除了咒骂与虚张声势的报复威胁外束手无策。\n青龙皇朝就此终结，宇治朝廷作为东亚夜政格局的新角逐者登上舞台。\n\n作为宣布分裂的统治者，你需处理善后事宜，应对那些仍滞留日本、效忠中朝的小氏族。\n部分氏族主张和平分离，只要遵守新规便允许其去留自便；而更激进的派系则要求严惩，没收其资产并武力驱逐出境。"
 pod1230objectives.177.a: "我们将宽宏大量。"
 pod1230objectives.177.b: "滚！"
 peaceful_year_black_kites_modifier: "和平的黑鸢之年"
 aggressive_year_black_kites_modifier: "敌意的黑鸢之年"
 pod1230objectives.178.desc: "当正统（亲华派）[Glossary('心法','podgloss.dharma')]传入列岛时，青龙皇朝被确立为统治日本与朝鲜的朝廷。自此，日本影响力与日俱增，甚至一度成为皇朝核心，这引发了仍视日本为需要管教的\"顽劣小弟\"的大陆势力不满。\n随着大陆诸朝廷的衰落与日本势力的巩固，分裂早已是时间问题。今夜终成定局，震怒的中原与朝鲜$pod_kueijin$除了咒骂与虚张声势的报复威胁外束手无策。\n青龙皇朝就此终结，宇治朝廷作为东亚夜政格局的新角逐者登上舞台。"
 pod1230objectives.178.a: "时代更迭的征兆。"
 pod1230objectives.351.title: "新月治下之地"
 pod1230objectives.351.desc: "长期以来，伊斯兰的土地一直受到各种敌人的攻击。崇魔者、异教徒、恶魔、狼人以及许多其他生物曾在这片土地上肆虐，但现在不会了。现在，这片纯洁的土地可以发展，成为我们信仰真正的家园。尽管许多凡人尚未意识到这一发展，但他们会注意到这种变化。\n\n[Glossary('阿什拉派','game_concept_ashirra_desc')]的力量现在无与伦比。他们的信仰坚定不移。他们的精神坚不可摧。许多人现在渴望和平，而另一些人则建议将信仰传播到圣地之外。他们现在都看着你，准备好追随你选择的任何道路"
 pod1230objectives.351.a: "愿吾等之信念永不倾颓。"
 pod1230objectives.352.title: "伊斯兰之剑"
 pod1230objectives.352.desc: "苏莱曼与哈立德多年前关于阿什拉地位的争执，催生了牧人组织的诞生。如今世人皆明，仅凭祈祷不足以护教。将伊斯兰领导权交予那些妄称通晓先知真意的凡俗之辈，实属荒谬。我们许多人曾与先知并肩而行，唯吾辈方能守护其训谕不受玷污。\n\n吾等立场现已昭示阿什拉全众：我们将以剑捍卫伊斯兰。我们曾见证起源。"
 pod1230objectives.352.a: "而我们终将见证终局。"
 pod1230objectives.256.flight: "飞翔——翱翔于九天之上。"
 pod1230objectives.256.kai: "凯术。磨砺意志。"
 dominant_uji_decision: "主导宇治"
 dominant_uji_decision_tooltip: "我们必须领导日本的新时代。"
 dominant_uji_decision_desc: "每个日本的宇治（氏族）都有不同的专长。因此，若要凌驾于其他氏族之上，他们必须首先证明自己氏族氏族氏族是各自技艺的大师。"
 dominant_uji_decision_confirm: "带领日本走向辉煌！"
 rising_sun_japan_decision: "旭日初升"
 rising_sun_japan_decision_tooltip: "日本的崛起不容置疑。"
 rising_sun_japan_decision_desc: "随着日本现在摆脱了青龙皇朝，是时候让相互竞争的家族臣服于一位统治者了。只有这样，我们才能作为亚洲的主要皇朝而受到重视。"
 rising_sun_japan_decision_confirm: "我们的崛起从现在开始。"
 rising_sun_japan_decision_effect: "宇治将升格为霸权级头衔，其涵盖范围将根据你的选择扩展至其他帝国。"
 pod1230objectives.179.desc: "随着青龙皇朝正式解体，多数人预测日本迟早会陷入内战。正如预言所示，岛上的众多氏族和外来势力迅速磨砺了他们的（字面或象征意义上的）刀锋，意图在新成立的宇治皇朝中登顶。\n\n令人意外的是，统一的速度如此之快，这令大陆的皇朝感到担忧。日本如今正宣告他的野心，不再甘于被视为“小弟”。\n\n亚洲皇朝的统一，会由日出之国实现吗？"
 pod1230objectives.179.a: "玄武需要我们的指引。"
 pod1230objectives.179.b: "一条日本的青龙？"
 pod1230objectives.180.a: "我们必须将目光投向东方。"
 death_wang_hongben_decision: "合久必分……"
 death_wang_hongben_decision_tooltip: "在稳定繁荣的黄帝皇朝中，能出什么差错呢？"
 death_wang_hongben_decision_desc: "黄帝皇朝看似稳定繁荣，对边境的小威胁毫不在意。但空气中弥漫着一种预感，似乎某种重大事件即将来临……"
 death_wang_hongben_decision_confirm: "……必须分裂"
 death_wang_hongben_decision_effect: "鬼知道？"
 death_wang_hongben_decision_custom_decision: "1240年被预言为关键之年。"
 pod1230objectives.182.t: "崩溃"
 pod1230objectives.182.desc.wang: "无人真正知晓是谁袭击了[GetScriptedCharacterByHistoryID('795039').GetFirstName]。有人说是心怀不满的武伴，有人说是[akuma|E]或敌对朝廷的密探。但他的死揭示了[GetTitleByKey('h_china').GetNameNoTier]的极度脆弱。\n他的[Glossary('屋室','podgloss.wu')]金玉社将朝廷撕裂，彼此争斗。失去中央权威后，各地冲突爆发，本就近乎独立的地方朝廷如今拒绝听从长安的号令。在北方的[Glossary('安答','podgloss.anda')]们原本等待时机追随蒙古凡人的脚步，如今看到大门已然敞开。\n\n中原皇朝的陨落将漫长而血腥。"
 pod1230objectives.182.desc.notwang: "[GetTitleByKey('h_china').GetNameNoTier]曾被视为稳定朝廷的典范，结果却不过是沙堡一座。尽管王宏本被夺权（或许正因如此），局势反而更加恶化。\n王的旧臣金玉社将朝廷撕裂，内斗不休。失去受人尊敬的中央权威后，各地冲突频发，本就近乎独立的地方朝廷如今拒绝听从长安的号令。在北方的[Glossary('安答','podgloss.anda')]们原本等待时机追随凡人蒙古同族的脚步，如今看到大门已然敞开。\n中原皇朝的陨落将漫长而血腥。"
 pod1230objectives.182.b: "关于我死讯的传言太过夸张。"
 pod1230objectives.182.a: "历史再次重演……"
 pod1230objectives.182.tt: "身为玩家，我们不会直接置你于死地（我们没那么残忍）。但崩溃仍会发生，毕竟这是中国区剧情线不可或缺的环节。"
 pod1230objectives.183.a: "中央支柱未能维系。"
 pod1230objectives.183.b: "我们上！"
 pod1230objectives.183.tt: "黄帝皇朝已崩溃。[Glossary('安答','podgloss.anda')]部族趁势进攻虚弱的中原皇朝。"
 quincunx_formation_decision: "群龙大会"
 quincunx_formation_decision_tooltip: "若中国要再度统一，诸朝廷必须联合。"
 quincunx_formation_decision_desc: "黄帝皇朝的陨落预示着中国的动荡时代。我们必须先驱逐入侵者，再合力重建统一的皇朝。"
 quincunx_formation_decision_confirm: "统一近在咫尺。"
 quincunx_formation_decision_custom_decision: "[GetDynastyHouseByID('house_anda').GetName]家族成员不得在[GetGeographicalRegion('world_asia_china').GetName]拥有任何领地。"
 quincunx_formation_decision_custom_decision2: "中国的五个皇朝（血、粦、骨、肉、玉皇朝）必须要么尚未建立，要么在你的控制之下，要么由对你友好（50+好感度）的角色持有。"
 quincunx_formation_decision_effect: "动荡已成过往。"
 quincunx_offensive_modifier: "五行宗攻势"
 quincunx_offensive_modifier_desc: "该修正使你能免费发动附庸战争。"
 quincunx_consolidation_modifier: "五行宗整合"
 quincunx_consolidation_modifier_desc: "该修正使你在针对$pod_kueijin$时，附庸接受度固定#P +25#!。"
 pod1230objectives.184.desc: "在旁观者眼中，黄帝皇朝的衰落或许像是对中国皇朝体系霸权的致命一击。但对悟道者而言，这只是轮回的又一次转动。这段时期虽被铭记为夜之中国的艰难岁月，但它终将如起始般结束——由一统的皇朝再度主宰一切。\n\n促成这一局面的，是一场被称为“群龙大会”的事件。该会议汇聚了该地区最具政治实力的皇朝，在安答威胁被遏制后，老祖们得以正式成立名为“五行宗”的新组织。其职能虽比黄帝皇朝更偏向监督，但有望引领各皇朝开展强大而统一的行动。\n他们的首要任务，已交予首位五行宗老祖执掌。"
 pod1230objectives.184.a: "必须让朝鲜重归皇朝治下。"
 pod1230objectives.184.b: "我们必须巩固边疆。"
 pod1230objectives.184.c: "五行宗的宏愿是统一所有$pod_kueijin$"
 pod1230objectives.185.a: "回到原点。"
 year_black_kites_korea_decision: "黑鸢之年"
 year_black_kites_korea_decision_tooltip: "必须约束日本。"
 year_black_kites_korea_decision_desc: "尽管青龙皇朝名义上统辖朝鲜与日本，但其势力早已萎缩至本土以外。若再不行动，分裂将成定局。"
 year_black_kites_korea_decision_confirm: "分裂终结。"
 year_black_kites_korea_custom_decision: "日本将于1242年正式分裂。但若届时满足本决议条件，青龙皇朝将阻止其独立。"
 year_black_kites_korea_custom_decision2: "[GetTitleByKey('e_goryeo').GetNameNoTier]必须在[GetGeographicalRegion('world_asia_japan').GetName]拥有领地。"
 year_black_kites_korea_decision_effect: "将解锁新目标，内容取决于日本是否已从本土分离。"
 pod1230objectives.186.desc: "很久以前，当正统（且与中国结盟）的心法传播到日本列岛时，青龙皇朝被确立为日本和朝鲜的统治皇朝。自那时起，日本的影响力不断增长，有时甚至成为皇朝的中心。这导致与中国大陆的摩擦，大陆仍将日本视为需要引导的\"小弟\"。\n尽管大陆皇朝的衰落让许多人预期日本会走上独立道路，但青龙皇朝的意外复兴阻止了这一趋势。虽然固执的日本宇治远未被驯服，但他们至少接受了命运仍与主要皇朝相连的事实。\n朝鲜将如何应对这一意外的政治势头，仍有待观察。"
 pod1230objectives.186.a: "如其所应是，合而为一。"
 azure_dragon_consolidation_modifier: "青龙皇朝统一"
 azure_dragon_consolidation_modifier_desc: "该修正使你在针对日本和朝鲜的$pod_kueijin$时，获得#P +25#!的附庸接受度加成。"
 pod1230objectives.187.a: "此龙已觉醒。"
 new_seat_heaven_decision: "新天朝"
 new_seat_heaven_decision_tooltip: "青阳初升。"
 new_seat_heaven_decision_desc: "当各皇朝陷入动荡之际，朝鲜与青龙皇朝必须通过在其传统疆域实现统一与繁荣来证明其统治的合法性。届时，亚洲世界的中心或许将从黄转青……"
 new_seat_heaven_decision_confirm: "玉皇陛下龙颜大悦。"
 new_seat_heaven_custom_decision: "你的[duchy|E]及以上级别封臣对你的好感度均需达到#P 25#!以上。"
 new_seat_heaven_decision_effect: "青龙皇朝将包含新的法理领土，并升级为霸权级别。"
 pod1230objectives.188.desc: "朝鲜历来被视为天朝的中立交汇处，是更具政治实力的皇朝之间的缓冲地带。随着日本崛起及其（历经波折但最终被接受的）正式回归青龙皇朝，该地区的声望达到了新高度。\n当传统上更具影响力的黄帝皇朝与玄武皇朝在内忧外患下萎缩衰败时，许多人将青龙的崛起视为时代更迭的标志。\n凭借日益增长的政治资本，以朝鲜为中心的新霸权组织正式吞并邻近的玄武皇朝只是时间问题。然而中国及其黄帝皇朝则是另一回事，因为千年的主导地位不可能瞬间消弭。\n青龙皇朝必须运用其新获得的软实力，让饱经世故的中国老祖们接受这一剧变。"
 pod1230objectives.188.a: "我们需暂时内省。"
 pod1230objectives.188.b: "黄天已死。"
 pod1230objectives.189.a: "十字路口今成中枢。"
 green_crossroads_decision: "翠绿枢纽"
 green_crossroads_decision_tooltip: "繁荣本身就是回报。"
 green_crossroads_decision_desc: "青龙皇朝的衰落削弱了朝鲜的政治影响力。但领土扩张并非获取影响力的唯一途径。\n朝鲜地处其他皇朝的重要交汇处，并坐拥东亚最重要的灵玉矿藏。这些资产可资利用。"
 green_crossroads_decision_confirm: "碧玉为胜利之色。"
 green_crossroads_decision_effect: "朝鲜境内的数个伯爵领（包括你的首都）将获得[GetModifier('jade_trade_modifier').GetNameWithTooltip]修正，提供各类与发展度相关的加成。"
 pod1230objectives.190.desc: "虽然青龙皇朝的崩溃打击了朝鲜的政治野心，但影响力可来自多方。坐拥亚洲最重要的灵玉矿藏，地处三大皇朝交汇处，朝鲜历来是中立要地与贸易中心。\n凭借这一得天独厚的位置，新成立的翠绿皇朝实至名归。灵玉流向异域皇朝，黄金流入朝鲜老祖的库房。\n有人质疑这日益增长的繁荣是否会再度激发翠绿皇朝的政治野心，抑或黄金与碧玉将成为朝鲜夜行者们未来的唯一追求。"
 pod1230objectives.190.a: "灵玉必须流通！"
 pod1230objectives.191.a: "以金钱铺就升华之路？"
 thriving_in_chaos_decision: "浑中求进"
 thriving_in_chaos_decision_tooltip: "混乱是阶梯，是时候将它从他人脚下抽走。"
 thriving_in_chaos_decision_desc: "朱雀皇朝的衰落导致权力真空。该地区政治的爆炸性意味着，唯有新势力上位方能恢复稳定。"
 thriving_in_chaos_decision_confirm: "赤金之胜。"
 thriving_in_chaos_decision_effect: "你需在征服与整合道路间抉择，并解锁下一目标。"
 scarlet_phoenix_consolidation_modifier: "朱雀皇朝统一"
 scarlet_phoenix_consolidation_modifier_desc: "此修正项使你在针对东南亚角色时，获得#P +25#!的附庸接受度加成。"
 scarlet_consolidation_house_modifier: "朱雀皇朝统一"
 scarlet_consolidation_house_modifier_desc: "此家族在东南亚拥有强大政治影响力，专精于巩固这一权力基础。"
 golden_courts_birth_modifier: "黄金皇朝创立者"
 golden_courts_birth_modifier_desc: "此家族创立了血腥残暴的黄金皇朝，成为无情战争的大师。"
 golden_courts_birth_tt: "后续目标将更侧重于征服。"
 scarlet_phoenix_consolidation_tt: "后续目标将更侧重于内政。"
 pod1230objectives.192.desc: "朱雀皇朝曾是以阳为核心的心法繁荣中心，但长期处于急剧衰落状态，甚至沦落至被诟病为[akuma|E]横行、崇魔者肆虐的魔窟，迫使中国黄帝皇朝考虑干预——而他们最终按兵不动，主要源于自身的怠惰。\n整合该地区将使潜在统治者面临抉择。重拾朱雀衣钵将走内向发展之路（尽管该地区某些暴力心法未必意味着和平）。另一条道路则是摒弃这一传统，建立全新秩序，更可能专注于征服（很可能包括清洗）该地区其余部分，甚至未来进一步扩张。"
 pod1230objectives.192.a: "凤凰涅槃。"
 pod1230objectives.192.b: "鲜血将为我们的黄金之路奠基。"
 pod1230objectives.193.a: "丛林深处传来低吼……"
 phoenix_rise_decision: "凤凰涅槃。"
 phoenix_rise_decision_tooltip: "朱雀皇朝的黄金时代仍在前方。"
 phoenix_rise_decision_desc: "随着朱雀皇朝再次归于统一，是时候专注于内政发展，重振北方诸朝的艳羡。"
 phoenix_rise_decision_confirm: "凤凰耀世之翔。"
 phoenix_rise_decision_effect: "你将获得一个强力修正，所有直辖省份增加一个建筑槽位，且廷臣能力提升。"
 phoenix_rise_custom_decision: "所有强力封臣对你的好感度至少为#P 50#!。"
 pod1230objectives.194.desc: "在新任领袖的带领下，朱雀皇朝再度成为南方血族繁荣的中心。尽管北方人或许仍对邻邦嗤之以鼻，但他们此刻也不得不承认——这个重焕生机的皇朝内部蕴藏着何等可怖的力量。\n团结一心的南方朱雀们，凭借治下蓬勃发展的凡人人口，骄傲地夺回了作为主要皇朝的地位。甚至有人胆敢低语：或许已是\"唯一\"的主要皇朝。"
 pod1230objectives.194.a: "朱凰的凯旋。"
 pod1230objectives.195.a: "丛林明珠。"
 bloody_gold_decision: "血金王朝"
 bloody_gold_decision_tooltip: "在鲜血与杀戮中诞生的新皇朝。"
 bloody_gold_decision_desc: "自朱雀皇朝陨落的混乱中诞生的黄金皇朝，骨子里便浸透着血腥与暴力。随着其势力扩张，其他皇朝无不因这种残酷而崭新的飞升之道战栗。"
 bloody_gold_decision_confirm: "那就以暴力登天。"
 bloody_gold_decision_effect: "你将获得两件强力宝物，并解锁入侵战争借口。"
 bloody_gold_decision_tt: "你需拥有至少10名勇武35以上的骑士。"
 POD_invasion_war_modifier: "铁血征服者"
 POD_invasion_war_modifier_desc: "此修正允许使用入侵战争借口。"
 pod1230objectives.196.desc: "当某些人为南方皇朝填补朱雀陨落后的权力真空而松口气时，更多人则恐惧于新统治者推行的血腥之道。昔日的朱凰虽因崇尚阳气而桀骜不驯，但至少还试图维持体面。而新生的黄金皇朝则全然不顾这些。\n出人意料的是，这种激进扩张并未如预期般阻碍飞升修行。相反，黄金朝臣们似乎从征伐中宣泄的纯粹阳气里获得了力量，彻底摒弃了传统的中庸之道。\n\n当黄金皇朝继续其征服之路时，世人不禁怀疑：一条通往天庭的崭新道路是否正在眼前铺就？一条不容妥协、没有中间路线的血腥之路。"
 pod1230objectives.196.a: "畏惧赤金之辉吧！"
 pod1230objectives.197.a: "丛林已然觉醒。"
 bring_down_courts_decision: "魔皇先锋"
 bring_down_courts_decision_tooltip: "配得上轮回之主的登基盛景。"
 bring_down_courts_decision_desc: "[Glossary('魔皇','podgloss.demonemperor')]终将统治[Glossary('第六纪元','game_concept_sixth_age_desc')]。但若你能先行扫清障碍，必能让祂的降临更为顺遂……"
 bring_down_courts_decision_confirm: "地狱乐见的景象。"
 bring_down_courts_decision_effect: "将多数现存$pod_kueijin$转化为[akuma|E]。解锁所有[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]兵种，并获得入侵战争借口。"
 bring_down_courts_decision_tt: "不得存在非[akuma|E]的$pod_kueijin$帝国或霸权。"
 POD_yama_vanguard_modifier: "魔皇先锋"
 POD_yama_vanguard_modifier_desc: "此人已获所有[Glossary('阎魔王','podgloss.yamaking')]青睐，可随时调遣其精锐部队。"
 pod1230objectives.198.desc: "虽预言[Glossary('魔皇','podgloss.demonemperor')]将于[Glossary('第六纪元','game_concept_sixth_age_desc')]降临，但其爪牙早已为祂铺路。诚然，诸皇朝因堕落衰败而自取灭亡，但若忽视[akuma|E]们明里暗中的推波助澜，未免有失公允。\n如今诸皇朝分崩离析，$pod_kueijin$悲叹天庭已关，众生开始寻求新的救赎之道\n\n而这正是如日中天的[akuma|E]们迫不及待提供的\"捷径\"。"
 pod1230objectives.198.a: ".……而堕落之路漫长无涯。"
 pod1230objectives.199.a: "天庭之门已关。"
 pod1230objectives.198.tt: "众多[Glossary('万鬼','game_concept_kuei_jin_desc')]将皈依万嚎道。"
 enduring_tortoise_decision: "玄武永固"
 enduring_tortoise_decision_tooltip: "重振旗鼓之时。"
 enduring_tortoise_decision_desc: "玄武皇朝廷节节败退，众人皆谓其将被[Glossary('安答','podgloss.anda')]部族或[akuma|E]吞没。或许这场劫数尚有转机。"
 enduring_tortoise_decision_confirm: "慢而稳"
 enduring_tortoise_decision_effect: "玄武皇朝将升级为霸权头衔。你将获得入侵宣战借口。你的家族将获得[GetModifier('enduring_tortoise_modifier').GetNameWithTooltip]修正。"
 enduring_tortoise_modifier: "玄武永固"
 enduring_tortoise_modifier_desc: "历经濒死危机而不倒，此家族终令玄武重耀往昔荣光。"
 pod1230objectives.200.desc: "玄武皇朝素来在万仙朝廷中格格不入。因与草原的密切联系，它或被视作异类，或被斥为外敌同谋，至多获得勉强的尊重，更多时候则遭受赤裸敌意。\n当[Glossary('安答','podgloss.anda')]部族自西境进犯，[akuma|E]在内部滋事时，其他皇朝冷眼旁观，黄帝皇朝更趁其虚弱大举进攻。\n\n就在昏聩的领导者无力回天，玄武倾覆似成定局之际，上苍似乎仍未抛弃夏墟妖魔。经过全力反击，这个曾岌岌可危的皇朝不仅击退邻敌，更重建了草原霸权。\n\n但玄武皇朝从未忘却旧怨。对永生者而言，宿怨永不消散。此刻这个皇朝正发起新一轮征伐——或许是草原血脉使然——其兵锋已席卷华北大地。"
 pod1230objectives.200.a: "我们上！"
 pod1230objectives.201.a: "草原永不可驯服。"
 anda_steppes_decision: "东风骤起"
 anda_steppes_decision_tooltip: "成吉思汗已为我们指明道路。"
 anda_steppes_decision_desc: "夏朝妖魔是可怕的敌人，中原将是一块难啃的骨头。明智之举是先稳固与他们的边境。"
 anda_steppes_decision_confirm: "我们已兵临城下。"
 anda_steppes_decision_effect: "#N 如果最迟在1300年未能达成此目标，[Glossary('安答','podgloss.anda')]将失去势头并遭受重创！#!\n\n若按时完成，将解锁后续目标。获得[GetTrait('conqueror').GetName(GetNullCharacter)]特质（若尚未拥有）。获得入侵战争借口。"
 pod1230objectives.202.desc: "蒙古对中原的征服出乎所有人意料，包括其中的[Glossary('安达','podgloss.anda')]。多布鲁尔的子嗣并未急于追随凡人同族，而是采取了更为谨慎的策略。他们深知，在长城之外等待他们的，是比中原凡人军队更可怕的势力。\n[Glossary('安达','podgloss.anda')]通过武力或铁腕外交（以蒙古帝国的力量为筹码），逐步巩固了草原的统治。如今，他们已做好准备，将征服推向下一阶段。\n\n他们的势头正盛，而潜在的劲敌黄帝皇朝却因内部分裂而衰弱，似乎对北方的威胁浑然不觉。\n\n随着[Glossary('安达','podgloss.anda')]先锋对北方$pod_kueijin$皇朝的试探愈发频繁，这种无知不会持续太久。"
 pod1230objectives.204.t: "最后的可汗"
 pod1230objectives.204.desc: "[Glossary('安答','podgloss.anda')]部族的势头源于其崛起的迅猛与出其不意。蒙古帝国在不朽者眼中如昙花一现般达到巅峰，而其他势力直到后来才意识到危机可能降临自身。\n[Glossary('安答','podgloss.anda')]在初期成功利用了这一点，但或许因过于谨慎或遭遇意外抵抗，未能像蒙古人那样席卷世界。\n\n如今，邻国已意识到威胁并全力阻挠，[Glossary('安答','podgloss.anda')]逐渐回归本色，一个缺乏政治影响力的[GetTrait('gangrel').GetName(GetNullCharacter)]血系。\n不朽者的世界，似乎不会迎来可汗的时代了。"
 pod1230objectives.204.a: "我们耽搁太久了……"
 pod1230objectives.205.a: "无人能再驰骋天下。"
 anda_lost_momemtum_tt: "#N 由于[Glossary('安答','podgloss.anda')]未能及时达成其目标，其所有帝国级（或更高）的统治者将失去[GetTrait('conqueror').GetName(GetNullCharacter)]特质（如果曾拥有），并获得[GetModifier('broken_authority_modifier').GetNameWithTooltip]修正。。#!"
 anda_china_decision: "入主中原"
 anda_china_decision_tooltip: "破关南下。"
 anda_china_decision_desc: "我们已兵临城下，且对他们了如指掌。是时候追随蒙古同族的胜利脚步了！"
 anda_china_decision_confirm: "他们挡不住我们的铁骑！"
 anda_china_decision_effect: "#N 若最迟在1350年未能达成此目标，[Glossary('安答','podgloss.anda')]将失去势头并遭受重创！#!\n\n若按时完成，将解锁后续目标。获得[GetTrait('conqueror').GetName(GetNullCharacter)]特质（如果未拥有）。获得入侵战争借口。此外，还将从中原国库掠取大量黄金。"
 pod1230objectives.206.desc: "经过侦察与对$pod_kueijin$的深入了解，[Glossary('安达','podgloss.anda')]终于攻入中原。尽管他们的入侵不如蒙古那般显眼与惨烈，但对自“焚书”以来未遭外敌重创的中原不朽者而言，仍是灾难性的。\n[Glossary('安达','podgloss.anda')]的势头势不可挡，而中原一方却对入侵规模浑然不觉。战争初期，多布鲁尔的子嗣取得了压倒性胜利。\n\n但双方都清楚，战争尚未结束。中原疆域辽阔，幸存的老祖们如今已深知北方的真正威胁。"
 pod1230objectives.206.a: "中原将倾！"
 anda_final_decision: "安答之治"
 anda_final_decision_tooltip: "最后一役。"
 anda_final_decision_desc: "北伐之后，中原已元气大伤。但若轻视夏朝妖魔，必将铸成大错。我们必须乘胜追击，彻底终结他们！"
 anda_final_decision_confirm: "如成吉思汗所为！"
 anda_final_decision_effect: "#N 如果最迟在1400年未能达成此目标，安答将失去势头并遭受重创！#!\n\n如果按时完成，将解锁特殊教义与增益修正。获得[GetTrait('conqueror').GetName(GetNullCharacter)]特质（如果未拥有）。获得入侵战争借口。[Glossary('安答','podgloss.anda')]将升级为霸权头衔，疆域横跨罗斯至中原。"
 pod1230objectives.208.desc: "[Glossary('安达','podgloss.anda')]的胜利或许比蒙古凡人更为辉煌。他们先研敌、再伺机，一击而定；主管不死者初时轻敌，仓皇设防已晚。几个世纪前，[Glossary('安达','podgloss.anda')]他们还是一个年轻无名的血系，如今却颠覆了统治亚洲数千年的$pod_kueijin$霸权。有人认为这是纪元更迭（或火焚末日）的征兆，但更客观的观察者看来，这不过是锐意革新的年轻一代从因循守旧的老朽手中夺取权柄。\n\n而在不朽者的世界，没有什么比这更令人畏惧。\n\n无论如何，中原的夜晚已迎来新的主宰。[Glossary('安达','podgloss.anda')]会继续驰骋，还是安居这片富饶的土地？唯有他们自己知晓——因为整个世界，皆是他们的草原。"
 pod1230objectives.208.a: "母神伊图根为之自豪。"
 pod1230objectives.256.rift: "裂隙，撕裂维度"
 great_clan_victory_objective_decision: "妖邪之城崛起"
 great_clan_victory_objective_decision_tooltip: "一切终将明了。"
 great_clan_victory_objective_decision_desc: "我们梦想中的世界是平庸而乏味的，一切皆有定数。这才是真正的统治者所渴望的世界。通过粉碎和迷惑敌人，[Glossary('瓮星','podgloss.mikaboshi')]将使我凌驾于众生之上。"
 great_clan_victory_objective_decision_confirm: "恭迎魔皇降临。"
 great_clan_victory_objective_decision_effect_tooltip: "你将获得[GetTrait('conqueror').GetName(GetNullCharacter)]特质。[Glossary('瓮星','podgloss.mikaboshi')]将赐予你关于将赐予你地狱之力的知识。你的头衔将更名为“星穹秘会”。"
 pod1230objectives.210.desc: "这一刻早已酝酿多时。你伫立在[Glossary('瓮星','podgloss.mikaboshi')]塔的阳台上，能感受到身后的邪王正亲手为你铸就新冠。作为他的右手，这是你应得的。千百年来，从未有哪位魔王门徒能如你这般辉煌。诸皇朝已然分崩离析。曾为你大业宿敌的血族如今支离破碎，其领袖化为风中尘埃。在你面前，唯有零星残存的愚者仍在负隅顽抗。\n\n王冠落下，化为精粹与你交融。你注定非凡。此刻，你与[Glossary('瓮星','podgloss.mikaboshi')]几无二致。他冰冷的指尖轻抚你的下颌，你起身而立，成为新生的亵渎之半神。\n他仍渴望一个被资本与沉闷碾碎的世界。一个被平庸与机械劳作蹂躏至死的时代。他登临王座的道路已不可阻挡。\n而你将伴其左右，天下地上，为你独尊。"
 pod1230objectives.210.a: "理所应当，必将如此。"
 pod1230objectives.210.b: "当然，我的陛下。您的皇后别无他求。"
 blood_tribe_victory_objective_decision: "凡人不可称王, 邪魔妄自称神"
 blood_tribe_victory_objective_decision_tooltip: "利剑将予我自由。"
 blood_tribe_victory_objective_decision_desc: "我们曾被告知，世间存在着诸多致力于奴役与征服的团体，妄图践踏一切追求自由之人，而它们的降临亦早有预兆。我们必须建立一个由不朽者组成的同盟，誓不低头，永不臣服。唯有将敌人屠戮殆尽、驱散四方，伟业方能真正展开。"
 blood_tribe_victory_objective_decision_confirm: "目的一致……"
 blood_tribe_victory_objective_decision_effect_tooltip: "你将获得[GetTrait('conqueror').GetName(GetNullCharacter)]特质。你的信仰将新增强力教义。你的头衔将更名为血之公社。"
 pod1230objectives.211.desc: "自从风暴为血族的始祖加冕以来，这是你第一次感到如释重负。铁血暴君的先知已死。诸王庭的压迫陷入混乱。如今只剩下……你所谓的家人们。\n他们可不会安分守己地遵循众神的旨意。他们是战争的族群。与世界开战，与自身开战，与他们的最爱之人开战。血族自古以来便为挣脱枷锁而战，以革命搬的热忱与志气去克服心兽。\n而现在？现在，再没有任何东西能阻挡你。\n\n你起身开门，走向你的同伴们。他们看着你展开一卷卷地图与文书，上面描绘着你未来的的道途。\n你也看向他们，告诉他们，现在时候做出选择了。是就此离开，还是团结一致。众人默契地与你相视而笑。你掏出一把匕首，猛的刺入桌上的地图。\n\n你划开了西方。那是传说的所在。"
 pod1230objectives.211.a: "让我们向他们展示我们的实践之道。"
 pod1230objectives.211.b: "是时候让谦卑者继承这片土地了。"
 pod1230objectives.211.c: "不再浪费时间去乞求他人，我们自能取得所需。"
 kizoku_victory_objective_decision: "第七子崛起"
 kizoku_victory_objective_decision_tooltip: "从害虫到座上宾。"
 kizoku_victory_objective_decision_desc: "虽然日本宇治对你容忍，但远未尊重。若想在此立足，你必须展现力量与威望。"
 kizoku_victory_objective_decision_confirm: "尊重是赢得的，而非理所当然。"
 kizoku_victory_objective_decision_effect_tooltip: "你需在日本宇治中选择一位盟友，获得家族特质及其他奖励。"
 pod1230objectives.212.desc: "他们曾称你为“土蜘蛛”。\n\n在日本，他们始终视你族为害虫。虽不及暴君疯裔或风暴恶魔那般遭人憎恶，但仍被视为低等。\n\n今非昔比。\n\n权力出现真空，而你巧妙填补。你向他们的天皇与习俗示以尊重。当他人俯首被屠戮时，你昂首挺立。分裂之处，你强加秩序；混乱之地，你带来稳定。凡此种种，不胜枚举。\n\n宇治终将你视为己出，如今更争相示好。谁将成为你长夜中的盟友？"
 pod1230objectives.212.a: "宇治毗沙门"
 pod1230objectives.212.b: "宇治源氏"
 pod1230objectives.212.c: "宇治伊贺"
 pod1230objectives.212.d: "宇治越前。"
 pod1230objectives.212.e: "宇治平氏"
 anh_victory_objective_decision: "海疆之灾"
 anh_victory_objective_decision_tooltip: "若疆土渴求战争，便赐予战争"
 anh_victory_objective_decision_desc: "安赫作为海洋之主安然无虞，如今他们的岛屿正面临着全新且更具侵略性的威胁。让那些威胁者明白他们的错误吧。"
 anh_victory_objective_decision_confirm: "他们如今已成鱼饵。"
 anh_victory_objective_decision_effect_tooltip: "努桑塔拉将更名为血海。#ONCLICK:GEOGRAPHICAL_REGION,world_asia_philippines #TOOLTIP:GEOGRAPHICAL_REGION,world_asia_philippines #L 菲律宾#!#!#!地区的所有领地获得[GetModifier('POD_secure_seas_modifier').GetNameWithTooltip]修正。"
 anh_custom_decision: "[GetScriptedCharacterByHistoryID('791113').GetFirstName]必须死"
 POD_secure_seas_modifier: "海疆平定"
 POD_secure_seas_modifier_desc: "如今海域已牢牢掌控于你族之手，波涛化为城邦之友，再无反复无常之敌。"
 pod1230objectives.213.desc: "海洋在沸腾。\n\n我们已在这片海域徘徊许久，与深渊中的怪物搏杀，与鲨群争霸。然而最近，你与你的世系却被牵引至岸边，被迫回到陆地——因为那些妄图称王的征服者与幽魂女王，为了自己的私欲扰乱了你的图谋。\n如今，大地寂静。故土岛屿也已寂静。血肉恶魔支离破碎。幽灵吸血鬼亦灰飞烟灭，淡入他们曾经统治的虚无之中。你曾享受的旧秩序已不复存在。战争让海岸习惯了你的存在。而现在，随着所有道路向你敞开，你必须为所率领之众决定他们的命运。\n\n我们不再只是屠戮者。现在，我们筑造。我们统治。我们畅游。我们战斗。"
 pod1230objectives.213.a: "我们将成为海洋灾祸。"
 kuntilanak_victory_objective_decision: "魔物所惧"
 kuntilanak_victory_objective_decision_tooltip: "即便如此远离祂，祂的子嗣仍在猎杀我们。"
 kuntilanak_victory_objective_decision_desc: "正如雅斯米利亚德血脉的真正诅咒所示，昆蒂拉娜们被始祖的造物所猎杀。为求自保，她们必须精进学识，将亡灵术化为护身之盾。"
 kuntilanak_victory_objective_decision_confirm: "被死亡守护。"
 kuntilanak_victory_objective_decision_effect_tooltip: "你将用一个更强大的家族特质替换现有特质，该特质还会为你解锁新的兵种类型。"
 pod1230objectives.214.desc: "长久以来，昆蒂拉娜一直隐匿行踪。长久以来，那些被遗忘之地的恐怖之物始终在暗中窥视着你们。但即便如此，如今饮血之鬼的数量已遍布诸岛，与你们同样众多。死灵向你们预警猎手们的逼近，并在你们与同族逃离前先行袭击他们。而今，在你们力量的巅峰时刻，你们无需再躲藏。\n\n当那恐怖之物从井中升起时，井壁随之扭曲。猎手的嚎叫近在咫尺，却对等待它的厄运浑然不觉。你所召唤的永寂死灵认出了你掌控的力量，它舔舐着森森白骨构成的嘴唇，渴望着你赐予它的猎物。随着古井洞开，它从井中升起，无数怨灵与邪祟如洪流般涌出，扑向那些猎手。\n\n我们不再是猎物。如今，我们才是猎手。"
 pod1230objectives.214.a: "而死灵便是我们的猎犬。"
 sangun_victory_objective_decision: "熊王统御，永不屈膝"
 sangun_victory_objective_decision_tooltip: "我们是统治者，即便他们不以为然。"
 sangun_victory_objective_decision_desc: "朝鲜的“王者之氏族”仅统治着一片狭小的山区领地，常被更强大的邻邦所耻笑。这种情况必须改变。"
 sangun_victory_objective_decision_confirm: "他们现在还敢笑吗？"
 sangun_victory_objective_decision_effect_tooltip: "你将获得强力家族特质，并更容易附庸东亚角色。"
 sangun_victory_objective_decision_custom: "高丽帝国（又称青龙皇朝或翠绿皇朝）必须由你掌控或摧毁。"
 pod1230objectives.215.desc: "不久前，山君还被视作盘踞山间的无名小族——不过是些徒有虚名、扮演着可笑山大王的无名廷臣罢了。\n\n但你从未忘却。你的血脉中流淌着王之血液。\n\n你所建立的领域，是各血系前所未见的异数，其威势甚至让你曾经的统治者都不禁畏缩退却。你的诅咒不再是被嘲弄的标记，而是令人恐惧的象征。真正的王者，无需显形亦可统治。始祖的高贵血脉在你身上延续，一如其他氏族。\n你的地位如今不言自明。再无人能否认王者之氏族与生俱来的权柄——无论他们以何种形态显现。"
 pod1230objectives.215.a: "我们的工作才刚刚开始。"
 banpaia_victory_objective_decision: "东方金字塔"
 banpaia_victory_objective_decision_tooltip: "远离故土，而今自辟新乡。"
 banpaia_victory_objective_decision_desc: "一个远离塞奥里斯的睿魔尔远征队，在孤立无援的情况下能有何作为？若由你来定夺……他们的成就或许远超想象。"
 banpaia_victory_objective_decision_confirm: "向欧洲送出消息。"
 banpaia_victory_objective_decision_effect_tooltip: "你将面临选择：重归[GetTrait('tremere').GetName(GetNullCharacter)]氏族，或与之彻底决裂。"
 pod1230objectives.216.desc: "你思索着眼前蕴藏的种种可能。\n\n当班派亚初至日本时，并非以如今的名号示人。曾几何时，它不过是睿魔尔氏族众多东渡远征队中的一支——那些队伍不是肩负自杀式使命，就是执行勘探任务，最终皆以覆灭收场，唯有你们这支血脉幸存。\n被加贺瀬雄收留后，如今你已青出于蓝。[Glossary('瓮星','podgloss.mikaboshi')]的启悟为你带来了新的宿主，新的宫廷。若西方那些长老得知这一切，得知你的成就，得知以你为顶点构筑的全新金字塔——他们定会震惊不已。\n\n但此刻悬而未决的问题是：接下来何去何从？两条道路铺展眼前。其一是向西方复命，归附氏族以换取庞大家族的荫庇。\n以你立下的功业，跻身议会元老之位本是囊中之物……但你真的甘愿屈居人下吗？其二是另起炉灶，构筑更完美的金字塔。可若睿魔尔再度寻获你的踪迹，他们必将不惜代价将你抹杀，而登顶之路，注定孤身独行。\n\n抉择，抉择啊……"
 pod1230objectives.216.a: "支持的回报是巨大的。我将成为一位议员"
 pod1230objectives.216.b: "“仲裁至高无上。我等将永驻于此。”"
 ashen_grandmaster_kj_decision: "[ashen_grandmaster|E]"
 ashen_grandmaster_kj_decision_tooltip: "关于战争，总有更多可以学习的东西。"
 ashen_grandmaster_kj_decision_desc: "$pod_kueijin$在漫长的岁月中创造了多种多样的战争形式。你的游历正是学习并有望掌握这些罕见策略的良机。"
 ashen_grandmaster_kj_decision_confirm: "我该将精力集中在哪里？"
 ashen_strategist_effect_tt: "你将消耗你的[ashen_grandmaster|E]经验来学习新的或提升现有的$pod_kueijin$特有军事能力"
 pod1230objectives.217.desc: "东方血族自古便有着深厚的武学传承。追随那位为不死者编纂战争之道的传奇人物——孙离的脚步，这些流浪的谋士游历四方，不断学习与精进这门致命的技艺。\n\n最早形成的宗派是暮光之战，这是一种为了解决日渐激烈的争端而设计的战术。由于其非致命性，它常被用于试验与改进各种更为间接的削弱敌人的手段。\n\n午夜战争则是它的延伸。当暮光之战不足以平息某场异常激烈的冲突时，午夜战争就出现了。此战法以死相搏，但要求遵循荣誉准则，严禁牵连无辜。\n\n最后，东南亚的[Glossary('庞南加兰','podgloss.penangallan')]最近发明了哇扬皮影戏。它利用复杂的地形，并结合专门的能力来迷惑敌人，直至对方陷入混乱，从而可在直接冲突中占得先机。"
 pod1230objectives.217.a: "我将主宰垂暮"
 pod1230objectives.217.b: "午夜，是属于我的时刻。"
 pod1230objectives.217.c: "丛林战的召唤，我已听见"
 pod1230objectives.217.d: "转念一想"
 ashen_grandmaster_initial_kj_decision: "[ashen_grandmaster|E]"
 ashen_grandmaster_initial_kj_decision_tooltip: "关于战争，总有更多可以学习的东西。"
 ashen_grandmaster_initial_kj_decision_desc: "$pod_kueijin$在漫长的岁月中创造了多种多样的战争形式。你的游历正是学习并有望掌握这些罕见策略的良机。"
 ashen_grandmaster_initial_kj_decision_confirm: "我该将精力集中在哪里？"
 ashen_strategist_initial_effect_tt: "你将作为一位战略家开始你的旅程，积累经验以晋升为[ashen_grandmaster|E]，并借此学习新的战术。"
 need_50_ashen_grandmaster_xp: "你需要50点或更高的灰烬宗师经验。"
 road_horizon_victory_objective_decision: "影社崛起"
 road_horizon_victory_objective_decision_tooltip: "安分守己的局外人"
 road_horizon_victory_objective_decision_desc: "在我们整合诸王廷的漫长斗争中，我们的同类却威胁着要将一切推入毁灭的深渊。海中的野兽，刀剑的匪徒，血肉的信众——他们都要将我们撕碎。\n为了生存，他们必须被毁灭。为了崛起，他们必须被消除。"
 road_horizon_victory_objective_decision_confirm: "向我们的主人证明我们的价值。"
 road_horizon_victory_objective_decision_effect_tooltip: "你将获得五个原本仅限于$pod_kueijin$[men_at_arms|E]使用的权限。"
 road_horizon_victory_objective_decision_custom: "[GetDynastyHouseByID('house_chibo').GetName]、[GetDynastyHouseByID('house_bushi').GetName]与[GetDynastyHouseByID('house_anh').GetName]不得有独立的统治者。"
 pod1230objectives.218.desc: "终于，你度过了一个无人打扰的夜晚。长久以来，你一直与你所谓的同族征战不休。那座邪城的仪式无人履行，海面风平浪静，剑鞘中也再无兵刃摩擦之声。终于，一切归于宁静。\n\n你睁开双眼，列位老祖正为你的存在与否争论不休。尽管你或许尚属“未证之身”，但至少你已证明了自己的价值。\n\n经过一番激烈讨论，他们各自归位，正式尊你为“老祖”。你微微一笑，毕生伟业的重量终于得以显现。数名[Glossary('屋室','podgloss.wu')]成员跪伏于你面前，献上贡品与敬意。半鬼俯首，而你身后的自家廷众也放松下来。\n\n如今你已与他们平起平坐，不再只是“小神”中的寻常一员。尸臣与饿殍并肩而立。真正的伟业，此刻方才开始。"
 pod1230objectives.218.a: "昔日为廷臣，今朝已成王。"
 pod1230objectives.218.b: "我的气度配得上远不止于此。凡我所未能得者，我必将亲手攫取，远迈其限。"
 pod1230objectives.218.c: "谢天谢地，这一切都结束了。现在我可以回家了。"
 pod1230objectives.218.d: "现在我们或许终于能免受猎人们的威胁了。看他们现在还怎么找我们。"
 chibo_victory_objective_decision: "残酷之城的低语"
 chibo_victory_objective_decision_tooltip: "秘密被揭露了。"
 chibo_victory_objective_decision_desc: "对于你们这支流落异乡的血系而言，[bloodsorcery|E]的学习因资源匮乏始终举步维艰。然而，借助西方来客的援手与[Glossary('瓮星','podgloss.mikaboshi')]的庇护，或许终能弥补这一致命缺陷。"
 chibo_victory_objective_decision_confirm: "精进我等自身的魔法技艺。"
 pod1230objectives.219.desc: "长久以来，伟大的氏族一直致力于完善血魔法的技艺，但在漫长的岁月里，无论他们技艺如何精湛，却始终如同困于笼中的雄狮，受限于视野的狭隘、理解的匮乏，而最糟糕的，是缺乏真正魔法力量的支撑。\n\n但今非昔比。自西征队伍归来，更多技艺已展现在你面前。通过对根本原理的掌握，以及对[Glossary('瓮星','podgloss.mikaboshi')]秘术与仪轨的钻研，你成功了。这件宝物便是你的杰作，一部关于魔法根本原理的论文，一套统一的理论。藉由它……"
 pod1230objectives.219.a: "……一切魔法皆已昭然若揭。"
 artifact_hand_mikaboshi_name: "瓮星之手"
 artifact_hand_mikaboshi_description: "#bold 为血术法提供+25%法术成功率与+10%仪式速度加成。#!\n一块注入了魔法的朴素石板，若诵出正确的启动咒文，便可作为一件强效术法物品使用。任何对超自然事物稍有了解的人，都能明显感知到其中来自[Glossary('瓮星','podgloss.mikaboshi')]的恶魔污秽。"
 monomi_victory_objective_decision: "星之剑"
 monomi_victory_objective_decision_tooltip: "一场正在铸就的胜利。"
 monomi_victory_objective_decision_desc: "[Glossary('瓮星','podgloss.mikaboshi')]大人树敌众多。作为他最骁[Glossary('妖邪之城','podgloss.wickedcity')]向来犒赏强者，酬劳必将如期而至。"
 monomi_victory_objective_decision_confirm: "是时候留下我的印记了。"
 pod1230objectives.220.desc: "有时，即便你麻木的心也会加速跳动。\n\n这一刻已等待太久。你伸手抚过那份对你辛劳的酬谢——由[Glossary('瓮星','podgloss.mikaboshi')]麾下的一位铁魔呈上，以表彰你的功绩。那是一柄剑的握柄，华美无比，以无与伦比的钢材打磨而成，其坚韧就连神明的熔炉也无法将其熔化。拇指轻推，并非出鞘，而是一抹凶戾的弯刃应声弹出，锋刃之上跃动着不祥的恶意。\n\n一柄足以劈开苍穹的利剑。"
 pod1230objectives.220.a: "份精美的礼物。它会派上大用场的。"
 artifact_sword_stars_name: "星之剑"
 artifact_sword_stars_description: "#bold 将伤害转化为[POD_aggravated_damage|E]。#!\n\n那是一柄刀剑的柄首——华丽而光泽，钢材精炼无双，坚固至极，连诸神的熔炉也无法将之熔解。而它并无剑鞘，仅需拇指轻弹，便有一片残酷的弯刃骤然显现，其锋刃闪烁着阴险的恶意之光。"
 bushi_victory_objective_decision: "吞龙"
 bushi_victory_objective_decision_tooltip: "爱与权力。"
 bushi_victory_objective_decision_desc: "传言称$pod_cainites$能够学会$pod_kueijin$的力量。然而，这样的代价或许沉重到你难以承受。这究竟意味着失去你自身的一部分，还是升华为某种更伟大的存在？"
 bushi_victory_objective_decision_confirm: "是时候了"
 bushi_victory_objective_decision_custom: "你需要一个$pod_kueijin$灵魂伴侣。"
 bushi_victory_objective_decision_custom2: "#X 你的$pod_kueijin$灵魂伴侣将会死去。#!\n你将获得$pod_kueijin$的力量（新的生活方式）。"
 pod1230objectives.221.desc: "你已经和他们详细谈过了，他们有些犹豫。你所提议的简直是大逆不道。而且，如果出了差错，他们会死，而你很可能会陷入癫狂。\n这就是这种罪孽的本质。但长久以来，$pod_kueijin$一直称你们为孽种。长久以来，其他血脉都称他们为恶魔。你们的相似之处多于不同之处。如果你们合为一体，或许会为你们开辟新的道路，新的征程有待探索。\n不过有一点是肯定的，这个仪式会很艰难。兽性会反抗，他们内心更黑暗的一面也会反抗。从来没有人尝试过这样的事。要是……"
 pod1230objectives.221.a: "我希望我们能融为一体。真心地。"
 golden_children_decision: "金童"
 golden_children_decision_tooltip: "父辈的罪孽与我们无关。"
 golden_children_decision_desc: "很久以前，半鬼人曾被称为金童，是昔日英雄$pod_kueijin$的黄金子嗣。当他们的父母堕落失格时，他们曾试图以理相劝，却屡遭斥责。这场所谓的童子起义最终被镇压，就连上天也为此惨重的损失而悲泣。  \n\n若要提醒同辈记起这段往事，并打破多年来束缚他们的枷锁，需要有一位极为成功的半鬼人才能实现。"
 golden_children_decision_confirm: "我们的传承重获新生。"
 golden_children_decision_incompatibility_tt: "#warning 金童与渊影行者的目标相互排斥，你只能达成其中之一。#!"
 golden_children_decision_effect: "你将获得金嗣军帝国头衔，并且[GetTrait('dhampyr').GetName(GetNullCharacter)]特质现在可以遗传。"
 pod1230objectives_kj.5.desc: "数千年前，在传奇纪元，万千仙神曾是凡俗众生的守护者。他们时而会与凡人相爱，有时便会诞下子嗣。这些被称为“金童”的万仙后裔，身负天眷，行走于人间而非凌驾其上，是人民的英雄。\n\n随着他们的$pod_kueijin$父母日益堕落腐化，金孩们试图在其为时已晚之前发声告诫。然而，他们一次又一次地遭到了驳斥。毕竟，孩子们又能知道什么神明所不知的事情呢？\n\n$pod_kueijin$的行径愈发卑劣，直至金孩们再也无法为他们收拾残局。他们聚集于须弥山，决意以荣誉与决心直面$pod_kueijin$。“金童起义”由此爆发。\n\n那景象固然惊天动地，但终究徒劳无功。尽管身负天眷，金童们的义愤却无法与他们父母的血腥欲望相抗衡。金童们的鲜血将须弥宫殿的砖瓦永远染成了红色。\n天地为之悲泣。\n\n他们的父母却无动于衷。\n\n自那以后，$pod_kueijin$所生的后代被称为“半鬼人”，沦为往昔金童们苍白的影子，被迫为其父母的好处而劳碌。然而，他们每一个体内都承载着一位金童的灵魂，而这灵魂如今已然苏醒。\n\n金童的起义，无论是通过言语还是刀兵，绝不会被第二次平息。"
 pod1230objectives_kj.5.a: "我们会再见到须弥山的。"
 shade_walkers_decision: "渊影行者"
 shade_walkers_decision_tooltip: "我们可以去他们无法踏足之地，而这正是我们的价值所在。"
 shade_walkers_decision_desc: "睿智的$pod_kueijin$珍视他们的半鬼人仆从。这些所谓的“渊影行者”能在白天与凡人之中行动，远比其主上更为自如。对于那些真正技艺高超者，更能赐予非凡的恩惠。"
 shade_walkers_decision_confirm: "我们于暮光中繁盛。"
 shade_walkers_decision_tt: "你必须有一位灵魂伴侣或朋友，是一位$pod_kueijin$，且其[Glossary('心法','podgloss.dharma')]等级达到8级或更高。"
 shade_walker_modifier: "受眷渊影者"
 shade_walker_modifier_desc: "#warning 该修正使你能获得气功生活方式能力。#!\n\n一名因卓著服务而受奖的戴恩派，该渊影行者已从其$pod_kueijin$恩主处获得了丰厚的恩惠。"
 pod1230objectives_kj.6.desc: "在$pod_kueijin$社会中，半鬼人因其半人特质且能行走于日光下而具有重要价值。多数半鬼人自幼被教导其使命是作为父母的大使、管理者或间谍，尽管实际职责可能更为多样。\n\n对待半鬼人子嗣的态度两极分化：有些$pod_kueijin$视其为可消耗的工具，另一些则极尽溺爱，沉醉于自身仍能赋予生命的事实。这使得每个半鬼人的生存境遇迥异于同类。\n\n然而，共通之处在于他们必须体现自身价值。即便最宽容的父母，也不会因愚钝的子嗣长期危及自己的道途（或世俗目标）。真正天赋异禀者，或能吸引高阶开悟$pod_kueijin$的关注——据说这些存在会赐予强大恩惠，例如传授玄奥的灵魂秘术。\n\n甚至有人说，一些半吸血鬼通过找到合适的$pod_kueijin$庇护者而获得了真正的永生，不过这类传言只是私下流传，因为不死者社会不会允许这种可能性被他们的后代广泛知晓。"
 pod1230objectives_kj.6.a: "服务自有回报。"
 dominant_uji_knight_tt: "你需要五名或更多勇武达到#V 35#!或更高的[prowess|E]！"
