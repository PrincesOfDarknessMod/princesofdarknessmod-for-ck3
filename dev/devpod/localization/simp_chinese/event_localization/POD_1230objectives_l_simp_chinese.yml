l_simp_chinese:
 pod1230objectives.1.t: "日陨"
 pod1230objectives.1.desc: "你们中的大多数人早就听说过那波斯“神”——密特拉——的虚假故事，以及他对群岛无止境的利用和野心。今夜，你将听到悲伤的完整事实。密特拉想让我们以为他是来到不列颠群岛的救主，但事实是，他正逃离其在古罗马的失败，并认为我们的家园是一个无法重新补充其力量的死水。现在，由于不列颠在新的领导再次统一下，他再次失败了。他的密教在火和剑的驱赶下分散，注定仅成为群岛历史的脚注。当我向你宣布“不屈之阳”的陨落时，我也宣布不列颠本身终于准备好成为推动[cainite|E]社会的力量。"
 pod1230objectives.1.a: "在我看来，这是场很不错的演讲"
 pod1230objectives.2.a: "密特拉遭受了他最终败局……大概"
 pod1230objectives.2.b: "不屈之阳将会再次升起，它总是会。"
 pod1230objectives.3.t: "权杖与太阳"
 pod1230objectives.3.desc: "上古吸血鬼与神之间的区别很稀薄。但在密特拉的情况下，它甚至更加模糊。对于古代波斯人和罗马人来说，称神所带来的纯粹诱惑和力量仍然是惊人的，即使人类已经继续进步，该范式的转变也随近发生。由于没有任何足够强大的对手能够威胁其在梵卓的领导地位，密特拉密教已经设法收集足够的影响力，在某种程度上，成为梵卓[Clan|E]本身。不再局限于不列颠尼亚，对不屈之阳的信仰比以往任何时候都更强大，他们不可否认的信仰动摇了吸血鬼的信条的核心。源自圣经的故事开始从年轻吸血鬼的记忆中淡出，取而代之的是鼓舞人心的、忠实于太阳战神的不死战士的故事。血族社会将永不再一样。"
 pod1230objectives.3.a: "赞美太阳！"
 pod1230objectives.3.b: "有时，我也对我自己都感到吃惊。"
 pod1230objectives.3.custom: "所有梵卓统治者都有机会转换信仰为密特拉密教。"
 pod1230objectives.4.a: "密特拉赢得了这轮。让我们接受它。"
 pod1230objectives.4.b: "赞美太阳？像凡人那样？哈！"
 pod1230objectives.5.a: "他们会在纹章上加一个太阳吗？"
 pod1230objectives.6.t: "幻梦再临？"
 pod1230objectives.6.desc: "他们带着礼物来了。全欧洲的强大$pod_cainites$渴望见到君士坦丁堡的新统治者。当他们走进你富丽堂皇的皇宫时，你要问自己，在黑夜结束之前，会有多少交易、威胁或匕首等着你。你也漫不经心地想，这是米迦勒一直以来的计划吗？他是否知道自己的幻梦需要改变领导层，一个崭新的前景？你可能永远不会知道。但你知道的是，各位尊贵的客人今晚都想学到一些东西，他们的礼物是这个计划的一部分。自称天使长的米迦勒会拒绝这种世俗的祭品，甚至会因此而生气。如果你也拒绝，你将是真正的米迦勒的继承人。但也许幻梦需要在你的领导下走出一条新的道路，你现在就可以迈出第一步。你会……么？"
 pod1230objectives.6.a: "拒绝这些礼物？"
 pod1230objectives.6.custom: "你将走一条漫长的路，复活已死的传承法典信仰。大多数你的封臣将转换为它。"
 pod1230objectives.6.b: "接受这些馈赠？"
 pod1230objectives.7.a: "1204年所发生的只是小挫折罢了。"
 pod1230objectives.8.t: "完成收复失地运动"
 pod1230objectives.8.desc: "血腥的西班牙勒森魃内战已经结束，只有你胜利地站在废墟中。这是一场艰苦的战斗，但只是你通往更强力量的道路上的一块垫脚石。这个决定性和彻底的胜利给了你巨大的影响力，并开了许多门路。事实上，暗影之海的主人这个令人垂涎的地位，以及整个勒森魃[Clan|E]，都摆在你的面前。显然，这是一个陷阱，他们都希望你惨败。想让你的统治结束得和开始一样快，然后回到他们的琐碎的争斗中，不再有你阻挡他们。但这不会发生。你当然想让他们后悔他们的徒劳的阴谋。毕竟，你已经驯服了伊比利亚，让地中海和一些衰弱的长者臣服又有多难……对吧？"
 pod1230objectives.8.a: "提升阶级，一步一阶"
 pod1230objectives.8.custom: "你将走一条漫长的路，复活已死的传承法典信仰。大多数你的封臣将转换为它。"
 pod1230objectives.9.a: "勒森魃的领导层可不是个安全的地方。"
 pod1230objectives.9.b: "暗影之海会冲刷掉这些琐碎的野心。"
 pod1230objectives.10.t: "战胜诸神黄昏"
 pod1230objectives.10.desc: "几个世纪以来，卡纳尔的子嗣们一直在慢慢死去。十字架的仆众，无论是凡人还是不死族不断地袭击，使曾经虔诚的信徒变成了卑微的弱者。但不再会发生了。随着德意志梵卓的入侵被瓦解，骄傲的[einherjar|E]再次将恐惧灌输到该隐的子嗣们的心中，信仰得到了新生。在新领袖的领导下，有了新的教义和领导，[einherjar|E]现在比奥丁想象的还要伟大，浪子很好地精选出了他们，已当成为了家人，即明日的伊西尔。他们作为本就是的维京神明，勇敢地跨入这个时代。当虚弱的南方吸血鬼们惊恐地在他们的城堡里惊恐时，除了祈祷于针对其等的诸神黄昏到来时能被仁慈的赐死之外别想更多。而这即将来临。"
 pod1230objectives.10.a: "无穷的荣耀在等着我们！"
 pod1230objectives.11.a: "他们还没有明白他们的时代已经结束了吗？"
 pod1230objectives.11.b: "诸神时代已经来临！"
 pod1230objectives.12.t: "午夜之后的伊比利亚"
 pod1230objectives.12.desc: "伊比利亚的勒森魃内战是一场血腥的事端，起因于西班牙凡人收复失地，以及基督徒$pod_cainites$与[ashirra|E]$pod_cainites$之间日益增长的动荡。一开始对虔诚者来说那是一段龌龊的时期，背叛，堕落的城市和更黑暗的秘密都在合谋推翻午夜新月。因此，你的胜利是非常出人意料的。当凡人的伊比利亚泰法诸国一个接一个地沦陷时，[ashirra|E]信徒们仍然设法战胜了他们北方的基督徒邻居。确实，这是一个奇怪的转折。阴影之海由于与基督徒的错误联盟而崩溃，你们现在统治着一个新的、几乎陌生的土地和人民。在某种程度上，你的胜利挽救了伊比利亚穆斯林黄金时代的最后遗产。你既是胜利者，又是悠久历史的守护者。这是一个令人望而生畏的图景，但你很自豪能参与其中。"
 pod1230objectives.12.a: "我们是这片土地的过去与未来"
 pod1230objectives.12.custom: "当最后一批非[ashirra|E]$pod_cainites$逃离你的领地时，一些省份将皈依你的信仰。"
 every_non_root_faith_county_world_europe_west_iberia: "伊比利亚的每个不遵守你信仰的领地伯爵领。"
 pod1230objectives.13.a: "贤士们在动摇"
 pod1230objectives.13.b: "他们正在毁灭我们的氏族！"
 pod1230objectives.13.c: "我们是圣言的看护者"
 pod1230objectives.14.t: "小玩笑"
 pod1230objectives.14.desc: "终于，你来了！到了耶路撒冷！……还是波希米亚？没关系，你的旅程已经结束了。这么长时间以来，你一直有种直觉，你注定要和你的末卡维[Clan|E]的兄弟姐妹们在一起。这并不容易，你必须彬彬有礼地，又不那么彬彬有礼地，向沿途的亲王们询问。你甚至不得不把他们中的一些人赶出舒适的王座。你会听到宫廷窃窃私语说你正在统一末卡维[Clan|E]。这很有趣，因为你从没想过，但你还是做了。重要的是你现在就在这里，那些声音越来越大，告诉你去做些……什么！启蒙的时刻到了！还是救世的时刻？你不是很确定。不管怎样，事情进展得怎么样了？"
 pod1230objectives.14.a: "事情变得有点不对！"
 pod1230objectives.14.customa: "如果可行，你将获得天才和精明特质，并使其他末卡维[Clan|E]成员惨受高压力等级。"
 pod1230objectives.14.b: "事情变得不对！"
 pod1230objectives.14.customb: "所有末卡维[Clan|E]成员都有天才特质，但不知何故变得更加精神不稳定。"
 pod1230objectives.14.c: "事情变得非常不对！"
 pod1230objectives.14.customc: "末卡维[Clan|E]获得精明特质，但其他$pod_Clans$的统治者惨受巨大的压力。"
 pod1230objectives.14.d: "糟的不能再糟了！"
 pod1230objectives.14.customd: "末卡维[Clan|E]获得天才特质，但其他$pod_Clans$的统治者变得疯狂。他们现在是疯子了。"
 pod1230objectives.15.a: "我感觉不太好……"
 pod1230objectives.15.b: "我看见新的门开了！哦，等一下，不。关着。绝对关着……"
 pod1230objectives.16.t: "永恒共和国"
 pod1230objectives.16.desc: "“亲爱的朋友们，让我们坦白了说……你们中有多少人希望我们这么快就走到这一步？当我们骄傲的元老院因腐败的领导人和寄生虫而堕落时，我们的共和理想似乎在残暴的日耳曼侵略者（包括凡人和不死族）面前陨落了。但罗马之光永远不会真正熄灭，它仍将指引我们前进，就像太阳永远回避我们一样。为我们的传统感到骄傲，但要注意我们的敌人。我们绝不能再陷入自满或堕落，因为我们已经看到，没有我们的指引，黑暗的年代将永久持续。罗马的元老院同僚们，我很高兴地宣布崭新的永恒元老院第一届会议开幕！”"
 pod1230objectives.16.a: "终于掸去身上的灰尘，感觉真好。"
 pod1230objectives.17.a: "不死是一扁平循环"
 pod1230objectives.17.b: "不管怎么说，我们还是领先的。"
 pod1230objectives.18.t: "沉重的负担"
 pod1230objectives.18.desc: "你感觉你手中的剑很重。你是在探索废墟时发现它的，它本是一座乌托邦，名为，迦太基。但是你已经不再是小辈了，你知道得太清楚了，每一个神话都是谎言和真理的复杂混合物。整个[Clan|E]都在好奇地注释着你，你会继承特洛伊尔的衣钵为吸血鬼带来一个新的黄金时代吗？这个选择将会给你带来很多新的敌人，你知道即使是特洛伊尔也没能保护迦太基免受崇魔的影响。或者你会宣称迦太基只是一个政治工具，拒绝它的混杂传承么？这一举动将为你赢得许多其他$pod_Clans$的尊敬，但你将不会比梵卓更好。你紧握的这把特洛伊尔之剑是这个艰难选择的有力象征。你会……？"
 pod1230objectives.18.a: "留着剑？"
 pod1230objectives.18.b: "丢掉剑？"
 pod1230objectives.19.a: "一个老玩家回到了游戏中。"
 pod1230objectives.19.b: "是时候再一次把它烧毁了。"
 pod1230objectives.20.t: "你体贴的祖母"
 pod1230objectives.20.desc: "芭芭雅嘎有很多名字：“老妪”、“鬼婆”、“祖母”……但你知道真相。她是雅斯米利亚德疯狂追杀自己子嗣的行动中唯一的幸存者。那诺斯费拉图[Clan|E]的始祖至今仍在追杀自己的[Clan|E]，要不是她不断地反抗，他早就把剩下的杀光了。她现在陷入沉睡了，但你能感受到她的愉悦，因为你持续的忠诚和努力已经使诺斯费拉图[Clan|E]在这场持续的斗争中站到了她的一边。最终的命运之战开始了，作为祖母的选民，你不打算让她失望。"
 pod1230objectives.20.a: "我们会让你自豪，祖母"
 pod1230objectives.20.custom: "现在所有诺斯费拉图会服从于芭芭雅嘎和你的命令。\n作为[character_interaction|E]，允许你在战争时召唤[GetMaA('zmei').GetName]作为#bold 不可招募的#!事件[men_at_arms|E]。"
 pod1230objectives.21.a: "某种妖邪即将来临……"
 pod1230objectives.21.b: "保佑我们，祖母！"
 pod1230objectives.22.t: "黑暗中的恐怖"
 pod1230objectives.22.desc: "就连吸血鬼也怕暗影。但是你的[Clan|E]不仅仅是被它吓到了，他们知道有东西潜伏在那里，等待着攻击的时机。他们称自己为“尼克图库”，是始祖雅斯米利亚德的后嗣，而雅斯米利亚德曾发誓要摧毁他任性的子嗣们。从黎明开始，你的兄弟姐妹们就选择逃离，躲在阴影里，为他们的亡命祈祷。你已经厌倦了。如果始祖想要战争，那么他将得到战争。你的[Clan|E]一开始对你的行动保持谨慎，称其为鲁莽，但现在他们看到了真相。只有团结起来，在你的指引和盟友的带领下，你的土地和人民才能在夜晚中取得胜利。他们现在注视着你，准备迎接冲击，并对你的领导能力充满信心。尼克图库一定在他们的洞穴里发出嘶嘶声，诅咒着你的名字，计划着你的灭亡。让他们来啊。"
 pod1230objectives.22.a: "我们比你想的要强大，“父亲”"
 pod1230objectives.23.a: "老鼠都挤在一起了？"
 pod1230objectives.23.b: "是时候面对恐怖了。"
 pod1230objectives.24.t: "神之梦"
 pod1230objectives.24.desc: "你站在乌尔·舒尔吉的墓穴中，最受宠的哈基姆圣裔在此地沉睡。你带来了好消息，阿刹迈[Clan|E]终于接受了血之判官的职责。这花了不少时间……来说服他们去清洗那些弱智长者的[Clan|E]和无用宗教的狂热者。最后的审判已经开始，由于加音的子嗣们都被发现存在缺陷，回收工作已经开始。在你的引导下，哈基姆圣裔将很快用鲜血洗净世界，直到只剩下洁净者。你看到乌尔·舒尔吉的身体在颤抖，然后被突然闪现的黑色血液盲目了眼。而且，不知怎的，你知道你的主人刚刚为即将到来的大清洗祝福了你一个良好的开端……"
 pod1230objectives.24.a: "红色洪水已经开涌了。"
 pod1230objectives.24.custom: "大多数阿刹迈[Clan|E]角色将会皈依正义之道。"
 pod1230objectives.24.customa: "乌尔·舒尔吉的精神攻击将杀死大部分非阿刹迈的血术法使用者。"
 pod1230objectives.25.a: "刀锋之网一直都是对的。"
 pod1230objectives.25.b: "我绝对不会跟随这些被蒙蔽的密教徒。"
 pod1230objectives.26.a: "这名怪异的东方刺客真的疯了。又有谁能知道呢？"
 pod1230objectives.27.t: "团结的家族"
 pod1230objectives.27.desc: "哈基姆的黑王座骄傲地矗立在鹰巢的中心，你的堡垒。当你坐在它上面时，你看着庄严的大会等待你的发言。代表哈里发、阿姆鲁和维齐尔的三个种姓都在这里。学士内环也出席了，来自浩瀚的哈基姆派间谍网络的附近[Clan|E]。竟然在这么短的时间就取得了这么大的进步！就在不久之前，哈基姆的所有这些杰出的孩子们甚至在踏进同一间屋子之前，就已经在自相残杀了。但这发生在你升为[Clan|E]长者之前。通过武力、阴谋和外交手段，你停止了内部纷争，巩固了[Clan|E]地位，重新确立了阿刹迈的首要价值——纪律。现在，他们都在等待你对未来的展望。你知道他们会服从的，若这些哈基姆圣裔敢不服从，他们就将什么都不是。"
 pod1230objectives.27.a: "贾迈勒的遗赠，狂热之道。"
 pod1230objectives.27.custom: "哈基姆派角色将获得勇武修正。"
 pod1230objectives.27.b: "纳穆尔图姆的遗赠，外交之道。"
 pod1230objectives.27.customb: "哈基姆派角色将获得外交修正。"
 pod1230objectives.27.c: "阿什拉夫的传承，术士之道。"
 pod1230objectives.27.customc: "哈基姆派角色将获得学识修正。"
 pod1230objectives.28.a: "最长者确实明智。"
 pod1230objectives.28.b: "等等，他们之前不是联合起来了么？"
 pod1230objectives.29.t: "原罪之政"
 pod1230objectives.29.desc: "“多数异乡人误以为原罪之路的信条只注重于个人满足。但是，尽管个人满足确实是原罪之路最重要的信条，它的目的却不仅限于此。对于政治的掌控才是最终目的。当$pod_cainites$沉溺于欲望，当他们的心兽因为欲望而满足，他们才会变得更容易掌控。一位成熟的‘罪人’知道他宫廷中每个血族的欲望与秘密，并使用它们获利。这就是为何罗马毫无异议的被原罪之路的梵卓统治了如此之久的原因，他们的信条，是他们统治的基础。如果我要为我的同胞留下一份遗产，那么它将会是一个被无尽的欲望、享乐与欢淫所支配的世界。”——卡米拉，首位永恒执政"
 pod1230objectives.29.a: "原罪之道是获得权力的唯一道路。"
 pod1230objectives.29.b: "我依然成功了。"
 pod1230objectives.29.custom: "你的信仰将会传播，劝信更多的……友好$pod_cainites$。"
 pod1230objectives.30.a: "我不明白它们怎么还没自相残食呢。"
 pod1230objectives.30.b: "能满足心兽和暂时获得力量？完美的心路。"
 pod1230objectives.31.t: "万王之王"
 pod1230objectives.31.desc: "在[cainite|E]社会里有明确的真理。冈格罗像野蛮人一样在荒野中游荡，妥芮朵逢迎着小装饰，末卡维迷失在预言和疯狂之间……而且，只有最傲慢的勒森魃才会否认，那就是梵卓注定要统治血族。这是亡生的简单事实，从第二城之夜、波斯以及罗马开始就是这样。无论信仰还是政治结构，没有梵卓掌舵的[cainite|E]结构都注定会破灭。该真理常常在你的同胞中引发一个问题：谁统治统治者？很少有人敢宣称梵卓的衣缽，成为[cainite|E][Clan|E]之首的领袖。现在，你就是其中的一个。亲王之战可能还在继续，但没有人会否认，梵卓不再仅仅是不死族的王。而是皇帝。"
 pod1230objectives.31.a: "氏族之首梵卓，现降与世。"
 pod1230objectives.32.a: "傲慢杂种。"
 pod1230objectives.32.b: "尊重事物的自然秩序。"
 pod1230objectives.33.t: "影中信仰"
 pod1230objectives.33.desc: "“我们的[Clan|E]是统治者的[Clan|E]。是的，梵卓也拥有这个头衔，但他们不了解真正的统治。真正的统治不是权力，甚至不是影响力。而是决定性的行动。以[ashirra|E]危机为例，在我注意到这一点的时候，许多人提出忠告，提倡谨慎和耐心。他们声称我们失去的兄弟可以得到宽恕，[Clan|E]也会重新团结起来。我不同意。而且，正如博学的读者所知，[ashirra|E]现在在[cainite|E]的历史上只是一个脚注，只因在我的支配下[Clan|E]的所有资产都在关键时刻得到了决定性的应用。慈悲和怜悯会给[Clan|E]带来不团结，而[ashirra|E]运动甚至原本能存在到今日！亲爱的兄弟姐妹们，把这个忠告牢记在心吧，为自己设定一个目标，在实现之前不要放松。那时，也只有那时，你才能掌握勒森魃的统治之术。”——勒森魃[Clan|E]编年史，第45页"
 pod1230objectives.33.a: "“现在我们来谈谈操纵阴影之术…”"
 pod1230objectives.33.custom: "独立的[ashirra|E]统治者将看到他们的权威崩溃。"
 pod1230objectives.34.a: "勒森魃政治乃是血腥的交易。"
 pod1230objectives.34.b: "我们氏族历史已经翻开了新的一页。"
 pod1230objectives.35.t: "新月胜于暗影"
 pod1230objectives.35.desc: "从麦地那的城墙到暗影之堡，法基赫检视他的帝国，想知道“我的人民安全吗？”。当最后一场战斗以胜利结束时，法基赫想的是“我该如何避免更多的流血？”。当所有的[ashirra|E]向他寻求指导、保护和忠告时，法基赫并不骄傲，他是谦卑的。当他戴上他的新绶带，配称永恒哈里发时，法基赫思考着未来，思考着确保虔诚的$pod_cainites$永远安全的最好方法。当最后的卡菲尔勒森魃站起来时，法基赫问：“你会选择新月……还是太阳？”"
 pod1230objectives.35.a: "结局与开始"
 pod1230objectives.35.custom: "幸存的勒森魃角色将获得最后一次皈依的机会。"
 pod1230objectives.36.a: "……新月。"
 pod1230objectives.36.b: "决不！[ashirra|E]，这场战争还没有结束！"
 pod1230objectives.37.a: "这就是勒森魃氏族的终结了么？"
 pod1230objectives.38.t: "真理见于该隐"
 pod1230objectives.38.desc: "“他们说，当我们的第一大主教纳尔塞斯死时，便是我们的末日。我们忍受了。他们说异教徒阿纳托尔对虔诚的圣利斯主教的谋杀是公正的。我们没有忘记。他们说我们的宗教是令人憎恶的，是对该隐戒律的拙劣模仿。我们任然坚定地相信第三该隐和德谬哥的残忍。他们说，我们很快就会成为一场坏回忆，一个被遗忘的时代的遗留物。我们却比以往任何时候都更强大。他们说凡人教廷和它的裁判所会毁灭我们。我们骄傲地站在圣城，而可憎的彼拉多教会的手下却在我们面前畏缩。现在？他们什么也不说了，并和我们一起祈祷。”"
 pod1230objectives.38.a: "很快，第三该隐就会保佑我们"
 pod1230objectives.38.custom: "教廷的复兴将使一些机会主义者转而支持我们的功业。"
 pod1230objectives.39.a: "是时候加入胜者的一方了。"
 pod1230objectives.39.b: "他们最终还是会失败。"
 pod1230objectives.40.a: "一个难以想象的回归。"
 pod1230objectives.41.t: "风暴之眼"
 pod1230objectives.41.desc: "我们是成吉思汗与多布鲁的儿女。正如我们迅速征服西大草原所证明的那样，我们和他们一样是征服者。但现在，我们也必须是外交官和政治家。$pod_wan_kuei$正在计划他们的复仇，而我们在西方的坚实据点将是保护多布鲁传承的关键。因此，我们仍然持续征服，是的，但我们也必须建立盟友，就像我们的西方兄弟冈格罗[Clan|E]一样。赢的时候要仁慈，输的时候要优雅，背叛的时候要无情。为你的祖先、你的家庭和你的[Clan|E]感到骄傲，但要明智地知道他们的帮助并不足够。不要让骄傲蒙蔽了你与西方人暂时结盟的好处。新老方式结合，粉碎$pod_wan_kuei$的反攻，然后……然后世界将是我们的。"
 pod1230objectives.41.a: "来吧，夏朝妖魔，我们准备好了"
 pod1230objectives.41.custom: "西部冈格罗，对你的迅速征服印象深刻，将接受你的外交一段时间。"
 pod1230objectives.42.a: "还有更多来自东方的威胁吗？"
 pod1230objectives.42.b: "我们的远亲令人惊讶。"
 pod1230objectives.43.t: "狼群在门"
 pod1230objectives.43.desc: "“中世纪[cainite|E]文明的衰落可以追溯到君士坦丁堡第一次陷落后不久。米迦勒的幻梦因背叛而焚烧，这是对未来岁月的讽喻。所谓的上位$pod_Clans$认为他们的地位稳固着，他们的帝国安全着，他们傲慢地密谋对抗对方，而没有看到真正的威胁。当冈格罗部族横扫欧洲，使强权陷落时，对博学的观察家来说，这并不奇怪。匈奴人的玛塔孙塔，维京人的[einherjar|E]；他们都是强大军阀的先驱，后者将分裂的冈格罗[Clan|E]联合成一股不可阻挡的力量。随着城堡的倒塌和亲王的去世，一个新的[cainite|E]时代开始了。冈格罗的时代。”——《[cainite|E]文明的兴衰》，卡斯伯特·贝克特著"
 pod1230objectives.43.a: "现在不那么强大而高上了"
 pod1230objectives.43.custom: "文明化的统治者会因为他们的权威在狼的袭击中崩溃，而在治理和战事中受到巨大的惩罚。"
 pod1230objectives.44.a: "我们太久对荒野视而不见了"
 pod1230objectives.44.b: "是时候拆毁一些城堡了！"
 pod1230objectives.45.t: "睿魔尔的意志"
 pod1230objectives.45.desc: "当你跪在他面前时，你可以感受到整个[Clan|E]的嫉妒。睿魔尔本人本不为任何人而苏醒。但你不是一般人。在你上位之前，[Clan|E]受到了威胁，它在黑夜的地位很脆弱。而现在？这些魔物只是一个悲哀的笑话，他们独自呆在摇摇欲坠的城堡里。那些狡猾的崇魔者，那些窃灵者，被消灭了。所有的欧洲血族都感谢你粉碎了他们最后的据点。睿魔尔[Clan|E]正在驶向它应有的命运，成为黑夜之主。当你站在他面前时，睿魔尔简单地说道：“你做得很好。”这是睿魔尔第一次有了表达自己意愿的声音，一个他足够信任的人，可以成为核心集团的首领——你。"
 pod1230objectives.45.a: "我在金字塔之顶"
 pod1230objectives.45.custom: "你将释放一个诅咒削弱棘秘魑，萨洛比和散修的奇术师。"
 pod1230objectives.46.a: "他们仍然是篡位之氏族"
 pod1230objectives.46.b: "永生和力量终于属于我们了"
 pod1230objectives.47.t: "永恒之变"
 pod1230objectives.47.desc: "当他们进入房间时，你知道他们大多数人不会离开。他们回应了你的召唤，因为他们别无选择。因为你是睿魔尔之锤，是梵卓的毁灭者，没有棘秘魑能再忽视你。但这并不意味着他们尊重你。你回到你的宝座上，当你的守卫进入并开始屠杀无用的人。他们苦苦哀求，咒骂你的名字，或者试图触及你，但你却在关注一个更重要的问题：应该宽恕哪个群体？你需要一劳永逸地掌握棘秘魑[Clan|E]，但你无法独自完成。当你碾碎一个过于接近的胆大者的头时，你知道你必须现在做出决定，否则你将统治一堆灰烬。"
 pod1230objectives.47.a: "守卫们，放过掌权宗族的子孙吧。"
 pod1230objectives.47.custom: "你加强了整个棘秘魑[Clan|E]，确保了它作为令人生畏的统治者的传承。"
 pod1230objectives.47.b: "尊敬的库都牧师们，我希望你们没感到太不方便"
 pod1230objectives.47.customb: "棘秘魑角色将会皈依突变之道。"
 pod1230objectives.47.c: "你在那儿！连帽那个！出来……"
 pod1230objectives.47.customc: "其他棘秘魑角色将会被抽干来为你的恶魔力量增加燃料。"
 pod1230objectives.48.a: "一个统一的棘秘魑氏族是一个可怕的景象……"
 pod1230objectives.48.b: "毫无疑问，最长者的意志还在发挥作用"
 pod1230objectives.49.t: "禁忌知识"
 pod1230objectives.49.desc: "世界上所有的知识……就在你的指尖。这就是亚当和夏娃在吃禁果之前的感受吗？在与拉撒路的战斗中，康斯坦西娅把圣典弄碎了，为了找回这些碎片，她花了很长时间和大量的投资。但现在它已经恢复了，这本圣典在你面前闪烁着光芒，挑逗你走近它，只为读一小句话。你知道那些谣言，这些谦逊的段落是由卡帕多修斯本人写的，该人随后的另一个名字是萨尔贡，该书包含了所有以诺城的仪式、知识和预言。据说，一种使人与天主持平的方法也在这书的某个地方，在萨尔贡被[Embrace|E]之前就几乎完成了。但你从灵魂深处就知道这本圣典不是写给凡人的，甚至也不是写给吸血鬼的，你的理智可能会被粉碎而无法修复。当你的手越来越靠近它，你做出最后的选择……"
 pod1230objectives.49.a: "我将使圣典服从于我！"
 pod1230objectives.49.b: "……让我们再把它打碎，把它忘掉。"
 pod1230objectives.49.custom: "你的卡帕多西亚同胞们会感激你的谨慎。"
 pod1230objectives.50.a: "有些秘密最好埋起来……"
 pod1230objectives.50.b: "碰它！这会很有趣！"
 pod1230objectives.51.t: "阴谋"
 pod1230objectives.51.desc: "当你用尖牙咬进他的脖子时，你周围的时间似乎变慢了。影像开始出现在意识的边缘，当你飘向幸福的狂喜时。你看到你自己，意大利据点中的乔凡尼家族的受膏领袖。你看到你信任的家族成员组成的小议会，他们帮助你策划你的大阴谋。你看到欧洲的夜晚被你不断增长的商业帝国重新定义，所有的$pod_Clans$都不愿接受你的新显现，你的英明的建议和你新获得的重要性，与你的卡帕多西亚兄弟的无用相比，有天壤之别。你看到阴谋开始了，你用所有的财产使它获得了它应得的巨大成功。当你恢复理智，那个傻瓜化为灰烬，你看到你的家族……不，你的[Clan|E]……在你身边。夜任还早。而这将是乔凡尼的。"
 pod1230objectives.51.a: "兄弟姐妹们，是让大清洗开始的时候了"
 pod1230objectives.51.custom: "乔凡尼[Clan|E]将从卡帕多西亚[Clan|E]中分裂出来，并开始实施阴谋。乔凡尼在一段时间内将会很擅长密谋，而卡帕多西亚也很容易受其影响。"
 pod1230objectives.52.a: "篡位者氏族的突然出现开始让人担忧……"
 pod1230objectives.52.b: "大清洗开始了，最好做好准备。"
 pod1230objectives.53.t: "新的开始"
 pod1230objectives.53.desc: "在一次令人惊讶的事件转折中，自古以来就存在的长者的腐败统治受到了挑战。你自己也不确定催化剂是什么，或者这种情况是否会持续很长时间，因为你的敌人正在密谋镇压你的暴发叛乱。你虽与黑夜的亲王争战，仍有许多人聚集与你同仇。一些人跟随你的领导，而其他人已经开始试验新的政治结构。这确实是一个奇怪的新的夜晚，因为你发现自己处于一个受人尊敬的和平维护者的地位，处于苏醒的各派系之间。你不是老式的统治者，而是保护自由国家不受反击和致命干涉的磐石。这是一个不稳定的可能不荣誉的位置，危险和威胁镶嵌在每一个边缘。但是，说真的，没有其他地方是你现在更想去的。"
 pod1230objectives.53.a: "我们勇敢地迈进了一个新的纪元。"
 pod1230objectives.54.a: "我们需要教育这小辈他们该呆的位置。"
 pod1230objectives.54.b: "革命正在进行中。"
 pod1230objectives.55.t: "蛇之拥吮"
 pod1230objectives.55.desc: "“很久以前，你们对赛特的美视而不见。你们称自己为$pod_cainites$，只因一个虚假的始祖欺骗你们崇拜他。现在，你知道了，只有神才应该被敬拜。一个仁慈的神，因为他会原谅你过去对他的过犯，但也是一位记仇的神，因为从今晚开始，最后的$pod_cainites$将被烙上赛特的敌人的烙印并悔改，或者被带到拉的面前。再也不会有任何喘息的机会，直到整个欧洲赞颂祂的荣耀之名，那时，也只有那时，祂才会回来祝福我们！来吧，子嗣们，让我们在圣殿里祈祷这辉煌的时刻的到来。那么，享受你明智选择的回报吧，因为夜晚还很早……”"
 pod1230objectives.55.a: "这里没有该隐之子，只有赛特之子。"
 pod1230objectives.55.custom: "有些更……思想先进的欧洲和其他地区的$pod_cainites$将皈依光荣的真理。"
 pod1230objectives.55.customb: "你将得到你对你旧敌阿刹迈[Clan|E]的宣称。"
 pod1230objectives.56.a: "这些埃及疯子可能发现了什么……"
 pod1230objectives.56.b: "赞美赛特，并庆贺他即将的归来！"
 pod1230objectives.57.t: "最终审判"
 pod1230objectives.57.desc: "这应该是你取得大胜利的时刻……但为什么感觉如此空虚呢？尽管困难重重，你还是把你的[Clan|E]从灭绝的边缘拉了回来，对睿魔尔实施了复仇，并再次平息了巴力，因为这是你的职责。但是，在这个过程中，你失去了更多。扫罗是一位看护人，一位善良的灵魂，他会为你的牺牲、鲜血和痛苦流那么多的眼泪。他们称你为“复仇天使”，因为你一直毫无怜悯之心，而且，也许，你对睿魔尔所说的关于你[Clan|E]的谣言是真的。你是萨洛比之剑，[Clan|E]之光。但你也迷失了，失去灵魂，当你的敌人已经被处理，你就是对你的人民的最大威胁。现在，就像很多次一样，你感觉到扫罗的目光在注视着你，给了你在为时已晚之前停下来的最后一次机会……"
 pod1230objectives.57.a: "扫罗错了，他们会付出代价的。"
 pod1230objectives.57.b: "我做了什么？父亲，原谅我……"
 pod1230objectives.57.custom: "关于你[Clan|E]的睿魔尔谣言被揭穿了，他们因此遭受了重大的政治挫折。"
 pod1230objectives.58.a: "萨洛比氏族再次回到棋盘。"
 pod1230objectives.58.b: "恶魔！窃魂者！"
 pod1230objectives.59.t: "世纪之末"
 pod1230objectives.59.desc: "“你建立了超乎想象的帝国，人类和[cainite|E]成就的顶峰，全世界嫉妒的对象……你认为这种情况会持续下去吗？你们著名的城市，权力、智慧和荣耀的纪念碑屹立着，但它们躺在那里，被豺狼打伤，被秃鹫环绕，被千刀万刀刺死，被你们自己的傲慢所玷污。这是[cainite|E]的垂死挣扎，文明之光渐渐暗淡。即使在你最后的失败时刻，你也不会因为湮灭而得到安慰……我来找你了。我带着成千上万。我带来了世界末日！我是众神之鞭！这是第三次巴力战争……不再会有第四次。”"
 pod1230objectives.59.a: "我见证你的世界燃烧。"
 pod1230objectives.60.a: "我们必须不惜任何代价打败他们！"
 pod1230objectives.60.b: "于是乎，它开始了……"
 pod1230objectives.61.t: "封印之恶"
 pod1230objectives.61.desc: "下处暗藏着可怕的东西，即使是最坚强的[cainite|E]也不敢想象。你们称他们为“先子”，因为他们是人类出现之前的初次夜晚的子嗣。这些生物都沉眠着，没有人知道它们，除了你的教团。你知道它们是无法被摧毁的，只有喂饱它们才能让它们继续沉睡。而且，当他们以无辜者为食时，你的子民就会被怀疑为崇魔者，甚至更糟。但是必须有人去做，只有你的子民有这样的毅力。现在你已经净化了你在阿扎那利教团中的疯狂同胞们，先子们可以继续他们的沉眠，世界可以继续运转。无论花费多少代价，你的教团都将维护这种状态。"
 pod1230objectives.61.a: "所以，我们继续见证。"
 pod1230objectives.62.a: "邪恶信徒的疯狂游荡。"
 pod1230objectives.62.b: "我们只能希望无梦的睡眠。"
 pod1230objectives.63.t: "西方与东方"
 pod1230objectives.63.desc: "雷伏诺[Clan|E]在印度有着深厚的根基，在那里，他们被尊为拥有英明权威的统治者[Clan|E]。然而，在西方世界，雷伏诺是一个不连贯的不匹配的冲突信仰，经常被当地的权力误解和回避。这长期的压迫已经随着你们的崛起而结束。雷伏诺第一次在西方拥有如此之大的权力，甚至可以挑战根深蒂固的[cainite|E]掌权阶级。更好的是，这引起了你在印度的族人的注意，他们派大使去赞扬他们任性的同胞并呼吁结盟。有些人会问，当欧洲处于最黑暗的长夜之时他们在哪里？但也许现在是该宽恕了……"
 pod1230objectives.63.a: "我们有了新的家园，但我们永不会忘记印度。"
 pod1230objectives.63.b: "新雷伏诺氏族不会那么容易忘事。"
 pod1230objectives.63.custom: "传统的西方掌权$pod_Clans$，梵卓，勒森魃和棘秘魑的权威将会因你的崛起而受到挑战。"
 pod1230objectives.63.customb: "东雷伏诺将送出一位强大的[Embrace|E]候选人作为礼物。该角色将成为你的廷臣。"
 pod1230objectives.64.a: "我们的“掌权氏族”已经够多了。"
 pod1230objectives.64.b: "一个对于我族来说新的纪元。"
 pod1230objectives.65.t: "终结永恒"
 pod1230objectives.65.desc: "印度从未处于和平。$pod_asuratizayya$，或者用他们的语言来称，$pod_wan_kuei$，不断地侵占我们的土地，利用我们的内部分裂使我们彼此对立。这些所谓的饥渴恶魔不关心我们的传统，他们很好地使用最不正当的战术来施压他们的优势，既他们所谓的“低劣战争”。有时，我们被他们轻易达成的恶魔协议推到了灭绝的边缘。但现在，印度觉醒了。无论是雷伏诺、那伽罗阇还是檀那婆，土著$pod_cainites$正在重新找回力量和团结的目标。但请不要搞错，除非已经没有$pod_wan_kuei$敢在我们的土地上游荡，否则这场永恒战争就不会结束。作为印度的新转轮圣王，这是我的第一个命令：全杀光。"
 pod1230objectives.65.custom: "幸存下来的$pod_wan_kuei$将会被无情猎杀。"
 pod1230objectives.65.customb: "你将把印度统一成一个新的帝国。"
 pod1230objectives.65.a: "印度反击。"
 pod1230objectives.66.a: "印度终于迈进了。"
 pod1230objectives.66.b: "这只是一次小挫折。"
 pod1230objectives.67.t: "猩红之阳的崛起"
 pod1230objectives.67.desc: "“……坦白了说吧，早在几世纪前你就应该打败那些南蛮了。”你差点没能抑制内心的恶意，想要撕裂来“祝贺”你胜利的中原朝廷宣使的喉咙。在你掌权之前，成千上万入侵印度的$pod_wan_kuei$失败了，但是，你几乎没有得到你的同僚的承认，他们对你这藩国的蔑视处处可见。他们不了解这里的实际情况，若没有你挺身而出破局，$pod_wan_kuei$甚至会输掉。即便如此，如果你想实现更大的抱负，成为受承认的老祖，你还是需要他们……又或是不想？没有比在你实现大胜利后更好的放纵机会了……"
 pod1230objectives.67.custom: "你将把印度统一成一个新的帝国。"
 pod1230objectives.67.a: "向禅封老祖致以我最深切的感谢。"
 pod1230objectives.67.b: "我会向你的主人宣布我的独立。用你的头。"
 pod1230objectives.68.a: "亚洲恶魔赢得了这一轮。"
 pod1230objectives.68.b: "一个新的皇朝崛起。与其带来的所有机遇。"
 pod1230objectives.69.t: "乌木国"
 pod1230objectives.69.desc: "非洲的不死族有各种各样的来源，从该隐的子嗣到自造起源的拉曼加术士，但他们都有一种共同的文化亲和感，导致他们以“莱本”的形象出现。到目前为止，没有比这更糟的了，当外界施加压力时，表面的联合就很容易破裂，无论是来自[ashirra|E]$pod_cainites$还是更老的敌人。时代在改变，非洲的不死族找到了一个共同的领袖，他们称之为“第一马加吉”。这并不是一件容易的事，因为你们的同胞们还不习惯团结，他们的脾气已经很坏了。但是，至少到目前为止，你得到了值得怀疑的好处和同伴勉强的尊重。比你之前的任何人都多。"
 pod1230objectives.69.a: "为了共同的团结，一个共同的领袖。"
 pod1230objectives.70.a: "不管是好是坏，非洲崛起了。"
 pod1230objectives.70.b: "我们将以极大的兴趣关注这些故事。"
 pod1230objectives.71.t: "神耀之剑"
 pod1230objectives.71.desc: "亚柯骑士是暗影裁判所中最激进的修士会，一直以来都最渴望将这个羽翼未丰的组织集中起来。有些人会说，也许是过于急切了，因为骑士的狂热有时近乎疯狂，无法真正区分敌友。\n然而，时代已经改变了，对一些最老的敌人的最终毁灭以及对君士坦丁堡的清洗已经将天主之剑锻造成了一种新的、更致命的武器。但在需要的时候也会更加精确和微妙，确保裁判所永远不会再面临来自他们内部的麻烦。\n戈捷，当他在天堂看着我们的时候，最后一定笑了。"
 pod1230objectives.71.custom: "我们离统一暗影裁判所又近了一步。"
 pod1230objectives.71.customb: "亚柯骑士最精锐的接班人加入了你的宫廷"
 pod1230objectives.71.a: "地狱的愤怒比不上天灾骑士的。"
 pod1230objectives.72.a: "暗影裁判所光亮了……"
 pod1230objectives.72.b: "罗马教廷的胜利。"
 pod1230objectives.73.t: "神之慈手"
 pod1230objectives.73.desc: "圣约翰修女会也许是最不显眼的裁判所修士会，但她们的职责最艰巨。被能把许多人逼疯的幻象所困扰，修女们忍受着几乎没有人希望携着生存下去的负担。\n她们对功业的承诺有时会减弱，有些人认为她们会选择退隐到修道院生活中，希望能避开这些痛苦的幻象。但修女会还没有终结，在一个安静而庄严的仪式上，她们重新开始了对伟大功业的参与。她们的痛苦不会结束，直到最后一个被诅咒的灵魂从天主的大地被净化。"
 pod1230objectives.73.custom: "我们离统一暗影裁判所又近了一步。"
 pod1230objectives.73.customb: "圣约翰修女会最精锐的接班人加入了你的宫廷"
 pod1230objectives.73.a: "蒙福女士不会逃避她们的职责"
 pod1230objectives.75.t: "开眼"
 pod1230objectives.75.desc: "神目是必要之恶，是被委以监视猎人的厌人任务的秘密警察。如果你信其他裁判官的话，他们被称是由极度偏执的疯子组成的，但仍然在罗马教廷里发现了许多腐化之巢穴。\n尽管不断有解散该修士会的压力，神目仍在那里，并悄悄地清除了更多的极端分子成员。最近，他们赢得了其他修士会勉强的尊重，他们现在把他们看作是一个有用的，即使是危险的工具。\n现在眼目完全转向侍奉邪恶的下仆，不管他们是在教廷里还是在教廷外面。"
 pod1230objectives.75.custom: "我们离统一暗影裁判所又近了一步。"
 pod1230objectives.75.customb: "神目最精锐的接班人加入了你的宫廷"
 pod1230objectives.75.a: "邪恶将无处可藏"
 pod1230objectives.77.t: "守秘人"
 pod1230objectives.77.desc: "红修会与裁判所有一段复杂的过往。它对知识的追求是无价的，因此它抵制着地狱的下仆的神秘本性。但它也把该组织的成员置于一个危险的位置，腐化和禁书潜伏在每个角落。\n在消灭了意大利一些最阴险的吸血鬼势力之后，红修会有了更好的装备来判断什么值得追求，什么应该被消灭。\n有了这个新发现的焦点，红修会对裁判所来说是比以往任何时候都更强大的资产。"
 pod1230objectives.77.custom: "我们离统一暗影裁判所又近了一步。"
 pod1230objectives.77.customb: "红修会最精锐的接班人加入了你的宫廷"
 pod1230objectives.77.a: "诱惑性的知识"
 pod1230objectives.79.t: "与平信徒一起工作"
 pod1230objectives.79.desc: "冯·穆尔瑙家族是裁判所其他修士会的一个奇怪盟友。这是一个德意志贵族家族，与圣职人员没有真正的联系，他们受到天主的祝福（也有人说是诅咒），因为他们能够真正闻到邪恶的气味。这种力量，加上奥托和利奥波德·冯·穆尔瑙等人的强大领导，使他们成为圣座的坚定盟友。\n尽管如此，要让多产的冯·穆尔瑙家族充分参与到裁判所项目中，还是花了一些时间。现在他们的德意志资产很安全，他们准备以更大的热情在这场幕后战争中扮演自己的角色。"
 pod1230objectives.79.custom: "我们离统一暗影裁判所又近了一步。"
 pod1230objectives.79.customb: "冯·穆尔瑙最精锐的后裔加入了你的宫廷"
 pod1230objectives.79.a: "因虔诚而高贵"
 pod1230objectives.81.t: "从影到光"
 pod1230objectives.81.desc: "尽管是由杰出的个人所建立，但暗影裁判所总是脆弱的。除了凶残但显而易见的吸血怪物敌人之外，不同修士会之间的内讧也是一个一直存在的问题。似乎裁判所注定要多次失败。\n不会继续了。在对吸血鬼取得一系列关键胜利后，暗影裁判所变得比以往任何时候都更强大，也比以前更加团结。黑暗的仆从再也不能刺穿人类之盾了。\n裁判所取得了胜利，很快就会颁布神对$pod_cainites$的最终判决。"
 pod1230objectives.81.a: "终末之战开始"
 pod1230objectives.83.t: "终局的开端"
 pod1230objectives.83.desc: "世界上最古老的教派，塔尔玛埃拉孜孜不倦地想要摧毁[cainite|E]种族，加速火焚末日来实现这一目标。\n被波斯的阿刹迈切断的东西教派之间的联系，在几个世纪以来一直是一个严重的障碍，一个你刚刚修复的障碍。随着真黑手再次完整，面临最终目标的实现已经取得了一些重大的成功。在教派支配的庞大间谍网络下，一场操纵和欺骗的秘密战争已经开始，期望破坏[cainite|E]机构的稳定。\n在随之而来的混乱中，你计划让凡人先摧毁大部分摇摇欲坠的[cainite|E]文明。最后，该隐的诅咒将会从这个悲惨世界中被彻底清除。"
 talmahera_objective_custom: "你将在[cainite|E]领地的封臣中播下叛变的种子"
 pod1230objectives.83.a: "又近了一步……"
 pod1230objectives.84.b: "德尔罗是明智的"
 pod1230objectives.84.a: "这是什么疯狂玩意？！"
 pod1230objectives.85.t: "在黑十字之下"
 pod1230objectives.85.desc: "以[cainite|E]的标准来看，德意志梵卓的崛起速度之快令人叹为观止。它在上古时代只是一处流亡者的归宿地，却在罗马灭亡后的短时间内就成为了[Clan|E]的中心。\n他们的第一次挫败是约根·冯·费尔登入侵棘秘魑军督领失败后被迫接受的无条件和平。但梵卓从未停止窥视东部，他们的努力终于得到了结果。\n约根之败的仇已被报，利沃尼亚野者也得到了安抚，梵卓已经稳住了他们的东翼。\n现在，西部在呼唤他们，因为黑十字的扬升远未结束。作为他成功的奖励，一位新颖又有前途的人类担任上了梵卓先锋，并将成为未来更多征服的武器。"
 pod1230objectives.85.a: "我们才刚刚开始"
 pod1230objectives.86.a: "我们必须阻止这些自负的梵卓！"
 pod1230objectives.86.b: "正如其所应当"
 pod1230objectives.87.t: "新玛土撒拉"
 pod1230objectives.87.desc: "睿魔尔和那伽罗阇都曾经证明，吸血鬼可以通过魔幻术法来成为，而这你已经研究了一段时间。这过于复杂不能保证成功，且还需要一些强效血液。你无法像睿魔尔那样有魔法后备，所以你一直专注于尽可能获得最强力的血液，目前地牢里的囚犯就是你的目标。\n现在是举行仪式的时候了，根据作为祭品的强力吸血鬼的氏族来成为对应氏族的吸血鬼。如果一切顺利，你将获得永生，不再受制于任何尊长，并拥有任何新生吸血鬼梦寐以求的强大力量。你冷酷无情的吸血鬼主人的奴役到此结束！"
 pod1230objectives.88.t: "新玛土撒拉"
 pod1230objectives.88.desc: "睿魔尔和那伽罗阇都曾经证明，吸血鬼可以通过魔幻术法来成为，而这一壮举又一次实现了。新的玛土撒拉崛起了，其曾经只是血仆，一心想在其熟悉的黑夜社会中留下自己的印记。"
 pod1230objectives.88.a: "我们才刚刚开始"
 pod1230objectives.89.a: "更多傲慢的窃贼！"
 pod1230objectives.255.title: "新血"
 pod1230objectives.255.desc: "最后，你准备好成为[cainite|E]社会的一员了。他们可能会拒绝你，因为他们害怕那渺小的预言，但你现在太强大了，已不能忽视。\n你不再是一位劣族，你处于一个独特的位置来塑造你的新血系，他们不能阻止你，再也不能了。那么，你会选择哪条路呢？"
 pod1230objectives.255.option.diplomacy: "外交总是答案"
 pod1230objectives.255.option.war: "战争！"
 pod1230objectives.255.option.prowess: "我们不会对他们手软。"
 pod1230objectives.255.option.stewardship: "我们会统治他们，因为我们知道怎么做"
 pod1230objectives.255.option.intrigue: "他们根本不会见到我们如何接近"
 pod1230objectives.255.option.learning: "我们不会浪费时间在这，知识在等着我们"
 pod1230objectives.255.option.secret: "吾等乃是该隐真正的继承人，他们很快就会学会如何服从"
 pod1230objectives.256.title: "血的力量"
 pod1230objectives.256.desc: "现在你应该选择三个与你血系配套的$pod_disciplines$。你只能选择那些你自己拥有的$pod_disciplines$"
 pod1230objectives.256.potence: "蛮力术。好打击敌人"
 pod1230objectives.256.celerity: "迅捷术。好行如闪电"
 pod1230objectives.256.fortitude: "坚韧术。好变得无敌"
 pod1230objectives.256.auspex: "观占术。好看透黑暗"
 pod1230objectives.256.dominate: "支配术。好统治他们"
 pod1230objectives.256.presence: "威仪术。好承惧受爱"
 pod1230objectives.256.oblivion: "湮灭术。好命令死者"
 pod1230objectives.256.bloodsorcery: "血术法。好掌控血液"
 pod1230objectives.256.animalism: "兽性术。好主宰动物"
 pod1230objectives.256.protean: "变形术。好多形多样"
 pod1230objectives.256.vicissitude: "易变术。好塑捏骨肉"
 pod1230objectives.256.obfuscate: "混淆术。好化作无形"
 pod1230objectives.257.title: "即来之物的印记"
 pod1230objectives.257.desc: "你将为你之血的纹章选择哪种颜色？"
 pod1230objectives.257.option.1a: "黑于红滴"
 pod1230objectives.257.option.1b: "银于红滴"
 pod1230objectives.257.option.1c: "金于红滴"
 pod1230objectives.257.option.1d: "红于银滴"
