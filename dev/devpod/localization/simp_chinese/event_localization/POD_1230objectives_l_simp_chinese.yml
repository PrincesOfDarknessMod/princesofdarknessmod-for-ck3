 pod1230objectives.258.title: "转念一想"
 pod1230objectives.258.desc: "你真的对你血系的纹章的颜色满意了吗，还是要重新考虑一下？"
 pod1230objectives.258.option.a: "重新考虑。"
 pod1230objectives.258.option.b: "留下这个。"
 pod1230objectives.258.option.c: "让其成为我国图徽！"
 pod1230objectives.91.t: "火焰再燃"
 pod1230objectives.91.desc: "你的研究结束了。不管你通过不懈的实验从零碎的信息中总结出来的公式是不是真正的希腊之火，这种物质肯定会燃烧得很好。最初的测试已经产生了惊人的结果，这种液体像蜂蜜一样黏，几乎不可能熄灭，它被点燃时覆盖的一切在它停止燃烧之前都将不复存在。虽然最优的发射方法仍然是一个潜在的改进领域，但为你服务的手工艺人已经准备了足够有效的设计。\n当你看着烈火吞噬测试用假人的时候，你感到肩上的重担被卸下了，内心深处你知道那是你所承受的愧疚，即让你的教友们没有足够武器就去对抗地狱。"
 pod1230objectives.91.a: "让这火如同我们信仰一般燃烧"
 pod1230objectives.92.t: "地平线上之火"
 pod1230objectives.92.desc: "最近你经常听到一些奇怪的谣言，说藏身处在几分钟内就被火焰吞噬，血族在自己的休息室里被烧成灰烬，长者们消失得无影无踪。今天你的一个手下证实了这一切都是源于某个猎人组织的新发明。据称，他们重新创造了希腊火的配方，并将其用于陆地上，造成毁灭性的效果。"
 pod1230objectives.92.a: "那些白痴的凡人和他们愚蠢的玩具。"
 pod1230objectives.92.b: "我希望他们会分享该发明。"
 pod1230objectives.93.t: "虔信者回归"
 pod1230objectives.93.desc: "自从甘滕宾兄弟被他们可恶的主子强迫逃离君士坦丁堡这座伟大的城市以来，已经过去了许多年，尽管这座城市被蹂躏得满目疮痍，但两兄弟对那些操纵者灌输给他们的教义的信仰也随之遭到破坏，一种新的信仰从灰烬中诞生了。卡洛梅娜的弃民看透了那些自称为她的选民的愚蠢：神圣不能来源于非神圣的东西。长期以来，甘滕宾一直在与那些谎称自己虔诚、被推到文明社会边缘的人斗争，但真正的信仰占了上风。兄弟俩的虔诚让他们和所有准备加入他们的人凯旋而归，回到这座城市，无数的耳朵渴望听到他们的福音。"
 pod1230objectives.93.a: "起来，地上的受诅者！"
 pod1230objectives.94.t: "宗教狂热漫了君士坦丁堡。"
 pod1230objectives.94.desc: "从君士坦丁堡传来的消息说，有个邪教来到了城里，用各种诽谤针对更优者的废话毒害平民的耳朵。他们的污言秽语像一团火一样在城市里蔓延开来，而围绕在他们周围的暴民已经变得越来越多，越来越激动，任何人都无法让他们安静下来。一个被如此盲目的热情所征服的城市会变成什么样子？"
 pod1230objectives.94.a: "下流的异端。"
 pod1230objectives.95.t: "新的权力中心"
 pod1230objectives.95.desc: "午夜的寒风吹拂着你的头发，你脚下的维斯瓦河闪烁着星光。这条河供养的所有生物都归属于你，你所站的城墙保护着它的君主，使其不会被更有用的人取代。你是这片土地的真正统治者，你的帷幄使这片土地比你那自私的喀尔巴阡亲属的任何贫瘠荒凉的采地都更加繁荣和令人羡慕。\n他们很快就会意识到，当面对纯粹的力量时，他们宝贵的血统毫无意义。棘秘魑霸权的冷酷之心现在就处于这里，在瓦维尔山之上。"
 pod1230objectives.95.a: "我将撼动群山！"
 pod1230objectives.96.t: "北境新贵"
 pod1230objectives.96.desc: "关于血族事务最近情况的简报的最后一段引起了你的注意。[victorious_poltzimi.GetUIName]，被你关注的这位显然不再只满意[victorious_poltzimi.GetHerHim]对波兰王国的紧握。[poltzimi.GetSheHe]公开向魔物的长者发起挑战，并要求应其权力和功绩获得对军督领的统治权。连孩子都知道这只会导致战争。"
 pod1230objectives.96.a: "好像那些傻瓜的敌人还不够多似的。"
 pod1230objectives.96.b: "让[victorious_poltzimi.GetHerHim]来，让我们来看看[poltzimi.GetSheHe]有啥种。"
 pod1230objectives.256.obtenebration: "幽暗术。指使暗影"
 pod1230objectives.256.serpentis: "古蛇术：用于命令蛇和怪物"
 pod1230objectives.256.daimonion: "崇魔术。来腐化和掌控"
 blood_curse_objective_decision: "终结诅咒"
 blood_curse_objective_decision_tooltip: "血咒正在撕裂氏族，我们必须采取行动。"
 blood_curse_objective_decision_desc: "睿魔尔血咒对我们族人的心灵造成了极大的伤害。我们必须尽我们所能找到一个解决方案。"
 blood_curse_objective_decision_confirm: "我们做到了！"
 blood_curse_objective_decision_effect_tooltip: "你将解除对你氏族血咒，并顺便羞辱睿魔尔。"
 pod1230objectives.97.t: "诅咒已解"
 pod1230objectives.97.desc: "这需要你[Clan|E]最博学的成员的努力和大概史无前例的奥秘知识的收集，但它终于完成了：所谓的睿魔尔血咒已被解除，最终使你和你的人摆脱了它的可怕影响。\n除了这一壮举的明显好处外，这也是一个伟大的政治胜利，因为你的同胞们在这段艰难的时期里忍耐了下来，并因此变得更加强大。睿魔尔[Clan|E]本身也开始感受到挫折，由于他们的“完美”诅咒如此公开地被打破，他们被大众嘲笑。\n胜利的滋味很少这么甜。"
 pod1230objectives.97.a: "现在谁才是最强的血术士？"
 tremere_blood_curse_removed_tt: "睿魔尔血咒将从你的整个[Clan|E]中移除。"
 pod1230objectives.98.a: "这将给睿魔尔上一堂关于谦逊的课。"
 pod1230objectives.98.b: "啥？怎么？这不可能！"
 tremere_blood_curse_decision_custom: "鹰巢，坐落在[GetTitleByKey('b_qazvin').GetNameNoTier]伯爵领的奇观，必须被完全建成"
 pod1230objectives.99.t: "永生赞助"
 pod1230objectives.99.desc: "作为一名自豪的妥芮朵，你长期以来一直在你的地区培养艺术家，无论他们是不是凡人。你的宫廷已经成为诗歌、写作、体育和所有其他你认为有价值的追求的中心。更妙的是，你还设法让自己身边围绕着由各种$pod_Clans$组成的天才议会，确保你的名声甚至比你自己的妥芮朵族人们传得更远。\n在你微妙但始终存在的关怀下，几乎每晚都有新发现、新理论或新杰作诞生。在某种程度上，你已经实现了每位妥芮朵的梦想：永远不缺新的奇迹来娱乐，以免令人哀伤的缓慢的永生之苦。"
 pod1230objectives.99.a: "每夜如新"
 toreador_grandeur_event_tooltip: "一位特有灵感的人物加入了你的法庭。"
 pod1230objectives.100.a: "花哨的妥芮朵姿态！"
 pod1230objectives.100.b: "我必须得亲自见到那些奇观！"
 toreador_grandeur_modifier: "永生赞助"
 toreador_grandeur_modifier_desc: "最伟大的妥芮朵赞助人，总是站在凡人创新的最前沿，并因此受到广泛尊重。"
 pod1230objectives.101.t: "不死族图书馆"
 pod1230objectives.101.desc: "现在该隐之子历史上最重要的著作都在你的手中，并且有适当的设施来容纳它们，毫无疑问，你已经创造了你的种族历史上最大的永恒知识库。\n即使永生也不足以让你读完所有的东西，破译所有的秘密。但你会尝试，然后，也许，你会最终理解这该死的存在的意义。答案一定就在那里。你不敢考虑其他的选择……"
 pod1230objectives.101.a: "很久很久以前……"
 custodian_library_undead_modifier: "大图书馆馆长"
 custodian_library_undead_modifier_desc: "最伟大的该隐之子图书馆被委托于你。每件事都有一个答案，只要你知道去哪里找。"
 pod1230objectives.102.a: "我能借阅一些书么？"
 pod1230objectives.103.t: "亚力科的选民"
 pod1230objectives.103.desc: "很久以前，妥芮朵[Clan|E]的[antediluvian|E]亚力科掌控着苏美尔，那是一位仁慈的、受人爱戴的女神。但是，伊娜依娅来了。\n愤怒的冈格罗之母与她的子嗣一起，蹂躏了亚力科的乐园，并在一场漫长的战斗中偷走了命运石板，许多骄傲的妥芮朵因此丧命。最后，这一罪行终于得到了报应。\n石碑现在又回到了妥芮朵的手中，恩奇都和吉尔伽美什已经死了，冈格罗氏族只能在这次失败的耻辱中窜入他们的狗屋。\n而且，当你在宣布这一重大消息后环顾你的御座厅时，你突然注意到你所见过的最宏伟的雕塑似乎从不知何处出现。当你观赏这个杰作时，你听到一个最美丽的声音在你耳边说：“谢谢”。\n当你转身去看时，她已经走了。"
 pod1230objectives.103.a: "难道是……？"
 shamed_gangrel_modifier: "受辱的冈格罗"
 shamed_gangrel_modifier_desc: "妥芮朵找回了命运石板，并杀死了吉尔伽美什和恩奇都。这对所有冈格罗来说是一个巨大的耻辱。"
 pod1230objectives.104.a: "玫瑰在绽放"
 pod1230objectives.104.b: "谎言和欺骗！"
 pod1230objectives.105.t: "新的时代"
 pod1230objectives.105.desc: "数个世纪以来，妥芮朵[Clan|E]的命运一直与君士坦丁堡和它的幻梦交织在一起，但米迦勒在第四次十字军东征中的毁灭迎来了变化。\n抛开罗马帝国的废墟，妥芮朵受到了法兰西及其新兴的国家和文化的冲击，那里充满了诗人、艺术家和其他创造性的思想。从梵卓手中确有该地区的安全需要时间，而让妥芮朵团结在一个唯一的领袖身后更是需要时间，但现在已经完成了。\n不管是好是坏，法兰西和妥芮朵[Clan|E]现在都是一体的，在可预见的未来，他们的命运将被共享。"
 pod1230objectives.105.a: "新的家园"
 french_toreador_modifier: "法兰西即妥芮朵。妥芮朵即法兰西。"
 french_toreador_modifier_desc: "法兰西和妥芮朵氏族的命运现在被内在地联系在一起。"
 breton_opinion: "布列塔尼人好感"
 pod1230objectives.106.a: "哈，联合起来的艺术家！"
 pod1230objectives.106.b: "新的家园？"
 pod1230objectives.107.t: "殊途"
 pod1230objectives.107.desc: "天军再次伫立于世，所有的[GetTrait('shih').GetName( GetPlayer )]都跟随于你。天军曾经是这个世界上有史以来最强大的猎人势力，却因颓废和腐化而陨落，导致你们中最有德行者为了更大的善而摧毁了它。\n许多人担心同样的错误会再次发生，但你向他们保证，你善于此道。\n时间会证明一切。"
 pod1230objectives.107.a: "战！"
 pod1230objectives.107.a.tt: "你将不再能使用“先思后行”决议。"
 pod1230objectives.107.b: "让我们遵守旧道。"
 pod1230objectives.256.necromancy: "亡灵术。好指挥死者"
 pod1230objectives.256.abombwe: "阿本威。以行于黑夜"
 pod1230objectives.115.t: "窃取智慧"
 pod1230objectives.115.desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]老祖说到，蛮族瞾喇得到了[GetScriptedCharacterByHistoryID('791111').GetFirstName]的指导来取得龙泪之力，但他本身的缺陷使他无法掌握这种力量，他的魄腐蚀了它。当[GetScriptedCharacterByHistoryID('791111').GetFirstName]看到他弟子的缺陷并把他赶走时，叛徒离开了西方，在他的追随者中分享该力量的衍生形态。\n他后来离开了印度，但留给你的任务是完全掌握$pod_wan_kuei$最严密的秘密。你终于完成了这任务，使瞾喇感到自豪……所有“东方血族”从现在起对你会更加敌视。"
 pod1230objectives.115.a: "读书人的事，能算偷么？"
 wisdom_stealer_modifier: "窃智大盗"
 wisdom_stealer_modifier_desc: "你将能使用龙泪。"
 unlock_chiiumuh_tooltip: "你将能使用龙泪。\n解锁$awake_hun_and_po_objective_decision$[decision|E]"
 pod1230objectives.116.t: "白虎再统一"
 pod1230objectives.116.desc: "强大的“西皇朝”一直受到派系主义的阻碍。相互竞争的屋室像军阀一样统治着自己的封地，长期以来，由于每个人都对范女皇怀有深深的敬意，才避免了彻底的分裂。然后，突然，她消失了。\n白虎皇朝随后正式分裂成相互斗争的党派，哪怕范的继承人笨拙地试图维持团结。从那时起，许多人试图为西皇朝带来和平，但他们都失败了。\n然而，这段时间已经过去了，你坐上了皇座，再次巩固了白虎皇朝，它终于成为诸至尊皇朝的平等伙伴。"
 pod1230objectives.116.a: "白虎重啸。"
 pod1230objectives.117.t: "亡者律令的终结"
 pod1230objectives.117.desc: "卡戎已经投降，亡者律令不再存在，现在你可以在闲暇时与任何生者互动。"
 pod1230objectives.117.a: "让每一天都成为鬼节。"
 the_gravedigger_of_dictum_mortuum: "亡者律令的掘墓人"
 pod1230objectives.123.t: "玄武已存"
 pod1230objectives.123.desc: "玄武皇朝，也叫流浪皇朝，是[fourth_age|E]的五大至尊皇朝之一。它涵盖了东亚北部，因此代表了北边的方向。\n随着蒙古人的崛起，黑龟皇朝追着他们进入中国，在那里他们与其他至尊皇朝发生了冲突。他们与南方的接触也表明他们的队伍中有几个恶鬼。随着越来越多的恶鬼发现，玄武皇朝派出了他们的大军对付他们。许多屋室在攻打中被击溃，他们的成员被折磨，最后变成了恶鬼。\n所有的希望似乎都破灭了，直到你成功地联合了剩下的纯正的$pod_wan_kuei$，并消除了安达和恶鬼在草原上的侵扰。玄武再次站立起来，而时代之轮已经放缓。"
 pod1230objectives.123.a: "我们将不会再堕落。"
 pod1230objectives.256.visceratika: "石变术。以律令大地"
 pod1230objectives.256.temporis: "时光术。以操控时间"
 pod1230objectives.124.t: "关于布鲁赫的真相"
 pod1230objectives.124.desc: "很久以前，布鲁赫[Clan|E]是学者和哲学家的灯塔。后来，特洛伊尔来了，她对我们的创始人做出了令人发指的行为，为我们曾经高贵的世系的衰落铺平了道路。从那时起，特洛伊尔的势力越来越大，只有我们的及时干预才将世界从他们在迦太基的憎恶仪式中拯救出来。\n然而，我们并没有就此止步。传播真相花了我们不少时间，也不少时间说服特洛伊尔最忠实的追随者，但现在已经成了。当我们站在迦太基废墟上看守叛徒的安息之地时，我们宣布：所谓的“布鲁赫”，特洛伊尔的子嗣们，现在是时候加入真正氏族，抛弃你们被诅咒的世系了。我们真正氏族已经准备好张开双臂欢迎你们加入……如果你们试图依附于你们背信弃义的先祖，则拔出刀来。请做出选择。"
 pod1230objectives.124.a: "张开你的双臂……"
 pod1230objectives.124.b: "……或拔出你的刀？"
 pod1230objectives.125.a: "叛军不再？"
 pod1230objectives.125.b: "这不是真的！"
 pod1230objectives.256.dementation: "疯狂术。以利用疯癫"
 pod1230objectives.256.melpominee: "魔音术。音即是力。"
 pod1230objectives.256.spiritus: "精魂术。与兽灵互动"
 pod1230objectives.256.valeren: "魂健术。以使用第三眼"
 pod1230objectives.256.quietus: "寂灭术。以操控血液"
 pod1230objectives.256.mytherceria: "仙灵术。源自妖精的力量"
 pod1230objectives.126.t: "援助兴光者"
 pod1230objectives.126.desc: "木乃伊对你们这些人来说是个谜。这些实体显然来自原始教徒，对最伟大者没有什么敬畏之心，但他们对信仰之地的更大利益的贡献怎么强调都不过分。\n困难时期需要务实的解决方案，而你选择忽略他们关于古埃及神灵的神秘废话，转而专注于更有战略意义的事情。尽管他们有很多缺点，但他们肯定是强大的，而且对如何猎杀受诅咒的吸血者知道得很多。这个奇怪的联盟已经结出了果实，你们两个组织都从中受益了。目前而言是一个可以接受的状态。\n这奇怪组织的首领自称荷鲁斯，他提议加入他们的行列。你对这个提议很不确定，这很可能会削弱你的组织。另一方面，真正的永生并不是随处可得的……\n感觉到你内心的冲突，荷鲁斯提供了一个替代方案，一份简单的灵药，会给你延长寿命，而仍然让你保持身份。选择权最终在你手中。"
 pod1230objectives.126.a: "简单的灵药就够了，谢谢。"
 pod1230objectives.127.t: "解放恸鸣"
 pod1230objectives.127.desc: "恸鸣来自于卡巴天房内的黑石，其始于先知穆罕默德征服麦加之后，人们普遍认为它是真主力量的显现。被污染的超自然，如吸血鬼，会觉得恸鸣是一种喧嚣的哀号和尖啸。在其历史上，恸鸣只停止过一次，那是在950年，当伊斯兰教派卡尔马特派的成员偷走了黑石。这使得吸血鬼塔利克能够建立起术法封印，限制住一部分恸鸣，尽管他们不能完全压制它。\n凭借你新发现的知识和对该地区的净化，你能够移除塔利克的仪式并再次释放信仰的力量。被污染的超自然，如吸血鬼，将再次感受到恸鸣的哀号和尖啸。他们被迫离开阿拉伯，但愿是永远离开，而你们的军队只需在空城行军，就能重新建立秩序。这是信徒们的巨大胜利。"
 pod1230objectives.127.a: "真主已言！"
 pod1230objectives.128.t: "编织者的认可"
 pod1230objectives.128.desc: "对大多数猎人来说，被称为塔夫尼的波斯法师是一个谜。这些“巨灵大师”非常……华而不实，喜欢炫耀他们（可以说是令人印象深刻的）魔法力量。对精诚兄弟社来说，幸运的是他们坚定地站在“善”的一方，特别憎恨吸血鬼，认为吸血鬼是某种“大伪”的一部分。\n你们最近为了解吸血鬼的神秘本质所做的努力，以及你们为击退来自中东的吸血鬼所做的更世俗的努力，赢得了他们的关注。他们派来了老师，帮助你把对神秘力量的基本理解正规化，使之成为更有用的东西。\n希望你将来能把这种新发现的力量传授给你的家人，为你今后无休止的战斗再添一把利器。"
 pod1230objectives.128.a: "长久的友谊？"
 pod1230objectives.107.a.tt2: "你将能在大裁判事件后使用[empire|E][GetPlayer.GetFaith.Custom('GHWName')][casus_belli|E]。"
 pod1230objectives.256.chimerstry: "虚幻术。将幻象施加于现实。"
 pod1230objectives.256.thinbloodalchemy: "淡血炼金术。以制造血配方。"
 pod1230objectives.130.t: "觉醒魂魄"
 pod1230objectives.130.desc: "为了破译魂魄之秘，你会见了开封的犹太万鬼，研究了“看不见”现象，探索了黄泉与[yomi|E]，以及在须弥山找到了曾为$pod_wan_xian$总部的寺庙群。\n现在你已经理解转生，觉醒魂魄，并真正成为了$pod_wan_kuei$！这就是你的目标。\n也许这就是扫罗多年前寻找的东西，也许你甚至比他做得更好。你现在是独一无二的，是两个非常不同的世界之间的联系。"
 pod1230objectives.130.a: "我实现了不可能的事。"
 pod1230objectives.131.t: "共同猎魔"
 pod1230objectives.131.desc: "虽然裁判所和边防军有相同的目标，即清除世界上的超自然现象，但两者之间的摩擦却很常见。1204年的事件在边防军猎人们的记忆中仍然是新鲜的，伤口还没有愈合。不信任往往变成了赤裸裸的敌意，魔鬼的爪牙们因猎人互猎而嘲笑。\n然而，现在不一样了，因为边防军已经在基督教的传统席位上取得了主导地位。新有了首要地位，东正教的猎人们将他们的天主教兄弟们置于他们的统治之下，将基督教世界的战士们统一在一个比以前更强大的势力之下。当亲眼目睹基督徒猎手们新发现的团结力量时，恶魔和怪物们很快就会吓得发抖。"
 pod1230objectives.131.a: "暗影裁判所已被纳入麾下！"
 pod1230objectives.132.t: "精通塔木德秘经"
 pod1230objectives.132.desc: "塔木德秘经是保存最完好的民长遗物，汇集了早期民长的教义和论点。这些集大成者的智慧也非常复杂，从未被当代人完全理解。然而，在你的努力下，这种状况得到了改变，当代民长得以重新发现卡巴拉派民间魔法的秘密。\n你对这一古老智慧的诠释精炼易懂，你相信下一代猎人一定能轻松掌握这些曾经被认为是精英才能掌握的秘密。"
 pod1230objectives.132.a: "无限的无尽。"
 pod1230objectives.87.sucess: "永生在等待！"
 pod1230objectives.87.fail: "不不不！"
 pod1230objectives.87.fail.tt: "你失败了，但你获得一部分的血之力，允许你获取[elder_perk|E]且你可以在该修正消退后再次尝试仪式。"
 pod1230objectives.89.b: "我们的模范。"
 pod1230objectives.256.bardo: "中阴术。否定心兽。"
 pod1230objectives.135.t: "石变术的诞生"
 pod1230objectives.135.desc: "作为对土石和由此制成的事物的天然亲和力的延伸，石变术对于石像鬼来说，是这些生来就有的力量的系统化总结。长期以来，他们一直受到睿魔尔的迷惑，迄今为止还无法真正理解这种亲和力，但最近情况发生了变化。在一位富有创新精神的个体的带领下，这奇特能力终于像野火一样在石像鬼之间迅速传播，以石变术为名。一门新的技艺加入到了血之力的行列中。"
 pod1230objectives.135.a: "土与石的主宰。"
 pod1230objectives.136.t: "石变术的诞生"
 pod1230objectives.136.desc: "作为对土石和由此制成的事物的天然亲和力的延伸，石变术对于石像鬼来说，是这些生来就有的力量的系统化总结。长期以来，他们一直受到睿魔尔的迷惑，迄今为止还无法真正理解这种亲和力，但最近情况发生了变化。在一位富有创新精神的个体的带领下，这奇特能力终于像野火一样在石像鬼之间迅速传播，以石变术为名。一门新的技艺加入到了血之力的行列中。"
 pod1230objectives.136.a: "土与石的主宰。"
 pod1230objectives.137.t: "石变术的诞生"
 pod1230objectives.137.desc: "传闻[visceratika_creator.GetFirstNameNoTooltip]创造了一门新的血律，名为[GetTrait('visceratika').GetName(GetNullCharacter)]。\n作为对土石和由此制成的事物的天然亲和力的延伸，石变术对于石像鬼来说，是这些生来就有的力量的系统化总结。长期以来，他们一直受到睿魔尔的迷惑，迄今为止还无法真正理解这种亲和力，但最近情况发生了变化。在一位富有创新精神的个体的带领下，这奇特能力终于像野火一样在石像鬼之间迅速传播，以石变术为名。一门新的技艺加入到了血之力的行列中。"
 pod1230objectives.137.a: "更多能学的能力？"
 pod1230objectives.137.b: "我们的血系欣欣向荣。"
 pod1230objectives.7000.t: "不再苦恼"
 pod1230objectives.7000.desc: "你的挣扎结束了。\n\n困扰你已久的诅咒终于烟消云散。"
 pod1230objectives.7000.a: "终于……"
 pod1230objectives.7000.tt: "你受到的诅咒消除了。"
 pod1230objectives.126.b: "真正的永生？行……"
 become_mummy_ikwan_tt: "你将成为木乃伊，这将从根本上改变你的游戏流程，使你的建筑失效，并摧毁你的最高头衔。\n如果你还没有做好准备，这很可能会削弱你的战役。"
 pod1230objectives.138.t: "蒙古秘胜"
 pod1230objectives.138.desc: "巧什把阿秃儿的起初只是一个小小的计划，是大汗亲自创建的保护措施，亲眼目睹了超自然力量的可怕。巧什出色地完成了这项任务，收集信息，甚至与最可靠的超自然存在建立了联盟。利用蒙古帝国及其后继国家的强大力量，巧什的团队逐渐发展成为一个团结一致的准军事力量，致力于保卫人民。\n一次又一次的胜利，猎人们成功消除了安答和其他草原怪物的恶劣影响，直到蒙古的核心地区最终被认为是安全的。\n随着这一胜利和安答的崩溃，关于东方潜在入侵的传言已经消失，把阿秃儿的领导者们现在正在考虑未来。他们应该像他们的祖先一样向西进发，但这一次带领着一支强大的猎人队伍？还是应该巩固与友好的草原化形者的联盟，为未来的更多挑战做准备？"
 pod1230objectives.138.a: "吾等驾驭西方！"
 pod1230objectives.138.b: "我们的联盟让我们更加强大。"
 quincunx_invasion_removed_tt: "本将在1360发生五行宗入侵将不会发生。如果已经发生则无效果。"
 werewolves_friendship_variable_tt: "你将能招募[GetMaA('werewolf_pack').GetName]和[GetMaA('heavenlysuccessors_maa').GetName]。"
 pod1230objectives.139.t: "太阳战神的继承人"
 pod1230objectives.139.desc: "很久以前，一条黑暗巨蛇从天空坠落。这个可憎的生物在太阳燃烧着它的肉体时钻入了地下。太阳赐予史瓦罗格——锻造之神和天火之神——一束神圣的光芒。史瓦罗格创造了达兹博格：太阳战神，所有邪恶的敌人。\n达兹博格追踪巨蛇来到斯拉夫人的土地，他们的战斗令人惊心。他将巨蛇束缚在土地上，但达兹博格知道黑暗军团对他一个人来说太多了，他感到绝望。一个凡人战士走向坐在那里哭泣的神，当他解释绝望的原因时，她责备了达兹博格。她告诉他，战斗的目的并不总是为了取胜，而是要继续战斗。达兹博格的救赎者和战友已经在漫长的岁月中逝去，但战士们仍然聚集在他们的旗帜下。\n战士们与库帕拉的爪牙，包括棘秘魑氏族，有着古老的仇恨。尽管他们是可怕的敌人，大多数战士在成功击杀第一只吸血鬼之前就惨败而死。但你像达兹博格一样不断尝试，你最近的胜利使你的兄弟们比以往任何时候都更加勇敢。"
 pod1230objectives.139.a: "众多胜利中的第一次！"
 pod1230objectives.140.t: "猎人的传承"
 pod1230objectives.140.desc: "尽管你在对抗这个世界上的邪恶中取得了众多的胜利，你已经接受了这个悲伤的事实。无论猎人的技艺如何高超，周围的怪物实在太多了，一个人难以应付。因此，你最近的努力集中在培养下一代猎人，传授给他们你多年来在猎杀怪物过程中积累的丰富经验。\n希望这些重要的知识足以让他们避免你过去犯下的错误，甚至超越你。他们将成为你留给这个世界的遗产，也是你对大敌的最后挑衅。"
 pod1230objectives.140.a: "赢得民心是最重要的。"
 pod1230objectives.140.b: "暴力是唯一的答案。"
 pod1230objectives.140.c: "他们是可以被智取的。"
 pod1230objectives.140.d: "魔法让我们更强大。"
 pod1230objectives.140.e: "神力是我们必须使用的祝福。"
 dynasty_hunter_administrative_modifier: "社交猎人"
 dynasty_hunter_administrative_modifier_desc: "这些猎人在凡人世界到处都有人脉，在需要时总能找到帮助。"
 dynasty_hunter_military_modifier: "战士猎人"
 dynasty_hunter_military_modifier_desc: "尽管他们可能不敌对手，但为了净化这个世界，他们拼尽全力。"
 dynasty_hunter_intrigue_modifier: "暗影猎人"
 dynasty_hunter_intrigue_modifier_desc: "怪物可能隐藏在阴影中，但这些猎人能在该棋局中足以与之匹敌。"
 dynasty_hunter_sorcery_modifier: "术士猎人"
 dynasty_hunter_sorcery_modifier_desc: "这些猎人是民间魔法的大师，他们利用这些令人印象深刻的力量与黑暗作战。"
 dynasty_hunter_theurgist_modifier: "神通术师猎人"
 dynasty_hunter_theurgist_modifier_desc: "这些猎人被灌注了神圣的力量，能用天堂之力攻击他们的敌人。"
 pod1230objectives.141.t: "尸幕受护"
 pod1230objectives.141.desc: "乔凡尼家族已被除掉，他们破坏尸幕的计划已不复存在。他们的骨灰是对任何试图侵犯冥河城的生者或死者的警告。然而，作为冥河城的执行者，你的工作从未停止。总会有一些傻瓜违反亡者律令，而你也会一直在那里让他们后悔。"
 pod1230objectives.141.a: "尸幕受到我的保护。"
 the_enforcer_of_dictum_mortuum: "亡者律令的执行者"
 pod1230objectives.142.t: "卡戎"
 pod1230objectives.142.desc: "“卡戎派学者”认为，领导亡者帝国的卡戎和恶魔卡戎（据称是冥界的创造者）是同一个人。尽管你尽了最大努力，但还是找不到足够的证据来证明这一点，坦白说，可能只是恰好同名。不过，你的努力没有白费，你取得了伟大的镰刀希克洛什，并在其中注入了从你发现并驯服的纯粹恶魔之力，在这个过程中，你创造出一件无双的武器。"
 pod1230objectives.142.a: "也许有一天我会知道真相。"
 pod1230objectives.144.desc: "大约于[fourth_age|E]早期，那些接受了新的魔化状态并试图接纳它的堕落$pod_wan_xian$组成了魔武帝国。魔武帝国内斗不断，且与那些没有加入他们的$pod_wan_kuei$对抗，试图将所有谪仙纳入他们的行列。它的成员多种多样，其中有单纯追求权力的，也有试图接纳上天赋予他们的新身份的。\n魔武帝国遭到了五帝的反对，他们（华鹤道的先行者）聚集在一起，认为$pod_wan_xian$的原始使命并没有从他们身上夺走。五帝的力量足以镇压魔武叛乱，但却无法彻底消灭他们。为了尽量避免冲突，五帝创造了无上法则，为所有堕落的$pod_wan_xian$制定了规则。\n[GetScriptedCharacterByHistoryID('791111').GetFirstName]的出现促进了五帝的努力，他的学说综合了五种回天之道，并进一步完善了五大正道。魔武帝国的赞同者们叛向了新的教导，并将其应用到自己的哲学中。\n在皇朝中，魔武帝国是对[GetScriptedCharacterByHistoryID('791111').GetFirstName]的教导之前的蛮荒时代的模糊记忆。然而，一些魔虎却一直在寻求回到帝国的时代，他们组成了灼风教派，试图创建一个没有皇朝束缚的新魔武帝国。"
 pod1230objectives.144.a: "天魔再世"
 pod1230objectives.145.t: "兵贵神速"
 pod1230objectives.145.desc: "纪元之轮似乎停了……一会儿。"
 pod1230objectives.145.a: "我需要做更多。"
 pod1230objectives.146.t: "转轮"
 pod1230objectives.146.desc: "你真的停下了轮回吗？还是只是被命运捉弄，最终在未来回到原处？只有时间才能告诉我们答案。"
 pod1230objectives.146.a: "我做到了！"
 pod1230objectives.147.t: "逆转轮回"
 pod1230objectives.147.desc: "你真的停下了轮回吗？还是只是被命运捉弄，最终在未来回到原处？只有时间才能告诉我们答案。"
 pod1230objectives.147.a: "我做到了！"
 pod1230objectives.148.t: "无愧"
 pod1230objectives.148.desc: "你带回了大熊，凶民因此同意与$pod_wan_kuei$议和。"
 pod1230objectives.148.a: "我做到了！"
 pod1230objectives.149.t: "解除太阳诅咒"
 pod1230objectives.149.desc: "你的祭品已经通过了天门，八仙已经与朱后和黑龙会面。你的请求被接受了，至少现在是这样。"
 pod1230objectives.149.a: "我做到了！"
 pod1230objectives.150.t: "小神纪元"
 pod1230objectives.150.desc: "你的祭品已经通过了天门，八仙已经与朱后和黑龙会面。你的请求被接受了，至少现在是这样。"
 pod1230objectives.150.a: "我做到了！"
 pod1230objectives.151.t: "回到第三纪元"
 pod1230objectives.151.desc: "你真的停下了轮回吗？还是只是被命运捉弄，最终在未来回到原处？只有时间才能告诉我们答案。"
 pod1230objectives.151.a: "我做到了！"
 pod1230objectives.152.t: "击溃绝壁"
 pod1230objectives.152.desc: "随着人类对世界控制的削弱，世界之间的绝壁也被削弱了。百足的仆人们已经被净化，不会再为他们的上主提供任何邪恶的帮助。现在，只要剪断你握着的灵丝，百足就能获得自由……但时机未到。"
 pod1230objectives.152.a: "再坚持一会"
 pod1230objectives.153.t: "封上绝壁"
 pod1230objectives.153.desc: "所有恶秽、所有怪异、所有魔邪都已被放逐。现在，你只需等待阎魔们虚弱到足以击碎[yomi|E]。"
 pod1230objectives.153.a: "稍等……"
 pod1230objectives.154.t: "浸染者"
 pod1230objectives.154.desc: "在全宇宙中最神圣的须弥遗迹上，神圣再次降临这个世界。凡人被浸染了神性火花，这是很久以前就注定的。他们需要时间才能真正掌握新发现的力量，但你们已经为人类的扬升铺平了道路，使其变得更加伟大。"
 pod1230objectives.154.a: "扬升开始了。"
 pod1230objectives.155.t: "擢颂"
 pod1230objectives.155.desc: "准备就绪。中原已经统一，朱后和玄龙将被神力精华浸染的凡人派遣给了我们；玉皇大帝实际上的正在注视着我们。我们将摧毁[yomi|E]和[ebon_maze|E]，终结一切地狱；我们将打破蜘蛛的绝壁和缚网，恢复百足的理智。我们将成为……尊者！"
 pod1230objectives.155.a: "擢颂"
 pod1230objectives.90.t: "亚伯"
 pod1230objectives.90.desc: "大祖母真在遥远但戒备森严的记忆之塔中隐藏着什么。为了分散她的注意力，你在其他地方发动了大规模进攻，并在塔中找到了一位被白色裹尸布包裹着的死灵，他被锁在一个记忆支架上，这个支架迫使他不断地消失和重现。当你找到并释放他时，他向你表示感谢，并介绍自己叫亚伯。\n我们无法确定这死灵与圣经中的亚伯有多接近，但他知道自己是第一件谋杀案的受害者。他解释说，因为他是许多生命提前结束的人中的第一位，所以他实际上是一个单向阀，可以将活人世界的任何地方输送到[shadowlands|E]的任何地方，包括直接通往大祖母本人。如果他这样做，你就可以通过这个扭曲的[GetModifier('nihil_modifier').GetNameWithTooltip]引导一大股生命之力，你就可以让大祖母平静下来，甚至可能一劳永逸地消灭她。"
 pod1230objectives.90.a: "消灭大祖母。"
 pod1230objectives.90.b: "平静大祖母。"
 pod1230objectives.156.t: "阿兹·达哈卡"
 pod1230objectives.156.desc: "一般而言，除了少数显眼的例外，棘秘魑并不倾向于虔诚信仰某物。当你可以将自己塑造为神时，为何要崇拜某个彼方的神灵呢？他们不是真正的神明，也没有真正的教义。易变涅槃是氏族超验主义的象征、图腾和焦点。\n从魔龙到伊卢扬卡什，从德古拉到利维坦，龙的形象深深嵌套于棘秘魑的神话中。凡人畏惧的东西，正是我们所追求的——并非龙的字面或物理形态，而是龙作为变革者的象征。我们追求超凡的境界，行走在易变涅槃蜿蜒的螺旋中，凝视它的无数张口与双眼。在混沌与永恒交织的运动中，我们会找到龙的跳动之心，并尽情吸取其中的力量。\n隐喻得以具现，谜题化为血肉。易变涅槃是我们无神、异类灵性中的翼手天使。"
 pod1230objectives.156.a: "我即永恒变化之龙。"
 pod1230objectives.157.t: "幽邃深渊"
 pod1230objectives.157.desc: "经过诸多准备与牺牲，你终于到达了这里。这深渊的最深处，亘古无光之地。然而，你没有时间去思考，因为你的灵魂正在迅速衰败。你必须立刻采取行动，否则就有可能变成这片永恒之地中无数游荡亡魂之一。"
 pod1230objectives.157.a: "我的意志将束缚利维坦。"
 pod1230objectives.157.a.t: "你将在战时解锁[character_interaction|E]召唤[GetMaA('the_leviathan').GetName]的能力。"
 pod1230objectives.157.b: "我将深渊的知识倾注己身。"
 pod1230objectives.157.b.t: "你将解锁两种强大的深渊秘术$pod_bs_rituals$。"
 pod1230objectives.158.t: "不洁飞升"
 pod1230objectives.158.desc: "纳姆塔尔的副官们，即德查尼，显然已经听说了你试图通过杀死他们中的一位来加入他们行列的计划。他们对你所构成的威胁非常认真，毕竟像你这样野心勃勃的崇魔者在过去曾成功过。\n其中一位已经站出来，提议与你进行一场和平的谈话，讨论你计划的各种潜在替代方案。这场“谈话”的地点已经决定。这可能会为你提供一个比预期更容易接近他们的绝佳机会。"
 pod1230objectives.158.a: "羊主动入虎口？"
 pod1230objectives.158.a.t: "你将等待指定的日期，并与德查尼的代表进行谈话。"
 pod1230objectives.1581.t: "地狱协议"
 pod1230objectives.1581.desc: "德查尼正如约等待着你。纳姆塔尔的地狱副官带来了一个诱人的提议：放弃你篡夺他们地位的野心，转而接受他们不容小觑的一部分力量。毕竟，恶魔的力量正是你所追求的。\n他们的提议隐藏着威胁，如果你拒绝，他们将不得不采取更加暴力的方式来‘说服’你。双方都已做好准备，德查尼是强大的存在，战斗结果无法预料。"
 pod1230objectives.1581.a: "我们可以达成协议。"
 pod1230objectives.1581.a.t: "你将获得德查尼的一部分力量。"
 pod1230objectives.1581.b: "...但我想要全部！"
 pod1230objectives.1581.b.t: "你将开始战斗，吞噬他们的灵魂和力量。"
 pod1230objectives.1581.sucess: "你赢了，现在准备好领取你的奖品。"
 pod1230objectives.1581.failure: "你输了，你的灵魂将成为这位德查尼的力量燃料。"
 pod1230objectives.159.t: "追寻萨尔贡圣典"
 pod1230objectives.159.desc: "萨尔贡圣典是一块由卡帕多修斯在凡人时期写就的泥板。在他经历了[Embrace|E]之后，因失去了他的化身，他的记忆陷入了混乱与破碎之中。他无法记起自己曾写下的内容，也不记得将其留在了何处。历经千年，萨尔贡圣典被毁，其残页散落世界各地。若有人能将其修复，将会获得巨大的力量。\n\n看起来你远不是第一个尝试这件事的人。你的研究表明，卡帕多修斯疏远的子嗣拉撒路曾经进行过和你相同的旅程。在那个时候，圣典仍然完好无损……但这使得它更加危险，因为换取终极知识的代价往往会压倒一个人的理智。拉撒路选择破坏圣典的一个部分，并在几个世纪里慢慢研究。就在他几乎快要完成时，他的氏族成员康斯坦西娅和马库斯·穆萨·乔凡尼阻止了他。随后的战斗导致圣典爆炸，碎裂成多个碎片并很快被分散到世界各地。\n这就是你寻找的起点。"
 pod1230objectives.159.a: "知识高于一切"
 pod1230objectives.1591.t: "萨尔贡圣典"
 pod1230objectives.1591.desc: "现在，我离神性仅一步之遥。只需再向前一步，我便将完成连卡帕多修斯都未曾做到的事情，夺回那因该隐诅咒而从我们身上抹去的神性火花。我将成为那唯一的存在，既被祝福又被诅咒……但因此而变得更加强大。"
 pod1230objectives.1591.a: "神化之道"
 pod1230objectives.1591.a.tt: "#weak  你将解锁魔法#!\n#X @warning_icon!由于法师尚未发布，奖励略有不同#!"
 pod1230objectives.1592.t: "火焚末日：宁静"
 pod1230objectives.1592.desc: "与许多同时代的古老者不同，卡帕多修斯渴望超越他作为上古耆宿所拥有的力量。他对知识的追求是无尽的，他的整个世系都被培养以实现这一目标。数千年来，学者们一直为此努力。在《萨尔贡圣典》、《弥赛亚的幽灵》、亡灵术以及冥界深处的探寻中，他们找遍了每一处。\n\n终于，它被发现了。\n\n你首先感受到的是一股能量的激增，那是一种你久已失去的活力。卡帕多修斯本人认可了你在这一发展中的关键角色，并奖励了你，感谢你使他能够实现不可能。你的思维扩展并飞速运转，他所学到的所有知识瞬间涌入你的脑海。你的精血在尖叫，你的思想在咆哮，心兽在嚎叫，周围的存在开始旋转。凭借仅仅是思维，你就能感受到你所学的知识正在按你的意志塑造世界。在你成为更伟大的存在之前的最后一刻，你露出了微笑，品尝到你野心的果实，宛如最甜美的蜜露。"
 pod1230objectives.1592.a: "他的国降临。"
 pod1230objectives.1592.a.tt: "存在与虚无现在都展现在你面前。你能品尝到这一切。是时候将这一切抛诸脑后了。"
 pod1230objectives.1593.t: "火焚末日：风暴"
 pod1230objectives.1593.desc: "卡帕多修斯发现了连该隐都无法忽视的某种存在。如此可怕的东西，甚至连黑暗之父也不敢想象它的存在。而最初者的愤怒即将降临。该隐已经到来，他将对那些迷途的子嗣施加他的惩罚，或许还会对亚当与夏娃的所有后代发泄他的怒火。这个惩罚将会 #R 通过鲜血长河来施加#!"
 pod1230objectives.1593.a: "#R 在鲜血的长河中。#!然而我们仍将崛起。"
 pod1230objectives.1593.a.tt: "终结已至，但这对你而言已无关紧要。该隐已不再是你的忧虑。卡帕多修斯在召唤你。无论该隐将做什么，你都已准备好面对他可能释放的任何愤怒。无限在等待着你。"
 pod1230objectives.160.t: "解密会：伟大谜题"
 pod1230objectives.160.desc: "解密会旨在通过面对那些不可想象和壮丽的事物，例如上帝、时间、宇宙的全貌或是该隐本身，来消除末卡维的疯狂。每一个谜团都值得寻找解决方案。"
 pod1230objectives.160.a: "我将解决所有谜题！"
 pod1230objectives.1601.t: "解密会：清醒时刻"
 pod1230objectives.1601.desc: "吸收大量的知识使你更加接近解密会的目标，即理解世界，直到真正与其融为一体。每解开一个谜团，你都能感受到自身神性潜力的觉醒。通过将自己交付于理性与知识，你得以一窥那最伟大的奖赏：清醒。"
 pod1230objectives.1601.a: "我#weak 感觉#!不一样了？"
 pod1230objectives.1601.a.tt: "你身上发生了某种变化，该隐诅咒对你的束缚正在削弱。"
 pod1230objectives.1602.t: "解密会：真正的神性"
 pod1230objectives.1602.desc: "真正的知识将你带到了一个新阶段，在那里你摆脱了该隐血脉中的诅咒和疯狂。也许这是对神性的瞥见，通过末卡维的形象重生，或者仅仅是他通过你来传递的能量，使你第一次真正清晰地看到。在最后的最后，夜晚在你面前被照亮，你通过自身的存在驱散了无知的黑暗。"
 pod1230objectives.1602.a: "终于自由了？"
 pod1230objectives.1602.a.tt: "你将再也不会遇见你的[beast|E]。"
 pod1230objectives.161.t: "狂喜会：痛苦与愉悦"
 pod1230objectives.161.desc: "狂喜会认为真正的疯狂正是凡俗状态本身。在他们看来，心兽才是真正的神圣造物，因此必须倾听和安抚。理解它是理解上帝和自我的关键。"
 pod1230objectives.161.a: "剧烈的情感波动。"
 pod1230objectives.1611.t: "狂喜会：清醒时刻"
 pod1230objectives.1611.desc: "如果心兽正如狂会派所声称的那样是真正的神性体现，那么它就是全能者的映照。然而，明智的狂喜会成员很快意识到，这并不使它变得不那么危险。若在真正理解它之前被其欲望吞噬，意味着失去一切。痛苦与欢愉只是手段，而非终点。"
 pod1230objectives.1611.a: "我#weak 感觉#!不一样了？"
 pod1230objectives.1611.a.tt: "你身上发生了某种变化，该隐诅咒对你的束缚正在削弱。"
 pod1230objectives.1612.t: "狂喜会：神圣妥协"
 pod1230objectives.1612.desc: "通过频繁地向你的心兽屈服，但同时仍然保持自我意识，你实现了每个狂喜会成员的梦想。你找到了一个足够强大的平衡，以至于心兽不再让你感觉像是一个入侵者。某种程度上，它已经成为你的一部分，不再试图迫使你屈从于它的意愿，而是接受你无论任何情况都会将它的意见纳入考量这一事实。\n这或许不是神性本身，但对一位末卡维来说，可能是更为重要的东西：清醒。"
 pod1230objectives.1612.a: "终于自由了？"
 pod1230objectives.1612.a.tt: "你将再也不会遇见你的[beast|E]。"
 pod1230objectives.162.t: "为恶会：内在黑暗"
 pod1230objectives.162.desc: "作为最隐秘（且异端）的教团之一，为恶会相信该隐之子的本性中存在固有的黑暗。因此，为了治愈他们的疯狂，他们不惜一切极端手段。对于真正被诅咒的人来说，崇魔又算得了什么？"
 pod1230objectives.162.a: "$greatdemon_name_asmodeus$的召唤"
 pod1230objectives.162.b: "$greatdemon_name_dagon$的召唤"
 pod1230objectives.162.c: "$greatdemon_name_azrael$的召唤"
 pod1230objectives.162.d: "$greatdemon_name_belial$的召唤"
 pod1230objectives.162.e: "$greatdemon_name_abaddon$的召唤"
 pod1230objectives.1621.t: "为恶会：清醒时刻"
 pod1230objectives.1621.desc: "该隐的诅咒由于其神圣的本质几乎无法打破。然而，传说中上帝最强大的叛逆天使能够在某种程度上抵消它的影响。显然，与这样的存在打交道并非心智脆弱者所能承受，也不是那些想要保全灵魂者的选择。然而，有些人愿意付出任何代价，只要结果能实现。\n即便如此，地狱总是乐于提供诱人的解决方案。"
 pod1230objectives.1621.a: "我#weak 感觉#!不一样了？"
 pod1230objectives.1621.a.tt: "你身上发生了某种变化，该隐诅咒对你的束缚正在削弱。"
 pod1230objectives.1622.t: "为恶会：地狱契约"
 pod1230objectives.1622.desc: "你的地狱伙伴因你的亵渎之举而感到满意。经过你的努力，他们兑现了契约的一部分，减弱了心兽的力量，抑制了侵蚀你心智的疯狂。\n但结果却……耐人寻味。随着新获得的清明，你终于彻底理解了自己为达成这一成就，你步入了怎样的深渊。如果你的灵魂中曾有一丝神圣的火花，那么它早已熄灭。如今你将永远成为地狱的一部分，但至少你得到了你的回报：清醒的头脑，足以真正反思你所做的一切。"
 pod1230objectives.1622.a: "我终于自由了？或者只是步入了新的囚笼？"
 pod1230objectives.1622.a.tt: "你将再也不会遇见你的[beast|E]。"