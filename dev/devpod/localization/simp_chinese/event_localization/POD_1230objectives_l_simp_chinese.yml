 pod1230objectives.173.desc: "军队通常有特定的招募先决条件。例如，凡人通常是某种战士僧侣，尽管情况并非总是如此。在吸血鬼的世界里，还有更多的可能性。\n一些骑士团以过分维护骑士美德而自豪，只考虑可敬的候选人。\n其他组织，如黑十字骑士团，以将凡人作为招募重心而闻名，通过渗透到组织中寻找潜在的候选人。\n少数则尤其精英化，在接受招募之前有非常严格的先决条件和测试流程。\n有些人根本不关心这些事情，只是欢迎每个哪怕表现出丝毫兴趣的人。\n最后，还有专门的那些只接受特定性别、氏族或信仰的人的团体。"
 pod1230objectives.173.a: "荣耀高于一切。"
 pod1230objectives.173.b: "我们将使用凡人军团作为掩护。"
 pod1230objectives.173.c: "只有最优秀者可以加入我们！"
 pod1230objectives.173.d: "欢迎每个人！"
 pod1230objectives.173.e: "我们有一些特殊的要求。"
