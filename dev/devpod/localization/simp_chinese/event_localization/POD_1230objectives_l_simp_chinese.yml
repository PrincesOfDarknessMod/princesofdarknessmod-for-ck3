 pod1230objectives.257.option.3f:0 "金于上红滴与黑斧为基"
 pod1230objectives.257.option.3g:0 "红于上银滴与银斧为基"
 pod1230objectives.257.option.4a:0 "黑于双红滴安于银颅"
 pod1230objectives.257.option.4b:0 "金于双红滴安于银颅"
 pod1230objectives.257.option.4c:0 "红于双黑滴安于银颅"
 pod1230objectives.257.option.4d:0 "红于双红滴安于银颅"
 pod1230objectives.257.option.5a:0 "黑于红滴同红玉安于银刺冠"
 pod1230objectives.257.option.5b:0 "黑于红滴同红玉安于金刺冠"
 pod1230objectives.257.option.5c:0 "银于红滴同红玉安于黑刺冠"
 pod1230objectives.257.option.5d:0 "银于红滴同红玉安于金刺冠"
 pod1230objectives.257.option.5e:0 "金于红滴同红玉安于黑刺冠"
