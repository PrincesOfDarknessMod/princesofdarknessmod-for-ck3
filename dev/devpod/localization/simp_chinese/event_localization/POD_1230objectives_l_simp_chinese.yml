 pod1230objectives.170.e: "血，血是我的主人。"
 pod1230objectives.222.t: "La Grande Tragédie"
 pod1230objectives.222.desc: "Every tragedy needs a magnum opus, and ours has consumed the realm. All across Francia, the lilies have wilted from our meticulously crafted schemes to inflict despair. The so-called 'Courts of Love' of the degenerate Toreador have turned into a grand, weeping theater. Now, with our tyrannical hold secure and our masterful heirs carrying the melody of our cruelty, the shattered glass of our lineage can finally be brought back together.\n\nAs the curtains fall and we take a bow, I can feel our master smiling at us. I can feel his dark influence coiled around my mind, sharing in the sensation of his endless cruelty. Whether I am now carrying his blessing or have been simply hollowed out to be a perfect vessel does not matter. Ennamaru is reborn in our blood, and the world will soon know his name."
 pod1230objectives.222.a: "Let the curtain fall. Cue the weeping of a broken realm."
 pod1230objectives.223.t: "骨肉大师"
 pod1230objectives.223.desc: "The screaming has finally stopped.\n\nNot because you suddenly decided to show mercy, but because the raw materials that your muses so generously provided finally settled into their intended configuration. The Fiends boast of their war forms, but they are nothing more than ugly beasts. As an artist, however, you know that true art requires suffering, which you have inflicted upon both yourself and your muses a great deal throughout this process.\n\nThe result of your hard work is breathtaking. To look upon your form now is to see an angel, born from bone and blood.\n\nWhat was seen as mere butchery has been elevated to the divine, all thanks to your efforts."
 pod1230objectives.223.a: "完美！"
 pod1230objectives.224.t: "France, Cleansed"
 pod1230objectives.224.desc: "It is done. The demon-worshippers who sought to corrupt this domain have been rooted out and destroyed.\n\nLooking over your lands, the change is already clear. Without the subtle corruption of the Children of Ennamaru and your own Beast firmly leashed by your mortal touchstones, the mortals are free to prosper. Trade flourishes, fields are tended with renewed vigor, and the harmony your kind has had with the kine is resumed. A golden age for France is here."
 pod1230objectives.224.a: "Let the realm flourish under our watch!"