 ashen_caravan_decision: "[ashen_caravan|E]"
 ashen_caravan_decision_tooltip: "如果我要四处旅行，那么最好做好准备。"
 ashen_caravan_decision_desc: "在黑暗世界中游历可谓险象环生。若想浪迹天涯，你需备足物资、地图，更要寻得得力之人相助。"
 ashen_caravan_decision_confirm: "让我们回顾一下现状。"
 initial_ashen_caravan_decision_tt: "你将开启[ashen_caravan|E]特质路线，未来完成运送合约即可提升其等级。"
 ashen_cult_initial_decision: "[ashen_cult|E]"
 ashen_cult_initial_decision_tooltip: "创建自己的密教将开辟新的机会，无论是在精神上的还是其他方面的。"
 ashen_cult_initial_decision_desc: "对于那些未受过教育的人来说，吸血鬼与神关系密切。有些人足够强大或有魅力，甚至可以愚弄自己的同类。也许你可以成为他们中的一员。"
 ashen_cult_initial_decision_confirm: "被崇拜听起来不错。"
 initial_ashen_cult_decision_tt: "你将开始你的[ashen_cult|E]特质路线，允许你解锁这个决议的新版本来使用和提升它。"
 initial_ashen_cult_prerequisites_tt: "你需要5个或更多与你相同信仰的廷臣。"
 POD_cult_visited_modifier: "邪教访问"
 ashen_cult_later_decision: "[ashen_cult|E]"
 ashen_cult_later_decision_tooltip: "应当有更多人知道真相。"
 ashen_cult_later_decision_desc: "当你的教团在某个地区扎营时，你可以利用这段时间在当地人中发展信徒，或是善用你的存在来达成建设性或破坏性的目的。"
 ashen_cult_later_decision_confirm: "来吧，聚集过来！"
 ashen_cult_decision_tt: "你将获得与你当营地所所在领地相关的机遇。这些机遇会因该地区是否已皈依你的信仰而有所不同。"
 POD_county_defenses_weakened_modifier: "脆弱的防御"
 POD_county_diligent_populace_modifier: "受感召的民众"
 pod1230objectives.176.desc: "教团在某地区的存在往往是一股极具破坏性的力量。当地势力很少会直接与之对抗，因为在家门口开战的代价往往得不偿失。有些人则希望与教团达成和解，如果双方观点一致，这种和解会更容易实现。\n无论如何，民众往往对教团领袖的言论趋之若鹜。拥有超自然力量、非凡魅力与智慧，再加上一群狂热信徒的追随，这些足以让迷信的平民百姓心生敬畏。"
 pod1230objectives.176.a: "聆听真理吧！"
 pod1230objectives.176.b: "你们的领主是地狱孽种！"
 pod1230objectives.176.c: "不要抗拒即将到来的命运！"
 pod1230objectives.176.d: "驻足片刻，聆听教诲。"
 pod1230objectives.176.e: "祈祷并努力工作"
 pod1230objectives.176.f: "感谢您的捐赠"
