 pod1230objectives.174.desc: "军队通常采用适合其目的以及可能的敌人的战斗风格。吸血鬼骑士团也不例外，从纪律严明的黑十字骑士团到四处游荡的伍兹野人战帮。作为这个新组织的大师，你有权力引导它按着你喜欢的策略发展。"
 pod1230objectives.174.a: "秩序和纪律"
 pod1230objectives.174.b: "野蛮的攻击者！"
 pod1230objectives.174.c: "我们将迎战我们的敌人。"
 pod1230objectives.174.d: "一个均衡的方法"
 pod1230objectives.174.e: "小股精英部队"
 ashen_grandmaster_holy_war: "[ashen_grandmaster|E]：圣战训练"
 ceilican_knights_tt: "你必须拥有 5 位或更多骑士，并且他们的勇武至少为 30。"
 military_order_fully_upgraded_tt: "你的军队的这个分支已经升级完全了！"
 ashen_grandmaster_leveling_up_cause_tt: "你将升级你的军队的核心准则。"
 pod1230objectives.175.a: "专注于我们的核心准则。"
 pod1230objectives.175.b: "改善我们的征兵手段"
 pod1230objectives.175.c: "专注于训练"
 pod1230objectives.175.desc: "你的军队已经具备这三个准则了。"
