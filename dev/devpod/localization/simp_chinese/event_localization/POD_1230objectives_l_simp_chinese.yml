 pod1230objectives.257.option.6b:0 "黑于红滴安于金蜘蛛"
 pod1230objectives.257.option.6c:0 "银于红滴安于黑蜘蛛"
 pod1230objectives.257.option.6d:0 "银于红滴安于金蜘蛛"
 pod1230objectives.257.option.6e:0 "金于红滴安于黑蜘蛛"
 pod1230objectives.257.option.6f:0 "金于红滴安于银蜘蛛"
 pod1230objectives.257.option.6g:0 "红于银滴安于银蜘蛛"
 pod1230objectives.257.option.7a:0 "黑于四红滴成十字与四交叉黑瓣"
 pod1230objectives.257.option.7b:0 "黑于四红滴成十字与四交叉金瓣"
 pod1230objectives.257.option.7c:0 "银于四红滴成十字与四交叉黑瓣"
 pod1230objectives.257.option.7d:0 "银于四红滴成十字与四交叉金瓣"
 pod1230objectives.257.option.7e:0 "金于四红滴成十字与四交叉黑瓣"
 pod1230objectives.257.option.7f:0 "金于四红滴成十字与四交叉银瓣"
 pod1230objectives.257.option.7g:0 "红于四银滴成十字与四交叉银瓣"
 pod1230objectives.257.option.8a:0 "黑于红滴安于双尾银蝎之背"
 pod1230objectives.257.option.8b:0 "黑于红滴安于双尾金蝎之背"
 pod1230objectives.257.option.8c:0 "银于红滴安于双尾黑蝎之背"
 pod1230objectives.257.option.8d:0 "银于红滴安于双尾金蝎之背"
 pod1230objectives.257.option.8e:0 "金于红滴安于双尾银蝎之背"
 pod1230objectives.257.option.8f:0 "金于红滴安于双尾黑蝎之背"
 pod1230objectives.257.option.8g:0 "红于银滴安于双尾银蝎之背"
 pod1230objectives.258.title:0 "转念一想"
 pod1230objectives.258.desc:0 "你真的对你血系的纹章的颜色满意了吗，还是要重新考虑一下？"
 pod1230objectives.258.option.a:0 "重新考虑。"
 pod1230objectives.258.option.b:0 "留下这个。"
 pod1230objectives.258.option.c:0 "让其成为我国图徽！"
 pod1230objectives.91.t:0 "火焰再燃"
 pod1230objectives.91.desc:0 "你的研究结束了。不管你通过不懈的实验从零碎的信息中总结出来的公式是不是真正的希腊之火，这种物质肯定会燃烧得很好。最初的测试已经产生了惊人的结果，这种液体像蜂蜜一样黏，几乎不可能熄灭，它被点燃时覆盖的一切在它停止燃烧之前都将不复存在。虽然最优的发射方法仍然是一个潜在的改进领域，但为你服务的手工艺人已经准备了足够有效的设计。\n当你看着烈火吞噬测试用假人的时候，你感到肩上的重担被卸下了，内心深处你知道那是你所承受的愧疚，即让你的教友们没有足够武器就去对抗地狱。"
 pod1230objectives.91.a:0 "让这火如同我们信仰一般燃烧"
 pod1230objectives.92.t:0 "地平线上之火"
 pod1230objectives.92.desc:0 "最近你经常听到一些奇怪的谣言，说藏身处在几分钟内就被火焰吞噬，血族在自己的休息室里被烧成灰烬，长者们消失得无影无踪。今天你的一个手下证实了这一切都是源于某个猎人组织的新发明。据称，他们重新创造了希腊火的配方，并将其用于陆地上，造成毁灭性的效果。"
 pod1230objectives.92.a:0 "那些白痴的凡人和他们愚蠢的玩具。"
 pod1230objectives.92.b:0 "我希望他们会分享该发明。"
 pod1230objectives.93.t:0 "虔信者回归"
 pod1230objectives.93.desc:0 "自从甘滕宾兄弟被他们可恶的主子强迫逃离君士坦丁堡这座伟大的城市以来，已经过去了许多年，尽管这座城市被蹂躏得满目疮痍，但两兄弟对那些操纵者灌输给他们的教义的信仰也随之遭到破坏，一种新的信仰从灰烬中诞生了。卡洛梅娜的弃民看透了那些自称为她的选民的愚蠢：神圣不能来源于非神圣的东西。长期以来，甘滕宾一直在与那些谎称自己虔诚、被推到文明社会边缘的人斗争，但真正的信仰占了上风。兄弟俩的虔诚让他们和所有准备加入他们的人凯旋而归，回到这座城市，无数的耳朵渴望听到他们的福音。"
 pod1230objectives.93.a:0 "起来，地上的受诅者！"
 pod1230objectives.94.t:0 "宗教狂热漫了君士坦丁堡。"
 pod1230objectives.94.desc:0 "从君士坦丁堡传来的消息说，有个邪教来到了城里，用各种诽谤针对更优者的废话毒害平民的耳朵。他们的污言秽语像一团火一样在城市里蔓延开来，而围绕在他们周围的暴民已经变得越来越多，越来越激动，任何人都无法让他们安静下来。一个被如此盲目的热情所征服的城市会变成什么样子？"
 pod1230objectives.94.a:0 "下流的异端。"
 pod1230objectives.95.t:0 "新的权力中心"
 pod1230objectives.95.desc:0 "午夜的寒风吹拂着你的头发，你脚下的维斯瓦河闪烁着星光。这条河供养的所有生物都归属于你，你所站的城墙保护着它的君主，使其不会被更有用的人取代。你是这片土地的真正统治者，你的帷幄使这片土地比你那自私的喀尔巴阡亲属的任何贫瘠荒凉的采地都更加繁荣和令人羡慕。\n他们很快就会意识到，当面对纯粹的力量时，他们宝贵的血统毫无意义。棘秘魑霸权的冷酷之心现在就处于这里，在瓦维尔山之上。"
 pod1230objectives.95.a:0 "我将撼动群山！"
 pod1230objectives.96.t:0 "北境新贵"
 pod1230objectives.96.desc:0 "关于血族事务最近情况的简报的最后一段引起了你的注意。[victorious_poltzimi.GetUIName]，被你关注的这位显然不再只满意[victorious_poltzimi.GetHerHim]对波兰王国的紧握。[poltzimi.GetSheHe]公开向魔物的长者发起挑战，并要求应其权力和功绩获得对军督领的统治权。连孩子都知道这只会导致战争。"
 pod1230objectives.96.a:0 "好像那些傻瓜的敌人还不够多似的。"
 pod1230objectives.96.b:0 "让[victorious_poltzimi.GetHerHim]来，让我们来看看[poltzimi.GetSheHe]有啥种。"
 pod1230objectives.256.obtenebration:0 "幽暗术。指使暗影"
 pod1230objectives.256.serpentis:0 "古蛇术：用于命令蛇和怪物"
 pod1230objectives.256.daimoinon:0 "崇魔术。来腐化和掌控"
 blood_curse_objective_decision:0 "终结诅咒"
 blood_curse_objective_decision_tooltip:1 "血咒正在撕裂氏族，我们必须采取行动。"
 blood_curse_objective_decision_desc:0 "睿魔尔血咒对我们族人的心灵造成了极大的伤害。我们必须尽我们所能找到一个解决方案。"
 blood_curse_objective_decision_confirm:0 "我们做到了！"
 blood_curse_objective_decision_effect_tooltip:1 "你将解除对你氏族血咒，并顺便羞辱睿魔尔。"
 pod1230objectives.97.t:0 "诅咒已解"
 pod1230objectives.97.desc:0 "这需要你[Clan|E]最博学的成员的努力和大概史无前例的奥秘知识的收集，但它终于完成了：所谓的睿魔尔血咒已被解除，最终使你和你的人摆脱了它的可怕影响。\n除了这一壮举的明显好处外，这也是一个伟大的政治胜利，因为你的同胞们在这段艰难的时期里忍耐了下来，并因此变得更加强大。睿魔尔[Clan|E]本身也开始感受到挫折，由于他们的“完美”诅咒如此公开地被打破，他们被大众嘲笑。\n胜利的滋味很少这么甜。"
 pod1230objectives.97.a:0 "现在谁才是最强的血术士？"
 tremere_blood_curse_removed_tt:0 "睿魔尔血咒将从你的整个[Clan|E]中移除。"
 pod1230objectives.98.a:0 "这将给睿魔尔上一堂关于谦逊的课。"
 pod1230objectives.98.b:0 "啥？怎么？这不可能！"
 tremere_blood_curse_decision_custom:0 "鹰巢，坐落在[GetTitleByKey('b_qazvin').GetNameNoTier]伯爵领的奇观，必须被完全建成。"
 pod1230objectives.99.t:0 "永生赞助"
 pod1230objectives.99.desc:0 "作为一名自豪的妥芮朵，你长期以来一直在你的地区培养艺术家，无论他们是不是凡人。你的宫廷已经成为诗歌、写作、体育和所有其他你认为有价值的追求的中心。更妙的是，你还设法让自己身边围绕着由各种[Clans|E]组成的天才议会，确保你的名声甚至比你自己的妥芮朵族人们传得更远。\n在你微妙但始终存在的关怀下，几乎每晚都有新发现、新理论或新杰作诞生。在某种程度上，你已经实现了每位妥芮朵的梦想：永远不缺新的奇迹来娱乐，以免令人哀伤的缓慢的永生之苦。"
 pod1230objectives.99.a:0 "每夜如新"
 toreador_grandeur_event_tooltip:0 "一位特有灵感的人物加入了你的法庭。"
 pod1230objectives.100.a:0 "花哨的妥芮朵姿态！"
 pod1230objectives.100.b:0 "我必须得亲自见到那些奇观！"
 toreador_grandeur_modifier:0 "永生赞助"
 toreador_grandeur_modifier_desc:0 "最伟大的妥芮朵赞助人，总是站在凡人创新的最前沿，并因此受到广泛尊重。"
 pod1230objectives.101.t:0 "不死族图书馆"
 pod1230objectives.101.desc:0 "现在该隐之子历史上最重要的著作都在你的手中，并且有适当的设施来容纳它们，毫无疑问，你已经创造了你的种族历史上最大的永恒知识库。\n即使永生也不足以让你读完所有的东西，破译所有的秘密。但你会尝试，然后，也许，你会最终理解这该死的存在的意义。答案一定就在那里。你不敢考虑其他的选择……"
 pod1230objectives.101.a:0 "很久很久以前……"
 custodian_library_undead_modifier:0 "大图书馆馆长"
 custodian_library_undead_modifier_desc:0 "最伟大的该隐之子图书馆被委托于你。每件事都有一个答案，只要你知道去哪里找。"
 pod1230objectives.102.a:0 "我能借阅一些书么？"
 pod1230objectives.103.t:0 "亚力科的选民"
 pod1230objectives.103.desc:0 "很久以前，妥芮朵[Clan|E]的[antediluvian|E]亚力科掌控着苏美尔，那是一位仁慈的、受人爱戴的女神。但是，伊娜依娅来了。\n愤怒的冈格罗之母与她的子嗣一起，蹂躏了亚力科的乐园，并在一场漫长的战斗中偷走了命运石板，许多骄傲的妥芮朵因此丧命。最后，这一罪行终于得到了报应。\n石碑现在又回到了妥芮朵的手中，恩奇都和吉尔伽美什已经死了，冈格罗氏族只能在这次失败的耻辱中窜入他们的狗屋。\n而且，当你在宣布这一重大消息后环顾你的御座厅时，你突然注意到你所见过的最宏伟的雕塑似乎从不知何处出现。当你观赏这个杰作时，你听到一个最美丽的声音在你耳边说：“谢谢”。\n当你转身去看时，她已经走了。"
 pod1230objectives.103.a:0 "难道是……？"
 shamed_gangrel_modifier:0 "受辱的冈格罗"
 shamed_gangrel_modifier_desc:0 "妥芮朵找回了命运石板，并杀死了吉尔伽美什和恩奇都。这对所有冈格罗来说是一个巨大的耻辱。"
 pod1230objectives.104.a:0 "玫瑰在绽放"
 pod1230objectives.104.b:0 "谎言和欺骗！"
 pod1230objectives.105.t:0 "新的时代"
 pod1230objectives.105.desc:0 "数个世纪以来，妥芮朵[Clan|E]的命运一直与君士坦丁堡和它的幻梦交织在一起，但米迦勒在第四次十字军东征中的毁灭迎来了变化。\n抛开罗马帝国的废墟，妥芮朵受到了法兰西及其新兴的国家和文化的冲击，那里充满了诗人、艺术家和其他创造性的思想。从梵卓手中确有该地区的安全需要时间，而让妥芮朵团结在一个唯一的领袖身后更是需要时间，但现在已经完成了。\n不管是好是坏，法兰西和妥芮朵[Clan|E]现在都是一体的，在可预见的未来，他们的命运将被共享。"
 pod1230objectives.105.a:0 "新的家园"
 french_toreador_modifier:0 "法兰西即妥芮朵。妥芮朵即法兰西。"
 french_toreador_modifier_desc:0 "法兰西和妥芮朵氏族的命运现在被内在地联系在一起。"
 breton_opinion:0 "布列塔尼人好感"
 pod1230objectives.106.a:0 "哈，联合起来的艺术家！"
 pod1230objectives.106.b:0 "新的家园？"
 pod1230objectives.107.t:0 "殊途"
 pod1230objectives.107.desc:0 "天军再次伫立于世，所有的[GetTrait('shih').GetName( GetPlayer )]都跟随于你。天军曾经是这个世界上有史以来最强大的猎人势力，却因颓废和腐化而陨落，导致你们中最有德行者为了更大的善而摧毁了它。\n许多人担心同样的错误会再次发生，但你向他们保证，你善于此道。\n时间会证明一切。"
 pod1230objectives.107.a:0 "战！"
 pod1230objectives.107.a.tt:0 "你将不再能使用“先思后行”决议。"
 pod1230objectives.107.b:0 "让我们遵守旧道。"
 pod1230objectives.108.t:0 "终结大流散"
 pod1230objectives.108.desc:0 "面对埃及无数次的受占领，以及亚历山大大帝之后外地超自然的涌入，荷鲁斯在132年发布了大流散，放开了他忠诚的追随者，以他们自己的方式与阿波菲斯作战。但现在已经结束了，埃及再次属于贤荷鲁，对赛特的讨伐将重新开始！"
 pod1230objectives.108.a:0 "跟我来，兄弟们！"
 pod1230objectives.109.t:0 "以荷鲁斯之名"
 pod1230objectives.109.desc:0 "荷鲁斯与他叔叔赛特的长久血腥战争已经持续了数个世纪。尽管有许多挫折和很少的宝贵胜利，那些真正忠于复仇者的人从未放弃过恢复这个世界的平衡。\n荷鲁斯本人有时会离开他的门徒，有自己的使命要完成。这时你就会挺身而出，迎接你面前的巨大挑战。\n你带领着贤荷鲁成为一支纪律严明的强大势力，取得了连荷鲁斯本人都梦寐以求的胜利。奥西里斯的儿子不是傻瓜，他承认了你的成就，命名你为他的神圣维齐尔，并给予你极大的赞扬和对未来更大的期望。你现在是玛阿特的神选的珍贵副官，蛇的仆人们将学会畏惧你的名字。"
 pod1230objectives.109.a:0 "赛特之子亡了！"
 pod1230objectives.110.t:0 "光照信仰之地"
 pod1230objectives.110.desc:0 "你已经完成了不可能之事，信仰之地与网在你的控制之下，你将确保它永远不会再次陷入黑暗。"
 pod1230objectives.110.a:0 "且将直到永远。"
 horus_chosen_modifier:0 "荷鲁斯的圣维齐尔"
 pod1230objectives.111.t:0 "济世仁者"
 pod1230objectives.111.desc:0 "你把善意传遍世界，把光明播撒到人们的心中，他们为了模仿你而团结起来与黑暗斗争。"
 pod1230objectives.111.a:0 "你看到了么？荷鲁斯。"
 wandering_good_man_modifier:0 "济世仁者"
 pod1230objectives.112.t:0 "大奸大恶"
 pod1230objectives.112.desc:0 "你已经完成了蛇的意志，你在这个世界上播下了邪恶的种子，通过这个，阿波菲斯肯定会更早地现世，它已经为此赐福于你。"
 pod1230objectives.112.a:0 "终末快来了。"
 pure_evil_modifier:0 "大奸大恶"
 pod1230objectives.256.necromancy:0 "亡灵术。好指挥死者"
 pod1230objectives.256.abombwe:0 "阿本威。以行于黑夜"
 pod1230objectives.109.t_horus:0 "荷鲁斯，为父复仇"
 pod1230objectives.109.desc_horus:0 "你努力的使贤荷鲁组织起来，坚强反抗着吸血鬼，挫败赛特之子的计划。而这一天终于到来了……蛇的堕落子嗣们要么死了，或者躲避着你的神之愤怒，害怕那不可避免的，你对他们实施报复的一夜。你是荷鲁斯，复仇之子，胜利者！"
 living_pharaoh_modifier:0 "活法老"
 unlock_osiris_league_conversion:0 "你现在可以要求你的超自然[neteru|E]皈依有奥西里斯联盟[doctrine|E]的[faith|E]，如果有的话。"
 unlock_apophis_conversion:0 "你现在可以要求你的超自然[neteru|E]皈依有阿波菲斯仆从[doctrine|E]的[faith|E]，如果有的话。"
 pod1230objectives.115.t:0 "窃取智慧"
 pod1230objectives.115.desc:0 "鬼人老祖说到，蛮族瞾喇得到了血/学的指导来取得龙泪之力，但他本身的缺陷使他无法掌握这种力量，他的魄腐蚀了它。当血/学看到他弟子的缺陷并把他赶走时，叛徒离开了西方，在他的追随者中分享该力量的衍生形态。\n他后来离开了印度，但留给你的任务是完全掌握万鬼最严密的秘密。你终于完成了这任务，使瞾喇感到自豪……所有“东方血族”从现在起对你会更加敌视。"
 pod1230objectives.115.a:0 "读书人的事，能算偷么？"
 wisdom_stealer_modifier:0 "窃智大盗"
 wisdom_stealer_modifier_desc:0 "你将能使用龙泪。"
 unlock_chiiumuh_tooltip:0 "你将能使用龙泪。\n解锁$awake_hun_and_po_objective_decision$[decision|E]"
 pod1230objectives.116.t:0 "白虎再统一"
 pod1230objectives.116.desc:0 "强大的“西皇朝”一直受到派系主义的阻碍。相互竞争的屋室像军阀一样统治着自己的封地，长期以来，由于每个人都对范女皇怀有深深的敬意，才避免了彻底的分裂。然后，突然，她消失了。\n白虎皇朝随后正式分裂成相互斗争的党派，哪怕范的继承人笨拙地试图维持团结。从那时起，许多人试图为西皇朝带来和平，但他们都失败了。\n然而，这段时间已经过去了，你坐上了皇座，再次巩固了白虎皇朝，它终于成为诸至尊皇朝的平等伙伴。"
 pod1230objectives.116.a:0 "白虎重啸。"
 pod1230objectives.117.t:0 "亡者律令的终结"
 pod1230objectives.117.desc:0 "卡戎已经投降，亡者律令不再存在，现在你可以在闲暇时与任何生者互动。"
 pod1230objectives.117.a:0 "让每一天都成为鬼节。"
 the_gravedigger_of_dictum_mortuum:0 "亡者律令的掘墓人"
 pod1230objectives.118.t:0 "原罪帝国"
 pod1230objectives.118.desc:0 "恶魔是以信仰为食，每恶魔都是核心原罪之一的化身，他们获得更多力量的最好方法是腐化更多的凡人。小小邪教很容易建立，但你取得了更令人印象深刻的成就，将一片相当大的区域腐化入你的原罪。\n虽然许多人对真实情况一无所知，但这个地区的大多数居民现在每次放纵自己的欲望时都在为你的力量提升推波助澜。混乱正在蔓延，你的名声每天都在增长。\n这将是你成为上帝的最大大敌的无人能阻的飞升的适当开始。"
 pod1230objectives.118.a:0 "唯罪永恒"
 eternal_avarice_modifier:0 "永恒贪婪"
 eternal_envy_modifier:0 "永恒嫉妒"
 eternal_gluttony_modifier:0 "永恒暴食"
 eternal_lust_modifier:0 "永恒色欲"
 eternal_pride_modifier:0 "永恒傲慢"
 eternal_sloth_modifier:0 "永恒怠惰"
 eternal_wrath_modifier:0 "永恒暴怒"
 pod1230objectives.119.t:0 "破碎深渊"
 pod1230objectives.119.desc:0 "路西法的叛乱最终因他的追随者而失败，败者被扔进上帝创造的监狱——深渊，为他们的罪行忏悔，直到永远。然而，从那时起，许多恶魔（如你）从监狱的裂缝中逃了出来，或者被好高骛远的崇魔者召唤出来。然而，与仍然被囚禁在那里的地狱万象相比，这只是涓涓细流而已。\n打开这样一个坚不可摧的堡垒并不容易，但你最近的力量提升给了你新的机会。你可能还不是全能者，但你现在已经强大到足以成为深渊的威胁。\n而每当你在监狱打开一个新的洞口，就会有越来越多的同胞们逃出来，加入你在地上的事业……"
 pod1230objectives.119.a:0 "一场新的神圣叛乱即将来临。"
 pod1230objectives.120.t:0 "天启降临"
 pod1230objectives.120.desc:0 "上帝早就抛弃了这个世界，对人类的失败和祂忠诚的天使的反叛感到沮丧。你和其他堕落者被从天堂赶出去，永远在地狱里腐烂。但你忍了下来，甚至更好，你取得了胜利。尽管上帝的使徒做出了种种努力，其他超自然生物也在搞小动作，但现在世界正在为你唱着不洁的赞歌，把你当作全能的神本人的对手。\n是时候进行最终地冒犯了，便是很久以前就预言的启示录。把天上的星星撕下来，将整个尘世翻过来，将灰烬扔到上帝的面前。之后，也只有到那时，你才会有足够的力量带领你的地狱万象们进行最后的神圣之战。"
 pod1230objectives.120.a:0 "末日已到。"
 pod1230objectives.120.b:0 "我在下面还有些乐子……"
 the_end_of_the_world_tooltip:0 "随着尘世终结和你向无上叛徒发起斗争，游戏也将结束。"
 pod1230objectives.121.t:0 "生生不息"
 pod1230objectives.121.desc:0 "当鬼神逐鹿争玉之时，阎魔们在各方的心中下毒，使让极端化与中间派对立起来，这下去只有阎魔才是赢家。\n巫凤的大使们不仅仅是阻止了几场战争，他们还招募其他高尚的鬼神加入他们的事业，从凶猛的变化妖怪到隐秘的妖仙。生命是宝贵的，过于宝贵，不能浪费在无意义的内斗中。和平带来希望，希望带来治愈，治愈带来生命。万事皆成，阎魔必败。"
 pod1230objectives.121.a:0 "天下太平。"
 pod1230objectives.122.t:0 "堕落者之子"
 pod1230objectives.122.desc:0 "在天堂之战最激烈的时期，亚巴顿和阿斯莫德（路西法的两位副手）进行了罄竹难书的实验，导致了拿非利人的诞生：一位拥有人类宿主的恶魔和一位凡人女子的后代。虽然他们中的一些人是善良的，但大多数人被他们不朽的“父亲”扭曲和腐蚀了，他们想利用自己的无限潜力来反抗路西法。\n那些早期的拿非利人对人类犯下了令人发指的罪行，直到路西法和那些仍然忠于他的人设法阻止了他们。\n由于你最终设法揭开了制造他们的秘密，你能够带来一支新的拿非利人血脉。他们会被用来为善还是为恶？选择权在你手中。"
 pod1230objectives.122.a:0 "众神的后代再次行走在大地之上。"
 pod1230objectives.123.t:0 "玄武已存"
 pod1230objectives.123.desc:0 "玄武皇朝，也叫流浪皇朝，是[fourth_age|E]的五大至尊皇朝之一。它涵盖了东亚北部，因此代表了北边的方向。\n随着蒙古人的崛起，黑龟皇朝追着他们进入中国，在那里他们与其他至尊皇朝发生了冲突。他们与南方的接触也表明他们的队伍中有几个恶鬼。随着越来越多的恶鬼发现，玄武皇朝派出了他们的大军对付他们。许多屋室在攻打中被击溃，他们的成员被折磨，最后变成了恶鬼。\n所有的希望似乎都破灭了，直到你成功地联合了剩下的纯正的万鬼，并消除了安达和恶鬼在草原上的侵扰。玄武再次站立起来，而时代之轮已经放缓。"
 pod1230objectives.123.a:0 "我们将不会再堕落。"
 pod1230objectives.256.visceratika:0 "石变术。以律令大地"
 pod1230objectives.256.temporis:0 "时光术。以操控时间"
 pod1230objectives.124.t:0 "关于布鲁赫的真相"
 pod1230objectives.124.desc:0 "很久以前，布鲁赫[Clan|E]是学者和哲学家的灯塔。后来，特洛伊尔来了，她对我们的创始人做出了令人发指的行为，为我们曾经高贵的世系的衰落铺平了道路。从那时起，特洛伊尔的势力越来越大，只有我们的及时干预才将世界从他们在迦太基的憎恶仪式中拯救出来。\n然而，我们并没有就此止步。传播真相花了我们不少时间，也不少时间说服特洛伊尔最忠实的追随者，但现在已经成了。当我们站在迦太基废墟上看守叛徒的安息之地时，我们宣布：所谓的“布鲁赫”，特洛伊尔的子嗣们，现在是时候加入真正氏族，抛弃你们被诅咒的世系了。我们真正氏族已经准备好张开双臂欢迎你们加入……如果你们试图依附于你们背信弃义的先祖，则拔出刀来。请做出选择。"
 pod1230objectives.124.a:0 "张开你的双臂……"
 pod1230objectives.124.b:0 "……或拔出你的刀？"
 pod1230objectives.125.a:0 "叛军不再？"
 pod1230objectives.125.b:0 "这不是真的！"
 pod1230objectives.256.dementation:0 "疯狂术。以利用疯癫"
 pod1230objectives.256.melpominee:0 "魔音术。音即是力。"
 pod1230objectives.256.spiritus:0 "精魂术。与兽灵互动"
 pod1230objectives.256.valeren:0 "魂健术。以使用第三眼"
 pod1230objectives.256.quietus:0 "寂灭术。以操控血液"
 pod1230objectives.256.mytherceria:0 "仙灵术。源自妖精的力量"
 pod1230objectives.126.t:0 "援助兴光者"
 pod1230objectives.126.desc:0 "木乃伊对你们这些人来说是个谜。这些实体显然来自原始教徒，对最伟大者没有什么敬畏之心，但他们对信仰之地的更大利益的贡献怎么强调都不过分。\n困难时期需要务实的解决方案，而你选择忽略他们关于古埃及神灵的神秘废话，转而专注于更有战略意义的事情。尽管他们有很多缺点，但他们肯定是强大的，而且对如何猎杀受诅咒的吸血者知道得很多。这个奇怪的联盟已经结出了果实，你们两个组织都从中受益了。这是一个可以接受的状态。\n至少现在是这样。"
 pod1230objectives.126.a:0 "同床异梦"
 pod1230objectives.127.t:0 "解放恸鸣"
 pod1230objectives.127.desc:0 "恸鸣来自于卡巴天房内的黑石，其始于先知穆罕默德征服麦加之后，人们普遍认为它是真主力量的显现。被污染的超自然，如吸血鬼，会觉得恸鸣是一种喧嚣的哀号和尖啸。在其历史上，恸鸣只停止过一次，那是在950年，当伊斯兰教派卡尔马特派的成员偷走了黑石。这使得吸血鬼塔利克能够建立起术法封印，限制住一部分恸鸣，尽管他们不能完全压制它。\n凭借你新发现的知识和对该地区的净化，你能够移除塔利克的仪式并再次释放信仰的力量。被污染的超自然，如吸血鬼，将再次感受到恸鸣的哀号和尖啸。"
 pod1230objectives.127.a:0 "真主已言！"
 pod1230objectives.128.t:0 "苏菲"
 pod1230objectives.128.desc:0 "苏菲主义，又称苏菲派，为伊斯兰教的密契主义，为追求精神层面提升的伊斯兰教团。这种神秘主义常常让人相信拥有不可思议的力量的苏菲术士。\n你在智慧之家的长期学习使你能够解开古老的苏菲大师的秘密，使你在永恒的斗争中获得优势。"
 pod1230objectives.128.a:0 "真主在看着！"
 pod1230objectives.129.t:0 "神之宽恕"
 pod1230objectives.129.desc:0 "你的记忆终于归来了，你记得一切。那创世，那上帝赐予世界的光芒，那人类最初摸索的脚步，那路西法不顾上帝的计划保护凡人的请求……这一切都回到了你的脑海。而随之而来的是一种深深的失落感。失去了你最初的使命，失去了上帝对你的慈爱凝视，失去了你曾经对凡人未开发的潜力的期待。\n从那时起，你做了可怕的事情，并为此受到了惩罚。然后你从深渊监狱逃了出来，也许是上帝对你的考验之一。显然，你回到大地后并没有好到哪里去，但是，最终，这并不重要。你现在看到了真相。无论一个人多么邪恶，无论他们犯下多么令人发指的罪行，总是有机会得到宽恕的。\n你只需向它迈出第一步，也是你旅程的最后一步。"
 pod1230objectives.129.a:0 "耀眼的光芒……"
 demonic_redemption_tooltip:0 "就这样，你的故事终如其始，升到了天堂的大门。"
 pod1230objectives.129.b:0 "现在还不是时候。"
 pod1230objectives.107.a.tt2:0 "你将能在大裁判事件后使用[empire|E][GetPlayer.GetFaith.Custom('GHWName')][casus_belli|E]。"
 pod1230objectives.256.chimerstry:0 "虚幻术。将幻象施加于现实。"
 horus_chosen_modifier_desc:0 "允许要求超自然[neteru|E]皈依有奥西里斯联盟[doctrine|E]的[faith|E]，如果有的话。"
 pure_evil_modifier_desc:0 "允许要求超自然[neteru|E]皈依有阿波菲斯仆从[doctrine|E]的[faith|E]，如果有的话。"
 pod1230objectives.256.thinbloodalchemy:0 "淡血炼金术。以制造血配方。"
 pod1230objectives.130.t:0 "觉醒魂魄"
 pod1230objectives.130.desc:0 "为了破译魂魄之秘，你会见了开封的犹太万鬼，研究了“看不见”现象，探索了黄泉与幽冥，以及在须弥山找到了曾为万仙总部的寺庙群。\n现在你已经理解转生，觉醒魂魄，并真正成为了万鬼！这就是你的目标。\n也许这就是扫罗多年前寻找的东西，也许你甚至比他做得更好。你现在是独一无二的，是两个非常不同的世界之间的联系。"
 pod1230objectives.130.a:0 "我实现了不可能的事。"
 pod1230objectives.131.t:0 "已弥合大分裂"
 pod1230objectives.131.desc:0 "虽然裁判所和边防军有相同的目标，即清除世界上的超自然现象，但两者之间的摩擦却很常见。1204年的事件在边防军猎人们的记忆中仍然是新鲜的，伤口还没有愈合。不信任往往变成了赤裸裸的敌意，魔鬼的爪牙们因猎人互猎而嘲笑。\n然而，现在不一样了，因为边防军已经在基督教的传统席位上取得了主导地位。新有了首要地位，东正教的猎人们将他们的天主教兄弟们置于他们的统治之下，将基督教世界的战士们统一在一个比以前更强大的势力之下。"
 pod1230objectives.131.a:0 "暗影裁判所已被纳入麾下！"
 pod1230objectives.132.t:0 "发源"
 pod1230objectives.132.desc:0 "一切都通过发源与上帝联系在一起，使宇宙的所有层级成为一个伟大的、逐渐沉淀的存在链的一部分。\n现在魔法中的秘密已经清晰，你已经准备好开始讲道。"
 pod1230objectives.132.a:0 "无限的无尽。"
 pod1230objectives.133.t:0 "神通术"
 pod1230objectives.133.desc:0 "在研习神圣文本和神秘经书之后，你找到了如何从上帝那里调用力量的秘密。现在你将把这些教给你们的同胞，团结一致，抵抗黑暗。"
 pod1230objectives.133.a:0 "上帝在看着！"
 pod1230objectives.87.sucess:0 "永生在等待！"
 pod1230objectives.87.fail:0 "不不不！"
 pod1230objectives.87.fail.tt:0 "你失败了，但你获得一部分的血之力，允许你获取[elder_perk|E]且你可以在该修正消退后再次尝试仪式。"
 pod1230objectives.89.b:0 "我们的模范。"
 pod1230objectives.256.bardo:0 "中阴术。否定心兽。"
 pod1230objectives.134.t:0 "巴比伦"
 pod1230objectives.134.desc:0 "在巴比伦和苏美尔等古国，每个恶魔信徒圈子都发展成了密教，然后成为成熟的宗教，神庙和雕刻有恶魔肖像的神像出现在全国各地的城市、村庄和家庭中。\n随着信仰的涓涓细流不断扩大，后来变成了汹涌澎湃的河流，地缚魔利用他们的秘义来满足自己的愤怒，并用诅咒、瘟疫和饥荒来惩罚那些不信魔神的人。\n自创世以来，堕落天使从未如此公开地统治过弱小的人类。这些文明的衰落和一神论的兴起大大削弱了恶魔的力量，迫使许多恶魔陷入沉睡或被放逐回深渊。\n在这个不光彩的时代继承衣钵，会给你的罪之兄弟姐妹们传达一个非常强烈的信号。"
 pod1230objectives.134.a:0 "光彩夺目"
 pod1230objectives.135.t:0 "Creation of Visceratika"
 pod1230objectives.135.desc:0 "An extension of their natural affinity for stone, earth, and things made thereof, Visceratika is for the Gargoyles a codified version of these powers that came naturally to them. Having long been enthralled by the Tremere, they had so far not been unable to really understand this affinity for these powers but this has changed recently. Pioneered by one innovative individual, these strange abilities are finally spreading like wildfire among the very communal Gargoyles, under the name of Visceratika. A new discipline joins the ranks of the power of the blood."
 pod1230objectives.135.a:0 "Masters of Earth and Stone."
 pod1230objectives.136.t:0 "Creation of Visceratika"
 pod1230objectives.136.desc:0 "An extension of their natural affinity for stone, earth, and things made thereof, Visceratika is for the Gargoyles a codified version of these powers that came naturally to them. Having long been enthralled by the Tremere, they had so far not been unable to really understand this affinity for these powers but this has changed recently. Pioneered by one innovative individual, these strange abilities are finally spreading like wildfire among the very communal Gargoyles, under the name of Visceratika. A new discipline joins the ranks of the power of the blood."
 pod1230objectives.136.a:0 "Masters of Earth and Stone."
 pod1230objectives.137.t:0 "Creation of Visceratika"
 pod1230objectives.137.desc:0 "Reports said that [visceratika_creator.GetFirstNameNoTooltip] created a new discipline named [GetTrait('visceratika').GetName(GetNullCharacter)].\nAn extension of their natural affinity for stone, earth, and things made thereof, Visceratika is for the Gargoyles a codified version of these powers that came naturally to them. Having long been enthralled by the Tremere, they had so far not been unable to really understand this affinity for these powers but this has changed recently. Pioneered by one innovative individual, these strange abilities are finally spreading like wildfire among the very communal Gargoyles, under the name of Visceratika. A new discipline joins the ranks of the power of the blood."
 pod1230objectives.137.a:0 "More powers to learn?"
 pod1230objectives.137.b:0 "Good for our bloodline."