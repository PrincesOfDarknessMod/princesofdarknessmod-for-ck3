l_simp_chinese:
 podgreatpersons.0001.t: "阿不都·拉提甫·巴格达迪"
 podgreatpersons.0001.desc: "作为著名的历史学家和哲学家，阿卜杜·拉蒂夫·巴格达迪在中东地区广泛旅行多年后，最近搬回了巴格达。他的著作和对人类灵魂、心灵和身体的认识已经被人们奉为圭臬，甚至连萨拉丁本人也给予他赞助。随着年龄的增长，他越来越隐蔽，这很可能是你唯一的机会为自己获得这样一个优秀的后嗣。"
 podgreatpersons.0001.a: "金钱无关紧要。"
 podgreatpersons.0001.b: "是时候拉点关系了。"
 podgreatpersons.0001.c: "我们不需要更多的竞争者。"
 podgreatpersons.0001.d: "带过来就是了！"
 podgreatpersons.0001.custom: "这伟人将加入你的宫廷，让你有机会使用他们的才能，或者其他用法，比如$pod_Embrace$（若你是吸血鬼）。然而，若你是吸血鬼，与这样的人物打交道会增加你[masquerade_exposure|E]"
 podgreatpersons.0001.customb: "如果你不去干涉此伟人。一位领近的吸血鬼统治者将会抓住机会$pod_Embrace$其。"
 podgreatpersons.0002.t: "爱丽丝·吉蒂勒"
 podgreatpersons.0002.desc: "你听闻到了一则不寻常的故事：最近一位名叫爱丽丝·吉蒂勒的狡猾的凡人逃脱了审判，她被指控的罪名有行巫术、异端、献祭动物以及和一只疑似名为“罗宾”的恶魔交媾。所有与她有关的人要么已经被除以火刑了，要么就是即将被处决，但是她仍然多次挫败了教廷捉捕她的企图，因而她的能力不容否认。你的一个探子告知你，她已经流亡到你领地的附近，你开始思索你是否愿意将一位野心勃勃而又睿智的女巫当作你的后嗣……"
 podgreatpersons.0003.t: "贾拉勒丁·穆罕默德·鲁米"
 podgreatpersons.0003.desc: "鲁米作为一名杰出的教法学家和神学家而广为人知，但使他更为出名的是他的加扎勒，即波斯诗歌。鲁米是一位广受人喜爱的男人，即使在穆斯林社群之外也是这样，他最近还完成了他的杰作——玛斯纳维。据信，他已经病入膏肓，并且他已经预见了他自己的死亡。你有一个小渠道去$pod_Embrace$他，以资助他完成他未尽的著作，或者说……使他创作更多和医学相关的作品。"
 podgreatpersons.0004.t: "艾格尼丝·兰道夫"
 podgreatpersons.0004.desc: "随着凡人的苏格兰独立战争的激烈战火持续不断，艾格尼丝·邓巴尔这个名字开始引起你的注意。这位凶悍的苏格兰女人以任何凡人都无法比肩的坚韧意志，守住了她那座无人领导的城堡。这座城堡的这名女士用她巧妙的诡计和敏捷的智慧，将英格兰两万大军玩弄于股掌之上，这使得她勇名大振。她现在陷入了无爱的婚姻中，几乎没有继承任何东西的期望，你或许可以说服这样一名勇敢的女人将她出色的技巧为你所用，或许甚至还能使其成为你的后嗣……"
 podgreatpersons.0005.t: "阿涅丝·索雷尔"
 podgreatpersons.0005.desc: "你刚得知法兰西的凡人国王路易十一正试图毒杀王室情妇阿涅丝·索雷尔。这名声名不佳的女士一直对国王有强大的影响力，现在有关她美貌的传言已经在你的宫廷内传开了。如果你不快速行动的话，法兰西将会失去其最美丽的一朵鲜花。如果你行动的话……那么，也许你可以确保这朵鲜花永远不会凋零。"
 podgreatpersons.0006.t: "亚历山大·涅夫斯基？"
 podgreatpersons.0006.desc: "令人惊讶的是，你听说一个自称是亚历山大·涅夫斯基的人最近出现在附近的一个小镇上。这不太可能，因为大名鼎鼎的弗拉基米尔大亲王目前正在金帐汗帐执行外交任务。这个人声称已经了解$pod_cainite$社会，并希望被“以自己接受的$pod_Embrace$方式”来获得永生，而不是被奴役。你对这个故事有疑问，但是你能让一位可能的对手$pod_Embrace$罗斯的英雄，德意志和瑞典之敌么？至少，你可以让他到你的宫廷来，并按自己心意决定……"
 podgreatpersons.0007.t: "帕多瓦的安多尼？"
 podgreatpersons.0007.desc: "你的手下报告说有一位自称是著名圣人帕多瓦的安多尼的人在附近的城镇被发现。这不太可能，因为你很确定真正的安东尼去年去世了，并且被罗马封为圣徒。真正的方济各会修道士是一个在世圣人，他的灵光能够从几英里外燃烧你的同类。不过……也许这是值得探查的。他可能是他的一个活着的同伴，也可能是一个有学问的人，值得考虑收为子嗣。"
 podgreatpersons.0008.t: "安东尼奥·德·内布里哈"
 podgreatpersons.0008.desc: "作为那个时代最伟大的人文主义者之一，安东尼奥·德·内布里哈写了很多书，你的宫廷经常引用。你不是特别热衷于该关于凡人的“人文主义”思潮，但你不能否认这个人的才华。他的寿命正要耗尽，你想知道现在是不是合适的时候让他进入你的宫廷。也许让自己有一个有“现代思想”的子嗣可能会有好处。"
 podgreatpersons.0009.t: "传道者巴巴·伊沙克"
 podgreatpersons.0009.desc: "一位凡人最近在安纳托利亚东北部制造了相当大的骚动。该伊沙克宣称自己是脱凡的弥赛亚，他聚集了许多追随者，甚至领导了反对塞尔柱苏丹的公开叛乱。正如通常的凡人，这是一场短命的尝试，这位自称“脱凡”的将很快被行刑。你认为这个男人并不缺乏魅力和动力。也许有了合适的老师，他可以成为一个有趣的子嗣……"
 podgreatpersons.0010.t: "贝阿特丽斯·达·席尔瓦？"
 podgreatpersons.0010.desc: "托莱多宫殿的圣母无染原罪修会发生了一些事情。报告写的很模糊，但你的手下声称他们终于接近了该地方，哪怕其周围有着真信灵光。他们跟踪了似乎遭到不明势力袭击的幸存者，并认为他们很好地处理了事件后修会创始人贝亚特里斯·达·席尔瓦的位置。这似乎有些鞭长莫及，尤其是因为贝亚特里斯对$pod_cainites$来说太神圣而无法接近，但这仍然是一个机会。你可以找到这个女人，把她带到你身边。她可能会有用……"
 podgreatpersons.0011.t: "比尔约之女彼济达？"
 podgreatpersons.0011.desc: "知晓着你的名声，一位自称比尔约之女彼济达的年轻女人找到了你的一位手下，要求“摆脱教廷的束缚”。你的手下说这位女人和我们所知道的那个即将在瑞典建立新骑士团的女圣人有相似之处，但是年龄不匹配。稍微挖掘一下，你就可以有把握地说她是她的一位女儿，塞西莉娅，她在很小的时候被她圣洁的母亲强行困在修道院里。虽然塞西莉娅的价值不如彼济达本人，但她看起来仍然是一个有潜力、有用、又有决心的年轻女性。一位值得$pod_Embrace$的人？"
 podgreatpersons.0012.t: "锡耶纳的加大利纳？"
 podgreatpersons.0012.desc: "你听说过锡耶纳的加大利纳，一个年轻圣洁的女人，她自以行世的天主之力而闻名，也许是目前罗马教廷的最热心活跃的倡导者，即使双方有时看起来有分歧。因此，当另一位女人最近出现，声称是加大利纳的姐姐博纳文图拉时，你很惊讶。看来她是用一些不该说的方法存活下来的，现在她希望从历史中消失，因为她的“死亡”对加大利纳来说是一个深刻的教训。这是一个不寻常的要求，因为这个女人似乎仍然对天主和她的妹妹非常虔诚，但还不足让其牺牲自己的生命。你在考虑你的下一步行动。"
 podgreatpersons.0013.t: "亚西西的嘉勒？"
 podgreatpersons.0013.desc: "你的一位小对手对圣达勉教堂，亚西西的圣嘉勒和她的修女们居住的地方，采取了大胆的行动。很明显，这位傻瓜和他的伙伴们没有活下来，真信渗透了这个地区，但他们任设法引起了相当大的骚乱。据说嘉勒的一位修女，贝阿特丽克丝，在袭击中“失踪”了。虽然你无法与虔诚又充满美德的嘉勒本人抗衡，但初拥她的修女会对教廷造成道德上的打击……"
 podgreatpersons.0014.t: "切萨雷·波吉亚"
 podgreatpersons.0014.desc: "无情的意大利人切萨雷·波吉亚，目前正在比亚纳面临艰难的围城。到目前为止，这个人已经证明了自己非常足智多谋，在意大利的战役中，他的名字出现在许多胜战之中，同时也遭到了许多背叛。随着他父亲劳得力的去世和充满敌意的新教宗的上位，他开始被众多的敌人逼得走投无路。如果你希望自己有个有声望的子嗣，现在是采取行动的最好时机。毕竟，围城期间任何事情都可能发生。"
 podgreatpersons.0015.t: "克里斯蒂娜·德·皮桑"
 podgreatpersons.0015.desc: "法兰西宫廷几十年来司空见惯的一幕，著名作家兼教师克里斯蒂娜·德·皮桑最近搬到了一所女修道院来度过她生命中的最后几年。她的作品在很多圈子里都得到了高度赞扬，包括$pod_cainite$，因为它们详细阐述了统治地位的真正定义、对未来的乐观看法以及女性在法兰西历史上的地位。她的身体可能正在变弱，但她的思维似乎一如既往地敏锐，因为她最近发表了一首关于圣女贞德命运的诗。你的一些廷臣想让她成为$pod_cainite$社会的一员。只为了保护她的才能，这是肯定的。"
 podgreatpersons.0016.t: "柯拉·迪·里恩佐"
 podgreatpersons.0016.desc: "最近，凡人的罗马的喧嚣比往常更大。主要的原因是一位柯拉·迪·里恩佐，一位靠个人魅力成为城市领袖的平民……而且成了两次。他梦想建立一个新的罗马帝国，其显然是被自己的宏伟妄想所迷惑。但当涉及到战争的时候，这个男人却反而很弱，很容易被打到。你的手下怀疑他是真的有天赋还只是运气太好。事实是罗马的暴民们现在显然开始反对他了，这是你$pod_Embrace$一个不太讨喜，但可能有用的子嗣的机会。"
 podgreatpersons.0017.t: "但丁·阿利吉耶里"
 podgreatpersons.0017.desc: "尽管你的宫廷和同伴不理解这一点，但你非常喜欢最近出版的一部名为“神曲”的史诗。它有着……能深入到你的灵魂深处的东西，尤其是在你这种情况下，仿佛作者比凡人更了解天主与恶魔。这个叫但丁·阿利吉耶里的人，现在运气很差，被他的大多数政治盟友放逐和抛弃。如果他遇到了不幸的事故，也不会有人介意。随后，你就可以把他带到你的宫廷，得到你想要的答案。毕竟，一位永生的生命也该有足够的时间去理解神性。"
 podgreatpersons.0018.t: "黛安·德·普瓦捷"
 podgreatpersons.0018.desc: "黛安·德·普瓦捷在近二十五年来一直是法兰西王权背后的真正力量。据你所知，她并没有通过密谋或谋杀来达到这个位置……这将使她成为一个完美的$pod_Embrace$候选人。在法兰西，如果没有精明的才智和良好的政治判断力，是不可能拥有如此强大的权力的，而这两点正是王室最受欢迎的人物所具备的。随着亨利二世的去世，她的主要竞争对手凯瑟琳·德·美第奇迁入，剥夺了国王给予她的所有权力和资产。黛安似乎并没有打算报复，而且似乎接受了自己化作路人的命运。现在正是为你找一位首要顾问的好时机……"
 podgreatpersons.0019.t: "长腿爱德华？"
 podgreatpersons.0019.desc: "英格兰的前任国王，爱德华一世，四年前去世了。你饶有兴趣地追踪他的生活，因为他是一位著名的立法者、精明的政治家和有能力的将军，所有这些品质都是$pod_cainite$社会所珍视的……当然还要一丝恐惧和残忍，也是这位已故国王所具有的品质。要想$pod_Embrace$他是不可能的，因为他受到教廷手下的保护，就像所有国王一样，但你最近听说，他最信赖的伙伴，莱西的亨利，有迹象表明他要离开人世了。作为一个忠诚而有能力的人，他曾很好地见证过长腿的战术，甚至可以成为一位$pod_Embrace$候选人。"
 podgreatpersons.0020.t: "伊丽莎白·巴托里"
 podgreatpersons.0020.desc: "你的一位手下带着一份令人不安的报告从恰赫季采城堡回来了，似乎伊丽莎白·巴托里，那个被控六百多起谋杀，沐浴在处女的血并食用的女人，实际上并不是一位吸血鬼……目前而言。对于她的审判是残酷无情的，听到关于她的酷刑的详细描述甚至会让那些最坚韧的$pod_cainite$感到不安，其包括焚烧、冷冻、使用活蚂蚁或掏空内脏。有时所有的这些一起用。但如果她不是吸血鬼……这意味着她能成为优秀的，又可能有点精神错乱的，$pod_Embrace$候选人。"
 podgreatpersons.0021.t: "匈牙利的伊丽莎白？"
 podgreatpersons.0021.desc: "你的一位小对手最近对柯那德·冯·马尔堡采取了行动。柯那德·冯·马尔堡是一位著名的裁判官，也是最近去世的匈牙利的圣丽莎的前导师。那个傻瓜被粉碎了，但是造成余波很依在，关于“$pod_cainite$阴谋”的线索越来越多。其中一位是一个年轻的女人，她是裁判官的另一个学生，她亲眼目睹了该隐之赠。让她消失可能会引起怀疑，但她能是有用的，无论是用来打击裁判所，还是作为一个潜在的$pod_Embrace$候选人。奇怪的是，这个女人也跟圣人一样叫伊丽莎白，且似乎很接近圣人此时的年龄。也许柯那德自己也有秘密……"
 podgreatpersons.0022.t: "恩斯特·冯·曼斯费尔德"
 podgreatpersons.0022.desc: "你的手下报告说恩斯特·冯·曼斯费尔德，臭名昭著的雇佣兵头目目前在波斯尼亚，并处于绝症状态。这个诡计多端的德意志人已经为自己赢得了一个技术娴熟的名声，一个即使不是很可靠，但也值得雇佣的人。他因在三十年战争中支持新教徒而闻名……尽管他自认为是虔诚的天主教徒。他有优秀的军事血统和……开放的思想，他可以成为一位有价值的$pod_Embrace$候选人。"
 podgreatpersons.0023.t: "尤斯塔斯·付维尔"
 podgreatpersons.0023.desc: "所谓的“付维尔”帮派几十年来一直是英格兰谈论的话题。这些绿林好汉可能比暴徒强不了多少，他们有足够的运气或能力来针对爱德华二世的随从。国王本就受人轻视，更不能让任何人不信尤斯塔斯这帮人不是什么劫富济贫的英雄人物。经过多年的探索，你的手下终于找到了那位年老的绿林好汉。你现在将能够获得一位强力的战士和愚民煽动者。"
 podgreatpersons.0024.t: "斐波那契"
 podgreatpersons.0024.desc: "凡人正在流行一种新的时尚。“印度–阿拉伯”数字系统开始流行，在你看来明显比不上古老且优越的罗马数字系统。你很确定凡人会在适当的时候恢复理智，但是你对这个理论的支持者很好奇，列奥纳多·波那契，也被称为斐波那契。这位老人在发表了他的论文后定居在比萨。你不能否认他的知识，你可以“邀请”他到你的宫廷上进行辩论。或者也许讲些……家事？"
 podgreatpersons.0025.t: "弗洛里安·盖叶"
 podgreatpersons.0025.desc: "一段时间以来，凡人的农民战争一直是你们的眼中钉，因为农民会在战争中大批死亡，这很浪费食物。不过弗洛里安·盖叶的出现带来了新机会，这位毫无荣誉的贵族正率领着一支名为“黑军”的骑兵部队与农民们并肩作战。虽说盖叶已是广受爱戴的英雄领袖，但他也严苛易怒，这使他成为了一件不稳定因素。看来，在他们最后一次在英戈尔施塔特战败后，你的手下找到了他的位置。处于败方又被围在死地，盖叶面临死亡只是时间问题。但如果你介入……"
 podgreatpersons.0026.t: "加莱亚佐·马里亚·斯福尔扎"
 podgreatpersons.0026.desc: "过去的几年里，你一直被加莱亚佐·马里亚·斯福尔扎的故事所娱乐，他是米兰的凡人公爵。作为一个想象力丰富的人，他创造了许多新的折磨方式，包括心理上的和生理上的。你的宫廷特别喜欢“把人钉进他的棺材中”这条。显然，这并没有让他在米兰和其他地方交到很多朋友，有理由认为他很快就会被赶下台，这很可能会是通过暴力实施的。你在考虑是否亲自安排他的死亡，然后把他带回宫廷。至少，他可以成为一位非常活泼的吸血鬼……"
 podgreatpersons.0027.t: "杰弗里·乔叟"
 podgreatpersons.0027.desc: "你听说著名诗人兼公务员杰弗里·乔叟在遭到匪徒伏击并受了重伤。他不再年轻，他的光辉岁月也随着他的赞助人理查二世的退位而逝去。尽管如此，他还是一位能干的外交家和杰出的诗人，是最早将中世纪英语作为文学工具使用的人之一。这样一位在政治和诗歌方面都有学问的人，使其成为子嗣的话，的确有点意思。"
 podgreatpersons.0028.t: "吉尔·德·雷"
 podgreatpersons.0028.desc: "圣女贞德的一位同伴吉尔·德·雷最近很堕落。失去了财产和同辈的善意之后，这位贵族似乎求助于更多的……恶魔的赞助。对他的审判是一件肮脏的事情，其证词中的谋杀的残忍程度甚至让大多数$pod_cainites$都感到厌恶。这些指控的真实性很难承认，毕竟，即使是凡人也会通过阴谋互相攻击。吉尔很快就会面临绞刑……除非你介入，用另一个可怜的人代替他。作为一个凡人，吉尔无疑显示出了成为$pod_Embrace$候选人的潜力……"
 podgreatpersons.0029.t: "吉罗拉莫·萨佛纳罗拉"
 podgreatpersons.0029.desc: "最近，道明会修士萨佛纳罗拉在佛罗伦萨掀起了一场暴动，他通过向善良的人们鼓吹荣耀归于他们和破灭归于敌人的愿景，将执政的美第奇赶下了台。事实证明，这个人很有韧性，他抵制了教廷将其逐出教廷的企图，甚至安抚了法兰西国王，跟他建立一个伪联盟。然而，他的好运已经在最近耗尽了，因为他搞砸了本来是要向佛罗伦萨人民证明他的神佑的烈火裁判。他现在被一群愤怒的暴民关在监狱里，缺乏任何支持，这位佛罗伦萨一度的实际统治者将很快面临火刑……除非你插手。当然，萨佛纳罗拉有让人们追随他的天赋，而这在$pod_cainite$政治中是一种宝贵的品质。"
 podgreatpersons.0030.t: "戈特弗里德·冯·伯利欣根"
 podgreatpersons.0030.desc: "雇佣兵头子戈特弗里德·“格茨”·冯·伯利欣根最近成了你们宫廷里的常谈话题。这位暴脾气又满嘴脏话的德意志人以长时间怀恨在心而闻名，更出名的是他在一次围城中失去了一只手臂。这一事并没有阻止“格茨”很久，因为他立即用一种奇怪的铁义体代替它，并回到战场上。在经历了漫长的战争、被俘和受伤之后，这位“铁拳”终于开始显示出岁月不饶人之处，他回到了自己的家族庄园，在宁静中度过了最后的日子。你们的宫廷争辩说，这样一位顽强的和受磨炼的人，对你毫无疑问的正义功业而言，将是一笔大投资，既使你成为夜晚的统治者。"
 podgreatpersons.0031.t: "海德维奇"
 podgreatpersons.0031.desc: "有消息告诉你一位名叫海德维奇的贵妇人正在经过你的城市。虽然他们的调查并没有透露太多关于她的过去，但你的手下描述她是一位熟练的女诗人和作家，从她的外表看，她经历了很多，但仍然坚持下了去。这种强烈的个性和博学的背景使她成为一位值得关注的人，甚至可能值得考虑当做一位$pod_Embrace$候选人。"
 podgreatpersons.0032.t: "赫尔曼·冯·萨尔扎"
 podgreatpersons.0032.desc: "自上任以来，这位条顿骑士团的大团长一直让德意志的$pod_cainites$头疼不已。即使是黑十字，德意志$pod_cainite$修会，也不能刺穿保护这个人的真信。正因如此，再加上他作为指挥官和外交官的出色才能，赫尔曼已经能够抑制大多数对他的骑士团的$pod_cainite$影响。不过，最近有些事情发生了变化，条顿骑士发动了一场无声的反抗，把他大权旁落，成为一个傀儡。随着岁月的流逝，他一生的事业也在崩溃，赫尔曼的信仰也在逐渐减弱。这将是极好的机会，来对教廷士兵进行舒畅又打脸的报复……"
 podgreatpersons.0033.t: "伊本·阿拉比"
 podgreatpersons.0033.desc: "穆斯林世界最著名的学者之一最近搬到了大马士革。伊本·阿拉比是一位著名的学者、神秘主义者和哲学家，他创作了近850部作品。甚至连$pod_cainite$世界也被他引起了注意，关于他对世界内部运作的真实认识，各种争论如雨后春笋般冒了出来。现在只是一位老人，伊本似乎在疯狂地试图在死前完成《麦加的启示》的第二稿。将永生的恩赐授予这样的人是很诱人的，即使你知道该隐的诅咒会深刻地改变一个人……"
 podgreatpersons.0034.t: "伊本·赫勒敦"
 podgreatpersons.0034.desc: "著名学者、政治家和历史学家伊本·赫勒敦再次受到众多敌人的威胁。这位老冒险家的一生充满了阴谋诡计、军事征服和担任过许多显赫的政府职位。尽管如此，他最为人所知的还是他关于帝国的周期性兴衰的杰出著作，这使他成为被派去与蒙古领主的帖木儿谈判的使者之一。最近重返政坛后，他对一个秘密政党的效忠过事又回归困扰着他，他的日子似乎屈指可数了，因为他喜欢惹是生非，而且年事已高。你的一些廷臣劝你考虑把他转成子嗣，否则就太晚了。"
 podgreatpersons.0035.t: "英白里亚·科涅蒂"
 podgreatpersons.0035.desc: "这位“交际花的女王”自抵达罗马以来，就一直是罗马一个悦目的景象。作为一个精明的女人，她成功地攀上了罗马最著名的名人——交际花间的顶端。圣职人员和艺术家（如拉斐尔）都崇拜她，她是这座圣城里富有而有影响力的人物。但看来这一切都要结束了，因为她目前正在与显然是自己服用的毒药进行斗争，而且失败了。虽然你不确定她为什么要自杀，也许是一个微不足道的世俗原因，比如“真爱”，但你知道这是一个$pod_Embrace$一个应该很容易在黑夜宫廷上找到自己位置的人的机会。"
 podgreatpersons.0036.t: "扬·胡斯？"
 podgreatpersons.0036.desc: "最近，“胡斯运动”已经成为了$pod_cainites$的主要担忧。一些人对使教廷分崩离析的想法着迷，另一些人似乎对这种改革主义理论真正感兴趣。不过，该运动的领袖胡斯本人，也将不久于人世，因为对他的审判很可能会导致他被迅速处决。一群年轻的“胡斯派”$pod_cainites$组织了一次大胆的营救行动……并很悲惨的失败了。但在事后，你的手下注意到有个人在街上流浪，自称是牧师本人。由于审判正在顺利进行，这是非常不可能的，但他可能是胡斯的信徒，因袭击而错乱了。无论如何，作为一名$pod_cainite$袭击的幸存者，他对你的保密工作构成了威胁……"
 podgreatpersons.0037.t: "扬·杰士卡"
 podgreatpersons.0037.desc: "你一直在密切关注一名杰出的将军扬·杰士卡的生涯。这位胡斯派的首领已经被证明非常有能力，用创新的战术将一群乌合之众变成了一支能够击败欧洲最优秀骑士的军队。最明显的是火药的使用，这是一种致命的新武器，会给你带来麻烦。你已经知道杰士卡又在打仗了，但是瘟疫已经侵袭了他，他的日子似乎屈指可数了。你强烈地考虑采取行动把他带到你的宫廷，因为他会是一位很有价值的军事领袖，一位可以向你第一手解释这些新武器的危险的人。"
 podgreatpersons.0038.t: "蓬巴杜夫人"
 podgreatpersons.0038.desc: "法兰西有一个悠久的传统，即国王都有着权势的情妇和密友。但是，你必须承认，你听到的关于让娜·安托瓦妮特·普瓦松的消息是不同寻常的。近年来，这位王室情妇，曾经的“国王之友”当他们的关系更贞洁时，其权力与路易十五不相上下，甚至更大。她的魅力、政治敏锐性和坚实的朋友圈使她很有权势……并被宫廷的很多人憎恨，随着她虚弱的体质最终超过了她的决心，她的生命也将结束，因为她的疾病将无法让她活下来。凡人的法兰西将失去一颗宝石，但$pod_cainite$的法兰西也许将可以赢得一颗宝石……"
 podgreatpersons.0039.t: "珍妮·德·克里松"
 podgreatpersons.0039.desc: "你的手下通知你臭名昭著的“布列塔尼母狮”和她的孩子最近在一个偏远地区遭遇海难。这位母狮是珍妮·德·克里松，一位布列塔尼的贵妇，她发誓要为十多年前她丈夫因怯战而被处决一事向法兰西国王复仇。从那时起，她就在布列塔尼附近以惊人的成功击败了法兰西舰队。一个任性而实际的女人，她每次只留下一个幸存者来讲述这个故事，她给你的许多廷臣留下了深刻的印象。她最近的失败和她盟友与船员伙伴的孤立给了你一个机会“邀请”她到你的宫廷。也许你可以让这样一头母狮成为你的子嗣……"
 podgreatpersons.0040.t: "圣女贞德？"
 podgreatpersons.0040.desc: "随着法兰西与英格兰之间的战争愈演愈烈，“奥尔良的少女”一直是着$pod_cainites$的一个大麻烦。这本来是一个方便密谋和掠食的机会，现在却变成了一场几乎圣战般的战争。真信在蔓延，你已经数不清有多少$pod_cainites$被蜂拥向贞德的旗帜的狂热者所焚烧。她自己是无懈可击的，她被一种看似神圣的信念所保护，但……她的近亲却不是。这很琐碎，但你可以报复她的家人，只因她造成的所有麻烦，特别是当英格兰人最终抓住了她，使她（大概）无害化了。如果运气好的话，他们甚至可以成为有用的卒子。"
 podgreatpersons.0041.t: "约翰·卡伯特"
 podgreatpersons.0041.desc: "这是一个变革和探索的时代，这两件事都是$pod_cainites$不擅长处理的。当欧洲开始越来越多进入伟大的未知的探险，你们好奇什么样的恐怖，和机会，等待着他们。你决心不被抛在后面，因此，你调查了当代最伟大的探险家之一，约翰·卡伯特。这位坚强的船长最近刚从他的许多次大西部之旅中回来，他如果有你这样的永生的赞助人将能做更多的事情。授予他永生也是一种选择，它可以让你在未来抢先一步，无论是在这里还是在广阔的蓝色海洋之外。"
 podgreatpersons.0042.t: "约翰·霍克伍德"
 podgreatpersons.0042.desc: "佣兵在意大利生活很常见。这些人被雇来为该国富裕的城邦发动战争，他们对效忠的态度常常像他们对货币的贪婪一样善变。他们的领袖之一，英格兰人约翰·霍克伍德，在这里度过了他的大部分职业生涯，为许多城市而战。一个残忍和贪婪的人，从某种程度上讲，他也被认为是最好的指挥官和战略家。他的时间不多了，他上次行军做的事也来找他了，你的一些廷臣们认为，这将是一个很好的接近他的机会。长生不老的承诺会轻易地诱惑这样的人，他会证明自己是有用的……如果你能使他服从你的意愿。"
 podgreatpersons.0043.t: "列奥纳多·达·芬奇"
 podgreatpersons.0043.desc: "一段时间以来，弗朗索瓦一世非常喜欢一位意大利艺术家，甚至还送了他一座城堡供他个人使用。你已经监视了这个人，必须承认他在多个领域拥有纯粹的天赋。然而，你并不是唯一一个仰慕他的人，因为看起来有一群虔诚者密切监视着他，使任何近距离接触都变得不可能。但是最近，你知道达芬奇的健康每况愈下，这迫使国王常常安排时间去拜访他的老朋友。这可能是你“邀请”当代最伟大的思想家到你的宫廷里的最好机会……"
 podgreatpersons.0044.t: "卢克雷齐娅·博尔贾"
 podgreatpersons.0044.desc: "你总是在寻找可选的$pod_Embrace$候选人，而博尔贾家族就不缺这样的人。教宗亚历山大六世的女儿卢克雷齐娅对她的父亲和兄弟来说是一笔不小的财富。她美丽、聪明、意志坚强，是文艺复兴时期的完美公主。在你的书中，关于她中毒和背后残酷阴谋的谣言是加分项，因为这将使她更适合成为不死族。你的手下在等着你的回复。"
 podgreatpersons.0045.t: "马可·波罗"
 podgreatpersons.0045.desc: "$pod_cainite$世界很大，你总是渴望了解更多关于你在国外可能结交到的奇怪的朋友，或者最有可能的敌人。一位叫做马可·波罗的威尼斯商人出现了。据称，这名拥有平静家庭生活的男子已经在震旦旅行了几十年。在这段时间里，他很可能在国外找到了一些关于黑夜世界的有趣信息或线索。显然，你可以只看他的笔记，但你也可以做得更好……你的手下已准备好按照你的要求参观波罗庄园。"
 podgreatpersons.0046.t: "玛格丽特一世"
 podgreatpersons.0046.desc: "近20年来，玛格丽特·卡佩一直统治着勃艮第和佛兰德斯。她丈夫的早逝和她孩子的巨大影响使她成为这个地区不可忽视的一股力量。意志坚强，但她不是最仁慈的统治者，在她统治期间发生的无数叛乱和镇压可以证明。尽管如此，她还是一个有能力的女政治家，她的头脑能够承受不死族的严峻性，因此，你正在考虑在她死之前采取大胆的行动$pod_Embrace$她。"
 podgreatpersons.0047.t: "迈克尔·斯科特"
 podgreatpersons.0047.desc: "腓特烈二世的科学顾问和宫廷占星家是一位奇怪的英格兰人，名叫迈克尔·斯科特。这位显然很有学问的人经常被指控使用黑魔法，因为他似乎比任何人都更了解这个世界的内部运作。就你所知，他并没有被任何超自然的力量附身……目前而言。你对他对天堂和天主的认识特别感兴趣，因为你是被造物主诅咒的存在，你想知道斯科特是否能在这一努力中发挥作用。把他从皇帝宫廷中分离出来，并把他的死伪装成一场意外并不容易，但这在你的力量范围之内。"
 podgreatpersons.0048.t: "明道加斯"
 podgreatpersons.0048.desc: "凡人的立陶宛正在慢慢地皈依基督教，正如同许多东欧国家之前所做的那样。在这里，这个流程是血腥而无情的，因为当地的宗教反对骑士团。随着首位立陶宛国王明道加斯的加冕以及他进入教廷的洗礼，转折点可能已经到来。尽管他远非狂热者，在与鞑靼人和其他公爵争夺王位的过程中，他已经数次改变宗教信仰。虽然毫无疑问的愤世嫉俗，明道加斯已经完成了很多军事和行政成就，因此，当你知道一个致命的阴谋，一场会杀死他的报复，你在考虑你的选择。初拥一位国王总是有风险的，但他的权力基础足够薄弱，你有可能成功。"
 podgreatpersons.0049.t: "尼科洛·马基雅维利"
 podgreatpersons.0049.desc: "你被最近送给你的一份手稿吸引住了。《君主论》是对$pod_cainite$政治和统治阶级的完美研究……而竟然这是一位凡人写的！马基雅维利远没有得到你认为他应得的名声，因为“道德”和“公正统治”的小问题他的杰作被撕碎了。如果凡人不能欣赏这部作品背后的天才之处，你当然可以给他一个更好的交易。一笔关于永生的交易……"
 podgreatpersons.0050.t: "尼古拉斯‧赞内金"
 podgreatpersons.0050.desc: "佛兰德斯多年来一直受到农民起义的困扰。这对$pod_cainites$来说当然是个机会，毕竟在战争时期进食要容易得多。奇怪的是，这种特殊的反抗持续了很长一段时间，如同凡人的不和一般长久，令人惊讶的是，他们成功地占领了几个城镇和抓了伯爵本人。你毫无疑问它会被碾碎，但是……这种忍耐力是有好领导在只会农民的标志。也许你可以让你的手下在下次战斗中“询问”叛军领袖的情况……"
 podgreatpersons.0051.t: "尼斯福鲁斯·布莱米底斯"
 podgreatpersons.0051.desc: "君士坦丁堡的陷落造成许多伟大学者的损失。不过，也有些人能够在混乱的余波中茁壮成长，比如尼斯福鲁斯·布莱米底斯。作为一名教师、作家和神学家，他居住在尼西亚，那里的皇帝给予他充足的庇护。他已经教过许多伟大的人物，比如亲王，现在他正考虑退休，在宁静的修道院中度过晚年。随着帝国财富的减少，这种罗马晚期文化的灯塔越来越少。因此，你在考虑给他永生，至少保存那一小部分。"
 podgreatpersons.0052.t: "蓬斯·德·卡普杜尔"
 podgreatpersons.0052.desc: "十字军对你所统治的地区是一个可怕的打击，但他们的优势是给你带来了一些有趣的人。例如，一位来自奥弗涅的游吟诗人，蓬斯·德·卡普杜尔，已经成为你宫廷里的谈资一段时间了。他魅力四射，乐观向上，脑光灵活，言语敏捷，能通过大胆的爱与骑士的歌让最严厉的十字军战士着迷。这样的才能当然可以在$pod_cainite$政治中发挥作用，有着能言善语可以让你走得很远。"
 podgreatpersons.0053.t: "罗德里戈·波吉亚"
 podgreatpersons.0053.desc: "教宗一直是吸血鬼的头痛之处，真信的纯粹力量让任何入侵都变得不可能。随着现任教宗亚历山大六世的上任，这种情况有所改变，他似乎更关注精神事务而非永恒事务。他在这方面也相当成功，通过征服和精明的外交手段，扩大了教宗国的势力范围和他家族的权力。他那不那么神圣的灵性给了你一个千古难遇的机会：你可以派人到圣座去“拯救”罗德里戈·波吉亚，他目前因食物中毒或毒药中毒卧床不起。然后，一旦藏在宫廷里，教宗就归你了……"
 podgreatpersons.0054.t: "聋子罗伊"
 podgreatpersons.0054.desc: "加利西亚本身是个国家，尽管它由卡斯蒂利亚国王统治。即使按当时的标准来看，这个与世隔绝的地区也是独裁统治者的家园。这些贵族经常对普通民众漠不关心，四年前就达到了沸点，一场起义开始了。叛军由一个名叫聋子罗伊的小贵族领导。他在早期取得了一些胜利，但风向正在改变，因为更有经验的贵族军队正在严厉镇压叛乱。虽然他们似乎注定要失败，但也许他们的领导人对你还是有些用处的。一个充满激情和军事思想的子嗣有它的吸引力……"
 podgreatpersons.0055.t: "斯坎德培"
 podgreatpersons.0055.desc: "一段时间以来，奥斯曼一直是欧洲的主要担忧。战败的瓦尔纳十字军和君士坦丁堡的陷落为他们的进一步扩张铺平了道路。但是，近二十五年来，他们一直被一个名叫斯坎德培的人挫败，他仅用很少的兵力就成功阻止了强大的土耳其战争机器。这位年长的将军在欧洲被誉为英雄，他再次团结了新联盟，但一种致命的疾病让他失去了控制。在没有康复希望的情况下，你想知道这是否是一个“拯救”他并把他带到你的宫廷的好时机。毕竟，失去这样一位才华横溢的防御大师是一件憾事。"
 podgreatpersons.0056.t: "斯诺里·斯蒂德吕松"
 podgreatpersons.0056.desc: "冰岛是一个偏远的国家，即使对其他斯堪的纳维亚人来说也是如此，但你注意到一个关于斯诺里·斯蒂德吕松的故事，他显然是岛上最有权势的政治家。作为一位研究北欧神话的学者，斯诺里在混乱的冰岛和挪威政治中摸爬滚打了几十年，但似乎挪威国王已经受够了这混乱。你们的一个手下报告说，有一场针对冰岛议员的暗杀正在进行中。当然，这与你无关，但是如果你愿意，你可以选择拯救斯诺里并将其带回宫廷。他可以成为一个有趣的$pod_Embrace$候选人。"
 podgreatpersons.0057.t: "速不台"
 podgreatpersons.0057.desc: "蒙古汗帐把从中国到波兰的所有敌人都消灭了。在政治上，成吉思汗当然是主要因素，但在军事上，他的主要战略家速不台才是幕后的那个人。他组织了二十多次战役，打了六十五场胜仗，在大草原上声名远扬。在七十二岁高龄的时候，速不台终于决定从战场上撤退，这给了你一个在没有整个军队的窥视的情况下去$pod_Embrace$他的大好机会。"
 podgreatpersons.0058.t: "亚维拉的德兰？"
 podgreatpersons.0058.desc: "自从西班牙的裁判所开始活动以来，伊比利亚已经变得对吸血鬼来说相当不舒服。你已经尝试了许多大大小小的计划来减少教廷的影响，而且效果很好，直到亚维拉的德兰来了。这位固执的修女几乎独自一人进行了改革，重新点燃了伊比利亚对基督教的热情。你在她的路上设置了许多障碍，包括你在裁判所和教廷的间谍，但都无济于事。现在，你是在让这件事过去，掩盖你的痕迹。这样做的最后一步是“照顾”你的宠物，教宗特使埃吉迪奥·卡哈尔，自从他没能阻止她以来，他一直在逃避你的愤怒。但没人能一直逃脱你的手掌心……"
 podgreatpersons.0059.t: "狄奥多尔·梅托齐特斯"
 podgreatpersons.0059.desc: "罗马的政治变化无常，而一个人的命运很容易改变。其中一个人就是随后的安德洛尼卡二世的宠儿狄奥多尔·梅托齐特斯。作为一位学者、艺术赞助人和著名的外交家，狄奥多尔的职业生涯大部分归功于他的个人才能，但也归功于他与正确的人之间的友谊。当安德洛尼卡被赶下台后，梅托齐特斯在宫廷中失去了所有的声誉，现在隐居在修道院中度过余生。你的一些廷臣认为这样做是对一位有才能的人的浪费，你可以干预一下，也许可以帮助一位心怀感激的未来子嗣恢复前途。"
 podgreatpersons.0060.t: "狄奥多拉·巴列奥略"
 podgreatpersons.0060.desc: "经过近六十年的拉丁统治，君士坦丁堡再次被罗马残余势力占领。一段艰苦的复辟时期正在进行，这是由皇后狄奥多拉·巴列奥略亲自宣布的。作为新皇族坚定的母主，她经受住了许多政治和宗教风暴。她丈夫的早逝给她留下了一个相对强权的位置，她用来引导明智的赞助和建筑工程。她是希腊人重新掌权的有力象征，你知道你的许多对手想要干涉她。如果你想行动起来占有这个象征，现在就是时候。"
 podgreatpersons.0061.t: "特奥多尔·冯·诺伊霍夫"
 podgreatpersons.0061.desc: "一个有趣的人物最近来到了聚特芬。这个人，特奥多尔·冯·诺伊霍夫，负债累累，他卖掉了自己的头衔……科西嘉岛的王位。事实上，在热那亚岛上发生了一场短暂的叛乱之后，居民们就把这位德意志冒险家“加冕”为他们未来的国王。他只担任了几个月的任期，他的“王国”就分崩离析了。现在，他来了，就像一个失去了一切的骗子。但至少，他讲了一个很好的故事。这里有过前途更糟糕的子嗣而非一个能逗你开心的人。"
 podgreatpersons.0062.t: "特奥巴尔多·德·纳瓦拉"
 podgreatpersons.0062.desc: "很少有人能比特奥巴尔多·德·纳瓦拉更能代表骑士的理想。他经历过致命的阴谋（并策划了一些阴谋），参加过一次成功的十字军，爱上了一位有夫之妇（一位重要的女王），作为一个受人爱戴的“叙事诗人”写过许多歌曲。同时，他还成功地从香槟伯爵上位成纳瓦拉国王，并在那里成功地统治。你最近了解到，在从香槟之旅回来的路上，特奥巴尔多得了重病，他的护送者放慢了速度。这可能是一个独特的机会，你的手下会“拯救”垂死的国王，并把他带到你的宫廷。像他这样有成就的人是一位有趣的$pod_Embrace$候选人。"
 podgreatpersons.0063.t: "托马斯·阿奎那？"
 podgreatpersons.0063.desc: "你的一位小对手对阿基诺的一个庄园发动了一次鲁莽的攻击。你也不知道为什么，他有着那里的家族的人质，而他们被一个叫托马斯的家族成员彻底清洗了。这位博学的人想要加入道明会，并且似乎显现出极度的聪慧，他已经为教廷提出了许多新的想法。无论如何，他的真信把你的对手焚烧，你现在就剩下一堆烂摊子要应付了。托马斯本身是无懈可击的，但你可以从让他的母亲“消失”开始。你的手下认为这个女人实际上是一个可选的$pod_Embrace$候选人，在过去使用了一些不光明的策略来实现她的目标。"
 podgreatpersons.0064.t: "托马斯·闵采尔"
 podgreatpersons.0064.desc: "宗教改革正如火如荼地进行着，它一开始对吸血鬼来说还是件好事，但随着教廷的衰弱，现在跑来跑去的圣人比以往任何时候都要多。你试图打压他们的任何努力充其量都是无果而终。有个叫托马斯·闵采尔的传教士特别给你带来麻烦，他创立了一个“天主永恒联盟”，主要由越来越多的叛逆农民组成。他对即将到来的末日充满热情的谈论让你紧张，你正在考虑派遣一些你的手下在他的下一次战斗中把他带到你的宫廷。然后，你就可以让他看到地狱的真面目……"
 podgreatpersons.0065.t: "帖木儿？"
 podgreatpersons.0065.desc: "自从帖木儿开始他残酷的征战之路以来，他一直是你的主要问题。他自称是成吉思汗的继承者，到目前为止没有人能阻挡他，他的战争导致无数城市被掠夺和烧毁，这对吸血鬼的狩猎场来说可不是什么好事。当$pod_cainite$难民开始在你的宫廷中制造麻烦时，你会考虑一个可能的解决方案。到目前为止，任何抓捕或杀死他的企图都失败了，似乎他受到某种超自然力量的保护。另一种选择是诱拐他最喜欢的妻子也是最亲密的顾问。如果运气好的话，这可能会让他稍微停顿一下。运气不好的话，你也知道她被称作才华横溢又美丽动人，这两种有趣的品质使得她值得$pod_Embrace$。"
 podgreatpersons.0066.t: "托马斯·德·托尔克马达"
 podgreatpersons.0066.desc: "在黑夜世界里，裁判所已经如火如荼地活动了相当一段时间。但是，最近，随着西班牙裁判所得到教宗的正式承认，它已经获得了足够的支持来在凡人国家中传播自己。这使得伊比利亚的$pod_cainites$的亡生变得更加艰难，你的臣民也会因为你“做得不够”而轻视你。裁判所太强大了，现在已经无法推翻，但对其领袖托马斯·德·托尔克马达的擒贼先擒王式打击，将是一场道德上的胜利，而你可以好好利用。只要你能$pod_Embrace$他……"
 podgreatpersons.0067.t: "乌尔里希·冯·列支敦士登"
 podgreatpersons.0067.desc: "一种新的时尚正在这些变化无常的凡人身上流行起来，那就是“宫廷爱情”，里面有穿着闪亮盔甲的骑士的故事，还有与已婚女士的纯洁浪漫。和所有与凡人有关的事物一样，这将无法经受住时间的考验，但在那之前……理解他们当前的想法总是好的。你的手下向你推荐了一位名叫乌尔里希·冯·列支敦士登的人，他是一位流浪骑士和诗人，是骑士精神的典范。这人能言善辩，臂膀结实，对你的用处可不止一个方面。"
 podgreatpersons.0068.t: "瓦斯科·达·伽马"
 podgreatpersons.0068.desc: "最近，随着一位名叫瓦斯科·达·伽马的葡萄牙探险家的旅行，与欧洲的接触正在增加。虽然这个人说的是富有的贸易大联盟，但他的行动却表明了事实并非如此。他屠杀了一艘旅行的穆斯林船只上的平民，并以一支完整的舰队来报复所谓的扎摩林国王的侮辱。现在很明显，葡萄牙人带着征服者的心态来了，我们必须给他们一个教训。抓住并初拥无情的“印度副王”将是对任何试图侵占你们家园的欧洲$pod_cainites$的警告。"
 podgreatpersons.0069.t: "瓦特·泰勒"
 podgreatpersons.0069.desc: "人们对国王理查二世和瓦特·泰勒会面的结果有一种期待的气氛，他们都主持了贵族和农民起义之间的和平会议。泰勒是叛军领导人中最顽固的，迄今为止，他拒绝国王做出任何让步。你可以肯定的是，许多重要的$pod_cainite$人物聚集在会议的阴影下，特别是围绕着泰勒的情人，一位来自博林布鲁克的女族长。同样地，你也热衷于派遣一些你自己的手下到现场，以确保你不会落后于你的竞争对手的计划。唯一剩下的问题是你手下的行动力度。你会给他们提供足够的资源和金钱来赢取这场竞赛的“奖品”，还是只是命令他们旁观竞赛？"
 podgreatpersons.0070.t: "威廉·华莱士"
 podgreatpersons.0070.desc: "随着苏格兰独立战争的持续，苏格兰人失去了一位主要指挥官。威廉·华莱士在福尔柯克战败后就失宠了，但他仍然是苏格兰的守护者之一，也是苏格兰人民的有力象征。自福尔柯克以来，华莱士一直在欧洲各地寻找支持他的功业的人，直到他回到英格兰，在那里他被抓获。审判已经开始，这次审判的判决不会让任何人感到惊讶。苏格兰人可能会坚持并团结在他们的殉道者身后，但失去这样一个意志坚定的人将是一种耻辱。你可以牵线搭桥，在他被处决前安排一个接替者。然后，他就全归你了……"
 podgreatpersons.0071.t: "纳迦什"
 podgreatpersons.0071.desc: "一个精神错乱的老人最近在埃及闹得沸沸扬扬。这个人声称是“第一位永生者”和“尼赫喀拉”的皇帝。他说他的一个法术出了严重的错误，把他丢到了“我们的世界”。奇怪的是，他知道吸血鬼，即使他对他们有一些奇怪的误解（他坚持认为只有五条“血系”）。在任何情况下，他都是一个累赘，因为他很明显太过自我，可能会给我们带来一些不必要的关注。因此，你可以派一些你的手下把他带到你的宫廷，然后亲自处理他。"
 podgreatpersons.0072.t: "萨德·达瓦"
 podgreatpersons.0072.desc: "一位犹太政治家最近名声大噪。萨德出身贫寒，而他对国家事务的掌控能力使他成为蒙古可汗宫廷里的一笔宝贵财富。同样以其广博的医学知识和对艺术的赞助而闻名，这位犹太大维齐尔仍然有一个很大的缺点：他的自大。\n他的敌人很多，从因腐败而受到鞭打的蒙古官员，到感觉受到外国人阻碍的穆斯林。在可汗的保护下，萨德至今领先一步，但他的好运已经不多了，因为他的保护神最近生病了。想要谋杀他的阴谋的数量甚至以$pod_cainite$的标准来看都令人印象深刻。因此，如果你想采取行动，让他远离尘世政治，现在正是时候。这样的人肯定会成为一个很好$pod_Embrace$的候选人。"
 Sa_ad_al_Dawla: "萨德·达瓦"
 Abu_al_Baqa_ar_Rundi: "阿布·拜盖·伦迪"
 podgreatpersons.0073.t: "阿布·拜盖·伦迪"
 podgreatpersons.0073.desc: "随着安达卢西亚的城市因再征服一个接一个地落入基督教手中，黄金时代的遗产也随之消失。一位塞维利亚的作家自愿来永恒化这些失落城市的荣耀。\n他的这首诗采用了古典的哀叹形式，被称为“安达卢西亚的挽歌”，在他作为难民逃入的马格里布王国获得了广泛的赞誉。\n尽管如此，帮助安达卢西亚人的实际支持却寥寥无几，而阿布·拜盖现在已是一个疲惫的老人，不太可能看到他的梦想实现。除非你赐予他永恒的时间，让他策划复仇……"
 Sheikh_Bedreddin: "谢赫·贝德尔丁"
 podgreatpersons.0074.t: "谢赫·贝德尔丁"
 podgreatpersons.0074.desc: "奥斯曼苏丹国正在遭受大规模爆发的叛乱。虽然军事局势似乎在朝着有利于苏丹的方向发展，但你对叛军的领袖感到了兴趣。\n这位复杂的人物，谢赫·贝德尔丁，是第一位宣扬资产集体所有制以及基督徒和穆斯林间的平等的神学家。他在军事事务上也毫不懈怠，曾担任过奥斯曼王子穆萨的首要军事教官。在吸血鬼的缓慢政治中，革命性的思维方式是危险的，但你仍然想要确保这个叛逆者最终在你的控制之下……"
 Alauddin_Ali_Shah: "阿拉乌丁·阿里·沙"
 podgreatpersons.0075.t: "阿拉乌丁·阿里·沙"
 podgreatpersons.0075.desc: "孟加拉最近上演了三位王子之间争夺苏丹国的控制权的激烈权力斗争。这场战争之所以引起你的兴趣是因为其中一位参战者，阿拉乌丁·阿里·沙，的残酷野心。\n这个曾经被赶下台的人，以冷冰冰的效率通过杀戮和篡位获得了他目前的权力基础。很难说他是否能在当前的战争中重现这一成就，但这样一个熟练而残忍的领导人对你的宫廷是有用的……"
 Birger_Jarl: "比尔格·雅尔"
 podgreatpersons.0076.t: "比尔格·雅尔"
 podgreatpersons.0076.desc: "比尔格·雅尔在外交和战争方面都是一位有成就的政治家，几十年来一直是瑞典的真正力量。他巧妙地利用教廷来推动自己的目标，遏制了大多数巨头的权力，为日后建立一个强大的中央集权的瑞典王国铺平了道路。\n然而，这名男子不仅被战争和野心所驱使，他提出的在偏远地区建立一个名为“斯德哥尔摩”的新城市的建议也结出了硕果。不过，他的寿命终究要完了，这位自称瑞典公爵的人可能很快就会迎来自己的最终命运。除非你打算为他安排另一种命运……"
 Zawisza_Czarny: "扎维沙·恰尔内"
 podgreatpersons.0077.t: "扎维沙·恰尔内"
 podgreatpersons.0077.desc: "你一直以极大的兴趣关注着一位叫扎维沙·恰尔内的人的生涯。这位以骁勇善战著称的波兰骑士长久以来一直是值得$pod_Embrace$的目标。\n扎维沙是许多大赛的获胜者，是军队的领袖，甚至是外交官，他有许多有用的才能，你渴望他被取用于你。他最近称他的国王是懦夫，因为他在与奥斯曼土耳其人的战斗中逃跑了，并计划独自继续这场战争。一个勇敢的，自杀性的，行动。远离着宫廷和大部分军队，现在是你出击的好时机。"
 Seguin_de_Badefol: "塞甘·德·巴德福"
 podgreatpersons.0078.t: "塞甘·德·巴德福"
 podgreatpersons.0078.desc: "作为法兰西约翰二世雇佣的雇佣兵，塞甘在战争结束时过的并不好，转而从事强盗和打劫。他攻占了60座城堡，击溃了皇家军队，成为东法兰西事实上的统治者，直到教皇和国王给了他一大笔钱才罢手。\n现在塞甘很富有，但仍在从事雇佣兵工作，他受雇于纳瓦拉国王卡洛斯二世……直到他试图从他那里敲诈更多的金子。国王让人下毒了他，塞甘现在正慢慢死去。\n这样的“创业家”可能是一个很有前途的候选人……"
 Owain_Lawgoch: "欧文·劳戈赫"
 podgreatpersons.0079.t: "欧文·劳戈赫"
 podgreatpersons.0079.desc: "格温内斯古老的威尔士国王的最后一位男性后裔，这片土地上最优秀的战士之一最近引起了大家的注意。这个人的职业生涯很长，因为他决心重夺其合法的王位，甚至发动了两次入侵，在英格兰引起恐慌。\n他的第一支舰队因风暴而无法登陆，而第二支舰队则被调遣去支援法兰西国王。在没有入侵威尔士的时候，欧文在百年战争中为法兰西作战，并指挥一队威尔士雇佣兵对抗佩德罗，卡斯蒂利亚的残酷者。\n他最近与卡斯蒂利亚国王达成了协议，并计划在他的帮助下入侵夺回他的家园。你得知英格兰派了一个间谍去杀他，这可能是你把他绑架到你宫廷的绝佳掩护。"
 Roger_de_Flor: "罗杰·德·弗洛尔"
 podgreatpersons.0080.t: "罗杰·德·弗洛尔"
 podgreatpersons.0080.desc: "最初是圣殿骑士团的成员，罗杰·德·弗洛尔在做出于亚柯之围中的可耻行为后被从骑士团开除。他控制了一艘圣殿骑士团的战舰，并收取巨额费用将平民运送到塞浦路斯的安全地带。当了一段时间的海盗后，罗杰看到了一个获取财富的机会。他用被开除的阿拉贡士兵创建了一个雇佣团——加泰罗尼亚大队。\n从那以后，他成为拜占庭政治中的一支重要力量，作为一名成功的雇佣兵队长对抗土耳其人。然而，罗杰的大胆可能会导致他的死亡，因为他在安纳托利亚建立一个雇佣军王国的野心让他树敌众多。\n这给了你一个伪造他被谋杀的机会，并将其收为己有。"
 podgreatpersons.0081.t: "麻风者亚当"
 podgreatpersons.0081.desc: "英格兰最近正经历着一场犯罪浪潮，其中最著名的强盗头目叫麻风者亚当。\n在他最著名的犯罪中，亚当得知菲莉帕王后把自己的珠宝留在了当地的一个商人那里。麻风者的匪帮包围了商人的房子，要求他交出珠宝。愤怒的商人拒绝了，并顽强地应对了数次攻击，直到亚当恼羞成怒，放火烧楼。于是，情况发生了变化，商人和他的家人想逃出去，而亚当却把他们关在屋里，直到他们把珠宝丢了出去。\n从那以后，这个现在很有钱的强盗就再也没有被抓到过……直到你的手下偶然发现了他的老巢，纯靠运气。\n这位年老的不法之徒已经表现出了狡猾和力量，你想知道他是否能成为一个值得的子嗣。"
 podgreatpersons.0082.t: "莫姆奇尔"
 podgreatpersons.0082.desc: "莫姆奇尔是一位保加利亚强盗，他在罗多彼山脉建立了一支农民组成的个人军队，他曾短暂地效忠于塞尔维亚的斯特凡·乌罗什，却在当前的拜占庭内战中真正崭露头角。在一次令人印象深刻的背叛表现中，莫姆奇尔在1343年、1344年和1345年连换阵营。\n通过两面作战，他得以在边境地区建立起自己的势力。\n他已经成为一个巨大的威胁，以至于拜占庭人和土耳其人现在联合起来要一劳永逸地对付他。他似乎不太可能抵挡住这样的袭击。\n这个人显然已经表现出了在吸血鬼社会中做成事所需要的天生野心和狡诈，因此，你的廷臣们正在敦促你考虑在即将到来的战斗中派人伪装其假死，然后把他带到你的面前。"
 Arnaud_de_Cervole: "阿尔诺·德·塞沃利"
 podgreatpersons.0083.t: "阿尔诺·德·塞沃利"
 podgreatpersons.0083.desc: "韦利讷的主助祭，直到他发现雇佣兵的职业更符合他的胃口，阿尔诺组建了第一个“大佣兵团”，并带领它进入普罗旺斯，它才避免遭受战争中的严重破坏。没过多久，佣兵们就把这里变成了一片荒地。\n1358年，基本上把教宗绑架为人质，主助祭成就了他的恶名，他包围了阿维尼翁的教宗所在地，并要求了2万弗罗林作为离开该地区的赎金。此后，阿尔诺基本上又回到了合法的雇佣军工作中。\n在他的职业生涯中，他结识了许多敌人，因此主动要求加入远离法兰西的十字军东征。不过这次战役的后勤部分很不稳定，主助祭现在被困在离你势力范围不远的地方。\n或许有机会向他请愿，让他把其的才能借给你的宫廷？"
 Robert_of_Geneva: "罗伯特·德·日内瓦"
 podgreatpersons.0084.t: "罗伯特·德·日内瓦"
 podgreatpersons.0084.desc: "你早就怀疑阿维尼翁的现任教宗克莱孟七世可能是位吸血鬼。主要是因为他骗取了一座被围困的城市，许诺手下留情，然后在“血！更多的血！”的呼喊声中杀死了里面的所有人，这为他赢得了其的称号。\n不过奇怪的是，他似乎只是一个普通的，虽然不正常的，但野心勃勃的凡人。身为教宗，他学识渊博，手艺高超，自年轻时当过司令官，因此熟悉战事。\n他显然也不像你听说的其他大多数教宗那样，受到真信的保护。因此，他是一个诱人的$pod_Embrace$候选人……"
 Louis_d_Estouteville: "路易斯·德埃斯图特维尔"
 podgreatpersons.0085.t: "路易斯·德埃斯图特维尔"
 podgreatpersons.0085.desc: "在百年战争中，当法兰西在英格兰的攻击下崩溃时，圣米歇尔山仍然在抵抗。由119名法兰西骑士防守的这个小圣地，已经击退了由20000多名英格兰人组成的军队……两次。\n骑士们由一位叫路易斯·德埃斯图特维尔的人领导，他是法兰西军队的一位坚强的队长。骑士们被他们奇迹般的胜利所鼓舞，已经开始解放诺曼底的乡村，而英格兰人则争先恐后地进行防御。\n在目前的混乱中，于路易斯远离着圣地，这也许是一个独特的机会，让你招募到这样一位技艺高超的领袖人物。"
 Lodewyk_van_Bercken: "路德维克·范·贝肯"
 podgreatpersons.0086.t: "路德维克·范·贝肯"
 podgreatpersons.0086.desc: "这些变幻莫测的凡人又有了新追求：钻石。这种公认的漂亮饰品是他们所有宫廷的话题，也是真正的现代贵族的标志。你可能想模仿他们，像他们说的那样与时俱进。\n来这样做的最好机会最近出现在路德维克·范·贝肯身上，这位精明的佛兰德珠宝商发明了一种新的钻石抛光工具，助火了钻石的突然流行。对你来说，还有什么比在眼皮底下窃取他们的珍贵工匠，来嘲弄这些凡人更好的事呢？"
 Lorenz_Helmschmied: "洛伦茨·黑尔姆斯米德"
 podgreatpersons.0087.t: "洛伦茨·黑尔姆斯米德"
 podgreatpersons.0087.desc: "哈布斯堡家族的宫廷装甲师，一位叫洛伦茨·黑尔姆斯米德的人，最近引起了你的注意。这位极富天赋的工匠创造了这个时代一些技术上最创新、艺术上最复杂的盔甲。不少于两位神圣罗马帝国的皇帝都装备他的作品参加战斗。\n作为一位吸血鬼，你不需要像那些虚弱的凡人那样的保护，但是，有这样一个有天赋的人为你工作，既是会带来声望，也是有用的。而且你不希望你的敌人在你之前抓住他，以免他们最终用这些极好的盔甲来对付你……"
 Robert_Porter: "罗伯特·波特"
 podgreatpersons.0088.t: "罗伯特·波特"
 podgreatpersons.0088.desc: "作为黑夜的统治者，你需要一个在各个领域方面有才能的人，如战争、管理、外交……一个人能够假装精通其中几个领域是很罕见的。但你可能在一个叫罗伯特·波特的人身上发现了例外。\n波特是议会派的热心成员，开始时他是他们的铁匠，后来被任命为骑兵队队长。然后他还发表了一篇宣传文章，最后被任命为议会派一个驻军的财务总管。毫无疑问，一个拥有如此多样技能的人可以在你的宫廷中发挥作用。"
 Daniel_Hopfer: "丹尼尔·霍普弗"
 podgreatpersons.0089.t: "丹尼尔·霍普弗"
 podgreatpersons.0089.desc: "最近，一位名叫丹尼尔·霍普弗的巧匠引起了大家的注意。他是一位德意志艺术家，是第一个在版画中使用蚀刻技术的人，从而使盔甲的装饰比以往更加精美。他还与其他工匠合作，并且已经有一批热心的弟子跟随他的脚步。\n他的作品的质量已经引起了帝国宫廷的注意，但如果你现在采取行动，你可能比他们更快。哪个自尊心强的夜晚的统治者会放弃由这一领域最好的大师之一制作一套著名的盔甲的可能性？"
 William_Dampier: "威廉·丹皮尔"
 podgreatpersons.0090.t: "威廉·丹皮尔"
 podgreatpersons.0090.desc: "作为一名海盗、探险家、航海家、私掠者和博物学家，威廉·丹皮尔船长可能是你在很长一段时间内听到的最引人兴趣的适任者之一。他一次又一次地展示了在亡生时所需要的勇气，他的勇敢和对同龄人的残忍是很大的帮助。\n这样一个人可以成为一个强大的资产……只要拴紧他的项圈。请记住，众所周知，他曾无数次地背叛了他的雇主。这种恶徒只对自己负责。"
 Catherine_Deshayes: "凯瑟琳·德沙耶"
 podgreatpersons.0091.t: "凯瑟琳·德沙耶"
 podgreatpersons.0091.desc: "明日在巴黎，有人将因巫术而被烧死在火刑柱上。这其实不是什么罕见的事情，但这个特定的“魔女”引起了你的兴趣。这个女人擅长为达官贵人算命。还擅长炼金术、投毒、黑弥撒……为了从易受骗的法兰西贵族那里敲诈一些金钱，她似乎没有任何下限。\n当她开始在仪式中使用撒旦的意象时，她的命运发生了变化，这使得法兰西宫廷中的一系列中毒事件被归咎于她。\n不管事情的真相如何，这样一个……创新的“创业者”可以在很多方面对你的宫廷有用。"
 Ontsifor_Lukinich: "安西弗尔·卢基尼奇"
 podgreatpersons.0092.t: "安西弗尔·卢基尼奇"
 podgreatpersons.0092.desc: "来自诺夫哥罗德家族的安西弗尔曾多次当选为该市的波萨达尼克（民选市长）。他第一次出现在你的手下报告中，是在他率领城市的军队抵抗最近的瑞典入侵时，尽管处于劣势，但还是做得相当好。\n不仅仅是一名军人，安西弗尔还改革了波萨达尼克办公处，创建了一个由数个成员组成的新的统治集体，据你所知，这在诺夫哥罗德政治中可是第一次。一个拥有这样才能的人肯定会对你崇高的功业有所帮助。"
 podgreatpersons.0093.t: "伊万"
 podgreatpersons.0093.desc: "一位年轻的、看上去头脑简单的男人最近成了你地区的话题。伊万是他家最小的弟弟，他总是很开朗，且善良到愚蠢的地步。他也经常是许多的荒诞故事的（非自愿）英雄，从龙到被绑架的公主，他总是在以某种方式在最后获胜。\n你怀疑这些故事的幕后真相是某位聪慧的末卡维的恶作剧，但若伊万确实具有非凡的运气或其他超自然天赋呢？你至少可以把他带到你的宫廷去调查。"
 Kudeyar: "库德亚"
 podgreatpersons.0094.t: "库德亚"
 podgreatpersons.0094.desc: "该被称为库德亚的人显然是伊凡雷帝的私生子长兄，他迅速成为了你地区的一个传奇。他在顿河附近领导着一队哥萨克好汉，他的武艺和无畏的勇气使他在整个国家享有盛名。他的目标大多是贵族，或其他不太受欢迎的人物，这也有助于塑造他作为穷人和被压迫者的英雄形象。像他这样令人印象深刻的指挥官和熟练的宣传员可能会对你有帮助。"
 Ivan_Bolotnikov: "伊万·博洛特尼科夫"
 podgreatpersons.0095.t: "伊万·博洛特尼科夫"
 podgreatpersons.0095.desc: "凡人的俄罗斯陷入了动乱时期，各类军阀相互冲突。其中一位是位足智多谋的前主教，他在作为叛军领袖回来之前，曾多次逃出监狱和奴役。\n不过在这个混乱的时代，他很快就摆脱了为任何除了自己之外的事物而战的伪装，很快就被人畏惧而不是尊重，尤其是在他策划摧毁了数个城镇之后。若他加入黑夜世界，这反而是一种宝贵的品质。实际上，你有机会做到这一点，因为他最近投降了，可能很快就会面临处决。"
 Dmitri_Ivanovich: "德米特里·伊万诺维奇"
 podgreatpersons.0096.t: "德米特里·伊万诺维奇"
 podgreatpersons.0096.desc: "在对莫斯科的一次不成功的攻击之后，又一军阀在俄罗斯的动乱时期倒斃。这人以伊凡雷帝失落的儿子自居，这并不是很原创，并以某种方式设法获得足够的可信度，以集结了一支令人印象深刻的军队。\n他的军事命运好坏参半，但你最佩服的是他坚持谎言的能力，因为他能够把贵族和农民都团结在他的假旗帜后面。也许你可以利用他？他似乎当然有必要的先决条件，可以成为一个有能力的，即使不是真正值得信赖的子嗣。"
 Alena_Arzamasskaia: "阿列娜·阿尔扎马斯卡娅"
 podgreatpersons.0097.t: "阿列娜·阿尔扎马斯卡娅"
 podgreatpersons.0097.desc: "另一场农民起义在凡人的俄罗斯被粉碎，但这一对你来说有特殊的趣处。叛军领袖之一是一位可怕的女人，显然是位前修女，她伪装成男人来领导她的军队。她在射箭和医学方面的技能使她成为相当大的敌人，在避难的修道院里射杀了许多沙皇党之后，她才被俘。\n即使是酷刑也无法击垮她，她很快就会被烧死在火刑柱上，而她仍然没有背叛她的手下。这样一个有前途的凡人这么快就去世的话，实在是太可惜了，你思考着是否要干涉。"
 Domentijan: "多门蒂扬"
 podgreatpersons.0098.t: "多门蒂扬"
 podgreatpersons.0098.desc: "作为一名僧侣、抄写员、作家和哲学家，多门蒂扬一段时间以来一直受到你宫廷的赞赏，他的作品被详细讨论。虽然他很喜欢修道院的生活，但他也不是隐居者，他曾为数个宫廷工作，并亲自到耶路撒冷朝圣。\n这样一个学识渊博、游刃有余的人可以成为你的宫廷的资产，甚至可能是一位有潜力的子嗣。由于他现在已经很老了，所以如果你想的话，伪造他的死亡是很容易的。"
 Milos_Obilic: "米洛斯·奥比利奇"
 podgreatpersons.0099.t: "米洛斯·奥比利奇"
 podgreatpersons.0099.desc: "奥斯曼帝国的苏丹穆拉德最近在战场上被一个无畏的塞尔维亚骑士暗杀了。细节尚不清楚，但这次袭击似乎是一次大胆的攻击，也许还涉及到一些欺诈。你正在注意$pod_cainite$是否参与其中，但围绕这位新英雄的民间传说已经让你难以辨别真相。\n你显然怀疑他是“龙之子”，或者他在暗杀之前得到过芭芭雅嘎的帮助。但有一点是肯定的，这个人是一个伟大的战士，而且足智多谋。这些品质足以让你考虑将他作为潜在的$pod_Embrace$候选人。"
 Jefimija: "耶菲米娅"
 podgreatpersons.0100.t: "耶菲米娅"
 podgreatpersons.0100.desc: "作为一个不幸的母亲和哀伤的妻子，耶菲米娅在她的生活中失去了一切……还不止一次。她的儿子在襁褓中死去，她的丈夫和兄弟在战争中死去，后来她的贵人和她的朋友也在同一战争中死去。然后，她的国家被奥地利人和奥斯曼人分割了。\n这些困难给予了她灵感，她创作了一些非常受欢迎的哀歌，一种长篇的悲伤诗歌。你那颗不跳动的心不容易被打动，但这可能是一个例外。无论如何，除了她的生命，她还能失去什么？"
 Ivan_Gundulic: "伊凡·贡杜里奇"
 podgreatpersons.0101.t: "伊凡·贡杜里奇"
 podgreatpersons.0101.desc: "吉沃·弗兰诺夫·贡杜里奇是拉古桑共和国的一名有成就的外交官和博学者，他来自一个贵族世家，且在你地区已经存在很长一段时间了。这位特殊的后裔是一位狂热的天主教徒，并利用他的文学才能来帮助这一功业。作为市政府的成员，他在行政管理方面也表现出有趣的能力。\n你正在考虑采取行动，这样的人可能会有用处。也许可以他能写一本煽动性的小册子来针对你的对手？"
 Giorgio_da_Sebenico: "乔治·达·塞贝尼科"
 podgreatpersons.0102.t: "乔治·达·塞贝尼科"
 podgreatpersons.0102.desc: "一位意大利建筑大师几十年来一直在修缮希贝尼克的圣雅各伯主教座堂。显然，他表现出的才能和耐心与那些短命的凡人非常不同，你一直对这个人和他的工作感到好奇。有些人看着他的成就，看到了来自神圣的灵感，虽然你与天主的关系与大多数凡人不同，但你至少也感受到了一些奇特的东西。\n虽然建筑师并不完全是你想要的直应职业生涯的$pod_Embrace$候选人，但这可能任有一些好处，可以深入探讨。若不出意外的话，至少可以翻新你那可能相当陈旧的内饰。"
 Marin_Drzic: "马林·德尔基奇"
 podgreatpersons.0103.t: "马林·德尔基奇"
 podgreatpersons.0103.desc: "一个奇特的凡人最近一直在吸引着你的宫廷。在经历了翻译、抄写员和教会音乐家的生涯后，马林·德尔基奇过着冒险家、逃犯和喜剧作家的生活。更有趣的是，他实际上已经相当接近于揭开$pod_cainite$在杜布罗夫尼克的存在。\n事实上，你的手下截获了几封他写给佛罗伦萨的美第奇的信，请求他们帮助摆脱“真正统治他的城市的小规模精英贵族”的影响。你没有直接的危险，但你不能否认，这个凡人已经证明了他的才能和他的足智多谋，也许，值得与你会面。\n是时候让他见见这些“幕后主人”了。"
 Rodion_Oslyabya: "罗迪翁·奥斯利雅维亚"
 podgreatpersons.0104.t: "罗迪翁·奥斯利雅维亚"
 podgreatpersons.0104.desc: "当俄罗斯人庆祝他们在库里科沃之战中战胜蒙古人的时候，你已经知道了他们的一位指挥官的贡献。这人，显然是个僧侣或波雅尔，以极大的勇气和效率领导了俄罗斯骑士。\n由于没有骑马，他有一段时间被认为是死了，但在战斗中重新出现，再次表现出众。他的成就为他赢得了俄罗斯领导人的尊重，他很快就要出发去拜占庭帝国执行外交任务。你可以进行干预，因为这样一位热心和有魅力的将军肯定能对你的计划有所帮助。"
 Alexander_Peresvet: "亚历山大·佩雷斯维"
 podgreatpersons.0105.t: "亚历山大·佩雷斯维"
 podgreatpersons.0105.desc: "你随意地关注着凡人的世界的新闻，似乎俄罗斯的凡人正在尽力从蒙古人的枷锁中解放出来。这对你来说并不重要，但战争往往孕育着有用的人才，因此，你的手下一直在关注着事情的发展。\n他们的最新发现是一位叫亚历山大·佩雷斯维的人，这个僧侣在最近的战争开始时与一个鞑靼勇士进行了决斗。它以平局告终，你的手下在战争开始前勉强救了这位凡人。显然，这个战士是一个勇敢而执着的家伙，因为很少有人愿意像这样冒生命危险。你可以将他作为你自己的勇士，或者甚至可以$pod_Embrace$他。"
 Ivan_Vyrodkov: "伊万·维罗德科夫"
 podgreatpersons.0106.t: "伊万·维罗德科夫"
 podgreatpersons.0106.desc: "俄罗斯的日子看起来很严峻，因为伊凡雷帝制定了特辖区管，这是一项大规模镇压和处决政策，用以巩固其统治。潜在的受害者之一是一位你不愿意失给卑微的凡人政治的家伙。\n几十年来，伊万·维罗德科夫一直是俄罗斯的主要军事工程师，他发明了新的革命性机械，如炮台塔楼。他还在各个城市的大规模建筑工程中立下汗马功劳，仅在一个晚上就建造了一座12米高的攻城塔。你可以介入干涉，让他免于承受伊凡雷帝的怒火，从而使一位感激不尽的优秀军事工程师为你服务。"
 Yermak_Timofeyevich: "叶尔马克·齐莫菲叶维奇"
 podgreatpersons.0107.t: "叶尔马克·齐莫菲叶维奇"
 podgreatpersons.0107.desc: "当新生的俄罗斯帝国在西伯利亚进行首次征服时，有一个人一直在领导他们：叶尔马克·齐莫菲叶维奇，一位哥萨克人、冒险家和卡里斯玛型领袖。他曾经是一位卑微的暴徒和河盗，他的战斗经验为他赢得了一个军事职位，他很快就表现出色。随后，他被选为西伯利亚远征军的领导人，从那时起，你就听说到他的功绩和征服了。\n但死亡不等人，你也听说了鞑靼人计划的伏击，这可能会缩短他的生涯。这可能是伪造他的死亡并把他介绍给你的宫廷的最佳时机。也许你也有全新的土地要征服。"
 Ridolfo_Fioravanti: "里多尔福·菲奥拉万蒂"
 podgreatpersons.0108.t: "里多尔福·菲奥拉万蒂"
 podgreatpersons.0108.desc: "伴君如伴虎，就像你最近听说凡人的俄罗斯的统治者伊凡三世把他曾经最喜欢的意大利建筑师关进了监狱。里多尔福·菲奥拉万蒂来自博洛尼亚，他在那里作为意大利最受欢迎的建筑师之一工作，然后被邀请到莫斯科。从那时起，他一直在建造圣母安息主教座堂，一切都很顺利，直到他大胆地向沙皇请求回到他的家乡意大利度过最后的岁月。\n没人能接受这种不公正的待遇，你可以把他从牢房里救出来……并把他束缚起来，让他成为你永远的仆人。"
 Dionisius: "季奥尼西"
 podgreatpersons.0109.t: "季奥尼西"
 podgreatpersons.0109.desc: "位于沃洛格达州的费拉邦多夫修道院的圣母诞生主教座堂的一幅雄伟壁画最近向公众揭开了面纱。这是一幅伟大的作品，是一个名叫季奥尼西的人在圣像绘画方面的强大事业的顶峰。\n他的创作的特点是有一种宁静和和平的光环，似乎连$pod_cainites$内心汹涌的心兽都受到影响。虽然他现在已经年老体衰，但这肯定是他的最新作品。这种有趣的凡人总是有诱惑力的，你有可能通过永生的诅咒来拯救他的艺术天赋。"
 William_de_Burgh: "威廉·德·布尔格"
 podgreatpersons.0110.t: "威廉·德·布尔格"
 podgreatpersons.0110.desc: "爱尔兰是一个充满危险和英雄的地方。你不害怕危险，且你可以利用英雄，所以你一直在关注绿宝石岛的凡人。而最近有一个人表现的很突出。\n威廉·德·布尔格，要人和副司法官，一位久经考验的指挥官，曾带领他的手下取得过胜利和失败。他有着强大的外交能力和对伯爵坚定不移的忠诚，他的任期内也使康诺特的仇敌家族受到了控制。在该岛复杂的政治中，这一点并不容易做到。\n威廉最近染上了一种恶心的疾病，很可能活不下去了，这可能是你“邀请”他到你的宫廷的机会。"
 Godred_Magnusson: "戈德雷德·马格努森"
 podgreatpersons.0111.t: "戈德雷德·马格努森"
 podgreatpersons.0111.desc: "维京不列颠最后的残余，马恩岛，还是落入了苏格兰军队之手，但北欧人并不打算轻易倒下。在该岛最后一位国王的私生子的带领下，他们准备起义，并在被迫进行野战之前冲进了苏格兰的阵地。\n因数量上的劣势，叛军被彻底击败，但他们的领袖戈德雷德·马格努森却成功逃脱。尽管遭受了这一挫折，这位不列颠尼亚的“最后的维京人”表现出了强烈的气质和野心，可能会有所作用。现在他独自一人在逃，你可以很容易地把他带到你的宫廷，进一步讨论他的命运。"
 Lucino_Dal_Verme: "卢奇诺·达尔·韦尔梅"
 podgreatpersons.0112.t: "卢奇诺·达尔·韦尔梅"
 podgreatpersons.0112.desc: "一位“签领合约者”，也称意大利雇佣兵，最近搬到了君士坦丁堡。这个人相当传奇，卢卡和博洛尼亚的保卫者，热那亚的统治者，皮埃蒙特的提督，克里特岛的征服者……而且可以向最高出价人提供服务，就像大多数雇佣兵一样。\n卢奇诺无疑是一个有趣的有前途者，他当然是一位善于战争的人，但也是一位在意大利致命的阴谋中幸存下来的人，甚至在阴谋中茁壮成长。也许你可以安排与他会面，成为他的新雇主……"
 Julian_Cesarini: "朱利安·切萨里尼"
 podgreatpersons.0113.t: "朱利安·切萨里尼"
 podgreatpersons.0113.desc: "在灾难性的瓦尔纳之战后，对奥斯曼人的最后一次凡人的十字军东征在混乱中结束，但它也为你提供了一个诱人的机运。枢机主教朱利安·切萨里尼已经被你的手下找到，他独自一人，不堪一击。\n此人几十年来一直是教宗外交的幕后策划者，几乎解决了与东正教廷的分裂问题，然后为当前的十字军东征召集西方国王。这样一位有强烈责任感的杰出外交家并不常出现在你的网中，你正在仔细考虑你的下一步行动。"
 podgreatpersons.0114.t: "维迪亚帕蒂"
 podgreatpersons.0114.desc: "凡人的习俗经常改变，而且大多数时候改变得太快了，不合你的口味。即使像语言这样的基本概念也不能免俗。源于普拉克里特的晚期阿巴哈他语刚刚开始过渡到东方语言的早期版本，如迈蒂利语和博杰普尔语。\n你将需要一个凡人专家为你破译这些变化。你的手下说，没有人比维迪亚帕蒂更合适了，他是孟加拉王室宫廷的一位受欢迎的诗人，最近已经退休回到了他的家乡。他也是著名的能干的外交家和热心的印度教徒，这意味着他有作为[ghoul|E]或子嗣的作用，而不仅仅是一位翻译。"
 Atukuri_Molla: "阿图库里·莫拉"
 podgreatpersons.0115.t: "阿图库里·莫拉"
 podgreatpersons.0115.desc: "最近有一个有趣的凡人引起了大家的注意。阿图库里·莫拉是一位受欢迎的诗人，随着她的知名度的提高，她被邀请到地方宫廷，并有机会在克里许纳达伐拉亚和他的诗人面前朗诵罗摩衍那。\n莫拉称湿婆神为上师，而她的灵感据说来自于用泰卢固语写了《薄伽梵往世书》的波他那。和他一样，她也是湿婆教印度人，但写的是罗摩（毗湿奴的化身）的故事，也拒绝将她的罗摩衍那献给任何国王，这是现在诗人的普遍做法。\n著名的诗人在宫廷里总是很热闹，而且很有声望，让人愉悦，这意味着你正在考虑让她接近黑夜的世界。"
 Boleslaus: "波列斯瓦夫"
 podgreatpersons.0116.t: "波列斯瓦夫"
 podgreatpersons.0116.desc: "凡人的冲突对你的同类来说总是一个机运时刻。最近蒙古人对中欧的入侵也不例外。基督徒在列格尼卡战役中失利了，你的手下潜伏在暗处，给你带来了一位叫波列斯瓦夫的人的下落，他自称是“波西米亚公爵”。\n这个雄心勃勃的人一生都在为他的家族长久以来失去的权利而战，之后加入了他曾经的敌人来保卫国家。尽管损失惨重，但他以自己的勇敢以及作为指挥官和战士的才能证明了自己。如果你想把他作为[ghoul|E]或潜在的子嗣候选人，你的手下将准备把他带到你的宫廷。"
 Guillaume_de_Sonnac: "纪尧姆·德·索纳克"
 podgreatpersons.0117.t: "纪尧姆·德·索纳克"
 podgreatpersons.0117.desc: "于曼苏拉之战中失败后，凡人的第七次十字军东征即将结束。尽管他们先前取得了胜利，但基督教徒过早地冲进了城市，原来的280名骑士中只有三人回到了他们的大本营。\n其中一位是圣殿骑士团的大团长纪尧姆·德·索纳克，他奋力冲出了城市，但在此过程中失去了一只眼睛。他现在正拼命地领导着对穆斯林反击的已败防御。作为一位能干的外交家和训练有素的将军，德·索纳克可是你的宫廷的一位有趣的新人。你的手下已经准备好利用正在发生的混乱来伪造他的死亡，然后把他带到你面前。"
 Ibn_Taymiyyah: "伊本·泰米叶"
 podgreatpersons.0118.t: "伊本·泰米叶"
 podgreatpersons.0118.desc: "伊本·泰米叶是一位伊斯兰法学家、学者、圣训学家、神学家、判官、哲学家、经济学家和博学家，他因参与伊儿汗国统治者合赞汗的外交活动以及参与结束蒙古人对黎凡特入侵的别儿哥汗战役而引起大家的注意。\n作为罕百里学派的成员，伊本·泰米叶对广泛接受的教义，如对圣人的崇拜和对其墓祠的探望，持反对意见，这使他不受当时的许多学者和统治者的欢迎，在他们的命令下，他曾多次被监禁。\n现在他在大马士革的监狱里受折磨，你无法摆脱这样的情绪：拯救黎凡特的人的才能被浪费了。也许你的干预是有必要的。"
 Madan_Rai: "摩檀·雷"
 podgreatpersons.0119.t: "摩檀·雷"
 podgreatpersons.0119.desc: "一位新的凡人统治者登上了高尔王国的宝座，这导致了该王国大多数官员的职位变动。你们特别感兴趣的是摩檀·雷的解雇，他是先王的最后一位首席部长，一直以来都显得很能干、很勤奋。\n他因引诱敌对的婆罗贺摩尔国家的主要将领到己边而闻名，发起了一系列事件，最终高尔王国在甚至不需要发动战争的情况下获得了胜利。这样一个狡猾而有决心的人，当然可以为你所用。"
 Sikandar_Khan_Ghazi: "斯乾陀罗·汗·加齐"
 podgreatpersons.0120.t: "斯乾陀罗·汗·加齐"
 podgreatpersons.0120.desc: "令人惊讶的消息，你们的手下以某种方式抓住了勒克瑙提王国的瓦齐尔（首席部长）。似乎这个人在钓鱼时差点淹死，而且与他的随行人员失散了。这给你了一些有趣的选项，因为尽管发生了这个有点可耻的事件，但斯乾陀罗是一个著名的将军和有能力的行政者。他在他的领主对该地区的征服中发挥了作用。也许他可以成为你的工具？\n只要让他远离钓鱼点就是了。"
 podgreatpersons.0121.t: "埃尔图鲁尔"
 podgreatpersons.0121.desc: "你的一位末卡维廷臣一直在说，你必须干涉罗姆苏丹国一个叫埃尔图鲁尔的贝伊的生活。这个部落首领的出身有点不起眼，但至少他作为小亚细亚的一个小角落的统治者是有点能力的。因此，你长期以来一直忽视末卡维的胡言乱语。\n直到这个疯狂的末卡维面对太阳自杀，同时尖叫着说“太晚了！”。在这个不祥的事件之后，你带着某种可怕的情绪，回顾了你对埃尔图鲁尔的立场。也许这个凡人确实是将成大事的，且可以对你有用处？"
 Qutui_Khatun: "库图伊·可敦"
 podgreatpersons.0122.t: "库图伊·可敦"
 podgreatpersons.0122.desc: "凡人的蒙古帝国在混乱的继承和内战中摇摇欲坠，但混乱给你带来了机会。最近被刺杀的可汗的母亲库图伊·可敦，尽管失去了丈夫和儿子，但她一直是一股重要的政治力量。最好的证明是，新可汗目前正在向她的城市进军，以阻止她，因为她正在努力为自己争取支持。\n由于她也是著名的训练有素的管理者和外交家，她有足够的素质值得你去关注。你可以伪造她的死亡，把她带到你的宫廷，在那里她的最终命运将掌握在你手中。"
 Tiramakhan_Traore: "提拉马汗·特拉沃雷"
 podgreatpersons.0123.t: "提拉马汗·特拉沃雷"
 podgreatpersons.0123.desc: "你的手下正在密切关注非洲的凡人，最近给你带来了关于一个有趣的人才的消息。提拉马汗·特拉沃雷是马里帝国的一名将军，他率领一支远征军向西进发，寻找新的土地来征服和定居。他在这两方面都做得相当出色，他击败了贝努克国王基基科尔，并吞并了他的国家，建立起了许多新的曼迪卡城镇。\n他的任务完成了，特拉沃雷现在在曼帕亭休息，他的军队不在身边，这是一个罕见的可乘之机。你也许可以利用这样一位人达到你自己的目的。"
 Abul_Hasan_ash_Shadhili: "阿布·哈桑·阿什·沙兹里"
 podgreatpersons.0124.t: "阿布·哈桑·阿什·沙兹里"
 podgreatpersons.0124.desc: "一位学识渊博的老人最近因病停在了你们这里。这位老人就是著名的阿布·哈桑·阿什·沙兹里，一位声望极高的神学家。众所周知，他曾走遍大江南北，与这个时代最有名的学者会面，随后，阿布创立了自己的思想流派，许多弟子已经将他的言论传播到穆斯林世界的四个角落。\n他还是一位伟大的辩论家，精通法律行政，他的许多品质使他成为一个很不错的目标。也许，你可以伪装他的病死，然后把他带到你的宫廷。他可能是有用的，也许是作为[ghoul|E]，甚至是一位有潜力的子嗣。"
 Sayyida_al_Hurra: "赛义德·胡拉"
 podgreatpersons.0125.t: "赛义德·胡拉"
 podgreatpersons.0125.desc: "得土安的海盗女王在穆斯林中是一个传奇，在基督徒中是一个噩梦。她出生在一个流亡的安达卢西亚家庭，接受了最好的教育，然后嫁给了她所在城市的统治者。当他去世后，她被已经作为有能力的管理者而受到尊重她的民众委托给担任了他的职务。\n随后，赛义德·胡拉过上了冒险和浪漫的生活，她嫁给了苏丹，成为一名海盗，使地中海成为西班牙人的地狱。但万事皆有尽头，她最近在一场政变后被推翻了。你已经等了很久，希望能找到一种方法，把这个神通广大的女人困在你的网中。这可能是一个机会。"
 Mary_Wolverston: "玛丽·沃尔弗斯通"
 podgreatpersons.0126.t: "玛丽·沃尔弗斯通"
 podgreatpersons.0126.desc: "一位奇特的“走私者”最近在伦敦被判处死刑。这位名叫玛丽·沃尔弗斯通的康沃尔贵族，显然有一个庞大的贿赂、威胁和打手网络，用来掠夺卡里克港口附近的船只。她非常享受这种制度化的海盗生活，当她听到关于宝藏的传闻时，甚至登上了圣塞瓦斯蒂安的玛丽号。\n这种这做的太过分了，她在为偷来的货物销赃时被抓。由于她的死刑判决已经颁布，她很快就会从凡人的头脑中消失。也许这是一个机会，让你为自己的目的“拯救”这个无情的女商人？"
 Agnes_Hotot: "阿格妮丝·霍托特"
 podgreatpersons.0127.t: "阿格妮丝·霍托特"
 podgreatpersons.0127.desc: "在最近的一次比武大赛中，一位年轻女子引起了相当大的轰动。由于她的父亲病倒了，无法保护他的荣誉，阿格妮丝偷偷地拿走了他的盔甲，骑着马把她的对手打下了马。当他躺在泥土中时，她摘下头盔，放下头发，露出了她的真实身份。\n你的调查显示，她是个小人物，如果你愿意，可以很容易地用你的手下抓住，带到你的宫廷。也许你看中了一位英勇的女骑士来捍卫你不死族的荣誉？"
 Vendela_Skytte: "温德拉·斯奎特"
 podgreatpersons.0128.t: "温德拉·斯奎特"
 podgreatpersons.0128.desc: "你已经关注一位年轻的瑞典贵族妇女的生活有一段时间了。温德拉·斯奎特因其学识和学术素养而闻名，她的美貌和智慧也令人钦佩。她举办沙龙，参与当代知识界的辩论。她还与科学家和艺术家为伍，开展宗教辩论。\n这个女人还很年轻，但你已经相当喜欢她，并担心她可能很快会引起你的一些竞争对手的注意。因此，为了安全起见，你正在考虑采取行动，把她带到你的宫廷。"
 Samuel_Cockburn: "萨米埃尔·科伯恩"
 podgreatpersons.0129.t: "萨米埃尔·科伯恩"
 podgreatpersons.0129.desc: "一段时间以来，各种凡人军队一直在你的区域内穿行，显然是卷入了瑞典的古斯塔夫二世在俄罗斯和波罗的海的战争。其中一位指挥官是一个名叫萨米埃尔·科伯恩的苏格兰雇佣兵，他是一位参加过无数次战斗和围攻的老兵。他参加过的战役数量令人印象深刻，而且这人当然也知道如何管理他的佣兵团。\n你可以理解这样一个家伙，在对荣誉和金钱的双重欲望驱使下。他可以成为一个好子嗣，也可以成为一个致命的对手。也许这仍然值得冒险。"
 Torsten_Stalhandske: "托尔斯滕·斯塔尔汉斯克"
 podgreatpersons.0130.t: "托尔斯滕·斯塔尔汉斯克"
 podgreatpersons.0130.desc: "你总是在寻找潜在的新人，你的一位手下告诉有个很有前途的芬兰军官。尽管身材矮小，但托尔斯滕·斯塔尔汉斯克却异常强壮；当一个被俘的敌军军官被带入瑞典营地时，他会用力握住他们的手，以至于他们的指甲里会出现血迹，他称之为“实在的瑞典式握手”。\n他还被誉为是一个出色的指挥官，带领可怕的骑兵冲锋或保卫阵地，数年如一日。\n一个像他这样强大的人，无论是精神上还是身体上，肯定会是一位有趣的有前途者。"
 Ibn_Battuta: "伊本·白图泰"
 podgreatpersons.0131.t: "伊本·白图泰"
 podgreatpersons.0131.desc: "一位迷人的凡人最近在经历了一次令人敬畏的旅行后回到了马拉喀什。伊本·白图泰访问了欧亚大陆南部的大部分地区，包括中亚、东南亚、南亚、中国和伊比利亚半岛，他现在正在把他的旅行记述编成一本书。即使是像你这样年老和有经验的生物，这个凡人看到的东西也可能是你根本无法想象的。而且他活到了现在，证有一种很少见的坚强。\n如果你想了解更多关于这样一个博学的人，以及他的旅程，你可以“邀请”他到你的宫廷。显然，第一人的叙述比单纯的书籍更可靠。"
 Saadi_Shirazi: "萨迪·设拉子"
 podgreatpersons.0132.t: "萨迪·设拉子"
 podgreatpersons.0132.desc: "萨迪·设拉子来自一个长久的宗教学者家族，他也许是其中最好的一位。他是一位重要的诗人和散文作家，已经被公认为是这个时代最伟大的人之一。\n他的主要作品《萨迪的布斯坦》由一些故事组成，恰当地说明了推荐给穆斯林的标准美德（公正、自由、谦虚、知足），以及对苦行僧行为和他们的狂喜实践的思考。\n在完成他的作品后，由于年龄的增长，萨迪现在住在他的家乡设拉子，担任一名受人尊敬的学者。你的一些廷臣提出了将他带到你的宫廷，以“拯救”他免于死亡的想法。"
 Ibrahim_Pasha: "易卜拉欣·帕夏"
 podgreatpersons.0133.t: "易卜拉欣·帕夏"
 podgreatpersons.0133.desc: "长期以来，奥斯曼帝国强大的大维齐尔被认为是皇位背后的真正力量。他是一位高超的外交家，是法兰西–奥斯曼联盟的幕后推手，并说服西方基督教徒将匈牙利变成奥斯曼帝国的附庸国。\n他的财富和傲慢随着他的成功而增长，直到他表现得好像是他在掌权，而不是苏丹。这最终使他陷入了困境，苏莱曼似乎很想下令处决他。易卜拉欣对这一威胁视而不见，但你不是。这可能是一个完美的机会，你可以伪造他的死亡，把他带回你的宫廷。你可以利用这样一位大维齐尔……只要他明白自己的地位。"
 Krokodeilos_Kladas: "克罗科迪洛斯·卡拉达斯"
 podgreatpersons.0134.t: "克罗科迪洛斯·卡拉达斯"
 podgreatpersons.0134.desc: "在凡人的世界，希腊已经在奥斯曼人的征服下沦陷，但人民仍然在反抗。其中一位起义者克罗科迪洛斯·卡拉达斯，一直与威尼斯合作，骚扰土耳其人。作为一名称职的军事领导人，他在威尼斯与奥斯曼签订和平条约之前，已经赢得了几场激烈的战斗。\n现在，在没有外部支持的情况下，克罗克迪洛斯被土耳其人和他的老威尼斯盟友悬赏捉拿，他的命运发生了变化。尽管他多次大胆尝试帮助新的叛乱在希腊各地蔓延，但还是于在莫奈姆瓦夏附近的战争中被俘。他的命运已经注定，除非你想干预。"
 Ivo_Senjanin: "伊沃·森亚宁"
 podgreatpersons.0135.t: "伊沃·森亚宁"
 podgreatpersons.0135.desc: "在你们这个地区的凡人中，一个叫伊沃·森亚宁的人的事迹开始成为传奇。作为一名哈伊杜克将军，他在巴尔干各地与奥斯曼人作战，包括阿尔巴尼亚、波斯尼亚、黑塞哥维那和克罗地亚。他参加了在勒班陀、塞浦路斯、埃及、摩里亚的奥斯曼–威尼斯之战，以及在西萨克、克利斯和彼得里尼亚的长期土耳其战争。\n在军事生涯结束后，他成为了一名乌斯科克，海盗的一种，而在塞尼，他最近因偷窃而被捕，最终被判有罪。他的处决很快就会发生，如果你愿意的话，只留下一点小时机来采取行动。"
 Starina_Novak: "斯塔里纳·诺瓦克"
 podgreatpersons.0136.t: "斯塔里纳·诺瓦克"
 podgreatpersons.0136.desc: "一位著名的海杜克法外之徒，即反对奥斯曼帝国的凡人叛军，已经被俘，不久将在你的城市附近被烧死。这个人，斯塔里纳·诺瓦克，有相当长的职业生涯。他是保加利亚索菲亚攻克战的一分子，在他和他的700名士兵通过改变路线穿越巴尔干山脉欺骗土耳其人，并成功地出其不意地袭击了土耳其军队，只死了8名士兵，并从奥斯曼人手中夺取了大量的牲畜和物资，为他赢得了巨大的声誉。随后，他解放了普列夫纳、奥亚霍沃、弗拉察、维丁和弗洛朗坦。\n许多小胜利也归功于他，使他成为一个非常训练有素的军事指挥官。他活着可能比被烧死更有用处。"
 Sinan_Reis: "锡南·雷斯"
 podgreatpersons.0137.t: "锡南·雷斯"
 podgreatpersons.0137.desc: "一位巴巴里海盗最近在印度海岸登陆，显然是为了帮助一个凡人统治者对抗葡萄牙的入侵。锡南·雷斯是在著名的奥斯曼帝国海军上将巴巴罗萨·海雷丁手下航行的海盗之一。自从被迫流落他乡以来，对伊比利亚人有了深深的仇恨，锡南参加了对西班牙和神圣罗马帝国的几次关键战役。\n他以良好的战术意识而闻名，并且是巴巴罗萨的宠儿之一，这个人有许多可以为你所用的品质。你毕竟非常了解复仇的吸引力。"
 Gaspar_de_Gama: "加斯帕·德·伽马"
 podgreatpersons.0138.t: "加斯帕·德·伽马"
 podgreatpersons.0138.desc: "一支葡萄牙探险队最近抵达了霍尔木兹，一位耐人寻味的人物与他们在一起。甚至这位语言学家的名字也很神秘，因为他是在被著名的探险家瓦斯科·达·伽马发现后采用了现在的名字。但众所周知的是，他精通多种语言，并熟悉印度的地缘政治和习俗。\n这些资产以及他的自然魅力使他受到葡萄牙人的重视，他们在与新土地进行贸易（或征服）时总是依靠他。显然，这个人的技能可以为你的功业所用，你可以利用你在当地的影响力，确保他落入你的网。"
 Constantine_de_Baberon: "君士坦丁·德·巴贝隆"
 podgreatpersons.0139.t: "君士坦丁·德·巴贝隆"
 podgreatpersons.0139.desc: "你关注着一位亚美尼亚贵族的事业已经有一段时间了。君士坦丁最近想方设法确保他的儿子将继承亚美尼亚王位。为了做到这一点，他首先杀死了（在折磨和下毒之后）现任国王，误导忠诚的贵族去执行错误的救援任务，然后占领了王后所在的城堡，强迫她嫁给他。\n这种无情的野心可匹配许多$pod_cainites$的阴谋，当然值得你注意。也许君士坦丁已经准备好为黑夜的领主带来他的才能？你可以伪造他的死亡，把他带到你的宫廷，在那里他可以成为一位有用的手下，甚至是一位有潜力的子嗣。"
 Beatriz_Galindo: "比阿特丽斯·加林多"
 podgreatpersons.0140.t: "比阿特丽斯·加林多"
 podgreatpersons.0140.desc: "伊比利亚最训练有素的拉丁语实践者之一是一位萨莫拉下层贵族的女儿，名叫比阿特丽斯·加林多。这位著名的学者赢得了伊比利亚的凡人统治者的关注，她已经基本成为了五位女王的导师。\n作为一个备受尊敬的公众人物，她还创建了圣十字医院，并创作了诗歌和对亚里士多德的评论文章。这是一个令人印象深刻的职业生涯，可能值得你“邀请”她到你的宫廷。你没有确切的孩子需要教育，但你肯定有表现得差不多的烦人稚子。"
 Jean_Bodin: "让·博丹"
 podgreatpersons.0141.t: "让·博丹"
 podgreatpersons.0141.desc: "让·博丹先后担任过修士、学者、专业律师和政治顾问，从他作为一个裁缝的儿子的卑微出身开始，他的生活就很充实。在巴黎大学的人文主义思想中学习，博丹是一位令人信服的宗教宽容主义的倡导者……但也是政治专制主义的倡导者。他的理论在上层社会中很受欢迎，这使他成为一些贵族最喜欢的政治顾问，在这一时期，他被证明有能力在充满阴谋的贵族世界中小心翼翼地游走。\n政治专制主义的概念肯定会引起你的共鸣，你正在考虑拉近这个人的距离以了解更多。"
 Janus_Pannonius: "雅努士·​潘诺尼乌斯"
 podgreatpersons.0142.t: "雅努士·​潘诺尼乌斯"
 podgreatpersons.0142.desc: "雅努士·​潘诺尼乌斯是一位拉丁学家、诗人、外交官和佩奇的主教，已成为欧洲人文主义诗歌界最知名的人物之一。他被他的老师和同学们认为是他那一代人中最聪明的学生，他按照古典诗词的规则写诗；他在13岁左右写下了他的第一篇诗篇。\n此后，他在皇家书记办公处工作，并成为国家的副总理。显然，如果你的宫廷需要一名外交官或一名学者，一个有如此才能的人可以为你所用。如果你有兴趣，伪造他的“突然死亡”是可以做到的。"
 Anseau_de_Cayeux: "安索·德·卡约"
 podgreatpersons.0143.t: "安索·德·卡约"
 podgreatpersons.0143.desc: "第四次十字军东征的致命煽动者之一最近回到了法兰西。安索曾经是皮卡第的一个小贵族，他的财富因君士坦丁堡的陷落而大大增加。他在新的“拉丁帝国”建立了自己的权力基础，设法在十字军东征后的致命阴谋中幸存下来，甚至在与拜占庭公主结婚后被任命为摄政。\n这显然是一个有能力成为$pod_cainite$世界的潜在强者的人。他雄心勃勃，心狠手辣，不惧怕琐碎的道德问题。现在他已经远离了他的权力基础，你可以安排他“死亡”，然后把他带到你的宫廷。他可能是一个有趣的[ghoul|E]甚至是有潜力的子嗣。"
 Angele_de_la_Barthe: "安琪儿·德·拉·巴特"
 podgreatpersons.0144.t: "安琪儿·德·拉·巴特"
 podgreatpersons.0144.desc: "裁判所并不只针对吸血鬼而发怒。越来越多的凡人被烧死在火刑柱上，但有一个故事特别吸引你的注意。在图卢兹，一个女人被指控与魔鬼上床，生下他的孩子，然后给他们喂食婴儿。她没有否认任何事情，甚至还吹嘘了更多，比如在经常在名为“魔宴”的聚会中出席。所以她很快就会被大裁判官亲自烧死也就不奇怪了。\n你可以通过让她消失来拯救她，哪怕只是为了羞辱讨厌的裁判所。这个女人本身可能也很有趣，因为她显然已经知道很多关于超自然的事情，而且对它没有丝毫的恐惧。"
 Garcia_de_Resende: "加西亚·代·雷森德"
 podgreatpersons.0145.t: "加西亚·代·雷森德"
 podgreatpersons.0145.desc: "葡萄牙国王约翰二世和曼努埃尔一世的私人秘书，王室中受人尊敬的贵族，有着漫长的职业生涯。作为两位国王最信任的顾问之一，加西亚·代·雷森德几十年来一直是一位精明的财务人员、虔诚的天主教徒和有成就的政治家。\n他的名气也有文学方面的，他作为一位诗人的才能开始被广泛认可。他在葡萄牙宫廷所青睐的娱乐活动法律审判模拟中的胜利也是众所周知的。\n这样一位有成就的仆人，拥有能说会道的舌头和各种各样的才能，可能对你的宫廷有用。"
 Pedro_Alvares_Cabral: "佩德罗·阿尔瓦雷斯·卡布拉尔"
 podgreatpersons.0146.t: "佩德罗·阿尔瓦雷斯·卡布拉尔"
 podgreatpersons.0146.desc: "这是一个探索的时代，这些令人惊讶的凡人在新大陆上取得了令人印象深刻的进展。这些发现的源头之一是佩德罗·阿尔瓦雷斯·卡布拉尔，一个从葡萄牙小贵族变成的探险家。\n卡布拉尔向西远航，发现了一块新的陆地，他很快就为葡萄牙的王室提出了要求。此后，他又参加了其他探险活动，但与国王曼努埃尔一世的争吵使他失去了好感，很快就陷入了默默无闻。这样一个人已经证明了他的才能：一个大胆的冒险家，一个众人的领袖，一个著名的舰队司令……如果凡人不欣赏他，也许你可以把他介绍给一个新的“家庭”，让他们重视他的功绩……"
 Abu_al_Hasan_Ali_ibn_Othman: "阿布·哈桑·阿里·伊本·奥斯曼"
 podgreatpersons.0147.t: "阿布·哈桑·阿里·伊本·奥斯曼"
 podgreatpersons.0147.desc: "你一直在密切关注北非的马林苏丹阿布·哈桑·阿里·伊本·奥斯曼的生活。在他的领导下，摩洛哥将其统治范围扩大到特莱姆森和易弗里基叶，这两个地方加起来覆盖了整个北非。在他的领导下，马林王朝在马格里布的领地面积短暂地与之前的穆瓦希德哈里发的面积相媲美。\n他对伊比利亚人的战役取得了较为复杂的结果，但在处理棘手的格拉纳达苏丹国时也表现出一些精明的政治头脑。这样一个强大的统治者往往远离吸血鬼，但一个机会已经出现了。\n一连串的挫折已经严重削弱了他的统治。在巡视以确保他的领地时，他被他的儿子背叛，被迫退位，然后逃到阿特拉斯山脉以逃避死亡。\n这可能是你出手的时机，为流亡的苏丹提供第二次机会……"
 Nanda_Pakyan: "南达巴坚"
 podgreatpersons.0148.t: "南达巴坚"
 podgreatpersons.0148.desc: "实皆王国在过去几年中有过三个不同的国王……但只有一个首相。几十年来，南达巴坚一直是王国背后的力量，他轻易地背叛了任何阻碍他的人，把傀儡放在王位上，在需要时替换他们。就所有的意图和目的而言，他掌管着这个国家。他对宫廷阴谋的掌握，几乎足以让一些吸血鬼嫉妒了。\n不过，时间不等人，这位首相已经年迈了。他在职业生涯中结交的无数敌人很快就会向他靠拢，除非你能介入……"
 Sulaiman_Al_Mahri: "苏莱曼·马赫里"
 podgreatpersons.0149.t: "苏莱曼·马赫里"
 podgreatpersons.0149.desc: "这是一个凡人的探索和发现的时代。很少有人比苏莱曼·马赫里更能代表这个时期。这位奥斯曼帝国的船长是一位博学的哲学和科学学生，但也是一个大胆的灵魂，他发现了远在东方的新土地。\n在他的日记中，马赫里记下了马来亚西海岸的岛屿，但也记下了马六甲、新加坡、萨马拉的部分地区、爪哇、中国、缅甸的海岸以及安达曼和尼科巴群岛。\n由于年事已高，随着日记的完成，苏莱曼已经回到了他的家乡，结束了他的冒险。但你可以确定，新的冒险将很快为他开始……"
 Diego_de_Ordaz: "迭戈·德·奥尔达斯"
 podgreatpersons.0150.t: "迭戈·德·奥尔达斯"
 podgreatpersons.0150.desc: "你一直在密切关注征服者的事迹，那些在海外寻找名利的凡人。遗憾的是，你只能获得第二手的资料，因为传说和现实往往与这些人物交织在一起。然而，运气是站在你这边的，因为一个叫迭戈·德·奥尔达斯的人被冲到了你的派员附近的一个小港口。\n这个人是科特斯的士兵之一，参与了对特诺奇提特兰的征服和对黄金国的搜寻。如果你听到的关于这些事件的传言有一半是真的，你可能想保留迭戈的存在以备“将来使用”……"
 Gulbadan_Begum: "古尔巴丹·贝格姆"
 podgreatpersons.0151.t: "古尔巴丹·贝格姆"
 podgreatpersons.0151.desc: "莫卧儿帝国的几位皇室女性在去麦加朝圣后正返回印度。你一直在密切关注她们的进展，因为其中有古尔巴丹·贝格姆，她是阿克巴皇帝宫廷中重要的、受人爱戴的“皇姑”。\n她在阿格拉的皇室中拥有巨大的影响力和尊重，她也被称为是一位有才华的诗人。但她最引人注目的作品是《胡马雍纪》，这是对她同父异母的兄弟胡马雍皇帝生活的描述。\n她从麦加归来是一个安排“意外”的独特机会，因为你的一些廷臣坚称她对当前凡人政治的洞察力可能有很大的用处。"
 Jacob_Palaeologus: "雅各伯·巴列奥略"
 podgreatpersons.0152.t: "雅各伯·巴列奥略"
 podgreatpersons.0152.desc: "一位奇怪的人在你的势力范围附近被捕了。这位雅各伯·巴列奥略自称是拜占庭皇室的后裔，他的敌人可能比你还多。\n作为一个不屈不挠的反对加尔文主义和教宗权力的论战者，巴列奥略在东欧和奥斯曼帝国的皇室和贵族家庭中培养了广泛的高级联系人和通讯员；同时制定和宣传了一个激进的基督教异端版本，其中耶稣基督在崇拜中不被引用，基督教、伊斯兰教和犹太教之间所谓的不可调和的差异被否认为虚假的捏造。\n他不断地被他的众多敌人追捕，屡次通过他的众多隐蔽的支持者逃脱。也许你可以把自己加入这个名单？这个人显然有激情，有才华，还有一种纯粹的张扬，应该受到敬佩。"
 Reynold_Basztely: "雷纳德·巴兹泰利"
 podgreatpersons.0153.t: "雷纳德·巴兹泰利"
 podgreatpersons.0153.desc: "你已经关注一个凡人的职业生涯有一段时间了。这位雷纳德·巴兹泰利是匈牙利男爵、士兵和廷臣，他是斯蒂芬公爵的坚定支持者。他出身于一个皇家仆从家庭，由于他的军事成就和忠诚，他被提升为贵族。\n匈牙利最近遇到了很多麻烦，发生了几次内战，但雷纳德一直忠于他的主子，为了保护王室，他相当接近死亡。当王位最终由一个年轻的男孩继承时，雷诺德是宫廷的中坚力量，确保他的国王不会受到伤害。\n这种不断展示的忠诚、武器才能和精明的政治意识是耐人寻味的，而且，由于雷纳德最近被提升到远离宫廷的另一个位置，你可能有兴趣安排一个“意外”，使他从凡人的历史中消失。"
 Michael_Tarchaneiotes_Glabas: "米海尔·塔尔哈尼奥特斯·格拉巴斯"
 podgreatpersons.0154.t: "米海尔·塔尔哈尼奥特斯·格拉巴斯"
 podgreatpersons.0154.desc: "拜占庭帝国虽然从第四次十字军东征中稍有恢复，但仍处于动荡之中。受到第二保加利亚帝国、塞尔维亚、那不勒斯的安茹王朝和伊庇鲁斯专制国的攻击，它的生存主要归功于一个叫米海尔·塔尔哈尼奥特斯·格拉巴斯的人。作为一个尽职尽责、技术娴熟的指挥官，格拉巴斯在近40年里一直是一个成功的将军。即使是偶尔的挫折或失败也只会加强他的技能，很少有人能夸口说真正赢得了与他的战争。\n现在，格拉巴斯已是一位老人，他一直在写一本战争手册，以传授他的宝贵经验。但作为黑夜中的生物，你有另一种可能性，它可以让你得到他本人，而不仅仅是一本书。"
 Haci_Ilbey: "哈奇·伊尔贝"
 podgreatpersons.0155.t: "哈奇·伊尔贝"
 podgreatpersons.0155.desc: "在安纳托利亚的土耳其战争中，奥斯曼贝伊国正在日渐壮大。你已经了解到，这一进展部分归功于一个名叫哈奇·伊尔贝的人，他是另一个贝伊国的指挥官，投奔了奥斯曼人。\n从那时起，他就声名鹊起，占领了吕莱布尔加兹和埃迪尔内，埃迪尔内很快成为帝国的首都。当新苏丹穆拉德一世忙于攻占安纳托利亚的比加半岛时，一支十字军军队出现在鲁米利亚的马里查河附近。哈奇·伊尔贝被派往十字军那边，带着一支相对较小的远征军。他在一次意外的夜袭中击败了他们。\n不过，奥斯曼的政治比他们的战场更加致命，有传言说，为他突然崛起的名声和权力感到担忧，宫廷正在计划消灭哈奇。这可能是干预的时候了。"
 Malik_Kafur: "马利克·卡富尔"
 podgreatpersons.0156.t: "马利克·卡富尔"
 podgreatpersons.0156.desc: "马利克·卡富尔是德里苏丹国著名的奴隶将军，据传他的绰号是用1000第纳尔买来的，他在军中迅速崛起，主要是因为他被证明是一位明智的顾问和军事指挥官。\n作为德里部队的将军，卡富尔在1306年击败了蒙古入侵者。随后，他在印度南部地区领导了一系列远征，对抗雅达瓦（1308年）、卡卡提亚（1310年）、曷萨拉（1311年）和潘地亚（1311年）。从这些战役中，他为德里苏丹国带回了许多财宝，以及许多大象和马匹。\n苏丹病重后，他被召回德里，现在作为那伊布（总督）在那里行使权力。马利克显然是想篡夺权力，利用苏丹的未成年儿子作为傀儡。\n你在宫廷中的联系人警告你，马利克已经能不所及，而且一个反对他的联盟正在形成，要把他赶下台。这可能是一个“拯救”他并为你的事业使用他相当大的才能的完美机会。"
 Mikolaj_Hussowczyk: "尼可劳斯·胡索维阿努斯"
 podgreatpersons.0157.t: "尼可劳斯·胡索维阿努斯"
 podgreatpersons.0157.desc: "诗人、廷臣、司库、猎人……这位名叫尼可劳斯·胡索维阿努斯的人在他漫长的波兰和立陶宛宫廷生涯中经历了许多事情。他的作品与凡人称之为“文艺复兴”的运动很接近，被认为是第一部关于立陶宛的大型虚构作品，为他赢得了相当多的尊重和大公国不断膨胀的民族自豪感。\n1522年，尼可劳斯作为大使被派往教宗那里，他还担任过教廷的牧师和公证员。这是一份强有力的履历，显示了良好的才能多样性。这使尼可劳斯成为潜在的但也很有诱惑力的$pod_Embrace$目标。"
 Magdalena_de_la_Cruz: "马格达莱纳·德·拉·克鲁兹"
 podgreatpersons.0158.t: "马格达莱纳·德·拉·克鲁兹"
 podgreatpersons.0158.desc: "最近有一个奇怪的故事传到你的法庭。马格达莱纳·德·拉·克鲁兹，一位被认为与天主有着持续而亲密的交流的圣女，最近忏悔了她的罪过。这些罪行包括“错误的预言、异象、奇迹和与魔鬼共处三十年”。\n在她忏悔时，似乎她的恶魔印记不知何时消失了。在这件事上很难知道真相。她是个骗子吗？她的忏悔是被迫的吗？她的神迹和所谓与神与魔的对话又是怎么回事？\n你很好奇，而这种好奇心可能导致她遇到另一种被诅咒的生物……"
 Audun_Hugleiksson: "艾登·许利克森"
 podgreatpersons.0159.t: "艾登·许利克森"
 podgreatpersons.0159.desc: "挪威国王埃里克·马格努松最近去世，导致了凡人政治中的相当大的动荡。他的继任者是他的弟弟哈康五世国王，他已经开始破坏其前任留下的大部分旧的政治结构。\n已故国王埃里克的右手艾登·许利克森就是这样一个被逼上绝路的人，他作为律师、政治家和税务部长发挥了重要作用。也许这个角色太重要了，因为哈康国王已经开始对他采取行动，没收了他的财产并取消了他的头衔。艾登的生命本身受到威胁只是时间问题。\n这个人已经证明自己是一个有能力的管理者和合格的顾问，你可能想采取行动，使他免于这严峻的命运。"
 podgreatpersons.1000.t: "竞争者"
 podgreatpersons.1000.desc: "你最近的“收购”引起了一位领近统治者的好奇心，他现在正在推动你的新凡人“拜访”他们的宫廷。你很清楚如果你接受这个请求会发生什么，而且你并不特别喜欢失去你的新客人。\n你将如何处理这种情况？"
 podgreatpersons.1000.a: "我将用杂类小计谋来分散其的注意力。"
 podgreatpersons.1000.b: "这凡人是我的！"
 podgreatpersons.1000.c: "如果我不能有，那谁也不能有。"
 podgreatpersons.1000.d: "呵，反正我也不怎么关心其。"
 podgreatpersons.1000.customa: "你将把受争的伟人留在你的身边。"
 podgreatpersons.1000.customb: "你将把受争的伟人让给你的竞争者。"
 podgreatpersons.0160.t: "莎贾尔·杜尔"
 podgreatpersons.0160.desc: "曾经以智慧和美貌著称的儿童奴隶，莎贾尔·杜尔已经升职为强大的埃及苏丹国的统治者。她丈夫的死亡、第七次十字军东征造成的混乱以及她自己相当高的政治敏锐度和野心当然功不可没，但考虑到对她性别的偏见，尤其是拒绝承认她掌权的阿巴斯王朝哈里发，这仍然是一个令人印象深刻的成就。\n这样强大的统治者往往是$pod_cainite$政治所不能企及的，因为他们太显眼了，但你的派员报告了一个有趣的发展。莎贾尔·与她最近的丈夫的谋杀案的牵连已被公开揭露，她的政治资本不足以掩盖它。她丈夫的支持者已经逮捕了她，她现在被囚禁在红塔里，在未来的日子里，她很可能会发生“意外”，就像这种宫廷阴谋中通常的惯例一样。\n这可能是你伪造她的死亡的最佳时机，并将雄心勃勃的女苏丹引入一个全新层面的权力和阴谋。"
 Mohammad_al_Sahuir: "穆罕默德·萨维尔"
 podgreatpersons.0161.t: "穆罕默德·萨维尔"
 podgreatpersons.0161.desc: "一位富有魅力的安达卢西亚指挥官最近声名鹊起。这个“阿兹拉克（蓝）是阿拉贡国王的附庸，但对忠诚的概念非常值得商榷，他已经对他的主子发动了几次军事叛乱，包括一次对他的个人谋杀。有趣的是，阿兹拉克似乎很讨人喜欢，他的“爆发”每次都得到了原谅，甚至使他获得了一些接近瓦伦西亚王国的土地。\n一个凡人在政治和战争方面表现出这样的技能是很罕见的，因此你一直密切关注着他。这是个好主意，因为阿兹拉克最近又开始了他的一场古怪的叛乱。然而，在他的高龄，一切都可能发生，如果你巧妙地设计他的“死亡”，很少有人会惊讶……"
 Ibn_al_Khatib: "伊本·哈提卜"
 podgreatpersons.0162.t: "伊本·哈提卜"
 podgreatpersons.0162.desc: "来自格拉纳达埃米尔国的诗人、作家、历史学家、哲学家、医生和政治家，利桑·丁·伊本·哈提卜以其综合能力而闻名。常常被认为是格拉纳达的主要力量，然而伊本·哈提卜总是首先忠于摩洛哥，这种与安达卢西亚的复杂关系已经给他带来了麻烦。\n一个新的摩洛哥苏丹上台了，他欠了格拉纳达的债，而这个债可能是格拉纳达的埃米尔仍然想要的，伊本·哈提卜的人头。虽然这个人在他的政治生涯中确实犯了一些错误，但他也显示出作为你的宫廷的潜在候选人的一些期望。至少，他的诗歌和关于医学的详细作品值得一读，因为这样他也可以用这些具体的知识为你找到用武之地。"
 Nasir_al_Din_al_Tusi: "纳西尔·丁·图西"
 podgreatpersons.0163.t: "纳西尔·丁·图西"
 podgreatpersons.0163.desc: "波斯的多面手、建筑师、哲学家、医生、科学家和神学家。纳西尔·丁·图西是一位发表过很多文章的作家，他的作品涉及数学、工程、散文和神秘主义等主题。此外，图西还取得了一些科学上的进步。在天文学方面，他创建了非常精确的行星运动表，更新了行星模型，并对托勒密天文学进行了批评。他还在逻辑学、数学，特别是三角学、生物学和化学方面取得了长足的进步。\n毫无疑问，他是这个时代最杰出的头脑之一，其他几个$pod_cainites$已经为把他引到他们的宫廷而取得进展。图西现在已经老了，而凡人不会永生的，所以这可能是你争取这样一位天才为你服务的最后机会。"
 Nils_Dacke: "尼尔斯·达克"
 podgreatpersons.0164.t: "尼尔斯·达克"
 podgreatpersons.0164.desc: "瑞典的凡人农民正在造反，反对他们的国王。这并不是一件非常罕见的事情，但取得成功无疑是。在一个名叫尼尔斯·达克的大胆反叛者的领导下，农民们击溃了一支外国雇佣军，夺取了瑞典南部大部分地区的控制权。他们的成功，以及叛乱之火的蔓延，甚至迫使国王签订了一份屈辱的和平条约……\n一年后，他打破了这个条约。达克这时已经变得过于自信，激战的结果对纪律性更强的皇家军队有利，以农民领袖逃命而告终。对这位著名逃犯的追捕正在进行，但如果你愿意，你应该能够在国王的士兵找到他之前将尼尔斯逼到绝境。虽然将永生赋予这样一位星星之火可能是难测的，但至少，这将是一个受欢迎的变化，不同于通常的吸血鬼政治的夜以继日的诡计。"
 Pero_da_Covilha: "佩罗·达·科维良"
 podgreatpersons.0165.t: "佩罗·达·科维良"
 podgreatpersons.0165.desc: "佩罗·达·科维良是一个出身低微的冒险家，但却是一个精于剑术的人，也是葡萄牙王室的忠实仆人，他在近东和亚洲及非洲的毗邻地区进行了探索，并向邻近的王国派出了其他外交使团。他的冒险经历使他远至印度洋，直到他找到了返回埃塞俄比亚的路。在那里，他受到了欢迎，从此被当作尊敬的客人对待，但也被禁止离开。\n佩罗优雅地接受了这个镀金的笼子，在这里时，他充当着某种意义上的葡萄牙大使。虽然他受到埃塞俄比亚宫廷的爱戴，对葡萄牙宫廷也很亲切，但似乎这个有決心的人的职业生涯将在这里结束，远离他的家和他的冒险。除非你能介入……"
 podgreatpersons.0166.t: "忽秃伦"
 podgreatpersons.0166.desc: "强大的海都汗的女儿是一位可怕的女人，作为摔跤手而闻名，她曾向所有的追求者提出在单挑中击败她。这被证明是一项不可能完成的事，很快忽秃伦就从被她打败的求婚者那里赚取了数百匹马的赌注。到目前为止，她是她父亲的宠儿，他经常在政治和军事方面寻求她的支持，甚至考虑任命她为他的继承人。\n然而，随着大汗最近的去世，他的儿子们并不热衷于由一位女人来统治，即使是像他们姐姐那样厉害的女人。匕首被磨得很锋利，看来忽秃伦的日子已经不多了，因为她的诚实勇敢并不适合这种宫廷阴谋。现在可能是你介入的好时机，拯救这位著名的 “草原虎女”。"
 Guush_Luvsandanzan: "罗卜藏丹津"
 podgreatpersons.0167.t: "罗卜藏丹津"
 podgreatpersons.0167.desc: "伟大的成吉思汗的历史充满了谣言和夸大其词，最近蒙古历史学家和作家罗卜藏丹津澄清了这一点。在他的《蒙古黄金史》中，这位学者详细描述了从传言中的出生到成为成吉思汗的蒙古历史。该书的意义还在于它是“成吉思汗的智慧”的主要来源，这是专门针对蒙古统治者贵族后代的道德祖训。\n成吉思汗的生命对于像你这样的永生者来说是短暂的，但他本人显然强于其他凡人。因此，你正在考虑自己阅读这本书，也许可以从中获得一些智慧……或者也许可以“邀请”其作者到你的宫廷。毕竟，原本总是更好的。"
 Job_Charnock: "约伯·查诺克"
 podgreatpersons.0168.t: "约伯·查诺克"
 podgreatpersons.0168.desc: "大不列颠人和他们的代表对印度的控制越来越多。因此，你已经监视他们的活动有一段时间了。目前东印度公司的英格兰管理者是一个有趣的人。一段时间以来，他一直尽职尽责地铲除同胞们的腐败和最恶劣的过度行为。这一点，再加上他与一位印度女人的婚礼，使他有很多敌人，特别是他被称为是一位有些低沉的人，很少有时间进行外交活动。\n不过，他的成就还是很多的，从他与莫卧儿纳瓦卜的冲突到深入孟加拉的吉大港远征。然而，他的年龄已经大了，如果你正在寻找一些有才华的凡人，现在可能是你采取行动并把他带到你的宫廷的时候了。"
 Al_Sahili: "萨希里"
 podgreatpersons.0169.t: "萨希里"
 podgreatpersons.0169.desc: "曼萨·穆萨的朝觐是一件光荣的事情，直到今天晚上还在穆斯林世界中被人津津乐道。因此，许多学者都前往穆萨的首都廷巴克图，亲眼目睹马里的荣耀。阿布·伊沙克·萨希里就是这样一位学者，他是一位非常受穆萨本人喜爱的格林纳达诗人。\n这位安达卢西亚人在马里安了新家，他的贡献，包括建筑项目和外交事业，都得到了宫廷的高度评价。他最近从摩洛哥来使回归，此后一直感到身体不适。以他的高龄，如果他死于这种疾病，没有人会感到惊讶，这就给了你一个机会把他带到你身边，也许是作为一位$pod_Embrace$候选人。"
 Emotan: "埃莫坦"
 podgreatpersons.0170.t: "埃莫坦"
 podgreatpersons.0170.desc: "在最近肆虐贝宁大部分地区的内战中。奥巴·伊瓦雷最近取得了胜利，主要是因为一位名叫埃莫坦的低层商人妇女的意外帮助，她警告了他关于他兄弟的阴谋。她的帮助在帮助结束冲突方面起了决定性作用，虽然你不知道具体情况，但似乎新的统治者正计划用一些有声望的职位来丰厚地奖励她，甚至以她的名义种植一棵神圣的“乌鲁赫”树。\n尽管如此，埃莫坦至今仍过着平静的生活，这意味着你有一个潜在的时机，在她的名气变得太大而无法行动之前，伪造她的死亡并把她带到你的宫廷。"
 Thomais_Orsini: "托马斯·奥西尼"
 podgreatpersons.0171.t: "托马斯·奥西尼"
 podgreatpersons.0171.desc: "凡人的政治最近在巴尔干地区以惊人的速度发展，你很难跟上这一连串的征服、内战和谋杀。你的一个派员正在向你报告情况，表示塞尔维亚帝国正在在拜占庭帝国的另一场内战之后崛起。该地区的新统治者已经开始通过任命总督和与当地贵族联姻来巩固其权力。\n托迈斯-奥西尼就是这样一位贵族，她既有著名的拜占庭血统，又是伊庇鲁斯前意大利统治者的女儿。这使她成为任何想统治伊庇鲁斯的人梦寐以求的宝贝，她的一生由接连不断地在她身边发生的政治行动和阴谋构成。\n这算是为在$pod_cainites$的致命政治中过上无忧无虑的生活做了很好的准备，这一点很少有凡人可以夸耀。你正在考虑安排她发生一次“意外”，把她带到你的宫廷，作为潜在的$pod_Embrace$候选人。"
 Dilshad_Khatun: "迪尔沙德·哈通"
 podgreatpersons.0172.t: "迪尔沙德·哈通"
 podgreatpersons.0172.desc: "蒙古人统治波斯已经有一段时间了，但他们的汗国的稳定性正在慢慢崩溃。一个继任的国家，札剌亦儿苏丹国，正在这个权力真空中崛起。在这个艰难的时期，有一个女人正以相当高的技巧来驾驭她的道路。迪尔莎德，一位蒙古公主，最初注定要成为伊尔汗国的皇后，但随着这个汗国的解体，她反而迁移到迪亚巴克尔，在那里她成为了该地区许多雄心勃勃的军阀所追捧的对象。\n在需要时，她小心翼翼地安抚那些最具侵略性的军阀，成功地成为伊拉克最有权势的女性，并成为一股相当大的政治力量。她既利用这一地位为自己谋利，对那些轻视她的人进行报复，也为大局着想，被称为贴近人民的慈善统治者。\n然而，她的故事似乎就要结束了，因为根据你的消息来源，被轻视的军阀之一正计划在即将到来的事件中毒死她。这个警告给了你一个小小的时机，如果你愿意，可以进行干预。"
 Zaria: "扎里亚"
 podgreatpersons.0173.t: "扎里亚"
 podgreatpersons.0173.desc: "中部非洲一片火热，因为一位新的女王已经在分裂的豪萨中开始了一场漫长的征服运动。这个名叫阿米娜的可怕女人在确保她的整个民族在任何时候都挥舞着武器之后，已经征服了她的许多邻居。关于这位强大的战士女王的故事已经在传播，她发誓在非洲统一到她的旗帜下之前不会停止她的战争道路。\n在这个崇高的目标中，她得到了她那同样可怕的妹妹扎里亚的支持，她经常被看到与她的统治者一起带领骑兵冲锋。阿米娜本人不在你的管辖范围之内，因为她已经是一个非常受欢迎的统治者，任何干扰都可能导致你的失败。然而，扎里亚……如果你有这样的想法，你可以伪造她死于兵戈，把她带到你身边。这样一位有活力、有才华的凡人有可能在你的掌握之中，这可不是每天都能成的。"
 Dmitry_Gerasimov: "德米特里·格拉西莫夫"
 podgreatpersons.0174.t: "德米特里·格拉西莫夫"
 podgreatpersons.0174.desc: "德米特里·格拉西莫夫是一位俄罗斯翻译家、外交官和语言学家，作为教宗克莱孟七世的直属大使，他在那里与许多意大利文艺复兴时期的学者交谈并留下了深刻的印象。回到俄罗斯后，德米特里一生致力于将许多拉丁语宗教作品翻译成斯拉夫语，为新生的斯拉夫语语法编纂了许多有用的规则。\n这样一个学识渊博、游刃有余的人并不像你想象的那样经常出现，而且他与凡人政治的相对隔离使他成为一个有点容易的目标，若你想拥有他为你服务。"
 Jamal_ud_Din_Yaqut: "贾马尔·乌德·丁·雅库特"
 podgreatpersons.0175.t: "贾马尔·乌德·丁·雅库特"
 podgreatpersons.0175.desc: "作为一个出身低微的非洲奴隶，贾马尔·乌德·丁·雅库特在德里苏丹国的权力结构中迅速崛起，这要归功于他与现任君主女苏丹拉齐娅的友谊（有人认为是“婚外情”）。贾马尔对他的统治者忠心耿耿，他的武功见识和身体素质受到宫廷的重视，但他突然成为拉齐娅的心腹，使他树敌很多。这种对德里的土耳其贵族权力的挑战即将达到沸点，因为他们已经开始公开叛乱。\n贾马尔和拉齐娅的事业似乎毫无希望，因为贵族在人数上大大超过了训练有素的土耳其军队，而他们最近在德里城外的失败只是加速了这一进程。然而，在战争和当前权力斗争的混乱中，你可以找到机遇。贾马尔是一个足智多谋的人，他可以成为一个有价值的$pod_Embrace$候选人。"
 Khwaju_Kermani: "夸朱·科马尼"
 podgreatpersons.0176.t: "夸朱·科马尼"
 podgreatpersons.0176.desc: "一位著名的波斯诗人和苏菲派神秘主义者最近引起了大家的注意。夸朱·科马尼是一个善于旅行的人，在定居巴格达撰写《霍梅与胡马云》之前，他已经走遍了穆斯林世界，这首诗叙述了讲述了一位潇洒的霍梅王子在梦中看到中国公主胡马云的画像并一见钟情，然后他面对巨龙，获得宝藏，成为从波斯到中国的所有土地的国王，并在最终与中国公主结婚的故事。他还以博学多才而闻名，曾担任过该地区许多统治者的宫廷诗人，使他成为一位熟悉本时代的可靠外交家。这些众多的品质使他成为你宫廷中的谈资，如果你愿意，你已经发现了几个可以使他更接近你的影响力范围的机会。"
 Mawlana_Jami: "拉赫曼·雅米"
 podgreatpersons.0177.t: "拉赫曼·雅米"
 podgreatpersons.0177.desc: "拉赫曼·雅米以其作为多产学者和神秘苏菲文学作家的成就而闻名，他主要是伊本·阿拉比学派的著名诗人神学家和火者派苏菲大师，以其雄辩和对慈悲的形而上学的分析而闻名。他还在帖木儿宫廷中担任重要职务，参与了这个时代的政治、经济、哲学和宗教生活。雅米写了大约八十七本书和信件。他的作品从散文到诗歌，从世俗到宗教都有。他还写过历史和科学方面的作品。\n如果你能在死神之前“获得”他，这样一位完整的学者肯定能在你的宫廷里给人留下深刻印象。"
 Zafar_Khan: "扎法尔·汗"
 podgreatpersons.0178.t: "扎法尔·汗"
 podgreatpersons.0178.desc: "德里最新的苏丹阿拉乌丁·卡尔吉自篡夺王位以来取得了一个又一个成功，这要归功于一位名叫扎法尔·汗的杰出将军。扎法尔·汗在阿拉乌丁担任卡拉总督时就与他有联系，在阿拉乌丁于1296年刺杀其前任贾拉勒丁后，他率领阿拉乌丁军队的一条主要分支从卡拉来到德里。然后他率领军队入侵木尔坦，消灭了贾拉勒丁家族的幸存成员。\n扎法尔·汗还率领德里军队于1298年在贾兰·曼朱彻底击败了察合台的蒙古入侵者。同年晚些时候，阿拉乌丁派遣扎法尔·汗从蒙古人手中夺回西维斯坦。扎法尔·汗果断地击败了入侵者，并把他们的首领作为俘虏带到德里。\n然而，扎法尔的技能似乎并不足以使他从返回的蒙古军队手中逃脱。尽管在乞力给他们造成了严重的伤亡，但人数上的巨大差异根本无法克服。不过，你可以利用这样一场战役的混乱来绑架扎法尔，把他带到你的宫廷。"
 podgreatpersons.0179.t: "阿努"
 podgreatpersons.0179.desc: "蒙古帝国的遗产在大草原上依然存在，许多军阀都在争夺这个曾经强大的国度。博硕克图汗噶尔丹是这一长串名单中最新的一位，从中国到哈萨克斯坦，他取得了一些显著的成功。但强大的大清已经注意到了这一点。\n大清的康熙皇帝亲自率领远征军。1696年5月，噶尔丹从肯帝亚山脉南下，在昭莫多之战中迎战清军的西部纵队，但他的部队很快被优势的清军包围。噶尔丹的妻子阿努亲自领导了一场反击战，使她的丈夫得以逃脱。\n然而她在勇敢的冲锋中中了一箭，现在正躺在病床上。吸血鬼的血液足以拯救她，并且可以在这个过程中为你赢得一位勇敢而熟练的郡主的忠诚。"
 Idia: "伊迪亚"
 podgreatpersons.0180.t: "伊迪亚"
 podgreatpersons.0180.desc: "贝宁的王后最近变得很有名，因为她在她儿子的崛起和统治中发挥了重要作用，被描述为一个伟大的战士，在她儿子作为埃多人民的奥巴（国王）统治之前和期间，她一直在不懈地战斗。伊迪亚女王在埃斯吉的父亲奥巴奥佐卢阿去世后，为他争取到了奥巴的头衔，发挥了重要作用。为此，她组建了一支军队，击退了他的兄弟阿胡兰，后者随后在战斗中被击败。埃西吉因此成为贝宁的第17任奥巴。\n随后，邻近的伊加拉人派战士越过贝努埃河来夺取贝宁北部领土的控制权。埃西吉征服了伊加拉人，重新建立了王国的统一和军事力量。他的母亲伊迪亚得到了这些胜利的大部分功劳，因为她的政治建议，加上她的魔法力量和医药知识，被认为是埃西吉在战场上取得成功的关键因素。\n这样一位才华横溢的女性并不常见，你正在认真考虑将她带到你的宫廷中的潜在好处是否能超过暴露的风险。"
 podgreatpersons.0001.generic: "一位耐人寻味的人物最近在凡间展现了一些真正的前途。如果你需要像这样的人才，你可以利用你的一些影响力把他们带到你的宫廷。"
 podgreatpersons.0181.t: "米海尔"
 podgreatpersons.0181.desc: "变革的浪潮席卷欧洲，降低了教会对民众的控制力与对吸血鬼及其他超自然生物的猎杀能力。理所当然的，许多人都在密切关注这一形势的新发展。\n马丁路德，变革的一位领导者，最近在和一个欧洲人称之为“米海尔执事”的人打交道，后者显然是埃塞俄比亚科普特教会的一位代表。他们发现他们的宗教理念有许多相似之处，米海尔最近回到了埃塞俄比亚，并带着马丁路德要求与科普特教会结盟的信息。\n该事件的影响仍不明朗，但显然执事是一位经验丰富的外交官与一位博学的神学家，并且不惧怕漫长而危险的旅途。这些品质使他成为一位有趣的初拥候选人。"
 Soumaoro_Kante: "苏曼古鲁·坎特"
 podgreatpersons.0182.t: "苏曼古鲁·坎特"
 podgreatpersons.0182.desc: "加纳帝国正在瓦解，一些军阀已经在分食它的尸体。其中最成功的是苏曼古鲁·坎特，他被称为术士国王，因传闻中他使用魔法力量帮助他征服了一些较小的军阀而声名远扬。\n然而，坎特最近遇到了一个劲敌，曼丁戈亲王松迪亚塔·凯塔组建了一个由小王国组成的联盟，在基里纳战役中反对他并击败了他，迫使他逃到附近的山脉。亲王的部下们正对他紧追不舍，但这可能是一个干预凡间的有趣机会。伪造坎特的死亡并将他带回你的宫廷将会很容易。如果他确实掌握了魔法力量，他将成为相当有吸引力的$pod_Embrace$候选人……"
 al_Hasan_Muhammad_al_Wazzan: "哈桑·穆罕默德·瓦赞"
 podgreatpersons.0183.t: "哈桑·穆罕默德·瓦赞"
 podgreatpersons.0183.desc: "一个安达卢西亚旅行家和外交官，哈桑·穆罕默德·瓦赞，在非洲度过了他人生的大部分时间，他是廷巴克图等众多宫廷的尊贵成员。在回到家乡后，他被医院骑士团俘获，他的故事吸引了基督徒的兴趣，因此后来被带到教宗面前，被释放并获得了养老金，并改名为利奥·阿非利加努斯。\n他关于非洲财富的故事被出版在由圣座赞助的几本书中，随着他的作品越来越受欢迎，也激发了欧洲探险家的兴趣。但在意大利的巡回演出成功之后，瓦赞的命运发生了转变，新教宗并不信任宫廷中改信基督教的穆斯林。因此，他决定回到北非，确切地说是突尼斯，重新皈依伊斯兰教。直到今晚，他仍然在那里，成为一个潜在的$pod_Embrace$或血仆化的有趣目标。"
 Ilya_Muromets: "伊利亚·穆罗梅茨"
 podgreatpersons.0184.t: "伊利亚·穆罗梅茨"
 podgreatpersons.0184.desc: "伊利亚是一位农民的儿子，一直到晚年都是瘸子，被两位朝圣者奇迹般地治好。从那时起，他的英勇故事越来越多，从他单枪匹马保卫切尔尼戈夫市免受游牧民族的入侵，到击败“森林怪物”南丁格尔。伊利亚头脑简单，但也脾气暴躁，他以狂热的横冲直撞而闻名，几乎和他的英雄壮举一样多。\n你不能不被这样一个人物所吸引。如果他的故事只有一小部分是真实的，这仍然会使他成为相当强大的战士，他可能已经知道超自然的事情。他头脑简单的智力也是一个优点，使你有可能足够容易地控制他。\n如果你派你的派员瞄准他并把他带回你的宫廷，你就可以评估他是否适合做血仆，甚至是潜在的$pod_Embrace$对象……"
 Helene_Kottanner: "海伦·科坦纳"
 podgreatpersons.0185.t: "海伦·科坦纳"
 podgreatpersons.0185.desc: "匈牙利的凡人宫廷正处于骚动之中，因为他们的神圣王冠最近被盗。这不仅仅是一件无价的文物，它还是匈牙利皇室的象征，没有它，任何国王都不能公开发言。你被这个小故事逗乐了，你让你的派员多探究一点，发现了罪魁祸首，是一位叫海伦·科坦纳的人，奥地利贵族的仆人和保姆。这清楚地表明，凡人只要肯花心思，就能很好地掌握密室阴谋。\n科坦纳最近把她来路不正的宝物交给了奥地利人，确保她有可能得到巨大的回报和匈牙利人的敌意。你的宫廷上的一些成员正在推动将这个不寻常的盗贼交给你监管的主意。毕竟，她已经证明了自己的聪明才智，同时也对她的雇主非常忠诚，这是一个很强的仆人素质。"
 Albertas_Gostautas: "阿尔贝塔斯·戈斯陶塔斯"
 podgreatpersons.0186.t: "阿尔贝塔斯·戈斯陶塔斯"
 podgreatpersons.0186.desc: "在凡间，随着时间的推移，立陶宛人民和习俗正越来越多地被他们的“波兰立陶宛联邦”的波兰兄弟们所吞并，你正以温和的兴趣关注这一发展。然而，立陶宛公国最新的大法官阿尔贝塔斯·戈斯陶塔斯一直在努力工作，以保护其人民的部分传承。他是《立陶宛大公国法规》的发起人和编辑，在与波兰人的侵蚀作斗争的同时，特别照顾立陶宛文学的代表。\n虽然他在国内的影响力很重要，甚至为自己建造了一座城堡，但他的家族财富多年来却在不断减少。这种政治上的挫折使他比以前更加平易近人，宫廷中一直流传着把他带到你身边的想法。毕竟一个有能力、勤奋的财务总管总是可以证明是有用的。"
 Mikhailo_Olelkovich: "米哈伊洛·奥列尔科维奇"
 podgreatpersons.0187.t: "米哈伊洛·奥列尔科维奇"
 podgreatpersons.0187.desc: "俄罗斯各公国的政治正在迅速演变，一位名叫米哈伊洛·奥列尔科维奇的无地贵族已经处于核心位置一段时间了。米哈伊洛是基辅大公的弟弟，他很早就试图通过与波兰立陶宛联邦结盟来打破莫斯科人对罗斯的统治。这导致他在诺夫哥罗德发起了数年的起义，直到他在莫斯科的失败。\n失去了在俄罗斯的头衔，米哈伊洛退到了联邦，在那里他成为了一个重要的权力参与者，导致了他对大公的政变企图。然而，这个阴谋被发现了，米哈伊洛现在正在牢房里腐烂，等待着他不可避免的处决。你正在思考干预的好处，把他带到黑夜。这人确实表现出了很好的操纵政治的能力，但他也有一个令人担忧的缺点，那就是对他的领主缺乏忠诚……"
 Marfa_Boretskaya: "玛尔法·博雷斯卡娅"
 podgreatpersons.0188.t: "玛尔法·博雷斯卡娅"
 podgreatpersons.0188.desc: "在凡人政治中，莫斯科在俄罗斯各公国中的权力越来越大。敌对城市诺夫哥罗德一直是它的最新目标，它签订了各种有约束力的条约来削弱其独立性。这导致它最近在该市市长的妻子玛尔法·博雷斯卡娅的带领下公开造反。\n由于找到了其他俄罗斯大公甚至附近的波兰立陶宛联邦的支持，玛尔法成功地召集了一支庞大的，尽管非常分散的军队。然而，最终这一切都是徒劳的，因为莫斯科大公伊万三世出兵打败了它。\n虽然她又设法保护了城市的独立数年，但伊万最终吞并了城市并逮捕了她，她现在正前往莫斯科面对她的判决。\n你的一些宫廷成员被这个女人的魅力和坚韧不拔的精神所打动，主张你采取行动救她，认为她可以成为你事业的强大资产。"
 podgreatpersons.0189.t: "法蒂玛"
 podgreatpersons.0189.desc: "强大的（凡人的）蒙古帝国几年来一直由摄政皇后脱列哥那领导。这个雄心勃勃的女人从窝阔台的遗孀手中夺取了权力，并迅速用她的门徒取代了他的大臣。其中有一位奇怪的什叶派波斯人，名叫法蒂玛，显然是一个被驱逐的战争难民，不知为何成为新皇后的宠儿。这个不寻常的人物已被提升为蒙古帝国的高级职位，基本上成为世界上最强大的帝国的第二大政治家。\n然而，情况总是会发生变化，脱列哥那的儿子贵由最近成年了，迫使他的母亲下台。贵由的统治以大清洗开始，清除了他母亲的大臣们，直到只剩下法蒂玛。迄今为止，脱列哥那一直拒绝交出她，甚至威胁说如果贵由做出任何愚蠢的举动，她就自杀。但凶兆迫在眉睫，法蒂玛的日子已经不多了。\n这可能是一个很好的机会，你可以为这个有才华的女人提供另一次逃跑的机会，她可以成为一位有趣的血仆甚至是$pod_Embrace$的候选人……"
 Mamai: "马麦"
 podgreatpersons.0190.t: "马麦"
 podgreatpersons.0190.desc: "蒙古帝国在经历了早期的成功后继续瓦解。最强大的残余势力之一是金帐汗国，其政治几十年来一直由一个人主宰：马麦。\n尽管在不断的内战期间，他无法稳定中央政权，但马麦多年来一直是一位杰出的、坚持不懈的领导人，而其他人则是来去匆匆。这位杰出的指挥官在宫廷政治中表现出了能力，在多个场合扮演着王位背后的推手，同时也与汗帐的邻国进行了建设性的外交活动。\n你已经关注他一段时间了，看来他的好运气终于用完了。在与一个新的宣称者的战斗中失败后，马麦正在逃避紧追不舍的刺客们。这可能是一个千载难逢的机会，让你获得这样一位有才华的政治家为你所用。"
 podgreatpersons.0191.t: "狄奥多拉"
 podgreatpersons.0191.desc: "在大草原的边缘，历史的一页正在翻开。东罗马帝国（古罗马时代的最后残余）的最后残余正在屈服于入侵的奥斯曼人的围攻。狄奥多罗这个小小的公国，克里米亚哥特人和希腊人的奇怪混合体，由于在政治大局中几乎完全不相干，所以迄今为止一直被冷落，但奥斯曼人的注意力终于转向了他们，城市已经沦陷。\n这座城市现在正在燃烧，它的财宝被夺走，它的领导人被抓到伊斯坦布尔处决，大公的女儿们被围在苏丹的后宫里。\n吸血鬼的生命很长，有时记忆甚至更长，罗马的夜晚仍然是许多人的回忆。你的派员报告说，到目前为止，大公的一个女儿已经设法逃脱了追捕，在燃烧的城市街道上躲避奥斯曼人的追捕。若拯救她并给予她永生，将能是对可怕的时间流逝的反抗。"
 Sufi_Khalil_Beg_Mawsilu: "苏菲·哈利勒·贝格·摩苏尔鲁"
 podgreatpersons.0192.t: "苏菲·哈利勒·贝格·摩苏尔鲁"
 podgreatpersons.0192.desc: "作为白羊王朝的摩苏尔鲁氏族的土库曼军官，苏菲·哈利勒·贝格·摩苏尔鲁是艾勒旺德苏丹统治时期的重要人物，在后者去世后的王位继承斗争中发挥了关键作用。他将年仅九岁的艾勒旺德的长子拜宋豁儿推上王位，实际上成为了王国的统治者。\n\n作为经历过多次军事战役的老兵，苏菲展现出了无情和能力，然而他的阴暗统治并不成功。他明目张胆地偏袒自己的部族，因此树敌众多，而苏菲对他们的异端指控和武力示强，则在很大程度上遏制了这些敌人。\n\n这种统治方式不可能永远持续下去，最近，苏莱曼·贝格·毕坚，他的长期竞争对手，击败了这位未来的苏丹，他溃败的军队正在逃亡中。苏莱曼不太可能对苏菲示以怜悯，这个事实可以让你在他去世前让他从凡人眼中消失。也许你可以利用这么一位经过验证的，对政治阴谋充满热情的军事指挥官。"
 Khayr_al_Nisa_Begum: "海尔·妮萨·贝加姆"
 podgreatpersons.0193.t: "海尔·妮萨·贝加姆"
 podgreatpersons.0193.desc: "波斯帝国正在从继承危机中恢复，目前的沙阿是意志薄弱的穆罕默德·科达班达。然而，真正的权力掌握在他的首席妻子手中。\n海尔·妮萨·贝加姆曾是一个被自己的表亲杀害的地区首领的女儿。她发誓有朝一日要报仇，并设法进入皇宫，并引起未来沙阿的注意。在他登上王位后，她与同样拥有相当权力和影响力的妹妹展开了激烈的斗争。这场斗争以海尔在一次宫廷政变中将她和其他几个王位宣称者一同谋杀而结束。\n现在她有效地控制着波斯，她毫不犹豫地对她表亲家族进行了血腥的报复，以报答他们在她父亲之死中的罪责。尽管她对波斯的掌控目前还算稳固，但复仇很快将成为她的崩溃之因。她曾复仇的家族成员现在夺取了首都，发动政变并向皇宫进发，意图夺取海尔的首级。\n如果你想将这样一位有前途的凡人从她的杀手手中解救出来，你时间不多了。"
 Lizdeika: "利兹代卡"
 podgreatpersons.0194.t: "利兹代卡"
 podgreatpersons.0194.desc: "立陶宛大公格迪米纳斯的首席原始教祭司是一个神秘莫测的奇人。据传他诞生在一只鹰巢中，他因在大公国宫廷中可靠地解梦而声名鹊起。\n他最新的预言来自大公梦中出现的一只巨大嚎叫的铁狼，他通过这个预言确定了立陶宛最伟大城市维尔纽斯的理想建立地点。\n这样强大的妖术在凡人中很少见，除非受到超自然力量的影响。你可以利用你在大公国的探员邀请这位祭司进入你的宫廷，这将为你未来的利益开辟一条利用他的力量的途径。"
 podgreatpersons.0195.t: "比露特"
 podgreatpersons.0195.desc: "立陶宛最有权势的人之一，科斯图提斯，在与他的侄子的战争中最近去世了。对于像你这样的人来说，这并没有什么真正的影响，但是科斯图提斯的妻子比露特的故事引起了你的兴趣。这位以美貌闻名的原始教祭司被迫嫁给了她的基督教丈夫，并在他的阴影下默默生活了几十年。然而，她的信仰似乎从未动摇，一个当地的信徒团体围绕她而兴起，将她视为当地原始教信仰群体心目中的女神或殉道者。\n随着科斯图提斯的去世和王国陷入混乱，你得知不久前比露特从城市中神秘消失，却又重新出现在她年轻时被迫离开的神殿。这样一颗虔诚的灵魂引起了你的兴趣，你的一些廷臣们想知道你是否真的能够使她成为她小小信徒团体心目中的不朽女神……"
 Torkel_Knutsson: "托克尔·克努特松"
 podgreatpersons.0196.t: "托克尔·克努特松"
 podgreatpersons.0196.desc: "瑞典最有权势的人之一目前被囚禁在斯德哥尔摩，等待处决。托克尔·克努特松是前国王马格努斯·拉杜洛斯的亲密朋友，并被委任为年幼继承人的摄政王。托克尔勤勉地完成了这项任务，限制了教会的权力，建立了新的贸易路线，并亲自领导了对抗诺夫哥罗德共和国的防御，由于他的胜利，瑞典获得了新的领土。\n然而，托克尔在处理国王和他的两个兄弟之间的继承危机上并不成功。他以荣誉为国王辩护，并设法在后来促成了兄弟们之间的和平。然而，令人遗憾的是，这被证明是一个错误，因为怀恨在心的公爵们用虚假的指控毒害了国王对托克尔的看法，最终导致了他目前的困境。\n如此忠诚而有才华的政治家很难找到。也许在他被处决之前，你可以给予他一些帮助？"
 podgreatpersons.0197.t: "玛格丽特？"
 podgreatpersons.0197.desc: "多年来，挪威的宫廷一直在谈论玛格丽特的故事，她是挪威公主，最终成为苏格兰王位的最后继承人。她在前往新领土的途中突然去世，使苏格兰陷入了一场无休止的内战。尽管挪威本身幸免于此问题，但“挪威女孩”的故事最近又回到了人们的视野，因为一位女子突然来到卑尔根，声称自己就是失踪的玛格丽特，并指控几位高级贵族叛国。\n尽管她关于逃避死亡并被送往德意志的故事存在矛盾之处，卑尔根的居民和教士们支持她的主张。然而，国王并不这么认为，也许是为了避免进一步卷入苏格兰的麻烦，他决定在几天后将这位女子以叛国罪处以火刑。\n你的一些探员正在考虑帮助她逃离监狱并加入你的宫廷，很可能会让凡人更加困惑，而且也许能够获得宝贵的资产。"
 Yasaur: "亚萨乌尔"
 podgreatpersons.0198.t: "亚萨乌尔"
 podgreatpersons.0198.desc: "蒙古帝国的两个主要继承汗国正在交战。察合台汗国最近被他们的伊儿汗国敌人击败，主要是由于一个相对较低地位的察合台王子亚萨乌尔的背叛。有人指责亚萨乌尔从一开始就与敌人密谋，而其他人则说他是被暗杀计划所针对，只是为了自卫而行动。\n亚萨乌尔在两个阵营的军事行动中表现出色，确保了他的一小片领地，但他的忠诚始终受到怀疑。一位新的伊尔汗国皇帝登基，并指责亚萨乌尔“不合作”。被敌人包围的流亡王子仍然设法逃脱，但现在是他昔日的察合台部落的朋友们正在逼近他。\n这个人确实展现了一些坚韧的品质和欺骗的能力，这对你的需求可能很有价值。他现在正朝着你的影响范围奔跑，你正在思考下一步行动。"
 Kurbat_Ivanov: "库尔巴特·伊万诺夫"
 podgreatpersons.0199.t: "库尔巴特·伊万诺夫"
 podgreatpersons.0199.desc: "随着凡人世界的俄罗斯扩张其疆域，大胆的冒险家们越来越往东方前进，探索并有时宣称新的西伯利亚寒冷深处的土地。库尔巴特·伊万诺夫就是其中之一，他是一位哥萨克人，刚刚绘制了如今被称为“俄罗斯远东”的地区的第一张地图。\n他的探险使他抵达了包括贝加尔湖、楚科奇半岛甚至对阿拉斯加有了初步了解的新地区。他的发现来之不易，他74人的探险队中大部分人无法活着回家，要么是因为恶劣的天气，要么是遭到当地部落的伏击。\n然而，伊万诺夫本人幸存下来，现在正在为未来的危险之旅制定计划。他的职业生涯中的这个暂停可能是你将他引入你的宫廷的机会。这样勇敢的冒险家很少见，也许你可以在你自己的（夜间）冒险中找到他的用处。"
 Yuri_Smolensk: "尤里·斯维亚托斯拉维奇"
 podgreatpersons.0200.t: "尤里·斯维亚托斯拉维奇"
 podgreatpersons.0200.desc: "作为流亡者，一位俄罗斯大公突然引起了你的注意，他在金帐汗国的宫廷中寻求庇护。这个人显然是斯摩棱斯克大公，声称曾为了抵御立陶宛的入侵而发动多次战争来保卫他的城市。他讲述了他的莫斯科同胞的欺骗，拒绝帮助他并破坏他的战争努力，最后得出结论说他在莫斯科担心自己的生命，因此选择了自愿流亡。\n宫廷中的传言对他并不赞美。虽然他确实是斯摩棱斯克大公，但据说他是一个残忍而好色的人，他的态度挥霍了莫斯科的帮助和他自己士兵的好意。\n很难找到关于这件事的真相，但至少这个人似乎在军事和政治事务上都很有能力。这使他成为一个不寻常但可能有趣的候选人，可以引荐到你的宫廷中。"
 Andre_Longjumeau: "安德烈·德·隆瑞莫"
 podgreatpersons.0201.t: "安德烈·德·隆瑞莫"
 podgreatpersons.0201.desc: "随着蒙古军队席卷东方，对途中的穆斯林领域施加巨大压力，西方基督教徒开始注意到他们。1245年，教宗意诺增爵四世派遣了他的第一个外交使团前往蒙古，由法兰西人安德烈·德·隆瑞莫率领。这位才华横溢的外交家成功完成了这个使命，此后成为教廷、法兰西和蒙古之间的中间人。\n他似乎有点夸大了西方人和草原人的共同利益，但他娴熟的口才成功地开始了法兰西和蒙古之间试探性联盟的进程。实际上，由于两个国家相距甚远，很难说这个联盟是否会真正实现，但是无论如何，安德烈已经成功地向西方描绘了蒙古的历史和文化（对于祭司王约翰的描绘也夸张了不少）。\n这样一位才华横溢的外交家并非每夜都会出现，而且安德烈正在再次访问草原，你的宫廷中的一些成员正在考虑采取行动，将他引入你的面前，他在未来可能会有所用处。"
 Euphrosyne_Palaiologina: "欧佛洛绪涅·巴列奥略戈斯"
 podgreatpersons.0202.t: "欧佛洛绪涅·巴列奥略戈斯"
 podgreatpersons.0202.desc: "貌似不可阻挡的蒙古金帐汗国最近入侵了色雷斯，使困境中的拜占庭帝国陷入危险。拜占庭皇帝米海尔八世·巴列奥略戈斯为了建立联盟，将他的女儿欧佛洛绪涅嫁给了金帐汗国的那海汗。尽管年轻的女士必须忍受强烈的文化冲突，但她却非常适应新的生活。\n她参与宫廷政治，成为丈夫那海的信任顾问，同时始终把君士坦丁堡的最佳利益放在心上。米海尔的策略似乎取得了成效，两个国家的关系因为他女儿的谨慎斡旋而变得更加友好。\n欧佛洛绪涅的才华引来了一些不受欢迎的注意，既有本地的吸血鬼，也有试图破坏这种新建立友谊的外来势力。你可以介入，保护拜占庭公主免受潜在的攻击，或者选择利用她来达到自己的目的。"
 Buscarello_de_Ghizolfi: "巴斯卡勒尔·德·吉索尔菲"
 podgreatpersons.0203.t: "巴斯卡勒尔·德·吉索尔菲"
 podgreatpersons.0203.desc: "巴斯卡勒尔是一个意大利人，当波斯还是蒙古伊尔汗国的一部分时，他定居在那里，并开始了他的职业生涯，成为蒙古统治者阿鲁浑的卫队军官。\n在1289年，阿鲁浑派遣了一个使团前往欧洲，巴斯卡勒尔作为大使，正式开始了他从1289年到1305年作为欧洲与蒙古之间的联系人的官方职业生涯，为蒙古统治者阿鲁浑、合赞和完者都效力。\n尽管他试图促进东西方之间的联盟从未实现，但巴斯卡勒尔仍然成为从英格兰到蒙古的伟大统治者最信任的代理人。\n现在回到大草原，巴斯卡勒尔成为[Glossary('阿什拉派','game_concept_ashirra_desc')]探员的目标，他们想为他在法兰克人和蒙古人袭击马穆鲁克的所谓联合行动中的身份而报仇。你有机会“拯救”他，也许可以利用他的卓越技巧为你未来的外交前景服务。"
 Maria_Perez: "玛利亚·佩雷斯"
 podgreatpersons.0204.t: "玛利亚·佩雷斯"
 podgreatpersons.0204.desc: "你已经听说过一个名叫玛丽亚·佩雷斯的奇特旅行艺术家有一段时间了。这位（显然是自我放逐的）贵族女士被赋予了许多壮举，从写诗歌到参加十字军东征，甚至是为几位国王担任间谍。她有时会出现在宫廷上，唱歌娱乐贵族，以她显然出众的射箭技巧羞辱一些人，然后消失不见，让她众多追求者感到困惑。\n奇怪的是，这种情况已经持续了几十年，远远超过了任何凡人女性能够维持这样的行为的时间。你的探员们无法找到这个谜团的答案，所以你仍然不确定“玛丽亚·佩雷斯”到底是一个人，还是有数个冒险女性使用这个名字来赢得一些名声。\n无论如何，你得知她（或者至少其中之一）正在经过你所在的地区。你的宫廷急切地催促你考虑将她纳入团队，可能是渴望亲自见到这位传奇人物。"
 Hammu_ibn_Abd_al_Haqq: "哈姆·伊本·阿卜杜勒·哈克"
 podgreatpersons.0205.t: "哈姆·伊本·阿卜杜勒·哈克"
 podgreatpersons.0205.desc: "摩洛哥王子哈姆·伊本·阿卜杜勒·哈克曾经试图反抗马林苏丹，但未能成功。像许多持异议的王子一样，他被流放到格拉纳达，加入了“信仰义勇军”，这是一个由北非人组成的军事团队，他们为保卫伊比利亚半岛上的穆斯林而战。\n在那里，他指挥着军队，在苏丹登基两周后的1302年4月从卡斯蒂利亚夺取了贝德马尔。然而，这个胜利并没有持续下去，因为格拉纳达很快陷入了几场危机，而哈姆却站错了队。在被同样被流放的王子奥斯曼击败后，哈姆不得不再次一无所有地离开。\n这是一个展示了军事经验并懂得宫廷政治的人。由于他现在基本上是孤身一人且无法自卫，这使他成为被绑架的诱人目标，或许在你的指导下给他第二次机会。"
 Tegueste: "特格斯特"
 podgreatpersons.0206.t: "特格斯特"
 podgreatpersons.0206.desc: "西班牙凡人最近发现了一组被他们称为“加那利群岛”的岛屿。作为凡人的惯常行为，他们一直试图征服这片土地。\n岛上分裂的土著部落团结在一个名叫特格斯特的人的领导下。\n西班牙人原本希望轻易获胜，但却被坚决击退了多次。只有一场严重削弱了关切人的流行病蔓延，才让西班牙人发动了另一次攻击……但这次也没有成功。\n然后，他们采取了分而治之的策略，先与其他小国王交涉，以孤立特格斯特的部落。在人数严重不足的情况下，特格斯特被迫投降，并成为胜利的基督徒们炫耀的奴隶。\n这个人展示了严肃的性格和在战争中相当的才能。你可以安排他“消失”，然后将他带到你的宫廷。相比成为西班牙人的战利品，他在这里肯定能发挥更大的作用。"
 podgreatpersons.0207.t: "多拉玛斯"
 podgreatpersons.0207.desc: "西班牙凡人最近发现了一组被他们称为“加那利群岛”的岛屿。作为凡人的惯常行为，他们一直试图征服这片土地。\n当地居民团结在一个年轻的勇士多拉玛斯的领导下。他以战斗的灵巧和领导才能而闻名，手持一把巨大的木剑，盾牌据说是由龙血树制成。\n作为加那利军队的首领，他取得了巨大的成功，成为土著抵抗运动中一个富有魅力的领导者。由于多拉玛斯在战争中赢得的巨大声望，卡斯蒂利亚队长开始对他展开决定性的攻势，亲自进攻他的家园。1481年8月20日，在阿鲁卡斯地区进行一场激烈的战斗时，多拉马斯中了一枪，不幸身亡。\n然而，这个故事可能还有更多的内情，因为一个自称是这位著名关切英雄的年轻人突然出现在你的宫廷。他说西班牙人使用另一个尸体来伪造他的死亡，打击关切人的斗志。他的故事可以等待，但现在你需要做出选择，因为他似乎在寻找一个永生的庇护者，也许是为了真正为他的人民复仇。\n你愿意成为他的庇护者吗？"
 Yalbugha_al_Umari: "雅勒不花·乌马里"
 podgreatpersons.0208.t: "雅勒不花·乌马里"
 podgreatpersons.0208.desc: "统治埃及的马穆鲁克苏丹国以其不稳定而臭名昭著，奴隶士兵种姓（即前述的马穆鲁克）常常与苏丹争夺权力。其中一个例子就是雅勒不花·乌马里。他最初是安纳西尔·哈桑的马穆鲁克，随着高级埃米尔沙侯和西尔吉米甚的消失，他逐渐晋升为埃米尔马吉利斯（觐见之主），并获得了最高军衔“千百马穆鲁克的埃米尔”。雅勒不花与安纳西尔·哈桑之间的关系恶化，前者在1361年的一场激烈权力斗争中杀死了后者，他的主人。\n在安纳西尔·哈桑被消除后，雅勒不花成为曼苏尔·穆罕默德苏丹国最有权势的人物，他能参与苏丹任命并决定在谁手下服役。然而，其他高级埃米尔的存在使他的权力受到一定的制约。\n在这些年里，雅勒不花建立了自己庞大的马穆鲁克家族，到1366年已经拥有约3000名马穆鲁克。同年，雅勒不花逮捕了塔伊布格哈并巩固了自己的统治。\n然而，一场马穆鲁克叛乱爆发，预计将导致这位曾经的马穆鲁克操纵者的讽刺性垮台。如果你愿意，这为你提供了一个在他削弱之际落进下石的机会。"
 Bayram_Pasha: "拜拉姆·帕夏"
 podgreatpersons.0209.t: "拜拉姆·帕夏"
 podgreatpersons.0209.desc: "奥斯曼帝国已经统治着广袤的土地已有一段时间，其独特的行政体制导致了许多熟练的官僚的崛起。拜拉姆·帕夏就是其中之一。\n拜拉姆最初是著名的耶尼切里军团成员，他在所有职位中晋升，成为图尔纳奇巴西（征兵队队长）、凯瑟达（宫廷司库）、埃及贝勒贝伊（总督司令）以及帝国中次于苏丹的最高职位大维齐尔。\n拜拉姆·帕夏因在公共工程建设方面的努力而在埃及和安纳托利亚享有盛誉。他修复了君士坦丁堡的城墙，并在该城委托建造了一座清真寺和一个库里耶（宗教建筑复合体）。他还在阿马西亚委托建造了一个灌溉设施和一个驿站。拜拉姆·帕夏也以在安纳托利亚城镇的各种客栈的庇护者而闻名。\n然而，拜拉姆的生命即将结束，因为他的健康状况迅速恶化。现已远离权力殿堂，这可能是你为自己的夜间帝国招募一位才华横溢的行政官员的机会。"
 Al_Hajj_Salim_Suwari: "哈吉·萨利姆·苏瓦里"
 nick_suwarian_father: "苏瓦里教派之父"
 podgreatpersons.0210.t: "哈吉·萨利姆·苏瓦里"
 podgreatpersons.0210.desc: "来自马里核心区萨赫勒城镇贾的哈吉·萨利姆·苏瓦里多次赴麦加朝圣，并毕生致力于发展一种能帮助穆斯林少数群体在“异教”土地生存的教义。他创立了苏瓦里传统，为与非穆斯林统治阶级和平共处提供了重要神学依据。随着莱本与随穆斯林商旅而来的[Glossary('阿什拉派','game_concept_ashirra_desc')]血族间矛盾加剧，这位致力于搭建两大群体桥梁的智者或许能发挥作用。"
 nick_the_resurrected: "复生者"
 podgreatpersons.0211.t: "克里斯托斯·萨姆拉"
 podgreatpersons.0211.desc: "最近有个奇异故事传入你耳中。克里斯托斯·萨姆拉生于基督教埃塞俄比亚帝国边疆省的富裕虔诚家庭。约四十岁时，她因女仆行为不端暴怒，将火钳捅入其喉致死。事后她深感愧疚，祈祷上帝复活女仆。奇迹般的是女仆真的复活了。震惊之余，她思忖“现世祈祷尚得应允，修道院中岂非更甚？”遂决定成为修女开始灵修生涯。虽然她的信仰使其免受你掌控，但这个能施行复活的凡人令你着迷。身为修女的克里斯托斯已不需要那个奇迹复活的女仆，正好供你研究这个死而复生的神秘女子。"
 Ugolino_Vivaldi: "乌戈利诺·维瓦尔第"
 nick_the_first_explorer: "首位探险家"
 podgreatpersons.0212.t: "乌戈利诺·维瓦尔第"
 podgreatpersons.0212.desc: "近期有艘遇险船只在你领地附近搁浅。遭遇风暴的船员多数殒命，唯有一人带伤幸存。费时解读其语言后，你得知他叫乌戈利诺·维瓦尔第，来自热那亚城。他与亡故的兄弟原本率领探险队前往印度。如今他孤身流落异乡，不谙地理，完全任你摆布。这个兼具冒险精神与算术才能（身兼商人与船长）的男子，或许能为你的计划所用。"
 Kassi: "卡西"
 nick_qasa: "卡萨"
 podgreatpersons.0213.desc: "马里皇帝苏莱曼的正妻卡西曾与丈夫共治。深受皇室成员爱戴的她，因丈夫移情平民女子本久而失宠被废。贵族妇女们继续效忠卡西，以土覆头示敬，同时以土搓手羞辱本久。这种忤逆最终迫使卡西躲进清真寺避难。随后她煽动贵族亲属叛乱，引发内战。这场苏莱曼派与前朝马甘王子派的斗争以卡西派溃败告终。如今败局已定，正是你在苏莱曼军队擒获她前“搭救”这位政治头脑出众的女子的良机。"
 nick_the_cuman: "库曼人"
 podgreatpersons.0214.t: "伊丽莎白「库曼人」"
 podgreatpersons.0214.desc: "库曼可汗科滕之女伊丽莎白在长期战争后作为和亲筹码嫁给匈牙利王子史蒂芬。虽改宗天主教，但宫廷始终怀疑其信仰虔诚。丈夫死后成为幼王拉迪斯劳斯的摄政太后。其子表现出对库曼文化的偏爱引发宫廷不满，归咎于她的“异教”影响。接连内战与政变后，随着拉迪斯劳斯身亡，敌对宫廷重掌大权，伊丽莎白命运已定。若你看中这位经验丰富的太后作为[ghoul|E]或$pod_Embrace$人选，现在正是干预时机。"
 syrgiannes_palaiologos: "西吉安尼斯·帕里奥洛格斯「善变者」"
 nick_the_shifting: "变幻者"
 podgreatpersons.0215.desc: "你刚获悉拜占庭帝国最臭名昭著之人的生涯即将终结。西吉安尼斯·帕里奥洛格斯的一生堪称背叛与野心的教科书：背叛两任皇帝、数位发小、撕毁条约、色诱皇后，只为权力与黄金。多次被捕后总能化敌为友……待时机成熟再度背叛。\n这位兼具军事指挥与地方治理才能的将领（尽管热衷权术），对胆识过人的$pod_cainite$领主而言颇具价值。\n现正为塞尔维亚人效力率军入侵拜占庭的他气数将尽——皇帝的和谈只是诛杀他的幌子。若有意招揽，此刻正宜行动。"
 podgreatpersons.0216.desc: "在你治下凡人们激动的窃窃私语中，你得知一场即将到来的决斗将在两位传奇剑豪之间展开——佐佐木小次郎与宫本武藏，一对宿敌。在世人眼中，小次郎显然更得人心。他风度翩翩，气质高雅，是传奇剑士富田势源的门生，目前正担任某位德高望重的大名的旗本与剑术师范。他以迅疾无匹、华贵威严的岩流剑法闻名，被誉为“西国鬼神”。尽管小次郎是名副其实的剑道大家，你却隐隐感到，这位信奉荣誉之道的剑士也许并无法战胜那位更为务实、狡猾的对手。若有细心安排，或许能说服前来见证决斗正统性的细川家家臣，在小次郎受伤之际悄然将他移送至你的面前……"
 podgreatpersons.0216.t: "佐佐木小次郎"
 podgreatpersons.0217.t: "黄真伊"
 podgreatpersons.0217.desc: "黄真伊出身私生，因而被视为贱民，纵有绝世容颜与才情也难逃世俗枷锁。为了挣脱命运的束缚，她毅然踏上了[Glossary('妓生','podgloss.kisaeng')|l]之路，成为了一位集才艺、诗才与琴艺于一身的名妓，号“明月”。\n她以倾国之貌与敏慧之心著称于士林之间，虽身份卑微，不容婚配，却仍令无数男子为之倾倒。慕名而来的男子若欲博得她青睐，须先解一道名为“点一二口，牛头不出”的谜题。此谜无人能破，也无人敢轻试其锋。黄真伊才情卓绝，亦擅创作时调，其代表作《青溪》寄托了她对远方恋人的思念与身为妓生的无尽哀愁。\n如今，她已卸下昔日名妓的身分，隐居一隅，专心著诗，远离旧日的喧嚣社交。而你，或许可以尝试，最后一次解开那道“点一二口，牛头不出”的谜题。"
 podgreatpersons.0218.t: "杨妙真"
 podgreatpersons.0218.desc: "年轻时，杨妙真是山东传奇的红袄军首领李全的妻子，也是他在沙场上的并肩战友。李全死后，杨妙真亲自接掌红袄军，率众再创赫赫战功，令蒙古人不得不册封她为山东行省。如今已是数十年过去，杨妙真隐居乡野，过着恬淡宁静的生活，养子也已被立为继承人。若是有人能找到一具可信的尸体，她的突然消失，恐怕也不会引来多少怀疑……"
 podgreatpersons.0219.desc: "自从执起兵刃之日，楠木正季便以其坚定的忠义与卓绝的谋略成为一代英杰。他是后醍醐天皇的忠实拥护者，与兄长正成并肩作战，多施奇策，于敌强我弱之势中屡创奇功。虽声望不及兄长，但正季之才情与胆识同样令人叹服。若你愿意，他当是一位忠心不二的得力臂助。如今兄弟二人奉命出征，前去迎战一支远胜己方的强敌。然而，天命未决，你尚有一线良机将这位忠勇的幼龙纳入麾下，为你所用。"
 podgreatpersons.0219.t: "楠木正季"
 podgreatpersons.0220.desc: "望月千代女作为豪族贵女、诗人，亦是甲贺忍者传奇祖师出云守的直系后裔，其自是理所当然地成为其亡夫之叔——武田信玄的耳目。在信玄庇护之下，她收留自战乱城镇与繁华市井中流离失所的孤女，亲自调教，锤炼其为间谍、破坏者与刺客的能手。传言她在日本各地部署的女忍不下三百人，皆为她所驱策。然近日武田信玄骤然身亡，死因扑朔迷离，而千代女亦随之销声匿迹，仿若人间蒸发。但你若愿意动用自身人脉，未尝不能寻得她的踪迹——如此才情，岂可轻易埋没？"
 podgreatpersons.0220.t: "望月千代女"
 podgreatpersons.0221.desc: "近来，你总是听到关于一个狡猾神秘的洋人的传言，这个人最近在附近的海岸登陆。他贪婪无厌，谎言编织如老水手擅结绳索，夸耀着自己在日本的种种功绩。他的船长威廉·亚当斯，你曾有所耳闻，而这名水手是他的同伴。至少曾是。此人名为坦佩斯特，他弃船而去，妄图借助外来商人的身份讨好日本权贵。随亚当斯乘坐白狮号登陆后，他迅速卷入各色阴暗交易，然而不久便因英属东印度公司的介入而被迫离开。虽然坦佩斯特远不及船长那般老练，但这位口若悬河的商人也许能在你的皇朝中派上用场。"
 podgreatpersons.0221.t: "暴风孔雀"
 podgreatpersons.0222.t: "洪福源"
 podgreatpersons.0222.desc: "洪福源曾在蒙古入侵高丽之际投降，随后反叛高丽朝廷。他曾亲手击杀负责守护贵族利益的将军，虽叛乱最终被镇压，但他侥幸逃脱，乞求蒙古人庇护。蒙古人任命他为[Glossary('管领归附高丽军民长官','podgloss.kwanryong_kuibu_koryo_changwan')|l]，并命其策划新一轮对高丽的入侵。\n这场战役大获全胜，促成了高丽永远臣服于蒙古的条约。然而，权谋的漩涡渐渐将洪福源卷入其中——他的妻子与高丽王子王𬘯联手设局，使他身陷囹圄。\n你的密探告知他正等待行刑的命运，而此刻正是你出手，将这位风云变幻的枭雄纳入麾下的绝佳良机。"
 podgreatpersons.0223.desc: "元朝内战渐近尾声。一个来自南方小村的匪首朱元璋，已攻占了半数中华大地，正蓄势待发，誓要将疆域扩大一倍。然而人们的目光却落在他所效忠的一位年轻皇帝身上——这位皇帝自称既是宋室正统，也是未来佛弥勒。有人说他不过是将军们手中的傀儡，但也有人无法忽视这位圣者身上那难以言喻的光辉……"
 podgreatpersons.0223.t: "韩林儿"
 podgreatpersons.0224.desc: "鄂尔多斯环地的汉人总管余子俊，素以忠诚廉正著称。他提出在北部边境修筑一系列土垣壁垒的奏议，正是成功设伏并击溃蒙古大军的关键所在。然而近日，他却沦为朝堂倾轧之下的牺牲品，已被褫夺官职。如此贤才，或许正值得你将其纳入麾下，加以重用。"
 podgreatpersons.0224.t: "余子俊"
 podgreatpersons.0225.desc: "尽管大宋皇帝富甲天下、广施恩泽，但他们在写作与书法上的才能却常显不足，便需倚仗大量#EMP 代笔#!，即女文吏，来代为撰写诗文、笔札。其中一位才思卓绝的#EMP 代笔#!，竟在相貌平平、出身寒微的情形下赢得了宋度宗的青睐，被封为昭仪，意为“光辉仪范”。\n\n宋室倾覆已多年，然而旧朝余晖未尽，昔日文苑中人依旧能从元朝某位才女身上辨认出那隐匿的旧日风华。她如今已改名换姓，鲜少著作；但坊间流传，当年北行途中，她曾于一间酒肆墙上题下一阕绝艳之曲。或许，她笔下仍残存几句未竟的诗意，只待有心人倾耳静听。"
 podgreatpersons.0225.t: "王清惠"
 podgreatpersons.0226.t: "郑道传"
 podgreatpersons.0226.desc: "朝鲜太祖是重整朝鲜的铁腕舵手，他取代了摇摇欲坠的高丽王朝。而这场变革背后的谋士，却是郑道传——一位弃佛投儒的哲人，一位编写[Glossary('朝鲜经国典','podgloss.joseon_gyeonggukjeon')]并以此为纲，确立新政大统的治国能臣。\n为了扶持太祖第八子登上大位，郑道传参与了一场宫廷密谋，意图除去太祖第五子，导致了戊寅靖社的发生。太祖目睹诸子手足相残，悲愤之下，于登基六年后便禅位于次子。\n郑道传也即将为其立场付出代价，传闻他已着手撰写绝命诗。若你欲挽救这位睿智之士，此时正是出手之机。"
 podgreatpersons.0227.t: "朱论介"
 podgreatpersons.0227.desc: "你早已留意朱论介的事迹。这位[Glossary('妓生','podgloss.kisaeng')|l]因容貌出众，引起了你幕僚的关注，她用巧计赢得了曾亲手审判她母亲的地方官崔景徽的宠爱。日本发起壬辰倭乱时，崔景徽挺身而出，试图整顿兵马守卫一方，而朱论介则始终陪伴在他左右，直至他战死沙场。\n倭军攻陷朝鲜后，将所有#EMP 妓生 #!强征至楚石楼供他们淫乐。朱论介立誓为故人复仇，遂以美色诱引倭将毛谷村六助，邀其至南江悬崖共饮共话。酒至深处，她突用双手锁住其颈，抱他一同纵身跃下江崖，同归于尽。\n她被你的幕僚从江边寻回，气若游丝，昔日容颜亦已黯淡无光。若你仍欲将她纳于麾下，此刻，便是你最后的抉择。你，是否愿意$pod_Embrace$她？"
 podgreatpersons.0228.t: "大长今"
 podgreatpersons.0228.desc: "出身寒微的长今自幼刻苦勤学，终得成为一名[Glossary('医女','podgloss.uinyo')|l]，并凭才识与仁心赢得朝鲜中宗的深切信任。虽未能在章敬王后产下储君时挽回其性命，长今却仍因其沉稳与专精被中宗亲自任命为御医。\n她以食疗之法治病，理念新颖而行之有效，屡次救君王于危疾，终使中宗得以安然辞世，寿终正寝。\n王薨之后，大长今也终于从宫中解脱，归隐林泉，潜心教授其他#italic 医女#!。然年岁不饶人，长今之身亦日渐羸弱。\n若你心有好奇，欲探究$pod_Embrace$这位大长今后她能以不凡天赋续写何等篇章，那么，现在正是前往探访的良机。"
 podgreatpersons.0230.desc: "佛门僧侣本来平平无奇，然近日一位异于常规的大德高僧却引起了你的注意。老僧名为亲鸾，乃是净土真宗的开山祖师。早在多年以前，他便以言行挑战传统佛教律制。正因其教义迅速传播，信众日增，亲鸾遂被贬谪流放，但他甚至在流放期间娶妻，公开挑战僧侣不婚的旧制。亲鸾主张众生应当一心信靠阿弥陀佛本愿，唯有佛恩，方可得度。若你愿意，一位流亡的智者可能会在你的宫廷里发挥作用。"
 podgreatpersons.0230.t: "亲鸾"
 podgreatpersons.0231.t: "金通精"
 podgreatpersons.0231.desc: "当高丽元宗屈从于忽必烈汗的威压，下令解散高丽武臣政权时，[Glossary('三別抄','podgloss.sambyeolcho')]却断然拒命，揭竿而起。\n兵力悬殊之下，这支悍勇之军转入智战，于珍岛展开游击战，袭扰港口，焚毁大元与高丽的舰队，刺探情报，搅动海疆。终因寡不敌众，义军被迫败走，只得退守小岛耽罗，由最后的#italic 三别抄 #!将领——金通精率领残部。\n若你愿意让这位桀骜不屈的领袖重燃复仇之火，现在便是契机。趁忽必烈与元宗的联军尚未扫荡耽罗，将他收归麾下。"
 podgreatpersons.0232.t: "孛儿只斤·亦怜真八剌"
 podgreatpersons.0232.desc: "为了牢控高丽，元朝屡遣宗室贵女下嫁高丽王。亦怜真八剌已与忠肃王成婚三载，然王却沉溺于高丽贤妃洪氏的温柔乡，对这位元室公主日益疏远。久而久之，被冷落的亦怜真八剌心神错乱，终至在一场宫宴之上当众与国王激烈争执。自那日起，她频频鼻血不止。\n你的幕僚收到了她一名贴身侍女的密信，请求你设法助其主子脱离忠肃王的掌控，并助她向情敌讨还此仇。你不禁揣测，亦怜真八剌是否已察觉你的真实存在？不过她的刚烈与决绝倒也使她成为一个颇具吸引力的$pod_Embrace$人选。"
 podgreatpersons.0233.t: "吾鲁思不花"
 podgreatpersons.0233.desc: "吾鲁思不花原是元朝派驻双城的军政长官，当高丽举兵收复故土之际，他迁回了咸州。途中在因公造访故人之家时，为其女崔义惠直率大胆、妩媚动人的风姿所倾倒。自此，吾鲁思不花改名为李子春，毅然投身高丽。\n他与义惠育有二子，其一李成桂继承父志，志向却囊括整个高丽。他目睹元朝气数将尽，遂欲重整山河，推行改革，奉新儒学为国本，筹谋着一个崭新的王朝——朝鲜。\n然而李子春恐难亲见爱子登基称[Glossary('朝鲜太祖','podgloss.taejo_joseon')]之日。此刻，他正陷于红巾军的突袭包围之中，生死危在旦夕。若你意欲将这位未来国君之父纳入麾下，此时正是你出手之机。"
 podgreatpersons.0234.t: "崔龙德"
 podgreatpersons.0234.desc: "龙德出身[Glossary('奴婢','podgloss.nobi')|l]，却因容貌与聪慧而被高丽禑王所宠，迅速晋升为嫔妃。她手中牌不多，却步步为营，巧妙维系着对禑王的影响力，纵使王对其他#italic 奴婢 #!也多有眷顾，她仍屹立不倒。\n当禑王妄图借大明之崛起摆脱中原宗主时，龙德失宠，被指密谋不轨，遭贬出宫。族人尽数斩首，尸骸曝晒于市。\n然而，禑王反复无常、野心勃勃，甚至在不顾群臣谏言的情况下坚持与明朝作对，他很快就会改变对龙德的看法，赦其旧罪。\n最终，禑王难逃覆灭之命，龙德再次被逐出宫廷，沦为旧日#italic 奴婢 #!，隐忍低伏只待再度崛起的良机。她如惊涛暗涌，虽命运多舛，却果决狠厉，实为一位充满潜力的$pod_Embrace$人选。如今她的地位已无足轻重，正是你出手之时。"
 podgreatpersons.0235.t: "李惠妃"
 podgreatpersons.0235.desc: "恭愍王的王后迟迟未能诞下子嗣，便劝王纳妃以续大统。恭愍王于是选中了诗人哲士李齐贤之女为妾。然而，恭愍王更偏爱艺文之道，身边常伴[Glossary('子弟卫','podgloss.jajewi')|l]，冷落后宫。久而久之，朝野皆传其阳事无能。\n为求子嗣，恭愍王竟下达骇人命令，命#italic 子弟卫 #!强迫嫔妃受孕，意图借腹得嗣。\n更令人胆寒的是，一旦妃嫔怀孕，#italic 子弟卫 #!即遭灭口，以保宫闱清誉。此等残酷命令终于激起#italic 子弟卫 #!之怒，他们密谋弑君，恭愍王命丧宫中，李惠妃也由此摆脱了屈辱命运。\n她削发为尼，遁入空门，度过了漫长岁月，亲眼见证高丽的衰亡与朝鲜的崛起。\n今她年事已高，若你意欲$pod_Embrace$这位历史的见证者，须趁她尚在人世，速作决断。"
 podgreatpersons.0236.t: "朴彭年"
 podgreatpersons.0236.desc: "朝鲜王朝的学士朴彭年曾受任于集贤殿，在世宗大王的扶持下参与了制订[Glossary('训民正音','podgloss.hunminjeongeum')]，奠定韩文正轨。\n其后受端宗擢拔，当世祖发动政变篡夺王位后，朴彭年誓死不肯承认新君的正统。尽管他曾参与策划复辟端宗，世祖仍愿网开一面，只要他肯否认叛逆之罪并口头承认新君的权威，便可获赦免。然而朴彭年宁死不屈，甚至巧妙运用自己协助创制的文字，在言语间避称君王。于是世祖将其下狱，施以酷刑。\n如今，你的密探已布下逃脱之计，若你欲$pod_Embrace$或[ghoul|E]这位耿直不屈的学者，现在便是最佳时机。"
 podgreatpersons.0237.t: "朴丘麻"
 podgreatpersons.0237.desc: "朝鲜王朝推行儒家纲常，性别隔离日益严苛，妇女的地位与命运也随之沉沦。朴丘麻便是这风潮下的牺牲者之一。因一桩通奸案，她被迫与宗亲泰江守离婚。\n但她反而借舞蹈与诗歌表达自我，声名鹊起。她的美貌、才思、机敏与风情引得无数人倾倒。但你耳中所闻的却非她的诗才，而是她那场骇人听闻的审判——涉及五十二名男子，从宗亲至奴隶皆与她有染。更令人称奇的是，她在庭上毫无惧色，既不认罪，也不低头。\n此等案件，惯常的判罚是贬为[Glossary('妓生', 'podgloss.kisaeng')]。但若你愿施以影响之手，使官府改判她死刑，便可借此机会将她$pod_Embrace$。"
 podgreatpersons.0238.t: "赵光祖"
 podgreatpersons.0238.desc: "赵光祖出身勋旧派，自幼便因醉心于儒家新学而屡遭掣肘。新学为士林派学说，恰与勋旧派分庭抗礼，争夺朝鲜命运的主导权。第二次[Glossary('士祸', 'podgloss.sahwa')|l]期间，赵光祖被贬流放为[Glossary('士人', 'podgloss.seonbi')|l]。直至燕山君被废，他方得返朝，进入成均馆。\n赵光祖才华卓著，忠诚耿耿，迅速赢得中宗的全然信赖。及第之后，他便着手推行改革：修订《乡约》，重构科举体系，强调不仅考察学识，也重视常理通达与为人品格。\n然而，也正是这项新制，让勋旧派觅得重返朝堂之机。他们乘隙离间君臣情谊，终致赵光祖在第三次#italic 士祸 #!中再度遭贬。\n即使被赐毒酒，赵光祖仍未舍弃对君王的信念，留北门常开，冀望中宗悔悟昭雪。如今，行刑兵士已在途中，你的耳目也已然就位——是否要$pod_Embrace$或[ghoul|E]这位学士，现在便须决断。"
 podgreatpersons.0239.t: "李舜臣"
 podgreatpersons.0239.desc: "投身军旅之初，李舜臣便以抵御女真入侵边疆而声名鹊起，凭其卓越的战略眼光与指挥才能，迅速赢得赞誉。未几，他升任全罗左水使，得以着手扩建水军，其苦心孤诣最终结晶为[Glossary('龟船', 'podgloss.geobukseon')|l]的创制。\n当壬辰倭乱爆发，日军大举入侵朝鲜之际，李舜臣连战连捷，屡屡击退敌军，且每战皆竭力保全将士与兵船，遂被尊为抗倭民族英雄，反观朝鲜宣祖却因软弱无能而遭人非议。\n露梁海战中，李舜臣在敌众我寡的情况下击沉并俘获几乎全部日舰，但他也重伤垂死。据你手下密探传来消息，战火未熄，乱中有隙——若欲在忠武公咽气之前将其$pod_Embrace$，此刻便是最后的良机。"
 podgreatpersons.0240.t: "郭再祐"
 podgreatpersons.0240.desc: "郭再祐因言辞激烈抨击时政，屡试不中，未能步入仕途。遂隐身山野，潜心待时。壬辰倭乱爆发之际，他挺身而出，招募义兵自成一军。凭借出奇制胜的战术，于倭寇横渡南江之时大破敌军。\n宣祖为表彰其功，亦为笼络人心，破格任命他为官。自此，郭再祐身披象征性的赤袍，亲率义兵奔赴各地抗战。\n战火熄灭，他毫发无损。敌寇传言，其赤袍曾以处女经血浸染，蕴含至阴之力，得以克制倭寇兵刃之阳煞。此说未必为真，然足以引起你的关注。\n如今，郭再祐早已封刀束袍，安享晚年，坦然以待死亡。"
 podgreatpersons.0241.t: "陈守度"
 podgreatpersons.0241.desc: "陈朝崛起的缔造者陈守度，凭借权谋之术操控幼主李昭皇 ，将其嫁予陈煚，又逼她将皇位禅让于夫，由此奠定了陈氏统治大越的根基。\n然李昭皇久未诞嗣，陈守度竟逼迫陈柳将其已怀身孕之妻顺天公主献于皇帝。此举激起陈柳兵变，皇帝亦因此而削发为僧。直至复位后，他下令诛灭所有叛军。\n自那以后，陈守度又成功抵御蒙古大军入侵，继续掌理朝政大权。如今其年事已高，正是你出面，让其忠于你的氏族之时。"
 podgreatpersons.0242.t: "安姿"
 podgreatpersons.0242.desc: "安姿是陈朝宫女之一。当蒙古大军南侵大越，守军溃败，皇族只得仓皇乘小舟出逃，欲以皇船为饵，引敌离城。然而，敌军迅速识破这拙劣的计谋，将逃亡船队团团包围。\n危急之际，陈圣宗皇帝不得不另施奇策。他以安姿绝世的容颜为赌注，将她献予侵略者首领——忽必烈汗之子脱欢，谎称她为陈氏公主。安姿那哀婉动人的姿容成功迷惑敌军，为陈军争取到宝贵时间，终使大军得以重整，将蒙古军一举歼灭。\n至于安姿在战火中所遭际遇，后人传说纷纭。如今，你的幕僚悄然将一段奇异的秘闻献至你前，声称他们寻得了那位珍枝贵叶公主。"
 podgreatpersons.0243.t: "陈兴道"
 podgreatpersons.0243.desc: "陈兴道乃是安生王陈柳之子——彼时，陈柳被迫将其怀孕之妻献于年幼的陈太宗皇帝。承载着这段屈辱家史，陈兴道投身军旅，终成为大越史上最卓著的将领之一。\n初次蒙古南侵之时，他尚任边将，侥幸存于战火之中。第二次侵略来临之际，他已执掌大越陆海军大权。虽付出惨重代价，然凭借天候之助与瘟疫肆虐敌军，他成功于红河一带击退入侵之敌。\n两年后，忽必烈汗遣其爱子脱欢再度犯境。陈兴道再展神机妙算，于白藤江设伏，摧毁四百艘蒙古战船，重挫其锋。\n今已退隐的陈大将军病体沉疴，若你有意将其$pod_Embrace$，当趁此最后时机，切莫蹉跎。"
 podgreatpersons.0244.t: "黎文休"
 podgreatpersons.0244.desc: "黎文休出身寒微，自幼聪颖过人，年仅十七便荣登科举第二甲。他由此步入仕途，历任朝廷官员、翰林学士，最终掌理国史馆，司典朝章旧录。\n凭借手中所掌史料，黎文休着手撰写一部系统性的史书——#italic 《大越史记》# is 。此书共三十[Glossary('卷','podgloss.guyen')|l]，详实记述大越之兴替，以确立大越自古即为独立之邦，与中原并列而非附庸之国。此书至今仍为陈朝巩固正统根基。\n今黎文休已近百龄，孑然隐居林泉，静候命终。如此睿智之士若就此湮没，实乃憾事，若你愿意，可将其$pod_Embrace$。"
 podgreatpersons.0245.t: "玄珍"
 podgreatpersons.0245.desc: "陈仁宗退位后，其女玄珍公主被亲兄作为外交筹码，嫁予占婆国王阇耶·僧伽跋摩三世，以换取土地扩张与政治同盟。\n然新婚未满一年，阇耶王便于重重谜团中暴毙。玄珍公主拒绝按当地风俗随夫火葬，暗中遣人召唤一位疑为其旧日情人的男子前来营救。\n这场大胆而浪漫的逃亡行动竟奇迹般地成功，二人自此人间蒸发。\n更要紧的是，你的一位密探已成功潜入这场逃亡之旅中。若你有意将这位胆识过人的女诗人$pod_Embrace$，他便可为你除去那名情郎。"
 podgreatpersons.0246.t: "莫挺之"
 podgreatpersons.0246.desc: "尽管身形孱弱、相貌丑陋，莫挺之却才华横溢，卓然不群，年少即登科第，成为最年轻的[Glossary('太学生','podgloss.thai_hoc_sinh')]。他以机敏的才思、坚贞的操守与诗文之力直陈己见，深得陈明宗皇帝赏识。\n其后诸帝亦倚重其才，遣莫挺之两度出使元朝。他的谈吐与文采在元廷中留下了深远印象，更于旅途中与高丽使节往来密切，最终与一位高丽使臣的侄女缔结连理。\n如今，这位诗人兼学者已告老还乡。若他于某次意外中悄然消失，大越或许无甚所失，但你却将收获良多。"
 podgreatpersons.0247.t: "噶忒毕"
 podgreatpersons.0247.desc: "在实皆与彬牙两国统一，缔造阿瓦王朝的动荡岁月中，掸族茂部发动残酷劫掠之际，忒毕借国王四处征讨叛乱，国都空虚之机时一鸣惊人。他专挑显贵下手，沿伊洛瓦底江展开一连串惊世骇俗的劫掠与抢劫。忒毕一度屡次脱逃，行踪飘忽，最终于1366年被德多明帕耶王麾下所擒。\n据传，国王询问应以何器械处决他时，忒毕答曰：#italic 请用您最美的王后——绍翁玛。 #!此语一出，令残暴而冷酷的国王破天荒地大笑，并赦其死罪，反而封其为将。\n但他的庇护者新近亡故，忒毕只得隐匿于野，使无数宫女侍从乃至公主为之神魂颠倒。如今你的侍从已寻得通路，若你愿意$pod_Embrace$或[ghoul|E]他，时机已至。"
 podgreatpersons.0248.t: "比娅扎代维"
 podgreatpersons.0248.desc: "梅玛内出身平民，年少时在德贡街头卖花为生。一日，叛逃在外的王子彬耶尼威路过，为她的风姿所倾倒，不顾众人劝阻将她纳为妻室。王子对梅马内的痴迷令正室塔拉米道心碎不已。\n当勃固国王彬耶乌去世后，群臣迎请流亡中的王子归国即位。但王子已深陷爱河，梅玛内此时改名娅扎代维，她誓言只要塔拉米道仍在，就绝不与王子一同加冕。借此，娅扎代维牢牢掌控了王心，终登上王后之位。塔拉米道悲愤交加，自尽身亡。娅扎代维还向王子进言，要他亲手处死唯一的儿子巴劳贾多。\n然而，如今她的幸运——或是魔咒——似已走到尽头。她正深陷一场暗杀阴谋之中。你若愿意，完全可以拨开杀机四伏的阴影，将她$pod_Embrace$或[ghoul|E]。"
 podgreatpersons.0249.t: "邓容"
 podgreatpersons.0249.desc: "在胡朝统治之下，邓容协助父亲治理顺化。当明军南下占领大越，胡朝覆亡之际，他毅然投身由陈朝遗臣发起的抗明起义，协助陈暊登上皇位，重振陈室。\n但他很快察觉皇帝受宦官操控，朝政混乱，便再次揭竿而起，废黜陈暊，使挚友重光帝陈季扩登基。可惜太平未久，明军再度大举入侵。邓容虽率军奋战，然伤亡惨重。即使大势已去，他仍不愿屈服，带领残军与侵略者周旋数年，终未能扭转败局，皇帝亦遭俘殉难。\n你的密探传来消息：这位将军已写下绝命诗，意图以死追随陛下。就趁此刻$pod_Embrace$他，莫待英魂随风散去，悔之晚矣。"
 podgreatpersons.0250.t: "婻娇潘芭"
 podgreatpersons.0250.desc: "在过去的十年中，澜沧王国陷入了永无休止的权斗旋涡，诸侯纷争此起彼伏，连你都难以理清其中脉络。自兰琴登驾崩以来，王位继承危机愈演愈烈，竟在不到十年的时间里接连有七位国王遭人暗杀。\n而这一切的幕后黑手，似乎正是那位年迈的婻娇潘芭。她的真实动机无人知晓，唯其铁石心肠与冷酷算计令人胆寒。\n她与朝廷彻底决裂，终究招来反噬。如今，她被捕入狱，与丈夫一同被缚，以待那伽将其吞噬殆尽。\n但这样一位阴沉而坚韧的老妪若得永生，恐怕会适应得比任何人都快，前提是你愿意$pod_Embrace$或[ghoul|E]她。"
 podgreatpersons.0251.t: "郑可"
 podgreatpersons.0251.desc: "郑可是黎利的挚友与谋臣，在抗击明朝，重建大越独立的战役中功勋卓著，最终获封[Glossary('行遣', 'podgloss.hanh_khien')]。在黎利驾崩后的摄政期间，郑可一度被排挤出朝，然他暗中筹谋铲除了权臣，意图独揽朝政大权。\n当幼主驾崩，阮氏英太后为年幼的黎仁宗摄政之时，郑可巧施心计，赢得年轻太后的信任，与其并掌朝纲。\n但好景不长，如今他已锒铛入狱，行将就戮。坊间传言称，他曾意图强逼太后，但朝廷并未给出正式的罪名。\n此等擅权之臣，诡谋之士，若你想据为己用，此刻正是出手之时。"
 podgreatpersons.0252.t: "信修浮"
 podgreatpersons.0252.desc: "她生于王室动荡之时，自幼卷入兄弟间的王位纷争，终在一场权力漩涡中被掳为阿瓦国王的妻后。夫君身亡后，她遁入寺院潜修，后在两位僧人的帮助下得以重返勃固故土。\n待到家族中所有男性成员自相残杀之际，命运将她推上王位。就此，她开启了王国一段前所未有的和平与安定的时期。\n七年后，她心归佛门，主动禅位于当年援手相助的僧人之一，自己则移居圣地仰光[Glossary('窣堵坡','podgloss.stupa')|l]，作为僧王继续治理国家。如今这位[Glossary('频耶陀', 'podgloss.binnya_thau')]正于佛塔中静候轮回再转，若你愿意，她也可成为你的一枚妙子。"
 podgreatpersons.0253.t: "亚扎丁坚"
 podgreatpersons.0253.desc: "亚扎丁坚一生跌宕起伏，先后辅佐了七位阿瓦国王，身兼将领与智囊之职。他起于阿瓦与勃固旷日持久的四十年战争期间，后又率军扩疆拓土。他最终在抹允叛乱引发的王位更替中脱颖而出，于内乱纷争中以智谋立足，稳固新君之权威。直至新君行事越发荒诞怪异，终于令他心生退意。\n他力挺另一位新王，以武力重建对昔日属国的统治，且抵御了一场中原来袭的侵略。\n然而，这位他誓死效忠的君主却在宫中于他的眼皮底下遭人刺杀，而他无力挽回。这一失职使他蒙受耻辱，只得黯然退隐，静待死亡降临——或是自然衰亡，亦或是你决定$pod_Embrace$他。"
 podgreatpersons.0254.t: "迪奥戈·苏亚雷斯"
 podgreatpersons.0254.desc: "随着东吁帝国的奠基者——莽瑞体王的死去，迪奥戈·苏亚雷斯的冒险旅程已近终章。那位国王死于酗酒，而将这恶习引入他生活的正是这位葡萄牙“探险家”。\n昔日，苏亚雷斯因其在印度的劫掠与杀戮而遭放逐，途中因风暴漂泊至缅甸。不久，他便结识了莽瑞体王。苏亚雷斯被其任命为将领，参与缅暹战争，却酿下惨败。\n他的最后一次罪孽是在一位富商之女婚礼当天劫走新娘，欲强娶为妻；凡试图救人者皆被他斩杀，终使新娘悲愤自尽。\n国王继位者终于将其逮捕，如今，他的宅邸已陷火海，财宝被愤怒的暴民洗劫一空。若你愿意将这名沉醉于美酒的亡命之徒纳入麾下，那就得尽快$pod_Embrace$他。"
 podgreatpersons.0255.t: "阮氏路"
 podgreatpersons.0255.desc: "阮澹是儒学大师、冷酷政客、战略巨匠，几乎凭一己之力辅佐未来的黎太祖摆脱明朝的统治。\n后却厌倦了朝堂上的谄媚与权谋，携众妻归隐乡野。\n他的继室阮氏路不仅是他谋略中的关键人物，更是他最得力的顾问之一，亦担任幼主黎太宗的启蒙导师。后来，太宗有意亲访恩师与旧情，踏入了阮澹庄园，却在次日离奇暴毙。\n阮澹矢口否认，但仍被判以[Glossary('灭族','podgloss.miezu')|l]。如此显赫之人已无法挽回，但那位被控祸水的阮氏路尚有一线生机——若你愿意重金贿赂守卫，将其$pod_Embrace$或[ghoul|E]的话"
 podgreatpersons.0256.t: "立花道雪"
 podgreatpersons.0256.desc: "作为军事奇才以及战国九州最骁勇的武士之一，立花道雪始终以赤诚之心效忠大友氏。虽晚年半身不遂，仍亲历三十七场大战与百余小役，被视作大友家最具智慧的家臣。其麾下有着亲手训练出来的四十八名精锐，\"白隼众\"，以严苛武训著称。道雪还掌握着一种独特而致命的剑术剑术[Glossary('立合见真', 'podgloss.tachiuchi_ni_myo_o_etaru')]据说蕴含非人之力。他的佩刀原名[Glossary('千鸟', 'podgloss.chidori')]，直到某日惊雷劈中他避雨的巨树，传说在电光石火间，他本能地拔剑斩裂了闪电中的雷神，从必死之境中幸存下来，遂将爱刀更名为[Glossary('雷切', 'podgloss.raikiri')]。然近日有传言说道雪已病入膏肓，死亡近在眼前。不过，如果你愿意，一次$pod_Embrace$便可挽救这位猛将。"
 podgreatpersons.0257.t: "一休宗纯"
 podgreatpersons.0257.desc: "后小松天皇与平民女子的私生子，五岁即入佛门。先后在京都安国寺、大德寺修禅，成为才华横溢却离经叛道的弟子。他唾弃体制化佛教，痛斥寺院腐败，选择云游、狂歌与醇酒而非袈裟香火。在琵琶湖舟中闻鸦啼而顿悟[Glossary('见性', 'podgloss.kensho')]后，以癫狂嘲弄传扬禅法。曾与游女纵情，尤爱盲歌女森，晚年重返大德寺。此刻高烧喘息的老僧正静候死亡，你的$pod_Embrace$不仅能拯救这位狂僧，或许还能让他在你的宫廷寻得归宿。"
 podgreatpersons.0258.t: "高师直"
 podgreatpersons.0258.desc: "出自高氏的武士，凭过人才能跻身权力中枢。作为足利尊氏的家宰，他在朝廷翻云覆雨，引发震惊全国的观应之乱。这位被公卿僧侣共同憎恶的权臣，最终被迫隐居。近日有确切传闻称上杉氏欲处决他。你大可放任这败将自生自灭，亦可赐他效忠新主的机会。"
 podgreatpersons.0259.t: "弁内侍"
 podgreatpersons.0259.desc: "画师与诗人之女，优雅跻身宫廷。作为后深草天皇的内侍司，她执掌神器和祭祀，更以细腻笔墨记录宫闱生活，成为世人窥探皇家秘辛的窗口。这位不仅是女官，更是美的守护者与帝王顾问。\n然而天皇退位后，她突然从宫廷消失。有人说她选择隐退，也有人暗示更黑暗的结局。只要你愿意动用关系，找到这位女官应当不难。"
 podgreatpersons.0260.t: "洛加威"
 podgreatpersons.0260.desc: "洛加威是一位品德高尚且精通灵性的印度婆罗门。他远渡重洋从印度来到爪哇岛，寻找毗湿奴的转世。\n他教导了被社会排斥的年轻人肯阿洛，将其从一个狡猾的盗贼首领培养成国王。他曾预言肯阿洛主人的妻子，肯德丝将诞育君王，并同时告诫肯阿洛远离她。\n然而肯阿洛无视导师的忠告，沉迷于肯德丝的美貌，杀害了主人并娶她为妻，最终统治了信诃沙里王国。\n如今洛加威年老体衰，你可以轻易安排他消失，将他据为己有。"
 podgreatpersons.0261.t: "肯·德德斯"
 podgreatpersons.0261.desc: "肯·德德斯出生在一个清贫的印度教祭司家庭。当地领主吞古尔·阿梅通爱上了她，被强掳为妻后，肯·德德斯便一直渴望着能够对他进行报复。她在吞古尔的护卫庚安洛身上找到了机会，她勾引了庚安洛，唆使他谋杀了她的绑架者。\n她在第一段婚姻所生的儿子阿努沙帕提得知生父的身份和其被害的真相后也走上了复仇的道路，他杀死了庚安洛，最终又被肯·德德斯的另一个儿子托查亚杀死。\n她据说是秉持佛教美德长大的，可谁又能断定，那些谋杀不全是她一手策划的阴谋？无论如何，如今她的子嗣大多自相残杀，且你已远离朝堂纷争，尽可自立为信诃沙里的首位女王——只愿她不会再诞下能够取而代之的子嗣。"
 podgreatpersons.0262.t: "马希沙·阿纳布朗"
 podgreatpersons.0262.desc: "马希沙·阿纳布朗是率领辛哈萨里远征帕马鲁尤王国的海军将领。经过十八年的海外征战，他带着两位帕马鲁尤公主归来，准备让她们与国王联姻。然而，他的国王克塔纳加已于前一年在贾亚卡特旺叛乱中被杀。阿纳布朗决定向克塔纳加的亲属拉登·维贾亚宣誓效忠——这位亲王不久后平定叛乱，建立了满者伯夷王国。为巩固自身地位，国王将阿纳布朗带回的两位公主纳为妻室。\n如今，满者伯夷的首次叛乱已然爆发，而作为拉登·维贾亚最新归附的忠诚追随者，马希沙·阿纳布朗的处境岌岌可危，此刻正被困在坦巴贝萨斯河附近。\n若想夺取这位忠诚的海军将领并将其$pod_Embrace$，你应当及早行动。"
 podgreatpersons.0263.t: "迪亚·哈拉尤达"
 podgreatpersons.0263.desc: "嫉妒、奸诈且野心勃勃的迪亚·哈拉尤达因偏好出身低微者而未能获得[Glossary('拉克里安·帕提', 'podgloss.rakryan_patih')]之位。她的阴谋导致满者伯夷三位英雄的覆灭：朗加·拉韦叛乱后被马希沙·阿纳布朗所杀，伦布·索拉遭流放，她还诱使国王相信首任[Glossary('拉克里安·帕提', 'podgloss.rakryan_patih')]南比背叛了贾亚纳加拉国王，致其被处死。\n满者伯夷国王贾亚纳加拉本身品行不端且热衷权谋，故纵容这些阴谋，而马哈帕提的计策帮助王国从维拉尔贾以东收复了满者伯夷东部疆域。\n然而如今满者伯夷已牢牢掌控在贾亚纳加拉手中，她的罪行正逐一败露。虽被判处凌迟极刑，你仍可暗中夺取大统领之位，并用替身与自己调包。"
 podgreatpersons.0264.t: "吉特拉·拉什米"
 podgreatpersons.0264.desc: "当哈亚姆·乌鲁克成为满者伯夷的皇帝时，他决定迎娶美丽的巽他公主吉特拉·拉什米，以巩固与西邻的联盟。当王室成员抵达特罗乌兰的布巴特广场，庆祝两国联姻结盟之际，满者伯夷的[Glossary('马哈帕蒂','podgloss.maha_patih')]加查·玛达却意图确立满者伯夷对巽他的支配地位，要求吉特拉·拉什米仅能作为妃嫔入宫。\n这一提议令王室震怒，他们拒绝受辱，准备誓死捍卫尊严。满者伯夷军队在数量上以压倒性优势远超巽他王室随行人员，即将发生的并非战斗，而是一场屠杀。\n吉特拉·拉什米——世人称之为“皮塔洛卡”——与王室大部分女性遵循[Glossary('刹帝利','podgloss.kshatriya')]精神，为避免受辱而选择自尽。\n拯救皮塔洛卡逃脱命运的时间已然所剩无几，但你或许能用替身替换这位公主。"
 podgreatpersons.0265.t: "加查·玛达"
 podgreatpersons.0265.desc: "起初，加查·玛达只是[Glossary('巴扬卡拉', 'podgloss.bhayangkara')]的一名指挥官，在拯救了贾亚纳加拉的生命后，他通过镇压叛乱崛起，并协助特丽布瓦娜女王稳固了满者伯夷帝国，最终登上了[Glossary('马哈帕提', 'podgloss.maha_patih')]之位。\n在就职时，他立下[Glossary('帕拉帕誓言', 'podgloss.sumpah_palapa')]，誓将帝国疆域扩张至涵盖整个努山达拉群岛。\n然而，他的野心终致其陨落。布巴特战役中皮塔洛卡及其家族的死亡，促使哈亚姆·乌鲁克迫使他退隐，其马哈帕提的职权也被分拆给四位不同的帕提。\n被世人遗忘的末代马哈帕提，如今正在自己的庄园中等待死亡，而你要将他纳入麾下，可谓轻而易举。"
 podgreatpersons.0266.t: "乌尔杜哈"
 podgreatpersons.0266.desc: "塔拉瓦西王国是一个奇特的国度。作为[Glossary('基纳拉克', 'podgloss.kinalakian')]族人的家园，这里是由战士公主们统治的母系社会。其中一位公主乌尔杜贾曾立誓只嫁给能在单挑中战胜她的男子。而她仍然未婚未育，因为绝大多数男性都畏惧她的武艺。\n然而，塔拉瓦西人的好客之情遍及所有来到努山塔拉北部群岛的商旅，曾游历所有穆斯林土地的航海家伊本·白图泰便曾见证此地，并在记述中提及塔拉瓦西的盛宴与繁荣景象。\n如今乌尔杜贾的时日将至，她计划入侵胡椒之岛（即她对印度的印象），但这位武士公主的远征注定难以善终。\n若你意图招揽她，或许可策划一场意外，让基纳拉基亚王国落入她妹妹的掌控之中。"
 podgreatpersons.0267.t: "坦塔拉尔"
 podgreatpersons.0267.desc: "姆普·坦塔拉尔是诗人、神学家兼哲学家，也是满者伯夷皇帝哈亚姆·乌鲁克的外甥。他坚守佛教信仰，以包容和欣赏其他信仰而闻名，并将自己的著作献给这些信仰。\n然而，他最著名的作品当属《[Glossary('卡卡温 苏塔索玛','podgloss.kakawin')]》，其中诗句“[Glossary('宾内卡 通加尔 伊卡', 'podgloss.bhinneka_tunggal_ika')]”正是出自此作，颂扬了满者伯夷帝国的文化和宗教多样性。\n尽管从未在帝国朝廷担任正式官职，他却是哈亚姆·乌鲁克的导师和私人顾问，以其哲学洞见引导满者伯夷度过群岛的印度化进程。\n如今皇帝已逝，让他消失并加入你的宫廷接受$pod_Embrace$就相对简单了。"
 podgreatpersons.0268.t: "桑·阿迪·普特拉"
 podgreatpersons.0268.desc: "桑·阿迪·普特拉是一位[Glossary('席拉', 'podgloss.silat')]大师，曾在莱当山的洞穴中冥想。当来自马六甲马来苏丹国的海军上将汉都亚前来寻访时，他同意暂缓个人内省的修行，转而训练汉都亚及其同伴。待师父认定他们学有所成后，众人返回马六甲，竟成功击退了肆虐该地区的叛军与匪徒，令[Glossary('盘陀诃罗', 'podgloss.bentahara')]大为震惊。\n修行被打断后，桑·阿迪·普特拉重返山间洞穴继续冥想。\n您的密探已寻得这位传奇人物的栖身之所，或许可以尝试征服他，将其$pod_Embrace$。"
 podgreatpersons.0269.t: "赛义德·阿里·拉赫马图拉"
 podgreatpersons.0269.desc: "赛义德·阿里·拉赫马图拉出生于占婆，其姑母嫁给满者伯夷国王克尔达威查雅后，他随迁至爪哇。此后，他开始传播伊斯兰教，并成为拉登·帕塔的导师。拉登·帕塔后来建立了群岛地区最早的苏丹国之一，淡目苏丹国。\n作为先知穆罕默德的后裔，赛义德·阿里·拉赫马图拉因其在传播伊斯兰教和巩固苏丹国方面的贡献，成为[Glossary('九圣', 'podgloss.wally_songo')]之一，并被尊称为苏南·安佩尔。他的努力促成了淡目大清真寺的建造。如今，这座宏伟清真寺的工程已经完工，苏南·安佩尔已退隐，让儿子们继承他毕生的事业。\n这位年迈的智者如今正平静地等待死亡降临，而你的介入或许能成为$pod_Embrace$他的契机。"
 podgreatpersons.0270.t: "施大姐"
 podgreatpersons.0270.desc: "曾协助郑和平定巴林冯海盗的华人施进卿之女，在父亲离世后失去了家族产业控制权，所有财富都被妹妹夺走。施大姐被迫离开巴林冯，迁居爪哇，后被满者伯夷君主任命为锦石的[Glossary('沙班达尔','podgloss.shahbander')]。一心致力于重建自己势力根基的她，大力开发锦石的港口与贸易，将其打造成该地区最大的贸易港口之一，商船航线遍及巴厘岛、文老古及柬埔寨等地。\n为推动与各苏丹国的贸易往来，她积极倡导伊斯兰教在这座岛上的传播，并依照伊斯兰教义抚育子女。其中一子——苏南·吉里日后将成为推动该岛大规模皈依伊斯兰教的关键人物。\n如今施大姐已然归隐，这位锦石港的女中豪杰正在自己的庄园中安享毕生辛劳换来的成果。若你想$pod_Embrace$她，此刻便是行动的最佳时机。"
 podgreatpersons.0271.t: "敦霹雳"
 podgreatpersons.0271.desc: "敦霹雳的职业生涯始于担任马六甲苏丹国一位极为高效的行政长官，他在抵御暹罗入侵马六甲的战役中发挥了关键作用。其卓著的策略之一是允许女性加入军队，以此激励男性士兵更奋勇作战。这场对暹罗的胜利促使苏丹任命他为[Glossary('盘陀诃罗', 'podgloss.bentahara')]。\n他对苏丹国的忠诚近乎偏执，曾辅佐四位不同的苏丹稳固疆域并开疆拓土。当苏丹之子杀害其亲生儿子时，他克制了复仇之心，转而引领苏丹国走向鼎盛。\n如今他健康状况日益衰退，其兄弟正逐步接管事务。若安排他从公众视野中隐退，你便可以方便地$pod_Embrace$他。"
 podgreatpersons.0272.t: "敦·法蒂玛"
 podgreatpersons.0272.desc: "马六甲[Glossary('盘陀诃罗', 'podgloss.bentahara')]之女法蒂玛自幼习武。当葡萄牙人首次抵达港口时，法蒂玛女扮男装，与兄弟们并肩血战，将商人与殖民者逼退至海上。苏丹既惊叹于她的武艺，又倾倒于她的美貌，决意娶她为妻。她的父亲拒绝了这门婚事，因为他早已为女儿规划了别样的人生。\n盛怒之下，苏丹屠戮了法蒂玛的全家，并强娶她为妻。为报血仇，法蒂玛从未对苏丹展露笑颜，并在至少三次堕胎后，才终于确保自己的儿子成为第一顺位继承人。\n然而，她的谋划尚未结果，葡萄牙人便卷土重来。这一次，他们忌惮敦·法蒂玛的威名，以压倒之势击溃马六甲舰队，将苏丹及其随从流放异乡。\n如今，失去权势、颠沛流离的敦·法蒂玛，正等待着你赐予她梦寐以求的力量——只需一次$pod_Embrace$。"
 podgreatpersons.0273.t: "拉克萨马纳 玛拉哈雅蒂"
 podgreatpersons.0273.desc: "身为[Glossary('拉克萨马纳','podgloss.laksamana')]之女，玛拉哈雅蒂自幼接受军事教育，并统领亚齐苏丹国的皇家卫队。当科内利斯·德·豪特曼率领的荷兰使团侮辱苏丹时，正是玛拉哈雅蒂与她麾下的寡妇军团成功抗击荷兰人并击杀了冒犯者。她牢牢掌控着亚齐海岸，驱逐了欧洲商人，并仅允许穆斯林和亚洲船只通过海峡。\n当英格兰王国试图在该地区开展贸易时，他们决定减少损失，派遣使者与苏丹和平协商协议。苏丹拒绝将如此要事托付给任何男性，因此选择了玛拉哈雅蒂作为谈判代表。\n然而，葡萄牙人却不想用英格兰那般的外交手腕，他们现已包围了玛拉哈雅蒂的舰队。\n若你希望$pod_Embrace$她，就必须派遣特工在她不可避免的覆灭前将其绑架。"
 podgreatpersons.0274.t: "赵汝适"
 podgreatpersons.0274.desc: "赵汝适是中国境内外的传奇人物。他出身宋朝旁支宗室，一路晋升，最终官至市舶司提举。\n他最卓越的成就当属《诸蕃志》。这部上下两卷的著作，以类书体例记述了华夏已知的各类文明、地域与族群。从印度尼西亚到草原部落，从印度到阿拉伯，甚至更远之地，书中皆有详尽记载。\n然而，这位伟人的生命已步入尽头。他身患重病，大概率无力回天。但或许，这并非他人生的终点。《诸蕃志》上卷详述风土人文，下卷记载物产百货。\n$pod_Embrace$他，或许会有第三卷，专门记述那些超自然之事。"