 POD_secrets.0201.t: "被啖魂的朋友，[victim.GetFirstNameNoTooltip|U]"
 POD_secrets.0201.desc: "我的挚友[victim.GetFirstName]的去世重重地压在我的心头；与我心中的空洞相比，那些前来悼念的人们以及他们的安慰根本不值一提。\n\n我仍然不敢相信[victim.GetSheHe][victim.GetDeathReasonHideKiller]，而杀死[victim.GetHerHis]的[diablerist.GetTitledFirstName]却逍遥法外。\n\n"
 POD_secrets.0201.desc.prisoner: "尽管[diablerist.GetSheHe]被关在了[murderer.GetImprisonedBy.GetTitledFirstNameNoTooltip]的地牢里，但这并不能平息我心中的怒火。"
 POD_secrets.0201.desc.free: "一想到那个畜生还逍遥法外，我就忍不住攥紧拳头，血脉偾张……这简直是对正义，以及[ROOT.Char.GetFaith.HighGodName]的侮辱。"
 POD_secrets.0201.a: "总有一天我会为你复仇，我的朋友……"
 POD_secrets.0201.b: "血痕到此结束。"