 PODquincunx.260.t: "来自幽冥的消息：刺链地狱的终末"
 PODquincunx.260.desc: "五行宗创建后，[GetTrait('kueijin').GetName( GetNullCharacter )]攻击了多科尔汗在原玄武皇朝的领地，切断了他的污浊之气的来源，这使得他的对手，其中包括让达和斗姆，能够消灭他，并将该地狱的领域划分入自己的领地。"
 PODquincunx.260.option.a: "纪元之轮在转动。"
 podkueijin.240.t: "神体"
 podkueijin.240.desc: "一类新的功法，圣体的派生——神体——应运而生。"
 podkueijin.240.a: "一个有趣的发展。"
 podkueijin.240.a.tt: "所有[GetTrait('kueijin').GetName( GetPlayer )]解锁[shintai_lifestyle|E]。"