 PODquincunx.100.t: "来自中国的消息"
 PODquincunx.100.desc: "一位信使来到了你这，带来了来自东方的消息。\n在一份寄给白虎皇朝大帝达的卷轴中，剩余的真正玄武皇朝$pod_wan_kuei$称其皆放弃了天庭之光和[UmbraGlossaryLocalized('yomi_wan','幽冥')]之暗。\n这封信证实了前一派系的合法性，这使得白虎和黄帝皇朝呼吁所有具有影响力的老祖在三年后前来大会，以评估局势。"
 PODquincunx.100.option.a: "我该去么？"
 PODquincunx.110.t: "来自中国的消息：群龙大会"
 PODquincunx.110.desc: "诸老祖在长安附近的少林寺举行了大会，它宣布洋人，特别是那些该隐人，应该为五大至尊皇朝的垮台负责。\n作为回应，他们将建立一个新的组织——五行宗。它将由对应五大方位的新皇朝组成：北方的血之皇朝，东方的肉之皇朝，南方的粦之皇朝，西方的骨之皇朝，和中央的玉之皇朝。"
 PODquincunx.110.option.a: "新秩序诞于中国。"
 PODquincunx.201.t: "朱雀皇朝的命运"
 PODquincunx.201.desc: "玄武和黄帝皇朝的$pod_wan_kuei$对你的皇朝进行着压迫，让你清除所有是否涉及恶鬼事物的$pod_wan_kuei$，莫须有证据。是时候轮到你决定朱雀的命运了，与北人的皇朝分割，宣布为新的皇朝。还是听从他们的命令，保持团结。"
 PODquincunx.201.option.a: "宣布独立。"
 PODquincunx.201.option.b: "清除所有[UmbraGlossaryLocalized('yomi_wan','幽冥')]眷族。"
 PODquincunx.200.t: "朱雀皇朝的终末"
 PODquincunx.200.desc: "朱雀皇朝一直与中国的皇朝隔绝，所以当他们决定不参加五行宗大会也不足为奇。\n随着新纪元的到来，他们决定将自己改名为黄金皇朝，以保持其独立性。"
 PODquincunx.200.option.a: "纪元之轮在转动。"
 PODquincunx.210.t: "来自中国的消息：青龙皇朝的终末"
 PODquincunx.210.desc: "日本鬼子与大陆$pod_hungry_dead$之间的脸皮已经被撕开。在所谓的天蛇屠杀中幸存朝鲜万鬼最终南下，帮助形成了五行宗。朝鲜/日本的青龙皇朝已经不复存在，被与五行宗结盟的朝鲜绿之皇朝和日本天照族裔所分割。"
 PODquincunx.210.option.a: "纪元之轮在转动。"
 PODquincunx.220.t: "来自中国的消息：黄帝皇朝的终末"
 PODquincunx.220.desc: "对王宏本大帝的刺杀使金玉社会四分五裂，让黄帝皇朝陷入分裂。由于蒙古征服的破坏和对同族是崇魔恶鬼的莫须有举报，情况更加恶化。\n随着五行宗条约的签订，黄帝皇朝现已改革为玉之皇朝。"
 PODquincunx.220.option.a: "纪元之轮在转动。"
 PODquincunx.230.t: "来自中国的消息：白虎皇朝的终末"
 PODquincunx.230.desc: "在范女帝放弃了她的职位后，白虎皇朝分裂成了相互争斗的派系，大帝达试图实现和平的尝试失败了。\n在蒙古人和来自玄武皇朝的恶鬼带来的一大片破坏之后；幸存者加入了新成立的五行宗。\n白虎皇朝已不复存在。"
 PODquincunx.230.option.a: "纪元之轮在转动。"
 PODquincunx.240.t: "来自中国的消息：玄武皇朝的终末"
 PODquincunx.240.desc: "当明朝军队进攻哈拉和林时，来自各大至尊皇朝的共十几家屋室为了复仇而来到这座城市，夜间的战斗持续了数个星期。最后，被恶鬼侵扰的玄武皇朝不复存在：那些仍未被腐蚀的人加入了五行宗，其他的人则被置于火炬或剑下。"
 PODquincunx.240.option.a: "纪元之轮在转动。"
 podkueijin.510.a: "诚实是金。"
 podkueijin.510.b: "小谎怡情。"
 podkueijin.1199.desc_qiao: "你不断地参悟天地给予了一些成果。\n\n"
 podkueijin.1102.t: "$art_train_header$瓶颈"
 podkueijin.1102.desc: "你已经努力训练并获得了成果，但你有一种耿耿于怀的感觉，即你可以做得更好，所以也许你应该再逼自己一下，但也许反而会导致你退步。"
 podkueijin.1102.a: "我不会逼自己。"
 podkueijin.1102.b: "我会逼自己。"
 kueijin_scheme.300.t: "投射负能量"
 kueijin_scheme.300.desc: "将你所有的内疚、挫折、愤怒和饥渴注入你的心神，然后将这种负面灵能像刀子一样射入[recipient.GetNamePossessive]的灵魂。"
 kueijin_scheme.300.a: "感受吾痛！"
 podkueijin.1199.desc_tan: "你不断的实验新材料给予了一些成果。\n\n"
 podkueijin.210.t: "失控"
 podkueijin.210.desc: "你已然乏气，也许是你是阳属万鬼所以比其他万鬼更容易感到饥渴，又或者你没能掌握阴阳流转所以只能使用一属的气。总之到了现在这地步，你失去了控制并疯一般的冲入了人群去取得些气……"
 podkueijin.210.a: "真是羞耻。"
 podkueijin.211.t: "气乏"
 podkueijin.211.desc: "如果$pod_wan_kuei$费尽了体内所有的气，那其将会崩塌腐化，于此状态下使用气时（不论是使用[discipline|E]或者是维持自身状态），他损失健康作为替代，直到最后油尽灯枯灰飞烟灭。"
 podkueijin.211.a: "我需要气！"
 podkueijin.220.t: "气机制设置"
 podkueijin.220.desc: "你将能选择当动用时先用哪属气，以及食气时是否过亢。"
 podkueijin.220.a: "先消耗：#bold 阴气#! / 阳气 / 随机"
 podkueijin.220.b: "先消耗：阴气 / #bold 阳气#! / 随机"
 podkueijin.220.c: "先消耗：阴气 / 阳气 / #bold 随机#!"
 podkueijin.220.d: "当食气时：#bold 不过亢#! / 过亢"
 podkueijin.220.e: "当食气时：不过亢 / #bold 过亢#!"
 podkueijin.220.f: "确认"
 podkueijin.230.t: "心法精进"
 podkueijin.230.desc: "由于你的心法等级已经很高深，现在每一次进阶都会提升你的气德，所以现在你必须选择你想扩展的气德的阴阳。"
 podkueijin.230.a: "皆阴。"
 podkueijin.230.b: "皆阳。"
 podkueijin.230.c: "并皆。"
 podkueijin.231.t: "云开雾散"
 podkueijin.231.desc: "虽然许多人声称在凡间里已经没有罗汉了，但有一些禁忌书籍却保持反对，说仍然有少数大彻大悟的存在体在世上徘徊。虽然他们应该飞升（而且很多人确实这样做了），但少数人却选择留在中原。尤其是魔虎，他们的罗汉正在等待[sixth_age|E]的到来……"
 podkueijin.231.a: "吾亦欲驻留。"
 podkueijin.231.b: "吾亦欲飞升。"
 podkueijin.250.t: "第五纪元"
 podkueijin.250.desc: "纪元之轮已经转到了下一纪元，随着新纪元的到来，进食变得更困难，气变得更稀少，开悟需要更长时间。\n\n$godbody_valid$"
 podkueijin.250.a: "黑暗纪元。"
 podkueijin.500.skip: "下次吧"
 podkueijin.501.a: "有事就莽。"
 podkueijin.501.b: "有事就怂。"
 podkueijin.502.a: "你有的是时间。"
 podkueijin.502.b: "宣扬你的愤怒。"
 podkueijin.503.a: "至死不渝。"
 podkueijin.503.b: "大爱无疆。"
 podkueijin.504.a: "你够了。"
 podkueijin.504.b: "你还能有更多。"
 podkueijin.505.a: "你有理想。"
 podkueijin.505.b: "时间在我们这边。"
 podkueijin.506.a: "总有其他路。"
 podkueijin.506.b: "坚持你的路。"
 podkueijin.507.a: "冤冤相报何时了。"
 podkueijin.507.b: "此仇不报非君子。"
 podkueijin.508.a: "钱无紧要。"
 podkueijin.508.b: "没钱万事空。"
 podkueijin.509.a: "你可以相信其他人。"
 podkueijin.509.b: "你不能相信任何人。"
 podkueijin.511.a: "你是只是个普通人。"
 podkueijin.511.b: "你是独特的。"
 podkueijin.512.a: "王子犯法，与庶民同罪。"
 podkueijin.512.b: "刑不上大夫。"
 podkueijin.513.a: "慢慢来。"
 podkueijin.513.b: "寸金难买寸光阴。"
 podkueijin.514.a: "适可而止。"
 podkueijin.514.b: "及时行乐。"
 podkueijin.515.a: "信任是关键。"
 podkueijin.515.b: "宁我负人，毋人负我！"
 podkueijin.516.a: "遵从心法。"
 podkueijin.516.b: "心法随意。"
 podkueijin.517.a: "为善。"
 podkueijin.517.b: "为己。"
 podkueijin.517.c: "让世界感受痛苦。"
 podkueijin.1221.t: "与最尊贵的黑珠女士，影之母的会面"
 podkueijin.1221.desc: "你遇到了骨花的罗汉，她看起来也像一个16岁的女孩。她很难找到，而且被一群强大的追随者和他们召唤的灵类仆人所守护，但她还是愿意与那些设法找到她的人分享她的智慧。她的真诚愿望是尽可能多地保存知识，为即将到来的[sixth_age|E]做准备。"
 podkueijin.1221.a: "这是我的荣幸。"
 podkueijin.1311.t: "与百鹤老母的会面"
 podkueijin.1311.desc: "你遇到了腾龙的罗汉，她是笑雨派的直接创始人，也是所有其他教派的间接创始人。她坚持在凡间生活，每四年更换一次闭关地点。她仍然经常与心法的追随者就开悟问题进行磋商，尽管这些天她宁愿与低级的耆那交谈，也不愿与上官交谈。"
 podkueijin.1311.a: "这是我的荣幸。"
 kueijin_scheme.310.t: "受射负能量"
 kueijin_scheme.310.desc: "[owner.GetName]所有的内疚、挫折、愤怒和饥渴像刀子一样射入注入你的心神！"
 kueijin_scheme.310.a: "啊啊！"
 podkueijin.300.superhugecost: "增加这搜索要求会耗费极度旁大的威望作为代价。"
 podkueijin.1199.desc_wu_tan: "你不断的感悟元素给予了一些成果。\n\n"
 kueijin_scheme.120.eccentric: "我想将其性格反转为怪客。"
 godbody_valid: "[GetPlayer.Custom( 'godbody_valid' )]"
 godbody_valid_dharma10: "因为你有[GetTrait('dharma10').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]。"
 godbody_valid_dharma9: "因为你有[GetTrait('dharma9').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到[sixth_age|E]。"
 godbody_valid_dharma8: "因为你有[GetTrait('dharma8').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1650年。"
 godbody_valid_dharma7: "因为你有[GetTrait('dharma7').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1600年。"
 godbody_valid_dharma6: "因为你有[GetTrait('dharma6').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1550年。"
 godbody_valid_dharma5: "因为你有[GetTrait('dharma5').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1450年。"
 godbody_valid_dharma4: "因为你有[GetTrait('dharma4').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1350年。"
 godbody_invalid: "[godbodies_lifestyle|E]现在对你不可见，你可以保留你目前的技能，但你不能再在[godbodies_lifestyle|E]中取得进展。"
 podkueijin.260.t: "灵性成分已毁"
 podkueijin.260.desc: "任何父母的血统多么特殊，半鬼人就是半鬼人。[GetTrait('kueijin').GetName( GetPlayer )]之血的力量要么压制了其他任何遗传到的灵性成分，要么让孩子死在子宫里。"
 podkueijin.260.a: "我的配种计划毁了。"
 POD_nushi_duties.100.t: "来自灵主的一项小任务"
 POD_nushi_duties.101.desc: "惩罚那个在我的圣像上乱涂乱画的不虔诚学徒。"
 POD_nushi_duties.100.a: "简单。"
 POD_nushi_duties.100.a.tt: "你获得一项新决议。"
 POD_nushi_duties.100.b: "找别人做这些杂事。"
 POD_nushi_duties.110.t: "来自灵主的一项重要任务"
 POD_nushi_duties.111.desc: "防止西方饮血者玷污神圣的神庙。"
 POD_nushi_duties.110.a: "当然。"
 POD_nushi_duties.110.b: "抱歉，没时间。"
 POD_nushi_duties.120.t: "来自灵主的一项关键任务"
 POD_nushi_duties.121.desc: "去[UmbraGlossaryLocalized('yomi_wan','幽冥')]的[UmbraGlossary('hell_of_being_skinned_alive')]，把阎魔女皇斗姆的项链带给我。"
 POD_nushi_duties.121.a: "我偷斗姆？行吧。"
 POD_nushi_duties.121.b: "我偷斗姆？不要！"
 POD_nushi_duties.1000.t: "剥皮地狱"
 POD_nushi_duties.1000.desc: "如果说天底下还有比[UmbraGlossary('hell_of_being_skinned_alive')]更糟糕的地方，那还真没人找到过。一眼望去，该这地狱就像沙漠星球的地表。了解天文学知识的访客把这里的地形比作火星表面。还有人说，它结合了中原所有最恶劣的沙漠地形。这一点并不重要，因为斗姆的扭曲世界比其中任何一个都要糟糕，或者说比所有这些加在一起都要糟糕。"
 POD_nushi_duties.1000.a: "可怕。"
 POD_nushi_duties.1000.b: "跟回家了一样。"
 POD_nushi_duties.1001.t: "斗姆之子"
 POD_nushi_duties.1001.desc: "这不是你该来的地方——滚。\n块状的、驼背的、黑铁的、红眼的，一半是人形的自动装置，一半是昆虫的生物拦住了你。"
 POD_nushi_duties.1001.a: "我会通过的。"
 POD_nushi_duties.1001.b: "您好，我有一份要事要交给斗姆。"
 POD_nushi_duties.1002.t: "斗姆：钢铁女皇"
 POD_nushi_duties.1002.desc: "万鬼在[UmbraGlossaryLocalized('yomi_wan','幽冥')]有一个比任何人都可怕的敌人，她的名字叫斗姆。\n斗姆是阎魔中最恶毒的一位，正是这种仇恨让她如此接近魔帝的宝座。 钢铁女皇是迄今为止最著名的阎魔女皇，这也许是因为她不像其他阎魔那样以各种面目传播邪恶，而是始终以同样的方式出现：身着精致的铁甲，头戴角质面具，十八只手臂上各戴着利爪般的铠甲。她的黑色长发从坚硬的面具后披散下来，这是她唯一允许自己有的人性化部分。"
 POD_nushi_duties.1002.a: "隐蔽是关键。"
 POD_nushi_duties.1002.b: "障眼法！"
 POD_nushi_duties.1003.t: "成功"
 POD_nushi_duties.1003.desc: "你悄声无息得到了项链，是时候回到凡间了。你在心里咒骂给你提出如此危险要求的灵主。"
 POD_nushi_duties.1003.a: "我的皮没被剥掉。"
 intrigue_greater_than_recipient: "我的谋略属性大于[recipient.GetFirstNamePossessive]"
 diplomacy_greater_than_recipient: "我的外交属性大于[recipient.GetFirstNamePossessive]"
 stewardship_greater_than_recipient: "我的管理属性大于[recipient.GetFirstNamePossessive]"
 martial_greater_than_recipient: "我的军事属性大于[recipient.GetFirstNamePossessive]"
