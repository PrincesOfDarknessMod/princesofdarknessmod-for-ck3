l_simp_chinese:
 podkueijin.1.t: "一位合适的继承人？"
 podkueijin.1.desc: "你的仆人带着他们所能找到的[Glossary('饿殍','game_concept_kuei_jin_desc')]回来了。他们中的一些人比其他人更有才华，但也需要更多的手段来束至你的仪式。无论如何，这仍然是一场赌博，在做出选择之前，你没有时间亲自检查他们，因为你给他们的突然关注会吸引敌人的注意。"
 podkueijin.1.a: "我不需要能力太出众的人。以免他们成为威胁……"
 podkueijin.1.a.tt: "新的继承人将出现，可将其看作你自己的子嗣。"
 podkueijin.1.b: "这一个至少看起来还行。"
 podkueijin.1.c: "我们会对这位保持密切关注。"
 podkueijin.1.d: "要就要最好的。"
 podkueijin.200.t: "精神崩溃：失衡"
 podkueijin.200.desc: "[GetTrait('kueijin').GetName( GetNullCharacter )]必须精心调控体内阴阳二气的平衡。阴气过盛会导致鬼人的外观极度近似于尸体或者非人，与之相对，阳气过盛可能导致多种致命的血族疾病爆发。"
 podkueijin.200.a: "一世过度自私的惩罚。"
 podkueijin.200.b: "永欲之罚"
 podkueijin.200.c: "我将凝阴气入体，以求稍复平衡。"
 podkueijin.300.t: "一位合适的继承人？"
 podkueijin.300.desc: "你叫你的侍从搜索在你的领地周围的魑魅（近期归来的$pod_kueijin$）的信息，你已经准备了必要的材料来举办使其他们成为䰢的仪式。一些信息被收集到了，你可以指定更多的要求以深入探索，但越是具体，代价就越高。\n首先，你想要一些刚从[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]转生回来的古人，还是一些失去所有人性并唤醒了其心魔的“[GetTrait('shih').GetName( GetPlayer )]”那些堕落的狩魔人虽更为罕见，但显然在死后仍保留着部分技能。"
 podkueijin.300.a: "不必太过讲究。"
 podkueijin.300.b: "我需要一位曾经的狩魔人。"
 podkueijin.310.desc: "在这个时代，无论多么年轻的人都难免一死，所以这对你的侦察兵来说不会增加多少难度。"
 podkueijin.310.a: "青年男人"
 podkueijin.310.b: "中年男人"
 podkueijin.310.c: "老年男人"
 podkueijin.310.d: "青年女人"
 podkueijin.310.e: "中年女人"
 podkueijin.310.f: "老年女人"
 podkueijin.321.desc: "美丑本由观者定……而这次你说了算。你可以让侦察队按你的特定标准寻找人选。\n幸运的是，从地狱归来的$pod_kueijin$会摆脱导致死亡的躯体状态，甚至有人发现自己明显变得更年轻或许这是他们心中“理想自我”的模样。这种奇异现象的具体原因至今仍是学者争论的话题。"
 podkueijin.321.a: "一个重生的貂蝉。"
 podkueijin.321.b: "倾国倾城之貌。"
 podkueijin.321.c: "美貌总无坏处。"
 podkueijin.321.d: "普普通通"
 podkueijin.322.desc: "智慧如何？心法开悟绝非易途，更非愚者可行之路。\n尽管[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]能高效筛除本不该复生之徒，但它也是公平的试炼。即使目不识丁的农夫，面对此般磨难时也可能展现出圣贤般的智慧。"
 podkueijin.322.a: "我要一个当代诸葛亮！"
 podkueijin.322.b: "配得上我聪明的人。"
 podkueijin.322.c: "有些聪明才智，总是有用的。"
 podkueijin.322.d: "普普通通"
 podkueijin.323.desc: "健壮如何？然某些[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]偏好精神折磨，但多数至少会掺杂肉体刑罚。归来的$pod_kueijin$此时也处于狂乱状态，意味着他们会本能地将体能逼至极限。\n\n某些[Glossary('心法','podgloss.dharma')]如魔虎会刻意培养这种原始力量，而白骨之流等则会在后期转向心智修行。"
 podkueijin.323.a: "给我找个关老爷般的猛将！"
 podkueijin.323.b: "力量确实重要。"
 podkueijin.323.c: "体格健壮就足够了。"
 podkueijin.350.t: "一位合适的弟子"
 podkueijin.350.desc: "你的仆从已为你寻得最符合条件的人选，此刻正是让这雏儿领悟[Glossary('心法','podgloss.dharma')]，成为您门徒的良机。\n刚从[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]的恐怖中挣脱的新生$pod_kueijin$，往往以狂乱之态现世，危及自身与周遭。\n[Glossary('幼鬼太傅','podgloss.infantdevilcivilizer')]的职责，便是寻获这些初生的怪物，必要时加以制服，再引渡回其所属朝廷。朝廷中将举行镇魂仪式，平息$pod_kueijin$体内暴戾的魄，使其重归礼法之序。\n唯有完成这一切，真正的心法修习才能开始。"
 podkueijin.350.a: "开始心法平复祭礼吧。"
 podkueijin.400.t: "[Glossary('心法','podgloss.dharma')]教育：平衡"
 podkueijin.400.desc: "东方血族根据自身阴阳能量的比例分为三大类型。阴阳差异越大，血族的个性特征就越显著。\n\n阴属死亡能量，通常冷酷无情；阳属生命能量，温暖却时而暴烈。年轻的[Glossary('鬼人','game_concept_kuei_jin|E_desc')]往往难以维系这两种相斥能量的平衡，尽管某些[Glossary('心法','podgloss.dharma')]主张失衡之道，但初涉者很难掌握其中关窍。因此他们通常会被其中一种能量彻底压制，直至最终自行领悟其中玄机。\n\n你的弟子眼下正遭受哪种失衡之苦？"
 podkueijin.400.a: "显性阳亢，躁动不安"
 podkueijin.400.b: "阴气过盛，孤僻避世"
 podkueijin.401.t: "[Glossary('心法','podgloss.dharma')]教育：方向"
 podkueijin.401.desc: "大多数$pod_kueijin$都会被分配到一个“方位”，这是他们在亡生中需要履行的特定职责。上官们认为，通过方位与[Glossary('心法','podgloss.dharma')]的恰当结合，每个$pod_kueijin$都能发现自己的整体宿命。\n在许多皇朝中，方位的分配是一项重大仪式。$pod_kueijin$占卜师们会仔细查阅预言典籍，研究新生$pod_kueijin$经历转生时的星象，以确定其天命所归的方位。\n北方的$pod_kueijin$是传统的守护者和执行者，担任鬼人与凡人社会的裁判官、行刑者和法官。\n西方的$pod_kueijin$研究灵魂世界，担任气的信使与守护者；必要时，他们也会充当间谍和刺客。\n东方的$pod_kueijin$是“收割者”阶层，负责确保凡人“牧群”的和谐与健康；必要时，他们会扮演煽动者的角色。\n南方的$pod_kueijin$是“火鸟”，其职责是推动纪元之轮的变化，并率领鬼人投入战斗。\n中央的$pod_kueijin$研究魂与魄、阴与阳、鬼人及其他超自然永恒博弈，其职责是揭示——或创造——超自然存在的奥秘超自然存在的奥秘。\n\n你的弟子最终被分配到了哪个方位？"
 podkueijin.401.a: "北"
 podkueijin.401.b: "东"
 podkueijin.402.t: "[Glossary('心法','podgloss.dharma')]教育：[Glossary('屋室','podgloss.wu')]"
 podkueijin.402.desc: "在$pod_kueijin$社会中，这种志同道合者自然互助的理念构成了其社交互动与身份认同的基础层面。他们通常以五人为单位（传统上称为\"[Glossary('屋室','podgloss.wu')]\"）组成团体。[Glossary('屋室','podgloss.wu')]作为$pod_kueijin$在重生后的替代家庭而存在。\n由五名$pod_kueijin$（分别代表五个方位）组成的[Glossary('屋室','podgloss.wu')]被视为最吉祥和谐的数字配置；然而许多[Glossary('屋室','podgloss.wu')]会增减成员数量，或混合不同方位的成员。\n\n屋室并非终身制，像你弟子这样的年轻新成员通常会被安排加入\"见习[Glossary('屋室','podgloss.wu')]\"，与其他新$pod_kueijin$共同踏出第一步。由于这并非真正的长期屋室（尽管可能发展为长期关系），该安排完全由你掌控。你可以择重点培养他们在特定领域的能力。"
 podkueijin.402.a: "你将作为我的使者行事。"
 podkueijin.402.b: "协助我统御这片疆域。"
 podkueijin.403.t: "[Glossary('心法','podgloss.dharma')]教育：结束"
 podkueijin.403.desc: "在古代，教育䰢需要十年时间，而今世道纷乱，两年已成常态。\n你的弟子如今已堪为$pod_kueijin$社会所用，对其[Glossary('心法','podgloss.dharma')]的领悟足以压制狂性。是时候让他们独自寻求顿悟之机，或辅佐你处理实务了。\n他们将成坚定盟友还是死敌？且待时间揭晓答案。"
 podkueijin.403.a: "这世界正静候你的登场。"
 podkueijin.110.t: "阴阳"
 podkueijin.110.desc: "阴气较多的万鬼是强大负能量的汇聚体，他们理智，冷静，残忍。\n阳气较多的万鬼则与之相反，贪婪的吞噬生命能量，他们是热情的生物，亲近凡人并富有情感。\n少数万鬼的能量是平衡的，他们的躯体同时保持着生与死的力量，二者和谐共处。"
 podkueijin.110.a: "我倾向于阴。"
 podkueijin.110.b: "我倾向平衡。"
 podkueijin.110.c: "我倾向于阳。"
 podkueijin.120.t: "气"
 podkueijin.120.desc: "This [Glossary('Wheel of Ages','podgloss.wheelofages')] turns by the interactions of Yin and Yang, represented by the divine Ebon Dragon and Scarlet Queen. Energies of creation permeate the world, flowing to and from the Yin and [Glossary('Yang Worlds','game_concept_yang_world_desc')]. Called Chi, this energy flows through and among all the Ten Thousand Things.\n\nLike Kindred, Wan-Kuei suffer from hunger. When a Wan-Kuei has five or fewer Chi points (of either sort) in their body, they becomes hungry.\n\nA Wan-Kuei's Chi Virtues indicate how much of a given type of Chi the Wan-Kuei may safely channel through her body. The Wan-Kuei is easily capable of ingesting more temporary Chi than her Chi Virtues indicate (a permanent imbalance allows to ingest more Chi of that type without ill effects). However, a Wan-Kuei who abuses this practice runs the risk of an imbalance - a dangerous 'overdose' of Chi. Wan-Kuei with none of a particular type of Chi in her body is thrown in an automatic state of temporary imbalance too."
 podkueijin.120.a: "吾气长存"
 podkueijin.200.a.tt: "你对阴的偏移使得你逐渐变丑并且成为猎巫人的潜在目标。"
 podkueijin.201.t: "僵尸"
 podkueijin.201.desc: "僵尸是彻头彻尾的怪物，无论如何都无法混入人群。僵尸肉体会慢慢变成病态的灰色，而骨头则变成漆黑色。皮肤起皱并压缩在骨头周围。獠牙变长并滴落毒液，黑色的尖刺从背部、关节和肋骨处长出来。整个身体发出磷光，闪烁着阴性能量。"
 podkueijin.201.a: "我是个怪物中的怪物"
 podkueijin.1011.a: "我当然会参加。"
 podkueijin.1011.b: "我就勉为其难参加一下吧。"
 podkueijin.1011.c: "很遗憾，我很忙。"
 podkueijin.1012.desc: "我在此邀请你参加我在[barony.GetNameNoTier]举办的庆典！这将会是一场盛会，值得你光临。"
 podkueijin.1013.desc: "我在此邀请你参加我在[barony.GetNameNoTier]的宫廷举办的庆典！这将会是一场盛会，有令人愉快的‘甜点’和娱乐。"
 podkueijin.1010.desc: "我不知道你为什么接受我的邀请却反而去参加[other_host.GetTitledFirstNamePossessive]的庆典，但我会记住这件事的。"
 podkueijin.1010.a: "真是不幸。"
 podkueijin.1011.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 podkueijin.1011.opening_desc: "我特此邀请你参加我在[barony.GetNameNoTier]举办的庆典！"
 podkueijin.1011.host_likes_me: "我期待你的光临，你要是不来我会非常想你的。"
 podkueijin.1011.host_gets_along_with_me: "如果你这样一位显赫的[ROOT.Char.GetTitleTierName]能出席，会让我倍感荣幸。"
 podkueijin.1011.host_dislikes_me: "我期望所有有影响力的人都能出席，很不幸也包括你。"
 podkueijin.1011.d: "不，我拒绝！"
 podkueijin.1012.a: "这是我的荣幸。"
 podkueijin.1012.b: "我有更重要的事要处理。"
 podkueijin.1013.a: "这是我的荣幸。"
 podkueijin.1013.b: "我有更重要的事要处理。"
 podkueijin.1021.t: "庆典：令人愉快的聚会"
 podkueijin.1021.desc: "宾客们聚集在大厅，他们都是领地远近的名人。\n\n情绪多么明亮，精神多么高涨，庆典开始了！"
 podkueijin.1021.a: "欢迎，朋友们！"
 podkueijin.1021.a.tt: "庆典开始了"
 podkueijin.1022.t: "热烈欢迎"
 podkueijin.1022.likes_host: "所有客人都已到大厅集合，而我们彬彬有礼的东道主，[activity.GetOwner.GetTitledFirstName]，欢迎我们前来赴席！"
 podkueijin.1022.dislikes_host: "所有客人都已到大厅集合，而我们[activity.GetOwner.Custom('InsultAdjective')]东道主[activity.GetOwner.GetTitledFirstName]，总算来欢迎我们了。"
 podkueijin.1022.a.gregarious: "我等不及要和大家交谈了！"
 podkueijin.1022.a.shy: "这里有很多人……"
 podkueijin.1022.a: "我十分期待！"
 podkueijin.1022.b: "这最好值得我花时间。"
 podkueijin.1041.t: "庆典：当我的客人们离开时"
 podkueijin.1041.desc: "随着所有人返回他们各自的家，我可以很自豪地说，庆典非常成功！"
 podkueijin.1041.spouse: "\n\n我非常感谢我的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))][spouse.GetFirstName]让这场活动如此成功，当[spouse.GetSheHe]送别最后几位宾客离开时，我感到无限感激。"
 podkueijin.1041.no_spouse: "不管怎样，我仍然庆幸这场让我殚精竭虑的活动目前终于结束了。"
 podkueijin.1041.a: "下次再见！"
 podkueijin.1042.t: "庆典：回家"
 podkueijin.1042.desc: "真是一场盛典啊！将来很长一段时间内我都会记得在[host.GetTitledFirstNamePossessive]的大厅度过的美好时光。\n\n现在是时候洗去‘甜点’的痕迹，重拾我身为超自然世界领主的责任了。"
 podkueijin.1042.a: "再见，[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]！"
 podkueijin.1090.t: "放弃责任"
 podkueijin.1090.desc: "这简直是灾难！\n\n在我做好一切准备后，我的客人却来到了一场没有东道主的庆典！\n他们已经回家了，而我也给他们留下了极其糟糕的印象。"
 podkueijin.1090.a: "我可能会后悔的。"
 podkueijin.1091.t: "惨淡的庆典"
 podkueijin.1091.desc: "真是不敢相信。尽管我发出邀请并做了准备，没有一个客人出现在我的庆典上。\n\n没关系！我将独自享受这些‘甜点’，而大厅里的回荡的脚步声是我仅需的同伴！"
 podkueijin.1091.a: "我真的就是这样的孤家寡人吗？"
 podkueijin.1091.b: "我感觉有些宽慰。"
 podkueijin.1092.t: "庆典：缺席"
 podkueijin.1092.desc: "丑闻！[activity.GetOwner.GetTitledFirstName]居然没在[activity.GetOwner.GetHerHis]自己举办的庆典上现身！\n\n[activity.GetOwner.GetSheHe]是想要戏耍我们所有人吗？"
 podkueijin.1092.a: "真是浪费时间！"
 podkueijin.1093.t: "庆典：庆典结束"
 podkueijin.1093.desc: "随着[host.Custom2('MyCharacterIntroduction', ROOT.Char)]突然暴毙，[host.GetHerHis]的庆典也告终。\n\n闷闷不乐的客人们渐渐离场，我默默祈祷，希望[ROOT.Char.GetFaith.HighGodNameAlternate]能像[host.GetFirstName]热情地欢迎我们来到[host.GetHerHis]的大厅那样，将[host.GetSheHe]迎入[ROOT.Char.GetFaith.PositiveAfterLife]。"
 podkueijin.1093.a: "庆典结束了。"
 podkueijin.1094.desc: "由于我现在被扔进了铁牢，我筹划的盛大庆典也得取消了。哎，我花了那么多小时在准备工作上面……全泡汤了！"
 podkueijin.1095.desc: "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U]被囚禁，[host.GetHerHis]的盛大庆典也被迫中止。真是时运不济啊！"
 podkueijin.1101.t: "$art_train_header$胡言乱语"
 podkueijin.1101.desc: "你在你收集的奇怪书籍中寻找灵感，当其中一本吸引了你的注意力，它是由一些西方作家写的。有一句话，他们说东方的吸血鬼用“愿你生活在有趣的时代”作为一种辱骂……但是，这啥意思？"
 podkueijin.1101.a: "这没啥意义。"
 podkueijin.1101.b: "我将会这句话翻译为“愿你投个好胎”。"
 podkueijin.1501.t: "转生生日：最好的赠礼"
 podkueijin.1501.desc: "随着门童宣布着他们作为礼物的奇珍异宝，客人们一个接一个地进来了，其中最特别的是[friendly_guest.GetFirstNameNoTooltip]的，真正闻所未闻。"
 podkueijin.1501.a: "非常棒！"
 podkueijin.1601.t: "龙舟赛：开始"
 podkueijin.1601.desc: "龙舟赛开始了，划手被分为两队，红和黑，你可以小赌一下哪队会赢。"
 podkueijin.1601.a: "红队。"
 podkueijin.1601.b: "黑队。"
 podkueijin.1201.t: "$trek_header$打了小的"
 podkueijin.1201.desc: "你在野外行走时，一个年轻的猎魔人拦住了你。你胆敢接受这挑战吗？"
 podkueijin.1201.a: "我会给你好看。"
 podkueijin.1201.b: "我该逃了。"
 podkueijin.1301.t: "$mortal_business_header$卜算"
 podkueijin.1301.desc: "你擅长一切占卜技巧和预兆解读，根据你的技能等级，你也许能在凡人中建立起一个繁荣的产业链。"
 podkueijin.1301.a: "我会读手相。"
 podkueijin.1301.b: "我懂得一些紫微斗数。"
 podkueijin.1301.c: "我能预测天命。"
 kueijin_scheme.100.t: "吞魂"
 kueijin_scheme.100.desc: "你能看到受害者的灵魂被吸纳进入了你的第三眼。现在你将选择对其做啥。"
 kueijin_scheme.100.a: "净化灵魂。"
 kueijin_scheme.100.b: "折磨该灵魂。"
 kueijin_scheme.100.c: "吞噬该灵魂！"
 kueijin_scheme.110.t: "灵魂的净化"
 kueijin_scheme.110.desc: "受害者的灵魂已在你掌控中，你可以开始净化灵魂了。"
 kueijin_scheme.110.a: "我尝试回复其丧失的心法。"
 kueijin_scheme.110.b: "我尝试恢复目标损失的人性。"
 kueijin_scheme.120.t: "灵魂的折磨"
 kueijin_scheme.120.desc: "你在折磨灵魂时，还可以随意揉捏塑形对方的天性。"
 kueijin_scheme.120.craven: "我想将其性格反转为怯懦。"
 kueijin_scheme.120.brave: "我想将其性格反转为勇敢。"
 kueijin_scheme.120.wrathful: "我想将其性格反转为暴怒。"
 kueijin_scheme.120.calm: "我想将其性格反转为冷静。"
 kueijin_scheme.120.lustful: "我想将其性格反转为色欲。"
 kueijin_scheme.120.chaste: "我想将其性格反转为忠贞。"
 kueijin_scheme.120.ambitious: "我想将其性格反转为野心勃勃。"
 kueijin_scheme.120.content: "我想将其性格反转为安于现状。"
 kueijin_scheme.120.lazy: "我想将其性格反转为懒惰。"
 kueijin_scheme.120.diligent: "我想将其性格反转为勤勉。"
 kueijin_scheme.120.stubborn: "我想将其性格反转为固执。"
 kueijin_scheme.120.fickle: "我想将其性格反转为多变。"
 kueijin_scheme.120.vengeful: "我想将其性格反转为睚眦必报。"
 kueijin_scheme.120.forgiving: "我想将其性格反转为宽宏大量。"
 kueijin_scheme.120.greedy: "我想将其性格反转为贪婪。"
 kueijin_scheme.120.generous: "我想将其性格反转为慷慨。"
 kueijin_scheme.120.shy: "我想将其性格反转为害羞。"
 kueijin_scheme.120.gregarious: "我想将其性格反转为合群。"
 kueijin_scheme.120.deceitful: "我想将其性格反转为狡诈。"
 kueijin_scheme.120.honest: "我想将其性格反转为诚实。"
 kueijin_scheme.120.arrogant: "我想将其性格反转为傲慢。"
 kueijin_scheme.120.humble: "我想将其性格反转为谦卑。"
 kueijin_scheme.120.arbitrary: "我想将其性格反转为专断。"
 kueijin_scheme.120.just: "我想将其性格反转为公正。"
 kueijin_scheme.120.impatient: "我想将其性格反转为急躁。"
 kueijin_scheme.120.patient: "我想将其性格反转为耐心。"
 kueijin_scheme.120.gluttonous: "我想将其性格反转为暴食。"
 kueijin_scheme.120.temperate: "我想将其性格反转为节制。"
 kueijin_scheme.120.paranoid: "我想将其性格反转为多疑。"
 kueijin_scheme.120.trusting: "我想将其性格反转为轻信他人。"
 kueijin_scheme.120.cynical: "我想将其性格反转为愤世嫉俗。"
 kueijin_scheme.120.zealous: "我想将其性格反转为狂热。"
 kueijin_scheme.120.callous: "我想将其性格反转为冷酷。"
 kueijin_scheme.120.sadistic: "我想将其性格反转为虐待狂。"
 kueijin_scheme.120.compassionate: "我想将其性格反转为慈悲。"
 kueijin_scheme.130.t: "灵魂的融合"
 kueijin_scheme.130.a: "我可汲取其知识，"
 kueijin_scheme.130.b: "我可窥探其记忆。"
 kueijin_scheme.200.t: "植入情感"
 kueijin_scheme.200.desc: "你进行了一次无声的感情植入，可以让[recipient.GetName]心内充斥恐惧，愉悦，痛苦或者其他感情，[recipient.GetName]被此类情绪支配并以此行动。"
 kueijin_scheme.200.a: "我给予了让其个性提升的情绪。"
 kueijin_scheme.200.b: "我给予了让其个性降低的情绪。"
 kueijin_scheme.210.t: "哪类个性？"
 kueijin_scheme.210.desc: "选择一项来提升。"
 kueijin_scheme.210.a: "胆量。"
 kueijin_scheme.210.b: "怜悯。"
 kueijin_scheme.210.c: "精力。"
 kueijin_scheme.210.d: "贪婪。"
 kueijin_scheme.210.e: "荣誉感。"
 kueijin_scheme.210.f: "理性。"
 kueijin_scheme.210.g: "社交力。"
 kueijin_scheme.210.h: "记仇。"
 kueijin_scheme.210.i: "狂热。"
 kueijin_scheme.220.t: "哪类个性？"
 kueijin_scheme.220.desc: "选择一项来降低。"
 kueijin_scheme.220.a: "胆量。"
 kueijin_scheme.220.b: "怜悯。"
 kueijin_scheme.220.c: "精力。"
 kueijin_scheme.220.d: "贪婪。"
 kueijin_scheme.220.e: "荣誉感。"
 kueijin_scheme.220.f: "理性。"
 kueijin_scheme.220.g: "社交力。"
 kueijin_scheme.220.h: "记仇。"
 kueijin_scheme.220.i: "狂热。"
 kueijin_scheme.130.desc: "你可噬取受害者魂魄，将其与己身融合，这一行为将永久减去你一级[Glossary('心法','podgloss.dharma')]，除非你的修行[Glossary('心法','podgloss.dharma')]是魔虎啸或者侍奉[Glossary('阎魔王','podgloss.yamaking')]。吞食他人的灵魂可以获得目标的记忆和知识。受害者立刻死去。"
 podkueijin.1502.t: "转生生日：最差的礼物"
 podkueijin.1502.desc: "随着门童宣布着他们作为礼物的奇珍异宝，客人们一个接一个地进来了，但你不该邀请[unfriendly_guest.GetFirstNameNoTooltip]来着，因为[unfriendly_guest.GetSheHe]竟然胆敢给你送钟！"
 podkueijin.1502.a: "你好大的胆子！"
 podkueijin.1510.t: "转生生日：桃太郎"
 podkueijin.1510.desc: "在庆典中途，当你切开寿桃的时候，你发现其中竟然有个男孩！"
 podkueijin.1510.a: "嗯……真香！"
 podkueijin.1510.b: "把这桃太郎给我赶出去。"
 podkueijin.1602.t: "龙舟赛：优势"
 podkueijin.1602.desc: "赛者们拼命划船，抵抗着汹涌的河浪和强风向前冲。你选的队伍已经领先其他队伍好几龙头了，这很不错……"
 podkueijin.1602.a: "增大赌注。"
 podkueijin.1602.b: "保持赌注。"
 podkueijin.1603.t: "龙舟赛：劣势"
 podkueijin.1603.desc: "赛者们拼命划船，抵抗着汹涌的河浪和强风向前冲。你选的队伍已经落后其他队伍好几龙头了，这很糟糕……"
 podkueijin.1603.a: "增大赌注。"
 podkueijin.1603.b: "保持赌注。"
 podkueijin.1604.t: "龙舟赛：胜利"
 podkueijin.1604.desc: "就像离弦的箭一样，龙舟互相追赶着，而你选的队伍赢了！"
 podkueijin.1604.a: "我就知道我有好眼光。"
 podkueijin.1605.t: "龙舟赛：败北"
 podkueijin.1605.desc: "就像离弦的箭一样，龙舟互相追赶着，而你选的队伍输了。"
 podkueijin.1605.a: "这偶尔会发生。"
 art_train_header: "功法训练："
 podkueijin.1199.t: "$art_train_header$训练结果"
 podkueijin.1199.desc_shintai: "你与他人不断的比武和比拼给予了一些成果。\n\n"
 podkueijin.1199.desc_chi_arts: "你不断的与体外之气的协调给予了一些成果。\n\n"
 podkueijin.1199.desc_soul_arts: "你不断的修心养性给予了一些成果。\n\n"
 podkueijin.1199.desc_demon_arts: "你不断的叩问心魔给予了一些成果。\n\n"
 podkueijin.1199.desc_no_focus: "你迅速的转变重心给予了一些奇怪的成果……\n\n"
 podkueijin.1199.desc_good: "你的功法提升了如此之多。"
 podkueijin.1199.desc_good_bad: "你的功法颇有增长。"
 podkueijin.1199.desc_same: "你悟得了一点皮毛。"
 podkueijin.1199.desc_bad_good: "你用力过度，反而让你心魔趁虚而入。"
 podkueijin.1199.desc_bad: "你运功出错，导致心魔被彻底引出。"
 podkueijin.1199.desc_fallback: "也许你啥都没提升。"
 podkueijin.1199.a: "不错。"
 podkueijin.1199.a.ex: "我将使用我的[Glossary('心法','podgloss.dharma')]经验来提升更多！"
 podkueijin.1199.b: "就这样吧。"
 podkueijin.1199.b.ex: "我将使用我的[Glossary('心法','podgloss.dharma')]经验来突破瓶颈！"
 podkueijin.1199.c: "比什么都没有强。"
 podkueijin.1199.c.ex: "我将使用我的[Glossary('心法','podgloss.dharma')]经验获得更多。"
 podkueijin.1199.d: "我将抵抗。"
 podkueijin.1199.d.ex: "我将使用我的[Glossary('心法','podgloss.dharma')]经验来平稳这。"
 podkueijin.1199.e: "它来了……"
 podkueijin.1199.e.ex: "我将使用大量[Glossary('心法','podgloss.dharma')]经验来避免这。"
 trek_header: "荒野跋涉："
 podkueijin.1202.t: "$trek_header$来了老的"
 podkueijin.1202.desc: "看上去那学徒的导师就在近处，他从你那里救出了徒弟，并避免与你厮杀，即是你伤害了他徒弟。[GetTrait('shih').GetName( GetPlayer )]难得地表现出了克制。"
 podkueijin.1202.a: "又一个找死的。"
 podkueijin.1299.t: "$trek_header$从荒野归来"
 podkueijin.1299.desc_opening: "你结束了你的冒险，回到家中休息。\n\n"
 podkueijin.1299.desc_good: "你的宏伟事迹被传播了出去，他们开始尊敬你。"
 podkueijin.1299.desc_good_bad: "已经有了一些关于你的故事了，褒义的。"
 podkueijin.1299.desc_same: "没人知道你做了什么，就像你从未出去过。"
 podkueijin.1299.desc_bad_good: "已经有了一些关于你的故事了，贬义的。"
 podkueijin.1299.desc_bad: "你的丢人事迹被传播了出去，这将影响你的威望。"
 podkueijin.1299.desc_fallback: "出于某种原因，你的事迹未被记录……"
 podkueijin.1299.a: "好极了。"
 podkueijin.1299.a.ex: "找一些说书的，每个人都得知道我的传奇！"
 podkueijin.1299.b: "善。"
 podkueijin.1299.b.ex: "不！我得找些人为我传扬！"
 podkueijin.1299.c: "行吧。"
 podkueijin.1299.c.ex: "行吧，我总是欢迎一些片面的好谣言。"
 podkueijin.1299.d: "我宁愿他们少指望我。"
 podkueijin.1299.d.ex: "这可能很糟，若我们没有故事的“另个版本”……"
 podkueijin.1299.e: "让他们说，我不在乎。"
 podkueijin.1299.e.ex: "我会找些人来为我洗名。"
 mortal_business_header: "凡人之间："
 podkueijin.1399.t: "$mortal_business_header$从凡尘回归"
 podkueijin.1399.desc_opening: "在于凡人之间生活了一段时间后，你决定回到你的世界，正所应当的与他们不相往来。\n\n"
 podkueijin.1399.desc_good: "在这过程中，你轻易地获得了一大笔财富。"
 podkueijin.1399.desc_good_bad: "你在过程中获得了相当多的资源。"
 podkueijin.1399.desc_same: "你因你的工作获得了一笔钱。"
 podkueijin.1399.desc_bad_good: "你既没得也没支出。"
 podkueijin.1399.desc_bad: "你损失了一笔钱。"
 podkueijin.1399.desc_fallback: "你的账本显示出了一些奇怪的数字……"
 podkueijin.1399.a: "我有钱了！"
 podkueijin.1399.b: "越多越好。"
 podkueijin.1399.c: "比什么都没有强。"
 podkueijin.1399.d: "嗯……"
 podkueijin.1399.e: "可耻的表现。"
 podkueijin.1601.c: "我不感兴趣。"
 podkueijin.1202.b: "让他们走吧。"
 POD_darkling_mirror.001.t: "暗黑镜像"
 POD_darkling_mirror.001.desc: "通过你对培心功法的掌握，你能将你的心魔斩出体外作为一位邪恶仆从。"
 POD_darkling_mirror.001.option.a: "出来吧，我的心魔！服侍我。"
 POD_darkling_mirror.001.option.a.tt: "你尝试斩出你的心魔。"
 POD_darkling_mirror.001.option.a.desc: "与你心魔的斗争"
 POD_darkling_mirror.001.option.a.tt.success: "你的心魔被成功斩出"
 POD_darkling_mirror.001.option.a.tt.failure: "你没能斩出你的心魔"
 POD_darkling_mirror.001.option.b: "还不到时候"
 POD_darkling_mirror.001.option.b.tt: "你将放弃斩出心魔的想法"
 POD_darkling_mirror.002.t: "暗黑镜像（二）"
 POD_darkling_mirror.002.desc: "通过你对培心功法的掌握，你成功将你的心魔斩出体外，现在可以给它下达命令了。"
 POD_darkling_mirror.002.option.a: "我的专属妖魔"
 POD_darkling_mirror.002.option.a.tt: "你的心魔被成功斩出"
 POD_darkling_mirror.003.t: "暗黑镜像（二）"
 POD_darkling_mirror.003.desc: "即使以是你目前对培心功法的掌握，也不足以斩出你的心魔体……目前而言。"
 POD_darkling_mirror.003.option.a: "我还没准备好"
 POD_darkling_mirror.003.option.a.tt: "你没能斩出你的心魔"
 POD_darkling_mirror.death_management.t: "心魔回归"
 POD_darkling_mirror.death_management.desc: "你斩出的心魔受到了意外，并不得不回归。"
 POD_darkling_mirror.death_management.option.a: "我的邪恶回归了"
 POD_darkling_mirror.death_management.option.a.tt: "你的身外心魔和你又是一人了"
 podkueijin.1211.t: "$trek_header$珍稀动物"
 podkueijin.1211.desc_opening: "你正在无人之处跋涉，突然间你见到了一群"
 podkueijin.1211.desc_white_deer: "白鹿"
 podkueijin.1211.desc_rhinoceros: "犀牛"
 podkueijin.1211.desc_panda: "熊猫"
 podkueijin.1211.desc_snub_nosed_monkey: "金丝猴"
 podkueijin.1211.desc_ending: "在附近，抓取这等珍兽肯定会给你带来威望。"
 podkueijin.1211.a: "我会抓到它们。"
 podkueijin.1211.b: "让它们走吧。"
 podkueijin.1211.desc_green_peafowl: "绿孔雀"
 podkueijin.1211.a.success: "我成功了。"
 podkueijin.1211.a.failure: "我失败了。"
 podkueijin.1199.desc_qiao: "你不断地参悟天地给予了一些成果。\n\n"
 podkueijin.1102.t: "$art_train_header$瓶颈"
 podkueijin.1102.desc: "你已经努力训练并获得了成果，但你有一种耿耿于怀的感觉，即你可以做得更好，所以也许你应该再逼自己一下，但也许反而会导致你退步。"
 podkueijin.1102.a: "我不会逼自己。"
 podkueijin.1102.b: "我会逼自己。"
 kueijin_scheme.300.t: "投射负能量"
 kueijin_scheme.300.desc: "将你所有的内疚、挫折、愤怒和饥渴注入你的心神，然后将这种负面灵能像刀子一样射入[recipient.GetNamePossessive]的灵魂。"
 kueijin_scheme.300.a: "感受吾痛！"
 podkueijin.1199.desc_tan: "你不断的实验新材料给予了一些成果。\n\n"
 podkueijin.210.t: "失控"
 podkueijin.210.desc: "你已然乏气，也许是你是阳属万鬼所以比其他万鬼更容易感到饥渴，又或者你没能掌握阴阳流转所以只能使用一属的气。总之到了现在这地步，你失去了控制并疯一般的冲入了人群去取得些气……"
 podkueijin.210.a: "真是羞耻。"
 podkueijin.211.t: "气乏"
 podkueijin.211.desc: "如果[Glossary('万鬼','game_concept_kuei_jin_desc')]费尽了体内所有的气，那其将会崩塌腐化，于此状态下使用气时（不论是使用$pod_discipline$或者是维持自身状态），他损失健康作为替代，直到最后油尽灯枯灰飞烟灭。"
 podkueijin.211.a: "我需要气！"
 podkueijin.220.t: "气机制设置"
 podkueijin.220.desc: "你将能选择当动用时先用哪属气，以及食气时是否过亢。"
 podkueijin.220.a: "先消耗：#bold 阴气#! / 阳气 / 随机"
 podkueijin.220.b: "先消耗：阴气 / #bold 阳气#! / 随机"
 podkueijin.220.c: "先消耗：阴气 / 阳气 / #bold 随机#!"
 podkueijin.220.d: "当食气时：#bold 不过亢#! / 过亢"
 podkueijin.220.e: "当食气时：不过亢 / #bold 过亢#!"
 podkueijin.220.f: "确认"
 podkueijin.230.t: "[Glossary('心法','podgloss.dharma')]精进"
 podkueijin.230.desc: "由于你的[Glossary('心法','podgloss.dharma')]等级已经很高深，现在每一次进阶都会提升你的气德，所以现在你必须选择你想扩展的气德的阴阳。"
 podkueijin.230.a: "皆阴。"
 podkueijin.230.b: "皆阳。"
 podkueijin.230.c: "并皆。"
 podkueijin.231.t: "[Glossary('云开雾散','podgloss.hundredclouds')]"
 podkueijin.231.desc: "虽然许多人声称在凡间里已经没有[Glossary('罗汉','podgloss.arhat')]了，但有一些禁忌书籍却保持反对，说仍然有少数大彻大悟的存在体在世上徘徊。虽然他们应该飞升（而且很多人确实这样做了），但少数人却选择留在中原。尤其是魔虎，他们的[Glossary('罗汉','podgloss.arhat')]正在等待[Glossary('第六纪元','game_concept_sixth_age_desc')]的到来……"
 podkueijin.231.a: "吾亦欲驻留。"
 podkueijin.231.b: "吾亦欲飞升。"
 podkueijin.250.t: "第五纪元"
 podkueijin.250.desc: "[Glossary('纪元之轮','podgloss.wheelofages')]已经转到了下一纪元，随着新纪元的到来，进食变得更困难，气变得更稀少，开悟需要更长时间。"
 podkueijin.250.a: "黑暗纪元。"
 podkueijin.1221.t: "与最尊贵的黑珠女士，影之母的会面"
 podkueijin.1221.desc: "你遇到了骨花的[Glossary('罗汉','podgloss.arhat')]，她看起来也像一个16岁的女孩。她很难找到，而且被一群强大的追随者和他们召唤的灵类仆人所守护，但她还是愿意与那些设法找到她的人分享她的智慧。她的真诚愿望是尽可能多地保存知识，为即将到来的[Glossary('第六纪元','game_concept_sixth_age_desc')]做准备。"
 podkueijin.1221.a: "这是我的荣幸。"
 podkueijin.1311.t: "与千鹤母的会面"
 podkueijin.1311.desc: "你遇到了腾龙的[Glossary('罗汉','podgloss.arhat')]，她是笑彩虹的直接创始人，也是所有其他教派的间接创始人。她坚持在凡间生活，每四年更换一次闭关地点。她仍然经常与[Glossary('心法','podgloss.dharma')]的追随者就开悟问题进行磋商，尽管这些天她宁愿与低级的耆那交谈，也不愿与上官交谈。"
 podkueijin.1311.a: "这是我的荣幸。"
 kueijin_scheme.310.t: "受射负能量"
 kueijin_scheme.310.desc: "[owner.GetName]所有的内疚、挫折、愤怒和饥渴像刀子一样射入注入你的心神！"
 kueijin_scheme.310.a: "啊啊！"
 podkueijin.1199.desc_wu_tan: "你不断的感悟元素给予了一些成果。\n\n"
 kueijin_scheme.120.eccentric: "我想将其性格反转为怪客。"
