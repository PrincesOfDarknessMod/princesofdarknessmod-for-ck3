 podkueijin.300.c: "领主[Glossary('艾玛·欧','podgloss.emmao')]将赐予我一名[Glossary('泉津','podgloss.shikome')]。"
 podkueijin.351.desc: "你的仆人带来了你的主上[Glossary('艾玛·欧','podgloss.emmao')]的最新赏赐，此刻正是让这雏儿领悟[Glossary('心法','podgloss.dharma')]，成为您门徒的良机\n刚从[Glossary('断绝','podgloss.kakuri')]的恐怖中挣脱的新生[Glossary('泉津','podgloss.shikome')]，往往以狂乱之态现世，危及自身与周遭。\n[Glossary('幼鬼太傅','podgloss.infantdevilcivilizer')]的职责便是降伏并教导她们，让她们明晓自身被赋予的崇高使命。\n待其恢复神智后，需举行仪式以平息[Glossary('泉津','podgloss.shikome')]体内暴戾的魄，使其再度适应文明生活。\n唯有完成这一切，方可开始正统的法教学识传授，将这位新至的[Glossary('艾玛·欧','podgloss.emmao')]虔诚信徒锻造成黑暗大名的绝美利器。"