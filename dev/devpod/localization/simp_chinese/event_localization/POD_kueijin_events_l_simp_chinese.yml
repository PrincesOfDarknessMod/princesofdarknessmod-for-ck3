 podkueijin.240.t: "神体"
 podkueijin.240.desc: "一类新的功法，圣体的派生——神体——应运而生。"
 podkueijin.240.a: "一个有趣的发展。"
 podkueijin.240.a.tt: "所有[GetTrait('kueijin').GetName( GetPlayer )]解锁[shintai_lifestyle|E]。"
 podkueijin.10.t: "[Glossary('心法','podgloss.dharma')]危机"
 podkueijin.10.desc: "[Glossary('心法','podgloss.dharma')]之择非必永恒。多数$pod_kueijin$初择一道，后弃之另寻他途，甚或重归原道。亡生所予选择，远胜凡人一世，然此中抉择从非表象之简。\n无论如何，代价难免：旧有[Glossary('心法','podgloss.dharma')]等级尽失，鬼神需启新道途，前阶荣光尽泯。若其亡生未逾五十载，此败尚可谅，仅受训诫而非大辱。"
 podkueijin.10.a: "追随你的本能"
 podkueijin.10.b: "我无恙……"
 podkueijin.200.b.tt: "你与阳之过近，酿成血族疫病之源。"
 passion_bloodflowers_extra_cost_tt: "虽然说炽血花未明文禁止男性修习其[Glossary('心法','podgloss.dharma')]，但试图点化男性仍被视为粗鄙之举。"
 kj_education_wait_tt: "寻访弟子之事即将展开，预计耗时数月。"
 podkueijin.400.c: "他目前保持着惊人的平衡。"
