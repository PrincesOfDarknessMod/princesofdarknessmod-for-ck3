 POD_shadow_self.death_management.t: "失去你自我的一部分"
 POD_shadow_self.death_management.desc: "噩耗传来，你的暗影分身，你自己灵魂的一部分，已经死亡。你能感觉到内心的可怕空虚。看来分裂你的存在终究会带来后果。"
 POD_shadow_self.death_management.option.a: "又一个化为尘土的"
 POD_shadow_self.death_management.option.a.tt: "你的暗影分身死了"
 POD_demon_regalia.1.t: "魔装"
 POD_demon_regalia.1.desc: "魔装会以怪物般的变异或超自然武器的形式呈现，其力量源泉来自[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]。\n需注意，尽管以下特性按地狱主题分类，但$pod_kueijin$并不会因其逃脱的地狱类型而被限制获取特定特性。事实上，随着力量的增长，以及他们对自身业债的认知愈发清晰和复杂，这些饿殍会展现出远超其曾受折磨之地的特性。"
