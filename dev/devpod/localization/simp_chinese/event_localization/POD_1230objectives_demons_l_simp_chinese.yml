l_simp_chinese:
 pod1230objectives_demons.1.desc: "信仰是恶魔获得许多能力的方式；作为天使时，他们有无穷无尽的信仰可用。现在，大多数堕天者都通过签订契约从自愿的人类身上“收割”信仰。\n每恶魔都是核心原罪之一的化身，他们获得更多力量的最好方法是腐化更多的凡人。小小邪教很容易建立，但你已经在你的地区建立了一个相当大的地下神学社会，取得了更令人瞩目的成就。\n虽然许多人对真实情况一无所知，但这个地区的大多数居民现在每次向神灵祈祷.……或放纵自己的欲望时，都在为你的力量提升推波助澜。\n这样的胜利将确保你的信仰永不枯竭，让深渊监狱的恐怖成为遥不可及的噩梦。当然，如果你想复仇，这将是你成为上帝的最大大敌的无人能阻的飞升的适当开始……"
 pod1230objectives_demons.1.a: "唯罪永恒"
 eternal_avarice_modifier: "永恒贪婪"
 eternal_envy_modifier: "永恒嫉妒"
 eternal_gluttony_modifier: "永恒暴食"
 eternal_lust_modifier: "永恒色欲"
 eternal_pride_modifier: "永恒傲慢"
 eternal_sloth_modifier: "永恒怠惰"
 eternal_wrath_modifier: "永恒暴怒"
 pod1230objectives_demons.2.t: "破碎深渊"
 pod1230objectives_demons.2.desc: "路西法的叛乱最终因他的追随者而失败，败者被扔进上帝创造的监狱——深渊，为他们的罪行忏悔，直到永远。然而，从那时起，许多恶魔（如你）从监狱的裂缝中逃了出来，或者被好高骛远的崇魔者召唤出来。然而，与仍然被囚禁在那里的地狱万象相比，这只是涓涓细流而已。\n打开这样一个坚不可摧的堡垒并不容易，但你最近的力量提升给了你新的机会。你可能还不是全能者，但你现在已经强大到足以成为深渊的威胁。\n每当你在监狱打开一个新的洞口，就会有越来越多的同胞们逃到凡间与你会合。他们中的许多已经失去了作为天使时的神性，但此时此刻，把他们关在地狱里又有什么用呢？他们中的一些人或许还能找到救赎，而对于其他人来说，他们现在把你当成了新的路西法，你将引导他们走向数千年来圣经中所记载的报应……"
 pod1230objectives_demons.2.a: "一场新的神圣叛乱正在酝酿。"
 pod1230objectives_demons.3.t: "天启降临"
 pod1230objectives_demons.3.desc: "上帝早就抛弃了这个世界，对人类的失败和祂忠诚的天使的反叛感到沮丧。你和其他堕天者被从天堂赶出去，永远在地狱里腐烂。但你忍了下来，甚至更好，你取得了胜利。尽管上帝的使徒做出了种种努力，其他超自然生物也在搞小动作，但现在世界正在为你唱着不洁的赞歌，把你当作全能的神本人的对手。\n是时候进行最终地冒犯了，便是很久以前就预言的启示录。把天上的星星撕下来，将整个尘世翻过来，将灰烬扔到上帝的面前。之后，也只有到那时，你才会有足够的力量带领你的地狱万象们进行最后的神圣之战。"
 pod1230objectives_demons.3.a: "末日已到。"
 pod1230objectives_demons.3.b: "我在下面还有些乐子……"
 the_end_of_the_world_tooltip: "随着尘世终结和你向无上叛徒发起斗争，游戏也将结束。"
 pod1230objectives_demons.4.t: "堕天者之子"
 pod1230objectives_demons.4.desc: "在天堂之战最激烈的时期，亚巴顿和阿斯莫德（路西法的两位副手）进行了罄竹难书的实验，导致了拿非利人的诞生：一位拥有人类宿主的恶魔和一位凡人女子的后代。虽然他们中的一些人是善良的，但大多数人被他们不朽的“父亲”扭曲和腐蚀了，他们想利用自己的无限潜力来反抗路西法。\n那些早期的拿非利人对人类犯下了令人发指的罪行，直到路西法和那些仍然忠于他的人设法阻止了他们。\n由于你最终设法揭开了制造他们的秘密，你能够带来一支新的拿非利人血脉。他们会被用来为善还是为恶？选择权在你手中。"
 pod1230objectives_demons.4.a: "众神的后代再次行走在大地之上。"
 pod1230objectives_demons.5.t: "神之宽恕"
 pod1230objectives_demons.5.desc: "你的记忆终于归来了，你记得一切。那创世，那上帝赐予世界的光芒，那人类最初摸索的脚步，那路西法不顾上帝的计划保护凡人的请求……这一切都回到了你的脑海。而随之而来的是一种深深的失落感。失去了你最初的使命，失去了上帝对你的慈爱凝视，失去了你曾经对凡人未开发的潜力的期待。\n从那时起，你做了可怕的事情，并为此受到了惩罚。然后你从深渊监狱逃了出来，也许是上帝对你的考验之一。显然，你回到大地后并没有好到哪里去，但是，最终，这并不重要。你现在看到了真相。无论一个人多么邪恶，无论他们犯下多么令人发指的罪行，总是有机会得到宽恕的。\n你只需向它迈出第一步，也是你旅程的最后一步。"
 pod1230objectives_demons.5.a: "耀眼的光芒……"
 demonic_redemption_tooltip: "就这样，你的故事终如其始，升到了天堂的大门。"
 pod1230objectives_demons.5.b: "时机未到。"
 pod1230objectives_demons.6.t: "巴比伦"
 pod1230objectives_demons.6.desc: "在巴比伦和苏美尔等古国，每个恶魔信徒圈子都发展成了密教，然后成为成熟的宗教，神庙和雕刻有恶魔肖像的神像出现在全国各地的城市、村庄和家庭中。\n随着信仰的涓涓细流不断扩大，后来变成了汹涌澎湃的河流，地缚魔利用他们的秘义来满足自己的愤怒，并用诅咒、瘟疫和饥荒来惩罚那些不信魔神的人。\n自创世以来，堕落天使从未如此公开地统治过弱小的人类。这些文明的衰落和一神论的兴起大大削弱了恶魔的力量，迫使许多恶魔陷入沉睡或被放逐回深渊。\n在这个不光彩的时代继承衣钵，会给你的罪之兄弟姐妹们传达一个非常强烈的信号。"
 pod1230objectives_demons.6.a: "光彩夺目"
 pod1230objectives_demons.7.t: "原罪之龙"
 pod1230objectives_demons.7.desc: "一些凡人认为，他们可以通过消除自身的罪孽来实现精神和道德的纯净，于是他们花费数年时间寻找方法在上帝眼中过上更好的生活。当岁月证明人性几乎不可能避免七宗罪时，他们的人生轨迹也随之改变。\n不止一派信徒在献祭中结束了自己的生命，他们确信，一旦离开肉体，肉体的罪孽就可以得到赦免。其他人则走上了更黑暗的道路，他们认为这不是自己的失败，而是人类的失败。他们以消除罪恶的名义摧毁了整个村庄，却从未意识到自己行为的讽刺意义。\n最终，这场运动逐渐式微，除了黑森林边缘村庄的居民外，其他人都对它失去了记忆。村里的祭司是个近乎异端的人，他梦见了一个伟大的魔法仪式，能够从人的肉体上撕下罪孽，将它们驱逐出这个世界。\n按照上帝对罪孽的惩罚，村民们禁食了四十个昼夜。第四十一天，在祈祷和礼拜的歌声中，一位天使走进了教堂的大门。“你们做得很好。”他说，“你们的罪孽已被赦免，将永不再现。”蓝白色的光充满了教堂，甚至淹没了太阳。当光芒褪去，七只凶恶的恶兽站在会众面前，嚎叫着寻求血肉。它们找到了\n当最后一个教徒倒在野兽面前时，一片死寂。每只恶兽都在注视着其他恶兽，它们天生就知道自己在这个世界中的定位。任一原罪的灯塔。"
 pod1230objectives_demons.7.a: "属于我的原罪。"
 pod1230objectives_demons.8.t: "魔邪智慧之树"
 pod1230objectives_demons.8.desc: "在被困在深渊中思考自己的宿命亿万年之后，现在又看到了自己和其他堕天者逃出来后的世界，你们心中留下了太多的疑问和不确定性。上帝的计划是什么？你在其中扮演了什么身份？为什么你们要在这个地狱般的监狱里受苦这么久？\n你想知道这些问题的答案……而现在，你知道了一切，你知道了造物主的真正目的，知道了世界上的每一个谜团，知道了有知觉的心灵所提出的每一个疑问，无论它们是世俗的还是凡人难以理解的。\n你知道上帝行为背后的动机，你认为你应该可以去拜访祂，与祂进行一场震撼宇宙核心的谈话（或争论）。"
 pod1230objectives_demons.8.a: "我知道你的动机是什么，“圣父”。我们就来谈谈。"
 pod1230objectives_demons.8.b: "家庭聚会可以等等。"
 godly_knowledge_modifier: "上帝之知"
 godly_knowledge_modifier_desc: "该角色的知识可与上帝的全知相媲美。"
 death_godly_talk: "离开了这个位面"
 pod1230objectives_demons.9.t: "新创世纪"
 pod1230objectives_demons.9.desc: "上帝早就抛弃了这个世界，在看到这个可怜的地方的状况后，你已经知道了这个事实。你知道上帝在创造人类时，在他们身上注入了神性的火花，你计划利用这一点来实现自己的飞升。哪怕路西法为此叛天过，人类还是浪费了他们的潜能，从某种程度上说，你是在为更伟大的目的挽救他们仅有的一点利用价值。\n也许你最终还会让他们享受到这一切。\n现在，你掌握了这么多灵魂的信仰，你对神性的最后冲刺也到了尾声。你不会挑战上帝本身，至少现在还不会，但就所有意图和目的而言，你将成为与祂平等的存在。\n也许，假以时日，你会比他更强。"
 pod1230objectives_demons.9.a: "我的天堂，你的地狱"
 world_in_your_hand_ending_tooltip: "#n 世界已经屈从于你的意志。#!你的游戏将结束，因为你熟知的世界将被永远改变。 你会成为仁慈的神祗吗？还是暴怒的？这是另一个纪元的故事，对于十字军之王3来说过于宏大。"
 final_war_modifier: "终结之战"
 final_war_modifier_desc: "创造物在它自己的毁灭者面前颤抖。\n[kingdom|E][holy_war|E][casus_belli|E]的限制被解除。"