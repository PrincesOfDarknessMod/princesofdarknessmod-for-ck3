l_simp_chinese:
 POD_asakku.0001.t: "一直存在的事物"
 POD_asakku.0001.desc: "今夜，在巴库黎明前的寂静时刻，远离以诺，也远离叛徒亚马达达的警惕目光，某种你已压制了数个世纪的东西浮出水面。\n\n那威仪术耐心十足，它始终如此。它不言语任何语言，你只能通过一种微妙的感受感知它，但此刻它正将你推向东方。\n\n它不自称任何名字，而你曾以诸多名号称呼它。今夜，它再次发问：你是否打算继续伪装下去。"
 POD_asakku.0001.a: "你一直都在。我不再假装并非如此。"
 POD_asakku.0001.b: "再次镇压它。"
 POD_asakku_soul_infection_accepted_tt: "[GetScheme('POD_asakku_soul_infection_scheme').GetTypeName][scheme|E]现在可用于对付携带[GetTrait('vicissitude').GetName(GetNullCharacter)]的$POD_splat_vampire_plural$。一个新的[story_cycle|E]即将开始。"
 POD_asakku_suppressed_tt: "本次运行的内容已禁用。阿萨克将不再出现。对于本次游戏进程来说，这是永久性的。"
 POD_asakku.0002.t: "记忆中的航行"
 POD_asakku.0002.desc: "你已经多年未曾想起那口井。你也不允许自己去想。那口井比你的初拥还要古老，比将你从希腊高地带走的棘秘魑上古耆宿还要古老。\n\n叹息之狮。三次驶入大风暴的航行，船体因饱经淬炼的灵魂而吱嘎作响。世界之间的迷宫。其心脏处的森林，以人类的嗓音低语。十三王座之朝廷，以及其中心那无底之井。\n\n你走近了。你向其中低语。事后你告诉唯一幸存的见证者雅玛丹达，你只是在对自言自语。你甚至可能自己都相信了。\n\n你返航以诺途中初拥的那些细语者，学习易变术的速度远超任何导师所能解释。在以诺，一支方阵被派来惩戒你，因你太过放纵。他们发现了你带回家的那些形似血畜与血族之物，面容几可辨认却又不尽相同。当方阵焚烧它们时，它们嚎叫着一个名字。你已一千年未曾说出那个名字。\n\n阎摩弹陀已离去数个世纪，但其以利乌德学徒仍在。那些被他剥皮重造的猎人。他们终将找到此地，战斗将重新开始。"
 POD_asakku.0002.a: "这段记忆比承载它的躯体更为古老。"
 POD_asakku.0010.t: "声音变得更大"
 POD_asakku.0010.desc: "今夜有些东西变了。不是世界变了，而是你变了。那个声音一直只是一个声音。如今它成了一种威仪，有了分量，它已不再假装是你家中的客人。\n\n你揭开那面仆人们出于旧日礼数而用纱遮起的镜子，因为你想知道真相。你看见了自己的脸。你还看见了它背后的东西，正透过你的眼睛回望，就像你正透过那双眼睛向外看一样。数百年来学会无视它的功夫，并未让你有所准备。\n\n你血脉中承载的并非闯入者，它比你所信奉的任何信仰都更久远，比你对任何前来求见的祭司或维齐尔所献上的礼数都更悠久。它才是原初的住客。你才是那个误把此宅当作己有的客人。\n\n你所披的信仰，那彬彬有礼的调和论调，毫无仪式地脱落了。你早已知道自己实际向何方祈祷。今夜，那些话语自行成形。\n\n在巴库，远离任何会留意这一刻的人，你不再是一个身怀异状的吸血鬼。你是阿萨克。世上或许只有屈指可数的存在能理解这区别，而那些理解者若知晓，便会当场将你了结。"
 POD_asakku.0010.a: "再也无法无视它了。"
 POD_asakku_depth_25_tt: "你是阿萨克。实体已经扎根。你的信仰转向了腐化之道。"
 POD_asakku.0011.t: "那道声音自有主张"
 POD_asakku.0011.desc: "声音如今有了自己的见解。它想要东西生长，想要种子播下。你已经开始明白，当它说“花园”时，指的并不是花朵。\n\n它也不是在说教。它在协作。那些涌入你脑海的念头——关于封臣的处置，关于该让哪个对手靠近、又该在哪个成熟前将其剪除，关于将你的土地慢慢塑造成与世间万物越来越不同的模样——你并不能总是分辨这些念头是否源自你自己。\n\n你血脉中的易变术也变得清晰了。许多形态纷至沓来，没有任何导师曾教过你。这异能不再是异能。它是那实体驱动你的方式，如同舌头在口中活动。\n\n还有比这一切更新的东西，难以言喻。一种不被看见的方式。不是其他$pod_clans$的混淆术。某种更安静的东西。内在的存在教导你，却又不似教导，如何从他人的注意中滑脱，即便那些人清楚该往哪里看。你怀疑，山田陀的针如今也找不到你了。\n\n[GetTrait('POD_asakku_elioud hunters').GetName(GetNullCharacter)]猎人终究会知道。他们也同样耐心。你不可能永远躲过他们的目光。"
 POD_asakku.0011.a: "告诉我应该种什么。"
 POD_asakku_depth_50_tt: "你的掌控更加精深。现在你可以在土地上播下易变术的污秽。"
 POD_asakku.0012.t: "哪一个是你的想法？"
 POD_asakku.0012.desc: "You are no longer certain which thoughts are yours. What surprises you is that the voice's thoughts are not so different from your own, older perhaps. Colder. But recognizably kin. Is it a merge or the Asakku taking over your old self? You couldn't tell, or perhaps you don't want to.\n\nThe chorus inside you no longer lapses. Not in solitude, not in ritual, not in what passes for sleep among the dead. There is a constant murmur of voices and impossible images running just behind the surface of your attention, not yours, not entirely, not anymore, and any mind that reaches into yours to scry or to manipulate finds not silence but the wall of noise.\n\nThrough the blood you have planted, you can listen now. Anyone who carries your infection carries also a thread you can pull. A vassal in your own court. A $pod_cainite$ three princedoms away. When the entity wishes you to hear what passes through their hall, you hear it. You know things that no spy could tell you.\n\nIn Enoch, the Basalt Throne registers a tremor. The Del'Roh has felt this before. Once, long ago, when the same line of corruption walked back from a black voyage. The Seraphim will be convened. A new [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] will be named in the morning, or perhaps tonight, depending on how patient the Del'Roh decides to be.\n\nYou will hear of it through the blood, eventually. The voice is not surprised. The war is coming, at it always was meant to."
 POD_asakku.0012.a: "我们是亲族。"
 POD_asakku_depth_75_tt: "Your connection to the Asakku deepens. Soul Whispers becomes available. The Del'Roh takes notice."
 POD_asakku.0013.t: "Iryi Ascendant"
 POD_asakku.0013.desc: "There is no border anymore. Truth be told, the distinction was always artificial. A comfort for the centuries when you needed to believe you were still just a vampire. You are not. You are something older, wearing a shape that used to be entirely yours.\n\nThe corrupted who came back with you on the Sighing Lion howled one name as they burned. You have not spoken it in a thousand years. Tonight you say it without flinching, and the saying is also the answer. Aretstikapha. The Watcher whose discipline became Vicissitude when it was stolen out of the Qlippoth before the Flood. The voice was always the Watcher, and the Watcher was always the voice you had pretended was an unfortunate inheritance.\n\nYou think of the high pastures above the temple, of the rite that took you, of the Sire who Embraced you and the Council to whom you reported. You think of the first servant on the voyage whose face came apart screaming the name. There is one of you. There always was.\n\nWhat remains is the rest of the world. The Hand still hunts your line. The [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] still sharpen their needles. The Del'Roh still sits the Basalt Throne, deciding which of the things in the dark to permit and which to extinguish. The Watcher within you regards them with contempt, and you do so as well.\n\nIryi Ascendant. The Deluge did not finish the work. But there is time."
 POD_asakku.0013.a: "我就是如今的我。"
 POD_asakku.0013.b: "I speak the name at last. Aretstikapha."
 POD_asakku_depth_100_tt: "The merger is complete. You are Iryi Ascendant."