l_simp_chinese:
 POD_worldgen.1.t: "黑暗世界"
 POD_worldgen.1.desc: "世界是哪样的？"
 POD_worldgen.1.option.a: "超自然"
 POD_worldgen.1.option.a.tt: "超自然世界，所有具有头衔的角色都是超自然生物或猎人。"
 POD_worldgen.1.option.b: "大部分凡俗"
 POD_worldgen.1.option.b.tt: "大多数具有头衔的角色都是凡人，只有10%的少数是隐藏的超自然生物。"
 POD_worldgen.1.option.c: "我只是个凡人！"
 POD_worldgen.1.option.c.tt: "你的角色以凡人开局开始，只有5%的拥有具有头衔的角色是超自然的。"
 POD_worldgen.2.t: "超自然世界"
 POD_worldgen.2.desc: "那种超自然生物具有霸权地位？"
 POD_worldgen.2.option.a: "吸血鬼"
 POD_worldgen.2.option.b: "狼人"
 POD_worldgen.2.option.c: "法师"
 POD_worldgen.2.option.d: "妖精"
 POD_worldgen.2.option.e: "恶魔"
 POD_worldgen.2.option.f: "猎人"
 POD_worldgen.2.option.g: "吸血鬼和狼人互争霸权"
 POD_worldgen.2.option.h: "黑暗世界的变体"
 guest_description.learning_physician_trait.desc: "在学的医师特质"
 guest_description.learning_mystic_trait.desc: "在学的神秘主义者特质"
 POD_maintenance.18.t: "帝国雄心"
 POD_maintenance.18.desc: "在凡人统治者的眼皮底下管理一个帝国并非易事。你的一言一行固然很有分量，但你不可能同时出现在所有地方，随着你的扩张，你必须越来越多地依靠下属，并开始引起其他强大统治者的关注。相反，一个较小的领地往往权力较小，但效率较高，能从每个成员身上榨取更多。\n你目前过扩等级已改变，这意味着你内部官僚机构的某些部分必须重组。"
 POD_maintenance.18.a: "让我们回顾一下现状。"
 POD_move_imperial_gov_tt: "你的领地规模已增长或缩减到需要更改过扩等级。你可以在领地面板中查看详情。"
 POD_maintenance.21.t: "新的时代"
 POD_maintenance.21.desc: "当黑暗世界在阴影中前行时，凡人们并未停滞不前。进入新时代是一个既惊奇又恐惧的时刻。凡人一次又一次地证明，他们有能力让世界上那些往往颓废、固步自封的超自然生物大吃一惊。随着他们潜能的发挥，影响他们将变得越来越困难，代价也越来越高昂，而曾经真实存在的生物逐渐退入神话传说中。\n\n#X 每一个时代的更替都会增加建筑和雇佣兵的成本，并降低逝兽的效能。这些效果可以在文化创新界面中查看，只需将鼠标悬停在时代上即可。#!"
 POD_maintenance.21.a: "让我们回顾一下现状。"
 POD_maintenance.24.desc: "曾经，君士坦丁堡梦想成为天堂。然后它陷落了，留下了地狱般的景色。但在今晚，它醒来了，重新与世俗的同胞并肩而立。那些曾在米迦勒大主教的白日梦中飞翔了几个世纪的该隐之子如今从坠毁中恢复过来，在废墟中寻求着未来的希望。\n对于该隐之子来说，同时有两个君士坦丁堡在近乎坚不可摧的高墙之后崛起。传说中的奇幻之地，赐予幸运者财富、影响力和神秘力量的梦幻大城邦，那是一团火焰，其余烬仍然不愿完全熄灭。然而，令人清醒的现实却是一个颓废堕落的乌托邦，诱饵与猎手混杂在一处，信仰挣扎着寻求出路。\n这座城市——#italic 这座城市 #! 对于许多人来说——正在日复一日地努力恢复，但奇迹和恐怖从统治者的指缝间溜走。\n是时候让这座曾经辉煌的城市重新塑造自己了，否则它将被历史的沙砾冲刷殆尽。"
 POD_maintenance.24.a: "看起来梦想确实会死去。"
 POD_maintenance.25.t: "复燃之梦"
 POD_maintenance.25.desc: "拜占庭自从作为一个贸易站点起于微末以来，曾多次易手。每一个曾经占据这里的凡人统治者的文化都在这座城市的历史上留下了自己的印记，如今也不例外。根据你的旨意，你可以让君士坦丁堡迎来另一个轮回，推动你的目标在其居民中实现。当然，你也可以选择让历史继续按原来的轨迹发展。\n#N 选择变更将把君士坦丁堡重置为一种新的大城邦，同时会移除你当前的建筑。#!"
 POD_maintenance.25.a: "我不会插手干预。"
 POD_maintenance.25.b: "是时候改变了。"
 POD_maintenance.28.t: "手工诺斯费拉图"
 POD_maintenance.28.desc: "在$pod_Embrace$时，每个[GetTrait('nosferatu').GetName(GetNullCharacter)]都会因其$pod_clan$诅咒而变得面目可憎。\n\n[ROOT.Char.GetTitledFirstName]来自统治者设计器，因此[ROOT.Char.GetSheHe|l]暂时免于此劫……但[ROOT.Char.GetSheHe|l]无法永远逃避。\n\n你现在可以选择让游戏自动添加一些#bold 随机#!的诺斯费拉图外观，或若满意当前角色外貌，可跳过此步骤。"
 POD_maintenance.28.a: "让[ROOT.Char.GetFirstNameNoTooltip]变得更丑陋。"
 POD_maintenance.28.b: "[ROOT.Char.GetFirstNameNoTooltip][ROOT.Char.GetSheHe|l]的样貌已臻完美。"