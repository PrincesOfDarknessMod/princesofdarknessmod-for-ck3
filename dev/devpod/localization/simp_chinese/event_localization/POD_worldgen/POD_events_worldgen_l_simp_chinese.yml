 POD_maintenance.18.t:0 "帝国雄心"
 POD_maintenance.18.desc:0 "在凡人统治者的眼皮底下管理一个帝国并非易事。你的一言一行固然很有分量，但你不可能同时出现在所有地方，随着你的扩张，你必须越来越多地依靠下属，并开始引起其他强大统治者的关注。相反，一个较小的领地往往权力较小，但效率较高，能从每个成员身上榨取更多。\n你目前过扩等级已改变，这意味着你内部官僚机构的某些部分必须重组。"
 POD_maintenance.18.a:0 "让我们回顾一下现状。"
 POD_move_imperial_gov_tt:0 "你的领地大小已增长或缩小到需要更改过扩等级的大小。你可以在领地面板中查看详情。"