 POD_maintenance.18.t:0 "Crippling Overextension"
 POD_maintenance.18.desc:0 "Your influence has grown to tremendous extremes lately with your word carrying great weight over vast stretches of land. Perhaps a little too much however as you can't be everywhere at once, resulting in many cases of corruption, misinterpreted orders or border territories not even caring to pay proper homage. This has to change before reaching worrying proportions and, as such, you have put forth a plan to reorganize your realm's administration, mostly centered around using a new caste of trusted officials tasked with relaying your orders to your vassals.\n\n #warning Your realm has grown to such a size that you will now adopt an Imperial form of administration, resulting in new tax jurisdictions being created and tax collectors needing to be appointed with various contracts to choose from. These are available under the new Vassal Contracts tab on the right of your screen that will become available in a few days following this event.#!"
 POD_maintenance.18.a:0 "The bureaucracy expands."
 POD_move_imperial_gov_tt:0 "Your realm will adopt an Imperial Administration government type.\nThis will result in growing pains, with a duration dictated by your Stewardship."
 imperial_overextension_modifier_desc:0 "Your realm is (painfully) getting accustomed to a new form of governance."
 imperial_overextension_modifier:0 "Growing Imperial Administration"