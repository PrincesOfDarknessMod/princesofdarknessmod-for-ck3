l_simp_chinese:
 POD_worldgen.1.t:0 "黑暗世界"
 POD_worldgen.1.desc:0 "世界是哪样的？"
 POD_worldgen.1.option.a:0 "超自然"
 POD_worldgen.1.option.a.tt:0 "超自然世界，所有具有头衔的角色都是超自然生物或猎人。"
 POD_worldgen.1.option.b:0 "大部分凡俗"
 POD_worldgen.1.option.b.tt:0 "大多数具有头衔的角色都是凡人，只有10%的少数是隐藏的超自然生物。"
 POD_worldgen.1.option.c:0 "我只是个凡人！"
 POD_worldgen.1.option.c.tt:0 "你的角色以凡人开局开始，只有5%的拥有具有头衔的角色是超自然的。"
 POD_worldgen.2.t:0 "超自然世界"
 POD_worldgen.2.desc:0 "那种超自然生物具有霸权地位？"
 POD_worldgen.2.option.a:0 "吸血鬼"
 POD_worldgen.2.option.b:0 "狼人"
 POD_worldgen.2.option.c:0 "法师"
 POD_worldgen.2.option.d:0 "妖精"
 POD_worldgen.2.option.e:0 "恶魔"
 POD_worldgen.2.option.f:0 "猎人"
 POD_worldgen.2.option.g:0 "吸血鬼和狼人互争霸权"
 POD_worldgen.2.option.h:0 "黑暗世界的变体"
 guest_description.learning_physician_trait.desc:0 "在学的医师特质"
 guest_description.learning_mystic_trait.desc:0 "在学的神秘主义者特质"
 POD_maintenance.18.t:0 "帝国雄心"
 POD_maintenance.18.desc:0 "Your influence has grown to tremendous extremes lately with your word carrying great weight over vast stretches of land. Perhaps a little too much however as you can't be everywhere at once, resulting in many cases of corruption, misinterpreted orders or border territories not even caring to pay proper homage. This has to change before reaching worrying proportions and, as such, you have put forth a plan to reorganize your realm's administration, mostly centered around using a new caste of trusted officials tasked with relaying your orders to your vassals."
 POD_maintenance.18.a:0 "扩展官制"
 POD_move_imperial_gov_tt:0 "你的领地将采用帝国制。\n这会造成阵痛期，为期取决于你的管理能力。"
 imperial_overextension_modifier_desc:0 "你的领地正（艰难地）适应新的政府体系。"
 imperial_overextension_modifier:0 "发展中的帝国制"
 POD_maintenance.19.t:0 "帝国衰败"
 POD_maintenance.19.desc:0 "Your realm, administrated for a while following the principles of an imperial caste of subordinates, has shrunk to size significantly lately. Such a large apparatus isn't needed anymore and your dealings with your vassals have naturally reverted to a more personal approach."
 POD_maintenance.19.a:0 "反正我更偏好亲自应对。"