l_simp_chinese:
 POD_gehenna_seer.100.t: "奇怪的传闻"
 POD_gehenna_seer.100.a: "我需要一个更好的$court_seer_court_position$。"
 POD_gehenna_seer.100.b: "为这个[gehenna_seer.GetWomanMan]提供更多的药物容器！"
 POD_gehenna_seer.gen.t: "火焚末日的预言"
 POD_gehenna_seer.gen.a: "接受预言！"
 POD_gehenna_seer.gen.b: "抗拒预言！"
 POD_gehenna_seer.300.desc: "[gehenna_seer.GetTitledFirstName]对你的宫廷宣告了严峻的预言：\n\n‘随后黑暗之母将来到以诺的山谷，\n与黑暗之父展开一场决斗\n恶魔之后的噬咬既深且狠\n诅咒之王的噬咬更深更狠’"
 POD_gehenna_seer.400.desc: "[gehenna_seer.GetTitledFirstName]指示了火焚末日的迹象：\n\n‘留意舞动的黯影\n留意复兴的巨龙\n留意飘移的黑暗\n留意月兆的阴影’"
 POD_gehenna_seer.500.desc: "[gehenna_seer.GetTitledFirstName]恍恍惚惚的喃喃自语道：\n\n‘你将知晓，一名黑手将会复兴，扼杀所有的敌对者\n你将知晓，吞噬心血者将大兴于世，\n血族嫡亲将彼此拥挤，$pod_vitae$将如钻石般稀有’"
 POD_gehenna_seer.600.desc: "[gehenna_seer.GetTitledFirstName]启示道：\n\n‘当三王之首于白色之柱上看到燃烧的黎明之时，时刻便会来临’"
 POD_gehenna_seer.700.desc: "[gehenna_seer.GetTitledFirstName]做出了预言警告：\n\n‘你将知晓，在那血液稀薄的年代，血族再不能制造后裔\n你将知晓，那些无族者将到来并掌权’"
 POD_gehenna_seer.800.desc: "[gehenna_seer.GetTitledFirstName]提示出那希望将来自血畜：\n\n‘一名背负着万物命运的女人，\n夏娃的最后一位女儿，将会诞生\n你只能通过刻于其身的月之印记来辨认，\n否则便无法认出这名女人\n她将面临背叛、憎恶和痛苦，\n但她仍是最后的希望’"
 POD_gehenna_seer.900.desc: "[gehenna_seer.GetTitledFirstName]警告那前来吞噬的母亲即将接近：\n\n‘当远古饥渴于极北丛林中觉醒并毁灭她所有的子嗣之时，时刻便会来临’"
 POD_gehenna_seer.1000.desc: "[gehenna_seer.GetTitledFirstName]预告了地下的威胁：\n\n‘当于被遗忘的城市深处蛰动的古老黑暗惊动了长者，它的子嗣之时，时刻便会来临’"
 POD_gehenna_seer.1100.desc: "[gehenna_seer.GetTitledFirstName]警告了末日：\n\n‘鉴于这些征兆，汝等必须知晓，\n火焚末日正等待着，就在门后等待着，\n一如演员等待登台的时刻\n它来临了！它迫近了！\n\n漆黑的日耀！\n血红的月芒！\n火焚末日转瞬即至’"
 POD_gehenna_seer.1200.desc: "陷入恍惚，[gehenna_seer.GetTitledFirstName]胡言乱语道：\n\n‘肃静！倾听这渡鸦的泣诉！\n在这寂风掠过街道，\n高塔隐于黑暗的日子里\n在这勒森魃梦想成真的日子里，\n月芒如血划过天际，\n日耀似墨高悬天顶，\n此乃诅咒之日，该隐子民再兴之日’"
 POD_gehenna_seer.1300.desc: "[gehenna_seer.GetTitledFirstName]看了看地，随后看向了天：\n\n‘世界将步入酷寒，\n不洁之物将从地底涌出，\n巨大的风暴将翻滚席卷一切，\n动物的躯体将扭曲溃烂直至堕落\n如此，\n我们的先祖亦将自大地中苏醒\n他们将拿我们打破斋戒的禁忌\n他们将毁灭我们全部’"
 POD_gehenna_seer.1400.desc: "用方言喃喃自语，[gehenna_seer.GetTitledFirstNamePossessive]的话语突然变得清晰起来：\n\n‘我们不会知道那里发生了什么，\n但苍天将因而破碎，\n大地亦随之撕裂\n地狱之力将倾泻于世\n第三日，饱食腐肉的渡鸦不再聒噪，瘟疫于废墟之中肆意狂舞\n最后一名狂野子民将杳无踪迹，最后一名月之野兽将力战至死’"
 POD_gehenna_seer.1500.desc: "[gehenna_seer.GetTitledFirstName]陷入恍惚并喃喃自语道：\n\n‘[Glossary('上古耆宿','game_concept_antediluvian_desc')]将为自己创建一个血之帝国\n他们将以钢铁利爪统治\n他们将扭绞生者的心脏\n世间众生都将来到这名为火焚之狱的终末之城，苟且偷生’"
 POD_gehenna_seer.1600.desc: "[gehenna_seer.GetTitledFirstName]预示：\n\n‘那里的统治将长达千年，\n那里将不会有爱，生命，或是怜悯\n强壮有力者将被作为奴隶使唤，\n品德高尚者将因腐化而堕落\n每个良善的赠礼、完美的赠礼\n都将被力量源于下层国度的黑暗之父所污染’"
 POD_gehenna_seer.1700.desc: "[gehenna_seer.GetTitledFirstName]预示说：\n\n‘汝辈不当成为舍特子嗣之神明，\n否则天主之戒备将与日俱增，\n永久断绝该隐之血脉，\n勿忘和蔼之亚斯他录，\n勿忘丰饶之巴尔，\n勿忘强壮之塔木兹，\n汝辈当知，若为舍特子嗣之神明，\n其必将以天主之武器奋起反抗，\n并征服吾族。’"
 POD_gehenna_seer.1800.desc: "[gehenna_seer.GetTitledFirstName]预告说：\n\n‘彼辈应于旭日东升之时\n守护吾族之房屋，\n以冰水对抗米迦勒之烈焰\n彼辈应喂食以饱吾族，结衣以暖吾族\n彼辈应舞蹈以娱吾族，歌唱以悦吾族\n彼辈应陪伴以安吾族，抚慰以和吾族\n彼辈应建言议事与吾族，吾族亦应听取彼辈之建议\n彼辈应尊敬崇拜与吾族，吾族却应拒绝彼辈之尊崇’"
 POD_gehenna_seer.1900.desc: "[gehenna_seer.GetTitledFirstName]预告道：\n\n‘而从那些饮血如水的！\n西方的城市将因怒火而熊熊燃烧。\n来自东方的巨轮，源自无形的土地，将碾碎他们！\n在终末之夜\n当月化暗银\n最后$pod_Embrace$来了！\n漆黑的日耀！\n漆黑的月耀！\n水将覆也！’"
 POD_gehenna_seer.2000.desc: "[gehenna_seer.GetTitledFirstName]预测：\n\n‘看那横跨世界的钢铁巨像\n看它脚下的蠕虫。\n当巨人摇摇欲坠时，蠕虫们欢欣鼓舞。\n因为当巨人倒下时，将有大量的食物。’"
 POD_gehenna_seer.2100.desc: "[gehenna_seer.GetTitledFirstName]预示：\n\n‘听那夜中嚎声\n可是亚当之狼\n投入龙缠。\n从可闻时之初的兄弟之血’"
 POD_gehenna_seer.2200.desc: "[gehenna_seer.GetTitledFirstName]预示说：\n\n‘见那度经五百年的弃厅\n与那碎满琉璃片的地板\n可见石泣成声，飞龙在天\n莉莉丝在此\n莉莉丝已释’"
 POD_gehenna_seer.2300.desc: "[gehenna_seer.GetTitledFirstName]宣告：\n\n‘五百年中，七族并立\n施行统治，违背天使之命\n族被诅咒者中寻求团结。\n警惕那些遗忘了自身诅咒的$pod_cainite$\n并幻想着凡人的和谐。’"
 POD_gehenna_seer.2400.desc: "[gehenna_seer.GetTitledFirstName]建议：\n\n‘聆听先知的话语吧，它讲述\n鲜血满溢的梦境、骤然消逝的夜，\n吞噬自身骨血的饥渴，\n以及终化尘土的骄傲。\n聆听先知的话语，\n这幻象撕裂时间的面纱。\n还有失落的夜晚中等待的战士，\n他们的剑正叫嚣着复仇。\n聆听学者的话语吧，\n知识就是他们的诅咒。’"
 POD_gehenna_seer.2500.desc: "[gehenna_seer.GetTitledFirstName]警告：\n\n‘而远古的恐怖只是\n即将到来之物的梦。\n彼等带来警告。\n彼等带来智慧。\n彼等带来屠杀。’"
 POD_gehenna_seer.2600.desc: "[gehenna_seer.GetTitledFirstName]预言说：\n\n‘该隐子嗣的胸膛内\n跳动着饥渴。\n一次、两次、三次呼唤\n权力和死亡，\n十三个灵魂将被撕碎。\n这是不流血的死亡，\n是没有鬼魂的坟墓。’"
 POD_gehenna_seer.2700.desc: "[gehenna_seer.GetTitledFirstName]预示说：\n\n‘看啊，一族在沉寂中消逝，其哭喊无人听闻。\n其子嗣将身负他的名，而非他的血。\n因无知而幸福，沉浸于自身的盲目，\n他的后代命如漂萍露水。\n品尝隐秘知识的人颤抖，\n掘尽世界、寻找最后一滴真相。\n杀戮中没有救赎。\n被诅咒者从未忘记。’"
 POD_gehenna_seer.100.desc.1: "你$court_seer_court_position$跌跌撞撞地走进大殿，喃喃自语道\n“在，嗯，最后的日子里……\n……到处都是血……\n……影子……什么……”\n\n然后[gehenna_seer.GetSheHe]就昏过去了。"
 POD_gehenna_seer.100.desc.2: "当你的$court_seer_court_position$被发现昏迷不醒，[gehenna_seer.GetHerHis]嘴边有血沫时，引起了一阵骚乱。显然，[gehenna_seer.GetSheHe]有某种不祥的预感，让[gehenna_seer.GetHerHim]无法处理。"
 POD_gehenna_seer.100.desc.3: "你的$court_seer_court_position$大声宣布。\n\n“血的言语！\n十三人的灵魂将扳动人心！\n黄金胖子的父亲！”\n\n这没有任何意义。"
 POD_gehenna_seer.100.c: "该末日瞎预言是无稽之谈。"