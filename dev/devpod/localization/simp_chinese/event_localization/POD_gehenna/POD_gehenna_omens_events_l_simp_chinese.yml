l_simp_chinese:
 POD_gehenna_omens.1231.notification: "火焚末日之预兆"
 POD_gehenna_omens.1231.desc: "一只双头奶牛诞生了。"
 POD_gehenna_omens_1231_notification_tooltip: "真的，一只双头奶牛诞生了。"
 POD_gehenna_omens.1240.t: "火焚末日之预兆"
 POD_gehenna_omens.1240.opening: "来自俄罗斯的消息："
 POD_gehenna_omens.1240.desc: "银牙的双狼尤里·特瓦里维奇与索菲娅·特瓦里维奇带领着一对狼人对抗俄罗斯的残忍者戈里尼奇·沙卡拉，其队伍还包括其他五位银牙族人：亚美尼亚的乔治、鲍里斯、福马、瓦西里和乌尔特拉。此外追随他们的还有：彼得，来自玻璃行者；乌卢，来自星占；伊戈尔·瓦尔科夫，来自啮骨者；穆罕默德，来自寂静漫游者；卡佳，来自黑怒；以及芬里尔仔兽的英雄拉格纳。乌尔特拉、拉格纳、鲍里斯和卡佳都在战斗中牺牲了，如同索菲娅，而尤里在给予沙卡拉最后一击的时候跟其同归于尽。"
 POD_gehenna_omens.1240.a: "戈里尼奇被激怒了！"
 POD_gehenna_omens.1240.a.tt.beast: "#beast 愤怒解决一切！#!"
 POD_gehenna_omens.1241.t: "火焚末日之预兆"
 POD_gehenna_omens.1241.opening: "来自俄罗斯的消息："
 POD_gehenna_omens.1241.desc: "蒙古汗帐像洪水一样从大草原上涌来，横扫了俄罗斯的土地，它的凡人国王们在一场暴力的洪流中被淹没。但更令人不安的是据说有一群狼人混在人类大潮中。这个狼人部落称自己为影爵，并在他们身后留下了血畜与血族的尸体。月兽的暴行是否预示着火焚末日的到来？"
 POD_gehenna_omens.1241.a: "那些蒙古人和他们的狗将会前进到哪！？"
 POD_gehenna_omens.1242.t: "爱与诅咒"
 POD_gehenna_omens.1242.desc: "恩卡拉，一位受人尊敬的哈基姆圣裔战士，还没有从为拯救她的[Glossary('尊长','game_concept_Sire_desc')]，昔日英勇的伊希姆而进行的远征中归来。更糟糕的是，术士们在她离开之前所怀有的恐惧已经被证明只是可怕事实的皮毛。\n伊希姆已经被恶魔纳姆塔尔腐蚀了，而且利用恩卡拉作为最终的祭品，他的觉醒诅咒了哈基姆圣裔，将巴力仪式发挥到极致施加在他们身上。曾经骄傲而纪律严明的哈基姆战士现在对吸血鬼的血液感到强烈地渴望，[Glossary('吸榨','game_concept_diablerie_desc')]这种可恨的行为变得越来越普遍。现在，即使是抵制单纯的甜美血液的召唤，对$pod_clan$来说也是困难重重、压力巨大的事情。\n然而哈基姆圣裔还很势大，三大种姓的人正在努力寻找解决办法，以免为时已晚。"
 POD_gehenna_omens.1242.a: "我们将忍过去！"
 POD_gehenna_omens.1242.a.tt: "伊希姆·乌尔·巴尔带着一支强大的军队在波斯东北部苏醒了。\n所有哈基姆圣裔都会得到一个代表当前血咒的负数修正。\n如果三大主要派别的领导人（贾迈勒、阿什拉夫和忒弥斯）在10年后仍然活着，他们会提出处理方案。"
 POD_cult_of_izhim_ur_baal: "伊希姆·乌尔·巴尔的密教"
 POD_gehenna_omens.1244.t: "甲虫与女巫"
 POD_gehenna_omens.1244.desc: "赛特之子氏族被许多派别分割开来。曾经的优势现在变成了劣势。\n一边野蛮粗暴的、渴望权力的格利康战士们正横行霸道，在十字军东征之后，他们冷酷无情的举止玷污了氏族为人精巧的形象。虽然他们曾经是掌权三巨头（牧师、战士、女巫）的重要组成部分，但他们现在被许多人视为一种负担。\n在另一边，厄喀德那女巫们自找了她们和勇士们即将迎来的末日，她们似乎急于用她们对“怪物之母”的异端信仰来进行挑衅。\n圣显者最近下令对这两个派别进行清洗，导致阶层中出现了激烈的内讧。这也导致这两派到处寻找盟友，承诺之后会偿还他们的债务。"
 POD_gehenna_omens.1244.a: "战士将获得我的支持。"
 POD_gehenna_omens.1244.b: "女巫应当受到庇护"
 POD_gehenna_omens.1244.c: "大快人心。"
 POD_gehenna_omens.1251.notification: "火焚末日之预兆：第二次吕贝克大火"
 POD_gehenna_omens.1251.desc: "吕贝克市遭受了第二次大火灾。它的许多木制建筑变成了灰烬。\n\n也许他们应该试着用石头盖房子？"
 POD_gehenna_omens.1252.notification: "火焚末日之预兆：暗影裁判所"
 POD_gehenna_omens.1252.desc: "天主教廷的暗影裁判所发现并消灭了一位梵卓吸血鬼。\n\n即使他只有这么小的年纪，也过于傲慢了。"
 POD_gehenna_omens.1253.notification: "火焚末日之预兆：乌特勒支之火"
 POD_gehenna_omens.1253.desc: "一场大火在荷兰的乌得勒支伯爵领肆虐了九个晚上，摧毁了城市的大部分地区。\n\n是暗影裁判所为了净化血族而烧毁了城市吗？"
 POD_gehenna_omens.1257.notification: "火焚末日之预兆：撒玛拉斯喷发"
 POD_gehenna_omens.1257.desc: "在遥远的东方龙目岛上，撒玛拉斯山已经爆发了！就像之前的庞贝一样，帕玛坦城已经被彻底摧毁。在200多英里之外的爪哇有火山灰落下。烟柱蒙蔽了太阳。"
 POD_gehenna_omens.1258.notification: "火焚末日之预兆：巴格达洗劫"
 POD_gehenna_omens.1258.desc: "蒙古的伊尔汗国洗劫了伟大的城市巴格达。这座城市现已人烟稀少，满目疮痍。智慧宫被毁坏。底格里斯河因血而红，因毁书而黑。随着穆斯台绥木的死亡，阿拔斯哈里发王朝也随之灭亡。"
 POD_gehenna_omens.1259.notification: "火焚末日之预兆：阿瓦隆极冬"
 POD_gehenna_omens.1259.desc: "它开始于神秘的干雾和持续的云。北方的冬天尤其严酷。饥荒已经蔓延到北部地区，而英格兰受到的打击尤其严重。伦敦饿死了两万多人。这是即将到来的永恒的妖精之冬吗？"
 POD_gehenna_omens.1268.notification: "火焚末日之预兆：西里西亚地震"
 POD_gehenna_omens.1268.desc: "整个大地都震动了，给阿达纳城带来了毁灭。六万多人被压死。所有的建筑物都倒塌了。"
 POD_gehenna_omens.1271.notification: "火焚末日之预兆：第三次吕贝克大火"
 POD_gehenna_omens.1271.desc: "第三次大火灾只烧毁了吕贝克市的一部分。果然石头建筑比木头建筑好得多。"
 POD_gehenna_omens.1287.t: "火焚末日：露西亚洪水的余波"
 POD_gehenna_omens.1287.desc: "在圣露西亚日之晚，一场巨大的风暴淹没了弗里西亚海岸。八万人被冲走淹死。数以百计的村庄随之消失。在这北方的冬至，该洪水和大规模死亡发生在一个最不祥的时刻，此时生者和死者之间的屏障是最薄的。有几个血族先知已经出现在混乱中，意图实现所预。奇怪的是，她们都叫露西。"
 POD_gehenna_omens.1287.a: "自然灾害自然发生，并不遵循旧神或新神的旨意。"
 POD_gehenna_omens.1287.a.tt: "那些记得的人说，这次洪水比1212年在诺德荷兰的北海大洪水还要严重。挪威荷兰的洪水持续了六个月，但圣露西亚日的灾难是在一夜之间发生的。这是欧洲历史上最严重的洪水。形成了一片新的海洋，被称为“须德海”。"
 POD_gehenna_omens.1287.a.tt.malk: "#MALKBLUE 这~剧~本~的~范~围~大~概~在~三~到~十~七~之~间~！#!"
 POD_gehenna_omens.1287.b: "露西亚已回来带来救赎或毁灭。而我将被救赎！"
 POD_gehenna_omens.1287.b.tt: "公元4世纪时，圣露西亚把食物带给了藏在罗马地下墓穴里的基督徒，但我们这些不死族对那里发生的事情却另有看法。露西亚神奇地治好了的来自她的祈祷者的病。随后露西亚拒绝嫁给一个她订婚的原始教徒。原始教徒们试图将她烧死在火刑柱上，但失败了。他们用矛刺穿她的喉咙，但她没有停止说话。他们挖出了她的眼睛，但却又奇迹般地恢复了。直到一位牧师赋予她作为基督徒的最后权利，她才死去。\n\n她的遗体在西西里静静地躺了400年。然后，这些文物被转移到君士坦丁堡，以避免撒拉森人的入侵者。然后她的尸体在1204年君士坦丁堡洗劫期间消失了，米迦勒的幻梦也随之陷毁。\n\n为什么天主回用旧约的方式，在圣露西亚的圣夜用史诗般的洪水来惩罚弗里西亚的恶人？这些灵魂中的许多人接受了渔民的信仰，并寻求到[UmbraGlossaryLocalized('far_shore','彼岸')]的乐园的路线。圣露西亚号召我们回到天国之路上。"
 POD_gehenna_omens.1287.b.tt.malk: "#MALKBLUE 热~十~字~面~包~！热~十~字~面~包~！一~便~士~一~个~，一~便~士~两~个~，热~十~字~面~包~！如~果~你~没~有~女~儿~，那~就~给~你~的~儿~子~。一~便~士~一~个~，一~便~士~两~个~，热~十~字~面~包~！#!"
 POD_gehenna_omens.1287.c: "路西夜行队又出发了！我要准备好马加入她！"
 POD_gehenna_omens.1287.c.tt: "北欧人对这个可怕的夜晚有另一个名字，“路西之夜”。路西是一种邪恶的女性超自然生物，据说她和她的追随者路西夜行队一起在空中飞行。在那个漫长的黑夜里，巨魔、邪恶灵体和亡者会成群结队地出现，去捕食那些粗心大意的人类。孩子是他们最喜欢的食物，会直接将其拉出家门。北欧人整夜不睡，以保护他们的家人。现在由于这场灾难，许多北欧人都死了。那些遵守旧道的人们的命运将是在尼福尔海姆为海拉服务，他们的灵魂将在那里为诸神黄昏而建造她的舰队。"
 POD_gehenna_omens.1287.c.tt.malk: "#MALKBLUE 我~的~长~矛~和~魔~盔~！你~的~长~矛~和~魔~盔~？长~矛~和~魔~盔~！魔~盔？魔~盔~！魔盔……耶啊！魔~盔~与~我~将~会~给~你~一~条~例~子~！#!"
 POD_gehenna_omens.1287.d: "爱丽娜是莉莉丝的化身之一，见证她的辉煌！"
 POD_gehenna_omens.1287.d.tt: "露西来自拉丁语“lux”，既光明使者。她的希腊名为爱丽娜。露西亚、路西、路西法或爱丽娜——全部只是神圣的莉莉丝的现身。随着莉莉丝的魔法创造了这洪水来嘲弄德谬哥，莉莉丝的女祭司已前来宣称她们被诅咒的灵魂。拉米亚回应了这召唤与这个世界和[UmbraGlossary('shadowlands')]作战。"
 POD_gehenna_omens.1287.d.tt.malk: "#MALKBLUE 不~许~取~笑~莉~莉~！哈哈！好吧。也~许~一~小~笑~……哗！呃啊！咕噗！#!"
 POD_gehenna_omens.1287.e: "弗里西亚将由亲王和法律统治，而非已死之神的密教徒。"
 POD_gehenna_omens.1287.e.tt.malk: "#MALKBLUE 每~个~宫~廷~都~需~要~宫~廷~小~丑~！#!"
 POD_gehenna_omens.1287.f: "不管是否神秘，这对我来说都无关紧要。我走自己的路。"
 POD_gehenna_omens.1287.f.tt.malk: "#MALKBLUE 划~，划~，划~你~的~船~，呼~救~随~着~不~再~响~ #!"
 POD_gehenna_omens.1260.notification: "火焚末日之预兆：拜巴尔斯大清洗"
 POD_gehenna_omens.1260.desc: "在埃及，马穆鲁克苏丹开始了对非穆斯林超自然者的无情清洗。而蛇正藏在洞里。"
 POD_gehenna_omens.1287.e.tt: "弗里西亚将由亲王和法律统治，而非已死之神的密教徒。"
 POD_gehenna_omens.6667.t: "恩卡拉的宿命"
 POD_gehenna_omens.6667.desc: "在古代，著名的哈基姆圣裔战士恩卡拉在轰轰烈烈的巴力大战中与她的[Glossary('尊长','game_concept_Sire_desc')]伊希姆并肩作战。伊希姆在最后一场战斗中，为了阻止恶魔纳姆塔尔穿越到这个世界而牺牲了自己。从那时起，恩卡拉一直不懈地努力寻找拯救她心爱的[Glossary('尊长','game_concept_Sire_desc')]的方法。而她似乎终于找到了。\n在哈基姆圣裔的首都鹰巢，恩卡拉正准备营救英勇的伊希姆，人们对此感到非常惶恐。感到不对劲，哈基姆圣裔的一些最伟大的领导人，包括备受尊敬的阿什拉夫，正在与恩卡拉争论，告诉她不要再寻找她的[Glossary('尊长','game_concept_Sire_desc')]，否则会有大灾难发生。然而，他们越是逼迫她，她就越是坚决要去，状况似乎被僵住了。\n如果不尽快采取行动，恩卡拉就会离开，而哈基姆圣裔的命运可能会永远改变。"
 POD_gehenna_omens.6667.a: "恩卡拉，请听我说。"
 POD_gehenna_omens.6667.effect.success.desc: "恩卡拉退缩了！"
 POD_gehenna_omens.6667.critical.failure.effect.desc: "宿命维持不变……"
 POD_gehenna_omens.6668.a: "只有武力才能阻止她。"
 POD_gehenna_omens.6668.effect.success.desc: "恩卡拉被痛打了一顿。"
 POD_gehenna_omens.6668.critical.failure.effect.desc: "宿命维持不变……"
 POD_gehenna_omens.6667.c: "陈腐的傻瓜和古老的预言并不重要。"
 POD_gehenna_omens.6669.t: "与诅咒共存"
 POD_gehenna_omens.6669.desc: "自从恩卡拉的愚蠢远征使哈基姆圣裔遭受巴力诅咒的全面影响以来，已经过去了十年之久。这段时间对$pod_clan$来说是一段艰难的时期，许多不幸的$pod_diablerie$事件玷污了它曾经的光辉声誉。不过，哈基姆的子嗣们还是一如既往地忍受着。\n诅咒可能永远不会真正消失，并在该族的文化中留下了恶毒的伤痕，但它现在已被接受为亡生的事实，每个哈基姆圣裔都在寻找自己的方式来应对这一障碍。\n哈基姆圣裔将永远不再一样，但他们仍然在这里学习和成长，正如先祖的意图。"
 POD_gehenna_omens.6669.a: "我们坚持住了。"
 POD_gehenna_omens.6669.a.tt: "哈基姆圣裔现在受到巴力诅咒的影响变得更轻。"
 POD_gehenna_omens.6669.b: "在信仰中寻找慰藉可以帮助我。"
 POD_gehenna_omens.6669.b.tt: "贾迈勒，正在教导其他哈基姆圣裔通过在神性中寻找慰藉来防范巴力诅咒，无论他们采取什么形式。你可以以他为榜样。"
 POD_gehenna_omens.6669.c: "阿姆鲁有一个有效的解决方案。"
 POD_gehenna_omens.6669.c.tt: "阿姆鲁阿什拉夫，开发了一种“伪吸榨”仪式，允许使用者沉溺于诅咒而不产生负面影响。这是一个困难的仪式，因此，只有少数人可以使用。"
 POD_gehenna_omens.6669.d: "还有一种可能性……"
 POD_gehenna_omens.6669.d.tt: "忒弥斯宣扬要拥抱诅咒。为什么要对抗它？如果有人软弱到足以让自己被吸榨，这意味着他们的灵魂作为你的食物可能比他们更有用。"
 setite_infighting_modifier: "内讧"
 setite_infighting_modifier_desc: "对赛特之子氏族对于异端运动的镇压适得其反，导致厄喀德那女巫和格利康战士都变得无法控制。"
 setite_infighting_glycon_modifier: "赛特之子战士的凯旋"
 setite_infighting_glycon_modifier_desc: "对赛特之子来说，内讧的夜晚已经结束，格利康已经改革成一个新的、更忠诚地赛特之子战士派系，而女巫们似乎已经永远消失了。"
 setite_infighting_echidna_modifier: "厄喀德那女巫的凯旋"
 setite_infighting_echidna_modifier_desc: "对赛特之子来说，内讧的夜晚已经结束，野蛮的格利康似乎已经永远消失了，而厄喀德那女巫已经重新完全融入了赛特密教中。"
 setite_faction_choice_tt: "该派别会记住你对其等的帮助。"
 POD_gehenna_omens.6670.t: "从圣甲虫到眼镜蛇"
 POD_gehenna_omens.6670.desc: "在（看似）彻底清除了厄喀德那女巫之后，赛特之子氏族内部各派别之间的内讧已经平息。然而，格利康的战士们设法从这场磨难中走出来，令人惊讶地比以前更强大，他们遏制了自己最糟糕的过度行为，将自己重新塑造成“赛特之子战士”。现在，他们被称为“眼镜蛇”，为氏族提供了忠诚的、常需的打手来源。\n每个人都需要一些时间来完全消化这个重要的变化，但由于这新建立的团结，赛特之子氏族现在更强大了。\n战士们没有忘记你在他们需要的时候提供的支持，作为回报，他们派出了一名密教成员来为你服务。"
 POD_gehenna_omens.6670.a: "女巫们实现了她们对自己的告死预言。"
 POD_gehenna_omens.6671.t: "巫术环绕"
 POD_gehenna_omens.6671.desc: "在（看似）彻底清除了格利康战士之后，赛特之子氏族内部各派别之间的内讧已经平息。然而，厄喀德那女巫们设法从这场磨难中走了出来，令人惊讶地比以前更强大，她们遏制了自己最糟糕的过度行为，将自己重新塑造成赛特的各种面相的女祭司。她们现在为氏族提供忠诚的、常需的文化意识来源，使赛特之子能够比以前更容易适应新信仰和国家。\n每个人都需要一些时间来完全消化这个重要的变化，但由于这新建立的团结，赛特之子氏族现在更强大了。\n女巫们没有忘记你在她们需要的时候提供的支持，作为回报，她们派出了一名密教成员来为你服务。"
 POD_gehenna_omens.6671.a: "战士们狂暴地冲往了自己的终点。"
 POD_gehenna_omens.6672.t: "蛇之清洗"
 POD_gehenna_omens.6672.desc: "在（看似）彻底清除了格利康战士和厄喀德那女巫之后，赛特之子氏族内部各派别之间的内讧已经平息。圣显者们最近宣布清洗结束，赛特之子氏族再次团结在其唯一的真正目的之下。一些人在悄悄地哀叹这两个重要派别曾经提供的武力和预言的损失。\n每个人都需要一些时间来完全消化这个重要的变化，但由于这新建立的团结，赛特之子氏族现在更强大了。"
 POD_gehenna_omens.6672.a: "战士和女巫一同在死亡相遇。"