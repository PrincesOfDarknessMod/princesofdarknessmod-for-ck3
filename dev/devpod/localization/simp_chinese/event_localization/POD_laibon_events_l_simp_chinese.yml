l_simp_chinese:
 pod_laibon.100.t: "凡俗请愿者"
 pod_laibon.100.desc: "你领地中的一位凡人请求觐见。其所带来之事并无轻易解答，一桩两家族间的土地边界纠纷，一项对医者的巫术指控，以及一则请求通过诉诸诸灵来干预旱灾的恳求。依古老之道，莱本远不止是一位统治者——其为联结族群与其命运所系之力之间的活桥梁。这位凡人不知您究你为何物，只知您的裁你承载着寻常长者无法企及的分量。将其拒之门外，便是让人间尘世自您掌中你滑落几分。"
 pod_laibon.100.a: "亲自裁决争端。"
 pod_laibon.100.a.success: "你的判断明智而公正。凡人们对此印象深刻。"
 pod_laibon.100.a.failure: "你的判断有失偏颇。凡人们感到失望。"
 pod_laibon.100.b: "将职责委托给一位凡人顾问。"
 pod_laibon.100.c: "你有更要紧的事处理。把他们打发走吧。"
 pod_laibon.101.t: "风中的声音"
 pod_laibon.101.desc: "In the hours before dawn, you hear something, not with your ears, but deeper. A voice that might be an ancestor, a spirit of the land, or your own [Glossary('Beast','game_concept_beast_desc')] speaking in tongues you almost understand. It offers a fragment of knowledge, but demands your attention. The Laibon have always walked between the world of the living and the world of spirits - these voices are neither hallucination nor blessing, but something older than either category. Your elders warned that a Laibon who ignores the voices of Orun does so at their peril, but one who follows every whisper into the dark rarely returns whole."
 pod_laibon.101.a: "倾听并跟随那声音，进入隐居之处。"
 pod_laibon.101.a.success: "声音可能会揭示邻国统治者隐藏的真相。"
 pod_laibon.101.a.failure: "声音引导你绕来绕去。你只带着不安归来。"
 pod_laibon.101.b: "明白你的声音，但留在原地。"
 pod_laibon.101.c: "把它屏蔽掉。灵界里满是骗子和谎话精。"
 pod_laibon.102.t: "汇聚之火"
 pod_laibon.102.desc: "You host a gathering of local Laibon, not a formal Gathering of the Legacies, but an informal meeting around the fire. Stories are shared, disputes are aired, and the old rituals are observed. The goat is sacrificed, the blood shared, the ancestors invoked. These small gatherings are the lifeblood of Laibon society - a reminder that the undead are still bound by the obligations of the living community they once belonged to. Bonds forged at the fire are often stronger than those sworn at formal Gatherings, and debts remembered in the smoke of an offering rarely go unpaid."
 pod_laibon.102.a: "亲自主持仪式，同时致敬生者与逝者。"
 pod_laibon.102.b: "将集会焦点放在政治事务上。"
 pod_laibon.102.c: "将集会聚焦于灵性交流。"
 pod_laibon.103.t: "凡俗后裔"
 pod_laibon.103.desc: "一名凡人出现在你的领地，其容貌与你在世时所认识的某人极为相似，是你凡俗家族的后裔，流淌着数百年前曾属于你的血脉。他们不知晓你的真实身份，但眼中却有一丝认出的神情。这是莱本能体验到的最令人迷失的感觉之一——看到你自己的举止、你自己的笑声、同样侧耳倾听的头部倾斜，却寄居在一具仍会呼吸、仍在衰老的身体中。先祖们说，这样的相遇绝非巧合。血脉中传承着某种未了之事，静候时机，等待被了结。"
 pod_laibon.103.a: "在暗影中守护他们，确保他们繁荣昌盛。"
 pod_laibon.103.b: "初拥他们。其血脉源自你，理应获得永生礼物。"
 pod_laibon.103.a.success: "凡人将被带到你的王庭，为初拥做准备。"
 pod_laibon.103.a.message: "后裔已至"
 pod_laibon.103.c: "其并不涉及你。"
 pod_laibon.104.t: "灵兽"
 pod_laibon.104.desc: "一道灵显现在你的庇护所附近，并非幽灵，而是更为古老之物。它化作巨兽之形：狮子、蛇、蜘蛛、鹰。它以穿透血肉的目光注视着你。它有所求。兽灵是天界最古老的使者——它们先于老祖存在，甚至先于第一位莱本，且不诉诸言语。亲自寻你而来的灵，绝非你可置之不理之事。无论它想要什么，它主动找上你而非等待召唤，这便意味着协商已然开始。"
 pod_laibon.104.a: "走近它，献上鲜血。"
 pod_laibon.104.a.success: "灵接受了你的供奉。它的祝福如盔甲般笼罩着你。"
 pod_laibon.104.a.failure: "灵强烈拒绝了你的献祭。"
 pod_laibon.104.b: "远远观察，学习其威仪。"
 pod_laibon.104.c: "驱逐它。要求血祭的诸灵，不能信任它们靠近你的领地。"
 pod_laibon.105.t: "丰收"
 pod_laibon.105.desc: "你领地内的凡人们度过了丰饶的一季。收成富足，商路畅通，孩童健康。你的治理，虽间接，却让掠食者远离。社群繁荣昌盛。莱本比任何人都更明白，繁盛的凡人乃万物之基——他们是鲜血之源，是艾之源，是连接生者世界的纽带，将你与那些在奥伦中漂泊、无所依托的空洞亡魂区分开来。今夜鼓声响起，火光通明。你已将职责尽得完美。"
 pod_laibon.105.a: "在庆典期间走过他们中间。到场即可。"
 pod_laibon.105.b: "拿走你那份吧，从盈余中抽取更多的什一税。"
 pod_laibon.105.c: "拿你所需吧，剩下的便是更多可供汲取的凡人，无需承担后果。"
 pod_laibon.106.t: "十字路口之灵"
 pod_laibon.106.desc: "午夜时分，你来到一处十字路口，这里是道路交汇之处，也是艾与奥伦之间界限变薄之地。有人在此留下了供品——一个陶罐、一束羽毛、一尊雕刻人像。这是为你准备的，或者说是为像你这样的存在准备的。十字路口向来是临界之所——对诸灵神圣，对粗心者危险，对于那些本就游走于世界边界之间的存在，则格外具有吸引力。这份供品表明，有人知道你途经此地。至于他们是想赠你一份灵赋、提出一场交易，还是想分散你对他们在附近所做之事的注意力，那就完全是另一回事了。"
 pod_laibon.106.a: "在十字路口留下自己的祭品并冥想。"
 pod_laibon.106.b: "收下这份献礼。力量就在眼前，唾手可得。"
 pod_laibon.106.c: "接下供品，但不要逗留——十字路口会引来比先祖诸灵更可怕的东西。"
 pod_laibon.107.t: "卡根之梦"
 pod_laibon.107.desc: "你做梦了，吸血鬼很少做梦。梦中，你看到一个身影，或许是卡根，第一位莱本，又或许是你自己的[Glossary('心兽','game_concept_beast_desc')]戴着卡根的面孔。他用一种比你已知的任何语言都要古老的语言说话，但你却听得懂。他向你展示了一个幻象。据说卡根是第一个发现艾与奥伦之间平衡的人，并为那知识付出了巨大代价。他究竟是真正的老祖，一个精神构造体，还是鲜血用来解释自身本质的神话，这一点，最年长的莱本们争论了数个世纪也未得定论。但他们无人争议的是，梦见卡根，意味着某种变化即将来临。"
 pod_laibon.107.a: "幻象中显现出凡俗之界，你的疆域本可如此繁荣昌盛，且受庇佑。"
 pod_laibon.107.b: "幻象显现出灵界；广袤无垠，光芒万丈，呼唤着你。"
 pod_laibon.107.c: "质问那个身影。这真的是卡根吗，还是有什么东西披着他的脸皮？"
 pod_laibon.107.c.success: "这身影微笑。它既是，又非。理解涌遍你全身。"
 pod_laibon.107.c.failure: "那人的笑容变得冰冷。你冒犯了某种你无法理解的东西。"
 pod_laibon.108.t: "潜藏破漏"
 pod_laibon.108.desc: "你与灵界的联系日益显现。在你的领地中，一位凡人——无论是祭司还是智者——已察觉到某些异样。他们尚未道破其名，但流言已悄然蔓延。秘密正面临泄露之虞。对于莱本而言，潜藏避世远比那些完全隐匿的血族更为复杂——莱本被期望成为精神权威的象征，这意味着某种超自然特质早已被视为理所当然。然而，受人敬仰的灵术师与被识别为不死者之一之间有一条界限，而你的领地中有人刚刚越过了这条界限。"
 pod_laibon.108.a: "直接处理那个凡人。用支配术控制他们，或是让他们闭嘴。"
 pod_laibon.108.a.success: "凡人遗忘，低语消逝。"
 pod_laibon.108.a.failure: "你未能控制住局面。谣言四起。"
 pod_laibon.108.b: "暂时退出凡俗事务，让谣言平息。"
 pod_laibon.108.c: "顺其自然。让其以为你是先祖之灵。"
 pod_laibon.109.t: "先祖之墓"
 pod_laibon.109.desc: "你发现或记起了先人安息之地。那座坟墓年久失修，草木丛生，或许已被生者遗忘。但那里的诸灵并未离去。对莱本而言，逝者不会消失——他们存于奥伦，存于大地本身，存于那些不知情却承载着他们的后裔血脉之中。一座被遗忘的坟墓，是族群记忆中一道创伤，而被忽视的亡者之灵会变得不眠，令所有人的生存愈发艰难。你亏欠这些人一些东西。至于是否偿还这笔债，那就是另一回事了。"
 pod_laibon.109.a: "修复坟墓，并举行古老的仪式。"
 pod_laibon.109.b: "与诸灵交流，但让坟墓保持原样。"
 pod_laibon.109.c: "坟墓坐落于宝贵之地。清除它，建造些有用的东西吧。"
 pod_laibon.200.t: "王冠之重"
 pod_laibon.200.desc: "你手下的封臣之间的争端，眼看就要蔓延到凡俗世界——交战的莱本们漫不经心地大肆汲取，扰乱商路，吓坏那些供养这片领地的凡人。身为古鲁希，这是你的责任。这片土地由你来守护。古鲁希并非仅凭征服而称王——他们之所以为王者，是因为他们与这片土地和耕作其上的人民立下了盟约。当土地受苦时，应为此负责的是古鲁希：向凡人、向其他传承、向在奥伦之上凝视的祖辈们交代。你并未求取这顶王冠。但你仍要戴上它。"
 pod_laibon.200.a: "亲自介入，恢复莱本与凡人双方的秩序。"
 pod_laibon.200.b: "只处理莱本的争端。凡人的事，他们自会解决。"
 pod_laibon.201.t: "内心深处的黑暗"
 pod_laibon.201.desc: "你避难所中的阴影自行蠕动——延伸、抓挠、低语。它们并非真正活着，却也不空洞。黑暗是通往奥伦的门扉，对你而言永远敞开。其他操控黑暗的血族将其视为武器——恐惧与隐匿的工具。而你深知不同。阴影并非虚空，而是界域之间的实质，你用它们塑造之物，触及那存在于迷障两侧的存在。今夜它们比往常更为活跃。有什么东西从另一侧紧贴门扉而来。"
 pod_laibon.201.a: "步入黑暗，让它为你揭示彼方之境。"
 pod_laibon.201.b: "掌控阴影，但不要进入其中。保持你的距离。"
 pod_laibon.202.t: "心兽的建言"
 pod_laibon.202.desc: "你的[Glossary('心兽','game_concept_beast_desc')]在蠢动，并非出于饥渴或暴怒，而是在谈话中。它通过动物的感官向你展示一些东西：角马的迁徙模式，豹子的领地标记，象群的社交纽带。这里有一个教训，如果你能解读它。莱本不像欧洲血族那样谈论[Glossary('心兽','game_concept_beast_desc')]——不是将其视为需要囚禁的恶魔，而是一个更古老的自我，是你的一部分，它记住了人类建造第一城时所遗忘的东西。这种理解究竟是智慧，还是血液讲述的一个方便谎言，为了让你对自己的本质感到舒适，这是每个莱本最终必须自己回答的问题。"
 pod_laibon.202.a: "倾听心兽的呼唤，从动物世界中汲取智慧。"
 pod_laibon.202.b: "运用心兽的洞察力获取实际优势。"
 pod_laibon.203.t: "狂怒之诉求"
 pod_laibon.203.desc: "你的怒火翻涌，那熟悉的火焰定义了你的传承。但怒火若无方向则无形无状。今夜，是什么驱使着你？莱本的战士传承始终明白，愤怒与行动的冲动既是诅咒也是馈赠——但布鲁赫为哲学而战，而莱本战士所战之物更为古老而直接：保护、正义、荣誉，皆借行动成形。即便如此，正义之怒与[Glossary('心兽','game_concept_beast_desc')]对暴力的单纯饥渴之间的界线，今夜比昨日更为模糊。务必确定你站在哪一边。"
 pod_laibon.203.a: "为我的子民而战。我所庇护的凡人正受到威胁。"
 pod_laibon.203.b: "为荣誉而战。我祖辈的战士之灵苛求卓越。"
 pod_laibon.203.c: "彻底臣服于怒火，毫无保留。"
 pod_laibon.204.t: "风暴法官的困境"
 pod_laibon.204.desc: "有一桩案件呈至你面前——一位莱本被指控照料不周，危及秘辛。证据模糊不清。控告者权势滔天。被告坚称清白。作为尚戈，你的判决承载着风暴之力。尚戈乃莱本之仲裁者，此职非天赐，而是历经数百年调停纷争所得，那些纷争无人能解而不引战火。尚戈宣判之时，其言承载着每一位在你之前立于此位的老祖之威权。然此威权，若你不慎用之，则一文不值。"
 pod_laibon.204.a: "召请先祖，让诸灵指引我的判断。"
 pod_laibon.204.a.success: "先祖们说得明明白白。正义得到了伸张。"
 pod_laibon.204.a.failure: "先祖们沉默不语，你的判断力开始动摇。"
 pod_laibon.204.b: "仅凭证据和证词来裁决。这便是凡人之道。"
 pod_laibon.205.t: "恶习蔓延"
 pod_laibon.205.desc: "你的恶习在召唤。凡俗世界正提供着它的欢愉——一场庆典、一处市集、一场美丽而自愿的凡人聚会。你的身体渴望纵情享乐。这既是与生者世界的联系，也是可能将其切断的东西。伊什塔尔血族向来懂得那些更为禁欲的血族拒绝承认的一点：欢愉并非软弱，而是牵绊。一个对凡人乐趣毫无所感的吸血鬼，早已开始飘向诸世界之间的虚空之地。但带着觉知去纵情与沉溺于欲望之间是有区别的，而今夜，这条界限感觉十分模糊。"
 pod_laibon.205.a: "谨慎纵情，享受凡尘之乐而不毁其真。"
 pod_laibon.205.a.success: "你在放纵与克制之间行走。凡人们毫无察觉。"
 pod_laibon.205.a.failure: "你贪得无厌，众人会铭记于心。"
 pod_laibon.205.b: "将饥渴导入灵界，转而寻求超自然的愉悦。"
 pod_laibon.206.t: "修复者的十字路口"
 pod_laibon.206.desc: "你来到一个十字路口，无论是字面还是比喻意义上。一支凡人商队需要保护，免受强盗侵扰。一位莱本长者需要从神圣树林中取回一件灵符。两者皆有厚利可图，但时间只允许你选择其一。拉曼加人一直占据着这两个世界之间的空间——他们是谈判者、中间人，深知凡俗世界与莱本世界并非如他人所假装的那般隔绝。每一次这样的选择，都是这两个世界之间的一笔小型交易，而你在两边世界的声誉，都取决于你如何应对。关键在于确保从每一方都获得应得的报酬。"
 pod_laibon.206.a: "保护商队。"
 pod_laibon.206.b: "取回灵符"
 pod_laibon.206.c: "安排一个交易，让商队护卫陪你去树林，一举解决两个问题。"
 pod_laibon.206.c.success: "你的巧舌如簧果然奏效。两件事都办妥了，两边的客户也都满意。"
 pod_laibon.206.c.failure: "交易破裂。你两边都只争取到一点残羹，却谁也没能完全满意。"
 pod_laibon.207.t: "大地记得一切"
 pod_laibon.207.desc: "During your burial rest, the earth speaks. Not in words, in sensation. The weight of stone, the movement of roots, the slow pulse of things that were old when humanity was young. The deep Orun presses against your consciousness. The Nagloper have always held that the oldest part of the spirit world is not found in the sky or on the horizon, but beneath the feet - where the dead return to the earth and the earth absorbs everything that was ever alive. Most Laibon sleep above the ground, close to the world they know. You sleep below it, which means you hear things they do not."
 pod_laibon.207.a: "向大地深处敞开自己。"
 pod_laibon.207.b: "抵抗。你是吸血鬼，不是树根。"
 pod_laibon.208.t: "邦卡齐的灵赋"
 pod_laibon.208.desc: "你的邦卡齐在黄昏时分来到你身边，一如往常。喂食是一种比你们两人都更为古老的仪式——生命被自由地献出，以维系死亡。但今夜，她在事后久久逗留。她有话要与你分享。邦卡齐是莱本所独有的——那些自愿将血液与吸血鬼相连的女性，她们定期供血，以换取保护、地位，以及置身于生者与死者之间世界边缘的一席之地。这种关系并非占有，不完全是。它是一项盟誓，存在于两个各自以自身方式选择活在人类生活常规界限之外的人之间。"
 pod_laibon.208.a: "听听她怎么说。用你所知的亡者之事，换取她所知的生者之秘。"
 pod_laibon.208.b: "照料她的需求。她年事已高，魔法消耗着她的精力。"
 pod_laibon.208.c: "请她帮忙通过联合仪式帮你联系某位特定的先祖。"
 pod_laibon.208.c.success: "联合仪式成功了。先祖的声音穿透了世界的界限。"
 pod_laibon.208.c.failure: "仪式闪烁不定，继而消散。先祖未予回应。"
 pod_laibon.209.t: "黎明前的黑暗"
 pod_laibon.209.desc: "The hunt is over. The forest is silent. In the stillness after the kill, something stirs in you that is not [Glossary('The Beast','game_concept_beast_desc')] - or perhaps it is [Glossary('The Beast','game_concept_beast_desc')] before it had a name. The primal darkness that made your founder shifts in your blood. It does not speak. It simply is - vast, patient, and older than the ancestors. The Bonsam do not discuss this openly, even among themselves. The Tenets of Laibon society were built on the understanding that Aye and Orun balance each other. What stirs in your blood predates that balance - a third thing that refuses to be categorized. Learning to live alongside it without being swallowed by it is the first and last lesson of your Legacy."
 pod_laibon.209.a: "沉入黑暗之中。让它向你展示世界诞生之前的存在。"
 pod_laibon.209.b: "向黑暗敞开自己，但一只手仍牢牢抓着这个世界。"
 pod_laibon.209.c: "拒绝它。改去狩猎。找一个凡人、一头心兽，或是什么真实的东西。"
 pod_laibon.210.t: "学者的困境"
 pod_laibon.210.desc: "A rumor reaches you - a mortal scholar in a distant city has acquired a collection of texts. Among them, possibly, is a fragment of something older: a record of the Laibon before the Tenets were written. Knowledge like this does not stay hidden for long. The dead whisper that you should go first. The Mla Watu were cast out of the old order for reasons that different Legacies explain differently, depending on who you ask - but what no one disputes is that you understand knowledge as power in ways others prefer to leave theoretical. If there is a record of who the Laibon were before the Tenets shaped them, you intend to read it before anyone else gets the chance to decide what it means."
 pod_laibon.210.a: "派遣一个被束缚死灵，赶在任何人之前窃取那些文本。"
 pod_laibon.210.b: "亲自前往学者之处，以同求知者的身份接近。"
 pod_laibon.210.b.success: "学者对你的博学印象深刻。一段合作关系就此诞生。"
 pod_laibon.210.b.failure: "学者看穿了你的伪装。你带着碎片离开，而非全部。"
 pod_laibon.210.c: "在学者的城市中唤醒死灵。向那些生前撰写经文的人提问。"
 pod_laibon.300.t: "行者的启示"
 pod_laibon.300.desc: "一切发生在一瞬之间，尽管你的心脏已不再跳动。两个世界在此交汇。你同时看见两者：月光下沉睡的凡人村落，以及其后闪烁的灵界村落，生者与死者行走在同一条道路上，仅隔着一层薄如呼吸的迷障。每个莱本都被告知这是可能的，但鲜有人能活到亲身站在此处并领悟其真谛。长者说，卡根本人曾站在这同一个十字路口，看见整个宇宙展现在他面前——既有光明也有黑暗，既有生者也有死者——并明白两者皆非虚幻。"
 pod_laibon.300.a: "两边你都有份。"
 pod_laibon.301.t: "空虚"
 pod_laibon.301.desc: "The silence is complete now. No whispers from the ancestors. No warmth from the living. You stand in a place that is neither Aye nor Orun - a void between the worlds where nothing grows and nothing dies. [Glossary('The Beast','game_concept_beast_desc')] watches you from across this emptiness, patient as stone. It has been waiting for this. The Laibon call this the Hollow - not a place, but a condition, the spiritual equivalent of a wound that does not close. Other Kindred fall to [Glossary('The Beast','game_concept_beast_desc')] through hunger and rage. The Laibon can fall through absence: simply letting both connections go dark until nothing remains but the predator wearing your face, waiting for permission to take over entirely."
 pod_laibon.301.a: "伸手触及艾。铭记生者；一张面孔，一个名字，一份未偿之债。"
 pod_laibon.301.a.success: "一段记忆浮现，温暖、鲜明、真实。活生生的世界将你拉回。"
 pod_laibon.301.a.failure: "记忆崩塌，再无依凭。心兽夺走残存的一切。"
 pod_laibon.301.b: "向往奥伦。呼唤先祖。恳求其回应。"
 pod_laibon.301.b.success: "彼端传来一个声音。先祖并未舍弃你。"
 pod_laibon.301.b.failure: "沉默。先祖们已转身离去。心兽步步逼近。"
 pod_laibon.301.c: "屈服吧。你太累了，无力再战。"
 pod_laibon.400.t: "两个世界"
 pod_laibon.400.desc.intro: "你沉入静寂，将意识转向内在，那里是血脉与灵交汇之处。每位莱本都行走于两界之间——#bold 艾#!，生者之界，与#bold 奥伦#!，诸灵与先祖之界。你的力量源自于你在两界间保持的平衡。\n\n"
 pod_laibon.400.desc.aye_tier3: "#bold 艾：#!你是#bold 艾之子#!-深深扎根于这鲜活世界。凡人在骨子里便能感受到你的威权。\n"
 pod_laibon.400.desc.aye_tier2: "#bold 艾：#!你与生者世界的联系#bold 紧密#!。你周围的凡人因你的效应而繁荣。\n"
 pod_laibon.400.desc.aye_tier1: "#bold 艾：#!你与生者世界的联系#bold 微薄#!。凡人能感受到些什么，却无法言明。\n"
 pod_laibon.400.desc.aye_none: "#bold 艾：#!你与生者世界的联系#bold 断绝#!。凡人们感受不到你的威仪术。\n"
 pod_laibon.400.desc.orun_tier3: "#bold 奥伦：#!你是#bold 奥伦之子#!-当你呼唤时，灵界会回应。先祖们与你同行。\n"
 pod_laibon.400.desc.orun_tier2: "#bold 奥伦：#!你与灵界的联系#bold 紧密#!。黎明前的时辰，先祖们低声给予指引。\n"
 pod_laibon.400.desc.orun_tier1: "#bold 奥伦：#!你与灵界的联系#bold 微薄#!。当你靠近时，先祖们会有所骚动。\n"
 pod_laibon.400.desc.orun_none: "#bold 奥伦：#!你与灵界的的联系#bold 断绝#!。先祖们沉默不语。\n"
 pod_laibon.400.desc.walker: "\n#bold 你是行走于两界之间的行者#!-你已精通艾与奥伦，屹立于存在本身的十字路口。"
 pod_laibon.400.desc.hollow: "\n#bold 你是虚空之影#!-与两个世界隔绝，在它们之间的虚空中漂泊。[Glossary('心兽','game_concept_beast_desc')]注视并等待着。"
 pod_laibon.400.a: "什么是“艾”——活生生的世界？"
 pod_laibon.400.b: "什么是“奥伦”——灵的世界？"
 pod_laibon.400.c: "这个平衡是如何运作的？"
 pod_laibon.400.d: "我明白了。"
 pod_laibon.401.t: "活生生的世界"
 pod_laibon.401.desc.intro: "#bold Aye#! is your connection to the mortal world; the land, the people, the living pulse of your domain. A Laibon strong in Aye rules not through fear alone, but through presence. Mortals obey because they feel the weight of your authority. The land itself recognizes you as its guardian.\n\nAs your Aye grows, you gain influence over mortal opinion, governance, and the stability of your domain. At its peak, you may Invoke the Authority of the Living; a power that commands obedience from mortals and Laibon alike.\n\n"
 pod_laibon.401.desc.tier3: "#bold 当前状态：#!你已达到艾最高层级-#bold 艾之子#!。现世由你主宰。"
 pod_laibon.401.desc.tier2: "#bold 当前状态：#!你的艾处于#bold 紧密#!状态-你在现世根深蒂固，但尚未达到巅峰。"
 pod_laibon.401.desc.tier1: "#bold 当前状态：#!你的艾是#bold 微薄#!-这是一个基础，但还有很大的成长空间。"
 pod_laibon.401.desc.none: "#bold 当前状态：#!你的艾是#bold 断绝#!。失去这一联系，你对凡人的效应将受到惩罚。"
 pod_laibon.401.desc.factors: "\n\n#bold What strengthens Aye:#!\n- Disciplines of Presence and Dominate\n- Maintaining a herd and engaging with mortal affairs\n- Aye-favoring legacies (Guruhi, Ishtarri) and faith paths\n- Events that connect you to the mortal world\n\n#bold What weakens Aye:#!\n- Frenzy and loss of control\n- Killing or draining mortals recklessly\n- Natural decay over time - Aye must be actively maintained"
 pod_laibon.401.a: "请告诉我更多关于这两个世界的信息。"
 pod_laibon.401.b: "我已经看够了。"
 pod_laibon.402.t: "灵界"
 pod_laibon.402.desc.intro: "#bold Orun#! is your connection to the world beyond the veil; the realm of ancestors, spirits, and the dead. A Laibon strong in Orun walks with the unseen. The ancestors share their secrets, the spirits lend their strength, and the boundary between life and death thins to nothing.\n\nAs your Orun grows, you gain prowess, dread, and resistance to hostile schemes. At its peak, you may Commune with the Ancestors - a ritual that tears secrets from the spirit world and wraps you in the strength of the dead.\n\n"
 pod_laibon.402.desc.tier3: "#bold 当前状态：#!你已经达到了奥伦最高层级-#bold 奥伦之子#!。灵界回应着你的召唤。"
 pod_laibon.402.desc.tier2: "#bold 当前状态：#!你的奥伦#bold 紧密#!-先祖的指引清晰可闻，但最深的奥秘仍笼罩在迷雾之中。"
 pod_laibon.402.desc.tier1: "#bold 当前状态：#!你的奥伦是#bold 微薄#!-诸灵微动，但其声难闻"
 pod_laibon.402.desc.none: "#bold 当前状态：#!你的奥伦是#bold 断绝#!。失去这种连接，你会变得脆弱而弱小。"
 pod_laibon.402.desc.factors: "\n\n#bold What strengthens Orun:#!\n- Disciplines of Obtenebration and Necromancy\n- Feeding on vampires and blood bonding\n- Orun-favoring legacies (Ramanga, Nagloper, Bonsam, Impundulu, Mla Watu) and faith paths\n- Events that connect you to the spirit world\n\n#bold What weakens Orun:#!\n- Natural decay over time. Orun must be actively maintained\n- Neglecting the spirit world in favor of mortal concerns"
 pod_laibon.403.t: "平衡"
 pod_laibon.403.desc.intro: "The Aye/Orun system tracks your spiritual standing across two axes. Each ranges from empty to full, with thresholds at three tiers. Your legacy, your faith, your disciplines, and your choices all shape where you stand.\n\n"
 pod_laibon.403.desc.decay: "#bold Yearly Decay:#! Both Aye and Orun erode naturally over time. The higher your tier, the faster it decays. You must actively nurture your connections or risk losing them. If both axes fall below the first threshold, you become #bold the Hollow#! - severed from both worlds, suffering severe penalties until you claw your way back.\n\n"
 pod_laibon.403.desc.affinity: "#bold Legacy & Faith:#! Your Laibon legacy (clan) and faith path each nudge your balance. Aye-favoring legacies like the Guruhi and Ishtarri naturally pull you toward the living world. Orun-favoring legacies like the Ramanga and Nagloper pull you toward the spirits. Balanced legacies like the Osebo and Akunanse leave the choice to you. Your faith path works similarly - choose one that aligns with your desired path, or one that counterbalances your legacy.\n\n"
 pod_laibon.403.desc.special: "#bold Mastery:#! If you reach the highest tier in both Aye and Orun simultaneously, you become a #bold Walker Between Worlds#! - a rare state of spiritual harmony that grants insight, calm, and the respect of your peers.\n\n#bold Tier 3 Abilities:#! Reaching the highest tier in either axis unlocks a powerful decision. Child of Aye may Invoke the Authority of the Living for a surge of mortal influence. Child of Orun may Commune with the Ancestors to tear secrets from the spirit world.\n\n#bold Disciplines:#! Presence and Dominate passively strengthen Aye. Obtenebration and Necromancy passively strengthen Orun.\n\n#bold Feeding & Frenzy:#! Maintaining a herd strengthens Aye. Feeding on vampires or blood bonding strengthens Orun. Killing or draining mortals weakens Aye. Falling to frenzy shifts you toward Orun."