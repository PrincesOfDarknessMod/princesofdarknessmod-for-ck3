l_simp_chinese:
 POD_skuldfulfilled.001.t: "化凡"
 POD_skuldfulfilled.001.desc: "你试图从某卑微的非$pod_cainite$身上夺走永恒的血之力，让[defender.GetHerHim]再一次成为一个凡人。如[defender.GetSheHe]已经够老了，有可能你的行为会杀死[defender.GetHerHim]"
 POD_skuldfulfilled.001.option.a: "[defender.GetSheHe|U]配不上这等的力量！"
 POD_skuldfulfilled.001.option.a.tt: "你将取走[defender.GetHerHis]的血之力"
 POD_skuldfulfilled.option.001.a.desc: "你将使用你对湮灭术的神秘了解"
 POD_skuldfulfilled.001.option.success: "[defender.GetFirstName]成为了一个普通的人类"
 POD_skuldfulfilled.001.option.a.tt.attacker_wins: "你成功了"
 POD_skuldfulfilled.001.option.failure: "你的学识还不够"
 POD_skuldfulfilled.001.option.a.tt.attacker_lost: "[defender.GetFirstName]抵抗住了"
 POD_skuldfulfilled.001.option.b: "还不是时候……"
 POD_skuldfulfilled.001.option.b.tt: "你放弃了从[defender.GetFirstName]那里偷取血之力的尝试。"
 POD_skuldfulfilled.002.t: "化凡"
 POD_skuldfulfilled.002.desc: "有人使用了湮灭的黑暗力量从[defender.GetFirstName]偷走了你的血之力！现在[defender.GetSheHe]与你不再受于你的血缚了……"
 POD_skuldfulfilled.002.option.a: "我应该做点什么"
 POD_skuldfulfilled.002.option.a.tt: "[defender.GetFirstName]不再是你的血奴"