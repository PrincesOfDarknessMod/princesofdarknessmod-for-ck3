l_simp_chinese:
 POD_age.1.t: "完美纪元"
 POD_age.1.desc: "[kuei_jin|E]称此时代为万物轮回的第二纪元，亦称完美纪元。彼时，中原国度灵魂王廷仍紧密相连。此纪元标志着阴阳两界自中原国度的分离，而中原国度本兼具二者之元素。此纪元亦为万物轮回之始。\n在此纪元中，玄龙与朱后诞生，其互动与对立推动了轮回之转动，使物质与灵质凝聚成形。不久后，玄龙与朱后学会呼吸，其呼吸间，物质与灵质的万物渐具形态。龙息所至，阴之灵与阴属性显现；后息所至，阳之灵与阳属性成形。很快，物质与灵质的世界便因呼吸而存。\n神明与龙行于年轻而生机勃勃的世界，天界为其在魂王廷中分派职责与位阶。\n然而，随着天界生灵趋近其特定界域，部分存在逃过了玄龙与朱后的注视与教导。此辈因缺乏正导，怠忽职守，未顺天意。某些生灵彼此对立，另一些则将阴阳失衡结合。贪婪吞噬气的恶魔与怪物亦由此而生。"
 POD_age.1.a: "新生纪元"
 POD_age.2.t: "传奇纪元"
 POD_age.2.desc: "[kuei_jin|E]、仙灵与兽妖称第三纪元为万物轮回的传奇纪元，乃中原国度神话史前时代。彼时$pod_wan_xian$，如慈主行走人间，统御凡民。其为不朽帝君、弑魔之神，导人前行。奉玄龙、朱后与玉皇大帝之命，万仙涤荡[Glossary('阎魔','podgloss.yamaking')]仆从。灵魔不驯者，逐出中原并报其主；人君违天道者，万仙正之。待功成智满，万仙登天为神，玄龙与朱后则择新万仙继任。"
 POD_age.2.a: "英雄时代"
 POD_age.2.tt: "纪元效果：\n$BULLET_WITH_TAB$所有[akuma|E]获得：[GetModifier('akuma_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$所有[Glossary('阎魔','podgloss.yamaking')]获得：[GetModifier('yama_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$所有$POD_splat_kueijin$获得：[GetModifier('godbodies_modifier').GetNameWithTooltip]"
 POD_age.3.t: "凄美纪元"
 POD_age.3.desc: "[kuei_jin|E]称此纪元为万物轮回的凄美纪元，标志着[kuei_jin|E]诅咒之始——从天庭战士堕落为幽冥魔物。玉帝弃中原、魂王廷与万物轮回于不顾。[Glossary('阎魔','podgloss.yamaking')]及其爪牙重渗中原。兽妖因$pod_wan_xian$暴行狂怒，屠戮愚随仙主的凡人。玄龙朱后愧对逆子，亦转身离去——却仍将[Glossary('心法','podgloss.dharma')]奥秘藏于云雨风血，待他日万仙赎罪重归轮回。\n\n此纪元始启人类历史，鬼人畏光之疾亦源于此时（尤指周朝）。学者考据，第四纪元约始于公元前900年，终于公元1250-1349年（依[kuei_jin|E]纪年）。"
 POD_age.3.a: "凄美纪元"
 POD_age.3.tt: "纪元效果：\n$BULLET_WITH_TAB$所有$POD_splat_kueijin$获得：[GetModifier('godbodies_modifier').GetNameWithTooltip]"
 POD_age.4.t: "黑暗纪元"
 POD_age.4.desc: "于[kuei_jin|E]而言，第五纪元乃万物轮回的黑暗纪元。受魄所驱而癫狂，被迫借尸还魂窃取生气，多数[kuei_jin|E]苟活之惨状不逊该隐子嗣。实则饿殍更苦，因其个体挣扎之上更负滔天罪孽。\n[kuei_jin|E]今需抉择：匡正万物轮回、孤注逃离，抑或沦為魔物。此决须速。"
 POD_age.4.a: "抗争纪元"
 POD_age.4.tt: "纪元效果：\n$BULLET_WITH_TAB$所有[akuma|E]获得：[GetModifier('akuma_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$所有[Glossary('阎魔','podgloss.yamaking')]获得：[GetModifier('yama_buff_modifier').GetNameWithTooltip]"
 POD_age.5.t: "哀伤纪元"
 POD_age.5.desc: "[kuei_jin|E]称第六纪元为哀伤纪元。此乃轮回之渊，[Glossary('玉帝','podgloss.augustpersonageofjade')]退位，[Glossary('阎魔','podgloss.yamaking')]之一将登基为魔皇。众鬼人信此纪元将启末世，[Glossary('阎魔','podgloss.yamaking')]临世统御万邦。哀伤纪元时长未卜，然众皆信其迫在眉睫且血火交织。然多数[kuei_jin|E]视此为轮回重启前必经之劫，终将复归桃源。"
 POD_age.5.a: "终结，亦是开端"
 POD_age.5.tt: "纪元效果：\n$BULLET_WITH_TAB$所有[akuma|E]获得：[GetModifier('akuma_huge_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$所有[Glossary('阎魔','podgloss.yamaking')]获得：[GetModifier('yama_huge_buff_modifier').GetNameWithTooltip]\n"