 POD_predatorstories_auspexadvanced.1402.t: "受害者是个斯珞俄"
 POD_predatorstories.1402.desc: "你已经找到了一位合适的候选者。"
 POD_predatorstories_auspexadvanced.1402.desc: "你敏锐的观察力让你能够判断出你选择的猎物其实是[GetTrait('sluagh').GetName( GetNullCharacter )]，而不是[GetTrait('vampire').GetName( GetNullCharacter )]。\n\n[GetTrait('sluagh').GetName( GetNullCharacter )]可能会尽量避免冲突，并察觉到看不见的东西。\n\n你知道以妖精为食很可能会产生一些不利影响。"
